    \ HTML 属性的 `name=value` 对，而不是 `props`。不过，事实就是如此。`React.js` 的开发者们选择了这种命名约定！别怪信者\
    \ :)\n\n如果你一直在关注我们上一章节的讨论，你现在应该知道什么是组件（components）了。它们是 HTML、CSS 和 JavaScript\
    \ 代码块的组合，决定了应用程序中某个视觉区域的功能。它们负责更新如消息流、报警和各种状态更新的内容。\n\n我们还知道组件通常有一个 `render` 方法来在应用中显示它。\n\
    \n在学习 `React.js` 时，你将遇到的下一个东西就是 `props`。`Props` 就像函数参数。只不过你将它们传递给组件，而不是函数。然而，其原理是相同的。\n\
    \n让我们创建一个组件并向它传递一个 prop。\n\n```javascript\n// 创建一个 Hello 组件\nvar Hello = React.createClass({\n\
    \  render: function() {\n    return (\n      <DIV>Hello, {this.props.name}</DIV>\n\
    \    )\n  }\n});\n\n// 现在调用 \"render\" 方法在 #app 中显示此组件\nReactDOM.render(<Hello\
    \ name = \"Jason\"/>, document.getElementById(\"app\"));\n```\n\n在这里，我添加了一个名为\
    \ `name` 的 prop 并给它赋值为 `\"Jason\"`。请注意它被包含在一个自闭合标签 `<Hello />` 中。\n\n在组件内部，我们可以通过\
    \ `this.props.name` 引用它来打印值，而不是使用上一个教程中通用的 \"Hello World\" 示例。\n\n## 函数组件 (Functional\
    \ Components)\n\n上面我们演示了一个标准的 React 组件。它包含了所有的复杂性：它是使用 `createClass` 函数创建的，并包含一个\
    \ `render` 方法。但下面的代码实际上也被认为是有效的 React 组件，尽管它仅仅是一个标准的 JavaScript 函数：\n\n```javascript\n\
    function Hello(props) {\n  return <H1>Hello, { props.name }</H1>;\n}\n```\n\n\
    让它成为有效 React 组件的原因是它返回了一个 React 元素。`React` 元素可以在屏幕上渲染。你的很多响应式代码将返回此类语句。这只是将 HTML\
    \ 元素打包并将它们作为普通的 JavaScript 值返回的一种方法。\n\n这是 React 风格编程的重要组成部分，一旦你亲自编写过几个，就很容易习惯。起初你会觉得很别扭，但一旦你习惯了，你就会真正看到这种编程风格的灵活性。\n\
    \n记住在 JavaScript 中一切皆为对象，甚至函数也是如此。这就是为什么这样的组件被称为函数组件。在某种意义上，这真的只是思考 JavaScript\
    \ 函数的另一种方式。\n\n这是使用 `EcmaScript5` 规范定义 React 组件的有效方法，而不是像上面的示例那样使用 `ES6`。然而，从编写响应式应用的角度来看，这两者是等价的。\n\
    \n作为程序员，了解 `ES5` 和 `ES6` 之间的区别是你的责任，这本身可以写一整本书来专门论证。然而，在本书的整个教程中，我会尝试利用每一个机会来解释两者之间的差异。\n\
    \n此外，让我们来看一段代码，它实现了定义组件完全相同，只是这次使用了 `EcmaScript6` 规范的语法：\n\n```javascript\nclass\
    \ Hello extends React.Component {\n  render() {\n    render <H1>Hello, { this.props.name\
    \ }</H1>\n  }\n}\n```\n\n注意我们使用了 `ES6` 类关键字 `class`。我们还使用新的 `new` 关键字 `extend`\
    \ 从标准的 `React.Component` 派导出此对象，后者是 `React` 库本身提供的默认组件对象。\n\n## 披羊皮狼 (A Wolf in\
    \ Sheep's Clothing)\n\n如果你知道类继承是如何工作的，那么这就是在 JavaScript 中模仿这种机制的方式。我说是“模仿”，是因为在面纱之下，JavaScript\
    \ 仍然使用基于原型的继承。这既可能是幸运，也是诅咒。\n\n与 `C++` 或 `Java` 等更成熟的语言相比，JavaScript 定义的继承标准并不是真正的。换句话说，由于\
    \ JavaScript 的松散类型系统，你可以忘记在 JavaScript 中创建诸如“接口”（interfaces）等高级对象结构。\n\n严格的编程语言通常更擅长提供功能完整的面向对象编程环境。在这里，`EcmaScript`\
    \ 的开发者们稍微装饰了一下 JavaScript 语法，让狼看起来更像了一只羊。\n\n但大多数程序员都认为这种语法改进了 JavaScript 的编程。至少在视觉上是这样。\n\
    \n这种方式创建组件的另一个主要区别是通过 `this` 关键字变量访问 `props.name` 属性。否则，它的作用法与上一个示例中的函数组件完全相同。\n\
    \n## 原生 Babel 与 JavaScript Babel (Native Babel vs JavaScript Babel)\n\n我尝试在之前的章节中微妙地提到这一点。但在我们继续之前，它值得一个简短的解释。我不希望你在被欺骗的情况下看到\
    \ `babel` 在工作，却不知道它可能没有为真实的生产环境进行正确配置。\n\n最好的方法是将 `babel` 作为独立应用程序在后台运行，作为你开发环境的一部分。这通常随\
    \ `Node` 安装提供。只需从 Google 下载 `Node` 并一直点击“Next”按钮完成安装即可。\n\n通过 `SCRIPT` 标签直接添加\
    \ `babel` 是可能的，并且适用于测试。但由于 `babel` 的 JavaScript 库运行速度较慢，建议安装可以在命令行运行的原生版本。JavaScript\
    \ `babel` 库在处理此类内容时非常慢，并且违背了 React 编程的初衷，而其唯一目的之一就是为了优化应用的速度。\n\n## NPM\n\n命令行\
    \ `babel` 应用随 `Node.js` 安装一起提供。因此，如果你安装了 `Node`，你将自动拥有 `babel` 包。你只需要在命令行中使用 `NPM`\
    \ 工具单独安装它们，该工具默认也随 `Node` 一起提供。\n\n在学习 `React.js` 时，通过 `SCRIPT` 标签简单添加 `babel`\
    \ 是完全正常的。只是当你的应用上线时，它对生产环境来说不够快。无论如何，所有 `babel` 所做的只是将你的 `EcmaScript6` 和 `JSX`\
    \ 代码“转译”回 `EcmaScript5`，这样你就可以在任何尚未完全支持 `ES6` 的浏览器中运行它。（截至本文写作，还没有浏览器支持。）\n\n\
    ## 源码转译 (Transpiling Source Code)\n\n你可能在论坛、Twitter 和 Reddit 上看到程序员使用“转译”（transpiling）这个词，但可能完全理解其背后的原理。\n\
    \n通常，转译是将一种语言的代码编译为另一种语言的源代码的过程。它只是在语言之间进行编译。然而，当涉及到 JavaScript 时，我们是在两个不同的 `EcmaScript`\
    \ 规范（5 和 6）之间进行转译。\n\n这使我们能够使用 `EcmaScript 6` 写代码，并将其转译为 `EcmaScript 5`，以便现代浏览器能够运行你的代码。在写作期间，大多数浏览器都不支持\
    \ `ES6`，甚至 Chrome 还没有。\n\n最终，当 `ES6` 支持普及所有浏览器后，就可以安全地停止使用 `babel` 来进行 `EcmaScript`\
    \ 规范之间的转译了。只需在标准的 JavaScript 文件中编写代码，它就能直接运行。\n\n但在那之前，我们不妨利用这个机会学习一种有趣的源码工具。总会有新的标准出世，转译的艺术可能在短期内不会消失。\n\
    \n"
- fmt: "\nIn this chapter I wanted to introduce you to basic principles of React programming\
    \ that go beyond creation of components alone. Here, I mentioned them briefly\
    \ in the context of our discussion on components and props. As we move forward,\
    \ we'll keep going deeper into the principles of reactive programming. This time\
    \ around, already having brief familiarity with these principles, it will help\
    \ us advance forward to writing practical React applications.\n\n# Lesson 2 -\
    \ Nested Components\n\nNested components in React.js help you create more complex\
    \ view element structures. I have previously talked about creation of React components.\
    \ And just as a reminder, here is how you would go about creating one.\n\n```javascript\n\
    var Component = React.createClass({ render: function(){\n    return (\n      \
    \  <Something></Something>\n    )}});\n```\n\nThis is just a basic component that\
    \ returns a set of `<Something>` HTML tags. I know, you're probably still getting\
    \ used to returning something that looks like an HTML tag without quotes around\
    \ it, but by this time it should start looking more familiar :)\n\nAs you may\
    \ have imagined, this is the type of code structure you will be working a lot\
    \ with in React. Most other things stem from it. If you've ever worked with jQuery,\
    \ this component structure can be comparable to jQuery's object-selector syntax:\n\
    \n```javascript\n$(\".class\").on(\"click\", function() {/*do something*/} );\n\
    ```\n\nWhere we have a callback function return upon the event has finished executing.\
    \ In react, we're returning an HTML element that will usually be placed inside\
    \ our application's structure on the front end.\n\nIn case of React components,\
    \ it's just a JavaScript object that contains render function, and has a return\
    \ statement that returns transpiled JSX code. That's what converts `<Something>`\
    \ tag into EcmaScript5 that browsers can understand.\n\nWhat gets to be in render\
    \ function and in return statement depends on the purpose of your application.\
    \ In this example, for the sake of clarity, let's call these objects `Parent`\
    \ and `Child` respectively. An actual pair of names if you were writing an application\
    \ could be something like `Friend` and `FriendList`. Or `Customer` and `CustomerProperty`.\n\
    \n## Parent with a Single Child\n\nUsing this pattern, you can implement a basic\
    \ view functionality.\n\nFirst, let's create the least building block of the pattern\
    \ - the child.\n\n```javascript\nvar Child = React.createClass( { render: function()\
    \ {\n    return<BUTTON onClick = { this.props.onClick }> { this.props.text } </BUTTON>\n\
    \    });\n```\n\nIn this case the child is a basic component that returns a button\
    \ element. The button provides an `onClick` event that will be executed by the\
    \ method `this.props.onClick`.\n\nLet's now create its counterpart `Parent` class,\
    \ and use `Child` as the object it will return. I highlighted `Child` to make\
    \ sure it's easy to see how the `Child` component is tied to `Parent`.\n\n```javascript\n\
    var Parent = React.createClass({ render: function() {\n    return (\n        <Child\
    \ onClick = { this.handleChildClick } text = { this.state.childText } />\n   \
    \ );\n}, handleChildClick: function( event ) { // In this method, you can access\
    \ props\n    // that were passed to the Child, using this.state property var child_text\
    \ = this.state.childText; // To access target element of the click: var target\
    \ = event.target;\n}});\n```\n\nNotice that you can access child's text from `handleChildClick`\
    \ method within `Parent` container. The `Parent` and `Child` containers are tied\
    \ by the `props` passed into the `text` attribute on the `Child` container.\n\n\
    Whatever you pass into the `Child` (which is located within `Parent`) will be\
    \ automatically accessible via the parent container. So `props` are really what\
    \ establishes the relationship between the two.\n\nReact is a relatively new library.\
    \ However, it does use one important JavaScript function that you simply must\
    \ know how to use, if you ever plan on using `Parent` and `Child` dynamic in your\
    \ reactive application.\n\nAnd this standard JavaScript function is the `map`\
    \ method, that natively exists on all objects of type `Array`. If you've ever\
    \ worked with JavaScript arrays before, you may have at least heard of this function.\
    \ All it does is creates a new array, calls the callback function on each item,\
    \ and fills the new array with the result of modifications that the callback function\
    \ has applied to each item from the original array.\n\nSo in short, `Array.map`\
    \ takes all items and applies a custom operation on them. Then, it simply returns\
    \ the new, modified data set as a new array. How does this help us in terms of\
    \ writing `Parent-Child` components in React library? I can demonstrate this by\
    \ providing the following example where we will use multiple `Children` in a single\
    \ `Parent`.\n\n## Parents with Multiple Children\n\nI'll keep the `Child` component\
    \ exactly the same for this example, so we can keep things simple. Notice the\
    \ new usage of array's `map` function within the newly updated `Parent` component:\n\
    \n```javascript\nvar Parent = React.createClass({ /* Set defaults for multiple\
    \ children array */ getChildrenState: function() {\n    return { childrenData:\
    \ [\n        { childText: \"Click me 1!\", childNumber: 1 },\n        { childText;\
    \ \"Click me 2!\", childNumber: 2 }\n    ]};\n}, render: function() {\n    var\
    \ children = this.state.childrenData.map(function(data, index) {\n        return\
    \ <Child onClick = { this.handleChildClick } text = { data.childText } />;\n \
    \   }.bind(this));\n    return <DIV>{children}</DIV>;\n}, handleChildClick: function(\
    \ event ) { // In this method, you can access props\n    // that were passed to\
    \ the Child, using this.state property var child_text = this.state.childText;\
    \ // To access target element of the click: var target = event.target;\n}});\n\
    ```\n"
  raw: 'In this chapter I wanted to introduce you to basic principles of React programming
    that go beyond creation of components alone. Here, I mentioned them briefly in
    the context of our discussion on components and props. As we move forward, we''ll
    keep going deeper into the principles of reactive programming. This time around,
    already having brief familiarity with these principles, it will help us advance
    forward to writing practical React applications.


    # Lesson 2 - Nested Components


    Nested components in React.js help you create more complex view element structures.
    I have previously talked about creation of React components. And just as a reminder,
    here is how you would go about creating one.


    | var Component = React.createClass({ render: function(){    return (        <Something></Something>   
    )}}); |


    This is just a basic component that returns a set of <Something> HTML tags. I
    know, you''re probably still getting used to returning something that looks like
    an HTML tag without quotes around it, but by this time it should start looking
    more familiar :)


    As you may have imagined, this is the type of code structure you will be working
    a lot with in React. Most other things stem from it. If you''ve ever worked with
    jQuery, this component structure can be comparable to jQuery''s object-selector
    syntax:


    | $(".class").on("click", function() {/*do something*/} ); |


    Where we have a callback function return upon the event has finished executing.
    In react, we''re returning an HTML element that will usually be placed inside
    our application''s structure on the front end.


    In case of React components, it''s just a JavaScript object that contains render
    function, and has a return statement that returns transpiled JSX code. That''s
    what converts <Something> tag into EcmaScript5 that browsers can understand.


    What gets to be in render function and in return statement depends on the purpose
    of your application. In this example, for the sake of clarity, let''s call these
    objects Parent and Child respectively. An actual pair of names if you were writing
    an application could be something like Friend and FriendList. Or Customer and
    CustomerProperty.


    ## Parent with a Single Child


    Using this pattern, you can implement a basic view functionality.


    First, let''s create the least building block of the pattern - the child.


    | var Child = React.createClass( { render: function() {    return<BUTTON onClick
    = { this.props.onClick }> { this.props.text } </BUTTON>    }}); |


    In this case the child is a basic component that returns a button element. The
    button provides an onClick event that will be executed by the method this.props.onClick.


    Let''s now create its counterpart Parent class, and use Child as the object it
    will return. I highlighted Child to make sure it''s easy to see how the Child
    component is tied to Parent.


    | var Parent = React.createClass({ render: function() {        return (           
    <Child  onClick = { this.handleChildClick } text = { this.state.childText } />       
    );    }, handleChildClick: function( event ) { // In this method, you can access
    props        // that were passed to the Child, using this.state property var child_text
    = this.state.childText; // To access target element of the click: var target =
    event.target;    }}); |


    Notice that you can access child''s text from handleChildClick method within Parent
    container. The Parent and Child containers are tied by the props passed into the
    text attribute on the Child container.


    Whatever you pass into the Child (which is located within Parent) will be automatically
    accessible via the parent container. So props are really what establishes the
    relationship between the two.


    React is a relatively new library. However, it does use one important JavaScript
    function that you simply must know how to use, if you ever plan on using Parent
    and Child dynamic in your reactive application.


    And this standard JavaScript function is the map method, that natively exists
    on all objects of type Array. If you''ve ever worked with JavaScript arrays before,
    you may have at least heard of this function. All it does is creates a new array,
    calls the callback function on each item, and fills the new array with the result
    of modifications that the callback function has applied to each item from the
    original array.


    So in short, Array.map takes all items and applies a custom operation on them.
    Then, it simply returns the new, modified data set as a new array. How does this
    help us in terms of writing Parent-Child components in React library? I can demonstrate
    this by providing the following example where we will use multiple Children in
    a single Parent.


    ## Parents with Multiple Children


    I''ll keep the Child component exactly the same for this example, so we can keep
    things simple. Notice the new usage of array''s map function within the newly
    updated Parent component:


    | var Parent = React.createClass({ /* Set defaults for multiple children array
    */ getChildrenState: function() {        return { childrenData: [            {
    childText: "Click me 1!", childNumber: 1 },            { childText; "Click me
    2!", childNumber: 2 }        ]};    }, render: function() {        return ( var
    children = this.state.childrenData.map(function(data, index) { return <Child onClick
    = { this.handleChildClick.bind(null, childData) }                                
    text = { childData.childText } />;            }.bind(this)); return <DIV>{children}</DIV>;       
    );    }, handleChildClick: function( event ) { // In this method, you can access
    props        // that were passed to the Child, using this.state property var child_text
    = this.state.childText; // To access target element of the click: var target =
    event.target;    }}); |


    Now, I purposely created these generic examples to show you the association between
    child and parent, because it''s not as trivial as simply nesting HTML elements
    in one another. In react, this link is established programmatically, as shown
    in the examples above.


    In a real world scenario, you will be building components that represent actual
    elements in your application, like alerts, friends lists, messages, comments and
    buttons. But these examples that were shown here are the basic building blocks
    of reactive programming.


    I know it might seem like a hassle to learn all of this, but really, once you
    program a few of these components, you will see the versatility of React, because
    it''s like embedding custom programming into your everyday HTML elements, having
    full control over the data flow, and utilizing Virtual DOM which is lightning
    fast at updating only areas of applications that need updating.


    I hope you enjoyed this tutorial and it has proven to be insightful. I talk a
    lot more about these things in my new book React Gems, which is just about to
    come out.


    # Lesson 3 - Handling Component Events


    Up until this point we have only looked at basic composition of React programs.
    We''ve created components and looked at their internal structure.


    In this lesson we will go deeper into the structure and functionality of React
    Components. In addition to render, we will explore three new methods, each executing
    at a distinct time during the life of a component. This gives us increased creative
    control over the application.


    Always remember that a React component has state. The whole purpose of components
    is to be tied to a custom state represented by that component''s object. A state
    is an object with data. But components also have helper functions that make it
    easier to control how these states will work in a given context.


    In this lesson we will take a look at some of these methods.


    ## Method 1 - getInitialState


    Each component is in charge of rendering its own state but the method getInitialState
    is always called before our render function. This has similar functionality to
    an object constructor function. Here we set the default values.'
