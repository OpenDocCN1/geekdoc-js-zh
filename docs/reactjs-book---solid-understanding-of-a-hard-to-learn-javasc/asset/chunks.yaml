  trans: "\n\n这些 JSX 和 React 代码示例可以互用。只要你后台有 JSX 在对你的代码进行转译，它就能工作，而且你可以在两者之间切换。虽然极力推荐将\
    \ JSX 与 `React` 结合，但在使用或编译 `React` 程序时并不是必须的。如果你非要这样做，直接使用无需 JSX 的 `createElement`\
    \ 语法即可。\n\n然而，如果你想正确地完成，为了开始转译过程，我建议查看 Gem 7 的教程，以熟悉通过 `Babel` 进行转译过程的复杂性。\n\n\
    设置 `Babel` 和 `JSX` 需要一点耐心，但它是非常值得的。只需观看视频教程，并按照说明在你的自己的机器上进行设置即可。\n\n一旦你的文件被积极地转译为\
    \ `ES5`，你就可以在自己的程序中使用 `JSX` 了。\n\n正如你从上面的示例中看到的，这就像是在编写 HTML 标签的同时，又将它们视为 JavaScript\
    \ 语句。当然，这段代码本身发生在某个 `.js` 文件中。这不是 HTML。\n\n注意 `DashboardUnity` 实际上只是一个 XML 标签。它包含子节点，就像你对任何其他标准\
    \ XML 代码所预期的的那样。它之所以有效是因为它被 `JSX` 语言处理机制处理了。这有点像学习一门新语言，但因为你可能已经熟悉 HTML 语法，所以并不难理解。\n\
    \n唯一的本质区别是花括号 `{ }` 现在也可以直接用于 JSX 语句的标签属性名下。整个标签 `Scoreboard` 被视为一个对象。它的属性 `scores`\
    \ 只是它的属性，包含了之前在代码由 JavaScript 对象 `scoreBoard` 指定的值，该对象是用于创建对象的 JSON 字面量对象表示法。\n\
    \n起初看起来可能有点奇怪，但它赋予了你对应用程序的巨大控制力。它将 `document.getElementById`（或 `jQuery` 等效的 `$(\"\
    #id\").attr(\"scores\")`）统一成了一种新格式，而你原本为了访问一个属性就必须使用这种方法。\n\n这种格式不仅允许将属性直接写入你的\
    \ HTML 元素（通过 `JSX`）并将它们分配给已存在的变量/对象，还可以将 HTML 本身视为 JavaScript 语句。这太棒了，想象一下你现在可以从函数作为\
    \ JavaScript 语句返回 HTML 代码，然后将其传递给应用程序中的其他抽象方法。这就像是在函数之间投递 HTML，并为在应用程序的某个容器中输出做准备。\n\
    \n还有一点。你会发现 `JSX` 使用 `className` 而不是传统 DOM 对象中的简单 `\"class\"`。`JSX` 文档解释说：“由于\
    \ `JSX` 是 JavaScript，因此不建议将 `class` 和 `for` 等标识符作为属性名。”这就是为什么 `class` 变成了 `className`，而\
    \ `for` 变成了 `htmlFor`。\n\n要了解更多关于 `JSX` 的知识，你应该查看官方 `JSX` 文档。再次强调，关于这个主题可以专门专门，我们正试图解决基础问题，以便在书的其余部分专注于\
    \ `React`。\n\n# 编写 React.js \n\n欢迎来到 `React Gems` 的第二部分。在本节中我们将抛弃 gem 格式，因为书的第一部分旨在简单地熟悉\
    \ `React` 编程和现代软件开发的最常见原则。\n\n这些理论将帮助我们研究使用 `React` 库进行编程的实践方面。让我们开始吧，从编写我们的第一个\
    \ `React` 组件开始。\n\n# 第一课 - 编写你的第一个 React 组件\n\n下面你看到的是你可能编写的第一个 `React` 组件的紧凑示例。它只是简单地将通用的\
    \ Hello World 消息渲染到 `DIV` 元素中。它只占一行代码。\n\n```javascript\nReact.createClass({render:\
    \ function() { return (<div>Hello World.</div> ) });\n```\n\n在这里，我们正在使用主 `React`\
    \ 库对象的方法 `createClass`。这就是创建组件的方式。但蓝色的代码是什么？它看起来像 HTML，但周围没有双引号！\n\n组件通常存储在变量中。\n\
    \n例如：\n\n```javascript\nvar HelloWorld = React.createClass( { .. } );\n```\n\n\
    将组件存储在变量名中可以帮助我们以后在创建元素之间建立父子关联时。这只是一种以程序化的方式在嵌套组件之间建立关系的方法。\n\n其中一些代码看起来可能有些奇怪，特别是如果你来自传统的\
    \ JavaScript 程序员背景。蓝色高亮的 `JSX` 代码似乎格格不入。\n\n但请记住，`React` 编程与使用额外工具相关。`React` 库本身应该只是你整个应用程序的一部分。没有人会只使用\
    \ `React` 库来编写 React 应用。它只是墙上的单的一块石头。\n\n在 `React` 中，我们可以在 JavaScript 内部编写 HTML。这是对多年来习惯的“HTML\
    \ 内部编写 JavaScript”想法的反转，多年来我们一直在 HTML 的属性标签内部编写 JavaScript（例如 `onclick = \"this.style.color='red';\"\
    `）。\n\n但 `React` 给了我们做相反事情的能力。我们将随着学习不断发现原因。现在让我们扩展一下创建组件的内容，然后我将简要解释 `JSX` 如何帮助我们处理\
    \ HTML 块并将其视为返回值。\n\n话虽如此……让我们进入创建我们的第一个 `React` 组件的完整示例，并在特定的 HTML 元素中渲染其内容：\n\
    \n```javascript\n// 添加所需的库代码\nvar React = react(\"react\");\nvar ReactDOM = require(\"\
    react-dom\");\n// 创建我们的第一个 react 组件 \"HelloWorld\"\nvar HelloWorld = React.createClass(\
    \ {render: function() {\nreturn(<<div>Hello World.</div> )\n});\n// 在 id 为 \"\
    app\" 的 HTML 元素中绘制 \"HelloWorld\" 组件\nReactDOM.render(<HelloWorld />, document.getElementById(\"\
    app\"));\n```\n\n注意我们新创建的组件 `HelloWorld` 有它自己的渲染方法。但作为主要渲染引擎的 `ReactDOM` 对象也有它自己的渲染方法。两者之间的关联是\
    \ `ReactDOM.render` 调用了它作为第一个参数传递的组件的渲染方法。在在这种情况下，就是我们的 `HelloWorld` 组件。\n\n"
- fmt: 'Congratulations on creating your first React component! I wanted to keep it
    simple and not overwhelm you with too much stuff that still needs to take place
    to set up React. But in my future chapters we will continue to gradually unpack
    programming with React library and exactly just what it entails.


    ## JSX


    In React, writing HTML within JavaScript is achieved by open source JSX engine.
    You can browse JSX source code by looking it up at the official GitHub repository
    at:


    https://github.com/jsx/JSX


    According to the official website `JSX` is a statically-typed, object-oriented
    programming language designed to run on modern web browsers. But when it comes
    to React, we will be using it in order to write HTML tags in JavaScript format.
    Which is kind of quirky and unusual. But primarily, this gives us the ability
    to return blocks of HTML code as though it was a JavaScript statement. Which you
    will find will prove to be very useful and intuitive.


    `JSX` simply translates HTML syntax back to JavaScript. This might seem really
    strange at first, but it''s like JavaScript now has its own internal HTML processor.
    This way of thinking is a good starting point of getting familiar with `JSX`.
    As we move forward in the book we will explore it in more intricate detail as
    part of the source code examples.


    While tempting, it is completely unnecessary to fully understand how `JSX` does
    this. It takes care of this internally, and helps us focus on writing the code.
    That''s exactly what it''s for!


    `JSX` does have limitations and it''s not entirely pure HTML you''d expect. It''s
    a derivative of XML, not HTML because XML is more strict. Which means it is better
    for designing libraries. But primarily, because it makes it easier to parse and
    understand.


    `JSX` does not have an inline CSS parser. So while you can use HTML elements with
    attributes, `style` attribute will not be one of them. You can still use other
    attributes like `name`.


    In fact, we probably don''t really want a full blown HTML processor for our JavaScript
    code. Because it would make things way too complicated. HTML has too many edge
    cases. This would make rewriting a complete HTML interpreter like a lot more work
    and make working with `JSX` disorienting. Let''s face it, the idea of writing
    HTML within JavaScript is already a little far fetched as is. But it really gives
    us the leverage we need for writing code faster, by utilizing it primarily for
    treating HTML as return values and tossing them around between components.


    Primarily influenced by original JavaScript DOM API, `JSX` uses "camel case" name
    formatting. For example `className`. (Camel case is a name format for properties
    with first word in lower case and one or more consequent words starting with capital
    letter.)


    The reason `className` is used in `JSX`, is because this is what the original
    JavaScript DOM''s property name is. For example:


    ```javascript

    var cn = document.getElementById("my_id").style.className;

    ```


    This is standard JavaScript code. But `JSX` uses its own virtual DOM system which
    tries to closely imitate it. It''s not trying to reinvent the wheel and create
    its own original processing language. And so properties follow the standard format
    we''re already familiar with from working with DOM API object in JavaScript.


    But there are a few other quirks. For example, you cannot use the "className"
    keyword as HTML attribute name. Let''s consider the following example which creates
    a root component, consisting of just one `UL` element, and calling it''s class
    "my-list" by assigning it with `className` property.


    ```javascript

    var root = React.createElement(''ul'', { className: ''my-list'' },child);

    ```


    This is often mistaken for a `JSX` problem, thinking that `JSX` prohibits the
    use of JavaScript reserved keywords. While this is a somewhat true assessment,
    the problem stems from JSON notation, not `JSX`. The common solution for this
    problem is to use quotes around property name:


    ```javascript

    var root = React.createElement(''ul'', { ''className'': ''my-list''}, child);

    ```


    We haven''t gone deep into the trenches of React programming to talk about parent
    and child relationships between components. But because in this example we''re
    using the third parameter `child`, I wanted to say a few words about what it means.


    In the following chapters you''ll see how parent and child associations work between
    components. But basically, for now just know that whatever element or elements
    you pass as children as 3rd argument in `createElement` method, will become available
    as "props" within that element through `this.props.children` property.


    This way you can work with children components from within your parent class.
    Which is usually the core of your entire app that contains all of the other secondary
    components. Parents can have multiple children.


    We''ll talk about what `props` are a lot more later. For now, just know that `props`
    (or properties) are to React components what arguments are to a function. You
    simply pass them into the object as custom values required for functionality of
    that reactive element.


    Also remember that you can''t paste just about any HTML to use it as your `JSX`
    statements. `JSX` version of HTML is very similar but not 100% accurate HTML specification.
    It closely resembles it, but there are a few differences.


    For reasons like these, `JSX` might throw you off at first. I struggled with it
    for a while myself, but when I realized the main purpose was to help write code
    faster, I thought it made things a lot easier in the long run once I adapted to
    it and started using it habitually.


    It''s almost like re-learning years of working with HTML standard. The hard part
    is knowing limitations of `JSX`. Because you can get frustrated with not knowing
    why things don''t work when they don''t, even though HTML you use in `JSX` looks
    properly formatted.


    It definitely challenges you to think in a new way about designing some parts
    of your application. But bear with these example, and eventually it will sink
    in and start to make a lot more sense.


    ## Props


    In my previous chapter I spoke of React components. But there is a lot more to
    it. Previously, we created a simple component, similar to one that looks just
    like this:


    ```javascript

    ReactDOM.render(<H1>Hello</H1>, document.getElementById(''root''));

    ```


    Notice that we are typing HTML tags `<H1>` right into `render` method as an argument
    without surrounding quotes. This is syntactic style offered by `JSX`. It normally
    will not compile in JavaScript, but intelligent IDE''s like PHPStorm are aware
    of `JSX` syntaxing and will not treat it as an error.


    As long as you have `JSX` included in your project (usually via `babel` library
    or its counterpart command-line plugin, the latter being the one I recommend using
    on your production server) this will compile just fine. (In order words, don''t
    attempt writing this in Notepad in some folder on your "Desktop" your development
    environment must be properly up in order for this to compile, or at the very least
    `babel.js` should be included in `SCRIPT` tag on your page.) It uses internal
    `JSX` processor to convert this inline HTML into JavaScript.


    ### Function Purity


    Before we go into React `props`, I just wanted to mention one thing. In React
    `props` are read-only. And this has a lot to do with a particular type of a function
    called pure function. In traditional software development a pure function is one
    which does not internally change its arguments which are passed to it.


    For example,


    ```javascript

    // pure function; does not modify argument values

    function sum(a, b) { return a + b; }

    ```


    This is considered to be a pure function, because its body does not modify any
    of the parameters that were passed as arguments. On the other hand an example
    of an impure function is shown below:


    ```javascript

    // impure function; modifies value of the passed argument "total"

    function sub(total, less) { return total -= less; }

    ```

    '
