  trans: "\n在这个示例中，我所做的只是将此对象赋值给 `main` `Sprite` 对象作用域内新创建的变量。在 `timer` 定义之前。所以实际上，我们现在在\
    \ `Sprite` 内部有了类似 `this.that` 的东西。\n\n我还将其在 `setTimeout(function() { ... });`\
    \ 内部改为了 `this.that`。\n\n这次让我们运行代码，看看现在会发生什么：\n\n5\n\n`this.that` 的值是 `5`。这是在我们把此对象绑定到名为\
    \ `that` 的变量时发生的。\n\n我确定你以前在上面的示例中使用过我刚才描述的技巧。如果没有，那好吧，我很高兴你现在知道了它。大多数程序员都是通过直觉发现它的。因为要学习\
    \ JavaScript 函数对象与函数内部匿名事件之间作用域规则的差异需要时间的。\n\n在我们脸上带着微笑完成所有这些解释后，我们终于来到了最后一个重大的终极问题！\n\
    \n## 什么是 JavaScript 中的箭头函数？\n\nJavaScript 中的箭头函数是什么？它与匿名函数之间的区别是什么？\n\nJavaScript\
    \ 中的箭头函数是具有简写语法的匿名函数。与标准匿名函数相比，唯一的区别在于语法以及 `this` 对象在其作用域内的处理方式。这是一个小细节，在涉及到 `this`\
    \ 对象的绑定时，两者的实际操作方式略有不同。\n\n让我们对比一下普通的 JavaScript 匿名函数和对应的箭头函数。我们已经知道 JavaScript\
    \ 中像 `function(){...}` 这样的匿名函数是什么样的。但箭头函数实际上具有独特的语法。\n\n注意，两者的功能完全相同，都是执行某些代码。但箭头函数会自动处理我们在之前的示例中经历过的繁琐的\
    \ `this`/`that` 处理。箭头函数会创建自己的不会改变的本地 `this` 对象。所以我们永远不需要重命名或将其绑定到另一个变量（如 `that`），就像之前的示例那样。\n\
    \n这是 EcmaScript 6 中定义 JavaScript 新箭头函数的新语法：\n\n```javascript\n() => { };\n```\n\
    \n提个醒。JavaScript 中的箭头函数不能与 `new` 运算符配合。它们是匿名的，通常用于事件。\n\n但同时也存在语法上的变体：\n\n```javascript\n\
    (a, b) => { ... } // 多参数\na => { ... }     // 单参数\n```\n\n注意 `params` 可以包含一组由逗号分隔的多个参数。在这种情况下，你必须始终使用括号。对于单参数语法，你不需要使用括号。\n\
    \n在真实世界的场景中，我们也可以将箭头函数赋值给变量名。在这种情况下，匿名箭头函数变成了具名的。函数返回其函数体作用域内部的结果。\n\n```javascript\n\
    var add = (a, b) => { return a + b; }\n```\n\n话虽如此...\n\n```javascript\nadd(1,\
    \ 2); // 返回 3\n```\n\n但还有另一种定义箭头函数的无作用域体语法：\n\n```javascript\nvar add = (a, b)\
    \ => a + b;\n```\n\n注意这里的返回值由一个普通的 JavaScript 语句表示。\n\n这将产生完全相同的结果。我们删除了 `return`\
    \ 语句。但函数仍然会返回 `a + b` 的值。在这种情况下，`a + b` 是一个 JavaScript 语句，没有作用域体。默认情况下，未指定作用域的箭头函数即使没有指定\
    \ `return` 关键字，也会返回语句的值。\n\n最后，让我们把所有内容整合在一起，重写我们原始的 `Sprite` 对象示例。只是现在使用了箭头函数。你可以看到，不再有创建并设置\
    \ `this` 绑定到 `that` 变量的必要了。箭头函数会为你、为我们处理好这些！\n\n```javascript\n/* JavaScript 中显著简化的\
    \ Sprite 对象 */\nvar Sprite = function() {\n  this.angle = 5;\n  this.draw = function()\
    \ {\n    alert(this.angle); // 显示 sprite 的角度\n  }\n  var timer = setTimeout( ()\
    \ => {\n    // 注意这里使用了箭头函数\n    alert(this.angle); // 使用 \"this\" 显示 \"5\"，而不是\
    \ \"that\"。\n  });\n};\nvar ship = new Sprite(); // 实例化 ship\n// ship.draw();\
    \ 使用 this.angle 旋转角度绘制 ship\n```\n\n我们只是简单地切换了用作事件处理的标准匿名 `function(){...}`。\n\
    \n并将其替换为箭头函数 `() => {...}`。\n\n从那一刻起，新匿名事件函数内部的 `this` 关键字开始正确引用原始 `Sprite` 对象的\
    \ `this` 关键字。无需我们编写任何额外的绑定代码。\n\n那么……我认为我们对箭头函数的讨论到此结束。希望你喜欢这个教程。请与你的朋友在 Twitter\
    \ 上在你的 Facebook 页面上分享它。\n\nDeveloper Post 是一个小型网站，致力于对其他看起来复杂的主题进行简单解释。希望这能帮助那里的某人编写更好的\
    \ JavaScript 代码。\n\n如果你想学习更多关于 ES6 Harmony 的知识，请访问 [EcmaScript 6 新特性即 Harmony](http://www.developerpost.net/new-javascript-features-in-ecmascript-6.html)（打开新标签页）以熟悉基础。\n\
    \n根据[此 Sitepoint 文章](https://www.sitepoint.com/es6-arrow-functions-new-fat-concise-syntax-javascript/)，箭头函数是\
    \ ES6 最受喜的功能。\n\n这个 Mozilla [箭头函数教程](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions/Arrow_functions)\
    \ 帮助我熟悉了箭头函数。在写这篇文章时，我将其作为我的第一个参考。\n\n## 立即执行箭头函数 (IIAF)\n\n如果你熟悉 jQuery 或 JavaScript\
    \ 插件开发，可能间接遇到过 IIAF，并且已经见过这种立即执行函数表达式 (IIFE) 的语法：\n\n```javascript\n(function\
    \ () { })()\n```\n\n我们在定义处执行该函数。\n\n你会在 HTML 页面底部、就在关闭 body 标签上方发现这种语法。这种技术被用于等待\
    \ HTML 元素加载。\n\n同样地，箭头函数也可以实现同样的效果。\n\n```javascript\n(() => { })()\n```\n\n这种语法被称为立即执行箭头函数。周围的括号使函数在该处执行。\n\
    \n## 反引号 (`) 字符串\n\n反引号只是奇引号字符的另一个名称，也称为反引号。\n\n像 `${ expression }` 这样的语句现在可以使用反引号进行插值。它被位于键盘\
    \ \"1\" 键左侧的第三组引号。\n\n反引号字符串的好处之一是它可以跨行分割。这是 JavaScript 缺少的一个急需功能。\n\n这些类型的字符串也被称为模板字符串。下面显示了几个示例：\n\
    \n| |\n| :--- |\n| `第一行文本 可以在这里继续无需分号` |\n| `另一个包含 ${expression} 的文本字符串` |\n\n\
    | |\n| :--- |\n| // 就像普通引号一样，反引号也可以被转义，见下方： // 以下语句将返回 true \\\\` === \"` |\n\n\
    你可以在反引号内同时使用普通的单引号 (') 和双引号 (\")。\n\n## 新数组方法\n\n以下是 ES6 中数组对象最重要的补充。\n\n让我们按如下定义常见的数组对象：\n\
    \n```javascript\nlet arr = new Array();\n```\n\n在 ES6 中，我们有这些新的数组操作方法：\n\n###\
    \ find\n\n`arr.find(callback[, thisArg])`\n\n返回第一个通过 `callback` 产生“真值”的项目的值。\n\
    \n### findIndex\n\n`arr.findIndex(callback[, thisArg])`\n\n`findIndex` 方法与 `find`\
    \ 完全相同。区别在于它将返回产生“真值”的项目的索引，而不是值。\n\n### fill\n\n`arr.fill(value[, start[, end])`\n"
- fmt: '

    The `fill` method initializes or "fills" all of the elements at every index of
    an array. It can initialize or set only a sector of your array by taking optional
    parameters `start` and `end`:


    | `arr.fill(value[, start = 0[, end = this.length]]);` |


    By default `start` is 0 and `end` is the length of the array.


    ### copyWithin


    This new array method copies a sequence of items within itself as an array, starting
    at the position indicated by `start` and starting from index indicated by `target`:


    | `arr.copyWithin(target, start[, end = this.length] )` |


    Here is a practical example:


    ```javascript

    var arr1 = [1,1,1, 2,2,2, 3,3,3]; // copy first 3 indices to last 3

    arr1.copyWithin(6, 0, 3); alert(arr1); // 1,1,1, 2,2,2, 1,1,1

    ```


    This code, apparently copies the "1,1,1" sequence, starting at 0 index in the
    array and copies it over to the last 3 indices, that start at target index of
    6. This is a lot like memory operations in C++, except with arrays.


    ### New Built-in Classes


    Built in classes are the pre-existing objects that come packaged with JavaScript.
    For example, the familiar ones are `Object`, `Array`, `Function`, `Date`, `Math`
    and a few others… EcmaScript 6 adds several new built in classes which are listed
    below:


    1. `Map` a set of key/value pairs. Almost like an array.

    2. `Set` is like map, except where each stored value is unique.

    3. `Symbol` is used to make private object/class properties.

    4. `Promise` manages an event that will take place at a future time.


    Promises are interesting because all events usually take place at a future time
    anyway. What''s so different about a promise? The proper explanation would be
    to say that they will take place regardless of whether the structure of your HTML
    document changes. These special events, called "promises" guarantee that the event
    will take place at some time in the future.


    One of the problems promises solve is the classic case when HTML element''s events
    (such as `onclick`) are overwritten by code that updates visual aspects of your
    application. Because this happens often in an actively updated front-end view,
    some events might not be triggered at all, just because DOM was rewritten.


    A promise can exist "in the future" regardless of what happens to DOM structure
    of your site, so long as the integrity of the original DOM remains the same, or
    similar to one that existed at the moment when the event was executed.


