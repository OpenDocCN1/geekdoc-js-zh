  trans: '

    组件包含 `propTypes` 对象和两个返回对象的方法：


    1. `propTypes` 对象，将 prop 名称映射到类型

    2. `getDefaultProps()` 返回对象

    3. `getInitialState()` 返回对象


    ## 生命周期方法


    1. `componentWillMount`

    2. `componentDidMount`

    3. `componentWillReceiveProps`

    4. `shouldComponentUpdate`

    5. `componentWillUpdate`

    6. `componentDidUpdate`

    7. `componentWillUnmount`


    这 7 个方法可以在你的 React 类中实现。但并不是所有的组件类都需要使用所有的 7 个函数。这取决于你组件的用途。


    每个方法本质上都是在 React 组件生命周期内特定时间执行的事件。这些功能中的大部分都与检查组件的挂载和更新状态有关。


    除了这些方法之外，当然你也可以根据你的组件需要执行的操作添加你自己的自定义函数。


    # 组件实例


    组件实例是从我们在上一节中查看的类表示所实例化的对象。关于它们的实现，有几点提示：


    1. 组件内部的 `this` 关键字指向它本身。

    2. 无状态函数组件没有组件实例。

    3. 一个组件实例可能会跨多个等效的 ReactElements 。


    ## 属性


    1. 属性 `this.props` 包含了通过标签属性传递给 `React.createElement` 的任何 props。

    2. `this.state` 属性包含了由 `setState` 和 `getInitialState` 方法设置的状态。


    ## 方法


    1. `setState(changes)` 将给更改应用到 `this.state`，以重新渲染 DOM 组件。

    2. `forceUpdate()` 立即重新渲染组件到 DOM。


    ## 秘籍 (Gems)


    在本节中我将介绍几个扩展响应式编程的“秘籍”，并对重要的原理进行一些解释。每个秘籍是对特定主题的重点讨论。


    # 秘籍 1 - React 组件


    组件是 React 应用的构建块。


    由于 React 主要用于应用程序视图（交互式用户界面动态），React 组件可以被视为你的 Web 应用程序组成的视觉区块。React 将每个组件视为可重用的模板。


    在 React 中，每个组件都是 HTML、CSS 和 JavaScript 代码的组合，标识了你应用程序中的某个特定区块。


    例如，这里是我的 Twitter 页面 @gregsidelnikov 从 React 组件的角度来看的。


    在程序上，React 组件遵循嵌套 HTML 标签的足迹。它们有父元素和子元素，父元素也可以是层次链中另一个组件的子元素。


    ![twitter-react-components.png](img/00002.jpeg)


    将组件设计构成你整个应用程序的蓝图。在开始为你的响应式应用编写第一行代码之前，在纸上勾勒出一切是一个很棒的主意。这只是一种直观的方式，将你的页面设计成一个具有独特元素的
    Web 应用程序。


    就像你当年第一次学习普通的 DOM 时，意识到每个 HTML 元素（如 `P`、`DIV`、`TABLE` 等）实际上是对象模型中长树状链中的一个对象一样，把
    React 组件 true 为与某种软件功能绑定的视觉区域吧。这一次，这种功能将由你和你的应用程序的需求自定义决定的。


    从这些 React 的最基本原理中，你现在可以看到为什么 Facebook 和 Instagram 喜欢使用它。它是极快的，它可以帮助将类似流的元素拆分为由组件组成的软件块，而这些组件只是
    CSS、HTML 和 JavaScript 代码的组合。这种设计模型更贴近应用级行为，而不是仅仅使用表格类布局的信息性网站。


    组件是分级的。它们可以是其他组件的子元素。在大多数情况下，组件是为你的应用程序中的可重用而定制的。它们包含了可以适应各种情况的代码模式。React 代码通常遵循创建这些组件链的模式，这些链相互工作，同时保持快速的渲染速度和灵活性。


    # 秘籍 2 - Render 方法


    很有可能，在构建普通的 HTML-JavaScript 应用时，你已经在某种程度上将你的应用分成了不同的隔间。然后，你使用 Ajax 事件根据每个 HTML
    元素单元格中更改的数据类型单独填充每个视图。


    但 React 将这种方法进一步了一步，要求使用 `render()` 方法。`render` 方法必须附加在你创建的每个 React 组件上。没有办法规避它。它是
    React 组件所要求的模式的一部分。


    尽管 React 远不止视图层——在与 React 编程时使渲染方法显式化，这正是 React 经常被认为主要是基于视图的库的原因。我们将在整书中看到为什么这是真的，但为什么这并不完全正确。


    说 React 编程必然是仅限视图的编程是不公平的。事实上，渲染目标的选择告诉我们相反的结论。React 是一种遵循基本哲学的编程模式，这种哲学实际上不需要视图。


    你可以将 React 组件的结果渲染到浏览器或文本字符串（使用一个专门为此创建的方法，称为 `React.renderToString()`）、JSON 对象或你希望的任何其他地方。在这种情况下，渲染根本不是渲染。因为“渲染（render）”这个词意味着数据的视觉化。所以
    React 更像是一组原理，而不是“一种制作用户界面的方法”，正如许多初学者在简要熟悉该库后倾向于相信的那样。


    虽然你可以在 React 之外使用任何第三方库（例如数据库 IO 库），但 React 在视图元素背后的自定义编程方面仍然提供了很多。事实上，它要求你理解这些编程原理的工作原理。


    `render()` 方法通常附加到 React 自己的“虚拟”DOM 上，它是当应用程序首次加载到浏览器时执行的方法。并且，只有当它代表的元素的数据更新时，它会被更新。然而，这正是有趣的地方。在调用渲染方法之前，React
    的组件甚至没有“挂载”到 JavaScript DOM 上，也不会显示。而且我们可以在不挂载的情况下创建 React 组件。我们将在秘籍 6 中更详细地讨论挂载。


    '
- fmt: '

    This makes your application feel different, and it saves bandwidth. if you think
    about it, the non-reactive websites we''ve been building until 2017 is really
    just a lazy man''s design idea. Reloading everything just to see if there is a
    new alert isn''t exactly the best application design. Yet, this is how websites
    like Facebook have been working all of this time. And bit by bit, it''s starting
    to change. This is why they are moving toward reactive implementations.


    But Reactive programming isn''t just a bunch of ajax calls that pull the data
    and replace an HTML element. It''s much more sophisticated.


    And because fast access to only relevant components is usually the key to good
    application design this is where Virtual DOM comes in. Virtual DOM is really a
    quirky way to provide a fast way of modifying the DOM, while abandoning slower
    old-fashioned alternatives.


    The Virtual DOM is hands down one of the greatest advantages of choosing to write
    your application with the `React` library. In fact, when you add `react` library
    to your web project, it behooves you to also add `react.dom` library. The two
    are just inseparable. And all reactive JavaScript applications by default also
    include `React DOM` library.


    This is where React''s Virtual DOM makes a big difference on the usability of
    your application. It''s what allows websites have that native application feel,
    where each element responds instantly to a touch event.


    You''ve probably already seen this starting to happen throughout the internet
    on sites like Netflix,, Facebook and Instagram. You can actually feel the difference.
    Where actions happen instantly, seemingly without having to wait for HTTP requests
    to load first every time you press a button.


    The application responds instantly. React doesn''t eliminate HTTP bandwidth, it
    just minimizes it and focuses only on whether the data really should be transferred
    or not just because of a button click event, for example.


    Of course sites like Netflix and Amazon preload some of the data (first 15 seconds
    of a movie trailer, for example) regardless of whether the user clicks on the
    play button or not. But together with other "reactive" principles it makes a big
    difference on UI responsiveness.


    We''re still building the app from familiar HTML elements, but the response rate
    to each event is brought about by a DOM that is significantly faster than even
    jQuery''s implementation.


    There is nothing special you have to do in order to start using virtual DOM. By
    utilizing React component templating pattern, you''re automatically using react''s
    own virtual DOM traversal. It transparently imitates standard DOM model by providing
    camel-case (like `className` and `fontFamily`) methods and properties matching
    the names that we''re already familiar with.


    # Gem 4 - Two Distinct Ways of Initializing a React Class


    As of the time this book is being written, the web is still somewhat transitioning
    from `EcmaScript5` to `EcmaScript6`. When `EcmaScript 2015` (`ES6`) came out about
    two years ago, it caused a lot of turbulence in the JavaScript world. And divided
    programmers into "the old way" and "the new way" categories. And some prefer to
    use one style over the other based on the circumstance without any problem. Neither
    one is either better or worse.


    However, in the end both `ES5` and `ES6` are executing exactly the same code.
    Most of the difference is syntactic. Surely working in two different languages
    at the same time might create unnecessary headaches, especially when learning
    React for the first time.


    There simply isn''t "one standard way" of doing anything in a loosely typed language
    such as JavaScript. This has always been the case.


    It is extremely important to make this distinction, when it comes to creating
    React components. There isn''t one way of doing it.


    In this gem, I will demonstrate creation of two exactly the same React components
    in two different ways. The difference here, is the difference between `EcmaScript5`
    and `EcmaScript6` itself.


    For the most part, one significant difference is in the usage of `constructor`
    (`ES6`) and a specialized `init state` function method (`ES5`). Let''s take a
    look.


    EcmaScript5 example looks as follows:


    ```javascript

    var NewComponent = React.createClass({ getInitialState() { return { /* initial
    state */ }; });

    ```


    Notice that in `EcmaScript5` the `constructor` keyword does not exist. And this
    is why in this case React provides `getInitialState` function. If you are writing
    your app in `ES5`, you should use this method to initialize default state of your
    component.


    We''ll get to states in just a moment. Because it''s such an important subject.
    States are tied to react components. You should draw a mental association between
    the component and its state while planning your application. Each component is
    responsible for having a state.


    Above we demonstrated `ES5` syntax. I won''t tell you which one of the two you
    should use.


    Eventually `ES6` is going to become the newly adopted standard within a few years,
    but many programmers still prefer `ES5` formatting. Both still work as JavaScript
    supports `ES5` as a subset of `ES6` for compatibility with future applications.


    If this works for you, use `EcmaScript6` as demonstrated below, now using the
    new keywords not available available in `ES5`: `class`, `extends`, `super` and
    `constructor`:


    ```javascript

    class NewComponent extends React.Component( { constructor(props) { super(props);
    this.state = { /* initial state */ }; }} } );

    ```


    It''s same thing, except using `ES6` syntax. If you''re coming from Java, C#`
    or `C++` languages, you might be more familiar with this class creation syntax
    and might prefer it over the outdated `ES5` format.


    Note another difference here is that we''re using `.Component` method to create
    our component, instead of `.createClass`. But essentially, the same exact thing
    takes places under the hood.


    I know that having two different ways of doing the same thing can sound perplexing.
    But here you have a choice of using `ES5` and have your code execute in all browsers
    out of the box, or use `ES6` syntax, and transpile it back to `ES5`. However,
    the advantage of learning the relatively new `ES6` syntax is that your application
    will look cleaner and more intuitive.


    It''s just the period of time we''re faced with right now, as JavaScript specification
    matures. Until browsers fully adopt `EcmaScript 6`, studying this syntax gives
    you an advantage of learning something that isn''t yet in wide use, but that will
    definitely become the next standard over the next few years.


    My personal preference is to start using `EcmaScript 6` syntax. This road might
    be a little rocky but in order stay on top of things when it comes to becoming
    a better JavaScript programmer, it is a wise thing to do. And these types of things
    always take hard work and effort.


    # Gem 5 - States & Life Cycles


    In React, each component has a state. A state is an object with values. A state
    is exactly what it sounds like. It''s the state of that component in terms of
    one or more flags, parameters and settings usually specified by using numerics,
    booleans, arrays or maps.


    The Life Cycle of a React component has a lot to do with states. And React provides
    several default methods that help us write efficient applications. These methods
    are briefly outlined below.


    Each component will usually control its own states via following helper methods.
    They are designed to modify or update component''s state at a unique time during
    the application flow or component''s Life Cycle.


    All of these methods are attached to the component''s object like shown below.
    This is just a brief example demonstrating the placement of these methods within
    your React object.


    Let''s take a look!

    '
