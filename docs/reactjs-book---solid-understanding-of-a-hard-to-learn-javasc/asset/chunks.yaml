    here. We can refer to programming with React as functional templating. Not to
    be confused with functional programming languages. Here I simply mean that your
    React components have a specific function to perform and that this is a way to
    customize your components with unique capabilities. Whereas HTML provides us with
    a set of elements (as HTML tags) that handle the layout of our web application
    and provide interfacing with JavaScript code via attributes, React is that… and
    a lot more.


    React gives us ability to create compact blocks of code that tell us at a glance
    exactly how your component will render on the screen all in one place, and often
    in a single line of code. This gives tremendous opportunities for giving the programmer
    an immense amount of control over making applications that create visual elements
    and at the same time, give him (or her) the ability to program their behavior.


    React programs usually do not deal with separate CSS stylesheets. Interfacing
    with the style is provided via virtual DOM. We''ll see how that works later on
    in the book.


    Compared to traditional HTML, CSS and JavaScript approach, where we would have
    to scout around the source code just to find different bits and pieces of just
    one single element on the web page, React gives us a way to use programmable templates.


    In standard Ajax-based HTML applications, we''re used to seeing code such as demonstrated
    in the following example:


    | // HTML<div class = "LoginForm">    <div class = "Name"> Enter username here.   
    </div></div> |


    And here is the counterpart jQuery ajax example:


    | // Ajax counterpart$.ajax( { url: "/login.php", data: { "username": "user1",                
    "password": "abfgh123" },      // login.php returned some data success: function(
    msg ) {          // Adjust DOM data$(".Name").html( msg );      }); |


    This is a purposely simplified example. But you can see how even then, the code
    is located in two separate blocks. One is the HTML layout definition. It is almost
    like a reusable template for LoginForm with some dynamic functionality.


    The second block of code is the actual program that executes an Ajax statement.
    This line of code will load data from a PHP script based on the data passed to
    it (username and password) and returns some type of a message in msg variable.


    Last, jQuery is used to modify the DOM by replacing the contents of div whose
    class is Name with the message received from the script.


    For a while this methodology worked just fine. Over the last several years, this
    is how we''re used to working with dynamic elements on a web page. But the brilliance
    of React, is that it takes all that and gives us programmatic control over the
    HTML and dynamic data, all packed in a neat render function:'
