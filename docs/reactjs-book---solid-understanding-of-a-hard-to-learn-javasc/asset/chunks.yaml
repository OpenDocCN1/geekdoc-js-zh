  trans: '

    截至 2017 年，我所谓的“响应式”（reactive）编程已成为思考 Web 应用程序的替代方式。它提供了一些软件模式，使得你的 Web 应用程序对用户输入极其灵敏，通常让终端用户（使用你应用程序的人）感到速度更快。


    当我学习 `React` 的时候，我花了大约 3 周才领悟到一点：`React` 与我编写过的任何 JavaScript 库都不同。它假设你已经许多许多知识。正因如此，我必须以特定的方式编写这本书，逐渐深入到理解它的过程。


    学习 `React` 并不是简单地记住这里那里的几个方法并随心所欲地使用它们。`React` 本身构建在软件原理之上，而这些原理通常只有在行业工作长时间的专业软件工程师才会熟悉。这对于像我这样试图向
    JavaScript 新手解释 `React` 的作者来说是一个挑战。


    我选择通过采用一种更流性的解释风格来解决这个问题，这种风格介于讨论和源代码之间，并尝试在两者之间寻求平衡。我不想展示冗长的 `React` 程序然后写几行注释来解释每行代码的作用，那样只会使学习过程变得复杂。相反，我将书的叙述拆解为各个组件（并非双关！），这些组件处理了你在第一次学习
    `React` 时将面对真实问题。


    使用 `React` 库进行编程远不仅仅是学习和使用 `React` 对象、`components`、`states`、`props` 和 `methods`。整本书都致力于解释这些到底是什么。你在其他库中听过
    `props` 或 `states` 吗？`States`……可能你听过。但 `props` 却没那么常见（这是 `React` 指代对象“属性”的方式，而实际上它们是传递给
    `React` 对象的参数/变量。我不明白他们为什么决定称之为 props，这真是个谜。因为即使它们所代表的内容也来自 HTML 属性，而不是属性。）


    `React` 将理解这两者（`props` 和 `states`）变成了显性要求。它们几乎就像子功能，为了成为一个全才的 `React` 库程序员，你必须掌握它们。


    正是这些奇特的细节需要以往的 JavaScript 经验，如果没有这些（以及对这些的解释），学习 `React` 编程将困难得多。幸运的是，我意识到了这一点，并且在编写本书时考虑了所有这些。有时
    `React` 假设了某些 `React` 库本身并不具备的软件原理。书中的章节将在书中逐渐揭示这些。


    这本书并不是一个对象名称、方法和函数的列表并附带功能说明。你可以在 Facebook 的官方 `React` 文档页面查找它们，那里包含了每个方法的详细列表和解释。


    相反，这本书将处理在 `React` 编程中涉及上述原理的逐渐学习和理解过程。


    在我们开始之前，我想向你展示我发现的一些事情。下面你将看到一个学习 `React` 最困难的列表，随后是你想要学习它的最重要原因。


    # 学习 React 的主要障碍


    在这里，我将尝试谈谈从零开始学习 `React` 库面临的常见困难。这些困难让学习 `React` 不像你已经习惯的其他简单直观的库那样直观。


    我会尝试在不让 `React` 看起来像是一个糟糕选择的情况下进行说明，因为……总而言之，这确实是一本关于如何成为一名 `React` 程序员的书。然而，如果我们现在至少简短地谈谈这些困难的部分，在我们之后继续前进时，它会更容易吸收。


    1. **新设计模式**。新的，且在很多情况下是陌生的。如果你是从传统的 2015 年之前的 JavaScript 编程世界来到 `React` 的，可能需要时间来适应
    `React` 库所采用的模块化和声明式设计。当然，如果你工作过大型 JavaScript 应用程序，你可能已经处理过长长的 `.js` 文件列表并将它们视为独立的模块。但对于绝大多数程序员来说，事实并非如此。`React`
    要求我们使用模块化设计以实现最大的应用程序管理效率。


    2. **JSX 语言让很多人感到困惑**。这就像在 JavaScript 中编写 HTML，如果你是第一次遇到它，起看起来完全是不可思议：


    例如：


    ```javascript

    var divblocks = <div><div>Another nested tag</div></div>;

    ```


    等等，什么？你看到的和我看到的一样吗？我们刚刚无情地将 HTML 输入到一个 JavaScript 语句中，没有给 HTML 加上引号，甚至用换行符将它们隔开……而且仍然成功了。


    `JSX` 处理器在后台将 XML 像 HTML 一样处理并将其转换为我们可以随意使用的有效 JavaScript 语句，它为我们完成了所有的脏活。实际上，这种类型的代码是从
    XML（看起来像 HTML）“编译”为 `EcmaScript 5`，这样浏览器才能理解它。这意味着浏览器看到的实际代码看起来甚至不像这样。这只是为了我们编写应用程序时方便。但是……我们可以毫无障碍地以后这种格式编写代码。


    它的用法将在贯书中讨论。但基本上，这种格式与 `React` 组件结构是互换的。你刚刚创建的实际上是一个有效的 `React` 组件模式。


    由于这个原因，`JSX` 经常作为 `React` 的辅助库使用。你可以通过使用 `React` 方法编写我们在示例中看到的语句。使用 `JSX` 并不是强制要求的，你可以没有它也可以。


    然而，没有它，`React` 编程就就像吃没有奶士的披萨。两者共同工作提供了一种美味的体验，即使烘焙饼饼需要尝试和时间。


    3. **Babel & 编译**。将代码从 `EcmaScript 6` 编译到较早版本（`ES5`）有一点开销，看起来也是多此的。因为 Chrome 和
    Safari 等浏览器最终将对 ES6 提供完全支持，这个过程将变得自动。


    `Babel` 允许我们编写这种代码：


    ```javascript

    import someClass from "someClass.js";

    ```


    这将从定义 `someClass` 类的文件 `someClass.js` 中获取它。在写本文时，Chrome、Firefox 以及其他任何浏览器都不支持
    ES6 的 `import` 关键字。


    然而，babel 允许我们现在就开始学习和编写 ES6 代码，即使在官方支持尚未推出之前。在此之前，它只是会在后台将代码“转译”（transpile）回 `ES5`，以便代码现在可以在今天的任何浏览器中运行。


    好消息是，安装 `babel` 插件迫使你学习如何使用命令行工具。这是传统的 JavaScript 开发者通常不熟悉的。我认为这是你本该学习的技能。


    使用命令行在专业软件开发环境中是一个“必须具备”的技能（在桌面某个任意文件夹中的个人项目之外）。而且……它是那些可能会阻止直接进入响应式编程的额外步骤之一（如果不采取的话）。


    # 学习 React 的良好理由


    1. **它很快**。这可能是 JavaScript 程序员想要开始使用 `React` 编写应用程序的首要原因。利用 DOM 的虚拟副本，它旨在渲染到标准
    JavaScript `DOM` 树之前虚拟地执行操作。这不仅仅是一个数字游戏。将 UI 操作移动到虚拟 DOM 确实会改变你的应用程序给终端用户的感受。你可能已经在
    Netflix 等网站上开始注意到这种现象了。


