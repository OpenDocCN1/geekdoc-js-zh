  trans: "\n\n在本章中，我想要向你介绍 React 编程的基本原理，这些原理不仅局限于组件的创建。在这里，我已经在讨论组件和属性（props）的背景下简要提到了它们。随着课程的进行，我们将深入探索响应式编程的原理。这一次，由于我们已经对这些原理有了初步的了解，这将帮助我们向编写实际的\
    \ React 应用迈进。\n\n# 第 2  - 嵌套组件\n\nReact.js 中的嵌套组件可以帮助你创建更复杂的视图元素结构。我之前提到过 React\
    \ 组件的创建。作为一个提醒，这里是你可以如何创建一个组件的方法。\n\n```javascript\nvar Component = React.createClass({\
    \ render: function(){\n    return (\n        <Something></Something>\n    )}});\n\
    ```\n\n这只是一个返回一组 `<Something>` HTML 标签的基础组件。我知道，你可能还在习惯返回一个看起来没有引号括围但看起来像 HTML\
    \ 标签的内容，但到这时它应该开始看起来更亲切了 :)\n\n正如你所想象的，这种结构是你将在 React 中经常使用的代码结构。绝大多数其他内容都源于此。如果你以前用过\
    \ jQuery，这种组件结构可以与 jQuery 的对象选择器语法相比：\n\n```javascript\n$(\".class\").on(\"click\"\
    , function() {/*do something*/} );\n```\n\n其中我们有一个在事件执行完毕后返回的回调函数。在 React 中，我们返回一个\
    \ HTML 元素，它通常会被放置在我们前端的应用结构中。\n\n对于 React 组件来说，它只是包含 `render` 函数的 JavaScript 对象，并有一个返回编译后的\
    \ JSX 代码的 `return` 语句。这就是将 `<Something>` 标签转换为浏览器可以理解的 EcmaScript5 的内容。\n\n`render`\
    \ 函数和 `return` 语句的内容取决于你的应用程序目的。在这个示例中，为了清晰起见，我们将这些对象分别命名为 `Parent`（父级）和 `Child`（子）。如果你在编写应用程序，真实的名称可以是\
    \ `Friend` 和 `FriendList`，或者 `Customer` 和 `CustomerProperty`。\n\n## 有单个子元素的组件\n\
    \n使用这种模式，你可以实现基本的视图功能。\n\n首先，让我们创建该模式中最小的构建块——子组件。\n\n```javascript\nvar Child\
    \ = React.createClass( { render: function() {\n    return<BUTTON onClick = { this.props.onClick\
    \ }> { this.props.text } </BUTTON>\n    });\n```\n\n在这种情况下，子组件是一个返回按钮元素的基础组件。按钮提供了一个\
    \ `onClick` 事件，该事件将由 `this.props.onClick` 方法执行。\n\n现在让我们创建它的对应的 `Parent` 类，并使用\
    \ `Child` 作为它将返回的对象。我高亮了 `Child` 以确保容易看到 `Child` 组件是如何与 `Parent` 绑定的。\n\n```javascript\n\
    var Parent = React.createClass({ render: function() {\n    return (\n        <Child\
    \ onClick = { this.handleChildClick } text = { this.state.childText } />\n   \
    \ );\n}, handleChildClick: function( event ) { // 在此方法中，你可以访问传递给\n    // Child\
    \ 的 props，使用 this.state 属性 var child_text = this.state.childText; // 访问点击的目标元素：var\
    \ target = event.target;\n}});\n```\n\n注意，你可以在 `Parent` 容器内的 `handleChildClick`\
    \ 方法中访问子组件的文本。`Parent` 和 `Child` 容器通过传递到 `Child` 容器 `text` 属性的 `props` 绑定在一起。\n\
    \n无论你传递到 `Child`（位于 `Parent` 内部）的内容，都可以通过父容器自动访问。因此，`props` 真正建立了两者之间的关系。\n\n\
    React 是一个相对新的库。然而，它确实使用了一个重要的 JavaScript 函数，如果你计划在响应式应用中动态使用 `Parent` 和 `Child`，必须知道如何使用。\n\
    \n这个标准的 JavaScript 函数就是 `map` 方法，它原生存在于所有 `Array` 类型的对象上。如果你以前处理过 JavaScript 数组，你可能至少听过这个函数。它的作用创建一个新数组，对每个项调用回调函数，并用回调函数对原始数组每个项所应用的修改结果填充新数组。\n\
    \n简而言之，`Array.map` 获取所有项并对它们应用自定义操作。然后，它简单地将新的修改后的数据集作为新数组返回。这对于我们在 React 库中编写\
    \ `Parent-Child` 组件有什么帮助？我可以通过提供以下示例来演示，我们将在单个 `Parent` 中使用多个 `Children`。\n\n\
    ## 有多个子元素的组件\n\n在这个示例中，我将保持 `Child` 组件完全不变，以保持简单。注意在新更新的 `Parent` 组件中数组的 `map`\
    \ 函数的新用法：\n\n```javascript\nvar Parent = React.createClass({ /* 为多个子数组设置默认值 */\
    \ getChildrenState: function() {\n    return { childrenData: [\n        { childText:\
    \ \"Click me 1!\", childNumber: 1 },\n        { childText; \"Click me 2!\", childNumber:\
    \ 2 }\n    ]};\n}, render: function() {\n    var children = this.state.childrenData.map(function(data,\
    \ index) {\n        return <Child onClick = { this.handleChildClick } text = {\
    \ data.childText } />;\n    }.bind(this));\n    return <DIV>{children}</DIV>;\n\
    }, handleChildClick: function( event ) { // 在此方法中，你可以访问传递给\n    // Child 的 props，使用\
    \ this.state 属性 var child_text = this.state.childText; // 访问点击的目标元素：var target\
    \ = event.target;\n}});\n```\n\n"
- fmt: "\n```javascript\nvar Example = React.createClass( { getInitialState: function()\
    \ {\n    return {\n        state: 0;\n    }\n});\n```\n\nYou'll often see `getInitialState`\
    \ used throughout React components. It resets the default object tied to the component.\
    \ Here you could read values from a database or reset state to its default value\
    \ before rendering this component on the screen.\n\nYou can use this method interchangeably\
    \ with the default constructor method provided in EcmaScript 6:\n\n```javascript\n\
    class Example extends React.Component( { constructor: function() {\n    this.state:\
    \ 0;\n    });\n```\n\nThe only other notable difference here is that we're using\
    \ the `this` keyword to attach state to the main object.\n\nTo access the state\
    \ when the component is rendered on the screen we must use `componentDidMount`\
    \ method:\n\n## Method 2 - componentDidMount\n\n`componentDidMount` is called\
    \ automatically by React when a component is rendered. By adding it to your custom\
    \ React component, you are overloading it. Overloading means, adding your own\
    \ functionality to the method that already exists in the default React component\
    \ object, from which you are extending your own custom component. That's the whole\
    \ purpose of using `extend` keyword. We're extending default functionality of\
    \ React's component object already provided by the library.\n\nWhen I first heard\
    \ of using \"mounting\" function within my React component, I didn't understand\
    \ what it meant. Are we not simply attaching a bunch of helper methods to our\
    \ primary React component?\n\nWe've already spoken of mounting earlier in the\
    \ book. If you still need to brush up on the process, I recommend making sure\
    \ you've gone over `Gem 6 - Component Mounting` previously discussed.\n\n`componentDidMount`\
    \ is the method responsible for setting the state after component has been mounted.\n\
    \n```javascript\nvar Example = React.createClass( { componentDidMount: function()\
    \ { this.state = 1;\n    }});\n```\n\nIt simply means that the virtual DOM has\
    \ become associated with a DOM node that will be actually updated on the screen.\
    \ This method is always called after executing `render` command from the component.\
    \ They are synonymous and can probably be used interchangeably. It ensures and\
    \ tells us that the element actually already exists within virtual DOM.  The `render`\
    \ method has already been called on it!\n\n## Method 3 - componentWillUnmount\n\
    \nAnd finally, `componentWillUnmount` is called just before the component is removed\
    \ from the page and is about to be destroyed.\n\n```javascript\nvar Example =\
    \ React.createClass( { componentWillUnmount: function() { this.state = null;\n\
    \    }});\n```\n\nNotice, we're resetting the state here back to `null`. The component\
    \ is destroyed and we no longer need its data. This is the place where you would\
    \ clean up memory used by your component, if any. For example uninitialize timers.\n\
    \n# Example of a Complete Application written in React\n\nWe've covered enough\
    \ principles to write a complete React application. I intentionally tried to make\
    \ all examples in this book simple. Complexity usually comes from getting creative\
    \ with programming, and if I just dumped a large program into this book, you it\
    \ would probably have a discouraging effect rather than motivational.\n\nHere,\
    \ I will build a simple search app that looks up results from an array set. If\
    \ the typed characters match anything on the list, they will be filtered out and\
    \ all other entries will be dismissed.\n\nThis app is a lot like the Google search\
    \ auto-look up feature where items drop down as you type your phrase into the\
    \ query input box. Below I'm listing the full source code.\n\nHere, I am not going\
    \ to include Cascading Style Sheet part of the app. This can be taken care of\
    \ separately. We want to focus strictly on the React implementation.\n\nThe app\
    \ is surprisingly compact in comparison to everything you'd have to do using standard\
    \ JavaScript code, provided what it actually does.\n\n## Creating Search List\n\
    \nLet's create the list of potential search results by using object literal format\
    \ in JavaScript:\n\n```javascript\n// First, let's define the list of all searchable\
    \ animals\nvar libraries = [\n    { name: 'Wolf', url: 'http://localhost/wolf'},\n\
    \    { name: 'Panther', url: 'https://localhost/panther'},\n    { name: 'Fox',\
    \ url: 'http://localhost/fox'},\n    { name: 'Giraffe', url: 'http://localhost/giraffe'},\n\
    \    { name: 'Elephant', url: 'http://localhost/elephant'},\n    { name: 'Ferret',\
    \ url: 'http://localhost/ferret'},\n    { name: 'Lion', url: 'http://localhost/lion'},\n\
    \    { name: 'Lioness', url: 'http://localhost/lioness'},\n    { name: 'Tiger',\
    \ url: 'http://localhost/tiger'},\n    { name: 'Tigress', url: 'http://localhost/tigress'},\n\
    \    { name: 'Cat', url: 'http://localhost/cat'},\n    { name: 'Dog', url: 'http://localhost/dog'},\n\
    ];\n```\n\n## Writing the React Application\n\n```javascript\n// Let's create\
    \ our search component\nvar SearchComponent = React.createClass( {\n    // Reset\
    \ input element to a blank space\n    getInitialState: function() { return { searchString:\
    \ '' }; },\n    handleChange: function(e) {\n        // Commenting the following\
    \ line will result in the text box not changing its value, because input boxes\
    \ cannot change independently of the value that was assigned to it. In this case\
    \ it's this.state.searchString.\n        this.setState({searchString: e.target.value});\n\
    \    },\n    // Render this component\n    render: function() {\n        var libraries\
    \ = this.props.items;\n        searchString = this.state.searchString.trim().toLowerCase();\n\
    \        if (searchString.length > 0) {\n            // We are searching. Filter\
    \ the results.\n            libraries = libraries.filter(function(l){\n      \
    \          return l.name.toLowerCase().match(searchString); return <li>{l.name}\
    \ <a href={l.url}>{l.url}</a></li>;\n            });\n        }\n        // Return\
    \ this component as a JSX statement\n        return <div>\n            <input\
    \ type=\"text\" value={this.state.searchString} onChange={this.handleChange} placeholder=\"\
    Type here\" />\n            <ul>\n                {libraries.map(function(l) {\n\
    \                    return <li>{l.name} <a href={l.url}>{l.url}</a></li>;\n \
    \               })}\n            </ul>\n        </div>;\n    }\n});\n// Render\
    \ the SearchComponent on the page\nReactDOM.render(\n    <SearchComponent items={libraries}\
    \ />,\n    document.getElementById('container')\n);\n```\n\nPlace this code into\
    \ the main `.js` file of your application and run it. It will result in basic\
    \ drop down functionality. Typing partial animal names will filter them out from\
    \ the main list. Ideally, you would load this list from a database or other data\
    \ storage mechanism.\n\n# EcmaScript 6 - Things You Need to Know\n\nWhen React\
    \ was created, it started out when ES5 specification was in the spotlight. It\
    \ was still new and fresh in 2015 and even throughout 2016.\n\nHowever, by 2017\
    \ it started to progressively adapt to ES6 syntax. And this is why it's important\
    \ to talk about the significant changes that were applied to this new standard\
    \ while studying React.\n"
