    \ 目录）。这种 babel 功能被称为 \"watch\"。它必须先启用。我在我的视频教程中解释了如何在 Windows PC 上进行操作：\n\nYouTube\
    \ 上的 React 教程，可以帮助你设置开发环境、安装 Node.js、NPM、babel、JSX，并帮助你开始监控你的 js 文件：\n\nhttps://www.youtube.com/watch?v=tXaNvGcjEi0\n\
    \n你可以简单地在网页顶部或底部的 `SCRIPT` 标签中添加 `babel.js`。JSX 就能正常转译。但这会显著降低你应用程序的处理速度。它应该只用于测试。\n\
    \n另一方面，该视频只有 58 分钟，如果你认真要设置一个专业的 Web 开发环境，我建议在 YouTube 播放器上使用 2 倍速选项快速浏览，这只需要大约\
    \ 25 分钟。它就像是一门入门介绍课程。\n\n最后，我们通过展示你也可以使用 `cloneElement` 来克隆现有元素来结束这段讨论。\n\n```javascript\n\
    React.cloneElement(element, props, children);\n```\n\n它的工作方式与 `createElement`\
    \ 完全相同。只需将一个现有元素作为 `element` 参数传递即可。然后，你传递给相应参数的任何 `props` 和 `children` 都将合并到原始元素已有的属性中。这让人想起传统面向对象编程中扩展对象的功能。在这里，我们在某种程度上模仿了\
    \ OOP 功能。\n\n创建的元素现在可以实际渲染到 DOM 中。你不能渲染到虚拟 DOM。`render` 函数是 React 库内部处理这一过程的魔法。这时，我们的元素从虚拟\
    \ DOM “复制并粘贴”到屏幕上可见的实际 DOM 中。\n\nReact 在主 `ReactDOM` 对象上提供了 `render` 方法，如下。在响应式编程中，`ReactDOM`\
    \ 是仅次于 React 的重要对象。\n\n```javascript\nReactDOM.render(reactElement, domContainerNode);\n\
    ```\n\n在这里，`domContainerNode` 是父元素，`reactElement` 将在其渲染、重新渲染或首次挂载（mount.）。\n\n\
    如果你需要更新组件的属性，可以多次使用 `render`。\n\n这里是真实场景的可能样子。在这个例子中，我们取了一个 `ReactElement` 并将其渲染到\
    \ DOM 节点上：\n\n```javascript\nReactDOM.render(React.createElement(\"div\"), document.getElementById(\"\
    container\"));\n```\n\n如果你有一个元素已经与变量名关联，你可以使用 `ReactDOM.findDOMNode` 查找它：\n\n\
    ```javascript\nReactDOM.findDOMNode(element);\n```\n\n该语句返回与给定元素关联 DOM 节点。注意，这只有在元素通过\
    \ `render` 方法渲染到 DOM 之后才能生效。在此之前，即使它已经创建，在 DOM 中也是无法找到的。\n\n# 特殊属性 (Special Props)\n\
    \n在这里我们将简要介绍一些特殊的属性名称，这类属性有几个。这些属性应该被视为类似于 JavaScript 中的保留关键字，但在 React 之外。它们都具有特殊含义。\n\
    \n### Children\n`children` 属性名会被 `React.createElement` 自动添加到 `this.props` 中。\n\
    \n### className\n此属性对应于 HTML 的 `class` 属性。你必须在组件/元素中使用 `className` 而不是 `name`，以避免与\
    \ HTML 的保留关键字冲突。\n\n### htmlFor\n与 `className` 相同，仅用于 \"for\" 属性。在 React 元素中任何需要使用\
    \ \"for\" 的地方都应该使用 `htmlFor`。\n\n### key\n`key` 属性唯一标识一个 `ReactElement`。它用于数组。\n\
    \n### ref\n`ref` 属性接受一个回调函数，该函数会在以下情况被调用：\n1. DOM 节点挂载时。\n2. 传递函数发生变化时。\n\n###\
    \ style\n`style` 属性接受样式对象而不是字符串。在 React 中，没有机制可以通过字符串指定 CSS 样式。但这种限制也可以被看作是优势，因为\
    \ CSS 样式现在可以通过编程方式表示，每个属性都是 CSS 属性值对。\n\n# PropTypes\n\nReact 有一个特殊的属性叫做 `propTypes`。它的主要目的是类型检查。随着你的应用程序变大，类型检查可以帮助发现错误。\n\
    \n这是一个例子。假设我们已经创建了一个名为 `ReactComponent` 的 React 组件。在开发模式下，默认开启类型检查。在生产代码中实际上是不开启的。\n\
    \n```javascript\nReactComponent.propTypes = { name: React.PropTypes.string};\n\
    ```\n\n`React.PropTypes` 的作用是对存储的数据类型进行验证。React 默认有很多数据验证器，如果将数字类型传递给定义为字符串的属性（如上所示），你将在\
    \ JavaScript 控制台中看到警告。\n\nReact 的 PropTypes 定义如下：\n\n| any | array | boolean |\
    \ element | func | number | object | string |\n\n# 类组件选项\n\n在书剩下的部分我们将更多地讨论组件。它们是\
    \ React 应用程序的构建模块。但请记住，这是“上手 React”部分。让我们简要概述 React 组件的完整范围，以及 React 库中默认提供的选项和方法。组件通过存在于主\
    \ `React` 对象上的 `createClass` 方法定义：\n\n```javascript\nvar MyComponent = React.createClass({\n\
    \  displayName: 'MyComponent',\n  /* 这是你 React 类的核心\n     选项和生命周期方法将写在这里 */\n\
    \  render: function() {\n    // 一旦渲染，让我们返回一个新创建的元素\n    return React.createElement(/*\
    \ … */);\n  }\n});\n```\n"
