    当然，这个孤立的示例在实际应用场景之外几乎没有任何意义。但它展示了几个重要的原则。


    这段 React 代码借用了来自 JSX 语言的 JavaScript 跨 HTML 语法，让我们能够通过简短地查看代码来了解动态元素的输出样式。React
    在这里正试图满足所有人的需求。在某些情况下，你会注意到一些模式，感觉几乎就像是将后端逻辑带到了前端。


    这个示例中使用了三元运算符 `? :`。基本上，它的意思是如果属性名存在（不为空或未定义），我们就输出它。如果不存在，我们应该输出通用的“Enter username
    here”作为默认消息。


    这把 HTML 模板方法带入了一个不同的维度。在这里，我们同时在设计和编写组件。


    ## 宝石与矿井中的工作


    这只是第一章，我已经在研究 React 编程的复杂性了。然而，让我们回到基础，首先将一些重要的原则拆解成更小的教程片段。这将对我们后的学习有所帮助。


    就像我的《jQuery Gems》一书一样，我们将从一组“宝石”开始，这些是先备知识，将提供前进所需的所需的快速且富有见解的信息片段。由于软件行业目前正处于
    `EcmaScript 5` 和 `6` 之间的过渡期，这将帮助我们排除掉常见的怪癖，并在我们学习书中其余课程时，专注于那些重要的内容。


    如果跳过了这些宝石，书的后面某些部分可能就不好理解了。特别是如果你将学习 React 作为你接触 JavaScript 编程的第一步，那么更是如此。


    但“宝石”只是书的一部分。它们的设计旨在尽可能减少动荡，帮助你在响应式原则的提示下轻松地进入现代 JavaScript 编程的世界。


    在深入探索矿井之前，你必须理解这些原则。宝石将磨利你的镐。书的第二部分将向你展示洞穴的其余部分。


    ## 掌中的 React


    为了让你的旅程更加轻松，我在这里包含了代表 React 程序每个独立层面的章节。系好安全带，准备好吸收大量新原则！我们现在真正要进入 React 编程的世界了
    :)


    这是一个鸟瞰式的解释，涵盖了构建 React 程序涉及的最重要概念。我已经提到过学习 React 是碎片化的。而且它假设你之前已经有了高级编程模式的知识。


    在本节中，我将尝试将它们拆分为可以单独分析的合理分块。随着我们的不断推进，这将帮助你将拼图的碎片组合在一起。请把这里描述的原则想象成驱动 React 核心引擎的想法。


    仅仅因为它们在这里被整齐地列出，并不意味着学习 React 会很轻松。但通过花时间熟悉它们，确实会让阅读书的其余部分变得更容易。


    # 核心要素


    如果你熟悉 jQuery，你已经使用过美元符号 (`$`) 对象来选择 HTML 元素并对其进行各种操作。


    但当涉及到 HTML 元素（不是组件）时，React 中类似的构建块是什么？它一定是 `createElement` 方法。


    ```javascript

    React.createElement(type, props, children);

    ```


    以下是你在实践中如何使用 `createElement` 的示例：


    ```javascript

    let link = React.createElement(''a'', {href: ''#''}, "Save"); let nav = React.createElement(MyNav,
    {flat: true}, link);

    ```


    在这里，我们使用 React 方法 `createElement` 以编程方式创建了 HTML 元素。然后我们将创建的 `link` 元素放置在 `nav`
    元素内部作为它的子元素之一。


    当然，在这种情况下 `link` 是唯一的子元素，也可以使用多个链接，作为用逗号分隔的额外参数：


    ```javascript

    let link1 = React.createElement(''a'', {href: ''#''}, "Save"); let link2 = React.createElement(''a'',
    {href: ''#''}, "Delete"); let nav = React.createElement(MyNav, {flat: true}, link1,
    link2);

    ```


    你可以一直这样下去，添加应用程序所需的任意数量子元素。


    注意 `nav` 变量使用了 `MyNav` 而没有使用双引号。这是完全没问题的。当我们使用自己定义的自定义元素（而不是 `a`、`div`、`table`
    等标准元素）时，我们必须使用大写字母开头。因此，导航元素被称为 `MyNav`。只要我们使用开头大写的 `React`，React 也就知道我们指的是一个自定义元素。不需要在这里使用周围的引号。


    在 JSX 中，它将翻译为 `<MyNav />`


    随着时间的推移，当你开发应用程序时，你会得到类似于示例所示的完整结构。注意，这里稍有不同，因为我实际上直接将 React 语句作为子参数：


    ```javascript

    let nav = React.createElement(MyNav, {flat: true}, // nav 的元素 React.createElement(''a'',
    {href: ''#''}, "Save"), React.createElement(''a'', {href: ''#''}, "Load"), React.createElement(''a'',
    {href: ''#''}, "Delete"), React.createElement(''a'', {href: ''#''}, // AlertCounter
    React.createElement(''span'', {alerts: 0}, "No Alerts")));

    ```


    注意某些元素是简单的字符串。它们在这里被用作文本节点。在这种情况下，当元素用于指定嵌套元素时用于 HTML。


    此外，这里是在没有 JSX 的情况下使用 ES5 创建元素。我稍后会详细解释这一点。虽然我提倡使用 ES6，但我想先向你展示如何在 ES5 中实现。此外，ES6
    向后兼容 ES5。因此，这意味着很多时候你编写 React 程序将取决于你的个人喜好。


    现在理解的关键是 `createElement` 接受三个参数：`type`、`props` 和 `children`。


    在这里，`type` 是元素的名称。例如 `A`、`H1`、`DIV` 等。


    然后是 `props`，它们是你传递给组件的属性。Props 不是状态，但它们可以修改状态。稍后我们会详细区分这种区别。


    最后，`children` 只是位于父元素内部的层级元素。创建它们的链并将它们作为 N 个参数直接输入 `createElement` 函数。


    深入理解 React 的另一个关键是，上述所有代码在 JSX 中都有等效写法。两者可以互换使用。当你真正开始理解它是工作的时，这才是有趣的部分。


    所以，虽然在 ES5 中你会使用 `createElement` 函数，但在 JSX 中（通常与其余 ES6 语法一起使用），你只需通过编写如下内容来创建完全相同的功能：


    ```javascript

    let link1 = <a href = "#">Save</a>;

    ```


    现在你明白我的意思了吗？JSX 将 HTML 转换为 JavaScript 语句。在这里 `link1` 是元素的对象化表示，与我们之前用 `createElement`
    方法创建的 React 代码完全等效。


