    恭喜你创建了第一个 React 组件！我希望保持内容简单，不让你被设置 React 仍需完成的过多任务所困扰。但在未来的章节中，我们将继续逐步拆解使用 React
    库进行编程，以及它具体包含的内容。


    ## JSX


    在 React 中，在 JavaScript 编写 HTML 是通过开源 JSX 引擎实现的。你可以通过访问官方 GitHub 仓库查看 JSX 源码：


    https://github.com/jsx/JSX


    根据官方网站，`JSX` 是一种静态类型的面向对象的编程语言，旨在运行在现代网络浏览器上。但涉及到 React 时，我们将使用它以 JavaScript 格式编写
    HTML 标签。这有点很奇异且不寻常。但主要，它赋予了我们像返回 JavaScript 语句一样返回 HTML 代码块的能力。你会发现这将是非常有用且直观的。


    `JSX` 简单地将 HTML 语法转换回 JavaScript。这起初看起来可能非常奇怪，但它就像 JavaScript 现在有了它内部的 HTML 处理器一样。这种思考方式是熟悉
    `JSX` 的一个良好起点。随着书籍的深入，我们将作为源码示例的一部分，在更复杂的细节上探索它。


    虽然很有吸引力，但完全理解 `JSX` 如何做到这一点完全没有必要。它在内部处理了这些，并帮助我们专注于编写代码。这正是它的用途所在！


    `JSX` 确实有局限性，它并不是你预期的完全纯 HTML。它是 XML 的派生物，而不是 HTML，因为 XML 更严格。这意味着它更适合设计库。但主要，因为它使其更容易被解析和理解。


    `JSX` 没有内联 CSS 解析器。因此，虽然你可以使用带有属性的 HTML 元素，但 `style` 属性不会是其中。你仍然可以使用其他属性，如 `name`。


    事实上，我们可能并不真的想要为 JavaScript 代码一个完整的 HTML 处理器。因为这会让事情变得过于复杂。HTML 有太多的边缘情况。这会让重写一个完整的
    HTML 解释器变得困难得多，并让使用 `JSX` 变得无所措。面对现实吧，在 JavaScript 中编写 HTML 的想法本身已经有点不切谱了。但它确实为我们提供了更快编写代码所需的杠杆，主要通过将
    HTML 视为返回值并在组件之间进行传递。


    `JSX` 主要受原始 JavaScript DOM API 的影响，使用了“驼峰命名法”（camel case）格式。例如 `className`。（驼峰命名是一种属性的命名格式，第一个单词小写，后续的一个或多个单词以大写字母开头。）


    在 `JSX` 中使用 `className` 的原因是因为这是原始 JavaScript DOM 的属性名。例如：


    ```javascript

    var cn = document.getElementById("my_id").style.className;

    ```


    这是标准的 JavaScript 代码。但 `JSX` 使用它自己的虚拟 DOM 系统，该系统试图紧密模仿它。它并没有试图重新发明轮子并创建自己的原始处理语言。因此，属性遵循我们已经在
    JavaScript 中处理 DOM API 对象时已经熟悉的标准格式。


    但还有其他几个奇怪之处。例如，你不能将 "className" 关键字作为 HTML 属性名。让我们考虑下面的示例，它创建了一个根组件，由一个 `UL` 元素组成，并通过通过赋值
    `className` 属性将其类命名为 "my-list"。


    ```javascript

    var root = React.createElement(''ul'', { className: ''my-list'' },child);

    ```


    这通常被误认为是 `JSX` 问题，认为 `JSX` 禁止使用 JavaScript 预留关键字。虽然这种评估在某种程度上是正确的，但问题源于 JSON 表示法，而不是
    `JSX`。此问题的常见解决方案是在属性名周围加上引号：


    ```javascript

    var root = React.createElement(''ul'', { ''className'': ''my-list''}, child);

    ```


    我们还没有深入到 React 编程的阵地来讨论组件之间的父子关系。但因为在这个示例中我们使用了第三个参数 `child`，我想对它的含义说几句话。


    在接下来的章节中，你将看到组件之间父子关联是如何工作的。但基本上，现在只需要知道，无论你作为 `createElement` 方法的第三个参数传递什么元素或多个元素，它们都将通过
    `this.props.children` 属性作为 "props" 在该元素内部可用。


    通过这种方式，你可以在你的父类内部与子组件一起工作。这通常是你整个应用程序的核心，包含了所有其他次要组件。父组件可以有多个子。


    我们以后会更多地讨论 `props` 是什么。现在，只需知道 `props`（或属性）对于 React 组件就像参数之于函数。你只需将它们传递到对象中，作为该响应式元素功能所需的自定义值。


    另外请记住，你不能随意粘贴任何 HTML 来用作你的 `JSX` 语句。`JSX` 版本的 HTML 非常相似，但不是 100% 准确的 HTML 规范。它非常相似，但存在一些差异。


    由于这些原因，`JSX` 可能会让你感到困惑。我自己也为此挣扎了一段时间，但当我意识到它的主要目的是帮助更快地编写代码时，我想一旦我适应并开始习惯性地使用它，长远来看它会让事情变得简单得多。


    这几乎是重新学习多年来的 HTML 标准。困难的部分在于了解 `JSX` 的局限性。因为当事情不起作用时，如果你不知道为什么，你可能会感到沮丧，尽管你在 `JSX`
    中使用的 HTML 看起来格式完全正确。


    它确实挑战了你以一种新方式思考应用程序的部分。但请坚持这些示例，最终它会融入并开始变得更有意义。


    ## Props


    在上一章节中，我提到了 React 组件。但它其中还有很多内容。之前，我们创建了一个简单的组件，类似于这样：


    ```javascript

    ReactDOM.render(<H1>Hello</H1>, document.getElementById(''root''));

    ```


    注意我们直接将 HTML 标签 `<H1>` 作为参数输入到 `render` 方法中，而没有引号。这是 `JSX` 提供的语法风格。它通常在 JavaScript
    中无法编译，但智能 IDE（如 PHPStorm）感知 `JSX` 语法并不会将其视为错误。


    只要你已经在项目中包含了 `JSX`（通常通过 `babel` 库或相应的命令行插件，后者是我建议在你的生产服务器上使用的），它就可以正常编译。（换句话说，为了让它编译，你的开发环境必须正确配置，或者至少要在页面上包含
    `babel.js`。）它使用内部 `JSX` 处理器将这种内联 HTML 转换为 JavaScript。


    ### 函数纯性


    在我们进入 React `props` 之前，我想提一点。在 React 中 `props` 是只读的。这与一种称为纯函数的特殊类型函数很大关系。在传统的软件开发中，纯函数是指不在内部改变传递给它的参数的函数。


    例如，


    ```javascript

    // 纯函数；不修改参数值

    function sum(a, b) { return a + b; }

    ```


    被认为是纯函数，因为它的体没有修改作为参数传递的任何参数。相反，下面显示了一个不纯函数的示例：


    ```javascript

    // 不纯函数；修改传递的参数 "total"

    function sub(total, less) { return total -= less; }

    ```

