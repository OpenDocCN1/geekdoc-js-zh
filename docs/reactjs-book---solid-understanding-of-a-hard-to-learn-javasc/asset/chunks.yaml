    searchString );            });        }        // Return this component as a JSX
    statement return <div>                    <input type = "text" value={this.state.searchString}
    onChange = {this.handleChange} placeholder = "Type here" />                   
    <ul>                        { libraries.map(function(l) {                           
    return <li>{l.name} <a href = {l.url} > {l.url}</a></li>                       
