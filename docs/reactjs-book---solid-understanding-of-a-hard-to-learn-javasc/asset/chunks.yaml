- fmt: "\nIn React, `props` take on the \"pure\" ideology. This means you can pass\
    \ them, under the condition that your react component will not be changing their\
    \ values from within itself. This is exactly what makes react `props` read-only.\
    \ It's good to stick to that rule.\n\n`Props` are derived from HTML element properties.\
    \ It's a bit odd, that they are called `props`. Because in HTML elements, properties\
    \ are single-keyword flags like `DISABLED` or `CHECKED`.\n\nThe better name for\
    \ `props` would be `attributes`. Because they resemble the `name=value` pair of\
    \ HTML attributes not `props`. But, that's just the way it is. `React.js` developers\
    \ have chosen this naming convention! Don't shoot the messenger:)\n\nIf you've\
    \ been following our discussion from the previous chapter you should now know\
    \ what components are. They are combinations of HTML, CSS and JavaScript code\
    \ blocks that determine functionality of one visual area of your application.\
    \ They are responsible for updating things like feed messages, alerts and various\
    \ state updates.\n\nWe also know that a component usually has a `render` method\
    \ to display it in your app.\n\nWorking with `React.js` the next thing you will\
    \ run into are `props`. `Props` are like function arguments. Except you pass them\
    \ to your component, not functions. The principle is the same, however.\n\nLet's\
    \ create a component and pass a prop to it.\n\n```javascript\n// Create a Hello\
    \ component\nvar Hello = React.createClass({\n  render: function() {\n    return\
    \ (\n      <DIV>Hello, {this.props.name}</DIV>\n    )\n  }\n});\n\n// Now call\
    \ \"render\" method to display this component in your #app\nReactDOM.render(<Hello\
    \ name = \"Jason\"/>, document.getElementById(\"app\"));\n```\n\nHere I added\
    \ a prop called `name` and assigned it value of `\"Jason\"`. Notice that it's\
    \ contained within a self-closing tag `<Hello />`.\n\nWithin the component itself,\
    \ we can refer to it as `this.props.name` to print out its value, instead of generic\
    \ \"Hello World\" example from previous tutorial.\n\n## Functional Components\n\
    \nAbove we have demonstrated a standard React component. It has all of the complexities\
    \ of one: it's created using `createClass` function, and contains a `render` method.\
    \ But the following code is actually also considered a valid React component,\
    \ even though it's nothing more than a standard JavaScript function:\n\n```javascript\n\
    function Hello(props) {\n  return <H1>Hello, { props.name }</H1>;\n}\n```\n\n\
    What makes it a valid React component is the fact that it returns a React element.\
    \ `React` elements can be rendered on the screen. A lot of your reactive code\
    \ will be returning such statements. It's just a way of bundling HTML elements\
    \ and returning them as if it was a regular JavaScript value.\n\nThis is a big\
    \ part of React-style programming and it's easy to get used to once you've actually\
    \ programmed a few of them yourself. At first it will feel awkward, but once you\
    \ get used to it you'll really see the versatility of this style of programming.\n\
    \nRemember that in JavaScript everything is an object, even functions. This is\
    \ why components like this are called functional components. In a way, it's really\
    \ just a different way of thinking about JavaScript functions.\n\nThis is a valid\
    \ way to define a React component using `EcmaScript5` specification, not `ES6`\
    \ like in the previous example above. However, both are equivalent from the point\
    \ of view of writing reactive applications.\n\nIt's up to you as the programmer\
    \ to know the differences between `ES5` and `ES6`, which can take a whole book\
    \ of its own to justify righteously. However, throughout the tutorials in this\
    \ book, I'll try to use every opportunity to explain the differences between the\
    \ two.\n\nWhat's more, let's take a look at a piece of code that accomplishes\
    \ exactly the same thing of defining a component only this time using syntax of\
    \ `EcmaScript6` specification:\n\n```javascript\nclass Hello extends React.Component\
    \ {\n  render() {\n    render <H1>Hello, { this.props.name }</H1>\n  }\n}\n```\n\
    \nNote that we're using `ES6` class keyword. We also use the new `new` keyword\
    \ `extend` to derive this object from the standard `React.Component` which is\
    \ the default component object supplied by `React` library itself.\n\n## A Wolf\
    \ in Sheep's Clothing\n\nIf you know how class inheritance works, well this is\
    \ how it is imitated in JavaScript. I say imitated, because under the veil, JavaScript\
    \ still uses prototype-based inheritance. Which can be a blessing and a curse.\n\
    \nInheritance standards defined by JavaScript are not really real, compared to\
    \ more mature languages such as `C++` or `Java`. In other words, you can forget\
    \ creating advanced object structures such as \"interfaces\" in JavaScript with\
    \ its loose typing.\n\nStrict programming languages are usually better at providing\
    \ a fully functional Object-Oriented Programming environment. And here, `EcmaScript`\
    \ developers decided to dress up JavaScript syntax a bit to make the wolf look\
    \ a little more like a sheep.\n\nBut most programmers agree that this syntax improves\
    \ programming in JavaScript. At least visually.\n\nOne other major difference\
    \ of making components this way is access of `props.name` property via `this`\
    \ keyword variable. Otherwise it does exactly what the functional component from\
    \ previous example does.\n\n## Native Babel vs JavaScript Babel\n\nI tried to\
    \ subtly mention this in a previous chapter. But this deserves a brief explanation\
    \ before we move forward. I don't want you to deceptively see `babel` at work,\
    \ without knowing that it might not be properly set up for real-world production\
    \ environment.\n\nIt's best to run `babel` as a stand alone application in the\
    \ background, as part of your development environment. This comes with `Node`\
    \ installation by default. Simply download `Node` from Google and keep clicking\
    \ \"Next\" button to finish installation.\n\nAdding `babel` directly via `SCRIPT`\
    \ tag is possible and works for testing things out. But because `babel`s JavaScript\
    \ library is slower, it is advised to install the native version that works from\
    \ command line. JavaScript `babel` library is just slow at processing something\
    \ like this and defies React programming, one of the sole purposes of which is\
    \ to optimize your app for speed.\n\n## NPM\n\nCommand line `babel` application\
    \ comes together with `Node.js` installation. So if you install `Node`, you will\
    \ automatically have `babel` packages. You just need to install them separately\
    \ from command line using `NPM` tool, which also comes with `Node` by default.\n\
    \nWhile learning `React.js`, it's perfectly normal to simply add `babel` via `SCRIPT`\
    \ tag. It's just not fast enough for production environment when your app goes\
    \ live. In any case, all `babel` does is \"transpile\" your `EcmaScript6` and\
    \ `JSX` code back into `EcmaScript5`, so you can run it in any browser that doesn't\
    \ have full support for `ES6` yet. (None of them do, as of this writing.)\n\n\
    ## Transpiling Source Code\n\nYou've probably heard programmers on forums, Twitter\
    \ and reddit use the word transpiling but may not have fully grasped the idea\
    \ behind it.\n\nUsually, transpiling is the process of compiling code in one language\
    \ into source code in another language. It's just compiling between languages.\
    \ However, when it comes to JavaScript, we will be transpiling between two different\
    \ specifications of `EcmaScript`, 5 and 6.\n\nThis gives us the ability to write\
    \ code in `EcmaScript 6`, have it transpile to `EcmaScript 5`, so that modern\
    \ browsers can actually run your code. Most browsers at the time of this writing\
    \ do not have support for `ES6`, not even Chrome.\n\nEventually, when `ES6` support\
    \ is rolled out for all browsers it will be safe to simply discontinue using `babel`\
    \ for the purpose of transpiling between `EcmaScript` specs. The code will work\
    \ out of the box by simply writing it within your standard JavaScript files.\n\
    \nBut until then, we might as well use this opportunity to learn about a fun source\
    \ code tool. There are always new standards coming out, and the art of transpiling\
    \ is probably not going away anytime soon.\n"
  raw: 'In React, props take on the "pure" ideology. This means you can pass them,
    under the condition that your react component will not be changing their values
    from within itself. This is exactly what makes react props read-only. It''s good
    to stick to that rule.


    Props are derived from HTML element properties. It''s a bit odd, that they are
    called props. Because in HTML elements, properties are single-keyword flags like
    DISABLED or CHECKED.


    The better name for props would be attributes. Because they resemble the name=value
    pair of HTML attributes not props. But, that''s just the way it is. React.js developers
    have chosen this naming convention! Don''t shoot the messenger:)


    If you''ve been following our discussion from the previous chapter you should
    now know what components are. They are combinations of HTML, CSS and JavaScript
    code blocks that determine functionality of one visual area of your application.
    They are responsible for updating things like feed messages, alerts and various
    state updates.


    We also know that a component usually has a render method to display it in your
    app.


    Working with React.js the next thing you will run into are props. Props are like
    function arguments. Except you pass them to your component, not functions. The
    principle is the same, however.


    Let''s create a component and pass a prop to it.


    | // Create a Hello componentvar Hello = React.createClass({ render: function()
    {        return (            <DIV>Hello, {this.props.name}</DIV>        )    }});//
    Now call "render" method to display this component in your #appReactDOM.render(<Hello
    name = "Jason"/>, document.getElementById("app")); |


    Here I added a prop called name and assigned it value of "Jason". Notice that
    it''s contained within a self-closing tag <Hello />.


    Within the component itself, we can refer to it as this.props.name to print out
    its value, instead of generic "Hello World" example from previous tutorial.


    ### Functional Components


    Above we have demonstrated a standard React component. It has all of the complexities
    of one: it''s created using createClass function, and contains a render method.
    But the following code is actually also considered a valid React component, even
    though it''s nothing more than a standard JavaScript function:


    | function Hello(props) {return <H1>Hello, { props.name }</H1>;} |


    What makes it a valid React component is the fact that it returns a React element.
    React elements can be rendered on the screen. A lot of your reactive code will
    be returning such statements. It''s just a way of bundling HTML elements and returning
    them as if it was a regular JavaScript value.


    This is a big part of React-style programming and it''s easy to get used to once
    you''ve actually programmed a few of them yourself. At first it will feel awkward,
    but once you get used to it you''ll really see the versatility of this style of
    programming.


    Remember that in JavaScript everything is an object, even functions. This is why
    components like this are called functional components. In a way, it''s really
    just a different way of thinking about JavaScript functions.


    This is a valid way to define a React component using EcmaScript5 specification,
    not ES6 like in the previous example above. However, both are equivalent from
    the point of view of writing reactive applications.


    It''s up to you as the programmer to know the differences between ES5 and ES6,
    which can take a whole book of its own to justify righteously. However, throughout
    the tutorials in this book, I''ll try to use every opportunity to explain the
    differences between the two.


    What''s more, let''s take a look at a piece of code that accomplishes exactly
    the same thing of defining a component only this time using syntax of EcmaScript6
    specification:


    | class Hello extends React.Component { render() {render <H1>Hello, { this.props.name
    }</H1>    }} |


    Note that we''re using ES6 class keyword. We also use the new keyword extend to
    derive this object from the standard React.Component which is the default component
    object supplied by  React library itself.


    ### A Wolf in Sheep''s Clothing


    If you know how class inheritance works, well this is how it is imitated in JavaScript.
    I say imitated, because under the veil, JavaScript still uses prototype-based
    inheritance. Which can be a blessing and a curse.


    Inheritance standards defined by JavaScript are not really real, compared to more
    mature languages such as C++ or Java. In other words, you can forget creating
    advanced object structures such as "interfaces" in JavaScript with its loose typing.


    Strict programming languages are usually better at providing a fully functional
    Object-Oriented Programming environment. And here, EcmaScript developers decided
    to dress up JavaScript syntax a bit to make the wolf look a little more like a
    sheep.


    But most programmers agree that this syntax improves programming in JavaScript.
    At least visually.


    One other major difference of making components this way is access of props.name
    property via this keyword variable. Otherwise it does exactly what the functional
    component from previous example does.


    ## Native Babel vs JavaScript Babel


    I tried to subtly mention this in a previous chapter. But this deserves a brief
    explanation before we move forward. I don''t want you to deceptively see babel
    at work, without knowing that it might not be properly set up for real-world production
    environment.


    It''s best to run babel as a stand alone application in the background, as part
    of your development environment. This comes with Node installation by default.
    Simply download Node from Google and keep clicking "Next" button to finish installation.


    Adding babel directly via SCRIPT tag is possible and works for testing things
    out. But because babel''s JavaScript library is slower, it is advised to install
    the native version that works from command line. JavaScript babel library is just
    slow at processing something like this and defies React programming, one of the
    sole purposes of which is to optimize your app for speed.


    ## NPM


    Command line babel application comes together with Node.js installation. So if
    you install Node, you will automatically have babel packages. You just need to
    install them separately from command line using NPM tool, which also comes with
    Node by default.


    While learning React.js, it''s perfectly normal to simply add babel via SCRIPT
    tag. It''s just not fast enough for production environment when your app goes
    live. In any case, all babel does is "transpile" your EcmaScript6 and JSX code
    back into EcmaScript5, so you can run it in any browser that doesn''t have full
    support for ES6 yet. (None of them do, as of this writing.)


    ## Transpiling Source Code


    You''ve probably heard programmers on forums, Twitter and reddit use the word
    transpiling but may have not fully grasped the idea behind it.


    Usually, transpiling is the process of compiling code in one language into source
    code in another language. It''s just compiling between languages. However, when
    it comes to JavaScript, we will be transpiling between two different specifications
    of EcmaScript, 5 and 6.


    This gives us the ability to write code in EcmaScript 6, have it transpile to
    EcmaScript 5, so that modern browsers can actually run your code. Most browsers
    at the time of this writing do not have support for ES6, not even Chrome.


    Eventually, when ES6 support is rolled out for all browsers it will be safe to
    simply discontinue using babel for the purpose of transpiling between EcmaScript
    specs. The code will work out of the box by simply writing it within your standard
    JavaScript files.


    But until then, we might as well use this opportunity to learn about a fun source
    code tool. There are always new standards coming out, and the art of transpiling
    is probably not going away anytime soon.


    *  *  *'
