  trans: "\n当你学习 React 时，你学习的远不止是 React。它在 ES5 中运行良好良好，但那种语法正在变得过时。这正是许多程序员可能会感到困惑的地方，因为本质上同一个库在你在互联网和书籍上看到的不同示例中，看起来可能并不一样。\n\
    \n如果你不认识 React，那么你可能对 EcmaScript 6 (ES6) 一点都不了解。我知道这种假设是危险的，但我想通过在本章中将学到的内容来证明它是合理的。\n\
    \nES5 本身并没有任何问题。它不会在短期内消失。我认为，在行业仍处于从一个规范向另一个规范过渡的时期编写教育类书籍，偶尔在两者之间进行切换是很重要的。\n\
    \n但我们已经读到了书的一个位置，现在我们将调查 EcmaScript 6 规范中对 JavaScript 的主要区别和新增。在书结束时，我还会为这里讨论的许多主题提供备查表（cheat\
    \ sheets）。\n\n## `var` 和 `let` 关键字\n\n在 ES6 中，共识是不再使用 `var` 关键字，而是使用 `let` 关键字。其背后的原因下文所示：\n\
    \n❖ 使用 `let` 关键字时没有变量提升（hoisting）。如果你熟悉 JavaScript 的变量提升机制，当你使用新的 `let` 关键字时会发现区别。\n\
    \n变量提升是指 JavaScript 将所有变量定义移动到它们所在作用域的顶部。这个不为人知的过程是在幕后完成的。但它确实是如此：\n\n```javascript\n\
    {\nconsole.log( a ); // undefined; 但仅因为被提升了\nvar a = 1;\n}\n```\n\n而 `let` 的示例：\n\
    \n```javascript\n{\nconsole.log( a ); // ReferenceError: \"a\" 根本未定义\nlet a =\
    \ 1;\n}\n```\n\n在上面的示例中，当尝试打印变量的值时，控制台输出的结果是 `undefined`。在第一情况下，是因为变量被提升了。但在第二个示例中，是因为它没有被提升。\n\
    \n❖ 在全局作用域中。`let` 关键字和旧的 `var` 关键字仍然属于全局作用域。但 `let` 关键字没有绑定到全局 `window` 对象上：\n\
    \n```javascript\nvar a = 1;  // 将绑定到全局 window 对象\nlet b = 1; // 将不会绑定到全局 window\
    \ 对象\nconsole.log(window.a);  // 1\nconsole.log(window.b); // undefined\n```\n\
    \n❖ 在函数作用域中。`let` 和 `var` 关键字在函数作用域内仍然是相同的：\n\n```javascript\nfunction helloThere()\
    \ {\nlet x = 1;// 相同的作用域\nvar y = 1; // 相同的作用域\n}\n```\n\n❖ 在 `for` 语句中。`let`\
    \ 关键字在 `for` 循环内部可见，而 `var` 在整个函数作用域内可见。因此，`let` 关键字限制了在 `{` 和 `}` 括号指定的最相邻块内定义的变量的可见性。下面，让我们先看看\
    \ `var` 传统如何处理作用域：\n\n```javascript\n// 在函数和 for 循环中使用 var 的示例\nfunction helloThereIterator()\
    \ {\n  // i 在理论上在这里也是可见的\n  for (var i = 0; i < 10; i++) {\n    // i 在这里是可见的\n\
    \  }\n}\n```\n\n这可能不是 `var` 关键字最好的示例（因为 for 循环是它最初定义的地方），尽管它在函数中的任何地方都可用。但它仍然说明了这一原理。\n\
    \n传统上，已知 `var` 可以在函数 `{ }` 括号内访问，并对函数作用域隐藏，除非它是 `window` 对象。这是基本规则。但 JavaScript\
    \ 就是复杂于此……而且只有在函数内部没有找到变量时，才会检查 `window` 对象，而这是在函数外部。\n\n作为程序员，确定该变量是否应该在全局作用域内可用是你的责任。这是\
    \ JavaScript 尝试“为所有人提供所有服务”的一个例子。\n\n虽然这种宽松性在很多情况下是有帮助的，并让学习曲线几乎于不存在，但从长远来看，你会遇到这些奇怪的情况，特别是当你的程序在大型项目中达到某些长度时。\n\
    \n现在，让我们来看同样的示例。我们所做的只是将 `var` 替换为 `let` 关键字。这产生了不同的作用域预期。\n\n```javascript\n\
    // let 示例\nfunction helloThereIterator() {\n  // i 在这里不可见\n  for (let i = 0; i\
    \ < 10; i++) {\n    // i 在这里可见，并且在该作用域内部的回调函数中也可见\n  }\n}\n```\n\n❖ `let` 关键字不允许重复声明\n\
    \n`var` 关键字（在严格模式下）允许你在同一作用域内重新声明它的值。但 `let` 关键字并非如此：\n\n```javascript\n'use strict';\n\
    var a = 1; // OK。\nvar a = 2; // OK。a 现在是 2；\n\n'use strict';\nlet a = 1; // OK。\n\
    let a = 2; // 语法错误：标识符 a 已经声明。\n```\n\n❖ `let` 关键字还可以用于避免闭包问题。它将绑定一个新值而不是保留对旧值的引用。\n\
    \n```javascript\n\"use strict\";\nfor (let i = 1; i < 10; i++) {\n  $.ajax(\"\
    url\": \"script.php\", function(msg) {\n    console.log(i); // 变量 i 在丢失了原始作用域，它不再与\
    \ for 循环中定义的 i 变量关联\n  });\n}\n```\n\n这段代码演示了一个常见的 JavaScript 问题，当在 `for` 循环中使用\
    \ `var` 关键字并结合 ajax 调用时经常发生。在这里，由于 `i` 似乎在 ajax 的回调函数内部被重新定义，它不再与 `for` 循环中定义的同一个\
    \ `i` 变量关联。\n\n这个经典问题通常通过将 `i` 变量作为参数传递给函数来避免，这无谓地创建了变量的新实例。\n\n然而，当使用 `let` 定义相同的循环时，情况就不如此了。它有效地解决了这个常见问题。这里是同样的示例，这次使用了\
    \ `let`。\n\n```javascript\n\"use strict\";\nfor (var i = 1; i < 10; i++) {\n \
    \ $.ajax(\"url\": \"script.php\", function(msg) {\n    console.log(i); // 这里的\
    \ i 是最初在 for 循环中定义的那个\n  });\n}\n```\n（注：提供的原文在此处有一个误，写着“这次使用 let”，但代码块中使用 `var\
    \ i`；我保留了逻辑流）。\n\n这确实解决了与循环循环和回调函数相关的很多头疼问题。\n\n❖ 此外，`let` 关键字允许变量的值保持在定义的作用域内，如孤立示例所示：\n\
    \n```javascript\n{\n  let a = 1;\n};\nconsole.log( a ); // 错误：a 未定义\n```\n\n❖\
    \ 换句话说，可以说使用 `var` 关键字定义的变量从定义的那刻起在整个范围内都是的。\n\n而 `let` 关键字仅对其定义的块作用域内部的所有其他作用域可见，即使它是回调函数。这并没有解决任何重大软件问题，但它有助于我们以更直观的方式完成工作，特别是在处理脚本结构中的多个作用域时。\n\
    \n## 新的 `const` 关键字\n\nConst 与 `let` 完全相同。区别在于一旦你使用 `const` 定义了值，在程序的后半部分就无法重新定义。这样做将产生错误：\n\
    \n```javascript\nlet a = 1;\na = 2; // OK，我们只是重新赋值了变量的值\n\nconst a = 1;\na = 2;\
    \ // 错误，这是一个常量，不能重新赋值！\n```\n\n这有什么用？常量变量传统上用于计算机程序中定义在应用程序运行期间不会改变的值。它们非常适合标记值和不应改变的应用设置。\n\
    \n噢，还有一点……当涉及到对象时……只有 `const` 关键字虽然防止了重新赋值，但实际上并没有让赋值的对象变得不可变。与许多其他语言相比，使一个对象变为\
    \ const 也会让它的属性变得不可变。\n\n## 解构赋值\n\nEcmaScript 6 向我们介绍了解构赋值。这是新的 JavaScript 功能。之前对\
    \ `let` 关键字的解释为讨论下一个主题奠定了基础。所以，让我们来看看它们是如何工作的：\n\n```javascript\nlet {a, b} =\
    \ obj;\n```\n"
- fmt: "\nIn this example two variables `a` and `b` are created. Then, properties\
    \ `obj.a` and `obj.b` are taken from the object named `obj`, and assigned to those\
    \ variables respectively. So this is the equivalent of doing something like:\n\
    \n```javascript\nlet a = obj.a;\nlet b = obj.b;\n```\n\nThis format takes a lot\
    \ more space. Destructuring assignments save space and provide better readability\
    \ for our code. Get used to them! :)\n\n## For-of loop\n\nThis is a completely\
    \ new type of a loop in EcmaScript 6. Let's take a look at how it works:\n\n```javascript\n\
    for (let [key, value] of map) { ... }\n```\n\nThis mighty for loop will iterate\
    \ through values stored in `map`. Unfortunately (like many things in JavaScript)\
    \ the `for-of` loops do not work on objects (and their properties). This is almost\
    \ a bewildering design decision. So, what for `for-of` loops can work on?\n\n\
    The `for-of` loops are designed exclusively to work with `Array`, `Map` and `Set`\
    \ objects only.\n\n## The Map object\n\nJust like an `Array` object, ES6 adds\
    \ a new one, called `Map`. `Maps` are nothing more than a simple key/value map.\
    \ They are a lot like associative arrays in PHP.\n\n`Maps` should not be used\
    \ everywhere. Only where you previously used objects as collections. That's what\
    \ they're made for. And using objects should still be primary to your JavaScript\
    \ program design.\n\n`Maps` have a `.size` property which determines its size.\
    \ Unlike objects, where you would have to calculate the size of an object manually.\
    \ Use them together with `for-of` loops when you have collections of data paired\
    \ by key/value association!\n\n## Arrow Functions\n\nOne of the most favored features\
    \ in EcmaScript6 is the arrow functions. I think you should start using them at\
    \ earliest opportunity. Arrow functions are just JavaScript functions written\
    \ in a more compact syntax and that are slightly different than regular functions\
    \ created using the `function` keyword. Here is the basic arrow function syntax\
    \ format, which at first may seem a little odd:\n\n`name = (params) => returned\
    \ expression`\n\nFor example, you can write something like this using an arrow\
    \ function:\n\n```javascript\nx = (a, b) => { console.log(\"This is arrow function\
    \ x with params = \" + a + \" and \" + b) };\n```\n\nBut this is only a function\
    \ definition. It can be executed just like a regular function as follows:\n\n\
    ```javascript\nx(5, 7);\n```\n\nOne radical difference compared to regular JavaScript\
    \ functions is in how arrow functions treat the `this` keyword. It solves fundamentally\
    \ the same (or similar) problem that `let` keyword solves for regular scopes.\
    \ We need to get into a slightly more involved discussion here.\n\nJavaScript\
    \ arrow function is a feature relevant only to EcmaScript 6. It did not exist\
    \ prior to this specification. It adds convenience to making anonymous functions\
    \ within objects easier to use while retaining the value of the `this` object\
    \ inside anonymous event handlers.\n\nArrow functions also modifies the functionality\
    \ of the `this` object used within nameless callback functions within object scope\
    \ definition by automatically binding it to topmost local scope of the object.\
    \ It reminds me a little of `hoisting` (I briefly talk about [hoisting](http://www.developerpost.net/new-javascript-features-in-ecmascript-6.html)\
    \ in my other tutorial).\n\nArrow functions help us escape this/that gymnastics\
    \ (If you're not familiar with what I'm referring to keep on reading, this tutorial\
    \ explains it) inherent to original scope model we've been used to.\n\nArrow functions\
    \ are also known as \"fat arrow\" functions due to their syntax.\n\n```javascript\n\
    (params) => { statement };\n```\n\nJust think of it as a different syntax of defining\
    \ a JavaScript function.\n\nThe rest of this tutorial will explain the difference\
    \ between an older JavaScript example and how arrow functions can be used to improve\
    \ code readability and internally tweak object functionality.\n\nThe aim of arrow\
    \ functions is to solve a fundamental problem that stems from original JavaScript\
    \ language design dealing with object scoping and the automatic `this` keyword\
    \ binding.\n\nAs someone who has developed a canvas-based game engine library\
    \ in JavaScript that required creation and instantiation of `Line`, `Rectangle`,\
    \ `Sprite` and many other useful objects (a library to aid the development of\
    \ a browser-based computer game) like many other web developers, I have faced\
    \ the following issue.\n\nLet's consider we have this simplified version of an\
    \ object called `Sprite` for making game character and enemy object sprites!\n\
    \nAlso let's create a new \"ship\" object of type `Sprite` and instantiate it.\n\
    \n```javascript\n/* A significantly simplified Sprite object in JavaScript */\n\
    var Sprite = function() {\n    this.angle = 5;\n    this.draw = function() {\n\
    \        alert(this.angle); // display sprite's angle\n    }\n};\nvar ship = new\
    \ Sprite(); // instantiate ship\nship.draw(); // draw the ship with this.angle\
    \ rotation angle\n```\n\nNotice the `draw` function. In this simple example we\
    \ output the current angle of rotation for our sprite. In real world circumstance\
    \ the code would be actually more complicated. But this is just an example to\
    \ demonstrate arrow functions in JavaScript.\n\nI know that programming the inner\
    \ mechanics of JavaScript functions have always eluded programmers. The desire\
    \ to \"experiment\" with how things work and go by feelings and hacky results\
    \ is tempting. In the example above the `this` keyword is the same within `Sprite`'s\
    \ own scope and scope of its `draw` function.\n\nWe specified `5` in `Sprite`'s\
    \ scope. Then by referring to it from `Sprite`'s `this.draw` function we simply\
    \ pull its value. Sounds easy! And works as expected. But let's not forget about\
    \ anonymous event functions (also known as callback functions) within JavaScript\
    \ objects.\n\nShall we take a look now? I am building on top of the code we already\
    \ saw in the previous example. So I am repeating it here. But there is a new addition.\
    \ I added `setTimeout` function, which takes an anonymous function and executes\
    \ it.\n\nNotice `setTimeout` now encompasses the following line:\n\n```javascript\n\
    // Notice setTimeout now encompasses the following:\n/* A significantly simplified\
    \ Sprite object in JavaScript */\nvar Sprite = function() {\n    this.angle =\
    \ 5;\n    this.draw = function() {\n        alert(this.angle); // display sprite's\
    \ angle\n    }\n    // New! The following code will execute as part of the\n \
    \   setTimeout(function() {\n        alert(this.angle); // display sprite's angle\
    \ from here\n    }, 1000);\n};\nvar ship = new Sprite(); // instantiate ship\n\
    ```\n\n`in 1 second (1000 milliseconds)` after `Sprite` object is instantiated.\
    \ This is normal behavior of a JavaScript function-object constructor.\n\nI temporarily\
    \ removed `ship.draw();` method by commenting it out. This way only the code highlighted\
    \ in green will be executed, when `Sprite` object is instantiated.\n\nThe `this`\
    \ keyword inside an event handler is automatically assigned to the object on which\
    \ that event happened. Let's run this program and see what happens, in comparison\
    \ to our previous example.\n\nThe alert message will now return:\n\n`Undefined`\n\
    \nThat's because `this.angle` within anonymous `function() { ... }` no longer\
    \ refers to the `this` object from `Sprite` object. And there is no such property\
    \ as `angle` attached to the anonymous function (that was passed as an argument\
    \ to `setTimeout`.)\n\n```javascript\n/* A significantly simplified Sprite object\
    \ in JavaScript */\nvar Sprite = function() {\n    this.angle = 5;\n    this.draw\
    \ = function() {\n        alert(this.angle); // display sprite's angle\n    }\n\
    \    // New! One solution is to create a \"that\" variable still in this scope\n\
    \    var that = this;\n    setTimeout(function() {\n        alert(that.angle);\
    \ // display sprite's angle from here\n    }, 1000);\n};\nvar ship = new Sprite();\
    \ // instantiate ship\n```\n"
