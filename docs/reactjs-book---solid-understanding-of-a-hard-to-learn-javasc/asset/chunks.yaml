    ```javascript

    | render: function() { return <<div> { this.state.name ? this.state.name : <span>Enter
    username here</span> } </div>;} |

    ```


    Notice how HTML and JavaScript code is intertwined without having to open separate
    tags. Both exist within the same JavaScript statements and used almost interchangeably
    without any problem. We''ll get to how this is done in a few moments.


    Of course this isolated example makes almost no sense outside of being used in
    a real-world application. But it shows a few important principles.


    This react code that borrows its JavaScript-cross-HTML syntax from JSX language
    gives us a means to know what the output of a dynamic element will look like by
    briefly looking at the code. React here is trying to be everything to everyone.
    And in some cases you will notice some patterns that almost feel like bringing
    the back end logic into the front end.


    The ternary operator `? :` is used in this example. And basically, it''s saying
    that if the property name exists (not null or undefined) then we should output
    it. If it doesn''t exist, we should output generic "Enter username here" as the
    default message.


    This brings HTML template methodology to a different wavelength. Here, we are
    designing and programming the component at the same time.


    ## Gems and Working in the Mine


    It''s only the first chapter, and I am already delving into complexities of React
    programming. However, let''s get back to basics and break down some important
    principles into smaller tutorial pieces first. It will help us later down the
    road.


    Just like with my jQuery Gems book, we will start with a collection of "gems"
    which is prerequisite knowledge that will provide quick insightful bits of information
    required to move forward. Because the software industry is in transitional times
    right now between `EcmaScript 5` and `6`, it will help us get common quirks out
    of the way and stay focused on what''s important when we get to the rest of the
    lessons in the book.


    If these gems are skipped, certain parts of the book later on might not make a
    lot of sense. Especially if you''ve embarked on studying React as your first contact
    with JavaScript programming.


    But the gems is only one part of the book. They are designed to reduce as much
    turbulence as possible and help you ease into the world of modern JavaScript programming
    with a hint of reactive principles.


    You simply must understand these principles before descending deeper into the
    mine. The gems will sharpen your pick axe. The second part of the book will show
    you the rest of the cave.


    ## React on the Palm of Your Hand


    To make your journey easier, I''ve included this section here representing each
    separate aspect of a React program. Fasten your seatbelt and get ready to absorb
    a lot of new principles! We''re truly taking off into the world of React programming
    now:)


    This is a bird''s eye view explanation going over the most important concepts
    involved in building React programs. I already mentioned that learning React is
    fragmented. And it assumes previous knowledge of advanced programming patterns.


    In this section, I''ll try to break them down into reasonable chunks that can
    be analyzed individually. And as we move forward, this will help you put the pieces
    of the puzzle together. Think of the principles described here are the ideas fueling
    the core engine of React.


    Just because they are neatly outlined here, it doesn''t mean that learning React
    will be easy. But it certainly makes it easier to go through the rest of the book
    by taking your time to familiarize yourself with them.


    # The Essentials


    If you''re familiar with jQuery, you''ve used the dollar sign (`$`) object for
    selecting HTML elements and applying various operations on them.


    But what is a similar building block of React when it comes to HTML elements (not
    components.)? It must be the `createElement` method.


    ```javascript

    React.createElement(type, props, children);

    ```


    And here are a few examples of how you would use `createElement` in practice:


    ```javascript

    let link = React.createElement(''a'', {href: ''#''}, "Save"); let nav = React.createElement(MyNav,
    {flat: true}, link);

    ```


    Here, we programmatically created HTML elements using React method `createElement`.
    Then we have taken the created `link` element and placed it within `nav` element
    to be one of its children.


    Of course in this case `link` is the only child, but multiple links can be used
    as well, as additional arguments separated by comma:


    ```javascript

    let link1 = React.createElement(''a'', {href: ''#''}, "Save"); let link2 = React.createElement(''a'',
    {href: ''#''}, "Delete"); let nav = React.createElement(MyNav, {flat: true}, link1,
    link2);

    ```


    You can go like this forever, adding as many children as required by your application.


    Notice `nav` variable uses `MyNav` without double quotes. This is perfectly fine.
    When we use custom elements (not the standard ones like `a`, `div`, `table`, etc…)
    that we make up ourselves, we must use leading upper case letters. Therefore,
    the navigation element is called `MyNav`. As long as we use the leading capital
    letter `React` knows we''re referring to a custom element. No need to use surrounding
    quotes here.


    In JSX it will translate to something like `<MyNav />`


    Eventually with time as you develop your application, you''ll arrive at full structures
    similar to one depicted in the following example. Note, that here it is a little
    different as I am actually using React statements directly as children arguments:


    ```javascript

    let nav = React.createElement(MyNav, {flat: true}, // children of nav React.createElement(''a'',
    {href: ''#''}, "Save"), React.createElement(''a'', {href: ''#''}, "Load"), React.createElement(''a'',
    {href: ''#''}, "Delete"), React.createElement(''a'', {href: ''#''}, // Alertaner
    // children of AlertCounter React.createElement(''span'', {alerts: 0}, "No Alerts")));

    ```


    Note that some children are simple strings of text. They are used as text nodes
    here. In this case children are used as the innerHTML, when they are not used
    for specifying nested elements.


    Also, here createElement is how you would create a element in ES5 without JSX.
    I''ll explain this in a moment. This is version ES5, for coding pre-2015\. While
    I advocate the use of ES6, I wanted to show you how it''s done in ES5 first. Moreover,
    ES6 is backwards-compatible with ES5\. So, this means that a lot of the time how
    you write react programs will depend on your personal preference.


    What''s important to understand, for now, is that `createElement` takes three
    arguments: `type`, `props`, `children`.


    Here, `type` is the name of the element. For example `A`, `H1`, `DIV`, etc.


    Then we have `props`, which are properties you pass to this component. Props are
    not states, but they can modify states. We''ll draw this distinction later in
    more detail.


    Finally, `children` are just hierarchical elements to be found within its parent
    elements. Create chains of them and type them right into `createElement` function
    as N-number of arguments at the end.


    Another key that unlocks deeper understanding of React here is that all of the
    code above has its equivalents in JSX. The two can be used interchangeably. This
    is the part that actually is exciting, once you truly start understanding how
    it works.


    So, while in ES5, you would use `createElement` function, in JSX (arguably its
    common use is with the rest of ES6 syntax) you could create exactly the same functionality
    by simply writing it out as follows:


    ```javascript

    let link1 = <a href = "#">Save</a>;

    ```


    Now you see where I am going with this? JSX turns HTML into JavaScript statements.
    Here `link1` is object-like representation of the element which is exact equivalent
    to React code we created earlier with `createElement` method.

