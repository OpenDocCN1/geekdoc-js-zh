    \ node 提供 localhost 环境就是没有必要的了。你已经设置好了。\n\n在这种情况下，你可以直接在现有的 Apache httpdoc 文件夹中（或者你机器上映射的任何其他文件夹中）开始编写\
    \ React 程序。只需在该目录下创建一个新文件夹，例如 \"my-react-app\"，然后像往常一样，你的项目将通过类似下面的地址浏览器访问：\n\n\
    `http://localhost/my-react-app`\n\n但是，强烈建议你安装 Node。如果出于某种原因，那是因为它带了命令行版本的 Babel\
    \ 和 JSX 插件，这些插件对于正确设置开发环境是必需的。\n\n在 Mac 终端上安装其实非常直观。但在 PC 上就稍微有点挑战性，特别是如果你以前从未做过的话。\n\
