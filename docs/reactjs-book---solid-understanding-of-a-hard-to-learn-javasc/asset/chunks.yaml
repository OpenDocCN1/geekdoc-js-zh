- fmt: "\n### 2. Modular design\nReact supports modular design that is often associated\
    \ with building large, scalable applications. The reason for this is the advent\
    \ of `EcmaScript 6` specification that came out in 2015 which provides new syntax\
    \ that favors modular methodology, for example the `require` (ES5) and `include`\
    \ (ES6) keywords tie together not only files alone but assume class-based relationship\
    \ between objects. And even though as of this writing `include` keyword is not\
    \ supported in modern browsers (even Chrome) we can begin writing modular programs\
    \ by either using `require`, or transpiling our `ES6` code to `ES5` (that almost\
    \ all browsers do understand by now) before sending it to the browser for rendering.\
    \ When browsers catch up, we will no longer have to transpile. When this takes\
    \ place, React will become an even more common library you'll see everywhere.\
    \ Eventually, modular JavaScript program design will become the norm with or without\
    \ React.\n\n### 3. Scalability\nIn React each HTML element is treated like a programmable\
    \ component that can be nested within other components. Child components have\
    \ parent components associated with them. The relationship between parent and\
    \ children components is established through something known as `props`. Scalability\
    \ of React programs is achieved by making each component a conglomerate of HTML,\
    \ CSS and JavaScript code.\n\n### 4. Flexibility\nReact is more than just a UI\
    \ view library as opposed to what you will probably hear at first when you start\
    \ figuring it out. And that isn't entirely wrong. React gives us ability to create\
    \ lightning-fast interactive components that can be used as elements of our application.\
    \ However, React's utilizes the principle of render targets which allows you to\
    \ send result of your code to just about anywhere, included but not limited to\
    \ front-end view.\n\n### 5. Popularity among Employers\nReact was developed by\
    \ programmers at Facebook after years of studying web applications. More or less,\
    \ it originated from a set of proven software engineering philosophies. Although,\
    \ many of them most traditional JavaScript programmers will not be familiar with.\
    \ When you are learning React, you are learning computer programming principles,\
    \ not just a list of functions and methods, which is the case with other libraries\
    \ such as `jQuery`. In 2016 JavaScript has become the leading language for front-end\
    \ web development. Having React on your resume gives you an edge over your competition\
    \ if you're looking for employment in software industry. The average Sr. JavaScript\
    \ programmer in San Francisco Bay Area makes $120-150K a year.\n\n# Reactive Programming\n\
    \nWhat is this reactive programming anyway? React is a small but powerful library\
    \ written in JavaScript. You can use it by including it on your web page by using\
    \ `SCRIPT` tag. Just like you would any other JavaScript library, like `jQuery`\
    \ for example. \n\nIf you are looking to be prepared for employment at an actual\
    \ software company, simply adding React to your web page isn't enough. It almost\
    \ demands that you understand other areas of web development that go beyond simple\
    \ JavaScript programming. The design of this book is dedicated to help nurture\
    \ that process.\n\nBy using React components, which will be shown throughout many\
    \ examples in this book, you will build an entire application. During many parts\
    \ of this book I will refer to building applications using the React library as\
    \ \"reactive\" programming.\n\nReactive programming is nothing more than a phrase\
    \ made up to represent an alternative way of thinking about building modern web\
    \ applications. Reactive programming is not inherent to programming using the\
    \ `React.js` library itself. It's just a methodology and it happens that `React.js`\
    \ library certainly adopts it as core philosophy.\n\nWhat I mean by this is that\
    \ it's the type of programming methodology that will focus a lot on logical functionality\
    \ of your program. Think about it as a more advanced form of programming compared\
    \ to working with `DOM` in JavaScript, where each visual element of your app not\
    \ only has events associated with them, but can possibly contain custom programs\
    \ that you will write yourself which will determine their function.\n\nWhile React\
    \ is considered to be mostly dealing with the view areas of your application,\
    \ don't believe the myths that React is strictly the \"view\" in the `MVC` (model-view-controller)\
    \ pattern you're probably already familiar with. If not, just know that the `Model\
    \ View Controller` is a programming pattern that separates code from the visual\
    \ elements of an application. You've probably heard the phrase \"separation of\
    \ concerns\" in the past. But the point is that you can either install React,\
    \ learn and get used to its programming style and get a few UI elements designed,\
    \ or you can make it the reason you learn in-depth subjects of web application\
    \ development. The latter, is the approach I have taken while writing this book.\n\
    \nI hope you enjoy this book, learn the React library and explore the possibilities\
    \ offered by modern software development that will train you for making real-world\
    \ web applications.\n\n## The Main Principles of Reactive Programming\n\nBefore\
    \ we even go any further, it's important to mention what we are even doing here.\
    \ We can refer to programming with React as functional templating. Not to be confused\
    \ with functional programming languages. Here I simply mean that your React components\
    \ have a specific function to perform and that this is a way to customize your\
    \ components with unique capabilities. Whereas HTML provides us with a set of\
    \ elements (as HTML tags) that handle the layout of our web application and provide\
    \ interfacing with JavaScript code via attributes, React is that… and a lot more.\n\
    \nReact gives us ability to create compact blocks of code that tell us at a glance\
    \ exactly how your component will render on the screen all in one place, and often\
    \ in a single line of code. This gives tremendous opportunities for giving the\
    \ programmer an immense amount of control over making applications that create\
    \ visual elements and at the same time, give him (or her) the ability to program\
    \ their behavior.\n\nReact programs usually do not deal with separate CSS stylesheets.\
    \ Interfacing with the style is provided via `virtual DOM`. We'll see how that\
    \ works later on in the book.\n\nCompared to traditional HTML, CSS and JavaScript\
    \ approach, where we would have to scout around the the code just to find different\
    \ bits and pieces of just one element, React gives us a way to use programmable\
    \ templates. In standard Ajax-based HTML applications, we're used to seeing code\
    \ such as demonstrated in the following example:\n\n```html\n// HTML\n<div class=\"\
    LoginForm\">\n    <div class=\"Name\"> Enter username.</div>\n</div>\n```\n\n\
    And here is the counterpart jQuery example:\n\n```javascript\n// Ajax counterpart\n\
    $.ajax({\n  url: \"/login.php\",\n  data: {\n    \"username\": \"user1\",\n  \
    \  \"password\": \"abfgh123\"\n  },\n  // login.php returned some data\n  success:\
    \ function(msg) {\n    // Adjust DOM data\n    $(\".Name\").html(msg);\n  }\n\
    });\n```\n\nThis is a purposely simplified example. But you can see how even then,\
    \ the code is located in two separate blocks. One is the HTML layout definition.\
    \ It is almost like a reusable template for LoginForm with some dynamic functionality.\n\
    \nThe second block of code is the actual program that executes an Ajax statement.\
    \ This line of code will load data from a PHP script based on the data passed\
    \ to it (username and password) and returns some type of a message in `msg` variable.\n\
    \nLast, jQuery is used to modify the DOM by replacing the contents of div whose\
    \ class is Name with the message received from the script.\n\nFor a while this\
    \ methodology worked just fine. Over the last several years, this is how we're\
    \ used to working with dynamic elements on a web page. But the brilliance of React,\
    \ is that it takes all that and gives us programmatic control over the HTML and\
    \ dynamic data, all packed in a neat render function:\n"
