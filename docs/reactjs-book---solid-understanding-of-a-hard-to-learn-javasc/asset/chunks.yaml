  trans: '

    这让你的应用程序感觉与众不同，并且节省了带宽。如果你想的话，我们在 2017 年之前一直在构建的非响应式网站其实只是一种懒人的设计理念。仅仅为了查看是否有新提醒就重新加载所有内容，并不是最好的应用程序设计。然而，像
    Facebook 这样的网站一直以来都是这样运行的。现在，这种做法正在一点点发生变化。这就是为什么它们正向响应式实现迈进。


    但响应式编程不仅仅是一堆用于获取数据并替换 HTML 元素的 ajax 调用。它要复杂得多。


    而且由于快速访问相关组件通常是良好应用程序设计的关键，虚拟 DOM（Virtual DOM）便派上了用场。虚拟 DOM 实际上是一种奇特的方式，提供了一种快速修改
    DOM 的方法，同时放弃了速度较慢的旧替代方案。


    虚拟 DOM 绝对选择 `React` 库编写应用程序的巨大优势之一。事实上，当你为 Web 项目添加 `react` 库时，你应当也添加 `react.dom`
    库。两者密不可分。而且所有响应式 JavaScript 应用程序默认都包含了 `React DOM` 库。


    这就是 React 的虚拟 DOM 对你的应用程序易用性产生巨大影响的地方。它让网站具有了原生应用程序的感觉，每个元素都能对触摸事件做出做出响应。


    你可能已经在 Netflix、Facebook 和 Instagram 等网站上看到这种现象开始发生。你实际上可以感觉到这种不同。操作是即时发生的，似乎不需要每次点击按钮都得先等待
    HTTP 请求加载。


    应用程序会立即响应。React 并没有消除 HTTP 带宽，它只是将其降至最低，并仅关注数据是否真的应该传输（例如是否仅仅因为一个按钮点击事件就传输）。


    当然，像 Netflix 和 Amazon 这样的网站会预加载某些数据（例如电影预告片的前 15 秒），无论用户是否点击播放按钮。但通过与其他“响应式”原则相结合，它对
    UI 响应速度产生了巨大影响。


    我们仍然从熟悉的 HTML 元素构建应用，但对每个事件的响应率是由一个显著快于 jQuery 实现的 DOM 带来的。


    为了开始使用虚拟 DOM，你不需要做任何特殊操作。通过利用 React 组件模板模式，你自动在使用 React 自身的虚拟 DOM 遍历。它通过提供与我们熟悉的名称相匹配的驼峰（如
    `className` 和 `fontFamily`）方法和属性，透明地模仿了标准 DOM 模型。


    # Gem 4 - 初始化 React 类的两种不同方式


    在本书的编写期间，Web 仍然处于从 `EcmaScript5` 到 `EcmaScript6` 的某种过渡阶段。当 `EcmaScript 2015` (`ES6`)
    在大约两年前发布时，它在 JavaScript 世界引起了巨大的动荡，并将程序员分成了“老方法”和“新方法”。有些人可以根据情况灵活地使用其中一种风格而非另一种，这没有任何问题。两者之间并无优劣之。


    然而，最终 `ES5` 和 `ES6` 执行的是完全相同的代码。大部分区别在于语法上。无疑，同时在两种不同的语言中工作可能会产生不必要的头疼，特别是当你第一次学习
    React 的时候。


    在 JavaScript 这种松散类型语言中，任何事情根本没有所谓的“一种标准方法”。情况一直如此。


    在创建 React 组件时，区分这种区别至关重要。实现它并没有一种方法。


    在这个 gem 中，我将演示用两种不同的方式创建完全相同的 React 组件。这里的区别是 `EcmaScript5` 和 `EcmaScript6` 本身的区别。


    在大多数情况下，一个显著区别在于 `constructor` (`ES6`) 的使用和专门的 `init state` 函数方法 (`ES5`)。让我们来看。


    EcmaScript5 示例下所示：


    ```javascript

    var NewComponent = React.createClass({ getInitialState() { return { /* initial
    state */ }; });

    ```


    注意，在 `EcmaScript5` 中并不存在 `constructor` 关键字。这就是为什么在这种情况下 React 提供了 `getInitialState`
    函数。如果你在 `ES5` 中编写应用程序，你应该使用此方法来初始化组件的默认状态。


    我们很快就会涉及到状态（states）。因为这是一个非常重要的主题。状态与 React 组件相关联。在规划应用程序时，你应该在组件和它的状态之间建立心理关联。每个组件都负责拥有状态。


    上面我们演示了 `ES5` 语法。我不会告诉你应该使用这两种中的哪一种。


    最终，`ES6` 将在几年内成为新采纳的标准，但许多程序员仍然偏好使用 `ES5` 格式。由于 JavaScript 支持 `ES5` 作为 `ES6` 的子集以兼容未来的应用程序，两者仍然可以工作。


    如果这对你有效，请像下面所示使用 `EcmaScript6`，现在使用了 `ES5` 中不可用的新关键字：`class`、`extends`、`super`
    和 `constructor`：


    ```javascript

    class NewComponent extends React.Component( { constructor(props) { super(props);
    this.state = { /* initial state */ }; }} } );

    ```


    它们是一样的，只是使用了 `ES6` 语法。如果你来自 Java、C# 或 `C++` 语言，你可能更熟悉这种类创建语法，并可能认为优于过时的 `ES5`
    格式。


    注意这里的另一个区别是我们使用 `.Component` 方法来创建组件，而不是 `.createClass`。但本质上，底层发生的是完全相同的事情。


    我知道，用两种不同的方法做同一件事听起来可能很困惑。但在这里你有一个选择：使用 `ES5` 让你的代码在所有浏览器中即箱运行，或者使用 `ES6` 语法并将其转换回
    `ES5`。然而，学习相对新的 `ES6` 语法的优势是你的应用程序看起来会更简洁、更直观。


    这只是我们目前随着 JavaScript 规范成熟而面临的时期。在浏览器完全采用 `EcmaScript 6` 之前，学习这种语法将让你获得学习某些尚未广泛使用的内容的优势，但它们在未来几年内绝对会成为下一个标准。


    我个人的偏好是开始使用 `EcmaScript 6` 语法。这条路可能有点坎坷，但为了在成为更优秀的 JavaScript 程序员方面保持领先，这是一件明智的事。。而这类事情总是需要辛勤的努力。


    # Gem 5 - 状态与生命周期


    在 React 中，每个组件都有一个状态（state）。状态是一个带有值的对象。状态正如其名所示。它是组件的某些状态，通常通过使用数字、布尔值、数组或映射定义的某个或多个标记、参数和设置。


    React 组件的生命周期（Life Cycle）与状态有很大关系。React 提供了几个默认方法来帮助我们编写高效的应用程序。这些方法在下面简要概述。


    每个组件通常会通过以下辅助方法控制自己的状态。它们被设计用于应用程序流程或组件生命周期中的独特时刻修改或更新组件的状态。


    所有这些方法都像下面所示附加到组件对象上。这只是一个简单的示例，展示了这些方法在你的 React 对象中的放置位置。


    让我们来看吧！


    '
- fmt: "\n```javascript\nvar MyComponent = React.createClass( {\n  displayName: 'MyComponent',\
    \ // This is almost like a component's constructor!\n  getInitialState: function()\
    \ { … }, // Component mounting events\n  componentWillMount: function() { … },\n\
    \  componentDidMount: function() { … },\n  componentWillUnmount: function() {\
    \ … },\n  // Component updating events\n  componentWillReceiveProps: function()\
    \ { … },\n  componentWillUpdate: function() { … },\n  componentDidUpdate: function()\
    \ { … },\n  shouldComponentUpdate: function() { … }\n  // Render the component\
    \ to the DOM\n  render: function() { /* return something */ }\n});\n```\n\nThat's\
    \ a whole lot of Wills and Dids. But what do they all mean?\n\nThese methods are\
    \ like the command center of our component!\n\nBelow I'll provide brief descriptions\
    \ for which events during the lifetime of a component each one of these methods\
    \ is responsible for.\n\n`getInitialState` functions like component constructor.\
    \ It is called before the component is rendered on the screen.\n\n`componentWillMount`\
    \ called before `render()` method just once. It is never called again throughout\
    \ component's life cycle. Sometimes used synonymously as component's constructor\
    \ method.\n\n`componentDidMount` called just after the component has been rendered\
    \ for the first time.\n\n`componentWillUnmount` called when the component is about\
    \ to be destroyed. This is a place to clean up memory and delete state.\n\n`componentWillReceiveProps`\
    \ is called when props are passed to the component. For example if you have `Form`\
    \ component and `TextInput` component that allows user to change its value by\
    \ typing text into it. Imagine if `TextInput` has an `onchange` event that passes\
    \ in some props to the component. Soon as the new text is entered into the input\
    \ field, the value is passed to the main component as props. This is the moment\
    \ when `componentWillReceiveProps` is triggered.\n\n`componentWillUpdate` is called\
    \ right before the `render` method is executed on a component. It gives us a chance\
    \ to handle any state changes before next render update.\n\n`componentDidUpdate`\
    \ is called soon after `render()` method has finished updating the DOM.\n\n`shouldComponentUpdate`\
    \ is a default method that always returns true. It gives us control over whether\
    \ the component's element should update in DOM. This isn't always the case. For\
    \ example, if the new results of some state or property in a component equals\
    \ the value of what it was previously set to anyway, it's probably not worth updating\
    \ the DOM. Why send the data to the view if it did not change even after being\
    \ updated?\n\nThese methods are crucial to understanding virtual DOM. As we're\
    \ slowly peeling principles of react programming one by one, it will all start\
    \ making sense.\n\nFor now just know that a react component is usually mounted\
    \ to a render target. This is why some of the default methods mentioned above\
    \ use the word \"mount\" instead of traditional setter or getter methods like\
    \ \"set\" or \"get\" you would expect. Mounting is an idea unique to programming\
    \ with React and the components created within React's virtual DOM ecosystem.\n\
    \nWe've already talked about components theoretically. But what is a component\
    \ in practice? Remember that your application is made up of compartmentalized\
    \ elements. Components can literally be anything from buttons, text input fields,\
    \ check boxes to action status areas for displaying text. You will determine the\
    \ design of your component based on the purpose of your application.\n\nBecause\
    \ we've just discussed methods that deal with \"mounting\" of components, it is\
    \ natural to explore what it means in our next gem!\n\n# Gem 6 - Component Mounting\n\
    \nReact is a library that values programming principles. One of them is the idea\
    \ of components as elements. A component is a programmatic (declarative) way to\
    \ render what you want in your application.\n\nBut React doesn't actually care\
    \ about where or how you choose to render those elements. Whether it is JavaScript\
    \ DOM or elsewhere. This can sound surprising at first, because React is known\
    \ for being primarily as a front end library.\n\nThat is because React uses something\
    \ known as render targets. That is, you determine how the results of a react's\
    \ `render` method will be displayed or passed on elsewhere.\n\nIn other words,\
    \ you can say that React is agnostic when it comes to the output of data or states\
    \ stored within its components.\n\nFor example… you can output data from a component\
    \ to file writing function. In other words, React's rendering target is not limited\
    \ just to UI elements, even though throughout most of this book and react-style\
    \ programming in general this is what you will be dealing with for the most part.\n\
    \nIn previous gem we've talked about how each component takes care of its own\
    \ state. A state could be a boolean flag indicating whether a button is highlighted.\
    \ Or whether a navigation menu option is selected.\n\nNow, if you've been paying\
    \ attention this is where it all starts coming together. A react component is\
    \ a fusion between its state and its rendering method. We're given programmatic\
    \ control over the two most important functions of a UI element in one place.\n\
    \nBut what in the world is mounting? In React we are using a virtual representation\
    \ of the DOM for performance reasons.\n\nBy simply creating a component, no DOM\
    \ elements will be even touched. This is great news but how could it be? This\
    \ is because using native DOM would increase memory imprint of our application.\
    \ However with React's virtual DOM, elements are created only when they are required\
    \ to be used by the application.\n\nI'll explain this in more detail.\n\nReact\
    \ is an isomorphic framework. It's functionality can be mapped to arbitrary output.\
    \ Not just JSX-style HTML UI elements.\n\nThe virtual DOM provided by `react`\
    \ library is exactly just that: virtual. It doesn't physically exists within actual\
    \ JavaScript DOM until it actually needs to be used by the application.\n\nJust\
    \ think about it this way. The JavaScript's DOM is a physical tree of HTML elements\
    \ stored in memory. It is populated while the page is loading into your browser.\n\
    \nUsually, when a web page is loaded into the application, each DOM branch represented\
    \ by HTML element, loads up into the root DOM element regardless of how it will\
    \ be used, or whether it will be shown on the screen. The footer will be loaded\
    \ into DOM, even if it is displayed below the fold in the browser.\n\nReact, on\
    \ the other hand, doesn't even touch that DOM tree. As discussed in one of the\
    \ previous gems, it adds or removes components from or to its own virtual DOM,\
    \ which is stored completely in memory. An element becomes physically represented\
    \ in memory of the render target usually when the component is purposely used\
    \ within your application. It's almost like copying and pasting virtual DOM to\
    \ a render target, whatever it may be. In the case of web applications, it is\
    \ of course the JavaScript DOM tree.\n\nI'll demonstrate it with the following\
    \ example:\n\n```javascript\nvar component = React.createElement( ComponentDefinition\
    \ );\n```\n\nAt this moment `component` is an instance of the React type `ComponentDefinition`\
    \ which I made up just for this example. In reality, it would correspond to a\
    \ component like `LoginScreen`, `NavigationMenu` or `Button`. And it would contain\
    \ the standard component definition code we've already seen in earlier gems in\
    \ the book.\n\nIt's simply a React type. It is not yet physically existent anywhere\
    \ in the primary JavaScript's document (DOM) object. Aside of being a react node\
    \ it is nowhere else to be found. This is because as of yet it has no physical\
    \ purpose in terms of being displayed in your application.\n\nBut this is true\
    \ only until `render` method is executed on this component. Here, `container`\
    \ is just some is of a DIV or other HTML element:\n\n```javascript\nReact.render(component,\
    \ container);\n```\n"
