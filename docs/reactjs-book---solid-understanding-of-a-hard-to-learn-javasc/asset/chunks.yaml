  trans: "\n\n```javascript\nvar Example = React.createClass( { getInitialState: function()\
    \ {\n    return {\n        state: 0;\n    }\n});\n```\n\n你经常会在 React 组件中看到 `getInitialState`。它会重置与组件绑定的默认对象。在这里，你可以从数据库读取值，或者在将此组件渲染到屏幕之前将状态重置为默认值。\n\
    \n你可以将此方法与 EcmaScript 6 提供的默认构造方法替替：\n\n```javascript\nclass Example extends React.Component(\
    \ { constructor: function() {\n    this.state: 0;\n    });\n```\n\n这里唯一的显著区别是，我们正在使用\
    \ `this` 关键字将状态附加到主对象上。\n\n要在组件渲染到屏幕上时访问状态，我们必须使用 `componentDidMount` 方法：\n\n\
    ## 方法 2 - componentDidMount\n\n当组件渲染时，React 会自动调用 `componentDidMount`。通过将其添加到你的自定义\
    \ React 组件中，你实际上是在对其进行重载（overloading）。重载意味着向默认 React 组件对象中已存在的方法中添加你自己的功能，而你正是从该对象扩展了自己的自定义组件。这就是使用\
    \ `extend` 关键字的全部目的。我们正在扩展库已经提供的 React 组件对象的默认功能。\n\n当我第一次听到在我的 React 组件中使用“挂载”（mounting）函数时，我并不理解它的什么意思。我们难道不是简单地为我们的主要\
    \ React 组件附加一组辅助方法吗？\n\n我们在书的早期已经讨论过挂载。如果你仍然需要复习该过程，我建议确保你已经复过之前讨论过的 `Gem 6 -\
    \ Component Mounting`（组件挂载）。\n\n`componentDidMount` 是负责在组件挂载后设置状态的方法。\n\n```javascript\n\
    var Example = React.createClass( { componentDidMount: function() { this.state\
    \ = 1;\n    }});\n```\n\n它意味着虚拟 DOM 已经与 DOM 节点关联，该节点将在屏幕上进行实际更新。该方法在执行组件的 `render`\
    \ 命令后始终会被调用。它们是同义词，可能可以替使用。它确保并告诉我们元素实际上已经存在于虚拟 DOM 中。`render` 方法已经对它调用过了！\n\n\
    ## 方法 3 - componentWillUnmount\n\n最后，`componentWillUnmount` 在组件从页面移除并即将被销毁之前被调用。\n\
    \n```javascript\nvar Example = React.createClass( { componentWillUnmount: function()\
    \ { this.state = null;\n    }});\n```\n\n注意，我们在这里将状态重置为 `null`。组件被销毁了，我们不再需要它的数据。这就是你清理组件所用内存（如果有的话）的地方，例如取消初始化定时器。\n\
    \n# 用 React 编写的完整应用程序示例\n\n我们已经涵盖了编写完整 React 应用所需的原理。我刻意尝试让书中的所有示例都保持简单。复杂性通常源于编程上的创意，如果我直接把一个大型程序丢进这本书，对你可能会产生打击作用而不是激励作用。\n\
    \n在这里，我将构建一个简单的搜索应用，它可以从数组集中查找结果。如果输入的字符与列表中的任何项匹配，它们将被过滤掉，所有其他条目将被忽略。\n\n这个应用非常像\
    \ Google 的搜索自动查询功能，当你向查询输入框输入短语时，项目会掉落。下面我列出了完整的源代码。\n\n在这里，我不会包含应用程序的 CSS 样式表部分。这部分可以单独处理。我们希望严格关注\
    \ React 的实现。\n\n考虑到你使用标准 JavaScript 代码需要完成的所有工作，这个应用相对于其实际功能来说惊讶地紧凑。\n\n## 创建搜索列表\n\
    \n让我们使用 JavaScript 中的对象字面量格式创建潜在搜索结果列表：\n\n```javascript\n// 首先，让我们定义所有可搜索动物的列表\n\
    var libraries = [\n    { name: 'Wolf', url: 'http://localhost/wolf'},\n    { name:\
    \ 'Panther', url: 'https://localhost/panther'},\n    { name: 'Fox', url: 'http://localhost/fox'},\n\
    \    { name: 'Giraffe', url: 'http://localhost/giraffe'},\n    { name: 'Elephant',\
    \ url: 'http://localhost/elephant'},\n    { name: 'Ferret', url: 'http://localhost/ferret'},\n\
    \    { name: 'Lion', url: 'http://localhost/lion'},\n    { name: 'Lioness', url:\
    \ 'http://localhost/lioness'},\n    { name: 'Tiger', url: 'http://localhost/tiger'},\n\
    \    { name: 'Tigress', url: 'http://localhost/tigress'},\n    { name: 'Cat',\
    \ url: 'http://localhost/cat'},\n    { name: 'Dog', url: 'http://localhost/dog'},\n\
    ];\n```\n\n## 编写 React 应用\n\n```javascript\n// 让我们创建搜索组件\nvar SearchComponent\
    \ = React.createClass( {\n    // 将输入元素重置为空格\n    getInitialState: function() {\
    \ return { searchString: '' }; },\n    handleChange: function(e) {\n        //\
    \ 注释掉下一行将导致文本框不改变值，因为输入框不能独立于分配给它的值进行更改。在这种情况下，它是 this.state.searchString。\n \
    \       this.setState({searchString: e.target.value});\n    },\n    // 渲染此组件\n\
    \    render: function() {\n        var libraries = this.props.items;\n       \
    \ searchString = this.state.searchString.trim().toLowerCase();\n        if (searchString.length\
    \ > 0) {\n            // 我们正在搜索。过滤结果。\n            libraries = libraries.filter(function(l){\n\
    \                return l.name.toLowerCase().match(searchString); return <li>{l.name}\
    \ <a href={l.url}>{l.url}</a></li>;\n            });\n        }\n        // 返回此组件的\
    \ JSX 语句\n        return <div>\n            <input type=\"text\" value={this.state.searchString}\
    \ onChange={this.handleChange} placeholder=\"在此输入\" />\n            <ul>\n   \
    \             {libraries.map(function(l) {\n                    return <li>{l.name}\
    \ <a href={l.url}>{l.url}</a></li>;\n                })}\n            </ul>\n\
    \        </div>;\n    }\n});\n// 在页面上渲染 SearchComponent\nReactDOM.render(\n  \
    \  <SearchComponent items={libraries} />,\n    document.getElementById('container')\n\
    );\n```\n\n将此代码放入你应用程序的主 `.js` 文件中并运行。它将产生基础的下拉功能。输入部分动物名称将把它们从主列表中过滤掉。理想情况下，你会从数据库或其他数据存储机制加载此列表。\n\
    \n# EcmaScript 6 - 你需要了解\n\n当 React 创建时，ES5 规范正处于焦点中心。在 2015 年甚至是整个 2016 年，它仍然新颖且新鲜。\n\
    \n然而，到 2017 年，它开始逐渐适应 ES6 语法。这就是为什么在学习 React 时，讨论应用于这一新标准中的重大变化是非常重要的。\n\n"
- fmt: "\nWhen you are learning React, you are learning a lot more than just React.\
    \ It works in ES5 just fine, but that syntax is becoming outdated. And this is\
    \ where many programmers can get puzzled, because essentially the same library\
    \ might not look the same in all the different examples you're seeing on the Internet\
    \ and in books.\n\nIf you don't know React, chances are you probably don't know\
    \ much about EcmaScript 6 at all. I know this is a dangerous assumption to make,\
    \ but I think it can be justified by things you will learn in this chapter.\n\n\
    There really isn't anything wrong with ES5. But it isn't going away anytime soon.\
    \ And I think when writing educational books at a time when the industry is still\
    \ transitioning from one specification into another it's important to occasionally\
    \ juggle between the two.\n\nBut we've come to a place of the book where we will\
    \ now investigate the primary differences and additions to JavaScript in EcmaScript\
    \ 6 specification. At the end of the book I will also provide cheat sheets for\
    \ many of the subjects discussed here.\n\n## The `var` and `let` keywords\n\n\
    In ES6 it's commonly agreed that instead of using `var` keyword we now use `let`\
    \ keyword. There are reasons for this, which are described below:\n\n❖ There is\
    \ no hoisting when using `let` keyword. If you're familiar with JavaScript's hoisting\
    \ mechanism, you will spot a difference when using the new `let` keyword.\n\n\
    Hoisting is when JavaScript moves all variable definitions up the scope in which\
    \ they are defined. This little-known process is done behind the veil. But it\
    \ is in fact true:\n\n```javascript\n{\nconsole.log( a ); // undefined; but only\
    \ because it is hoisted\nvar a = 1;\n}\n```\n\nAnd the `let` example:\n\n```javascript\n\
    {\nconsole.log( a ); // ReferenceError: \"a\" is not defined at all\nlet a = 1;\n\
    }\n```\n\nIn the example above the result coming out of console when making an\
    \ attempt to print out value of a variable is undefined. In first case, it's because\
    \ while the variable is hoisted. But in the second example, because it is not.\n\
    \n❖ In global scope. The `let` keyword and the old `var` keyword are still scoped\
    \ to the global scope. But the `let` keyword is not attached to the global window\
    \ object:\n\n```javascript\nvar a = 1;  // will be attached to global window object\n\
    let b = 1; // will not be attached to global window object\nconsole.log(window.a);\
    \  // 1\nconsole.log(window.b); // undefined\n```\n\n❖ In function scope. The\
    \ `let` and `var` keyword are still identical within function scope:\n\n```javascript\n\
    function helloThere() {\nlet x = 1;// identical scoping\nvar y = 1; // identical\
    \ scoping\n}\n```\n\n❖ In for statements. The `let` keyword is only visible inside\
    \ for-loop while `var` is visible to entire function's scope. So, the `let` keyword\
    \ limits visibility of variables defined within closest enclosing block specified\
    \ by `{` and `}` brackets. Below, let's first take a look at how `var` traditionally\
    \ handles scoping:\n\n```javascript\n// var inside a function and for-loop example\n\
    function helloThereIterator() {\n  // i is theoretically visible here too.\n \
    \ for (var i = 0; i < 10; i++) {\n    // i is visible here.\n  }\n}\n```\n\nPerhaps\
    \ this is not the best example of `var` keyword (because the for loop is where\
    \ it's initially defined) because while it is available everywhere in the function.\
    \ But it still demonstrates the principle.\n\nTraditionally, `var` is known to\
    \ exist for access within the brackets `{ }` of a function and hidden from function's\
    \ scope but only unless it is the window object. This is the basic rule. But JavaScript\
    \ is complicated like that... and if the variable is not found within the function\
    \ itself, only then the window object is checked, which is outside of the function\
    \ itself.\n\nIt is your responsibility as a programmer to determine whether that\
    \ variable should or should not be available from within the global scope. This\
    \ is an example of where JavaScript tries to be \"everything for everyone.\"\n\
    \nWhile this looseness is helpful in many cases and makes the learning curve almost\
    \ non existent, in the long run you will bump into these weird cases, especially\
    \ when your program reaches certain length in large projects.\n\nSo now, let's\
    \ take a look at the same example. The only thing we did was swap the `var` with\
    \ `let` keyword. This produces different scoping expectations.\n\n```javascript\n\
    // let example\nfunction helloThereIterator() {\n  // i is not visible here\n\
    \  for (let i = 0; i < 10; i++) {\n    // i is visible here, and in callbacks\
    \ within this scope itself\n  }\n}\n```\n\n❖ Redeclaration is not allowed with\
    \ `let` keyword\n\nThe `var` keyword (in strict mode) will let you redeclare its\
    \ own value in the same scope. But this is not true with `let` keyword:\n\n```javascript\n\
    'use strict';\nvar a = 1; // Ok.\nvar a = 2; // Ok. a is now 2;\n\n'use strict';\n\
    let a = 1; // Ok.\nlet a = 2; // Syntax error: identifier a is already declared.\n\
    ```\n\n❖ The `let` keyword can also be used to avoid problems with closures. It\
    \ will bind a new value instead of keeping a reference to the old one.\n\n```javascript\n\
    \"use strict\";\nfor (let i = 1; i < 10; i++) {\n  $.ajax(\"url\": \"script.php\"\
    , function(msg) {\n    console.log(i); // the variable i has lost its original\
    \ scope here, it's no longer associated with the i variable defined in the for\
    \ loop\n  });\n}\n```\n\nThis code demonstrates a common JavaScript problem that\
    \ happens quite a lot when using the `var` keyword in a for loop in combination\
    \ with an ajax call. Here, because `i` is seemingly redefined within ajax's callback\
    \ function, it is no longer associated with the same `i` variable that was defined\
    \ within the for loop.\n\nThis classic problem is usually avoided by passing `i`\
    \ variable into the function as a parameter, needlessly creating a new instance\
    \ of the variable.\n\nHowever, this is not true when `let` is used to defined\
    \ the same loop. It effectively resolves this common problem. Here is the same\
    \ example, only this time using `let`.\n\n```javascript\n\"use strict\";\nfor\
    \ (var i = 1; i < 10; i++) {\n  $.ajax(\"url\": \"script.php\", function(msg)\
    \ {\n    console.log(i); // here i is the one that was originally defined in for\
    \ loop\n  });\n}\n```\n*(Note: The original text provided had a typo saying \"\
    only this time using let\" but showed `var i` in the code block; I have preserved\
    \ the logic flow).*\n\nThis definitely saves many headaches associated with for\
    \ loops and callback functions.\n\n❖ Moreover, the `let` keyword allows us to\
    \ keep the value of the variable to the scope it was defined in, as shown in this\
    \ isolated example:\n\n```javascript\n{\n  let a = 1;\n};\nconsole.log( a ); //\
    \ Reference error: a is undefined\n```\n\n❖ In other words, it can be said that\
    \ a variable defined using `var` keyword is known throughout the function in which\
    \ it is defined, since the moment it is defined.\n\nWhereas the `let` keyword\
    \ is only known by the scope block in which it is defined and all other scopes\
    \ within it even it's a callback function. This doesn't solve any major software\
    \ problems but it certainly helps us get things done in a more intuitive way,\
    \ especially when dealing with the web of multiple scopes in our script's program\
    \ structure.\n\n## The new `const` keyword\n\nConst is exactly like `let`. The\
    \ only difference is that once you define a value using `const` it cannot be redefined\
    \ later on in your program. Doing this will produce an error:\n\n```javascript\n\
    let a = 1;\na = 2; // this is ok, we simply reassigned the value of a variable\n\
    \nconst a = 1;\na = 2; // error, this is a constant and cannot be reassigned!\n\
    ```\n\nHow is this useful? Constant variables are traditionally used in computer\
    \ programs to define values that will not change at runtime throughout your application.\
    \ They are great for flag values and app configuration settings that should not\
    \ change.\n\nOh, and one more thing… When it comes to objects only… `const` keyword,\
    \ while prevents re-assignment does not actually make the assigned object immutable.\
    \ In contrast to many other languages, making an object const would make its properties\
    \ immutable as well.\n\n## Destructuring assignment\n\nEcmaScript 6 introduces\
    \ us to destructuring assignments. This is new JavaScript functionality. The previous\
    \ explanations of `let` keyword laid the groundwork for discussing this next subject.\
    \ So let's take a look at how they work:\n\n```javascript\nlet {a, b} = obj;\n\
    ```\n"
  raw: 'When you are learning React, you are learning a lot more than just React.
    It works in ES5 just fine, but that syntax is becoming outdated. And this is where
    many programmers can get puzzled, because essentially the same library might not
    look the same in all the different examples you''re seeing on the Internet and
    in books.


    If you don''t know React, chances are you probably don''t know much about EcmaScript
    6 at all. I know this is a dangerous assumption to make, but I think it can be
    justified by things you will learn in this chapter.


    There really isn''t anything wrong with ES5. But it isn''t going away anytime
    soon. And I think when writing educational books at a time when the industry is
    still transitioning from one specification into another it''s important to occasionally
    juggle between the two.


    But we''ve come to a place of the book where we will now investigate the primary
    differences and additions to JavaScript in EcmaScript 6 specification. At the
    end of the book I will also provide cheat sheets for many of the subjects discussed
    here.


    ## The var and let keywords


    In ES6 it''s commonly agreed that instead of using var keyword we now use let
    keyword. There are reasons for this, which are described below:


    ❖ There is no hoisting when using let keyword. If you''re familiar with JavaScript''s
    hoisting mechanism, you will spot a difference when using the new let keyword.


    Hoisting is when JavaScript moves all variable definitions up the scope in which
    they are defined. This little-known process is done behind the veil. But it is
    in fact true:


    {


    console.log( a ); // undefined; but only because it is hoisted


    var a = 1;


    }


    And the let example:


    {


    console.log( a ); // ReferenceError: "a" is not defined at all


    let a = 1;


    }


    In the example above the result coming out of console when making an attempt to
    print out value of a variable is undefined. In first case, it''s because while
    the variable is hoisted. But in the second example, because it is not.


    ❖ In global scope. The let keyword and the old var keyword are still scoped to
    the global scope. But the let keyword is not attached to the global window object:


    vara = 1;   // will be attached to global window object


    letb = 1; // will not be attached to global window object


    console.log(window.a);  // 1


    console.log(window.b); // undefined


    ❖ In function scope. The let and var keyword are still identical within function
    scope:


    function helloThere() {


    let x = 1;// identical scoping


    var y = 1; // identical scoping


    }


    ❖ In for statements. The let  keyword is only visible inside for-loop while var
    is visible to entire function''s scope. So, the let  keyword limits visibility
    of variables defined within closest enclosing block specified by { and } brackets.
    Below, let''s first take a look at how var traditionally handles scoping:


    // var inside a function and for-loop example


    function helloThereIterator() {


    // i is theoretically visible here too.


    for (var i = 0; i < 10; i++) {


    // i is visible here.


    }


    }


    Perhaps this is not the best example of var keyword (because the for loop is where
    it''s initially defined) because while it is available everywhere in the function.
    But it still demonstrates the principle.


    Traditionally, var is known to exist for access within the brackets { } of a function
    and hidden from function''s scope but only unless it is the window object. This
    is the basic rule. But JavaScript is complicated like that... and if the variable
    is not found within the function itself, only then the window object is checked,
    which is outside of the function itself.


    It is your responsibility as a programmer to determine whether that variable should
    or should not be available from within the global scope. This is an example of
    where JavaScript tries to be "everything for everyone."


    While this looseness is helpful in many cases and makes the learning curve almost
    non existent, in the long run you will bump into these weird cases, especially
    when your program reaches certain length in large projects.


    So now, let''s take a look at the same example. The only thing we did was swap
    the var over with let keyword. This produces different scoping expectations.


    // let example


    function helloThereIterator() {


    // i is not visible here


    for (let i = 0; i < 10; i++) {


    // i is visible here, and in callbacks within this scope itself


    }


    }


    ❖ Redeclaration is not allowed with let keyword


    The var keyword (in strict mode) will let you redeclare its own value in the same
    scope. But this is not true with let keyword:


    ''use strict'';


    var a = 1; // Ok.


    var a = 2; // Ok. a is now 2;


    ''use strict'';


    let a = 1; // Ok.


    let a = 2; // Syntax error: identifier a  is already declared.


    ❖ The let keyword can also be used to avoid problems with closures. It will bind
    a new value instead of keeping a reference to the old one.


    "use strict";


    for (let  i = 1; i < 10; i++) {


    $.ajax("url": "script.php", function(msg) {


    console.log(i); // the variable i has lost its original scope here, it''s no longer
    associated with the i variable defined in the for loop


    } );


    }


    This code demonstrates a common JavaScript problem that happens quite a lot when
    using the var keyword in a for loop in combination with an ajax call. Here, because
    i is seemingly redefined within ajax''s callback function, it is no longer associated
    with the same i variable that was defined within the for loop.


    This classic problem is usually avoided by passing i variable into the function
    as a parameter, needlessly creating a new instance of the variable.


    However, this is not true when let is used to defined the same loop. It effectively
    resolves this common problem. Here is the same example, only this time using let.


    "use strict";


    for (var i = 1; i < 10; i++) {


    $.ajax("url": "script.php", function(msg) {


    console.log(i); // here i is the one that was originally defined in for loop


    } );


    }


    This definitely saves many headaches associated with for loops and callback functions.


    ❖ Moreover, the let keyword allows us to keep the value of the variable to the
    scope it was defined in, as shown in this isolated example:


    {


    let  a = 1;


    };


    console.log( a ); // Reference error: a is undefined


    ❖ In other words, it can be said that a variable defined using var keyword is
    known throughout the function in which it is defined, since the moment it is defined.


    Whereas the let keyword is only known by the scope block in which it is defined
    and all other scopes within it even if it''s a callback function. This doesn''t
    solve any major software problems but it certainly helps us get things done in
    a more intuitive way, especially when dealing with the web of multiple scopes
    in our script''s program structure.


    ## The new const keyword


    Const is exactly like let. The only difference is that once you define a value
    using const it cannot be redefined again later on in your program. Doing this
    will produce an error:


    let a = 1;


    a = 2; // this is ok, we simply reassigned the value of a variable


    const a = 1;


    a = 2; // error, this is a constant and cannot be reassigned!


    How is this useful? Constant variables are traditionally used in computer programs
    to define values that will not change at runtime throughout your application.
    They are great for flag values and app configuration settings that should not
    change.


    Oh, and one more thing… When it comes to objects only… const keyword, while prevents
    re-assignment does not actually make the assigned object immutable. In contrast
    to many other languages, making an object const would make its properties immutable
    as well.


    Not so in JavaScript.


    ## Destructuring assignment


    EcmaScript 6 introduces us to destructuring assignments. This is new JavaScript
    functionality. The previous explanations of let keyword laid the groundwork for
    discussing this next subject. So let''s take a look at how they work:


    let {a, b} = obj;'
