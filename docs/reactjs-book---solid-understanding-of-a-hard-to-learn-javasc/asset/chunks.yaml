  trans: "\n\n### 2. 模块化设计\nReact 支持模块化设计，这通常与构建大型可扩展应用程序相关。其原因在于 2015 年发布的 `EcmaScript\
    \ 6` 规范的出现，它提供了有利于模块化方法的新语法，例如 `require` (ES5) 和 `include` (ES6) 关键字不仅可以连接单个文件，还假定了对象之间的类关系。尽管在编写本文时，`include`\
    \ 关键字在现代浏览器（甚至是 Chrome）中尚未获得支持，但我们仍然可以通过使用 `require` 或者在将我们的 `ES6` 代码编译为 `ES5`（现在几乎所有浏览器都能理解）之前发送到浏览器进行渲染，来开始编写模块化程序。当浏览器追上进度时，我们就不再需要编译了。当这种情况发生时，React\
    \ 将成为你随处可见的更常见的库。最终，无论是否有 React，模块化的 JavaScript 程序设计都将成为常态。\n\n### 3. 可扩展性\n在\
    \ React 中，每个 HTML 元素都被视为一个可以编程的组件，它可以嵌套在其他组件中。子组件与其父组件关联。父子组件之间的关系通过被称为 `props`\
    \ 的机制建立。React 程序的可扩展性通过使每个组件成为 HTML、CSS 和 JavaScript 代码的集合体来实现。\n\n### 4. 灵活性\n\
    React 不仅仅是一个 UI 视图库，这与你开始研究它时可能听到的说法不同。尽管这并不完全错误。React 赋予我们创建极速交互式组件的能力，这些组件可以作为应用程序元素元素。然而，React\
    \ 利用了渲染目标的原则，这允许你将代码的结果发送到几乎任何地方，包括但不限于前端视图。\n\n### 5. 在雇主中的受欢迎程度\nReact 是由 Facebook\
    \ 的程序员在研究多年 Web 应用程序后开发的。多或少，它源于一组经过验证的软件工程哲学。尽管其中许多理念大多数传统的 JavaScript 程序员可能并不熟悉。当你学习\
    \ React 时，你学到的是计算机编程原理，而不仅仅是一系列函数和方法列表，这与 `jQuery` 等其他库的情况不同。2016 年，JavaScript\
    \ 已经成为前端 Web 开发的主流语言。如果你正在寻找软件行业的工作，在简历上拥有 React 将让你比竞争对手更具优势。旧金山湾地区的资深 JavaScript\
    \ 程序员平均年薪为 12 万至 15 万美元。\n\n# 响应式编程\n\n到底什么是响应式编程？React 是一个用 JavaScript 编写的小而强大的库。你可以通过使用\
    \ `SCRIPT` 标签将其包含在网页中来使用。就像使用任何其他 JavaScript 库一样，例如 `jQuery`。\n\n如果你想为在真正的软件公司工作准备，仅仅将\
    \ React 添加到你的网页是不够的。它几乎要求你理解简单的 JavaScript 编程之外的 Web 开发其他领域。本书的设计旨在帮助这一过程。\n\n\
    通过使用 React 组件（书中许多示例中将展示它们），你将构建整个应用程序。在本书的许多部分，我将使用 React 库构建应用程序称为“响应式”编程。\n\
    \n响应式编程只不过是一个为了代表构建现代 Web 应用程序的另一种思考方式而提出的术语。响应式编程并非内置于使用 `React.js` 库本身。它只是一种方法论，恰好\
    \ `React.js` 库确实将其纳为核心哲学。\n\n我的意思是，这种编程方法将非常关注程序的逻辑功能。将其考虑为与在 JavaScript 中处理 `DOM`\
    \ 相比更高级的编程形式，在后者中，你应用程序的每个视觉元素不仅关联有事件，而且可能包含你自己编写的自定义程序，这些程序将决定它们的功能。\n\n虽然 React\
    \ 被认为主要处理应用程序的视图区域，但不要相信 React 严格是你可能已经熟悉的 `MVC`（模型-视图-控制器）模式中的“视图”这种迷言。如果不是，只需知道\
    \ `Model View Controller` 是一种将代码与应用程序视觉元素分离的编程模式。你过去可能听过“关注点分离”这个说法。但重点在于，你可以安装\
    \ React，学习并习惯它的编程风格并设计几个 UI 元素，或者让你成为深入学习 Web 应用程序开发主题的原因。后者是我写这本书时采取的方法。\n\n\
    我希望你喜欢这本书，学习 React 库并探索现代软件开发提供的可能性，这些可能性将训练你制作真实的 Web 应用程序。\n\n## 响应式编程的核心原理\n\
    \n在我们继续之前，提到我们在这里的做什么是非常重要的。我们可以将使用 React 编程称为函数式模板化。不要与函数式编程语言混淆。在这里，我仅仅是指你的\
    \ React 组件有要执行的特定函数，这是用独特能力定制组件的方法。而 HTML 为我们提供了一组元素（作为 HTML 标签），来处理我们 Web 应用程序的布局，并通过属性与\
    \ JavaScript 代码提供接口，React 是这些……以及更多。\n\nReact 赋予了我们创建紧凑代码块的能力，让我们一眼就能看出你的组件如何在屏幕上渲染，所有这些都在一个地方，通常在单行代码中。这为程序员在创建创建视觉元素的应用程序方面提供了巨大的控制机会，同时赋予了他（或她）编写其行为的能力。\n\
    \nReact 程序通常不处理单独的 CSS 样式表。与样式的接口通过 `virtual DOM` 提供。我们将在书的后续部分查看它是如何工作的。\n\n\
    与传统的 HTML、CSS 和 JavaScript 方法相比（在那种方法中，我们必须在代码中到处寻找单个元素的不同片段），React 为我们提供了一种使用可编程模板的方法。在基于\
    \ Ajax 的 HTML 中，我们习惯看到如示例所示的代码：\n\n```html\n// HTML\n<div class=\"LoginForm\"\
    >\n    <div class=\"Name\"> 输入用户名。</</div>\n</div>\n```\n\n这里是对应的 jQuery 示例：\n\
    \n```javascript\n// Ajax counterpart\n$.ajax({\n  url: \"/login.php\",\n  data:\
    \ {\n    \"username\": \"user1\",\n    \"password\": \"abfgh123\"\n  },\n  //\
    \ login.php 返回了某些数据\n  success: function(msg) {\n    // 修改 DOM 数据\n    $(\".Name\"\
    ).html(msg);\n  }\n});\n```\n\n这是一个刻意简化的示例。但你可以看到即使是这样，代码也位于两个独立的块中。一个是 HTML 布局定义。它几乎是一个带有某些动态功能的复用模板。\n\
    \n第二个代码块是执行 Ajax 语句的实际程序。此行代码将根据传递它的数据（用户名和密码）从 PHP 脚本加载数据，并在变量 `msg` 中返回某种类型的消息。\n\
    \n最后，jQuery 用于修改 DOM，用从脚本收到的消息替换类为 Name 的 div 内容。\n\n在一段时间内，这种方法工作得很好。在过去的几年里，这就是我们习惯的处理网页上动态元素的方式。但\
    \ React 的精妙之处在于，它整合了这一切，并赋予我们对 HTML 和动态数据的程序化控制，而这些都封装在一个整洁的 render 函数中：\n\n"
