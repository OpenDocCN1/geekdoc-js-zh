    This new array method copies a sequence of items within itself as an array, starting
    at the position indicated by start and  starting  from index indicated by target:


    | arr.copyWithin(target, start[, end = this.length]  ); |


    Here is a practical example:


    |  var arr1 = [1,1,1, 2,2,2, 3,3,3];     // copy first 3 indices to last 3    
    arr1.copyWithin(6, 0, 3); alert(arr1); // 1,1,1, 2,2,2, 1,1,1 |


    This code, apparently copies the "1,1,1" sequence, starting at 0 index in the
    array and copies it over to the last 3 indices, that start at target index of
    6. This is a lot like memory operations in C++, except with arrays.


    ### New Built-in Classes


    Built in classes are the pre-existing objects that come packaged with JavaScript.
    For example the familiar ones are Object, Array, Function, Date, Math and a few
    others… EcmaScript 6 adds several new built in classes which are listed below:


    1.  Map a set of key/value pairs. Almost like an array.


    2.  Set is like map, except where each stored value is unique.


    3.  Symbol is used to make private object/class properties.


    4.  Promise manages an event that will take place at a future time.


    Promises are interesting because all events usually take place at a future time
    anyway. What''s so different about a promise? The proper explanation would be
    to say that they will take place regardless of whether the structure of your HTML
    document changes. These special events, called "promises" guarantee that the event
    will take place at some time in the future.


    One of the problems promises solve is the classic case when HTML element''s events
    (such as onclick) are overwritten by code that updates visual aspects of your
    application. Because this happens often in an actively updated front-end view,
    some events might not be triggered at all, just because DOM was rewritten.


    A promise can exist "in the future" regardless of what happens to DOM structure
    of your site, so long as the integrity of the original DOM remains the same, or
    similar to one that existed at the moment when the event was executed.


