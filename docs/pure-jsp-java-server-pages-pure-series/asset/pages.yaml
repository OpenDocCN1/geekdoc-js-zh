    # Chapter 20: The javax.servlet Package


    # Overview


    The javax.servlet package is at the core of all servlet development. It contains
    the generic interfaces, classes, and exceptions that are implemented and extended
    by all servlets. Figure 20.1 contains the javax.servlet object model.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_197_0.png)


    Figure 20.1: The javax.servlet object model.


    # javax.servlet Interfaces


    Interfaces of the javax.servlet package include RequestDispatcher, Servlet, ServletConfig,
    ServletContext, ServletRequest, ServletResponse, and SingleThreadModel. Each is
    described in the following sections, along with its methods.'
  merge: -1
