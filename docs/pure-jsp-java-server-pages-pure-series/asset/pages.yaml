    spWriter is an abstract class that enables some of the functionality found in
    the java.io.BufferedWriter and java.io.PrintWriter classes. However, JspWriter
    differs from these other classes in that it throws a java.io.IOException from
    the print methods where PrintWriter does not. JspWriter class has four fields
    and numerous methods, as described in the following sections.


    # NO_BUFFER Field


    public static final int NO_BUFFER


    This field is a constant indicating that the writer is not buffering output.


    # DEFAULT_BUFFER Field


    public static final int DEFAULT_BUFFER


    This field is a constant indicating that the writer is buffered and is using the
    implementation default buffer size.


    # bufferSize Field


    protected int bufferSize


    This field indicates the writer''s buffer.


    # autoFlush Field


    protected boolean autoFlush


    This field indicates whether the buffer will be automatically flushed.


