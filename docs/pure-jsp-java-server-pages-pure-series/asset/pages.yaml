  md: 'The PageContext object provides a number of useful tools to the page or component
    author and the page implementer. A list of some of these tools includes


    +   - A single API to manage the various scoped namespaces

    - A convenience of APIs to access various public objects

    - A mechanism to obtain the JspWriter for output

    - A mechanism to manage session usage by the page

    - A mechanism to expose direct attributes to the scripting environment

    - A mechanism to forward or include the current active components in the application

    - A mechanism to handle error exception processing


    The PageContext class has numerous fields and methods, as described in the following
    sections.


