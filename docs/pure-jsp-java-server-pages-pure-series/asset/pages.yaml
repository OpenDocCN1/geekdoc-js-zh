  md: '# The Java Servlet Architecture


    Two packages make up the servlet architecture: the javax.servlet and javax.servlet.http
    packages. The javax.servlet package contains generic interfaces and classes that
    are implemented and extended by all servlets. The javax.servlet.http package contains
    the classes that are extended when creating HTTP-specific examples. An example
    of a simple servlet that responds with HTML


    At the heart of this architecture is the interface javax.servlet.Servlet. It provides
    the framework for all servlets. The Servlet interface defines five methods. The
    three most important are as follows:


    +   - init() — initializes a servlet

    - service() — receives and sends client requests

    destroy() — performs cleanup


    All servlets must implement this interface, either directly or through inheritance.
    It is a very object-oriented approach that makes the servlet very easy to extend.
    Figure 2.2 is an object model that gives you a high-level view of the servlet
    framework.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_17_0.png)


    **Figure 2.2**: A high-level object model of the servlet framework.


    # GenericServlet and HttpServlet


    The main classes are the GenericServlet and HttpServlet classes. The HttpServlet
    class is extended from GenericServlet. When you are developing your own servlets,
    you will most likely be extending one of these two classes. If you are going to
    be creating Web Applications, then you will be extending the HttpServlet class.
    Java servlets do not have a main() method, which is why all servlets must be managed
    by a container. The container calls the service() method every time a server receives
    a request that points to a servlet, it calls the service() method.


    If you decide to extend the GenericServlet, you must implement the service() method.
    The GenericServlet.service() method has been defined as an abstract method in
    order for you to follow this framework. The service() method prototype is defined
    as follows:


    ```

    public abstract void service(ServletRequest request)


    ServletResponse service(ServletRequest request) throws ServletException, IOException;

    ```


    The two objects that the service() method receives are ServletRequest and ServletResponse.
    The ServletRequest object holds the information that is sent to the servlet, whereas
    the HttpServletResponse object is where you place the data you want to send back
    to the server. Figure 2.3 diagrams the flow of a GenericServlet request.'
