    You can see that the generated servlet gets a reference to the current ServletContext
    and stores it in the application. The application object has application scope,
    which means that it is available to all JSPs until the JSP engine is shut.

    The application object is most often used to access environment information. One
    of the more common pieces of information accessed by the application object is
    objects that are stored in the ServletContext. These objects are stored so that
    they will be available the whole time the servlet engine is running.


