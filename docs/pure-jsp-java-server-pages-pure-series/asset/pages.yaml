    # Chapter 1: JSP Overview: The Components of a JavaServer Page


    Overview

    JavaPages, also known as JSPs, are a simple but powerful technology used to generate
    dynamic HTML on the server side. They are a direct extension of servlets and provide
    a way to separate content generation from content presentation. The JSP engine
    is another servlet that is mapped to the extension *.jsp. The following code contains
    a simple example of a JSP file:


    ```

    <HTML>

    <BODY>


    <% out.println("HELLO WORLD"); %>


    </BODY>

    </HTML>

    ```


    Its output would look like Figure 1.1.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_7_0.png)


    Figure 1.1: Output of the JSP example.

    You can see that this document looks like any other HTML document with some added
    tags containing Java code. The source code is stored in a file HelloHelloWorld.jsp
    and copied to the document directory of the Web server. When a request is made
    for this document, the server recognizes the *.jsp extension and realizes that
    special handling is required. The first time the document is requested, it is
    compiled into a servlet and stored in memory, and the output is sent back to the
    requesting client. After the first request, the server checks to see whether the
    *.jsp file has changed. If it has not changed, then the server invokes the previously
    compiled servlet. In this object and throughout the book, we will be discussing
    just how JSPs work and how to use them. Figure 1.2 shows these steps graphically.'
