  md: 'In Chapter 16, "JSP Communication with Servlets," you learn how you can use
    JSPs and servlets using the Model-View-Controller design pattern.


    # Chapter 16: JSP Communication with Servlets


    # Overview


    In this chapter we are going to discuss how you can incorporate servlets and JSPs
    using the Model-View-Controller design pattern (MVC). The MVC originated from
    Smalltalk and was designed to use interfaces, where the application was made of
    three classes: *Model*, *View*, and a *Controller*. Each of these classes is defined
    in Table 16.1.


    **Table 16.1: The Classes of the MVC**


    | Class | Definition |

    | --- | --- |

    | Model | The *Model* represents the data or application object. It is what is
    being manipulated and presented to the user. |

    | View | The *View* is the screen representation of the Model. It is the object
    that presents the current state of the *Model*. |

    | Controller | The *Controller* defines the user interface reacts to the user''s
    input. The *Controller* is the object that manipulates the *Model*. |


    The major benefit of MVC design pattern is that it separates the *Views* and *Models*.
    This makes it possible to create and change *Views* without having to change the
    *Model*. It also allows a *Model* to be represented by multiple Views.


    # A Servlet-Only Application Model


    While servlets are a very sound technology and are excellent for server-side processing,
    they do have drawbacks when used alone. Two of the most common of these drawbacks
    are


    +   - Servlets require an advanced level of Java understanding that HTML programmers
    usually do not have.

    - Servlets generally require recompilation in order to change the client presentation
    layer.


    If we consider these servlet drawbacks, we can determine that one of the greatest
    strengths of servlets is their server-side processing capability.


    # A JSP-Only Solution


    Java Pages are also a very solid technology. Because JSPs are an extension of
    servlets, you can do just anything with a JSP that you can with a servlet. As
    we have been discussing this throughout, one of the JSP-only application model
    is that your application becomes more complicated, so does your script code. This
    results in confusing and difficult-to-maintain JSPs. If you plan on letting your
    HTML programmers maintain your JSPs, which is very common, then they are going
    to have a pretty good understanding of Java. This results in a very unclear definition
    of the programmer''s role. It also requires a very skilled programmer.


    # A Server-Side Implementation of the MVC


    The real power of JSPs and servlets comes when they are used together. In this
    section, we define a server-side implementation of the MVC, where the *Model*
    is a JavaBean, a shopping cart, that represents the data is being transmitted
    or received. The *Controller* is a servlet that transmits receives data, and the
    *View* is a JSP that presents the results of the performed transaction. Figure
    16.1 models the steps involved in a server-side implementation of the MVC.'
