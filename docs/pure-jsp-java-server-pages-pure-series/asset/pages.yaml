    # application

    Beans with application scope are accessible within paging requests that are in
    the same application space as the page in which they were created. References
    to the object will be released when the runtime environment relaxes the ServletContext.
    More simply, this means, until the JSP engine is restarted, the bean created with
    application scope will be available. Beans with application scope are best used
    when you need to share information between JSPs and servlets for the life of your
    application.


