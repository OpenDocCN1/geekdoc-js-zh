  md: 'When you use the two-tier database access model, your Java application talks
    directly to the database. This is accomplished through the use of a JDBC driver,
    which sends commands directly to the database. The results of these commands are
    sent back from the database directly to the application. Figure 4.1 shows the
    two-tier model.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_38_0.png)


    **Figure 4.1: The two-tier JDBC model.** The three-tier model, as you might have
    guessed, is a little more complicated. When you use the three-tier model, the
    JDBC driver sends commands to a middle-tier, which in turn sends commands to the
    database. The results of these commands are sent back to the middle-tier, which
    communicates back to the application. Figure 4.2 shows the three-tier model.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_38_1.png)


    **Figure 4.2: The three-tier JDBC model.**


    # JDBC Driver Types


    Sun has defined four JDBC driver types:


    +   - JDBC-ODBC Bridge, plus JDBC driver

    - Native-API, partly-Java driver

    - JDBC-net, pure Java driver

    - Native-protocol, pure Java driver


    Each of these types meets a different application, as we''ll discuss in the following
    sections.


    **Type 1: JDBC-ODBC Bridge, Plus ODBC Driver**

    The first type of JDBC driver is the JDBC-ODBC Bridge. This driver type is provided
    by Sun with the JDK 1.1 and later. It provides JDBC access to databases through
    ODBC drivers. The JDBC driver must be configured on the client for the bridge
    to work. This driver type is commonly used for prototyping or when there is no
    JDBC driver available for a particular Database Management System (DBMS). Figure
    4.3 shows the driver interaction of the JDBC-ODBC Bridge.'
