    # ## Interfaces


    The javax.servlet.jsp package has two interfaces, HttpServletPage and JPage.


    # ## HttpServletPage Interface


    public interface HttpServletPage extends JspPage

    This is the interface that a JSP processor-generated class for the HTTP protocol
    must satisfy. HttpServletPage and defines a single method.


    # ## _jspService() Method


    public void _jspService(HttpServletRequest request, HttpServletResponse response)
    throws ServletException, IOException

    The _jspService() method corresponds to the body of the JSP page. It is defined
    automatically by the JSP processor and should never be redefined by the JSP author.
    It returns no value.


    # ## Parameters


    +   - HttpServletRequest

    - HttpServletResponse


    # ## Exceptions Thrown


    +   - javax.servlet.ServletException

    - java.io.IOException'
