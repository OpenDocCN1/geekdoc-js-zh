  md: '![](img/0a7b874e847f0fd5d3ace939bc19799d_39_0.png)


    # ### Type 2: Native-API Driver


    The native-api driver converts JDBC commands into DBMS-specific native calls.
    This is much like the restriction of Type 1 drivers. The client must have some
    binary code loaded on its machine. These drivers have an advantage over Type 1
    drivers, because they interface directly with the database. Figure 4.4 shows the
    interactions of a Type 2 driver.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_39_1.png)


    # ### Type 3: JDBC-Net, Pure Java Driver


    The JDBC-Net drivers are a three-tier solution. This type of driver translates
    JDBC calls into a database-independent network protocol which is sent to a middleware
    server. This server translates this DBMS-independent protocol into a DBMS-specific
    protocol, which is sent to a particular database. The results are routed back
    through the middleware server and sent back to the client. This type of solution
    makes it possible to implement a pure Java client. It also makes it to swap databases
    without affecting the client. This is by far the most flexible JDBC solution.
    Figure 4.5 shows this three-tier solution.'
