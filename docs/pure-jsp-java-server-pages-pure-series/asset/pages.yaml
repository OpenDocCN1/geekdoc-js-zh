    # TagData Class


    public class TagData extends java.lang.Object

    implements java.lang.Cloneable

    This class encapsulates Tag instance attributes and values. Often, this data is
    fully static in the case where none of the attributes have runtime exceptions
    as their values. Thus this is intended to expose an immutable interface to a set
    of mutable attribute/pair values. This class implements Cloneable, so that implementations
    create a static instance and clone it before adding the request-time expressions.
    The TagData class has two fields and five methods, described in the following
    sections.


