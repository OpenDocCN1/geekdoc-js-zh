    # <jsp:plugin>:


    The <jsp:plugin> action enables a JSP action to generate HTML that contains the
    appropriate client-browser-dependent constructs, for example, OBJECT or EMBED,
    which will result in the download of the Java plugin and subsequent execution
    of the specified applet or JavaBean. The <jsp:plugin> tag is replaced by an <object>
    or <embed> tag, as appropriate for the requesting agent, and to write the output
    of the response object. The attributes of the <jsp:plugin> action provide configuration
    data for the presentation of the element. The syntax of the <jsp:plugin> action
    is as follows:


    ```

    <jsp:plugin type="pluginType"

    code="classFile"

    codebase="relativeURLPath">

    ```


    ```

    <jsp:params>

    ```


    <jsp:plugin> contains the attributes and their descriptions for the <jsp:plugin>
    action.


    Table 10.4: The Attributes for the <jsp:plugin> Action


    | Attribute | Definition |

    | --- | --- |

    | type | This attribute represents the type of plugin-in to include. An example
    of this would be an applet. |

    | code | This attribute represents the name of the class that will be executed
    by the plugin-in. |

    | codebase | This attribute represents the base or relative path of where the
    code can be found. |


    Note There are additional attributes associated with the <jsp:plugin> standard
    action, but these attributes are beyond the scope of this example. You can find
    further information in the JSP 1.1 specification.'
