    # Type 4: Native-Protocol, Pure Java Driver


    Type 4 drivers are pure Java drivers that communicate directly with the vendor''s
    database. They do by converting JDBC commands directly into the database engine''s
    native protocol. The Type 4 driver has a very distinct advantage over all the
    other types. It has no additional transaction or middleware layers, which improves
    performance tremendously. Figure 4.6 diagrams the communications of a Type 4 driver.


    Figure 4.5: The Type 3 JDBC-Net driver.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_40_1.png)


    Figure 4.6: The Type 4 native-protocol JDBC driver.


    # JDBC Basics


    Now that we have discussed what JDBC is and some of its characteristics, let''s
    start learning how to use it. In this section, we are going to discuss how to
    install and set up a Type 1 driver, make a connection to the database, and perform
    the basic SQL commands.


    # Installing and Setting Up a Type 1 Driver


    In the JDBC examples throughout this book, we will be connecting to a Microsoft
    Access database using a Type 1 driver. The JDBC-ODBC Bridge is included in version
    1.1 and later. The JDBC-ODBC Bridge requires no specific setup steps, but the
    ODBC driver does. For our examples, assume that you are using a PC and running
    Windows 9x or NT. If not, you will need to create your own database using the
    drivers supplied by your database vendor.


    To configure the ODBC data source for the examples, you will follow these steps:


    +   1. Copy to your local drive the database file moviecatalog.mdb, which can
    be found on this book''s Web site.

    2. Start the application ODBC Administrator in the Windows Control Panel. You
    will see a window similar to the one in Figure 4.7.'
