  md: "# # Summary\n\nIn this chapter, we covered the basics of JavaBeans. We looked\
    \ at the standard actions involved in embedding a bean within a JSP. We also covered\
    \ the different types of scope in which a bean can exist.\n\nYou should be able\
    \ to create a JavaBean and access the bean within a JSP. You should also have\
    \ a basic understanding of how the bean's scope affects its current state. In\
    \ [Chapter 4, JDBC and JSP Concepts.]() we are going to cover how you can perform\
    \ JDBC operations within JSPs.\n\n# # Chapter 4: JDBC and JSP Concepts\n\n# ##\
    \ Overview\n\nThe JDBC (short for Java Database Connectivity) interface is a pure\
    \ Java API used to execute SQL statements. This chapter will introduce you to\
    \ the JDBC and how to use it in Java Pages.\n\nThe JDBC provides a set of classes\
    \ and interfaces that can be used by developers to write database applications.\
    \ Basic JDBC interaction, in its simplest form, can be broken down into four steps:\n\
    \n+   1. Open a connection to the database.\n2. Execute a SQL statement.\n3. Process\
    \ the results.\n4. Close the connection to the database.\n\n```\n// The following\
    \ code fragment shows these steps in action:\n// Step 1. Open a connection to\
    \ the ODBC datasource titles.\ncon = DriverManager.getConnection(\"jdbc:odbc:titles\"\
    ,\n  \"admin\", \"password\");\n\n// Step 2. Execute the SQL statement.\nStatement\
    \ statement = con.createStatement();\n\n// Step 3. Process the Results\nwhile\
    \ (rs.next()) {\n\n// get the type_id, which is an int\nSystem.err.println(\"\
    Type ID = \" + rs.getInt(\"type_id\"));\n// get the type_name, which is a String\n\
    System.err.println(\"Type Name = \" + rs.getString(\"type_name\"));\n}\n\n// Step\
    \ 4. Close the Connection.\nrs.close();\ncon.close();\n```\n\n# ## Two-and-Three-Tier\
    \ Database Access Models\n\nThe JDBC provides support for two- and three-tier\
    \ database access models. We are going to examine both in this section."
