  md: "# JSP Translation Time Errors\n\nThe first type of JSP error occurs when a\
    \ JavaServer Page is requested and goes through the initial translation from a\
    \ JSP source file into a corresponding servlet class file. These errors are usually\
    \ the result of compilation failures and are known as time errors. They are reported\
    \ to the requesting client with an error status 500 or Server Error and usually\
    \ contain the reported compilation error. Translation time errors are handled\
    \ by the JSP engine.\n\n# JSP Request Time Errors\n\nThe second type of JSP error\
    \ occurs during request time. These errors are runtime errors that can occur in\
    \ either the body of the JSP page or in some other object that is called from\
    \ the body of the JSP page.\nRequest errors result in an exception being thrown.\
    \ These exceptions can be caught and appropriately handled in the body of the\
    \ calling JSP, which would be the end of the error. Those exceptions that are\
    \ not caught in the forwarding of the client request, including the uncaught exception,\
    \ to the error page specified by the offending JSP. The following sections describe\
    \ in detail, how to define and implement JSP pages.\n\n# Creating a JSP Error\
    \ Page\n\nTo create a JSP error page, you need to create a basic JavaServer page\
    \ and then you need to tell the JSP engine that the page is an error page. You\
    \ do this by setting its page attribute isErrorPage to true. Listing 6.1 contains\
    \ a sample error page. \n\n```\n<html>\n\n<body text=\"red\">\n\n<%@ page isError=\"\
    true\" %>\n\n<!-- Use the implicit exception object, which holds a reference --\n\
    <!-- to the thrown exception. -->\n\nError: <%%= exception.getMessage() %> has\
    \ been reported.\n\n</body>\n</html>\n```\n\nThere are two lines of code you need\
    \ to look at to understand how easy it is to create a JSP error page. The first\
    \ is the page directive line, which indicates that this JSP is an error page.\
    \ This code snippet is\n<%@ page isErrorPage=\"true\" %>"
