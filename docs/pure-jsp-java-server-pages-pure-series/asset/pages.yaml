    # Chapter 2: Java Servlets


    Overview

    JavaServer Pages are extensions of JSP servlets, therefore you will need to understand
    Java servlets before the previous statement, servlets are generic extensions to
    Java-enabled servers. When you deploy Web servers, providing a very efficient,
    portable, and easy-to-use replacement for CGI servlet is a dynamically loaded
    module that services requests from a Web server. It runs inside the Java Virtual
    Machine. The servlet is running on the server side, it does not depend on browser
    compatibility. Figure 2.1 depicts the execution of a servlet. In this chapter,
    you''ll learn the basics of working with servlets, and how servlets fit into the
    framework of JSP.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_16_0.png)


    Figure 2.1: Execution of a Java servlet.


    # Practical Applications for Java Servlets


    Servlets can be used for any "Web-related" applications. When you start using
    servlets, you will find more practical applications for them. The following list
    contains three examples that I believe are some of the most important applications.

    Developing dynamic "frontends" will become one of the most common uses for Java
    servlets. A servlet can be used to create an online catalog based on the contents
    of a database. Then it can present this catalog to the customer using dynamic
    HTML. The customer will choose the items to be ordered, the shipping and billing
    information, and then send the data to the servlet. The servlet receives the posted
    data, it creates the orders and places them in the database for fulfillment later.


    Servlets can be used to deploy Web servers that use large amounts of data on large
    mainframe systems. These businesses do not want to reengineer their systems''
    architecture, so they choose to provide web interfaces into the systems. If you
    have the entire JDK at your disposal and secured by the Web server, you can safely
    access into these systems using any TCP/IP or CORBA.


    When developing a distributed application that will be deployed on the Web, you
    might run into access issues. If you choose to use applets in your client browser,
    you are only able to open a connection to the origin server, which might be behind
    a firewall. Getting through a firewall using Remote Method Invocation (RMI) is
    a very common problem. If servlets are employed, you can tunnel through the firewall
    using a servlet technology called HTTPTunnelling. This enables the applet to access
    objects that can be running almost over the network.


    These are just a few examples of the power and practicality using Java servlets.
    Servlets are a viable option for Web applications.'
