  md: '# Where Does the BasicServlet Fit into the Servlet Framework?


    The first thing we are going to look at is where the BasicServlet fits into the
    servlet framework. This extends the HttpServlet class. The BasicServlet is an
    abstract class that simplifies writing HttpServlet servlets. The GenericServlet
    class provides the functionality for handling HTTP protocol-specific requests.
    The BasicServlet overrides four of its inherited methods. Figure 2.6


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_23_0.png)


    Figure 2.6: The BasicServlet depicted in the framework.


    # The Methods Overridden by the BasicServlet


    +   The following methods are overridden by the BasicServlet:

    * init()

    * doGet()

    * doPost()

    * getServletInfo()


    Let''s take a look at each of these methods in detail.


    # init()


    The BasicServlet defines a very simple implementation of the init method. It takes
    the ServletConfig object that is passed to it and its parent''s init() method,
    which stores the object for later. The parent actually holds onto the ServletConfig
    object is the GenericServlet class. GenericServlet provides your servlet, through
    inheritance, with methods to access the ServletConfig object. The code that performs
    this action follows:


    ```

    super.init(config)

    This is a important step. If you do not do this, you must have a reference to
    the ServletConfig object yourself.

    ```


    You will notice this implementation of the init() method does not create any resources.
    This is why the BasicServlet does not implement a destroy method.


    # doGet() and doPost()


    The BasicServlet''s doGet() and doPost() methods are identical. The only difference
    is the requests that the doGet() and doPost() handle. GET requests, and the doPost()
    handle POST requests.


    Both of these methods receive HttpServletRequest and HttpServletResponse objects.
    These objects encapsulate the request/response paradigm. The HttpServletRequest
    contains information sent from the client and the HttpServletResponse contains
    the information that will be sent back to the client. The first execution of these
    methods is listed as follows:


    ```

    response.setContentType("text/html")

    This method sets the content type for the response. You can set this property
    only once. You must begin writing to a Writer or an OutputStream. In our example,
    we are using a PrintWriter and setting the response type to text/html.

    ```


    The next thing to do is get a reference to the PrintWriter. This is accomplished
    by calling the ServletRequest.getWriter() method. This is done in the following
    line of code:


    ```

    PrintWriter out = response.getWriter();

    ```'
