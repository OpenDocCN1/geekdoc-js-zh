  md: "There are four sections of JSP that need to be examined in order to understand\
    \ how the ConnectionPool works. The first section is included in the following\
    \ code snippet:\n\n```\n<!-- Instantiate the ConnectionPool bean with an id=\"\
    pool\" -->\n<jsp:useBean id=\"pool\"\nscope=\"application\"/>\n```\n\nThis section\
    \ of code tries to find an instance of a ConnectionPool with application scope\
    \ and an id of pool. If it cannot find an instance of the pool, it will create\
    \ one. This bean uses application scope, because the application can be accessed\
    \ by any JSP until the JSP engine is shut down. The next section of code to be\
    \ studied is contained in the following code snippet:\n\n```\n// The pool is not\
    \ initialized\nif ( getDriver() == null ) {\n\n// initialize the pool\n\npool.setDriver(\"\
    sun.jdbc.odbc.JdbcJdbcDriver\");\npool.setUrl(\"jdbc:odbc:Movie Catalog\");\n\
    pool.setSize(5);\npool.initializePool();\n}\n```\n\nIn this snippet we are checking\
    \ if the pool has been initialized. If it has not, then we set the appropriate\
    \ properties to initialize the pool.\n\nThe third section of code to be looked\
    \ at\n// Get a connection from the ConnectionPool\n\ncon = pool.getConnection();\n\
    \ section gets a normal JDBC Connection object from the Pool. At this point the\
    \ JSP can use this connection just like any other.\nThe final section to be examined\n\
    \nfinally {\n\n```\ntry {\n\nif ( con == null ) {\n\n\n// release the connection\
    \ no matter what\npool.releaseConnection(con);\n}\n}\ncatch (Exception e) {\n\n\
    outout.println(e.getMessage());\n}\n}\n```\n\nThis final section is used to put\
    \ our connection back into the ConnectionPool for further use. The connection\
    \ is released by calling the pool.releaseConnection() method with the Connection\
    \ object. This method is placed in the finally block to guarantee its execution."
