    The first thing you may notice is the use of the MimeMessage class. It implements
    the Message abstract class, and uses certain criteria to make sure the message
    adheres to the Internet email standards. It formats the message and message headers
    in the proper MIME style to be sent over the Internet. (A discussion on the MIME
    Standard is beyond the scope of this book).

    The next method call fills the message with the needed information. Addresses
    used by a MimeAddress are implemented by the InternetAddress class. You will notice
    that this class is used for both the sender and recipients. Neither the subject
    content of the message are required to successfully transport the message, but
    let''s face it, how exciting it be without them?

    Now that the message is prepared to be sent, all we have to do is ask our default
    transport provider to send it for you. The code snippet to accomplish this is
    simple and looks like this:

    Transport.send(msg);


    That all there is to sending a simple email using the JavaMail API.


