  md: '# clearBuffer() Method


    public void clearBuffer() throws java.io.IOException

    The clearBuffer() method clears the current contents of the buffer. clear(), this
    method would not throw an IOException if the buffer has already been flushed.
    It merely clears the current content of the buffer and returns. clearBuffer()
    has no parameters.


    # flush() Method


    public void flush() throws java.io.IOException

    The flush() method flushes the stream. If the stream has saved any characters
    from the various write() methods in a buffer, flush() writes them immediately
    to their intended destination. Then, if destination is not another character or
    byte stream, the method flushes it. Thus, flush() invocation will flush all buffers
    in the character and writers output streams. flush() has no parameters.


    # close() Method


    public void close() throws java.io.IOException

    The close() closes the stream, flushing it first. Once a stream has been closed,
    further write() or flush() calls will cause an IOException to be thrown. A previously
    closed stream, has no effect. close() has no parameters.


    # getBufferSize() Method


    public int getBufferSize() throws java.io.IOException

    The getBufferSize() method returns the size of the buffer in bytes, or 0, if there
    is no buffer. It has no parameters.


