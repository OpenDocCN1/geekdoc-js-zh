  md: '# Chapter 14: JSP and a JDBC Connection Pool Bean


    # Overview


    In this chapter, we are going to remedy the inefficiencies that we encountered
    in Chapter 4, "JDBC and JSP Concepts." Instead of opening a connection to the
    database with every request, as we did in Chapter 4, we are going to create a
    pool of connections to the database. This will give us access to a collection
    of already opened database connections, which will reduce the time it takes to
    service a request and let us service n number of requests at once.


    # Using a JDBC Connection Pool


    There are two choices that we must define in order to create a connection pool:
    a pooled connection and the connection pool itself. These are described in the
    following sections.


    # A Pooled JDBC Connection

