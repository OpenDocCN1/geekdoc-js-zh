    # # Introduction


    # ## This Book Is Organized


    Before you begin reading Pure JSP Java Server Pages, you might want to take a
    look at its basic structure. This should help you outline your reading plan if
    you choose not to read the text from cover to cover. This gives you an overview
    of what each chapter covers.


    # ### Chapter 1, "JSP Overview: The Components of a JavaServer Page"


    Chapter 1 takes a look at the basics of JSP and the components of JSPs. It shows
    you how to create a JSP document and helps you to understand what is happening
    behind the scenes at request-time. It also discusses the process a JSP file goes
    through when it is requested.


    # ### Chapter 2, "Java Servlets"


    Chapter 2 covers how to create, build, and install your own servlets. It also
    provides a basic understanding of the servlet life cycle and how your servlets
    will fit into the JSP servlet framework.


    # ### Chapter 3, "JavaBeans and JSP Concepts"


    Chapter 3 covers the basics of JavaBeans. It takes a look at the standard actions
    involved in embedding a bean within a JSP. It also covers the different types
    of scope by which a bean can exist.


    # ### Chapter 4, "JDBC and JSP Concepts"


    Chapter 4 discusses the basics of the JDBC (Java Database Connectivity) interface
    and how to set up a JDBC driver. It examines how you can incorporate the JDBC
    into a JSP and how you can break up your scriptlet by embedding your HTML code
    into it.


    # ### Chapter 5, "Configuring the JSP Server"


    Chapter 5 covers the necessary steps in installing and configuring the Tomcat
    server, including how you add a new Web Application.


    # ### Chapter 6, "Handling JSP Errors"


    Chapter 6 covers the types of errors that can occur in a JSP. It also shows you
    how you can handle and respond to these errors, using a JSP error page.


    # ### Chapter 7, "Using the include Directive"


    Chapter 7 covers the JSP include directive. It also discusses when the include
    directive is used. After reading this you will know how to include a JSP or HTML
    file using the include directive; you should also know how included file changes
    take effect.


    # ### Chapter 8, "JavaServer Pages and Inheritance"


    Chapter 8 discusses how you can subclass JSPs to provide common utility methods.
    It also covers the requirements of both the superclass and the subclass.


    # ### Chapter 9, "Using the JSP''s Implicit Objects"


    Chapter 9 discusses the JSP implicit objects and how they are commonly used. It
    also talks about how they are created in the JSP''s generated servlet.'
