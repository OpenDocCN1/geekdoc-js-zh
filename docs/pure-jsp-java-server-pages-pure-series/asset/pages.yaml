    # # The include Directive


    The `include` directive is used to insert text and code at JSP translation. The
    syntax of the `include` directive is as follows:

    <%@ include file="relativeURLspec" %>

    The file that the `file` attribute points to reference a normal text HTML file
    or it can reference a JSP file, which will be evaluated at runtime.


    > Note Currently the JSP 1.1 specification does not have a defined method for
    notifying the JSP engine that the included JSP file has changed.


    # # The taglib Directive


    The most recent version of the JSP specification defines a mechanism for extending
    the set of JSP tags. It does this by creating a custom set of tags called a `taglib
    library`. That is what the `taglib` points to. The `taglib` directive declares
    that the page uses custom tags, uniquely names the taglib library defining it,
    and associates it with tags. The syntax of the `taglib` directive is as follows:

    <%@ taglib uri="tagLibrary" prefix="tagPrefix" %>

    The `taglib` attributes are described in Table 1.2.


    | Attribute | Definition |

    | uri | This attribute references a URI that uniquely names the set of custom
    tags. |

    | prefix | This attribute defines the prefix string used to distinguish a custom
    tag instance. |


    # # Actions


    Actions provide an abstraction that can be used to easily encapsulate common tasks.
    They typically act or on objects, normally JavaBeans. The JSP technology provides
    some standard actions. The actions are defined in the following sections.'
