  md: '# Creating the PURE JSP Web Application


    With the Java Servlet specification 2.2, the concept of a Web Application was
    introduced. According to this specification a "Web Application is a collection
    of servlets, html pages, classes, and other resources that can be bundled and
    run on multiple containers from multiple vendors." In this text you will be creating
    the Web Application directory structure, and create a new application entry in
    the server.xml file. Because you will be developing your examples as you progress
    through the book, we will not deploy our examples into a Web Archive. If you would
    like further information about installing Web Applications, which is beyond the
    scope of this book, refer to the Java Servlet Specification 2.2 Section 9.


    # The Directory Structure


    The first step in creating PURE JSP Web Application is creating the directory
    structure of the PURE JSP Web Application. Table 5.1 contains the directories
    you will need to create. Each of these directories should be created from the
    Tomcat <SERVER_ROOT>.


    Table 5.1: The PURE JSP Application Directories


    | Directory | Description |

    | --- | --- |

    | /purejsp | This is the root directory of the PURE JSP Web Application where
    we will be installing all of JSPs and HTML files. |

    | /purejsp/WEB-INF | This directory contains all resources related to the application
    that are not in the root directory of the application. Note that the WEB-INF directory
    is not part of the public document tree of the application. No file contained
    in this directory can be served directly to a client. |

    | /purejsp/WEB-INF/classes | This directory is where servlet and utility classes
    are located.


    # Adding the PURE JSP Web Application


    The final step in setting up the PURE JSP Web Application, which is our final
    step in setting up the Tomcat server, is to create a new Web Application entry
    in the <SERVER_ROOT>/server.xml file. This is the configuration for the Tomcat
    server. To add the new entry, follow the following section of text example entry:


    ```

    <Context path="purejsp" docBase="purejsp"

    defessionTimeout="30" isISWARExpanded="true"

    isInvokerEnabled="true"

    isWorkDirPersistent="false" />

    ```


    This entry tells the Tomcat server that we have a new Web Application and it is
    located in the <SERVER_ROOT>/purejsp/ directory with a document base of purejsp.


    # Summary


    In this chapter we covered the necessary steps in installing and configuring the
    Tomcat server, including how to add a new Web Application. You should now feel
    comfortable with what a Web Application is and how to set up a basic configuration.


    Chapter 6, "Handling JSP Errors," we cover how to handle errors in a JSP with
    an error page.


    # Chapter 6: Handling JSP Errors


    # Overview


    Errors can occur in a JSP in two different phases of its life. The first type
    of error, which occurs during the initial request, is known as a translation time
    error. The second type of JSP error occurs during subsequent requests and knows
    as a request time error. These errors are discussed in the following sections.'
