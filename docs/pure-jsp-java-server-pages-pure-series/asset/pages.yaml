  md: 'The first line of this snippet describes the XML processing instruction which
    tells that this XML document is based on version 1 of the XML specification. Processing
    instructions begin with a less-sign and end with a question mark (?) and a greater
    sign (?).


    The rest of this document describes an ITEM object with four attributes: ID, DESCRIPTION,
    PRICE, and QUANTITY. Each of these attributes is contained in an open <tag> and
    closed with </tag>. You should notice how the hierarchy of the object is in a
    container-like fashion, wherein the attributes of the ITEM are between the ITEM''s
    open and closing tags. This shows the parent/child relationship of the ITEM object.
    All XML documents can be viewed as navigable tree structures. Figure 15.1 shows
    the standard structure of an XML document.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_143_0.png)


    **Figure 15.1:** The XML document tree structure.


    While this is hardly a complete definition of XML, which is well beyond the scope
    of this book, it is complete enough to show how XML and JSP can be used together.


    # XML and Java


    Now that you understand XML basics, let''s take a look at how we can use XML and
    Java together. There have been many Java parsers developed to interact with XML
    documents. The three most common have been developed by Sun Microsystems, IBM,
    and Microsoft. For our example, we will be using Sun''s Java API for XML parsing,
    which can be downloaded from the following URL:


    http://java.sun.com/xml/download.html


    Follow the installation instructions for your platform, adding the jaxp.jar and
    the parser.jar to your classpath.


    Sun''s API is composed of two components, the Document Object Model (DOM) and
    the Simple API for XML (SAX API). The DOM is a tree-based API, and the SAX is
    an event-based API. For our examples, we will be using the SAX API.


