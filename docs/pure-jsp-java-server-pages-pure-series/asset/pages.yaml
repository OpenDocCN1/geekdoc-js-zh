  md: '# Classes


    The eight classes for the definition of JavaServer Pages tag libraries are described
    in the following sections. They are BodyJspWriter, Tag, TagAttributeInfo, TagData,
    TagExtraInfo, TagInfo, TagLibraryInfo, and VariableInfo.


    # BodyJspWriter Class


    public abstract class BodyJspWriter extends BodyspWriter

    BodyJspWriter is a BodyspWriter subclass that can be used to process body evaluations
    or they can be re-extracted at a later time. It has five methods.


    # BodyJspWriter() Method


    protected BodyJspWriter(int buffersize, boolean autoflush)

    This method is used to construct a BodyJspWriter. It should only be used by a
    subclass.

    BodyJspWriter() returns values and throws no exceptions.


    # Parameters


    +   - int

    - boolean


    # clearBody() Method


    public void clearBody()

    The clearBody() method is another implementation of the JspWriter method clear().
    The only difference is that clearBody() is guaranteed not to throw an exception.
    clearBody() has no parameters and returns value.


    # getReader() Method


    public abstract java.io.Reader getReader()

    The getReader() returns the value of the BodyJspWriter as a Reader, after the
    BodyJspWriter has been processed. getReader() has no parameters and throws no
    exceptions.


    # Returns


    +   - java.io.Reader


    # getString() Method


    public abstract java.lang.String getString()

    The getString() returns the value of the BodyJspWriter as a String after the BodyJspWriter
    has been processed. It has no parameters and throws no exceptions.


    # Returns


    +   - java.lang.String


    # writeOut() Method


    public abstract writeOut(java.io.Writer out)

    The writeOut() method writes the contents of the BodyJspWriter as a Writer. It
    returns no value and throws no exceptions.


    # Parameters


    +   - java.io.Writer


    # Tag Class


