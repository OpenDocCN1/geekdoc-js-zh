    # Implicit Objects


    As a JSP author, you have access to certain implicit objects that are available
    for use in JSP documents,

    without declared first. The JSP specification, all JSP scripting languages must
    provide

    access to the objects defined in 1.7. Each of these implicit objects has a class
    or interface type

    defined in a core Java Development Kit (JDK) or Java Servlet Development Kit (JSDK).


    # Table 1.7: The JSP Implicit Objects


    | | Type | Description | Scope |

    |---|---|---|-|

    | application | javax.servlet.ServletContext | Represents the servlet context
    returned from a call to getServletContext().getContext() | Application |

    | config | javax.servlet.ServletConfig | Represents the Servlet Config for this
    JSP | Page |

    | exception | java.lang.Throwable | Represents the uncaught Throwable that resulted
    from a call to the error page | Page |

    | out | javax.servlet.jsp.JspWriter | Represents the object to the output stream
    | Page |

    | page | java.lang.Object | Represents this object for instance of the JSP | Page
    |

    | pageContext | javax.servlet.jsp.PageContext | Represents the page context for
    the JSP | Page |

    | request | Protocol-dependent subtype of either javax.servlet.Request or javax.servlet.HttpServletRequest
    | Represents the request object that triggered the request | Request |

    | response | Protocol-dependent subtype of either javax.servlet.HttpResponse or
    javax.servlet.HttpServletResponse | Represents the response object that triggered
    the request | Page |

