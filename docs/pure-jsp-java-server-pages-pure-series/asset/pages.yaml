    # Chapter 15: JSP and XML


    # Overview


    The Extensible Markup Language, or XML, is a meta language for creating markup
    languages used to describe structured data. XML is a self-describing language,
    composed of tags and values. It is often used to describe objects that are passed
    in messages between applications. An example of a simple XML document is included
    in Listing 15.1: `item.xml`


    ```

    <?xml version="1.0"?>

    ```


    ```

    <ITEM>


    <ID>33445</ID>


    <DESCRIPTION>Austin Powers The International Man of Mystery</DESCRIPTION>


    <PRICE>19.95</PRICE>


    <QUANTITY>56</QUANTITY>


    </ITEM>

    ```'
