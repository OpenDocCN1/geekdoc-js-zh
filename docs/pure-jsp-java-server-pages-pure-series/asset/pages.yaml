  md: 'The differences between the GET POST requests are very important to understand.

    The GET appends data to a URL in the form of a query string. The data sent in
    the query string is in the form of tag/value pairs separated by ampersands (\&).
    A sample URL with an appended query string is listed below:


    http://yourserver/search?keyword=1&keyword=2=servlets

    in this example, our tag/value pairs are listed to the right of the ? character.
    The character used to separate the URL from the query string when using a GET
    request. You should note that the data sent using a GET request is visible in
    the URL. The amount of data sent in the query string is limited to 255 bytes.


    The POST method appends data in request headers from the client. It can send an
    unlimited amount of data in the query string and the query string will not be
    displayed in the URL.


    # ## The <input> Tags


    The <input> tags are used to capture form data. A basic form is made of two <input>
    types. The first are your basic elements, such as text fields and radio buttons.
    The second is the Submit button, which actually sends the data to the target URL
    referenced in the action attribute. The basic syntax of <input> tag is listed
    below:


    ```

    <input type="text" name="inputname" value="inputvalue">

    ```


    The equivalent syntax for creating a Submit button is listed below:


    ```

    <input type="Submit" value="Submit">

    ```


    The <input> tag''s attributes are described in Table 12.2.


    # ### Table 12.2: The Attributes for the <input> Tag


    | Attribute | Definition |

    |---|---|

    | type="text|submit|etc." | This attribute determines which type of input object
    is being used. |

    | name="inputname" | This attribute represents the tag in the tag/value pair that
    is sent in the `request`. |

    | value="inputvalue" | This attribute represents the value in the tag/value pairs
    sent in the `request`. |


