    \ The scope Values for the <jsp:useBean> Action\n\n| Value | Definition |\n|---|-|\n\
    | page | Objects with page scope are accessible only within the page where they\
    \ were created. References to an object with page scope are released when the\
    \ response is sent back to the client or the request is forwarded to another resource.\
    \ Objects with page scope are stored in the page |\n| request | Objects with request\
