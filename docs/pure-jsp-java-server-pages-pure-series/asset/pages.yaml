  md: '# JspPage Interface


    public interface PspPage extends javax.servlet.Servlet


    This is the interface of a JSP processor-generated class implement. The interface
    defines a protocol with three methods; only two of them, jspInit() and jspDestroy(),
    are part of this interface. The third method, jspService(), depends on the specific
    protocol used and cannot be expressed in a generic way.


    A implementing this interface is responsible for invoking the two methods at the
    appropriate time based on the corresponding servlet-based method invocations.
    The jspInit() and jspDestroy() methods can be defined by a JSP author, but the
    jspService() method is defined by the JSP processor based on the contents of the
    JSP page.


    # jspInit() Method


    public void jspInit() method is invoked when the JspPage is initialized. Once
    the JSP page is initialized, the getServletContext() method will return the desired
    value. It is synchronous with the init() method of a servlet. It has no parameters,
    returns no value, and throws no exceptions.


    # jspDestroy() Method


    public void jspDestroy() is invoked when the JSP page is about to be destroyed.
    It is synchronous with the destroy() method of a servlet. It has no parameters,
    returns no value, and throws no exceptions.


    # Classes


    The javax.servlet. package has four classes: JspEngineInfo, JspFactory, JspWriter,
    and PageContext.


    # JspEngineInfo Class


    public abstract class JspEngineInfo The JspEngine info is an abstract class that
    provides information on the current JSP engine. The class has two methods, described
    in the following sections.


    # JspEngineInfo() Method


    public JspEngineInfo() The JspEngineInfo() method is an empty constructor. It
    has no parameters, returns no value, and throws no exceptions.


    # implementationVersion() Method


    public java.lang.String getImplementationVersion() returns the current version
    of the JSP specification. The version number must begin with a number. If the
    version is not defined, then a null will be returned. It has no parameters and
    throws no exceptions.


    # Returns


    +   - java.lang.String


    # JspFactory Class


    public abstract class JspFactory extends java.lang.Object JspFactory is an abstract
    class that defines a number of factory methods available to a JSP page at runtime
    for the purposes of creating instances of various interfaces and classes used
    to support JSP implementation. The JspFactory class has one field and six methods,
    as described in the following sections.'
