    **Figure 16.1:** The steps in a server-side MVC.


    +   These steps are as follows:

    1. The Web browser makes a request to the Controller servlet.

    2. The servlet performs necessary manipulations to the Java Bean and forwards
    the result to the JSP View.

    3. The JSP formats the Model for display and sends the HTML results back to the
    Web browser.


