    # page


    Beans with page scope are accessible only within the page where they were created.
    References to an object with page scope will be released when the response is
    sent back to the client or the request is forwarded to another resource. Objects
    with page scope are stored in the pageContext. A bean with page scope is most
    used for single instance calculations or transactions. An example of using the
    Counter bean with page scope can be found in Listing 11.2.


