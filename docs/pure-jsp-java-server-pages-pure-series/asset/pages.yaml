  md: '# Declarations


    JSP declarations are used to declare variables and methods in the scripting language
    used in a JSP page.

    A JSP declaration should be a complete declarative statement.


    JSP declarations are initialized when the JSP page is initialized. After the declarations
    have been initialized, they are available to other declarations, expressions,
    and scriptlets. The syntax for a JSP

    <% declaration %>


    A sample variable declaration using this syntax is declared here:

    <% String name = new String("BOB"); %>


    A sample method declaration using the same syntax is declared as follows:

    <% public String getName() { return name; } %>

    to get a better understanding of declarations, let''s take the previous String
    declaration and actually use

    to create a JSP document. The sample document would look similar to the following
    code snippet:


    ```

    <html>

    <body>


    <% String name = new String("BOB"); %>


    </body>

    </html>

    ```


    When this document is initially requested, the JSP code is converted to servlet
    code and the previous

    declaration is placed in the declaration section of the generated servlet. The
    declarations section of the

    gerated servlet would look similar to the following code snippet:

    // begin file="D:\Declarations.jsp";from=(3,3);to=(3,37)

    String name = new String("BOB");

    //n end


    # Expressions


    JSP expressions are elements in a scripting language that are evaluated with the
    current result being converted to

    a java.String. After the string is converted, it is written to the current out
    PrintWriter object.

    JSP expressions are evaluated at HTTP request-time, with the resulting String
    inserted at the

    expression''s referenced position in the jsp file. If the resulting expression
    cannot be converted to a

    String, then a translation error will occur. If the conversion to a String cannot
    be detected during

    translation, the syntax of a JSP expression is as

    :

    <%= expression %>


    A snippet containing a JSP expression is shown here:

    Hello <%= getName() %>


    To get a better understanding of expressions, let''s take this snippet and insert
    it into a simple JSP

    document. The sample document would look similar to the following code snippet:


    ```

    <html>

    <body>


    <% String name = new String("BOB"); %>

    <% public String getName() { return name; } %>

    ```'
