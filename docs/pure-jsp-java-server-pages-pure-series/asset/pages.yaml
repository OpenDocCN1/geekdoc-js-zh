  md: 'In analyzing Listing 17.1, the first topic we must discuss is the Session class.
    The Session represents a mail session and it is typically the first thing that
    you will start using in code using the JavaMail API. It collects properties and
    defaults that will be used by different pieces throughout the API.


    In the following snippet, we retrieve the system properties, add the JavaMail-specific
    information to them, and retrieve a default Session using them. The properties
    we use here are just of the JavaMail attributes that can be used; however, they
    are the only ones necessary to accomplish sending a message.


    ```

    String host = "server.myhost.com";

    String to = "YourFriend@somewhere.com";

    String from = "MeMeMe@myhost.com";

    String subject = "JSP Rules";

    String messageText = "I am sending a message using the\n+ " JavaAPI.\ncan include
    any text that I want.";

    boolean sessionDebug = false;

    ```


    ```

    // Create some properties and get the default Session.

    Properties props = System.getProperties();

    props.put("mail.host", host);

    props.put("mail.transport.protocol", "smtp");

    ```


    Session session = Session.getInstance(protocol, null);

    The mail.host environment properties define the default server. In many cases
    the server for transport store are the same machine. However, they can be specified
    if this is not the case. For our purposes it does not matter, because we will
    only need access to the transport service.


    > Note You need to change the mail host in the application to use your ISP''s
    mail host.


    Using the mail.transport.protocol tells the Session what protocol to use as the
    default provider. We specified smtp as the default transport, so the Session now
    knows that whenever we use a transport this is the provider we want. This becomes
    important later when we actually send the message, because we use a static method
    in the Transport class to specify what type of transport we want to use.


    In the next snippet, we create a message and prepare it to be shipped off. There
    is quite a bit more that can take place before a message is sent, but we are only
