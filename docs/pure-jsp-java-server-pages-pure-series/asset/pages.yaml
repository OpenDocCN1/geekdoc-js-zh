  md: '# RequestDispatcher Interface


    public interface RequestDispatcher

    The RequestDispatcher defines an object, which can serve as a wrapper around another
    resource on the server. It is most often used to forward requests to other server
    resources. It defines two methods.


    # forward() Method


    public void forward(ServletRequest request,

    ServletResponse response)

    throws ServletException,

    java.io.IOException

    The forward() method is used for forwarding a request from one servlet to another.
    It allows the first servlet to perform any initial tasks on the request before
    forwarding it to another resource on the server.

    forward() returns value.


    # Parameters


    +   - ServletRequest

    - ServletResponse


    # Exceptions Thrown


    +   - ServletException

    - java.io.IOException


    # include() Method


    public void include(ServletRequest request,

    ServletResponse response)

    throws ServletException,

    java.io.IOException

    The include() method is used to merge content from another server resource in
    the response of the final servlet.

    include() returns no value.


    # Parameters


    +   - ServletRequest

    - ServletResponse


    # Exceptions Thrown


    +   - ServletException

    - java.io.IOException


    # Servlet Interface


    public abstract interface Servlet

    The Servlet is implemented by all servlets either through direct implementation
    or inheritance. It defines five methods, including the three life cycle methods,
    to be implemented by all servants.


    # init() Method


    public void init(ServletConfig config)

    throws ServletException

    The init() method, being the first life cycle method, marks the beginning of a
    servlet''s life. It is called only when the servlet is first loaded, and it must
    execute successfully before the servlet can service requests. The init() should
    contain all initialization code for the servlet. It returns no value.


    # Parameters


    +   - ServletConfig


    # Exceptions Thrown'
