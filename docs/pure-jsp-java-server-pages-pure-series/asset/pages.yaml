    # Chapter 5: Configuring the JSP Server


    # Overview


    Tomcat is the flagship project of the Apache Foundation''s Jakarta Project. It
    is intended to be a world-class implementation of Sun''s Java Servlet SDK 2.2
    and JavaServer Pages 1.1 specifications. Tomcat is, at the time of writing, the
    only released implementation of both of these specifications. Because of Tomcat''s
    compatibility with the latest specifications, it will be the server used throughout
    this text.


    > Note The default installation for Tomcat will run under Windows, Windows NT,
    and Windows 2000. Users with Windows 9 should consider the Tomcat Web site for
    configuration information.


    # Installing the Tomcat Server


    The first thing you need to do is get a copy of Tomcat from the Jakarta Project''s
    site. You can find the necessary links at http://jakarta.apache.org/. Figure 5.1
    shows the Jakarta Project''s homepage.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_64_0.png)


    Figure 5.1: The Jakarta Project''s homepage.

    You can choose to download either class files or source code. For this text we
    are going to use the zipped class files, so download the tomcat.zip. Once you
    have the file decomp to a local drive. I am installing it to drive D;; therefore,
    my `<SERVER_ROOT>` directory is D:\tomcat\nThe next step is putting your JDK into
    the Tomcat''s classpath. You do this by editing the `<SERVER_ROOT>/tomcat.bat`
    file and setting the JAVA_HOME environment variable to the location of your JDK
    installation. For my installation I have added the following to the tomcat.bat
    file: set JAVA_HOME=D:\jdk1.2.1'
