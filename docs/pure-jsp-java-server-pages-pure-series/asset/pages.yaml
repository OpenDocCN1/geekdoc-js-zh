    # # A JDBC Connection Pool


    To make use of our pooled connections, we need a ConnectionPool object to manage
    them. The requirements for our ConnectionPool object are


    +   1. It must hold/n number of open connections.

    2. It must be able to determine when a connection is in use.

    3. If n+1 connections are requested, it must create a new connection and add it
    to the pool.

    4. When we close the pool, all connections must be released.


