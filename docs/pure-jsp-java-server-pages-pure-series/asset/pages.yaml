  md: '# Summary


    In this chapter, we talked about the Model-View-Controller design pattern. We
    discussed the drawbacks of a servlet- JSP-only application model. And finally
    we looked at how we solve the problems encountered by the JSPs and servlets-only
    application model, by leveraging the MVC design pattern. In Chapter 17, we cover
    how to work with JavaMail and JSPs.


    # Chapter 17: JSP and JavaMail


    # Overview


    Traditionally when you needed to interact with a mail server from within code,
    you encountered a messy collection of socket code lacking of string parsing. The
    code would have to send a request to the server, wait for the response, and then
    break down the response to parse the necessary information. The JavaMail API has
    provided a clear and easy-to-use interface to design and implement messaging and
    Internet email services.


    Internet email is comprised of several standards detailing the format and makeup
    of a message that is to be sent across the Internet. There are also standards,
    as well as some proposed standards, that dictate how Internet email handles the
    messages.


    The two types of services that JavaMail offers are the transport and store services.
    The transport service has several jobs, but it will be simple if it takes care
    of the things that we expect. The recipient may save many copies along the way,
    but the intricacies of these stops are not within the scope of this book.


    The second type of service that JavaMail deals with is the store service. The
    store service manipulates the storage of messages. Message delivery is done in
    what most of us know as mailboxes, for example use Inbox. JavaMail refers to these
    mailboxes as folders it is possible for one folder to contain other folders, messages,
    or both. The physical structure of the folders on a mail server depends on the
    mail used to create and manage it. So, to put it, a store service allows you to
    read and manipulate your folders and messages.


    Store and transport are generic terms used to refer to the protocols that implement
    these services. In the case of Internet email, the most widely used protocol is
    the Simple Mail Transfer Protocol (SMTP). The most used protocol that implements
    the store service is the Post Office Protocol (POP3) and Internet Message Access
    Protocol (IMAP4).


    JavaMail gives you an interface to messaging. In order for it to be useful, you
    also require service providers that implement the JavaMail API. Packaged with
    the JavaMail API, Sun Microsystems supplied you with both an SMTP and an IMAP
    service provider. A POP provider can be downloaded through Sun. These providers
    are their implementation of the JavaMail API, designed to interact with each of
    the different protocols. Anyone can write their own implementation, to interact
    with these or other protocols. The document JavaMail Guide for Service Providers
    is packaged with the JavaMail archive and specifies how to develop and package
    a service provider.


    ![](img/0a7b874e847f0fd5d3ace939bc19799d_159_0.png)'
