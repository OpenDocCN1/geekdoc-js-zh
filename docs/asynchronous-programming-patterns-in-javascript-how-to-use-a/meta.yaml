    };\n\nconst badCachingFunction = ...;\n\nbadCachingFunction();\nbadCachingFunction();\n\
    // refreshing\n// refreshing\n```\n\nThe correct way to handle this is to **make\
    \ the second function wait for the refresh process** without starting a separate\
    \ one.\n\nOne way to do this is to **serialize the calls** to the caching function.\
    \ This makes *every* function to wait for all the previous ones to finish, so\
    \ multiple calls only trigger a single refresh process.\n\nThis can be done in\
    \ a variety of ways, but the easiest one is to make the functions run one after\
    \ the other. In this case, when one needs to refresh the value, the other ones\
    \ will wait for it to finish and won't start their own jobs.\n\nAnother use-case\
    \ I needed a solution like this is when backend calls needed a token and that\
    \ token expired after some time. When a call hit an Unauthorized error, it refreshed\
    \ the token and used the new one to retry. Other backend calls needed to wait\
    \ for the new token before they could be run. In this case, it wasn't just performance-related\
    \ as a new token invalidated all the old ones.\n\n# Why await is not a solution\n\
    \nThe trivial solution is to use `await` that achieves serialization easily. After\
    \ all, that's what that keyword is for.\n\n```\nawait badCachingFunction();\n\
    badCachingFunction();\n// refreshing\n```"
  - "[PAGE 58]\n\nBut that requires *collaboration between the calls*, and that is\
    \ not always possible. For example, when the function is called in response to\
    \ multiple types of events, `await` is not possible to coordinate between them:\n\
    \n```\ndocument.querySelector(\"#btn\").addEventListener(\"click\", () => {\n\
    \    fn();\n})\n\nwindow.addEventListener(\"message\",  => {\n    fn();\n});\n\
    ```\n\nIn this case, the function call must do the coordination.\n\n# A general-purpose\
    \ solution\n\nThe solution is to keep a queue of Promises that chains them one\
    \ after the other. It is just a few lines of code and it is general purpose, allowing\
    \ any function be serialized:\n\n```\nconst serialize = (fn) => {\n  let queue\
    \ = Promise.resolve();\n  return (...args) => {\n    const res = queue.then(()\
    \ => fn(...args));\n    queue = res.catch(() => {});\n    return res;\n  };\n\
    };\n```"
  - '[PAGE 59]


    ![](img/bf8ff49d078976cf7c9fa8008bbb9b22_59_0.png)


    The `Promise.resolve()` is the start of the queue. Every other call is appended
    to this Promise.


    The `queue.then(() => fn(...args))` adds the function call to the queue and it
    saves its result in `res`. It will be resolved when *the current and all the previous
    calls are resolved*.


    The `queue = res.catch(() => {})` part makes sure that the queue won''t get stuck
    in rejection when one part of it is rejected.


    Wrapping the caching function with this serializer makes sure that a single refresh
    is run even for multiple calls:'
  - "[PAGE 60]\n\n```\nconst fn = serialize((() => {\n  const cacheTime = 2000;\n\
    \  let lastRefreshed = undefined;\n  let lastResult = undefined;\n  return async\
    \ () => {\n    const currentTime = new Date().getTime();\n    // check if cache\
    \ is fresh enough\n    if (lastResult === undefined ||\n        lastRefreshed\
    \ + cacheTime < currentTime) {\n      // refresh the value\n      lastResult =\
    \ await refresh();\n      lastRefreshed = currentTime;\n    }\n    return lastResult;\n\
    \  }\n})());\n\nfn();\nfn();\n// refreshing\n```"
- md: " ## The async disposer pattern\n\nA recurring pattern is to **run some initialization\
    \ code** to set up some resource or configuration, then use the thing, **and**\
    \ finally **do some cleanup**. It can be a global property, such as freezing the\
    \ time with [timekeeper](https://github.com/joyent/node-timekeeper), starting\
    \ a Chrome browser with Puppeteer, or creating a temp directory. In all these\
    \ cases, you need to make sure the modifications/resources are properly disposed\
    \ of, otherwise, they might spill out to other parts of the codebase.\n\nFor example,\
    \ this code creates a temp directory in the system tmpdir then when it's not needed\
    \ it deletes it. This can be useful when, for example, you want to use ffmpeg\
    \ to extract some frames from a video and need a directory to tell the `ffmpeg`\
    \ command to output the images to.\n\n```\n// create the temp directory\nconst\
    \ dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n);\ntry\
    \ {\n  // use the temp directory\n} finally {\n  // remove the directory\n  fs.rmdir(dir,\
    \ {recursive: true});\n}\n```\n\nA similar construct is `console.time` that needs\
    \ a `console.timeEnd` to output the time it took for a segment of the code to\
    \ run:\n\n```\nconsole.time(\"name\");\ntry {\n  // ...\n} finally {\n  console.timeEnd(\"\
    name\");\n}\n```\n\nOr when you launch a browser, you want to make sure it's closed\
    \ when it's not needed:\n\n```\nconst browser = await puppeteer.launch({/* ...\
    \ */});\ntry {\n  // use browser\n} finally {\n  await browser.close();\n}\n```\n\
    \nAll these cases share the `try..finally` structure. Without it, **an error can\
    \ jump over the cleanup logic**, leaving the resource initialized (or the console\
    \ timing still ticking):\n\n```\nconst browser = await puppeteer.launch({/* ...\
    \ */});\n\n// if there is an error here the browser won't close!\n\nawait browser.close();\n\
    ```\n\nIn other languages, such as Java, this is known as [try-with-resources](https://google.github.io/styleguide/javaguide.html#s6.2.2-try-with-resources-statements)\
    \ and it is built into the language. For example, the `BufferedReader` is closed\
    \ after the block:\n\n```\ntry (BufferedReader br = \n    new BufferedReader(new\
    \ FileReader(path))\n) {\n    return br.readLine();\n}\n```\n\nThis builds on\
    \ the [AutoCloseable](https://docs.oracle.com/javase/8/docs/api/java/lang/AutoCloseable.html)\
    \ interface's `close` method so it's easy to adapt to custom resource types.\n\
    \nBut there is no such structure in Javascript. Let's see how to implement one!\n\
    \n## Disposer pattern\n\nOne problem with the `try..finally` structure we've seen\
    \ above is **how to return a value from inside the `try` block**. Let's say you\
    \ want to take a screenshot of a website and want to use the resulting image later.\n\
    \n```\nconst browser = await puppeteer.launch({/* ... */});\ntry {\n  const page\
    \ = await browser.newPage();\n  // ...\n  const screenshot = await page.screenshot({/*\
    \ ... */});\n\n  // the browser can be closed\n  // but how to use the screenshot\
    \ outside the try..finally?\n} finally {\n  await browser.close();\n}\n```\n\n\
    A suboptimal solution is to declare a variable outside the block and use it to\
    \ store the image:\n\n```\nlet screenshot;\n\nconst browser = await puppeteer.launch({/*\
    \ ... */});\ntry {\n  const page = await browser.newPage();\n  // ...\n  screenshot\
    \ = await page.screenshot({/* ... */});\n} finally {\n  await browser.close();\n\
    }\n\n// use screenshot\n```\n\nA better solution is to **use a function**:\n\n\
    ```\nconst makeScreenshot = async () => {\n  const browser = await puppeteer.launch({/*\
    \ ... */});\n  try {\n    const page = await browser.newPage();\n    // ...\n\
    \    return await page.screenshot({/* ... */});\n  } finally {\n    await browser.close();\n\
    \  }\n}\n\nconst screenshot = await makeScreenshot();\n```\n\nThis is the basis\
    \ of the disposer pattern. The difference is that **instead of hardcoding the\
    \ logic inside the `try..finally` block, it gets a function that implements that\
    \ part:**\n\n```\nconst withBrowser = async (fn) => {\n    const browser = await\
    \ puppeteer.launch(/* ... */);\n    try {\n      return await fn(browser);\n \
    \   } finally {\n      await browser.close();\n    }\n  }\n\nconst screenshot\
    \ = await withBrowser(async (browser) => {\n  const page = await browser.newPage();\n\
    \  // ...\n  return await page.screenshot(/* ... */);\n});\n```\n\nThe `withBrowser`\
    \ function contains the logic to launch and close the browser, and the `fn` function\
    \ gets and uses the browser instance. Whenever the argument function returns,\
    \ the browser is automatically closed, no additional cleanup logic is needed.\
    \ This structure provides an elegant way to prevent non-closed resources hanging\
    \ around.\n\nAn interesting aspect of this pattern is that it is one of the few\
    \ cases where there is a difference between `return fn()` and `return await fn()`.\
    \ Usually, it does not matter if an async function returns a Promise or the result\
    \ of the Promise. But in this case, without the `await` the `finally` block runs\
    \ *before* the `fn()` call is finished.\n\nA potential problem is when there is\
    \ some task is running in the argument function when it returns. This can happen\
    \ when it starts an asynchronous task and does not wait for it to finish. In this\
    \ case, the cleanup logic runs and closes the browser instance that can cause\
    \ an error. It is usually the sign that an `await` is missing.\n\n## Retrying\
    \ async operations\n\n### Backoff algorithm\n\nA Javascript application made a\
    \ `fetch` call to a remote server and it failed. How should it retry the request\
    \ so that it eventually succeeds while also minimizing the calls made?\n\nA backoff\
    \ algorithm makes sure that **when a target system can not serve a request it\
    \ is not flooded with subsequent retries**. It achieves this by introducing a\
    \ **waiting period between the retries** to give the target a chance to recover.\n\
    \nThe need for a backoff builds on the observation that a service is unavailable\
    \ when it is overloaded and sending more requests only exacerbates the problem.\
    \ When all callers temporarily cease adding more load to the already overloaded\
    \ service usually smooths the traffic spikes with only a slight delay.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_65_0.png)\n\
    \n**The backoff algorithm used determines how much to wait between the retries**.\
    \ The best configuration is actively researched in the case of network congestion,\
    \ such as when a mobile network is saturated. It's fascinating to see that different\
    \ implementations yield drastically different effective bandwidth.\n\nRetrying\
    \ a failed call to a remote server is a much easier problem and doing it right\
    \ does not require years of research. In this article, you'll learn how to implement\
    \ a backoff solution in Javascript that is good enough for all practical purposes.\n\
    \n### Exponential backoff\n\nBut let's first revisit the problem of choosing the\
    \ backoff strategy, i.e. **how much to wait between the retries!** Sending requests\
    \ too soon puts more load on the potentially struggling server, while waiting\
    \ too long introduces too much lag.\n\nThe exponential backoff became the standard\
    \ algorithm to use. It waits exponentially longer for subsequent retries, which\
    \ makes the first few tries happen with only a slight delay while it reaches longer\
    \ periods quickly.\n\nIt has two parameters: the **delay of the first period**\
    \ and the **growth factor**. For example, when the first retry waits 10ms and\
    \ the subsequent ones double the previous values, the waiting times are: 10, 20,\
    \ 40, 80, 160, 320, 640, 1280, ...\n\nNotice that the sum of the first 3 attempts\
    \ is less than 100 ms, which is barely noticeable. But it reaches >1 second in\
    \ just 8 tries.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_67_0.png)\n\nExponential\
    \ backoff\n\n### Javascript implementation\n\nThere are two pitfalls when implementing\
    \ a backoff algorithm.\n\nFirst, make sure to **wait only before retries and not\
    \ the first request.** Waiting first and sending a request then introduces a delay\
    \ even for successful requests.\n\nAnd second, make sure to **put a limit to the\
    \ number of retries** so that the code eventually gives up and throws an error.\
    \ Even if the call eventually succeeds, something upstream timeouts in the meantime,\
    \ and the user likely gets an error. Returning an error in a timely manner and\
    \ letting the user retry the operation is a good UX practice.\n\nThere are two\
    \ types of operation in terms of retrying: rejection-based and progress-based.\
    \ Let's discuss each of them!"
  mdcn: "\n## 异步释放器模式\n\n一个常见的模式是**运行一些初始化代码**来设置资源或配置，然后使用该资源，**最后**进行**清理工作**。它可以是全局属性，例如使用\
    \ [timekeeper](https://github.com/joyent/node-timekeeper) 冻结时间、使用 Puppeteer 启动\
    \ Chrome 浏览器，或创建临时目录。在所有这些情况下，你都需要确保修改/资源被正确释放，否则它们可能会泄漏到代码库的其他部分。\n\n例如，以下代码在系统\
    \ tmpdir 中创建一个临时目录，并在不再需要时删除它。这在你希望使用 ffmpeg 从视频中提取一些帧并需要一个目录来告诉 `ffmpeg` 命令输出图像时非常有用。\n\
    \n```\n// create the temp directory\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\ntry {\n  // use the temp directory\n} finally {\n  // remove\
    \ the directory\n  fs.rmdir(dir, {recursive: true});\n}\n```\n\n类似的结构还有 `console.time`，它需要一个\
    \ `console.timeEnd` 来输出代码段运行所花费的时间：\n\n```\nconsole.time(\"name\");\ntry {\n \
    \ // ...\n} finally {\n  console.timeEnd(\"name\");\n}\n```\n\n或者当你启动浏览器时，你需要确保在不需要时关闭它：\n\
    \n```\nconst browser = await puppeteer.launch({/* ... */});\ntry {\n  // use browser\n\
    } finally {\n  await browser.close();\n}\n```\n\n所有这些情况都共享 `try..finally` 结构。如果没有它，**一个错误可能会跳过清理逻辑**，导致资源被初始化（或控制台计时器仍在计时）：\n\
    \n```\nconst browser = await puppeteer.launch({/* ... */});\n\n// if there is\
    \ an error here the browser won't close!\n\nawait browser.close();\n```\n\n在其他语言中，例如\
    \ Java，这被称为 [try-with-resources](https://google.github.io/styleguide/javaguide.html#s6.2.2-try-with-resources-statements)，并且是内置于语言中的。例如，`BufferedReader`\
    \ 在块结束后被关闭：\n\n```\ntry (BufferedReader br = \n    new BufferedReader(new FileReader(path))\n\
    ) {\n    return br.readLine();\n}\n```\n\n这基于 [AutoCloseable](https://docs.oracle.com/javase/8/docs/api/java/lang/AutoCloseable.html)\
    \ 接口的 `close` 方法，因此很容易适应自定义资源类型。\n\n但在 Javascript 中没有这样的结构。让我们看看如何实现一个！\n\n##\
    \ 释放器模式\n\n我们上面看到的 `try..finally` 结构的一个问题是**如何从 `try` 块内部返回一个值**。假设你想要截取网站的屏幕截图，并希望稍后使用生成的图像。\n\
    \n```\nconst browser = await puppeteer.launch({/* ... */});\ntry {\n  const page\
    \ = await browser.newPage();\n  // ...\n  const screenshot = await page.screenshot({/*\
    \ ... */});\n\n  // the browser can be closed\n  // but how to use the screenshot\
    \ outside the try..finally?\n} finally {\n  await browser.close();\n}\n```\n\n\
    一个次优的解决方案是在块外部声明一个变量并用它来存储图像：\n\n```\nlet screenshot;\n\nconst browser = await\
    \ puppeteer.launch({/* ... */});\ntry {\n  const page = await browser.newPage();\n\
    \  // ...\n  screenshot = await page.screenshot({/* ... */});\n} finally {\n \
    \ await browser.close();\n}\n\n// use screenshot\n```\n\n一个更好的解决方案是**使用一个函数**：\n\
    \n```\nconst makeScreenshot = async () => {\n  const browser = await puppeteer.launch({/*\
    \ ... */});\n  try {\n    const page = await browser.newPage();\n    // ...\n\
    \    return await page.screenshot({/* ... */});\n  } finally {\n    await browser.close();\n\
    \  }\n}\n\nconst screenshot = await makeScreenshot();\n```\n\n这就是释放器模式的基础。不同之处在于，**它不是将逻辑硬编码在\
    \ `try..finally` 块中，而是获得一个实现了该部分的函数：**\n\n```\nconst withBrowser = async (fn)\
    \ => {\n    const browser = await puppeteer.launch(/* ... */);\n    try {\n  \
    \    return await fn(browser);\n    } finally {\n      await browser.close();\n\
    \    }\n  }\n\nconst screenshot = await withBrowser(async (browser) => {\n  const\
    \ page = await browser.newPage();\n  // ...\n  return await page.screenshot(/*\
    \ ... */);\n});\n```\n\n`withBrowser` 函数包含了启动和关闭浏览器的逻辑，而 `fn` 函数获取并使用浏览器实例。每当参数函数返回时，浏览器会自动关闭，无需额外的清理逻辑。这种结构提供了一种优雅的方式来防止未关闭的资源四处悬挂。\n\
    \n这种模式的一个有趣之处在于，它是少数几个 `return fn()` 和 `return await fn()` 之间存在差异的情况之一。通常，异步函数返回一个\
    \ Promise 还是 Promise 的结果并不重要。但在这种情况下，没有 `await`，`finally` 块会在 `fn()` 调用完成*之前*运行。\n\
    \n一个潜在的问题是当参数函数返回时，其中有一些任务正在运行。当它启动一个异步任务且不等待其完成时，就会发生这种情况。在这种情况下，清理逻辑会运行并关闭浏览器实例，这可能导致错误。这通常是缺少\
    \ `await` 的迹象。\n\n## 重试异步操作\n\n### 退避算法\n\n一个 Javascript 应用程序向远程服务器发出了一个 `fetch`\
    \ 调用，但失败了。它应该如何重试请求，以便最终成功，同时尽量减少发出的调用次数？\n\n退避算法确保**当目标系统无法处理请求时，它不会被后续的重试淹没**。它通过在重试之间引入**等待期**来实现这一点，给目标一个恢复的机会。\n\
    \n退避的需求基于一个观察：当服务过载时，它就不可用，发送更多请求只会加剧问题。当所有调用者暂时停止向已经过载的服务添加更多负载时，通常会平滑流量峰值，只有轻微的延迟。\n\
    \n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_65_0.png)\n\n**使用的退避算法决定了在重试之间等待多久**。在诸如移动网络饱和等网络拥塞的情况下，最佳配置正在被积极研究。看到不同的实现产生截然不同的有效带宽是很有趣的。\n\
    \n重试对远程服务器的失败调用是一个容易得多的问题，正确地做到这一点不需要多年的研究。在本文中，你将学习如何在 Javascript 中实现一个退避解决方案，该方案对于所有实际用途来说都足够好。\n\
    \n### 指数退避\n\n但让我们首先重新审视选择退避策略的问题，即**在重试之间等待多久！** 过早发送请求会给潜在挣扎的服务器增加更多负载，而等待太久则会引入太多延迟。\n\
    \n指数退避已成为使用的标准算法。它为后续重试等待指数级更长的时间，这使得前几次尝试只有轻微的延迟，同时很快达到较长的等待时间。\n\n它有两个参数：**第一个周期的延迟**和**增长因子**。例如，当第一次重试等待\
    \ 10ms，后续重试的值加倍时，等待时间为：10、20、40、80、160、320、640、1280、...\n\n请注意，前 3 次尝试的总和小于 100\
    \ ms，这几乎难以察觉。但它在仅仅 8 次尝试后就超过了 1 秒。\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_67_0.png)\n\
    \n指数退避\n\n### Javascript 实现\n\n在实现退避算法时有两个陷阱。\n\n首先，确保**只在重试前等待，而不是第一次请求**。先等待再发送请求会为成功请求也引入延迟。\n\
    \n其次，确保**对重试次数设置限制**，这样代码最终会放弃并抛出错误。即使调用最终成功，与此同时上游某些部分可能已经超时，用户很可能得到一个错误。及时返回错误并让用户重试操作是一种良好的用户体验实践。\n\
    \n从重试的角度来看，操作有两种类型：基于拒绝的和基于进度的。让我们逐一讨论它们！\n"
