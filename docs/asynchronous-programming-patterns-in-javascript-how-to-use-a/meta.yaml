- img_proc: true
  md: "But why complicate a function call with Promises? A normal function just returns\
    \ a value that can be used on the next line, without the need for any callbacks.\n\
    \nThe benefit of returning a Promise instead of a value is that the **result might\
    \ not be ready by the time the function returns**. The callback can be called\
    \ much later, but the function must return immediately. This extends what a function\
    \ can do.\n\n```\n// sync\nfn();\n// result is ready\n\n// async\nasyncFn().then(()\
    \ => {\n    // result is ready\n})\n// result is pending\n```\n\nIn many cases,\
    \ a synchronous result is not possible. For example, making a network request\
    \ takes forever compared to a function call. With Promises, it does not matter\
    \ if something takes a lot of time or produces a result immediately. In both cases,\
    \ the `then()` function will be called when the result is ready.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_6_0.png)\n\
    \nAn async function returns a Promise"
  merge: -1
  pgno: 6
- img_proc: true
  md: "Using standardized Promises also allows other constructs to build on it. As\
    \ we've seen, the `async` keyword makes a function return a Promise instead of\
    \ a value.\n\n> Recap\n\nAsync functions return Promises which are values that\
    \ are available sometime in the future.\n\n# The await keyword\n\nUsing Promises\
    \ with callbacks requires changes to the code structure and it makes the code\
    \ harder to read.\n\nInstead of a flat structure of synchronous function calls:\n\
    \n```\nconst user = getUser();\nconst permissions = getPermissions();\nconst hasAccess\
    \ = checkPermissions(user, permissions);\nif (hasAccess) {\n  // handle request\n\
    }\n```\n\nPromises need callbacks:\n\n```\ngetUser().then((user) => {\n  getPermissions().then((permissions)\
    \ => {\n    const hasAccess = checkPermissions(user, permissions);\n    if (hasAccess)\
    \ {\n      // handle request\n    }\n  });\n});\n```"
  merge: -1
  pgno: 7
- img_proc: true
  md: "# Note\n\nPromises support a flat structure when they are invoked sequentially,\
    \ this is their main selling point over traditional callbacks. For example, a\
    \ series of async calls can process an object:\n\n```\ngetUser()\n  .then(getPermissionsForUser)\n\
    \  .then(checkPermission)\n  .then((allowed) => {\n    // handle allowed or not\n\
    \  });\n```\n\nThis is an almost flat structure which we'll detail in the [Chaining\
    \ Promises](#) chapter, but a callback is still needed at the end. The `await`\
    \ keyword eliminates the need for that.\n\nTo solve this without losing the advantages\
    \ of Promises, async functions can use the `await` keyword. It **stops the function\
    \ until the Promise is ready** and returns the result value.\n\n```\nconst asyncFn\
    \ = async () => {\n  return 5;\n}\n\nawait asyncFn();\n// 5\n```\n\nThe above\
    \ code that uses callbacks can use `await` instead which leads to a more familiar\
    \ structure:\n\n```\nconst user = await getUser();\nconst permissions = await\
    \ getPermissions();\nconst hasAccess = checkPermissions(user, permissions);\n\
    if (hasAccess) {\n  // handle request\n}\n```"
  merge: -1
