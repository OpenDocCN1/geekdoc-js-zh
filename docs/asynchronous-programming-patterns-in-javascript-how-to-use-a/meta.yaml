    \ that emits events:\n\n```javascript\nconst reader = new FileReader();\nreader.onload\
    \ = (event) => {\n  // event.target.result\n}\nreader.onerror = (error) => {\n\
    \  // handle error\n};\nreader.readAsDataURL(blob);\n```\n\n### Node-style callbacks\n\
    \nAs there are multiple equally reasonable ways to implement callbacks, it was\
    \ a mess at first. A de-facto standard emerged, which is now called Node-style\
    \ or error-first callbacks. It is used almost everywhere in Javascript whenever\
    \ a callback is needed.\n\nA Node-style callback has three characteristics:\n\n\
    - The callback function is the last argument\n- It is called with an error object\
    \ first, then a result (`(error, result)`)\n- It returns only one result\n\nAs\
    \ an illustration, this function implements a Node-style callback:\n\n```javascript\n\
    const getUser = (id, cb) => {\n  const user = /* get user */;\n  if (user) {\n\
    \    // success\n    cb(null, user);\n  }else {\n    // error\n    cb(new Error(\"\
    Failed to get user\"));\n  }\n};\n```\n\nNotice that when there is no error, the\
    \ first argument is `null`. This allows the caller to easily check whether the\
    \ execution failed or succeeded:\n\n```javascript\ngetUser(15, (error, result)\
    \ => {\n  if (error) {\n    // handle error\n  } else {\n    // handle result\n\
    \  }\n});\n```\n\nWith a callback structure that is used almost exclusively, it\
    \ is possible to convert between Promises and callbacks more easily.\n\n### Convert\
    \ callbacks to Promises\n\nThis is the more prominent direction as it's a common\
    \ task to integrate a callback-based function into an async/await flow. Let's\
    \ see how to do it!\n\n#### Promise constructor\n\nThe Promise constructor is\
    \ the low-level but universally applicable way to convert callbacks to Promises.\
    \ It works for every callback style and it needs only a few lines of code.\n\n\
    The Promise constructor gets a function with two arguments: a `resolve` and a\
    \ `reject` function. When one of them is called, the Promise will settle with\
    \ either a result passed to the `resolve` function, or an error, passed to the\
    \ `reject`.\n\n```javascript\nnew Promise((res, rej) => {\n\n  // resolve with\
    \ a value\n  // res(value)\n\n  // reject with error:\n  // rej(error)\n})\n```\n\
    \nThis makes it easy to call a callback-based function and convert it to a Promise\
    \ which then can be `await`-ed:\n\n```javascript\n// Node-style\nnew Promise((res,\
    \ rej) => getUser(15, (err, result) => {\n  if (err) {\n    rej(err);\n  }else\
    \ {\n    res(result);\n  }\n}))\n\n// setTimeout\nnew Promise((res) => setTimeout(res,\
