    \n### 回调风格\n\n回调实现了延续传递风格编程，其中**一个函数**不是返回一个值，而是**调用**一个延续，在这种情况下，是**一个参数函数**。它在Javascript中尤其普遍，因为它不支持同步等待。所有涉及一些未来事件的事情，例如网络调用、异步API或简单的超时，都只能通过回调机制来实现。\n\
