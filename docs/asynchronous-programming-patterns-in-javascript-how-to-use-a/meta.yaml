    # **MessageChannel**


    Fortunately, there is a better solution built into the language. MessageChannel
    allows a dedicated communication channel attached to the `postMessage` call. The
    sending end can listen for messages *on that channel* which is separated from
    all other calls, and the receiving end can send its responses through the *MessagePort*
    it got.'
  - "[PAGE 81]\n\nA MessageChannel creates two MessagePorts, one for each end of the\
    \ communication. Each port supports both the `onmessage` and the `postMessage`,\
    \ similar to the basic cross-context communication channels.\n\n```\n// index.html\n\
    const worker = new Worker(\"worker.js\");\n// create a channel\nconst channel\
    \ = new MessageChannel();\n\n// listen on one end\nchannel.port1.onmessage = ({data})\
    \ => {\n  console.log(\"Message from channel: \" + data); // 3\n};\n\n// send\
    \ the other end\nworker.postMessage([15, 2], [channel.port2]); // 1\n\n// worker.js\n\
    addEventListener(\"message\", (event) => {\n  // respond on the received port\n\
    \  event.ports[0].postMessage(event.data[0] + event.data[1]); // 2\n}, false)\n\
    ```\n\nTo attach a message handler to a port, use `port.onmessage = (event) =>\
    \ {...}`. If you use `addEventListener` then you need to start the channel too:\n\
    \n```\nport.addEventListener(\"message\", (event) => {...});\nport.start();\n\
    ```\n\nTo attach a port to the `postMessage` call, use the second argument: `postMessage(data,\
    \ [channel.port2])`. To use this port on the other end, use `event.ports[0].postMessage()`.\n\
    \nBy creating a new MessageChannel for each request, pairing the response is solved\
    \ as whatever comes through that channel is the response to this particular request.\n\
    \n# Error handling\n\nAn often overlooked aspect of request-response communication\
    \ is error handling. When the receiving end has a problem and throws an Error,\
    \ it should be propagated to the sender so that it can handle it appropriately."
