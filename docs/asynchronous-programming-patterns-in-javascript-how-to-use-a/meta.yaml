    \n## 异步序列化器模式\n\n假设你有一个函数，它只在最近没有被调用时才执行计算，从而有效地将结果缓存一小段时间。在这种情况下，**后续的函数调用会相互影响**，因为当刷新发生时，所有调用都需要等待它。一个不考虑并发问题的实现，可能会在缓存过期时并行运行多次刷新。\n\
    \n### 这个实现是错误的：\n\n```javascript\n// 返回一个将其结果缓存2秒的函数\n// 错误实现，请勿使用\nconst badCachingFunction\
    \ = (() => {\n\tconst cacheTime = 2000;\n\tlet lastRefreshed = undefined;\n\t\
    let lastResult = undefined;\n\treturn async () => {\n\t\tconst currentTime = new\
    \ Date().getTime();\n\t\t// 检查缓存是否足够新鲜\n\t\tif (lastResult === undefined ||\n\t\
    \t\tlastRefreshed + cacheTime < currentTime) {\n\t\t\t// 刷新值\n\t\t\tlastResult\
    \ = await refresh();\n\t\t\tlastRefreshed = currentTime;\n\t\t}\n\t\treturn lastResult;\n\
    \t}\n})();\n```\n\n当函数需要刷新值时，如果遇到两个并发调用，刷新函数会被调用两次：\n\n```javascript\nconst wait\
    \ = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst refresh = async\
    \ () => {\n  console.log(\"refreshing\")\n  await wait(1000);\n};\n\nconst badCachingFunction\
    \ = ...;\n\nbadCachingFunction();\nbadCachingFunction();\n// refreshing\n// refreshing\n\
    ```\n\n处理这个问题的正确方法是**让第二个调用等待刷新过程完成**，而不是启动一个新的刷新过程。\n\n一种方法是**将缓存函数的调用序列化**。这使得*每一次*调用都等待前面所有的调用完成，这样多次调用只会触发一次刷新过程。\n\
    \n这可以通过多种方式实现，但最简单的是让函数按顺序运行。在这种情况下，当一个调用需要刷新值时，其他调用会等待它完成，而不会启动自己的任务。\n\n我需要这种解决方案的另一个用例是当后端调用需要一个令牌，而该令牌在一段时间后过期。当一个调用遇到未授权错误时，它会刷新令牌并使用新令牌重试。其他后端调用需要等待新令牌获取后才能执行。在这种情况下，这不仅仅是性能问题，因为新令牌会使所有旧令牌失效。\n\
    \n## 为什么 `await` 不是解决方案\n\n一个简单的解决方案是使用 `await`，它可以轻松实现序列化。毕竟，这正是这个关键字的用途。\n\n\
    ```javascript\nawait badCachingFunction();\nbadCachingFunction();\n// refreshing\n\
    ```\n\n但这需要*调用者之间的协作*，而并非总是可能。例如，当函数响应多种类型的事件被调用时，`await` 无法在它们之间进行协调：\n\n```javascript\n\
