- img_proc: true
  md: "A MessageChannel creates two MessagePorts, one for each end of the communication.\
    \ Each port supports both the `onmessage` and the `postMessage`, similar to the\
    \ basic cross-context communication channels.\n\n```\n// index.html\nconst worker\
    \ = new Worker(\"worker.js\");\n// create a channel\nconst channel = new MessageChannel();\n\
    \n// listen on one end\nchannel.port1.onmessage = ({data}) => {\n  console.log(\"\
    Message from channel: \" + data); // 3\n};\n\n// send the other end\nworker.postMessage([15,\
    \ 2], [channel.port2]); // 1\n\n// worker.js\naddEventListener(\"message\", (event)\
    \ => {\n  // respond on the received port\n  event.ports[0].postMessage(event.data[0]\
    \ + event.data[1]); // 2\n}, false)\n```\n\nTo attach a message handler to a port,\
    \ use `port.onmessage = (event) => {...}`. If you use `addEventListener` then\
    \ you need to start the channel too:\n\n```\nport.addEventListener(\"message\"\
    , (event) => {...});\nport.start();\n```\n\nTo attach a port to the `postMessage`\
    \ call, use the second argument: `postMessage(data, [channel.port2])`. To use\
    \ this port on the other end, use `event.ports[0].postMessage()`.\n\nBy creating\
    \ a new MessageChannel for each request, pairing the response is solved as whatever\
    \ comes through that channel is the response to this particular request.\n\n#\
    \ Error handling\n\nAn often overlooked aspect of request-response communication\
    \ is error handling. When the receiving end has a problem and throws an Error,\
    \ it should be propagated to the sender so that it can handle it appropriately."
  merge: -1
  pgno: 81
- img_proc: true
  md: "The problem with postMessage is that it can only send one type of message,\
    \ there is no postError call. How to signal an error then?\n\n```\n(err, result)\
    \ => {\n\tif (err) {\n\t\t// error\n\t} else {\n\t\t// result\n\t}\n}\n```\n\n\
    A possible solution is similar to how Node-style callbacks propagate errors using\
    \ only a single function. These callbacks use an error and a result value together,\
    \ and only one of them is defined:\n\nTo implement the same with messages, use\
    \ an object with error and result properties. When the former is non-null that\
    \ indicates that an error happened.\n\n```\n// worker.js\ntry{\n\tevent.ports[0].postMessage(\n\
    \t{result: event.data[0] + event.data[1]}\n);\n}catch(e) {\n\tevent.ports[0].postMessage({error:\
    \ e});\n}\n\n// index.html\nchannel.port1.onmessage = ({data}) => {\n\tif (data.error)\
    \ {\n\t\t// error\n\t}else {\n\t\t// data.result\n\t};\n};\n```\n\nDon't forget\
    \ to wrap the receiving end in a try-catch to propagate runtime errors.\n\n# Using\
    \ Promises\n\nWith a separated response channel and error propagation, it's easy\
    \ to wrap the call in a Promise constructor."
