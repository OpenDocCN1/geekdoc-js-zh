    }\n```\n\n那么，什么对象适合作为超时错误对象呢？\n\nJavaScript 中的 [Symbol](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol)\
    \ 是只与自身相等的唯一对象。这使它们非常适合此用例。将一个 Symbol 作为超时错误参数传入，然后检查拒绝值是否就是该 Symbol。\n\n```javascript\n\
