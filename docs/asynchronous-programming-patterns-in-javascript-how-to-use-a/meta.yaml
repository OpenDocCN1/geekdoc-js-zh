    \ b], [channel.port2]);\n});\n\nconsole.log(await add(3, 5)); // 8\n\n通过 Promise\
    \ 隐藏远程调用的所有复杂性后，任何支持 async/await 的功能都可以用于这些调用：\n\n```\n// parallel execution\n\
    console.log(await Promise.all([\n  add(1, 1),\n  add(5, 5),\n])); // [2, 10]\n\
    \n// async reduce\nconsole.log(await [1, 2, 3, 4].reduce(async (memo, i) => {\n\
    \  return add(await memo, i);\n}), 0); // 10\n```\n\n当 Promise 应该拒绝时，它会按预期拒绝，从而允许在发送端进行适当的错误处理：\n\
    \n```\n// worker.js\naddEventListener(\"message\", (event) => {\n    try {\n \
    \       if (\n            typeof event.data[0] !== \"number\" ||\n           \
    \ typeof event.data[1] !== \"number\"\n        ) {\n            throw new Error(\"\
    both arguments must be numbers\");\n        }\n        event.ports[0].postMessage(\n\
    \            { result: event.data[0] + event.data[1] }\n        );\n    } catch\
    \ (e) {\n        event.ports[0].postMessage({ error: e });\n    }\n});\n\n// index.html\n\
    try {\n    await add(undefined, \"b\");\n} catch (e) {\n    console.log(\"Error:\
    \ \" + e.message); // Error: both arguments must be numbers\n}\n```\n\n一个限制是可以通过\
    \ `postMessage` 调用发送的内容。它使用结构化克隆算法，支持复杂对象，但并非所有内容都支持。\n\n## 使用异步函数处理集合\n\n虽然 async/await\
    \ 在让异步*命令*看起来像同步命令方面表现出色，但集合处理就没那么简单了。仅仅在传递给 `Array.reduce` 的函数前加上 `async`，并不能神奇地正确工作。但是，如果没有异步函数，你就无法使用\
    \ `await` 并*稍后*提供结果，而这对于读取数据库、建立网络连接、读取文件以及其他许多事情是必需的。\n\n让我们看一些例子！\n\n当你需要使用的所有函数都是同步的，这很简单。例如，一个字符串可以在不涉及任何异步性的情况下被加倍：\n\
    \n```\nconst double = (str) => {\n  return str + str;\n};\n\ndouble(\"abc\");\n\
    // abcabc\n```\n\n如果函数是异步的，对于单个项使用 `await` 也很容易。例如，要计算 SHA-256 哈希，JavaScript 提供了一个\
    \ `digest()` 异步函数：\n\n```\n// https://developer.mozilla.org/docs/Web/API/SubtleCrypto/digest\n\
    const digestMessage = async (message) => {\n  const msgUint8 = new TextEncoder().encode(message);\n\
    \  const hashBuffer =\n    await crypto.subtle.digest(\"SHA-256\", msgUint8);\n\
    \  const hashArray = Array.from(new Uint8Array(hashBuffer));\n  const hashHex\
    \ = hashArray\n    .map(b => b.toString(16).padStart(2, \"0\"))\n    .join('');\n\
    \  return hashHex;\n};\n\nawait digestMessage(\"msg\");\n// e46b320165eec91e6344fa1034...\n\
    ```\n\n这看起来与之前的调用几乎相同，唯一的区别是 `await`。\n\n但对于集合，处理异步性就变得不同了。\n\n使用 `map` 计算**字符串集合**中每个元素的加倍是简单的：\n\
    \n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nstrings.map(double);\n\
    // [\"msg1msg1\", \"msg2msg2\", \"msg3msg3\"]\n```\n\n但是计算集合中每个字符串的**哈希**，这样就不行了：\n\
    \n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nawait strings.map(digestMessage);\n\
    // [object Promise],[object Promise],[object Promise]\n```\n\n这是一个日常问题，因为异步函数构成的类别比同步函数更大。同步函数可以在异步环境中工作，但异步函数无法转换为以同步方式工作。\n\
    \n对于更现实的场景，查询数据库本质上是异步的，因为它需要建立网络连接。从一个假想的数据库中获取单个 `userId` 的分数是简单的：\n\n```\n\
    const getUserObject = async (id) => {\n  // get user by id\n};\n\nconst userId\
    \ = 15;\nconst userObject = await getUserObject(userId);\nconst userScore = userObject.score;\n\
    ```\n\n但是如何查询数据库中*一组* `userId`s 呢？\n\n```\nconst userIds = [15, 16, 21];\n// const\
    \ userObjects = ???\n```\n\n而且这不仅仅是使用 `map` 将一个值转换为另一个值。用户的分数是否大于3？\n\n```\nconst\
    \ userObject = await getUserObject(userId);\nconst above3 = userObject.score >\
    \ 3;\n```\n\n但是*任何*用户的分数是否大于3？\n\n```\n// userIds.some(???)\n```\n\n或者平均分是多少？\n\
    \n```\n// userIds.reduce(???)\n```\n\n更有趣的是，给 `map` 添加 `async` 至少能表明哪些地方发生了变化：\n\
    \n```\n// synchronous\n[1, 2, 3].map((i) => {\n  return i + 1;\n});\n// [2, 3,\
    \ 4]\n\n// asynchronous\n[1, 2, 3].map(async (i) => {\n  return i + 1;\n});\n\
    // [object Promise],[object Promise],[object Promise]\n```\n\n但是 `filter` 就完全是错误的行为了：\n\
    \n```\n// synchronous\n[1, 2, 3, 4, 5].filter((i) => {\n  return i % 2 === 0;\n\
    });\n// [2, 4]\n\n// asynchronous\n[1, 2, 3, 4, 5].filter(async (i) => {\n  return\
    \ i % 2 === 0;\n});\n// [1, 2, 3, 4, 5]\n```\n\n因此，异步集合处理需要一些功夫，并且根据你想使用的函数类型而有所不同。异步\
    \ `map` 与异步 `filter` 或异步 `reduce` 的工作方式有显著差异。\n\n在本章中，你将学习它们各自的工作原理以及如何高效地使用它们。\n\
    \n## 用于迭代的异步\n\n但首先，让我们谈谈 `for` 循环！\n\n我不喜欢 `for` 循环，因为它们往往鼓励不良的编码实践，比如同时做很多事的嵌套循环，或者散布在各处、很快就会变得难以维护的\
    \ `continue`/`break` 语句。\n\n此外，像 `map`/`filter`/`reduce` 这样的函数式方法提倡一种风格，其中一个函数只做一件事，其内部所有内容都有作用域且是无状态的。而且函数式方法不仅在99%的情况下都是可行的，而且不会带来可感知的性能下降，它还会产生更简单的代码（好吧，至少当你了解相关函数时）。\n\
    \n但 async/await 属于剩下的1%。\n\n`for` 循环有一个显著特点，它们不依赖于*调用*一个函数。实际上，你可以在循环内使用 `await`，它就能正常工作。\n\
    \n```\n// synchronous\n{\n  const res = [];\n  for (let i of [1, 2, 3]) {\n  \
    \  res.push(i + 1);\n  }\n  // res: [2, 3, 4]\n}\n\n// asynchronous\n{\n  const\
    \ res = [];\n  for (let i of [1, 2, 3]) {\n    await sleep(10);\n    res.push(i\
    \ + 1);\n  }\n  // res: [2, 3, 4]\n}\n```\n\n由于 `for` 循环是一个通用工具，当处理集合时，它们可以用于各种需求。\n\
    \n但它们的缺点仍然存在，虽然将函数式方法适配到 async/await 并非易事，但一旦你开始理解其通用模式，也就没那么难了。\n\n## 使用 reduce\
    \ 的异步函数\n\n`reduce` 函数迭代地构建一个值并返回它，这个值不一定是一个集合。这就是其名称的由来，因为它将一个集合*归约*为一个值。\n\n\
    迭代函数接收前一个结果（在下面的示例中称为 `memo`）和当前值 `e`。\n\n以下函数对元素求和，从0开始（`reduce` 的第二个参数）：\n\n\
    ```\nconst arr = [1, 2, 3];\n\nconst syncRes = arr.reduce((memo, e) => {\n   \
    \ return memo + e;\n}, 0);\n\nconsole.log(syncRes);\n// 6\n```\n\n| memo     \
    \ | e | result    |\n| :---      | :--- | :--- |\n| 0 (初始值)   | 1 | 1 |\n| 1 \
    \   | 2 | 3 |\n| 3    | 3 | (最终结果) 6 |\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_90_0.png)\n\
    \n## 异步归约\n\n异步版本几乎相同，但它在每次迭代时返回一个 Promise，因此 `memo` 将是前一个结果的 *Promise*。迭代函数需要\
    \ `await` 它以计算下一个结果：\n\n```\n// utility function for sleeping\nconst sleep = (n)\
    \ => new Promise((res) => setTimeout(res, n));\n\nconst arr = [1, 2, 3];\n\nconst\
    \ asyncRes = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n  return\
    \ (await memo) + e;\n}, 0);\n\nconsole.log(asyncRes);\n// 6\n```\n\n| memo   \
    \   | e | result          |\n| :---      | :--- | :--- |\n| 0 (初始值)   | 1 | Promise(1)\
    \ |\n| Promise(1)   | 2 | Promise(3) |\n| Promise(3)   | 3 | (最终结果) Promise(6)\
    \ |\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_91_0.png)\n\n通过 `async (memo,\
    \ e) => await memo` 这种结构，`reduce` 可以处理任何异步函数，并且可以对其使用 `await`。\n"
