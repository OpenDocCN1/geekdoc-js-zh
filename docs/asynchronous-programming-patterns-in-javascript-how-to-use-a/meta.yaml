    Finished async\");\n// Finished async\n```\n\n这种方式下，元素按顺序处理，一个接一个地执行，程序会在整个数组完成后才继续下一步。\n\
    \n## 带有 filter 的异步函数\n\n`filter` 函数仅保留满足条件的元素。它接受一个函数（这次称为***谓词***(predicate)），该函数返回\
    \ true/false 值（更准确地说，是有效值和无效值）。生成的集合只包含那些使谓词返回 **true** 的元素。\n\n```javascript\n\
