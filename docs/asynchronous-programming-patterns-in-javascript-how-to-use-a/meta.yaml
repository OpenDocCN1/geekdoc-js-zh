    \n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_6_0.png)\n\nAn async function returns\
    \ a Promise"
  - "[PAGE 7]\n\nUsing standardized Promises also allows other constructs to build\
    \ on it. As we've seen, the `async` keyword makes a function return a Promise\
    \ instead of a value.\n\n> Recap\n\nAsync functions return Promises which are\
    \ values that are available sometime in the future.\n\n# The await keyword\n\n\
    Using Promises with callbacks requires changes to the code structure and it makes\
    \ the code harder to read.\n\nInstead of a flat structure of synchronous function\
    \ calls:\n\n```\nconst user = getUser();\nconst permissions = getPermissions();\n\
    const hasAccess = checkPermissions(user, permissions);\nif (hasAccess) {\n  //\
    \ handle request\n}\n```\n\nPromises need callbacks:\n\n```\ngetUser().then((user)\
    \ => {\n  getPermissions().then((permissions) => {\n    const hasAccess = checkPermissions(user,\
    \ permissions);\n    if (hasAccess) {\n      // handle request\n    }\n  });\n\
    });\n```"
- md: "# Note\n\nPromises support a flat structure when they are invoked sequentially,\
    \ this is their main selling point over traditional callbacks. For example, a\
    \ series of async calls can process an object:\n\n```\ngetUser()\n  .then(getPermissionsForUser)\n\
    \  .then(checkPermission)\n  .then((allowed) => {\n    // handle allowed or not\n\
    \  });\n```\n\nThis is an almost flat structure which we'll detail in the [Chaining\
    \ Promises](#) chapter, but a callback is still needed at the end. The `await`\
    \ keyword eliminates the need for that.\n\nTo solve this without losing the advantages\
    \ of Promises, async functions can use the `await` keyword. It **stops the function\
    \ until the Promise is ready** and returns the result value.\n\n```\nconst asyncFn\
    \ = async () => {\n  return 5;\n}\n\nawait asyncFn();\n// 5\n```\n\nThe above\
    \ code that uses callbacks can use `await` instead which leads to a more familiar\
    \ structure:\n\n```\nconst user = await getUser();\nconst permissions = await\
    \ getPermissions();\nconst hasAccess = checkPermissions(user, permissions);\n\
    if (hasAccess) {\n  // handle request\n}\n```\n\n# Async function examples\n\n\
    Another example is to interface with databases. A remote service always requires\
    \ network calls and that means asynchronous results.\n\nThis code, used in an\
    \ AWS Lambda function, updates a user's avatar image:\n\n```\n// move object out\
    \ of the pending directory\nawait s3.copyObject({/*...*/}).promise();\nawait s3.deleteObject({/*...*/}).promise();\n\
    \n// get the current avatar image\nconst oldAvatar = (await dynamodb.getItem({/*...*/}).promise())\n\
    \  .item.avatar.s;\n\n// update the user's avatar\nawait dynamodb.updateItem({/*...*/}).promise();\n\
    // delete the old image\nawait s3.deleteObject({/*...*/}).promise();\n\nreturn\
    \ {\n  statusCode: 200,\n};\n```\n\nIt makes calls to the AWS S3 service to move\
    \ objects, and to the DynamoDB database to read and modify data. Both of these\
    \ are remote services, but all the complexities are hidden behind the `lookup`\
    \ keyword.\n\n> Recap\n\nThe `lookup` keyword stops the function until the future\
    \ result becomes available.\n\n# Chaining Promises\n\nWe've seen that when an\
    \ async function returns a value it will be wrapped in a Promise and the `lookup`\
    \ keyword extracts the value from it. But what happens when an async function\
    \ returns a Promise? Would that mean you need to use two lookups?\n\nConsider\
    \ this code:\n\n```\nconst f1 = async () => {\n  return 2;\n};\n\nconst f2 = async\
    \ () => {\n  return f1();\n}\n\nconst result = await f2();\n```\n\nStrict following\
    \ the process described in the previous chapters, `f1()` returns `Promise<2>`,\
    \ and `f2()` returns `Promise<Promise<2>>`, so the value of `result` will be `Promise<2>`\
    \ instead of `2`.\n\nBut this is not what happens. When an async function returns\
    \ a Promise, it returns it without adding another layer. It does not matter if\
    \ it returns a value or a Promise, it will always be a Promise and it will always\
    \ resolve with the final value and not another Promise.\n\nThis works the same\
    \ for Promise chains too. The `.then()` callback is also wrapped in a Promise\
    \ if it's not one already so you can chain them easily:\n\n```\ngetUser()\n  .then(async\
    \ function getPermissionsForUser(user) {\n    const permissions = await // ...;\n\
    \    return permissions;\n  })\n  .then(async function checkPermission(permissions)\
    \ {\n    const allowed = await // ...;\n    return allowed;\n  })\n  .then((allowed)\
    \ => {\n    // handle allowed or not\n  });\n```\n\nThe `getUser` function returns\
    \ a `Promise<User>`, then the `getPermissionsForUser` gets the user object (the\
    \ resolved value), then returns the permission set. The next call, `checkPermission`\
    \ gets the permissions, and so on.\n\nA useful analog is how the `flatMap` function\
    \ for an array works. It does not matter if it returns a value or an array, the\
    \ end result will always be an array with values. It is a `map`, followed by a\
    \ `flat`.\n\n```\n[1].flatMap((a) => 5) // [5]\n[1].flatMap((a) => [5]) // [5]\n\
    \n[1].flat() // [1]\n[[1]].flat() // [1]\n```\n\nWhen I'm not sure what a Promise\
    \ chain returns, I mentally translate Promises to arrays where every async function\
    \ return a flattened array with its result and an `await` is getting the first\
    \ element:\n\n```\nconst f1 = () => {\n  return [2].flat();\n};\n\nconst f2 =\
    \ () => {\n  return [f1()].flat();\n}\n\nconst result = f2()[0]; // 2\n```\n\n\
    A Promise chain then becomes a series of `flatMap` s:\n\n```\nconst getUser =\
    \ () => [\"user\"];\n\ngetUser()\n  .flatMap(function getPermissionsForUser(user)\
    \ {\n    // user = \"user\"\n    const permissions = \"permissions\";\n    return\
    \ permissions;\n  })\n  .flatMap(function checkPermission(permissions) {\n   \
    \ // permissions = \"permissions\"\n    const allowed = true;\n    return allowed;\n\
    \  })\n  .flatMap((allowed) => {\n    // allowed = true\n    // handle allowed\
    \ or not\n  });\n```\n\nThis eliminates most of the complexities of asynchronicity\
    \ and is a lot easier to reason about.\n\n# Promises\n\nSo far we've discussed\
    \ how to write Promise-producing async functions and how to wait for a Promise\
    \ to have a value. But how to create Promises in cases where there are no existing\
    \ Promises to build on?\n\nTo know this, we need to discuss how asynchronicity\
    \ works in Javascript and how to construct Promises from callbacks.\n\n# Callbacks\n\
    \nAsync results come in the form of callbacks. These are like the parameter of\
    \ the `then()` function in Promises but are called when a particular event happens.\
    \ For example, the simplest callback is the `setTimeout` call that waits a given\
    \ number of milliseconds then invokes the argument function:\n\n```\nsetTimeout(()\
    \ => {\n  // 1s later\n}, 1000);\n```\n\nThis pattern of using callbacks is everywhere\
    \ in Javascript.\n\nThe gapi, the library to use Google services, [needs a callback](https://www.google.com)\
    \ when it loads a client library:\n\n```\ngapi.load(\"client:auth2\", () => {\n\
    \  // auth2 client loaded\n});\n```\n\nSimilarly, event listeners, such as a click\
    \ handler, calls a function when the event happened:\n\n```\nconst button = document.querySelector(\"\
    #button\");\n\nbutton.addEventListener(\"click\", () => {\n  // button is clicked\n\
    }, {once: true})\n```\n\nThe problem with callbacks is that we are back to square\
    \ one as instead of having a flat structure we have nesting again.\n\nFortunately,\
    \ there is a simple way to convert callbacks to Promises and then use them with\
    \ `await`.\n\n> Event listeners and Promises\n\nEagle-eyed readers might have\
    \ spotted the `{once: true}` part in the last example. Event listeners are inherently\
    \ different than async functions as they represent *multiple events* instead of\
    \ a single result value. Because of this, you can not replace them with Promises.\n\
    \nThe exception is when there is exactly one event, as in the above example. In\
    \ a sense, it works similarly to the timeout or the gapi load function, as the\
    \ callback is invoked when the event happens.\n\n# The Promise constructor\n\n\
    Async functions return Promises but you can only use `await` to wait for other\
    \ Promises and not for callbacks. To make a Promise, you need to use its constructor:\n\
    \n```\nnew Promise((res) => {\n  // call res when the Promise is ready\n});\n\
    ```\n\nCalling the `res` callback signals the Promise that the result is ready.\
    \ This is the same as when an async function returns.\n\nTo convert the `setTimeout`\
    \ to a Promise, wrap it in the constructor and use `res` as the callback:\n\n\
    ```\nawait new Promise((res) => {\n  setTimeout(res, 1000);\n});\n// 1s later\n\
    \n// same as\nawait new Promise((res) => {\n  setTimeout(() => {\n    res();\n\
    \  }, 1000);\n});\n```\n\nNow that it is a Promise, `await` works just like for\
    \ other async functions.\n\nSimilarly, the two other examples are also easy to\
    \ promisify:\n\n```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\"\
    , res);\n});\n// auth2 client loaded\n```\n\n```\nconst button = document.querySelector(\"\
    #button\");\n\nawait new Promise((res) => {\n  button.addEventListener(\"click\"\
    , res, {once: true});\n});\n// button is clicked\n```\n\nWith Promises instead\
    \ of callbacks it's easy to use `await` and make a sequence of async operations.\
    \ To load the auth2 client when the button is clicked:\n\n```\nawait new Promise((res)\
    \ => {\n  button.addEventListener(\"click\", res, {once: true});\n});\n// the\
    \ button is clicked\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\"\
    , res);\n});\n// the gapi library is loaded\n```"
  mdcn: "\n# 说明\n\nPromise 支持在按顺序被调用时采用扁平结构，这使其相对于传统回调函数具有主要优势。例如，一系列异步调用可以处理一个对象：\n\
    \n```\ngetUser()\n  .then(getPermissionsForUser)\n  .then(checkPermission)\n \
    \ .then((allowed) => {\n    // handle allowed or not\n  });\n```\n\n这是一个近乎扁平的结构，我们将在\
    \ [Promise 的链式调用](#) 章节中详细说明，但末尾仍然需要回调。`` await `` 关键字消除了这种需求。\n\n为了解决这个问题而又不失去\
    \ Promise 的优势，异步函数可以使用 ``await`` 关键字。它**在 Promise 就绪之前暂停函数执行**并返回结果值。\n\n```\n\
    const asyncFn = async () => {\n  return 5;\n}\n\nawait asyncFn();\n// 5\n```\n\
    \n上述使用回调的代码可以使用 ``await`` 替换，从而得到更熟悉的结构：\n\n```\nconst user = await getUser();\n\
    const permissions = await getPermissions();\nconst hasAccess = checkPermissions(user,\
    \ permissions);\nif (hasAccess) {\n  // handle request\n}\n```\n\n# 异步函数示例\n\n\
    另一个例子是与数据库交互。远程服务始终需要网络调用，这意味着异步结果。\n\n这段代码用于 AWS Lambda 函数，用于更新用户的头像图像：\n\n```\n\
    // move object out of the pending directory\nawait s3.copyObject({/*...*/}).promise();\n\
    await s3.deleteObject({/*...*/}).promise();\n\n// get the current avatar image\n\
    const oldAvatar = (await dynamodb.getItem({/*...*/}).promise())\n  .item.avatar.s;\n\
    \n// update the user's avatar\nawait dynamodb.updateItem({/*...*/}).promise();\n\
    // delete the old image\nawait s3.deleteObject({/*...*/}).promise();\n\nreturn\
    \ {\n  statusCode: 200,\n};\n```\n\n它会调用 AWS S3 服务来移动对象，并调用 DynamoDB 数据库来读取和修改数据。这两者都是远程服务，但所有复杂性都隐藏在\
    \ `` lookup `` 关键字之后。\n\n> 小结\n\n`` lookup `` 关键字会在未来结果可用时暂停函数执行。\n\n# Promise\
    \ 链式调用\n\n我们已经看到，当异步函数返回一个值时，它会被包装在 Promise 中，且 `` lookup `` 关键字从中提取该值。但是当异步函数返回一个\
    \ Promise 时会发生什么？这意味着你需要使用两次 lookup 吗？\n\n考虑这段代码：\n\n```\nconst f1 = async ()\
    \ => {\n  return 2;\n};\n\nconst f2 = async () => {\n  return f1();\n}\n\nconst\
    \ result = await f2();\n```\n\n严格遵循之前章节描述的过程，`` `f1()` `` 返回 `Promise<2>`，且 ``\
    \ `f2()` `` 返回 `Promise<Promise<2>>`，因此 ``result`` 的值将是 `Promise<2>` 而不是 `2`。\n\
    \n但实际情况并非如此。当异步函数返回 Promise 时，它返回它而不添加另一层。无论它是返回值还是 Promise，它始终是一个 Promise，并且始终会解析为最终值，而不会变成另一个\
    \ Promise。\n\n这对于 Promise 链也适用。如果 `.then()` 回调本身不是 Promise，它也会被包装在 Promise 中，因此你可以轻松连接它们：\n\
    \n```\ngetUser()\n  .then(async function getPermissionsForUser(user) {\n    const\
    \ permissions = await // ...;\n    return permissions;\n  })\n  .then(async function\
    \ checkPermission(permissions) {\n    const allowed = await // ...;\n    return\
    \ allowed;\n  })\n  .then((allowed) => {\n    // handle allowed or not\n  });\n\
    ```\n\n`getUser` 函数返回 `Promise<User>`，然后 `getPermissionsForUser` 获取用户对象（解析值），然后返回权限集。下一个调用是\
    \ `checkPermission` 获取权限，依此类推。\n\n一个有用的类比是数组的 `flatMap` 函数的运作方式。无论它返回值还是数组，最终结果始终是包含值的数组。它是一个\
    \ `map`，后接一个 `flat`。\n\n```\n[1].flatMap((a) => 5) // [5]\n[1].flatMap((a) =>\
    \ [5]) // [5]\n\n[1].flat() // [1]\n[[1]].flat() // [1]\n```\n\n当我不确定 Promise\
    \ 链返回什么时，我在脑海中将 Promise 转换为数组，其中每个异步函数返回值都生成包含其结果且被扁平化的数组，而 ``await`` 获取第一个元素：\n\
    \n```\nconst f1 = () => {\n  return [2].flat();\n};\n\nconst f2 = () => {\n  return\
    \ [f1()].flat();\n}\n\nconst result = f2()[0]; // 2\n```\n\nPromise 链随之变为一系列 `flatMap`：\n\
    \n```\nconst getUser = () => [\"user\"];\n\ngetUser()\n  .flatMap(function getPermissionsForUser(user)\
    \ {\n    // user = \"user\"\n    const permissions = \"permissions\";\n    return\
    \ permissions;\n  })\n  .flatMap(function checkPermission(permissions) {\n   \
    \ // permissions = \"permissions\"\n    const allowed = true;\n    return allowed;\n\
    \  })\n  .flatMap((allowed) => {\n    // allowed = true\n    // handle allowed\
    \ or not\n  });\n```\n\n这消除了大部分异步复杂性，也更易于推理。\n\n# Promise\n\n到目前为止，我们讨论了如何编写生成\
    \ Promise 的异步函数以及如何等待 Promise 拥有值。但如何在没有现有 Promise 可以构建的情况下创建 Promises？\n\n为了了解这一点，我们需要讨论\
    \ JavaScript 中异步是如何工作的，以及如何从回调构建 Promises。\n\n# 回调\n\n异步结果以回调的形式呈现。这些类似于 Promise\
    \ 中 `then()` 函数的参数，但在特定事件发生时被调用。例如，最简单的回调是 `setTimeout` 调用，它等待指定的毫秒数然后调用参数函数：\n\
    \n```\nsetTimeout(() => {\n  // 1s later\n}, 1000);\n```\n\n这种使用回调的模式在 JavaScript\
    \ 中无处不在。\n\ngapi（用于使用 Google 服务的库）[需要一个回调](https://www.google.com) 时加载客户端库：\n\n\
    ```\ngapi.load(\"client:auth2\", () => {\n  // auth2 client loaded\n});\n```\n\
    \n同样，事件监听器，例如点击处理程序，会在事件发生时调用函数：\n\n```\nconst button = document.querySelector(\"\
    #button\");\n\nbutton.addEventListener(\"click\", () => {\n  // button is clicked\n\
    }, {once: true})\n```\n\n回调的问题在于我们又回到了原点，没有扁平结构而是嵌套。\n\n幸运的是，有一种简单的方法可以将回调转换为\
    \ Promise，然后使用 ``await`` 进行调用。\n\n> 事件监听器和 Promises\n\n目光敏锐的读者可能会注意到上一个示例中的 `{once:\
    \ true}` 部分。事件监听器与异步函数本质上不同，因为它们代表*多个事件*而不是单个结果值。因此，不能用 Promises 替换它们。\n\n唯一的例外是恰好有一个事件的情况，如上述示例。从某种意义上说，它类似于超时或\
    \ gapi 加载函数，因为当事件发生时回调会被调用。\n\n# Promise 构造函数\n\n异步函数返回 Promise，但你只能使用 ``await``\
    \ 等待其他 Promise，而不能等待回调。要创建 Promise，你需要使用其构造函数：\n\n```\nnew Promise((res) => {\n\
    \  // call res when the Promise is ready\n});\n```\n\n调用 `res` 回调向 Promise 发出信号，表明结果已就绪。这就像异步函数返回值时一样。\n\
    \n要将 `setTimeout` 转换为 Promise，将其包装在构造函数中并使用 `res` 作为回调：\n\n```\nawait new Promise((res)\
    \ => {\n  setTimeout(res, 1000);\n});\n// 1s later\n\n// same as\nawait new Promise((res)\
    \ => {\n  setTimeout(() => {\n    res();\n  }, 1000);\n});\n```\n\n现在它是一个 Promise，``await``\
    \ 的作用就像对其他异步函数一样。\n\n同样，另外两个示例也可以很容易地转换为 Promise：\n\n```\nawait new Promise((res)\
    \ => {\n  gapi.load(\"client:auth2\", res);\n});\n// auth2 client loaded\n```\n\
    \n```\nconst button = document.querySelector(\"#button\");\n\nawait new Promise((res)\
    \ => {\n  button.addEventListener(\"click\", res, {once: true});\n});\n// button\
    \ is clicked\n```\n\n使用 Promises 代替回调，可以轻松地使用 ``await`` 并创建一系列异步操作。当点击按钮时加载 auth2\
    \ 客户端：\n\n```\nawait new Promise((res) => {\n  button.addEventListener(\"click\"\
    , res, {once: true});\n});\n// the button is clicked\nawait new Promise((res)\
    \ => {\n  gapi.load(\"client:auth2\", res);\n});\n// the gapi library is loaded\n\
    ```\n"
