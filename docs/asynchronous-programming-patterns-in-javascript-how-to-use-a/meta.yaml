  - "[PAGE 68]\n\n# Rejection-based retrying\n\nThis type of call **either succeeds\
    \ or fails** and it is usually implemented as a Promise resolving or rejecting.\
    \ A canonical example is a \"Save\" button that may fail and in that case, retrying\
    \ means sending the request again.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_68_0.png)\n\
    \nFor illustration, this operation emulates a network call that fails 90% of the\
    \ time:\n\n```\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\
    const maybeFail = (successProbability, result, error) =>\n  new Promise((res,\
    \ rej) => Math.random() < successProbability\n    ? res(result)\n    : rej()\n\
    \  );\n\nconst maybeFailingOperation = async () => {\n  await wait(10);\n  return\
    \ maybeFail(0.1, \"result\", \"error\");\n}\n```\n\nCalling this function without\
    \ a retry mechanism is bad UX. The user would need to click the button repeatedly\
    \ until it succeeds.\n\nA general-purpose solution that can take any async function\
    \ and retry it for a few times before giving up:"
  - "[PAGE 69]\n\n```\nconst callWithRetry = async (fn, depth = 0) => {\n  try {\n\
    \    return await fn();\n  }catch(e) {\n    if (depth > vus 7) {\n      throw\
    \ e;\n    }\n    await wait(2 ** depth * 10);\n\n    return callWithRetry(fn,\
    \ depth + 1);\n  }\n}\n```\n\nAnd to use it with the operation defined above:\n\
    \n```\nconst result = await callWithRetry(maybeFailingOperation);\n```\n\nIn the\
    \ retry implementation, the `depth` argument indicates the number of calls made\
    \ to the service so far. It determines how much to wait (`await wait(2 ** depth\
    \ * 10)`) and when to give up (`if (depth > 7) {...}`). When the function calls\
    \ itself it increments this value.\n\nInterestingly, this is a scenario where\
    \ using `return await` makes a difference. Usually, it does not matter if an async\
    \ function returns a Promise or its resolved value. But not in this case, as the\
    \ `try...catch` needs to wait for the `fn()` call to finish to handle exceptions\
    \ thrown from it.\n\nNote that this implementation retries for *any error*, even\
    \ if it is a non-retriable one, such as sending invalid data.\n\n# Progress-based\
    \ retrying\n\nAnother class of retriable operations is when **each call might\
    \ make some progress towards completion but might not reach it**.\n\nA great example\
    \ of this is how DynamoDB's `batchWriteItem` call works. You define the items\
    \ to store, and the call tries to save all of them. It then returns a list in\
    \ the response indicating which elements failed. The retry operation only needs\
    \ to include these missed items and not the whole request."
