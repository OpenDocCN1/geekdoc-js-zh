- img_proc: true
  md: "The Promise constructor is the low-level but universally applicable way to\
    \ convert callbacks to Promises. It works for every callback style and it needs\
    \ only a few lines of code.\n\nThe Promise constructor gets a function with two\
    \ arguments: a `resolve` and a `reject` function. When one of them is called,\
    \ the Promise will settle with either a result passed to the `resolve` function,\
    \ or an error, passed to the `reject`.\n\n```\nnew Promise((res, rej) => {\n\n\
    \  // resolve with a value\n  // res(value)\n\n  // reject with error:\n  // rej(error)\n\
    })\n```\n\nThis makes it easy to call a callback-based function and convert it\
    \ to a Promise which then can be `await`-ed:\n\n```\n// Node-style\nnew Promise((res,\
    \ rej) => getUser(15, (err, result) => {\n  if (err) {\n    rej(err);\n  }else\
    \ {\n    res(result);\n  }\n}))\n\n// setTimeout\nnew Promise((res) => setTimeout(res,\
    \ 100));\n\n// event-based\nnew Promise((res, rej) => {\n  const reader = new\
    \ FileReader();\n  reader.onload = (event) => {\n    // resolve the Promise\n\
    \    res(event.target.result);\n  }\n  reader.onerror = (error) => {\n    // reject\
    \ the Promise\n    rej(error)\n  };\n  reader.readAsDataURL(blob);\n});\n```"
