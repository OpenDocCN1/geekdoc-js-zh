  md: "# Convert between Promises and callbacks\n\nWhile Promises and async/await\
    \ are increasingly the primary way to write asynchronous code in Javascript, callbacks\
    \ are still used in many places. Several libraries that adopted that style are\
    \ slow to migrate to the more modern alternative, and browser (and Node) APIs\
    \ are also slow to change.\n\nFor example, [marked](https://github.com/markedjs/marked),\
    \ a markdown compiler needs a callback when it's used in asynchronous mode:\n\n\
    ```\nmarked(text, options, (err, result) => {\n  // result is the compiled markdown\n\
    });\n```\n\nSimilarly, `setTimeout` invokes a function when the time is up:\n\n\
    ```\nsetTimeout(callback, 100);\n```\n\nNot to mention a ton of web APIs, such\
    \ as [Indexed DB](https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API),\
    \ [FileReader](https://developer.mozilla.org/en-US/docs/Web/API/FileReader), and\
    \ others. Callbacks are still everywhere, and it's a good practice to convert\
    \ them to Promises especially if your code is already using async/await.\n\n#\
    \ Callback styles\n\nCallbacks implement the continuation-passing style programming\
    \ where **a function** instead of returning a value **calls** a continuation,\
    \ in this case, **an argument function**. It is especially prevalent in Javascript\
    \ as it does not support synchronous waiting. Everything that involves some future\
    \ events, such as network calls, an asynchronous API, or a simple timeout is only\
    \ possible by using a callback mechanism."
  merge: -1
  pgno: 39
- img_proc: true
  md: "There are several ways callbacks can work. For example, `setTimeout` uses a\
    \ callback-first pattern:\n\n```\nsetTimeout(callback, ms);\n```\n\nOr functions\
    \ can get multiple functions and call them when appropriate:\n\n```\nconst checkAdmin\
    \ = (id, isAdmin, notAdmin) => {\n  if (/* admin logic */) {\n    isAdmin();\n\
    \  } else {\n    notAdmin();\n  }\n};\n```\n\nHow the callback is invoked can\
    \ also vary. For example, it might get multiple arguments:\n\n```\nconst getUserData\
    \ = (id, cb) => {\n  const user = /* get user */\n  cb(user.id, user.profile,\
    \ user.avatar);\n};\n```\n\nAlso, asynchronicity might be implemented as an object\
    \ that emits events:\n\n```\nconst reader = new FileReader();\nreader.onload =\
    \ (event) => {\n  // event.target.result\n}\nreader.onerror = (error) => {\n \
    \ // handle error\n};\nreader.readAsDataURL(blob);\n```\n\n# Node-style callbacks\n\
    \nAs there are multiple equally reasonable ways to implement callbacks, it was\
    \ a mess at first. A de-facto standard emerged, which is now called Node-style\
    \ or error-first callbacks. It is used almost everywhere in Javascript whenever\
    \ a callback is needed."
  merge: -1
  pgno: 40
- img_proc: true
  md: "A Node-style callback has three characteristics:\n\n+   - The callback function\
    \ is the last argument\n- It is called with an error object first, then a result\
    \ (`(error, result)`)\n- It returns only one result\n\nAs an illustration, this\
    \ function implements a Node-style callback:\n\n```\nconst getUser = (id, cb)\
    \ => {\n  const user = /* get user */;\n  if (user) {\n    // success\n    cb(null,\
    \ user);\n  }else {\n    // error\n    cb(new Error(\"Failed to get user\"));\n\
    \  }\n};\n```\n\nNotice that when there is no error, the first argument is `null`.\
    \ This allows the caller to easily check whether the execution failed or succeeded:\n\
    \n```\ngetUser(15, (error, result) => {\n  if (error) {\n    // handle error\n\
    \  } else {\n    // handle result\n  }\n});\n```\n\nWith a callback structure\
    \ that is used almost exclusively, it is possible to convert between Promises\
    \ and callbacks more easily.\n\n# # Convert callbacks to Promises\n\nThis is the\
    \ more prominent direction as it's a common task to integrate a callback-based\
    \ function into an async/await flow. Let's see how to do it!\n\n# ## Promise constructor"
  merge: -1
