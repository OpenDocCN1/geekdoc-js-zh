    # # Retrying async operations


    # ## Backoff algorithm


    A Javascript application made a `fetch` call to a remote server and it failed.
    How should it retry the request so that it eventually succeeds while also minimizing
    the calls made?


    A backoff algorithm makes sure that **when a target system can not serve a request
    it is not flooded with subsequent retries**. It achieves this by introducing a
    **waiting period between the retries** to give the target a chance to recover.


    The need for a backoff builds on the observation that a service is unavailable
    when it is overloaded and sending more requests only exacerbates the problem.
    When all callers temporarily cease adding more load to the already overloaded
    service usually smooths the traffic spikes with only a slight delay.


    ![](img/bf8ff49d078976cf7c9fa8008bbb9b22_65_0.png)


    **The backoff algorithm used determines how much to wait between the retries**.
    The best configuration is actively researched in the case of network congestion,
    such as when a mobile network is saturated. It''s fascinating to'
  - '[PAGE 66]


    see that different implementations yield drastically different effective bandwidth.


    Retrying a failed call to a remote server is a much easier problem and doing it
    right does not require years of research. In this article, you''ll learn how to
    implement a backoff solution in Javascript that is good enough for all practical
    purposes.


    # Exponential backoff


    But let''s first revisit the problem of choosing the backoff strategy, i.e. **how
    much to wait between the retries!** Sending requests too soon puts more load on
    the potentially struggling server, while waiting too long introduces too much
    lag.


    The exponential backoff became the standard algorithm to use. It waits exponentially
    longer for subsequent retries, which makes the first few tries happen with only
    a slight delay while it reaches longer periods quickly.


    It has two parameters: the **delay of the first period** and the **growth factor**.
    For example, when the first retry waits 10ms and the subsequent ones double the
    previous values, the waiting times are: 10, 20, 40, 80, 160, 320, 640, 1280, ...


    Notice that the sum of the first 3 attempts is less than 100 ms, which is barely
    noticeable. But it reaches >1 second in just 8 tries.'
  - '[PAGE 67]


    ![](img/bf8ff49d078976cf7c9fa8008bbb9b22_67_0.png)


    Exponential backoff


    # Javascript implementation


    There are two pitfalls when implementing a backoff algorithm.


    First, make sure to **wait only before retries and not the first request.** Waiting
    first and sending a request then introduces a delay even for successful requests.


    And second, make sure to **put a limit to the number of retries** so that the
    code eventually gives up and throws an error. Even if the call eventually succeeds,
    something upstream timeouts in the meantime, and the user likely gets an error.
    Returning an error in a timely manner and letting the user retry the operation
    is a good UX practice.


    There are two types of operation in terms of retrying: rejection-based and progress-based.
    Let''s discuss each of them!'
- md: "# Rejection-based retrying\n\nThis type of call **either succeeds or fails**\
    \ and it is usually implemented as a Promise resolving or rejecting. A canonical\
    \ example is a \"Save\" button that may fail and in that case, retrying means\
    \ sending the request again.\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_68_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_68_0.png)\n\
    \nFor illustration, this operation emulates a network call that fails 90% of the\
    \ time:\n\n```js\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\
    const maybeFail = (successProbability, result, error) =>\n  new Promise((res,\
    \ rej) => Math.random() < successProbability\n    ? res(result)\n    : rej()\n\
    \  );\n\nconst maybeFailingOperation = async () => {\n  await wait(10);\n  return\
    \ maybeFail(0.1, \"result\", \"error\");\n}\n```\n\nCalling this function without\
    \ a retry mechanism is bad UX. The user would need to click the button repeatedly\
    \ until it succeeds.\n\nA general-purpose solution that can take any async function\
    \ and retry it for a few times before giving up:\n\n```js\nconst callWithRetry\
    \ = async (fn, depth = 0) => {\n  try {\n    return await fn();\n  } catch (e)\
    \ {\n    if (depth > 7) {\n      throw e;\n    }\n    await wait(2 ** depth *\
    \ 10);\n\n    return callWithRetry(fn, depth + 1);\n  }\n}\n```\n\nAnd to use\
    \ it with the operation defined above:\n\n```js\nconst result = await callWithRetry(maybeFailingOperation);\n\
    ```\n\nIn the retry implementation, the `depth` argument indicates the number\
    \ of calls made to the service so far. It determines how much to wait (`await\
    \ wait(2 ** depth * 10)`) and when to give up (`if (depth > 7) {...}`). When the\
    \ function calls itself it increments this value.\n\nInterestingly, this is a\
    \ scenario where using `return await` makes a difference. Usually, it does not\
    \ matter if an async function returns a Promise or its resolved value. But not\
    \ in this case, as the `try...catch` needs to wait for the `fn()` call to finish\
    \ to handle exceptions thrown from it.\n\nNote that this implementation retries\
    \ for *any error*, even if it is a non-retriable one, such as sending invalid\
    \ data.\n\n# Progress-based retrying\n\nAnother class of retriable operations\
    \ is when **each call might make some progress towards completion but might not\
    \ reach it**.\n\nA great example of this is how DynamoDB's `batchWriteItem` call\
    \ works. You define the items to store, and the call tries to save all of them.\
    \ It then returns a list in the response indicating which elements failed. The\
    \ retry operation only needs to include these missed items and not the whole request.\n\
    \n![img/bf8ff49d078976cf7c9fa8008bbb9b22_70_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_70_0.png)\n\
    \nProgress-based retrying\n\nAs an illustration, this function emulates a progressing\
    \ call to a remote server. It returns a progress field that goes from 0 to 1,\
    \ and a result when the call is fully finished. It also needs to know the current\
    \ progress, which is a parameter for the call:\n\n```js\nconst progressingOperation\
    \ = async (startProgress = 0) => {\n  await wait(10);\n  const progress = Math.round(\n\
    \    Math.min(startProgress + Math.random() / 3, 1) * 10\n  ) / 10;\n  return\
    \ {\n    progress,\n    result: progress === 1 ? \"result\" : undefined,\n  };\n\
    }\n```\n\nIn this case, not reaching completion still resolves the Promise, which\
    \ mimics the DynamoDB API. But a different API might reject it. Fortunately, it's\
    \ easy to convert a rejected Promise to a resolved one: `.catch()`\n\nIn the DynamoDB\
    \ batchWriteItem example, the progress return field is the list of the unprocessed\
    \ items, and the startProgress parameter is the items to save.\n\nTo retry the\
    \ above call until it reaches completion:\n\n```js\nconst callWithProgress = async\
    \ (fn, status, depth = 0) => {\n  const result = await fn(status);\n\n  // check\
    \ completion\n  if (result.progress === 1) {\n    // finished\n    return result.result;\n\
    \  } else {\n    // unfinished\n    if (depth > 7) {\n      throw result;\n  \
    \  }\n    await wait(2 ** depth * 10);\n\n    return callWithProgress(fn, result.progress,\
    \ depth + 1);\n  }\n}\n```\n\nTo use this retrying call, use:\n\n```js\nconst\
    \ result = await callWithProgress(progressingOperation);\n```\n\nNote that this\
    \ implementation is not general-purpose as it builds on how the call returns progress.\n\
    \n# Paginating with async generators\n\nMany APIs limit how many results they\
    \ return for a single call. For example, the functions of the AWS SDK that return\
    \ lists are paginated operations. That means that you get a limited number of\
    \ elements in one call along with a token to get the next batch. This can be a\
    \ problem if you are not aware of it, as you might get all the elements during\
    \ development but your function might break in the future.\n\nBut while getting\
    \ the first batch is just `await lambda.listFunctions().promise()`, paginating\
    \ until all the pages are retrieved requires more work.\n\nLet's see how to make\
    \ an `await`-able structure that reliably gets all the elements from an AWS API!\n\
    \n# Pagination\n\nIn the case of Lambda functions, the `lambda.listFunctions`\
    \ call returns a structure with a list of all your lambdas if you don't have too\
    \ many of them (at most 50):\n\n```js\nconst functions = await lambda.listFunctions().promise();\n\
    ```\n\n```json\n{\n  Functions: [...]\n}\n```\n\nTo simulate a paginated case,\
    \ you can set the `MaxItems` parameter:\n\n```js\nconst functions = await lambda.listFunctions({\n\
    \  MaxItems: 1\n}).promise();\n```\n\nThis time a `NextMarker` is also returned,\
    \ indicating there are more items:\n\n```json\n{\n  Functions: [...],\n  NextMarker:\
    \ ...\n}\n```\n\nTo get the next batch, provide the last marker:\n\n```js\nconst\
    \ functions = await lambda.listFunctions({\n  MaxItems: 1,\n  Marker: functions.NextMarker,\n\
    }).promise();\n```\n\nThen do so until no NextMarker is returned.\n\n# **A solution\
    \ with async generators**\n\nAsync generators are a relatively new feature of\
    \ JavaScript. They are like traditional generator functions, but they are async,\
    \ meaning you can `await` inside them.\n\nTo collect all the Lambda functions\
    \ no matter how many calls are needed, use:\n\n```js\nconst getAllLambdas = async\
    \ () => {\n  const EMPTY = Symbol(\"empty\");\n  \n  const res = [];\n  for await\
    \ (const lf of (async function*() {\n    let NextMarker = EMPTY;\n    while (NextMarker\
    \ !== EMPTY) {\n      const functions = await lambda.listFunctions({\n       \
    \ Marker: NextMarker !== EMPTY ? NextMarker : undefined,\n      }).promise();\n\
    \      yield* functions.Functions;\n      NextMarker = functions.NextMarker;\n\
    \    }\n  })()) {\n    res.push(lf);\n  }\n  return res;\n  // use it\n  const\
    \ functions = await getAllLambdas();\n}\n```\n\n# Async generator functions\n\n\
    A generator function that can use `await`. When it encounters a `yield` or a `yield*`\
    \ the execution stops until a subsequent element is requested.\n\n```js\nconst\
    \ wait = (ms) =>\n  new Promise((res) => setTimeout(res, ms));\n\nconst gen =\
    \ async function*() {\n  console.log(\"start\");\n  await wait(100);\n  yield\
    \ 1;\n  await wait(100);\n  console.log(\"next\");\n  yield 2;\n  await wait(100);\n\
    \  console.log(\"end\");\n};\n\nconst it = gen();\nconsole.log(await it.next());\n\
    console.log(await it.next());\nconsole.log(await it.next());\n\n// start\n// {\
    \ value: 1, done: false }\n// next\n// { value: 2, done: false }\n// end\n// {\
    \ value: undefined, done: true }\n```\n\n# Breaking it down\n\nThe most important\
    \ thing is to keep track of the `NextMarker` returned by the last call and use\
    \ that for making the next one. For the first call, `Marker` should be `undefined`,\
    \ and to differentiate between the first and the last one (the one that returns\
    \ no `NextMarker`), a Symbol is a safe option as it cannot be returned by the\
    \ API.\n\n```js\nconst EMPTY = Symbol(\"empty\");\nlet NextMarker = EMPTY;\nwhile\
    \ (NextMarker !== EMPTY) {\n    // Marker: NextMarker !== EMPTY ? NextMarker :\
    \ undefined\n\n    NextMarker = functions.NextMarker;\n}\n```\n\nAfter the call,\
    \ we need to `yield` the functions returned:\n\n```js\nyield* functions.Functions;\n\
    ```\n\nThe `yield*` makes sure that each element is returned as a separate value\
    \ by the generator.\n\nFinally, a `for await..of` loop collects the results and\
    \ returns them as an Array:\n\n```js\nconst res = [];\nfor await (const lf of\
    \ (async function*() {\n    ...\n})()) {\n    res.push(lf);\n}\nreturn res;\n\
    ```\n\nTo use it, just call the function and wait for the resulting Promise to\
    \ resolve:\n\n```js\nconst functions = await getAllLambdas();\n```\n\n# Making\
    \ it generic\n\nThe same `Marker` / `NextMarker` pattern appears throughout the\
    \ AWS SDK. But unfortunately, the naming is different for different services.\
    \ For example, getting the CloudWatch Logs log groups you need to provide a `nextToken`\
    \ parameter. This makes it impossible to support all the listing functions with\
    \ a generic wrapper.\n\nLuckily, as the pattern is the same, we can make a wrapper\
    \ function that handles everything but the naming:"
  mdcn: "\n# 基于拒绝的重试\n\n这种类型的调用**要么成功，要么失败**，通常实现为 Promise 的解析或拒绝。一个典型的例子是“保存”按钮可能会失败，在这种情况下，重试意味着重新发送请求。\n\
    \n![img/bf8ff49d078976cf7c9fa8008bbb9b22_68_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_68_0.png)\n\
    \n为了说明，此操作模拟了一个网络调用，其失败率为 90%：\n\n```js\nconst wait = (ms) => new Promise((res)\
    \ => setTimeout(res, ms));\nconst maybeFail = (successProbability, result, error)\
    \ =>\n  new Promise((res, rej) => Math.random() < successProbability\n    ? res(result)\n\
    \    : rej()\n  );\n\nconst maybeFailingOperation = async () => {\n  await wait(10);\n\
    \  return maybeFail(0.1, \"result\", \"error\");\n}\n```\n\n在不使用重试机制的情况下调用此函数会导致糟糕的用户体验。用户需要反复点击按钮直到成功。\n\
    \n一种通用解决方案，可以接受任何异步函数并在放弃之前重试几次：\n\n```js\nconst callWithRetry = async (fn, depth\
    \ = 0) => {\n  try {\n    return await fn();\n  } catch (e) {\n    if (depth >\
    \ 7) {\n      throw e;\n    }\n    await wait(2 ** depth * 10);\n\n    return\
    \ callWithRetry(fn, depth + 1);\n  }\n}\n```\n\n并将其与上述操作一起使用：\n\n```js\nconst\
    \ result = await callWithRetry(maybeFailingOperation);\n```\n\n在重试实现中，`depth`参数表示已向服务发出的调用次数。它确定等待多久（`await\
    \ wait(2 ** depth * 10)`）以及何时放弃（`if (depth > 7) {...}`）。当函数调用自身时，它会增加此值。\n\n有趣的是，这是一个使用\
    \ `return await`会有所不同的场景。通常，异步函数返回 Promise 还是其解析值并不重要。但在这种情况下并非如此，因为 `try...catch`需要等待`fn()`调用的完成来处理从中抛出的异常。\n\
    \n注意，此实现会针对*任何错误*进行重试，即使它是不可重试的错误，例如发送无效数据。\n\n# 基于进度的重试\n\n另一类可重试的操作是**每次调用都可能向完成迈进一些进度，但可能无法到达终点**。\n\
    \n这方面的一个很好的例子是 DynamoDB 的 `batchWriteItem`调用方式。你定义要存储的项目，调用尝试保存所有项目。然后它在响应中返回一个列表，指示哪些元素失败。重试操作只需要包含这些遗漏的项目，而不是整个请求。\n\
    \n![img/bf8ff49d078976cf7c9fa8008bbb9b22_70_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_70_0.png)\n\
    \n为了说明，此函数模拟了一个向远程服务器进行的进度调用。它返回一个进度字段，从 0 到 1，以及当调用完全结束时生成的结果。它还必须知道当前进度，这是调用的参数：\n\
    \n```js\nconst progressingOperation = async (startProgress = 0) => {\n  await\
    \ wait(10);\n  const progress = Math.round(\n    Math.min(startProgress + Math.random()\
    \ / 3, 1) * 10\n  ) / 10;\n  return {\n    progress,\n    result: progress ===\
    \ 1 ? \"result\" : undefined,\n  };\n}\n```\n\n在这种情况下，即使未达到完成状态，Promise 也会解析，这模仿了\
    \ DynamoDB API。但不同的 API 可能会拒绝它。幸运的是，将拒绝的 Promise 转换为已解析的形式很容易：`.catch()`\n\n在\
    \ DynamoDB batchWriteItem 例子中，进度返回字段是未处理的项目列表，而 `startProgress`参数是要保存的项目。\n\n\
    重试上述调用直到完成：\n\n```js\nconst callWithProgress = async (fn, status, depth = 0) =>\
    \ {\n  const result = await fn(status);\n\n  // check completion\n  if (result.progress\
    \ === 1) {\n    // finished\n    return result.result;\n  } else {\n    // unfinished\n\
    \    if (depth > 7) {\n      throw result;\n    }\n    await wait(2 ** depth *\
    \ 10);\n\n    return callWithProgress(fn, result.progress, depth + 1);\n  }\n\
    }\n```\n\n要使用此重试调用，请使用：\n\n```js\nconst result = await callWithProgress(progressingOperation);\n\
    ```\n\n注意，由于此实现构建在调用如何返回进度的基础上，它并不是通用的。\n\n# 使用异步生成器分页\n\n许多 API 限制单次调用的结果数量。例如，AWS\
    \ SDK 中返回列表的函数是已分页的操作。这意味着你在一次调用中获得有限数量的元素，同时附带获取下一批次的令牌。如果你不知道这一点，这可能是一个问题，因为你可能在开发期间获取了所有元素，但你的函数在未来可能会崩溃。\n\
    \n但是，虽然获取第一批只需`await lambda.listFunctions().promise()`，分页直到检索所有页面需要更多工作。\n\n让我们看看如何使\
    \ `await` 结构能够可靠地从 AWS API 获取所有元素！\n\n# 分页\n\n对于 Lambda 函数，`lambda.listFunctions`\
    \ 调用如果在你的 Lambda 不多（最多 50）的情况下返回包含所有 Lambda 的结构：\n\n```js\nconst functions = await\
    \ lambda.listFunctions().promise();\n```\n\n```json\n{\n  Functions: [...]\n}\n\
    ```\n\n要模拟分页情况，您可以设置 `MaxItems`参数：\n\n```js\nconst functions = await lambda.listFunctions({\n\
    \  MaxItems: 1\n}).promise();\n```\n\n这次还返回了 `NextMarker`，指示还有更多项目：\n\n```json\n\
    {\n  Functions: [...],\n  NextMarker: ...\n}\n```\n\n要获取下一批，提供最后的标记：\n\n```js\n\
    const functions = await lambda.listFunctions({\n  MaxItems: 1,\n  Marker: functions.NextMarker,\n\
    }).promise();\n```\n\n然后一直这样做，直到不再返回 `NextMarker`。\n\n# **一种使用异步生成器的解决方案**\n\n\
    异步生成器是 JavaScript 的一项相对较新的特性。它们像传统的生成器函数，但是是异步的，意味着你可以在其中使用`await`。\n\n无论需要多少次调用，收集所有\
    \ Lambda 函数请使用：\n\n```js\nconst getAllLambdas = async () => {\n  const EMPTY =\
    \ Symbol(\"empty\");\n  \n  const res = [];\n  for await (const lf of (async function*()\
    \ {\n    let NextMarker = EMPTY;\n    while (NextMarker !== EMPTY) {\n      const\
    \ functions = await lambda.listFunctions({\n        Marker: NextMarker !== EMPTY\
    \ ? NextMarker : undefined,\n      }).promise();\n      yield* functions.Functions;\n\
    \      NextMarker = functions.NextMarker;\n    }\n  })()) {\n    res.push(lf);\n\
    \  }\n  return res;\n  // use it\n  const functions = await getAllLambdas();\n\
    }\n```\n\n# 异步生成器函数\n\n一个可以使用 `await` 的生成器函数。当遇到 `yield`或`yield*`时，执行会停止直到请求下一个元素。\n\
    \n```js\nconst wait = (ms) =>\n  new Promise((res) => setTimeout(res, ms));\n\n\
    const gen = async function*() {\n  console.log(\"start\");\n  await wait(100);\n\
    \  yield 1;\n  await wait(100);\n  console.log(\"next\");\n  yield 2;\n  await\
    \ wait(100);\n  console.log(\"end\");\n};\n\nconst it = gen();\nconsole.log(await\
    \ it.next());\nconsole.log(await it.next());\nconsole.log(await it.next());\n\n\
    // start\n// { value: 1, done: false }\n// next\n// { value: 2, done: false }\n\
    // end\n// { value: undefined, done: true }\n```\n\n# 分解它\n\n最重要的是跟踪最后一次调用返回的\
    \ `NextMarker` 并将其用于下一次调用。对于第一次调用，`Marker`应该为 `undefined`，并且为了区分第一次和最后一次（即没有返回\
    \ `NextMarker` 的那一次），Symbol 是一个安全的选择，因为它不会被 API 返回。\n\n```js\nconst EMPTY = Symbol(\"\
