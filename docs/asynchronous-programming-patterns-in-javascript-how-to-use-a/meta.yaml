  md: '# # Retrying async operations


    # ## Backoff algorithm


    A Javascript application made a `fetch` call to a remote server and it failed.
    How should it retry the request so that it eventually succeeds while also minimizing
    the calls made?


    A backoff algorithm makes sure that **when a target system can not serve a request
    it is not flooded with subsequent retries**. It achieves this by introducing a
    **waiting period between the retries** to give the target a chance to recover.


    The need for a backoff builds on the observation that a service is unavailable
    when it is overloaded and sending more requests only exacerbates the problem.
    When all callers temporarily cease adding more load to the already overloaded
    service usually smooths the traffic spikes with only a slight delay.


    ![](img/bf8ff49d078976cf7c9fa8008bbb9b22_65_0.png)


    **The backoff algorithm used determines how much to wait between the retries**.
    The best configuration is actively researched in the case of network congestion,
    such as when a mobile network is saturated. It''s fascinating to'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'see that different implementations yield drastically different effective bandwidth.


    Retrying a failed call to a remote server is a much easier problem and doing it
    right does not require years of research. In this article, you''ll learn how to
    implement a backoff solution in Javascript that is good enough for all practical
    purposes.


    # Exponential backoff


    But let''s first revisit the problem of choosing the backoff strategy, i.e. **how
    much to wait between the retries!** Sending requests too soon puts more load on
    the potentially struggling server, while waiting too long introduces too much
    lag.


    The exponential backoff became the standard algorithm to use. It waits exponentially
    longer for subsequent retries, which makes the first few tries happen with only
    a slight delay while it reaches longer periods quickly.


    It has two parameters: the **delay of the first period** and the **growth factor**.
    For example, when the first retry waits 10ms and the subsequent ones double the
    previous values, the waiting times are: 10, 20, 40, 80, 160, 320, 640, 1280, ...


    Notice that the sum of the first 3 attempts is less than 100 ms, which is barely
    noticeable. But it reaches >1 second in just 8 tries.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '![](img/bf8ff49d078976cf7c9fa8008bbb9b22_67_0.png)


    Exponential backoff


    # Javascript implementation


    There are two pitfalls when implementing a backoff algorithm.


    First, make sure to **wait only before retries and not the first request.** Waiting
    first and sending a request then introduces a delay even for successful requests.


    And second, make sure to **put a limit to the number of retries** so that the
    code eventually gives up and throws an error. Even if the call eventually succeeds,
    something upstream timeouts in the meantime, and the user likely gets an error.
    Returning an error in a timely manner and letting the user retry the operation
    is a good UX practice.


    There are two types of operation in terms of retrying: rejection-based and progress-based.
    Let''s discuss each of them!'
  merge: -1
