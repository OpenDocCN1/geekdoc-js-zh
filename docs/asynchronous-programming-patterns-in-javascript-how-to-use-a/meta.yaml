    \ puppeteer.launch({/* ... */});\ntry {\n  const page = await browser.newPage();\n\
    \  // ...\n  screenshot = await page.screenshot({/* ... */});\n} finally {\n \
    \ await browser.close();\n}\n\n// use screenshot\n```\n\nA better solution is\
    \ to **use a function**:\n\n```\nconst makeScreenshot = async () => {\n  const\
    \ browser = await puppeteer.launch({/* ... */});\n  try {\n    const page = await\
    \ browser.newPage();\n    // ...\n    return await page.screenshot({/* ... */});\n\
    \  } finally {\n    await browser.close();\n  }\n}\n\nconst screenshot = await\
    \ makeScreenshot();\n```\n\nThis is the basis of the disposer pattern. The difference\
    \ is that **instead of hardcoding the logic inside the `try..finally` block, it\
    \ gets a function that implements that part:**"
  - "[PAGE 64]\n\n```\nconst withBrowser = async (fn) => {\n    const browser = await\
    \ puppeteer.launch(/* ... */);\n    try {\n      return await fn(browser);\n \
    \   } finally {\n      await browser.close();\n    }\n  }\n\nconst screenshot\
