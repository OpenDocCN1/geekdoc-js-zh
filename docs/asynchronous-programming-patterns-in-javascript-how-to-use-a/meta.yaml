  - '[PAGE 79]


    Both communicating with an IFrame and with a worker has problems. First, sending
    the request and handling the response is separated. **The receiving side uses
    a global (or a per-worker) event listener**, which is shared between the calls.


    This is good for "notification-style" messages where one end wants to notify the
    other that something happened but not expecting a response. But **notification-style
    messaging is rare**. What is usually needed is a "request-response-style" messaging.


    For example, one end uses an access token that the other one can refresh. The
    communication consists of a request to refresh and a response to that with the
    refreshed token. Or even when a user clicks on a button and the other side needs
    to handle this. This example seems like a "notification-style" message, but when
    the button needs to be disabled while the operation takes place (such as a save
    button) or there is a possibility of an error that the sender needs to know about,
    it''s now a request-response.


    The global (or per-worker) message handler is not suited for pairing responses
    to requests. The ideal solution would be to hide all these complications behind
    an async function call and use `await` to wait for the result:


    ```

    const result = await add(10, 5);

    ```


    Let''s see how to make such a function!


    # Response identification


    The first task is to know which request triggered a given response. The problem
    with using the global event handler is that it''s all too easy to rely on only
    one communication happening at a time. When you test your webapp, you test one
    thing at a time but users won''t be that considerate. You can''t assume only one
    request-response will happen at any one time.'
