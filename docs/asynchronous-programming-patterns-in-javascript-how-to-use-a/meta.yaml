  md: "# # Common errors\n\n# ## Not propagating errors\n\nWhen you convert a callback\
    \ to a Promise, make sure that you also handle the error case. Without that, the\
    \ Promise is never resolved and an `await` waits forever.\n\nFor example, the\
    \ `gapi.load` provides separate callbacks for results and errors:\n\n```\nawait\
    \ new Promise((res, rej) => {\n  gapi.load(\"client:auth2\", {callback: res, onerror:\
    \ rej});\n});\n```\n\nIf you don't attach the `rej` callback to the `onerror`\
    \ handler, errors won't propagate through the chain. This leads to hard-to-debug\
    \ problems and components that \"just stops\".\n\n# ## Missing await in try..catch\n\
    \nWhen you use `try..catch` or `try..finally` in an async function, make sure\
    \ that you use `await` too. For example, this code works fine when the inner Promise\
    \ resolves:\n\n```\nconst fn = async () => {\n  return \"result\";\n}\n\nconst\
    \ outer = async () => {\n  try {\n    return fn(); // <= missing await!\n  }catch(e)\
    \ {\n    console.log(e.message);\n  }\n}\n\nawait outer(); // result\n```"
  merge: -1
  pgno: 118
- img_proc: true
  md: "But the `try..catch` won't handle exceptions:\n\n```\nconst fn = async () =>\
    \ {\n  throw new Error(\"error\");\n}\n\nconst outer = async () => {\n  try {\n\
    \    return fn(); // <= missing await!\n  }catch(e) {\n    console.log(e.message);\n\
    \  }\n}\n\nawait outer();\n// exception is thrown!\n```\n\nThis is because exceptions\
    \ are thrown from the `await` and while returning a Promise from an async function\
    \ flattens the result, it will be returned without waiting for it. And without\
    \ waiting, an exception is not thrown for the `try..catch` but when the caller\
    \ uses `await`.\n\n```\nconst fn = async () => {\n  throw new Error(\"error\"\
    );\n}\n\nconst outer = async () => {\n  try {\n    return await fn();\n  }catch(e)\
    \ {\n    console.log(e.message); // error\n  }\n}\n\nawait outer();\n// no exception\
    \ here\n```\n\n# Not checking the return value\n\nWhen a Promise is resolved it\
    \ does not necessarily mean that everything is alright. For example, the `fetch`\
