- img_proc: true
  md: "So far we've discussed how to write Promise-producing async functions and how\
    \ to wait for a Promise to have a value. But how to create Promises in cases where\
    \ there are no existing Promises to build on?\n\nTo know this, we need to discuss\
    \ how asynchronicity works in Javascript and how to construct Promises from callbacks.\n\
    \n# Callbacks\n\nAsync results come in the form of callbacks. These are like the\
    \ parameter of the `then()` function in Promises but are called when a particular\
    \ event happens. For example, the simplest callback is the `setTimeout` call that\
    \ waits a given number of milliseconds then invokes the argument function:\n\n\
    ```\nsetTimeout(() => {\n  // 1s later\n}, 1000);\n```\n\nThis pattern of using\
    \ callbacks is everywhere in Javascript.\n\nThe gapi, the library to use Google\
    \ services, [needs a callback](https://www.google.com) when it loads a client\
    \ library:\n\n```\ngapi.load(\"client:auth2\", () => {\n  // auth2 client loaded\n\
    });\n```\n\nSimilarly, event listeners, such as a click handler, calls a function\
    \ when the event happened:\n\n```\nconst button = document.querySelector(\"#button\"\
    );\n\nbutton.addEventListener(\"click\", () => {\n  // button is clicked\n}, {once:\
    \ true})\n```\n\nThe problem with callbacks is that we are back to square one\
    \ as instead of having a flat structure we have nesting again."
  merge: -1
  pgno: 13
- img_proc: true
  md: "Fortunately, there is a simple way to convert callbacks to Promises and then\
    \ use them with `await`.\n\n> Event listeners and Promises\n\nEagle-eyed readers\
    \ might have spotted the `{once: true}` part in the last example. Event listeners\
    \ are inherently different than async functions as they represent *multiple events*\
    \ instead of a single result value. Because of this, you can not replace them\
    \ with Promises.\n\nThe exception is when there is exactly one event, as in the\
    \ above example. In a sense, it works similarly to the timeout or the gapi load\
    \ function, as the callback is invoked when the event happens.\n\n# The Promise\
    \ constructor\n\nAsync functions return Promises but you can only use `await`\
    \ to wait for other Promises and not for callbacks. To make a Promise, you need\
    \ to use its constructor:\n\n```\nnew Promise((res) => {\n  // call res when the\
    \ Promise is ready\n});\n```\n\nCalling the `res` callback signals the Promise\
    \ that the result is ready. This is the same as when an async function returns.\n\
    \nTo convert the `setTimeout` to a Promise, wrap it in the constructor and use\
    \ `res` as the callback:"
  merge: -1
  pgno: 14
- img_proc: true
  md: "```\nawait new Promise((res) => {\n  setTimeout(res, 1000);\n});\n// 1s later\n\
    \n// same as\nawait new Promise((res) => {\n  setTimeout(() => {\n    res();\n\
    \  }, 1000);\n});\n```\n\nNow that it is a Promise, `await` works just like for\
    \ other async functions.\n\nSimilarly, the two other examples are also easy to\
    \ promisify:\n\n```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\"\
    , res);\n});\n// auth2 client loaded\n```\n\n```\nconst button = document.querySelector(\"\
    #button\");\n\nawait new Promise((res) => {\n  button.addEventListener(\"click\"\
    , res, {once: true});\n});\n// button is clicked\n```\n\nWith Promises instead\
    \ of callbacks it's easy to use `await` and make a sequence of async operations.\
    \ To load the auth2 client when the button is clicked:\n\n```\nawait new Promise((res)\
    \ => {\n  button.addEventListener(\"click\", res, {once: true});\n});\n// the\
    \ button is clicked\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\"\
    , res);\n});\n// the gapi library is loaded\n```"
  merge: -1
  pgno: 15
- img_proc: true
  md: '> Converting between callbacks and Promises


    You''ll learn more about this in the [Convert between Promises and callbacks](Convert
    between Promises and callbacks) chapter.


    # Promise states


    As a Promise holds a future value it can be in several states.


    When you create a Promise, it starts in the **Pending** state. It is before the
    resolve/reject callback is called or the async function finished.


    When there is a value, the Promise transitions into the **Resolved** state. It
    is when the `await` in unblocked and the async function continues to run.


    If there is an error, the Promise goes into the **Rejected** state. It is when
    the `await` throws an exception.


    The Resolved and the Rejected states are collectively called **Fulfilled** (or
    **Settled**). When a Promise is in this state it''s already finished and produced
    a value or an error.


    ![](img/bf8ff49d078976cf7c9fa8008bbb9b22_16_0.png)'
  merge: -1
