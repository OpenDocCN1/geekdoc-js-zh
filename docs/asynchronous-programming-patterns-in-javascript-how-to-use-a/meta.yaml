    Mapping in groups


    To make groups, the example below uses the `groupBy` implementation from [Underscore.js](https://underscorejs.org/).
    Many libraries provide an implementation and they are mostly interchangeable.
    The exception is Lodash, as its [groupBy does not pass the index of the item](https://github.com/lodash/lodash/issues/1302).


    If you are not familiar with `groupBy`, it runs each element through an iteratee
    function and returns an object with the keys as the results and the values as
    lists of the elements that produced that value.


    To make groups of at most `n` elements, an iteratee `Math.floor(i / n)` where
    `i` is the *index* of the element will do. As an example, a group of size 3 will
    map the elements like this:


    ```

    0 => 0

    1 => 0

    2 => 0

    3 => 1

    4 => 1

    5 => 1

    6 => 2

    ...

    ```


    In Javascript:'
  - "[PAGE 98]\n\n```\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconsole.log(\n\
    \  _.groupBy(arr, (_v, i) => Math.floor(i / 3))\n);\n// {\n//    0: [30, 10, 20],\n\
    //    1: [20, 15, 20],\n//    2: [10]\n// }\n```\n\nThe last group might be smaller\
    \ than the others, but all groups are guaranteed not to exceed the maximum group\
    \ size.\n\nTo map one group, the usual `Promise.all(group.map(...))` construct\
    \ is fine.\n\nTo map the groups sequentially, we need a reduce that concatenates\
    \ the previous results (`memo`) with the results of the current group:\n\n```\n\
    return Object.values(groups)\n  .reduce(async (memo, group) => [\n    ...(await\
    \ memo),\n    ...(await Promise.all(group.map(iteratee)))\n  ], []);\n```\n\n\
    This implementation is based on the fact that the `await memo`, which waits for\
    \ the previous result, will be completed before moving on to the next line.\n\n\
    The full implementation that implements batching:"
