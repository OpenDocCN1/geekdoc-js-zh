    \ but the naming:"
- md: "```javascript\nconst getPaginatedResults = async (fn) => {\n  const EMPTY =\
    \ Symbol(\"empty\");\n  const res = [];\n  for await (const lf of (async function*()\
    \ {\n    let NextMarker = EMPTY;\n    while (NextMarker || NextMarker === EMPTY)\
    \ {\n      const {marker, results} = await fn(\n        NextMarker !== EMPTY ?\
    \ NextMarker : undefined\n      );\n\n      yield* results;\n      NextMarker\
    \ = marker;\n    }\n  })()) {\n    res.push(lf);\n  }\n\n  return res;\n};\n```\n\
    \nIt follows the same structure as before, but it gets an `fn` parameter that\
    \ does the actual API call and returns the list and the marker.\n\nTo get all\
    \ the Lambda functions with this wrapper:\n\n```javascript\nconst lambdas = await\
    \ getPaginatedResults(async (NextMarker) => {\n  const functions = await lambda.listFunctions(\n\
    \    {Marker: NextMarker}\n  ).promise();\n  return {\n    marker: functions.NextMarker,\n\
    \    results: functions.Functions,\n  };\n});\n```\n\nAdapted to the log groups:\n\
    \n```javascript\nconst logGroups = \n  await getPaginatedResults(async (NextMarker)\
    \ => {\n    const logGroups = await logs.describeLogGroups(\n      {nextToken:\
    \ NextMarker}\n    ).promise();\n    return {\n      marker: logGroups.nextToken,\n\
    \      results: logGroups.logGroups,\n    };\n  });\n```\n\n# Using async functions\
    \ with postMessage\n\nThe `postMessage` call allows an asynchronous communication\
    \ channel between different browsing contexts, such as with IFrames and web workers,\
    \ where direct function calls don't work. It works by sending a message to the\
    \ other side, then the receiving end can listen to `message` events.\n\nFor example,\
    \ the page can communicate with an IFrame via `postMessage` and send events to\
    \ each others' windows. The `iframe.contentWindow.postMessage()` call sends a\
    \ message to the IFrame, while the `window.parent.postMessage()` sends a message\
    \ back to the main page. The two ends can listen to messages from the other using\
    \ `window.addEventListener(\"message\", (event) => {...})`.\n\n```javascript\n\
    // index.html\nconst iframe = document.querySelector(\"iframe\");\n\nwindow.addEventListener(\"\
    message\", ({data}) => {\n  // 3: receive response\n  console.log(\"Message from\
    \ iframe: \" + data);\n});\n\n// 1: send request\niframe.contentWindow.postMessage([5,\
    \ 2]);\n\n// iframe.html\nwindow.addEventListener(\"message\", ({data}) => {\n\
    \  // 2: send response\n  window.parent.postMessage(event.data[0] + event.data[1]);\n\
    });\n```\n\n![page-IFrame communication](img/bf8ff49d078976cf7c9fa8008bbb9b22_78_0.png)\n\
    \nFor web workers, each worker has a separate message handler. The page can send\
    \ a message to a specific worker using the `worker.postMessage()` call and listen\
    \ for events from that worker using `worker.addEventListener(\"message\", (event)\
    \ => {...})`. On the other side, the worker sends and receives events using the\
    \ global functions `postMessage()` and `addEventListener()`:\n\n```javascript\n\
    // index.html\nconst worker = new Worker(\"worker.js\");\nworker.addEventListener(\"\
    message\", ({data}) => {\n  console.log(\"Message from worker: \" + data); //\
    \ 3\n});\n\nworker.postMessage([5, 5]); // 1\n\n// worker.js\naddEventListener(\"\
    message\", (event) => {\n  postMessage(event.data[0] + event.data[1]); // 2\n\
    }, false)\n```\n\n# Request-response communication\n\nBoth communicating with\
    \ an IFrame and with a worker has problems. First, sending the request and handling\
    \ the response is separated. **The receiving side uses a global (or a per-worker)\
    \ event listener**, which is shared between the calls.\n\nThis is good for \"\
    notification-style\" messages where one end wants to notify the other that something\
    \ happened but not expecting a response. But **notification-style messaging is\
    \ rare**. What is usually needed is a \"request-response-style\" messaging.\n\n\
    For example, one end uses an access token that the other one can refresh. The\
    \ communication consists of a request to refresh and a response to that with the\
    \ refreshed token. Or even when a user clicks on a button and the other side needs\
    \ to handle this. This example seems like a \"notification-style\" message, but\
    \ when the button needs to be disabled while the operation takes place (such as\
    \ a save button) or there is a possibility of an error that the sender needs to\
    \ know about, it's now a request-response.\n\nThe global (or per-worker) message\
    \ handler is not suited for pairing responses to requests. The ideal solution\
    \ would be to hide all these complications behind an async function call and use\
    \ `await` to wait for the result:\n\n```javascript\nconst result = await add(10,\
    \ 5);\n```\n\nLet's see how to make such a function!\n\n# Response identification\n\
    \nThe first task is to know which request triggered a given response. The problem\
    \ with using the global event handler is that it's all too easy to rely on only\
    \ one communication happening at a time. When you test your webapp, you test one\
    \ thing at a time but users won't be that considerate. You can't assume only one\
    \ request-response will happen at any one time.\n\n![Non-multiplexed channel](img/bf8ff49d078976cf7c9fa8008bbb9b22_80_0.png)\n\
    \nOne solution is to use *request identifiers* to pair the responses to the requests.\n\
    \n![Request ids](img/bf8ff49d078976cf7c9fa8008bbb9b22_80_1.png)\n\nThis works,\
    \ and even though it requires some coding, this is a good solution.\n\n# **MessageChannel**\n\
    \nFortunately, there is a better solution built into the language. MessageChannel\
    \ allows a dedicated communication channel attached to the `postMessage` call.\
    \ The sending end can listen for messages *on that channel* which is separated\
    \ from all other calls, and the receiving end can send its responses through the\
    \ *MessagePort* it got.\n\nA MessageChannel creates two MessagePorts, one for\
    \ each end of the communication. Each port supports both the `onmessage` and the\
    \ `postMessage`, similar to the basic cross-context communication channels.\n\n\
    ```javascript\n// index.html\nconst worker = new Worker(\"worker.js\");\n// create\
    \ a channel\nconst channel = new MessageChannel();\n\n// listen on one end\nchannel.port1.onmessage\
    \ = ({data}) => {\n  console.log(\"Message from channel: \" + data); // 3\n};\n\
    \n// send the other end\nworker.postMessage([15, 2], [channel.port2]); // 1\n\n\
    // worker.js\naddEventListener(\"message\", (event) => {\n  // respond on the\
    \ received port\n  event.ports[0].postMessage(event.data[0] + event.data[1]);\
    \ // 2\n}, false)\n```\n\nTo attach a message handler to a port, use `port.onmessage\
    \ = (event) => {...}`. If you use `addEventListener` then you need to start the\
    \ channel too:\n\n```javascript\nport.addEventListener(\"message\", (event) =>\
    \ {...});\nport.start();\n```\n\nTo attach a port to the `postMessage` call, use\
    \ the second argument: `postMessage(data, [channel.port2])`. To use this port\
    \ on the other end, use `event.ports[0].postMessage()`.\n\nBy creating a new MessageChannel\
    \ for each request, pairing the response is solved as whatever comes through that\
    \ channel is the response to this particular request.\n\n# Error handling\n\n\
    An often overlooked aspect of request-response communication is error handling.\
    \ When the receiving end has a problem and throws an Error, it should be propagated\
    \ to the sender so that it can handle it appropriately.\n\nThe problem with postMessage\
    \ is that it can only send one type of message, there is no postError call. How\
    \ to signal an error then?\n\n```javascript\n(err, result) => {\n\tif (err) {\n\
    \t\t// error\n\t} else {\n\t\t// result\n\t}\n}\n```\n\nA possible solution is\
    \ similar to how Node-style callbacks propagate errors using only a single function.\
    \ These callbacks use an error and a result value together, and only one of them\
    \ is defined:\n\nTo implement the same with messages, use an object with error\
    \ and result properties. When the former is non-null that indicates that an error\
    \ happened.\n\n```javascript\n// worker.js\ntry{\n\tevent.ports[0].postMessage(\n\
    \t{result: event.data[0] + event.data[1]}\n);\n}catch(e) {\n\tevent.ports[0].postMessage({error:\
    \ e});\n}\n\n// index.html\nchannel.port1.onmessage = ({data}) => {\n\tif (data.error)\
    \ {\n\t\t// error\n\t}else {\n\t\t// data.result\n\t};\n};\n```\n\nDon't forget\
    \ to wrap the receiving end in a try-catch to propagate runtime errors.\n\n# Using\
    \ Promises\n\nWith a separated response channel and error propagation, it's easy\
    \ to wrap the call in a Promise constructor."
