- img_proc: true
  md: "```\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconsole.log(\n  _.groupBy(arr,\
    \ (_v, i) => Math.floor(i / 3))\n);\n// {\n//    0: [30, 10, 20],\n//    1: [20,\
    \ 15, 20],\n//    2: [10]\n// }\n```\n\nThe last group might be smaller than the\
    \ others, but all groups are guaranteed not to exceed the maximum group size.\n\
    \nTo map one group, the usual `Promise.all(group.map(...))` construct is fine.\n\
    \nTo map the groups sequentially, we need a reduce that concatenates the previous\
    \ results (`memo`) with the results of the current group:\n\n```\nreturn Object.values(groups)\n\
    \  .reduce(async (memo, group) => [\n    ...(await memo),\n    ...(await Promise.all(group.map(iteratee)))\n\
    \  ], []);\n```\n\nThis implementation is based on the fact that the `await memo`,\
    \ which waits for the previous result, will be completed before moving on to the\
    \ next line.\n\nThe full implementation that implements batching:"
  merge: -1
