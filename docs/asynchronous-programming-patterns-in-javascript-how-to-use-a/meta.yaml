    })\n\nwindow.addEventListener(\"message\", () => {\n    fn();\n});\n```\n\n在这种情况下，函数调用自身必须进行协调。\n\
    \n## 通用解决方案\n\n解决方案是维护一个 Promise 队列，将它们一个接一个地链接起来。只需要几行代码，它就是通用的，允许任何函数被序列化：\n\
    \n```javascript\nconst serialize = (fn) => {\n  let queue = Promise.resolve();\n\
    \  return (...args) => {\n    const res = queue.then(() => fn(...args));\n   \
    \ queue = res.catch(() => {});\n    return res;\n  };\n};\n```\n\n`Promise.resolve()`\
    \ 是队列的起点。每一次其他调用都会被追加到这个 Promise 上。\n\n`queue.then(() => fn(...args))` 将函数调用添加到队列，并将其结果保存在\
    \ `res` 中。当*当前调用以及所有之前的调用都已完成*时，它才会被解析。\n\n`queue = res.catch(() => {})` 这部分确保当队列中的某一部分被拒绝时，队列不会卡在拒绝状态。\n\
    \n用这个序列化器包装缓存函数，可以确保即使有多个调用，也只运行一次刷新：\n\n```javascript\nconst fn = serialize((()\
    \ => {\n  const cacheTime = 2000;\n  let lastRefreshed = undefined;\n  let lastResult\
    \ = undefined;\n  return async () => {\n    const currentTime = new Date().getTime();\n\
    \    // 检查缓存是否足够新鲜\n    if (lastResult === undefined ||\n        lastRefreshed\
    \ + cacheTime < currentTime) {\n      // 刷新值\n      lastResult = await refresh();\n\
    \      lastRefreshed = currentTime;\n    }\n    return lastResult;\n  }\n})());\n\
    \nfn();\nfn();\n// refreshing\n```\n"
