    \n## A general-purpose solution\n\nThe solution is to keep a queue of Promises\
    \ that chains them one after the other. It is just a few lines of code and it\
    \ is general purpose, allowing any function be serialized:\n\n```\nconst serialize\
    \ = (fn) => {\n  let queue = Promise.resolve();\n  return (...args) => {\n   \
    \ const res = queue.then(() => fn(...args));\n    queue = res.catch(() => {});\n\
    \    return res;\n  };\n};\n```\n\nThe `Promise.resolve()` is the start of the\
