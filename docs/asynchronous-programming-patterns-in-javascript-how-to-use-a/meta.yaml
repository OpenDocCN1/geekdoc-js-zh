    \ `map` 操作，也可以使用相同的并发控制策略来管理这一点\n\n### 带有 reduce 的异步 filter\n不使用带同步 `filter` 的异步\
    \ **map**，而是也可以通过异步 `reduce` 来完成同样的工作。因为只涉及一个函数，结构甚至更简单，尽管它提供的控制级别不相同\n\n首先从空数组（**[]**)开始。**然后**(next)运行下一个元素通过谓词函数并判断是否满足条件：**若通过则将其追加到数组中；若不通过将跳过**。：\n\
