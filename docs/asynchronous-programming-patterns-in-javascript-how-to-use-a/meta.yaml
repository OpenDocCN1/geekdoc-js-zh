    \ rej) => timer = setTimeout(rej, time))\n  ]).finally(() => clearTimeout(timer));\n\
    }\n```\n\n上述实现将 `setTimeout` 的结果保存为 `timer`，并在竞速结束时清除它。\n\n## 错误对象\n\n竞速结束并且有一个拒绝发生。这是由于超时还是\
