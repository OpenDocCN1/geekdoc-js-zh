  md: "# ## Promisified functions\n\nThe above examples show how to call a callback-based\
    \ function and get back a Promise, but it requires wrapping every call with the\
    \ Promise boilerplate. It would be better to have a function that mimics the original\
    \ one but without the callback. Such a function would get the same arguments minus\
    \ the callback and return the Promise.\n\nTo make promisified versions of functions,\
    \ it is only a matter of wrapping the Promise constructor in a function that gets\
    \ the arguments before the callback:\n\n```\n// setTimeout\nconst promisifiedSetTimeout\
    \ = (ms) =>\n  new Promise((res) => setTimeout(res, ms));\n\n// FileReader\nconst\
    \ promisifiedFileReader = (blob) =>\n  new Promise((res, rej) => {\n    const\
    \ reader = new FileReader();\n    reader.onload = (event) => {\n      res(event.target.result);\n\
    \    }\n    reader.onerror = (error) => {\n      rej(error)\n    };\n    reader.readAsDataURL(blob);\n\
    \  });\n\n// checkAdmin\nconst promisifiedCheckAdmin = (id) => new Promise((res)\
    \ => {\n  if (/* admin logic */) {\n    res(true);\n  }else {\n    res(false);\n\
    \  }\n};\n```\n\nThese functions are direct replacements to the callback-based\
    \ originals and can be directly used in an async/await workflow:"
