    # **Concurrency**


    The above implementation runs the iteratee function in parallel for each element
    of the array. This is usually fine, but in some cases, it might consume too many
    resources. This can happen when the async function hits an API or consumes too
    much RAM that it''s not feasible to run too many at once.


    While an async `map` is easy to write, adding concurrency controls is more involved.
    In the next few examples, we''ll look into different solutions.


    # **Batch processing**


    The easiest way is to group elements and process the groups one by one. This gives
    you control of the maximum amount of parallel tasks that can run at once. But
    since one group has to finish before the next one starts, the *slowest* element
    in each group becomes the limiting factor.'
  merge: -1
  pgno: 96
