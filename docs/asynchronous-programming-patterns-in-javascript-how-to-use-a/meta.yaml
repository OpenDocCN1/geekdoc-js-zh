    \ 可以轻松实现支持任何 Promise 的超时机制。除了异步任务外，**再启动一个在达到超时时间后会拒绝的 Promise**。哪个先完成（原始 Promise\
    \ 或超时 Promise），哪个的结果就成为最终结果。\n\n```javascript\nconst timeout = (prom, time) =>\n\
    \  Promise.race([\n    prom,\n    new Promise((_r, rej) => setTimeout(rej, time))\n\
    \  ]);\n```\n\n利用这个辅助函数包装任何 Promise，如果它在指定时间内没有产生结果，就会被拒绝。\n\n```javascript\n\
    // 在 500 ms 内完成\nconst fn = async () => {\n  await new Promise((res) => setTimeout(res,\
    \ 500));\n  return \"p2\";\n}\n\n// 在超时前完成\nconst result = await timeout(fn(),\
