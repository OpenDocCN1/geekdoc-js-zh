    # It looks complicated, but there are simple rules:


    +   * Each function, no matter which track it is, can move the execution to the
    OK as well as the error tracks

    * When a handler is missing (the diamonds in the above diagram) the execution
    stays on the same track


    For example, if `getPromise()` is rejected, the next function will be `catch1`.
    If it resolves, then `handler3` is the next one. If it resolves, `handler4` is
    called, and it will be the result of the whole chain, no matter if it resolves
    or rejects.'
- md: "## Error handlers\n\nNotice this line:\n\n```javascript\n.then(handler2, catch1)\n\
    ```\n\nA common source of errors is that if there is an error in `handler2` then\
    \ `catch1` **won't run**. Each error handler handles errors from *previous steps*.\n\
    \n## Parallel and sequential processing\n\nWhen you use `await` in an async function,\
    \ it stops the execution until the Promise is resolved. This makes each line wait\
    \ for the previous, which yields a code that looks almost like a synchronous one:\n\
    \n```javascript\nawait s3.copyObject({...}).promise();\nawait s3.deleteObject({...}).promise();\n\
    ```\n\nThe above code copies an object, then it deletes one. In case you wanted\
    \ to *move* the object, it is the desirable chain of events as you want the copy\
    \ operation to finish before deleting the original.\n\n### Parallel processing\
    \ with Promise.all\n\nBut what if there is an unrelated call, such as an update\
    \ to a database?\n\n```javascript\nawait s3.copyObject({...}).promise();\nawait\
    \ s3.deleteObject({...}).promise();\nawait dynamodb.updateItem({...}).promise();\n\
    ```\n\nWhile the `dynamodb.updateItem` has nothing to do with the S3 object, it\
    \ still waits for the move operation (copy + delete) to finish. This makes the\
    \ overall process longer than necessary.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_27_0.png)\n\
    \nSerial execution\n\nIn this case, a better implementation is to run the two\
    \ parts in parallel. To make it easier to see, let's group the two operations\
    \ with async functions:\n\n```javascript\nconst moveObject = async () => {\n \
    \ await s3.copyObject({/* ... */}).promise();\n  await s3.deleteObject({/* ...\
    \ */}).promise();\n};\n\nconst updateDatabase = async () => {\n  await dynamodb.updateItem({/*\
    \ ... */}).promise();\n};\n```\n\nJavascript has a built-in convenience method\
    \ to run things in parallel. This is the `Promise.all`, that gets a *collection\
    \ of Promises* and returns a Promise with all the results. Whenever you want to\
    \ run multiple things concurrently, this is the tool to use.\n\nTo use it to run\
    \ the two operations in parallel, use:\n\n```javascript\nawait Promise.all([moveObject(),\
    \ updateDatabase()]);\n```\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_28_0.png)\n\
    \nThere are multiple things to notice here. First, `Promise.all` gets *Promises*.\
    \ Remember that *calling* an async function returns a Promise, so don't forget\
    \ to call the functions you want to run.\n\nSecond, it needs a *collection of\
    \ Promises*, which is usually an array. Notice the `([ ... ])` structure for the\
    \ call to `Promise.all`.\n\nAnd third, `await` is only used for the `Promise.all`\
    \ and not for the individual async function calls. This is because you want to\
    \ wait for *all of them* to finish before moving on.\n\n> **Tip**\n>\n> `await`\
    \ stops the async function execution. In the case of `Promise.all` you want to\
    \ stop only once, to wait for all the input Promises to settle. That's why you\
    \ only need one `await`.\n\n### Results\n\nIn the above example none of the operations\
    \ returned a value. Let's see how to handle values returned from `Promise.all`!\n\
    \nFor the sake of illustration, let's say there are two unrelated piece of data\
    \ an async function needs: a user object and a list of groups. Both of these are\
    \ stored in a database and thus they are available via async functions.\n\n```javascript\n\
    const getUser = async () => {\n  // gets the user object\n  return user;\n}\n\
    const getGroups = async () => {\n  // gets the groups\n  return groups;\n}\n```\n\
    \nNotice in this example that the `getGroups` function does not need the user\
    \ object. This makes them able to run in parallel.\n\nA serial implementation\
    \ calls these functions separately and stores their results in variables:\n\n\
    ```javascript\nconst user = await getUser();\nconst groups = await getGroups();\n\
    \n// user and groups are available\n```\n\nThere are two `await`s here, so the\
    \ function will stop twice. No matter which you put first, the total execution\
    \ time will be the sum of the calls. As we've seen previously, the `Promise.all`\
    \ runs the Promises returned by the async function in parallel. It also returns\
    \ a Promise with an *array* of the results.\n\nTo run the two calls in parallel\
    \ and extract the results, use the array destructuring operator:\n\n```javascript\n\
    const [user, groups] = await Promise.all([\n  getUser(),\n  getGroups(),\n]);\n\
    \n// user and groups are available\n```\n\n### Errors in Promise.all\n\nWhen *any*\
    \ of the input Promises are rejected then the resulting Promise will be rejected\
    \ as well. This behavior allows errors to propagate seamlessly.\n\n```javascript\n\
    try {\n  const [user, groups] = await Promise.all([\n    getUser(), // getUser\
    \ returns a value\n    getGroups(), // getGroups throws an exception\n  ]);\n\
    } catch(e) {\n  // handle error thrown by either of calls\n}\n```\n\nEven when\
    \ async functions are independent in a sense that one does not use the result\
    \ of the other, you might not want to run them in parallel in some cases. In the\
    \ example above with the `moveObject` and `updateDatabase` async functions, you\
    \ might not want to run the latter if the former is failed.\n\n```javascript\n\
    await Promise.all([moveObject(), updateDatabase()]);\n```\n\nWhen this code is\
    \ run, it can produce the following results:\n\n| Object is moved | Database is\
    \ updated |\n| :---: | :---: |\n| ✓ | ✓ |\n| ✓ | - |\n| - | ✓ |\n| - | - |\n\n\
    By using serial execution, you can make sure that the later operations won't run\
    \ unless the earlier ones are finished:\n\n```javascript\nawait moveObject();\n\
    await updateDatabase();\n```\n\nWhen this code is run, the database is guaranteed\
    \ to be unchanged if the move object failed:\n\n| Object is moved | Database is\
    \ updated |\n| --- | --- |\n| ✓ | ✓ |\n| ✓ | - |\n| - | - |\n\n### Early init\n\
    \nWhen you create a Promise, it starts executing. But the async function only\
    \ stops when it encounters an `await`. This allows a structure that starts the\
    \ async processing early but only stops for it when the result is needed.\n\n\
    For example, consider this code, which waits for the function to finish before\
    \ moving on:\n\n```javascript\nconst wait = (ms) => new Promise((res) => setTimeout(res,\
    \ ms));\n\nconst fn = async () => {\n  console.log(\"starting\");\n  await wait(100);\n\
    \  console.log(\"end\");\n}\n\nawait fn();\nconsole.log(\"after\");\n\n// starting\n\
    // end\n// after\n```\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_32_0.png)\n\n\
    *Eager await*\n\nBut when the `await` is later, the order of execution changes:\n\
    \n```javascript\nconst fnProm = fn();\nconsole.log(\"after\");\nawait fnProm;\n\
    \n// starting\n// after\n// end\n```\n\nThis allows an easy way to run things\
    \ \"in the background\" while also getting the results when they are needed.\n\
    \n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_33_0.png)\n\nFor example, a web server\
    \ might do several things when a request arrives, one of them to fetch the user\
    \ session from a cookie and a session store.\n\n```javascript\nconst http = require(\"\
    http\");\n\nconst getUserSession = async (req) => {\n  // extract the session\
    \ cookie\n  // fetch the session from Redis\n  // return the user object\n};\n\
    \nconst server = http.createServer(async (req, res) => {\n  // validate request\n\
    \  // fetch configuration\n  const session = await getUserSession(req);\n  //\
    \ handle request\n});\n\nserver.listen(8080);\n```\n\nIn the above example, everything\
    \ happens sequentially. The server processes the request and then fetches the\
    \ user session.\n\nTo start getting the user session right after the request comes,\
    \ you can separate calling the async function and the `await`:\n\n```javascript\n\
    const server = http.createServer(async (req, res) => {\n  const sessionProm =\
    \ getUserSession(req);\n  // validate request\n  // fetch configuration\n  const\
    \ session = await sessionProm;\n  // handle request\n});\n```\n\nIn this case,\
    \ the session is still available when it's needed, but the process starts sooner.\
    \ This reduces the total time the user experiences.\n\nThere is catch though.\
    \ As we've discussed in the [Error handling](#) chapter, if the async function\
    \ throws an error it will be propagated through the `await`. This means if the\
    \ execution reaches no `await`s for that Promise, the error won't be handled.\n\
    \nThis is a problem.\n\nConsider this code:\n\n```javascript\nconst wait = (ms)\
    \ => new Promise((res) => setTimeout(res, ms));\n\nconst fn = async () => {\n\
    \  await wait(100);\n  throw new Error(\"Something bad happened\");\n}\n\ntry{\n\
    \  const p = fn();\n  throw new Error(\"There was an error\");\n  await p;\n}catch(e)\
    \ {\n  console.log(e.message);\n}\n```\n\nThis prints:"
  mdcn: "\n## 错误处理\n\n请注意这一行：\n\n```javascript\n.then(handler2, catch1)\n```\n\n常见的错误来源是：如果\
    \ `handler2` 中出现错误，那么 `catch1` **不会执行**。每个错误处理器只处理来自*之前步骤*的错误。\n\n## 并行与顺序处理\n\
    \n当你在异步函数中使用 `await` 时，它会暂停执行，直到 Promise 被解决。这使得每一行代码都等待前一行执行完毕，从而产生几乎与同步代码无异的执行流：\n\
    \n```javascript\nawait s3.copyObject({...}).promise();\nawait s3.deleteObject({...}).promise();\n\
    ```\n\n上面的代码先复制一个对象，然后删除一个对象。如果你想*移动*对象，这就是理想的执行顺序，因为你需要在删除原始对象之前完成复制操作。\n\n###\
    \ 使用 Promise.all 进行并行处理\n\n但如果存在一个不相关的调用，例如更新数据库呢？\n\n```javascript\nawait s3.copyObject({...}).promise();\n\
    await s3.deleteObject({...}).promise();\nawait dynamodb.updateItem({...}).promise();\n\
    ```\n\n虽然 `dynamodb.updateItem` 与 S3 对象无关，但它仍然要等待移动操作（复制 + 删除）完成。这使得整个流程比必要的更长。\n\
    \n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_27_0.png)\n\n顺序执行\n\n在这种情况下，更好的实现是让这两部分并行运行。为了更清晰地展示，让我们用异步函数将这两个操作分组：\n\
    \n```javascript\nconst moveObject = async () => {\n  await s3.copyObject({/* ...\
    \ */}).promise();\n  await s3.deleteObject({/* ... */}).promise();\n};\n\nconst\
    \ updateDatabase = async () => {\n  await dynamodb.updateItem({/* ... */}).promise();\n\
    };\n```\n\nJavascript 内置了一个方便的方法来并行运行任务。这就是 `Promise.all`，它接收一个 *Promise 集合*，并返回一个包含所有结果的\
    \ Promise。当你想并发运行多个任务时，这就是你需要使用的工具。\n\n要使用它来并行运行这两个操作，请使用：\n\n```javascript\n\
    await Promise.all([moveObject(), updateDatabase()]);\n```\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_28_0.png)\n\
    \n这里有几个需要注意的地方。首先，`Promise.all` 接收的是 *Promise*。记住，*调用*一个异步函数会返回一个 Promise，所以不要忘记调用你想要运行的函数。\n\
    \n其次，它需要一个 *Promise 集合*，通常是一个数组。注意调用 `Promise.all` 时的 `([ ... ])` 结构。\n\n第三，`await`\
    \ 仅用于 `Promise.all`，而不是用于各个异步函数调用。这是因为你想等待*所有*任务完成后再继续。\n\n> **提示**\n>\n> `await`\
    \ 会暂停异步函数的执行。对于 `Promise.all`，你只想暂停一次，以等待所有输入的 Promise 都尘埃落定。这就是为什么你只需要一个 `await`。\n\
    \n### 结果处理\n\n在上面的例子中，没有一个操作返回了值。让我们看看如何处理 `Promise.all` 返回的值！\n\n为了说明，假设一个异步函数需要两件不相关的数据：一个用户对象和一个组列表。这两者都存储在数据库中，因此可以通过异步函数获取。\n\
    \n```javascript\nconst getUser = async () => {\n  // 获取用户对象\n  return user;\n\
    }\nconst getGroups = async () => {\n  // 获取组列表\n  return groups;\n}\n```\n\n注意在这个例子中，`getGroups`\
