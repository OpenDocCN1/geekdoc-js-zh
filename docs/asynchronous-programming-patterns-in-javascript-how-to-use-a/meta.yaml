    };\n\nconst {user, group} = await getValues();\n// user, group\n```\n\n## 在Promise和回调之间转换\n\
    \n虽然Promise和async/await正日益成为在Javascript中编写异步代码的主要方式，但回调仍在许多地方使用。一些采用该风格的库迁移得慢，难以转向更现代的替代方案，浏览器（和Node）API的变更也很缓慢。\n\
