  md: '# function.length


    The `length` of a function is how many arguments it needs. Don''t confuse this
    with the Array''s `length`, as that is how many *elements* in the array.


    For example, this function needs 2 arguments, so its `length` is 2:


    ```

    const fn = (a, cb) => {};


    console.log(fn.length); // 2

    ```


    It is rarely used, but some libraries depend on it having the correct value, such
    as [memoizee](https://github.com/medikoo/memoizee), which determines how to cache
    the function call or [marked](https://marked.js.org/), a Markdown compiler, to
    decide whether its configuration is [called async or sync](https://marked.js.org/using_pro#async).


    While the length of the function is rarely used, it can cause problems. `util.promisify`
    does not change it, so the resulting function will have the same length as the
    original one, even though it needs fewer arguments.


    ```

    console.log(fn.length); // 2


    const promisified = util.promisify(fn);


    console.log(promisified.length); // 2

    ```


    # Convert Promises to callbacks


    The other direction is to have a Promise-returning function (usually an `async`
    function) and you need to convert it to a callback-based one. It is much rarer
    than the other way around, but there are cases when it''s needed, usually when
    a library expects an asynchronous function and it supports only callbacks.


    For example, the marked library supports a `highlight` option that gets the code
    block and returns a formatted version. The highlighter gets the code, the language,
    and a callback argument, and it is expected to call the last one with the result.'
