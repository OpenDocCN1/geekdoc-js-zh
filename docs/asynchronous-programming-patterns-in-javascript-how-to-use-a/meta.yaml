    };\n```\n\n此外，异步性可以实现为一个发出事件的对象：\n\n```javascript\nconst reader = new FileReader();\n\
    reader.onload = (event) => {\n  // event.target.result\n}\nreader.onerror = (error)\
    \ => {\n  // 处理错误\n};\nreader.readAsDataURL(blob);\n```\n\n### Node风格回调\n\n由于有多种同样合理的方式来实现回调，一开始很混乱。一个事实标准出现了，现在称为Node风格或错误优先回调。它在Javascript中几乎无处不在，只要需要回调。\n\
    \nNode风格回调有三个特点：\n\n- 回调函数是最后一个参数\n- 它首先被错误对象调用，然后是结果 (`(error, result)`)\n- 它只返回一个结果\n\
    \n作为说明，此函数实现了一个Node风格回调：\n\n```javascript\nconst getUser = (id, cb) => {\n  const\
    \ user = /* 获取用户 */;\n  if (user) {\n    // 成功\n    cb(null, user);\n  }else {\n\
    \    // 错误\n    cb(new Error(\"获取用户失败\"));\n  }\n};\n```\n\n注意当没有错误时，第一个参数是`null`。这允许调用者轻松检查执行是失败还是成功：\n\
    \n```javascript\ngetUser(15, (error, result) => {\n  if (error) {\n    // 处理错误\n\
    \  } else {\n    // 处理结果\n  }\n});\n```\n\n由于回调结构几乎是唯一的，这使得在Promise和回调之间转换变得更加容易。\n\
    \n### 将回调转换为Promise\n\n这是一个更突出的方向，因为将基于回调的函数集成到async/await流程中是一个常见任务。让我们看看怎么做！\n\
    \n#### Promise构造函数\n\nPromise构造函数是将回调转换为Promise的低级但通用的方法。它适用于每种回调风格，只需要几行代码。\n\
    \nPromise构造函数获取一个带有两个参数的函数：一个`resolve`和一个`reject`函数。当其中一个被调用时，Promise将敲定，可以是传递给`resolve`函数的结果，或者是传递给`reject`的错误。\n\
    \n```javascript\nnew Promise((res, rej) => {\n\n  // 使用一个值解决\n  // res(value)\n\
    \n  // 使用错误拒绝：\n  // rej(error)\n})\n```\n\n这使得调用基于回调的函数并将其转换为Promise变得容易，然后可以`await`它：\n\
    \n```javascript\n// Node风格\nnew Promise((res, rej) => getUser(15, (err, result)\
    \ => {\n  if (err) {\n    rej(err);\n  }else {\n    res(result);\n  }\n}))\n\n\
    // setTimeout\nnew Promise((res) => setTimeout(res, 100));\n\n// 基于事件\nnew Promise((res,\
    \ rej) => {\n  const reader = new FileReader();\n  reader.onload = (event) =>\
    \ {\n    // 解决Promise\n    res(event.target.result);\n  }\n  reader.onerror =\
    \ (error) => {\n    // 拒绝Promise\n    rej(error)\n  };\n  reader.readAsDataURL(blob);\n\
    });\n```\n\n#### Promisified函数\n\n上面的示例展示了如何调用基于回调的函数并获取回Promise，但它需要将每个调用都用Promise样板代码包装起来。更好的办法是有一个函数模拟原始函数但没有回调。这样的函数将获取与回调之前相同的参数，并返回Promise。\n\
    \n要创建函数的promisified版本，只需将Promise构造函数包装在一个获取回调之前参数的函数中：\n\n```javascript\n// setTimeout\n\
    const promisifiedSetTimeout = (ms) =>\n  new Promise((res) => setTimeout(res,\
    \ ms));\n\n// FileReader\nconst promisifiedFileReader = (blob) =>\n  new Promise((res,\
    \ rej) => {\n    const reader = new FileReader();\n    reader.onload = (event)\
    \ => {\n      res(event.target.result);\n    }\n    reader.onerror = (error) =>\
    \ {\n      rej(error)\n    };\n    reader.readAsDataURL(blob);\n  });\n\n// checkAdmin\n\
    const promisifiedCheckAdmin = (id) => new Promise((res) => {\n  if (/* admin逻辑\
    \ */) {\n    res(true);\n  }else {\n    res(false);\n  }\n};\n```\n\n这些函数是基于回调的原始函数的直接替代品，可以直接在async/await工作流中使用：\n"
