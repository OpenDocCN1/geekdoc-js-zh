  - "[PAGE 117]\n\n```\nconst arr = [1, 2, 3];\n\nconst asyncEvery = async (arr, predicate)\
    \ => {\n  for (let e of arr) {\n    if (!await predicate(e)) return false;\n \
    \ }\n  return true;\n};\nconst res = await asyncEvery(arr, async (i) => {\n  console.log(`Checking\
    \ $${i}`);\n  await sleep(10);\n  return i < 2;\n});\n\n// Checking 1\n// Checking\
    \ 2\n\nconsole.log(res);\n// false\n```\n\nWhenever there is a false value returned\
    \ by predicate(e), the function is ended without checking the other elements.\n\
    \n# # Parallel processing\n\nThe short-circuiting implementation processes the\
    \ elements sequentially, which is efficient in terms of resource usage, but it\
    \ might result in longer execution.\n\nFor example, if the iteratee sends requests\
    \ via a network, it might take some time to send them one at a time. On the other\
    \ hand, while it might result in more requests sent, sending all of them at the\
    \ same time would be faster."
  - "[PAGE 118]\n\n# # Common errors\n\n# ## Not propagating errors\n\nWhen you convert\
    \ a callback to a Promise, make sure that you also handle the error case. Without\
    \ that, the Promise is never resolved and an `await` waits forever.\n\nFor example,\
    \ the `gapi.load` provides separate callbacks for results and errors:\n\n```\n\
    await new Promise((res, rej) => {\n  gapi.load(\"client:auth2\", {callback: res,\
    \ onerror: rej});\n});\n```\n\nIf you don't attach the `rej` callback to the `onerror`\
    \ handler, errors won't propagate through the chain. This leads to hard-to-debug\
    \ problems and components that \"just stops\".\n\n# ## Missing await in try..catch\n\
    \nWhen you use `try..catch` or `try..finally` in an async function, make sure\
    \ that you use `await` too. For example, this code works fine when the inner Promise\
    \ resolves:\n\n```\nconst fn = async () => {\n  return \"result\";\n}\n\nconst\
    \ outer = async () => {\n  try {\n    return fn(); // <= missing await!\n  }catch(e)\
    \ {\n    console.log(e.message);\n  }\n}\n\nawait outer(); // result\n```"
  - "[PAGE 119]\n\nBut the `try..catch` won't handle exceptions:\n\n```\nconst fn\
    \ = async () => {\n  throw new Error(\"error\");\n}\n\nconst outer = async ()\
    \ => {\n  try {\n    return fn(); // <= missing await!\n  }catch(e) {\n    console.log(e.message);\n\
    \  }\n}\n\nawait outer();\n// exception is thrown!\n```\n\nThis is because exceptions\
    \ are thrown from the `await` and while returning a Promise from an async function\
    \ flattens the result, it will be returned without waiting for it. And without\
    \ waiting, an exception is not thrown for the `try..catch` but when the caller\
    \ uses `await`.\n\n```\nconst fn = async () => {\n  throw new Error(\"error\"\
    );\n}\n\nconst outer = async () => {\n  try {\n    return await fn();\n  }catch(e)\
    \ {\n    console.log(e.message); // error\n  }\n}\n\nawait outer();\n// no exception\
    \ here\n```\n\n# Not checking the return value\n\nWhen a Promise is resolved it\
    \ does not necessarily mean that everything is alright. For example, the `fetch`\
    \ rejects when there is a problem *with the connection* but it resolves even if\
    \ the response status returns an error.\n\nWhen the call can not establish a connection,\
    \ the Promise rejects:"
  - "[PAGE 120]\n\n```\ntry {\n  await fetch(\"http://example.com\");\n}catch(e) {\n\
    \  console.log(e.message); // Failed to fetch\n}\n```\n\nBut when the response\
    \ status code indicates an error (500), the Promise still resolves:\n\n```\ntry\
    \ {\n  await fetch(\"https://httpbin.org/status/500\");\n\n  // no error\n}catch(e)\
    \ {\n  console.log(e.message);\n}\n```\n\nBecause of this, you need to check the\
    \ result for error responses. The `fetch` result provides the `ok` field to do\
    \ this:\n\n```\nconst response = await fetch(\"https://httpbin.org/status/500\"\
    );\n\nif (!response.ok) {\n  throw new Error(\"Error response\");\n}\n```\n\n\
    # Not closing resources in case of a rejection\n\nIt's common to open some resource,\
    \ then close it after it's not needed. For example, this code creates a temporary\
    \ directory then deletes it later:\n\n```\nconst fs = require(\"fs\").promises;\n\
    const os = require(\"os\");\nconst path = require(\"path\");\n\nconst dir = await\
    \ fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n);\n\n// use dir to\
    \ store temporary things\n\nawait fs.rmdir(dir, {recursive: true});\n```"
  - "[PAGE 121]\n\nThis works unless there is an exception that jumps over the cleanup\
    \ code.\n\n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\n\nthrow Error(\"error\");\n\nawait fs.rmdir(dir, {recursive:\
    \ true});\n// the cleanup won't run!\n```\n\nUse `try..finally` to implement reliable\
    \ cleanup:\n\n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\ntry {\n  // use dir to store temporary things\n}finally {\n\
    \  await fs.rmdir(dir, {recursive: true});\n}\n```\n\nEven better, you can move\
    \ the resource lifecycle to a dedicated function, as discussed in the The async\
    \ disposer pattern chapter:\n\n```\nconst withTempDir = async (fn) => {\n  const\
    \ dir = await fs.mkdtemp(\n    await fs.realpath(os.tmpdir()) + path.sep\n  );\n\
    \  try {\n    return await fn(dir);\n  }finally {\n    fs.rmdir(dir, {recursive:\
    \ true});\n  }\n};\n\nawait withTempDir((dir) => {\n  // use dir to store temporary\
    \ things\n})\n```\n\n# Using both the rejection and resolve handlers in one then\
    \ function\n\nA common source of problems is to write error handling like this:"
  - "[PAGE 122]\n\n```\ngetPromise()\n  .then(process, handleError);\n```\n\nAs we've\
    \ discussed in the [Error propagation in Promise chains](https://example.com)\
    \ chapter, the second handler of the `then()` is called for errors but only from\
    \ the previous steps.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_122_0.png)\n\
    \nNotice that the `handleError` function only gets errors from the `getPromise`.\
    \ If the result of the `process` function is rejected, it won't be handled.\n\n\
    A better solution is to use `.catch` to be explicit about errors:\n\n```\ngetPromise()\n\
    \  .then(process)\n  .catch(handleError);\n```\n\nThis way it's clear that both\
    \ steps are covered by the error handlers.\n\n# Not waiting for an async forEach\n\
    \nThe `forEach` function iterates over a collection and calls an iteratee function.\
    \ A typical problem is not waiting for the iteration to complete:"
  - "[PAGE 123]\n\n```\n[1, 2, 3].forEach(async (e) => {\n\tconsole.log(e);\n\treturn\
    \ makePromise(e);\n});\nconsole.log(\"finished\");\n// finished\n// 1\n// 2\n\
    // 3\n```\n\nIt is a best practice to wait until the whole collection is processed,\
    \ which can be achived with a `Promise.all` and a `map` :\n\n```\nawait Promise.all([1,\
    \ 2, 3].map(async (e) => {\n\tconsole.log(e);\n\treturn makePromsie(e);\n}));\n\
    console.log(\"finished\");\n// finished\n```\n\n> More info\n\nThis topic is covered\
    \ in more detail in the `Async functions with forEach` chapter."
  - "[PAGE 124]\n\n# Glossary\n\n**Async function**\n\nA function that returns a Promise.\
    \ The `await` keyword is only usable in an async function.\n\n```\nconst wait\
    \ = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst fn = async ()\
    \ => {\n  await wait(100);\n  return \"result\";\n}\n\nfn(); // Promise\n```\n\
    \n**Async generator function**\n\nA generator function that can use `await`. When\
    \ it encounters a `yield` or a `yield*` the execution stops until a subsequent\
    \ element is requested.\n\n```\nconst wait = (ms) => new Promise((res) => setTimeout(res,\
    \ ms));\n\nconst gen = async function*() {\n  console.log(\"start\");\n  await\
    \ wait(100);\n  yield 1;\n  await wait(100);\n  console.log(\"next\");\n  yield\
    \ 2;\n  await wait(100);\n  console.log(\"end\");\n};\n\nconst it = gen();\nconsole.log(await\
    \ it.next());\nconsole.log(await it.next());\nconsole.log(await it.next());\n\n\
    // start\n// { value: 1, done: false }\n// next\n// { value: 2, done: false }\n\
    // end\n// { value: undefined, done: true }\n```"
  - "[PAGE 125]\n\nSee [Generator function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function*).\n\
    \n# await keyword\n\nUsable in async functions, it stops the execution until the\
    \ argument Promise becomes fulfilled. It then returns the value or throws an exception.\
    \ See [Async function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function).\n\
    \n# Callback\n\nA function passed as an argument that is called with the return\
    \ value. It allows asynchronous results, as the callback can be invoked later.\n\
    \nFor example, the `setTimeout` function needs a callback that it calls when the\
    \ time is up:\n\n```\nsetTimeout(() => {\n  // 1 second later\n}, 1000);\n```\n\
    \nSee [Continuation-passing style](https://en.wikipedia.org/wiki/Continuation-passing_style).\n\
    \n# Collection processing\n\nA series of functions that work on a collection of\
    \ elements (usually, an array), such as transforming (`map`), filtering (`filter`),\
    \ and reducing to a value (`reduce`).\n\n# Continuation-passing style\n\nA programming\
    \ construct that uses callback functions (continuations) for function results\
    \ instead of returning them directly. This allows asynchronous results as these\
    \ callbacks can be invoked later."
- md: "## Error propagation\n\nWhen there is an error, it moves up in context until\
    \ there is a piece of code that can handle it.\n\nFor example, an unhandled exception\
    \ gets thrown to the caller:\n\n```\nconst fn = () => {\n  // the error is thrown\
    \ here\n  throw new Error(\"error\");\n}\n\ntry {\n  fn();\n} catch(e) {\n  //\
    \ and handled here\n}\n```\n\nWith Promises, errors propagate to the next handlers:\n\
    \n```\ngetUser() // returns a Promise\n  .then(() => {\n    // the error is thrown\
    \ here\n    throw new Error(\"error\");\n  })\n  .catch((e) => {\n    // and handled\
    \ here\n  });\n```\n\n## Error-first callbacks\n\nA callback style where the first\
    \ argument is an error object. The receiving end needs to check if this value\
    \ is non-null (or non-undefined).\n\n```\nconst fn = (callback) => {\n  try {\n\
    \    const result = \"result\";\n    // error is null\n    callback(null, result);\n\
    \  } catch(e) {\n    // signal error\n    callback(e);\n  }\n}\n\nfn((err, result)\
    \ => {\n  if (err) {\n    // handle error\n  } else {\n    // handle result\n\
    \  }\n});\n```\n\nSee [Node-style callbacks](https://nodejs.org/en/knowledge/getting-started/control-flow/what-are-callbacks/).\n\
    \n## Fulfilled Promise\n\nA state of a Promise that is either resolved or rejected.\
    \ See [Promise states](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise#description).\n\
    \n## Generator function\n\nA function that returns an iterable structure. It can\
    \ be frozen with a `yield` statement and only resumes if more elements are requested.\n\
    \n```\nconst gen = function*() {\n  console.log(\"start\");\n  yield 1;\n  console.log(\"\
    next\");\n  yield 2;\n  console.log(\"end\");\n}\n\nconst it = gen();\nconsole.log(it.next());\n\
    console.log(it.next());\nconsole.log(it.next());\n\n// start\n// { value: 1, done:\
    \ false }\n// next\n// { value: 2, done: false }\n// end\n// { value: undefined,\
    \ done: true }\n```\n\n## Node-style callbacks\n\nA callback style where:\n\n\
    - The callback function is the last argument\n- It is called with an error object\
    \ first, then a result (`(error, result)`)\n- It returns only one result\n\n```\n\
    const getUser = (id, cb) => {\n  const user = /* get user */;\n  if (user) {\n\
    \    // success\n    cb(null, user);\n  } else {\n    // error\n    cb(new Error(\"\
    Failed to get user\"));\n  }\n};\n```\n\n## Pagination\n\nWhen a method (usually\
    \ an API) does not return all results for a request and it requires multiple calls\
    \ to get all items.\n\n## Pending Promise\n\nA Promise state where the asynchronous\
    \ result is not yet available. See [Promise states](link).\n\n## postMessage\n\
    \nAn API to communicate cross-context, such as with IFrames and Web Workers. It\
    \ is an event-based communication where one end listens for `message` events and\
    \ the other uses the `postMessage` function to send messages.\n\n## Promise\n\n\
    A value that holds an asynchronous result. You can use the `then` callback to\
    \ handle when the Promise becomes fulfilled, or use `await` in an async function.\n\
    \n## Promise chain\n\nA series of `then()` callbacks, each getting the previous\
    \ state of the Promise and returns the next one.\n\n```\ngetUser() // returns\
    \ a Promise\n  .then(async function getPermissionsForUser(user) {\n    const permissions\
    \ = await // ...;\n    return permissions;\n  })\n  .then(async function checkPermission(permissions)\
    \ {\n    const allowed = await // ...;\n    return allowed;\n  })\n  .then((allowed)\
    \ => {\n    // handle allowed or not\n  });\n```\n\n## Promise states\n\nA Promise\
    \ can be in one of multiple states:\n\n- Pending: The value is not yet available\n\
    - Resolved: The value is available\n- Rejected: There was an error\n\nWhen the\
    \ Promise is either resolved or rejected then it's fulfilled or settled.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_129_0.png)\n\
    \n## Promise.all\n\nA utility function that gets multiple Promises and resolves\
    \ when all of them are resolved and returns an array with the results. It rejects\
    \ if any of the input Promises rejects.\n\n```\nconsole.log(\n  await Promise.all([\n\
    \    Promise.resolve(\"a\"),\n    Promise.resolve(\"b\"),\n  ])\n);\n\n// [\"\
    a\", \"b\"]\n```\n\n## Promise.allSettled\n\nA utility function that gets multiple\
    \ Promises and resolves when all of them are settled. It resolves even if some\
    \ input Promises reject.\n\n```\nconsole.log(\n  await Promise.allSettled([\n\
    \    Promise.resolve(\"a\"),\n    Promise.reject(\"b\"),\n  ])\n);\n\n// [\n//\
    \   { status: 'fulfilled', value: 'a' },\n//   { status: 'rejected', reason: 'b'\
    \ }\n// ]\n```\n\n## Promise.catch\n\nA utility function that attaches a rejection\
    \ handler to a Promise. It's equivalent to `then(undefined, handler)`.\n\n```\n\
    Promise.reject(new Error(\"error\"))\n  .catch((e) => {\n    console.log(e.message);\
    \ // error\n  });\n```\n\n## Promise.finally\n\nA utility function that is called\
    \ when the Promise settles, either if it's resolved or rejected. It brings the\
    \ `try..finally` construct to Promises.\n\n```\ngetUser() // returns a Promise\n\
    \  .finally(() => {\n    // called both even if the Promise is rejected\n    console.log(\"\
    finished\");\n  });\n  // does not change the result value\n```\n\n## Promise.race\n\
    \nA utility function that gets multiple Promises and resolves (or rejects) when\
    \ the first one settles.\n\n```\nconst wait = (ms) => new Promise((res) => setTimeout(res,\
    \ ms));\n\nconst fn = async (ms, result) => {\n  await wait(ms);\n  return result;\n\
    }\n\nconsole.log(\n  await Promise.race([\n    fn(100, \"a\"),\n    fn(50, \"\
    b\"),\n  ])\n);\n```\n\n## Promise.reject\n\nA utility function that rejects with\
    \ the value provided.\n\n```\nPromise.reject(new Error(\"error\"))\n  .catch((v)\
    \ => {\n    console.log(v.message); // error\n  });\n```\n\n## Promise.resolve\n\
    \nA utility function that returns a Promise that is resolved with the value provided.\
    \ Useful to start a Promise chain.\n\n```\nPromise.resolve(\"value\")\n  .then((v)\
    \ => {\n    console.log(v); // value\n  });\n```\n\n## Promise.then\n\nA function\
    \ of a Promise object that attaches a function that will be called when the Promise\
    \ is settled. See [Promise chain](https://example.com).\n\n## Promisification\n\
    \nThe process of converting callbacks to Promises.\n\n## Rejected Promise\n\n\
    A Promise state that indicates an error. See [Promise states](https://example.com).\n\
    \n## Resolved Promise\n\nA Promise state where the asynchronous value is available.\
    \ See [Promise states](https://example.com).\n\n## Settled Promise\n\nAn alternative\
    \ name for the fulfilled state. See [Promise states](https://example.com).\n\n\
    ## Synchronous function\n\nA function that returns a value when it's run. See\
    \ [Continuation-passing style](https://example.com).\n\n## About the author\n\n\
    Tamás Sallai\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_133_0.png)\n\nHey, I'm\
    \ Tamás! I'm a software developer specializing in web technologies and cloud computing.\
    \ I'm especially interested in exploring edge cases and \"what ifs\" in order\
    \ to write dependable software.\n\nI co-author the [https://advancedweb.hu](https://advancedweb.hu)\
    \ blog where I've published more than 200 articles in various technology topics.\
    \ You can always find what I'm currently working on there.\n\nCopyright © 2021\
    \ by Tamás Sallai\n\nAll rights reserved. No part of this book may be reproduced\
    \ or used in any manner without written permission of the copyright owner except\
    \ for the use of quotations in a book review.\n\nThe information is provided \"\
    as-is\", without warranty of any kind, express or implied. In no event shall the\
    \ authors or copyright holders be liable for any claim, damages or other liability."
  mdcn: "\n## 错误传播\n\n当出现错误时，它会沿着上下文向上传递，直到有一段代码能够处理它。\n\n例如，一个未处理的异常会被抛给调用者：\n\n\
    ```\nconst fn = () => {\n  // 错误在这里抛出\n  throw new Error(\"error\");\n}\n\ntry\
    \ {\n  fn();\n} catch(e) {\n  // 并在这里处理\n}\n```\n\n使用 Promise 时，错误会传播到下一个处理程序：\n\
    \n```\ngetUser() // 返回一个 Promise\n  .then(() => {\n    // 错误在这里抛出\n    throw new\
    \ Error(\"error\");\n  })\n  .catch((e) => {\n    // 并在这里处理\n  });\n```\n\n##\
    \ Error-first 回调\n\n一种回调风格，其中第一个参数是错误对象。接收端需要检查该值是否为非 null（或非 undefined）。\n\n\
    ```\nconst fn = (callback) => {\n  try {\n    const result = \"result\";\n   \
    \ // 错误为 null\n    callback(null, result);\n  } catch(e) {\n    // 发出错误信号\n  \
    \  callback(e);\n  }\n}\n\nfn((err, result) => {\n  if (err) {\n    // 处理错误\n\
    \  } else {\n    // 处理结果\n  }\n});\n```\n\n参见 [Node 风格回调](https://nodejs.org/en/knowledge/getting-started/control-flow/what-are-callbacks/)。\n\
    \n## Fulfilled Promise（已兑现 Promise）\n\nPromise 的一种状态，表示已解决或已拒绝。参见 [Promise 状态](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise#description)。\n\
    \n## 生成器函数\n\n一种返回可迭代结构的函数。它可以通过 `yield` 语句暂停，并且只有在请求更多元素时才会恢复。\n\n```\nconst\
    \ gen = function*() {\n  console.log(\"start\");\n  yield 1;\n  console.log(\"\
    next\");\n  yield 2;\n  console.log(\"end\");\n}\n\nconst it = gen();\nconsole.log(it.next());\n\
    console.log(it.next());\nconsole.log(it.next());\n\n// start\n// { value: 1, done:\
    \ false }\n// next\n// { value: 2, done: false }\n// end\n// { value: undefined,\
    \ done: true }\n```\n\n## Node 风格回调\n\n一种回调风格，其特点如下：\n\n- 回调函数是最后一个参数\n- 调用时第一个参数是错误对象，然后是结果（`(error,\
    \ result)`）\n- 只返回一个结果\n\n```\nconst getUser = (id, cb) => {\n  const user = /*\
    \ get user */;\n  if (user) {\n    // 成功\n    cb(null, user);\n  } else {\n  \
    \  // 错误\n    cb(new Error(\"Failed to get user\"));\n  }\n};\n```\n\n## 分页\n\n\
    当某个方法（通常是 API）不返回请求的所有结果，而需要多次调用才能获取所有项时。\n\n## Pending Promise（待定 Promise）\n\n\
    Promise 的一种状态，表示异步结果尚未可用。参见 [Promise 状态](link)。\n\n## postMessage\n\n一种跨上下文通信的\
    \ API，例如与 IFrame 和 Web Worker 通信。它是基于事件的通信方式，一端监听 `message` 事件，另一端使用 `postMessage`\
    \ 函数发送消息。\n\n## Promise\n\n一个持有异步结果的值。你可以使用 `then` 回调来处理 Promise 变为 fulfilled\
    \ 时的情况，或者在 async 函数中使用 `await`。\n\n## Promise 链\n\n一系列 `then()` 回调，每个回调接收 Promise\
    \ 的先前状态并返回下一个状态。\n\n```\ngetUser() // 返回一个 Promise\n  .then(async function getPermissionsForUser(user)\
    \ {\n    const permissions = await // ...;\n    return permissions;\n  })\n  .then(async\
    \ function checkPermission(permissions) {\n    const allowed = await // ...;\n\
    \    return allowed;\n  })\n  .then((allowed) => {\n    // 处理允许或不允许\n  });\n```\n\
    \n## Promise 状态\n\nPromise 可以处于以下多种状态之一：\n\n- Pending（待定）：值尚不可用\n- Resolved（已解决）：值可用\n\
    - Rejected（已拒绝）：发生了错误\n\n当 Promise 处于已解决或已拒绝状态时，它就是 fulfilled（已兑现）或 settled（已落定）。\n\
    \n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_129_0.png)\n\n## Promise.all\n\n一个工具函数，接收多个\
    \ Promise，当所有 Promise 都解决时解决，并返回包含结果的数组。如果任何输入的 Promise 拒绝，它会拒绝。\n\n```\nconsole.log(\n\
    \  await Promise.all([\n    Promise.resolve(\"a\"),\n    Promise.resolve(\"b\"\
    ),\n  ])\n);\n\n// [\"a\", \"b\"]\n```\n\n## Promise.allSettled\n\n一个工具函数，接收多个\
    \ Promise，当所有 Promise 都落定时解决。即使某些输入的 Promise 拒绝，它也会解决。\n\n```\nconsole.log(\n\
    \  await Promise.allSettled([\n    Promise.resolve(\"a\"),\n    Promise.reject(\"\
    b\"),\n  ])\n);\n\n// [\n//   { status: 'fulfilled', value: 'a' },\n//   { status:\
    \ 'rejected', reason: 'b' }\n// ]\n```\n\n## Promise.catch\n\n一个工具函数，用于向 Promise\
    \ 附加拒绝处理程序。它等价于 `then(undefined, handler)`。\n\n```\nPromise.reject(new Error(\"\
    error\"))\n  .catch((e) => {\n    console.log(e.message); // error\n  });\n```\n\
    \n## Promise.finally\n\n一个工具函数，当 Promise 落定时调用，无论它是已解决还是已拒绝。它将 `try..finally`\
    \ 结构引入到 Promise 中。\n\n```\ngetUser() // 返回一个 Promise\n  .finally(() => {\n   \
    \ // 即使 Promise 被拒绝也会调用\n    console.log(\"finished\");\n  });\n  // 不会改变结果值\n\
    ```\n\n## Promise.race\n\n一个工具函数，接收多个 Promise，当第一个 Promise 落定时解决（或拒绝）。\n\n```\n\
    const wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst fn =\
    \ async (ms, result) => {\n  await wait(ms);\n  return result;\n}\n\nconsole.log(\n\
    \  await Promise.race([\n    fn(100, \"a\"),\n    fn(50, \"b\"),\n  ])\n);\n```\n\
    \n## Promise.reject\n\n一个工具函数，用提供的值拒绝。\n\n```\nPromise.reject(new Error(\"error\"\
    ))\n  .catch((v) => {\n    console.log(v.message); // error\n  });\n```\n\n##\
    \ Promise.resolve\n\n一个工具函数，返回一个用提供的值解决的 Promise。可用于启动 Promise 链。\n\n```\nPromise.resolve(\"\
    value\")\n  .then((v) => {\n    console.log(v); // value\n  });\n```\n\n## Promise.then\n\
    \nPromise 对象的一个函数，用于附加当 Promise 落定时将被调用的函数。参见 [Promise 链](https://example.com)。\n\
    \n## Promise 化\n\n将回调转换为 Promise 的过程。\n\n## Rejected Promise（已拒绝 Promise）\n\n\
    指示错误的 Promise 状态。参见 [Promise 状态](https://example.com)。\n\n## Resolved Promise（已解决\
    \ Promise）\n\n异步值可用的 Promise 状态。参见 [Promise 状态](https://example.com)。\n\n## Settled\
    \ Promise（已落定 Promise）\n\nfulfilled 状态的另一种名称。参见 [Promise 状态](https://example.com)。\n\
    \n## 同步函数\n\n运行时返回值的函数。参见 [Continuation-passing style](https://example.com)。\n\
    \n## 关于作者\n\nTamás Sallai\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_133_0.png)\n\
    \n嘿，我是 Tamás！我是一名专注于 Web 技术和云计算的软件开发人员。我尤其对探索边缘情况和\"如果\"感兴趣，以便编写可靠的软件。\n\n我共同撰写\
    \ [https://advancedweb.hu](https://advancedweb.hu) 博客，在那里我发表了超过 200 篇关于各种技术主题的文章。你可以在那里找到我目前正在做的事情。\n\
    \n版权所有 © 2021 Tamás Sallai\n\n保留所有权利。未经版权所有者书面许可，本书的任何部分不得以任何方式复制或使用，但书评中的引用除外。\n\
    \n信息按\"原样\"提供，不提供任何明示或暗示的担保。在任何情况下，作者或版权持有者均不对任何索赔、损害或其他责任负责。\n"
