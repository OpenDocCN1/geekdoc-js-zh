    group\";\n  return {user, group};\n};\n\nconst {user, group} = await getValues();\n\
    // user, group\n```\n\n## Convert between Promises and callbacks\n\nWhile Promises\
    \ and async/await are increasingly the primary way to write asynchronous code\
    \ in Javascript, callbacks are still used in many places. Several libraries that\
    \ adopted that style are slow to migrate to the more modern alternative, and browser\
    \ (and Node) APIs are also slow to change.\n\nFor example, [marked](https://github.com/markedjs/marked),\
    \ a markdown compiler needs a callback when it's used in asynchronous mode:\n\n\
    ```javascript\nmarked(text, options, (err, result) => {\n  // result is the compiled\
