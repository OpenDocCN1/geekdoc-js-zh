  md: "# Async generator functions\n\nA generator function that can use `await` .\
    \ When it encounters a `yield` or a `yield*` the execution stops until a subsequent\
    \ element is requested.\n\n```\nconst wait = (ms) =>\n  new Promise((res) => setTimeout(res,\
    \ ms));\n\nconst gen = async function*() {\n  console.log(\"start\");\n  await\
    \ wait(100);\n  yield 1;\n  await wait(100);\n  console.log(\"next\");\n  yield\
    \ 2;\n  await wait(100);\n  console.log(\"end\");\n};\n\nconst it = gen();\nconsole.log(await\
    \ it.next());\nconsole.log(await it.next());\nconsole.log(await it.next());\n\n\
    // start\n// { value: 1, done: false }\n// next\n// { value: 2, done: false }\n\
    // end\n// { value: undefined, done: true }\n```\n\n# Breaking it down\n\nThe\
    \ most important thing is to keep track of the `NextMarker` returned by the last\
    \ call and use that for making the next one. For the first call, `Marker` should\
    \ be `undefined` , and to differentiate between the first and the last one (the\
    \ one that returns no `NextMarker` ), a Symbol is a safe option as it cannot be\
    \ returned by the API."
  merge: -1
  pgno: 74
- img_proc: true
  md: "```\nconst EMPTY = Symbol(\"empty\");\nlet NextMarker = EMPTY;\nwhile (NextMarker\
    \ || NextMarker === EMPTY) {\n    // Marker: NextMarker !== EMPTY ? NextMarker\
    \ : undefined\n\n    NextMarker = functions.NextMarker;\n}\n```\n\nAfter the call,\
    \ we need to `yield` the functions returned:\n\n```\nyield* functions.Functions;\n\
    ```\n\nThe `yield*` makes sure that each element is returned as a separate value\
    \ by the generator.\n\nFinally, a `for await..of` loop collects the results and\
    \ returns them as an Array:\n\n```\nconst res = [];\nfor await (const lf of (async\
    \ function*() {\n    ...\n})()) {\n    res.push(lf);\n}\nreturn res;\n```\n\n\
    To use it, just call the function and wait for the resulting Promise to resolve:\n\
    \n```\nconst functions = await getAllLambdas();\n```\n\n# Making it generic\n\n\
    The same `Marker` / `NextMarker` pattern appears throughout the AWS SDK. But unfortunately,\
    \ the naming is different for different services. For example, getting the CloudWatch\
    \ Logs log groups you need to provide a `nextToken` parameter. This makes it impossible\
    \ to support all the listing functions with a generic wrapper.\n\nLuckily, as\
    \ the pattern is the same, we can make a wrapper function that handles everything\
    \ but the naming:"
