    \n```\nconst timeout = (prom, time) =>\n  Promise.race([\n    prom,\n    new Promise((_r,\
    \ rej) => setTimeout(rej, time))\n  ]);\n```\n\nWith this helper function, wrap\
    \ any Promise and it will reject if it does not produce a result in the specified\
    \ time.\n\n```\n// resolves in 500 ms\nconst fn = async () => {\n  await new Promise((res)\
    \ => setTimeout(res, 500));\n  return \"p2\";\n}\n\n// finishes before the timeout\n\
    const result = await timeout(fn(), 1000);\n// result = p2\n\n// timeouts in 100\
