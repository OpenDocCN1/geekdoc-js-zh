    );\n\nif (!response.ok) {\n  throw new Error(\"Error response\");\n}\n```\n\n\
    ### 在拒绝的情况下未关闭资源\n\n常见做法是打开一些资源，然后在不需要时关闭它。例如，这段代码创建一个临时目录，稍后删除它：\n\n```\nconst\
