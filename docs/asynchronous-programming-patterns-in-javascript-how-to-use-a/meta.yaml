- md: "## Controlling the timing\n\n### Waiting for finish\n\nThe `forEach` function\
    \ is similar to the `map`, but instead of transforming the values and using the\
    \ results, it runs the function for each element and discards the result. Effectively,\
    \ the important part is the *side effects* of calling the function.\n\nFor example,\
    \ printing each element to the console, synchronously:\n\n```javascript\nconst\
    \ arr = [1, 2, 3];\n\narr.forEach((i) => {\n  console.log(i);\n});\n\n// 1\n//\
    \ 2\n// 3\n\nconsole.log(\"Finished sync\");\n// Finished sync\n```\n\nAs the\
    \ result is not important, using an async function as the iteratee would work:\n\
    \n```javascript\nconst arr = [1, 2, 3];\n\narr.forEach(async (i) => {\n  // each\
    \ element takes a different amount of time to complete\n  await sleep(10 - i);\n\
    \  console.log(i);\n});\n\nconsole.log(\"Finished async\");\n// Finished async\n\
    \n// 3\n// 2\n// 1\n```\n\nBut, not unsurprisingly, the function is called **asynchronously**,\
    \ and the program execution goes past the call. This is an important difference\
    \ from the sync version, as, by the time the next line is executed, the synchronous\
    \ `forEach` is already done, while the async version is not. That's why the \"\
    Finished async\" log appears *before* the elements.\n\nTo wait for all the function\
    \ calls to finish before moving on, use a `map` with a `Promise.all` and discard\
    \ the results:\n\n```javascript\nconst arr = [1, 2, 3];\n\nawait Promise.all(arr.map(async\
    \ (i) => {\n  await sleep(10 - i);\n  console.log(i);\n}));\n\n// 3\n// 2\n//\
    \ 1\n\nconsole.log(\"Finished async\");\n// Finished async\n```\n\nAsync forEach,\
    \ waiting for the results\n\nWith this change, the \"Finished async\" comes last.\n\
    \n## Sequential processing\n\nBut notice that the iteratee functions are called\
    \ in parallel. To faithfully follow the synchronous `forEach`, use a `reduce`\
    \ with an `await memo` first:\n\n```javascript\nconst arr = [1, 2, 3];\n\nawait\
    \ arr.reduce(async (memo, i) => {\n  await memo;\n  await sleep(10 - i);\n  console.log(i);\n\
    }, undefined);\n\n// 1\n// 2\n// 3\n\nconsole.log(\"Finished async\");\n// Finished\
    \ async\n```\n\nThis way the elements are processed in-order, one after the other,\
    \ and the program execution waits for the whole array to finish before moving\
    \ on.\n\n## Async functions with filter\n\nThe `filter` function keeps only the\
    \ elements that pass a condition. It gets a function, this time it's called a\
    \ *predicate*, and this function returns true/false (truthy and falsy, to be more\
    \ precise) values. The resulting collection only contains the elements where the\
    \ predicate returned true.\n\n```javascript\nconst arr = [1, 2, 3, 4, 5];\n\n\
    const syncRes = arr.filter((i) => {\n  return i % 2 === 0;\n});\n\nconsole.log(syncRes);\n\
    // 2,4\n```\n\n### Async filter with map\n\nThe async version is a bit more complicated\
    \ this time and it works in two phases. The first one maps the array through the\
    \ predicate function asynchronously, producing true/false values. Then the second\
    \ step is a synchronous filter that uses the results from the first step.\n\n\
    Async filter\n\n```javascript\nconst arr = [1, 2, 3, 4, 5];\n\nconst asyncFilter\
    \ = async (arr, predicate) => {\n  const results = await Promise.all(arr.map(predicate));\n\
    \n  return arr.filter((_v, index) => results[index]);\n}\n\nconst asyncRes = await\
    \ asyncFilter(arr, async (i) => {\n  await sleep(10);\n  return i % 2 === 0;\n\
    });\n\nconsole.log(asyncRes);\n// 2,4\n```\n\nOr a one-liner implementation:\n\
    \n```javascript\nconst asyncFilter = async (arr, predicate) =>\n  Promise.all(arr.map(predicate))\n\
    \    .then((results) => arr.filter((_v, index) => results[index]));\n```\n\n###\
    \ Concurrency\n\nThe above implementation runs all of the predicate functions\
    \ concurrently. This is usually fine, but, as with all other functions, it might\
    \ strain some resources too hard. Fortunately, since the above implementation\
    \ relies on `map`, the same concurrency controls can be used.\n\n### Async filter\
    \ with reduce\n\nInstead of using an async `map` with a sync `filter`, an async\
    \ `reduce` could also do the job. Since it's just one function, the structure\
    \ is even easier though it does not provide the same level of control.\n\nFirst,\
    \ start with an empty array (`[]`). Then run the next element through the predicate\
    \ function and if it passes, append it to the array. If not, skip it.\n\n*Async\
    \ filter with reduce*\n\n```javascript\n// concurrently\nconst asyncFilter = async\
    \ (arr, predicate) =>\n  arr.reduce(async (memo, e) =>\n    await predicate(e)\
    \ ? [...await memo, e] : memo\n  , []);\n```\n\nNotice that the `await predicate(e)`\
    \ comes *before* the `await memo`, which means those will be called in parallel.\n\
    \n### Sequential processing\n\nTo wait for a predicate function to finish before\
    \ calling the next one, change the order of the `await`s:\n\n```javascript\n//\
    \ sequentially\nconst asyncFilter = async (arr, predicate) =>\n  arr.reduce(async\
    \ (memo, e) =>\n    [...await memo, ...await predicate(e) ? [e] : []]\n  , []);\n\
    ```\n\nThis implementation waits for the previous element then conditionally append\
    \ an element depending on the result of the predicate (`...[e]` or `...[]`).\n\
    \n*Async filter with reduce running sequentially*\n\n## Async functions with some/every\n\
    \nThese functions get an iteratee function, just like the `filter`, but they return\
    \ a single true/false, depending on whether the predicate returned a specific\
    \ value. In the case of the `some`, if *any* of the predicates returned true,\
    \ the result will be true. For the `every` function, if any returned false, the\
    \ result will be false.\n\n```javascript\nconst arr = [1, 2, 3];\n\nconst someRes\
    \ = arr.some((i) => {\n  return i % 2 === 0;\n});\n\nconsole.log(someRes);\n//\
    \ true\n\nconst everyRes = arr.every((i) => {\n  return i < 2;\n});\n\nconsole.log(everyRes);\n\
    // false\n```\n\n### Using an async filter\n\nConsidering only the result, these\
    \ functions can be emulated with an async `filter`, which is already covered in\
    \ a previous article how to convert to async.\n\n```javascript\n// sync\nconst\
    \ some = (arr, predicate) =>\n  arr.filter(predicate).length > 0;\nconst every\
    \ = (arr, predicate) =>\n  arr.filter(predicate).length === arr.length;\n\n//\
    \ async\nconst asyncSome = async (arr, predicate) =>\n  (await asyncFilter(arr,\
    \ predicate)).length > 0;\nconst asyncEvery = async (arr, predicate) =>\n  (await\
    \ asyncFilter(arr, predicate)).length === arr.length;\n```\n\nFilter-based async\
    \ some\n\nBut there is an important difference between the built-in `some`/`every`\
    \ functions and the filter-based implementations. When there is an element that\
    \ returns true for a `some`, it **short-circuits** and does not process the remaining\
    \ elements:\n\n```javascript\nconst arr = [1, 2, 3];\n\nconst res = arr.some((i)\
    \ => {\n  console.log(`Checking ${i}`);\n  return i % 2 === 0;\n});\n\n// Checking\
    \ 1\n// Checking 2\n\nconsole.log(res);\n// true\n```\n\nSimilarly, `every` stops\
    \ after the first false result:\n\n```javascript\nconst arr = [1, 2, 3];\n\nconst\
    \ res = arr.every((i) => {\n  console.log(`Checking ${i}`);\n  return i < 2;\n\
    });\n\n// Checking 1\n// Checking 2\n\nconsole.log(res);\n// false\n```\n\nLet's\
    \ see how to code an async version that works in a similar way and does the least\
    \ amount of work!\n\n### Async some\n\nThe best solution is to use an async **for\
    \ iteration** that returns as soon as it finds a truthy result:\n\n```javascript\n\
    const arr = [1, 2, 3];\n\nconst asyncSome = async (arr, predicate) => {\n  for\
    \ (let e of arr) {\n    if (await predicate(e)) return true;\n  }\n  return false;\n\
    };\n\nconst res = await asyncSome(arr, async i => {\n  console.log(`Checking ${i}`);\n\
    \  await sleep(10);\n  return i % 2 === 0;\n});\n// Checking 1\n// Checking 2\n\
    \nconsole.log(res);\n// true\n```\n\nFor the first element `predicate(e)` returns\
    \ true, it concludes the for-loop.\n\n### Async every\n\nThe similar structure\
    \ works for `every`, it's just a matter of negating the conditions:"
  mdcn: "\n## 控制执行时机\n\n### 等待完成\n\n`forEach` 函数与 `map` 类似，但它不对值进行转换或使用结果，而是对每个元素运行该函数并丢弃返回值。本质上，重要的是调用函数的**副作用**。例如，同步地将每个元素输出到控制台：\n\
    \n```javascript\nconst arr = [1, 2, 3];\n\narr.forEach((i) => {\n  console.log(i);\n\
    });\n\n// 1\n// 2\n// 3\n\nconsole.log(\"Finished sync\");\n// Finished sync\n\
    ```\n\n由于结果并不重要，因此使用异步函数作为遍历器（iteratee）也可以正常工作：\n\n```javascript\nconst arr =\
    \ [1, 2, 3];\n\narr.forEach(async (i) => {\n  // 每个元素完成所需的时间不同\n  await sleep(10\
    \ - i);\n  console.log(i);\n});\n\nconsole.log(\"Finished async\");\n// Finished\
    \ async\n\n// 3\n// 2\n// 1\n```\n\n但正如不意外的那样，函数是**异步**调用的，程序执行会继续越过该调用。这与同步版本存在一个重要区别：当下一行代码执行时，同步的\
    \ `forEach` 已经完成，而异步版本的尚未完成。**因此****\"Finished async\"**日志会出现在元素输出***之前*。\n\n\
    要在继续之前等待所有函数调用完成，请结合使用带有 `Promise.all` 的 **map** 并丢弃结果：\n\n```javascript\nconst\
    \ arr = [1, 2, 3];\n\nawait Promise.all(arr.map(async (i) => {\n  await sleep(10\
    \ - i);\n  console.log(i);\n}));\n\n// 3\n// 2\n// 1\n\nconsole.log(\"Finished\
    \ async\");\n// Finished async\n```\n\n带有异步 forEach，等待结果的处理方式。有了这一修改，\"Finished\
    \ async”将出现在最后。\n\n## 顺序处理\n\n但请注意，遍历器函数（iteratee functions）是并调用执行的。为了忠实遵循同步的\
    \ `forEach` 行为，请先使用一个 `reduce` 加上 **await memo**：\n\n```javascript\nconst arr\
    \ = [1, 2, 3];\n\nawait arr.reduce(async (memo, i) => {\n  await memo;\n  await\
