  - '[PAGE 2]


    Over the years, the language got a lot of features that make writing async code
    easier. Gone are the days of the so-called callback hell where a series of callback-based
    async calls made the program''s structure very hard to understand and easy to
    inadvertently silence errors.


    First, Promises gained widespread support, flattening the structure of callbacks.
    Then async/await became the mainstream way of async programming, hiding a lot
    of the complexities of asynchronicity behind only two keywords: `async` and `await`.


    This improved readability and made it a lot easier for new programmers to write
    asynchronous code. Modern Javascript is still using the same single-threaded no-sync-wait
    event loop, but the program structure reflects that of a modern language.


    But asynchronous programming is inherently hard. While the language helps with
    the syntax to make understanding and writing code easier, asynchronicity introduces
    a lot of potential errors, most of them so subtle they only occur in special circumstances.


    Even though I''ve been working for many years with asynchronous code, some of
    the problems in this book took me a week to reach a solution I''m happy with.
    My goal with this book is that you''ll have an easier time when you encounter
    similar problems by knowing what are the hard parts. This way you won''t need
    to start from zero but you''ll have a good idea of what are the roadblocks and
    the best practices.


    You''ll notice that error handling is a recurring topic in this book. This is
    because it is an often overlooked concept and that leads to code that easily breaks.
    By knowing how errors in async functions and Promises work you''ll write safer
    programs.


    # Structure


    This book is divided into two parts.'
