    \ => {\n    await new Promise((res) => setTimeout(res, 500));\n    return \"p2\"\
    ;\n  })(),\n]);\n// result = p2\n```\n\n## Timeout implementation\n\nWith `Promise.race`,\
    \ it's easy to implement a timeout that supports any Promises. Along with the\
    \ async task, **start another Promise that rejects when the timeout is reached**.\
