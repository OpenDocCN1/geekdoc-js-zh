  md: '# Promise timeouts


    **Promises in Javascript have no concept of time.** When you use `await` or attach
    a function with `.then()`, it will **wait until the Promise is either resolved
    or rejected**. This is usually not a problem as most async tasks finish within
    a reasonable time and their result is needed.


    But when a client is waiting for a response of, let''s say, an HTTP server, it''s
    better to return early with an error giving the caller a chance to retry rather
    than to wait for a potentially long time.


    Fortunately, there is a built-in Promise helper function that can be used to add
    timeout functionality to any Promise-based construct.


    # Promise.race


    The [Promise.race](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/race)
    is a global property of the Promise object. **It gets an array of Promises and
    waits *for the first one to finish*.** Whether the race is resolved or rejected
    depends on the winning member.


    ![](img/bf8ff49d078976cf7c9fa8008bbb9b22_50_0.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: "For example, the following code races two Promises. The second one resolves\
    \ sooner, and the result of the other one is discarded:\n\n```\nconst p1 =\n \
    \ new Promise((res) => setTimeout(() => res(\"p1\"), 1000));\nconst p2 =\n  new\
    \ Promise((res) => setTimeout(() => res(\"p2\"), 500));\n\nconst result = await\
