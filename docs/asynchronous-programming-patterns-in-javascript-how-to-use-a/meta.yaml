  md: "This works unless there is an exception that jumps over the cleanup code.\n\
    \n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n\
    );\n\nthrow Error(\"error\");\n\nawait fs.rmdir(dir, {recursive: true});\n// the\
    \ cleanup won't run!\n```\n\nUse `try..finally` to implement reliable cleanup:\n\
    \n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n\
    );\ntry {\n  // use dir to store temporary things\n}finally {\n  await fs.rmdir(dir,\
    \ {recursive: true});\n}\n```\n\nEven better, you can move the resource lifecycle\
    \ to a dedicated function, as discussed in the The async disposer pattern chapter:\n\
    \n```\nconst withTempDir = async (fn) => {\n  const dir = await fs.mkdtemp(\n\
    \    await fs.realpath(os.tmpdir()) + path.sep\n  );\n  try {\n    return await\
    \ fn(dir);\n  }finally {\n    fs.rmdir(dir, {recursive: true});\n  }\n};\n\nawait\
    \ withTempDir((dir) => {\n  // use dir to store temporary things\n})\n```\n\n\
    # Using both the rejection and resolve handlers in one then function\n\nA common\
    \ source of problems is to write error handling like this:"
  merge: -1
  pgno: 121
- img_proc: true
  md: "```\ngetPromise()\n  .then(process, handleError);\n```\n\nAs we've discussed\
    \ in the [Error propagation in Promise chains](https://example.com) chapter, the\
    \ second handler of the `then()` is called for errors but only from the previous\
    \ steps.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_122_0.png)\n\nNotice that\
    \ the `handleError` function only gets errors from the `getPromise`. If the result\
    \ of the `process` function is rejected, it won't be handled.\n\nA better solution\
    \ is to use `.catch` to be explicit about errors:\n\n```\ngetPromise()\n  .then(process)\n\
    \  .catch(handleError);\n```\n\nThis way it's clear that both steps are covered\
    \ by the error handlers.\n\n# Not waiting for an async forEach\n\nThe `forEach`\
    \ function iterates over a collection and calls an iteratee function. A typical\
    \ problem is not waiting for the iteration to complete:"
  merge: -1
  pgno: 122
- img_proc: true
  md: "```\n[1, 2, 3].forEach(async (e) => {\n\tconsole.log(e);\n\treturn makePromise(e);\n\
    });\nconsole.log(\"finished\");\n// finished\n// 1\n// 2\n// 3\n```\n\nIt is a\
    \ best practice to wait until the whole collection is processed, which can be\
    \ achived with a `Promise.all` and a `map` :\n\n```\nawait Promise.all([1, 2,\
    \ 3].map(async (e) => {\n\tconsole.log(e);\n\treturn makePromsie(e);\n}));\nconsole.log(\"\
    finished\");\n// finished\n```\n\n> More info\n\nThis topic is covered in more\
    \ detail in the `Async functions with forEach` chapter."
  merge: -1
  pgno: 123
- img_proc: true
  md: "# Glossary\n\n**Async function**\n\nA function that returns a Promise. The\
    \ `await` keyword is only usable in an async function.\n\n```\nconst wait = (ms)\
    \ => new Promise((res) => setTimeout(res, ms));\n\nconst fn = async () => {\n\
    \  await wait(100);\n  return \"result\";\n}\n\nfn(); // Promise\n```\n\n**Async\
    \ generator function**\n\nA generator function that can use `await`. When it encounters\
    \ a `yield` or a `yield*` the execution stops until a subsequent element is requested.\n\
    \n```\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst\
    \ gen = async function*() {\n  console.log(\"start\");\n  await wait(100);\n \
    \ yield 1;\n  await wait(100);\n  console.log(\"next\");\n  yield 2;\n  await\
    \ wait(100);\n  console.log(\"end\");\n};\n\nconst it = gen();\nconsole.log(await\
    \ it.next());\nconsole.log(await it.next());\nconsole.log(await it.next());\n\n\
    // start\n// { value: 1, done: false }\n// next\n// { value: 2, done: false }\n\
    // end\n// { value: undefined, done: true }\n```"
  merge: -1
  pgno: 124
- img_proc: true
  md: "See [Generator function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/function*).\n\
    \n# await keyword\n\nUsable in async functions, it stops the execution until the\
    \ argument Promise becomes fulfilled. It then returns the value or throws an exception.\
    \ See [Async function](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function).\n\
    \n# Callback\n\nA function passed as an argument that is called with the return\
    \ value. It allows asynchronous results, as the callback can be invoked later.\n\
    \nFor example, the `setTimeout` function needs a callback that it calls when the\
    \ time is up:\n\n```\nsetTimeout(() => {\n  // 1 second later\n}, 1000);\n```\n\
    \nSee [Continuation-passing style](https://en.wikipedia.org/wiki/Continuation-passing_style).\n\
    \n# Collection processing\n\nA series of functions that work on a collection of\
    \ elements (usually, an array), such as transforming (`map`), filtering (`filter`),\
    \ and reducing to a value (`reduce`).\n\n# Continuation-passing style\n\nA programming\
    \ construct that uses callback functions (continuations) for function results\
    \ instead of returning them directly. This allows asynchronous results as these\
    \ callbacks can be invoked later."
  merge: -1
  pgno: 125
- img_proc: true
  md: "```\n// direct style\nconst directFn = () => {\n  return \"result\";\n};\n\n\
    // CPS\nconst cpsFn = (callback) => {\n  callback(\"result\");\n};\n```\n\nSee\
    \ [Callback](https://developer.mozilla.org/docs/Web/JavaScript/Reference/Functions/Arrow_functions#Syntax).\n\
    \n### Error propagation\n\nWhen there is an error, it moves up in context until\
    \ there is a piece of code that can handle it.\n\nFor example, an unhandled exception\
    \ gets thrown to the caller:\n\n```\nconst fn = () => {\n  // the error is thrown\
    \ here\n  throw new Error(\"error\");\n}\n\ntry {\n  fn();\n}catch(e) {\n  //\
    \ and handled here\n}\n```\n\nWith Promises, errors propagate to the next handlers:\n\
    \n```\ngetUser() // returns a Promise\n  .then(() => {\n    // the error is thrown\
    \ here\n    throw new Error(\"error\");\n  })\n  .catch((e) => {\n    // and handled\
    \ here\n  });\n```\n\n# ## Error-first callbacks\n\nA callback style where the\
    \ first argument is an error object. The receiving end needs to check if this\
    \ value is non-null (or non-undefined)."
  merge: -1
  pgno: 126
- img_proc: true
  md: "```\nconst fn = (callback) => {\n  try {\n    const result = \"result\";\n\
    \    // error is null\n    callback(null, result);\n  }catch(e) {\n    // signal\
    \ error\n    callback(e);\n  }\n}\n\nfn((err, result) => {\n  if (err) {\n   \
    \ // handle error\n  }else {\n    // handle result\n  }\n});\n```\n\nSee [Node-style\
    \ callbacks](https://nodejs.org/en/knowledge/getting-started/control-flow/what-are-callbacks/).\n\
    \n# Fulfilled Promise\n\nA state of a Promise that is either resolved or rejected.\
    \ See [Promise states](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise#description).\n\
    \n# Generator function\n\nA function that returns an iterable structure. It can\
    \ be frozen with a `yield` statement and only resumes if more elements are requested.\n\
    \n```\nconst gen = function*() {\n  console.log(\"start\");\n  yield 1;\n  console.log(\"\
    next\");\n  yield 2;\n  console.log(\"end\");\n}\n\nconst it = gen();\nconsole.log(it.next());\n\
    console.log(it.next());\nconsole.log(it.next());\n\n// start\n// { value: 1, done:\
    \ false }\n// next\n// { value: 2, done: false }\n// end\n// { value: undefined,\
    \ done: true }\n```"
  merge: -1
  pgno: 127
- img_proc: true
  md: "# Node-style callbacks\n\nA callback style where:\n\n+   - The callback function\
    \ is the last argument\n- It is called with an error object first, then a result\
    \ (`(error, result)`)\n- It returns only one result\n\n```\nconst getUser = (id,\
    \ cb) => {\n  const user = /* get user */;\n  if (user) {\n    // success\n  \
    \  cb(null, user);\n  }else {\n    // error\n    cb(new Error(\"Failed to get\
    \ user\"));\n  }\n};\n```\n\n# Pagination\n\nWhen a method (usually an API) does\
    \ not return all results for a request and it requires multiple calls to get all\
    \ items.\n\n# Pending Promise\n\nA Promise state where the asynchronous result\
    \ is not yet available. See [Promise states](link).\n\n# postMessage\n\nAn API\
    \ to communicate cross-context, such as with IFrames and Web Workers. It is an\
    \ event-based communication where one end listens for `message` events and the\
    \ other uses the `postMessage` function to send messages.\n\n# Promise\n\nA value\
    \ that holds an asynchronous result. You can use the `then` callback to handle\
    \ when the Promise becomes fulfilled, or use `await` in an async function."
  merge: -1
  pgno: 128
- img_proc: true
  md: "# Promise chain\n\nA series of `then()` callbacks, each getting the previous\
    \ state of the Promise and returns the next one.\n\n```\ngetUser() // returns\
    \ a Promise\n  .then(async function getPermissionsForUser(user) {\n    const permissions\
    \ = await // ...;\n    return permissions;\n  })\n  .then(async function checkPermission(permissions)\
    \ {\n    const allowed = await // ...;\n    return allowed;\n  })\n  .then((allowed)\
    \ => {\n    // handle allowed or not\n  });\n```\n\n# Promise states\n\nA Promise\
    \ can be in one of multiple states:\n\n+   - Pending: The value is not yet available\n\
    - Resolved: The value is available\n- Rejected: There was an error\n\nWhen the\
    \ Promise is either resolved or rejected then it's fulfilled or settled.\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_129_0.png)"
  merge: -1
  pgno: 129
- img_proc: true
  md: "# Promise.all\n\nA utility function that gets multiple Promises and resolves\
    \ when all of them are resolved and returns an array with the results. It rejects\
    \ if any of the input Promises rejects.\n\n```\nconsole.log(\n  await Promise.all([\n\
    \    Promise.resolve(\"a\"),\n    Promise.resolve(\"b\"),\n  ])\n);\n\n// [\"\
    a\", \"b\"]\n```\n\n# Promise.allSettled\n\nA utility function that gets multiple\
    \ Promises and resolves when all of them are settled. It resolves even if some\
    \ input Promises reject.\n\n```\nconsole.log(\n  await Promise.allSettled([\n\
    \    Promise.resolve(\"a\"),\n    Promise.reject(\"b\"),\n  ])\n);\n\n// [\n//\
    \   { status: 'fulfilled', value: 'a' },\n//   { status: 'rejected', reason: 'b'\
    \ }\n// ]\n```\n\n# Promise.catch\n\nA utility function that attaches a rejection\
    \ handler to a Promise. It's equivalent to `then(undefined, handler)`.\n\n```\n\
    Promise.reject(new Error(\"error\"))\n  .catch((e) => {\n    console.log(e.message);\
    \ // error\n  });\n```\n\n# Promise.finally"
  merge: -1
  pgno: 130
- img_proc: true
  md: "A utility function that is called when the Promise settles, either if it's\
    \ resolved or rejected. It brings the `try..finally` construct to Promises.\n\n\
    ```\n`getUser()` // returns a Promise\n`    `.finally(() => {\n`      `// called\
    \ both even if the Promise is rejected\n`      `console.log(\"finished\");`\n\
    `    });`\n`  // does not change the result value`\n```\n\n# **Promise.race**\
    \ \n\nA utility function that gets multiple Promises and resolves (or rejects)\
    \ when the first one settles.\n\n```\n`const wait = (ms) => new Promise((res)\
    \ => setTimeout(res, ms));`\n\n`const fn = async (ms, result) => {\n  await wait(ms);\n\
    \n  return result;\n}\n\nconsole.log(\n  await Promise.race([\n    fn(100, \"\
    a\"),\n    fn(50, \"b\"),\n  ])\n);`\n```\n\n# **Promise.reject** \n\nA utility\
    \ function that rejects with the value provided.\n\n```\n`Promise.reject(new Error(\"\
    error\"))\n`\\.catch((v) => {\n`   console.log(v.message); // error`\n`  } )`\n\
    ```\n\n# **Promise.resolve** \n\nA utility function that returns a Promise that\
    \ is resolved with the value provided. Useful to start a Promise chain."
  merge: -1
  pgno: 131
- img_proc: true
  md: "```\nPromise.resolve(\"value\")\n  .then((v) => {\n    console.log(v); // value\n\
    \  })\n```\n\n# Promise.then\n\nA function of a Promise object that attaches a\
    \ function that will be called when the Promise is settled. See [Promise chain](https://example.com).\n\
    \n# Promisification\n\nThe process of converting callbacks to Promises.\n\n# Rejected\
    \ Promise\n\nA Promise state that indicates an error. See [Promise states](https://example.com).\n\
    \n# Resolved Promise\n\nA Promise state where the asynchronous value is available.\
    \ See [Promise states](https://example.com).\n\n# Settled Promise\n\nAn alternative\
    \ name for the fulfilled state. See [Promise states](https://example.com).\n\n\
    # Synchronous function\n\nA function that returns a value when it's run. See [Continuation-passing\
    \ style](https://example.com)."
  merge: -1
  pgno: 132
