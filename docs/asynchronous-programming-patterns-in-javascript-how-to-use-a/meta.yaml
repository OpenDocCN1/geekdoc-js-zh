  - "[PAGE 72]\n\n# Paginating with async generators\n\nMany APIs limit how many results\
    \ they return for a single call. For example, the functions of the AWS SDK that\
    \ return lists are paginated operations. That means that you get a limited number\
    \ of elements in one call along with a token to get the next batch. This can be\
    \ a problem if you are not aware of it, as you might get all the elements during\
    \ development but your function might break in the future.\n\nBut while getting\
    \ the first batch is just `await lambda.listFunctions().promise()`, paginating\
    \ until all the pages are retrieved requires more work.\n\nLet's see how to make\
    \ an `await`-able structure that reliable gets all the elements from an AWS API!\n\
    \n# Pagination\n\nIn the case of Lambda functions, the `lambda.listFunctions`\
    \ [call](call) returns a structure with a list of all your lambdas if you don't\
    \ have too many of them (at most 50):\n\n```\nconst functions = await lambda.listFunctions().promise();\n\
    ```\n\n```\n{\n  Functions: [...]\n}\n```\n\nTo simulate a paginated case, you\
    \ can set the `MaxItems` parameter:\n\n```\nconst functions = await lambda.listFunctions({\n\
    \  MaxItems: 1\n}).promise();\n```\n\nThis time a `NextMarker` is also returned,\
    \ indicating there are more items:"
  - "[PAGE 73]\n\n```\n{\n Functions: [...],\n NextMarker: ...\n}\n```\n\nTo get the\
    \ next batch, provide the last marker:\n\n```\nconst functions = await lambda.listFunctions({\n\
    \ MaxItems: 1,\n Marker: functions.NextMarker,\n}).promise();\n```\n\nThen do\
    \ so until no NextMarker is returned.\n\n# **A solution with async generators**\n\
    \nAsync generators are a relatively new feature of Javascript. They are like traditional\
    \ generator functions, but they are async, meaning you can <await> inside them.\n\
    \nTo collect all the Lambda functions no matter how many calls are needed, use:\n\
    \n```\nconst getAllLambdas = async () => {\n const EMPTY = Symbol(\"empty\");\n\
    \ \n const res = [];\n for await (const lf of (async function*() {\n let NextMarker\
    \ = EMPTY;\n while (NextMarker || NextMarker === EMPTY) {\n  const functions =\
    \ await lambda.listFunctions({\n   Marker: NextMarker !== EMPTY ? NextMarker :\
    \ undefined,\n }).promise();\n yield* functions.Functions;\n NextMarker = functions.NextMarker;\n\
    \ })()) {\n res.push(lf);\n }\n return res;\n }\n // use it\n const functions\
    \ = await getAllLambdas();\n```"
  - "[PAGE 74]\n\n# Async generator functions\n\nA generator function that can use\
    \ `await` . When it encounters a `yield` or a `yield*` the execution stops until\
    \ a subsequent element is requested.\n\n```\nconst wait = (ms) =>\n  new Promise((res)\
    \ => setTimeout(res, ms));\n\nconst gen = async function*() {\n  console.log(\"\
    start\");\n  await wait(100);\n  yield 1;\n  await wait(100);\n  console.log(\"\
    next\");\n  yield 2;\n  await wait(100);\n  console.log(\"end\");\n};\n\nconst\
    \ it = gen();\nconsole.log(await it.next());\nconsole.log(await it.next());\n\
    console.log(await it.next());\n\n// start\n// { value: 1, done: false }\n// next\n\
    // { value: 2, done: false }\n// end\n// { value: undefined, done: true }\n```\n\
    \n# Breaking it down\n\nThe most important thing is to keep track of the `NextMarker`\
    \ returned by the last call and use that for making the next one. For the first\
    \ call, `Marker` should be `undefined` , and to differentiate between the first\
    \ and the last one (the one that returns no `NextMarker` ), a Symbol is a safe\
    \ option as it cannot be returned by the API."
