  md: '![](img/bf8ff49d078976cf7c9fa8008bbb9b22_28_0.png)


    There are multiple things to notice here. First, `Promise.all` gets *Promises*.
    Remember that *calling* an async function returns a Promise, so don''t forget
    to call the functions you want to run.


    Second, it needs a *collection of Promises*, which is usually an array. Notice
    the `([ ... ])` structure for the call to `Promise.all`.


    And third, `await` is only used for the `Promise.all` and not for the individual
    async function calls. This is because you want to wait for *all of them* to finish
    before moving on.


    > > **Tip**

    >

    > `await` stops the async function execution. In the case of `Promise.all` you
    want to stop only once, to wait for all the input Promises to settle. That''s
    why you only need one `await`.


