    \ arguments must be numbers\n}\n```\n\nOne restriction is what can be sent through\
    \ the `postMessage` call. It uses the structured clone algorithm which supports\
    \ complex objects but not everything.\n\n## Collection processing with async functions\n\
    \nWhile async/await is great to make async *commands* look like synchronous ones,\
    \ collection processing is not that simple. It's not just adding an `async` before\
    \ the function passed to `Array.reduce` and it will magically work correctly.\
    \ But without async functions, you can not use `await` and provide a result *later*\
    \ which is required for things like reading a database, making network connections,\
    \ reading files, and a whole bunch of other things.\n\nLet's see some examples!\n\
    \nWhen all the functions you need to use are synchronous, it's easy. For example,\
    \ a string can be doubled without any asynchronicity involved:\n\n```\nconst double\
    \ = (str) => {\n  return str + str;\n};\n\ndouble(\"abc\");\n// abcabc\n```\n\n\
    If the function is async, it's also easy for a single item using `await`. For\
    \ example, to calculate the SHA-256 hash, JavaScript provides a `digest()` async\
    \ function:\n\n```\n// https://developer.mozilla.org/docs/Web/API/SubtleCrypto/digest\n\
    const digestMessage = async (message) => {\n  const msgUint8 = new TextEncoder().encode(message);\n\
    \  const hashBuffer =\n    await crypto.subtle.digest(\"SHA-256\", msgUint8);\n\
    \  const hashArray = Array.from(new Uint8Array(hashBuffer));\n  const hashHex\
    \ = hashArray\n    .map(b => b.toString(16).padStart(2, \"0\"))\n    .join('');\n\
    \  return hashHex;\n};\n\nawait digestMessage(\"msg\");\n// e46b320165eec91e6344fa1034...\n\
    ```\n\nThis looks almost identical to the previous call, the only difference is\
    \ an `await`.\n\nBut for collections, handling asynchronicity becomes different.\n\
    \nTo calculate the double for each element in a **collection of strings** is simple\
    \ with a `map`:\n\n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nstrings.map(double);\n\
    // [\"msg1msg1\", \"msg2msg2\", \"msg3msg3\"]\n```\n\nBut to calculate the **hash**\
    \ of each string in a collection, it does not work:\n\n```\nconst strings = [\"\
    msg1\", \"msg2\", \"msg3\"];\n\nawait strings.map(digestMessage);\n// [object\
    \ Promise],[object Promise],[object Promise]\n```\n\nThis is an everyday problem\
    \ as async functions make a bigger category than synchronous ones. A sync function\
    \ can work in an async environment, but an async one can not be converted to work\
    \ in a synchronous way.\n\nFor a more realistic scenario, querying a database\
    \ is inherently async as it needs to make network connections. To get the score\
    \ for a single `userId` from a hypothetical database is simple:\n\n```\nconst\
    \ getUserObject = async (id) => {\n  // get user by id\n};\n\nconst userId = 15;\n\
    const userObject = await getUserObject(userId);\nconst userScore = userObject.score;\n\
    ```\n\nBut how to query the database for a *collection* of `userId`s?\n\n```\n\
    const userIds = [15, 16, 21];\n// const userObjects = ???\n```\n\nAnd it's not\
    \ just about using `map` to transform one value to another. Is the user's score\
    \ above 3?\n\n```\nconst userObject = await getUserObject(userId);\nconst above3\
    \ = userObject.score > 3;\n```\n\nBut is *any* of the users' score above 3?\n\n\
    ```\n// userIds.some(???)\n```\n\nOr what is the average score?\n\n```\n// userIds.reduce(???)\n\
    ```\n\nTo make things more interesting, adding an `async` to a `map` at least\
    \ gives some indication what is changed:\n\n```\n// synchronous\n[1, 2, 3].map((i)\
    \ => {\n  return i + 1;\n});\n// [2, 3, 4]\n\n// asynchronous\n[1, 2, 3].map(async\
    \ (i) => {\n  return i + 1;\n});\n// [object Promise],[object Promise],[object\
    \ Promise]\n```\n\nBut a `filter` just does something entirely wrong:\n\n```\n\
    // synchronous\n[1, 2, 3, 4, 5].filter((i) => {\n  return i % 2 === 0;\n});\n\
    // [2, 4]\n\n// asynchronous\n[1, 2, 3, 4, 5].filter(async (i) => {\n  return\
    \ i % 2 === 0;\n});\n// [1, 2, 3, 4, 5]\n```\n\nBecause of this, async collection\
    \ processing requires some effort, and it's different depending on what kind of\
    \ function you want to use. An async `map` works markedly differently than an\
    \ async `filter` or an async `reduce`.\n\nIn this chapter, you'll learn how each\
    \ of them works and how to efficiently use them.\n\n## Async for iteration\n\n\
    But first, let's talk about `for` loops!\n\nI don't like `for` loops as they tend\
    \ to promote bad coding practices, like nested loops that do a lot of things at\
    \ once or `continue`/`break` statements scattered around that quickly descend\
    \ into an unmaintainable mess.\n\nAlso, a more functional approach with functions\
    \ like `map`/`filter`/`reduce` promote a style where one function does only one\
    \ thing and everything inside it is scoped and stateless. And the functional approach\
    \ is not only possible 99% of the time but it comes with no perceivable performance\
    \ drop and it also yields simpler code (well, at least when you know the functions\
    \ involved).\n\nBut async/await is in the remaining 1%.\n\nFor loops have a distinctive\
    \ feature, as they don't rely on *calling* a function. In effect, you can use\
    \ `await` inside the loop and it will just work.\n\n```\n// synchronous\n{\n \
    \ const res = [];\n  for (let i of [1, 2, 3]) {\n    res.push(i + 1);\n  }\n \
    \ // res: [2, 3, 4]\n}\n\n// asynchronous\n{\n  const res = [];\n  for (let i\
    \ of [1, 2, 3]) {\n    await sleep(10);\n    res.push(i + 1);\n  }\n  // res:\
    \ [2, 3, 4]\n}\n```\n\nAs `for` loops are a generic tool, they can be used for\
    \ all kinds of requirements when working with collections.\n\nBut their downside\
    \ is still present, and while it's not trivial to adapt the functional approach\
    \ to async/await, once you start seeing the general pattern it's not that hard\
    \ either.\n\n## Async functions with reduce\n\nThe `reduce` function iteratively\
    \ constructs a value and returns it, which is not necessarily a collection. That's\
    \ where the name comes from, as it *reduces* a collection to a value.\n\nThe iteratee\
    \ function gets the previous result, called `memo` in the examples below, and\
    \ the current value, `e`.\n\nThe following function sums the elements, starting\
    \ with 0 (the second argument of `reduce`):\n\n```\nconst arr = [1, 2, 3];\n\n\
    const syncRes = arr.reduce((memo, e) => {\n    return memo + e;\n}, 0);\n\nconsole.log(syncRes);\n\
    // 6\n```\n\n| memo      | e | result    |\n| :---      | :--- | :--- |\n| 0 (initial)\
    \   | 1 | 1 |\n| 1    | 2 | 3 |\n| 3    | 3 | (end result) 6 |\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_90_0.png)\n\
    \n## Asynchronous reduce\n\nAn async version is almost the same, but it returns\
    \ a Promise on each iteration, so `memo` will be the *Promise* of the previous\
    \ result. The iteratee function needs to `await` it in order to calculate the\
    \ next result:\n\n```\n// utility function for sleeping\nconst sleep = (n) =>\
    \ new Promise((res) => setTimeout(res, n));\n\nconst arr = [1, 2, 3];\n\nconst\
    \ asyncRes = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n  return\
    \ (await memo) + e;\n}, 0);\n\nconsole.log(asyncRes);\n// 6\n```\n\n| memo   \
    \   | e | result          |\n| :---      | :--- | :--- |\n| 0 (initial)   | 1\
    \ | Promise(1) |\n| Promise(1)   | 2 | Promise(3) |\n| Promise(3)   | 3 | (end\
    \ result) Promise(6) |\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_91_0.png)\n\
    \nWith the structure of `async (memo, e) => await memo`, the `reduce` can handle\
    \ any async functions and it can be `await`ed."
