  - "[PAGE 12]\n\n```\n[1].flatMap((a) => 5) // [5]\n[1].flatMap((a) => [5]) // [5]\n\
    \n[1].flat() // [1]\n[[1]].flat() // [1]\n```\n\nWhen I'm not sure what a Promise\
    \ chain returns, I mentally translate Promises to arrays where every async function\
    \ return a flattened array with its result and an `await` is getting the first\
    \ element:\n\n```\nconst f1 = () => {\n  return [2].flat();\n};\n\nconst f2 =\
    \ () => {\n  return [f1()].flat();\n}\n\nconst result = f2()[0]; // 2\n```\n\n\
    A Promise chain then becomes a series of `flatMap` S:\n\n```\nconst getUser =\
    \ () => [\"user\"];\n\ngetUser()\n  .flatMap(function getPermissionsForUser(user)\
    \ {\n    // user = \"user\"\n    const permissions = \"permissions\";\n    return\
    \ permissions;\n  })\n  .flatMap(function checkPermission(permissions) {\n   \
    \ // permissions = \"permissions\"\n    const allowed = true;\n    return allowed;\n\
    \  })\n  .flatMap((allowed) => {\n    // allowed = true\n    // handle allowed\
    \ or not\n  });\n```\n\nThis eliminates most of the complexities of asynchronicity\
    \ and is a lot easier to reason about.\n\n# Promises"
  - "[PAGE 13]\n\nSo far we've discussed how to write Promise-producing async functions\
    \ and how to wait for a Promise to have a value. But how to create Promises in\
    \ cases where there are no existing Promises to build on?\n\nTo know this, we\
    \ need to discuss how asynchronicity works in Javascript and how to construct\
    \ Promises from callbacks.\n\n# Callbacks\n\nAsync results come in the form of\
    \ callbacks. These are like the parameter of the `then()` function in Promises\
    \ but are called when a particular event happens. For example, the simplest callback\
    \ is the `setTimeout` call that waits a given number of milliseconds then invokes\
    \ the argument function:\n\n```\nsetTimeout(() => {\n  // 1s later\n}, 1000);\n\
    ```\n\nThis pattern of using callbacks is everywhere in Javascript.\n\nThe gapi,\
    \ the library to use Google services, [needs a callback](https://www.google.com)\
    \ when it loads a client library:\n\n```\ngapi.load(\"client:auth2\", () => {\n\
    \  // auth2 client loaded\n});\n```\n\nSimilarly, event listeners, such as a click\
    \ handler, calls a function when the event happened:\n\n```\nconst button = document.querySelector(\"\
    #button\");\n\nbutton.addEventListener(\"click\", () => {\n  // button is clicked\n\
    }, {once: true})\n```\n\nThe problem with callbacks is that we are back to square\
    \ one as instead of having a flat structure we have nesting again."
  - "[PAGE 14]\n\nFortunately, there is a simple way to convert callbacks to Promises\
    \ and then use them with `await`.\n\n> Event listeners and Promises\n\nEagle-eyed\
    \ readers might have spotted the `{once: true}` part in the last example. Event\
    \ listeners are inherently different than async functions as they represent *multiple\
    \ events* instead of a single result value. Because of this, you can not replace\
    \ them with Promises.\n\nThe exception is when there is exactly one event, as\
    \ in the above example. In a sense, it works similarly to the timeout or the gapi\
    \ load function, as the callback is invoked when the event happens.\n\n# The Promise\
    \ constructor\n\nAsync functions return Promises but you can only use `await`\
    \ to wait for other Promises and not for callbacks. To make a Promise, you need\
    \ to use its constructor:\n\n```\nnew Promise((res) => {\n  // call res when the\
    \ Promise is ready\n});\n```\n\nCalling the `res` callback signals the Promise\
    \ that the result is ready. This is the same as when an async function returns.\n\
    \nTo convert the `setTimeout` to a Promise, wrap it in the constructor and use\
    \ `res` as the callback:"
  - "[PAGE 15]\n\n```\nawait new Promise((res) => {\n  setTimeout(res, 1000);\n});\n\
    // 1s later\n\n// same as\nawait new Promise((res) => {\n  setTimeout(() => {\n\
    \    res();\n  }, 1000);\n});\n```\n\nNow that it is a Promise, `await` works\
    \ just like for other async functions.\n\nSimilarly, the two other examples are\
    \ also easy to promisify:\n\n```\nawait new Promise((res) => {\n  gapi.load(\"\
    client:auth2\", res);\n});\n// auth2 client loaded\n```\n\n```\nconst button =\
    \ document.querySelector(\"#button\");\n\nawait new Promise((res) => {\n  button.addEventListener(\"\
    click\", res, {once: true});\n});\n// button is clicked\n```\n\nWith Promises\
    \ instead of callbacks it's easy to use `await` and make a sequence of async operations.\
    \ To load the auth2 client when the button is clicked:\n\n```\nawait new Promise((res)\
    \ => {\n  button.addEventListener(\"click\", res, {once: true});\n});\n// the\
    \ button is clicked\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\"\
    , res);\n});\n// the gapi library is loaded\n```"
- md: "## Converting between callbacks and Promises\n\nYou'll learn more about this\
    \ in the [Convert between Promises and callbacks](Convert between Promises and\
    \ callbacks) chapter.\n\n## Promise states\n\nAs a Promise holds a future value\
    \ it can be in several states.\n\nWhen you create a Promise, it starts in the\
    \ **Pending** state. It is before the resolve/reject callback is called or the\
    \ async function finished.\n\nWhen there is a value, the Promise transitions into\
    \ the **Resolved** state. It is when the `await` in unblocked and the async function\
    \ continues to run.\n\nIf there is an error, the Promise goes into the **Rejected**\
    \ state. It is when the `await` throws an exception.\n\nThe Resolved and the Rejected\
    \ states are collectively called **Fulfilled** (or **Settled**). When a Promise\
    \ is in this state it's already finished and produced a value or an error.\n\n\
    ![](img/bf8ff49d078976cf7c9fa8008bbb9b22_16_0.png)\n\n## Result value\n\nThe examples\
    \ above all used the Promise `res` function to signal when an async operation\
    \ is ready and did not produce any value. To also return a value, **pass it to\
    \ the `res` call.**\n\n```\nconst value = new Promise((res) => {\n  res(5);\n\
    });\n// 5\n```\n\nA more complicated example, the next Promise shows the Google\
    \ Drive file picker and resolves with the selected file. This seems complicated,\
    \ but the underlying idea is the same: create a new Promise, then call the `res`\
    \ method when the result is ready.\n\n```\nconst folder = await new Promise((res)\
    \ => {\n  const picker = new google.picker.PickerBuilder()\n    // ... configuration\
    \ ...\n    .setCallback((data) => {\n      if (/* selected action*/) {\n     \
    \   // a folder is selected\n        const selectedFolder = ...\n\n        //\
    \ resolve the Promise\n        res(selectedFolder);\n      }\n    })\n    .build();\n\
    \  picker.setVisible(true);\n});\n// folder is the selected folder\n```\n\n> **Note**\n\
    \nYou can return only one value with the `res()` call. You'll learn about ways\
    \ to return multiple in the [Returning multiple values](#) chapter.\n\n## Error\
    \ handling\n\nSo far we've been discussing async functions when everything is\
    \ going fine. No database timeout, no validation errors, no sudden loss of network.\
    \ But these things happen, so we need to prepare for them too. Without proper\
    \ error propagation, failures stall Promises and async functions, stopping them\
    \ forever.\n\nWith synchronous functions, errors happen when something `throw`\
    \ s them, and they bubble up until there is a `try-catch`:\n\n```\nconst fn =\
    \ () => {\n  throw new Error(\"Something bad happened\");\n}\n\ntry {\n  fn();\n\
    }catch(e) {\n  // handle error\n}\n```\n\nAsync functions work similarly so that\
    \ when there is an error thrown it will go up until a `try-catch`. When there\
    \ is an asynchronous error (we'll look into how they work in the next chapter),\
    \ you can handle it with the same familiar structure:\n\n```\nconst fn = async\
    \ () => {\n  throw new Error(\"Something bad happened\");\n}\n\ntry {\n  await\
    \ fn();\n}catch(e) {\n  // handle error\n}\n```\n\nNote\n\nErrors are thrown during\
    \ the `await` and not when the function is called:\n\n```\nconst asyncFn = async\
    \ () => {\n  throw new Error(\"Something bad happened\");\n}\n\nconst res = asyncFn();\
    \ // no error here\n\ntry {\n  await res; // error\n}catch(e) {\n  // handle error\n\
    }\n```\n\n## Error callback in the Promise constructor\n\nBut when you use the\
    \ Promise constructor, you need to pay attention to propagate the errors.\n\n\
    Let's revisit our previous examples! The `gapi.load` loads a client library that\
    \ can be used with Google services and it needs a callback to notify when it's\
    \ finished. This is easy to turn into a Promise with the Promise constructor:\n\
    \n```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\", res);\n});\n\
    // auth2 loaded\n```\n\nBut what happens when there is an error? Maybe the network\
    \ is down and the client library can not be loaded. In this case, the callback\
    \ function is never called and the Promise is never finished. An `await` waiting\
    \ for it will wait forever.\n\n```\nawait new Promise((res) => {\n  gapi.load(\"\
    client:auth2\", res); // error\n});\n// never happens\n```\n\nTo implement proper\
    \ error propagation, we need two things. First, a way to signal the Promise that\
    \ an error happened, and second, a way to detect that error.\n\n## Rejecting a\
    \ Promise\n\nThe Promise constructor provides a second callback that can signal\
    \ that an error happened:\n\n```\nnew Promise((res, rej) => {\n  // call res()\
    \ when everything is fine\n  // call rej() when there is an error\n});\n```\n\n\
    When the `rej` function is called it behaves similarly to an async function throwing\
    \ an error:\n\n```\ntry {\n  await new Promise((res, rej) => {\n    rej(); //\
    \ signal error\n  });\n} catch(e) {\n  // handle error\n}\n```\n\nSimilar to the\
    \ `res` function, you can pass the error object which will be the rejection reason:\n\
    \n```\ntry {\n  await new Promise((res, rej) => {\n    rej(new Error(\"Something\
    \ bad happened\"));\n  });\n} catch(e) {\n  console.log(e.message) // Something\
    \ bad happened\n}\n```\n\n## What is an error\n\nWhat constitutes an error is\
    \ up to the implementation. For example, `fetch` throws an error when the connection\
    \ can not be established, but it does not when the response code is outside the\
    \ 2xx range.\n\n```\ntry {\n  const response = await fetch(options);\n  if (response.ok)\
    \ {\n    // request successful\n  }else {\n    // error response\n  }\n} catch\
    \ (e) {\n  // error while sending the request\n}\n```\n\nExceptions thrown in\
    \ the constructor also reject the Promise:\n\n```\nnew Promise(() => {\n  throw\
    \ Error(\"something bad happened\");\n});\n// rejected with error\n```\n\nThis\
    \ behavior makes most programming errors to propagate correctly. But unlike the\
    \ `reject` callback, this only handles synchronous errors.\n\n## Detecting errors\n\
    \nNow that we have a way to signal an error to the Promise, let's see how to adapt\
    \ the gapi example to take advantage of this construct!\n\nIn this specific case,\
    \ the callback can also be an [object](link) with `callback` and `onerror` handlers:\n\
    \n```\nawait new Promise((res, rej) => {\n  gapi.load(\"client:auth2\", {callback:\
    \ res, onerror: rej});\n});\n```\n\nNow if there is an error during the load process\
    \ the `rej` function is called and the `await` throws an error.\n\n> **Note**\n\
    \nHow the underlying function signals results and errors can vary from library-to-library.\
    \ You'll learn more about it in the [Callback styles](https://example.com) chapter.\n\
    \n## Error propagation in Promise chains\n\nWhile async functions use the same\
    \ `try..catch` structure as normal functions, Promise chains work differently.\
    \ The `then` callback gets an additional callback, one that is called when a previous\
    \ Promise is rejected:\n\n```\nconst rejectedPromise = new Promise((res, rej)\
    \ => {\n  rej(new Error(\"rejected\"));\n});\n\nrejectedPromise.then(undefined,\
    \ (error) => {\n  // error = \"rejected\"\n  // handle error\n});\n```\n\nErrors\
    \ in Promise chains move to the next error handler, skipping all previous steps.\
    \ This makes it easy to collect errors from multiple steps and handle them in\
    \ a single place:\n\n```\ngetUser()\n  .then(getPermissionsForUser)\n  .then(checkPermission)\n\
    \  .then((allowed) => {\n    // handle allowed or not\n  }).then(undefined, (error)\
    \ => {\n    // there was an error in one of the previous steps\n  });\n```\n\n\
    A useful way to think about error propagation through the chain is to think about\
    \ it as 2 parallel railway tracks with stations. A station is a then callback,\
    \ and its result determines which track the train continues.\n\n> ## Tip\nInstead\
    \ of .then(undefined, (error) => {...}) , you can use the shorthand .catch((error)\
    \ => {...}).\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_23_0.png)\n\n*Error handler\
    \ in a Promise chain*\n\nThis way of thinking allows untangling way more complicated\
    \ chains. Let's dissect what's happening here:\n\n```\ngetPromise()\n    .then(handler1)\n\
    \    .then(handler2, catch1)\n    .then(handler3)\n    .then(undefined, catch2)\n\
    \    .then(handler4)\n```\n\nThis yields the following diagram:\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_24_0.png)\n\
    \n## It looks complicated, but there are simple rules:\n\n- Each function, no\
    \ matter which track it is, can move the execution to the OK as well as the error\
    \ tracks\n- When a handler is missing (the diamonds in the above diagram) the\
    \ execution stays on the same track\n\nFor example, if `getPromise()` is rejected,\
    \ the next function will be `catch1`. If it resolves, then `handler3` is the next\
    \ one. If it resolves, `handler4` is called, and it will be the result of the\
    \ whole chain, no matter if it resolves or rejects."
  mdcn: "\n## 在回调和 Promise 之间进行转换\n\n关于这一点，您可以在 [Promise 与回调之间的转换](Promise 与回调之间的转换)\
    \ 章节中了解更多。\n\n## Promise 状态\n\n由于 Promise 持有一个未来值，它可以处于多种**Pending（待定）**、**Resolved（已解决）**或\
    \ **Rejected（已拒绝）**的状态。当您创建一个 Promise 时，它会从 **Pending** 状态开始。这是在 resolve/reject\
    \ 回调被调用之前，或者异步函数完成之前的阶段。\n\n当存在一个值时，Promise 会过渡到 **Resolved** 状态。这是指 `await` 解除阻塞且异步函数继续运行的时刻。\n\
    \n如果发生错误，Promise 将进入 **Rejected**。这发生在 await 抛出异常时。\n\n已解决（Resolved）和已拒绝（Rejected）的状态统称为\
    \ **Fulfilled（已完成）** (或 **Settled(已决)**)。当 Promise 处于此状态时，它已经完成并产生了值或错误。\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_16_0.png)\n\
    \n## 结果值\n\n上述示例均使用了 Promise `res` 函数来通知异步操作完成，但未产生任何返回值。若要同时返回一个值，**请将它传递给 `res`\
    \ 调用。**\n\n```\nconst value = new Promise((res) => {\n  res(5);\n});\n// 5\n```\n\
    \n接下来是一个更复杂的示例，该 Promise 展示了 Google Drive 文件选择器，并在使用选定的文件后解决。这看似复杂，但基本原理与之前相同：创建一个新的\
    \ Promise，然后在结果准备好时调用 `res` 方法。\n\n```\nconst folder = await new Promise((res)\
    \ => {\n  const picker = new google.picker.PickerBuilder()\n    // ... configuration\
    \ ...\n    .setCallback((data) => {\n      if (/* selected action*/) {\n     \
    \   // a folder is selected\n        const selectedFolder = ...\n\n        //\
    \ resolve the Promise\n        res(selectedFolder);\n      }\n    })\n    .build();\n\
    \  picker.setVisible(true);\n});\n// folder is the selected folder\n```\n\n> **注释**\n\
    \n您只能通过 `res()` 调用返回一个值。关于如何返回多个值的用法，您可以在 [Returning multiple values](#)（翻译注：中文环境中通常译为“返回多个值”）章节中了解更多信息。\n\
    \n## 错误处理\n\n到目前为止，我们一直都在讨论一切顺利时的异步函数。没有数据库超时、没有验证错误、也没有突然的网络中断。但这些情况确实会发生，因此我们需要为此做好准备。如果不进行适当的错误传播，失败会导致\
    \ Promise 和异步函数的停滞并永远停止运行。\n\n对于同步函数，当某事物`throw`抛出异常时会触发错误，并且这些错误会一直冒泡直到遇到 `try-catch`：\n\
    \n```\nconst fn = () => {\n  throw new Error(\"Something bad happened\");\n}\n\
    \ntry {\n  fn();\n}catch(e) {\n  // handle error\n}\n```\n\n异步函数的工作原理类似，当抛出异常时也会向上冒泡直到遇到\
    \ `try-catch`。对于异步错误（我们将在下一章探讨其工作机制），您可以使用相同的熟悉结构进行处理：\n\n```\nconst fn = async\
    \ () => {\n  throw new Error(\"Something bad happened\");\n}\n\ntry {\n  await\
    \ fn();\n}catch(e) {\n  // handle error\n}\n```\n\n注意\n\nError exceptions are\
    \ thrown during the `await` and not when the function is called:（翻译注：保留原文表述，但语境上指异常在\
    \ await 期间抛出）\n\n在调用函数时不会立即产生错误：\n\n```\nconst asyncFn = async () => {\n  throw\
    \ new Error(\"Something bad happened\");\n}\n\nconst res = asyncFn(); // no error\
    \ here\n\ntry {\n  await res; // error\n}catch(e) {\n  // handle error\n}\n```\n\
    \n## Promise构造函数中的错误回调\n\n但是，当您使用 Promise 构造函数时，必须注意传播这些错误。\n\n让我们重新审视之前的示例！`gapi.load`\
    \ 可以加载用于与 Google 服务一起使用的客户端库，并且它需要一个回调来通知完成状态。借助 Promise 构造函数，很容易将其转换为 Promise：\n\
    \n```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\", res);\n});\n\
    // auth2 loaded\n```\n\n但如果发生错误呢？也许网络断开连接，导致无法加载客户端库。在这种情况下，回调函数永远不会被调用，Promise\
    \ 也永远不会完成。正在 `await` 等待它的操作将永远挂起。\n\n```\nawait new Promise((res) => {\n  gapi.load(\"\
    client:auth2\", res); // error\n});\n// never happens\n```\n\n为了实现适当的错误传播，我们需要两件事：首先是一种向\
    \ Promise 发出发生错误的信号的方式，其次是检测该错误的方法。\n\n## Rejecting a Promise（拒绝 Promise）\n\n\
    Promise 构造函数提供了第二个回调参数，可用于指示发生了错误：\n\n```\nnew Promise((res, rej) => {\n  // call\
    \ res() when everything is fine\n  // call rej() when there is an error\n});\n\
    ```\n\n当调用 `rej` 函数时，其行为类似于异步函数抛出异常：\n\n```\ntry {\n  await new Promise((res,\
    \ rej) => {\n    rej(); // signal error\n  });\n} catch(e) {\n  // handle error\n\
    }\n```\n\n类似地，对于 `res` 函数，您可以传入错误对象作为拒绝原因（rejection reason）：\n\n```\ntry {\n \
    \ await new Promise((res, rej) => {\n    rej(new Error(\"Something bad happened\"\
    ));\n  });\n} catch(e) {\n  console.log(e.message) // Something bad happened\n\
    }\n```\n\n## What is an error（什么是错误）\n\n什么构成“错误”完全取决于实现。例如，`fetch` 在无法建立连接时抛出异常，但在响应的状态码不在\
    \ 2xx 范围内却不抛出错误。\n\n```\ntry {\n  const response = await fetch(options);\n  if\
    \ (response.ok) {\n    // request successful\n  }else {\n    // error response\n\
    \  }\n} catch (e) {\n  // error while sending the request\n}\n```\n\n在构造函数中抛出的异常也会拒绝\
    \ Promise：\n\n```\nnew Promise(() => {\n  throw Error(\"something bad happened\"\
    );\n});\n// rejected with error\n```\n\n这种行为使得大部分编程错误能够正确地传播。但不同于 `reject` 回调参数，这仅能处理同步错误。\n\
    \n## Detecting errors（检测错误）\n\n现在我们有了向 Promise 发出信号的方法了，让我们看看如何将 `gapi`示例适配此结构！\n\
    \n在此特定情况下，回调也可以是一个包含 `callback`和`onerror`处理方法的 [object](link)：\n\n```\nawait new\
    \ Promise((res, rej) => {\n  gapi.load(\"client:auth2\", {callback: res, onerror:\
    \ rej});\n});\n```\n\n现在如果在加载过程中发生错误，将调用 `rej`函数并且 `await`会抛出异常。\n\n> **注释**\n\
    \n底层函数如何传达结果和信号的方法可能因库而异 (library-to-library)。您将在 [Callback styles](https://example.com)（回调风格）章节中了解更多相关信息。(翻译注：根据上下文推测\"\
    callback:res, onerror:rej\"中的 object 实为对象字面量，此处保留原文 format。由于中文语境习惯将此类参数描述称为“样式”或“模式”，故直译。)\n\
    \n## Promise chain的错误传播（Promise链中的错误处理）\n\n虽然异步函数与常规函数使用相同的 `try..catch`结构，但 Promise\
    \ 链的工作方式不同。`then`回调会获得一个额外的回调，用于在前一个 Promise 被拒绝时调用：\n\n```\nconst rejectedPromise\
    \ = new Promise((res, rej) => {\n  rej(new Error(\"rejected\"));\n});\n\nrejectedPromise.then(undefined,\
    \ (error) => {\n  // error = \"rejected\"\n  // handle error\n});\n```\n\nPromise\
    \ 链中的错误会移动到下一个错误处理器，跳过所有先前的步骤。这使得收集来自多个步骤的错误并在单一位置处理它们变得非常容易：\n\n```\ngetUser()\n\
    \  .then(getPermissionsForUser)\n  .then(checkPermission)\n  .then((allowed) =>\
    \ {\n    // handle allowed or not\n  }).then(undefined, (error) => {\n    // there\
    \ was an error in one of the previous steps\n  });\n```\n\n思考 Promise 链中错误传播的一个有用模型是将其视为两条平行的铁轨，铁轨上设有站点。一个站点是一个\
    \ `then`回调，其结果决定了火车将继续走哪条轨道。\n\n> ## Tip（提示）\n与其使用 .then(undefined, (error) =>\
    \ {...})，您可以使用简写形式 .catch((error) => {...})。\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_23_0.png)\n\
    \n*[Promise 链中的错误处理器]*\n\n\n这种思维方式允许解开更加复杂的 Promise 链。让我们分解一下这里发生的事情：\n\n```\n\
    getPromise()\n    .then(handler1)\n    .then(handler2, catch1)\n    .then(handler3)\n\
    \    .then(undefined, catch2)\n    .then(handler4)\n```\n\n这会产生以下图表：\n\n![](img/bf8ff49d078976cf7c9fa8008bbb9b22_24_0.png)\n\
    \n## 它看起来很复杂，但有一些简单的规则：\n\n\n-   无论在哪条轨道上的每个函数（each function），都可以将 execution （执行）同时移动到\
    \ OK (成功) 以及 error (失败/错误) 轨道\n-   如果缺少处理程序时（即上面的图表中的菱形部分），execution 将继续停留在同一股铁轨上\n\
    \n例如，如果 `getPromise()`被拒绝，下一个函数将是`catch1`. If it resolves, then **handler3**is\
    \ the next one. If it resolves, **handler4**will be called (or more commonly referred\
    \ to as handler for success cases), and it will be the result of the whole chain,\
    \ no matter if it resolves or rejects (即无论最终结果如何解决或拒绝，它都是整个链的结果).\n"
