    \ 1000);\n}catch(e) {\n  // 是错误还是超时？\n}\n```\n\n解决方案是添加第三个参数，作为超时拒绝的值。这样就可以区分不同的错误：\n\
    \n```javascript\nconst timeout = (prom, time, exception) => {\n  let timer;\n\
    \  return Promise.race([\n    prom,\n    new Promise((_r, rej) =>\n      timer\
