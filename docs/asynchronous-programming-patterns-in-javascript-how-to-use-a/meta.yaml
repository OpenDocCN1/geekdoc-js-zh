- img_proc: true
  md: "But a `filter` just does something entirely wrong:\n\n```\n// synchronous\n\
    [1, 2, 3, 4, 5].filter((i) => {\n  return i % 2 === 0;\n});\n// [2, 4]\n\n// asynchronous\n\
    [1, 2, 3, 4, 5].filter(async (i) => {\n  return i % 2 === 0;\n});\n// [1, 2, 3,\
    \ 4, 5]\n```\n\nBecause of this, async collection processing requires some effort,\
    \ and it's different depending on what kind of function you want to use. An async\
    \ `map` works markedly differently than an async `filter` or and async `reduce`.\n\
    \nIn this chapter, you'll learn how each of them works and how to efficiently\
    \ use them.\n\n# Async for iteration\n\nBut first, let's talk about `for` loops!\n\
    \nI don't like `for` loops as they tend to promote bad coding practices, like\
    \ nested loops that do a lot of things at once or `continue`/`break` statements\
    \ scattered around that quickly descend into an unmaintainable mess.\n\nAlso,\
    \ a more functional approach with functions like `map`/`filter`/`reduce` promote\
    \ a style where one function does only one thing and everything inside it is scoped\
    \ and stateless. And the functional approach is not only possible 99% of the time\
    \ but it comes with no perceivable performance drop and it also yields simpler\
    \ code (well, at least when you know the functions involved).\n\nBut async/await\
    \ is in the remaining 1%.\n\nFor loops have a distinctive feature, as they don't\
    \ rely on *calling* a function. In effect, you can use `await` inside the loop\
    \ and it will just work."
