    to this Promise.


    The `queue.then(() => fn(...args))` adds the function call to the queue and it
    saves its result in `res`. It will be resolved when *the current and all the previous
    calls are resolved*.


    The `queue = res.catch(() => {})` part makes sure that the queue won''t get stuck
    in rejection when one part of it is rejected.


    Wrapping the caching function with this serializer makes sure that a single refresh
    is run even for multiple calls:'
