  md: "```\nconst getPaginatedResults = async (fn) => {\n  const EMPTY = Symbol(\"\
    empty\");\n  const res = [];\n  for await (const lf of (async function*() {\n\
    \    let NextMarker = EMPTY;\n    while (NextMarker || NextMarker === EMPTY) {\n\
