  md: "# # The async disposer pattern\n\nA recurring pattern is to **run some initialization\
    \ code** to set up some resource or configuration, then use the thing, **and**\
    \ finally **do some cleanup**. It can be a global property, such as freezing the\
    \ time with [timekeeper](https://github.com/joyent/node-timekeeper), starting\
    \ a Chrome browser with Puppeteer, or creating a temp directory. In all these\
    \ cases, you need to make sure the modifications/resources are properly disposed\
    \ of, otherwise, they might spill out to other parts of the codebase.\n\nFor example,\
    \ this code creates a temp directory in the system tmpdir then when it's not needed\
    \ it deletes it. This can be useful when, for example, you want to use ffmpeg\
    \ to extract some frames from a video and need a directory to tell the `ffmpeg`\
    \ command to output the images to.\n\n```\n// create the temp directory\nconst\
    \ dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n);\ntry\
    \ {\n  // use the temp directory\n} finally {\n  // remove the directory\n  fs.rmdir(dir,\
    \ {recursive: true});\n}\n```\n\nA similar construct is `console.time` that needs\
    \ a `console.timeEnd` to output the time it took for a segment of the code to\
    \ run:\n\n```\nconsole.time(\"name\");\ntry {\n  // ...\n} finally {\n  console.timeEnd(\"\
    name\");\n}\n```\n\nOr when you launch a browser, you want to make sure it's closed\
    \ when it's not needed:"
  merge: -1
  pgno: 61
- img_proc: true
  md: "```\nconst browser = await puppeteer.launch({/* ... */});\ntry {\n  // use\
    \ browser\n} finally {\n  await browser.close();\n}\n```\n\nAll these cases share\
    \ the `try..finally` structure. Without it, **an error can jump over the cleanup\
    \ logic**, leaving the resource initialized (or the console timing still ticking):\n\
    \n```\nconst browser = await puppeteer.launch({/* ... */});\n\n// if there is\
    \ an error here the browser won't close!\n\nawait browser.close();\n```\n\nIn\
    \ other languages, such as Java, this is known as [try-with-resources](https://google.github.io/styleguide/javaguide.html#s6.2.2-try-with-resources-statements)\
    \ and it is built into the language. For example, the `BufferedReader` is closed\
    \ after the block:\n\n```\ntry (BufferedReader br = \n    new BufferedReader(new\
