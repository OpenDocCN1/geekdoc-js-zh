- md: "## Timing\n\nConcurrency has an interesting property when it comes to `reduce`.\
    \ In the synchronous version, elements are processed one-by-one, which is not\
    \ surprising as they rely on the *previous* result. But when an async `reduce`\
    \ is run, all the iteratee functions start running in parallel and wait for the\
    \ previous result (`await memo`) only when needed.\n\n## await memo last\n\nIn\
    \ the example above, all the `sleep`s happen in parallel, as the `await memo`,\
    \ which makes the function to wait for the previous one to finish, comes later.\n\
    \n```js\nconst arr = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\n\
    const asyncRes = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n \
    \ return (await memo) + e;\n}, 0);\n\nconsole.log(`Took ${new Date().getTime()\
    \ - startTime} ms`);\n// Took 11-13 ms\n```\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_92_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_92_0.png)\n\
    \n## await memo first\n\nBut when the `await memo` comes first, the functions\
    \ run sequentially:\n\n```js\nconst arr = [1, 2, 3];\n\nconst startTime = new\
    \ Date().getTime();\n\nconst asyncRes = await arr.reduce(async (memo, e) => {\n\
    \  await memo;\n  await sleep(10);\n  return (await memo) + e;\n}, 0);\n\nconsole.log(`Took\
    \ ${new Date().getTime() - startTime} ms`);\n// Took 36-38 ms\n```\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_93_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_93_0.png)\n\
    \n### Async reduce with \"await memo\" first\n\nThis behavior is usually not a\
    \ problem as it naturally means everything that is not dependent on the previous\
    \ result will be calculated immediately, and only the dependent parts are waiting\
    \ for the previous value.\n\n## When parallelism matters\n\nBut in some cases,\
    \ it might be unfeasible to do something ahead of time.\n\nFor example, I had\
    \ a piece of code that prints different PDFs and concatenates them into one single\
    \ file using the [pdf-lib](https://pdf-lib.js.org/) library.\n\nThis implementation\
    \ runs the resource-intensive `printPDF` function in parallel:\n\n```js\nconst\
    \ result = await printingPages.reduce(async (memo, page) => {\n  const pdf = await\
    \ PDFDocument.load(await printPDF(page));\n\n  const pdfDoc = await memo;\n\n\
    \  (await pdfDoc.copyPages(pdf, pdf.getPageIndices()))\n    .forEach((page) =>\
    \ pdfDoc.addPage(page));\n\n  return pdfDoc;\n\n}, PDFDocument.create());\n```\n\
    \nI noticed that when I have many pages to print, it would consume too much memory\
    \ and slow down the overall process.\n\nA simple change made the `printPDF` calls\
    \ wait for the previous one to finish:\n\n```js\nconst result = await printingPages.reduce(async\
    \ (memo, page) => {\n  const pdfDoc = await memo;\n\n  const pdf = await PDFDocument.load(await\
    \ printPDF(page));\n\n  (await pdfDoc.copyPages(pdf, pdf.getPageIndices()))\n\
    \    .forEach((page) => pdfDoc.addPage(page));\n\n  return pdfDoc;\n\n}, PDFDocument.create());\n\
    ```\n\n## Async functions with map\n\nThe `map` is the easiest and most common\
    \ collection function. It runs each element through an iteratee function and returns\
    \ an array with the results.\n\n### The synchronous version that adds one to each\
    \ element:\n\n```js\nconst arr = [1, 2, 3];\n\nconst syncRes = arr.map((i) =>\
    \ {\n  return i + 1;\n});\n\nconsole.log(syncRes);\n// 2,3,4\n```\n\nAn async\
    \ version needs to do two things. First, it needs to **map every item to a *Promise***\
    \ with the new value, which is what adding `async` before the function does.\n\
    \nAnd second, it needs to **wait for all the Promises** then **collect the results**\
    \ in an Array. Fortunately, the `Promise.all` built-in call is exactly what we\
    \ need for step 2.\n\nThis makes the general pattern of an async `map` to be `Promise.all(arr.map(async\
    \ (...) => ...))`.\n\nAn async implementation doing the same as the sync one:\n\
    \n```js\nconst arr = [1, 2, 3];\n\nconst asyncRes = await Promise.all(arr.map(async\
    \ (i) => {\n  await sleep(10);\n  return i + 1;\n}));\n\nconsole.log(asyncRes);\n\
    // 2,3,4\n```\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_95_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_95_0.png)\n\
    \n### **Concurrency**\n\nThe above implementation runs the iteratee function in\
    \ parallel for each element of the array. This is usually fine, but in some cases,\
    \ it might consume too many resources. This can happen when the async function\
    \ hits an API or consumes too much RAM that it's not feasible to run too many\
    \ at once.\n\nWhile an async `map` is easy to write, adding concurrency controls\
    \ is more involved. In the next few examples, we'll look into different solutions.\n\
    \n### **Batch processing**\n\nThe easiest way is to group elements and process\
    \ the groups one by one. This gives you control of the maximum amount of parallel\
    \ tasks that can run at once. But since one group has to finish before the next\
    \ one starts, the *slowest* element in each group becomes the limiting factor.\n\
    \n![img/bf8ff49d078976cf7c9fa8008bbb9b22_97_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_97_0.png)\n\
    \n#### Mapping in groups\n\nTo make groups, the example below uses the `groupBy`\
    \ implementation from [Underscore.js](https://underscorejs.org/). Many libraries\
    \ provide an implementation and they are mostly interchangeable. The exception\
    \ is Lodash, as its [`groupBy`](https://github.com/lodash/lodash/issues/1302)\
    \ does not pass the index of the item.\n\nIf you are not familiar with `groupBy`,\
    \ it runs each element through an iteratee function and returns an object with\
    \ the keys as the results and the values as lists of the elements that produced\
    \ that value.\n\nTo make groups of at most `n` elements, an iteratee `Math.floor(i\
    \ / n)` where `i` is the *index* of the element will do. As an example, a group\
    \ of size 3 will map the elements like this:\n- $0\\Rightarrow 0$\n- $1 \\Rightarrow\
    \ 0$\n- $2 \\Rightarrow 0$\n- $3 \\Rightarrow 1$\n- $4\\Rightarrow 1$\n- $5 \\\
    Rightarrow 1$\n- $6 \\Rightarrow 2$\n...\n\nIn Javascript:\n\n```js\nconst arr\
    \ = [30, 10, 20, 20, 15, 20, 10];\n\nconsole.log(\n  _.groupBy(arr, (_v, i) =>\
    \ Math.floor(i / 3))\n);\n// {\n//    0: [30, 10, 20],\n//    1: [20, 15, 20],\n\
    //    2: [10]\n// }\n```\n\nThe last group might be smaller than the others, but\
    \ all groups are guaranteed not to exceed the maximum group size.\n\nTo map one\
    \ group, the usual `Promise.all(group.map(...))` construct is fine.\n\nTo map\
    \ the groups sequentially, we need a reduce that concatenates the previous results\
    \ (`memo`) with the results of the current group:\n```js\nreturn Object.values(groups)\n\
    \  .reduce(async (memo, group) => [\n    ...(await memo),\n    ...(await Promise.all(group.map(iteratee)))\n\
    \  ], []);\n```\n\nThis implementation is based on the fact that the `await memo`,\
    \ which waits for the previous result, will be completed before moving on to the\
    \ next line.\n\n#### The full implementation that implements batching:\n\n```js\n\
    const arr = [30, 10, 20, 20, 15, 20, 10];\n\nconst mapInGroups = (arr, iteratee,\
    \ groupSize) => {\n  const groups = _.groupBy(arr, (_v, i) =>\n    Math.floor(i\
    \ / groupSize));\n\n  return Object.values(groups)\n    .reduce(async (memo, group)\
    \ => [\n      ...(await memo),\n      ...(await Promise.all(group.map(iteratee)))\n\
    \    ], []);\n};\n\nconst res = await mapInGroups(arr, async (v) => {\n  console.log(`S\
    \ ${v}`);\n  await sleep(v);\n  console.log(`F ${v}`);\n  return v + 1;\n}, 3);\n\
    \n// -- first batch --\n// S 30\n// S 10\n// S 20\n// F 10\n// F 20\n// F 30\n\
    // -- second batch --\n// S 20\n// S 15\n// S 20\n// F 15\n// F 20\n// F 20\n\
    // -- third batch --\n// S 10\n// F 10\n\nconsole.log(res);\n// 31,11,21,21,16,21,11\n\
    ```\n\n### Parallel processing\n\nAnother type of concurrency control is to run\
    \ at most n tasks in parallel, and start a new one whenever one is finished.\n\
    \n![img/bf8ff49d078976cf7c9fa8008bbb9b22_100_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_100_0.png)\n\
    \n- **Controlled concurrency**\n  I couldn't come up with a simple implementation\
    \ for this, but fortunately, the Bluebird library [provides one](link) out of\
    \ the box. This makes it straightforward, just import the library and use the\
    \ `Promise.map` function that has support for the `concurrency` option.\n\nIn\
    \ the example below the concurrency is limited to `2`, which means 2 tasks are\
    \ started immediately, then whenever one is finished, a new one is started until\
    \ there are none left:\n\n### **Sequential processing**\n\nSometimes any concurrency\
    \ is too much and the elements should be processed one after the other.\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_102_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_102_0.png)\n\
    \n#### Mapping sequentially\nA trivial implementation is to use Bluebird's Promise\
    \ with a concurrency of 1. But for this case, it does not warrant including a\
    \ library as a simple `reduce` would do the job:\n```js\nconst arr = [1, 2, 3];\n\
    \nconst res = await arr.reduce(async (memo, v) => {\n  const results = await memo;\n\
    \  console.log(`S ${v}`)\n  await sleep(10);\n  console.log(`F ${v}`);\n  return\
    \ [...results, v + 1];\n}, []);\n\n// S 1\n// F 1\n// S 2\n// F 2\n// S 3\n//\
    \ F 3\n\nconsole.log(res);\n// 2,3,4\n```\n\nMake sure to `await` the memo before\
    \ `await`-ing anything else, as without that it will still run concurrently!\n\
    \n## Async functions with forEach"
  mdcn: "\n## 时序\n\n并发在处理 **reduce** 时有一个有趣的属性。在同步版本中，元素是逐一处理的，这并不奇怪，因为它们依赖 *前一个*\
    \ 结果。但是当运行异步 `reduce` 时，所有的迭代函数会并行启动，仅在需要时才等待之前的结果（`await memo`）。\n\n## 最后 await\
    \ memo\n\n在上述示例中，所有的 `sleep` 调用都是并行执行的，因为作为后续步骤的 `await memo` 使得函数必须等待前一个任务完成后才继续。\n\
    \n```js\nconst arr = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\n\
    const asyncRes = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n \
    \ return (await memo) + e;\n}, 0);\n\nconsole.log(`Took ${new Date().getTime()\
    \ - startTime} ms`);\n// Took 11-13 ms\n```\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_92_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_92_0.png)\n\
    \n## 首先 await memo 的异步 reduce\n\n但是当 `await memo` 出现在前面时，函数会顺序执行：\n\n```js\nconst\
    \ arr = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\nconst asyncRes\
    \ = await arr.reduce(async (memo, e) => {\n  await memo;\n  await sleep(10);\n\
    \  return (await memo) + e;\n}, 0);\n\nconsole.log(`Took ${new Date().getTime()\
    \ - startTime} ms`);\n// Took 36-38 ms\n```\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_93_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_93_0.png)\n\
    \n### 带有“首先 await memo\"的异步 reduce\n\n这种行为通常不是问题，因为它意味着所有不依赖前一个结果的部分会立即计算，只有依赖部分在等待前一个值。\n\
    \n## 当并行性很重要时\n\n但在某些情况下，提前执行某些操作可能不可行。\n\n例如，我曾有一段代码使用 [pdf-lib](https://pdf-lib.js.org/)\
    \ 库打印不同的 PDF 并将它们合并成一个文件。\n\n此实现会并行运行资源密集的 `printPDF` 函数：\n\n```js\nconst result\
    \ = await printingPages.reduce(async (memo, page) => {\n  const pdf = await PDFDocument.load(await\
    \ printPDF(page));\n\n  const pdfDoc = await memo;\n\n  (await pdfDoc.copyPages(pdf,\
    \ pdf.getPageIndices()))\n    .forEach((page) => pdfDoc.addPage(page));\n\n  return\
    \ pdfDoc;\n\n}, PDFDocument.create());\n```\n\n我注意到，当我需要打印很多页面时，这会消耗太多内存并减缓整体进程。\n\
    \n一个简单的改动使得 `printPDF` 调用等待前一个任务完成：\n\n```js\nconst result = await printingPages.reduce(async\
    \ (memo, page) => {\n  const pdfDoc = await memo;\n\n  const pdf = await PDFDocument.load(await\
    \ printPDF(page));\n\n  (await pdfDoc.copyPages(pdf, pdf.getPageIndices()))\n\
    \    .forEach((page) => pdfDoc.addPage(page));\n\n  return pdfDoc;\n\n}, PDFDocument.create());\n\
    ```\n\n## 异步函数与 map\n\n`map` 是最简单且最常用的集合函数。它将每个元素通过迭代器函数运行，并返回包含结果的数组。\n\n###\
    \ 给每个元素加一的同步版本：\n\n```js\nconst arr = [1, 2, 3];\n\nconst syncRes = arr.map((i)\
    \ => {\n  return i + 1;\n});\n\nconsole.log(syncRes);\n// 2,3,4\n```\n\n异步版本需要做两件事。首先，它需要**将每项映射为一个*Promise***（即在新值之前添加\
    \ `async`）。\n\n其次，它需要**等待所有 Promise 完成**然后**收集结果**。幸运的是，内置的 `Promise.all` 调用正是第\
    \ 2 步所需的。\n\n这使得异步 `map` 的一般模式成为 `Promise.all(arr.map(async (...) => ...))`。\n\
    \n一个实现与同步版本相同异步实现的代码：\n\n```js\nconst arr = [1, 2, 3];\n\nconst asyncRes = await\
    \ Promise.all(arr.map(async (i) => {\n  await sleep(10);\n  return i + 1;\n}));\n\
    \nconsole.log(asyncRes);\n// 2,3,4\n```\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_95_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_95_0.png)\n\
    \n### **并发性**\n\n上述实现在数组的每个元素上并行运行迭代器函数。这通常没有问题，但在某些情况下可能会消耗太多资源。当异步函数遇到 API 或消耗过多\
    \ RAM 时就会发生这种情况，导致无法同时运行太多任务。\n\n虽然异步 `map` 易于编写，但添加并发控制更加复杂。在接下来的几个示例中，我们将探讨不同的解决方案。\n\
    \n### **批处理**\n\n最简单的方法是分组元素并逐个处理这些组。这可以控制一次运行的最大并行任务数量。但由于一组必须在下一组开始之前完成，因此每组中的\
    \ *最慢* 元素成为限制因素。\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_97_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_97_0.png)\n\
    \n#### 分组映射\n\n为了进行分组，下面的示例使用了来自 [Underscore.js](https://underscorejs.org/) 的\
    \ `groupBy` 实现。许多库都提供了类似实现，它们大多数是可以互换的。例外是 Lodash，因为它的 [`groupBy`](https://github.com/lodash/lodash/issues/1302)\
    \ 并不传递项的索引。\n\n如果您不熟悉 `groupBy`，它会对每个元素运行迭代器函数，并返回一个对象，其键为结果，值为产生该值的元素列表。\n\n\
    为了创建每组最多 `n` 个元素的组，迭代器 `Math.floor(i / n)`（其中 `i` 是元素的 *索引*）即可做到。例如，大小为 3 的组会像这样映射元素：\n\
    - $0\\Rightarrow 0$\n- $1 \\Rightarrow 0$\n- $2 \\Rightarrow 0$\n- $3 \\Rightarrow\
    \ 1$\n- $4\\Rightarrow 1$\n- $5 \\Rightarrow 1$\n- $6\\Rightarrow 2$\n...\n\n\
    在 JavaScript 中：\n\n```js\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconsole.log(\n\
    \  _.groupBy(arr, (_v, i) => Math.floor(i / 3))\n);\n// {\n//    0: [30, 10, 20],\n\
    //    1: [20, 15, 20],\n//    2: [10]\n// }\n```\n\n最后一组可能比其他组小，但所有组都保证不超过最大组大小。\n\
    \n要映射一组，通常的 `Promise.all(group.map(...))` 构造是没问题的。\n\n为了顺序映射这些组，我们需要一个将前一个结果（`memo`）与当前组的结果连接的\
    \ `reduce`：\n```js\nreturn Object.values(groups)\n  .reduce(async (memo, group)\
    \ => [\n    ...(await memo),\n    ...(await Promise.all(group.map(iteratee)))\n\
    \  ], []);\n```\n\n此实现基于这样一个事实：`await memo`（等待前一个结果）会在移动到下下一行之前完成。\n\n#### 实现了批处理的完整代码：\n\
    \n```js\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconst mapInGroups = (arr,\
    \ iteratee, groupSize) => {\n  const groups = _.groupBy(arr, (_v, i) =>\n    Math.floor(i\
    \ / groupSize));\n\n  return Object.values(groups)\n    .reduce(async (memo, group)\
    \ => [\n      ...(await memo),\n      ...(await Promise.all(group.map(iteratee)))\n\
    \    ], []);\n};\n\nconst res = await mapInGroups(arr, async (v) => {\n  console.log(`S\
    \ ${v}`);\n  await sleep(v);\n  console.log(`F ${v}`);\n  return v + 1;\n}, 3);\n\
    \n// -- first batch --\n// S 30\n// S 10\n// S 20\n// F 10\n// F 20\n// F 30\n\
    // -- second batch --\n// S 20\n// S 15\n// S 20\n// F 15\n// F 20\n// F 20\n\
    // -- third batch --\n// S 10\n// F 10\n\nconsole.log(res);\n// 31,11,21,21,16,21,11\n\
    ```\n\n### 并行处理\n\n另一种并发控制类型是并行运行最多 n 个任务，并在一个任务完成时启动一个新的任务。\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_100_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_100_0.png)\n\
    \n- **受控并发**\n  我无法想出简单的实现，但幸运的是，Bluebird 库 [提供了开箱即用的支持](link)。这使其变得非常直接，只需导入库并使用支持\
    \ `concurrency` 选项的 `Promise.map` 函数。\n\n在下面的示例中，并发限制为 `2`，这意味着立即启动 2 个任务，然后每当一个任务完成时，就会启动一个新任务，直到没有剩余：\n\
    \n### **顺序处理**\n\n有时任何并发都太多了，元素应该按顺序处理一个接一个。\n\n![img/bf8ff49d078976cf7c9fa8008bbb9b22_102_0.png](img/bf8ff49d078976cf7c9fa8008bbb9b22_102_0.png)\n\
    \n#### 顺序映射\n一个简单的实现是使用 Bluebird 的 Promise，并发数为 1。但对于这种情况，并不值得包含一个库，因为简单的 `reduce`\
    \ 就可以完成工作：\n```js\nconst arr = [1, 2, 3];\n\nconst res = await arr.reduce(async\
    \ (memo, v) => {\n  const results = await memo;\n  console.log(`S ${v}`)\n  await\
    \ sleep(10);\n  console.log(`F ${v}`);\n  return [...results, v + 1];\n}, []);\n\
    \n// S 1\n// F 1\n// S 2\n// F 2\n// S 3\n// F 3\n\nconsole.log(res);\n// 2,3,4\n\
    ```\n\n请务必在 `await` 其他内容之前先 `await` `memo`，否则它将仍然并发运行！\n\n## 与异步函数配合使用的 forEach\n"
