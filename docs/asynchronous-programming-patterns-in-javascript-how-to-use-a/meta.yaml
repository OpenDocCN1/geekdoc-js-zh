    \n## 并行处理\n\n短路实现在资源使用方面是高效的，因为它按顺序处理元素，但这可能导致更长的执行时间。\n\n例如，如果迭代器通过网络发送请求，一次发送一个可能需要一些时间。另一方面，同时发送所有请求可能更快，尽管这可能导致更多的请求被发送。\n\
    \n## 常见错误\n\n### 未传播错误\n\n当将回调转换为 Promise 时，确保你也处理了错误情况。否则，Promise 永远不会被解析，`await`\
    \ 会永远等待。\n\n例如，`gapi.load` 为结果和错误提供了单独的回调：\n\n```\nawait new Promise((res, rej)\
    \ => {\n  gapi.load(\"client:auth2\", {callback: res, onerror: rej});\n});\n```\n\
    \n如果你没有将 `rej` 回调附加到 `onerror` 处理器，错误将不会通过链传播。这会导致难以调试的问题和“突然停止”的组件。\n\n### 在\
    \ try..catch 中缺少 await\n\n在 async 函数中使用 `try..catch` 或 `try..finally` 时，确保你也使用了\
    \ `await`。例如，当内部 Promise 解析时，这段代码工作正常：\n\n```\nconst fn = async () => {\n  return\
    \ \"result\";\n}\n\nconst outer = async () => {\n  try {\n    return fn(); //\
    \ <= 缺少 await！\n  }catch(e) {\n    console.log(e.message);\n  }\n}\n\nawait outer();\
    \ // result\n```\n\n但 `try..catch` 不会处理异常：\n\n```\nconst fn = async () => {\n\
    \  throw new Error(\"error\");\n}\n\nconst outer = async () => {\n  try {\n  \
    \  return fn(); // <= 缺少 await！\n  }catch(e) {\n    console.log(e.message);\n\
    \  }\n}\n\nawait outer();\n// 抛出异常！\n```\n\n这是因为异常是从 `await` 抛出的，虽然从 async 函数返回\
    \ Promise 会展平结果，但它会在不等待它的情况下返回。由于没有等待，异常不会在 `try..catch` 中抛出，而是在调用者使用 `await`\
    \ 时抛出。\n\n```\nconst fn = async () => {\n  throw new Error(\"error\");\n}\n\n\
    const outer = async () => {\n  try {\n    return await fn();\n  }catch(e) {\n\
    \    console.log(e.message); // error\n  }\n}\n\nawait outer();\n// 这里没有异常\n```\n\
    \n### 未检查返回值\n\n当 Promise 解析时，不一定意味着一切都正常。例如，`fetch` 在*连接*出现问题时会拒绝，但即使响应状态返回错误，它也会解析。\n\
    \n当调用无法建立连接时，Promise 会拒绝：\n\n```\ntry {\n  await fetch(\"http://example.com\"\
