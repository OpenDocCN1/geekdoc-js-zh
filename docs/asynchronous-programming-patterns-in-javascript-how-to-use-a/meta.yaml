- md: "## util.promisify\n\nWhile the Promise constructor offers a universal way to\
    \ transform callbacks to Promises, when the callback pattern follows the Node-style\
    \ there is an easier way. The `util.promisify` gets the callback-based function\
    \ and returns a promisified version.\n\n```javascript\nimport util from \"util\"\
    ;\n\nconst promisifiedGetUser = util.promisify(getUser);\n\nconst user = await\
    \ promisifiedGetUser(15);\n// user is the result object\n```\n\nWhen the promisified\
    \ function is called, the callback argument is added automatically and it also\
    \ converts the result (or error) to the return value of the Promise.\n\nHow it\
    \ works is no magic though. It uses the Promise constructor pattern we've discussed\
    \ above, and uses the spread syntax to allow arbitrary amount of arguments. A\
    \ simplified implementation looks like this:\n\n```javascript\nconst promisify\
    \ = (fn) => (...args) =>\n  new Promise((res, rej) => {\n    fn(...args, (err,\
    \ result) => {\n      if (err) {\n        rej(err);\n      } else {\n        res(result);\n\
    \      }\n    });\n  });\n```\n\n## Usual problems\n\n### Handle this\n\nThe value\
    \ of `this` is complicated in Javascript. It can get different values depending\
    \ on how you call a function.\n\nFor example, classes can have instance variables,\
    \ attached to `this`:\n\n```javascript\nclass C {\n  constructor() {\n    this.var\
    \ = \"var\";\n  }\n  fn() {\n    console.log(this.var);\n  }\n}\n```\n\nBut when\
    \ you have an object of this class, whether you call this function directly on\
    \ the object or extract it to another variable makes a difference in the value\
    \ of `this`:\n\n```javascript\nnew C().fn(); // var\n\nlet fn = new C().fn;\n\
    fn(); // TypeError: Cannot read property 'var' of undefined\n```\n\nThis affects\
    \ how to promisify the methods of this object as the `util.promisify` requires\
    \ just the function and not the whole object. Which, in turn, breaks `this`.\n\
    \nFor example, let's say there is a Database object that creates a connection\
    \ in its constructor then it offers methods to send queries:\n\n```javascript\n\
    class Database {\n  constructor() {\n    this.connection = \"database connection\"\
    ;\n  }\n  getUser(id, cb) {\n    if (!this.connection) {\n      throw new Error(\"\
    No connection\");\n    }\n    setTimeout(() => {\n      if (id >= 0) {\n     \
    \   cb(null, `user: ${id}`);\n      } else {\n        cb(new Error(\"id must be\
    \ positive\"));\n      }\n    }, 100);\n  }\n}\n\nconst database = new Database();\n\
    database.getUser(15, (error, user) => {\n  // handle error or user\n})\n```\n\n\
    Using `util.promisify` would break the `getUser` function as it changes the value\
    \ of `this`:\n\n```javascript\nconst promisifiedDatabaseGetUser =\n  util.promisify(database.getUser);\n\
    await promisifiedDatabaseGetUser(15);\n// Error: Cannot read property 'connection'\
    \ of undefined\n```\n\nTo solve this, you can bind the object to the function,\
