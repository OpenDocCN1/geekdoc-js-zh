  md: "# Collection processing with async functions\n\nWhile async/await is great\
    \ to make async *commands* look like synchronous ones, collection processing is\
    \ not that simple. It's not just adding an `async` before the function passed\
    \ to `Array.reduce` and it will magically work correctly. But without async functions,\
    \ you can not use `await` and provide a result *later* which is required for things\
    \ like reading a database, making network connections, reading files, and a whole\
    \ bunch of other things.\n\nLet's see some examples!\n\nWhen all the functions\
    \ you need to use are synchronous, it's easy. For example, a string can be doubled\
    \ without any asynchronicity involved:\n\n```\nconst double = (str) => {\n  return\
    \ str + str;\n};\n\ndouble(\"abc\");\n// abcabc\n```\n\nIf the function is async,\
    \ it's also easy for a single item using `await`. For example, to calculate the\
    \ SHA-256 hash, Javascript provides a `digest()` async function:"
  merge: -1
  pgno: 85
- img_proc: true
  md: "```\n// https://developer.mozilla.org/docs/Web/API/SubtleCrypto/digest\nconst\
    \ digestMessage = async (message) => {\n  const msgUint8 = new TextEncoder().encode(message);\n\
    \  const hashBuffer =\n    await crypto.subtle.digest(\"SHA-256\", msgUint8);\n\
    \  const hashArray = Array.from(new Uint8Array(hashBuffer));\n  const hashHex\
    \ = hashArray\n    .map(b => b.toString(16).padStart(2, \"0\"))\n    .join('');\n\
    \  return hashHex;\n};\n\nawait digestMessage(\"msg\");\n// e46b320165eec91e6344fa1034...\n\
    ```\n\nThis looks almost identical to the previous call, the only difference is\
    \ an `await`.\n\nBut for collections, handling asynchronicity becomes different.\n\
    \nTo calculate the double for each element in a **collection of strings** is simple\
    \ with a `map`:\n\n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nstrings.map(double);\n\
    // [\"msg1msg1\", \"msg2msg2\", \"msg3msg3\"]\n```\n\nBut to calculate the **hash**\
    \ of each string in a collection, it does not work:\n\n```\nconst strings = [\"\
    msg1\", \"msg2\", \"msg3\"];\n\nawait strings.map(digestMessage);\n// [object\
    \ Promise],[object Promise],[object Promise]\n```\n\nThis is an everyday problem\
    \ as async functions make a bigger category than synchronous ones. A sync function\
    \ can work in an async environment, but an async one can not be converted to work\
    \ in a synchronous way.\n\nFor a more realistic scenario, querying a database\
    \ is inherently async as it needs to make network connections. To get the score\
    \ for a single `userId` from a hypothetical database is simple:"
  merge: -1
  pgno: 86
- img_proc: true
  md: "```\nconst getUserObject = async (id) => {\n  // get user by id\n};\n\nconst\
    \ userId = 15;\nconst userObject = await getUserObject(userId);\nconst userScore\
    \ = userObject.score;\n```\n\nBut how to query the database for a *collection*\
