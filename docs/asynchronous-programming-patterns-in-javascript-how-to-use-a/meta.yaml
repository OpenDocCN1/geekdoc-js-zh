  md: "But that requires *collaboration between the calls*, and that is not always\
    \ possible. For example, when the function is called in response to multiple types\
    \ of events, `await` is not possible to coordinate between them:\n\n```\ndocument.querySelector(\"\
    #btn\").addEventListener(\"click\", () => {\n    fn();\n})\n\nwindow.addEventListener(\"\
    message\",  => {\n    fn();\n});\n```\n\nIn this case, the function call must\
    \ do the coordination.\n\n# A general-purpose solution\n\nThe solution is to keep\
    \ a queue of Promises that chains them one after the other. It is just a few lines\
    \ of code and it is general purpose, allowing any function be serialized:\n\n\
    ```\nconst serialize = (fn) => {\n  let queue = Promise.resolve();\n  return (...args)\
    \ => {\n    const res = queue.then(() => fn(...args));\n    queue = res.catch(()\
    \ => {});\n    return res;\n  };\n};\n```"
