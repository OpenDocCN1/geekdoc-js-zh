- img_proc: true
  md: "Now if there is an error during the load process the `rej` function is called\
    \ and the `await` throws an error.\n\n> **Note**\n\nHow the underlying function\
    \ signals results and errors can vary from library-to-library. You'll learn more\
    \ about it in the [Callback styles](https://example.com) chapter.\n\n# Error propagation\
    \ in Promise chains\n\nWhile async functions use the same `try..catch` structure\
    \ as normal functions, Promise chains work differently. The `then` callback gets\
    \ an additional callback, one that is called when a previous Promise is rejected:\n\
    \n```\nconst rejectedPromise = new Promise((res, rej) => {\n  rej(new Error(\"\
    rejected\"));\n});\n\nrejectedPromise.then(undefined, (error) => {\n  // error\
    \ = \"rejected\"\n  // handle error\n});\n```\n\nErrors in Promise chains move\
    \ to the next error handler, skipping all previous steps. This makes it easy to\
    \ collect errors from multiple steps and handle them in a single place:\n\n```\n\
    getUser()\n  .then(getPermissionsForUser)\n  .then(checkPermission)\n  .then((allowed)\
    \ => {\n    // handle allowed or not\n  }).then(undefined, (error) => {\n    //\
    \ there was an error in one of the previous steps\n  });\n```"
