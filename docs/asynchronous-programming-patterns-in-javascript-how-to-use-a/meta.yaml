    badCachingFunction();\nbadCachingFunction();\n// refreshing\n// refreshing\n```\n\
    \nThe correct way to handle this is to **make the second function wait for the\
    \ refresh process** without starting a separate one.\n\nOne way to do this is\
    \ to **serialize the calls** to the caching function. This makes *every* function\
    \ to wait for all the previous ones to finish, so multiple calls only trigger\
    \ a single refresh process.\n\nThis can be done in a variety of ways, but the\
    \ easiest one is to make the functions run one after the other. In this case,\
    \ when one needs to refresh the value, the other ones will wait for it to finish\
    \ and won't start their own jobs.\n\nAnother use-case I needed a solution like\
    \ this is when backendcko calls needed a token and that token expired after some\
    \ time. When a call hit an Unauthorized error, it refreshed the token and used\
    \ the new one to retry. Other backend calls needed to wait for the new token before\
    \ they could be run. In this case, it wasn't just performance-related as a new\
    \ token invalidated all the old ones.\n\n## Why await is not a solution\n\nThe\
    \ trivial solution is to use `await` that achieves serialization easily. After\
    \ all, that's what that keyword is for.\n\n```\nawait badCachingFunction();\n\
