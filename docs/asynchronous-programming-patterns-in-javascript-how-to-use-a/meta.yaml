  md: "# # The async serializer pattern\n\nLet's say you have a function that does\
    \ some calculation but only if it hasn't been done recently, effectively caching\
    \ the result for a short amount of time. In this case, **subsequent calls to the\
    \ function affect each other**, as when there is a refresh all of them need to\
    \ wait for it. An implementation that does not take concurrency into account can\
    \ potentially run the refresh several times in parallel when the cache expires.\n\
    \n# ### This implementation is broken:\n\n```\n// returns a function that caches\
    \ its result for 2 seconds\n// broken, don't use it\nconst badCachingFunction\
    \ = (() => {\n\tconst cacheTime = 2000;\n\tlet lastRefreshed = undefined;\n\t\
    let lastResult = undefined;\n\treturn async () => {\n\t\tconst currentTime = new\
    \ Date().getTime();\n\t\t// check if cache is fresh enough\n\t\tif (lastResult\
    \ === undefined ||\n\t\t\tlastRefreshed + cacheTime < currentTime) {\n\t\t\t//\
    \ refresh the value\n\t\t\tlastResult = await refresh();\n\t\t\tlastRefreshed\
    \ = currentTime;\n\t\t}\n\t\treturn lastResult;\n\t}\n})();\n```\n\nWhen two concurrent\
    \ calls come when the function needs to refresh the value, the refresh function\
    \ is called twice:"
  merge: -1
  pgno: 56
- img_proc: true
  md: "```\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst\
    \ refresh = async () => {\n  console.log(\"refreshing\")\n  await wait(1000);\n\
    };\n\nconst badCachingFunction = ...;\n\nbadCachingFunction();\nbadCachingFunction();\n\
    // refreshing\n// refreshing\n```\n\nThe correct way to handle this is to **make\
    \ the second function wait for the refresh process** without starting a separate\
    \ one.\n\nOne way to do this is to **serialize the calls** to the caching function.\
    \ This makes *every* function to wait for all the previous ones to finish, so\
    \ multiple calls only trigger a single refresh process.\n\nThis can be done in\
    \ a variety of ways, but the easiest one is to make the functions run one after\
    \ the other. In this case, when one needs to refresh the value, the other ones\
    \ will wait for it to finish and won't start their own jobs.\n\nAnother use-case\
    \ I needed a solution like this is when backend calls needed a token and that\
    \ token expired after some time. When a call hit an Unauthorized error, it refreshed\
    \ the token and used the new one to retry. Other backend calls needed to wait\
    \ for the new token before they could be run. In this case, it wasn't just performance-related\
    \ as a new token invalidated all the old ones.\n\n# Why await is not a solution\n\
    \nThe trivial solution is to use `await` that achieves serialization easily. After\
    \ all, that's what that keyword is for.\n\n```\nawait badCachingFunction();\n\
    badCachingFunction();\n// refreshing\n```"
  merge: -1
