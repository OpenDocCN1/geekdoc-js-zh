    # # Parallel and sequential processing


    When you use `await` in an async function, it stops the execution until the Promise
    is resolved. This makes each line wait for the previous, which yields a code that
    looks almost like a synchronous one:


    ```

    await s3.copyObject({...}).promise();

    await s3.deleteObject({...}).promise();

    ```


    The above code copies an object, then it deletes one. In case you wanted to *move*
    the object, it is the desirable chain of events as you want the copy operation
    to finish before deleting the original.


    # ## Parallel processing with Promise.all


    But what if there is an unrelated call, such as an update to a database?


    ```

    await s3.copyObject({...}).promise();

    await s3.deleteObject({...}).promise();

    await dynamodb.updateItem({...}).promise();

    ```


    While the `dynamodb.updateItem` has nothing to do with the S3 object, it still
    waits for the move operation (copy + delete) to finish. This makes the overall
    process longer than necessary.'
