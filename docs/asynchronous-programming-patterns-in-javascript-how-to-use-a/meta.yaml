- md: "## Async Programming Patterns in JavaScript\n\n### How to Use Async/Await and\
    \ Promises to Solve Programming Problems\n\n**Tamás Sallai**\n\n## Introduction\n\
    \nAsynchronous programming is everywhere in Javascript. This is the result of\
    \ the fundamental choices that define how it works. In other languages, you can\
    \ use multiple threads and that allows synchronous waiting, a crucial feature\
    \ missing from Javascript. It is by design single-threaded and a wait operation\
    \ stops everything, just think of the case where a long calculation freezes the\
    \ UI.\n\nWithout a way to wait for a later result synchronously, Javascript needs\
    \ to use callbacks. Even simple things like waiting for a given duration requires\
    \ a function that will be run when the time is up:\n\n```javascript\nsetTimeout(()\
    \ => {\n  console.log(\"1 second passed!\");\n}, 1000);\n```\n\nYou can find this\
    \ pattern everywhere, as most of the things are asynchronous in nature. Using\
    \ `fetch` to make an HTTP call to a server is an async operation. Just like getting\
    \ information about the available cameras and microphones with the `getUserMedia`\
    \ call, as it needs to get permission from the user. Same with reading and writing\
    \ files. While these have synchronous versions for now, they are terrible for\
    \ performance. Or want to do some web scraping with Puppeteer? Every single instruction\
    \ is asynchronous as all of them communicate with a remote process. Or for backend\
    \ applications, reading or writing data to a database is also inherently async.\n\
    \nAnd not only that some functions are async but all the other functions that\
    \ call them need to be async too. A piece of functionality that requires making\
    \ a network call, for example, is asynchronous, no matter how insignificant that\
    \ call is compared to what other things the function is doing. Because of this,\
    \ almost all Javascript applications consist of mostly asynchronous operations.\n\
    \nOver the years, the language got a lot of features that make writing async code\
    \ easier. Gone are the days of the so-called callback hell where a series of callback-based\
    \ async calls made the program's structure very hard to understand and easy to\
    \ inadvertently silence errors.\n\nFirst, Promises gained widespread support,\
    \ flattening the structure of callbacks. Then async/await became the mainstream\
    \ way of async programming, hiding a lot of the complexities of asynchronicity\
    \ behind only two keywords: `async` and `await`.\n\nThis improved readability\
    \ and made it a lot easier for new programmers to write asynchronous code. Modern\
    \ Javascript is still using the same single-threaded no-sync-wait event loop,\
    \ but the program structure reflects that of a modern language.\n\nBut asynchronous\
    \ programming is inherently hard. While the language helps with the syntax to\
    \ make understanding and writing code easier, asynchronicity introduces a lot\
    \ of potential errors, most of them so subtle they only occur in special circumstances.\n\
    \nEven though I've been working for many years with asynchronous code, some of\
    \ the problems in this book took me a week to reach a solution I'm happy with.\
    \ My goal with this book is that you'll have an easier time when you encounter\
    \ similar problems by knowing what are the hard parts. This way you won't need\
    \ to start from zero but you'll have a good idea of what are the roadblocks and\
    \ the best practices.\n\nYou'll notice that error handling is a recurring topic\
    \ in this book. This is because it is an often overlooked concept and that leads\
    \ to code that easily breaks. By knowing how errors in async functions and Promises\
    \ work you'll write safer programs.\n\n## Structure\n\nThis book is divided into\
    \ two parts.\n\nThe first chapter, [Getting started with async/await](url), is\
    \ an introduction to async/await and Promises and how each piece of the async\
    \ puzzle fit together. The primary focus is async functions as they are the mainstream\
    \ way to program asynchronously in Javascript. But async/await is a kind of magic\
    \ without knowing about Promises, so you'll learn about them too.\n\nBy the end\
    \ of the first chapter, you'll have a good understanding of how to use async functions\
    \ and how they work under the hood.\n\nThe second part of the book consists of\
    \ several common programming tasks and problems. You'll learn when that particular\
    \ problem is important, how to solve it, and what are the edge cases. This gives\
    \ you a complete picture so that when you encounter a similar problem you'll know\
    \ how to approach it.\n\nThis book is not meant to be read from cover to cover\
    \ but to be used as a reference guide. With the patterns described in this book,\
    \ my hope is that you'll see the underlying difficulty with async programming\
    \ so when you work on your own solutions you'll know the pitfalls and best practices\
    \ so you'll end up with more reliable code.\n\n## Getting started with async/await\n\
    \nIn this chapter, we start with an introduction to asynchronous programming in\
    \ Javascript. The main focus is async functions, as you'll likely use them more\
    \ often, but you'll also learn how Promises work.\n\n## Async functions\n\nNormal\
    \ functions return a result with the `return` keyword:\n\n```javascript\nconst\
    \ fn = () => {\n  return 5;\n}\n\nfn();\n// 5\n```\n\nAsync functions, in contrast,\
    \ return a `Promise`:\n\n```javascript\nconst asyncFn = async () => {\n  return\
    \ 5;\n}\n\nasyncFn();\n// Promise\n```\n\nYou can make any function async with\
    \ the `async` keyword, and there are a lot of functions that return a Promise\
    \ instead of a result.\n\nFor example, to read a file from the filesystem, you\
    \ can use `fs.promises`, a variant of the `fs` functions returning Promises:\n\
    \n```javascript\nconst fs = require(\"fs\");\n\nfs.promises.readFile(\"test.js\"\
    );\n// Promise\n```\n\nOr convert an image to jpeg with the [sharp](link) library,\
    \ which also returns a Promise:\n\n```javascript\nconst sharp = require(\"sharp\"\
    );\n\nsharp(\"image.png\")\n  .jpeg()\n  .toFile(\"image.jpg\");\n// Promise\n\
    ```\n\nOr make a network request with `fetch`:\n\n```javascript\nfetch(\"https://advancedweb.hu\"\
    );\n// Promise\n```\n\n## How to use the Promise\n\nAn async function still has\
    \ a return value, and the Promise holds this result. To get access to the value,\
    \ **attach a callback** using the `then()` function. This callback will be called\
    \ with the result of the function.\n\nTo get the file contents after the `readFile`:\n\
    \n```javascript\nconst fs = require(\"fs\");\n\nfs.promises.readFile(\"test.js\"\
    ).then((result) => {\n  console.log(result);\n  // Buffer\n});\n```\n\nSimilarly,\
    \ to get the result of our simple async function, use `then()`:\n\n```javascript\n\
    const asyncFn = async () => {\n  return 5;\n}\n\nasyncFn().then((res) => {\n \
    \ console.log(res);\n  // 5\n});\n```\n\n## The benefits of Promises\n\nBut why\
    \ complicate a function call with Promises? A normal function just returns a value\
    \ that can be used on the next line, without the need for any callbacks.\n\nThe\
    \ benefit of returning a Promise instead of a value is that the **result might\
    \ not be ready by the time the function returns**. The callback can be called\
    \ much later, but the function must return immediately. This extends what a function\
    \ can do.\n\n```javascript\n// sync\nfn();\n// result is ready\n\n// async\nasyncFn().then(()\
    \ => {\n    // result is ready\n})\n// result is pending\n```\n\nIn many cases,\
    \ a synchronous result is not possible. For example, making a network request\
    \ takes forever compared to a function call. With Promises, it does not matter\
    \ if something takes a lot of time or produces a result immediately. In both cases,\
    \ the `then()` function will be called when the result is ready.\n\nAn async function\
    \ returns a Promise\n\n> Recap\n\nAsync functions return Promises which are values\
    \ that are available sometime in the future.\n\n## The await keyword\n\nUsing\
    \ Promises with callbacks requires changes to the code structure and it makes\
    \ the code harder to read.\n\nInstead of a flat structure of synchronous function\
    \ calls:\n\n```javascript\nconst user = getUser();\nconst permissions = getPermissions();\n\
    const hasAccess = checkPermissions(user, permissions);\nif (hasAccess) {\n  //\
    \ handle request\n}\n```\n\nPromises need callbacks:\n\n```javascript\ngetUser().then((user)\
    \ => {\n  getPermissions().then((permissions) => {\n    const hasAccess = checkPermissions(user,\
    \ permissions);\n    if (hasAccess) {\n      // handle request\n    }\n  });\n\
    });\n```"
  mdcn: "\n## JavaScript 中的异步编程模式\n\n### 如何使用 Async/Await 和 Promise 解决编程问题\n\n**Tamás\
    \ Sallai**\n\n## 引言\n\n异步编程在 Javascript 中无处不在。这是定义其工作方式的根本选择所导致的结果。在其他语言中，你可以使用多线程，这允许同步等待——这是\
    \ Javascript 缺失的一个关键特性。Javascript 设计上就是单线程的，等待操作会停止一切，想象一下长时间计算冻结 UI 的情况。\n\n\
    由于没有同步等待后续结果的方法，Javascript 需要使用回调。即使是等待一段给定时间这样简单的事情，也需要一个在时间到达时运行的函数：\n\n```javascript\n\
    setTimeout(() => {\n  console.log(\"1 second passed!\");\n}, 1000);\n```\n\n这种模式随处可见，因为大多数东西本质上都是异步的。使用\
    \ `fetch` 向服务器发起 HTTP 调用是一个异步操作。就像使用 `getUserMedia` 调用获取可用摄像头和麦克风信息一样，因为它需要获得用户的许可。读写文件也是如此。虽然它们目前有同步版本，但性能很差。或者想用\
    \ Puppeteer 做一些网络爬虫？每一条指令都是异步的，因为它们都与远程进程通信。对于后端应用程序，读写数据库数据本质上也是异步的。\n\n不仅某些函数是异步的，调用它们的所有其他函数也需要是异步的。例如，一段需要进行网络调用的功能，无论该调用与函数正在做的其他事情相比多么微不足道，它都是异步的。正因为如此，几乎所有的\
    \ Javascript 应用程序都主要由异步操作组成。\n\n多年来，该语言获得了许多使编写异步代码更容易的特性。所谓的“回调地狱”时代已经过去，在那里一系列基于回调的异步调用使得程序结构难以理解，并且容易无意中静默错误。\n\
    \n首先，Promise 获得了广泛支持，扁平化了回调的结构。然后，async/await 成为主流的异步编程方式，将异步的许多复杂性隐藏在仅两个关键字后面：`async`\
    \ 和 `await`。\n\n这提高了可读性，并让新程序员编写异步代码变得容易得多。现代 Javascript 仍然使用相同的单线程、无同步等待的事件循环，但程序结构反映了现代语言的特点。\n\
    \n但异步编程本质上是困难的。虽然语言提供了语法来帮助理解和编写代码，但异步性引入了许多潜在错误，其中大多数非常微妙，只在特殊情况下才会发生。\n\n尽管我多年来一直在处理异步代码，但本书中的某些问题花了我一周时间才找到满意的解决方案。我写这本书的目标是，通过了解难点所在，当你在遇到类似问题时能更轻松一些。这样，你就不需要从零开始，而是能很好地了解障碍和最佳实践。\n\
    \n你会注意到错误处理是本书中反复出现的主题。这是因为这是一个经常被忽视的概念，导致代码容易崩溃。通过了解异步函数和 Promise 中的错误是如何工作的，你将编写出更安全的程序。\n\
    \n## 结构\n\n本书分为两部分。\n\n第一章，[Async/Await 入门](url)，是关于 async/await 和 Promise 的介绍，以及异步拼图的每个部分如何契合在一起。主要关注点是异步函数，因为它们是在\
    \ Javascript 中进行异步编程的主流方式。但如果不了解 Promise，async/await 就像一种魔法，所以你也会学习它们。\n\n在第一章结束时，你将很好地理解如何使用异步函数以及它们在底层是如何工作的。\n\
    \n本书的第二部分包含几个常见的编程任务和问题。你将了解该特定问题何时重要，如何解决它，以及边缘情况是什么。这为你提供了一个完整的画面，以便当你遇到类似问题时知道如何处理。\n\
    \n本书并非意在从头到尾阅读，而是用作参考指南。通过本书中描述的模式，我希望你能看到异步编程的底层困难，这样当你在开发自己的解决方案时，你将了解陷阱和最佳实践，从而最终编写出更可靠的代码。\n\
    \n## Async/Await 入门\n\n在本章中，我们将从 Javascript 异步编程的介绍开始。主要关注异步函数，因为你可能会更频繁地使用它们，但你也会学习\
    \ Promise 是如何工作的。\n\n## 异步函数\n\n普通函数使用 `return` 关键字返回结果：\n\n```javascript\nconst\
    \ fn = () => {\n  return 5;\n}\n\nfn();\n// 5\n```\n\n相比之下，异步函数返回一个 `Promise`：\n\
    \n```javascript\nconst asyncFn = async () => {\n  return 5;\n}\n\nasyncFn();\n\
    // Promise\n```\n\n你可以使用 `async` 关键字使任何函数成为异步函数，而且有很多函数返回 Promise 而不是结果。\n\n例如，要从文件系统读取文件，你可以使用\
    \ `fs.promises`，这是返回 Promise 的 `fs` 函数的变体：\n\n```javascript\nconst fs = require(\"\
    fs\");\n\nfs.promises.readFile(\"test.js\");\n// Promise\n```\n\n或者使用 [sharp](link)\
    \ 库将图像转换为 jpeg，该库也返回 Promise：\n\n```javascript\nconst sharp = require(\"sharp\"\
    );\n\nsharp(\"image.png\")\n  .jpeg()\n  .toFile(\"image.jpg\");\n// Promise\n\
    ```\n\n或者使用 `fetch` 发起网络请求：\n\n```javascript\nfetch(\"https://advancedweb.hu\"\
    );\n// Promise\n```\n\n## 如何使用 Promise\n\n异步函数仍然有返回值，Promise 保存着这个结果。要访问该值，请使用\
    \ `then()` 函数**附加一个回调**。此回调将使用函数的结果进行调用。\n\n在 `readFile` 之后获取文件内容：\n\n```javascript\n\
    const fs = require(\"fs\");\n\nfs.promises.readFile(\"test.js\").then((result)\
    \ => {\n  console.log(result);\n  // Buffer\n});\n```\n\n类似地，要获取我们简单异步函数的结果，使用\
    \ `then()`：\n\n```javascript\nconst asyncFn = async () => {\n  return 5;\n}\n\n\
    asyncFn().then((res) => {\n  console.log(res);\n  // 5\n});\n```\n\n## Promise\
    \ 的好处\n\n但为什么要用 Promise 使函数调用复杂化呢？普通函数只需返回一个值，该值可以在下一行使用，无需任何回调。\n\n返回 Promise\
    \ 而不是值的好处是，**结果在函数返回时可能尚未就绪**。回调可以稍后被调用，但函数必须立即返回。这扩展了函数的功能。\n\n```javascript\n\
    // sync\nfn();\n// result is ready\n\n// async\nasyncFn().then(() => {\n    //\
    \ result is ready\n})\n// result is pending\n```\n\n在许多情况下，同步结果是不可能的。例如，发起网络请求与函数调用相比需要很长时间。使用\
    \ Promise，无论某件事是耗时很长还是立即产生结果，都没有关系。在这两种情况下，当结果就绪时，`then()` 函数都会被调用。\n\n异步函数返回一个\
    \ Promise\n\n> 回顾\n\n异步函数返回 Promise，它们是未来某个时候可用的值。\n\n## await 关键字\n\n使用带回调的 Promise\
    \ 需要更改代码结构，并且使代码更难阅读。\n\n而不是同步函数调用的扁平结构：\n\n```javascript\nconst user = getUser();\n\
    const permissions = getPermissions();\nconst hasAccess = checkPermissions(user,\
    \ permissions);\nif (hasAccess) {\n  // handle request\n}\n```\n\nPromise 需要回调：\n\
    \n```javascript\ngetUser().then((user) => {\n  getPermissions().then((permissions)\
    \ => {\n    const hasAccess = checkPermissions(user, permissions);\n    if (hasAccess)\
    \ {\n      // handle request\n    }\n  });\n});\n```\n"
