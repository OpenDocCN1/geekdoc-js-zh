  md: "# ## Result value\n\nThe examples above all used the Promise `res` function\
    \ to signal when an async operation is ready and did not produce any value. To\
    \ also return a value, **pass it to the `res` call.**\n\n```\nconst value = new\
    \ Promise((res) => {\n  res(5);\n});\n// 5\n```\n\nA more complicated example,\
    \ the next Promise shows the Google Drive file picker and resolves with the selected\
    \ file. This seems complicated, but the underlying idea is the same: create a\
    \ new Promise, then call the `res` method when the result is ready.\n\n```\nconst\
    \ folder = await new Promise((res) => {\n  const picker = new google.picker.PickerBuilder()\n\
    \    // ... configuration ...\n    .setCallback((data) => {\n      if (/* selected\
    \ action*/) {\n        // a folder is selected\n        const selectedFolder =\
    \ ...\n\n        // resolve the Promise\n        res(selectedFolder);\n      }\n\
    \    })\n    .build();\n  picker.setVisible(true);\n});\n// folder is the selected\
    \ folder\n```\n\n> **Note**\n\nYou can return only one value with the `res()`\
    \ call. You'll learn about ways to return multiple in the [Returning multiple\
    \ values](#) chapter.\n\n# ## Error handling"
  merge: -1
  pgno: 17
- img_proc: true
  md: "So far we've been discussing async functions when everything is going fine.\
    \ No database timeout, no validation errors, no sudden loss of network. But these\
    \ things happen, so we need to prepare for them too. Without proper error propagation,\
    \ failures stall Promises and async functions, stopping them forever.\n\nWith\
    \ synchronous functions, errors happen when something `throw` s them, and they\
    \ bubble up until there is a `try-catch`:\n\n```\nconst fn = () => {\n  throw\
    \ new Error(\"Something bad happened\");\n}\n\ntry {\n  fn();\n}catch(e) {\n \
    \ // handle error\n}\n```\n\nAsync functions work similarly so that when there\
    \ is an error thrown it will go up until a `try-catch`. When there is an asynchronous\
    \ error (we'll look into how they work in the next chapter), you can handle it\
    \ with the same familiar structure:\n\n```\nconst fn = async () => {\n  throw\
    \ new Error(\"Something bad happened\");\n}\n\ntry {\n  await fn();\n}catch(e)\
    \ {\n  // handle error\n}\n```"
  merge: -1
  pgno: 18
- img_proc: true
  md: "Note\n\nErrors are thrown during the `await` and not when the function is called:\n\
    \n```\nconst asyncFn = async () => {\n  throw new Error(\"Something bad happened\"\
    );\n}\n\nconst res = asyncFn(); // no error here\n\ntry {\n  await res; // error\n\
    }catch(e) {\n  // handle error\n}\n```\n\n# Error callback in the Promise constructor\n\
    \nBut when you use the Promise constructor, you need to pay attention to propagate\
    \ the errors.\n\nLet's revisit our previous examples! The `gapi.load` loads a\
    \ client library that can be used with Google services and it needs a callback\
    \ to notify when it's finished. This is easy to turn into a Promise with the Promise\
    \ constructor:\n\n```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\"\
    , res);\n});\n// auth2 loaded\n```\n\nBut what happens when there is an error?\
    \ Maybe the network is down and the client library can not be loaded. In this\
    \ case, the callback function is never called and the Promise is never finished.\
    \ An `await` waiting for it will wait forever.\n\n```\nawait new Promise((res)\
    \ => {\n  gapi.load(\"client:auth2\", res); // error\n});\n// never happens\n\
    ```"
  merge: -1
  pgno: 19
- img_proc: true
  md: "To implement proper error propagation, we need two things. First, a way to\
    \ signal the Promise that an error happened, and second, a way to detect that\
    \ error.\n\n# Rejecting a Promise\n\nThe Promise constructor provides a second\
    \ callback that can signal that an error happened:\n\n```\nnew Promise((res, rej)\
    \ => {\n  // call res() when everything is fine\n  // call rej() when there is\
    \ an error\n});\n```\n\nWhen the `rej` function is called it behaves similarly\
    \ to an async function throwing an error:\n\n```\ntry {\n  await new Promise((res,\
    \ rej) => {\n    rej(); // signal error\n  });\n} catch(e) {\n  // handle error\n\
    }\n```\n\nSimilar to the `res` function, you can pass the error object which will\
    \ be the rejection reason:\n\n```\ntry {\n  await new Promise((res, rej) => {\n\
    \    rej(new Error(\"Something bad happened\"));\n  });\n} catch(e) {\n  console.log(e.message)\
    \ // Something bad happened\n}\n```"
  merge: -1
  pgno: 20
- img_proc: true
  md: "# What is an error\n\nWhat constitutes an error is up to the implementation.\
    \ For example, `fetch` throws an error when the connection can not be established,\
    \ but it does not when the response code is outside the 2xx range.\n\n```\ntry\
    \ {\n  const response = await fetch(options);\n  if (response.ok) {\n    // request\
    \ successful\n  }else {\n    // error response\n  }\n} catch (e) {\n  // error\
    \ while sending the request\n}\n```\n\nExceptions thrown in the constructor also\
    \ reject the Promise:\n\n```\nnew Promise(() => {\n  throw Error(\"something bad\
    \ happened\");\n});\n// rejected with error\n```\n\nThis behavior makes most programming\
    \ errors to propagate correctly. But unlike the `reject` callback, this only handles\
    \ synchronous errors.\n\n# Detecting errors\n\nNow that we have a way to signal\
    \ an error to the Promise, let's see how to adapt the gapi example to take advantage\
    \ of this construct!\n\nIn this specific case, the callback can also be an [object](link)\
    \ with `callback` and `onerror` handlers:\n\n```\nawait new Promise((res, rej)\
    \ => {\n  gapi.load(\"client:auth2\", {callback: res, onerror: rej});\n});\n```"
  merge: -1
