  md: "# Getting started with async/await\n\nIn this chapter, we start with an introduction\
    \ to asynchronous programming in Javascript. The main focus is async functions,\
    \ as you'll likely use them more often, but you'll also learn how Promises work.\n\
    \n# Async functions\n\nNormal functions return a result with the `return` keyword:\n\
    \n```\nconst fn = () => {\n  return 5;\n}\n\nfn();\n// 5\n```\n\nAsync functions,\
    \ in contrast, return a `Promise`:\n\n```\nconst asyncFn = async () => {\n  return\
    \ 5;\n}\n\nasyncFn();\n// Promise\n```\n\nYou can make any function async with\
    \ the `async` keyword, and there are a lot of functions that return a Promise\
    \ instead of a result.\n\nFor example, to read a file from the filesystem, you\
    \ can use `fs.promises`, a variant of the `fs` functions returning Promises:\n\
    \n```\nconst fs = require(\"fs\");\n\nfs.promises.readFile(\"test.js\");\n// Promise\n\
    ```"
  merge: -1
  pgno: 4
- img_proc: true
  md: "Or convert an image to jpeg with the [sharp](link) library, which also returns\
    \ a Promise:\n\n```\nconst sharp = require(\"sharp\");\n\nsharp(\"image.png\"\
    )\n  .jpeg()\n  .toFile(\"image.jpg\");\n// Promise\n```\n\nOr make a network\
    \ request with `fetch`:\n\n```\nfetch(\"https://advancedweb.hu\");\n// Promise\n\
    ```\n\n# ## How to use the Promise\n\nAn async function still has a return value,\
    \ and the Promise holds this result. To get access to the value, **attach a callback**\
    \ using the `then()` function. This callback will be called with the result of\
    \ the function.\n\nTo get the file contents after the `readFile`:\n\n```\nconst\
    \ fs = require(\"fs\");\n\nfs.promises.readFile(\"test.js\").then((result) =>\
    \ {\n  console.log(result);\n  // Buffer\n});\n```\n\nSimilarly, to get the result\
    \ of our simple async function, use `then()`:\n\n```\nconst asyncFn = async ()\
    \ => {\n  return 5;\n}\n\nasyncFn().then((res) => {\n  console.log(res);\n  //\
    \ 5\n});\n```\n\n# ## The benefits of Promises"
