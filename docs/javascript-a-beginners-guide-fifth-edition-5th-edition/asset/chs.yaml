  \ = [4];` 将创建一个包含一个取值为 4 的项的数组，而不是一个包含四个项的数组。\n\n### 访问数组的元素\n\n要访问数组的元素，你使用所谓的“索引”（index），它允许你通过位置访问数组中的每个项。例如，考虑以下示例代码：\n\
