  \ 方法，该方法将创建所需的表格元素，将检索的数据插入这些元素中，并将这些元素添加到你在 HTML 代码中创建的表格 DOM 中。\n\n你在这里可能注意到的点是，在\
  \ `onreadystatechange` 函数的结尾有一个 `.bind(this)`。这个添加确保你在 `onreadystatechange` 函数内部引用的\
  \ `this` 是 `bowlerApp` 对象的 `this`。默认情况下，`onreadystatechange` 函数（以及许多其他函数）使用它们自己的“this”上下文。这种行为会导致使用对象的属性或方法时出现意外失败，提示它们为未定义。通过为对象提供正确的上下文，你就可以像预期的那样再次使用\
  \ `this` 关键字访问对象的属性和方法。请注意，如果你不在 `onreadystatechange` 函数内部使用任何 `bowlerApp` 的属性或方法，那么不需要绑定，默认的“this”上下文也不会影响任何内容。\n\
