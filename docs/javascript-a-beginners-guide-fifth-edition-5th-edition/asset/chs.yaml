  在这个项目中，你运用了关于 `Math` 对象的知识。通过使用 `random()` 方法，你创建了一个网页，其中显示了一个指向随机 Web 地址的链接。\n\n\
  ### 理解 Number 对象\n\n`Number` 对象是另一个预定义的 JavaScript 对象，它为数字操作提供了若干非常有有用的属性和方法。它最常见的用途是访问一些非常有用的属性，这些属性代表某些值，可以在创建脚本时为你提供帮助。`Number`\
  \ 与 `Math` 稍微不同之处在于，你可以创建一个数字并作为数字数据类型在此对象中使用。\n\n### 属性\n\n表 12-3 列出了 `Number`\
  \ 对象的属性，并简要描述了每个属性的用途。本节将更详细地描述其中某些属性。\n\n![Images](img/f0335-02.jpg)\n\n**表 12-3**\
  \ Number 对象的属性\n\n##### MAX_VALUE 属性\n\n`MAX_VALUE` 属性是一个常量数值，大约为 1.79E+308。该属性之所以有用，是因为在\
  \ JavaScript 中，任何大于该值的数字都会被表示为无穷大（infinity）。因此，在比较中使用它可以避免进行由于过大而无法显示数值的计算。以下代码是其工作原理的示例：\n\
  \n![Images](img/f0336-01.jpg)\n\n假设 `num1`、`num2` 和 `num3` 是由用户输入的，那么如果 `big_num`\
  \ 的值大于 `MAX_VALUE` 属性的值，警告框将不会显示“infinity”作为答案，而是告知用户尝试输入较小的数字进行计算。\n\n##### MIN_VALUE\
  \ 属性\n\n`MIN_VALUE` 属性是一个常量数值，大约为 5e –324。该属性之所以有用，是因为在 JavaScript 中，任何小于该值的数字都会被表示为负无穷（negative\
  \ infinity）。因此，在比较中使用它可以避免进行由于过小而无法显示数值的计算。以下代码是其工作原理的示例：\n\n![Images](img/f0336-02.jpg)\n\
  \n假设 `num1`、`num2` 和 `num3` 是由用户输入的，如果计算结果小于 `MIN_VALUE` 属性的值，警告框将告诉用户尝试输入更大的数字进行计算。\n\
  \n##### NaN 属性\n\n`NaN` 属性是一个代表“不是数字”（Not a Number）的值。它在浏览器中显示为字符串值 `NaN`，且它不等于任何数字，也不等于另一个\
  \ `NaN` 实例实例。\n\n##### NEGATIVE_INFINITY 属性\n\n`NEGATIVE_INFINITY` 属性是一个代表负无穷的常量值。它的用法与\
  \ `MIN_NUMBER` 和 `MAX_NUMBER` 类似。\n\n##### POSITIVE_INFINITY 属性\n\n`POSITIVE_INFINITY`\
  \ 属性是一个代表正无穷的常量值。它的用法与 `MIN_NUMBER` 和 `MAX_NUMBER` 类似。\n\n***注意***无穷大在数学方程中的行为与其他数字不同。欲需更多信息，请参阅\
  \ `tutorial.math.lamar.edu/Classes/CalcI/TypesOfInfinity.aspx`。\n\n### 方法\n\n表 12-4\
  \ 列出了 `Number` 对象的某些方法，并简要描述了每个方法的用途。接下来的章节将更详细地讨论其中某些方法。\n\n![Images](img/f0337-01.jpg)\n\
  \n**表 12-4** Number 对象的方法\n\n##### toExponential(), toFixed(), toPrecision(), 和\
  \ toString() 方法\n\n这些方法返回一个字符串值，代表 `Number` 对象以特定格式化后的样子。注意，这些方法不能直接用于数字本身（数值值），如如下代码所示：\n\
  \n```javascript\nalert(10.toExponential());\n```\n\n这会导致 JavaScript 错误，因为它期望一个 `Number`\
  \ 对象。为了避免这种情况，请通过将数值赋值给变量（这将使它们成为 `Number` 对象）来使用这些方法，如下代码所示：\n\n![Images](img/f0337-03.jpg)\n\
  \n***注意***如果你只需要该值，也可以使用构造函数语法 `let the_num = new Number(10);` 或直接使用 `new Number(10).toExponential()`。\n\
  \n##### toExponential() 方法\n\n`toExponential()` 方法返回一个字符串，以指数计数法形式表示 `Number` 对象。因此，以下代码将在屏幕上写入\
  \ 1.0e+1（或类似的表示法，取决于你的浏览器）的结果：\n\n![Images](img/f0338-01.jpg)\n\n##### toFixed()\
  \ 方法\n\n`toFixed()` 方法返回一个字符串，代表保留小数点后指定位数四舍五入的 `Number` 对象。例如，如果你需要格式化计算结果以显示为货币值，可以使用此方法将计算结果保留小数点后两位四舍五入，并以货币格式显示。例如，此代码使用了美元和分：\n\
  \n![Images](img/f0338-02.jpg)\n\n计算结果是 285.7142857142857，但由于使用了 `toFixed()` 方法并传入\
  \ `2` 作为参数，句子显示如下：\n\n```javascript\n一份的金额为 $285.71\n```\n\n##### toPrecision()\
  \ 方法\n\n`toPrecision()` 方法返回一个字符串，代表保留指定有效位数四舍五入的 `Number` 对象。这适用于小数点前后的所有数字。因此，如果你想将\
  \ 45.57689349 保留五位有效数字，可以使用以下代码：\n\n![Images](img/f0338-04.jpg)\n\n浏览器将弹出字符串 45.577，这是保留五位有效数字后的结果（在本例中为小数点后三位）。\n\
  \n##### toString() 方法\n\n`toString()` 方法返回 `Number` 对象（或数值变量值）的字符串值。如果你想将数值值转换为相应的字符串值，这将非常有用（例如，将\
  \ 10 转换为“10”）。\n\n##### toSource() 方法\n\n`toSource()` 方法返回一个代表对象源代码的字符串值。对于预定义的\
  \ `Number` 对象，此方法返回 `constructor` 属性的值。此方法通常由 JavaScript 内部调用，较少在代码中使用。\n\n#####\
  \ valueOf() 方法\n\n这是另一个主要由 JavaScript 内部调的方法。目前，你只需要知道它是 `Number` 对象的一个有效方法即可。\n\
  \n##### parseInt() 和 parseFloat() 方法\n\n当你需要从混合字符串中获取数值时，这两个方法非常有用。它们的工作原理相似，`parseInt()`\
  \ 只提取数字的整数部分，而 `parseFloat()` 则提取整数和小数点后的任何数字。它们的工作方式如下：\n\n\n\n\n\n- 如果字符串中的第一个字符不是数字、加号（`+`）或减号（`–`），两种方法都会返回\
  \ `NaN`。\n\n- 对于 `parseInt()`，如果第一个字符是数字（零除外）、加号或减号，则会继续评估每个字符，直到遇到非数字字符（十六进制值除外，允许某些其他字符，如\
  \ `x` 和 `A`）。返回通过该过程得到的数字。如果第一个字符是 0 且该数字不是十六进制，则返回 0。\n\n- 对于 `parseFloat()`，如果第一个字符是数字、加号或减号，它将评估每个字符，如果发现点（`.`）后面跟着额外的数字，则继续评估，直到遇到第二个非数字字符。如果数字以\
  \ 0 开头且该数字不是十六进制，则将忽略任何前导零，直到遇到另一个数字。返回通过该过程得到的数字。十六进制数返回 0。\n\n每个方法返回值的某些示例将展示这些规则是如何运作的：\n\
  \n![Images](img/f0339-01.jpg)\n\n使用 `parseInt()` 时，允许定义第二个参数，称为 `radix`（基数）。这让你有机会指定要返回的数字类型。这里是一些示例：\n\
  \n![Images](img/f0339-02.jpg)\n\n如你所示，取决于指定的 `radix`，相同的值可能会有不同的结果。`parseFloat()`\
  \ 方法没有这个选项，因为根据设计，它只解析十进制值。\n\n**提示**\n\n当省略 `radix` 参数时，JavaScript 会决定返回什么类型的值。在某些情况下，这可能会导致意外的结果。为了避免这种情况，最好指定\
  \ `radix` 值，即使在处理和期望得到十进制值时也是如此（将基数指定为 10）。\n\n## 使用 Date 对象\n\n`Date` 对象是另一个预定义的\
