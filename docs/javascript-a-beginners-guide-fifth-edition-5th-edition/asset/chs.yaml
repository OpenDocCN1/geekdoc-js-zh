  \ 0。你将在下一节创建时钟时看到如何这样做。\n\n### 创建简单的时钟\n\n创建一个简单的时钟，你需要当前的小时、分钟和秒。获取这些值可以使用 `getHours()`、`getMinutes()`\
  \ 和 `getSeconds()` 方法。\n\n以下代码将创建一个创建一个。首先是 HTML 代码（保存为 `clock.html`）：\n\n![Images](img/f0348-02.jpg)\n\
  \n***警告***\n\n如果你使用服务器端脚本作为 JavaScript 时钟的备份，你几乎不希望它每秒更新一次，因为可能会给 Web 服务器带来过大压力。在这种情况下，最好的方法通常是显示时间而不更新。\n\
  \n接下来，是 JavaScript 代码（保存为 `clock.js`）：\n\n![Images](img/f0348-03.jpg)\n\n![Images](img/f0349-01.jpg)\n\
  \n\n\n该脚本创建了一个函数，将方法的返回值赋值给变量。它获取 `hours` 变量，如果 `hours` 大于或等于 12，则将 `ap` 变量设置为 `p.m.`；如果\
  \ `hours` 小于 12，则将其设置为 `a.m.`（此时 `hours` 变量仍然保留 1 p.m. 对应的 13，2 p.m. 对应的 14 等值）。完成后，会调整\
  \ `hours` 变量，以便显示 12 小时制钟的预期值。\n\n然后，脚本会调整显示分钟和秒的变量值，当数字小于 10 时在前面添加一个 0。这样，时钟在显示\
  \ 12:02:34 时会显示 12:02:34，而不是省略 0 显示为 12:2:34（如果你想让 `hours` 变量也有前导零，也可以这样做）。\n\n\
  最后，该函数将输出显示在页面上。该函数在定义后立即被调用。该函数每隔 1000 毫秒（即 1 秒）重复一次。这使得时钟能够保持实时更新。该脚本在浏览器中运行的结果所示图\
  \ 12-6。\n\n![Images](img/F12-06.jpg)\n\n**图 12-6** 页面上显示了当前时间。\n\n### 尝试题 12-2 创建一个\
  \ JavaScript 时钟\n\n`pr12_2.html`\n\n`prjs12_2.js`\n\n此项目将让你能够更多地使用 `Date` 对象的方法，并学习如何调整返回的值以便以各种方式使用。这创建了一个\
  \ JavaScript 时钟，其选项比你在上一节中的简单时钟要多一些。\n\n#### 逐步步骤\n\n**1.** 创建一个 HTML 页面，其中包含 `script`\
  \ 标签指向名为 `prjs12_2.js` 的外部 JavaScript 文件。添加一个显示“Current Time”的标题，并添加一个 id 为 `my_clock`\
  \ 的 `div` 元素。将 HTML 文件保存为 `pr12_2.html`。\n\n**2.** 完成后，HTML 文件的 `body` 部分应该如下所示：\n\
  \n![Images](img/f0350-01.jpg)\n\n**3.** 创建一个外部 JavaScript 文件并将其保存为 `prjs12_2.js`。在步骤\
