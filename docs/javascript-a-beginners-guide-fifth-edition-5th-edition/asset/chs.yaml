  Node.js 也使用了事件和事件处理器。本章将重点介绍基于浏览器的事件，而 Node.js 的事件处理将在第 11 章中介绍。\n\n为了更好地理解事件处理器所在，你需要学习如何在脚本中添加事件处理器。\n\
  \n### 在 HTML 元素中使用事件处理器\n\n若要在 HTML 元素中直接使用事件处理器，你需要知道事件处理器的关键字以及将事件处理器放置在 HTML\
  \ 代码中的位置。为了给你提供一个示例，我将介绍 `onclick` 事件处理器，它用于在观众点击文档的特定区域时触发某些操作。\n\n可以点击的元素之一是表单按钮。假设你希望在用户点击表单按钮时向他们提示某些内容。你可以编写类似于下面代码的代码：\n\
  \n![Images](img/f0257-01.jpg)\n\n要使用事件处理器，你需要将其作为额外的属性添加到 HTML 标签中。事件处理器“属性”与 HTML\
  \ 属性之间的唯一区别在于，你可以在事件处理器属性内部添加 JavaScript 代码，而不仅仅是属性值。在之前的代码中，你会将 `JavaScript code\
  \ here` 文本替换为某些实际的 JavaScript 代码。\n\n因此，为了在用户点击按钮时弹出警框，你可以直接在你的 `onclick` 属性内部添加必要的\
  \ JavaScript 代码，如下例所示：\n\n![Images](img/f0257-02.jpg)\n\n当观众点击此普通按钮时，会弹出一个带有问候的警框。注意，引号的规则在这里适用。将\
  \ `onclick` 事件处理器作为属性要求你对所有的 JavaScript 代码使用双引号，因此当你需要在警框中使用引号时，请使用单引号以避免可能出现的错误。\n\
  \n此外，注意 `alert` 命令以分号结尾。这允许你在 `alert` 之后添加额外的 JavaScript 代码，使你能够在点击事件上执行多个操作，而不仅仅是单条\
  \ JavaScript 语句。\n\n如果你愿意，可以编写两个 `alert`。你只需要记住包含分号来分隔 `alert` 命令即可。这与通常会有所不同，因为所有代码将写在一行中，而不是你通常看到的分行：\n\
  \n![Images](img/f0258-01.jpg)\n\n此示例通过使用分号分隔它们，在同一个事件上执行两个 JavaScript 语句。在使用事件处理器时，你可以通过这种方式执行多个命令。然而，重要的是要在文本编辑器中将事件处理器关键字（在本例中为\
  \ `onclick`）和结束引号（在本例中为代码最后一个分号之后）之间的所有内容保持在一行；否则，代码中的换行可能会导致无法正常运行或产生 JavaScript\
  \ 错误。\n\n如果你想使用的代码变得非常长，你可能希望将代码放在函数中。事件处理器可以用于任何 JavaScript 代码，因此你可以用它调用在其他地方定义的函数。例如，你可以将两个\
  \ `alert` 放在外部 JavaScript 文件的函数内部，并在 HTML 代码的事件处理器中调用该函数。首先，如下编写外部 JavaScript 文件（此处将保存为\
  \ `js_event_01.js`）：\n\n![Images](img/f0258-02.jpg)\n\n接下来，向你的 HTML 代码中添加 script\
  \ 标签和事件处理器：\n\n![Images](img/f0258-03.jpg)\n\n注意如何使用事件处理器调用函数，就像在脚本中普通函数调用一样。这不仅可以让你缩短事件处理器内的代码，还让你可以在页面的其他按钮点击或事件中复用该函数，而无需再次编写两个\
  \ `alert`。使用函数对你非常有帮助，尤其是当你想要使用的代码变得极其长时。\n\n***注意***\n\n随着学习继续，你会发现使用 `type=\"\
  button\"` 和 `type=\"submit\"` 之间存在区别。对于 `submit` 类型，你需要返回 `false` 或使用 `preventDefault`\
  \ 防止默认操作。随着本章的进行，你将看到更多内容。\n\n### 在脚本代码中使用事件处理器\n\n你也可以在脚本代码中使用事件处理器（无论是在 HTML 文档中使用\
  \ script 标签还是使用外部 JavaScript 文件）。实现此点的方法之一是给元素一个 `id` 属性，然后使用 JavaScript 方法 `document.getElementById()`\
  \ 来访问该元素，正如你在第 9 章中所学习的那样。\n\n#### 添加 id 属性\n\n要以这种方式使用之前的脚本，你首先需要为输入按钮的 HTML 标签添加\
