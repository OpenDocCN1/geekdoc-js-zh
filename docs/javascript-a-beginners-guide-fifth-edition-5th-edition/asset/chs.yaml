  John said, \"Hi!'\");`\n\n**D.** `document.write(\"John said, \\\"Hi!\\\");`\n\n\
  **14.** __________ 字符允许你向字符串中添加其他无法添加的内容。\n\n**15.** 下面哪一个成功地通过将名为 `myhobby` 的变量添加到字符串来显示其值？\n\
  \n**A.** `document.write(\"I like to +myhobby+ every weekend\");`\n\n**B.** `document.write(\"\
  I like to \" +myhobby+ \" every weekend\");`\n\n**C.** `document.write(\"I like\
  \ to myhobby every weekend\");`\n\n**D.** `document.write(\"I like to myhobby every\
  \ weekend\");`\n\n## 第 4 章 使用函数\n\n在这个项目中，你将使用变量的新技能与早先使用 JavaScript 编写网页的技能结合在了一起。你创建了一个网页，其中脚本使用变量在页面上写入\
  \ HTML 代码。然后，你更改了两个变量的值并重新保存了脚本文件。变量的更改使得页面发生了肉可见的变化。\n\n### 核心技能\n*   什么是函数\n*\
  \   为什么函数有用\n*   函数的结构化\n*   调用函数\n\n### 什么是函数\n\n函数基本上是一个执行特定任务的代码块。它的目的取决于你放在它内部的内容。例如，一个函数可能会向浏览器返回一个值。要使用函数，你需要先定义它：\n\
  \n```javascript\nfunction name() {}\n```\n\n如果你只使用它一次，它并没有太大意义。但函数是有意义的。\n\n###\
  \ 为什么函数有用\n\n函数有另一个原因是它们的可重用性。如果你有需要重复的代码，可以将其放入函数中并多次调用。这会让你的代码更整洁。\n\n### 函数结构化\n\
  \n现在你已经理解了什么是函数以及你为什么要使用它们，你需要学习如何在脚本中结构化它们。函数需要用它的名称和代码进行声明。你还可以使用一些可选添加来使函数更有用。你可以将更多值导入到函数中，这些值被称为\
  \ `arguments`。你还可以使用 `return` 语句从函数向主脚本返回值。\n\n#### 声明函数\n\n在函数的第一行，你将其声明为一个函数，为它命名，并指示它是否接受任何参数。要声明函数，你使用关键字\
  \ `function`：\n\n```javascript\nfunction functionname()\n```\n\n\n\n\n你可能已经注意到结尾没有分号。之所以没有分号，是因为你使用了不同的技术来显示函数代码的开始和结束，正如后面描述的那样。然而，函数内部每一行单独代码末尾都以分号结束，正如你将在本章的示例中看到的那样。\n\
  \n## 定义函数的代码\n\n大括号 `{ }` 包围着函数内部的代码。左大括号标记函数代码的开始；接着是代码；最后，右大括号标记函数的结束，格式如下：\n\n\
  ![Images](img/f0066-01.jpg)\n\n当函数被调用时，解释器将执行大括号内的所有代码（这你将在本章稍后的部分学习）。当解释器遇到右大括号时，它就知道函数已经结束了。解释器将移动到下一行代码，或者继续它在调用函数之前正在执行的操作。\n\
  \n放置大括号最常见且推荐的格式是将左括号与函数声明放在同一行，正如上一个代码示例所示。在这种格式下，代码块的左括号看起来位于右侧，而右括号出现在左侧。这是一种计算代码段内打开了/或关闭了多少个括号的实用技巧。\n\
  \n当然，如果你有一个特别短的函数，也可以将整个函数放在单行上，如下：\n\n```javascript\nfunction reallycool() { JavaScript\
  \ code here }\n```\n\n大括号之所以这样是灵活的，因为 JavaScript 中令牌之间出现的空格、制表符和换行会被忽略（令牌是指变量名或函数名、关键字或其他必须保持完的的代码部分）。因此，以下代码是有效的：\n\
  \n![Images](img/f0066-03.jpg)\n\n虽然这可能更难阅读，而且不是推荐的格式，但 JavaScript 仍然会将其视为有效代码，因为其他语法是正确的。\n\
  \n在本书的示例中，我将把左括号与函数声明放在同一行，如果函数特别短，我偶尔可能会将整个函数放在一行上。\n\n## 命名函数\n\n与变量一样，函数也需要仔细命名，以避免脚本出现问题。适用于变量的基本规则也适用于函数命名：大小写敏感、使用允许的字符以及避免关键字和保留字。请参阅第\
  \ 3 章获取这些命名规则列表。\n\n如果你选择反映函数用途的名称，你的函数将更容易记忆和调试。正如你在第 3 章中所学到的，对于变量，你应该使用代表其值的名称，例如用\
  \ `examplenumber` 来表示页面上的示例数字。函数名应该告诉你一些该函数将要做什么。例如，假设你创建了一个向页面写入某些文本的函数。它可能包含以下行代码：\n\
  \n```javascript\ndocument.write(\"<strong>This is a strong statement!</strong>\"\
  );\n```\n\n你可以直接将函数命名为 `text`，但这可能不够具有描述性，因为你可能有其他函数也向页面写入文本。相反，你可能会将其命名为类似 `show_important_message`，这样你就知道该函数是用于向浏览器打印一段强强调的文本。完整函数显示在此：\n\
  \n![Images](img/f0067-02.jpg)\n\n与变量一样，脚本中使用的函数越多，为它们使用有意义且易于记忆的名称就越重要。\n\n## 为函数添加参数\n\
  \n`Arguments`（参数）用于允许函数从函数外部某处导入一个或多个值。参数在函数内部的第一行圆括号内设置，格式如下：\n\n```javascript\n\
  function functionname(variable1, variable2)\n```\n\n任何作为参数引入的值都成为函数内部的变量，使用你在圆括号内给它的的名称。\n\
  \n例如，这里是如何定义一个带有参数（变量）`coolcar` 和 `coolplace` 的函数 `reallycool` 的：\n\n![Images](img/f0067-04.jpg)\n\
  \n注意，在 JavaScript 中，当你设置函数参数时不需要使用 `var` 关键字。当变量被设置为函数参数时，JavaScript 会自动声明它们，因此这里不使用\
  \ `var` 关键字。例如，像下面这一行是无效的：\n\n```javascript\nfunction reallycool(var coolcar, var\
  \ coolplace)\n```\n\n参数最初从哪里来？它们是在调用函数时从函数外部获取的。你将在本章稍后的部分看到它是如何工作的。现在，你只需要知道它们如何用作\
  \ JavaScript 函数的参数。\n\n**注意**\n\n在其他语言中，变量在设置为参数时通常需要声明，但 JavaScript 会为你完成这一点。然而，当你在函数声明之外声明变量时，你需要使用\
  \ `var` 关键字。\n\n需要提到的另一点是，在 JavaScript 中，parameter（形参）一词通常与 argument（实参）一词交叉通用，所以它们几乎总是指的是同一件事。在编程中，这两个术语之间存在技术差异（parameter\
  \ 是值的占位符，而 argument 是实际值），但在一般讨论中并不经常区分。为了简单起见，我将在本书中使用 `arguments` 来引用所有这些类型的值，但如果你想更多关于编程中这些术语的技术相似性和差异，下面的\
  \ Stack Overflow 讨论很有趣：[stackoverflow.com/questions/15677/whats-the-difference-an-argument-and-parameter](https://stackoverflow.com/questions/15677/whats-the-difference-an-argument-and-parameter)。\n\
  \n### 使用参数值\n\n当你为函数分配参数时，可以像其他变量一样使用它们。例如，你可以通过赋值运算符将 `coolcar` 的值赋予另一个变量，如下所示：\n\
  \n![Images](img/f0068-02.jpg)\n\n这把 `coolcar` 参数的值赋值给名为 `mycar` 的变量。\n\n而不是将其赋值给另一个变量，你可以直接在函数中使用\
  \ `coolcar` 参数，如下所示：\n\n![Images](img/f0068-03.jpg)\n\n如果 `coolcar` 的值是 `Corvette`，那么当调用函数时，它将在浏览器打印此行：\n\
  \n`My car is a Corvette`\n\n在这里 `coolcar` 参数是凭空（out of the blue）赋予值的。正如你将在本章稍后部分看到的，`coolcar`\
  \ 的值是在脚本的其他地方调用函数时设置的\n\n### 使用多个参数\n\n你可能注意到上一个示例有两个参数，但只使用了一个。函数可以根据你的需要有少量或参数。当你分配多个函数参数时，函数并不需要使用所有参数。它可以使用一个、几个或没有。使用多少个取决于函数的功能以及它是如何被调用的。\n\
  \n在上一个示例中，第二个参数没有被使用。这是你可以如何修改函数以使用两个参数：\n\n![Images](img/f0069-01.jpg)\n\n现在，如果\
  \ `coolcar` 的值是 `Corvette` 且 `coolplace` 的值是 `Las Vegas`，当调用函数时，它将在浏览器打印以下行：\n\n\
  `My car is a Corvette and I drive it to Las Vegas`\n\n\n\n\n`return` 语句用于返回到调用函数时的作用域（目前，这是主脚本），并可以返回一个值。当执行时，`return`\
  \ 语句会立即返回，因此它通常是函数的最后一个语句，或者是条件语句的结果（你将在第 6 章中学习到）。返回的值可以是变量的值或另一个表达式的值，其格式如下：\n\
  \n`return variablename or expression;`\n\n例如，要返回变量 `cooltext` 的值，`return` 语句如下：\n\
  \n`return cooltext;`\n\n这会将 `cooltext` 的值返回到调用该函数的作用域。\n\n假设你想写一个函数来返回两个字符串相加的结果。你可以像这个示例一样使用\
  \ `return` 语句：\n\n![Images](img/f0070-01.jpg)\n\n在这个函数中，前两个变量被赋值了字符串值，而 `addedtext`\
  \ 变量被赋予了这两个字符串相加后的值。这个新值被发送回调用它的脚本。它返回了此字符串：\n\n`This is fun!`\n\n这个返回的值可以在调用该函数的作用域中使用。在目前的形式下，这个函数并没有很有用，因为字符串只是在函数内部定义的，而不是作为参数传入的。\n\
  \n![Images](img/f0070-02.jpg)\n\n这稍微缩短了代码，因为你不需要定义额外的变量值。稍后你将看到更多关于返回表达式的细节。\n\n\
  返回值可以是一个简单的值、一个计算结果，甚至可以什么都没有。以下所有都是有效的 `return` 语句：\n\n![Images](img/f0070-03.jpg)\n\
  \n所有这些语句都会将控制权交回函数调用后的第一个 JavaScript 语句。返回空内容可以在不发送任何值的情况下实现这一点。\n\n你还可以返回一个表达式，例如数字或字符串的相加（或你决定构建的任何其他表达式）。以下也是有效的\
  \ `return` 语句：\n\n![Images](img/f0070-04.jpg)\n\n这些将分别返回值“This is cool”和 42。\n\n\
  在下一节中，你将看到使用参数和 `return` 语句的更有用的函数示例。\n\n### 在脚本中调用函数\n\n现在你已经知道了函数本身是如何工作的，你需要学习如何在脚本中调用函数。在\
  \ JavaScript 中调用函数只需是函数名加上一组括号（在左、右括号之间有或没有参数），并以分号结束，就像普通的 JavaScript 语句一样：\n\n\
  `functionname();`\n\n你可以在脚本代码的任何地方调用函数。你甚至可以在另一个函数内部调用函数。实际上你从第 1 章起就开始调用函数了，因为每当你使用\
  \ `document.write()` 时，你都在调用一个函数。\n\n一个好的遵循的规则是让函数定义出现在脚本中函数调用之前。确保函数定义在函数调用之前的最简单方法是将所有的函数定义尽可能地放在脚本开头（通常紧跟在变量声明之后）。例如：\n\
  \n![Images](img/f0071-01.jpg)\n\n你会注意到使用了 `window.alert()` 方法，这是另一个函数。该方法向查看者发送一个弹出式警告，并将发送给它的字符串作为参数。用户必须点击“确定”（OK）按钮才能关闭警告框。这可以用于快速示例或测试代码。\n\
  \n在调用之前定义函数是一个良好的编码实践建议，而不是严格的规则。由于*函数声明提升（function declaration hoisting）*，在 JavaScript\
  \ 中可以在任何地方调用函数。JavaScript 解释器会首先运行所有的 JavaScript 代码以寻找任何函数声明。它找到的任何函数声明都会移动（提升）到代码顺序的顶部。然后按照新顺序执行代码，这允许所有提升的函数在源代码的任何地方被调用。例如，以下代码将由于函数声明提升而有效：\n\
  \n![Images](img/f0071-02.jpg)\n\n**注意**\n\n函数声明提升仅在使用函数声明（function declaration）定义函数时有效。关于此点的更多信息，请参阅本章后面的“定义函数的其他方法”部分。\n\
  \n#### 脚本标签：Head 部分或 Body 部分\n\n在将脚本直接添加到 Web 页面而不是使用外部文件时，确保变量和函数声明在头部（head）部分通常有助于确保当脚本在正文（body）部分调用它们时，它们是可用的。然而，由于\
  \ JavaScript 经常使用可能尚未加载的文档信息，这可能会变成问题。另一方面，当你需要编辑 HTML 代码时，在 body 部分有大量的 JavaScript\
  \ 代码也会很麻烦（而且如果 JavaScript 代码在 body 部分，它需要位于包含 JavaScript 所需信息的元素[s]之后，以确保必要的信息已加载）。\n\
  \n现代 JavaScript 中常用的一种做法是将 JavaScript 代码放在一个外部文件中（将脚本代码与 HTML 代码分离），然后将脚本标签放在闭合\
  \ `</body>` 标签之前。这种放置的原因是它允许页面在尝试加载 JavaScript 文件之前进行加载和显示。这使得页面看起来加载更快，并允许 JavaScript\
  \ 代码在执行时立即利用由文档提供的 HTML 标签和 CSS 信息，而不是导致错误或需要等待页面加载。\n\n作为一个示例，你将创建一个向查看者发送警告消息的脚本。\n\
  \n### 创建 JavaScript 警告\n\n与其使用 `document.write()` 方法向屏幕写入内容，不如你可以使用 `window.alert()`\
  \ 方法创建一个弹出消息框的 JavaScript 警告。首先，你将学习如何创建 JavaScript 警告，然后你将看到使用该方法的函数。\n\n就像 `document.write()`\
  \ 方法一样，`window.alert()` 方法接收字符串作为参数，格式如下：\n\n`window.alert(\"alert_text\");`\n\n\
  该字符串将显示在警告弹出框中。\n\n例如，假设你想在弹出框中显示“This is an alert!”。你在外部 JavaScript 文件（本示例中使用文件名\
  \ `js_alert.js`）中这样写命令：\n\n```\nwindow.alert(\"This is an alert!\");\n```\n\n你通过在\
  \ HTML 代码的 `</body>` 标签之前调用脚本来实现这一点：\n\n![Images](img/f0072-03.jpg)\n\n将 HTML 文件保存为\
  \ `js_alert.html` 并在 Web 浏览器中查看它。如所见，这确实是页面打开时显示警告的一种简单方法。但是，由于你正在学习函数，你将采取另一种方法。\n\
  \n### 使用函数创建 JavaScript 警告\n\n以下代码使用外部 JavaScript 文件中的函数来弹出警告框。在你的 `js_alert.js`\
  \ 文件中，将代码更改为：\n\n![Images](img/f0073-01.jpg)\n\n**注意**\n\n如果你愿意，也可以将函数定义位于外部 JavaScript\
  \ 文件中，并在 HTML 文件中调用函数。\n\n\n\n\n此示例创建了一个名为 `show_message()` 的函数来执行显示警告的任务。只有当你在代码某处调用了\
  \ `show_message()` 函数时，才会显示警告。在这种情况下，该函数在定义后立即被调用。其结果是一个带有消息“This is an alert!”的小型警告框。\n\
  \n![Images](img/I04-01.jpg)\n\n**注意**\n\n当警告框出现时，你可能会看到页面暂停，直到你点击 OK 按钮；或者页面会在等待你点击\
  \ OK 的同时继续加载。这取决于你的浏览器。\n\n## 函数与代码顺序\n\n尽管上一个示例中的函数是先定义的，但这并不意味着它会被首先执行。函数在被调用之前是不会执行的；换句话说，在\
  \ JavaScript 运行脚本中的函数调用之前，不会使用该函数。\n\n任何在函数调用之前的命令（且不属于函数定义部分的命令）都将在函数之前执行。例如，我们可以这样修改\
  \ JavaScript 文件中的代码：\n\n![Images](img/f0074-01.jpg)\n\n这个示例在第一行定义了相同的函数 `show_message()`。函数之后是两个独立的\
  \ `window.alert` 命令，然后是调用函数的行。用这段新代码保存 `js_alert.js` 文件，然后在 Web 浏览器中重新加载 `js_alert.html`\
  \ 文件。你应该看到一个有趣的的结果！\n\n这两个独立的警告命令是 JavaScript 看到的最先可执行语句，因此先执行。对我们函数的调用最后才被看到，因此该函数最后执行。结果是三个警告，顺序如下：\n\
  \n* 用户会收到一个警告，显示内容为“I am first, ha!”，需要点击 OK 按钮将其消除。\n* 接着出现显示“I am second, ha ha!”的警告，查看者需要再次点击\
  \ OK。\n* 最后，执行函数，查看者看到警告“This is an alert!”并需要第三次点击 OK 结束结束这波警告狂潮。\n\n尽管这个示例在警告的使用上有些过头，但它能帮助你理解函数调用是如何运作的。\n\
  \n还需要强调的最后一点是：函数的定义顺序没有区别，但调用的顺序却有。考虑以下代码：\n\n![Images](img/f0074-02.jpg)\n\n在这里，函数的定义顺序是先\
  \ `show_message_1` 后 `show_message_2`，但先调用了 `show_message_2`。由于调用顺序决定了执行顺序，第一个显示的消息将是“This\
  \ is alert #2!”，第二个将是“This is alert #1!”。\n\n随着你编程经验的增加，将 `<script>` 标签放在 `<head>`\
  \ 还是 `<body>` 部分将变得更容易。当脚本使用来自 HTML 文档主体的信息时，`<script>` 标签通常要么放在 `<head>` 部分，并设置一个函数在页面加载后初始化变量和其他函数（这用到了事件处理，将在第\
  \ 8 章中讨论），要么放在 `<body>` 部分、紧邻结束的 `</body>` 标签之前。我将在本书中使用后一种方法。\n\n## 从另一个函数中调用函数\n\
  \n在另一个函数内部调用函数是组织事件发生顺序的一种有用方法。通常，函数被放在另一个具有更大任务需要完成的函数内部。\n\n在函数内部放置函数调用时，根据之前“函数应在调用之前定义”的建议，你应该在定义调用它的函数之前定义被调用的函数。\n\
  \n这里有两个函数的示例，第二个函数调用了第一个函数：\n\n![Images](img/f0075-01.jpg)\n\n注意 `update_alert()`\
  \ 函数是所有实际操作发生的地方。其他所有都是函数调用。`call_alert()` 函数的作用仅仅是调用 `update_alert()` 函数使其执行。最后，你看到了启动整个序列的命令，即对\
  \ `call_alert()` 函数的调用。由于这是函数外的第一个 JavaScript 语句，因此它首先执行。当它执行时，它只是调用了 `update_alert()`\
  \ 函数，由该函数负责显示警告的工作。\n\n**注意**\n\n由于函数声明提升（function declaration hoisting），即使你在调用\
  \ `update_alert()` 函数之后才定义它，大多数浏览器也能毫无问题地执行先前的示例。\n\n现在假设你想创建三个函数来执行三个任务。为了确保它们按照正确的顺序发生，你可以在另一个函数内部按顺序调用它们。这里是该技术的示例，包含三个出于不同目的而调用警告的函数：\n\
  \n![Images](img/f0076-01.jpg)\n\n代码开始定义三个用于显示每个警告的函数。然后定义了 `get_messages()` 函数，它仅仅是调用了之前的三个函数。当然，必须调用\
  \ `get_messages()` 函数才能实际付诸行动。这个调用发生在函数外的第一个语句处。\n\n当然，编写一个一个接一个弹出消息消息的脚本通常不是你想要的。虽然这个示例演示了函数调用的正确用法，但一个这样的脚本可能会骚扰你的观众！随着你对本书的不断学习，你将看到函数实际用途的示例。\n\
  \n## 带参数调用函数\n\n上一个示例使用了三个不同的函数来显示三个警告。虽然这可行可行，但如果你不需要为每个警告都写一个新函数就更好了。你可以通过使用参数避免这样做。你可以创建一个可以多次使用的函数来执行相同的事情，但每次传入不同的信息。\n\
  \n正如本章前面提到的，变量常作为参数。然而，你也可以使用值作为参数。你将首先学习变量参数，然后查看值参数。\n\n主要的规则是，如果你有多个参数，需要用逗号分隔每个参数，以便浏览器知道如何处理。此外，参数是顺序读取的，所以如果你向一个接收两个参数的函数发送一个，它会被作为第一个参数。\n\
  \n**注意**\n\n如果一个函数接收两个参数而你只想发送第二个，可以使用 `null` 作为第一个值，前提是该函数能够正确处理 `null` 值。出于这个原因，这样做时要小心，以确保当函数无法处理该参数的值时不会出错。\n\
  \n如果你想将某些变量的值发送给函数，你必须先声明变量，并在发送之前确保它们已拥有你需要的值。在这里，变量的作用域（scope）变得非常重要。变量的作用域决定了它在哪里有效。JavaScript\
  \ 既有全局变量也有局部变量。\n\n### 使用全局变量\n\n*全局变量*是你在第 3 章中学习过的变量。由于它们定义在任何函数之外，因此可以在脚本的任何地方（函数内部或外部）更改。全局变量定义如下代码所示：\n\
  \n![Images](img/f0077-01.jpg)\n\n此示例中的变量可以在脚本的任何地方更改。这意味着它们甚至可能被函数意外覆盖或修改。\n\n为了理解全局变量如何受到函数的影响，考虑一个显示两个警告的示例。让一个警告告诉你买某辆汽车需要多少钱，另一个告诉你你有多少钱以及现在拥有什么种汽车。如果使用以下代码会发生什么？\n\
  \n![Images](img/f0077-02.jpg)\n\n\n\n看起来你似乎在函数内部创建了新变量，尽管它们的名称相同。然而，脚本会在两个警框中输出以下文本：\n\
  \n`你需要 $3500 来买一辆法利`\n\n`你赚了 $3500 并拥有一辆法利`\n\n显然，这是不对的。\n\n这个例子说明了为什么在声明变量时需要使用\
  \ `var` 关键字。如果不使用 `var` 关键字，你并没有在函数内部创建新变量（这会让它们变成局部变量）。相反，你正在改变你的全局变量的值——你发出的是重新赋值命令，而不是新变量的命令。如果该变量尚未定义，那么在不使用\
  \ `var` 关键字的情况下声明它将创建一个同名的全局变量——这同样也会导致问题。为了澄清这一点，你只需要更改一组变量名，或者更好的做法是使用局部变量。\n\n\
  ### 使用局部变量\n\n`局部变量` 只能在声明它的函数内部使用。除非你通过参数将其传递给另一个函数，否则它在函数外部并不存在。\n\n在函数中创建局部变量的关键是确保你使用\
  \ `var` 关键字对其进行声明。否则，正如你在上一个示例中所看到的，任何同名的全局变量都可能被改变。要声明局部变量，你必须将其放在函数内部并使用 `var`\
  \ 关键字，如代码所示：\n\n```\n![Images](img/f0078-01.jpg)\n```\n\n`mycar` 和 `paycheck` 变量现在是局部变量，只能被\
  \ `new_car()` 函数看到和修改。\n\n因此，为了纠正上一节中的脚本，你只需要在函数内部添加 `var` 关键字来声明局部变量，如下所示：\n\n\
  ```\n![Images](img/f0078-02.jpg)\n```\n\n现在警框应该按照你预期的方式显示：\n\n`你需要 $3500 来买一辆法利`\n\
  \n`你赚了 $1200 并拥有一辆本田`\n\n正如你看到的，当你将某些变量作为参数传递给函数时，变量的作用可能非常重要。\n\n### 将变量作为函数参数\n\
  \n下面的示例使用了变量参数。它将一个全局变量传递给函数。\n\n```\n![Images](img/f0079-01.jpg)\n```\n\n脚本从 `check_alert()`\
  \ 函数开始，该函数接收参数 `pcheck`。然后使用该函数显示一个警框，其使用了传递给它的参数值 `(pcheck)`。在函数之后的外部脚本中，全局变量 `paycheck`\
  \ 被赋值为 `1200`。然后代码调用 `check_alert()` 函数并将 `paycheck` 变量的值发送给它。\n\n当这段代码调用 `check_alert()`\
  \ 函数时，它向该函数发送了 `paycheck` 变量的值。该值通过括号内的参数名 `pcheck` 引入函数。\n\n需要注意的是，`pcheck` 变量在\
  \ `check_alert()` 函数内部变成了一个局部变量。由于它是一个参数，因此在括号内不需要 `var` 关键字来使其成为局部变量。由于代码发送了值 `1200`，当函数开始时，`pcheck`\
  \ 将为 `1200`。此外，更改 `pcheck` 的值不会改变 `paycheck` 的值，因为 `pcheck` 是局部变量。\n\n### 使用值参数\n\
  \n你也可以直接发送一个值作为参数。你不需要为了传递参数而声明全局变量，只需要发送一个值，该值将在函数内部被转换为局部变量。这允许你即时发送值，并消除了准备全局变量的需要。\n\
  \n需要记住的重要点是，如果你发送字符串值，需要将其包含在引号中。下面的函数调用向名为 `text_alert()` 的函数发送了字符串值“something”：\n\
  \n```\ntext_alert(\"something\");\n```\n\n例如，上一节中的最后一个示例可以进行修改，通过值参数在减少一行代码的同时添加更多信息：\n\
  \n```\n![Images](img/f0079-03.jpg)\n```\n\n在例例中，函数调用向函数发送了两个参数。第一个是数值，不需要引号。第二个值是字符串，需要包含在引号中。这些值随后被发送到函数中，并在那里被分别作为局部变量\
  \ `pcheck` 和 `car` 读取。它们现在可以在函数中使用，并在警框中显示此句子：\n\n`你赚了 $1200 并拥有一辆雪尔佛`\n\n参数也可以使用表达式发送，如下所示：\n\
  \n```\ncheck_alert(500+700, \"Cor\" + \"vette\");\n```\n\nJavaScript 将求值每个表达式并将结果作为参数发送给函数。因此，之前的代码将产生相同的结果（500\
  \ 加上 700 等于 1200，拼接“Cor”和“vette”得到“Corvette”）：\n\n`你赚了 $1200 并拥有一辆雪尔佛`\n\n### 参数是可选的\n\
  \n另一个应该被提到的点是，向函数发送参数是可选的。函数将尽力在没有发送参数值的情况下完成它的工作。你可以不带任何参数调用函数 `check_alert()`：\n\
  \n```\n![Images](img/f00080-04.jpg)\n```\n\n你的结果将类似于下面的文本：\n\n`你赚了 undefined 并拥有一辆\
  \ undefined`\n\n因此，可以使用条件语句来处理未发送参数的情况。这里使用如下方法检查 `check_alert()` 是否接收了参数：\n\n```\n\
  ![Images](img/f0080-06.jpg)\n```\n\n本质上是告诉 JavaScript 在编写语句之前检查参数是否存在。如果存在，则带有参数写入语句；如果不存在，用户将收到一个“我的参数缺失！”的警框。\n\
  \n#### 使用返回语句调用函数\n\n你可以将函数的赋值赋值给变量。这样，变量就获取了函数返回的值。这是声明具有函数返回变量的格式：\n\n```\nvar\
  \ varilename = functionname();\n```\n\n考虑这个示例，它有一个返回两个字符串拼接后的函数：\n\n```\n![Images](img/f0081-02.jpg)\n\
  ```\n\n正如你所看到的，函数将文本变量返回给脚本。通过将 `get_added_text()` 函数的结果赋值给变量 `alerttext`，你可以在脚本后续使用该文本。该变量用于向用户发送结果警框。警框消息显示为\n\
  \n`这很有趣！`\n\n现在，这很有趣吗？随着学习的深入，你会看到返回语句更多的实际应用。\n\n最后需要记住的一点是，如果你将一个不返回值的函数赋值给变量，该变量的值为\
  \ `undefined`。例如，查看下面的代码：\n\n```\n![Images](img/f0081-03.jpg)\n```\n\n鉴于此，在将函数结果赋值给变量时要确保从该函数返回一个值。否则，可能会发生这种意料之外的结果！\n\
  \n#### 定义函数的其他方法\n\n在查看脚本时可能会遇到或在编写新脚本时发现有用的多种定义函数方法：函数声明（已讨论过）、函数表达式、函数构造函数和箭头函数。\n\
  \n### 函数声明\n\n这是你在此为止一直使用的方法，也是本书中经常使用的方法。正如你记得的，你只需要如下所示声明函数：\n\n```\n![Images](img/f0082-01.jpg)\n\
  ```\n\n你还可以像本章早期提到的那样添加参数和/或返回语句。\n\n### 函数表达式\n\n函数表达式与函数声明非常相似，并使用这种格式：\n\n\n\n\
  \n![Images](img/f0082-02.jpg)\n\n注意右大括号后面有一个分号（`;`）。由于该函数正在被赋值给变量，因此需要分号来完成变量赋值语句。请注意，在这种情况下，函数本身被赋值给变量，而不是函数的返回值（正如你之前做的那样）。此外，函数在这里并没有被执行，而只是被赋值。\n\
  \n函数声明和函数表达式之间的主要区别如下：\n\n-   函数表达式将函数赋值给变量，并需要分号来完成语句。\n-   由于它在 `function` 关键字之后没有被分配名称，因此它被认为是一个\
  \ `anonymous`（匿名）函数。可以使用变量名来调用该函数。\n-   函数表达式不利用函数声明提升，因此在代码中定义它之前无法调用它。\n\n作为最后一点的示例，请看下面的代码。它会导致一个错误：\n\
  \n![Images](img/f0082-03.jpg)\n\n注意该函数在定义之前被调用了。由于该函数被定义为变量赋值，因此在赋值完成之前无法使用（它无法利用函数声明提升）。图\
  \ 4-1 显示了在 Mozilla Firefox 中运行此代码时产生的错误。\n\n![Images](img/F04-01.jpg)\n\n**图 4-1**\
  \ 函数表达式无法利用声明提升，因此在定义之前调用它会导致错误。\n\n为了让这段代码能够正常工作，必须将函数调用移动到函数定义之后：\n\n![Images](img/f0083-02.jpg)\n\
  \n现在函数调用位于函数定义之后，代码将按预期运行。这是使用函数表达式时需要记住的一个重要区别，因为它们在被定义之前无法执行。图 4-2 显示了在函数定义后调用时现在显示的警框。\n\
  \n![Images](img/F04-02.jpg)\n\n**图 4-2** 警框现在如预期显示。\n\n匿名函数在处理 JavaScript 事件时非常有用。例如，为了响应用户在\
  \ Web 页面上点击鼠标，你可以为 document 的点击事件编写一个简单的函数，然后调用它，如下代码所示：\n\n![Images](img/f0083-03.jpg)\n\
  \n这声明了函数，然后在之后调用它（不带括号）来处理点击事件。\n\n然而，你可以使用匿名函数将这两个步骤合并为一个，如下：\n\n![Images](img/f0083-04.jpg)\n\
  \n由于对该事件的响应只会在 JavaScript 代码中的一处，因此匿名函数是处理事件的一种方便方法，不需要在其他地方声明函数然后调用它。这种技术以及用于事件处理的代码类型（如之前的代码列表）将在第\
  \ 10 章中详细讨论。\n\n### 函数构造函数\n\n函数构造函数创建函数对象的方式与创建新实例相同（这将在第 9 章中讨论）：\n\n```javascript\n\
  var functionname = new Function (`arguments`, `code for function`);\n```\n\n它的工作方式与其他函数类似，但这种方法的主要缺点是性能低于其他方法（它在每次使用时都会被求值，而不是只解析一次）。建议使用其他两种方法之一来定义函数。\n\
  \n### 箭头函数\n\n箭头函数是在 ES6 中引入的，提供了一种缩短函数表达式语法的方法，并提供了一些简单的语法来返回对象。你将在这里看到基础知识，我们将在书的后部分详细介绍这些函数。\n\
  \n箭头函数的基本语法如下：\n\n![Images](img/f0084-03.jpg)\n\n这与函数表达式一致。例如，下面的代码使用函数表达式实现了相同的功能：\n\
  \n![Images](img/f0085-01.jpg)\n\n如你所见，箭头函数（以参数后的箭头命名）缩短了你需要的打字量。你将在 node 模块或 Web\
  \ 代码中看到许多箭头函数，因此熟悉它们是好的。随着对本书的深入，我们将更详细地查看它们。\n\n### 专家问答\n\n**问：如果我把一个函数放在脚本中，但决定不在脚本中调用它呢？这会有影响吗？**\n\
  \n**答：** 除非被调用，否则函数不会执行。然而，拥有未使用的函数会使代码更难以维护，并增加查看者的下载时间（这在拨号等慢速连接或需要优化代码下载时间的情况下可能会产生影响）。此外，如果函数包含包含语法错误，可能会向查看者发送\
  \ JavaScript 错误，并导致 Web 页面上的其他内容无法正常工作。\n\n**问：如果我稍后决定从脚本中删除一个函数会怎样？**\n\n**答：**\
  \ 如果你没有删除任何对该函数的调用，就会导致麻烦。脚本可能会导致错误或给你带来意想不到的结果。\n\n**问：那么，如果我调用一个不存在的函数会怎样？**\n\
  \n**答：** 你会得到一个 JavaScript 错误，或者浏览器什么都不做。\n\n**问：确定何时使用函数以及何时直接在脚本中编写代码的最佳方法是什么？**\n\
  \n**答：** 通常情况下，如果代码将在多个地方复用，你就应该使用函数。例如，执行特定计算的函数可能是很有用的。\n\n### 尝试 4-1 创建函数的 HTML\
  \ 页面\n\n`pr4_1.html`\n\n`prjs4_1.js`\n\n在这个项目中，你创建一个带有两个函数的 HTML 页面。一个函数使用传入的参数弹出警框。另一个函数使用返回语句将值传回脚本。该返回的值随后被用于警框消息。\n\
  \n#### 步骤说明\n\n1. 创建 HTML 页面，在 `<body>` 和 `</body>` 标签之间留出空间。\n2. 创建一个外部 JavaScript\
  \ 文件并将其保存为 `prjs4_1.js`。\n3. 在 HTML 文档的 `<body>` 和 `</body>` 标签之间添加必要的脚本标签以包含外部\
  \ JavaScript 文件。将 HTML 文件保存为 `pr4_1.html`。\n4. 打开外部 JavaScript 文件 `prjs4_1.js` 并执行步骤\
  \ 5-10。\n5. 创建一个名为 `car_cost()` 的函数，接收两个参数 `mycar` 和 `paycheck`。创建一个 `window.alert()`\
  \ 命令显示以下消息：\n`You have a <mycar> and make $<paycheck>`\n6. 创建一个名为 `get_added_text()`\
  \ 的函数，返回两个字符串相加的值。要加的两个字符串是这两个独立的字符串：`This project` 和 `is almost fun!`\n7. 在主脚本中（函数定义之后），调用\
  \ `car_cost()` 函数，并将“Mustang”和 `1500` 作为参数传递进去。\n8. 在主脚本中（函数定义之后），将 `get_added_text()`\
  \ 函数的结果赋值给变量 `alerttext`。创建一个弹出该值的警框。\n9. 当你完成后，你的外部 JavaScript 文件应该像这样：\n\n![Images](img/f0086-03.jpg)\n\
  10. 保存外部 JavaScript 文件。\n\n\n\n\n\n11. 打开 `pr4_1.html` 文件并在浏览器中查看以查看结果。\n\n12. 当你打开该网页时，你应该能看到两个警框消息：\n\
  \n`You have a Mustang and make $1500`\n`This project is almost fun!`\n\n### 本项目练习总结\n\
  \n在这个项目中，你创建了一个使用两个 JavaScript 函数的脚本。第一个函数使用了参数，并根据发送到函数的参数创建一个带有消息的警框。第二个函数在将两个字符串相加后向脚本返回一个值。浏览器中脚本的运行结果是两个警框消息，它们分别基于发送给第一个函数的信息和第二个函数返回给脚本的信息。\n\
  \n### 作用域/上下文基础知识\n\n在 JavaScript 中，涉及作用域（变量或函数可以使用且有效的上下文）时，有一些关键点需要记住。例如，在本章的早些时候，你能够通过在函数内部使用\
  \ `var` 关键字声明变量来创建局部变量。这些局部变量仅在它们定义的函数内部有效，这防止了它们被主脚本（`global` 上下文）中的修改。JavaScript\
  \ 中两个主要的执行上下文是全局上下文和函数上下文。此外，新的 `let` 关键字允许块级上下文。\n\n#### 全局上下文\n\nJavaScript 中的全局上下文包含任何不在函数内部的代码。考虑这段代码：\n\
  \n![Images](img/f0087-02.jpg)\n\n如示例所示，全局变量 `myname` 在定义后可以在代码的任何地方使用。`say_name()`\
  \ 函数定义在全局作用域中，因此它可以从代码的任何地方调用。然而，`mydog` 变量仅在 `say_name()` 函数内部可用，不能在此上下文之外的任何地方使用。在脚本末尾的\
  \ alert 中尝试使用它会导致 JavaScript 错误。\n\n通常情况下，你的脚本变得越复杂，将内容移出全局上下文就越好，因为全局变量可能会从任何其他上下文被意外覆盖。\n\
  \n#### 函数上下文\n\n在 JavaScript 中，函数会创建一个新的上下文。正如你所看到的，函数内部使用 `var` 关键字声明的任何变量在函数外部都是不可用的。关于函数你需要学习的另一个新点是：它们内部可以嵌套其他函数。考虑以下代码：\n\
  \n![Images](img/f0088-01.jpg)\n\n这在 `say_name()` 函数内部创建了 `say_food()` 函数。`say_food()`\
  \ 函数可以使用定义在 `say_name()` 或全局上下文中的任何变量。如你所见，这创建了一个基于嵌套函数的作用域链。链中最内层的函数拥有的变量受保护最完不易修改，而全局上下文的变量受保护最少（它们是公共的，即使在最内层函数中也可以）。\n\
  \n这里显示了示例中的每个上下文以及该上下文可以使用变量/函数：\n\n![Images](img/f0088-02.jpg)\n\n![Images](img/f0089-01.jpg)\n\
  \n注意，`myname` 可以在三个上下文中使用，`mydog` 可以在两个上下文（`say_name()` 和 `say_food()` 上下文）中使用，而\
  \ `myfood` 只能在一个上下文中使用（`say_food()` 上下文）。\n\n记住这种工作原理是非常重要的，因为只有当你使用 `var` 关键字时，JavaScript\
  \ 才会使用函数来创建上下文。其他的块级结构（如条件语句和循环）不用于此目的，除非你使用 `let` 关键字，这将在下一节中描述。\n\n***注意***\n\n\
  通过调用 `eval()` 方法可以创建第四种类型的执行上下文；然而，`eval()` 方法会导致许多问题（例如速度和安全问题），几乎永远不应该使用它。\n\n\
  #### 块上下文\n\n如果使用 `let` 关键字代替 `var` 定义变量，则会为变量创建块上下文。函数在大括号 `{}` 之间提供了块上下文。其他的块上下文由条件语句和循环创建，这些内容将在第\
  \ 7 章中进一步描述。\n\n`let` 关键字在函数上下文中使用时工作方式与 `var` 相同，正如你已经看到的那样。它的优势在于能够为变量创建块级作用域。例如，以下代码显示了一个简单的条件语句（该概念将在第\
  \ 7 章中进一步讨论）：\n\n![Images](img/f0089-02.jpg)\n\n首先，使用 `let` 关键字创建一个全局上下文变量（`myname`）。\"\
  if\" 语句在大括号之间创建了一个块上下文。`let` 关键字可以利用这个上下文，在该文中创建一个具有自身值的 `myname` 变量。结果是，块上下文 `myname`\
  \ 的值为“Jane”，它在块上下文的 alert 中被发送。一旦这个块上下文结束，会发送另一个 alert。该文中 `myname` 的值为“John”，因此这就是在最终\
  \ alert 中发送的值。\n\n`let` 关键字的另一个优势是，如果你在同一个作用域内两次声明同名的变量，JavaScript 解释器将向你抛出错误。这也有助于保持代码整洁并避免任何潜在的错误！\n\
  \n由于使用 `let` 关键字时变量的作用域要清晰得多，因此今后建议用它替代 `var`。这样，任何块（如函数、条件或循环）都将成为定义变量的适当上下文。\n\
  \n##### const 关键字\n\n`const` 关键字用于保持不变的值。例如，如果你声明了一个 `const` 值并尝试更改它，解释器将抛出错误，如下所示：\n\
  \n![Images](img/f0090-01.jpg)\n\n`const` 关键字像 `let` 一样使用块作用域。因此，最好使用 `let` 和 `const`\
  \ 而不是 `var`。\n\n### 练习 4-2 你自己的函数\n\n`pr4_2.html`\n\n`js4_2.js`\n\n在这个项目中，你再次创建一个\
