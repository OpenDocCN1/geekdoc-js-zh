  \ 完成后应该像所示：\n\n![Images](img/f0271-02.jpg)\n\n**6.** 保存 HTML 和 JavaScript 文件，并在浏览器中加载\
  \ HTML 页面。点击文本框内部，应该会出现提醒消息。之后点击该区域以使消息消失。\n\n#### 总结\n\n你使用了你的新技能——`focus` 和 `blur`\
  \ 事件来帮助用户填写表单。\n\n## 专家问答\n\n**Q**: 为什么有这么多事件？\n**A**: 查看者在 Web 页面上（或浏览器本身）可以做的事情太多，以至于你得到了一堆事件。\n\
  \n**Q**: 我需要记忆所有这些内容吗？\n**A**: 只有在你参加考试、在工作中需要快速掌握知识，或者你只是喜欢背诵这些事件时，你可能才需要记忆它们；否则，如果你不确定需要使用哪种事件，可以参考本章的表\
  \ 10-1。\n\n**Q**: 我会在书中用到每一个事件吗？\n**A**: 这本书是一本入门指南，你不会到使用每一个事件的地步。\n\n## 注册事件的其他方法\n\
  \n在此之前，你一直使用的是所谓的 DOM  0 事件处理程序（onclick、onmouseover 等）。除了你已经使用的方法外，还有两种注册事件的方法：`addEventListener()`\
  \ 和 `attachEvent()`。这些被称为 DOM  2 事件处理程序，它们提供了为元素附加多个事件的能力，而 DOM 0 方法允许在任何给定元素上注册一个事件。例如，假设你有以下\
  \ JavaScript 代码：\n\n![Images](img/f0272-01.jpg)\n\n在这种情况下，第二次向 `mydiv` 元素分配 `onclick`\
  \ 事件处理程序的实例将覆盖第一个，因此当发生点击时，只会显示“第二次点击！”警报。DOM  2 事件处理程序允许你避免这个问题。\n\n***注意***\n\n\
  如果你有 `<div id=\"mydiv\" onclick=\"…>`，然后在文档中写了 `mydiv.onclick`，它将覆盖 `onclick` 属性，因此请选择一种方法来添加事件以避免任何冲突。\n\
  \n#### addEventListener() 方法\n\n\n\n\n\n`addEventListener()` 方法是 W3C 的标准，目前在所有最新的浏览器中都支持（Internet\
  \ Explorer 需要 9 及以上版本）。它允许你指定一个事件、为该事件执行的函数，以及一个 true 或 false 的值，取决于你希望事件处理函数在捕获阶段（true）或冒泡阶段（false）如何执行。其通用格式如下：\n\
  \n![Images](img/f0273-01.jpg)\n\n因此，如果你想像在本章较早部分中那样创建一个关联的输入按钮，你可以调整 JavaScript\
  \ 代码如下：\n\n![Images](img/f0273-02.jpg)\n\n请注意，该方法不是使用事件处理器，而是使用事件名称（而不是使用 `onclick`，你只需使用\
  \ `click`）。此外，此方法可以接受函数名或函数表达式来处理事件（如前所示）。需要注意的是，当你指定一个单独的函数时，需要省略括号。例如，看以下代码：\n\
  \n![Images](img/f0273-003.jpg)\n\n一个导致此功能无法运行的常见错误是在 `addEventListener` 中指定处理函数时包含了括号。因此，如果你发现异常行为，请检查是否添加了括号。\n\
  \n### 移除事件\n\n要移除事件，你可以使用 `removeEventListener()` 方法：\n\n![Images](img/f0273-04.jpg)\n\
  \n请注意，如果在 `addEventListener()` 方法中使用了函数表达式，则无法移除注册的事件（函数表达式会被视为两个不同的参数，即使它们使用完全相同的代码）。如果你以后可能需要移除事件，最好的做法是使用一个单独的函数，并在两次方法调用中将函数名作为第二个参数。此示例所示：\n\
  \n![Images](img/f0274-01.jpg)\n\n由于这是现代浏览器中注册事件的标准方法，在本书的剩余部分，你将使用这种事件注册方法。\n\n\
  ### 捕获和冒泡阶段\n\n当元素内部包含其他元素，且这些元素都注册了相同的事件类型时，哪个事件先发生取决于使用捕获阶段还是冒泡阶段来注册事件。如果使用捕获阶段，最外层元素的事件先发生，最内元素的事件最后发生。如果使用冒泡阶段，则相反。最常用的是冒泡阶段，因为它具有最大的浏览器兼容性。\n\
  \n#### attachEvent() 方法\n\n`attachEvent()` 方法的工作方式与 `addEventListener()` 类似。然而，它只适用于事件冒泡，并且仅在\
  \ IE 9 以下的版本中有效，因此在这里引用它是为了防止你需要支持旧版本的 IE 时。\n\n![Images](img/f0274-02.jpg)\n\n\
  ### 事件对象\n\n当事件发生时，会创建一个名为 `event` 的对象，其中存储了关于事件的信息。这些信息可以被你的脚本使用，帮助它执行所需的操作。例如，键盘事件将在事件对象中存储关于被按下按键的信息。这允许你在按下不同按键时编写出不同的响应。\n\
  \n### DOM 和 Internet Explorer：DOM Level 0 注册\n\n在大多数浏览器中，通过使用名称 `event` 来访问事件对象。它可以作为唯一的参数传递给处理事件的函数，如下\
  \ DOM Level 0 代码所示：\n\n![Images](img/f0274-03.jpg)\n\n请注意，参数 `event` 被传递给了事件监听器。事件对象的\
  \ `type` 属性（返回事件类型）随后被用于向查看者显示警报，这将让人们知道是点击事件导致了函数的运行。参数可以是你喜欢的任何标识符，因此经常看到像 `e`\
  \ 或 `evt` 这样较短的标识符，而不是 `event`。使用你觉得舒服或你组织标准的即可。只要你保持一致，在这里任何标识符都是完全有效的。\n\n然而，Internet\
  \ Explorer 使用 `window.event` 来访问事件对象，这意味着 DOM Level 0 事件处理器将使用以下代码：\n\n![Images](img/f0275-01.jpg)\n\
  \n对于 DOM Level 0 函数，可以通过根据浏览器支持将所需的值赋值给变量，从而实现跨浏览器的事件对象，如下代码所示：\n\n![Images](img/f0275-02.jpg)\n\
  \n请注意，如果可用，则将变量赋值为事件对象，否则赋值为 `window.event` 对象。逻辑或 (`||`) 的使用允许你在值可用时提供首选值，或者在不可用时设置另一个（默认）值。现在变量\
  \ `e` 将跨浏览器地持有正确的值，可以使用它来警报事件类型。\n\n#### 在现代事件注册中使用 event\n\n当使用 `addEventListener()`\
  \ 或 `attachEvent()` 时，可以通过 `event` 访问事件对象。这允许你按预期使用事件对象。对于 `addEventListener()`，你可以使用以下代码：\n\
  \n![Images](img/f0275-03.jpg)\n\n对于 `attachEvent()`，你可以使用以下代码：\n\n![Images](img/f0275-04.jpg)\n\
