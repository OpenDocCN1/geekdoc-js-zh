  \n#### 设置过期日期\n\n为 cookie 添加过期日期可以防止它在浏览器关闭后被删除，也可以用于使不再使用的 cookie 过期。要设置过期日期，请在\
  \ cookie 字符串中多添加一些内容，如下所示：\n\n![Images](img/f0373-03.jpg)\n\n### 读取 Cookie\n\n如果你只设置了一个\
