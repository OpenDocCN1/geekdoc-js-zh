  \n## 入门：document.ready()\n\njQuery 需要的第一件事是确保所有 DOM 元素都已用于脚本。`document.ready()`\
  \ 方法确定 DOM 结构何时加载完成，然后运行其中的代码（通常是一个函数），如代码所示：\n\n![Images](img/f0471-01.jpg)\n\n\
  这被放在你的普通 JavaScript 代码中（例如你的 `.js` 文件）。注意代码开头的 `$`。这是 jQuery 选择器，用于你在 JavaScript\
  \ 代码中调用 jQuery 时使用。\n\n### 使用选择器\n\n在 jQuery 中，你可以通过 CSS 语法来选择元素，而不是使用典型的 JavaScript\
  \ 方法，如 `document.getElementById()` 或 `document.getElementsByClassName()`。例如，假设你有有一个以下代码：\n\
  \n![Images](img/f0471-02.jpg)\n\n这仅仅改变了几个 CSS 样式属性，但需要几行代码才能实现。在 jQuery 中，这段代码可以缩短为：\n\
  \n![Images](img/f0471-03.jpg)\n\n首先，你会发现“story” div 是使用 CSS 语法（`“#story”`）选择的而不是\
  \ `document.getElementById(“story”)`。这使得元素选择变得更短。此外，你会看到事件处理被直接绑定到事件名称（在本例中为 `“click”`），随后是事件发生时执行的函数。这让你不再需要编写跨浏览器的事件处理代码。接下来，你可以通过在\
  \ story 元素上使用 `css()` 方法来更改元素的 CSS。`css()` 方法接受一个对象作为参数，其中包含每个要更改的属性及其新值（全部带引号，类似于\
  \ JSON 语法）。通过这种方式，你不需要为想要进行的每个 CSS 属性更改编写单独的语句。\n\n要查看此示例的运行效果，你需要创建一个带有“story”\
  \ div 的 HTML 页面，如下代码所示：\n\n![Images](img/f0472-01.jpg)\n\n如果你使用的是 jQuery 的本地副本，可以在此处调用它而不是\
  \ Google 副本。你可以将此 HTML 页面保存为 `jqexample.html`。接下来，你想创建一个 JavaScript 文件，并将其保存为 `jqexample.js`。代码如下所示：\n\
  \n![Images](img/f0472-02.jpg)\n\n一旦代码就绪，在浏览器中打开 `jqexample.html` 并点击该 div 元素。文本应该变大并变成蓝色。图\
  \ 16-1 显示了更改之前的页面，而 图 16-2 显示了更改后的页面。\n\n![Images](img/F16-01.jpg)\n\n**图 16-1**\
  \   原始页面\n\n![Images](img/F16-02.jpg)\n\n**图 16-2**   点击 div 元素后的页面\n\njQuery 提供了许多选择器来帮助你在脚本中选择所需的元素。以下是最常用的选择器：\n\
  \n- `(*)`：选择文档中的所有元素\n- `(.*.*class_name*)`：选择所有具有所提供类名的元素\n- `(#*id*)`：选择具有提供 id\
  \ 的元素\n- `(*element_name*)`：选择所有 `element_name` 元素\n- `(*element_name.class_name*)`：选择所有具有\
  \ `class_name` 类的 `element_name` 元素\n- `(*element_name*[*attribute*=“*value*”])`：选择所有具有提供属性和提供值的\
  \ `element_name` 元素\n\n如果需要，可以在 [api.jquery.com/category/selectors](http://api.jquery.com/category/selectors)\
  \ 获取更多选择选项。\n\n**注意**\n\n在原生 JavaScript 中，`document.querySelectorAll()` 的作用与 jQuery\
  \ 选择器函数类似。\n\n### 修改类\n\n`addClass()` 和 `removeClass()` 函数使得在 jQuery 中更改元素的样式变得非常简单。如果你已经在\
  \ CSS 中编写了类，可以随时使用这些方法添加或删除它们。例如，假设你有一个相同的 HTML 页面（`jqexample.html`），你可以随时使用这些方法添加或删除它们。\n\
  \n\n\n当提供此参数时，元素将在指定的持续时间内在增加宽度和高度的同时逐渐淡入。在这里，“story”元素将在 1000 毫秒（1 秒）内淡入并增大尺寸。或者，你可以使用预设值“fast”（快）或“slow”（慢）来代替特定时间，如下代码所示：\n\
  \n![Images](img/f0476-03.jpg)\n\n其他方法的方法相同，但执行的动画不同：`slideDown()` 通过元素向下滑动到位置来显示它，`slideUp()`\
  \ 通过元素向上滑动并移出视线来隐藏它，`fadeIn()` 通过逐渐淡入来显示元素，而 `fadeOut()` 则通过逐渐淡出来隐藏元素。\n\n如果需要，你可以为这些方法中的任何一个提供第二个参数，这是一个回调函数，它会在效果执行完毕后立即执行。这对于将两个或多个效果串联在一起非常有用，在上一个效果完成后执行后一个。例如，以下代码将在\
  \ 500 毫秒内显示“story”元素，然后在 2000 毫秒内将其淡出：\n\n![Images](img/f0476-04.jpg)\n\n你可以通过使用回调函数作为\
  \ `fadeOut()` 方法的第二个参数继续该过程，然后根据需要继续添加回调函数，直到所需的效果全部完成。\n\n最后，如果你需要在元素上发生事件时阻止默认操作（例如，当你需要不跳转链接时），你可以使用\
  \ jQuery 事件注册，同时传入事件对象。这允许你调用 `event.preventDefault()`，如下代码所示：\n\n![Images](img/f0476-05.jpg)\n\
  \n如果你需要脚本在更多的浏览器中运行，jQuery 库被证明是一个非常有帮助的工具。由于它可以帮助进行元素选择、事件处理以及显示/动画方法，它让你在需要编写跨浏览器代码时少做一些工作。下一节提供了一些资源，如果你想深入研究\
  \ jQuery 库可以查看。\n\n## 进阶阅读\n\n你可以通过以下资源了解更多关于 jQuery 以及如何使用它的知识：\n\n- [`learn.jquery.com/`](https://learn.jquery.com/)\n\
