  \n### 确保表单的可访问性\n\n确保你的表单对用户可访问可能具有挑战性，因为你首选的布局可能无法被辅助技术（如 Jaws 或 Voice Over）正确解释。你可以做几件事来帮助确保大多数用户能够访问并使用你的表单。你可以按照预期顺序放置元素及其标签，使用\
  \ `<label></label>` 标签，或使用 `<fieldset></fieldset>` 标签，并确保不要假设用户启用了客户端脚本（如 `JavaScript`）。\n\
  \n#### 使用适当的元素和标签顺序\n\n在你的 HTML 代码中，标签文本和表单元素的顺序可以帮助辅助技术读取表单。例如，考虑以下输入字段：\n\n![Images](img/f0438-01.jpg)\n\
  \n在这里，辅助技术会寻找出现在表单元素之前的标签文本。由于第一个输入元素之前没有任何标签文本，用户只会被提示输入，而没有关于要输入什么信息的指示。之后，标签文本“Name”（姓名）将与\
  \ `zip_code` 框关联，这可能会导致用户输入意外的内容。\n\n为了纠正这一点，你只需移动标签文本并将其放在表单元素之前，如下代码所示：\n\n![Images](img/f0438-02.jpg)\n\
  \n现在，辅助技术可能会捕获到表单标签并允许用户输入预期的信息。同时使用 `name` 和 `id` 属性也有帮助，因为各种辅助技术也会获取这些属性。\n\n\
  这对于文本框、文本区域和选择框同样有效。然而，在处理复选框和单选按钮时，许多辅助技术期望元素先出现，然后是描述性标签。因此，在使用它们时应该调换它们的位置。\n\
  \n在处理按钮（如提交、重置或创建按钮）时，请务必使用 `value` 属性来描述按钮的功能，因为这正是辅助技术可能期望的。\n\n### 使用 `<label></label>`\
  \ 标签\n\n使用标签有助于你进一步指定哪个标签文本属于哪个表单元素。这里有一个示例：\n\n![Images](img/f0438-03.jpg)\n\n\
  在这里，由于标签处于其预期位置，你可以直接应用标签标签。如果你需要更具体并直接指向表单元素的 `id`，可以添加 `for` 属性，如下代码所示：\n\n![Images](img/f0439-01.jpg)\n\
  \n在这里，你为起始标签标签的 `for` 属性分配表单元素的 `id` 属性值，该元素将使用 `<label>` 和 `</label>` 标签包含的文本。在前一个示例中，`for`\
  \ 属性包含 `yourname`，它将文本链接到 HTML 代码中 `id` 为 `yourname` 的元素。\n\n### 使用 `<fieldset></fieldset>`\
  \ 标签\n\n在处理单选按钮和复选框时，使用 `fieldset` 可以帮助将它们分组到一个逻辑集合中。使用 `legend` 标签为可选择的选项标记，可以让用户知道预期选择什么。以下代码使用\
  \ `fieldset` 将一组用于选择水果类型的单选按钮组合在一起：\n\n![Images](img/f0439-02.jpg)\n\n在这里，将所有单选按钮组在\
  \ `<fieldset>` 和 `</fieldset>` 标签内，并在起始 `fieldset` 标签之后使用 `legend` 标签为组提供标记。然后，每个元素在\
  \ `fieldset` 内部正常地标记（也使用了标签标签）。\n\n#### 不要假设存在客户端脚本\n\n在最初编写表单时，最好不要假设可以使用 `JavaScript`\
  \ 或其他客户端技术。如果需要 `JavaScript` 才能使表单可用，那么许多用户将无法使用它，因为他们出于各种原因（如安全）禁用了 `JavaScript`。\n\
  \n最佳实践是允许表单发送到服务器端（服务器将处理表单并提供最重要的验证程序），即使在 `JavaScript` 不用的情况下。如下代码对于没有 `JavaScript`\
  \ 的人是无法使用的：\n\n```\n<input type=\"button\" onclick=\"this.form.submit();\" value=\"\
  Submit Form\">\n```\n\n在这种情况下，需要 `JavaScript` 事件处理器和方法来提交表单。使用传统的 `submit` 输入元素来创建提交按钮会更好。\n\
  \n如果你在使用某些 `JavaScript` 验证，你可以使用如下代码：\n\n![Images](img/f0440-01.jpg)\n\n这允许你在 `JavaScript`\
  \ 可用时运行 `JavaScript`（通过为 `submit` 事件创建事件监听器）。否则，`JavaScript` 提交事件将被忽略，表单将提交到服务器端脚本进行验证和处理。如果\
  \ `JavaScript` 可用，客户端验证程序可以减少一次往返服务器的次数。如果不可用，服务器端脚本将需要完成工作，但用户仍可以按预期使用表单。\n\n此外，在关闭\
  \ `CSS` 的情况下检查表单布局是一个好主意，因为你希望这种布局在这种情况下也是可用的。\n\n## 验证\n\n验证 `JavaScript` 表单是非常用的。例如，你可以在提交之前对输入进行验证，以减少信息不完整或错误的表单数量。在提交到例如通用网关接口（CGI）脚本、PHP\
  \ 脚本或 Java Servlet 之前对表单数据进行验证可以节省时间并减轻负载。\n\n### 技术\n\n大多数情况下，验证可以根据需要变得简单或复杂。你只需要根据需要的信息创建自己的自定义函数来验证你选择的表单字段。\n\
  \n\n\n\n\n例如，你可以使用正则表达式检查一个字段是否包含典型邮政编码（Zip code）的位数。如果不符合，你可以发送一个警告告诉用户邮政编码无效。以下代码展示了实现这一方法。首先是\
  \ HTML 代码：\n\n![Images](img/f0441-02.jpg)\n\n接下来是 JavaScript 代码：\n\n```javascript\n\
  // (JavaScript code would go here)\n```\n\n![Images](img/f0441-03.jpg)\n\n该代码使用正则表达式来检查五位数字。如果输入的不是五位数字，则函数将返回\
  \ `false`。当然，你可以扩展此代码以允许有时用于更精确地指定邮政编码内特定区域的额外数字。要这样做，请添加另一个输入字段并要求它必须有输入值。你可以在\
  \ JavaScript 中根据需要让验证变得尽可能严格或松散。不过，请记住，在应用层（你的服务器端脚本或程序），你将需要对验证例程格外小心，以确保坏数据或恶意数据不会提交到你的应用程序。\n\
  \n**提示**\n\n寻找验证脚本的一种方法是尝试检查 Web 上的某些网站。许多网站都有专门用于验证不同类型数据的特殊函数。如果你能找到适合你目的的函数，可以为你节省一些工作。\n\
  \n### 复选框和单选按钮\n\n在使用复选框和单选按钮时，你可能只想知道它们是否被用户 `checked`（勾选）。例如，你可以有一个如下表单：\n\n![Images](img/f0442-01.jpg)\n\
  \n在这种情况下，你想确保用户在提交表单之前勾选了 `agree`（同意）框。要在 JavaScript 中检查这一点，你可以使用复选框元素的 `checked`\
  \ 属性，如果元素被勾选，它返回 `true`，否则则返回 `false`。以下代码显示了这方面的示例：\n\n![Images](img/f0442-02.jpg)\n\
  \n在这里，如果 `agree` 复选框未被勾选，表单将不会提交。用户将收到一个警告，说明必须勾选“同意条款”复选框。\n\n如果你正在处理一组单选按钮，并只想确保其中一个选项已被选中，你可以结合\
  \ `document.getElementsByName()` 方法（参见第 9 章）和 `checked` 属性来确定是否是这种情况。例如，假设你有如下表单：\n\
  \n![Images](img/f0443-01.jpg)\n\n同一类别每个单选按钮的 `name` 属性将是相同的（这里是 `food`），这样只能选择一个选项。为了确保确实选中了其中一个选项，你可以使用以下代码：\n\
  \n![Images](img/f0443-02.jpg)\n\n这里要提到的最后一点是，验证应该在客户端和服务器端同时进行。虽然客户端验证很有帮助并可以减轻服务器的负担，但它不应该取代服务器端验证。由于客户端验证可以被轻易绕过，如果没有服务器端验证，可能会带来重大的安全风险！由于用户输入的数据可能是恶意的或可能在无意中破坏某些功能，最好始终在服务器端对用户输入的数据进行验证，以避免\
  \ SQL 注入和跨站脚本等安全问题。你将在第 16 章中看到更多关于这些问题的介绍。\n\n### 专家问答\n\n**问：验证是必要的吗？毕竟，这难道不能由服务器端应用程序处理吗？**\n\
  \n**答：** 是的，但使用客户端验证可以帮助你减轻服务器的负担，因为启用了 JavaScript 的用户在每次输入无效信息时都不需要访问服务器端应用程序。这对用户也有帮助，因为他们不需要重新加载整个页面来纠正任何无效信息。\n\
  \n**问：我可以验证哪些类型的输入？**\n\n**答：** 在大多数情况下，你可以按照你认为合适的方式验证你想验证的内容。你可以验证日期、名称、时间、地址、电子邮件、电话号码或你需要的任何其他内容。\n\
  \n**问：我可以验证选择框中的选择或文本区域中的文本，或者可能是其他某些输入类型吗？**\n\n**答：** 在这些某些情况下，你已经在元素中内置了自己的值。然而，如果可能，你仍然应该根据其他信息对这些值进行验证，以确保收到的信息符合你的需求。你只需要调整你的函数，根据不同的输入设备类型（文本区域、单选按钮等）执行所需任务即可。\n\
  \n**问：我不使用服务器端脚本，但我为了好玩使用 JavaScript 并想验证信息。我真的需要添加服务器端脚本吗？**\n\n**答：** 是否需要服务器端脚本取决于你的目的。如果你有一个需要保存信息、通过电子邮件发送或发送到数据库的表单，那么你需要服务器端应用程序。\n\
  \n在这里，每个 `name` 属性值为 `food` 的单选按钮元素都被放入 `food_array` 中。这允许你使用循环遍历每个单选按钮，检查它是否已被选中。一个名为\
  \ `selection_made` 的布尔变量初始设置为 `false`。在循环内部，如果脚本发现某个单选按钮已被选中，它会将 `selection_made`\
  \ 设置为 `true` 并使用 `break` 语句退出循环。你可以这样做，因为在运行循环后 `selection_made` 仍为 `false`——如果\
  \ `selection_made` 为 `false`，则取消表单提交。\n\n### 练习 15-1 请求号码\n\n`pr14_1.html`\n`pr14_1.js`\n\
