  \n### 尝试练习 15-2：使用 HTML5 或 JavaScript 验证电话号码\n\n在这个项目中，你将在上一个项目的基础上创建一个表单，使用新的 HTML5\
  \ `pattern` 属性验证电话号码。如果浏览器不支持 HTML5，则将运行备用的 JavaScript 验证。\n\n#### 逐步步骤\n\n**1.**\
