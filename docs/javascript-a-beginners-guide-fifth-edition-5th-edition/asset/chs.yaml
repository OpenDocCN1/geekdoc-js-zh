  \n你可以像使用 `fillStyle` 一样使用 `strokeStyle` 来设置形状轮廓或绘制线条（路径）的颜色。例如，以下代码将创建一个带有红色轮廓的矩形：\n\
  \n![Images](img/f0495-03.jpg)\n\n### 使用路径\n\n画布上下文还允许绘制线条和曲线（路径），这为你提供了创建更复杂图形的机会。通过调用\
