  \ 章：放置 JavaScript\n\n### 关键技能与概念\n\n在这个项目中，你将一段代码复制并粘贴到文本编辑器中并保存了文件。当你用 Web 浏览器打开保存的文件时，浏览器中显示了一行文本。这行文本是在浏览器窗口中通过\
  \ JavaScript 编写的。\n\n- 使用 JavaScript\n- 放置 JavaScript \n- 解释型语言在运行之前不需要编译程序。\n-\
  \ JavaScript 只能在 Web 浏览器环境中使用。\n- 在 JavaScript 中，由什么处理脚本中的错误？\n\n### 使用脚本标签\n\n\
  脚本标签用于告诉浏览器何时放置 JavaScript。在基本形式下，它们如下：\n\n```html\n<script>\n  alert(\"Hello World!\"\
  );\n</script>\n```\n\n起始标签和结束标签之间的脚本语言可以是 JavaScript、VBScript 或其他语言，尽管 JavaScript\
  \ 始终被设置为默认值。\n\n#### 识别脚本语言\n\n起始标签和结束标签之间的脚本语言可以是 JavaScript、VBScript 或其他语言，尽管\
  \ JavaScript 始终被设置为默认值。如果需要，可以通过在起始标签上添加值为 `text/javascript` 的 `type` 属性来显式地指定 JavaScript\
  \ 为语言：\n\n```html\n<script type=\"text/javascript\">\n  alert(\"Hello World!\");\n\
  </script>\n```\n\n**注意**\n- 起始标签中的 `type` 属性在 XHTML 中是为了使 Web 页面通过验证，但在 HTML 中是可选的。\n\
  - 过去使用 `language` 属性来识别脚本语言，但现代浏览器会忽略它，并且会导致页面在 XHTML 和 HTML5 中无效。\n- `charset`\
  \ 属性允许指定 JavaScript 代码的字符集，但大多数浏览器并不识别，因此不建议使用。\n\n#### 调用外部脚本\n\n脚本标签允许你在文档中调用外部\
  \ JavaScript 文件。外部 JavaScript 文件*是一个仅包含 JavaScript 代码的文本文件，并以 `.js` 扩展名保存。通过调用外部文件，你可以节省在每个需要脚本的页面中编写或复制长脚本的时间。相反，你可以在每个页面上使用单行代码指向包含所有代码的\
  \ JavaScript 文件。\n\n你可以通过在起始标签上添加 `src` 属性来调用外部脚本：\n\n```html\n<script src=\"yourfile.js\"\
  ></script>\n```\n\n\n\n\n如果脚本非常长，使用 `src` 属性将脚本添加到多个页面，会比在每个页面上插入整个代码要快得多。此外，浏览器会在第一次加载外部\
  \ JavaScript 文件时对其进行缓存，这使得后续使用该脚本的 Web 页面渲染速度更快。在处理页面验证以及尝试将脚本代码与标记（HTML）代码分离时，使用外部脚本也有帮助。此外，`src`\
  \ 属性允许你以相同的方式将他人的脚本文件作为库引入。\n\n默认情况下，脚本文件按照它们在 HTML 代码中放置的顺序加载（同步加载）。有一些选项可以更改这种行为，这些将在下一节中进行描述。\n\
  \n## 指定脚本的加载时机\n\n最后两个属性 `defer` 和 `async` 允许你指定外部脚本的加载时机。旧版浏览器并不完全支持这些属性，或者行为可能不同，因此请注意，旧版浏览器可能不会在预期的时间执行脚本。\n\
  \n### defer 属性\n\n`defer` 属性允许你指定加载外部脚本文件，但要在页面完成解析（`</html>` 标签已加载）之前执行它。下面的 `<script>`\
  \ 标签将推迟外部 JavaScript 代码的执行：\n\n```html\n<script src=\"file.js\" defer></script>\n\
  ```\n\n**注意**\n\n如果你正在使用 XHTML，请使用 `defer=\"defer\"` 设置此属性。\n\nInternet Explorer\
  \ 4+、Firefox 3.5+ 以及 Chrome 7+ 支持此属性。Internet Explorer 4–7 允许此属性也作用于内联脚本，但 8 及以上版本仅像其他浏览器一样，仅在外部脚本上支持此属性。\n\
  \n### async 属性\n\n当设置 `async` 属性时，页面可以继续加载而无需等待脚本加载，脚本将在完全加载后执行。这里是一个示例：\n\n```html\n\
  <script src=\"file.js\" async></script>\n```\n\n**注意**\n\n如果你正在使用 XHTML，请使用 `async=\"\
  async\"` 设置此属性。\n\nFirefox 3.5+ 和 Chrome 7+ 支持此属性。\n\n## 使用 <noscript></noscript>\
  \ 标签\n\n为那些不使用 JavaScript（或禁用了 JavaScript）的观众提供替代内容的一种方法是使用 `noscript` 标签。`<noscript></noscript>`\
  \ 标签可以放在 HTML 文档的任何位置，并可以包含那些在没有 JavaScript 的情况下浏览的观众所需的任何内容。例如：\n\n![Images](img/f0018-03.jpg)\n\
  \n此示例通过 JavaScript 或通过 `<noscript></noscript>` 标签内的文本向观众显示“颜色是红色的”这一句话。\n\n**警告**\n\
  \n某些旧版浏览器可能无法正确处理 `noscript` 标签，并且不会显示这两个部分的任何内容。如果你的用户使用旧版浏览器，另一种替代方案是在页面上显示内容，然后使用\
  \ JavaScript 为那些能够通过 JavaScript 显示内容的用户增强内容。\n\n`<noscript>` 标签有时很有用，但通常有更好的方法可以为没有\
  \ JavaScript 的用户提供相同的内容（例如避免使用 `document.write()` 方法）。随着对本书的阅读，你将学习更多关于无障碍 JavaScript\
  \ 的知识。\n\n## 专家问答\n\n**Q：我总是需要使用 script 标签向页面添加 JavaScript 吗？**\n\n**答：** 可以使用事件处理程序，允许你在\
  \ HTML 标签的事件处理属性中编写短小的脚本片段。你将在 第 13 章 中学习事件处理程序。\n\n**Q：语言属性（language attribute）呢？**\n\
  \n**答：** 语言属性曾被用于指定要使用的脚本语言，曾一段时间，某些浏览器允许指定 JavaScript 版本（例如，`language=\"JavaScript1.2\"\
  `）。现在已不再如此，该属性已被废弃。由于它在现代浏览器中被完全忽略，并且会导致页面在 XHTML 和 HTML5 中无法验证，因此不应再使用。\n\n**Q：当我在页面中添加脚本时，页面在\
  \ XHTML 严格（或过渡）模式下无法验证。我该如何让页面通过验证？**\n\n**答：** 如果脚本包含了 XHTML 中使用的字符，例如 `<`（它在 JavaScript\
  \ 中用于表示“小于”，但在 XHTML 中被视为新标签的开始），那么在不添加 `CDATA` 区域的情况下，直接将脚本放在文档中页面将无法通过验证：\n\n\
  ![Images](img/f0019-01.jpg)\n\n这将允许页面通过验证，但由于 `<![CDATA[` 和 `]]>` 字符位于脚本中，脚本将不再工作。要修复此，当这些字符位于脚本标签内时，你需要在这些字符周围使用\
  \ JavaScript 注释（`/*` 和 `*/`）：\n\n![Images](img/f0020-01.jpg)\n\n如你所见，这可能会很快变得非常繁琐！通常，如果你在使用\
  \ XHTML，更好的选择是使用外部脚本文件，这消除了这个问题，因为 XHTML 文档中只需要脚本标签本身。\n\n## 创建你的第一个脚本\n\n现在你已经知道如何使用\
  \ HTML script 标签来告诉浏览器文档中的 JavaScript，你已经准备好学习如何在这些脚本标签之间添加实际的 JavaScript 代码了。教学任何语言时通常提供的第一个代码示例是向默认输出区域写入某些文本，通常被称为基础“Hello\
  \ World”脚本。遵循这一惯例，你的第一个脚本将在 Web 页面上写入一段文本。\n\n### 编写“Hello World”脚本\n\n与其写“Hello\
  \ World”，你将在此脚本中使用另一行文本：“Yes! I am now coder!”。这只需要一行代码，使用 `document.write()` 方法：\n\
  \n```javascript\ndocument.write(\"Yes! I am now coder!\");\n```\n\n注意文本周围的括号。括号是必要的，因为\
  \ `document.write()` 是 JavaScript 函数，它接收一个参数。你将在 第 5 章 中学习更多关于 JavaScript 函数的知识。\n\
  \n引号表示字符串（string）。字符串是 JavaScript 中通过将值放在引号内定义的数据类型。第 4 章提供了字符串和其他数据类型的详细信息。\n\n\
  关于你的脚本的最后一点是行尾的分号。分号表示 JavaScript 语句（statement）的结束。语句是部分不需要添加任何内容即可完整的代码。语句可以用于执行单个任务、执行多个任务，或调用执行多个语句的脚本其他部分。大多数\
  \ JavaScript 语句以分号结束，因此养成添加分号的习惯是好的。\n\n**注意**\n\n在后面的章节中，你会看到各种不以分号结尾的行，因为它们开启或关闭了代码块。此外，你遇到的许多脚本可能以分号结束语句。JavaScript\
  \ 在大多数情况下对分号的使用是宽容的；然而，使用分号结束语句是最好的做法，它可以防止潜在错误并有助于调试（移除脚本中的错误）。\n\n### 为脚本创建 HTML\
  \ 文档\n\n为了使此示例完整并测试脚本，你需要将其插入 HTML 文档中。首先，创建以下带有基础标签的 HTML 文档（使用你喜欢的任何文本编辑器）：\n\n\
  ![Images](img/f0021-01.jpg)\n\n\n\n\n在你的文本编辑器中将文档保存为 `test1.html`。稍后你会用网络浏览器打开它以查看脚本结果。接下来，你把\
  \ JavaScript 代码添加到此 HTML 文档中，因此请保持文件打开状态。\n\n## 将脚本插入 HTML 文档\n\n现在你需要将脚本插入到文档中。它应该放在哪里呢？你可以将脚本放在\
  \ `<head>` 和 `</head>` 标签之间，或者放在 `<body>` 和 `</body>` 标签之间。由于此示例直接将文本字符串写入页面，因此你希望将脚本插入到\
  \ `<body>` 和 `</body>` 标签之间，取决于你想让文本字符串出现在任何地方。它可以出现在页面上任何 HTML 代码的之前、之后或之间。\n\n\
  为了清晰地展示脚本结果的出现，你将添加 HTML 代码在脚本前后编写几行文本。脚本标签和脚本本身被插入在这些行之间。在 `<body>` 和 `</body>`\
  \ 标签之间添加下所示行：\n\n![Images](img/f0021-02.jpg)\n\n再次保存 `test1.html` 文档。你现在应该能够在网络浏览器中打开该文档以查看脚本结果。图\
  \ 2-1 显示了加载网页时文本在浏览器中呈现的样子。\n\n![Images](img/F02-01.jpg)\n\n**图 2-1** 网络浏览器中的 test.html\
  \ 文件\n\n恭喜，你现在完成了第一个脚本！\n\n***注意***\n\n本节中的示例代码使用了整个 HTML 文档及其所有的标签。为了保持相关，从现在开始，示例代码将仅使用与脚本\
  \ HTML 标签，而不是所有的标签。项目代码可能根据需要使用整个 HTML 文档。\n\n#### 专家问\n\n**Q：为什么 `document.write()`\
  \ 命令中有一个点 (.)？**\n\n**A：** `Document` 是 JavaScript 的预定义对象之一，而 `write()` 是 `document`\
  \ 对象的预定义方法。点将对象和方法结合在一起使函数生效。第 10 章 解释了 JavaScript 对象，第 13 章 深入介绍了前端 JavaScript\
  \ 和 `document` 对象。\n\n**Q：我如何知道什么时候将脚本添加到 head 部分，什么时候添加到 body 部分？**\n\n**A：** 过去，JavaScript\
  \ 代码几乎总是放在 head 部分，使其与其余 HTML 代码保持在独立区域。现代编码实践通常是将所有 JavaScript 代码放置在外部 `.js` 文件中，并将\
  \ `<script>` 标签放在闭合的 `</body>` 标签之前。这确保了 HTML 页面已在浏览器中加载（因为大型脚本如果放在其他地方会延迟页面加载），从而给用户提供更好的体验。\n\
  \n### 尝试做 2-1 在 HTML 文档中插入脚本\n\n`pr2_1.html`\n\n此项目将让你练习在页面中添加脚本。你将创建一个 HTML 文档并插入一个脚本，该脚本将在页面加载时在浏览器窗口中显示一个短句。\n\
