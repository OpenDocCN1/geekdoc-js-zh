  ## 第 8 章\n\n## 对象\n\n### 关键技能与概念\n\n* 定义对象\n* 创建对象\n* 使用原型\n* 对象语句\n* 理解预定义的 JavaScript\
  \ 对象\n\n对象为你的脚本提供了更大的灵活性。它们可以作为存储数据的另一种方式，也可以用于创建可重用的结构。在本章中，你将学习什么是 JavaScript\
  \ 对象、如何创建对象，以及如何利用一些预定义的对象。\n\n## 定义对象\n\n（由于）\n\n由于 JavaScript 是一种基于原型的语言，对象的工作方式与它们在基于类的语言中不同。\n\
  \nJavaScript 对象基本上是属性和值的集合，在编程中被称为 `hash table`（哈希表）。正是这些值赋予了 JavaScript 极大的灵活性——值可以是任何数据类型，包括函数、数组和其他对象。\n\
  \n你可以使用对象将多个值从一个地方传递到另一个地方（你将发现当使用 JSON 在 JavaScript 和另一种语言之间传递数据时这非常有用，本书将在稍后讨论）。你还可以使用它们来描述一种通用对象，该对象可以许多特定的\
  \ `instances`（实例）。例如，你可以有一个通用的汽车对象，它可以用于构建特定的汽车类型（例如跑车、工作车、家用车）。每种汽车类型都可以从通用汽车对象继承属性名称，然后拥有自己特定的属性值。\n\
  \n### 创建对象\n\n现在你已经理解了对象以及它们的用途，可以开始创建你自己的 JavaScript 对象了。为了实现这一点，你将学习命名规范、对象的结构以及如何在你的对象中包含方法。\n\
  \n### 命名\n\n与变量和函数一样，在 JavaScript 中为对象命名时必须遵循某些规则。这些规则与你命名变量和函数时遵循的规则相同，你可以在 第 3\
  \ 章 中复习这些规则。\n\n#### 单对象\n\n在 JavaScript 中创建单对象有两种方法：使用对象构造函数或使用对象字面量符号。单对象适用于特定目的。\n\
  \n##### 对象构造函数\n\n对象构造函数看起来如下：\n\n```javascript\ncar = new Object();\n```\n\n通过使用对象名称\
  \ (car)，后跟一个点 (.)，然后是属性名称 (seats) 来访问 seats 属性的值。视图显示一个显示“cloth”的警告框。\n\n```javascript\n\
  car.seats = \"cloth\";\n```\n\n你也可以将命名函数赋值为方法，如下代码所示：\n\n```javascript\ncar.features\
  \ = function() {\n  alert(\"engine\");\n};\n```\n\n##### 对象字面量符号\n\n对象字面量符号使用大括号来包裹对象的属性和值。语法如下：\n\
  \n```javascript\nobject = {\n  property: value1, property2: value2\n};\n```\n\n\
  给定上一节使用的汽车对象，你可以使用以下代码用对象字面量符号重写它：\n\n```javascript\ncar = {\n  seats: \"cloth\"\
  ,\n  engine: \"engine\"\n};\n```\n\n\n\n\n\n# 括号表示法\n\n括号表示法允许你使用方括号（`[]`）访问属性值。这种表示法与数组使用的表示法相似，但在括号内使用的是字符串值而不是数字。你使用对象名，后面跟着左括号（`[`），然后是字符串形式的属性名，最后以右括号（`]`）结束。\n\
  \n以下代码展示了括号表示法的示例：\n\n![Images](img/f0199-01.jpg)\n\n在这里，访问了 `seats` 属性的值并将其显示给用户。\n\
  \n请注意，这种表示法要求属性名必须作为字符串值插入（在本例中使用了引号）。由于属性名是以字符串值插入在括号内的，因此它可以通过拼接和/或使用变量来组合。例如，考虑以下代码：\n\
  \n![Images](img/f0199-02.jpg)\n\n如你所见，这些每种方式都将产生相同的结果，并从 `car` 对象中获取 `seats` 属性的值。将弹出四个显示“cloth”的提示，因为每种组合求值都是\
  \ `car[\"seats\"]`。\n\n当你需要使用属性名但该名称存储在变量中时（例如，当值作为参数传递给函数时），括号表示法的这一特性就变得非常有用。由于点表示法只允许使用原始的属性名，它无法使用变量值：\n\
  \n![Images](img/f0199-03.jpg)\n\n在这里，使用的不是 `sts` 的值，而是在 `car` 对象中搜索名为 `sts` 的属性，这导致在未找到属性时返回一个\
  \ `undefined` 值。使用括号表示法，你可以让它正常工作：\n\n![Images](img/f0200-01.jpg)\n\n这一次，使用了变量 `sts`\
  \ 的值，即字符串“seats”，并向用户显示了“cloth”。\n\n## 应使用哪种表示法？\n\n使用哪种方法取决于情况。点表示法最常用，但当你需要组合属性名、使用变量的值，或使用像\
  \ `seat-type` 这样不符合 JavaScript 习惯的值时，应该使用括号表示法来成功访问属性值。\n\n### 尝试练习 8-1 创建一个计算机对象\n\
