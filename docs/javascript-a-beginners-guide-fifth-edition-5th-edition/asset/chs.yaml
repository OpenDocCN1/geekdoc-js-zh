  \n### 使用 Cookies\n\n*cookie* 是存储在终端用户计算机上的小型文本文件。只要 cookie 没有被删除或过期，访者每次返回你的网站时都可以随时引用它。当然，如果访者不接受\
  \ cookie，之后将无法设置或引用 cookie。使用 cookie 时记住以下几点：\n\n- 每个 cookie 必须是 4KB（4000 个字符）或少。\n\
  - 浏览器每个域最多接受 20 个 cookie。\n- 如果部分访者不接受 cookie，那么你的 cookie 对这些访者就失去了优势。\n\nCookies\
  \ 可以帮助用户更有效地浏览你的网站。例如，如果你在主页上使用脚本在页面加载时发送一个或多个提醒，你不希望每当访者每次访问你网站的其他页面并返回主页时都发生这种情况。这可能会非常恼人，以至于发生几次后你就再也没有访客了。提醒每次页面加载时都会弹出是因为\
  \ HTTP 缺乏状态持久化。Cookies 填充了这一空白，因为它们允许浏览器“记住”访者以前看过弹出提醒，从而在随后的页面访问中不再显示它。\n\n###\
  \ 设置 Cookie\n\n设置一个基础 cookie 就像给 `document` 对象的 cookie 属性赋值一样简单。唯一的限制是字符串内部不能有空格、逗号或分号。例如，你可以设置一个用于存储名称的\
  \ cookie，这样在你稍后设置了多个 cookie 时，就可以识别它。以下代码设置了一个基础 cookie：\n\n![Images](img/f0372-01.jpg)\n\
  \n**注意**\n\n在设置 cookie 时，记住不要在设置 cookie 数据的字符串内部使用空格、逗号或分号。\n\n当调用函数时，前面的代码会设置一个值为\
  \ `name=tasty1` 的 cookie。不过，你可以设置任何想要的分隔符（或者完全不设置，但设置分隔符允许你像查询字符串一样存储多个值），因此以下代码同样有效：\n\
  \n![Images](img/f0372-02.jpg)\n\n只要值不需要空格，添加额外信息并不困难，如下代码所示：\n\n![Images](img/f0372-03.jpg)\n\
