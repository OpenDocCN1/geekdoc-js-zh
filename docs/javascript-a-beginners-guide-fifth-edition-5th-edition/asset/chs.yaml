  一旦有了对象，你就创建一个所谓的*实例*（instance）。为了创建实例，你使用 `new` 关键字。数组也是对象，所以使用 `new` 会创建一个实例。\n\
  \n使用 `new` 创建 `Car` 对象的实例如下代码所示：\n\n![Images](img/f0202-02.jpg)\n\n你首先看到的是正在创建一个名为\
