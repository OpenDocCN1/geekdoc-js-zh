  \ 和 “Jennifer”。\n\n正如你所读到的，JavaScript 允许你在同一个数组中使用各种数据类型。以下代码也产生了一个有效的数组：\n\n![Images](img/f0166-03.jpg)\n\
  \n通过这种方式，你拥有极大的灵活性，因为你并不局限于数组中的一种数据类型。\n\n***注意***\n\n在使用数组构造函数时，提供单一数值作为参数将始终创建一个该长度的数组，而不是创建一个包含该数值作为唯一项的数组。因此，`let\
  \ students = new Array(4);` 将创建一个包含四个项的数组，而不是创建一个包含一个取值为 4 的项的数组。如果提供了多一个参数（无论是否为数字），则所有参数将如预期般用作项的值。\n\
