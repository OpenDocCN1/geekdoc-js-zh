  是的，现在你需要处理嵌套循环。与 if/else 块一样，你可以嵌套任意多层，只要你能处理。现在，你只需将一个循环嵌套在另一个循环中。下面的示例展示了一个 for\
  \ 循环内部的 for 循环：\n\n![Images](img/f0149-03.jpg)\n\n**注意**\n\n嵌套循环时要小心，确保每个嵌套循环在其第一行都有自己的计数器，例如\
  \ `for (count = 1; count < 11; count ++ )`。在大多数情况下，计数器需要对其所属的循环唯一。此外，如果花括号未包含或配对不正确，可能会发生错误。\n\
  \n现在你得到一个循环，它用自己的文本打断了外层循环的文本。每次执行外层循环时，你会输出“I am part of a loop!”这一行。然后，你会遇到另一个循环，它向屏幕输出“I\
  \ keep interrupting in pairs!”。\n\n内层循环被设置为重复两次；因此，每次外层循环输出一个句子，紧接着内层循环输出两个句子。为了更清楚地看到这一点，请考虑以下示例，它更新了你之前在\
  \ `loops01.js` 文件中使用的代码：\n\n![Images](img/f0150-01.jpg)\n\n图 6-4 展示了这个嵌套循环如何影响页面在浏览器中的外观。现在你可以看到，如果需要的话，嵌套循环如何有助于在过程中添加更多信息。\n\
  \n![Images](img/F06-04.jpg)\n\n**图 6-4**  嵌套循环在外层循环的文本中插入了文本。\n\n当你嵌套循环时，可以在内层循环中使用外层循环的\
  \ `count` 值，但不能反过来。例如，请看下面的代码：\n\n![Images](img/f0150-02.jpg)\n\n如你所见，`count` 值在外层循环中可用，而\
  \ `nestcount` 不可用。在内层循环中，`count` 和 `nestcount` 都可以使用。在使用嵌套循环时记住这一点，可以避免一些麻烦！\n\n\
  更复杂的是，你还可以将不同类型的块相互嵌套。例如，你可以在循环中放入 if/else 语句块，或者在 if/else 语句的 if 块或 else 块中放入循环。下面的示例在\
  \ for 循环中创建了一个 if/else 块：\n\n![Images](img/f0150-03.jpg)\n\n![Images](img/f0151-01.jpg)\n\
  \n在这种情况下，浏览器会检查 `count` 变量的值是否为 5。如果是，浏览器会向屏幕打印一条不同的消息。你可以通过调整 JavaScript 文件使其包含以下代码来最好地观察效果：\n\
  \n![Images](img/f0152-01.jpg)\n\n图 6-5 展示了这段代码在浏览器中运行的结果。注意第五行如何根据循环内的条件语句而不同。\n\
  \n![Images](img/F06-05.jpg)\n\n**图 6-5**  嵌套的 if/else 块导致第五行与其他行不同。\n\n如你所见，嵌套可以做很多事情。使用你刚刚学到的相同技术，你可以嵌套本书中涵盖的所有其他语句块；因此，对于其余语句的嵌套技术，我不会再详细说明。\n\
  \n## 无限循环\n\n在编写任何类型的循环时，都有可能创建所谓的无限循环，即永远无法完成的循环。这样的循环可能会持续运行，直到崩溃用户的计算机。尽管大多数现代浏览器在一段时间后可以检测到这一点并提示用户停止执行脚本，但这并不能保证，并且可能会给运行脚本的人带来问题。\n\
  \n为了避免无限循环，你需要确保设置的条件最终会返回 false。例如，下面的循环创建了一个永远不会返回的条件：\n\n![Images](img/f0153-01.jpg)\n\
  \n如你所见，`i` 被赋予一个初始值，并且每次循环都会递增。这意味着 `i` 将始终大于 10，从而产生无限循环。要修复此问题，请确保在循环中进行调整。以下是修复此循环的两个示例：\n\
  \n![Images](img/f0153-02.jpg)\n\n这里，`i` 递减而不是递增，最终会将值降到 10。\n\n![Images](img/f0153-03.jpg)\n\
  \n在这种情况下，条件被改为 `i < 50`，同时保持递增。\n\n## 多条语句\n\nfor 循环在初始化时也可以包含多条语句。这使你能够拥有多个计数变量。例如，如果你想按十计数，可以使用以下代码从\
  \ 10 到 100：\n\n![Images](img/f0153-04.jpg)\n\n这里，`i` 和 `j` 变量都被初始化（`i` 为 0，`j` 为\
  \ 10）并递增。`i` 的值每次递增 1，而 `j` 每次递增 10。条件 `i < 11` 会在循环运行十次后停止。最终结果是数字 10、20、30、40、50、60、70、80、90\
  \ 和 100 将显示在页面上。\n\n### while\n\nwhile 循环测试一个比较条件，并重复执行直到比较条件不再为真。以下代码展示了 while\
  \ 循环的一般结构：\n\n![Images](img/f0154-01.jpg)\n\n首先，注意在循环开始之前，变量 count 被赋值为 1。这一点很重要，因为与\
  \ for 循环不同，你不能在初始化 while 循环时声明变量。这个循环被设置为重复五次，考虑到变量的初始值以及每次循环变量值增加 1（`count++`）。\n\
  \n在 while 循环中，你还必须记得更改所使用的变量的值，以免陷入永久循环。关于 while 循环的实际示例，你可以重新创建句子重复脚本，使其使用 while\
  \ 循环：\n\n![Images](img/f0154-02.jpg)\n\n\n\n\n上述代码将产生与你的 `for` 循环相同的结果，只是外观不同，如图\
  \ 6-6 所示。在很多情况下，你可以根据个人偏好选择使用 `for` 循环或 `while` 循环，因为它们可以执行许多相同的任务。\n\n![Images](img/F06-06.jpg)\n\
  \n**图 6-6** 使用 `while` 循环重复了十行文本。\n\n关于 `while` 循环的嵌套，它的用法与 `for` 循环相同。你可以在 `while`\
  \ 循环内部插入另一个 `while` 循环、一个 `for` 循环或 `if/else` 块。如果你需要，也可以在其他语句块中插入 `while` 循环。\n\
  \n### do while\n\n`do while` 循环是一种特殊情况，因为循环内的代码至少会执行一次，即使使用的比较在第一次运行时返回 false。在其他循环中，如果第一次尝试比较就返回\
  \ false，将导致循环永远不会执行。在 `do while` 循环的情况下，循环会执行一次，然后之后每次都会检查比较，以决定是否应该重复。\n\n以下是一个运行五次的\
  \ `do while` 循环示例：\n\n![Images](img/f0155-02.jpg)\n\n注意，在上述代码的块的第一行中，关键字 `do` 和左大括号是唯一的内容。然后，当该块执行完成后，你会看到\
  \ `while` 语句和比较。`do` 关键字就是你确保代码块至少执行一次的方法。\n\n之后，浏览器会检查比较是否返回 true，然后进行重复。在这种情况下，循环会重复五次，因为变量\
  \ `count` 从 1 开始，并在每次通过循环时增加 1。当 `count` 的值达到 6 时，循环将被跳过且不再执行。另外注意，循环的末尾有一个分号来结束语句，这与其他类型的循环不同。\n\
  \n要查看一个即使在初始比较返回 false 也至少执行一次的 `do while` 循环示例，请看以下示例代码：\n\n![Images](img/f0155-02.jpg)\n\
  \n上述代码中的循环将只会运行第一次。当检查比较时（此时 `count` 将是 12，因为在循环执行过程中向它加了 1），它返回 false 且循环不再运行。\n\
  \n当你有一些代码需要至少执行一次，但只有在满足特定条件时才需要重复时，`do while` 循环是最有用的；否则，另外两个循环中的一个就足够完成任务了。\n\n\
  ### for in, for each in, and for of\n\n`for in` 循环允许你遍历对象的所有属性名称，`for each in` 循环允许你遍历每个属性的值，而\
  \ `for of` 循环允许你遍历各种类型的的可迭代对象。这些循环将在第 8 章中进行更详细的介绍。\n\n## 使用 break 和 continue\n\n\
  `break` 和 `continue` 语句允许你停止循环当前正在的操作，但它们的工作方式不同。正如你回在本章早些时候在 `switch` 块中使用 `break`\
  \ 语句所记忆的那样，`break` 语句会在该点停止循环并完全退出循环，移动到循环后的下一个 JavaScript 语句。例如，`break` 可以这样使用：\n\
  \n```\n![Images](img/f0156-01.jpg)\n```\n\n该循环将正常进行，直到 `count` 等于 `stopnumber` 的值（在本例中为\
  \ 5）。发生这种情况时，页面将写入一条特殊消息，并使用 `break` 语句完全结束循环。因此，循环并没有执行十次，而是只会执行五次。\n\n如果你决定在在该条件发生时不完全离开循环，你可以修改循环以使用\
  \ `continue` 语句。`continue` 语句将停止循环在当前单次循环中执行其后的任何语句。然而，它将返回循环的开头，并从上次停止的地方继续执行，而不是完全退出循环。例如，你可以使用以下代码：\n\
  \n```\n![Images](img/f0156-02.jpg)\n```\n\n这一次，当 `count` 等于 `skipnumber` 的值（在本例中为\
  \ 5）时，页面上不会写入任何内容。相反，循环被告知返回开头并从那里继续。结果是“我是循环的一部分！”这条消息只会被写入页面九次（实际上跳过了文本将被写入的第五次，并继续进行第六次）。图\
  \ 6-7 显示了这在浏览器中运行时的样子。\n\n![Images](img/F06-07.jpg)\n\n**图 6-7** 第五次迭代被跳过了，因此只显示\
  \ 1–4 和 6–10。\n\n当出现需要你完全停止循环或停止循环并从开始重启的特殊情况时，`break` 和 `continue` 语句将对你有帮助。\n\n\
  **专家问答**\n\n**问：循环除了反复向页面写入一行文本外还有其他用吗？**\n\n**答：** 是的，随着课程进行，你会发现它们的更多用途。在第 7 章中你会看到它们在处理数组时特别有用。\n\
  \n**问：在循环内部使用变量可以吗？这会导致问题吗？**\n\n**答：** 在循环内部使用变量是可以的，只要你没有意外地赋值。\n\n**问：当我想使用循环时，应该用\
  \ `for` 循环还是 `while` 循环？哪个更好？**\n\n**答：** 使用你个人喜欢的循环类型。通常，循环的类型取决于情况。在某些情况下，一种循环类型可能比另一种更合理。\n\
  \n**问：`do while` 循环对我有用吗？**\n\n**答：** 虽然 `do while` 循环有其用途，但除非你需要在一个检查之前至少运行一次循环的脚本，否则你不太经常使用它。然而，在本章中获得的\
  \ `do while` 循环知识会在你遇到使用它的脚本时对你有帮助。\n\n### 练习 6-2 使用 for 循环和 while 循环\n\n`pr6_2.html`\n\
  \n`prjs6_2.js`\n\n在这个项目中，你将利用 `for` 循环为练习 6-1 中的脚本添加另一个功能。假设你的在线商店还可以向每个可用城市交付数量数量物品。遗憾的是，你目前预算紧张，还没有在线订单功能。客户必须打印表单，填写每个项目编号，然后邮寄给你。你希望为客户显示一个可打印的表单，行数足够让客户订单该城市的最大数量。\n\
  \n#### 步骤说明\n\n1. 创建一个 HTML 页面并保存为 `pr6_2.html`。添加脚本标签以指向名为 `prjs6_2.js` 的脚本。\n\n\
  2. 创建一个外部 JavaScript 文件并保存为 `prjs6_2.js`。使用它完成第 3-5 步。\n\n3. 将 `prjs6_1.js` 中的 JavaScript\
  \ 代码复制粘贴到你的 `prjs6_2.js` 文件中。\n\n4. 在脚本中添加一个名为 `items` 的新变量并赋值为 0。\n\n5. 在 `switch`\
  \ 语句中添加代码，根据城市名称为 `items` 变量分配以下值：\n\n\n\n\n10 如果城市是 Johnstown。\n\n5 如果城市是 Donville。\n\
  \n2 如果城市是 Danieltown 或 Martyville。\n\n0 对于输入的任何其他城市名称，结果为 0。\n\n**6.** 在 `document.write(msg)`\
  \ 语句之后，添加额外的代码，使得如果 `items` 变量的值大于 0（使用一个 `if` 语句），则执行以下 `document.write()` 语句。\n\
