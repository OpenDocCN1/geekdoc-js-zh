  \ 变量将具有以下值：\n\n`oranges,apples,pears`\n\n你可以通过将该变量写入网页来查看此结果。以下代码将实现这一点：\n\n```javascript\n\
  document.write(fruit_string);\n```\n\n现在你可以看到从 `join()` 方法返回的字符串。图 7-3 显示了这段代码在浏览器中运行时的输出。\n\
