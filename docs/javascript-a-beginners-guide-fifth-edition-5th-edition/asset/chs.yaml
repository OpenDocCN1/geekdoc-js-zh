  \ 代码：**\n\n![Images](img/f0489-03.jpg)\n\n5. 保存 HTML 和 JavaScript 文件并在浏览器中打开 HTML\
  \ 文件。现在，内容在任何你选择的打开页面的浏览器中都应该是可访问的。\n\n#### 尝试总结\n\n在这个项目中，你利用了关于可访问性的知识，使文档和脚本对查看者更具可访问性。\n\
  \n### JavaScript 安全\n\n你可能已经注意到，当你尝试在主浏览器窗口上使用 `window.close()` 方法时，会出现一个确认框，询问你是否真的想允许关闭窗口。这种情况是\
  \ JavaScript 安全问题之一。浏览器不希望某个网站在未获得用户许可的情况下关闭由用户打开的窗口。如果允许这样做，程序员将对查看者的计算机拥有某些控制权，这可能会成为问题。\n\
  \n安全的另一个方面是一个误区，认为你可以用密码“保护”Web 页面，或者防止用户查看页面的源代码。\n\n安全的另一个方面是防范跨站脚本攻击——使用 JavaScript\
  \ 从未妥善过滤用户输入的服务器端应用程序中抓取信息。\n\n### 页面保护\n\n许多脚本试图以某种方式将查看者挡在外，例如使用密码保护或使用“禁用右键”脚本来防止查看页面的源代码。\n\
  \n然而，这些安全策略在很大程度上是无效的，因为这些“密码”和“禁用右键”脚本通常可以通过关闭 JavaScript 或多做一些工作来绕过。\n\n#####\
  \ 密码\n\n某些密码系统比其他的好，但似乎没有哪个真正能提供真正的 Web 页面安全。如果你不想让别人查看页面，存在比使用 JavaScript 系统更好的方法，例如使用服务器端语言或在你的\
  \ Web 服务器上使用某些设置。\n\n如果你使用的是免费 Web 托管服务，更好的方法可能可用也可能不可用。但请记住，JavaScript 密码系统并不是万无一失的，你不应该此类系统保护任何重要内容。\n\
  \n#### 隐藏 Web 页面源代码\n\n许多人都想隐藏 Web 页面的源代码。然而，JavaScript 并不会起作用。许多脚本尝试通过各种手段禁用右键。基本上，这些策略行不可通，因为它们可以通过两种方式绕过：\n\
  \n- 如果禁用了右键，你始终可以尝试选择“查看 | 显示源代码”。\n- 如果前一种方法不起，你始终可以关闭 JavaScript 或查看你电脑上的缓存文件夹。浏览器必须拥有显示页面的代码，因此其副本会进入浏览缓存。\n\
  \n从长远来看，这些脚本只是让查看源代码变得更加困难（而且它们很烦人）。\n\n##### 跨站脚本\n\n跨站脚本（通常缩写为 XSS）以恶意方式使用 JavaScript\
  \ 代码（或其他类型的代码），从具有漏洞应用程序的各种 Web 网站用户处获取信息。通过这些信息，他人可以使用别人的 cookie 或会话信息，并像他们是获取信息的那个用户一样访问该\
  \ Web 网站。这，无疑可能会导致大麻烦，特别是当该用户是管理员或该应用程序涉及资金时。\n\n虽然 JavaScript 是执行攻击的方法之一，但有漏洞的应用程序通常是服务器端的，并在页面上显示用户输入。如果输入没有经过清理（sanitized），则可能会输入许多恶意脚本。\n\
  \n例如，你可能有一个使用服务器端脚本允许人们发送评论的表单。脚本会将提交的评论显示给用户。如果输入没有经过清理，可以输入如下内容：\n\n```html\n\
  <script>alert(\"你被骗了!\");</script>\n```\n\n如果有人提交了这些并在响应页面上看到了警告，此人就会知道存在漏洞，并将后续用户引导至恶意\
  \ URL。图 16-6 显示了此类应用程序如何显示此类警告（此示例包含了一些评论以掩盖提交者的意图）。\n\n![Images](img/F16-06.jpg)\n\
  \n**图 16-6** 噢不！这对这个 Web 网站的用户来说太糟糕了！\n\n跨站脚本来一直在演变。最初，一个恶意站点可以在框架中（或弹出浏览器窗口中）加载良好的\
  \ Web 站点，然后使用 JavaScript 访问文本框、cookie 和其他数据（用户 ID 和密码）——因此被称为“跨站”。需要注意的是，在过去的几年里，现代浏览器不再允许这种跨站脚本。一个域名无法访问另一个域名的内容。现代跨站脚本攻击大多是此类示例中的注入攻击（尽管更为复杂）。\n\
  \n这个介绍只是触及了此类安全问题的冰角。最重要的是记住，当你使用服务器端应用程序时，必须对任何用户输入进行清理，以确保收到的是你预期的输入类型。有关此主题的更多信息，请访问\
  \ [www.owasp.org/index.php/Cross_site_scripting](http://www.owasp.org/index.php/Cross_site_scripting)。\n\
  \n### 来自 HTML 的 JavaScript 和 API\n\n\n\n\n\nHTML5 为许多元素和标记提供了 API（应用程序编程接口），允许你创建更具动态的\
  \ Web 页面或应用程序。其中一些功能包括通过 `<canvas>` 元素进行动态绘制、本地存储以及元素的拖放和放置。这些功能在支持 HTML5 和相应的 JavaScript\
  \ 接口的浏览器中可行。首先，你将查看 HTML5 的 `<canvas>` 元素。\n\n### `<canvas>` 元素\n\n`<canvas>` 元素允许你在页面渲染时使用\
  \ JavaScript 创建图形。当将 `<canvas>` 元素放置在页面上时，它会创建一个矩形区域（基于其宽度和高度属性），在该区域可以绘制图形。例如，以下代码将创建一个\
  \ 400×400 像素的绘图区域：\n\n```html\n<canvas width=\"400\" height=\"400\" id=\"graphic\"\
  ></canvas>\n```\n\n起始标签和结束标签之间的任何内容都将在不支持 `<canvas>` 元素的浏览器中显示，如下如下面的代码所示：\n\n```html\n\
  <canvas width=\"400\" height=\"400\" id=\"graphic\">我的精彩画作!</canvas>\n```\n\n要在\
  \ JavaScript 中开始使用 `<canvas>` 元素，你需要通过其 id 获取该元素，然后使用 `getContext()` 方法创建绘制上下文。`getContext()`\
  \ 方法接受一个参数，即正在创建的上下文的类型。大多数现代浏览器都支持 2D 上下文。3D（三维）上下文正在开发中。这里是一个示例，为你正在使用的 `<canvas>`\
  \ 元素打开 2D 上下文：\n\n![Images](img/f0492-03.jpg)\n\n一旦获取了上下文，就可以开始使用它来绘制线条、形状、文本等。\n\
  \n### 矩形\n\n可以使用 `fillRect()` 或 `strokeRect()` 方法在上下绘制矩形。`fillRect()` 方法将创建一个填充颜色的矩形，而\
  \ `strokeRect()` 将创建一个有轮廓但没有填充颜色的矩形。两种方法都接受四个参数：左上角的 `x` 坐标、左上角的 `y` 坐标、宽度和高度。例如，以下代码将绘制从\
  \ (70, 70) 开始、宽为 50 像素、高为 30 像素的填充矩形：\n\n![Images](img/f0492-04.jpg)\n\n图 16-7 显示了它在浏览器中的外观。注意画布没有轮廓。如果你想给它添加轮廓，可以使用\
  \ CSS 添加一个可见的边框。\n\n![Images](img/F16-07.jpg)\n\n**图 16-7** 带有填充矩形的画布\n\n画布上的原点是左上角，因此，较高的\
  \ `x` 坐标会将点向右移动更多，而较高的 `y` 坐标会将点向下移动更多。图 16-8 显示了当绘制示例矩形时画布网格是如何布局的。\n\n![Images](img/F16-08.jpg)\n\
  \n**图 16-8** 显示画布布局的示例\n\n如果你决定更想要一个不填充颜色的轮廓矩形，可以使用代码中的 `strokeRect()` 代替，如下代码所示：\n\
  \n![Images](img/f0493-02.jpg)\n\n如果你需要清除画布上的某个矩形区域，可以使用 `clearRect()` 方法。它使用与 `fillRect()`\
  \ 相同的四个参数，但会清除（使透明）它影响的区域。例如，你可以使用以下代码清除填充矩形内部的矩形：\n\n![Images](img/f0494-02.jpg)\n\
  \n图 16-9 显示了这段代码的结果。注意现在填充的矩形内部现在有一个被清除的区域。\n\n![Images](img/F16-09.jpg)\n\n**图\
  \ 16-9** 矩形现在内部有一个空的矩形区域。\n\n### 使用 `fillStyle` 和 `strokeStyle`\n\n形状或轮廓的默认颜色是黑色\
  \ (#000000)。要使用不同的颜色，你可以通过 `fillStyle` 属性设置填充颜色，通过 `strokeStyle` 属性设置线条描边（轮廓或线条）的颜色。例如，考虑这段代码：\n\
  \n![Images](img/f0494-03.jpg)\n\n在这里，`fillStyle` 被设置为 #FF0000（红色），在此赋值后的任何形状都将使用红色作为填充颜色。在你在使用不同颜色的形状时，可以随时更改它，如下代码所示：\n\
  \n![Images](img/f0495-01.jpg)\n\n如果你有特定的设置（如 `fillStyle` 和 `strokeStyle`）想要以后保存，可以使用\
