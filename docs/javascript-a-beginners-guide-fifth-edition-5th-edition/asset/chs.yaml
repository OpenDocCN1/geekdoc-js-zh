  \n**专家问答**\n\n问：你的意思是我可以像写 HTML 属性一样，通过事件处理器写一些 JavaScript 代码吗？\n答：是的，但请记住，给元素一个\
  \ `id` 属性并在 JavaScript 代码中响应事件有助于保持你的 HTML 更加整洁。\n\n问：你可以在按钮以外的元素上使用事件吗？\n答：是的，几乎任何元素都可以对事件做出反应。你将在下一节中学习更多关于\
