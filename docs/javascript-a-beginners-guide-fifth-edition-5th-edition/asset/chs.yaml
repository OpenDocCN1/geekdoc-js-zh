  - [www.w3schools.com/js/ajax_intro.asp](https://www.w3schools.com/js/ajax_intro.asp)\n\
  \n### JSON\n\nJSON 代表 JavaScript Object Notation（JavaScript 对象表示法）。它是一种可以在许多语言中使用的数据格式，使其在使用\
  \ AJAX 时的完美伴侣。如果你向服务器端应用程序发送 JSON 数据，这些语言中的大多数都有解析器可以获取这些信息并将其放入可用的形式。\n\n#####\
  \ JSON 对象或 JSON 解析器？\n\n大多数现代浏览器都支持 JSON 对象：Firefox 3.5+、Internet Explorer 8+、Chrome\
  \ 等。如果你需要在旧版浏览器的 JavaScript 中使用 JSON 数据，可以使用由 Douglas Crockford 编写的解析器，位于 [github.com/duglascrockford/JSON-js](http://github.com/duglascrockford/JSON-js)。\n\
  \n##### JSON 格式\n\n通常你会发送或接收包含数据的数组或对象。JSON 格式直接采用了 JavaScript 的数组字面量和对象字面量。例如，JSON\
  \ 格式的数组可能如下：\n\n```\n[2, 5, \"Cool\"]\n```\n\n注意这没有赋值给变量；它本身就是以 JSON 格式传递的数据。JSON\
  \ 对象或 JSON 解析器会将数据转换为使用它的语言所需的格式。\n\n对于对象，JSON 还要求对所有字符串（包括属性名）使用双引号。例如，一个 JavaScript\
  \ 对象可能如下：\n\n```javascript\nlet info = { num: 77, color: \"red\" }\n```\n\n在 JSON\
  \ 格式中，属性名也需要引号，如下代码所示：\n\n```json\n{ \"num\": 77, \"color\": \"red\" }\n```\n\n\
  如果你需要编写或解析 JSON 数据，请记住这些规则以避免在发送或接收数据时出现错误。\n\n##### 使用 JSON 对象\n\nJSON 对象有两个方法：使用\
  \ `stringify()` 向另一个应用程序发送 JSON 数据，以及使用 `parse()` 将 JSON 数据转换为 JavaScript 值。例如，如果你正要从\
  \ JavaScript 向另一个应用程序发送数据，你可以轻松地使用 `JSON.stringify()` 将其转换为 JSON 格式，如下代码所示：\n\n\
  ![Images](img/f0462-04.jpg)\n\n\n\n\n\n一旦你拥有了一个 `XHR` 对象，就可以通过 `send()` 方法发送 `j_data`\
  \ 变量。请注意，如果你将数据转换为 JSON 格式，你还必须使用 `post` 并设置 `set.setRequestHeader(\"Content-Type\"\
  , \"application/json\")`。\n\n在接收 JSON 数据时，你会使用 `JSON.parse()` 方法将数据从 JSON 格式转换为可用的\
  \ JavaScript 值。例如，假设你正在 JavaScript 中接收到以下 JSON 数据：\n\n```json\n{ \"num\": 77, \"\
  color\": \"red\" }\n```\n\n如果将这些 JSON 数据读取到一个名为 `xhr` 的 `XHR` 对象的 `responseText`\
  \ 中，你可以像下面的代码一样将数据转换为可用的 JavaScript 对象：\n\n```javascript\nlet info = JSON.parse(xhr.responseText);\n\
  ```\n\n现在将创建 `info` 对象，这等同于你编写了以下代码：\n\n```javascript\nlet info = { num: 77, color:\
  \ \"red\" };\n```\n\n凭借这种快速将数据转换为可用 JavaScript 值的能力，JSON 可以让你的 AJAX 脚本中的数据收集和使用变得更加简单。\n\
  \n### AJAX 和 JSON 示例\n\n假设你想更改本节之前提到的 AJAX 脚本，该脚本显示投票的当前获胜者。与其只显示当前获胜者，你还想显示所有的当前结果。回想一下如果没有\
