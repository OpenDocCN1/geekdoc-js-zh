  \ JavaScript 和表单的知识创建了一个验证表单的脚本。脚本验证用户输入的号码以检查其是否为有效的电话号码。\n\n## HTML5 与表单\n\nHTML5\
  \ 提供了几个新元素，以及许多新的输入类型和属性。它还提供了一种让浏览器在客户端对字段进行验证的方法，从而减轻了支持新特性的浏览器中 JavaScript 的负担。\n\
  \n### 新元素\n\nHTML5 中新的表单相关元素列于表 15-3。\n\n![Images](img/f0446-01.jpg)\n\n**表 15-3**   HTML5\
  \ 中新的表单相关元素\n\n\n\n\n\n这些元素允许你向观众提供额外信息或执行其他有用的任务。你将在本节中查看 `meter` 和 `progress`\
  \ 元素，但关于这些元素的元素的更多细节（包括哪些浏览器支持每个元素），请参见 [wufoo.com/html5/](http://wufoo.com/html5/)。\n\
  \n## meter 元素\n\n`meter`元素用于根据你定义的刻度显示值。例如，如果你决定使用 0–100 的刻度，你可以给 `min` 属性赋值为 0，给\
  \ `max` 属性赋值为 100。在该刻度上显示的实际值由 `value` 属性提供。例如，若要在 0–100 的刻度上显示 55，可以使用以下代码：\n\n\
  ```\n<meter min=\"0\" max=\"100\" value=\"55\"></meter>\n```\n\n将在支持该元素的浏览器中显示一个计量条，显示进度条在可用的\
  \ 100 个单位中填充了 55 个。图 15-4 显示了这在支持的 Google Chrome 版本中的外观。\n\n![Images](img/F15-04.jpg)\n\
  \n**图 15-4**  显示了一个计量条。\n\n对于不支持该元素的浏览器，你可以在起始标签和结束标签之间插入文本来提供显示的默认文本，如下代码所示：\n\n\
  ```\n<meter min=\"0\" max=\"100\" value=\"55\">55</meter>\n```\n\n这将简单地在计量条本出现的页面上显示\
  \ 55。\n\n这可以结合 JavaScript 使用，向用户显示有用的信息，例如测验中正确回答了多少问题。例如，假设你有下以下的 HTML 代码：\n\n\
  ![Images](img/f0447-03.jpg)\n\n这里创建了一个快速数学测验表单，允许观众在文本框中输入答案，然后提交答案进行检查。将使用一个 `id`\
  \ 为 `grade` 的空 `div` 通过 JavaScript 显示答案。以下代码显示了如何将 `meter` 标签作为视觉辅助来显示正确答案的数量：\n\
  \n![Images](img/f0447-04.jpg)\n\n![Images](img/f0448-01.jpg)\n\n在这里，当表单提交时会对测验进行评分。创建一个名为\
  \ `num_correct` 的变量，初始值为零；名为 `num_questions` 的变量通过获取 `qs` 数组的 `length` 获取测验中的问题数量（该数组包含每个文本框输入元素）；变量\
  \ `grade_HTML` 被赋值一个空字符串，该字符串将用 `meter` 标签和其他文本填充，以显示结果。\n\n创建了一个循环来遍历 `qs` 数组，获取每个值，并判断它是否等于\
  \ `ans` 数组中对应的正确答案。注意，使用一元运算符 `+` 尝试在与正确答案比较之前将用户的输入强制转换为数字，因为每个文本框默认返回字符串。如果答案正确，则将其加到\
  \ `num_correct` 变量中。\n\n接下来的代码行创建了最终放置在 `grade` `div` 中的 HTML 字符串。注意 `meter` 标签的\
  \ `max` 属性被赋值为 `num_questions` 变量的值，`value` 属性被赋值为 `num_correct` 变量的值。在 `meter`\
  \ 元素之后还会显示额外的消息，告诉用户计量条显示的是什么类型的结果（例如，如果两个答案正确，消息为“2/3 Correct”）。\n\n在这种情况下，如果用户没有获得所有正确答案，可以编辑条目并再次提交检查，直到获得\
  \ 3/3。图 15-5 显示了该脚本在两个答案正确时的结果。\n\n![Images](img/F15-05.jpg)\n\n**图 15-5**  显示计量条以指示正确回答了多少问题。\n\
  \n## progress 元素\n\n`progress`元素与 `meter` 类似，但它显示的是百分比而不是标量值。例如，要在进度条上显示 100% 中的\
  \ 25%，可以使用以下代码：\n\n```\n<progress max=\"100\" value=\"25\">25%</progress>\n```\n\
  \n与 `meter` 类似，你可以使用 `max` 属性设置最大值，使用 `value` 属性设置从 0 到最大值范围内的百分比值。如果需要，你可以修改之前的\
