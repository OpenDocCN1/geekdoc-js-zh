  \ Explorer 9 之前不支持。\n\n这就是所有的方法了！现在你可以测试所学的知识了。\n\n### 提问专家\n\n**问**：所以 `length`\
  \ 属性返回字符串中的字符数量，但字符串方法从 0 开始计数。这和数组一样令人困惑。有什么简单的方法吗？\n\n**答**：最简单的方法可能是记住 `length`\
  \ 属性从 1 开始计数，而方法从 0 开始计数。因此，`length` 属性的值比最后一个的位置大一。所以，如果字符串的长度为 5，对于方法来说这意味着字符串的最后一个位置是位置\
  \ 4。\n\n**问**：是的，但同样令人困惑的是，`slice()` 和 `substring()` 方法的第二个参数比方法停止删除字符的位置高。这是为什么？\n\
  \n**答**：这在开始时确实很困惑。你只需要习惯每个方法的工作方式。如果你使用得足够频繁，就会记住在什么情况下使用哪些数字。\n\n**问**：我为什么需要\
