  \ Web 浏览器中显示时，会显示一行纯文本，随后是外部 JavaScript 文件的结果。\n\n## 使用 JavaScript 注释\n\n你可能需要在\
  \ JavaScript 代码中做笔记，例如描述某行代码的作用。你也可能想出于某些原因禁用脚本中的某行。例如，如果你正在查找脚本中的错误，可能想要禁用脚本中的某行，以查看它是否是导致错误的行。你可以通过使用\
  \ JavaScript 注释来完成这些任务。你可以插入单行或多行的注释。\n\n### 插入单行注释\n\n如果你想在代码的单行中添加注释，在注释文本之前放置一对正斜杠：\n\
  ```javascript\n// 在这里输入注释\n```\n在此格式下，该行中两个斜杠之前的任何内容都是“活的”代码——即将被执行的代码——而该行中斜杠之后的任何内容都会被忽略。例如，假设你在代码中写了这一行：\n\
  ```javascript\ndocument.write(\"This is cool!\"); // 写出我的观点\n```\n浏览器将运行 `document.write()`\
  \ 方法，因此文本“This is cool!”将被写入页面。然而，斜杠后的注释将被 JavaScript 解释器忽略。\n\n如果你将正斜杠放在一行的开头，解释器将忽略整行。假设你将上一个示例中的斜杠移动到成为该行的第一个项目：\n\
  ```javascript\n// document.write(\"This is cool!\"); writes out my opinion\n```\n\
  在此格式下，整行都被忽略了，因为它以代表 JavaScript 注释的两个斜杠开头。文本将不会写入页面，因为代码将不会执行。实际上，你禁用了 `document.write()`\
  \ 语句。如果包含这一行的脚本有错误，且你想知道这一行是否导致了问题，你可能希望这样做。\n\n需要记住的一点是，同一行上的任何进一步的注释标记（`//`）都将失效，因此以下代码：\n\
  ```javascript\n// document.write(\"This is cool!\"); writes out my opinion\n```\n\
  等同于：\n```javascript\n// document.write(\"This is cool!\"); // writes out my opinion\n\
  ```\n第一个注释标记会注释掉行的剩余部分，无论是否有额外的单行注释标记。\n\n### 添加多行注释\n\n用一对正斜杠表示的注释仅适用于它们出现的那行；其影响在行尾处截止。你可以通过在每行代码上添加斜杠来使这种注释跨越多行，如下例所示：\n\
  ![Images](img/f0029-01.jpg)\n\n要添加不分每行都放置斜杠的跨越任意行的注释，你可以使用不同的注释格式：在注释开头使用一个正斜杠加一个星号，然后是注释文本，最后在注释结束使用一个星号后跟一个正斜杠。这是一个示例：\n\
  ![Images](img/f0029-02.jpg)\n\n使用这种格式，你可以在某行开始注释，并在另一行结束。\n\n当你想要插入较长的描述或其他文本时，多行注释会非常方便，但使用它们时需要小心。看这个示例，看看你是否能发现它的问题：\n\
  ![Images](img/f0029-03.jpg)\n\n你注意到缺少了 JavaScript 注释结束符号了吗？当你使用多行注释时，你需要注意这一点。如果你将正斜杠放在一行的开头，解释器将忽略整行。假设你将上一个示例中的斜杠移动到成为该行的第一个项目：\n\
  ```javascript\n// document.write(\"This is cool!\"); writes out my opinion\n```\n\
  在此格式下，整行都被忽略了，因为它以代表 JavaScript 注释的两个斜杠开头。文本将不会写入页面，因为代码将不会执行。实际上，你禁用了 `document.write()`\
  \ 语句。如果包含这一行的脚本有错误，且你想知道这一行是否导致了问题，你可能希望这样做。\n\n*(注：原文此处存在大量重复的段落，翻译时已按要求保持逻辑一致并避免了重复输出)*\n\
  \n\n\n\n\n# 10. 什么时候使用外部 JavaScript 文件是一个好主意？\n\n**A.** 当脚本很短且仅在一个 HTML 文档中使用时\n\
  \n**B.** 当你的网站的访问者使用较旧的浏览器时\n\n**C.** 当脚本非常长或需要放置在多个一个 HTML 文档中时\n\n**D.** 外部文件不是一个好主意\n\
