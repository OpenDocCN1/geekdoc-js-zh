  \n### 属性值\n\n虽然这并不是房地产，但你可以更改你的属性值。在脚本中，你可以通过给对象属性分配新值来动态地更改其值，就像操作变量一样。例如，如果你想更改之前示例中\
  \ `work_car.engine` 属性的值，只需为其分配一个你选择的新值即可。下面的示例显示了为 `work_car.engine` 属性分配新值：\n\n\
  ![Images](img/f0204-02.jpg)\n\n虽然这可能不是个好主意，但它可以帮你节省保险费（以及汽油）！\n\n需要注意的是，前面的赋值将改变更改之后对该属性进行任何调用时的\
  \ `work_car.engine` 的值。在更改之前对该值进行的任何操作都不会受到影响。\n\n例如，下面的代码为 `work_car.engine` 属性提供了一个新赋值：\n\
  \n![Images](img/f0204-03.jpg)\n\n`work_car.engine` 属性最初设置为“V-6”，但被更改为了“V-4”。当它被赋值给\
  \ `original_work_car_engine` 变量时，它仍然是“V-6”，该变量保留了该值。更改后，新值被分配给新的 `new_work_car_engine`，它使用了新值“V-4”。图\
  \ 8-2 显示了在浏览器中运行此脚本的结果。\n\n![Images](img/F08-02.jpg)\n\n**图 8-2** 属性值的更改会影响更改后使用它的语句，但不会影响更改之前使用的语句。\n\
  \n### 添加方法\n\n要向构造函数添加一个方法，你可以将函数表达式赋值给属性名，如下代码所示：\n\n![Images](img/f0205-02.jpg)\n\
  \n如你所见，一旦你有了对象的实例，就可以使用实例名、点和方法名来调用该方法。当为 `work_car` 实例调用方法时，页面上会显示字符串“这辆汽车有这些功能：布质座椅、V-6\
  \ 引擎、磁带机”。\n\n虽然向构造函数添加方法很简单，但在构造函数内部包含方法也有缺点。对于对象的每个新实例，都会创建一个执行相同操作的新方法函数。从本质上说，方法被多次复制，即使在代码中没有直接看到它。\n\
  \n正如你所看到的，构造函数内部的方法仅仅是另一个属性。由于每个属性对于每个实例都是唯一的，因此方法函数对于每个实例也是唯一的。如果你有 50 个 `Car`\
  \ 对象的实例，就会创建 50 个函数，从而消耗资源。\n\n为了使其成为一个可以简单重复使用的单一函数，你可以将方法函数移动到构造函数外部，如下代码所示：\n\
  \n![Images](img/f0206-01.jpg)\n\n在这里，构造函数外部定义了一个名为 `describe_car` 的函数，允许它被赋值给构造函数内部的\
  \ `describe` 属性，使其成为一个方法函数。注意，赋值时没有使用括号`()`。这是因为赋值给 `describe` 属性的是函数本身，而不是函数的结果。当创建实例并运行方法时，你将获得之前相同的结果，因此移动成功了。\n\
  \n然而，这种技术也有一个缺点：方法函数现在是全局的，这可能会导致全局作用域充斥着许多本应处于 `Car` 结构局部作用范围内的函数。要解决这个问题，你需要学习原型（Prototypes）。\n\
  \n### 使用原型\n\nJavaScript 中的每个函数都有一个被称为 `prototype` 的属性，它是一个对象，包含了使用该函数创建的每个实例都始终可用的属性和方法。这允许代码在实例之间轻松复用共享属性和方法。\n\
  \n##### 使用原型工作\n\n为了查看原型是如何工作的，你将在你的 `Car` 对象中使用 `prototype` 属性。考虑以下代码：\n\n![Images](img/f0206-02.jpg)\n\
  \n注意函数 `Car` 如何拥有原型属性（`Car.prototype`）。由于原型本身是一个对象，你可以像处理任何其他对象一样向原型添加属性。在这里，通过使用\
  \ `Car.prototype.lock` 并赋值，向 `Car` 原型添加了一个名为 `locks` 的属性。\n\n那么这到底做了什么？如果你添加 `Car`\
  \ 对象的实例，你会发现每个实例都可以访问 `locks` 属性：\n\n![Images](img/f0207-01.jpg)\n\n两个警框都会显示值“automatic”，这个值不在\
  \ `Car` 构造函数中，但在 `Car` 的原型中找到。\n\n这是如何发生的？在 JavaScript 中，调用对象的属性或方法会首先检查对象。如果对象中没有找到，它会检查原型。如果在原型中找到了匹配项，就会停止搜索，该属性对对象可用。例如，图\
  \ 8-3 显示了 `work_car` 实例查找 `locks` 属性的过程。\n\n![Images](img/F08-03.jpg)\n\n**图 8-3**\
  \ 查找 locks 属性\n\n如你所见，它简单检查 `work_car` 实例的 `locks` 属性。如果那里没有，则搜索原型，在那里找到了 `locks`\
  \ 属性并对对象可用。注意，原型有一个名为 `constructor` 的属性，指向构造函数。\n\n构造函数和由该构造函数创建的实例都指向原型。在这种情况下，`Car`、`work_car`\
  \ 和 `family_car` 都指向原型，并可以使用原型中的任何属性或方法。\n\n在创建实例时，你实际上可以在实例上添加一个与原型中属性同名的属性。这有效地为该实例隐藏了原型中同名属性的值，因为该属性将在对象中找到，而不会搜索原型。例如，看下面的代码：\n\
  \n![Images](img/f0208-01.jpg)\n\n在这里，为 `work_car.locks` 赋值确保了在 `work_car` 实例中找到\
  \ `locks` 属性，而不搜索原型。因此，`work_car.locks` 的值为 manual。由于这不会影响其他实例，`family_car.locks`\
  \ 仍然需要搜索原型查找值，因此它仍然是“automatic”。\n\n##### hasOwnProperty() 方法\n\n有时你想知道所使用的属性是在实例中找到的还是在原型中。对象的\
  \ `hasOwnProperty()` 方法如果属性在实例中则返回 `true`，否则返回 `false`。在在上一个示例中，`work_car` 实例拥有\
  \ `locks` 属性，而 `family_car` 实例没有（它只在原型中有 `locks` 属性）。考虑以下代码：\n\n![Images](img/f0208-02.jpg)\n\
  \n在这里，第一个警框显示 `true`，第二个显示 `false`。你将在本章晚些部分看到，当你使用 `for-in` 循环且只想使用对象实例中的属性而不是其原型的属性时，这是非常有用的。\n\
  \n\n\n\n由于原型（prototype）位于对象的构造函数之外且不在全局作用域内，它为在对象实例间共享的方法函数提供了一个很好的位置。你现在可以在构造函数中为对象的每个实例赋予属性（如果它们具有唯一值），并将其方法放置在原型中，以便在所有实例中复用。出于上述原因，这是创建自定义对象的常用模式，通常被称为组合构造函数/原型模式（combination\
  \ constructor/prototype pattern）。\n\n例如，以下代码将继续向 `Car` 构造函数添加属性，但将向 `Car` 原型添加一个方法：\n\
  \n![Images](img/f0209-01.jpg)\n\n采用组合构造函数/原型模式后，代码现在允许存在实例属性和方法，以及共享属性和方法。随着书本书的进行，你将看到更多关于原型以及如何将它们用于面向对象编程中继承的内容。\n\
  \n### `class` 关键字\n\nECMAScript 2015 引入了 `class` 关键字，以便你可以定义看起来更像传统类的对象。底层的基于原型结构仍然存在，但\
  \ `class` 关键字允许你组织代码，使得所有属性和方法都位于类块内（而不是让方法出现在对象定义之外）。\n\n例如，要使用构造函数和方法函数创建上一个示例，你可以使用以下代码：\n\
  \n![Images](img/f0209-02.jpg)\n\n注意，类可以使用类声明（class declaration）来定义，这类似于函数定义。一个关键区别是，函数声明会被提升（hoisted）（允许即使在代码中调用在函数声明之前，也可以调用该函数），而类声明不会被提升。这意味着你需要确保在创建这些类的实例之前，将任何类声明放置在代码的前部。\n\
  \n如果你希望让这种缺乏提升的情况变得更清晰一些，可以使用类表达式（class expression）来定义类（它的工作方式更像函数表达式）。由于函数表达式和类表达式都不会被提升，对于任何不习惯新\
  \ `class` 关键字的人来说，这将是显而易见的。使用类表达式实现相同代码的示例如代码所示：\n\n![Images](img/f0210-01.jpg)\n\
  \n除了语法差异外，其余代码的工作方式相同。如果用户使用的环境支持 ECMAScript 2015 或更高版本，你可以将 `class` 作为一种方便的方法，在一个地方组织你的\
  \ `Object` 代码。只需记住，这只是语法上的差异——底层代码仍然使用构造函数并将任何方法放置在原型上。\n\n#### 对象的有用语句\n\nJavaScript\
  \ 允许你使用 `for-in` 循环来帮助遍历对象属性，并使用 `with` 语句更容易访问特定对象。\n\n### `for-in` 循环\n\n`for-in`\
  \ 循环允许你遍历对象的属性。以下代码显示了 `for-in` 循环的结构：\n\n![Images](img/f0210-02.jpg)\n\n假设你想遍历\
  \ `Car` 对象实例 `work_car` 的属性循环，以便在页面上显示每个属性的值。`for-in` 循环允许你这样做，而无需输入每个属性名称，如下代码所示：\n\
  \n![Images](img/f0211-01.jpg)\n\n这将显示每个属性名称及其对应的值（注意使用括号表示法，以便可以使用 `prop_name` 变量来访问属性值）。\n\
  \n然而，请注意此循环将获取所有可用属性，包括在对象原型中找到属性。如果你想确保你使用的属性属于对象的实例而不是原型，可以使用之前学习的 `hasOwnProperty()`\
  \ 方法在每个属性在使用之前进行检查，如下代码所示：\n\n![Images](img/f0211-02.jpg)\n\n在这里，代码将确保你在页面上显示属性之前，是从对象实例而不是原型获取该属性。\n\
  \n### `with` 语句\n\n如果你计划使用大量使用对象的语句，`with` 语句允许你更容易地访问对象的属性和方法。例如，如果你想在网页上使用名为 `work_car`\
  \ 的对象编写许多语句，你可能会对输入对象名称（`work_car`）、点运算符以及属性名称而感到疲惫。\n\n**注意**\n\n由于性能缺陷以及在使用此语句时可能会无意中赋值或覆盖全局变量，通常不建议使用\
  \ `with`。在启用“use strict”（严格模式）选项时也不支持它。\n\n现在你已经了解了如何创建自己的对象、属性和方法，你可以很好地理解一些预定义的\
  \ JavaScript 对象是如何工作的。在学习本章的其余部分以及书中的其他几个章节中，将讨论许多预定义的 JavaScript 对象。\n\n**提问专家**\n\
  \n**问：当我使用构造函数时，每当需要一个对象时，真的都必须创建一个实例吗？**\n\n**答：** 构造函数只给浏览器提供对象的结构。要使用该结构，你需要创建对象的实例。你也需要为预定义的\
  \ JavaScript 对象创建实例。\n\n**问：那么单个对象呢？我不需要为它们创建实例吗？**\n\n**答：** 单个对象不需要创建实例。每个都是唯一的，并且在实例之间不复用代码。\n\
  \n**问：我可以使用组合构造函数/原型模式来共享属性以及方法吗？**\n\n**答：** 可以，如果你不希望某些属性每个实例都是唯一的，可以将它们添加到原型中。\n\
  \n### 练习 8-2 组合构造函数/原型\n\n`pr8_2.html`\n\n`pr8_2.js`\n\n假设你决定销售某些类型的电脑：工作电脑、家用电脑和游戏电脑。对于每台电脑，会有不同的属性和一个方法。\n\
  \n#### 步骤\n\n1. 创建一个 HTML 页面并保存为 `pr8_2.html`。\n2. 创建一个外部 JavaScript 文件并保存为 `pr8_2.js`。使用它完成第\
  \ 3 到 8 步。\n3. 创建一个 `Computer` 构造函数并赋予它 `type`、`processor` 和 `hd` 属性。\n4. 创建一个名为\
  \ `work_computer` 的 `Computer` 实例。`type` 的值为“Work”，`processor` 的值为“2GHZ”，`ram` 的值为“8GB”，`hd`\
  \ 的值为“1TB”。\n5. 创建一个名为 `home_computer` 的 `Computer` 实例。`type` 的值为“Home”，`processor`\
  \ 的值为“2GHZ”，`ram` 的值为“4GB”，`hd` 的值为“500GB”。\n6. 创建一个名为 `gaming_computer` 的 `Computer`\
  \ 实例。`type` 的值为“Gaming”，`processor` 的值为“4GHZ”，`ram` 的值为“16GB”，`hd` 的值为“2TB”。\n7.\
  \ 在 `Computer` 原型上创建一个名为 `describe` 的方法。使用它在页面上显示每个属性的值。\n8. 当你完成时，你的 JavaScript\
  \ 文件应该像下面所示：\n\n![Images](img/f0213-01.jpg)\n9. 保存文件并在浏览器中打开 HTML 文件。每个实例的属性都应该被显示出来。\n\
  \n#### 练习总结\n\n在这个项目中，你使用了关于构造函数和原型的知识创建了一个可复用的对象，该对象在原型上有一个方法，可以显示任何实例的属性值。\n\n\
  \n\n\n在 JavaScript 中，有许多预定义对象，你可以使用它们来获取所需的某些属性或方法。一旦你学习了各种对象以及它们的功能，就可以让你的脚本更具交互性。\n\
  \n本书将介绍许多主要的预定义对象。在本章中，你将查看 `navigator` 和 `history` 对象，以及你可以用它们做些什么。\n\n## Navigator\
  \ 对象\n\n`navigator` 对象允许你访问访问浏览器的各种属性，例如其名称、版本号等。它的名字源于 Netscape Navigator 浏览器，它是\
  \ Mozilla Firefox 之前的浏览器。\n\n`navigator` 对象是 `window` 对象的一部分，这意味着你可以通过 `window.navigator.property`\
  \ 访问它的属性，但也可以简写为 `navigator.property`。这对于 `window` 对象的直接属性或方法也是如此（例如，`window.alert(\"\
  Hi\")` 可以简写为 `alert(\"Hi\")` 且依然有效）。你经常会看到 `window` 对象的此类属性和方法被这样简写，以减少额外输入或缩短源代码。你将在第\
  \ 11 章中看到更多关于此的原因。\n\n首先，让我们来看看 `navigator` 对象的属性。\n\n### 属性\n\n`navigator` 对象的属性是修改的，因为它们被设置为只读。表\
  \ 8-1 显示了 `navigator` 对象的属性以及每个属性返回的值。当浏览器名称在后的括号中显示时，意味着该属性在本文编写时仅已知在指定的浏览器中有效。\n\
  \n![Images](img/f0215-01.jpg)\n\n**表 8-1** Navigator 对象的属性\n\n接下来的章节将更详细介绍一些更实用的属性。\n\
  \n#### appName 属性\n此属性允许你确定访问者正在使用的浏览器名称。如果你想知道特定浏览器的值，可以使用以下代码并在你选择的浏览器中打开该页面：\n\
  \n![Images](img/f0214-01.jpg)\n\n该属性过去经常用于创建简单的浏览器检测脚本，例如此代码所示：\n\n![Images](img/f0214-02.jpg)\n\
  \n虽然这在一段时间内是用的，但处理你可能会遇到的各种浏览器有更好的方法，例如特性检测和渐进增强，你将在阅读本书的过程中学习到更多内容。\n\n#### cookieEnabled\
  \ 属性\n如果浏览器启用了 cookie，此属性返回布尔值 `true`；如果浏览器未启用 cookie，则返回布尔值 `false`。你可以用它在用户未启用\
  \ cookie 时避免运行设置 cookie 代码：\n\n![Images](img/f0215-02.jpg)\n\n这允许你为可以使用 cookie 的访问者设置\
  \ cookie，或者在没有的情况下继续后续代码。你将在本书的后后部分详细介绍 cookie。\n\n#### plugins 属性\n此数组存储访问者浏览器中安装的所有插件的值。这可以在运行使用该插件的代码之前，检测访问者是否有某个特定的插件。\n\
  \n### 方法\n\n`navigator` 对象还有很多你可以用来执行各种任务的方法。表 8-2 显示了 `navigator` 对象中可用的方法。\n\n\
