  \n### 核心技能与概念\n\n* 使用 Math 对象\n* 理解 Number 对象\n* 使用 Date 对象\n\n在本章中，你将按照顺序学习 JavaScript\
  \ 的 Math、Number 和 Date 对象。对于每个对象，都将提供一个简短的介绍，并描述为什么该对象对你有用。紧随之后是介绍你可以为该对象使用的的各种属性和方法。\n\
  \n### 使用 Math 对象\n\n当你需要在脚本中执行各种计算时，`Math` 对象会非常有用。首先，让我们看看 `Math` 对象是什么。\n\n####\
  \ 什么是 Math 对象？\n\n`Math` 对象是一个预定义的 JavaScript 对象。与你在本书中学习过的其他预定义对象一样，`Math` 对象提供了一些属性和方法供你使用。`Math`\
  \ 对象用于数学目的，以为你提供某些数学常数的值，或者执行某些计算或操作。\n\n#### Math 对象有什么用\n\n正如前面提到的，当你需要在脚本中进行数学计算时，`Math`\
  \ 对象非常有用。例如，如果你在计算中需要圆周率的值，`Math` 对象提供了一个属性，供你获取该值。\n\n此外，如果你需要找到一个数的平方根，`Math`\
  \ 对象的一个方法可以让你实现这一点。该对象提供的另一个功能是在 JavaScript 中生成随机数，你会在某些脚本中发现它非常有用。\n\n### 属性\n\n\
  `Math` 对象提供了许多属性，在你需要执行某些数学计算时可以提供帮助。表 12-1 列出了 `Math` 对象的属性以及每个属性的值。\n\n![Images](img/f0319-01.jpg)\n\
  \n**表 12-1** Math 对象的属性\n\n正如你在 表 12-1 中所示，所有属性都持有数值，这些数值在数学计算中非常有用。由于这些是无理数，列出的值是非无限的，因此是近似值。注意，这些属性是“全大写”的。这是因为它们是常量，而此类值的命名规范是必须全大写字母。\n\
  \n##### 使用属性\n\n这些属性包含只读值，这些值在特定类型的计算中通常有用。例如，如果你想找到圆的面积，你可以使用公式 `Area = pi*r2`。在这一点上，你可以编写一个程序，根据观众输入的半径来确定圆的面积。你可以以下代码，从\
  \ HTML 代码开始：\n\n![Images](img/f0319-02.jpg)\n\n![Images](img/f0320-01.jpg)\n\n这段代码首先通过\
  \ id (`getarea`) 获取表单元素，并将其赋值给名为 `get_area` 的变量。当表单提交时，它会获取文本框中输入的半径值，并将其赋值给名为 `rad`\
  \ 的变量。\n\n接下来，代码执行了两次检查。它检查 `rad` 的 `length` 属性是否小于 1，以确保观众在字段中输入了数据。如果小于 1，代码将弹出一个提示框，要求观众输入信息。接着，它检查\
  \ `rad` 的值是否不是数字。这是通过使用 `isNaN()` 函数实现的，如果一个值不是数字，该函数返回 `true`。因为你想测试它是否为数字，在前面加上\
  \ `NOT` 运算符可以确保该值返回不是 `NaN`，从而确保它是数字。如果不是如此，它将被赋值为布尔值 `false`。然后 `if` 语句将检查 `rad`\
  \ 的值，如果无法强制转换为数字，将向观众发送一个提示，说明半径必须是数字。\n\n最后，如果输入的数据通过了这些测试，将进行圆面积的计算并赋值给名为 `the_area`\
  \ 的变量。注意，目前你将半径乘以自身得到半径的平方。当你学习到下一节的数学方法时，你会发现可以使用 `pow()` 方法代替。\n\n一旦计算完成并赋值给变量，就会向观众显示面积。注意，现在你将半径乘以自身得到半径的平方。该脚本可以根据你的需要进行修改（例如使用厘米、英寸或其他单位）。图\
  \ 12-1 显示了在浏览器中运行此脚本的结果。\n\n![Images](img/F12-01.jpg)\n\n**图 12-1** 为观众显示面积。\n\n\
  ### 方法\n\n`Math` 对象的方法让你能够执行某些有用的计算。表 12-2 列出了方法并简要描述了其用途。每个方法将在后续章节中详细介绍。此外，更多方法可以在\
  \ [`developer.mozilla.org/en-US/Reference/Global_Objects/Math#Methods`](https://developer.mozilla.org/en-US/Reference/Global_Objects/Math#Methods)\
  \ 找到。\n\n![Images](img/f0321-01.jpg)\n\n**表 12-2** Math 对象的方法\n\n##### 基础方法\n\n\
  在书中，“基础方法”被定义为那些接收单个数字、进行简单计算并返回一个值的方法。通过这种分组方式可以避免为每个方法列出相同的示例——这并不是方法的某种分类方式，只是为了加速讨论。\n\
  \n以下基础方法的工作方式相同：\n\n* `abs()`\n* `acos()`\n* `asin()`\n* `atan()`\n* `cos()`\n*\
  \ `exp()`\n* `log()`\n* `sin()`\n* `sqrt()`\n* `tan()`\n\n这些基础方法中的每一个都接收一个数值并返回另一个值。由于通用用法相同，本讨论使用\
  \ `sqrt()` 作为如何使用其他方法的示例。如果你需要知道不同方法返回什么类型的值，请参考 表 12-2 查看每个方法的功能。\n\n使用 `sqrt()`\
  \ 方法最简单的方法是将一个正数作为参数传递给该方法，如下所示：\n\n```\nwindow.alert(Math.sqrt(4));\n```\n\n这会弹出\
  \ 4 的正平方根的值，即 2。\n\n与其计算静态数字，你可以让用户输入一个数字，然后向用户发送其输入的数字的平方根。你可以使用以下代码来实现这一点，从 HTML\
  \ 代码开始：\n\n![Images](img/f0322-01.jpg)\n\n接下来，是 JavaScript 代码：\n\n![Images](img/f0322-02.jpg)\n\
  \n![Images](img/f0323-01.jpg)\n\n\n\n\n\n当用户提交表单时，输入到文本框的值会被赋值给变量 `thenum`。接下来，函数会检查该字段是否为空，或者输入的数据是否不是数字。之后，它会检查查看者是否输入了负数。其中任何一种情况都会向查看者提示错误。否则，将调用\
  \ `Math.sqrt()` 方法并将 `thenum` 的值作为参数。这将返回数字的根，然后将其赋值给名为 `theroot` 的变量。最后，会弹出一个警告告知用户平方根信息。\n\
