  \ `pool.query()` 函数来提供一个查询（第一个参数）、数组形式的查询参数（第二个参数——在这种情况下没有，所以是一个空数组）以及在查询完成时运行的函数。在该函数中，你可能会得到一个错误（`err`\
  \ 参数）或结果（`results` 参数）。在这些代码中，如果发生错误，错误将显示在控制台上，Node 进程将退出。如果查询成功，结果将记录在控制台上。图 11-12\
