  \n在这里，你将看到创建了一个名为 `bowlerApp` 的“外部”对象。这有助于将大部分代码隔离开全局空间，否则如果你使用了其他库，变量或函数名可能会与那些库的名称发生冲突。相反，你的应用代码被包含在你自己的“bowlerApp”命名空间中。\n\
