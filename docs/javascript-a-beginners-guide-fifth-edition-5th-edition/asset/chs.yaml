  \ `msg` 的值。\n\n**8.** 完成后，你的 JavaScript 文件应该所示（也有其他解决方案）：\n\n![Images](img/f0143-01.jpg)\n\
  \n![Images](img/f0144-01.jpg)\n\n**9.** 保存 JavaScript 文件和 HTML 文件，并在浏览器中查看 HTML\
  \ 页面。\n\n**10.** 尝试输入一个命名的城市。你应该看到页面上显示了相应的消息。你可以刷新页面来尝试不同的城市名称。\n\n### 练习总结\n\n\
  在这个项目中，你使用了 `window.prompt()` 方法、`if/else` 语句和 `switch` 语句的新技能，创建了一个脚本，允许用户输入城市名称并查看该城市是否可以送货。\n\
  \n# 定义循环\n\n\n\n\n要开始使用循环，你将需要了解循环是什么、它们能做什么，以及为什么它们对你的脚本是有帮助的。\n\n## 什么是循环？\n\n\
  循环是一个代码块，允许你重复执行某部分代码若干，并且在每次执行代码时可能会更改某些变量的值。通过这种方式，你通常可以将某些任务缩短为几行代码，而不是在脚本中反复编写相同的行，让手指感到疲劳。\n\
  \n## 为什么循环很有用\n\n循环之所以有用，是因为它们允许你重复代码行，而无需在文本编辑器中重新输入它们或使用剪切粘贴功能。这不仅节省了你重复输入相同代码行的时间和麻烦，还避免了重复行中的输入错误。你还可以在浏览器每次通过循环时，更改一个或多个变量的值，这再次节省了你输入与前一行代码略有不同的代码行的时间和麻烦。\n\
  \n举个简单的例子，假设你想用 JavaScript 在网页上连续写入十次某个句子。要正常实现这一点，你可能需要编写类似下面的代码：\n\n![Images](img/f0145-01.jpg)\n\
  \n哎！复制粘贴可以使任务变得简单，但仍然有些枯燥，特别是如果你决定写这个句子 50 次时。使用循环，你只需要写一次 `document.write()` 语句，然后调整你希望写入的次数即可。它就像下面的示例一样。这并不是实际的代码，但当你在下一节“使用循环”中详细查看循环结构时，你将看到重复多次某个语句所需的实际代码。\n\
  \n![Images](img/f0145-02.jpg)\n\n当然，你将把“执行此代码块 10 次”的文本替换为 JavaScript 能理解的实际语句。你将在下一节中看到你可以使用哪些语句来构建循环。\n\
  \n## 使用循环\n\n为了看到循环如何真正对你有帮助，你需要查看 JavaScript 中可以使用的不同循环结构。本节涵盖的循环结构包括 `for`、`while`\
  \ 和 `do while` 循环。\n\n### for\n\n在 JavaScript 中使用 `for` 循环，你需要知道如何编写循环的基本结构，以及如何在一个\
  \ `for` 循环中嵌套另一个 `for` 循环。首先，来看一下 `for` 循环的基本结构。\n\n### for 循环的结构\n\n`for` 循环的结构与条件块非常相似。主要的区别在于循环服务了不同的目的，结果就是第一行是不同的。之后，你使用熟悉的大括号来包裹循环的内容。\n\
  \n`for` 循环的第一行看起来类似于下面行：\n\n![Images](img/f0146-01.jpg)\n\n你看到的第一个词是 `for` 关键字。后面跟着一组括号，里面有三个语句。这三条语句通过提供特殊信息告诉循环它应该重复多少次。\n\
  \n第一条语句 `let count = 1` 创建了一个名为 `count` 的变量并给它分配一个初始值 1。这个初始值可以是任何数字。这个数字被用作循环重复次数的起点。使用数字\
  \ 1 将帮助你更容易看到循环重复的次数。之前的代码以 `count` 值为 1 开始循环。请注意，如果 `count` 变量在脚本早期已经初始化，那么这里就不需要\
  \ `let` 关键字了。\n\n下一条语句 `count < 11` 告诉循环何时停止运行。循环将根据这个条件语句停止运行。这里的条件是只有当变量 `count`\
  \ 不再小于 11 时才停止。这意味着如果你每次通过循环时给 `count` 的值加 1，那么循环的最后一次运行将在 `count` 等于 10 时进行。当 10\
  \ 加 1 时，它变成了 11；这没有通过条件测试，所以循环停止运行。\n\n组中的最后一条语句 `count ++` 决定了变量变化的速率以及它每次是变大还是变小。在之前的代码中，你每次回到循环开头时都会给变量加\
  \ 1。记住，第一次通过时，变量被设置为 1。由于你每次都加 1，变量在第二次通过时值为 2，第三次通过时为 3，依此类推，直到变量不再小于 11。\n\n为了完成该结构，你只需插入大括号来包裹你希望在循环中使用的代码。`for`\
  \ 循环完整结构的示例在下面的代码所示：\n\n![Images](img/f0146-02.jpg)\n\n现在，你只需要添加一个真实的变量和一些要执行的 JavaScript\
  \ 代码，你就组合了一个完整的 `for` 循环。为了做到这一点，你将从一个向页面写入十次句子的脚本开始。现在你就可以使用循环了，你只需要写一次句子本身，而不是连续写十次。下面的示例代码展示了如何使用\
  \ `for` 循环实现这一点：\n\n![Images](img/f0146-03.jpg)\n\n`count` 变量将从 1 开始计数，因为它被分配了初始值\
  \ 1。你每次通过循环时都向它加 1。当 `count` 变量不再小于 11 时，循环将停止。`document.write()` 命令中使用了 `<br>`\
  \ 标签，以确保每个句子都有换行符。\n\n\n\n\n在前面的代码中，你只是在字符串开头添加了 `count` 变量的值。句子前的句点会让每行文本在数字后出现一个句点、一个空格，然后是你的句子。图\
  \ 6-3 展示了添加此内容后脚本在浏览器中的显示效果。\n\n![Images](img/F06-03.jpg)\n\n**图 6-3**  现在重复的行被编号为\
  \ 1 到 10。\n\n## 比较\n\n进行比较时，你并不局限于 `<` 运算符。例如，到目前为止你一直在循环十次。有多种方法可以让循环执行十次，不过有些方法会改变\
