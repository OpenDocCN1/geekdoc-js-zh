  \ 方法及其如何使用。\n\n#### javaEnabled() 方法\n如果访问者在浏览器中启用了 Java，该方法返回布尔值 `true`；否则返回 `false`。如果你想向访问者显示\
  \ Java applet，但仅在访问者在浏览器中启用 Java 的情况下显示，`javaEnabled()` 方法就会有用。以下代码允许你实现这一点：\n\n\
  ![Images](img/f0216-02.jpg)\n\n```\n// 此代码测试 navigator.javaEnabled() 方法返回的值，并显示\
  \ Java applet 或告知用户未启用 Java 信息\n```\n\n## History 对象\n\n`history` 对象也是 `window`\
  \ 对象的一部分，提供了有关当前窗口浏览器历史的信息。\n\n### 属性\n\n`history` 对象只有一个属性，命名为 `length`（在 Firefox\
  \ 中还有几个可用属性，但它们无法与 Web 内容共同工作）。该属性返回当前窗口在浏览器会话历史中的页面数，包括当前加载的页面。它可以以类似下面的方式使用：\n\
  \n![Images](img/f0217-02.jpg)\n\n```\n// 这仅仅是向访问者发送一个警告，说明当前浏览器窗口中访问了多少页面\n```\n\
  \n### 方法\n\n`history` 对象有三个实用的方法，列在表 8-3 中。\n\n![Images](img/f0217-01.jpg)\n\n**表\
  \ 8-3** History 对象的方法\n\n接下来的章节将更详细地讨论这些每个方法。你可以在 [developer.mozilla.org/en-US/docs/Web/API/History](http://developer.mozilla.org/en-US/docs/Web/API/History)\
  \ 查看更多属性和方法的详情。\n\n#### back() 方法\n`back()` 方法将返回到历史列表中的上一个页面。\n\n```\nhistory.back()\n\
  ```\n\n#### forward() 方法\n`forward()` 方法将前进到历史列表中的下一个页面。\n\n```\nhistory.forward()\n\
  ```\n\n#### go() 方法\n`go()` 方法接受一个整数作为参数。整数可以是负数（后退），也可以正数（前进）。例如，以下代码将返回两页：\n\n\
  ```\nhistory.go(-2)\n```\n\n以下代码将前进三页：\n\n```\nhistory.go(3)\n```\n\n与其他方法一样，如果你尝试访问的页面不存在（例如类似\
  \ `history.go(15)`），则该方法将什么都不做。\n\n预定义的 JavaScript 对象可能非常有帮助。正如你将在下一章中看到的，`document`\
  \ 对象为你提供了处理 HTML 文档的许多额外属性和方法。\n\n## 第 8 章自测\n\n![Images](img/tick.jpg)\n\n**1.**\
