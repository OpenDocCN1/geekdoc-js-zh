  \n![Images](img/F07-04.jpg)\n\n**图 7-4** 新字符串被写入页面，使用冒号作为分隔符。\n\n##### pop() 方法\n\
  \n`pop()` 方法用于移除数组中的最后一项。如果你将方法的结果赋值给一个变量，被弹出的元素将被返回并赋值给该变量。\n\n以下代码创建了一个数组，然后使用\
  \ `pop()` 方法移除了数组中的最后一项：\n\n```javascript\nlet fruits = [\"oranges\", \"apples\"\
  , \"pears\"];\nlet lastFruit = fruits.pop();\n```\n\n\n\n这将创建一个名为 `fruits` 的数组，包含三个元素（“oranges”、“apples”、“pears”）。然后，使用\
  \ `pop()` 方法移除最后一个元素，将数组缩短为仅包含前两个元素（“oranges”、“apples”）。\n\n如果你想移除一个元素，但稍后仍要以某种方式使用它，可以将该方法的结果赋值给一个变量。该变量将被赋值为被弹出的元素的值。以下示例移除数组的最后一个元素，然后将弹出的元素以警报形式发送给查看者：\n\
