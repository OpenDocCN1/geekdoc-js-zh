  \nD. `appVersion`\n\n# 第 9 章\n\n# 文档对象\n\n### 核心技能与概念\n\n- 定义文档对象\n- 使用文档对象模型\n\
  - 使用文档对象的属性\n- 使用文档的方法\n- 使用 DOM \n- 创建动态脚本\n\n现在你已经了解对象是如何工作的以及如何使用预定义对象，是时候查看\
  \ JavaScript 中一些主要的预定义对象了。本章介绍了 `document` 对象，它可以帮助你收集浏览器中正在查看页面的信息。正如你在本章中发现的，`document`\
  \ 对象的某些属性和方法可以用于获取有关文档的信息，或更改有关文档的信息。你还将学习文档对象模型（DOM），并看到如何将其与样式表结合来创建动态脚本。\n\n\
  ### 定义文档对象\n\n`document` 对象是浏览器为每个新查看的页面（`document`）创建的对象。通过这种方式，JavaScript 让你访问许多属性和方法，这些内容可以以各种方式影响文档。在本书中，你已经使用\
  \ `document` 对象的 `write()` 方法一段时间了。该方法允许你将一段字符串文本写入文档中。为了开始你的文档对象之旅，你将查看文档对象模型 (DOM)\
  \ 以及你可以通过该对象访问的各种属性。这些许多属性在编写脚本时会被证明是非常实用的。\n\n注意：DOM 是网络浏览器特有的，在编写 Node.js 代码时不使用它。此外，某些非标准的\
  \ DOM 方法可能仅在特定浏览器中有效，因此你通常希望使用在所有浏览器中都有效的方法。\n\n### 使用文档对象模型\n\n文档对象模型（DOM）允许 JavaScript（或其他脚本语言）访问文档的结构。每个文档由结构化节点组成（例如，`body`\
  \ 标签是一个节点，`body` 内部的任何元素都是子节点）。有了这种结构，脚本语言就可以以多种方式访问文档中的元素，从而对文档元素进行修改。如果你有以下 HTML\
  \ 代码，你可以使用 JavaScript 来访问它的结构：\n\n![Images/f0223-02.jpg)\n\n图 9-1 显示了 `body` 元素作为一个节点，以及它如何拥有子节点和属性节点。\n\
  \n![Images/F09-01.jpg)\n\n图 9-1 文档结构部分的示例。`h1` 和 `img` 元素都是 `body` 元素的子节点。每个元素也有它自己的节点。`h1`\
  \ 元素包含一个文本节点（文本“My Page”），而 `img` 元素包含两个属性节点（`src=\"myimage.jpg\"` 和 `alt=\"My Picture\"\
  `）。这种结构贯穿整个文档，虽然这只是一个简单的例子，但 HTML 页面可以绘制更复杂的文档树。你可以编写脚本来添加、删除或更改 DOM 中的节点。你可以使用\
  \ `document.getElementById()` 方法通过 `id` 属性访问元素，甚至可以使用 `document.getElementsByTagName()`\
  \ 或 `document.getElementsByClassName()` 等方法获取一组元素。首先，你将查看 `document` 对象的属性和方法。\n\
  \n### 使用文档对象的属性\n\n表 9-1 列出了 `document` 对象的常用属性以及对每个属性的简短描述。在表格之后，将更详细地讨论某些特定。\n\
  \n![Images/f0224-01.jpg)\n\n![Images/f0225-01.jpg)\n\n表 9-1 文档对象的属性\n\n注意：并非所有这些属性在所有浏览器中都有效。你可以通过访问\
  \ `http://developer.mozilla.org/en/DOM/document` 和 `https://msdn.microsoft.com/en-us/ie/ms53862`\
  \ 查看更多信息和额外属性。\n\n### 集合\n\n许多属性（`anchors`、`embeds`、`forms`、`images`、`links`、`plugins`、`styleSheets`）返回一个包含文档中找到元素的数组。这些元素可以像数组一样使用索引进行访问。索引\
  \ 0 的元素或值是第一个，1 是第二个，以此类推。\n\n例如，可以使用 `links` 属性访问文档中的所有链接。如果你需要找到文档中的第一个链接，可以使用\
  \ `document.links[0]` 将其作为对象访问。然后你可以使用节点属性或方法（后文将讨论）来获取或设置信息，或对元素执行某些操作。\n\n####\
  \ cookie 属性\n\n`cookie` 属性用于设置 JavaScript Cookie 以为查看者存储信息。Cookie 是保存在查看者计算机上的小型文本文件，持续一段时间（指定的日期或浏览器会话）。Cookie\
  \ 有助于网站记录和检索查看者的信息（例如购物车内容、特殊设置或会话信息）。\n\n要设置 Cookie，将 `document.cookie` 属性的值设置为包含你想为查看者存储信息的字符串。以下是语法：\n\
  \n```\ndocument.cookie = \"string\";\n```\n\n你用包含你想使用的信息的字符串替换 `string`。通常，它的格式如下例设置\
  \ Cookie 的示例所示：\n\n```\ndocument.cookie = \"site=homepage\";\n```\n\n你可以看到 Cookie\
  \ 设置了一项内容：site 为 homepage。在两者之间，等号用于在读取 Cookie 时帮助区分 site 和 homepage。\n\n\n\n\n\
  你将在后面的章节中更详细地了解如何使用高级字符串处理技术，以及如何设置和读取 cookie。\n\n## dir 属性\n\n`dir` 属性返回一个表示文档阅读方向的字符串值。该值可以是\
  \ `ltr`（从左到右）或 `rtl`（从右到左）。该属性对于显示从右到左而非从左到右阅读的语言的 Web 页面非常有用，只需将值设置为 `rtl`。为了好玩，你可以使用该属性即时更改页面的外观，如下例代码所示：\n\
  \n```\ndocument.dir = \"rtl\";\n```\n\n图 9-2 显示了当 `dir` 属性设置为“rtl”时页面的外观示例。\n\n\
  ![Images](img/F09-02.jpg)\n\n**图 9-2**  方向切换为 rtl 的 Web 页面\n\n## lastModified 属性\n\
  \n`lastModified` 属性存储当前文档最后修改的日期和时间。这主要用于信息性目的，例如显示文档最后修改的日期，让查看者知道你上一次更新页面的时间。该属性的值取决于你的浏览器，因为如果你在页面上编写最后修改日期，不同浏览器会有不同的结果。\n\
  \n考虑以下代码，它将 `document.lastModified` 属性的值写入 Web 页面以显示最后修改的日期和时间：\n\n![Images](img/f0227-02.jpg)\n\
  \n图 9-3 显示了这在 Mozilla Firefox 中查看时的结果。\n\n![Images](img/F09-03.jpg)\n\n**图 9-3**\
  \  在 Mozilla Firefox 中查看时的最后修改日期\n\n在页面上编写最后修改日期时，差异仅体页面空间上。某些布局可能需要为该属性的较长版本留出额外空间。\n\
  \n## referrer 属性\n\n`referrer` 属性用于信息目的，存储查看者在到达你的页面之前所处页面的 URL 值（引用页）。虽然这可能有用，但查看者并不总是带有引用\
  \ URL 进来的（例如当使用书签或直接输入地址时），因此该值可能为空。此外，该属性的值并不总是正确的，因为不同的浏览器可能认为不同类型的内容是引导查看者进入新页面的来源，而不仅仅是链接，而且用户可能会隐藏或更改引用者。\n\
  \n将以下示例中的代码放入文档中将向页面的查看者发送警报，告诉他们在到达你的页面之前所在的地方：\n\n![Images](img/f0228-01.jpg)\n\
  \n所以，如果引用页是 [`http://www.scripttheweb.com/js/`](http://www.scripttheweb.com/js/)，则会向查看者发送一个显示“你来自\
  \ `http://www.scripttheweb.com/js/`”的警报。\n\n## title 属性\n\n`title` 属性持有 HTML 文档标题的字符串值。`title`\
  \ 设置在页面的 `<title>` 和 `</title>` 标签内部。\n\n使用 `title` 属性的一种方法是在窗口顶部以外的地方向查看者显示页面标题。以下代码将允许你实现这一点：\n\
  \n![Images](img/f0228-02.jpg)\n\n这会将你的标题作为页面上的标题显示出来。图 9-4 显示了这在浏览器中查看时的结果。\n\n\
  ![Images](img/F09-04.jpg)\n\n**图 9-4**  文档标题作为页面上的标题显示。\n\n## URL 属性\n\n`URL` 属性持有当前文档的完整\
  \ URL 值。如果你将其打印在 HTML 页面的底部，此信息将非常有用，因为它会为任何打印你页面的人显示页面 URL。\n\n虽然你可以自己在底部手动输入 URL，但当需要在许多页面上这样做时，就会变得非常繁琐。这时这个属性就很派用，因为你可以向每个页面剪粘贴一段小脚本，而不是每次都输入各种\
  \ URL 地址。在页面上编写 URL 地址的示例见以下代码：\n\n![Images](img/f0229-01.jpg)\n\n图 9-5 显示了上述代码在浏览器中的结果。页面的最后一行告诉查看者当前位置。该图显示的是本地文件地址，但如果页面在线，它将显示一个普通的\
  \ URL。\n\n![Images](img/F09-05.jpg)\n\n**图 9-5**  文档的 URL 显示在页面上。\n\n## URLUnencoded\
  \ 属性\n\n`URLUnencoded` 属性返回不经编码的文档 URL。例如，如果文件名中有空格，该属性将返回空格而非 `%20`。对于 [`http://www.scripttheweb.com/myscript.html`](http://www.scripttheweb.com/myscript.html)，可以使用该属性获取内容。\n\
  \n### 专家问答\n\nQ：学习文档对象对我有帮助吗？\n答：有的，因为它们为处理 Web 页面以及其他类型的文档提供了基础。例如，其他类型也使用类似的结构。\n\
  \nQ：是否有方法可以在每次访问时将信息写入文件，以便我知道他们来自哪里？\n答：客户端 JavaScript 自身无法保存信息，但可以将信息发送到服务器进行存储。稍后我们将学习更多内容（使用\
  \ JSON 和/或 AJAX）。\n\nQ：除了包含元素集合的数组，还有其他访问元素的方法吗？\n答：文档对象的方法（例如 `getElementById()`）允许你更具体地选择元素。\n\
  \n### 使用文档对象的方法\n\n文档对象的方法允许你完成一些以前无法做的事情。表 9-2 列出了常用方法及其简要描述。由于许多方法是特定于浏览器的（与属性一样），在表格之后仅对某些方法进行了详细说明。\n\
  \n***注意*** 并非所有属性在所有浏览器中均有效。你可以访问 [`developer.mozilla.org/en/DOM/document#Methods`](http://developer.mozilla.org/en/DOM/document#Methods)\
  \ 获取更多信息和属性。\n\n#### 获取元素的 get 方法\n\n有很多方法允许你从文档中获取一个或多个元素供脚本使用。每种方法都为你提供了访问所需元素的独特方式。\n\
  \n##### getElementById() 方法\n\n`getElementById()` 方法允许通过 id 属性的值来访问元素。例如，如果你有以下\
  \ HTML 代码，你可以使用 `getElementById()` 方法访问 div 元素：\n\n![Images](img/f0232-02.jpg)\n\
  \n由于 div 元素的 id 属性值为 `some_text`，可以使用 `document.getElementById()` 方法使用该值访问 div 元素：\n\
  \n![Images](img/f0233-01.jpg)\n\n\n\n\n有效的 HTML 仅允许在单个元素上使用一个 ID 值。如果在多个元素上使用了相同的\
  \ ID 值，`getElementById` 将只会获取使用该 ID 的元素中的一个。在本章的后续内容，你将看到可以使用这种方法以及其他选择方法从元素中检索信息、修改元素、添加元素或删除元素。\n\
  \n### `getElementsByClassName()` 方法\n\n此方法允许你获取一个数组，该数组包含了文档中所有具有指定类名（来自 CSS 类）的元素。例如，要获取所有类名为\
  \ `number_one` 的元素，你可以使用以下代码：\n\n![Images](img/f0233-02.jpg)\n\n### `getElementsByName()`\
  \ 方法\n\n此方法允许你获取一个数组，该数组包含了文档中所有 `name` 属性具有指定值的元素的集合。在许多情况下，该值对于一个元素是唯一的。然而，属于同一组的单选按钮（radio\
  \ buttons）都需要具有相同的 name 值（这样只能选择一个）。在这种情况下，能够检索所有这些元素将非常有用：\n\n![Images](img/f0233-03.jpg)\n\
  \n这段 HTML 代码有一组单选按钮，名称都为 `dino`。如果你想获取所有这些元素，可以使用以下代码：\n\n![Images](img/f0233-04.jpg)\n\
  \n这将所有名称为 `dino` 的单选按钮元素检索到一个数组中，然后你可以遍历该数组以执行任何必要的任务：\n\n![Images](img/f0233-05.jpg)\n\
  \n如你所见，你现在可以在循环中处理所有的元素，而不是通过其 id 一收集每个元素来执行相同的任务。\n\n### `getElementsByTagName()`\
  \ 方法\n\n此方法允许你获取一个数组，该数组包含了文档中所有具有指定标签名的元素。例如，要获取文档中的所有图像元素（image），你可以使用以下代码：\n\n\
  ![Images](img/f0234-01.jpg)\n\n### `querySelector()` 方法\n\n此方法允许你使用 CSS 选择器来获取第一个匹配选择器的元素。例如，你可以通过\
  \ ID 获取元素：\n\n![Images](img/f0234-02.jpg)\n\n请注意，这里使用了 CSS ID，而在 `getElementById()`\
  \ 中则没有使用。CSS 类和其他类型的选择也是如此。例如，要通过类名进行选择，你可以使用以下代码：\n\n![Images](img/f0234-03.jpg)\n\
  \n记住 `querySelector()` 只选择第一个匹配项，所以即使你有多个具有该类的元素，也只有具有该类的第一个元素会被选中。\n\n### `querySelectorAll()`\
  \ 方法\n\n与 `querySelector()` 只选择第一个匹配元素不同，`querySelectorAll()` 方法将为所提供的 CSS 选择器选择所有匹配元素。例如，考虑以下代码：\n\
  \n![Images](img/f0234-04.jpg)\n\n这一次，所有具有该类的元素都将被选中，而不仅仅是第一个，你可以像以前使用 `getElementsByClassName()`\
  \ 那样通过循环访问每个单独的元素。\n\n![Images](img/f0234-05.jpg)\n\n### 获取更具体的元素\n\n一旦你获取了对象，就可以对更具体的对象使用\
  \ `get` 方法。例如，假设你有以下 HTML 代码：\n\n![Images](img/f0234-06.jpg)\n\n![Images](img/f0235-01.jpg)\n\
  \n如果你只想获取 `nav` 元素内的链接，使用 `document.getElementsByTagName(\"a\")` 将不起作用，因为你还会获得位于\
  \ `div` 标签内的链接（仍然是文档的一部分）。要实现这一点，你可以先获取 `nav` 元素，然后在为 `nav` 元素创建的对象上使用 `getElementsByTagName()`\
  \ 方法，如下面的代码所示：\n\n![Images](img/f0235-02.jpg)\n\n在这里，你通过 id 获取 nav 元素，创建了 `nav_element`\
  \ 对象。该对象用于获取其内部的所有链接元素，并将它们放入一个名为 `nav_links` 的数组中。现在可以使用该数组来遍历 `nav` 元素中的每个链接，或者找出\
  \ `nav` 元素中包含多少链接。在这种情况下，使用 `nav_links` 数组的 `length` (3) 弹出链接的数量。\n\n### `open()`\
  \ 和 `close()` 方法\n\n`open()` 方法允许你打开一个新的文档并完全使用 `document.write()` 或 `document.writeln()`\
  \ 语句创建其内容。当调用 `open()` 方法时，浏览器会寻找这些语句以便写入新页面。一旦 `write()` 和/或 `writeln()` 语句完成，你需要使用\
  \ `close()` 来完成新页面。\n\n当你向当前加载的页面写入内容时，不需要（也不建议）使用 `open()` 和 `close()` 方法。为了获取\
  \ `open()` 方法使用的示例，假设你想根据查看者的名称编写一个新页面。要做到这一点，你不仅需要使用 `open()` 和 `close()` 方法，还需要创建一个\
  \ `formName` 属性以便使用，这样你可以获取查看者在文本框中输入的名称。\n\n从初始页面 body 部分的代码开始。你需要一个带有文本框的表单，以及一种调用创建新文档函数的方法。以下代码显示了实现此操作的方法（将文件保存为\
