  \ 像素：\n\n![Images](img/f0497-02.jpg)\n\n还有三个属性可以用于样式文本：\n\n- `font`: 使用 CSS 格式设置字体（例如，“bold\
  \ 1em”）。\n- `textBaseline`: 设置文本基线。可能的值有“alphabetic”、“bottom”、“hanging”、“ideographic”、“middle”和“top”。\n\
  - `textAlign`: 设置文本对齐方式。可能的值有“center”、“end”、“left”、“right”和“start”。\n\n因此，如果你想更改字体并对齐文本，可以设置\
  \ `font` 和 `textAlign`，如下所示：\n\n![Images](img/f0497-03.jpg)\n\n文本现在将是加粗 Verdana\
  \ 右对齐。图 16-11 显示了这段代码的结果。\n\n![Images](img/F16-11.jpg)\n\n**图 16-11** 字体现在是加粗 Verdana\
  \ 右对齐\n\n### 扩展阅读\n\n已经介绍了使用画布的基础知识，但还有更多你可以做的事情。你可以在以下网站学习更多关于使用画布的知识：\n\n- [`developer.mozilla.org/en-US/docs/Web/API/Canvas_API/Tutorial`](https://developer.mozilla.org/en-US/docs/Web/API/Canvas_API/Tutorial)\n\
  - [www.html5canvasutorials.com/](http://www.html5canvasutorials.com/)\n\n### 拖放\n\
  \nHTML5 通过 JavaScript 的帮助为浏览器提供了原生拖放功能。某些元素（如链接、图像和选中的文本）默认是可以拖拽的。如果你想让另一个元素变为可拖拽，或者你想确保某个元素不可拖拽，可以在其\
  \ HTML 标签中使用 `draggable` 属性，如下示例所示：\n\n![Images](img/f0498-02.jpg)\n\n\n\n\n\n你接下来需要一个有效的拖放目标（drop\
  \ target）。要设置它，你需要在 JavaScript 中获取该元素，并确保它的 `dragover`、`dragenter` 和 `drop` 事件阻止了默认操作（即不允许放置操作）。为了实现这一点，你可以简单地为元素的每个事件添加事件监听器，如下代码所示：\n\
  \n![Images](img/f0498-03.jpg)\n\n![Images](img/f0499-01.jpg)\n\n这样做将允许项目被拖入 `dropdiv`\
  \ 元素中。\n\n## 拖放事件\n\n拖放过程涉及七个事件，每个事件都已在表 16-5 中进行了详述。\n\n![Images](img/f0499-03.jpg)\n\
  \n**表 16-5** 拖放事件\n\n这些事件中的每一个都可以添加事件监听器，用以执行进一步的脚本操作。根据你的需求，在创建拖放脚本时，可以使用这些事件中的任意数量。\n\
  \n## dataTransfer 对象\n\n虽然你目前可以使用已有的功能拖动并放置项目，但你可能希望能够访问被拖动项目内部存储的数据，以便在放置时使用。这正是\
  \ `dataTransfer` 对象可以用武场。\n\n`dataTransfer` 对象是事件对象的一部分，具有两个方法用于从拖动项目中设置和检索数据：`setData()`\
  \ 和 `getData()`。\n\n`setData()` 方法可设置自定义数据，但在拖动选中的文本、图像或链接时，它也会被默认调用。对于选中的文本，它将存储被拖动的文本；对于图像，它将存储图像\
  \ URL；对于链接，它将存储链接 URL。如果你需要存储自定义数据而不是使用这些默认值（或者你正在拖动不同类型的元素），可以使用以下代码存储文本或 URL：\n\
  \n![Images](img/f0499-02.jpg)\n\n请注意，你可以在单个 `dataTransfer` 对象中同时存储“text”和“URL”类型，但每种类型不能超过一个。HTML5\
  \ 扩展了此功能，允许传递任何 MIME 类型（“text”和“URL”仍然有效，分别等同于使用“text/plain”和“text/uri-list” MIME\
  \ 类型）。只需记住，每个 MIME 类型在 `dataTransfer` 对象中只能存储一条数据。\n\n`getData()` 方法用于检索存储在 `dataTransfer`\
  \ 对象中的任何数据。由于浏览器兼容性问题，在从 `dataTransfer` 对象中检索文本或 URL 信息时，最好使用以下示例代码：\n\n![Images](img/f0500-01.jpg)\n\
  \n注意检索文本时的大写字母“T”，这允许旧版本的 Firefox 获取文本值，同时在其他浏览器中正常工作。此外，注意获取 URL 的方法首先测试“URL”，然后测试\
  \ MIME 类型“text/uri-list”，以帮助旧版本的 Internet Explorer。\n\n## 快速拖放脚本\n\n作为一个将所有内容整合在一起的示例，你将创建一个脚本，将链接拖入\
  \ `div` 元素中，以显示该链接的 URL。首先，从以下 HTML 代码开始：\n\n![Images](img/f0500-02.jpg)\n\n由于链接默认是可拖动的，因此这里不需要\
  \ `draggable=\"true\"` 属性。`div` 元素被赋予了边框，以便用户可以看到向哪里拖动链接。接下来，你需要以下 JavaScript 代码：\n\
  \n![Images](img/f0500-03.jpg)\n\n你会注意到，由于你拖动的是链接，因此不需要调用 `setData()` 将 URL 存储在 `dataTransfer`\
  \ 对象中（如果你需要这样做，例如为了存储文本，你还需要通过 id 获取链接元素，为 `dragstart` 事件添加事件监听器，然后在该函数内部使用 `setData()`）。此处的操作发生在目标\
  \ `div` 元素的 `drop` 事件上。当链接被放置在目标 `div` 内部时，存储在 `dataTransfer` 对象中的 URL 将使用 `innerHTML`\
