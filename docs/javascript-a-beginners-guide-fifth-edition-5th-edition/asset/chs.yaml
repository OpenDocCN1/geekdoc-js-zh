  \ Web 页面时。观众可以通过点击链接、在浏览器中输入另一个地址或关闭窗口来离开。\n\n该事件已知会让观众反感，因为它允许所有者在访问尝试移动另一个页面或网站时执行操作（强制他们等待）。为了在用户离开页面时弹出警框，你可以编写以下代码：\n\
  \n![Images](img/f0267-02.jpg)\n\n图 10-5 显示了上述脚本的结果。观众尝试离开包含此脚本的页面时，会弹出一个警框告诉他们记得回来。当然，如果这用于索引页或网站内的多个页面，可能会让观众感到非常不便。\n\
  \n![Images](img/F10-05.jpg)\n\n**图 10-5** 当观众尝试离开页面时，会弹出此警框。\n\n与 `onload` 事件处理器一样，你可以通过使用\
  \ `window.onunload` 在脚本代码中使用 `onunload` 事件处理器，而不是作为 `body` 标签的属性。\n\n\n\n\n\n总而言之，在活动页面上使用\
  \ `unload` 事件之前请务必三思，因为这几乎肯定会骚扰大多数 Web 用户。\n\n***提示***\n\n如果 `onload` 正常工作，在需要此功能时，请尝试使用\
  \ `onbeforeunload`。\n\n## 重置和提交事件\n\n当文档中包含一个或多个表单时，会使用重置和 `submit` 事件。表单的内容可以被重置，也可以被提交进行处理。这些事件允许你对其中一个表单操作编写响应程序。\n\
  \n`reset` 事件发生在查看者使用表单重置按钮来重置表单字段时。`reset` 事件还带名为 `reset()` 的相关方法，该方法将在第 14 章中介绍。`submit`\
  \ 事件发生在查看者提交表单时。`submit` 事件也有一个名为 `submit()` 的相关方法，该方法将在第 14 章中介绍。\n\n要查看 `submit`\
  \ 事件的作用，你必须创建一个可以使用提交按钮提交的表单。以下代码将在点击提交按钮后，给查看者显示一个“感谢”警报：\n\n![Images](img/f0268-02.jpg)\n\
  \n`submit` 事件现在对你帮助不大（尤其是表单内容并没有真正去往任何地方），但当你学习第 14 章中的表单验证时，这个事件将变得更有用。\n\n## 鼠标事件\n\
  \n有很多适用于涉及鼠标操作的用户事件。它们列在下方：\n\n- `mousedown`: 发生在查看者按下鼠标按钮但在点击完成之前（按钮尚未释放）时。\n-\
  \ `mouseup`: 发生在查看者按下鼠标按钮后释放它时。\n- `mouseenter`: 发生在查看者将鼠标光标移动到元素上方（不包括子元素）时。\n\
  - `mouseleave`: 发生在查看者将鼠标光标离开元素（不包括子元素）时。\n- `mouseover`: 发生在查看者将鼠标光标移动到元素上方时。\n\
  - `mouseout`: 发生在查看者将鼠标光标离开元素时。\n- `mousemove`: 发生在查看者移动鼠标光标时。\n- `mousewheel`:\
  \ 发生在查看者向上或向下滚动鼠标轮时。\n\n使用鼠标事件的示例可以通过创建一个文本链接来展示。当你向链接添加 `onmouseover` 事件处理程序时，你可以选择在查看者将光标悬在链接上时执行\
  \ JavaScript 命令。因此，如果你想在查看者将鼠标移动到链接上时弹出警报，你可以编写类似下面的代码：\n\n![Images](img/f0269-01.jpg)\n\
  \n这一次，访问者甚至还没等及点击链接就会收到警报的问候。请记住，如果过度使用像这样的脚本，可能会骚扰你的访问者。图 10-6 显示了该脚本在浏览器中的运行结果。只要鼠标光标移动到链接上，警报就会弹出。\n\
  \n![Images](img/F10-06.jpg)\n\n**图 10-6**：当鼠标光标移动到链接上时会弹出此警报。\n\n由于某事的发生不需要点击链接，浏览器之后不会尝试跟随该链接。事实上，有了这个脚本，你根本无法点击链接，因为当你移动鼠标到它上面准备点击时，警报会不断弹出！\n\
  \n## 键盘事件\n\n键盘事件发生在用户使用键盘与 Web 页面交互时。这些事件允许你对查看者按下和释放按键的每个阶段做出反应。键盘事件列在此：\n\n-\
  \ `keydown`: 发生在查看者按下键盘上的某个按键时。\n- `keypress`: 发生在查看者按下键盘上的某个按键并输入相应字符时。这发生在 `keydown`\
  \ 和 `keyup` 事件之间。\n- `keyup`: 发生在查看者松开键盘上的按键并释放按键时。\n\n例如，如果你想在每次向文本框中输入字符时都弹出一个警报，你可以使用以下代码：\n\
  \n![Images](img/f0270-01.jpg)\n\n这会在每次向文本框中输入字符时提醒查看者。在输入了几个字符后，这可能会变得非常烦人，但一旦你以后在本章的后半部分学习了事件对象，你将学会如何找到按的是哪个键，这将让你在处理键盘事件时更具灵活性。\n\
  \n### 尝试练习 10-1 聚焦与模糊\n\n`pr10_1.html`\n\n`prjs10_1.js`\n\n在这个项目中，你将使用 `focus` 和\
  \ `blur` 事件以及 `innerHTML`（来自第 9 章）来创建一个脚本，提醒用户在文本框中输入什么。\n\n#### 逐步步骤\n\n**1.**\
  \ 创建一个 HTML 页面并将其保存为 `pr10_1.html`。添加必要的标签，以便有一个 id 为 `pn` 的文本框。在文本框旁边将有一个 id 为\
