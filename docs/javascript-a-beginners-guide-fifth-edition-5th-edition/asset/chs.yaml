  \ 字符开头。\n\n**8.** 你应该避免使用 JavaScript 关键字和保留字作为变量名。\n\n**A.** 正确\n**B.** 错误\n\n**9.**\
  \ 下面哪一个变量声明使用了 JavaScript 中有效的变量名？\n\n**A.** `var return;`\n\n**B.** `var my_house;`\n\
  \n**C.** `var my dog;`\n\n**D.** `var 2cats;`\n\n**10.** 在 JavaScript 中，数据 __________\
  \ 包括数字、字符串、布尔、null、undefined、symbol 和对象。\n\n**11.** 在 JavaScript 中表示指数时，你需要在基数数字之后、指数之前使用字母\
  \ __________。\n\n**12.** 下面哪一个字符串声明是无效的？\n\n**A.** `var mytext = \"Here is some\
