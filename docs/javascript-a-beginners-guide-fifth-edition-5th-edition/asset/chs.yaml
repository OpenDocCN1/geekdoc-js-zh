  **D.** `let weekday= rightnow.getTime();`\n\n## 第 13 章 字符串\n\n### 核心技能\n\n- 使用字符串的属性\n\
  - 使用字符串的方法\n- 使用 Cookie\n- 使用正则表达式\n\n### 字符串简介\n\nString 对象提供了有关字符串的信息。本章首先解释什么是\
  \ String 对象以及如何处理字符串。String 对象有两种创建方式：使用构造函数或使用字符串字面量。\n\n### 字符串的属性\n\nString 对象拥有属性。要了解这一点，请查看以下代码：\n\
  \n```\nlet instance_name = String(\"xxx\");\n```\n\nString 对象允许访问其属性。例如，你可以获取字符串的长度：\n\
  \n```javascript\ninstance_name.length;\n```\n\n### 字符串的方法\n\nString 对象也有方法。例如，你可以获取特定位置的字符：\n\
  \n```javascript\ninstance_name.charAt(0);\n```\n\nString 对象提供了多种处理字符串的方法。本章将探索一些常用的方法。\n\
  \n\n\n\n\n`String` 对象的常用方法列在表 13-2 中（按功能分组）。更多方法可以在 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String#Methods`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String#Methods)\
  \ 找到。\n\n![Images](img/f0361-01.jpg)\n\n#### 表 13-2 String 对象的方法\n\n##### `charAt()`\
  \ 和 `charCodeAtAt()` 方法\n\n`charAt()` 方法确定字符串中特定位置上的字符是什么。它接收一个数字参数，代表该字符在字符串中的位置。\n\
  \n当你想要查找某个字符时，请记住位置计数从 0 开始（与数组一样），而不是从 1，因此第一个字符位于位置 0。下面的代码显示了如何使用 `charAt()`\
  \ 方法获取字符串中的第一个字符：\n\n![Images](img/f0361-02.jpg)\n\n这段代码将 `charAt()` 方法调用的结果赋值给名为\
  \ `first_char` 的变量，然后该变量被用于 alert。该警框将告诉观众调用该方法的文本字符串中的第一个字符。在这种情况下，警框将显示“第一个字符是\
  \ C。”\n\n如果你想找到最后一个字符，你需要在使用该方法之前知道字符串中有多少个字符，或者你可以使用 `length` 属性来确定字符串中字符的数量。在使用\
  \ `length` 属性时，请记住它返回的是字符的数量，而不是最后一个字符的位置。\n\n`length` 属性从 1 开始计数，而当你使用 `charAt()`\
  \ 方法时必须从 0 开始计数。因此，字符串中的最后一个字符的位置比它包含的字符数少 1。换句话说，如果字符串有 10 个字符（1–10），那么最后一个位置（0–9）就是\
  \ 9。例如，这段代码找到了字符串中的最后一个字符：\n\n![Images](img/f0362-01.jpg)\n\n这段代码将字符串 `length` 减\
  \ 1 的值赋值给名为 `position` 的变量。现在 `position` 变量持有字符串中最后一个字符的位置。将 `position` 值作为参数传递给\
  \ `charAt()` 方法的结果赋值给名为 `last_char` 的变量。最后，alert 提供了字符串中的最后一个字符，即 `r`。因此，观众会看到一个警框显示“最后一个字符是\
  \ r。”\n\n`charCodeAt()` 返回作为参数传递的位置上的字符的字符编码（关于字符编码的进一步讨论，你可以参考第 5 章）。例如，你可以使用以下代码：\n\
  \n![Images](img/f0362-02.jpg)\n\nalert 将告诉你字符串中位置 0 处的字符编码（字母 `H`），结果为 72。\n\n#####\
  \ `concat()`、`slice()` 和 `substring()` 方法\n\n提供这些方法是为了允许你以各种方式更改字符串的值。\n\n**`concat()`\
  \ 方法**\n该方法的工作方式与 `Array` 对象的 `concat()` 方法非常相似。它将调用方法的文本字符串与任意数量作为参数发送的其他文本字符串结合，并返回组合后的值。调用方法的字符串在顺序上靠前，而作为参数发送的字符串随后按顺序添加。下面的代码显示了使用\
  \ `concat()` 方法组合三个字符串的示例：\n\n![Images](img/f0362-03.jpg)\n\n这段代码按照顺序 `string1`、`string2`\
  \ 然后是 `string3` 组合字符串。结果是一个显示“I went to the store then I played a video game.”的\
  \ alert。请注意，MDN 强烈建议使用赋值运算符而不是 `concat` 来执行此操作。详情请参见 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/concat#Performance`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/concat#Performance)。\n\
  \n**`slice()` 方法**\n该方法切取字符串的一部分，并返回被切取的值。它的工作方式与数组的 `slice()` 方法非常相似。第一个参数告诉它从哪个位置开始切割，而第二个参数比停止的位置大\
  \ 1。例如，看看下面的代码：\n\n![Images](img/f0363-01.jpg)\n\n这段代码从位置 0 到位置 6 切割字符串。位置 7 是“cut”中\
  \ `c` 所在的位置；但它没有被切割，因为告诉 JavaScript 何时结束切割的参数比要切割的最后一个字符的位置大 1。因此，alert 将显示“Do not。”请注意，原始的\
  \ `the_text` 值保持不变。\n\n**`substring()` 方法**\n该方法的工作方式与 `substr()` 方法非常相似，但它允许你为想要移除的字符串部分发送起始位置和结束位置的参数。然后将被移除的部分作为新字符串返回。\n\
  \n例如，看看下面的代码。与其指定要移除的字符数量，你提供的是结束位置。从起始位置到结束位置减 1 的字符。（记住 `slice()` 方法。）\n\n![Images](img/f0363-02.jpg)\n\
  \n你移除的是单词“cut”。alert 将显示“not.”\n\n***注意***\n\n`slice()` 和 `substring()` 方法非常相似，但在特定情况下它们有差异。要了解更多信息，请访问\
  \ [`stackoverflow.com/questions/224382/what-is-the-difference-between-string-slice-and-substring-in-javascript`](http://stackoverflow.com/questions/224382/what-is-the-difference-between-string-slice-and-substring-in-javascript)\n\
  \n##### `fromCharCode()` 方法\n\n`fromCharCode()` 方法根据一系列作为参数发送的字符编码创建字符串。`charCodeAt()`\
  \ 方法返回给定位置字符的编码。这是你发送给 `fromCharCode()` 方法的值类型。此外，`fromCharCode()` 直接从 `String`\
  \ 对象调用，而不是从现有字符串调用，因为它是在拼接字符串。相反，它使用发送给它的参数来返回字符串。\n\n因此，如果你想向观众显示文本字符串“HI”，可以使用示例代码：\n\
  \n```\nwindow.alert(String.fromCharCode(72,73));\n```\n\n这段代码将第一个参数（字符编码 72）转换为\
  \ `H`。然后将第二个参数（字符编码 73）转换为 `I`。它们按照发送的顺序组合形成字符串“HI”，并作为 alert 显示给观众。\n\n\n\n\n`indexOf()`\
  \ 方法用于查找某个字符或字符串在字符串中的起始位置。它仅返回作为参数传递的字符或字符串**第一次**出现的位置。如果在字符串值中没有找到该字符或字符串，则返回值\
  \ –1。\n\n以下代码在字符串“Cool”中查找字母 `C`：\n\n![Images](img/f0365-01.jpg)\n\n请记住，位置计数从 0\
  \ 开始，所以当它发现 `C` 是字符串中的第一个字符时，它返回 0。因此，警框（alert）将显示为“您的字符位于位置 0。”\n\n注意，该方法是区分大小写的，因此在这种情况下，JavaScript\
  \ 认为 `C` 和 `c` 是两个不同的字符。因此，接下来的代码返回 –1（告诉您字符不在字符串中），即使字符串中确实有一个大写的 `C`。\n\n![Images](img/f0365-02.jpg)\n\
  \n警框现在将显示“您的字符位于位置 –1。”\n\n如果你想检查是否为 –1 以免将其误认为位置，可以使用以下代码在要查找的字符不在字符串中时发送一个不同的警框：\n\
  \n![Images](img/f0365-03.jpg)\n\n这一次，`if` 语句检查方法是否向变量 `position` 传递了 –1。如果是，警框会显示“您的字符不在字符串中！”否则，常规警框将告诉您位置。在之前的代码中，小写的\
  \ `c` 不在字符串中，因此出现了“您的字符不在字符串中！”的警框。\n\n`indexOf()` 方法仅返回你作为参数传递的字符第一次出现的位置的位置数字。因此，如果你使用接下来的代码，系统会提醒你你的字符位于位置\
  \ 1，即使它也位于位置 2：\n\n![Images](img/f0365-04.jpg)\n\n如果你使用 `indexOf()` 方法的第二个参数，对你的字符或字符串的搜索将从该位置开始，而不是从\
  \ 0 位置开始。因此，找到第二个“o”的一种方法是跳过位置 1 的第一个“o”，从位置 2 开始查找。\n\n![Images](img/f0366-01.jpg)\n\
  \n这一次，方法返回的结果为 2，因为它在指定的起始位置就找到了它。\n\n***注意***\n\n如果你想找到字符串的所有出现处，你可能想要使用正则表达式，这将在本章后文中讨论。\n\
  \n`lastIndexOf()` 方法查找某个字符或字符串在字符串中**最后一次**出现的位置。它仅返回作为参数传递的字符或字符串**最后一次**出现的位置。如果在字符串值中没有找到该字符或字符串，则返回值\
  \ –1。\n\n以下代码在字符串“Cool Cruising Car”中查找字母 `C`：\n\n![Images](img/f0366-02.jpg)\n\n\
  这段代码将显示一个警框，告诉观众“您的字符位于位置 14。”\n\n### `match()`、`replace()`、`search()` 和 `split()`\
  \ 方法\n\n这些方法都执行某种类型的模式匹配。\n\n- `match()` 方法比较正则表达式和字符串，以查看它们是否匹配。\n- `replace()`\
  \ 方法检查正则表达式是否匹配字符串，然后将匹配的字符串替换为新字符串。注意，你也可以对字符串进行 `replace` 操作。这只会替换第一个实例，但如果你只需要替换第一个实例，你可以这样做，而且不需要正则表达式即可完成。\n\
  - `search()` 方法执行正则表达式与指定字符串之间匹配的搜索。\n- `split()` 方法根据作为参数传递的字符，从字符串中创建一个字符串元素数组。\n\
  \n前三个方法涉及正则表达式，因此你将在本章后文的“正则表达式”部分学习更多关于它们的知识。\n\n#### `split()` 方法\n\n`split()`\
  \ 方法使用作为参数传递的字符作为分隔符，据此将单个字符串拆分为多个部分。它返回一个数组，其中每个部分都是字符串的一部分（去掉分隔符字符）。\n\n例如，接下来的代码有一个包含许多冒号的字符串：\n\
  \n![Images](img/f0367-01.jpg)\n\n赋值给变量 `the_text` 的字符串由用冒号分隔的几个水果名称组成。下一行通过 `split()`\
  \ 方法对文本字符串 `the_text` 创建一个名为 `split_text` 的数组。传递的参数是冒号，它被用于将字符串拆分为数组项。在这种情况下，数组最终有四个项。\n\
  \n***注意***\n\n作为参数传递的分隔符字符不会出现在数组中：它仅用作文本之间的分隔符，以便让方法知道每个项目从哪里开始到结束。\n\n下一行获取 `split_text`\
