  \ JavaScript\n\n# 索引\n\n## 致谢\n首先，我要感谢我优秀的妻子 Heather Pollock，感谢在我所做的一切给予的爱、支持和鼓励。我爱你！我还要感谢我的三个女儿\
  \ Eva、Elizabeth 和 Elaine，以及我的儿子 Evan。我爱你们！\n\n我要感谢我的父母 Bruce 和 Joy Anderson，他们的爱与指导，以及一直对我的努力的支持。\n\
  \n我要感谢 J. D. 博士和 Linda Andrews，他们的爱、指导和支持。\n\n此外，我还要感谢 Richard Pollock（哥哥）及家人、Misty\
  \ Castleman（姐姐）及家人、Warren Anderson（哥哥）及家人、Jon Andrews（哥哥）及家人、Lisa 和 Julian Owens（姨妈/舅舅）及家人，以及家中的每一位叔叔、舅舅、兄弟姐妹或其他亲戚。你们对我的生活产生了巨大的影响。\n\
  \n我要感谢 McGraw-Hill 的所有编辑，感谢他们在本书撰写过程中提供的卓越帮助和支持。感谢 Lisa McClain、Emily Walters、Claire\
  \ Yee、Snehil Sharma、Sarika Gupta、Bart Reed 以及所有参与此书及之前版本工作的编辑们。\n\n\n\n\n欢迎阅读《JavaScript\
  \ 入门（第五版》（JavaScript：入门指南，第五版）！几年前，我在浏览网页时，注意到人们在发布关于自己的页面，并称之为主页。在查看了许多此类页面后，我决定也创建一个主页。我当时不知道从何开始，但通过不断尝试，我学会了如何编写\
  \ HTML 并我的文档发布到 Web 服务器上。随着时间的推移，我在其他主页上看到了一些有趣的效果（比如凭空弹出的警告消息，或者当我移动鼠标到图像上时会发生变化的图像）。我感到非常好奇，*必须*知道这些效果是如何创建的。难道这些页面创建者使用了我不知道的\
  \ HTML 标签吗？\n\n最终，一个网站揭示了创建这些效果的工具：`JavaScript`。我开始搜索它的相关信息，并在网上遇到了一些教程和脚本。由于我学习过其他语言（例如一种名为\
  \ `Ada` 的相对冷门的语言），通过查看这些教程和脚本，我能够很快地上手 `JavaScript`。\n\n我学学到了足够的知识，于是决定创建一个向初学者教授\
  \ HTML 和 JavaScript 的网站。项目一启动，我就收到了访问者提出的超出我认知范围的问题——这迫使我深入挖掘并学习更多 `JavaScript`。结果，我完全熟悉了这种脚本语言以及它的功能。你不仅可以为网页添加有趣的效果，还可以创建执行有用任务的脚本，例如验证表单输入、为文档添加导航元素以及对用户事件做出反应。\n\
  \n本书的目标是帮助你学习 `JavaScript` 语言的基础知识，并尽可能减少抓头发和砸显示器的次数。从这本书中中学习 `JavaScript` 不需要任何预先的编程经验。你只需要具备\
  \ HTML 和/或 XHTML 的知识、级联样式表（CSS），以及如何使用你喜欢的文本编辑器和 Web 浏览器（更多信息请参阅第 1 章）。\n\n## 本书涵盖的内容\n\
  \n本书的 16 章涵盖了 `JavaScript` 语言的特定主题。前两章涵盖了该语言最基础的内容：它是什么、开始使用 `JavaScript` 需要知道什么，以及如何将\
  \ `JavaScript` 放入 HTML 文件中。书的中间部分（第 3 章–第 14 章）涵盖了从变量到在表单中使用 `JavaScript` 的入门 `JavaScript`\
  \ 主题。最后两章（第 15 章–第 16 章）介绍了一些高级技术，如果你在完成本书后想学习更多关于 `JavaScript` 的知识，它们将为你提供资源。\n\
  \n每章都包含了许多特殊功能辅助你学习 `JavaScript`。这些功能包括：\n\n- **关键技能与概念**：每章都从一组关键技能和概念开始，你将在章节结束时掌握这些内容。\n\
  - **提问专家（Ask the Expert）**：“提问专家”部分介绍了针对前文涵盖的主题的常见问题，并由作者给出解答。\n- **试一试（Try This）**：这些章节让你通过动手操作的方法练习你所学的知识。每个“试一试”都将通过分步说明引导你编写脚本，告诉你为了实现目标需要做什么。你可以在\
  \ McGraw-Hill Professional 网站 [www.mhprofessional.com/computingdownload](http://www.mhprofessional.com/computingdownload)\
  \ 上找到每个项目的解决方案。\n- **注释、提示和注意事项**：这些元素会引起你对阅读章节时发现的有用声明的注意。\n- **代码（Code）**：代码列表显示了脚本或程序中使用的示例源代码。\n\
  - **注框（Callouts）**：注框显示有关示例代码的有用提示和注释，并指向代码中的相关行。\n- **自测（Self Test）**：每章结束都有一个“自测”，由\
  \ 15 个问题组成，以检查你是否掌握了该章涵盖的主题。每个“自测”的答案可以在附录中找到。\n\n就是这些！你现在已经熟悉本书的结构和特殊功能，可以开启你的\
  \ `JavaScript` 之旅了。如果你发现自己遇到了困难并需要帮助，请随时向我提问。如需联系我，可以通过 LinkedIn（[`www.linkedin.com/in/john-pollock-82a2b074`](https://www.linkedin.com/in/john-pollock-82a2b074)）或在\
  \ Twitter (@ScripttheWeb) 上找到我。\n\n现在是时候学习 `JavaScript` 了。准备好了，准备就绪，玩得开心吧！\n\n##\
  \ 第 1 章：JavaScript 简介\n\n### 关键技能与概念\n\n- 使用文本编辑器、WYSIWYG 编辑器和 Web 浏览器\n- 定义 `JavaScript`\n\
  - 客户端编程与服务端编程的区别\n\n欢迎阅读《JavaScript 入门（第五版》（JavaScript：入门指南，第五版）！你显然对学习 `JavaScript`\
  \ 感兴趣，但可能不确定使用它需要什么。本章回答了关于 `JavaScript` 是什么的基本问题，提供了该语言的简要历史，并讨论了可以使用 `JavaScript`\
  \ 进行编程的各种环境。\n\n`JavaScript` 在全球网上无处不在。你可以使用 `JavaScript` 让你的网页更具交互性，对查看者的操作做出反应，并为你的网页添加一些特殊效果（视觉或其他）。`JavaScript`\
  \ 通常与超文本语言（HTML）和级联样式表（CSS）一起被作为初学者推荐的三种语言（无论你是为了业务还是兴趣构建网站）。当然，你可以只使用 HTML 和 CSS\
  \ 构建网页，但 `JavaScript` 允许你添加静态页面无法提供的额外功能。\n\n### 你需要知道的\n\n在开始学习 `JavaScript` 之前，你应该具备（或获得）以下方面的基础知识：\n\
  \n- HTML 和级联样式表（CSS）\n- 文本编辑器和 Web 浏览器\n- `JavaScript` 的不同版本\n- 客户端编程与服务端编程的区别\n\
  \n如果你具备这些基础知识，在阅读本书时会进展得很顺利。不需要掌握另一种编程/脚本语言或拥有以往的 `JavaScript` 经验。这是一本关于 `JavaScript`\
  \ 的**初学者**指南。\n\n如果你认为自己在上述某个领域没有足够的经验，仔细查看每一个领域可能帮助你决定该怎么做。\n\n#### 基础 HTML 和 CSS\
  \ 知识\n\n虽然你不需要成为 HTML 大师，但你确实需要知道在哪里放置某些元素（如 `head` 和 `body` 元素）以及如何添加自己的属性。本书将引用\
  \ head 部分（`<head>` 和 `</head>` 标签之间）和 body 部分（`<body>` 和 `</body>` 标签之间）的脚本。\n\n\
  有时，你还需要为标签添加属性以使脚本能够正常运行。例如，你可能需要使用 `id` 属性为表单元素命名，如下代码所示：\n\n```html\n<input type=\"\
  text\" id=\"thename\">\n```\n\n如果你了解标签和属性的基础知识，HTML 部分不会给学习 JavaScript 带来任何问题。\n\
  \n如果你没有 HTML 的基础知识，你可以通过多种媒体快速学习。例如，你可以买一本书或在网上寻找一些有用信息。一本好书是 Wendy Willard 编写的《HTML\
  \ 入门（第五版）》（McGraw-Hill, 2013）。要在网上查找关于 HTML 的信息，请查看 [developer.mozilla.org/en-US/docs/Learn/HTML/Introduction_to_HTML/Getting_started](http://developer.mozilla.org/en-US/docs/Learn/HTML/Introduction_to_HTML/Getting_started)。\n\
  \n\n\n\n偶尔，你可能需要使用 CSS 为网页添加或更改显示特性。在本书中，我们主要使用 CSS 的目的是为了通过 JavaScript 动态更改 CSS\
  \ 属性。学习 CSS 的好地方是 [developer.mozilla.org/en-US/docs/Learn/CSS/Introduction_to_CSS/How_CSS_works](http://developer.mozilla.org/en-US/docs/Learn/CSS/Introduction_to_CSS/How_CSS_works)。\n\
  \n## 基础文本编辑器和网络浏览器知识\n\n在开始编写 JavaScript 代码之前，你必须能够使用文本编辑器或 HTML 编辑器，以及 Web 浏览器。你将使用这些工具来编写脚本。\n\
  \n### 文本编辑器\n\n许多文本编辑器和 HTML 编辑器都支持 JavaScript。如果你熟悉 HTML，你可能已经使用过 HTML 编辑器来创建 HTML\
  \ 文件，因此你可能不需要更改。\n\n然而，某些 HTML 编辑器在添加 JavaScript 代码时存在一些问题（例如更改代码放置的位置或在保存文件时修改代码本身）。这在运行\
  \ WYSIWYG（所见即所得）编辑器时更为常见。最好使用如 Sublime、Visual Studio Code（推荐）或纯文本编辑器等代码编辑器。文本编辑器的示例包括\
  \ Notepad、TextPad 和 Simple Text。\n\n### 网络浏览器\n\n同样，如果你一直在编写 HTML 代码，你可能不需要更改你的浏览器。然而，某些浏览器在处理新版本的\
  \ JavaScript 方面会遇到困难。Web 浏览器的选择最终取决于你，只要它兼容 JavaScript 即可。我建议使用以下浏览器的最新版本来测试你的 JavaScript\
  \ 代码：\n\n* Google Chrome\n* Mozilla Firefox\n* Microsoft Edge\n\n这些浏览器的版本正在持续更新。最新版本将继续支持更多功能。\n\
  \n为了让你了解某些浏览器的外观，图 1-1 显示了在 Chrome 中查看的网页，图 1-2 显示了在 Mozilla Firefox 中查看的网页。\n\n\
  ![Images](img/F01-01.jpg)\n\n**图 1-1** 在 Google Chrome 中查看的网页\n\n![Images](img/F01-02.jpg)\n\
  \n**图 1-2** 在 Mozilla Firefox 中查看的网页\n\n如果你使用的是旧版浏览器且无法升级，那么许多功能（主要在书的后后部分讨论）可能在该浏览器中无法工作。尽管如此，本书仍然可以帮助你学习\
  \ JavaScript 语言本身（特别是当你使用 Node.js 而不是浏览器时），所以即使你有旧版浏览器也不必放弃。\n\n***注意***\n\n即使你拥有最新的浏览器之一，你的网站访问者也可能没有，因此了解哪些功能在旧浏览器中可能不受支持总是恰当的。本书将涵盖如何处理其中的许多问题。\n\
  \n## 哪一个版本？\n\n浏览器使用的 JavaScript 版本通常与它支持的 ECMAScript 版本相关联。你可以在 kangax.github.io/compat-table/es6/\
  \ 查看每个浏览器支持哪些 ECMAScript 版本。\n\nECMAScript 是 JavaScript 语言所使用的国际标准名称和规范，因此它并不是一种新语言，而是一个为\
  \ JavaScript、JScript 以及该语言的其他实现设定的标准。有关 ECMAScript 的更多信息，请参阅 [www.ecma-international.org/publications/standards/Ecma-262.htm](http://www.ecma-international.org/publications/standards/Ecma-262.htm)。\n\
  \n在编写此时，本节之前推荐的浏览器应该至少支持 ECMAScript 7。`Node.js` 使用 `V8` JavaScript 引擎，最新版本的 `Node.js`\
  \ 也应该至少支持 ECMAScript 7。\n\n### 记住，它不是 Java\n\nJavaScript 和 Java 是两种不同的语言。Java 是一种必须在执行程序之前进行编译（通过软件将层级代码转换为机器语言来运行程序）的编程语言。关于\
  \ Java 语言的更多信息可以在 [docs.oracle.com/javase/tutorial/](http://docs.oracle.com/javase/tutorial/)\
  \ 找到。\n\n###与其他语言的相似之处\n\nJavaScript 与与其他编程和脚本语言有相似之处。如果你有 Java、C++ 或 C 的经验，你会发现语法上的一些相似之处，这可能帮助你更快地学习。因为它是一种脚本语言，JavaScript\
  \ 也与 PHP 等语言有相似之处——PHP 也可以通过解释器运行而不是通过编译。\n\n如果你有任何语言的编程或脚本经验，将使学习 JavaScript 变得更容易——但并不是强制要求的。\n\
  \n## 客户端和服务端编程\n\n`Node.js` 的加入允许 JavaScript 在其传统的客户端空间之外，还可以在服务端运行。学习这些不同环境的知识将帮助你理解在客户端工作与在服务端工作时需要进行的编程类型。\n\
  \n一个*客户端语言*直接通过访问者使用的客户端运行。在客户端 JavaScript 的情况下，客户端通常是 Web 浏览器。因此，客户端 JavaScript\
  \ 直接在 Web 浏览器中运行，不需要处理 Web 服务器上的任何请求。局限性在于客户端 JavaScript 无法直接保存信息（尽管它可以将信息发送到服务端程序执行此操作）。\n\
  \n***注意***\n\n使用 `XMLHttpRequest` 对象和 `Fetch API` 允许 JavaScript 从服务器发送和请求数据。这些将在第\
  \ 14 章](#ch14.xhtml_ch14) 中简要介绍。\n\n客户端语言对于处理文档内容或在信息发送到服务器之前进行验证的任务非常有用。例如，当用户点击链接或按下按钮时，JavaScript\
  \ 可以更改网页上一个或多个元素的内容。\n\nJavaScript 还可以用于在表单提交服务器之前检查输入的信息。这种信息检查可以防止提交不准确或完整的信息，从而减轻\
  \ Web 服务器的压力。与其让程序一直运行直到信息正确，不如一次将正确的数据发送到服务器。这对用户也有益，因为客户端验证可以更快地提供反馈以允许用户进行修正。\n\
  \n***注意***\n\n虽然客户端 JavaScript 可以*帮助验证发送到服务器的信息*，但它不能取代服务端验证，因为用户可能在使用的设备上禁用了或无法使用\
  \ JavaScript（这允许他们绕过客户端验证）。出于安全考虑，无论你是否结合客户端验证，都应该始终使用服务端验证。\n\n对于客户端 JavaScript，提供了文档对象模型（`DOM`）以便访问文档中的不同元素。这在浏览器中对于\
  \ HTML 文档通常是可以访问的。\n\n*服务端语言*运行在服务端。例如，服务端语言可以用于从 Web 浏览器用户那里接收信息并根据该信息采取行动。服务端程序可以将信息发回\
  \ Web 浏览器，将其保存到数据库，或者执行任何其他 Web 浏览器无法独立完成的操作。\n\n\n\n\n传统上，服务器端编程使用 JavaScript 以外的语言，例如\
  \ `PHP`、`Perl`、`Python`、`Ruby`、`Java` 等许多语言。当 `Node.js` 出现时，它提供了在客户端之外的服务器端使用 JavaScript\
  \ 的机会。\n\n根据你或公司的需求，你可能会使用 `Node.js`，但本书将涵盖它，以便对 JavaScript 语言以及 JavaScript 可以使用的不同环境提供一个更完整的介绍。\n\
  \n## 专家问答\n\n**Q：你提到可以使用我选择的文本编辑器或 HTML 编辑器，但我不太确定这意味着什么。什么是文本编辑器，我在哪里可以找到它？**\n\
  \n**答：** 文本编辑器是你用来保存和编辑编写文本的程序。文本编辑器从简单到复杂不等，有很多选择：`Notepad`（记事本）、`WordPad` 和 `Simple\
  \ Text` 等。你也可以从网上购买并下载一些，如 `NoteTab` 或 `TextPad`。\n\nHTML 编辑器是更复杂的文本编辑器，或者是允许你通过点击按钮或其他手段添加代码的编辑器——通常被称为“所见即所得”（WYSIWYG）编辑器。\n\
  \n为了 JavaScript 编码的目的，你可能决定使用更面向代码的程序，它可以提供诸如代码高亮、自动补全、调试工具等功能，例如 `Visual Studio`\
  \ 或 `Sublime`。我推荐使用这些工具之一，因为它们提供了更多辅助编程的功能。\n\n**Q：关于使用文本编辑器我到底需要知道什么？**\n\n**答：**\
  \ 基本上，你只需要知道如何向编辑器中输入纯文本，以 `.html`、`.css` 或 `.js` 扩展保存文件，并能够在需要时再次打开并进行编辑。不需要特殊功能，因为\
  \ HTML、`CSS` 和 JavaScript 文件是由纯文本组成的，但像 `Visual Studio` 和 `Sublime` 等编码工具的功能在 particular\
  \ 编写 HTML、`CSS` 和 JavaScript 代码时非常有帮助。\n\n**Q：关于使用浏览器我需要知道什么？**\n\n**答：** 你绝对需要知道的只有如何在你的计算机（或网络）上打开一个本地\
  \ HTML 文件，以及如何刷新页面。如果你不知道如何从自己的电脑打开 HTML 文件，请打开浏览器并转到地址栏。输入 `file:///C:/` 并按 `ENTER`\
  \ 键。如果你使用的是 C 以外的驱动器器，请在示例中使用该字母代替 C。浏览器将显示驱动器器文件和文件夹，并允许你导航到想要打开的文件。点击 HTML 文件即可打开它。下面的插图显示了使用\
  \ `Google Chrome` 进入 C 盘的几个文件夹后可能显示的样子：\n\n![Images](img/I01-01.jpg)\n\n**Q：我可以在哪里获得你提到的那些浏览器？**\n\
  \n**答：** 这里是这些浏览器的链接：\n\n• **Google Chrome** [www.google.com/chrome/](http://www.google.com/chrome/)\n\
  • **Mozilla Firefox** [www.mozilla.com/firefox](http://www.mozilla.com/firefox)\n\
  • **Microsoft Edge** [`www.microsoft.com/en-us/windows/microsoft-edge`](https://www.microsoft.com/en-us/windows/microsoft-edge)\n\
  \n## 从 JavaScript 开始\n\nJavaScript 是 Netscape Communications Corporation 和 Sun Microsystems,\
  \ Inc. 合作的成果。这种新语言的新稿发布于 1995 年 12 月 4 日，当时 `Netscape Navigator 2.0` 还处于测试阶段。JavaScript\
  \ 1.0 版本随新浏览器一起发布。（在发布作为 JavaScript 之前，它被称为 `LiveScript`）。\n\nJavaScript 是一种基于原型的解释型语言，可以在许多环境中使用。为了扩展这个定义，让我们逐一查看它的重要部分。\n\
  \n### 基于原型\n\n`prototype-based` 意味着 JavaScript 是一种面向对象的编程语言，可以使用名为 `objects`（对象）的项。然而，这些对象不是基于类的（`class-based`），因此类和实例之间没有区别；相反，对象通过\
  \ `prototype` 属性继承其他对象。JavaScript 在 `ES6` 中做了更改，允许你使用 `class` 关键字，但语言在技术上并不是基于类的。你将在第\
  \ 10 章](#ch10.xhtml_ch10) 中学习如何处理 JavaScript 对象。在了解该语言的其他特性之前，你不需要详细了解它们。\n\n###\
  \ 解释型语言\n\n解释型语言不需要在运行之前编译程序。所有的解释都由客户端实时完成。客户端（例如 Web 浏览器或 `Node.js` 环境）是用来解释这种语言的。\n\
  \n对于编译型编程语言，在运行编写的程序之前，你必须使用特殊的编译器进行编译，以确保没有语法错误。对于脚本语言，代码在加载到客户端时就会被解释。因此，你可以更快速地测试代码的结果。然而，错误在脚本运行之前不会被捕获，如果客户端不能很好地处理错误，可能会导致问题。在\
  \ JavaScript 的情况下，错误处理是完善的。\n\n### 众多环境\n\nJavaScript 可以在许多环境中运行。最常见的环境是 Web 浏览器，因为\
  \ JavaScript 基本上已成为添加交互性的默认选择。\n\n虽然 JavaScript 经常与浏览器联系在一起，但许多其他环境在使用它，例如 `Adobe\
  \ Acrobat` 和 `Flash`（基于 `ECMAScript`）。此外，`Node.js` 允许 JavaScript 作为服务器端执行输入输出操作。\n\
  \n## 整合\n\n为了开始，你可能会好奇如何在浏览器中运行 JavaScript。你应该在哪里编写 JavaScript 代码，什么告诉它与众不同？这些答案是通用的，下一章将提供更多细节。\n\
  \nJavaScript 通过添加到 HTML 文档（直接添加或引用外部文件）在浏览器中运行。你可以向 HTML 添加特殊标签和指令，告诉浏览器需要运行脚本。当浏览器看到这些特殊标签时，会解释\
  \ JavaScript 并执行你指示的操作。\n\n```html\n<script>\n```\n\n因此，通过简单的编辑 HTML 文档，你就可以在页面上使用\
  \ JavaScript 并看到结果。\n\n例如，下面的代码向 HTML 添加了一些 JavaScript，在 Web 页面上写入文本。注意添加的 `<script>`\
  \ 和 `</script>` 标签。它们内部的代码是 JavaScript。\n\n![Images](img/001-01.jpg)\n\n下一章介绍了如何通过\
  \ `<script>` 和 `</script>` HTML 标签向 HTML 文件添加 JavaScript。这将是你成为 JavaScript 程序员的第一步！\n\
