  \n最后，创建主页页代码：\n\n![Images](img/f0410-05.jpg)\n\n这为你提供了一个包含 `newpage.html` 内容、名称为“cool”、尺寸为\
  \ 300×200 像素并带有菜单栏的新窗口。\n\n\n\n\n你用 `x-pixels` 替换为想要窗口从左向右移动的像素数。因此，如果你想让窗口向右移动，就输入一个正数。如果你想让它向左移动，就输入一个负数。\n\
  \n你用 `y-pixels` 替换为想要窗口从上向下移动的像素数，正数将窗口向下推，负数则将窗口向上拉。\n\n例如，如果你想给用户提供根据选择的像素数移动窗口的选项，你可以再次修改代码来处理此操作。对于\
  \ `mainpage.html`，使用以下代码：\n\n![Images](img/f0413-01.jpg)\n\n接下来，对 `openwin.js` 使用以下代码：\n\
  \n![Images](img/f0413-02.jpg)\n\n这在点击按钮时会将窗口向右移动 50 像素并向下移动 50 像素。注意，在移动之后调用了 `focus()`\
  \ 方法。当你点击主窗口中的链接来移动新窗口时，新窗口会失去焦点（触发 `blur` 事件）。移动仍然有效，但如果主窗口覆盖了它，你可能看不到这一点（因为在点击链接时它会重新获得焦点）。将焦点重新放在新窗口上将使其显示在任何其他打开的窗口之前。同样，可以使用\
  \ `blur()` 方法让窗口失去焦点，但浏览器可能会出于安全考虑禁用此功能，以确保窗口不会通过脚本隐藏。图 14-6 显示了新窗口从主页面上的按钮打开时的初始位置。\n\
  \n![Images](img/F14-06.jpg)\n\n**图 14-6** 新窗口在打开时处于初始位置的状态\n\nFigure 14-7 显示了点击“更改新页面”（Alter\
  \ New Page）链接后的窗口。注意，它在右侧和下方方向都移动了 50 像素。\n\n![Images](img/F14-07.jpg)\n\n**图 14-7**\
  \ 移动后窗口在新位置的状态\n\n通过这种方式，用户可以继续点击链接并向两个方向再移动窗口 50 像素。窗口将一直按照脚本中设置的像素数继续移动。大多数现代浏览器会在移动将导致窗口部分超出可视区域时停止移动窗口。\n\
  \n`moveTo()` 方法用于根据方法调用中提供的参数，将窗口移动到屏幕上的特定目标。以下是使用该方法的通用语法：\n\n`window.moveTo(x-value,\
  \ y-value)`\n\n在这里，你用 `x-value` 替换为窗口想要移动到屏幕左侧的像素数。例如，如果你输入 300，窗口将从左侧移动 300 像素。然后你用\
  \ `y-value` 替换为窗口想要移动到屏幕顶部的像素数。作为一个示例，修改你的 `openwin.js` 代码，使用 `moveTo()` 代替 `moveBy()`，如下代码所示：\n\
  \n![Images](img/f0414-03.jpg)\n\n![Images](img/f0415-02.jpg)\n\n这一次在点击链接时，窗口将移动到屏幕上的坐标\
  \ (50,50)。若要看到它的工作方式与 `moveBy()` 方法不同，请尝试再次点击链接。它不会再次移动，而是停留在原地，因为它已经到达了目的地。然而，如果你手动移动了新窗口，再次点击链接将将其移回\
  \ `moveTo()` 坐标。大多数现代浏览器不允许窗口的任何部分移到屏幕外。例如，移动到 (–10, –10) 的窗口可能会被浏览器移动到 (0, 0)。\n\
  \n### `resizeBy()` 和 `resizeTo()` 方法\n\n`resizeBy()` 方法通过方法调用中传递的参数给出的像素数来调整窗口大小。要让窗口变大，请使用正数。要使其变小，请使用负数。例如，你可以修改\
  \ `openwin.js` 代码，以便在点击时让新窗口变小，如下代码所示：\n\n![Images](img/f0416-01.jpg)\n\n此代码将使窗口的宽度和高度各减小\
  \ 100 像素。图 14-8 显示了新窗口首次打开时的样子，图 14-9 显示了新窗口在调整大小后的样子。\n\n![Images](img/F14-08.jpg)\n\
  \n**图 14-8** 新窗口最初打开时的状态\n\n![Images](img/F14-09.jpg)\n\n**图 14-9** 调整大小后的新窗口：高度和宽度均缩减了\
  \ 100 像素。\n\n与 `moveTo()` 类似，再次点击链接将继续调整其大小。出于安全考虑，大多数现代浏览器会在窗口达到最小允许尺寸后停止调整大小，并在窗口尺寸达到屏幕上的最大可视区域时停止。\n\
  \n`resizeTo()` 方法用于将窗口调整为特定尺寸，具体取决于方法调用中传递的参数。作为一个示例，再次修改你的 `openwin.js` 文件，如下代码：\n\
  \n![Images](img/f0416-02.jpg)\n\n点击“更改页面”链接会将窗口调整为 600x600 像素。如果尺寸大于可视区域，出于安全原因，大多数现代浏览器会限制。\n\
  \n#### `scrollBy()` 和 `scrollTo()` 方法\n\n`scrollBy()` 方法根据方法调用中传递的像素数来滚动窗口。`scrollTo()`\
  \ 方法用于将窗口滚动到特定目标。其用法与上述方法相同。\n\n### 处理图像\n\nJavaScript 使用图像对象来预加载图像、创建翻转效果，甚至创建幻灯片或动画。图像对象的属性有助于你创建此类脚本。表\
  \ 14-4 列出并描述了这些属性。\n\n![Images](img/f0418-01.jpg)\n\n**表 14-4** 对象的属性\n\n翻转（也称为悬停按钮、图像翻转或其他类似名称）可以为你的导航图像增添趣味。随着浏览器的进步，翻转通常通过\
  \ CSS 实现而非 JavaScript。你可以在 [`www.kirupa.com/css/rollovers`](https://www.kirupa.com/css/rollovers)\
  \ 查看示例。这是让翻转更容易实现的方法。\n\n#####  JavaScript 翻转\n\n简单的翻转是在鼠标悬停在初始图像上时将一个图像更改为另一个。首先，创建两个图像并让第二个图像在某些方面不同。例如，查看此处所示的图像：\n\
  \n我们需要两个独立的图像。\n\n一旦有了两个图像，你就可以开始编写图像翻转代码。你可以将初始图像编写到 HTML 文档中，并给它一个 id：\n\n![Images](img/f0419-01.jpg)\n\
  \n在你的 JavaScript 代码中，你只需要通过 id 获取图像元素，并在 `mouseover` 事件期间为 `src` 属性分配新值。然后， `mouseout`\
