  \n## 使用 Window 对象的方法\n\n现在你已经知道如何使用 `window` 对象的属性，可以继续学习使用 `window` 方法了。[表 14-2]\
  \ 列出了 `window` 对象的若干方法以及每个方法的描述，接下来的内容将更详细地描述特定方法。\n\n```\n![Images](img/f0399-01.jpg)\n\
  ```\n\n**表 14-2 Window 对象的方法**\n\n### alert(), prompt(), 和 confirm() 方法\n\n`alert()`、`prompt()`\
  \ 和 `confirm()` 方法都会弹出系统对话框，要求用户采取操作。例如，用户可以点击 OK 关闭警报框，或者在使用 `prompt()` 时在文本框中输入信息。\n\
  \n### alert() 方法\n\n在前面的章节的示例脚本中，你已经广泛地使用了 `alert()` 方法。它会向查看者弹出一个消息，查看者必须点击 OK\
  \ 按钮才能继续。\n\n### prompt() 方法\n\n`prompt()` 方法用于提示查看者输入信息。你在[第 6 章]中使用过此方法，允许用户在提示对话框中输入数据。\n\
  \n### confirm() 方法\n\n`confirm()` 方法可以给查看者一个确认或取消操作的机会。该方法返回 `true` 或 `false` 的布尔值，因此在使用时通常会将其结果赋值给变量。所以，如果你想将结果赋值给名为\
  \ `is_sure` 的变量并询问“你确定吗？”，你可以使用以下代码：\n\n```\nlet is_sure = confirm(\"Are you sure?\"\
  );\n```\n\n[图 14-2] 显示了上述代码显示的示例 confirm 对话框。注意查看者可以选择点击的两个按钮：OK 和 Cancel。如果用户点击\
  \ OK，方法返回 `true`。如果用户点击 Cancel，方法返回 `false`。注意，与 `alert()` 一样，由于这是由系统决定的，你无法更改按钮的文本。\n\
  \n```\n![Images](img/F14-02.jpg)\n```\n\n**图 14-2 confirm 对话框示例**\n\n\n\n\n你将 `function\
  \ content` 替换为你想要重复的代码。然后，你将 `time` 替换为在每次重复函数之前你想要等待的时间（以毫秒为单位）。\n\n所以，如果你真的想骚扰你的观众，可以使用这种方法在页面被查看后，每隔\
