  \ `fruits` 数组中。`big_array` 中的最终项为：\"oranges\"、\"apples\"、\"corn\"、\"peas\"、\"cat\"\
  、4、\"house\"、\"car\"。\n\n如果你不带任何参数使用 `concat()`，它会生成原始数组的一个副本。因此，以下代码只是为你提供了 `fruits`\
  \ 数组的一个副本：\n\n![Images](img/f0181-01.jpg)\n\n### `slice()` 方法\n\n`slice(start, [stop])`\
  \ 方法用于截取数组的指定部分，然后使用旧数组中截取部分的元素创建一个新数组。\n\n以下是使用该方法的通用语法：\n\n```\narrayname.slice(start,\
  \ stop);\n```\n\n你需要将 `start` 替换为开始截取的索引，将 `stop` 替换为要截取的最后一个元素之后的索引。\n\n例如，以下代码从数组中截取两个元素，并用这些元素创建一个新数组：\n\
  \n![Images](img/f0181-03.jpg)\n\n这会截取数组的第二个元素（索引 1）和第三个元素（索引 2）。它不会取出第四个元素（索引 3）。名为\
  \ `somefruits` 的新数组包含截取的元素（\"apples\"、\"pears\"）。\n\n**注意**\n\n如果不包含第二个参数，那么 `slice`\
  \ 方法会一直截取到数组末尾。这使得它成为复制数组的常用解决方案，例如使用 `slice(0)`，如 `let same_fruits = fruits.slice(0);`。\n\
  \n### `splice()` 方法\n\n`splice(begin, num_items, [add_item])` 方法允许你移除或替换数组中的项。可以传入的参数包括开始拼接的索引、要移除的项数，以及可选的要添加到数组中的新项。\n\
