  \n## 学习事件\n\n现在你已经知道了什么是事件处理器以及如何使用它们，你需要查看页面上的各种事件对应的事件处理器。首先查看表 10-1，该表列出了最常见的事件、事件处理器以及可能触发每个事件的操作示例。\n\
  \n![Images](img/f0261-01.jpg)\n\n**表 10-1** 常见事件与事件处理器\n\n***注意***\n\n还有许多你可能觉得有用的可用事件。由于可用事件变化很快，该表列了一些常用的事件。拖放功能的事件将在第\
  \ 16 章中讨论。\n\n\n\n\n\n现在你已经对事件处理程序有了大致的了解，并将详细查看一些最常用的处理程序，看看它们是如何工作的。\n\n## 点击事件\
  \ (The Click Event)\n\n你一直在过的点击事件是在观众点击 Web 页面上的元素时触发的。例如，你可以使用表单按钮并在它被点击时发送一个警框：\n\
  \n![Images](img/f0262-01.jpg)\n\n一旦按钮被点击，这将向观众发送一个警框。图 10-1 显示了观众点击按钮时该代码的结果。\n\n\
  ![Images](img/F10-01.jpg)\n\n**图 10-1** 当观众点击按钮时，会弹出此警框。\n\n如果你想用此事件处理器对链接执行相同的操作，你可能会倾向于编写类似下面的代码：\n\
  \n![Images](img/f0263-01.jpg)\n\n这段代码的问题在于，警框会起作用，但浏览器会尝试继续链接标签的原始操作，并尝试跳转到 [`none`](http://none)。这可能会导致浏览器中出现“找不到服务器”的错误。\n\
  \n避免“找不到服务器”错误的一种方法是链接到实际页面（这对可访问性是有好处的）；但如果观众启用了 JavaScript，它可能会让观众离开当前页面。为了在启用\
  \ JavaScript 时防止链接被跟随，你需要在点击事件的 JavaScript 中添加一条额外的语句。你需要告诉浏览器在向观众显示警框后不要继续。为了做到这一点，你将添加一个\
  \ `return false` 语句，这将阻止浏览器在显示警框后跟随该链接。以下代码显示了如何在内联中添加 `return` 语句：\n\n![Images](img/f0263-02.jpg)\n\
  \n有了这段代码后，点击事件将由 `onclick` 事件处理器处理，浏览器将不再需要担心尝试跟随 `href` 属性中的链接。在本章的稍后部分，你将学习如何使用防止默认行为的现代方法：`event.preventDefault()`。\n\
  \n**注意**\n\n你也可以通过 `javascript:` 命令为链接编写 JavaScript 代码——例如 `<a href=\"javascript:window.alert('Hi');\"\
  >点击</a>`——但出于可访问性考虑，不建议使用这种方法（如果禁用了 JavaScript，链接将无处可去）。\n\n## 聚焦与失焦事件 (Focus and\
  \ Blur Events)\n\n聚焦事件在观众给元素或窗口赋予焦点时发生。观众通过点击项目内的某处、使用键盘移动到该项目（通常通过 TAB 键）或通过脚本为项目赋予焦点。例如，点击文本输入框（在输入任何内容之前）的观众会为该文本框赋予焦点。此外，点击一个非活动窗口并使其成为活动窗口也会赋予该窗口焦点。聚焦事件还有一个相关方法称为\
  \ `focus()`，该方法将在第 11 章和第 14 章中介绍。\n\n为了看到聚焦事件的作用，你可以创建一个文本输入框，它是表单元素之一，可以允许你为元素赋予焦点。接下来的示例显示了如何实现这一点，以及如何编写一个在观众给文本框赋予焦点时弹出的提醒警框：\n\
  \n![Images](img/f0264-01.jpg)\n\n这段代码将在观众开始输入之前向其显示一个警框。该警框起到提醒将名称大写的作用。设置并增加计数器变量，是为了防止警框在用户每次聚焦文本框时都出现（将其限制为首次聚焦事件）。图\
  \ 10-2 显示了观众给文本框赋予焦点时，上述代码在浏览器中的结果。\n\n![Images](img/F10-02.jpg)\n\n**图 10-2** 当文本框接收到观众焦点时，会弹出此警框。\n\
  \n失焦事件（blur event）发生在观众从元素或窗口移除焦点时。要移除某处的焦点，观众通常会给其他东西焦点。例如，观众可以从表单元素移动到另一个，或从一个窗口移动到另一个。失焦事件还有一个相关方法称为\
  \ `blur()`，该方法将在第 11 章和第 14 章中介绍。\n\n**注意**\n\n失焦事件只有在观众赋予另一个区域焦点时才会触发，这是浏览器知道观众释放第一个区域焦点的唯一方式。例如，当观众在输入字段中按回车键时，焦点从输入字段转移到文档窗口。此外，如果你将焦点放在文本字段上然后切换标签页，事件也会触发。\n\
  \n为了看到失焦事件的作用，接下来的示例使用了两个文本框：点击第一个文本框赋予它焦点，点击第二个文本框会触发第一个文本框的失焦事件。\n\n![Images](img/f0265-01.jpg)\n\
  \n当观众点击第二个文本框时，他们会收到来自第一个框的警框，告诉他们回来。\n\n图 10-3 显示了上述代码在浏览器中运行的结果。注意，当警框弹出时，焦点在第二个文本框中。通过点击第二个文本框，观众触发了第一个文本框的失焦事件。\n\
  \n![Images](img/F10-03.jpg)\n\n**图 10-3** 当观众从文本框移除焦点时，会弹出此警框。\n\n## 加载与卸载事件 (The\
  \ Load and Unload Events)\n\n加载事件在 Web 页面完成加载时发生。如果你想在页面加载完成后显示警框，可以使用以下代码：\n\n\
