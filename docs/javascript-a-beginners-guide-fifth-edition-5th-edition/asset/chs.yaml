  \n结果是一个对象数组，其中包含了存储在数据库中的每个保龄球手的信息！\n\n### 尝试此练习 11-2 测试某些 SQL 查询\n\n`不需要文件，仅需 pgAdmin`\n\
  \n此项目将允许你尝试一些可以使用 SQL 查询执行的额外操作，以缩小结果集。到目前，你只是简单地获取了表中所有的行，但通过稍微修改查询，你可以获取更少的行，甚至只有单行。\n\
  \n#### 逐步操作\n\n**1.** 在 pgAdmin 中，在左窗格中选择你的 `mywebapp` 数据库。\n\n**2.** 进入 `Tools\
  \ | Query Tool` 查询面板中输入以下内容：\n\n```\nSELECT * FROM bowlers WHERE accuracy > 80;\n\
  ```\n\n**3.** 按 `F5` 运行查询。注意，结果列表中只有准确率高于 80 的保龄球手会显示。在这种情况下，结果应该是 Slow Roller 和\
  \ Prize Winner 的信息。添加 `WHERE` 子句可以将你的结果精炼为只符合某些特定标准的行。\n\n**4.** 将查询更改为以下内容：\n\n\
  ```\nSELECT * FROM bowlers ORDER BY power DESC;\n```\n\n**5.** 按 `F5` 运行此查询。注意所有行都返回了，但它们是按照力量评分从高到低顺序排序的。`ORDER\
  \ BY` 可以根据特定列的值对结果进行排序；可以是降序（`DESC`）或升序（`ASC`）。\n\n**6.** 将查询更改为以下内容：\n\n```\nSELECT\
  \ first_name, last_name FROM bowlers WHERE consistency >= 80;\n```\n\n**7.** 按 `F5`\
  \ 运行查询。注意，现在只返回了三个稳定性大于或等于 80 的保龄球手的名和姓。将 `*` 替换为一个或多个列名会将返回的列数限制为这些命名的列。\n\n####\
  \ 尝试此练习总结\n\n在此项目中，你通过 pgAdmin 中的 `Query Tool` 尝试了一些额外的 `SELECT` 查询。你能够精炼你的查询，以便以不同的方式获取信息，或限制返回的行或列数。要了解更多关于如何使用查询，请参阅\
  \ [beginner-sql-tutorial.com/sql-select-statement.htm](http://beginner-sql-tutorial.com/sql-select-statement.htm)。\n\
  \n## 创建 Web 服务器\n\n使用 Node.js 创建 Web 服务器有多种选择。事实上，如果你喜欢，可以编写自己的代码来实现。总而言之，标准做法是直接使用\
