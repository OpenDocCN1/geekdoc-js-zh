  \ JavaScript 的用户提供相同基本功能的一种示例。\n\n接下来，是 JavaScript 代码（保存为 `write_date.js`）：\n\n\
  ![Images](img/f0347-02.jpg)\n\n此脚本将方法的赋值赋值给变量。然后它创建一个数组来存储星期，稍后使用 `getDay()` 返回的数字作为索引。脚本随后进行了调整，将\
  \ `getMonth()` 返回的数字加 1，以便月份以你预期的方式显示（记住月份是从 0 开始计数的）。格式化后的输出被写入页面供查看者查看。该脚本在浏览器中运行的结果如图\
