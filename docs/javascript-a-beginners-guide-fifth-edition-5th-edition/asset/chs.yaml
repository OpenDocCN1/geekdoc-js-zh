  \n## 主窗口与新窗口\n\n出于安全考虑，主浏览器窗口通常被防止移动、调整大小、关闭或进行其他操作（例如，为了防止打开恶意网站的窗口，或防止打开微型弹出窗口）。因此，在前节中提到的许多方法（如\
  \ `resizeTo()` 或 `close()`）在主窗口中调用时不起作用。\n\n在许多情况下，浏览器允许你对弹出窗口进行控制。后续章节将讨论如何打开新窗口以及自定义它们在屏幕上的显示和位置。\n\
  \n### 注意\n\n即使使用新窗口，某些浏览器也不允许使用某些方法如 `resizeTo()` 或 `moveTo()`。此外，浏览器可能会直接在新标签页或主窗口中打开新内容，而不是弹出窗口。不建议在网站上使用弹出窗口（尽管它们在本地应用程序或其他\
  \ JavaScript 环境中有用途）。\n\n\n\n\n\n-   在某些浏览器中，弹出窗口只能在主窗口中打开，或者作为主浏览器窗口中的标签页打开。\n\
  -   在大多数情况下，无论为设计弹出窗口提供了什么信息，状态栏和/或位置栏都会显示。\n-   在某些浏览器中，弹出窗口可能不允许调整大小或移动。\n-  \
  \ 某些代码在本地运行时可能有效，但当页面上线时将无法工作。\n\n由于这些原因，在网站上使用弹出窗口通常不是一个好主意。尽管如此，如果你需要在本地环境或更安全的平台上与新窗口交互，则提供了以下信息。\n\
  \n**注意**\n\n与其使用新窗口，你可能希望使用一个覆盖在当前窗口上的对话框，但它不是弹出窗口。有关此的更多信息，请参阅 [jqueryui.com/dialog](http://jqueryui.com/dialog)。\n\
  \n### 打开新窗口\n\n`open()` 方法允许你使用 JavaScript 打开新窗口。该方法通常带有三个参数使用，如下例所示：\n\n```\nwindow.open(\"\
  URL\",\"name\",\"attribute1=value,attribute2=value\");\n```\n\n第一个参数“URL”被替换为要在新窗口中打开的\
  \ HTML 文档的 URL。“name”参数被替换为你赋予窗口的名称。第三个参数允许你为新窗口添加属性。这些属性通过在等号右侧使用“yes”、“no”或数值来设置。请注意，每当使用值设置一个属性时，下一个属性之前都有一个逗号，且之间没有空格。\n\
  \n如果你想打开一个具有当前窗口特性的窗口，可以通过省略带有属性的第三参数来实现。下面的示例将打开一个本地 URL 为 `newpage.html` 且名称为\
  \ `my_window` 的新窗口；它将与打开它的窗口具有相同的特性：\n\n```\nwindow.open(\"newpage.html\",\"my_window\"\
  );\n```\n\n### 属性\n\n如果你想包含窗口特性，你需要学习一些可以在窗口上使用的属性。表 14-3 列出了你可以作为 `open()` 方法第三个参数部分时使用的属性。\n\
  \n![Images](img/f0409-01.jpg)\n\n**表 14-3** 新窗口的标准属性\n\n任何未定义的“yes 或 no”属性如果未被浏览器覆盖，则默认为“no”。例如，`location`、`menubar`\
  \ 和 `status` 属性在大多数现代浏览器中可能默认为“yes”且不可更改。任何未定义的数值将使用所用浏览器的设置。这些也可能是不可更改的，或只允许某些值。例如，新窗口可能需要\
  \ `left` 和 `top` 坐标以将其放置在屏幕上的可视区域，并且 `width` 和 `height` 可能有你无法低于的最小值，以防止窗口小到用户无法察觉。\n\
  \n要打开一个宽度为 400 像素、高度为 300 像素的基础型新窗口，你可以使用以下代码：\n\n```\nwindow.open(\"newpage.html\"\
  ,\"my_window\",\"width=400,height=300\");\n```\n\n除了 `width` 和 `height` 之外，此窗口将使用其他属性的默认值打开，这取决于查看者使用的浏览器。\n\
  \n要设置其他属性，你可以根据是否需要每个功能为它们分配“yes”或“no”的值。如果你愿意，你也可以用 1 表示 yes，用 0 表示 no，因为它们的效果相同。因此，如果你想有一个带有菜单栏（这会添加前进、后退、停止和其他类似的按钮）的\
  \ 300×200 像素窗口，你可以使用以下代码：\n\n```\nwindow.open(\"newpage.html\",\"cool\",\"width=300,height=200,menubar=yes\"\
  );\n```\n\n这为你提供了一个包含 `newpage.html` 内容、名称为“cool”、尺寸为 300×200 像素并带有菜单栏的新窗口。\n\n\
  你可以通过逗号分隔每个属性，在第三个参数的引号内添加任意数量的属性。\n\n**注意**\n\n由于空间限制，本书中的新窗口命令在代码中偶尔跨跨多行。请确保在使用代码时，将从\
  \ `window.open` 到结束分号（`;`）的所有内容放在同一行，以避免 JavaScript 错误。\n\n下面的示例打开了一个具有 表 14-3 中提到的大多数特性的窗口（再次，这里占据了多行，但当你向文本编辑器中输入它时，代码应该在单行上）：\n\
