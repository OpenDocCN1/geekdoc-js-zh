  • 一个包含复制脚本的优秀教程网站：[www.javascriptkit.com](http://www.javascriptkit.com)\n• 你向其他程序员提问\
  \ JavaScript 问题的地方：[stackoverflow.com/questions/tagged/javascript](http://stackoverflow.com/questions/tagged/javascript)\n\
