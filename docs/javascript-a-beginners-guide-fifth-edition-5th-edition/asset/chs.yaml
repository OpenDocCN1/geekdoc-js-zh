  \n### 其他方法\n\n其余的方法以某种方式执行了其他方法未涵盖的各种任务。\n\n### parse() 方法\n\n`parse()` 方法用于计算作为参数的日期字符串（例如\
  \ 1999 年 12 月 12 日）自 1970 年 1 月 1 日午夜以来的毫秒数。这通常与 `setTime()` 方法配合使用，因为它需要毫秒参数来设置时间。你可以使用\
  \ `parse()` 方法找到 1999 年 12 月 12 日午夜自 1970 年 1 月 1 日以来的毫秒数（`Date` 对象的 `rightnow`\
  \ 实例将此作为所有方法返回值的日期），如下所示：\n\n![Images](img/f0345-02.jpg)\n\n这段代码将日期解析为毫秒数，然后将其发送给用于\
  \ `Date` 对象 `rightnow` 实例的 `setTime()` 方法。\n\n### toString(), toDateString(), toTimeString(),\
