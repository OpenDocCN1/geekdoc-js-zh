  \ 1，因此只会移除一项；所以这里只移除了索引 2 处的元素（\"pears\"）。执行 `splice` 后，数组只包含三项：\"oranges\"、\"apples\"\
  、\"grapes\"。\n\n要移除多个项，你需要增加第二个参数的值。以下代码从索引 2 开始移除两项：\n\n![Images](img/f0182-01.jpg)\n\
  \n这次数组被缩减为两项（\"oranges\"、\"apples\"），因为最后两项被 `splice()` 方法移除了。\n\n你也可以使用 `splice()`\
  \ 方法来替换数组中被拼接的项，或者向数组中添加项。以下代码通过传入额外的参数，将索引 2 处的被拼接项替换为新项：\n\n![Images](img/f0182-02.jpg)\n\
  \n这次，索引 2 处的项被移除。由于第二个参数是 1，只移除了一项。下一个参数被添加到数组中第一个参数（2）指定的索引处。这个值（\"watermelons\"\
  ）替换了被移除的值（\"pears\"）。现在数组将包含以下项：\"oranges\"、\"apples\"、\"watermelons\"、\"grapes\"\
  。\n\n如果你想使用 `splice()` 方法向数组中添加一个或多个项，但不移除任何项，可以将第二个参数设置为 0（从而移除零个元素）。将第一个参数设置为希望开始添加元素的索引。例如，请看以下代码：\n\
  \n![Images](img/f0182-03.jpg)\n\n添加项从索引 2 开始，如第一个参数所指定，并且没有移除任何项，如第二个参数所指定。添加了两项之后，数组将有六项：\"\
  oranges\"、\"apples\"、\"watermelons\"、\"plums\"、\"pears\"、\"grapes\"。\n\n### `indexOf()`\
  \ 和 `lastIndexOf()` 方法\n\n`indexOf([string])` 和 `lastIndexOf([string])` 方法是在 ECMAScript\
  \ 5 中新增的，提供了一种在数组中搜索项的方式。`indexOf()` 方法从前向后搜索数组，而 `lastIndexOf()` 从后向前搜索。如果找到该项，则返回索引；如果未找到，则返回\
  \ -1。\n\n以下代码展示了这两种方法的使用方式：\n\n![Images](img/f0182-04.jpg)\n\n这里，使用 `indexOf(\"\
  apples\")` 返回 1，因为它在索引 1 处找到了第一个 \"apples\" 实例。从后向前使用 `lastIndexOf(\"apples\")`\
  \ 返回 3，因为最后一个 \"apples\" 实例在索引 3 处。注意，当项不在数组中时，返回 -1。因此，你应该避免使用类似 `if (fruits.indexOf(\"\
  grapes\"))` 这样的结构。\n\n可以为这两种方法提供第二个参数，以指定开始搜索的索引。这使得 `indexOf()` 或 `lastIndexOf()`\
  \ 可以跳过之前的实例，只返回从该索引开始搜索到的项的索引。例如，考虑以下代码：\n\n![Images](img/f0183-01.jpg)\n\n在这种情况下，调用\
  \ `fruits.indexOf(\"apples\", 2)` 从索引 2 而不是 0 开始搜索。这意味着它会跳过索引 1 处的第一个 \"apples\"\
  \ 实例，从索引 2 开始搜索，并返回 3。调用 `lastIndexOf(\"apples\", 1)` 从索引 1 开始向前搜索。在这种情况下，索引 3 处的\
  \ \"apples\" 被跳过，它找到了索引 1 处的实例。\n\n最后，需要注意的是，这两种方法都使用 `===` 运算符而不是 `==` 运算符来确定是否找到了项。因此，不会进行类型强制转换，必须精确匹配才能成功搜索。例如，考虑以下代码：\n\
  \n![Images](img/f0183-02.jpg)\n\n由于 \"2\" 和 2 不严格相等，因此未找到项，返回 -1。在使用这些方法时请牢记这一点，以避免出现意外结果。\n\
  \n### `every()`、`filter()`、`forEach()`、`map()` 和 `some()` 方法\n\n`every()`、`filter()`、`forEach()`、`map()`\
  \ 和 `some()` 方法是在 ECMAScript 5 中新增的，提供了一种将函数作为参数调用的方式，该函数会对数组中的每个项执行操作。这些函数根据对数组中每个项调用参数中函数的结果返回一个值。它们被称为*迭代*函数，意味着它们会循环遍历（或迭代）数组中的每个项。以下是每个迭代方法被调用时的作用：\n\
  \n- `every()`：对每个数组项执行提供的函数，如果函数对*所有*项都返回 true，则返回 true\n- `some()`：对每个数组项执行提供的函数，如果函数对*任意*项返回\
  \ true，则返回 true\n\n\n\n\n\n- `filter()`: 对数组中的每个项执行提供的函数，并返回一个由函数返回 true 的项组成的数组。\n\
  - `map()`: 对数组中的每个项执行提供的函数，并返回一个对每个项调用该函数得到的结果数组。\n- `forEach()`: 对数组中的每个项执行提供的函数。不返回任何值。\n\
  \n要使用这些方法之一，你需要调用它并提供一个函数名作为参数，例如所示：\n\n![Images](img/f0184-01.jpg)\n\n在 `every()`\
  \ 方法遍历所有数组项并运行指定的命名函数（`pass_grades`）后，返回的结果将存储在名为 `the_result` 的变量中。\n\n例如，假设名为\
  \ `pass_grades()` 的函数用于判断学生在所有记录的成绩中是否都在 70 分或以上，代码所示：\n\n![Images](img/f0184-02.jpg)\n\
  \n这将根据成绩是否大于或等于 70 返回一个布尔值。你会发现该函数接受三个参数：第一个是当前数组项的值，第二个是当前数组的索引，第三个是数组本身。当调用任何迭代方法时，这些值会被作为参数传递给指定的函数（此处为\
  \ `pass_grades`）。\n\n`pass_grade()` 函数在迭代过程中返回了以下五个结果：true、false、true、true、true。由于\
  \ `every()` 方法要求所有返回值都为 true 自身才会返回 true，在这种情况下，由于索引 1 处有一个低分（65），它将返回 false。\n\n\
  在前面的代码中，用其他每个方法代替 `every()`，将产生以下结果：\n\n- 调用 `some()` 将返回 true，因为只需要返回值中有一个为 true\
  \ 即可（在这种情况下，五个返回值中有四个是 true）。\n- 调用 `filter()` 将返回一个包含所有返回 true 项的数组。在这种情况下，该数组将是\
  \ `[94, 71, 84, 99]`。原始数组中索引 1 处的项（65）因为返回 false 而被排除。此新数组被赋值给变量 `the_result`。\n\
  - 调用 `map()` 将返回一个包含每个函数调用结果的数组。在这种情况下，该数组将是 `[true, false, true, true, true]`。此新数组被赋值给变量\
  \ `the_result`。\n- 调用 `foreach()` 将不返回任何内容。它只是简单地为数组中的每个项运行函数。\n\n**注意**\n\n如果你需要对数组中的每个项执行某些操作，你不应该依赖\
  \ `some()` 或 `every()`，因为 `some()` 一旦遇到匹配的条件就会停止，而 `every()` 一旦遇到失败的条件就会停止。\n\n\
  ### `reduce()` 和 `reduceRight()` 方法\n\n`reduce()` 和 `reduceRight()` 方法也是在 ECMAScript\
  \ 5 中引入的。这些方法也会遍历数组项，但它们会构建一个返回的最终值。这些方法与迭代方法类似，使用函数作为参数。参数函数本身接受两个参数：累加值和当前值。第一次迭代将第一个项和第二个项分别作为累加值和当前值传递。\n\
  \n例如，考虑以下代码：\n\n![Images](img/f0185-01.jpg)\n\n当调用 `reduce()` 时，值从前往后进行迭代，在这种情况下将创建一个负数（–58）。第一次通过时，2\
  \ 和 4 被作为参数，执行 `2–4 = –2`。下一次通过时，结果（–2）作为 `prev_value` 传递，8 作为 `next_value` 传递，执行\
  \ `-2–8 = –10`。这种模式持续到得到最终结果 –58。\n\n当调用 `reduceRight()` 时，会发生相同的过程，但是从后往前移动。在这种情况下，首先传递\
  \ 32 和 16 作为参数，执行 `32–16 = 16`。接下来，将 16（结果）和 8 作为参数传递，执行 `16–8 = 8`。这种模式持续到得到最终结果\
  \ 2。\n\n### `toString()`、`toLocaleString()` 和 `valueOf()` 方法\n\n`toString()`、`toLocaleString()`\
  \ 和 `valueOf()` 方法实际上是将数组的元素组合成一个单一字符串，并以逗号作为分隔符（类似于使用带有逗号分隔符的 `join` 方法）。如果需要，可以调整\
  \ `toLocaleString()` 方法以返回项值的本地化版本。在讨论字符串时，你将在第 13 章学习更多关于 `toLocaleString()` 方法的知识。\n\
  \n### `find()`、`findIndex()`、`includes()` 和 `keys()` 方法\n\nECMAScript 6 添加了许多新方法，用于查找数组中的项、索引和数组键。现在，除了\
  \ `indexOf()` 之外，你还有其他选项，在寻找特定信息时可能对你更有帮助。\n\n首先，可以使用 `find()` 方法找到对提供的测试函数返回 true\
  \ 的第一个数组项的值。如果没有匹配的项，它将返回“undefined”。这是一个实际运行的示例：\n\n![Images](img/f0186-01.jpg)\n\
  \n接下来，`findIndex()` 与 `find()` 非常相似，但它返回测试函数返回 true 的项的索引。如果没有找到匹配的项，则返回 -1。如果你不想搜索整个数组，还可以提供一个起始起始索引。以下代码显示了一个示例：\n\
  \n![Images](img/f0186-02.jpg)\n\n`includes()` 方法在数组中搜索提供的值。如果找到了该值，方法返回 true；否则，该方法返回\
  \ false。\n\n`keys()` 方法将返回数组中的键，这些键仅仅是迭代数字（0, 1, 2 等）。以下代码显示了一个示例：\n\n![Images](img/f0186-03.jpg)\n\
  \n### `flat()` 和 `flatMap()` 方法\n\n`flat()` 和 `flatMap()` 方法可以将嵌套数组展展开一个没有嵌套数组的数组。在下一节中，你将学习嵌套数组，这些方法将会变得更清晰。以下代码显示了\
  \ `flat()` 的示例（在读完嵌套数组后返回此处）：\n\n![Images](img/f0187-01.jpg)\n\n### `Array.isArray()`、`Array.from()`\
  \ 和 `Array.of()` 方法\n\n这些数组方法是通过 `Array` 关键字调用的，因为它们的操作对象可能是数组也可能不是。\n\n例如，`Array.isArray()`\
  \ 方法测试指定的值是否为数组。示例所示：\n\n![Images](img/f0187-02.jpg)\n\n`Array.from()` 方法可以使用各种类型的数据（如字符串或类数组）创建数组。从字符串创建数组的快速示例所示：\n\
  \n![Images](img/f0187-03.jpg)\n\n这里需要注意的一是，如果你向 `Array.of()` 发送单个参数，它的行为与 `new Array()`\
  \ 不同。`new Array(3)` 会创建一个包含三个空项的数组，而 `Array.of(3)` 则创建一个值为 3 的单项数组。\n\n#### 专家问\n\
  \nQ: 在所有属性中，是否有哪些是对数组特别用的？\n\nA: 如你所见，`length` 属性是最常用的属性。`index` 和 `input` 属性在处理正则表达式时非常有用，正则表达式将在第\
  \ 13 章中讨论。\n\nQ: 有什么简单的方法可以记住所有的方法？\n\nA: 与其他列表一样，你记忆它们的程度取决于你使用它们的频率。一个有帮助的方法是寻找互补的组合，例如\
  \ `pop()` 和 `push()`，或者 `shift()` 和 `unshift()`。\n\nQ: 所以，`reverse()` 方法只是把所有东西反转过来。我为什么要那样做呢？\n\
  \n\n\n\n\n**A:** 你可能想要反转数字的顺序，以创建一个将最大数字显示在前面的列表（例如，成绩或温度）。在某些情况下，你可能还会决定让字符串按字母倒序列出。\n\
