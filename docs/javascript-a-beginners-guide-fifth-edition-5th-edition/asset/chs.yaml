  # 第 15 章\n\n## JavaScript 表单与数据\n\n### 核心技能与概念\n\n* 访问表单\n* 使用表单对象的属性和方法\n* 确保表单的可访问性\n\
  * 表单验证\n* HTML5 与表单\n* AJAX 和 JSON\n\n使用 JavaScript 访问表单时可以为 Web 页面创建新的脚本。本章首先解释如何使用\
  \ JavaScript 访问表单。然后你将学习用于表单和表单元素的各种属性和方法。你还将学习表单与可访问性、如何验证表单元素，以及如何将`<select></select>`元素作为导航工具。\n\
  \n## 访问表单\n\n每当你向 HTML 文档添加一组 `<form>` 和 `</form>` 标签时，就会创建一个表单对象。要使用 JavaScript\
  \ 访问其中一个表单，可以使用以下任一选项：\n\n* 使用 `document` 对象的 `forms` 数组\n* 在起始表单标签中命名表单并使用该名称访问表单\n\
  * 在起始表单标签中为表单提供 `id` 并使用 `document.getElementById()` 方法访问它\n\n#### 使用 forms 数组\n\
  \n`forms` 数组允许你通过数组索引来访问表单。页面上的每组 `<form>` 和 `</form>` 标签都会按照它们在文档中出现的顺序在 `forms`\
  \ 数组中创建一个额外的条目。因此，你可以这样引用文档中的第一个表单：\n\n`document.forms[0]`\n\n正如你所记得的，数组从 0 开始计数，因此前面的示例将访问文档中的第一个表单。如果你想访问第二个表单，可以使用以下代码：\n\
  \n`document.forms[1]`\n\n这适用于页面上的其余表单。只需记住从 0 开始计数而不是从 1 开始，即可访问正确的表单。\n\n访问表单本身并不会执行任何操作。你访问的表单是一个对象（object）。要使用它，你该该对象的属性或方法。表单对象的属性和方法列在后面的章节“使用表单对象的属性和方法”中，但现在可以看一眼\
  \ `length` 属性看看它的作用。\n\n##### 属性值\n\n本节的示例使用了表单对象的 `length` 属性。该属性允许你发现 HTML 表单存在多少元素（如输入框、选择框、单选按钮等）。例如，请看这段代码：\n\
  \n![Images](img/f0429-01.jpg)\n\n该代码创建了一个短表单，包含三个元素：两个文本框和一个提交按钮。因为它是页面上唯一的表单，所以它将是第一个表单，允许你使用\
  \ `document.forms[0]` 访问它。要使用 `length` 属性，请将其添加到末尾如下：\n\n`document.forms[0].length`\n\
  \n使用前面的代码，你可以创建一个短脚本来告诉查看者表单中有多少元素。接下来的代码将向查看者显示信息：\n\n![Images](img/f0429-03.jpg)\n\
  \n该代码显示表单有三个元素。15-1\n\n![Images](img/f0429-03.jpg)\n\n**图 15-1**\n\n##### 两个长度属性\n\
  \n当存在多个表单时，如果你想显示元素的数量，可以使用为每个表单打印消息的脚本。记得有一个 `forms` 数组，你可以找到它的长度。`forms` 数组的长度是页面上表单的数量。要获取表单的数量而不是单个表单的长度，可以使用以下代码：\n\
  \n`document.forms.length`\n\n因此，你需要记住这些点：\n\n* `document.forms.length` 获取页面上表单的数量。\n\
  * `document.forms[x].length` 获取特定表单元素的数量，其中 `x` 是表单的索引。\n\n这种语法看起来有点复杂，但只需记住一个长度属性是通用的，而另一个用于特定的表单。\n\
  \n### 注意事项\n\n记住 `document.forms.length` 和 `document.forms[x].length` 的区别。前者获取页面上表单的数量，后者获取特定表单元素的数量（通过替换\
  \ `x` 为数字）。下面的脚本使用了两个长度属性和一个循环来遍历每个表单。代码将显示页面上每个表单元素的数量。首先是 HTML 代码（保存为 lengths.html）：\n\
  \n![Images](img/f0430-02.jpg)\n\n![Images](img/f0431-01.jpg)\n\n接下来是 JavaScript\
  \ 代码（保存为 lengths.js）：\n\n![Images](img/f0431-02.jpg)\n\n该代码在 HTML 文档中创建了两个表单。脚本随后启动一个从\
  \ 0 开始（数组从开始计数）并在达到 `document.forms.length` 值之前结束的循环。因为有两个表单（这使得 `document.forms.length`\
  \ 的值为 2），计数从 0 运行到 1 然后停止。计数允许你访问索引为 0 和 1 的 `forms` 数组，它们将分别是 HTML 代码中的第一个表单和第二个表单。\n\
  \n\n\n\n\n`formnum` 变量的值是数组中的位置索引加一，即在 HTML 代码中看到的表单编号。随后脚本使用 `document.write()`\
  \ 语句写入页面上每个表单的元素数量。\n\n`forms` 数组使用 `count` 变量的值作为索引号，这样在每次循环中，都能找到指定表单中的元素数量。图\
  \ 15-2 显示了该代码在浏览器中运行的结果。\n\n![Images](img/F15-02.jpg)\n\n**图 15-2**  显示了每个表单中的元素数量。\n\
  \n### 使用 ID\n\n访问表单的第三种方法是使用 `id` 属性，然后使用 `document.getElementById()`。这通常是访问表单及其元素最清晰的方法，因为你可以通过每个元素的单独\
  \ `id` 来访问它们，而之前的两种访问方法需要你知道表单位于哪个数组索引，或者知道表单名称和元素名称。\n\n> **注意**\n> 如果你需要复习如何使用\
  \ `getElementById()` 访问元素，可以参考第 9 章。\n\n如果你想使用 `id` 方法重写上一节节的脚本，可以使用以下 HTML 代码：\n\
  \n![Images](img/f0431-03.jpg)\n\n接下来是 JavaScript 代码：\n\n![Images](img/f0432-02.jpg)\n\
  ```\n\n由于你已经在之前的章节中熟悉了如何使用 `document.getElementById()`，因此这对你来说应该是一个简单易懂的方法。\n\n\
  你访问表单及其元素所使用的方法取决于你正在编写的脚本类型。如果你在页面上使用多个表单，那么 `forms` 数组可以是遍历每个表单的方便方法。另一方面，在 XHTML\
  \ 1.0 Strict 中进行验证将需要你使用 `id` 为每个表单元素命名，因此在这种情况下使用 `id` 方法更为合适。随着本章的深入，你将看到更多关于如何访问表单中元素的内容。\n\
  \n### 使用表单对象的属性和方法\n\n当你需要在脚本中访问表单的某些元素或属性时，JavaScript 表单对象将为你提供帮助。表单对象只有几个属性和方法。首先描述这些属性。\n\
  \n### 属性\n\n表单对象的属性提供了你在脚本中处理表单时可能需要的信息。表 15-1 列出了表单对象的属性及其值。\n\n![Images](img/f0433-02.jpg)\n\
