  如果你想要该方法返回的新长度，可以将结果赋值给一个变量。以下代码执行此操作，然后向查看者发送一个包含返回值的警报：\n\n![Images](img/f0177-01.jpg)\n\
  \n由于向数组末尾添加了两个元素，数组的新长度将为 4，并且会向查看者发送一个警报，显示“The array now has 4 items”。\n\n**注意**\n\
  \n对于有其他语言编程经验的人来说，`push()` 和 `pop()` 将数组视为栈（后进先出）。将它们与 `shift()` 和 `unshift()` 方法结合使用，可以使数组像队列一样工作。\n\
  \n### shift() 方法\n\n`shift()` 方法用于移除数组的第一个元素。它返回被移除元素的值。\n\n以下代码使用 `shift()` 方法移除数组的第一个元素：\n\
  \n![Images](img/f0177-02.jpg)\n\n这段代码创建了一个包含三个元素的数组，并使用 `shift()` 方法移除第一个元素。这导致数组只剩下两个元素（“apples”、“pears”）。\n\
  \n要使用被移除元素的值，可以将该方法的结果赋值给一个变量。以下代码将移除的元素赋值给一个变量，然后向查看者警报被移除的内容：\n\n![Images](img/f0177-03.jpg)\n\
  \n这段代码在浏览器窗口中显示警报“You picked my oranges”。\n\n### unshift() 方法\n\n`unshift([item])`\
  \ 方法用于向数组开头添加元素。你希望添加到数组中的元素作为参数发送。该方法返回的值是数组的新长度。\n\n以下示例向数组开头添加一个新元素：\n\n![Images](img/f0177-04.jpg)\n\
  \n这将创建一个包含两个元素的数组，然后使用 `unshift()` 方法向开头添加一个元素。数组随后包含三个元素（“oranges”、“apples”、“pears”）。\n\
  \n如果你想一次添加多个元素，可以按照希望添加的顺序将它们作为参数发送。以下示例向数组开头添加两个元素：\n\n![Images](img/f0178-01.jpg)\n\
  \n这将获取初始数组，并向开头添加两个元素。调用 `unshift()` 方法后，数组最终包含四个元素（“oranges”、“grapes”、“apples”、“pears”）。\n\
  \n### reverse() 方法\n\n`reverse()` 方法用于反转数组中元素的顺序。为了演示如何使用此方法，以下代码创建一个数组，然后反转元素的顺序：\n\
  \n![Images](img/f0178-02.jpg)\n\n数组的初始顺序是“oranges”、“apples”、“pears”。当调用 `reverse()`\
  \ 方法时，元素的顺序变为“pears”、“apples”、“oranges”。请注意，这会改变原始数组，而不是返回一个新数组。\n\n### sort() 方法\n\
  \n`sort([sort_function])` 方法将每个数组元素转换为字符串值，然后根据字符串值按升序排列元素。以下代码展示了此方法的一个示例：\n\n\
  ![Images](img/f0178-03.jpg)\n\n这将重新排序数组，使元素按字母顺序排列：“apples”、“grapes”、“oranges”、“pears”。\n\
  \n但请记住，字符串是根据其字符代码进行比较的（请参阅第 5 章中的“大于运算符 (>)”部分）。如果存在大小写差异，可能会导致返回意外的顺序：\n\n![Images](img/f0178-04.jpg)\n\
  \n由于最后一个元素首字母大写，排序后数组的顺序是“Grapes”、“apples”、“oranges”、“pears”。为了解决这个问题，你可以使用字符串的\
  \ `toLowerCase()` 方法，确保所有值都以小写形式进行比较，并在排序后返回预期的顺序：\n\n![Images](img/f0178-05.jpg)\n\
  \n这样一来，顺序将变为“apples”、“grapes”、“oranges”、“pears”。\n\n由于 `sort()` 方法将所有值转换为字符串，即使数组只包含数值，也会根据它们转换为字符串后的结果进行排序：\n\
  \n![Images](img/f0179-01.jpg)\n\n排序后的顺序不是预期的数值顺序（1, 2, 3, 20），而是 1, 2, 20, 3，因为值被作为字符串进行比较。为了解决这类问题，JavaScript\
  \ 允许你指定一个*比较函数*作为 `sort()` 方法的参数。\n\n比较函数是一个带有两个参数的函数，根据比较两个参数值的结果返回正数、负数或零。例如，这里展示了一个简单的比较函数：\n\
  \n![Images](img/f0179-02.jpg)\n\n基本上，如果第一个参数大于第二个参数，比较函数应返回正数；如果第一个参数小于第二个参数，则返回负数；如果两个参数相等，则返回零。这将按升序对元素进行排序。将前面代码中所示的函数作为\
  \ `sort()` 方法的参数，将使数字按预期的数值顺序排列，因为大于运算符会将数字作为数值进行比较，而不是将它们转换为字符串。以下是一个实际示例：\n\n\
  ![Images](img/f0179-03.jpg)\n\n这样一来，排序将按预期顺序放置元素：1, 2, 3, 20。\n\n### concat() 方法\n\
  \n`concat([array])` 方法会将数组与发送给它的参数连接起来，并返回一个包含所有元素的新数组。它不会影响原始数组。你可以使用数组名称或单个值作为参数，并按顺序提供它们。\n\
  \n第一个示例将两个数组的元素合并。为此，只需使用一个参数——要连接到的数组的名称，该数组调用该方法：\n\n![Images](img/f0180-01.jpg)\n\
