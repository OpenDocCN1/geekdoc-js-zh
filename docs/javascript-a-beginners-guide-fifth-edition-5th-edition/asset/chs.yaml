  \n### 总结\n\n在这个项目中，你利用对 JavaScript 和 jQuery 的知识来响应用户事件创建动画。jQuery 让编写代码并使其同时跨浏览器工作变得更加简单。\n\
  \n## 专家问答\n\n**Q: 有很多库！我怎么知道用哪一个呢？**\n\n**A:** 你决定使用哪一个取决于你的需求和你的编码风格。例如，如果你想用更短的语法在更多的浏览器中实现事件注册和处理，jQuery\
  \ 是一个很好的选择。如果你有其他 jQuery 或其他知名库无法满足的需求，在 Web 上搜索可能会提供帮助的额外选项。\n\n**Q: 我需要学习 jQuery\
  \ 吗？我不能直接写 JavaScript 代码吗？**\n\n**A:** 这也取决于你的需求。如果你的老板希望你使用它，或者你需要编写具有最大跨浏览器兼容性的代码，那么你可能想要学习它。如果你的脚本设计为仅在最新浏览器上运行（而不需要在旧浏览器中正常工作），那么你可能不需要学习它。这完全取决于你任何时候的需求。\n\
  \n**Q: jQuery 做得比我在这里看到的更多吗？**\n\n**A:** 是的，它可以做很多事情。有更高级的选择器、额外的效果以及许多插件来满足库本身无法满足的任何额外需求。你可以在\
  \ [docs.jquery.com/Main_Page](http://docs.jquery.com/Main_Page) 了解更多并阅读更高级的信息。\n\
  \n**Q: 有用于开发游戏的库吗？**\n\n**A:** 有的！如果你想深入游戏开发，可以查看以下内容：\n\n- PixiJS: [`github.com/pixijs/pixi.js`](https://github.com/pixijs/pixi.js)\n\
  - Phaser: [`github.com/phaser/phaser`](https://github.com/phaser/phaser)\n- Babylon.js:\
  \ [`github.com/Babylonjs/babylonjs`](https://github.com/babylonjs/babylonjs)\n\n\
  \n\n\n# 扫描脚本\n\n如果错误信息没有帮助你定位问题，你可以尝试自己扫描脚本以查找错误。这种方法可能更加枯燥，但如果错误信息没有帮助的话，它可能会帮助你找到问题。表\
  \ 16-2 显示了你应该尝试查找的一些项目。\n\n![Images](img/f0480-03.jpg)\n\n**表 16-2** 扫描脚本查找错误时需要寻找的项目\n\
  \n以下代码充斥着错误；看看你能找到其中几个：\n\n![Images](img/f0480-02.jpg)\n\n![Images](img/f0481-01.jpg)\n\
  \n代码缺少了许多必要项目。以下是你应该发现的项列表：\n\n*   **第 3 行和第 4 行之间**：函数缺少左大括号。\n*   **第 4 行**：单词\
  \ `alert` 拼写为 `alery`；`like` 单词后面缺少双引号；变量 `mycar` 拼写为 `mynar`。\n*   **第 5 行**：`alert`\
  \ 方法缺少右括号。\n*   **第 7 行**：单词 `new` 拼写为 `neq`。\n*   **第 9 行**：数组索引数字缺少左方括号。\n*  \
  \ **第 10 行**：缺少循环的左括号。\n*   **第 11 行**：`somearray[0]` 的索引数字缺少右方括号。\n*   **第 11 行和第\
  \ 12 行之间**：缺少结束循环的右大括号。\n\n你可能不会这么多这么多，但这个示例提供了一种扫描脚本时捕捉这些错误的好方法。当你更擅长定位这些小错误后，当脚本出现问题时，你就能快速找到它们。\n\
  \n## 寻找逻辑错误\n\n逻辑错误通常难以发现，因为代码的语法是正确的。你将尝试寻找代码实现方式中的错误。例如，查看以下代码（但不要运行它！）：\n\n![Images](img/f0481-02.jpg)\n\
  \n这段代码没有语法错误。所有的分号和引号都处于它们应该在的位置。这里的问题是，变量 `x` 永远不会大于变量 `y`。这种情况会导致无限循环，可能导致浏览器崩溃。\n\
  \n你可以通过在循环内部添加一行来增加 `x` 的值、减少 `y` 的值，或者同时增加 `x` 并减少 `y`。关键点是必须采取某些操作来使条件变为假。以下代码显示了该问题的可能解决方法：\n\
  \n![Images](img/f0482-01.jpg)\n\n## 使用控制台\n\n如果某些值看起来不正确，可以通过将它们发送到控制台并在脚本的任何位置快速检查。例如，假设你有以下代码：\n\
  \n![Images](img/f0482-02.jpg)\n\n当运行这段代码时，`alert` 将显示“Infinity”，这可能不是预期结果。在初始变量定义和将计算结果\
  \ `(x/y)` 赋值给变量 `z` 之间如果有额外的代码，扫描代码时可能很难发现正在发生除零操作。要找到错误之处，你可以在计算变量 `z` 之前在代码中放置\
  \ `console.log()`，看看它是否能帮助你看到发生了什么，如下例所示：\n\n![Images](img/f0482-03.jpg)\n\n当控制台显示计算结果为“2/0”时，你可以看到变量\
  \ `y` 的值为零导致了问题。知道这一点后，你可以查找任何给变量 `y` 赋值的代码行，看看结果是否导致了 `y` 被赋值为零。在这种情况下，这发生在代码的第二行，可以通过给\
  \ `y` 分配一个不同的值来修正。\n\n`console.log()` 方法允许你在控制台中放置一条消息，现代浏览器使用它来跟踪当浏览器读取 HTML、CSS\
  \ 和 JavaScript 代码时发生的错误、警告或其他消息。\n\n**注意**\n\n在调试完成后，最好移除你的测试代码，因为最好不要在生产代码中包含大量用于调试的控制台消息。\n\
  \n你通常可以通过右键点击页面并选择“检查”（Inspect，或类似的选项）在浏览器中显示控制台。这将打开浏览器的开发者工具，你可能需要在其中点击“控制台”（Console）标签页。\n\
  \n除了 `console.log()` 之外，你还可以使用 `console.warn()` 或 `console.error()` 为测试和或生产代码显示警告或错误。在测试期间调试时，这些非常有帮助，可以发现哪些条件可能导致脚本出现问题。例如，当浏览器无法从\
  \ `XMLHttpRequest` 获取信息时，有一个 `console.error()` 消息可以帮助你调试可能导致信息未加载的原因。\n\n### 使用\
  \ Lint 工具\n\n多亏于一些专家级开发者，现在有了可以帮助你的工具。Lint 工具会查看你的代码并识别潜在问题。这里有两个流行的 Lint 工具：\n\n\
  *   JSLint\n*   JSHint\n\n这两个工具都允许你粘贴 JavaScript 代码并进行检查。Lint 工具可以在你运行代码之前指出潜在问题，将剩余的调试任务降至最低。通过遵循工具对这段代码的建议，你可以避免数字\
  \ 1 等于字符串 1，并且允许 `if` 和 `else` 语句在每个块中添加额外的代码行而不会产生问题。\n\n\n\n\n\n大多数现代主流浏览器都通过内置或扩展程序提供了一套开发者工具。这些工具在调试\
  \ JavaScript 时也非常有帮助。以下是一些关于如何访问/获取以及使用这些工具的教程链接：\n\n* **Chrome 调试器** [`developers.google.com/web/tools/chrome-devtools/`](https://developers.google.com/web/tools/chrome-devtools/)\n\
  * **Edge 调试器** [`docs.microsoft.com/en-us/microsoft-edge/devtools-guide`](https://docs.microsoft.com/en-us/microsoft-edge/devtools-guide)\n\
  \n# 专家问答\n\n**Q：我收到的错误信息显示我不懂的内容。我该怎么办？**\n\n**A：** 错误信息并不总是符合逻辑，也不总是指向代码中正确的某行。你可能需要追踪你在信息所给的那行上调用的任何变量或函数，或者检查其附近的行是否有错误。当你看到几次错误信息后，它的含义就会变得更容易理解。\n\
  \n**Q：当我尝试运行代码时，代码中的某些内容导致浏览器崩溃，而且我无法通过添加 alerts 来帮助查找问题，因为它每次都会崩溃！我该怎么办？**\n\n\
  **A：** 如果脚本导致浏览器崩溃，请仔细检查你的变量、循环、对象和函数。你也可以尝试使用浏览器扩展，例如 `Firebug`，它允许你根据需要在大脚本中设置断点。作为最后的手段，从头开始编写一些新代码。\n\
  \n**Q：我代码中的错误不仅导致浏览器崩溃，还导致电脑崩溃了！我该怎么办？**\n\n**A：** 重启电脑但*不要*再次运行代码。仔细检查以是否能找到问题。\n\
  \n**Q：还有其他策略可以帮助我调试脚本吗？**\n\n**A：** 一些文本编辑器使用颜色编码来标记 HTML 标签、JavaScript 代码或其他类型的代码。颜色编码可以帮你更清晰地看到代码，并更容易检测错误。（尝试使用\
  \ `Vim` 或 `NoteTab` 文本编辑器。）\n\n# JavaScript 与无障碍\n\n你在书中多次看到的一个主题是脚本或脚本的 HTML 代码与无障碍性之间的关系。在某些情况下，州法律或联邦法律（如《美国残疾人法》）可能要求网站对残障人士是可访问的。即使这对于你的网站来说不是法律问题，它仍然是一个可用性问题：你希望尽可能多的访问者可以使用你的网站并获取你为提供的信息。\n\
  \n无障碍性的通用主题是，内容需要对所有浏览器和其他可能访问网站的软件可访问。这意味着你的内容不仅应该被各种 Web 浏览器读取，还应该被辅助技术读取（例如来自\
  \ Freedom Scientific 的 `JAWS` 屏幕阅读软件）或手机等便携式设备上的 Web 浏览软件读取。\n\n## 将内容与呈现分离\n\n\
  通常，使网站内容具有无障碍性的第一步是将无障碍性构建到你的 `HTML`/`XHTML` 代码中，但你还需要调整你的 `JavaScript` 代码。正如你可能已经知道的，在编写\
  \ `HTML` 时，你可以使用层叠样式表（`CSS`）来呈现内容（显示多少列、字体样式、各种区域的宽度等），同时使用 `HTML` 仅对内容本身进行标记（例如使用\
  \ `<div></div>` 标签将内容分为若干部分，或插入图像等对象）。这解决了处理纯 `HTML` 内容的问题，因为使用样式表而不是 `HTML` 标记进行呈现，可以确保你能够为不同类型的浏览器提供不同的\
  \ `CSS` 样式，或者让那些不具备 `CSS` 能力的浏览器用户仍获得纯文本的结构化标记（例如，不会有列或字体颜色等），从而允许他们仍然查看页面内容。\n\n\
  对于 `JavaScript`，使内容具有无障碍性通常意味着确保你在脚本中使用的内容已经显示在页面上，或者通过链接或其他手段可用。一个可能有帮助的方法是将所有的\
  \ `JavaScript` 代码（或尽可能多的代码）移动到外部 `JavaScript` 文件中，同时在 `HTML` 代码中保留尽可能少的 `JavaScript`\
  \ 代码。\n\n例如，你可能有一个使用以下代码的网页：\n\n![Images](img/f0486-01.jpg)\n\n这段代码对于有 `JavaScript`\
  \ 的人来说运行良好。然而，将脚本放在 `HTML` 代码中会导致在你需要更新 `HTML` 代码时，需要在文件中反复滚动滚动（尤其是当你有一个很长的脚本时）。因此，你可能想采取的第一步是将脚本移动到外部文件，如下代码样本所示。首先是新的\
  \ `HTML` 代码：\n\n![Images](img/f0486-02.jpg)\n\n接下来是 `myscript.js` `JavaScript` 文件：\n\
  \n![Images](img/f0486-03.jpg)\n\n这使得 `HTML` 文件更短、更容易读，因为 `JavaScript` 功能被放置在它自己的文件中，避开了\
  \ `HTML` 代码。\n\n你可能想采取的下一步操作是更改 `HTML` 标签中 `onclick` 事件处理器的用法。虽然这是有效的，但如果你决定使用不同名称的函数，或者决定将其变成一个不带\
  \ `JavaScript` 的普通链接，就会变得麻烦，因为你需要更新代码。\n\n```javascript\n// 使用事件处理器的示例\ndocument.getElementById('sale').onclick\
  \ = function() {}\n```\n\n最后说明一点是，对于没有 `JavaScript` 的人，该链接什么都不做。由于警告的内容是你需要访问者知道的（以便他们知道有促销），你希望确保即使是没有\
  \ `JavaScript` 的访问者也能获取此消息。你可以在页面其他地方显示它，使用一组 `<noscript></noscript>` 标签内联显示消息，或者对链接进行编码使其指向带有消息的\
  \ `HTML` 页面，如下代码所示：\n\n![Images](img/f0487-03.jpg)\n\n你可以将消息放在命名为 `sale_alert.html`\
  \ 的文件中：\n\n![Images](img/f0487-04.jpg)\n\n这确保了无论是否有 JavaScript，所有用户都可以访问消息。\n\n\
  ### 增强内容\n\n一种确保广泛无障碍性且被广泛使用的技术是：首先为查看者提供内容，然后使用 `JavaScript` 为那些运行它的用户提供更具吸引力的体验。这通常被称为“渐进式增强”（progressive\
  \ enhancement），允许所有用户使用网站，同时为拥有现代浏览器的用户提供更丰富的体验。\n\n这就是你在上一节中通过脚本（小规模地）所的事情。通过在点击链接时提供“促销”消息，你使其对所有访问者都可访问。然而，拥有\
  \ `JavaScript` 的用户无需离开页面并返回即可查看警告，从而增强了他们自己的体验。\n\n\n\n\n\n这个过程可以像上一个例子一样简单，也可以复杂到需要添加大量的\
  \ JavaScript 代码来适配各种浏览器，和或添加服务器端脚本来帮助那些没有 JavaScript 的用户。你可以在[渐进增强](https://maqentaer.com/devopera-static-backup/http/dev.opera.com/articles/view/progressive-enhancement-and-the-yahoo-u/index.html)](https://maqentaer.com/devopera-static-backup/http/dev.opera.com/articles/view/progressive-enhancement-and-the-yahoo-u/index.html)\
  \ 中了解更多信息。Yahoo! 拥有一套非常详细且系统的渐进增强系统，允许 JavaScript 代码在尽可能多的浏览器中运行，同时也为没有 JavaScript\
  \ 的用户提供服务器端脚本或 HTML 内容。\n\n**提示**\n\n关于 JavaScript 和表单的可访问性信息，请参阅第 15 章，该章节讨论了这一主题以及与\
  \ JavaScript 使用表单。\n\n### 尝试 16：让此代码具有可访问性\n\n`pr15_2.html`\n\n`sales.html`\n\n\
