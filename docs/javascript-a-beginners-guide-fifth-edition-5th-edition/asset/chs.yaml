  \n#### 访问元素\n\n`document.getElementById()` 方法允许你通过其 id 属性的值访问 HTML 文档中带有 `id` 属性的任何元素。为了访问你一直使用的\
  \ id 为 `say_hi` 的按钮输入元素，可以使用以下代码：\n\n![Images](img/f0259-02.jpg)\n\n现在，你可以将函数代码放入\
  \ JavaScript 文件 (`js_event_01.js`) 中的函数表达式中，如下：\n\n![Images](img/f0259-03.jpg)\n\
  \n该函数表达式（显示两个 `alert`）被赋值用于处理输入按钮的点击事件。因此，当按钮被点击时，就会调用该函数。\n\n***警告***\n\n在使用 `getElementById()`\
