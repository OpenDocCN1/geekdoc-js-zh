  \n![Images](img/F15-10.jpg)\n\n**图 15-10** 初始 HTML 页面\n\n![Images](img/F15-11.jpg)\n\
  \n**图 15-11** 获取数据后的页面\n\n此脚本方便地返回了一个简单的文本字符串，但你可能希望返回更多数据，以便你能够显示更详细的结果。返回这些数据可能会导致一个字符串，你必须对其进行拆分以获取值（例如，“John=2&Nick=34&Doug=32&Paul=25”）。这可以实现，但如果这些数据能以\
  \ JavaScript 更容易使用的格式返回会更好。JSON 让这种可能成为可能，并在文中进行了更详细的讨论。\n\n### 进一步阅读\n\n关于 AJAX\
