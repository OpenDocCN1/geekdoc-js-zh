  \n**Q: 我很快就会制作窗口远程控制器吗？**\n\n**A:** 一个改变主窗口属性（如 `location` 属性）的新窗口就是“远程控制器”。虽然书中没有讨论远程控制器，但网络上的免费脚本网站上有这些脚本。目前，你只需要确保掌握创建和操作普通新窗口所需的编码。注意，在两个窗口之间运行可能会引起安全问题。\n\
