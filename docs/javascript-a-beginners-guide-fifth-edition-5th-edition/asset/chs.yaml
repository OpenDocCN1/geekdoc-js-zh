  \ HTML 文档——最常见的是根路由 `/` 或“主页”。对于一个简单的本地 Web 服务器，这意味着你希望能够在 Web 浏览器中打开 [`localhost`](http://localhost)\
  \ 并看到显示的 HTML 页面。\n\n开始，在你的项目文件夹中创建一个包含以下代码的 HTML 文件并将其保存为 `index.html`，如下：\n\n\
