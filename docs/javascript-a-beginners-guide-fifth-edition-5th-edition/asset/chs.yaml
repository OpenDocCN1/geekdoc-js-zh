  \ `setTimeout()` 调用。\n\n所以，如果你想给观众一个避免接收警告的机会，你可以为他们添加一个在十秒内可以点击的按钮。如果及时点击按钮，`setTimeout()`\
  \ 调用就会被取消，不会弹出警告框。以下是示例代码：\n\n![Images](img/f0405-01.jpg)\n\nJavaScript 代码：\n\n\
  ![Images](img/f0405-02.jpg)\n\n如果及时点击按钮，观众就可以避免收到关于签名留言板的警告。\n\n### 问专家\n\n**Q:\
