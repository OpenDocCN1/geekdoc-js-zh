  \ HTML 页面上 `results` div 的 `innerHTML` 显示出来。\n\n有了能够轻松使用从服务器端应用获取的数据的能力，你可以增强脚本以为用户提供更多选项，而无需重新加载整个页面即可获取结果。\n\
