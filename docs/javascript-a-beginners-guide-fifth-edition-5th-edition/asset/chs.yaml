  \n## 数组属性和方法\n\n数组有许多属性和方法可供你在脚本中使用。这些属性和方法允许你执行添加项、移除项、排序项、合并数组等操作。数组之所以拥有这些属性和方法，是因为在\
  \ JavaScript 中数组是对象（你将在第 8 章中了解对象）。首先，你将了解数组属性，然后是数组方法。\n\n### 属性\n\n表 7-1 列出了 `Array`\
  \ 对象的属性，并提供了每个属性的简短描述。每个属性将在后续章节中详细讨论。\n\n![Images](img/f0172-02.jpg)\n\n**表 7-1**\
  \ Array 对象的属性\n\n##### constructor 和 prototype 属性\n\n`constructor` 属性包含创建数组原型的函数代码的值。它只是返回这个值：\n\
  \n![Images](img/f0172-01.jpg)\n\n`prototype` 属性允许你向已存在的对象（如 `Array` 对象）的所有实例添加属性和方法。向数组原型添加内容会影响脚本中使用的所有数组，目前最好避免这样做。你将在第\
  \ 8 章中了解更多关于构造函数和原型如何工作的内容。\n\n##### index 和 input 属性\n\n要理解 `index` 和 `input` 属性，你首先需要了解正则表达式（用于匹配文本字符串），这需要较长的解释，如第\
  \ 13 章所述。关于 `index` 和 `input` 属性的讨论将留到那一章。\n\n##### length 属性\n\n正如你所见，`length`\
  \ 属性返回一个数字，告诉你数组中有多少个元素。由于你已经在使用它，可以参考前面的章节获取更多信息。\n\n### 方法\n\n现在你已经了解了 `Array`\
