  \ __________ 它们。\n\n**A.** 关闭\n\n**B.** 读取\n\n**C.** 编写\n\n**D.** 编译\n\n## 第 3 章\n\
  \n## 使用变量\n\n### 核心技能与概念\n\n* 理解变量\n* 为什么变量很有用\n* 为你的脚本定义变量\n* 理解变量类型\n* 在脚本中使用变量\n\
  \n现在你已经学习了如何向 Web 页面添加 JavaScript 的基础知识，是时候进入该语言的内部机制了。由于变量是 JavaScript 编码的重要部分，你将需要尽可能多了解它们是什么以及为什么它们在你的脚本中很有用。一旦你理解了变量是如何工作的以及它们能做什么，你就可以转向其他基于各种类型变量使用的的其他主题。\n\
  \n在本章中，你将从学习变量是什么以及它们为什么很有用开始。然后你将继续了解用于声明变量的方法以及如何给变量赋值。最后，你将看到如何在你的脚本中使用变量。\n\n\
  ### 理解变量\n\n一个 `variable`（变量）代表或持有一个值。变量的实际值可以随时更改。为了理解变量是什么，请回想你在代数课上可能记得的一个一个基础语句：\n\
  \n`x=2`\n\n字母 `x` 被用作变量名。它被赋值为 2。要更改该值，你只需给 `x` 分配一个新的赋值：\n\n`x=4`\n\n变量名保持不变，但现在它代表一个不同的值。\n\
  \n将数学课的例子再向前进一步，你可能需要解决过像这样的问题：\n\n`如果 x=2, 那么 3+x=?`\n\n为了得到答案，你将值 2 放在问题中变量 `x`\
  \ 的位置，得到 `3+2=5`。如果 `x` 的值改变，问题的答案也会随之改变。所以，如果 `x=7`，那么计算就会变为 `3+7`，现在的结果是 10。\n\
  \nJavaScript 中的变量与数学中使用的变量非常相似。你给变量命名，然后根据你的需求为它赋值。如果变量的值改变，它将改变脚本内部发生的某些事情。\n\n\
  ### 为什么变量很有用\n\n使用变量有几个用处：\n\n* 它们可以用在编写代码时其所代表的值未知的地方。\n* 它们可以节省你编写和更新脚本的时间。\n\
  * 它们可以使你的代码目的更清晰。\n\n#### 变量作为未知值的占位符\n\n通常，变量会在内存中为在编写脚本时未知的值留出一个位置。变量的值可能会根据访问者输入的内容而改变，或者由你稍后在脚本代码中更改。\n\
  \n例如，你可能有一个函数，根据用户输入接收某些值（函数将在第 4 章中讨论）。由于用户输入的值在脚本编写时是未知的，可以使用变量来存储由用户输入的值。这对于任何形式的用户输入都是如此，无论是以\
  \ JavaScript 提示/确认框的形式、表单中的输入字段，还是其他的输入方法。\n\n#### 变量作为节省时间的工具\n\n变量可以加快脚本编写，因为它们的值是可以改变的。当你赋值一个值时，由于它们的值可以改变，这加快了脚本编写。当脚本开始时为变量赋值值，而不是在多个处使用，可以节省时间。\n\
  \n### 为你的脚本定义变量\n\n现在你已经理解了变量是什么以及为什么想使用它们，你需要学习如何让它们在脚本中工作。你通过声明它们来创建变量。然后使用赋值运算符为它们赋值。当你命名变量时，需要遵循\
  \ JavaScript 的变量命名规则，并考虑命名的意义。\n\n#### 声明变量\n\n要将文本作为变量，你使用 `var` 关键字，它告诉浏览器跟随其后的文本将是变量名：\n\
  \n`var variablename;`\n\n例如，将你的变量命名为 `coolcar`，声明如下：\n\n`var coolcar;`\n\n在这个例子中，你有一个名为\
  \ `coolcar` 的变量。分号结束语句。变量 `coolcar` 还没有被赋值。\n\n\n\n\n\n正如下一节所描述，你可以在声明变量的同时给它们赋值，也可以在脚本的后后部分再给它们赋值。\n\
  \n## 给变量赋值\n\n为变量命名的代码非常简单，但对你可用于变量的单词以及字母的大小写有一些限制。要给变量赋值，你需要使用 JavaScript 的赋值运算符，即等号（`=`）符号。如果你想在同一行内声明变量并给它赋值，请使用这种格式：\n\
  \n```\nvar variablename = variablevalue;\n```\n\n例如，要将你的变量命名为 `paycheck` 并赋予其数值\
  \ `1200`，请使用以下语句：\n\n```\nvar paycheck = 1200;\n```\n\n该语句以关键字 `var` 开始，后面跟着变量 `paycheck`，这与上一节描述的普通变量声明相同。接下来是赋值运算符（`=`），它告诉浏览器将运算符右侧的值赋值给运算符左侧的变量。赋值运算符右侧是\
  \ `1200`，这是正在赋值给变量 `paycheck` 的数值。该行以分号结尾，表示该语句的结束。\n\n**注意**\n\n千万不要将赋值运算符（`=`）误认为“等等于”。该运算符仅用于赋值。表示“等等于”的运算符是两个等号（`==`），你将在第\
  \ 5 节中学习到。\n\n要声明并赋值另一个变量，你可以使用相同的格式。例如，设置一个名为 `spending` 的变量来跟踪你从 `paycheck` 变量中花费的金额，请使用这些语句：\n\
  \n![Images](img/f0037-03.jpg)\n\n当然，你也会注意到这种财务状况正趋向麻烦，因为 `spending` 变量中花费的钱多于 `paycheck`\
  \ 变量收入的钱。奇怪的是，这看起来很像我网站的预算！\n\n你之前使用单个 `var` 语句声明多个变量的方法也适用于声明并赋值多个变量。使用逗号来分隔每个变量赋值，如下代码所示：\n\
  \n![Images](img/f0038-01.jpg)\n\n再次记住，最后一个声明并赋了句的变量将以分号结尾，以完成 `var` 语句。\n\n赋值给变量的值也可以是计算结果，如下代码所示：\n\
  \n```\nvar net = 1500 - 1200;\n```\n\n在这种情况下，结果是 `300`，并将被赋值给变量 `net`。\n\n你看到的示例说明了变量声明和赋值的正确且安全的方法。然而，JavaScript\
  \ 在变量方面具有了一定的灵活性。在许多情况下，代码即使不使用精确的语法也可以运行。例如，你可能会看到某些脚本在第一次使用变量时没有使用 `var` 关键字。即使变量之前未被声明，JavaScript\
  \ 通常通常会在第一次使用它时自动声明它。这里显示了一个示例：\n\n```\npaycheck = 1200;\n```\n\n这可以运行，因为变量正在被赋值（JavaScript\
  \ 将简单地声明该变量并将其赋值为 `1200`）。然而，如果你尝试在不进行赋值的情况下声明变量，以下代码将是无效的：\n\n```\npaycheck;\n\
  ```\n\n这种声明仍然需要 `var` 关键字才能有效，如下代码所示：\n\n```\nvar paycheck;\n```\n\n你可能还会看到省略末尾分号的脚本：\n\
  \n```\nvar paycheck = 1200\n```\n\n在某些脚本中，变量赋值中的这两个特性都被省略了：\n\n```\npaycheck = 1200\n\
  ```\n\n所有这些快捷方法似乎都很方便，但最好的做法是在使用每个变量之前定义它，使用 `var` 关键字并包含分号。这样做可能会在某些浏览器中导致错误，并可能给人留下代码写得不好的印象。此外，如果你需要调试脚本，这些遗漏中的任何一个都可能非常麻烦。\n\
  \n例如，如果你在声明变量时漏掉了 `var`，变量将自动放置在全局作用域中，这在将来很容易导致问题。你将在第 4 节中看到更多关于作用域如何影响变量的值。\n\
  \n给变量正确的声明和赋值将避免问题，你的代码将更易于阅读和理解。\n\n## 变量命名\n\n在开始为自己的变量命名之前，你需要了解 JavaScript 的命名规则。选择名称时需要考虑的因素有大小写敏感、无效字符以及\
  \ JavaScript 预留的名称。此外，你应该尝试给变量起一个既容易记忆又有意义的名字。\n\n### 在变量中使用大小写\n\nJavaScript 变量对大小写敏感——`paycheck`、`PAYCHECK`、`Paycheck`\
  \ 和`PaYcHeCk` 是四个不同的变量。当你创建一个变量时，需要确保在稍后编写该变量名时使用相同的大小写。如果你更改了任何大小写，JavaScript 将其视为新变量或返回错误。无论哪种情况，都会导致你的脚本出现问题。\n\
  \n以下关于在变量名中使用大小写的几个建议：\n\n- 如果你使用的仅由一个单词组成的变量名，最简单的方法可能是整个名称都使用小写。\n- 对于两个单词的变量，你可能决定将每个单词的首字母大写。例如，你可以将变量命名为\
  \ `MyCar` 或 `My_Car`（你将在下一节看到更多关于下划线的内容）。你也可以使用“驼峰命名法”，即第一个单词小写，后续单词大写。例如，你可以将变量命名为\
  \ `myCar` 或 `myCoolCar`。\n\n变量的大小写完全取决于你，所以你应该使用自己感到舒适的风格。如果你使用小写字母命名，最好在整个脚本中保持一致，以避免意外切换。\n\
  \n### 使用允许的字符\n\n需要记住的一个规则是，变量名必须以字母、下划线（`_`）或美元符号（`$`）开头。变量名不能以数字或任何非字母字符（下划线和美元符号之外）开头。变量名的其他字符可以是字母、数字、下划线和美元符号。变量名中不允许空格。因此，以下变量名是有效的：\n\
  \n- `paycheck`\n- `_paycheck`\n- `pay2check`\n- `pay_check`\n- `$pay_245`\n\n然而，以下变量名是无效：\n\
  \n- `#paycheck`\n- `1paycheck`\n- `pay check`\n- `pay_check 2`\n- `_pay check`\n\
  \n最难记住的规则可能是不能以数字开头（这是我经常忘记的）。虽然这种名称看起来有效，但 JavaScript 不允许。\n\n### 避免关键字和预留字\n\n\
  命名时另一个需要记住的规则是避免使用 JavaScript 关键字和预留字。关键字是 JavaScript 中用于特定用途的特殊单词。例如，你已经学习过预留字\
  \ `var` 用于声明 JavaScript 变量。作为变量名会导致你的脚本出现许多问题，因为这个词本该以不同的方式使用。预留字是预留给以后作为关键字使用的特殊单词，因此也不应将其用变量名，以防止你的代码在未来出现潜在问题。\n\
  \n\n\n\n\n表 3-1 列出了 JavaScript 中的关键字和保留字。注意，所有这些单词都是小写字母。在后面的章节中，你将使用其中许多关键字，因此随着时间的推移，你会对它们越来越熟悉。\n\
  \n![Images](img/f0041-01.jpg)\n\n**表 3-1** JavaScript 关键字和保留字\n\n## 给变量赋予意义的名字\n\
  \n尽管 `x` 是可以接受的变量名，但如果你以后需要调试程序，你可能无法记得它代表什么。此外，如果其他人试图帮助你调试代码，他们的工作将变得更加困难。\n\n\
  你应该尝试给变量起一个尽可能清晰地描述它们所代表内容的名称。假设你想用一个变量来存储页面上某个示例的数量。与其使用 `x`、`ex` 或其他短变量，不如使用具描述性的名称：\n\
  \n```javascript\nvar examplenumber = 2;\n```\n\n变量 `examplenumber` 以后会变得容易识别，其他编码人员也更有可能快速理解它的用途。\n\
  \n脚本中使用的变量越多，使用有意义且易于记忆的名字就变得越重要。\n\n## 理解数据类型\n\n到目前为止，你已经看到了数字类型的变量示例。在 JavaScript\
  \ 中，变量值可以是几种数据类型之一，包括数字、字符串、布尔、null、undefined、symbol 和对象。\n\n与更严格的编程语言不同， JavaScript\
  \ 并不强制你在定义变量时声明其类型。相反，JavaScript 允许将任何值赋值给任何变量。它还允许你在更改值时更改数据类型。虽然这在编码时提供了灵活性，但你需要小心，因为可能会导致意外的结果——特别是当相加数字时（关于此主题的更多信息请参见第\
  \ 5 章）。\n\n### 数字\n\n数字就是数字。JavaScript 不需要将数字声明为整数、浮点数（小数）或其他任何数字类型。相反，任何数字都被视为另一个数字，无论它是\
  \ 7、–2、3.453 还是其他任何。除非你执行计算来更改类型，否则数字将保持相同类型。例如，如果你在变量中使用整数，除非你进行某种计算来改变它（例如不均匀除法），否则它不会突然出现小数。\n\
  \n正如你所看到的，你通过使用关键字 `var` 来定义数字变量：\n\n```javascript\nvar variablename = number;\n\
  ```\n\n这里是一些示例：\n\n![Images](img/f0042-01.jpg)\n\n如果你需要使用特别长的数字，JavaScript 具有指数计数法。要表示指数，在基数数字之后、指数之前使用字母\
  \ `e`。例如，要创建一个名为 `bignumber` 的变量并赋值赋值为 4.52 × 10⁵ (452,000)，在数字和指数之间的所有内容替换为字母 `e`（表示“乘以\
  \ 10 的次方”这一短语）：\n\n```javascript\nvar bignumber = 4.52e5;\n```\n\n**注意**\nJavaScript\
  \ 可能会使用指数计数法返回计算结果（就像许多计算器一样）。\n\n### 字符串\n\n字符串值包含一段文本。该字符串可以包含字母、单词、空格、数字、符号或你喜欢的任何内容。字符串的定义与数字略有不同，使用以下格式：\n\
  \n```javascript\nvar variablename = \"stringtext\";\n```\n\n这里是字符串变量的示例：\n\n![Images](img/f0042-03.jpg)\n\
  \n正如你所看到的，字符串可以是短的、长的或中间的任何长度。你可以在字符串变量中放置各种文本和其他字符。然而，需要考虑引号、某些特殊字符以及字符串的大小写敏感。\n\
  \n### 匹配引号\n\n在 JavaScript 中，你通过将它们放在引号（简称为 quotes）内部来定义字符串，正如你在示例中看到的那样。JavaScript\
  \ 允许你使用双引号或单引号来定义字符串值。问题在于，如果字符串用双引号开启，则必须用双引号关闭：\n\n```javascript\nvar mycar =\
  \ \"Red Corvette\";\n```\n\n单引号也是如此：\n\n```javascript\nvar myhouse = 'small brick\
  \ house';\n```\n\n尝试用不匹配类型的引号来关闭字符串，或者漏掉起始或结束引号都会导致问题。\n\n![Images](img/f0043-01.jpg)\n\
  \n这些错误会导致 Web 浏览器中出现“Unterminated String”（未终止的字符串）错误。\n\n**注意**\n如果你使用双引号包裹字符串，则可以在字符串内部使用单引号，反之亦然。\n\
  \n### 注意大小写\n\nJavaScript 字符串对大小写敏感。这现在看起来可能并不重要，但当你需要比较字符串以进行匹配时，它就很重要。仅仅一个大小写不同的字符就会字符串不同：\n\
  \n```javascript\n\"My car is fun to drive!\"\n\"my car is fun to drive!\"\n```\n\
  \n你将在第 7 章 中学习更多关于字符串比较的内容。\n\n### 使用特殊字符\n\n特殊字符允许你向字符串添加其他无法添加的内容。例如，假设需要在字符串的每个单词之间添加一个制表符。如果你按下键盘上的\
  \ TAB 键，JavaScript 可能会将其视为一堆空格。相反，请使用特殊字符 `\\t`，它会在此处放置制表符，如示例所示：\n\n```javascript\n\
  var mypets=\"dog\\tcat\\tbird\";\n```\n\n`\\t` 特殊字符是一个制表符。特殊字符都以反斜杠开头（）。因此，如果你想在页面上显示反斜杠，你需要使用\
  \ `\\\\`。例如，假设你想在网页上写句子：“Go to the directory c:\\”。如果你直接使用反斜杠，代码看起来如下：\n\n![Images](img/f0043-04.jpg)\n\
  \n问题是，反斜杠不会在浏览器中打印：\n\n```javascript\nGo to the directory c:\\\n```\n\n除非反斜杠后面跟着特殊字符，否则\
  \ JavaScript 会打印它。要修复这个问题，使用 `\\\\` 特殊代码来打印单个反斜杠：\n\n![Images](img/f0044-02.jpg)\n\
  \n现在你得到了想要的打印结果：\n\n```javascript\nGo to the directory c:\\\n```\n\nJavaScript 中使用的特殊字符见表\
  \ 3-2。\n\n![Images](img/f0044-05.jpg)\n\n**表 3-2** 特殊字符\n\n假设你想在网页上打印一个带有强调的句子。JavaScript\
  \ 允许通过 `document.write()` 方法作为字符串的一部分将 HTML 代码打印到页面上。为了做到，你可以添加 HTML 的 `<strong>`\
  \ 标签，如示例代码所示：\n\n![Images](img/f0044-04.jpg)\n\n```javascript\n<strong>JavaScript\
  \ Rules!</strong>\n```\n\n现在假设让代码本身在查看（通过浏览器的“查看源代码”）时显示两行，如下：\n\n```html\n<strong>JavaScript\
  \ Rules!</strong>\nThis is fun.\n```\n\n你可以通过在代码中添加换行特殊字符 `\\n` 来实现：\n\n![Images](img/f0045-02.jpg)\n\
  \n`\\n` 特殊代码在 JavaScript 中只是换行；它不会产生 HTML 换行。JavaScript 换行代码不会在浏览器显示的结果中添加新行。因此，上述代码的最终结果如下：\n\
  \n**`JavaScript Rules!`** `This is fun.`\n\n如果你想在浏览器显示中添加换行，你需要使用 HTML `<br>` 标签来产生它。\n\
  \n记住，JavaScript 换行只影响源代码外观；它不是最终结果的因素。然而，当你想要格式化 JavaScript 警告框和其他各种 JavaScript\
  \ 构造的输出时，它非常有帮助。\n\n\n\n\n\n### 转义字符\n\nJavaScript 允许你 `escape` 某些字符，以便它们能够正确显示并避免引起错误。与特殊字符一样，转义序列使用反斜杠字符（`\\\
  `），它紧跟在需要转义的字符之前。\n\n正如前面提到的，JavaScript 在渲染每个字符串之前会检查字符串中是否存在特殊字符。如果你想在字符串内部包含一个引号，这就非常有用了。例如，假设你想在网页上打印以下句子：\n\
  \n`John said, \"JavaScript is easy.\"`\n\n如果你直接把这一整句丢进 `document.write()` 命令中会发生什么？\n\
  \n![Images](img/f0045-04.jpg)\n\n如果你查看 `document.write()` 那行的末尾，你会发现两个双引号放在一起可能会引起麻烦，但浏览器在那之前实际上就已经“生气”了。当双引号出现在单词\
  \ `JavaScript` 之前时，浏览器会认为你已经关闭了 `document.write()` 命令中的字符串，并期望看到结束的括号和分号。然而，后面还有文本，导致浏览器感到困困惑。\n\
  \n为了避免引号引起的问题，请使用反斜杠字符转义字符串内部的引号。通过在每个内部双引号前面放置一个反斜杠，你可以强制让它们被视为文本字符串的一部分，而不是 JavaScript\
  \ 语句的一部分：\n\n![Images](img/f0046-01.jpg)\n\n这解决了字符串的问题，句子将带有引号打印出来。\n\n**注意**\n\n\
  还要留意字符串内部的单引号和撇点。对于包含在单引号内的字符串，必须对这些字符进行转义。\n\n转义技术也适用于需要引号的 HTML 代码。例如，如果你想在页面上放置一个链接，你会使用锚点标签并将\
  \ URL 放在引号中。如果你转义了锚点标签中的引号，JavaScript 就会允许你在 `document.write()` 方法中向页面写入 HTML 代码，如下例所示：\n\
  \n![Images](img/f0046-02.jpg)\n\n这样做可以实现，但如果你不想一直转义引号，还有更简单的方法可以实现这一效果。\n\n为了避免转义上述代码中的引号，你可以改用单引号来包裹\
  \ URL 地址，如下代码所示：\n\n![Images](img/f0046-03.jpg)\n\n如果你倾向于在外部使用单引号，也可以反过来操作，如下例所示：\n\
  \n![Images](img/f0046-04.jpg)\n\n这里需要记住的关键点是：确保你在字符串内部使用的引号类型与包裹字符串的引号类型不同。如果你需要嵌套超过一层引号，你就必须开始转义引号；这是因为如果再次切换，它将终止字符串。例如，看这段代码：\n\
  \n![Images](img/f0046-05.jpg)\n\n第一个是可以行的，因为引号经过了转义以保持字符串的延续。然而，第二行仅在字符串内部的单引号内时才切换回双引号。在那个位置放置双引号而不进行转义会导致字符串终止并产生错误。\n\
  \n如你所见，当你需要在一个字符串中使用大量引号时，引号可能会是一件非常头疼的事。然而，记住在需要时使用反斜杠转义引号，可以在你寻找缺失的引号时省去很多麻烦。我曾多次不得不在代码中寻找缺失的引号，在经历过几次这种情况后，我的头都快晕了！在本章稍后的部分，你将看到你可以拼接字符串，这可以简化对引号的使用。\n\
  \n### 布尔值 (Boolean)\n\n`Boolean` 的值为 `true` 或 `false`。以下是示例：\n\n```javascript\n\
  var johncodes = true;\nvar johniscool = false;\n```\n\n注意，`true` 和 `false` 单词不应该包含在引号中。这是因为它们是\
  \ JavaScript 识别的字面量。\n\n当你需要只能取 `true` 或 `false` 值的变量时，布尔变量非常有用，例如在事件处理程序中（将在第 7\
  \ 章] 中介绍）。\n\n**注意**\n\n当我们讨论布尔变量的概念时，Boolean 单词的首字母是大大写的（因为它源自数学家乔治·布尔的名字）。但当你在脚本中使用关键字时，JavaScript\
  \ 的保留字 `boolean` 是全部小小写的。\n\n### 空值 (Null)\n\n`Null` 用于表示一个空对象（你将在第 9 章] 中学习对象）。如果你需要定义一个值为\
  \ `null` 的对象，请使用如下声明：\n\n```javascript\nvar variablename = null;\n```\n\n与布尔变量一样，你不应该像处理字符串值那样将此值包含在引号中，因为\
  \ JavaScript 识别 `null` 的特殊值。`null` 数据类型只能有一个值：`null`。\n\n### 未定义 (Undefined)\n\n\
  `undefined` 数据类型与 `null` 类似，因为它只有一个可能的值：`undefined`。当变量没有被赋值初始值，或者使用之前未声明的变量时，就会出现此值。例如，以下两个示例使用了未定义的变量（你将在本章后面看到更多关于如何使用变量的内容）：\n\
  \n![Images](img/f0047-02.jpg)\n\n### 符号 (Symbol)\n\n符号是一个唯一且不可更改的值，可以作为对象的属性。你将在第\
  \ 10 章 中学习更多关于对象的知识。\n\n### 对象 (Object)\n\n对象是属性的集合。对象是 JavaScript 的核心部分，将在第 10\
  \ 章 中详细讨论。注意函数和也是也是。\n\n### 专家问答 (Ask the Expert)\n\n问：我为什么需要学习变量？难道不能直接在需要使用的地方放入数字或文本吗？\n\
  答：你可以这样做，但这会让长脚本变得更难编写、阅读和调试。它也让更新脚本变得更加困难，因为为了更改那个数字或文本，你需要修改它出现的每一行。\n\n问：为什么我在声明数字变量时不需要定义我正在使用的数字类型（例如浮点数或整数）？\n\
  答：JavaScript 不要求这一点，这取决于你的观点，可能是可能是可能是缺点。对于 JavaScript 来说，任何数字都是数字，都可以作为数字变量使用。\n\
  \n问：为什么我需要给字符串中的文本加上引号？\n答：这样做是为了让 JavaScript 知道字符串从哪里开始，哪里结束。如果没有引号，JavaScript\
  \ 将不知道哪些是字符串，哪些不是。\n\n问：但分号不是结束语句的吗？为什么不用它并放弃引号呢？\n答：当使用加运算符拼接两个字符串和变量时，变量声明或任何涉及字符串的命令可能会变得复杂。在这种情况下，JavaScript\
  \ 需要知道字符串何时停止，另一个何时开始。\n\n### 尝试 3-1 声明变量\n\n`pr3_1.html`\n\n此项目提供了练习声明各种值变量的机会。它还会在页面上打印出一行短文本。\n\
  \n#### 步骤说明\n\n\n\n\n\n1. 创建一个 HTML 页面，在 `<body>` 和 `</body>` 标签之间留空。\n\n2. 在 `<body>`\
  \ 和 `</body>` 标签之间，按照第 2 章中学习的方法添加 `<script>` 和 `</script>` 标签。\n\n3. 创建一个名为 `chipscost`\
  \ 的数值变量，并将其赋值为 `2.59`。\n\n4. 创建一个名为 `istrue` 的布尔值变量，并将其赋值为 `false`。\n\n5. 创建一个名为\
  \ `nada` 的变量，并将其赋值为 `null`。\n\n6. 创建一个 JavaScript 语句，向 Web 页面写入以下字符串值。记住在必要时对引号进行转义：\n\
  \nJohn said, “This project is fun!”\n\n7. 完成后，HTML 文档的 body 部分应该像这样所示：\n\n![Images](img/f0049-01.jpg)\n\
  \n8. 将文件保存为 `pr3_1.html` 并在 Web 浏览器中查看它。\n\n你应该只会看到通过 `document.write()` 命令输出的文本。变量定义不会打印在浏览器屏幕上。你可以查看页面源代码，查看变量定义在代码中的具体形式。\n\
  \n### 尝试此总结\n\n在这个项目中，你能够运用所学技能在脚本中声明不同类型的变量。该项目包含了一个数值变量、一个布尔值变量以及一个值为 `null` 的变量。你还能够使用在第\
  \ 2 章中学习的技能，使用 JavaScript 向页面写入了一行文本。\n\n### 在脚本中使用变量\n\n要让变量有用，你不能仅仅在脚本中声明它。你需要在稍后的脚本中以某种方式使用它，可能是为了打印它的值，甚至仅仅是改变它的值。要使用变量，你需要在变量声明后对其进行调用。\n\
  \n#### 调用变量\n\n以下代码显示了如何使用 `document.write()` 方法将变量的值写入 Web 页面：\n\n![Images](img/f0050-01.jpg)\n\
  \n脚本首先声明了一个变量 `mycar` 并给其赋值为“Corvette”。然后，在 `document.write()` 命令中，你看到只有变量名 `mycar`\
  \ 被包裹在括号内。该脚本的结果仅仅是向浏览器写入“Corvette”。\n\n在写入页面的 `mycar` 变量周围没有引号。这是因为 `mycar` 变量已经赋予了一个字符串值，因此在\
  \ `document.write()` 命令中将其值打印到页面时不需要引号。你已经可以看到，使用变量的优势在于让简短的 `document.write()`\
  \ 命令编写起来更加简单。\n\n#### 在文本字符串中添加变量\n\n之前的代码只是在浏览器中打印变量的值。如果你想让变量与字符串中的其他文本一起打印，那么\
  \ `document.write()` 命令就会变得复杂。如果文本字符串没有被定义为变量，则需要对其加上引号，而变量需要独立存在。你使用加法运算符（`+`）将变量的值加到字符串上，如例所示：\n\
