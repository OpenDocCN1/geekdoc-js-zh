  \ 运算符用于确定当前上下文的值。\n\n---\n\n## 5. 运算符\n\n## 第 5 章运算符\n\n### 关键技能\n\n在这个项目中，你利用对函数和上下文的知识创建了一个脚本。该脚本的结果是\
  \ HTML 页面显示了信息，同时保护变量值免受全局上下文中可能发生任何更改的影响。\n\n## 理解运算符\n\n运算符是用于对值执行操作的符号。在本章中，你将学习\
  \ JavaScript 中不同的运算符。\n\n### 理解类型\n\nJavaScript 使用多种类型的运算符：\n\n*   **算术运算符**：用于数学计算。\n\
  *   **赋值运算符**：用于为变量赋值。\n*   **比较运算符**：用于比较值、变量或语句。\n*   **逻辑运算符**：用于评估条件语句。\n* \
  \  **位运算符**：按位操作。\n*   **特殊运算符**：执行特殊函数的运算符。\n\n## 算术运算符\n\n对于数学计算，你使用算术运算符。你使用的值可以是任何类型的值。例如，你可以使用两个变量、两个数字，或者一个变量和一个数字。其中一些运算符能够对单个值执行任务。\n\
  \n\n\n\n这些示例说明了你如何使用许多算术运算符处理多个值和/或变量。这使得你在编写脚本时具有一定的灵活性。\n\n作用于单值的运算符是递增、递减、一元加和一元取反运算符。递增和递减运算符实际上是加\
  \ 1 或减 1 的快捷方式，因此学习如何使用它们可以节省你编写代码的时间。\n\n算术运算符及其功能总结在表 5-1 中。接下来的章节将详细讨论每个运算符。\n\
  \n![Images](img/f0098-01.jpg)\n\n**表 5-1** 算术运算符\n\n# 加法运算符 (+)\n\n正如你所看到的，加法运算符可以组合两个字符串。它还用于在数学计算中相加数字。\n\
  \n## 用于结果的变量\n\n加法运算符的一个用途是将两个数字相加得到数学结果。在相加数值时，你通常会将结果赋值给变量，并在以后使用该变量的值。例如，计算 4\
  \ 加 7 的值并显示结果，你可以这样编写：\n\n![Images](img/f0098-02.jpg)\n\n结果是一个显示 11 的警框。\n\n为了让示例变得复杂一点，你可以将其中一个数字改为变量：\n\
  \n![Images](img/f0098-03.jpg)\n\n结果与上一个示例的代码相同：一个显示 11 的警框。\n\n将示例更进一步，你可以让两个数字都成为变量：\n\
  \n![Images](img/f0098-04.jpg)\n\n这个示例提供了最大的灵活性，因为你可以更改两个数字变量的值并获得新结果，而无需深入脚本内部进行更改。\n\
  \n## 操作数\n\n与运算符一起使用的每个值都称为 `operand`（操作数）。JavaScript 中的大多数运算符同时处理两个操作数。例如，以下代码包含两个操作数：7\
  \ 和 4。\n\n```\nlet thesum = 7 + 4;\n```\n\n运算符两侧的值都是操作数。在使用其他数据类型或使用变量时，情况也是如此：\n\
  \n![Images](img/f0099-01.jpg)\n\n当在语句中多次使用接受两个操作数的运算符时，JavaScript 将使用运算符顺序（将在本章的“理解运算符顺序”部分中解释），并一次使用一个运算符和两个操作数执行任务。在加法运算符的情况下，如果没有其他运算符或括号，则运算符顺序将从左到右进行。考虑以下代码：\n\
  \n```\nlet thesum = 2 + 3 + 1;\n```\n\n首先，表达式的 `2 + 3` 部分将被计算以得到结果 5。然后，该结果被用作第一个操作数来完成计算\
  \ `5 + 1`，这将给出最终结果 6。\n\n某些运算符（称为一元运算符）只使用一个操作数。运算符直接放置在孤立的操作数之前或。例如，看看这段代码：\n\n\
  ![Images](img/f0099-02.jpg)\n\n在这种情况下，使用了递增运算符，唯一的操作数是 `mymoney` 变量。随着本章的进行，你将了解到更多关于递增运算符和其他剩余一元运算符的知识。\n\
  \n## 计算中的类型转换\n\n需要注意的是，在处理算术运算符时，JavaScript 会执行 `type coercion`（类型转换，即如果认为有必要则尝试更改值的数据类型）。当你使用加法和其他算术运算符时，你需要意识到\
  \ JavaScript 会自动将不同的值（例如整数（非小数数值值）和浮点数（小数数值值））转换为适当的类型。例如，你可能有以下代码：\n\n![Images](img/f0099-03.jpg)\n\
  \n运行脚本时，你将看到一个带有结果的警框。\n\n![Images](img/I05-01.jpg)\n\nJavaScript 将整数和浮点数相加并返回了一个浮点数：11.73。JavaScript\
  \ 自动执行此操作，因此你需要确保你使用的值将产生你预期的结果。\n\n例如，如果你将一个数字和一个字符串相加，结果就像组合了两个字符串。看这个示例：\n\n\
  ![Images](img/f0100-02.jpg)\n\n这看起来像是在相加数字 4 和 7，因为它们看起来都是数字。问题是，在这种情况下 7 是一个字符串而不是数字，因为它周围有引号。这导致\
  \ 4 被转换为字符串，然后将两个字符串相加（拼接）。在警框中显示的的结果可能会让你感到惊讶。\n\n![Images](img/I05-02.jpg)\n\n\
  你得到的不是预期的答案 11，而是 47。当两个值作为字符串相加时，它们连接在一起而不是在数学上相加。对于字符串来说，“4”+“7”=47。\n\n其他算术运算符也会进行转换，类似于加法运算符，所以如果你在脚本中获得意想不到的结果，请注意这种可能性。\n\
  \n## 特殊规则\n\n加法运算符在尝试执行计算或拼接时使用一些特殊规则。以下是最常遇到的一些情况：\n\n- 如果一个操作数为特殊值 `NaN`（不是数字），则结果为\
  \ `NaN`。\n- 如果一个操作数是字符串，另一个将转换为字符串。\n- 如果两个操作数都是字符串，它们将被拼接。\n- 如果一个操作数是 `NaN`，则结果为\
  \ `NaN`。\n- 如果一个操作数是字符串，另一个将被转换为。\n\n# 减法运算符 (–)\n\n减法运算符用于从左侧的值减去右侧的值，就像数学中一样。这是一个示例：\n\
  \n![Images](img/f101-01.jpg)\n\n这段代码简单地从 10（左侧的数字）减去 3（右侧的数字）。结果是 7。\n\n## 特殊规则\n\
  \n与加法运算符一样，还有一些特殊规则：\n\n- 如果一个操作数为 `NaN`，则结果为 `NaN`。\n- 如果一个操作数是数字以外的数据类型（例如字符串、布尔等），JavaScript\
  \ 尝试将该值转换为数字并执行减法。如果无法转换该值，结果将为 `NaN`。\n\n# 乘法运算符 (*)\n\n乘法运算符用于两个操作数。下一个示例显示了该运算符的操作：\n\
  \n![Images](img/f0101-02.jpg)\n\n## 特殊规则\n\n- 如果一个操作数为 `NaN`，则结果为 `NaN`。\n- 如果一个操作数是数字以外的数据类型，它尝试转换该值并执行乘法。如果无法转换该值，结果将为\
  \ `NaN`。\n\n# 除法运算符 (/)\n\n除法运算符用于用左侧的值除以右侧的值。例如，`4 / 2` 表示 4 除以 2 并得到结果 2。关于此操作的\
  \ JavaScript 示例，看看这段代码：\n\n![Images](img/f0102-01.jpg)\n\n结果是 5，将 10 除以 2。\n\n##\
  \ 特殊规则\n\n\n\n\n- 如果其中一个操作数是 `NaN`，结果将为 `NaN`。\n- 如果数字 0 除以数字 0，结果将为 `NaN`。\n- 如果任何其他有限数字除以数字\
  \ 0，结果将为特殊值 `Infinity`。\n- 如果其中一个操作数的类型类型不是 `number`，它将尝试对该值进行强制转换并执行除法。如果无法转换该值，结果将为\
  \ `NaN`。\n\n## 除以 0\n\n当你使用除法运算符时，需要小心不要以某种方式导致除以 0。如果你这样做了，结果将是 `Infinity`。接下来的代码展示了这种情况的一个示例（尽管不太可能完全按照这种方式发生）：\n\
  \n![Images](img/f0102-02.jpg)\n\n如果你将这段代码放在文档中，可能会看到类似这样的警报框：\n\n![Images](img/I05-03.jpg)\n\
  \n为了避免除以 0，请注意放在除法运算符右侧的数字或变量。\n\n## 取模运算符 (%)\n\n取模运算符用于将左侧的数字除以右侧的数字，然后给出一个该除法的整数余数结果。回想你学习长除法时，使用余数作为答案的一部分，而不是转换为小数或分数。11\
  \ 除以 2 得到 5，余数是 1。当你写下 `11 % 2` 时，取模运算符给的就是余数 1。\n\n以下是 JavaScript 中的示例：\n\n![Images](img/f0103-01.jpg)\n\
  \n结果是一个显示余数值的警报框，数值为 1。如果计算没有余数，结果将为 0。\n\n这是最后一个同时对两个值作用的算术运算符。接下来是一元运算符，它们一次只作用于一个值。\n\
  \n## 递增运算符 (++)\n\n递增运算符是单元的，它将其唯一操作数的值加 1。使用它的效果取决于运算符放在操作数之前还是之后。\n\n### 操作数之前的递增运算符\n\
  \n当递增运算符放在操作数之前时，它会将操作数的值加 1，然后执行语句的其余部分。这是一个示例：\n\n![Images](img/f0103-02.jpg)\n\
  \n在这种情况下，变量 `num1` 的初始值为 2。然而，当代码将值赋值给变量 `theresult` 时，它在赋值发生之前先增加了 `num1` 的值。递增首先发生是因为递增运算符在操作数前面。因此，`num1`\
  \ 的值设置为 3 (2+1)，然后赋值给变量 `theresult`，该变量获得了值 3。\n\n### 操作数之后的递增运算符\n\n如果你将递增运算符放在操作数之后，它会在赋值后改变操作数的值。考虑这个示例：\n\
  \n![Images](img/f0103-03.jpg)\n\n与上一个示例一样，`num1` 值为 2。在下一行，递增运算符用操作数之后。这意味着代码将 `num1`\
  \ 的当前值赋值给变量 `theresult`，在完成操作*之后*，它才增加 `num1` 的值。因此，只有在这次赋值完成后，你才得到了 `num1` 的新值。变量\
  \ `theresult` 被赋值为 2，然后 `num1` 变为 3。如果你之后之后使用 `num1`，它的值将是 3。\n\n另一种查看递增运算符在操作数之前和之后如何工作的方法是在浏览器中运行以下脚本。注意第一个警报框中的值和第二个警报框中的值。\n\
  \n![Images](img/f0104-01.jpg)\n\n在第一个警报框中，你将看到 `num1= 3 result= 3`。由于这里 `++` 运算符用操作数之前，`num1`\
  \ 的值增加了 1，然后赋值给 result 变量。在第二个警报框中，你将看到 `num1= 3 result= 2`。这是因为 `++` 运算符用操作数之后，所以\
  \ `num1` 的值在赋值给 result 变量之后增加。result 变量获得了值 2，但 `num1` 将增加到 3。\n\n同样注意，你不需要执行赋值就可以使用此运算符。你只需输入\
  \ `num1++;` 或 `++num1;`，`num1` 的值就会相应改变以供以后使用。\n\n## 递减运算符 (--)\n\n递减运算符的工作与递增运算符相同，但它从操作数中减\
  \ 1 而不是加 1。与递增运算符一样，它放在操作数之前还是之后非常重要。\n\n如果你将递减运算符放在操作数之前，操作数会递减，然后执行语句的其余部分。这是一个示例：\n\
  \n![Images](img/f0104-02.jpg)\n\n这里，变量 `num1` 被赋值为 2。在下一行，代码从 `num1` 中减去 1，然后将结果赋值给变量\
  \ `theresult`。因此，变量 `theresult` 的最终值为 1 (2–1)。\n\n当你将运算符放在操作数之后时，如下一个示例所示，语句执行后操作数才被递减：\n\
  \n![Images](img/f0104-03.jpg)变量 `theresult` 被赋值为 2，然后 `num1` 变为 3。如果你之后之后使用 `num1`，它的值将是\
  \ 3。\n\n## 一元加运算符 (+)\n\n一元加运算符用于尝试将一个值转换为数字。如果无法转换该值，结果将为 `NaN`。这是一个在遇到前面提到的这种情况时非常实用的运算符：\n\
  \n![Images](img/f105-01.jpg)\n\n正如你所记得的，它将字符串“7”转换为数字值。\n\n![Images](img/f105-02.jpg)\n\
  \n注意语句中 `+num` 部分的括号。正如数学一样，你可以使用括号来设置操作顺序或仅仅为了视觉上的清晰。\n\n```\nlet thesum = num1\
  \ + +num2;\n```\n\n这看起来并不美观，但它仍然有效。更新后的代码将返回 11 而不是“47”，因为字符串“7”能够被转换为 7。\n\n##\
  \ 一元否定运算符 (--)\n\n一元否定是在单个操作数上使用减号。该运算符创建一个负数，或者反转数字当前的符号（正或负）。\n\n这里是给数字赋值负值的示例：\n\
  \n```\nlet negnum = -3;\n```\n\n这定义了一个值为负 3 的变量。基本上，该运算符告诉浏览器 3 是“不是正的”，因为它通过在数字前面放置否定运算符反转了默认的正符号。\n\
  \n\n\n\n幂运算符允许你为数字定义指数，这意味着结果将是第一个操作数（左侧）的第二个操作数（右侧）的幂次方值。例如，要计算 2 的平方，即 2²，你会使用以下代码：\n\
  \n```\nvar square = 2 ** 2;\n```\n\n在这种情况下，`square` 的值将是 `2 * 2`，即 4。如果你想得到立方，可以执行以下操作：\n\
  \n```javascript\nvar cube = 2 ** 3;\n```\n\n这一次，值将是 `2 * 2 * 2`，即 8。你可以对任何数字需要的数字幂次方执行此操作。\n\
  \n### 理解赋值运算符\n\n赋值运算符将值赋给变量。它们不比较两个项目，也不执行逻辑测试。\n\n当你在第 3 章中学习变量时，你已经见过如何使用基础赋值运算符——单等号（`=`）来给变量赋一个初始值或新值。\n\
  \n其他赋值运算符也会给变量赋新值，但它们执行的方式略有不同，因为它们还执行了简单的计算。表 5-2 总结了赋值运算符，将在后续节中进行更详细的讨论。\n\n\
  ![Images](img/f0107-01.jpg)\n\n**表 5-2** 赋值运算符\n\n#### 赋值运算符 (=)\n\n自第 3 章以来，你一直在使用直接赋值运算符。它将运算符右侧的值赋给左侧的变量，如下例所示：\n\
  \n```javascript\nlet population = 4500;\n```\n\n这将值 4500 赋给变量 `population`。\n\n\
  #### 加并赋值运算符 (+=)\n\n`+=` 运算符将运算符右侧的值加到运算符左侧的变量上，然后将该新值赋给变量。从本质上说，它是此处所示代码类型的简写：\n\
  \n```javascript\nlet mymoney = 1000;\nmymoney = mymoney + 1;\n```\n\n在这里，创建了变量 `mymoney`\
  \ 并赋值为 1000。然后代码通过赋一个自身值加 1 的值来更改值。赋给 `mymoney` 变量的值是 1001。\n\n与其多写一遍变量名，你可以使用加并赋值运算符来简化代码。以下代码与上一个示例的结果相同，但节省了输入量：\n\
  \n```javascript\nlet mymoney = 1000;\nmymoney += 1;\n```\n\n使用加并赋值运算符，这段代码将 1（右侧的值）加到\
  \ `mymoney`（左侧的变量），将 1001 的新值赋给变量 `mymoney`。\n\n该运算符可以用于加任何值，而不只是 1。例如，你可以在赋值时加\
  \ 5，如下例所示：\n\n```javascript\nlet mymoney = 1000;\nmymoney += 5;\n```\n\n这一次，`mymoney`\
  \ 的最终值为 1005。\n\n你甚至可以在右侧使用变量而不是普通的数字值，如下例所示：\n\n```javascript\nlet mymoney = 1000;\n\
  let bonus = 300;\nmymoney += bonus;\n```\n\n在这里，`bonus` 的值为 300，它被加到变量 `mymoney`\
  \ 上，然后 `mymoney` 被赋为结果 1300。通过这种方式，可以更改 `bonus` 变量的值来影响赋值的结果。\n\n此赋值运算符像加法算术运算符一样，允许你拼接字符串。因此，你可以使用此运算符在字符串值的末尾添加：\n\
  \n```javascript\nlet myname = \"Bob\";\nmyname += \"by\";\n```\n\n这将字符串“by”添加到字符串“Bob”的末尾，产生字符串“Bobby”。\n\
  \n#### 减并赋值运算符 (-=\")\n\n`-=` 运算符的作用与 `+=` 运算符类似，不同在于运算符右侧的值从左侧的变量中减去。然后将该值赋给变量。这里是该运算符的运行示例：\n\
  \n```javascript\nlet mymoney = 1000;\nlet bills = 800;\nmymoney -= bills;\n```\n\
  \n此示例从 `mymoney` 变量中减去 `bills` 变量的值（800），并将结果赋给 `mymoney`。最终，`mymoney` 的值为 200。\n\
  \n#### 乘并赋值运算符 (*=)\n\n`*=` 运算符将运算符右侧的值乘以左侧的变量。然后将结果赋给变量。下一个示例展示了该运算符的用法：\n\n```javascript\n\
  let mymoney = 1000;\nlet multby = 2;\nmymoney *= multby;\n```\n\n在这里，变量 `mymoney`\
  \ 乘以变量 `multby` 的值（即 2）。然后将结果 2000 赋给变量 `mymoney`。\n\n#### 除并赋值运算符 (/=)\n\n`/=`\
  \ 运算符将运算符左侧的变量除以运算符右侧的值。然后将该值赋给变量。\n\n```javascript\nlet mymoney = 1000;\nlet bills\
  \ = 800;\nmymoney -= bills; // 注意：此处原文似乎误误\n```\n\n\n\n在这个项目中，你能够利用对算术运算符和赋值运算符的知识，在\
  \ Web 页面上显示几项计算结果。这个项目可以通过多种方式完成，具体取决于你对各种运算符用法的偏好。\n\n## 理解比较运算符\n\n比较运算符通常与条件语句和循环一起使用，以便在满足特定条件时执行操作。由于这些运算符比较两个值，因此它们会返回\
  \ `true` 或 `false` 值，具体取决于运算符两侧的值。在随后的章节中，你将学习如何创建一个代码块，仅在比较返回 `true` 时执行该代码块。\n\
  \n表 5-3 总结了比较运算符，后续章节将对其进行更详细的。\n\n![Images](img/f0111-01.jpg)\n\n**表 5-3** 比较运算符\n\
  \n### 等于运算符 (==)\n\n要使 `==` 运算符返回 `true`，每一侧的值或语句必须相等。如果值不相等，`==` 运算符将返回 `false`。但请注意，在使用此运算符时，仍然会发生类型转换，因此诸如\
  \ `\"4\"==4` 这样的语句将返回 `true`，因为 JavaScript 会将字符串 `\"4\"` 转换为数字。如果你希望此语句返回 `false`，则应该使用在本节稍后讨论的严格相等运算符（`===`）。\n\
  \n#### 特殊规则\n\n由于此运算符执行了类型转换，因此存在一些特殊规则：\n\n- 如果一个操作数是数字而另一个是字符串，它将在测试相等性之前尝试将字符串转换为数字。\n\
  - 如果一个操作数是 `Boolean`（布尔值），则它将在测试相等性之前将其转换为数值。在这种情况下，`true` 被转换为 1，`false` 被转换为 0。\n\
  - 如果一个操作数是 `null` 而另一个是 `undefined`，比较将返回 `true`。\n 如果 如果一个或两个操作数都是 `NaN`，比较将返回\
  \ `false`。\n\n下表显示了使用等于运算符的语句示例、它们的返回值以及返回 `true` 或 `false` 的原因。\n\n![Images](img/f0112-01.jpg)\n\
  \n**注意**\n\n你会注意到上一个表中的某些语句周围增加了括号，在随后的某些表中也是如此。在这里，它们主要用于提高可读性。你将在本章末尾学习更多关于括号和操作顺序的知识。\n\
  \n与其他运算符一样，你可以在比较运算符器变量。如果变量的值相等，比较将返回 `true`。否则，它将返回 `false`。假设你已经声明了以下变量：\n\n\
  ![Images](img/f0113-01.jpg)\n\n以下比较将返回 `true`：\n\n`num2 == num3`\n\n下一个比较将返回 `false`：\n\
  \n`num1 == num3`\n\n**注意**\n\n记住，等于运算符（`==`）用于比较。要小心不要无意中用赋值运算符（`=`）代替它，因为那样执行的是赋值而不是比较，并返回赋值的结果，因此你可能会得到一些意想不到的结果。\n\
  \n### 不等于运算符 (!=)\n\n`!=` 运算符是 `==` 运算符的相反。`!=` 运算符不是在运算符两侧的值相等时返回 `true`，而是在运算符两侧的值*不*相等时返回\
  \ `true`。如果它发现运算符两侧的值相等，则该运算符返回 `false` 值。\n\n与 `==` 运算符一样，`!=` 运算符也存在类型转换，并包含一些特殊规则：\n\
  \n- 如果一个操作数是数字而另一个是字符串，它将在测试之前尝试将字符串转换为数字。\n- 如果一个操作数是 `Boolean`，则它将在测试之前将其转换为数值（`true`\
  \ 转换为 1，`false` 转换为 0）。\n- 如果一个操作数是 `null` 而另一个是 `undefined`，比较将返回 `false`。\n- 如果一个或两个操作数都是\
  \ `NaN`，比较将返回 `true`。\n\n下表显示了一些使用 `!=` 运算符的语句示例、它们的返回值以及返回 `true` 或 `false` 的原因。\n\
  \n![Images](img/f0113-02.jpg)\n\n### 严格相等运算符 (===)\n\n要使 `===` 运算符返回 `true`，每一侧的操作数必须相等，且必须是相同的类型（不进行类型转换）。这意味着如果你使用诸如\
  \ `3 === “3”` 的语句，运算符将返回 `false`，因为左侧的值是数字而右侧的值是字符串。\n\n下表显示了使用 `===` 运算符的语句示例。\n\
  \n![Images](img/f0114-01.jpg)\n\n### 严格不等于运算符 (!==)\n\n要使 `!==` 运算符返回 `true`，每一侧的值或语句不能相等，或者必须不是相同的类型（不使用类型转换）。这意味着如果你使用诸如\
  \ `3 !== “3”` 的语句，运算符将返回 `true`，因为左侧的值是数字而右侧的值是字符串。\n\n下表显示了一些使用 `!==` 运算符的语句示例。\n\
  \n![Images](img/f0114-02.jpg)\n\n### 大于运算符 (>)\n\n当使用大于运算符时，如果左侧的值大于右侧的值，比较将返回 `true`。使用了类型转换，因此有一些特殊规则：\n\
  \n- 如果两个操作数都是字符串，则通过检查字符的编码进行比较。\n- 如果其中一个操作数是数字，它将尝试将另一个操作数转换为数字进行比较。\n- 如果操作数是\
  \ `Boolean`，则它会被转换为数字（`true` 为 1，`false` 为 0）。\n\n**注意**\n\n与其他运算符一样，剩余的比较运算符 `\
  \ `>=`, `<=` 也遵循相同的规则。在字符串的情况下，使用的是字符编码。结果的情况是小写字母大于大写字母，大写字母大于数字。要查询字符编码，可以使用 [www.scripttheweb.com/js/ref/character-codes.html](http://www.scripttheweb.com/js/ref/character-codes.html)。\n\
  \n比较字符串时，JavaScript 首先检查字符串的首字母。如果没有差异，将检查下一个字符，依此类推，直到发现差异或到达字符串结束。\n\n下表显示了一些使用\
  \ `>` 运算符的语句。\n\n![Images](img/f0115-01.jpg)\n\n### 小于运算符 (<)\n\n小于运算符的作用与大于运算符相反。`<`\
  \ 运算符不是在左侧大于时返回 `true`，而是在运算符左侧的值小于右侧的值时返回 `true`。\n\n你可以通过查看下表看到 `<` 运算符的一些示例。\n\
  \n![Images](img/f0115-02.jpg)\n\n### 大于等于运算符 (>=)\n\n`>=` 与你之前看到的比较运算符略有不同。该运算符增加了一个选项，即两侧的值相等时比较仍然返回\
  \ `true`。因此，要返回 `true`，运算符左侧的值必须大于或等于右侧的值。下表显示了一些使用 `>=` 运算符的语句示例。\n\n![Images](img/f0116-01.jpg)\n\
  \n### 小于等于运算符 (<=)\n\n\n\n与 `>=` 运算符类似，`<=` 运算符允许两侧的值可能相等。使用“小于或等于”运算符，如果运算符左侧的值小于或等于运算符右侧的值，则返回\
  \ `true`。下表显示了使用 `<=` 运算符的语句示例。\n\n![Images](img/f0116-02.jpg)\n\n在第 6 章中学习条件语句和循环时，你将获得一些使用比较运算符的练习。接下来是逻辑运算符，它们在检查条件时对你很有帮助。\n\
  \n### 理解逻辑运算符\n\n三个逻辑运算符允许你比较两个条件语句，以判断其中一个或两个语句是否为真，并据此进行操作。如果你想同时检查多个条件并使用其结果，逻辑运算符就会非常有用。与比较运算符一样，逻辑运算符返回\
  \ `true` 或 `false`，取决于运算符两侧的值。\n\n表 5-4 总结了将在后续章节中讨论的逻辑运算符。\n\n![Images](img/f0117-02.jpg)\n\
  \n**表 5-4** 逻辑运算符\n\n#### AND 运算符 (&&)\n\n当 `&&` 运算符两侧的比较都为真时，逻辑运算符 AND 返回 `true`。如果运算符一侧的一个或两个比较任一为假，则返回\
  \ `false`。下表显示了一些使用 AND 运算符的语句。\n\n![Images](img/f0117-01.jpg)\n\n#### OR 运算符 (||)\n\
  \n当运算符两侧的任意一个比较返回 `true` 时，逻辑运算符 OR 返回 `true`。因此，要使其返回 `true`，只需要一侧的某个语句评估为 `true`\
  \ 即可。要返回 `false`，运算符两侧的比较都必须返回 `false`。下表显示了使用 OR 运算符的某些比较示例。\n\n![Images](img/f0118-01.jpg)\n\
  \n#### NOT 运算符 (!)\n\n逻辑运算符 NOT 可用于单个比较，表示“如果这种情况不是如此，则返回 `true`”。基本上，它可以让一个通常返回\
  \ `false` 的表达式返回 `true`，或者让一个通常返回 `true` 的表达式返回 `false`。下表显示了该运算符的某些示例。\n\n![Images](img/f0118-02.jpg)\n\
  \n现在你已经掌握了常规逻辑运算符，请快速查看一下位逻辑运算符。\n\n#### 位运算符\n\n位运算符是在位级别上运行的逻辑运算符，那里有一大堆 1 和 0。你不会在书中提供的示例中使用它们，但你可以在\
  \ Web 的某些脚本中看到它们。下表列出了一些位运算符及其符号，这应该帮助你在看到位运算符时能识别出它。\n\n![Images](img/f0118-03.jpg)\n\
  \n### 特殊运算符\n\nJavaScript 中有许多特殊运算符，用于执行特定任务或帮助缩短代码。表 5-5 列出了特殊运算符及其用途。\n\n![Images](img/f0119-01.jpg)\n\
  \n**表 5-5** 特殊运算符\n\n如果此表中使用的许多术语看起来很陌生，请不要气馁。对象、数组和其他不熟悉的术语将在后面的章节中进行讨论。这些运算符中的许多将在后续章节的适当位置重新介绍，届时它们的目的可以表达得更清楚。\n\
  \n**提问专家**\n\n**问：为什么有这么多赋值运算符？如果我可以用 `x=x+1` 代替 `x+=1`，为什么我还需要知道这些额外的赋值运算符？**\n\
  \n**答：** 它们作为快捷方式提供，这样你就不需要在同一行中再次输入变量名。它们还稍微减小了脚本的整体尺寸，有助于网页的加载时间。你可以使用任何一种方法；这取决于你想多程度上精简脚本大小或避免额外的输入。此外，了解这些赋值运算符的作用是很好的，这样你就能在脚本中识别它们的目的。\n\
  \n**问：我可以在语句中同时使用多个运算符吗？如果我这样做会发生什么？**\n\n**答：** 是的，你可以在单个语句中使用多个运算符。运算符将根据它们的优先级按照操作顺序执行，这将在下一节中介绍。\n\
  \n**问：这些括号是怎么回事？为什么在某些情况下使用，而在另一些情况下不使用？它们有原因吗？**\n\n**答：** 到为止使用的括号是为了语句的可读性。在某些情况下，有必要使用括号来获得所需的结果。这也是下一节将涵盖的内容。\n\
  \n**问：在使用所有这些运算符时有什么常见的拼写错误吗？**\n\n**答：** 通常，赋值运算符 (=) 会被误用为等于运算符 (`==`)，因为不小心遗漏了第二个等号。此外，忘记使用\
  \ `&&` 而只输入 `&` 是另一个常见的拼写错误，可能会在脚本中引起麻烦。逻辑或 (`||`) 和位或 (`|`) 也会发生类似的错误。\n\n### 理解操作顺序\n\
  \n在 JavaScript 中，运算符具有特定的优先级。在包含多个运算符的语句中，一个运算符可能会在另一个之前执行，尽管顺序并非如此。例如，看这个：\n\n\
  ```\nlet answer = 8 + 7 * 2;\n```\n\n如果你记得数学运算，就会知道先执行乘法，因为乘法运算符的优先级高于加法。如果你想确保在示例中先执行加法，你可以这样写：\n\
  \n```\nlet answer = (8 + 7) * 2;\n```\n\n如果你在同一级别使用多个括号或相同的运算符，它们将从左到右读取，如下所示：\n\
  \n```\nlet answer = (8 + 7) - (4 * 3) + (8 - 2);\n```\n\n由于所有括号都在同一层级（没有嵌套），因此它们从左到右读取。括号外的加法和减法运算符具有相同的优先级，因此也从左到右读取。\n\
  \n括号的使用从最高优先级（先执行）到最低优先级（最后执行）。\n\n![Images](img/f0121-01.jpg)\n\n**表 5-6** 运算符优先级，从高到低\n\
  \n如在表 5-6 所示，括号可以覆盖其他运算符。当你不确定运算符的优先级或想让代码更具可读性时，括号非常用。\n\n### 尝试一下 5-2 真还是假？\n\n\
