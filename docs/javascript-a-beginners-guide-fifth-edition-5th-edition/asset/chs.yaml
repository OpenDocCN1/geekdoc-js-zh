  \n### Node.js 应用完成\n\n通过第 15 章中 AJAX 的工作，你现在可以通过 `XMLHttpRequest` 直接完成你的 Node.js\
  \ 应用。这需要对 Node.js 代码和前端代码进行一些更改，以便完成球信息的显示。\n\n### 更新 Node.js 代码\n\n由于你现在希望在使用 `XMLHttpRequest`\
  \ 时将信息发送到前端，你将用一个新的路由处理程序替换旧的 `getBowler()` 函数，该处理程序将在向前端发送最终数据之前返回数据库查询的结果。\n\n\
  首先，更新你的 `server.js` 文件使用以下代码：\n\n![Images](img/f0503-01.jpg)\n\n![Images](img/f0504-01.jpg)\n\
