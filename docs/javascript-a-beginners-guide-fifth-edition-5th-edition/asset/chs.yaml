  \ `/` 一样，你现在有了 `/api/bowlers` 公共路由。如果服务器正在运行并在地址栏中输入 [`localhost:3000/api/bowlers`](http://localhost:3000/api/bowlers)，浏览器将显示从数据库检索球员信息后产生的\
  \ JSON 数据。当你更改前端代码时，浏览器将使用 AJAX 请求获取此信息。\n\n注意，在路由处理函数内部，你执行了之前获取球员信息时的大的大部分工作。查询数据库，然后你可以使用结果。在这里，你利用机会进行一些拼接以获取球员全名，计算球员评分，并按球员评分从高到低进行排序。最后，使用以下代码将结果以\
  \ JSON 格式发送到前端：\n\n```\nres.status(200).json(result.rows);\n```\n\n\n\n\n\n`status(200)`\
  \ 部分设置了将返回的 http 状态码，而 `json(result.rows)` 则提供了返回的内容并将其转换为 JSON 格式。\n\n请注意以下行尚未详细查看的代码：\n\
