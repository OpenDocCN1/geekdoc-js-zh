  \ 三次，不再更多\n**D.** 随你喜欢（尽管嵌套过多会导致浏览器耗尽内存）\n\n## 第 7 章\n\n## JavaScript 数组\n\n###\
  \ 关键技能与概念\n\n* 定义和访问数组\n* 数组属性和方法\n* 在循环中使用数组\n* 嵌套数组\n\n在本章中，你将学习 JavaScript 数组以及它们如何帮助你改进脚本。你将从数组的简单概述以及它们的用处开始，并学习如何在\
  \ JavaScript 中定义和访问数组。之后，你将学习用于数组的有用属性和方法。最后，你将学习如何嵌套数组提供额外的层次。\n\n## 什么是数组？\n\n\
  `array` 是存储数据列表的一种（例如，颜色列表或食物列表）。这些值通过索引数字来访问。\n\n为了直观数组如何工作，假设你有一班学生，你想快速显示每个学生的名字。你可以使用普通变量持有每个学生的名字，但将每个变量写入\
  \ `document.write()` 将花费很长时间。相反，你可以将每个学生的名字存储在数组中，这将更容易访问。\n\n在下面的示例中，我们使用数组存储了四个学生的名字。注意\
  \ Thomas 的索引是 0，Roger 是 1，Amber 是 2，Jennifer 是 3。\n\n```javascript\nvar students\
  \ = [\"Thomas\", \"Roger\", \"Amber\", \"Jennifer\"];\ndocument.write(students[0]);\n\
  document.write(students[1]);\ndocument.write(students[2]);\ndocument.write(students[3]);\n\
  ```\n\n为了显示数组中的所有名称，可以使用 `for` 循环。循环运行的次数足够允许输入的城市订购最大数量的物品。\n\n```javascript\n\
  var cities = [\"Johnstown\", \"Donville\", \"Danieltown\", \"Martyville\"];\nfor\
  \ (var i = 0; i < cities.length; i++) {\n    document.write(cities[i] + \"<br>\"\
  );\n}\n```\n\n\n\n数组构造函数使用以下格式定义数组：\n\n![Images](img/f0165-02.jpg)\n\n你将 `arrayname`\
