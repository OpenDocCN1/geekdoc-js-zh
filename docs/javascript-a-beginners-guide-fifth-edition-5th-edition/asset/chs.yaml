  \ Web 页面。\n\n## 对象结构\n\n当你以特定的方式对对象进行编程时，你可以构建一个作为其他对象的结构或模型。为了理解其工作原理，你将查看构造函数并学习如何使用原型（prototype）。\n\
  \n### 构造函数\n\n构造函数可以用于为对象创建重用的代码。例如，你可以有一个由构造函数创建的 `Car` 对象，这允许其代码被复用用于任意类型的汽车。你可以有一辆工作车、一辆家庭用车和一辆娱乐用车，它们都拥有汽车构造函数中定义的相同属性和方法名，同时向它们发送不同的值。\n\
  \n例如，要创建一个汽车构造函数，你需要创建一个名为 `Car()` 的函数，然后在函数内部添加属性和/或方法。以下示例显示了 `Car()` 构造函数的轮廓：\n\
  \n![Images](img/f0201-02.jpg)\n\n注意函数名以大写字母 (C) 开头。虽然这不是强制要求的，但习惯上构造函数的名称以大写字母开头，以帮助与其他类型的函数区分来。\n\
  \n要完成前面的函数，你需要将属性添加到函数中。假设你想创建一个名为 `car` 的对象，并具有 `seats`、`engine` 和 `radio` 属性。以下代码显示了如何实现：\n\
  \n![Images](img/f0202-01.jpg)\n\n在这段代码中，在第一行，你看到函数接受三个参数。接下来看到的是参数的值被赋值为属性值；但是，有一个名为\
