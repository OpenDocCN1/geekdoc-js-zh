  \n本节中的其他方法原理非常相似；它们只是返回不同的结果，例如绝对值、正切值或对数。\n\n## 双参数方法\n\n本节讨论了接受两个参数而不是一个参数的方法。这些方法包括：\n\
  \n* `atan2()`\n* `max()`\n* `min()`\n* `pow()`\n\n`max()` 和 `min()` 方法非常相似，而 `pow()`\
  \ 方法的用法略有不同。\n\n### max() 和 min() 方法\n\n`max()` 方法接收两个或多个数字并返回最大的数字。`min()` 方法也接收两个或多个参数，但返回较小的数字。你可以在脚本中使用这些方法，允许查看者输入两个数字，然后提示用户哪个数字较大。\n\
  \n下面的示例代码同时使用了这两种方法，并并在警告框中向查看者显示结果。首先是 HTML 代码：\n\n![Images](img/f0324-01.jpg)\n\
  \n接下来是 JavaScript 代码：\n\n![Images](img/f0324-02.jpg)\n\n此表单向查看者索要两个数字并将它们赋值给变量。会进行检查以确保输入的是数值。如果是的话，它将获取这两个数字中的最大值和最小值，并将这些值赋值给变量。然后使用这些变量来检查它们是否相等。如果相等，会弹出一个警告说它们相等；否则，会弹出一个警告框显示结果。\n\
  \n下面的插图显示了当查看者第一个数字输入 2，第二个数字输入 54 时，该脚本在浏览器中的结果。\n\n![Images](img/I12-01.jpg)\n\
  \n### pow() 方法\n\n`pow()` 方法接收两个参数，并计算第一个参数的第二个参数幂的值。例如，以下代码将返回 2 的 3 次幂的值：\n\n\
  ```\nMath.pow(2,3);\n```\n\n除了计算方式不同外，你可以像使用其他两个双参数方法一样使用它，通过将结果赋值给变量，然后在脚本中使用该变量。例如，你可以使用以下脚本，从\
  \ HTML 代码开始：\n\n![Images](img/f0325-02.jpg)\n\n接下来是 JavaScript 代码：\n\n![Images](img/f0325-03.jpg)\n\
  \n![Images](img/f0326-01.jpg)\n\n使用这段代码，如果查看者在第一个数字输入 2，在要求输入幂时输入 3，脚本将计算 2 的 3\
  \ 次幂的结果。然后查看者将收到一个显示答案的警告。点击 HTML 代码中的按钮是查看者启动函数的方式。当输入数字 2 和 3 时，该脚本的结果所示：\n\n\
  ![Images](img/I12-02.jpg)\n\n现在你已经了解了双参数方法，请看一眼其他尚未涵盖的方法。\n\n### 其他方法\n\n这些方法接收单个参数，但每个方法对该参数的操作都值得仔细观察。单个方法包括：\n\
  \n* `ceil()`\n* `floor()`\n* `round()`\n\n### ceil() 方法\n\n`ceil()` 方法代表 *ceiling*（天花板），并返回大于或等于作为参数发送的数字的最小整数。该方法主要用于数字后可能带有小数点的情况。它将数字向上舍入到下一个最大的整数，除非该数字本身已经是整数。在这种情况下，将返回相同的数字（因为它们可以相等）。例如，`Math.ceil(12.23);`\
  \ 将返回 13，但 `Math.ceil(12);` 将返回 12。\n\n下面的脚本展示了如何使用 `ceil()` 方法返回不同的值，从 HTML 代码开始：\n\
  \n![Images](img/f0327-01.jpg)\n\n接下来是 JavaScript 代码：\n\n![Images](img/f0327-02.jpg)\n\
  \n此脚本会显示一个警告，说明查看者输入的数字的向上取整值。下面的插图显示了当查看者在提示符处输入 4.55 时，在浏览器中的结果。\n\n![Images](img/I12-03.jpg)\n\
  \n### floor() 方法\n\n`floor()` 方法类似于 `ceil()` 方法，但它的方向相反。`floor()` 方法返回小于或等于作为参数发送的数字的最大的整数。它将数字向下舍入到下一个整数，除非该数字本身已经是整数。在这种情况下，将返回相同的数字，因为它们相等。例如，`Math.floor(12.23);`\
  \ 将返回 12，`Math.floor(12);` 将返回 12。\n\n下面的脚本展示了如何使用 `floor()` 方法返回不同的值，从 HTML 代码开始：\n\
  \n![Images](img/f0327-01.jpg)\n\n接下来是 JavaScript 代码：\n\n![Images](img/f0327-02.jpg)\n\
  \n此脚本会显示一个警告，说明查看者输入的数字的向下取整值。下面的插图显示了当查看者在提示符处输入 4.55 时，在浏览器中的结果。\n\n### round()\
  \ 方法\n\n`round()` 方法将数字四舍五入到最近的整数。如果小数部分为 .5 或更大，则向上舍入；如果小于 .5，则向下舍入。例如，`Math.round(12.51);`\
  \ 将返回 13，而 `Math.round(12.49);` 将返回 12。\n\n### random() 方法\n\n`random()` 方法用于创建需要随机性的脚本。它返回一个\
  \ 0（包含）到 1（不包含）之间的浮点数。这意味着你会得到一个可能很长的小数，本身并用。例如，它可能会返回 0.36511654809529。\n\n####\
  \ 整数\n\n为了获取整数，首先要做的是让结果具有更大的范围，以便不局限于 0 到 1。就像数组一样，范围从 0 开始计数；因此，为了获得五个整数范围，你会将结果乘以\
  \ 5。下面的代码展示了如何这样做：\n\n![Images](img/f0329-01.jpg)\n\n这得到了 0 到 4 之间的结果，但还没有给你整数。数字仍然可能是一个长小数。\n\
  \n为了获得 0 到 4 之间的整数，你需要找到一种方法让这些小数转换为整数。回想我们之前运行了三个方法，`floor()`、`ceil()` 和 `round()`，它们以各种方式将数字转换为整数。我们在这里选择\
  \ `floor()` 方法，因为它简单地去除了整数后的小数位，给出整数部分。\n\n要使用 `floor()` 方法，你可以写以下代码：\n\n![Images](img/f0329-02.jpg)\n\
  \n`floor()` 方法接收 `rand_num` 变量的值作为参数，然后从中给你一个整数。\n\n如果你想节省一行代码，可以写得花哨一点。你可以直接将 `random()`\
  \ 方法和计算式作为 `floor()` 方法的参数。你可以这样做是因为计算式的结果 `Math.random()*5` 是一个数字，而 `floor()` 方法可以接受数字作为参数。下面的代码展示了你如何在单行代码中实现这种功能：\n\
  \n```\nrand_num = Math.floor(Math.random()*5);\n```\n\n\n\n\n现在变量 `rand_int` 将获得一个\
