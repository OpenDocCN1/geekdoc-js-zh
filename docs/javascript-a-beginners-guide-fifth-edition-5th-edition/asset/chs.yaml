  \ 应用返回一个 JSON 数据字符串（在这里构建了 JSON 字符串，但 PHP 也有将 PHP 对象转换为 JSON 的方法），它可能如下：\n\n```json\n\
  { \"John\": 2, \"Nick\": 35, \"Doug\": 32, \"Paul\": 25 }\n```\n\n你现在可以修改你的 JavaScript\
  \ 代码，显示投票中每个人的名字和投票总数。以下是更新后的 JavaScript 代码：\n\n![Images](img/f0464-02.jpg)\n\n\
  ![Images](img/f0465-01.jpg)\n\n在这里，你能够简单地解析 `responseText` 以获取一个名为 `results` 的可用\
