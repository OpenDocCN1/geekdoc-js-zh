  在这个项目中，你利用对 JavaScript 和 HTML5 表单的知识创建了一个验证系统，该系统在 HTML5 中检查电话号码是否有效，并使用 JavaScript\
  \ 代码作为验证的备用。\n\n### AJAX 和 JSON\n\nAJAX 提供了一种使用 `XMLHttpRequest` 对象从服务器端脚本获取数据的方法。使用\
  \ `JSON` 可以将获取的数据作为可用的 JavaScript 值，例如数组或对象。这两者将在接后的章节中进行详细解释。\n\n### AJAX\n\nAJAX\
  \ 代表异步 JavaScript 和 XML（Asynchronous JavaScript and XML），它是 JavaScript 从服务器端文件或应用程序获取数据而无需重新加载页面的方法。例如，对\
  \ Web 服务器的同步请求需要重新加载当前页面以使用新信息。异步请求允许在无需等待整个页面加载的情况下获取并使用信息。\n\n从服务器获取的数据可以是任何内容（例如，文本文件、XML\
  \ 文件、运行服务器端脚本的结果）。尽管使用了 AJAX 术语，但返回的值实际上并不需要是 XML 格式。这使得你在如何检索所需数据方面具有很大的灵活性。\n\n\
  这种类型的脚本在渐进式增强中非常有用，因为它允许应用程序为在现代浏览器中启用 JavaScript 的用户增强用户体验。无需等待页面再次加载，就可以即时获取并使用信息。\n\
  \n##### XMLHttpRequest 对象\n\n在 JavaScript 中，会创建一个 `XMLHttpRequest` 对象，然后可以使用它在后台向服务器发送\
  \ HTTP 请求，并允许用户不中断地继续使用应用程序。该对象在文中通常被简写为 `XHR`，作为全对象名称（`XMLHttpRequest`）的缩写。\n\n\
  要创建一个 XHR 对象，你只需使用其构造函数，如下代码所示：\n\n```\nlet xhr = new XMLHttpRequest();\n```\n\n\
  该对象在大多数现代浏览器中可用。在第 7 之前的 Internet Explorer 版本中，你需要创建一个 `ActiveX` 对象。早期版本 Internet\
  \ Explorer 的变通可以在网上找到，例如 [github.com/ilinsky/xmlhttprequest](http://github.com/ilinsky/xmlhttprequest)。如果你不需要在旧浏览器中使用该功能，可以使用标准构造函数。\n\
  \n##### open() 和 send() 方法\n\n`open()` 方法允许你准备要发送到服务器的请求。它接受三个参数：请求方法（例如 `get` 或\
  \ `post`）、要打开的 URL 以及一个布尔值（请求是异步的为 true，同步的为 false）。因此，要使用 `get` 方法将 `get_info.php`\
  \ 作为异步请求，可以使用以下代码：\n\n![Images](img/f0457-01.jpg)\n\n```\n\n现在请求已就绪，你可以使用 `send()`\
  \ 方法发送它。`send()` 方法接受一个参数，即作为请求的一部分发送的数据。如果你在使用 `get` 请求，可以简单地使用 `null` 作为参数，如下所示：\n\
  \n![Images](img/f0457-02.jpg)\n\n```\n\n这将请求发送到服务器。一旦发送了请求，你就需要等待状态返回并接收数据以完成传输。\n\
  \n##### status 属性、readstatechange 事件和 responseText 属性\n\n在尝试从服务器检索数据时，你首先需要知道请求是否收到了来自服务器的有效响应。这可以通过\
  \ `status` 属性来确定。基本上，200 范围内的任何状态码都是成功的响应。此外，状态码 304 也是成功的，因为数据可以从浏览器缓存中获取。\n\n\
  要查看返回什么数据，你可以使用 `responseText` 属性（或者如果响应 MIME 类型为 `text/xml` 或 `application/xml`，可以使用\
  \ `responseXML` 属性）。如果预计 `get_info.php` PHP 脚本返回字符串数据，那么这些数据将可以通过 `responseText`\
  \ 属性可用。\n\n最后，对于异步请求，你可能希望确定正尝试检索的数据何时可以使用。这是通过 `readyState` 事件来实现的。每当你的 XHR 对象的\
  \ `readyState` 属性发生更新时，该事件就会被触发。`readyState` 属性可以具有以下值：\n\n- 0 – 未初始化。尚未调用 `open()`\
  \ 方法。\n- 1 – 已打开。已调用 `open()` 方法。\n- 2 – 已发送。已调用 `send()` 方法。\n- 3 – 接收中。已接收数据但尚未完成。\n\
  - 4 – 已完成。所有数据都已接收并可以使用。\n\n\n\n\n\n对于大多数应用程序，你只需要担心响应代码是否为 4，因为在获取所有数据之前，你不会执行任何操作。\n\
  \n要发送请求并接收数据，你需要将所有这些整合在一起。请求需要被打开并发送，需要一个良好的响应状态，并且你需要通过 `onreadystatechange` 事件来判断\
  \ `readyState` 的值何时等于 4。这可以通过以下代码实现：\n\n![Images](img/f0458-01.jpg)\n\n关于这段代码的几点说明：由于浏览器兼容性问题，使用了处理\
  \ `readystatechange` 事件的 DOM 0 方法，并且 `open()` 和 `send()` 方法是在处理 `readystatechange`\
  \ 事件的函数之后才调用的。这两项操作有助于最大限度地减少在各种浏览器中发生意外错误的风险。如果响应通过了所有测试，那么用户将收到一个带有来自 PHP 脚本文本的警框。\n\
  \n`responseText` 属性中接收到的文本可以是简单的值，也可以是复杂的字符串。无论脚本返回的是“John”还是“x=34&y=25&z=50”，该值都将被放置在\
  \ `responseText` 属性中。\n\n注意，由于这是一份入门指南，你将使用“get”请求来检索数据，而不会更改 HTTP 请求头。关于这些 AJAX\
  \ 特性的更多细节，请参阅本章后面的“进一步阅读”部分。\n\n### 一个 AJAX 脚本示例\n\n显示响应数据如何创建的最佳方法是应用一个示例。假设你有以下\
  \ HTML 来创建一个简单的投票调查：\n\n![Images](img/f0458-02.jpg)\n\n在这种情况下，表单的 action 将是一个独立的\
  \ PHP 脚本，如果 JavaScript 不可用，该脚本将运行。如果 JavaScript 可用，你将在 AJAX 代码中调用名为 `get_winner.php`\
  \ 的脚本。\n\n`get_winner.php` 将是一个返回数据的服务器端应用程序。这可以是数据库查询的结果、计算结果或服务器端应用程序可以执行的任何其他任务。在这种情况下，脚本将你的投票添加到数据库中，并查询数据库获得票数最多的人，宣布该人为当前投票调查的获胜者。由于服务器端编程超出了本书的范围，`get_winner.php`\
  \ 脚本将被简化以描述其目的。以下是该脚本：\n\n![Images](img/f0459-01.jpg)\n\n在这里，运行了一个函数来确定数据库中变量 `$winner`\
  \ 的值。`echo` 命令将字符串文本作为响应发送。如果这是作为一个独立脚本运行的，字符串将直接写入浏览器窗口中。然而，在响应 XHR 请求时，此字符串将作为\
  \ `responseText` 属性的值返回给 JavaScript 应用程序。你现在可以在 JavaScript 中利用从服务器端应用程序返回的数据了！\n\
  \n***注意***\n\n当你使用服务器端应用程序返回数据时，它不需要用 PHP 编写。根据你的背景和服务器设置，可以使用任何服务器端语言（例如 Perl、ASP、Python、Java、Node.js）。\n\
  \n考虑到这一点，剩余工作的大部分是在你的 JavaScript 代码中完成的。由于你想要显示当前的获胜者，为 `responseText` 属性返回的值将提供你所需的数据。以下是检索并使用来自\
  \ `get_winner.php` 脚本信息的 JavaScript 代码：\n\n![Images](img/f0459-02.jpg)\n\n![Images](img/f0460-01.jpg)\n\
  \n这看起来像是一个很长的过程，但大部分工作都是为发送用户的投票做准备（在提交之前检查是否选择了选项等）。这获取了用户的投票，并将其存储在 `vote` 变量中。该变量随后被用作查询字符串的一部分，当调用\
  \ `get_winner.php` 时会被添加到 URL 中。例如，如果用户投了“Paul”，那么在这种情况下发送到服务器的 URL 将是 `get_winner.php?vote=Paul`。注意在\
  \ `vote` 变量上使用了 `encodeURIComponent()` 方法，这确保了值可以作为有效 URL 的部分。这将为 PHP 脚本提供将该投票添加到数据库的数据。脚本的剩余部分使用了你在本章中学到的知识来获取数据（投票的当前获胜者）。由于数据已经是所需的格式，`results`\
