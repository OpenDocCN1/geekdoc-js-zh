  #### 尝试一下总结\n\n在这个项目中，你使用 cookie 记住了一个名字，并学习了设置和读取 cookie。\n\n## 使用正则表达式\n\n正则表达式赋予了你强大的功能。它们允许你以更复杂的方式处理字符串。例如，如果你想检查某个字符序列是否存在，可以使用正则表达式。\n\
  \n### 创建正则表达式\n\n要创建正则表达式，你必须创建一个 `RegExp` 对象的实例。不要使用引号，而是使用正斜杠 `/`。如果表达式内部使用了正斜杠，则必须对其进行转义。\n\
  \n### 使用正则表达式测试字符串\n\n要使用正则表达式测试字符串，可以使用 `RegExp` 对象的 `test()` 方法。\n\n\n\n\n`test()`\
  \ 方法的结果被赋值给名为 `is_a_match` 的变量。然后该变量被用作 `if` 语句的条件。如果该变量值为 `true`，观众将收到“哇，我们有相同的名字！”的提示框。如果它的值为\
  \ `false`，观众将收到“不是我的名字，但它可以运行！”的提示框。图 13-3 显示了当使用“Steve”作为名称时该脚本的结果。\n\n![Images](img/F13-03.jpg)\n\
  \n**图 13-3** 名称不符合正则表达式模式。\n\n如果你想缩短脚本，可以直接将 `test()` 方法的结果作为 `if` 语句的条件（而不是创建另一个变量），如下面代码所示：\n\
  \n![Images](img/f0379-02.jpg)\n\n由于该方法返回 `true` 或 `false`，它可以独立地作为 `if` 语句的条件。（如果你愿意的话，也可以将其写成\
  \ `(tomatch.test(thename)==true)`）。\n\n### 添加标志 (Flags)\n\n标志允许你使匹配不区分大小写，或者查找字符串中的每一个匹配项而不仅仅是第一个（全局测试）。要添加标志，请将其放置在正则表达式最后一个斜杠之后。你可以使用三种选项，如表\
  \ 13-3 所示。\n\n![Images](img/f0380-01.jpg)\n\n**表 13-3** 正则表达式标志\n\n如果你想调整之前使用的名称脚本以使其不区分大小写，可以在正则表达式中添加\
  \ `i` 标志，如下面代码所示：\n\n![Images](img/f0380-02.jpg)\n\n现在，只要字符串中包含 John 的模式，`test()`\
  \ 方法就将返回 `true`。它可以是任何大小写，因此现在 John、JOHN、john 甚至 JoHn 都是匹配项，并且会使 `test()` 方法返回 `true`。\n\
  \n你也可以使用多个标志或同时使用所有三个标志。例如，如果你想让匹配既不区分大小写又是跨跨行的，可以使用以下代码：\n\n```javascript\nlet\
  \ tomatch = /John/im;\n```\n\n### 创建强大的模式\n\n虽然能够创建如此精确的模式固然，但你并不总是要寻找如此精确的匹配。在许多情况下，你将寻求匹配更通用的模式，例如至少需要三个字符的条目，或者需要两个任意类型的字符后跟一个特殊字符的条目。\n\
  \n通过在表达式中使用特殊字符，你可以创建所需的匹配给定序列的模式。JavaScript 正则表达式使用 Perl 正则表达式作为模型。因此，如果你在 Perl\
  \ 中用过正则表达式，那么这些内容大部分你会非常熟悉。表 13-4 列出了一些字符来帮助你创建模式。\n\n![Images](img/f0381-01.jpg)\n\
  \n![Images](img/f0382-01.jpg)\n\n**表 13-4** 正则表达式代码\n\n如你所见，创建所需的模式有很多选项。现在你可以根据设置的标准轻松验证字符串。\n\
  \n现在你想确保文本字段包含一个或多个数字，可以使用表 13-4 中的 `/d` 和 `+` 字符，配合以下 HTML 和 JavaScript 代码，从 HTML\
  \ 代码开始：\n\n![Images](img/f0383-01.jpg)\n\n接下来是 JavaScript 代码：\n\n![Images](img/f0383-02.jpg)\n\
  \n这段代码只需检查字符串中是否有数字。如果你想确保观众输入的是*仅限*数字而不包含任何其他类型的字符，你需要确保正则表达式被写为从字符串开头到结尾进行测试。通过使用表\
  \ 13-4 中的 `^` 和 `$` 符号，你可以确保字符串的测试是从字符串的开始到字符串的结束。`\\d` 后的 `+` 确保至少输入了一个数字。因此，以下模式将仅允许数字：\n\
  \n```javascript\nlet tomatch = /^\\d+$/;\n```\n\n由于从字符串开始到结束唯一的有效字符是数字，这将仅对包含数字且字符串中没有其他字符的输入返回\
  \ `true`。这对于验证表单和其他类型的用户输入特别有用，可以确保输入类型是你预期的类型。\n\n***注意***\n\n正则表达式对于验证非常强大，因为它们允许接受较少的信息。\n\
  \n使用电子邮件地址或电话号码等数据对表单提交进行客户端验证，可以减少不必要的服务器往返。然而，用户可能会禁用 JavaScript 支持并直接提交表单。因此，客户端验证应该支持服务端验证（例如通过\
  \ `PHP` 脚本或 CGI 脚本），但绝不能取代它（存储或显示来自未验证观众的数据可能会导致巨大的安全风险）。\n\n### 表达式的分组\n\n你会在表\
  \ 13-4 中注意到，用括号括起来的表达式表示一个组。例如，如果你想匹配 5 次 `3`，可以使用以下代码：\n\n```javascript\n/3{5}\n\
  ```\n\n如果你想匹配 `3` 至少出现 5 次但最多 10 次的情况，可以使用以下代码：\n\n```javascript\n/3{5,10}\n```\n\
  \n现在假设你想让匹配以 3 开始，后面跟任意数字，并匹配 5 次（因此，类似 32343 会匹配）。你可能会这样写：\n\n```javascript\n/3\\\
  d{5}\n```\n\n这种方法的问题是它正确获取了 3，但之后匹配了 5 个数字而没有重复 3。为了修复这个问题，你可以用括号将 3 和 `\\d` 分组，并在后面加上重复的次数：\n\
  \n```javascript\n/(3\\d){5}\n```\n\n这一次，3 和数字被分在了一起，该序列必须重复 5 次。分组是一种更有效地利用正则表达式的有用方法，当你学习表单验证时会看到更多内容。\n\
  \n### replace(), match(), matchAll() 和 search() 方法\n\n这些 `String` 对象的方法在本章前面的部分提到过，现在引入了正则表达式后，它们将更有意义。\n\
  \n#### replace() 方法\n\n要替换字符串中的信息，可以使用正则表达式和 `String` 对象的 `replace()` 方法。使用 `replace()`\
  \ 方法的语法如下：\n\n``varname = stringname.replace(regex, newstring);`\n\n将 `varname`\
  \ 替换为存储替换后新字符串值的变量名。将 `stringname` 替换为要替换的字符串变量名。将 `regex` 替换为用于匹配字符串的正则表达式名称。最后，将\
  \ `newstring` 替换为字符串或字符串变量，用于替换字符串中的任何匹配值。\n\n作为一个示例，以下代码将 `mystring` 中的第一个“car”实例替换为“skunk”：\n\
  \n![Images](img/f0385-02.jpg)\n\n前面的代码只替换了第一个 car 实例，弹出的是“我喜欢新臭味的味道，汽车很有趣。”。如果你想更改所有的“car”实例，则可以在正则表达式末尾添加\
  \ `g` 标志，如下代码所示：\n\n\n\n\n![Images](img/f0385-03.jpg)\n\n`g` 标志将匹配字符串中找到的正则表达式每一个实例。因此，当运行\
  \ `replace()` 方法时，所有的“car”实例都将被替换为“skunk”。用户将看到此警框：“我喜欢新臭鼠的气味，而且臭鼠很有趣。”\n\n通过使用正则表达式配合\
  \ `replace()` 方法，可以可以更轻松地更改名和姓的第一个字母。以下代码展示了如何操作：\n\n![Images](img/f0385-04.jpg)\n\
  \n![Images](img/f0386-01.jpg)\n\n此脚本会将名和姓的第一个字母更改为 `Z`，无论它们之前是什么。用于替换的正则表达式仅仅是使用单词边界代码\
  \ `\\b` 来查找单词开头的字母。每当一个字母位于单词开头时，它就会被替换。\n\n输入验证防止了脚本获取超过两个名字和一个空格，它还确保了每个名字中至少有一个字母，且不包含数字或特殊字符。插图显示了当用户在提示中输入\
  \ Debra Loo 时，脚本的结果：用户的姓名被更改了。\n\n![Images](img/f0386-01a.jpg)\n\n![Images](img/f0386-02.jpg)\n\
  \n### match() 和 matchAll() 方法\n\n`match()` 方法比较正则表达式和字符串以查看它们是否匹配。它返回一个包含一个或多个匹配项的数组，取决于它的用法。如果没有找到匹配项，它返回\
  \ –1。\n\n`match()` 方法的基本用法如下：\n\n```javascript\nstring.match(regex);\n```\n\n`string`\
  \ 将是你的字符串字面量，而 `regex` 将是你的正则表达式字面量。注意此方法与 `test()` 方法在顺序上的区别。你可以这样使用它：\n\n![Images](img/f0386-04.jpg)\n\
  \n如果配合 `g` 标志或使用 `()` 进行分组使用，它将记住所做的每一次匹配（包括对组或嵌套组的匹配），并将每个匹配项作为数组元素返回。`matchAll()`\
  \ 方法的工作原理相同，它将找到的所有匹配项作为一个数组返回。\n\n### search() 方法\n\n`search()` 方法执行正则表达式与指定字符串之间的匹配搜索。如果找到了匹配项，它返回字符串中找到匹配起始位置的位置。否则，它返回\
  \ –1。以下是该方法的实际示例：\n\n![Images](img/f0387-01.jpg)\n\n如你所见，其语法与 `match()` 方法非常相似。\n\
