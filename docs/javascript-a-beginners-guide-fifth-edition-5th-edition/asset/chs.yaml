  \ 才能验证。\n\n### 新属性\n\nHTML5 还引入了一些新的属性，可以用于表单和表单元素。这些属性列在表 15-5。\n\n![Images](img/f0452-01.jpg)\n\
  \n**表 15-5**  HTML5/表单字段的新属性\n\n### HTML5 表单验证\n\nHTML5 允许浏览器自动验证各种输入类型。可以通过在 `form`\
  \ 标签中使用 `novalidate` 属性来禁用表单所有字段的浏览器验证，或者通过在单个表单字段中使用该属性使其不进行验证。注意，`novalidate`\
  \ 与你使用 `onsubmit` 事件自行进行的自定义验证无关。\n\n如果你决定允许浏览器验证字段，新的输入类型将对它们使用某些验证方法，以确保输入了预期的信息类型。每个字段默认都是可选的，但你可以通过向需要完成的字段添加\
  \ `required` 属性将其变为必填。例如，浏览器将验证以下表单，并要求填写 URL 字段。\n\n\n\n\n\n你还可以使用 `pattern` 字段，以便浏览器根据正则表达式对字段进行验证。例如，如果你想让上一个表单中的\
  \ `name` 字段只包含字母和空格，可以使用以下代码：\n\n![Images](img/f0454-01.jpg)\n\n唯一的缺点是浏览器兼容性。如果你需要在不支持\
  \ HTML5 中使用的特定输入类型或验证的浏览器中进行客户端输入验证，那么你将需要编写一些 JavaScript 作为备用。例如，假设你有以下表单：\n\n\
  ![Images](img/f0454-02.jpg)\n\n如果浏览器不支持 `pattern` 属性，而你仍然想确保字段仅包含字母和空格，那么你就需要编写脚本来确保该字段仍然通过验证。在这种情况下，你可以简单地使用以下代码在点击提交按钮时对\
  \ `name` 字段进行验证。\n\n![Images](img/f0454-03.jpg)\n\n这仅仅是将所需的模式作为正则表达式在 JavaScript\
  \ 中，并运行 `test` 方法来检查输入是否匹配模式。如果不匹配，将向查看者发送警报以便修正名称。\n\nHTML5 为表单提供了许多新且实用的功能。在编写本文时，客户端验证可能需要\
  \ JavaScript 备用。随着更多的用户转向更新浏览器，以及浏览器对所有新功能的支持增加，这些新工具对你作为开发者将变得更有帮助。\n\n**注意**\n\
