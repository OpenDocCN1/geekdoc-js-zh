  \n`getTimezoneOffset()` 方法返回本地时间与 GMT（格林尼治时间）之间的分钟数差。因此，如果你与 GMT 相差六小时，该方法将返回 360\
  \ (6 × 60)；如果你只差一小时，该方法返回 60。\n\n## getFullYear() 方法\n\n`getFullYear()` 方法返回一个四位的年份：\n\
  \n![Images](img/f0344-02.jpg)\n\n这会将方法返回的值赋值给变量 `theyear`。\n\n## UTC 方法\n\n这些方法与其对应的方法原理相同（例如，`getDate()`\
  \ 和 `getUTCDate()` 的原理相同），但它们返回的是世界时（UTC）信息，而不是查看者的本地时间。\n\n现在你已经了解了获取值的方法，让我们来看看允许你为\
  \ `Date` 对象实例设置值的方法。\n\n字体 设置值的方法\n\n设置值的方法与获取值的方法处理相同类型的值。允许为 `Date` 对象实例设置值的方法包括：\n\
  \n- `setDate()`\n- `setHours()`\n- `setMilliseconds`\n- `setMinutes()`\n- `setMonth()`\n\
  - `setSeconds()`\n- `setTime()`\n- `setFullYear()`\n- `setUTCDate()`\n- `setUTCFullYear()`\n\
  - `setUTCHours()`\n- `setUTCMilliseconds()`\n- `setUTCMinutes()`\n- `setUTCMonth()`\n\
  - `setUTCSeconds()`\n\n要设置这些值，你需要根据你想要使用的日期或日期发送一个数值参数。例如，如果你想设置 `Date` 对象实例的几几，可以使用以下代码：\n\
