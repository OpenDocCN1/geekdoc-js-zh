  \n\n\n\n\n# 基于浏览器的 JavaScript\n\n## 核心技能与概念\n\n* `Window`：全局对象\n* 使用 Window 对象的属性\n\
  * 使用 Window 对象的方法\n* 打开新窗口\n* JavaScript 与图像\n* JavaScript 与框架 (Frames)\n\nJavaScript\
  \ 的 `window` 对象允许你访问可以在脚本使用的更多属性和方法，并作为 Web 浏览器中的全局 JavaScript 对象。在本章中，你将看到它是如何作为全局对象运行的，并学习使用它的许多属性和方法。你还将学习如何在\
  \ Web 浏览器中使用 JavaScript 处理图像和框架。\n\n## Window：全局对象\n\n`window` 对象是为浏览器中出现的每个窗口创建的。窗口可以是主窗口、框架集（frame\
  \ set）或单个框架、一个标签页，甚至是用 JavaScript 创建的新窗口。它与 `document` 对象的不同在于，`window` 对象包含了 `document`\
  \ 对象（以及许多其他对象，如 `history`、`navigator` 等）。它是 Web 浏览器中 JavaScript 的全局对象。\n\n由于它是全局对象，因此定义的任何全局变量或函数也是\
  \ `window` 对象的属性和方法。例如，考虑以下代码：\n\n![Images](img/f0392-01.jpg)\n\n这里，有一个名为 `fruit`\
  \ 的全局变量和一个名为 `show_msg()` 的全局函数。这两者现在都可以作为 `window` 对象的一部分被调用，如下代码所示：\n\n![Images](img/f0392-02.jpg)\n\
  \n因为 `window` 是全局对象，所以没有必要使用 `window.fruit` 或 `window.show_msg()`。由于假设前提是 window，因此这些可以简单地简写为\
  \ `fruit` 和 `show_msg()`，这也是你一直使用它们的方式。\n\n出于相同的原因，window 对象内部的对象、属性和方法不需要引用它们位于\
  \ `window` 对象内部的事实。正如你记得的，你使用过 `window.alert()`，只需使用 `alert()` 即可调用。这对于 `history`\
  \ 等对象同样有效，它们位于 `window` 对象内部。你不需要输入 `window.history.back()`，只需输入 `history.back()`\
  \ 即可访问 `history` 对象的 `back()` 方法。\n\n### 使用 Window 对象的属性\n\n在开始学习 `window` 对象之前，请查看一些常用的属性，这些属性在表\
  \ 14-1 中列出并描述。某些属性在表 14-1 之后会有更详细的讨论。\n\n![Images](img/f0393-01.jpg)\n\n![Images](img/f0394-01.jpg)\n\
  \n**表 14-1** Window 属性\n\n**注意**\n\n与之前的章节一样，本章列出的某些属性和方法并不是跨浏览器的，或者仅在现代浏览器中有效。有关更多信息和完整的属性列表，请访问\
  \ [`developer.mozilla.org/en/DOM/window`](https://developer.mozilla.org/en/DOM/window)。\n\
  \n### closed 属性\n\n`closed` 属性用于检查窗口是否已被查看者关闭。它的通常用法是结合窗口名称，后跟 `closed` 属性，如下例所示：\n\
  \n![Images](img/f0394-02.jpg)\n\n你将 `windowname` 部分替换为你想要检查的窗口名称。这通常是你用 JavaScript\
  \ 打开的一个新窗口；你将在本章稍后的“`open()` 方法”章节中看到如何为新窗口命名。\n\n你也可以在新窗口内部使用 `closed` 属性来检查打开它的窗口是否已关闭。这时，你需要在\
  \ `opener` 属性（在“`opener` 属性”章节中讨论过）之后使用 `closed`，如下例：\n\n![Images](img/f0394-03.jpg)\n\
  \n如果你选择创建一个新窗口，允许查看者通过新窗口中的链接导航到主窗口，那么这种 `closed` 属性用法非常方便。\n\n### frames 属性\n\n\
  `frames` 属性是一个数组，包含了框架集中的每个框架。它通常被用于访问页面上各种框架的属性。你可以通过使用 `frames.length` 属性获取窗口中框架的数量。\n\
  \n### innerWidth 和 innerHeight 属性\n\n`innerWidth` 和 `innerHeight` 属性持有窗口可视区域的宽度和高度值（浏览器窗口减去滚动条、菜单栏、工具栏等）。这些属性在现代浏览器中有效，但在版本\
  \ 9 之前的 Internet Explorer 中无效（旧版本的 Internet Explorer 可以使用 `document.body.clientWidth`\
  \ 和 `document.body.clientHeight`）。\n\n因此，如果你想获取脚本可用的内容区域宽度，可以使用以下代码：\n\n```javascript\n\
  let mywin_width = window.innerWidth;\n```\n\n当然，如果你想根据窗口可用的 `innerWidth` 为浏览器使用不同的\
  \ HTML 代码，可以使用以下代码：\n\n![Images](img/f0395-02.jpg)\n\n这将决定查看者是否具有 800 像素的可视宽度。如果是，`div`\
  \ 元素的宽度将设置为 750 像素。否则，`div` 元素将具有更安全的 90% 百比宽度，以便在较小的屏幕上更更容易显示。\n\n### length 属性\n\
  \n`length` 属性告诉你窗口中有多少个框架，就像 `window.length` 一样。这在编写代码时通常非常方便。\n\n### location 属性\n\
  \n`location` 属性持有窗口当前的 URL。你可以使用 `location` 属性导致浏览器即时重定向到某个页面，例如。但是，请确保不要在搜索引擎列出的页面上使用这种技术，因为它们可能会将该页面从列表中移除。\n\
  \n如果一个页面已经移动且你想在没有任何延迟的情况下重定向查看者，可以给 `location` 属性赋一个新值，如下代码所示：\n\n![Images](img/f0396-01.jpg)\n\
  \n这将查看者带到本地的 `newpage.html`。为没有 JavaScript 的浏览器包含了一个标准链接。否则，前面的代码将为这些浏览器加载一个空白页，且什么都不会发生。\n\
  \n**注意**\n\n即时重定向最适用于未被搜索引擎索引的页面的测试，因为重定向的规则在不同的搜索引擎之间不同。\n\n### name 属性\n\n`name`\
  \ 属性持有当前窗口的名称并允许你为窗口命名。如果你想给主窗口命名，可以将你使用的名称赋值给此属性。以下代码展示了这种用法：\n\n![Images](img/f0396-02.jpg)\n\
  \n脚本为窗口命名，然后向查看者显示该名称。图 14-1 显示了该脚本在浏览器中的执行结果。\n\n![Images](img/F14-01.jpg)\n\n\
  **图 14-1** 向查看者显示窗口名称。\n\n### opener 属性\n\n`opener` 属性用于引用打开当前窗口的窗口。这通常用于使用 `open()`\
  \ 方法打开的新窗口，你将在本章稍后的“`open()` 方法”章节中看到它。通过在新窗口中使用 `opener` 属性，你可以使用之前学过的 `closed`\
  \ 属性来检测主窗口是否已关闭。以下示例展示了如何进行此测试：\n\n```javascript\nif (window.opener.closed)\n```\n\
  \n\n\n\n\n`parent` 属性仅在页面上存在 frames 或 iframes 时使用。它允许你访问当前帧的父帧集（frame set）。当你想要从一个帧更改另一个帧的属性时，这非常有帮助。\n\
  \n`self` 属性是 JavaScript 中“当前窗口”的另一种表达方式。它的用法与 `window` 对象类似，并可以像 `window` 对象一样访问当前窗口的属性。如果你有很多命名的窗口，并且想要确保你使用的是当前窗口的属性，而不是另一个命名窗口的属性，那么\
  \ `self` 属性就会很有用。\n\n`top` 属性用于访问所有帧集（可能是嵌套的）中的顶层窗口。这与 `parent` 属性略有不同，`parent`\
  \ 仅到达当前帧集的顶层，而 `top` 属性则一直到达顶层窗口，即使该窗口包含嵌套的帧集也是如此。\n\n## status 和 defaultStatus\
  \ 属性\n\n`status` 属性包含状态栏中设置的文本值。更改此属性将覆盖通过 `defaultStatus` 属性设置的状态栏内容。\n\n**注意**\n\
  \n现代浏览器默认不会显示由 JavaScript 修改的状态栏文本，以防止不法网站通过状态栏中的虚假链接目标欺骗用户。因此，除非用户更改了浏览器设置，否则 `status`\
  \ 和 `defaultStatus` 属性将无法工作。由于更改浏览器设置允许这样做存在安全风险，因此不建议使用这些属性。\n\n`defaultStatus`\
  \ 属性设置当 `window.status` 属性未分配任何值时，在状态栏中默认显示的文本字符串。更改 `window.status` 属性会覆盖此设置，因为它仅作为默认值显示。此属性通常在\
  \ `load` 事件中设置，以便在查看者未执行会更改状态栏文本的动作时显示自定义消息。\n\n## 尝试此 14-1 使用 location 和 innerWidth\
