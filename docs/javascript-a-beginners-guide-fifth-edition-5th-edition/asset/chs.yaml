  \ `Date` 对象的其他方法。\n\n现在你掌握了这些方法，尝试着用 `Date` 对象玩玩吧。\n\n### 写些日期脚本如何？\n\n在完成技术概述后，你已经准备好创建一些使用\
  \ `Date` 对象方法的脚本了。首先，你将编写一个在页面上显示日期的脚本，然后将创建一个简单的状态栏时钟脚本。\n\n### 在页面上写日期\n\n要在页面上写日期，你需要使用一些\
