  \ `server.js`：\n\n![Images](img/f0313-02.jpg)\n\n首先，注意代码的前三行：\n\n![Images](img/f0313-03.jpg)\n\
  \n立即包含了 `Express` 模块。通过调用 `express()` 函数创建了一个 `app`。一旦设置完成，此应用将积极监听某个端口，并使用下一行定义的路由器将用户重定向到正确的\
  \ HTML 页面。如前提到的，第三行设置了一个 `Express` 路由器，它允许你定义哪些路由将渲染哪些页面。路由可以是任何内容，从主应用页的 `/` 到\
  \ `/view_statistics` 路由（后者在访问时将打开统计页面）。`Express` 路由器可以轻松设置你想要的任何路由，并以适当的方式响应这些路由。\n\
  \n接下来，包含了 `path` 模块。该模块允许你轻松地导航机器上的文件路径。这将在脚本后使用。\n\n代码的下一部分定义了路由：\n\n![Images](img/f0314-01.jpg)\n\
  \n如你所见，`router.get()` 函数允许你定义当用户尝试从该路由获取信息时会发生什么。最常见的情况是通过渲染某种 Web 页面来响应——无论是静态还是动态。在这种情况下，简单的\
  \ HTML 页面即可，因此使用了 `res.sendFile()`。由于 `path` 模块允许你轻松导航机器上的文件路径，这将在脚本后使用。这里 `__dirname`\
  \ 指向了 `index.html` 所在的文件夹。`path.join` 将当前目录名和文件名连接起来。`app.use('/', router)` 将路由器应用到根路由上。\n\
  \n最后，`app.listen()` 函数告诉 `Express` 应用在哪个端口监听以及在监听后做什么。在这种情况下，在 3000 端口，将你的浏览器指向\
  \ [`localhost:3000`](http://localhost:3000)。\n\n一旦设置完成，在你的控制台中输入以下命令：\n\n```\nnode\
  \ server.js\n```\n\n你应该会看到日志显示服务器运行在 3000 端口。一旦运行，在你的浏览器访问 [`localhost:3000`](http://localhost:3000)。\n\
  \n文件准备就绪后，你现在可以使用 Web 服务器创建一个显示 Web 服务器正在运行的简单 Web 应用！\n\n## 第 11 章自测\n\n![Images](img/tick.jpg)\n\
