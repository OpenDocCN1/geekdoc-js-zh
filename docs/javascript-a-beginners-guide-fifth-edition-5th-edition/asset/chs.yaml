  \ `detail` 来传递额外信息。使用其他标识符将不起作用，如下代码所示：\n\n![Images](img/f0286-02.jpg)\n\n### 关键技能与概念\n\
  \n- 介绍 Node.js\n- 使用 Node.js\n- 创建 Web 服务器\n- 简单数据库\n\n## 介绍 Node.js\n\nNode.js\
  \ 最初的创建是为了允许实时应用程序——这意味着服务器可以向客户端发送信息，而无需客户端请求。这种双向通信允许实时共享数据，这使得 Node.js 非常适用于聊天、协作甚至甚至是游戏。\n\
  \n虽然 Node.js 使用 Socket.io 处理实时应用程序非常出色，但它也可以用于创建标准应用程序。它的非阻塞 I/O 对于实时和标准应用都是很好的。在本章中，你将看到使用\
  \ Node.js 的基础，包括创建一个基础 Web 服务器。\n\n***注意***\n\n尽管本书提供了 Node.js 的入门知识，但它不会涉及成为专家所需的细节。\n\
  \n### 问专家\n\n**问:** 你提到了用于实时应用程序的 Socket.io。它是什么？\n\n**答:** Socket.io 是一个实时引擎，允许你在服务器与一个或多个客户端之间进行通信。消息可以实时从客户端传递到服务器，或从服务器传递到客户端，这使得某些应用程序非常有用。关于\
  \ Socket.io 的更多信息可以在 [`socket.io/`](https://socket.io/) 找到。\n\n**问:** 我不计划在服务器端进行编程。我为什么要学习\
  \ Node.js？\n\n**答:** 在这种情况下，你并不绝对需要学习 Node.js，但理解书中涵盖的基础知识可能对你很有帮助。在前端编程中，你经常会从某种服务器端实现请求数据。如果那确实是\
  \ Node.js，那么你将了解在请求另一端发生了什么。如果不是，通过学习一些 Node.js，你仍然了解服务器是如何响应客户端的。\n\n\n\n\n\n答：当然可以！Node.js\
  \ 并不是你唯一的选择。根据你的需求和资源，运行不同类型的 Web 服务器或使用不同的服务器端语言可能会更有利。如果你想查看可选的各种开发栈，可以在这里找到更多信息：[`da-14.com/blog/how-to-choose-technology-stack-application-development`](https://da-14.com/blog/how-to-choose-technology-stack-application-development)。\n\
  \n### 安装 Node.js\n\n由于 Node.js 运行在自己的环境中（而不是 Web 浏览器中），因此需要安装它，以便你能够使用它来创建脚本或应用程序。首先，你需要确认是否已经安装了\
  \ Node.js。如果没有安装，或者你想更新 Node.js 版本，可以为你的系统安装最新版本的 Node.js。\n\n## 检查当前安装情况\n\n要查看系统是否已经全局安装了\
  \ Node.js，你可以在系统上打开命令行提示符并输入命令。打开命令行提示符在每个操作系统上略有不同。以下是针对 Windows、Mac 和 Linux 的一些提示。\n\
  \n### Windows 命令行提示符\n\n在较新版本的 Windows 中，你只需在搜索栏中输入 `cmd` 并在显示时点击“命令提示符”即可。\n\n\
  在旧版本中，可以使用这些选项：\n\n• 点击 开始 | 所有程序 | 附件程序 | 打开 命令提示符。\n• 点击 开始 | 运行，输入 `cmd` 并点击\
  \ 确定。\n\n### Mac 命令行提示符\n\n对于 macOS，点击 dock 栏上的 Finder 图标并点击收藏列表中的“应用程序”。找到“实用工具”文件夹并点击打开。找到“终端（Terminal）”图标并双击打开终端程序。或者，按下\
  \ COMMAND-空格键键启动 Spotlight 搜索，然后输入 `Terminal`。双击终端搜索结果以打开终端程序。\n\n### Linux 命令行提示符\n\
  \n终端可能有不同的名称，取决于你使用的 Linux 发行版。例如，以下链接提供了不同类型的 Ubuntu 桌面的一些提示：[`help.ubuntu.com/community/UsingTheTerminal?action=show&redirect=BasicCommands`](https://help.ubuntu.com/community/UsingTheTerminal?action=show&redirect=BasicCommands)。\n\
  \n### 运行命令\n\n一旦在系统上打开了命令行提示符，输入以下命令然后按回车：\n\n```\nnode -v\n```\n\n如果已经安装了 Node.js，将显示已安装的\
  \ Node.js 版本。否则，将显示错误消息，指示你的系统上 `node` 不是可识别的命令。\n\n### 安装 Node.js\n\n如果你没有安装 Node.js\
  \ 或想更新版本，你需要在系统中安装 Node.js。\n\n如果你想通过运行文件（默认方式）安装 Node.js，请访问 [`nodejs.org/en/download/`](https://nodejs.org/en/download/)。将显示各种操作系统的选项，如图\
  \ 11-1 所示。\n\n![Images](img/F11-01.jpg)\n\n**图 11-1** Node.js 下载页面\n\n下载适用于你系统的安装程序并按照提示在系统上安装\
  \ Node.js。安装程序应该会为你完成安装 Node.js 的工作，一旦完成，你就可以尝试使用 Node.js 了！\n\n或者，你可能希望使用包管理器在系统上安装\
  \ Node.js。你可以在这里找到如何操作的说明：[`nodejs.org/en/download/package-manager/`](https://nodejs.org/en/download/package-manager/)。\n\
  \n### 编写“Hello World”脚本\n\n现在你已经安装了 Node.js，可以编写一个简单的“Hello World”脚本，然后从命令行运行它。首先，在你的机器上创建一个文件夹（或使用已有的文件夹）来保存你的项目文件。该文件夹将用于创建书中的示例和项目。\n\
  \n创建一个新的 JavaScript 文件，并在其中放入以下行代码：\n\n```\nconsole.log(\"Hello there!\");\n```\n\
  \n将此文件保存为 `hello-world.js` 并放在你的项目文件夹中。要查看脚本运行效果，你需要在项目文件夹中打开命令行提示符（如本章之前所述）。\n\n\
  在命令行提示符中，输入以下命令：\n\n```\nnode hello-world.js\n```\n\n按回车，你将看到结果。文本“Hello there!”将被写入命令窗口（控制台），然后你会被带回命令行提示符。图\
  \ 11-2 显示了脚本完成后命令行窗口的样貌。\n\n![Images](img/F11-02.jpg)\n\n**图 11-2** 运行 Hello World\
  \ 脚本的结果\n\n如你所见，`console.log` 命令简单地向控制台记录一条消息。这与你在之前的章节中使用 `document.write` 所的操作非常相似，你只需将一个字符串值传递给\
  \ `console.log` 命令，以便将该字符串值打印到控制台上。\n\n***注意***\n\n在编写基于浏览器的（前端）JavaScript 时，也可以使用\
  \ `console.log` 和其他控制台命令。你将在第 13 章中看到更多关于如何在浏览器中使用这些命令的知识。\n\n虽然默认的 `console.log`\
  \ 命令对于某些快速日志很有用，但你可以使用 Node 模块添加不同的级别。\n\n### 专家问答\n\n**问：我无法安装 Node.js。我该怎么办？**\n\
  \n答：如果你从官方网站安装 Node.js 遇到困难，你可能需要适用于你系统的教程。查看最新的教程：\n\n• Windows：[`nodejssource.com/blog/tutorial-windows/`](https://nodejssource.com/blog/tutorial-windows/)\n\
  • Mac：[`nodejssource.com/blog/tutorial-mac-x/`](https://nodejssource.com/blog/tutorial-mac-x/)\n\
  • Linux：[`www.ostechnix.com/node-linux/`](https://www.ostechnix.com/node-linux/)\n\
  \n**问：我在 Windows 上安装了 Node.js，但在运行 Hello World 脚本时 Windows 仍然无法识别。我该怎么办？**\n\n答：在某些情况下，你可能需要检查\
  \ Node.js 是否设置了路径。这通常由安装程序为你完成，但如果没有，你可以手动将其添加到路径。有关将程序添加到路径的信息，请参阅[`helpdeskgeek.com/windows-10/add-windows-path-environment/`](https://helpdeskgeek.com/windows-10/add-windows-path-environment/)。\n\
  \n**问：我写的脚本是用于命令行。我们要设置 Web 服务器吗？**\n\n答：是的，在本章的晚些时候我们将设置 Web 服务器。在此期间，命令行脚本的一些操作对以后非常有帮助，我们将随着章节的进展深入了解这些内容。\n\
  \n## 使用 Node 模块\n\nNode 模块允许你扩展 Node.js 脚本的默认功能。某些 Node 模块不需要安装即可使用，而另一些则要求在使用前进行安装。\n\
  \n### 使用原生 Node 模块\n\n你可以通过在 JavaScript 文件中包含该模块来使用原生 Node 模块。一个常用的原生模块是文件系统模块（`fs`）。你可以通过引入模块并将结果赋值给一个变量（通常变量名与模块名匹配）。例如，以下是如何在\
  \ Hello World 脚本中包含 `fs` 模块：\n\n![Images](img/f0295-01.jpg)\n\n\n\n\n\n这需要 `fs`\
  \ 模块，但并没有使用它。与你之前使用过的命令类似，`fs` 具有某些可以调用的方法。例如，`fs` 的 `mkdir` 方法允许你在本地机器上创建（建立）一个目录（文件夹）。这是你可以用于处理文件和文件夹的许多方法之一。以下代码展示了引入\
  \ `fs` 模块以及将 `fs.mkdir` 作为示例的使用。将此文件保存为项目文件夹中的 `create-folder.js`。\n\n![Images](img/f0296-01.jpg)\n\
  \n注意，代码开头是引入 `fs` 模块的引入。如果没有这一行，下一行将抛出错误，指示 `fs` 未定义定义。在第二行中，调用了 `fs.mkdir` 方法。\n\
  \n`fs.mkdir` 方法接受两个参数。第一个参数是你想要创建的文件夹名称（在本例中为 `test-folder`）。默认情况下，该文件夹将在你的 node\
  \ 脚本所在的相同文件夹中创建（在本例中，在你的项目文件夹内）。你可以使用绝对路径、相对路径或 `path` 模块提供的可用方法来更改此路径（你将在本章稍后部分看到更多关于\
  \ `path` 模块的内容）。\n\n第二个参数是一个函数，它将在文件夹创建完成后执行。在这里，使用了 if-else 语句，如果在创建文件夹时出错将抛出错误。否则，控制台将打印“Directory\
  \ was created!”消息。\n\n要运行此代码，请在项目文件夹中打开控制台并输入以下命令：\n\n```\nnode create-folder.js\n\
  ```\n\n运行后，你应该能够在项目文件夹中找到新文件夹（`test-folder`）！注意，为了使此操作生效，你需要对处理的任何文件夹拥有适当权限，因此请确保你在系统上的项目文件夹具有写入权限。\n\
  \n如你所见，只需引入原生模块并找到可用的方法，就可以很快地使用它。\n\n### 异步执行\n\n你可能已经注意到了对上一个示例工作原理的描述：\n\n“第二个参数是一个函数，它将在文件夹创建完成后执行。”\n\
  \nNode.js 默认几乎所有操作都是异步执行的，这意味着在等待操作完成时，你的代码可以继续执行。通过回到上一个示例，你可以进行修改来展示其工作原理。考虑以下代码：\n\
  \n![Images](img/f0297-01.jpg)\n\n将此文件保存为 `test-node-async.js` 并在控制台窗口通过 `node test-node-async.js`\
  \ 运行。除非你的操作系统极其快速，否则结果应该如下：\n\n```\nThis can display before\nDirectory was created!\n\
  ```\n\n注意，消息确实在文件夹创建之前显示了。\n\n**注意**\n\n如果项目文件夹中已存在 `test-folder`（如果你运行了上一个示例），在运行脚本时将会报错。你可以在运行示例之前删除\
  \ `test-folder`，或者更改脚本中创建的文件夹名称来避免错误（对于 `fs.mkdir`）。\n\n在 Node.js 中，默认行为是允许在执行可能耗时的操作的同时运行其他代码。这通常被称为**非阻塞**（nonblocking），意味着在等待操作完成时，代码可以继续执行。当操作完成时，通常有一个函数（在这种情况下可以被称为**回调**函数，callback）会执行。\n\
  \n或者，操作的完成可能会触发一个**事件**（event），你可以对该事件做出响应（在此过程中你会看到这些示例）。在上一个示例中，`fs.mkdir` 方法接受回调函数作为第二个参数，该函数在文件夹创建完成后执行。\n\
  \n应该注意的是，Node.js 提供了大多数函数的同步版本，尽管通常它们不是最佳实践。例如，你可以修改 `test-node-async.js` 文件使用同步版本的\
  \ `fs.mkdir`：\n\n```\nconst fs = require(\"fs\");\nfs.mkdirSync(\"test-folder\"\
  );\nconsole.log(\"This displays after folder created!\");\n```\n\n再次运行脚本（记得删除 `test-folder`\
  \ 或在脚本中使用不同的文件夹名称），在文件夹创建之前，`fs.mkdirSync` 之后的代码不会运行。使用模块的同步版本会让代码以同步方式运行，但再次强调这不是最佳实践，因为异步代码不会阻塞代码的运行。这对用户来说几乎总是好事，因为他们可以在异步函数等待操作完成时继续与程序交互。同步代码将强制用户等待，这通常不受用户欢迎！但请记住，对于异步代码，你无法假设操作何时完成，必须将任何逻辑放在回调方法内部。\n\
  \n### 非原生模块\n\n要在 Node.js 脚本包含非原生模块，你有两个选择：你可以从 `npm`（包管理器）库中引入预写的模块，也可以编写自己的模块并引入它们。如果\
  \ `npm` 中有你需要的包，你可以在项目中安装并使用该包。如果没有，或者你只想编写自己的模块代码，你可以这样做并在脚本中引入该模块。\n\n### 包管理器\n\
  \n如果你想查找并使用已作为包提供的模块，可以在 [www.npmjs.com](http://www.npmjs.com) 查看 npm 库。在搜索栏中，你可以通过名称搜索包并查看它们的详细信息。在这里，你只需安装\
  \ `Express` 包，它允许你使用 Node.js 快速创建 Web 服务器。\n\n默认情况下，Node.js 带有一个 `npm` 副本，但这个副本可能不是最新的\
  \ npm 版本。你可能希望在使用之前更新 `npm`。请进入控制窗口并输入以下内容：\n\n```\nnpm install npm@latest -g\n\
  ```\n\n这将为你更新 `npm` 到最新版本。\n\n**注意**\n\n某些 Windows 版本可能无法通过此命令完全更新 `npm`，因为所选的控制窗口可能尚未找到新版本。如果你的系统没有，你可以使用\
  \ [www.npmjs.com/package/npm-windows-upgrade](http://www.npmjs.com/package/npm-windows-upgrade)\
  \ 上的 `npm-windows-upgrade` 工具。\n\n完成后，你可以使用 `npm` 将包安装到项目目录。例如，在项目文件夹中打开命令窗口并运行以下命令：\n\
  \n```\nnpm install express\n```\n\n这将在项目文件夹内安装 `Express` 包。如果你的项目文件夹中还没有 `node_modules`\
  \ 文件夹，它将被创建，且 `Express` 包将位于该文件夹中。`node_modules` 文件夹中的任何模块都可以在无需指定路径的情况下引入（你将看到）。\n\
  \n**注意**\n\n如果 `npm install` 产生权限错误，你可能需要以管理员身份运行命令窗口（Windows）或使用 `sudo`（Linux）来获得正确的权限。\n\
  \n一旦安装了模块，使用它的过程与使用原生模块相同。引入模块然后在脚本中使用它。\n\n\n\n\n你应该能看到控制台打印出的消息。在本章的后续部分，你将学习更多关于如何使用\
  \ Express 以及为应用程序创建一个 Web 服务器。\n\n### 自定义模块\n\n自定义模块与你之前在浏览器端 JavaScript 中使用的外部脚本文件类似，但提供了更多选项。要创建一个自定义模块，你只需将代码写入单独的\
  \ JavaScript 文件中，确保它导出了所需的项，然后像引入其他类型的模块一样在你的主脚本中使用 `require` 它。\n\n例如，将以下代码保存为项目文件夹中的\
  \ `calculate-sum.js`：\n\n![Images](img/f0299-02.jpg)\n\n注意，该文件仅包含一个可以调用以计算两个值之和的函数。该函数可以进行改进，以检查两个值是否都已发送、是否为数字，并提供错误信息，但对于这个简单的示例，这已经足够了。\n\
  \n接下来，将以下代码保存为 `get-monthly-income.js`：\n\n![Images](img/f0299-03.jpg)\n\n注意，一旦加载了自定义模块，一切的工作方式与使用原生模块非常相似。然而，在你编写自己的模块时，有一点需要记住：你需要导出你希望在主脚本使用的值或函数。前面的代码将会失败，因为它将找不到\
  \ `sum.calculateSum` 函数。\n\n要修复此，回到你的 `calculate-sum.js` 文件并将其更新为以下代码：\n\n![Images](img/f0300-01.jpg)\n\
  \n回到你的控制台窗口并运行 `get-monthly-income.js` 脚本。它现在应该会在控制台中显示消息“My monthly income is 3200”。注意添加了\
  \ `module.exports` 值。它被赋值了一个包含一个键和一个值的对象。第一个 `calculateSum` 是键，而第二个是该键的值。这意味着在这里，主脚本可以使用键\
  \ `calculateSum` 来运行模块内部的 `calculateSum` 函数。如果你想在模块外部使用不同的名称来调用函数，可以更改键的值。例如，查看以下代码：\n\
  \n![Images](img/f0300-02.jpg)\n\n这一次，`calculateSum` 仅供使用 `getSum` 的主脚本（或其他脚本）访问。对于你的示例脚本，使用\
  \ `sum.getSum` 现在将可以运行，但 `sum.calculateSum` 将不行。\n\n注意，如果你愿意，也可以通过替换代码中的 `module.exports`\
  \ 部分更直接地导出函数：\n\n![Images](img/f0300-03.jpg)\n\n根据你的情况或组织使用适合你的方法。通过这种方式，你现在可以在\
  \ Node.js 脚本中使用自定义模块了！\n\n### 尝试此练习 11-1 使用自定义模块\n\n`pr11_1.js`\n\n`pr11_1_module.js`\n\
  \n此项目将让你练习在 Node 脚本中使用自定义模块。你将创建一个脚本，引入你的自定义模块，并在主脚本中使用该模块。\n\n#### 逐步步骤\n\n1. 创建一个包含以下代码的\
  \ JavaScript 文件并将其保存为 `pr11_1.js`：\n\n![Images](img/f0301-01.jpg)\n\n2. 创建包含以下代码的第二个\
  \ JavaScript 文件并将其保存为 `pr11_1_module.js`：\n\n![Images](img/f0301-02.jpg)\n\n3. 在命令行窗口中，输入\
  \ `node pr11_1.js`。\n\n4. 结果应该是一条消息，显示你的银行账户只剩下 $1：\n\n```\nMy bank account has\
  \ $1 left!\n```\n\n5. 在主脚本中尝试不同的数字并从命令行重新运行脚本。消息应该发生相应的变化。\n\n#### 尝试此练习总结\n\n在这个项目中，你创建了一个\
  \ Node 脚本和一个自定义的 Node 模块。从主脚本中，你能够引入该自定义模块并使用它的 `getBalance` 函数来确定支付账单后银行账户中剩余的金额。第一次迭代让你只剩下\
  \ $1，但随后你可以根据自己的需要更改这些值，并重用该模块根据你提供的新值计算余额！\n\n## 安装数据库\n\n数据库允许你以结构化的方式存储数据，以便以后可以轻松访问。虽然你可以将数据存储在文本文件中，但这些文件最终会变得太大，以至于从中获取特定信息不再是快速方便的任务。此外，如果你存储的是任何稍微敏感的数据，你可能不希望它呆在文本文件中，一旦遭到攻破，外部来源可以轻易读取。\n\
  \n在 Node.js 中使用数据库通常只需要使用允许你编写 JavaScript 代码来查询数据库并获取结果的模块。但在执行此操作之前，你需要安装一个数据库。就本书而言，你只需要在计算机上安装一个数据库。如果你为网站或\
  \ Web 应用程序使用数据库，你需要将数据库安装在你的 网站/应用程序可以访问的服务器上（如果你位于托管 Web 环境中，几乎每个 Web 主机都提供某种数据库选项）。为了开始，你只需要在计算机上安装一个数据库并在本地使用，并熟悉从\
  \ Node.js 对其进行查询。\n\n### 数据库选项\n\n有很多数据库可以选择。从 `MySQL`、`MongoDB`、`PostgreSQL`、`Oracle`\
  \ 以及许多其他中，你有大量的选择。你最终使用什么取决于你的情况，甚至因项目而异。\n\n就本书而言，将使用 `PostgreSQL`。如果你选择 SQL 数据库之一，查询将非常相似，甚至相同。\n\
  \n如果你使用像 `MongoDB` 这样的 NoSQL 数据库，情况会有不同，但如果你有相关经验，仍然可以操作。\n\n#### 安装 PostgreSQL\n\
  \n要安装 PostgreSQL，请访问 [www.enterprisedb.com/downloads/postgresql-downloads](https://www.enterprisedb.com/downloads/postgresql-downloads)。在这里，你需要根据操作系统遵循下载和安装说明。对于\
  \ Windows 等操作系统，将下载一个安装程序，并按照屏幕提示操作。记住你在提示时输入的密码。请务必保存它，因为你需要它来访问 pgAdmin 工具，该工具允许你创建用户、数据库、表等。\n\
  \n如果你在安装过程中需要帮助，这里是一些可以更详细指导你完成安装的教程：\n\n- **Windows**: [www.guru99.com/download-install-postgresql.html](https://www.guru99.com/download-install-postgresql.html)\n\
  - **Mac**: [www.wierich.de/postgres-sql-setup/](https://www.wierich.de/postgres-sql-setup/)\n\
  - **Linux**: （链接无效）\n\n一旦 PostgreSQL 安装完成且你有了主用户（superuser）密码，你就可以开始使用数据库服务器来创建用户、数据库、表等了。\n\
  \n#### 使用 pgAdmin 创建数据库\n\n安装过程应该已经了 pgAdmin 工具。打开此工具，转到左侧面板并展开 Servers 节点。这将显示\
  \ `PostgreSQL X.X` 节点（其中 X.X 是为你安装的 PostgreSQL 版本）。点击展开此节点，系统将提示你输入安装期间创建的主用户密码。输入密码并按回车键。\n\
  \n\n\n\n![Images](img/F11-03.jpg)\n\n**图 11-3** pgAdmin 提示输入密码\n\n成功输入密码后，左侧面板中将出现更多可用节点，如图\
  \ 11-4\n\n**图 11-4** 登录后可用的额外节点\n\n从这里开始，右键点击`Databases`（数据库）节点，选择`Create`（创建）并点击`Database`（数据库）。这将显示图\
  \ 11-5\n\n**图 11-5** 创建新数据库的提示\n\n输入数据库名称（将其命名为 `mywebapp`），点击窗口底部的`Save`（保存）按钮，然后关闭窗口。你就创建了一个可以使用的数据库！\n\
  \n### 创建表\n\n一旦准备好数据库，你可能想向其中放入一些数据。对于你将创建的简单 Web 应用程序，这只需在 pgAdmin 内部使用 SQL 查询即可完成。\n\
  \n首先，在左侧面板中选择你的数据库（`mywebapp`）。接下来，进入顶部菜单，选择`Tools`（工具），然后选择`Query Tool`（查询工具）。右侧将显示一个新的查询标签页。图\
  \ 11-6 显示了如何在 pgAdmin 4 中选择`Query Tool`。\n\n![Images](img/F11-06.jpg)\n\n**图 11-6**\
  \ 选择 pgAdmin 工具\n\n`create table`（创建表）命令允许你创建一个表并为其指定特定数据类型的列。这些数据类型与 JavaScript\
  \ 中使用的类型不同，而是 PostgreSQL 数据类型。你会发现姓和名的类型为 `varchar`，它代表可变长度字符（character varying）。括号中的数字指的是该列中任何数据的最大长度。对于姓和名，最大长度为\
  \ 20 个字符。其余的列使用 `smallint` 和 `text` 数据类型（`smallint` 包括从 –32768 到 32767 的整数，而 `text`\
  \ 类似于 `varchar` 但没有长度限制）。\n\n`insert` 命令允许你向表中插入数据。在这种情况下，你通过列出列名（第一组括号）和要放入相应列的值（第二组括号）插入了多个值。注意，字符数据包含在单引号内，而数值数据不需要引号。\n\
  \n接下来，你需要输入一个创建一个新表的查询。你将使用的查询将同时创建一个新表并向表中添加了一行数据。在查询窗格中，输入图 11-7 所示的查询，然后按 `F5`\
  \ 键（或点击顶部的闪电按钮）。这将为你创建该表并带有一些初始数据。\n\n![Images](img/F11-07.jpg)\n\n**图 11-7** 创建表并向其插入插入信息的查询\n\
  \n为了确保表和数据存在，你可以再次使用`Query Tool`打开另一个查询标签页，然后输入以下查询：\n\n```\nSELECT * FROM bowlers;\n\
  ```\n\n图 11-8 显示了该查询在 pgAdmin 底部窗格中的结果。\n\n![Images](img/F11-08.jpg)\n\n**图 11-8**\
  \ 从表中选择所有数据时的查询结果\n\nSQL 中的 `select` 语句表示你想从数据库中进行数据选择。在这种情况下，你使用星号（`*`）请求从 `bowlers`\
  \ 表中选择所有列。现在你不仅有了一个数据库，还有了你可以使用的数据！\n\n### 添加查询用户\n\n虽然从超级用户（superuser）账户查询数据库对于管理以及创建数据库、表、用户等非常方便，但让你的\
  \ Web 应用程序使用超级用户查询你的数据库并不是一个好主意。由于超级用户还可以删除任何内容，你应用程序中的任何一个错误代码，或者一个恶意用户能够在你的数据库上运行查询，都可能导致巨大的数据丢失，甚至是完全的安全漏洞。出于这些原因，最好是为你的\
  \ Web 应用程序创建一个单独的用户，并仅授予该用户使用 Web 应用程序所需的最小权限。\n\n对于你将创建的 Web 应用程序，新用户只需要能够从你的 `mywebapp`\
  \ 数据库中选择数据。你首先需要创建用户，然后使用数据库上的`Grant Wizard`（授权向导）授予适当权限。\n\n要创建新用户，进入 pgAdmin 左侧面板并右键点击`Login/Group\
  \ Roles`（登录/组角色）节点。选择`Create | Login/Group Role`。将显示一个需要用户名的提示。情况下，输入用户名 `mywebappuser`。如图\
  \ 11-9 所示。接下来，进入`Definitions`（定义）标签页并为此新用户输入密码。之后点击`Privileges`（权限）标签页，使用图 11-10\
  \ 所示的值，然后点击窗口底部的`Save`（保存）按钮。\n\n![Images](img/F11-09.jpg)\n\n**图 11-9** 给用户命名\n\
  \n![Images](img/F11-10.jpg)\n\n**图 11-10** 设置权限\n\n对于你的 Web 应用程序，新用户只需要能够从你的 `mywebapp`\
  \ 数据库中选择数据。你首先需要创建用户，然后使用数据库上的`Grant Wizard`授予适当权限。\n\n![Images](img/F11-11.jpg)\n\
