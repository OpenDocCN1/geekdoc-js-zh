  \ V-6 作为引擎参数发送给构造函数，`engine_type` 变量被赋值为 V-6。\n\n##### 整合部分\n\n为了帮助你可视化这一过程，现在是时候将所有部分整合在一起，让你看到它是如何工作的。以下代码结合了之前所有示例的代码，以便更容易理解：\n\
