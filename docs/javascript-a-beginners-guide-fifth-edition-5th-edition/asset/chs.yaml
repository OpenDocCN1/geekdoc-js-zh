  \n现在你已经拥有了这两个这两个元素的变量。\n\n如果你想通过 JavaScript 修改在 CSS 代码中设置的样式，你需要利用每个元素节点中包含的 `style`\
  \ 属性。然后，JavaScript 使用与 CSS 选择器相同的名称来访问该特定属性。例如，如果你想将 `div1` 元素中的文字颜色改为浅灰色，将使用以下代码：\n\
  \n![Images](img/f0248-02.jpg)\n\n在 CSS 代码中，选择器 `color` 用于更改元素的字体颜色。在 JavaScript\
  \ 中，在访问元素的 `style` 属性后，它也是用于更改颜色的属性名称。\n\n如果 CSS 选择器不是单个单词怎么办？例如，如果你在 JavaScript\
  \ 中像在 CSS 代码中直接使用 `background-color` 选择器，它将无法工作。以下代码尝试将背景颜色改为绿色：\n\n![Images](img/f0248-03.jpg)\n\
  \n这将不起作用，因为 JavaScript 不允许在属性名中使用连字符（`-`）。相反，JavaScript 会将两个单词组合在一起，并将从第一个单词之后的任何后续单词的首字母大写。因此，CSS\
  \ 选择器 `background-color` 在 JavaScript 中变成了 `backgroundColor`。其他选择器也遵循相同的模式（例如，`border-right-color`\
  \ 将变为 `borderRightColor`）。这种风格被称为驼峰命名法（camel case），是 JavaScript 中非常常见的一种风格。\n\n\
  可以将 JavaScript 代码重写如下以使更改生效：\n\n![Images](img/f0248-04.jpg)\n\n\n\n\n\n如你所见，这是动态更改网页内容的一种方便方法。`innerHTML`\
