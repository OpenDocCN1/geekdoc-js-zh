  **15.** 在 JavaScript 中，__________ 起作用（重复）\n\n## 第 6 章：条件语句与循环\n\n### 关键技能\n\n- 定义条件语句\n\
  - 使用循环\n- 定义循环\n\n### 使用条件语句\n\n现在你已经知道了什么是条件语句，是时候详细查看它们并学习如何编写它们了。你将看到 JavaScript\
  \ 中使用的两种条件语句块：if/else 语句和 switch 语句。你还将学习条件运算符。\n\n#### 使用 if/else 语句\n\n\n\n\n\
  在使用条件语句时，你会发现它们具有熟悉的语法。最显著的特征是大括号 ({})，它们包围了根据给定条件执行的代码段。\n\n### if/else 语句块结构\n\
  \n在 if/else 语句中，你必须处理的第一是第一行，它告诉浏览器继续或移动。你使用 JavaScript 关键字 `if` 开始一个 if/else 语句，后面跟着括号中的比较。。接的一行显示了\
  \ `if` 语句的格式示例：\n\n![Images](img/f0127-01.jpg)\n\n你将 `comparison here` 替换为实际的比较。要做到这一点，你需要记住上一个章节中的比较操作符。假设你想检查名为\
  \ `boats` 的变量是否等于 `3`，如果条件为真，则发送一个显示“Yes, there are 3 boats”的警报。你可以使用以下代码：\n\n![Images](img/f0128-01.jpg)\n\
  \n记住，比较会返回 `true` 或 `false` 值。这正是返回值变得有用的地方。如果 `boats === 3` 的比较返回 `true`，则执行大括号内的代码。如果返回\
  \ `false`，则括号内的代码被忽略，并执行闭合括号之后的代码行。\n\n如果你希望使用 `else` 块在比较返回 `false` 时执行另一组语句，你可以将\
  \ `else` 关键字放在下一行，然后紧跟它自己的组大括号，如下代码所示：\n\n![Images](img/f0128-02.jpg)\n\n如果变量 `boats`\
  \ 等于 `3`，这段代码将发送一个显示“You have the right number of boats”的警报。如果不是，它将发送一个显示“You do\
  \ not have the right number of boats”的警报。\n\n现在你已经设置好了语句，你需要知道比较是否返回 `true`，以便确定执行的是哪个代码块。要做到这一点，你需要在比较发生之前声明\
  \ `boats` 变量并为其赋值一个值。这将为你提供决定脚本中发生什么的值。看看如果你使用以下代码，能否猜出哪个代码块（第一个还是第二个）会被执行：\n\n\
  ![Images](img/f0128-03.jpg)\n\n如果你猜到是执行第一个代码块，那么你对了！由于变量 `boats` 等于 `3`，比较 `boats\
  \ === 3` 返回 `true`。由于返回了 `true`，第一个代码块被执行，`else` 关键字之后的代码块被忽略。你会得到显示“You have the\
  \ right number of boats”的警报，外再无其他内容。\n\n**注意**\n\n在输入变量赋值 (`=`)、等值比较 (`==`) 和严格相等比较\
  \ (`===`) 时要小心，因为它们很容易因不小心写错，并导致你的脚本出现问题或产生意想不到的结果。\n\n现在来看一眼如何设置语句以获得相反的结果。以下代码将导致比较返回\
  \ `false`：\n\n![Images](img/f0129-01.jpg)\n\n当变量 `boats` 的值为 `0` 时，比较 `boats ===\
  \ 3` 将返回 `false`；因此，第一个代码块被忽略，相反而执行 `else` 语句之后的代码块。这次你收到了显示“You do not have the\
  \ right number of boats”的警报，而第一个块中的警报被忽略了。\n\n现在你已经了解了 if/else 语句块的基本结构，就可以准备查看将一个块嵌套在另一个块中的技术了。\n\
  \n注意，JavaScript 会忽略未引号的空白。例如，你可以写以下代码：\n\n```\nif (boats === 3) {window.alert(\"\
  You have the right number of boats\");}\nelse {window.alert(\"You do not have the\
  \ right number of boats\");}\n```\n\n虽然你会遇到像这样编写的代码，但不建议这样做，因为你希望代码对于未来可能维护它的代码人员（包括未来的你！）是易读的。\n\
  \n### 块嵌套\n\n如果你*嵌套某些内容*，你基本上是将一个结构放在另一个相同或相似性质的结构内部。通过 if/else 语句块，你可以在比较之后的第一个块（“if\
  \ 块”）内或 `else` 关键字之后的第二个块（“else 块”）内嵌套其他的 if/else 语句。\n\n例如，你可能希望浏览器执行如下的语句：“如果名为\
  \ `havecookbook` 的变量等于 `yes`，且名为 `meatloafrecipe` 的变量等于 `yes`，向浏览器发送一个显示‘Recipe\
  \ found’的警报。如果 `havecookbook` 等于 `yes`，但 `meatloafrecipe` 不等于 `yes`，则向查看者发送‘Have\
  \ the book but no recipe’的警报；否则，向浏览器发送一个显示‘You need a cookbook’的警报。”\n\n这是一个相当长且复杂的语句，但你可以通过在一个\
  \ if/else 语句的 if 块中嵌套另一个 if/else 语句来实现你的目标。\n\n要查看其原理，请考虑以下示例，它将前面的语句转换为 JavaScript\
  \ 形式：\n\n![Images](img/f0130-01.jpg)\n\n噢不，嵌套 if 块需要到处都是大括号！为了帮助你理解这段代码发生了什么，我将把它分解为各个部分。\n\
  \n你首先得到的是主（第一个，或最外层的）if 块。你用它来判断变量 `havecookbook` 是否等于 `yes`。如果此比较返回 `true`，你就进入\
  \ if 块；然而，你发现的下一个是 if 块！这就是嵌套 if 块，位于外部 块内部。在嵌套块中，你检查 `meatloafrecipe` 是否等于 `yes`。如果这返回\
  \ `true`，你终于可以做些事情，即发送“Recipe found”警报。\n\n当嵌套块完成后，你会看到它有一个 `else` 块与之对应，以防 `meatloafrecipe\
  \ === yes` 返回 `false`。如果它返回 `false`，浏览器将进入这个 else 块。在前面的代码示例中，外部块的比较 (`havecookbook\
  \ === yes`) 返回 `true`，但嵌套块的比较返回 `false`。因此，执行了 else 块，发送“Have the book but no recipe”警报。\n\
  \n在这个 else 块之后，你看到一个看起来像额外的闭括号；然而，这个闭括号实际上用于关闭外部 if 块。观察代码的缩进将帮助你哪些括号关闭了哪些块。这就是缩进或制表符在你的代码中有帮助的地方，因为与代码全部垂直排列相比——缩进可以让代码更易读。\n\
  \n**提示**\n\n关于代码的缩进，有些人建议使用四个空格，有些人建议两个空格，另一些人建议使用 TAB 键。最重要的是选择一种缩进方法并在代码中始终使用。这对于你以后需要阅读或调试脚本非常有帮助。关于编程中空格与制表符的更多信息，请参考页面：[en.wikipedia.org/wiki/Indent_style](http://en.wikipedia.org/wiki/Indent_style)。\n\
  \n最后，你得到了外部 else 块。这是只有在第一个比较 (`havecookbook === yes`) 返回 `false` 时才会执行的块。如果该比较返回\
  \ `false`，外部块内的所有代码都被忽略（你永远进入嵌套的 if/else 块），浏览器将移动到这个外部 else 块。在这种情况下，你向查看者发送“You\
  \ need a cookbook”警报。\n\n以下示例使用了与前面示例相同的 if/else 代码，但这次变量的定义不同：两个变量都被赋值为 yes。看看你是否能跟随代码并说出在执行时会在屏幕上显示的警报名称。\n\
  \n![Images](img/f0131-01.jpg)\n\n\n\n你应该选择的警报是“Recipe found”（找到菜谱）。当第一个比较返回 `true`\
  \ 时，你将进入嵌套的 if 块。由于嵌套 if 块的比较也返回 `true`，你将执行该块中的代码，从而向浏览器发送“Recipe found”警报。\n\n\
  关于嵌套，你需要了解的最后一点是你可以在其他块内部嵌套任意数量的块。不仅仅是在另一个语句中嵌套一个 if/else 语句，你还可以在该语句中进行第二次嵌套、第三次，或者在你不崩溃的情况下能够追踪的任意次数。例如，考虑以下代码：\n\
  \n![Images](img/f0131-02.jpg)\n\n![Images](img/f0132-01.jpg)\n\n现在在一个 if 块中有一个 if\
  \ 块，而在 if 块中有一个 if/else 块。如你所见，添加了另一个变量 `ismomsmeatloaf` 来检查一个更具体的菜谱。你可以一直这样下去，直到你无法忍受；然而，这足以让你在以后需要时在此基础上进行构建。\n\
  \n另一点需要注意的是，如果你使用一个已经是布尔值（Boolean）的值作为比较，你只需要该值作为比较即可。这在下面的代码中显示：\n\n![Images](img/f0132-02.jpg)\n\
  \n虽然你可以直接写比较为 `if (havecookbook === true)`，但当你需要的值已经是布尔值时（如此处所示），你不需要那样做。相反，你可以使用快捷方式\
  \ `if (hascookbook)` 来稍微简化代码。\n\n### 复杂比较\n\n除了进行像 `x === 2` 或 `y < 3` 这样的简单比较外，你还可以使用第\
  \ 5 章中讨论的逻辑运算符来构建更复杂的比较。正如你可能记得的，该章节以类似于下面示例的形式展示了其中一些比较：\n\n`(2===2)||(3<5)``\n\
  \n在第 5 章中，唯一关注的问题是比较结果会返回 `true` 还是 `false`，而不是如何将其添加到 if/else 语句中。注意每个比较周围的括号。它们存在的主要是为了组织结构；但考虑到操作顺序，你可以将比较写为：\n\
  \n`2===2||3<5`\n\n这里的问题是这样写更难读，因此如果你以后需要调试代码，将很难判断代码是否存在问题。\n\n回想一下 if/else 语句的第一行使用括号来包围比较。如果你在编写复杂比较时不使用这些用于整理的括号（如上一个示例所示），你的第一行看起来就像这里显示的代码行一样：\n\
  \n`if (2===2||3<5)`\n\n虽然这很容易输入，但非常难读，因为你不确定它应该被读作“如果 2 等于 2 或者 3 小于 5”，还是读作“如果\
  \ (2 等于 2) 或者 (3 小于 5)”。你可以做的第一件事是添加空格，这有助于提高比较的可读性：\n\n`if (2 === 2 || 3 < 5)`\n\
  \n如果你为了组织而添加括号，它会变得更易读；但你必须小心地正确嵌套它们。下面的示例代码显示了为了组织而添加的括号：\n\n`if ( (2 === 2) ||\
  \ (3 < 5) )`\n\n使用哪种形式取决于个人喜好。目前，本章使用带有额外括号进行组织的方法。这应该能让你更容易阅读书中的代码。\n\n现在，你可以创建脚本，允许包含更多值，或者允许特定范围的值返回\
  \ `true`。假设你希望在名为 `num1` 的变量大于 2 但小于 11 时显示一个警报，当 `num1` 不在该范围内时显示另一个警报。你可以使用以下代码：\n\
  \n![Images](img/f0133-03.jpg)\n\n你的比较是在说：“如果 `num1` 大于 2 且 `num1` 小于 11”。如果该比较返回\
  \ `true`，那么你就会看到“Cool number”（酷的数字）警报。如果它返回 `false`，你将得到“Not a cool number”（不是酷的数字）警报。\n\
  \n当然，你可以让比较行变得随你想要复杂。你可以在一个长行中添加 `and` 和 `or` 逻辑运算符，直到你得到需要的……或者精神崩溃。下面的示例在比较中增加了一个额外条件，以检查\
  \ `num1` 是否等于 20：\n\n![Images](img/f0133-04.jpg)\n\n现在，比较允许大于 2 的数字、小于 11 的数字以及数字\
  \ 20 触发“Cool number”警报。比较现在的含义是：“如果 `num1` 大于 2 且 `num1` 小于 11 或者 `num1` 等于 20”。你可以继续添加信息来创建更多返回\
  \ `true` 的数字，甚至是额外的返回 `true` 的数字范围。\n\n当然，为了看到前面的代码运行，你需要声明 `num1` 变量并给它赋一个值。试看如果使用以下代码会显示哪个警报：\n\
  \n![Images](img/f0134-01.jpg)\n\n是的，你只能得到“Not a cool number”警报，因为数字 1 在这里并不行（1 不在接受的范围内）。\n\
  \n**警告**\n\n如果不正确分组，使用 `&&` 和 `||` 的复杂表达式会导致意想不到的结果。例如，`((u===v && w===x) || y===z)`\
  \ 与 `(u===v && (w===x || y===z))` 是不同的。\n\n### 大括号快捷方式\n\n如果一个 if 或 else 块内只执行一条语句，JavaScript\
  \ 允许在设置这些语句时省略大括号。例如，考虑以下代码：\n\n![Images](img/f0134-02.jpg)\n\n由于 if 和 else 块各包含一条语句，它们允许在不使用大括号的情况下编写，如下：\n\
  \n![Images](img/f0134-03.jpg)\n\n虽然在这种情况这可以缩短代码，但这种技术并不推荐，因为它会对执行了哪些代码产生困惑。为了向前兼容，保留大括号更好，因为这更容易向块添加语句。考虑这段代码：\n\
  \n![Images](img/f0135-01.jpg)\n\n根据代码格式，似乎“Ha Ha”警报应该在 `num1` 不等于 1 时显示。然而，无论条件真假，该警报都会显示。由于省略了括号，“Ha\
  \ Ha”警报并不是 else 块的一部分，而是紧随 if/else 语句后的第一个语句，总是执行。\n\n要修复这个问题，你只需添加大括号来明确代码应该做什么。下面的代码将按预期工作：\n\
  \n![Images](img/f0135-02.jpg)\n\n加上括号后，“Ha Ha”警报只会在 `num1` 不等于 1 时显示。\n\n\n\n\n\
  ![Images](img/f0136-01.jpg)\n\n在这里，`message` 的值在 `if` 块之外仍然可用，并且 `message` 将被显示（如果发送了另一个数字，它将是\
  \ `undefined`，因为 `if` 块会被跳过）。\n\n另一方面，使用 `let` 关键字将使得无论作为参数传递的值，在 `if` 语句之外的值都将是\
  \ `undefined`，即使条件的结果为 `true`。例如，看下面的代码：\n\n![Images](img/f0136-02.jpg)\n\n这一次，控制台将记录一个\
  \ `message` 未定义的定义的错误。由于 `let` 关键字将值限制在 `if` 语句的块作用域内，因此它在块之外没有定义。\n\n如果你需要将变量的使用限制在特定的块中，`let`\
  \ 的块作用域可能会很有用。在这种情况下，变量具有函数作用域更有用，因此你可以将声明移动到函数的顶部，使变量的作用域是函数块而不是仅仅是 `if` 语句，如下代码所示：\n\
  \n![Images](img/f0136-03.jpg)\n\n在这里，使用 `let` 关键字将 `message` 变量的作用域限制函数块。它还提供了一个默认值。如果发送的数字导致比较返回\
  \ `false`，则会在控制台中显示此默认的 `message`。如果比较返回 `true`，`message` 的值将变为“That is a lucky\
  \ number!”并在控制台中显示。\n\n注意，即使你想使用函数作用域，仍然最好使用 `let` 而不是 `var`。通过这样做，你知道 `let` 始终作用于包含它的块。如果你使用\
  \ `var`，它将只作用于函数作用域，即使它是在块内部使用的，如果你打算在任何地方使用函数作用域以外的块作用域，这可能会使代码不够清晰。\n\n## 使用 switch\
  \ 语句\n\n`switch` 语句允许你获取一个表达式，并根据 `case` 是否等于表达式的值执行不同的代码块。如果你想检查多个不同的值，这种方法比使用一组链式的\
  \ `if/else` 语句要简单得多。\n\n`switch` 语句的第一行具有以下语法：\n\n`switch (expression)`\n\n你可以将\
  \ `expression` 替换为值、变量或其他类型的表达式（例如，数值值的相加或字符串值的拼接）。对于第一个示例，你只需使用在 `switch` 语句开始之前已赋值的变量即可。\n\
  \n现在，你需要查看完整 `switch` 语句的通用语法。下面的代码是 `switch` 语句的示例：\n\n![Images](img/f0137-01.jpg)\n\
  \n首先，这个示例声明并赋值了一个名为 `thename` 的变量；它被赋值为 Fred。接下来，`switch` 语句开始，使用变量 `thename` 作为比较的基础。然后，用大括号打开块，后面是第一个\
  \ `case` 语句。这样写的意思是：“如果 `thename` 等于 George，则执行冒号后面的命令。”如果 `thename` 等于 George，你将得到一个警告。\n\
  \n接下来你看到 `break` 语句，它告诉浏览器退出代码块并移动到块之后的下一行代码。你在 `switch` 块中使用 `break` 语句是为了确保只有一个\
  \ `case` 部分被执行；否则，你将面临执行返回 `true` 的项之后的所有 `cases` 的风险，因为默认情况下，浏览器会继续执行到下一个语句（称为*贯穿*，fall\
  \ through），而不是完全退出块，即使它发现某个 `case` 为 `true`。为了确保浏览器退出块，你添加了 `break` 语句。\n\n如果你回到脚本，看到\
  \ `thename` 不等于 George，所以这个 `case` 被跳过了；然而，下一个比较返回了 `true`，因为脚本中 `thename` 等于 Fred。因此，此\
  \ `case` 块中的语句集将被执行。注意，在这里 `break` 语句之前出现了两行 JavaScript 代码。这说明你可以在 `case` 中编写任意数量的行。\n\
  \n最后，你看到 `default` 关键字。这用于没有任何 `case` 语句返回 `true` 的情况。如果发生这种情况，将执行 `default` 代码部分。注意，你不需要在\
  \ `default` 代码之后之后 `break` 语句，因为无论已经在 `switch` 块的末尾，所以浏览器之后会退出块，消除了对 `break` 语句的需要。\n\
  \n### 贯穿 (Falling Through)\n\n有时你想执行下一个 `case`。这被称为贯穿，它允许你继续进入下一个 `case` 语句。这种技术的一个用途是当多个\
  \ `cases` 适用于特定的代码段时。你可以允许这些 `cases` 贯穿，直到到达要执行的代码：\n\n![Images](img/f0138-01.jpg)\n\
  \n这允许所有 `name` 为“Fred”的变体情况都由放在最后一个 `case` 中的语句进行处理，而不是在每个 `case` 中通过 `break` 重复它们。在使用贯穿时，像示例代码所示，使用注释是一个很好的做法。\n\
  \n你仍然可以在贯穿之前在任何 `case` 上执行代码。下面的代码显示了此示例：\n\n![Images](img/f0138-02.jpg)\n\n这一次，如果\
  \ `name` 等于“Fred”，则会显示“Your name is Fred”警告。然后 `case` 将贯穿并同样显示“Any version of Fred\
  \ is a cool name”警告。如果 `name` 等于“Frederick”或“Freddie”，则只会显示“Any version of Fred\
  \ is a cool name”警告。\n\n### 使用表达式\n\n到此为止，你一直变量值作为 `switch` 语句第一行的 `expression`。JavaScript\
  \ 允许你使用任何类型的表达式，当你使用布尔值作为 `expression` 时，这非常有用。这样做允许你编写返回布尔值的条件，允许你一次测试多个值。例如，考虑以下代码：\n\
  \n![Images](img/f0139-01.jpg)\n\n通过使用布尔值 `true` 作为 `expression`，每个 `case` 就可以转成为一个条件。如果\
  \ `case` 条件返回 `true`，则匹配成功且该 `case` 将执行。在之前的代码中，第一个 `case` 将执行，因为条件 `num1 < 20`\
  \ 将返回 `true`，与初始表达式匹配。\n\n**注意**\n\n你可以使用 `if/else` 代替 `switch` 语句完成任何操作，但有时 `switch`\
  \ 更加方便且易于阅读。\n\n## 使用条件运算符\n\n条件运算符（也称为三元运算符）可以作为根据条件赋值的简便方法。例如，你可能决定想根据条件语句的结果为变量赋值值。你可以使用以下代码来实现：\n\
  \n![Images](img/f0139-02.jpg)\n\n这是有效的，并且由于 `mynum` 等于 1，给 `message` 赋了“You win!”。然而，条件运算符允许你缩短此类测试所需的代码量。它允许你在问号（`?`）之前放置条件，并在冒号（`:`）的每一侧放置可能的值，如下：\n\
  \n![Images](img/f0140-01.jpg)\n\nJavaScript 计算条件语句，如果语句返回 `true`，则冒号左侧的值（这里是 `value1`）被赋值给变量。如果语句返回\
  \ `false`，则冒号右侧的值（这里是 `value2`）被赋值给变量。你可以看到，这个运算符接受三个操作数（条件和两个值），这就是为什么也被称为三元运算符。\n\
  \n将此应用于我们之前的示例，我们可以将整段代码重写如下：\n\n![Images](img/f0140-02.jpg)\n\n\n\n\n这种工作方式与之前的\
  \ if/else 块相同，但它允许你通过更少的代码编写程序（减小脚本体积）。\n\n**注意**\n\n从技术上讲，条件运算符可以嵌套，但不建议这样做，因为嵌套的条件运算符会让代码迅速变得晦涩且难以调试。如果你需要更复杂的逻辑，通常使用\
  \ if/else 结构更好，这样可以更容易看到任何嵌套关系。\n\n在本章中你学习了条件语句，现在你掌握了如何使用它们，你的代码可以实现更多功能。在后面的章节中，你将大量使用这些语句来创建更复杂的脚本。\n\
  \n## 来自提示框的用户输入\n\n从观众获取输入的一种方法是使用 `window.prompt()` 方法。该方法接受两个参数：要显示的提示文本以及用于获取观众回复的文本框的默认值。例如，你可以以下代码。\n\
  \n```javascript\nlet username = window.prompt(\"Give me your name!\", \"\");\n```\n\
  \n在这种情况下，提示文本将是“Give me your name!”，文本框的默认值为空。下面的插图显示了该代码在 Mozilla Firefox 中运行时提示对话框的样子。\n\
  \n![Images](img/I06-01.jpg)\n\n如果用户点击确定或按下 ENTER 键，`window.prompt()` 方法返回文本框的内容。如果点击取消按钮或以其他方式关闭提示框，返回的值将为\
  \ `null`。如果使用了变量，返回的值将存储在赋值给 `window.prompt()` 方法的变量中。在这种，返回的值将存储在 `username` 变量中。\n\
  \n为了这一点，假设你想在页面上显示观众的名字以进行个性化处理。如果输入了观众的名字，你想显示该名字；如果没有输入或用户以某种方式取消/关闭了提示框，则显示默认消息。以下代码展示了如何实现：\n\
  \n![Images](img/f0141-01.jpg)\n\n提示返回的值存储在 `username` 变量中。使用 `if` 语句检查变量的值。如果 `username`\
  \ 的值为 `null` 或空字符串，页面将显示“Hello, Random Nameless Person!”消息。否则，将用其输入的名称欢迎观众。图 6-1\
  \ 显示了在提示文本框中输入“Brent”的结果。\n\n![Images](img/F06-01.jpg)\n\n**图 6-1** 向观众显示欢迎语。\n\n\
  如你所见，`if/else` 条件语句允许你对用户输入进行一些基础测试。这防止了显示以 `null` 或空字符串作为观众名字的消息。从技术上讲，用户仍然可以输入空格，但你可以通过在条件语句中使用正则表达式来防止这一点。正则表达式将在第\
  \ 13 章中进行详细介绍。\n\n## 专家问答\n\n**问：我需要在每个 if/else 块上使用大括号吗？我在 Web 上的代码中见过不带括号用法。为什么？**\n\
  \n**答：** 如果你只在 `if` 块和 `else` 块中执行单个 JavaScript 语句，则有一种快捷方法可以让你省略大括号（参见本章的“大括号快捷方法”部分），这种方法可以用在\
  \ Web 上的自由脚本中。正如之前解释的，不建议使用这种技术，因为在审阅或调试代码时可能会引起困惑。\n\n**问：如果我能做的只是给变量赋值然后进行测试，我为什么还要费劲用条件语句？如果我已经知道变量的值了，为什么要用条件语句？**\n\
  \n**答：** 在下一节中，你将学习从观众那里获取信息。这些信息会根据观众而异（例如，如果观众需要在文本框或提示框中输入他们的名字），这使得条件块更有用，因为你能够为一个观众执行一个操作，为另一个用户执行另一个任务。有了用户输入，你无法预先知道变量的值，并且需要使用条件块来处理各种可能性。此外，你会记得函数可以传递不同的值作为参数，在执行某些代码段之前，你可能需要用条件语句对其进行测试。\n\
  \n**问：我需要使用 switch 语句或条件运算符吗？**\n\n**答：** 虽然不是绝对必须使用它们（你可以用 `if/else` 语句代替），但学习它们是一个好主意，因为它们可以帮你节省时间并优化代码。在阅读其他脚本以查看代码在做什么时，了解它们也有帮助。\n\
  \n**问：我尝试在提示框中输入一个数字并与另一个数字相加，但它把两个数字连在了一起而不是相加。为什么？**\n\n**答：** 输入到提示文本框的数据以字符串形式返回，无论输入的是什么类型的数据。你可以使用一元加法运算符（参考第\
  \ 5 章）将字符串强制转换为数值：\n\n```javascript\nlet num1 = window.prompt(\"Enter a number\"\
  ,\"\");\nnum1 = +num1;\n```\n如果值可以被强制转换，它将变成数值，加法将按预期进行。你将在第 13 章中学习更多关于输入验证的内容。\n\
  \n## 练习 6-1 用户输入\n\n`pr6_1.html`\n`prjs6_1.js`\n\n### 逐步步骤\n\n**1.** 创建 HTML 页面并将其保存为\
