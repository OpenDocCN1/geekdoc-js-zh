  md: "MARKETING YOUR APPS / SUMMARY\n\n**201**\n\n**Summary**\n\nIn this chapter\
    \ you learned how to\n\nr Consider what kind of presence you want in the App Store:\
    \ yourself, \n\nyour company, your employer or organization, or your client.\n\
    \nr Use the Available on the App Store badge and device images provided \n\nby\
    \ Apple (and use them properly).\n\nr Follow Apple’s text guidelines for marketing\
    \ messages, and how to *not*\n\ntypeset your text in Myriad.\n\nr Create your\
    \ own app website and social media channels that communi-\n\ncate clearly to your\
    \ customers, and augment the online presence of your \n\napp beyond the App Store\
    \ itself.\n\nr Write app update messages that are clear, concise, readable, and\
    \ \n\nhelpful—and strengthen your relationship with your customers.\n\nYou’ve\
    \ now traveled nearly the entire iOS app design journey: from get-\n\nting the\
    \ app design tools you need, to learning about the iOS interface \n\nand user\
    \ experience, to trying out techniques for designing various kinds \n\nof app\
    \ content. This, coupled with marketing guidelines and tips, means \n\nthat you’re\
    \ ready for the finish line: distributing your app via the iTunes \n\nApp Store."
  merge: -1
