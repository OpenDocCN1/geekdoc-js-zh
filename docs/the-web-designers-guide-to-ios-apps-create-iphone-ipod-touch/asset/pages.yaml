  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**192**\n\nfor showing your app. Instead,\
    \ layer such screenshots on top of the \n\ndevice image provided by Apple.\n\n\
    r Do not use Apple iOS device images alongside an image of another \n\nmobile\
    \ device. (This rule makes me laugh a bit!)\n\nr Unlike the App Store badge, there\
    \ is a strict background requirement \n\nfor the device images: white is the only\
    \ acceptable background.\n\nr Do not place any promotional copy or images in the\
    \ screen area of an \n\niOS device image. The only acceptable images for the screen\
    \ area are \n\nscreenshots of your app as it runs on a device or in the Simulator.\n\
    \nr As with the App Store badge, do not modify device images in any \n\nway other\
    \ than adding an app screen shot to the device’s screen area. \n\nProhibited modifications\
    \ include changing color, rotating, adding or \n\nsubtracting any elements of\
    \ the graphic (including the iOS status bar), \n\nor rearranging any of the elements.\n\
    \nIf you have any questions, please refer to Apple’s App Marketing and Iden-\n\
    \ntity Guidelines for Developers for additional details.\n\n**Using Apple-approved\
    \ language**\n\nEven when it comes to written descriptions of your app, Apple\
    \ has a few \n\nopinions as to how you should proceed. For example, if your app\
    \ is called \n\nAweSome MegaApp, you can refer to it as AweSome MegaApp for iPhone\
    \ \n\nbut not iPhone AweSome MegaApp in your communications about it.\n\nApple\
    \ is also quite discerning about how you use the term App Store. \n\nDespite it\
    \ being in iTunes, you are not allowed to add descriptors such as \n\niTunes App\
    \ Store or iPhone App Store. It’s just App Store, and you are rec-\n\nommended\
    \ to say things like your app being “available in the App Store” or \n\nable to\
    \ be “downloaded from the App Store.” And interestingly, Apple does \n\nnot allow\
    \ App Store to be translated into another language, even when used \n\nin communications\
    \ in another language.\n\nIt is the App Store, and it shall remain the App Store.\n\
    \nAlso, do not refer to Apple product names in your communications except \n\n\
    for describing app compatibility either generally or specifically. And note \n\
    \nthat iPod touch is required to have a lower-case *t* in *touch*.\n\nDid I mention\
    \ that Apple was detail-oriented?"
