  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**12**\n\nThat is what the subsequent\
    \ chapters are all about. Learning more about \n\nthe important characteristics\
    \ of iOS interfaces and behaviors, seeing how \n\nNimbleKit bridges the gap between\
    \ familiar web design languages and \n\nnew devices (and their native development\
    \ languages). And, after learning \n\na few examples of designing content-based\
    \ iOS apps, we’ll talk about how \n\nto submit them to Apple for approval and\
    \ how to distribute or sell them \n\nin iTunes.\n\nBy following Apple’s lead from\
    \ 2001 to the present, we can see that content \n\nreigns supreme, and that small,\
    \ simple devices with intuitive and consistent \n\ninterfaces and behaviors bring\
    \ our most useful content—life content—to \n\npeople where and when they need\
    \ it. All we need to do is focus on people \n\nand what they really need, summon\
    \ our web design skills, learn some new \n\ntips and tricks, and hitch our wagon\
    \ to Apple’s very successful train.\n\nWe’re just getting started!\n\n**Summary**\n\
    \nWhat you’ve learned in this chapter:\n\nr Don’t let the name “iPhone” fool you.\
    \ It’s a pocket computer with a \n\nPhone app. This means it can do amazing things,\
    \ and we can help shape \n\nsome of these things!\n\nr The entire iOS ecosystem\
    \ is an enormous change in strategy for Apple \n\nin that it focuses on lifestyle,\
    \ ubiquitous information, and content. \n\nThis has created an enormous opportunity\
    \ for people who design \n\ndigital things.\n\nr iOS use is immersive and more\
    \ fully integrated with the rest of our lives, \n\nnot just our work. How can\
    \ we design apps that fit into this context?\n\nr Native apps are programmed in\
    \ Objective-C, but that doesn’t mean \n\nthat designers need to learn Objective-C.\
    \ They can work in teams with \n\nprogrammers, or use a code framework to bridge\
    \ the gap. This book is \n\nprimarily about the latter."
