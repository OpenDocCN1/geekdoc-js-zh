  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**60**\n\nWhen you’re making this,\
    \ you’re creating the instance of **NKTableView**\n\ncalled **tableView**, defining\
    \ how much of the screen it takes up—in this \n\ncase, the entire screen except\
    \ the status and title bars—and specify-\n\ning that it’s a plain table view (the\
    \ alternative is grouped, which you will \n\nexplore next).\n\nAfter this, use\
    \ **insertRecord** to add the desired number of rows (it will \n\nscroll, so there\
    \ really isn’t a limit that I’m aware of). The six parameters \n\navailable are:\n\
    \nr title\n\nr subtitle\n\nr left image\n\nr section number\n\nr right image\n\
    \nr callback\n\n**NOTE ****Table view usability and information hierarchy: **\n\
    \n**How many rows are too many?**\n\nI’m not aware of a limit to the number of\
    \ rows in a table view, but that doesn’t neces-\n\nsarily mean there is no practical\
    \ limit. If you’re considering having a ton of rows in a \n\ntable view, you might\
    \ be better off using a grouped table view or even multiple table \n\nviews (that\
    \ is, a table view that links to screens with additional table views). Consider\
    \ \n\nthe usability and information hierarchy concerns of how you design with\
    \ this interface \n\nelement.\n\nIn a basic table view, you leave the subtitle\
    \ and image parameters empty \n\n(images are covered in the next example). The\
    \ section parameter is used \n\nto specify sections in a grouped table view; here\
    \ it is set to **0** (quirk alert—\n\notherwise the row will not display!). Finally,\
    \ the callback here is scripted to \n\nput the **navController** function into\
    \ motion and navigate to screens that \n\nwould tell people more about these various\
    \ foods.\n\n**Table view with images**\n\nTable views can also be designed with\
    \ images in them. You’ve seen this in \n\nscreens like the album view in the iPod\
    \ app (**Figure 4.12**)."
