  md: "MARKETING YOUR APPS / DESIGNING YOUR OWN APP MARKETING COMMUNICATIONS\n\n**195**\n\
    \nHere are some decisions I made concerning this website and how it relates \n\
    \nto marketing the apps I have designed:\n\nr The branding of Aesthete Software,\
    \ LLC, has been very consistent. The \n\ndetails of the wordmark (typeface, color,\
    \ spatial relationships) have \n\nbeen consistent between the website and the\
    \ app graphics in the App \n\nStore, as well as in the apps themselves.\n\nr I\
    \ do my best to maintain an attention-getting home page, usually either \n\nwith\
    \ fresh news or with a large image and quick message.\n\nr The navigation for\
    \ this site has been kept quite simple. I have sections \n\nfor apps, consulting,\
    \ workshops, and now this book.\n\nr To keep updating simple and easy to access,\
    \ I decided to use a web-\n\nbased content management system. This allows me to\
    \ add or revise \n\ncontent wherever I am as long as I have an internet connection.\n\
    \nr I incorporated a Twitter feed in my site’s design, so that even if the site’s\
    \ \n\nhome page has not been updated recently (which I can be guilty of when \n\
    \nbusy with other things), there is still current content streamed to the \n\n\
    right column of the page (assuming I’ve kept up on Twitter).\n\nIn short, I encourage\
    \ you to be somewhat Apple-like in your approach to \n\ncommunicating about any\
    \ apps that you design. Use consistency to your \n\nadvantage: You have not only\
    \ created an app, you have created a new brand. \n\nRead up a bit on branding\
    \ so you understand what it means to “manage a \n\nbrand” because, after all,\
    \ you or someone you are working with will need to \n\nskillfully and consistently\
    \ stay on message with what your app does and for \n\nwhom.\n\nAnd if you are\
    \ creating a suite of apps, be sure to plan how you will tie them \n\ntogether\
    \ visually and textually. The relationships between you or your com-\n\npany,\
    \ your app names, and your app graphics will either reinforce or detract \n\n\
    from a sense of cohesion in your communications.\n\n**Creating an app social media\
    \ channel**\n\nThese days, the App Store and a website are just two parts of the\
    \ puzzle. \n\nSocial networks are carrying a large amount of today’s web communica-\n\
    \ntions—and I’m sure you don’t need me telling you this. You’ve probably \n\n\
    logged into Facebook or Twitter today already or may even be logged in at"
