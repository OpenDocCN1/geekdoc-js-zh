    \ an Apple \n\nDeveloper, you’re also agreeing to not share the juicy details\
    \ about how \n\nApple’s devices and software work, or exciting things that you\
    \ learn \n\nat the WWDC, or any advance notices about new Apple products. \n\n\
    Essentially, you are signing a nondisclosure agreement. (This can be \n\na fun\
