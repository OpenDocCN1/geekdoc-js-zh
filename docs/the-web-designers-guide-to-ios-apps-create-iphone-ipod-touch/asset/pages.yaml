  md: "**141**\n\nThe buzz surrounding HTML5 and CSS3 has definitely \n\nbeen getting\
    \ louder in the past few years. But for web \n\ndesigners who still need their\
    \ sites to work consistently \n\nand predictably across all major browsers—antique\
    \ as \n\nwell as modern—questions remain: What is safe to use \n\nnow, and what\
    \ is still premature and unevenly supported? \n\nIt can be a bit frustrating—we\
    \ want to start learning how \n\nit all works and gain some experience with HTML5\
    \ and \n\nCSS3, but not push the envelope too far, too fast.\n\nFortunately, the\
    \ browser engine in Apple’s mobile \n\noperating system uses WebKit, and the same\
    \ great \n\nsupport for most new HTML5 and CSS3 rules in mobile \n\nSafari is\
    \ also available for you to leverage in native iOS \n\napps built with the NimbleKit\
    \ Objective-C framework and \n\nits web view.\n\nLet’s take a closer look at how\
    \ designing iOS apps gives \n\nyou the freedom to use HTML5 and CSS3—not tomorrow\
    \ \n\nbut today, and with no risk at all."
  merge: -1
