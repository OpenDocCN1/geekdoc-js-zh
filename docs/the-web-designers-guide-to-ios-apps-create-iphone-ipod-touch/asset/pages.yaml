  md: "FOCUS ON APP CONTENT: TEXT AND IMAGES / SUMMARY\n\n**91**\n\n**Summary**\n\n\
    Working with text and image content is essential for any iOS app, and this \n\n\
    chapter scratched the surface of the many possibilities for incorporating \n\n\
    and styling content. In this chapter you learned how to\n\nr Structure HTML content\
    \ several different ways using definition lists.\n\nr Add social content, live\
    \ from the web, to an app; in our example, we \n\nused a feed from Twitter.\n\n\
    r Add an image inline right into app content.\n\nr Add an image overlay on top\
    \ of app content.\n\nThis introduced you to a few techniques for exploring how\
    \ you might \n\ndesign custom content-based apps for use offline or online. Next,\
    \ we’ll look \n\nat designing specifically for people who are mobile: Chapter\
    \ 6 is about geo-\n\nlocation on iOS devices, and looks at a few ways to design\
    \ a Google Maps \n\nview into a NimbleKit-based app."
  merge: -1
  pgno: 103
