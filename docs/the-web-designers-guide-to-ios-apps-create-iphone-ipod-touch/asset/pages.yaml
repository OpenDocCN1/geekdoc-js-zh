  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**38**\n\n**Setting the app version**\n\
    \nFurther down the rows in the Information Property List (-Info.plist) file \n\
    \nis the bundle version (1.0, as shown in Figure 3.8). When you design your \n\
    \napp, decide on a versioning nomenclature that will best suit the lifecycle of\
    \ \n\nyour app and its content. Will the app’s content be updated regularly and,\
    \ if \n\nso, how often? Or, if your app is for a client, does the client expect\
    \ frequent \n\ndesign updates for any particular reason? As we know, a lot of\
    \ retail product \n\npackaging is redesigned regularly, so if your app is tied\
    \ to a product or \n\nservice that encounters frequent brand updates, your app\
    \ might have these \n\nsame encounters and merit updates such as 1.2, 1.3, and\
    \ 1.4 instead of 1.0, \n\n2.0, 3.0, and 4.0.\n\nThe bundle version is an internal\
    \ record of the app’s version number that \n\nresides in the app bundle itself,\
    \ whereas you also submit a version number \n\nvia iTunes Connect with your packaged\
    \ app binary (more on that in Chap-\n\nter 12). I suggest that you always make\
    \ these numbers match to avoid any \n\nconfusion (either your own or Apple’s),\
    \ just in case having them not match \n\ncould cause a problem.\n\n**Testing and\
    \ building your app binary**\n\nNote that the app building process—part of both\
    \ provisioning and testing \n\nyour app on a device, as well as submitting to\
    \ Apple for distribution via \n\niTunes—requires you to be a registered and paid\
    \ member of the Apple \n\nDeveloper Program. It also requires you to have purchased\
    \ a license for \n\nNimbleKit. These processes are described in greater detail\
    \ in Chapter 12.\n\nBut before you provision and test on a device, you can use\
    \ the iOS SDK’s \n\nSimulator for free. So we’ll learn the settings via the Simulator\
    \ process, and \n\nchange them along the way for provisioning to a device and\
    \ then eventually \n\nfor submission to Apple.\n\n**Testing on Simulator**\n\n\
    Testing on Simulator used to be a very straightforward process, and \n\nfortunately\
    \ it’s still one of the easier steps of iOS app design. But as with \n\nthe other\
    \ complications that the expansion of the iOS device family has \n\ncaused, the\
    \ three device types have made testing apps on Simulator a little \n\nless elegant\
    \ than it used to be."
  merge: -1
  pgno: 50
- img_proc: true
  md: "FUNDAMENTALS OF THE IOS SDK / TESTING AND BUILDING YOUR APP BINARY\n\n**39**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_51_0.png)\n\nTo launch and install\
    \ the new NimbleKit app on Simulator, go to the \n\nOverview drop-down menu in\
    \ the left corner of the Xcode project window. \n\nIt is the extra-wide drop-down\
    \ menu that should read **Simulator – 4.0 | **\n\n**Debug** followed by the name\
    \ of the app you created at the beginning of this \n\nchapter. And if you’ve since\
    \ closed that one or got rid of it, just create a new \n\nNimbleKit app project\
    \ again.\n\nWhen you click the Overview menu (**Figure 3.10**), make sure that\
    \ Simula-\n\ntor is checked in the top group of options. In the next group, Active\
    \ Con-\n\nfiguration, Debug should also be selected. The next group, Active Target,\
    \ \n\nwill have only one item in it: the name of your app project file.\n\n3.10\
    \ Xcode’s Overview menu \n\nshowing device and active \n\nconfigurations.\n\n\
    The next group, Active Executable, is where you specify which device you \n\n\
    want Simulator to emulate when you begin testing your app. For our pur-\n\nposes,\
    \ make sure that iPhone Simulator 4.0 is selected. Disregard Active \n\nArchitecture;\
    \ it is set automatically.\n\nHere’s where it gets a little exciting already:\
    \ You’ll install your first app \n\non the Simulator, even though you haven’t\
    \ designed anything yet. Just for \n\npractice!\n\nDoing this is very easy: Just\
    \ click on the Build and Run icon in the middle \n\nof the Xcode project toolbar.\
    \ Look for the clever Build and Run icon \n\n(a hammer and a green play button).\
    \ The result looks like **Figure 3.11** (on \n\nthe next page)."
