  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**152**\n\n**ul.food li {**\n\n** position:\
    \ relative;**\n\n** width: 320px;**\n\n** height: 140px;**\n\n** margin: 0px;**\n\
    \n** padding: 0px;**\n\n**}**\n\nThis sets up the **li** to also be page-width\
    \ and the **position: relative** sets \n\nyou up to create a span for wrapping\
    \ the content like so:\n\n**<li>**\n\n**<div class=”veggies”>**\n\n**<img src=”beets.jpg”>**\n\
    \n**<span>**\n\n**<strong>Beets</strong>**\n\n**<em>$4.49</em>**\n\n**</span>**\n\
    \n**</div>**\n\n**</li>**\n\nThis enables you to style the name and price content\
    \ as an overlay that will \n\nbe positioned right on top of the image, flush bottom.\
    \ Here is the CSS for \n\nthat effect:\n\n**div.veggies span {**\n\n**display:\
    \ block;**\n\n**position: absolute;**\n\n**width: 100%;**\n\n**height: 30px;**\n\
    \n**bottom: 0;**\n\n**left: 0;**\n\n**padding: 5px;**\n\n**font-family: American\
    \ Typewriter;**\n\n**font-size: 1.5em;**\n\n**color: #ccc;**\n\n**background:\
    \ rgba(0,0,0,.5);**\n\n**}**\n\nYou’re doing several things here: absolute positioning\
    \ the block above the \n\nimage, setting the width of the overlay to 100 percent,\
    \ making its height 30 \n\npixels, and giving the text 5 pixels of padding. And\
    \ as long as you’re giving \n\nthe label some style, you’re getting away from\
    \ the default typeface by set-\n\nting the font to American Typewriter, sizing\
    \ it up to 1.5 ems, and making \n\nthe text white."
  merge: -1
