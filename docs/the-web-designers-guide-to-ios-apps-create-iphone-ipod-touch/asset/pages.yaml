  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**178**\n\nIn addition to the slightly\
    \ different HTML syntax (all of the screens are in \n\none file), the highlighted\
    \ links to CSS and JavaScript files show the most \n\nsignificant difference between\
    \ NimbleKit and PhoneGap. But when using \n\njQTouch with PhoneGap, as this example\
    \ does, most of those files are \n\nprovided for you in their respective downloads.\n\
    \n**Developing native apps with Titanium Mobile**\n\nAnother framework that supports\
    \ both iOS and Android is Appcelerator’s \n\nTitanium Mobile, and it’s free to\
    \ download from www.appcelerator.com \n\n(**Figure 10.5**).\n\n![](img/4d979018542def8748544c4af0d37f5a_190_0.png)\n\
    \nTitanium Mobile is a bit of an odd duck: It is an open source development \n\
    \nframework with a very robust and glitzy marketing campaign behind it. \n\nSo\
    \ it is similar to PhoneGap in that it is a company product, but it has also \n\
    \nbeen open-sourced. In this case, however, the presentation feels very cor-\n\
    \nporate to me (but I guess it’s because Appcelerator also sells support and \n\
    \ntraining for Titanium Mobile).\n\n10.5 Appcelerator’s \n\nTitanium Mobile."
  merge: -1
  pgno: 190
- img_proc: true
  md: "OTHER MOBILE FRAMEWORKS / DEVELOPING NATIVE APPS WITH TITANIUM MOBILE\n\n**179**\n\
    \nI recommend that you check out Titanium not because I’ve used it (I have \n\n\
    not), but because colleagues of mine have and they confirm that it is a good \n\
    \noption. Here are some of the things they’ve said about Titanium Mobile:\n\n\
    r Although it has a large number of APIs (the website claims over 300), \n\nthey\
    \ are all accessible to the developer via web standards. But Titanium \n\nMobile\
    \ requires almost everything to be written in JavaScript. So on a \n\nspectrum\
    \ of tools for designer-types versus tools for programmer-types, \n\nthis one\
    \ falls more firmly into the programmer camp.\n\nr Titanium Mobile out-of-the-box\
    \ comes with more corporate branding \n\nthan PhoneGap or NimbleKit, which do\
    \ not force any company brand-\n\ning into the interface. But some swapping out\
    \ of images can get you \n\naround this (though I can’t vouch for whether doing\
    \ so voids any end-\n\nuser license agreement clauses that you tacitly agree to\
    \ when download-\n\ning the tool).\n\nAnother key difference with Titanium Mobile\
    \ is that the download \n\ncomes with its own Mac OS desktop application, Titanium\
    \ Developer \n\n(**Figure 10.6**).\n\n![](img/4d979018542def8748544c4af0d37f5a_191_0.png)\n\
    \nTitanium Developer manages, compiles, and packages project files. It effec-\n\
    \ntively bypasses Xcode as your development environment, which means \n\nthat\
    \ you write all of your JavaScript in the editor of your choice. Once \n\nyou’re\
    \ done writing the code and designing any other assets, you import \n\n10.6 Titanium\
    \ Developer."
  merge: -1
  pgno: 191
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**180**\n\n![](img/4d979018542def8748544c4af0d37f5a_192_0.png)\n\
    \nthe project files and compile, after which Titanium Developer launches \n\n\
    Simulator (rather than Xcode) to show you the results (**Figure 10.7**).\n\n10.7\
    \ Titanium Mobile’s Kitchen Sink \n\ndemo app in Simulator.²\n\nIf you are an\
    \ experienced JavaScript programmer and are interested in \n\ndeveloping native\
    \ apps for both iOS and Android, I would encourage you to \n\ninvestigate Titanium\
    \ Mobile when evaluating tools for your app projects.\n\n**Designing web apps\
    \ with Sencha Touch**\n\nAre native apps, designed for specific platforms and\
    \ installed to run on \n\ndevices, better than web apps? Or are web apps, which\
    \ are more universally \n\ndesigned and run on servers just like websites, better\
    \ than native apps?\n\nYes.\n\nAlthough my focus in the mobile space has been\
    \ on native apps for the iOS \n\nplatform, I certainly would not discourage you\
    \ from considering web apps \n\nto meet your app design needs or those of your\
    \ clients. In fact, many of the \n\nideas and skills you’ve learned in this book\
    \ apply to designing web apps as \n\nwell as designing native iOS apps."
  merge: -1
  pgno: 192
- img_proc: true
  md: "OTHER MOBILE FRAMEWORKS / DESIGNING WEB APPS WITH SENCHA TOUCH\n\n**181**\n\
    \nWhen considering ways of designing effective mobile interfaces for univer-\n\
    \nsal web apps, you already have one option to consider: the jQTouch plug-\n\n\
    in. Another option is Sencha Touch, which is free to download from www.\n\nsencha.com\
    \ (**Figure 10.8**).\n\n![](img/4d979018542def8748544c4af0d37f5a_193_0.png)\n\n\
    Here are some highlights of Sencha Touch:\n\nr It prides itself on being the first\
    \ app framework built specifically to \n\nleverage HTML5, CSS3, and JavaScript\
    \ to maximize power, flexibility, \n\nand optimization. Web standards FTW!\n\n\
    r Sencha’s beta version is compatible with both iOS and Android, with \n\nthemes\
    \ designed for both platforms. This is not technically a device \n\nplatform limitation,\
    \ however, but rather a WebKit rendering engine \n\nlimitation. Other mobile browsers\
    \ based on WebKit should support \n\nSencha Touch quite well.\n\nr Because the\
    \ mobile web is evolving on most platforms to be touch-\n\nbased, Sencha Touch\
    \ has developed a robust range of touch interac-\n\ntions: tap, double-tap, swipe,\
    \ tap-and-hold, pinch, and rotate. Such \n\n10.8 The Sencha Touch \n\nmobile app\
    \ framework."
