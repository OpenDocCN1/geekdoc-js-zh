  md: "FOCUS ON APP CONTENT: MAPS / SUMMARY\n\n**113**\n\n**Summary**\n\nIn this chapter\
    \ you learned how to\n\nr Pull in an **NKMapView** that displays a Google map\
    \ view and supports a \n\nlocation pin with title and subtitle.\n\nr Add an **NKButton**\
    \ for linking the in-app map view to the same location \n\nin Maps, so users can\
    \ get driving directions to their destination from \n\ntheir current location.\n\
    \nr Design a custom Maps button using HTML and CSS.\n\nr Design the NKMapView\
    \ scaled to the iPad, and in a way that allows for \n\na custom chrome around\
    \ the map view.\n\nYour focus on iOS app content began with text and images and\
    \ has con-\n\ntinued with map and location content. Next you will see how your\
    \ web \n\nstandards skills, coupled with NimbleKit, allow you to include audio\
    \ and \n\nvideo content in native iOS apps.\n\n**REFERENCES**\n\n**1.**\n\nhttp://www.nimblekit.com/"
  merge: -1
  pgno: 125
- img_proc: true
  md: '**7**** FOCUS ON**


    **APP CONTENT: **


    **AUDIO**'
  merge: -1
