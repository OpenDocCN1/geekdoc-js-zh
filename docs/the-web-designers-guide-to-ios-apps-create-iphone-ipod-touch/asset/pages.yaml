  md: "**203**\n\nThis journey started with the big picture of iOS app \n\ndesign,\
    \ moved into the primary tools and methods \n\nfor app design work, and has spent\
    \ the last several \n\nchapters detailing various content-focused approaches \n\
    \nto designing apps with web standards and NimbleKit’s \n\nObjective-C code framework.\n\
    \nSo what do you do when you are about to complete an \n\napp and start thinking\
    \ about testing, distributing, and \n\nselling it?\n\nThat’s what this chapter\
    \ is about. One of the major \n\nreasons to “go native” and design an Objective-C\
    \ iOS \n\napp is Apple’s iTunes software and distribution channel. \n\niTunes\
    \ Connect is your interface with Apple’s digital \n\nmarketplace, and the iOS\
    \ Dev Center is where you’ll find \n\nthe technical resources you need to make\
    \ iTunes Connect \n\nwork on your behalf."
  merge: -1
  pgno: 215
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**204**\n\n**Using the iOS Dev Center**\n\
    \nThe iOS Dev Center has added a lot of new technical content since the \n\nintroduction\
    \ of the iPad and iPhone 4 (and has always had a lot of informa-\n\ntion about\
    \ the iPod touch). The Dev Center is a large, sprawling portal of \n\ninformation,\
    \ resources, and forums for supporting your work as an app \n\ndesigner. This\
    \ book will not attempt to catalog everything that’s there—\n\nthat would take\
    \ several volumes, and it’s actually just as effective and fun \n\nto poke around\
    \ the place much like you would at any other large empo-\n\nrium. Rather, I’ll\
    \ focus on two key areas: the iOS Provisioning Portal and \n\niTunes Connect.\n\
    \n**Using the iOS Provisioning Portal**\n\nThe iOS Provisioning Portal is the\
    \ place where you can provision an app to \n\n*any* of the iOS devices you own\
    \ or have access to. I’ll walk you through the \n\nprocess, as it is somewhat\
    \ tedious at times.\n\nThe reason that the app provisioning and distribution process\
    \ is so tedious \n\ncan be summed in one word: security. At least, this is what\
    \ I’ve been told \n\nand this is what I choose to believe to avoid going crazy\
    \ as I deal with all the \n\nsteps that are required.\n\nBut it makes a lot of\
    \ sense, as the system is designed around a set of digital \n\nkeys, or certificates,\
    \ that identify each essential component involved in \n\nthe process: you, your\
    \ app, and your device(s). These certificates and the \n\nprocesses that they\
    \ plug into would make it extraordinarily difficult for \n\nsomeone to test or\
    \ distribute your apps without your permission. Given \n\nhow easy it is to copy\
    \ digital files, we need to be thankful for this security.\n\nOn the other hand,\
    \ the processes require either a certain amount of experi-\n\nmentation (and often\
    \ debugging) to work properly, or some easy-to-use \n\ndocumentation. You probably\
    \ don’t want to do any more of the former than \n\nyou really have to, and documentation\
    \ is found in abundance in the iOS \n\nDev Center—but it’s not always filed under\
    \ “easy” (in fact, it’s not always \n\neven up-to-date).\n\nThat’s where this\
    \ chapter steps in."
  merge: -1
  pgno: 216
- img_proc: true
  md: "PROVISIONING AND DISTRIBUTING YOUR APPS / USING THE IOS DEV CENTER\n\n**205**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_217_0.png)\n\n**Requesting and installing\
    \ certificates**\n\nIn order to run on an Apple mobile device (that is, on anything\
    \ besides \n\nSimulator), an iOS app must be signed by a valid certificate that\
    \ is obtained \n\nfrom the iOS Provisioning Portal. To run on your own device\
    \ (or any that \n\nyou have direct access to), you’ll need a *development certificate*.\
    \ For custom-\n\ners to run it on their devices after obtaining it from the iTunes\
    \ App Store, \n\na* distribution certificate* is required.\n\nThe first step in\
    \ this process is generating a Certificate Signing Request (CSR) \n\nin the Keychain\
    \ Access application on your Mac. If you’re not familiar with \n\nthis app, it\
    \ is in Applications > Utilities.\n\nAfter you start Keychain Access, go to the\
    \ main application menu and \n\nselect Preferences. Click on the Certificates\
    \ tab and be sure that the first \n\ntwo options are set to Off (**Figure 12.1**).\n\
    \n12.1 The Certificates \n\nPreferences in Keychain \n\nAccess.\n\nAfter you verify\
    \ these preferences, go back to the main application menu \n\nand select Certificate\
    \ Assistant and then choose Request a Certificate from \n\na Certificate Authority\
    \ (**Figure 12.2**).\n\n![](img/4d979018542def8748544c4af0d37f5a_217_1.png)\n\n\
    12.2 Request a \n\nCertificate from \n\na Certificate Authority."
  merge: -1
  pgno: 217
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**206**\n\n![](img/4d979018542def8748544c4af0d37f5a_218_0.png)\n\
    \nAlthough you need to have an email address entered in the top field, email \n\
    \naddress fields here are not actually used for this particular process. But you\
    \ \n\ndo want to be sure to use the exact same name you used when registering\
    \ \n\nfor your Apple Developer ID. You also want to select Saved to disk as well\
    \ \n\nas Let me specify key pair information (**Figure 12.3**).\n\n12.3 The Certificate\
    \ \n\nAssistant.\n\n![](img/4d979018542def8748544c4af0d37f5a_218_1.png)\n\nYou\
    \ will be prompted to save the Certificate Signing Request (pay atten-\n\ntion\
    \ to where you are saving it!), and then you’ll see the screen shown in \n\n**Figure\
    \ 12.4**. Be sure it looks just like this, with Key Size equal to 2048 bits \n\
    \nand Algorithm set to RSA. Click Continue.\n\n12.4 Saving your \n\nCSR and reviewing\
    \ \n\nKey Size and \n\nAlgorithm settings.\n\n**NOTE**\n\nDo I have any idea what\
    \ \n\nthese settings mean? No, \n\nnone at all—but you can \n\nread more about\
    \ them in \n\nthe Dev Center if you really \n\nwant to."
  merge: -1
  pgno: 218
- img_proc: true
  md: "PROVISIONING AND DISTRIBUTING YOUR APPS / USING THE IOS DEV CENTER\n\n**207**\n\
    \nAfter you save your file, you will be the proud owner of a unique item: the\
    \ \n\nsmallest file (4 KB) with the longest file extension (.certsigningrequest)\
    \ \n\nyou’re likely ever to have on your computer. Then you can log in to the\
    \ iOS \n\nProvisioning Portal, go to Certificates and Development, and click Add\
    \ \n\nCertificate.\n\n**NOTE ****A note regarding the distribution certificate**\n\
    \nTo request and generate a distribution certiﬁcate, it’s almost the same process.\
    \ \n\nRepeat these same steps but go to the Distribution tab under Certiﬁcates\
    \ instead.\n\nOnce your development certificate is approved, you will see results\
    \ like this \n\n(**Figure 12.5**) indicating that you may download the certificate.\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_219_0.png)\n\nOnce you download the\
    \ file, just drag the certificate to your Keychain \n\nAccess app icon to install.\n\
    \nAfter you’ve done this, you should be able to create and download app \n\nprovisioning\
    \ certificates (described in the next section). But you need to \n\nrepeat the\
    \ above process once you wish to request, download, and install \n\na distribution\
    \ certificate, which you will need to distribute your app to \n\ncustomers via\
    \ the iTunes App Store. After you have both your provisioning \n\nand distribution\
    \ certificates, your Keychain Access should look something \n\nlike this (**Figure\
    \ 12.6** on the next page) when viewing your certificates.\n\n12.5 Congratulations—\n\
    \nyou have a development \n\ncertificate!"
  merge: -1
  pgno: 219
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**208**\n\n![](img/4d979018542def8748544c4af0d37f5a_220_0.png)\n\
    \nNote the presence of one other important item that you’ll need to down-\n\n\
    load from the iOS Dev Center: the Apple Worldwide Developer Relations \n\nCertification\
    \ Authority certificate (referred to in some documentation as \n\nthe WWDR intermediate\
    \ certificate).\n\nFinally, note that these certificates can occasionally be a\
    \ pain to manage. \n\nFor example, I ran into problems when my development certificate\
    \ expired \n\n(they are valid for one year; this is tied to the regular Developer\
    \ Program \n\nhaving an annual fee). It was easy enough to request a new one,\
    \ download \n\nit, and install it. But much to my surprise, the old one was still\
    \ in Keychain \n\nAccess and interfered with the new one being recognized. I had\
    \ to hunt \n\naround in Keychain Access, looking through Certificates and My Certifi-\n\
    \ncates until I found it and deleted it.\n\nSo beware: Deleting a certificate\
    \ in one place does not always delete it \n\ncompletely from your system. Check\
    \ both My Certificates and Certificates \n\nif you ever have to troubleshoot certificate\
    \ issues.\n\n**Using the Development Provisioning Assistant**\n\nI have to take\
    \ a moment to thank Apple for an improved process here, \n\nbecause the Development\
    \ Provisioning Assistant (**Figure 12.7**) is a nice \n\naddition to the Dev Center.\
    \ It does a much better job of helping you get \n\nfrom testing a new app in Simulator\
    \ to testing on a device, and then eventu-\n\nally distributing via iTunes Connect.\n\
    \n12.6 Provisioning and \n\ndevelopment certificates in \n\nKeychain Access."
  merge: -1
  pgno: 220
- img_proc: true
  md: "PROVISIONING AND DISTRIBUTING YOUR APPS / USING THE IOS DEV CENTER\n\n**209**\n\
    \nThis section explains how it works.\n\n![](img/4d979018542def8748544c4af0d37f5a_221_0.png)\n\
    \n**Creating an App ID**\n\nThe initial view of the Assistant is rather nice and\
    \ friendly (you’re wel-\n\ncomed to it, in fact!). As I noted above, the screen\
    \ then explains how some \n\ndigital certificates are needed to match the right\
    \ developer with the right \n\napp, as well as the right device. We just covered\
    \ the development certifi-\n\ncate process, so next we can create an App ID. The\
    \ App ID itself is not a \n\ncertificate that you download, it is just a name\
    \ and character string used by \n\nthe Dev Center and, eventually, iTunes Connect\
    \ and the iTunes App Store, \n\nto identify your app.\n\nWhen prompted by the\
    \ Assistant, select Create a New App ID and you will \n\nget the screen shown\
    \ in **Figure 12.8**.\n\n![](img/4d979018542def8748544c4af0d37f5a_221_1.png)\n\
    \n12.7 The Development \n\nProvisioning Assistant.\n\n12.8 Creating a new App\
    \ ID."
  merge: -1
  pgno: 221
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**210**\n\nBe sure to just give this\
    \ a concise ID for your own purposes—this name is \n\nnot particularly important.\
    \ For example, some of the apps I have developed \n\nhave longer names, but I\
    \ tend to give them an ID that is abbreviated; only \n\nalphanumeric characters\
    \ and spaces are allowed.\n\n**Choosing an Apple device**\n\nAfter you create\
    \ a new App ID, you have two of the three digital com-\n\nponents required to\
    \ form an app provisioning profile (the development \n\ncertificate and an App\
    \ ID). It’s kind of like an adventure story where you \n\nhave to collect the\
    \ missing objects that, once together, fuse into an orb that \n\ngives you magic\
    \ powers.\n\nAnd, as you’re noticing, this process is nearly as adventurous!\n\
    \nWhen prompted by the Assistant to choose a device, select Assign a New \n\n\
    Apple Device and you’ll get the screen shown in **Figure 12.9**.\n\n![](img/4d979018542def8748544c4af0d37f5a_222_0.png)\n\
    \nThe description itself should just be a short and simple phrase (“My \n\niPhone\
    \ 4” works), and then you need to get your device ID and enter it \n\ninto the\
    \ form. There are two ways to find the ID:\n\n**1.** Connect your device to iTunes\
    \ and click on the serial number in the \n\nSummary screen. This will display\
    \ the device ID, though here it is called \n\nthe Identifier (UDID).\n\n**2.**\
    \ Connect your device to Xcode and look for the Identifier in the Orga-\n\nnizer\
    \ window under Devices > Summary. It’s actually a bit easier to get \n\nthis way,\
    \ as Xcode lets you select it to copy. (iTunes does not.)\n\n12.9 Creating a new\
    \ device \n\ndescription."
  merge: -1
  pgno: 222
- img_proc: true
  md: "PROVISIONING AND DISTRIBUTING YOUR APPS / USING THE IOS DEV CENTER\n\n**211**\n\
    \nAfter you finish assigning your device, the Assistant will verify the develop-\n\
    \nment certificate we created earlier.\n\n**Naming, generating, and downloading\
    \ the provisioning profile**\n\nNow the Assistant displays the three magic items\
    \ that, when fused, will \n\ngive you magical superpowers—or, at least, the ability\
    \ to install and test \n\nyour app on a device (**Figure 12.10**).\n\n![](img/4d979018542def8748544c4af0d37f5a_223_0.png)\n\
    \nIt then should display a green check mark and verify that it has created the\
    \ \n\nprovisioning profile. Click Continue to download.\n\nNext you’re presented\
    \ with a screen where you have to give the profile a \n\ndescription. Again, be\
    \ brief and descriptive as you will be referring to this \n\nin Xcode settings—over\
    \ time, you may have several apps and devices to \n\ntest them on. I always use\
    \ a combination of things, such as “App1 iPhone \n\ndev.” This helps me distinguish\
    \ my profiles according to app name, device, \n\nand whether the profile is for\
    \ development or distribution.\n\nAfter you give your profile a name, continue\
    \ to follow the screens and \n\nprompts to download the profile and install into\
    \ Xcode. (Dragging the \n\ndownloaded file, which will end with the file extension\
    \ .mobileprovision, \n\nto the Xcode icon is the easiest way to do this after\
    \ you download it.)\n\nNow you’re ready to install and test! That process is detailed\
    \ in the Provi-\n\nsioning and testing on a device (debugging) section in Chapter\
    \ 3.\n\n12.10 Viewing your App ID, \n\ndevice, and certificate name."
  merge: -1
  pgno: 223
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**212**\n\n**Using iTunes Connect**\n\
    \nAfter testing and fine-tuning your app on a device or two (the more, the \n\n\
    merrier), and with all of your other ducks in a row (some of which we will \n\n\
    cover in this section), you are probably eager to get your app out into the \n\
    \nwider world.\n\nThis means you’re ready to distribute. You are also ready to\
    \ start using \n\niTunes Connect—almost.\n\n**Goodbye provisioning assistant,\
    \ hello (again) Provisioning Portal**\n\nThere is no distribution provisioning\
    \ assistant like there is for app develop-\n\nment, and I suspect it’s because\
    \ most of the steps are already completed so \n\nit’s not really necessary. After\
    \ all, you already have a development certifi-\n\ncate and App ID, and distribution\
    \ to iTunes does not involve a particular \n\ndevice ID like development testing\
    \ does. So the last step is to generate a \n\ndistribution provisioning profile.\n\
    \nTo do this, go back to the iOS Dev Center and the iOS Provisioning Portal. \n\
    \nClick on Provisioning and then click on the Distribution tab. Select New \n\n\
    Profile and you will see a screen like what’s shown in **Figure 12.11**.\n\n![](img/4d979018542def8748544c4af0d37f5a_224_0.png)\n\
    \n(Pardon Apple’s insistence in this corner of the web that you’re only work-\n\
    \ning on iPhone projects—the distribution provisioning profile works for \n\n\
    iPod touch and iPad apps, too!)\n\n**NOTE ****Distribution **\n\n**certificate**\n\
    \nRemember that you can \n\nproceed with the following \n\nsteps only if you have\
    \ \n\nrequested, downloaded, \n\nand installed your distribu-\n\ntion certiﬁcate.\
    \ If you \n\nhaven’t, go back to the \n\nRequesting and Installing \n\nCertiﬁcates\
    \ section at the \n\nbeginning of this chapter.\n\n12.11 Creating an iPhone \n\
    \ndistribution provisioning \n\nprofile for your app."
  merge: -1
