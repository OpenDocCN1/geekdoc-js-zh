  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**190**\n\nSo how can you take advantage\
    \ of this enormous opportunity and sales \n\nmomentum for your app? One way is\
    \ to take advantage of the marketing \n\nassets provided by Apple. But take care\
    \ when you do—Apple’s famous \n\nattention to detail and penchant for control\
    \ means there are some rules \n\nabout using them.\n\n![](img/4d979018542def8748544c4af0d37f5a_202_0.png)\n\
    \n**Using the Available on the App Store badge**\n\nThe Available on the App Store\
    \ badge has surely has become one of the \n\nmost recognizable graphic icons in\
    \ the world in just a few short years \n\n(**Figure 11.1**).\n\n11.1 The Available\
    \ on the App Store \n\nbadge.\n\nI have to admit, there was a brief yet huge moment\
    \ of excitement when \n\nI added it to the website I had created for my first\
    \ app—I had arrived!\n\nNeedless to say, you’ll want to use this graphic on any\
    \ communications \n\nabout your app, whether you’re distributing or selling, and\
    \ whether you’re \n\ndoing it for yourself, your employer, or your client. The\
    \ graphic is instantly \n\nrecognizable and has become a potent symbol in the\
    \ heated competition \n\nbetween mobile operating systems (and native versus web\
    \ apps).\n\nNote that when you use this graphic, you are subject to the guidelines,\
    \ \n\nrequirements, and limitations as defined in Apple’s App Marketing Art-\n\
    \nwork License Agreement. Here are some of the more important guidelines \n\n\
    for using the Available on the App Store badge:\n\nr Do not modify the graphic\
    \ in any way. This includes changing its \n\ncolor, rotating it, adding or subtracting\
    \ any elements of the graphic, \n\nor rearranging any of the elements.\n\nr Follow\
    \ the clear space requirements for implementation: 10 millimeters \n\naround the\
    \ graphic in print, and 40 pixels on the web.\n\nr Create a clear hierarchy where\
    \ the badge is secondary to your other app \n\nbranding and identity elements."
  merge: -1
  pgno: 202
