  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**70**\n\n![](img/4d979018542def8748544c4af0d37f5a_82_0.png)\n\
    \nEven unstyled (that is, without any CSS giving it additional style), an unor-\n\
    \ndered list with a heading above it conveys a lot of structure and meaning. \n\
    \nAnd it comes with the “free styling” of the auto-numbering, so that’s kind \n\
    \nof cool. And by styling the **<li>** tags, you could give this structure quite\
    \ a \n\nbit more artistic flair.\n\nOne downside to this content structure is\
    \ having the entire list in one \n\nscreen. For an app that is only about the\
    \ Bill of Rights, this might be overly \n\nsimplistic; for an app that is about\
    \ the entire Constitution and its Amend-\n\nments, it might be entirely appropriate.\n\
    \n**Definition list**\n\nAnother way to structure this content is to place it\
    \ in a definition list. I’m \n\na fan of definition lists because I like the added\
    \ built-in semantic mean-\n\nings—I just think it’s particularly clever that the\
    \ tags define the list with a \n\n**<dl>**, the term with a **<dt>**, and the\
    \ definition or detail with a **<dd>**. It has \n\na poetic clarity. So in this\
    \ case, the list of amendments begins as follows:\n\n**<h1>United States Bill\
    \ of Rights</h1>**\n\n**<dl>**\n\n**<dt>1<sup>st</sup> Amendment</dt>**\n\n5.1\
    \ The Bill of Rights as \n\nan ordered list."
