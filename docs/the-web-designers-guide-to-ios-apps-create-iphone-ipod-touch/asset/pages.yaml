  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**34**\n\n**NOTE ****Sample icon files:\
    \ Download them from the web!**\n\nI like sample ﬁles, and I bet you do, too.\
    \ So I‘ve created a sample set of icon ﬁles for \n\nyou to download. Just visit\
    \ http://iosapps.tumblr.com and download the app-icons.\n\nzip ﬁle. When you open\
    \ it, you’ll have a sample app called icondemo and the set of \n\nﬁles shown in\
    \ Figure 3.5. I’ve made each one a different color so you can see how \n\nthe\
    \ Simulator loads different ﬁles depending on whether you’re testing as an iPhone,\
    \ \n\niPhone 4, or iPad. And I made three different grayscale versions so you\
    \ can see how \n\nthey come up in a search.\n\nThere are two more steps to successfully\
    \ getting your app graphics into \n\nyour app:\n\n**1.** Add them to the project.\n\
    \n**2.** Add their file names to the information property list, or \n\nname–Info.plist,\
    \ file.\n\nFinally, note that Chapter 12, “Using iTunes Connect and the App Store,”\
    \ \n\nprovides some additional guidelines and suggestions for how to graphically\
    \ \n\ndesign your app icons.\n\n**Adding files to your project**\n\nAdding files\
    \ to a project is another example of where Xcode is a lot like the \n\nMac OS\
    \ Finder. While you can’t use Finder to drag your new icon graphics \n\nfrom where\
    \ you first saved them to your project directory (and have them \n\nshow up in\
    \ the project), you can drag them from a Finder window to your \n\nGroups & Files\
    \ pane in Xcode. You can also add them via the Project > Add \n\nto Project menu.\n\
    \nIn either case, I suggest that you store your app icons in the Resource direc-\n\
    \ntory of your app. It’s important to note that the folders of an app project\
    \ \n\nthat you see in the Groups & Files pane are for your benefit, not Xcode’s.\
    \ \n\nIt’s a flat file structure, so where you keep your files is usually unimportant\
    \ \n\n(though there are a few exceptions). In this case, I simply suggest that\
    \ you \n\nkeep the icons in Resources so they don’t clutter your HTML directory.\
    \ \n\nPlus, the HTML directory is for app content, so the app icons don’t really\
    \ \n\nbelong there anyway.\n\nWhen you move the icons into the Resources folder\
    \ using one of the \n\naforementioned methods, be sure to check the box labeled\
    \ Copy Items Into \n\nDestination Group’s Folder (If Needed) before clicking Add\
    \ (and you can \n\nleave the top radio button regarding recursively creating groups\
    \ checked)."
  merge: -1
