  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**58**\n\n**Table 4.3** shows the size\
    \ specifications for the tab bar navigation, for \n\npurposes of laying out your\
    \ screen design.\n\n**TABLE 4.3 ****Dimensions of the iOS tab bar (in pixels)**\n\
    \n**ORIENTATION**\n\n**IPHONE /**\n\n**IPOD TOUCH**\n\n**IPHONE 4**\n\n**IPAD**\n\
    \nPortrait\n\n320 × 49\n\n640 × 98\n\n768 × 49\n\nLandscape\n\n480 × 49\n\n960\
    \ × 98\n\n1024 × 49\n\n**Navigating with table views**\n\n![](img/4d979018542def8748544c4af0d37f5a_70_0.png)\n\
    \nTable views (**Figure 4.10**) are at the heart of iOS applications. They are\
    \ \n\nubiquitous, from Apple apps that come installed on iOS devices (Settings,\
    \ \n\nMail, Contacts) to any app that delivers content to people.\n\nThis section\
    \ explores some of the types of table views that are possible, \n\nand dives into\
    \ how to implement them in your apps.\n\n4.10 A plain table \n\nview navigation.\n\
    \n**Plain table view**\n\nThe plain table view navigation shown in Figure 4.10\
    \ is as native as it gets: \n\nit’s a plain table with no adornments, and navigates\
    \ to additional screens \n\nin the app. In fact, it’s exactly like the table view\
    \ shown in Apple’s iPod \n\napplication (**Figure 4.11**)."
