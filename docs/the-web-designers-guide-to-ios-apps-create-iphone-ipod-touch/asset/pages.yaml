  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**16**\n\nIn order to design iOS applications,\
    \ you need to establish what I call your \n\napp design studio. This studio will\
    \ be the place in which you design, test, \n\nand package your applications for\
    \ submission to Apple.\n\nThe foundation of your studio will be an Intel-based\
    \ Mac with the Snow \n\nLeopard version of Mac OS X (operating system). And atop\
    \ that founda-\n\ntion will be Xcode, the integrated development environment (IDE)\
    \ created \n\nby Apple so that you, in turn, can design software for Apple. But\
    \ while \n\nApple designs some of its software for both Mac and Windows comput-\n\
    \ners (such as iTunes and Safari) and millions of iOS device owners sync \n\n\
    their devices to Windows computers daily, Xcode doesn’t run on the \n\nWindows OS.\n\
    \nOnce you have a Mac with the right processor and operating system, I \n\ncould\
    \ theoretically tell you to just download and install Xcode, and you \n\nwould\
    \ be ready to design iOS apps. But getting the free Xcode is not just \n\na simple,\
    \ one-step process, so let’s walk through how to do it in greater \n\ndetail.\
    \ We’ll be thorough, yet as quick as possible. After all, we’ve got apps \n\n\
    to design!\n\n**Getting an Apple Developer ID**\n\nTo install Xcode, you need\
    \ to download the iOS SDK (formerly the iPhone \n\nSDK; the name changed in July\
    \ 2010). But before you search for that, you \n\nneed to get an Apple Developer\
    \ ID.\n\nThe Apple Developer ID is your online identity for the entire app design,\
    \ \n\nreview, distribution, updating, and (if you’re selling your apps) compensa-\n\
    \ntion process. And, I suspect, because Apple would like you to eventually \n\n\
    participate in this entire process, they require you to register for the Apple\
    \ \n\nDeveloper ID before you can even download the iOS SDK. But fear not: \n\n\
    The Apple Developer ID itself is free, as is downloading the SDK.\n\nTo start\
    \ the ID process (**Figure 2.1**), visit \n\n**http://developer.apple.com/programs/register**."
  merge: -1
  pgno: 28
