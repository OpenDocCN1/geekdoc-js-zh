  md: "HTML5 AND CSS3 / MORE DESIGN OPTIONS WITH CSS3\n\n**153**\n\n![](img/4d979018542def8748544c4af0d37f5a_165_0.png)\n\
    \nThis will all look very nice on top of the most important section (high-\n\n\
    lighted): the black background with 50 percent opacity.\n\nNow create a title\
    \ bar at the top of the page by adding the following to the \n\nhead of main.html,\
    \ and use your newfound RGBA knowledge to pay par-\n\nticular attention to what’s\
    \ in the NKNavigationController JavaScript:\n\n**<script type=”text/javascript”>**\n\
    \n**var navController = new NKNavigationController();**\n\n**navController.setTitle(“Vegetables”);**\n\
    \n**navController.setTintColor(****0, 0, 0****);**\n\n**</script>**\n\nI know,\
    \ I cheated and highlighted it. But see the 0, 0 ,0 ? Hopefully you \n\nremember\
    \ this from Chapter 4 (see Implementing the title bar) — the RGB \n\nvalues that\
    \ NimbleKit uses to define the background color of the title bar \n\nwork the\
    \ same way they do in our CSS!\n\nAfter amping up the HTML and CSS with the above\
    \ code, and testing \n\nanew in Simulator, you should get the results shown in\
    \ **Figure 9.3**.\n\n9.3 The restyled vegetables screen, \n\nnow featuring a navigation\
    \ controller at \n\nthe top of the page and image labels \n\nthat have a nice\
    \ translucent effect \n\nthanks to RGBA.\n\nIt’s great to know that if you have\
    \ experience styling with some of the \n\nnewer CSS3 specifications like RGBA\
    \ (and border-radius, already used in \n\nChapter 6), you can use these skills\
    \ in NimbleKit-powered iOS applications."
