    \n**11**\n\nbehaviors by doing most of the heavy code lifting for us (which begs\
    \ the \n\nquestion: How much does code weigh?). The code to achieve some very\
    \ \n\nnifty behaviors has been pre-written for us into modules, and we just hook\
    \ \n\ninto these and use them without having to write everything from scratch.\
    \ \n\nIn fact, don’t forget the other important aspect of using a framework: The\
    \ \n\ncode has been thoroughly tested (and continues to be tested and updated\
    \ \n\non an ongoing basis) so we don’t have to debug our own code, either!\n\n\
    Similarly, there are iOS design frameworks that do the same thing for \n\niPhone\
    \ app design. The framework I’ve used the most is called NimbleKit \n\n(**Figure\
    \ 1.4**). This awesome tool has a bunch of Objective-C—already \n\nprewritten\
    \ for us—that performs native iOS functions and behaviors, and \n\nhas been developed\
    \ to be called into action with designs that use HTML, \n\nCSS, and JavaScript.\
    \ When you think about it, it’s very similar to using \n\nthese same languages\
    \ to make a web browser display particular content and \n\nbehave in a certain\
    \ way. We’re simply using a different code framework in \n\nthis case, and designing\
    \ for a particular operating system (iOS) and distri-\n\nbution network (iTunes).\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_23_0.png)\n\n1.4 NimbleKit is a \n\n\
    featured development tool \n\non Apple’s website."
