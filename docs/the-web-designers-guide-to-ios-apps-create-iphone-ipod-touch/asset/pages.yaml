  md: " THE IOS INTERFACE AND USER EXPERIENCE / DESIGNING WITH TAB BARS\n\n**57**\n\
    \n**tabController.setTabBarForPage(“****two.html****”, “****Menu****”, “****icon\\\
    _**\n\n**fork.png”);**\n\n**tabController.setTabBarForPage(“****three.html****”,\
    \ “****Tweets****”, **\n\n**“****icon\\_bird.png****”);**\n\nTake note of the\
    \ items in the code that you must set:\n\nr The first item is the page to which\
    \ the tab navigates.\n\nr The second item is the text label for the tab.\n\nr\
    \ The third item is the icon.\n\nI’ve found that designing a PNG image that is\
    \ 30 × 30 pixels with a trans-\n\nparent background works well for a tab icon.\
    \ Of course, beyond those basic \n\nspecifications, the scale and detail of the\
    \ image will determine whether it is \n\nrecognizable at that size. But as long\
    \ as the PNG is a solid image overlaying \n\na transparent background, the rest\
    \ of the native effects (gradient, glow, and \n\nwhite and blue colors) are applied\
    \ for free by NimbleKit and the operating \n\nsystem.\n\nSo what is the maximum\
    \ number of tabs you can display in a tab bar navi-\n\ngation? For the iPod touch\
    \ and iPhone it is five, and for the iPad it is eight. \n\nExcept you can actually\
    \ go beyond that—when you exceed the maximum \n\nnumber of tabs that the navigation\
    \ will display, it automatically adds a \n\nMore tab in the last position and\
    \ puts everything else into a table view \n\nnavigation (which you’ll learn more\
    \ about next) (**Figure 4.9**).\n\n![](img/4d979018542def8748544c4af0d37f5a_69_0.png)![](img/4d979018542def8748544c4af0d37f5a_69_1.png)\n\
    \nMore button\n\nTable View\n\n4.9 An iPod touch/iPhone \n\ntab bar navigation\
    \ with six \n\ncategories, demonstrating how \n\nthe More tab is automatically\
    \ \n\nadded by NimbleKit. Nice!"
