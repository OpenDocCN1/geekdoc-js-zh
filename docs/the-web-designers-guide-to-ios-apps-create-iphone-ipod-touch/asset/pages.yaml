    \n**tableView.insertRecord(“****Figs****”, “”, “”, “****0****”, “”, **\n\n**“****navController.gotoPage(‘6.html’)****”);**\n\
    \n**tableView.insertRecord(“****Guacamole****”, “”, “”, “****0****”, “”, **\n\n\
    **“****navController.gotoPage(‘7.html’)****”);**\n\n**tableView.insertRecord(“****Harissa****”,\
    \ “”, “”, “****0****”, “”, **\n\n**“****navController.gotoPage(‘8.html’)****”);**\n\
