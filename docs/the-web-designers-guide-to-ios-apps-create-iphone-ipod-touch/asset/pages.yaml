  md: "**49**\n\n*The iPod touch and iPhone screens—*\n\n*they’re so small! How is\
    \ it possible to *\n\n*design a quality user experience on some-*\n\n*thing as\
    \ tiny as 320 × 480 pixels?*\n\nComing from a large-screen environment where we\
    \ are \n\ntypically designing for 960 pixel, 1024 pixel, or even wider \n\nspaces,\
    \ these mobile screens at first seem impossibly \n\nsmall. But millions of people\
    \ are buying and using these \n\ndevices, and they aren’t doing it to torture\
    \ themselves—\n\nwe’re seeing some great user experiences on these \n\npocket\
    \ computers. They can be fun, easy, and even \n\ndelightful to use.\n\nSo what\
    \ makes this possible? How can we learn from \n\nApple’s own apps and from other\
    \ examples? This is \n\nwhat we’ll be focusing on in this chapter, as well as\
    \ \n\nsome of Apple’s suggestions for how to succeed on \n\nthe small screen.\n\
    \nAs we begin figuring out how to use this small piece of \n\nreal estate, it’s\
    \ important to take a look at everything \n\nApple has given us. This includes\
    \ walking the walk \n\nand talking the talk, so you’ll also be learning a new\
    \ \n\nvocabulary."
  merge: -1
  pgno: 61
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**50**\n\nLet’s start with the real\
    \ estate itself. **Figure 4.1** shows our 320 × 480 pixel \n\nscreen (and note\
    \ that in general discussions I will refer to the current \n\niPod touch and iPhone\
    \ 3GS screen size, though I will supplement with \n\niPhone 4 and iPad sizes where\
    \ appropriate):\n\n![](img/4d979018542def8748544c4af0d37f5a_62_0.png)\n\n320 px\n\
    \n480 px\n\n*Screen* is the most common term for the entirety of the view—it’s\
    \ not a \n\nwindow like on a desktop or laptop computer. Windows have close buttons,\
    \ \n\nminimize, and enlarge buttons, and they reside on a desktop. But an iOS\
    \ \n\napp screen just *is*—remember that this is a more immersive experience \n\
    \n(consider screens in movie theaters), so thinking in terms of screens is a \n\
    \nslight philosophical and practical change from designing less immersive, \n\n\
    windows-based websites\n\n**Figure 4.2** shows the *New York Times* app and examples\
    \ of the iOS inter-\n\nface elements that you’ll learn how to implement in this\
    \ chapter. The first \n\nelement of the iOS screen you’ll be introduced to is\
    \ the status bar.\n\n4.1 The standard size \n\niOS screen for iPod touch \n\n\
    and iPhone (pre-4), where \n\nmost iOS users are."
  merge: -1
  pgno: 62
- img_proc: true
  md: " THE IOS INTERFACE AND USER EXPERIENCE / WHAT IS THE STATUS BAR?\n\n**51**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_63_0.png)![](img/4d979018542def8748544c4af0d37f5a_63_1.png)\n\
    \nTitle bar \n\nStatus bar\n\nTable view \n\nTable view\n\nTab bar\n\nTab bar\n\
    \n**What is the status bar?**\n\n![](img/4d979018542def8748544c4af0d37f5a_63_2.png)\n\
    \nThe iOS status bar (**Figure 4.3**), located at the top of the screen, grounds\
    \ \n\nthe device screen with some key information that we’re all used to see-\n\
    \ning. If it’s an iPhone status bar, we see our cellular signal strength (or,\
    \ as is \n\noften the case, our lack of signal strength!). And regardless of the\
    \ device, \n\nwe also see whether we’re on a wireless internet connection and\
    \ what its \n\nstrength is.\n\n4.3 The iOS \n\nstatus bar.\n\nThe local time is\
    \ centered in the status bar. And a nice feature of this area is \n\nthat tapping\
    \ the center of the status bar is equivalent to a “Return to top of \n\npage”\
    \ link on a website. It quickly scrolls the screen back to the top. This is \n\
    \na user interface feature that works in any app, so that’s why all apps except\
    \ \n\nvideo games tend to include the status bar in their design.\n\nFinally,\
    \ the rightmost element in the status bar is, of course, the battery \n\ncharge\
    \ indicator.\n\nThe default color of the status bar is silver, but it can also\
    \ be set to black \n\nand black translucent. When using NimbleKit to trigger these\
    \ native \n\n4.2 The *New York *\n\n*Times* iOS application in \n\nportrait and\
    \ landscape \n\norientations."
  merge: -1
  pgno: 63
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**52**\n\nObjective-C settings, here’s\
    \ how to change the status bar to black using \n\nJavaScript:\n\n**var application\
    \ = new NKApplication();**\n\n**application.setStatusBarStyle(“****black****”);**\n\
    \nAnd for black translucent:\n\n**var application = new NKApplication();**\n\n\
    **application.setStatusBarStyle(“****blacktranslucent****”);**\n\nThe default\
    \ setting is, not surprisingly, “default.” Furthermore, if you’re not \n\nchanging\
    \ the color to black, don’t even worry about including this snip-\n\npet in your\
    \ app—it’s only necessary if you don’t want the default silver \n\nappearance.\n\
    \n**NOTE ****Using these examples in a NimbleKit-based app**\n\nIf you want to\
    \ try any of these code snippets as we go along, just open a new app \n\nin Xcode\
    \ and choose the NimbleKit option as explained in the last chapter. Enter \n\n\
    the code after **<script type=”text/javascript” src=”NKit.js”></**\n\n**script>**\
    \ in the main.html ﬁle that is provided in the HTML subdirectory. I’m omit-\n\n\
    ting opening and closing script tags in these samples to avoid repetition, so\
    \ be sure \n\nto wrap these examples with **<script type=”text/javascript”>**\
    \ and **</**\n\n**script>** like so:\n\n**<html>**\n\n**<head>**\n\n**<meta name\
    \ = “viewport” content = “initial-scale = 1.0, **\n\n**user-scalable = no” />**\n\
    \n**<script type=”text/javascript” src=”NKit.js”></script>**\n\n**<script type=\"\
    text/javascript\">**\n\n**<!—your NimbleKit JavaScript calls here -->**\n\n**</script>**\n\
    \n**</head>**\n\n**<body>**\n\n**<!—your content here -->**\n\n**</body>**\n\n\
    **</html>**\n\nAnd if you don’t want to type them, download the code samples at\
    \ \n\niosapps.tumblr.com."
  merge: -1
  pgno: 64
- img_proc: true
  md: " THE IOS INTERFACE AND USER EXPERIENCE / IMPLEMENTING THE TITLE BAR\n\n**53**\n\
    \nWhen the device is rotated and the app supports landscape orientation, \n\n\
    the status bar expands to fill the new width. So when planning app screen \n\n\
    designs, it’s important to take aspects like this into consideration. To help\
    \ \n\nyou with your planning, I will provide portrait and landscape dimen-\n\n\
    sions of iOS elements for all three devices. Let’s start with the status bar.\
    \ \n\nIn **Table 4.1**, I use the design term *portrait* to mean the standard,\
    \ upright \n\ndevice orientation and the term *landscape* to mean the rotated\
    \ or “side-\n\nways” orientation.\n\n**TABLE 4.1 ****Dimensions of the iOS status\
    \ bar (in pixels)**\n\n**ORIENTATION**\n\n**IPHONE /**\n\n**IPOD TOUCH**\n\n**IPHONE\
    \ 4**\n\n**IPAD**\n\nPortrait\n\n320 × 20\n\n640 × 40\n\n768 × 20\n\nLandscape\n\
    \n480 × 20\n\n960 × 40\n\n1024 × 20\n\n**Implementing the title bar**\n\n![](img/4d979018542def8748544c4af0d37f5a_65_0.png)\n\
    \nThe next major element of the iOS user interface is the title bar (**Figure\
    \ **\n\n**4.4**), located immediately below the status bar in an app screen. The\
    \ title \n\nbar is an absolutely critical element. As the name implies, it often\
    \ confirms \n\nthe title of an app upon launch. And the title bar functions much\
    \ like the \n\ntitle of a web page in a site: It’s the landmark that helps you\
    \ maintain your \n\nbearings as you move from screen to screen through the app.\n\
    \n4.4 The iOS \n\ntitle bar.\n\nThe title bar has a default Apple color of blue-gray.\
    \ Keeping the default \n\ncolor is a great design decision when you want to maximize\
    \ the “native-\n\nness” of your app.\n\nOn the other hand, setting a custom background\
    \ color for the title bar is \n\na nice design opportunity if you, your employer,\
    \ or your client wants to \n\nbrand an app a bit more. So I encourage you to consider\
    \ this option, too. \n\nSetting a custom color can be a nice way to enhance the\
    \ brand identity of \n\nan app while still keeping the familiar dimensions and\
    \ gradient."
  merge: -1
  pgno: 65
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**54**\n\n![](img/4d979018542def8748544c4af0d37f5a_66_0.png)![](img/4d979018542def8748544c4af0d37f5a_66_1.png)![](img/4d979018542def8748544c4af0d37f5a_66_2.png)![](img/4d979018542def8748544c4af0d37f5a_66_1.png)![](img/4d979018542def8748544c4af0d37f5a_66_4.png)![](img/4d979018542def8748544c4af0d37f5a_66_1.png)![](img/4d979018542def8748544c4af0d37f5a_66_6.png)\n\
    \nLet’s walk through how to do this. The basic JavaScript is below (and the \n\
    \nvariables you can change are highlighted)\n\n**var navController = new NKNavigationController();**\n\
    \n**navController.setTitle(“****Title Here****”);**\n\n**navController.setTintColor(****127****,\
    \ ****62****, ****152****);**\n\nNote that the NimbleKit library item is called\
    \ **NKNavigationController**\n\n(and not **NKTitleBar**). This is because as a\
    \ user navigates into an app (via a \n\ntable view or tab bar navigation), the\
    \ **NKNavigationController** automati-\n\ncally adds native back buttons so users\
    \ can return to where they started.\n\nRegarding the title displayed in the bar,\
    \ it has a limit, of course, and this \n\ndepends on the device you’re using—a\
    \ screen title on an iPod touch or \n\niPhone needs to be shorter than one on\
    \ an iPad. But keeping them short is \n\na good practice anyway. If you end up\
    \ choosing a title that’s too long, it will \n\nautomatically be truncated with\
    \ an ellipsis at the end.\n\nThe color setting uses RGB settings just like the\
    \ CSS **rgb** color property \n\ndoes. So in the previous code example, I selected\
    \ a violet hue to match a \n\nclient’s brand. I used Adobe Photoshop to open a\
    \ file with the color palette \n\nin it, and used the Color Picker (**Figure 4.5**)\
    \ to tell me what the RGB \n\nvalues were.\n\n4.5 Using the Color \n\nPicker in\
    \ Photoshop \n\nto find out a hue’s \n\nRGB values.\n\nNote that the gradient\
    \ effect comes standard with the NimbleKit title bar.\n\n**Table 4.2** shows the\
    \ size of the title bar on the various iOS devices and in \n\nboth portrait and\
    \ landscape orientations for your planning purposes."
  merge: -1
  pgno: 66
- img_proc: true
  md: " THE IOS INTERFACE AND USER EXPERIENCE / DESIGNING WITH TAB BARS\n\n**55**\n\
    \n**TABLE 4.2 ****Dimensions of the iOS title bar (in pixels)**\n\n**ORIENTATION**\n\
    \n**IPHONE /**\n\n**IPOD TOUCH**\n\n**IPHONE 4**\n\n**IPAD**\n\nPortrait\n\n320\
    \ × 44\n\n640 × 88\n\n768 × 44\n\nLandscape\n\n480 × 44\n\n960 × 88\n\n1024 ×\
    \ 44\n\n**Designing with tab bars**\n\n![](img/4d979018542def8748544c4af0d37f5a_67_0.png)\n\
    \nThe tab bar (**Figure 4.6**) gets us into more interesting iOS user experience\
    \ \n\nterritory, as it’s one of the principal ways to navigate between different\
    \ \n\nscreens in a single application.\n\n4.6 The iOS tab bar.\n\n**Tab bar with\
    \ standard categories**\n\nNow you’ll learn how to code the sample displayed in\
    \ Figure 4.6. In this \n\nexample, there are three tabs that navigate to three\
    \ other pages. Each tab \n\nhas two components: the titles (Favorites, Featured,\
    \ and Top Rated) and \n\nan icon for each.\n\nThis first example does a lot of\
    \ heavy lifting for you, because NimbleKit is \n\nable to call some of these native\
    \ items that are built right into the operating \n\nsystem. In other words, both\
    \ the titles and the icons come for free.\n\nThe basic JavaScript for this is\
    \ (variables you can change are highlighted)\n\n**var tabController = new NKTabBarController();**\n\
    \n**tabController.setTabBarForPage(“****main.html****”, “”, “****1****”);**\n\n\
    **tabController.setTabBarForPage(“****two.html****”, “”, “****2****”);**\n\n**tabController.setTabBarForPage(“****three.html****”,\
    \ “”, “****3****”);**\n\nThe way this works is that the page names for each tab\
    \ are HTML file \n\nnames. The second setting is for tab labels (covered in the\
    \ next example), \n\nand the third setting refers to built-in categories and icons.\
    \ The tab label \n\nsettings in the previous code listing are left blank because\
    \ they’re not used \n\nwhen calling built-in tab categories (which are automatically\
    \ labeled)."
  merge: -1
  pgno: 67
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**56**\n\nThere are currently eleven\
    \ built-in categories and icons (**Figure 4.7**).\n\n![](img/4d979018542def8748544c4af0d37f5a_68_0.png)![](img/4d979018542def8748544c4af0d37f5a_68_1.png)![](img/4d979018542def8748544c4af0d37f5a_68_2.png)\n\
    \n1\\. Favorites\n\n5\\. Contacts\n\n9\\. Downloads\n\n![](img/4d979018542def8748544c4af0d37f5a_68_3.png)![](img/4d979018542def8748544c4af0d37f5a_68_4.png)![](img/4d979018542def8748544c4af0d37f5a_68_5.png)\n\
    \n2\\. Featured\n\n6\\. History\n\n10\\. Most Recent\n\n![](img/4d979018542def8748544c4af0d37f5a_68_6.png)![](img/4d979018542def8748544c4af0d37f5a_68_7.png)![](img/4d979018542def8748544c4af0d37f5a_68_8.png)\n\
    \n3\\. Top Rated\n\n7\\. Bookmarks\n\n11\\. Most Viewed\n\n![](img/4d979018542def8748544c4af0d37f5a_68_9.png)![](img/4d979018542def8748544c4af0d37f5a_68_10.png)\n\
    \n4\\. Recents\n\n8\\. Search\n\n**NOTE ****The titles and icons are free, but\
    \ not the functionality**\n\nWhat you get for “free” here are only the tab button\
    \ titles and icons, not the associ-\n\nated functionality that would go with them.\
    \ In other words, making a tab called \n\nContacts doesn’t automatically create\
    \ a contacts screen for you.\n\n![](img/4d979018542def8748544c4af0d37f5a_68_11.png)\n\
    \n**Tab bar with custom categories**\n\nOn the other hand, you may not need these\
    \ categories. In that case, you’ll \n\nwant to assign your own labels to the tabs.\
    \ In fact, you can even design \n\nyour own icons and have them integrated into\
    \ a tab bar. **Figure 4.8** shows \n\na sample tab bar I’ve designed to demonstrate\
    \ this.\n\n4.8 Design your own \n\ncustom tab navigation.\n\nHere’s how the JavaScript\
    \ differs for a custom version:\n\n**var tabController = new NKTabBarController();**\n\
    \n**tabController.setTabBarForPage(“****main.html****”, “****Location****”, **\n\
    \n**“****icon\\_globe.png****”);**\n\n4.7 The built-in tab \n\nnavigation categories."
