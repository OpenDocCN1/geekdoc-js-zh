  md: "FUNDAMENTALS OF THE IOS SDK / STARTING A NEW XCODE PROJECT\n\n**35**\n\nAfter\
    \ adding the files to the bundle in this manner, you have to update your \n\n\
    project’s Information property list (.plist) file. If you highlight the .plist\
    \ \n\nfile in the Groups & Files view (you will find it in the Resources folder),\
    \ \n\nseveral rows of data are displayed in the Editor view. Select the Icon file\
    \ row \n\nto highlight it, and some small up and down arrows will appear. Click\
    \ on \n\nthem and you’ll get a dropdown menu of all of the data types that can\
    \ be \n\nspecified in the .plist file for your app. Few of these are used or changed\
    \ for \n\na NimbleKit-based application, but in this case just change Icon file\
    \ to Icon \n\nFiles. Now you can add more than one icon to your application bundle.\n\
    \nAfter you do this, you’ll get a large gray disclosure arrow to the left. Click\
    \ \n\non it and you’ll see the first icon row, Item 0 (**Figure 3.7**). Enter\
    \ Icon.png \n\nas the first icon file. For each additional icon file that you’re\
    \ bundling into \n\nyour app, click the + button to the right of the row and you’ll\
    \ get a new \n\nrow with one item number larger. Repeat until all your icon files\
    \ are listed \n\n(but don’t include the 512 × 512 iTunes icon, which is not bundled\
    \ into the \n\nproject file).\n\n![](img/4d979018542def8748544c4af0d37f5a_47_0.png)\n\
    \n**Designing a launch graphic**\n\nThe launch graphic for an app is not necessarily\
    \ what you think it is. It is \n\nnot meant to be a title screen for your app\
    \ (though if you design it this way, \n\nApple might still accept it). But Apple\
    \ recommends including a launch \n\ngraphic for user experience reasons, not marketing\
    \ reasons. And here’s why.\n\nIt usually takes a few seconds for an app to launch\
    \ and get its act together, \n\nso Apple has made a provision for a launch graphic\
    \ to display during the \n\napp’s launch process. But here’s the catch: You can’t\
    \ control how long the \n\ngraphic displays, so you can’t specify that it show\
    \ for a certain period of \n\n3.7 Your app icons in the \n\nproject’s Resources\
    \ folder \n\n(Groups & Files and Detail \n\nviews) and as listed in the \n\n.plist\
    \ file (Editor view)."
  merge: -1
