  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**36**\n\n![](img/4d979018542def8748544c4af0d37f5a_48_0.png)![](img/4d979018542def8748544c4af0d37f5a_48_1.png)\n\
    \ntime (for example, if there’s a line or two of text on it for the user to read).\
    \ \n\nAnd for a smaller or more quickly loading app, the load time might be \n\
    \npretty fast, so the launch graphic flashes only briefly on the screen.\n\nStill,\
    \ the graphic is intended to serve a particular purpose and provide a \n\nsmoother\
    \ transition between the home screen and the app. This prevents \n\nthe user from\
    \ being jolted from the home screen to a completely blank \n\nscreen and then\
    \ to your app. You’re welcome to read a more detailed expla-\n\nnation of this\
    \ in Apple’s human interface guidelines for the iPhone and \n\niPad, but the main\
    \ takeaway is this: Design the launch graphic to look as \n\nmuch like the initial\
    \ view of the app as you can, minus any content, and this \n\nwill help your app\
    \ reinforce Apple’s preferred iOS user experience.\n\nTo better understand this,\
    \ let’s look at what Apple has done with one of \n\nits own apps. Although we\
    \ use some of these apps all the time, the very \n\neffectiveness of their design\
    \ details is often lost on us. So we need to look \n\na little more closely and\
    \ stop the action. It’s like dissecting a frog in science \n\nclass. Sure, we\
    \ know that a frog can hop far, but we can’t see all the reasons \n\nwhy until\
    \ we have a closer look at its legs! And, er, we need to stop the frog in \n\n\
    order to take an even closer look inside at the bones and muscles used to hop.\n\
    \nBut in this case, you don’t need to kill an app to dissect it. **Figure 3.8**\
    \ shows \n\nsome screenshots of Apple’s Clock app on the iPhone to illustrate\
    \ my point.\n\n3.8 The launch graphic \n\n(left) and alarm screen \n\n(right)\
    \ in the Clock app.\n\nNote how the launch graphic incorporates the pinstripe\
    \ background of the \n\napp as well as the tab bar navigation at the bottom of\
    \ the screen. And after \n\nClock finishes launching on my iPhone and I go to\
    \ my Alarm view, I see the \n\nimage shown on the right in Figure 3.8. The two\
    \ alarms that I’ve set appear, \n\nthe Alarm tab is highlighted, and a few items\
    \ (an Edit button, the Alarm \n\ntitle, and a + button for adding a new alarm)\
    \ appear in the navigation bar."
  merge: -1
