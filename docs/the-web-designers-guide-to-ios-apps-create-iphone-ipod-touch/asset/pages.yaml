  md: " ADDITIONAL GUIDING PRINCIPLES / APP PLANNING\n\n**231**\n\nSo have a meeting.\
    \ Write things down. Design a cute team roster document \n\nif you need to. Heck,\
    \ give everyone a team jersey if that’s what it takes. But \n\ndo not proceed\
    \ with a project until the roles and responsibilities are clearly \n\nestablished.\n\
    \n**Develop a project charter**\n\nLynch and Horton offer especially helpful advice\
    \ when it comes to develop-\n\ning a project charter for web projects and, here\
    \ again, I find their ideas just \n\nas useful for designing app projects.\n\n\
    A project charter is a simple yet comprehensive document that defines the \n\n\
    basic parameters of the project. It should ideally begin with the following \n\
    \nitems:\n\nr the client’s (or client’s or employer’s organization’s) mission\n\
    \nr the top two or three goals for the app\n\nr the audience of the app\n\nr a\
    \ description of how designing this app will meet the app’s goals, and \n\nsupport\
    \ the client’s mission\n\nr any measures of success for the app\n\nThe more of\
    \ these bullet points you can define with clarity and brevity \n\n(because no\
    \ one likes to read complicated, nebulous, or wordy goals), the \n\nhigher the\
    \ odds that you, your client, and your users will be happy with \n\nthe app. Similarly,\
    \ the fewer you define with clarity and brevity, the more \n\nambiguous the project\
    \ will be. This will lead to false expectations, confu-\n\nsion, misunderstanding,\
    \ and hard feelings. And once people are unhappy, it \n\nmakes for a very long\
    \ and possibly unsuccessful project.\n\nBut a project charter need not stop with\
    \ organizational and programmatic \n\ngoals. It should also summarize the roles\
    \ and responsibilities of the people \n\ninvolved as discussed in the previous\
    \ section. And as long as it’s covering \n\nthese practical matters, how about\
    \ costs and budgets, deadlines and other \n\nmilestones along the way, any expected\
    \ advertising or marketing costs, \n\ncommunications plans, and so forth? Some\
    \ of these items can eventually \n\nbecome detailed documentation in their own\
    \ right, but as items in a project \n\ncharter they just need to be there in some\
    \ capacity. Make them short-and-\n\nsweet list items if possible, and use ballpark\
    \ estimates when precise figures \n\nare not available; this will help you refine\
    \ them later."
  merge: -1
