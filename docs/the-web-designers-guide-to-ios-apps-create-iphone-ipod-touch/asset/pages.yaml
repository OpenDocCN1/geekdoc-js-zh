  md: "PROVISIONING AND DISTRIBUTING YOUR APPS / ADDING AND MANAGING APPLICATIONS\n\
    \n**215**\n\n![](img/4d979018542def8748544c4af0d37f5a_227_0.png)\n\nApp approval\
    \ time varies a lot (for me it has taken as little as two days and \n\nas much\
    \ as three weeks). The important thing to know here is that Avail-\n\nability\
    \ Date can be left as it is preset (to today’s date), which means that \n\nyour\
    \ app will go on sale as soon as it is approved because that date will \n\nobviously\
    \ be after this availability date of today. Or, if you know that there \n\nare\
    \ a bunch of corporate marketing and PR reasons for launching a client’s \n\n\
    app on a particular date in the future, you can set the date accordingly.\n\n\
    Price Tier is labeled a bit strangely because Tier 1 is really just $1 (or, tech-\n\
    \nnically, $0.99). The tiers in the dropdown list go to Tier 85, and I hope that\
    \ \n\nif you are submitting an app to sell for $84.99 and it actually moves at\
    \ this \n\nprice point, you will be sending me a small cut of the proceeds for\
    \ getting \n\nyou there.\n\nAnd what if you have an app to sell for more than\
    \ that? (Yes, they are out \n\nthere.) Apparently you need to give Apple a call\
    \ for some special treat-\n\nment—I don’t know how to submit an app for a price\
    \ tier higher than what \n\nis in the dropdown menu.\n\nThe Discount for Educational\
    \ Institutions checkbox enables schools, \n\ncolleges, and universities to purchase\
    \ your app in bulk at a 50 percent \n\ndiscount. If you’re interested in this\
    \ opportunity, read more about it on \n\nApple’s website and check this box when\
    \ submitting your app.\n\nUpon completion of this screen, click Continue and the\
    \ Version Informa-\n\ntion screen appears (**Figure 12.14** on the next page).\n\
    \n12.13 Determining rights \n\nand pricing for your app."
