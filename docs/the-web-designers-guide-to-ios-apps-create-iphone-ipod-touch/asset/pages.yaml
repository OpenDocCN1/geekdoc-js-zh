    \ app code) and Simula-\n\ntor (for testing your app along the way).\n\n**NOTE\
    \ ****Other things in the SDK**\n\nAnother useful tool in the download is Dashcode,\
    \ which has a more graphic and \n\nobject-oriented approach to designing web apps\
    \ that live on servers (rather than \n\nbeing downloaded and installed on devices).\
    \ While this book does not cover web \n\napp design, many of the native app design\
    \ skills you’ll learn here can be applied \n\nto designing web apps, which can\
    \ then be viewed on any mobile device with a \n\nstandards-based web browser.\
    \ There are several other tools in the SDK, too, such \n\nas Interface Builder\
    \ and a variety of diagnostic tools. These are not necessary for the \n\napps\
    \ and methods covered in this book, but might be of interest if you decide to\
    \ try \n\nyour hand at writing your own Objective-C.\n\nTo start your adventurous\
    \ download (**Figure 2.4**), visit \n\n**http://developer.apple.com/devcenter/ios/**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_33_0.png)\n\n2.4 The iOS Dev Center,\
    \ \n\nyour resource for iOS \n\ndevelopment."
  merge: -1
