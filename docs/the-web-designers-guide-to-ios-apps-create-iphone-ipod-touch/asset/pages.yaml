  md: "FUNDAMENTALS OF THE IOS SDK / STARTING A NEW XCODE PROJECT\n\n**37**\n\nThe\
    \ launch graphic eased me into this view very smoothly—it’s like a \n\nthree-page\
    \ flip book, and when it’s designed according to Apple’s specs it’s \n\njust as\
    \ convincing as a well-drawn cartoon animation.\n\nAs you might have guessed,\
    \ the launch graphic also needs to be sized to the \n\ndevice. **Table 3.2** shows\
    \ the specs.\n\n**TABLE 3.2 ****Size (in pixels) and name specifications for iOS\
    \ launch graphics**\n\n**ORIENTATION**\n\n**IPHONE / **\n\n**IPOD TOUCH**\n\n\
    **IPHONE 4**\n\n**IPAD**\n\nPortrait\n\n320 × 480 \n\n(Default.png)\n\n640 × 940\
    \ \n\n(Default@2x.png)\n\n768 × 1004 \n\n(Default-Portrait-\n\nipad.png)\n\nLandscape\n\
    \nn/a\n\nn/a\n\n1024 × 748 (Default-\n\nLandscape-ipad.\n\npng)\n\nAfter adding\
    \ your image files to your Resources folder, you need to modify \n\nyour property\
    \ list file just like you do when you add your app icons. Xcode \n\nallows you\
    \ to specify launch images for both the iPhone and iPad plat-\n\nforms. Add the\
    \ Default.png and Default-Portrait-ipad.png images to the \n\nlist. Following\
    \ the naming conventions shown in Table 3.2 allows your \n\napp to automatically\
    \ load the iPhone 4 image when the app runs on an \n\niPhone and allows the iPad\
    \ landscape image to automatically load when in \n\nlandscape mode on the iPad.\
    \ When you’re all done, **Figure 3.9** (on the next \n\npage) displays what you\
    \ should see.\n\n![](img/4d979018542def8748544c4af0d37f5a_49_0.png)\n\n3.9 The\
    \ Groups & Files \n\npane shows the launch \n\nimage files and the info.\n\nplist\
    \ file shows the launch \n\nimages specified for \n\niPhone and iPad."
