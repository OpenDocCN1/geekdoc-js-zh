  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**40**\n\n![](img/4d979018542def8748544c4af0d37f5a_52_0.png)\n\
    \n3.11 A new NimbleKit \n\napp after installation on the \n\niPhone Simulator.\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_52_1.png)\n\nIf you want to tinker\
    \ with the Simulator a bit, do so now. It behaves just like \n\na real iPhone\
    \ with a few exceptions, like not having several of the stan-\n\ndard apps (including\
    \ Camera, Maps, Calendar, and so on). Also note that \n\nbecause there is no App\
    \ Store app, you can’t purchase and install other apps \n\non Simulator—you can\
    \ only install them through Xcode.\n\nAfter playing with the screen version of\
    \ the iPhone, try testing your univer-\n\nsal app in the iPad Simulator. Close\
    \ the Simulator, toggle back to Xcode, \n\nthen use the Overview menu to specify\
    \ iPad Simulator 3.2 as the Active \n\nExecutable instead. Click the trusty Build\
    \ and Run button again and you’ll \n\nsee a slightly different view of the new\
    \ NimbleKit app, this time in the iPad \n\nSimulator (**Figure 3.12**).\n\n3.12\
    \ A new NimbleKit \n\napp after it’s been installed \n\non the iPad Simulator."
