  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**102**\n\n![](img/4d979018542def8748544c4af0d37f5a_114_0.png)\n\
    \nWhen tested on an iPhone, the results of this work look like what’s shown \n\
    \nin **Figure 6.1**.\n\n6.1 Our app screen using **NKMapView**\n\nwith **NKButton**.\n\
    \nYou can do this exercise and still partially test it in Simulator, but because\
    \ \n\nSimulator doesn’t have the Maps app on it, the button causes Google Maps\
    \ \n\nto open in Safari instead. Full testing requires you to provision and test\
    \ on \n\nan iPhone, iPod touch, and iPad.\n\n**Method two: Styling an HTML button**\n\
    \nThis next method uses a CSS-styled HTML button instead of **NKButton**.\n\n\
    My example is only one way to style a button with CSS: The idea here is \n\nthat\
    \ with styles (and especially with additional elements like graphics files), \n\
    \nyou can design a more branded appearance with this detail.\n\n**Planning the\
    \ screen layout**\n\nIn this map example, I’ll continue using the status bar,\
    \ title bar, and tab bar \n\npage layout from our previous examples. The reason\
    \ for this is practical: \n\nA map screen in an app will probably be one of multiple\
    \ screens. Because"
