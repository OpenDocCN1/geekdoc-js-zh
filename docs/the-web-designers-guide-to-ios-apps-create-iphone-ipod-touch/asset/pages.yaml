  md: "MARKETING YOUR APPS / USING APPLE’S MARKETING ASSETS\n\n**191**\n\nr You are\
    \ not limited to a white or black background as you might expect \n\nfrom Apple,\
    \ but they do expect you to make a judgment call about the \n\nbadge remaining\
    \ legible and being clear of visual clutter or patterned \n\nbackgrounds.\n\n\
    r You *must* link to your application on the App Store whenever the badge \n\n\
    is used. To get your app’s URL, find it in iTunes and select Copy Link \n\nin\
    \ the small dropdown menu located under the app icon (**Figure 11.2**). \n\nUse\
    \ this URL either as a link from your own website or as copy in other \n\npromotional\
    \ materials.\n\n![](img/4d979018542def8748544c4af0d37f5a_203_0.png)\n\nFor additional\
    \ details, refer to Apple’s App Marketing and Identity Guide-\n\nlines for Developers,\
    \ available as a PDF in the iOS Dev Center.\n\n**Using official iOS device images**\n\
    \nOnce you agree to the App Marketing Artwork License Agreement and \n\ndownload\
    \ the graphics provided by Apple, you are eligible to use the official \n\niOS\
    \ device images that are downloadable from the iOS Dev Center website.\n\nAs you\
    \ have probably guessed, Apple has a handful of guidelines regarding \n\nyour\
    \ use of these images, too:\n\nr Use only Apple-provided device images in your\
    \ app’s promotional mate-\n\nrials. Do not take your own photos of your app running\
    \ on a device, \n\nalthough taking your own screenshots is allowed and, in fact,\
    \ necessary \n\n11.2 How to copy an \n\napp’s URL in the App \n\nStore."
  merge: -1
