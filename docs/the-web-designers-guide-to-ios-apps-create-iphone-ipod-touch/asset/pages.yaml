  md: "FOCUS ON APP CONTENT: VIDEO / DELIVERING VIDEO WITH NKVIDEOPLAYER\n\n**133**\n\
    \n**Delivering video with NKVideoPlayer**\n\n![](img/4d979018542def8748544c4af0d37f5a_145_0.png)\n\
    \nThis next method of incorporating video uses NimbleKit’s **NKVideoPlayer**\n\
    \nlibrary item. It differs from the HTML5 video element in that it \n\ndoesn’t\
    \ have an embedded play mode. Instead, playing a video with \n\n**NKVideoPlayer**\
    \ calls up a native video player overlay, and this behavior is \n\nconsistent\
    \ across all three iOS devices.\n\nTo see how this works, use the same assets\
    \ from the previous example but \n\nchange it up a bit at the point where you\
    \ create a new Xcode project. This \n\ntime, select iPhone/iPad as shown in **Figure\
    \ 8.6** to create what is called a \n\n*universal app*—that is, one app that will\
    \ run natively in full-screen mode on \n\nthe iPad as well as on the iPhone and\
    \ iPod touch.\n\n8.6 Creating a \n\nuniversal app that \n\nwill run full screen\
    \ \n\non iPad, iPhone, and \n\niPod touch.\n\nAside from making this choice when\
    \ you start the new project, there’s \n\nnothing else to do differently until\
    \ you test the app in Simulator.\n\nAfter Xcode opens the new project, you can\
    \ begin editing main.html right \n\naway by adding the following JavaScript to\
    \ the head of the page:\n\n**<script type=”text/javascript”>**\n\n**var navController\
    \ = new NKNavigationController();**\n\n**navController.setTitle(“iPhone Video\
    \ Example”);**\n\n**navController.setTintColor(0, 102, 255);**\n\n**var videoPlayer\
    \ = new NKVideoPlayer();**\n\n**videoPlayer.openFileName(“clip.m4v”);**\n\n**function\
    \ NKIsPageSupportsAutoOrientation()**"
