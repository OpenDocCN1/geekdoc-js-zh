  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**22**\n\nUnder the page heading, there\
    \ is a View menu where there are often (but \n\nnot always) two tabs: one for\
    \ the current released version of the SDK and \n\none for the beta version of\
    \ the next release. I encourage you to download \n\nthe released version. The\
    \ betas are really only useful for more advanced \n\napplication designers who\
    \ are staying ahead of the curve; the betas help \n\nthem design apps that take\
    \ advantage of new device or software features \n\nbefore they actually hit the\
    \ marketplace.\n\nAssuming you are just downloading the SDK to design for the\
    \ current \n\nrelease, proceed with that process. Once the download is complete,\
    \ you \n\nshould have a large .dmg file in your Downloads directory. At the time\
    \ of \n\nthis writing, the iOS SDK 4.1 download was 2.17 gigabytes. Double-click\
    \ \n\nit, follow the prompts and directions, and when you reach the end you’ll\
    \ \n\nhave the first part of your design studio in place!\n\nNow it’s time to\
    \ download and install NimbleKit, your Objective-C \n\nframework.\n\n**Downloading\
    \ and installing NimbleKit**\n\n![](img/4d979018542def8748544c4af0d37f5a_34_0.png)\n\
    \nAren’t you glad to read that the last step is super-easy and requires no \n\n\
    elaboration? I bet you are!\n\n**1.** To download NimbleKit (**Figure 2.5**),\
    \ visit \n\n**http://www.nimblekit.com/**.\n\n2.5 The NimbleKit \n\nwebsite.\n\
    \n**NOTE ****Directory **\n\n**location of the SDK**\n\nNote that Xcode and its\
    \ \n\nrelated iOS SDK apps \n\nare not installed in your \n\nregular Applications\
    \ direc-\n\ntory. If you went with the \n\ndefault location, these \n\napplications\
    \ were installed \n\non your drive’s Developer \n\ndirectory, just one folder\
    \ in \n\nfrom the root."
  merge: -1
  pgno: 34
