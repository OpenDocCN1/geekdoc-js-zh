  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**82**\n\n**Working with images**\n\
    \nWe’ve talked about some ways of working with text content. Working with \n\n\
    images in NimbleKit is also fairly simple. There are two main methods to \n\n\
    display images: within an app’s content (inline), and as an image overlay.\n\n\
    **Images in content**\n\nPlacing images inline is just as easy as doing it in\
    \ a web page:\n\n**<img src=”ﬁlename.jpg” width=”x” height=”y” **\n\n**class=”classname”>**\n\
    \nAnd by assigning an image a CSS class, you’re empowered to style it as \n\n\
    you wish.\n\nLet’s revisit the example of the Bill of Rights structured as a definition\
    \ list. \n\nWouldn’t it look better with a photo of a bald eagle above it? Sure\
    \ it would!\n\nAnd it just so happens that I have a nice JPG of an eagle to add,\
    \ sized for the \n\niPhone (**Figure 5.7**).\n\n![](img/4d979018542def8748544c4af0d37f5a_94_0.png)\n\
    \nLet’s add it to the HTML, right above the text:\n\n**<img src=”eagle.jpg” width=”280”\
    \ height=”206”>**\n\n**<h1>United States Bill of Rights</h1>**\n\n**<dl>**\n\n\
    **<dt>1<sup>st</sup> Amendment</dt>**\n\n**<dd>Congress shall make no law respecting\
    \ an establishment **\n\n**of religion, or prohibiting the free exercise thereof;\
    \ or **\n\n**abridging the freedom of speech, or of the press; or the **\n\n**right\
    \ of the people peaceably to assemble, and to petition **\n\n**the Government\
    \ for a redress of grievances.</dd>**\n\n5.7 Photo of a bald eagle \n\nto place\
    \ inline in the Bill of \n\nRights text content."
  merge: -1
  pgno: 94
- img_proc: true
  md: "FOCUS ON APP CONTENT: TEXT AND IMAGES / WORKING WITH IMAGES\n\n**83**\n\n**<dt>2<sup>nd</sup>\
    \ Amendment</dt>**\n\n**<dd>A well regulated Militia, being necessary to the **\n\
    \n**security of a free State, the right of the people to keep **\n\n**and bear\
    \ Arms, shall not be infringed.</dd>...**\n\n**</dl>**\n\n**Figure 5.8** shows\
    \ the results.\n\n![](img/4d979018542def8748544c4af0d37f5a_95_0.png)\n\nThis works\
    \ predictably well but could certainly use some more styling. In \n\nfact, the\
    \ image runs right up to the left, top, and right edges of the screen—\n\nand\
    \ that looks fine—but the text content could use a margin. As long as \n\nwe’re\
    \ considering that, why not add a margin around the photo? And as \n\nlong as\
    \ we’re doing that, why not try out some CSS3 and see whether add-\n\ning rounded\
    \ corners finishes it off with a bit more style?\n\nTo do this, let’s start by\
    \ proportionally resizing the image a bit smaller so \n\nthere’s a margin of 20\
    \ pixels around it:\n\n**<img src=”eagle.jpg” width=”280” height=”206”>**\n\n\
    To match this, add 20 pixels of margin to the body. This can be done \n\nwith CSS:\n\
    \n**body {margin: 20px;}**\n\n5.8 The Bill of Rights definition \n\nlist with\
    \ the eagle image added."
  merge: -1
  pgno: 95
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**84**\n\nFinally, let’s add some CSS3\
    \ curviness with border-radius; with NimbleKit, \n\nyou don’t even need to use\
    \ the WebKit version. It understands the straight \n\nCSS3 style just fine:\n\n\
    **img {border-radius: 15px;}**\n\nAdding a margin and rounded corners creates\
    \ a more finished product \n\n(**Figure 5.9**).\n\n![](img/4d979018542def8748544c4af0d37f5a_96_0.png)\n\
    \nI hope this demonstrates some of the exciting design possibilities available\
    \ \n\nto you as a web designer using NimbleKit with CSS3. (We’ll explore more\
    \ \n\nCSS3 fun later in Chapter 9.)\n\n**Image overlays**\n\nImages can be more\
    \ than just inline content in iOS apps. NimbleKit also \n\nsupports a method of\
    \ placing an image on top of a content screen called \n\n**NKImageView.** Here’s\
    \ how it works.\n\nSimilar to using **NKTableView**, **NKImageView** is specified\
    \ with JavaScript \n\nin the head of an HTML file. First, we need to create a\
    \ new variable and call \n\non the **NKImageView** control.\n\n5.9 The Bill of\
    \ Rights \n\ndefinition list with the \n\nimage added, now \n\nfeaturing margins\
    \ and \n\nrounded corners!"
  merge: -1
  pgno: 96
- img_proc: true
  md: "FOCUS ON APP CONTENT: TEXT AND IMAGES / WORKING WITH IMAGES\n\n**85**\n\nLet’s\
    \ see how this would work in a hypothetical iOS app that teaches people \n\nabout\
    \ outdoor wilderness areas. **Figure 5.10** shows a text screen about the \n\n\
    Boundary Waters Canoe Area Wilderness in northeastern Minnesota, one \n\nof my\
    \ favorite places to go on vacation.\n\n![](img/4d979018542def8748544c4af0d37f5a_97_0.png)\n\
    \nHere’s the HTML file that, when added to a new NimbleKit-based Xcode \n\nfile,\
    \ creates the screen shown in Figure 5.10:\n\n**<html>**\n\n**<head>**\n\n**<meta\
    \ name = “viewport” content = “initial-scale = 1.0, **\n\n**user-scalable = no”\
    \ />**\n\n**<script type=”text/javascript” src=”NKit.js”></script>**\n\n**</head>**\n\
    \n**<body>**\n\n**<h1>Boundary Waters</h1>**\n\n**<p>The Boundary Waters is a\
    \ region of wilderness **\n\n**straddling the Canada-United States border between\
    \ Ontario **\n\n**and Minnesota, in the region just west of Lake Superior. **\n\
    \n**The name “Boundary Waters” is often used in the U.S. **\n\n**to refer speciﬁcally\
    \ to the Boundary Waters Canoe Area **\n\n**Wilderness.</p>**\n\n5.10 Text about\
    \ the Boundary Waters \n\n(paraphrased from Wikipedia)."
  merge: -1
  pgno: 97
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**86**\n\n**<p>The region is characterized\
    \ by a vast network of **\n\n**waterways and bogs within a glacially carved landscape.\
    \ **\n\n**It is a popular destination for recreationalists pursuing **\n\n**camping,\
    \ canoeing, and ﬁshing, as well as for those simply **\n\n**looking for natural\
    \ scenery and relaxation.</p>**\n\n**<p>Source &mdash; http://.en.wikipedia.org</p>**\n\
    \n**</body>**\n\n**</html>**\n\nThis is a good start, but it’s pretty boring.\
    \ We need to add some style, as \n\nwell as the **NKImageView** control so the\
    \ app’s users can see an image of the \n\nBoundary Waters. First, the **NKImageView**—let’s\
    \ give this instance the \n\nname **photo**:\n\n**var photo = new NKImageView;**\n\
    \nNext, create a toolbar at the bottom of the screen. It will contain a button\
    \ \n\nfor showing the photo:\n\n**var toolBar = new NKToolBar();**\n\n**toolBar.init(416);**\n\
    \n**toolBar.addButton(“Show photo”, “”, “”);**\n\n**toolBar.setStyle(“blacktranslucent”);**\n\
    \n**toolBar.show();**\n\nThere are several things going on here:\n\n**1.** The\
    \ first line of code initializes the NKToolbar control and declares \n\na variable\
    \ name for it—this is called toolBar.\n\n**2.** The next line positions the toolbar\
    \ on the screen on the y-axis. If you \n\nstart with the full height of the screen\
    \ (480 pixels), subtract 20 pixels \n\nfor the status bar, and then subtract 44\
    \ pixels for the height of the tool-\n\nbar, the upper edge of the toolbar is\
    \ placed at 416.\n\n**3.** The next line adds a button labeled “Show photo.”\n\
    \n**4.** The last two lines make the toolbar translucent black and display it\
    \ on \n\nscreen.\n\nNow we need an image to add to the **NKImageView**. **Figure\
    \ 5.11** shows a \n\nphoto I took during one of my trips to the Boundary Waters\
    \ Canoe Area \n\nWilderness. I’ve added a frame to make it pop a bit more on screen,\
    \ and a \n\n“CLOSE X” notation in the corner so users are prompted to click on\
    \ the \n\nimage to make it go away."
  merge: -1
  pgno: 98
- img_proc: true
  md: "FOCUS ON APP CONTENT: TEXT AND IMAGES / WORKING WITH IMAGES\n\n**87**\n\n![](img/4d979018542def8748544c4af0d37f5a_99_0.png)\n\
    \nNext, we need to initialize the control with position, size, and the name of\
    \ \n\nthe image. Place the corner of the JPG at coordinate 44, 20 so it’s centered\
    \ \n\nin the screen:\n\n**photo.init (44, 24, 233, 367, ‘bwca.jpg’);**\n\nWe’re\
    \ getting close; next we need to write a callback so the button we added \n\n\
    to the toolbar will display the image. Here’s how that is coded:\n\n**toolBar.addButton(“Show\
    \ photo”, “”, “****photo.show()****”);**\n\nFinally, one more useful detail for\
    \ **NKImageView** is that tapping the image \n\ncan also hide it (and remember,\
    \ I’ve prepped the image in Photoshop to \n\nindicate this already). Add this\
    \ line to the code at the end of the **photo**\n\nvariable:\n\n**photo.setOnClickCallback(“photo.hide()”);**\n\
    \n5.11 Photo of people canoeing in the \n\nBoundary Waters."
