  md: "ESTABLISHING YOUR APP DESIGN STUDIO / SUMMARY\n\n**23**\n\n**2.** Click the\
    \ Download NimbleKit link. This time you’ll have a much \n\nsmaller file, nimblekit.dmg,\
    \ to save to your Downloads directory.\n\n**3.** Open the file, follow the prompts\
    \ and directions, and the NimbleKit \n\nframework will be installed.\n\n**NOTE\
    \ ****The NimbleKit license**\n\nYou probably noticed the Buy online link in the\
    \ right margin of NimbleKit’s home \n\npage. My advice: Ignore that for now. You\
    \ can download NimbleKit for free, design \n\napps with it, and test them in Simulator,\
    \ all without paying the $99 fee. This is very \n\nnice, because it allows you\
    \ to learn a lot before making a commitment. On the other \n\nhand, NimbleKit’s\
    \ fee is one-time only (unlike Apple’s annual $99 Developer fee).\n\n**Summary**\n\
    \nWhat you’ve learned in this chapter:\n\nr Every step of a new design project,\
    \ and process, has consequences, \n\nincluding obtaining and setting up your tools!\
    \ So think it through.\n\nr Get a unique Apple Developer ID so you keep your iTunes\
    \ purchases \n\nseparate from your interactions with iTunes and iTunes Connect\
    \ as a \n\ndeveloper.\n\nr Read the Apple Developer Agreement carefully and make\
    \ sure you are \n\ncomfortable with what it says. Like any agreement, it creates\
    \ opportuni-\n\nties as well as defines constraints.\n\nr Downloading and installing\
    \ the iOS SDK provides you with the founda-\n\ntional applications—Xcode and Simulator—you’ll\
    \ need for the rest of \n\nthis book.\n\nr Downloading and installing the NimbleKit\
    \ Objective-C framework \n\nenhances Xcode with a library of prewritten Objective-C\
    \ resources, \n\nallowing you to focus on app planning, interface design, and\
    \ content \n\nformatting instead of learning a new programming language.\n\nCongratulations,\
    \ your design studio for the upcoming exercises is now \n\nready for action! Next\
    \ we will explore Xcode and how to begin an app \n\nproject."
