  md: "PROVISIONING AND DISTRIBUTING YOUR APPS / ADDING AND MANAGING APPLICATIONS\n\
    \n**217**\n\nThis screen has a lot of information that you’ll need to answer very\
    \ thor-\n\noughly. Some items like version number, copyright, email address, and\
    \ \n\nsupport URL should be quite straightforward for you to answer. Similarly,\
    \ \n\nthe ratings section in the middle is also fairly objective.\n\nBut some\
    \ of these items are of paramount importance to the position-\n\ning and marketing\
    \ of your app in the iTunes App Store. Consider the \n\ndescription: How can you\
    \ engage your prospective customers with a few \n\nparagraphs that are both attention-getting\
    \ yet concise? What are the key \n\nfeatures to describe, and if your app has\
    \ competition, how can you distin-\n\nguish your app from the others that are\
    \ similar?\n\n**NOTE ****Version information—now editable**\n\nAn important detail\
    \ to note, however, is that you can edit the description and other \n\nitems later.\
    \ This is a new feature; before the current version of iTunes Connect, the \n\n\
    only opportunity you had to change an app description was when you submitted an\
    \ \n\nupdated version for approval!\n\nEqually important as the description, and\
    \ perhaps even more so, are the \n\ncategories and keywords. After all, people\
    \ searching for your app by these \n\nbroader terms will not even find it if you\
    \ don’t select these carefully.\n\nThe available categories are shown in **Figure\
    \ 12.15**.\n\n![](img/4d979018542def8748544c4af0d37f5a_229_0.png)\n\nNote that\
    \ there is a primary category as well as an optional secondary \n\ncategory (the\
    \ options are the same under both). I recommend using the \n\nsecondary category,\
    \ in particular, when your app does not comfortably fit \n\ninto just one—at least\
    \ when using it, you can broaden your reach with a \n\nsecond category!\n\n12.15\
    \ Determining the \n\ncategories for your app."
