  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**142**\n\n**Exploring additional HTML5\
    \ elements**\n\nChapter 5 introduced you to formatting content in NimbleKit apps\
    \ with \n\nwell-established HTML markup such as heading and paragraph tags, unor-\n\
    \ndered lists, and definition lists. But what about the new HTML5 elements \n\n\
    that can enhance the semantic meaning of our markup? Are iOS apps a safe \n\n\
    place to start becoming familiar with these?\n\nYes!\n\nLet’s begin with some\
    \ easy-to-adopt structural content elements.\n\n**Section**\n\nAdopting the **section**\
    \ element is a fantastic way to safely wade into the \n\nnew HTML5 waters, as\
    \ it provides an immediate win: It helps to extricate \n\nyou from having markup\
    \ that has way too many **div** tags.\n\nThink about sections in any printed content\
    \ (this book, for instance), and \n\nyou can intuitively figure out how this new\
    \ element can help you with web \n\nand app content. In the case of print, sections\
    \ of a book are indicated with \n\na different typographical treatment because\
    \ the paragraphs, figures, and \n\nnotes in between these section indicators are\
    \ related groups of information. \n\nChange topic or area of focus, and insert\
    \ a new indicator to communicate \n\nthat you’ve entered a new section.\n\nUsing\
    \ **section** in your HTML is just as intuitive. In fact, I would argue \n\nthat\
    \ using **section** makes you a better designer because it forces you to \n\n\
    become familiar with the meaning of the content you are marking up.\n\nLet’s use\
    \ the U.S. Constitution as an example, since we talked earlier \n\nabout the U.S.\
    \ Bill of Rights.¹ Using HTML4, you could begin marking up \n\nArticle I of the\
    \ Constitution like this:\n\n**<div>**\n\n**<h1>Article I – The Legislative Branch</h1>**\n\
    \n**<h2>Section 1 – The Legislature</h2>**\n\n**<p>All legislative Powers herein\
    \ granted shall be vested **\n\n**in a Congress of the United States, which shall\
    \ consist of **\n\n**a Senate and House of Representatives.</p>**\n\n**<h2>Section\
    \ 2 – The House</h2>**"
  merge: -1
  pgno: 154
- img_proc: true
  md: "HTML5 AND CSS3 / EXPLORING ADDITIONAL HTML5 ELEMENTS\n\n**143**\n\n**<p>The\
    \ House of Representatives shall be composed of **\n\n**Members chosen every second\
    \ Year by the People of the **\n\n**several States, and the Electors in each State\
    \ shall have **\n\n**the Qualiﬁcations requisite for Electors of the most **\n\
    \n**numerous Branch of the State Legislature...</p>**\n\n**<h3>Authors</h3>**\n\
    \n**<ul>**\n\n**<li>James Madison</li>**\n\n**<li>George Washington</li>**\n\n\
    **...**\n\n**</ul>**\n\n**</div>**\n\nAnd there is certainly nothing wrong with\
    \ that—it is still valid as HTML5. \n\nThe only problem with the **div** is that\
    \ by itself, it has no semantic mean-\n\ning. As the W3C HTML specification notes,\
    \ it is “a generic mechanism for \n\nadding structure to documents” and relies\
    \ on a **class** or **id** to help it out \n\nwith presentation.² So it’s really\
    \ the HTML equivalent of a brown paper \n\nwrapper. Of course, you could **class**\
    \ the **div**:\n\n**<div class=”article”>**\n\nBut even here, classing the **div**\
    \ as an article is technically subjective: It does \n\nnot add semantic meaning\
    \ because it is serving only as a stylesheet selec-\n\ntor. However, **section**\
    \ does two things: It groups the content like **div**, and \n\ncommunicates that\
    \ the content inside belongs together in a logical way:\n\n**<section>**\n\n**<h1>Article\
    \ I – The Legislative Branch</h1>**\n\n**<h2>Section 1 – The Legislature</h2>**\n\
    \n**<p>All legislative Powers herein granted shall be vested **\n\n**in a Congress\
    \ of the United States, which shall consist of **\n\n**a Senate and House of Representatives.</p>**\n\
    \n**...**\n\n**</section>**\n\nAnd naturally, you can still **class** or **id**\
    \ a section for presentational \n\npurposes."
  merge: -1
  pgno: 155
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**144**\n\n**Header and footer**\n\n\
    Like **section**, **header** and **footer** can help alleviate the too-many-divs\
    \ \n\nproblem that HTML4 pages of content can incur while adding more \n\nsemantic\
    \ clarity to your markup. I’m covering them here together because \n\nthey share\
    \ some properties, both intuitively and nonintuitively.\n\nIntuition would lead\
    \ us to believe that content tagged with **header** would \n\nbe high-level, introductory,\
    \ and perhaps also navigational content at the \n\ntop of a page; similarly, **footer**\
    \ would be at the bottom of a page and con-\n\ntain reference information about\
    \ the content above it: copyright, date of \n\nauthorship, author, and perhaps\
    \ contact information.\n\nFortunately, our intuition is correct… mostly. The only\
    \ thing that might \n\nbe tricky to get used to is that you’re not limited to\
    \ one **header** or **footer**\n\nper page, and they are not required to be at\
    \ the top and bottom of a page \n\nrespectively (though one suspects that this\
    \ is where most designers will use \n\nthem). So to modify our Constitution markup:\n\
    \n**<section>**\n\n**<header>**\n\n**<h1>Article I – The Legislative Branch</h1>**\n\
    \n**</header>**\n\n**<h2>Section 1 – The Legislature</h2>**\n\n**<p>All legislative\
    \ Powers herein granted shall be vested **\n\n**in a Congress of the United States,\
    \ which shall consist of **\n\n**a Senate and House of Representatives.</p>**\n\
    \n**...**\n\n**<footer>**\n\n**<h3>Authors</h3>**\n\n**<ul>**\n\n**<li>James Madison</li>**\n\
    \n**<li>George Washington</li>**\n\n**...**\n\n**</ul>**\n\n**</footer>**\n\n\
    **</section>**\n\nSee how the more HTML5 you use, the more semantic structure\
    \ your con-\n\ntent takes on? Also note that a **section** may contain a **header**\
    \ or **footer**."
  merge: -1
  pgno: 156
- img_proc: true
  md: "HTML5 AND CSS3 / EXPLORING ADDITIONAL HTML5 ELEMENTS\n\n**145**\n\n**Article**\n\
    \nWhere things get slightly hazy is with the **article** element. It is intended\
    \ \n\nto wrap areas of “self-contained content”. Well, what does that mean, \n\
    \nexactly, and how does that differ from a **section**?\n\nThe metaphor I picked\
    \ up from John Allsopp, author of *Developing with *\n\n*Web Standards* (New Riders,\
    \ 2009), that I find extremely helpful for \n\ndeciphering this apparent conundrum\
    \ is this: **article** wraps content that \n\ncould existing meaningfully and\
    \ independently from the context of the \n\nwhole, whereas **section** is literally\
    \ a section of something—it only makes \n\nsense within its context.³\n\nThe comparison\
    \ that Allsopp makes is\n\nr A newspaper article typically makes complete sense\
    \ on its own, so it \n\nmay be wrapped with the **article** element.\n\nr A traditional\
    \ book chapter (that is, one that is not a short story or an \n\narticle in a\
    \ compilation) relies on the chapters before and after it to \n\nmake sense—it’s\
    \ part of a series of items. This would be wrapped in a \n\n**section** element.\n\
    \nThink of **article** as a more specialized **section** when you’re considering\
    \ \n\nits use. If a suspected **section** of content can stand on its own, consider\
    \ \n\nusing **article** instead.\n\n**Aside**\n\nConsider the **aside** to be\
    \ another specialized form of **section** and, as with \n\n**article**, trust\
    \ that its name is laden with intentional meaning. An aside \n\ncould be\n\nr\
    \ A tangential reference, such as the tips and notes in this book\n\nr A pull\
    \ quote that you want to set off semantically, and likely wish to \n\nstyle uniquely\n\
    \nOne way to measure whether content fits the intentions of **aside** is to see\
    \ \n\nwhether the context in which it resides makes sense without it. If it does,\
    \ \n\nthe content in question is likely tangential enough to be an **aside**."
  merge: -1
  pgno: 157
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**146**\n\n**Nav**\n\nI saved **nav**\
    \ for the end of the structural element discussion because it may \n\nbe the least\
    \ likely to be used in an iOS app setting. The reason for this is \n\nthat a lot\
    \ of app navigation is in the JavaScript portions of the code, so that \n\nwouldn’t\
    \ be wrapped by **nav** tags.\n\nOn the other hand, any buttons or unordered list\
    \ navigation elements in an \n\nHTML page could certainly be wrapped in **nav**.\n\
    \nNext I’ll give a quick nod to a few more HTML5 elements, two that we’ve \n\n\
    covered already and one that will be mentioned briefly. These fall under the \n\
    \ncategory of rich media.\n\n**Audio and video**\n\nThe **audio** and **video**\
    \ HTML5 elements were introduced in Chapters \n\n7 and 8, and they work with Xcode\
    \ and NimbleKit on iOS devices. Just \n\nremember that NimbleKit offers alternative\
    \ classes in its library, NKAudio-\n\nPlayer and NKVideoPlayer, which give you\
    \ slightly different user experi-\n\nences and options.\n\n**Canvas**\n\nThe **canvas**\
    \ element allows designers and developers to draw lines and \n\nshapes, fill shapes\
    \ and areas, and animate objects. It’s a powerful, JavaScript-\n\ndriven element\
    \ that happens to be well supported by Xcode and NimbleKit.\n\nTwo awesome examples\
    \ on the web that could get you very excited about \n\n**canvas** are the Visualizing\
    \ the World Cup⁴ and Visualizing the Stanley \n\nCup⁵ websites. Pay them a visit\
    \ in either Safari on a Mac or mobile Safari on \n\nan iOS device. All of the\
    \ visualization and typography (aside from the team \n\nlogos and background images)\
    \ use HTML5 and CSS3.\n\nVery impressive!\n\nHowever, the **canvas** element is\
    \ where I need to draw the line (no pun \n\nintended) in the content I attempt\
    \ to cover with any respectable depth. \n\nI didn’t want to omit **canvas** completely\
    \ and am pretty impressed with \n\nwhat it can do. On the other hand, **canvas**\
    \ doesn’t really do anything on its \n\nown—it merely opens the door for a ton\
    \ of additional uses of JavaScript."
  merge: -1
  pgno: 158
- img_proc: true
  md: "HTML5 AND CSS3 / EXPLORING ADDITIONAL HTML5 ELEMENTS\n\n**147**\n\nThe main\
    \ reason **canvas** isn’t demonstrated here is because it’s a fairly \n\ncomplicated\
    \ way to do some otherwise simple things. This method works \n\nwell when it scales\
    \ to a large enough project, and when dynamic image \n\ngeneration makes the most\
    \ sense. An example would be app content that’s \n\ndriven by a large database,\
    \ where the visualization is more efficiently done \n\non the fly so that servers\
    \ don’t need to be burdened with a bunch of prefab-\n\nricated image files.\n\n\
    Such a scenario certainly makes **canvas** useful—except that this book \n\ndoesn’t\
    \ cover large application development. And I cannot recommend \n\nthat you use\
    \ **canvas** to draw simple shapes, either; that’s a case where \n\nthe HTML5\
    \ route is actually longer and more complicated than creating \n\nbitmapped image\
    \ files.\n\n![](img/4d979018542def8748544c4af0d37f5a_159_0.png)\n\n**Additional\
    \ HTML5 elements**\n\nThe HTML5 elements covered in this book should be quite\
    \ useful to you \n\nas web designers, and the most relevant to iOS app design\
    \ with NimbleKit. \n\nBut they are by no means all of the HTML5 elements. If you\
    \ want to read \n\nup on all of them, visit the clever Periodic Table of the (HTML5)\
    \ Elements, \n\nbrought to you by Josh Duck⁶ (**Figure 9.1**).\n\n9.1 The Periodic\
    \ \n\nTable of the (HTML5) \n\nElements. Brilliant!"
  merge: -1
  pgno: 159
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**148**\n\n**More design options with\
    \ CSS3**\n\nCSS3 allows us to quickly take a pedestrian design and elevate it\
    \ to some-\n\nthing special, and do it in a way that is extremely agile and malleable.\
    \ In \n\nother words, the process of using CSS3 for presentational and visual\
    \ effects \n\nenables adjusting and tweaking on-the-go as well as revisions and\
    \ even \n\nsubstantial redesign much later. Let’s explore a few examples to see\
    \ how \n\nCSS3 helps us in this way—and realize that there are many more CSS3\
    \ \n\ntechniques to explore by checking out the actual specification or reading\
    \ \n\nbooks that focus specifically on the topic.\n\n**Border-radius**\n\nThe\
    \ **border-radius** property was introduced in Chapter 5 (see Working \n\nwith\
    \ images and Figure 5.9):\n\n**img {border-radius: 15px;}**\n\nand in Chapter\
    \ 6 (see Method two: Styling an HTML button and Figure 6.2):\n\n**ul.button li\
    \ a {border-radius: 10px;}**\n\nIn addition to being applied to HTML elements,\
    \ it can be applied to an \n\nentire div class or id:\n\n**#box {border-radius:\
    \ 10px;}**\n\nAnd to get a bit crazier with it, you can specify different radii\
    \ for different \n\ncorners:\n\n**#crazybox {**\n\n** border-bottom-left-radius:\
    \ 10px;**\n\n** border-bottom-right-radius: 8px;**\n\n** border-top-left-radius:\
    \ 12px;**\n\n** border-bottom-right-radius: 2px;**\n\n**}**\n\nBut it gets crazier\
    \ still: You can supply two values, the first for the horizon-\n\ntal distance\
    \ and the second for the vertical distance, allowing you to create \n\nsomething\
    \ that is more elliptical:\n\n**#ellipse {**\n\n**border-radius: 50px 25px;**\n\
    \n**}**\n\nThat gives you a bit more to explore with **border-radius**. Have fun!"
  merge: -1
  pgno: 160
- img_proc: true
  md: "HTML5 AND CSS3 / MORE DESIGN OPTIONS WITH CSS3\n\n**149**\n\n**RGBA**\n\nCSS\
    \ has always supported color very well. But prior to CSS3 and Red-\n\nGreen-Blue-Alpha\
    \ (RGBA), transparency was a hack that was accom-\n\nplished by using image files\
    \ that were saved with transparency. This \n\nmethod works OK, but it requires\
    \ a lot of time-consuming image produc-\n\ntion. Worse yet, to make any changes\
    \ to a design that uses a lot of images \n\nwith transparency, you have to rework\
    \ all of the images and resave them \n\nas PNGs.\n\nFortunately, RGBA is a much\
    \ more agile and efficient way to achieve \n\nthe same results, allowing you to\
    \ tweak the design or change out images \n\nquickly without having to redo a bunch\
    \ of image editing. So how does this \n\nwork, and how does it result in something\
    \ useful for iOS apps?\n\nRGBA is an extension of the RGB color model that is\
    \ used in many \n\nplaces—television and computer screens, the Photoshop Color\
    \ Picker, \n\nand the NKNavigationController in NimbleKit to name a few. The first\
    \ \n\nthree values (R, G, and B) can be between 0 and 255 (0,0,0 is black; 255,\
    \ \n\n255, 255 is white; all other hues are made using combinations that lie in\
    \ \n\nbetween these values). The A value can only be between 0 and 1, with 1 \n\
    \nbeing completely opaque, 0 being completely transparent, and decimal \n\nvalues\
    \ in between doing the real magic.⁷\n\nUsing RGBA is probably most practical when\
    \ applied to a background. \n\nHere’s a background setting of 100 percent black\
    \ with 50 percent opacity:\n\n**background: rgba(0,0,0,.5);**\n\nSo how might\
    \ one apply this effect when designing an iOS app? Let’s use a \n\nfarmers’ market\
    \ app as an example. Bear with me—the screen does a good \n\njob of making vegetables\
    \ look sexy.\n\nAnyway, imagine designing an app for a local farmers’ market.\
    \ You \n\nmight have several of these screens, each one focusing on different\
    \ items: \n\nvegetables, jams and jellies, local meats, and so on. This example\
    \ will be a \n\nvegetables screen with three items: beets, carrots, and kale.\n\
    \nStart by making a new Xcode project for iPhone and modifying the \n\nmain.html\
    \ file to match the code in Figure 9.2. What you’re doing is add-\n\ning an unordered\
    \ list containing the three vegetables. As with the other \n\nexamples, you can\
    \ download this in its entirety from iosapps.tumblr.com."
  merge: -1
  pgno: 161
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**150**\n\n(This is particularly useful\
    \ in this case because then you can use the same \n\nimage files that I created.)\n\
    \n**<html>**\n\n**<head>**\n\n**<meta name = “viewport” content = “initial-scale\
    \ = 1.0, **\n\n**user-scalable = no”>**\n\n**<link href=”style.css” media=”screen”\
    \ rel=”stylesheet” **\n\n**type=”text/css”>**\n\n**<script type=”text/javascript”\
    \ src=”NKit.js”></script>**\n\n**</head>**\n\n**<body>**\n\n**<ul class=”food”>**\n\
    \n**<li>**\n\n**<img src=”beets.jpg”>**\n\n**<strong>Beets</strong>**\n\n**<em>$4.49</em>**\n\
