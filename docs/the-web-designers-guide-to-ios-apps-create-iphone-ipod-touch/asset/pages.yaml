    \ information about that Apple rumor, but unfortunately I’m not \n\nat liberty\
    \ to tell you because I’m under NDA.”)\n\n**TH E NAR ROW LIN E I HAV E CAR EFU\
    \ LLY TROD**\n\nBecause I’m party to the Apple Developer Agreement, I have to\
