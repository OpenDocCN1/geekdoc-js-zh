  md: " ADDITIONAL GUIDING PRINCIPLES / CONTENT STRATEGY\n\n**227**\n\nWe do this\
    \ because, for the most part, my collaborator is a publisher, the \n\nApp Store\
    \ is his bookstore, and I turn the crank of the printing press. \n\nEr, I mean\
    \ Xcode.\n\nSo if my collaborator wants an app update to be available around June\
    \ 1, \n\nI need to budget in some time for Apple to review the update (because\
    \ they \n\nreview updates just as they review new apps, though the update reviews\
    \ \n\nseem to go a bit faster). Because I have experienced up to a two-week review\
    \ \n\nperiod, that’s what I go with.\n\nThen I add however much time I need to\
    \ make content updates in the \n\nHTML, new images, and so on.\n\nThen I add on\
    \ a bit more time as a cushion for surprises.\n\nThen I round up a bit, just to\
    \ be safer still.\n\nAnd after all of that, I emphasize to my collaborator that\
    \ getting his \n\nchanges to me early might help me submit the update early (this\
    \ rarely \n\nworks, but it’s nice to try).\n\nThe maintenance process for content\
    \ delivered online may be simpler or \n\nmore complex than this—it really depends\
    \ on roles and responsibilities. \n\nFor instance, in the example of the Twitter\
    \ feed populating an app screen, \n\nwho maintains the Twitter account? How often?\
    \ Are the content param-\n\neters very refined or more laid-back and casual?\n\
    \nThe strength of maintaining content in tiny bites via a ubiquitous tool like\
    \ \n\nTwitter is that anyone can do it nearly anywhere. That’s the good thing.\n\
    \nBut most people have learned that even with social media, you still need a \n\
    \nplan and a process for making it as effective as possible. If you’re setting\
    \ an \n\nexpectation for fresh content at a particular interval, you better make\
    \ sure \n\nto deliver on time. And if the “you” is a team of people, is everyone\
    \ in agree-\n\nment about who the responsible person is?\n\nFinally, remember\
    \ that content updates in an app might also lead to the \n\nupdates of App Store\
    \ screenshots or updates to the app’s companion web-\n\nsite. Does your maintenance\
    \ plan cover all of those bases, too?\n\nIt should."
