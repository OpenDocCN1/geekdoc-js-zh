  md: "FOCUS ON APP CONTENT: AUDIO / SUMMARY\n\n**123**\n\n![](img/4d979018542def8748544c4af0d37f5a_135_0.png)\n\
    \nYou could even leave the button labels in the code; the filled image param-\n\
    \neters trump the labels, though, so the result would be the same. This is \n\n\
    shown in **Figure 7.5**, with the standard labeled buttons replaced with the \n\
    \nPNG images.\n\n7.5 The revised NKAudioPlayer and \n\nNKToolBar audio screen,\
    \ now with \n\nbuttons similar to the iPod application.\n\nSo those are some fundamental\
    \ building blocks for using audio in a \n\nNimbleKit-powered iOS application.\
    \ Be creative, build on these ideas, \n\nand have fun with audio!\n\n**Summary**\n\
    \nThis chapter has demonstrated that adding audio to an iOS app is quite \n\n\
    straightforward:\n\nr You can use HTML5’s audio element, which gives you more\
    \ flexibility \n\nwith screen layout.\n\nr Or you can use NimbleKit’s NKAudioPlayer\
    \ library item, which works \n\nbest when coupled with a toolbar and custom buttons.\n\
    \nNext, you’ll learn that working with video is comparable to working with \n\n\
    audio: There are both HTML5 and NimbleKit library item options."
