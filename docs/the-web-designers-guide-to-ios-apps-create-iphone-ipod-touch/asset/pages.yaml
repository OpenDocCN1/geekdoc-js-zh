  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**230**\n\n**Clarify roles and responsibilities**\n\
    \nMost problems with technical projects are not actually technical in nature.\
    \ \n\nThey are human. But I don’t mean that the problem is the person, though\
    \ \n\nI’ve thought this and I bet you have, too. Yes, you have—you can admit it.\n\
    \nA lot of these problems can be collected under the broad umbrella of roles \n\
    \nand responsibilities. In fact, this perspective helps reinforce that they are\
    \ \n\npeople problems, doesn’t it? I mean, computers and software don’t have roles\
    \ \n\nand responsibilities: They just do exactly what we tell them to, and when\
    \ we \n\nmess up with our directions, they don’t do it right either. Because technol-\n\
    \nogy doesn’t understand roles and responsibilities: It doesn’t have any.\n\n\
    So as you start getting excited about a new app project, whether it’s for a \n\
    \nclient or an employer, cool your jets, step back, and start thinking about the\
    \ \n\nvarious roles that will likely be involved:\n\nr project manager\n\nr information\
    \ architect\n\nr art director\n\nr editor\n\nr graphic designer\n\nr coder/programmer\n\
    \nAnd there could be others.\n\nSome of these roles may reside in the same person.\
    \ Someone will manage \n\nthe project, someone will structure the content, someone\
    \ will determine the \n\nlook and feel, and so on. These roles may involve six\
    \ people, or two people, \n\nor more than six people. It just depends on the size\
    \ of your project and team.\n\nAnd in a way, it doesn’t really matter how many\
    \ people are involved (though \n\nI generally think the fewer, the better). What\
    \ matters is that the people who \n\nare involved know what they are supposed\
    \ to do. But how will they know?\n\nYou need to tell them.\n\nIf you’re the only\
    \ person who knows all the roles, it is your responsibility to \n\ndefine them\
    \ for your project and have everyone agree about who does what. \n\nIt’s not only\
    \ in your own best interest to do so (you are setting yourself up \n\nto fail\
    \ if you don’t), it’s also in the best interest of your app project."
  merge: -1
