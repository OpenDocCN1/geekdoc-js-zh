  md: "**15**\n\nAs we start getting into the technical and production-\n\noriented\
    \ aspects of iOS application design, I want this \n\nbook to do you a favor—a\
    \ *really big* favor: I want it to \n\nanswer more questions than it raises.\n\
    \nThis may be more of an aspiration than a truly achievable \n\ngoal, but it is\
    \ still a sincere goal and one born out of my \n\nown app design experience. For\
    \ one thing, many of the \n\nprocesses require more steps (and thus, more decisions\
    \ \n\nto make) along the way than I first anticipated. And as \n\nI encountered\
    \ all of these steps, I rarely encountered \n\nenough documentation to get me\
    \ through the entire \n\nprocess easily and safely.\n\nSo I hereby decree that\
    \ the rest of this book might get a \n\nlittle tedious at times, but will do so\
    \ in order to give you \n\nenough detail to master some very fundamental aspects\
    \ \n\nof iOS app planning, design, and production. And while it \n\nmay not teach\
    \ you to design *any* app that you want, what \n\nit does teach you it will teach\
    \ you very well."
