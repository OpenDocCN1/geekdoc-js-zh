  md: " ADDITIONAL GUIDING PRINCIPLES / APP PLANNING\n\n**229**\n\n**App planning**\n\
    \nYou know the type: the client or employer who really has no idea what it \n\n\
    takes to design their website. This is how they think:\n\n**1.** Websites run\
    \ on computers.\n\n**2.** Computers do things really fast.\n\n**3.** Web designers\
    \ work on computers.\n\n**4.** Therefore, web designers can design websites really\
    \ fast.\n\nAnd don’t get me started on the clients who think that because I love\
    \ to \n\ndesign websites, I also love to design their PowerPoint presentation\
    \ (and \n\nthey need it in one hour). I mean, they’re practically the same thing,\
    \ right? \n\n(And yes, it’s usually the same clients.)\n\nBut can we really fault\
    \ our clients for such misunderstandings? Not \n\nreally. Particularly when we’re\
    \ able to make some of their content or page \n\ntemplate updates for them quickly,\
    \ or they themselves are able to swiftly \n\nand easily make site updates because\
    \ we set them up on some easy-to-use \n\ncontent management system.\n\nWell, the\
    \ same problem can apply to designing apps, too. They also run \n\non fast little\
    \ devices, so why wouldn’t they also be designed in an instant? \n\nOMG—yet another\
    \ reason for us to simultaneously love and hate those for \n\nwhom we design things!\n\
    \nYet this chasm between client perceptions and reality really isn’t their fault.\n\
    \nIt’s our fault.\n\nAnd we can fix it with some help from Patrick Lynch and Sarah\
    \ Horton.\n\nLynch and Horton have been helping people understand the process\
    \ of \n\ndesigning websites for over 17 years, since they first published the\
    \ Yale Web \n\nStyle Guide website in 1993. Now a book in its third edition, *Web\
    \ Style *\n\n*Guide*³ is still one of my all-time favorite design books, and here’s\
    \ why: It \n\nhelps fix client and employee misconceptions about designing websites.\n\
    \nIt can also help you design better apps. Read on."
  merge: -1
