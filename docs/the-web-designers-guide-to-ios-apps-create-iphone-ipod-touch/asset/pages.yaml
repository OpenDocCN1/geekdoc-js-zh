  md: "THE BIG IMPACT OF GOING SMALL / THE MAGIC IS TRANSFORMATIONAL\n\n**9**\n\n\
    ![](img/4d979018542def8748544c4af0d37f5a_21_0.png)\n\nperspective, whereas a laptop\
    \ is a bit less than 50 percent screen because of \n\nthe keyboard and a lot of\
    \ additional surface area (**Figure 1.3**). That’s a sub-\n\nstantial difference.\
    \ Even when an engaging website is showing on a laptop \n\nscreen, it’s still\
    \ visibly *on* the laptop, isn’t it? The keyboard, touch pad, wrist \n\narea,\
    \ and frame around the screen do not disappear. They still impact the \n\nexperience\
    \ and keep us more distant from the content.\n\n1.3 Even laptops are mostly \n\
    \nkeyboard, touch pad, and \n\nframe. The screen is less \n\nthan 50 percent of\
    \ the overall \n\nsurface.\n\nBut as soon as you run an app on an iOS device,\
    \ the entire device seems to \n\ntransform because of its multitouch, screen-dominated\
    \ design. This is more \n\nobvious in some apps than in others, but consider how\
    \ the iPhone appears \n\nto become a phone when the Phone app is running. The\
    \ hardware nearly \n\ndisappears: Suddenly, we have a glowing phone keypad with\
    \ built-in list of \n\ncontacts. The same is true with Maps: It’s not really a\
    \ map inside a device; \n\nthe app helps the device *become a map*.\n\nUnderstanding\
    \ this transformational effect is critical to our approach in \n\ndesigning for\
    \ these devices. We need to be extra careful about how we \n\ndesign a user interface\
    \ (UI). We need to learn how to respect the native \n\nApple iOS controls, and\
    \ when to design custom UI elements that directly \n\nsupport the communications\
    \ needs of the app we’re designing. And, in \n\nsome cases, the UI elements extend\
    \ beyond mere functionality, as branding \n\nmight also be a factor.\n\nIt is\
    \ also essential to understand just *how* important this design thinking \n\n\
    is in this situation. Because I would argue that missing the mark in either \n\
    \nnative Apple UI controls or content- or branding-specific UI detailing is \n\
    \nnot the same as handing in a paper for a class and having it be just good \n\
    \ninstead of excellent."
