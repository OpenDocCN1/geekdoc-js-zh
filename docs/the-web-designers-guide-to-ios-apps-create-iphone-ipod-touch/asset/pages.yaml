- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**126**\n\n**Delivering video with\
    \ HTML5 on iPad**\n\nPlaying a video file with HTML5 is about as easy as playing\
    \ an audio file, \n\nbut here’s the caveat: At least with the NimbleKit Objective-C\
    \ framework, \n\nthe HTML5 option is only fully functional on the iPad and not\
    \ on Apple’s \n\npocket-sized iPhone or iPod touch.\n\nThe limitation on iPhone\
    \ and iPod touch is this: The embedded HTML5 \n\nvideo player can be displayed\
    \ in a screen view, but when you touch the play \n\ncontrol a native iOS video\
    \ player interface is displayed. Essentially, it’s the \n\nsame phenomenon that\
    \ happens in the YouTube app that comes with these \n\ndevices.\n\nOn the iPad,\
    \ the HTML5 video player actually plays the video embedded, \n\nright where it\
    \ is. To use the HTML5 option, just implement its new **video**\n\nelement and\
    \ have an MPEG-4 (.m4v) video file available. Here’s the format \n\nfor the HTML\
    \ markup:\n\n**<video src=”name.m4v” width=”x” height=”y” **\n\n**poster=”name.jpg”\
    \ controls></video>**\n\nLet’s explore these options in detail:\n\nr The **src**\
    \ attribute identifies the video file to be played (and don’t forget \n\nto **Add\
    \ to Project** to copy the file to your Xcode project’s HTML direc-\n\ntory, otherwise\
    \ your app will not locate the video file!).\n\nr As with the **object** tag it’s\
    \ replacing, it’s a good habit to continue speci-\n\nfying the **width** and **height**\
    \ attributes of your video. This keeps the \n\nblack play area, or stage, the\
    \ same size and aspect ratio as your video.\n\nr The **poster** attribute allows\
    \ you to specify an image file to use as the \n\nposter frame or placeholder for\
    \ the stage prior to playing. Either a JPG \n\nor PNG can be used.\n\nr Finally,\
    \ you need to add the **controls** attribute to display standard \n\ncontrols.\
    \ Without this attribute, the user can’t play the video.\n\n**Designing a sample\
    \ video application**\n\nArmed with this knowledge, let’s design a sample app\
    \ to demonstrate the \n\n**video** tag in action on the iPad. As it happens, I\
    \ have a short video clip \n\nof one of my daughters practicing the piano that\
    \ I can share. (Download"
  merge: -1
  pgno: 138
- img_proc: true
