  md: "FOCUS ON APP CONTENT: TEXT AND IMAGES / INTEGRATING SOCIAL CONTENT\n\n**81**\n\
    \nCombining the blogger.js, main.html, and style.css files gives you a \n\npage\
    \ like that shown in **Figure 5.6**, using my own Twitter account \n\nas an example.\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_93_0.png)\n\nUsing Twitter as a light\
    \ app content management system in this way is \n\npretty cool—it’s a convenient\
    \ way to update people on the go about news \n\nor specials, just as organizations\
    \ and businesses use Twitter to update \n\npeople at their desktops. And while\
    \ there are Twitter iOS apps that allow \n\npeople to do this already, nothing\
    \ says you love your clients or customers \n\nmore than a very targeted and custom-designed\
    \ experience. You can style \n\nthis however you want, not to mention make it\
    \ one of several other content \n\nscreens in an app.\n\n5.6 Bringing a Twitter\
    \ \n\nfeed into a NimbleKit app."
