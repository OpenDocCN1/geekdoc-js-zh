    \n11.5 An update message for Lose It! in \n\nthe App Store, as viewed on an iPhone.\n\
    \nHere are some of the strengths of this message:\n\nr It has a friendly, conversational\
    \ tone, like the update is speaking \n\nwith you.\n\nr It is detailed and thorough.\n\
    \nr There are URLs included that link to pages on the app’s website.\n\nAnd here\
