- img_proc: true
  md: " ADDITIONAL GUIDING PRINCIPLES / CONTENT STRATEGY\n\n**225**\n\n***Unless your\
    \ app is a game, your mobile app *****is***** content.***\n\nWhich means you need\
    \ a content strategy.\n\nFortunately, content strategy is now seeing the light\
    \ of day as a critical part \n\nof design projects. And one of the people who\
    \ is shining a lot of light in this \n\narea is Kristina Halvorson, who gave us\
    \ a wonderful book called *Content *\n\n*Strategy for the Web*.¹ If there’s a\
    \ recent book about content-focused design \n\nthat’s a must-read, this is it.\
    \ Meanwhile, here’s how some of its lessons can \n\nhelp us with designing iOS\
    \ apps that are distributed in the App Store.\n\n**Less is more**\n\nSo you thought\
    \ Ludwig Mies van der Rohe, the great German Modernist \n\narchitect, was the\
    \ person who popularized the maxim “less is more”?\n\nWell, you’re right. But\
    \ it’s Kristina Halvorson who has applied it to websites \n\nand other digital\
    \ media.\n\nBut does it really take an author and consultant to tell us this,\
    \ when all we \n\nneed to do is pay more attention to our own behavior when it\
    \ comes to \n\nmedia? It’s truly a classic case of being reminded of something\
    \ that should \n\nalready be all too obvious.\n\nJust think about the things we\
    \ do every day that involve smaller amounts of \n\ncontent, versus things with\
    \ longer formats.\n\nMost days, we will all read text messages and email, check\
    \ into a social \n\nnetwork, browse some websites, maybe read part of a newspaper\
    \ and, if we \n\nhave any free time, perhaps watch a television show or two that\
    \ is generally \n\na half-hour or hour long.\n\nThings we do *not* do every day:\
    \ read an entire book (or even part of one), \n\nsee a movie, watch a miniseries\
    \ on television, go to the theater.\n\nWhile some of these choices involve issues\
    \ of cost, a lot of it just boils down \n\nto time and attention. Watching an\
    \ entire film simply takes a lot of time. So \n\nit can’t happen every day, and\
    \ it needs to look pretty compelling for us to \n\nschedule it into our busy lives.\n\
    \nThus, a good deal of our media consumption (more) is made up of smaller \n\n\
    amounts of content (less). Less is indeed more."
  merge: -1
  pgno: 237
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**226**\n\nHalvorson affirms this when\
    \ it regards websites, as I do when it \n\nconcerns apps:\n\nr Less content is\
    \ more user-friendly: As with a well-designed website, an \n\napp better deliver\
    \ its content efficiently and concisely because of our \n\nmedia habits. If we’re\
    \ confronted with something that looks like it will \n\ntake a lot of our time,\
    \ people will opt out of it pretty quickly.\n\nr Less content is easier to manage:\
    \ Let’s say that an important feature of \n\nyour app is its ability to run offline\
    \ so that it doesn’t require an Internet \n\nconnection to work. This means that\
    \ all the content is contained within \n\nit. What is the schedule for reviewing\
    \ and updating the project’s con-\n\ntent? Have you and the content manager agreed\
    \ on this schedule?\n\nr Less content costs less to maintain: There is a cost\
    \ to maintaining your \n\ncontent. Somewhere. Perhaps it’s paying an editor, or\
    \ the time it takes \n\nfor the owner/client/writer to write and review. Or it’s\
    \ the time that \n\nyou will be billing your client for updating the app with\
    \ their content \n\nchanges. In any of these cases, creating a large amount of\
    \ content up \n\nfront isn’t just a one-time issue: It’s an ongoing issue.\n\n\
    I’m not here to scare you away from having a content-rich app. Certainly, \n\n\
    some reference applications’ value is entirely in their scope and depth. \n\n\
    Content has value, so more of it can make an app more valuable. Just be \n\nsure\
    \ that everyone is on board with the responsibilities of properly feeding \n\n\
    and watering content over the long term. Consider creating an editorial \n\ncalendar\
    \ to help manage these issues.\n\n**Maintenance process**\n\nIn addition to size\
    \ and schedule issues, the maintenance of app content can \n\nvary due to a variety\
    \ of factors.\n\niTunes Connect lacks a nifty content management module, so if\
    \ your con-\n\ntent resides inside the app (rather than online), your content\
    \ management \n\nsystem is Xcode plus your editor of choice—on your laptop or\
    \ desktop \n\nMac. Taking the example of some reference applications that I collaborate\
    \ \n\non with a content provider, we always work backwards from my collabora-\n\
    \ntor’s desired date for issuing an app update."
