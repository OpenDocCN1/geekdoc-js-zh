  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**188**\n\n**You are your employer\
    \ or organization**\n\nAnother option for designing and distributing iOS apps\
    \ is to partici-\n\npate in Apple’s Enterprise Program. The annual fee for this\
    \ program is \n\ncurrently $299.\n\nDesigning and submitting apps as an enterprise\
    \ has the following \n\nadvantages:\n\nr You should be able to get your company\
    \ to cover the annual fee.\n\nr You likely have in-house financial and legal resources\
    \ available to you \n\nfor consultation and assistance as you navigate the iTunes\
    \ Connect \n\nbusiness processes.\n\nr If you are designing apps only for in-house\
    \ use, the Enterprise Program \n\nallows you to distribute apps directly to employees\
    \ in your company \n\nrather than going through the public App Store review and\
    \ approval \n\nprocess.\n\nOn the other hand, designing and submitting apps as\
    \ an enterprise may \n\nhave the following disadvantages:\n\nr You cannot sell\
    \ or distribute your company’s apps through the \n\nApp Store.\n\nr Your may get\
    \ less personal recognition for your apps.\n\nr Your company’s apps may get less\
    \ exposure (though if this route is taken \n\nfor an internal app, additional\
    \ exposure may not be relevant).\n\n**You are your client**\n\nYet another option\
    \ for designing and distributing iOS apps is to place them \n\nin the App Store\
    \ not as yourself, your company, or your employer, but as \n\nyour client.\n\n\
    Designing and submitting apps as your client has the following advantages:\n\n\
    r Your client gets to take on more of the copyright, liability, and financial\
    \ \n\nissues of distributing apps via the App Store.\n\nr This arrangement allows\
    \ you to more comfortably collaborate on or \n\ndesign an app that doesn’t fit\
    \ into your overall market focus or app type \n\nspecialization."
  merge: -1
  pgno: 200
- img_proc: true
  md: "MARKETING YOUR APPS / USING APPLE’S MARKETING ASSETS\n\n**189**\n\nr It allows\
    \ you to be a bit more risky with designing an app that might not \n\nsell or\
    \ get reviewed well (though to be fair, your association with a bad \n\napp can\
    \ probably come back to haunt you even if it’s listed under your \n\nclient instead\
    \ of you personally).\n\nOn the other hand, designing and submitting apps as your\
    \ client may have \n\nthe following disadvantages:\n\nr Depending on who administers\
    \ the iTunes Connect account, you may \n\nnot have financial control in this arrangement\
    \ and will instead be paid \n\nby your client after Apple pays them.\n\nr If the\
    \ app ascends to a Top Ten list, you may regret not getting all \n\nthe glory.\n\
    \nIf you’re like me, sometimes being confronted with too many choices can \n\n\
    be unpleasantly bewildering, especially if you anticipated a more simple \n\n\
    process. As in, “I just went to the store to buy toothpaste—I didn’t expect \n\
    \nto stand in the aisle, paralyzed by all the options!” This section is not meant\
    \ \n\nto paralyze you, but I encourage you to weigh these options early in your\
    \ \n\nplanning process. My hope is that if you consider the options carefully\
    \ and \n\nseek advice early and as needed, then you won’t be found standing in\
    \ the \n\naisle with a finished app, wondering how to quickly choose an option\
    \ that \n\nmay be more than a five-minute decision.\n\n**Using Apple’s marketing\
    \ assets**\n\nApple and its App Store have plenty of critics and, as I noted in\
    \ the intro-\n\nduction to this book, my decision to write this does not mean\
    \ that I dismiss \n\nall of those criticisms. The iOS app design and distribution\
    \ processes have \n\nplenty of shortcomings, and there are plenty of reasons to\
    \ perhaps be cyni-\n\ncal as to why Apple has designed these opportunities and\
    \ processes in the \n\nways that it has.\n\nNonetheless, the numbers generated\
    \ by the App Store are certainly some of \n\nthe reasons to take interest in Apple’s\
    \ mobile platform and app distribution \n\nmodel. There are over 250,000 apps\
    \ in the App Store, and by January 2010 \n\nmore than 3 billion apps had been\
    \ downloaded worldwide.\n\nAnd that was before the iPad was introduced."
