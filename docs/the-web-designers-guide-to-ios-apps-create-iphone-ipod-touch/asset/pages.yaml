  md: "PROVISIONING AND DISTRIBUTING YOUR APPS / ADDING AND MANAGING APPLICATIONS\n\
    \n**213**\n\nSelect App Store for the distribution method; give the profile a\
    \ name simi-\n\nlar to your development profile for the app. Again, I use names\
    \ that include \n\n“Dist” at the end to help me keep my profiles separate when\
    \ I see them in \n\nthe Xcode organizer. You see your distribution certificate\
    \ listed under this \n\nrow, then all you need to do is select the matching App\
    \ ID that you created \n\nduring development provisioning. After clicking submit,\
    \ you will return \n\nto the home view of the Distribution Provisioning tab and\
    \ see your new \n\ndistribution provisioning profile listed.\n\nThe rightmost\
    \ column for your new profile will be blank at first. But by the \n\ntime you\
    \ reload the page, there will be a download button. Click it to down-\n\nload\
    \ the file, and once you drag your freshly minted distribution provision-\n\n\
    ing profile to Xcode it should show up in your Organizer and you’re ready \n\n\
    to package and distribute your app binary.\n\nThis is detailed in the Building\
    \ and submitting (distributing) section in \n\nChapter 3.\n\n**Adding and managing\
    \ applications**\n\nNow is the moment to break out the band: After you generate\
    \ your app \n\nbinary (as described in Chapter 3), it’s time to submit your app\
    \ to Apple \n\nfor review and placement into the iTunes App Store.\n\n*Yes, the\
    \ moment has finally arrived!*\n\nTo start this process, go to itunesconnect.apple.com\
    \ and log in using your \n\nApple Developer ID, the same ID you use for the iOS\
    \ Dev Center. You will \n\nbe presented with a screen that has several options\
    \ including Sales and \n\nTrends (which will become your favorite place to visit\
    \ when people start \n\nfinding your app); Contracts, Tax, and Banking Information\
    \ (there are sev-\n\neral important items to complete here prior to submitting\
    \ your first app); \n\nFinancial Reports (if you decide to sell your app instead\
    \ of distributing for \n\nfree, this will be your other favorite place to visit,\
    \ because it documents \n\nApple’s payments to you), and some other categories\
    \ for managing other \n\nusers, in app purchases, and promotional codes.\n\nAfter\
    \ completing the steps in Contracts, Tax, and Banking Information, \n\nyou begin\
    \ the app submission process by clicking on Manage Your Applica-\n\ntions. Then\
    \ click on the blue Add New Application button in the upper-left \n\ncorner of\
    \ the screen."
