  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**8**\n\nDesigning an app for a mobile\
    \ device is very different than designing a \n\nwebsite that will be viewed on\
    \ a computer with a full-size screen. We tend \n\nto use desktop—and even laptop—computers\
    \ more often in work or edu-\n\ncational situations. (Obviously the Internet has\
    \ changed that dramatically, \n\nbut bear with me a moment.) This means that the\
    \ places where we tend to \n\nuse computers are in offices, classrooms, or at\
    \ home. Sure, a laptop can be \n\nbrought many places and some of us have them\
    \ with us nearly wherever we \n\ngo, but most people use them in one primary location.\n\
    \nCompare this to using an iPhone, iPod touch, or iPad. Depending on your \n\n\
    device and which model you have, your connectivity varies, and yet, given \n\n\
    the pervasiveness of wireless networks, having one of these mobile comput-\n\n\
    ers in your pocket (more metaphorical for an iPad owner—unless you have \n\n*really*\
    \ large pockets!) means that you are using it on the go. And this means \n\nthe\
    \ context is often different, and the reason for using it is probably *entirely\
    \ *\n\n*different*, than using a computer. Double-checking a recipe for its list\
    \ of ingre-\n\ndients is not a business-related task unless you are a chef or\
    \ caterer: You take \n\nyour iPhone or iPod touch out at the grocery store because\
    \ you are human, \n\nyou are hungry, and you need to solve this particular problem\
    \ on the fly.\n\nAnd it’s not a technical problem.\n\nThe most important thing\
    \ to remember is this: Designing content for an \n\nApple iOS device is different\
    \ from designing content for a browser on a \n\nlarger screen. And it’s about\
    \ more than just context. On a full-size com-\n\nputer, the browser transforms\
    \ a bit to contain our content, but we really \n\ndon’t think of it that way.\
    \ The browser shows us a website, and it is still on \n\nour computer—we don’t\
    \ really perceive the browser itself changing.\n\n**The magic is transformational**\n\
    \nSo here’s another key difference with an iOS device: Our content delivery, \n\
    \nparticularly in a native app designed very specifically to support a particu-\n\
    \nlar communications need or end-use, *becomes* the thing we’ve designed.\n\n\
    If you’re not convinced, compare the ratio of the screen’s surface area to \n\n\
    other hardware or surface details on the two devices.\n\nThe iPhone, iPod touch,\
    \ and iPad are very similar in one respect: They \n\nare mostly screens. All three\
    \ are about 95 percent screen from a frontal"
  merge: -1
