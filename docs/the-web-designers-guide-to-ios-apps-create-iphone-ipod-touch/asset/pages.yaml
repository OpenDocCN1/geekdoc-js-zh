- img_proc: true
  md: "**115**\n\n*In addition to text and images, social *\n\n*content via feeds,\
    \ and mapping, the *\n\n*NimbleKit Objective-C framework supports *\n\n*rich media\
    \ content such as audio and video.*\n\nWhile not every web designer is an audio\
    \ engineer, today’s \n\nMacs can make basic audio production pretty accessible.\
    \ \n\nFor example, after importing a song into GarageBand, you \n\ncan make some\
    \ fairly quick work out of trimming it and \n\nperhaps adding fades. Doing so\
    \ can give you a brief song \n\nsample, like what you can listen to when shopping\
    \ iTunes \n\nfor music.\n\nThis process makes designing an iOS app with an audio\
    \ \n\nintroduction, song sample, or even spoken directions \n\npossible. A custom\
    \ iOS app for education, a musical \n\ngroup, or a product can be greatly enriched\
    \ with audio \n\ncontent.\n\nNimbleKit supports playing audio content in iOS apps\
    \ \n\nin multiple ways. Two of them are demonstrated in this \n\nchapter: HTML5\
    \ and NimbleKit’s NKAudioPlayer."
  merge: -1
  pgno: 127
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**116**\n\n**Playing audio with HTML5**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_128_0.png)\n\nPlaying an audio file\
    \ with HTML5 could not be any easier. You need \n\nonly use HTML5’s new **audio**\
    \ tag and have an MP3 audio file handy. For \n\nexample, to play a 30-second song\
    \ sample called song.mp3, this is all that’s \n\nneeded:\n\n**<audio src=”song.mp3”\
    \ controls></audio>**\n\nThe addition of **controls** is necessary; without it,\
    \ there’s no way to cue the \n\ntrack to play.\n\nSo at its most basic, playing\
    \ this MP3 file in NimbleKit requires the follow-\n\ning HTML:\n\n**<html>**\n\
    \n**<head>**\n\n**<meta name = “viewport” content = “initial-scale = 1.0, **\n\
    \n**user-scalable = no”>**\n\n**<script type=”text/javascript” src=”NKit.js”></script>**\n\
    \n**</head>**\n\n**<body>**\n\n**<audio src=”song.mp3” controls></audio>**\n\n\
    **</body>**\n\n**</html>**\n\nThe result in Simulator looks like what’s shown\
    \ in **Figure 7.1**.\n\n7.1 The native iOS audio player that \n\nis displayed\
    \ using the HTML5 audio \n\nelement.\n\nSo how can we make this a bit more interesting,\
    \ you might be wondering? \n\nWell, if I were checking out a song sample in an\
    \ iOS app, I might want to \n\nsee who the musician is, so let’s include an image\
    \ (photo.jpg). Additionally, \n\nthe positioning and sizing of the controls can\
    \ be set by a stylesheet so it is \n\ncentered low in the screen, overlaying the\
    \ photo. Here are a few rules for \n\nthis example’s style.css:"
  merge: -1
  pgno: 128
- img_proc: true
  md: "FOCUS ON APP CONTENT: AUDIO / PLAYING AUDIO WITH HTML5\n\n**117**\n\n**body\
    \ {**\n\n** margin: 0px;**\n\n** padding: 0px;**\n\n**}**\n\n**audio {**\n\n**\
    \ width: 100%;**\n\n** position: absolute;**\n\n** z-index: 10;**\n\n** top: 390px;**\n\
    \n**}**\n\nYou can also add a title bar. In this example, the title bar background\
    \ is \n\ncoordinated with the photo. Here’s the revised HTML:\n\n**<html>**\n\n\
    **<head>**\n\n**<meta name = “viewport” content = “initial-scale = 1.0, **\n\n\
    **user-scalable = no”>**\n\n**<link href=”style.css” rel=”stylesheet” type=”text/css”>**\n\
    \n**<script type=”text/javascript” src=”NKit.js”></script>**\n\n**<script type=”text/javascript”>**\n\
    \n**var navController = new NKNavigationController();**\n\n**navController.setTitle(“Piano\
    \ solo”);**\n\n**navController.setTintColor(52, 80, 224);**\n\n**</script>**\n\
    \n**</head>**\n\n**<body>**\n\n**<audio src=”song.mp3” controls></audio>**\n\n\
    **<img src=”photo.jpg” width=100%”>**\n\n**</body>**\n\n**</html>**"
  merge: -1
  pgno: 129
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**118**\n\n![](img/4d979018542def8748544c4af0d37f5a_130_0.png)\n\
    \nWhen you test it in Simulator, you’ll have something with both visual and \n\
    \nmusical interest (**Figure 7.2**).\n\n7.2 The revised example with a title \n\
    \nbar, photograph, and the audio controls \n\nsized and positioned with CSS.\n\
    \nTruly, that’s all there is when it comes to adding audio with HTML5!\n\n**Incorporating\
    \ audio with NKAudioPlayer**\n\nAnother method for incorporating audio into a\
    \ NimbleKit-based iOS app \n\nis by using the **NKAudioPlayer** library item.\
    \ Doing this shifts the coding \n\nwork from HTML and CSS to JavaScript and results\
    \ in a slightly different \n\npresentation.\n\nTo walk through this example, start\
    \ with a new Xcode project file and add \n\nthe song.mp3 and photo.jpg files to\
    \ the project.\n\nNext, create an instance of **NKAudioPlayer** in the main.html\
    \ page. Give it \n\nthe name **player** and have it load the **song.mp3** file:\n\
    \n**var player = new NKAudioPlayer();**\n\n**player.loadFile(“song.mp3”);**\n\n\
    Leaving this as is does not result in any music playing, however. You also \n\n\
    need to create some controls. And strangely, there is no native Objective-C \n\
    \naudio controller for NimbleKit to call on, so you need to build one yourself."
  merge: -1
  pgno: 130
- img_proc: true
  md: "FOCUS ON APP CONTENT: AUDIO / INCORPORATING AUDIO WITH NKAUDIOPLAYER\n\n**119**\n\
    \nFor this purpose, I suggest using the NKToolBar library item. It’s similar to\
    \ \n\nthe **NKTabBarController** that we explored in Chapter 4 except that it\
    \ has \n\nno tabs and **NKToolBar** is 44 pixels instead of 49 pixels tall (or,\
    \ the same \n\nheight as the title bar in **NKNavigationController**). Instead\
    \ of the tabs, \n\n**NKToolBar** inserts buttons onto the bar.\n\nThe next modification\
    \ to main.html is to create a toolbar object and name \n\nit **audiocontrols**.\
    \ In addition to naming the instance, it needs to be \n\npositioned on the screen\
    \ on the y-axis. If the screen is going to have a title \n\nbar at the top, doing\
    \ the math tells us that the top of the toolbar should be \n\npositioned 372 pixels\
    \ from the origin (upper-left corner) in order for it to be \n\nflush to the bottom\
    \ of the screen: 480 (full screen height) – 20 (status bar) \n\n– 44 (title bar)\
    \ – 44 (tool bar) = 372. Here’s that position of the **NKToolBar**\n\nobject being\
    \ set through the first argument passed to the **init()** method:\n\n**var audiocontrols\
    \ = new NKToolBar();**\n\n**audiocontrols.init(372);**\n\nNext, add the buttons\
    \ you’ll need to restart, play, and pause the audio file. \n\nTo do this, use\
    \ the method **toolBar.addButton**. Also note that by default, \n\n**NKToolBar**\
    \ adds buttons starting from the left. Rather than do that, I \n\nencourage you\
    \ to center the buttons so that it looks more like the iPod’s \n\naudio control.\
    \ To make this happen, an odd little command is required: \n\n**audiocontrols.addFlexibleSpace()**:\n\
    \n**audiocontrols.addFlexibleSpace();**\n\n**audiocontrols.addButton(“Restart”,\
    \ “”, “buttonPressed1”);**\n\n**audiocontrols.addButton(“Play”, “”, “buttonPressed2”);**\n\
    \n**audiocontrols.addButton(“Pause”, “”, “buttonPressed3”);**\n\n**audiocontrols.addFlexibleSpace();**\n\
    \n**audiocontrols.setStyle(“blacktranslucent”);**\n\n**audiocontrols.show();**\n\
    \nNote that for every **audiocontrols.addButton** method, there are three \n\n\
    parameters:\n\nr button label\n\nr button graphic\n\nr callback (JavaScript action)\n\
    \nSo, in this example, the three buttons will be labeled Restart, Play, and \n\
    \nPause; there are no graphics assigned to the buttons; and there are three"
