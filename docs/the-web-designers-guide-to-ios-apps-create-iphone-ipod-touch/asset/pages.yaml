    **tableView.show();**\n\nAs you can see, you need to set the type in **tableView.init**\
    \ to **grouped**\n\nand then add the **.insertCategoryNamed** lines for each group.\
    \ The thing \n\nthat’s a bit strange, however, is that those lines themselves\
    \ do not group the \n\nitems. What actually groups them is the fourth parameter\
    \ of **.insertRecord**.\n\nSo, in this example, the three groups are numbered\
    \ **0**, **1**, and **2**.\n\nUnlike the previous elements, the table view does\
    \ not have a set dimension \n\nin both width and height because the height depends\
    \ on the number of \n\nrows you use. As shown in **Table 4.4**, table views only\
    \ have set widths.\n\n**TABLE 4.4 ****Widths of the iOS table view (in pixels)**\n\
    \n**ORIENTATION**\n\n**IPHONE /**\n\n**IPOD TOUCH**\n\n**IPHONE 4**\n\n**IPAD**\n\
    \nPortrait\n\n320\n\n640\n\n768\n\nLandscape\n\n480\n\n960\n\n1024\n\n**Summary**\n\
    \nIn this chapter, you learned how to design some fundamental elements that \n\
    \nwill make your apps look and behave in a way that’s familiar to owners of \n\
    \niOS devices. Now you can\n\nr Plan your screen layouts better by understanding\
    \ what core interface \n\nelements are called and what size they are.\n\nr Use\
    \ the status bar as a “return to top of page” button.\n\nr Implement and customize\
    \ the color of the title bar.\n\nr Use the tab bar navigation when you have a\
    \ smaller screen count \n\nfor your app.\n\nr Use the table view navigation when\
    \ you have a longer list of content \n\ncategories, a larger number of secondary\
    \ screens, or the need to group \n\nnavigation items in your app.\n\nr Add images\
    \ to a table view navigation.\n\nNext, you’ll learn how to incorporate and style\
    \ text and image content."
