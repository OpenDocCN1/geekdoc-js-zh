  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**240**\n\nBut don’t fall into the\
    \ trap of thinking that because the conventions are still \n\nemerging, you can\
    \ design whatever you want. Keep these usability recom-\n\nmendations in mind\
    \ even more when designing for the iPad. Try to come \n\nup with good, elegant,\
    \ and usable ideas that feel familiar.\n\nPerhaps you can help develop the best\
    \ practices that end up being every-\n\none’s design conventions.\n\n**REFERENCES**\n\
    \n**1.**\n\n*Content Strategy for the Web*, Kristina Halvorson (New Riders, \n\
    \n2010)\n\n**2.**\n\nhttp://blog.braintrafﬁc.com/2010/08/content-creation-quality\n\
    \n\\-vs-quantity-or-“a-recipe-for-content-deliciousness”/\n\n**3.**\n\nYale University\
    \ Press, 2008. And it’s still published as a website, \n\ntoo: http://www.webstyleguide.com.\n\
    \n**4.**\n\n*Don’t Make Me Think*, Steve Krug (New Riders, 2006)."
