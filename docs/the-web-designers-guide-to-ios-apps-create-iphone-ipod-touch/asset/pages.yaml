    \niPhone app icon\n\n![](img/4d979018542def8748544c4af0d37f5a_45_1.png)\n\niPhone\
    \ 4 app icon\n\n![](img/4d979018542def8748544c4af0d37f5a_45_2.png)![](img/4d979018542def8748544c4af0d37f5a_45_3.png)\n\
    \niPhone Spotlight \n\niPad app icon\n\napp icon\n\n![](img/4d979018542def8748544c4af0d37f5a_45_4.png)\n\
    \niPhone 4 Spotlight \n\napp icon\n\n![](img/4d979018542def8748544c4af0d37f5a_45_5.png)\n\
    \niPad Spotlight \n\napp icon\n\n![](img/4d979018542def8748544c4af0d37f5a_45_6.png)\n\
    \nApp Store icon\n\n3.6 The full range of \n\nhome screen icons and \n\nSpotlight\
    \ search icons \n\nfor the iPhone, iPhone 4, \n\nand iPad. The first six are \n\
    \npart of the app bundle; \n\nyou submit the 512 × 512 \n\npixel icon separately\
    \ to \n\niTunes for display in the \n\nApp Store."
