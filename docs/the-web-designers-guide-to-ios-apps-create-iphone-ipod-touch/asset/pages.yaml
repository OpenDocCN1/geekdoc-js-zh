  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**194**\n\na specific profession or\
    \ audience with a niche application, consider your \n\nonline communication options\
    \ during your design process.\n\n**Designing an app website**\n\nApple requires\
    \ a URL for any app that is submitted to the App Store for \n\napproval. This\
    \ URL could be a blog, a personal website, your employer’s \n\nwebsite, or your\
    \ own company website—but it needs to go to a real website.\n\nAnd let’s face\
    \ it, any additional publicity for your app is good publicity. \n\nAn app website\
    \ (or page) helps your app feel “more real,” it may be able to \n\ninform people\
    \ more quickly about what it does, and it gives you a much \n\nwider range of\
    \ options than relying on the App Store alone.\n\nI won’t pretend to be an app\
    \ marketing guru, although I did work for sev-\n\neral years in marketing (but\
    \ that was a while ago and not in this industry). \n\nStill, I am happy to share\
    \ some recommendations based mostly on my \n\nown experience with my company’s\
    \ website, www.aesthetesoftware.com \n\n(**Figure 11.3**).\n\n![](img/4d979018542def8748544c4af0d37f5a_206_0.png)\n\
    \n11.3 The Aesthete \n\nSoftware, LLC, website."
