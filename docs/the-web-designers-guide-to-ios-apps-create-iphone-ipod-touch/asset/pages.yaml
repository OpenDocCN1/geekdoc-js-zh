  md: "FOCUS ON APP CONTENT: MAPS / IPAD CONSIDERATIONS\n\n**109**\n\nof 30 pixels\
    \ around the map view and a bit more spacing around the button, \n\ntoo. Doing\
    \ the math leaves us with a map view height of 850 pixels.\n\nThere’s nothing\
    \ new in the HTML itself, so let’s jump ahead to the CSS \n\nwhere I’ve made a\
    \ few changes.\n\n**Writing the CSS**\n\nFollowing through on my plan to have\
    \ a bit of chrome around the iPad map \n\nview, this example has the style.css\
    \ file call up a metal texture background \n\nimage for the body and button, giving\
    \ it an embossed metal look (you \n\ncan download this GIF file from iosapps.tumblr.com;\
    \ look under Table of \n\nContents > Chapter 6). Once again, I had to work one\
    \ step ahead to get the \n\ntop margin value for the button. I needed to calculate\
    \ the height of the map \n\nview (850 pixels) in order to arrive at the top margin\
    \ value: 850 pixels + 30 \n\npixel margin above the map + 20 pixels between the\
    \ map and button = 900 \n\npixels. So here’s the CSS for this version—note how\
    \ the button margins \n\nalso had to change because of the larger iPad screen:\n\
    \n**body {**\n\n**margin: 0px;**\n\n**padding: 0px;**\n\n**font-family: ‘Helvetica’;**\n\
    \n**background-color: #999;**\n\n**background-image: url(metalTexture.gif);**\n\
    \n**background-position: 100% 100%;**\n\n**}**\n\n**.button {**\n\n** font-size:\
    \ 14pt;**\n\n** display: inline;**\n\n**}**\n\n**ul.button {**\n\n** list-style-type:\
    \ none;**\n\n**}**\n\n**ul.button li a {**\n\n**color: #666;**\n\n**background-color:\
    \ #999;**\n\n**width: 220px;**"
