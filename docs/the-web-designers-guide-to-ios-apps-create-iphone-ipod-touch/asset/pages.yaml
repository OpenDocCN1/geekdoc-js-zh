  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**228**\n\n**Be focused and empathetic,\
    \ but not alarmed**\n\nA colleague of Halvorson’s, Erin Anderson, helps point\
    \ the way to a bal-\n\nanced approach to content management. Applied to managing\
    \ iOS app \n\ncontent, the approach is to be focused and empathetic, but not alarmed.\n\
    \nClever. But what does it really mean?\n\nAs Anderson reminds us, “Your content\
    \ can’t please all people, all of the \n\ntime.”² The trouble with being sensitive,\
    \ customer-focused designers and \n\ncontent providers is that we are tempted\
    \ to make every customer or user \n\nhappy, all the time.\n\nBut take that approach\
    \ to its logical conclusion and it quickly becomes \n\nillogical, especially if\
    \ we pay too much attention to the ratings and com-\n\nments in the App Store.\
    \ (Remember how customers can rave—and rant—\n\nin that public space?)\n\nClearly,\
    \ when we read constructive criticism in an app review (or receive \n\nit via\
    \ email), we should pay attention and act. But being disciplined about \n\nfollowing\
    \ a focused content strategy means that we are really trying to keep \n\nmost\
    \ people happy, most of the time. Once we think we can tweak what \n\nwe deliver\
    \ to keep everyone happy, we’re not only fooling ourselves, we’re \n\nprobably\
    \ straying from our original plan.\n\nSo with regard to making a content strategy,\
    \ be of good cheer. Realize \n\nthat just as on the web, the content of your app\
    \ is everything. That makes \n\nit incredibly important, and thus a critical aspect\
    \ to plan in detail. It’s why \n\npeople will want and use your app. If you insist\
    \ on keeping your iOS app \n\ncontent-focused, well-maintained, and governed by\
    \ a plan with a structure \n\nand a schedule, you will indeed keep most people\
    \ happy, most of the time.\n\nAnd that’s called success."
