  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**220**\n\n**Summary**\n\nWhew! This\
    \ chapter basically gave you a master’s degree in Apple Devel-\n\noper security\
    \ and app marketing. I hope this documentation fills in a lot \n\nof the gaps\
    \ that I found when I learned these processes and read Apple’s \n\ndocumentation—if\
    \ nothing else, I think it’s helpful to have it all in one \n\nplace. And what\
    \ you just learned is how to\n\nr Generate Certificate Signing Requests (CSRs)\
    \ using the Keychain \n\nAccess and Certificate Assistant applications on your\
    \ Mac.\n\nr Pass along the CSRs to the iOS Provisioning Portal to create develop-\n\
    \nment and distribution certificates.\n\nr Download and install these certificates,\
    \ along with the Apple World-\n\nwide Developer Relations Certification Authority\
    \ certificate (WWDR \n\nintermediate), in Keychain Access.\n\nr Create App IDs\
    \ and choose Apple Devices for development \n\nprovisioning.\n\nr Submit app information,\
    \ version information, and app icons, screen-\n\nshots, and binary files to iTunes\
    \ Connect.\n\nYou’ve made it! You have explored how to design native iOS apps\
    \ with \n\nweb standards and NimbleKit, plus you have learned about some helpful\
    \ \n\nUI and UX recommendations, a generous helping of HTML5 and CSS3, \n\nand\
    \ some NimbleKit alternatives for mobile design.\n\nAnd before diving right into\
    \ your own projects, read about content strat-\n\negy, planning, and usability\
    \ (Appendix A). These topics did not fit neatly \n\ninto the flow of the other\
    \ chapters, but are perfect to read now before you \n\nembark on your own app\
    \ adventures."
