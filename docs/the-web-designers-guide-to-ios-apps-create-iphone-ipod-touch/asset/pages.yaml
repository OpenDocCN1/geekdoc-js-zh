    \ × 29 (Icon-\n\nSmall.png)\n\n58 × 58 (Icon-\n\nSmall@2x.png)\n\n50 × 50 (Icon-\n\
    \nSmall-50.png)\n\nFor the iTunes App Store, the icon is 512 × 512 pixels (but\
