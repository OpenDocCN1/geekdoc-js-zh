  md: "MARKETING YOUR APPS / DESIGNING YOUR OWN APP MARKETING COMMUNICATIONS\n\n**193**\n\
    \nSome of Apple’s language requirements are a bit tedious to describe, but I \n\
    \nhope this is a good introduction to their top requirements. You are encour-\n\
    \naged, however, to keep up with the details and any updated recommenda-\n\ntions\
    \ by checking in with the marketing resources on Apple’s iOS Dev \n\nCenter.\n\
    \n**Using Apple-approved typography**\n\nFinally, don’t think that Apple has no\
    \ opinion on the typeface you use in \n\nyour app communications—it does.\n\n\
    Fortunately, the rule is quite simple: You are forbidden to use any version \n\
    \nof the Myriad typeface, because Apple uses a version of it in their corpo-\n\
    \nrate communications and they do not want your communications to be \n\nconfused\
    \ with theirs. Fair enough, though too bad for us (as Myriad is a \n\nnice typeface).\n\
    \n**Designing your own app **\n\n**marketing communications**\n\nThe fact that\
    \ the App Store has over 250,000 apps means that it has a ton of \n\ntraffic,\
    \ and is currently the main point of contact for the majority of people \n\nin\
    \ the world who are shopping for native mobile apps. No other mobile \n\ndevice\
    \ has an app store with as many products or customers. This is great \n\nnews\
    \ for iOS app designers.\n\nBut having over 250,000 apps also means that your\
    \ app is the proverbial \n\nneedle in the haystack. Depending on what it does,\
    \ your app could have a \n\nlot of competition. And depending on how it is categorized\
    \ and positioned \n\nin the App Store, it could have either thousands of downloads\
    \ or just a \n\nhandful. This is the downside of the App Store for iOS app designers.\n\
    \nNaturally, success is defined by the scope and goals of any given app. A very\
    \ \n\nspecialized app might be designed to appeal to only a very narrow audi-\n\
    \nence; most of the ones I have designed fall into this category. Nonetheless,\
    \ \n\nI still want my target audience to find it. Using the web is a valuable\
    \ tool in \n\nhelping to get the word out.\n\nSo whether you are seeking exposure\
    \ to all iOS device owners for a gen-\n\neral purpose app or one that could have\
    \ very broad appeal, or targeting"
