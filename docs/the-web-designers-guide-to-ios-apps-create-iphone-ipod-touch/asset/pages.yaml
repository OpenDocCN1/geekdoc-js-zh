    \ And if \n\nyou do, don’t say I didn’t warn you.\n\nThe good news is, the download\
    \ is really worth it. You get some dandy tools \n\nthat do some incredible things,\
    \ and they are all free.\n\nYes, this is the one free part of being an Apple Developer.\
    \ You get their \n\ndeveloper tools gratis. And it’s a nice set of tools that\
