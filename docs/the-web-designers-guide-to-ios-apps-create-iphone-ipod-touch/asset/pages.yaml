  md: " ADDITIONAL GUIDING PRINCIPLES / APP USABILITY\n\n**235**\n\nhe observes crestfallen\
    \ site owners and designers sit in on usability evalua-\n\ntions. I’ve been there,\
    \ and I know exactly what it feels like to have my high \n\ndesign expectations\
    \ lowered.\n\nSo what does Krug recommend for this situation, and how does it\
    \ apply to \n\ndesigning apps for iOS mobile devices? Let’s take a look, and think\
    \ about it, \n\nso our app users don’t need to.\n\n**Create a clear visual hierarchy**\n\
    \nEstablishing a clear visual hierarchy is one of the most important, central\
    \ \n\nservices that designers can bring to bear on someone’s project and its con-\n\
    \ntent. In fact, it’s timeless: I was teaching undergraduates at the University\
    \ \n\nof Minnesota the fundamentals of visual hierarchy in Graphic Design 101\
    \ \n\nway before they were learning much about sexy web and interactive media\
    \ \n\ntechnologies, because it’s just as important for designing an effective\
    \ \n\nposter, book, or postcard as it is for designing a good website and, now,\
    \ \n\nmobile application.\n\nKrug argues that the basic tenets of good visual\
    \ hierarchy are\n\nr Make the things that are most important the most prominent.\n\
    \nr Group items that belong together (and separate those that do not).\n\nr Use\
    \ nesting to add further clarity about relationships between catego-\n\nries and\
    \ items within them.\n\nI wholeheartedly agree with these basic rules. They have\
    \ governed the \n\nprinted page for centuries and allowed people to navigate large\
    \ amounts \n\nof dense content (think about newspapers and dictionaries).\n\n\
    Some iOS suggestions regarding these guidelines:\n\nr Be just as savvy with typography\
    \ in apps as you would be with websites, \n\nbut favor even fewer styles. Sizing,\
    \ the use of bold, and at most a second \n\ntypeface should take you as far as\
    \ you need to go in creating content \n\nhierarchy on a small screen.\n\nr Use\
    \ grouped table views when you have groups of items that belong \n\ntogether.\n\
    \nr Definition lists are a nice way to nest information under labels."
  merge: -1
  pgno: 247
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**236**\n\n**Take advantage of conventions**\n\
    \nConventions are a bit of a paradox for designers. We like great ideas, yet the\
    \ \n\nmore that great ideas become imitated by others and broadly adopted into\
    \ \n\nthe mainstream (thus becoming a convention), the more we start to chafe\
    \ \n\na bit and want to do something different. Just to be unique and creative.\
    \ \n\nTo design.\n\nBut as Krug reminds us, conventions are your friends. And\
    \ designing is not \n\nalways creating something different.\n\nThe more that conventions\
    \ are adopted, the less users and customers have \n\nto figure things out on the\
    \ fly as they try to use what we have designed. And \n\nif getting people to information\
    \ quickly and easily is our goal, conventions \n\nshould play a big role. If instead\
    \ we want an adventurous, challenging \n\nmeans to uncovering a tidbit of information\
    \ (e.g., an “Easter egg”), then \n\ndesigning an obscure path is the way to go.\n\
    \nThe latter might be great fun in the realm of gaming, but the fact is that \n\
    \nmost people want quick results. This usually means using more familiar \n\n\
    items than unfamiliar items.\n\nConsequently, this book emphasized becoming familiar\
    \ with iOS con-\n\nventions like the status bar, title bar, table view, and tab\
    \ navigation for an \n\nimportant reason: We see these items all the time in other\
    \ mobile applica-\n\ntions (including the ones that Apple designs), so we need\
    \ to learn how to \n\ndesign apps that fit the same mold when it’s appropriate.\
    \ And it’s appropri-\n\nate every time we want to design content-based apps that\
    \ convey informa-\n\ntion easily to users whenever, and wherever, they seek it.\n\
    \n**Break pages up into clearly defined areas**\n\nGiven how small iPod touch\
    \ and iPhone screens are, you might at first \n\ndismiss having to think about\
    \ defined areas in mobile applications.\n\nThink again.\n\nGranted, the smaller\
    \ iOS screen size doesn’t really lend itself to much dead \n\nspace like a web\
    \ page can. So the problem of drawing attention to impor-\n\ntant content on a\
    \ screen is not necessarily as challenging in the small screen \n\nenvironment\
    \ as in the large screen environment."
  merge: -1
  pgno: 248
- img_proc: true
  md: " ADDITIONAL GUIDING PRINCIPLES / APP USABILITY\n\n**237**\n\nNonetheless, as\
    \ soon as you begin laying out an app screen with a title bar, \n\ncontent area,\
    \ and perhaps a tab navigation, you’re making decisions about \n\nactionable areas\
    \ versus content to read. And despite the small screen, it’s \n\nstill possible\
    \ to place additional links throughout an app screen in such a \n\nway that there’s\
    \ too much for a user to sort through. Similarly, structur-\n\ning your content\
    \ in the wrong way—or mislabeling navigation buttons or \n\ntabs—reduces the clarity\
    \ of your intended design.\n\nAs soon as you enter iPad territory, issues like\
    \ clearly defined areas of a \n\npage can become much trickier (**Figure A.1**).\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_249_0.png)\n\nA.1 The App Store on\
    \ \n\nthe iPad has a lot going \n\non. Are the areas clearly \n\ndefined, and\
    \ hierarchies \n\nwell established? Is \n\nthis screen designed to \n\nget visitors\
    \ somewhere \n\nspecific or to encourage \n\nthem to browse?"
  merge: -1
  pgno: 249
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**238**\n\nOf course, there are exceptions\
    \ to some of these rules—but rarely, if ever, \n\nall of these rules. Looking\
    \ at the example of the App Store, it’s clear to me \n\nthat Apple’s design team\
    \ can do a good job of clearly defining areas of a \n\nscreen: There are three\
    \ tabbed choices at the top, an In the Spotlight cov-\n\nerflow area beneath that,\
    \ and areas below that focus on some of the newest \n\napps that are available.\
    \ The screen layout is quite clear, and it uses some \n\nemerging conventions\
    \ of the device quite well—but it’s fair to say that the \n\nhierarchy isn’t particularly\
    \ clear.\n\nBut when we think about it, Apple is trying to get people interested\
    \ in lots \n\nof apps. All of the apps. So the lack of hierarchy is probably intentional:\
    \ \n\nThis is an app design that encourages browsing and searching, not navigat-\n\
    \ning structured content.\n\nSo feel free to stray from the good usability conventions—when\
    \ you can \n\njustify it.\n\n**Make it obvious what’s clickable**\n\nPeople do\
    \ a lot of clicking on both websites and iOS apps, so making it \n\nobvious what\
    \ is clickable—or, in this case, touchable—is of paramount \n\nimportance for\
    \ ease of use and efficiency. Fortunately, Apple provides \n\nus with several\
    \ UI standards for designing obvious touchable spots in \n\nour apps:\n\nr rows\
    \ in table view navigations\n\nr tabs in tab bar navigations\n\nr rectangular\
    \ buttons with rounded corners\n\nr back buttons that point left\n\nAdditionally,\
    \ more advanced app designers can leverage the nice date \n\npicker interface\
    \ and other ways to interact with information and choices.\n\nSo the basic tenet\
    \ of touchability is this: If something links to something \n\nelse in an app,\
    \ it better be obvious. I still find myself designing hyperlinks \n\nwithin app\
    \ content and later realizing that sometimes they’re just not obvi-\n\nous enough\
    \ as links. On the other hand, peppering content with a bunch of \n\nbuttons breaks\
    \ up the flow of reading, too (**Figure A.2**)."
  merge: -1
  pgno: 250
- img_proc: true
  md: " ADDITIONAL GUIDING PRINCIPLES / APP USABILITY\n\n**239**\n\n![](img/4d979018542def8748544c4af0d37f5a_251_0.png)\n\
    \nA.2 A screenshot from one of the \n\napps I designed. In my opinion, there’s\
    \ a \n\nbutton or link that should be made more \n\nobvious. Can you tell which\
    \ one it is? \n\nIt’s the \\*8, which is bold but otherwise \n\ndifficult to pick\
    \ out as a link.\n\nHmm, designing easy-to-use app content is not always simple,\
    \ is it? In light \n\nof this, never hold back on iterating to keep improving\
    \ a design and apply-\n\ning new ideas that you learn from app to app. You can\
    \ update apps once \n\nthey’re in the App Store: Take advantage of this!\n\n**Minimize\
    \ noise**\n\nUnnecessary visual noise is less likely to infiltrate an iOS app\
    \ screen than a \n\nmuch larger web page, but it’s not impossible. Often noise\
    \ is in the details, \n\nsuch as the darkness of lines or shadows. If you’re designing\
    \ a custom but-\n\nton, how wide can the border be—and how dark the shadow effect—before\
    \ \n\nthe button begins to make too much noise? It’s the same with a custom \n\
    \ntable view: If you’re adding a textured background image, what is elegant \n\
    \nand subtle, and what is just loud and heavy-handed?\n\nAnd once again with the\
    \ iPad screen: The more real estate you have to work \n\nwith, the more opportunity\
    \ you have to mess it up.\n\nIn my opinion, UI design for the iPad is still very\
    \ much a Wild West sce-\n\nnario. It’s a lot like the web in the mid-’90s: Nearly\
    \ anything goes, simply \n\nbecause it takes a while for conventions to emerge,\
    \ and tablet computing is \n\na very new area to work in."
