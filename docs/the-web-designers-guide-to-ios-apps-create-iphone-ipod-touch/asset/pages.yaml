  md: "ESTABLISHING YOUR APP DESIGN STUDIO / GETTING AN APPLE DEVELOPER ID\n\n**17**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_29_0.png)\n\n2.1 The starting point\
    \ \n\nfor obtaining your Apple \n\nDeveloper ID.\n\n![](img/4d979018542def8748544c4af0d37f5a_29_1.png)\n\
    \nThe second screen in the process (**Figure 2.2**) asks whether you have an \n\
    \nexisting Apple ID, and explains that you can, if you wish, use an Apple \n\n\
    ID that you already have for iTunes or for purchasing goods online from \n\nthe\
    \ Apple Store. Yet Apple ominously notes under these choices that it is \n\nprobably\
    \ better to create a separate Developer ID to “avoid accounting and \n\nreporting\
    \ issues.”\n\n2.2 Unless you are \n\nalready an Apple \n\nDeveloper, don’t use\
    \ an \n\nexisting Apple ID. It could \n\nmake accounting and \n\nreporting problematic\
    \ \n\ndown the road.\n\nOne has to wonder: Why are we even given an option here?\n\
    \nIf you’re like me, you probably dislike accounting or reporting problems, so\
    \ \n\nI have a strong suggestion: Just create another ID. This keeps your Apple\
    \ \n\n*customer* role completely separate from your Apple *Developer* role. It\
    \ also \n\nallows your Apple Developer ID to be associated with a corporate entity\
    \ \n\nwith its own tax identification number, which may offer some tax advan-\n\
    \ntages to you down the road."
