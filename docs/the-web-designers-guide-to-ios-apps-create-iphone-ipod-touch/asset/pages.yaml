  md: "FOCUS ON APP CONTENT: VIDEO / DELIVERING VIDEO WITH HTML5 ON IPAD\n\n**131**\n\
    \nWhat is happening here? By displaying as block and having auto left and \n\n\
    right margins, the video is centered horizontally—even when the screen \n\nis\
    \ rotated. So file this technique under “iPad design tips” and notice that it\
    \ \n\nborrows from techniques used to center things in flexible-width and liquid\
    \ \n\nlayout web pages.\n\nThe other notable styling element here is the CSS3\
    \ **box-shadow** property \n\n(with proprietary **–webkit-** prefix). Combined\
    \ with the border, margin, \n\nand padding properties, the result is a nice frame\
    \ for the video. It’s HTML5 \n\nand CSS3 working together—and you haven’t even\
    \ gotten to the chapter \n\nthat focuses on these magical specifications! (Consider\
    \ this just a preview.)\n\n**NOTE ****Prefixed CSS properties**\n\nWith preﬁxed\
    \ CSS properties it’s good practice to follow it with the non-preﬁxed \n\nproperty\
    \ for forward-compatibility. Someday, Apple may stop supporting **–webkit-**\n\
    \n**box-shadow** and switch over to just **box-shadow**. It feels redundant to\
    \ do so, but \n\ncould save some pain later as CSS matures and browser preﬁxes\
    \ are less necessary.\n\nNext, use the following rules to add a margin to the\
    \ entire screen and style \n\nthe h1—yes, I’m actually using Zapfino:\n\n**body\
    \ {**\n\n** background-color: #fff;**\n\n** margin: 20px;**\n\n** padding: 0px;**\n\
    \n** font-family: Helvetica;**\n\n**}**\n\n**h1 {**\n\n** margin-top: 50px;**\n\
    \n** margin-bottom: 10px;**\n\n** padding: 0px;**\n\n** font-size: 3em;**\n\n\
    ** font-family: Zapﬁno;**\n\n** line-height: 2em;**\n\n** text-align: center;**\n\
    \n**}**"
  merge: -1
  pgno: 143
- img_proc: true
