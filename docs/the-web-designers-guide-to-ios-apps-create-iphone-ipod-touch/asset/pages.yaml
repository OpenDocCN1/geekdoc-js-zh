  md: "HTML5 AND CSS3 / MORE DESIGN OPTIONS WITH CSS3\n\n**165**\n\n**color-stop (.3,\
    \ #fff),**\n\n**color-stop (.7, #333),**\n\n** to(#333));**\n\nAnd now the results\
    \ look like **Figure 9.13**.\n\n![](img/4d979018542def8748544c4af0d37f5a_177_0.png)\n\
    \n9.13 The Juvelo text screen with its \n\nnew background gradient *unevenly*\n\
    \napplied diagonally from top left to \n\nbottom right; the first and last 30\
    \ \n\npercent of the background is solid, and \n\nthe gradient is applied only\
    \ to the middle \n\n40 percent of the distance.\n\nNow the result is very different,\
    \ and has more of a glassy ripple effect.\n\nAs you might have guessed, this is\
    \ just the beginning of using gradients—\n\nthere is also a radial gradient. Experimenting\
    \ with gradients is even more \n\nfun when you transition from one color to another,\
    \ so give that a try, too; \n\nI couldn’t adequately convey the coolness of color\
    \ gradients here in this \n\ntwo-color format. You’re not limited to transitioning\
    \ from just one color to \n\nanother, either; you could incorporate several transitions\
    \ in **color-stop**\n\nfor a rainbowlike effect.\n\n**Cool CSS3 styling tools**\n\
    \nWriting CSS3 is not particularly difficult, but perhaps you are more of a \n\
    \nvisual designer. Or maybe CSS3 is still really new to you and you’d like to\
    \ \n\nstart using it more, but keep the training wheels on for a while. Regard-\n\
    \nless of your reason, there are some really cool CSS3 tools out there that \n\
    \ncan help you work much more quickly, or more safely, as you explore your"
  merge: -1
  pgno: 177
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**166**\n\noptions. Two of them are\
    \ AppControls, a shareware application, and CSS3 \n\nPlease!, a cross-browser\
    \ CSS3 rule generator.\n\n**AppControls**\n\nLike NimbleKit, AppControls is another\
    \ iOS development tool that is \n\nfeatured on Apple’s website—that’s how I discovered\
    \ it. In fact, it’s not \n\ntechnically just an iOS development tool; you could\
    \ use it to style controls \n\nfor websites, too.\n\nAppControls gives you a handy\
    \ window where you can quickly specify \n\nwidth, height, border radius, gradient,\
    \ border, drop shadow, inner shadow, \n\nand text options for controls. As you\
    \ make your selections, the preview \n\nchanges right in front of you (**Figure\
    \ 9.14**).\n\n![](img/4d979018542def8748544c4af0d37f5a_178_0.png)\n\nIf the live\
    \ preview isn’t cool enough for you, the CSS that AppControls \n\ngenerates for\
    \ you should be. That’s right, click on Show CSS and you get all \n\nof the CSS\
    \ you need to create the same look, either inline or via an external \n\nstylesheet\
    \ (**Figure 9.15**).\n\n9.14 AppControls \n\nprovides an easy-to-use \n\ninterface\
    \ for making CSS3 \n\nselections, and provides a \n\nlive preview of the results\
    \ \n\nin the same window."
  merge: -1
  pgno: 178
- img_proc: true
  md: "HTML5 AND CSS3 / MORE DESIGN OPTIONS WITH CSS3\n\n**167**\n\n![](img/4d979018542def8748544c4af0d37f5a_179_0.png)\n\
    \n9.15 AppControls also \n\nprovides the CSS code, \n\nso it writes the button\
    \ \n\nstyles for you—and you \n\ncan choose from the inline \n\nstyle or external\
    \ stylesheet \n\nrules.\n\n![](img/4d979018542def8748544c4af0d37f5a_179_1.png)\n\
    \nAfter you get the control looking the way you want to, just copy the CSS \n\n\
    out of AppControls and put it into a stylesheet in an Xcode app. Reference \n\n\
    the stylesheet in your HTML file, style a **div** with the ID that is provided,\
    \ \n\nand enter the same text you used in AppControls—the result will look the\
    \ \n\nsame when you test it in Simulator (**Figure 9.16**).\n\n9.16 AppControls\
    \ also provides the \n\nCSS itself, so it writes the button styles \n\nfor you—and\
    \ you can choose the inline \n\nstyle or the external stylesheet rules.\n\nAppControls\
    \ is shareware that you can download from the folks at Blue \n\nCrowbar Software^(11)\
    \ and at this writing the full version costs just $29.90; \n\nthe free trial version\
    \ does everything for you, but it doesn’t allow you to cut \n\nand paste the CSS\
    \ that it generates (that is, some typing is required if you \n\ngo the free route\
    \ with this tool)."
  merge: -1
  pgno: 179
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**168**\n\n**CSS3 Please!**\n\nCSS3\
    \ Please! is a website^(12) that provides results that are similar to \n\nAppControls.\
    \ The up side is that the website doesn’t require you to sign up, \n\nso it’s\
    \ completely free. The down side is that the interface is less elegant, \n\nand\
    \ doesn’t allow you to change the content or size of the **div** that you’re \n\
    \npreviewing. But for quick previews of CSS3 rules in a live browser setting,\
    \ \n\nyou still can’t beat the price for what it can do.\n\nThe CSS3 rules that\
    \ CSS3 Please! previews for you include border-radius, \n\nbox-shadow, gradient,\
    \ RGBA, transform (rotate), transition, text-shadow, \n\nand @font-face (**Figure\
    \ 9.17**).\n\n![](img/4d979018542def8748544c4af0d37f5a_180_0.png)\n\nInstead of\
    \ color pickers and sliders, though, you just click on the CSS that \n\nis provided\
    \ right on screen and make changes that are then displayed in the \n\nadjacent\
    \ live view.\n\nIt’s not quite as fancy as AppControls, but it’s fun to give it\
    \ a try just to see \n\nhow they built the web tool. Kudos to its creators, Paul\
    \ Irish and Jonathan \n\nNeal (in association with Boaz Sender and Zoltan Hawryluk),\
    \ whom you \n\nshould look up—they do some pretty cool stuff when they’re not\
    \ tweaking \n\nCSS3 Please!\n\n9.17 CSS3 Please! \n\nfeatures a live preview \n\
    \nof the CSS3 rules that \n\nyou edit, but no UI is \n\nprovided—you edit the\
    \ \n\ncode right in the same \n\nbrowser window!"
  merge: -1
