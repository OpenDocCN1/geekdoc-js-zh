  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**30**\n\n![](img/4d979018542def8748544c4af0d37f5a_42_0.png)\n\
    \n3.3 When you see files like the \n\nones shown here, with .h, .m, .xib, \n\n\
    and .framework file extensions, \n\ndo not edit them. Editing them will \n\ndisable\
    \ the NimbleKit framework!\n\nWhy shouldn’t you edit these files? NimbleKit comes\
    \ with a veritable \n\ntreasure chest full of great code in these folders, just\
    \ like code frameworks \n\nfor websites. And all of this richness is in these\
    \ folders. So just as you would \n\nnever download a JavaScript framework like\
    \ jQuery or a CSS framework \n\nlike Blueprint, and then start messing around\
    \ with the files, you shouldn’t \n\ndo anything to the files outside the HTML\
    \ folder until explicitly instructed \n\nto do so. (There are a few isolated reasons\
    \ to make changes in some of the \n\nfiles there, and I will carefully explain\
    \ why at the end of this chapter.)\n\n**Naming a project and creating the app\
    \ bundle**\n\nI should probably not admit to this, but until recently, I foolishly\
    \ spent a lot \n\nof time manually renaming a variety of files in my Xcode projects.\
    \ The app \n\nname can inform the name of many other things including some of\
    \ its key \n\nresource files, so changing the name manually requires you to change\
    \ it in \n\nseveral different files and locations. But then I learned that there\
    \ is a much, \n\nmuch easier way to do this.\n\nAren’t you glad I figured this\
    \ out in time to tell you?\n\nSo here is the secret: Project > Rename.\n\nI know—it\
    \ could not have been labeled any more clearly, right? Well, fret \n\nnot—I am\
    \ feeling plenty sheepish."
  merge: -1
  pgno: 42
- img_proc: true
  md: "FUNDAMENTALS OF THE IOS SDK / STARTING A NEW XCODE PROJECT\n\n**31**\n\n![](img/4d979018542def8748544c4af0d37f5a_43_0.png)\n\
    \nWhen you select Rename, you’re prompted with a small window that \n\nallows\
    \ you to select up to five items to include in the renaming process \n\n(**Figure\
    \ 3.4**).\n\n3.4 Renaming an app \n\nproject.\n\n![](img/4d979018542def8748544c4af0d37f5a_43_1.png)\n\
    \nThese are five of the items that comprise a project’s *app bundle* (more on\
    \ \n\nthis later in this chapter):\n\nr Project file (name.xcodeproj)\n\nr Target\
    \ (name)\n\nr App name (name)\n\nr Precompiled header (name\\_Prefix.pch)\n\n\
    r Information property list file (name-Info.plist)\n\nFor consistency’s sake,\
    \ I suggest checking all of them so your name is \n\npropagated across all of\
    \ these items.\n\nThere appear to be no significant limitations to project or\
    \ app names. For \n\nexample, Apple limits app names to 255 characters. I’m not\
    \ sure why you \n\nwould ever want an app name that long, and neither is Apple\
    \ because they \n\nrecommend that the name not exceed 35 characters. At that length,\
    \ the \n\nentire name shows up in the App Store app on iOS devices. **Figure 3.5**\n\
    \nshows a filename that is too long, indicated by the ellipsis.\n\n3.5 This is\
    \ what you get when your app name \n\nfor the home screen is too long—a truncated\
    \ \n\nversion with an ellipsis."
  merge: -1
  pgno: 43
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**32**\n\nBut there’s a more important\
    \ limitation to the name that you probably \n\nwant to consider: The name that\
    \ can appear under the device icon is much \n\nshorter than 35 characters. And\
    \ to make it somewhat complicated, there is \n\nno set maximum because Helvetica\
    \ is not a monospaced font, so the more \n\nnarrow characters in your app name\
    \ (i, l, j), the longer your app name can \n\nbe; the wider the characters (O,\
    \ D, Q ), the shorter. Practically speaking, an \n\napp name that fits under its\
    \ screen icon is 10–12 characters in length.\n\n**NOTE ****Close also counts in\
    \ screen names and iTunes names**\n\nThe app’s screen name doesn’t need to be\
    \ identical to its name in iTunes. For exam-\n\nple, you might use Wonder App\
    \ as a screen name but Wonder App iPad Edition for the \n\nfull iTunes name. Apple\
    \ prefers that both names are the same (or very similar to each \n\nother), and\
    \ Apple has other requirements, for example, the name cannot be trade-\n\nmarked\
    \ by others. For all of these details, check the iTunes Connect Developer Guide.\n\
    \n**Making your app icon**\n\nAnother key part of your app’s identity is its icon.\
    \ A new NimbleKit-based \n\nXcode project does not come with a default app icon,\
    \ so you will have to \n\nmake one.\n\nOr, several. How about up to seven for\
    \ a universal app?\n\nUntil April 2010, designing an app icon was a simpler process.\
    \ You just \n\nmade three sizes: a small one for the device’s home page, a smaller\
    \ one for \n\nSpotlight search results, and a much larger one for the iTunes App\
    \ Store.\n\nBut with the advent of the iPad and then the iPhone 4, things got\
    \ really \n\ninteresting with the app icon because each of these devices has a\
    \ resolu-\n\ntion that is different from the iPod touch and earlier iPhones. So\
    \ now each \n\nscreen size needs its own home screen and Spotlight search icons\
    \ if you \n\nwant them optimized for their native resolutions.\n\nTo be perfectly\
    \ honest, I am not convinced that the Spotlight search icon is \n\nparticularly\
    \ important. If your icon is designed to be viewed at 57 × 57 pix-\n\nels, there’s\
    \ a good chance that the results you get by resizing to 29 × 29 pixels \n\nwill\
    \ not be noticeably better than what the device does when it scales it for \n\n\
    you. And do you really want to design an icon that is optimized for 29 × 29 \n\
    \npixels? Unlikely — it’s quite a tiny size for trying to optimize any design."
  merge: -1
  pgno: 44
- img_proc: true
  md: "FUNDAMENTALS OF THE IOS SDK / STARTING A NEW XCODE PROJECT\n\n**33**\n\nBut\
    \ if you are a pixel perfectionist and extremely picky about graphics \n\nbeing\
    \ scaled properly, you will want to resize (or redesign) your app icon \n\nas\
    \ needed for each use scenario. **Table 3.1** shows the specifications for the\
    \ \n\nicon files that are bundled with the app.\n\n**TABLE 3.1 ****Size (in pixels)\
    \ and name specifications for iOS app icons**\n\n**APP ICON**\n\n**IPHONE / **\n\
