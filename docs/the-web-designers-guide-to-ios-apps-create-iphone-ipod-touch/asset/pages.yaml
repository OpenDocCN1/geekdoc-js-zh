  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**164**\n\n![](img/4d979018542def8748544c4af0d37f5a_176_0.png)\n\
    \nWhat if you want the gradient to be diagonal? Simple: just change the \n\ndirection\
    \ of change from left top to left bottom, to left top to right bottom:\n\n**background:\
    \ -webkit-gradient(**\n\n**linear,**\n\n**left top,**\n\n**right ****bottom,**\n\
    \n**from(#fff),**\n\n**to(#333));**\n\nThe result will look like **Figure 9.12.**\n\
    \n9.12 The Juvelo text screen with its \n\nnew background gradient evenly applied\
    \ \n\ndiagonally from top left to bottom right.\n\nYou’re not required to have\
    \ a gradient start at the top and end at the bot-\n\ntom; you can set the start\
    \ and stop points from 0 to 1 so you get larger areas \n\nof solid color and a\
    \ narrower band of the gradient. To see how this works, \n\nedit your code by\
    \ adding **color-stop** to match this example, which con-\n\nstrains the gradient\
    \ to the middle 40 percent of the page and allots the first \n\nand last 30 percent\
    \ to solid color:\n\n**background: -webkit-gradient(**\n\n**linear,**\n\n**left\
    \ top,**\n\n**right bottom,**\n\n**from(#fff),**"
