  md: "**67**\n\n*Words and images: our primary *\n\n*forms of visual communication.*\n\
    \n*And our most important *\n\n*content for iOS applications.*\n\nThe basis for\
    \ any content-based mobile application \n\nis, quite naturally, content. The forms\
    \ in which we \n\ncommunicate primarily involve words, pictures, and often \n\n\
    both. Fortunately, all of the understanding and experience \n\nthat web designers\
    \ have accumulated about structuring \n\nand formatting text and image content\
    \ for the web \n\ntranslates very well to iOS apps designed with NimbleKit.\n\n\
    But before you think that working with text and images \n\nis as simple as wrapping\
    \ paragraphs in **<p>** tags and \n\nproperly sizing and formatting photos, let’s\
    \ consider \n\nhow HTML allows us to design content semantically—\n\nthat is,\
    \ with a structural hierarchy and logic. We’ll do so \n\nby considering some principles\
    \ that should be familiar \n\nalready, and focus on them through the unique lens\
    \ of iOS \n\ndevices and iOS app examples to sharpen the already-\n\nstrong instincts\
    \ we’ve honed by designing standards-\n\nbased websites."
  merge: -1
  pgno: 79
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**68**\n\n**Structuring text**\n\n\
    To begin exploring best practices for structuring text for iOS apps, we need \n\
    \na suitable sample of text that has some kind of structure. A good example of\
    \ \n\nthis in the public domain is the United States Bill of Rights.\n\nThere\
    \ are a few different ways to go about structuring this content with \n\nHTML—let’s\
    \ explore them to see how they affect the way the text is \n\ndisplayed.\n\n**Ordered\
    \ list**\n\nOne way to structure the Bill of Rights, in light of there being ten\
    \ of them \n\nthat need to appear in a particular order, is to make an ordered\
    \ list. The \n\nsemantic meaning would be conveyed clearly, and one might argue\
    \ that \n\nthis method is also the most convenient—in this case, NimbleKit’s web\
    \ \n\nview does the numbering for us just like any other browser engine. Such\
    \ a \n\nlist would begin as follows:\n\n**<h1>The United States Bill of Rights</h1>**\n\
    \n**<ol>**\n\n**<li>Congress shall make no law respecting an establishment **\n\
    \n**of religion, or prohibiting the free exercise thereof; or **\n\n**abridging\
    \ the freedom of speech, or of the press, or the **\n\n**right of the people peaceably\
    \ to assemble, and to petition **\n\n**the Government for a redress of grievances.</li>**\n\
    \n**<li>A well regulated Militia, being necessary to the **\n\n**security of a\
    \ free State, the right of the people to keep **\n\n**and bear Arms, shall not\
    \ be infringed.</li>…**\n\n**{amendments 3-10}**\n\n**</ol>**\n\nThe results are\
    \ rendered as shown in **Figure 5.1** (on page 70)."
  merge: -1
  pgno: 80
