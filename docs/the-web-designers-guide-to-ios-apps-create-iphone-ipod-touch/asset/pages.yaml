  md: "**185**\n\nI always tell people that I view design as a holistic activity:\
    \ \n\nThe visioning, planning, and creative work involves \n\nmore than making\
    \ the thing that you’re designing. Much \n\nof the creative challenge lies in\
    \ nurturing the human \n\nrelationships involved in design projects, as well as\
    \ \n\nmanaging the various outcomes that can occur after the \n\n“creative work”\
    \ is done.\n\nIn other words, it’s all design—and all of the work for a \n\nproject,\
    \ from beginning to end, is creative because it is all \n\ninterconnected.\n\n\
    So as you travel the arc of iOS app planning, design, and \n\nmanagement, you’ll\
    \ need to consider some of the more \n\ncommunications- and marketing-oriented\
    \ decisions. \n\nBecause creating an app is a lot of the work, but it’s not \n\
    \nall of the work. Who is the audience for your iOS app, \n\nwho is the client,\
    \ and how do you want to shape your \n\nrelationship with these entities, and\
    \ with Apple? And what \n\nare Apple’s guidelines for doing this?"
  merge: -1
