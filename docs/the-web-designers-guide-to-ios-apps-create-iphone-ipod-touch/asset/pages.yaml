    \ rather than go into great detail about Apple’s human interface \n\nguidelines\
    \ (which are documented extensively at developer.apple.com), I’ll convey the spirit\
    \ of \n\nthose guidelines and encourage you to download the full documents and\
    \ add them to your refer-\n\nence library. Basically, I’ll limit my instruction\
