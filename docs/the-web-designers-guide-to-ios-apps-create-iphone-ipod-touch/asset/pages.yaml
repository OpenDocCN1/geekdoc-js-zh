  md: "FUNDAMENTALS OF THE IOS SDK / TESTING AND BUILDING YOUR APP BINARY\n\n**45**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_57_0.png)\n\nAfter creating a Distribution\
    \ Provisioning Profile on the iOS Provisioning \n\nPortal and downloading it to\
    \ your computer, drag it onto your Xcode app \n\nicon to install.\n\nOpen your\
    \ app project and select the Project file at the top of the Groups \n\n& Files\
    \ pane. View its information and then click the Configurations tab. \n\nDuplicate\
    \ the Release configuration and then rename the copy Distribu-\n\ntion. You have\
    \ now completed one of the strangest steps of distributing an \n\napp. Weird,\
    \ huh?\n\nFortunately from here on out, it feels a lot like provisioning the app\
    \ for \n\ntesting.\n\nSet the Overview drop-down menu’s settings as follows:\n\
    \nr Destination: set to Device\n\nr Active Configuration: set to Distribution\n\
    \nSet the Project and Target files settings in their info windows, under the \n\
    \nBuild tab:\n\nr Configuration: set to Distribution (**Figure 3.15**)\n\nr Base\
    \ SDK: set to the most current SDK (iPhone Device 4 in this \n\nexample)\n\nr\
    \ Code Signing Identity: set to any iPhone device on the left and \n\nAutomatic\
    \ Profile Selector | iPhone Distribution on the right\n\nr iPhone OS Deployment\
    \ Target: iPhone OS 3.0\n\nr Based On: set to NKit\n\n3.15 The Overview \n\nmenu\
    \ showing Distribution \n\nsettings."
  merge: -1
  pgno: 57
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**46**\n\nHave you verified that these\
    \ are your settings for both the Project file \n\nand Target file? Good. And remember\
    \ that if you encounter a build error, \n\ndouble-check all of these again—sometimes\
    \ Xcode can be very finicky and \n\nseemingly even a bit scatterbrained.\n\nNow\
    \ that your app settings are in order, it’s time to build your app binary!\n\n\
    Before doing so, go to the Build menu and select Clean All Targets. This \n\n\
    should ensure that anything generated during Simulator and device testing \n\n\
    won’t interfere with the generation of a clean app binary.\n\nThen—drumroll, please—return\
    \ to the Build menu and click Build. Nope, \n\nthis isn’t a typo: There’s a Build\
    \ command in the Build menu!\n\nXcode should then take a moment to process the\
    \ binary, and if you get no \n\nwarnings or errors, this process should result\
    \ in the file you will then sub-\n\nmit to iTunes Connect for approval by Apple.\
    \ The file is an .app file that is \n\nlocated in the Distribution-iPhoneos subdirectory.\
    \ When you find it, select \n\nit and compress it (right-click or Ctrl-click,\
    \ and then choose Compress). \n\nYou should see what is shown in **Figure 3.16**.\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_58_0.png)\n\nAt this point you’ve learned\
    \ the basics of Xcode and Simulator, the two \n\nmain tools in the iOS SDK. To\
    \ complete the examples in this book and \n\ndesign your own apps, you’ll continue\
    \ to add files to the HTML directory, \n\nedit them in the Editor pane, and test\
    \ your work in Simulator.\n\n3.16 Your app binary, \n\nprepared for distribution.\
    \ \n\nDon’t forget to compress it!"
  merge: -1
  pgno: 58
