  md: "FOCUS ON APP CONTENT: TEXT AND IMAGES / INTEGRATING SOCIAL CONTENT\n\n**75**\n\
    \n**Integrating social content**\n\nCompared to offering free content via a web\
    \ app or mobile-enabled \n\nwebsite, designing and packaging a native iOS app\
    \ for distribution in the \n\niTunes App Store presents one notable hurdle: How\
    \ can you or a client \n\neasily update content for app users without updating\
    \ the entire applica-\n\ntion? Fortunately, there are a few tricks for working\
    \ around this obstacle, \n\nso you don’t necessarily have to submit an updated\
    \ app (and then wait for \n\napproval) whenever you have new content.\n\nThe idea\
    \ in this example is to pull Twitter status updates into an app screen, \n\njust\
    \ as many people do with their blogs or other websites where they want \n\ntheir\
    \ tweets displayed in a column adjacent to their other site content. \n\nWe’re\
    \ basically using Twitter as a content management system. To accom-\n\nplish this,\
    \ people rely on JavaScript; one of the most common solutions \n\nis to use a\
    \ script provided by Twitter itself, located at http://twitter.com/\n\njavascripts/blogger.js.\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_87_0.png)\n\n**US ING N I M BLEK IT\
    \ TO CH ECK FOR INTER N ET CONN ECTI V IT Y**\n\nWhen accessing content from the\
    \ Internet, Apple wants apps to be able to check for Internet con-\n\nnectivity\
    \ and warn users when there is no wireless or cellular connection. To do this,\
    \ an alert sheet \n\n(**Figure 5.5**) is used to convey the message (**NKAlert**):\n\
    \n5.5 An alert sheet that \n\ntells the user there is no \n\nInternet connectivity.\n\
    \nand two other library items are used to check for the connectivity:\n\ns** NKIsInternetAvailableViaWiﬁ**\n\
    \ns** NKIsInternetAvailableViaCellularNetwork**\n\n*(continues on next page)*"
  merge: -1
  pgno: 87
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**76**\n\n**US ING N I M BLEK IT TO\
    \ CH ECK FOR INTER N ET CONN ECTI V IT Y ***( continued )*\n\nBelow is a script\
    \ that I recommend using in the head of all NimbleKit app HTML pages that need\
    \ to \n\npull content from the Web:\n\n**// check for internet connectivity**\n\
    \n**function checkForInternet()**\n\n**{**\n\n**var isInternetAvailable = false;**\n\
    \n** if (NKIsInternetAvailableViaWiﬁ()==1)**\n\n** {**\n\n** isInternetAvailable\
    \ = true;**\n\n** }**\n\n** else**\n\n** {**\n\n**if (NKIsInternetAvailableViaCellularNetwork()==1)**\n\
    \n**{**\n\n**NKAlert(“Info”, “Internet is available only via cellular network,**\n\
    \n**carrier fees may apply.”);**\n\n**isInternetAvailable = true;**\n\n**}**\n\
    \n** else**\n\n** {**\n\n** NKAlert(“Error”, “An internet connection is required\
    \ to access **\n\n**content**\n\n**for this function.”);**\n\n**isInternetAvailable\
    \ = false;**\n\n**}**\n\n** }**\n\n** return isInternetAvailable;**\n\n**}**\n\
    \n**if (checkForInternet())**\n\n**{**\n\n**// load content from the web**\n\n\
    **}**\n\nThis script will help us out with our task, too. We just need to make\
    \ sure \n\nthat our app opens links in Mobile Safari. If we don’t do this, the\
    \ links \n\nwill open in the app itself. That would be rather tacky and present\
    \ us with"
