  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**100**\n\nTaking all these pieces\
    \ together, the HTML with JavaScript now looks like \n\nthis, with the NimbleKit\
    \ sections highlighted:\n\n**<html>**\n\n**<head>**\n\n**<meta name = “viewport”\
    \ content = “initial-scale = 1.0,**\n\n**user-scalable = no” />**\n\n**<script\
    \ type=”text/javascript” src=”NKit.js”></script>**\n\n**<script type=”text/javascript”>**\n\
    \n**var navController = new NKNavigationController();**\n\n**navController.setTitle(“Our\
    \ Map Page”);**\n\n**navController.setTintColor(255, 0, 0);**\n\n**var map = new\
    \ NKMapView();**\n\n**map.init(0, 0, 320, 416);**\n\n**map.setMapType(“standard”);**\n\
    \n**map.setDisplayRegion(47.7494, -90.3336, .01, .01);**\n\n**map.showUserLocation(“no”);**\n\
    \n**map.addAnnotation(47.7494, -90.3336, “Sven and Ole’s”, **\n\n**“Restaurant”);**\n\
    \n**map.show();**\n\n**setTimeout(selectAnnotation, 500); //wait for half second**\n\
    \n**function selectAnnotation()**\n\n**{**\n\n** map.selectAnnotation(‘Here’);**\n\
    \n**}**\n\n**function openInMaps()**\n\n**{**\n\n**NKOpenURLInSafari(‘http://maps.google.com/?q=Sven+%26+Ole%**\n\
    \n**27s&cid=11769511904778742301’);**\n\n**}**\n\n**var mapsButton = new NKButton();**\n\
    \n**mapsButton.init(70, 10, 180, 40, “openInMaps”);**\n\n**mapsButton.setTitle(“View\
    \ in Google Maps”);**\n\n**mapsButton.show();**\n\n**NKNativeControlSetAlpha(mapsButton,\
    \ 0.8);**"
