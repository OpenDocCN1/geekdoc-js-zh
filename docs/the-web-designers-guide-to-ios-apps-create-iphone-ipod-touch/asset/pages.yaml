  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**232**\n\nIn the end, a project charter\
    \ should be just a page or two of bullet points, \n\nlists, or short sentences.\
    \ It should be brief enough so that you can review it \n\nregularly with the rest\
    \ of your team—even if your team is just you and your \n\nemployer or client.\
    \ And if it is just two people, don’t think this excuses you \n\nfrom writing\
    \ up a project charter. It doesn’t: Take any two people without a \n\nclear plan,\
    \ and they are bound to disagree at some point.\n\nLet’s face it: A project charter\
    \ will not guarantee that disagreements won’t \n\nhappen, either. But it will\
    \ dramatically increase the odds that they are \n\nminor rather than major, and\
    \ thus not showstoppers that sneak up and ruin \n\neveryone’s excitement for the\
    \ project.\n\n**Diagram your app (or, build it on paper first)**\n\nThe next step\
    \ for a good app project plan is to diagram the entire applica-\n\ntion, screen\
    \ by screen. This is another step that requires paper. Indeed, \n\ndesigning new\
    \ media projects is not just using pixels, is it?\n\nSo why is a diagram important,\
    \ if it’s faster to just start building? After all, \n\nit’s all digital—it’s\
    \ pretty easy to rework and make changes.\n\nSure it is. At first.\n\nThen after\
    \ the tenth change, you start thinking otherwise and lose sight \n\nof the project\
    \ goal. Scope creep has set in—as your passion for the project \n\nquietly creeps\
    \ away, never to be seen again.\n\nThis is your life without planning diagrams.\n\
    \nPlanning diagrams don’t need to be very sophisticated (though they can \n\n\
    be). My suggestion is to start simple. Draw the boxes and label them by \n\nhand\
    \ if you have to—we get so accustomed to using software, we some-\n\ntimes forget\
    \ that paper and pencil are still acceptable. And even preferable.\n\nOr, use\
    \ a program to make a project diagram. Regardless of which tool you \n\nprefer,\
    \ use it to create an easy-to-understand app structure or informa-\n\ntion architecture\
    \ (it’s just like a structure or information architecture for a \n\nwebsite).\
    \ Show how users of the app will start using it, and where the deci-\n\nsion points\
    \ will lead them. Be clear about how your structure supports the \n\ninformation\
    \ hierarchies and chunking of information that will be required \n\nto make this\
    \ app elegant and easy to use."
