  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**162**\n\nbuild on the existing CSS3\
    \ framework by adding new rules and effects, and \n\ndesigners adopt and implement\
    \ them widely, the W3C will take notice and \n\neventually incorporate the new\
    \ rules and effects into the specification.\n\nAn example of this is CSS gradients,\
    \ so let’s take a look at how they can help \n\nenhance our iOS app designs as\
    \ well as save us some work.\n\nA widely used technique to apply a gradient to\
    \ a background is to design a \n\nnarrow sliver of a graphic with a chosen gradient,\
    \ and specify this image as \n\na background via CSS. The graphic can be just\
    \ 1 pixel wide, but by repeat-\n\ning it on the x-axis, we can fill the background\
    \ of a div or another page \n\nelement. The result is a nice gradient and the\
    \ performance is pretty high \n\nbecause the load time for such a small graphic\
    \ is negligible.\n\nHowever, the work to redesign a gradient created this way\
    \ is a pain. Just \n\nlike the earlier example of transparency, methods that tether\
    \ us to graphics \n\nrequire us to go through laborious updates of graphics when\
    \ redesigns are \n\ncalled for. Plus, designing the effect the first time is kind\
    \ of a pain.\n\nFortunately, CSS gradients are swooping in to save us both time\
    \ and head-\n\nache, because it’s a lot easier to specify a gradient in a stylesheet.\
    \ How does \n\nit work?\n\nLet’s continue working with the same sample Xcode project\
    \ we just used \n\nto explore @font-face and add a background gradient to the\
    \ page. Let’s \n\nhave the gradient go from white at the top of the page to dark\
    \ gray at the \n\nbottom and go from edge to edge. To do this, just add this to\
    \ the style.css \n\nstylesheet:\n\n**.linear {**\n\n** width: 100%;**\n\n** height:\
    \ 100%;**\n\n** background: -webkit-gradient(**\n\n** linear,**\n\n** left top,**\n\
    \n** left bottom,**\n\n** from(#fff),**\n\n** to(#333));**\n\n**}**\n\nBecause\
    \ **gradient** is not formally part of the CSS3 spec yet, but is \n\nembraced\
    \ by the iOS platform (both mobile Safari and the web view in \n\nObjective-C,\
    \ which use the WebKit browser engine), we need to use the"
  merge: -1
  pgno: 174
- img_proc: true
  md: "HTML5 AND CSS3 / MORE DESIGN OPTIONS WITH CSS3\n\n**163**\n\n![](img/4d979018542def8748544c4af0d37f5a_175_0.png)\n\
    \nproprietary prefix **–webkit-**. Thus the CSS rule is **–webkit-gradient**,\
    \ and \n\nour example is calling up a linear gradient so that is the next setting.\
    \ Linear \n\ngradients can go from top to bottom, left to right, or even diagonally\
    \ across \n\nthe screen, so the next settings specify the start and end points\
    \ as well as \n\nthe direction. The last two settings are the start and end color;\
    \ these can be \n\nhex, RGB, or named colors.\n\nOne more CSS adjustment will\
    \ make this demo look great. Our current \n\nhorizontal rule bleeds off the edge\
    \ of the screen, but this might look a bit \n\nodd with the gradient added to\
    \ the background. So let’s shorten that up a \n\nbit with this addition to the\
    \ style.css file:\n\n**hr {**\n\n** width:280px;**\n\n** margin-left: 0px;**\n\
    \n**}**\n\nTo put this new style into action, we just need to modify main.html\
    \ by add-\n\ning the **.linear** style to the **body** element:\n\n**<body class=”Juvelo\
    \ ****linear****”>**\n\nNote that **linear** is appended to **Juvelo**—we need\
    \ both classes because \n\n**Juvelo** is what styles the text on the page from\
    \ the previous example.\n\nTesting this revised code in Simulator will dress up\
    \ the screen substantially \n\nwith the new gradient in the background (**Figure\
    \ 9.11**).\n\n9.11 The Juvelo text screen with its \n\nnew background gradient\
    \ applied evenly \n\nfrom top to bottom."
