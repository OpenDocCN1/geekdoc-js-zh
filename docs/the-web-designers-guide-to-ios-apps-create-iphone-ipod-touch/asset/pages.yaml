  md: "FUNDAMENTALS OF THE IOS SDK / SUMMARY\n\n**47**\n\n**Summary**\n\nIn this overview\
    \ of Xcode and Simulator, you have learned how to\n\nr Start new NimbleKit app\
    \ projects in Xcode for iPhone and iPod touch, \n\niPad, or for all iOS devices\
    \ (universal app).\n\nr Use the Groups & Files, Detail, and Editor panes to manage\
    \ files, app \n\nsettings, and edit code.\n\nr Avoid the NimbleKit framework files\
    \ so you don’t inadvertently disable \n\nthe Objective-C code (which allows your\
    \ project to run natively and, \n\neventually, be approved by Apple).\n\nr Name\
    \ (and later rename) your app.\n\nr Design and add icon and launch graphics to\
    \ your app that meet Apple’s \n\nspecifications and user experience guidelines.\n\
    \nr Set the app version.\n\nr Build your app binary for Simulator and device testing.\n\
    \nr Build and compress your app binary so you can submit it to iTunes Con-\n\n\
    nect for Apple approval.\n\nNow that you know the ins and outs of using Xcode\
    \ and creating a project, \n\nit’s time to start learning about iOS apps themselves!\
    \ You’ll begin by learn-\n\ning about some standard iOS interface elements."
  merge: -1
