  md: "**25**\n\n*Chefs have kitchens. *\n\n*Stylists have salons. *\n\n*Physicians\
    \ have clinics. *\n\n*Mechanics have garages.*\n\nAnd Apple mobile app designers\
    \ have the iOS Software \n\nDevelopment Kit (SDK).\n\nLike the rest of these workspaces,\
    \ you won’t necessarily \n\nuse all the available features all the time. In fact,\
    \ you may \n\nnever use certain features. And if you’re like me, you’ll \n\nprobably\
    \ never try some of the things that are available \n\nin Xcode.\n\nBut we can’t\
    \ design apps without Xcode and Simulator, \n\nso this chapter explores some basics\
    \ about how to use \n\nthem as you work your way through the rest of the book.\
    \ \n\nAnd, you’ll begin to appreciate just how well you’ve tricked \n\nthem out\
    \ with the addition of NimbleKit!\n\nXcode, the integrated development environment\
    \ (IDE) \n\nthat Apple has created for aspiring app designers like us, \n\nis\
    \ an amazing computer program. And I tend to put it in \n\nthe same category as\
    \ Adobe Photoshop: It has so many \n\nsettings, menus, submenus, and features\
    \ that I know I’ll \n\nnever master it. It’s just too big and, frankly, I have\
    \ yet to \n\nfind a reason to try."
  merge: -1
  pgno: 37
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**26**\n\nAnd after Objective-C itself,\
    \ using Xcode is one of the more challenging \n\naspects of exploring iOS app\
    \ design. Fortunately, adding a code framework \n\nsuch as NimbleKit makes both\
    \ Objective-C and Xcode much easier to \n\nput into action. So after learning\
    \ some basics, we’ll dive directly into app \n\ndesign.\n\nThis chapter provides\
    \ an overview of Xcode from the beginning to the end \n\nof the app design process,\
    \ so you might find yourself coming back to this \n\nchapter repeatedly to remind\
    \ yourself of Xcode-specific issues throughout \n\nyour app design journey.\n\n\
    **Starting a new Xcode project**\n\nWhen you start a new project in Xcode by clicking\
    \ on the File menu and \n\nchoosing Project (File > New Project), you’re presented\
    \ with a number \n\nof choices (**Figure 3.1**). Several of them relate to the\
    \ types of navigations \n\nand views that are available, while others relate more\
    \ to the app’s function \n\nor mode of operation. For us, the choice is simple:\
    \ We’re going to create a \n\nNimbleKit application.\n\n![](img/4d979018542def8748544c4af0d37f5a_38_0.png)\n\
    \n3.1 Starting a new \n\nNimbleKit project in Xcode."
  merge: -1
  pgno: 38
- img_proc: true
  md: "FUNDAMENTALS OF THE IOS SDK / STARTING A NEW XCODE PROJECT\n\n**27**\n\nUnder\
    \ the app type choices, you also see a Product drop-down menu with \n\nthe options\
    \ iPhone, iPad, and iPhone/iPad. These choices might initially \n\nseem a bit\
    \ confusing — after all, if you design an iPhone app won’t it work \n\njust fine\
    \ on an iPad, too? Yes, it will. But there are still some things to con-\n\nsider\
    \ with the three main options being presented:\n\nr iPhone project: If the above\
    \ reasoning is good enough for you, and \n\nyou’re not designing a separate iPad\
    \ version of your app, then selecting \n\nthe iPhone project is sufficient. And,\
    \ it covers both iPhone 4 and pre-\n\niPhone 4 models.\n\nr iPad project: If your\
    \ app is designed explicitly for the iPad in one way \n\nor another (via interface,\
    \ content, or both), this is the option for you. \n\nThis is also the route to\
    \ take if you have an iPhone version of your app \n\nbut you want to, for example,\
    \ release an iPad version separately as a \n\npremium version.\n\nr iPhone/iPad:\
    \ This is also considered a “universal app,” and contains \n\nscreen layouts and\
    \ graphics scaled for all iOS devices. That way a cus-\n\ntomer need only purchase\
    \ a single version of the app and that version \n\nruns natively on the iPhone\
    \ as well as the iPad. This might result in a \n\nhappier customer if he owns\
    \ more than one Apple iOS device and it’s an \n\napp he would want on all of them.\
    \ Or, it could disappoint you, because \n\nyou just sold two versions of your\
    \ app for one price.\n\nI’m not going to steer you in one direction or another\
    \ with app types, as \n\nit truly depends on how you want to reach your audience,\
    \ the value you \n\nwant to deliver, what you want to earn, and how well your\
    \ app runs on \n\neither platform. I don’t believe there is just one best answer—you\
    \ need to \n\ntrust your gut but, more importantly, you need to design intentionally\
    \ for \n\none device or the other, or both, as your content and other purposes\
    \ best \n\nsuggest.\n\nAfter you click Choose, you’re prompted to name your project.\
    \ At this \n\npoint, don’t fret too much about the final name of your app, as\
    \ it has noth-\n\ning to do with the name of the project file. You can always\
    \ rename your \n\nproject later (see “Naming a Project and Creating the App Bundle”\
    \ later in \n\nthis chapter).\n\n**NOTE**\n\nFor working through \n\nthis chapter’s\
    \ examples, \n\ncreate an iPhone project."
  merge: -1
  pgno: 39
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**28**\n\n**Groups & Files, Detail\
    \ View, and Editor View panes**\n\nOnce you’ve created your new project, you’re\
    \ sent to the main Xcode view \n\n(**Figure 3.2**). The first thing you’ll notice\
    \ is that it looks like a souped-up \n\nMac OS X Finder window. In many respects,\
    \ that’s exactly what it is and—\n\nespecially in the case of using an Objective-C\
    \ code framework—this is also \n\nhow we’ll use Xcode much of the time.\n\n![](img/4d979018542def8748544c4af0d37f5a_40_0.png)\n\
    \nGroups & Files pane \n\nDetail View pane \n\nEditor View pane\n\nUnder Xcode’s\
    \ toolbar are three primary areas, or panes, of information \n\nthat function\
    \ similarly to the panes of a Finder window. On the left of \n\nthe window is\
    \ the Groups & Files pane, with the .xcodeproj file at the top \n\n(named icondemo\
    \ in Figure 3.2). Before you click around, this file is high-\n\nlighted by default\
    \ and you see all of the project’s other file components in \n\nthe Detail View\
    \ to the right.\n\nThe third pane of an Xcode project window is the Editor View.\
    \ As you \n\nmight expect, the biggest difference between Xcode and a Finder window\
    \ is \n\nthe Editor View; this is where you do most of your app work within Xcode.\
    \ \n\nIn the Groups & Files pane, click on a right-pointing triangle to the left\
    \ \n\nof a folder to reveal its file contents, and then highlight a file. Its\
    \ contents \n\nappear in the Editor View pane. This code becomes the new default\
    \ view of \n\nthis pane; even when you go back to highlighting folders, the Editor\
    \ View \n\ncontinues to display the contents of the last file you selected.\n\n\
    In fact, the Editor View always shows the last file you worked on, even if \n\n\
    you save and exit the project and reopen it.\n\n3.2 The three panes of \n\nan\
    \ Xcode project window."
  merge: -1
  pgno: 40
- img_proc: true
  md: "FUNDAMENTALS OF THE IOS SDK / STARTING A NEW XCODE PROJECT\n\n**29**\n\n**The\
    \ NimbleKit file structure and contents**\n\nBefore we go any further, now is\
    \ a good time to mention what is in the fold-\n\ners of a new NimbleKit project.\
    \ As I provide more details, please keep your \n\nweb designer hat on, because\
    \ there are similarities to designing sites here \n\nthat should be familiar to\
    \ you.\n\nTo begin, the top folder is entitled HTML and contains exactly that:\
    \ your \n\nstarting content in the form of a single file named main.html. Highlight\
    \ the \n\nfile and you’ll see this in the Editor View:\n\n**<html>**\n\n**<head>**\n\
    \n**<meta name = “viewport” content = “initial-scale = 1.0,**\n\n**user-scalable\
    \ = no” />**\n\n**</head>**\n\n**<body>**\n\n**<script type=”text/javascript”\
    \ src=”NKit.js”></script>**\n\n**<p>Nimble is an SDK which allows developers to\
    \ quickly**\n\n**and easy create full featured iPhone applications**\n\n**using\
    \ just HTML and Javascript</p>**\n\n**<i>Tip:</i><br />**\n\n**Start developing\
    \ your application from main.html ﬁle**\n\n**included in project**\n\n**</body>**\n\
    \n**</html>**\n\nYou can also stash additional files in this HTML folder and treat\
    \ it like the \n\nroot directory of a server for a website. So CSS and image files\
    \ can all live \n\nhere together.\n\nBefore we proceed to editing anything or\
    \ adding files, it’s important to \n\nunderstand that the remaining folders and\
    \ files are basically off-limits. \n\nDon’t become curious and edit anything in\
    \ the Classes, Other Sources, \n\nResources, or Frameworks folders. Do! Not! Do!\
    \ It! (**Figure 3.3** on the \n\nnext page).\n\n**NOTE**\n\nWeb designers typically\
    \ \n\norganize their markup \n\nby placing JavaScript \n\nin the head of an HTML\
    \ \n\nﬁle. The main.html ﬁle in \n\nthe NimbleKit download \n\nplaces it in the\
    \ begin-\n\nning of the body instead. \n\nNot how I typically do it, \n\nso I\
    \ wanted to men-\n\ntion this. (Still, it doesn’t \n\nmatter where it goes as\
    \ \n\nlong as it’s before the \n\n**</body> **tag.)"
  merge: -1
