  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**234**\n\n**App usability**\n\nUsability\
    \ consultant Steve Krug, author of *Don’t Make Me Think*,⁴ has a \n\ngreat set\
    \ of foundational guidelines in his book about web usability entitled \n\n*Billboard\
    \ Design 101*. These recommendations are based on years of observ-\n\ning how\
    \ people really use websites: When users visit websites on the large \n\nscreens\
    \ of desktop and laptop computers, they don’t usually visit in the way \n\nthat\
    \ site owners and designers imagine they will.\n\nSite owners who want to share\
    \ a lot of text content seem to expect that visi-\n\ntors will regard the site\
    \ as classical literature and take the time to carefully \n\nand lovingly read\
    \ every word. In fact, given the amount of content some \n\nsite owners are hoping\
    \ people will read, one might think they’re actually \n\nfrustrated novelists\
    \ who should seek a publisher instead of putting it all on \n\na website.\n\n\
    As web designers, we have to (perhaps reluctantly) admit that our expecta-\n\n\
    tions are similarly high, if not higher. Designers imagine visitors to our gor-\n\
    \ngeous websites—they are gorgeous, right?—being utterly captivated by the \n\n\
    elegant beauty of our designs. They hear choirs of angels singing and feel \n\n\
    their eyes well up with tears as they gaze upon our amazing pixel creations \n\
    \nin total rapture.\n\nOr something like that.\n\nBut Krug, and anyone who takes\
    \ the time to do usability testing, usually \n\nencounters a vast chasm between\
    \ these utopian expectations and real user \n\nbehavior. People don’t clear their\
    \ schedules to spend hours visiting and \n\nrhapsodizing about websites. Visitors\
    \ are in a hurry, looking for infor-\n\nmation, and we can’t do much about that.\
    \ Everything about the online \n\nenvironment speaks to instant gratification,\
    \ so people behave accordingly: \n\nThey glance at pages, scan text, and click\
    \ on things that look like links in \n\norder to keep moving.\n\nTake a look at\
    \ those verbs again: glance, scan, click. They are all measured \n\nin fractions\
    \ of a second. So these are the fractions of seconds we have to \n\nwin our visitors\
    \ over with some kind of ode to classical literature or art? \n\nKind of hilarious,\
    \ when you think about it (no pun intended). Though per-\n\nhaps Krug should have\
    \ titled his book *Don’t Make Me Laugh* because I’m \n\nsure, given his sense\
    \ of humor, that he laughs hard and laughs often when"
