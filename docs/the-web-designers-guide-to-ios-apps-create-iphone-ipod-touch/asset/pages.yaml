  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**218**\n\nKeywords are similarly important,\
    \ and here is another key thing to note: \n\nApp descriptions are apparently not\
    \ used by iTunes search (at least, this is \n\nwhat Apple engineering staff said\
    \ at the 2010 Worldwide Developer Con-\n\nference). So this means that even if\
    \ important keywords are used in your \n\ndescription, they also need to be entered\
    \ into the keywords field so they are \n\nsearchable by iTunes App Store shoppers.\n\
    \n**NOTE ****Version information—some is editable, some is not**\n\nAn important\
    \ detail to note, however, is that you can edit the description and latest \n\n\
    update information later. However, you *cannot* edit categories or keywords later!\
    \ Can. \n\n*NOT*. Choose these *very* carefully, as they are not editable until\
    \ you submit a new ver-\n\nsion of the app for Apple’s approval.\n\nAfter completing\
    \ the categories and keywords, you are likely to accept the \n\nstandard End User\
    \ License Agreement (EULA) that is provided by Apple \n\nunless you wish to retain\
    \ a lawyer and write your own (to each his or her \n\nown). I don’t want to suggest\
    \ that Apple’s EULA is perfect and cannot be \n\nimproved, but I’ve been using\
    \ it as is for my own applications.\n\nThe final task to complete is uploading\
    \ the iTunes App Store icon graphic \n\nand app screen shots. To keep things consistent,\
    \ I recommend generating \n\nPNG images for these just as you did for the app\
    \ icons themselves; but note \n\nthat iTunes also accepts JPG and TIF formats\
    \ as long as they are 72 dpi, \n\nRGBA, flattened, and without transparency. Also,\
    \ their file names do not \n\nmatter as they do for app icons. **Table 12.1**\
    \ shows the size specifications.\n\n**TABLE 12.1 ****Size specifications for iTunes\
    \ app icon and screen shots**\n\n**APP ICON**\n\n**IPHONE /**\n\n**IPOD TOUCH**\n\
    \n**IPHONE 4**\n\n**IPAD**\n\nPortrait\n\n512 × 512 px\n\n320 × 460 px\n\n640\
    \ × 920 px\n\n768 × 1004 px\n\nLandscape\n\n—\n\n480 × 300 px\n\n960 × 600 px\n\
    \n1024 × 748 px\n\nThe screenshot sizes in Table 12.1 assume that you are cropping\
    \ out the \n\nstatus bar, which is 20 pixels high on the iPhone, iPod touch, and\
    \ iPad (40 \n\npixels high on the iPhone 4’s Retina Display). I recommend this\
    \ because \n\nI find the status bar to be distracting in screenshots: Nearly every\
    \ app \n\ndisplays it, so it’s not a distinguishing feature. But I’ve also mistakenly"
