  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**10**\n\nUnfortunately, the illusion\
    \ of the device turning into something else is far \n\nmore picky than that: Missing\
    \ the mark by any measurable distance doesn’t \n\njust result in a very good instead\
    \ of an excellent app. It can too easily result \n\nin an extremely unconvincing,\
    \ or even annoying, app.\n\n“Well, wow, now this is starting to sound confusing,”\
    \ you might be think-\n\ning. A well-designed app should be immersively designed\
    \ to fit seamlessly \n\ninto the user’s life no matter where they are, feature\
    \ native Apple iOS user \n\ninterface details wherever appropriate, *and* include\
    \ content- or branding-\n\nspecific UI details when appropriate? What’s the magic\
    \ formula for that, \n\nanyway? And how do we focus on both content and user interface\
    \ enough \n\nto pull this off successfully?\n\nThe answer is, of course, that\
    \ there isn’t one formula. But fortunately web \n\ndesigners already have experience\
    \ in responding to client and customer \n\nneeds, and are familiar with designing\
    \ using corporate style guidelines. \n\nTo apply this valuable web design experience\
    \ to iOS app design, you need \n\nto become familiar with native user interface\
    \ standards, details, and recom-\n\nmendations; define your project requirements\
    \ (whether for your own proj-\n\nect or that of a client or employer); and determine\
    \ the best way to design it \n\nfor iOS devices.\n\nThis book will continue within\
    \ this paradigm, and show you how to lever-\n\nage your design experience and\
    \ web skills into designing iOS apps, and \n\nintroduce you to some techniques\
    \ that allow you to craft these projects \n\nwithout writing your own Objective-C\
    \ code.\n\n**Design starts with people and ends with code**\n\n “But wait,” you’re\
    \ thinking, “I thought that all apps have to be written in \n\nObjective-C?”\n\
    \nThat is true. However, this does not mean you need to write the \n\nObjective-C\
    \ yourself!\n\nIn fact, what if someone else has already written it for you?\n\
    \nConsider JavaScript frameworks for designing content to be displayed \n\nin\
    \ web browsers. Two of my favorite examples, jQuery and Yahoo! User \n\nInterface\
    \ (YUI), assist web designers with employing JavaScript-powered"
  merge: -1
