  md: "MARKETING YOUR APPS / DESIGNING YOUR OWN APP MARKETING COMMUNICATIONS\n\n**199**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_211_0.png)\n\n11.6 An update message\
    \ for Pandora \n\nin the App Store, as viewed on an \n\niPhone.\n\nI think so.\n\
    \nHere are my recommendations for using app updates messages:\n\nr Learn from\
    \ these examples and aim for the middle of these two \n\nextremes. Be friendly\
    \ and detailed, but also be concise. Keep individual \n\npoints short, too.\n\n\
    r Always use a character as a bullet for bullet points, and always put a \n\n\
    space in between them. If you don’t do these things, your points are \n\nlost\
    \ when they run together into one giant, gelatinous block of text that \n\npeople\
    \ will ignore.\n\nr Try to keep your update message within the confines of the\
    \ iPhone \n\nscreen. This is about 18 lines of text (at approximately 50 characters\
    \ per \n\nline). And don’t be tempted to make your update messages much longer\
    \ \n\nfor an iPad app just because the screen is larger.\n\nr Use updates as an\
    \ excuse to remind customers to email you with feed-\n\nback or suggestions, or\
    \ rate your app in the App Store."
