  md: " ADDITIONAL GUIDING PRINCIPLES / APP PLANNING\n\n**233**\n\nAfter you have\
    \ everyone sign off on the diagram, you’re one step closer to \n\nhaving your\
    \ app project not drive you insane.\n\n**Save the visuals for the end**\n\nIt’s\
    \ a bit more difficult to do this with apps than with websites, but try to \n\n\
    save most of the visual development and graphic design for the end of the \n\n\
    project.\n\nYou’ve probably experienced what it’s like to not do this. Clients\
    \ love to see \n\ngraphics for a project. Well-designed graphics that glow seductively\
    \ on a \n\nscreen make clients (and, let’s face it, us) feel great. And they help\
    \ make it \n\nappear that the project is looking complete, even if it isn’t.\n\
    \nRemember that false expectation problem? Premature graphics are a lead-\n\n\
    ing cause of false project expectations.\n\nBut as I already noted, separating\
    \ the look and feel from the navigation and \n\ncontent of an app can be a bit\
    \ more difficult. On very small screens, there is \n\nless space for the eye candy.\
    \ Even mocking up a table view navigation can \n\nmake it look done already—there’s\
    \ just not much to it.\n\nIn some cases, you may want to defer building some of\
    \ the elements that \n\ncan be quick to build for as long as possible. Remember\
    \ that simple pencil \n\nsketches can get everyone to commit to a relatively detailed\
    \ design before \n\npixels are ever put to screen.\n\nOn the other hand, don’t\
    \ get carried away with excessive documentation or \n\npostpone visual elements\
    \ too long. Over time and with additional experi-\n\nence, you will gain the ability\
    \ to gauge how much opportunity you need to \n\ncreate for yourself via adequate\
    \ planning and documentation. Just enough \n\nwill help answer questions, set\
    \ realistic expectations, clarify goals, and \n\nkeep everyone involved happy.\
    \ Too little can leave gaps for small misun-\n\nderstandings that can fester into\
    \ major problems. And too much can drain \n\ngoodwill from the relationships and\
    \ energy from the project’s momentum.\n\nDon’t make planning too big of a stick.\
    \ Try to make it just right. If you do, \n\nhappiness and success with your app\
    \ project is likely to follow."
