  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**42**\n\nbuild settings. The reason\
    \ for this is in case the Development Provisioning \n\nAssistant, an online tool\
    \ in the Provisioning Portal on developer.apple.\n\ncom, hasn’t properly set everything\
    \ for you. Should that happen, the fol-\n\nlowing directions will help you troubleshoot\
    \ the situation and proceed \n\nwith provisioning and device testing.\n\nThere\
    \ are three areas in the project where build settings are defined and, \n\nmysteriously,\
    \ sometimes they all need to be double-checked because set-\n\nting them correctly\
    \ in one place doesn’t guarantee that they’ll be correct in \n\nall three areas.\n\
    \nNo, I’m not making this up. Furthermore, this has, at times, been a source \n\
    \nof some of my most frustrating moments. I swear that I’ve set them all \n\n\
    correctly and tried to test on my device, only to then return to see that a \n\
    \nsetting has changed. So I rub my eyes in disbelief, change the setting again,\
    \ \n\nand *then* it works.\n\nThis is simply how it goes with Xcode at times.\
    \ So be patient, take a deep \n\nbreath, and recheck your settings whenever you\
    \ run into a dead end.\n\nThe first place to check your settings is in the Overview\
    \ menu in the upper \n\nleft corner of the main Xcode project window. As covered\
    \ previously in this \n\nchapter, make sure that this is set to\n\nr Device\n\n\
    r Active Configuration: Debug (same as installing in Simulator)\n\nr Active Target:\
    \ the name of your app (there should only be one \n\noption here)\n\nr Active\
    \ Executable: the name of your device (again, there should only \n\nbe one option)\n\
    \nThe build settings can be reached via the information window of two \n\ndifferent\
    \ files:\n\nr The Project file\n\nr The Target file\n\nYou reveal these settings\
    \ by selecting them one at a time and clicking the \n\nblue info button in Xcode’s\
    \ settings (or by just right-clicking the file and \n\nselecting Get Info) (**Figure\
    \ 3.13**)."
