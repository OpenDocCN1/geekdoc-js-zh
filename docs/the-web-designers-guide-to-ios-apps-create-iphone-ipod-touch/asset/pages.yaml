  md: "**v**\n\nACKNOWLEDGMENTS\n\nMy MinneWebCon conference planning colleagues from\
    \ 2008 to present: \n\nAmanda, Dan, Danny, Eric, Gabe, Jesse, Peter, Sara, Simin,\
    \ and Zach.\n\nMy in-laws, Marilyn and Kent, who provide a ton of childcare for\
    \ us that \n\nmade this book possible; Marilyn, a writer, also helped edit the\
    \ first chapter \n\nthat I wrote, giving me the confidence to submit it to the\
    \ publisher.\n\nMy mother, Sharon, whose skills as a gardener, flower arranger,\
    \ and stained \n\nglass artist elevated my ability to see patterns and beauty,\
    \ and inspired my \n\nown creativity and desire to make things.\n\nMy lovely wife\
    \ and daughters, who gave me the time and space to work on \n\nthis, and never\
    \ complained about how tired and unhelpful I must have been \n\nduring the numerous\
    \ mornings that followed many late nights of writing \n\nand editing: Katie, Sarah,\
    \ Grace, Emma, and Anne.\n\n**ABOUT THE AUTHOR**\n\nKristofer Layon is a designer,\
    \ educator, and conference director. Kris’s \n\nfirst iPhone application, ArtAlphabet,\
    \ is an early childhood typography \n\nflashcard game that went on sale in the\
    \ App Store in 2009. His consulting \n\ncompany, Aesthete Software, now designs\
    \ mobile applications for clients in \n\na diverse range of fields including medicine,\
    \ photography, and education. \n\nHe has been a graphic designer since 1993 and\
    \ a web designer since \n\n1996\\. Since then Kris has designed sites for engineers,\
    \ urban planners, \n\ncity governments, artists, musicians, retailers, the National\
    \ Park Service, \n\nand over 30 higher education clients. In addition to designing\
    \ websites, \n\nhe has taught graphic design and typography in the University\
    \ of Min-\n\nnesota’s College of Design, where he was also an academic advisor.\
    \ In \n\n2008 Kris helped establish MinneWebCon, a regional conference for web\
    \ \n\nprofessionals.\n\nKris holds a Master of Fine Arts degree in interactive\
    \ design from the \n\nUniversity of Minnesota, and a Bachelor of Arts degree in\
    \ German and \n\npre-architecture from Saint Olaf College. He is a member of AIGA,\
    \ the \n\nHighEdWeb Association, Design Research Society, and Minnesota Inter-\n\
    \nactive Marketing Association. His work has won design awards from the \n\nAIGA\
    \ and the Society of Marketing Professional Services, and his early \n\nadoption\
    \ of web video was featured on apple.com in 1999."
