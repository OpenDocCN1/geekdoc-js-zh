    \ My apologies to Dan for my implementa-\n\ntion—his designs are always so elegant,\
    \ so we’ll see whether my adaptation \n\nof his method for the iOS screen can\
    \ approach his level of CSS3 craft. \n\n(It may not, but at least now you know\
    \ that I’ve chosen the right goal to \n\nwork toward!)\n\nWith Dan setting the\
    \ bar, let’s give the unordered list with the **.food** class \n\nsome more definition\
    \ by defining its **li** tags like so:"
