    \ of Apple, so I’ll draw the line at summarizing or restating any of \n\nthe more\
    \ detailed information that is available only to developers on Apple’s private\
    \ developer web-\n\nsites. Therefore, the only representations of protected Apple\
    \ websites (which require authentication \n\nwith a Developer ID) included in\
    \ this book are\n\n**1.**\n\nScreenshots of the iOS SDK download process\n\n**2.**\n\
    \nScreenshots of my own iTunes Connect account\n\nr Apple trademarks and logos:\
    \ As an Apple Developer, you are granted \n\nlimited use of Apple marks. For example,\
    \ you can include the “Avail-\n\nable on the App Store” badge on your website,\
    \ as well as some very nice \n\nphotos of iOS devices that Apple provides to you.\
    \ You are also allowed \n\nto mention Apple product names in your site’s content.\
    \ In either case, \n\nbe sure to follow their usage guidelines (highlighted in\
    \ chapter 11) and \n\ninclude any required disclaimers."
