  md: "**3**\n\n*So…why did I write this book? *\n\n*Aren’t there already books *\n\
    \n*about making iPhone, *\n\n*iPod touch, and iPad apps?*\n\nThere are indeed\
    \ several books about the subject, and \n\nthey are all very informative. However,\
    \ I wrote this book \n\nfor a specific audience.\n\nIn short, someone a lot like\
    \ me.\n\nWhat I have done is write the book *that I wish I’d had on *\n\n*my bookshelf*\
    \ about two years ago when I was beginning \n\nto investigate how to design iPhone\
    \ applications. At the \n\ntime, the only books I could find dealt with programming\
    \ \n\nin Objective-C or explored how to leverage very specific \n\nfunctions and\
    \ features of the iPhone and iPod touch.\n\nI have nothing against Objective-C\
    \ programming. I would \n\njust rather not do it myself. And while impressed by\
    \ the \n\nfeatures of Apple’s mobile devices, I am a designer: What \n\ndrives\
    \ my work is not technology itself, but a desire to \n\nhelp people and organizations\
    \ communicate.\n\nSo if you are a designer who enjoys working with people \n\n\
    more than wrestling with technology, and solving prob-\n\nlems more than experimenting\
    \ with features, you have \n\nfound the right book. Because this book approaches\
    \ the \n\ndesign of iOS applications from a human-centered, need-\n\nbased approach."
  merge: -1
  pgno: 15
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**4**\n\n**Mobile magic and pocket\
    \ computers**\n\n![](img/4d979018542def8748544c4af0d37f5a_16_0.png)\n\nAs iPhones\
    \ and other smartphones have become ubiquitous, the demand \n\nfor well-designed\
    \ mobile content has also increased dramatically. We have \n\nall seen some astounding\
    \ numbers:\n\nr Over 85 million iOS devices sold by mid-2010\n\nr Over 250,000\
    \ applications in the iTunes App Store\n\nr 15 billion applications downloaded\
    \ from iTunes\n\nI have personally experienced the transformative effects of having\
    \ content \n\navailable nearly everywhere, whenever needed: while shopping, work-\n\
    \ning out, running, even riding on a chairlift at a ski area. Unless I am at the\
    \ \n\nbeach or in the water, my iPhone is usually with me. I can answer ques-\n\
    \ntions. I can research something photographed earlier as a reference (I \n\n\
    now use the Camera app all the time to take notes), see how far I am from \n\n\
    somewhere, check the weather. The list is practically endless.\n\nIn fact, I believe\
    \ the iPhone’s name is sort of misleading—it suggests that \n\nit’s a phone with\
    \ additional uses. In fact, the device is a networked, pocket-\n\nsized computer\
    \ that you can\n\nr Bring wherever you want\n\nr Use whenever you need it\n\n\
    r Customize by purchasing and installing your own applications\n\nSo we think\
    \ of the iPhone as a phone (**Figure 1.1**) due to its eponymous \n\napp, Phone.\
    \ But Phone is just one of many apps that leverage content, \n\nnetwork connectivity,\
    \ and various hardware and software features to help \n\nsolve problems or access\
    \ information when and where you need it.\n\n1.1 Now *this* is a phone! \n\n(Whereas\
    \ Phone is just \n\none of many apps for the \n\niPhone.)"
  merge: -1
  pgno: 16
- img_proc: true
  md: "THE BIG IMPACT OF GOING SMALL / CONTENT—AND CONTEXT—ARE EVERYTHING\n\n**5**\n\
    \n**Content—and context—are everything**\n\nSo why am I focusing on this when\
    \ it should be pretty obvious already? \n\nBecause I am making a very important\
    \ point and helping to shape how you \n\nthink about designing apps.\n\nTo continue\
    \ this process, consider these two dates:\n\n**January 9, 2007**\n\nand\n\n**May\
    \ 25, 2010**\n\nDo you recognize either date? They are both extremely important\
    \ for how \n\nwe should think about iOS apps.\n\nJanuary 9, 2007, is the date\
    \ on which Apple Computer, Inc., became Apple, \n\nInc. And May 25, 2010, is when\
    \ Apple, Inc., became the most valuable \n\ntechnology company in the world—three\
    \ years after it dropped the word \n\n“computer” from its corporate name.\n\n\
    The *New York Times* said it best:\n\n*“The most important technology product\
    \ no longer sits on your desk but rather *\n\n*fits in your hand.” (May 27, 2010)*\n\
    \nApple saw this coming in early 2007 when they changed their name, per-\n\nhaps\
    \ because the iPhone was on the horizon for later that summer.\n\nBut it was not\
    \ the iPhone alone that made Apple the biggest tech company \n\nby the spring\
    \ of 2010. The process started in 2001 when the iPod was intro-\n\nduced and continued\
    \ in 2003 when iTunes was launched. And note that \n\nalthough they did not stop\
    \ making full-size computers at the time, they \n\nstarted making some that were\
    \ much smaller. And this helped integrate \n\ncomputer technology into our lives\
    \ much more than desktop and laptop \n\ncomputers ever did.\n\nWith the launch\
    \ of the tiny new iPod computer platform, Apple took a leap \n\nthat was much\
    \ larger than the one they first took from the Apple II to the \n\nMac. In that\
    \ first stage of evolution, Apple popularized the graphic user \n\ninterface (GUI),\
    \ the visual desktop metaphor, and the mouse input device \n\nto create a whole\
    \ new world that now pervades all personal computing."
  merge: -1
  pgno: 17
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**6**\n\n![](img/4d979018542def8748544c4af0d37f5a_18_0.png)\n\
    \nToday most people interact with and work on personal computers without \n\n\
    needing to speak their languages (that is, actually program them to do all \n\n\
    the work).\n\nThe most incredible thing about the iPod is that it’s pared down\
    \ from a Mac \n\nquite drastically. Much more. Apple not only took away the mouse,\
    \ they \n\ntook away the desktop. They made the screen incredibly small, and made\
    \ \n\nit impossible to create any content directly on the device (**Figure 1.2**).\
    \ So \n\nApple took a computer, removed a lot of its functionality, made it as\
    \ simple \n\nand small as possible, and made it completely unproductive. And,\
    \ thus, \n\nutterly unbusinesslike—the exact opposite approach to their personal\
    \ \n\ncomputing strategy of the 1990s.\n\nAnd the result of this drastic reduction\
    \ in power, size, and capability?\n\nSales went through the roof and have made\
    \ Apple incredibly successful.\n\n1.2 The original iPod: Shrinking \n\nand simplifying\
    \ the computer \n\neven more than the Mac did.\n\nThis transformation is profound,\
    \ because we don’t even think of an iPod as \n\na tiny computer. Instead we think\
    \ of it as a portable, practical, and easy-to-\n\nuse device for listening to\
    \ music, news, information, and audio books, and \n\nseeing photos or even watching\
    \ movies and TV shows.\n\nThis isn’t business content. This is life content.\n\
    \nInterestingly, Apple didn’t break much new technological ground with the \n\n\
    introduction of its iOS devices. Rather, when introducing the iPhone in \n\n2007,\
    \ they simply added back a few of the key features they had taken away \n\nwhen\
    \ they made the enormous leap from the full-size computer to the tiny \n\niPod\
    \ platform. They restored the Internet connectivity that we’re used to"
  merge: -1
  pgno: 18
- img_proc: true
  md: "**7**\n\nTHE BIG IMPACT OF GOING SMALL / MOBILE APPLICATIONS & DESKTOP APPLICATIONS\n\
    \nat our desktops and laptops, and reintroduced the ability to enter informa-\n\
    \ntion via a (screen-based) keyboard after previously limiting users with the\
    \ \n\niPod’s click-wheel.\n\n*And oh yeah…the iPhone got the Phone application!*\n\
    \nMore importantly, iOS devices push the life content concept much further. \n\
    \nNow the news can be breaking, the music can be live, and the information \n\n\
    can be our kid’s soccer schedule. Or a restaurant’s address, shown on a map, \n\
    \nwith directions from our current location.\n\nAll of this means that designing\
    \ for these devices needs to begin by focus-\n\ning on life content, and centering\
    \ on the lives of human beings and the \n\nproblems that we need solved on a daily\
    \ basis.\n\nTo design for these circumstances, we need to keep it real.\n\n**Mobile\
    \ applications **&** desktop applications**\n\nBut we also need to keep it simple.\n\
    \nThinking about mobile content needs from a life content perspective allows \n\
    \nyou to focus on the proper context of your design work, which is how and \n\n\
    when people seek information. Next we need to focus on how people actu-\n\nally\
    \ use mobile devices.\n\nMany books and presentations about app development focus\
    \ on leveraging \n\nspecific features (learn how to make the device vibrate!).\
    \ And to be sure, \n\nfor a large software team working on a complex application,\
    \ it might make \n\nsense to focus on specific technical features and behaviors.\
    \ But this book \n\nis written from a human-centered perspective, which puts people\
    \ and their \n\ncontent first.\n\nWhen people use mobile content, their paramount\
    \ concern is probably \n\nnot whether someone has employed particular features\
    \ of the device. But \n\nif designers neglect certain features or implement them\
    \ badly, people will \n\nundoubtedly notice. Staying focused on content and on\
    \ people’s needs \n\nshould lead us to adopt the right behaviors and features\
    \ for the right \n\nreasons. This makes much more sense to me than learning how\
    \ to imple-\n\nment a feature first, then trying to think of a way to build an\
    \ app around \n\nthe behavior."
