  md: "OTHER MOBILE FRAMEWORKS / SUMMARY\n\n**183**\n\n**Summary**\n\nIn this chapter,\
    \ you learned about three alternative methods for designing \n\nor developing\
    \ mobile apps for iOS devices as well as other platforms:\n\nr PhoneGap (with\
    \ jQTouch) provides a web standards–based alternative \n\nthat is similar to NimbleKit.\
    \ It comes with fewer APIs than NimbleKit \n\nand emulates rather than calls native\
    \ user controls, but also affords a \n\nwider range of UI styling options.\n\n\
    r Titanium Mobile is another web standards–based alternative, though it \n\nrelies\
    \ heavily on JavaScript programming and is thus more of a devel-\n\nopment framework\
    \ than a design one. It comes with more APIs than \n\nNimbleKit, but uses its\
    \ own desktop application for compiling and \n\npackaging the app binary.\n\n\
    r Sencha Touch is an HTML5, CSS3, and JavaScript web application \n\nframework\
    \ that allows you to more quickly design mobile apps that run \n\non web servers\
    \ instead of being distributed or sold via the App Store. \n\nThe product is not\
    \ a native iOS app and lacks an iOS user experience, \n\nbut still has a robust\
    \ touch interface that is designed to work beautifully \n\nin WebKit-based mobile\
    \ browsers on iOS, Android, and other mobile \n\noperating systems.\n\n**REFERENCES**\n\
    \n**1.**\n\nhttp://oreilly.com/\n\ncatalog/9780596805784?cmp=il-orm-ofps-iphoneapps\n\
    \n**2.**\n\nhttp://github.com/appcelerator/KitchenSink\n\n**3.**\n\nhttp://www.nimblekit-android.com/"
