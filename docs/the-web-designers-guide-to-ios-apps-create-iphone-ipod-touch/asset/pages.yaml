  md: "FOCUS ON APP CONTENT: MAPS / METHOD TWO: STYLING AN HTML BUTTON\n\n**103**\n\
    \nI like my examples to be practical and reusable for actual applications, I’ll\
    \ \n\nmove ahead with the map exercise using this assumption.\n\nLooking at the\
    \ 320 × 480 pixel iPhone screen, start with the same elements \n\nas we did before:\n\
    \nr status bar: 320 × 20 pixels\n\nr title bar: 320 × 44 pixels\n\nThis leaves\
    \ us with 416 pixels of height to work with again. But this time \n\nwe’ll use\
    \ some of that space for the HTML and CSS button as it cannot \n\noverlay the\
    \ map like **NKButton** does. I’ll propose adding a button that’s \n\n32 pixels\
    \ tall below the map and giving it 50 pixels of margin on the left \n\nand right\
    \ to center it, and 5 pixels of margin on top so it doesn’t directly \n\nabut\
    \ the map. I’ll also style the space around the button to look similar to \n\n\
    a native tab bar (dark gray).\n\nWith this as our plan, let’s proceed with building\
    \ it out!\n\n**Writing the HTML**\n\nThe HTML for this is remarkably brief, as\
    \ most of this code example \n\nutilizes NimbleKit’s map architecture. About the\
    \ only things we’re doing in \n\nthe HTML are setting the stage for getting things\
    \ wired together and creat-\n\ning the button that links to Maps.\n\nTo get this\
    \ first step done, create a new HTML file. As with the last \n\nmethod, the initial\
    \ code will scale the viewport to the iPhone and set user \n\nscalability to **no**.\
    \ The embedded map will already be scalable, but we don’t \n\nwant the button\
    \ to be scalable as this would result in a nonnative user \n\nexperience. We’ll\
    \ also include a few lines to define a class named **“button”**\n\nand build it\
    \ as an ordered list item (as you typically would when designing \n\na navigational\
    \ element in a website). So, here’s what this first step looks like:\n\n**<html>**\n\
    \n**<head>**\n\n**<meta name = “viewport” content = “initial-scale = 1.0, **\n\
    \n**user-scalable = no” />**\n\n**</head>**"
