  md: "HTML5 AND CSS3 / SUMMARY\n\n**169**\n\nThese are just two of the many CSS3\
    \ tools and references out there. Keep \n\nsearching for things that fit your\
    \ app needs, personal preferences, and \n\ndevelopment budget.\n\n**Summary**\n\
    \nHTML5 and CSS3 are still in the early stages of adoption. In fact, HTML5 \n\n\
    is still at a point where the advantages are more behind-the-scenes and in \n\n\
    the design phase of a project. Nonetheless, you have learned how to lever-\n\n\
    age several HTML5 and CSS3 rules for your iOS projects that are powered \n\nby\
    \ NimbleKit. This gives you a leg up on the competition by providing \n\nyou with\
    \ applied HTML5 and CSS3 experience, which helps you not \n\nonly design better\
    \ iOS apps, but also better websites. Now it all comes full \n\ncircle: iOS app\
    \ design experience enriches your web design abilities and \n\nopportunities!\n\
    \nNext: NimbleKit might be cool, but are there other code frameworks for \n\n\
    designing iOS apps without having to learn Objective-C? The answer is \n\nyes!\
    \ The details follow.\n\n**REFERENCES**\n\n**1.**\n\nhttp://en.wikisource.org/wiki/\n\
    \nConstitution\\_of\\_the\\_United\\_States\\_of\\_America\n\n**2.**\n\nhttp://www.w3.org/TR/html4/struct/global.html#edef-DIV\n\
    \n**3.**\n\nJohn Allsopp, *Developing with Web Standards* (New Riders \n\nPress,\
    \ 2009), p. 274\n\n**4.**\n\nhttp://robertivan.com/WorldCuphtml5.html\n\n**5.**\n\
    \nhttp://vis.robbymacdonell.com/stanley-cup/\n\n**6.**\n\nhttp://joshduck.com/periodic-table.html\n\
    \n**7.**\n\nMore information about the CSS3 RGBA speciﬁcation at http://\n\nwww.w3.org/TR/css3-color/#rgba-color\n\
    \n**8.**\n\nhttp://www.w3.org/TR/css3-fonts/\n\n**9.**\n\nhttp://kernest.com/\n\
    \n**10.** http://crudfactory.com/font/show/juvelo\n\n**11.** http://bluecrowbar.com/\n\
    \n**12.** http://css3please.com/"
  merge: -1
