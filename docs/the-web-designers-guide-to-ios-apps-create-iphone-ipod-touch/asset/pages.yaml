  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**122**\n\n![](img/4d979018542def8748544c4af0d37f5a_134_0.png)\n\
    \n**Figure 7.3** shows the result in Simulator.\n\n7.3 An audio player created\
    \ with \n\nNKAudioPlayer and NKToolBar with \n\nlabeled buttons.\n\n![](img/4d979018542def8748544c4af0d37f5a_134_1.png)\n\
    \nThis isn’t bad. But there may be a better way.\n\nThe better way that I sought\
    \ was to graphically look more like the iPod \n\napplication on an iPhone. So\
    \ I made restart, play, and pause buttons for \n\nthe toolbar (**Figure 7.4**).\n\
    \n7.4 Restart, play, and pause buttons.\n\nNow instead of the labels, the JavaScript\
    \ that pulls in the buttons needs to \n\npull in the PNG images I made: resume.png,\
    \ play.png, and pause.png. This \n\nis how to make that modification:\n\n**var\
    \ toolBar = new NKToolBar();**\n\n**toolBar.init(372);**\n\n**toolBar.addFlexibleSpace();**\n\
    \n**toolBar.addButton(“”, “****resume.png****”, “buttonPressed1”);**\n\n**toolBar.addButton(“”,\
    \ “****play.png****”, “buttonPressed2”);**\n\n**toolBar.addButton(“”, “****pause.png****”,\
    \ “buttonPressed3”);**\n\n**toolBar.addFlexibleSpace();**\n\n**toolBar.setStyle(“blacktranslucent”);**\n\
    \n**toolBar.show();**"
