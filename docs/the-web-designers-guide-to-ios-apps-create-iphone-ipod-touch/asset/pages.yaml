    \n** background-image: url(metalTexture.gif);**\n\n**}**\n\n**Writing the JavaScript**\n\
    \nThe JavaScript for this method is nearly identical to that in the previous \n\
    \nmethod, so I’ll only highlight the difference: the larger specification for\
