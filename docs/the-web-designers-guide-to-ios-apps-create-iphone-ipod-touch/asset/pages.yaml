  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**154**\n\n![](img/4d979018542def8748544c4af0d37f5a_166_0.png)\n\
    \n**@font-face**\n\nAnother great CSS3 tool to add to your iOS toolbox is @font-face.\
    \ The \n\n@font-face rule is an invigorating breath of fresh typographic air for\
    \ web \n\ndesigners and, fortunately, what works for modern web browsers also\
    \ works \n\n(in a more limited fashion) for designing iOS apps with HTML, CSS,\
    \ and \n\nthe NimbleKit Objective-C framework.\n\nTechnically @font-face dates\
    \ to the CSS2 specification, but it didn’t really \n\ntake hold until CSS3. As\
    \ the W3C specification notes, @font-face allows \n\ndesigners to go beyond the\
    \ traditional set of “web-safe” fonts, and to do so \n\nin a way that is consistent\
    \ across any modern browser (or browser engine) \n\nthat supports CSS3.⁸ This\
    \ gives designers a level of independence with \n\nrendered HTML typography that\
    \ we have dreamed about for years!\n\nBut before you launch into using @font-face,\
    \ you should know what fonts \n\nare already resident in the iOS (**Figure 9.4**).\n\
    \n9.4 The fonts that come installed in iOS \n\non the iPhone, iPod touch, and\
    \ iPad."
  merge: -1
  pgno: 166
- img_proc: true
  md: "HTML5 AND CSS3 / MORE DESIGN OPTIONS WITH CSS3\n\n**155**\n\n![](img/4d979018542def8748544c4af0d37f5a_167_0.png)\n\
    \nNot a terribly exciting selection, is it?\n\nIt’s easy to see why an iOS app\
    \ designer would be interested in using \n\nanother typeface that isn’t represented\
    \ in this list. So how do we go about \n\nexpanding our options beyond these meager\
    \ staples? The basic formula for \n\nthe rule is\n\n**@font-face { <font-description>\
    \ }**\n\nand the description has the same form as other CSS rules, with the familiar\
    \ \n\nsyntax\n\n**descriptor: value;**\n\nNow all we need is a new typeface. Hmm—where\
    \ do we find fonts to \n\ninstall so we have more typographic freedom with our\
    \ HTML content?\n\nKernest is one such place.\n\n**Kernest**\n\nKernest is a web\
    \ font services site that delivers browser-supported font files \n\nin several\
    \ formats including Scalable Vector Graphic (SVG) format, the \n\nformat that’s\
    \ supported by the web rendering engine in iOS. Kernest was \n\nlaunched in July\
    \ 2009 by Garrick Van Buren and currently provides 100 \n\nfonts for online or\
    \ local use (**Figure 9.5**)⁹.\n\n9.5 Kernest, a web font \n\nservice."
  merge: -1
  pgno: 167
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**156**\n\n![](img/4d979018542def8748544c4af0d37f5a_168_0.png)\n\
    \nHere are the steps for using a font from Kernest in an iOS app:\n\n**1.** Search\
    \ for a new font: Kernest gives you several ways to search through \n\nits library\
    \ of fonts including by style, foundry, designer, font family, or \n\nlicense.\n\
    \n**2.** Register for the service (this step is free) so you can sign in. Signing\
    \ in is \n\nrequired to download new fonts.\n\n**3.** Once you find the font you\
    \ wish to use, download it and save it to a local \n\ndrive.\n\n**4.** Unzip the\
    \ file archive and add the .svg and .css files that are provided to \n\nan open\
    \ Xcode project.\n\n**5.** Edit the .css file to reference only the .svg file,\
    \ and delete the **fonts/**\n\nsubdirectory from the local url.\n\n**6.** Add\
    \ the appropriate class for your new font, as defined in the .css file, to \n\n\
    your HTML and you are in business!\n\nLet’s walk through an example to see how\
    \ this works in practice. For this \n\nexercise, I visited Kernest and chose an\
    \ attractive typeface called Juvelo.^(10)\n\nI found it by searching in the public\
    \ domain category, because in this case \n\nI didn’t want to pay to license a\
    \ font (**Figure 9.6**).\n\n9.6 The Juvelo preview \n\nscreen in Kernest."
  merge: -1
  pgno: 168
- img_proc: true
  md: "HTML5 AND CSS3 / MORE DESIGN OPTIONS WITH CSS3\n\n**157**\n\n![](img/4d979018542def8748544c4af0d37f5a_169_0.png)\n\
