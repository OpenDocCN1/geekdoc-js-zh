  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**196**\n\nthis very moment, as you’re\
    \ reading this with another part of your over-\n\nactive brain. So PAY ATTENTION:\
    \ I have a few words to say about social \n\nnetworking on behalf of your app.\n\
    \nThe most important thing to remember about creating a Facebook page, \n\nTwitter\
    \ account, or other social media channel for your app(s) is that \n\ncreating\
