  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**18**\n\nAfter selecting the new Developer\
    \ ID option, you’ll be forwarded to per-\n\nsonal and professional profile pages.\
    \ This is another area that appears to \n\nrequire careful answers, but don’t\
    \ be particularly concerned. For example, \n\nthere are questions about your primary\
    \ app market, the categories of apps \n\nyou plan to design, and whether you design\
    \ for other mobile platforms. I \n\nhave yet to hear any stories about Apple not\
    \ approving an app because it \n\ndoesn’t fit a category that was selected in\
    \ this profile. Similarly, there are \n\nprobably hundreds of Apple Developers\
    \ who also design apps for other \n\nmobile platforms. So I don’t think you’ll\
    \ be penalized for being honest if \n\nyou’re also, say, an Android app designer.\
    \ (On the other hand, why is Apple \n\nasking? Just chalk it up to one of the\
    \ many unexplained mysteries that sur-\n\nround Apple.)\n\n**Apple Developer Agreement**\n\
    \nAfter completing your personal and professional profiles, you are for-\n\nwarded\
    \ to another slightly intimidating screen: the Developer Agreement \n\npage. Again,\
    \ don’t overthink this. On the other hand, this is more than \n\njust your standard\
    \ EULA that you toss aside after buying new software. It \n\noutlines a legal\
    \ agreement that you are making with Apple, as a developer \n\nof software for\
    \ their devices. So what does *that* entail?\n\nNow I’m not a lawyer, so don’t\
    \ read on thinking that you’ll get a bunch of \n\nlegal advice about the merits\
    \ of Apple’s Developer Agreement, but here are \n\nsome things to be aware of:\n\
    \nr Apple Developer ID and password: Keep these confidential and don’t \n\nshare\
    \ them with anyone. Unless you want to share them (and I’m not \n\nkidding here)\
    \ with your child aged 13 to 17 who wants to design soft-\n\nware for Apple under\
    \ your ID. Isn’t it reassuring to know that you can \n\nstart a family business\
    \ with only one Developer ID?\n\nr Developer benefits: No, you don’t get health\
    \ insurance or paid vacation \n\nby registering to be an Apple Developer. But\
    \ there is one particularly \n\nnifty benefit: being eligible to attend Apple’s\
    \ annual Worldwide Devel-\n\noper Conference (WWDC) in San Francisco. This is\
    \ the legendary \n\nevent where Steve Jobs announces big news (like the first\
    \ iPhone in June \n\n2007, and the iPhone 4 in June 2010). The first day of announcements\
    \ \n\nand updates is followed by four days of technical sessions and labs"
  merge: -1
