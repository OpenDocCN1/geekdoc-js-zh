  md: "Here you are, reading a book about designing iOS apps with HTML, CSS, \n\n\
    and JavaScript that you can distribute or sell in the iTunes App Store. This \n\
    \nmust mean that you are a web designer and have some interest in designing \n\
    \nnative apps for the iPhone, iPod touch, and iPad.\n\nIt might also mean that\
    \ you’re ready to take a leap of faith and start reading \n\nabout something that\
    \ sounds too good to be true. After all, I had a work-\n\nshop attendee tell me\
    \ last summer, “The only reason I signed up for your \n\nworkshop is because I\
    \ didn’t believe it was possible.”\n\nWhich, roughly translated into English,\
    \ means, “I came here thinking you \n\nwere a liar who wanted to rip me off.”\n\
    \nBut here’s the thing: It *is* possible. And you’re now holding the book that\
    \ I \n\nwish I had about two years ago: It doesn’t require you to learn how to\
    \ pro-\n\ngram in Objective-C, which is really nice for people like me (and perhaps\
    \ \n\nyou) who do not think of ourselves as programmers.\\*\n\nSo how does this\
    \ work, and is this book really a work of nonfiction?\n\nIt is indeed. But let’s\
    \ get a few other things straight first.\n\n**This book is...**\n\nr An introduction\
    \ to using HTML, CSS, and JavaScript to design native \n\napplications for Apple’s\
    \ iOS devices.\n\nr An introduction to using the NimbleKit Objective-C framework,\
    \ \n\na fabulous collection of library items that allow you to design the \n\n\
    Objective-C apps that Apple requires, without having to write \n\nany Objective-C\
    \ yourself.\n\n**INTRODUCTION**\n\n\\* Of course, HTML, CSS, and JavaScript are\
    \ all languages that instruct software and \n\nhardware to behave in particular\
    \ ways, so web designers are also programmers. But, \n\nstill, not really Programmers\
    \ with a capital P, if you know what I mean."
  merge: -1
  pgno: 10
- img_proc: true
  md: "r A comprehensive guide to visualizing, planning, designing, building, \n\n\
    and distributing your iOS apps.\n\nr A manual for designing several types of content-based\
    \ apps with native \n\niOS interfaces.\n\nr A textbook for anyone teaching iOS\
    \ app design and content formatting \n\nprinciples to students who want to successfully\
    \ design their first app \n\nbefore they become grandparents.\n\nr A resource\
    \ to help app design teams create functional wireframes for \n\nsample app navigations\
    \ and screens.\n\nSo that’s what this book is. However, it’s also important to\
    \ understand what \n\nthis book is *not*.\n\n**This book is *****not*****...**\n\
    \nr A manual for programming in Objective-C. There are plenty of other \n\nbooks\
    \ that do this. And remember, NimbleKit already contains all the \n\nObjective-C\
    \ you need—it’s written already!\n\nr A step-by-step workbook for designing any\
    \ app you can think of. There \n\nmay be apps you can think of that web standards\
    \ and NimbleKit do not \n\nsupport very well. In that case, you should consider\
    \ other options, some \n\nof which I mention in Chapter 10.\n\nr The complete\
    \ guide to NimbleKit. NimbleKit is big enough that one \n\nreasonably sized book\
    \ cannot teach you all of it (and yes, I wanted to \n\nkeep this book reasonably\
    \ sized so that it wasn’t expensive and could be \n\nread relatively quickly).\n\
    \nr A collection of the world’s best HTML, CSS, and JavaScript code \n\nexamples.\
    \ There is usually more than one way to solve a design problem \n\nwith code.\
    \ Sometimes I show you more than one way, and other times \n\nI just show one.\
    \ When I choose one, it’s either an easier way or just the"
  merge: -1
  pgno: 11
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**xii**\n\nway I know. If you have\
    \ another way (and especially a better way), feel \n\nfree to tell me via this\
    \ book’s website at http://iosapps.tumblr.com. If \n\nyou submit code that I can\
    \ test successfully, I will share it with other \n\nreaders via the website.\n\
    \nr An advocate for Apple’s iOS devices or its App Store. Although I am a \n\n\
    fan of Apple and its commitment to design and user experience, I didn’t \n\nwrite\
    \ this book from a fanboy’s perspective. I’m simply telling the story \n\nthat\
    \ I know, and teaching you what I can; both happen to focus on \n\nmobile applications\
    \ for iOS devices.\n\nr An up-to-the-minute reference. Chances are, now that this\
    \ book is \n\nprinted, something in it is already out of date. But I’m with you\
    \ for the \n\nlong haul: To get updates (and download code samples featured in\
    \ this \n\nbook), visit http://iosapps.tumblr.com.\n\nIf you’re a designer who\
    \ is familiar with Web Standards, my goal is to open \n\nup an exciting new opportunity\
    \ for you. I hope that reading this book and \n\ntrying out the examples will\
    \ lead you to design your own iOS apps, consult \n\nwith larger design teams on\
    \ mobile interface and user experience goals, and \n\nteach others how to design\
    \ and format content for use on mobile devices. \n\nI also hope that this book\
    \ is just the beginning. Ideally, it should equip \n\nand encourage you to eventually\
    \ learn much more than what is contained \n\nbetween these covers.\n\nSo good\
    \ luck, and happy reading … and designing!"
