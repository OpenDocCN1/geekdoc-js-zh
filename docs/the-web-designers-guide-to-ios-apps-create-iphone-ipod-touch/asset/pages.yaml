- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**44**\n\nNow the trick of this is—and\
    \ I kid you not—you can’t just submit these \n\nvalues for the project file and\
    \ expect them to always show up in the app \n\nfile as well. (Though this can\
    \ sometimes happen—and even often.) I’m \n\nafraid it’s a hard lesson to learn\
    \ about how Xcode works, and sometimes \n\nthese details even vary a bit from\
    \ app to app. However, I do believe that the \n\nDevelopment Provisioning Assistant\
    \ in the Provisioning Portal has made \n\nthis more consistent.\n\nSo at any point\
    \ when you click Build and Run and your app is not installed \n\non your device,\
    \ double-check these same settings in the Target Info win-\n\ndow too. Make sure\
    \ everything is set as outlined above.\n\n**Building and submitting (distributing)**\n\
    \nWhen you submit an app to Apple for review and placement in the iTunes \n\n\
    App Store, the process isn’t that different from using Xcode to install the \n\
    \napp on a device. And again, the details of building and submitting make \n\n\
    more sense at the end of this journey, so they are covered in Chapter 12.\n\n\
    **PURCHASING AND ACTIVATING YOUR NIMBLEKIT LICENSE**\n\nIn addition to needing\
    \ a valid Distribution Provisioning Proﬁle for your app, you’ll need a licensed\
    \ \n\nversion of NimbleKit. At the time of this writing, a NimbleKit license requires\
    \ a one-time fee of $99. \n\nAfter purchasing the license, you’ll receive a 16-digit\
    \ serial number.\n\nAfter receiving the number, go to the Classes folder in your\
    \ app’s project. Yes, as previously \n\nmentioned, this is one of the areas that\
    \ is normally off-limits to you. But this is one time you’re \n\nallowed to go\
    \ here. Open the folder, then double-click the AppDelegate.m ﬁle. You’ll see a\
    \ bunch \n\nof Objective-C code that you would normally not touch.\n\nLook for\
    \ this line of code:\n\n**Nimble \\*nimble = \\[\\[Nimble alloc\\] initWithRootPage:@”main.html”\
    \ **\n\n**window:window serial:@””\\];**\n\nCopy and paste your NimbleKit serial\
    \ number between the double quotes, so you see this (only the \n\nXs below represent\
    \ your actual serial number):\n\n**Nimble \\*nimble = \\[\\[Nimble alloc\\] initWithRootPage:@”main.html”\
    \ **\n\n**window:window serial:@”XXXX-XXXX-XXXX-XXXX”\\];**\n\nThen save, exit,\
    \ and do not tamper with an Objective-C ﬁle again. You are now licensed to use\
    \ \n\nNimbleKit and distribute NK-based apps to iTunes!"
  merge: -1
  pgno: 56
