  md: "MARKETING YOUR APPS / DESIGNING YOUR OWN APP MARKETING COMMUNICATIONS\n\n**197**\n\
    \nThe difficulty is not particularly technical, but rather it involves discipline.\
    \ \n\nIf content feels old on a website in a matter of days or weeks, content\
    \ can \n\nfeel old in a social media channel in a matter of hours.\n\nAnd what\
    \ will your app updates be about? New content? Version updates? \n\nGood. What\
    \ kind of muffin you are having with your tall skinny cappuc-\n\ncino? Maybe not.\
    \ Remember that if you open up a new social channel for \n\nyour app, your content\
    \ better stay app-focused for the most part. Too much \n\nfiller will look like\
    \ you didn’t need the social channel in the first place.\n\nFurthermore, I have\
    \ learned that very few of my apps’ users are even active \n\non social networks,\
    \ at least when it comes to their work. So try to get a \n\nsense in advance about\
    \ your audience’s use of social media before embark-\n\ning on this route for\
    \ your app (and that, of course, could be tricky and take \n\nsome time).\n\n\
    There are so many recommendations out there for how to adopt social \n\nmedia\
    \ to your advantage, I don’t want to rehash it all here. But I would \n\nencourage\
    \ you to consider social media for your app or apps, yet caution \n\nyou not to\
    \ think of it as a silver bullet to success. Adopting social media is \n\nlike\
    \ marathon training or wine making: It inherently takes time and cannot \n\nbe\
    \ rushed, because you need time to build an audience, a social persona, \n\nand\
    \ a pattern of communications that your audience can learn to expect \n\nand rely\
    \ on.\n\nSo by all means consider it, but consider it with care.\n\n**Communicating\
    \ via app updates**\n\nYou may not have thought much about them, but the update\
    \ messages that \n\nyou get in the App Store app from designers are also a form\
    \ of app mar-\n\nketing communications. But the content and format can really\
    \ vary, and \n\nsometimes you are just as likely to skip these messages. What\
    \ makes them \n\nwork well, and what makes them work not so well?\n\nFor better\
    \ or worse, these update messages are the most direct way you \n\nhave of communicating\
    \ with your app’s customers after they’ve made their \n\nfree download or purchase.\
    \ **Figure 11.5** (on the next page) shows one \n\nexample of an update message."
  merge: -1
