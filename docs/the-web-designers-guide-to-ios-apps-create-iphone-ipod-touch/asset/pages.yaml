  md: "**223**\n\nWhat follows are three additional sections about topics \n\nthat\
    \ are critical to designing successful projects: content \n\nstrategy, application\
    \ planning, and application usability.\n\nThese were originally conceived as shorter\
    \ sections that \n\nwere to be sprinkled throughout the book, flavoring the \n\
    \nsoup, so to speak, with broad and unifying principles that \n\nyou should keep\
    \ in mind from beginning to end.\n\nThe trouble is, they’re all critically and\
    \ equally important. \n\nBut the rest of this book has a flow from preparing,\
    \ to \n\nbuilding, to the delivery of an app. So interspersing these \n\nextra\
    \ sections throughout the book would have given a \n\nfalse impression that whichever\
    \ one was last could be \n\nthought about toward the end of a project."
  merge: -1
  pgno: 235
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**224**\n\nSo this appendix is a bit\
    \ of a paradox: It’s at the end of the book, but you \n\ncould (and even should)\
    \ read it first. And you should certainly keep it in \n\nmind from the beginning\
    \ of an app project to the end of its design and \n\ndelivery, and beyond to include\
    \ the app’s ongoing maintenance.\n\nIn a sense, having this at the end is appropriate.\
    \ Good content strategy, \n\nplanning, and usability are the be-all and end-all\
    \ of good design.\n\nSo here’s the final word.\n\n**Content strategy**\n\nContent.\
    \ We web designers are often at a loss about how to handle content. \n\nSome quick\
    \ scenarios remind me of this:\n\nr The *I-don’t-really-care-about-content designer*:\
    \ This person is all about \n\ndeferring the responsibility of content to someone\
    \ else. Heck, anyone \n\nelse. Because we have plenty to focus on already, thank\
    \ you very much: \n\ninformation hierarchy (OK, so that vaguely involves content),\
    \ naviga-\n\ntion, site structure, page layout, and the famously ambiguous but\
    \ all-\n\nimportant look and feel.\n\nr* Mr. or Ms. Lorum Ipsum*: Here’s a designer\
    \ who is kind of good at \n\nfeigning interest in content. But is it really a\
    \ sincere interest if the words \n\nare fake?\n\nr The *I’m-a-Renaissance-man\
    \ (or woman) designer*: This person is pretty \n\nconfident that she can just\
    \ massage the kinks out of any content that’s \n\nhanded to her. How hard can\
    \ it be, especially with spell and grammar \n\ncheck turned on?\n\nThe trouble\
    \ with having any of these attitudes regarding web content is that \n\nthey allow\
    \ us to dodge our overall responsibility for a high-quality, user-\n\nfocused,\
    \ and organization-focused website. Sure, we like to think that we’re \n\njust\
    \ focusing on what we should—design—but in reality, we’re not fully \n\nfocusing\
    \ on design if we’re being cavalier about content.\n\nAnd the trouble with bringing\
    \ these attitudes to the design of iOS apps \n\nis that it’s even more dangerous\
    \ than with websites. As you’ve already \n\nlearned, there’s a lot less space\
    \ or interface to design in a mobile app. You \n\nsimply don’t have the luxury\
    \ of saying, “Well, I have all of this design work \n\nto do—you take care of\
    \ the content and tell me when it’s ready.”"
  merge: -1
