  md: "**93**\n\n*iOS apps are designed to run *\n\n*natively on Apple mobile devices.*\n\
    \n*Maps help mobile natives know *\n\n*where they are running.*\n\nMapping is\
    \ one of my favorite uses of my iPhone, and it’s \n\nan example of a good philosophy\
    \ for mobile application \n\ndesign. It fits squarely into my approach about why\
    \ \n\ndesigning custom, native apps can offer real value to \n\npeople by providing\
    \ a useful solution:\n\nr Mapping is a timeless need that can surface wherever\
    \ \n\nwe are and regardless of what we are doing. It is both \n\n“real world”\
    \ and technology agnostic—though, in this \n\ncase, mobile technology can have\
    \ a role as a mapping \n\nsolution!\n\nr Mapping is a generic activity that applies\
    \ to any \n\nbusiness or organization that has a geographic, \n\nbricks-and-mortar\
    \ location. So it can be a key feature \n\nof a mobile app for nearly anyone.\n\
    \nr Mapping is about more than finding the location of \n\na business, organization,\
    \ or other venue. On a cellular \n\niOS device, it can also be a wayfinding tool\
    \ that \n\nprovides detailed driving, mass transit, or walking \n\ndirections\
    \ from your current location to your \n\ndestination."
  merge: -1
  pgno: 105
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**94**\n\nAnd once you start seeing\
    \ mapping as a universally appreciated function \n\nthat can apply to nearly any\
    \ client or employer, you start seeing all kinds of \n\napplications. Mapping\
    \ is really the location of\n\nr restaurants\n\nr stores\n\nr event centers\n\n\
    r festivals\n\nr farmers’ markets\n\nr medical clinics\n\nr campgrounds\n\nr people\n\
    \nr services\n\nClearly, this list could go on and on. But again, part of why\
    \ I’m writing this \n\nbook is to think aloud as a designer, and inspire you to\
    \ see opportunities for \n\ndesigning apps that are relevant to clients and, more\
    \ importantly, relevant \n\nto their customers. Mapping, then, becomes a tool\
    \ that anyone should be \n\nable to relate to when discussing an iOS native app\
    \ project.\n\nThe NimbleKit framework offers a handy map API that pulls in the\
    \ same \n\nGoogle Maps view that you get in the actual Maps application that comes\
    \ \n\non the iPhone and iPad. Right out of the box, it’s fairly easy to configure,\
    \ \n\nand has only one minor shortcoming at the moment, which has a relatively\
    \ \n\neasy work-around.\n\nI’ll be up-front and start with the shortcoming: Apple\
    \ does not currently \n\nopen up the full Google Maps API to app designers. So\
    \ we can pull a live \n\nmap view into our custom app and also set a pin and label\
    \ it to annotate our \n\nmap, but we cannot currently pull the directions feature\
    \ into our app. I sus-\n\npect this is part of Google’s agreement with Apple for\
    \ being the default map-\n\nping tool on the iOS platform. (And we may not like\
    \ it, but it is what it is.)\n\nFortunately, there is a nice work-around to this\
    \ shortcoming: providing a \n\nlink to the Maps app within the map view. In other\
    \ words, even though we \n\ncannot fully incorporate directions into our own apps,\
    \ we can still link to a \n\nmap pin in Google Maps and have it open directly\
    \ in the Maps application. \n\nIt adds an additional step, but once you see how\
    \ seamlessly it works, the \n\nextra step ends up feeling rather trivial."
  merge: -1
  pgno: 106
- img_proc: true
  md: "FOCUS ON APP CONTENT: MAPS / METHOD ONE: USING NKBUTTON\n\n**95**\n\nSo let’s\
    \ walk through a few ways that we can pull a custom Google map \n\nview into a\
    \ native app, and still have it lead to getting convenient directions \n\nfrom\
    \ our current location. We can design all of this with a dash of HTML, \n\na few\
    \ lines of CSS, a little JavaScript, and some help from NimbleKit’s \n\nObjective-C\
    \ framework.\n\n**Method one: Using NKButton**\n\nThis method is pretty short\
    \ and sweet. It allows us to pull in a Google Maps \n\nview, specify a pin at\
    \ a particular location and label it, then add a “View in \n\nGoogle Maps” **NKButton**\
    \ with a native appearance and behavior that will \n\nlink to the same location\
    \ in Maps so users can get driving directions. And \n\nit does this all without\
    \ requiring you to do any styling or even much cod-\n\ning. In fact, it hardly\
    \ even uses any HTML; it’s all NimbleKit and a bit of \n\nJavaScript at the beginning\
    \ of the file.\n\nI’m including this technique as well as a more custom-designed\
    \ button \n\nbecause I want to highlight how the NimbleKit Objective-C framework\
    \ \n\noften supports both native features and custom features. Learning how to\
    \ \n\ndo both is very useful: Sometimes the specification of an app might call\
    \ for \n\na native look, and other times your employer’s or client’s branding\
    \ guide-\n\nlines might lead you toward a less native, more customized styling\
    \ of an \n\nelement like a button by using CSS.\n\n**Planning the screen layout**\n\
    \nThis technique allows you to overlay a button on the screen contents, so \n\n\
    we’ll do that in a single screen. And for this example we’ll dispense with \n\n\
    any additional elements except the status bar and title bar, which are pres-\n\
    \nent in any screen of a content-based app.\n\nLooking at our 320 × 480 pixel\
    \ iPhone screen, here are the elements we’re \n\nstarting with:\n\nr status bar:\
    \ 320 × 20 pixels\n\nr title bar: 320 × 44 pixels\n\nThat leaves us with 416 pixels\
    \ in height to work with; this comes into play in \n\nthe JavaScript step of implementing\
    \ this technique."
  merge: -1
  pgno: 107
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**96**\n\n**Writing the HTML**\n\n\
    The HTML for this method is probably the shortest ever written. In fact, as \n\
    \na stand-alone page of code, it really doesn’t do anything until the JavaScript\
    \ \n\nis added later:\n\n**<html>**\n\n**<head>**\n\n**<meta name = “viewport”\
    \ content = “initial-scale = 1.0,**\n\n**user-scalable = no” />**\n\n**</head>**\n\
    \n**<body>**\n\n**</body>**\n\n**</html>**\n\nTruly, that’s it. We’re just creating\
    \ a shell in which to place some JavaScript, \n\nand setting the screen to not\
    \ be scalable with touch gestures with the **meta**\n\ntag (the map will be scalable\
    \ already). Thus, this method requires no CSS, \n\nas it’s not necessary for using\
    \ NKButton.\n\n**Writing the JavaScript**\n\nNow we get to the interesting part:\
    \ calling the NimbleKit framework into \n\naction for the embedded map view. Time\
    \ to dust off some JavaScript writ-\n\ning skills (but it’s pretty easy).\n\n\
    There are four basic styles and behaviors that we call into action in this \n\n\
    step:\n\n**1.** Give the page a name in the native iPhone UI title bar.\n\n**2.**\
    \ Set the color of the title bar.\n\n**3.** Embed the Google map view.\n\n**4.**\
    \ Enable a NimbleKit button to link to our location in Maps.\n\nThe first two\
    \ steps were already detailed in Chapter 4, so here’s what I’ve \n\ndone to name\
    \ the screen and set the color to red:\n\n**var navController = new NKNavigationController();**\n\
    \n**navController.setTitle(“Our Map Page”);**\n\n**navController.setTintColor(255,\
    \ 0, 0);**"
  merge: -1
  pgno: 108
- img_proc: true
  md: "FOCUS ON APP CONTENT: MAPS / METHOD ONE: USING NKBUTTON\n\n**97**\n\nNow let’s\
    \ jump to the parameters that are available in the map embed code. \n\nThe first\
    \ task is to create a new **NKMapView**, which is a variable with the \n\nname\
    \ “map”:\n\n**var map = new NKMapView();**\n\nAfter this, define the size of the\
    \ view by specifying the X and Y coordinates \n\nof its point of origin (with\
    \ 0, 0 being the top left of the screen) and decide \n\nhow wide and tall it should\
    \ be. So, a map taking up an entire iPhone screen \n\nwould have these values:\n\
    \n**map.init(0, 0, 320, 480);**\n\nBut remember that you have two other elements\
    \ on the screen (the status \n\nbar and the title bar), so you need to subtract\
    \ those heights from the avail-\n\nable height to calculate the remainder:\n\n\
    **map.init(0, 0, 320, 416);**\n\nThen set the map type. As in Apple’s Maps app,\
    \ there are three settings for \n\nthe type of map: **standard**, **satellite**,\
    \ and **hybrid**. In this example, it’s \n\nset to **”standard”**:\n\n**map.setMapType(“standard”)**\n\
    \nThe next part is a bit tricky and requires some experimentation: Set the \n\n\
    geographic center of the map view and set the range that the view is cover-\n\n\
    ing. The format is\n\n**map.setDisplayRegion(latitude, longtitude, latitudeDelta,\
    \ **\n\n**longtitudeDelta);**\n\nLatitude and longitude are measured from the\
    \ intersection of the prime \n\nmeridian and the equator, so values of latitude\
    \ north of the equator are \n\npositive (and south are negative), and values of\
    \ longitude east of the prime \n\nmeridian are positive (and west are negative).\
    \ The trickier part is setting \n\nthe delta values. Hopefully my experimentation\
    \ here is helpful to you: The \n\nvalue of .01 is equal to about 5,500 feet, or\
    \ approximately one mile.\n\nIn the following code example, I’ll use a restaurant\
    \ called Sven and Ole’s \n\nand their real location in the town of Grand Marais,\
    \ Minnesota (pay them \n\na visit if you’re ever in northern Minnesota—they serve\
    \ great pizza!):\n\n**map.setDisplayRegion(47.7494, -90.3336, .01, .01);**\n\n\
    **NOTE ****Getting **\n\n**longitude and latitude **\n\n**in Google Maps**\n\n\
    Finding longitude and \n\nlatitude in Google Maps \n\nis easy if you use the right\
    \ \n\ntool. I use the LatLng \n\nTooltip (by Marcelo C). \n\nFind it by going\
    \ to Google \n\nMaps Labs and enable \n\nLatLng Tooltip. You can \n\nﬁnd this\
    \ and other Google \n\nMaps Labs options by \n\nclicking on the New! (with \n\n\
    a green lab beaker icon) \n\nlink in the upper right cor-\n\nner of the Google\
    \ Maps \n\nscreen, next to Help and \n\nSign in."
  merge: -1
  pgno: 109
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**98**\n\nThe next line tells the map\
    \ view not to show the user’s current location. In \n\nthis example, that’s not\
    \ important, nor is it necessarily possible if the user is \n\noutside the range\
    \ of the map view:\n\n**map.showUserLocation(“no”);**\n\nNext, I’ll set a pin\
    \ at the location of Sven and Ole’s restaurant. It makes \n\nsense to me to initially\
    \ center the map view on the restaurant, so you’ll see \n\nthat the latitude and\
    \ longitude match the **setDisplayRegion** parameters. \n\nThen come two labels\
    \ or titles—the first being the main label for the pin \n\nand the second being\
    \ an optional subtitle:\n\n**map.addAnnotation(47.7494, -90.3336, “Sven and Ole’s”,\
    \ **\n\n**“Restaurant”);**\n\n**NOTE ****A word about NimbleKit’s MapView**\n\n\
    **NKMapView** supports some additional parameters following the title and subtitle,\
    \ \n\nincluding image, color, and an optional callback function. But I want to\
    \ keep my \n\npin like the ones I’m accustomed to seeing in the actual iOS Maps\
    \ application, so I \n\nrecommend keeping your map pin simple as in my example.\
    \ If you want to explore \n\nthese options, consult the NimbleKit documentation\
    \ for **NKMapView**, which explains \n\nthem in more detail.¹\n\nAt this point,\
    \ I’ll add a line of code to set a slight delay before the pin \n\nappears (to\
    \ match the user experience in Maps):\n\n**setTimeout(selectAnnotation, 500);**\n\
    \nI’ll also add a few brief lines to make the map function actually display the\
    \ \n\nmap and allow the pin to be selectable:\n\n**function selectAnnotation()**\n\
    \n**{**\n\n** map.selectAnnotation(‘Here’);**\n\n**}**\n\nNext, I’ll define the\
    \ function to navigate to the same location in Maps. I’ve \n\ncalled it **openInMaps**\
    \ and in it I’m placing a URL for Sven & Ole’s location \n\nin Google Maps:\n\n\
    **function openInMaps()**\n\n**{**\n\n**NKOpenURLInSafari(‘http://maps.google.com/?q=Sven+%26+Ole%**\n\
    \n**27s&cid=11769511904778742301’);**\n\n**}**"
  merge: -1
  pgno: 110
- img_proc: true
  md: "FOCUS ON APP CONTENT: MAPS / METHOD ONE: USING NKBUTTON\n\n**99**\n\n**ALL\
    \ GOOG LE MAPS LINKS AR E NOT EQUAL !**\n\nOne very important note here about\
    \ the origin of the Google Maps link: Create it on your iOS device \n\nand then\
    \ email it to yourself. One of the more interesting debugging exercises I went\
    \ through \n\nwhen ﬁrst implementing an **NKMapView** was having some frustrating\
    \ things happen with this link, \n\nsuch as\n\ns\n\nThe link opening in Safari\
    \ instead of Maps\n\ns\n\n!NDWORSEYETSOMETIMESNOTEVENHAVINGTHERIGHTLOCATIONOPEN\n\
    \nSome of this can be chalked up to the occasional Google Maps bug; I’ve sent\
    \ myself map links \n\nout of Maps before and sometimes the link in the email\
    \ doesn’t go back to the actual place I was \n\nseeing in Maps. I had this experience\
    \ way before I became an app designer, so I wasn’t totally \n\nsurprised to have\
    \ it happen when I tried to embed a map into an app.\n\nBut I also learned something\
    \ valuable along the way: There’s more than one format for a Google \n\nMaps link!\
    \ Sure enough, it’s one of those things that you don’t necessarily pay much attention\
    \ \n\nto until you run into a bug—at least, that’s when I ﬁrst noticed. And once\
    \ I did, some additional \n\nexperimentation led me to realize that the iPhone\
    \ will not necessarily open a Google Maps link in \n\nthe Maps app unless the\
    \ link was generated by Maps itself. This is why you should always generate \n\
    \nyour map links on your iOS device. Then it should open properly in Maps rather\
    \ than Safari.\n\nThe last step is implementing **NKButton** so that someone using\
    \ this app \n\nscreen can navigate to the same location in the Maps application.\
    \ The \n\nfollowing code defines a variable **mapsButton**, sets the size of the\
    \ but-\n\nton, and calls on the **openInMaps** function when clicked. I’ll also\
    \ set the \n\nalpha (transparency) to 80 percent so that it has a nice semitransparent\
    \ \n\nappearance:\n\n**var mapsButton = new NKButton();**\n\n**mapsButton.init(70,\
    \ 10, 180, 40, “openInMaps”);**\n\n**mapsButton.setTitle(“View in Google Maps”);**\n\
    \n**mapsButton.show();**\n\n**NKNativeControlSetAlpha(mapsButton, 0.8);**\n\n\
    The real last step, checking for Internet connectivity and using **NKAlert**,\n\
    \nwas covered in Chapter 5; the code is the same as it was in that example."
  merge: -1
  pgno: 111
