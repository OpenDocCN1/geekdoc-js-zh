  md: " THE IOS INTERFACE AND USER EXPERIENCE / NAVIGATING WITH TABLE VIEWS\n\n**59**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_71_0.png)\n\n4.11 A plain table used\
    \ to \n\nshow playlists in the iPod \n\napplication on the iPhone.\n\nTo code\
    \ the table, use NimbleKit’s NKTableView function. Here’s the \n\nJavaScript that\
