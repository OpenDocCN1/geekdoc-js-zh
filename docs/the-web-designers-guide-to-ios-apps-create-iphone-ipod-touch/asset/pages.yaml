  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**186**\n\nThis chapter is less technical,\
    \ but don’t think that makes it any less \n\nimportant. Read on so you can be\
    \ just as savvy with the communications \n\nand marketing aspects of your app\
    \ as with the other creative aspects of \n\niOS app design.\n\n**Who are you:\
    \ Deciding on **\n\n**an App Store identity**\n\nThis isn’t just a rhetorical\
    \ question. Seriously, who do you want to be when \n\ndesigning apps and making\
    \ them available to customers? Here are some \n\noptions to consider.\n\n**You\
    \ are you**\n\nPerhaps you want to keep things straightforward and, if you already\
    \ \n\nregistered as an Apple Developer under your own name, do any app design\
    \ \n\nconsulting or collaboration with others under your own name. Similarly,\
    \ \n\nyou may want to submit apps to Apple as an individual as well.\n\nDesigning\
    \ and submitting apps as an individual has the following \n\nadvantages:\n\nr\
    \ You can distribute or sell your apps via the App Store.\n\nr It is immediately\
    \ obvious who has designed your apps because they’re \n\nlisted under your name\
    \ in the App Store.\n\nr There may not be any financial or legal hoops to jump\
    \ through in your \n\nstate to do business as an individual.\n\nr It is likely\
    \ to be faster and easier to do business as a sole proprietor, and \n\nsubmit\
    \ apps to Apple as an individual.\n\nOn the other hand, designing and submitting\
    \ apps as an individual may \n\nhave the following disadvantages:\n\nr You are\
    \ probably personally liable for all business and design decisions \n\nthat you\
    \ make, in any event that an app client or customer has a problem \n\nwith your\
    \ work.\n\nr You give up some anonymity and privacy by submitting and distributing\
    \ \n\niOS as an individual. After all, your name will be listed in the App Store!"
  merge: -1
  pgno: 198
- img_proc: true
  md: "MARKETING YOUR APPS / WHO ARE YOU: DECIDING ON AN APP STORE IDENTITY\n\n**187**\n\
    \nr The annual cost of being in the regular Developer Program is currently \n\n\
    $99. If you’re registered as an individual developer, you’re on the hook \n\n\
    for covering the annual fee all by yourself (unless you recover the cost \n\n\
    with consulting fees).\n\nTake these considerations into account if you’re thinking\
    \ about operating \n\nas an individual or sole proprietor, and become familiar\
    \ with local, state, \n\nand federal commercial and tax requirements that may\
    \ pertain to your \n\nform of business.\n\n**You are your company**\n\nPerhaps\
    \ you’re like me and want to distribute your apps via a company \n\nname. When\
    \ I formed my company (Aesthete Software, LLC), I did it for \n\nthese advantages,\
    \ so see if they fit what you are looking for:\n\nr You want to look more established\
    \ and professional by being listed in \n\nthe App Store under a company name.\n\
    \nr You would like to limit your personal and family liability by creating a \n\
    \nform of business, such as a limited liability corporation (LLC).\n\nr You have\
    \ identified tax advantages of doing work as a company rather \n\nthan as an individual.\n\
    \nOf course, as with any option there are downsides to this one, too:\n\nr It\
    \ takes some time and, often, some expense to create a new legal entity \n\nfor\
    \ a company.\n\nr There may be additional tax forms to complete—as if taxes were\
    \ not \n\nenough work already!\n\nr If you want to take this route to its logical\
    \ conclusion, you could end up \n\npaying for additional company costs such as\
    \ a new web domain, web \n\nhosting, and so on. (This could be in addition to\
    \ any personal website \n\nexpenses you already have.)\n\nEven though I took this\
    \ route for my app distribution, don’t follow my lead \n\nwithout thinking through\
    \ your entire business plan, budget, and willing-\n\nness to try new things. Designing\
    \ apps may be enough new work for you—\n\ncreating and managing a new business\
    \ entity may not be on your priority \n\nlist at the moment, and that is just\
    \ fine."
