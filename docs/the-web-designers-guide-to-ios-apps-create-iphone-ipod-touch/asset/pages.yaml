    \ \n\nsimply drag the .js ﬁle to \n\nTargets > MyApp > Copy \n\nBundle Resources\
    \ in the \n\nGroups & Files pane. \n\nThis copies the ﬁle to the \n\napp bundle\
    \ to ensure \n\nthat everything works \n\nsmoothly."
