  md: "**125**\n\nAt the moment, Adobe Flash is still the dominant platform \n\nfor\
    \ delivering video on the World Wide Web. But you are \n\nlikely familiar with\
    \ the famous Steve Jobs public letter \n\nabout Flash from spring 2010 that drew\
    \ a clear line in the \n\nsand between iOS devices and Flash.¹ So until Flash\
    \ is \n\nsupported in iOS, you need to use other alternatives for \n\nplaying\
    \ video.\n\nFortunately, the approach to video in iOS apps is similar \n\nto the\
    \ approach to audio: There are HTML5 and NimbleKit \n\nlibrary item options. Let’s\
    \ take a look and see how video \n\nworks in each case."
