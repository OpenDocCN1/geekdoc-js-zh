  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**214**\n\nThe first screen you will\
    \ see is the App Information screen (**Figure 12.12**).\n\n![](img/4d979018542def8748544c4af0d37f5a_226_0.png)\n\
    \nThe first field, App Name, is the name that will be displayed in the iTunes\
    \ \n\nApp Store. *This name does not need to be identical to your actual app binary*,\n\
    \nthough it should be very close. For example, if your app name as installed \n\
    \nis “Hello World” and your company name is da Vinci Design, Inc., you may \n\n\
    want to capitalize on your ancestral relationship to Leonardo da Vinci and \n\n\
    give your app the name “Hello World (da Vinci)” so that when it shows up \n\n\
    in iTunes search results, the “da Vinci” grabs people’s attention.\n\nBut except\
    \ for minor alterations like this, the App Name should, in fact, be \n\nyour app’s\
    \ name.\n\nThe next field, SKU Number, can be whatever you wish it to be. If you\
    \ \n\nwill be working on apps for others, and they have a particular system for\
    \ \n\ntheir company’s SKU numbers, you will want this number to fit into their\
    \ \n\nmerchandising system. But aside from these customer-side requirements, \n\
    \nApple has no particular guidelines for this field.\n\nThe last item in App Information\
    \ is the Bundle ID. Use the dropdown to \n\nselect the bundle ID that you created\
    \ when first using the Development \n\nProvisioning Assistant to create your app’s\
    \ provisioning profile. And note \n\nthat this ID should look familiar already\
    \ because it matches the bundle ID \n\nfield in your app’s Info.plist file. (If\
    \ it does not, iTunes Connect will not \n\naccept your binary.)\n\nAfter you click\
    \ Continue, the next screen presents you with the Rights and \n\nPricing screen\
    \ shown in **Figure 12.13**.\n\n12.12 Providing \n\ninformation about your \n\n\
    app."
  merge: -1
