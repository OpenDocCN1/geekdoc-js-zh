  md: "**171**\n\nI will be perfectly honest: As cool as it is, the NimbleKit \n\n\
    Objective-C framework may not be the right design or \n\ndevelopment tool for\
    \ your particular app projects. I wrote \n\nthis book because my mobile app design\
    \ story is based on \n\nusing NimbleKit, and the framework has worked extremely\
    \ \n\nwell for my projects and my collaborators’ projects. I also \n\nknow that\
    \ I haven’t even tried all of its features yet (and \n\nnew features continue\
    \ to be added), so I am confident that \n\nit will remain a robust platform for\
    \ some time to come.\n\nTo me, this meant it was an important opportunity to tell\
    \ \n\nother standards-based web designers about.\n\nBut you may have project requirements\
    \ that NimbleKit \n\ndoesn’t meet or you may not wish to design only for iOS \n\
    \ndevices. And I’m not here to talk you into using NimbleKit \n\nexclusively—you\
    \ definitely need to be savvy about using \n\nthe right tool for the right task.\n\
    \nIf this is the case, or if you’re curious about exploring \n\nsome additional\
    \ options now that you’re familiar with \n\niOS app design, the mobile user experience,\
    \ and the big \n\npicture of app design and planning from beginning to end, \n\
    \nthis chapter is for you."
  merge: -1
  pgno: 183
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**172**\n\n**Emulating the iOS experience\
    \ **\n\n**with PhoneGap and jQTouch**\n\nAnother framework option that I think\
    \ is particularly compelling is \n\nPhoneGap, especially when used in conjunction\
    \ with a styling and \n\nbehavior plug-in such as jQTouch. This approach has some\
    \ similarities \n\nto NimbleKit, but it also has some key differences.\n\n**Considering\
    \ PhoneGap**\n\nPhoneGap is an open source framework that is free to download\
    \ from its \n\ndeveloper, Nitobi, Inc. (**Figure 10.1**).\n\n![](img/4d979018542def8748544c4af0d37f5a_184_0.png)\n\
    \nThis framework has a number of important things going for it. To start \n\n\
    with, the fact that it is open source is a win for people who gravitate \n\ntoward\
    \ open source solutions. Open source solutions offer some distinct \n\nadvantages:\n\
    \n10.1 The PhoneGap \n\nwebsite."
  merge: -1
  pgno: 184
- img_proc: true
  md: "OTHER MOBILE FRAMEWORKS / EMULATING THE IOS EXPERIENCE WITH PHONEGAP AND JQTOUCH\n\
    \n**173**\n\nr Downloading and upgrading is usually free.\n\nr The continued development\
    \ of the solution is less centralized, more \n\norganic, and tied to real-world\
    \ needs as they crop up “in the wild,” so \n\nthis can make open source solutions\
    \ feel more responsive to community \n\nneeds.\n\nr Some people just prefer to\
    \ avoid corporate and proprietary solutions.\n\nRemember that open source solutions\
    \ can have down sides as well:\n\nr Some argue that open source options are “free\
    \ like a free puppy”—the \n\nsolution itself may be free, but the ongoing support\
    \ may have hidden \n\ncosts, whether out-of-pocket or in terms of time spent finding\
    \ free \n\nsupport.\n\nr The development of open source solutions is dispersed\
    \ throughout a \n\ncommunity, but so is the responsibility for maintaining the\
    \ tool and \n\nkeeping it going (and decentralized responsibility can result in\
    \ its own \n\npolitical challenges).\n\nAnother strength of PhoneGap is multiplatform\
    \ support. It currently sup-\n\nports iPhone, Android, BlackBerry, Symbian, and\
    \ Palm mobile operating \n\nsystems. But the support and access to native features\
    \ varies from plat-\n\nform to platform, and you still need to install (and learn\
    \ how to use) the \n\nindividual development environments for these platforms\
    \ in order to use \n\nPhoneGap in that capacity.\n\nSo, what about the native\
    \ iOS user experience? This aspect of PhoneGap is \n\na mixed blessing, as the\
    \ framework does not include native user interface \n\nlibrary items such as a\
    \ title bar, tab bar navigation, audio and video players, \n\nand other familiar\
    \ iOS elements like NimbleKit does. From an interface \n\ndesign perspective,\
    \ it is much more of a blank canvas.\n\nBut there are ways to emulate, or build,\
    \ your own iOS interface, with CSS \n\nand JavaScript in PhoneGap. One way is\
    \ by using it with the jQTouch \n\nplug-in."
  merge: -1
  pgno: 185
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**174**\n\n**Considering jQTouch**\n\
    \njQTouch is a jQuery plug-in for mobile web design on iOS devices, and \n\ncan\
    \ work in tandem with development frameworks such as PhoneGap to \n\ncreate native\
    \ iOS applications. It can also be used for web apps that reside \n\non servers\
    \ and are delivered live to mobile browsers, on any mobile device \n\n(**Figure\
    \ 10.2**).\n\n![](img/4d979018542def8748544c4af0d37f5a_186_0.png)\n\nThis jQuery\
    \ plug-in has been optimized to run on mobile devices, and has \n\nnative-looking\
    \ styles that can help make your iOS app feel familiar to users \n\nof iOS apps.\
    \ jQTouch accomplishes this by emulating native iOS interface \n\nelements and\
    \ behaviors, such as page transitions, with convincing graphic \n\nfiles and CSS\
    \ transitions.\n\nHow is this different from NimbleKit’s library items? Because\
    \ the \n\nNimbleKit framework is designed to serve only iOS devices, it includes\
    \ \n\nprewritten Objective-C modules that call native iOS interface elements \n\
    \nand behaviors. This is great if you want to design an iOS app that’s as native\
    \ \n\nas possible; the only emulation of iOS elements are those that you choose\
    \ \n\nto add yourself. (An example is making buttons that are styled with CSS\
    \ to \n\nbe native-looking, which you explored earlier in this book.)\n\n10.2\
    \ The jQTouch \n\nwebsite."
  merge: -1
  pgno: 186
- img_proc: true
  md: "OTHER MOBILE FRAMEWORKS / EMULATING THE IOS EXPERIENCE WITH PHONEGAP AND JQTOUCH\n\
    \n**175**\n\n![](img/4d979018542def8748544c4af0d37f5a_187_0.png)\n\nOn the other\
    \ hand, using jQTouch can lead to some pretty convincing \n\nresults, too, even\
    \ if the styles are only native-looking. Plus, if you want to \n\ndesign a less-native\
    \ interface or behavior, using jQTouch with PhoneGap \n\nshould afford you a wider\
    \ range of possibilities to do so. Again, it’s more of a \n\nblank canvas, just\
    \ as an empty browser window is for a new website design.\n\nIn fact, to make\
    \ this clear, jQTouch includes two predesigned styles for the \n\nplug-in. One\
    \ is called apple, and the other is called jqt. The apple style does \n\nwhat\
    \ you would expect, and the jqt style has a bit more of an Android feel \n\nto\
    \ it.\n\nFor example, here’s a version of the Bill of Rights app demo that you\
    \ \n\nexplored in Chapter 5, designed using PhoneGap and jQTouch with the \n\n\
    style set to apple (**Figure 10.3**).\n\n10.3 The Bill of Rights table view \n\
    \nexample using PhoneGap, jQTouch, \n\nand jQTouch’s apple theme.\n\nIf you refer\
    \ back to Figure 5.3, you will scarcely notice a difference in the \n\ngraphic\
    \ presentation between this native-looking example and the native \n\ninterface\
    \ of the NimbleKit example.\n\nHere’s the same screen using PhoneGap and jQTouch,\
    \ but with the style \n\nset to the jqt theme instead (**Figure 10.4** on the\
    \ next page).\n\n**NOTE ****More about **\n\n**PhoneGap and jQTouch**\n\nIf you\
    \ want to learn \n\nmore about PhoneGap \n\nand jQTouch, I recom-\n\nmend reading\
    \ *Building *\n\n*iPhone Apps with HTML, *\n\n*CSS, and JavaScript* by \n\nJonathan\
    \ Stark.¹ In fact, \n\nJonathan has inher-\n\nited the maintenance \n\nof jQTouch\
    \ from its \n\ndesigner, David Kaneda. \n\nLearn more about \n\nJonathan at his\
    \ website, \n\nwww.jonathanstark.com."
  merge: -1
  pgno: 187
- img_proc: true
  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**176**\n\n![](img/4d979018542def8748544c4af0d37f5a_188_0.png)\n\
    \n10.4 The Bill of Rights table view \n\nexample using PhoneGap, jQTouch, \n\n\
    and jQTouch’s jqt theme.\n\nThis is certainly a cool look. Is it a native iOS\
    \ user interface? No, not \n\nentirely. But not all iOS apps need to stick to\
    \ a strictly native user interface \n\nto be successful.\n\nTo give you an idea\
    \ of how the HTML syntax differs from NimbleKit when \n\nusing PhoneGap, here’s\
    \ the file for the apple-themed example shown in \n\nFigure 10.3:\n\n**<html>**\n\
    \n**<head>**\n\n**<title>Bill of Rights</title>**\n\n**<link rel=”stylesheet”\
    \ href=”jqtouch/jqtouch.css” **\n\n**type=”text/css” media=”screen” title=”no\
    \ title” **\n\n**charset=”utf-8”>**\n\n**<link rel=”stylesheet” href=”themes/apple/theme.**\n\
    \n**css” type=”text/css” media=”screen” title=”no title” **\n\n**charset=”utf-8”>**\n\
    \n**<script type=”text/javascript” src=”phonegap.js” **\n\n**charset=”utf-8”></script>**\n\
    \n**<script type=”text/javascript” src=”jqtouch/jquery.js” **\n\n**charset=”utf-8”></script>**\n\
    \n**<script type=”text/javascript” src=”jqtouch/jqtouch.js” **\n\n**charset=”utf-8”></script>**"
