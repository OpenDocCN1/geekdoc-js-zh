  md: "FUNDAMENTALS OF THE IOS SDK / TESTING AND BUILDING YOUR APP BINARY\n\n**43**\n\
    \n![](img/4d979018542def8748544c4af0d37f5a_55_0.png)\n\n3.13 The Project and \n\
    \nTarget files. (On screen, \n\nthese will be shown \n\nselected in blue.)\n\n\
    When you do this, you’ll get a large Project Info window with four tabs: \n\n\
    General, Build, Configurations, and Comments. There are a ton of settings \n\n\
    in these tabs but, fortunately, there are very few that you need to under-\n\n\
    stand or change. The settings for our current purposes are found under the \n\n\
    Build tab (**Figure 3.14**):\n\nr Configuration: set to Debug\n\nr Base SDK: set\
    \ to the most current SDK (iPhone Simulator 4 in this \n\nexample)\n\nr Code Signing\
    \ Identity: set to any iPhone device on the left and Auto-\n\nmatic Profile Selector\
    \ | iPhone Developer on the right\n\nr Based On: set to NKit\n\n![](img/4d979018542def8748544c4af0d37f5a_55_1.png)\n\
    \n3.14 The Build tab of the \n\nProject Info window."
