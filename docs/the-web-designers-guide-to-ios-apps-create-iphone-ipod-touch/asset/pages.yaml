  md: "PROVISIONING AND DISTRIBUTING YOUR APPS / ADDING AND MANAGING APPLICATIONS\n\
    \n**219**\n\nuploaded screenshots with it included and that’s not the end of the\
    \ world. \n\nJust realize that when you do this, the second dimension is larger\
    \ than \n\nshown in Table 12.1 (e.g., iPhone portrait: 320 × 480 pixels).\n\n\
    Also, both portrait and landscape screenshots are displayed in the desktop \n\n\
    version of the iTunes App Store on desktop and laptop Macs. To view them \n\n\
    in the App Store on an iPhone or iPod touch, just rotate the device to land-\n\
    \nscape. In other words, they are not resized to display in portrait orientation\
    \ \n\non those devices.\n\nAfter submitting the version information, you get a\
    \ summary screen of \n\nyour information. At this point you can either leave and\
    \ come back, or wait \n\na bit and refresh the view to disclose a blue Ready to\
    \ Load Binary button. \n\nAfter being asked to answer a few questions, you’ll\
    \ be prompted to use \n\nthe Application Loader. If you have downloaded iOS SDK\
    \ 3.2 or later, \n\nyou already have Application Loader stored on your Mac (in\
    \ Developer > \n\nApplications > Utilities). When you run it, you will be prompted\
    \ to Choose \n\nan Application (**Figure 12.16**).\n\n![](img/4d979018542def8748544c4af0d37f5a_231_0.png)\n\
    \nThen you are asked whether you tested and qualified this binary on iOS4 \n\n\
    (if you’re using the current SDK and tested in the iPhone 4 Simulator \n\nand/or\
    \ on an iPhone 4, answer “yes”). Once you select the app binary that \n\nyou built\
    \ in Xcode (it’s in the build > Distribution-iphoneos directory of \n\nyour main\
    \ app file directory, and should be compressed so that it’s in the \n\nformat\
    \ *name*.app.zip), Application Loader will submit it to iTunes Connect \n\nfor\
    \ you.\n\nThat’s it—you’re done! Now all you have to do is keep logging in to\
    \ iTunes \n\nConnect (or check the iTunes App Store) to see when your app is approved\
    \ \n\nand available.\n\n12.16 Using Application \n\nLoader, a small helper \n\n\
    application that is part of the \n\niOS SDK on your Mac."
