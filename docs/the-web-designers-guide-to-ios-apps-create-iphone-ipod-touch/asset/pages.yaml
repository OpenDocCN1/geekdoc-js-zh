  md: "FUNDAMENTALS OF THE IOS SDK / TESTING AND BUILDING YOUR APP BINARY\n\n**41**\n\
    \nThe default view of iPad Simulator is 50 percent. You can change the view \n\
    \nby clicking the Window menu and selecting Scale, where you can then \n\nchoose\
    \ 100 percent.\n\nThe last device you can simulate is iPhone 4, which I’ve saved\
    \ for last \n\nbecause it is the easiest one to do. In fact, you’ve already installed\
    \ your \n\napp on the iPhone 4 Simulator—congratulations! (You did this when you\
    \ \n\ninstalled it on the iPhone Simulator.)\n\nTo view it there, go to the Simulator’s\
    \ Hardware menu, select Device, and \n\nthen select iPhone 4. The Simulator’s\
    \ iPhone screen transforms into the \n\niPhone 4 screen. Another reason I saved\
    \ this for last is that, oddly, the \n\niPhone 4 screen looks a lot more like\
    \ the iPad screen you just saw than it \n\ndoes the iPhone screen. It lacks the\
    \ chrome surround of the actual device. \n\nDon’t fret about this, that’s just\
    \ what Apple did.\n\nIf the white app icon isn’t displaying on the home screen,\
    \ just flick over to \n\nthe second home screen, where it was likely installed.\n\
    \nSo congratulations again—now you can test apps on three devices in the \n\n\
    Simulator! But testing there is never enough. Once you’ve designed an app \n\n\
    of your own for distribution or sale, you need to test it on at least one actual\
    \ \n\niPhone, iPod touch, or iPad (and preferably more than one)—not just for\
    \ \n\nextra quality assurance and control, but in some cases what you’re testing\
    \ \n\ncan’t fully function in Simulator. An example of this is an application\
    \ with a \n\nmap link that opens in the Maps application; there is no Maps app\
    \ in Simu-\n\nlator, so testing that function on an iPhone is the only alternative.\n\
    \n**Provisioning and testing on a device (debugging)**\n\nThe first steps to creating\
    \ the app binary for testing on a device are obtain-\n\ning developer and provisioning\
    \ certificates from the iOS Provisioning Por-\n\ntal, a section of developer.apple.com.\
    \ This requires you to be a paid member \n\nof the iOS Developer Program (remember,\
    \ it has an annual cost of $99), \n\nso I’ve put that section in the last chapter\
    \ of this book because I wouldn’t \n\nanticipate you taking this step until you’ve\
    \ honed your app design skills. \n\nWhenever you decide to take that step, follow\
    \ the directions in Chapter 12 \n\nand then return here to proceed with testing\
    \ an app on a device.\n\nAfter obtaining and installing your developer and provisioning\
    \ certificate, \n\nyou need to verify that Xcode has assigned the correct values\
    \ to the app’s"
  merge: -1
