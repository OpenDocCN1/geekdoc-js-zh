    \n**tableView.insertRecord(“****Bacon****”, “”, “”, “****0****”, “”, **\n\n**“****navController.gotoPage(‘2.html’)****”);**\n\
    \n**tableView.insertRecord(“****Cardamom****”, “”, “”, “****0****”, “”, **\n\n\
    **“****navController.gotoPage(‘3.html’)****”);**\n\n**tableView.insertRecord(“****Daikon****”,\
