  md: "THE WEB DESIGNER’S GUIDE TO IOS APPS\n\n**108**\n\n![](img/4d979018542def8748544c4af0d37f5a_120_0.png)\n\
    \nThe results look like what is shown in **Figure 6.2**.\n\n6.2 The embedded Google\
    \ map view \n\nwith a link to Maps, this time styled with \n\na custom button.\n\
    \n**iPad considerations**\n\nThis last example targets the iPad, so it primarily\
    \ changes the math \n\ninvolved in planning the screen real estate. But I’m also\
    \ using it as an \n\nopportunity to change the design slightly. To give this example\
    \ a try, \n\nopen a new NimbleKit project, and choose iPad as the device.\n\n\
    **Planning the screen layout**\n\nStarting with the 768 × 1024 pixel iPad screen,\
    \ let’s begin with the same \n\nUI elements we used in the previous two examples—they’re\
    \ just wider \n\nthis time:\n\nr status bar: 768 × 20 pixels\n\nr title bar: 768\
    \ × 44 pixels\n\nThis leaves us with 960 pixels of height to work with on the\
    \ iPad. That’s a lot \n\nof space, and typically we’re seeing a bit more “app\
    \ chrome” (styled areas \n\nthat frame content or navigation) in iPad designs.\
    \ So let’s set a border area"
  merge: -1
