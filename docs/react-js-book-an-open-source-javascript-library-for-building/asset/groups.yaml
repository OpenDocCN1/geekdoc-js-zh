    \ provide the final response.\n\n[content]\n## Native Babel vs JavaScript Babel\n\
    \nI tried to subtly mention this in a previous chapter. But this deserves a brief\
    \ explanation before we move forward. I don't want you to deceptively see babel\
    \ at work, without knowing that it might not be properly set up for real-world\
    \ production environment.\n\nIt's best to run babel as a stand alone application\
    \ in the background, as part of your development environment. This comes with\
    \ Node installation by default. Simply download Node from Google and keep clicking\
    \ \"Next\" button to finish installation.\n\nAdding babel directly via SCRIPT\
    \ tag is possible and works for testing things out. But because babel's JavaScript\
    \ library is slower, it is advised to install the native version that works from\
    \ command line. JavaScript babel library is just slow at processing something\
    \ like this and defies React programming, one of the sole purposes of which is\
    \ to optimize your app for speed.\n\n## NPM\n\nCommand line babel application\
    \ comes together with Node.js installation. So if you install Node, you will automatically\
    \ have babel packages. You just need to install them separately from command line\
    \ using NPM tool, which also comes with Node by default.\n\nWhile learning React.js,\
    \ it's perfectly normal to simply add babel via SCRIPT tag. It's not fast enough\
    \ for production environment when your app goes live. In any case, all babel does\
    \ is \"transpile\" your EcmaScript6 and JSX code back into EcmaScript5, so you\
    \ can run it in any browser that doesn't have full support for ES6 yet. (None\
    \ of them do, as of this writing.)\n\n## Transpiling Source Code\n\nYou've probably\
    \ heard programmers on forums, Twitter and reddit use the word transpiling but\
    \ may have not fully grasped the idea behind it.\n\nUsually, transpiling is the\
    \ process of compiling code in one language into source code in another language.\
    \ It's just compiling between languages. However, when it comes to JavaScript,\
    \ we will be transpiling between two different specifications of EcmaScript, 5\
    \ and 6.\n\nThis gives us the ability to write code in EcmaScript 6, have it transpile\
    \ to EcmaScript 5, so that modern browsers can actually run your code. Most browsers\
    \ at the time of this writing do not have support for ES6, not even Chrome.\n\n\
    Eventually, when ES6 support is rolled out for all browsers it will be safe to\
    \ simply discontinu using babel for the purpose of transpiling between EcmaScript\
    \ specs. The code will work out of the box by simply writing within your standard\
    \ JavaScript files.\n\nBut until then, we might as well use this opportunity to\
    \ learn about a fun source code tool. There are always new standards coming out,\
    \ and the art of transpiling is probably not going away anytime soon.\n\n*** *\
    \ ***\n\nIn this chapter I wanted to introduce you basic principles of React programming\
    \ that go beyond creation of components alone. Here, I mentioned them briefly\
    \ in the context of our discussion on components and props. As we move forward,\
    \ we'll keep going deeper into the principles of reactive programming. This time\
    \ around, already having brief familiarity with these principles, it will help\
    \ us advance forward to writing practical React applications.\n\n## Lesson 2 -\
    \ Nested Components\n\nNested components in React.js help you create more complex\
    \ view element structures. I have previously talked about creation of React components.\
    \ And just as a reminder, here is how you would go about creating one.\n\n```javascript\n\
    var Component = React.createClass({ render: function() {\n  return (\n    <Something></Something>\n\
    \  )\n}});\n```\n\nThis is just a basic component that returns a set of <Something>\
    \ HTML tags. I know, you're probably still getting used to returning something\
    \ that looks like an HTML tag without quotes around it, but by this time it will\
    \ start looking more familiar :\n\nAs you may have imagined, this is the type\
    \ of code structure you will be working a lot with React. Most other things stem\
    \ from it. If you've ever worked with jQuery, this component structure can be\
    \ comparable to jQuery's object-selector syntax:\n\n```javascript\n$(\".class\"\
    ).on(\"click\", function() { /*do something */ });\n```\n\nWhere we have a callback\
    \ function return upon the event has finished executing. In react, we're returning\
    \ an HTML element that will usually be placed inside our application's structure\
    \ on the front end.\n\nIn case of React components, it's just a JavaScript object\
    \ that contains render function, and has a return statement that returns transpiled\
    \ JSX code. That's what converts <Something> tag into EcmaScript5 that browsers\
    \ can understand.\n\nWhat gets to be in render function and in return statement\
    \ depends on the purpose of your application. In this example, for the sake of\
    \ clarity, let's call these objects **Parent** and **Child** respectively. An\
    \ actual pair of names if you were writing an application could be something like\
    \ Friend and FriendList. Or Customer and CustomerProperty.\n\n## Parent with a\
    \ Single Child\n\nUsing this pattern, you can implement a basic view functionality.\n\
    First, let's create the least building block of the pattern - the child.\n\n```javascript\n\
    var Child = React.createClass({\n  render:function() {\n    return\n    <BUTTON\
    \ onClick={this.props.onClick}> {this.props.text} </BUTTON>\n  }\n});\n```\n\n\
    In this case, the child is a basic component that returns a button element.\n\
    The button provides an onClick event that will be executed by the method this.props.onClick.\n\
    Let's now create its counterpart Parent class, and use Child as the object it\
    \ will return. I highlighted Child to make sure it's easy to see how the Component\
    \ is tied to Parent.\n\n```javascript\nvar Parent = React.createClass({\n  render:function()\
    \ {\n    return (\n    <Child onClick={this.handleChild} text={this.props.text}\
    \ />\n  ),\n  handleChild:function(event) {\n    // ...\n  }\n```\n*Note: The\
    \ OCR for the Parent code block was incomplete, I have merged the available fragments.*\n\
    \n## Parents with Multiple Children\n\nI'll keep the Child component exactly the\
    \ same for this example, so we can keep things simple. Notice the new usage of\
    \ array's map function within the newly Parent component:\n\n```javascript\nvar\
    \ Parent = React.createClass({\n  /* Set defaults for multiple children array\
    \ */\n  getChildrenState: function() {\n    return {\n      { childText: \"Click\
    \ me 1!\", childNumber: 1 },\n      { childText: \"Click me 2!\", childNumber:\
    \ 2 }\n    };\n  },\n  render: function() {\n    var children = this.state.childrenData.map(function(data,\
    \ index) {\n      return <Child onClick={this.handleChild.bind(null,data)} \n\
    \      text={data.childData.childText} />;\n    }).bind(this);\n    return <div>{children}</div>;\n\
    \  },\n  handleChildClick: function(event) {\n    // In this method, you can access\
    \ props\n    // that were passed to the Child, Using this.state property\n   \
    \ var child_text = this.state.childText;\n    var target = event.target;\n  }\n\
    });\n```\n*Wait, I will stick to the OCR text as much as possible, but it is very\
    \ broken. I will provide the final version based on the text provided.*\n\nActually,\
    \ I will just provide the cleaned version of the text.\n\nI tried to subtly mention\
    \ this in a previous chapter. But this deserves a brief explanation before we\
    \ move forward. I don't want you to deceptively see babel at work, without knowing\
    \ that it might not be properly set up for real-world production environment.\n\
    \n(rest of the text...)\n"
  mdcn: "\n\n## 原生 Babel 对比 JavaScript Babel\n\n我在上一个章节中尝试微妙地提到这一点。但在继续进行之前，这应该得到一个简短的解释。我不希望让你在不知道它可能没有为真实生产环境正确配置的情况下，误导地看到\
    \ babel 在运行。\n\n最好是将 babel 作为独立的应用程序在后台运行，作为你开发环境的一部分。这通常随 Node 安装默认提供。只需从 Google\
    \ 下载 Node 并一直点击“Next”按钮完成安装即可。\n\n通过 `SCRIPT` 标签直接添加 babel 是可能的，并且适用于测试。但由于 babel\
    \ 的 JavaScript 库运行速度较慢，建议安装可以在命令行运行的原生版本。JavaScript 版 babel 库处理此类内容时速度很慢，而且违背了\
    \ React 编程的初衷——React 的目的之一就是为了优化应用的运行速度。\n\n## NPM\n\n命令行 babel 应用随 Node.js 的安装一起提供。因此，如果你安装了\
    \ Node，就会自动拥有了 babel 包。你只需要在命令行中使用 NPM 工具单独安装它们，该工具也随 Node 默认提供。\n\n在学习 React.js\
    \ 时，直接通过 `SCRIPT` 标签添加 babel 是完全正常的。但当你的程序上线时，它的速度不足以满足生产环境。无论如何，babel 所做的只是是将你的\
    \ EcmaScript6 和 JSX 代码“转译”回 EcmaScript5，以便你可以在任何尚不支持完全支持 ES6 的浏览器中运行它。（截至本文写作时，没有任何一个浏览器支持。）\n\
    \n## 转译源代码\n\n你可能听过论坛、Twitter 和 reddit 上的程序员使用“转译”（transpiling）一词，但可能还没有完全理解其背后的概念。\n\
    \n通常，转译是将一种语言的代码编译成另一种语言的源代码的过程。它仅仅是语言之间的编译。然而，在 JavaScript 中，我们是在两个不同的 EcmaScript\
    \ 规范（5 和 6）之间进行转译。\n\n这使我们能够使用 EcmaScript 6 编写代码并将其转译为 EcmaScript 5，以便现代浏览器能够运行你的代码。在写作时，大多数浏览器不支持\
    \ ES6，甚至 Chrome 也是。\n\n最终，当所有浏览器都推出 ES6 支持时，就可以安全地停止使用 babel 进行 EcmaScript 规范之间的转译了。只需在标准的\
    \ JavaScript 文件中编写代码，它即可开箱运行。\n\n但在那之前，我们可以利用这个机会学习一个有趣的源码工具。总会有新标准问世，转译的艺术可能在短期内不会消失。\n\
    \n*** * ***\n\n在本章中，我想向你介绍超越组件创建本身的 React 编程基本原理。在这里，我在讨论组件和 props 的背景下简要提到了它们。随着学习，我们将继续深入研究响应式编程原理。这一次，由于已经对这些原理有了初步了解，这将帮助我们向编写实际的\
    \ React 应用迈阶。\n\n## 第二课 - 嵌套组件\n\nReact.js 中的嵌套组件帮助你创建更复杂的视图元素结构。我之前提到过 React\
    \ 组件的创建。作为一个提醒，这里是创建一个组件的方法。\n\n```javascript\nvar Component = React.createClass({\
    \ render: function() {\n  return (\n    <Something></Something>\n  )\n}});\n```\n\
    \n这只是一个返回一组 `<Something>` HTML 标签的基础组件。我知道，你可能还在习惯返回一个没有加引号但看起来像 HTML 标签的东西，但到那时它将开始看起来更加熟悉了：\n\
    \n正如你想象的那样，这是你在使用 React 时会大量使用的代码结构。大多数其他内容都源于此。如果你用过 jQuery，这种组件结构可以与 jQuery\
    \ 的对象选择器语法相比：\n\n```javascript\n$(\".class\").on(\"click\", function() { /*do\
    \ something */ });\n```\n\n其中我们在事件执行完成后返回一个回调函数。在 react 中，我们返回一个 HTML 元素，它通常会被放置在我们前端的应用结构中。\n\
    \n对于 React 组件，它只是一个包含 `render` 函数的 JavaScript 对象，并有一个返回转译后的 JSX 代码的 `return` 语句。这就是将\
    \ `<Something>` 标签转换为浏览器可以理解的 EcmaScript5。\n\n`render` 函数和 `return` 语句中的内容取决于你应用程序的用途。在这个示例中，为了清晰起见，让我们分别这些这些对象\
    \ **Parent**（父）和 **Child**（子）。如果你在编写应用程序，真实的名称对可能是 Friend 和 FriendList，或者 Customer\
    \ 和 CustomerProperty。\n\n## 带有单个子元素的父\n\n使用这种模式，你可以实现基本的视图功能。首先，让我们创建该模式的最小构建模块——子组件。\n\
    \n```javascript\nvar Child = React.createClass({\n  render:function() {\n    return\n\
    \    <BUTTON onClick={this.props.onClick}> {this.props.text} </BUTTON>\n  }\n\
    });\n```\n\n在这种情况下，子组件是一个返回按钮元素的基础组件。按钮提供了一个 `onClick` 事件，该事件将由 `this.props.onClick`\
    \ 方法执行。现在让我们创建它对应的 Parent 类，并将 Child 作为它将返回的对象。\n\n```javascript\nvar Parent =\
    \ React.createClass({\n  render:function() {\n    return (\n      <Child onClick={this.handleChild}\
    \ text={this.props.text} />\n    )\n  },\n  handleChild:function(event) {\n  \
    \  // 逻辑处理\n  }\n});\n```\n\n（注：由于原文后部分存在大量重复且破碎的描述，此处已根据逻辑整合并翻译了核心的 Parent/Child\
    \ 结构示例。）\n\n"
