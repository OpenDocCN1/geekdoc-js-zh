    5，这样浏览器才能理解它。这意味着浏览器看到的实际代码甚至不是这种形式。这只是为了方便我们在编写应用程序时使用。但是……我们可以完全毫无障碍地以这种格式编写代码。


    这将在本书中贯穿进行讨论。但基本上，这种格式与 React 组件结构是互换的。你本质上创建的实际上是一个有效的 React 组件模式。


    出于这个原因，JSX 经常作为 React 的补充库使用。你可以通过 JSX 来创建上面示例中看到的语句，但这并不是强制要求的，你不使用它也可以。


    然而，如果没有 React，编程就像是吃没有奶士的披萨。两者共同工作以提供美味的体验，即使学习如何烘焙饼饼需要尝试错误和时间。


    - 3. Babel 将将 EcmaScript 6 转译到早期版本（ES5）有一点开销，而且似乎也是多此一。因为像 Chrome 和 Safari 等浏览器最终将对
    ES6 提供完全支持，这个过程终将变得自动。


    Babel 允许我们编写这种代码：


    ```

    import someClass from "someClass.js"

    ```


    这将从定义的 `someClass.js` 文件中获取 `someClass` 类定义。到写此时，Chrome、Firefox 以及其他任何浏览器都不支持
    ES6 import 关键字。


    然而，babel 允许我们现在就开始学习和编写 ES6 代码，即使在现代浏览器尚未推出官方支持之前也是如此。


    在此之前，它只是会在后台将其代码“转译”回 ES5，以便代码可以在今天的任何浏览器中实际运行。


    好消息是，安装 babel 插件会迫使你学习如何使用命令行工具。这是传统的 JavaScript 开发者通常不熟悉的。我想，这正是你本就应该学习的技能。


    使用命令行是专业软件开发环境中的“必修”技能（在你的电脑桌面上某个任意文件夹中的个人项目之外）。而且……如果不采取这一步，它可能是可能阻止你直接深入响应式编程的额外步骤之一。尽管这可能非常麻烦。


    ## 学习 React 的良好理由


    - 1. **它很快。** 这可能是 JavaScript 程序员想要开始使用 React 库编写应用程序的首要原因。通过利用 DOM 的虚拟副本，它旨在要在渲染到标准
    JavaScript DOM 树之前在虚拟执行操作。这不仅仅是一个数字游戏。将 UI 操作移动到**虚拟 DOM** 实际上改变了用户对你应用程序的感受，这是令人惊讶的。你可能已经在
    Netflix 等网络网站上开始注意到这种现象了。


    - 2. **模块化设计。** React 支持模块化设计，这通常与构建大型、可扩展的应用程序相关。此的原因是 2015 年出的 ECMAScript 6
    规范的出现，它提供了倾向于模块化方法的新语法，例如，**require (ES5)** 和 **include (ES6)** 关键字不仅将文件连接在一起，还假定了对象之间基于类的关系。尽管到写此时，`include`
    关键字在现代浏览器（即使是 Chrome）中不被支持，但我们可以通过使用 `require` 或在发送到浏览器进行渲染之前将 ES6 代码转译为 ES5（现在几乎所有浏览器都支持这样做）来开始编写模块化程序。当浏览器赶上时，我们就不再需要转译了。当这种情况发生时，React
    将成为你随处可见的更常见的库。最终，无论是否有 React，模块化的 JavaScript 程序设计将成为规范。


    - 3. **可扩展性。** 在 React 中，每个 HTML 元素都被*视为*可以编程的组件，可以嵌套在其他组件中。子组件通过被称为 props 的东西与父组件关联。React
    程序的的可扩展性通过使每个组件都成为 HTML、CSS 和 JavaScript 代码的集合来实现。


    - 4. **灵活性。** React 不仅仅是一个 UI 视图库，这与你开始了解时可能听到的观点不同。这并不完全错误。React 赋予了我们创建极快速交互组件的能力，这些组件可以作为我们应用程序的元素。然而，React
    利用渲染目标的原理，允许你将代码的结果发送到任何地方，包括但不限于前端视图。


    - 5. **雇主中的流行程度。** React 是由 Facebook 的程序员在多年研究 Web 应用后开发的。或少，它源于一组经过证明的软件工程哲学。尽管许多传统的
    JavaScript 程序员对其中的许多许多点并不熟悉。当你学习 React 时，你是在学习计算机编程原理，而不仅仅是函数和方法的列表，像 jQuery 等其他库就是那样。2016
    年，JavaScript 已成为前端 Web 开发的领先语言。如果你在寻找软件行业的工作，在简历上拥有 React 将让你比竞争对手更具优势。旧金山湾区的平均资深
    JavaScript 程序员年薪为 12-15 万美元。


    ## 响应式编程


    到底什么是响应式编程？React 是一个用 JavaScript 编写的小型但强大的库。你可以通过使用 SCRIPT 标签将其包含在网页中来使用。就像使用任何其他
    JavaScript 库一样，例如 jQuery。


    如果你想为在真正的软件公司工作做准备，仅仅将 React 添加到你的网页是不够的。它要求你理解超出简单 JavaScript 编程的 Web 开发其他领域。本书的设计是为了培养那个过程。


    通过使用 React 组件（本书许多示例中将展示），你将构建整个应用程序。在本书的大部分，我将使用 React 库构建应用程序称为“响应式”编程。


    响应式编程仅仅是一个为了代表构建现代 Web 应用的替代思考方式的术语。响应式编程并不是 React.js 库本身固有的。它是一种方法，而 React.js
    库恰好采用了它作为核心哲学。


    我的意思是，它是那种非常关注程序逻辑功能的编程方法。你可以将其看作是与在 JavaScript 中处理 DOM 相比的更高级的编程形式，在那种形式中，每个视觉元素不仅与事件关联，而且可能包含你编写的自定义程序，以确定它们的功能。


    虽然 React 被认为主要处理应用程序的视图区域，但不要相信 React 严格是你可能熟悉的 MVC（模型-视图-控制器）模式中的“视图”的迷言。如果不熟悉，只需知道模型视图控制器是一种将代码与应用程序的视觉元素分离的编程模式即可。


    我希望你喜欢这本书，学习 React 库并探索现代软件开发所提供的可能性，这将训练你制作现实世界的 Web 应用。


