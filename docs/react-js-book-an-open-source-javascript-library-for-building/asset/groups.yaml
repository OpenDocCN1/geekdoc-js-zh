  - '[PAGE 67]


    type of a function called pure function. In traditional software development a
    pure function is one which does not internally change arguments which are passed
    to it.


    For example,


    ```

    // pure function; does not modify argument values

    function sum(a, b) { return a + b; }

    ```


    This is considered to be a pure function, because its body does not modify any
    of the parameters that were passed as arguments. On the other hand an example
    of an impure function is shown below:


    ```

    // impure function; modifies value of the passed argument "total"

    function sub(total, less) { return total -= less; }

    ```


    In React, props take on the "pure" ideology. This means you can pass them, under
    the condition that your react component will not be changing their values from
    within itself. This is exactly what makes react props read-only. It is good to
    stick to that rule.


