  - '[PAGE 22]


    Then we have props, which are properties you pass to this component. Props are
    not states, but they can modify states. We''ll draw this distinction later in
    more detail.


    Finally, children are just hierarchical elements to be found within its parent
    elements. Create chains of them and type them right into createElement function
    as N-number of arguments at the end.


    Another key that unlocks deeper understanding of React is that all of the code
    above has its equivalents in JSX. The two can be used interchangeably. This is
    the part that is actually exciting, once you truly start understanding how it
    works.


    So, while in ES5, you would createElement function, in JSX (arguably its common
    use is with the rest of ES6 syntax) you could create exactly the same functionality
    by simply writing it out as follows:


    ```

    let link1=<a href="#">Save</a>;

    ```


    Now you see where I am going with this? JSX turns HTML into JavaScript statements.
    Here link1 is object-like representation of the element which is exact equivalent
    to React code we created earlier with createElement method.


    And yes, link1.href will contain "#" by simply declaring it as JSX. Once I realized
    that is how it works JSX started to make a lot more sense and I actually started
    to feel comfortable using it.


    It''s like a two-way road between HTML and JavaScript where attributes automatically
    become properties. And here is the more complex example, this in JSX once again:


    ```

    let nav=<MyNav>

    <a href="#">Save</a>

    <a href="#">Load</a>

    <a href="#">Delete</a>

    ```'
  - '[PAGE 23]


    ```

    <a href="#">

    <span alerts="0">No Alerts</span>

    </a>

    </MyNav>;

    ```


    We have just recreated virtual DOM using JSX language using a single JavaScript
    statement! You can pass the value of nav around as a statement to functions. It''s
    almost like another way of creating a mini DOM structure.


    Now you (hopefully) see that this is the very structure of virtual DOM in React.
    It''s like a secondary DOM we''re going to be working with, changing, modifying,
    editing, deleting and adding children from, etc.


    We will update the actual JavaScript DOM object which is responsible for visible
    elements in our application... but **only when it actually needs updating**. None
    of the DOM operations we''re performing will be associated with spending time
    updating the original DOM. And this is what improves performance of React applications.


    The best thing, React does this for you automatically. As a React programmer,
    you are not required to understand how React does this internally. You just focus
    on design of your application.


    Note, of course you type JSX code directly into your JavaScript application, it
    will not even compile. You must be running JSX processor. To do this you would
    usually initialize it from command line, so it constantly runs in the background.


    Babel is a JSX plugin. I also recommend learning how to make babel watch your
    files. What this means, you can set babel up so that auto-transpiles your .js
    files (and places them into "build" or "production" directory) automatically,
    as soon as the file changes. This babel functionality is called "**watch**. It
    must be enabled. I explain how to do this on Windows PC in my video tutorial:


    React Tutorial on YouTube that helps you set up your development'
