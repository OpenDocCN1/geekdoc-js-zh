    # Gems


    In this section I will present several "gems" that expand on reactive programming
    with a few explanations of important principles. Each gem is a focused discussion
    on a particular subject.'
  - '[PAGE 34]


    # Gem 1 - React Components


    Components are the building blocks of React applications.


    Because React is primarily used with the application view (the interactive User
    Interface dynamics) in mind, React components can be thought of as visual blocks
    that your web application is composed of. React treats each component as a reusable
    template.


    In React, each component is a bundle of HTML, CSS and JavaScript code which identifies
    one particular block of your application.


    For example, here is my Twitter page @gregsidelnikov looked at from the vantage
    point of React components.


    Programmatically, React components follow in the foot tracks of nested HTML tags.
    They have parent and children, and the parent can also be a child of another component
    up the hierarchy chain.'
  - '[PAGE 35]


    ![](img/05b8b68e82424c98c0b61100a18147b2_35_0.png)


    parent component


    nested components


    Think of component design as the blueprint of your entire application. Before
    you start writing the first line of code in your reactive application, it''s a
    great idea to map it all out on a piece of paper. It''s just an intuitive way
    of thinking about your page design as a web application with unique elements.


    And just like the first time you were learning about regular DOM back in the day
    and realizing that each HTML element (such as P, DIV, TABLE and others) is actually
    an object in a long tree-like chain of the Object Model, think of react components
    as visual areas that are also tied to some sort of software function. This time,
    this functionality will be'
  - '[PAGE 36]


    custom-determined by you and the requirements of your application.


    From these fundamentally basic principles of React, you can now see why Facebook
    and Instagram love using it. It''s lightning-fast, it helps break down feed-like
    elements into software blocks composed of components which are just bundles of
    CSS, HTML and JavaScript code. This design model is a lot more in touch with app-like
    behavior rather than just informational websites that use table-like layouts.


    Components are hierarchical. They can be children of other components. For the
    most part, components are tailored for reuse in your application. They contain
    patterns of code that can be adapted to a wide variety of cases. React code usually
    follows a pattern of creating chains of these components that work one within
    another, while retaining fast rendering speed and flexibility.'
  - '[PAGE 37]


    # Gem 2 - Render Method


    Chances are that to some degree, you''ve already split up your app into compartments
    when you were building regular HTML-JavaScript applications. Then, you used Ajax
    events to populate each view separately, based on what type of data changed in
    each HTML cell.


    But React takes this approach one step further by requiring render() method. The
    render method must be attached to each React component you create. There is no
    way around it. It''s part of the pattern that React components demand that is
    being used.


    Even though React is so much more than the view layer - making the render method
    explicit to programming with React, the reason why React is often considered to
    be primarily a view-based library. We will see this is true throughout the book,
    but also why this isn''t entirely true.


    This isn''t fair to say that React programming is necessarily view-only programming.
    In fact, the choice of render targets tells us the opposite. React is a programming
    pattern that follows fundamental philosophy that actually doesn''t require a view.


    You can render results of a react component either to a browser or to a string
    of text (using a method made just for that, called React.render() JSON object
    or anywhere you wish. In this case rendering isn''t rendering at all. Because
    the word render implies visualization of data. So React is more like a set of
    principles, rather than "a way to make User Interfaces" as many beginners tend
    to believe before brief familiarity with the library.


    While you can use any third party library in addition to React, for example database
    IO libraries, React still offers a lot in the way of custom programming that goes
    behind the view elements. In fact, it demands that you understand how these programming
    principles work.'
  - '[PAGE 38]


    The method render() which is usually attached to the React''s own "virtual" DOM
    is the method that will be executed when your application is loaded into the browser
    for the first time. And consequently, only when the data in the element it represents
    should be updated. However, this is where it gets interesting. Until the render
    method is called, the react''s component isn''t even "mounted" to the actually
    JavaScript DOM, nor will it be displayed. And it''s possible to create React components
    without mounting them. We''ll cover mounting in greater detail in Gem 6.


    We know that render triggers an update of the data set (or state of the component).
    But when should the data be updated? This will depend on the type of data shown
    in your components but also a few generic function that are responsible for updating
    it at **key times** while it''s being used. Later in the book we''ll get to the
    functions responsible for giving us control over these events.


    In a real scenario, the elements themselves could be an alert icon notifying the
    end-user of an increase in number of incoming alerts, the number of profile followers
    or profile views.'
- md: "\n# Gem 3 - Virtual DOM and Bandwidth Salvation\n\nReact makes us think thoroughly\
    \ about each element will represent, because each component is tied to some sort\
    \ of software function that will, in real time, update the data in each component\
    \ without updating the entire layout. And in React this process is made more efficient\
    \ in comparison to traditional applications. You don't have to reload the entire\
    \ page on regular HTML websites.\n\nThis makes your application feel different,\
    \ and it saves bandwidth. If you think about it, the non-reactive websites we've\
    \ been building until 2017 is really just a lazy man's design idea. Reloading\
    \ everything to see if there is a new alert isn't exactly the best application\
    \ design. Yet, this is websites like Facebook have been working all of this time.\
    \ And by bit by bit, it is starting to change. This is why we are moving toward\
    \ reactive implementations.\n\nBut Reactive programming isn't just a bunch of\
    \ AJAX calls that pull the data and replace an HTML element. It's much more sophisticated.\n\
    \nAnd because fast access to only relevant components is usually the key to good\
    \ application design is where Virtual DOM comes in. Virtual DOM is really a quirky\
    \ way to provide a fast way of modifying the DOM, while abandoning slower old-fashioned\
    \ alternatives.\n\nThe Virtual DOM hands down one of the greatest advantages of\
    \ choosing to write your application with the React library. In fact, when you\
    \ add react library to your web project, it behooves you to also add react.dom\
    \ library. The two are inseparable. And all reactive JavaScript applications by\
    \ default also include React DOM.\n\nThis is where React's Virtual DOM makes a\
    \ big difference on the usability of your application. It's what allows websites\
    \ to have native application feel, where each element responds instantly to a\
    \ touch event.\n\nYou've probably seen this starting to happen throughout the\
    \ internet on sites like Netflix, Facebook and Instagram. You can actually feel\
    \ the difference. Where actions happen instantly, seemingly without having to\
    \ wait for HTTP requests to load first every time you press a button.\n\nThe application\
    \ responds instantly. React doesn't eliminate HTTP bandwidth, it just minimizes\
    \ and focuses on whether the data really should be transferred or not just because\
    \ of a button click event, for example.\n\nOf course sites like Netflix and Amazon\
    \ preload some of the data (first 15 seconds of a movie trailer, for example)\
    \ regardless of whether the user clicks on the play button or not. But together\
    \ with other \"reactive\" principles it makes a big difference on UI responsiveness.\n\
    \nWe're still building the app from familiar HTML elements, but the response rate\
    \ to each event is brought about by a DOM that is significantly faster than even\
    \ jQuery's implementation.\n\nThere is nothing special you have to do in order\
    \ to start using virtual DOM. By utilizing React component templating pattern,\
    \ you're automatically using react's own virtual DOM traversal. It transparently\
    \ imitates standard DOM model by providing camel-case (like className and fontFamily)\
    \ methods and properties matching the names that we're already familiar with.\n\
    \n# Gem 4 - Two Distinct Ways of Initializing a React Class\n\nAs of the time\
    \ this book is being written, the web is still somewhat transitioning from EcmaScript5\
    \ to EcmaScript6. When EcmaScript 2015 (ES6) came out about two years ago, it\
    \ caused a lot of turbulence in the JavaScript world. And divided programmers\
    \ into \"the old way\" and the \"new way\" categories. Some prefer to use one\
    \ style over the other based on the circumstance without any problem. Neither\
    \ one is better or worse.\n\nHowever, in the end ES5 and ES6 are executing exactly\
    \ the same code. Most of the difference is syntactic. Surely working in two different\
    \ languages at the same time might create unnecessary headaches, especially when\
    \ learning React for the first time.\n\nThere simply isn't \"one standard way\"\
    \ of doing anything in a loosely typed language as JavaScript. This has always\
    \ been the case.\n\nIt is extremely important to make this distinction, when it\
    \ comes to creating React components. There isn't one way of doing it.\n\nIn this\
    \ gem, I will demonstrate creation of two exactly the same React components in\
    \ two different ways. The difference here, is the difference between EcmaScript5\
    \ and EcmaScript6 itself.\n\nFor the most part, one significant difference is\
    \ in the usage of constructor (ES6) and a specialized init state function method\
    \ (ES5). Let's take a look.\n\nEcmaScript5 example looks as follows:\n\n```javascript\n\
    var NewComponent = React.createClass({\n  getInitialState() {\n    return {/*\
    \ initial state */ };\n  }\n});\n```\n\nNotice that in EcmaScript5 the constructor\
    \ keyword does not exist. And this is why in this case React provides getInitialState\
    \ function. If you are writing your app in ES5, you should use this method to\
    \ initialize default state of your component.\n\nWe'll get states in just a moment.\
    \ Because it's such an important subject. States are tied to react components.\
    \ You should draw a mental association between the component and its state while\
    \ planning your application. Each component is responsible for having a state.\n\
    \nAbove we demonstrated ES5 syntax. I won't tell you which one of the you should\
    \ use.\n\nEventually ES6 is going to become the newly adopted standard within\
    \ a few years, but many programmers still prefer ES5 formatting. But still work\
    \ as JavaScript supports ES5 as a subset of ES6 for compatibility with future\
    \ applications.\n\nIf this works for you, use EcmaScript6 as demonstrated below,\
    \ now using the new keys not available in ES5: class, extends, super and constructor:\n\
    \n```javascript\nclass NewComponent extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = { /* initial state */ };\n  }\n}\n```\n\
    \nIt's same thing, except using ES6 syntax. It's same thing, except using ES6\
    \ syntax. The Virtual DOM hands down one of the greatest advantages of choosing\
    \ to write your application with the React library. In fact, when you add react\
    \ library to your web project, it behooves you to also add react.dom library.\
    \ The two are inseparable. And all reactive JavaScript applications by default\
    \ also include React DOM.\n\nThis is where React's Virtual DOM makes a big difference\
    \ on the usability of your application. It's what allows websites to have native\
