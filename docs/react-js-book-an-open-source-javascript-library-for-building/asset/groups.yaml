- md: "\n# What are Arrow Functions in JavaScript?\n\nAnd what is the difference between\
    \ an arrow function and anonymous functions in JavaScript?\n\nAn arrow function\
    \ in JavaScript is an anonymous function with shortened syntax. The only two differences\
    \ vs standard anonymous function is in syntax and how this object is treated within\
    \ its scope. A small detail, which changes in how the two actually operate when\
    \ it comes to binding of this object.\n\nLet's compare a regular JavaScript anonymous\
    \ function with an arrow function equivalent. We already know what anonymous functions\
    \ like `function(){...}` in JavaScript look like. But arrow functions actually\
    \ have a distinct syntax.\n\nNotice that both exactly do the same thing, execute\
    \ some code. Except arrow functions automatically take care of the cumbersome/that\
    \ juggling we have just experienced in the previous examples. Arrow functions\
    \ create their own `this` object that doesn't change. So we never have to rename\
    \ or bind it to another variable as that, like in previous example.\n\nThis is\
    \ the new syntax in ECMScript 6 that defines new arrow function in JavaScript:\n\
    \n```javascript\n() => {};\n```\n\nA word of caution. Arrow functions in JavaScript\
    \ do not work with \"new\" operator. They are anonymous and are usually used for\
    \ events.\n\nBut there also exist syntactic variations:\n\n```javascript\n(a,\
    \ b) => { ... } // Multiple parameters\na => { ... } // Single parameter\n```\n\
    \nNote that params can include a set of multiple parameters separated by comma,\
    \ in which case you must always use parenthesis. For single parameter syntax,\
    \ you don't have to use parenthesis.\n\nIn a real world-scenario we can also assign\
    \ arrow functions to a variable name. In this case the anonymous arrow function\
    \ becomes named. The function returns the result from within its body's scope.\n\
    \n```javascript\nvar add = (a, b) => { return a + b; }\n```\n\nHaving said that...\n\
    \n```javascript\nadd(1, 2); // returns 3\n```\n\nBut there is another, scope-less\
    \ variation syntax for defining arrow functions:\n\n```javascript\nvar add = (a,\
    \ b) => a + b;\n```\n\nNotice the return value here is represented by a regular\
    \ JavaScript statement.\n\nThis will produce exactly the same result. We removed\
    \ return statement. The function will still return the value of a + b. In this\
    \ case a + b is a JavaScript statement, without a scope body. By default, an arrow\
    \ function specified returns the value of the statement even if return keyword\
    \ is not specified.\n\nAnd finally let's put it all together and rewrite our original\
    \ example of the Sprite object. Only now using an arrow function. You can see\
    \ that there is no necessity to create and set binding of this to that variable\
    \ name. Arrow functions take care of that for you, us!\n\n```javascript\n/* A\
    \ significantly simplified Sprite object in JavaScript */\nvar Sprite = function()\n\
    {\n  this.angle = 5;\n  this.draw = function() {\n    alert(this.angle); // display\
    \ sprite's angle\n  }\n\nvar timer = setTimeout(() =>\n{\n// note the use of arrow\
    \ function here\nalert(this.angle); // display \"5\" using \"this\", not \"that\"\
    .\n}\n\nvar ship = new Sprite(); // instantiate ship\n\n// ship.draw(); draw the\
    \ ship with this.angle rotation angle\n```\n\nWe simply switched standard anonymous\
    \ function `function(){...}` commonly used as the event handler.\n\nAnd replaced\
    \ it with arrow function `() => {...}`\n\nFrom that moment on this keyword within\
    \ the new anonymous event function started to correctly refer to this keyword\
    \ from the original Sprite object. Without having to write any extra binding code.\n\
    \nAnd so... I think this concludes our discussion of arrow functions. I hope you\
    \ enjoyed this tutorial. Please share it with your friends, on Twitter or on your\
    \ Facebook page.\n\nDeveloper Post is a small website dedicated to simple explanations\
    \ of subjects that otherwise appear complex. And hopefully this helps someone\
    \ out there write better JavaScript code.\n\nIf you want to learn more about ES6\
    \ Harmony, head to What's new in ECMScript 6 aka Harmony (opens new tab) to get\
    \ familiar with the basics.\n\nAccording to this Sitepoint article, arrow functions\
    \ are the most favorite feature in ES6.\n\nThis Mozilla arrow function tutorial\
    \ helped me become familiar with arrow functions. I used it as my first reference\
    \ while writing this article.\n\n# Immediately Invoked Arrow Functions (IIAF)\n\
    \nIf you are familiar with jQuery or JavaScript plugin development, you've probably\
    \ indirectly come across IIAF's and have already seen the often obscure syntax\
    \ of Immediately Invoked Function Expressions (IIFEs) that looks like this:\n\n\
    ```javascript\nfunction () { ... }();\n```\n\nHere we execute the function at\
    \ the moment of its definition.\n\nYou will find this syntax used often at the\
    \ bottom of the HTML page just above the closing body tag. This technique is used\
    \ to wait until the HTML elements have finished loading until starting to execute\
    \ JavaScript.\n\nIn the same way, arrow functions can be used to achieve equivalent\
    \ result.\n\n```javascript\n() => { ... }();\n```\n\nThis syntax is referred to\
    \ as Immediately Invoked Arrow Functions. The parentheses surrounding it make\
    \ the function execute at that place in your program's execution flow.\n\n# Backtick\
    \ (``) Template Strings\n\nBacktick is just another name for the quirky quote\
    \ character, also known as grave accent.\n\nStatements like `${ expression }`\
    \ can now be interpolated by using backtick template strings. It's simply a string\
    \ surrounded by the third set (after single and double quotes) of quotes located\
    \ just to the left of \"1\" key on your keyboard.\n\nOne of the best things about\
    \ backicked strings is that they can be split over multiple lines. A much needed\
    \ feature that was lacking in JavaScript.\n\nThese types of strings are also called\
    \ template literals. Below several examples are shown:\n\n`string text`\n`string\
    \ text on line`\n`string text`\n\n`string text`\njust like regular quotes,\n`string\
    \ text`\n\n`string text`\nthe following are:\n`string text`\n\n# New Array methods\n\
    \nIn ES6, we have these new array methods:\nLet's define our common Array as:\n\
    \n```javascript\nlet arr = new Array();\n```\n\n# find\n\n```javascript\narr.find(callback[,\
    \ thisArg]);\n```\n\nReturns the value of the first item which, when passed to\
    \ callback, produces a \"truthy\" value.\n\n# findIndex\n\n```javascript\narr.findIndex(callback[,\
    \ thisArg]);\n```\n\nThe findIndex method is exactly the same as find. The difference\
    \ is that it will return the index of the first item which produces a \"truthy\"\
    \ value, not the value.\n\n# fill\n\n```javascript\narr.fill(value[, start = 0,\
    \ end = this.length]);\n```\n\nBy default start is 0 and end is the length of\
    \ the array.\n\n# copyWithin\n\nThis new array copies a sequence of items **within\
