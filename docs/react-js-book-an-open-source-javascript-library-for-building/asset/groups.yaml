    \ will be normally supported in all modern browsers such as Chrome, Firefox and\
    \ Safari without having to transpile the code by using additional tools.\n\nThe\
    \ rest of the book will deal with going over some of the most important changes\
    \ to JavaScript language that were applied in JavaScript 6.\n\n# EcmaScript 6\
    \ - Things You Need to Know\n\nWhen React was created, it started out when ES5\
    \ specification was in the spotlight. It was still new and fresh in 2015 and even\
    \ throughout 2016.\n\nHowever, by 2017 it started to progressively adapt to ES6\
    \ syntax. And this is why it's important to talk about the significant changes\
    \ that were applied to this new standard while studying React.\n\nWhen you are\
    \ learning React, you are learning a lot more than just React. It works in ES5\
    \ just fine, but that syntax is becoming outdated. And this is where many programmers\
    \ can get puzzled, because essentially the same library might not look the same\
    \ in all the different examples you're seeing on the Internet and in books.\n\n\
    If you don't know React, chances you probably don't know much about EcmaScript\
    \ 6 at all. I know this is a dangerous assumption to make, but I think it can\
    \ be justified by things you will learn in this chapter.\n\nThere really isn't\
    \ anything wrong with ES5. But it isn't going away anytime soon. And I think when\
    \ writing educational books at a time when the industry is still transitioning\
    \ from one specification into another it's important to occasionally juggle between\
    \ the two.\n\nBut we've come to a place of the book where we will now investigate\
    \ the primary differences and additions to JavaScript in EcmaScript 6 specification.\
    \ At the end of the book I will also provide cheat sheets for many of the subjects\
    \ discussed here.\n\n# The var and let keywords\n\nIn ES6 it's commonly agreed\
    \ that instead of using var keyword we now use let keyword. There are reasons\
    \ for this, which are described below:\n\n- There is no hoisting when using let\
    \ keyword. If you're familiar with JavaScript's hoisting mechanism, you will spot\
    \ a difference using the new let keyword.\n\nHoisting is when JavaScript moves\
    \ all variable definitions up scope in which they are defined. This little-known\
    \ process is done behind the veil. But it is in fact:\n\n```\n{\nconsole.log(\
    \ a ); // undefined; but only because it is hoisted\nvar a = 1;\n}\n```\n\nAnd\
    \ the let example:\n\n```\n{\nconsole.log( a ); // ReferenceError: \"a\" is not\
    \ defined at all\nlet a = 1;\n}\n```\n\nIn the example above the resulting out\
    \ of console when making an attempt to print out value of a variable is undefined.\
    \ In first case, it's because while the variable is hoisted. But in the second\
    \ example, it is not.\n\n- In global scope. The let keyword and the old var keyword\
    \ are still scoped to the global scope. But the let keyword is not attached to\
    \ the global window object:\n\n```\nvar a = 1; // will be attached to global window\
    \ object\nlet b = 1; // will not be attached to global window object\nconsole.log(window.a);\
    \ // 1\nconsole.log(window.b); // undefined\n```\n\n- In function scope. The **let**\
    \ and **var** keyword are still identical within function scope:\n\n```javascript\n\
    function helloThere() {\nlet x = 1; // identical scoping\nvar y = 1; // identical\
    \ scoping\n}\n```\n\n- In statements. The **let** keyword is only visible inside\
    \ for-loop while **var** is visible to entire function's scope. So, the **let**\
    \ keyword limits visibility of variables defined within **closest enclosing block**\
    \ specified by { and } brackets. Below, let's first take a look at how **var**\
    \ traditionally handles scope:\n\n```javascript\n// var inside a function and\
    \ for-loop example\nfunction helloThereIterator() {\n// i is theoretically visible\
    \ here too.\nfor (var i = 0; i < 10; i++) {\n// i is visible here.\n}\n```\n\n\
    Perhaps this is not the best example of var keyword (because the for loop is initially\
    \ defined) while it is available everywhere in the function. But it still demonstrates\
    \ the principle.\n\nTraditionally, var is known to exist for access within the\
    \ brackets { } of a function and hidden from function's scope but unless it is\
    \ the window object. This is the basic rule. But JavaScript is complicated like\
    \ that... and if the variable is not found within the function itself, only then\
    \ the window object is checked, which is outside of the function.\n\nIt is your\
    \ responsibility as a programmer to determine whether that variable should or\
    \ should not be available from the global scope. This is an example of where JavaScript\
    \ tries to be \"everything for everyone.\"\n\nWhile this looseness is helpful\
    \ in many cases and makes the learning curve almost non existent, in the long\
    \ run you will bump into these weird cases, especially when your program reaches\
    \ certain length in large projects.\n\nSo now, let's take a look at the same example.\
    \ The only thing we did was swap the var over with let keyword. This produces\
    \ different scoping expectations.\n\n```javascript\n// let example\nfunction helloThereIterator()\
    \ {\n  // i is not visible here\n  for (let i = 0; i < 10; i++) {\n    // i is\
    \ visible here, and in callbacks within this scope itself\n  }\n}\n```\n\n- Redeclaration\
    \ is not allowed with let\n\nThis doesn't solve any major problems but it certainly\
    \ helps us get things done in a more intuitive way, especially when dealing with\
    \ the web of multiple scopes in our script's program structure. (Wait, the OCR\
