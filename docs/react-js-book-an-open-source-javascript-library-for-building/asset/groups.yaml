    \ \"my-list\"：\n\n```javascript\nvar root = React.createElement('ul', {\n  className:\
    \ 'my-list',\n}child);\n```\n\n在 JSX 中使用 `className` 的原因是因为这是原始 JavaScript DOM\
    \ 的属性名。例如：\n\n```javascript\nvar cn = document.getElementById(\"my_id\").style.className;\n\
    ```\n\n这是因为认为 JSX 限制了 JavaScript 保留关键字的使用。虽然这是一个相当真实的评估，但问题源于 JSON 表示法，而不是 JSX。\n\
    \nJSX 仅仅将 HTML 语法转换回 JavaScript。初看这可能很奇怪，但 JavaScript 现在有了自己的内部 HTML 处理器。这种思考方式是熟悉\
    \ JSX 的一个良好起点。随着我们在书中不断进行，我们将作为源码示例的一部分更深入地探讨它。\n\n虽然很有诱惑，但完全理解 JSX 是如何做到的完全没。它在内部处理这些，并帮助我们专注于编写代码。它是\
    \ XML 的派生品，而不是 HTML，因为 XML 更严格。这意味着它更适合设计库。但主要是因为它更容易解析和理解。\n\n恭喜你创建了第一个 React\
    \ 组件！我想要保持简单，不让你被过多的东西淹没。在 React 中，将 HTML 写入 JavaScript 是通过安装 JSX 插件实现的。是的，这一功能通过\
    \ node.js 启用。你可以通过以下官方 GitHub 仓库查看 JSX 源码：\n\n**https://github.com/jsx/JSX**\n"
