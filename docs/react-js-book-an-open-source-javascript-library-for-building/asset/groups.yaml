    reactive\" principles it makes a big difference on UI responsiveness.\n\nWe're\
    \ still building the app from familiar HTML elements, but the response rate to\
    \ each event is brought about by a DOM that is significantly faster than even\
    \ jQuery's implementation.\n\nThere is nothing special you have to do in order\
    \ to start using virtual DOM. By utilizing React component templating pattern,\
    \ you're automatically using react's own virtual DOM traversal. It transparently\
    \ imitates standard DOM model by providing camel-case (like className and fontFamily)\
    \ methods and properties matching the names that we're already familiar with.\n\
    \n# Gem 4 - Two Distinct Ways of Initializing a React Class\n\nAs of the time\
    \ this book is being written, the web is still somewhat transitioning from EcmaScript5\
    \ to EcmaScript6. When EcmaScript 2015 (ES6) came out about two years ago, it\
    \ caused a lot of turbulence in the JavaScript world. And divided programmers\
    \ into \"the old way\" and the \"new way\" categories. Some prefer to use one\
    \ style over the other based on the circumstance without any problem. Neither\
    \ one is better or worse.\n\nHowever, in the end ES5 and ES6 are executing exactly\
    \ the same code. Most of the difference is syntactic. Surely working in two different\
    \ languages at the same time might create unnecessary headaches, especially when\
    \ learning React for the first time.\n\nThere simply isn't \"one standard way\"\
    \ of doing anything in a loosely typed language as JavaScript. This has always\
    \ been the case.\n\nIt is extremely important to make this distinction, when it\
    \ comes to creating React components. There isn't one way of doing it.\n\nIn this\
    \ gem, I will demonstrate creation of two exactly the same React components in\
    \ two different ways. The difference here, is the difference between EcmaScript5\
    \ and EcmaScript6 itself.\n\nFor the most part, one significant difference is\
    \ in the usage of constructor (ES6) and a specialized init state function method\
    \ (ES5). Let's take a look.\n\nEcmaScript5 example looks as follows:\n\n```javascript\n\
    var NewComponent = React.createClass({\n  getInitialState() {\n    return {/*\
    \ initial state */ };\n  }\n});\n```\n\nNotice that in EcmaScript5 the constructor\
    \ keyword does not exist. And this is why in this case React provides getInitialState\
    \ function. If you are writing your app in ES5, you should use this method to\
    \ initialize default state of your component.\n\nWe'll get states in just a moment.\
    \ Because it's such an important subject. States are tied to react components.\
    \ You should draw a mental association between the component and its state while\
    \ planning your application. Each component is responsible for having a state.\n\
    \nAbove we demonstrated ES5 syntax. I won't tell you which one of the you should\
    \ use.\n\nEventually ES6 is going to become the newly adopted standard within\
    \ a few years, but many programmers still prefer ES5 formatting. But still work\
    \ as JavaScript supports ES5 as a subset of ES6 for compatibility with future\
    \ applications.\n\nIf this works for you, use EcmaScript6 as demonstrated below,\
    \ now using the new keys not available in ES5: class, extends, super and constructor:\n\
    \n```javascript\nclass NewComponent extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n    this.state = { /* initial state */ };\n  }\n}\n```\n\
    \nIt's same thing, except using ES6 syntax.\n\n# Gem 5 - States & Life Cycles\n\
    \nIn React, each component has a state. A state is an object with values. A state\
    \ is exactly what it sounds like. It's the state of that component in terms of\
    \ one or more flags, parameters and settings usually specified by numerics, booleans,\
    \ arrays or maps.\n\nThe Life Cycle of a React component has a lot to do with\
    \ states. And React provides several default methods that help us write helper\
    \ applications. These methods are briefly outlined below.\n\nEach component will\
