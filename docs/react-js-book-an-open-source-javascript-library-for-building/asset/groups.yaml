    \n让我们比较一下普通的 JavaScript 匿名函数与其对应的箭头函数。我们已经知道 JavaScript 中像 `function(){...}` 这样的匿名函数是什么样子的。但箭头函数实际上有独特的语法。\n\
    \n注意，两者的功能完全相同，都是执行某些代码。不同之处在于箭头函数会自动处理我们在之前的示例中经历过的那些繁琐的切换工作。箭头函数会创建自己的不会改变的\
    \ `this` 对象。因此，我们永远不需要像之前的示例中那样，将其重命名或绑定到另一个变量上。\n\n这是在 ECMAScript 6 (ES6) 中定义\
    \ JavaScript 新型箭头函数的最新语法：\n\n```javascript\n() => {};\n```\n\n请注意。JavaScript 中的箭头函数不能与\
    \ `new` 操作符配合。它们是匿名的，通常用于事件。\n\n但也存在一些语法变体：\n\n```javascript\n(a, b) => { ...\
    \ } // 多参数\na => { ... } // 单参数\n```\n\n注意，参数可以包含一组由逗号分隔的多个参数，在这种情况下你必须始终使用括号。对于单参数语法，不需要使用括号。\n\
    \n在现实场景中，我们也可以将箭头函数赋值给变量名。在这种情况下，匿名箭头函数变成了具名的。函数返回其函数体作用域内的结果。\n\n```javascript\n\
    var add = (a, b) => { return a + b; }\n```\n\n话虽如此……\n\n```javascript\nadd(1,\
