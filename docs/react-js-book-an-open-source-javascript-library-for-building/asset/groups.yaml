  - "[PAGE 69]\n\n```\nfunction Hello(props) {\n  return <H1>Hello, {props.name}</H1>;\n\
    }\n```\n\nWhat makes it a valid React component is the fact that it returns a\
    \ React element. React elements can be rendered on the screen. A lot of your reactive\
    \ code will be returning such statements. It's just a way of bundling HTML elements\
    \ and returning them as if it was a JavaScript value.\n\nThis is a big part of\
    \ React-style programming and it's easy to get used to once you've actually programmed\
    \ a few of them yourself. At first it will feel awkward, but once you get used\
    \ to it you'll really see the versatility of this style of programming.\n\nRemember\
    \ that in JavaScript everything is an object, even functions. This is why components\
    \ like these are called functional components. In a way, it's really just a different\
    \ way of thinking about JavaScript functions.\n\nThis is a valid way to define\
    \ a React component using EcmaScript5 specification, not ES6 like in the previous\
    \ example above. However, both are equivalent from the point of view of writing\
    \ reactive applications.\n\nIt's up to you the programmer to know the differences\
    \ between ES5 and ES6, which can take a whole book of its own to justify righteousness.\
    \ However, throughout the tutorials in this book, I'll try to use every opportunity\
    \ to explain the differences between the two.\n\nWhat's more, let's take a look\
    \ at a piece of code that accomplishes exactly the same thing of defining a component\
    \ only this time using syntax of EcmaScript6 specification:\n\n```\nclass Hello\
