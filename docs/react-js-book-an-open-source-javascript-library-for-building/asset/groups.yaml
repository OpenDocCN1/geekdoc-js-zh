  mdcn: "\n\n# Gem 3 - 虚拟 DOM 与带宽救星\n\nReact 让我们深入思考每个元素将代表的内容，因为每个组件都与某种软件函数绑定，该函数会实时更新每个组件中的数据，而无需更新整个布局布局。在\
    \ React 中，这个过程与传统应用程序相比更加高效。你不需要在普通的 HTML 网站上重新加载整个页面。\n\n这让你的应用程序感觉与众，并节省了带宽。如果你想想，我们在\
    \ 2017 年之前一直在构建的非响应式网站其实只是一个懒人的设计理念。为了查看是否有新提醒而重新加载所有内容，并不是最好的应用设计。然而，像 Facebook\
    \ 这样的网站一直以来都在做这些。而且通过一点一的改进，它开始发生变化。这就是为什么我们正在向响应式实现过渡。\n\n但响应式编程不仅仅是一堆用于获取数据并替换\
    \ HTML 元素的 AJAX 调用。它要复杂得多。\n\n正因为快速访问相关组件通常是良好应用程序设计的关键，这就是虚拟 DOM（Virtual DOM）大显身场的地方。虚拟\
    \ DOM 是一种独特的方式，提供了一种快速修改 DOM 的方法，同时放弃了速度较慢的旧替代方案。\n\n虚拟 DOM 无疑是选择 React 库编写应用程序的巨大优势之一。事实上，当你向\
    \ Web 项目中添加 react 库时，你也有必要添加 react.dom 库。两者是不可分割的。而且所有的响应式 JavaScript 应用程序默认都包含了\
