    valid JavaScript statement we can toss around does all the dirty work for us behind
    the scenes. In reality, this type of code is "transpiled" from XML(that looks
    like HTML) to EcmaScript 5, so browsers can understand it. This means the actual
    code the browsers see not even look this way. This is just for us, while we''re
    programming our app. But... we can write the code in this format without a hitch.


    How it is discussed throughout the book. But basically, this format is interchangeable
    with React component structure. What essentially you have just created is actually
    a valid React component pattern.


    For this reason, JSX is often used with React as a supplementary library. You
    can create the same statement we''ve seen in example above, by writing it using
    JSX is not a requirement, and by you can get away without it.


    However without React programming becomes sort of eating a pizza without cheese.
    The two work together to provide a tasty experience, even if it takes trial and
    error and time to learn how to bake the pie.


    - 3. Babel & Transpiling code from EcmaScript 6 to an earlier version (ES5) is
    a bit of an overhead and seems like an unnecessary thing to do as well. Because
    eventually browsers like Chrome and Safari will have full support for ES6 and
    this process will become automatic anyway.


    Babel allows us to write this code:


    ```

    import someClass from "someClass.js"

    ```


    And this will grab someClass class definition from the file someClass.js, where
    it is defined. As of this writing, Chrome, Firefox and none of the other browsers
    support ES6 import keyword.


    However, babel allows us to start learning and writing ES6 code even now, before
    official support is even rolled out in the modern browser.


    Until then it will just "transpile" it back to ES5, behind the scenes, so that
    the code can actually run in any browser today.


    The good news is that installing babel plugins forces you to learn how to use
    the command line tools. Something traditional JavaScript developers are usually
    unfamiliar with. Which, I think the skill you should be learning anyway.


    Using command line is a "must-have" skill in professional software development
    environment (outside of personal projects in some arbitrary folder on your Desktop).
    And... it''s one of those extra steps that might potentially prevent delving directly
    into Reactive programming, if not taken. As much of a hassle as it may be.


    ## Good Reasons for learning React


    - 1. **It''s fast.** This is probably the top reason JavaScript programmers are
    looking to start writing their applications using React library. Utilizing a virtual
    copy of the DOM, it is designed to perform operations virtually before they are
    rendered to the standard JavaScript DOM tree. This isn''t just a numbers game.
    It''s surprising that moving UI operations to **virtual DOM** actually changes
    how your application feels for the end-user. You''ve probably already started
    noticing this phenomenon across the web on websites such as Netflix.


    - 2. **Modular design.** React supports modular design that is often associated
    with building large, scalable applications. The reason for this is the advent
    of ECMAScript 6 specification that came out in 2015 which provides new syntax
    that favors modular methodology, for example the **require (ES5)** and **include
    (ES6)** keywords tie together not only files alone but assume class-based relationship
    between objects. And even though as of this writing include keyword is not supported
    in modern browsers (even Chrome) we can begin writing modular programs by either
    using require, transpiling our ES6 code to ES5 (that almost all browsers do by
    now) before sending it to the browser for rendering. When browsers catch up, we
    will no longer have to transpile. When this takes place, React will become an
    even more common library you''ll see everywhere. Eventually, modular JavaScript
    program design will become the norm with or without React.


    - 3. **Scalability.** In React each HTML element is *treated* like a programmable
    component that can be nested within other components. Child components have parent
    components associated with them is established through something known as props.
    Scalability of React programs is achieved by making each component a conglomerate
    of HTML, CSS and JavaScript code.


    - 4. **Flexibility.** React is more than just a UI view library as opposed to
    what you will probably hear at first when you start figuring it out. And that
    isn''t entirely wrong. React gives us ability to create lightning-fast interactive
    components that can be used as elements of our application. However, React''s
    utilizes the principle of render targets which allows you to send result of your
    code to just anywhere, included but limited to front-end view.


    - 5. **Popularity among Employers.** React was developed by programmers at Facebook
    after years of studying web applications. More or less, it originated from a set
    of proven software engineering philosophies. Although, many of them most traditional
    JavaScript programmers will not be familiar with. When you are learning React,
    you are learning computer programming principles, not just a list of functions
    and methods, which is the case with other libraries such as jQuery. In 2016 JavaScript
    has become the leading language for front-end web development. Having React on
    your resume gives you an edge over your competition if you''re looking for employment
    in software industry. The average Sr. JavaScript programmer in San Francisco Bay
    Area makes $120-150K a year.


    ## Reactive Programming


    What is this reactive programming anyway? React is a small but powerful library
    written in JavaScript. You can use it by including it on your web page using SCRIPT
    tag. Just like you would any other JavaScript library, like jQuery for example.


    If you are looking to be prepared for employment at an actual software company,
    simply adding React to your web page isn''t enough. It almost demands that you
    understand other areas of web development that go beyond simple JavaScript programming.
    The design of this book is dedicated to nurture that process.


    By using React components, which will be shown throughout many examples in this
    book, you will build an entire application. During many parts of this book I will
    refer to building applications using the React library as "reactive" programming.


    Reactive programming is nothing more than a phrase made up to represent an alternative
    way of thinking about building modern web applications. Reactive programming is
    not inherent to programming using the React.js library itself. It''s a methodology
    and it happens that React.js library adopts it as its core philosophy.


    What I mean by this is that it''s the type of programming methodology that will
    focus a lot on logical functionality of your program. Think about it as a more
    advanced form of programming compared to working with DOM in JavaScript, where
    each visual element of your app not only has events associated with them, but
    can possibly contain custom programs that you will write which determine their
    function.


    While React is considered to be mostly dealing with the view areas of your application,
    don''t believe the myths that React is strictly the "view" in the MVC (model-view-controller)
    pattern you are probably familiar with. If not, just know that the Model View
    Controller is a programming pattern that separates code from the visual elements
    of an application.


    I hope you enjoy this book, learn the React library and explore the the possibilities
    offered by modern software development that will train you for making real-world
    web applications.

