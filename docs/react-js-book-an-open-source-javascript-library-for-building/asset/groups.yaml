  mdcn: "\n你的组件所代表的元素的本质。\n\n我希望这能为你开始编写自己的 React 应用提供足够的弹药。\n\n与 JSX 类似，在 React 中编程假设你已经掌握了许多知识。其中之一就是\
    \ EcmaScript 6 规范。这非常重要，因为理想情况下，在学习制作 React 应用的过程中，你希望从旧式的 ES5 语法过渡到 ES6。这种标准在大约一到两年内，将会在\
    \ Chrome、Firefox 和 Safari 等所有现代浏览器中得到原生支持，而无需使用额外工具进行代码编译。\n\n书的其余部分将介绍 JavaScript\
    \ 6 中应用到 JavaScript 语言的一些重大变化。\n\n# EcmaScript 6 - 你需要了解的\n\n当 React 创建时，ES5 规范正处于焦点。在\
    \ 2015 年甚至在整个 2016 年期间，它仍然是非常新颖的。\n\n然而，到 2017 年，它开始逐渐适应 ES6 语法。这就是为什么在学习 React\
    \ 时，讨论应用到这一新标准的重大变化至关重要。\n\n当你学习 React 时，你学习的不仅仅是 React。它在 ES5 中运行良好良好，但那种语法正在变得过时。这正是许多程序员会感到困惑的地方，因为本质上同一个库在互联网和书籍中看到的各种示例中，看起来可能都不一样。\n\
    \n如果你不了解 React，可能你也对 EcmaScript 6 一点都不了解。我知道做出这种假设是危险的，但我认为通过本章将学到的内容可以证明它是合理的。\n\
    \nES5 本身并没有问题。它在短期内不会消失。我认为，在行业仍处于从一个规范向另一个规范过渡的时期编写教育类书籍，偶尔在两者之间切换是很重要的。\n\n\
    但我们已经到了书的后续，现在我们将调查 EcmaScript 6 规范中 JavaScript 的主要区别和新增。在书的最后，我还会为这里讨论的许多主题提供备查表。\n\
    \n# var 和 let 关键字\n\n在 ES6 中，人们的共识是现在使用 `let` 关键字代替 `var` 关键字。其原因下文所示：\n\n- 使用\
    \ `let` 关键字时没有**提升**（hoisting）。如果你熟悉 JavaScript 的提升机制，你会发现使用新的 `let` 关键字时的不同。\n\
    \n提升是指 JavaScript 将所有变量定义移动到它们定义所在作用域顶部的过程。这个不为人知的过程是在幕后完成的。但实际上是：\n\n```\n{\n\
    console.log( a ); // undefined; 但仅因为被提升了\nvar a = 1;\n}\n```\n\n而 `let` 的示例是：\n\
    \n```\n{\nconsole.log( a ); // ReferenceError: \"a\" 完全未定义\nlet a = 1;\n}\n```\n\
    \n在上面的示例中，尝试打印变量值时，控制台输出是 `undefined`。在第一情况下，是因为变量被提升了；但在第二个示例中，它没有。\n\n- 在全局作用域中。`let`\
    \ 关键字和旧的 `var` 关键字仍然限于全局作用域。但 `let` 关键字不会附加到全局 `window` 对象上：\n\n```javascript\n\
    var a = 1; // 将附加到全局 window 对象\nlet b = 1; // 将不会附加到全局 window 对象\nconsole.log(window.a);\
    \ // 1\nconsole.log(window.b); // undefined\n```\n\n- 在函数作用域中。**let** 和 **var**\
    \ 关键字在函数作用域内仍然是相同的：\n\n```javascript\nfunction helloThere() {\nlet x = 1; // 作用域相同\n\
    var y = 1; // 作用域相同\n}\n```\n\n- 在语句中。**let** 关键字仅在 `for` 循环内部可见，而 **var** 在整个函数作用域内可见。因此，**let**\
    \ 关键字限制了定义在 `{` 和 `}` 括号指定的**最近闭合块**内变量的可见性。下面我们先来看看 **var** 传统是如何处理作用域的：\n\n\
    ```javascript\n// var 在函数和 for 循环内部示例\nfunction helloThereIterator() {\n// i 在这里理论上也是可见的\n\
    for (var i = 0; i < 10; i++) {\n// i 在这里可见的\n}\n```\n\n这可能不是 `var` 关键字最好的例子（因为\
    \ for 循环从初就是定义的），尽管它在函数中处处可用。但它仍然说明了这一原理。\n\n传统上，已知 `var` 在函数的 `{ }` 括号内可以被访问，但对函数作用域隐藏，除非它是\
    \ `window` 对象。这是基本规则。但 JavaScript 就是如此复杂……只有当在函数内部没有找到变量时，才会检查 `window` 对象，而后者是在函数外部的。\n\
    \n作为程序员，确定该变量是否应该从全局作用域可用是你的责任。这是 JavaScript 试图“兼顾所有人”的一个例子。\n\n虽然这种松散在很多情况下很有帮助，并让学习曲线几乎不存在，但从远来看，你会遇到这些奇怪的情况，特别是当你的程序在大项目中达到一定长度时。\n\
    \n现在，让我们来看同一个例子。我们所做的是将 `var` 换成了 `let` 关键字。这产生了不同的作用域预期。\n\n```javascript\n//\
    \ let 示例\nfunction helloThereIterator() {\n  // i 在这里是可见的\n  for (let i = 0; i\
    \ < 10; i++) {\n    // i 在这里可见，并且在该作用域内部的回调中也可见\n  }\n}\n```\n\n- let 不允许重复声明\n\
    \n这并没有解决任何重大问题，但它确实帮助我们以更直观的方式完成工作，特别是在处理脚本程序结构中多个作用域的网格时。\n\n# 新的 const 关键字\n\
    \n`const` 与 `let` 完全相同。唯一的区别在于一旦你使用 `const` 定义了一个值，它就不能重新赋值。这样做将产生错误：\n\n```javascript\n\
    const a = 1; // 允许\nconst a = 2; // 错误，常量不能重新赋值！\n```\n\n`const` 有什么用？常量传统上用于定义程序运行时不会改变的值。还有一点……`const`\
    \ 关键字防止了重新赋值。与许多其他语言相比，这会让对象的属性变为不可变。\n"
