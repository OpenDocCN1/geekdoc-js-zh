    \ one by one, it will all start making sense.\n\nFor now just know that a react\
    \ component is usually mounted to a render target. This is why some of the default\
    \ methods mentioned above use the word \"mount\" instead of traditional setter\
    \ or getter methods like \"set\" or \"get\" you would expect. Mounting is an idea\
    \ unique to programming with React and the components created within React's virtual\
    \ DOM ecosystem.\n\nWe've already talked about components theoretically. But what\
