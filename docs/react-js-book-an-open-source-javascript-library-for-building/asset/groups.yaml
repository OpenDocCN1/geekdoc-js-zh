  - "[PAGE 29]\n\n# Class Component Options\n\nWe'll speak about components a lot\
    \ more throughout the rest of the book. They are the building blocks of your react\
    \ application. But remember that this is \"React on the Palm of Your Hand\" section!\
    \ Let's briefly overview the full scope of a React component, its options and\
    \ methods available by default in React library. Components are defined by createClass\
    \ method existing on the main React object:\n\n```\nvar MyComponent = React.createClass({\n\
    \  displayName: 'MyComponent',\n\n  /* This is the core of your React Class\n\
    \     options and lifecycle methods will be written here */\n\n  render: function()\
    \ {\n    // Once rendered, let's return a newly created element\n    return React.createElement(/*\
    \ ... * */);\n  }\n});\n```\n\nThis is the basic structure of a component class.\n\
    \n# Component Options\n\nComponents hold the propTypes object and two methods\
    \ that return an object:\n\n+   1. propTypes mapping prop names to types\n2. getDefaultProps\
    \ function returning object\n3. getInitialState function returning object\n\n\
    # Lifecycle Methods\n\n+   1. componentWillMount\n2. componentDidMount"
