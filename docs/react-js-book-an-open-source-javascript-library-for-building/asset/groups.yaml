    \ this isolated example makes almost no sense outside being used in a real-world\
    \ application. But it shows a few important principles.\n\nThis react code that\
    \ borrows its JavaScript-cross-HTML syntax from JSX language gives us a means\
    \ to know what the output of a dynamic element will look like by briefly looking\
