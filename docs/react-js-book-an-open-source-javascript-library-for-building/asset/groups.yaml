    # REACT.JS Book


    # Solid understanding of a hard to learn JavaScript library


    React.js Tutorial Book


    React.js is definitely one of the hardest things I had to learn from the pool
    of JavaScript libraries. In part, it assumes knowledge of many other things associated
    with professional web development. Namely, Node.js, NPM, mastery of babel command
    line tools, EcmaScript (5 and 6) JSX and possibly WebPack.


    This book also makes an assumption. That is completely new to React programming.
    It creates a challenge for me the author, because it''s my responsibility to speak
    about React in a way that is still meaningful, without overwhelming you with large
    blocks of code that look complicated and hard to follow.


    Having said this, my strategy for the presentation format of this book follows
    a simple pattern of mixing explanations with simple code examples. Primarily,
    this book is a narrative designed to gradually into understanding the React library.


    I''ll just put it out right now that book alone will not be enough to become an
    expert React programmer. No publication about React can claim this, due to shear
    scope of principles you need to understand in order to get going and starting
    real applications with React. There is also syntactic differences between EcmaScript
    5, 6 and soon 7. For this reason React may turn out to be one of the most unusual
    learning experiences you have ever had when it comes to JavaScript.


    But breaking through the hard parts is worth the battle. And I hope this book
    will prove to be practical in accomplishing this task.


    Written and edited by Greg Sidelnikov greg.sidelnikov@gmail.com


