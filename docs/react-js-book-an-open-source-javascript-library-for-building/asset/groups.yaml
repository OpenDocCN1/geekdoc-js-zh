  - '[PAGE 47]


    # Gem 6 - Component Mounting


    React is a library that values programming principles. One of them is the idea
    of components as elements. A component is a programmatic (declarative) way to
    render what you want in your application.


    But React doesn''t actually care about where or how you choose to render these
    elements. Whether it is JavaScript DOM or elsewhere. This can sound surprising
    at first, because React is known for being primarily as a front end library.


    That is because React uses something known as render targets. That is, you determine
    how the results of a react''s render method will be displayed or passed on elsewhere.


    In words, you can say that React is agnostic when it comes to the output of data
    or stores stored within its components.


    For example... you can output data from a component to file writing function.
    In other words, React''s rendering target is not limited just to UI elements,
    even though throughout most of this book and react-style programming in general
    this is what you will be dealing with for the most part.


    In previous gem we''ve talked about how each component takes care of its state.
    A state could be a boolean flag indicating whether a button is highlighted. Or
    whether a navigation menu option is selected.


    Now, if you''ve been paying attention this is where it starts coming together.
    A React component is a fusion between its state and rendering method. We''re given
    programmatic control over the two most important functions of a UI element in
    one place.


    But what in the world is mounting? In React we are using a virtual representation
    of the DOM for performance reasons.


    By simply creating a component, no DOM elements will be even touched. This is
    great news but how could it be? This is because native DOM would increase memory
    imprint of your application.'
  - '[PAGE 48]


    However with React''s virtual DOM, elements are created only when they are required
    to be used by the application.


    I''ll explain this in more detail.


    React is an isomorphic framework. It''s functionality can be mapped to arbitrary
    output. Just JSX-style HTML UI elements.


    The virtual DOM provided by React is exactly just that: virtual. It doesn''t physically
    exists within actual JavaScript DOM until it actually needs to be used by the
    application.


    Just think about it this way. The JavaScript''s DOM is a physical tree of HTML
    elements stored in memory. It is populated while the page is loading into your
    browser.


    Usually, when a page is loaded into the web application, each DOM branch represented
    by HTML element brackets, loads up the primary root DOM element regardless of
    how it will be used, or whether it will even be shown on the screen. The footer
    will be loaded DOM, even if it is displayed below the fold in the browser.


    React, on the other hand, doesn''t even touch DOM tree. As discussed in one of
    the previous gems, it adds or removes components from or to its own virtual DOM,
    which is stored completely in memory. An element becomes physically represented
    in memory of the render target usually only when the component is purposely used
    within your application. It''s almost like copying and pasting virtual DOM to
    a render target, whatever it may be. In the case of web applications, it is of
    course the JavaScript DOM tree.


    I''ll demonstrate it with the following example:


    ```

    var component =

    React.createElement(ComponentDefinition );

    ```


    At this moment component is an instance of the React type ComponentDefinition
    which I made just for this example. In reality, it would correspond to a component
    like LoginScreen,'
  - '[PAGE 49]


    NavigationMenu or Button. And it would contain the standard component definition
    code we''ve already seen in earlier gems in the book.


    It''s simply a React type. It is not yet physically existent anywhere in the primary
    JavaScript''s document (DOM) object. Aside of being a react node it is nowhere
    else to be found. This is because as of yet it has no physical purpose in terms
    of being displayed in your application.


    But this is true only until render method is executed on this component. Here,
    counter is just some of a DIV or other HTML element:


    ```

    React.render(component, container);

    ```


    The render method mounts component to the DOM. The reason this process is referred
    to as mounting is similar to virtual hard drives. If you''ve ever mounted a virtual
    CD-Rom or hard drive on your computer, you know how it works. The hard drive doesn''t
    physically exist. For the same reason, this is why this type of software is called
    virtual hard drive. Or virtual CD-Rom. And this is why virtual drives have features
    like "mount this drive."


    Likewise, this is the same principle behind DOM in React. Until it is mounted,
    it cannot be operated upon. This is what makes React so faster than regular DOM
    operations. And this is probably one of the top reasons for using React in the
    first place. React stores a fast inmemory representation of the DOM.


    But this virtual DOM is not even associated with the JavaScript''s DOM. It exists
    by side, and renders to the actual DOM on the screen only when it becomes necessary.
    Usually, when the component representing an element is actually updated with new
    incoming data.


    Essentially, React is designed to update components on the screen only when they
    need to be. Another advantage of doing this way is that it separates your application
    from the back end, while effectively executing functions that are responsible
    for updating the screen almost instantaneously as they occur.'
