    # REACT.JS 书


    # 深入理解一个难以学习的 JavaScript 库


    React.js 教程书籍


    React.js 绝对是我在 JavaScript 库中学过的困难的内容之一。部分原因在于它假设你已经了许多与其他专业 Web 开发相关的知识。即：Node.js、NPM、精通
    babel 命令行工具、EcmaScript (5 和 6)、JSX 以及可能还有 WebPack。


    这本书还做了一个假设，即你对 React 编程是完全全新的。这对我这个作者来说构成了一个挑战，因为我的责任是用一种仍然有意义的方式来讲解 React，而不会用大块看起来复杂且难以理解的代码让你无所适从。


    尽管如此，我对本书呈现形式的策略遵循一个简单的模式，即将解释与简单的代码示例混合。主要来说，这本书是一部叙述性的著作，旨在逐步进入对 React 库的理解。


    我现在就直说，单凭这本书是不够成为一名专家 React 程序员的。任何关于 React 的出版物都无法做到这一点，因为要入门并使用 React 开发真正的应用程序，你需要理解的原则范围极其庞大。EcmaScript
    5、6 以及即将到来的 7 之间也存在语法差异。正因如此，React 可能会成为你在学习 JavaScript 时遇到过的最不寻的学习体验之一。


    但突破这些困难部分是值得的。我希望这本书在完成这项任务方面证明是实用的。


    Greg Sidelnikov 编写并编辑 greg.sidelnikov@gmail.com


