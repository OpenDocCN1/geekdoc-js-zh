  - '[PAGE 77]


    Notice that you can access child''s text from **handleChildClick** method within
    Parent container. The Parent and Child containers are tied by the props passed
    into the text attribute on the Child container.


    Whatever you pass into the Child (which is located within Parent) will be automatically
    accessible via the parent container. So props are really what establishes the
    relationship between the two.


    React is a relatively new library. However, it does use one important JavaScript
    function that you simply must know how to use, if you ever plan on using Parent
    and Child dynamic in your reactive application.


    And this standard JavaScript function is the **map** method, that natively exists
    on all objects of type Array. If you''ve worked with JavaScript arrays before,
    you may have at least heard of this function. All it does is creates a new array,
    calls the callback function on each item, and fills the new array with the result
    of modifications that the callback function has applied to each item from the
    original array.


    So in short, **Array.map** takes all items and applies a custom operation on them.
    Then, it simply returns the new, modified data set as a new array. How does this
    help us in terms of writing Parent-Child components in React library? I can demonstrate
    this by providing the following example where we will use multiple Children in
    a single Parent.'
