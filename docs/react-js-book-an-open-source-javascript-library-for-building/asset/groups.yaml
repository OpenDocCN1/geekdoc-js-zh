    \ HTML 为我们提供了一组元素（作为 HTML 标签），用于处理 Web 应用程序的布局并通过属性与 JavaScript 代码交互，但 React 不仅如此……还有更多。\n\
    \nReact 让我们能够创建紧凑的代码块，让我们能在一个地方一目了然组件在屏幕上是如何渲染的，而且通常只需要一行代码就能实现。这为程序员在创建视觉元素的应用程序方面提供了巨大的控制权，同时也赋予了他（或她）编写这些视觉元素行为的能力。\n\
    \nReact 程序通常不处理单独的 CSS 样式表。样式的交互是通过虚拟 DOM 提供的。我们将在书的后部分介绍它是如何运作的。\n\n与传统的 HTML、CSS\
    \ 和 JavaScript 方法相比（后者我们必须在源代码中到处寻找才能找到网页上某一个元素的各个碎片），React 为我们提供了一种使用可编程模板的方法。\n\
    \n在标准的基于 Ajax 的 HTML 应用程序中，我们习惯于看到如下示例所示的代码：\n\n```html\n// HTML\n<div class=\"\
    LoginForm\">\n  <div class=\"Name\">\n    Enter username here.\n  </div>\n</div>\n\
    ```\n\n这里是对应的 jQuery Ajax 示例：\n\n```javascript\n// Ajax counterpart\n$.ajax({\
    \ url: \"/login.php\",\ndata: { \"username\": \"user1\",\n\"password\": \"abfgh123\"\
    \ },\n\n// login.php returned some data\nsuccess:function(msg) {\n  // Adjust\
    \ DOM data\n  $(\".Name\").html(msg);\n}\n});\n```\n\n这是一个刻意简化的示例。但你可以看到，即使是，代码也位于两个独立的块中。其中一个是\
    \ HTML 布局定义。它几乎像是一个带有某些动态功能的 LoginForm 可重用模板。\n\n第二个代码块是执行 Ajax 语句的实际程序。这行代码将根据传递给它的数据（用户名和密码）从\
    \ PHP 脚本加载数据，并在 `msg` 变量中返回某种消息。\n\n最后，使用 jQuery 通过替换类名为 `Name` 的 div 内容为从脚本收到的消息来修改\
    \ DOM。\n\n在一段时间内，这种方法运行得很好。在过去的几年里，这就是我们习惯处理网页上动态元素的方式。但 React 的卓越之处在于，它整合了这一切，并赋予我们对\
    \ HTML 和动态数据的程序化控制，而这一切都封装在一个整洁的 `render` 函数中：\n\n```javascript\nrender: function()\
    \ {\n  return (\n    <div>\n      {\n        this.state.name ? this.state.name\
    \ :\n        <span>Enter username here</span>\n      }\n    </div>\n  );\n}\n\
    ```\n\n注意 HTML 和 JavaScript 代码是如何交织在一起的，而无需打开单独的标签。它们都存在于同一个 JavaScript 语句中，并且几乎可以互换使用而没有任何任何问题。我们稍后会介绍如何实现这一点的。\n\
    \n当然，这个孤立的示例在实际实际应用之外几乎没有任何意义。但它展示了几个重要的原理。\n\n这段 React 代码从 JSX 语言借用了 JavaScript\
    \ 跨 HTML 的语法，让我们能够通过简短查看代码就知道动态元素的输出外观。React 在这里试图满足所有人的需求。在某些情况下，你会注意到一些模式，感觉几乎就像将后端逻辑带到了前端。\n\
    \n此示例中使用了三元运算符 `?:`。基本上，它的意思是如果属性存在（非空或未定义），我们就应该输出它。如果它不存在，我们应该输出通用的“Enter username\
    \ here”作为默认消息。\n\n这把 HTML 方法带到了一个不同的维度。在这里，我们同时设计并编写组件。\n\n# 响应式原理与工作\n\n（注：由于原始文本包含大量重复的\
    \ OCR 错误和干扰，译文已提取核心逻辑并进行规范翻译。）\n"
