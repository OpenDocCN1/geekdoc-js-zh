    figure it out.


    The only primary difference is that curly brackets { } can now also be used within
    JSX statements under tag attribute names. The whole tag Scoreboard is treated
    as an object. And its attribute scores is just its property which contains the
    value specified earlier in code by JavaScript object scoreBoard, which is a JSON-literal
    object notation for creating objects.


    This might seem a bit awkward at first, but this gives you tremendous control
    over your application. It unifies document.getElementById (or jQuery''s equivalent
    of $\(\#id")).attr("scores") which is the method you would otherwise have to use
    just to access a property, into a new format.


    This format allows not only writing attributes directly into your HTML elements
    (as JSX) and assign them to already-existing variables/objects, but also treat
    HTML as a JavaScript statement itself. This is great, imagine that you can return
    HTML code as a JavaScript statement from a function, and then pass it to some
    other abstract method in your application. It''s like tossing HTML between functions
    and preparing it for output in one of the containers in your application.


    One thing. You will notice that JSX uses className instead of "class" as in traditional
    DOM object. The JSX docs explain it as "Since JSX is JavaScript, identifiers such
    as class and for are discouraged as attribute names." So is why this class has
    className, and for has become htmlFor.


    To learn more about JSX you should check out the official JSX documentation. Again,
    another book could be written just about the subject, and we''re trying to get
    the basic out of the way so we can focus on React throughout the rest of this
    book.


