  - '[PAGE 94]


    # Destructuring assignment


    EcmaScript 6 introduces us to destructuring assignments. This is new JavaScript
    functionality. The previous explanations of let keyword laid the groundwork for
    discussing this next subject. So let''s take a look at how they work:


    ```

    let {a, b} = obj;

    In this example two variables a and b are created. Then, properties obj.a and
    obj.b are taken from the object named obj, and assigned to those variables respectively.
    So this is the equivalent of doing something like:


    let a = obj.a;

    let b = obj.b;

    ```


    This format takes a lot more space. Destructuring assignments save space and provide
    better readability for our code. Get used to them! :)'
  - '[PAGE 95]


    # For-of loop


    This is a completely new type of a loop in EcmaScript 6. Let''s take a look at
    how it works:


    ```

    for (let [key, value] of map) { ... }

    ```


    This mighty for loop will iterate through values stored in map. Unfortunately
    (like many things in JavaScript) the for-of loops do not work on objects (and
    their properties). This is almost a bewildering design decision. So, what for-of
    loops can work on?


    The for-of loops are designed exclusively to work with Array, Map and Set objects
    only.'
