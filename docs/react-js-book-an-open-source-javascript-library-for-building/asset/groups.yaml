- md: "\n# The Main Principles of Reactive Programming\n\nBefore we even go any further,\
    \ it's important to mention what we are even doing here. We can refer to programming\
    \ with React as functional templating. Not to be confused with functional programming\
    \ languages. Here I simply mean that your React components have a specific function\
    \ to perform and that is a way to customize your components with unique capabilities.\
    \ Whereas HTML provides us with a set of elements (as HTML tags) that handle the\
    \ layout of our web application and interfacing with JavaScript code via attributes,\
    \ React is that... and a lot more.\n\nReact gives us ability to create compact\
    \ blocks of code that tell us at a glance exactly how your component will render\
    \ on the screen in all one place, and often in a single line of code. This gives\
    \ tremendous opportunities for giving the programmer an immense amount of control\
    \ over making applications that create visual elements and at the same time, give\
    \ him (or her) the ability to program their behavior.\n\nReact programs usually\
    \ do not deal with separate CSS stylesheets. Interfacing with the style is provided\
    \ via virtual DOM. We'll see how that works later in the book.\n\nCompared to\
    \ traditional HTML, CSS and JavaScript approach, where we would have to scout\
    \ around the source code just to find different bits and pieces of just one element\
    \ on the web page, React gives us a way to use programmable templates.\n\nIn standard\
    \ Ajax-based HTML applications, we're used to seeing code such as demonstrated\
    \ in the following example:\n\n```html\n// HTML\n<div class=\"LoginForm\">\n \
    \ <div class=\"Name\">\n    Enter username here.\n  </div>\n</div>\n```\n\nAnd\
    \ here is the counterpart jQuery ajax example:\n\n```javascript\n// Ajax counterpart\n\
    $.ajax({ url: \"/login.php\",\ndata: { \"username\": \"user1\",\n\"password\"\
    : \"abfgh123\" },\n\n// login.php returned some data\nsuccess:function(msg) {\n\
    \  // Adjust DOM data\n  $(\".Name\").html(msg);\n}\n});\n```\n\nThis is a purposely\
    \ simplified example. But you can see how even then, the code is located in two\
    \ separate blocks. One is the HTML layout definition. It is almost like a reusable\
    \ template for LoginForm with some dynamic functionality.\n\nThe second block\
    \ of code is the actual program that executes an Ajax statement. This line of\
    \ code will load data from a PHP script based on the data passed to it (username\
    \ and password) and returns some type of a message in msg variable.\n\nLast, jQuery\
    \ is used to modify the DOM by replacing the contents of div whose class is Name\
    \ with the message received from the script.\n\nFor a while this methodology worked\
    \ just fine. Over the last several years, this is how we're used to working with\
