    # A Note From the Author


    Welcome to the introduction chapter of my book.

    This is React Gems a book by Greg Sidelnikov.


    That''s me, the author!


    First, thank you for showing interest in React Gems. This tutorial book was self
    published by myself my JavaScript web development newsletter. It will walk you
    step by step through the process of setting up a development environment and learning
    Reactive programming from start to finish.


    As of 2017, what I call "reactive" programming has become an alternative way of
    thinking about web applications. It provides software patterns that make your
    web app extremely responsive to user input and generally feel faster to the end-user
    (people who are using your application.)


    When I was studying React it took me about 3 weeks for something to occur to me.
    React is unlike any other JavaScript library I have ever programmed with. It assumes
    a lot of previous knowledge. Because of this I had to write this book a certain
    way, that gradually delves into the process of understanding it.


    Studying React is not just about memorizing a few methods here and using them
    as you. React itself is built on software principles that usually become known
    only to professional software engineers who have worked in the industry for a
    long time. This creates a challenge for authors like me who are trying to explain
    React to JavaScript newcomers.


    I chose to solve this problem by adopting a more fluid style of explanations that
    border between discussions and source code that make an attempt to create balance
    between both. I didn''t want to show long React programs and write a few comments
    explaining what each line does. That would only complicate the learning process.
    Instead, I broke down the narrative of the book into components (no pun intended!)
    that deal with real problems you will be faced with when studying React for the
    first time.


    Programming with React library is a lot more than just learning about and using
    React objects, components, states, props and methods. The entire book is dedicated
    to explanations of what those are. Have you ever heard of props or states in other
    libraries? States... probably, you did. But not so much props (React''s way of
    referring to "properties") of an object, which are in fact arguments/parameters
    passed to React objects. It is a mystery of why they decided to call this props.
    Because even what they represent comes from HTML attributes, not properties.)


    React makes understanding both (props and states) explicit requirements. They''re
    almost like sub-features that you absolutely must master in order to become a
    versatile React library programmer.


    # Main Roadblocks to Learning React


    Here, I''m going to make an attempt to speak of the commonplace difficulties faced
    with learning React from scratch. These are the ones that make learning React
    not as intuitive as other straightforward libraries you''re used to.


    I''ll try to do without making React come off as a bad choice, because... all
    in all, this is indeed a book about to advance as a React programmer. However,
    if we at least frankly about the hard parts now, it will make it easier to sink
    in later on as we move forward.


    1. New Design Pattern. New, and in many cases unfamiliar. If you''re coming to
    React from traditional pre-2015 JavaScript world of programming, it might take
    time to adjust to modular and declarative design adopted by React library. Sure,
    if you''ve ever worked on a large JavaScript application you might have dealt
    with long lists of .js files and treated them as separate modules. But for large
    majority of programmers this isn''t true. React requires that we use modular design
    for maximum application management efficiency.


    2. JSX language throws a lot of people off. It''s like writing HTML inside JavaScript
    and at first it looks nothing of bizarre, if you''re encountering it for the first
    time ever.


    For example:


    ```javascript

    var divblocks = <div>

    <div>Another nested tag</div>

    </div>;

    ```


    Like what, what? Are you seeing what I''m seeing we? We have just relentlessly
    typed HTML into a JavaScript statement, without quotes surrounding the HTML, and
    even have separated them using line breaks... and still got away with it.


