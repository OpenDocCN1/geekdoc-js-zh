    referring to a custom element. No need to use surrounding quotes here.


    In JSX it will translate to something like <MyNav />


    Eventually with time as you develop your application, you''ll arrive at full structures
    similar to one depicted in the following example. Note, that here it is a little
    different as I am actually using React statements directly as children arguments:


    ```

    let nav = React.createElement(MyNav, {flat: true},

    // start children of nav

    React.createElement(''a'', {href: ''#''}, ''Save''),

    React.createElement(''a'', {href: ''#''}, ''Load''),

    React.createElement(''a'', {href: ''#''}, ''Delete''),

    React.createElement(''a'', {href: ''#''}, // Alert Contaner

    // start children of AlertCounter link

    React.createElement(''span'', {alerts: 0}, "No Alerts"))

    ```


    Note that some children are simple strings of text. They are used as text nodes
    here. The stuff that goes in between the brackets of tags also have a representation.
    And that''s what they''re for. In this case children can be used as the text supplied
    to the link''s innerHTML, when they are not used for specifying nested elements.


    Also, here createElement is how you would create a React element in ES5 without
    JSX. I''ll explain this in a moment. While I advocate the use of ES6, I wanted
    to show how it''s done in ES5 first. Moreover, ES6 is backwards-compatible with
    ES5. So, this means that a lot of the time you find out how you write react programs
    will depend on your personal preference.


    What''s important to understand, for now, is that createElement takes three arguments:
    type, props, children.


    Here, type is the name of the element. For example A, H1, DIV, etc.'
- md: "\nThen we have props, which are properties you pass to this component. Props\
    \ are not states, but they can modify states. We'll draw this distinction later\
    \ in more detail.\n\nFinally, children are just hierarchical elements to be found\
    \ within its parent elements. Create chains of them and type them right into createElement\
    \ function as N-number of arguments at the end.\n\nAnother key that unlocks deeper\
    \ understanding of React is that all of the code above has its equivalents in\
    \ JSX. The two can be used interchangeably. This is the part that is actually\
    \ exciting, once you truly start understanding how it works.\n\nSo, while in ES5,\
    \ you would use createElement function, in JSX (arguably its common use is with\
    \ the rest of ES6 syntax) you could create exactly the same functionality by simply\
    \ writing it out as follows:\n\n```javascript\nlet link1=<a href=\"#\">Save</a>;\n\
    ```\n\nNow you see where I am going with this? JSX turns HTML into JavaScript\
    \ statements. Here link1 is object-like representation of the element which is\
    \ exact equivalent to React code we created earlier with createElement method.\n\
    \nAnd yes, link1.href will contain \"#\" by simply declaring it as JSX. Once I\
    \ realized that is how it works JSX started to make a lot more sense and I actually\
    \ started to feel comfortable using it.\n\nIt's like a two-way road between HTML\
    \ and JavaScript where attributes automatically become properties. And here is\
    \ the more complex example, this in JSX once again:\n\n```javascript\nlet nav=<MyNav>\n\
    \  <a href=\"#\">Save</a>\n  <a href=\"#\">Load</a>\n  <a href=\"#\">Delete</a>\n\
    \  <a href=\"#\">\n    <span alerts=\"0\">No Alerts</span>\n  </a>\n</MyNav>;\n\
    ```\n\nWe have just recreated virtual DOM using JSX language using a single JavaScript\
    \ statement! You can pass the value of nav around as a statement to functions.\
    \ It's almost like another way of creating a mini DOM structure.\n\nNow you (hopefully)\
    \ see that this is the very structure of virtual DOM in React. It's like a secondary\
    \ DOM we're going to be working with, changing, modifying, editing, deleting and\
    \ adding children from, etc.\n\nWe will update the actual JavaScript DOM object\
    \ which is responsible for visible elements in our application... but **only when\
    \ it actually needs updating**. None of the DOM operations we're performing will\
    \ be associated with spending time updating the original DOM. And this is what\
    \ improves performance of React applications.\n\nThe best thing, React does this\
    \ for you automatically. As a React programmer, you are not required to understand\
    \ how React does this internally. You just focus on design of your application.\n\
    \nNote, of course you type JSX code directly into your JavaScript application,\
    \ it will not even compile. You must be running JSX processor. To do this you\
    \ would usually initialize it from command line, so it constantly runs in the\
    \ background.\n\nBabel is a JSX plugin. I also recommend learning how to make\
    \ babel watch your files. What this means, you can set babel up so that auto-transpiles\
    \ your .js files (and places them into \"build\" or \"production\" directory)\
    \ automatically, as soon as the file changes. This babel functionality is called\
    \ \"**watch**. It must be enabled. I explain how to do this on Windows PC in my\
    \ video tutorial:\n\nReact Tutorial on YouTube that helps you set up your development\
    \ environment, install Node.js, NPM, babel, JSX and help you start watching your\
    \ js files:\n\nhttps://www.youtube.com/watch?v=tXaNyGcjEIo0\n\nYou can get away\
    \ with simply adding babel.js to your SCRIPT tag at the top or bottom of your\
    \ web page. JSX will transpile just fine. But this will significantly slow down\
    \ processing of your application. It should be used only for testing.\n\nThe video,\
    \ on the other hand is only 58 minutes long, and if you're serious about setting\
    \ up a professional web development environment I recommend breezing through it\
    \ on 2x speed option in YouTube player which should only take about 25 minutes.\
    \ It's like a mini introduction course,\n\nFinally, we're drawing this discussion\
    \ to an end by showing that you can also clone existing elements using cloneElement.\n\
    \n```javascript\nReact.cloneElement(element, props, children);\n```\n\nIt works\
    \ in the exactly same way as createElement. Just pass an existing element as argument.\
    \ Then, whatever props and children you pass to corresponding parameters, will\
    \ be merged into ones already available on the original element. This is reminiscent\
    \ of extending object functionality in traditional Object-Oriented programming.\
    \ Here, we're somewhat imitating OOP functionality.\n\nCreated elements can be\
    \ actually rendered to the DOM. You cannot render to virtual DOM. The render function\
    \ is the magic that takes care of this process within React library internals.\
    \ This is our element \"copy and pasted\" from your virtual DOM into the actual\
    \ DOM that will be visible on the screen.\n\nReact provides render method on the\
    \ main ReactDOM as shown below. In reactive programming ReactDOM is the second\
    \ most important object after React.\n\n```javascript\nReactDOM.render(reactElement,\
    \ domContainerNode);\n```\n\nHere domContainerNode is the parent element on which\
    \ reactElement will be rendered, re-rendered or attached for the first time (mount).\n\
    \nYou can use render multiple times, if you need to update properties of the component.\n\
    \nHere's what a real-life scenario might look like. In this example we're taking\
    \ a ReactElement and rendering it on a DOM node:\n\n```javascript\nReactDOM.render(\n\
    \  React.createElement(\"div\"),\n  document.getElementById(\"container\")\n);\n\
    ```\n\nIf you have an element already associated with a variable name, you can\
    \ look it up using ReactDOM.findDOMNode:\n\n```javascript\nReactDOM.findDOMNode(element);\n\
    ```\n\nThis statement returns the DOM node associated with the given element.\
    \ Note, that this will only work after element has been rendered to the DOM.\n\
    \n## Special Props\n\nHere we will briefly talk about special prop names, of which\
    \ there are a few. These should be treated almost like keywords in JavaScript,\
    \ except in React.\n\n### Children\n\nThe prop name children is automatically\
    \ added to this.props by createElement.\n\n### className\n\nThis prop corresponds\
    \ to the HTML's class attribute. You must use className in your components/elements\
    \ instead of name to avoid clashing with HTML's reserved keyword.\n\n### htmlFor\n\
    \nSame as className only for the \"for\" attribute. htmlFor should be used in\
    \ your React element anywhere you need to use \"for\" attribute.\n\n### key\n\n\
    The key prop uniquely identifies a ReactElement. It's used with elements in arrays.\n\
    \n### ref\n\nThe ref prop accepts a callback function which will be called:\n\n\
    - With the component instance of DOM node on mount.\n- With null on unmount and\
    \ when the passed in function changes.\n\n### style\n\nThe style prop accepts\
    \ an object of styles, instead of a string. In React, there is no mechanism for\
    \ specifying CSS styles as a text string. This is one of the limitations of using\
    \ JSX.\n\nBut this limitation can also be looked at as an advantage, because CSS\
    \ styles can now be represented programmatically, where each property of the CSS-style\
    \ object represent CSS property pairs. It might feel a little awkward at first\
    \ but this style actually adapts much better to the overall scheme of React programming.\n\
    \n## PropTypes\n\nReact has a special property called PropTypes. Typechecking\
    \ is its primary purpose. As your app becomes large in size, type checking can\
    \ help catch various bugs.\n\nHere is an example. Let's say we already have a\
    \ React component created, and named ReactComponent. By default typechecking is\
    \ enabled in development mode. It is actually not turned on in production code.\n\
    \n```javascript\nReactComponent.propTypes = {\n  name: React.PropTypes.string\n\
    };\n```\n\nWhat React.PropTypes does it turns on validation for the type of the\
    \ data stored in a property. By default React has a number of data validators,\
    \ and if a Numeric data type is passed to a prop defined as String (as shown in\
    \ example above) then you will see a warning in JavaScript's console in Chrome\
    \ or other browsers.\n\nThe propTypes in React are defined as follows:\n\n| Type\
    \ |\n| :--- |\n| any |\n| array |\n| bool |\n| element |\n| func |\n| node |\n\
    | number |\n| object |\n| string |\n"
  mdcn: "\n\n接下来是 props（属性），它们是你传递给此组件的属性。Props 不是状态（state），但它们可以修改状态。稍后我们会详细区分这种区别。\n\
    \n最后，children（子元素）只是在其父元素内部的层级元素。你可以创建它们的链，并将它们直接类型到 `createElement` 函数中，作为末尾的\
    \ N 个参数。\n\n另一个让你更深入理解 React 的关键是，上述所有代码在 JSX 中都有等价写法。两者可以互相替换。一旦你真正开始理解它的工作原理，这部分才是真正令人兴奋的。\n\
    \n所以，在 ES5 中，你会使用 `createElement` 函数，而在 JSX 中（其常见用法是与其他 ES6 语法结合使用），你可以通过简单地编写如下内容来实现完全相同的功能：\n\
    \n```javascript\nlet link1=<a href=\"#\">Save</a>;\n```\n\n现在你明白我想表达什么了吗？JSX 将\
    \ HTML 转换为 JavaScript 语句。这里的 `link1` 是元素的类对象表示，与我们之前用 `createElement` 方法创建的 React\
    \ 代码完全等价。\n\n是的，只需通过将其声明为 JSX，`link1.href` 就会包含 \"#\"。当我意识到它是这样工作的时后，JSX 开始变得非常有意义，我实际上开始习惯使用它了。\n\
    \n它就像 HTML 和 JavaScript 之间的一条双向道，属性会自动变成属性。这里有一个更复杂的例子，再次在 JSX 中实现：\n\n```javascript\n\
    let nav=<MyNav>\n  <a href=\"#\">Save</a>\n  <a href=\"#\">Load</a>\n  <a href=\"\
    #\">Delete</a>\n  <a href=\"#\">\n    <span alerts=\"0\">No Alerts</span>\n  </a>\n\
    </MyNav>;\n```\n\n我们刚刚使用 JSX 语言通过单个 JavaScript 语句重建了虚拟 DOM！你可以将 `nav` 的值作为语句传递给函数。这几乎是创建微型\
    \ DOM 结构的另一种方式。\n\n现在你（希望）看到了这就是 React 中虚拟 DOM 的结构。它就像我们要处理的次级 DOM，我们将从中进行更改、修改、编辑、删除和添加子元素等。\n\
    \n我们将更新应用程序中可见元素的实际 JavaScript DOM 对象……但**只有在确实需要更新时**。我们执行的任何 DOM 操作都不会与花费时间更新原始\
    \ DOM 关联。这就是提高 React 应用性能的原因。\n\n最棒的一点是，React 会为你自动完成这一切。作为 React 程序员，你不需要理解 React\
    \ 内部是如何执行的。你只需要专注于应用程序的设计。\n\n注意，当然，如果你直接在 JavaScript 程序中编写 JSX 代码，它甚至不会编译。你必须运行\
    \ JSX 处理器。要做到这一点，你通常需要从命令行初始化它，使其在后台持续运行。\n\nBabel 是一个 JSX 插件。我还建议学习如何让 babel\
    \ 监听你的文件。这意味着你可以设置 babel，以便在文件发生变化时，自动转译你的 `.js` 文件（并将其放入 \"build\" 或 \"production\"\
    \ 目录）。这种 babel 功能被称为“**watch**”。它必须启用。我在我的视频教程中解释了如何在 Windows PC 上进行操作：\n\n这个在\
    \ YouTube 上的 React 教程可以帮助你设置开发环境、安装 Node.js、NPM、babel、JSX，并帮助你开始监控你的 js 文件：\n\n\
    https://www.youtube.com/watch?v=tXaNyGcjEIo0\n\n你可以通过简单地在网页顶部或底部的 `SCRIPT` 标签中添加\
    \ `babel.js` 来解决问题。JSX 可以正常转译。但这会显著减慢应用程序的处理速度。它应该仅用于测试。\n\n另一方面，该视频只有 58 分钟，如果你认真想建立专业的\
    \ Web 开发环境，我建议在 YouTube 播放器上以 2 倍速快速浏览，这只需要大约 25 分钟。它就像一个微型入门课程。\n\n最后，我们通过展示如何使用\
    \ `cloneElement` 克隆现有元素来结束这段讨论。\n\n```javascript\nReact.cloneElement(element,\
    \ props, children);\n```\n\n它的工作方式与 `createElement` 完全相同。只需将一个现有元素作为参数传递。然后，你传递给相应参数的任何\
    \ props 和 children 都将合并到原始元素上已有的属性中。这让人想起传统面向对象编程中扩展对象的功能。在这里，我们某种程度上是在模拟 OOP\
    \ 功能。\n\n创建的元素实际上可以渲染到 DOM。你不能渲染到虚拟 DOM。`render` 函数是 React 库内部处理这一过程的魔法。这是我们的元素从你的虚拟\
    \ DOM “复制并粘贴”到屏幕上可见的实际 DOM。\n\nReact 在主 `ReactDOM` 上提供了 `render` 方法，如下所示。在响应式编程中，ReactDOM\
    \ 是仅于 React 后最重要的对象。\n\n```javascript\nReactDOM.render(reactElement, domContainerNode);\n\
    ```\n\n在这里，`domContainerNode` 是 `reactElement` 将渲染、重新渲染或首次附加（挂载）的父元素。\n\n如果你需要更新组件的属性，可以多次使用\
    \ `render`。\n\n这是一个真实场景可能的写法。在这个例子中，我们获取一个 ReactElement 并将其渲染到 DOM 节点上：\n\n```javascript\n\
    ReactDOM.render(\n  React.createElement(\"div\"),\n  document.getElementById(\"\
    container\")\n);\n```\n\n如果一个元素已经与变量名关联，你可以使用 `ReactDOM.findDOMNode` 查找它：\n\n\
    ```javascript\nReactDOM.findDOMNode(element);\n```\n\n此语句返回与给定元素关联的 DOM 节点。注意，这在元素渲染到\
    \ DOM 之后才会生效。\n\n## 特殊属性 (Special Props)\n\n在这里我们将简要介绍特殊的属性名，其中有几个。这些在 React 中类似于\
    \ JavaScript 的关键字。\n\n### Children\n\n`children` 属性会被 `createElement` 自动添加到 `props`\
    \ 中。\n\n### className\n\n该属性对应 HTML 的 `class` 属性。为了与 JavaScript 的保留字冲突，你必须在组件中使用\
    \ `className` 而不是 `name`。\n\n### htmlFor\n\n与 `className` 相同，用于 `for` 属性。在需要使用\
    \ `for` 属性的 React 元素中使用 `htmlFor`。\n\n### key\n\n`key` 属性唯一标识一个 ReactElement。它用于数组中的元素。\n\
    \n### ref\n\n`ref` 属性接受一个回调函数，该函数将在：\n- 挂载时传入 DOM 节点。\n- 卸载或传入函数更改时传入 null。\n\n\
    ### style\n\n`style` 属性接受样式对象而不是字符串。在 React 中，没有机制可以通过文本字符串指定 CSS 样式。这是使用 JSX\
    \ 的局限性之一。\n\n但这种局限性也可以被视为优势，因为 CSS 样式现在可以通过编程方式表示，样式对象中的每个属性代表 CSS 属性对。起初可能觉得有点奇怪，但这种风格更符合\
    \ React 编程的整体方案。\n\n## PropTypes\n\nReact 有一个名为 `propTypes` 的特殊属性。它的主要目的是类型检查。随着你的应用程序变大，类型检查可以帮助发现各种错误。\n\
    \n这里有一个例子。假设我们已经创建了一个名为 `ReactComponent` 的 React 组件。在开发模式下，默认开启类型检查。\n\n```javascript\n\
    ReactComponent.propTypes = {\n  name: React.PropTypes.string\n};\n```\n\n`React.PropTypes`\
    \ 的作用是开启存储在属性中的数据类型验证。默认情况下 React 有许多数据验证器，如果将数字数据类型传递到定义为字符串的属性（如上所示），你将在 Chrome\
    \ 或浏览器的控制台中看到警告。\n\n"
