    That''s a whole lot of Wills and Dids. But what do they all mean?

    These methods are like the command center of our component!

    Below I''ll provide brief descriptions for events during the lifetime of a component
    each one these methods is responsible for.


    componentWillInitialState functions like component constructor. It is called before
    the component is rendered on the screen.


    componentWillMount called before render() method just once. It is never called
    again throughout component''s life cycle. Sometimes used synonymously as component''s
    constructor method.


    componentDidMount called just after the component has been rendered for the first
    time.


    componentWillUnmount called when the component is about to be destroyed. This
    is a place to clean up memory and delete state.


    componentWillReceiveProps is called when props are passed to the component. For
    example if you have Form component and TextInput component that allows user to
    change its value by typing text into it. Imagine if TextInput has an onChange
    event that passes in some props to the component. Soon as the new text is entered
    into the input field, the value is passed to the main component as props. This
    is the moment when componentWillReceiveProps is triggered.


    componentWillUpdate is called right before the render method is'
