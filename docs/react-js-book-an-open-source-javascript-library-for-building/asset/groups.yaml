  - "[PAGE 63]\n\nworking with JSX disorienting. Let's face it, the idea of writing\
    \ HTML within JavaScript is already a little far fetched as is. But it really\
    \ gives the leverage we need for writing code faster, by utilizing it primarily\
    \ for treating HTML as return values and tossing them around between components.\n\
    \nPrimarily influenced by original JavaScript DOM API, JSX uses \"camel case\"\
    \ name formatting. For example className. (Camel case is a name format for properties\
    \ with first word in lower case and or more consequent words starting with capital\
    \ letter.)\n\nThe reason className is used in JSX, is because this is what original\
    \ JavaScript DOM's property name. For example:\n\n```\nvar cn = document.getElementById(\"\
    my_id\").style.className;\n```\n\nThis is standard JavaScript code. But JSX uses\
    \ its own virtual DOM system which tries to closely imitate it. It's not trying\
    \ to reinvent the wheel and its own original processing language. And so properties\
    \ follow the standard format we're already familiar with working with DOM API\
    \ object in JavaScript.\n\nBut there are a few quirks. For example, you cannot\
    \ use the \"className\" keyword as HTML attribute name. Let's consider the following\
    \ example which creates a root component, consisting of just one U element, and\
    \ calling it \"my-list\" by assigning it with className property.\n\n```\nvar\
    \ root = React.createElement('ul', {\n  className: 'my-list',\n}child);\n```\n\
    \nThis is often mistaken for a JSX problem, thinking that JSX prohibits the use\
    \ of JavaScript reserved keywords. While this is a somewhat true assessment, the\
    \ problem stems from JSON notation, not JSX. The"
- md: "\ncommon solution for this problem is to use quotes around property name:\n\
    \n```javascript\nvar root = React.createElement('ul', {\n  className: 'my-list'\n\
    }, child);\n```\n\nWe haven't gone deep into the trenches of React programming\
    \ to talk about parent and child relationships between components. But because\
    \ in this example we're using the third parameter child, I wanted to say a few\
    \ words about what it means.\n\nIn the following chapters you'll see how parent\
    \ and child associations work between components. But basically, for now just\
    \ know whatever element or elements you pass as children as 3rd argument in createElement\
    \ method, will become available as \"props\" within that element through this.props.children\
    \ property.\n\nThis way you can work with children components from your parent\
    \ class. Which is usually the core of your entire app that contains all of the\
    \ secondary components. Parents can have multiple children.\n\nWe'll talk about\
    \ how props are a lot more later. For now, just know that props (or properties)\
    \ are to react components what arguments are to a function. You simply pass them\
    \ into the object as custom values required for functionality of reactive element.\n\
    \nAlso remember that you can't paste just any HTML to use it as your JSX statements.\
    \ JSX version of HTML is very similar but not 100% accurate HTML-specification.\
    \ It closely resembles it, but there are a few differences.\n\nFor reasons like\
    \ these, JSX might throw you out at first. I struggled with it for a while, but\
    \ when I realized the main purpose was to help write code faster, I thought it\
    \ made things a lot easier in the long run once I adapted to it and started using\
    \ it habitually.\n\nIt's almost like re-learning years of working with HTML standard.\
    \ The hard part is knowing limitations of JSX. Because you can get frustrated\
    \ with not knowing why things don't work when they don't, even though HTML you\
    \ use in JSX looks properly formatted.\n\nIt definitely challenges you to think\
    \ in a new way about designing some parts of your application. But bear with these\
    \ example, and eventually it will sink in and start to make a lot more sense.\n\
    \n## Props\n\nIn my previous chapter I spoke of React components. But there is\
    \ a lot more to it. Previously, we created a simple component, similar to one\
    \ that looks just like this:\n\n```javascript\nReactDOM.render(\n  <h1>Hello</h1>,\n\
    \  document.getElementById('root')\n);\n```\n\nNotice that we are typing HTML\
    \ tags `<h1>` right into render's method as an argument without surrounding quotes.\
    \ This is syntactic style offered by JSX. It will not compile in JavaScript, but\
    \ intelligent IDE's like PHPStorm are aware of JSX syntax and will not treat it\
    \ as an error.\n\nAs long as you have JSX included in your project (usually via\
    \ babel.js library or its counterpart command-line plugin, the latter being the\
    \ one I recommend using on your production server) this will compile just fine.\n\
    \nNow that we know this will work only as long as you have babel transpiler (babel.min.js)\
    \ included in your project. (In other words, don't attempt writing this in Notepad\
    \ of some folder on your \"Desktop\" for your development environment must be\
    \ properly set up in order for this to compile, or at the very least babel.js\
    \ should be included in SCRIPT tag on your page.) It uses internal JSX processor\
    \ to convert this inline HTML into JavaScript.\n\n## Function Purity\n\nBefore\
    \ we go into React props, I just wanted to mention one thing. In React props are\
    \ read-only. And this has a lot to do with a particular type of a function called\
    \ pure function. In traditional software development a pure function is one which\
    \ does not internally change arguments which are passed to it.\n\n```javascript\n\
    // pure function; does not modify argument values\nfunction sum(a, b) { return\
    \ a + b; }\n```\n\nThis is considered to be a pure function, because its body\
    \ does not modify any of the parameters that were passed as arguments. On the\
    \ other hand an example of an impure function is shown below:\n\n```javascript\n\
    // impure function; modifies value of the passed argument \"total\"\nfunction\
    \ sub(total, less) { return total -= less; }\n```\n\nIn React, props take on the\
    \ \"pure\" ideology. This means you can pass them, under the condition that your\
    \ react component will not be changing their values from within itself. This is\
    \ exactly what makes react props read-only. It is good to stick to that rule.\n\
    \nProps are derived from HTML element properties. It's a bit odd, that they are\
    \ called props. Because in HTML elements, properties are single-keyword flags\
    \ like DISABLED or CHECKED.\n\nThe better name for props would be attributes.\
    \ Because they resemble the name=value pair of HTML attributes not props. But,\
    \ that's just the way it is. React.js developers have chosen this naming convention!\
    \ Don't shoot the messenger:\n\nIf you've been following our discussion from the\
    \ previous chapter you should now know what components are. They are combinations\
    \ of HTML, CSS and JavaScript code blocks that determine functionality of one\
    \ visual area of your application. They are responsible for updating things like\
    \ feed messages, alerts and various state updates.\n\nWe also know that a component\
    \ usually has a render method to display it in your app.\n\nWorking with React.js\
    \ the next thing you will run into are props. Props are like function arguments.\
    \ Except you pass them to your component, not functions. The principle is the\
    \ same, however.\n\nLet's create a component and pass a prop to it.\n\n```javascript\n\
    // Create a Hello component\nvar Hello = React.createClass({\n  render: function()\
    \ {\n    return (\n      <div>Hello, {this.props.name}</div>\n    )\n  }\n});\n\
    // Now call it in your app\nReactDOM.render(<Hello name=\"Jason\"/>, document.getElementById(\"\
    app\"));\n```\n\n## Functional Components\n\nAbove we have demonstrated a standard\
    \ component using createClass, and contains a render method. But the following\
    \ code is actually what it's nothing more than a function:\n\n```javascript\n\
    function Hello(props) {\n  return <h1>Hello, {props.name}</h1>;\n}\n```\n\nWhat\
    \ makes it a valid component is the fact that it returns a React element. React\
    \ elements can be rendered on the screen. This is a big part of React-style programming\
    \ and it's easy to get used to. Remember that in JavaScript everything is an object,\
    \ even functions. This is why components like these are called functional components.\n\
    \n## A Wolf in Sheep's Clothing\n\nIf you know how inheritance works, well this\
    \ is how it imitated in JavaScript. I say imitated, because under the veil, JavaScript\
    \ still uses prototype-based inheritance. Which can be a blessing and a curse.\n\
    \nInheritance standards defined by JavaScript are not really real, compared to\
    \ more mature languages such as C++ or Java. In other words, you can forget creating\
    \ advanced object structures such as \"interfaces\" in JavaScript with its loose\
    \ typing.\n\nStrict programming languages are usually better at providing a fully\
    \ functional Object-Oriented Programming environment. And here, EcmaScript developers\
    \ decided to dress up JavaScript syntax a bit to make the world look a little\
    \ more like a sheep.\n\nBut most programmers agree that this syntax improves programming\
    \ in JavaScript. At least visually.\n\nOne major difference of making components\
    \ this way is access of props.name property via this keyword variable. Otherwise\
    \ it does exactly what the functional component from previous example does.\n\n\
    ```javascript\nclass Hello extends React.Component {\n  render() {\n    return\
    \ <h1>Hello, {this.props.name}</h1>;\n  }\n}\n```\n"
