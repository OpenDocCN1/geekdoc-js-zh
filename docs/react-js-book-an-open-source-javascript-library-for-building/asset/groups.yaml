  - "[PAGE 28]\n\n# PropTypes\n\nReact has a special property called PropTypes. Typechecking\
    \ is its primary purpose. As your app becomes large in size, type checking can\
    \ help catch various bugs.\n\nHere is an example. Let's say we already have a\
    \ React component created, and named ReactComponent. By default typechecking is\
    \ enabled in development mode. It is actually not turned on in production code.\n\
    \n```\nReactComponent.propTypes = {\n  name: React.PropTypes.string\n};\n```\n\
    \nWhat React.PropTypes does it turns on validation for the type of the data stored\
    \ in a property. By default React has a number of data validators, and if a Numeric\
    \ data type is passed to a prop defined as String (as shown in example above)\
    \ then you will see a warning in JavaScript developer's console in Chrome or other\
    \ browsers.\n\nThe propTypes in React are defined as follows:\n\n| any |\n| array\
    \ |\n| bool |\n| element |\n| func |\n| node |\n| number |\n| object |\n| string\
    \ |"
- md: "\n# Class Component Options\n\nWe'll speak about components a lot more throughout\
    \ the rest of the book. They are the building blocks of your react application.\
    \ But remember that this is \"React on the Palm of Your Hand\" section! Let's\
    \ briefly overview the full scope of a React component, its options and methods\
    \ available by default in React library. Components are defined by createClass\
    \ method existing on the main React object:\n\n```javascript\nvar MyComponent\
    \ = React.createClass({\n  displayName: 'MyComponent',\n\n  /* This is the core\
    \ of your React Class\n     options and lifecycle methods will be written here\
    \ */\n\n  render: function() {\n    // Once rendered, let's return a newly created\
    \ element\n    return React.createElement(/* ... * */);\n  }\n});\n```\n\nThis\
    \ is the basic structure of a component class.\n\n# Component Options\n\nComponents\
    \ hold the propTypes object and two methods that return an object:\n\n- 1. propTypes\
    \ mapping prop names to types\n- 2. getDefaultProps function returning object\n\
    - 3. getInitialState function returning object\n\n# Lifecycle Methods\n\n- 1.\
    \ componentWillMount\n- 2. componentDidMount\n-- 3. componentWillReceiveProps\n\
    - 4. shouldComponentUpdate\n- 5. componentWillUpdate\n- 6. componentDidUpdate\n\
    - 7. componentWillUnmount\n\nThese 7 methods can be implemented in your React\
    \ class. Not all components classes will require using all of the seven functions.\
    \ This will depend on your components' purpose.\n\nEach is basically an event\
    \ that executes at a particular time during the lifecycle of a React component.\
    \ Most of this functionality is to do with checking mounting and update state\
    \ of the component.\n\nIn addition to these methods, of course you can also add\
    \ your own custom functions, depending on what your component is supposed to be\
    \ doing.\n\n# Component Instances\n\nComponent instances are the instantiated\
    \ objects from the class representation we've just taken a look in the previous\
    \ section. Here are a few hints as to their implementation:\n\n- 1. The this keyword\
    \ within a component refers to itself.\n- 2. Stateless functional components do\
    \ not have component instances.\n- 3. One component instance may persist over\
    \ multiple ReactElements.\n\n# Properties\n\n- 1. Property **this.props** contains\
    \ any props passed to React.createElement through tag attributes.\n- 2. The **this.state**\
    \ property contains state set by setState and getInitialState methods.\n\n# Methods\n\
    \n- 1. setState(changes) applies the given changes to this.state for re-rendering\
    \ the DOM component.\n- 2. forceUpdate() immediately re-renders the component\
    \ to the DOM.\n\n# Gems\n\nIn this section I will present several \"gems\" that\
    \ expand on reactive programming with a few explanations of important principles.\
    \ Each gem is a focused discussion on a particular subject.\n\n# Gem 1 - React\
    \ Components\n\nComponents are the building blocks of React applications.\n\n\
    Because React is primarily used with the application view (the interactive User\
    \ Interface dynamics) in mind, React components can be thought of as visual blocks\
    \ that your web application is composed of. React treats each component as a reusable\
    \ template.\n\nIn React, each component is a bundle of HTML, CSS and JavaScript\
    \ code which identifies one particular block of your application.\n\nFor example,\
    \ here is my Twitter page @gregsidelnikov looked at from the vantage point of\
    \ React components.\n\nProgrammatically, React components follow in the foot tracks\
    \ of nested HTML tags. They have parent and children, and the parent can also\
    \ be a child of another component up the hierarchy chain.\n\n![parent component\
    \ nested components](img/05b8b68e82424c98c0b61100a18147b2_35_0.png)\n\nThink of\
    \ component design as the blueprint of your entire application. Before you start\
    \ writing the first line of code in your reactive application, it's a great idea\
    \ to map it all out on a piece of paper. It's just an intuitive way of thinking\
    \ about your page design as a web application with unique elements.\n\nAnd just\
    \ like the first time you were learning about regular DOM back in the day and\
    \ realizing that each HTML element (such as P, DIV, TABLE and others) is actually\
    \ an object in a long tree-like chain of the Object Model, think of react components\
    \ as visual areas that are also tied to some sort of software function. This time,\
    \ this functionality will be custom-determined by you and the requirements of\
    \ your application.\n\nFrom these fundamentally basic principles of React, you\
    \ can now see why Facebook and Instagram love using it. It's lightning-fast, it\
    \ helps break down feed-like elements into software blocks composed of components\
    \ which are just bundles of CSS, HTML and JavaScript code. This design model is\
    \ a lot more in touch with app-like behavior rather than just informational websites\
    \ that use table-like layouts.\n\nComponents are hierarchical. They can be children\
    \ of other components. For the most part, components are tailored for reuse in\
    \ your application. They contain patterns of code that can be adapted to a wide\
    \ variety of cases. React code usually follows a pattern of creating chains of\
    \ these components that work one within another, while retaining fast rendering\
    \ speed and flexibility.\n\n# Gem 2 - Render Method\n\nChances are that to some\
    \ degree, you've already split up your app into compartments when you were building\
    \ regular HTML-JavaScript applications. Then, you used Ajax events to populate\
    \ each view separately, based on what type of data changed in each HTML cell.\n\
    \nBut React takes this approach one step further by requiring render() method.\
    \ The render method must be attached to each React component you create. There\
    \ is no way around it. It's part of the pattern that React components demand that\
    \ is being used.\n\nEven though React is so much more than the view layer - making\
    \ the render method explicit to programming with React, the reason why React is\
    \ often considered to be view-based library. We will see this is true throughout\
    \ the book, but also why this isn't entirely true.\n\nThis isn't fair to say that\
    \ React programming is necessarily view-only. In fact, the choice of render targets\
    \ tells us the opposite. React is a programming pattern follows follows philosophy\
    \ that actually doesn't require a view.\n\nYou can render results of a react component\
    \ either to a browser or to a string of text (using a method made for that, React.render())\
    \ JSON object or anywhere you wish. In this case rendering isn't rendering at\
    \ all. Because the word render implies visualization of data. So React is more\
    \ like a set of principles, rather than \"a way to make User Interfaces\" as many\
    \ beginners tend to believe before brief familiarity with the library.\n\nWhile\
    \ you can use any third party library in addition to React, for example database\
    \ IO libraries, React still offers a lot in the way of custom programming that\
    \ goes behind the view elements. In fact, it demands that you understand how these\
    \ principles work.\n\nThe method render() which is usually attached to the React's\
    \ own \"virtual\" DOM is the method that will be executed when your application\
    \ is loaded into the browser for the first time. And consequently, only when the\
    \ data in the element it represents should be updated. However, this is where\
    \ it gets interesting. Until the render method is called, the react's component\
    \ isn't even \"mounted\" to the actually JavaScript DOM, nor will it be displayed.\
    \ And it's possible to create React components without mounting them. We'll cover\
    \ mounting in greater detail in Gem 6.\n\nWe know that render triggers an update\
    \ of the data set (or state of the component). But when should the data be updated?\
    \ This will depend on the type of data shown in your components but also a few\
    \ generic function that are responsible for updating it at key times while it's\
    \ being used. Later in the book we'll get to the functions responsible for giving\
    \ us control over these events.\n\nIn a real scenario, the elements themselves\
    \ could be an alert icon notifying the end-user of an increase in number of incoming\
    \ alerts, the number of profile followers or profile views.\n"
  mdcn: "\n\n# 类组件选项\n\n在本书的后续章节中，我们将更多地讨论组件。它们是你的 React 应用的构建块。但请记住，这毕竟是“指掌上的 React”章节！让我们简要概述\
    \ React 组件的完整范围，以及 React 库默认提供的选项和方法。组件通过存在主 React 对象上的 `createClass` 方法定义：\n\n\
    ```javascript\nvar MyComponent = React.createClass({\n  displayName: 'MyComponent',\n\
    \n  /* 这是你 React 类的核心\n     选项和生命周期方法将写在这里 */\n\n  render: function() {\n    //\
    \ 一旦渲染，返回一个新创建的元素\n    return React.createElement(/* ... * */);\n  }\n});\n```\n\
    \n这是组件类的基本结构。\n\n# 组件选项\n\n组件持有 `propTypes` 对象和两个返回对象的方法：\n\n- 1. `propTypes`：将属性名映射到类型\n\
    - 2. `getDefaultProps`：返回一个对象的函数\n- 3. `getInitialState`：返回一个对象的函数\n\n# 生命周期方法\n\
    \n- 1. componentWillMount\n- 2. componentDidMount\n-- 3. componentWillReceiveProps\n\
    - 4. shouldComponentUpdate\n- 5. componentWillUpdate\n- 6. componentDidUpdate\n\
    - 7. componentWillUnmount\n\n这 7 个方法可以在你的 React 类中实现。并不是所有的组件类都需要使用所有七个函数，这取决于你组件的用途。\n\
    \n每个方法基本上都是在 React 组件生命周期期间特定时间执行的事件。这些功能大部分都与检查组件的挂载和更新状态有关。\n\n除了这些方法外，你当然也可以根据组件预期的功能添加你自己的自定义函数。\n\
    \n# 组件实例\n\n组件实例是从我们在上一节中看到的类表示的实例化对象。以下是关于它们实现的一些提示：\n\n- 1. 组件内部的 `this` 关键字指向它。\n\
    - 2. 无状态函数组件没有组件实例。\n- 3. 一个组件实例可能会跨越多个 ReactElements 。\n\n# 属性\n\n- 1. 属性 **this.props**\
    \ 包含了通过标签属性传递给 `React.createElement` 的任何 props。\n- 2. **this.state** 属性包含由 `setState`\
    \ 和 `getInitialState` 方法设置的状态。\n\n# 方法\n\n- 1. `setState(changes)` 将给定的更改应用到 `this.state`\
    \ 以重新渲染 DOM 组件。\n- 2. `forceUpdate()` 立即重新渲染组件到 DOM。\n\n# 秘籍 (Gems)\n\n在本节中，我将介绍几个扩展响应式编程的“秘籍”，并对重要的原则进行一些解释。每个秘籍都是对特定主题的集中讨论。\n\
    \n# 秘籍 1 - React 组件\n\n组件是 React 应用的构建块。\n\n由于 React 主要考虑到应用视图（交互式用户界面动态），React\
    \ 组件可以被认为是你的 Web 应用程序组合的视觉区块。React 将每个组件视为可重用的模板。\n\n在 React 中，每个组件都是 HTML、CSS\
    \ 和 JavaScript 代码的组合，标识了你应用程序中的一个特定区块。\n\n例如，这里是从 React 组件的角度查看我的 Twitter 页面 @gregsidelnikov。\n\
    \n在程序上，React 组件遵循嵌套 HTML 标签的足迹。它们有父元素和子元素，父元素也可以是层次链中另一个组件的子元素。\n\n![父组件嵌套组件](img/05b8b68e82424c98c0b61100a18147b2_35_0.png)\n\
    \n将组件设计想象成你整个应用的蓝图。在你开始为响应式应用编写第一行代码之前，在纸上勾勒出一切是非常好的主意。这是一种直观的思考方式，将你的页面设计成具有独特元素的\
    \ Web 应用程序。\n\n就像你当年第一次学习普通的 DOM 并意识到每个 HTML 元素（如 P、DIV、TABLE 等）实际上是对象模型中长长树状链中的一个对象一样，请将\
    \ React 组件看作与某种软件功能绑定的视觉区域。这次，这种功能将由你和你的应用程序需求自定义决定。\n\n从 React 的这些最基础的原理中，你现在可以理解为什么\
    \ Facebook 和 Instagram 喜欢使用它。它是极快的，它帮助将类似流式的元素拆解为由组件组成的软件块，而这些组件只是 CSS、HTML 和\
    \ JavaScript 代码的组合。这种设计模型更贴近应用行为，而不是仅仅是使用表格类布局的信息性网站。\n\n组件是层次级化的。它们可以是其他组件的子元素。在大多数情况下，组件是为你的应用程序中的复用而定制的。它们包含了可以适应各种情况的代码模式。React\
    \ 代码通常遵循创建这些组件链的模式，它们在内部工作，同时保持快速的渲染速度和灵活性。\n\n# 秘籍 2 - Render 方法\n\n很有可能在你构建普通的\
    \ HTML-JavaScript 应用时，你已经在某种程度上将应用拆分成了不同的隔间。然后，你使用 Ajax 事件根据每个 HTML 单元中更改的数据类型来单独填充每个视图。\n\
    \n但 React 通过要求 `render()` 方法更进了一步。`render` 方法必须附加到你创建的每个 React 组件上。没有办法绕过它。这是\
    \ React 组件所要求的模式的一部分。\n\n尽管 React 远不止视图层——让渲染方法在 React 编程中显式化——正是 React 经常被认为是基于视图的库的原因。我们将在整书中看到这是正确的，但为什么这并不完全正确。\n\
    \n说 React 编程仅仅是关于视图的是不公平的。事实上，渲染目标的选择告诉我们相反的结论。React 是一种遵循实际上不需要视图哲学的编程模式。\n\n\
    你可以将 React 组件的结果渲染到浏览器或渲染到文本字符串（使用专门为此设计的方法 `React.render()`）、JSON 对象或你希望任何地方。在这种情况下，渲染根本不是渲染。因为“渲染（render）”一词意味着数据的可视化。所以\
    \ React 更像是一组原则，而不是许多初学者在简单熟悉该库之前倾向于认为的“创建用户界面的方法”。\n\n虽然你可以在 React 之外使用任何第三方库（例如数据库\
    \ IO 库），但 React 在视图元素背后的自定义编程方面仍然提供了很多内容。事实上，它要求你理解这些原理是如何运作的。\n\n通常附加到 React\
    \ 自己的“虚拟”DOM 上的 `render()` 方法是当你的应用程序首次加载到浏览器时执行的方法。因此，只有当它代表的元素中的数据应该更新时，才会执行。然而，这正是有趣的地方。在\
    \ `render` 方法被调用之前，React 组件甚至没有“挂载”到实际的 JavaScript DOM 上，也不会显示。而且你可以在不挂载的情况下创建\
    \ React 组件。我们将在秘籍 6 中详细介绍挂载。\n\n我们知道 `render` 会触发数据集（或组件状态）的更新。但什么时候应该更新数据呢？这取决于组件中显示的数据类型，但也取决于一些在使用过程中关键时间负责更新它的通用函数。在书的后面部分，我们将接触负责控制这些事件的函数。\n\
    \n在真实场景中，元素本身可以是警报图标，通知最终用户警报数量的增加、关注者数量或个人资料查看量。\n\n"
