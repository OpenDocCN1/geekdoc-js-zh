    # What are Arrow Functions in JavaScript?


    And what is the difference between an arrow function and anonymous functions in
    JavaScript?


    An arrow function in JavaScript is an anonymous function with shortened syntax.
    The only two differences vs standard anonymous function is in syntax and how this
    object is treated within its scope. A small detail, which changes in how the two
    actually operate when it comes to binding of this object.


    Let''s compare a regular JavaScript anonymous function with an arrow function
    equivalent. We already know what anonymous functions like function(){...} in JavaScript
    look like. But arrow functions actually have a distinct syntax.


    Notice that both exactly do the same thing, execute some code. Except arrow functions
    automatically take care of the cumbersome/that juggling we have just experienced
    in the previous examples. Arrow functions create their own this object that doesn''t
    change. So we never have to rename or bind it to another variable as that, like
    in previous example.


    This is the new syntax in EcmaScript 6 that defines new arrow function in JavaScript:


    ```

    () => {};

    ```


    A word of caution. Arrow functions in JavaScript do not work with "new" operator.
    They are anonymous and are usually used for events.


    But there also exist syntactic variations:


    ```

    (a, b) => { ... } // Multiple parameters

    a => { ... } // Single parameter

    ```


    Note that params can include a set of multiple parameters separated by comma,
    In which case you must always use parenthesis. For single parameter syntax, you
    don''t have to use parenthesis.'
