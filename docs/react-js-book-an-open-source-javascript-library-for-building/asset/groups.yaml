  mdcn: "\n我们将暂时放下 gem 格式，因为这本书的第一部分设计初衷是为了让你熟悉 React 编程和现代软件开发的最常用原则。\n\n这些理论将帮助我们研究使用\
    \ React 库进行编程的实践。所以，让我们开始吧，从编写我们的第一个 React 组件开始。\n\n## Lesson 1 - 编写你的第一个 React\
    \ 组件\n\n下面你看到的是你可能编写的第一个 React 组件的紧凑示例。它只是将通用的“Hello World”消息渲染到 DIV 元素中。而且它只需要一行代码。\n\
    \n```javascript\nReact.Classes({render: function() {\n  return (\n    <div>Hello\
    \ World.</div>\n  )\n}\\});\n```\n\n在这里，我们正在使用 React 库主对象的方法 `createClass`。这就是创建组件的方式。但这段蓝色的代码是什么呢？它看起来像\
    \ HTML，但周围没有用双引号包围！\n\n组件通常存储在变量中。\n\n例如：\n\n```javascript\nvar HelloWorld = React.createClass({\
    \ .. });\n```\n\n将组件存储在变量名中可以帮助我们在以后创建元素之间创建父子关联。这只是是一种用以编程方式在嵌套组件之间建立关系的方法。\n\
    \n如果你来自传统的 JavaScript 程序员背景，这段代码中的某些部分可能会有些奇怪。高亮显示的 JSX 代码似乎格格不入。\n\n但请记住，React\
    \ 编程与使用额外工具相关。React 库本身应该只是你整个应用程序的一部分。没有人会只用 React 库来编写 React 应用。它只是墙上的其中一块砖。\n\
    \n在 React 中，我们可以在 JavaScript 内部编写 HTML。这是我们多年来习惯的传统的“HTML 内部编写 JavaScript”思想的反转，例如，我们将\
    \ JavaScript 写在 HTML 的属性标签中（如 `onclick = \"this.style.color='red'\"`）。\n\n但 React\
    \ 给了我们反相反的能力。我们将随着学习的深入而发现原因。现在，让我们扩展一下组件创建，然后我将简要解释 JSX 如何帮助我们处理 HTML 块并将其视为返回值。\n\
    \n话虽如此……让我们进入第一个 React 组件的完整示例，并在特定的 HTML 元素中渲染它的内容：\n\n```javascript\n// 添加所需的库代码\n\
    var React = require(\"react\");\nvar ReactDOM = require(\"react-dom\");\n\n//\
    \ 创建我们的第一个 react 组件 \"HelloWorld\"\nvar HelloWorld = React.createElement({\n \
    \ render: function() {\n    return (\n      <div>\n        Hello World.\n    \
    \  </div>\n    )\n  }\n});\n\n// 在 id 为 \"app\" 的 HTML 元素内部绘制 \"HelloWorld\" 组件\n\
    ReactDOM.render(<HelloWorld />, document.getElementById(\"app\"));\n```\n\n注意，我们新创建的组件\
    \ HelloWorld 有它自己的 `render` 方法。但作为主要渲染引擎的 ReactDOM 对象也有它自己的 `render` 方法。两者之间的联系是\
    \ `ReactDOM.render` 调用了 `render` 方法作为第一个参数。在这种情况下，这个参数就是我们的 `HelloWorld`。\n\n\
    在这里，首先包含了上述 React 和 ReactDOM 库。当你从零开始一个新的响应式应用时，你需要这样做。这就是初始化 React 的方式。\n\n接下来，一旦我们在项目中包含了\
    \ React，我们将使用 `React.createClass` 方法创建一个 React 类的新实例。这并不是初始化 React 应用的唯一方法，但在本章中我们将坚持使用这个示例。\n\
    \n最后，我们调用了 ReactDOM 自己的 `.render` 方法。而 `<HelloWorld/>` 是我们分配给古老 React 代码的变量 `HelloWorld`。基本上，React\
    \ 的 `render` 方法接收两个参数。\n\n你只需要将想要渲染的内容作为第一个参数，将你想要渲染的位置作为第二个参数（在本例中是 ID 为 \"app\"\
    \ 的 HTML 元素）。所以从现在起，任何赋值给 `HelloWorld` 变量的内容都将被渲染在像 `[div id = \"app\"]` 这样的元素中。\n\
    \n这就是 React 编程背后的基本思想。你构建组件并让它们在特定的元素内执行操作。我们构建组件并让它们在 HTML 中工作。虚拟 DOM 会自动处理这些视图。\n\
    \n但还有一点……\n\n这是一个误解点，JSX 没有内联 CSS 解析器。所以虽然你可以使用带属性的 HTML 元素，但 *style* 属性将不是其中之一。你仍然可以使用像\
