    \ index) {\n      return <Child onClick={this.handleChildClick.bind(null,data)}\
    \ \n      text={data.childData.childText} />;\n    }).bind(this);\n    return\
    \ <div>{children}</div>;\n  },\n  handleChildClick: function( event ) {\n    //\
    \ In this method, you can access props\n    // that were passed to the Child,\
    \ Using this.state property\n    var child_text = this.state.childText;\n    var\
    \ target = event.target;\n  }\n});\n```\n\nNow, I purposely created these generic\
    \ examples to show you the association between child and parent, because it's\
    \ not as trivial as simply nesting HTML elements in one another. In react, this\
    \ link is established programmatically, as shown in the examples above.\n\nIn\
    \ a real scenario, you will be building components that represent actual elements\
    \ in your application, like alerts, friends lists, messages, comments and buttons.\
    \ But these examples that were shown here are the basic building blocks of reactive\
    \ programming."
- md: "\nI know it seem like a hassle to learn all of this, but really, once you program\
    \ a few of these components, you will see the versatility of React, because it's\
    \ like embedding custom programming into your everyday HTML elements, having full\
    \ control over the data flow, and utilizing Virtual DOM which is lightning fast\
    \ at updating only areas of applications that need updating.\n\nI hope you enjoyed\
    \ this tutorial and it has proven to be insightful. I talk a lot more about these\
    \ things in my new book React Gems, which is just about to come out.\n\n# Lesson\
    \ 3 - Handling Component Events\n\nUp until this point we have only looked at\
    \ basic composition of React programs. We've created components and looked at\
    \ their internal structure.\n\nIn this lesson we will go deeper into the structure\
    \ and functionality of React Components. In addition to render, we will explore\
    \ three new methods, each executing at a distinct time during the life of a component.\
    \ This gives us increased creative control over the application.\n\nAlways remember\
    \ that a React component has state. The whole purpose of components is to be tied\
    \ to a custom state represented by that component's object. A state is an object\
    \ with data. But components also have helper functions that make it easier to\
    \ control how these states will work in a given context.\n\nIn this lesson we\
    \ will take a look at some of these methods.\n\n# Method 1 - getInitialState\n\
    \nEach component is in charge of rendering its own state but the method getInitialState\
    \ is always called before our render function. This has similar functionality\
    \ to an object constructor function. Here we set the default values.\n\n```\n\
    var Example = React.createClass({\n  getInitialState: function() {\n    return\
    \ {\n      state: 0;\n    }\n  }\n});\n```\n\nYou'll often see getInitialState\
    \ used throughout React components. It resets the default value tied to the component.\
    \ Here you could read values from a database or reset state to its default value\
    \ before rendering this component on the screen.\n\nYou can use this method interchangeably\
    \ with the default constructor method provided in EcmaScript 6:\n\n```javascript\n\
    class Example extends React.Component {\n  constructor(props) {\n    super(props);\n\
    \    this.state = { state: 0 };\n  }\n}\n```\n\nThe only other notable difference\
    \ here is that we're using the this keyword to attach state to the main object.\n\
    \nTo access the state when the component is rendered on the screen we must use\
    \ componentDidMount method:\n\n# Method 2 - componentDidMount\n\ncomponentDidMount\
    \ is called automatically by React when a component is rendered. By adding it\
    \ to your custom React component, you are overloading it. Overloading means, adding\
    \ your own functionality to the method that already exists in the default React\
    \ component object, from which you are extending your custom component. That's\
    \ the whole purpose of using extend keyword. We're extending default functionality\
    \ of React's component object already provided by the library.\n\nWhen I first\
    \ heard of \"mounting\" function within my React component, I didn't understand\
    \ what it meant. Are we not simply attaching a bunch of helper methods to our\
    \ primary React component?\n\nWe've already spoken of mounting earlier in the\
    \ book. If you still need to brush up on the process, I recommend making sure\
    \ you've gone over Gem 6 - Component Mounting previously discussed.\n\ncomponentDidMount\
    \ is the method responsible for setting the state after component has been mounted.\n\
    \n```\nvar Example = React.createClass({\n  componentDidMount: function() {\n\
    \    this.state = 1;\n  }\n});\n```\n\nIt simply means that the virtual DOM has\
    \ become associated with a DOM node that will be actually updated on the screen.\
    \ This method is always called after executing render command from the component.\
    \ They are synonymous and can probably be used interchangeably. It ensures and\
    \ tells us that the element actually exists within virtual DOM. The render method\
    \ has already been called on it!\n\n# Method 3 - componentWillUnmount\n\nAnd finally,\
    \ componentWillUnmount is called just before the component is removed from the\
    \ page and is about to be destroyed.\n\n```\nvar Example = React.createClass({\n\
    \  componentWillUnmount: function() {\n    this.state = null;\n  }\n});\n```\n\
    \nNotice, we're resetting the state back to null. The component is destroyed and\
    \ we no longer need its data. This is the place where we would clean up memory\
    \ used by your component, if any. For example uninitializer timers.\n\n# Example\
    \ of a Complete Application written in React\n\nWe've covered enough principles\
    \ to write a complete React application. I intentionally tried to make all examples\
    \ in this book simple. Complexity usually comes from getting creative with programming,\
    \ and if I dumped a large program into this book, you would probably have a discouraging\
    \ effect rather than motivational.\n\nHere, I will build a simple search app that\
    \ looks up results from an array set. If the typed characters match anything on\
    \ the list, they will be filtered out and all other entries be dismissed.\n\n\
    This app is at like the Google search auto-look feature where items drop down\
    \ as you type your phrase into the query input box. Below I'm listing the full\
    \ source code.\n\nHere, I am not going to include Cascading Style Sheet part of\
    \ the app. This can be taken care of separately. We want to focus strictly on\
    \ the React implementation.\n\nThe app is surprisingly compact in comparison to\
    \ everything you'd have to do using standard JavaScript code, provided it actually\
    \ does.\n\n# Searching List\n\nLet's create the list of potential search results\
    \ by using object literal format in JavaScript:\n\n```javascript\n// First, let's\
    \ define the list of all searchable animals\nvar libraries = [\n  { name: 'Wolf',\
    \ url: 'http://localhost/wolf' },\n  { name: 'Panther', url: 'https://localhost/panther'\
    \ },\n  { name: 'Fox', url: 'http://localhost/fox' },\n  { name: 'Giraffe', url:\
    \ 'http://localhost/giraffe' },\n  { name: 'Elephant', url: 'http://localhost/elephant'\
    \ },\n  { name: 'Ferret', url: 'http://localhost/ferret' },\n  { name: 'Lion',\
    \ url: 'http://localhost/lion' },\n  { name: 'Lioness', url: 'http://localhost/lioness'\
    \ },\n  { name: 'Tiger', url: 'http://localhost/tiger' },\n  { name: 'Tigress',\
    \ url: 'http://localhost/tigress' },\n  { name: 'Cat', url: 'http://localhost/cat'\
    \ },\n  { name: 'Dog', url: 'http://localhost/dog' }\n];\n```\n\n# Writing the\
    \ React Application\n\n```javascript\n// Let's create our search component\nvar\
    \ SearchComponent = React.createClass({\n  // Reset input element to a blank space\n\
    \  getInitialState: function() {\n    return {searchString: \"\" };\n  },\n\n\
    \  handleChange: function(e) {\n    // Commenting the following line out, will\
    \ result in the text box not changing\n    // value, because React input boxes\
    \ cannot change independently of the value\n    // that was assigned to it. In\
    \ this case it's the this.searchString.\n    this.setState({searchString: e.target.value});\n\
    \  }\n});\n```\n\n```javascript\n// Render component\nrender: function() {\n \
    \ var libraries = this.props.items,\n  searchString = this.state.searchString.trim().toLowerCase();\n\
    \  if (searchString.length > 0) {\n    // We are searching. Filter the results\n\
    \    libraries = libraries.filter(function(l) {\n      return l.name.toLowerCase().match(searchString);\n\
    \    });\n  }\n  // Return this component as a JSX statement\n  return <div>\n\
    \    <input type=\"text\"value={this.state.searchString} onChange={this.handleChange}\
    \ placeholder=\"Type here\" />\n    <ul>\n      {libraries.map(function(l) {\n\
    \        return <<li>{l.name} <a href={l.url}>{l.url}</a></li>;\n      })}\n \
    \   </ul>\n  </div>\n}}\n```\n\n```javascript\n// Render the SearchComponent component\
    \ on the page\nReactDOM.render(\n  <SearchComponent items={libraries} />,\n  document.getElementById('container')\n\
    );\n```\n\nPlace this code in the main .js file of your application and run it.\
    \ It will result in basic drop functionality. Typing partial animal names will\
    \ filter them out from the list. Ideally, you would load this list from a database\
    \ or some other data storage mechanism.\n\nAs you can see, depending on the type\
    \ of an application you are designing (and in this case, the application is very\
    \ simple) you may or not use any of the mounting or updating methods just based\
    \ on the\n"
  mdcn: "\n我知道学习所有这些内容似乎很麻烦，但实际上，一旦你编写了其中几个组件，你就会看到 React 的多功能性，因为它就像是将自定义编程嵌入到你日常的\
    \ HTML 元素中，对数据流拥有完全控制权，并利用虚拟 DOM，它在更新应用程序需要更新的区域时极快。\n\n我希望你喜欢这个教程，并且它对你很有启发。在我的新书《React\
    \ Gems》中，会有更多关于这些的内容，这本书即将出版。\n\n# 第 3  - 处理组件事件\n\n到目前为止，我们只查看了 React 程序的节点组合。我们创建了组件并查看了它们的内部结构。\n\
    \n在本节中，我们将深入深入研究 React 组件的结构和功能。除了 `render` 之外，我们将探索三个新方法，每个方法在组件生命周期中的不同时间执行。这赋予了我们对应用程序更大的创造性控制力。\n\
    \n始终记住，React 组件具有状态（state）。组件的完全目的是与该组件对象所代表的自定义状态绑定。状态是一个包含数据的对象。但组件还具有辅助函数，这些函数可以更容易控制这些状态在特定上下文中如何工作。\n\
    \n在本节中，我们将查看其中的一些方法。\n\n# 方法 1 - getInitialState\n\n每个组件都负责渲染自己的状态，但 `getInitialState`\
    \ 方法总会在我们的 `render` 函数之前被调用。它的功能类似于对象的构造函数。在这里，我们设置默认值。\n\n```\nvar Example =\
    \ React.createClass({\n  getInitialState: function() {\n    return {\n      state:\
    \ 0;\n    }\n  }\n});\n```\n\n你经常会在整个 React 组件中看到 `getInitialState`。它会重置绑定到组件的默认值。在这里，你可以从数据库读取值，或者在将此组件渲染到屏幕之前将状态重置为默认值。\n\
    \n你可以将此方法与 ECMScript 6 提供的默认构造方法交叉使用：\n\n```javascript\nclass Example extends\
    \ React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = { state: 0 };\n  }\n}\n```\n\n这里唯一的显著区别是我们正在使用 `this` 关键字将状态挂载到主对象上。\n\n要在组件渲染到屏幕上时访问状态，我们必须使用\
    \ `componentDidMount` 方法：\n\n# 方法 2 - componentDidMount\n\n当组件渲染时，React 会自动调用\
    \ `componentDidMount`。通过将其添加到自定义的 React 组件中，你对其进行了重载（overloading）。重载意味着向你正在扩展的自定义组件的默认\
    \ React 组件对象中已有的方法添加你自己的功能。这就是使用 `extend` 关键字的全部目的。我们正在扩展库已经提供的 React 组件对象的默认功能。\n\
    \n当我第一次在 React 组件中听到“挂载（mounting）”函数时，我不理解它的意思。难道我们不是简单地为我们的主要 React 组件挂载一堆辅助方法吗？\n\
    \n我们在书的前面的部分已经提到过挂载。如果你仍然需要复习这个过程，我建议确保你已经复过了之前讨论过的“Gem 6 - 组件挂载”。\n\n`componentDidMount`\
    \ 是负责在组件挂载后设置状态的方法。\n\n```\nvar Example = React.createClass({\n  componentDidMount:\
    \ function() {\n    this.state = 1;\n  }\n});\n```\n\n它简单意味着虚拟 DOM 已经与一个将在屏幕上进行实际更新的\
    \ DOM 节点相关起来。该方法在执行完组件的 `render` 命令后总是被调用的。它们是同义词，可能可以互换使用。它确保并告诉我们元素实际上存在于虚拟\
    \ DOM 中。`render` 方法已经在它上面调用过了！\n\n# 方法 3 - componentWillUnmount\n\n最后，`componentWillUnmount`\
    \ 在组件从页面移除并即将销毁之前被调用。\n\n```\nvar Example = React.createClass({\n  componentWillUnmount:\
    \ function() {\n    this.state = null;\n  }\n});\n```\n\n注意，我们正在将状态重置为 `null`。组件被销毁了，我们不再需要它的数据。这就是我们清理组件所用内存（如果有的话）的地方，例如取消初始化的定时器。\n\
    \n# 用 React 编写的完整应用程序示例\n\n我们已经涵盖了足够编写完整 React 应用程序的原则。我刻意让书中的所有示例都保持简单。复杂性通常来自编程中的创意发挥，如果我把一个大型程序丢进这本书里，对你来说可能会产生挫败感，而不是激励作用。\n\
    \n在这里，我将构建一个简单的搜索应用，它可以从数组集中查找结果。如果输入的字符与列表中的任何项匹配，它们将被过滤掉，所有其他条目将被忽略。\n\n这个应用就像\
    \ Google 搜索的自动查找功能，当你向查询输入框输入短语时，项目会下拉显示。下面我列出了完整的源代码。\n\n在这里，我将不包含应用程序的级联样式表（CSS）部分。这可以单独处理。我们希望严格关注\
    \ React 的实现。\n\n与你使用标准 JavaScript 代码需要做的所有事情相比，这个应用程序异常地紧凑，如果它真的能实现的话。\n\n# 搜索列表\n\
    \n让我们使用 JavaScript 中的对象字面量格式创建潜在搜索结果列表：\n\n```javascript\n// 首先，让我们定义所有可搜索动物列表\n\
    var libraries = [\n  { name: 'Wolf', url: 'http://localhost/wolf' },\n  { name:\
    \ 'Panther', url: 'https://localhost/panther' },\n  { name: 'Fox', url: 'http://localhost/fox'\
    \ },\n  { name: 'Giraffe', url: 'http://localhost/giraffe' },\n  { name: 'Elephant',\
    \ url: 'http://localhost/elephant' },\n  { name: 'Ferret', url: 'http://localhost/ferret'\
    \ },\n  { name: 'Lion', url: 'http://localhost/lion' },\n  { name: 'Lioness',\
    \ url: 'http://localhost/lioness' },\n  { name: 'Tiger', url: 'http://localhost/tiger'\
    \ },\n  { name: 'Tigress', url: 'http://localhost/tigress' },\n  { name: 'Cat',\
    \ url: 'http://localhost/cat' },\n  { name: 'Dog', url: 'http://localhost/dog'\
    \ }\n];\n```\n\n# 编写 React 应用\n\n```javascript\n// 创建搜索组件\nvar SearchComponent\
    \ = React.createClass({\n  // 将输入元素重置为空\n  getInitialState: function() {\n   \
    \ return {searchString: \"\" };\n  },\n\n  handleChange: function(e) {\n    //\
    \ 注释下面这一行将导致输入框不变化\n    // 因为 React 输入框无法独立于赋值给它的值变化\n    // 在这种情况下是 this.searchString。\n\
    \    this.setState({searchString: e.target.value});\n  }\n});\n```\n\n```javascript\n\
    // 渲染组件\nrender: function() {\n  var libraries = this.props.items,\n  searchString\
    \ = this.state.searchString.trim().toLowerCase();\n  if (searchString.length >\
    \ 0) {\n    // 我们正在搜索。过滤结果\n    libraries = libraries.filter(function(l) {\n \
    \     return l.name.toLowerCase().match(searchString);\n    });\n  }\n  // 作为\
    \ JSX 语句返回此组件\n  return <div>\n    <input type=\"text\"value={this.state.searchString}\
    \ onChange={this.handleChange} placeholder=\"在此输入\" />\n    <ul>\n      {libraries.map(function(l)\
    \ {\n        return <<<li>{l.name} <a href={l.url}>{l.url}</a></li>;\n      })}\n\
    \    </ul>\n  </div>;\n}}\n```\n\n```javascript\n// 在页面上渲染 SearchComponent 组件\n\
    ReactDOM.render(\n  <SearchComponent items={libraries} />,\n  document.getElementById('container')\n\
    );\n```\n\n将此代码放置在应用程序的主 .js 文件中并运行。它将产生基本的下拉功能。输入部分动物名称将从列表中过滤掉。理想情况下，你将从数据库或其他数据存储机制加载此列表。\n\
    \n正如你所看到的，取决于你正在设计的应用程序类型（在这种情况下，应用程序非常简单），你可能会或不使用任何挂载或更新方法，仅仅取决于\n\n"
