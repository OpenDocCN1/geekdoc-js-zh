  - "[PAGE 44]\n\n# Gem 5 - States & Life Cycles\n\nIn React, each component has a\
    \ state. A state is an object with values. A state is exactly what it sounds like.\
    \ It's the state of that component in terms of one or more flags, parameters and\
    \ settings usually specified by numerics, booleans, arrays or maps.\n\nThe Life\
    \ Cycle of a React component has a lot to do with states. And React provides several\
    \ default methods that help us write helper applications. These methods are briefly\
    \ outlined below.\n\nEach component will usually control its own states via following\
    \ helper methods. They are designed to modify or update component's state at a\
    \ unique time during the application flow or component's Life Cycle.\n\nAll of\
    \ these methods are attached to the component's object like shown below. This\
    \ is just a brief example demonstrating the placement of these methods within\
    \ your React object.\n\nLet's take a look!\n\n```\nvar MyComponent = React.createServer({\n\
    \  displayName: 'MyComponent',\n\n  // This is almost like a component's constructor!\n\
    \  getInitialState: function() { ... },\n\n  // Component mounting events\n  componentWillMount:\
    \ function() { ... },\n  componentDidMount: function() { ... },\n  componentWillUnmount:\
    \ function() { ... },\n\n  // Component updating events\n  componentWillReceiveProps:\
    \ function() { ... },\n  componentWillUpdate: function() { ... }\n\n```"
- md: "\n```javascript\ncomponentDidUpdate: function() { ... },\nshouldComponentUpdate:\
    \ function() { ... };\n\n// Render the component to the DOM\nrender: function()\
    \ { /* return something */ }\n};\n```\n\nThat's a whole lot of Wills and Dids.\
    \ But what do they all mean?\nThese methods are like the command center of our\
    \ component!\nBelow I'll provide brief descriptions for events during the lifetime\
    \ of a component each one of these methods is responsible for.\n\ncomponentWillInitialState\
    \ functions like component constructor. It is called before the component is rendered\
    \ on the screen.\n\ncomponentWillMount called before render() method just once.\
    \ It is never called again throughout component's life cycle. Sometimes used synonymously\
    \ as component's constructor method.\n\ncomponentDidMount called just after the\
    \ component has been rendered for the first time.\n\ncomponentWillUnmount called\
    \ when the component is about to be destroyed. This is a place to clean up memory\
    \ and delete state.\n\ncomponentWillReceiveProps is called when props are passed\
    \ to the component. For example if you have Form component and TextInput component\
    \ that allows user to change its value by typing text into it. Imagine if TextInput\
    \ has an onChange event that passes in some props to the component. Soon as the\
    \ new text is entered into the input field, the value is passed to the main component\
    \ as props. This is the moment when componentWillReceiveProps is triggered.\n\n\
    componentWillUpdate is called right before the render method is executed on a\
    \ component. It gives us a chance to handle any state changes before next render\
    \ update.\n\ncomponentDidUpdate is called soon after render() method has finished\
    \ updating the DOM.\n\nshouldComponentUpdate is a default method that always returns\
    \ true. We give control over whether the component's element should update in\
    \ DOM. This isn't always the case. For example, if the new results of some state\
    \ or property in a component equals the value of what it was previously set to\
