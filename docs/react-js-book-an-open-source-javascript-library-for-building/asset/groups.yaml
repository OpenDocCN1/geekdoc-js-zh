  - '[PAGE 93]


    # The new const keyword


    Const is exactly like let. The only difference is that once you define a value
    using const it cannot be redefined again later on in your program. Doing this
    will produce an error:


    ```

    let a = 1;

    a = 2; // this is ok, we simply reassigned the value of a variable


    const a = 1;

    a = 2; // error, this is a constant and cannot be reassigned!

    ```


    How is this useful? Constant variables are traditionally used in computer programs
    to define values that will not change at runtime throughout your application.
    They are great for flag values and app configuration settings that should not
    change.


    Oh, and one more thing... When it comes to objects only... const keyword, while
    prevents re-assignment does not actually make the assigned object immutable. In
    contrast to many other languages, making an object const would make its properties
    immutable as well.


    Not so in JavaScript.'
- md: "\n## Destructuring assignment\n\nEcmaScript 6 introduces us to destructuring\
    \ assignments. This is new JavaScript functionality. The previous explanations\
    \ of let keyword laid the groundwork for discussing this next subject. So let's\
    \ take a look at how they work:\n\n```javascript\nlet {a, b} = obj;\n```\n\nIn\
    \ this example two variables a and b are created. Then, properties obj.a and obj.b\
    \ are taken from the object named obj, and assigned to those variables respectively.\
    \ So this is the equivalent of doing something like:\n\n```javascript\nlet a =\
    \ obj.a;\nlet b = obj.b;\n```\n\nThis format takes a lot more space. Destructuring\
    \ assignments save space and provide better readability for our code. Get used\
    \ to them! :)\n\n## For-of loop\n\nThis is a completely new type of a loop in\
    \ EcmaScript 6. Let's take a look at how it works:\n\n```javascript\nfor (let\
    \ [key, value] of map) { ... }\n```\n\nThis mighty for loop will iterate through\
    \ values stored in map. Unfortunately (like many things in JavaScript) the for-of\
    \ loops do not work on objects (and their properties). This is almost a bewildering\
    \ design decision. So, what for-of loops can work on?\n\nThe for-of loops are\
    \ designed exclusively to work with Array, Map and Set objects only.\n\n## The\
    \ Map object\n\nJust like an Array object, ES6 adds a new one, called Map. Maps\
    \ are nothing more than a simple key/value map. They are a lot like associative\
    \ arrays in PHP.\n\nMaps should not be used everywhere. Only where you previously\
    \ used objects as collections. That's what they're made for. And using objects\
    \ should still be primary to your JavaScript program design.\n\nMaps have a .size\
    \ property which determines its size. Unlike objects, where you would have to\
    \ calculate the size of an object manually. Use them together with for-of loops\
    \ when you have collections of data paired by key/value association!\n\n## Arrow\
    \ Functions\n\nOne of the most favored features in EcmaScript6 is the arrow functions.\
    \ I think you should start using them at earliest opportunity. Arrow functions\
    \ are just JavaScript functions written in a more compact syntax and that are\
    \ slightly different than regular functions created using the function keyword.\
    \ Here is the basic arrow syntax format, which at first may seem a little odd:\n\
    \n```javascript\nname = (params) => returned expression\n```\n\nFor example, you\
    \ can write something like this using an arrow function:\n\n```javascript\nx =\
    \ (a, b) => console.log(\"This is arrow function x with params = \" + a + \" and\
    \ \" + b);\n```\n\nBut this is only a function definition. It can be executed\
    \ just like a regular function as follows:\n\n```javascript\nx(5, 7);\n```\n\n\
    One radical difference compared to regular JavaScript functions is how arrow functions\
    \ treat the **this** keyword. It solves fundamentally the same (or similar) problem\
    \ that **let** keyword solves for regular scopes. We need to get into a slightly\
    \ more involved discussion here.\n\nJavaScript **arrow function** is a feature\
    \ relevant only to EcmaScript 6. It did not exist prior to this specification.\
    \ It adds convenience to making anonymous functions within objects easier to use\
    \ while retaining the value of the **this** object inside anonymous event handlers.\n\
    \nArrow functions also modifies the functionality of the **this** object used\
    \ within nameless callback functions within object scope by automatically binding\
    \ it to topmost local scope of the object. It reminds me a little of hoisting\
    \ (I briefly talk about hoisting in my other tutorial).\n\nArrow functions help\
    \ us escape **this/that** gymnastics (If you're not familiar with what I'm referring\
    \ to on reading, this tutorial explains it) inherent to original scope model we've\
    \ been used to.\n\nArrow functions are also known as \"fat arrow\" functions due\
    \ to their syntax.\n\n```javascript\n(params) => { statement };\n```\n\nJust think\
    \ of it as a different syntax of defining a JavaScript function.\n\nThe rest of\
    \ this tutorial will explain the difference between an older JavaScript example\
    \ and how arrow functions can be used to improve code readability and internally\
    \ tweak object functionality.\n\nThe aim of arrow functions is to solve a fundamental\
    \ problem that stems from original JavaScript language design dealing with object\
    \ scoping and the automatic this keyword binding.\n\nAs someone who has developed\
    \ a canvas-based game engine library in JavaScript that required creation and\
    \ instantiation of Line, Rectangle, Sprite and many other useful objects (a library\
    \ to aid the development of a browser-based computer game) like many other web\
    \ developers, I have faced the following issue.\n\nLet's consider we have this\
    \ simplified version of an object called Sprite for making game character and\
    \ enemy sprites!\n\nAlso let's create a new \"ship\" object of type Sprite and\
    \ instantiate it.\n\n```javascript\n/* A significantly simplified Sprite object\
    \ in JavaScript */\nvar Sprite = function() {\n  this.angle = 5;\n  this.draw\
    \ = function() {\n    alert(this.angle); // display sprite's angle\n  }\n};\n\
    ```\n\n```javascript\nvar ship = new Sprite(); // instantiate ship\nship.draw();\
    \ // draw the ship with this.angle rotation angle\n```\n\nThe draw function. In\
    \ this simple example we output the current angle of rotation for our sprite.\
    \ In real world circumstance the code would be actually more complicated. But\
    \ this is just an example to demonstrate arrow functions in JavaScript.\n\nI know\
    \ that programming the inner mechanics of JavaScript functions have always puzzled\
    \ programmers. The desire to \"experiment\" with how things work and go by feelings\
    \ and crappy results is tempting. In the example above the \"this\" keyword is\
    \ the same within Sprite's own scope and scope of its draw function.\n\nWe specified\
    \ 5 in Sprite's code. Then by referring to it from Sprite's this.draw function\
    \ we simply pull its value.\n\nShall we take a look now? The \"this\" inside event\
    \ handler is automatically assigned to the object on which event happened. Let's\
    \ run this program and see what happens, in comparison to our previous example.\n\
    \nThe alert message will now return:\n\n# Undefined\n\nThat's because this.angle\
    \ within anonymous function() { ... } no longer refers to the \"this\" object.\
    \ And there is no such property as \"angle\" attached to the anonymous function\
    \ (that was passed as argument to setTimeout.)\n\n```javascript\n/* A significantly\
    \ simplified Sprite object in JavaScript */\nvar Sprite = function() {\n  this.angle\
    \ = 5;\n  this.draw = function() {\n    alert(this.angle); // display sprite's\
    \ angle\n  }\n};\n// New! One solution is to create a \"that\" variable still\
    \ in this scope\n```\n\n```javascript\nvar that = this;\n// The following code\
    \ will execute as part of the\n// object construction:\nvar timer = setTimeout(function()\
    \ {\n  alert(that.angle); // display sprite's angle\n}, 1000);\n\nvar ship = new\
    \ Sprite(); // instantiate ship\n// ship.draw(); // draw the ship with this.angle\
    \ rotation angle\n```\n\nI did I in this example was assign this object to the\
    \ newly created that variable within main Sprite object's scope. Before timer\
    \ was defined. So in reality we now have something like this.that within Sprite.\n\
    \nI also changed this to that within setTimeout(function() { ... };\n\nLet's run\
    \ our code this time and see what happens now:\n\n# 5\n\nThe value of this.that\
    \ is 5. This happened when we bound this object to variable called that.\n\nI\
    \ am sure you have used the trick I just described in the examples before. If\
    \ not, we'll be glad to know you about it now. Most programmers discover it by\
    \ instinct. Because it takes time to learn the difference in JavaScript scoping\
    \ rules between function objects and anonymous events within those functions.\n\
    \nAnd after all these explanations with a big smile on our face this finally brings\
    \ us to our big final question!\n"
