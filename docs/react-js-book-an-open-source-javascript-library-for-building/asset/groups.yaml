- md: "\n## Native Babel vs JavaScript Babel\n\nI tried to subtly mention this in\
    \ a previous chapter. But this deserves a brief explanation before we move forward.\
    \ I don't want you to deceptively see babel at work, without knowing that it might\
    \ not be properly set up for real-world production environment.\n\nIt's best to\
    \ run babel as a stand alone application in the background, as part of your development\
    \ environment. This comes with Node installation by default. Simply download Node\
    \ from Google and keep clicking \"Next\" button to finish installation.\n\nAdding\
    \ babel directly via SCRIPT tag is possible and works for testing things out.\
    \ But because babel's JavaScript library is slower, it is advised to install the\
    \ native version that works from command line. JavaScript babel library is just\
    \ slow at processing something like this and defies React programming, one of\
    \ the sole purposes of which is to optimize your app for speed.\n\n## NPM\n\n\
    Command line babel application comes together with Node.js installation. So if\
    \ you install Node, you will automatically have babel packages. You just need\
    \ to install them separately from command line using NPM tool, which also comes\
    \ with Node by default.\n\nWhile learning React.js, it's perfectly normal to simply\
    \ add babel via SCRIPT tag. It's not fast enough for production environment when\
    \ your app goes live. In any case, all babel does is \"transpile\" your EcmaScript6\
    \ and JSX code back into EcmaScript5, so you can run it in any browser that doesn't\
    \ have full support for ES6 yet. (None of them do, as of this writing.)\n\n##\
    \ Transpiling Source Code\n\nYou've probably heard programmers on forums, Twitter\
    \ and reddit use the word transpiling but may have not fully grasped the idea\
    \ behind it.\n\nUsually, transpiling is the process of compiling code in one language\
    \ into source code in another language. It's just compiling between languages.\
    \ However, when it comes to JavaScript, we will be transpiling between two different\
    \ specifications of EcmaScript, 5 and 6.\n\nThis gives us the ability to write\
    \ code in EcmaScript 6, have it transpile to EcmaScript 5, so that modern browsers\
    \ can actually run your code. Most browsers at the time of this writing do not\
    \ have support for ES6, not even Chrome.\n\nEventually, when ES6 support is rolled\
    \ out for all browsers it will be safe to simply discontinue using babel for the\
    \ purpose of transpiling between EcmaScript specs. The code will work out of the\
    \ box by simply writing within your standard JavaScript files.\n\nBut until then,\
    \ we might as well use this opportunity to learn about a fun source code tool.\
    \ There are always new standards coming out, and the art of transpiling is probably\
    \ not going away anytime soon.\n\n*** * ***\n\nIn this chapter I wanted to introduce\
    \ you basic principles of React programming that go beyond creation of components\
    \ alone. Here, I mentioned them briefly in the context of our discussion on components\
    \ and props. As we move forward, we'll keep going deeper into the principles of\
    \ reactive programming. This time around, already having brief familiarity with\
    \ these principles, it will help us advance forward to writing practical React\
    \ applications.\n\n## Lesson 2 - Nested Components\n\nNested components in React.js\
    \ help you create more complex view element structures. I have previously talked\
    \ about creation of React components. And just as a reminder, here is how you\
    \ would go about creating one.\n\n```javascript\nvar Component = React.createClass({\
    \ render: function() {\n  return (\n    <Something></Something>\n  )\n}});\n```\n\
    \nThis is just a basic component that returns a set of <Something> HTML tags.\
    \ I know, you're probably still getting used to returning something that looks\
    \ like an HTML tag without quotes around it, but by this time it will start looking\
    \ more familiar :\n\nAs you may have imagined, this is the type of code structure\
    \ you will be working a lot with React. Most other things stem from it. If you've\
    \ ever worked with jQuery, this component structure can be comparable to jQuery's\
    \ object-selector syntax:\n\n```javascript\n$(\".class\").on(\"click\", function()\
    \ { /*do something */ });\n```\n\nWhere we have a callback function return upon\
    \ the event has finished executing. In react, we're returning an HTML element\
    \ that will usually be placed inside our application's structure on the front\
    \ end.\n\nIn case of React components, it's just a JavaScript object that contains\
    \ render function, and has a return statement that returns transpiled JSX code.\
    \ That's what converts <Something> tag into EcmaScript5 that browsers can understand.\n\
    \nWhat gets to be in render function and in return statement depends on the purpose\
    \ of your application. In this example, for the sake of clarity, let's call these\
    \ objects **Parent** and **Child** respectively. An actual pair of names if you\
    \ were writing an application could be something like Friend and FriendList. Or\
    \ Customer and CustomerProperty.\n\n## Parent with a Single Child\n\nUsing this\
    \ pattern, you can implement a basic view functionality.\nFirst, let's create\
    \ the least building block of the pattern - the child.\n\n```javascript\nvar Child\
    \ = React.createClass({\n  render:function() {\n    return\n    <BUTTON onClick={this.props.onClick}>\
    \ {this.props.text} </BUTTON>\n  }\n});\n```\n\nIn this case, the child is a basic\
    \ component that returns a button element.\nThe button provides an onClick event\
    \ that will be executed by the method this.props.onClick.\nLet's now create its\
    \ counterpart Parent class, and use Child as the object it will return. I highlighted\
    \ Child to make sure it's easy to see how the Component is tied to Parent.\n\n\
    ```javascript\nvar Parent = React.createClass({\n  render:function() {\n    return\
    \ (\n    <Child onClick={this.handleChild} text={this.props.text} />\n  ),\n \
    \ handleChild:function(event) {\n    // logic here\n  }\n});\n```\n\nWait, looking\
    \ at the provided OCR text's code blocks, they are fragmented. Let's reconstruct\
