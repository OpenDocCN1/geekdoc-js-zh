    \ {\n  className: 'my-list'\n}, child);\n```\n\n我们还没有深入探讨 React 编程的细节来详细讨论组件之间的父子关系。但因为在例例中我们使用了第三个参数\
    \ `child`，我想对它的含义简单说几句话。\n\n在接下来的章节中，你将看到组件之间父子关联是如何工作的。但基本上，现在你只需要知道，无论你作为 `createElement`\
    \ 方法的第三个参数传递什么元素或多个元素，它们将通过 `this.props.children` 属性作为 \"props\" 可用。\n\n这样，你就可以从父类中操作子组件了。父类通常是你的整个应用的核心，包含了所有的子组件。父组件可以有多个子组件。\n\
    \n以后我们会详细讨论 props 的用法。现在，只需要知道 props（或属性）对于 React 组件来说，就像参数之于函数。你只需将它们作为响应式元素功能所需的自定义值，直接传递到对象中即可。\n\
    \n还要记住，你不能随意粘贴任何 HTML 来作为 JSX 语句。JSX 版本的 HTML非常相似，但并不是 100% 准确的 HTML 规范。它非常接近，但存在一些差异。\n\
    \n正由于这些原因，JSX 可能会让你感到困惑。我曾挣扎了一段时间，但当我意识到它的主要目的是帮助更快地编写代码时，我想一旦我适应并习惯性地使用它，长期来看它会让事情变得简单得多。\n\
    \n这几乎就像是重新学习多年 HTML 标准的操作。困难的部分在于了解 JSX 的局限性。因为当你发现 JSX 中使用的 HTML 看起来格式正确但却不起作用时，由于不知道为什么无效，你可能会感到非常沮丧。\n\
    \n它确实挑战你用全新的方式来思考应用程序某些部分的设计。但请耐心看这些例子，最终你会逐渐理解并开始变得更有意义。\n\n## Props\n\n在在上一个章节中，我提到了\
    \ React 组件。但其中还有很多奥问。之前，我们创建了一个简单的组件，看起来就像这样：\n\n```javascript\nReactDOM.render(\n\
    \  <h1>Hello</h1>,\n  document.getElementById('root')\n);\n```\n\n注意，我们直接在 `render`\
    \ 方法的参数中输入了 HTML 标签 `<h1>`，而没有加引号。这是 JSX 提供的语法风格。它在 JavaScript 中无法编译，但像 PHPStorm\
    \ 这样的智能 IDE 识别 JSX 语法，并不会将其视为错误。\n\n只要你的项目中包含了 JSX（通常通过 babel.js 库或其对应的命令行插件，后者是我建议在生产服务器上使用的），这代码就能正常编译。\n\
    \n现在我们知道，只有当你的项目中包含了 babel 转换译器（`babel.min.js`）时，它才能工作。（换句话说，不要尝试在“桌面”上某个文件夹的记事本里编写它，因为你的开发环境必须正确配置才能进行编译，或者至少应该在页面的\
    \ SCRIPT 标签中包含 babel.js。）它使用内部的 JSX 处理器将此内联 HTML 转换为 JavaScript。\n\n## 函数纯性\n\n\
    在进入 React props 之前，我想提一下一点。在 React 中，props 是只读的。这与一种特定的函数类型——纯函数（pure function）很大有关。在传统的软件开发中，纯函数是指内部不会改变传递给它的参数的函数。\n\
    \n```javascript\n// 纯函数；不修改参数值\nfunction sum(a, b) { return a + b; }\n```\n\n\
    这被认为是纯函数，因为它的主体没有修改任何作为参数传递的参数。相反，下面展示了一个非纯函数的示例：\n\n```javascript\n// 非纯函数；修改传递的参数\
    \ \"total\" 的值\nfunction sub(total, less) { return total -= less; }\n```\n\n在\
    \ React 中，props 遵循“纯”的理念。这意味着你可以传递它们，前提是你的 React 组件不会从内部更改它们的值。这正是 React props\
    \ 变为只读的原因。遵循这一规则是好的。\n\nProps 派自 HTML 元素的属性。它们被称为 props 有点奇怪，因为在 HTML 元素中，属性是像\
    \ `DISABLED` 或 `CHECKED` 这样的单关键字标记。\n\nprops 更好的名字应该是 attributes（属性）。因为它们类似于 HTML\
    \ 属性的 `name=value` 键对，而不是 props。但事实就是如此。React.js 的开发者选择了这种命名规范！不要怪信者：\n\n如果你一直在关注我们上一个章节的讨论，你现在应该知道组件是什么。它们是\
    \ HTML、CSS 和 JavaScript 代码块的组合，决定了应用程序某个视觉区域的功能。它们负责更新诸如消息流、警报和各种状态更新。\n\n我们也知道，组件通常有一个\
    \ `render` 方法来在应用中显示它。\n\n学习 React.js 时，你遇到的下一个问题就是 props。props 就像函数参数。只不过你将它们传递给组件而不是函数。但原理是相同的。\n\
    \n让我们创建一个组件并向它传递一个 prop。\n\n```javascript\n// 创建一个 Hello 组件\nvar Hello = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>Hello, {this.props.name}</div>\n\
    \    )\n  }\n});\n// 现在在应用中调用它\nReactDOM.render(<Hello name=\"Jason\"/>, document.getElementById(\"\
    app\"));\n```\n\n## 函数式组件\n\n上面我们演示了一个使用 `createClass` 的标准组件，它包含一个 `render` 方法。但接下来的代码实际上无非一个函数：\n\
    \n```javascript\nfunction Hello(props) {\n  return <h1>Hello, {props.name}</h1>;\n\
    }\n```\n\n使其成为有效组件的事实是它返回了一个 React 元素。React 元素可以渲染在屏幕上。这是 React 风格编程的重要部分，很容易习惯。记住，在\
    \ JavaScript 中，一切都是对象，甚至是函数也是如此。这就是为什么这些组件被称为函数组件的原因。\n\n## 披着羊皮的狼\n\n如果你知道继承是如何工作的，那么这就是它在\
    \ JavaScript 中的模仿方式。我说是“模仿”，是因为在面具之下，JavaScript 仍然使用基于原型的继承。这可能是幸运，也可能是诅咒。\n\n\
    JavaScript 定义的继承标准与 C++ 或 Java 等更成熟的语言相比，并不是真实的。换句话说，由于 JavaScript 是弱类型，你可以忘记在\
    \ JavaScript 中创建像“接口”这样的高级对象结构。\n\n严格的编程语言通常更擅长提供功能面向对象编程环境。在这里，EcmaScript 开发者决定稍微装饰一下\
    \ JavaScript 语法，让世界看起来更像一只羊。\n\n但大多数程序员都认为这种语法改进了 JavaScript 的编程。至少在视觉上是这样。\n\n\
    这种方式创建组件的一个主要区别是通过 `this` 关键字变量访问 `props.name` 属性。否则，它和上一个例子中的函数组件的功能完全一样。\n\n\
    ```javascript\nclass Hello extends React.Component {\n  render() {\n    return\
    \ <h1>Hello, {this.props.name}</h1>;\n  }\n}\n```\n\n"
