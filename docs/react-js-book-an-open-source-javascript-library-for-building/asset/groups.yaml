    executed on a component. It gives us a chance to handle any state changes before
    next render update.


    componentDidUpdate is called soon after render() method has finished updating
    the DOM.


    shouldComponentUpdate is a default method that always returns true. We give control
    over whether the component''s element should update in DOM. This isn''t always
    the case. For example, if the new results of some state or property in a component
    equals the value of what it was previously set to anyway, it''s probably not worth
    updating the DOM. Why send the data to the view if it did not change even after
    being updated?


    These methods are crucial to understanding virtual DOM. As we''re slowly peeling
    principles of react programming one by one, it will all start making sense.


    For now just know that a react component is usually mounted to a render target.
    This is why some of the default methods mentioned above use the word "mount" instead
    of traditional setter or getter methods like "set" or "get" you would expect.
    Mounting is an idea unique to programming with React and the components created
    within React''s virtual DOM ecosystem.


    We''ve already talked about components theoretically. But what is a component
    in practice? Remember that your application is made up of compartmentalized elements.
    Components can literally be anything from buttons, text input fields, check boxes
    to action status areas for displaying text. You will determine the design of your
    component based on the purpose of your application.


    Because we''ve just discussed methods that deal with "mounting" of components,
