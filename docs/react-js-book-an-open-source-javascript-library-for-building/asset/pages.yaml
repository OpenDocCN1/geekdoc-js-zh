  md: '```

    <a href="#">

    <span alerts="0">No Alerts</span>

    </a>

    </MyNav>;

    ```


    We have just recreated virtual DOM using JSX language using a single JavaScript
    statement! You can pass the value of nav around as a statement to functions. It''s
    almost like another way of creating a mini DOM structure.


    Now you (hopefully) see that this is the very structure of virtual DOM in React.
    It''s like a secondary DOM we''re going to be working with, changing, modifying,
