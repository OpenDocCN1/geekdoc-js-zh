- img_proc: true
  md: 'Then we have props, which are properties you pass to this component. Props
    are not states, but they can modify states. We''ll draw this distinction later
    in more detail.


    Finally, children are just hierarchical elements to be found within its parent
    elements. Create chains of them and type them right into createElement function
    as N-number of arguments at the end.


    Another key that unlocks deeper understanding of React is that all of the code
    above has its equivalents in JSX. The two can be used interchangeably. This is
    the part that is actually exciting, once you truly start understanding how it
    works.


    So, while in ES5, you would createElement function, in JSX (arguably its common
    use is with the rest of ES6 syntax) you could create exactly the same functionality
    by simply writing it out as follows:


    ```

    let link1=<a href="#">Save</a>;

    ```


    Now you see where I am going with this? JSX turns HTML into JavaScript statements.
    Here link1 is object-like representation of the element which is exact equivalent
    to React code we created earlier with createElement method.


    And yes, link1.href will contain "#" by simply declaring it as JSX. Once I realized
    that is how it works JSX started to make a lot more sense and I actually started
    to feel comfortable using it.


    It''s like a two-way road between HTML and JavaScript where attributes automatically
    become properties. And here is the more complex example, this in JSX once again:


    ```

    let nav=<MyNav>

    <a href="#">Save</a>

    <a href="#">Load</a>

    <a href="#">Delete</a>

    ```'
