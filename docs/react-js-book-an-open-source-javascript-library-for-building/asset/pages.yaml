  md: '# Gem 8 - JSX Walkthrough


    If you''ve started studying React already, you should have heard a lot about JSX.
    You''ve also probably heard that it is not necessary to use it with React. And
    that much is true. But, it is recommended that you do. It just makes things so
    much easier, even though its syntax can appear a little scary at first to traditional
    JavaScript developers.


    JSX is known for being a language that lets "write HTML inside JavaScript." This
    is true to some degree. The desired effect is that we can treat HTML tags as a
    JavaScript statement. However, JSX actually uses a form of XML which only resembles
    HTML, uses tag names that match those of standard HTML tags, such as DIV, UL,
    TABLE and so on. Remember that even HTML is just a distant brother of XML.


    Although HTML as a JavaScript statement might look a bit dinosauric at first,
    once you grasp the idea and get to use it, it really makes second nature. It''s
    definitely something completely new and not usually (and not even compile in most
    browsers today) but let''s take a look at what it actually looks like:


    ```

    var scoreBoard = { Player1: 10, Player2: 25 };

    <div className="class1" />

    <SomeCounter count = { 3 + 5 }

    <ScoreBoardUnit data-index = "2">

    <h1>Score Leaderboard</h1>

    <Scoreboard className="results" scores = {scoreBoard} />

    </ScoreBoardUnit>


    ```


    This code naturally will not compile in your standard browser unless Babel''s
    JSX plugin is helping us transpile it back into ES5, the specification we can
    be sure all modern browsers do understand. In which case, it will compile into
    following React elements.'
