  md: '# Main Roadblocks to Learning React


    Here, I''m going to make an attempt to speak of the commonplace difficulties faced
    with learning React library from scratch. These are the ones that make learning
    React not as intuitive as other far straightforward libraries you''re already
    used to.


    I''ll try to do without making React come off as a bad choice, because... all
    in all, this is indeed a book about to advance as a React programmer. However,
    if we at least frankly about the hard parts now, it will make it easier to sink
    in later on as we move forward.


    +   1. New Design Pattern. New, and in many cases unfamiliar. If you''re coming
    to React from traditional pre-2015 JavaScript world of programming, it might take
    time to adjust to modular and declarative design adopted by React library. Sure,
    if you''ve ever worked on a large JavaScript application you might have dealt
    with long lists of .js files and treated them as separate modules. But for large
    majority of programmers this isn''t true. React requires that we use modular design
    for maximum application management efficiency.


    +   2. JSX language throws a lot of people off. It''s like writing HTML inside
    JavaScript and at first it looks nothing of bizarre, if you''re encountering it
    for the first time ever:


    For example:


    ```

    var divblocks = <div>

    <div>Another nested tag</div>

    </div>;

    ```


    Like what, what? Are you seeing what I''m seeing we? We have just relentlessly
    typed HTML into a JavaScript statement, without quotes surrounding the HTML, and
    even have separated them using line breaks... and still got away with it.


    JSX processor, which processes XML as if it''s HTML and turns it into a'
