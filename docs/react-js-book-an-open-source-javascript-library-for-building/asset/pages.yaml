  md: 'NavigationMenu or Button. And it would contain the standard component definition
    code we''ve already seen in earlier gems in the book.


    It''s simply a React type. It is not yet physically existent anywhere in the primary
    JavaScript''s document (DOM) object. Aside of being a react node it is nowhere
    else to be found. This is because as of yet it has no physical purpose in terms
    of being displayed in your application.


    But this is true only until render method is executed on this component. Here,
    counter is just some of a DIV or other HTML element:


    ```

    React.render(component, container);

    ```


    The render method mounts component to the DOM. The reason this process is referred
    to as mounting is similar to virtual hard drives. If you''ve ever mounted a virtual
    CD-Rom or hard drive on your computer, you know how it works. The hard drive doesn''t
    physically exist. For the same reason, this is why this type of software is called
    virtual hard drive. Or virtual CD-Rom. And this is why virtual drives have features
    like "mount this drive."


    Likewise, this is the same principle behind DOM in React. Until it is mounted,
    it cannot be operated upon. This is what makes React so faster than regular DOM
    operations. And this is probably one of the top reasons for using React in the
    first place. React stores a fast inmemory representation of the DOM.


    But this virtual DOM is not even associated with the JavaScript''s DOM. It exists
    by side, and renders to the actual DOM on the screen only when it becomes necessary.
    Usually, when the component representing an element is actually updated with new
    incoming data.


    Essentially, React is designed to update components on the screen only when they
    need to be. Another advantage of doing this way is that it separates your application
    from the back end, while effectively executing functions that are responsible
    for updating the screen almost instantaneously as they occur.'
