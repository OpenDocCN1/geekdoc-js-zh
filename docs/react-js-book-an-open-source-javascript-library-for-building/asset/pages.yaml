  md: '# The Map object


    Just like an Array object, ES6 adds a new one, called Map. Maps are nothing more
    than a simple key/value map. They are a lot like associative arrays in PHP.


    Maps should not be used everywhere. Only where you previously used objects as
    collections. That''s what they''re made for. And using objects should still be
    primary to your JavaScript program design.


    Maps have a .size property which determines its size. Unlike objects, where you
    would have to calculate the size of an object manually. Use them together with
    for-of loops when you have collections of data paired by key/value association!'
