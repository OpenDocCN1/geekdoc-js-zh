    elements. Whether it is JavaScript DOM or elsewhere. This can sound surprising
    at first, because React is known for being primarily as a front end library.


    That is because React uses something known as render targets. That is, you determine
    how the results of a react''s render method will be displayed or passed on elsewhere.


    In words, you can say that React is agnostic when it comes to the output of data
    or stores stored within its components.


    For example... you can output data from a component to file writing function.
    In other words, React''s rendering target is not limited just to UI elements,
    even though throughout most of this book and react-style programming in general
