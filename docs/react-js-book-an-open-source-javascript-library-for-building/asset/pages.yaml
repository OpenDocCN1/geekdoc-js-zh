  md: '# Arrow Functions


    One of the most favored features in EcmaScript6 is the arrow functions. I think
    you should start using them at earliest opportunity. Arrow functions are just
    JavaScript functions written in a more compact syntax and that are slightly different
    than regular functions created using the function keyword. Here is the basic arrow
    syntax format, which at first may seem a little odd:


    ```

    name = (params) => returned expression

    ```


    For example, you can write something like this using an arrow function:


    ```

    x = (a, b) => console.log("This is arrow function x with params = " + a + " and
    + b);

    ```


    But this is only a function definition. It can be executed just like a regular
    function as follows:


    ```

    x(5, 7);

    ```


    One radical difference compared to regular JavaScript functions is how arrow functions
    treat the **this** keyword. It solves fundamentally the same (or similar) problem
    that **let** keyword solves for regular scopes. We need to get into a slightly
    more involved discussion here.


    JavaScript **arrow function** is a feature relevant only to EcmaScript 6. It did
    not exist prior to this specification. It adds convenience to making anonymous
    functions within objects easier to use while retaining the value of the **this**
    object inside anonymous event handlers.


    Arrow functions also modifies the functionality of the **this** object used within
    nameless callback functions within object scope by automatically binding it to
    topmost local scope of the object. It reminds me a little of hoisting (I briefly
    talk about hoisting in my other tutorial).


    Arrow functions help us escape **this/that** gymnastics (If you''re not familiar
    with what I''m referring to on reading, this tutorial explains it) inherent to'
