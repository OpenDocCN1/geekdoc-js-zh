    In previous gem we''ve talked about how each component takes care of its state.
    A state could be a boolean flag indicating whether a button is highlighted. Or
    whether a navigation menu option is selected.


    Now, if you''ve been paying attention this is where it starts coming together.
    A React component is a fusion between its state and rendering method. We''re given
    programmatic control over the two most important functions of a UI element in
    one place.


    But what in the world is mounting? In React we are using a virtual representation
    of the DOM for performance reasons.


    By simply creating a component, no DOM elements will be even touched. This is
    great news but how could it be? This is because native DOM would increase memory
    imprint of your application.'
