  md: '# Reactive Programming


    What is this reactive programming anyway? React is a small but powerful library
    written in JavaScript. You can use it by including it on your web page using SCRIPT
    tag. Just like you would any other JavaScript library, like jQuery for example.


    If you are looking to be prepared for employment at an actual software company,
    simply adding React to your web page isn''t enough. It almost demands that you
    understand other areas of web development that go beyond simple JavaScript programming.
    The design of this book is dedicated to nurture that process.


    By using React components, which will be shown throughout many examples in this
    book, you will build an entire application. During many parts of this book I will
    refer to building applications using the React library as "reactive" programming.


    Reactive programming is nothing more than a phrase made up to represent an alternative
    way of thinking about building modern web applications. Reactive programming is
    not inherent to programming using the React.js library itself. It''s a methodology
    and it happens that React.js library adopts it as its core philosophy.


    What I mean by this is that it''s the type of programming methodology that will
    focus a lot on logical functionality of your program. Think about it as a more
    advanced form of programming compared to working with DOM in JavaScript, where
    each visual element of your app not only has events associated with them, but
    can possibly contain custom programs that you will write yourself which determine
    their function.


    While React is considered to be mostly dealing with the view areas of your application,
    don''t believe the myths that React is strictly the "view" in the MVC (model-view-controller)
    pattern you are probably already familiar with. If not, just know that the Model
    View Controller'
  merge: -1
