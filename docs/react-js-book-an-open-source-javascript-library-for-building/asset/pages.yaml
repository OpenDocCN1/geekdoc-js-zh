  md: '# The Essentials


    If you''re familiar with jQuery, you''ve used the dollar sign ($) object for selecting
    HTML elements and applying various operations on them.


    But what is a similar building block of React when it comes to HTML elements (not
    components)? It must be the createElement method.


    ```

    React.createElement(type, props, children);

    ```


    And here are a few examples of how you would use createElement in practice:


    +   - link = React.createElement(''a'', {href: ''#''}, ''Save'');

    - nav = React.createElement(MyNav, {flat: true}, link);


    Here, we programmatically created HTML elements using React method createElement.
    Then we have taken the created link element and placed it within nav element to
    be one of its children.


    Of course this case link is the only child, but multiple links can be used as
    well, as additional arguments separated by comma:


    ```

    link1 = React.createElement(''a'', {href: ''#''}, ''Save'');

    link2 = React.createElement(''a'', {href: ''#''}, ''Delete'');

    nav = React.createElement(MyNav, {flat: true}, link1, link2);

    ```


    You can go like this forever, adding as many children as required by your application.


    Notice variable uses MyNav without double quotes. This is perfectly fine. When
    we use custom elements (not the standard ones like a, div, table, etc...) that
    we make up ourselves, we must use leading upper case letters. Therefore, the navigation
    element is called MyNav. As long as we use the leading capital letter React knows
    we''re'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'referring to a custom element. No need to use surrounding quotes here.


    In JSX it will translate to something like <MyNav />


    Eventually with time as you develop your application, you''ll arrive at full structures
    similar to one depicted in the following example. Note, that here it is a little
    different as I am actually using React statements directly as children arguments:


    ```

    let nav = React.createElement(MyNav, {flat: true},

    // start children of nav

    React.createElement(''a'', {href: ''#''}, ''Save''),

    React.createElement(''a'', {href: ''#''}, ''Load''),

    React.createElement(''a'', {href: ''#''}, ''Delete''),

    React.createElement(''a'', {href: ''#''}, // Alert Contaner

    // start children of AlertCounter link

    React.createElement(''span'', {alerts: 0}, "No Alerts"))

    ```


    Note that some children are simple strings of text. They are used as text nodes
    here. The stuff that goes in between the brackets of tags also have a representation.
    And that''s what they''re for. In this case children can be used as the text supplied
    to the link''s innerHTML, when they are not used for specifying nested elements.


    Also, here createElement is how you would create a React element in ES5 without
    JSX. I''ll explain this in a moment. While I advocate the use of ES6, I wanted
    to show how it''s done in ES5 first. Moreover, ES6 is backwards-compatible with
    ES5. So, this means that a lot of the time you find out how you write react programs
    will depend on your personal preference.


    What''s important to understand, for now, is that createElement takes three arguments:
    type, props, children.


    Here, type is the name of the element. For example A, H1, DIV, etc.'
  merge: -1
