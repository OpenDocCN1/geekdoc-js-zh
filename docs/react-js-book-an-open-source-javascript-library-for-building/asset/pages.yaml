  md: '# The var and let keywords


    In ES6 it''s commonly agreed that instead of using var keyword we now use let
    keyword. There are reasons for this, which are described below:


    +   * There is no hoisting when using let keyword. If you''re familiar with JavaScript''s
    hoisting mechanism, you will spot a difference using the new let keyword.


    Hoisting is when JavaScript moves all variable definitions up scope in which they
    are defined. This little-known process is done behind the veil. But it is in fact:


    ```

    {

    console.log( a ); // undefined; but only because it is hoisted

    var a = 1;

    }

    ```


    And the let example:


    ```

    {

    console.log( a ); // ReferenceError: "a" is not defined at all

    let a = 1;

    }

    ```


    In the example above the resulting out of console when making an attempt to print
    out value of a variable is undefined. In first case, it''s because while the variable
    is hoisted. But in the second example, it is not.


    +   * In global scope. The let keyword and the old var keyword are still scoped
    to the global scope. But the let keyword is not attached to the global window
    object:


    ```

    var a = 1; // will be attached to global window object

    let b = 1; // will not be attached to global window object

    console.log(window.a); // 1

    console.log(window.b); // undefined

    ```'
  merge: -1
  pgno: 88
- img_proc: true
  md: '❖ In function scope. The **let** and **war** keyword are still identical within
    function scope:


    ```

    function helloThere() {

    let x = 1; // identical scoping

    var y = 1; // identical scoping

    }

    ```


    ❖ In statements. The **let** keyword is only visible inside for-loop while **var**
    is visible to entire function''s scope. So, the **let** keyword limits visibility
    of variables defined within **closest enclosing block** specified by { and } brackets.
    Below, let''s first take a look at how **var** traditionally handles scope:


    ```

    // var inside a function and for-loop example

    function helloThereIterator() {

    // i is theoretically visible here too.

    for (var i = 0; i < 10; i++) {

    // i is visible here.

    }

    ```


    Perhaps this is not the best example of var keyword (because the for loop is initially
    defined) while it is available everywhere in the function. But it still demonstrates
    the principle.


    Traditionally, var is known to exist for access within the brackets { } of a function
    and hidden from function''s scope but unless it is the window object. This is
    the basic rule. But JavaScript is complicated like that... and if the variable
    is not found within the function itself, only then the window object is checked,
    which is outside of the function.


    It is your responsibility as a programmer to determine whether that variable should
    or should not be available from the global scope. This is an example of where
    JavaScript tries to be "everything for everyone."


    While this looseness is helpful in many cases and makes the learning curve'
