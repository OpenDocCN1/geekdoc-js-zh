  md: "# Method 2 - componentDidMount\n\ncomponentDidMount is called automatically\
    \ by React when a component is rendered. By adding it to your custom React component,\
    \ you are overloading it. Overloading means, adding your own functionality to\
    \ the method that already exists in the default React component object, from which\
    \ you are extending your custom component. That's the whole purpose of using extend\
    \ keyword. We're extending default functionality of React's component object already\
    \ provided by the library.\n\nWhen I first heard of \"mounting\" function within\
    \ my React component, I didn't understand what it meant. Are we not simply attaching\
    \ a bunch of helper methods to our primary React component?\n\nWe've already spoken\
    \ of mounting earlier in the book. If you still need to brush up on the process,\
    \ I recommend making sure you've gone over Gem 6 - Component Mounting previously\
    \ discussed.\n\ncomponentDidMount is the method responsible for setting the state\
    \ after component has been mounted.\n\n```\nvar Example = React.Class({\n  componentDidMount:\
    \ function() {\n  this.state = 1;\n  }\n});\n```\n\nIt simply means that the virtual\
    \ DOM has become associated with a DOM node that will be actually updated on the\
    \ screen. This method is always called after executing render command from the\
    \ component. They are synonymous and can probably be used interchangeably. It\
    \ ensures and tells us that the element actually exists within virtual DOM. The\
    \ render method has already been called on it!"
