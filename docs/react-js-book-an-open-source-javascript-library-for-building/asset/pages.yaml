    local machine.


    +   2. Node automatically comes with Babel and JSX support (JSX is installed as
    a Babel plugin.) Installing Node and NPM is surprisingly easy on both Mac (via
    the terminal) and the PC. On the PC it''s as easy as downloading the Node installation
    file from their official website. The installation program and you''re all set.
    Just don''t forget to check the babel checkbox during installation, it''s also
    included.


    On a Mac, you can download Node via command line. Pop open your Terminal application
    and type:


    ```

    $ wget http://nodejs.org/dist/node-v0.4.4.tar.gz

    $ -xzf node-v0.4.4.tar.gz

    $ cd node-v0.4.4

    $ ./configure

    $ sudo make install

    ```


    That''s it! The configuration log will run and then you''re done.


    On Ubuntu, you might want to run this additional command to install essential
    components:


    ```

