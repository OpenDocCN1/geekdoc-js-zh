  md: 'HTML document changes. These special events, called "promises" guarantee that
    the event will take place at some time in the future.


    One of the problems promises solve is the classic case when HTML element''s events
    (such as onclick) are overwritten by code that updates visual aspects of your
    application. Because this happens often in an actively updated front-end view,
    some events might not be triggered at all, just because DOM was rewritten.


    A promise can exist "in the future" regardless of what happens to DOM structure
    of your site, so long as the integrity of the original DOM remains the same, or
    similar to one that existed at the moment when the event was executed.


