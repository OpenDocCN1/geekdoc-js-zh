    function sum(a, b) { return a + b; }

    ```


    This is considered to be a pure function, because its body does not modify any
    of the parameters that were passed as arguments. On the other hand an example
    of an impure function is shown below:


    ```

    // impure function; modifies value of the passed argument "total"

    function sub(total, less) { return total -= less; }

    ```


