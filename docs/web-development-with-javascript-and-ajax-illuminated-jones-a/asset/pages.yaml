  md: 'Predicates in square brackets can be used to further narrow the subset of chosen
    nodes. For example, /library/dvd[1] selects the first dvd child element of library
    (IE5) and later use [0] for the first child); /library/dvd[last()] selects the
    last dvd child element of library; /library/dvd[-1] selects the last dvd child
    element next to the last of library; /library/dvd[position<3]] selects the first
    two dvd child elements of library; /library/dvd[@id] selects all dvd elements
    that have an id attribute; //dvd[@id=''2''] selects the dvd element that has an
    id attribute value 2; /library/dvd[genre=''Classic''] selects all dvd child elements
    of library that have “Classic” as their genre value; and /library/dvd[genre=''Classic'']/title
    selects all title of dvd elements of library that have “Classic” as their genre
    value. Path expression predicates can use many binary operators in the same manner
    as they are in programming languages, including +, -, *, div (division), = (equal),
    != (not equal), <, <=, >=, and (logical conjunction), and mod (modulus).


    You can use XPath wildcard expressions, *, and node() to select unknown XML elements.
    For example, for the previous XML document dvd.xml, /library/* selects all the
    child nodes of the library element; // selects all elements in the document; and
    //dvd[@] selects all dvd elements that have any attribute.


    Several path expressions can also be combined with the disjunctive operator for
    logical OR. For example, //title | //genre selects all title and genre elements
    in the previous document.


    XPath defines a set of XPath axes for specifying node subsets relative to the
    current node in a particular direction in the XML document''s tree representation.
    The following table lists the popular XPath axis names and their meanings.


    | Axis Name | Result |

    | --- | --- |

    | ancestor | Selects all ancestors (parent, grandparent, etc.) of the current
    node |

    | ancestor-or-self | Selects all ancestors (parent, grandparent, etc.) of the
    current node and the current node itself |

    | attribute | Selects all attributes of the current node |

    | child | Selects all children of the current node |

    | descendant | Selects all descendants (children, grandchildren, etc.) of the
    current node |'
