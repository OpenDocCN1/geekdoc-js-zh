  md: '# 5.6 Complete Example


    This section provides a complete example. Up to this point we have on showing
    only the client-side code, which is what this book is mostly concerned with. Now
    we will include the server-side code so that you can set up a complete example
    and see the traffic between the client and the server. The example in this section
    uses PHP version 5.2.5 as the server-side language. PHP is a widely popular, open-source,
    general-purpose scripting language that can be embedded in HTML to quickly generate
    dynamic pages. Its syntax is similar to that of C and Java. To learn more about
    PHP, you can read the PHP manual online.


    To serve up dynamic web pages written using PHP, you need a web server. The web
    server processes HTTP requests for static content, like CSS, images, and JavaScript
    files, and passes requests for PHP files over to the PHP engine. PHP generates
    the HTML and hands it back to the web server, which sends it to the browser. The
    web server that we use in this chapter is the popular open-source Apache HTTP
    Server. This book''s Appendix has information on installing and configuring Apache
    and PHP to run the following examples. Although doing so is not required, you
    may want to install and use the NetBeans IDE and the NetBeans PHP plugin, which
    will give you features like syntax highlighting of the PHP code, automatic code
    completion, automatic deployment of your code to the Apache HTTP Server, You can
    write the code with any text editor, and manually move the code into Apache''s
    hdocs to deploy it, but using the NetBeans IDE will make the process easier for
    you. The installation of NetBeans and the PHP plugin is also described in the
    Appendix.


    In this example, we will complete the Ajax validation for the car search form
    so that you can see the server side and play with some working code. We will not
    be creating a real car sales web application, just the Ajax validation on the
    car search form. The development of this application is laid out in the following
    steps. Follow them closely and everything should work as advertised.


    > 23http://us.php.net/manual.


    > 24http://httpd.apache.org/.'
