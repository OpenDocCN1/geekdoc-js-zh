    2. Import an external JavaScript file by using the src attribute of the <script>
    tag. The src attribute specifies the URL of the file containing JavaScript code.
    JavaScript files typically have a .js extension and contain only JavaScript code.
    Inside the JavaScript file you do not need (and cannot have) <script> tags or
    any other HTML tags. Here is an example.

    <script src="javascript/formUtil.js"></script>


    3. Assign JavaScript to the event handler attribute of an HTML tag. Many HTML
    tags support event handler attributes, so you can assign some code to do something
    when, for instance, the user clicks a button. An example follows.

    <button onclick="window.alert(''I have been clicked!'');">Click me!</button>


    4. Assign one line of JavaScript code to a URL prefixed by javascript:pseudoprotocol.
    When you use this pseudoprotocol followed by a line of JavaScript code, the browser
    executes the JavaScript code and displays whatever the code returns but does not
    change the currently displayed page if the code returns nothing. Usually, you
    do not want the browser to display anything as a result of the URL, so you return
    nothing. To ensure that nothing is returned to the interpreter, it is common to
    follow the JavaScript code with a void statement. Here is an example that opens
    a new window when you click a link.

    <a href="javascript: window.open(''myPage.html'');" void 0">Click me!</a>


    For using JavaScript with HTML, the best practice is to import your JavaScript
    code using the src attribute of the <script> tag. This technique has several benefits
    over the others. It completely separates your JavaScript from the HTML code, which
    makes understanding, reading, and maintaining the code much easier. The JavaScript
    code can be easily reused across web pages. The JavaScript file can be cached
    by the browser, which makes future page loads, and loads of other pages that use
    the same file, faster.'
