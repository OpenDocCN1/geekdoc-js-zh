    # 4.1.4 Built-In Objects and Host Objects


    When the JavaScript interpreter starts up, it creates a unique global object before
    executing any JavaScript code. When you create a top-level variable in JavaScript,
    you are actually creating a property of the global object (by top-level we mean
    code not contained in a function or object). The global object contains several
    properties, including built-in objects (like the wrapper objects already mentioned)
    and host objects supplied by the host environment. The host environment for client-side
    JavaScript is the web browser.


    The exact list of built-in objects depends on the implementation, but ECMAScript
    standards several of them that you will find in all implementations, which are
    collectively called the JavaScript core. The JavaScript core includes the wrapper
    objects (Number, Boolean, and String); the Object object; Array, Date, and Math
    objects; a regular expression object (RegExp); a Function object; an Error object
    (and several derivatives); and many built-in functions like parseInt and parseFloat().
    Mozilla''s JavaScript reference labels its built-in objects as GlobalObjects¹
    and Global Functions¹¹ (functions in JavaScript are types of objects).'
