    selects all attributes of the current node; child::text() selects all text nodes
    of the current node; child::node() selects all child nodes of the current node;
    descendant::dvd selects all dvd descendants of the current node; ancestor::dvd
    selects all dvd ancestors of the current node; child::*::title selects all title
    grandchildren of the current node.


    # 3.6.2 Transforming XML Documents into XHTML Documents


    XSLT is the major component of XSL, and it allows you to use the XML syntax to
    transform the instance documents of a particular XML dialect into those of another
    XML dialect or into other document types such as PDF. One of the popular functions
    of XSLT is to transform XML documents into HTML for web-based presentation, as
    shown in the examples in this section.


    XSLT is based on DOM tree representation in memory. A common way to describe the
    transformation process is to say that XSLT transforms an XML source tree into
    an XML result tree. In the transformation process, XSLT uses XPath expressions
    to define parts of the source document that should match one or more predefined
    templates. When a match is found, XSLT will transform the matching part of the
    source document into the result document.'
