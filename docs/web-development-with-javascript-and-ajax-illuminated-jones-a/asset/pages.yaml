  md: 'used to retrieve an image from the database and write the byte array into the
    output stream when HTML responses are generated. The source code of FetchImage
    is shown in Listing 8.7.1. The servlet accepts two parameters: (1) ID, the identifier
    of the item, and (2) maxwidth, the maximum image width to display. The image saved
    in the database can have higher resolution than the one being displayed on the
    web page. The servlet can scale an image to satisfy the needs of the page.


    As shown in Listing 8.7.1, function messageImage() scales the image. The basic
    idea is to call Graphics2D.scale() to scale the canvas that the image is being
    drawn on. Then Graphics2D.drawImage() is invoked to draw the image that is scaled
    to the canvas. The result is returned as a byte array.


    Function retrieveImage() retrieves the binary data of the image for an item for
    sale. It calls messageImage() to scale to maxwidth and returns the data. The SQL
    statement is constructed on the fly, and JDBC is used to execute the SQL statement.


    Function processRequest() serves incoming HTTP requests. No matter whether the
    request is of type GET or POST, the value of the parameters can be easily retrieved
    using Request.getParameter(). processRequest() gets the value of two parameters,
    ID and maxwidth, calls retrieveImage() to get the byte array of the desired image,
    and then writes the byte array as output. Before the output is written, the content
    type of the HTTP response is set as img/jpeg by the program.


    The Fetch servlet is called by the PostItem.jsp page. Next you will study the
    implementation of PostItem.jsp. The visual layout of the page is shown in Figure
    8.7.1. As shown in the figure, a sale event organizer can upload the price, brief
    description, keywords, and a JPEG image for each item for sale. A data table control
    at the bottom of the page. It can be bound to a data source. Manipulation of data
    can be simplified using the default functions provided by the data table control;
    hence, a programmer does not have to directly write the SQL statement. This feature
    can greatly simplify the implementation of many database application scenarios.


    As shown in Figure 8.7.1, once the Add button is clicked, a new record about inserted
    into the database. Because of the use of the data table control, the addition
    of the new item can be simplified. Listing-8.7.2 presents the handling of the
