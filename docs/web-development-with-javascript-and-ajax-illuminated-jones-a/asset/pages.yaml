  md: "To support registering multiple event handlers for one element, all nodes in\
    \ DOM Level 2 implement the EventTarget^52 interface, which defines the methods\
    \ addEventListener() and removeEventListener(). These methods are for adding and\
    \ invoking, respectively, the event handlers (called listeners in Level 2) to\
    \ be invoked in response to a particular event. Both methods require three arguments.\
    \ The first argument specifies the event for which you want to \"listen\" (e.g.,\
    \ submit). The second argument specifies the function that should be invoked when\
    \ the event passes. The third parameter is a Boolean that specifies whether the\
    \ listener is to be used during the capturing phase (true) or the bubbling phase\
    \ (false). You can add as many listeners to a node as you like, even for the same\
    \ event. They will all be invoked when the event occurs; however, the DOM does\
    \ not guarantee in which order the listeners are invoked. The following code demonstrates\
    \ adding and removing a listener for the submit event on the <form> tag of Figure\
    \ 4.4.10.\n\n```\nfunction validateForm(/* instance of Event */ eventObj) {\n\
    \  // The target is the <form>\n  var form = eventObj.target;\n  if (form.input.value.length\
    \ == 0) {\n    // Prevent the form from being submitted.\n    eventObj.preventDefault();\n\
    \  }\n\n  // Demonstrate removing a listener.\n  form.removeEventListener(\"submit\"\
    , validateForm, false);\n}\n```\n\n```\nvar form = document.getElementsByTagName(\"\
    form\")[0];\n// Add validateForm() as a submit event listener.\nform.addEventListener(\"\
    submit\", validateForm, false);\n```\n\nAll modern browsers except Microsoft Internet\
    \ Explorer support the DOM Level 2 event model. IE is typically slow to adapt\
    \ to standards set by the W3C, which is unfortunate for developers because we\
    \ are forced to work around the incompatibilities. IE event model does not have\
    \ a capture phase, has event objects, and uses a different method for registering\
    \ events. Also, IE has memory leak problems that are exacerbated by event registration.\
    \ Listing 4.4.6 provides code that you can use to handle cross-browser event handling\
    \ and memory leaks.\n\n^52http://www.w3.org/TR/DOM-Level-2-Events/events.html#Events-EventTarget."
