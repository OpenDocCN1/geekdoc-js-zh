  md: '# CHAPTER 2 Web Pages Using Web Standards


    If the user clicks on the submit button now, the web browser will generate an
    HTTP POST request to the web resource "http://localhost:8080/demo/echo" specified
    by the action attribute of the form element. Basically, a TCP/IP communication
    channel will be created to connect the web browser to the Tomcat web server running
    on port 8080, and the following HTTP request text (simplified) will be sent through
    the TCP/IP channel to the Tomcat web server.


    ```

    POST /demo/echo HTTP/1.1

    Accept: text/html

    Accept: audio/x

    User-agent: Mozilla/5.0

    Referer: http://localhost:8080/demo/echoPost.html

    Content-length: 8

    ```


    user=Ada


    The first line of an HTTP request is used to specify the submission type, GET
    or POST; the web resource on the web server for receiving and processing the submitted
    data; and the latest HTTP version that the web browser supports. As of 2008, version
    1.1 is the latest HTTP specification. The following lines, up to before the blank
    line, are header lines for declaring web browser capabilities and extra information
    for this submission, each of "name: value". The first two accept headers declare
    that the web browser can process HTML files and any standard audio file formats
    from the web server. The User-agent header declares the software architecture
    of the web browser. The Referer header specifies the URL of a web page from which
    this request is generated (this is how online companies like Amazon and Yahoo
