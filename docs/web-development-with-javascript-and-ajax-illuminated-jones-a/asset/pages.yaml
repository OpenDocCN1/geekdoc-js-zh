    add(); // Displays 3\nalert(add.length); // length can also be referenced outside\
    \ the function.\n```\n\n# 4.1.8.2 Lexical Scoping and Closures\n\nJavaScript functions\
    \ use the scope in which they are defined, the scope in which they are executed.\
    \ This concept is called lexical scoping. When a function is defined, the current\
    \ scope chain is saved and becomes part of the internal state of the function.\
    \ The scope chain includes, in order, the function's Arguments object, parameters,\
    \ local variables, and any containing objects from outside in in order of containment.\
    \ Therefore, as expected, the function has access to the variables in containing\
    \ functions except those hidden by local variables with the same name. The last\
    \ item in the scope chain is the global object. For functions defined at the top\
    \ level, the global object is the only containing object.\n\nThe combination of\
    \ the code to be executed and the scope to be executed in is called a closure.\
    \ JavaScript functions are closures, as demonstrated in the following example.\
    \ This example illustrates that the exported nested function (the closure) retains\
    \ a reference to the values of the containing function's arguments as were when\
    \ the nested function was created.\n\n```\nfunction createFunction(x) {\n  return\
    \ function() { return x; }\n}\nvar fiveFunction = createFunction(5);\nvar tenFunction\
    \ = createFunction(10);\nalert(fiveFunction()); // Displays 5\nalert(tenFunction());\
    \ // Displays 10\n```\n\nAn interesting use of this behavior is using closures\
    \ to create a persistent and private variable. JavaScript does not have a notion\
    \ of private variables like in Java. Yet in the following example we can create\
