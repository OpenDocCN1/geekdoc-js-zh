  md: '# CHAPTER 5 Web Remoting Techniques—the A Ajax


    users’ expectations of bookmarking ability by changing only content on the page
    that strictly has an “application” feel to it, but this approach will take you
    only so far. It is important that you design for the ability to bookmark the state
    of your web application even though you may have to provide a nontraditional way
    for the user to bookmark it. For example, after scrolling and zooming a map in
    the Google Maps application, you cannot bookmark what you see by simply activating
    your browser’s bookmark feature. To solve this problem, Google Maps provides you
    a “Link to this page” hyper-link a URL that you can paste into your navigation
    bar and then bookmark. The Yahoo! User Interface library’s Browser History Manager
    mentioned earlier also helps with establishing a bookmarkable state.


    Finally, we will discuss a security restriction that frustrates many web developers
    called the same-origin policy. This policy prevents JavaScript code from reading
    or setting the properties of windows and documents that have a different origin
    from that of the document containing the script. The origin of a document includes
    the protocol, the domain name (host), and port of the URL from which the document
    was loaded. Documents belonging to the same origin if and only if those three
    values are the same. For example, all the following URLs have a different origin.


    ```

    http://www.ajaxbook.com

    http://www.ajaxbook.com:8443

    https://www.ajaxbook.com

    http://www.ajaxbook.com

    http://carsearch.ajaxbook.com

    ```


    In other words, if the page in which your JavaScript code is loaded pulled from
    http://www.ajaxbook.com and you wanted to use an XML-HttpRequest to directly grab
    some data from an Amazon web service, you would be out of luck. The same-origin
    policy was implemented to prevent malicious scripts in one frame or window from
    accessing personal content in another frame or window.


    The only current, cross-browser exception to the same-origin policy applies to
    windows and frames. The domain property of the Document object, by default, contains
    the hostname of the server from which the document was loaded. JavaScript in two
    different windows or frames can change their domain property to the same domain
    to interact with each other. However, the domain property can be set only to a
    valid domain suffix of the default value. For example, if the default value is
    “www.ajaxbook.com” then you'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# 5.5 Web Remoting Pitfalls


    can change the value only to ''ajax.com''. The domain must have at least one dot
    in it, so it cannot be set to a top-level domain, like ''com''. For example, if
    one frame loaded a document from http://carsearch.ajaxbook.com and another loaded
    a document from http://www.ajax.com, JavaScript loaded in those two frames could
    both set their domain property to ''ajax.com'' and communicate with each other.


    Another exception to the same-origin policy has been drafted by the W3C and implemented
    by Firefox 3. When this chapter was written, the W3C''s Access Control for Cross-site
    Requests²²² specification was in draft form and Firefox 3 was in beta. The access
    control specification provides two methods through which you can cross-site XMLHttpRequestRequests.
    The first is using an Access-Control header set by the server. For example, if
    a server sets the following in an HTTP response, you would be able to get this
    document using XMLHttpRequest and Firefox 3 even if your document loaded from
    a different server.


    ```

    // Anyone is allowed to access this resource.

    // Change the * to a domain name to restrict by domain.

    Access-Control: allow <>

    ```


    The second technique uses an XML processing instruction to express the same information.
    For example, the following at the top of an XML file that was returned as the
    body of an HTTP response would also work.


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <access-control allow="ejohn.org">

    ```


    Because these techniques are not currently widely supported by browsers, you may
    be wondering what you can do now to pull in content or data from another site
    using XMLHttpRequest. The common solution that web developers use is to put a
    proxy on the server that forwards your requests for data from another site. In
    this solution (the browser) make an XMLHttpRequest to your server with the URL
    of another site that you want to contact. Your server sees that you want to get
    data from another domain, so the server makes the request for that URL and sends
    the response to you (the browser). Therefore, the server makes the cross-site
    request instead of the browser.


    ²http://www.w3.org/TR/access-control/'
