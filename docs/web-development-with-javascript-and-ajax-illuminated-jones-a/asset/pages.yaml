    # 5.3 Hidden IFrame


    Long before there was widespread browser support for, or use of, an-XMLHttpRequest
    object, developers were using hidden frames to make requests to the server without
    reloading the page that you are viewing. The <frame> and <iframe> tags became
    an official part of the HTML specification with version 4.0 in April 1998. A frame
    is essentially a window that is embedded in the browser''s main window. Frames
    are independent of the main window in that they can load their complete HTML page
    without affecting the content loaded in the rest of the browser. You can hide
    a frame using CSS and use JavaScript to dynamically load content into the hidden
    frame without the user''s knowing. A <frame> tag must be declared inside a <frames>,
    which replaces the <html> tags. A <frames> does not display any content itself;
    its nested frames do. In contrast, an <iframe> can be placed anywhere between
    the <body> tags, and so it becomes embedded in the content of the HTML page. The
    <iframe> tag has become more popular than the <frame> tag partially because when
    the code uses a <frames> the browser''s location bar points to the URL of the
    <frames> instead of the URL of the content actually being viewed by the user,
    which prevents the user from marking the page.


