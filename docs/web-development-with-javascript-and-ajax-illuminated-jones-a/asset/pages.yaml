    Node interface

    Node insertBefore(Node newNode, Node refChild)


    The insertBefore() method inserts the new child in the childNodes list before
    the given existing child and returns the inserted node. In other words, the insertBefore()
    method makes the new child the previous sibling of the existing child. If refChild
    is null, the new child is added to the end of the list. If the new child is already
    in the list, it is first removed. The following code example inserts a new paragraph
    before the first paragraph of the document.


    ```

    var newParagraph = document.createElement("p");

    var firstParagraph = document.getElementsByTagName("p")[0];

    document.body.replaceChild(newParagraph, firstParagraph);

    ```


    Node replaceChild(Node newNode, Node oldChild)

    The replaceChild() replaces an existing child with a new child and returns the
    old node. If the new child is already there, it is first removed. The following
    code example replaces the first paragraph with a horizontal rule.


    ```

    var hRule = document.createElement("hr");

    var firstParagraph = document.getElementsByTagName("p")[0];

    document.body.replaceChild(hRule, firstParagraph);

    ```


    Node removeChild(Node oldChild)

    removeChild() method removes the specified child and returns it. The following
    code example removes the first paragraph of the document.


    ```

    var firstParagraph = document.getElementsByTagName("p")[0];

    document.body.removeChild(firstParagraph);

    ```


    Node appendChild(Node newNode)

    appendChild() method adds the new child to the end of the childNodes list and
    returns the newly added node. If the new child is already there, it is first removed.
    The following code example adds a new paragraph to the document.


    ```

    var newParagraph = document.createElement("p");

    document.body.appendChild(newParagraph);

    ```


