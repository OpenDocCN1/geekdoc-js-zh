    # 4.1.11 Error Handling and Error Objects


    JavaScript defines several objects that represent errors, which include EvalError,
    RangeError, ReferenceError, SyntaxError, TypeError, and URIError. These objects
    are generated by the JavaScript interpreter when a runtime error occurs. Each
    error object contains a message property that contains an error message.19


    You can throw an exception by using the throw keyword followed by an expression
    that evaluates to any type. So you can throw an instance of Error or simply a
    string.


    ```

    throw new Error("My error message");

    throw "An error message";

    ```


    When an exception is thrown in JavaScript, the interpreter stops normal program
    execution and jumps to the nearest exception handler. If no exception handler
    is found, the error is reported to the user. You can define an exception handler
    by using the try/catch/finally statement. The try block surrounds the code that
    you expect to throw an exception, the catch block handles an exception if one
    occurs, and the finally block defines code whether an exception is thrown or not.
    The catch block does not specify a type like in Java or C++, so there is no need
    for the ability to specify multiple catch blocks. The single catch handles any
    error type. As in Java, you can use the try and finally blocks without a catch
    block.


    > 18http://developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference:Global_Objects:RegExp.


    > 19http://developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference:Global_Objects:Error.'
