  md: '# CHAPTER 1


    # Ajax Defined


    Chapter Objectives


    +   - Give a brief history of the Internet

    - Describe basic web architecture, including URLs and HTTP

    - Discuss how user interaction on the Web has evolved

    - Discuss how Ajax is and how it is important


    You may not yet know exactly what Ajax is or the technologies involved, but you
    have probably already used websites that are built on Ajax. Many of the most popular
    sites on the Internet use Ajax, including Google Maps (http://maps.google.com),
    Yahoo! (http://www.yahoo.com), Facebook (http://www.facebook.com), Flickr (http://flickr.com),
    and Amazon.com''s A9 search engine (http://a9.com). The Internet has undergone
    tremendous change from its beginnings as a means for scientists to exchange research
    documents to a platform for dynamic, distributed applications. The latest evolution
    has brought the user experience of desktop applications to the Web—made possible
    by Ajax. This book teaches you the basic skills you need to develop dynamic web
    applications that provide the user a desktop application-like experience. But
    first, we will cover a little history.'
  merge: -1
