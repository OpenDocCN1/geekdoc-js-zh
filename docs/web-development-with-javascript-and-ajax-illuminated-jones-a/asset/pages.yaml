  md: '# 10.8 MySQL


    # 10.8.1 Overview


    MySQL is the most popular open-source relational SQL database system in the world.
    The MySQL database server provides a multithreaded, multiuser, and robust SQL
    information management environment for mission-critical, heavy-load production
    systems. MySQL can be used as a back end for any information management system
    and is accessible with almost all programming languages or script languages. A
    MySQL database can be hosted on any web server and is often coupled with PHP for
    web applications so that the information on the MySQL database can be accessed
    anywhere in the world with any web client.


    PHP can collect data and send data to the MySQL database, and MySQL can in turn
    store the information. PHP can send a request to database and get a response from
    the database. PHP and MySQL combine to make web applications easier and more powerful
    in producing interactive and dynamic web pages on the fly. HTML can create useful
    and well-formatted web pages.


    For example, web clients can use PHP to browse an online shopping catalog stored
    in a MySQL database, creating a shopping cart for clients to dynamically add or
    remove items to or from a shopping cart. MySQL can keep track of customer information,
    transaction information, and shipping and handling information.


    # 10.8.2 Practice Lab for MySQL, PHP, and Apache


    Let us practice AMP (Apache, MySQL, and PHP) in this lab. Download MySQL Community
    Server from http://dev.mysql.com/downloads/index.html; the current release version
