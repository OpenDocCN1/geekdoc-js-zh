- img_proc: true
  md: "# 10.8 MySQL\n\nTo let PHP work with MySQL, you need to have PHP installed\
    \ as demonstrated in the previous tutorial.\n\nIn the configuration file C:\\\
    php\\php.ini, uncomment the following two lines:\n\n```\nextension=php_mysql.dll\n\
    extension=php_mysqli.dll\n```\n\nCopy the file mysql.dll from C:\\php into C:\\\
    windows\\system32.dll\n\nMake sure that you have php_mysql.dll and php_mysqli.dll\
    \ in your C:\\php directory.\n\nCreate a test.php file in Apache root folder htdocs,\
    \ and add the following code to the:\n\n```\n...\n<?php\n$con = mysqli_connect('localhost','root','admin');\n\
    if (!$con)\n{\n    die('Could not connect: ' . mysql_error());\n}\nelse\n{\n \
    \   echo \"connected\";\n}\nmysql_close($con);\n?>\n...\n```\n\nAfter start up\
    \ your Apache server and visit http://localhost/test.php, you should see a line\
    \ reading \"connected\" in your browser. This indicates that you have linked Apache\
    \ server, PHP, and MySQL successfully.\n\n# 10.8.3 A Simple MySQL Application\n\
    \nIn this section, you will create an online MYSQL application with PHP that will\
    \ verify any names requested online against the names stored in MySQL database.\n\
    \nFirst, log in to MySQL (Start→All Programs→MySQL→MySQL Server 5.0→MySQL Command\
    \ Line Client)."
  merge: -1
  pgno: 490
- img_proc: true
  md: "Next, execute the following SQL commands to create a MySQL table with\none\
    \ name data field (string type) and insert a few data records.\n\n```\nmysql>\
    \ create database my_db;\nmysql> use my_db;\nmysql> create table nameTB (varchar(20));\n\
    mysql> insert into nameTB (name) values ('John');\nmysql> insert into nameTB (name)\
    \ values ('smith');\nmysql> insert into nameTB (name) values ('Mike');\nEnter\
    \ the following code in your test.php file.\nphp\n$con = mysql_connect('localhost','root','admin');\n\
    if (!$con)\n{\n    die('Could not connect: ' . mysql_error());\n    exit();\n\
    }\nmysql_select_db(\"my_db\", $con);\n$name = $_POST['name'];\nif ($name)\n{\n\
    \    $query = \"SELECT * FROM nameTB WHERE name = '\" . $name . '';\";\n    $result\
    \ = mysql_query($query);\n    if (mysql_fetch_array($result))\n    {\n       \
    \ echo \"Welcome back, \" . $name;\n    }\n    else\n    {\n        echo \"Sorry,\
    \ you are not registered\";\n    }\n}\nmysql_close($con);\n?>\n<form action=\"\
    test.php\" method=\"post\">\nName: <input type=\"text\" name=\"name\" />\n<input\
    \ type=\"submit\" value=\"submit\"/>\n</form>\n```"
  merge: -1
  pgno: 491
- img_proc: true
  md: '# 10.9 Summary


    Now, if your typed name matches any name in the table (John, Smith, Mike), it
    will be recognized. Otherwise, your request will be refused.


    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_492_0.png)


    An unregistered user will be rejected as follows.


    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_492_1.png)


    # 10.9 Summary


    This appendix has given you many hands-on labs to practice using various open-source
    web servers that JavaScript and Ajax clients can make requests to get responses
    from. You can see that the same JavaScript or Ajax client application can access
    different servers with only minor changes. You can choose any specific introduced
    technology to review and practice the materials that you have learned in this
    book.'
