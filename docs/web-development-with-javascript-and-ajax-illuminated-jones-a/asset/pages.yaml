  md: '# NetBeans and Tomcat


    # 10.5.1 Overview of NetBeans


    The NetBeans IDE is a free, open-source Integrated Development Environment (IDE)
    for Java software developers. It covers all Java Standard Edition (Java SE), Java
    Enterprise Edition (Java EE, previously called J2EE), and Java Micro Edition (was
    called J2ME)—all in one IDE environment. This IDE runs on almost all platforms,
    including Windows, Linux, Solaris, and the Mac OS. It is easy to install, and
    developing Java-based cross-platform desktop, Enterprise, web, and mobile applications
    is convenient. It is also a useful software development (CBSD) tool to create,
    reuse, and deploy Java JAR, WAR, and EAR components.


    NetBeans provides the following:


    +   - Swing GUI Builder, Integrated CVS Version Control, NetBeans Debugger with
    Tshirt, Developer Collaboration for project sharing in real time, and Ant-based
    system and customizable environment tools

    - Source Code Editor for Java SE and JSP Development: XML Editor for DTD, Schema,
    and CSS plus C/C++ development

    - Web server application development tools with JSP, servlets, JavaServer Faces
    (JSF) and Struts (Java Enterprise Edition), Sun Application Server, WebLogic,
    and JBoss

    - RJB developments with ear-jar deployment

    - Visual web application development for Ajax, CSS, and JSF; Web Service development
    with Java Enterprise Edition for WSDL and web implementation development and deployment;
    BEPL design, development, and testing tools

    - Web client platform development

    - Mobile application development (Java Micro Edition) including Connected Limited
    Device Configuration (CLDC), CDC, and Mobile Information Device Profile (MIDP);
    Java ME development cycle tools

    - UML modeling tools with code generators

    - Embedded Tomcat server'
