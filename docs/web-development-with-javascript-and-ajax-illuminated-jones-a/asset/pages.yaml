    # ## 10.3 Apache


    # ### 10.3.1 Overview of Apache Web Server


    Apache is a popular open-source HTTP-compliant web server developed by the Apache
    Software Foundation. By more than 60% of websites in the world use Apache. Many
    commercial vendors have adopted Apache-based solutions for their products, including
    Amazon, Yahoo, IBM, Red Hat, and ORACLE.


    The Apache development group said: The Apache HTTP Server Project is an effort
    to develop and maintain an open-source HTTP server for modern operating systems
    including UNIX and Windows NT. The goal of this project is to provide a secure,
    efficient and extensible server that provides HTTP services in sync with the current
    HTTP standards.'
  merge: -1
  pgno: 450
- img_proc: true
  md: 'The Apache server is a powerful, flexible, HTTP/1.1 compliant web server which


    +   - implements the latest protocols, including HTTP/1.1

    - is highly configurable and extensible with third-party modules

    - can be customized by writing ''modules'' using the Apache module API

    - provides full source code and comes with an unrestricted license

    - runs on Windows, Netware 5.x and above, OS/2, and most versions of Unix, as
    well as several other operating systems

    - is actively being developed

    - encourages user feedback through new ideas, bug reports and patches


    Apache is constructed in a Module architecture. A module can be reused to develop
    other modules, protocols, or applications. A new module can be written in any
    Apache-supported language. This feature greatly increases its adaptability, extensibility,
    scalability, and flexibility, making Apache much more powerful.


    Apache server security is another important feature. It has modules to support
    the Secure Socket Layer (SSL) and Transport Layer Security (TLS) protocols that
    allow data between the web server and the client to be encrypted. Also, Apache
    has modules to support Authentication and Access Control to authenticate against
    plain text and database files. It also provides authentication to determine the
    identity of a client, usually by verifying a username and password against a back-end
    database.


    Apache''s scalability is supported by Load Balancing, and Request Redirection
    is another advantage that you gain with Apache.


    Apache''s stability is another reason for its popularity. Apache is portable,
    so it can run on any platform, including UNIX, Linux, Windows, and Mac OS X. The
    original Apache was developed based on the NCSA HTTPd web server. Its name came
    from A Patchy server because it was developed from existing NCSA code with many
    patches.


    Another important feature is its high performance with multiprocessing and multithreading.
    Apache can be configured in a pure process-based server mode, a purely threaded
    server mode, or a mixture of those two. One process can run multiple threads simultaneously.
    Threads can share data'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# 10.3 Apache


    and code in memory within a process, but each process has its own dedicated memory
    space. There is a tradeoff in reliability between these two modes because of the
    resource sharing.


    Apache is available for download at http://httpd.apache.org.


    The current version of Apache supports web development platform integration, meaning
    that an Apache module can be written entirely in the integrated language platforms.
    Apache has several integrated modules support web application tools with the server
    such as Java and C#. Here is a list of Apache integrated platforms.


    +   - PHP (a popular Apache module) is a server-side, cross-platform, HTML-embedded
    scripting language that has many supporting modules, including a database connectivity
    module for popular databases using ODBC, Oracle, MS-SQL server, MySQL, and PostgreSQL

    - XML

    - HTTP, FTP

    - Directory support: LDAP

    - PDF generation

    - CORBA

    - SNMP


    Apache integrates Mono .NET and ASP .Net Microsoft frameworks and exposes the
    Apache API to the .Net framework so that developers can write modules in C#, or
    VB .NET and run .Net web applications on Apache instead of Microsoft IIS.


    Many application servers, including Oracle Application server, IBM WebSphere,
    and BEA WebLogic, also provide modules to integrate with the Apache web server.
    Apache also integrates Java-based Tomcat to run all Java server-side applications
    such as servlets and JSP.


    Apache has integrated modules to support many script languages such as PHP, JavaScript,
    Ruby, and Python for web applications as well. Apache web server also supports
    the MySQL database server.


    A typical ideal web server configuration for Apache web application is the common
    acronym LAMP (Linux–Apache–MySQL–PHP).'
