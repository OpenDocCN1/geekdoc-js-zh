  md: "# 6.2 Dojo xhrGet Request with JSON Data\n\n```\n<div id='Message'></div>\n\
    <span>\n<body>\n</html>\n```\n\nIn this example you wrap all properties in an\
    \ object, c1, and pass it to the xhrPost() function. When the user types a username\
    \ in the input box, the username goes with \"myName\" object. Once the URL target\
    \ gets the request, the response.jsp at the server responds to it with a greeting,\
    \ \"Hello <username>\", where username is the user typed at the client side.\n\
    \n```\nString name = request.getParameter(\"myName\");\nif (name != null && name.trim().equals(\"\
    \"\")) {\n    out.print(\"Hello \" + name + \"!\");\n} else {\n    out.print(\"\
    You didn't enter a name!\");\n}\n```\n\nHere the request.getParameter(\"myName\"\
    ) transfers the username user input in the form and assigns it to a variable name\
    \ and displays the greeting on the JSP page. In this example, there are two JSP\
    \ pages; one is used for form input and the other is used for the response.\n\n\
    # 6.2 Dojo xhrGet Request with JSON Data\n\nIn this section you will see how easily\
    \ the JSON data can be handled in the Dojo xhrGet() Ajax request. Dojo web developers\
    \ frees from complicated Ajax request configuration and coding tasks such as parsing\
    \ and converting the JSON data into a JavaScript object. You just need to specify\
    \ that the response is handled in JSON format. Assume that the ajaxData.txt file\
    \ on the server has JSON syntax data as,\n\n```\n{\n  \"Name\": \"Bill Jones\"\
    ,\n  \"Education\": {\n    \"Undergraduate\": \"Physics\",\n    \"Graduate\":\
    \ \"CS\"\n  },\n  \"Skills\": [\"Ajax\", \"Ruby\"]\n}\n```"
