    # 2.4.3 HTTP GET vs. HTTP POST


    HTTP GET was initially designed for downloading static web pages from web servers,
    and it used short query strings to specify the web page search criteria. HTTP
    POST was initially designed for submitting data to web servers, so it used the
    request entity body to send data as a data stream, and its response normally depended
    on the submitted data and the submission status. Although both HTTP GET and HTTP
    POST can send user requests to web servers and retrieve HTML pages from web servers
    for a web browser to present, they have the following but important differences:


    +   - HTTP GET sends data as query strings, so people can read the submitted data
    over the submitter''s shoulders.

    - Web servers have limited buffer size, typically 512 bytes, for accommodating
    query string data. If a user submits more data than that limit, the data would
    be truncated, the web server would crash, or the submitted data could potentially
    overwrite some computer code on the server and the server would be led to run
    hideous code hidden as the query string data. The last case is the so-called buffer
    overflow, a common way for hackers to take control of a server and spread viruses
    or worms.'
