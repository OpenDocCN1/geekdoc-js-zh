  md: '# 10.4 PHP


    10.4.1 Overview

    PHP is just one of many popular web server–side open-source scripting languages.
    PHP is a perfect server scripting language to handle the Ajax XMLHttpRequest.
    It is widely used for web application development. There are more than half a
    million server pages developed by PHP. It is still growing fast.


    PHP is often embedded into HTML to enhance HTML functions. PHP allows you to interact
    with an HTML page dynamically. PHP collects data from the page where the user
    provides information and then processes and uses the data to create dynamic home
    page output.


    PHP can do all the tasks that ASP and JSP can do, and it is free. Why is PHP so
    popular?


    +   - PHP is open source and free.

    - PHP is much more compact than Java and .NET in terms of its system size.

    - PHP is portable and runs on Linux, Windows, and Mac platforms.

    - PHP is a server-side script language that is easily adopted.

    - PHP has fast connections to popular databases compared with Perl.

    - PHP is integrated with the open-source MySQL database.

    - PHP is an object-oriented interpreter language.

    - PHP web pages work with all popular major browsers.

    - PHP has integrated linking to XML, PDF, SWF, and Java for dynamic creation and
    processing.

    - PHP syntax is familiar to users of C, Perl, and Java.


    PHP meshes with HTML well because PHP is designed to be used along with HTML.
    You can embed PHP into an HTML document or put HTML tags in PHP coding seamlessly.'
