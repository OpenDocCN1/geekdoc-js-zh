  md: '# CHAPTER 9 The Future of Web Applications


    have different interface requirements, but you can use the same data model to
    fit all these requirements. Reuse of the same data model for all devices is one
    of the important advantages of XForms over HTML forms. Also, XForms enables multiple
    submit buttons to act on the same data model with different purposes versus just
    one button in HTML forms.


    XForms has many other advanced features over HTML. For example, new data can be
    requested and used to update on the fly just like XmlHttpRequest/Ajax.


    In summary, the advanced features of XForms are the following:


    +   - Enhanced application application accessibility because of its generic user
    interface. XForms works equally well with accessible technologies.

    - Usability of XML-based submission. It can load XML and submit XML data. XForms
    is integrated with XML technologies. It can reuse existing XML schema.

    - Device adaptability of supporting multiple devices because of the separation
    of model and interface. The same form without change can fit a traditional browser,
    a PDA, a mobile phone, or any other device. A form needs to be written only once
    for many clients.

    - Writing forms is easy because of the declarative markup of properties of values
    and relationships between values. Using available XML parsing and handling packages
    is also easy.


    XForms is the next generation of web form applications. Almost all web applications
    have web forms, so it will have a huge effect for future deployment.


    # 9.3 Semantic Web


    # 9.3.1 Overview


    Semantic Web is the next generation of the web as recommended by the W3C consortium
    in 2001. The Semantic Web is a web of computer-processable data that is an extension
    of the current World Wide Web. The data in the current Web is structured in a
    way for browsers to access or for search engines rather than being organized in
    prestigned semantic formats so that application programs can understand, retrieve,
    and process the data automatically and effectively. Tim Berners-Lee, a pioneer
    of'
