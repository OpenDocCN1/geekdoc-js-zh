    The last task will be to display driving directions and compute the arrival and
    departure times for each sale event. toggleDiv() and printTime() are two assisting
    functions. toggleDiv() toggles the visibility of a DIV element between the hidden
    and visible state. It is used to show and hide the DIV element that displays driving
    directions. PrintTime() prints out a date-time object in hh:mm:ss format.


    Once the Load button is clicked, loadDirection() is used to load the list of street
    addresses of sale events into Google Maps and display the corresponding driving
    directions. It first collects an array of complete addresses from the items in
    the itinerary pane. The home address of the user is the first element of this
    array. It then calls the loadFromPoints() function provided by GDirections (Google
    Maps Driving Directions) object, which loads the array of street addresses into
    the Google Maps object. Function updateArrivalTimeTime() is then called by LoadDirection()
    to reset the departure and arrival times of each sale event, depending on the
    estimated driving time reported by Google Maps. Function updateArrivalTimeTime()
    queries the GDirections object to get a list of GRoute objects. Each route corresponds
    to the driving route from one sale event in the itinerary to the next. By invoking
    the getDirection() function provided by GRoute, updateArrivalTimeTime() can calculate
    the departure and arrival times for each sale event. It resets the corresponding
    HTML labels for each event to display the updated departure time.'
