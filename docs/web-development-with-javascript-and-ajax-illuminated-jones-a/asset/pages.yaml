  md: '# 4.3 The Browser Object Model (BOM)


    The rest of the techniques for embedding JavaScript in HTML are discouraged, particularly
    the technique of assigning JavaScript code to an HTML event handler attribute
    and the use of the javascript: pseudoprotocol. You can accomplish everything you
    need with external JavaScript files.


    JavaScript may be the most popular scripting language for the Web, but it is not
    the only one. Therefore, the HTML specification, to be language neutral, allows
    you to tell the browser what language is used in your `<script>` tags. You identify
    what language you are using by declaring a MIME type. The MIME type for JavaScript
    has traditionally been text/javascript; however, because JavaScript programs are
    not real text documents, Internet standards have deprecated that type in favor
    of application/javascript. Unfortunately, the support for application/javascript
    is not yet widespread.


    You can specify the default scripting language for all scripts in the HTML file
    by using the `<meta http-equiv="Content-Script-Type" content="text/javascript"
    />`


    ```

    <meta http-equiv="Content-Script-Type" content="text/javascript" />

    ```


    Or you can do so for a specific script with the type attribute of the `<script
    type="text/javascript"></script>`


    ```

    <script type="text/javascript"></script>

    ```


    Most browsers default to assuming that your code is JavaScript if you do not specify
    a MIME type, but it is a good idea to specify one anyways.


    # 4.3 The Browser Object Model (BOM)


    The Browser Object Model (BOM) defines a set of host objects and their relationships,
    which are used to manipulate or obtain information about the browser. The BOM
    provides an API to display dialog windows, open and close new browser windows,
    resize windows, the browser window size, move backward and forward through the
    browser history, get the browser name and version, get the operating system name,
    load a new document, and more. The BOM is not standardized by a standards body,
    such as the W3C, but is a facto standard that you can rely on all modern browsers
    to provide. However, the BOM is not the same in each browser—only a core set of
    objects are the same, which this section will'
