    Node previousSibling

    Node nextSibling


    The Node interface provides several properties for directly accessing immediate
    nodes. The parent property returns the parent node (only Element nodes can be
    parents, but all nodes, except for Document, have a parent). The firstChild property
    returns the first node in the NodeList returned by children, whereas the lastChild
    property returns the last node in list. When two nodes have the same parent, they
    are called siblings, which means that the nodes in the NodeList returned by the
    parent''s childNodes property. The previousSibling of a node returns the sibling
    node that comes before it in the children list, whereas the nextSibling property
    returns the node that comes after it. Figure 4.4.7 illustrates these relationships.


