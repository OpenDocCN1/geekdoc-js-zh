- img_proc: true
  md: '# 3.6 XML Transformation with XSLT


    where the optional axis name specifies the tree relationship between the selected
    nodes and the current node, the node test identifies a node type within an axis,
    and zero or more predicates are for further refining the selected node set.


    Let us first look at some simpler path expressions in which the axis names and
    predicates are not used. Here the most useful path expressions include the following:


    | Expression | Description |

    | --- | --- |

    | nodeName | Selects all child nodes of the named node |

    | / | Selects from the root node |

    | // | Selects nodes in the document from the current node that match the selection,
    no matter where they are |

    | | Selects the current node |

    | .. | Selects the parent of the current node |

    | @ | Selects attributes |

    | text() | Selects the text value of the current element |

    | * | Selects any element nodes |

    | @* | Selects any attribute node |

    | node() | Selects any node of any kind (elements, attributes,...) |


    Relative to the previous XML document dvd.xml, path expression library selects
    all the library elements in the current node set; /library selects the root element
    library; library/dvd selects all dvd elements that are children of library elements
    in the current node set; //dvd selects all dvd elements, no matter where they
    are in the document (no matter how many levels in which they are nested in other
    elements) relative to the current node set; library//title selects all title elements
    that are descendants of the library elements in the current node set, no matter
    where they are under the library elements; //id selects all attributes that are
    named “id” relative to the current node set; and /library/dvd/title/text() selects
    the text values of all the title elements of the dvd elements.'
