    is pushed to the client from the server in the same manner as page streaming.
    An advantage to service streaming, however, is that you can push just about any
    data that as long as you can process it in JavaScript (like JSON). With page streaming,
    you can push only HTML tags because the browser is processing the data as it is
    part of the initially loaded page. If you were to push a JSON string across page
    streaming the string would most likely be written to the page for the user to
    view—surely not the outcome that you want. Figure 5.4.2 illustrates the communication
    in service streaming.


    With service streaming, you have a bigger challenge in handling the data that
    is pushed to the browser because you must process it yourself. When you use page
    streaming, the browser automatically processes the HTML tags that you send across.
    With service streaming, the XMLHttpRequest response string grows with each push
    from the server. In other cases, the data is appended to what has already been
    sent. You must repeatedly parse the responseText string to find out what the server
    sent last. One way to make this approach is to delimit the data with a token that
    a regular expression can look for, like @end@, or encapsulate your data in JSON
    strings, which are naturally delimited by curly braces, {}. With a delimiter,
    the regular expression can look as simple as: `/^\.@end@\*(.*)\end@$/`. Or you
    could alternatively keep track of the index in the string where you read to last
    time, and next time check for data only after that index.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# 5.5 Web Remoting Pitfalls


    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_234_0.png)


    A drawback to service streaming is that browser support for this technique is
    not widespread. For example, Firefox invokes the onreadystatechange handler with
    a readyState of 3 chunks of data are received from the server, but Internet Explorer
    does not not call onreadystatechange until the response is complete. An alternative
    technique is to use a hidden IFrame that uses page streaming to receive <script>
    tags that update the main page.


    # 5.5 Web Remoting Pitfalls


    The Web has been long enough that users are accustomed to certain conventions.
    For example, you expect to get a visual progress indicator from the browser when
    waiting for a page to load, you expect to be able to click the back button and
    see the last web page that you were viewing, and you expect to be able to bookmark
    pages so that you can return directly to them later. Ajax introduces forms of
    interaction that break these conventions. Most people do not react well to changes
    that break conventions they have come to expect. Therefore, if you want to attract
    users instead of driving them away, what should you do to maintain these conventions,
    or at least provide a smooth transition to a new form of interaction.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# CHAPTER 5 Web Remoting Techniques—the A in Ajax


    Figure 5.5.1

    Visual Progress Examples


    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_235_0.png)


    One of the easiest problems to fix that Ajax introduces a lack of visual feedback.
    With the traditional use of HTTP, when a user clicks on a hyperlink the browser
    provides some form of visual feedback that work is being done, like a spinning
    image or a progress bar. When you use the XMLHttpRequest object, the browser does
    not provide any indication to the user that something is happening. Without that
    visual feedback, the user will think that nothing happened or that the application
    is locked up. If a user thinks that nothing is happening, he will usually click
    on something else, which, depending on your design, may kill the original action.
    A simple fix for this is to display a text message or animated image while the
    XMLHttpRequest is being completed and then to hide the indicator when the request
    is complete. The same guideline applies when you are using another technique,
    like IFrames. For example, in Listing 5.3.2 we disabled the button and changed
    the text of the button to read “Uploading Information…” while the request was
    being processed and changed it when the request was complete. Figure 5.5.1 illustrates
    five different examples of progress indicators that you see online.


    A more difficult problem to tackle is related to how the browser tracks a user’s
    browsing history. As a user surfs the Web, the browser stores the URLs for all
    the pages that the user has visited in a cache, commonly called the history. The
    browser then enables the Back and Forward buttons to allow the user to navigate
    backward and forward through the browsing history. When a request is made using
    XMLHttpRequest, the URL is not stored in the browser’s history. So, say that we
    created an Ajax search for our online sales application. We have a page with a
    search form that allows you to enter criteria, submit a search, and get back a
    new page with a list of cars that match your criteria. Because the results can
    be large, we implement a paging mechanism that allows you to click “next” and
    “previous” buttons on the results page to move forward and backward through the
    pages of results, as you can do with Google search results. Because there is other
    content and JavaScript libraries loaded on the page, we found that the paging
    works faster if we simply pull down the next page of results from the server using
    XMLHttpRequest and then update only the list of results instead of reloading the
    entire page.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# 5.5 Web Remoting Pitfalls


    after paging forward through several pages of results, you decide that you want
    to go back a few pages. So you naturally click the browser''s Back-button (instead
    of the page''s previous button). But instead of taking you back one page in the
    list of results, the browser takes you back to the search form. That is annoying.


    In general, you can avoid this pitfall by designing your application such elements
    that look like hyperlinks are traditional hyperlinks that do a page reload and
    are entered into the browser''s history. Elements of your application that use
    XMLHttpRequest do not have to fool the user into thinking that they should behave
    like a traditional hyperlink. You can make them appear different, which can go
    a long way to making the user realize that they are not expected to work with
    the browser''s Back and Forward buttons. For example, in the Google Maps application,
    the user can click on the map and drag it to scroll. Because of this functionality
    is different using a hyperlink, the user does not expect to be able to use the
    Back button to scroll back to she was.


    Being said, there are times when it would be nice to be able to make an XMLHttpRequest
    as the result of the user''s clicking on a hyperlink and still have the browser''s
    Back button work as expected. The search result paging described earlier is a
    good example. Much work has been put into this area by JavaScript toolkits. Yahoo!
    User Interface library has a Browser History Manager21 that allows you to register
    the state of your application in the browser''s history and have the Back button
    work as expected. But the system is not perfect. For example, it does not work
    in the Opera browser.


    By tradition, the page that a user sees in the browser is directly related to
    the URL that he surf to. With Ajax applications, this is not true. An XMLHttpRequest
    could be made and the response used to change a significant section of the page,
    but the URL in the browser''s navigation bar will not change. The Web was originally
    designed around static pages, not the concept of an online application with a
    specific state. With static pages, the URL in your browser''s navigation bar can
    be bookmarked and you can return to that page by simply clicking on the bookmark.
    Therefore, users will expect this of of your Ajax web application as well. You
    can reduce your


    > 21http://developer.yahoo.com/yui/history/'
