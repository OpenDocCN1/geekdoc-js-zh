  md: '# 2.2 HTML Basics


    ing text or to make a simple animation by integrating a series of images into
    one GIF file. GIF is the recommended format for images created with graphics applications,
    like simple icons.


    On the other hand, Joint Photographic Experts Group (JPEG, JPG) represents each
    pixel with 24 bits and thus supports up to 1.6 million colors. You can trade off
    JPEG file size with image quality: the higher the compression rate, the less loss
    of precision. JPEG files do not support transparent background or built-in animation,
    as GIF files do. JPEG files are recommended for images created with cameras.


    Portable Network Graphics (PNG) is a new graphics format for combining the advantages
    of GIF and JPEG as well as overcoming a patent issue with GIF. A PNG image uses
    24 or 48 bits to represent a pixel. PNG format supports lossless compression,
    transparent background, and built-in animation. Because more web browsers are
    supporting it, PNG is recommended for all new web graphics.


