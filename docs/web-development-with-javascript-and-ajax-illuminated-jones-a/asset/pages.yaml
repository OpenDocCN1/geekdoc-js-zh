    function provided by Microsoft Script Debugger, you will set a breakpoint at the
    highlighted alert statement in Figure 7.2.1. Open the file with Internet Explorer
    and enable the debugger by clicking the View menu, Script Debugger item, and then
    Open Command. (The Script Debugger menu is available only after the Microsoft
    JavaScript Debugger has been successfully installed.) In the script debugger window,
    you can set a breakpoint on the target line. Go back to the Internet'
