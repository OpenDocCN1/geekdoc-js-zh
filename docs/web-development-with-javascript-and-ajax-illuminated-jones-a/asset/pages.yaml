    # 2.3.2 Formatting Text


    Specifying a certain font to appear on a page can be tricky because not everyone
    has the same fonts installed. To work around this problem, you can specify a font
    family rather than an individual font. A font family is a set of fonts listed
    in order of preference. If the computer displaying your page does not have the
    first font in the list, it checks the second, and the third, and so on, until
    it finds a match. The last font on a font family list is normally a font that
    is guaranteed to be available on any computer. Such generic fonts are specified
    without using double quotes around them. If a web browser cannot find any font
    match, it will use its default font to display the text.


    You can use the font-family attribute to specify font families. The following
    are commonly used font families:


    +   * "Arial Black", "Helvetica Bold"

    * "Arial", "Helvetica", sans-serif

    * "Verdana", "Geneva", "Arial", "Helvetica", sans-serif

    * "Times New Roman", "Times", serif

    * "Courier New", "Courier", monospace

    * "Georgia", "Times New Roman", "Times", serif

    * "Zapf-Chancery", cursive

    * "Western", fantasy


    If you specify a font family in an element''s style attribute, the double quotes
    around the font names should be dropped. The following examples show how to specify
    a font family in a style rule and in a style attribute:


    ```

    p { font-family: "Times New Roman", serif }

    ```


    ```

    <p style="font-family: Times New Roman, serif">

    ..</p>

    ```'
