- img_proc: true
  md: '[CRLF] tags in the preceding message represent the carriage return/line-feed
    (CRLF) characters. You normally would not see them; however, they

    are significant in an HTTP message, so they are displayed here. CRLF char-acters
    are used to separate each line of the header and the header from the

    entity body. The message header includes every line before the first blank

    line (the line with a CRLF). The first blank line defines

    where the message header ends and the entity body begins.


    Each line of the HTTP request message that occurs after the first line and

    before the blank line is called an HTTP request header. HTTP request-ers contain
    useful information about the client environment and the entity body, such as the
    type of web browser used, languages that the browser is

    configured for, and length of the entity body. The first line of the HTTP

    request message contains the HTTP method (GET), the URI (/catalog/prices), and
    the protocol/version (HTTP/1.1). The HTTP method tells the

    web server something about how the message is structured and what the

    client expects the web server to do. The latest version of HTTP is version 1.1.

    The HTTP 1.1 specification defines the methods in Table 1.2.1. The GET and

    POST methods are the most widely used.


    An HTTP response message also contains three parts, like the request mes-sage:
    (1) a line defining the protocol used, a status code to

    identify if the request was successful, and a description; (2) a list of HTTP

    response headers; and (3) the entity body. An example HTTP response

    message follows.


    ```

    HTTP/1.1 200 OK[CRLF]

    Date: Sun, 13 Mar 2005 22:07:43 GMT[CRLF]

    Server: Apache/2.0.49[CRLF]

    Last-Modified: Sun, 17 Oct 2004 00:26:16 [CRLF]

    Content-Length: 70[CRLF]

    Keep-Alive: timeout=15, max=99[CRLF]

    Connection: Keep-Alive[CRLF]

    Content-type: text/html;charset=UTF-8[CRLF]

    [CRLF]

    <html>[CRLF]

    <head>[CRLF]

    <title>Example</title>[CRLF]

    </head>[CRLF]

    <body>[CRLF]

    Hello World![CRLF]

    </body>[CRLF]

    </html>[CRLF]

    ```'
