    # 5.2.2.3 Sending a POST Request


    You must pass null to the send() method if you have no data to send. However,
    if you want to send some data to the server in the body of the request, you can
    pass it to the send() method. For example, suppose that you want to send a POST
    request with the fields from the car search form. The first thing that you must
    do is concatenate the form name-value pairs into a URL-encoded string that you
    will pass to the send() method. URL encoding (also called percent encoding¹¹¹)
    is the process of replacing characters that are not allowed in a URI with a code
    that consists of a percent symbol (%) followed by a pair of hexadecimal digits.
    For example, a dollar sign ($) is encoded as %24. The following is the list of
    reserved characters and their encoded values.


    ! * '' ( ) ; : @ & = + $ / ? % # [ ] %21 %2A %27 %28 %29 %3B %3A %3B %3C %40 %26
    %3D %2B %24 %2C %2F %3F %25 %5B %5D


    In addition to the preceding list of reserved characters, spaces are encoded as
    %20. When data is sent to the server, it must be encoded in the format defined
    by the application/x-www-form-urlencoded MIME (Multipurpose Internet Mail Extensions)
    type. This format is the same as URL encoding except that spaces are encoded as
    + instead of %20. To handle this encoding, we add a method to our RequestHelper
    that takes a form object and returns its field''s name-value pairs in an encoded
    string (Listing 5.2.3).


    Now we can use RequestHelper.encodeForm() to send the entire car search form to
    the server using XMLHttpRequest. We just have to set up the


