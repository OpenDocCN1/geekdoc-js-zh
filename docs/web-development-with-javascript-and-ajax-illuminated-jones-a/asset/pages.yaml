  md: '# CHAPTER 4 JavaScript and the Document Object Model


    # 4.1 JavaScript—the /in Ajax


    JavaScript is an interpreted programming language like Perl, Python, Ruby, and
    countless others. JavaScript is used predominantly to add dynamic behavior to
    web pages. All modern web browsers, meaning practically any browser released later
    than Netscape version 4.5 or Internet Explorer (IE) version 4, include an interpreter
    that can execute JavaScript code.


    JavaScript¹ is actually the name of a language that was first created by Netscape
    2 browser and is now maintained by the Mozilla Foundation.²To compete with Netscape,
    Microsoft created a near copy of the original JavaScript language, which they
    called JavaScript, and added it to their IE3 browsers. Developers who made use
    of this very found that it was frustrating to write code that was compatible with
    both browsers. To account for the differences between JavaScript and JavaScript
    (and other implementations), one had to add countless branches in the code, which
    was time-consuming to write and painstaking to maintain. So, Ecma International³
    undertook an effort to standardize the language and eventually published ECM-262,⁴
    which is a vendor-neutral specification called ECMAScript. Mozilla''s JavaScript
    and Microsoft''s JavaScript (mostly) now conform to ECMA-262 Edition 3. Despite
    the official name of the language (and the names of the various implementations),
    the name JavaScript is commonly used, which is the term used in the Ajax acronym
    and thus is the term that will be used throughout this book.


    JavaScript is similar in syntax to C++ and Java, but quite different. JavaScript
    is a full-featured language that is loosely typed and includes object-oriented
    capabilities. As you might expect, JavaScript, being a full-featured object-oriented
    language, has support for different datatypes; various statements, including if/else,
    switch, and different kinds of loops; notation for defining functions that will
    accept arguments and return a value; exception handling; notation for defining
    and creating objects; and support for inheritance. Unlike C++ and Java, in JavaScript
    you do not specify a type when declaring variables, objects map property names
    to values (like a hash table or associative array), and inher-


