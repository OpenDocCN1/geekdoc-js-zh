  md: "# # Web Development with JavaScript and Ajax Illuminated\n\nRICHARD ALLEN\n\
    KAI QIAN\nLEXIN TAO\nXIANG FU\n\nWeb Development with JavaScript and Ajax Illuminated\
    \ provides readers with the cutting-edge techniques needed for web development\
    \ in Web 2.0. It is ideal for the undergraduate student delving into the world\
    \ of web development or novice web developers looking to further their understanding\
    \ of JavaScript and Ajax. This text illustrates how to create dynamic, interactive\
    \ web applications with ease, and interesting real-world case studies throughout\
    \ the text offer a glimpse of actual web development scenarios. Make sure you\
    \ are up to speed by using Ajax—which is quickly becoming the number one tool\
    \ in the web industry.\n\n# Key Features:\n\n+   - A Visual QuickStart Guide within\
    \ the text provides:\n  - Easy visual approach diagrams and screen shots to guide\
    \ readers through JavaScript and Ajax.\n  - Concise step-by-step explanations\
    \ that allow readers to move through the text with ease.\n  - Understandable approaches\
    \ to the concept of asynchronous HTTP requests in Ajax.\n\n+   - Hands-on labs\
    \ throughout the text allow students to learn by doing real-world-based exercises.\n\
    - Case studies offer a glimpse of accurate and actual scenarios.\n- Online Instructor’s\
    \ materials include PowerPoint lecture slides, answers to exercises found in the\
    \ text, test questions and answers, and source code for examples in the book.\n\
    \n![](img/c1949401ee3cedd5f6deadb59b2db5a7_515_0.png)\n\nJones and Bartlett Publishers\n\
    40 Tall Pine Drive\nSudbury, MA 01776\n978-443-5000\ninfo@jbpub.com\nwww.jbpub.com\n\
    \n![](img/c1949401ee3cedd5f6deadb59b2db5a7_515_1.png)"
