  md: '# Table 4.1.5 JavaScript Statements


    | Statement | Syntax | Purpose |

    | --- | --- | --- |

    | break | break; break label; | Break out of a loop or switch and continue the
    loop or at a labeled statement. |

    | continue | continue; continue label; | Break from the current loop and continue
    with the next iteration or at a labeled statement. |

    | do/while | do { statement; } while (expression); | A loop that executes the
    code block before evaluating the expression. |

    | for | for (initialize; test; increment) { statement; } | A loop that performs
    initialization, evaluates a Boolean condition before each iteration, and performs
    an increment after each iteration. |

    | for/in | for (variable in object) { statement; } | Loop through the properties
    of an object or the indexes of an array. Built-in methods and some built-in properties
    are not enumerated. |

    | if/else | if (expression) { statement; } else if (expression) { statement; }
    else { statement; } | Conditionally execute code blocks. |

    | return | return [expression]; | Return from a function, optionally returning
    the result of an exception. |

    | switch | switch (expression) { case expression: statement; break; default: statement;
    } | Branch based on value of switch expression to execute matching case code blocks
    or default code block if no match is made. The break statements and the default
    code block are optional. The switch and case accept any arbitrary expression may
    evaluate to any type. |

    | throw | throw expression; | Throw an exception. |


