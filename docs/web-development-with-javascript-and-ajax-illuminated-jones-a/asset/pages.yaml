    \ root element could also transform. The fourth line's xs1:output element specifies\
    \ the output file of this transformation should follow the specification of HTML\
    \ 4.0. Each xsl:template element specifies a transformation rule: if the document\
    \ contains nodes satisfying the XPath expression specified by the xsl:template\
    \ match attribute, then they should be transformed based on the value of this\
    \ xsl:template element. Because this particular match attribute has value \"/\"\
    \ selecting the root element of the input XML document, the rule applies to the\
    \ entire XML document. The template element's body (element value) dumps out an\
    \ HTML template linked to an external CSS file named style.css. After generating\
    \ the HTML table headers, the XSLT template uses xsl:for-each element to loop\
    \ through the dvd elements selected by xsl:for-each's select attribute. In the\
