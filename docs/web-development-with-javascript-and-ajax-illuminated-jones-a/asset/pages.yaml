  md: '# 8.10 Milestone 7: Map IDE and Google Maps


    The next step is to implement a comprehensive map environment for online shopping.
    It is called Map IDE (Integrated Development Environment). In this section, you
    will be exposed to the Google Maps API. You will also further develop the understanding
    of server-side techniques via the creation of several Java Servlets. You will
    find that the asynchronous nature of Ajax via callback is rather different from
    traditional imperative programming. You will have opportunities working with JavaScript.
    When you finish the hands-on experience of this section, you will produce around
    200 lines of JavaScript code.


    You are going to enrich the current implementation of BigPeachYards-Express with
    the following, as shown in Figure 8.10.1. A buyer can specify several search criteria
