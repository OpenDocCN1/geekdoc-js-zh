  md: '# 6.1 Dojo Toolkit


    There are many libraries/frameworks that help Ajax web development and abstract
    browser differences. The well known of them are the JavaScriptbased Dojo Toolkit,
    Prototype framework, and Direct Web Remoting (DWR) framework; the Yahoo! UI Library
    (YUI); and the Ajax based Google Web Toolkit (GWT).


    Dojo is a popular open-source, portable DHTML JavaScript toolkit that makes it
    easier for an Ajax developer to build Ajax requests. Why is Dojo called the toolkit?
    Dojo not only has a rich collection of libraries for JavaScript and Ajax web development
    but also provides an extensive, reusable, and customizable widget system supporting
    user-defined widgets, an enhanced event handling system, and an I/O system that
    simplifies data transfer between client and server.


    Dojo abstracts many of the differences between browsers, so Dojo is portable.


    For example, because Dojo''s widget system works on top of standard HTML, Dojo
    developers can add gracefully degradable functionality widgets to their existing
    web pages without worrying about disabled JavaScript or working with old browsers
    so that they can still browse the page with the underlying HTML functionality.


    Dojo is a cross-browser-oriented tool that supports various web browsers as IE,
    Firefox, and Safari and solves Ajax incompatibility problems in ordinary JavaScript.


    Dojo has a set of powerful JavaScript libraries organized in packages. Dojo 0.4
    used a layered structure library hierarchy to organize all Dojo functionality
    in packages. Dojo 0.9 and later versions (currently 1.0) simplify the structure
    so that most Dojo functions (Dojo widgets, events, I/O, and others) are available
    in Dojo core base packages; dijit, t, and dojo (Extended Dojo project) work on
    top of the Dojo core.


    One of the advantages of Dojo is that it wraps XMLHttpRequest and makes the request
    construction and configuration much easier. It frees developers from detailed
    configuration of Ajax XMLHttpRequest and from parsing and processing the responses
    back from the server. Another advantage of'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# 6.1 Dojo Toolkit


    Dojo is its web system available in Dojo core and dijit namespace packages. For
    example, you can easily convert an ordinary HTML form component such as an input
    textbox into a Dojo-type widget with many new features. For example, the dojoType
    attribute enables the JavaScript input box in the following:


    ```

    Departure Date: <input type="text" length="10" name="Leave_Date">

    dojoType="djit.form.TextBox/"

    ```


    which will automatically pop up a calendar of the current month and with today''s
    date highlighted on. When the input box gets focus, the user can select a date
    and the selected date will be automatically entered in the textbox.


    Dojo widgets also provide more advanced validation and assistance features than
    JavaScript. For example, the Dojo widget and event handling is flexible and powerful.
    Not only widgets but also functions can fire off events, and there may be multiple
    event handlers for one event source. The complete Dojo reference documentation
    can be found at http://www.dojotoolkit.org.


    Instead of having a formal introduction to Dojo, you will get started with two
    simple Dojo Ajax request examples here. (One uses the Dojo xhrGet function to
    get data from the server and partially update the HTML page without refreshing
    the whole page just like Ajax requests, and the others use the Dojo xhrPost method
    to post the HTML form data to the server and gets responses back from the server
    to update the client page partially.)


    # 6.1.2 Ajax XMLHttpRequest with Dojo


    Now, let us examine the data.txt "Hello world" Dojo Ajax example.


    Assume the file data.txt has a text statement, "Welcome to Ajax" in this. Web
    application downloads the content of this text file, places it in the HTML div
    tag "put_here" placeholder, and displays it. Assume that the Dojo core package
    dojo.js library is installed in the dojo directory in the root directory under
    the webapps directory of a web server such as Apache Tomcat. If you browse this
    page, "Welcome to Ajax" will be displayed in the HTML page. There are three other
    packages in the dojo installation directory: dijit, dojos, and util, as mentioned
    before.'
