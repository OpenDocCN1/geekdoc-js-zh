    Now Ajax is associated with another catch phrase, Web 2.0. In October 2004 O''Reilly
    Media held a conference entitled Web 2.0,¹⁰ and since then the phrase has caught
    on. There is much confusion about what Web 2.0 is and, for matter, what Web 1.0
