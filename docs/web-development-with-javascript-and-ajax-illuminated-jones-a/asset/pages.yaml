  md: '# CHAPTER 2 Web Pages Using Web Standards


    The preceding URLs are also called absolute paths for web pages. The absolute
    path can be used in any web page as a hyperlink target independent-of the page''s
    own URL. If a web page needs to link to another web page on the same web server,
    say, in the same web server directory, you can use a shorter relative path, which
    is a path relative to the current page''s location. Let us use a scenario to illustrate
    relative paths. Assume a web application has three nested directories a/b/c; directory
    contains directory b and file a.html; directory b contains directory c and files
    b1.html; directory c contains file c.html. File b1.html can use hyperlink <a href="../a.html">Link
    to file a.html</a> to link to file a.html, where "../" represents the parent directory
    of directory b; use hyperlink <a href="../b2.html">Link B/a</a> to link to file
    b2.html; and use hyperlink <a href="../c.html">Link C/b</a> to link to file c.html.
    The forward slash, /, used in relative paths is operating system independent.


    By default, clicking on a hyperlink will cause the target page of the hyperlink
    replace the current page in a web browser. You can also use a target attribute
    in an element to display the target page in a new web browser instance, as in
    the following:


    ```

    <a href="http://www.google.com" target="_blank">Google.com</a>

