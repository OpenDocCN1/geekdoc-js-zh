  md: '# 7.3 Testing Ajax Web Applications


    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_304_0.png)


    Figure 7.2.2 Profiling Using Firebug


    # 7.3 Testing Ajax Web Applications


    Unlike debugging, which is used for troubleshooting known problems, the objective
    of software testing is to discover unknown problems of a software system. Usually,
    a testing engineer must evaluate not only the logical correctness but also the
    security, reliability, robustness, and many other quality attributes of a program.
    The birth of Ajax has raised several new challenges:


    +   1. How do testers ensure the logical correctness of an Ajax application at
    both the client and server sides?

    2. How do testers evaluate an Ajax application in a complex environment? For example,
    the use of different browsers and different versions could greatly affect the
    behaviors of an Ajax application at the client side. The bandwidth of the network
    could influence the performance and even the logical correctness of an Ajax application.

    3. How do testers thoroughly test an Ajax application with multiple concurrent
    asynchronous calls? Concurrency is usually a central cause of many tricky problems
    (such as the racing condition) that cannot be reproduced easily.'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'This section introduces several techniques and tools for meeting the afore-mentioned
    challenges. In general, you will follow best practices when testing an Ajax application.
    In the software engineering cycle, your testing activities can be divided into
    the following categories:


    +   1. Unit testing: involves testing and evaluation of units and modules of a
    system.

    2. Integration testing: can expose problems when different components are integrated
    into the system.

    3. System testing: evaluates whether the whole system meets both the functional
    and nonfunctional requirements.


    # 7.3.1 Unit Testing


    A unit refers to the minimal testable part of a program. For example, in structured
    programs, a unit can be a function or procedure. In-oriented programming, a unit
    can be a class or a method of a class. Testing units from bottom to top has many
    benefits. First, it allows better to understand the definition of units. The unit
    testing design of each unit is usually an important part of documentation. Second,
    it allows better organization of a program. When all units are clearly defined
    and implemented, they can be easily reorganized when software requirements change.
    Most importantly, unit testing can greatly reduce the cost of software development.
    The earlier a bug is discovered, the lower the cost. A complete examination of
    various unit testing techniques and the general guidance of unit testing activities
    can be found in the IEEE unit testing standard (IEEE Standards Board, 1986).


    Unit testing can be easily automated because the functions and post conditions
    of a unit can often be well defined. In automated unit testing, a test case is
    expressed using a test script, and then the script can be executed multiple times
    as needed. Clearly, automated unit testing can significantly reduce the cost of
    regression testing, which is conducted frequently when part of the system is modified.


    To cater to the needs of automated unit testing, many unit testing frameworks
    have emerged since the 1990s. Typical examples include the JUnit framework (JUnit,
