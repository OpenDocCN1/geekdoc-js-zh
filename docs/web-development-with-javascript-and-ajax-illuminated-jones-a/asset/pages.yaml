  md: '# 3.1 Overview


    For two information systems to integrate smoothly, they must either adopt the
    same data structures or have the ability to interpret their partners'' data accurately.
    This is the data integration challenge, the focus of this chapter.


    Different business data types have different logical structures. For example,
    hospital patients'' medical records have a totally different structure from bank
    transaction records. For efficient processing, each business data type must be
    represented in some well-defined format. Such data representations are not unique,
    and the different businesses may represent the same type of business data in different
    data formats. For example, different hospitals represent their patients'' medical
    records in different data formats. Such inconsistencies could lead to difficulties
    in integrating the information systems of the cooperating businesses.


    On the other hand, for computers to process and store a type of business data,
    each information system needs to implement the data format adopted by the business
    in a particular programming language. Different programming languages have different
    data specification mechanisms and data types for specifying the same type of business
    data. If two cooperating information systems are implemented with different programming
    languages, they could have difficulties processing their partners'' data. The
    properties of computer hardware, operating systems, and networking protocols could
    also complicate such integration.


    XML, or Extensible Markup Language, is a technology introduced mainly for business
    data specification and integration. XML is a simplified descendant of SGML, or
    Standard Generalized Markup Language. Like HTML, XML uses tags and attributes
    to mark up data. But XML is generic and does not have a specific application domain.
    It does not limit what tag or attribute names can be used. For different types
    of business data you may need to define concrete markup languages to define the
    data structures. Each of these concrete markup languages needs to follow the general
    syntax structure of XML but uses a tag and attribute names predefined with XML
    syntax specification mechanisms like DTD (Document Type Definition) or XML Schema,
    which will be introduced in the following sections. Because of this, people usually
    say that XML is a metanguage for defining markup languages in specific application'
