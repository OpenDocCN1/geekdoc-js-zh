  md: 'service (synchronously) and processes driving distance one by one. Instead,
    the loop must be indirectly implemented using recursion. Function getDistance()
    is used for this purpose.


    +   4. To calculate the distance of each element to the client address, function
    getDistance() first retrieves the current address by using the counter curIdx.
    It then relies on geocoder to query the Google geocoding service for the geopoint
    of the address. This call is asynchronous. Once data arrives, the asynchronous
    callback function uses the function distanceFrom() provided by Google Maps to
    calculate its distance from the client address. It then recursively calls getDistance()
    to process the next address until all addresses are processed. When recursion
    ends, showAllSales() is called for displaying the sale events that are located
    within the specified radius.


    +   5. Now the distance of each sale event to the user''s home address is stored
    by getDistance() in an array called arrDistances. Function showAllSales() can
    simply use a loop to compare each element in arrDistances with the maximum radius
    specified by the user. If the driving distance of an event is smaller, function
    completeAddr() is used for displaying an address on the map.


    +   6. Function completeAddr() first invokes the geocoding service for the street
    address. Once data arrives, it adds one marker to the Map IDE. It is also responsible
    for setting up the click event of the marker so that the list of items can be
    displayed.


    There are some assisting JavaScript functions defined in Listing 8.10.3. For example,
    function initMap() initializes the Google Maps object in the page. It first checks
    whether the page is compatible with the Google Maps service and then creates one
    instance of GMap2 and GClient-Geocoder. The constructor of GMap2 needs an instance
