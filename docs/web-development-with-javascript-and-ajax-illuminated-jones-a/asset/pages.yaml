  md: '# 9.3 Semantic Web


    Semantic Web, pointed out that the Semantic Web is the solution to information
    overload and the personalization of the Web by adding logic to the Web and turning
    it into a global database. Because of the lack of semantic connection between
    data on the Web, we often needed to search many websites to get an answer and
    you may face a high hit rate. For example, some Georgia Tech (GaTech) students
    want some transient classes at Southern Polytechnic University (SPSU) in the summer
    so that they can transfer these credits back to GaTech. (GaTech does not offer
    these courses in the summer.). These students must access the GaTech website first
    to find the eligible transferable course at SPSU and then go to the SPSU website
    to find the course description and schedule information and then go back to the
    GaTech website to make the request online. The process is time consuming and would
    have made even worse if the students could not get the information that they needed
    because of a huge number of search results with a high fault rate. All the problems
    are caused by a lack of semantics on the Semantic Web, which focuses only on the
    interchange of documents. Semantic Web also provides ontology metadata that shows
    body-of-knowledge concepts. With Semantic Web, you may build up a domain-specific
    Semantic Web has its metadata associated with a URI and its ontology (i.e., metadata
    of relationships between data, taxonomies, or mapping relationship) so that it
    becomes a part of the global database on the Web. You can effectively use a smart
    domain-specific search engine to find only useful information instead of so much
    irrelevant data returned by a regular search engine on the original Web. A Semantic
    Web search engine is much smarter than current search engines because it can use
    ontology knowledge and rules to deduce the conclusion on the basis of Semantic
    Web principles.


    Software for Semantic Web will be able to find, understand, and use all relevant
    data in context in a smart way. A good example of Semantic Web is Wikipedia, the
    world''s largest collaboratively edited encyclopedic knowledge. The goals of Semantic
