    # 4.3.6 The frames [] Array


    Web browsers create one global object (a window object) for each window. Typically,
    the browser has only one window object; however, if the page being viewed frames
    frames⁰ (a <frameset> or <iframe>(s)), then there is a window object for that
    page, as well as one window object for each frame (each <frame or<iframe>). The
    window object for the page (document) containing the frames has a built-in frames
    array with references to the window object for each of its frames. window.frames[]
    refers to the window object of the first frame. The window object of the top-level
    document (the page being viewed that contains all the frames) can be referenced
    from anywhere by using the built-in property. Because frames can be nested to
    any arbitrary depth, there is also a built-in parent property that refers to the
    containing window of the current frame. In the top-level window, the properties
    self, window, parent, and top are all self-references.


