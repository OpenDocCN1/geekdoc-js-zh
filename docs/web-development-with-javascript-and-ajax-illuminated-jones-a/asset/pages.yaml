    Algorithm of Searching Sale Events. Technically, the most challenging task is
    to search sale events using buyers'' criteria. The search process is conducted
    in two steps:


    +   (1) A request is sent to a Java Servlet named searchSale to retrieve a list
    of yard sale events that have the specified date and are located in the same state
    as the buyer. The results are concatenated and returned as a JSON array so that
    the information can be easily interpreted by the client side.

    (2) Then the client-side JavaScript sends the address of each returned sale event
    to the Google Maps service for determining the driving distance from the buyer’s
    home address. If the sale event satisfies the buyer-specified criteria, it is
    displayed on the Map IDE.


    You might wonder: why not complete the evaluation of driving distance on the server
    side? Using the client side as an intermediate relay seems redundant and complex.
    The reason for this complex treatment is that the geocoding service provided by
    the Google Maps service (which is needed for calculating driving distance) must
    be invoked via designated JavaScript API at the client side. Thus, you must split
    the search process into two steps. In the following, you will examine the logic
    of the searchSale servlet. Most of its source code is displayed in Listing 8.10.1.


    As shown in Listing 8.10.1, the function of the searchSale servlet is to return
