    Listing 8.10.3 consists of many functions. You will examine each of them, following
    the order that they are invoked when BigPeachYardSaleExpress handles the Search
    button:


    +   1. When a user clicks the Search button, getClientAddressStartFilter() is
    invoked. The function sets up displays a marker for the user''s home address on
    the MAP ID.

    2. At the end of getClientAddressStartFilter(), function buySaleInfoForm() is
    called. The function relies on Dojo to handle XHR request, which saves coding
    efforts. The function sends the request to servlet searchSale. Then it specifies
    that once data arrives, it will assign the data to the global variable saleinfo
    and invoke ProcessSaleAddrs() for processing the sales events data. In the BuyerInfo()
    function, the request URL is constructed by concatenating the values of various
    parameters.

    3. The responsibility of startSaleAddrs() is to screen the sale events that fall
    outside the specified radius. The search servlet has already made sure that all
    sale events in the current pool are located in the same state as the user''s home
    address and are organized on the date specified by the user. The challenge is
    here to with driving distance.


    There are several interesting technical points. The first, the function uses var
    sales = eval(salesinfo) to convert the JSON string into a JavaScript array of
    objects. This is one nice feature of JSON.


    Second, the function invokes the Google Maps geocoding service for checking driving
    distance. Because the data of any XHR call must be processed by a callback function,
    giving a list of sale event addresses, there is no way to use a loop that calls
    the geocoding'
