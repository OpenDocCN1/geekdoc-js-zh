  md: '# 2.4 HTML Forms and HTTP Basics


    Prompt window. Fundamentally, each server computer is identified by one or more
    IP addresses, and one or more domain names are used as the nicknames for each
    IP address so that they will be easier for people to use. There is a special domain
    name, "localhost", that is normally defined as an alias of local IP address 127.0.0.1.
    Domain name "localhost" and IP address 127.0.0.1 are for addressing a local computer,
    useful for testing web applications when the web browser and the web server are
    running on the same computer. When a user uses a domain name to specify a URL,
    the web browser will use a DNS (Domain Name Server) on the Internet to translate
    the domain name into an IP address.


    A server computer may run many server applications, like web servers and database
    servers, and may run more than one web server on the same computer, too. A running
    program is called a process. A computer may have many server processes running
    at the same time, and some of them may be running the same application. When a
    client sends information or a request to this computer, there needs to be a way
    for the client to specify that information or request is directed to a particular
    server process. The port numbers are used to identify different server processes.
    Each server process will claim an unused port number and listen only to messages
    directed to that port number. No two server processes can use the same port number.
    If you start a server program that uses a port that is currently in use by another
    process, the server program will fail to start. Port numbers from 0 to 1024 are
    reserved for popular server applications, and user applications should not use
    them. For example, by default HTTP of web servers uses port 80, HTTPS uses port
    443, FTP uses ports 20 and 21 (for data transfer and FTP commands, respectively),
    SSH (Secure Shell) uses port 22, telnet uses port 23, DNS uses port 53, and the
    IMAP email system server uses port 220. Many server applications allow you to
    change the port numbers.


    One way for a web browser or client program to submit data to a web server is
    to use a query string, which was originally used for sending database query. A
    query string starts with the question mark character ?, and assignments of a sequence
    of "name=value" (both name and value are strings) separated by &. Because a valid
    URL cannot contain some special characters, such as space and those with special
    meanings in HTML, URL encoding is used to encode these special characters in the
    query strings. For example, space is encoded as + or %20, tab as %09.'
