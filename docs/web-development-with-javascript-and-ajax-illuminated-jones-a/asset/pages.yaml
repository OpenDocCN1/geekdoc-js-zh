  md: '# 4.4 The Document Object Model (DOM)


    The event handling techniques described thus are commonly categorized as DOM Level
    0 event handling. This form of event handling is fairly basic but nevertheless
    satisfies most event handling needs. The HTML tags support several event handler
    attributes that can be assigned arbitrary JavaScript code. In the previous example,
    we put the JavaScript code in a function and assigned the function to the event
    handler attribute, which is a good practice, but we could have put the JavaScript
    code directly in the attribute like this.


    ```

    <button onclick="document.getElementById(''p2'').className = (document.getElementById(''p2'').className
    == ''normal'') ? ''styled'' : ''normal''"></button>

    ```


    It is easy to see how this quickly makes the HTML difficult to read and thus difficult
    to maintain. Fortunately, HTML tag event handlers are also exposed as properties
    of the corresponding JavaScript object with the same name. So, we could alternatively
    remove the onclick attribute from the <button> tag and write the following JavaScript
    code to both define and register the event handler.


    ```

    function toggleStyles() {

    var p2 = document.getElementById("p2");

    p2.className = (p2.className == "normal") ? "styled" : "normal";

    }

    document.getElementsByTagName("button")[0].onclick = toggleStyles;

    ```


    This is an even better practice than assigning a JavaScript function to the HTML
    tag attribute because it fully separates the HTML code and the JavaScript code,
    both of them easier to read and maintain. No parentheses appear behind the name
    of the function when it is assigned to the onclick property. If parentheses were
    used, then the onclick event handler would have been the result of invoking toggleStyles()
    instead of a reference to the function itself. Be sure not to make that mistake.


    Because the event handlers reference JavaScript functions, you can also directly
    invoke an event handler in your code, as the following code illustrates. In the
    context of our example, if the following code executed it would invoke the toggleStyles()
    function because that is what onclick is a reference to.


    ```

    document.getElementsByTagName("button")[0].onclick;

    ```'
