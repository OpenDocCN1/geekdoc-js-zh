  md: '# 5.7 Summary


    Ajax has boomed in popularity because it gives you the tools to transform websites
    into web applications with the responsiveness and feel of desktop applications.
    Web remoting techniques, and in particular the XMLHttpRequest-object, are the
    foundation that makes this possible. You are no longer constrained to making the
    user wait until you fetch and load an entire page just to send a few user input
    fields to the server or update the page with a few lines of new content. In fact,
    with the tools and techniques that you have now learned, you can write an entire
    application in one page! In essence, that is what Google Maps is.


    This chapter covered the core techniques that define Ajax—how to send asynchronous
    requests to the server using XMLHttpRequest or an Iframe and how to process the
    response data. Sending an XMLHttpRequest generally involves three steps.


    +   1. Create an instance of XMLHttpRequest for the specific browser that your
    code is executing in. Internet Explorer 5 and 6 use an ActiveX object, whereas
    all other browsers implement a native XMLHttpRequest object.


    +   2. Invoke the open() method to tell XMLHttpRequest which URL you want to request,
    using the onreadystatechange event handler to be notified when the request is
    complete, and then invoke the send() to actually make the request.


    +   3. Process the response from the server—do something with the dataset in responseText
    property.


    You must use HTTP to package the request to the server and the response to the
    client, but the kind of data that you include in the HTTP request body is up to
    you. This chapter covered the most popular data formats used: HTML, XML, JSON,
    and plain text. HTML has the benefit of being directly assignable to the innerHTML
    property of DOM elements. XML has the advantage of flexibility, readability, and
    the fact that the browser will automatically parse XML data for you. JSON has
    the advantage of being lightweight with low bandwidth consumption and is directly
    executable and usable in JavaScript. Plain text has the advantage of simplicity
    and is ideal for small pieces of data, like single messages that can be'
