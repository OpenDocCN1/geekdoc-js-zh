  md: "```\nimport YSEModel.Utility;\nimport java.awt.Graphics2D;\nimport java.awt.image.BufferedImage;\n\
    import java.io.*;\nimport java.sql.Connection;\nimport java.sql.ResultSet;\nimport\
    \ java.sql.Statement;\nimport javax.servlet.imageio.ImageIO;\nimport javax.servlet.*;\n\
    import javax.servlet.http.*;\nimport javax.servlet.swing.JFrame;\n```\n\n```\n\
    public class FetchImage extends HttpServlet {\n\n    /**Generate the image with\
    \ its width not exceeding maxWidth\n     *bytesInput: the binary data of the image\
    \ to be processed\n     *maxWidth: the max width of the output\n     */\n    protected\
    \ byte[] messageImage(byte[] bytesInput, int maxWidth) {\n        ByteArrayOutputStream\
    \ baResult=new ByteArrayOutputStream();\n        try{\n            ByteArrayInputStream\
    \ baInput=new ByteArrayInputStream(bytesInput);\n            BufferedImage image\
    \ = ImageIO.read(baInput);\n            int width = image.getWidth()>maxWidth?image.getWidth():maxWidth;\n\
    \n            double ratio = (double) width/image.getWidth();\n            int\
    \ height = (int) (ratio*image.getHeight());\n            BufferedImage bufNewImage\
    \ = new BufferedImage(\n                width, height, BufferedImage.TYPE_INT_RGB);\n\
    \            Graphics2d canvas=(Graphics2d)bufNewImage.getGraphics();\n      \
    \      canvas.scale(ratio,ratio);\n            canvas.drawImage(image,0,0,new\
    \ JFrame());\n            ImageIO.write(bufNewImage, \"jpeg\", baResult);\n  \
    \      } catch (Exception ex){\n            log(ex.toString());\n        }\n \
    \       return baResult.toByteArray();\n    }\n}\n```\n\nListing 8.7.1\nSource\
    \ Code of Fetch\nImage.java\n\n(continues)"
