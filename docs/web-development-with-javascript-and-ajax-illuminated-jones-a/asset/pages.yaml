    process the HTML document that it receives from the web server and display the
    results to the user via a graphical interface. Once the web browser receives the
    HTTP response message from the web server, the TCP/IP connection between the web
    server and web browser is closed.


    # 1.2.1 Uniform Resource Identifier (URI)/Uniform Resource Locator (URL)


    Web browsers always initiate TCP/IP connections with the web server, never vice
    versa. The web browser identifies which web server to make a connection with what
    is being requested of the web server with a Uniform Resource Locator (URL). A
    URL is a classification of Uniform Resource Identifier (URI) that identifies a
    resource by its location. A URI is a more general term that encompasses all types
    of web identifier schemes. The terms “URL” and “URI” are often used interchangeably,
    but the term “URL” is meant to specify a type of URI that identifies the location
    of a resource, as opposed to say, identifying a resource by name, independent
    of location, as is done with a Uniform Resource Name (URN).


    A URI is simply the address that you type into the address field of your browser,
    such as http://www.w3c.org. URIs are composed of several parts—scheme, authority,
    path, query, and fragment. The diagram illustrates the division of the parts of
    a URI.


    ```

    http://www.w3c.org:80/Markup/HTML?ver=1_0#xhtml1

    ```


    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_20_0.png)


    +   - **scheme**—Identifies the application-level protocol. Examples are http,
    ftp, news, mailto, file, telnet. The :// after the scheme separates the scheme
    from the authority.

    - **authority**—The host name or IP address of the web server and an optional
    port number. The standard port for HTTP is 80, which most computers already know,
    so it can typically be omitted. However, if the web server is listening for connections
    to a different port, as 8080, that port will need to be specified.

    - **path**—A directory path to the resource. The concept of directory used here
    is the same as that used with file systems. The ? after the path is used to separate
    the query from the rest of the URI and is not necessary if there is not a query.'
  merge: -1
