  md: '# 1.5 Summary


    Now you know what Ajax is. It is not a specific technology but rather a technique
    for using existing technologies to improve the user interaction of web pages.
    It is essentially a way of communicating with the web server without refreshing
    the page that the user is viewing. Jesse Garrett originally described Ajax as
    a technique that used a specific set of technologies, including XML and XMLHttpRequest.
    However, with our definition, many techniques could be placed under the Ajax umbrella.
    To start with, the use of XML with Ajax is not required. The data that you transfer
    between the browser and server can be just about anything you want. Second, the
    use of the XMLHttpRequest to send the background request is not required because
    you can use an IFrame.


    Beyond the standard web technologies, there are others that are often used to
    provide "Rich Internet Applications" (a term coined by Macromedia). For example,
    we already mentioned how you can embed an applet in a web page. You can use that
    applet for the entire user interface, or you can use it just to handle the communication
    with the server in place of XMLHttpRequest. Another popular technology that also
    requires an installation in addition to the web browser is Adobe Flash.¹² Flash
    provides a rich user interaction, but the main drawback is that the tools are
    expensive. Because you can create an Ajax-like experience without using XML or
    XMLHttpRequest, Garrett modified his original article to drop "Ajax" as an acronym.
    Now "Ajax" is just considered a term that identifies the technique.


    This book is about teaching you how to develop Ajax web applications using standard
    web technologies, HTML, CSS, XML, and JavaScript (for Java Applets or Flash you
    will have to look somewhere else). By the time you finish this book, you should
    have the knowledge that you need to create your own Google Maps–like application.
    Before you continue with this book, take some time and surf the Internet to experience
    the Ajax applications mentioned in this chapter and any others that you can find.
    Doing so will give you a better understanding of what you are trying to learn.


    ¹²http://www.adobe.com/products/flash/'
  merge: -1
