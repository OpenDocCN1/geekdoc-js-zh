  md: '# TABLE 1.2.1 HTTP 1.1 Request Methods


    | Method | Description |

    | --- | --- |

    | GET | Simply retrieves the data identified by the URL. |

    | HEAD | Like GET, but retrieves only the HTTP headers. |

    | POST | Used to submit data to the web server. Sometimes data is also submitted
    to a web server by adding a query string to the URL; however, this is not how
    the GET method was intended to work. A query string added to a URL for a GET is
    only supposed to identify the data to be retrieved from the web server and sent
    in an HTTP response message back to the client. The POST method is typically used
    with HTML forms. |

    | OPTIONS | Used to query a web server about the capabilities it provides. |

    | PUT | Stores the entity body at the location specified by the URL. |

    | DELETE | Deletes a document from the web server that is identified by the URL.
    |

    | TRACE | Used to trace the path of a request through firewalls and proxy servers
    for debugging network problems. |


    As with the HTTP request message example, this example shows the CRLF characters,
    even though they would normally not be visible. The message header is separated
    from the entity body by a blank line. Every line after the first line and before
    the first blank line is called an HTTP response header. The HTTP response headers
    contain useful information such as the length and type of data in the entity body,
    the type of server that processed the request, and information that can be used
    by the web browser to determine how long it can cache the data. The entity body
    of the message may contain both text and binary data. In this case, it contains
    HTML code, which will be processed by the web browser and displayed to the user.
    The status code in this example is 200 and the description is OK. This output
    indicates to the client that the request was successful. The HTTP status codes
    are in the 200s, HTTP redirect codes are in the 300s, and HTTP error codes are
    in the 400s and 500s. An HTTP redirect occurs when the web server responds with
    an indication that the web browser should take some action, typically to request
    a different URL. Some common HTTP error codes and descriptions that you may have
    seen dis'
