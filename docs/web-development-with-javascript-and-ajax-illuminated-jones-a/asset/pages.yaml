  md: '# 4.3.4 The history Object


    The $history^{28}$ object maintains a list of the browser window''s recently visited
    URLs. Scripts cannot directly access this list; however, scripts can call methods
    of the history object to move forward or backward in the list, similar to the
    browser''s Back and Forward buttons. The history object methods are listed next.


    history methods


    +   - back()—Move backward in a window''s (or frame''s) browsing history.

    - forward()—Move forward in a window''s (or frame''s) browsing history.

    - go()—Takes an integer argument and will move any number (for positive arguments)
    or backward (for negative arguments) in the browsing history.


    The following example causes the browser window to load the document back from
    three positions in its history.


    ```

    window.history.go(-3);

    ```


    # 4.3.5 The location Object


    The $location^{29}$ object encapsulates information about the document currently
    loaded in the browser window (or frame). You can use the location object to change
    the document loaded by the browser window by assigning a URL to window.location.href.
    Some properties of the location object are listed next.


    location properties


    +   - host—The host name and port number (www.w3.org:80).

    - hostname—The host name without the port number (www.w3.org).

    - href—The entire URL (http://www.w3.org:80/TR/html401/)

    - pathname—The path, relative to the host (/TR/html401).

    - port—The port number of the URL (80).

    - protocol—The protocol of the URL (http:)


    > $^{28}$httpdeveloper.mozilla.org/en/docs/DOM:window.history.

    ${29}$http://developer.mozilla.org/en/docs/DOM:window.location.'
