    # 5.2.4 Timing Out a Request


    A deficiency of XMLHttpRequest is the lack of a timeout mechanism. If you make
    a synchronous request and the web server fails to respond, the browser will lock
    up, remaining blocked in the send() method. If you send an asynchronous request
    you will not have this problem because the send() method does not block, allowing
    the user to continue using your application and the browser. However, it is common
    to disable a widget or feature of the web application that depends on the asynchronous
    request’s completion. For example, you may disable a form submit button until
    the response is processed to prevent the user from submitting the same form multiple
    times. If you use this technique, the form button will remain disabled until the
    request is finished, which may never happen. Also, it is a good practice to inform
    the user if something did not work, such as if the user submitted a form and never
    received a response.


    Fortunately, there is a simple solution to this problem. The XMLHttpRequest provides
