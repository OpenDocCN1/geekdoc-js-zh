  md: '# CHAPTER 1 Ajax Defined


    Berners-Lee eventually created the Hypertext Transfer Protocol (HTTP) and the
    Hypertext Markup Language (HTML),2 coined the term “World Wide Web,” developed
    the first web browser and web server, and went on to help the World Wide Web Consortium
    (W3C),3 which is a large umbrella organization that currently manages the development
    of HTTP, HTML, and other web technologies.


    # 1.2 Basic Web Architecture


    Most traffic on the Internet today is the transmission of HTTP messages. Most
    Internet users have applications on their computers called browsers (typically
    Microsoft Internet Explorer, Firefox, Safari). The web browser is a user interface
    that knows how to send HTTP messages to, and receive HTTP messages from a remote
    web server. The web browser establishes a TCP/IP connection with the web server
    and sends an HTTP request message. The web server knows how to handle HTTP request
    messages to get data (text, images, movies, etc.) from the server and send it
    back to the web browser from the web server (e.g., a username and password required
    for login). Internet users typically use web browsers to get web pages in the
    form of HTML documents (see Figure 1.2.1). The web browser knows how


