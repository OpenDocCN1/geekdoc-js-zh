    # 3.3.1.1 Empty Elements


    Empty elements are declared with the keyword EMPTY in parentheses:


    ```

    <ELEMENT elementName (EMPTY)>

    ```


    As an example, <ELEMENT br> declares that br is an empty element.


    # 3.3.1.2 Elements with Text or Generic Data


    Elements with text or generic data are declared with the data type in paren- tes
    in one of the following forms:


    ```

    <ELEMENT elementName (#CDATA)>

    <ELEMENT elementName (#CDATA)>

    <ELEMENT elementName (ANY)>

    ```


    #CDATA means that the element contains character data that is not supposed to
    be parsed by a parser for markups like entity references or nested elements.


    #PCDATA means that the element contains data that is going to be parsed by a parser
    for markups, including entity references, but not for nested elements.


    The keyword ANY declares an element with any content as its value, includ- ing
    text, entity references, and nested elements. Any element nested in this element
    must also be declared. ANY is used mainly during the development stage of an XML
    dialect; it should not be used in the final XML dialect specification.


    As an example, <ELEMENT index (#CDATA)> declares a new index element so that the
    XML parsers will further identify markups, excluding nested elements, in values
