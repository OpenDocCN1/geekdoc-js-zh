    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_174_0.png)


    event handler for the event, those handlers are run when the event passes by.
    In the second phase, any event handlers registered on the target node are run.
    In the third phase, called the bubbling phase, the event propagates up the DOM
    tree (or bubbles up), and any registered event handlers for the event are executed.
    The event handlers for the capturing phase and the bubbling phase are different,
    and only the bubbling phase event handler of the target node is executed in the
    second phase. Also, not all event types propagate through the bubbling phase.
    In general, raw input events (like mouse events) bubble up, which semantically
    higher-level events (like the submit event) do not. You can look online to see
    which events bubble and which do not.$^{48}$ Figure 4.4.10 illustrates the propagation
    that would occur if the user clicked on the button in the listing.


    When invoked, the event handlers are passed an instance of the Event$^{49}$ interface.
    If the event was generated by the mouse, then the event is an instance of the
    MouseEvent$^{50}$ interface, which extends the UIEvent$^{51}$ interface, which
    in turn extends Event. During event propagation, any event handler can stop further
    propagation by calling the stopPropagation() method of the Event object. If the
    event normally causes some default browser behavior, like following the link of
    an <a> tag, the event handler can prevent the default behavior by calling the
    preventDefault() method of the event object.


    > $48$http://www.w3.org/TR/DOM-Level-2/Events.html#Events-groupings-htmlements.

