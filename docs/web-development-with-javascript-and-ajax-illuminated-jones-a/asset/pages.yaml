  md: '# 3.6.1 Identifying XML Nodes with XPath


    Before you can specify transformation rules for an XML dialect, you need to be
    able to specify subsets of XML elements that will be transformed based on some
    rules. You can visualize all components in an XML document, including the elements,
    attributes, and text, as a graph of nodes. And you can describe an XML document
    as an upside-down tree in which a node is connected to another node under it if
    the latter is nested in the former or is a parameter or text value of the former.
    This is basically a DOM tree for representing an XML document in computer memory.
    The parameter names have symbol @ as their prefix in such tree. The sibling nodes
    are ordered as they appear in the XML document. As an example, the contents of
    file dvd.xml can be described by the following tree.


    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_95_0.png)


    XPath uses path expressions to select nodes in an XML document. The node is selected
    by following a path similar to file system paths. There are two ways to specify
    a path expression for the location of a set of nodes: absolute and relative. An
    absolute location path starts with a slash, /, and has the generic form of


    /step/step/...


    whereas a relative location path does not start with a slash and has the generic
    form of


    step/step/...


    In both cases, the path expression is evaluated from left to right, and each step
    is evaluated in the current node set to refine it. For an absolute location path,
    the current node set before the first step is the empty set, and the first step
    will identify the root element. For a relative location path, the current node
    set for the first step is defined by its context environment, which is normally
    another path expression. Each step has the following general form (in square brackets
    are optional):


    ```

    [axisName::]nodeTest[predicate]

    ```'
