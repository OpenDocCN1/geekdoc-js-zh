    # 8.11 Milestone 8: Itinerary Planner and Drag and Drop


    The last section introduces you to the drag-and-drop feature provided by the Dojo
    framework. You will use the geocoding service by Google Maps for implementing
    a fancy itinerary planner. Users can drag and drop itinerary items, and your itinerary
    planner can automatically compile the list of arrival and departure times for
    each stop in the itinerary. All advanced features are implemented at the client
    side. You will learn to use cascading styles, event triggering, and data conversion
    between JavaScript and JSON.


    The development plan is as follows. First, you will modify the Map_IDE.html file
    to include the HTML elements needed for the new features. For example, the third
    accordion pane on the left side of the window will be populated for displaying
    itinerary items. Also, a DIV element must be embedded in the page for displaying
    driving directions. Second, a collection of JavaScript functions will be added
    for calculating arrival time and supporting drag and drop.


