  md: '# 2.3 Cascading Style Sheets (CSS)


    of HTML version 4, HTML tags are recommended to mark up mainly logical data structures,
    and the presentation details will be specified with separate and better cascading
    style sheets.


    Cascading style sheets are based on the success of the word processor''s style
    concept. In word processing, you can define styles for formatting each type of
    document element, and you can format a particular document element instance by
    applying a predefined style.


    Each web browser has a default to render HTML elements. For example, the HTML
    standards do not specify the font size of h1 elements, and the web browser designers
    have the freedom to choose a font to present h1 elements as long as the font size
    for h1 elements is no smaller than for h2 font elements. Default behavior of a
    web browser can be modified in multiple ways:


    +   - A user may use the web browser''s graphic user interface, most likely under
    the View menu, to change some limited aspects of an HTML document''s presentation.
    For example, almost all browsers allow users to change text size.


    +   - An HTML file may import external cascading style sheets by using a link
    element inside a head element. The following example shows how to import stylesheet
    entries from a CSS file named “default.css” in the same directory as the HTML
    file.


    ```

    <head>

    <title> ...</title>

    <link rel="stylesheet" type="text/css" href="default.css" />

    <style>

    Local CSS definitions go here

    </style>

    </head>

    ```


    +   - An HTML file may also specify some local style rules within a style element,
    nested inside the head element, as shown in the previous example.


    +   - Each start tag in the HTML file may also contain a style attribute to define
    style properties for that particular element. You have seen some examples in this
    category earlier in this chapter.


    If an HTML element has some presentation aspects not defined by the HTML standard,
    the web browser will search for their potential definitions'
