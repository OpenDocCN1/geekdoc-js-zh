  md: "# 4.2 Embedding JavaScript in HTML\n\nTo get a web browser to execute your\
    \ JavaScript code, you must embed it in an HTML page. There are several ways to\
    \ do that.\n\n+   1. Put your JavaScript code between opening and closing `&lt;script&gt;`\
    \ tags. The web browser processes an HTML page from top to bottom, executing any\
    \ JavaScript that it finds between `&lt;script&gt;` tags along the way. You can\
    \ put as many `&lt;script&gt;` tags as you like-where between the opening and\
    \ closing `&lt;head&gt;` or `&lt;body&gt;` tags. The JavaScript code is executed\
    \ under the same scope, so top-level variables defined in one `&lt;script&gt;`\
    \ tag can refer to top-level variables defined in another. However, the web browser\
    \ processes the page from top to bottom, so you cannot refer to a JavaScript variable\
    \ or HTML tag until it is loaded by the web browser. To defer a script's execution,\
    \ you can put the code in a function and assign that function to the `window.onload`\
    \ event handler or use the defer attribute of the `&lt;script&gt;` tag. The onload\
    \ event handler is invoked after the entire page has been loaded. The defer attribute\
    \ tells the browser to wait to execute the JavaScript code until it encounters\
    \ a script that cannot be deferred or the page has been loaded, whichever comes\
    \ first. Unfortunately, not browsers implement the defer attribute properly, so\
    \ use it with care. If you are using XHTML, you should put your JavaScript within\
    \ a CDATA section to prevent XML special characters like `&lt;` from being processed\
    \ by the XML parser. An example embedding JavaScript between the `&lt;script&gt;`\
    \ and XHTML follows.\n\n```\n```html\n<html>\n<body>\n  <script>\n    window.alert('I'm\
    \ here because of JavaScript.');\n  </script>\n</body>\n</html>\n```\n```\n\n\
    ```\n```html\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n  <script><![CDATA[\n\
    \    window.alert('I'm here because of JavaScript in HTML.');\n]]></script>\n\
    ```\n```"
