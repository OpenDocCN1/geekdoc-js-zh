  md: "Here is the HTML file with xhrGet Ajax request.\n\n```\n<html>\n<head>\n  <title>Dojo\
    \ Ajax</title>\n  <script type=\"text/javascript\" src=\"dojo/dojo/dojo.js\"></script>\n\
    \  <script>\n    function xhrGet(\n    dojo.xhrGet(\n      url: \"data.txt\",\n\
    \n      // The load function is called on successful response from the\n     \
