    when sending a form with a POST request, which is required in that case.


    # 5.2.2.2 XMLHttpRequest properties


    onreadystatechange


    An event handler that is invoked as the request changes state. An XMLHttpRequest
    object progresses through five states as the request is being processed, which
    are described next:


    readyState An integer value that is set to the current state of the request. The
    browser changes the readyState of an XMLHttpRequest object as the request is being
    processed. When this value changes the onreadystatechange event handler is called,
    allowing you to react to the change in state. The possible values are listed.
    Usually, the only state you will care about is 4 Completed. Unfortunately, browsers
    handle the readyState differently. Some browsers do not set the 1 or 2 at all,
    some repeatedly set the 3 while the response is being downloaded, and some set
    the 3 only once. Consequently, the best cross-platform use of readyState is to
    wait for 4 Completed and ignore all the other states.


    +   0 Uninitialized: The open() method has not been called yet.


    +   1 Loading: The open() method has been called, but the send() method has not.


    +   2 Loaded: The send() method has been called, but the server has not responded
    yet.


    +   3 Interactive: A partial response from the server has been received.


    +   4 Completed: The complete response has been received and the connection is
    closed.'
