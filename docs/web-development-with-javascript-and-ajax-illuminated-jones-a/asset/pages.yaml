    focus on. See the browser vendor documentation for non-common BOM functionality.24


    The BOM is a hierarchy of objects with the window object at the root. Beneath
    the window object are the navigator, screen, history, location, and document objects—as
    well as the frames[] array (see Figure 4.3.1). The document object contains the
    Document Object Model (DOM), which is discussed in the next section. The frames[]
    array contains references to all the frames loaded in the browser. Each frame
    is also a window object. If the document loaded in the browser contains no named
    frames, then the frames[] array is empty.


    # 4.3.1 The window Object


    The window25 object is the global object in client-side JavaScript, properties
    of the window object can be referenced with or without qualifying them with window.
    For example, the alert() function of the window object was used in several of
    the code samples in previous sections without having to invoke it as window.alert().


    window properties


    +   - closed—A Boolean value that identifies whether (true) or not (false) the
    window has been closed.

    - document—A reference to the document object.

    - frames—A reference to an array that contains references to all the frames loaded
    in the window.

    - history—A reference to the history object.

    - location—A reference to the location object.


