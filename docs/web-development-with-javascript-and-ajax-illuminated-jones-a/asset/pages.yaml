    # 2.3.1 Style Rule Format


    A style sheet consists of a list of style rules, and most style rules in CSS are
    of form


    ```

    e1, e2 ... {attribute: value; attribute: value; ... attribute_n;}

    ```


    where "e1 e2 ... en", called a selector, is a list of space-separated elements,
    and each of them, except the first one, is nested in the element to its left (notations
    based on attributes id and class will be introduced later to to represent a subset
    of elements, and can also be used in the style rule selectors, but the concept
    of generic in a selector list is still true). This style rule specifies values
    for attributes for all ek elements in the current document that are successively
    nested in {ek-1, ... ek-2}, e1. As a simple example,


    ```

    p {border-style: solid; border-width: 2px}

    ```


    specifies that all paragraphs in the current document will have a two-pixel width
    external border. If you need to apply this style only to a particular paragraph,
    you can use the p element''s style attribute to specify the same external border:


    ```

    <p style="border-style: solid; border-width: 2px">

    ```'
