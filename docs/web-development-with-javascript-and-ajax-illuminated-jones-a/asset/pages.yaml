    # 7.4 Ajax Security


    Since the 1990s, security has been a major concern of web application developers.
    Belonging to the web application family, Ajax applications might suffer from the
    vulnerabilities of a traditional web application. Ajax developers also face new
    challenges. This section exposes you to some of the typical security problems
    that an Ajax application might have.


    # 7.4.1 SQL Injection Attack


    SQL injection attack is probably one of the most frequently used attacks on web
    applications. The basic idea of SQL injection is to take advantage of weak input
    validation of web applications. When carefully crafted, a snippet of SQL code
    by an attacker can be embedded in a dynamically constructed SQL statement at the
    server side. Such a snippet can be used to accomplish malicious goals such as
    bypassing password check and destroying the back-end database.


    Consider one simple Ajax application that checks a user''s shopping cart. Assume
    there is one textbox that allows the user to type the product name. At the client
    side, whenever there is a keyboard event, the phrase contained in the textbox
    is submitted to the server. At the server side, a servlet is used for searching
    the complete product name given the partial phrase submitted by the XHR calls.
    To achieve the automatic completion function, the server-side script generates
    a SQL statement on the fly. The statement for constructing the SQL statement is
    shown in Listing 7.4.1.


    As shown in Listing 7.4.1, the statement in essence concatenates strings to form
    a SELECT statement. The SELECT statement retrieves the refor-'
