  md: 'Once Venice tries to view the article, when her browser renders the image,
    the src attribute of the image will be immediately executed. Superstockbroker
    trusts the user because the user needs to log in to view the article and the cookie
    number is still valid. Thus, the request is executed and Venice is tricked into
    buying 1000 shares without being warned.


    Strengthening input validation is required to defend against XSS and XSRF attack.
    Typical approaches include forbidding users to post JavaScript code. Requiring
    submission of data via POST instead of GET will also increase the difficulty of
    attack because a request cannot be constructed simply by appending parameter values
    to the URL. Another effective approach to defend against XSRF is to associate
    a random session ID (note: not a cookie) at the beginning of the session. Assign
    session ID to a hidden HTML control at the client side and then have the client
    submit the same session ID in each subsequent action to post data. Such an approach
    can defend against the exploits of trust that are based solely on cookies.


    # 7.4.3 Summary of Ajax Security


    Does the use of Ajax worsen the security of web applications? What might be best
    practices for increasing the security of Ajax applications? There are many arguments
    on these issues, e.g., by Grossman (2006).


    One common opinion on Ajax security is that the use of Ajax increases the attack
    surface of an application. Attack surface refers to the open, accessible parts
    of a system that are vulnerable to attacks. Because with Ajax capability might
    have one or more server access points to handle the asynchronous requests, Ajax
    web applications have more complex client-server interactions and potentially
    larger attack surface. Because the client side JavaScript is used to submit Ajax
    requests, the signature of the access points at the server can be obtained by
    attackers by analyzing the JavaScript snippet embedded in HTML. Also, compared
    with the request-response mode adopted by traditional web applications, the interaction
    between client and Ajax applications is hidden from the user. Unless sniffers
    are used to monitor the network traffic, attacks on Ajax applications can be applied
    without being noticed by clients. Ajax might open doors for any existing attacking
    approaches. You can find more information in the article by Stamos and Lackey
    (2006) that discusses various attacks on Ajax applications.'
