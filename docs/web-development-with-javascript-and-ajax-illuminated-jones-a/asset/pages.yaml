- img_proc: true
  md: '# 8.1 Introduction


    This chapter presents to you many exciting server/client techniques for implementing
    powerful and user-friendly Ajax web applications. The use of Ajax features allows
    rich user experiences. With Ajax, the interaction between users and web applications
    will no longer be restricted to the simple-request–response model.


    Hands-on experiences with the sophisticated case study project of this chapter,
    you will have opportunities to practice many technical aspects of Ajax. For example,
    remote asynchronous calls can be made by using many different methods: raw XMLHttpRequest
    (XHR) calls and XHR wrappers (e.g., provided by Dojo and Google Maps) can be translated
    into many different forms, e.g., plain text, HTML snippet, and JSON. You will
    have access to many available technical options and will make decisions in the
    design process.


    Although the application of Ajax technique is the major concern of this chapter,
    the traditional web application techniques must be smoothly integrated with new
    Ajax techniques. In this chapter, you will learn how to establish the background
    database using SQL (Structured Query Language) and retrieving data using JDBC
    (Java Database Connectivity). As required by Ajax, server-side techniques are
    necessary for generating dynamic content. You will have access to several well-known
    server-side techniques such as Java Server Page (JSP) and Java servlets. At the
    server side, you will use Java to dynamically generate HTML code that is rendered
    in the user''s browser. Component-based programming has begun to emerge as a paradigm.
    On both ASP.Net- and Java-based web application development platforms, control-based
    techniques are popular. With server-side controls embedded in a web page, the
    server run time (e.g., ASP.Net and JavaEE) can automatically maintain the state
    and generate HTML code for server controls. The server-control technique can greatly
    improve code reuse and increase the developer’s productivity. You will also have
    access to the recent progress in this area, e.g., Java Faces (JSF). Table 8.1.1
    summarizes the various techniques that you will experience in this chapter.


    > http://www.asp.net.


    > http://java.sun.com/javaee.'
  merge: -1
