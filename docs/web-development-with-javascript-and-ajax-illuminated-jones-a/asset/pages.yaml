  md: '# CHAPTER 5 Web Remoting Techniques—the A in Ajax


    To demonstrate some code, we build on our Car Search example illustrated by the
    form in Figure 5.2.1. We already discussed how we want to attach an event handler
    to the car drop-down list that downloads the associated models from the server
    and assigns them to the car model drop-down list. Listing 5.2.2 demonstrates how
    you might use XMLHttpRequest to handle fetching the car models from the server
    after the user selects a car.


    In Listing 5.2.2 we define an event handler fetchModels that takes a car make
    and sets up an XMLHttpRequest to download the associated models from the server.
    The fetchModels function starts by creating an XMLHttpRequest object using the
    RequestHelper that was defined in Listing 5.2.1. Then the onreadystatechange function
    is defined. The onreadystatechange callback function is called whenever the readystate
    of the XMLHttpRequest changes. No parameters are passed to the callback function,
    but you need to use the XMLHttpRequest object to get the response data, you must
    maintain a reference to the XMLHttpRequest object or use a closure, as we have
    done here. Inside the callback function we must check if the state is 4 Completed
    before we process the response because the response may not be complete. We must
    also check that we got a successful HTTP status header the server may have encountered
    an error, in which case the responseText would be empty. After we are certain
    that the response is complete and successful, we process the response. In this
    example we show how you might handle a response that consists of one string of
    HTML <option> tags. Here response returns a string of car model options like this:


    ```

    <option value=''...''>Envoy</option><option value=''...''>Sierra</option>..."

    ```


    We can apply these options directly to the model <select> tag thanks to the innerHTML
    property.


    ```

    var models = request.responseText;

    var modelSelect = document.getElementById("model");

    modelSelect.innerHTML = models;

    ```


    All major browsers provide a nonstandard property on DOM objects called innerHTML.
    The string that you assign to innerHTML is parsed into DOM objects and used to
    replace the body content of the tag. The change is immediately reflected in the
    page display. Although technically proprietary, and therefore not recommended
    by everyone, the innerHTML property is compatible across major browsers, it is
    easy to use, and is generally processed faster'
