    \      load: function(response, ioArgs) {\n        dojo.body.byId(\"put_here\"\
    ).innerHTML = response;\n        return response;\n      },\n\n      // The error\
    \ function displays an error message if the server does\n      // not respond\
    \ correctly.\n      error: function(response, ioArgs) {\n        console.error(\"\
    HTTP status code: \", ioArgs.xhr.status);\n        return response;\n      }\n\
    \    });\n\n    //Invoke the welcome function when Dojo starts up\n    dojo.addOnLoad(xhrGet);\n\
    \  </script>\n</head>\n<body>\n  <span>\n    <div id=\"put_here\"></div>\n  </span>\n\
    </body>\n</html>\n```\n\nIn this example, three Dojo methods are used.\n\ndojo.xhrGet()\
    \ is a request method provided in the Dojo core package that facilitates XMLHttpRequestRequest\
    \ with the GET request method type. dojo.xhr-Post is another request type method\
    \ to make an XMLHttpRequest. Here is"
