  md: '# 2.3 Cascading Style Sheets (CSS)


    # 2.3.3 Formatting of Element Instances


    So far you have learned how to apply style rules to all elements of a particular
    type, say, p. In practice, you need to be able to support exceptions. For example,
    while specifying that all paragraphs start with an indentation on their first
    lines, you may also want the first line of the first paragraph to have no text
    indentation. You may also want paragraphs in different sections of a document
    to be formatted differently.


    If you need to format a unique element instance, say, a specific paragraph, of
    an HTML document differently, you can use attribute id to assign a unique string
    value to this element and use a special style rule to format this element instance
    differently. The selector for this style rule is the pound, # followed by a id
    string value. For example, the following style rules and HTML body will indent
    the first line of each paragraph by 20 pixels, except for the first paragraph,
    which will have no first-line indentation. Each attribute id of an HTML file must
    have a unique value in the file, even though several web browsers do not enforce
    this rule.


    ```

    p { text-indent: 20px }

    #first { text-indent: 0px }


    <body>

    <p id="first">No first-line indentation ...</p>

    <p>With first-line 20 pixel indentation ...</p>

    ....

    </body>

    ```


    If you need to format a subset of element instances, say, all paragraphs in a
    particular section, of an HTML document differently, you can use attribute class
    to assign a class name to those element instances and use a special style rule
    to format these element instances differently. The selector for this style rule
    is the period character, followed by the class name. A document can have many
    elements carrying the same class value, and these elements may be based on different
    tag names. The following style rule and HTML show how you can define a class named
    "important" to present several elements in red.


    ```

    p { color: black }

    .important { color: red }


    <body>

    ```'
