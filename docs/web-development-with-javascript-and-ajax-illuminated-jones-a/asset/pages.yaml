  md: '# CHAPTER 1 Ajax Defined


    Mozilla Project nearly 4 years to create the first full release of their browser,
    Mozilla 1.0, in 2002. With a lack of browser competition, much advancement was
    made in web page user interaction during this period—that is, until Google decided
    to get into the online map business.


    On February 18, 2005, Jesse James Garrett of Adaptive Path published an online
    article titled "Ajax: A New Approach to Web Applications.". He originally coined
    the term from an acronym of Asynchronous JavaScript And XML. In Garrett''s article,
    he discussed how the user experience of web applications is approaching that of
    desktop applications thanks to a combination of technologies. Although the technologies
    themselves had been available for several years. The technologies are HTML, CSS,
    DOM, JavaScript, Extensible Markup Language (XML), and a JavaScript object called
    XMLHttpRequest. The key technology in this stack is XMLHttpRequest, which was
    originally introduced in Internet Explorer 5 long before Garrett''s article. By
    the time Garrett wrote his article, XMLHttpRequest was supported by all the major
    browsers, but until that time was not very popular and received little attention.
    Why is XMLHttpRequest so special? Because it allows a background asynchronous
    request to be made from JavaScript. The request is made without affecting the
    page that the user is viewing and without locking the user interface. Figure 1.4.1
    illustrates the difference between applications that use Ajax and do not.


    In a traditional web application, the interaction that happens after a user clicks
    a link or a button is as follows: (1) the browser makes an HTTP request to the
    web server, (2) the web server typically queries data from a database, (3) the
    web server performs some calculations and possibly communicates with another system,
    and (4) the web server responds to the browser with an entirely new HTML page.
    This round trip is time consuming, and the loading of a full new page in the browser
    is usually unnecessary because typically a portion of the page needs to be updated.
    In addition, because the design of web browsers, the user must wait the entire
    time while the new page is being requested from the server, the server is doing
    its processing, and the browser is loading the new page. This design was fine
    when all people used the Web for reading text documents.


    > ^https://adaptivepath.com/

    https://www.adaptivepath.com/ideas/essays/archives/000385.php'
