  md: 'CHAPTER 4 JavaScript and the Document Object Model


    # 4.1.2 Identifiers


    Identifiers are used to name variables, functions, and labels. The first character
    of an identifier must be a letter, underscore (_), or dollar sign ($). Subsequent
    characters can be a letter, a digit, an underscore, or a dollar sign. You may
    not use any of the JavaScript-reserved words as identifiers. Tables 4.1.1–4.1.3
    list JavaScript-reserved words and other identifiers to avoid.


    # 4.1.3 Datatypes and Values


    JavaScript supports the datatypes Null, Undefined, Number, Boolean, String, and
    Object. These datatypes are discussed in the following sections. They can be divided
    into two categories: primitive types and reference types. Object is the only reference
    type; the rest are primitive types. The primitive types Number, Boolean, and String
    have associated global objects that are discussed in Section 4.1.3.9.


    Because JavaScript is loosely typed, any datatype can be used in place of any
    other datatype and JavaScript will automatically perform a conversion.


    # 4.1.3.1 Null


    Null has exactly one value, null, which represents a null, empty, or nonexistent
    reference. Variables that hold the value null do not contain a valid object, array,
    number, string, or Boolean value.


    # 4.1.3.2 Undefined


    Undefined has exactly one value, undefined, which is returned when you use a variable
    that has been declared but never assigned or you use an object property that does
    not exist. The values null and undefined are distinct; therefore, JavaScript''s
    identity operator (===) and typeof operator do not treat them as equal. However,
    JavaScript''s equality operator (==) considers them equal because it performs
    a conversion. The identity operator (===) checks whether two operands are identical,
    whereas the equality operator (==) checks whether two operands are equal. Values
    null and undefined are not identical because they are distinct values; however,
    they evaluate to equal because they both indicate an absence of value.'
