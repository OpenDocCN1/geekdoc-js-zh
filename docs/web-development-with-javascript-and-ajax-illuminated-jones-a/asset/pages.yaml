  md: '# 2.2 HTML Basics


    HTML is a markup language. An HTML document is basically a text document marked
    with instructions for logical document structure and document presentation. There
    are multiple versions of HTML. Whereas the earlier HTML versions used a more relaxed
    syntax and focused on document presentation than on document structure, the latest
    HTML, called XHTML, uses the stricter and more standard XML syntax to mark up
    text structures and depends on the separate CSS to control the presentation of
    the document. This separation of document structure and document presentation,
    even though not complete yet, is essential for supporting the same document being
    rendered by various modern presentation devices, including PCs and cell phones,
    that must use different presentation markups. The HTML concepts and examples in
    this chapter are based on XHTML 1.0, which is now supported by all the latest
    web browsers, including Microsoft''s Internet Explorer and Mozilla''s Firefox.


    # 2.2.1 Tags, Elements, and Attributes


    An HTML tag name is a predefined keyword, such as html, body, head, title, p,
    b, all in lowercase, for describing document structure or presentation.


    A tag is used in the form of a start tag or < and >, like <html> and <p>. A start
    tag is a tag name enclosed in angle brackets. An end tag is the same as the starting
    tag, except that it has a forward slash / immediately before the tag name, like
    </html> and </p>.


    An element consists of a start tag and a matching end tag based on the same tag
    name, with optional text or other elements, the element value, between them. The
    following are some element examples:


    ```

    <p>This is free text</p>

    ```


    ```

    <p>This element has a nested <b>element</b></p>

    ```


    Although the elements can be nested, they cannot be partially nested: the end
    tag of an element must come after the end tags of all its nested elements (first
    starting, last ending). The following example is not a valid element because it
    violates the above rule:


    ```

    <p>This is not a valid <b>element</p></b>",

    ```'
