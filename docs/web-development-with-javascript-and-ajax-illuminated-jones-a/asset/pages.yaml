  md: '# 8.8 Milestone 5: Dynamic Ad Banner and Ajax


    from the server. The banner can also execute the JavaScript accompanying the advertisement
    graphics. New advertisements can be uploaded to the server and will be immediately
    available without restarting the web server.


    To create the dynamic banner, you must go through three steps. (1) You will modify
    the Header.jsp fragment that as asynchronous calls will be invoked periodically
    for downloading advertisement content. (2) You will create a Java Servlet to respond
    to the asynchronous calls. The servlet will randomly retrieve an advertisement
    (HTML and JavaScript snippet) for each request. (3) You will create several sample
    advertisement snippets using HTML and the Dojo animation framework.


    You will first examine of the design issues of the aforementioned steps. Then
    you will have hands-on experience turning the dynamic banner into reality.


    **Modification on Header.jsp.** Recall the main structure of Header.jsp consists
    of one table that has two table cells. You will first place a DIV element named
    headerDIV into the second data cell. The headerDIV is used to display the advertisement.
    At run time, a piece of JavaScript code will periodically execute XMLHttpRequest
    (XHR) to retrieve banner contents from server. 8.8.1 displays the XHR code and
    the new HTML layout of the header fragment.


    As shown in Listing 8.8.1, when the header fragment is loaded, the JavaScript
    code calls setTimeout() to periodically invoke getContents(), which is used to
    retrieve the advertisement. In getContents(), an instance of XMLHttpRequest object
    is created. Later, myCallback() is hooked up to the response of XHR request. Then
    getContent() sends a request to a Java servlet calledBanner(which will be explained
    later), using GET.


    When data is returned, myCallback() is invoked. It checks the ready state of the
    XHR object. If it is 4 (successful), myCallback() will replace the innerHTML of
    the headerDIV with the data returned. The returned data, normally, consists of
    a piece of HTML code. However, if necessary, it can contain a piece of JavaScript
    code to be executed. If both HTML and JavaScript exist in the returned data, they
    are separated by the phrase --HAS_SCRIPT--. The myCallback() function can separate
    the two parts by searching for the string --HAS_SCRIPT--. By separating the returned
    data into two strings, myCallback() gets the HTML content as the first part'
