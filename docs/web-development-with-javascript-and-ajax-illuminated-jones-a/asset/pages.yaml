  md: '# 5.1 Web Remoting


    Web Remoting is a term used to categorize the technique of using JavaScript to
    directly make an HTTP request to the server and process the response. By tradition,
    web browsers initiate HTTP requests, not scripts. The classical function of a
    web browser is based on a synchronous request-response model where HTTP requests
    are made in response to the user clicking links, submitting a form, or typing
    in a URL (Figure 5.1.1). The browser processes the request by discarding the current
    page (including any running scripts), downloading a new page from the server,
    and then loading the new page in the browser for the user to view. This is a time-consuming
    process, especially when you do not need to display a whole new page. Often you
    need to send only a small amount of information to the server or to update a portion
    of the current page with a little data from the server.


    To work around the limitations of this page-driven paradigm, web developers have
    developed techniques to exploit URL-supporting HTML tags and CSS properties in
    nontraditional ways. Every tag with an src or href attribute that can be used
    without reloading the entire page is a candidate, including <img>, <script>, <link>,
    <iframe>, and ... When a script sets the src or href property to a URL, the browser
    performs an HTTP GET request to download the content of the URL, without reloading
    the page. You can exploit this fact to send information to the server by encoding
    that information in the URL query string. The server must respond with


    ![](img/c1949401ee3cedd5f6deadb59b2db5a7_191_0.png)


    Figure 5.1.1

    Synchronous HTTP Request–Response Model'
  merge: -1
  pgno: 191
