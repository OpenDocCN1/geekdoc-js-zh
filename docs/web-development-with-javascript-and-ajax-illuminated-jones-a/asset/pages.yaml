    # 3.2.5 Well-Formed XML Documents


    A well-formed XML document must conform to the following rules, among others:


    +   - Nonempty elements are delimited by a pair of matching start tags and end
    tags.

    - Empty elements may be in their self-ending tag form, such as <tagName/>.

    - All attribute values are enclosed in matching single (‘) or double (”) quotes.

    - Elements may be nested but must not partially overlap. Each non-root element
    must be completely contained in another element.

    - The document complies with its declared or default character encoding.


    Both the SAX and DOM XML parsers will check whether the input XML document is
    well-formed. If it is not, the parsing process will be terminated with error messages.


