  md: 'Web browsers supply the host objects defined by the Document Object Model (DOM)12
    and the Browser Object Model (BOM). The DOM provides a read/write model of the
    loaded HTML document for dynamically manipulating the content and behavior of
    the web. The BOM provides an Application Programming Interface (API) for manipulating
    the web browser windows, built-in dialogs, toolbar buttons, etc. The DOM is standardized
    by the World Wide Web Consortium (W3C),13 but not all browsers fully implement
    it. The BOM is a de facto standard, but it varies among browsers. The DOM and
    the BOM are often collectively referred to as DOM, but it is more accurate to
    note that only the DOM is an official standard. Mozilla''s host objects are documented
    in Mozilla''s DOM reference.14 The BOM is covered in Section 4.3, and the DOM
    is covered in Section 4.4.


    The BOM is made available to client-side JavaScript via properties of the window
    object, which is the global object in a web browser. Nested in the window object
    is the document object, which provides the DOM—an in-memory representation of
    the parsed web page. In top-level code you can refer to the global object by using
    this keyword or the global property. This keyword refers to the containing object
    and therefore has different meanings depending on the context in which it is used.
    In top-level code, the containing object is the window object. Following are examples
    using these global properties in top-level code.


    ```

    // These lines all have the same effect in top-level code.

    var index = 1;

    this.index = 1;

    window.index = 1;

    self.index = 1;

    ```


    ```

    // Reference the DOM to get an array of all the <td> tags.

    var tdArray = window.document.getElementsByTagName("td");

    ```


