    for providing a stunning visual appearance.


    As shown on the left side of Figure 8.3.5, MapIDE.html has three toolboxes (which
    are implemented using Dojo Accordion Panes): Buyer Info, Shopping Cart, and Itinerary.
    The Buyer Info pane allows a buyer to enter the information of him or her home
    address and to search sale events within a certain radius. The Shopping Cart pane
    lists the items in the shopping cart (price and thumbnail image), as well as the
    total price of all items in cart. Buyers can add and drop items in the shopping
    cart conveniently. The Itinerary pane displays the itinerary of the buyer. Buyers
    can adjust their itinerary using drag and drop. If a buyer specifies the'
