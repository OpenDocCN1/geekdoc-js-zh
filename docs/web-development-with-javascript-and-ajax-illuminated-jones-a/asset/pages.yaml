  md: '# 8.3 High-Level Design


    planned duration of stay for each stop in the itinerary, the departure and arrival
    time will be automatically calculated for each stop, based on the driving distance/time
    information from the Google Maps service. Clicking the Load Button will display
    multiple-point driving directions. On the right-hand side of the window, all the
    related sale events that satisfy the query criteria are presented. Clicking any
    sale event displays a list of items for sale. Clicking the Order link sends a
    request to the server via Ajax. You will see the details of the page in Section
    8.10.


    # 8.3.2 Database Design


    The second step of high-level design is to nail down the database schema. After
    researching the requirements of the project, the group decides to include the
    following three data tables in the design.


    +   - TBL_YARDSALE for storing information of yard sale events (e.g., location
    and time)

    - TBL_ITEM for storing items for sale

    - TBL_TRANSACTION for storing information about the buyers


    The design of TBL_YARDSALE is shown in Table 8.3.1. Each row of TBL_YARDSALE stores
    the information of one sale event, e.g., a unique identifier, street address,
    and open and close time. The unique ID is the primary key of the table. It is
    a sequence of 10 natural numbers (each is less than 128). The unique ID is randomly
    generated when a new record of a sale event is inserted into database.


    The design of TBL_ITEM is presented in Table 8.3.2. The table contains the information
    of items for sale. The column named SALEID is a foreign key. Each item can be
    locked for 20 minutes by any buyer. LASTLOCKTIME represents the last timestamp
    for the item is locked, and TRANSACTIONTOKEN identifies the buyer who is the current
    lock owner. The thumbnail image of the item is saved as a BLOB object.


    As shown in Table 8.3.3, TBL_TRANSACTION stores information about transactions.
    Similarly, its primary key is a transaction token that consists of 10 natural
    numbers. Each record of TBL_TRANSACTION contains information of the name of the
    buyer, credit card number, and total purchase amount.'
