    # 4.1.3.4 Boolean


    Boolean has exactly two values, true and false. It is similar to Booleans in Java,
    except that Booleans in JavaScript can be converted to and from other datatypes.


    # 4.1.3.5 String


    String is the datatype for all string values. Strings are defined by enclosing
    a sequence of characters in matching pairs of double quotes ("hello") or single
    quotes (''hello'') on one line. If your string must contain single quotes (or
    an apostrophe), then use double quotes to define the string (i.e., "that''s cool")
    or vice versa (i.e., ''name=bob''). JavaScript also supports escape syntax like
    Java (i.e., ''\''''s cool''), so you can add a new line to a string by using \n
    (i.e., "here is a string\ntwo lines"). Also, JavaScript supports escape syntax
    for Unicode characters (e.g., \uXXXX).


    Strings are special in JavaScript in that they are not of type Object, yet you
    can use object notation for accessing their properties and methods (all of which
    are defined in the wrapper object for the String type, called String; see Section
    4.1.3.9). For instance, you can get the length of a String through a property
    like this:


    ```

    "hello".length

    ```


    Or you can get a single character from a String like this (JavaScript strings
    are indexed starting with zero, like Java):


    ```

    "hello".charAt(0)

    ```


    Strings in JavaScript can be concatenated with the + operator. This approach is
    useful when adding another datatype value to a string or breaking a string across
    lines for readability.


    ```

    "Hello " + 5 + " times." // Evaluates to "Hello 5 times."

    ```


    When using mathematical operators other than + (e.g., -, *, /) with strings and
    numbers, JavaScript will first attempt to convert the string to a Number before
    performing the operation.


    > ^9http://en.wikipedia.org/wiki/Unicode'
