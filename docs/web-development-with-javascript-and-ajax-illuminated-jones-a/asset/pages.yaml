  md: '# 3.4 XML Schema


    To declare element color that can take on any string value, use


    ```

    <xs:element name="color" type="xs:string/>

    ```


    As a result, element <color>blue</color> will have value "blue", and element <color/>
    will have no value.


    To declare element color that can take on any string value, with "red" to be its
    default value, use


    ```

    <xs:element name="color" type="xs:string>

    default="red"/>

    ```


    As a result, element <color>blue</color> will have value "blue", and <color/>
    will have the default value "red".


    To declare element color that can take only the fixed string value, "red", use


    ```

    <xs:element name="color" type="xs:string>

    fixed="red"/>

    ```


    As a result, element <color>red</color> will be correct, element <color>blue</color>
    will be invalid, and element <color/> will have the fixed (default) value "red".


    Although simple elements cannot have attributes, the syntax for declaring attributes
    in XML Schema is similar to that for simple elements. You just need to change
    xs:element to xs:attribute in the preceding examples. For example,


    ```

    <xs:attribute name="lang" type="xs:string>

    default="EN"/>

    ```


    declares that lang is an attribute of type xs:string, and its default value is
    EN. Such attribute declarations are always embedded in the declarations of complex
    elements to which they belong.


    Attributes are optional by default. You can use element’s use attribute to specify
    that the declared attribute is required for its hosting element. For example,
    if the earlier attribute does not have a default value but it must be specified
    for its hosting element, you can use the following declaration:


    ```

    <xs:attribute name="lang" type="xs:string>

    use="required"/>

    ```'
