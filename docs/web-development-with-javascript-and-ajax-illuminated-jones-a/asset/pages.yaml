    ```

    "5" + 2 // Evaluates to "52"

    "5" - 2 // Evaluates to 3

    "5" * 2 // Evaluates to a Number by using the

    ```


    You can also explicitly convert from a String to a Number using the built-in Number
    function.


    ```

    Number("5") // Returns the Number primitive 5 (not a Number object)

    ```


    Or you can use the built-in functions parseInt() and parseFloat(). These functions
    convert and return any number at the beginning of a String, ignoring any trailing
    characters that are not numbers. However, if a Number in form begins with 0x or
    0X, parseInt() will convert it as a hexadecimal number. ECMAScript says that if
    it starts with 0 (but not 0x or 0X), parseInt() may parse it as an octal or a
    decimal number. Therefore, you should never use parseInt() to parse numbers with
    leading zeros, unless you use the second optional parameter to parseInt(), which
    allows you to specify the radix to be used.


    ```

    parseInt("5 people"); // Returns 5

    parseFloat("0.9em"); // Returns 0.9

    parseInt("hello"); // Returns NaN

    ```


    Once you have defined a String, you cannot modify it. Strings are immutable, as
    they are in Java. Unlike Java, however, strings in JavaScript are compared by
    value. In Java, you have to use the equals() method to compare the value of strings;
    otherwise you will compare the references. In JavaScript, strings are treated
    like primitives and the values are compared. Also, JavaScript does not have a
    datatype to represent one character, like char in Java.


    # 4.1.3.6 Object


