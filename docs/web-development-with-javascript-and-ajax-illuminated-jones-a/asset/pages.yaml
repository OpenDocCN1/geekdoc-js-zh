    # 2.2.3 Basic HTML Elements


    # 2.2.3.1 Creating Headings, Paragraphs, and Line Breaks, and Formatting Text


    HTML supports elements h1, h2, h3, h4, h5, and h6 to create headings in decreasing
    font size.


    Element p is used to create paragraphs. There is extra vertical space between
    successive paragraphs. White-space characters (new-line, tab, and space) are used
    only to separate successive words, and a sequence of white-space characters is
    equivalent to just one. A new-line character will not break a line in a web browser
    presentation. To break the line but avoid the extra space introduced by a new
    paragraph, use a br element in form <br/>. Element b, like <b>text</b>, will present
    its text in bold.


    Element i, like <i>text</i>, will present its text in italic. Elements b and i
    can be nested, as <b><i>text</i></b>, to present its text in bold italic.


    Element tt, like <tt>text</tt>,, will present its text in a monospace font.

    The text inside a pre element will be presented in a monospace font, with all
    white-space characters preserved. Elements b and i can be used inside pre elements.'
