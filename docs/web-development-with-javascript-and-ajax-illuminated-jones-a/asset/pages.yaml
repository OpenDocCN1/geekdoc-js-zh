    **Example 2.** Cross-site Remote Forgery Attack (XSRF) is a command injection
    attack similar to XSS. However, unlike XSS attack, which exploits a user''s trust
    in a website, XSRF exploits a website''s trust in the user.


    Assume that superbroker.com is an online stock brokerage firm that provides online
    securities exchange to its customers. Once logged in, a customer can click the
    Buy and Sell buttons to submit transaction requests. At the client side, JavaScript
    functions handle the request of buy and sell and usually use XHR to invoke servlets
    at the server side. For example, a request to buy stocks can be achieved using
    the GET method, as shown in the following.


    ```

    http://www.superbroker.com/buystock?stockid=100&amount=1000

    ```


    At the server side, a servlet named buystock takes two parameters: stockid and
    amount. The parameters do not include the identifier of the user, because the
    site uses a cookie to identify each session.


    Like other stock brokerage firms, superbroker also provides financial research
    tools to customers. The financial research tool provides a collection of market
    analysis articles to users every day. It also allows experienced users to post
    articles and discussions of the market. However, access to these articles is limited
    to registered users and can be accessed only once they log in.


    Alice, the attacker, decides to trick Venice into buying 1000 shares of AAA.COM.
    She posts an article that will be read by Venice. Inside the article, she embeds
    an invisible image as the following.


    ```

    <IMG src="www.superbroker.com/buy.index?stockid=100&amount=1000" visible="false">

    ```'
