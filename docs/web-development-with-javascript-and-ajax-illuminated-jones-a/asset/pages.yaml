  md: "# Examples and Lab Practice\n\nYou will practice three hands-on labs in this\
    \ section. All labs use the Dojo toolkit for Ajax application: the first shows\
    \ how to develop an Ajax web application to get data from the server with the\
    \ Dojo xhr() function; the second shows how to post form data to the server and\
    \ ask the server to respond to the request with the form data with the Dojo xhrPost()\
    \ function; and the last shows how to use JSON data in Ajax web applications with\
    \ the Dojo toolkit.\n\n# Lab 1: Using Dojo xhrset in Ajax Applications\n\nInstalling\
    \ and adding an external Tomcat server in NetBeans 6.0:\n\nReference: http://wiki.netbeans.org/AddExternalTomcat\n\
    \nIt is assumed that Apache NetBeans 6.0 and the latest JDK are installed on your\
    \ computer. In NetBeans 6.0 we need to add the Tomcat server externally. Let us\
    \ see the configuration of the Tomcat 6.0 server.\n\n# Tomcat 6.0 setup:\n\nYou\
    \ can either install the executable file to install Tomcat 6.0 or you can extract\
    \ the Tomcat6.0.zip folder to the drive; for example, you can extract it to the\
    \ drive C:\\Tomcat60.\n\nNow you go into your Tomcat/conf/ folder and open tomcat-users.xml\
    \ in a text editor and add the username and password in which the manager role\
    \ is assigned to the user.\n\nHere is how your tomcat-users.xml should look:\n\
    \n```\n<?xml version='1.0' encoding='utf-8'?>\n<tomcat-users>\n  <role rolename=\"\
    manager\" />\n  <role rolename=\"standard\" />\n  <user username=\"admin\" password=\"\
    mypassword\" roles=\"standard\" />\n</tomcat-users>\n```\n\nThis will add the\
    \ username as \"admin\" and password as \"mypassword\". In NetBeans 6.0 we need\
    \ to specify the username and password.\n\nYou will build Ajax and Dojo by using\
    \ JSP technology, and the work will be done in the NetBeans 6.0 IDE. Once the\
    \ Tomcat server is installed properly, open the NetBeans 6.0 IDE to add Tomcat\
    \ as an external server."
