    # 8.6 Milestone 3: Seller Page and JavaScript Faces (JSF)


    This section presents the exciting JavaServer Faces (JSF) technology. You will
    use JSF to build Seller.jsp for uploading information for a yard sale event. Various
    techniques for manipulating databases, e.g., JDBC and JSF data table, will be
    addressed.


    The Seller.jsp creates a yard sale event and inserts a new record into the TBL_YARDSALE
    table. Each yard sale has a unique ID (identifier), which is a sequence of 10
    three-digit numbers. The resulting state space of ID is about $10^{10}$. According
    to the theory of statistics, there could be hardly any collision after randomly
    generating $10^{10}$ IDs. In practice, you can feel safe in randomly generating
    an ID for a new record.


    Listing 8.6.1 presents the source code of ID.java. It defines a collection of
    essential functions provided by the ID class. The ID class has one static attribute
    named valueLength, which defines the number of natural numbers in ID. Because
    valueLength is defined as a constant integer 10, it indicates that an ID consists
    of 10 natural numbers. The actual values of these natural numbers are stored in
    the array name value. The constructor of ID initializes the array by using the
    Random class provided by Java API. The value of each random number ranges between
    0 and 127;hence, each number can be represented using 1 byte. The `toString()`
    method dumps the contents of an ID. The `equals()` method checks whether two IDs
    are equal by looking at each number in the array value. Finally, the class is
    defined to implement the Serializable interface so that it can be stored as a
    binary array in database.


    To model the TBL_YARDSALE table, a class named YardSale is defined, as shown in
    Listing 8.6.2. The YardSale class has a list of data members to'
