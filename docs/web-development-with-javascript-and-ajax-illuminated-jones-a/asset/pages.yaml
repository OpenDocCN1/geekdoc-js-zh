    # 2.3.4 Formatting Part of Text or a Document with span and div


    So far you have learned how to format all text in an element differently. Sometimes
    you also need to format a few words in an element differently. You cannot do so
    at this point because these words may not be all text in an element and your style
    rules or style attributes can be applied only to all in element. The solution
    is the introduction of a new type of element: span. span element itself has no
    visual effect on formatting. But like all HTML elements, span supports style,
    id, and class; therefore, you can use style attributes and style rules to format
    text in a span element.


    On the other hand, you may also want to format all elements in a particular logical
    section of an HTML document in a special way. You can use a div element to enclose
    all elements in a logical section and assign an id or class attribute value to
    identify this division. You can also use the style attribute to apply formatting
    to the entire div box. Like span, div itself has no visual effects on a web page''s
    view. It depends on style rules or style attributes to format its contents. Whereas
    span is an inline box, part of a text line, does not start new lines, div universally
    encloses elements like paragraphs, lists, and headers, which are separated from
    elements outside the div element by some vertical space.


    The following example illustrates the HTML features introduced in this sub section.
    It uses "id1" to display a term in the document in underlined red. It defines
    two divisions and both displays in a different boundary box. Although all elements
    of class "keyword" are set to display in italic blue, all elements of class "keyword"
    inside division "ajax" are set to display in italic green. As explained earlier,
    a style rule for a specific subset of elements overrides for a more generic style
    rule applied to a larger scope containing that subset.


    ```

    #id1 {color: red; text-decoration: underline}

    .keyword {color: blue; font-style: italic}

    #ajax .keyword {color: green; font-style: italic}

    #intro {border: 4px blue outset;

    margin: 10px; padding:5px}

    ```'
