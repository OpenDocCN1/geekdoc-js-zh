  md: '# 7.1 Overview


    Although Ajax has quickly gained the favor of users, it nevertheless increases
    the complexity of web application development. Ajax developers face several new
    challenges, e.g., testing callback functions, debugging asynchronous calls, examining
    the frequently changing DOM structures, and avoiding racing conditions between
    concurrent asynchronous calls. Security is another serious concern of Ajax worms.
    This chapter exposes you to the tricky issues and challenges that you should pay
    attention to when developing Ajax applications. It presents to several useful
    tools for debugging and testing Ajax applications.


    # 7.2 Diagnosis of Ajax Web Applications


    Diagnosis and debugging of programs has been an indispensable part of software
    development since the birth of computers. Compared with traditional programming,
    Ajax web applications have raised several new challenges to software developers.
    First of all, Ajax web applications involve both servers and client-side programming.
    To troubleshoot a problem, one must explore both sides of the interaction. Second,
    debugging JavaScript is harder than that of traditional programming languages
    because JavaScript is a scripting language and lacks strong typing support. Third,
    Ajax web applications communicate with the server asynchronously. Compared with
    traditional web applications that adapt a simple request-response model, Ajax
    applications can have multiple XMLHttpRequest sessions going on, and concurrency
    can lead to errors that cannot be easily reproduced. This section discusses the
    diagnosis and debugging techniques that can be used to tackle these challenges.


    # 7.2.1 Diagnosis of HTML


    HTML files are often generated by server scripts (e.g., JSP and ASP.Net). When
    a dynamically generated HTML file has syntax problems, correct rendering of the
    page depends solely on the tolerance of the client browsers. As discussed earlier,
    this could easily lead to incompatibility of web pages. Inspection of HTML syntax
    can be accomplished via several tools.


    W3C provides an online XHTML validation service called W3C Markup Validation Service
    (W3C, n.d.). Users can either submit the URL or directly'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# 7.2 Diagnosis of Ajax Web Applications


    paste the contents of an HTML file into the validator. The Web Design Group (WDG)
    also provides similar online HTML syntax validation services (WDG, n.d.). One
    problem with online validation services is that they can deal with only one page
    at a time. A better way is to verify the syntax of HTML pages generated by dynamic
    server scripts at run time. This can be accomplished by taking advantage of offline
    syntax validation programs such as the WDG offline HTML validator (WDG, n.d.b).
    The offline validator can be called whenever the server-side script generates
    the HTML response at run time.


    # 7.2.2 Diagnosis of JavaScript


    Among the many program analysis approaches available to programmers, logging and
    debugging are probably the oldest and most frequently used ways to troubleshoot
    a program.


    The basic idea of logging is to insert printing statements at various important
    places in a program. Reading the logs printed out by the program allows developers
    to read values of important data variables and identify the bugs present in a
    program. The logging technique can not only help in debugging Ajax web applications
    but also benefit from the Ajax technique.


    One popular framework for logging JavaScript is the log4JavaScript framework (Down,
    n.d.). Log4JavaScript provides a set of JavaScript functions for logging. Users
    can call logger functions and log messages in six categories (trace, info, debug,
    warn, error, and fatal).


    Listing 7.2.1 presents a sample JavaScript snippet that uses log4JavaScript. Line
    1 imports the log4JavaScript.js file, which defines all associating functions
    of the framework. Line 3 creates a logger object. Line 4 creates a pop up window
    that displays the logged messages. Line 5 attaches the pop-up window to the logger
    object so that all messages will be sent to the pop-up window. You can also do
    remote logging by creating an Ajax object (line 6). When any logging function
    of the logger object is called, the message being logged is sent to the remote
    server for recording. Line 8 writes a sample debugging level message, "Hello World!"
    The complete sample code of Listing 7.2.1 can be found on this book''s website.
    The file is located in /Ch7/CodeExamples/log4JavaScriptExample.'
  merge: -1
  pgno: 300
