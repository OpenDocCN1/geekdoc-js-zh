  md: 'Sometimes you need to use reasoners to strengthen SPARQL''s deduction capability.


    For just RDFS or OWL inference you can use the prepackaged reasoners; for extending
    your own rules that you defined yourself, you can build a generic reasoner and
    include the standard rules.


    You know from the dataset that mammal has "hair" and :mammal gives "milk", but
    you cannot conclude that an animal is a mammal simply because an animal has hair
    and gives milk.


    If you have such a rule about mammal recognition, then an animal that has hair
    and gives milk is a mammal.


    Rule 1:


    ```

    (?x myns:"hair") (?x myns:eats "meat")n-> (?x rdf:type myns:mammal) .

    ```


    Rule 2:


    ```

    (?x rdf:type:mammal) (?x myns:has "claws") (?x myns:has "strips")n-> (?x rdf:type:tiger)

    ```


    If you know a mammal has "hair", eats "meat", has "claws", and has "stripes",
    SPARQL can infer that the animal is a tiger. With the first two conditions you
    can deduce that it is a mammal. With the last two conditions plus the deduced
    fact, you can conclude that it is a tiger.


    As W3C summarized,


    The Semantic Web is about two things. It is about common formats for integration
    and combination of data drawn from diverse sources, where the original web mainly
    concentrated on the interchange of documents. It is also about language for recording
    how the data relates to real world objects. It allows a person, or a machine,
    to start off in one database, and then move through an unending set of databases
    which are connected not by wires but by being about the same thing.


    The Semantic Web is the third-generation web. The new Web will be smarter, more
    connected, and more intelligent. It will evolve the Web from an isolated application
    and data network to a more seamless and interoperable web with an integrated and
    distributed semantic database for semantic search. The WebOS (Web 4.0) will be
    the next phase in web evolution after Web 3.0.'
