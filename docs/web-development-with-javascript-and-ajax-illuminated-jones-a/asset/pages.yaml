- img_proc: true
  md: '# 1.1 History Lesson


    The Internet and the World Wide Web (WWW), sometimes collectively referred to
    as the Web, revolutionized the way that companies conduct business and even the
    way that humans communicate. Today, you can buy anything on the Web, you can manage
    all your financial accounts on the Web, you can watch TV programs and movies on
    the Web, readily conduct business meetings over the Web, greater portions of the
    population get their daily news and information from the Web, and many humans
    would rather communicate via email or instant messaging than talk on the phone.


    The Internet is a global network of computer networks that join together millions
    of government, university, and private computers. This network provides a mechanism
    for communication where any type of data (text, images, video, etc.) can be exchanged
    between linked computers. These computers can be physically located on opposite
    ends of the globe, the data can be exchanged in a matter of seconds. Although
    often used interchangeably, the terms “Internet” and “WWW” are different. The
    Internet is the worldwide network of computers (and other devices such as cell
    phones), which the WWW refers to and includes the global publicly available websites
    plus FTP (File Transfer Protocol) sites, USENET newsgroups, etc. Email is not
    considered to be part of the WWW but is a technology that is made possible by
    the Internet.


    The Web had its beginnings in the early 1960s when some visionaries saw great
    potential in allowing computers to share information on research and development
    in scientific and military fields. In 1962, Joseph Carl Robnett Licklider at the
    Massachusetts Institute of Technology (MIT) first proposed a global network of
    computers. Later that he started working at the Defense Advanced Research Projects
    Agency (DARPA), then called the Advanced Research Projects Agency (ARPA), to develop
    his idea. From 1961 through 1964, Leonard Kleinrock, while on a Ph.D. thesis at
    MIT, and later while working at the University of California at Los Angeles (UCLA),
    developed the concept of packet switching, which is the basis for Internet communications
    today. In 1965 at MIT, Lawrence Roberts and Thomas Merrill used Kleinrock''s packet
    switching'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 1.1 History Lesson


    theory to successfully connect a computer in Massachusetts with a computer in
    California over dial-up telephone lines—the first Wide-Area Network (WAN).


    In 1966, Roberts started working at DARPA for the first large-scale computer network,
    called ARPANET, at which time he became aware of work done by Donald Davies and
    Roger Scantlebury of National Physical Laboratory (NPL) and Paul Baran of RAND
    Corporation that coincided with packet switching concept developed by Kleinrock
    at MIT. By coincidence, the early work of the three groups (MIT, NPL, and RAND)
    had proceeded in parallel without any knowledge of each other. The word “packet”
    was actually adopted for the ARPANET proposal from the work at NPL. DARPA awarded
    the contract for bringing ARPANET online to BBN Technologies of Massachusetts.
    Bob Kahn headed the work at BBN,


    which (later called the Internet, in 1974) online at 50 kilobytes per second (Kbps),
    connecting four major computers at universities in the southwestern United States—UCLA,
    the Stanford Research Institute, the University of California at Santa Barbara,
    and the University of Utah.


    ARPANET quickly grew as more sites were connected. In 1970, the first host-to-host
    protocol for ARPANET was developed, called Network Control Protocol (NCP). In
    1972, Ray Tomlinson of BBN developed email for ARPANET. In 1973, Vincent Cerf
    of Stanford and Bob Kahn of DARPA began to develop a replacement for NCP, which
    was later called Transmission Control/Internet Protocol (TCP/IP). ARPANET was
    transitioned to use TCP/IP by 1983. TCP/IP is still used today as the Internet’s
    underlying protocol for connecting computers and transmitting data between the
    other network.


    The original Internet was not very user-friendly, so only researchers and scientists
    used it at that time. In 1991, the University of Minnesota developed the first
    user-friendly interface to the Internet, called Gopher. Gopher became popular
    because it allowed non-computer scientists to easily use the Internet. Earlier,
    in 1989, Tim Berners-Lee and others at the European Laboratory for Particle Physics
    (CERN) in Switzerland proposed a new protocol for information distribution on
    the Internet, which was based on hypertext, a system of embedding links in text
    to link to other text. This system was invented before Gopher but took longer
    to develop.'
  merge: -1
  pgno: 18
