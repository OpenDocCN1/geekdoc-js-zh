  md: "```\nvar EventHelper = (function() {\n  // An array to keep track of registered\
    \ event listeners.\n  /* private */ var eventListeners = [];\n\n  // Removes the\
    \ listener from the node.\n  /* private */ function detachListener(event) {\n\
    \    var nodeObj = event.nodeObj;\n\n    if (nodeObj.removeEventListener) {\n\
    \      nodeObj.removeEventListener(event.name, event.listener,\n      false);\n\
    \    } else if (nodeObj.detachEvent) {\n      nodeObj.detachEvent(\"on\" + event.name,\
    \ event.listener);\n    }\n  }\n\n  // Removes the listener from the eventListeners\
    \ array.\n  /* private */ function deleteListener(event) {\n    var tempArray\
    \ = [];\n\n    for (var i = 0; i < eventListeners.length; i++) {\n      if (eventListeners[i]\
    \ != event) {\n        tempArray.push(eventListeners[i]);\n      }\n    }\n\n\
    \    eventListeners = tempArray;\n  }\n\n  // Removes all listeners to prevent\
    \ memory leaks in IE.\n  /* private */ function unbindAll(eventListeners) {\n\
    \    for (var i = 0; i < eventListeners.length; i++) {\n      detachListener(eventListeners[i]);\n\
    \    }\n    eventListeners.length = 0;\n  }\n\n  /* private */ var helper = {\n\
    \    // Adds a listener to a node and returns an object\n    // to use to remove\
    \ the listener later.\n    bindListener: function(nodeObj, eventName, listener)\
    \ {\n      var listenerFn = listener;\n```"
