  md: '# 4.1 JavaScript—the in Ajax


    # 4.1.9 Arrays


    Arrays in JavaScript are a special form of object that provides the ability to
    reference its properties using a zero-based nonnegative integer index and a special
    length property. The length property holds the current length of the array and
    can be set to a different value to increase or shorten the length of the array.
    Arrays in JavaScript are not typed, so they can contain any combination of datatypes,
    including other arrays and functions. JavaScript does not support multidimensional
    arrays, but you can create arrays of arrays. Unlike Java or C++, JavaScript arrays
    dynamically grow to hold new elements that are added to them.


    Arrays are created using either the Array() constructor function or array notation.
    The only reason to use the Array() constructor is to create an empty array of
    a specific length.


    ```

    var myArray = new Array(50); // Length of 50 with 0 undefined elements.

    myArray.length = 0; // Length is now 0.

    myArray[0] = 0; // Dynamically grows to hold added elements.

    myArray[1] = 1;

    myArray[3] = 3; // Length is now 4 with 1 undefined element.

    ```


    Otherwise, array literal notation is much more concise.


    ```

    var emptyArray = []; // Create empty array using literal notation.

    varမျိုးArray = [true, 5, "hello", {x:1, y:2}], [1, 2, 3]];

    var arrayOfArrays = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];

    var sparseArray = [1,,,5]; // Length of 5 with 3 undefined elements.

    ```


    # 4.1.10 Regular Expressions


    Regular expressions in JavaScript can be created using the RegExp() constructor
    or a regular expression literal. For example, the following examples create a
    regular expression object that matches the word "ajax", case insensitive.


    ```

    // Create regular expressions that match the word "ajax", case

    // insensitive.

    var RegExp1 = /ajax/i;

    var RegExp2 = new RegExp("\ajax\b", "i");

    ```


    ```

    // Displays "com.hello.com"

    alert("com.ajax.com".replace(RegExp1, "hello"));

    ```


    ```

    // Displays "com.blah.com"

    alert("com.AJAX.com".replace(RegExp1, "blah"));

    ```'
