  md: 'method (required): A string that defines the HTTP method of the operation to
    be performed on the resource identified by the URL of the request. Typical HTTP
    methods are HEAD, GET, and POST. The HEAD method tells the web server to return
    just the HTTP headers associated with the URL, so you could, for instance, check
    the last modified date of a document without downloading it. Most requests use
    the GET method to download the content of the URL. The POST method is used mostly
    by HTML forms to submit data to the web server as name-value pairs in the HTTP
    request''s entity body. To improve cross-browser compatibility, the method string
    should be all-capital letters (i.e., "GET" instead of "get”).


    url (required): A string defining the target URL of the request.


    async (optional): A Boolean value indicating whether the request should be made
    asynchronously. By default the value is true, which processes the request asynchronously.
    There is practically no reason to set this value to false to process the request
    synchronously. Doing so will block the browser UI until the response is returned
    and processed.


    user (optional): A string identifying a user for a web server that requires authentication.


    password (optional): A string identifying the user''s password for a web server
    that requires authentication.


    ```

    void send(Object data)

    ```


    Sends the request to the server. If the request was configured to be asynchronous
    (async parameter of the open() method was set to true) this method returns immediately;
    otherwise, it blocks until the response is received. The optional parameter is
    sent as part of the request body. The parameter can be a DOM Document object,
    an input stream, or a string. The parameter is usually used only when sending
    a POST request with form data. The form


