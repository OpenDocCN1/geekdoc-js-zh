  md: '# CHAPTER 9 The Future of Web Applications


    There is a need to have an ontology language on top of RDFS for Semantic Web applications.


    Semantic Web Ontology Language (OWL) describes web information resources and relationships
    between the resources. OWL is a language standard for Semantic Web ontology to
    meet this need. It became a W3C recommendation in 2004. OWL is designed for ontology
    constructing, integrating, processing, and querying web information.


    The focus of OWL is to provide a common way to process the contents of web information
    instead of displaying. OWL covers all vocabulary and syntax of RDF and RDFS, and
    it is much more powerful than these two standards. OWL is written in XML so that
    OWL information will be compatible with any type of operating system and application
    language. OWL supports more formal concepts and relationships and provides constraints
    on properties, well as a reasoning mechanism. It can also decide and check logic
    based on rules such as if A is a kind of B and B is a kind of C, A is a kind of


    OWL is a standard layer on top of RDFS that introduces its own Class (collection)
    and Thing (individual) to distinguish classes from individuals.


    For example, you declare a "Mammal" class and define an individual in this class
    called "Tomcat":


    ```

    <owl:Class rdf:ID="Tomcat">

    </owl:Class>

    ```


    ```

    <owl:Thing rdf:ID="Tomcat">

    <rdf:type="#Mammal"/>

    </owl:Thing>

    ```


    Class, individual, and property are the three major components in OWL ontology.


    First, the OWL class is an important element in OWL. OWL classes are building
    blocks in the OWL ontology. OWL can define and create a named class. OWL supports
    intersection of classes, union of classes, complementary classes, enumerated classes,
    and restrictions on classes.


    By using class intersection, class union, and class complement operations you
    can construct a new class from existing classes.


    OWL class restrictions include class quantifier restrictions (there exists at
    least one existential restriction and a "for all of" universal restriction), car-'
