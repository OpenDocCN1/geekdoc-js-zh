  md: '# 4.4 Document Object Model (DOM)


    Because the DOM is language neutral, its ultimate goal today is to make it possible
    for programmers to write applications that work properly on all browsers and servers
    and on all platforms. The DOM is not only used in web browsers to parse and manipulate
    HTML but also commonly used in various applications to parse and manipulate XML.
    In fact, the basis of the DOM standard, the DOM Core, provides a low-level set
    of objects that can represent any structured document, whether it is XML, HTML,
    or anything else. Built on top of the DOM Core are two other parts to the DOM
    standard, HTML and XML specifications, which consist of objects and methods that
    provide easier and more direct access to those specific types of documents.


    The DOM has been developed in levels.³31 DOM levels 1, 2, and 3 are defined (3
    is not fully complete), and more levels may be developed in the future. Unfortunately,
    browser support for the existing DOM levels varies a good bit.³32 Modern browsers
    support most of DOM Level 1 and 2 and only about half of DOM Level 3 Core. The
    following outlines the levels.


    +   * DOM Level 1: Defines the base Core, HTML, and XML document models, including
    functionality for document navigation and manipulation.


    +   * DOM Level 2: Adds to the Level 1 Core and HTML document models. Defines
    a style sheet object model and functionality for manipulating the document style
    information. Also defines traversals on the document, an event model, and support
    for XML namespaces.


    +   * DOM Level 3: Adds to the Level 1 Core document model. Defines document loading
    and saving, content models (such as DTDs and schemas) and validation, views and
    formatting, and key events and event groups.


    DOM is a tree-based model in which the entire document is parsed and cached in
    memory as a tree structure of objects called nodes. The DOM


    > ³¹http://www.w3.org/DOM/DOMTR.


    > ³²Some online resources for identifying DOM browser support are http://www.quirksmode.org/dom/compatibility.html
    and http://www.webdevout.net/browser-support. A good book is Dynamic HTML: The
    Definitive Reference (http://www.danny.com/pubs/dhtml/).'
