  md: 'It allows machines to search the data starting off at one website and then
    follows semantic ontology relationship connections to traverse all necessary links
    to reach all data in a semantic query. Semantic ontology is like bridges spanning
    over many web-related websites. For example, one can make a “semantic link” between
    a database or home page with a “mammal” identifier, and the other identifier could
    be “carnivore” with its properties. The relationship between carnivore and mammal
    is an “is a” also called a subclass relationship: carnivore is a subclass of mammal
    and encompasses all properties that a mammal has. This approach allows machines
    to follow links to integrate data from many various sources automatically.


    Semantic Web moves from a human-oriented, document-based web to a machine-oriented,
    information-linked web; it moves from a data-oriented web to a semantic-oriented
    web with meaningful metadata built on top of the original Web. This Semantic Web
    provides not only documents but also a common framework that allows data to be
    shared, reused, and processed by application agents automatically. It also provides
    a global integrated ontology-oriented database that merges all related databases
    together on the Web.


