    # 7.2.3 The Challenge of Asynchronous Call in Debugging


    The challenge of debugging Ajax applications, different from other web applications,
    that Ajax can send requests to the server side asynchronously via XMLHttpRequest.
    This concept raises interest in intercepting data exchanged between client and
    server, for analyzing the correctness of the client-side script.


    As pointed out by Mahemhoff (2006), there are generally three approaches for tracking
    the data passed by XMLHttpRequest: (1) Use wrappers of'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# CHAPTER 7 Ajax Challenges and Best Practices


    HttpRequest to record data submitted by HttpRequest. (2) Set up a proxy for the
    client side so that all data transmitted to the server is recorded by the HTTP
    proxy. (3) Use a generic network traffic sniffer such as Ethereal (www.ethereal.com,
    n.d.).


    Approach 1 is usually the most convenient. However, it is effective only when
    all asynchronous calls are placed using the wrapper function. Approach 3 is usually
    overkill normally you will not be interested in data payload at network layers
    other than HTTP. Approach 2 is the most effective and enjoys the support of many
    tools. For example, the XML-HTTPDebugging (Couveur, n.d.) allows tracking, filtering,
    and displaying XMLHttpRequest-related data.


    # 7.2.4 Profiling


    Another important part of diagnosing Ajax applications is analyzing and profiling
    performance. Many factors could dampen the performance of an Ajax application,
    e.g., network bandwidth, availability and performance of server-side scripts,
    and efficiency of JavaScript functions at the client side. There are usually two
    different approaches for analyzing performance. One way is to record the starting
    and ending time of JavaScript functions with the aid of Ajax loggers. The other
    way is to rely on integrated profiling tools.


    On Firefox browsers, a tool called Firebug (Hewitt, n.d.) can provide support
    for profiling. Firebug is installed as a third-party add-on in the Firefox browser.
    The installation process is straightforward. Once the tool is installed, by clicking
    the Firebug logo at the lower-right corner of the browser, a developer can conveniently
    start the Firebug console. As shown in Figure 7.2.2, the Firebug console has a
    list of buttons as Console, HTML, CSS, Script, DOM, and Net. Click the Console
    button. You will notice that the tool starts to tick and records every activity
    (e.g., execution of JavaScript function and firing of XHR calls) of the page.
    If you are interested in network transmission only, you can click the Net button.
    Firebug will display display information related to each HTTP request. You can
    examine the response time and data payload contents of each packet. You can also
    inspect the dynamic DOM structure (the attributes of each HTML element of the
    page, including those created and modified by JavaScript at run time) by clicking
    the DOM button.'
