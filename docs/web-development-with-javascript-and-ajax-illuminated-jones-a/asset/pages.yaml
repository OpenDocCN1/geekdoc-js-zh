    Ajax developers would also need to develop unit tests for server-side programs.
    This can be achieved by using unit testing frameworks such as JUnit and NUnit,
    depending on the computing platforms used at the server side.


    # 7.3.2 Integration Testing


    Integration testing refers to the testing performed after unit testing. It takes
    the modules as input and verifies that all modules can interact with each other
    successfully. In general, there are two methods of integration testing: top down
    and bottom up. The top-down approach refers to the case that once all modules
    are tested, they are put together and run until problems are found and debugged.
    The bottom-up approach refers to the procedure that units are composed from the
    bottom up and tested at each level. The benefit of the top-down approach is fast
    evaluation of the whole system if all units are carefully composed. The benefit
    of the bottom-up approach is saving overall development cost as bugs can be discovered
    in the early stages of integration. For both approaches, JavaScript mock libraries
    such as JSMock (DeWind, 2006) can be helpful.


    # 7.3.3 System testing


    System testing can be generally divided into functional testing and non-functional
    testing. Functional testing refers to testing activities that verify'
