  md: '# 9.1 Overview


    People like to use terms Web 1.0, Web 2.0, and Web 3.0 as milestones in web technology
    evolution. More precisely, it is an evolutionary path for the Web in the following
    phases (http://en.wikipedia.org/wiki/Web_3_):


    Web 1.0: Web Browser driven *Interactive Web of Hypertext* pages where presentation,
    logic, and data are indistinguishable


    Web 2.0: Web Services API driven “Web of Services” that separate “Application
    Logic” from the intermingled presentation, logic, and data pages of Web 1.0. Examples
    of Web 2.0 applications include: blogs, wikis, the use of Ajax to improve web
    application richness interaction, and mashups. Web 2.0 does not explicitly expose
    Data Models.


    Web 3.0: The final step in the decomposition of monolithic Web Pages into discrete
    components that include the Presentation (HTML and (X)HTML), Logic (Web Services
    APIs), and Data (Data Models) trinity, it transitions Web containment from Web
    Pages to Web Data. Its emergence simplifies the development and deployment of
    Data Model driven composite applications that provide easy, transparent and organized
    access to “the world’s data, information, and knowledge.”


    Looking back at the evolution of web technology from HTTP Form to XForms, from
    syntactic web to semantic web, we see how to model, structure, and organize web
    data has always been a key issue.


    Web 3.0 links and merges all information on the Web as a global database. In Web
    3.0, the Web will be organized into a well-linked database, making content accessible
    by webbrowser computer applications instead of browsers only, adding artificial
    intelligence to Semantic Web. In previous chapters we discussed the XMLHttpRequest
    and Ajax in detail. In this chapter we will introduce Semantic Web. The future
    of the Web is semantic. Before we discuss the Semantic Web, you should know about
    XML Forms Language (XForms), which offers a new way to look at a form where content,
    structure, and presentation are completely decoupled.


    # 9.2 XForms


    XForms is the next generation of web HTML forms (XHTML 2.0) recommended by the
    W3C in 2003. XForms is an improvement and enhancement of HTML. XForms uses XML
    to create input forms on the Web.'
  merge: -1
  pgno: 421
- img_proc: true
  md: '# 9.2 XForms


    Traditional XHTML forms consists of three parts—XForms model, instance data, and
    user interface—like a model-view-controller model that separates presentation
    from data and business logic. XForms make device independent that many mobile
    devices can be used as XForms user interface for presentation. Data is stored
    in XML documents. Adding XForms elements to any other XML input is easy. Separation
    of presentation and data increases form reusability. XForms itself has the functionality
    of form validations. XForms has significantly reduced the need for scripting event
    handlers. In summary, XForms provides a powerful, fast, more secure, and device-independent
    way of handling web input. For example, strongly typed submitted data in XForms
    can be checked on site without round trips to the server for validation. XForms
    will be adopted by all major browsers. XForms can now be integrated into many
    other languages in addition to XHTML.


