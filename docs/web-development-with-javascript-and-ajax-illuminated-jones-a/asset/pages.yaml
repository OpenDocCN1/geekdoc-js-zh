    The properties of the prototype object of a constructor function are inherited
    by all objects created using that function. Therefore, it is efficient to add
    class methods to the prototype than to this keyword. Properties added to the prototype
    object of a constructor function are inherited by objects of that class even if
    the properties were added after the instance was created.


    When you reference a property of an object, JavaScript first checks to see if
    that property is a member of the object. If the object does not have the property,
    then JavaScript checks the prototype for that property. Because the prototype
    is an object, it can also have an associated prototype, forming a chain of prototypes,
    which is the inheritance hierarchy. JavaScript will search up the chain of prototypes
    until it finds the property. If it does not find the property, then undefined
    is returned. That is how inheritance in JavaScript works, which explains how all
    objects in JavaScript inherit from the built-in Object class. The prototype object
    is created using the Object() constructor function, so its prototype is, by default,
