    # 1.3 Evolution of the Web


    The Web was first implemented as a way for scientists to easily exchange documents
    and link references to other documents. The web pages were static and plain text—no
    fancy graphics or fonts, nothing moved, flashed, no rich user interaction. As
    computers and networks became more powerful and the web user community, businesses
    saw the potential in the ability to distribute information about products and
    services to the world. As a result, the HTML specification was improved to meet
    the demands for richer content, such as images and animations. Web browsers, in
    particular Netscape Navigator and later Microsoft Internet Explorer, drove much
    of the HTML evolution by implementing new features before they became adopted
    as standards.


    The first web browser, called Mosaic, was developed by the National Center for
    Supercomputing Applications (NCSA) in late 1992. Mosaic was a significant step
    forward that improved the user interface to the Web and included support for images.
    Next, in 1994, Netscape Communications Corporation released Netscape 1, which
    was based on Mosaic but was much improved, with support for multiple TCP/IP connections,
    and a tag for centering content that is now deprecated: the <center> tag. Netscape
    became the new market leader and remained for several years.


    In late 1994, Sun changed the view of the Web with a Java technology-based Mosaic
    clone called WebRunner WebRunner did something that had never been done before:
    it brought to life animation, moving objects and dynamic executable content inside
    the web browser. People no longer thought of the Web being limited to static text.
    In 1995, Netscape agreed to incorporate Java support into its next browser, which
    was Netscape 2 released in 1996. The Java support allowed developers to create
    small Java programs that were embedded in a web page and executed in the browser.
    Java Applets, as they are called, are still used today to provide 3D graphics
    and animation not natively supported by browsers (see Figure 1.3.1). The'
