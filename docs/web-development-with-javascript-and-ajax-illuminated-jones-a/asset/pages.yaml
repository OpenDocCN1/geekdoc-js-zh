  md: '# 5.2 XMLHttpRequest


    responseText


    The body of the server’s response as a string of text. The server can respond
    to the request with plain text, HTML, XML, or any other format. As long as the
    request was successful, this value will be set to the response data in string
    form no what format came back.


    responseXML


    If the response is an XML document (and the response Content-Type header is set
    to “text/xml”), then the XML will be parsed into a DOM Object object and assigned
    to this property. This saves you time because you do not have to parse the XML
    yourself.


    status


    An integer value containing the HTTP status code of the response. Some of the
    most common status codes are 200 OK (meaning that the request was successful),
    302 Found (indicates that the resource has moved to another URL, called a redirect),
    304 Not Modified (usually means that the response was pulled from the browser
    cache instead of being downloaded from the server), 404 Not Found (indicates that
    the resource was not found), and 500 Internal Server Error.


    statusText


    A string value containing the text description of the status code (“OK” for 200,
    “Found” for 302, etc.).


    Using an XMLHttpRequest object is a multistep process. You first initialize the
    object to specify which URL you want to request and how you want to use the object;
    then you call the send() method to actually make the request; and finally, you
    process the response. Initialization of the-HttpRequest involves the following
    steps, which can occur in any order.


    +   * Call the open() method to specify the URL and whether you want to make a
    synchronous or asynchronous request.

    * Call the setRequestHeader() method to specify any HTTP headers to be sent with
    the request.

    * Set the onreadystate property to a function that will be called as the state
    of the request changes (and process the response when the readyState is 4 Completed).'
