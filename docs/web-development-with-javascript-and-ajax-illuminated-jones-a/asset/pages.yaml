  md: 'messages were sent. This approach would put a large burden on the server and
    reduce the performance of the system. You would not get that instant response
    that you are used to.


    Achieving a push model with a standard web browser and web server is not simple.
    It involves using the HTTP model in a manner that it was not designed for. One
    of two techniques is typically used, although a combination can also be done.
    The first technique involves the normal request from the browser, followed by
    multiple responses from the server, using the same long-lived HTTP connection.
    This technique is sometimes called page streaming. Usually, the response from
    the server sends one response (HTML page) back to the client and the HTTP connection
    is closed. page streaming, the initial HTML page is sent, but the connection is
    kept open by running a loop on the server that listens for state changes. When
    new data is to be sent to the browser, the server writes data to the output stream
    and flushes it, without closing the connection. During this long-lived connection,
    the browser is still processing the initial page, but because browsers display
    content as soon as it is received, the page can continuously be updated. The data
    pushed to the client can include any HTML tags (which can be hidden) and typically
    includes <script> tags with logic to modify the displayed content or to position
    and make hidden content. The JavaScript is executed by the browser as soon as
    it is received. You could implement a stock ticker or news scroll this way. While
    page streaming, you could also make a background XMLHttpRequest call to the server
    as a way of telling the server about something different that you pushed to the
    browser without affecting the long-lived HTTP connection. Figure 5.4.1 illustrates
    the communication between browser and server.


    Some drawbacks to page streaming include the following: (1) the browser keeps
    accumulating objects, which uses memory and could eventually cause the interface
    to bow down; (2) HTTP connections will inevitably fail, so you must have some
    plan to recover when this happens; (3) most servers are not designed to handle
    multiple simultaneous long-lived connections—however, many are working on changing
    this, and some new servers are built with this in mind, like the server Twisted
    (http://twistedmatrix.com).


    The second technique, which is more flexible, uses one or more long-lived XMLHttpRequest
    calls. In this technique, sometimes called service streaming, you can make the
    long-lived HTTP connection(s) anytime after the'
