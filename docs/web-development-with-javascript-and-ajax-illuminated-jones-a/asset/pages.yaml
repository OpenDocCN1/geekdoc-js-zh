  md: '# 8.3 High-Level Design


    The strength of Ajax is its collection of open standards and the many open-source
    development tools available. For the animation requirement for the dynamic ad
    banner, the Dojo animation package will suffice.


    # 8.3 High-Level Design


    In the requirements of BigPeachYardSaleExpress, the next step is to complete its
    high-level design. In general, the high-level design of a web application consists
    of two components: (1) devising a Graphical User Interface (GUI) and (2) designing
    a database schema. These two components will be covered in the next two subsections.


    # 8.3.1 GUI Design


    Figure 8.3.1 displays the general architecture of the website that you are going
    to implement. The first page of the website is a static page that redirects buyers
    and sellers. Seller.jsp serves sellers and PostItem.jsp to upload information
    of items for sale. Buyer.jsp serves buyers. As you will see later, this page will
    be implemented using mainly client-side techniques to maximize rich user experiences.
    The static web page called MapIDE.html is used to display the Google map. The
    page allows displaying sale event information dynamically. In the following, the
    functionality of each page in Figure 8.3.1 will be examined.


    # 8.3.1.1 Portal Page


    Page1.jsp is the portal page. As shown in Figure 8.3.2, it consists of two parts:
    the dynamic header and the main body. The header is a dynamic advertisement banner.
    Every 2 seconds, the banner will download its contents from the server. The banner
    can display animation effects over static


