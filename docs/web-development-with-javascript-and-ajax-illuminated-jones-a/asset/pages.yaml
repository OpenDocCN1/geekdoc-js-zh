- img_proc: true
  md: '# CHAPTER 1 Ajax Defined


    +   - query—The optional query is information that is to be interpreted by the
    web server. It is used to provide additional information that is not included
    in the path or to submit text data to the web server. The query can contain multiple
    name=value pairs separated by an & (ampersand). Each name is separated from its
    associated value by an = (equal).


    +   - fragment—The optional fragment is used to identify a location within a document.
    This part is actually used by the web browser, not the web server, bringing you
    to a specific location in a document. The # (pound) is used to separate the fragment
    from the rest of the URI.


    # 1.2.2 Hypertext Transfer Protocol (HTTP)


    Hypertext Transfer Protocol (HTTP) is a stateless protocol that supports requests
    followed by responses (request-response message exchange pattern). Previously
    we described the use of HTTP between a web browser and a web server; however,
    HTTP messages are also commonly exchanged between web servers or other applications
    that do not require human interaction. HTTP does not require the use of a web
    browser; it simply describes how data can be exchanged over a network that uses
    TCP/IP (e.g., the Internet). By default, HTTP uses TCP/IP connections on port
    80 of a computer, but other ports can be, and often are, used. An HTTP transaction
    begins with a request from the client and ends with a response from the server.


    An HTTP request message consists of three parts: (1) a line defining the HTTP
    method, the URI requested, and HTTP version used; (2) a list of HTTP request headers;
    and (3) the entity body. An example HTTP request message follows.


    ```

    /catalog/prices HTTP/1.1[CRLF]

    Host: www.mysomesite.com[CRLF]

    Connection: close[CRLF]

    Accept-Encoding: gzip[CRLF]

    Accept: text/plain; text/html[CRLF]

    Accept-Language: en,en[CRLF]

    Accept-Charset: ISO-8859-1,utf-8[CRLF]

    User-Agent: Mozilla/5.0 Gecko/20041107 Firefox/1.0[CRLF]

    Referer: http://web-sniffer.net[/][CRLF]

    Content-Length: 16[CRLF]

    Content-Type: application/x-www-form-urlencoded[CRLF]

    productID=ABC123[CRLF]

    ```'
  merge: -1
