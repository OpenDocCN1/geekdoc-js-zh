  md: '# 9.2 XForms


    model element is completely independent from its presentation (user interface).


    In this example, XForms collects the data in XML format from input like the following:


    ```

    <MyData>

    <MyLevel>ud</MyLevel>

    <MyMajor>CS</MyMajor>

    </MyData>

    ```


    The submission element of the data model describes how the XForms submits the
    data. In the preceding example, the id="form1" attribute identifies the form,
    the action="myXForms.jsp" attribute defines the URL where the form is processed,
    and the method="get" attribute defines the method so that server knows how to
    respond to it.


    # 9.2.1.2 XForms User Interface


    The XForms user interface displays the data input collected by the model element
    of XForms. It focuses on the look and feel of the form. The user interface elements
    in XForms are called input controls. They are defined in the same way as ordinary
    HTML controls except that they refer to data elements defined in the model element.


    <select ref="MyData/MyLevel> tag associates the select1 control with collected
    MyLevel data, and <input ref="MyData/MyMajor> associates the input box with collected
    MyMajor data in the model element. The <submit> element has a submission="form"
    attribute that points to the <submission> element in XForms models.


    An XForms processor built into the browser will be responsible for submitting
    the XForms data to a target. The data can be submitted as an XML document:


    ```

    <MyData>

    <MyLevel>ud</MyLevel>

    <MyMajor>CS</MyMajor>

    </MyData>

    ```


    Or it can be submitted as text as follows:


    MyLevel=ud;MyMajor=CS


    XForms'' XML data definition, XHTML display, and separation of the data from its
    presentation allow it to adapt to all devices. The mobile phones and handheld
    devices such as iPhones, iPads, and cell phones all'
