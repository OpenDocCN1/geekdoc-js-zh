- img_proc: true
  md: "The following Ajax request retrieves a JSON object and puts parsed information\
    \ into the <div> with an id='json-data'. The xhrGet() function takes the JSON\
    \ format argument, which includes server url, data format handles, and a load\
    \ function (called back when the response comes back successfully.)\n\n```\n<html>\n\
    <head>\n<title>Dojo xhrGet</title>\n<!--Dojo Initialize --\n<script src='/dojo/dojo/dojo.js'\
    \ type='text/javascript'></n<script language=\"javascript\">\nnfunction getJson\
    \ () {\n  dojo.xhrGet(\n  url: \"http://server/ajaxData.txt\",\n  handleAs: 'json',\n\
    \n  // 'handleAs': 'JSON' tells Dojo to parse the data being\n// retrieved from\
    \ the URL by the eval() function and convert it to a\n//JavaScript JSON object.\n\
    \n  load: function (responseObject) {\n    dojo.byId('json-data').innerHTML =\n\
    \    responseobject.skills[0];\n  },\n  error: function (error) {\n    console.error('Error:\
    \ ', error);\n  }\n }\n}\n</script>\n</head>\n<body>\n<div id='json data'></div>\n\
    <a href='# onclick='getJson()'> Display JSON data</a>\n</body>\n</html>\n```\n\
    \nTo recap: these brief examples have given you a basic idea of why people use\
    \ Dojo and JSON for asynchronous XMLHttpRequest calls."
