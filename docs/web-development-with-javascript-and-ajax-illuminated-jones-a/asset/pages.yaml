  md: 'The newline character, the tab character, and the space character are collectively
    called the white-space characters. A sequence of white-space characters acts like
    a single space for the web browser’s data presentation. Therefore, in normal situations,
    an HTML document’s formatting is not important (it will not change its presentation
    in web browsers) as long as you do not remove white-space characters between successive
    words. As a result, the following two html elements are equivalent:


    ```

    <html>

    <body>

    <p>Sample text</p>

    </body>

    </html>

    ```


    ```

    <html><body><p>Sample text</p></html>

    ```


    If an element contains no value, the start tag and the end tag can be bined into
    one as <tagName/> (there are some special tags, like script, for which such a
    combination cannot be used). Therefore, the following two elements are equivalent:


    ```

    <p></p>

    ```


    The start tag of an element may contain one or more attributes, each in the form
    "attributeName="attributeValue". The following is a p element with two attributes:


    ```

    <p class="quotation" id="paragraph1">

    ```


    If an attribute value contains quotes, they should be the single quote, '' as
    in <p style="font: bold 24px ''Times New Roman'', serif">


    Here we use the "style" attribute to set the font to present the p element’s value:
    boldface, 24 pixels, first choice is font family "Times New Roman," and the second
    choice is font "serif".


