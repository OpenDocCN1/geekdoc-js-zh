  md: '# 8.9 Milestone 6: Buyer Page and Dojo Framework


    Pay special attention to the nice validation feature provided by Dojo. For example,
    regular expression is used for specifying the allowed text in the ZIP code textbox.
    There are two types of ZIP code: five digit and nine digit. The constraint is
    expressed using regular expression, where "d" stands for a digit and "5" denotes
    the occurrence of "d" exactly five times. So ZIP code can be captured using a
    regular expression as below:


    (\d(5)) | (\d(5))-\d(4))


    If a user uses a string that does not conform to the regular expression matcher,
    the contents of invalidMessage will be displayed to inform the user about the
    format requirement. Dojo framework automatically handles the event triggering
    and the style setting of the textbox hints. Similarly, you can set the required
    attribute of a textbox to make sure that the textbox is not empty when the page
    is submitted.


