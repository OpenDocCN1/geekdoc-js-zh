    We have chosen the Java platform for implementing the case study project because
    of the many open-source tools available. Throughout the chapter, you will use
    the following tools:


    +   - NetBeans 6.0.1

    - Sun Java System Server 9.0 (code name GlassFish)

    - Apache JavaDB (included in NetBeans)


    The version of NetBeans should be at least 6.0.1. NetBeans can be downloaded from
    the NetBeans website at http://www.netbeans.org. It is recommended to download
    the complete version of NetBeans, which includes all features (and hence GlassFish
    and JavaDB). To run NetBeans smoothly, you should have at least 1 GB of memory
    available.


    To facilitate your learning process, the source code of the case study project
    is available for download at this book''s website. There are multiple milestones
    of the project. By downloading and installing a milestone project, you can resume
    the development of the case study project from any section in the chapter.


    # 8.2 Case Study: BigPeachYardsSaleExpress


    The Big Peach is a metropolitan area with a population of more than 10 million
    people. Every day, there are hundreds of people moving and selling items in yard
    sale events. A group of yard sale hobbyists decide to build a dynamic website
    for helping yard sale organizers to publish information.'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'The website will assist buyers in better planning their weekend shopping trip.
    Designers decide to incorporate the following features in their website, which
    is named BigPeachYardSaleExpress.com:


    +   - Sellers can post information (e.g., location and date) of yard sale events.

    - Sellers can post the name, price, and thumbnail image of each item for sale.

    - Buyers can search sale events by date and distance from their home address.

    - Buyers can visually identify sale events on a map, browse items for sale, and
    lock/buy items.

    - Based on the collection of items locked in a buyer''s shopping cart, an itinerary
    (with driving directions) can be automatically generated for the buyer. The buyer
    can choose to customize the itinerary by dragging and dropping items.

    - BigPeachYardSaleExpress will rely on income from advertising. A dynamic advertisement
    banner will be placed on each page. The contents of the ad banner will be updated
    periodically (every 2 seconds). The system should allow easy inclusion of new
    banner content on the fly.

    - The user interface of BigPeachYardSaleExpress should be visually appealing.


    A comprehensive website must be established to satisfy these requirements. You
    will have to complete the following technical components:


    +   1. A background database to store sales event information. You will use an
    open-source database tool called JavaDB, with internal support from NetBeans.

    2. A web application that generates dynamic contents at the server side. There
    are many technical solutions for this purpose (e.g., PHP, cgi-bin, JSP, servlet,
    and ASP.Net). You will use Java-based technology because of its popularity and
    market share.

    3. A rich client-side user interface. In addition to the Ajax techniques, there
    are many other competing technical solutions for providing appealing visual effects
    to users, e.g., Adobe Flash and Java Applet.'
  merge: -1
