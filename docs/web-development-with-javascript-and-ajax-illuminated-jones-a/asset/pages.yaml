  md: '# 2.4 HTML Forms and HTTP Basics


    Web browsers interact with web servers with HTTP, which runs on top of TCP/IP
    network connections. The main function of HTTP is for web browsers or programs
    to download web pages or any data from web servers or to submit user data to web
    servers. HTML form elements can be used to create graphic user interfaces in web
    browsers and interact with web servers through HTTP.


    # 2.4.1 HTTP Basics


    You need to review the concept and general format of a URL. A URL is an address
    for uniquely identifying a web resource, like a particular web page, and it has
    the following general format:


    ```

    http://domain-name:port/application/resource?query-string

    ```


    where http is the protocol for accessing the resource (https and ftp are popular
    alternative protocols standing for secure HTTP and File Transfer Protocol); domain-name
    is for uniquely identifying a server computer on the Internet, like www.amazon.com;
    port is between 0 and 65535 for identifying a particular server process; application
    is a server-side folder containing all resources related to a website, a web application,
    or a web service; resource could be the name (alias or nickname) of an HTML or
    script/program file residing on a server hard disk; and the optional query string
    passes user data to the web server.


    The domain name is typically in the form of a sequence of three strings separated
    by periods, like www.amazon.com. The rightmost is one of the top-level domain
    names, among which "com" stands for companies, "edu" for education and "gov" for
    government. The string to its immediate left is one of its subdomains, typically
    representing a company or an institution. The leftmost string is an alias for
    one of the server computers in the company or institution. A server computer may
    have multiple domain names, all referring to the same server computer. For example,
    www in many URLs is optional. But each domain name must refer to no more than
    one server computer (which may be a facade or interface for a cluster of computers
    working behind the scene). The domain name could be replaced by an IP address,
    which is four decimal numbers, each between 0 and 255, separated by periods, like
    108.168.1.2. In Windows you can easily find your computer''s IP address by typing
    command ipconfig in a Command-'
