  md: '# 6.1 Dojo Toolkit


    the list of Dojo-supported XMLHttpRequest functions; they all take a property
    object (po) parameter.


    ```

    dojo.xhrGet(po)

    dojo.xhrPost(po)

    dojo.rawXhrPost(po)

    dojo.xhrPut(po)

    dojo.rawXhrPut(po)

    dojo.xhrDeleter(po)

    ```


    XMLHttpRequest takes many argument properties. You can pass in a Javascript object
    that wraps all necessary properties to the xhrget request, as shown in the example.


    Here is the list of common request property arguments:


    +   - url: String type; "path/to/myServer.php"; URL points to server endpoint.


    +   - content: Object type; {name: "value"}. These properties will be serialized
    as name=value and passed in the request.


    +   - timeout: numeric type. It waits x milliseconds for the response. If this
    amount of time passes, the error callback method is invoked.


    +   - form: dojo.byId("formId"). It extracts form content and sends it to the
    server.


    +   - handleAs: String type; "text" is default. It can be "json", "javascript",
    "xml", etc.


    +   - sync: Boolean type; default is false. It indicates whether the request should
    be synchronous or asynchronous.


    +   - headers: Object type specified in {} format. It is used to add additional
    HTTP headers in the request.


    +   - load: function(response, ioArgs){} The load function will be called on a
    successful response.


    +   - error: function(response, ioArgs){} The error function will be called in
    case of an error.


    +   - handle: function(response, ioArgs){} The handle function will be called
    in case of either success or error.


    The dojo.byId(String) function in the preceding example is used in the same way
    as document.all.id in IE or document.getElementById(id) in standard DOM. You use
    this method to locate the "put_here" division/section'
