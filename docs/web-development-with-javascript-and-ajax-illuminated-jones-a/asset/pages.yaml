    # 4.4.3 Handling Events


    In the previous section we attached the toggleStyles() JavaScript function to
    the "Toggle Styles" HTML button so that the function was called when the user
    clicked the button. The web browser generates an whenever something interesting
    happens, and you can write JavaScript code to respond to these events by registering
    event handlers. This concept is called event-driven programming. In the previous
    example, when the user clicked the "Toggle Styles" button, the browser generated
    a click event. We registered the toggleStyles() function as a handler for the
    click event when we assigned the function to the onclick attribute of the <button>
    tag. In other words, we defined an onclick event handler for the <button> tag,
