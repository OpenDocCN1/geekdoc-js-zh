  md: '# 9.3 Semantic Web


    resources at the bottom level have their unique identification with a URI. W3C
    recommendations in 2004 for following foundation specifications include Resource
    Description Framework (RDF), RDF Schema (RDFS), Web Ontology Language (OWL), Query
    (SPARQL), and Semantic Web Rule Language (SWRL).



    The basic syntax representation is in a subject, predicate, object (SPO) sentence
    statement that is noted by Resource Description Language (RDF)/ XML. Many additional
    constraints and properties of statements are described by RDFS, which is an extension
    of RDF. RDFS describes groups of resources, attributes of the resources, and relationships
    between resources. XML-based RDF and RDF together provide shareable and reusable
    syntactic interoperability for upper-semantic parsing and analysis. An ontology-community
    vocabulary for a specific domain can be built up by OWL framework, which provides
    semantic interoperability for Semantic Web applications. It describes data model
    by class, subclass, property, class operation.



    OWL makes logical reasoning and deduction on this web semantic ontology by means
    of SWRL and SPARQL.


    # 9.3.3 RDF



    Recommended by the W3C, RDF is an XML-based framework for modeling, representing,
    and integrating data resources on the Web. Each resource is described in terms
    of pairs of properties and its values in triple RDF statement formats. A URI identifies
    each triple element. The purpose of a URI is to uniquely identify a concept in
    the form of subject, predicate, or object by linking to the origin where the concept
    is defined. RDF provides infrastructure for linking distributed metadata.



    A Resource Locator (URL) is a typical URI that describes the resource access mechanism
    including the protocol type (http; ftp; mail; ...) and access address. Every web
    page has its globally unique URL. An email address is also a URL. A Uniform Resource
    Name (URN) is also a URI that specifies a unique resource in a certain domain
    space. For example, an automobile vehicle identification number, a book ISBN,
    and a student ID number within the school domain namespace are all examples of
    URLs. Any data item including subject item, predicate item, object item, class,
    and property needs to have a URI (but an object item in a SPO statement may have
    its literal value).'
