  md: '# CHAPTER 3 XML—The X In Ajax


    XSLT is an XML dialect that is declared under namespace "http://www.w3.org/1999/XSL/Transform".
    Its root element is stylesheet or transform, and its current version is 1.0. The
    following is the contents of file dvdToHTML.xsl, which can transform XML document
    dvd.xml into an HTML file.


    ```

    <?xml version="1.0" encoding="UTF-8"?>n<xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:output method="html" version="4.0"/>

    <xsl:template match="//>

    <html>

    <head>

    <title>DVD Library Listing</title>

    <link rel="stylesheet" type="text/css" href="style.css"/>

    </head>

    <body>

    <table border="1">

    <tr>

    <th>Title</th>

    <th>Format</th>

    <th>Genre</th>

    </tr>

    <xsl:for-each select="/library/dvd">

    <xsl:sort select="genre"/>

    <tr>

    <td>

    <xsl:value-of select="title"/>

    </td>

    <td>

    <xsl:value-of select="format"/>

    </td>

    <td>

    <xsl:value-of select="genre"/>

    </td>

    </tr>

    </xsl:for-each>

    </table>

    </body>

    </html>

    </xsl:template>

    </xsl:stylesheet>

    ```'
