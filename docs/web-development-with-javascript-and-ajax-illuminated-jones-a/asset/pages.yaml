    namespace. Each triple that matches the pattern will bind an actual

    value from the RDF dataset to each variable. For example, there is a binding

    of this pattern to our dataset where the object of "meat" in the stored triple

    statement is matched and bound to the food variable.


    In SPARQL all possible bindings will be found. So if a resource has multiple

    instances of a given property, then multiple bindings will be found.


    The following SPARQL query has multiple variables.

    ?subject ?predicate ?object.


    Or

    ?x y ?z


    This pattern matches all triples in an RDF dataset. The names of the vari-\ables
    make no difference.


    A few triple patterns can also be combined with algebra operations such as

    union, optional (join), and filters for restricting values to construct

    complex patterns. SPARQL provides ORDER BY, LIMIT/OFFSET,

    distINCT, and REDUCED solution modifiers to modify the query results.

    Let us look at the basic structure of our first SPARQL query.


    Assume that the RDF dataset about an animal world is as follows prefix

    m is the application namespace for animal ontology:


    ```

    (myns:carnivore myns:eats "meat"

    (myns:carnivore myns:has "claws")

    (myns:tiger) rdf:type myns:carnivore)

    (myns:tiger) rdf:avgAge "30"

    (myns:carnivore) rdf:type myns:mammal)

    (myns:mammal) myns:has "hair"

    (myns:mammal) myns:gives "milk"

    (myns:cow) rdf:type myns:mammal)

    (myns:cow) myns:avgAge "20"

    (myns:sheep) rdf:type myns:mammal)

    (myns:sheep) rdf:avgAge "10")

    ```


    Here are some simple SPARQL query examples:

    Q1: Who likes meat?'
