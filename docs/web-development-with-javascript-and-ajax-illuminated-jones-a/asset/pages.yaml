    # 2.2.3.5 Creating Hyperlinks and Anchors


    Each web page on the Internet has a URL to identify its location. A typical URL
    has the following format:


    ```

    http://domain-name/application/resource

    ```


    where domain-name is a unique name to identify a server computer on the Internet,
    like www.amazon.com; application is a server-side folder containing all resources
    related to an application or service; and resource could be the name (alias or
    nickname) of an HTML or script/program file residing on a server disk, where the
    script or program can generate an HTML file on the fly from data submitted by
    a user. The domain name could be replaced by an IP address, which is four decimal
    numbers, between 0 and 255, separated by periods, like 108.168.1.2. Fundamentally,
    all server computers are identified by their unique IP addresses, and the domain
    names are just nicknames for the IP addresses so that they will be easier to remember.
    More explanation for URLs will be provided in Section 2.4.1 on page 46.


    An HTML file can contain hyperlinks to other web pages so users can click on them
    to visit different web pages. A hyperlink has the general structure of <a ref="url">Hyperlink
    Text</a>. The web page linked by the hyperlink is the target page of the hyperlink.
    By default, a web browser will display a hyperlink''s text with an underline,
    and the hyperlink will be a different color based on whether the hyperlink has
    been visited (clicked) or whether the mouse cursor is hovering on the hyperlink.
    For example,


    ```

    <a ref="http://www.google.com/index.html">Google</a>

    ```


    is Google''s home page. Many websites define a “welcome page” so that if a user
    uses a URL for the website without the resource name, the welcome page will be
    returned. Because Google has defined "index.html" as its welcome page, the following
    hyperlink will have the same effect as the previous one:


    ```

    <a ref="http://www.google.com">Google</a>

    ```'
