    # 5.2.3.2 XML Response


    The X in acronym Ajax stands for XML, and "XML" is in the name of the client-side
    object that makes Ajax so popular, XMLHttpRequest. So, naturally, most people
    think that Ajax development must involve the use of XML. As we have already demonstrated,
    that is not true. However, XML is a versatile and well-supported choice for your
    response format. Practically all server-side languages have support for processing
    XML, and the browser will automatically parse an XML response into DOM objects
    and make the data available via XMLHttpRequest''s responseXML. Using XML, you
    have precise control over how your response looks. On the client side, you can
    use various parts of your XML response to update various parts of the HTML. For
    example, using our car search form example, when the user selects a car, the server
    could also validate the year field and respond with both a validation error message
    and a list of car models. We do not have the option to update two separate DOM
    elements when we use HTML as the response format and we set the innerHTML. Technically,
    we could parse the HTML response ourselves and use the result to update multiple
    DOM objects, but we have already seen how difficult the parsing logic is to write
    in JavaScript.


    The main drawback to using XML is that the client-side code that uses the DOM
    API to update parts of the loaded document can become verbose. You will see a
    little of that in this example, in which we will use the scenario that we just
    described. When the user selects the car make, the server will respond with both
    a validation error message for the year field and a list of associated car models.
    To accomplish this, we will need to modify the code of Listing 5.2.2 to send the
    server the selected car make and the entered year and then use the response to
    put a validation error message'
