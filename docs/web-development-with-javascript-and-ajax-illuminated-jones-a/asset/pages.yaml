    # 10.4.2 Practice Lab for PHP Web Application on Apache


    In this section, you will be given a hands-on lab on a “Hello user” Apache server
    and PHP web project. A PHP page based on an HTTP server page is populated on an
    Apache web server. If a web client accesses this page and fills in his or her
    name as <name>, the PHP page will dynamically create a response with the greeting
    statement “Hello <name>"


    After installing Apache server, you can download and install PHP by http://www.php.net/downloads.php.
    The installation manual at http://www.php.net/install.windows may be helpful.
    The binary installer is easy to use. However, if you want to use manual installation,
    you need to extract PHP 5.x to C:\php. You may choose a different location, but
    do not leave any spaces in the path (like C:\Program Files\PHP) because some servers
    will crash if you do so.


    In your PHP directory, there are two files: php.ini-dist and php.ini-recommended.
    Change one of them to php.ini (php.ini-recommended preferred).


    First, edit the php.ini file as follows:


    ```

    doc_root = C:\Program Files\Apache Software Foundation\Apache2.2\htdocs


    extension_dir = "c:\php\"

    ```


    Next, edit Apache configuration file httpd.conf. Add the following lines to it,
    and the PHP should work as a module:


    ```

    ###

    LoadModule php5_module "c:/php/php5apache2_2.dll1"

    AddType application/x-httpd-php .php

    PHPIniDir "c:/php/"

    ###

    ```


    The web page at http://www.ricocheting.com/server/php.html is a good-started tutorial.'
