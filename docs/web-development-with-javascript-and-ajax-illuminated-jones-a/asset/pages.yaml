  md: 'Font size can be specified with attribute font-size. The commonly used font-size
    values include small, medium (default), large, 12px (any font size specified in
    pixel number), and 120% (120%) of the base/inherited size, which is the font size
    used in the immediate context of this element.


    Attribute font-style can be used to specify whether the text should be in normal
    or italic style, where normal and italic are font-style''s most popular values.


    Attribute font-weight can be used to specify the darkness or boldness of the text.
    Attribute font-weight''s popular values include lighter, normal (default), bold,
    and bolder.


    The font color is specified by attribute color. The background color of text is
    specified by attribute background-color. The popular color values include blue,
    green, red, yellow, gray, magenta, lime, and white. make a web search for "HTML
    color."


    Text alignment can be specified with attribute text-align, which can take on values
    left, right, center, and justify with the same meaning as they have in word processors.


    Attribute text-indent can be used to specify the indentation of the first line
    of a paragraph, as in style rule p {text-indent: 20px}.


    The line height is the amount of space between each line, which is also referred
    to as leading. You can use attribute line-height to specify line height as a percentage
    of the base one, with popular values 100% (single spacing), 150% (1.5-line spacing),
    and 200% (double spacing).


    HTML text can be further decorated with lines or blinking effects with attribute
    text-decoration, which supports the following values: underline (under the text),
    overline (line over the text), line-through (through), blink (flashing text),
    and none (remove all inherited decoration).


    You can also control the extra spacing between successive words with attribute
    word-spacing, and extra spacing between successive letters with attribute letter-spacing.
    By default, both word-spacing and letter-spacing have a value of 0 pixels. If
    you specify positive integers, the spacing increases. If you specify negative
    integers, the spacing decreases. Usually one or two pixels in either is plenty.
    As an example, style rule p (word-spacing: 1px) increases the space between successive
    words by one.'
