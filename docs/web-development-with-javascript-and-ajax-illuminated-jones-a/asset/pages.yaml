    When the preceding string is, the following SQL statement would be constructed
    on the fly. In the WHERE clause, the l=1 makes it a tautology, then the drop table
    products destroys the named products, and finally the -- comments out the apostrophe
    to make the whole statement cor-rect in SQL syntax.


    ```

    SELECT prod_id, prod_name, prod_price FROM products

    WHERE prod_name is ''ipod'' OR 1=1; drop table products --

    ```


    Anley (2002) gave a complete examination of SQL injection attacks and its variations.
    In practice, many SQL injection attacks can be thwarted by strengthening user
    input validation. For example, when SQL statements are generated, SQL keywords
    as DROP and -- can be filtered out. Restricting the length of user input can also
    be effective. If the struct of the SQL statement is not complex, programmers should
    avoid dynamic SQL statement construction via string concatenation. Many plat-forms
    as .Net and JDBC provide a mechanism for passing dynamic values as SQL parameters.
    Many other interesting defense approaches have been proposed by researchers, e.g.,
    detecting and blocking SQL injection attack via string analysis and instrumentation
    of web application programs (Halfond and Orso, 2005), tainted data tracing (Nguyen-Tuong,
    Guarnieri, Shirley, and Evans, 2005), and SQL keyword randomization (Boyd and
    Keromytis, 2004).'
