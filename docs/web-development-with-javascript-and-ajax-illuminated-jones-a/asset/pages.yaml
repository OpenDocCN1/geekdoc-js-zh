    \ that frame by using JavaScript.\n\n# 4.4 The Document Object Model (DOM)\n\n\
    The Document Object Model (DOM) is a standard platform- and language-neutral programming\
    \ interface for building, accessing, and manipulating HTML and well-formed XML\
    \ documents. The DOM is an interface that must be implemented in an actual programming\
    \ language to be useful. The DOM has been implemented in many languages, including\
    \ JavaScript in web browsers. The W3C standardized the DOM because the first developers\
    \ to write scripts (JavaScript code) for browsers found that their scripts would\
    \ not work properly on all browsers of browser model incompatibilities. Browser\
    \ incompatibilities still exist, but the successful vendor adoption of the DOM\
