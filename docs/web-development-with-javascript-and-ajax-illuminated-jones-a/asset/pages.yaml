  md: '# 2.1 Overview


    A web browser is a graphic user interface for a user to interact with various
    web applications. A web browser communicates with the web servers that host the
    web applications over the Internet. A web browser can send requests for data or
    service. The web server will reply and send back the response data in a language
    called HTML, short for Hyper Markup Language. The web browser can then present
    the data to the user after rendering directives or defaults.


    The focus of this chapter is the introduction to the basics of hypertext markup
    languages in use now. The popular HTML version 4 is more lenient to syntax errors
    and has limited support for presenting data in various presentation devices such
    as PCs, PDAs, or cellular phones. XHTML, short for Extensible Hypertext Markup
    Language, rewrites HTML in XML (Extensible Markup Language, to be covered in Chapter
    3) for better supporting flexible presentation on different devices. At this time
    the browser support for XHTML is still limited. Any web browser that supports
    the traditional HTML version 4, and the chapter treats HTML and XHTML as synonyms.


    A typical web application has four tiers: the presentation tier on the client
    side (web browsers), the presentation tier on the web servers, business logic
    tier on the application servers, and the database tier on the database servers.
    HTML (XHTML) will be introduced for defining logical data (contents) structures,
    and Cascading Style Sheets, or CSS, will be introduced as an important mechanism
    for defining presentation styles of HTML elements. Because XHTML is a dialect
    of XML, the HTML introduction in this chapter also serves as the first-iteration
    introduction to XML discussed in the following chapter.


    Web browsers and web servers communicate through a simple application protocol
    named HTTP, short for Hypertext Transfer Protocol, on top of the TCP/IP network
    transportation layer. This chapter will explain HTTP basics and how HTML forms
    can be used as the main mechanism for submitting user data to a web server application.'
