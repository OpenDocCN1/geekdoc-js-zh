    # 9.3.6 Query Semantic Web with SPARQL Query Language


    The RDF Query Language (SPARQL) based on the SPARQL protocol is a query language
    that provides a tool for web applications to work on RDF ontology. SPARQL allows
    you to match patterns in an RDF graph by using triple patterns, which are like
    triples except that they may contain variable placeholders. The variables are
    used as wildcard RDF terms in the dataset. The Semantic Web provides ontology
    for any web application to retrieve global information or domain-oriented information
    that the regular search engine cannot support because the current Web is not semantic
    and current search engines do not support the semantic reasoning mechanism.

    The OWL SELECT query statement is used to extract data from an RDF graph, returning
    it as a table of results.


    A triple pattern can include variables. Any or all of the subject, predicate,
    and object values in a triple pattern may be matched by a variable. Variables
    are used to indicate data items of interest that will be returned by a query.'
