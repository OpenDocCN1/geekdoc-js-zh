    \ this refers to the button, not myObject!\ndocument.getElementsByTagName(\"button\"\
    )[0].onclick = myObject.myHandler;\n```\n\n# 4.4.3.1 DOM Level 2 Event Handling\n\
    \nDOM Level 0 event handling is convenient and easy to use, but it is limiting.\
    \ For example, you cannot register more than one handler for the same event. In\
    \ DOM Level 2, the W3C defined a significantly more advanced event model to overcome\
    \ these limitations. The foundation of DOM Level 2 event handling is propagation.\
    \ In the DOM Level 0 model, the event is dispatched only to the element on which\
    \ the event occurred. In DOM Level 2, the event is propagated through three phases.\
    \ In phase one, called the capturing phase, the event is propagated from the top\
    \ of the DOM tree to the element on which the event occurred, called the target\
    \ node. If any ancestors of the target node have a registered listener"
