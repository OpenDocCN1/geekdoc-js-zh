  md: '# 5.2 XMLHttpRequest


    tent expected by the tag to avoid generating an error, like an image or style
    sheet, but the content can be unused, hidden, or insignificant that it does not
    noticeably change the page (like a transparent 1 × 1 pixel image). If you cannot
    use the response content type, you can also have the server set a cookie in the
    response with information you need.¹


    One of the most popular techniques (used by Google Maps) is to use an <iframe>
    or <frame> tag that is hidden using CSS. Encode information to send to the server
    in a URL and set that URL in the frame''s src attribute. The server responds with
    a full HTML page, which can contain much information for you to use on the main
    visible page, including scripts that perform some task. Using the <script> tag
    is also popular because the response, being JavaScript, is automatically executed
    by the browser. Dynamically creating <script> tags for web remotely is commonly
    called On-Demand JavaScript. This approach is used in some JavaScript toolkits
    for lazily loading scripts²


    Although these techniques use HTML tags (also called remote scripting) are often
    useful, they are, strictly speaking, a misuse of their intended design and can
    therefore sometimes be complicated to get properly and uniformly across browsers.
    Fortunately, another technique exists that was designed with Web Remoting in mind.
    The XMLHttpRequest object provides full support for making asynchronous HTTP requests,
    including HEAD, POST, and GET, and, despite its name, handle responses in plain
    text, XML, or HTML. XMLHttpRequest and a few of the alternative techniques are
    discussed in more detail in the rest of this chapter.


    # 5.2 XMLHttpRequest


    The real driver behind Ajax fame is the XMLHttpRequest object. XMLHttpRequest
    allows making background asynchronous requests to the server and receiving responses.
    This allows the web application to process the user''s input and respond with
    data from the server without having to make the user wait for an entire page to
    load. Proper use of XMLHttpRequest makes web applications feel much more responsive
    than traditional


    > ¹http://www.ashleyit.com/rs/ralite.


    > ²http://ajaxpatterns.org/On-Demand.Javascript.'
