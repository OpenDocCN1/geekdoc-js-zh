  md: '# 4.4 The Document Object Model (DOM)


    # TABLE 4.4.1 HTML 4 Events


    | Event Handler | HTML Tag | Trigger |

    |--- | --- | --- |

    | onblur | <button>, <input>, <select>, <textarea>, <body> | The element loses
    the input focus, which is typically caused by the user clicking on another element
    or tabbing to another element. |

    | onchange | <input>, <select>, <textarea> | The element loses focus and its value
    has changed since it gained focus. |

    | onclick | Most47 | The user clicks on the element (mouse press and release,
    or keyboard equivalent). |

    | onblblclick | Most47 | The user double-clicks on the element. |

    | onfocus | <button>, <input>, <label>, <textarea>, <body> | The element gained
    the input focus. |

    | onkeydown | Form elements and <body> | The user pressed down a keyboard key.
    |

    | onkeypress | Form elements and <body> | The user pressed and released a keyboard
    key. |

    | onkeyup | Form elements and <body> | The user released a keyboard key. |

    | onload | <frameset>, <img> | The document finished downloading to the browser.
    |

    | onmousedown | Most47 | The user pressed down a mouse button. |

    | onmousemove | Most47 | The user moved the mouse. |

    | onmouseout | Most47 | The user moved the mouse off the element. |

    | mouseover | Most47 | The user moved the mouse over the element. |

    | onmouseup | Most47 | The user released a mouse button. |

