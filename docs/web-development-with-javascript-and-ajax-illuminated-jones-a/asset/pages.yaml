    immediately after the user leaves the field instead of waiting until a car was
    selected. To accomplish this, we could add an onChange event handler to the field
    that sent the entered year to the server to get validated. All that the server
    would need to send back is a pass message or a fail message. The pass message
    could be as simple as "OK".


    The fail message could be as simple as "*Must be a 4-digit year".


    That is it. No HTML or XML. We could add an empty <span> tag beside the year field
    that we stuff the fail message when it comes back. The <span> tag just displays
