  md: '# 4.1.3.3 Number


    Number represents the set of values defined by the double-precision 64-bit format
    of the IEEE 754 standard and the special NaN (“Not a Number”) and Infinity (positive
    and negative) values. This means that JavaScript can represent numbers as large
    as ±1.7976931348262157 × 10³⁰⁸ and as small as ±5 × 10<sup>³²⁴</sup>. Unlike C++
    and Java, this single datatype encompasses both integer and floating-point values.
    JavaScript will exactly represent integers between −9007192254740991 (−<sup>⁵³</sup>)
    and 9007192254740991 (2<sup>⁵³</sup>), inclusive—beyond you may lose precision.
    However, certain integer operations, like the bitwise operators, are performed
    on 32-bit integers, which range from −2147483648 (−2³¹</sup>) to 2147483647 (2<sup>³¹</sup>−1).


    The ECMAScript standard defines support for hexadecimal (base 16) number values
    with “0x” or “0X” and follow with a combination of 0 through 9 and a through f,
    case insensitive. For example, 01F is 31 in base 10 (1 × 16 + 15 = 31).


    Although not defined by the ECMAScript standard, some implementations of JavaScript
    have support for octal (base 8) number values begin with a 0 followed by digits
    between 0 and 7. For example, 037 is 31 in base 8 (3 × 8 + 7 = 31). Writing an
    integer in JavaScript with a leading zero is bad practice because only some implementations
    support octal values and do not.


    JavaScript also supports exponential notation. For example, 5.43e12 = 5.43 × 10¹²</sup>
    and 5.43E-12 = 5.43 × 10⁻¹²</sup>—“e” is case insensitive.


    JavaScript has a few special numeric values. Infinity is a special value you get
    when a number is larger than the largest representable number. There is also −Infinity
    for the negative end of the spectrum. NaN is returned by a mathematical operation
    that returns an undefined result (such as 0 divided by 0) or an error. NaN does
    not compare to any value, but JavaScript has a global function, isNaN(), for testing
    value. A related function, isFinite(), tests whether a number is not positive
    or negative Infinity. The primitive type Number has an associated Number object
    that contains properties for the largest and smallest representable numbers, NaN,
    and positive and negative Infinity, as well as some conversion methods.⁸ Also,
    JavaScript provides the Math


    > ⁸https://developer.mozilla.org/en/docs/Core_JavaScript/1.5_Reference:Global_Objects:Number.'
