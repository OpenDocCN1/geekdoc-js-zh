- md: "\n![](img/b1806dfc7ab8e46f442d54c1e56b9394_75_0.png)\n\nFigure 4.1. Two-week\
    \ Sprint Cycle\n\nThis diagram represents a two-week cycle for a typical web or\
    \ mobile development sprint. Each smaller circle represents a single workday,\
    \ and the rituals are marked out assuming that the sprint starts at the top and\
    \ loops around every two weeks. \n\nIn the next few pages, we're going to do a\
    \ deep dive into each of these rituals, making sure you understand how they work,\
    \ and how they can be applied to web and mobile development.\n\n55\n\nScrum Rituals\n\
    \n**WOW! eBook**\n\n**www.wowebook.org**\n\n## Sprint Planning\n\nThe ritual that\
    \ marks the beginning of each sprint is called sprint planning. Sprint planning\
    \ is hosted by the scrum master, but the person responsible for most of the content\
    \ that goes into a sprint planning is the product owner.\n\n![](img/b1806dfc7ab8e46f442d54c1e56b9394_76_0.png)\n\
    \nFigure 4.2. Sprint Planning\n\n### Objective\n\nThe purpose of the sprint planning\
    \ is to set the agenda for the upcoming sprint. The team gets together with the\
    \ product owner and the scrum master to get an introduction to the stories that\
    \ should be completed during the next sprint. \n\nThe product owner shows how\
    \ the stories fit into the vision for the product, and the team estimates the\
    \ stories the product owner has introduced and commits to completing as many as\
    \ they believe they're capable of, given their historical velocity—which is determined\
    \ by the number of points they've been able to complete in an average sprint.\
    \ At the end of the sprint planning there should be a commitment to a certain\
    \ set of stories that everyone can agree on. The stories should all be clear,\
    \ and the amount of work they represent should be within the capacity of the team\
    \ to complete during the next sprint.\n\nScrum: Novice to Ninja\n\n56\n\n**WOW!\
    \ eBook**\n\n**www.wowebook.org**\n\n### Time Box\n\nDepending on the number of\
    \ weeks a team has committed to for each sprint, the sprint planning may take\
    \ several hours, or it may take an entire day. For a two-week sprint, a team may\
    \ find that setting aside three or four hours is a good investment for a sprint\
    \ planning. That might seem like a lot of time, but sprint planning done right\
    \ is very detailed and explicit about what the team needs to produce. A key value\
    \ of scrum is the communication it facilitates. Sprint planning exemplifies this.\
    \ Most teams will find they're able to accomplish the objectives of these rituals\
    \ more efficiently as they get more familiar with the process. Having a strong\
    \ scrum master who maintains a clear time box around the different aspects of\
    \ the ritual can help make the process go as smoothly as possible. \n\nBut there's\
    \ a lot to get done during the sprint planning, and these rituals need to be given\
    \ adequate room to accommodate all the issues that will come to the surface. Starting\
    \ with clear time constraints gives everyone confidence that there's a goal and\
    \ an end point in mind, and also helps keep people focused.\n\n### Preparation\n\
    \nIn preparation for this ritual, the product owner will have been working with\
    \ designers, customers, various team members, and the scrum master to create a\
    \ backlog of clear and specific stories that have the highest priority for the\
    \ product. It's the responsibility of the product owner to make sure each of these\
    \ stories is ready to be worked on, and phrased in such a way that any team member\
    \ can read and understand each story's description and acceptance criteria.\n\n\
    ### Introducing New Stories\n\nSprint planning provides the opportunity for the\
    \ scrum team to get an introduction to the stories the product owner wants them\
    \ to work on for the next iteration of the product. During this part of the ritual,\
    \ the product owner goes over the stories that have been prepared, presenting\
    \ them to the team for evaluation. \n\nIt's important for every member of the\
    \ team to participate actively during this presentation, because this is their\
    \ opportunity to question and challenge the completeness and appropriateness of\
    \ each story. A good product owner will have discussed the stories with experts\
    \ on the team before this ritual, to make sure that predictable objections have\
    \ been addressed.\n\n57\n\nScrum Rituals\n\n**WOW! eBook**\n\n**www.wowebook.org**\n\
    \nSprint planning encourages active discussion around each story. The process\
    \ opens up a dialogue, allowing the product owner and the team to consider the\
    \ ramifications and feasibility of each story in detail. Although the product\
    \ owner is authorized to set the priority of the stories on the sprint backlog,\
    \ the team has the authority to reject stories that it considers impossible, inadequately\
    \ defined, or technically inappropriate before they're added to the sprint backlog.\n\
    \nThis part of the sprint planning ritual is also when the team has the responsibility\
    \ to present stories that relate to the code itself. If the product owner is responsible\
    \ for the vision of the product, the development team is responsible for the quality\
    \ and maintainability of the code. The product-oriented focus of scrum is not\
    \ an excuse to ignore technical debt.\n\nOften the team will introduce stories\
    \ around refactoring code, updating code to meet new standards, or making crucial\
    \ upgrades to the infrastructure. It's important for the team to make a strong\
    \ case, because the product owner has ultimate authority. Different teams resolve\
    \ this balance of power in different ways, and it's up to each team to figure\
    \ out how best to address technical debt.\n\n### Story Estimation\n\nThe next\
    \ phase of sprint planning is **story estimation**. During this process, the team\
    \ will estimate the relative level of effort required, based on the team's experience\
    \ with similar stories. The important thing to keep in mind when estimating is\
    \ that the values are arbitrary and bear no resemblance to actual time. There\
    \ are many ways that teams estimate. The goal of estimating is for the team to\
    \ get a sense of how many points they can accomplish within the single sprint.\n\
    \nMost teams use a system of points. A smaller, easy story may be estimated at\
    \ one point, while a large or complex story may be assigned 20. Many teams use\
    \ a modified Fibonacci scale, with the numbers 0, 1, 2, 3, 5, 8, 13, 20 representing\
    \ increasing levels of effort.\n\nScrum: Novice to Ninja\n\n58\n\n**WOW! eBook**\n\
    \n**www.wowebook.org**\n\n### Everyone Should Agree\n\nIt's important for everybody\
    \ on the team to agree to the point estimate for a story, regardless of whether\
    \ every member of the team will be working on that particular story. This is part\
    \ of the transparency of scrum. Everyone on the team should be able to understand\
    \ every story well enough to estimate its relative level of effort.\n\nOther systems\
    \ for sizing stories include T-shirt sizing—such as small, medium, large, extra-large.\
    \ It's completely up to the team what system they choose. Once the team has chosen\
    \ a system, they should try to stick with it for several sprints, so that they\
    \ can start to get a sense, over time, of what their velocity is.\n\n![](img/b1806dfc7ab8e46f442d54c1e56b9394_79_0.png)\
    \ ![](img/b1806dfc7ab8e46f442d54c1e56b9394_79_1.png)\n\n### Bugs\n\nOther stories\
    \ that are usually not assigned points are bugs. A **bug** has a specific definition\
    \ in scrum, and it has nothing to do with unexpected or unwanted behavior in an\
    \ existing product. Bugs in scrum are missed requirements for stories that are\
    \ still in progress, or that have already been accepted as done in a prior sprint.\n\
    \nIf the team has completed a story, and it was accepted, and the points were\
    \ included in the total for a sprint, but it later turns out the story was not\
    \ completed correctly, no points are assigned for fixing the bugs to bring the\
    \ story to a done state. Bug work does take away from the team's velocity, because\
    \ it addresses points that were included in the velocity calculation inappropriately.\n\
    \n59\n\nScrum Rituals\n\n**WOW! eBook**\n\n**www.wowebook.org**\n"
