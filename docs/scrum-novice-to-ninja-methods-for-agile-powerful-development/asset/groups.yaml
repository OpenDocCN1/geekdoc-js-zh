- md: "\n**Time Box**\n\nThe time allocated for sprint planning is contingent on the\
    \ number of stories completed during the sprint, and the level of intricacy associated\
    \ with the acceptance criteria. Most teams allocate half a day for the sprint\
    \ demo if they're using a two-week sprint. Once the team has decided how long\
    \ they want to devote to the demo, the scrum master should be responsible for\
    \ making sure that everything that needs to happen fits within that time box.\n\
    \n![](img/b1806dfc7ab8e46f442d54c1e56b9394_88_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_88_1.png)\n\
    \n**Scheduling Demos and Retrospectives Together**\n\nFrequently teams will schedule\
    \ a sprint retrospective (which we'll be covering shortly) on the same day as\
    \ a demo. The advantage of scheduling these two rituals on the same day is that\
    \ the interruption in productivity associated with the rituals is minimized. The\
    \ disadvantage for the team is that these days produce primarily scrum artifacts,\
    \ as opposed to tangible product development. That tradeoff needs to be considered,\
    \ and different teams will have different preferences.\n\n**Preparation**\n\n\
    The sprint demo is the opportunity for the team to show off all of the work they've\
    \ been doing, and demonstrate that all of the stories they've been working on\
    \ are done and ready to include in the product (assuming they haven't been already).\
    \ The demo covers all the work back to the beginning of the sprint that has taken\
    \ a story to the team's definition of done, whether or not that work has been\
    \ released. Each person who has worked on any stories that are ready to demo needs\
    \ to be prepared to explain what they did with those stories.\n\nOften the engineers\
    \ will get together with the product owner before the demo to make sure everybody\
    \ is aware of what's going to be presented. This can be a useful last step before\
    \ the demo, because it ensures the stories presented meet all of the acceptance\
    \ criteria. It also reminds the engineers to make any preparations necessary to\
    \ allow unreleased stories to be demonstrated.\n\nThe scrum master should meet\
    \ with all engineers who have stories completed, to make sure these stories are\
    \ prepared for the demo. It's the responsibility of the scrum master to run the\
    \ ritual, and see to it that everything that needs to be demonstrated can be presented\
    \ within the time box allocated. The scrum master's agenda for the ritual should\
    \ include a list of all the stories to be demonstrated, as well as the people\
    \ responsible for each of the stories.\n\n![](img/b1806dfc7ab8e46f442d54c1e56b9394_89_0.png)\
    \ ![](img/b1806dfc7ab8e46f442d54c1e56b9394_89_1.png)\n\n**Let the Product Owner\
    \ Drive the Demo**\n\nWhile some teams let the engineers demonstrate the stories,\
    \ a good practice is to have the product owner participate, testing the product\
    \ live. The engineer who was developing a new feature knows the happy path for\
    \ the code that will always work. But a product owner will be looking for edge\
    \ cases, and is aware of the acceptance criteria that are most important. Having\
    \ the engineer set up the demo, and the product owner present, keeps everybody\
    \ engaged and ensures that the stories are done to the satisfaction of the product\
    \ owner.\n\n**Demonstrating a Story**\n\nThe process of demonstrating each story\
    \ should be consistent. The scrum master should go through each story on the list,\
    \ and have the engineers set up the demo for the team. Many teams choose to do\
    \ this using a projector in a conference room, although it's possible to do this\
    \ by gathering around a large monitor, or even through remote conferencing services,\
    \ depending on the nature of the story and the preferences of the team.\n\nAt\
    \ this point in the sprint, the description of the story will be familiar to most\
    \ of the people in the room, but the product owner should read the story—as well\
    \ as any major acceptance criteria—to the team while the demo is being set up.\
    \ That way, everybody will know what to look for, and will be aware of issues\
    \ that might come up.\n\nOnce the story is set up and ready to demo, the state\
    \ of the product is the main focus of attention. Each story should be a complete\
    \ slice of functionality added to the product, and the demo should show that slice\
    \ of functionality in context with the actual product. The demo should walk through\
    \ each of the acceptance criteria, proving that they have been met.\n\nSometimes\
    \ during a demo, it's realized that the acceptance criteria as they were originally\
    \ written were inadequate, and may not have covered all the cases the product\
    \ owner needed addressed. If this happens, keep in mind that a demo that meets\
    \ all of the acceptance criteria—as they were specified in a story that was estimated\
    \ at the sprint planning—should be considered accepted and done. Any further changes\
    \ that may be needed are new stories. The product owner in this situation should\
    \ be prepared to create new stories for a future sprint that relate to the additional\
    \ acceptance criteria that weren't addressed in the original story.\n\n![](img/b1806dfc7ab8e46f442d54c1e56b9394_90_0.png)\
    \ ![](img/b1806dfc7ab8e46f442d54c1e56b9394_90_1.png)\n\n**Don't Go Into Detail\
    \ About Issues**\n\nWhile it may be tempting to go into detail about issues encountered\
    \ during the demo, it's often better to note them and discuss them later in a\
    \ follow-up meeting. This keeps the demo on track and respects the time of everyone\
    \ involved. If a critical issue arises that needs immediate attention, the scrum\
    \ master should decide whether to address it then or flag it for later discussion.\n\
    \n**Tallying up Points**\n\nAt the end of the sprint, the team should tally up\
    \ the points for all stories completed. This helps the team understand their velocity\
    \ and plan for future sprints. The scrum master should ensure that the points\
    \ are accurately captured and reflected in the tracking tools.\n\n**Releasing\
    \ the Stories**\n\nReleasing is the process that takes completed features and\
    \ integrates them into the live product, either so users can access them immediately\
    \ or so they can be evaluated for inclusion in a future release. Web and mobile\
    \ teams have many options when it comes to releasing. \n\nWhen a team has chosen\
    \ to do continuous integration, it's important that the engineers working on a\
    \ story not abandon that story until it has been released, and demonstrated not\
    \ to introduce any problems in the live product. While this can result in some\
    \ downtime for engineers, that time can sometimes be applied to stories related\
    \ to maintaining and improving the code base.\n\n**Continuous integration** is\
    \ an approach that supports releasing stories as they're completed, rather than\
    \ waiting for the end of the sprint. This usually depends on a robust test suite\
    \ and an orchestrated set of release scripts. For teams doing continuous integration,\
    \ the release of the stories into the live product will already have been done\
    \ as part of completion of the stories, and no further steps will be needed after\
    \ the demo.\n\nFor teams not doing continuous integration, there will be another\
    \ task needed to release all the stories from the sprint into production. The\
    \ tasks associated with the release process are usually considered part of the\
    \ definition of done for a story, but in this case they may need to be completed\
    \ after the demo.\n\nSome teams regularly schedule releases at the start of each\
    \ sprint. Others do releases more frequently, or may release only at certain times\
    \ of the year, or on a schedule to coordinate with certain events related to the\
    \ needs of the larger organization or the marketplace.\n"
