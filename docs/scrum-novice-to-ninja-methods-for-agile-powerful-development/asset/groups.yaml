    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_48_0.png)


    Figure 3.1. All roles are equal in scrum


    Although the title may sound imposing, the scrum master has no authority other
    than the leadership demonstrated in the role of servant leader for the scrum process.
    The product owner has no authority other than maintaining the vision of the product
    and shepherding it through the scrum process. And the team has no authority other
    than the power to estimate, accept, reject, commit to, work on, and complete stories.
    And everyone should be empowered to enforce these roles to preserve an agile work
    environment.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_48_1.png] ![](img/b1806dfc7ab8e46f442d54c1e56b9394_48_2.png)


    ### A servant leader?


    The term **servant leader** is often used when discussing the delicately balanced
    position a scrum master occupies. The scrum master has no formal authority over
    anything other than the rituals and artifacts of scrum, but leads the team from
    within by embracing and evangelizing the concepts of scrum. A scrum master serves
    the needs of the entire team—helping to eliminate **blockers** (impediments to
    the scrum workflow) and coaching people about how to follow the practices of scrum—and
    should lead by example when advocating for and defending scrum.


    Scrum: Novice to Ninja

    28


    **WOW! eBook**

    **www.wowebook.org**


    ## Scrum Roles and Organizational Roles


    The roles of scrum are independent of the formal job titles that may be assigned
    and managed as part of the hierarchy of a company. For some teams, this can cause
    confusion over how the people who aren''t part of the formal agile process fit
    into the process. Nobody outside the scrum team really needs to understand scrum
    for it to work. But an important part of scrum is transparency, and the activities
    of a scrum team may draw outside attention.


    In this chapter, we''ll go over the critical roles of scrum master, product owner,
    and team member. In addition, we''ll discuss the motivations and perspectives
    of many people outside the scrum team whose involvement may have an effect on
    how well scrum works, and may ultimately be the key to advocating for and maintaining
    scrum in an organization.


    ## Scrum Master


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_49_0.png)


    Figure 3.2. The role of the scrum master


    A **scrum master** is the glue that ties a scrum team together. Scrum masters
    are responsible for keeping people clear on their roles, managing the rituals
    and artifacts of scrum (which we''ll be getting to shortly), and coaching people
    within the team and across the organization to help overcome blockers and maintain
    a sustainable productive pace.


    Scrum Roles

    29


    **WOW! eBook**

    **www.wowebook.org**


    Unlike project managers, a scrum master comes with a clearly defined mission as
    a servant leader to the team. A scrum master has no formal authority within an
    organization, other than the authority to shepherd the team through the rituals
    of scrum, and maintain the artifacts that track the team''s progress. But the
    scrum master has ultimate authority when it comes to the scrum process and how
    it''s being applied.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_0.png] ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_1.png)


    ### The Scrum Master''s Involvement


    The scrum master may be a part of the development team, but just as often a scrum
    master may have no involvement in the day-to-day development work of the team.
    For teams who have been following scrum practices for a while, and who are comfortable
    with scrum, a single scrum master with no development duties may be able to take
    responsibility simultaneously for two teams.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_2.png] ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_1.png)


    ### The Scrum Master''s Responsibilities


    A scrum master is usually part of the Engineering department, and in some cases
    may be a member of the development team. It''s a conflict of interest for a scrum
    master to be the manager of the people on a development team. A scrum master should
    have no formal organizational authority over the team, otherwise the team may
    feel inhibited about raising issues with the scrum master because of the potential
    ramifications.


    #### Responsibilities


    There are a few critical rituals that a scrum master must observe. At minimum,
    these include the daily standup, the sprint planning meeting, the end-of-sprint
    demo, and the sprint retrospective. We''ll be going into more detail about these
    rituals soon.


    In addition to hosting the rituals of scrum, a scrum master is responsible for
    coaching people about how to follow the practices of scrum—and should lead by
    example when advocating for and defending scrum. This may involve helping the
    team with roles and expectations in a way that is understandable. In that sense,
    a scrum master can become the team''s advocate, counselor, and liaison to the
    organization.


    Scrum: Novice to Ninja

    30


    **WOW! eBook**

    **www.wowebook.org**


    Scrum masters also maintain a number of artifacts that help the team stay focused.
    These are always maintained in a state that allows anyone to see at a glance what
    the team is working on, to support the essential transparency that keeps scrum
    working. This includes calculating and reporting on team metrics such as velocity,
    and clarifying the relevance of these concepts to people outside the team.


    ### A Day in the Life


    One ritual that every scrum master will try to host on a daily basis is the fifteen
    minute standup with the entire team, and any guests who care to observe. For some
    teams, this will happen early in the day, while other teams prefer to do it later.
    So, their activities include:


    - planning and hosting the rituals of scrum, including the daily standup, the
    sprint planning meeting, the sprint demo, and the sprint retrospective

    - soliciting help from team members, product owners, or anyone in the organization
    who can help remove blockers

    - maintaining the artifacts of scrum and making sure everyone has access to them

    - coaching team members about their roles and responsibilities

    - working with the product owner to help clarify stories for the backlog

    - representing the needs of scrum to management and across the organization


    On days when other rituals are scheduled, such as the sprint planning meeting,
    the sprint demo, or the sprint retrospective, the scrum master leads the process,
    making sure all the steps the team has agreed to are followed, and that the time
    constraints are honored.


    Scrum masters will likely be involved in a number of follow-up discussions at
    the end of the standup. The most important ones will involve removing blockers
    from team members who cannot move forward. Scrum masters will also meet with constituents
    such as product owners and team members to follow up on any other issues that
    were raised during the standup.


    Scrum masters also play a key role in supporting the scrum responsibilities of
    every member of the team. A scrum master needs to be available to coach the team
    when issues arise, and to recognize these issues when they manifest. This can
    mean helping the product owner figure out how to phrase a story for the backlog,
    observing and participating in a pairing session with developers to facilitate
    the process, or preparing reports on the team''s status in plain language—for
    the sake of people who aren''t on the team but who need to understand what''s
    happening.

