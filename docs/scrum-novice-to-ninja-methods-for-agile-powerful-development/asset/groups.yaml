    关于一个提议的故事（story）是否准备好可以开发。如果根据验收标准，故事无法满足“完成定义”（definition of done），那么拥有一份公布的完成定义可以帮助团队明确这一点。通常，完成定义包含许多众熟知的预期。例如，代码应该是完整的，构建不应失败，测试套件不应损坏，且产品应按预期运行。完成定义中经常包含的其他点还包括代码同行评审、编写新的单元测试、代码注释以及更新产品文档。不同的团队会有不同的需求，而创建完成定义的练习对于帮助团队实现对于每个故事（而不仅仅是某些故事）什么是重要的是非常有价值的。


    ## **完成定义必须是实用的**


    虽然完成定义的的详尽性很重要，但确保其具有实用性同样重要。完成定义对于每一个故事来说必须是可实现的。团队可能认为为了代码库应该遵循某些实践，但在考虑到市场限制的情况下，这些实践是不切实际的。通常，工程师会主张更详尽的范围，而产品所有者可能会主张更精简的方法，这取决于产品所有者的远见和市场的稳定性。每个团队都要在开始工作之前阐述自己的理由，并制定出一个大家都能同意的完成定义。


    ## **速率图**


    图 5.6 速率图


    **速率 (Velocity)** 是 Scrum 团队衡量他们在典型冲刺（sprint）中可以完成的工作量的方法。速率是根据历史衡量的，从一个冲刺到下一个冲刺。通过跟踪团队根据自己的完成定义可以完成的故事点，他们可以建立起可靠且可预测的感，即根据相对点值判断完成新故事需要多久。


    跟踪速率是 Scrum 导师（scrum master）的责任。在每个冲刺演示（demo）结束时，Scrum 导师应该计算在该冲刺期间被接受完成的故事的估算分数。这个数字应该作为一个数据点添加到该冲刺的速率图上。速率图开始往往会在非常高的数字和很低的数字之间波动，因为团队正在学习在一个冲刺中能做多少工作，以及如何估算故事。团队合作的时间越长，他们相对一致地估算故事的能力就越强。这种技能让团队对单次冲刺可以完成多少个故事、多少分有了更好的把握。随着时间的推移，如果团队的组成保持不变，起初非常不稳定的速率图将开始趋于一个一致的值。


    与业务环境中的许多图表不同，速率图的意义不在看到持续的增长，而是看到数值收在一个一致的水平线周围。那条线代表了团队在单次冲刺中现实且可持续地完成的工作量。


    ## **速率是估算工具，而不是 KPI**


    Scrum 之外的人可能对速率图的性质感到困惑。从管理的角度来看，人们可能倾向于支持团队工作量的增加，并希望速率随时间增长。但速率图旨在趋向一个水平平均值。你可能会听到高管谈论试图增加团队的速率，或者庆祝某个速率高于典型冲刺的冲刺。通过提醒大家速率跟踪的目的是提高团队持续且可靠地估算他们可以完成多少工作的能力，来先于这些对话。一个随时间推移显示持续增加（或减少）的速率图通常反映了流程中的问题。


    ## **燃尽图**


    图 5.7 燃尽图


    **燃尽图 (burndown chart)** 显示了团队向完成他们在单次冲刺内同意完成的所有点数的进度。该图表从团队为该冲刺承担的总点数开始，并按天跟踪其中已完成并准备好进行冲刺演示的点数。


    燃尽图通常由 Scrum 导师维护，可能会每天更新，也许在每日站会（daily stand up）之后，或者如果是团队用于维护 Scrum 板的工具自动生成的，则持续更新。燃尽图的主要受众是团队本身，尽管燃尽图上可能存在对
    Scrum 团队之外的人相关的数据点。


    典型的燃尽图从从左上角到右下角的直线对角线开始，显示出冲刺的“理想”燃尽率。在实践中，重点不在于匹配那个理想状态，而是记住在任何时间点冲刺还多少，以及团队预计在冲刺的任何特定一天投入多少精力到产品开发中。


    燃尽图上的线条或列状图可能用于表示冲刺中每天实际剩余的努力点数，从团队承诺到冲刺的点数开始。随着工作的完成，这些列状图应该变得越来越短。有些团队还选择跟踪每日工作，无论是以故事点还是单个任务的形式。这可以通过线条或堆叠列状图来实现。某天的列高度比前一天高几乎没有正当理由。如果在冲刺结束前发现了
    Bug，并且一个被标记为完成的故事需要重新处理，列的大小可能会从一天到第二天增加。


    **警惕范围蔓延**


    每个人都尊重冲刺待办列表（sprint backlog）的范围。如果在冲刺开始后经常添加新故事，反映某一天冲刺剩余工作量的列可能会高于前一天的水平。这种模式有时用对比色表示，以强调最初商定的范围可能正在上升的事实。如果这种情况频繁发生，可能反映了在冲刺回顾（sprint
    retrospective）中值得解决的问题。


    ## **产品增量**


    图 5.8 产品增量


    Scrum 的最终产物是冲刺结束时存在的实际**产品增量 (product increment)**，包含了该冲刺中所有符合完成定义的故事。在每个冲刺结束时，已完成的功能应该被添加到产品中以供冲刺演示。到那时，产品本身就是
    Scrum 流程的产物。

    '
