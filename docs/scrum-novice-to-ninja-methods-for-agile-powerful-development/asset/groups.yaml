    图 4.1. 两周冲刺周期


    此图表展示了典型的 Web 或移动端开发冲刺的两个周周期。每个较小的圆代表一个工作日，仪式的标记是基于冲刺从顶部开始并每两周循环一次的。


    在接下来的几页中，我们将深入探讨这些每一个仪式，确保你理解它们是如何运作的，以及它们如何应用于 Web 和移动端开发。


    55


    Scrum 仪式


    **WOW! eBook**


    **www.wowebook.org**


    ## 冲刺计划 (Sprint Planning)


    标记每个冲刺开始的仪式被称为冲刺计划。冲刺计划由 Scrum Master（Scrum Master）主持，但负责冲刺计划中大部分内容的人是产品所有者（Product
    Owner）。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_76_0.png)


    图 4.2. 冲刺计划


    ### 目标


    冲刺计划的目的是为即将进行的冲刺设定议程。团队与产品所有者和 Scrum Master 聚在一起，了解在下次冲刺期间应该完成的用户故事（Stories）。


    产品所有者展示了这些故事如何契合产品的愿景，团队对产品所有者引入的故事进行估算，并根据他们的历史速率（Velocity）承诺完成尽可能他们认为自己能够胜任的量——这种速率是根据他们在平均每次冲刺中能够完成的点数决定的。在冲刺计划结束时，应该对一组所有人都能认同的特定故事做出承诺。所有故事都应该是清晰的，且它们代表的工作量应该在团队在下一次冲刺期间完成的容量范围内。


    Scrum：从新手到忍者 (Scrum: Novice to Ninja)


    56


    **WOW! eBook**


    **www.wowebook.org**


    ### 时间盒 (Time Box)


    根据团队为每个冲刺承诺的周数，冲刺计划可能需要几个小时，也可能需要一整天。对于为期两的冲刺，团队可能会发现留出三到四小时进行冲刺计划是一项很好的投资。这看起来可能是很多时间，但如果执行得当，冲刺计划对于团队需要产的内容是非常详细且明确的。Scrum
    的核心价值之一是它促进了沟通。冲刺计划体现了这一点。大多数团队会发现，随着对流程越来越熟悉，他们能够更高效地完成这些仪式的目标。一个强大的 Scrum Master
    能够在仪式的不同方面维持清晰的时间盒，这可以帮助过程尽可能顺利地进行。


    但在冲刺计划期间有很多工作要做，这些仪式需要被足够的空间来容纳所有浮现出的问题。从清晰的时间限制开始，可以让每个人都有信心心中有一个目标和一个终点，同时也有帮助人们保持专注。


    ### 准备 (Preparation)


    在准备这一仪式之前，产品所有者将一直与设计师、客户、各种团队成员以及 Scrum Master 合作，创建一个包含清晰且具体的故事的待办列表（Backlog），这些故事对产品具有最高优先级。产品所有者的责任是确保每个故事都已准备好可以工作，并且表述方式要让任何团队成员都能阅读并理解每个故事的描述和验收标准。


    ### 引入新故事 (Introducing New Stories)


    冲刺计划为 Scrum 团队提供了一个机会，让他们了解产品所有者希望他们在产品下一次迭代中完成的故事。在仪式的这部分，产品所有者将回顾准备好的故事，并将它们提交给团队进行评估。


    团队的每位成员在演示期间积极参与是非常重要的，因为这是他们质疑和挑战每个故事的完整性和适当性的机会。一个优秀的产品所有者会在这种仪式之前就与团队中的专家讨论过这些故事，以确保可预见的反对意见得到解决。


    57


    Scrum 仪式


    **WOW! eBook**


    **www.wowebook.org**


    冲刺计划鼓励围绕每个故事进行积极讨论。这个过程开启了对话，让产品所有者和团队能够详细考虑每个故事的影响和可行性。虽然产品所有者有权设定冲刺待办列表（Sprint
    Backlog）中故事的优先级，但团队有权在故事加入冲刺待办列表之前拒绝他们认为不可能、定义不足或技术上不恰的故事。


    冲刺计划仪式的这部分也是团队负责展示与代码本身有关的故事。如果产品所有者负责产品的愿景，开发团队则负责代码的质量和可维护性。Scrum 以产品为导向的关注并不是忽视技术债的借口。


    团队通常会引入围绕重构代码、更新代码以满足新标准或对基础设施进行关键升级的故事。团队提供强有力的理由是重要的，因为产品所有者拥有最终决定权。不同的团队以不同的方式解决这种权力平衡，取决于每个团队如何最好地处理技术债。


    ### 故事估算 (Story Estimation)


    冲刺计划的下一阶段是**故事估算**。在这个过程中，团队将根据他们对类似故事的经验，估算所需的相对工作量。估算时需要记住的重要点是，值是任意的，与实际时间没有关系。团队有许多估算方法。估算的目标是让团队对单次冲刺内可以完成多少点数有个感觉。


    大多数团队使用点数系统。一个小的、简单的故事可能估约为 1 分，而一个大型或复杂的故事可能分配 20 分。许多团队使用改进的斐波那契数列，用 0, 1, 2,
    3, 5, 8, 13, 20 代表增加的工作量。


    Scrum：从新手到忍者 (Scrum: Novice to Ninja)


    58


    **WOW! eBook**


    **www.wowebook.org**


    ### 所有人达成一致 (Everyone Should Agree)


    团队中的每个人都对故事的点数估算达成一致是非常重要的，无论每个成员是否都会处理那个特定的故事。这是 Scrum 透明性的一部分。团队中的每个人都应该能够充分理解每个故事，以便估算其相对工作量。


    其他故事尺寸系统包括 T 恤尺寸——如小、中、大、特大。选择哪种系统完全取决于团队。一旦团队选择了一种系统，他们应该坚持使用几个冲刺，这样他们才能随着时间的增长对自己的速率产生感觉。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_79_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_79_1.png)


    ### 缺陷 (Bugs)


    其他通常不分配点数的故事是缺陷（Bugs）。**缺陷（Bug）**在 Scrum 中有特定的定义，它与现有产品中意外或不受欢迎的行为无关。Scrum 中的缺陷是仍在进行中的故事或已在之前的冲刺中已被接受为完成的故事中遗漏的需求。


    如果团队完成了一个故事并被接受了，且点数已包含在冲刺的总数中，但后来发现该故事没有正确完成，那么在修复缺陷以使故事达到完成状态时是不分配点数的。缺陷工作会消耗团队的速率，因为处理了不应该包含在速率计算中的点数。


