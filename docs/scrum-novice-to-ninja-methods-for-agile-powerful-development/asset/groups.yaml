    ## Attendance of QA in Standups


    Some teams consider QA as core team members, but for Kitten team QA is not required
    to participate actively in all team activities. It''s entirely up to the people
    not directly on the team whether or not they will attend standup.


    Kitten QA attends standups only when alerted that new tasks or stories might be
    discussed. The product owner likes to be at all the standups when possible. Of
    course, neither QA nor the product owner speaks until after all the engineers
    on the team have reported on their status. Even then, the scrum master limits
    them to statements of relevance to the whole team. The first to report is the
    junior engineer responsible for puppy story, who explains how they have broken
    the story into tasks, and how they have begun working on the first task.


    "We''d appreciate any feedback on the task breakdown," the junior engineer says.
    "I think we addressed all of the acceptance criteria, but the more eyes we have
    on this the better I''ll feel."


    "So you''ll be working on this task for the rest of the day?" the scrum master
    asks.


    "Yeah, I think we will."


    "Any blockers?" the scrum master asks.


    "I don''t think so," the junior engineer replies.


    "No, I don''t think we have any blockers," the other engineer on the story agrees.
    "We should be working on this at least until tomorrow."


    "Great," the scrum master says, making a note to follow up on the request for
    feedback, and then continues around the circle until everybody has reported. Then
    the team is dismissed, and the engineers go back to their various projects.


    After the standup, the product owner checks in with the scrum master and the people
    working on the tasks for puppy story, and lets them know that the design work
    has been started, and the copy updates they discussed at the planning meeting
    are in the repository. None of the tasks that require design assets have been
    started yet. Based on the updates from the standup, they probably won''t be.


