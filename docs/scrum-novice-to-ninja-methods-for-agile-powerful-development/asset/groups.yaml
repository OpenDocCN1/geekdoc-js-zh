    “我想我可以同意这一点，”产品负责人说道。


    工程师点点头，Scrum 主管继续说道：“那么，考虑到我们刚刚讨论的内容，大家还觉得这仍然是一个 13 分的任务吗？”


    “我不认为代码会糟糕到需要 20 分的地步，”另一位工程师说，“我们可以把它放在一个单独的分支，并使用显式的命名规范。只要标记得当，就很容易回滚。”


    “那么我想我可以接受 13 分了，”第一位工程师说。


    “太好了，”Scrum 主管说，“那么这就是一个 13 分的任务，我们还需要人来负责编写重构的杂任务（chore）。”


    “我来吧，”第一位工程师说，仍然对着产品负责人皱着眉，后者点头表示同意。“我一定会在回顾会议上提到这一点，确保我们像约定的那样执行它。”


    ## 同意冲刺待办列表（Sprint Backlog）


    除了关于小狗的故事外，产品负责人没有新的故事要介绍。这使得建立一个优先级排序的冲刺待办列表变得容易得多。使用团队的数字命名法，该故事被标记为 **11-1**。


    有几个故事在上一次冲刺中没有完成，还有一个仍处于 QA（质量保证）阶段。产品负责人决定，让负责这些故事的工程师完成它们更切实际，而不是把它们抽离出来让他们先去处理新故事。


    冲刺待办列表包含了上一次冲刺中未完成故事的所有分值，加上那个新的 13 分故事。考虑到团队之前平均 18 分的速率（velocity），24 分的总目标有点高。但在这种情况下，这个总分包含了几个已经部分完成故事的剩余值，因此团队同意这（分刺目标）是可行的。


    那位主张小狗故事应该估算为 20 分的工程师，计划留出时间来编写所需的重构杂任务（chore），以便能尽早引入。


    一旦冲刺待办列表完成，Scrum 主管会确保团队中的每个人都同意，并确保产品负责人会对这些故事所代表的产品增量满意。然后，在大家达成共识后，Scrum 主管启动了冲刺。


    以下是第 11 次冲刺开始时冲刺待办列表的情况：


    图 7.2. 第 11 次冲刺初始待办列表


    ## 总结


    所以，并不是一切都进展得完美顺利，但生活中什么事事事完美顺利的呢？在真实的网页和移动开发团队中，往往存在需要考虑的长期未做的重构、性格差异、利益冲突以及对下一步需要工作细节的真实分歧。


    Scrum 不会让这些问题消失，但它提供了以专业且高效的方式处理这些问题的流程，并能公开公开讨论它们，以便在每个冲刺中都能改进流程。


    在本章中，我们看到一个新需求出现在产品负责者的桌上，推迟了现有的未来开发计划，并迫使对代码库中的技术债务进行讨论。但团队已经能够根据修改后的验收标准对该故事进行评估、估算并承诺执行。


    在下一章中，我们将看到团队执行整个冲刺过程并处理那个新的小狗故事。我们将发现他们是否真的能在一个冲刺内完成它。


    ## 第 8 章


    ## 执行 Scrum（Working Through Scrum）


    在上一章中，我们接触了产品负责人的世界，并了解了为团队开发和创建故事的过程。我们看到了需求是如何收集的、产品待办列表是如何构建的，以及内部和外部客户以及其他利益相关者的期望是如何转化为团队清晰定义的
    Scrum 故事的。


    然后，我们经历了故事是如何引入团队的，以及团队如何对其进行估值的过程。我们看到团队与产品负责人进行谈判，以确保他们要做的工作是合理的，并且能够在一个冲刺内完成。


    现在是时候跟踪这个故事贯穿整个冲刺了。在本章中，我们将看到团队如何将像我们一直在讨论的这种大故事拆分成更小的任务，并分配这些任务，以便它们都能被处理和完成。我们将看到故事的所有方面如何得到解决，直到它们符合“完成定义”（definition
    of done）。


    最后，我们将看到团队与产品负责人一起进行演示（demo），如果运气的话，也许故事会在冲刺结束时被接受。


    无论如何，回顾会议上肯定会有很多内容要讨论。让我们看看会发生什么。


    ## 执行故事（Working Through a Story）


    当计划会议结束时，团队已经承诺了新的冲刺待办列表。正如你可能记得的，Scrum 看板目前看起来是这样的：


    图 8.1. 第 11 次冲刺初始待办列表


    ## 承担所有权（Taking Ownership）


    第二天早上，团队进行了新冲刺的第一次站会。像往常一样，团队围成一圈，每位工程师汇报自上次站会以来他们做了什么、在下一次站会之前计划做什么，以及是否有任何阻碍（blockers）。前三位工程师还有上一次冲刺的清理工作。但第四位工程师是团队中最初级的员工，他没有工作要做，可以接受一个新故事。


    “看来我要负责那个大的了，”初级工程师紧张地说。团队的其他成员发出了幽默的欢呼声。


    “好的，我们会把你的名字写上去，”Scrum 主管说。

    “我想该开始拆分任务了，”初级工程师说，“但我需要一些帮助。有人想和我结对编程吗？”


    “没问题，我们可以合作，”下一位工程师说。


    “太好了，”Scrum 主管说，“所以你们两个是一个团队，正在处理这个故事。现在有什么阻碍吗？”


    “只有那种惯有的畏惧感，”初级工程师说，“但我想我们能行的。”


    ## 定义任务（Defining Tasks）


    承担大故事时要的第一件事是将其拆分为任务。这意味着定义可以并行处理的单个子任务，以便故事不会被困在一个人的脑子里。有些团队喜欢在计划会议期间将故事拆分为任务，但这个团队决定由承担故事所有权的人也负责拆分任务。


    根据团队的偏好，任务可以像故事一样编写，也可以写成更适合工程师之间分享想法的技术规格书。任务还可以输入到若干个 Scrum 看板跟踪系统中，以便在通过开发、评审和
    QA 的过程中被跟踪并分配给不同的人。


    负责小狗故事的对工程师梳理了实现该故事所需的各种子元素。这花了几个小时，他们不得不请产品负责人几次来澄清某些点。当他们结束时，已经拆分出了六个多个任务，每个任务在故事进入
    QA 进行最终测试之前都需要完成。


