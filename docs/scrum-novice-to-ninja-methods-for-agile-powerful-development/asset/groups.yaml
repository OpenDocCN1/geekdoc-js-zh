    在一天结束之前，Scrum Master（敏捷教练）检查了看板上故事的状态。新任务已经添加，格式很整洁，这意味着处理“幼狗故事”的团队正确地遵循了既有规则。似乎不需要中断正在处理故事的工程师。


    ## 第一次站会


    第二天在每日站会期间，负责“幼狗故事”的 QA 工程师参加了，并记录了所有任务的状态。产品所有者也参加了。


