    ### Scrum 师的职责


    Scrum 师通常属于工程部门，某些情况下可能是开发团队的成员。Scrum 师担任开发团队人员的经理存在利益冲突。Scrum 师不应对团队拥有正式的组织权限，否则团队可能会因为潜在的后果而害于向
    Scrum 师提出问题。


    #### 职责


    Scrum 师必须遵守几个关键仪式。至少包括：每日站会（daily standup）、冲刺计划会议（sprint planning）、迭代结束演示（demo）和迭代回顾（retrospective）。我们将很快详细介绍这些仪式。


    除了主持 Scrum 仪式外，Scrum 师还负责指导人们如何遵循 Scrum 实践——并在倡导和捍卫 Scrum 时应以身作则。这可能涉及以易理解的方式帮助团队角色和期望。从某种意义上说，Scrum
