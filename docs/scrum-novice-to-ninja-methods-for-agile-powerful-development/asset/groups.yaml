    Figure 8.7. Sprint 11 Closed


    **Sprint Retrospective**


    After the demo is completed and the sprint is closed, the team sits down with
    the scrum master to go through the sprint retrospective. The point is to get people
    talking about what they think went well during the last sprint, what they could
    have done better, and what changes they think they should make to the process
    going forward.


    "One thing I think went really well was having the opportunity to follow that
    big story from start to finish," the junior engineer who took responsibility for
    the puppy story says. "It gave me a great chance to see how our architecture works
    from top to bottom."


    "You did a really good job on it," the engineer who had paired on that story says.
    "I learned some things about our own architecture that I didn''t know, too. There''s
    some really messy stuff in there."


    "Yeah," another engineer says, "that''s one of the things I think didn''t go so
    well. I really think we should have had the chance to do the refactoring before
    trying to build this all out."


    "I agree," the second engineer says. "But now at least we have a sense of where
    some of the mess is, so we know what to focus on first."


    "It would have been easier if I had just been able to dive in and fix that stuff
    first," the third engineer says. "I already knew where most of it was, and it
    still bothers me that we did it backwards."


    "At least now you''re not the only one who knows," the second engineer points
    out.


    "Yeah, but it sounds as if we''re not going to get a chance to do the refactoring
    this sprint, either," the third engineer says, sounding grim.


    "That''s how it sounded to me too," a fourth engineer chimes in. "They''re going
    to stick in the stories to get the design changes for the beta done first."


    "We probably are going to have some design stories to fix the visuals for the
    beta," the scrum master says. "But the product owner did agree to give us time
    for the refactor as a top priority if we finished the story, and we did. I''ll
    follow up on that before the planning meeting to make sure."


    "Well one thing," the third engineer says, "is that I want to go through those
    new designs with a fine-toothed comb and make sure they''re really final before
    we estimate them."


    "Should we make that another goal for the next sprint?" the scrum master asks.
    The engineers around the room nod. At the end of the retrospective, they came
    up with a short list of improvements they wanted to make to their process, as
    well as a couple of tasks for the scrum master to follow up on with the product
    owner.


    The two points everybody can agree on are that working across the entire stack
    has been frustrating but also useful for exposing issues in the code that need
    to be fixed, and that the priority for the next sprint should be getting those
    issues addressed. One way or another, it''s going to be an interesting planning
    meeting going into the next sprint.


    **Summary**


    One of the things we''ve learned about scrum is that it can''t give you the team
    that you might wish to have, but it can help you optimize the resources that you
    have available, and support them in working together effectively. In this chapter,
    we''ve gone through how a team with some challenges approached a new story that
    stretched their resources.


    - We saw how the team organized the work, and broke a big story out into engineering
    tasks so that it could be developed in parallel.

    - We watched the team encounter issues with the acceptance criteria, and get feedback
    from the product owner about how to address them during the sprint.

    - We saw the compromises that came up during the demo, and how they led to revised
    expectations for the upcoming sprint.

    - And then we listened to the team go through their concerns at the retrospective,
    discussing what went well, what could have gone better, and what they hope to
    see in the next sprint.


    Implicit in all of this is the philosophy of collaborative transparency and self-management
    behind scrum. In the next chapter, we''re going to discuss how to make scrum work
    for your team. We''ll talk about how to introduce the concept of scrum to an organization,
    what resources are needed to support scrum, and also how to address some of the
    anti-patterns that can show up when learning to apply scrum.


    ## Chapter 9

    ## Making Scrum Work for Your Web or Mobile Team


    For most of this book, we''ve been talking about the practicalities of scrum.
    Although the core definition of scrum is very versatile—supporting a wide range
    of applications—we''ve gone into a fairly opinionated and detailed explanation
    of the mechanics of scrum as it can be applied in web and mobile teams. (Many
    of these principles and practices, however, apply just as well to other kinds
    of development work.)


    Now that we have some shared vocabulary and concepts, in this chapter we''re going
    to discuss how to get a team started with scrum. We''ll go into more detail about
    the arguments for scrum when doing web and mobile development. We''ll discuss
    what scrum is best for, how it compares to the alternatives, and provide answers
    to some of the questions that come up when making the case for scrum and applying
    it in a company.


    ## Taking Steps Toward Scrum


    We''ve learned some things about scrum, and how scrum can help your web and mobile
    development project. The next question is how to take your team from zero to scrum.
    That''s going to be different for every team, and you''ll need to evaluate your
    own situation to determine just how ready the organization is to adopt an agile
    approach.


    ### Buy-in


    If your organization is currently following something like a waterfall process,
    the people at every stage in the cycle may be comfortable with the roles they
    have, and won''t be anxious to try something new. You may need to show them just
    how much more effective and productive the organization could be with a scrum-based
    process.


    Executives may be concerned they''ll have less control over a team that self-organizes,
    and that they''ll have less input into a process that generates its own ideas.
    Point out to them that an agile process gives them the opportunity to shift and
    adjust priorities every sprint, adapting to the marketplace more effectively,
    while providing valuable feedback that they can use to help guide their decision-making.


    Engineering managers may be confused about what their role is in a team that manages
    itself, but that concern grows out of a semantic misconception about the concept
    of a team being self-managing. Managers are still essential to help the team allocate
    resources, resolve personal issues, and identify and retain talent. Managers also
    bring their own background and knowledge to the whole development process. Engineering
    managers are free to dedicate a portion of their time to hands-on work as one
    of the engineers on a team, but their main responsibility is securing the team''s
    place in the organization, making sure they have the tools and resources they
    need, and defending them from distractions so they can continue with their scrum
    process.


    Designers may wonder how they''re going to fit into a scrum process, when their
    work doesn''t necessarily follow the same cycle as the rest of the team. Show
    them that scrum provides designers with increased opportunities to have more impact
    before decisions get made, because designers can be involved in every stage of
    the development, and participate from the planning stages all the way through
    release.


    Engineers may be concerned about the change in their roles, especially if they''ve
    gotten used to doing one thing very well. Agile puts a greater responsibility
    on each.

