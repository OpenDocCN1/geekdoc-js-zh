    ## Conclusion


    In this chapter, we''ve gone over the four critical rituals for scrum: sprint
    planning, daily standup, sprint demo, and sprint retrospective. Each of these
    rituals is repeated once every sprint, except for the standup, which is performed
    every day.


    These rituals take us from feature stories—written by a product owner—through
    team estimation, commitment to a sprint backlog, working through all of the stories,
    demonstrating that each story was completed and meets all of its acceptance criteria,
    to finally reflecting on what worked and what didn''t in the completed sprint,
    so that the team can constantly improve.


    Next, we''re going to take a look at some of the artifacts of scrum. These tools
    help a scrum team to understand what they''re working on, track their progress,
    and work together effectively.


    ## Chapter 5: Scrum Artifacts


    ### **Artifacts** are the tools of scrum that allow teams to manage their scrum
    process. They help team members communicate about the work they''re doing, and
    provide a record of what the team has agreed to do and what they have accomplished.


    Anyone can point to the artifacts of a scrum team to show people what they''re
    working on, what they''ve accomplished, and what they expect to be able to achieve.


    There are a number of artifacts that help teams prepare and manage as part of
    the process of working in scrum. Getting familiar with the language of scrum means
    understanding what each of the artifacts is for, and how it''s used. In this chapter,
    we''ll go over a few of the most common scrum artifacts, such as:


    - story

    - product backlog

    - sprint backlog

    - scrum board

    - definition of "done"

    - velocity charts

    - burndown chart

    - product increment


    Different teams have different approaches to how they create and maintain the
    artifacts they use, but for web and mobile development, some are worth keeping
    in mind.


    ### **Artifacts Overview**


    Although formal scrum is agnostic about exactly how the artifacts of the process
    are used, we''ll cover a few ways of building and maintaining artifacts found
    to be useful for the type of work that web and mobile teams tend to get into.


    One of the most basic artifacts of scrum for web and mobile work is the story
    that describes a feature to be worked on. Stories are developed and managed in
    backlogs. Separate backlogs are maintained for the product owner to keep track
    of the overall vision of the product, and for the team to participate in the sprint
    currently in progress. Both backlogs house descriptions of what needs to happen
    to take the product forward, but items on the product backlog will not look like
    stories on the sprint backlog. Scrum teams use a scrum board for tracking the
    progress of stories through the sprint, and we''ll discuss how those work together.


    Scrum also offers a number of tools for gathering statistics that are useful for
    tracking the performance of the team, and communicating how product development
    is going to people both inside and outside the scrum team. Among these, we''re
    going to cover the velocity chart that spans multiple sprints, and the burndown
    chart that tracks progress within a single sprint.


    Other artifacts that a scrum team is going to find useful include a definition
    of done, which is agreed to by the product owner and team under the supervision
    of the scrum master, as well as the actual product increment, or the current state
    of the product as it exists at the end of the sprint.


    ### **Stories**


    **Stories** are how the product owner communicates to the development team what
    needs to be developed. Stories are incubated in the product backlog, and then
    expressed in a standard format so they can be presented to the team as part of
    the sprint planning meeting to be evaluated, estimated, and then included in a
    sprint backlog.


    ### **The Origin of Using Stories**


    The concept of using a story to encapsulate discrete parts of the work comes from
    Extreme Programming (XP)¹, which is a specialized variation of agile that advocates
    a number of excellent development practices such as pair programming and writing
    feature stories. Stories come in very handy when doing web and mobile development
    with scrum, where the work on a full slice of functionality generally includes
    many of the same components from the back end to the front end. The team will
    often see stories that all have the same components, and comparing one story to
    others the team has worked on before makes new stories easier to break down and
    estimate relatively. For that reason, we''re going to consider stories a basic
    artifact of scrum for the type of work we''re talking about.


    A story should capture a complete slice of functionality. Each story should be
    independent, so that developers don''t have to complete one story before working
    on another. A story should be a small slice of functionality that can be worked
    on and completed over the course of a single sprint.


    Stories help capture the essence of a feature, and give the team the ability to
    discuss the parameters and acceptance criteria in a meaningful and relative manner.
    Estimating work by sizing feature stories around what the team can accomplish
    in a sprint is a useful exercise.


    Every story should add to the value of the product, and bring it closer to the
    vision of the owner. Each story should make it clear how the product owner will
    test the final product to verify that the story has been completed.


    ### **Stories Aren''t Technical Specifications**


    Although new product owners with backgrounds in engineering or product management
    sometimes feel inclined to work out all the technical issues and propose static
    solutions with fully fleshed out specifications for every feature, it''s important
    to keep in mind that scrum stories aren''t technical specifications. They are
    opportunities to open a discussion between product owners and engineers about
    how to implement a feature, and how much effort will be involved. That''s one
    of the reasons stories follow a short and consistent format. It undercuts the
    temptation to include more detailed specifications.


    The responsibility for writing the stories belongs to the product owner. Writing
    stories that capture the full intention and expectations of the client is a skill
    that may take time to develop, but it''s critical to an effective scrum process.
    A good scrum master should be able to help coach the product owner in how to write
    stories that are the right size, express the appropriate acceptance criteria,
    and open a dialogue rather than close one off.


    There''s a simple formula that works well for writing stories. People have tried
    many variations over the years. Through iteration and reflection, different teams
    may eventually evolve different approaches that work for them, but this is a good
    place to start:


    ¹ http://www.exremeprogramming.org

