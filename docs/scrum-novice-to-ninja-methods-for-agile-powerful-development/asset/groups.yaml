    **时间盒 (Time Box)**


    迭代计划分配的时间取决于迭代期间完成的故事（stories）数量，以及与验收标准相关的复杂程度。如果团队使用的是为期两周的迭代，大多数团队会为迭代演示（demo）分配半天时间。一旦团队决定投入演示的时间，
    Scrum Master（scrum master）应负责确保所有需要发生的事情在该时间盒内完成。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_88_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_88_1.png)


    **将演示与回顾安排在同一天**


    团队经常会将迭代回顾（我们稍后会介绍）安排在与演示同一天。在同一天安排这两种仪式的优点是尽度地减少与仪式活动相关的生产力中断。对团队而言的缺点是，这些天产生的主要是
    Scrum 产物，而不是实际的产品开发。这种权衡需要被考虑，不同的团队会有不同的偏好。


    **准备工作**


    迭代演示是团队展示他们所做工作的机会，并证明他们一直在处理的故事都已完成并准备好包含在产品中（假设尚未被包含）。演示涵盖了从迭代开始的所有使某个故事达到团队“完成定义”（definition
    of done）的工作，无论这些工作是否已经发布。每个参与了任何准备好演示的故事的人员，都需要准备好解释他们对这些故事做了什么。


    通常，工程师会在演示之前与产品所有者（product owner）会面，确保每个人都清楚将展示的内容。这可以是演示前一个非常有用的最后一步，因为它确保了所演示的故事符合所有的验收标准。它还提醒工程师进行任何必要的准备，以便对未发布的故事进行演示。


    Scrum Master 应与所有已完成故事的工程师会，确保这些故事已为演示做好了准备。运行仪式是 Scrum Master 的责任，并确保所有需要演示的内容都能在分配的时间盒内呈现。Scrum
    Master 的仪式议程应包含所有待演示的故事列表，以及负责每个故事的人。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_89_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_89_1.png)


    **让产品所有者驱动演示**


    虽然有些团队让工程师演示故事，但良好的做法是让产品所有者参与并现场测试产品。开发新功能的工程师知道代码始终能运行的“快乐路径”（happy path）。但产品所有者会寻找边缘情况（edge
    cases），并意识到最重要的验收标准。让工程师设置演示，并由产品所有者进行演示，可以让每个人保持参与感，并确保故事的完成让产品所有者满意。


    **演示故事**


    演示每个故事的过程应该是一致的。Scrum Master 应逐一检查列表上的每个故事，让工程师为团队设置演示。许多团队选择在会议室使用投影仪完成，尽管也可以通过围在一个大型显示器周围，甚至通过远程会议服务来实现，这取决于故事的性质和团队的偏好。


    在迭代的这个阶段，故事的描述对房间里的大多数人来说都是熟悉的，但在演示期间，产品所有者应该向团队朗读故事以及任何主要的验收标准。这样，每个人都会知道要看什么，并意识到可能出现的问题。


    一旦故事设置好并准备好演示，产品状态就是关注的的焦点。每个故事都应该是添加到产品中的一个完整功能切片，演示应该在实际产品的语文中展示该功能切片。演示应该逐一通过验收标准，证明它们已得到满足。


    有时在演示期间，会发现最初编写的验收标准是不充分的，可能没有涵盖产品所有者需要处理的所有情况。如果发生这种情况，请记住，只要演示满足了所有的验收标准——即在迭代计划中估算的故事中所指定的标准——它就应该被视为已接受并已完成。任何可能需要的的进一步更改都是新故事。在这种情况下，产品所有者应该准备为未来的迭代创建新故事，以涉及原始故事中未处理的额外验收标准。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_90_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_90_1.png)


    **不要详细讨论问题**


    虽然详细说明演示期间遇到的问题可能很有吸引力，但更好的做法通常是记录它们并在随后的后续会议中讨论。这可以保持演示不入正轨，并尊重每个参与者的时间。如果出现需要立即处理的关键问题，Scrum
    Master 应决定是当时处理还是将其标记为待稍后讨论。


    **统计点数**


    在迭代结束时，团队应该统计所有完成故事的分数。这有助于团队理解自己的速率（velocity）并为未来的迭代制定计划。Scrum Master 应确保分数被准确捕并反映在跟踪工具中。


    **发布故事**


    发布是将已完成的功能整合到实时产品中的过程，以便使用户能够立即访问它们，或者对它们是否被纳入未来的发布中进行评估。网页和移动团队在发布方面有很多选择。


    当团队选择进行持续集成（continuous integration）时，重要的是处理某个故事的工程师在故事发布之前，不应该放弃该故事，并证明它不会在实时产品中引入任何问题。虽然这可能会导致工程师的一些停机时间，但这些时间可以用于与维护和改进代码库相关的故事。


    **持续集成**是一种支持在故事完成后立即发布的方法，而不是等到迭代结束。这通常取决于一个健壮的测试套件和一组协调好的发布脚本。对于进行持续集集的团队，故事向实时产品中的发布已经作为完成故事的一部分完成，演示后不再需要进一步的操作。


    对于不进行持续集集的团队，还需要另一个任务来将迭代中的所有故事发布到生产环境。与发布过程相关的任务通常被认为是故事的完成定义的一部分，但在这种情况下，它们可能需要在演示之后完成。


    有些团队定期在每个迭代开始时安排发布。其他团队发布得更频繁，或者可能只在某些特定时间发布，或者根据与大型组织或市场需求相关的特定事件的计划进行发布。


    '
