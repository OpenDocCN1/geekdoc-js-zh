    ## 总结


    Scrum 的角色已经有了明确定义，以确保对等成员之间的权力平衡，并且敏捷地开发产品的所有责任都得到了处理。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_69_0.png)


    图 3.5.Scrum 角色


    -   Scrum Master（ Scrum Master）主持 Scrum 仪式，支持团队，并在 Scrum 内部和外部推广 Scrum 流程。

    -   产品所有者（Product Owner）维护产品的愿景和方向，负责与客户进行交互。

    -   开发团队（Development Team）由工程师组成，他们通过自我组织来估算并执行构建产品的工作。


    现在我们已经回顾了参与 Scrum 涉及的角色，在下一章中，我们将看看他们参与的仪式。观察这些这些角色的人员如何互动以支持他们的目标，以及他们所实现的稳健平衡如何帮助
    Scrum 团队保持高效工作。


    Scrum 角色

    49


    ## 第 4 章：Scrum 仪式


    在 Scrum 团队工作的实践被组织成一系列仪式。这些仪式标志着执行 Sprint（冲刺）工作过程中的关键事件。主持每个仪式是 Scrum Master 的责任，要确保它们专注于目标，并为整个团队带来产生预期的结果。


    ### 什么是仪式？


    每个**仪式**（ritual）都是一次实时的面对面聚集，它让人们离开正在的工作，并为他们提供了就该工作的背景进行针对性交流的机会。Scrum 认为沟通优于文档，这就是为什么它为各种类型的有用面对面交流提供了定期的且明确的机会。


    ### 不要再开会了！


    许多在公司工作的人对会议产生“过敏”，这不无道理的。他们可能被过多的会议所淹没，会议占据了他们太多的时间，而且没有产生任何结果。他们可能习惯了为了解决每一个微小问题而召开会议，却没有人专门负责确保问题得到解决。会议会使人们离开正在的工作，中断他们的注意力，而且往往无法提供太多的价值。


    面对现实吧，大多数公司在会议方面都是*糟糕的*。


    与普通会议不同，Scrum 中的每个仪式都有特定的目标，针对特定的受众，在定义的时间范围内完成目标，并拥有一组可预测的结果。参加仪式的每个人在仪式开始前都知道他们期待什么、如何表现，以及承诺的结果应该是什么。Scrum
    仪式顾了它们的整体目的，并尊重参与者的时间和注意力。


    ### 时间盒计时（Time Boxing）


    Scrum 仪式中最重要的概念之一是**时间盒**（time box）。主持仪式的 Scrum Master 有责任让每个人都确切地知道他们为这个仪式投入了多长时间，以及在仪式的任何一点他们已经进展了什么程度。


    Scrum Master 通常会在房间前面的白板上写下时间，或者保持一个大家都能看到的大钟，以便每个人都能跟踪时间。（我曾被人们知道会带一个标有“时间盒”的小立方体时钟参加仪式，并把它展示在每个人都能看到的地方。）时间盒的概念赋予了仪式中所有活跃参与者力量，让他们互相鼓励在必要时直奔正题，并专注于仪式的目标。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_72_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_72_1.png)


    ### 每个时间盒应该是多长？


    团队在每个仪式上花费的时间通常取决于每个 Sprint 分配的周数。必须保持在 15 分钟时间盒内的仪式是每日站会（daily standup）。团队在迭代和改进他们如何使自己适应
    Scrum 的过程中，对每个仪式的时间盒达成共识。我在下方为团队提供了一些起始的建议。


    Scrum 通过在每个仪式开始时确定时间盒，以及该时间如何分配给仪式的不同方面，表达了对每位参与者时间和承诺的尊重。预计所有参与者在仪式的时间盒期间保持投入并参与，并承诺在没有充分且实际理由的情况下，仪式不会延长，除非所有参与者都同意延长。


    如果一个仪式似乎即将超过其时间盒，Scrum Master 应该征求大家的许可继续进行特定时间的仪式。这样，每个人都预先知道要预算多少时间，如果预算需要延长，每个人都必须同意。


    当然，我们都是人，在仪式期间会出现一些感觉需要立即讨论的旁问题。将注意力集中在正在进行的仪式上是 Scrum Master 以及团队其他成员的责任。一个优秀的
    Scrum Master 需要跟踪这些问题，并为了所有相关者的利益对正在进行的仪式的时间盒保持尊重。


    确保重要的旁插讨论不丢失是共同的责任，但 Scrum Master 需要准备好在该过程中采取积极作用。如果人们确信以后可以重新拿起话题，他们会更愿意放下一个离题的讨论。


    ### Sprint 的长度


    团队在选择 Sprint 长度时有一些选择。唯一必须保持在 15 分钟时间盒内的仪式是每日站会。团队在迭代和改进他们如何使自己适应 Scrum 的过程中，对每个仪式的时间盒达成共识。我在下方为团队提供了一些起始的建议。


    Scrum 通过在在每个仪式开始时确定时间盒，以及该时间如何分配给仪式的不同方面，表达了对每位参与者时间和承诺的尊重。预计所有参与者在仪式的时间盒期间保持投入并参与，并承诺在没有充分且实际理由的情况下，仪式不会延长，除非所有参与者都同意延长。


    如果一个仪式似乎即将超过其时间盒，Scrum Master 应该征求大家的许可继续进行特定时间的仪式。这样，每个人都预先知道要预算多少时间，如果预算需要延长，每个人都必须同意。


    当然，我们都是人，在仪式期间会出现一些感觉需要立即讨论的旁问题。将注意力集中在正在进行的仪式上是 Scrum Master 以及团队其他成员的责任。一个优秀的
    Scrum Master 需要跟踪这些问题，并为了所有相关者的利益对正在进行的仪式的时间盒保持尊重。


    确保重要的旁插讨论不丢失是共同的责任，但 Scrum Master 需要准备好在该过程中采取积极作用。如果人们确信以后可以重新拿起话题，他们会更愿意放下一个离题的讨论。


    ### Sprint 的长度


    团队在选择 Sprint 长度时有一些选择。Sprint 长度应该允许团队预期工作的故事类型根据团队自己的“完成定义”在单个 Sprint 内完成。对于许多团队来说，一周的
    Sprint 非常适合短的故事。有些团队倾向于处理在一个 Sprint 内无法完成的复杂故事，因此他们选择两周、三周甚至四周的 Sprint。Sprint
    的长度是另一个可以根据反馈进行修改的因素，但团队必须选择一个长度并坚持几个 Sprint。否则，团队可能永远无法从规律中受益，从而学会从一个 Sprint
    到下一个正确进行估算。


    Scrum：从新手到忍者

