    该故事的大部分任务已经产生了经过审查的代码，这些代码在完成后可以独立进行单元测试。现在，运行集成测试并验证功能从头到尾符合预期只是简单的事情。如果故事被接受并推送到生产环境，这些测试将添加到网站的通用套件中。


