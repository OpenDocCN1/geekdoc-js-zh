- md: '

    It''s also still weird talking so much in the rituals. I think the scrum master
    might be a little frustrated with me, because I always have to be coaxed to talk.
    It''s especially scary when what I''m thinking doesn''t agree with what my manager—or
    one of the senior engineers—is thinking.


    ## What I Do About It


    I''m learning to be a little bit more open and say what''s on my mind more. And
    knowing I have to say something keeps needed more alert, especially when the discussion
    is about something I''m not familiar with. It forces me to learn things outside
    my background. And pairing with other, more experienced engineers helps, too.
    It lets me join in on stories that I''m curious about, but may not have all the
    skills to do on my own.


    Listening to what happens in the planning meetings and during the demos, I''ve
    seen that everybody has ideas that turn out to be wrong sometimes. For example,
    it''s very rare that everybody agrees on the number of points to assign to a story
    during the first vote. Having to justify your position when you''re an outlier
    in the points vote is a great exercise, and it opens up the discussion. It''s
    easy to think that it''s just you who doesn''t understand. But everybody has things
    they don''t understand. When you participate actively in the discussions, new
    ideas to come out, and that''s a good thing.


    ## An Engineering Manager


    ### Initial Concerns


    After managing teams for a few years, I was very leery of the idea of a supposedly
    self-managing team. I''ve seen the kinds of problems that can come up when people
    try to work together without adequate supervision, and frequently egos can get
    in the way of productivity. I''ve been called into address personnel issues before,
    and that takes more than an abstract process. And to be honest, it did sound to
    me as if scrum was trying to replace management with a bunch of buzzwords and
    fixed procedures.


    I was also concerned about how we were going to explain to senior management that
    we would only be able to estimate roughly when a project would be completed, or
    even what we were going to produce. Justifying the budget for an engineering team
    is hard enough when you have fixed deadlines, and can point to specific tangible
    results. It sounded to me as if scrum was going to take away that justification,
    leaving me with nothing but open promises.


    ### What I''ve Learned


    The interesting thing is that the self-managing teams don''t actually self-manage
    the way I was expecting. I''m still the manager of the team, and they rely on
    me for personnel issues, resource allocation, and general leadership. The rest
    of the company looks to me to take responsibility for what the team is working
    on, and make sure that what we do coordinates with the needs of the company.


    Scrum is about the processes the team follows when it''s trying to get work done.
    Scrum doesn''t replace management, but it steps in and provides a pattern that
    everybody can follow to improve their ability to estimate stories, and make sure
    everyone is working in a transparent and productive way. I particularly like the
    way scrum has coordination points between the product group and the engineering
    group. It takes some of that responsibility off of my shoulders, so I can do the
    job of managing the team.


    And honestly, I like that scrum gives me the opportunity to do some work on the
    team as a developer again. That''s something I''ve missed as a manager, and I''m
    glad to get back to it.


    ### What Still Frustrates Me


    Scrum is great within the engineering team, but it would be so much more effective
    if everybody in the company were on board with it. I sometimes find myself caught
    in the middle, trying to explain the concepts of scrum to people in senior management
    or on the sales team who want to know that a particular feature can be delivered
    on a particular date. I mean, I understand why they need that, but it''s frustrating
    having to explain the trade-offs every time.


    ### What I Do About It


    I think we''ve done a pretty good job of getting most people on board with supporting
    scrum, and recognizing the value of an iterative process that can respond quickly
    to changes. I like to explain to people that scrum allows an engineering team
    to estimate new ideas quickly, and adjust the trajectory of developments to adapt
    to market changes.


    The alternative is coming up with a long-term plan and committing to it, without
    knowing for sure that it''s what the marketplace is going to want. There will
    always be compromises when it comes to things like that, and that''s where people
    skills are necessary. Most executives would rather have the ability to change
    direction quickly, since they recognize that things change quickly in web and
    mobile development—and features that are scheduled too far into the future usually
    never happen, regardless of what process the team follows.


    ## A QA Engineer


    ### Initial Concerns


    I wasn''t too worried about scrum initially, but then again I didn''t think it
    was going to have much to do with me. My biggest concern was figuring out how
    I was going to fit into a new process. My work was always pretty well defined,
    and I didn''t want to shake things up. At the end of the day, what I do is important,
    and I was most concerned that adapting to an agile process was going to mean cutting
    back on the kind of rigorous testing that I know our products need.


    ### What I''ve Learned


    It''s been interesting participating in the scrum rituals. I didn''t have much
    to say to begin with, but sitting in on the planning meetings gave me a preview
    of what I was going to have to work on down the road. It also gave me a chance
    to ask some of the important questions up front. And it turned out that those
    questions helped the rest of the team make decisions about how they were going
    to plan out their work. That was an added bonus.


    Since Ive been integrated into the process, I get to start working on the test
    suite for a story while it''s in development, instead of waiting until afterward.
    That means the developers don''t have to wait as long to get results from my tests,
    and can make fixes to the code while it''s still fresh in their minds.


    I also really like the way stories are structured. The acceptance criteria make
    it clear what aspects to focus on during my testing, and what aspects are just
    red herrings. And several times I''ve been able to challenge and modify the acceptance
    criteria before the team even started working on the story, based on exceptions
    I could anticipate.


    ### What Still Frustrates Me


    The cadence of scrum still puts a chunk of my work at the end of the line after
    stories are completed. That means there''s usually some concern about getting
    my tests completed in time for a demo, just to satisfy the expectations of scrum.
    I think everyone understands that the scrum deadlines aren''t really important
    to our overall productivity, and that scrum is more about working together efficiently.
    But I know the team feels better when they can complete all of the stories they''ve
    committed to by the end of a sprint. I didn''t like being the one who makes the
    team miss those deadlines. But part of that is a function of the type of work
    I do, not of scrum.


    ### What I Do About It


    Sometimes I have to be the one who reminds people that it''s not a real problem
    if we don''t get a story completed in time for a demo. It''s much better to do
    a good job than it is to rush the work just for the sake of scrum points. In fact,
    rushing to get things done in time for the demo, and working extra hours in order
    to do it, artificially inflates the velocity of the team. It may show what we
    can accomplish if we push ourselves, but it isn''t in a sustainable manner. It''s
    better to fail at our sprint commitment and get better at estimating than it is
    to force things to completion in time for an arbitrary demo date. That''s what
    we were taught, although it can be hard to remember sometimes in the excitement
    of preparing for a demo.


    ## A Product Manager


    ### Initial Concerns


    The kind of product management I''ve been used to involves making long-term plans,
    and working out the details to make sure those plans are realistic. When we started
    talking about scrum, I felt as if most of what I had been trained to do was going
    to be thrown out. Scrum felt dismissive of the value of long-term planning.


    My organization is responsible for making sure our products will be relevant for
    years to come, not just for the next two weeks. We have to be able to keep up
    with.

    '
  mdcn: '

    在仪式性会议中这么多这么多感觉还是很奇怪。我觉得敏敏捷大师（scrum master）可能对我感到有点小沮丧，因为我总是需要被劝导才开口。当我的想法与我的经理——或者其中一位高级工程师的想法不一致时，那种感觉尤其令人害怕。


    ## 我如何应对


    我正在学习变得更加开放，并更多地说出我的想法。而且我知道我必须说些什么，这让我保持更高的警觉，尤其是当讨论的内容涉及我不熟悉的领域时。它迫使我去学习背景之外的知识。此外，与其他经验丰富的工程师配对开发也有帮助。这让我能够参与到我感兴趣的故事中，但我自己可能还没有足够的技能独立完成它们。


    通过观察计划会议和演示（demos）期间发生的情况，我看到大家的想法有时会被证明是错误的。例如，在第一次投票时，大家对给一个故事（story）分配的分数达成一致是非常罕见的。当你是点数投票中的离群者时，必须为自己的立场辩护是非常棒的练习，它能开启讨论。人们很容易觉得只有自己不理解。但每个人都有自己不理解的事情。当你积极参与讨论时，新的想法就会涌现，这是一件好事。


    ## 工程师经理


    ### 初步顾虑


    在管理团队几年后，我对所谓的“自我管理团队”这一想法持非常怀疑态度。我见过当人们在没有充分监督的情况下尝试合作时可能出现的各种问题，自我意识往往会阻碍生产力。我曾被叫去处理人事问题，这不仅仅是一个抽象的流程就能解决的。诚实地说，这听起来就像敏捷开发（scrum）试图用一堆术语和固定程序来取代管理。


    我还担心如何向高层解释，我们只能粗略估计项目何时能完成，甚至无法确定产出什么。当你有固定的截止日期并能指向具体的实物结果时，为工程团队证明预算已经足够困难了。在我听来，敏捷开发似乎要夺走这种依据，只给我留下一堆空洞的承诺。


    ## 我学到的东西


    有趣的事情是，自我管理团队并没有按照我预想的那样进行自我管理。我仍然是团队的经理，他们在人事问题、资源分配和通用领导力方面依赖我。公司的其他部分也由我对团队的工作负责，并确保我们的工作与公司的需求相协调。


    敏捷开发关注的是团队在尝试完成工作时遵循的流程。敏捷开发并没有取代管理，而是介入并提供了一种每个人都可以遵循的模式，以提高他们估计故事的能力，并确保每个人都以透明且高效的方式工作。我特别喜欢敏捷开发在产品组和工程组之间建立协调点的方式。这减轻了我肩上的一些责任，让我能够专注于管理团队的工作。


    诚实地说，我喜欢敏捷开发给了我再次作为开发者为团队做一些工作的机会。这是我作为经理时怀念的，我很高兴能重回归。


    ## 仍然令我感到沮丧的事


    敏捷开发在工程团队内部是非常棒的，但如果公司里的每个人都能认同它，效果会好得多。我有时发现自己处于两难地，试图向高层或销售团队的人员解释敏捷开发的概念，他们只想知道某个特定功能是否能在特定日期交付。我的意思是，我理解他们为什么需要这些，但每次都要解释权衡（trade-offs）真的很令人沮丧。


    ## 我如何应对


    我认为我们在让大多数人接受并支持敏捷开发方面做得不错，认可了能够快速响应变化的迭代过程的价值。我喜欢向人们解释，敏捷开发允许工程团队快速估计新想法，并调整开发轨迹以适应市场变化。


    另一种选择是制定一个长期计划并与其承诺，但却不确定这是否是市场想要的。在这些事情上总会有妥协，而这正是人际技巧必要的时刻。大多数执行官更愿意拥有快速改变方向的能力，因为他们意识到在网页和移动开发中，变化非常快——无论团队遵循什么流程，安排在太久远的功能通常永远不会实现。


    ## 一位 QA 工程师


    ### 初步顾虑


    起初我并不太担心敏捷开发，但话又回来，我不认为它跟我有什么太大关系。我最大的顾虑是弄清楚我如何融入新流程中。我的工作一直定义得很清楚，我不想打破现状。归根结底，我所做的很重要，我最担心的是适应敏捷流程意味着将减少我知产品所需要的那种严谨测试。


    ## 我学到的东西


    参与敏捷开发的仪式很有趣。起初我没什么可说的，但参加计划会议让我预见了未来我需要处理的内容。它还给了我机会提前提出一些重要问题。事实证明，这些问题帮助团队的其他成员就他们如何规划工作做出了决定。这是一个额外的收获。


    自从我整合到流程中后，我可以在故事开发期间就开始编写该故事的测试用例，而不是等完成后。这意味着开发者不需要等那么久就能获得我的测试结果，并且可以在记忆还新鲜时对代码进行修复。


    我也非常喜欢故事的结构方式。验收标准（acceptance criteria）明确了我在测试期间应该关注哪些方面，以及哪些方面只是误导性的干扰项（red herrings）。好几次，在团队甚至开始处理某个故事之前，我就根据我能预见的异常情况挑战并修改了验收标准。


    ## 仍然令我感到沮丧的事


    敏捷开发的节奏仍然将我的大部分工作留在了故事完成后的末尾。这意味着通常会担心为了满足敏捷的预期而无法在演示前完成测试。我认为大家都能理解，敏捷测试的截止日期对我们的整体生产力并不重要，敏捷开发更多是关于高效协作。但我知道，当团队能在结束前完成承诺的故事，他们感觉更好。我不喜欢成为那个让团队错过截止日期的人。但这很大程度上取决于我的工作类型，而不是敏捷开发。


    ### 我如何应对


    有时我必须成为那个提醒人们的人：如果我们没能在演示前完成某个故事，并不是真正的问题。比起为了敏捷点数而匆忙赶工，把工作做好要好得多。事实上，为了演示而赶进度完成工作，并为此加班，会人为地夸胀团队的速度。这可能显示了我们在推向自己时能完成什么，但并不是持续的。在冲刺中失败并提高估算能力，比为了一个随机的日期强行完成要好。这是我们受到的教育，尽管在准备演示的兴奋中有时很难记住。


    ## 一位产品经理


    ### 初步顾虑


    我习惯的产品管理模式涉及制定长期计划，并落实细节以确保这些计划是现实的。当我们开始讨论敏捷开发时，我觉得我大部分受过的训练可能将被抛弃。敏捷开发似乎对长期规划的价值不予重视。


    我们的组织负责确保我们的产品在未来几年内保持活力，而不仅仅是未来两周。我们必须能够跟上变化。

