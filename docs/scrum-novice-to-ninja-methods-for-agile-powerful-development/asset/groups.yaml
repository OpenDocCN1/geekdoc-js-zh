- md: '

    The size of the sprint backlog for the current sprint is based on the negotiations
    that happened during sprint planning at the beginning of the sprint. Each story
    is estimated during the sprint planning, and the backlog as a whole should represent
    the total number of points that the team believes it can accomplish in the upcoming
    sprint. Each story has a point value, and that reflects the amount of work the
    team believes will be necessary to complete that particular story.


    The order of the stories in the sprint backlog is established initially at the
    sprint planning ritual, but it''s the prerogative of the product owner to change
    the order of stories in the sprint backlog at any point during the sprint. The
    product owner may not add stories to the sprint backlog, or remove stories from
    the sprint backlog, but may rearrange them as necessary to indicate which stories
    are most important.


    ## Making Major Changes to Stories Within a Sprint


    If a significant change needs to be made to the stories in the sprint backlog,
    and that change really can''t wait until the end of the sprint, the scrum master
    should stop the sprint and start a new one, with a new sprint planning ritual.
    Because of the interruption and the cost, this is a very drastic option. It should
    only be employed as a last resort, if it''s obvious that none of the work being
    done in the current sprint backlog is appropriate for the changed needs of the
    product owner.


    During the sprint, developers pick stories from the top of the sprint backlog
    every time that they complete a story and need something new to do. Each engineer
    should choose the story at the top of the backlog, because that''s the one the
    product owner considers the highest priority in the current sprint. Picking stories
    that aren''t from the top of the backlog will result in work being done out of
    priority order.


    ## Working in Priority Order


    Because stories are always chosen from the top of the backlog, engineers who have
    completed their work and are looking for a new story will usually end up taking
    on stories that aren''t in their specialization at some point. This is intentional,
    as it creates an opportunity for engineers to learn more about the code base and
    gain experience outside of their area of expertise.


    While it''s valuable to have the most skilled talent working on the stories that
    are most appropriate for their specialties, it''s also valuable for a team to
    share knowledge, so that everyone has a clear sense of what''s involved in developing
    and maintaining the whole product. This helps the team become more versatile,
    provides learning and growth opportunities, improves everyone''s ability to estimate
    new stories, and prevents mission-critical information from being the exclusive
    responsibility of one person. Finding the proper balance of efficient development
    and knowledge sharing is up to each team.


    ## Scrum Board


    Figure 5.4. Scrum Board


    The sprint backlog is often the first column of the scrum board. A **scrum board**
    tracks the progress of all the stories being worked on in the current sprint until
    it meets the team''s definition of done. Most scrum boards use two or three columns,
    and move stories from one column to the next to reflect which stories are in the
    prioritized backlog, which are in progress, which are in QA, and which are ready
    to be demoed.


    Scrum boards provide a focus for the entire team. By looking at the stories on
    a scrum board during the sprint, anybody on the team should be able to get an
    immediate snapshot of where the sprint stands, and how the team is progressing
    toward meeting the goals it set for itself. A good scrum board should be public,
    so that people outside the team can also take a look and see what''s happening,
    encouraging transparency across the company.


    There''s wide range of tools available for monitoring the progress of stories
    through a scrum board. The most basic approach is simply keeping index cards taped
    to a wall where everybody can see them. For teams that are co-located, this serves
    a number of useful purposes. Not only does it encourage the use of index cards
    and handwriting for keeping stories short and succinct, it also creates a natural
    gathering place for daily standups, as well as a shared visual reminder of where
    the team is up to.


    ## A Physical Board Carries Risk


    A physical board made of index cards on the wall is subject to abuse, neglect.
    If you''re going to use a physical board, it''s a good idea to take photographs
    of it daily and publish those changes online. Apart from using a physical board,
    many companies have developed electronic tools that allow teams to track stories
    as they move from one state to the next. Some tools may simply support points,
    various states, and even set access levels. It''s up to each team to decide which
    tool''s philosophy best matches their own.


    Among the most popular current tools for tracking and management are:

    - Pivotal Tracker

    - Jira Agile

    - Trello (with scrum plugins)


    ## Definition of Done


    Figure 5.5. Definition of Done


    We''ve mentioned the definition of done a few times. The **definition of done**
    applies to each story in a sprint backlog. Declaring a story to be done is a means
    of verifying that all of its critical aspects have been completed based on the
    way each team works.


    It''s vital for a team to have a shared idea of what done actually means for itself.
    Teams should create a written definition of done which they maintain as a checklist
    for every story they work on. This definition should be independent of the documentation
    for a specific story or project, because the definition of done should apply to
    the way a team works.


    A definition of done is something the team should come up with together. It may
    be created during the first sprint planning, and iterated on during sprint retrospectives.
    A team''s definition of done may evolve over time, as the team realizes during
    retrospectives what aspects of the process may need improvement.


    It''s not a bad idea to publish the definition of done prominently. This allows
    people both on the team and outside the team to understand just how much effort
    is involved in completing any story.

