    scrum. I''ve been wondering how design is supposed to be part of the scrum process,
    and it never seems to be very clearly spelled out. Some people say that integrating
    design into a scrum process is best done by carving out a separate design sprint
    before each development sprint, making the whole process less agile. Other approaches
    seem to advocate asking the designer to fit in between the cracks in the scrum
    process, or to become a pseudo engineering resource on the team. None of that
    sounds very appealing to me. I already feel as if I''m doing too much of my work
    at the last minute. I don''t like the idea that what I do may either slow down
    the scrum process, or that I might find myself more time pressured by having to
    fit in with a scrum team.


    ## An Executive Role


    I provide leadership for the entire company. That can mean a lot of different
    things. When it comes to engineering, it means providing direction on how the
    product needs to evolve based on my understanding of the marketplace. It''s up
    to me to inspire the engineering team to create the products we need in order
    to stay competitive and grow.


    ## Motivations


    Ultimately, if I don''t do my job well, nobody in the company has a job. That''s
    a big responsibility, and I take it seriously. I need to make sure the products
    we''re developing satisfy customers and support the bottom line.


    ## Frustrations


    Because of my perspective on the marketplace, I get a bird''s-eye view of what''s
    happening around us, and what we need to do next. I can''t always tell everybody
    all the factors that go into the decisions I make, but I need people to trust
    that I know what I''m talking about when I say something needs to happen now.
    It''s hard to build a team around you that can understand this and communicate
    your message to the people doing the work. It''s kind of like building a ship
    in a bottle sometimes.


