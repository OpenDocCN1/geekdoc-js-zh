    people making the decisions and setting the budgets. Those ideas are passed on
    to


    product managers, who create a long product roadmap. They establish and collect


    requirements, write out classic product requirement documents, and then pass those


    requirements on to designers to create prototypes as wireframes and mockups. Those


    prototypes are passed on to an engineering team that implements those ideas, and


