  mdcn: '

    随着产品开发的进展，让运营团队（Operations）保持信息畅通非常重要，这样就可以考虑任何可能对服务和资源的可用性产生影响的产品变更。一个优秀的 Scrum
    团队包含了工程师和产品负责人（Product Owners），他们能够识别出变更何时可能对系统或网络负载产生影响，并会咨询合格运营工程师的意见，以帮助用户故事（Story）的规划。


    ### 运营与结对编程


    让运营人员脱离其职责进行结对开发可能是不切实际的，尽管开发者偶尔与运营工程师进行结对编程，对于增强他们对影响产品可用性问题的理解有所帮助。


    ### 经理


    Scrum 的优势之一是团队有机会进行自组织，并找到迭代开发产品的最佳方式，即不断测试、做出更改并在过程中改进。这意味着团队对自己的行为负责，并围绕以最有效的方式完成工作这一目标进行组织。结果是，经理有时可能会对自己在
    Scrum 组织中的角色感到困惑。


    Scrum 的自组织性质与公司的层级结构无关，公司层级结构会为员工分配不同的角色和职责。Scrum 对组织的层级结构不应有任何意见，正如组织的层级结构不应对
    Scrum 流程产生影响一样。


    在任何公司，管理都是一个至关重要的角色。经理负责招聘、解雇、分配资源以及在整个组织中代表员工。如果没有经理，当 Scrum 流程之外出现需要解决的问题时，员工将无处求助。经理通常对团队的生产力负责，包括向高级高管汇报结果，并展示运行中的
    Scrum 流程的价值。


    经理也可能以开发者的身份参与 Scrum 团队。通常，工程部门管理职位的人对团队可能面临的某些问题有更深的经验。这些经理可能担任架构师或高级开发人员，并可能有价值的知识可以分享。在
    Scrum 团队内部，经理被视为开发者之一，不会获得比团队中任何其他开发者之外的权限。


    ### 作为开发者的经理


    在某些组织中，经理的角色被视为蔑蔑的。我们都见过《狄尔伯特》（Dilbert）漫画中那个留着尖头头发的老板形象。Scrum 的优势之一是，它不在乎经理在 Scrum
    流程之外的表现如何，只要提供了足够的资源来支持持续的 Scrum 流程。一个有效的 Scrum 团队应该独立于这些刻板印象运行，但在 Scrum 团队中与经理作为同伴工作的机会也有助于改善
    Scrum 之外的沟通。


    团队中对与经理作为同伴互动感到不适的员工，或者对在 Scrum 内权威减少感到不适的经理，应该与 Scrum Master（Scrum Master）讨论这个问题。一个强大的
    Scrum Master 将具有处理管理和权威问题以及这些问题与 Scrum 之间关系的经验。


    ### 世界其他


    Scrum 团队并非在真空环境中运行。在 Scrum 团队之外，有一个需要开发产品的组织，无论出于什么原因。Scrum Master 的职责之一是向公司的其他部分宣传
    Scrum 的价值。与此同时，还有责任确保 Scrum 确实在服务公司以及 Scrum 流程利益相关者的需求。


    这些利益相关者包括公司的高级高管、正在开发的产品的用户、委托创建产品的客户（无论是在公司内还是）以及公司内部的其他群体。


    从外部来看，Scrum 看起来像是一个谜团。尽管强调透明性，但 Scrum 的术语可能会让不熟悉这些术语实际含义的人感到困惑。Scrum 创建的产物和图表可能暗示了并不存在的含义。来自
    Scrum 团队外部的任何困惑都可能影响 Scrum 的稳定性，包括资源分配以及故事进入流程的流量。


    ### 用户


    Scrum 团队最明显的利益相关者之一是产品开发旨在支持的用户群体。用户应该在每一个故事中都可见，即使该故事没有影响网站的前端界面，或显示在移动设备的屏幕上。管理员也是用户。填充产品的内容经理也是用户。任何与产品交互的人都是用户。


    对于用户来说，产品是用 Scrum 开发的事实很重要。然而，用户测试是开发的重要部分。


    ### 客户


    客户可能是客户，或者是公司内部的另一个部门。无论如何，与客户的直接互动是产品负责人的责任。一个优秀的产品负责人是团队与客户互动混乱之间的坚实防线。如果团队觉得他们来自客户的影响太大——这种影响没有通过产品负责人的适当过滤——他们应该随时寻求
    Scrum Master 的帮助。


    ### 高管和其他员工


