    "I can agree to that, I guess," the product owner says.


    The engineer nods, and the scrum master goes on, "So does this still feel like
    a th thirteen to everybody, given what we just talked about?"


    "I don''t think the code''ll be bad enough for a twenty," another engineer says.
    "We

    can stick it in a separate branch, and use explicit naming conventions. As long
    as

    it''s tagged properly, it''ll be easy to back out."


    "Then I guess I can go with thirteen," the first engineer says.


    "Great," the scrum master says. "Then this is a thirteen, and we still need somebody

    to take responsibility for writing up the re-factoring chore."


    "I''ve got it," the first engineer says, still frowning at the product owner,
    who nods

    in agreement. "And I''ll be sure to bring it up at the retrospective, to make
    sure we

    commit to it like we agreed."


    ## Agreeing to a Sprint Backlog


    The product owner doesn''t have any new stories to introduce other than the one

    about the puppies. That makes establishing a prioritized sprint backlog much easier.

    Using the team''s numbering convention, that story is labeled **11-1**.


    There are a couple of stories that haven''t been completed in the previous sprint,

    and one that''s still in QA. The product owner decides it''s more practical to
    let the

    engineers working on those stories to finish them instead of pulling them off
    and

    making them work on the new story first.


    The sprint backlog includes all the points for the stories that weren''t completed
    the

    previous sprint, along with the new thirteen-point story. The total goal of 24
    points

    is a little high, given the team''s previous velocity average of 18. But in this
    case that

    total includes several points from stories already partially completed, so the
    team

    agrees that it is feasible.


    The engineer who argued that the puppy story should be estimated at 20 points

    plans to set aside time to write up a chore for the refactoring that''s needed,
    so it can

    be introduced as soon as possible.


    Once the sprint backlog is complete, the scrum master makes sure that everybody

    in the team agrees to it, and that the product owner will be satisfied with the
    product

    increment represented by those stories. Then, with everybody in agreement, the

    scrum master launches the sprint.


    Here''s what the sprint backlog looks like at the start of sprint eleven:


    Figure 7.2. Sprint 11 Initial Backlog


    ## Summary


    So not everything has gone perfectly smoothly, but when in life does everything
    go

    perfectly smoothly? On real web and mobile development teams there are often

    long-overdue refactorings that need to be considered, personality differences,
    con-

    flicts of interest, and genuine disagreements over the details of what needs to
    be

    done next.


    Scrum isn''t going to make these things go away, but it provides processes for

    working through them in a professional and productive manner, and for discussing

    them openly so that the process can be improved every sprint.


    In this chapter, we''ve seen a new-requirement show up on the product owner''s
    desk,

    pushing existing plans for future development down, and forcing a discussion about

    technical debt in the codebase. But the team has been able to evaluate the story,

    estimate it, and commit to it based on the modified acceptance criteria.


    In the next chapter, we''ll see the team work through the sprint and tackle the
    new

    puppy story. We''ll find out whether they can actually complete it within a single

    sprint.


    ## Chapter 8


    ## Working Through Scrum


    In the last chapter, we were introduced to the product owner''s world, and taken

    through the process of developing and creating a story for the team. We saw how

    requirements were gathered, how the product backlog was built up, and how the

    expectations of internal and external clients, along with other interested parties,

    translated into clearly defined scrum stories for the team.


    Then we went through the process of seeing how stories are introduced to the team,

    and how the team estimated them. We watched as the team negotiated with the

    product owner to make sure that what they were going to work on made sense,

    and was capable of being finished within a sprint.


    Now it''s time to follow that story through a sprint. In this chapter, we''re
    going to

    see how the team divides up a large story like the one we''ve been discussing
    into

    smaller tasks, and distributes these out so they can all be worked on and completed.

    We''re going to see how all aspects of the story get addressed until they meet
    the

    definition of done.


    Finally, we''re going to see the team go through the demo process with the product

    owner, and with any luck, maybe the story will be accepted at the end of the sprint.


    Either way, there''s certainly going to be a lot to discuss at the retrospective.
    Let''s

    find out what happens.


    ## Working Through a Story


    By the time the planning meeting has ended, the team has committed to new sprint

    backlog. As you may recall, the scrum board currently looks like this:


    Figure 8.1. Sprint 11 Initial Backlog


    ## Taking Ownership


    The next morning, the team has the first standup of the new sprint. As usual,
    the

    team goes around the circle, with each engineer reporting on what they''ve done

    since the last standup, what they''re planning to do until the next standup, and

    whether they have any blockers. The first three engineers still have cleanup work

    from the previous sprint. But the fourth engineer, the most junior on the team,
    doesn''t have any

    work to do, and is available to take on a new story.


    "Looks like I get to take the big one," the junior engineer says nervously. There''s

    some humorous cheering from the rest of the team.


    "OK, we''re putting your name on it," the scrum master says.

    "I guess I''ll start tasking out," the junior engineer says, "but I''m gonna need
    some

    help. Does somebody want to pair with me?"


    "Sure, we can work together," the next engineer says.


    "Great," the scrum master says. "So you two are a team, and you''re working on
    this

    story. Got any blockers yet?"


    "Just the usual sense of intimidation," the junior engineer says. "But I guess
    we''ve

    got this."


    ## Defining Tasks


    The first thing to do when taking on a big story is task it out. This means defining

    the individual subtasks that can be worked on in parallel, so that the story doesn''t

    get trapped in one person''s head. Some teams prefer to split stories into tasks
    during

    the planning meeting, but this team has decided that the person who takes ownership

    of the story will also be responsible for breaking out the tasks.


    Depending on the preferences of the team, tasks can be written just like stories,
    or

    they can be written as technical specifications more appropriate for sharing ideas

    among engineers. Tasks can also be entered into a number of scrum board tracking

    systems, so they can be tracked and assigned to different people as they go through

    development, review, and QA.


    The pair of engineers responsible for the puppy story works through the sub elements

    that will be necessary to make the story a reality. It takes several hours, and
    they

    have to call in the product owner a couple of times to clarify points. By the
    time

    they''re done, they''ve broken out more than six tasks, each of which will need
    to be

    done before the story can go to QA for final testing.

