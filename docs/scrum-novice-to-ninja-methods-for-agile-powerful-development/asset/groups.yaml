    ## Second Standup


    On the second day of the sprint, the product owner and the QA engineer both attend
    standup. As the rest of the team is about to dismiss, one of the engineers speaks
    up. "I have a quick question about the way it should work. I was thinking about
    last night, is that something you think can handle?"


    "I think I see the problem," the product owner says. "I can write up a story that
    addresses the way I think it should."


    "Are we going to add that as a new story?" the scrum master asks.


    "It feels like scope creep to me," the first engineer says.


    "No, I think it''s covered by the acceptance criteria for the original story,"
    the product owner says. "These are pages on the site, and they need to be handled
    like any other pages."


    "Let''s check the acceptance criteria and make sure," the scrum master says. Together,
    the four of them go over to a computer, pull up the scrum board, and take a look
    at the acceptance criteria for the story as the team has estimated it. In fact,
    the acceptance criteria do say that the changes in the header to support beta
    users of puppy site need to accommodate all of the pages on the site, without
    distinguishing help pages.


    "Well, that''s going to be a tricky one," the first engineer says.


    "Do we need any further details about how it should be implemented once we have
