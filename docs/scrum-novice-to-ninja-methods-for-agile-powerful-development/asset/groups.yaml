    they expect to complete a story before the next standup, and if they have vacation


    time coming up. Knowing the availability of other people on the team can inspire


    teammates to plan their work around upcoming stories, and arrange to switch pairs


    or allocate resources appropriately.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_86_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_86_1.png)


    **What to work on next?**


    If an engineer is unclear about what should be worked on next, the priority of
    the


    sprint backlog should guide these decisions. The product owner is responsible


    for grooming the sprint backlog throughout the sprint, and making sure that it
    al-


    ways represents the priority in which the stories should be addressed.


    Unless there''s a compelling technical reason, any engineer without a current
    story


    should start working on the story at the top of the backlog with the next highest


    priority, regardless of specialization. Following this pattern can provide an
    oppor-


    tunity for engineers to pair with somebody in an area where they have less exper-


    ience, and help spread knowledge about the entire code base throughout the team.


    Finally, the scrum master may make announcements that have relevance to the


    entire team at the end of the standup—once everybody has had a chance to report,


    and only if there''s time left. This shouldn''t become a replacement for any organiza-


    tional team building that may come from company meetings, team lunches, and


    other gatherings.


    **Sprint Demo**


    At the end of the sprint, everything that was worked on for the current sprint
    is


    demonstrated for the team, the product owner, and anybody who''s invited to observe.


    This ritual is called the sprint demo, and it gives all of the engineers the opportunity


    to demonstrate the stories they''ve been working on that they consider complete.


    The sprint demo is the product owner''s opportunity to test each story, see if
    it meets


    the acceptance criteria, and then either accept or reject it.


    Scrum: Novice to Ninja


