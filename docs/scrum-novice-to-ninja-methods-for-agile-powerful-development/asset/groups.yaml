    ## Chapter 7

    ## The Lifecycle of a Story


    We''ve gone through scrum in detail, talking about the roles, rituals and artifacts
    necessary to keep a scrum team running smoothly. We''ve discussed the attitudes
    of the team members, and the concerns people have when coming into scrum. Now
    it''s time to start looking at the actual scrum process.


    To do that, let''s start at the very beginning. In this chapter, we''re going
    to meet a product owner, and learn how the idea for a change in an existing web
    and mobile product can go from general thoughts, to specific user expectations,
    to stories ready for the team to work on.


    We''ve already started talking with the folks on the WithKittens team, and we''re
    going to keep working with them. We''ll discuss what the product looks like to
    start with, and what changes the product owner decides to introduce. Then we''ll
    see those changes crystallize into full stack slices of functionality for the
    team to estimate and deliver.


    As we go through this process, keep in mind that this team''s approach to implementing
    the details of scrum may be different from your team''s approach. For example,
    each team has its own relative scale of points, and has to adhere to its own definition
    of done. The important things to keep an eye on are the fundamentals that we''ve
    discussed in the previous chapters.


    ### Why isn''t scrum standardized for every team?


    You may be asking why scrum isn''t simply standardized for every team. One of
    the advantages of scrum is that each team starts with a shared set of general
    concepts, and then iterates toward the process that works best for them. That
    usually results in a fairly consistent definition of done, but it varies depending
    on the development and deployment context for each team. For example, points are
    completely relative to the tasks the team actually tackles, so they can vary wildly
    from team to team.


    ### What''s WithKittens?


    The WithKittens team consists of six engineers, one product owner, and one scrum
    master. They''ve been working together for about three years, with a little turnover,
    and have produced both a website and a mobile application designed to add pictures
    of kittens to any image uploaded by their clients.


    Most of the users of the service stay in a free tier forever, merely adding kittens
    to their own social media images and sharing them, which promotes WithKittens
    thanks to embedded text that overlays the generated images. But this is also a
    critical service for some customers, who pay handsomely for the privilege of knowing
    only the very best kittens will be added to their images consistently and reliably,
    with a great deal more control over the quality and content than free users get.
    Making these paying clients happy, and making sure their service is rock solid,
    is what keeps the lights on and supports users on the free tier.


    The team''s expertise includes image processing specialists, back-end data processing
    and API management engineers, front-end engineers for both web and mobile interfaces,
    as well as billing and security experts. The product owner has a background in
    product management for both desktop and web applications, as well as a few years
    of experience in front-end engineering. The scrum master has worked in both product
    and project management.


    In addition to the core team, there''s a dedicated designer on the Design team
    who works with the product owner on the service, as well as a pair of QA engineers
    who report to a different manager, and a small team of DevOps engineers who keep
    the site running and also handle IT issues.


    A lot of what the team does might be familiar to any web or mobile development
    company, such as user management, security, and billing. The unique facets of
    the service include details such as figuring out the ideal positioning of kittens
    in pictures, as well as the best ways to optimize images for proper delivery.


    ### Why Just Kittens?


    The founder and CEO of the company has a long history of working with cat rescue
    societies. The idea for the service began as something to support one local nonprofit
    organization, and grew quickly as other nonprofits—and eventually users—decided
    they also wanted to be able to add kittens to their pictures.


    Most of the paying customers for the service are high-end social media users,
    as well as people who want more control over the way their kittens are presented
    in their pictures. But there''s also a growing business clientele, including companies
    in marketing and promotion who use the WithKittens service to add appeal to their
    materials.


    Because of the popularity of kittens in general on the internet, the company''s
    focus on kitten-only content has never been a serious issue before, although it''s
    been the subject of some discussions. Until now, any questions about plans to
    expand beyond kittens have always been brushed off with vague references to the
    company''s historical focus on cat rescue, and the importance of kittens to their
    ever-growing user base.


    ### Client Desires


    The one place in the company where the push to expand beyond kittens has been
    strongest is from the sales department. Some members of the sales team have felt
    that their ability to grow has been hindered by the fact they can''t target companies
    looking for puppies. Recently, the head of sales sat down with one of the company''s
    largest clients, a multinational conglomerate, and learned that they were planning
    to switch contracts to a competitor over this. The following excerpt from an internal
    sales memo highlights the issue:


    > "We''ve been supporting them for more than a year, and haven''t had any complaints
    about the service. They currently account for seven percent of our revenue. But
    they keep asking us why they can''t add puppies to their images. Puppies are just
    as cute and just as common on the Internet as kittens, and they want to be able
    to appeal to a broader audience. We''re running out of excuses. Our competition
    supports adding baby animals of all types, even though we know they can''t match
    us for quality and control. But that won''t matter if we can''t be flexible. If
    we can''t satisfy them, we''re definitely going to lose them."


    This memo catches the attention of the founder, who reluctantly calls in the product
    owner for a meeting. Among the issues they discuss are the value of adapting to
    changing market expectations, and the appropriateness of adding a service that
    conflicts with the historical intent of the company—not to mention the company
    name.


    Together they decide they need to do some work on puppy-friendly features—just
    to figure out what it might take to support puppies in addition to kittens, given
    their current infrastructure. Among the critical issues they feel it''s important
    to keep in mind are the overhead of maintaining an entirely independent service,
    versus the cost of developing and supporting an integrated service.


    Because of the urgency of the sales memo, they decide this is a high enough priority
    that it has to bump their critical seasonal push to integrate the new Persian
    and Angora kitten promotion for the holidays, which the team is scheduled to work
    on next. The product owner goes back to the head of product with the details of
    that discussion, and receives approval to make that change to the prioritization.


    ### Product Backlog


    With a fresh mandate, the product owner goes back to the product backlog, where
    all future ideas for the service are tracked. It''s almost painful to push some
    of the other high-priority ideas down on the list, but it''s clear this is going
    to be done first.


    After a day or two of research on competing services, the product owner pulls
    together the details of the idea. Most of the other services put the animal choice
    late in the process for customers, almost as an afterthought.

    '
