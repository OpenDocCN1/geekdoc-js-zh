    [content]


    ## A Brief History of Scrum


    The original concept for scrum came out of Japan, introduced in 1986 as part of
    *The New Product Development Game* by Hirotaka Takeuchi and Ikujiro Nonaka. They
    applied the concept of a scrum, taken from the team game rugby, to describe cross-functional
    team organization based around moving forward in a layered approach.


    Their concepts were codified as the Scrum Methodology at a joint presentation
    in 1995 by Ken Schwaber and Jeff Sutherland, based on their personal experiences
    applying the concepts in their own organizations. This work inspired the 2001
    book, *Agile Software Development with Scrum*, written by Schwaber and Mike Beedle.


    At the time, the most prevalent approach for software development was called the
    **waterfall model**. Under the waterfall model, product development happens in
    stages, leading sequentially from requirements through design, implementation,
    and release. Until the 1990s, most software development was targeted at packaged
    software delivery for desktop computers. Such products had long development and
    release cycles. While waterfall is well-suited to products that have a long development
    trajectory, it doesn''t adapt well to situations where the product needs to change
    constantly in response to changing conditions.


    In the mid-to-late 1990s, new publishing models emerged involving electronic media
    and the Internet. To support these, software development organizations had to
    incorporate more flexibility to adapt to changing browsers, tight media deadlines,
    and a variety of platforms with different requirements. Soon after that, the development
    of large monolithic software applications that lived on desktop computers gave
    way to smaller, more nimble apps that were delivered through mobile devices. A
    different approach was needed for developing these.


    It isn''t a coincidence that agile approaches became codified, and quickly became
    popular, just as the marketplace was shifting from desktop software to web and
    mobile software.


    ## Comparing Scrum and Waterfall


    The slow cycle of waterfall development may still be appropriate in a world of
    hardware development, or even in gaming. These industries rely on long, stable
    markets, where many of the decisions are either repetitive, constrained by external
    resources, or need to be made far in advance because of the massive scale and
    expense of development.


    Web and mobile technology moves too fast for a waterfall approach. By the time
    you''re done developing a solution to one problem and gathering feedback from
    users, the technology has already moved on, and you may have a very small window
    of opportunity to capitalize on your solution.


    Figure 1.1. Waterfall


    In a waterfall approach, the ideas for what needs to be developed may come from
    customers, from the executives, from market research, or from the imagination
    of people making the decisions and setting the budgets. Those ideas are passed
    on to product managers, who create a long product roadmap. They establish and
    collect requirements, write out classic product requirement documents, and then
    pass those requirements on to designers to create prototypes as wireframes and
    mockups. Those prototypes are passed on to an engineering team that implements
    those ideas, and produces a product that can finally be released to the marketplace.
    Until that product is released and put in the hands of customers, no feedback
    into the process is generated.


    In an agile organization, guiding objectives and key performance indicators guide
    the process, but the team manages itself to meet those objectives. A product owner
    maintains the overall vision, and works with the scrum master to make sure that
    everyone on the team is clear about the objectives and how they''ll be measured.


    The input of the designers and the engineers is included at every stage in this
    process. Features are conceived and formulated into stories when the team is ready
    to work on them. No idea gets locked into a static product timeline.


    The value to a company of hiring its own team of designers and engineers is that
    these people can bring their design thinking and their current technical knowledge
    to the table for the benefit of the organization''s own objectives. Designers
    should be evaluating the user experience and figuring out the best solutions to
    real customers'' problems, not decorating bad ideas to make them functional.


    Getting engineers involved in ideation allows them to pull in the latest technology
    as early as possible, since they''re in the best position to know what''s technically
    feasible. The sooner the designers and engineers are brought into the planning
    process, the more agile development will be.


    Scrum allows the full resources of the team to be applied when and where they
    can do the most good, and to work together in a sustainable and productive way.
    Instead of waiting until the entire cycle has completed before any data can be
    fed back into the system, ideas are generated at every stage, and encouraged to
    bubble to the surface at the end of each sprint. Total participation of the team
    in every stage of the process allows these ideas to feed into the objectives,
    and support the vision of the organization.


    ## Mixing Scrum With Waterfall


    Figure 1.3. Waterfall (With Scrum for Engineering)


    While some organizations may claim to follow scrum, many of them actually follow
    a modified waterfall approach, using scrum techniques only for development. The
    rest of the organization structures itself around long-lived product timelines
    with static objectives. While that may be an improvement over pure waterfall,
    in that it allows the engineers to iterate and improve their process, it doesn''t
    take full advantage of the potential of scrum. Isolating scrum inside the development
    loop without inviting the learnings of the team into the planning and market testing
    process is a waste of resources, and a wasted opportunity.


    Mixing a little scrum into an otherwise waterfall organization is usually not
    a good idea, since it can draw attention to the fundamental conflicts and foster
    friction.


    ## Reasons to Choose Scrum for Web and Mobile


    We''ve covered how scrum works, and why it''s a productive way to structure web
    and mobile development. At this point, it''s worth taking a moment to recap some
    of the highlights of how scrum applies particularly to web and mobile development.


    Fundamentally, scrum offers a team-based approach to project work that allows
    a product development process to benefit from iterative self-reflection, helps
    a team learn how to estimate their own ability to address unfamiliar tasks, exposes
    metrics about team effectiveness, encourages dialogue about feature implementation
    instead of static specifications, and supports rapid response to changing market
    conditions in a sustainable manner.


    All of those advantages can make a real difference when doing web and mobile development.
    Most work in web or mobile development tends to be very time sensitive, and needs
    to respond quickly to the marketplace. Whether that means new browsers, new technologies,
    or new messaging that needs to be communicated immediately, web and mobile teams
    have to be able to respond quickly.


    Scrum provides a framework that allows developers to work toward a vision, and
    the opportunity to shift direction as the environment changes without feeling
    torn away from their focus.


    When following best development practices, the type of work that''s involved in
    building and enhancing a web or mobile project tends to break down into discrete
    pieces that can be worked on independently, with a core of infrastructure stories
    that support a broad range of independent feature stories. This makes it easier
    for one part of a web or mobile project to be developed in isolation, and leverage
    the shared resources of other parts of the same project.


    Scrum encourages teams to spell out the work on a new feature so it can be developed
    in parallel, without relying on other undeveloped features. By using stories,
    and making sure each story is properly formatted and estimated, the team sets
    itself up for a consistent and productive development experience.


    [/content]

