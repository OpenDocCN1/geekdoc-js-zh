    ## 跟踪进度


    一旦定义了所有任务，初始小组确定了任务的优先级顺序，并决定哪些任务需要先完成，以支持其他任务的开发。他们认为自己具备完成第一个任务所需的技能，因此他们将自己分配给该任务，并开始工作开发代码，没有寻求额外的帮助。此时，他们将“幼狗故事”的首个任务移动到“进行中”列：


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394.png)


    图 8.3 第 11 迭代的首个任务


    稍后后，团队中的另一位工程师完成了一个故事，与 QA 一起检查以确保其已完成，然后就可以开始处理新故事了。工程师检查了看板，发现这个高优先级故事的几个新任务尚未开始。在与第一组小组确认任务之间不会有任何重叠后，该工程师接手了顶层故事中下一个优先级最高的任务，更新了
    Scrum 看板，并开始工作。


    一旦第二个任务进入进行状态，Scrum 看板看起来像这样：


