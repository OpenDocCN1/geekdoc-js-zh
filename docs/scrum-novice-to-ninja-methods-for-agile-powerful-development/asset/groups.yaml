    "It''ll be just as confusing if they get offered kittens and puppies on a site
    that''s clearly just about kittens," the second engineer replies. "Besides, the
    whole navigation is built around kittens, including the URL scheme and the API."


    "Yeah, what about the URLs?" the first engineer asks the product owner. "Everything
    about our site says it''s about kittens."


    "We''ll have to handle that with messaging," the product owner says. "This is
    a limited test, and people who opt in will have to do so intentionally, understanding
    that this is a beta."


    "Are all those edge cases handled in the copy?" the first engineer asks.


    "Yes, I have messaging written for all of those conditions, and I plan to make
    myself very available to the team in case things come up while working, so we
    can address them without interrupting progress."


    At that point, the scrum master asks, "OK, does everybody know enough about the
    story that they feel comfortable estimating it?"


    There is a moment or two of silence as the engineers look around at each other,
    and then the first engineer who had spoken before says, "I think we need a little
    more clarity on the scope of this."


    ## Defining Scope


    "So how is this going to affect the experience of the rest of the site?" the first
    engineer asks. "I see that the user who''s chosen to see puppies will only see
    puppies on this particular page, but what about on the rest of the site?"


    "The scope of the changes will be limited to the pages being changed," the product
    owner explains. "That means the test users might experience a visual disconnect
    when they leave these pages and navigate to other parts of the site, such as the
    billing and confirmation pages. After all, we''ve got a lot of kittens and kitten-related
    themes running through all the pages. But it''s out of scope to make broader changes
    to the entire site just for this test."


    "Is there something else we can do?" another engineer asks. "We have the alert
    only on these pages. Can we have them on the rest of the site as well?"


    "I''m worried about making changes that will affect people not involved in the
    test," the product owner says. "I don''t want to make this any bigger than it
    has to be, and I certainly don''t want to put the stability of the site as a whole
    in danger."


    "I don''t think it would be that hard," the engineer goes on. "We already have
    the ability to turn on an alert that can be shown on every page of the site. Remember,
    we did that during the last holiday promotion."


    "Can we make sure this will be limited to the people who opted in?" the product
    owner asks.


    "Sure, that won''t be a problem," the the engineer replies. "In fact, we could
    even make it so that the people who are selected for the test could opt in later,
    if we wanted to."


    "I don''t think that would be necessary," the product owner says. "Let''s try
    to do this as simply as we possibly can."


    In the end, the product owner decides that it''s sufficient if visitors who have
    opted in to the puppies retain the alert about the puppy beta at the top of the
    page as long as they are in puppy mode. It will be there to remind them that they
    have selected puppies instead of kittens, despite the strongly kitten-oriented
    messaging on the rest of the site. That change is added to the acceptance criteria,
    which now include a line looking like this:


    - Given a logged-in user who has opted in to the puppy beta

    - when that user visits any other page on the site

    - the alert banner at the top of the page should be present, reminding them that
    they''re in puppy mode, and allowing them to opt out


    At this point, another engineer points out that visitors who have selected puppies,
    and created content using puppies, could lose what they have created if they opt
    out elsewhere on the site.


    "It depends on how we implement it," another engineer says. "But it''ll be awkward
    to keep the custom elements available for people who have opted out of puppy mode."


    "What do folks think would be easiest?" the product owner asks. "Should we try
    to retain mixed content, or should we force people to delete custom content if
    they disable puppy mode?"


    After a little bit of discussion, the team decides that the best solution to this
    will be for the opt out link on the alert to take people to a page warning them
    that any puppy-related content they have created in that mode will be lost when
    they opt out. This will be an inconvenient but appropriate action for that page
    during the beta, regardless of whether they''ve arrived there from the content
    creation section, or from elsewhere on the site.


    To handle this, the product owner changes the acceptance criteria around the opt
    out link:


    - Given a logged-in user has opted in to puppies

    - when that user clicks the opt-out link

    - that user should be taken to a confirmation page warning that they''ll lose
    any puppy-related content if they opted out


    "Does that look good to everybody?" the product owner asks.


    There are nods of agreement from all around the table. One or two of the engineers
    say "Yeah."


    "Great!" the scrum master says. "Let''s vote."


    ## Debating Effort


    The team has chosen to use a Fibonacci scale to estimate points. When the scrum
    master calls for a vote, each of the engineers shuffles through and picks the
    card that represents the amount of effort they think this task will take: one,
    two, three, five, eight, thirteen, or twenty.


    "We''ve got five thirteen and twenty," the scrum master reports. Historically,
    this team assigns twenty to stories that they don''t believe can be completed
    within a single sprint. Even thirteen-point stories are questionable. "Do you
    want to tell us why you think this would be a twenty?"


    "It seems to me like there''s a lot of unknowns," the engineer who voted twenty
    says. "This is the first time we''ve tried to do something like, and I know our
    database is pretty tightly integrated with the whole kitten concept."


    "Yeah, you''ve got a point," one of the other engineers says. "We''ve been talking
    about refactoring out the kitten terminology for a long time, and it''s never
    been high enough priority for us to get it."


    "Do we really need to do that in order to make this?" the product owner asks.


    "The code is going to look really ugly unless we do," the first engineer replies.


    "I get that," the product owner says, "but we don''t have that luxury right now.
    If we can get this prioritized, maybe the issues that come up as we work through
    this story will help define how the refactoring needs to go. Is that a possibility?"


    The engineer shrugs. "We''ll see."


    "OK," the scrum master says, "can we agree to move forward with this story as
    a test—if we get the assurance that the re-factor will be the next top priority
    after that?"

