    Unlike many charts in a business environment, the point of the velocity chart
    isn''t


    to see a constant increase, but rather to see the values converging around a consistent


    horizontal line. That line represents the amount of work the team can realistically


    and sustainably accomplish in a single sprint.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_115_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_115_1.png)


    **Velocity is a Tool for Estimation, not a KPI**


    People outside the scrum process may be confused about the nature of the velocity


    chart. From a management perspective, there may be an impulse to favor an in-


    crease in the amount of work a team is doing, and look for velocity to grow over


    time. But a velocity chart is intended to trend toward a horizontal average. You


    may hear executives talking about trying to increase the team''s velocity, or
    celeb-


    rating a sprint in which the velocity was higher than typical sprints. Get ahead


    of these conversations by reminding everyone that the point of velocity tracking


    is to improve the team''s ability to estimate how much work they can get done


    consistently and reliably. A velocity chart that shows a constant increase (or
    de-


    crease) over time usually reflects a problem in the process.


