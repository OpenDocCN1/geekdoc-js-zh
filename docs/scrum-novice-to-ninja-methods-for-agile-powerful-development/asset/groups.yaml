    ## 团队成员


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_57_0.png)


    图 3.4. 开发团队的角色


    大多数 Scrum 团队由四到八名工程师组成。他们的专业领域应该经过规划，以支持团队将要负责的工作类型，以便他们能够进行良好的估算，并产生符合团队“完成定义”（definition
    of done）的结果。


    团队成员预计要积极参与所有的 Scrum 仪式（scrum rituals），并以透明的方式运行，让每个人至少能外围了解同事正在工作的内容。


    ## 交叉培训


    专业化对于工程师的职业发展至关重要，但在 Scrum 团队中，并不假设任何一个工程师会对所有用户故事（stories）的某个特定方面负专属责任。Scrum
    的力量之一在于它提供的透明度，这使得来自不同背景的工程师都能了解开发团队所接受的工作中任何方面所涉及的内容。


    Scrum 鼓励工程师共同工作。一种被称为**结对编程**（pair programming）的实践——源自敏捷技术“极限编程”（Extreme Programming）——对于
    Web 和移动项目中的工作类型通常非常实用。结对编程提倡将不同经验水平的人配在一起共同编写同一份代码，以便每个人都能从对方的视角中获益。


    这种方法的优点是，关于产品在做什么以及如何开发其每个部分的知识在整个团队中共享。我们不鼓励只存在于单个工程师脑中的信息孤岛，转而鼓励与他人沟通。并不要求每个人都是产品所有领域的专家，但每个人都应该准备好与自己通常舒适区之外的专家共同工作。


    结果是，起初工作速度可能稍微慢一点，因为人们需要适应节奏。但很快就会形成一种更深层次的共享上下文，这将加速估算和开发。如果有人中了彩票并决定退休，团队也将变得更具韧性。不会留下巨大的知识空白。虽然可能有很大的接班工作需要完成，但至少会有人对涉及的内容有一定了解。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_58_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_58_1.png)


    ## 结对编程


    结对编程的要求非常高。其中一些预期是两个人共享一个显示器，并交替输入代码（驾驶/driving）和跟踪下一步需要发生什么（导航/navigating）的责任。伙伴在工作时应该不断保持交流，伙伴中的任何成员都不应允许电子邮件等干扰干扰这一过程。大多数伙伴发现，在这种模式下，他们每天的工作时间不会超过六小时，但生产力的提高和对团队稳定性的益处值得这种权衡。


    ## 职责


    对于 Scrum 流程而言，团队成员对正在开发的产品质量负责，并对整个团队 Scrum 流程的维护负责。这是每个团队成员都有通过其履行职责的方式有权影响两个方面。


    产品质量由团队接受或拒绝故事的能力提供支持。如果呈现的故事不够清晰，或者根据项目历史来看可能不可能或不实际，团队应该将工作质量放在首位，并坚持要求产品所有者（product
    owner）重写或撤回这些故事。


    估算完成一个故事所需的工作量也是团队职责的一部分。随着团队共同工作并获得不同故事的经验，他们应该开始对性质相似的故事建立共享且主观的相对工作量标准。工作量通常以任意点（points）衡量，由团队分配，以帮助确定他们在特定时间内可以完成多少工作。这有助于产品所有者计划新功能可以多快地完成。


    考虑到项目的实际限制，团队预计会抵制任何为了速度而牺牲质量的尝试。此外，团队应该跟踪代码库的整体质量，并提出重构现有代码的故事以增强可维护性，或支持不断出现的技术标准。保持代码的整洁、自文档化和内部一致有助于团队中的每一个人更有效地协作工作。


    团队的每位成员还负责为其他所有成员维护 Scrum 流程。如果有人中断了站会（standup），或试图在冲刺（sprint）期间对某个故事引入更改，每个团队成员都应该有权中断这种行为。团队中的任何人发现组织职级被用来影响
    Scrum 流程，都应该在当时、回顾会议（retrospective）期间或私下向 Scrum Master 反映。


    团队成员认真对待对同事的这一责任至关重要。Scrum 的力量在于它在群体中创造的动态。未能维护 Scrum 流程就是让其他团队成员失望。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_59_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_59_1.png)


    ## 团队成员人人平等


    尽管团队成员可能向 Scrum 上下之外的一个或多个经理汇报，但在 Scrum 团队内部，所有团队成员都被认为是平等的。团队成员不应向产品所有者或 Scrum
    Master汇报，因为这会在敏捷角色与每个员工在组织层级中的独立地位之间产生紧张关系。如果 Scrum 团队内部员工之间存在资或汇报关系，在遵循 Scrum
    流程时应当忽略它们。任何发现组织职级被用来影响 Scrum 流程的人都应该将此引起 Scrum Master 的注意，可以在当时、回顾会议期间或秘密进行。


    ## 成员的一天


    大多数时候，团队成员会在一天的大部分时间里编写代码，时间块尽可能长且持续。团队成员的核心日常职责非常简单：


    - 开发、检查和记录代码

    - 从产品所有者处获取澄清、故事细节和反馈

    - 参与 Scrum 仪式

    - 与 Scrum Master 协作消除团队障碍


    描述一个 Scrum 团队时，脑海中浮现的最常见形象可能是团队参与每日站会，我们将在 Scrum 仪式的章节中详细讨论这一点。每个团队成员都预计在这个十五分钟的简短窗口内随时可用并做好准备。团队通常会安排这个时间，使其不会干扰团队的工作流。


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_60_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_60_1.png)


    ## 什么时候进行站会


    对于某些团队来说，将站会安排在午饭前后或工作日开始是最合理的。非同地工作的团队可能需要选择一个适用于跨时区人员的时间。团队始终根据冲刺回顾期间收集的反馈调整时间。


    在安排了其他 Scrum 仪式的日子里，所有团队成员都预计出席并积极参与。Scrum 仪式的设计是为了有效利用有限的时间，同时产生可预测且有价值的结果。优秀的
    Scrum Master 会安排为每个仪式维护一个时间盒（time box），以便时间投入和最终结果是可预测的。


    '
