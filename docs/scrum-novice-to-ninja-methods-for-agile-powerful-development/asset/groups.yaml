    ## Team Resources


    A scrum team doesn''t work in a vacuum. There''s usually an organization that
    exists around scrum, and that supports the efforts of the scrum team with the
    resources it needs to produce the work. There''s a two-way relationship that must
    be maintained between the scrum team and the rest of the organization, so that
    each is able to benefit from the process.


    Just as the organization and its hierarchy should have no influence on the rituals,
    artifacts, and roles of scrum, scrum has no formal opinions about how the outer
    organization is structured. Scrum can exist successfully in a rigidly tiered company
    with clearly defined titles and roles just as easily as it can work in a "holacracy"
    (an organization without any formal chain of command). As long as the scrum team
    is provided with the resources it needs, and can justify its existence by producing
    the results that the organization wants, the relationship should be maintainable.


    There are sometimes different opinions about how the resources a team needs should
    be provided. An agile approach to working this out is to try one way, notice how
    well it works, and iterate to find what''s most productive.


    In particular, there are a few key resources most scrum teams doing web and mobile
    development find themselves needing that aren''t formally defined as part of scrum.


    ### Designers


    A critical input into any web or mobile project is design. Designers help establish
    the user experience, the flow, and the visual consistency of a project. With the
    trend toward design thinking as a process, designers have become elemental in
    all phases of product development, from initial problem definition through wireframing,
    creating style guides, building graphical assets, validating visual consistency,
    and doing user experience testing.


    Designers work closely with product owners during the development of new stories.
    In most cases design choices drive ideation, and much of the innovation in how
    a product evolves iteratively comes from the designer. But designers also need
    to be available to team members when questions of layout and style come up. Sometimes
    designers need to be prepared to drop everything and produce assets, or make decisions
    that are critical to unblock developers in the middle of a story. Switching between
    high-concept thinking and detailed, hands-on production can make the designer''s
    role very challenging.


    Some teams choose to integrate designers into the team, and include them in all
    the rituals. The advantage of this approach is that the designer is constantly
    aware of how the team is working, and able to give immediate feedback by participating
    during story creation as well as estimation and development. A designer who chooses
    to work as part of the team should be prepared to commit to the scrum process
    just like any other team member.


    However, unlike most members of a scrum team, a designer is usually not trained
    or inclined to work as an engineer, or to pair with other engineers on development
    work. Additionally, the skills and responsibilities of a designer may not lend
    themselves to paired work with engineers not trained in design themselves. Because
    of this, a designer who''s integrated into the team may need to be treated differently
    from other team resources. This can sometimes create a sense of imbalance, leaving
    the design role feeling poorly integrated.


    Another approach that many teams use is to create an extended sprint sequence,
    with a separate design sprint that precedes the development sprint. This helps
    isolate the work of designers from the work of engineers, while still keeping
    designers integrated into the scrum process as members of the team.


    Using the design sprint approach can be effective, but it limits the agility of
    scrum. Because design sprints happen before development sprints, the team is effectively
    committing to working in increments that are twice as long. This means that the
    product owner''s ability to adjust requirements needs to be pushed out an additional
    sprint, so changes need to be planned that much further in advance. For some teams
    this may be a good solution, as long as they''re prepared to accept the tradeoffs.


    A third method worth considering is maintaining a separate Design team, and treating
    them as a resource. Designers on the Design team can be called upon to participate
    in the ideation, story creation, asset development, user flow testing, or anything
    that the scrum process needs. Because the designers are independent of the scrum
    process, they''re welcome to attend the rituals as guests, but aren''t required
    to be active participants.


    A Design team that operates as an independent resource may choose to structure
    itself using a different agile approach known as **kanban**. Kanban is similar
    to scrum, but instead of operating in sprints with contracted deliverables at
    predetermined intervals, a kanban team commits to a specified amount of work-in-progress.
    Kanban teams can accept new stories from the product owner without advance planning,
    as long as the resources of the team are never committed to more than the amount
    of work they''re capable of doing sustainably.


    ### Kanban


    The details of kanban are more complex than what we''ve covered here, but it''s
    another approach worth looking into for organizing work that involves a constant
    flow of services. In particular, kanban is very effective for managing the workflow
    of organizations such as Operations and Customer Support, where there''s a steady
    stream of similar stories that all need to be addressed, and that frequently require
    rapid response on a priority basis.


    ### QA Engineers


    Quality assurance is the responsibility of every member of the team, but most
    organizations have professionals who are specially trained in the techniques of
    creating and managing test suites. For web and mobile work, this can be an intricate
    and complex process, involving tools that simulate the behavior of a wide range
    of devices and browsers, and automation to follow both common and uncommon paths
    through a product.


    QA engineers may be isolated into their own group, working independently of the
    team doing the development of the product. When this is the case, coordination
    with the team is critical. Unless QA is taken into account early, a scrum team
    may find itself rushing to complete stories before the sprint demo meeting, and
    then dumping a load of work onto the QA team at the last minute, so that stories
    will be ready to demo.


    Not unlike designers, QA engineers are sometimes given a separate sprint to do
    their testing. This avoids the issue of trying to get the stories verified quickly
    at the end of every sprint, but it introduces the same kind of reduced flexibility
    as having a separate design sprint. Further, when it comes time for a demo of
    the stories, most of the team has already moved on to newer stories, and the details
    of the previous sprint''s work may not be fresh in their minds.


    The biggest problem with isolating QA from development is that engineers feel
    free to take on the next story on their list before the previous story has been
    verified as done. Frequently in a web and mobile context, stories will build on
    each other in subtle ways, even if the stories are technically independent. This
    can lead to situations where the work on a new story needs to be redone based
    on inconsistencies found when testing a prior story.


    Ideally, QA should be considered part of the team''s definition of "done" for
    any story. This means that QA engineers should start writing the tests for a story
    at the same time that developers are creating the code. The QA cycle for a story
    should be part of the sprint, and the developers working on a story shouldn''t
    abandon it to start something new until QA has been completed.


    On some teams, QA engineers are integrated into the team directly. This provides
    a number of advantages. The skills and training of development and QA engineers
    are complementary, and people in both roles can benefit professionally from pairing
    with each other to learn more about the techniques and approaches they use. A
    team with integrated QA engineers also naturally considers testing and validation
    as part of the effort of rendering a story, and makes sure stories are sized and
    scheduled appropriately to include that.


    ### Operations


    The folks who keep the networks running and handle technical support for a company
    are often part of the same Engineering department that''s the home of the product
    development team. Because of this, some companies try to integrate the people
    on these teams into their scrum process. But the structure of the organization
    shouldn''t influence the needs of a scrum team.


    Unless there is a compelling reason, it can be a bad practice to try to integrate
    Operations engineers into a product development scrum team. While the people in
    Operations are trained engineers, the responsibilities they handle should live
    independent of the product development process. Keeping the networks up, the computers
    running, and the servers online is constant and challenging in a different way
    than product development. It can be dangerous to confuse these roles unlike design
    or customer service, it can be practical to treat Operations as a separate team,
    perhaps using a kanban approach to help them manage their sustainable workflow
    and prioritization.

    '
