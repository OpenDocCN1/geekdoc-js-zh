    engineer to play a broader role on the team, but it also opens up new opportunities

    for learning and growth. The stability provided to engineers by commitment to
    a

    sprint, and the confidence that the requirements they''ve agreed to won''t change

    until the sprint is over, may be strong selling points in an organization where
    interruption and chaos have been a problem.


    Adopting agile isn''t a one-way conversation. The champions of scrum should listen,

    and learn from the concerns of the people who are going to be asked to change
    their

    approach during this process. For everybody, it''s useful to remember that scrum
    is

    always an experiment that''s just going to last for the length of the next sprint,
    with

    the opportunity at that point to revisit and change anything that doesn''t seem
    to be

    working. Sometimes the experimental nature of scrum is one of the most compelling

    arguments for giving it a try.


    ## Training


    Although scrum isn''t that complicated, and can be described pretty thoroughly
    in

    a book, it''s invaluable to have the team trained by someone from outside the
    organ-ization who understands agile.


    An objective, third-party trainer can step into an organization and see problems
    in

    a way that a person inside the organization may not be able to. A good trainer
    will

    also be able to coach people through some of the more subtle or complex aspects

    of the process, making sure they have a full understanding not only of what they''re

    doing, but why they''re doing it.


    Scrum training can take one or two days for the entire team, and may be best done

    off-site, in a neutral place where people won''t be distracted by the day-to-day
    work

    currently going on. Don''t try to shortchange your organization by giving them
    less

    training than they need. It''s too easy to start applying the labels of scrum
    to a process

    that''s anything but agile.


    ## Do Not Use Scrum as Simply a New Way to Describe Existing Processes


    It''s a mistake to think of scrum as a new way of talking about an existing process.

    Scrum isn''t just a set of fancy vocabulary words. There are teams that start
    using

    scrum tools without proper training, and end up following the same broken process

    that hasn''t worked for them in the past, while applying labels such as "sprint"
    or

    "story," or having hour-long daily "standup" meetings. Don''t let your team be
    one

    of these.


    Getting everybody''s active and focused participation is important for the scrum

    training to take root. Anybody who isn''t properly trained may not understand
    how

    scrum is supposed to be applied, and that can lead to frustration and confusion

    that''s easily avoided with a little preparation.


    The list of people to invite to the training should include some representatives
    of

    senior management, as well as all the people in the organization who are going
    to be

    participating in the rituals on a daily basis. You don''t have to get everybody
    in

    the company trained, but anybody whose role involves direct interaction with the

    scrum team is a likely candidate.


    ## Staffing


    It may not be necessary to hire anybody new in order to implement scrum in your

    organization. Most of the roles in an agile team can be filled by people who already

    exist in the organizational hierarchy.


    A product manager may be a likely candidate for the product owner role on a scrum

    team. Engineers—whether junior, senior, or management—should all be considered

    equal on the development team for the sake of scrum, despite the differences in

    their ranks in the organization. Often QA engineers are also included in scrum,

    which provides a number of benefits in terms of redundancy, cross-training, and

    organizational reach.


    Project managers may be the best people already working in the organization to
    step

    into the role of scrum master, with some training about the differences between

    the skill set involved in managing projects versus running scrum. In a pinch,
    any

    member of the development team can be trained to act as scrum master. However,

    a good scrum master may be the best new hire to make when implementing scrum.

    Somebody who understands how scrum works, and is familiar with the issues that

    can arise, can smooth out the rough edges more easily than a person just getting
    up

    to speed with the process. It''s less important for a scrum master to be familiar
    with

    the type of work you''re doing than it is to have someone good at coaching people

    through the scrum process.


    ## Tracking Effectiveness


    Scrum is all about establishing a sustainable process that adds real value, and
    re-viewing that process on a regular basis in order to make sure it''s producing
    the de-sired results. So why not use agile techniques to make sure scrum is working
    for

    your company?


    One of the most useful techniques when implementing scrum in a new organization

    is to establish a baseline of productivity before scrum, and use that to measure
    the

    effectiveness of scrum. Where you establish that baseline, and how you measure
    it,

    are very subjective. Each organization has its own standards and productivity
    indic-ators.


    For example, a web team may judge itself based on the number of features it''s
    able to add. A mobile development team may track how quickly they get from concept
    to implementation. Before implementing scrum, you''ll have a comparison to use
    the performance. If the team mentions at the retrospective that the time box was
    too short, it can be extended by consensus for the next sprint.


    ## Troubleshooting


    It would be lovely if everything just worked as you expect. That doesn''t happen
    in the real world. Scrum has built-in checks and balances to make sure the team
    is always

    responding to changing conditions. Scrum breakdowns tend to follow familiar patterns
    across organizations. Let''s take a look at a few of the aspects of scrum we''ve
    discussed, to see where issues are likely to

    crop up, and how to address them.


    ## Undefined Time Boxes


    When a team is starting out using scrum, they may not understand how much time
    to

    allocate for their rituals. Defining a time box in which the ritual must be completed

    helps focus everybody''s attention, and shows respect for the team''s time. There''s
    a

    temptation for new teams unsure about how much time to allocate to leave the time

    undefined for the aspects of the ritual.


    It''s especially important when teams are starting out to define time boxes explicitly

    for every aspect of the ritual. Sometimes these time boxes may just be guesses,
    and

    the team will need to learn by iterating from sprint to sprint how much time

    they need. It''s better to propose a wildly incorrect time box and try to enforce
    it

    than it is to leave the time box loose. The exercise of proposing and enforcing
    time boxes demonstrates respect for the team''s time, and respect for the process.


    There are some experts who advocate reducing the length of time boxes to the

    minimum length possible when teams start exceeding their time boxes consistently,

    and then working closely with the team to help them get through all the stages
    of

    each ritual within the very time that''s been allocated. This helps establish

    the importance of defining and respecting the time box for each aspect of the
    ritual.

    And if the team mentions at the retrospective that the time box was too short,
    it can

    be extended by consensus for the next sprint.


    ## Optimizing for Sprints


    There comes a point at the end of many planning rituals when the team is agreeing

    to a backlog for the sprint. At this stage, the product owner should already have

    organized into priority order the stories that have been estimated, and considered

    what would make a sensible increment for the product at the end of the sprint.

    As estimated stories get moved into the sprint backlog, the team discusses how

    much work they believe they can get done that sprint. Often, the last story added

    to a sprint backlog will not be large enough to bring the team up to their projected

    velocity based on their historical performance. At that point, the team may try
    to

    negotiate with the product owner about the order of the remaining stories, in
    order.

