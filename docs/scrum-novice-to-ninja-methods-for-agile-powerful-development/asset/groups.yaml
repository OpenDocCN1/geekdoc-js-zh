    ## Sprint Backlog


    The **sprint backlog** is the set of developer stories that the team has committed
    to working on during the current sprint. A sprint backlog is created as part of
    the sprint planning ritual, and reflects the shared understanding of the team,
    the product owner, and the scrum master of what everybody will be working on for
    the coming sprint.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_107_0.png)


