    **You Don''t Need to Set Aside Capacity for Bugs**


    It''s not necessary to set aside a percentage of the team''s capacity to deal
    with bugs.


    The amount of work the team can predictably complete in a typical sprint includes


    the effort applied to fixing bugs when stories were accepted as done, but didn''t


    actually meet all the acceptance criteria.


    **Tasks**


    There''s an old joke that scrum is a system for improving a team''s ability to
    ship


    technical debt. Certainly there''s more to developing a web or mobile application


    than just tacking on a bunch of features onto an ever-growing, increasingly complex


    code base. Eventually that code needs to be re-factored, infrastructure changes
    will


    have to be worked on, and a team won''t be able to do effective work on new features


    until these issues are addressed. These necessary improvements may have no spe-


    cific value for the customer, but they are necessary to keep the code from becoming


    stale or difficult to maintain.


    Tasks relating to code maintenance should be included in the work done by the


    team, and prioritized in the sprint backlog, but should not be estimated with
    points.


    The points in scrum measure the ability of the team to deliver value to the customer,


    and are related to feature development. They are not a measure of the overall
    amount


    of work the team is doing.


    A task usually does not deliver any tangible user value. But tasks need to be
    done,


    and a negotiation needs to happen between the team and the product owner during


    the sprint planning if the team recognizes that necessary work to keep systems


    maintainable and avoid technical debt is being deferred in favor of new features.


    **Spikes**


    Most of the stories that make it to a sprint planning should be within the technical


    capability of the team, but occasionally there will be stories that require deeper
    re-


