    ## 第二次站会


    在迭代的第二天，产品所有者和 QA 工程师都参加了站会。当团队其他成员准备散会时，一位工程师站了出来。“关于它的工作方式有一个简单的问题。我昨晚在想，你认为可以处理吗？”


    “我看到问题了，”产品所有者说，“我可以写一个符合我想法的故事。”


    “我们要把它作为一个新故事添加吗？”Scrum Master 问。


    “对我来说这范围蔓，”初级工程师说。


    “不，我认为原始故事的验收标准已经包含了，”产品所有者说，“这些是网站上的页面，需要像处理其他页面一样处理。”


    “让我们检查验收标准并确认，”Scrum Master 说道。他们一起走到电脑前，打开 Scrum 看板，查看团队估算的故事的验收标准。事实上，验收标准确实说明支持网站测试用户的头部更改需要适应网站的所有页面，而不区分帮助页面。


    “好吧，这将是一个棘手任务，”初级工程师说。


    “一旦有了产品所有者的更新文本，我们还需要关于如何实现的进一步细节吗？”Scrum Master 问，“或者你们中有人可以负责编写规范并将此任务添加到看板？”


    “我可以来，”初级工程师说，“但这看起来确实会给故事增加比我们预期的更多的工作。”


    “是的，”另一位工程师同意道，“我们对这个任务的估算点数不够。”


    “好吧，我们现在无法更改点数估值了，”Scrum Master 说，“这只是另一个数据点。我们只能尽力而为。”


    “这意味着你不认为你们能在迭代结束前完成这个故事吗？”产品所有者问。


    “我们得看看，”初级工程师回答道。


