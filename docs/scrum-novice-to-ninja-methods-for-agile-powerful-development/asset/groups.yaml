- md: '

    engineering managers tell me there are fewer personal conflicts on the team, since
    everybody has a chance to raise issues and get them resolved every sprint.


    It''s also really great being able to check the scrum board and know immediately
    what''s being worked on, who''s doing the work, and where it stands. Before, engineering
    used to be this black box that I couldn''t get a clear picture of without long-drawn-out
    explanations. And I do understand that nobody wants an executive looking over
    their shoulder, asking lots of questions when they''re trying to do their job.
    But now I can get all the information I need just by looking at the board and
    asking the scrum master a few questions.


    ## What Still Frustrates Me


    Looking at the overall picture, I''m getting used to the idea that scrum doesn''t
    add overhead, but it''s still something I''m adjusting too. We didn''t have a
    dedicated project manager before, and now the scrum master fills that role. I
    can see that things wouldn''t get done in the same way without somebody to run
    the process, and I''m impressed with what we''ve been able to achieve—though I''m
    still keeping my eye on that bottom line.


    And to be perfectly honest, the other thing about scrum that I still need to get
    used to is that it defines roles for everybody in the engineering organization,
    but it doesn''t seem to have a formal role for me. I don''t like being told that
    my ideas need to be set aside until a new sprint starts, and I''ll admit I don''t
    always intend to play by the rules where that''s concerned. As the person ultimately
    responsible for making the decisions about what the company needs to do, I do
    have insights and ideas that are relevant. I feel that I should be more deeply
    involved in how engineering works. I always used to be before. I can see that
    scrum tries to lock me out of that process.


    ## What I Do About It


    When I run the numbers, scrum adds up. Even though it looks like a lot of extra
    meetings and some extra headcount to manage the process, I can see that the team
    is getting more work done more efficiently, and people are happier at their jobs.
    My managers tell me scrum is making their jobs easier, too.


    Now that I''ve seen the process, and watched a few of my ideas filter through
    onto the scrum board and get delivered at the end of a sprint, I''m getting a
    little more comfortable with scrum. I miss walking around in engineering and making
    suggestions based on the big picture, but I''ve been doing this long enough to
    know that''s an expensive luxury when you''re dealing with an engineer''s time.


    Scrum lets me treat the engineering organization as a resource that I can understand
    and track with numbers and statistics, and gives me the information I need to
    understand what everyone in the organization is working on without interrupting
    them. Ultimately, I need to put my focus on the work being produced, and scrum
    gives me valuable insight into how long the team is going to be working on the
    features we need to keep this company going strong.


    ## Conclusion


    This feedback speaks a lot about working through problems that can come up on
    a scrum team. One of the things we see in many of these comments is that the solutions
    come from working with people and with the processes that scrum provides. Scrum
    isn''t going to solve all the problems in an organization, and it''s not going
    to address issues that have to do with anything other than the planning and estimation
    of the work that needs to be done.


    Scrum provides the tools and techniques necessary to bring issues to the surface
    every sprint, and to address these issues before they become standard operating
    practice. By leveraging the planning that goes into each sprint, and the opportunity
    to discuss problems and experiment with ways to address them through the retrospective,
    a team can constantly improve on its own ability to use scrum effectively.


    Perhaps the best thing about scrum is that it creates a community of encouragement,
    based on a mutual understanding of what everybody is working on and how it all
    fits together. In an effective scrum team, members support each other in maintaining
    the process and addressing practices that might undermine the scrum team. It''s
    to everybody''s advantage to help each other.

    '
  mdcn: '

    工程经理告诉我，团队中的个人冲突减少了，因为每个人都有机会在每个迭代（sprint）中提出问题并解决它们。


    能够查看 Scrum 看板（scrum board）并立即知道正在进行什么工作、谁在做工作以及进度如何，这真的非常棒。以前，工程部门像一个黑盒，如果不经过冗长的解释，我无法获得清晰的状况。我理解，没有人希望高管在身后盯着，并在他们努力工作时问个不停。但现在，我只需要通过查看看板并向
    Scrum Master（scrum master）提几个问题，就能获得我所需的所有信息。


    ## 仍然令我困扰的


    从整体来看，我正在习惯 Scrum 不会增加额外开销这一观点，但这仍然是我需要调整的。我们以前没有专门的项目经理，而现在 Scrum Master 充了这一角色。我看出，如果没有人来运行流程，事情将无法以同样的方式完成，我们所取得的成就令我印象深刻——尽管我仍然关注着底线问题。


    坦诚地说，关于 Scrum 的另一个我仍然需要适应的方面是，它为工程组织中的每个人定义了角色，但似乎没有为我设定正式的角色。我不喜欢被告知我的想法必须被搁置，直到新的迭代开始，我承认承认在这方面，我并不总是打算按照规则行事。作为对公司需要做什么的决策负最终责任的人，我确实有相关的见解和想法。我觉得我应该更深入地参与工程的运作。以前我一直是这样的。我看出
    Scrum 试图将我排除在该流程之外。


    ## 我是如何处理的


    当我核算数据时，Scrum 是划算的。尽管看起来有很多额外的会议和为了管理流程而增加的人员，但我看到团队正在更高效地完成更多工作，人们工作得也更快乐。我的经理告诉我，Scrum
    也让他们的工作变得更轻松了。


    现在我已经了解了这个流程，并看到我的一些想法如何过滤到 Scrum 看板并在迭代结束时交付，我正变得越来越习惯 Scrum。我怀念以前在工程部门走动并根据大局提出建议，但我做这已经足够久了，知道在处理工程师的时间时，这是一种昂贵的奢侈。


    Scrum 让我能够将工程组织视为一种可以用数字和统计来理解和跟踪的资源，并为我提供了所需的信息，以便在不干扰他们的情况下了解组织中每个人的工作内容。最终，我需要将重点放在产出的工作上，而
    Scrum 为我提供了宝贵的见解，了解团队将花费多久来开发我们保持公司强有力运行所需的功能。


    ## 结论


    这些反馈反映了解决 Scrum 团队中可能出现问题的很多过程。我们在许多评论中看到的其中一点是，解决方案源于与人以及 Scrum 提供的流程进行合作。Scrum
    不会解决组织中的所有问题，也不会解决与所需工作规划和估算之外的其他问题。


    Scrum 提供了必要的工具和技术，以便在每个迭代中将问题暴露出来，并在这些问题变成标准操作惯例之前解决它们。通过利用投入每个迭代的规划，以及通过回顾会议（retrospective）讨论问题并尝试解决方法的机会，团队可以不断提高有效使用
    Scrum 的能力。


    也许 Scrum 最好的地方在于它创造了一个鼓励社区，这种社区基于对每个人在做什么以及这一切如何结合的相互理解。在一个有效的 Scrum 团队中，成员们相互支持维护流程，并解决可能削弱
    Scrum 团队的实践。互相帮助对每个人都有利。

    '
