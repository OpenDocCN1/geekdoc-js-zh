    Now that we have a handle on the roles, rituals, and artifacts of scrum, it''s
    time for

    us to take a look at the scrum contract. What is someone agreeing to when they
    start

    to work as part of a scrum team? What does it mean to work transparently? How

    does iterative improvement change the way we approach problem solving? We''ll

