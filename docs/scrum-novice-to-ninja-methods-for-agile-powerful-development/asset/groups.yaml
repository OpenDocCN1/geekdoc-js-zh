    现在我们已经掌握了 Scrum 的角色、仪式（rituals）和产物，是时候来看一下 Scrum 合约了。当一个人开始作为 Scrum 团队的一部分工作时，他们同意了什么？透明地工作意味着什么？迭代改进如何改变我们解决问题的方法？将在下一节中讨论这些问题及更多内容。


    ## 第 6 章：Scrum 合约


    在本书的前半部分，我们从抽象的角度讨论了 Scrum。我们讨论了它是什么以及如何运作的。我们将其拆解为角色、仪式和产物。但 Scrum 不仅仅关乎细节。Scrum
    关乎人。


    在下一节中，我们将看到 Scrum 的实际运作。我们将看看 Web 和移动端开发团队如何利用 Scrum 的各种特性。我们将从已经介绍过的团队开始。


    ### 初学者之心（The Beginner''s Mind）


    开始使用 Scrum 可能会感到有些不确定。关于它将如何影响我们的工作方式和互动方式有很多疑问。关于 Scrum 本身如何与组织层级互动也有疑问。正如我们在第二章中看到的，有些人进入
    Scrum 时带有先入为主的概念，这些观念可能会限制 Scrum 的潜力。


    在随后的章节中，我们将针对 Scrum 团队可能出现的问题进行一些排排除。在本章中，我们将讨论同意积极参与 Scrum 过程意味着什么。如果没有真实人的参与，Scrum
    就无法发挥全部潜力。Scrum 依赖于每个人履行其角色的职责，而 Scrum 使这些角色尽可能轻量且易于支持。


    我喜欢将其称为 **Scrum 合约**（scrum contract）。与我们之前讨论的产物不同，这不是一份实体合同。它是人们在接触像 Scrum 的事物时采用的一种心态。它并不要求摒弃健康的怀疑态度，但要求用开放的心态取代先入为主的概念。


    Scrum 合约围绕几个关键概念展开：


    - 尊重角色（Respecting Roles）

    - 拥抱透明（Embracing Transparency）

    - 维护边界（Maintaining Boundaries）

    - 充满希望地迭代（Iterating Hopefully）

    - 共享定义（Sharing Definitions）


    这些概念中的一些对于任何尝试过在团队中有效工作的人来说都是熟悉的。其中一些专门适用于 Scrum 的运作方式。所有这些都依赖于愿意为了共同目标共同努力。


    ### 尊重 Scrum 角色


    正如我们在第 3 章中看到的，Scrum 定义了若干角色供人们承担。这些角色在 Scrum 背景下有其用途，每个人都需要理解，无论他们与组织中的职位或头衔关系如何。Scrum
    并不是取代组织层级。事实上，Scrum 试图尽可能独立于组织层级。


    Scrum 期望人们能够区分他们的工作和他们在 Scrum 过程中的角色。这并不意味着 Scrum 免除了你对工作的义务。Scrum 提供的是对你所做工作的另一种视角。当你在
    Scrum 项目中承担一个角色时，你同意积极参与一个共享过程，以促进每个人正在进行的工作。


    在 Scrum 团队中承担角色的一部分，意味着愿意在 Scrum 仪式期间出现的问题上，以平等的身份与同事行动。任何参与 Scrum 的人都应该应该自由分享他们对项目和过程意见，即使这些意见违背主流，或挑战了组织层级中职位较高的人的权威。当冲突发生时，Scrum
    Master（scrum master）负责协助调解并促进对话。


    从更根本上说，参与 Scrum 假设愿意成为团队的一部分。Scrum 角色和仪式的设定使得每个人都有机会、也有义务参与。一个不分享意见和想法的团队成员是在让团队的其他人感到失望。作为
    Scrum 团队的成员，无论你在公司的职位如何，你的目标都是帮助支持每个人的流程。因为小组规模小且亲密，而且参与规则被明确定义，Scrum 为害羞的人实验性表达自己提供了一个安全空间。


    由于典型的公司会议与 Scrum 仪式之间的区别，人们可能会对预期的行为产生一些困惑。当出现此类问题时，Scrum Master 应该是最终的仲裁者。每个团队都要自己定义什么是最有用的行为标准，并恰当地执行它们。


    最终，这取决于对同事、对过程以及你在过程中位置的尊重。如果你有疑问，或者你认为某些事情运行不正常，总有机会在回顾会议（retrospective）上提出这些问题。不要错过积极参与的机会。


    ### 提供透明度


    为了让 Scrum 有效运行，团队中的每个人都需要愿意在过程的各个阶段让其他人知道他们正在做什么。有些人称之为为透明。它让每个人都能知道其他人在做什么，以便每个人都能对项目有更大的认识，以及他们如何提供帮助。


    透明度有多个用途。Scrum 的价值之一在于它让关于状态的大量信息对公司里的任何人可见，这样负责项目的人就不会被中断。通过为团队每天留出非常短且定义明确的时间进行更新，Scrum
    避免了每位工程师可能面临那些只想知道他们正在做什么的人的干扰。


    透明度还允许团队之外的人跟踪对他们可能特别重要的问题状态。Scrum 对冲刺（sprints）的定义使其不会被新的故事打断，但客户和组织周围的其他人员经常有他们想要引入的更改，他们可能认为这些更改是紧急的。Scrum
    的透明度让他们一眼就能看出团队现在正在做什么，以及为什么这些事情被按那样优先排序。


    Scrum 支持的透明度并不是为了微观管理。Scrum 的优势之一是它能够为团队成员创造尽可能多的不受管理的时间来让他们自我管理。没有人比负责故事的工程师更清楚完成该故事需要什么。Scrum
    提供了每日站会（daily standups）作为透明度的触点，以便工程师可以分享宝贵的见解。Scrum 假设参与过程的每个人最初都做出了加入团队工作的意识选择。在团队共同工作意味着让每个人知道你在做什么，并愿意分享信息和资源。


