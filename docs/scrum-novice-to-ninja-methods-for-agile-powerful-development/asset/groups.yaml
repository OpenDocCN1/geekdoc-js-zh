    As long as the team received points for a story that didn''t meet the acceptance
    criteria, the work to get it to the true done state shouldn''t count toward the
    points in any sprint.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_80_0.png) (img)


    ## You Don''t Need to Set Aside Capacity for Bugs


    It''s not necessary to set aside a percentage of the team''s capacity to deal
    with bugs.


    The amount of work the team can predictably complete in a typical sprint includes
    the effort applied to fixing bugs when stories were accepted as done, but didn''t
    actually meet all the acceptance criteria.


    ## Tasks


    There''s an old joke that scrum is a system for improving a team''s ability to
    ship technical debt. Certainly there''s more to developing a web or mobile application
    than just tacking on a bunch of features onto an ever-growing, increasingly complex
    code base. Eventually that code needs to be re-factored, infrastructure changes
    will have to be worked on, and a team won''t be able to do effective work on new
    features until these necessary improvements may have no specific value for the
    customer, but they are necessary to keep the code from becoming stale or difficult
    to maintain.


    Tasks relating to code maintenance should be included in the work done by the
    team, and prioritized in the sprint backlog, but should not be estimated with
    points.


    The points in scrum measure the ability of the team to deliver value to the customer,
    and are related to feature development. They are not a measure of the overall
    amount of work the team is doing.


    A task usually does not deliver any tangible user value. But tasks need to be
    done, and a negotiation needs to happen between the team and the product owner
    during the sprint planning if the team recognizes that necessary work to keep
    systems maintainable and avoid technical debt is being deferred in favor of new
    features.


    ## Spikes


    Most of the stories that make it to a sprint planning should be within the technical
    capability of the team, but occasionally there will be stories that require deeper
    research. Such stories trigger new tasks called **spikes**. Spikes are usually
    not assigned points. However, a proper spike does have acceptance criteria. There
    should be a clear and agreed outcome for any spike.


    Spikes take away from the resources of the team, while individuals go and research
    technical solutions that may be beyond the team''s current capabilities. As a
    result, the more spikes that are required to accomplish the goals of the product
    owner, the lower the number of points the team can accomplish in a sprint.


    Due to the unknown nature of spikes, they can eat up a lot of a team''s resources
    unless they''re constrained. Generally, when agreeing to include a spike in a
    sprint, the team will decide on a maximum amount of time and effort that can be
    committed before the spike must be concluded or abandoned.


    ## Committing to a Sprint Backlog


    Once all the stories that the product owner has presented have been estimated,
    all the participants in the ritual work together to come up with a backlog that
    makes sense for the upcoming sprint. This backlog will be sized based on the historical
    number of points that the team has been able to accomplish in the past, balanced
    against the point estimates for the new stories.


    While the product owner has final authority over the contents of the sprint backlog,
    as well as the order of the sprint backlog, the team has the opportunity to advocate
    for certain changes while the backlog is being prepared.


    For example, although each story should stand alone, it may make sense to the
    team to work on particular stories in a certain order. The team may also wish
    to complete stories that were started but not finished in the previous sprint.
    Completing stories that are in progress is useful for the development team because
    it helps them to maintain continuity. While there''s a cost to loss of continuity,
    that cost is the responsibility of the product owner, and the product owner has
    the authority to make those decisions for the sake of the product.


    Once a final sprint backlog has been created, everyone on the team needs to commit
    to that backlog. This is the last opportunity for the team to object, or raise
    issues that they think may have an impact on their ability to do the work required.
    If there''s still disagreement, the scrum master needs to step in and facilitate
    the conversation so that agreement can be reached.


    The end product of a sprint planning is a sprint backlog that everyone on the
    team can agree to. The scrum master should poll the room to make sure everyone
    agrees that the commitment is realistic, and that they are willing to take it
    on for the upcoming sprint. Then the new stories should be entered in order of
    priority into the tracking tools the team has agreed to use for the sprint backlog.


    Sprint planning reminds everybody exactly where they are in the process of building
    the product owner''s vision for the product, and what the objectives are for the
    upcoming increment. At the end of sprint planning, everyone on the team should
    have a good sense of what they need to do next, and a firm commitment to a set
    of prioritized stories to complete over the duration of the upcoming sprint.


    ## Daily Standup


    The daily standup is probably the first ritual that comes to mind when people
    think of scrum. The daily standup provides a heartbeat for the team, giving everybody
    a regular opportunity to get a clear picture of what other people on the team
    are working on, and what the status of the project as a whole is.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_82_0.png)

    Figure 4.3. Daily Standup


    ## Objective


    The purpose of the daily standup is to give everybody on the team an opportunity
    to share the status of the work they''re doing, and get help if anything is blocking
    their progress. Everyone on the team should pay attention as their teammates report,
    so they can have a clear picture of the status of the complete iteration they''re
    all working on.


    This is also an opportunity for anybody outside the team who''s interested in
    knowing what the team is working on to find out how stories are progressing, and
    what''s likely to be worked on next. Only team members are allowed to present
    at the daily standup, but anybody in the company may attend, and visitors should
    be invited to participate as silent observers.


    ## Time Box


    Traditionally, the daily standup is limited to 15 minutes. It''s a short ritual,
    and it''s kept short and made as convenient as possible so that everyone can commit
    to being present, participating actively, and paying attention. Everyone is expected
    to stand, both so that they pay attention, and to encourage all participants to
    play their part in keeping the ritual short. Most teams try to hold the standup
    away from their desks, and discourage people from using laptops and other devices
    during the ritual.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_83_0.png) (img/b1806dfc7ab8e46f442d54c1e56b9394_83_1.png)


    ## Keeping the Standup to Time


    Keeping the daily standup within its 15 minute time box is the responsibility
    of the scrum master, but everybody on the team should feel empowered to enforce
    the rules of the standup, so the time box doesn''t get broken.


    Different teams will choose different times of day to hold the stand up. Often
    first thing in the morning, or right before lunch, can be good times. These are
    natural breaks in the day that are usually common to most people on the team,
    so a 15 minute standup won''t disrupt the focus needed for longer blocks of programming
    time.

