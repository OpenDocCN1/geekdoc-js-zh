    允许围绕某个问题进行一段时间讨论是合理的，这样人们就有机会充分理解问题的各个方面，并承诺在冲刺（sprint）期间找到一个合理的解决方案。但如果这些讨论过度深入到如何解决问题的细节，那么为了尊重每个人的时间，可能是时候尽早结束讨论了。


    ## 总结


    在本章中，我们回顾了公司在开始实施敏捷开发（scrum）时可能采取的一些步骤。


    我们讨论了如何在整个组织中获得共识，包括工程内部和外部。我们讨论了如何对团队进行培训，以及培训师应该对团队做什么。我们谈论了人员配置问题，以及组织中的现有人员如何适应并承担财务流程的角色。我们还讨论了跟踪和衡量
    scrum 有效性的重要。我们还深入研究了团队在适应 scrum 过程中出现的一些问题，以及如何应对这些问题。


    151

    让 scrum 为你的 Web 或移动端团队运转起来


    ## 第 10 章

    ## 适应 scrum


    我们已经讨论了让 scrum 运行的系统。我们讨论了 scrum 在产品开发方面采用的方法，以及帮助担任 scrum 角色的人员以可持续、高效有效的方式完成工作的一些仪式和产物。


    但根结底，*scrum 关乎人*。如果你团队中的成员没有从工作中获得灵感和动力，scrum 无法介入并改变这一点。scrum 能做的是帮助擅长工作的人以更高效、更有效的方式合作，并不断改进。


    在第 2 章中，我们认识了团队的每一个人，并有机会讨论了他们对 scrum 的一些担忧。现在，他们已经在 scrum 环境中工作了一段时间，让我们再次来看看，看看他们是否已经学到了足够的知识来帮助他们解决那些担忧，以及他们是如何适应
    scrum 流程的。


    ### 高级工程师


    #### 最初担忧


    我进入 scrum 时很担心“流行术语管理”。我见过太多公司在口中抛出“敏捷”之类的词汇，却并没有真正理解它们的含义。有些人把敏捷当作增加会议次数的借口。也许会议让他们觉得更舒服一些。但这对我这样的人行不通，因为我承担的某些责任需要几个小时甚至几天不间断的时间才能做对。我不希望经理们在我身边转转转，把我拉进很多会议并转移我的注意力，分散我完成工作时所需的思考精力。


    #### 我学到的东西


    scrum 的理念是好的。重要的是付诸。我们现在花在与敏捷无关的会议上的时间大大减少了，这是一种巨大的解脱。当有人需要与我交谈时，我可以准确地指出我正在工作的内容，并解释我是否太忙以及为什么。如果有人突然提出了他们认为紧急的变更，我周围有一整支团队愿意维护冲刺的神圣性，这样我们就不必在处理这个新问题的同时调整我们正在工作的内容。


    同时，人们很容易看到谁在做什么，所以所有问题最终不会都都汇聚到我这里。现在团队中有更多的人在那些我曾经 100% 负责的代码部分上获得经验。这让我空出时间来做一些长远思考，并将我的知识应用到审查那些仍在学习我多年来总结的教训的人员的工作。


    #### 仍然令我沮丧的事情


    当你不确定下一步将走向什么方向时，规划和架构一个项目可能是困难的。例如，移动开发的某些方面需要比单个冲刺更长的时间。有时我们必须分层开发，始终考虑每个冲刺中哪些内容可以被视为一个完整的功能切片。


    scrum：从新手到大师

    154


    从技术上来说，创建一个足够灵活以适应每个冲刺可能发生的剧烈方向变化的架构是一项挑战。但当我看到用户故事（stories）明显不符合冲刺范围且需要拆分时，我正习惯向产品负责人（product
    owner）提出反对。这迫使我以更模块化的方式思考，并最终产生更灵活的代码库。


    现在我已经学会了 scrum 是如何运作的，最令我沮丧的事情之一是看到这种做法被滥用。当产品负责人试图在冲刺中途引入新的用户故事时，我会迅速提出挑战。这确实会发生，而且有时它有良好的业务理由。


    #### 我做的


    我最喜欢 scrum 的点之一是，让团队中的每个人的意见都一致非常有帮助。我正在习惯于这样一个事实：我不被允许直接说出我心里想的话。由于有了回顾会议（retrospectives），我有机会提出问题并确保这些问题的正当理由。


    ### 初级工程师


    #### 最初担忧


    我的角色对我来说仍然很新，我从来不是很外向的人，所以这很令人令畏。我特别担心比我经验丰富的人配对（pairing），并因为愚蠢的错误而感到尴尬。我也不喜欢频繁发言的主意。


    适应 scrum

    155


    #### 我学到的东西


    花了一段时间我才适应团队中的每个人都是平等的这一观点。起初，我不喜欢在会议上说话。但 scrum 仪式鼓励每个人参与，没有人可以在不说话的情况下脱身。一旦我意识到每个人犯错的概率和我一样，我就感到说出我心里想的想法更自在了。


    我也非常喜欢从与其他工程师紧密合作中学习到的东西。我接触到了一些如果我不在岗位上工作很长时间可能无法发现的工作方法。我们合作得越频繁，我就越容易从代码的某部分提取概念并将其应用其他地方。


    现在，当我面对一个不知道如何处理的用户故事时，我不再那么畏惧了。冲刺计划会议期间的讨论给了我机会去听听经验丰富的工程师认为任何故事的障碍是什么，这样我就知道该预料什么。而且我知道团队中有人拥有我需要的知识。与他们更紧密地合作让我有机会学习如何跳出我熟悉的教科书案例进行思考。


    #### 仍然令我沮丧的事情


    当我必须承担待办列表（backlog）顶端超出我经验范围的故事时，我仍然感到害怕。当我看到一个我想做的故事不在待办列表顶端，但我知道由于我熟悉它，我可以做得更好时，这尤其令我沮丧。有时我会动歪筋，想推迟某个故事的工作，以便在我真正想要的故事出现时能够处于获取它的位置。但我知道我不应该这样做，而且
    scrum 导师（scrum master）已经指出过几次这种行为了。

    '
