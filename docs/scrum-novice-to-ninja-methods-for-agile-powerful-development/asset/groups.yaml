  mdcn: '


    对于并非共同办公的团队来说，找到一个适合大家的时间可能具有挑战性，尤其是当团队成员处于不同的时区时。不应允许任何人经常缺席每日站会，但只要达到每日站会的目标，始终留有灵活调整的空间。


    即使不是所有人都能参加特定的站会，Scrum Master（敏捷大师）也应该为到场的人保持这一仪式。


    有时团队可能需要建立自己的体系，并在每个 Sprint 之间进行反思性的迭代。重点应该放在保持仪式简短、可靠地维持仪式，并确保它们提供了预期的价值，而不会产生过度干扰。


    ## 准备工作


    每位团队成员都应该在站会期间出席并在线。唯一必要的准备是让每位团队成员思考如何展示当前正在工作，使其对所有人来说清晰易懂。如果团队成员遇到了与团队外人员相关的阻碍，那么让那些人员做好准备在站会后立即讨论该问题是合理的。


    Scrum Master 在站会前不需要任何特殊准备。优秀的 Scrum Master 可以在站会前检查正在开发的 Story 状态，查看是否有待处理的更改，或者安排邀请
    Scrum Master 认为应该参加但通常不参加的嘉宾。


    ## 三个问题


    每日站会的核心是由 Scrum Master 巡视团队并向每个人提问三个问题：


    - 自从上次站会以来，你做了什么？

    - 你计划在下一次站会之前做什么？

    - 是否有任何阻碍了你的进度？


    应该尽可能简单。团队的每位成员都回答这些问题中的每一个，一旦最后一个人完成汇报，站会即结束。除非 Scrum Master 有需要向整个团队发布的紧急公告，否则所有与参加站会的其他人没有特定业务往来的人都可以自由地回到工作中。


    ## 警惕站会中的嘉宾


    作为嘉宾参加站会的人往往强烈倾向于提问、引入新信息或开始与整个团队无关的讨论。任何不是开发团队成员的人都不应该在站会期间发言。Scrum Master 需要坚决地抑制这种行为。组织架构中的高层人员在这一方面也不应获得特殊对待。每个人都需要尊重工程师的时间和注意力，让他们能够尽快回到工作中。


    在回答站会问题时，每位工程师都需要准备好简洁的描述，说明他们工作了什么、计划下一步工作什么，以及是否有任何阻碍。这是一项需要练习的技能，Scrum Master
    应该准备好指导每个团队成员如何回答这些问题，以最度地利用可用时间。


    如果一个人的汇报引发了一定的往复讨论，且对话对整个团队都有意义，Scrum Master 可以允许这样做。但这种互动必须限制，以尊重站会的时间盒（time
    box）。如果对话超过了几个句子，Scrum Master 应该介入并建议将对话移至线下。优秀的 Scrum Master 会记录下站会结束后需要进行哪些对话，并在之后跟进其状态。


    ## 其他状态更新


    有些团队选择在每日站会期间在团队共享的 Scrum 板上更新 Story 状态，而另一些则喜欢在 Story 完成时单独更新。无论何种情况，站会都应该是确保每个人都更新了他们正在工作的所有状态，并确保团队中的每个人都了解其他人在做什么的机会。


    对于进行结对编程的团队，站会可以是切换伙伴或切换 Story 的机会。一些进行结对的团队希望每个 Story 都由一名工程师从头到尾完成。允许多人配对同一个
    Story 对团队的灵活性是有益的，特别是当它涉及某些值得共享的核心功能时。不同的团队会产生不同的方法，但站会是每天进行更改的好地方。


    站会也是团队成员相互告知的机会，例如他们是否预计在下一次站会之前完成一个 Story，以及他们是否有休假。了解团队中其他人的可用时间可以激励同事根据即将到来的
    Story 计划工作，并安排切换伙伴或适当分配资源。


    ## 下一步做什么工作？


    如果工程师不清楚下一步应该做什么，应由 Sprint Backlog（迭代待办事项列表）的优先级来指导这些决策。Product Owner（产品负责人）负责在整个
    Sprint 期间整理 Sprint Backlog，并确保它始终代表了处理 Story 的优先级。


    除非有令人拒绝的技术理由，否则任何没有当前 Story 的工程师都应该开始处理 Backlog 中优先级最高的 Story，无论其专业领域如何。遵循这种模式可以为工程师提供在经验较少领域进行配对的机会，并帮助将整个代码库的知识传播整个团队。


    最后，Scrum Master 可以在站会结束发布与整个团队相关的公告——每个人都有机会汇报之后，并且仅在剩余时间的情况下。


    ## Sprint Demo（演示）


    在 Sprint 结束时，当前 Sprint 完成的所有工作将向团队、Product Owner 以及任何受邀观察的人演示。这种仪式被称为 Sprint Demo，它让所有工程师都有机会展示他们认为已完成的
    Story。Sprint Demo 是 Product Owner 测试每个 Story 的机会，查看它是否符合验收标准，然后决定接受或拒绝。


    ### 目标


    Sprint Demo 的目标是清晰地了解 Sprint 期间完成了多少工作，并查看在整合 Sprint 期间完成的工作后产品的当前状态如何。根据被接受的
    Story，团队可以学习更多关于他们在单个 Sprint 内可以持续完成多少故事点（points），这提高了他们未来估算 Story 和 Sprint Backlog
    的能力。


    ### Sprint Demo 中的嘉宾


    Sprint Demo 通常是嘉宾非常喜欢的仪式，因为这是 Scrum 团队之外的人员查看团队一直在忙什么，并根据最新工作成果观察产品在下一次迭代中状态的机会。但不应允许嘉宾的存在干扰仪式的目标或改变时间盒。嘉宾是观察者，而不是参与者。除非征求嘉宾的反馈，否则应要求他们对产品或过程发表评论。


