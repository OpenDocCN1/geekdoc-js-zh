    Scrum 师可能是开发团队的一员，但同样 Scrum 师也可能不参与团队的日常开发工作。对于已经遵循 Scrum 实践一段时间并对 Scrum 感到熟悉的团队，一个没有开发职责的单一
    Scrum 师可能同时负责两个团队。


