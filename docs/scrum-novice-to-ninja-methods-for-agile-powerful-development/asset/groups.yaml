    ### 两周是一个很好的起点


    对于网页和移动团队，两周的 Sprint 是一个很好的起点。两周的时间足够完成大多数与和移动项目相关的故事，包括大多数情况下的发布流程。如果你的网页或移动团队刚开始使用
    Scrum，值得尝试两周 Sprint，看看它是否适合你。


    即使你的故事倾向于是短且有限的，但一周 Sprint 也有值得考虑的缺点。某些较长的仪式每个 Sprint 重复一次。有一个一周的 Sprint 意味着频繁地重复这些仪式可能会开始影响效率。某些仪式，如回顾会议（retrospective），在某些周甚至被缩短或跳过，这会导致
    Scrum 的迭代改进方面出现问题。


    倾向于产生更复杂故事的团队可能更喜欢更长的 Sprint。请记住，超过两周的 Sprint 意味着问题需要更长时间才能暴露，并且积压列表的调整需要延迟到 Sprint
    完成后。更长的 Sprint 还鼓励创建更复杂的故事。网页和移动团队 Scrum 的目标应该是创建简单且独特的故事。


