    ## Product Owners


    Figure 3.3. The role of the product owner


    Unlike a scrum master, whose responsibilities are focused on the development team,
    a **product owner** has a shared responsibility to the team and to the customer.
    The product owner is the voice of the customer, and stands in as the representative
    of the customer''s needs, wants, and expectations.


    A product owner usually belongs to a department such as Product or Customer Support,
    and spends time working with customers directly to understand their needs and
    translate these into clear descriptions that the team can estimate and work on,
    using a consistent format we call stories in scrum terminology.


    The product owner keeps an eye on the big picture from the customer''s perspective,
    looking at the overall state of the product and the timeline for release cycles,
    and the changing technical landscape, while deciding what features are the highest
    priority for the team to work on in the next sprint.


    Product owners work directly with designers to make sure user experience flows
    have been considered, and that design assets are ready for the team. They also
    work with QA engineers to verify that the necessary acceptance criteria are accounted
    for in the test suite for a story. Product owners also collaborate with the scrum
    master to help remove blockers from outside the team that may be getting in the
    way of progress.


    At the same time, the product owner works closely with the team to decide whether
    a desired feature is technically achievable, given the practical constraints of
    the team and the technology, and to plan out the sequence of stories based on
    their historical development velocity and their feedback about the product. Being
    close to the team is vital, since a product owner needs to be available so developers
    can ask about details of a story and confirm the progress of their work. Product
    owners also usually attend all of the scrum rituals.


    ### One Person Should Not Be Both Scrum Master and Product Owner


    One person shouldn''t try to take on the roles of scrum master and product owner
    simultaneously. A product owner has a duty to the client or customer first, and
    usually isn''t part of the engineering department. The objectives of a scrum master
    center around sustainable productivity, and these may not align with the organizational
    objectives of anyone reporting outside the department.


    ## Responsibilities


    One of the most critical duties of a product owner is clarifying the needs of
    the customer, developing a backlog of product features to work on, and writing
    clear stories that communicate the full expectations for the product, while meeting
    the standards of the team. A well-written story needs to encapsulate the full
    intention for a distinct slice of functionality, including any acceptance criteria,
    as well as the customer''s justification for needing this particular feature.
    Usually the product owner and the scrum master will collaborate to make sure each
    story is ready for the team.


    Once enough stories are written to occupy the team for the upcoming sprint, a
    product owner keeps track of them and organizes them to make sure the sequence
    of development for the product is planned out efficiently and to the expectations
    of the customer. Meanwhile, the product owner is diligently working on stories
    that may be needed if the team runs out of work in the current sprint, as well
    as outlining and drafting items that reflect the customer''s anticipated needs
    for sprints in the near future.


    A product owner doesn''t need to do detailed planning more than a sprint or two
    ahead of what the team may be working on. In fact, stories written too far in
    advance of the sprint in which they might be worked on are so frequently discarded
    or rewritten that it''s usually a waste of time to spell them out in much detail.
    But a good product owner maintains a vision for how the product will evolve as
    individual features are added, keeping in mind the importance of setting the stage
    in the current sprint for features that may be needed in the future.


    Product owners need to be in regular communication with the customer, to make
    sure the stories they''re writing and the backlog they''re grooming meet current
    expectations. While scrum encourages transparency, not all teams invite customers
    directly into the rituals and artifacts. A product owner translates the state
    of the product for the customer—demonstrating and getting approval for each slice
    of functionality delivered—and gathers feedback from the customer to let the team
    know whether or not they''re on the right path.


    In addition, the product owner needs to be available to the team to help resolve
    any conflicts or clarify any details about stories the team is working on. As
    the internal voice of the customer, the product owner needs to embody the expectations
    for the product, and be able to make decisions quickly so the team can continue
    working.


    ### A Day in the Life


    Product owners split their time among several responsibilities and constituents:


    - meeting regularly with customers to share information about the team''s progress
    and gather feedback about what the customer wants next

    - working directly with designers to plan and prepare assets for the team

    - getting technical approval from the team for stories in development

    - verifying the completeness and relevance of the QA test suite

    - coordinating with the scrum master to make sure everyone has the information
    they need to do work

    - meeting with team members when asked to clarify issues and make decisions

    - writing stories and grooming the product backlog so it reflects the current
    vision for the product


    Most product owners like to attend the team''s daily standup ritual. As guests,
    product owners are generally not permitted to ask questions or give feedback until
    every member of the team has presented, unless asked directly. After the standup,
    product owners will often follow up on issues that were raised during the standup
    with the relevant parties, either on the team or outside.


    While the team is working on the current sprint''s stories, the product owner
    is constantly watching their progress. It''s the product owner''s prerogative
    to adjust the order of the stories in the current sprint if it appears that a
    critical slice of functionality is in danger of not being completed soon enough.
    The product owner may also prioritize the backlog of stories that are ready for
    the team to start work on if they run out of stories in the current sprint.


    Product owners need to spend their days ready to answer questions about the stories
    that are in progress during the sprint. When a product owner can''t be reached
    for a quick answer, the developers working on a story may be permanently blocked.
    For this reason, many product owners prefer to work alongside the team, so they
    can be available at a moment''s notice.


    One of the things customers love about working with agile development teams is
    frequent and accurate information about the state of the product. Often a product
    owner is in daily communication with the customer to report on progress and get
    insight into any issues that may be on the customer''s mind.


    When they aren''t assisting the team or the customer, product owners are writing
    and refining stories for the next sprint, grooming the backlog of stories to meet
    the customer''s vision for the product, and working with designers to make sure
    that everything the team will need to work on for these stories will be ready
    for them.

