    competitors, and meet customers'' expectations in a predictable way. That can''t
    always happen in two-week increments. I wasn''t sure how scrum was supposed to
    address that.


    ## What I''ve Learned


    The difference between the product backlog and the sprint backlog clarified a
    lot of issues for me. I still do my long-range planning, but I do it in the product
    backlog, where I can nurture ideas that have a long-range potential. It''s actually
    better not setting all of these ideas out in detail. It saves me advance work,
    since we don''t always get to every idea that comes up. But once we know we want
    to develop something, I can bring it to the top of the product backlog and work
    it into feature stories that we can bring into the next sprint.


    Writing my specifications as stories was tricky at first. I''m not used to thinking
    in terms of complete slices of functionality. But it''s better if I get my head
    out of the mindset of an engineer, and focus on the benefits we''re trying to
    deliver. When writing stories for the sprints, using the structure we agreed on,
    I''m able to get just enough detail in to make sure the expectations that are
    important to me get met.


    And by playing the role of the customer in the sprint demo, I get to be the one
    who decides whether or not the work done for the story was acceptable.


    ## What Still Frustrates Me


    Maybe the hardest thing for me was getting my head around the fact that points
    are relative, and don''t have anything to do with the amount of time it''s going
    to take to complete a story. When my management asks me what the team is working
    on, and the status of features we''re planning for the future, they want me to
    give them specific dates.


    The iterative process of scrum generates the kind of data that lets us modify
    our plan based on the marketplace, but I still feel I lack some control. The fact
    is we do still have deadlines, and we still have to meet them. There are holidays
    and other external events that we have to synchronize with. It''s just that now
    we have to deliver whatever''s completed.


    My management is used to being able to dictate features and timelines months and
    quarters ahead of time. I find myself explaining the iterative process of scrum
    over and over again. If I didn''t believe in it, and I hadn''t seen how well it
    works, it would be that much harder.


    ## What I Do About It


    The bottom line is the quality of the product. Now that we''ve gone through several
    sprints, and I''ve seen ideas from the product backlog change as a result of data
    generated through the iterative process of scrum, I have examples to point to
    that demonstrate the value of this approach. I''m trying to build up more of those
    examples to help support the argument for scrum going forward.


    The ability to coordinate with external deadlines is going to get better over
    time, I can see that. The more we do this, the better the team gets at estimating
    how long it''ll take to produce a particular new feature. That''s the big win
    for us. When we can estimate more effectively, we''ll be in a better position
    to coordinate our scheduled delivery of features with dates on the calendar. And
    unlike before, those dates will be a realistic indication of what the team is
    capable of, and not based on blind hope and brute force.


    ## A Designer


    ### Initial Concerns


    My biggest concern when I heard we were going to try scrum was the two-week sprint
    schedule we agreed to. The work I do doesn''t always fit into a two-week period,
    and it usually has to be completed before anybody else can even get started. I
    didn''t want to be the reason the team was less agile, and I was very concerned
    about having enough time to do the work necessary to provide well-thought-out
    designs.


    At the same time, I wanted to make sure I could be available to the team to produce
    last-minute assets. I know there''s always a need for last-minute assets and quick
    decisions. Balancing that against the quick turnaround time associated with scrum
    sounded pretty intimidating.


    ## What I''ve Learned


    At first I thought I was going to have to be part of the scrum team. The way we''re
    structured, my work sits outside the team, and I act as a resource for them. I
    work with the scrum master to make sure there''s always a queue of tasks for design
    waiting for me to work on. And thanks to a kanban approach, I can put realistic
    limits on the number of projects that need to be worked on simultaneously.


    The product owner may switch priorities at any point on the items in that queue,
    so I don''t anticipate what I''ll be working on next, and that lets me focus on
    the work at hand. Sometimes the next thing I need to work on is a long-range design
    plan, and sometimes it''s generating assets or reviewing an implementation. It''s
    great to have the opportunity to do some out-of-the-box thinking one day, share
    my ideas with the product owner, and see the implementation show up in my queue
    the next day. That almost never happened before we switched to this approach.


    I like to attend all of the standups so that I''m on top of what''s happening,
    but I generally attend as an observer, not as team member. Sometimes I''ll follow
    up with the team after the standup to make sure the work is going according to
    the plan. When I''m needed, I get the chance to roll up my sleeves and work side-by-side
    with engineers to resolve issues.


    ## What Still Frustrates Me


    It can also be a little unsettling to shift gears without knowing for certain
    what I''ll be working on next. I need to be flexible about that so I get enough
    time to design-range planning.


    ## What I Do About It


    To be fair, my complaint about lack of long-range planning isn''t any more of
    a problem than it was before we started scrum. At least with scrum, I get the
    opportunity to complain about it every time we have a retrospective. I like that
    this keeps issues top of mind.


    ## An Executive


    ### Initial Concerns


    I trust the managers I hire. I brought in an engineering manager to make decisions
    about how to organize the team, and I try not to micromanage that sort of thing.
    Scrum talks about self-managed teams, and while I like that idea in theory, in
    practice I''ve never seen it work. On the other hand, it gets to be overwhelming
    if managers have to go in and make decisions about every detail in the company.
    I learned that early on in my career, and even if it''s hard sometimes, it''s
    better to be hands-off when it comes to the job.


    From all the hype, scrum sounded a bit too good to be true. I''ve seen lots of
    buzzword management initiatives come and go. I was skeptical about the potential
    for scrum to make the team more flexible at the same time introducing all these
    formal processes. I wanted to make sure the engineering managers didn''t give
    the team enough rope to hang themselves. And frankly, I didn''t like the sound
    of adding all these meetings to the calendar.


    ## What I''ve Learned


    The most surprising thing for me was that the extra meetings actually ended taking
    the team away from work less than the meetings we used to have. From what I hear,
    a lot gets decided in that time, and it''s organized really well. We''ve got a
    kick-ass scrum master. Our scrum process seems to run like clockwork.

    '
