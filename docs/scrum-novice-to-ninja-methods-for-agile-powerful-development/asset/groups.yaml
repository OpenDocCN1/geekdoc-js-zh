    To help get into their heads, we''ll ask a representative from each of these groups
    to answer a series of questions. We want to find out how they view their place
    in the organization, their motivations, their frustrations, their perfect day,
    and the biggest concerns they have about scrum.


    **These Are Hypothetical People**


    Of course, there''s no such thing as a universal engineer, designer, or manager.
    But you may see patterns in these responses that are likely to repeat themselves
    on different web and mobile development teams.


    ## A Senior Engineer


    ### My Role

    I need to take the lead in being responsible for the development of WithKittens.com.
    I not only have to do the work, but also have to keep track of all the variables
    that can stop the work from happening. I''m a specialist in developing the custom
    Kittens API, but I also have to understand how the whole stack comes together.
    Frequently, I''m the first person contacted when a problem comes up, and may be
    the only one who knows how to solve that problem.


    ### Motivations

    I have the experience to know when the project is moving in the right direction,
    and what issues we need to watch out for. I want to see the code improve as it
    develops, while still supporting the requirements of the project. My goal is to
    make the product adhere to the highest practical technical standards. I got my
    title because I have years of experience, including work on projects that went
    far off the rails, and I never want to see that happen again.


    ### Perfect Day

    The perfect day for me is uninterrupted time to work on my part of the code. I
    usually know what I need to do next, and I don''t want to be interrupted. I don''t
    want surprises. I got to this point in my career because I have the talent and
    the knowledge to do the work and do it right. I like to work with other people
    who can bounce ideas around and discuss technical issues at the same level that
    I can. But, while not wanting to sound like a curmudgeon, I really just want everyone
    to get out of my way and let me do my job.


    ### Frustrations

    Because I''m one of the most experienced members of the team, I''m often the first
    one asked when problems come up around the Kittens API. My experience with this
    part of the system means that I''m sometimes the only one who can find answers
    to these problems. I don''t mind showing people how to do something if they''re
    interested, but usually the ones asking the questions don''t understand things
    as well as I do, so I may need to explain the same thing over and over. Being
    interrupted in the middle of working on something difficult, or being asked to
    go to a meeting where my expertise isn''t actually required, are two of my leading
    frustrations.


    ### Concerns About Scrum

    I''ve been on multiple teams that have claimed to be following scrum. I don''t
    know what they were doing, but I hope real scrum isn''t like that. We always seemed
    to have dozens of meetings that never ended, and requirements that changed all
    the time. They threw around words like "transparency" when they really meant "micro-management".
    I never had the opportunity to focus on the long-term objectives of the project
    before things changed again. Instead, we just got into endless debates about the
    process that interfered with getting the work done. You could say I''m pretty
    skeptical about scrum.


    ## A Junior Engineer


    ### My Role

    I was brought in to do performance optimizations on the front end, but the way
    it''s worked out, I seem to do a lot of styling and layout fixes for WithKittens.com''s
    membership and admin pages. I''ve kind of become the one they call when there''s
    a bug that needs to be fixed, and nobody else wants to work on it. I can usually
    figure it out, even if it takes me a little bit longer than it might''ve taken
    some of the more seasoned people. I guess that makes sense. This is only my second
    job, and I''ve only been here about six months. I''m still learning.


    ### Motivations

    I got into engineering because I love working with computers. I was really excited
    when they gave me the opportunity to work on WithKittens.com, because it''s a
    very popular site. It''s the sort of thing that will look good on my resume. I''d
    like to do some projects that I can be proud of. And really, I want to learn from
    the other engineers. Sometimes I''m amazed at how much talent there is around
    here, and I''m just wondering when I''m going to feel like I have the same skill
    set as these other people.


    ### Perfect Day

    Most days start with finishing up the things I was doing the day before. I usually
    have a pretty long list of tasks that need to get done. I usually have a pretty
    long list of tasks that need to get done. Most days start with finishing up the
    things I was doing the day before. I usually have a pretty long list of tasks
    that need to get done. I usually have a pretty long list of tasks that need to
    get done. Most days start with finishing up the things I was doing the day before.
    I usually have a pretty long list of tasks that need to get done. I usually have
    a pretty long list of tasks that need to get done. Most days start with finishing
    up the things I was doing the day before. I usually have a pretty long list of
    tasks that need to get done. I usually have a pretty long list of tasks that need
    to get done.


    ### Frustrations

    I think my biggest frustration is that I feel like an imposter. Sometimes I can''t
    believe they gave me this job. I like to sit quietly and get my.. I'' a a.....
    the people I work with, and I don''t have enough to have a lot of opinions worth
    sharing.


    ### Concerns About Scrum

    I''ve read a little bit about scrum, and I''m curious what it''s going to feel
    like when we start doing it. Right now we have a routine that works. I know what
    I''m expected to do, and as long as I get my work done.


    ## An Engineering Manager


    ### My Role

    I started here at WithKittens.com as a senior engineer. I was promoted to manager
    here after the last manager left. As the manager, I''m responsible for making
    sure my team has everything they need, and that everybody is working on what they
    should be working on. I report up to senior management, and have to justify the
    budget for the team, and provide reports that demonstrate that we''re doing what
    the company needs us to be. Sometimes I have to play referee, and sometimes I
    have to make some tough decisions. That goes with the job. It''s not as much fun
    as being an engineer, but.


    ### Motivations

    I really like my team. I hired about half of them, and the others were mostly
    working here when I got here. I like to think that what I do, I do for them. My
    job is to keep everybody engaged, employed, and content. At the same time, I have
    some strong opinions about how the code should evolve, and I like to make sure
    my influence is in there. At heart, I''m an engineer, and I like working with
    talented engineers.


    ### Perfect Day

    My best days are the quietest ones. As the manager, I''m often called on to solve
    problems to do with organizational, administrative, and sometimes human resource
    issues. I enjoy the opportunity to do one-on-one meetings with my team members,
    and I try to schedule these around the workload. Most days start and end by looking
    at an overview of what everybody on the team is working on.

