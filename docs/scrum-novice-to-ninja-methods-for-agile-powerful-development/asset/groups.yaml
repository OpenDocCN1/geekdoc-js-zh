    ## The Product Backlog is the Responsibility of the Product Owner


    While a product owner may choose to share the entire product backlog with the
    team on a regular basis, the items here are the responsibility of the product
    owner. It may not be productive to remind the team of items in the backlog that
    haven''t been touched for a long time, as it will divert attention from the current
    increment. While many product owners prefer to keep track of items in the backlog
    as they go to become stories, there doesn''t have to be a one-to-one correspondence
    between items in the backlog and stories in the sprint backlog.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_106_2.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_106_1.png)


    ## Don''t Write Stories Until They Are Ready to Be On


    It''s usually a mistake for a product owner to create development stories for
    items in the product backlog too long before they''re ready to be incorporated
    into a sprint. Items in the product backlog should remain vague enough and flexible
    enough that they can adapt to changes that emerge out of the iterative agile process
    of scrum. Product backlog items not worked on for weeks or months can easily become
    stale, and product owners can easily forget the context they had when writing
    the story if it isn''t worked on soon after it''s written.


