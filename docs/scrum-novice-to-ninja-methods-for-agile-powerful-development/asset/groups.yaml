    **Using a Third Engineer for Code Review**


    Since many of the tasks in this story are worked on by pairs, a third engineer
    has to be involved in doing the code review. Not every team requires code done
    by pairs to be reviewed by a third engineer, but this team has included that as
    part of their definition of done.


    Despite the need to support the help pages, the team manages to finish and review
    all of the code to their satisfaction. Because of the unusual naming conventions
    they need to adopt in order to distinguish this code from the rest of the site,
    there is some confusion during code reviews. That slows down development a bit,
    but not enough to prevent the junior engineer who took ownership of the story
    from handing it off to QA for a final check before the end of the sprint.


    The definition of done for this team includes both code review and QA, as well
    as client acceptance. Because QA has been integrated with the team from the start,
    they''ve been building the test suite throughout the sprint based on the acceptance
    criteria.


    Most of the tasks for the story have produced reviewed code that can be unit tested
    independently as they''re completed. Now it''s a simple matter to run the integration
    tests and verify that the features work as expected from start to finish. If the
    story is accepted and pushed to production, these tests will be added to the universal
    suite for the site.


