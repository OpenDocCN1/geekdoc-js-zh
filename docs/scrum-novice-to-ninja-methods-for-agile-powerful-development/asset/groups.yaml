    if they are going to offer customers the choice of puppies as well, instead of
    just kittens, that will require a major adjustment to the core product, as well
    as a new interface element.


    There are only one or two other services that focus exclusively on one type of
    baby animal. For the most part, they are small and haven''t gained the market
    traction that WithKittens has managed to achieve. But despite the potential for
    fragmenting the market, there is an advantage to being able to stay focused on
    kittens on their core service. It also avoids the confusion of adding puppies
    on a service called WithKittens.


    Ultimately, the product owner decides the best approach will be to ask the team
    to clone some sections of the WithKittens service, and create a minimal parallel
    WithPuppies service. They have already purchased the domain WithPuppies.com in
    anticipation of this possibility, and the designers have been playing with ideas
    around this concept casually.


    Before moving forward with that decision, the product owner calls one of the senior
    engineers in for a chat, and confirms that this would be the more technically
    straightforward approach. The sooner they can get a service into the market that
    they can test, the sooner they''ll know whether or not it makes sense.


    ## Formulating a Feature


    After sketching out a few ideas, the product owner decides the best way to do
    this quickly and efficiently will be to create a scaled down version of the product
    exclusively for web users. The company can use its deployment testing system to
    limit the audience to a small percentage of visitors.


    These visitors will be presented with a link that offers to show them puppies
    instead of kittens as soon as they log in. If they click that link, they''ll be
    taken out of the WithKittens.com domain and put into the WithPuppies.com domain.
    There, the experience of the site will be the same, except kittens will be replaced
    with puppies.


    Since this isn''t what most customers came to the company for, it will have to
    be very easy for a visitor to switch back to kittens. It would also be great if
    they could include a way to gather feedback from visitors.


    ## Lining up Design Resources


    The product owner checks the queue of projects the Design team is working on.
    Design is set up under a kanban process, so it will be possible to slot in the
    new design story to start immediately after the designer finishes whatever is
    currently being worked on.


    After sitting down with the designer and discussing some of the visual and user
    experience issues implied by converting the site from kittens to puppies, the
    product owner creates stories for design around changing image elements and kitten-specific
    cues in the content creation path of the application. There will need to be some
    copy changes as well, and for the sake of this test, the product owner will write
    those.


    The designer agrees that there won''t be much need to change the overall user
    interface. There is already a feedback gathering tool that they can skin for this
    purpose, as well as an alert banner format that can be used as a trigger for visitors
    who want to convert back to kittens from puppies. Other than that, it will just
    be a matter of populating a database with appropriate puppy images, and adding
    subcategories to the existing menus.


    The designer confirms that it shouldn''t be necessary for all the design elements
    to be completed before the engineering work starts, because the specifications
    for the image content and the text changes should be driven by the standards already
    in place for the site. As long as the changes stay within the parameters that
    already exist, this work can probably be completed within a single sprint from
    a design perspective.


    ## Writing Stories


    With the go-ahead from initial consultations with Design and Engineering in place,
    the product owner sits down to write feature stories around the idea of creating
    a parallel WithPuppies site. The team is used to working in two-week sprints,
    and the objective is to see if it will be possible to define the scope of this
    story narrowly enough that it will fit within a single two-week sprint.


    ## A Full Slice of Functionality


    There are a few ways to break this feature apart, but the product owner doesn''t
    want to get into the weeds of trying to do the work the engineers are better at.
    The goal is to stand back and view this as a feature from the user''s perspective.
    How would a user who wants puppies instead of kittens take advantage of this feature?


    The best way to describe what will be needed—in terms of stories the team has
    worked on before—is by creating additional pages in the content creation flow.
    These pages will be skinned versions of existing pages, with different options
    presented. They will use the existing alert and feedback features, and will only
    be triggered for a percentage of visitors.


    Thinking this through, the product owner can anticipate some of the questions
    the engineering team will be likely to ask when presented with this story. The
    acceptance criteria for the story will need to be specific about what percentage
    of visitors will be tracked to this new experience, and also provide information
    about the availability of design and copy changes.


    ## Story Format


    The product owner writes up the following story to present to the team, describing
    the new puppy feature:


    - As a logged-in user who has been selected for the puppy beta

    - I want to be able to opt-in to view puppy-specific options during the content
    creation process

    - so that I can have the benefit of including puppies in my content


    Some of the main acceptance criteria for the story go like this:


    - Given a logged in user who is randomly (five percent) or explicitly assigned
    to the puppy beta

    - when that user is viewing the content creation pages

    - that user should be shown an alert banner offering to include that user in the
    puppy beta

    - and Given a logged-in user who has opted in to the puppy option

    - when that user views the content creation pages

    - that user should see puppies instead of kittens in all of the options, and a
    customized feedback form, and an alert banner with an opt-out link

    - and Given a logged-in user who has not opted in to the puppy option

    - when that user views the content creation pages

    - that user should see the standard kitten site with no indication of puppies
    or a puppy beta


    ## Presenting and Estimation


    The team has been working with scrum for several sprints, and is just done with
    sprint ten. At the end of that sprint''s demo, there are several stories that
    have been completed. The shared electronic scrum board the team relies on to keep
    track of their progress looks something like this:


    (Figure 7.1. Sprint 10 Closed)


    There are two stories still in progress, and one that has been completed but not
    yet approved by QA before the demo. All the other stories from that sprint have
    been accepted at the demo, and are now done. The team has completed eleven points
    during sprint 10.


    In preparation for the planning meeting to kick off the next sprint, the product
    owner works out the copy changes that will be needed for the puppy story, and
    creates a document in a shared repository where the design assets will also live.


    After explaining the background of the new story to the team at the sprint planning
    ritual, the product owner reads the full story out to everybody, and asks for
    feedback. One of the first questions from the engineers is why the puppies can''t
    be integrated into the existing site, instead of being separated out. Another
    engineer answers before the product owner has a chance, pointing out that integrating
    a different type of animal would make managing the data much more complicated.


    "But won''t the customers be confused when they come to a kitten site and get
    taken to a page without any kittens?" the first engineer asks.

