    ## What makes for a good story?


    A good story is short and straightforward. Many scrum teams follow the convention

    that a story should be able to be written on one side of an index card, three
    inches

    by five inches, with the acceptance criteria written on the back of the same card.


    If it takes more than that much information to write down the story, the specifications
    may be too detailed, or story may be too complex, and may need to be broken down
    into multiple stories.


    For example, consider a team developing a gallery application. Visitors to the
    gallery

    might want to rate the images being displayed, so they can keep track of their
    favorites. The gallery can function with or without the rating feature, so the
    work can be isolated as a complete slice of functionality. And according to the
    engineers, the work involved in adding a rating widget can be completed within
    a single sprint.


    This is how a story might be written so that the team can evaluate it, estimate
    it, and commit to it in a sprint backlog:


    Name: Rating Gallery Images


    - As a gallery viewer

    - I want to rate the images

    - so that I can track and rank the images I''ve rated


