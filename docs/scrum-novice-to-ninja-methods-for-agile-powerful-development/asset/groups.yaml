    of the


    entire team.


    **What Are Rituals?**


    Each **ritual** is a face-to-face gathering in real time, which takes people away
    from


    the work they''re doing, and offers them the opportunity to have targeted communic-


    ation with each other about the context of that work. Scrum favors communication


    over documentation, which is why it provides regular and clearly defined oppor-


    tunities for various types of useful face-to-face communication.


    **Not Another Meeting!**


    Many people who work in companies are allergic to meetings, and for good reason.


    They may have been overwhelmed by too many meetings, taking up too much of


    their time, and not producing any results. They may be used to having meetings


