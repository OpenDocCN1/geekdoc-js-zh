    result,


    the more spikes that are required to accomplish the goals of the product owner,
    the


    lower the number of points the team can accomplish in a sprint.


    Due to the unknown nature of spikes, they can eat up a lot of a team''s resources


    unless they''re constrained. Generally, when agreeing to include a spike in a
    sprint,


