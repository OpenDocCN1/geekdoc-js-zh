    about whether or not a proposed story is ready to be worked on. If it''s impossible
    for story to meet the definition of done based on the acceptance criteria, having
    a published definition of done can help the team make that clear. Usually a definition
    of done includes a number of familiar expectations. For example, the code should
    be complete, the build shouldn''t fail, the test suite shouldn''t be broken, and
    the product should run as expected. Other points often included in a definition
    of done include peer reviewing code, writing new unit tests, code commenting,
    and updating product documentation. Different teams will have different requirements,
    and the exercise of creating a definition of done is valuable for helping the
    team realize what''s important for every story, not just certain stories.


    ## **The Definition of Done Must Be Practical**


    While it''s important for a definition of done to be thorough, it''s also important
    that it''s practical. The definition of done must be achievable for every story.
    There may be practices the team believes should be followed for the sake of the
    codebase, but which are impractical given the constraints of the marketplace.
    Usually the engineers will argue for a more thorough scope, while the product
    owner may argue for a more streamlined approach, depending on the foresight of
    the product owner and the stability of the market. It''s up to each team to make
    their cases and come up with a definition of done that everybody can agree to
    before they start working.


    ## **Velocity Chart**


    Figure 5.6. Velocity Chart


    **Velocity** is how a scrum team measures the amount of work they can complete
    in a typical sprint. Velocity is measured historically, from one sprint to the
    next. By tracking the number of story points the team can complete according to
    their own definition of done, they can build up a reliable and predictable sense
    of how long it will take them to complete new stories based on their relative
    point value.


    Keeping track of the velocity is the responsibility of the scrum master. At the
    end of each sprint demo, the scrum master should calculate the number of points
    that were estimated for the stories that were accepted as done during that sprint.
    This number should be added as a data point on the velocity chart for that sprint.
    Velocity charts tend to start out jumping around from very high numbers to very
    low numbers, as the team learns how much work they can do in a sprint, and how
    to estimate stories. The longer a team works together, the better they get at
    estimating stories consistently relative to each other. That skill leads to a
    better sense of how many stories, and how many points, the team can accomplish
    in a single sprint. Over time, if the composition of the team stays consistent,
    a velocity chart that started off very erratic will start to find itself averaging
    toward a consistent value.


    Unlike many charts in a business environment, the point of the velocity chart
    isn''t to see a constant increase, but rather to see the values converging around
    a consistent horizontal line. That line represents the amount of work the team
    can realistically and sustainably accomplish in a single sprint.


    ## **Velocity is a Tool for Estimation, not a KPI**


    People outside the scrum process may be confused about the nature of the velocity
    chart. From a management perspective, there may be an impulse to favor an increase
    in the amount of work a team is doing, and look for velocity to grow over time.
    But a velocity chart is intended to trend toward a horizontal average. You may
    hear executives talking about trying to increase the team''s velocity, or celebrating
    a sprint in which the velocity was higher than typical sprints. Get ahead of these
    conversations by reminding everyone that the point of velocity tracking is to
    improve the team''s ability to estimate how much work they can get done consistently
    and reliably. A velocity chart that shows a constant increase (or decrease) over
    time usually reflects a problem in the process.


    ## **Burndown Chart**


    Figure 5.7. Burndown Chart


    A **burndown** chart shows the team''s progress toward completing all of the points
    they agreed to complete within a single sprint. This chart starts with the total
    number of points the team has taken on for the sprint, and tracks on a day-to-day
    basis how many of those points have been completed and are ready for the sprint
    demo.


    The burndown chart is usually maintained by the scrum master, and may be updated
    on a daily basis, perhaps after the daily stand up, or on a continuous basis if
    it''s generated automatically by the tools the team is using to maintain the scrum
    board. The primary audience for a burndown chart is the team itself, although
    there may be data points on a burndown chart that could be relevant to people
    outside the scrum team.


    A typical burndown chart starts with a straight diagonal line from the top left
    to the bottom right, showing an "ideal" burndown rate for the sprint. In practice,
    the point is not to match that ideal, but rather to keep in mind how much of the
    sprint is left at any point in time, and how much effort the team expects to be
    able to put toward the development of the product on any particular day of the
    sprint.


    Lines or columns on the burndown chart may be used to represent the number of
    points of effort actually remaining in the sprint from day-to-day, starting with
    the number of points the team has committed to the sprint. As work is completed,
    these columns should become shorter. Some teams also choose to track the daily
    work, either in story points or individual tasks. This can be done with a line
    or stacked columns. There are very few legitimate reasons for a column to be taller
    on one day than it was on the previous day. If a bug is discovered before the
    end of the sprint, and a story that was marked as done needs to be worked on,
    columns may increase in size from one day to the next.


    **Beware Scope Creep**


    The scope of the sprint backlog should be respected by everyone. If new stories
    are regularly being added to the sprint after the sprint has started, the columns
    that reflect the amount of work left in the sprint on any given day may rise above
    the level of the previous day. This pattern is sometimes represented in a contrasting
    color, to highlight the fact that the originally agreed scope may be creeping
    upward. If this happens frequently, it may reflect problems in the process that
    are worth addressing in a sprint retrospective.


    ## **Product Increment**


    Figure 5.8. Product Increment


    The final artifact of scrum is the actual **product increment** as it exists at
    the end of a sprint, with all of the stories in that sprint which met the definition
    of done incorporated. At the end of each sprint, the completed features that were
    worked on should be added to the product for the sprint demo. At that point, the
    product itself is an artifact of the scrum process.


    A goal of the scrum process is to develop features in such a way that the product
    is in a completed state at the end of every sprint, so it could be released, demonstrated
    to clients for feedback, or used as a tool for testing.

