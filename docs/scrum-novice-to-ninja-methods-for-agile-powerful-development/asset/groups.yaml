    take as it starts to implement scrum.


    We talked about getting buy-in across the organization, both from within engineering
    and outside. We discussed how to get the team trained, and what a trainer should
    be expected to do for the team. We talked about the staffing issues, and how the
    people who already work in the organization can adapt to take on the roles of
    financial process. And we talked about the importance of tracking and measuring
    the effectiveness of scrum. We also dug into some of the problems that can come
    up as a team gets used to scrum, and how to work around them.


