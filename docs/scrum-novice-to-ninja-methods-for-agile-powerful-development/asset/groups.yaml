    for the team to reflect and iterate on their process, finding the rhythm that
    works

    best for them and best meets the objectives of the product owner.


    ## Working to a Release Schedule


    Regardless of the actual release schedule, it''s important for everyone on the
    team

    to understand that what will be released is only what has been completed. Scrum

    isn''t about rushing to finish specific stories in order to meet a predetermined

    timeline. Scrum is about working at a sustainable pace, learning what the team

    is capable of, and releasing what has been completed when it''s ready.


    Any effort to stuff new stories into a particular sprint in order to meet a release

    schedule should be resisted by the team. If the dates cannot be adjusted, the

    product owner should be prepared to compromise, deciding what features need

    to be left out of a scheduled release in order to make time for the team to complete

    the most critical features.


    ## Sprint Retrospective


    If the daily standup is one of the most iconic rituals of scrum, the sprint retrospective

    may be the most representative of the agile philosophy. Sprint retrospectives
    offer

    the team the opportunity to reflect on what they''ve been doing at the end of
    every

    sprint, and figure out how they want to modify their process going forward.


    Figure 4.5. Sprint Retrospective


    ### Objective


    A sprint retrospective gathers the team together to consider how the sprint that
    was

    just completed went for everybody. During the ritual, everyone in the room will
    be

    asked what went well, what didn''t go well, and what commitment they''re willing

    to make as a group to improve things in the next sprint. The goal is to come away

    with a set of modifications to the process that everybody on the team agrees to
    try

    for the upcoming sprint.


    All the members of the development team, the scrum master, and the product

    owner are expected to participate in a sprint retrospective. The ritual is led
    by the

    scrum master.


    ### Guests are Rare at Retrospectives


    Rarely are guests invited to attend the sprint retrospective. This is in order
    to encourage

    people to open up about what might have gone wrong during the sprint,

    and to be candid about how they felt and what issues came up for them. This

    meeting can be emotional, and the intimacy of a private team environment provides

    a more supportive context.


    ### Time Box


    Teams may find that the amount of time they spend in the retrospective mirrors
    the

    amount of time they might spend in the sprint demo. For a two-week sprint, it''s
    not

    unusual for the team to devote half a day to the retrospective. When scheduling
    the

    retrospective, it''s good to err on the side of generosity with the time, to avoid
    cutting

    off access to valuable insights from team members.


    The amount of time a team dedicates to the sprint retrospective reflects the importance

    they give to paying attention to their own process, and improving as they go.

    Some teams may try to limit the amount of time spent in the retrospective. This
    can

    come at the expense of communication and improvement. One of the most important

    aspects of scrum is its emphasis on discussion as a means of enhancing the product

    development process.


    ### Preparation


    Sprint retrospectives can be highly charged. Everybody involved in the scrum should

    come to the ritual with some thought in mind about what might have happened

    during the sprint that they want to comment on. For some people, this can mean

    creating a long list of issues to raise.


    The scrum master should come to the sprint retrospective with an agenda that makes

    sure both positive and negative feedback is gathered from all participants. It''s

    the responsibility of the scrum master to see to it that everybody has a voice
    and

    contributes to the process.


    ### Make Sure the Retrospective Gets Proper Attention


    The sprint retrospective is the one ritual that''s most frequently shortened,
    or even

    abandoned, by scrum teams. That can be a sign that the process is in trouble.

    Without adequate attention to the retrospective, the team is giving up the opportunity

    to improve their process. Often the people recommending that this ritual

    be given less time and attention are the people who are benefiting most from

    the status quo, at the expense of the team.


    ### What Went Well?


    The scrum master should ask everybody in the room what they went well

    during the sprint. This is usually done by going around the room and having

    everybody report what went well. For things that went well, the team should

    try to find ways that the successes can be replicated in future sprints. They

    might tried something new this past sprint that turned out to be successful, and
    that can be integrated into the process going

    forward.


    ### What Didn''t Go Well?


    After everybody has had an opportunity to discuss what went well, and what

    didn''t so well, the floor should be opened for discussion. This is a chance for

    everyone on the team to say more about the issues they raised, as well as the

    issues raised by the other teammates, and what they think the team should

    doing about them. For things that didn''t go well, the team has the opportunity
    to discuss what wrong. Sometimes the issue was that the process was not followed.
    Other times, the process actually got in the way, and needs to be adjusted. Everybody
    should be

    encouraged to give their opinions about changes that might be beneficial.


    ### Ordering This Ritual


    The order of the sections of this ritual—dealing with what went well and what

    didn''t go well—may be reversed according to team preference. Scrum masters

    may also choose to follow any number of practices to get the team more engaged

    in this ritual, including games, note cards, advance submissions, etc. There''s
    a

    lot of room for creativity in planning this.


    ### What Should We Do about It?


    Eventually, the discussion will circle around to four or five issues that the
    team

    wants to focus on. The scrum master should guide the discussion in such a way

    that these issues get phrased as revised practices—which the team can then agree

    to try for the upcoming sprint.


    **Only Make Manageable Changes Between Sprints**


    While there may be many issues discussed, the team should agree on a small and

    manageable set of changes to make from one sprint to the next.

