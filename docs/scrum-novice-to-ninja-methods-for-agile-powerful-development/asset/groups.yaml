    ##一些 Scrum 术语定义


    当 Scrum 使用一个词汇时，它的含义完全取决于 Scrum 为其赋予的定义。但与《爱丽丝镜镜 나라》中的兔子（Humpty Dumpty）不同，Scrum
    依赖于熟悉且易于理解的定义。学习语言是掌握新技能的第一步之一，而语言的一致使用对于尝试协作的团队至关重要。以下术语只是书中后面将进行更详细定义的术语中的一部分，但在继续阅读之前，简要浏览这些概念可能对你有所帮助。


    **敏捷 (Agile)**

    一组软件开发实践方法，旨在帮助工程师共同工作，并快速、轻松地适应变化。


    **产物 (Artifact)**

    Scrum 团队用于促进 Scrum 流程的物理或虚拟工具。


    **阻碍因素 (Blocker)**

    任何阻碍工程师进行进行中任务的因素。


    **客户 (Customer)**

    任何聘请团队创建产品的人。


    **工程师/开发者 (Engineer/Developer)**

    负责创建和维护产品中涉及技术的人员。


    **工程部门 (Engineering Organization)**

    公司中雇佣工程师来创建和维护产品的部门。


    **产品 (Product)**

    工程部门为客户构建或维护的内容。


    **产品待办列表 (Product backlog)**

    一个不断演变的产品潜在功能或更改的列表。


    **产品所有者 (Product owner)**

    一个帮助团队定义产品的人，如果客户不满意，其工作可能会受到影响。


    **回顾 (Retrospective)**

    团队定期反思自身表现如何以及可以在哪些方面做得更好的机会定/机会。


    **仪式 (Ritual)**

    一群人员作为 Scrum 流程的一部分，在固定时间内，按照特定议程的安排聚在一起，以实现一个明确定义的结果。


    **Scrum 经理 (Scrum Master)**

    负责维护产物并监督 Scrum 仪式的人员。


    **冲刺 (Sprint)**

    一段固定天数的时间，在此期间团队可以共同工作，对产品产生一组约定的系列更改。


    **冲刺待办列表 (Sprint backlog)**

    一组团队同意在当前冲刺中可以合理完成的有限且定义良好的故事（stories）。


    **用户故事 (Story)**

    一种清晰且一致的方式，用于拆分、表述和讨论团队可能在产品上需要执行的工作。


    **用户 (User)**

    将使用该产品的人。


    **Scrum 也足够灵活，支持产品所有者的工作模式，他们倾向于将故事分解为一周、两周、三周、四周或更长时间完成的任务。虽然大多数网页和移动开发团队倾向于将工作分为一周或两周的片段——在
    Scrum 术语中被称为冲刺（sprints）——但团队同意的任何方式都是有效的。只要团队在跟踪他们如何协作，并且他们有机会定期对自己的时间表进行反思，Scrum
    就能适应从最简单到最复杂的项目。


    **时间敏感性 (Time Sensitivity)**

    Scrum 在每个冲刺中都提供了机会，通过真实的客户数据整合设计师、工程师、高管、客户、产品经理和客户的想法。由于 Scrum 的循环性质以及鼓励在边做边边学的迭代方法，Scrum
    允许移动和网页项目快速适应不断变化的技术和市场预期的变化。


    **模块化开发 (Modular Development)**

    Scrum 支持以模块开发项目的能力。因为 Scrum 基于按功能切片进行思考，因此它非常适合创建独立的、可操作的特性，这些特性可以原子化的方式开发并和谐地工作在一起。


    例如，网站的新章节可以继承来自共享样式指南和 CSS 结构的样式，并可能从共享模板继承其功能。构建该章节的工作依赖于其他组件保持静态足够的时间以完成工作。Scrum
    提供了支持这种要求的稳定性，而不会限制网站其他部分的开发。


    同时，更新产品的基础设施以支持新功能可能会在过程中的任何时候发生，因此团队必须预先考虑如何安全地进行这些更改，而不破坏其他功能正在进行的工作。另一个例子是，有时网站每个功能都依赖的
    API 需要进行更改。Scrum 鼓励团队以模块化、可测试的方式管理代码，以便更改可以被可能进行中的其他特性故事继承，而不会产生不必要的破坏。


    **灵活的调度 (Flexible Scheduling)**

    在网页和移动领域为客户服务的公司需要快速响应变化。然而，工程师需要确信在他们开发出特性之前，他们正在工作的内容不会发生变化。平衡这两个目标可能是困难的。


    Scrum 提供了足够长的窗口期，允许网页或移动特性被完全开发，同时允许产品在每个冲刺结束时根据市场数据改变方向。


    **反思与改进 (Reflection and Improvement)**

    Scrum 团队不仅是在求改进产品：他们还寻求改进自己的流程。Scrum 团队随着时间的推移，在估计他们可以完成多少工作方面变得更好，并改进他们的工作方法以发挥最大的生产力。


    通过给予团队审视自身流程并找出最佳协作方式的机会，Scrum 最大度地利用了任何组织的有限资源。


    **总结 (Summary)**

    这是对 Scrum 的快速概述，是从 30,000 英尺的高空视角来看的。我们简要介绍了 Scrum 如何工作，以及为什么它对某些类型的产品开发是有效的。我们将
    Scrum 与更传统的瀑布式软件开发方法进行了对比，并讨论了它为什么在那个时候出现。我们还注意到 Scrum 多么适用于网页和移动开发项目。


    但 Scrum 不仅仅是一个抽象概念和一堆不熟悉的术语。Scrum 是一种务实且灵活的产品开发方法，依赖于真实的人员的积极参与。因此，在下一章中，我们将认识一些可能在网页或移动开发组织工作的典型人物。我们将与他们谈论一些挫败感，了解他们希望获得什么，并询问他们在考虑
    Scrum 时的顾虑。


    ## 第二章：认识团队


    Scrum 是关于团队如何协作的，因此从了解团队成员开始是重要的。我们将介绍一些典型的网页或移动开发项目中的参与者。他们在考虑 Scrum 时预期会有什么？


    我们将介绍一些典型人物，他们工作在一家虚拟的梗包出版公司，负责一个名为 WithKittens.com 的服务——一个在网站上添加猫的引擎。在 WithKittens.com
    的每个人都有目标和问题，围绕如何为免费级 B2C 和企业级 B2E 客户提供这项关键服务。他们在 WithKittens 组织中的职位描述了他们的技能和经验，以及他们在公司层级中的位置——这两个因素与
    Scrum 无关。


    我们将认识的一些的人员可能包括：


    - 工程师（高级和初级）

    - 团队经理


    '
