    承担该故事的工程师特意提醒 QA（质量保证）任务的状态。在与 QA 交流后，他们讨论了测试计划，并决定了如何评估测试的一些标准，以符合原始故事的验收标准。在这种情况下，双方同意在所有组件完成之前，QA
    将参与到故事片段的测试。提前让 QA 介入可以让他们尽早开始编写测试用例。


