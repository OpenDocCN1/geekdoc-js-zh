    I can see what I want done, but I can''t just reach in there and do it myself
    with my own hands.


    ## My Perfect Day


    I have to keep track of a lot of moving parts around here. I don''t have time
    to shepherd everybody through the process. That''s why I have managers, and that''s
    why I have to step back and let them do their jobs. As far as engineering is concerned,
    my perfect day is when they deliver something that I was waiting for, and that
    I know is going to delight our customers.


    ## Concerns About Scrum


    I''ve seen a lot of initiatives come and go over the years. Every few years there''s
    a new flavor of management system, with a new set of buzzwords that everybody''s
    talking about. I''ve read a little bit about scrum, and it seems as if it might
    add a bit of overhead to the engineering organization. I want to keep my eye on
    that. Also, everything I hear seems to talk about extra meetings, and I''m sure
    the engineers aren''t going to like that. Our engineering team is one of our most
    valuable resources, and I don''t want to see us doing anything that might upset
    them.


    ## Summary


    These perspectives only represent a subset of the possible responses you might
    get from your team when you try to introduce scrum. There are as many different
    possible issues as there are individuals, and you know the people you work with
    best. The responses above show how some of the typical people you might find working
    on a web development project could see scrum affecting their work. Think about
    the motivations and frustrations of the people on your team. Do you see any of
    the same concerns that were raised above? Does anything they said ring true, or
    raise any red flags you would want to watch out for if you saw similar things
    happening on your team?


    ![img/b1806dfc7ab8e46f442d54c1e569394_0.png](img/b1806dfc7ab8e46f442d54c1e569394_1.png)


    **Scrum Won''t Resolve Issues that Need to be Handled at Management Level**


    Happily for this team, WithKittens.com isn''t dealing with individuals who are
    fundamentally unmotivated by their jobs, or unwilling to participate in process.
    Those can be signals that there are deeper issues to be addressed at management
    or human resources level, outside of scrum. Remember, scrum is about getting the
    work done and helping the team work together. It''s independent of the organizational
    hierarchy and the management process.


    In the next few chapters, we''re going to cover the specifics of how scrum works.
    We''ll look in detail at the roles, rituals, and artifacts associated with the
    scrum process, and show how they apply to teams working in web and mobile development.
    While you''re reading the descriptions of scrum, keep in mind the responses above.
    Ask yourself whether certain organizational roles seem to map logically to any
    agile roles. Think about how the real people who work on a team and in organization
    might respond to the tools and techniques we''ll be discussing.


    ***


    Scrum is a system that supports sustained productivity for a team. But if you
    try to adopt scrum, and don''t give adequate consideration to the purpose of each
    of the roles that scrum assigns to the participants, you''re likely to find problems
    maintaining the balance and rhythm of scrum. Cutting corners on the defined roles
    is one of the most prevalent anti-patterns in scrum, and it''s easily avoided
    by making the assignment of roles deliberate and explicit.


    Traditional scrum defines only three critical roles: scrum master, product owner,
    and team member. We''ll start with these. But scrum plays out in a context, and
    for web and mobile development, that context is usually a company or organization
    trying to create technical embodiments of experiences for clients, users, or customers.


    ## No Hierarchy


    An agile scrum team operates within an organization that may have a hierarchy
    of management. But the roles in scrum are all equals as far as the process is
    concerned.

