    ## Motivations


    I know I can be a little bit obsessive sometimes, but it gives me a strong sense
    of satisfaction to move through a site I''ve designed and feel that there''s a
    holistic consistency to the visuals as well as the flow. I want the work I produce
    to give users an experience that makes sense, that''s enjoyable, and that fulfills
    the potential of the product. For a site like WithKittens.com, we have a number
    of design objectives around keeping the user experience playful, inspiring, and
    humorous. It''s important to me that the work I do stays true to those design
    objectives. I don''t mind fighting for what I believe in, especially when I know
    how many people are going to see this site. I have a responsibility to those people
    not to let that experience be negative.


    ## Perfect Day


    I became a designer because I like to invent, create, and innovate. Design is
    about looking at real-world challenges and coming up with interesting solutions
    that make sense, and that will delight users. I think my best days are ones when
    I have the opportunity to be alone and focus on the challenges I see for the next
    generation of the product. There are so many things I want to fix about the way
    we have things now, but at the same time my mind is always thinking about what
    we can deliver next. I work very closely with the product group, brainstorming
    ideas and coming up with interesting ways to do user testing. I enjoy that kind
    of work.


    ## Frustrations


    For practical reasons, the team sometimes treats me as a production designer.
    As someone trained with visual tools, I''m often called upon to generate and update
    assets, frequently at the last minute. This kind of work can be tedious, but I''m
    the only person skilled enough to do it properly. I''ve seen what happens when
    we leave design tasks to engineers. It usually isn''t pretty. The most frustrating
    part is when a new feature needs to be developed quickly—or may already have been
    built by the engineers without any design—and I have to drop everything to create
    layouts and assets that fit conceptually with the rest of the product. As often
    as not, a last-minute feature doesn''t make sense conceptually from a design perspective,
    so this kind of work can be very draining.


