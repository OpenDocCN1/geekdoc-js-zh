    or benefit from its excesses. Retrospectives also serve a strong team-building
    function,


    in that they allow the team members a chance to share what''s on their mind with


    their colleagues. While the most common problem teams have with retrospectives


    is not holding them at all, next on the list would be trying to resolve the problems


    that come up during a retrospective at the ritual itself.


    Retrospectives are an opportunity for everybody on the team to bring up anything


    they think went well or didn''t go well during the previous print, and to discuss


    how to address the issues going forward. This touches on potentially sensitive


    topics, and can bring a lot of emotions to the surface. For people who feel they
    may


