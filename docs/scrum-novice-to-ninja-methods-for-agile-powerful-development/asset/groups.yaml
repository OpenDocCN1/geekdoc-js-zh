    ## QA 站会


    有些团队将 QA 视为核心团队成员，但对于“小猫团队”来说，QA 不需要积极参与所有团队活动。是否参加站会完全取决于那些不直接在团队内的人。


    QA 只有在接到可能讨论新任务或故事的提示才会参加站会。产品所有者尽可能参加所有的站会。当然，在团队中所有工程师报告完自己的状态之前，QA 和产品所有者都不会发言。即使如此，Scrum
    Master 也将他们的发言限制在与整个团队相关的范围内。第一个报告的是负责“幼狗故事”的初级工程师，他解释了他们如何将故事拆分为任务，以及他们如何开始处理第一个任务。


    “我们非常感谢对任务拆分的任何反馈，”初级工程师说，“我认为我们涵盖了所有的验收标准，但越多的人关注这件事，我心里越踏实。”


    “所以你今天剩下的时间都会在处理这个任务吗？”Scrum Master 问。


    “是的，我想我们会这样。”


    “有什么阻塞情况吗？”Scrum Master 问。


    “我不认为有，”初级工程师回答道。


    “不，我认为我们没有任何阻塞，”该故事的另一位工程师表示赞同，“我们应该继续工作了。”


    “好，我不认为我们有任何阻塞，”Scrum Master 说道，继续循环，直到大家报告完。然后团队散会，工程师们回到各自的项目。


    站会后，产品所有者与处理“幼狗故事”的人进行了沟通，告知他们设计工作已经开始。那些需要设计资产的任务尚未开始。根据站会的情况，它们可能不会开始。


