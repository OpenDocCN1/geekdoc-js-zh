    ## Team Members


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_57_0.png)


    Figure 3.4. The role of the development team


    Most scrum teams consist of a set of four to eight engineers. Their specializations
    should be planned to support the type of work the team is going to be responsible
    for, so they can estimate it well and produce results that meet the team''s definition
    of done.


    A team member is expected to participate actively in all the scrum rituals, and
    operate in a transparent way that allows everyone to be at least peripherally
    aware of what their teammates are working on.


    ## Cross-Training


    Specialization is important to the development of an engineer''s career, but on
    a scrum team it isn''t assumed that any one engineer will have exclusive responsibility
    for any particular aspect of all stories. Part of the power of scrum is the transparency
    it provides, allowing engineers from all backgrounds to learn about what''s involved
    in developing any aspect of the work the team has accepted.


    Scrum encourages engineers to work together. A practice called **pair programming**,
    adapted from the agile technique known as Extreme Programming, is often practical
    for the type of work done in web and mobile projects. Pair programming advocates
    matching people with different levels of experience to work together on the same
    code, so each can benefit from the perspective of the other.


    The advantage of this approach is that the knowledge about what the product is
    doing, and how to develop every part of it, is shared across the entire team.
    Silos of information that reside only in the head of a single engineer are discouraged,
    in favor of communication with others. Not everyone is expected to be an expert
    in all areas of the product, but everyone should be prepared to work together
    with the experts on areas outside of their usual comfort zones.


    The result is that the work may appear to go a little slower at first, as people
    come up to speed. But soon a deeper shared context will develop, which will speed
    up both estimation and development. The team will also become more resilient in
    the event that someone wins the lottery and decides to retire. There won''t be
    a gaping hole of knowledge left behind. There may be large shoes to fill, but
    at least there will be people who have some understanding of what was involved.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_58_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_58_1.png)


    ## Pair Programming


    Pair programming is very demanding. Some of the expectations are that two people
    share a single monitor, and trade responsibility for entering code (driving) and
    keeping track of what needs to happen next (navigating). A pair should be talking
    with each other constantly as they work, and neither member of a pair should allow
    distractions such as email to interfere with the process. Most pairs find they
    can work no more than six hours a day in this mode, but the productivity gains
    and the benefits to the stability of the team are worth the tradeoffs.


    ## Responsibilities


    As far as the scrum process is concerned, a team member is responsible for the
    quality of the product being developed, and for the preservation of the scrum
    process for the entire team. These are two aspects that every team member has
    the authority to affect by the way they perform their duties.


    The quality of the product is supported by the team''s ability to accept or reject
    stories. If stories are presented that aren''t fully clear, or that may be impossible
    or impractical given the history of the project, the team should put the quality
    of their work first and insist that the product owner rewrite or retract the stories.


    Estimating the effort involved in doing the work to complete a story is also part
    of the team''s responsibilities. As a team works together and gains experience
    with different stories, they should begin to develop a shared and subjective scale
    of relative effort involved in stories of a similar nature. The effort, usually
    measured in arbitrary points, is assigned by the team to help establish how much
    work they can do within a timeframe. That helps the product owner plan how quickly
    new features can be completed.


    The team is expected to push back against any attempts to sacrifice quality for
    the sake of speed, given the practical constraints of the project. Additionally,
    the team should be tracking the overall quality of the codebase, and proposing
    stories that would refactor the existing code to enhance maintainability, or to
    support emerging technical standards. Keeping the code clean, self-documenting,
    and internally consistent helps everyone on the team work together more effectively.


    Every member of the team is also responsible for maintaining the scrum process
    for every other member. If anyone interrupts the standup, or tries to introduce
    changes to a story in the middle of a sprint, every team member should feel authorized
    to interrupt that behavior. Anyone on the team should have the authority to point
    out when scrum is being sidestepped.


    It''s critical for team members to take this responsibility for their fellow team
    members seriously. The power of scrum is in the dynamic it creates among a group
    of people. Failing to defend the scrum process is letting the other team members
    down.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_59_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_59_1.png)


    ## All Team Member Are Equal


    Although the members of a team may report to one or more managers inside or outside
    of the scrum context, within a scrum team all team members are considered equals.
    The team members shouldn''t report to the product owner or to the scrum master
    because that creates a tension between the agile roles and every employee''s independent
    place in an organization''s hierarchy. If seniority or reporting relationships
    exist among employees within the scrum team, they should be ignored when it comes
    to following the scrum process. Anyone who notices organizational rank being used
    to influence the scrum process should bring the matter to the attention of the
    scrum master, either at the time, during a retrospective, or confidentially.


    ## A Day in the Life


    Most days, a team member will be working on code for the majority of the day,
    in blocks of time as long and as constant as can be. A team member''s core daily
    duties are straightforward:


    - developing, checking, and documenting code

    - getting clarifications, story details, and feedback from the product owner

    - participating in the rituals of scrum

    - working with the scrum master to remove blockers for team


    The most prevalent image that springs to mind when picturing a scrum team is probably
    the team''s participation in daily standup, which we''ll be discussing in more
    detail in the chapter on scrum rituals. Every team member is expected to be available
    and prepared for this brief, fifteen-minute window of time. A team will usually
    try to schedule this so that it won''t interfere with the flow of work for the
    team.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_60_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_60_1.png)


    ## When to Do the Standup


    For some teams, scheduling the standup right before or after lunch, or at the
    beginning of the work day, makes the most sense. Teams that are not co-located
    may need to choose a time that works for people across multiple time zones. The
    time can always be adjusted by the team in response to feedback gathered during
    sprint retrospectives.


    On days when other scrum rituals are scheduled, all team members are expected
    to be present and participate actively. The rituals of scrum are designed to make
    efficient use of limited time, while producing predictable and valuable results.
    A good scrum master will arrange to maintain a time box around each ritual so
    the time commitment and the end result are predictable.


    Other than participating in the rituals of scrum, all team members should be spending
    their days taking stories from ready to done. If the organization interferes with
    this work by creating excessive meetings, the team should bring this issue to
    the scrum master so that it can be addressed. Preserving the uninterrupted time
    a developer needs to concentrate on coding is one of scrum''s top priorities.

