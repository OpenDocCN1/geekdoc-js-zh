    151

    Making Scrum Work for Your Web or Mobile Team


    ## Chapter 10

    ## Adapting to Scrum


    We''ve talked about the systems that make scrum work. We''ve discussed the approach
    that scrum takes to product development, and some of the rituals and artifacts
    that help the people taking on the roles of scrum to get their work done efficiently
    and effectively in a sustainable manner.


    But ultimately, *scrum is about people*. If the people on your team aren''t feeling
    inspired and motivated by their work, scrum can''t step in and change that. What
    scrum can do is help people who are good at their jobs work together in a more
    efficient and effective way, while constantly improving.


    Way back in Chapter 2, we were introduced to everybody on the team, and we got
    a chance to discuss some of their concerns about scrum. So let''s take a look
    now and see if they''ve learned enough to help them address those concerns.


    ### A Senior Engineer


    #### Initial Concerns


    I came into scrum worried about buzzword management. I''ve seen too many companies
    where they threw around words like agile without really understanding what they
    meant. Some people treat agile as an excuse to have more meetings. Maybe meetings
    make them more comfortable. That doesn''t work for somebody like me, because I
    have responsibilities that can take hours or even days of uninterrupted time to
    get right. I didn''t want managers hovering over me, pulling me into lots of meetings,
    and shifting my focus, getting me distracted from the thinking that''s involved
    in doing my work.


    #### What I''ve Learned


    The ideas of scrum are good. The important thing is to carry through on them.
    The time we spend now in meetings that don''t have to do with agile has been greatly
    reduced, and that''s a big relief. When somebody needs to talk with me, I can
    point to exactly what I''m working on, and explain if I''m too busy and why. And
    if someone suddenly comes up with a change they think is urgent, I have a whole
    team around me willing to stand up for the sanctity of the sprint, so we don''t
    have to adjust what we''re working on while addressing this new issue.


    At the same time, it''s easy for people to see who''s working on what, so all
    the questions don''t end up coming to me. Now there are more people on the team
    getting experience with the parts of the code that I used to be responsible for
    100%. That frees me up to do some of the long-term thinking, and apply my knowledge
    to reviewing the work of other people who are still learning some of the lessons
    I''ve had to learn over the years.


    #### What Still Frustrates Me


    It can be hard to plan and architect a project when you''re not sure what direction
    it''s going to take next. For example, there are aspects of mobile development
    that require longer time frames than a single sprint. Sometimes we have to develop
    in layers, always thinking about what could be considered a complete slice of
    functionality every sprint.


    Scrum: Novice to Ninja

    154


    Technically, it can be a challenge creating an infrastructure that''s flexible
    enough to adapt to potentially radical changes in direction every sprint. But
    I''m getting used to pushing back on the product owner when I see stories that
    clearly don''t fit within the sprint, and that need to be broken down. And it
    forces me to think in a more modular way, and ultimately results in a more flexible
    code base.


    Now that I''ve learned how scrum works, one of the most frustrating things for
    me is when I see the practice being abused. I''m quick to challenge the product
    owners when they try to introduce a new story in the middle of a sprint. it does
    happen, and sometimes there are good business reasons for it.


    #### What I Do


    One of my favorite things about scrum is that having everybody on the team on
    the same page is really helpful. I''m getting used to the fact that I''m not allowed
    to say what''s on my mind. Because of the retrospectives, I get the opportunity
    to raise issues and ensure there is a legitimate reason for it.


    ### A Junior Engineer


    #### Initial Concerns


    My role is still new to me, and I''ve never been all outgoing, so it was intimidating.
    I was especially worried about pairing with people more experienced than I am,
    and embarrassing myself with stupid mistakes. I also didn''t like the idea of
    speaking up so much.


    Adapting to Scrum

    155


    #### What I''ve Learned


    It took a while to get used to the idea that everybody on the team is equal. Initially,
    I didn''t like to talk much in meetings. But the scrum rituals encourage everybody
    to participate, and nobody gets away without saying something. Once I realized
    that everybody was just as likely to make a mistake as I, I felt more comfortable
    saying what was on my mind.


    I also really like what I''m learning from working closely with other engineers.
    I''m getting exposed to ways of working that I probably wouldn''t have figured
    out until I''d been on the job for a long time. The more we work together, the
    easier it is for me to take concepts from one part of the code and apply them
    somewhere.


    I''m also less intimidated now when I''m presented with a story that I don''t
    know how to deal with. The discussion during the sprint planning meeting gives
    me a chance to hear what more experienced engineers think are the hurdles for
    any story, so I know what to anticipate. And I know there are people on the team
    who have the knowledge I need. Working more closely with them gives me a chance
    to learn how to think outside the textbook cases I''ve been familiar with.


    #### What Still Frustrates Me


    I''m still scared when I have to take on a story at the top of the backlog that''s
    outside my experience. It''s especially frustrating when I see a story I''d like
    to work on that isn''t at the top of the backlog, but that I know I could do better
    because it''s something I''m familiar with. Sometimes I''m tempted to delay work
    on a story just so I can be in a position to take the story I really want when
    it becomes available. But I know I''m not supposed to do that, and the scrum master
    has already called people out on that a few times.

