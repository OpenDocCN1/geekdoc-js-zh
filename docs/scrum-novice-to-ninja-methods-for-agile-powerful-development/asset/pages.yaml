  md: '![](img/b1806dfc7ab8e46f442d54c1e56b9394_48_0.png)


    Figure 3.1\. All roles are equal in scrum


    Although the title may sound imposing, the scrum master has no authority other


    than the leadership demonstrated in the role of servant leader for the scrum process.


    The product owner has no authority other than maintaining the vision of the product


    and shepherding it through the scrum process. And the team has no authority other


    than the power to estimate, accept, reject, commit to, work on, and complete stories.


    And everyone should be empowered to enforce these roles to preserve an agile work


    environment.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_48_1.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_48_2.png)


    **A servant leader?**


    The term **servant leader** is often used when discussing the delicately balanced


    position a scrum master occupies. The scrum master has no formal authority over


    anything other than the rituals and artifacts of scrum, but leads the team from


    within by embracing and evangelizing the concepts of scrum. A scrum master


    serves the needs of the entire team—helping to eliminate **blockers** (impediments


    to the scrum workflow) and coaching people about how to follow the practices


    of scrum—and should lead by example when advocating for and defending scrum.


    Scrum: Novice to Ninja


