    organization without any formal chain of command). As long as the scrum team is


    provided with the resources it needs, and can justify its existence by producing
    the


    results that the organization wants, the relationship should be maintainable.


    There are sometimes different opinions about how the resources a team needs should


    be provided. An agile approach to working this out is to try one way, notice how


    well it works, and iterate to find what''s most productive.


