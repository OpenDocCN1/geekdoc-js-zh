    **Some Scrum Terms Defined**


    When scrum uses a word, it means just what scrum chooses for it to mean. But


    unlike Humpty Dumpty in *Through the Looking Glass*, scrum relies on familiar


    and easily understood definitions. Learning the language is one of the first steps


    in acquiring a new skill, and consistent use of language is fundamental to teams


    trying to work together. The terms below are only some of the ones that will be


    defined in much more detail later in the book, but a brief glance through these


    concepts may help as you read on.


    **Agile**


    a set of software development practices designed


    to help engineers work together and adapt to


    changes quickly and easily.


    **Artifact**


    a physical or virtual tool used by a scrum team


    to facilitate the scrum process


    **Blocker**


    anything keeping an engineer from moving for-


    ward on a task in progress


    **Customer**


    whoever has engaged the team to create a


    product


    **Engineer/Developer**


    a person responsible for creating and maintain-


    ing the technology that goes into a product


    **Engineering Organization**


    the part of a company where engineers are em-


    ployed to create and maintain products


    **Product**


    what the engineering organization is building


    or maintaining for a customer


    **Product backlog**


    a constantly evolving list of potential features


    or changes for a product


    **Product owner**


    a person who helps define the product for the


    team, and whose job may be on the line if the


    customer isn''t satisfied


    **Retrospective**


    a regular opportunity for the team to reflect on


    how they are doing, and what they could do


    better


