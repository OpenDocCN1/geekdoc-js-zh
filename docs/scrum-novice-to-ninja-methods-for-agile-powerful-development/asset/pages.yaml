    Once all the stories that the product owner has presented have been estimated,
    all


    the participants in the ritual work together to come up with a backlog that makes


    sense for the upcoming sprint. This backlog will be sized based on the historical


    number of points that the team has been able to accomplish in the past, balanced


    against the point estimates for the new stories.


    While the product owner has final authority over the contents of the sprint backlog,


    as well as the order of the sprint backlog, the team has the opportunity to advocate


    for certain changes while the backlog is being prepared.


    For example, although each story should stand alone, it may make sense to the
    team


    to work on particular stories in a certain order. The team may also wish to complete


    stories that were started but not finished in the previous sprint. Completing
    stories


    that are in progress is useful for the development team because it helps them
    to


    maintain continuity. While there''s a cost to loss of continuity, that cost is
    the re-


    sponsibility of the product owner, and the product owner has the authority to
    make


    those decisions for the sake of the product.


    Once a final sprint backlog has been created, everyone on the team needs to commit


    to that backlog. This is the last opportunity for the team to object, or raise
    issues


    that they think may have an impact on their ability to do the work required. If
    there''s


    still disagreement, the scrum master needs to step in and facilitate the conversation


    so that agreement can be reached.


