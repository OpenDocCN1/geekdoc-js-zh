    everybody in the team a chance to speak before this deeper discussion starts.


    **What Didn''t Go Well?**


    Next the scrum master should go around the room asking people to report what


    they didn''t think went so well during the sprint. This is a more delicate subject,


    because people may tend to bring up uncomfortable or unpleasant issues.


    As before, everyone should be asked to participate. Bringing out honest responses


    from people about subjects they may feel uncomfortable discussing is part of the


    skill of a strong scrum master. If somebody really doesn''t want to speak, or
    has


    something to say that they don''t want to bring up in front of the group, they
    should


    be encouraged to talk about it independently with the scrum master outside of
    this


