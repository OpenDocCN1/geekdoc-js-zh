    up at the next retrospective, and potentially stop the experiment from going forward.


    Reflective iteration allows well-functioning teams to continue functioning and
    im-


    proving, and allows teams with problems to recognize and adjust for those problems.


    Everything about the process is subject to group agreement. And because there''s


    always another retrospective coming up, there will always be another chance to


    revisit any decision and shift directions if something''s not working.


    **Adhering to Shared Definitions**


    Scrum encourages people to work together rather than alone. In order for that
    to be


    productive and not oppressive, people need to agree to shared definitions about
    the


    context in which they work. Without a common vocabulary that everybody can


    agree to, teams would be impossible to manage, and scrum would be of very little


    use.


    Scrum defines a number of new terms for an organization, such as sprint, story,
    ar-


    tifact, etc. Part of the value of this is that each organization gets the opportunity
    to


    take those new terms and use them in the way that''s most effective for them.
    This


    doesn''t mean breaking from the core standards of scrum, but it does mean coming


    to a conscious agreement about how each team chooses to operate internally within


    those definitions.


    The vocabulary we''re discussing is unique to each team. While shared concepts


    such as stories, standups, and points may be familiar across all scrum teams,
    how


    each team writes a story, how each team manages its stand up, and how each team


    chooses to assign points are all subjective and constantly evolving properties
    of that


    individual team.


    For example, one of the things that every team needs to define for itself is the
    concept


    of done. One of the artifacts of scrum is a definition of done, in which the team
    can


    agree to the standards a story needs to meet in order to move from development
    to


    acceptance. Unless everybody has a clear understanding of what it takes for a
    story


    to be done, there may be disagreement about how to work on a story, and what


    needs to happen at each stage of the process.


