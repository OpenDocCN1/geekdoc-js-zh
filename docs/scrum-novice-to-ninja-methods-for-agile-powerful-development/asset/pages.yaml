  md: '**Modular Development**


    Scrum supports the ability to develop a project in modules. Because scrum is based


    on thinking in terms of slices of functionality, it''s perfectly suited for making
    inde-


    pendent, interoperable features that can be developed atomically and work together


    harmoniously.


    For example, a new section for a website may inherit styling from a shared style


    guide and CSS structure, and may inherit its functionality from a shared template.


    The work to build out that section relies on those other components remaining


    static long enough to complete the work. Scrum provides the stability to support


    that, without limiting the development of the rest of the site.


    At the same time, updating the infrastructure of a product to support a new feature


    may happen at any time in the process, so a team has to consider up front how
    to


    make those changes safely, without breaking the work being done on other features.


    As another example, sometimes an API that every feature of the site relies on
    needs


    to be changed. Scrum encourages the team to manage the code in a modular, testable


    way, so that changes can be inherited by other feature stories that might be in
    pro-


    gress without undue breakage.


    **Flexible Scheduling**


    Companies serving customers in the web and mobile space need to be able to respond


    quickly to changes. However, engineers need to be confident that what they''re


    working on isn''t going to change before they can get the feature developed. It
    can


    be difficult to balance those two objectives.


    Scrum provides windows of opportunity that are long enough to allow a web or


    mobile feature to be fully developed, while still allowing a product to change
    direc-


    tions at the end of each sprint, based on data from the marketplace.


    **Reflection and Improvement**


    A scrum team isn''t only looking to improve the product: they''re also looking
    to


    improve their own process. Scrum teams get better over time at estimating how


    much work they can do, and improving their approach to working so that they can


    be the most productive.


    Scrum: Novice to Ninja


