    **Mixing Scrum With Waterfall**


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_26_2.png)


    Figure 1.3\. Waterfall (With Scrum for Engineering)


    While some organizations may claim to follow scrum, many of them actually follow


    a modified waterfall approach, using scrum techniques only for development.


    The rest of the organization structures itself around long-lived product timelines


    with static objectives. While that may be an improvement over pure waterfall,
    in


    that it allows the engineers to iterate and improve their process, it doesn''t
    take


    full advantage of the potential of scrum. Isolating scrum inside the development


    loop without inviting the learnings of the team into the planning and market


    testing process is a waste of resources, and a wasted opportunity.


    Mixing a little scrum into an otherwise waterfall organization is usually not
    a


    good idea, since it can draw attention to the fundamental conflicts between the


    different approaches, and foster friction.


