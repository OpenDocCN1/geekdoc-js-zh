    **The Product Backlog is the Responsibility of the Product Owner**


    While a product owner may choose to share the entire product backlog with the


    team on a regular basis, the items here are the responsibility of the product
    owner.


    It may not be productive to keep reminding the team of items on the product


    backlog that haven''t been touched in a long time, because it will divert attention


    from the work necessary to complete the current increment.


    While many product owners prefer to keep track of items in the product backlog
    as


    if they were going to become the final stories, there doesn''t have to be a one-to-one


    correspondence between items in the product backlog and stories that make it into


    the sprint backlog. Features and requirements that the product owner needs to
    track


    may turn into multiple stories, or several items may be combined to create one


    unified story of the appropriate size and scope for development.


    For example, if the customer needs to add a payment system to a site, that may
    be


    a single story for the development team, or it may be multiple stories. There
    may


    be developer stories around creating the ability to accept payments through a
    service,


    and separate stories for accepting credit cards, checks, or even maintaining a
    token


    system so that purchases can be made using a virtual currency. It might be possible


    to develop each one of these independently, and launch the system with just one.


    Whichever one goes out first may need to carry the weight of implementing some


    core functionality that all the others will share.


    Many product owners find it convenient to track the state of items in the product


    backlog using a staged process, whereby the item moves from ideation through


    design through engineering validation, until it''s ready to be phrased as a sprint


    backlog story and added to an upcoming sprint. Product owners should have a clear


    sense of what it takes to move an item from each of the states to the next, and
    that


    should be documented so it''ll be consistent for each story.


