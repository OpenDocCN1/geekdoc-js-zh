  md: '**About M. David Green**


    M. David Green is a writer and agile business coach, and the founder of Agile
    That Works


    (http://www.agilethatworks.com), a consultancy that helps people in engineering
    organizations


    collaborate to make constant improvement a daily practice.


    David studied Anthropology and Sociology at UC Berkeley, and later earned his
    MBA in


    Organizational Behavior. He has worked as an engineer, a writer, a designer, a
    marketing


    director, and a communications analyst in companies from Fortune 100 giants to
    tiny high-


    tech startups in San Francisco and Silicon Valley. He also teaches engineering
    techniques


    and agile principles through SitePoint.


    With over 10,000 hours of experience on scrum teams under his belt, David enjoys
    sharing


    what he''s seen to watch others improve their processes. Now he consults with
    companies to


