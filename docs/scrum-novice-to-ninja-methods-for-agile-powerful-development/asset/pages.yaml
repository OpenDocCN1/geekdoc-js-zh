    **All Team Member Are Equal**


    Although the members of a team may report to one or more managers inside or


    outside of the scrum context, within a scrum team all team members are considered


    equals. The team members shouldn''t report to the product owner or to the scrum


    master because that creates a tension between the agile roles and every employee''s


    independent place in an organization''s hierarchy. If seniority or reporting relation-


    ships exist among employees within the scrum team, they should be ignored when


