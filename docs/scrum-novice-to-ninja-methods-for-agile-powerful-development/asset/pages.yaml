  md: '**Objective**


    The purpose of the daily standup is to give everybody on the team an opportunity


    to share the status of the work they''re doing, and get help if anything is blocking


    their progress. Everyone on the team should pay attention as their teammates report,


    so they can have a clear picture of the status of the complete iteration they''re
    all


    working on.


    This is also an opportunity for anybody outside the team who''s interested in


    knowing what the team is working on to find out how stories are progressing, and


    what''s likely to be worked on next. Only team members are allowed to present
    at


    the daily standup, but anybody in the company may attend, and visitors should
    be


    invited to participate as silent observers.


    **Time Box**


    Traditionally, the daily standup is limited to 15 minutes. It''s a short ritual,
    and it''s


    kept short and made as convenient as possible so that everyone can commit to being


    present, participating actively, and paying attention while other people are speaking.


    Everyone is expected to stand, both so that they pay attention, and to encourage
    all


    participants to play their part in keeping the ritual short and focused. Most
    teams


    try to hold the standup away from their desks, and discourage people from using


    laptops and other devices during the ritual.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_83_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_83_1.png)


    **Keeping the Standup to Time**


    Keeping the daily standup within its 15 minute time box is the responsibility
    of


    the scrum master, but everybody on the team should feel empowered to enforce


    the rules of the standup, so the time box doesn''t get broken. That includes making


    sure everybody starts on time, pays attention, and doesn''t allow interruptions


    from guests.


    Different teams will choose different times of day to hold the stand up. Often
    first


    thing in the morning, or right before lunch, can be good times. These are natural


    breaks in the day that are usually common to most people on the team, so a 15


    minute standup won''t disrupt the focus needed for longer blocks of programming


    time.


