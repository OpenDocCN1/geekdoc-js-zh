    **Guests in Sprint Demos**


    The sprint demo is often a popular ritual for guests, because it''s the opportunity


    for people outside the scrum team to see what the team has been working on, and


    observe the state of the product in its next iteration based on the latest work
    pro-


    duced. But the presence of guests shouldn''t be allowed to interfere with the
    ob-


    jectives of the ritual, or alter the time box. Guests are observers, not participants.


    Unless feedback is solicited from guests, they should be asked not to comment


    on the product or the process.


