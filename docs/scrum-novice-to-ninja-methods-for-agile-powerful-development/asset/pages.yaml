  md: '**Ritual**


    a group of people coming together as part of the


    scrum process for a fixed time, with a specified


    agenda, to achieve a clearly defined outcome


    **Scrum Master**


    a person responsible for maintaining the artifacts


    and overseeing the rituals of scrum


    **Sprint**


    a fixed number of days during which the team


    can work together to produce an agreed upon


    set of changes to the product


    **Sprint backlog**


    a finite and well-defined set of stories the team


    has agreed they can reasonably complete in the


    current sprint


    **Story**


    a clear and consistent way of chunking, phras-


    ing, and discussing work the team may need to


    do on the product


    **User**


    a person who will be making use of the product


    Scrum is also flexible enough to support working styles for product owners who


    prefer to break down stories that can be completed in one week, two weeks, three


    weeks, four weeks or longer. While most web and mobile development teams tend


    to split the work into one- or two-week segments—known in scrum terminology as


    sprints—whatever the team agrees on should work. As long as the team is keeping


    track of how they work together, and they''re given the opportunity to reflect
    on a


    regular basis about their schedules, scrum can adapt to work on projects ranging


    from the simplest to the most complex.


    **Time Sensitivity**


    Scrum provides opportunities in every sprint to integrate the ideas of designers,


    engineers, executives, customers, product managers, and customers through real


    customer data. Because of the cyclical nature of scrum, and the iterative approach


    that encourages learning as you go, scrum allows mobile and web projects to adapt


    to changing technologies and changing market expectations quickly.


