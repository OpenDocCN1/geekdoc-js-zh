    during the sprint, based solely on the estimated points assigned to stories that
    were


    accepted as done. Only stories that were accepted as done, and that were assigned


    points at the sprint planning, should be included in this total. The total number
    of


    points completed in the sprint should be recorded as the team''s velocity for
    that


    sprint.


