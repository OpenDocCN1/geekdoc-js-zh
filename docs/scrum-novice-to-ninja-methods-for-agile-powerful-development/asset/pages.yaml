    **Pair Programming**


    Pair programming is very demanding. Some of the expectations are that two people


    share a single monitor, and trade responsibility for entering code (driving) and


    keeping track of what needs to happen next (navigating). A pair should be talking


    with each other constantly as they work, and neither member of a pair should allow


    distractions such as email to interfere with the process. Most pairs find they
    can


    work no more than six hours a day in this mode, but the productivity gains and


    the benefits to the stability of the team are worth the tradeoffs.


