  md: 'Scrum masters also maintain a number of artifacts that help the team stay focused


    on their goals and measure the sustainability of their progress toward their commit-


    ments. These artifacts, and the data they contain, may be subject to broad interpret-


    ation both within the team and outside it, so a scrum master needs to be capable
    of


    explaining the state of the team and its progress in terms that are understandable


    to a wide range of audiences, both within and outside the organization if needed.


    **A Day in the Life**


    Scrum masters need to be involved in every aspect of product development, so they


    have to work closely with many people and deal with a number of critical tools—as


    illustrated in the following list. (Don''t worry if there are some unfamiliar
    terms in


    here at this point. We''ll be discussing the artifacts and rituals of scrum soon.)
    So,


    their activities include:


    ■planning and hosting the rituals of scrum, including the daily standup, the sprint


    planning meeting, the sprint demo, and the sprint retrospective


    ■assisting the team in identifying blockers that get in the way of their development


    work


    ■soliciting help from team members, product owners, or anyone in the organization


    who can help remove blockers and get stories going again


    ■maintaining the artifacts of scrum and making sure everyone has access to them


    ■coaching team members about their roles and responsibilities, while watching


    for problems and helping to resolve them


    ■working with the product owner to help clarify stories and maintain a well-


    groomed backlog


    ■representing the needs of scrum to management and across the organization for


    the sake of the product and the team.


    One ritual that every scrum master will try to host on a daily basis is the fifteen-


    minute standup with the entire team, and any guests who care to observe. For some


    teams, this will happen early in the day, while other teams prefer to do it later.


