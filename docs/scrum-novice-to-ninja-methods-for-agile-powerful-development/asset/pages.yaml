  md: '![](img/b1806dfc7ab8e46f442d54c1e56b9394_25_0.png)


    Figure 1.2\. Agile Organization


    In an agile organization, guiding objectives and key performance indicators guide


    the process, but the team manages itself to meet those objectives. A product owner


    maintains the overall vision, and works with the scrum master to make sure that


    everyone on the team is clear about the objectives and how they''ll be measured.


    The input of the designers and the engineers is included at every stage in this
    pro-


    cess. Features are conceived and formulated into stories when the team is ready
    to


    work on them. No idea gets locked into a static product timeline.


    The value to a company of hiring its own team of designers and engineers is that


    these people can bring their design thinking and their current technical knowledge


    to the table for the benefit of the organization''s own objectives. Designers
    should


    be evaluating the user experience and figuring out the best solutions to real
    custom-


    ers'' problems, not decorating bad ideas to make them functional.


    Getting engineers involved in ideation allows them to pull in the latest technology


    as early as possible, since they''re in the best position to know what''s technically


    feasible. The sooner the designers and engineers are brought into the planning


    process, the more agile development will be.


    Scrum allows the full resources of the team to be applied when and where they
    can


    do the most good, and to work together in a sustainable and productive way. Instead


