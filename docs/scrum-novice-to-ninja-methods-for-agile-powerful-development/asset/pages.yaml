    The scrum contract revolves around several key concepts:


    ■Respecting Roles


    ■Embracing Transparency


    ■Maintaining Boundaries


    ■Iterating Hopefully


    ■Sharing Definitions


    Some of these concepts are familiar to anybody who has ever tried to work effectively


    on a team. Some of them apply specifically to the way scrum works. All of them


    rely on a willingness to work together toward a shared goal.


    **Respecting Scrum Roles**


    As we saw in Chapter 3, scrum defines a number of roles for people to take on.


    These roles serve a purpose in the context of scrum, and everyone needs to under-


    stand them regardless of how they relate to a person''s position or title in an
    organ-


    ization. Scrum isn''t about replacing the organizational hierarchy. In fact, scrum


    tries to be as independent of the organizational hierarchy as possible.


    Scrum expects people to be able to distinguish between their job and their role
    in


    the scrum process. This doesn''t mean that scrum releases you from the obligations


    of your job. What scrum provides is an alternate view onto the work you''re doing.


    When you assume a role in the scrum project, you''re agreeing to participate actively


    in a shared process to facilitate the work everybody''s doing.


