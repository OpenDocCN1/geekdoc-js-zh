  md: '**A Brief History of Scrum**


    The original concept for scrum came out of Japan, introduced in 1986 as part of
    *The*


    *New Product Development Game* by Hirotaka Takeuchi and Ikujiro Nonaka. They


    applied the concept of a scrum, taken from the team game rugby, to describe cross-


    functional team organization based around moving forward in a layered approach.


    Their concepts were codified as the Scrum Methodology at a joint presentation
    in


    1995 by Ken Schwaber and Jeff Sutherland, based on their personal experiences


    applying the concepts in their own organizations. This work inspired the 2001
    book,


    *Agile Software Development with Scrum*, written by Schwaber and Mike Beedle.


    At the time, the most prevalent approach for software development was called the


    **waterfall model**. Under the waterfall model, product development happens in


    stages, leading sequentially from requirements through design, implementation,


    and release. Until the 1990s, most software development was targeted at packaged


    software delivery for desktop computers. Such products had long development and


    release cycles. While waterfall is well-suited to products that have a long develop-


    ment trajectory, it doesn''t adapt well to situations where the product needs
    to change


    constantly in response to changing conditions.


    In the mid-to-late 1990s, new publishing models emerged involving electronic media


    and the Internet. To support these, software development organizations had to
    in-


    corporate more flexibility to adapt to changing browsers, tight media deadlines,
    and


    a variety of platforms with different requirements. Soon after that, the development


    of large monolithic software applications that lived on desktop computers gave
    way


    to smaller, more nimble apps that were delivered through mobile devices. A different


    approach was needed for developing these.


    It isn''t a coincidence that agile approaches became codified, and quickly became


    popular, just as the marketplace was shifting from desktop software to web and


    mobile software.


    **Comparing Scrum and Waterfall**


    The slow cycle of waterfall development may still be appropriate in a world of


    hardware development, or even in gaming. These industries rely on long, stable


    markets, where many of the decisions are either repetitive, constrained by external


    3


