    **Using a Third Engineer for Code Review**


    Since many of the tasks in this story are worked on by pairs, a third engineer
    has


    to be involved in doing the code review. Not every team requires code done by


    pairs to be reviewed by a third engineer, but this team has included that as part


    of their definition of done.


