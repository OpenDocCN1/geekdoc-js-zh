  md: 'Scrum encourages teams to work in a focused way for a limited period of time
    on


    a clearly defined set of features, understanding that the next set of features
    they


    may be asked to work on could be unpredictable because of changes in the market-


    place, feedback from customers, or any number of factors. Scrum allows teams to


    develop an improved ability to estimate how much effort it will take to produce
    a


    new feature in a relative way, based on the work involved in features they''ve
    de-


    veloped before. And scrum creates the opportunity for a team to reflect on the
    process


    and improve it regularly, bringing everybody''s feedback into play.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_22_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_22_1.png)


    **Don''t Confuse Merely Applying Scrum Terms with Actually Using**


    **Scrum**


    A familiar anti-pattern in non-agile organizations looking to mask their process


    problems is using the terminology of scrum as a labeling system on top of their


    waterfall techniques and tools. That can create confusion, and even negative asso-


    ciations among people who have seen these terms used incorrectly, and who


    mistakenly believe they''ve seen scrum in action.


    As we go through this book, you''re going to find out more about how scrum func-


    tions. You''re going to be introduced to all of the aspects of scrum, including
    its


    rituals, its artifacts, and the roles that it creates for the people in an organization.


    We''re going to introduce you to a team of people working in a scrum environment,


    and show you how they adopted scrum in the first place, and how they adapted to


    it.


    Before we get there, it''s worthwhile taking a moment to position scrum in its
    histor-


    ical context. After all, scrum isn''t the only way to organize product development.


    Scrum came into existence right around the time that web development emerged


    on the engineering landscape, and it flourished as mobile technology became part


    of our daily lives. If you consider how scrum works, where it came from, and how


    we apply it, I think you''ll see that there might be a reason for that.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_22_2.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_22_1.png)


    **Scrum''s Odd Vocabulary**


    The vocabulary of scrum is distinctive, and may sound odd. That''s intentional.


    Scrum uses terms such as ritual, artifact, and story to make it clear that these


    concepts are different from related ideas that may be encountered in other project


    management approaches.


