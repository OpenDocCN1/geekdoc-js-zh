  md: '**Scrum Roles and Organizational Roles**


    The roles of scrum are independent of the formal job titles that may be assigned


    and managed as part of the hierarchy of a company. For some teams, this can cause


    confusion over how the people who aren''t part of the formal agile process fit
    into


    the process. Nobody outside the scrum team really needs to understand scrum for


    it to work. But an important part of scrum is transparency, and the activities
    of a


    scrum team may draw outside attention.


    In this chapter, we''ll go over the critical roles of scrum master, product owner,
    and


    team member. In addition, we''ll discuss the motivations and perspectives of many


    people outside the scrum team whose involvement may have an effect on how well


    scrum works, and may ultimately be the key to advocating for and maintaining


    scrum in an organization.


    **Scrum Master**


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_49_0.png)


    Figure 3.2\. The role of the scrum master


    A **scrum master** is the glue that ties a scrum team together. Scrum masters
    are re-


    sponsible for keeping people clear on their roles, managing the rituals and artifacts


    of scrum (which we''ll be getting to shortly), and coaching people within the
    team


