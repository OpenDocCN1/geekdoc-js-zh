    **Artifacts Overview**


    Although formal scrum is agnostic about exactly how the artifacts of the process


    are used, we''ll cover a few ways of building and maintaining artifacts found
    to be


    useful for the type of work that web and mobile teams tend to get into.


    One of the most basic artifacts of scrum for web and mobile work is the story
    that


    describes a feature to be worked on. Stories are developed and managed in backlogs.


    Separate backlogs are maintained for the product owner to keep track of the overall


    vision of the product, and for the team to participate in the sprint currently
    in pro-


    gress. Both backlogs house descriptions of what needs to happen to take the product


    forward, but items on the product backlog will not look like stories on the sprint


    backlog. Scrum teams use a scrum board for tracking the progress of stories through


    the sprint, and we''ll discuss how those work together.


    Scum also offers a number of tools for gathering statistics that are useful for
    tracking


    the performance of the team, and communicating how product development is going


    to people both inside and outside the scrum team. Among these, we''re going to


    cover the velocity chart that spans multiple sprints, and the burndown chart that


    tracks progress within a single sprint.


    Other artifacts that a scum team is going to find useful include a definition
    of done,


    which is agreed to by the product owner and team under the supervision of the


    scrum master, as well as the actual product increment, or the current state of
    the


    product as it exists at the end of the sprint.


