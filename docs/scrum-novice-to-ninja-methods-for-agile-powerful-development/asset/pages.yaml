  md: 'and across the organization to help overcome blockers and maintain a sustainable


    productive pace.


    Unlike project managers, a scrum master comes with a clearly defined mission as


    a servant leader to the team. A scrum master has no formal authority within an
    or-


    ganization, other than the authority to shepherd the team through the rituals
    of


    scrum, and maintain the artifacts that track the team''s progress. But the scrum


    master has ultimate authority when it comes to the scrum process and how it''s
    being


    applied.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_0.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_1.png)


    **The Scrum Master''s Involvement**


    The scrum master may be a part of the development team, but just as often a scrum


    master may have no involvement in the day-to-day development work of the team.


    For teams who have been following scrum practices for a while, and who are


    comfortable with scrum, a single scrum master with no development duties may


    be able to take responsibility simultaneously for two teams.


    ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_2.png) ![](img/b1806dfc7ab8e46f442d54c1e56b9394_50_1.png)


    **The Scrum Master''s Responsibilities**


    A scrum master is usually part of the Engineering department, and in some cases


    may be a member of the development team. It''s a conflict of interest for a scrum


    master to be the manager of the people on a development team. A scrum master


    should have no formal organizational authority over the team, otherwise the team


    may feel inhibited about raising issues with the scrum master because of the po-


    tential ramifications.


    **Responsibilities**


    There are a few critical rituals that a scrum master must observe. At minimum,
    these


    include the daily standup, the sprint planning meeting, the end-of-sprint demo,


    and the sprint retrospective. We''ll be going into more detail about these rituals
    soon.


    In addition to hosting the rituals of scrum, a scrum master is responsible for


    coaching the team through the scrum process. This may involve stepping boldly


    into discussions about individual roles and duties, and helping people communicate


    their needs and expectations in a way that makes them understandable. In that


    sense, a scrum master can become a team''s advocate, counselor, and liaison to
    other


    parts of the organization.


