  md: '**Preface**


    If you haven''t heard about scrum, and you work in web or mobile development,
    it''s


    time you did. Scrum is a way of organizing engineering teams around time-tested


    techniques to improve communication, increase the flexibility of the product devel-


    opment process, support constant improvement, and provide a sustainable rhythm


    for productivity with less pain and more participation.


    Scrum offers a core set of operating principles, and supports incredible flexibility


    for a team to adapt the process to their particular needs. Properly applied, scrum


    insulates engineers against interruptions and micromanagement while giving product


    managers the flexibility to adapt to market changes regularly, and the ability
    to


    predict how much work the team can take on and complete.


    In this book, you will be introduced to the fundamentals of scrum, and given ex-


    amples that you can apply immediately. And since scrum is as much about the


    people as it is about the processes, we will introduce you to a typical web and
    mobile


    development team, and show you the impact of scrum on their jobs, their working


    relationships, and the things they care about most in their professions.


    Whether you''re not sure what scrum is, or you think your scrum process isn''t
    all


    that it should be, this book can help. Scrum isn''t magic, but the results it
    can produce


    are well worth taking the time to learn how to apply it effectively.


    **Who Should Read This Book**


    This book is for anyone who works in a team to build web or mobile apps: engineers,


    QA, management, designers, and product managers. It assumes no familiarity with


    scrum or other project management techniques. While it''s aimed at readers who


    have little understanding of scrum, it will also be useful to those who are currently


    using scrum, but aren''t sure that they''re getting the results that they want
    from it.


    **Conventions Used**


    You''ll notice that we''ve used certain typographic and layout styles throughout
    this


    book to signify different types of information. Look out for the following items.


