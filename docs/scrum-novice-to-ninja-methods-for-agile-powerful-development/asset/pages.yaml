  md: '**Chapter****3**


    **Scrum Roles**


    **Establishing Who Does What**


    Scrum is a system that supports sustained productivity for a team. But if you
    try to


    adopt scrum, and don''t give adequate consideration to the purpose of each of
    the


    roles that scrum assigns to the participants, you''re likely to find problems
    maintain-


    ing the balance and rhythm of scrum. Cutting corners on the defined roles is one


    of the most prevalent anti-patterns in scrum, and it''s easily avoided by making
    the


    assignment of roles deliberate and explicit.


    Traditional scrum defines only three critical roles: scrum master, product owner,


    and team member. We''ll start with these. But scrum plays out in a context, and
    for


    web and mobile development, that context is usually a company or organization


    trying to create technical embodiments of experiences for clients, users, or customers.


    **No Hierarchy**


    An agile scrum team operates within an organization that may have a hierarchy
    of


    management. But the roles in scrum are all equals as far as the process is concerned.


