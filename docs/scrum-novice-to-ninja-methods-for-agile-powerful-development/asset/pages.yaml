    If the daily standup is one of the most iconic rituals of scrum, the sprint retrospective


    may be the most representative of the agile philosophy. Sprint retrospectives
    offer


    the team the opportunity to reflect on what they''ve been doing at the end of
    every


    sprint, and figure out how they want to modify their process going forward.


