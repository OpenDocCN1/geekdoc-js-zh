  md: '**Reasons to Choose Scrum for Web and**


    **Mobile**


    We''ve covered how scrum works, and why it''s a productive way to structure web


    and mobile product development. At this point, it''s worth taking a moment to
    recap


    some of the highlights of how scrum applies in particular to web and mobile product


    development.


    Fundamentally, scrum offers a team-based approach to project work that allows
    a


    product development process to benefit from iterative self-reflection, helps a
    team


    learn how to estimate their own ability to address unfamiliar tasks, exposes metrics


    about team effectiveness, encourages dialogue about feature implementation instead


    of static specifications, and supports rapid response to changing market conditions


    in a sustainable manner.


    All of those advantages can make a real difference when doing web and mobile


    development. Most work in web or mobile development tends to be very time


    sensitive, and needs to respond quickly to changes in the marketplace. Whether


    that means new browsers, new technologies, or new messaging that needs to be


    communicated immediately, web and mobile teams have to be able to respond


    quickly.


    Scrum provides a framework that allows developers to work toward a vision, and


    the opportunity to shift direction as the environment changes without feeling
    torn


    away from their focus.


    When following best development practices, the type of work that''s involved in


    building and enhancing a web or mobile project tends to break down into discrete


    pieces that can be worked on independently, with a core of infrastructure stories


    that support a broad range of independent feature stories. This makes it easier
    for


    one part of a web or mobile project to be developed in isolation, and leverage
    the


    shared resources of other parts of the same project.


    Scrum encourages teams to spell out the work on a new feature so that it can be


    developed in parallel, without relying on other undeveloped features. By using


    stories, and making sure each story is properly formatted and estimated, the team


    sets itself up for a consistent and productive development experience.


    7


    Introducing Scrum


