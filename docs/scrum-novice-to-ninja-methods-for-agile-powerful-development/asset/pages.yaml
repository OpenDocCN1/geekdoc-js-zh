    **Buy-in**


    If your organization is currently following something like a waterfall process,
    the


    people at every stage in the cycle may be comfortable with the roles they have,
    and


    won''t be anxious to try something new. You may need to show them just how much


    more effective and productive the organization could be with a scrum-based process.


    Executives may be concerned they''ll have less control over a team that self-organizes,


    and that they''ll have less input into a process that generates its own ideas.
    Point


    out to them that an agile process gives them the opportunity to shift and adjust


    priorities every sprint, adapting to the marketplace more effectively, while providing


    valuable feedback that they can use to help guide their decision-making process.


    Engineering managers may be confused about what their role is in a team that


    manages itself, but that concern grows out of a semantic misconception about the


    concept of a team being self-managing. Managers are still essential to help the
    team


    allocate resources, resolve personal issues, and identify and retain talent. Managers


    also bring their own background and knowledge to the whole development process.


    Engineering managers are free to dedicate a portion of their time to hands-on
    work


    as one of the engineers on a team, but their main responsibility is securing the
    team''s


    place in the organization, making sure they have the tools and resources they
    need,


