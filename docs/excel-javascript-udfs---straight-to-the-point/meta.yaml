    \n**Figure 31** *Enter the array formula by typing **Ctrl+Shift+Enter**.*\n\n\
    ## Creating a Streamed Function\n\nThe JavaScript UDFs you created earlier—STOCKPRICE\
    \ and STOCKPRICEMULTI—fetch data from the web service but have no way to update\
    \ the results without user interaction. Wouldn't it be amazing to have the JavaScript\
    \ UDF update its content every 5 seconds, without any user interaction?\n\nYou\
    \ can make this happen by using a streamed function. To do so, you can set up\
