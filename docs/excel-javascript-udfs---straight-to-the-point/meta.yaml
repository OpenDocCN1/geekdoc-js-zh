- md: " # Signing Up for the Office Insider Program\n\nStart Excel and open a new\
    \ file by simply pressing the Esc key. Click File / Account, click the Office\
    \ Insider button, and then select Join Office Insider from the dropdown menu.\n\
    \n![](img/30db92ad2f868a184b03cc16c418535e_8_0.png)\n\nSelect the Insider level\
    \ to get the earliest preview builds, which allows you to work with the most recent\
    \ features. Then simply click OK to complete your registration.\n\n![](img/30db92ad2f868a184b03cc16c418535e_8_1.png)\n\
    \nCongratulations! You are now signed up for the Office Insider program and are\
    \ ready to experience and master JavaScript UDFs, as described in the following\
    \ chapters of this book.\n\n![](img/30db92ad2f868a184b03cc16c418535e_8_2.png)\n\
    \n## Getting Familiar\n\n## ADD-IN SOURCE FILES AND FILE STRUCTURES\n\nThere are\
    \ basically four source files that you will use to create the add-in to host the\
    \ JavaScript UDFs:\n\n- 1. The JavaScript functions file\n2. The JSON metadata\
    \ file\n3. The loader HTML file\n4. The add-in manifest file\n\nYou can use your\
    \ favorite script editor, such as Notepad++ or Brackets, to create these files\
    \ as described in the following sections.\n\n> You need to host the manifest file\
    \ locally to install the Office add-in, and upload the other files to a remote\
    \ web server to make them available online. Or you can use your local machine\
    \ to publish the source files to local server and refer to them by altering the\
    \ corresponding `Url` properties in the manifest file. See **Appendix** for hosting\
    \ source files locally.\n\nThe source files used in this book are hosted at [https://pub.mrexcel.com/javascript-udfs/](https://pub.mrexcel.com/javascript-udfs/).\n\
    \n> This book uses the `udfs` prefix with the names of source files. However,\
    \ you are free to use any prefixes or filenames for your own add-ins.\n\n## The\
    \ JavaScript Functions File—udfs.functions.js\n\n**udfs.functions.js** is a JavaScript\
    \ file that contains the JavaScript UDF code. You will write into this file the\
    \ JavaScript UDF code and necessary helper functions discussed in this book.\n\
    \nThe following code shows the structure of the initial functions file, which\
    \ contains a function called `AVERAGE()`. This function takes two numeric parameters\
    \ and returns the average of these two numbers as a result. This function will\
    \ be called when the JavaScript UDF is used in a cell formula.\n\n```\nudfs.functions.js\n\
    \n1  /*\n2   * The actual function to calculate the average of two given numbers.\n\
    3   */\n4  function AVERAGE (a, b) {\n5      return (a + b) / 2;\n6  }\n```\n\n\
    ## The JSON Metadata File—udfs.metadata.json\n\n**udfs.metadata.json** contains\
    \ the metadata of the JavaScript UDFs in JSON format. The JSON metadata file is\
    \ processed as soon as the initializing script is executed in the loader HTML\
    \ file, and the JavaScript UDFs defined in this file are registered in the Excel\
    \ environment. This file tells Excel how to present the associated JavaScript\
    \ UDFs to the user and execute them by using the properties and options listed\
    \ in the metadata.\n\nThe **udfs.metadata.json** file contains a property called\
    \ `functions` whose value is an array of objects. Each of these objects corresponds\
    \ to particular JavaScript UDF metadata, which is identified by the `name` property.\
    \ This metadata defines the function properties and options. The following code\
    \ shows the structure of the initial JSON metadata file, which contains the metadata\
    \ of the JavaScript UDF called **AVERAGE**. We discuss each property and option\
    \ in detail next.\n\n```\nudfs.metadata.json\n{\n    \"functions\": [\n      \
    \  {\n            \"name\": \"AVERAGE\",\n            \"description\": \"Calculates\
    \ the average of given numbers.\",\n            \"helpUrl\": \"https://pub.mrexcel.com/javascript-udfs/help/udfs.help.average.html\"\
    ,\n            \"parameters\": [\n                {\n                    \"name\"\
    : \"first value\",\n                    \"description\": \"The first number\"\
    ,\n                    \"type\": \"number\",\n                    \"dimensionality\"\
    : \"scalar\"\n                },\n                {\n                    \"name\"\
    : \"second value\",\n                    \"description\": \"The second number\"\
    ,\n                    \"type\": \"number\",\n                    \"dimensionality\"\
    : \"scalar\"\n                }\n            ],\n            \"result\": {\n \
    \               \"type\": \"number\",\n                \"dimensionality\": \"\
    scalar\"\n            },\n            \"options\": {\n                \"sync\"\
    : true,\n                \"stream\": false,\n                \"cancelable\": false\n\
    \            }\n        }\n    ]\n}\n```\n\nSix properties define the metadata\
    \ of the function:\n\n- 1. `name`: The name of the JavaScript UDF, which will\
    \ be used as the function name in a worksheet cell with a namespace prefix that\
    \ is defined in the manifest file. This property also defines the JavaScript function\
    \ name used in the JavaScript functions file.\n\n- 2. `description`: A short description\
    \ of the function that will show up in the available functions list.\n\n- 3. `helpUrl`:\
    \ The URL of the web page that is supposed to display the help information in\
    \ an Excel task pane on a help request. This feature is currently not supported\
    \ in Developer Preview.\n\n- 4. `parameters`: An array that contains function\
    \ parameters with the following properties:\n\n  a) `name`: The parameter's brief\
    \ information text, which is displayed right after the opening function parenthesis\
    \ in a cell.\n\n  b) `description`: More information to be displayed about the\
    \ parameter. This feature is currently not supported in Developer Preview.\n\n\
    \  c) `type`: The type of the parameter, and must be set to `boolean`, `number`\
    \ or `string`. The **AVERAGEfunction's parameters are numeric values, so theirtype`\
    \ parameters are defined as `number`.\n\n  d) `dimensionality`: Whether the parameter\
    \ is a single cell value passed as a `scalar` value or a range passed as a `matrix`\
    \ value.\n\n- 5. `result`: The type and dimensionality of the returned result,\
    \ defined with the following properties:\n\n  a) `type`: A result type, just like\
    \ the `parameters` type property explained above.\n\n  b) `dimensionality`: Whether\
    \ the returned value will be a `scalar` value or a `matrix` defined by an array.\
    \ If the returned value is `scalar`, Excel fills in the returned value in the\
    \ caller cell. If it is `matrix`, you enter the formula as an array formula by\
    \ pressing **Ctrl+Shift+Enter** to get the returned matrix as a result in multiple\
    \ cells. The **AVERAGE** function returns a scalar, so its `dimensionality` property\
    \ is defined as `scalar`.\n\n- 6. `options`: The function's behavior. There are\
    \ three properties to define it:\n\n  a) `sync`: This property defines whether\
    \ the function is synchronous or asynchronous. Synchronous functions offer fast\
    \ performance as they run in the same process as Excel. However, if your JavaScript\
    \ UDF retrieves data from a web service, then it must be asynchronous to avoid\
    \ locking Excel until it returns the expected result. By default this property\
    \ is set to `true`, which designates the function as asynchronous.\n\n  b) `stream`:\
    \ You can create streamed functions by setting this property to `true`. Suppose\
    \ the JavaScript UDF has been set to generate a new value over time or fetch the\
    \ value every second from a web service providing stock prices. You can set this\
    \ option to `true` and write the JavaScript function that will repeat itself over\
    \ a given interval to output the data in the given interval without user interaction.\n\
    \n  c) `cancelable`: Streamed functions and asynchronous functions can be canceled\
    \ to stop function execution in certain situations, such as with editing and deleting\
    \ a cell referencing the function, a parameter value changing referencing to another\
    \ cell, or a manual recalculation initiated by the user. You can make a function\
    \ cancelable by setting this property to `true` and providing the `caller.onCanceled`\
    \ event listener in the function.\n\n## The Loader HTML File—udfs.loader.html\n\
    \nudfs.loader.html is a simple HTML file that is primarily the loader of Office.js\
