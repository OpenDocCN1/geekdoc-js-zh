  md: '# The Loader HTML File—udfs.loader.html


    udfs.loader.html is a simple HTML file that is primarily the loader of Office.js
    in the Office JavaScript API library. The Office.js file is responsible for creating
    the Office object, which allows functions to be initialized and to interact with
    the Office application (Excel in this case).


    ```

    udfs.loader.html

    1 <!DOCTYPE html>

    2 <html>

    3     <head>

    4         <meta charset="UTF-8" />

    5         <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    6         <meta http-equiv="Expires" content="0" />

    7         <title></title>

    8         <script src="https://unpkg.com/@microsoft/office-js@1.1.7-adhoc.3/dist/office.js"
    type="text/javascript"></script>

    9         <script src="udfs.functions.js" type="text/javascript"></script>

    10         <script type="text/javascript">

    11             (function () {

    12                 Office.initialize = function (reason) {

    13                     return Excel.CustomFunctions.initialize();

    14                 };

    15             })();

    16         </script>

    17     </head>

    18     <body>

    19     </body>

    20 </html>

    ```


    In the udfs.loader.html file just shown, the first <script> element in the <head>
    section on **Line 8** adds a reference to the Office.js file currently hosted
    at the content delivery network called *unpkg*. The second <script> element, on
    **Line 9**, loads the JavaScript functions file udfs.functions.js.


    Finally, the loader file contains an initialization script that instructs the
    API to initialize the JavaScript UDFs when the API is completely loaded and ready
    to interact with the Excel application by using the Excel object provided by the
    library.


    ```

    11             (function () {

    12                 Office.initialize = function (reason) {

    13                     return Excel.CustomFunctions.initialize();

    14                 };

    15             })();

    ```


    > The reason parameter of the Office.initialize event listener function can be
    used to determine if an Office add-in was inserted in the document for the first
    time (reason="inserted") or was already inserted before and is loaded as part
    of the document (reason="documentOpened"), so different logic can be implemented
    for when the add-in is first inserted versus when it is already part of the document.'
  merge: -1
