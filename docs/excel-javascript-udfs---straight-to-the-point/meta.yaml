  md: '# The Office Insider Program


    # JOINING THE OFFICE INSIDER PROGRAM


    JavaScript UDFs are currently available for testing in Excel in Developer Preview
    for Microsoft Office Insider subscribers only. Therefore, you need to have the
    Office Insider version of the application and must be signed up for the Office
    Insider program.


    > Visit [https://products.office.com/office-insider](https://products.office.com/office-insider)
    for more information about the Microsoft Office Insider program. You can also
    find information for the Targeted release for commercial Office 365 subscribers
    in the same page.


    # Downloading and Installing Office Insider


    Go to the **My Office Account / Install Office** page online—[https://stores.office.com/myaccount/home.aspx](https://stores.office.com/myaccount/home.aspx)—and
    select the appropriate **Office Insider** option under **Version**, click **Install**,
    and simply follow the installation steps.


    ![](img/30db92ad2f868a184b03cc16c418535e_7_0.png)


    **Figure 1** *Select the Office Insider version to install.*


    You will be ready to join the Office Insider program as soon as the Office 2016
    installation is complete.


    ![](img/30db92ad2f868a184b03cc16c418535e_7_1.png)


    **Figure 2** *You''re all set and ready to join the Office Insider program.*'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Signing Up for the Office Insider Program


    Start Excel and open a new file by simply pressing the Esc key. Click File / Account,
    click the Office Insider button, and then select Join Office Insider from the
    dropdown menu.


    ![](img/30db92ad2f868a184b03cc16c418535e_8_0.png)


    Select the Insider level to get the earliest preview builds, which allows you
    to work with the most recent features. Then simply click OK to complete your registration.


    ![](img/30db92ad2f868a184b03cc16c418535e_8_1.png)


    Congratulations! You are now signed up for the Office Insider program and are
    ready to experience and master JavaScript UDFs, as described in the following
    chapters of this book.


    ![](img/30db92ad2f868a184b03cc16c418535e_8_2.png)'
