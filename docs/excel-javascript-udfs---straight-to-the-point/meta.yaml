    function STOCKPRICEMULTI(rng) {\n58\t\treturn new OfficeExtension.Promise(function(setResult,\
    \ setError){\n59\t\t\tif (rng[0].length > 1) {\n60\t\t\t\tsetResult('');\n61\t\
    \t\t} else {\n62\t\t\t\tfetchStockPriceMulti(rng, function(data){\n63\t\t\t\t\t\
    setResult(data);\n64\t\t\t\t});\n65\t\t\t}\n66\t\t});\n67\t}\n68\n69\t/*\n70\t\
    \ * Helper function for STOCKPRICEMULTI() function\n71\t * This function makes\
    \ the web service call and returns\n72\t * the fetched data to the STOCKPRICEMULTI()\
    \ function as a matrix\n73\t */\n74\tfunction fetchStockPriceMulti(rng, callback)\
    \ {\n75\t\tvar xmlhttp = new XMLHttpRequest();\n76\n77\t\txmlhttp.onreadystatechange\
