    101\t}\n```\n\nThe **STOCKPRICEMULTI()** JavaScript function expects a single-column\
    \ parameter, so you need to check the inner array dimension and return an empty\
    \ result if it is not as expected:\n\n```\n59\t\tif (rng[0].length > 1) {\n60\t\
    \t\tsetResult('');\n61\t\t} else {\n```\n\nLet's look at how to fetch data for\
