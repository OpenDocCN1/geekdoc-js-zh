  md: '# ADDING THE TRUSTED ADD-IN CATALOG IN EXCEL


    As soon as you click the **Share** button, Windows confirms that the folder is
    successfully shared. Simply right-click the shared folder and copy the link, which
    is the network path you are going to set as the trusted catalog address in Excel
    to publish the manifest file.


    ![](img/30db92ad2f868a184b03cc16c418535e_16_0.png)


    **Figure 8** *Windows confirms that the catalog folder is shared.*


    Finally, copy the **udfs.manifest.xml** file into the catalog folder.


    ![](img/30db92ad2f868a184b03cc16c418535e_16_1.png)


    **Figure 9** *Copy and paste the udfs.manifest.xml file.*


    That''s it! The catalog folder containing the manifest file is ready, and you
    can continue the installation process in Excel.


    # Adding the Trusted Add-in Catalog in Excel


    An add-in catalog is used to store manifest files for Office add-ins so the add-ins
    can be installed in the client application as trusted sources. In this case, you
    need to use the **Network Shared Folder** type add-in catalog to install the add-in,
    and you first need to instruct the Office Trust Center about the catalog folder.


    > The **Trust Center** is where you can find security and privacy settings for
    Microsoft Office programs. You can access it by following exactly the same procedure
    in each Office program.'
