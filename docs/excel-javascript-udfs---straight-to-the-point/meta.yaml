  md: '# About Caching the Source Files


    When the add-in is installed, the add-in source files are automatically cached
    in the Windows file system. The next time you start Excel, the add-in will be
    recognized quickly, functions will be listed in the available functions list,
    and synchronous functions will be executed even if you are not connected to the
    Internet.


    In the case of an asynchronous function, you need to be connected to the Internet
    to load the add-in and execute the function; if you do not have an Internet connection,
    Excel will return a message indicating an error in the event that you try to use
    the function or recalculate a cell containing the function.


    ![](img/30db92ad2f868a184b03cc16c418535e_23_0.png)


    **Figure 22** *An Internet connection is required to reload the add-in.*


    If you make any changes in the source files, then you can simply reinstall the
    add-in. However, if you make any changes in the manifest file, then you first
    need to quit and restart Excel.


