  - '[PAGE 9]


    # Getting Familiar


    # ADD-IN SOURCE FILES AND FILE STRUCTURES


    There are basically four source files that you will use to create the add-in to
    host the JavaScript UDFs:


    +   1. The JavaScript functions file

    2. The JSON metadata file

    3. The loader HTML file

    4. The add-in manifest file


    You can use your favorite script editor, such as Notepad++ or Brackets, to create
    these files as described in the following sections.


    > You need to host the manifest file locally to install the Office add-in, and
    upload the other files to a remote web server to make them available online. Or
    you can use your local machine to publish the source files to local server and
    refer to them by altering the corresponding `Url` properties in the manifest file.
    See **Appendix** for hosting source files locally.


    The source files used in this book are hosted at [https://pub.mrexxcel.com/javascript-udfs/](https://pub.mrexxcel.com/javascript-udfs/).


    > This book uses the `udfs` prefix with the names of source files. However, you
    are free to use any prefixes or filenames for your own add-ins.


    # The JavaScript Functions File—udfs.functions.js


    **udfs.functions.js** is a JavaScript file that contains the JavaScript UDF code.
    You will write into this file the JavaScript UDF code and necessary helper functions
    discussed in this book.


    The following code shows the structure of the initial functions file, which contains
    a function called `AVERAGE()` . This function takes two numeric parameters and
    returns the average of these two numbers as a result. This function will be called
    when the JavaScript UDF is used in a cell formula.


    ```

    udfs.functions.js


    1  /*

    2   * The actual function to calculate the average of two given numbers.

    3   */

    4  function AVERAGE (a, b) {

    5      return (a + b) / 2;

    6  }

    ```'
  - "[PAGE 10]\n\n# The JSON Metadata File—udfs.metadata.json\n\n**udfs.metadata.json**\
    \ contains the metadata of the JavaScript UDFs in JSON format. The JSON metadata\
    \ file is processed as soon as the initializing script is executed in the loader\
    \ HTML file, and the JavaScript UDFs defined in this file are registered in the\
    \ Excel environment. This file tells Excel how to present the associated JavaScript\
    \ UDFs to the user and execute them by using the properties and options listed\
    \ in the metadata.\n\nThe **udfs.metadata.json** file contains a property called\
    \ `functions` whose value is an array of objects. Each of these objects corresponds\
    \ to particular JavaScript UDF metadata, which is identified by the `name` property.\
    \ This metadata defines the function properties and options. The following code\
    \ shows the structure of the initial JSON metadata file, which contains the metadata\
    \ of the JavaScript UDF called **AVERAGE**. We discuss each property and option\
    \ in detail next.\n\n```\nudfs.metadata.json\n{\n    \"functions\": [\n      \
    \  {\n            \"name\": \"AVERAGE\",\n            \"description\": \"Calculates\
    \ the average of given numbers.\",\n            \"helpUrl\": \"https://pub.mrexcel.com/javascript-udfs/help/udfs.help.average.html\"\
    ,\n            \"parameters\": [\n                {\n                    \"name\"\
    : \"first value\",\n                    \"description\": \"The first number\"\
    ,\n                    \"type\": \"number\",\n                    \"dimensionality\"\
    : \"scalar\"\n                },\n                {\n                    \"name\"\
    : \"second value\",\n                    \"description\": \"The second number\"\
    ,\n                    \"type\": \"number\",\n                    \"dimensionality\"\
    : \"scalar\"\n                }\n            ],\n            \"result\": {\n \
    \               \"type\": \"number\",\n                \"dimensionality\": \"\
    scalar\"\n            },\n            \"options\": {\n                \"sync\"\
    : true,\n                \"stream\": false,\n                \"cancelable\": false\n\
    \            }\n        }\n    ]\n}\n```"
  - '[PAGE 11]


    Six properties define the metadata of the function:


    +   1. `name`: The name of the JavaScript UDF, which will be used as the function
    name in a worksheet cell with a namespace prefix that is defined in the manifest
    file. This property also defines the JavaScript function name used in the JavaScript
    functions file.


    +   2. `description`: A short description of the function that will show up in
    the available functions list.


    +   3. `helpUrl`: The URL of the web page that is supposed to display the help
    information in an Excel task pane on a help request. This feature is currently
    not supported in Developer Preview.


    +   4. `parameters`: An array that contains function parameters with the following
    properties:


    +   a) `name`: The parameter''s brief information text, which is displayed right
    after the opening function parenthesis in a cell.


    +   b) `description`: More information to be displayed about the parameter. This
    feature is currently not supported in Developer Preview.


    +   c) `type`: The type of the parameter, and must be set to `boolean`, `number`
    or `string`. The **AVERAGE** function''s parameters are numeric values, so their
    `type` parameters are defined as `number`.


    +   d) `dimensionality`: Whether the parameter is a single cell value passed as
    a `scalar` value or a range passed as a `matrix` value.


    +   5. `result`: The type and dimensionality of the returned result, defined with
    the following properties:


    +   a) `type`: A result type, just like the `parameters` type property explained
    above.


    +   b) `dimensionality`: Whether the returned value will be a `scalar` value or
    a `matrix` defined by an array. If the returned value is `scalar`, Excel fills
    in the returned value in the caller cell. If it is `matrix`, you enter the formula
    as an array formula by pressing **Ctrl+Shift+Enter** to get the returned matrix
    as a result in multiple cells. The **AVERAGE** function returns a scalar, so its
    `dimensionality` property is defined as `scalar`.


    +   6. `options`: The function''s behavior. There are three properties to define
    it:


    +   a) `sync`: This property defines whether the function is synchronous or asynchronous.
    Synchronous functions offer fast performance as they run in the same process as
    Excel. However, if your JavaScript UDF retrieves data from a web service, then
    it must be asynchronous to avoid locking Excel until it returns the expected result.
    By default this property is set to `true`, which designates the function as asynchronous.


    +   b) `stream`: You can create streamed functions by setting this property to
    `true`. Suppose the JavaScript UDF has been set to generate a new value over time
    or fetch the value every second from a web service providing stock prices. You
    can set this option to `true` and write the JavaScript function that will repeat
    itself over a given interval to output the data in the given interval without
    user interaction.


    +   c) `cancelable`: Streamed functions and asynchronous functions can be canceled
    to stop function execution in certain situations, such as with editing and deleting
    a cell referencing the function, a parameter value changing referencing to another
    cell, or a manual recalculation initiated by the user. You can make a function
    cancelable by setting this property to `true` and providing the `caller.onCanceled`
    event listener in the function.'
