    \   \"price\": 1001.7\n    },\n    \"AAPL\": {\n        \"price\": 165.31\n  \
    \  },\n    \"KO\": {\n        \"price\": 42.67\n    }\n}\n```\n\nAs soon as the\
    \ web service returns the result as a JSON string, you start processing this string\
    \ to create a new array that consists of prices in the same order, with the requested\
    \ symbols:\n\n1. Convert the JSON string to an object by using the `JSON.parse()`\
    \ method. You now have an object named `obj`, parsed with the associated properties\
    \ (see **Line 80**). For example, in the earlier JSON string example, `obj[\"\
    MSFT\"][\"price\"]` is the price value of the `obj[\"MSFT\"]` property.\n\n2.\
    \ To create an array named `ret` with price values corresponding to the requested\
    \ symbols in the same order, loop through the `rng` array parameter, which consists\
    \ of symbols, and check whether `obj` contains a property named with those symbols\
    \ by using the `hasOwnProperty()` method (see **Lines 83—89**).\n\n3. If the property\
