  md: "# The JSON Metadata File—udfs.metadata.json\n\n**udfs.metadata.json** contains\
    \ the metadata of the JavaScript UDFs in JSON format. The JSON metadata file is\
    \ processed as soon as the initializing script is executed in the loader HTML\
    \ file, and the JavaScript UDFs defined in this file are registered in the Excel\
    \ environment. This file tells Excel how to present the associated JavaScript\
    \ UDFs to the user and execute them by using the properties and options listed\
    \ in the metadata.\n\nThe **udfs.metadata.json** file contains a property called\
    \ `functions` whose value is an array of objects. Each of these objects corresponds\
    \ to particular JavaScript UDF metadata, which is identified by the `name` property.\
    \ This metadata defines the function properties and options. The following code\
    \ shows the structure of the initial JSON metadata file, which contains the metadata\
    \ of the JavaScript UDF called **AVERAGE**. We discuss each property and option\
    \ in detail next.\n\n```\nudfs.metadata.json\n{\n    \"functions\": [\n      \
    \  {\n            \"name\": \"AVERAGE\",\n            \"description\": \"Calculates\
    \ the average of given numbers.\",\n            \"helpUrl\": \"https://pub.mrexcel.com/javascript-udfs/help/udfs.help.average.html\"\
    ,\n            \"parameters\": [\n                {\n                    \"name\"\
    : \"first value\",\n                    \"description\": \"The first number\"\
    ,\n                    \"type\": \"number\",\n                    \"dimensionality\"\
    : \"scalar\"\n                },\n                {\n                    \"name\"\
    : \"second value\",\n                    \"description\": \"The second number\"\
    ,\n                    \"type\": \"number\",\n                    \"dimensionality\"\
    : \"scalar\"\n                }\n            ],\n            \"result\": {\n \
    \               \"type\": \"number\",\n                \"dimensionality\": \"\
    scalar\"\n            },\n            \"options\": {\n                \"sync\"\
    : true,\n                \"stream\": false,\n                \"cancelable\": false\n\
    \            }\n        }\n    ]\n}\n```"
  merge: -1
