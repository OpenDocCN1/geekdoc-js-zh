- md: "You can debug the formula to reveal the same matrix by pressing the F9 key\
    \ while the range address is selected in the cell.\n\n![](img/30db92ad2f868a184b03cc16c418535e_26_0.png)\n\
    \nYou can loop through this nested array to calculate the sum of the given numbers.\
    \ Finally, you can divide by the total item number to calculate the average. Here\
    \ you simply multiply the dimensions to get the total number of items:\n\n```javascript\n\
    return total / (rng.length * rng[0].length);\n```\n\nThe same result could also\
    \ be calculated by using loop counters, as follows:\n\n```javascript\nreturn total\
    \ / (i * j);\n```\n\nFinally, you have the average of the numbers in the selected\
    \ range!\n\n## GETTING CONFIDENT\n\n## FETCHING DATA FROM WEB SERVICES\n\nYou\
    \ have created two JavaScript UDFs so far, and both of them make the arithmetic\
    \ calculation inside the function synchronously. In this chapter, you will see\
    \ how to take JavaScript UDFs further—to use online web services to fetch data\
    \ asynchronously and return the data to the caller cell.\n\nIn this chapter you\
    \ are going to build the **STOCKPRICE** JavaScript UDF to fetch a real-time stock\
    \ price from a web service for the requested ticker symbol.\n\n### Using a Web\
    \ Service for Stock Prices\n\n> This chapter uses the free IEX API, but you can\
    \ use any web service and simply adapt the helper function accordingly.\n\nIEX\
    \ ([iextrading.com](http://iextrading.com)) provides a free API for stock prices\
    \ that doesn't require a subscription. Basically, you query the IEX web service\
    \ by providing the ticker symbol as an **HTTP GET** request, and it returns the\
    \ stock price. For example, with the following URL, the API returns the real-time\
    \ stock price for Microsoft Corporation:\n\n[https://api.iextrading.com/1.0/stock/MSFT/price](https://api.iextrading.com/1.0/stock/MSFT/price)\n\
    \n### Adding an Asynchronous Function\n\nTo create a JavaScript UDF called **STOCKPRICE**,\
    \ add the new function's metadata, as shown below, to the JSON metadata file as\
    \ the next array item of the `functions` property. Notice that the parameter's\
    \ `sync` parameter changes to `false`, which indicates that the function is asynchronous.\n\
    \n#### Insert into udfs.metadata.json\n\n```json\n{\n    \"functions\": [\n  \
    \      {\n            // ... AVERAGE metadata ...\n        },\n        {\n   \
    \         // ... RANGEAVERAGE metadata ...\n        },\n        {\n          \
    \  \"name\": \"STOCKPRICE\",\n            \"description\": \"Stock Price for the\
    \ requested Ticker Symbol.\",\n            \"helpUrl\": \"https://pub.mrexcel.com/javascript-udfs/help/help-stockPrice.html\"\
    ,\n            \"parameters\": [\n                {\n                    \"name\"\
    : \"symbol\",\n                    \"description\": \"Ticker Symbol\",\n     \
    \               \"type\": \"string\",\n                    \"dimensionality\"\
    : \"scalar\"\n                }\n            ],\n            \"result\": {\n \
    \               \"type\": \"number\",\n                \"dimensionality\": \"\
    scalar\"\n            },\n            \"options\": {\n                \"sync\"\
    : false,\n                \"stream\": false,\n                \"cancelable\":\
    \ false\n            }\n        }\n    ]\n}\n```\n\nAdd the `STOCKPRICE()` JavaScript\
    \ function and its helper function at the bottom of the JavaScript functions file,\
    \ as shown below.\n\n```javascript\n/**\n * Insert into udfs.functions.js\n */\n\
    \n/**\n * Function to return a Promise fetching the result\n * from the web service\
    \ asynchronously\n */\nfunction STOCKPRICE(symbol) {\n    return new OfficeExtension.Promise(function(setResult,\
    \ setError) {\n        fetchStockPrice(symbol, function(data) {\n            setResult(data);\n\
    \        });\n    });\n}\n\n/**\n * Helper function for STOCKPRICE() function\n\
    \ * This function makes the web service call and returns\n * the fetched data\
    \ to the stockPrice() function\n */\nfunction fetchStockPrice(symbol, callback)\
    \ {\n    var xmlhttp = new XMLHttpRequest();\n\n    xmlhttp.onreadystatechange\
    \ = function() {\n        if (xmlhttp.readyState == XMLHttpRequest.DONE) {\n \
    \           setTimeout(function() {\n                callback(xmlhttp.responseText);\n\
    \            });\n        }\n    };\n\n    xmlhttp.open(\"GET\", 'https://api.iextrading.com/1.0/stock/'\
    \ + symbol + '/price', true);\n    xmlhttp.send();\n}\n```\n\nThis new JavaScript\
    \ UDF retrieves data from a web service by using an asynchronous call, and the\
    \ result will be returned with the web service response. Therefore, you cannot\
    \ have the function directly return a calculated result to Excel as you did in\
    \ the previous chapters. Instead, you need to use an `OfficeExtension.Promise`\
    \ object, as shown below, to return a value as soon as it is fetched from the\
    \ web service:\n\n```javascript\nfunction STOCKPRICE(symbol) {\n    return new\
    \ OfficeExtension.Promise(function(setResult, setError) {\n        fetchStockPrice(symbol,\
    \ function(data) {\n            setResult(data);\n        });\n    });\n}\n```\n\
    \nThe `OfficeExtension.Promise` object takes a function as a parameter, and this\
    \ function makes the call to the helper function that will fetch the result from\
    \ the web service asynchronously:\n\n```javascript\nreturn new OfficeExtension.Promise(function(setResult,\
    \ setError) {\n    fetchStockPrice(symbol, function(data) {\n        setResult(data);\n\
    \    });\n});\n```\n\nFinally, this is the helper function:\n\n```javascript\n\
    function fetchStockPrice(symbol, callback) {\n    var xmlhttp = new XMLHttpRequest();\n\
    \n    xmlhttp.onreadystatechange = function() {\n        if (xmlhttp.readyState\
    \ == XMLHttpRequest.DONE) {\n            setTimeout(function() {\n           \
    \     callback(xmlhttp.responseText);\n            });\n        }\n    };\n\n\
    \    xmlhttp.open(\"GET\", 'https://api.iextrading.com/1.0/stock/' + symbol +\
    \ '/price', true);\n    xmlhttp.send();\n}\n```\n\nThe helper function takes two\
    \ parameters: `symbol` is the ticker symbol that you need to pass to the web service,\
    \ and `callback` is the function initially passed to use the returned data in\
    \ the caller function (see **Line 27**).\n\n## ADDING AN ASYNCHRONOUS FUNCTION\n\
    \nNext, you create a new `XMLHttpRequest` object called `xmlhttp` and set its\
    \ `onreadystatechange` listener function to catch the fetched data from the web\
    \ service. Then you prepare a `GET` call to the web service URL (endpoint) with\
    \ the requested `symbol` value by using the `open()` method. The second parameter\
    \ of the `open()` method defines whether or not to perform the operation asynchronously.\
    \ Finally, you make the call by using the `send()` method of the `xmlhttp` object.\n\
    \nSuppose the `XMLHttpRequest` object is a web browser that is not parsing and\
    \ not showing the requested pages visually; instead, it transfers raw data only.\
    \ You make a call to the URL, and its state changes in the following order:\n\n\
    1.  **UNSENT**: The `xmlhttp` object has been created as a new `XMLHttpRequest`\
    \ client.\n2.  **OPENED**: The `xmlhttp.open()` method has been executed.\n3.\
    \  **HEADERS_RECEIVED**: The `xmlhttp.send()` method has been executed, and the\
    \ web service has returned headers.\n4.  **LOADING**: The web service has started\
    \ transferring data, but the transfer has not completed yet.\n5.  **DONE**: All\
    \ data has been transferred, and `xmlhttp.responseText` is ready.\n\nThe listener\
    \ function is notified of the state change and checks the `readyState` property\
    \ on **Line 42** to make sure all expected data is transferred. As soon as this\
    \ happens, it calls the callback function with the fetched result—`xmlhttp.responseText`:\n\
    \n```javascript\nxmlhttp.onreadystatechange = function() {\n    if (xmlhttp.readyState\
    \ == XMLHttpRequest.DONE) {\n        setTimeout(function() {\n            callback(xmlhttp.responseText);\n\
    \        });\n    }\n};\n```\n\n> Here you use the `setTimeout()` function to\
    \ make the call asynchronously instead of blocking the script with a synchronous\
    \ call when returning the result to the callback function. So how does this actually\
    \ work?\n\nWhen you schedule a function call with the `setTimeout()` function\
    \ in JavaScript, instead of putting it into the execution stack and blocking the\
    \ entire script and the host application until it finishes its job, you put it\
    \ into the queue and have it added to the stack when the stack has nothing to\
    \ execute. This is called an event loop, which you'll be using it a lot in JavaScript\
    \ with web services.\n\nThe `setTimeout()` function takes a second parameter called\
    \ `delay`, which is the number of milliseconds to wait before executing the code.\
    \ If this parameter is omitted, the value 0 is used. It doesn't mean to execute\
    \ the function immediately, but put it into the queue without any delay.\n\nThe\
    \ callback function uses the `setResult()` function to pass the result to its\
    \ parent on **Line 28**. Finally, this is the value of the `Promise` object that\
    \ Excel is looking forward to receiving—as promised!"
  mdcn: "\n你可以通过在单元格中选中范围地址时按 F9 键来调试公式，从而显示相同的矩阵。\n\n![](img/30db92ad2f868a184b03cc16c418535e_26_0.png)\n\
    \n你可以循环遍历这个嵌套数组来计算给定数字的总和。最后，你可以除以总项数来计算平均值。这里你只需将维度相乘即可得到总项数：\n\n```javascript\n\
    return total / (rng.length * rng[0].length);\n```\n\n同样，也可以通过使用循环计数器来计算相同的结果，如下所示：\n\
    \n```javascript\nreturn total / (i * j);\n```\n\n这样，你就得到了选定范围内数字的平均值！\n\n## 获得信心\n\
    \n## 从网络服务获取数据\n\n到目前为止，你已经创建了两个 JavaScript UDF，它们都在函数内部同步执行算术计算。在本章中，你将看到如何进一步利用\
    \ JavaScript UDF——使用在线网络服务异步获取数据，并将数据返回给调用单元格。\n\n在本章中，你将构建 **STOCKPRICE** JavaScript\
    \ UDF，以便从网络服务获取所请求股票代码的实时股票价格。\n\n### 使用网络服务获取股票价格\n\n> 本章使用免费的 IEX API，但你可以使用任何网络服务，并相应调整辅助函数。\n\
    \nIEX ([iextrading.com](http://iextrading.com)) 提供了一个无需订阅即可使用的免费股票价格 API。基本上，你通过提供股票代码作为\
    \ **HTTP GET** 请求来查询 IEX 网络服务，它会返回股票价格。例如，使用以下 URL，该 API 会返回微软公司的实时股票价格：\n\n[https://api.iextrading.com/1.0/stock/MSFT/price](https://api.iextrading.com/1.0/stock/MSFT/price)\n\
    \n### 添加异步函数\n\n要创建名为 **STOCKPRICE** 的 JavaScript UDF，请将新函数的元数据（如下所示）添加到 JSON\
    \ 元数据文件中，作为 `functions` 属性的下一个数组项。注意参数的 `sync` 参数更改为 `false`，这表示该函数是异步的。\n\n####\
    \ 插入到 udfs.metadata.json\n\n```json\n{\n    \"functions\": [\n        {\n    \
    \        // ... AVERAGE 元数据 ...\n        },\n        {\n            // ... RANGEAVERAGE\
    \ 元数据 ...\n        },\n        {\n            \"name\": \"STOCKPRICE\",\n    \
    \        \"description\": \"Stock Price for the requested Ticker Symbol.\",\n\
    \            \"helpUrl\": \"https://pub.mrexcel.com/javascript-udfs/help/help-stockPrice.html\"\
    ,\n            \"parameters\": [\n                {\n                    \"name\"\
    : \"symbol\",\n                    \"description\": \"Ticker Symbol\",\n     \
    \               \"type\": \"string\",\n                    \"dimensionality\"\
    : \"scalar\"\n                }\n            ],\n            \"result\": {\n \
    \               \"type\": \"number\",\n                \"dimensionality\": \"\
    scalar\"\n            },\n            \"options\": {\n                \"sync\"\
    : false,\n                \"stream\": false,\n                \"cancelable\":\
    \ false\n            }\n        }\n    ]\n}\n```\n\n将 `STOCKPRICE()` JavaScript\
    \ 函数及其辅助函数添加到 JavaScript 函数文件的底部，如下所示。\n\n```javascript\n/**\n * 插入到 udfs.functions.js\n\
    \ */\n\n/**\n * 函数，用于返回一个 Promise，该 Promise 从网络服务异步获取结果\n */\nfunction STOCKPRICE(symbol)\
    \ {\n    return new OfficeExtension.Promise(function(setResult, setError) {\n\
    \        fetchStockPrice(symbol, function(data) {\n            setResult(data);\n\
    \        });\n    });\n}\n\n/**\n * STOCKPRICE() 函数的辅助函数\n * 此函数发起网络服务调用，并将获取的数据返回给\
    \ stockPrice() 函数\n */\nfunction fetchStockPrice(symbol, callback) {\n    var\
    \ xmlhttp = new XMLHttpRequest();\n\n    xmlhttp.onreadystatechange = function()\
    \ {\n        if (xmlhttp.readyState == XMLHttpRequest.DONE) {\n            setTimeout(function()\
    \ {\n                callback(xmlhttp.responseText);\n            });\n      \
    \  }\n    };\n\n    xmlhttp.open(\"GET\", 'https://api.iextrading.com/1.0/stock/'\
    \ + symbol + '/price', true);\n    xmlhttp.send();\n}\n```\n\n这个新的 JavaScript\
    \ UDF 通过使用异步调用从网络服务检索数据，结果将随网络服务响应一起返回。因此，你不能像前面章节那样让函数直接将计算结果返回给 Excel。相反，你需要使用\
    \ `OfficeExtension.Promise` 对象（如下所示），以便在数据从网络服务获取后立即返回：\n\n```javascript\nfunction\
    \ STOCKPRICE(symbol) {\n    return new OfficeExtension.Promise(function(setResult,\
    \ setError) {\n        fetchStockPrice(symbol, function(data) {\n            setResult(data);\n\
    \        });\n    });\n}\n```\n\n`OfficeExtension.Promise` 对象接受一个函数作为参数，该函数会调用辅助函数，而辅助函数将从网络服务异步获取结果：\n\
    \n```javascript\nreturn new OfficeExtension.Promise(function(setResult, setError)\
    \ {\n    fetchStockPrice(symbol, function(data) {\n        setResult(data);\n\
    \    });\n});\n```\n\n最后，这是辅助函数：\n\n```javascript\nfunction fetchStockPrice(symbol,\
    \ callback) {\n    var xmlhttp = new XMLHttpRequest();\n\n    xmlhttp.onreadystatechange\
    \ = function() {\n        if (xmlhttp.readyState == XMLHttpRequest.DONE) {\n \
    \           setTimeout(function() {\n                callback(xmlhttp.responseText);\n\
    \            });\n        }\n    };\n\n    xmlhttp.open(\"GET\", 'https://api.iextrading.com/1.0/stock/'\
    \ + symbol + '/price', true);\n    xmlhttp.send();\n}\n```\n\n辅助函数接受两个参数：`symbol`\
    \ 是你需要传递给网络服务的股票代码，`callback` 是最初传递的函数，用于在调用函数中使用返回的数据（参见 **第 27 行**）。\n\n## 添加异步函数\n\
    \n接下来，你创建一个新的 `XMLHttpRequest` 对象，名为 `xmlhttp`，并将其 `onreadystatechange` 监听器函数设置为捕获从网络服务获取的数据。然后，你使用\
    \ `open()` 方法准备一个针对网络服务 URL（端点）的 `GET` 调用，并带上请求的 `symbol` 值。`open()` 方法的第二个参数定义了是否异步执行操作。最后，你使用\
    \ `xmlhttp` 对象的 `send()` 方法发起调用。\n\n假设 `XMLHttpRequest` 对象是一个不解析也不可视化显示请求页面的网络浏览器；相反，它只传输原始数据。你向\
    \ URL 发起调用，其状态按以下顺序变化：\n\n1.  **UNSENT**：`xmlhttp` 对象已被创建为一个新的 `XMLHttpRequest`\
    \ 客户端。\n2.  **OPENED**：`xmlhttp.open()` 方法已被执行。\n3.  **HEADERS_RECEIVED**：`xmlhttp.send()`\
    \ 方法已被执行，网络服务已返回响应头。\n4.  **LOADING**：网络服务已开始传输数据，但传输尚未完成。\n5.  **DONE**：所有数据已传输完毕，`xmlhttp.responseText`\
    \ 就绪。\n\n监听器函数收到状态更改的通知，并在 **第 42 行** 检查 `readyState` 属性，以确保所有预期的数据都已传输完毕。一旦此条件成立，它便调用回调函数并传入获取的结果——`xmlhttp.responseText`：\n\
    \n```javascript\nxmlhttp.onreadystatechange = function() {\n    if (xmlhttp.readyState\
    \ == XMLHttpRequest.DONE) {\n        setTimeout(function() {\n            callback(xmlhttp.responseText);\n\
    \        });\n    }\n};\n```\n\n> 这里你使用 `setTimeout()` 函数来异步调用，而不是在返回结果给回调函数时使用同步调用从而阻塞脚本。那么这究竟是如何工作的呢？\n\
    \n当你在 JavaScript 中使用 `setTimeout()` 函数调度一个函数调用时，你并不是将其放入执行栈并阻塞整个脚本和宿主应用程序直到它完成工作，而是将其放入队列，并在执行栈为空时将其加入执行栈。这被称为事件循环，你在使用网络服务的\
    \ JavaScript 中会经常用到它。\n\n`setTimeout()` 函数接受第二个参数，名为 `delay`，它是执行代码前需要等待的毫秒数。如果省略此参数，则使用值\
    \ 0。这并不意味着立即执行函数，而是将其无延迟地放入队列。\n\n回调函数在 **第 28 行** 使用 `setResult()` 函数将其结果传递给父级。最后，这就是\
    \ `Promise` 对象所期望接收的值——正如所承诺的那样！\n"
