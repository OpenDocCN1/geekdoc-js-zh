  md: '# ADDING AN ASYNCHRONOUS FUNCTION


    Next, you create a new `XMLHttpRequest` object called `xmlhttp` and set its `onreadystatechange`
    listener function to catch the fetched data from the web service. Then you prepare
    a `GET` call to the web service URL (endpoint) with the requested `symbol` value
    by using the `open()` method. The second parameter of the `open()` method defines
    whether or not to perform the operation asynchronously. Finally, you make the
    call by using the `send()` method of the `xmlhttp` object.


    Suppose the `XMLHttpRequest` object is a web browser that is not parsing and not
    showing the requested pages visually; instead, it transfers raw data only. You
    make a call to the URL, and its state changes in the following order:


    +   1. **UNSENT**: The `xmlhttp` object has been created as a new `XMLHttpRequest`
    client.

    2. **OPENED**: The `xmlhttp.open()` method has been executed.

    3. **HEADERS_RECEIVED**: The `xmlhttp.send()` method has been executed, and the
    web service has returned headers.

    4. **LOADING**: The web service has started transferring data, but the transfer
    has not completed yet.

    5. **DONE**: All data has been transferred, and `xmlhttp.responseText` is ready.


    The listener function is notified of the state change and checks the `readyState`
    property on **Line 42** to make sure all expected data is transferred. As soon
    as this happens, it calls the callback function with the fetched result—`xmlhttp.responseText`:


    ```

    41  xmlhttp.onreadystatechange = function() {

    42      if (xmlhttp.readyState == XMLHttpRequest.DONE) {

    43          setTimeout(function(){

    44              callback(xmlhttp.responseText);

    45          });

    46      }

    47  };

    ```


    > Here you use the `setTimeout()` function to make the call asynchronously instead
    of blocking the script with a synchronous call when returning the result to the
    callback function. So how does this actually work?


    When you schedule a function call with the `setTimeout()` function in JavaScript,
    instead of putting it into the execution stack and blocking the entire script
    and the host application until it finishes its job, you put it into the queue
    and have it added to the stack when the stack has nothing to execute. This is
    called an event loop, which you''ll be using it a lot in JavaScript with web services.


    The `setTimeout()` function takes a second parameter called `delay`, which is
    the number of miliseconds to wait before execution the code. If this parameter
    is omitted, the value 0 is used. It doesn''t mean to execute the function immediately,
    but put it into the queue without any delay.


    The callback function uses the `setResult()` function to pass the result to its
    parent on **Line 28**. Finally, this is the value of the `Promise` object that
    Excel is looking forward to receiving—as promised!'
