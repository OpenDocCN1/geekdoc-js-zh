    \           <Namespace resid=\"namespace\" />\n          </ExtensionPoint>\n \
    \       </AllFormFactors>\n      </Host>\n    </Hosts>\n    <Resources>\n    \
    \  <bt:Urls>\n        <bt:Url id=\"resMetadata\" DefaultValue=\"https://pub.mrexcel.com/javascript-udfs/udfs.metadata.json\"\
    \ />\n        <bt:Url id=\"resFunctions\" DefaultValue=\"https://pub.mrexcel.com/javascript-udfs/udfs.functions.js\"\
    \ />\n        <bt:Url id=\"resLoader\" DefaultValue=\"https://pub.mrexcel.com/javascript-udfs/udfs.loader.html\"\
    \ />\n      </bt:Urls>\n      <bt:ShortStrings>\n        <bt:String id=\"namespace\"\
    \ DefaultValue=\"UDFS\" />\n      </bt:ShortStrings>\n    </Resources>\n  </VersionOverrides>\n\
    </OfficeApp>\n```\n\nThis is a minimal Office JavaScript add-in manifest file\
    \ that contains the required elements. The manifest file has nothing to do with\
    \ the function contents that you create in the add-in, so there is no function\
    \ information in this file. Instead, the file contains the add-in properties to\
    \ be displayed during the installation in the Excel application and the references\
    \ to the actual source files hosted on the web server.\n\nThe following are the\
    \ most important elements in the Office add-in manifest file:\n\n- **Id:** Unique\
    \ ID for the Office add-in. We used the [http://guidgenerator.com](http://guidgenerator.com)\
    \ website to generate a GUID for this project.\n- **ProviderName:** Who developed\
    \ this Office add-in. Max 125 characters.\n- **DisplayName:** Name of the Office\
    \ add-in. Max 125 characters.\n- **Description:** Description of the Office add-in.\
    \ Max 250 characters.\n- **Permissions:** API access level of the Office add-in.\
    \ Use the `ReadWriteDocument` permission type for JavaScript UDFs.\n- **VersionOverrides:**\
    \ Information about the commands implemented by the add-in. Note that settings\
    \ in this element also override the `Hosts` element in the root and define the\
    \ `Script`, `Metadata`, `Page`, and `Namespace` elements accessing the `Url` elements\
    \ set in `Resources` with respective `id` strings. The add-in source files are\
    \ loaded by using this configuration, and Excel is enabled to run JavaScript UDFs.\n\
    - **Namespace:** Element accessing the matching `String` element defined with\
    \ the `namespace` ID in `Resources`. This string defines the prefix for all JavaScript\
    \ UDFs in the add-in, which will be used in a worksheet cell during function entry.\n\
    \n# Warming Up\n\n## Setting Up the Environment\n\nYou can install the sample\
    \ Office add-in which contains JavaScript UDFs discussed in this book in Excel\
    \ running on Windows. To do so, you need to publish the manifest file to a network\
    \ shared folder. This chapter shows how to create a shared folder to which you\
    \ can publish the manifest file. It also shows how to register this shared folder\
    \ as a trusted catalog in Excel to make it possible to install and test the add-in\
    \ in Windows.\n\n### Sharing the Catalog Folder on the Network\n\nCreate a folder\
    \ named **office-catalog** in **My Documents**. This is the folder to which you\
    \ are going to publish the manifest file. (You can choose a different path and\
    \ name for the catalog folder.)\n\nSet up sharing by selecting **Share with**\
    \ and then **Specific people...** from the folder's context menu.\n\n![](img/30db92ad2f868a184b03cc16c418535e_15_0.png)\n\
    \nFigure 6 *Share the local catalog folder to publish the manifest file.*\n\n\
    The current user is already added to the shared people list by default. This is\
    \ all you need to do to share the catalog folder on the network to be able to\
    \ test the add-in, so simply click the **Share** button.\n\n![](img/30db92ad2f868a184b03cc16c418535e_15_1.png)\n\
    \nFigure 7 *Click the **Share** button to share the folder on the network.*\n\n\
    ## Adding the Trusted Add-in Catalog in Excel\n\nAs soon as you click the **Share**\
    \ button, Windows confirms that the folder is successfully shared. Simply right-click\
    \ the shared folder and copy the link, which is the network path you are going\
    \ to set as the trusted catalog address in Excel to publish the manifest file.\n\
    \n![](img/30db92ad2f868a184b03cc16c418535e_16_0.png)\n\n**Figure 8** *Windows\
    \ confirms that the catalog folder is shared.*\n\nFinally, copy the **udfs.manifest.xml**\
    \ file into the catalog folder.\n\n![](img/30db92ad2f868a184b03cc16c418535e_16_1.png)\n\
    \n**Figure 9** *Copy and paste the udfs.manifest.xml file.*\n\nThat's it! The\
    \ catalog folder containing the manifest file is ready, and you can continue the\
    \ installation process in Excel.\n\n### Adding the Trusted Add-in Catalog in Excel\n\
    \nAn add-in catalog is used to store manifest files for Office add-ins so the\
    \ add-ins can be installed in the client application as trusted sources. In this\
    \ case, you need to use the **Network Shared Folder** type add-in catalog to install\
    \ the add-in, and you first need to instruct the Office Trust Center about the\
    \ catalog folder.\n\n> The **Trust Center** is where you can find security and\
    \ privacy settings for Microsoft Office programs. You can access it by following\
    \ exactly the same procedure in each Office program.\n\n## Excel JavaScript UDFs:\
    \ Straight to the Point\n\nStart Excel and open a new file by simply pressing\
    \ the **Esc** key. Click **File / Options**, select the **Trust Center** option\
    \ in the left pane, and click the **Trust Center Settings...** button to open\
    \ the **Trust Center** dialog.\n\n![](img/30db92ad2f868a184b03cc16c418535e_17_0.png)\n\
    \n**Figure 10** *Go to Excel Options / Trust Center / Trust Center Settings...*\n\
    \nSelect the **Trusted Add-in Catalogs** option from the left pane of the **Trust\
    \ Center** window. Paste the copied network shared path into the **Catalog Url**\
    \ text box and click the **Add catalog** button.\n\n![](img/30db92ad2f868a184b03cc16c418535e_17_1.png)\n\
    \n**Figure 11** *Paste the network shared path as the Catalog Url and click Add\
    \ catalog.*\n\n## Adding the Trusted Add-in Catalog in Excel\n\n**Trusted Catalog\
    \ Address** is added to the table at the bottom of the dialog box as the catalog\
    \ type **Network share**. Select the **Show in Menu** checkbox to make the catalog\
    \ appear in the **Insert Add-ins** menu and click **OK** to save changes.\n\n\
    ![](img/30db92ad2f868a184b03cc16c418535e_18_0.png)\n\n**Figure 12** *Select Show\
    \ in Menu and click OK to save changes.*\n\nAs soon as you save the changes, Office\
    \ confirms that your changes have been saved; they will be applied the next time\
    \ you start Office. (This restart requirement is to be expected because these\
    \ settings are saved in the Windows registry, and the application needs to be\
    \ restarted for registry changes to take effect.)\n\n![](img/30db92ad2f868a184b03cc16c418535e_18_1.png)\n\
    \n**Figure 13** *Click OK and restart Office to apply the changes.*\n\n> You are\
    \ not likely to need to access or manually change these settings in the Windows\
    \ registry, but in case you are curious, Office saves the **Trusted Catalogs**\
    \ settings in a registry key at the following registry path for Office 2016:\n\
    \n**HKEY_CURRENT_USER\\Software\\Microsoft\\Office\\16.0\\WEF\\TrustedCatalogs\\\
    **\n\n*This setting is shared with all the other Office applications.*"
  mdcn: "\n## 加载项清单文件——udfs.manifest.xml\n\nudfs.manifest.xml 是一个 XML 文件，它是加载项的主要引导文件。它帮助\
