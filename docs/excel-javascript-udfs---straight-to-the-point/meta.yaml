  md: '# CREATING A STREAMED FUNCTION


    You are also not using a `Promise` object to return asynchronous action results
    to Excel for this function. Instead, the `STOCKPRICEMULTISTREAM()` JavaScript
    function sets up a timer that is held by the `timer` variable and triggers a function
    called `update()` on Line 107, and the helper function is called inside this function.
    As soon as the helper function returns the result from the web service, it sets
    the `caller.result` on Line 109 and also resets `timer` on Line 110 to execute
    the `update()` function again at a certain interval passed by the second parameter
    of the JavaScript UDF. This way, the function will be repeatedly queued to be
    called in a certain number of seconds.


    ```

    107   var timer = setTimeout(function update(){

    108       fetchStockPriceMulti(rng, function(data){

    109           caller.setResult(data);

    110           timer = setTimeout(update, interval * 1000);

    111       });

    112   });

    ```


    Finally, you cancel the function by stopping the timer in the event of a user
    interaction such as editing or deleting a cell, changing a parameter value''s
    reference to another cell, or manually recalculating. It is important to avoid
    unnecessary calls to the web service to save system resources. You handle this
    in the `caller.onCanceled` event listener by calling the `clearInterval()` JavaScript
    function with the `timer` reference:


    ```

    114   caller.onCanceled = function(){

    115       clearInterval(timer);

    116   }

    ```


    This doesn''t cancel the function. Rather, it cancels the existing timer while
    there is a user interaction and stops execution during the interaction. As soon
    as the interaction is complete, the function is triggered, and the timer starts
    working again.


    Start Excel and reinstall the add-in, then let''s look at the streamed function
    in action. This is going to be an array formula as well. Select the result range
    and start typing the formula name in the first cell while the other cells are
    still selected.


    ![](img/30db92ad2f868a184b03cc16c418535e_38_0.png)


    Figure 32 Select the result range and type the function name in the first cell.'
