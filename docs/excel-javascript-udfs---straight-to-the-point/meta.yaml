    # FETCHING DATA FROM WEB SERVICES


    You have created two JavaScript UDFs so far, and both of them make the arithmetic
    calculation inside the function synchronously. In this chapter, you will see how
    to take JavaScript UDFs further—to use online web services to fetch data asynchronously
    and return the data to the caller cell.


    In this chapter you are going to build the **STOCKPRICE** JavaScript UDF to fetch
    a real-time stock price from a web service for the requested ticker symbol.


    # Using a Web Service for Stock Prices


    > This chapter uses the free IEX API, but you can use any web service and simply
    adapt the helper function accordingly.


