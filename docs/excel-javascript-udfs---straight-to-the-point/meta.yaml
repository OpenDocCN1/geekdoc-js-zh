- img_proc: true
  md: 'Six properties define the metadata of the function:


    +   1. `name`: The name of the JavaScript UDF, which will be used as the function
    name in a worksheet cell with a namespace prefix that is defined in the manifest
    file. This property also defines the JavaScript function name used in the JavaScript
    functions file.


    +   2. `description`: A short description of the function that will show up in
    the available functions list.


    +   3. `helpUrl`: The URL of the web page that is supposed to display the help
    information in an Excel task pane on a help request. This feature is currently
    not supported in Developer Preview.


    +   4. `parameters`: An array that contains function parameters with the following
    properties:


    +   a) `name`: The parameter''s brief information text, which is displayed right
    after the opening function parenthesis in a cell.


    +   b) `description`: More information to be displayed about the parameter. This
    feature is currently not supported in Developer Preview.


    +   c) `type`: The type of the parameter, and must be set to `boolean`, `number`
    or `string`. The **AVERAGE** function''s parameters are numeric values, so their
    `type` parameters are defined as `number`.


    +   d) `dimensionality`: Whether the parameter is a single cell value passed as
    a `scalar` value or a range passed as a `matrix` value.


    +   5. `result`: The type and dimensionality of the returned result, defined with
    the following properties:


    +   a) `type`: A result type, just like the `parameters` type property explained
    above.


    +   b) `dimensionality`: Whether the returned value will be a `scalar` value or
    a `matrix` defined by an array. If the returned value is `scalar`, Excel fills
    in the returned value in the caller cell. If it is `matrix`, you enter the formula
    as an array formula by pressing **Ctrl+Shift+Enter** to get the returned matrix
    as a result in multiple cells. The **AVERAGE** function returns a scalar, so its
    `dimensionality` property is defined as `scalar`.


    +   6. `options`: The function''s behavior. There are three properties to define
    it:


    +   a) `sync`: This property defines whether the function is synchronous or asynchronous.
    Synchronous functions offer fast performance as they run in the same process as
    Excel. However, if your JavaScript UDF retrieves data from a web service, then
    it must be asynchronous to avoid locking Excel until it returns the expected result.
    By default this property is set to `true`, which designates the function as asynchronous.


    +   b) `stream`: You can create streamed functions by setting this property to
    `true`. Suppose the JavaScript UDF has been set to generate a new value over time
    or fetch the value every second from a web service providing stock prices. You
    can set this option to `true` and write the JavaScript function that will repeat
    itself over a given interval to output the data in the given interval without
    user interaction.


    +   c) `cancelable`: Streamed functions and asynchronous functions can be canceled
    to stop function execution in certain situations, such as with editing and deleting
    a cell referencing the function, a parameter value changing referencing to another
    cell, or a manual recalculation initiated by the user. You can make a function
    cancelable by setting this property to `true` and providing the `caller.onCanceled`
    event listener in the function.'
  merge: -1
