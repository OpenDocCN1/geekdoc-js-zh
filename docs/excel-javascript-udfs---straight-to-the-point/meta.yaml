- img_proc: true
  md: '# WRAPPING UP


    # FINAL WORDS


    # What''s Next?


    You have seen how to create both synchronous and asynchronous sample JavaScript
    UDFs, and you are now ready to create your own JavaScript UDFs, based on what
    you have learned in this book. You might also want to learn to build your own
    web services and fetch data with your JavaScript UDFs instead of depending on
    third-party web services.


    Keep in mind that JavaScript UDFs are still under development, and it is expected
    that the capabilities and methods explained in this book will be improved and
    changed in the stable public release. You can watch for updates at the web page
    for this book: https://www.mrexcel.com/products/excel-javascript-udfs-straight-to-the-point/.


    # The Final Function Code


    You can download the source files written in this book from https://pub.mrexcel.com/javascript-udfs/.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# # APPENDIX


    # ## HOSTING SOURCE FILES LOCALLY


    If you prefer to host the add-in source files in your local machine instead a
    remote web server, then you need to install Internet Information Services (IIS)
    on Windows. Therefore, you can publish the source files to *local server* and
    refer them by altering the corresponding `Url` properties in the manifest file.


    In the following section, you will see how to install IIS on Windows, and setup
    the add-in manifest file to refer to *local server*.


    # ### Installing IIS on Windows 7


    Make sure you have administrative user rights on the computer. Go to **Start**
    / Control Panel / Programs, and then select **Turn Windows features on or off**.


    ![](img/30db92ad2f868a184b03cc16c418535e_41_0.png)


    Figure 35 *Go to* Start / Control Panel / Programs.


    Select **Internet Information Services** to choose the default features for installation,
    and click **OK**.


    ![](img/30db92ad2f868a184b03cc16c418535e_41_1.png)


    Figure 36 *Select* Internet Information Services *in the* Windows Features.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# INSTALLING IIS ON WINDOWS 7


    The progress indicator appears. Wait while Windows makes changes to install the
    selected features.


    ![](img/30db92ad2f868a184b03cc16c418535e_42_0.png)


    When the installation completes, IIS is now installed with a default configuration
    on Windows. To confirm that the installation succeeded, type the following URL
    into your browser, **http://localhost/**. You will see the default website is
    loaded in the browser.


    ![](img/30db92ad2f868a184b03cc16c418535e_42_1.png)


    > **localhost** is a hostname that means *this computer*, and it resolves to the
    IP address **127.0.0.1**, which is a special-purpose IPv4 address called *loopback
    address*. Therefore, you can also use **http://127.0.0.1/** to access the default
    website in the local server.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '**Adding MIME Type for .json Extension**


    IIS 7 serves files with `.html` and `.js` extensions as default. However, `.json`
    file type is not served as default. Therefore, you need to add a MIME type to
    IIS to allow it to serve the add-in''s JSON metadata file.


    To do so, go to **Start** /Control Panel/ Administrative Tools / **Internet Information
    Services (IIS) Manager** to open Internet Information Services (IIS) Manager.


    ![](img/30db92ad2f868a184b03cc16c418535e_43_0.png)


    Figure 39 *Open Internet Information Services (IIS) Manager.*


    Double click on the **MIME Types** icon, and then click the **Add** shortcut in
    the **Actions** list in the right pane. Enter `.json` to the File name extension,
    and `application/json` to the MIME type. Click **OK** to save the new MIME type.


    ![](img/30db92ad2f868a184b03cc16c418535e_43_1.png)


    Figure 40 *Add MIME type for .json file type.*'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Copying Sources Files to the Local Server


    Select main server in the **Connections** list in the left pane, and then click
    **Restart** for the changes to take effect. IIS will start serving json file type
    after restarting the server.


    ![](img/30db92ad2f868a184b03cc16c418535e_44_0.png)


    **Figure 41** *Restart server for the changes to take effect.*


    # Copying Sources Files to the Local Server


    IIS creates the document root in **%SystemDrive%\inetpub\wwwroot\** folder as
    default, which is the root path of your local server which can be accessed by
    the localhost url—**http://localhost/**. Go to document root, create a folder
    called **sample**, and then copy and paste the source files into this new folder.


    ![](img/30db92ad2f868a184b03cc16c418535e_44_1.png)


    **Figure 42** *Copy and paste the source files in to the local server''s root
    folder.*'
  merge: -1
  pgno: 44
- img_proc: true
  md: "# Updating the Manifest File\n\nSince you prefer to host the source files in\
    \ your local machine, you need to change the source file locations in the manifest\
    \ file. Update **udfs.manifest.xml** file to apply the following changes, as shown\
    \ below.\n\n```\nUpdate udfs.manifest.xml\n\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<OfficeApp xmlns=\"http://schemas.microsoft.com/office/appforoffice/1.1\"\
    \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xmlns:bt=\"\
    http://schemas.microsoft.com/office/officeappbasictypes/1.0\"\n    xmlns:ov=\"\
    http://schemas.microsoft.com/office/taskpaneappversionoverrides\"\n    xsi:type=\"\
    TaskPaneApp\">\n    <Id>0428f87b-8b69-467b-9fd6-1335a724fe46</Id>\n    <Version>1.0.0.0</Version>\n\
    \    <ProviderName>MrExcel Publishing</ProviderName>\n    <DefaultLocale>en-US</DefaultLocale>\n\
    \    <DisplayName DefaultValue=\"Excel JavaScript UDFs\" />\n    <Description\
    \ DefaultValue=\"JavaScript User Defined Functions for Excel\" />\n    <Hosts>\n\
    \        <Host Name=\"Workbook\" />\n    </Hosts>\n    <DefaultSettings>\n   \
    \     <SourceLocation DefaultValue=\"http://localhost/sample/udfs.loader.html\"\
    \ />\n    </DefaultSettings>\n    <Permissions>ReadWriteDocument</Permissions>\n\
    \    <VersionOverrides xmlns=\"http://schemas.microsoft.com/office/taskpaneappversionoverrides\"\
    \ xsi:type=\"VersionOverridesV1_0\">\n        <Hosts>\n            <Host xsi:type=\"\
    Workbook\">\n                <AllFormFactors>\n                    <ExtensionPoint\
    \ xsi:type=\"CustomFunctions\">\n                        <Script>\n          \
    \                  <SourceLocation resid=\"resFunctions\" />\n               \
    \         </Script>\n                        <Page>\n                        \
    \    <SourceLocation resid=\"resLoader\" />\n                        </Page>\n\
    \                        <Metadata>\n                            <SourceLocation\
    \ resid=\"resMetadata\" />\n                        </Metadata>\n            \
    \            <Namespace resid=\"namespace\" />\n                    </ExtensionPoint>\n\
    \                </AllFormFactors>\n            </Host>\n        </Hosts>\n  \
    \      <Resources>\n            <bt:Urls>\n                <bt:Url id=\"resMetadata\"\
    \ DefaultValue=\"http://localhost/sample/udfs.metadata.json\" />\n```"
  merge: -1
  pgno: 45
- img_proc: true
  md: "```\n                <bt:Url id=\"resFunctions\" DefaultValue=\"http://localhost/sample/udfs.functions.js\"\
    \ />\n                <bt:Url id=\"resLoader\" DefaultValue=\"http://localhost/sample/udfs.loader.html\"\
    \ />\n            </bt:Urls>\n            <bt:ShortStrings>\n                <bt:String\
    \ id=\"namespace\" DefaultValue=\"UDFS\" />\n            </bt:ShortStrings>\n\
    \        </Resources>\n    </VersionOverrides>\n</OfficeApp>\n```\n\nFinally quit\
    \ and restart Excel, and reinstall the add-in by using the new manifest file.\
    \ Now you can create and test your own JavaScript UDFs locally!"
  merge: -1
