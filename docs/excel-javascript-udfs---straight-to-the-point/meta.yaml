    type\": \"number\",\n117        \"dimensionality\": \"matrix\"\n118      },\n\
    119      \"options\": {\n120        \"sync\": false,\n121        \"stream\": true,\n\
    122        \"cancelable\": true\n123      }\n124    }\n125  ]\n126}\n```\n\nYou\
    \ should be familiar with the function metadata at this point, but in this case,\
    \ note that the options property now has stream and cancelable properties set\
    \ to true to define the new function as a streamed and cancelable function.\n\n\
    Add the STOCKPRICEMULTISTREAM() JavaScript function at the bottom of the JavaScript\
    \ functions file:\n\n```javascript\n/*\n  * Function to return the streaming result\n\
    \  * from the web service asynchronously\n  */\nfunction STOCKPRICEMULTISTREAM(rng,\
    \ interval, caller) {\n    var timer = setTimeout(function update(){\n       \
    \ fetchStockPriceMulti(rng, function(data){\n            caller.setResult(data);\n\
    \            timer = setTimeout(update, interval * 1000);\n        });\n    });\n\
    \n    caller.onCanceled = function(){\n        clearInterval(timer);\n    }\n\
    }\n```\n\nNotice that here you use the same helper function—fetchStockPriceMulti()—in\
    \ this new JavaScript UDF since nothing is different about how you are fetching\
    \ data from the web service.\n\nA noticeable difference is that while the new\
    \ function's metadata has two parameters, the JavaScript function—STOCKPRICEMULTISTREAM()—takes\
    \ three parameters. The first two parameters match the metadata parameters, but\
    \ the last parameter, caller, is not defined in the metadata and is also not displayed\
    \ or passed during the actual function entry in Excel. The reason is that Excel\
    \ passes this parameter automatically when you set up the function as a streamed\
    \ function by setting the stream property to true in the metadata. caller is an\
    \ object that contains the setResult() callback function, which updates the Excel\
    \ cell.\n\n# CREATING A STREAMED FUNCTION\n\nYou are also not using a `Promise`\
    \ object to return asynchronous action results to Excel for this function. Instead,\
    \ the `STOCKPRICEMULTISTREAM()` JavaScript function sets up a timer that is held\
    \ by the `timer` variable and triggers a function called `update()` on Line 107,\
    \ and the helper function is called inside this function. As soon as the helper\
    \ function returns the result from the web service, it sets the `caller.result`\
    \ on Line 109 and also resets `timer` on Line 110 to execute the `update()` function\
    \ again at a certain interval passed by the second parameter of the JavaScript\
    \ UDF. This way, the function will be repeatedly queued to be called in a certain\
    \ number of seconds.\n\n```javascript\nvar timer = setTimeout(function update(){\n\
    \    fetchStockPriceMulti(rng, function(data){\n        caller.setResult(data);\n\
    \        timer = setTimeout(update, interval * 1000);\n    });\n});\n```\n\nFinally,\
    \ you cancel the function by stopping the timer in the event of a user interaction\
    \ such as editing or deleting a cell, changing a parameter value's reference to\
    \ another cell, or manually recalculating. It is important to avoid unnecessary\
    \ calls to the web service to save system resources. You handle this in the `caller.onCanceled`\
