    # Copying Sources Files to the Local Server


    Select main server in the **Connections** list in the left pane, and then click
    **Restart** for the changes to take effect. IIS will start serving json file type
    after restarting the server.


    ![](img/30db92ad2f868a184b03cc16c418535e_44_0.png)


    **Figure 41** *Restart server for the changes to take effect.*


    # Copying Sources Files to the Local Server


    IIS creates the document root in **%SystemDrive%\inetpub\wwwroot\** folder as
    default, which is the root path of your local server which can be accessed by
    the localhost url—**http://localhost/**. Go to document root, create a folder
    called **sample**, and then copy and paste the source files into this new folder.


    ![](img/30db92ad2f868a184b03cc16c418535e_44_1.png)


    **Figure 42** *Copy and paste the source files in to the local server''s root
    folder.*'
