  md: "# THE ADD-IN MANIFEST FILE—UDFS.MANIFEST.XML\n\n```\n39            <bt:Url\
    \ id=\"resLoader\" DefaultValue=\"https://pub.mrexcel.com/\n           javascript-udfs/udfs.loader.html\"\
    \ />\n40          </bt:Urls>\n41          <bt:ShortStrings>\n42            <bt:String\
    \ id=\"namespace\" DefaultValue=\"UDFS\" />\n43          </bt:ShortStrings>\n\
    44        </Resources>\n45      </VersionOverrides>\n46    </OfficeApp>\n```\n\
    \nThis is a minimal Office JavaScript add-in manifest file that contains the required\
    \ elements. The manifest file has nothing to do with the function contents that\
    \ you create in the add-in, so there is no function information in this file.\
    \ Instead, the file contains the add-in properties to be displayed during the\
    \ installation in the Excel application and the references to the actual source\
    \ files hosted on the web server.\n\nThe following are the most important elements\
    \ in the Office add-in manifest file:\n\n+   - **Id:** Unique ID for the Office\
    \ add-in. We used the [http://guidgenerator.com](http://guidgenerator.com) website\
    \ to generate a GUID for this project.\n- **ProviderName:** Who developed this\
    \ Office add-in. Max 125 characters.\n- **DisplayName:** Name of the Office add-in.\
    \ Max 125 characters.\n- **Description:** Description of the Office add-in. Max\
    \ 250 characters.\n- **Permissions:** API access level of the Office add-in. Use\
    \ the `ReadWriteDocument` permission type for JavaScript UDFs.\n- **VersionOverrides:**\
    \ Information about the commands implemented by the add-in. Note that settings\
    \ in this element also override the `Hosts` element in the root and define the\
    \ `Script`, `Metadata`, `Page`, and `Namespace` elements accessing the `Url` elements\
    \ set in `Resources` with respective `id` strings. The add-in source files are\
    \ loaded by using this configuration, and Excel is enabled to run JavaScript UDFs.\n\
    - **Namespace:** Element accessing the matching `String` element defined with\
    \ the `namespace` ID in `Resources`. This string defines the prefix for all JavaScript\
    \ UDFs in the add-in, which will be used in a worksheet cell during function entry."
