    \ Windows 中安装和测试加载项。\n\n### 在网络上共享目录文件夹\n\n在**我的文档**中创建一个名为 **office-catalog**\
    \ 的文件夹。这是你要将清单文件发布到的文件夹。（你可以为目录文件夹选择不同的路径和名称。）\n\n通过从文件夹的上下文菜单中选择**共享**，然后选择**特定人员...**来设置共享。\n\
    \n![](img/30db92ad2f868a184b03cc16c418535e_15_0.png)\n\n图 6 *共享本地目录文件夹以发布清单文件。*\n\
