- md: "# Excel JavaScript UDFs Straight to the Point\n\n# Introduction\n\n## About\
    \ the Author\n\nSuat M. Ozgur has worked behind the scenes with MrExcel.com since\
    \ 2002. He has been using JavaScript since 2005. When Microsoft introduced the\
    \ new JavaScript custom functions for Excel, he was uniquely qualified to work\
    \ with them, thanks to his experience in both JavaScript and Excel.\n\nSuat is\
    \ a co-author of *Office VBA Macros You Can Use Today*.\n\nHe currently lives\
    \ in Sakarya, Turkey with his wife, Muge, and their cat, Cuma.\n\n## About This\
    \ Book\n\nExcel users are used to build custom functions—called user-defined functions\
    \ (UDFs)—in Windows and Mac versions of the application. UDFs can be simply written\
    \ in Visual Basic Editor (VBE) using the Visual Basic for Applications (VBA) language.\n\
    \nUDFs are not portable to Excel Online and Excel for iOS due to the missing VBA\
    \ capability on these platforms. Therefore, Microsoft has improved the JavaScript\
    \ API that was already being used for Office add-in development to allow developers\
    \ to create custom functions attached to the add-ins. These custom functions can\
    \ be used like any other native functions or UDFs in Excel. While Microsoft calls\
    \ these functions *JavaScript custom functions*, they can also be called *JavaScript\
    \ UDFs*, which is the name used in this book.\n\nThe most beautiful aspect of\
    \ this new functionality is that developers can take advantage of the power of\
    \ widely used web services in JavaScript UDFs, and the end user doesn't even have\
    \ to know about web application development.\n\nThis book shows the process of\
    \ creating JavaScript UDFs in Excel in Developer Preview for Office Insider program\
    \ subscribers. All JavaScript UDF samples created in this book have been installed\
    \ and tested in Excel Version 1806 (Build 10211.20004) in Windows 7. Since JavaScript\
    \ UDFs are only available in preview at this time, it is possible that the capabilities\
    \ and methods explained in this book might be improved and changed in the stable\
    \ public release.\n\n# The Office Insider Program\n\n## Joining the Office Insider\
    \ Program\n\nJavaScript UDFs are currently available for testing in Excel in Developer\
    \ Preview for Microsoft Office Insider subscribers only. Therefore, you need to\
    \ have the Office Insider version of the application and must be signed up for\
    \ the Office Insider program.\n\n> Visit [https://products.office.com/office-insider](https://products.office.com/office-insider)\
    \ for more information about the Microsoft Office Insider program. You can also\
    \ find information for the Targeted release for commercial Office 365 subscribers\
    \ in the same page.\n\n## Downloading and Installing Office Insider\n\nGo to the\
    \ **My Office Account / Install Office** page online—[https://stores.office.com/myaccount/home.aspx](https://stores.office.com/myaccount/home.aspx)—and\
    \ select the appropriate **Office Insider** option under **Version**, click **Install**,\
    \ and simply follow the installation steps.\n\n**Figure 1** *Select the Office\
    \ Insider version to install.*\n\nYou will be ready to join the Office Insider\
    \ program as soon as the Office 2016 installation is complete.\n\n**Figure 2**\
    \ *You're all set and ready to join the Office Insider program.*\n\n# Table of\
    \ Contents\n\n**Introduction**\n- About the Author\n- About This Book\n\n**The\
    \ Office Insider Program**\n- Joining the Office Insider Program\n  - Downloading\
    \ and Installing Office Insider\n  - Signing Up for the Office Insider Program\n\
    \n**Getting Familiar**\n- Add-in Source Files and File Structures\n  - The JavaScript\
    \ Functions File—udfs.functions.js\n  - The JSON Metadata File—udfs.metadata.json\n\
    \  - The Loader HTML File—udfs.loader.html\n  - The Add-in Manifest File—udfs.manifest.xml\n\
    \n**Warming Up**\n- Setting Up the Environment\n  - Sharing the Catalog Folder\
    \ on the Network\n  - Adding the Trusted Add-in Catalog in Excel\n- Installing\
    \ and Testing the JavaScript Add-in\n  - Inserting the Excel JavaScript UDFs Add-in\
    \ in Excel\n  - Testing the Add-in\n  - About Caching the Source Files\n- Extending\
    \ the Add-in\n  - Creating a New Function to Accept a Range as a Parameter\n\n\
    **Getting Confident**\n- Fetching Data from Web Services\n  - Using a Web Service\
    \ for Stock Prices\n  - Adding an Asynchronous Function\n  - Fetching Multiple\
    \ Symbol Prices with a Single Web Service Call\n- Adding a Final Touch\n  - Creating\
    \ a Streamed Function\n\n**Wrapping Up**\n- Final Words\n  - What's Next?\n  -\
    \ The Final Function Code\n\n**Appendix**\n- Hosting Source Files Locally\n  -\
    \ Installing IIS on Windows 7\n  - Adding MIME Type for .json Extension\n  - Copying\
    \ Sources Files to the Local Server\n  - Updating the Manifest File"
  mdcn: "\n# Excel JavaScript UDF 直奔主题\n\n# 简介\n\n## 关于作者\n\nSuat M. Ozgur 自2002年起就在幕后为\
    \ MrExcel.com 工作。他从2005年开始使用 JavaScript。当微软推出 Excel 全新的 JavaScript 自定义函数时，凭借其在\
    \ JavaScript 和 Excel 两方面的经验，他成为当之无愧的人选。\n\nSuat 是*《Office VBA 宏即学即用》*（*Office\
    \ VBA Macros You Can Use Today*）的合著者。\n\n他目前与妻子 Muge 以及他们的猫咪 Cuma 居住在土耳其萨卡里亚。\n\
    \n## 关于本书\n\nExcel 用户已经习惯了在 Windows 和 Mac 版本的 Excel 中构建自定义函数——称为用户定义函数（UDF）。UDF\
    \ 可以在 Visual Basic 编辑器（VBE）中使用 Visual Basic for Applications（VBA）语言轻松编写。\n\n由于\
    \ Excel Online 和 Excel for iOS 缺少 VBA 功能，UDF 无法移植到这些平台上。因此，微软改进了原本就用于 Office 加载项开发的\
    \ JavaScript API，让开发者能够创建与加载项关联的自定义函数。这些自定义函数可以像 Excel 中的任何其他原生函数或 UDF 一样使用。虽然微软将这些函数称为*JavaScript\
    \ 自定义函数*（*JavaScript custom functions*），但它们也可以称为 *JavaScript UDF*，这也是本书采用的名称。\n\
    \n这项新功能最妙之处在于，开发者可以在 JavaScript UDF 中利用广泛使用的 Web 服务的强大功能，而最终用户甚至无需了解 Web 应用程序开发。\n\
    \n本书面向 Office 预览体验计划（Office Insider program）订阅者，展示如何在 Excel 开发者预览版中创建 JavaScript\
    \ UDF。本书中创建的所有 JavaScript UDF 示例都已在 Windows 7 的 Excel 版本 1806（内部版本 10211.20004）中安装并测试。由于\
    \ JavaScript UDF 目前仅在预览版中可用，本书中介绍的功能和方法在稳定的公开发布版本中可能会得到改进和更改。\n\n# Office 预览体验计划\n\
    \n## 加入 Office 预览体验计划\n\nJavaScript UDF 目前仅在面向 Microsoft Office 预览体验计划订阅者的 Excel\
    \ 开发者预览版中提供测试。因此，你需要拥有 Office 预览体验计划版本的应用程序，并且必须注册加入 Office 预览体验计划。\n\n> 访问 [https://products.office.com/office-insider](https://products.office.com/office-insider)\
    \ 了解有关 Microsoft Office 预览体验计划的更多信息。你也可以在同一页面找到面向商业 Office 365 订阅者的定向发布信息。\n\n\
    ## 下载和安装 Office 预览体验计划\n\n在线前往**我的 Office 账户 / 安装 Office**页面——[https://stores.office.com/myaccount/home.aspx](https://stores.office.com/myaccount/home.aspx)——在**版本**下选择合适的\
    \ **Office 预览体验计划**选项，点击**安装**，然后按照安装步骤操作即可。\n\n**图 1** *选择要安装的 Office 预览体验计划版本。*\n\
    \nOffice 2016 安装完成后，你就准备好加入 Office 预览体验计划了。\n\n**图 2** *一切就绪，准备好加入 Office 预览体验计划。*\n\
    \n# 目录\n\n**简介**\n- 关于作者\n- 关于本书\n\n**Office 预览体验计划**\n- 加入 Office 预览体验计划\n  -\
    \ 下载和安装 Office 预览体验计划\n  - 注册 Office 预览体验计划\n\n**熟悉上手**\n- 加载项源文件和文件结构\n  - JavaScript\
    \ 函数文件——udfs.functions.js\n  - JSON 元数据文件——udfs.metadata.json\n  - 加载器 HTML 文件——udfs.loader.html\n\
    \  - 加载项清单文件——udfs.manifest.xml\n\n**热身练习**\n- 环境设置\n  - 在网络上共享目录文件夹\n  - 在 Excel\
    \ 中添加受信任的加载项目录\n- 安装和测试 JavaScript 加载项\n  - 在 Excel 中插入 Excel JavaScript UDF 加载项\n\
    \  - 测试加载项\n  - 关于缓存源文件\n- 扩展加载项\n  - 创建接受区域作为参数的新函数\n\n**得心应手**\n- 从 Web 服务获取数据\n\
    \  - 使用 Web 服务获取股票价格\n  - 添加异步函数\n  - 通过单次 Web 服务调用获取多个股票代码价格\n- 锦上添花\n  - 创建流式函数\n\
    \n**收尾总结**\n- 结语\n  - 下一步？\n  - 最终函数代码\n\n**附录**\n- 本地托管源文件\n  - 在 Windows 7 上安装\
    \ IIS\n  - 为 .json 扩展名添加 MIME 类型\n  - 将源文件复制到本地服务器\n  - 更新清单文件\n"
