- img_proc: true
  md: '# Introduction


    # ABOUT THE AUTHOR


    Suat M. Ozgur has worked behind the scenes with MrExcel.com since 2002. He has
    been using JavaScript since 2005. When Microsoft introduced the new JavaScript
    custom functions for Excel, he was uniquely qualified to work with them, thanks
    to his experience in both JavaScript and Excel.


    Suat is a co-author of *Office VBA Macros You Can Use Today*.


    He currently lives in Sakarya, Turkey with his wife, Muge, and their cat, Cuma.


    # ABOUT THIS BOOK


    Excel users are used to build custom functions—called user-defined functions (UDFs)—in
    Windows and Mac versions of the application. UDFs can be simply written in Visual
    Basic Editor (VBE) using the Visual Basic for Applications (VBA) language.


    UDFs are not portable to Excel Online and Excel for iOS due to the missing VBA
    capability on these platforms. Therefore, Microsoft has improved the JavaScript
    API that was already being used for Office add-in development to allow developers
    to create custom functions attached to the add-ins. These custom functions can
    be used like any other native functions or UDFs in Excel. While Microsoft calls
    these functions *JavaScript custom functions*, they can also be called *JavaScript
    UDFs*, which is the name used in this book.


    The most beautiful aspect of this new functionality is that developers can take
    advantage of the power of widely used web services in JavaScript UDFs, and the
    end user doesn''t even have to know about web application development.


    This book shows the process of creating JavaScript UDFs in Excel in Developer
    Preview for Office Insider program subscribers. All JavaScript UDF samples created
    in this book have been installed and tested in Excel Version 1806 (Build 10211.20004)
    in Windows 7. Since JavaScript UDFs are only available in preview at this time,
    it is possible that the capabilities and methods explained in this book might
    be improved and changed in the stable public release.'
  merge: -1
  pgno: 6
