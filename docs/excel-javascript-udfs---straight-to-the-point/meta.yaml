    \n## Fetching Multiple Symbol Prices with a Single Web Service Call\n\nYou could\
    \ fill the other symbols into column A and copy the formula for each row in the\
    \ data set to get more stock prices in a table. However, if you did that, every\
    \ cell that contains the function in the range would make a separate call to the\
    \ JavaScript UDF, which would also mean multiple calls to the web service. This\
    \ is not the best approach, considering the resources involved and the loading\
    \ times. Instead, you can use an array formula and create a new JavaScript UDF\
    \ called **STOCKPRICEMULTI** that accepts a single-column range with ticker symbols\
    \ as the parameter and that returns an array result for the corresponding symbols\
    \ fetched.\n\nAdd the new function's metadata, as shown below, to the JSON metadata\
    \ file as the next array item of the `functions` property. Notice that the `dimensionality`\
