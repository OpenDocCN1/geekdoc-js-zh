    \n### Installing IIS on Windows 7\n\nMake sure you have administrative user rights\
    \ on the computer. Go to **Start** / Control Panel / Programs, and then select\
    \ **Turn Windows features on or off**.\n\n![](img/30db92ad2f868a184b03cc16c418535e_41_0.png)\n\
    \nFigure 35 *Go to* Start / Control Panel / Programs.\n\nSelect **Internet Information\
