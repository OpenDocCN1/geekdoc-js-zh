    # EXCEL JAVASCRIPT UDFS: STRAIGHT TO THE POINT


    Start Excel and open a new file by simply pressing the **Esc** key. Click **File
    / Options**, select the **Trust Center** option in the left pane, and click the
    **Trust Center Settings...** button to open the **Trust Center** dialog.


    ![](img/30db92ad2f868a184b03cc16c418535e_17_0.png)


    **Figure 10** *Go to Excel Options / Trust Center / Trust Center Settings...*


    Select the **Trusted Add-in Catalogs** option from the left pane of the **Trust
    Center** window. Paste the copied network shared path into the **Catalog Url**
    text box and click the **Add catalog** button.


    ![](img/30db92ad2f868a184b03cc16c418535e_17_1.png)


    **Figure 11** *Paste the network shared path as the Catalog Url and click Add
    catalog.*'
  - '[PAGE 18]


    # ADDING THE TRUSTED ADD-IN CATALOG IN EXCEL


    **Trusted Catalog Address** is added to the table at the bottom of the dialog
    box as the catalog type **Network share**. Select the **Show in Menu** checkbox
    to make the catalog appear in the **Insert Add-ins** menu and click **OK** to
    save changes.


    ![](img/30db92ad2f868a184b03cc16c418535e_18_0.png)


    **Figure 12** *Select Show in Menu and click OK to save changes.*


    As soon as you save the changes, Office confirms that your changes have been saved;
    they will be applied the next time you start Office. (This restart requirement
    is to be expected because these settings are saved in the Windows registry, and
    the application needs to be restarted for registry changes to take effect.)


    ![](img/30db92ad2f868a184b03cc16c418535e_18_1.png)


    **Figure 13** *Click OK and restart Office to apply the changes.*


    > You are not likely to need to access or manually change these settings in the
    Windows registry, but in case you are curious, Office saves the **Trusted Catalogs**
    settings in a registry key at the following registry path for Office 2016:


    **HKEY_CURRENT_USER\Software\Microsoft\Office\16.0\WEF\TrustedCatalogs\**


    *This setting is shared with all the other Office applications.*'
- md: " # INSTALLING AND TESTING THE JAVASCRIPT ADD-IN\n\n## Inserting the Excel JavaScript\
    \ UDFs Add-in in Excel\n\nYou are finally ready to install and test your add-in!\
    \ Excel doesn't know about your add-in yet, so you can't simply type the functions\
    \ in the cells. You need to install the add-in first.\n\nStart Excel and create\
    \ a new workbook. Select the **Insert** tab on the ribbon and click the **My Add-ins**\
    \ button.\n\n![](img/30db92ad2f868a184b03cc16c418535e_19_0.png)\n\n**Figure 14**\
    \ *Insert the add-in by using the* **My Add-ins** *command on the ribbon.*\n\n\
    In the **Office Add-ins** window that appears, select the **SHARED FOLDER** option.\
    \ All existing manifest files will be processed in the catalogs you added to the\
    \ **Trusted Catalogs Table**, and available add-ins will be listed on this page.\n\
    \nAs you can see below, you currently have only one add-in available, defined\
    \ with the **udfs.manifest.xml** manifest file saved in the catalog folder.\n\n\
    ![](img/30db92ad2f868a184b03cc16c418535e_19_1.png)\n\n**Figure 15** *Select* **SHARED\
    \ FOLDER** *in the* **Office Add-ins** *window.*\n\nIn the **Office Add-ins**\
    \ window, move your mouse pointer over the add-in that is presented and notice\
    \ the following add-in properties:\n\n- Display name: **Excel JavaScript UDFs**\n\
    - Provider name: **MrExcel Publishing**\n- Description: **JavaScript User Defined\
    \ Functions for Excel**\n\nRecall the manifest file content and how corresponding\
    \ source fields are presented in the Office Add-ins dialog:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n        ...\n    <ProviderName>MrExcel Publishing</ProviderName>\n\
    \    <DefaultLocale>en-US</DefaultLocale>\n    <DisplayName DefaultValue=\"Excel\
    \ JavaScript UDFs\" />\n    <Description DefaultValue=\"JavaScript User Defined\
    \ Functions for Excel\" />\n    ...\n```\n\nWith the add-in still selected, click\
    \ the **Add** button to insert the add-in into Excel.\n\n![](img/30db92ad2f868a184b03cc16c418535e_20_0.png)\n\
    \nAs Excel installs and starts the add-in, it tells you it is doing so with a\
    \ toolbar message. As soon as this message disappears, you can use the add-in's\
    \ JavaScript UDFs in the workbook.\n\n![](img/30db92ad2f868a184b03cc16c418535e_20_1.png)\n\
    \n## Testing the Add-in\n\nThe **AVERAGE** JavaScript UDF calculates the average\
    \ of two numbers. To test it, enter in cells **A1** and **A2** two numbers for\
    \ which you'd like to calculate the average. Then go to cell **B1** and start\
    \ typing the function prefix **UDFS**. As soon as you type the first letter, an\
    \ available functions list appears, showing your function as well as the matching\
    \ internal functions.\n\n![](img/30db92ad2f868a184b03cc16c418535e_21_0.png)\n\n\
    *Figure 18* **Start entering a formula by typing the first letter of the function\
    \ prefix.**\n\n> Notice that the function description shown in the tooltip is\
    \ what you entered in the UDF metadata on **Line 5** in the **udfs.metadata.json**\
    \ file.\n\nFinish typing the function name or simply press the **Tab** key while\
    \ the desired function is the active item in the list. The parameter tooltip is\
    \ displayed the same way as the tooltips for the internal Excel functions.\n\n\
    ![](img/30db92ad2f868a184b03cc16c418535e_21_1.png)\n\n*Figure 19* **A parameter\
    \ tooltip is displayed.**\n\n> Parameter tooltips are not available in VBA UDFs\
    \ in Excel. It is a great feature to be able to configure them in JavaScript UDFs\
    \ easily.\n\nThe following snippet shows the `name` property of the `parameters`\
    \ item in action:\n\n```\nSnippet from udfs.metadata.json\n:                 \
    \  ...\n7               \"parameters\": [\n8               {\n9              \
    \     \"name\": \"first value\",\n10                  \"description\": \"The first\
    \ number\",\n11                  \"type\": \"number\",\n12                  \"\
    dimensionality\": \"scalar\"\n13              },\n14              {\n15      \
    \            \"name\": \"second value\",\n16                  \"description\"\
    : \"The second number\",\n17                  \"type\": \"number\",\n18      \
    \            \"dimensionality\": \"scalar\"\n19              }\n20           \
    \   ],\n:                   ...\n```\n\nSelect the **A1** and **A2** cells as\
    \ the function parameters and press the `Enter` key. As soon as you enter the\
    \ formula, the content of cell **B1** changes to show `#GETTING_DATA`, indicating\
    \ that the JavaScript function is executing.\n\n![](img/30db92ad2f868a184b03cc16c418535e_22_0.png)\n\
    \nFinally, the cell **B1** content is updated with the value returned from the\
    \ JavaScript function.\n\n![](img/30db92ad2f868a184b03cc16c418535e_22_1.png)\n\
    \n# About Caching the Source Files\n\nWhen the add-in is installed, the add-in\
    \ source files are automatically cached in the Windows file system. The next time\
    \ you start Excel, the add-in will be recognized quickly, functions will be listed\
    \ in the available functions list, and synchronous functions will be executed\
    \ even if you are not connected to the Internet.\n\nIn the case of an asynchronous\
    \ function, you need to be connected to the Internet to load the add-in and execute\
    \ the function; if you do not have an Internet connection, Excel will return a\
    \ message indicating an error in the event that you try to use the function or\
    \ recalculate a cell containing the function.\n\n![](img/30db92ad2f868a184b03cc16c418535e_23_0.png)\n\
    \n**Figure 22** *An Internet connection is required to reload the add-in.*\n\n\
    If you make any changes in the source files, then you can simply reinstall the\
    \ add-in. However, if you make any changes in the manifest file, then you first\
    \ need to quit and restart Excel.\n\n# EXTENDING THE ADD-IN\n\n## Creating a New\
    \ Function to Accept a Range as a Parameter\n\nIn this section, you are going\
    \ to add a new function to your add-in that improves the previously created `AVERAGE`\
    \ function by accepting a range parameter that is defined with `matrix` dimensionality\
    \ instead of `scalar`.\n\nTo create a JavaScript UDF called `RANGEAVERAGE`, add\
    \ the new function's metadata, shown below, to the JSON metadata file as the next\
    \ array item of the `functions` property. Notice that the `dimensionality` parameter\
    \ is defined as `matrix` to tell the function to accept the range as a parameter.\n\
    \n```\nInsert into udfs.metadata.json\n\n1 {\n2     \"functions\": [\n3      \
    \   {\n:           ... AVERAGE metadata ...\n30        },\n31        {\n32   \
    \         \"name\": \"RANGEAVERAGE\",\n33            \"description\": \"Calculate\
    \ the average of the values in the range.\",\n34            \"helpUrl\": \"https://pub.mrexcel.com/javascript-udfs/help/help-rangeAverage.html\"\
    ,\n35            \"parameters\": [\n36                {\n37                  \
    \  \"name\": \"range of numbers\",\n38                    \"description\": \"\
    The range of numbers to calculate the average.\",\n39                    \"type\"\
    : \"number\",\n40                    \"dimensionality\": \"matrix\"\n41      \
    \          }\n42            ],\n43            \"result\": {\n44              \
    \  \"type\": \"number\",\n45                \"dimensionality\": \"scalar\"\n46\
    \            },\n47            \"options\": {\n48                \"sync\": true,\n\
    49                \"stream\": false,\n50                \"cancelable\": false\n\
    51            }\n52        }\n53    ]\n54 }\n```\n\nAdd the RANGEAVERAGE() JavaScript\
    \ function at the bottom of the JavaScript functions file, as shown below.\n\n\
    ```\nInsert into udfs.functions.js\n\n8   /*\n9   * Function to calculate the\
    \ average of the values in the given range.\n10  */\n11  function RANGEAVERAGE\
    \ (rng) {\n12    var total = 0;\n13    for (i = 0; i < rng.length; i++) {\n14\
    \      for (j = 0; j < rng[i].length; j++) {\n15        total += rng[i][j];\n\
    16      }\n17    }\n18    return total / (rng.length * rng[0].length);\n19  }\n\
    ```\n\nStart Excel and reinstall the add-in. To test the new function, enter some\
    \ numbers in the range A1:B4 and start typing the function name in cell C1. You\
    \ now see two available functions that start with the UDFS prefix.\n\n![](img/30db92ad2f868a184b03cc16c418535e_24_0.png)\n\
    \nFigure 23 The RANGEAVERAGE function in the available functions list.\n\nSelect\
    \ the **RANGEAVERAGE** function and select **A1:B4** as the function parameter.\n\
    \n![](img/30db92ad2f868a184b03cc16c418535e_25_0.png)\n\n**Figure 24** *Select\
    \ the range* **A1:B4** *as the function parameter.*\n\nPress the **Enter** key\
    \ to get the result.\n\n![](img/30db92ad2f868a184b03cc16c418535e_25_1.png)\n\n\
    **Figure 25** *Result of the function.*\n\nLet's take a closer look at the `RANGEAVERAGE()`\
    \ JavaScript function, which is responsible for taking the range as a parameter\
    \ and treating it as a matrix, as defined with the `dimensionality` property in\
    \ the JavaScript UDF's metadata. The `rng` parameter is a two-dimensional array\
    \ in which the first dimension represents the rows and the second dimension represents\
    \ the columns of the range passed to the function. This is actually the \"nested\
    \ arrays\" form, and it has the following structure:\n\n```\nrng = [[1, 8], [2,\
    \ 7], [3, 6], [4, 5]];\n```\n\nLooking at this structure, you can see that the\
    \ row count is retrieved by the `rng.length` property, and the column count is\
    \ retrieved by the number of items in one of the inner arrays: `rng[0].length`."
  mdcn: "\n# 安装和测试 JAVASCRIPT 加载项\n\n## 在 Excel 中插入 Excel JavaScript UDF 加载项\n\n您终于准备好安装和测试您的加载项了！Excel\
    \ 目前还不知道您的加载项，因此不能直接在单元格中输入函数。您需要先安装加载项。\n\n启动 Excel 并创建一个新的工作簿。在功能区中选择**插入**选项卡，然后点击**我的加载项**按钮。\n\
    \n![](img/30db92ad2f868a184b03cc16c418535e_19_0.png)\n\n**图 14** *使用功能区上的***我的加载项***命令插入加载项。*\n\
    \n在出现的**Office 加载项**窗口中，选择**共享文件夹**选项。所有现有的清单文件将在您添加到**受信任的目录表**中的目录内处理，可用的加载项将在此页面上列出。\n\
    \n如下所示，您目前只有一个可用的加载项，由保存在目录文件夹中的 **udfs.manifest.xml** 清单文件定义。\n\n![](img/30db92ad2f868a184b03cc16c418535e_19_1.png)\n\
    \n**图 15** *在***Office 加载项***窗口中选择***共享文件夹*。\n\n在 **Office 加载项**窗口中，将鼠标指针移到显示的加载项上，并注意以下加载项属性：\n\
    \n- 显示名称：**Excel JavaScript UDFs**\n- 提供商：**MrExcel Publishing**\n- 描述：**JavaScript\
    \ User Defined Functions for Excel**\n\n回想一下清单文件的内容以及相应的源字段在 Office 加载项对话框中的呈现方式：\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n        ...\n    <ProviderName>MrExcel\
    \ Publishing</ProviderName>\n    <DefaultLocale>en-US</DefaultLocale>\n    <DisplayName\
    \ DefaultValue=\"Excel JavaScript UDFs\" />\n    <Description DefaultValue=\"\
    JavaScript User Defined Functions for Excel\" />\n    ...\n```\n\n在加载项仍处于选中状态时，点击**添加**按钮将加载项插入到\
    \ Excel 中。\n\n![](img/30db92ad2f868a184b03cc16c418535e_20_0.png)\n\n当 Excel 安装并启动加载项时，它会通过工具栏消息告知您正在执行此操作。一旦此消息消失，您就可以在工作簿中使用该加载项的\
    \ JavaScript UDF 了。\n\n![](img/30db92ad2f868a184b03cc16c418535e_20_1.png)\n\n\
    ## 测试加载项\n\n**AVERAGE** JavaScript UDF 计算两个数字的平均值。要测试它，请在单元格 **A1** 和 **A2** 中输入您想要计算平均值的两个数字。然后转到单元格\
    \ **B1** 并开始输入函数前缀 **UDFS**。一旦您输入第一个字母，就会出现可用函数列表，显示您的函数以及匹配的内部函数。\n\n![](img/30db92ad2f868a184b03cc16c418535e_21_0.png)\n\
    \n*图 18* **通过键入函数前缀的第一个字母开始输入公式。**\n\n> 请注意，工具提示中显示的函数描述是您在 **udfs.metadata.json**\
    \ 文件中**第 5 行**的 UDF 元数据中输入的内容。\n\n完成函数名称的输入，或者在所需函数是列表中的活动项时直接按 **Tab** 键。参数工具提示的显示方式与内部\
    \ Excel 函数的工具提示相同。\n\n![](img/30db92ad2f868a184b03cc16c418535e_21_1.png)\n\n*图\
    \ 19* **显示参数工具提示。**\n\n> 参数工具提示在 Excel 的 VBA UDF 中不可用。能够在 JavaScript UDF 中轻松配置它们是一个很棒的功能。\n\
    \n以下代码片段展示了 `parameters` 项目中 `name` 属性的实际应用：\n\n```\nSnippet from udfs.metadata.json\n\
    :                   ...\n7               \"parameters\": [\n8               {\n\
    9                   \"name\": \"first value\",\n10                  \"description\"\
    : \"The first number\",\n11                  \"type\": \"number\",\n12       \
    \           \"dimensionality\": \"scalar\"\n13              },\n14           \
    \   {\n15                  \"name\": \"second value\",\n16                  \"\
    description\": \"The second number\",\n17                  \"type\": \"number\"\
    ,\n18                  \"dimensionality\": \"scalar\"\n19              }\n20 \
    \             ],\n:                   ...\n```\n\n选择 **A1** 和 **A2** 单元格作为函数参数，然后按\
    \ `Enter` 键。一旦输入公式，单元格 **B1** 的内容就会变为显示 `#GETTING_DATA`，表示 JavaScript 函数正在执行中。\n\
    \n![](img/30db92ad2f868a184b03cc16c418535e_22_0.png)\n\n最后，单元格 **B1** 的内容会更新为从\
    \ JavaScript 函数返回的值。\n\n![](img/30db92ad2f868a184b03cc16c418535e_22_1.png)\n\n\
    # 关于缓存源文件\n\n安装加载项后，加载项源文件会自动缓存在 Windows 文件系统中。下次启动 Excel 时，加载项将被快速识别，函数会列在可用函数列表中，即使您未连接到互联网，同步函数也会被执行。\n\
    \n对于异步函数，您需要连接到互联网才能加载加载项并执行函数；如果没有互联网连接，当您尝试使用该函数或重新计算包含该函数的单元格时，Excel 将返回一条指示错误的消息。\n\
    \n![](img/30db92ad2f868a184b03cc16c418535e_23_0.png)\n\n**图 22** *需要互联网连接才能重新加载加载项。*\n\
    \n如果您对源文件进行了任何更改，那么只需重新安装加载项即可。但是，如果您对清单文件进行了任何更改，则需要先退出并重新启动 Excel。\n\n# 扩展加载项\n\
    \n## 创建接受区域作为参数的新函数\n\n在本节中，您将向加载项添加一个新函数，该函数通过接受以 `matrix` 维度而非 `scalar` 定义的区域参数，改进了先前创建的\
    \ `AVERAGE` 函数。\n\n要创建一个名为 `RANGEAVERAGE` 的 JavaScript UDF，请将以下新函数的元数据添加到 JSON\
    \ 元数据文件中，作为 `functions` 属性的下一个数组项。请注意，`dimensionality` 参数定义为 `matrix`，以告知该函数接受区域作为参数。\n\
    \n```\nInsert into udfs.metadata.json\n\n1 {\n2     \"functions\": [\n3      \
    \   {\n:           ... AVERAGE metadata ...\n30        },\n31        {\n32   \
    \         \"name\": \"RANGEAVERAGE\",\n33            \"description\": \"Calculate\
    \ the average of the values in the range.\",\n34            \"helpUrl\": \"https://pub.mrexcel.com/javascript-udfs/help/help-rangeAverage.html\"\
    ,\n35            \"parameters\": [\n36                {\n37                  \
    \  \"name\": \"range of numbers\",\n38                    \"description\": \"\
    The range of numbers to calculate the average.\",\n39                    \"type\"\
    : \"number\",\n40                    \"dimensionality\": \"matrix\"\n41      \
    \          }\n42            ],\n43            \"result\": {\n44              \
    \  \"type\": \"number\",\n45                \"dimensionality\": \"scalar\"\n46\
    \            },\n47            \"options\": {\n48                \"sync\": true,\n\
    49                \"stream\": false,\n50                \"cancelable\": false\n\
    51            }\n52        }\n53    ]\n54 }\n```\n\n将 RANGEAVERAGE() JavaScript\
    \ 函数添加到 JavaScript 函数文件的底部，如下所示。\n\n```\nInsert into udfs.functions.js\n\n8  \
    \ /*\n9   * Function to calculate the average of the values in the given range.\n\
    10  */\n11  function RANGEAVERAGE (rng) {\n12    var total = 0;\n13    for (i\
    \ = 0; i < rng.length; i++) {\n14      for (j = 0; j < rng[i].length; j++) {\n\
    15        total += rng[i][j];\n16      }\n17    }\n18    return total / (rng.length\
    \ * rng[0].length);\n19  }\n```\n\n启动 Excel 并重新安装加载项。要测试新函数，请在区域 A1:B4 中输入一些数字，然后在单元格\
    \ C1 中开始输入函数名称。您现在会看到两个以 UDFS 前缀开头的可用函数。\n\n![](img/30db92ad2f868a184b03cc16c418535e_24_0.png)\n\
    \n图 23 可用函数列表中的 RANGEAVERAGE 函数。\n\n选择 **RANGEAVERAGE** 函数，并选择 **A1:B4** 作为函数参数。\n\
    \n![](img/30db92ad2f868a184b03cc16c418535e_25_0.png)\n\n**图 24** *选择区域***A1:B4***作为函数参数。*\n\
    \n按 **Enter** 键获取结果。\n\n![](img/30db92ad2f868a184b03cc16c418535e_25_1.png)\n\n\
    **图 25** *函数的结果。*\n\n让我们更仔细地看看负责将区域作为参数并接受为矩阵的 `RANGEAVERAGE()` JavaScript 函数，正如\
    \ JavaScript UDF 元数据中的 `dimensionality` 属性所定义的那样。`rng` 参数是一个二维数组，其中第一维代表行，第二维代表传递给函数的区域的列。这实际上是\"\
    嵌套数组\"形式，其结构如下：\n\n```\nrng = [[1, 8], [2, 7], [3, 6], [4, 5]];\n```\n\n查看此结构，可以看到行数由\
    \ `rng.length` 属性获取，列数由一个内部数组中的项目数获取：`rng[0].length`。\n"
