    \n![](img/30db92ad2f868a184b03cc16c418535e_41_1.png)\n\nFigure 36 *Select* Internet\
    \ Information Services *in the* Windows Features.\n\n# INSTALLING IIS ON WINDOWS\
    \ 7\n\nThe progress indicator appears. Wait while Windows makes changes to install\
