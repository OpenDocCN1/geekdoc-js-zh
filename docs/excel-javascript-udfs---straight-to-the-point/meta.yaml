  md: '# # WARMING UP


    # ## SETTING UP THE ENVIRONMENT


    You can install the sample Office add-in which contains JavaScript UDFs discussed
    in this book in Excel running on Windows. To do so, you need to publish the manifest
    file to a network shared folder. This chapter shows how to create a shared folder
    to which you can publish the manifest file. It also shows how to register this
    shared folder as a trusted catalog in Excel to make it possible to install and
    test the add-in in Windows.


    # ### Sharing the Catalog Folder on the Network


    Create a folder named **office-catalog** in **My Documents**. This is the folder
    to which you are going to publish the manifest file. (You can choose a different
    path and name for the catalog folder.)


    Set up sharing by selecting **Share with** and then **Specific people...** from
    the folder''s context menu.


    ![](img/30db92ad2f868a184b03cc16c418535e_15_0.png)


    Figure 6 *Share the local catalog folder to publish the manifest file.*


    The current user is already added to the shared people list by default. This is
    all you need to do to share the catalog folder on the network to be able to test
    the add-in, so simply click the **Share** button.


    ![](img/30db92ad2f868a184b03cc16c418535e_15_1.png)


    Figure 7 *Click the **Share** button to share the folder on the network.*'
  merge: -1
  pgno: 15
