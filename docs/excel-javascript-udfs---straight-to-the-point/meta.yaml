    \n**图 8** *Windows 确认目录文件夹已共享。*\n\n最后，将 **udfs.manifest.xml** 文件复制到目录文件夹中。\n\n\
    ![](img/30db92ad2f868a184b03cc16c418535e_16_1.png)\n\n**图 9** *复制并粘贴 udfs.manifest.xml\
    \ 文件。*\n\n就是这样！包含清单文件的目录文件夹已准备就绪，你可以继续在 Excel 中进行安装过程。\n\n### 在 Excel 中添加受信任的加载项目录\n\
    \n加载项目录用作存储 Office 加载项清单文件的位置，以便加载项可以作为受信任源安装在客户端应用程序中。在这种情况下，你需要使用**网络共享文件夹**类型加载项目录来安装加载项，并且你首先需要让\
    \ Office 信任中心了解目录文件夹。\n\n> **信任中心**是你可查找 Microsoft Office 程序安全和隐私设置的地方。你可以在每个\
