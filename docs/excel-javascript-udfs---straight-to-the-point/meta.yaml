    \ Excel 应用程序中安装期间显示的加载项属性，以及指向托管在 Web 服务器上的实际源文件的引用。\n\n以下是 Office 加载项清单文件中最重要的元素：\n\
    \n- **Id：** Office 加载项的唯一标识符。我们使用 [http://guidgenerator.com](http://guidgenerator.com)\
    \ 网站为该项目生成 GUID。\n- **ProviderName：** 该 Office 加载项的开发者。最多 125 个字符。\n- **DisplayName：**\
    \ Office 加载项的名称。最多 125 个字符。\n- **Description：** Office 加载项的描述。最多 250 个字符。\n- **Permissions：**\
    \ Office 加载项的 API 访问级别。对于 JavaScript UDF，请使用 `ReadWriteDocument` 权限类型。\n- **VersionOverrides：**\
    \ 有关加载项实现命令的信息。请注意，此元素中的设置还会覆盖根目录中的 `Hosts` 元素，并定义访问 `Resources` 中设置的、具有相应 `id`\
    \ 字符串的 `Url` 元素的 `Script`、`Metadata`、`Page` 和 `Namespace` 元素。加载项源文件通过此配置加载，Excel\
    \ 从而能够运行 JavaScript UDF。\n- **Namespace：** 访问在 `Resources` 中使用 `namespace` ID\
    \ 定义的匹配 `String` 元素。此字符串定义加载项中所有 JavaScript UDF 的前缀，该前缀将在工作表单元格中输入函数时使用。\n\n#\
    \ 热身准备\n\n## 设置环境\n\n你可以在运行 Windows 的 Excel 中安装包含本书讨论的 JavaScript UDF 的示例 Office\
