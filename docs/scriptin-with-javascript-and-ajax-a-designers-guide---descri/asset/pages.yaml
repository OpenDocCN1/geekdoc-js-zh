    \ a function that adds two numbers together:\n\n```\nfunction addThese(firstNum,\
    \ secondNum) {\n  return firstNum + secondNum;\n}\n```\n\nWhen you call the function\
    \ with this code\n\n```\nvar answer = addThese(5478, 430672);\n```\n\nthe variable\
    \ answer is set to 436,150.\n\n# Variables Declared Within a Function Are Local\
    \ Variables\n\nVariables declared within functions are local variables, which\
    \ means they are only usable by the code within the function and last as long\
    \ as the function in which they are declared is running. Once the function ends,\
    \ those variables are disposed of. Next time the function runs, they are created\
    \ again.\n\nThis is a good thing. A local variable's scope is limited to the function,\
    \ so it cannot conflict with a variable with the same name in other function.\
    \ The only kind of variable in JavaScript is global where the variable can be\
    \ accessed from any function. It is rare that you need a global variable, and\
    \ it's a recipe for bugs if you create inadvertently. If you need to create a\
    \ variable that sticks, create it as the property of an object. You will learn\
    \ how to do this in the next chapter.\n\nAnother advantage of using local variables\
    \ is that the memory they use is retrieved after the function completes and the\
    \ variables are no longer needed. JavaScript performs a regular process called\
    \ garbage collection that frees unused memory. This is another reason to put var\
    \ in front of variables when you declare them. If you don't use var, the memory\
    \ is not garbage collected. Depending on how your application is called, when\
    \ you create variables, they become global variables, and unless you explicitly\
    \ dispose of them, the memory of global variables grows constantly (and usually\
    \ inadvertently) creating new ones, and your application can eventually grind\
    \ to a standstill as JavaScript tries to juggle an de-dimishing amount of memory.\
    \ Using local variables, unless global variables are absolutely necessary, is\
    \ very important in an Ajax-driven world where a user can be in your application\
    \ for hours; those \"memory leaks\" can add up with prolonged use of your application."
