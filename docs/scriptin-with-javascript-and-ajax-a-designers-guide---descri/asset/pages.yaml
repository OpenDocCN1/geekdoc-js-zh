    You may already know that CSS also uses the DOM as the basis for its operation
    on the document, and the selector of a CSS rule (the part before the curly braces)
    defines elements of the DOM the CSS rule affects.


    ```

    selects all list items in element with ID "nav"

    #nav li [code goes here]

    ```


    CSS is capable of setting the style-related properties of an element—its text
    color or its position onscreen, for example.


    JavaScript takes this DOM relationship much further and allows you to not only
    set properties, but also to get and set all the values of the properties and attributes
    of the DOM. This means that JavaScript you have programmatic control of the entire
    DOM and can manipulate the document structure in response to user actions. I''ll
    get right to the specifics of how to do this after we look at user-created objects.


    # User-created Objects


    While JavaScript has many predefined objects, you can also create your own objects
    to manage large tasks and data sets within your application. Within an object,
    you define its properties and the methods that can act on those properties.


    # OBJECT LITERALS


    The simplest way to create an object is to use a format called an object literal.
    The format of an object literal is'
