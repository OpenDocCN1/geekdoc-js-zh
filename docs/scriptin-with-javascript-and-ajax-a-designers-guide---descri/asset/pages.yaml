    # # Summary


    The projects in this chapter clearly demonstrated that JavaScript is an additional
    layer that enhances the foundation of a Web page—a foundation that is created
    through languages such as PHP in the server, and HTML and CSS in the browser.


    The Author Carousel project showed the concept of building links containing a
    small part of a data set that could later be clicked to request the full data
    set; the clickable photos of each author enables the user to request all the available
    information about that author. In making this happen, you saw how PHP was used
    to create a script'
