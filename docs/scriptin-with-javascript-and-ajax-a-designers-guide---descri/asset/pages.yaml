  md: 'that read the data records from JSON files, and built a Web page on the server.
    As each link in the page was being built, references to the data source (the index
    numbers of the file array) were embedded in it. When the user clicked a link requesting
    the full data set, and the correct data was located and sent to the browser.


    The Yahoo! AutoComplete project showed how to build a number of pages from a template
    page and how to build and later detect query strings in the URL so that the server
    could understand the user actions and provide appropriate responses. You also
    saw how thirdparty content, in this case Yahoo! Maps, can be accessed through
    an API and be integrated seamlessly into the page.


    In both projects, JavaScript enhanced the user experience in two important ways:
    by improving communication between the browser and server, and by providing intuitive
    and easy-to-use interactions.


    I hope that this book has helped you understand how JavaScript works and how to
    write it. Most of all, I hope that you now have the knowledge and confidence to
    start using JavaScript in the creation of the next generation of online user experiences.'
