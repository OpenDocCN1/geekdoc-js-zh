  md: 'the function would run immediately (setting the onload property to the result
    of the function!) and not wait for a page load event to be sent.


    Also note that you write window.onload=init because onload is a method of the
    window object, so you must always precede it with window. for it to work.


    By omitting the parentheses when you assign the init function to the onload property,
    the function does not run immediately; instead, it runs when the load event occurs
    after the page is fully loaded.


    The onload handler is very important in every JavaScript application because it
    is used to initialize the page state; that, to set up all the event responses
    that the interface will provide to the user. If you are looking at an existing
    piece of JavaScript and determining what it does, the best place to start is with
    the function that is called by the load event—everything flows out from there.


    Also note that any JavaScript statement not enclosed in a function and just "loose"
    on the page runs as soon as it loads. For this reason, it''s very unusual to place
    any JavaScript except the onload event assignment outside of a function.


    # Adding Event Listeners on Page Load


    After all this discussion, I''ll now show you a simple example of event listeners
    that are added to an element when the page loads. In this case, when the onload
    event handler calls the init function, it will add listeners to a text field.


    As a result of the functions called by these event listeners, the text field will
    highlight (its background property will be set to green) when the field receives
    focus; it 않을 (the default background be restored) when the focus is removed. I
    will do this using the addEvent helper function I showed earlier, so that it works
    on both W3C and Microsoft browsers.


    Here''s the form input.


    ```

    <input id="email" name="email" type="text" size="24" />

    ```


    It''s the only HTML element that is relevant to this demo, so I''ll leave the
    rest of the markup to your imagination—you can see it in the download file.


    Step one is to ensure the load event is triggering the function that will set
    up the event listeners.'
