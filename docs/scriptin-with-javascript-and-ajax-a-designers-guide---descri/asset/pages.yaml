    you will trigger an error because you forgot to put quotes around the string.
    In this case, JavaScript would assume that you are referring to a variable named
    Hello!, and if there were no variable called Hello! (probably not), would display
    the error message *Hello! Is not defined* in your error console.


    Forgetting to quote a string like this is an easy mistake, as you may soon discover
    when you start writing your own code.


    With this in mind, note the problem with this string:


    "Said "Go away!" and went back to her book."


    The string clones (ends) right before the G of Go because that''s the second double
    quote located—the rest of the text is considered outside the string, so JavaScript
    will then try to evaluate Go away and went back to her book. You may not be surprised
    to learn that this phrase is not part of the JavaScript language, so an error
    occurs. There are two ways to get around this issue of quotes within a string:
    One way is to "escape" the problem characters with a backslash:


    "She said \"Go away!" and went back to her book."


    Escaping a character causes it to be treated as a string character and not be
    evaluated as code, so now the string does not end until the closing quote is at
    the end of the line.


    The other way is to use single quotes around the string and double quotes within
    it (or vice versa):


    ''Said "Go away!"'' and went back to her book.''


    # Key Concept: Evaluation


    In JavaScript, and most programming languages, the common statement structure
    someVariable = someExpression;


    sets the value of the variable on the left to the *evaluated* result of the expression
    on the right. In this context, "evaluated" means "processed by JavaScript". For
    example, if you use a variable name on the right side of the statement, JavaScript
    will evaluate that variable to its value and set the variable on the left to that
    same value. Every expression you write must be be evaluated by JavaScript or an
    error will result.'
