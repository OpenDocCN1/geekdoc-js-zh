  md: '# JAVASCRIPT BASICS


    Here''s how this works. The function has two parameters, firstNum and secondNum,
    which are special kinds of variables that are set to the values of the arguments
    passed to the function by the function. In this example, the parameters'' values
    are added and the result is returned to the code that made the function call.
    In functions, the right side of the line of code that calls the function evaluates
    to the returned result, so the left side, in this case the variable theAnswer,
    is set to that value. Now you can use the variable theAnswer later in your code,
    and it will evaluate the number 436,150.


    The return keyword is not required, but its purpose is to pass back the result
    of the function''s work to the code called. Sometimes you don''t need to return
    anything from a function, you can omit return (in which case it will return undefined).
    However, note that once the function encounters return, it stops running and the
    calling-script gains control.


    Once you have written a function like this, you can use it over and in your code
    by simply calling the function with the two numbers you want to add.


    Any time you find yourself writing the same piece of code or something very much
    like it a second time, it makes sense to break it out into a function. You can
    then write and maintain it in one place, and use it whenever the code logic requires.


    # FUNCTIONS DON''T REQUIRE ARGUMENTS


    Sometimes you won''t want to pass any arguments with a function. Perhaps your
    function returns the current time, for example, and doesn''t need any additional
    information to do that.


    ```

    var rightNow = currentTime();

    ```


    Even if you don''t pass arguments, you still need to include the parentheses or
    the function will not be called.


    # PASSING ANONYMOUS FUNCTIONS AS VARIABLES


    An interesting aspect of JavaScript functions is that they can be passed around
    your code like variables.'
