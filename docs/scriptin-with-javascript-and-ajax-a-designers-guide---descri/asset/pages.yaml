  md: '# CUSTOMIZING THE AUTOCOMPLETE CONTROL''S DEFAULT BEHAVIOR


    By default, the AutoComplete Control only supplies matches based on an exact match
    between what the user is using and the first letters of the results. In other
    words, if the user types Ma, there would be a match on Madrid but not on San Mateo.
    The user might be searching by office, city, or country name, I want to loosen
    up this behavior and match anywhere within the search results, which I do like
    this:


    ```

    autocomplete.queryMatchContains = true;

    ```


    With the queryMatchContains property set to true, as long as the user string is
    contained somewhere in the location information, a result will be displayed. Now
    typing Ma returns both Madrid and San Mateo.


    However, this change now means the results not directly relate to the query: if
    the user types D, the first result would be AU-Docklands - Melbourne - Australia
    (see Figure 7.12) because there''s now match on Docklands.


    Figure 7.12 Because the "looser" search returns any result with a letter D in
    it, the first five results don''t start with the letter typed.


