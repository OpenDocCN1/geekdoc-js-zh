  md: "SCRIPTIN' WITH JAVASCRIPT AND AJAX - CHAPTER 3\n\nUsing this technique, you\
    \ can have all kinds of extra styles in your style sheet ready to be invoked with\
    \ the addition of a class to an element when the right moment arrives—as you will\
    \ see in the following example.\n\n# Zebra Tables\n\nHere'll use DOM scripting\
    \ to add a class to alternate rows of a table to create a striping effect. This\
    \ effect helps guide the user's eye across the rows and is especially useful if\
    \ the table is wide. Why this table in Chapter 1—now I will write the JavaScript\
    \ to make it work.\n\nAchieving this stripe effect requires some of the DOM scripting\
    \ techniques you just saw. I will also use the onload event handler to trigger\
    \ the function that adds the stripes right after the page loads. Also, after you\
    \ learn about event handling techniques in the next chapter, I'll come back to\
    \ this table and make the rows high-light as the user moves over them.\n\nIn this\
    \ example, I'll add the class of stripe_table on the table element, as shown in\
    \ this markup.\n\n```\n<table class=\"stripe_table\" border=\"1\">\n  <caption>More\
    \ JavaScript books for your reading pleasure</caption>\n  <head>\n    <tr>\n \
    \     <th scope=\"col\">Title</th>\n      <th scope=\"col\">Author</th>\n    \
    \  <th scope=\"col\">Publisher</th>\n    </tr>\n```\n\n# Adding and Removing Classes\n\
    \nYou can have multiple class names separated by spaces in a class attribute,\
    \ like the three classes illustrated here:\n\n```\n<div class=\"nav links members\"\
    ><!-- ----></div>\n```\n\nIn this situation, you can run into problems if you\
    \ simply set a class, as I do in the \"Adding class to an element\" example, on\
    \ an element that already has classes. Those existing classes will be replaced\
    \ by the one you are adding. To avoid overwriting existing classes when you add\
    \ new ones, you will have first get the classes that are currently there, store\
    \ them in an array, add your class, and write the whole thing back, forgetting\
    \ the space that goes between each name. This is a nifty helper function that\
    \ will correctly add and remove classes in the scriptin_helper.js file in the\
    \ downloads, and I will use it in later examples."
