  md: 'This is a basic example of Sajax in action, but Sajax is a great framework
    that does one thing—accessing server functions from the browser—really well. It''s
    easy to take an example like this and modify it for your own purposes. The capability
    to run server-side functions opens a world of possibilities—such as validating
    forms on the client and again on the server when the form is submitted (as you
    must for security reasons) using the same set of validation functions. This reduces
    the amount of code you need to write and means you only have to maintain this
    code in one place.


    Perhaps the most exciting possibility that a framework like Sajax offers is that
    you can query a database using server-side functions without round-tripping the
    page. For example, if users of your site have to choose a unique user name during
    the registration process, you can call a server-side function that checks the
    database for the existence of that name as soon as the user finishes typing a
    name choice and clicks away from the field.


    # Summary


    This chapter gave you an introduction to Ajax and the different formats of data
    that it enables you to bring into the browser. In the next chapter, I''ll explore
    more advanced coding techniques and look at other frameworks that provide sophisticated
    interactions for the user interface.'
