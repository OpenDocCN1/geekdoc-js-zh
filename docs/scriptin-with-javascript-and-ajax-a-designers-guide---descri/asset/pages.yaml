    Let''s now look at some frameworks. It would be impossible to show all the available
    frameworks, I''ve picked four of the larger and well-known ones that I have used
    on different projects to give you a good grounding in how they work and how they
    differ.


    The four frameworks are jQuery, the Yahoo! User Interface (YUI), Prototype, and
    Adobe Spry. The overall goal of each framework is to provide consistent and predictable
    functionality that''s easy to use. Each framework goes about the solution in similar
    yet different ways.


    In each case, the framework is a file or a number of JavaScript files that have
    to be linked to your page using a script tag. You can see in the source of each
    example the files required to implement the interaction illustrated.


    I''ll give you a nice introduction to these four frameworks by showing how each
    one implements Ajax.


