    # Ajax and Data Formats


    As mentioned earlier in this chapter, although the X of Ajax stands for XML, almost
    any kind of data can be served via the XHR object. The most common formats are
    HTML, JSON, XML, and plain text. The preceding example was a very simple demonstration
    of using plain text. More complex text formats, such as CSV (comma separated values)
    text files, can also be used and parsed with JavaScript String object methods.


    Because HTML, JSON, and XML are the most popular Ajax file formats, we''ll take
    a look at each of them, starting with HTML.


    # Creating a Simple Catalog


    A simple way to use Ajax is to store (or generate) data on the server as HTML
    fragments that can be added into a page. An HTML fragment, as its name suggests,
    is a term I use for an HTML file (or HTML) that is generated by the middleware
    on your server) that is not a complete page but simply some HTML elements that
    are intended to be added to an existing page—they can''t really "stand alone."
    I''ll demonstrate using HTML fragments in a multipage catalog example.


    In this example, I''ll create a simple catalog that has an index page and three
    product pages. I''ll again use my beloved guitars for content, as Figure 5.7 illustrates.


    In this three-column layout, only the content within the area with the blue border
    in the center column changes; the header, sidebars, footer, and the tabs in the
    center column are the same for every page. Consequently, I can use the same code
    file for these unchanging areas and just update the content area. I''ll start
    by making the page work using just HTML and PHP, and then I''ll layer on the functionality
    for JavaScript-powered users.'
