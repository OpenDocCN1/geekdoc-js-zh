    # # The PHP Backend


    Now that the interface is usable without JavaScript, I need to write some PHP
    to get the carousel''s functionality—generating the content for the carousel and
    displaying the author''s info when the user clicks an image—to work without JavaScript,
    too. Then I''ll layer on the JavaScript interactions. PHP has three important
    roles in this project:


    +   1. It reads the JSON files from the server.


    +   2. It writes the required HTML elements for each item (author photo and name)
    of the carousel using the JSON data and serves up the initial page.


    +   3. When the user clicks on an item, and the request for the overlay is made
    by Ajax, the PHP script will simply serve the requested JSON data to the browser
    where it will be processed by the Ajax callback function and displayed in the
    overlay.


    If the request is not made via Ajax, because JavaScript is not available, PHP
    writes the JSON into HTML elements and serves a new page as a regular round-trip.
    In this case, the selected author''s information will be displayed in a div below
    the carousel. You will see how PHP determines whether or not the request was made
    via Ajax later in the chapter. Let''s first look at the PHP that generates the
    initial page in more detail.


    This example requires PHP because it uses PHP''s new and improved file reading
    capabilities.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# SCRIPTIN WITH JAVASCRIPT AND AJAX - CHAPTER 7


    # READING THE JSON DATA


    Using files stored on the server is a simple way to provide data to an Ajax-enabled
    page. In this example, PHP will scan the folder to determine the number of files,
    read them, and then add the required information into the page. PHP needs what''s
    called a fully qualified path to file lists every fully qualified path from the
    Web server root down to the folder containing the file in question; in this case
    a folder might look like this:


    ```

    /root/html/code/examples/vtm_carousel/json

    ```


    Let''s see what it takes to build a fully qualified path to the JSON files.


    | the name of the script | $JSONFolderName=''json''; |

    | Unix separator-use "" for Windows | $sep=''/''; |

    | the name of the folder where the JSON files live | $basename="index.php"; |


    These three are hard-coded variables:


    +   1. The name of the folder element symbol.

    2. The correct path element delimiter symbol. This symbol is the slash that goes
    between the elements of the file path, as in json/filename.json. The reason this
    needs to be stored in a variable is that it is either a backslash / a forward
    slash depending on whether the PHP server is running on Linux or Windows, respectively.
    Note that when you see the variable $sep contains a slash.

    3. The name of the file that calls the PHP script. The folder with the JSON file
    is located at the same level as the PHP script, so I will first ascertain the
    name of the folder containing the script, and append the name of the JSON folder
    onto it.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_233_0.png)


    Many uses basename(\$_SERVER[''PHP_SELF'']); to obtain the name of the PHP script;
    by obtaining this filename, if the script''s changes later, the code will not
    break. However, this is a security hazard because it is vulnerable to XSS (cross-site
    scripting) attacks. See the MC2 site for details. mcdesign.com/blog/php-self-safe-alternatives
    for XSS attacks and how to prevent them.


    ```

    $JSONPath=$_SERVER[''SCRIPT_FILENAME''].$sep.$JSONFolderName;

