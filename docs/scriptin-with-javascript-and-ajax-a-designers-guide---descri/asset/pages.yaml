  md: '# SCRIPTIN WITH JAVASCRIPT AND AJAX · CHAPTER 7


    FIGURE 7.2 The overlay zooms out of the clicked image and displays over the carousel.


    The Overlay design pattern is modal; that is, once the overlay opens, the user
    can only interact with the content of the overlay and only regain access to the
    rest of the page by closing it. This is the desired interaction before using overlays
    in your work. If you just want to show information when the user rolls over an
    element and remove that information when the user rolls off it, then you need
    the Tooltip pattern.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_225_0.png)


    # # A Location Finder with AutoComplete


    The second project, Location Finder, is search-based. Many sites offer a search
    feature, and it would be helpful the field into which the user types their search
    hasAutoComplete. As you have probably noticed, when you search on Google, the
    AutoComplete Control adds a drop-down menu containing possible matches as soon
    as you start to type. This happens because the browser is passing the entered
    string to the server via AJAX each time you release a key, and matching results
    are being returned for display.


    AutoComplete has two important advantages for the user. First, the user may not
    need to type the entire search phrase. If the desired search term appears in the
    drop-down menu after a few characters are entered, the user can simply select
    the choice without typing it in full. Second, as Google searches, with additional
    programming control can offer useful matches that expand on what the user typed
    or offer corrections for misspelled words. An alternative alternative can then
    be offered instead of a search that yields disappointing results.


    In the case of the Location Finder project you will see in this chapter, the user
    is able to find the locations of Yahoo! offices around the world. Just typing
    a single character will display a list of matches, and as the user types more
    the search becomes more refined. If the user types "Fra", for example, suggestions
    will include the offices in San Francisco and Paris, France, as shown in Figure
    7.3.'
