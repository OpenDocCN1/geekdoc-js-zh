  md: '# USING THE OR OPERATOR TO SUPPLY DEFAULT VALUES


    Then there is the very interesting and handy use of OR operator to supply a default
    value, as shown here:


    ```

    var userName = logName || ''Visitor''

    ```


    Here, I want to set the userName variable to the user name supplied that user
    logged in. However, if logName is undefined (the variable was never set because
    the person has logged in), the user name will be set to “Visitor”. When the OR
    operator is used in this format, the value to its right is a fallback value in
    case the one to the left is not set. This is very handy for setting a variable
    to a default value when the primary value is not provided, as demonstrated in
    this example.


    # THE + OPERATOR—ADDITION AND CONCATENATION


    The + (plus symbol) operator actually has two uses. The first, as you have seen,
    is its familiar role of adding numbers together.


    ```

    alert (123+456) //displays 579

    ```


    ```

    alert 100++ //displays 101

    ```


    However, the + operator will also concatenate (join together) two expressions,
    such as strings—a common task you will often perform.


    ```

    alert ("lap" + "top") //displays laptop

    ```


    Be aware that the + operator will only add two values together if they are numbers;
    otherwise, it will concatenate them.


    | number | a=5; |

    | string | b="4"; |


    ```

    alert (a+b); //displays 54

    ```


    This displays 54, because you are adding a string to a number, JavaScript treats
    both values as strings and concatenates the two values.


    If you want to use a variable that is stored as a string, you can use the string
    methods parseInt() and parseFloat() to convert it to an integer or a floating-point
    number, respectively. Just put the number-ber, the variable that contains it,
    in the parentheses, like this:


    ```

    parseInt(b);

    ```'
