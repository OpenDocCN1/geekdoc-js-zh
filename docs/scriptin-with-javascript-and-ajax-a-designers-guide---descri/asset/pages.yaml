  md: 'Generally, I work with keyup or keydown. Which one I use depends on the circumstance.
    Usually, I''ll use keyup but sometimes keydown when I want to test the character
    before it onscreen. For example, if you have a numbers-only text field, you might
    use keydown so you can test the character, and reject it without letting it appear
    in the field if it is not a number.


    # Text Fields with Character Limits


    Those of you who have tried to pack the excitement of what you are right now into
    a 140-character Twitter tweet have encountered a text field with a character limit.
    As soon as you type that hundred-and-forty-first character, the Update button
    dims and you can''t send your tweet. Ahhhh, now the world will never know the
    tasty details of bologna sandwich!


    Limiting text input can help ensure you are getting correctly sized data (U.S.
    zip codes and phone numbers for example) and complement those who want rant your
    site to at least organize their thoughts.


    I''ll demonstrate how to set character limits on fields with a textarea (multiline)
    text field, as shown in **Figure 4.18.**


    Figure 4.18 This is the finished example. A display below the text area shows
    how many more characters the field will accept.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_140_0.png)


    For this example, I''ve limited the field to 20 characters, but this can easily
    be changed.


    The strategy for designing such a control is simple.


    +   1. Each time the user types a character in the field, count the total number
    of characters in the field.


    +   2. Update an onscreen display so users can see how many characters they still
    have left to type.'
