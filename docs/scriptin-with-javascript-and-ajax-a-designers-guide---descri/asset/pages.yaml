    # Using an Object Literal to Maintain State Through an Ajax Call


    One problem with requiring two functions for an Ajax call—one to make the call
    and the other to handle the callback—is that you are passing control from one
    function to the other. However, because control goes via the Ajax function, you
    can''t at that time data from the calling function to the callback—one does not
    directly call the other. The variables that existed in the calling function are
    not accessible to the callback function. This is a problem of maintaining state
    in your application—where important values must persist for later reference.


    I''ll show you a simple example of this problem and how to fix it using the two
    functions in the Code 5.2.


    In this example, I''ll get the user''s name from a form field, so I can display
