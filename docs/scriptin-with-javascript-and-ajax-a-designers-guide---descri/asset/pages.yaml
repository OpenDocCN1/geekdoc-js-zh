  md: '# Strings


    Strings are simply text characters. You can put any characters you want in a string.
    A string is always quoted—that is, enclosed in single or double quotes—your choice.
    When quoting strings, make sure your characters "straight up-and-down" quotes
    and not "curly" quotes that may be automatically formatted by a text program.
    Here I put some strings into variables:


    ```

    var joesGreeting = "Waaazup";

    var userPrompt2 = "Enter your name";

    var carMake="Lotus", carType="Elan", carCategory="classic sports car";n

    ```


    The preceding example shows that you can declare several variables on one line,
    separated by commas.


    It''s very important to realize that JavaScript does not attempt to evaluate strings
    (see the sidebar "Key Concept: Evaluation"), as the following example illustrates.


    In this example:


    | 2+3 is evaluated to 5 | var answer = 2+3;

    | | alert (answer);

    | | displays: 5 |


    | the string is not evaluated | var answer = "2+3"

    | | alert (answer);

    | | displays: 2+3 |


    "2+3" is a string, so JavaScript makes no effort to evaluate it and simply copies
    the string into the variable.


    Conversely, JavaScript will attempt to evaluate anything that is not a string.
    If you want to pop up a cheery greeting to your visitors and you write


    | note the text is missing quotes | alert (Hello!); |'
