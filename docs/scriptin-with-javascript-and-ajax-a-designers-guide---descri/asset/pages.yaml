  md: "# SCRIPTIN' WITH JAVASCRIPT AND AJAX - CHAPTER 9\n\nTo help you ensure that\
    \ you are working with page DOM that actually exists, a load event is issued when\
    \ the page is entirely loaded into the browser window. You can use the onload\
    \ handler to detect this event and trigger the JavaScript functions that will\
    \ set the initial page state for the user. Then you know that DOM is ready.\n\n\
    Here's a simple example of how to do this:\n\n```\nwindow.onload=init;\n\nfunction\
    \ init() {\n    alert(\"The page is fully loaded!\");\n    // normally, code to\
    \ set up initial page state (such as\n    adding event listeners) would be here\n\
    }\n```\n\nIn the highlighted part that calls the init function, you can see that\
    \ there are no parentheses after the init function name. You would normally add\
    \ parentheses after a function name because you would want the function to run\
    \ immediately at that point in the code. However, you are setting up an event\
    \ that will call the function at a later time, you don't he. If you wrotenwindow.onload=init();\n\
    \n# How Can DOM Work Against You\n\nThere are two ways that you can run into problems\
    \ with the onload event:\n\n**Delay in assigning listeners.**\n- **Delay in assigning\
    \ listeners.** After that linked content, such as images, loads after the DOM\
    \ (HTML markup), and that load event does not fire until after linked content\
    \ is loaded. So if your page contains many large images, there can be a substantial\
    \ delay between the DOM loading and the onload event. In this interval, the user\
    \ may try to type into a search field or click a link-after all, the DOM is loaded\
    \ and those elements are visible. If you wait until a number of images are loaded\
    \ before you get the load event that registers the event listeners, the user may\
    \ be clicking on links that yet do nothing.\nAs a workaround for this problem,\
    \ there are some other helper functions that can cause a \"DOM is ready\" type\
    \ of event to be called as soon as the DOM is ready. For example, the jQuery framework\
    \ has a ready method that is called after the DOM and CSS (but before images and\
    \ linked content) are loaded to avoid this delay in assigning listeners.\n**Competing\
    \ for the onload event.** Because of the importance of waiting for the DOM to\
    \ be ready, third-party scripts that you may also want to set the window.onload\
    \ property, and this can override your setting or you override them, depending\
    \ on who loads last. Thanks to a consensus by Peter-Paul Koch, there is a robust\
    \ helper function addEventListener multiple events to be assigned to the window.onload\
    \ property. I will use this function in later examples and it is included in the\
    \ Scriptin' helper file. I recommend you use this function to assign your initialization\
    \ functions."
