    ```\n\n# jQuery's Ready Event\n\nYou can see in earlier examples that the onload\
    \ function has shortcomings in that it doesn't fire until the entire page has\
    \ loaded. This includes images and other embedded elements that might continue\
    \ to load for some time after the DOM has loaded. This means forms and links could\
    \ be triggered by events from users before the onload event has initialized the\
    \ associated listeners for them. To overcome this problem, jQuery offers the (document)\
    \ ready event that fires as soon as the DOM is loaded. This is illustrated in\
    \ the section \"Query and Ajax\" in this chapter. It's an important feature that\
    \ is found in other frameworks also, where the method may be named contentready,\
    \ onLoad, or the idea is the same; you can put your JavaScript to work as soon\
    \ as the DOM is loaded."
