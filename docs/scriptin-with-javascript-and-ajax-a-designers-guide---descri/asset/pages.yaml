  md: '# Maps


    In JavaScript, sets of property/value pairs within a set of curly braces create
    a map. Maps, which are referred to as hash tables in languages like C++, are the
    basic data structure of JavaScript and you will often encounter the term map when
    you read JavaScript; it simply means a set of property/value pairs. If you study
    Code 5.9, you will see it is simply a map, where the values are four strings,
    an array, and two maps.


    As you can see, JSON is very lightweight compared to a tag format like HTML or
    XML. A JSON file can be one-third or less the size of its XML equivalent.


    Besides its simple and easy-to-understand format, the major benefit of JSON format
    is that it can be instantly transformed into a JavaScript object ready for use,
    as you are about to see. This is in strong contrast to XML where each element
    of the data must be parsed out of its tag and then added into generated HTML elements—a
    slow and tedious programming procedure.


    These benefits are driving the adoption of JSON over the more established XML
    format in online applications. Many syndicators of content such as Yahoo! and
    Google now make their data feeds (RSS, for example) available in JSON as well
    as XML. In time, XML will be less widely used because data feeds are increasingly
    being consumed by JavaScript, and it is so much easier to do that with JSON.


    # EVALUATING JSON


    JavaScript''s eval converts any string in JavaScript syntax, including JSON, into
    executable JavaScript. In JSON, eval creates an object from the data, which can
    then be accessed in the same way as data in any JavaScript object. While this
    is convenient, it is also insecure, because malicious code can be passed in place
    of an expected file, evaluated as JavaScript, and then executed. Douglas Crockford,
    devised the JSON format, has written a useful function called json.js that does
    the job as eval but rejects any code that is not correctly formatted as JSON,
    making it almost impossible to pass malicious code through this function. While
    eval is a quick and easy way to turn JSON or any string data into JavaScript,
    it is much safer to evaluate JSON with the json.js function, as I do in the examples
    that follow.'
