  md: "# Namespacing\n\nMost of the considerations I list here are business issues.\
    \ However, there is a related technical issue that I want to cover before I start\
    \ showing some examples of frameworks in action, and that issue is namespacing.\n\
    \nA namespace is a container that provides scope for items within it. Let me explain\
    \ what that means and why it matters to you.\n\nYou may remember that earlier\
    \ I stated that JavaScript only has two kinds of scope for variables—global, meaning\
    \ accessible from everywhere, and function/object level, meaning only accessible\
    \ from the function or object where they are declared.\n\nIf you create a function\
    \ like this\n\n```\nfunction myFunction { some code };\n```\n\nor a variable like\
    \ this\n\n```\nmyVariable = \"Hello\";\n```\n\nboth these entities are now in\
    \ the global namespace: they share the same scope, which in this case means accessible\
    \ by the entire codebase.\n\nProgramming languages use namespaces to avoid conflicts\
    \ with similarly named libraries and functions. If during development, a team\
    \ member uses a function name that you have already used, some hard-to-debug problems\
    \ could be introduced.\n\nLet's say you write a function that adds an option to\
    \ a select box after retrieving the options from your database via an Ajax request.\
    \ This function has parameters for the select box element and the value and text\
    \ for the option, which will add each option as the data to it, like this\n\n\
    ```\nfunction addOption(element, value, txt) {\n  var option = new Option(txt,\
    \ value);\n  element.options[element.options.length] = option;\n}\n```\n\nThis\
    \ addOption function would by default defined globally, or more specifically,\
    \ within the global namespace."
  merge: -1
