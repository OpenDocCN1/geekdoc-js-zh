  md: '# Introduction


    Scriptin'' with JavaScript and Ajax is the third in a series of books aimed at
    introducing designers and programmers to the process of developing browser-based
    interfaces. The first, Stylin'' with CSS, focuses on the structure and styling
    of content, and the second, Codin'' for the Web, focuses on the three-tier architecture
    of browser, middleware, and database that are the core components of almost every
    Web site.


    The focus of this third book is JavaScript, and a JavaScript-based programming
    technique called Ajax that dramatically improves communication between the user''s
    browser and the Web server. The goal of this book is to teach you how to use JavaScript
    and Ajax to develop sophisticated and responsive user interfaces for today''s
    Web sites and online applications. Ajax has given a new purpose to JavaScript,
    and virtually all of today''s successful sites and online applications use JavaScript
    and Ajax extensively.


    # About This Book


    My objective in writing this book is to provide you with a solid understanding
    of how JavaScript is written and the possibilities it offers, and how to develop
    robust and compact code that runs reliably in all modern Web browsers. Through
    numerous examples that build on each other, you will develop the understanding
    and skills to use JavaScript to improve the user experience and performance of
    the Web sites you develop. All the examples can be readily added into your own
    pages, which is a great way to start using JavaScript. Along the way, I will show
    you techniques, shortcuts, and pitfalls learned from the development of many projects.


    As with my other books, the focus is on developing practical, professional, and,
    hopefully, profitable skills.


    While this is a book about JavaScript, it has, by necessity, a broader scope.
    JavaScript cannot be used in isolation: Its purpose is to enhance a Web page with
    behaviors. It acts on a page structure (the HTML markup) and its presentation
    (the CSS styling) to provide interactivity in what would otherwise be a static
    static page. Through Ajax interactions, JavaScript can also request content from
    the server by communicating with the middleware that generates pages and manages
    communication with the database.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'This means that HTML, CSS, and server middleware (I use PHP in this book) must
    all be considered when discussing JavaScript. Therefore, don''t be surprised to
    find that many pages of this book illustrate HTML, CSS, and PHP code: This is
    the context within which JavaScript operates. I provide detailed explanations
    of the purpose of such code, which you will benefit from most of this book if
    you already have a good grounding in HTML, CSS, PHP or another middleware language
    such as .NET or Java.


    Also, let me state that this book is not. First, it is not comprehensive coverage
    of JavaScript. While I show plenty of real-world examples using coding techniques
    that are far beyond the basics, I don''t cover the most advanced topics such as
    prototypical inheritance and closures. However, after reading *Scriptin*, such
    subjects will certainly be more understandable to you, and throughout, I provide
    many references to resources that can further grow your skills. Second, I don''t
    provide details of every property and method of every object in the JavaScript
    language. There are many excellent books and online resources available that can
    provide you with that information, and I mention many of them in this book.


    # # About JavaScript


    JavaScript is the only programming language that runs in the browser, and you
    cannot build a modern Web application without it. Today''s users expect forms
    to be validated as they fill out, on-demand content delivery without waiting for
    new pages, and a general application-like look and feel to the interface. JavaScript
    is the key to meeting these expectations.


    The lines between Web sites and online applications are becoming blurred: Is Facebook
    a Web site or an online application? It''s accessed over the Web but its interface
    and its ability to update data without page refreshes give it characteristics
    of a desktop application. Certainly, I use the term site and online application
    interchangeably in this book—it may becoming a meaningless distinction.


    As part of its new role in powering interactive interfaces, JavaScript has recently
    been getting the kind of attention from developers that CSS received some years
    ago in an effort to standardize its implementation across all browsers. CSS is
    now much improved in this regard, but JavaScript still has many differences in
    the way it works across the various browsers. These differences are a throwback
    to the days of the "browser wars" where Netscape and'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Microsoft spent the late 90s developing competing features in an effort to
    differentiate their virtually identical products.


    # JAVASCRIPT''S W3C AND MICROSOFT IMPLEMENTATION MODELS


    A legacy of the browser wars is two different implementations of JavaScript. Microsoft
    browsers adhere to what I refer to in this book as the Microsoft model, and other
    browsers, most notably Firefox, Safari, and Opera, follow a standard that I refer
    to in this book as the World Wide Web Consortium (W3C) model.


    The most significant differences between the W3C and Microsoft models are in three
    crucial areas of JavaScript''s implementation: the event object that records the
    location (which element) and the type (mouse click, key press, etc.) of user actions;
    the XMLHttpRequest that manages Ajax requests; and the load that enables a page
    to be initialized with JavaScript-driven behaviors as soon as it arrives in the
    browser. In this book, I''ll illustrate how your code can detect whether the user''s
    browser implements the W3C or Microsoft model and respond appropriately.


    These browser differences, the often verbose nature of JavaScript code, and the
    demand for more sophisticated interactions in the user interface have driven the
    development of numerous JavaScript frameworks to address these issues. Frameworks,
    or libraries as they are often known, provide extensive prebuilt functionality
    for common tasks, sophisticated interface components, cross-browser compatibility,
    and, in many cases, virtually a new language that runs on top of JavaScript. Frameworks
    can dramatically reduce development time, and I''ll show examples of several frameworks
    and their capabilities in the later chapters.


    # ACCSIBILITY


    For your Web site to reach the widest possible audience on the widest range of
    devices, JavaScript should be used only to enhance already functional Web pages.
    No site should entirely depend on JavaScript for its operation: This is an issue
    of accessibility that I discuss in Chapter 1. Unfortunately, many sites today
    are totally dependent on JavaScript for their operation: Such sites are unusable
    by those who cannot run JavaScript in their browsers, who are visually impaired
    or who are physically incapable of the gestures that a JavaScript-driven site
    may require, such as using the mouse to drag and drop an element.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'In this book, you will learn how to design Web sites that provide the best
    experience to users with JavaScript, and yet still provide an acceptable and functional
    experience for those users who, for whatever reason, cannot run JavaScript in
    their browsers or cannot interact with the more complex interface features JavaScript
    can provide. In Chapter 7, I show two projects that make extensive use of JavaScript
    and Ajax, both of these projects are still usable if JavaScript is not present.


    # Getting Ready to Use This Book


    If you were to ask me, “How should I go about learning JavaScript from this book?,”
    here’s what I would say.


    Start by just reading through the book. Find somewhere quiet when you have a couple
    of hours and skip through it. Don’t worry about understanding everything the first
    time, just become familiar with the content of the book and the examples it contains.
    If you have a computer at hand so you can review the examples on *Scriptin’* Web
    site as you do, so much better.


    Take time to study the code. Download the zip file of the code from www.scriptwithajax.com
    and unzip. Inside the folder called “code,” you will find all the examples organized
    by chapter. It is very helpful as you review the examples in the book to have
    the associated code open in a code editor so you can see the context of the part
    of the code that I am discussing.


    You can run the code on your own server. If you copy the entire code folder onto
    a Web server running PHP and type the URL of the code folder into the address
    bar of your browser, the *Index.php* file in that folder will load and display
    links to all the examples.


    After you are familiar with the code, take the examples and start incorporating
    them into your own projects. When you start to modify the code for your own purposes,
    your skills will develop quickly.


    The code you write rarely works the first time, but with tools that give you visibility
    into what your code is doing, you can rapidly bridge the gap between what you
    think the code is doing and what'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'it is actually happening. Reconciling these two states is called debugging.


    To help you write and debug your code, I recommend you take the following steps
    to set up your computer.


    +   1. Download the Firefox browser at www.getfirefox.com and install it. Firefox
    offers good development tools and is probably the most standards-compliant browser.
    Once you have your code working in Firefox, test it on other browsers and make
    any necessary adjustments.


    +   2. Download and install two essential Firefox add-ons, also from www.getfirefox.com:


    **The Web Developer toolbar.** Search for this toolbar in the Add-On Section of
    the site or go to https://mozilla.org/en-US/firefox/addon/60. This toolbar allows
    you to turn JavaScript and CSS on and off as you work, validate your HTML and
    CSS as you write, outline all the elements on the page to show their relationships,
    view a list of the ancestors of any element of the page, and much more. To me,
    my most indispensable feature is View Generated Source, which allows you to view
    markup that is dynamically generated by your JavaScript code as it runs.


    **Firebug.** Firebug provides JavaScript error reporting and allows you to insert
    breakpoints in the code so that at any point you can have the code stop running
    and see the state of all variables and objects in the JavaScript. I have mostly
    used alert dialogs in the examples when illustrating variable checking because
    it makes for nice simple screenshots, but Firebug is really a much better way
    to go once you are in serious development work. Check out www.digitalmediaminate.com/screencast/firebug-js
    for a good video tutorial on using Firebug.


    I haven''t attempted, and there isn''t room, to show and explain every line of
    code of every example. Instead, I focus on the parts of the code that illustrate
    the topic I am discussing at that point. However, what I have done is ensure that
    all the concepts illustrated in the code have been explained at some point, and
    that the code is well commented so you can understand it.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Feedback Is Welcome


    I know that despite my efforts and the dedicated team of people who have worked
    on this book, it may contain errors and omissions that you, my dear readers, are
    so adept at finding and reporting to me. I will post an errata that are found,
    so please report these to me on the Scriptin'' Web site. You are also welcome
    to write with comments, or to send me URLs of your work. I look forward to hearing
    from you.


    # Software-as-a-Service


    I think it''s clear that we are moving steadily to the point where "shrink-wrapped"
    software that is installed on the user''s computer will all but disappear. It
    will surely be replaced by Rich Interface Applications (RIAs) where the interface
    runs in the browser and the Web server manages access to a variety of real-time
    data sources. This change in how software is conceived, designed, and delivered
    allows applications to constantly evolve rather than being released in discrete
    versions, and gives designers and developers limitless scope when imagining and
    building new online experiences.


    The already well-established Software-as-a-Service (SaaS) model, which makes possible
    such companies as Salesforce.com and Zoho.com, gives users on-demand, pay-as-you-go
    access to RIAs where they formally had to make expensive investments in monolithic
    desktop software programs. For the foreseeable future, these new RIAs will be
    powered by JavaScript, and I hope that Scriptin'' will give you the knowledge,
    confidence, and inspiration to make your own contribution to this new and exciting
    era of the Web''s evolution.'
  merge: -1
