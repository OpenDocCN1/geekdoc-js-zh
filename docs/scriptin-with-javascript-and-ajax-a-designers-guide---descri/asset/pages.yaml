  md: "understand how to take advantage of this feature, you will be able to write\
    \ event handling code that is both versatile and compact.\n\n# # The Event Object\n\
    \nWhen a W3C event listener's event occurs and it calls its associated function,\
    \ it also passes a single argument to the function—a reference to the event object.\
    \ The event object contains a number of properties that describe the event that\
    \ occurred.\n\n**Table 4.2** lists the names of the most commonly used properties\
    \ of the event object, of course usually differ between the W3C and Microsoft\
    \ models.\n\n| W3C NAME | MICROSOFT | DESCRIPTION |\n|---|---|---|\n| e | window.event\
    \ | The object containing the event properties |\n| type | type | The event that\
    \ occurred (click, focus, blur, etc.) |\n| target | srcElement | The element to\
    \ which the event occurred |\n| keyCode | keyCode | The numerical ASCII value\
    \ of the pressed key |\n| shiftKey altKey cntlKey | | Returns 1 if pressed, 0\
    \ if not |\n|currentTarget | fromElement | The element mouse came from mouseover\
