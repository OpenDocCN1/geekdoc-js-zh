  md: '# SCRIPTIN'' WITH JAVASCRIPT AND AJAX CHAPTER 1


    PHP is a server-side language for generating HTML pages. PHP is written in text
    files with the extension .php. Such a page is known as a PHP script. A PHP script
    is a mix of HTML and PHP that generates HTML. Whenever you request a PHP script
    URL, a new HTML page is served back to you. So a PHP script can be thought of
    as a template that generates HTML page.


    In the case of this form, each time the form data (the email address) is submitted
    to the PHP script, PHP serves up a slightly different version of the HTML page
    to the browser based on whether the email is valid or not. If the address is invalid,
    the PHP code will add a message to the page requesting that the user try again;
    if the email address is valid, PHP will record it into a text file and add thank-you
    to the page.


    Let''s look at this process step by step. Writing a list of the tasks you want
    code to perform is a worthwhile, time-saving step to take before you write the
    actual code. I''ll often start my coding with a list of comments like this, and
    once I have them in the right order, add the actual code in between them.


    +   - The PHP script is requested the first time, and the HTML in the script (the
    layout of the form) is served back to the browser.

    - When the user submits the form, the data is submitted back to the same script.

    - PHP detects that the form data has been submitted.

    - PHP tests the email address and determines if the email is correctly formatted.

    - If the email address is valid, the email address is recorded in a text file
    on the server and the message text is set to the Success message.

    - If the email address is invalid, the message text is set to the Invalid Email
    message.

    - PHP writes the message into the HTML “message” element of the page and serves
    up the page to the user.


    Note that PHP is never sent to the browser—only the HTML that PHP generates is
    sent. Clicking the “Go!” button passes the form data to the same PHP script each
    time the form is submitted, and PHP will serve up one of two slightly different
    versions of the HTML page in response.'
