  md: '# Am I Writing HTML or JavaScript?


    At first, it''s easy to forget at any given moment you are writing JavaScript
    or HTML, especially when adding comments. It''s a common mistake to write JavaScript
    outside of the script tags where HTML is valid or to write HTML inside a script
    and then don''t work right. You just have to learn to change gears mentally to
    the right language for the right part of the page.


    # Data and Ways to Store It


    JavaScript classifies data into different types and offers different ways to store
    it. For your code to perform optimally, you need to understand and correctly use
    these options.


    # Variables


    Variables, as you saw in the 2+3 example earlier, are the locations in which you
    can store various kinds of data so your JavaScript code can act on them. That
    data might come from sources such as a form the user filled out or returned from
    an Ajax request to the server. A server could return data from its database, from
    a file on disc, or from an XML file far, far away across the Internet. Wherever
    your data comes from you, first put it in variables so your code can go to work
    on it.


    # NAMING VARIABLES


    You can give any variable name you want, but that name can''t begin with a number
    and it can''t contain spaces. It''s a good idea to give a variable name that makes
    sense when you and others read the code later, for example:


    ```

    var userName;

    var productId;

    var totalWithTax;

    ```


    These variables are written in a style called "camel case" where you join several
    words together to give a variable a meaningful name. Make the first word lowercase
    and capitalize subsequent words—without any spaces, of course. This will always
    give you a single easyToReadOneVariableName. This format is called camel case
    because of the visual humps created by the uppercase letters.'
