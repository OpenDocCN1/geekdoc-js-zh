  md: '# RIA Components


    RIAs are defined by the improved user interactions that they offer over the basic
    HTML interface components. First, they offer enhancements to a basic HTML interaction:
    search fields can be improved by AutoComplete functionality, tables by sorting
    and paging capabilities, and forms by easily adding validate-as-you-go feedback.
    Second, some interactions are "new" in as much as they cannot be achieved at any
    level simply with HTML—drag-and-drop and animation are two examples.


    Animations, such as grow, shake, and slide, when used appropriately, can help
    the user better understand workflows or the state of the data, Ajax interactions
    are changing the content without refreshing the page.


    As with Ajax, frameworks make implementation of RIAs much easier, and in this
    I''ll show how some of the most popular interactions are implemented in these
    frameworks. First, let''s look at Accordion.


    # Accordion with jQuery and Spry


    An accordion is a set of sliding panels where one is always open. Clicking a panel
    heading reveals the associated content, as shown in Figures 6.3 and 6.4. This
    can conserve real estate while showing the user that other content is available.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_208_0.png)


    FIGURE 6.3 The user is about to click the UI heading.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_208_1.png)'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'FIGURE 6.4 When YUI heading is clicked, it slides upward to reveal its content.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_209_0.png)


    Another aspect of an accordion, which is a valuable aspect of this component,
    is the playful feel that the user gets when a panel slides open to reveal new
    content. Engaging the user in the interface is a great first step to engaging
    that user in the content. If you run the code example, you will find that once
    you slide one panel, the desire to open all the others is almost irresistible.
    Of course, playful interactions should support and not be a substitute for meaningful
    content.


    # ACCORDION WITH JQUERY


    Here''s how to create an accordion with jQuery. This example is illustrated in
    Figures 6.3 and 6.4.


    ```

    <div id="Accordion1" class="accordion">

    <h3>one</h3>

    <p>Lorem ipsum...</p>

    <h3>two</h3>

    <p>Donec eget est...</p>

    <h3>three</h3>

    <p>Vivamus accumsan...</p>

    <h3>four</h3>

    <p>Pellentesque eget...</p>

    </div>

    ```'
