  md: '# About the Projects


    The first project is a very visual interface that uses a selection of jQuery components,
    whereas the second is more data driven and built on the Yahoo! User Interface
    (YUI) library.


    Unlike the preceding examples, both projects illustrated in this chapter combine
    a number of interactions and processes. Both offer progressive enhancement and
    work acceptably even if JavaScript is not present.


    Technically, both projects use PHP for the server-side coding and use file-based
    data sources as JSON and CSV (comma separated value) files. This means that you
    can run them with just a server that supports PHP although in reality both could
    be improved by the addition of a database. I have deliberately avoided the use
    of databases for these examples because I want to keep things simple to ensure
    that as many readers as possible can get the demo code running.


    Both projects also use a mix of HTML, CSS, and JavaScript on the front-end, and
    while their feature sets are not extensive, both are usable applications that
    are coded to professional standards.


    For this reason, if you are relatively new to Web development, these downloadable
    projects may seem a little daunting, but are heavily commented throughout. Taking
    the time to study these examples can help you improve your knowledge, better understand
    how applications are assembled, and write code that is concise, robust, and extensible
    in the future.


    It''s not my intention to go into detail on every line of code in these projects,
    but rather to discuss their features, the strategies for building them, and the
    areas of the code that are of particular interest. Before you start reading this
    chapter, I suggest you go to the *Scriptin''* Web site and play with the demos.
    Then as you read, open the related scripts for each project in a code editor.
    I have listed code filenames in the margin as I discuss them so you can see the
    parts of the code as I refer to them in their broader context.


    Most of all, I hope you will take these projects and modify them for your own
    needs. This is absolutely the best way to build your skills and become familiar
    with the demonstrated techniques.'
  merge: -1
