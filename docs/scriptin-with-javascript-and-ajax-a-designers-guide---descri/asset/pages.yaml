    FIGURE 3.8 The stripes are now added to the alternate rows.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_102_0.png)


    There are three interesting points I want to explain in this code.


    First, this example is a good illustration of JavaScript''s oriented nature. When
    I get the table elements, they are stored in an array-like node list object. This
    node list can be queried for its length, and each element of the node list can
    be queried for its properties using a loop.


    Second, also how theTables[i] (where i is the current counter value) can simply
    pass to another function. It''s reference to the object that contains that table,
    so the receiving function can immediately work on that table. You understand that
    you are passing around references to objects and can at any time access that object''s
    properties using objectName.propertyName syntax, reading and working with JavaScript
    gets much easier.


    Third, let''s examine the counter in the loop. When adding the class to the alternate
    rows, the loop uses i++ in the statement to increment its counter by one in the
    standard manner. However, in this case, because I only want to apply the class
    to every other row, I give the counter a second increment within the code. This
    causes the counter to be incremented by every time the loop runs, and the class
    is thereby added to every other row, not every row.


