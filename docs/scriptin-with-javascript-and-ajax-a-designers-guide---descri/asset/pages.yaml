    # Stylin'' the Tabs


    The tabs across the top of the content in the catalog example are the primary
    way that users that users will select the content they want to view. However,
    they are not just for navigating but also for orientation. Appropriately styled
    tabs can tell the user: "You are here." This is achieved by using a special style
    for the tab that relates to the currently displayed content. Each tab in this
    design is simply a styled li element of an unordered list. By using relative positioning
    in the CSS, I am able to move the tabs to their border align with the top border
    of the guitar_display div. I define a CSS class name choice, when added to a tab
    (li) will set the tab''s background color and its bottom border color to match
    the color of the content area. This results in a strong visual association between
    the content and the related tab. The tab actually looks li is part of the content
    area.

    Because this tab styling is already set up in the CSS, I simply code the PHP so
    that the choice class is added to the li of a tab when it is clicked.'
