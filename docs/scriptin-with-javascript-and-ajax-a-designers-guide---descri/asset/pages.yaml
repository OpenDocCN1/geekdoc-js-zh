  md: '# Communication with the Server


    The HyperText Transfer Protocol (HTTP) defines transactions between the browser
    and server are handled. While this protocol is pretty complex, in the scope of
    this discussion, you only need to understand the POST and GET methods, which control
    how the browser makes requests to the server.


    When I talk about the HTTP request method, I mean method as in "way of doing things,"
    not as in a "function in an object."


    # THE GET METHOD


    A request begins with an action that causes the browser to make either a GET or
    POST request to the server.


    A request, typically made when a link is clicked, is a URL with a query string,
    like:

    `display_product_info.html?productID=45034A&colorpref=red`


    The query string (highlighted) is separated from the rest of the URL with a question
    mark. It consists of a name/value pairs separated by ampersands that are passed
    to the requested page. This name/value pairs serve the same purpose as the arguments
    passed to a function; they contain data that the requested page will use when
    processing the request.


    The entire GET request string is visible in the browser''s address bar, and it''s
    tempting for users to modify the query string to see what they might get (a different
    user''s account, perhaps?) This means it''s important to only use GET when the
    user is requesting nonsensitive information—a particular news story, for example.


    # THE POST METHOD


    A POST request is typically made when a form is submitted. If you look at the
    markup for a form, you''ll notice that the method attribute is almost always POST.
    For each field of the form, the name attribute and the data entered in that field
    are passed as the name/value pair. However, while the URL is visible in the browser
    address bar, the name/value pairs are sent behind the scenes to the browser and
    are not visible in the address bar.


    As a rule of thumb, if you are sending data that will be recorded on the server,
    use POST. If you are simply requesting a page, use GET.


    > There is typically a limit (depending on browsers and proxy servers) of 1024
    characters in a GET URL.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_153_0.png)'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# THE TRADITIONAL MODEL


    Under what I''ll call the traditional model—the only model prior to Ajax—the data
    is passed to the server via a POST or GET request and is then processed by the
    middleware (such as PHP, .NET, or Java). A new Web page is generated and sent
    back to the browser in response.


    The downside of the traditional model is that no user activity can take place
    between the request being submitted and the new page being entirely rendered in
    the browser. Once that link is clicked or the form submitted, the user must wait
    for that new page to display.


    Even though a slow response can result in frustration and random clicking on the
    part of the user, the synchronous nature of the traditional "click-and-wait" model
    is very familiar and comfortable to the user.


    # THE AJAX MODEL


    When an Ajax request is made to the server, again using a POST or GET request,
    it is made via the browser''s XHR (XMLHttpRequest) object, which I will discuss
    in detail in a moment. The XHR object is the key to the Ajax because it acts as
    an intermediary between the server and the user. Actually initiating an Ajax request
    by calling the XHR object takes a matter of milliseconds, and control is returned
    to the user while the XHR object fulfills the request, as shown in Figure 5.1.
    Because the request is now happening "in the background," the user can continue
    working as the XHR


    Figure 5.1 Unlike a traditional request where the user must wait until a new page
    is rendered in the browser, an Ajax request returns control to the user as soon
    as the request is made, without waiting for a response.


    | Traditional round-trip request | Ajax-enabled request |

    | :--- | :--- |

    | WEB SERVER | WEB SERVER |

    | | XHR |

    | BROWSER | BROWSER |

    | Time elapsed until user regains control of the page |


    However, the most significant advantage of Ajax is it that you can request specific
    data, not just an entire page, as a response. For example, the user could add
    an item to a shopping cart and, instead of waiting while the server is updating
    the cart status, the user could do more shopping and add a second item. Once the
    server update is'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'complete, the server could return just the text needed to update the onscreen
    cart display, and this text would then be added into the page using DOM scripting
    without a refresh of the page. With data able to flow into the browser in this
    and the necessity for constant page refreshes removed, a Web site can be transformed
    into a responsive online application. This is why Ajax has created so much excitement
    in the Web development community.


    # The XMLHttpRequest Object


    Ajax is made possible because of the browser''s XMLHttpRequest (XHR) object. The
    XHR object can make requests to the server and receive data in response. It was
    developed as part of ActiveX strategy to enable its mail products to communicate
    with a mail server. This was only recently made part of the official W3C standard,
    even though it has well supported in all the major browsers for several years.
    Microsoft''s implementation of the XHR object is different from the implementation
    in W3C browsers, as with the event you saw in Chapter 4, cross-browser compatibility
    issues exist. Fortunately, the popularity of Ajax ensures that these issues have
    been thoroughly addressed by the many helper functions and frameworks that are
    available. You will rarely, ever, have to concern yourself with the XHR object''s
    differences between the browsers. However, even though these helper functions
    and frameworks exist, it is useful to understand how the XHR object works, so
    I''ll now show you how to write an Ajax helper function that talks to the XHR
    object.


    Note on Demo Ajax Function

    While the ajax_request.html code I''ll show in in this section of the chapter
    works in all modern browsers and serves the purpose of demonstrating the concepts
    of how Ajax is made, it is not industrial strength. It has no capability to really
    judge old browsers that don''t have an XHR object. Also, there is no handling
    for the possibility of an HTTP status of 304 being returned, meaning that the
    document is already cached on the computer''s and the user will get that instead
    of data from the server.


    If you want a robust Ajax function that you can use on a site by putting into
    production, it is best to use one of the many frameworks that offer Ajax capabilities.
    If you don''t want to use a framework, try simpleXHR, written by Scriptin''s technical
    editor Chris Hermann—you will find it in Chapter 5 code It overcomes the technical
    shortcuts associated with the demonstration Ajax function in this example is but
    more difficult to understand. However, with other helper functions, you don''t
    have to understand it to use it, and it accepts the same two arguments as the
    demonstration ajax_request.html example.'
