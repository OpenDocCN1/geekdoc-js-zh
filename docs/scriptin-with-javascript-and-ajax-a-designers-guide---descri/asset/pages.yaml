- img_proc: true
  md: 'Before Ajax and RIAs, all the processing power used in a Web site was on the
    server side. The browser simply collected the data to be sent to the server and
    rendered the pages with which the server responded. In contrast, the interface
    of a RIA runs on the client side in the browser, and can therefore make full use
    of the capabilities of the modern browser as an application platform and the ever-increasing
    horsepower of the user''s computer.


    Our users now have the front end of the application and formidable computing power
    to run it, right where all regular applications run—on their computers, not on
    the other side of the Internet. The server, now directly accessible to the browser
    via Ajax, takes a more focused role as the real-time processor and supplier of
    the application''s data.


    This redistribution of responsibilities, with the work equally and appropriately
    shared between client and server, gives you, the Web designer, a new, more powerful
    model for imagining and developing Web sites.


    The brave new world of RIAs is driven by JavaScript. It''s the language in which
    the client-side code of today''s Web applications is written; it controls the
    interface and directs the activities of the server. JavaScript, formerly lurking
    in the wings as a poor cousin to HTML and CSS, and used mostly for browser-side
    data validation and simple animation effects, is now center stage. The key for
    you to open the creative and engineering doors to the potential of this new Web
    development model is to master JavaScript.


    In the rest of this chapter, you will learn how to plan the coding of your pages
    so they can be readily enhanced with Ajax, and thereby transform your site into
    a more application-like experience.


    # Accessibility and Progressive Enhancement


    Before I discuss JavaScript and Ajax, I''ll tell you about accessibility—in all
    its meanings. It is very easy when designing a RIA Web site to make it entirely
    dependent on JavaScript for its operation, but a site can cause severe problems
    for many users. That super-cool, drag-and-drop feature is useless to someone who
    is physically disabled and cannot use a mouse or who relies on an aerial screen
    reader because of poor eyesight.


    Also, some people use old browsers and low-powered computers that cannot support
    the technical capabilities required to experience'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'your RIA, or they simply have JavaScript turned off because of perceived security
    risks. This is also an issue of accessibility.


    A common response to a suggestion that a Web site should be accessible: "Oh


    Rather than get into a heated debate, my position on accessibility is this: If
    you make the decision from the get-go, it is totally feasible to create a site
    that offers a rich user experience for fully capable users and browsers, and a
    more simple but completely usable experience for the less empowered.


    In short, if the user doesn''t have JavaScript turned on or the browser doesn''t
    support the modern JavaScript that operates on the W3C (World Wide Web Consortium)
    version of the Object Model (DOM), the site can still function. And this is no
    trivial number of users we are talking about here. Six percent of all users don''t
    have JavaScript running in their browsers (*The Counter, Feb. 2009 Global Stats*)
    for security or other reasons, which is a significant percentage of users to exclude
    from your site.


    The methodology that enables you to offer appropriate, but always functional,
    experiences for all users is called progressive enhancement. If compliance with
    Section 508 of the Americans with Disabilities Act, the desire to reach or simply
    your conscience demands it, you can, build a JavaScript-driven RIA that still
    provides its essential functionality without JavaScript.


    However, it should be noted that despite the best intentions, JavaScript-driven
    interface interactions (and drag-and-drop is a very example) don''t degrade nicely
    to regular HTML components when JavaScript is not present. If you want your site
    to be accessible, you may have to forgo such components for even your most empowered
    users, or provide an alternative non-JavaScript means of completing that task.
    In the latter case, JavaScript normally handles the alternate HTML component;
    if JavaScript is not present, the HTML component is displayed.


    What I (and the accessibility community) am suggesting is that you plan your site
    so that it can work without JavaScript if JavaScript is not available. In this
    chapter, I''ll show you a simple form imple'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'JAVASCRIPT COMES AGE


    mented with HTML and PHP; and later enhance it with Ajax, so it works with and
    without JavaScript. You''ll have to decide if this “maximum accessibility” approach
    is one you want to take—I hope it.


    A lot of advice is available on the Web about this subject, and you can find it
    by searching for Accessible Ajax or progressive enhancement. The W3C has an interesting
    initiative called ARIA (nice acronym) to address accessible RIAs through special
    markup and techniques, and Yahoo''s YUI team, and the Dojo and jQuery framework-developers
    are amongst those who are adopting its recommendations. In his succinct and excellent
    book, Bulletproof Ajax (New Riders, 2007), Jeremy Keith offers this advice to
    those who would make their sites as accessible as possible: “Plan for Ajax first,
    implement Ajax last.” But how do we do that?


    # Three Steps to Progressive Enhancement


    The steps to making an application that runs with or without JavaScript are based
    on layering enhancements onto the basic functionality of the site.


    +   1. **Make it functional.** Get the site working with just an HTML front end
    and the server technology of your choice (PHP .NET, Java, etc.).

    2. **Make it look good.** Style the HTML with CSS in external style sheets (linked
    to the page with LINK elements).

    3. **Enhance the experience.** Add interface behaviors that provide more intuitive
    responses and controls, and provide Ajax connectivity to enable “no-page-refresh”
    access to the server-side functionality.


    If you think in this layered fashion, then should suddenly find itself in a no-JavaScript
    environment, it will fall back to the old “round-trip” model of sending data to
    the server and waiting for a page to be served back in response. The user won''t
    know the difference; the site will still be nicely styled, and it will still work.
    In an even more limited environment, where neither CSS nor JavaScript are supported,
    the site, looking rather less attractive happens, will still function. As long
    as users have the capability to support just HTML, they will be able to use your
    site.


    The rest of this chapter illustrates with a simple example to create a site that
    is based on the first two steps to progressive enhancement and is ready for JavaScript
    interface interactions and Ajax


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_24_0.png)'
