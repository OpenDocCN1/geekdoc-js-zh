    # IMPLEMENTING THE MOUSE WHEEL FUNCTIONALITY


    Enabling the user to scroll the carousel from the wheel (and even my Mac has one
    these days!) allows very fast movement of the carousel, which is useful if it
    contains a large number of elements. With jQuery Tools, wheel functionality for
    the carousel is simple to implement. As long as you use the class scrollable for
    the carousel''s main containing div (as I do here), I can simply add the jQuery
    wheel plug-in to my page with a script tag as I did earlier, and the wheel scrolls
    the carousel (if you also have the mouse over the carousel) without any further
    coding. This is because control of a div named scrollable via the mousewheel.js
    code is already built into the jQuery Tools Scrollable component.


    # IMPLEMENTING THE NAVIGATION ARROW BUTTONS


    Two arrows below the carousel also enable the user to scroll. The navigation arrows
    markup is simply two links with the classes prev and next, respectively. The size,
    position, and background graphics—the arrow icons—are all controlled by the CSS
    in the style sheet called carousel.css. I''ll make two comments on these navigation
    arrows.


    The first comment is about the rollover effect, which turns the arrows from blue
    to a tan color when the mouse moves over it, it is implemented using a technique
    called image sprite—the sidebar, "About Image Sprites." Both states (sprites)
    of each arrow, normal and hovered, are in one file, as shown in Figure 7.9.


    The graphic in Figure 7.9 is used as the background for the first arrow''s a link.
    The link''s height and width are exactly the same as one of the arrows, so the
    other arrow doesn''t show offscreen. The CSS :hover setting for the links simply
    moves the hovered link graphic 35 pixels when the user mouses over it, bringing
    the hovered state of the graphic into view.'
