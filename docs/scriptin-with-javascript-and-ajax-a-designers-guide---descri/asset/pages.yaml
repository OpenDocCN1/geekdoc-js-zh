    \  size: 3,\n  items: '#thumbs',\n  hoverClass: 'hover'\n});\n```\n\nIn this code\
    \ that invokes the jQuery Tools Scrollable component, I get the containing element\
    \ for the scrollable elements—the div with the class scrollable—assign the scrollable\
    \ method to it. I also pass this configuration object with three properties. Its\
    \ properties define:\n\n+   - The size of the visible part of the carousel in\
    \ terms of images that are visible at any given moment. This information lets\
    \ the Scrollable component keep track of the position of the carousel so a clicked\
    \ item can be brought to the center. It also allows the component to calculate\
    \ \"paging\" moves; that is, moving the carousel to the next set of three images.\
    \ Paging functionality that I have not enabled in this project, but it's simple\
    \ to implement—check the jQuery Tools documentation for details."
