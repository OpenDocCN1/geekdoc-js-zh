  md: '# 3. Enhance the Experience with JavaScript and Ajax


    Now we come to JavaScript. I''ll end this chapter with an overview of how JavaScript
    and Ajax are used to enhance the user experience. In Chapter 5, I will return
    to this email form and use JavaScript to create an Ajax interaction with the server
    so I can validate the email address using the PHP code on the server before the
    user submits the form.


    Let''s start with three simple ideas: JavaScript is a powerful coding tool, DOM
    scripting capable, and is Ajax capable.


    # A POWERFUL CODING TOOL


    JavaScript is a full-featured scripting language that runs in the user''s browser.
    It lets you manage data in variables, arrays, and objects, and write code logic
    that is common to every programming language, as if-then-else, that allows you
    to infuse your code with decision-making capabilities. You can write code in either
    a procedural, step-by-step style—where each line of code is executed sequentially—or
    in an object-oriented style—where objects composed of properties and methods (variables
    and functions) can communicate with one another to accomplish the work of the
    program. In reality, your script will be a mix of both. You will learn about these
    concepts in Chapter 2.


    Unlike wellknown, industrial-strength programming languages like C# (c-sharp)
    and Java, JavaScript does not need to be compiled (that is, processed into low-level
    machine code) before it can run. This makes it easier to test your code as you
    write—just open it in a browser and run it. Because it does not get compiled,
    JavaScript is known as a scripting language, not a programming language. PHP is
    also known as a scripting language for the same reason. However, with today more
    powerful computers, being compiled no longer gives a programming language such
    a big advantage over a scripting language.


    Being a powerful and robust scripting language is only part of JavaScript''s appeal.
    Where it shines is in the area of DOM scripting.


    # DOM SCRIPTING CAPABLE


    As the name suggests, DOM scripting is JavaScript''s capability to manipulate
    the DOM and dynamically change the content and appearance of the page as the user
    interacts with it.


    > Java and JavaScript are not related in any way, except that they are used to
    program computers. Their relationship, or rather lack thereof, was summarized
    in one infamous blog comment, which read: "Java is to JavaScript as car is to
    carpet."'
