  md: '# AutoComplete and Maps with the Yahoo! API


    The Ajax request, the building of the HTML from the JSON, the opening of the overlay
    usually happens in a matter of a second or two, even though it''s taken several
    pages here to describe how it works.


    Clicking the close button, pressing Escape, or clicking outside of the overlay
    causes the overlay to close, so the user can make another choice. Again, as long
    as the close button is graphic (or the background element of) an element with
    the class close, this functionality is automatically provided by the Overlay component.


    This covers the key functionality of the Author Carousel project. Now I''ll show
    you the AutoComplete example that uses the YUI framework and Yahoo! Maps.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_250_0.png)


    Without a doubt the most comprehensive JavaScript library in existence is the
    Yahoo! User Interface (YUI), which is a layered framework of components for just
    every task that your interface might need to handle. At its foundation is the
    YUI Core, which is required for all components, the DOM collection for managing
    the DOM, and the Event utility, which simplifies the management of events. On
    top of this foundation, you can run a variety of interactive widgets—from tables
    and calendars to sliders and text editors—and a variety of animation, cookie management,
    and much more. There are also development tools to help you write your application
    and help to lay out and style your pages.


    In this project, I will use the AutoComplete widget to enhance a search form to
    help users find Yahoo offices around the world. AutoComplete is well suited to
    a multi-element data set like this, where the user might know only the street,
    city, or where the office is located. By typing any of these bits of information,
    the AutoComplete can search the data and provide suggestions to help the user
    make the right choice.


    You will also see how to use the Yahoo! Loader utility, automatically loads the
    correct supporting files for each YUI widget, and the Yahoo! Maps API, which will
    display a map of the selected location.'
