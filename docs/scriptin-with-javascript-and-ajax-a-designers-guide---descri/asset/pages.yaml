  md: "What if a third-party library that you are using also happens to define an\
    \ addOption function within the global scope? Suddenly, those menus in the forms\
    \ that the library is rendering for you don't work any longer. This is because\
    \ there are two functions in the same namespace with the same name, whichever\
    \ function loads last is the one that’s used for all scripts. It very easy to\
    \ accidentally override the functionality of the library by defining a function\
    \ in global scope with the same name, especially if a number of people are working\
    \ on a project and creating arbitrary function names as they go.\n\nNamesacing\
    \ fixes this problem by scoping functions within constructs that avoid naming\
    \ conflicts. You achieve namesacing in JavaScript by placing the functions within\
    \ an object literal.\n\n```\nvar thirdPartyLib = {\n  addOption : function(elementName,\
    \ value, txt) {\n    var selectBox = document.getElementById(elementName);\n \
    \   var option = new Option(txt, value);\n    selectBox.options[selectBox.options.length]\
    \ = option;\n  }\n\n}\n```\n\n```\nvar CWS = {\n  addOption : function(element,\
    \ value, txt) {\n    var option = new Option(txt, value);\n    element.options[element.options.length]\
    \ = option;\n  }\n}\n```\n\nYou then invoke the functions with the fully qualified\
    \ name, like this:"
