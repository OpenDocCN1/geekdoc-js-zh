  md: '# Two Meanings for Getters and Setters


    "Getters and setters" is also the name of an advanced JavaScript technique that
    John Resig describes as allowing you "to build useful shortcuts for accessing
    and mutating data within an object." When you are ready for a little mutating


    parent element. For this reason, you must be sure you are accessing the element
    you and not white space. It is quite simple to check, as


    ```

    If (nodeType==3) { /* move to another node */ }

    ```


    return true if the node is white space. Later you''ll see how you move to an adjacent
    DOM element if this is the case.


    A set of DOM-related methods—known colloquially as getters and setters—allow you
    to access the nodes.


    You can access an element node with a getter, and then you can access the properties
    of it and its child elements, including the attribute and text nodes. You can
    also traverse (move around) the DOM to get nodes relative to the one you currently
    have. Have "got" the node you want, then you can modify that node or add a new
    one in a location relative to it using the DOM methods known as setters.


    To get a node and put it into a variable, you need some kind of definitive reference
    to find it. This reference is often an ID attribute. As those of you who have
    read my book Stylin'' with CSS (New Riders, 2008) will know, I strongly advocate
    dividing a page''s markup into sections using div (division) elements and giving
    each an ID. Because you are only allowed to use an ID name on a page, IDs provide
    CSS with a unique reference, or hook, to the div and its child elements. Using
    this reference, CSS can be targeted accurately at the desired elements. IDs serve
    exactly the same purpose for JavaScript. The difference is that when using JavaScript,
    IDs enable you to get an element along with its child elements and store it in
    a variable so you can manipulate it. Let''s see these ideas in action.


    Internet Explorer, unlike most other browsers, does not treat white space in the
    document as nodes.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_86_0.png)'
