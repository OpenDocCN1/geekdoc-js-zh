    \  if (ajaxObj.readyState == 4 && ajaxObj.status == 200) {\n    cbFunc(ajaxObj.responseText);\n\
    \  }\n};\n```\n\nWith monitoring now in place for the request, you are all set\
    \ to make the request for the data you want.\n\n# 3. SEND THE REQUEST VIA THE\
    \ XHR INSTANCE\n\nThe first decision you need to make when requesting data is\
    \ the method to use to make the request—GET or POST.\n\nUse the request method\
    \ GET if you just want to get data from the server or POST if you want to update\
    \ data on the server. I'll first show you GET request process.\n\n**Sending a\
    \ request with GET.** A GET request requires the use of two methods of the XHR\
    \ object: open and send. The open method allows you to specify the kind of request\
    \ method (GET or POST) you want to make, the name of the file you are requesting,\
    \ and a Boolean value that defines whether you are making an asynchronous or synchronous\
    \ request. Here is the format:\n\n```\nobjName.open = (requestmethod, URL, asynchronous?)\n\
    ```\n\nIf you set the third argument to false, the application will stop running\
    \ until the request is fulfilled, defeats one of the key benefits of Ajax. Almost\
    \ always you will set this third argument to true that the user can continue working\
    \ while the request is fulfilled. There are additional optional parameters besides\
    \ these, and you can learn more about them at www.w3.org/TR/XMLHTTPRequest/#xmlhttpRequest\n\
    \nThe name of the file is simply a URL, and I am using GET, can be extended with\
    \ a query string of name/value pairs. A GET request might look like this:\n\n\
    ```\nmyAjaxObj.open = ('GET', 'lookupUserInfo.php?username=ajaxSripter&email@scriptwithajax.com',\
    \ true)\n```\n\nNow that your request is defined, you can send the request to\n\
    \n```\nmyAjaxObj.send(null)\n```"
