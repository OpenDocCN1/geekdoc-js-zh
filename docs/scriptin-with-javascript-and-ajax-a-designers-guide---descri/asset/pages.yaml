  md: "# Applying Styles with JavaScript\n\nHere's a little more detail on adding\
    \ a style attribute to an element. If you were to manually add a style to the\
    \ element in the HTML, you could write\n\n```\n<p id=\"MyPara\" style=\"font-weight:bold;\\\
    >Here is some bolded text</p>\n```\n\nAlternatively, the highlighted code can\
    \ be added using JavaScript like this:\n\n```\ndocument.getElementById(\"MyPara\"\
    ).setAttribute(\"style\", \"font-weight:bold\");\n```\n\nHere, I format the style\
    \ declaration (property/value pair— highlighted) as I would write it if adding\
    \ the style manually. However, because setAttribute is not reliable in IE6, I\
    \ use the dot syntax to add a style to a line that is understood by both W3C DOM-compliant\
    \ and IE browsers.\n\n```\nmyElement.fontWeight = \"bold\";\n```\n\nNow, instead\
    \ of using JavaScript to write some CSS into the markup, I am setting the property\
    \ via JavaScript. When I use JavaScript in this way, I change the format of the\
    \ property name (highlighted), converting the hyphenated CSS format font-weight\
    \ to its JavaScript camel equivalent fontWeight. When using dot syntax to styles,\
    \ I can, in almost every case, simply change the hyphenated CSS name to the camel\
    \ case and get the right format for the property name. The exception is\n\nexample).\
    \ These are styles for links (the a tags) and the contextual class of important_links.\n\
    \n![](img/ae7d82232d0a9673413a1d784d82b4e0_94_0.png)\n\nFrom a performance perspective,\
    \ this approach also helps avoid looping through a large list of links, table\
    \ rows, or whatever you are working on, and adding classes to each one, which\
    \ can be very slow.\n\n```\n.important_links {\n  font-weight:bold;\n}\n.important_links:hover\
    \ {\n  color:#666;\n}\n```\n\nWhen I add the important_links class to the containing\
    \ div, all links within it will immediately be affected by this CSS. Because the\
