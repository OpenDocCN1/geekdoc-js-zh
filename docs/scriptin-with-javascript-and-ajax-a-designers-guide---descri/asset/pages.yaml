  md: '# Summary


    In this chapter, I''ve shown some examples of four popular frameworks. There are
    many other excellent frameworks that I have chosen. I can only recommend that
    you explore the examples and documentation on each framework''s respective Web
    site and and start to build with them to discover which one is right for you.


    I''ve only shown the most basic implementation of the various interactions I''ve
    illustrated in this chapter rather than real-world uses. For example, in reality,
    if the user sorts a list using drag-and-drop, your code then needs to be able
    to determine the new order and provide appropriate responses.


    To show you more real-world use of frameworks and coding techniques, in the next
    and final chapter, as I did in Stylin'' with CSS (New Riders, 2008) and Codin''
    for the Web (New Riders, 2007), I''ll pull together many of the ideas you have
    seen so far in this book into two simple but functional RIAs.'
