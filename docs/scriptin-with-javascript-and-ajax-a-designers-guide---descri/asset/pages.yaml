    # Comments


    It''s worth taking the time to put comments in your code so you know what code
    is meant to do when you or someone else works on it in the future. Comments are
    entirely ignored by JavaScript and are simply meant to be read by anyone looking
    at the code.


    A single-line comment starts with //


    // this is a comment


    Everything after the // is ignored by JavaScript until a new line starts, so you
    don''t need to explicitly end a single-line comment—just start a new line. Often,
    you will add a single-line comment after a code statement on the same line:


    ```

    var myFavAxe; // my favorite guitar

    ```


    You can also write a multiline comment, which starts with /* and ends with *.


    A multiline comment might look something like this:


    ```

    /* This next piece of code handles any errors.

    Errors will be written into the error array.

    Errors are processed after all tests are completed. */

    ```


    If you want to prevent the execution of a number of lines of code within a script
    temporarily, perhaps while you are troubleshooting a problem, you can simply enclose
    that code in a multiline comment.


    Also, if you want to strip out comments to "minify" the scripts before you put
    them into production, use a tool such as Douglas Crockford''s JSMin (www.crockford.com/javascript/jsmin.html).


    Now it''s time to look at the ways in which JavaScript can store data.'
