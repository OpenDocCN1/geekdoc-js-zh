    \  $('div.scrollable').css('overflow-x', 'hidden');\n});\n```\n\nThis highlighted\
    \ code since simply overrides the related settings in the style sheet.\n\n# IMPLEMENTING\
    \ THE SCROLLING FUNCTIONALITY\n\nThe carousel will have a number of interactions\
    \ associated with it; scrolling will be possible using the mouse wheel, onscreen\
    \ arrows, or clicking. Clicking on any image will move it to the center position\
    \ if it's not already and pop up the overlay with the author's description in\
