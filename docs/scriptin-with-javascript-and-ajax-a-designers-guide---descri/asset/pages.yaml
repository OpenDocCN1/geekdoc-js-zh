  md: '# Objects


    There are numerous advantages to using objects in your coding work. The primary
    advantage is that they provide a high level of organization to your code. If you
    try to write anything without using objects, you will soon find that you have
    numerous functions that call one another and you''ll find yourself-playing "passing
    the parcel" with the arguments as you move from function to function. The code
    gets hard to read, because it becomes difficult to see which functions relate
    to which task. It is much easier to take the variables and functions that relate
    to a particular task and package them into an object.


    An object is a named collection of variables and functions. To indicate that they
    are part of an object, a variable inside an object is known as a property, and
    a function inside an object is known as a method.


    You access an object''s properties and methods with "dot syntax," which separates
    elements with dots (periods) and looks like this:


    ```

    objectName.aPropertyOfTheObject;

    objectName.aMethodOfTheObject();

    ```


    You will see dot syntax a great deal in this book. As mentioned earlier, everything
    in JavaScript is an object, or at least can be treated as an object, and accessed
    with dot syntax.


    However, you can also use the array syntax to access an object. You would do this
    when you need to select the property to read based on some condition in your script
    and don''t want to hard-code the property name in your script. In that case, you
    can use a variable as the property name, in this format:


    ```

    var theProperty = changeableValue

    objectName[theProperty];

    ```


    There are two types of objects: predefined objects that already exist as part
    of the JavaScript language ready for you to use, and user-defined objects that
    you write yourself for some purpose specific to your application.'
