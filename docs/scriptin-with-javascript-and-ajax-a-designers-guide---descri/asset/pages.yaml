  md: '# # DOMinating the Document


    Now let''s look at an object you will work with extensively—the DOM—and see how
    it can be manipulated with a JavaScript technique called DOM scripting.


    Much of the logic of your DOM-related code will go something like this: "Find
    the HTML element with the attribute ''x'' and add a paragraph after it with the
    text ''blah,..." Your ability to access an easy-to-get element such as an ID,
    move up or down the DOM from the one you actually want, and modify that element
    in some way is key to achieving DOM mastery.


    The DOM is a tree-like hierarchical representation of the elements, attributes,
    and text of an HTML document, collectively as the document''s nodes. When you
    use DOM scripting to modify a variable part of a document, such as the text of
    a paragraph, change is immediately visible onscreen. Using the techniques you''ll
    learn in this section, you can rewrite any part of the document''s HTML and change
    the appearance of the document for your users.


    Before I show you some DOM scripting examples, I''ll mention that the way in which
    browsers provide access to a document''s elements has changed over time, as those
    of you who worked years ago with Netscape will know. Today, W3C''s DOM model has
    become the facto standard of accessing the DOM. All modern browsers use it, and
    I will focus on it. That, Internet Explorer (6, 7, and 8) still has many incompatibilities,
    and I will discuss a number of these and show you how to work around them.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_85_0.png)


    Other tag-based document types, such as XML, also define a DOM and can be manipulated
    by JavaScript in the same manner as I demonstrate in this section using an HTML
    document. There will be examples of XML in Chapter 5, "Ajax."


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_85_1.png)


    A must-bookmark reference on the various browsers'' JavaScript capabilities in
    the Compatibility Tables at QuirksMode.org (www.quirksmode.org/compatibility.html).


    # ## Getting Around the DOM


    The DOM is a tree of linked nodes. There are three types of nodes: HTML elements,
    element attributes, and text within elements, which rather confusingly includes
    the white space between HTML elements created by the formatting of your code.


    If you add white space between two li (list items), by pressing Return and then
    indenting the next line a few spaces, that white space is contained within the
    parent ul and is a child of that'
