  md: '# DECLARING A VARIABLE


    When you first declare (create) a variable, you should put var in front of it,
    as shown in the three examples in the preceding section. In all future references,
    you can simply use the variable name. If you do not use var, you create a variable
    with global scope, which you usually do not want to. I''ll discuss in more detail
    when I introduce functions later in the chapter.


    In the previous three variable examples, I didn''t use the equals sign to set
    these variables to a value, their current value would be "undefined"—meaning not
    set to any value. Undefined should not be confused with 0, which is the variable
    zero. Sometimes you want to create an undefined variable so it is ready to receive
    a value that is generated by your code.


    However, you can declare (create) and set (put something into) a variable in a
    single step. The contents of a variable are known as its value, and when you reference
    a variable in your code, JavaScript effectively replaces that with the variable''s
    value. Both these points are demonstrated by this simple, two-line example:


    ```

    var myNickname = "Charlie";nalert(myNickname);

    // displays Charlie

    ```


    Now that you have a basic understanding of variables, let''s look at the different
    data types variables can contain.


    A variable can contain any of the following data types:


    +   - a string

    - a number

    - a Boolean (true and false, or 1 or 0)

    - an array (a group of related variables)

    - a function

    - an object


    Let''s take a look at each of these data types.'
