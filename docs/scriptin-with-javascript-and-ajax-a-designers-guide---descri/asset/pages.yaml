    This data will be used to supply matches for the AutoComplete display and for
    the full display of search results, including use of the longitude and latitude
    data to display a map of the selected location.


    # The Project Template—index.php


    An interesting aspect of this project is that there are three pages that can be
    displayed, they are all generated from a single PHP "template" that acts as a
    container to load other scripts. This project has a script to read the JSON files,
    another to display the search form, and another to display the search results;
    all are included in the index.php page as needed. As you will see, the logic coded
    within the template page determines the condition under which a particular script
    is included.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_251_0.png)


    If you want to quickly find the exact longitude and latitude coordinates of a
    street address, visit GPSVisualizer at www.gpsvisualizer.com/geocoding. To integrate
    this capability into an application, use the Yahoo! Maps API at developer.yahoo.com/maps.


    This kind of modular page strategy enables key functionality to be added into
    pages and the codebase into discrete and easily managed blocks. If a certain aspect
    of the design changes—perhaps a database will be used instead of JSON files—all
    that''s required is to update one script that reads the data and then every page
    that includes that script is updated too. You'
