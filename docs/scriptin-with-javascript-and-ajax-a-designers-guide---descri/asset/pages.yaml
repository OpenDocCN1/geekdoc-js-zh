    I will now show you how this markup is styled to create the onscreen carousel.


    The two primary HTML elements of the carousel (highlighted) are div.scrollable
    and div#thumbs. In the CSS, the width of div.scrollable is set to 300 pixels,
    exactly wide to display three carousel items; the width of its child div#thumbs
    is always just enough to contain all the carousel items. You''ll see the width
    of div#thumbs determined in a moment.


    The CSS for this project is contained in two files: carousel.css, which has all
    the CSS except rules specific to the overlay. The overlay rules are in overlay.css.


    If you look at the carousel.css, you will observe that div.scrollable is the positioning
    context for div#thumbs; the former''s position is set to relative, and the latter''s
    property is set to absolute. This means that when the user scrolls the carousel,
    div#thumbs moves with respect to div.scrollable. The individual items within div#thumbs,
    each in a div div#thumbContainer, move as one unit. This relationship is illustrated
    in Figure 7.5.


    FIGURE 7.5 The div.scrollable element acts as a mask through which a part of the
    strip of images is viewed. The div.thumbContainer are spaced apart in this diagram
    for clarity, but in reality there is no horizontal space between them.


    | div#thumbs | div.scrollable | div#thumbContainer |

    |---|---||

    | | | |


    The CSS of this styling is that div.scrollable becomes a mask behind which div#thumbs
    slides from left to right, in this way only three items are visible at any given
    time. To better understand what is happening, temporarily remove the CSS style
    position:relative from div.scrollable to see div#thumbs pop out of the div.scrollable
    mask. Then it will position relative to the default positioning context body,
    and you will see the entire strip of 11 items


