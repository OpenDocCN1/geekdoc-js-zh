  md: '# IN A MODERN WEB SITE


    or browser-based application, JavaScript''s primary purpose is to provide responses
    to the user interactions with the interface, or to be more technically precise,
    to handle events that are triggered by user actions.


    Events are messages that the browser fires off in a constant stream as the user
    works; for example, every time the user moves the pointer over an HTML element,
    clicks the mouse, or moves the cursor into a field of a form, a corresponding
    event message is fired. JavaScript receives these messages, but does nothing unless
    you provide an event handler that provides a response to them.


    Your ability to write code that can monitor and respond to the events that matter
    to your application is key to creating interactive interfaces.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# SCRIPTIN WITH JAVASCRIPT AND AJAX - CHAPTER 4


    To make your application respond to user action, you need to:


    +   1. Decide which events should be monitored

    2. Set up event handlers that trigger functions when events occur

    3. Write the functions that provide the appropriate responses to the events


    You''ll see the details of this process throughout this chapter. For now, just
    get the idea that an event, such as click, is issued as the result of some specific
    activity—usually user activity, but browser activity such as a page load—and that
    you can handle that with an event handler. The event handler is always the name
    of the event preceded by "on"; for example, the event click is handled by the
    onclick event handler. The the function provides the response to the event. Table
    4.1 lists the most commonly used event handlers.


    # Techniques to Handle Events


    In this section, I''ll show you four techniques that you can use to trigger JavaScript
    functions in response to events. The first two require adding JavaScript into
    the markup, so I try to avoid them, preferring techniques where event handlers
    are programmatically added and removed from elements as needed. In small projects,
    such as simple Web sites, the first two techniques work just fine, but with important
    caveats that I will discuss for each one.


    # JavaScript Pseudo Protocol


    If you have worked with JavaScript in past years, you may have used the JavaScript
    pseudo protocol to trigger a function from a link:

    <a href="javascript:someFunctionName();">Link Name</a>


    When the user clicks the link, the function someFunctionName is called. No onclick
    is stated; this simply simply replaces the value. The problem with this approach
    is that it completely replaces the URL that normally would be the href value.
    If the user doesn''t have JavaScript running or the associated JavaScript function
    fails to load for some reason, the link is completely broken. This approach also
    adds JavaScript into the markup, an issue I''ll discuss after I show you the second
    method. In short, avoid triggering events with the pseudo protocol.'
  merge: -1
