    # Functions


    Functions are the building blocks of your page''s functionality, as their name
    suggests. Each function performs a task, such as validating an email address,
    adding numbers together, or moving an element onscreen. What makes functions so
    useful is that they can be written to accept items of data, called arguments,
    which they use in their work.


    Imagine you owned a very smart robot that could do your bidding. It has a very
    useful shopping function that enables the robot to look up store locations, finds
    its way to the store, track down items, pay for them, and get home with the goods.
    All you have to do is call the shopping function on your robot, remembering to
    include the required store and item arguments


    ```

    goShopping("Borders", "Codin'' for the Web");

    ```


    and after so, it returns a nice book with a blue color. The enormous quantity
    of code to get your robot to do this is hidden away in a function that you don''t
    have to worry about. You just call the function with the required arguments and
    everything else is already taken of.


    Functions also keep things nice and tidy. The main flow of your code doesn''t
    contain all those miles of instructions telling the robot to walk or pick up things.
    All these individual, and often complex, tasks are abstracted (out of sight but
    usable) into functions that can be called with a single instruction from anywhere
    in your code.


    In short, you call a function, passing it any arguments (data) it needs to do
    its job, and then returns the result to you. That function can have a million
    lines of code in it, but you can call it and obtain the returned result with a
    single line.


    The basic format of a function is


    ```

    function functionName(parameter1, parameter2..parameterN) {


    // code that executes when function is called

    }

    ```'
