  md: '# # Code that Acts on Data


    Now you have seen the different data types and ways you can store them. Let''s
    look at code structures you can use to work on that data.


    # ## Operators


    Operators go between data elements to indicate how JavaScript should evaluate
    them. In most cases, an operator indicates the process that the right side should
    perform on the left side. There are several types of operators.


    # MATH


    We''re all familiar with the basic math operators:


    | adds 3 to 2 | 2 + 3 |

    | subtracts 7 from 10 | 10 - 7 |

    | multiplies 125 by 5 | 125 * 5 |

    | divides 200 by 4 | 200 / 4 |


    Note that you can add and subtract 1 from a number with just a double operator.


    ```

    var age = 12;

    ageage++;

    ```


    ```

    var livesLeft = 3;

    livesLeft--;

    ```


    The double operator is frequently used in loops, so you can look at each element
    in a set of data sequentially—see “Loops and Iterating over Data” later in this
    chapter.'
