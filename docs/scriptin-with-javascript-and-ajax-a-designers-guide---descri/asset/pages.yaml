    CSS rules should live in an external style sheet, which is simply a text document
    with the extension .css and is linked to the HTML by adding a link tag to the
    head of the HTML page like this:


    ```

    <link type="text/css" rel="stylesheet" href="sign_up_form.css">

    ```


    You want to avoid using CSS to add presentational styles to your HTML as inline
    tags, like this:

    <p style="color:red;\>Warning: don''t add inline CSS!</p>

    or embedding CSS in the page in style tags, like this:


    ```

    <style>

    p.bignono {color:red;}

    </style>

    ```


    (and certainly don''t use deprecated presentational HTML like FONT, COLOR, and
    ALIGN).

    You permanently assign these styles to your markup when you add the styles to
    the tags, or to the page you use embedded CSS. A linked style sheet gives you
    maximum flexibility. You can change either the markup or the CSS without affecting
    the other, and you can link that style sheet to as many pages as you wish to save
    repetitive CSS coding and provide consistent styling across all the pages of your
    site.'
