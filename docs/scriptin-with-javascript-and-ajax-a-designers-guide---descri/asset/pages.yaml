    extends the basic jQuery library. Therefore, you must have the jQuery library,
    the jQuery UI library, and the jQuery UI style sheet linked to the page to make
    these examples work. After you have downloaded jQuery and jQuery UI from www.jquery.com
    and www.jqueryui.com respectively, you must then add the code in the header of
    your page.


