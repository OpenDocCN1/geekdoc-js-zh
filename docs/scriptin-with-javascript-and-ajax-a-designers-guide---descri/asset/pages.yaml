  md: '# Predefined JavaScript Objects


    JavaScript has a hierarchy of predefined objects, each with built-in methods and
    properties ready for use. At the top of this hierarchy is the Window Object, and
    its immediate descendant is the Document Object, which contains the DOM of your
    document. There are number of other predefined objects that help with particular
    types of tasks, such as the Number, Math, and Date Objects. Listings of these
    predefined objects and their methods are in Appendices A, B, and C, and you will
    see many examples of each as we go forward. However, the Window and Document Objects
    warrant further discussion here.


    # THE WINDOW OBJECT


    The Window Object gives you access to a hierarchical representation of the browser-related
    properties and methods that can be accessed and sometimes set via the Window Object.
    For example, the Window Object stores the history of pages visited and can be
    used to move to pages previously visited—it''s like operating the Back button
    right from the code.


    To move to the previous page visited, write


    ```

    window.back();

    ```


    This calls the back method of the Window Object, and the browser goes back one
    page.


    The Window Object has methods that can open, load content into, and close additional
    windows. Other Window Object methods display some basic dialogs (alert, prompts,
    and confirm), set and remove the focus on elements, and set up time delays to
    control time-based events as animation.


    # THE DOCUMENT OBJECT


    As its name suggests, the Document Object gives you access to the DOM. The DOM
    is a hierarchical representation of an HTML document. JavaScript enables you to
    manipulate the DOM in sophisticated ways, including adding, changing, and removing
    HTML elements from the code runs—a capability that is integral to the use of Ajax
    in your work.


    The Document Object''s predefined getById is one of the ways you can "get" an
    HTML element as an object that you'
