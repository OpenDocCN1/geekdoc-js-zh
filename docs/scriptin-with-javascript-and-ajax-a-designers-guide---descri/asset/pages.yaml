    \nMy second comment is about the automatic control of the display of the arrows.\
    \ Notice that when the page first loads, the left arrow is not displayed. This\
    \ is because the carousel is initially filled\n\n# About Image Sprites\n\nThe\
    \ technique of downloading a single graphic containing several images and displaying\
    \ them individually by placing them behind a masking element is known as \"image\
    \ sprinting.\" This is now a very popular technique for implementing scrolls,\
    \ because numerous image \"sprites\"—a term used for the small graphics used for\
