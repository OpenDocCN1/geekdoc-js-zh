    # Pseudo-global Variables


    Generally, for the reasons I''ve illustrated, it''s good practice to avoid having
    variables and functions in the global namespace, but if you must, minimize your
    footprint to the smallest number of references possible. Frameworks generally
    need to be in the global namespace to offer the widest access from your code,
    and minimize their impact with a single large object that contains their functionality.
    An alternative, if you actually want to create variables that can be applied to
    any future application, is that you can use this namesacing technique to create
    pseudo-global variables. You can treat them as global variables, although they
    are not really in the global namespace but in your own making. To remind yourself
    and others who work on your code what you are doing, create a namespace that is
    clearly used for this purpose, so that it''s obvious. The convention of capitalizing
    the variable name helps in this regard, and in this style:


    ```

    var APPGLOBALS = {

    ''property1'': ''value'',

    ''property2'': appGlobalFunction:function { return: true; }

    }

    ```


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_201_0.png)


    For discussion of namespacing reading Robert Nyman''s blog article at http://robertnyman.com/2008/10/29/javascript-namesacing-an-alternative-to-javascript-inheritance.'
