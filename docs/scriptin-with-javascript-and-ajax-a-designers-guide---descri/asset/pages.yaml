    # Numbers


    Numbers can be positive or negative and can


    +   - **Integers.** Whole numbers such as 1, 45, -34, 2354564

    - **Floating-point numbers.** With numbers to the right of the decimal point,
    such as 3.142, -000001, and so on

    - **Exponentials.** In JavaScript you can use e to mean "to the power of," so
    you can represent the number 109 as 1e9


    You can also represent numbers in octal (base 8) and hexadecimal (base 16) formats.
    Hexadecimal is useful when working with colors because they can be expressed in
    three groups of two-digit hexadecimal values, such as #FF0000, which is red.


    # Booleans


    Boolean values are special values known as constants. They can only be true and
    false, and can also be represented as 1 and 0, respectively. Note that although
    they are words, they are not strings and should not be quoted. Booleans are used
    to represent entities that can only have one of two states, such as on or off,
    yes or no, or not equal. You will learn more about Boolean values when we look
    at if statements later in this chapter.


    # Arrays


    Arrays can be thought of as a variable that can hold more than one value. Often
    you want to keep a set of related values together, and arrays are the way to do
    this. Arrays are powerful structures: Every array you create is a child of the
    global Array object, so your arrays have access to a complete set of methods that
    enable you to easily create, access, add, remove, and perform operations on an
    array''s values. You can find a listing of the Array methods in Appendix B.


    An array is capable of holding any list of items, such as this list of animals:


    dog, cat, pig, horse, sheep


    Let''s see how to create and manage an array with these items in it.'
