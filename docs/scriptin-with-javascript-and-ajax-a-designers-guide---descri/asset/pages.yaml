  md: '2 = loaded—the send method has been called and the request is in process


    3 = interactive—the server is sending a response


    4 = complete—the response has been sent


    Your wrapper function can be notified each time this state changes by monitoring
    the onreadystatechange event handler, which as its name suggests is each time
    the XHR''s readstate property is updated by the server.


    Because the order of these responses is different between browsers, and you all
    really need to know is when the request has completed, you simply want to monitor
    for a readstate property of 4 each time the onreadystatechange event handler is
    triggered. You do this by assigning a function to the onreadystatechange event
    handler in which you can track the state of the request. You need to specify that
    function before making the request, as you can see from the descriptions of the
    values the readstate property, the server starts back request state information
    even before the request is fully submitted.


    Consequently, after instantiating the object—but before you do anything with it—you
    want to define the function that will process the onreadystatechange information.


    The XHR object also tracks the three-digit HTTP status of the request. You are
    probably all too familiar with HTTP Status 404—Page Not Found, which you get when
    you request a URL that doesn''t point to a valid resource. What you want your
    code to check for status 200—success. Upon determining a status of 200, your object
    can safely assume the request data has arrived and whatever is in the response
    to the callback function. In the sequence of your code, once the readstate is
    4, you check for the request''s HTTP status (which is stored in the XHR object''s
    status property). If the status is 200, the responseText property''s value—the
    requested data—is passed to the callback function.


    To do this, I simply assign an anonymous function that makes these checks to the
    onreadystatechange event handler each time the readstate changes. (This is a very
    similar concept to the onload event handler, because both are called by events
    that are not initiated by the user.)'
