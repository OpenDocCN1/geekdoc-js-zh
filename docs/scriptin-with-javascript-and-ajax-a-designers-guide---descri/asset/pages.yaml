  md: '# Software Design Patterns


    If you are a designer, you may be aware of the classification of common user interface
    interactions into each design patterns—such as Wizard, multiple undo, and drag-and-drop
    to name just a few—that define each''s appropriate use and implementation. Design
    patterns document successful interactions, where designers design a common vocabulary,
    and most of all, provide users with familiar interactions across the sites they
    visit. Jenifer Tidwell''s Designing Interfaces (O''Reilly, 2005) is the seminal
    work on which to study and essential for all interface designers.


    A similar set of design patterns exists in software also and provides a standardized
    way to solve and discuss common programming problems. The first major classification
    of design patterns was published in Design Patterns: Elements of Reusable Object-Oriented
    Software (Addison-Wesley, 1994) by Erich Gamma, Richard Helm, Ralph Johnson, and
    John Vlissides (known as “The Gang of Four”).


    Most of the helpers you use in Scriptin with JavaScript are simple implementations
    of the Facade pattern, where "common interface is provided to two or more interfaces
    in a subsystem." The code addresses a single interface—in the case of adding event
    listeners, and the interface takes care of addressing, in a syntactically correct
    manner, of two objects—addEventListener or attachEvent—depending on the user''s
    browser. By using these Facade patterns, you help avoid cross-browser issues and
    simply pass your requests to these intermediate objects that resolve them for
    you.


    As your skills grow, studying design patterns can help you write better code,
    because you''re then using best coding practices and can avoid struggling to solutions
    coding problems that were discovered and proven long ago. Event listener registration
    is yet another example of the cross-browser issues you face with JavaScript. However,
    you have a nice little collection of helpers or as jQuery, you don''t have to
    worry about them as much.


    takes care of formatting the event registration appropriately for the browser
    on which it is running.


    A common time to add which listeners to elements is when the first page loads,
    or to be more specific, upon an event that every JavaScript application must detect
    and handle—the load event that is triggered when the page is fully loaded and
    rendered in the browser.


    # The First Event: load


    Typically, the first thing you want JavaScript to do is set up the initial state
    of the page so it''s ready for use. A very common part of this initialization
    process is to attach event listeners to the elements in the DOM that will respond
    to user actions, and you can''t do until the DOM has loaded into the browser.


    For example, you might want to attach blur events to the text fields of a form
    so you can detect when the user clicks or tabs away from them. You can then immediately
    validate the text user entered.'
