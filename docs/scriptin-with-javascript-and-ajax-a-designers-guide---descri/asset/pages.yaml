    a width that is great enough to enclose all the div.thumbContainer items. In the
    jQuery Tools Demo, I noticed that the width had been set at 10000 em, presumably
    by someone who assumed that this would accommodate any potential content. I decided
    to be more precise and set the #thumbs element width to


    The name "thumbs" is shorthand for "thumbnails," which is a term for a set of
    small images like the ones in the carousel.'
