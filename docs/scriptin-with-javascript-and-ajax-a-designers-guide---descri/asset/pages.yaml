- img_proc: true
  md: '# About Frameworks


    A framework is a collection of tightly integrated helper functions that abstract
    away many of JavaScript''s complexities and help you build your application quickly.
    Most are free and often developed by the Open Source community. Some, most notably
    jQuery and Prototype, are a single library file of core functionality that can
    be extended by a large number of plug-ins built by developers all over the world
    that provide almost every application might need. However, it is important to
    test any plug-in that you want to use ensure that it can do what you want and
    doesn''t interact adversely with other areas of your code. There are frameworks,
    like Yahoo! User Interface (YUI), that are built on a large base of core functionality,
    which is extended with numerous specialized modules. The great advantage of YUI
    is that the modules are all developed by the same team and designed to work together.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_197_0.png)


    Danny Douglas compares the features of a number of the popular frameworks in this
    article on his Web site at www.dannyglas.com/post/2008/04/Comparing-Popular-JavaScript-Frameworks.aspx.


    # Advantages of Frameworks


    Using a framework can provide many benefits. A framework typically does the following:


    +   **Makes common programming tasks easy.** A couple of basic capabilities offered
    by frameworks include:


    +   Selecting DOM elements more economically by eliminating the need to repeatedly
    type document.getElementById element classes


    +   Easily adding and removing element classes


    +   **Simplifies Ajax implementation.** Most libraries provide a simplified method
    of making Ajax requests, with built-in error and slow-response handling. They
    also include special Ajax features like automatic timed requests that you might
    use in an application, such as in chat, where the browser needs to be synced frequently
    with the server.


    +   **Provides interface component libraries.** Coding interface components, aka
    widgets, especially those such as menus and accordions that also have an animation
    to them, can be time-consuming and present significant cross-browser incompatibilities.
    Both the Prototype and jQuery libraries offer add-ons for interface components—such
    as Scriptuous and jQuery UI respectively—that enable you to invoke complex interface
    interface components rapidly from basic HTML'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# FRAMEWORKS


    markup. Adobe. Spry framework also has an extensive selection of interface components.


    +   Eliminate cross-browser issues. Framework developers invest a lot of time
    ensuring that their code works correctly across a wide variety of browsers. You
    can think of a framework as a large-scale Facade design pattern implementation—you
    talk to the framework and it deals with the browser differences. This benefit
    alone makes a compelling case for using a framework.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_198_0.png)


    Learn about advanced objectoriented programming techniques at http://www.digital-web.com/articles/objectifying_javascript.
    This article builds on concepts such as object literals and the new in constructor
    functions. Also, follow the links at the bottom of the article to more articles
    on object-oriented JavaScript.


    # Considerations When Using a Framework


    Frameworks are hyped as the solution to many programming issues, and indeed they
    are. However, you need to remember that a framework is a specialized layer of
    code that runs on top of JavaScript. This means that before you decide to use
    a framework for your next project, you should consider the following points:


    > YOU QUICKLY GET LOCKED IN


    Once you start to build an application, and its functionality depends on a particular
    framework, it''s not easy to back out. If your framework is not supported in the
    future, you may have a tough time reengineering your site. Part of the reason
    I picked these four frameworks is that they are well supported and widely adopted.


    > IT''S ANOTHER LANGUAGE TO LEARN


    While frameworks follow JavaScript-like syntax, part of the attraction of frameworks
    is that they provide simplified coding (for example, jQuery''s namespace—more
    on namespaces next) and enhanced capabilities (for example, Prototype''s excellent
    implementation of classes, polymorphism).


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_198_1.png)


    With these features come new programming techniques that must be mastered, and
    using framework''s powerful chaining capability, I will also show you in this
    chapter, a good example. This need framework-specific knowledge does not just
    affect you: If you want to hire an extra programmer for your team, that person
    needs to know both JavaScript and the framework you are using. Creating a project
    to hone your skills and investigating the availability of programmers who know
    your framework of choice can be time well spent.


    For a checklist of questions you might want to consider before deciding on a particular
    framework, see Brian Reindel''s blog article at http://blog.reindel.com/2007/10/30/how-to-choose-a-javascriptframework.'
