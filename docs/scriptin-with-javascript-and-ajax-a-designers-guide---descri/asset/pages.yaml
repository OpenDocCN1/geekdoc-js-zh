  md: '# Ajax Implementation in Four Frameworks


    As you will see, Ajax coding is a lot easier with a framework than trying to write
    an Ajax wrapper that can cope with all the different browsers it might encounter.
    In the four frameworks I will show you here, and most others, cross-browser issues
    are abstracted away and you don''t have to think about them.


    I''ll start with what is now probably the most popular framework, jQuery. To put
    the framework in context, I''ll start with a look at some key jQuery concepts.


    # jQuery Namespace


    jQuery''s entire framework is abstracted behind the $ symbol, which is the global
    instance variable that contains the actual jQuery object. As an example of this,
    and of jQuery''s economic scale, let''s compare regular JavaScript and jQuery
    to get elements in your page. So far you have been using this idiom:


    ```

    var element = document.getElementById(''myDiv'');

    ```


    With jQuery, that is reduced to:


    ```

    var element = $(''myDiv'');

    ```


    Note that the argument, #myDiv, is a CSS expression that identifies an element
    by—jQuery references elements with the same syntax as CSS selectors. No longer
    having to repeatedly type document.getElementById() is a small but very convenient
    benefit of using jQuery.


    # CHAINING


    A very interesting aspect of jQuery is a technique called chaining, where you
    can string a number of actions together on one line instead of writing a separate
    line for each. Every jQuery command starts with the $ function, which is written
    ($). A CSS selector in quotes goes inside the parentheses, for example, ("#ul#
    li"). This selects all the li elements that are children of what I want to have
    on to these elements, like:


    ```

    $(''#ul > li'').addClass(''menulink'')

    ```


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_203_0.png)


    The jQuery framework can be downloaded from jquery.com. This library can be extended
    with the jQuery interface components framework, which can be downloaded at http://jquery.com.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_203_1.png)


    Prototype also uses $ as its namespace. If you are using both frameworks for some
    reason, you can use the jQuery namespace, as in jQuery("#myDiv").


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_203_2.png)


    * With'
