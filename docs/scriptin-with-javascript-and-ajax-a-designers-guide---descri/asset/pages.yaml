  md: '# Tips on Integrating Online Examples into Your Work


    If you are a newcomer to JavaScript and frameworks, it''s often easiest to take
    a demo like the jQuery Tools'' Carousel example as the foundation of your page
    and modify it to look like the other pages in your site rather than trying to
    add the framework''s functionality to an existing page. In other words, the first
    step toward building your own carousel is to take that, or the one that I have
    provided in the download files for this book, and get it working on your server.
    Once you''ve done that, you can start modifying it with your own content and styling
    to your desired look.


    In the case of the jQuery Tool''s demo, here is what you would do:


    +   1. Go to //flowplayer/tools/demos/scrollable/visual.html and View Source using
    your browser''s View menu (don''t View Generated using Web Developer tooltip in
    this case—you want to get the original source code before JavaScript modifies
    it). Copy and paste the source code into a new HTML file. Copy the file onto your
    server. You will be pleased to find that all you have to do is get the demo running.
    The reason this is so easy is that all the scripts and images are served from
    the Flowplayer.org servers; you can also use the URLs in your final version: Flowplayer.org
    is only serving all content for a limited time as it establishes the builds, and
    it''s not wise to rely on any third party for linking content except through an
    established content distribution network (CDN) such as Google or Yahoo!

    2. The next latter you do is start serving the served content and moving it onto
    your own server so you can link to your own copies, modifying the URLs appropriately
    as you go. You have to work through the markup and the content associated with
    each link, script, or image tag.

    3. The first file in the demo markup is the jQuery Tools library, which also contains
    the base jQuery library. You can download this file from the jQuery downloads.
    Put it in a folder called Query. Now you can modify the link to it to read something
    (in the case of my site) //scriptinwithajax/code/Ch7_examples/vim_carousel_sample/query/query_tools.js

    4. Because other elements like the CSS and graphics are not available for download,
    you need to get a little more creative. Simply copy and paste the URL of the required
    element into address bar of the browser and load it. Next, in the case of such
    CSS, just copy and paste it into a file and save it, or in the case of graphic,
    right-click (Control-click on Mac) and use your Save As to save it to an appropriate
    folder. Then modify the path in the code to reflect the new location. (Of course,
    if you use the example I have done for you.)

    Some of the graphic elements are available for download on the jQuery Tools sites,
    but it''s not worth copying the demo content images for your carousel because
    you''ll be changing them out for yours, so you would leave them linked to the
    site for now. Often, I simply create a graphic placeholder, usually just a colored
    rectangle, of the size to use until I have my own images ready.

    5. After you have all the graphic and code elements on your server and updated
    all paths everything is functional again, back up the project folder so you can
    pick up again if things fall apart (and sometimes they do—even happened to me
    once!). Then you can start modifying the file to your own needs.'
  merge: -1
