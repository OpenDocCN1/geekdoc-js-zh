  md: '# THE, =, AND === OPERATORS


    You may have noticed the triple equals sign (===) operator in the preceding example,
    so this is a good moment to clarify the possible meanings of the equals sign.


    A single equals sign does not mean equal; it means "set," as in


    ```

    var a=15+10;

    ```


    The element on the left, a, is set to the result of the evaluated expression on
    the right, which is 25.


    == is an equality operator and means equal to.


    By contrast, == "loosely" compares two values if they are the same, but they do
    not have to be of the same. Because the === operator evaluates values of differing
    types, the following comparisons evaluate to true:


    ```

    1 == "1"

    false=="false"

    undefined==null

    ```


    === means exactly equal to. This is a more stringent comparison than === both
    values must be the same and of the same data type:


    ```

    x=4

    y=''4''

    (x==y)

    (x===y)

    ```


    You almost always want to use the === operator and avoid the == comparison if
    you use it. It is important to keep track of what type of your variables hold,
    and if in doubt, check a variable''s data type with the typeof() function before
    using it, like this:


    ```

    if (typeof myVar==''number'') { /* do something with the number here */ }

    ```


    When you are sure of the data type, you can confidently use ===. If you use ==,
    your code can return incorrect and hard-to-debug comparison results. You will
    see more of the == and === operators as you go around. For now, just know that
    they are both used in comparisons, and that === is the one you want to use in
    specific cases where a looser comparison is required.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_57_0.png)


    The space on either side of the equals signs is optional. I add the spaces to
    improve clarity between long variable names. In short math formulas, I forgo the
    spaces. It''s a matter of personal style.


    +   - a string and a number

    - a Boolean and a string

    - two different false values


    +   - sets x to an integer

    - sets y to a string

    - true

    - false-not both type'
