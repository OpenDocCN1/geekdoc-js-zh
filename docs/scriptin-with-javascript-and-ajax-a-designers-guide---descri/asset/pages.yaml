    # # An Accessible Catalog


    In Chapter 1, I discussed three levels of accessibility: functional, styled, and
    enhanced. In the catalog example I showed you, all three levels are available.


    If the user has a modern browser and JavaScript is enabled, the user will see
    fully styled pages, and content will be updated with Ajax-out page refreshes.
    This is the most enhanced user experience.


    If JavaScript is not supported, the user will still view styled pages but the
    content will be delivered via round-trip page refreshes.


    If neither JavaScript nor CSS are supported, the page will have the browser''s
    default styling, but it will still function and the user will still be able to
    view the content.


    You can observe these different levels by using the Firefox Web Developer Toolbar.
    First, use the page in a modern browser to experience the fully enhanced page.
    Second, use the toolbar to disable JavaScript, reload, and use the page again
    to see it fall back to the round-trip model. Third, disable the Persist Features
    in the Options menu so the CSS remains disabled between refreshes. Now the page
    takes a plain appearance but is still functional and usable.


    If you view the source of the page during any of these tests, you will only see
    HTML. There is absolutely no CSS or JavaScript in the page''s markup. Both the
    CSS and JavaScript are in external files and will add styling and behavior respectively
    to the page if these technologies are supported, but there will be no adverse
