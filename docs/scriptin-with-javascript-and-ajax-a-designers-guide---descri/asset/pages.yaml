  md: '# SCRIPTIN'' WITH JAVASCRIPT AND AJAX · CHAPTER 7


    method will simply pass the data in the json variable back to the requesting Ajax
    call, and as its name suggests, it''s a regular page request, stop the script.


    If the ajax property is not set, it''s a regular page request, and PHP must supply
    the data in a new page. In such a case, the else statement runs. This creates
    a new of HTML elements in a variable called overlayHTML, adding the appropriate
    JSON data into each one.


    This variable contains the same HTML elements that would be displayed in the overlay
    if Ajax was handling the request. However, if PHP generates the HTML (because
    JavaScript is not present), HTML elements will not appear in the overlay but instead
    in a div that will be displayed below the carousel—the overlay can work without
    JavaScript.


    The way we use PHP to assemble the HTML elements here is similar to the way we
    used JavaScript to assemble the HTML elements using JSON in the guitar example
    in Chapter 5. The only real difference is that PHP a. (period), not +, is to concatenate
    the HTML and the JSON data when assembling the HTML elements.


    As I mentioned, without JavaScript I can''t use the overlay to display the HTML
    elements generated by PHP, I need to add a div into the markup that I use for
    this purpose. Further down the PHP script, in the HTML markup, you will see the
    line


    ```

    if ($overlayHTML) print ''<div id="overlay_content_noJS">''.$overlayHTML . ''</div>'';

    ```


    where I test for the existence of the overlayHTML variable. This variable only
    exists if I wrote out the HTML with PHP, so if it''s present, I need to add a
    div—with the contents of the overlayHTML variable—into the page after the carousel
    markup. You can see how this looks in Figure 7.7.


    I have a page that works with just HTML and PHP. Let''s look at the Ajax implementation
