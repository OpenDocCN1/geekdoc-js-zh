  md: '# Event Listeners


    Introduced with the W3C DOM model, event listeners provide com-preprehensive event
    registration.


    An event listener does what its name suggests: After being attached to an object,
    it then listens patiently for its event to occur. When it “hears” its event, it
    then calls its associated function in the way as the “handlers as object properties”
    method but with two important distinctions.


    First, an event listener passes an event object containing information about its
    triggering event to the function it calls. (I emphasize this point because it
    is so important.) Within the function, you can read this object''s properties
    to determine the target element, the type of event that occurred—such as click,
    focus, mousedown—and other useful details about the event.


    This capability can reduce coding considerably, because you can write very flexible
    functions for tasks, such as handling clicks, that provide variations in their
    response depending on the object and triggering event. Otherwise, you would have
    to write a separate, and probably very similar, function for every type of event
    you have to handle. You will learn how to write functions with this kind of flexibility
    later in the chapter.


    Second, you can attach multiple event listeners to an object. As a result, you
    don''t have to worry when adding one listener that you are overwriting another
    that was added earlier, as you do when simply assigning an event as an object
    property.


    While both the W3C and Microsoft browsers use event handlers, they differ in the
    way those handlers are attached to elements and in the way they provide access
    to the event object. I will start with the W3C approach, which will be the de
    facto standard in the future, and then discuss how event listeners work in Microsoft
    browsers.


    # W3C EVENT MODEL


    Here''s the W3C technique for adding listeners. I''ll add two listeners to a form''s
    text field that can cause functions to run when the user clicks (or tabs) or out
    of the field:


    ```

    get the object          emailField-document.getElementById(''email'');

    add a focus listener      emailField.addEventListener(''focus'',doHighlight,false);

    add a blur listener       emailField.addEventListener(''blur'',doValidate,false);

    ```'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# EVENTS


    Now the function doHighlight will be called when the cursor moves into the field,
    and the function doValidate will be called when the cursor moves out of the field.
    The third argument, false, relates to event bubbling, a concept that can wait
    until later in this chapter.) I can attach as many event listeners as I want to
    the object in this manner.


    I can remove the events from the element in a similar way using the removeEventListener
    method.


    ```

    emailField=document.getElementById(''email'');

    emailField.removeEventListener(''focus'',doHighlight,false);

    emailField.removeEventListener(''blur'',doValidate,false);

    ```


    get the object


    # THE MICROSOFT EVENT MODEL


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_112_0.png)


    Microsoft''s event registration model is slightly different. The equivalent of
    this W3C style


    ```

    emailField.addEventListener(''focus'',doHighlight,false);

    emailField.attachEvent(''onfocus'',doHighlight);

    emailField.removeEventListener(''focus'',doHighlight,false);

    emailField.detachEvent(''onfocus'',doHighlight);

    ```


    in the Microsoft model

    Note the use of on, as in onfocus, in the name of the event for the Microsoft
    version. Clearly, there are some syntax variations here, so let''s look at how
    to write code that works on both browsers.


    # ANDEVENT HELPER FUNCTION


    To add event listeners to elements correctly, I''ll use an existing helper function
    written by John Resig that can determine the correct event model to use. This
    function accepts the following arguments:


    +   * The element to which the listener should be attached

    * The type of event to listen for

    * The name of the function to call when the event occurs'
