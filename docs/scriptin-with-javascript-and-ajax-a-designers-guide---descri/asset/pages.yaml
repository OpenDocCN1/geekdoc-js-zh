  md: '# About the Author


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_7_0.png)


    **Charles Wyke-Smith** is the author of *Stylin'' with CSS: A Designer''s Guide
    and Codin'' for the Web: A Designer''s Guide to Developing Dynamic Web Sites.*
    Charles has been involved in print, multimedia and Web design for over twenty
    years. He founded PRINTZ Electronic Design in San Francisco in the mid-eighties,
    an early-computerized design studio, and was a pioneer in interactive media development.


    He has been creating Web sites since 1994 and has provided Web design and consulting
    service to companies including Wells-Fargo, Benefitfocus, ESPN Video Games, and
    University of California, San Francisco.


    His work today focuses on online application development, with an emphasis on
    user experience, information architecture, and interface design.


    An accomplished speaker and instructor, Charles has taught classes in multimedia
    interface design and has presented at many industry conference.


    He lives with his wife, Beth, and two daughters in Charleston, South Carolina.'
