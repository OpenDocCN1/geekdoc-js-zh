    <script src="jquery/ui-1.7.2.min.js" type="text/javascript"></script>

    ```


    You may need to adjust the path names to these files, depending on where they
    are located on your server. The preceding path assume the jQuery files are in
    a folder called jquery at the same level as the HTML page.

    Also, another may want to link one of the widely used Ajax frameworks to your
    Web page is to use a Content Delivery Network, such as Google or Yahoo. This,
    for example, you may use the version of jQuery on the Google servers installed
