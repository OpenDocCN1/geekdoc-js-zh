  md: '# SCRIPTIN WITH JAVASCRIPT AND AJAX - CHAPTER 1


    HTML has traditionally enabled you to create a structured Web page, and CSS enabled
    you to give it a pleasing visual appearance, a page created in this way has little
    or no visual response to user action, except perhaps for links that highlight
    when rolled over or a simple CSS-driven drop-down menu. If a user sends data to
    the server by clicking a link or submitting a form, she must wait patiently for
    that data to be processed by the server and a new HTML page served back in response.
    This was the state of Web in the pre-Web 2.0 world and is a world in which many
    sites still live.


    Web 2.0 is a somewhat overused term that is generously applied to everything that''s
    new and not so new in this world of Web, as this this quote from Wikipedia indicates:


    > The term "Web 2.0" refers to a perceived second generation of web development
    and design, that aims to facilitate communication, secure information sharing,
    interoperability, and collaboration on the Wide Web. Web 2.0 concepts have led
    to the development and evolution of web-based communities, hosted services, and
    applications; such as social-networking sites, video-sharing sites, wikis, blogs,
    and folkonomies.


    Despite this kind of hyperbole, Web 2.0 offers an inspiring reality that all Web
    designers should gladly embrace.


    From a purely design and technical perspective, the two key qualities that define
    this "second-generation of web development and design" are a fluid, interactive
    feel to the interface and the capability to request and receive data from the
    server "behind the scenes," and then present that data to the user without loading
    a new page.


    In the hands of a talented and knowledgeable designer, these two interactions
    can transform a Web site into a Rich Interface Application (RIA). In an RIA, stylish
    and technically sophisticated interface components accept user input and respond
    with new data seemingly instantly. A simple example is when a user mouses over
    a headline in a list of headlines, the description of that story is delivered
    from the server and added to the page below the headline. In the past, this effect
    could only be achieved by including the content of every story in the initial
    page, resulting in a massive page download. This capability to get data from the
    server and add it directly into the page is the result of a JavaScript-powered
    coding technique called Ajax. Because of Ajax, today''s Web sites are morphing
    into what looks like and feels like any regular "sovereign" application that runs
    on your computer.'
