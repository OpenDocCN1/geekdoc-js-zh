  md: '# Keep Track of Your Data Types


    In strongly typed languages, such as C++ and Java, you must declare what type
    of variable you are creating—string, number, Boolean, and so on—when you create
    it. You can only use it to hold that kind of data. In JavaScript, which is weakly
    typed, you can simply declare a variable and put any type of data in it. This
    makes JavaScript more flexible because you can change your mind about what type
    of data you want in a particular variable at. However, if you don''t keep track
    of the type of data in your variables, you can write code that produces unexpected
    and unwanted results. You can also use the typeof operator to test what type of
    data you are dealing with before you use it.


    # CREATE AN ARRAY


    Here''s how to create an array:


    ```

    var animalArray = [];

    ```


    You now have new empty array called animalArray that you can start to populate
    as your code runs.


    # INDEXED ARRAYS


    Indexed arrays are lists of items whereby each item is referenced by its index—its
    numerical position in the array.


    Let''s begin creating and populating the array in a single step, separating the
    items with commas:


    ```

    var animalArray = ["dog", "cat", "pig", "horse", "sheep"];

    ```


    Note that the names are strings. If you didn''t quote them, when your code later
    accessed the array, JavaScript would look for variables elsewhere in the code
    with these names.


    Each part of an array is known as an element; the array now has five elements.


    # READING AN ELEMENT FROM AN ARRAY


    To read from an array, use the format


    ```

    arrayName[arrayIndex];

    ```


    For example:


    ```

