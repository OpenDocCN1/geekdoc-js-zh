  md: '# JAVASCRIPT BASICS


    # CALLING A FUNCTION FROM A LINK


    User actions are the trigger for many of the functions you will write. User actions
    actually trigger events, which are messages that are fired off by the browser
    when the user does any of a number of actions, such as clicking the mouse, moving
    on or off an element, or pressing a key on the keyboard. Events are a large and
    important topic that will be the subject of Chapter 4. However, in the interest
    of being able to follow Chapter 3. "Objects," just understand for now that you
    can easily detect a click event and use it to trigger a JavaScript function. Here
    is an example of how to write:


    ```

    <a href="dogs.html" onclick="bigwoof();">Bark and Go</a>

    ```


    The (highlighted) onclick event handler is triggered when the click happens and
    in this case, the bigwoof function is then called. The event handler (onclick)
    receives the click message before the WOF! In this case, you would get the WOF!
    and then the dogs.html page specified would load. Often, you don''t want the href
    to work if the JavaScript function is called (for example, if you are using Ajax
    to get the data and only wait the regular page to reload as a backup if the JavaScript
    isn''t present). To prevent the href from receiving the event after the JavaScript
    event handler does this:


    ```

    <a href="dogs.html" onclick="bigwoof(); return false;">Bark and Stay!!</a>

    ```


    Now the click event triggers the function, but it is not passed on to the href
    of the event and remain on the current page.


    # Summary


    In this chapter, you''ve seen the basic concepts of JavaScript works. You''ve
    seen how data is stored and the ways you can perform processes, such as conditional
    and iterative looping, on that data. You''ve also seen how functions are the basic
    building blocks of your application capabilities.


    Next, I''ll show you objects. Because JavaScript is so heavily on objects and
    the Document Object Model (DOM) is an object, let''s start a new chapter and take
    a look at objects and the DOM.


    Adding an onclick handler directly to a link like this is no longer considered
    a good way to associate an event with a link because it mixes the JavaScript with
    the HTML. However, it''s simple and easily understood, so I will use this technique
    until I cover events in depth in Chapter 4.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_72_0.png)'
