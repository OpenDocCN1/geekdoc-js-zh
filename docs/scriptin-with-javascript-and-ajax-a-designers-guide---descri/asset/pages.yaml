  md: '# Inline Event Handler


    | EVENT CATEGORY | EVENT TRIGGERED WHEN... | EVENT HANDLER |

    | :--- | :--- | :--- |

    | Browser events | Page completes loading | onload |

    | | Page is removed from browser window | onunload |

    | | JavaScript throws an error | onerror |

    | Mouse events | User clicks over an element | onclick |

    | | User double-clicks over an element | ondblclick |

    | | The mouse button is pressed down over an element | onmousedown |

    | | The mouse button is released over an element | mouseup |

    | | The mouse pointer moves over an element | mouseover |

    | | The mouse pointer leaves an element | mouseout |

    | Keyboard events | A key is pressed | keydown |

    | | A key is released | key |

    | | A key is pressed and released | keypress |

    | Form events | The element receives focus from pointer or byabbing navigation
    | onfocus |

    | | The element loses focus | onblur |

    | | User selects type in text or text area field | onselect |

    | | User submits a form | onsubmit |

    | | User resets a form | onreset |

    | | Field loses focus and content has changed since receiving focus | onChange
    |


    TABLE 4.1 This table contains a list of the most commonly used event handlers.


    An inline event handler, as you saw briefly in Chapter 2, attaches an event handler
    directly to an element.


    ```

    <input type="text" onblur="doValidate() />

    ```


    Here, a form text field has the JavaScript function associated with its blur event—the
    function will be called when the user moves the cursor out of the field by pressing
    Tab or clicks elsewhere. The function could then check if the user actually typed
    something in the field or not.'
