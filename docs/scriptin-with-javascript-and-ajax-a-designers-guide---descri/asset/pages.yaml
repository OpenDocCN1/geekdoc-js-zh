    # AJAX AND CANCELING CLICKS


    The technique of canceling clicks to links after Ajax handles the request is key
    to providing progressive enhancement in your pages. Let''s first consider the
    most likely case when JavaScript is supported by the browser, and Ajax is therefore
    enabled. If a user clicks a link that triggers an Ajax call to fetch data from
    the server, I don''t want the click to also trigger the link''s href, because
    this would then fetch the content second time by refreshing the page on a round-trip.
    Instead, when the link is clicked, the JavaScript function runs, triggers the
    Ajax request, and then cancels the click to the link''s href.


    However, if JavaScript is not supported, the JavaScript does not run, and the
    link acts normally; the href is triggered, and the request is fulfilled in the
    traditional round-trip manner. Once you understand this concept, you can make
