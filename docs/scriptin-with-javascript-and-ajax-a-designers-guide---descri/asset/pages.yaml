    message into this tag that tells the user if the submitted answer is invalid.
    Because it has no text in it yet, the empty element is not visible on screen.


    # INDENTING YOUR CODE


    The first thing that you notice without reading any code is the indenting of the
    lines. You don''t have to indent your code, but you definitely should, and here''s
    both the why and how of code indenting.


    A tab or a couple of spaces can be used to indent, and the general consensus according
    to Chris, my tech editor, is to use a couple of spaces.


    An element should be indented if it''s nested in (enclosed) by the previous tag.
    But another way, you indent the current line if an element that opened hasn''t
    yet closed. For example, in the code in 1.1, the div after the body tag doesn''t
    close before the next (h1) element opens, so the h1 indented. The label and input
    elements are indented further still because they are enclosed by the form element.


    Correct indent confirms that your markup is well-formed with all the tags correctly
    nested inside one another. Indenting naturally creates a code layout where the
    most deeply nested tags are to the right, and if the markup is correctly formed,
    ends with the last line back at the left of the page. If you miss a closing tag
    somewhere, this won''t happen. For example, the closing div is exactly aligned
    with its opening tag higher up in the code. This will always be the case with
    any enclosing element if you have correctly nested all the tags within it. By
    following the indenting rule mentioned earlier, each child element is indented
    from its parent


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_27_1.png)


    The basic rule is simple:

    Indent nested tags.'
