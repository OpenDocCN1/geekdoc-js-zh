    +   An object literal is simply a comma-separated list of properties and methods,
    so don''t forget commas. Take a close look at the placement of the commas in the
    circleMath example on page 61. Note that no comma is used after the last item''s),
    right before the object''s closing.


    Technically, an object literal is just a list of properties, and the value of
    a property can be a function. However, I find it easier and more consistent simply
    refer to the properties that contain functions as methods.


    The key takeaway is that object literals are a powerful structure for your code.
    Using meaningful names for the objects you create because they are effectively
    the name of the object''s collection of properties and methods.


    The benefit that this extra level of organization that literals brings to your
    code (and objects in general) cannot be overstated. I am constantly improving
    my code by identifying functions that are “loose” in my scripts and moving them
    into object literals along with related functions and variables.


    In short, with good use of objects, you organize your code into the tasks that
    your application performs. It''s much easier to understand what is happening if
    you do this. In contrast, if you have to work on a large script that''s just made
    up of dozens of functions, you have to work out how they all relate to one other
    by reading every one of them line by line.


    Object literals are a great organizational tool, but the power of objects is revealed
    when you understand how to create instances of the objects you create.


    # Objects and Instances


    Often, you will use an object to manage a set of data where each entity in the
    data set has the same types of properties (a set of products may each have a brand
    name, a model number, and a price, for example). You can then create an instance
    of the object for each product—each instance with its own set of property values
    for the object’s properties—and then use the object’s methods to perform all kinds
    of operations on the instances.


    To help you understand this concept, in this example, I’ll create an object to
    hold information about my guitars.


    I will first write an object, again using an object literal format, called Guitar
    that can help me do this. It’s standard practice to start an object name with
    a capital letter if instances can be created from it.'
