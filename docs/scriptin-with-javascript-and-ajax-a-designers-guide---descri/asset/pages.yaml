    # OBJECTS AND SCOPE


    A big advantage of an object is the limited scope of its properties and methods—they
    are accessible only by explicitly referencing the instance of the object, as in


    ```

    `instrument1.describeGuitar();`

    ```


    This makes each object a self-contained entity, and if names used for the object''s
    methods and properties were to be used elsewhere in the code, there would not
    be a conflict. This concept is known as encapsulation, and it is very helpful
    when large teams are working on a project. As long as object behaves in a predictable
    manner, accepts specific data, and returns predictable responses, only the team
    members working on that object concern themselves about its internal implementation,
    which is immaterial to the rest of the code.


