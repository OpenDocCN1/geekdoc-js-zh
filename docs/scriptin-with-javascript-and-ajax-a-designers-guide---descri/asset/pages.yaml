  md: "# GETTING AN ELEMENT'S ATTRIBUTE\n\nIt can be very useful to access an element's\
    \ attributes, such as its class or title. In this example, I'll get the title\
    \ attribute of the div with the ID content and display that attribute's text.\n\
    \n```\nfunction alertDivAttribute() {\n  var theContent=document.getElementById(\"\
    content\");\n  var thisText=content.getAttribute(\"title\");\n  alert(thisText);\
    \ // displays This is the div's text!\n}\n```\n\nThe more concise form looks like\
    \ this:\n\n```\nalert(document.getElementById(\"content\");\ngetAttribute(\"title\"\
    ));\n```\n\n# GETTING THE TEXT OF A CHILD ELEMENT\n\nOften the element you want\
