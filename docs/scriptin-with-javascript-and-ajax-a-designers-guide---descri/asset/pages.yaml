  md: '# SCRIPTIN'' WITH JAVASCRIPT AND AJAX - CHAPTER 5


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_151_0.png)


    Ajax is a term coined by Jesse James Garrett of Adaptive Path in his now legendary
    post, which you can read at //www.adaptivepath.com/ideas/essays/archives/000385.php.


    Ajax is simply a catchy name given to a JavaScript programming technique that
    enables data to be moved between the browser and the server without the usual
    “round-trip to the server and a page refresh”—the only model by which the Web
    previously worked. In that model, updating one word in the page required the server
    to send an entirely new page to the browser. A new page was the only context in
    which new data could arrive in the browser.


    Ajax offers a new model. Using Ajax you can request data from the server and then
    use the DOM scripting techniques discussed in Chapter 3 to add data to the page.
    This occurs without the user having to wait for an entire new page to load—in
    fact, without reloading the page at all.


    This capability lets you deliver a more application-like experience. If the user
    has a reasonably fast Internet connection, there is often little or no perceptible
    delay between clicking a link and seeing data appear in the page. Suddenly, the
    response of your site is less of the old click-and-wait experience and much like
    a regular “sovereign” application running on the user’s local computer. Things
    happen as soon as you click or select from a menu with the rest of the screen
    changing.


    A more subtle but powerful change that Ajax brings is a sense of place; instead
    of perceiving the site as a series of discrete pages, the experience is now a
    workspace that changes and updates as the user works.


    # Understanding Ajax


    Ajax is quite simple to understand and not too difficult to implement. Let’s start
    at the beginning and look at why this programming technique was called Ajax in
    the first place.


    # Ajax by the Letters


    The first A of Ajax stands for Asynchronous. The Merriam-Webster dictionary defines
    asynchronous as “digital communication (between computers) in which there is no
    timing requirement for transmission.” In other words, the Ajax request is made
    by the browser does not affect the browser’s other activities.


    In the regular round-trip model, the user can do nothing after, say, submitting
    a form except wait until a new page is served back to'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# To Ajax or Not to Ajax?


    The technical and user experience changes that Ajax brings also create new design
    challenges. For example: If a small amount of the page content changes, will the
    user notice? How can I direct the user''s attention to these changes? What if
    the request to the server has no response and the required data is not delivered?
    How will my page respond under this circumstance, and how can the user be made
    aware of these problems?


    It''s also important to understand that Ajax is not appropriate for every browser/server
    transaction. If you simply want to add a line of text—perhaps a validation message
    on a form—it makes perfect sense to get that little piece of data from the server
    as an Ajax request and add it to the page with DOM interaction. If the request
    will update the entire page, or most of it, it makes better sense to do this as
    a normal round-trip with a page refresh. Use Ajax only where it enhances the performance
    of the operation or the user experience.


    the browser. The process is entirely synchronous—one event complete before the
    next can start. Because an Ajax request is asynchronous, once the request is sent
    off to the server, control is immediately returned to the user, who can continue
    working while request is being fulfilled. When the requested data is delivered
    to the browser from the server, a preassigned callback function is automatically
    called and the data is then processed and displayed by JavaScript.


    The J in Ajax is for JavaScript. JavaScript handles the entire Ajax transaction,
    and this chapter focuses on showing you the programming techniques to implement
    Ajax functionality in your web site.


    The second A in Ajax is simply And.


    The X in Ajax stands for XML. In Jesse James Garrett''s proposal where he first
    used the term, XML was the data format that would be returned from the server.
    However, the term XML is somewhat misleading, because data can be returned in
    many formats, of which XML is one. For example, HTML, plain text, and JavaScript
    Object Notation (JSON) are all commonly requested data formats used in Ajax transactions.
    I''ll show you how to work with these formats later in this chapter.


    JSON is a data format based on the object literal you saw in Chapter 3. Because
    it is a very compact data format and can be evaluated by JavaScript as code, JSON
    is frequently replacing XML as the data format of choice for today''s applications.


    Before starting into the workings of Ajax, let''s consider how communication between
    the browser and server is implemented.'
  merge: -1
