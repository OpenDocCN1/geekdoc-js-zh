    find and modify elements that are not the target of the event, let''s first discuss
    the concepts of event capturing, event bubbling, and event delegation.


    # Capturing and Bubbling


    When an event message is fired (and let''s say it''s a click event for the sake
    of this discussion), click message does not go directly to the target of the event.
    It is first sent to the object at the top of the DOM hierarchy, body, and then
    moves down through the document tree to the target—the object that actually received
    the click. The message''s downward journey to the target element is known as the
    capturing phase.


    Once the message reaches the target object, it travels back up the DOM to the
    body tag. The upward journey is the bubbling phase. After the message makes it
    all the way back up to the body tag, like a salmon swimming upstream to its spawning
    grounds, its life ends.


    You can add an event handler to any element that receives the click message as
    it makes this "down-and-then-up-again" journey. This can bring great efficiencies
    to your code, because you can now apply a technique called event delegation.


    # Event Delegation


    Event delegation is the technique by which you place an event handler on an element
    that is not the target element of the event. The most advantageous use of event
    delegation is when you attach the event handler to the parent of a large number
    of child elements that must all provide a response to a particular event.


    Significant coding economies can be realized by taking advantage of event delegation.
    Instead of attaching individual event handlers to every child, the message of
    interest is allowed to bubble up from whichever child triggered it and is handled
    by a single handler that is attached to the parent element. I''ll show this process
    in the next example. If needed, the event object can supply the name of the target
    element: Then just that one "downstream" element—out of'
