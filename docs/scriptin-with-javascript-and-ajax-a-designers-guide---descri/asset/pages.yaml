  md: 'Using GET, the data argument of the send method is always set to null; you
    don''t need to include any data with the send. If you want to send information
    to further define your request, you can append a query string to the URL, as in
    the previous example where the query string states the user name in the record
    to be retrieved.


    Sending a request with POST. A POST request, which is used when you want to update
    data on the server (such as a database record), requires two additional steps.
    First, you set the request method to POST. Second, don''t append a query string
    to the URL as you do with GET; any data that is part of the request is sent separately
    from the URL as using the send method. To do this, the content type of the HTTP
    header must be set correctly using the XHR object''s setRequestHeader method,
    so that this data is handled correctly when it arrives at the server.


    The open and send steps earlier for GET would look like this for POST:


    ```

    myAjaxObj.open = (''GET'', ''updateUserInfo.php'', true)

    myAjaxObj.setRequestHeader(''Content-Type'', ''application/x-form-urlencoded'')

    myAjaxObj.send(''email=charles@stylincss.com&newEmail=charles@scriptwithajax.com'')

    ```


    # 4. CHECK THAT THE REQUEST WAS SUCCESSFUL WHEN THE SERVER RESPONDS


    Whether you use GET or POST to make your request, your Ajax function now keeps
    track of the request by monitoring the onreadystatechange event handler using
    the anonymous function assigned to it in the previous step. As shown earlier,
    once you get a readyState of 4 and status of 200, the request data has arrived.


    # 5. PASS THE DATA TO THE ASSIGNED CALLBACK FUNCTION SO IT CAN BE USED


    When the callback function is called, it is passed the responseText property value
    as its argument, which is the requested data, and the Ajax function''s work is
    complete.


    That''s it. Here''s what the complete function looks like:'
