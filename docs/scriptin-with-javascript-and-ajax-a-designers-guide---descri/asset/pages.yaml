  md: '# SCRIPT WITH JAVASCRIPT AND AJAX - CHAPTER 1


    server communication to be added, or to use a commonly used and more accurate
    term, "layered on." I''ll just discuss the third step in this chapter but actually
    demonstrate it in Chapter 5.


    Let''s start with step 1—Make it functional—to see what it takes to create a form
    that enables a user to sign up on your site.


    # 1. Make It Functional


    In this example I''ll create a working form. To do this, I only need HTML markup
    to create the form and the server-side language (I''ll use PHP) to validate and
    record the data on the server when the form is submitted.


    # HTML—CREATING THE DOM


    HTML is for structure. If you start by writing good HTML, you will have a great
    foundation on which to layer the CSS and JavaScript.


    Here are some simple guidelines for writing your HTML:


    First, the right element for marking up each piece of your content. Use an HTML
    glossary and learn how each element should be used and the required optional attributes
    can be added. A common mistake is to use the label element on a form''s input
    element (text field). The label element should also have a for attribute the same
    value as the input''s ID to semantically tie the element and label together. In
    this way, if the site is being accessed with a screen reader, the label will be
    read aloud when the user moves the cursor into it.


    I can''t emphasize how important it is to understand the various HTML elements
    and use them appropriately. If you are building the text in paragraph tags to
    create headers or do not understand the difference between block and inline HTML
    elements, you need to improve your knowledge of HTML so you are using its elements
    in semantically meaningful and technically valid ways.


    Second, to this last point, validate your markup at validator.w3c org or use the
    Web Developer toolbar so you can be sure your markup is well-formed with all tags
    nested and closed correctly.


    If you are wondering why I am obsessing over HTML markup in a JavaScript book,
    here''s the reason. When you write HTML, you are actually creating the DOM, which
    is a hierarchical collection of nodes. There are three types of nodes: HTML elements,
    the ele


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_25_0.png)


    For an HTML quick reference listing, go to http://www.wschools.com/tags/default.asp
    For a more complete HTML tutorial, try http://dev.opera.com/articles/view/12-the-basics-of-html.'
