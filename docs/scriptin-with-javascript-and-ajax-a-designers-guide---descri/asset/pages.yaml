- img_proc: true
  md: '# JAVASCRIPT BASICS


    The format to populate an associative array is


    ```

    arrayName[key] = value

    ```


    In the next example, a country name is the key and the name of the country''s
    capital city is the value.


    Here''s how to build an associative array of countries and their capitals


    ```

    var capitalCitiesArray[];

    capitalCitiesArray["USA"] = "Washington DC";

    capitalCitiesArray["England"] = "London";

    capitalCitiesArray["France"] = "Paris";

    capitalCitiesArray["Italy"] = "Rome";

    ```


    The power of an associative array is that you can easily find a value, regardless
    of its position in the array, by referencing its key.


    The format is as that as for an indexed array except instead of using the index
    number you use the key name. The key here is a string, so you have to remember
    it in quotes:


    ```

    var thisCapital = capitalCitiesArray["France"];

    ```


    To reinforce what you saw earlier, note that the variable on the left, thisCapital,
    is set to the evaluated result of the expression capitalCitiesArray["France"],
    which is Paris.


    Even if you sort this associative array, this line of code will still find the
    correct capital because you locate the value by its key, not the indexed position.


    You can also use an object literal in place of an associative array, as you will
    see in the next chapter on objects. An object literal is a simple structure in
    which to store properties and other values. Generally, it''s best to use an object
    literal because the syntax is simpler.'
