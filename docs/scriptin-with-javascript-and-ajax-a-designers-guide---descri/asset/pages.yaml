  md: '# JAVASCRIPT COMES OF AGE


    PHP and HTML can be freely mixed on the page. You can simply write <?php to indicate
    that you are switching from HTML to PHP and write ?> to indicate that you are
    switching back to HTML again. PHP only processes code inside the <? and ?> tags,
    and writes everything else (the HTML) directly to the page it is generating.


    Before I write the code to process the form, there are three bits of PHP I need
    to add to our markup.


    +   1. Enable any error message generated by PHP to be added into that empty p
    element at end of the markup.


    <p class="msg"><?php echo $msg; ?></p>


    Here I can create a PHP variable (temporary data store) $msg that will hold the
    message that PHP selects after at the email address. PHP will then add that message
    to the HTML element with the ID "message" when it writes out the page.


    echo "add to the page output" so the $msg variable will get added here in place
    of <?php echo $msg; ?>. Remember, PHP is never added to the page.


    +   2. Modify the form tag as follows to make the page submit to itself.


    <form id="tiny_form_vert" action="simple_form_step1.php" method="post">


    The highlighted text is the filename of the current page.


    +   3. Echo the email address the user submitted into the form field, because
    then the user can modify it if necessary and not have to entirely retype it.


    <input id="email" name="email" type="text" size="20" value="<?php echo $email;?">


    The email address will replace the highlighted PHP.


    This is called making the field "sticky"—the info stays in the field between form
    submissions. Users will hate you, especially if the form has many fields, if you
    don''t make form elements sticky; they really don''t want to reenter all the data
    to correct an error.


    Here''s the entire PHP script with these three pieces of PHP highlighted.'
