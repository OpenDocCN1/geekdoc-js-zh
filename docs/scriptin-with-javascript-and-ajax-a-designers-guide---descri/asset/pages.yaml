    # Mouse Coordinates


    When an event is triggered by mouse activity, the event object holds sets of x
    and y coordinates for the mouse, which gives the mouse position with respect to
    the event target, the browser window, and the screen. These coordinate sets are
    unevenly supported by the various browsers and will not be covered here. Also,
    you will find rarely need the mouse coordinates; knowing which element is under
    the cursor is usually sufficient information when working with mouse events. However,
    if you use some cross-browser code to help reliably obtain the mouse coordinates,
    check out the research of Peter-Paul Koch at quirksmode.org/js/events_properties.html#position.
    His book, ppk on JavaScript (New Riders, 2007), also has an in-depth discussion
    on working with mouse coordinates.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_139_0.png)


    As illustrated in the previous diagram, what is really interesting about this
    example is that the element with the event body, the element that triggers the
    event is td or, and the element that is modified as a result of the event is tr.
    By combining listeners, event delegation, bubbling, and DOM traversing, you can
    have a single event handler manage events from dozens, hundreds, or thousands
    of child elements and then have the effect after any element that you choose.


    Now that you''ve seen some ways to work with mouse events, let''s take a look
    at the other way the user interacts with your application—the keyboard.


    # The Up and Down Life of Keys


    It''s easy to have a simplistic view of the keyboard: the user just presses a
    key and a character appears, right? The reality—JavaScript''s reality, at least—is
    rather complex. A keystroke is several discrete events, each with its own event
    message. When a key is pressed, the sequence of events is as follows:


    +   keydown is sent when the key makes contact and is immediately followed by
    keypressed.


    +   keypressed is a general event that summarizes a complete key press/release
    cycle.


    Then the character actually appears at the location of the key-board focus.


    +   keyup occurs when the key breaks contact.


    If you hold the key down until it starts to repeat the character, keydown and
    keypressed repeat as well. (I think it''s wrong for keypressed to repeat here,
    but it does.)'
