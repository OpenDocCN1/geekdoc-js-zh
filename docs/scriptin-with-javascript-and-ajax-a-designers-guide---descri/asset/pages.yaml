  md: '# # Scriptin''

    with JavaScript and Ajax

    A Designer''s Guide


    JASCRIPT is the BRAINS of your Web page—it enables you to modify a document''s
    structure, styling, and content in response to user actions, and make Ajax to
    get data from the server without reloading the page. *Scriptin'' with JavaScript
    and Ajax* teaches you how to master this powerful and elegant language so you
    can develop intuitive interactions that take your user experience to new levels
    of sophistication and responsiveness.


    Today''s application-like Web experiences (such as Salesforce.com and Google Maps)
    and Web 2.0 sites (such as Flickr.com and Twitter) are powered by JavaScript and
    Ajax. Using the techniques shown in this book, you will be able to start creating
    similar experiences in the sites design.


    +   *Scriptin'' with JavaScript and Ajax* will teach you how to:

    * Start developing with JavaScript fast!

    * Lightweight but powerful object-oriented code

    * Use DOM scripting to dynamically update the page''s HTML

    * "Progressively enhance" your site so it''s accessible to all users

    * Create sophisticated interactions, such as auto-complete and carousels

    * Work with Ajax frameworks, such as jQuery, YUI, Prototype, and Spry

    * Integrate JavaScript, HTML, CSS, and middleware, such as PHP

    * Adapt the downloadable Scriptin'' example code for use in your projects


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_315_0.png)


    **Charles Wyke-Smith** is the author of *Stylin with CSS: A Designer''s Guide
    and Codin for the Web: A Designer''s Guide to Developing Dynamic Web Sites*. He
    has been creating web sites since 1994 and has provided web design and consulting
    services to companies including Wells Fargo, ESPN Video Games, Benefit. His work
    focuses on online application development, with an emphasis on user experience,
    architecture, and interface design. Charles has taught classes in multimedia and
    interface design and speaks at many Industry conferences.


