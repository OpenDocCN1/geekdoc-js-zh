    So correctly indented code is not only easier to understand, but also lets you
    see your DOM structure at a glance.


    # CHILD NODES


    The next step in understanding the DOM `is` to know that the text within an element
    is a child of that element. For example, the text “Sign up for our newsletter”
    is a text node and a child of the `p` element in which it lives. Its attributes
    are also child nodes of that element, the `id=sign-up` attribute on the `div`
    is a child node of the `div`. JavaScript can access and change element nodes and
    their child nodes text nodes; CSS, with the exception of the pseudo-classes `before`
    and `after` a limited means of adding content to the page, can only access the
    element and attribute nodes.


    From the markup in Figure 1.1, I can draw a hierarchical tree version of the DOM
    from the code that looks like Figure 1.3.


    Figure 1.3 The DOM hierarchy.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_28_0.png)


    Compare this diagram with the markup. You want to be able to see this tree-like
    DOM view in your mind by looking at the markup. If you study the indenting and
    each element''s text and attributes, it''s not hard to do. With this mental model,
    it''s easy to look at any HTML markup and determine how to use CSS and JavaScript
    to access the nodes you want to modify.


    # PROCESSING THE DATA


    As mentioned earlier, I''ll use PHP to process the form. I could write an entire
    book about PHP (actually, I did), but here I will just cover a couple of key points,
    and then simply present the code along with a line-by-line explanation.


    My book, Codin'' for the Web (New Riders, 2007), covers PHP and SQL'
