  md: '# A Note on Security


    Accepting user input opens your site to the potential for code injection and XSS
    (cross-site scripting) attacks. The PHP code that starts on page 1 illustrates
    some steps you can take to protect yourself when receiving data and writing it
    into your file system. First, the input is validated. This not only mitigates
    the chances of the user typing in an incorrect email and wondering why you didn''t
    him anything, but it makes it harder to pass malicious code to your server via
    the form. Second, the action of filtering (the URL which the form will be submitted)
    includes only the page name, not the URL into the page. In that way, you expose
    your folder structure in code—information that could help a potential hacker.
    Then, when you write the file manually, you do not let PHP create a file if there
    is no file creation—unless you create the file manually. Then, when you don''t
    have to provide folder-level access, which would you have to do if you allow PHP
    to create a file, you prevent anyone from writing a file to your file system.
    Fourth, if you choose to put this file is in a folder above the root folder of
    the website, access to it becomes much more difficult. These simple steps will
    make it much harder to break into this form.


    Security is a major issue with JavaScript, unlike PHP, the code is running in
    the browser and is visible and moderate. Learn more about JavaScript security
    issues on the DevArticles site at www.devarticles.com/c/a/JavaScript/JavaScript-Security.


    # 2. Make It Look Good


    Every browser has a built-in style sheet that makes headlines larger than paragraph
    text, makes links blue, and controls the default presentation of HTML. By using
    a style sheet you can override any aspect of the default layout, which is predominantly
    full width elements one under the other running down the page. With CSS, you can
    lay out the HTML in columns if you wish, and style each element to your own liking.


    CSS works by accessing the DOM. Again, I won''t get into a full-on CSS lesson
    here (I already wrote that book), but instead will demonstrate how the DOM is
    accessed by CSS and how to use CSS in ways that support progressive enhancement.


    A CSS rule has the format


    ```

    selector{property:value} in p {color:red};

    ```


    element text red. The property/value pair is collectively known as the declaration.
    This basic rule format can be extended with multiple selectors and rules


    See Table 1.1 for some selectors that target by context—using an ID, or a class,
    or by referencing an element''s ancestor (parent and above)—elements in the DOM:


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_34_0.png)'
  merge: -1
  pgno: 34
