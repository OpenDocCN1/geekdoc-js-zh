  md: '# An Image Carousel


    The first project is called Author Carousel and provides image-based access to
    information about a number of fellow New Riders’ authors and their books. The
    interface is composed of a row of 11 photos. Only three are visible at one time,
    but the user can scroll horizontally through all the images in any of three ways:
    by clicking left and right arrows onscreen, using the left and right keyboard
    arrows, or using the scroll wheel of the mouse, as illustrated in Figure 7.1.


    FIGURE 7.1. A carousel is a compact component that can contain a large number
    of images.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_224_0.png)


    Carousels, named after the trays that hold slides on slide projectors (remember
    them?), have become very popular on the Web. Carousels either side to side or
    rotate their images in a circle. The I’ll show slides side to side. Carousels
    are intuitive and fun to use, allow many items to be viewed and occupy very little
    space in relation to the content they can contain. They also provide a visual
    rather than textual interface, which is especially appropriate for applications
    such as shopping and of course photo sites.


    In this project, a second design pattern, Overlay, is integrated with the carousel.
    If the user clicks on an item in the carousel (in this case, an item comprises
    the author’s picture and the area containing the author’s name below it), an overlay
    with information about that author appears, as shown in Figure 7.2.


    The overlay can be closed by clicking its close box, pressing Escape, or clicking
    anywhere outside of it.


    Learn more about the Carousel design pattern at the Yahoo! Design Pattern Library
    at http://developer.yahoo.com/patterns/pattern.php?pattern=carousel.'
  merge: -1
