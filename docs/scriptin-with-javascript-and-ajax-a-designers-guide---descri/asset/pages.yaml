  md: '# # HTML ASCII REFERENCE


    ASCII is a 7-bit character set containing 128 characters. It contains the numbers
    from 0-9, the uppercase and lowercase English letters from A to Z, and some special
    characters. The character-sets used in modern computers, HTML, and Internet are
    all based on ASCII. The following table lists the 128 ASCII characters.


