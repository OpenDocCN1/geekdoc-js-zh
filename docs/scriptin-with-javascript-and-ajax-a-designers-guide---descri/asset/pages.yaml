    # # Scripts, Statements, and Comments


    A script is a number of lines of JavaScript and is also used as a kind of general
    term for the JavaScript that you write—as “I wrote a new script that does xyz.”
    Within a script are statements and comments.


    # Scripts


    A script can be placed between script tags within your HTML file or in a separate
    text file with the extension .js that is linked to your HTML page using a script
    tag. In the examples in this book, I added the JavaScript into the page so you
    can see it with its associated HTML markup. In a Web site of any size, you will
    want to link JavaScript files to your pages instead of adding the JavaScript directly
    into your document. The scripts are down-loaded only once and cached (stored)
    on the user’s browser, and can be shared between all the pages of the site.


    # Statements


    Each line of script is a statement. A statement is an instruction that JavaScript
    can evaluate (make sense of). Statements end with a semicolon; and it''s standard
    practice to start each statement on a line, although the code will still work
    if you don''t.


    # ON FORMATTING JAVASCRIPT


    As a formatting demonstration, here is a four-line script that adds two numbers
    together:


    ```

    var x=2;

    var y=3;

    alert (x+y);

    // displays 5

    ```


    Each of the first three lines is a statement that JavaScript can evaluate, and
    each ends with a semicolon and a line break (press Return). You can separate statements
    by using line breaks, but this is considered poor practice and makes the code
    confusing if statements wrap to more than one line. Always end a statement with
    a semicolon. The fourth line is a comment, in which case this case states the
    anticipated outcome as shown in Figure 2.2.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_45_0.png)'
