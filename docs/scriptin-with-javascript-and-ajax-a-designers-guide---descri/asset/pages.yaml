  md: '# How to Use the XMLHttpRequest (XHR) Object


    To use XMLHttpRequest object, you must be able to communicate with it and then
    monitor its activity so you know when it has successfully acquired the requested
    data. The way you do this is to write a function that can communicate with the
    browser''s XHR object and handle all your application''s Ajax requests.


    This kind of function is known as a wrapper. A wrapper serves as an interface
    to a piece of unusually complex functionality—in this case, the XHR object—and
    manages all communication with it. Your code will talk to the wrapper function,
    and the wrapper will be written to handle the complexities of managing the XHR
    object. When you call this wrapper function, you will simply pass it two arguments:


    +   * the name of the requested resource—a filename that will provide the data
    you want from the server

    * the name of your callback function—a function that will be called when the request
    completes. This function will receive the returned data and process it in some
    way according to your application''s needs.


    XMLHttpRequest wrapper function greatly simplifies your life because it abstracts
    away the rest of your code all the complexities of managing an Ajax transaction
    and the associated cross-browser differences. At any point step where your code
    requires data from the server, you can just call this Ajax function, passing the
    two required arguments. When the transaction is complete and the requested data
    is returned, the wrapper function will pass the data to the specified callback
    function—the function you will write to process the returned data. Once the callback
    function is called, the process is complete.


    I will show you, step by step, how to write this wrapper function (that I will
    name ajaxRequest), which will help you understand exactly how an Ajax transaction
    works. Of course, you don''t actually have to write this function if you don''t
    want to; you can find it in the Chapter 5 code examples. This function will perform
    the following steps:


    +   * Create a new instance of the XHR object.

    * Define a function to monitor the request''s progress.

    * Send the request via the XHR instance.


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_156_0.png)


    You can see this completed ajaxRequest function on page 144.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '+   4. Check that the request was successful when the server responds.


    +   5. Pass the returned data to the assigned callback function so it can be used.


    Let''s look at each step.


    # 1. CREATE A NEW INSTANCE OF THE XHR OBJECT


    The first step using the XHR object is to instantiate a new instance of it. In
    this example, I''ll store it in a variable called ajaxObj. For a W3C browser,
    you would write


    ```

    ajaxObj = new XMLHttpRequest();

    ```


    and for a Microsoft browser, you would write


    ```

    ajaxObj = new ActiveX("Microsoft.XMLHTTP");

    ```


    You can write this as a one-step, cross-browser instantiation like this:


    ```

    var ajaxObj = (window.ActiveObject)

    ```


    ```

    ? new XMLHttpRequest())

    :new ActiveX("Microsoft.XMLHTTP");

    ```


    After you have instantiated the XHR object, you can then use its properties and
    methods to request and manage the movement of data between the browser and Web
    server.


    # 2. DEFINE A FUNCTION TO MONITOR THE REQUEST


    A crucial component of the XHR process is the server''s communication with the
    browser. Without this feedback from the server, you would never know when the
    request has completed. At key points in the process, the server updates the XHR
    object''s readystate property with a numerical value that defines the current
    state of the request.


    The five possible values are:


    +   0 = uninitialized—the object exists but the open method has not been called


    +   1 = loading—the open method has been called but the send method has not


    ![](img/ae7d82232d0a9673413a1d784d82b4e0_157_0.png)


    I have broken this into three lines for clarity, but it''s the same ternary if
    statement format of (test) ? true : false stuff I used for the cross-browser object
    creation in Chapter 4.'
