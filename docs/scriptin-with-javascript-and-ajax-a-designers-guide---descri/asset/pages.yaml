  md: '# SCRIPTIN'' WITH JAVASCRIPT AND AJAX - CHAPTER 2


    This system of indexing from 0 instead of 1 may seem strange at first, but once
    you start extracting elements in a programmatic way using loops, it will make
    more sense.


    # ADDING AN ELEMENT TO AN ARRAY


    You can add elements into an array at any time. Let''s add goat to our array,
    like this:


    ```

    animalArray.push(''goat'');

    ```


    array now contains:


    ```

    var animalArray = ["dog", "cat", "pig", "horse", "sheep",

    "goat"];

    ```


    The Array method push (imore on methods later) adds the stated element to end
    the end of the array, so "goat" is now added as a new element in the last position
    in the array.


    # SORTING AN ARRAY


    You can sort the array alphabetically, using the sort method:


    ```

    sort(animalArray);

    ```


    Then the array sequence changes to:


    ```

    var animalArray = ["cat", "dog", "goat", "horse", "pig",

    "sheep"];

    ```


    If you display the element where "goat" was located in the previous example


    ```

    alert (animalArray[3]);

    ```


    you now get "horse" because it is at index 3 in this alphabetized array.


    # ASSOCIATIVE ARRAYS


    So far you''ve seen an indexed array where you can reference the elements by their
    index (numerical position). But there is a second kind of array known as an associative
    array that has elements that are each made of two parts: a key and a value. The
    key is a text string that allows you to associate each value with an actual name.'
  merge: -1
