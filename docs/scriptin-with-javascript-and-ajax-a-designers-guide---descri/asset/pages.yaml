    a syntax like this:


    ```

    var loader = new YAHOO.util.YUILoader ( { map of properties } )

    ```


    The object constructor can be customized with a map of properties that is passed
    as an argument when it''s instantiated. The most important of these properties
    in this case is require:`autocomplete`, which tells the loader to load the AutoComplete
    Control and all its supporting components. I also define an onSuccess function.
    You might imagine from its name, this function is triggered by the Loader event
    that fires once the required components are loaded. I use this event to start
    the next step—initializing the AutoComplete Control—confident that everything
    I need to make it work is loaded.


    # INITIALIZING THE AUTOCOMPLETE CONTROL


    The AutoComplete Control likes its data in JSON, so I have PHP write the data
    that it is holding in a variable called $locationnames into the page as a string
    of JSON here inside the JavaScript code:


    ```

    var locations = <?php echo json_encode($locationnames);?>

    ```


    Of course PHP does this work on the server before the page is sent to the browser.
    Then, when the browser runs the JavaScript, the JSON string is already written
    into the page in place of the highighted PHP. If you view Generated Source using
    the Web Developer toolbar, you can see all the location data within this block
    of code.


    Now that I have the JSON location data in the locations variable, I use this to
    define the data source object for the AutoComplete Control.


    ```

    var dataSource = new YAHOO.util.LocalDataSource(locations);

    ```


    Now I can instantiate a AutoComplete instance. The three required arguments are
    the ID of the text field into which the user will be typing, the ID of the element
    that will display the results, and the data source object.


    ```

    var autocomplete = new YAHOO.widget.AutoComplete(''location'',''autocomplete'',dataSource);

    ```


    I''ve now done what''s needed to make the AutoComplete Control work, but I have
    a few small customizations I want to make to make it work'
