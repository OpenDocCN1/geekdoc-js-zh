  trans: "\n```html\ninvisible.html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"UTF-8\">\n  <title></title>\n</head>\n<body>\n  <script type=\"\
    text/javascript\" defer>\n      const ipc = require('electron').ipcRenderer;\n\
    \      const BrowserWindow = require('electron').remote.BrowserWindow;\n\n   \
    \   ipc.on('compute-factorial', function (event, number, fromWindowId) {\n   \
    \     const result = factorial(number);\n        const fromWindow = BrowserWindow.fromId(fromWindowId);\n\
    \        fromWindow.webContents.send('factorial-computed', number, result);\n\
    \        window.close();\n      });\n\n      function factorial(num) {\n     \
    \   if (num === 0) return 1;\n        return num * factorial(num - 1);\n     \
    \ }\n  </script>\n</body>\n</html>\n```\n\n这是我们第二个（隐藏）窗口的 HTML 和 Javascript 代码。在第\
    \ #10 行和第 #11 行，我们直接导入了 `ipcRenderer` 模块和 `browserWindow` 模块，这与 `renderer.js`\
    \ 文件中的第 #1 行和第 #2 行类似，但它看起来像 `preload.js` 文件中的第 #1 行和第 #2 行。这种视觉上的差异是因为在 `renderer.js`\
    \ 中我们默认关闭了 NodeJS 集成，因此我们必须通过 `preload.js` 使用 NodeJS 功能。然而，在隐藏窗口中，我们开启了 NodeJS\
    \ 集成，因此我们不需要 `preload.js` 为我们导入 node 模块。这也是 Electron 中的一个安全漏洞，我们需要谨慎地使用这些功能。仅仅因为窗口中关闭了\
    \ NodeJS 并不意味着它是安全的。使用不当，在极端情况下会对你的设备硬件造成巨大伤害。\n\n在接收到 `compute-factorial` 通道的通信尝试（来自\
    \ `renderer.js` 的 #25 行）时，第一条信息（在此情况下为输入）被赋值给名为 `number` 的参数，第二条信息（窗口 ID）被赋值给名为\
    \ `fromWindowID` 的参数。然后，在第 #14 行使用 #20 到 #23 行的函数计算阶乘。\n\n然后，在第 #15 行，我们使用 `BrowserWindow`\
    \ 类的 `fromId()` 方法通过其 id（保存在 `fromWindowID` 参数中）来获取第一个窗口。第二个窗口的对象随后被赋值给 `fromWindow`\
    \ 变量。选择 `fromWindow` 这个名字可能是因为通信是来自这个窗口（第一个窗口）。\n\n最后，第 #16 行的代码使用 `webContents`\
    \ 方法（事件发射器）通过 `factorial-computed` 通道将计算出的答案发送回第一个窗口。被计算阶乘的数字也会被发送。然后，在第 #17 行，第二个（隐藏）窗口关闭关闭了自己，因为它的工作已经完成且不再需要了。\n\
    \n```html\nindex.html\n<!DOCTYPE html>\n<html>\n<head></head>\n<body>\n  <button\
    \ id='send-btn'>查找阶乘</button>\n  <p id='msg'></p>\n  <script src=\"./renderer.js\"\
    \ defer></script>\n</body>\n</html>\n```\n\n这只是一个基础 HTML 文件，在这里有一个按钮、一个 id 为 `msg`\
    \ 的回复框，以及我们通过 `defer` 加载的 `renderer.js` 文件。如果处理得当，我们现在可以在两个独立的窗口之间进行通信，无需主进程的任何帮助。在\
    \ `ipcRenderer` 和 `ipcMain` 模块中还有其他方法，如 `listenOnce`、`removeListeners` 等。但在继续学习它们之前，我们应该掌握上面所示的\
    \ IPC 过程。请参阅 Electron 文档。此外，尽可能避免 IPC，IPC 会使应用程序变得不安全且更容易出错。\n\n欲读更多请访问：\n- https://www.electronjs.org/docs/api/ipc-main\n\
    - https://www.electronjs.org/docs/api/ipc-renderer\n- https://nodejs.org/api/events.html#events_class_eventemitter\n\
    \n## dialog 模块\n\nElectron 中的 `dialog` 模块用于创建名为对话框（Dialogues）的外部窗口，这些窗口可以用于打开文件和目录、保存文件、显示错误消息以及通过对话框提示用户。Electron\
    \ 为对话框和通知提供了非常原生接口，例如，Windows 用户将在 Windows 资源管理器中看到对话框，Linux 用户将看到他们的原生文件管理器和通知程序如\
    \ `pcmanfm`、`notify-send` 等。\n\n### 错误对话框\n\n当软件遇到错误时，我们需要向最终用户显示一条有用的信息，类似于联系用户支持或错误代码，以便人们可以诊断与错误相关的问题。无论哪种，我们首先需要学习抛出一个窗口错误，为之请使用以下代码，基于\
    \ electron-quick-start 方法进行构建：\n\n```html\nindex.html\n<!DOCTYPE html>\n<html>\n\
    <body>\n  <button id='btn'>错误按钮</button>\n  <script src=\"./renderer.js\"></script>\n\
    </body>\n</html>\n```\n\n只是一个简单的网页，带有一个 id 为 `btn` 的按钮。`renderer.js` 脚本在这里也被加载。\n\
    \n```javascript\nrenderer.js\nconst { ipcRenderer } = require('electron');\n\n\
    const btn = document.getElementById('btn');\n\nbtn.addEventListener('click', (event)\
    \ => {\n  ipcRenderer.send('throw-error');\n});\n```\n\n另一个标准的 `renderer.js` 文件。在这里，我们获取了\
    \ `btn` 按钮，然后为它添加了 `click` 事件监听器。这里唯一新奇的是第 #6 行的代码，用于通过 `throw-error` 通道发送通信；这里的通道名称是任意的。这里发生的情况是，当按钮被点击时，一个空信号通过\
    \ `throw-error` 通道进行通信，这让另一端知道按钮被点击了；在这种情况下，另一端是主进程。\n\n```javascript\nmain.js\n\
    const { app, BrowserWindow, ipcMain, dialog } = require('electron')\nconst path\
    \ = require('path')\n\nipcMain.on('throw-error', (event) => {\n  dialog.showErrorBox('错误标题',\
    \ '错误详情.');\n});\n\nfunction createWindow () {\n  const mainWindow = new BrowserWindow({\n\
    \    width: 800,\n    height: 600,\n    webPreferences: {\n      preload: path.join(__dirname,\
    \ 'preload.js'),\n      nodeIntegration: true\n    }\n  })\n  mainWindow.loadFile('index.html')\n\
    }\napp.whenReady().then(() => {\n  createWindow()\n})\n\napp.on('window-all-closed',\
    \ function () {\n  if (process.platform !== 'darwin') app.quit()\n})\n```\n\n\
    与 electron-quick-start 中的默认代码相比没有变化，只有第 #5 行到第 #6 行的代码是新的，第 #15 行的代码也是新的；我们导入了\
    \ `ipcMain` 和 `dialog` 模块。在第 #4 行到第 #6 行，我们的主进程设置为监听 `throw-error` 通道，一旦接收到任何通信，它就会使用第\
    \ #5 行 `dialog` 模块的 `showErrorBox()` 方法显示错误。错误将具有标题“错误标题”和消息“错误详情.”。你可以在这里使用自己的标题，但总有一定的错误命名和编码方案（本书未涵盖）。你可以通过观察其他软件、阅读操作系统提供的开发者指南（通常带有开发工具包即\
    \ SDK）、阅读你公司的 lint 规则等来学习这些方案。注意这里，接收到的通信内容是无关紧要的，因为我们没有对这些内容进行任何操作。\n\n信息对话框\n\
    \n打开文件或目录由 3 个部分组成：\n\n"
- fmt: "\n1. Inter-process communication which tells the main process when to open\
    \ an ‘Open File’ dialog when the user clicks something in the renderer process.\
    \ Uses the `ipcMain` and `ipcRenderer` modules.\n\n2. Dialog configuration and\
    \ activation tells the main process which what type of file or directory opening\
    \ dialog will you be opening. Uses the `dialog` module.\n\n3. Using the `FS` module\
    \ to work with the content’s of the file . This isn’t covered here, since this\
    \ has less to do with ElectronJS and more to do with NodeJS; still we will cover\
    \ it later when we’re making projects.\n\nUse the code provided below for a demo\
    \ of this type of dialogue, build this off the `electron-quick-start` scaffold:`index.html`\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n    <button id='open-file-button'>Open\
    \ file</button>\n    <p id='file-url'></p>\n    <script src=\"./renderer.js\"\
    \ defer></script>\n</body>\n</html>\n```\n\nPretty standard, a button to open\
    \ file dialogue, a paragraph element to show the selected file’s URL, and the\
    \ `renderer.js` script loaded.\n\n`renderer.js`\n\n```javascript\nconst { ipcRenderer\
    \ } = require('electron')\n\nconst syncMsgBtn = document.getElementById('open-file-button')\n\
    \nsyncMsgBtn.addEventListener('click', () => {\n    const reply = ipcRenderer.sendSync('sync-file-open');\n\
    \    const message = `Selection: ${reply}`;\n    document.getElementById('file-url').innerHTML\
    \ = message;\n    // Use the URL of the files as you like\n})\n```\n\nWe have\
    \ a sync-communication setup from lines #5 to #10, on line #6 we send an empty\
    \ signal over the `sync-file-open` channel, this lets the main process know that\
    \ the button has been clicked. Line #7 and #8 displays the reply (which is the\
    \ file URL we would've selected) on our web-page. Since this is synchronous communication\
    \ we can use a single channel to send and receive information.\n\n`main.js`\n\n\
    ```javascript\nconst { app, BrowserWindow, ipcMain, dialog } = require('electron')\n\
    const path = require('path')\n\nipcMain.on('sync-file-open', (event, arg) => {\n\
    \    dialog.showOpenDialog({\n        properties: ['openFile', 'multiSelections'],//openDirectory\n\
    \        filters: [{name: 'Images', extensions: ['jpg', 'png']}]\n    }).then(selection\
    \ => {\n        // Use the fs module to work with files here\n        event.returnValue\
    \ = selection.filePaths;\n    });\n});\n```\n\nThe whole file will be a standard\
    \ `electron-quick-start`main.js` file, with `ipcMain`, and `dialog` modules imported,\
    \ and code setup for sync-communication from line #4 to #12 over the `sync-file-open`\
    \ channel for both sending and receiving information. The code from line #5 to\
    \ #8 uses the `dialog` module to open a dialog for “file or directory selection”,\
    \ here line #6 tells the dialog to open “files only” (not directories), and line\
    \ #7 tells the dialog to only be able to select images with ‘jpg’ and ‘png’ extensions.\
    \ Then the code from line #8 to #10 is used to resolve the dialog (it will be\
    \ resolved when we finally select a file) using a `then()` method, and send the\
    \ returned selection back over the channel by assigning it to the `event.returnValue`\
    \ property of our event ; here our event is our main process receiving the communication.\n\
    \n### Save Dialog\n\nIf you want to save a file you need to use the `fs` module\
    \ of NodeJS (not covered here, but in a later section with a practice project),\
    \ however, we will demonstrate the use of a save dialogue which will do the following\
    \ for you:\n\n1. It will open up when the user clicks the “save file” button.\n\
    2. The user will pick a directory and a file-name, and the dialog will return\
    \ the combined URL.\n3. You can then use this URL with the `fs` module to actually\
    \ save the file. If, by this time you don’t know how to use the `fs` module, or\
    \ what the `fs` module is then we suggest you get a good grasp on it before getting\
    \ to the practice project section.\n"
