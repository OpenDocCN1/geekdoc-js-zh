- fmt: "\n```html\ninvisible.html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n \
    \ <meta charset=\"UTF-8\">\n  <title></title>\n</head>\n<body>\n  <script type=\"\
    text/javascript\" defer>\n      const ipc = require('electron').ipcRenderer;\n\
    \      const BrowserWindow = require('electron').remote.BrowserWindow;\n\n   \
    \   ipc.on('compute-factorial', function (event, number, fromWindowId) {\n   \
    \     const result = factorial(number);\n        const fromWindow = BrowserWindow.fromId(fromWindowId);\n\
    \        fromWindow.webContents.send('factorial-computed', number, result);\n\
    \        window.close();\n      });\n\n      function factorial(num) {\n     \
    \   if (num === 0) return 1;\n        return num * factorial(num - 1);\n     \
    \ }\n  </script>\n</body>\n</html>\n```\n\nThis is the HTML and Javascript code\
    \ for our 2nd (invisible) window. Here on line #10 and #11 we’ve directly imported\
    \ the `ipcRenderer` module and the `browserWindow` module, this is similar to\
    \ line #1 and #2 in the `renderer.js` file, however it looks like line #1 and\
    \ #2 in the `preload.js` file. This visual difference is because while in `renderer.js`\
    \ we have NodeJS integration turned off by default, hence we have to use NodeJS\
    \ features through `preload.js`. However, in the invisible window we have NodeJS\
    \ integration turned on, and hence we don’t need `preload.js` to import node modules\
    \ for us. This is also a security vulnerability in Electron, we need to use these\
    \ features carefully. Just because NodeJS is turned off in a window, doesn't mean\
    \ it’s safe. Wrongly used, in extreme cases you can cause great harm to the hardware\
    \ of your device.\n\nUpon receiving communication attempt on channel `compute-factorial`\
    \ (from line #25 in `renderer.js`) the first piece of information (in this case\
    \ input) is assigned to the parameter named `number`, and the 2nd piece of information\
    \ (windowID) is assigned to the parameter named `fromWindowID`. Then, a factorial\
    \ is calculated on line #14 using the function from #20 to #23.\n\nThen, on line\
    \ #15 we’ve use the `fromId()` method of the `BrowserWindow` class to grab on\
    \ the 1st window using it’s id (which is saved in the `fromWindowID` parameter).\
    \ The 2nd window’s object is then assigned to the `fromWindow` variable. The name\
    \ `fromWindow` is probably chosen because the communication is coming from this\
    \ window (the 1st window).\n\nFinally, the code on line #16 is using the `webContents`\
    \ method (eventEmitter) to send the computed answer back to the 1st window using\
    \ the channel `factorial-computed`. The number who’s factorial is computed is\
    \ also sent. Then on line #17, the 2nd (invisible) window closes itself since\
    \ it’s work is done and it’s not needed anymore.\n\n```html\nindex.html\n<!DOCTYPE\
    \ html>\n<html>\n<head></head>\n<body>\n  <button id='send-btn'>Find Factorial</button>\n\
    \  <p id='msg'></p>\n  <script src=\"./renderer.js\" defer></script>\n</body>\n\
    </html>\n```\n\nThe is just a basic HTML file, here we have a button, a reply\
    \ box with id `msg`, and out `renderer.js` file loaded with `defer`. Done properly,\
    \ we can now communicate between two independent windows, without any help from\
    \ the main process. There are other methods in both `ipcRenderer` and `ipcMain`\
    \ modules, like `listenOnce`, `removeListeners`, etc. However, before moving on\
    \ to them we should master the IPC process shown above. See Electron Docs for\
    \ which. Also, avoid IPC whenever possible, IPC makes our app unsecured and more\
    \ fallible.\n\nFor further reading see:\n- https://www.electronjs.org/docs/api/ipc-main\n\
    - https://www.electronjs.org/docs/api/ipc-renderer\n- https://nodejs.org/api/events.html#events_class_eventemitter\n\
    \n## The Dialogue module\n\nThe dialogue module in Electron is used to create\
    \ external windows known as Dialogues, these windows can then be used to Open\
    \ Files and Directories, Save Files, Display Error messages, and Prompt the user\
    \ with dialogues. Electron has a very native interface for Dialogues and Notifications,\
    \ for example Windows users will see dialogues in Windows explorer, Linux users\
    \ will see their native file manager and notification programs like `pcmanfm`,\
    \ `notify-send`, etc.\n\n### Error dialogue\n\nWhen the software encounter’s error\
    \ we need to display a helpful message to the end-user, something like contact\
    \ user-support, or an error code so the someone can diagnose the problem associated\
    \ with that error. Either way, we need to learn to throw a windowed error first,\
    \ to do that use the following code, building it upon the electron-quick-start\
    \ approach:\n\n```html\nindex.html\n<!DOCTYPE html>\n<html>\n<body>\n  <button\
    \ id='btn'>Error Button</button>\n  <script src=\"./renderer.js\"></script>\n\
    </body>\n</html>\n```\n\nJust a simple web-page, with a button with Id `btn`.\
    \ The `renderer.js` script is also loaded here.\n\n```javascript\nrenderer.js\n\
    const { ipcRenderer } = require('electron');\n\nconst btn = document.getElementById('btn');\n\
    \nbtn.addEventListener('click', (event) => {\n  ipcRenderer.send('throw-error');\n\
    });\n```\n\nAnother standard `renderer.js` file. Here, we’ve grabbed the `btn`\
    \ button, then added a `click` event listener to it. The only novel thing here\
    \ is the code on line #6, which is used to send communication over the `throw-error`\
    \ channel; here the channel name is arbitrary. What happens here is that when\
    \ the button is clicked, an empty signal is communicated over the `throw-error`\
    \ channel, this let’s the other side know that the button is clicked; in this\
    \ case the other side is the main process.\n\n```javascript\nmain.js\nconst {\
    \ app, BrowserWindow, ipcMain, dialog } = require('electron')\nconst path = require('path')\n\
    \nipcMain.on('throw-error', (event) => {\n  dialog.showErrorBox('Error Heading',\
    \ 'Error details.');\n});\n\nfunction createWindow () {\n  const mainWindow =\
    \ new BrowserWindow({\n    width: 800,\n    height: 600,\n    webPreferences:\
    \ {\n      preload: path.join(__dirname, 'preload.js'),\n      nodeIntegration:\
    \ true\n    }\n  })\n  mainWindow.loadFile('index.html')\n}\napp.whenReady().then(()\
    \ => {\n  createWindow()\n})\n\napp.on('window-all-closed', function () {\n  if\
    \ (process.platform !== 'darwin') app.quit()\n})\n```\n\nNot much has changed\
    \ here compared to the default code in electron-quick-start, only the code on\
    \ line #5 to #6 is new, and the code on line #15 too; we’ve imported the `ipcMain`\
    \ and `dialog` modules. On line #4 to #6 our main process is set to listen to\
    \ the `throw-error` channel, once it receives any communication it uses `dialog`\
    \ module’s `showErrorBox()` method on line #5 to display an error. The error will\
    \ have the heading \"Error Heading\" and the message \"Error details.\". You can\
    \ use your own heading here however is always a certain scheme of error naming\
    \ and coding (not covered this book). You can learn these schemes by observing\
    \ other software, reading the developer’s guides provided by operating system\
    \ (usually with Development Kit aka SDK), reading your company’s linting and etc.\
    \ Note here, the contents of the communication received are irreverent since we’re\
    \ doing anything with those contents, even an empty message will trigger this\
    \ listener. Now the code on line #15 is used to turn onintegration, this is done\
    \ so we can use NodeJS features without help from `preload.js`, however we’ve\
    \ done it for the sake of variety. If properly we should see the following web\
    \ page with the accompanied error. Your interface may dramatically differ from\
    \ mine since I’m using a customized linux environment.(Image0039.jpg)\n\n## Information\
    \ Dialogues\n\nInformation Dialogues provide options to the user, so we can take\
    \ input from the user through dialogues. Use the following code, building it upon\
    \ the electron-quick-start approach:\n\n```html\nindex.html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <button id='info-btn'>Information Button</button>\n  <p id=\"\
    info-selection\">Selection</p>\n  <script src=\"./renderer.js\"></script>\n</body>\n\
    </html>\n```\n\nJust a simple web-page, with a button with Id `info-btn`, and\
    \ a paragraph element id `info-selection`. The `renderer.js` script is also loaded\
    \ here. `info-btn` button is used to send a signal to the main process to open\
    \ an information. The `info-selection` paragraph element is used to display the\
    \ picked.\n\n```javascript\nrenderer.js\nconst { ipcRenderer } = require('electron')\n\
    \nconst btn = document.getElementById('info-btn')\n\nbtn.addEventListener('click',\
    \ (event) => {\n  ipcRenderer.send('info-dialog')\n})\n\nipcRenderer.on('info-dialog-selection',\
    \ (event, index) => {\n  let message = 'You selected '\n  if ( index === 0 ) message\
    \ += 'yes.'\n  else message += 'no.'\n  document.getElementById('info-selection').innerHTML\
    \ = message\n})\n```\n\nHere, we’ve grabbed the `info-btn` button, then added\
    \ a `click` event listener to it. The code on line #5 uses `ipcRenderer` module’s\
    \ `send()` method to send information over the `info-dialog` channel to the main\
    \ process. In this case the information sent is empty, it’s just to signal that\
    \ the button was clicked. The code from line #9 to #15 uses `ipcRenderer` module’s\
    \ `on()` method to listen for information communicated over `info-dialog-selection`\
    \ channel. When we get a reply from the user (by clicking the information dialog)\
    \ the reply will be stored in the `index` parameter. The reply will be in numbers,\
    \ as in if the user selects option #1 we get ‘0’, if the user selects option #2\
    \ we get ‘1’, etd. It’s zero-indexed! The code form #10 to #13 will check if the\
    \ option picked is 1st option (0th ) or the 2nd option (1st ), and write the assigned\
    \ option to the paragraph element in the web-page.\n\n```javascript\nmain.js\n\
    const { app, BrowserWindow, ipcMain, dialog } = require('electron')\nconst path\
    \ = require('path')\n\nipcMain.on('info-dialog', (event) => {\n  const infoWin\
    \ = {\n    type: 'info',\n    title: 'Information Heading',\n    message: \"Information\
    \ details\",\n    buttons: ['Yes', 'No']\n  }\n  dialog\n  .showMessage(infoWin)\n\
    \  .then ((res) =>\n    event.sender\n      .send('info-dialog-selection', res\
    \ ['response'])\n  });\n})\n\nfunction createWindow () {\n  const mainWindow =\
    \ new BrowserWindow({\n    width: 800,\n    height: 600,\n    webPreferences:\
    \ {\n      preload: path.join(__dirname, 'preload.js'),\n      nodeIntegration:\
    \ true\n    }\n  })\n  mainWindow.loadFile('index.html')\n}\napp.whenReady().then(()\
    \ => {\n  createWindow()\n})\n\napp.on('window-all-closed', function () {\n  if\
    \ (process.platform !== 'darwin') app.quit()\n})\n```\n\nOpening a file or Directory\
    \ is comprised of 3 parts:\n"
