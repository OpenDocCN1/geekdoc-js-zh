    ## 2. Clearview AI（极具争议且可武器化的面部识别）。用户包括（但不限于）美国执法部门，如 `NYPD`（它是全球最大的武装执法机构之一，不包括州警察、辅助警员、学校安全专员、交通警察和退休人员）。该程序被澳大利亚、加拿大、丹麦、挪威等国的执法部门使用。商业用户包括安全公司、Home
    Depot、`AT&T`、`Wells Fargo`、高级研究 AI 中心（沙特阿拉伯的利亚德）、Founders Fund、`SoftBank`等。《纽约时报》将
    Clearview 应用的使用描述为“富人的秘密玩具”。


    ## 3. 谷歌大脑（Google Brain，深度学习与人工智能）研究团队。涉及涉及基于 AI 的加密、图像增强、谷歌翻译、机器人技术等。


    ## 4. 蓝脑计划（瑞士）。目标是通过反向工程哺乳动物的大脑，创建一个啮齿类动物乃至人类的数字大脑。由 `Henry Markram` 领导，他最初的目标是创建一个小鼠的数字新皮柱（新皮层的基本单元），该目标已由
    `Markram` 在 2006 年实现。自成立以来，该项目一直进展。该项目主要由瑞士政府和未来与新兴技术赠金资助。项目使用 `Neuron` 软件进行神经元建模；使用
    `C`、`C++` 和 `FORTRAN` 编写，主要的脚本语言是 `Hoc`（由 `Brian Kernighan`、`Rob Pike` 实现，也用于
    Plan8），同时也可用 `Python`。


    ## 5. Jupyter 项目（目标：支持所有编程语言的交互式数据科学和科学计算）。非营利。被 `Google`、`Microsoft`、`IBM`、`NASA`、伯克利大学等使用。


    ## 6. Humanity+（非营利，`Nick Bostrom`）。一个倡导伦理使用新兴技术来增强人类能力的国际组织。


    ## 7. 2045 计划（非营利，`Dmitry Itskov`）。寿命延伸和半机械领域研究人员的网络和社区。


    ## 8. 埃隆·马斯克（FRS）（Open AI、`Neuralink` 等），已不再是 `Open AI` 的董事成员，但仍是捐赠者，据报道仍有重大关联。拥有
    `Neuralink`。他以尖端公司闻名，包括 `SpaceX`、`Tesla, Inc.`、The Boring Company、`PayPal`、`SolarCity`
    等。他正在超级回路、马斯克电力喷气式飞机、可持续能源、火星殖民等领域开展极其卓越的工作。


    ## 9. 瑞·库兹韦尔（作者、发明家、未来主义者、超人类主义者）。获得国家技术创新奖。入选国家发明家名人堂。拥有 21 个荣誉博士学位。`Kurzweil`、`Google`、`NASA
    Ames 研究中心` 一创建了“奇点大学”。


    ## 10. 彼得·蒂尔（《从零到一》作者、传奇科技和“Founder’s Fund”创始人）。投资组合包括 `Facebook`、`Airbnb`、`Linked-In`、`Yelp
    Inc.`、`Spotify`、`Space X`、`Stripe`、`AltSchool` 和 `ClearView AI` 等。最初通过可转换债券投资
    `Facebook`。曾取代 `Elon Musk` 担任 `PayPal`（当时的 `X.com`）的首席执行官。投资与 AI、寿命延伸、海洋居住相关的研究和创业。他参与了
    `Breakout Labs`，该机构资助运营、政府或学术范围之外的研究。`Thiel Fellowship` 每年向 20 名 23 岁以下的人提供 100,000
    美元，让他们退出大学并创立自己的事业。


    ## 11. 其他著名的候选人包括生命未来协会、火星学会、奇点大学、救生基金会、人类大脑计划、Apache Mahout、`BRAIN Initiative`、Serenata
    de Amor 行、`Cyc`、金星计划等。


    注意：对于那些从学术角度对 AI/ML、机器人、IoT 以及相关技术感兴趣的人，我建议在学术期刊上阅读相关内容，并关注真正从事研究的人的更新，而不是阅读博客或听播客。一个很好的来源是“arXiv.org”。


    ### Cylon、Artoo 和 Gobot

    机器人项目 `Cylon`、`Artoo` 和 `Gobot` 是使用 `JavaScript`、`Ruby` 和 `Go` 语言为机器人、IoT 等硬件编程的框架。当我发现这些项目时，我立刻爱上了它们，这真是巧合啊！`JavaScript`、`Ruby`
    和 `Go` 是我最喜欢的语言。在写作时，支持以下常见的硬件和相关技术：


    1. `Arduino`

    2. `Raspberry Pi`

    3. `Intel Galileo`、`Edison` 和 `IoT Analytics`

    4. `OpenCV` (BSD, 实时计算机视觉库)

    5. `WICED Sense`

    6. `Bebop`（带有双核 CPI、四核 GPU、9GB 闪存内存、1400 万像素摄像头和 WiFi 热点的 Parrot 无人机）。

    7. `Electric Imp` (IoT)

    8. `Joystick`（双摇杆 3、`X-box 360` 以及所有兼容 `SDL` 的 USB 摇杆。）

    9. `键盘`

    10. 音频与语音接口。


    支持以下常见的通用输入输出（即 `GPIO`）设备：


    1. `模拟传感器`

    2. `按钮`

    3. `直接引脚`

    4. `红外距离测距器`

    5. `LED`

    6. `电机`

    7. `继电器`


    支持不仅限于此列表，每天都有越来越多的支持。这些项目带有用于 `HTTP/HTTPS` (REST)、`socket.io` 和 `mqtt` 的模块。


    ### TensorFlowJS

    本质上，`TensorFlow` 以及所有其他机器学习库只是高科技数学函数和例程集合。`TensorFlowJS` 是一个 `JavaScript` 框架，允许我们使用
    `JavaScript` 构建和训练机器学习模型。`TensorFlowJS` 用于构建深度神经网络。它驱动了我们今天一些最强大的 AI 技术。在最近的章节中，我们学习了一些与
    `Tensors` 相关的数学。作为回顾，请记住以下术语：


    1. 4 维 `Tensors`是以 3 维 `Tensors` 为成员的数组。

    2. 3 维 `Tensors`是以 2 维 `Tensors` 为成员的数组。

    3. 2 维 `Tensors`（也称为矩阵）是以 1 维 `Tensors` 为成员的数组。

    4. 1 维 `Tensors`（也称为数组，或向量）是以 0 维 `Tensors` 为成员的数组。

    5. 0 维 `Tensors`（也称为标量）是数字。


    在数学中，`Tensors` 可以具有任意数量的维度，它们的形状由成员及其子成员的长度定义。就像 `Arrays` 一样，`Tensors` 也有索引值！然而它们看起来更像坐标，1
    维 `Tensor` 即 `Array` 的索引值为 `0, 1, 2, 3, 4` 等；2 维 `Tensor` 的索引值为 `(0, 0)`、`(0,
    1)`、`(0, 2)`、`(1, 0)`、`(1, 1)` 等；3 维 `Tensor` 的索引值为 `(0, 0, 0)`、`(0, 0, 1)`、`(1,
    0, 1)`、`(3, 1, 0)` 等，此类如此，维度越高，索引位置中的成员就越多。注意：`Tensors`、`Arrays`、`Matrices`、`Vectors`
    等并不同义。它们在数学和计算机编程中有不同的定义。不要把它们混淆！在 `TensorFlow` 中，`Tensors` 是数据的不可变形式。通过 `TensorFlow`
    我们可以以会话的形式创建、训练、导出和导入 ML 模型。`TensorFlow` 可用于机器学习、数据科学等。事实上，许多人在 `Kaggle` 等网站的数据科学竞赛中使用
    `TensorFlow`、`Keras` 等。`Keras` 可用于导出训练过的模型，而“作为工具的 TensorFlow”可以将模型转换为供 `TensorFlowJS`
    使用的版本。


    ### 设置 TensorFlowJS

    让我们用 `TensorFlowJS` 做一些实际操作。在本节中，我们将学习如何进行基础的 `TensorFlowJS` 设置，我们还将提供一些示例帮助您开始
    TensorFlow。要使用 `TensorFlowJS`，我们可以使用以下包：


    1. `TensorFlowJS` - `npm i @tensorflow/tfjs`

    2. 适用于 NodeJS 的 `TensorFlowJS` - `npm i @tensorflow/tfjs-node`

    3. 带有 GPU 加速的 NodeJS `TensorFlowJS` - `npm i @tensorflow/tfjs-node-gpu`需要在 Linux
    上安装 NVIDIA CUDA 并配备 NVIDIA 显卡。

    4. 以 PIP 工具形式的 `TensorFlowJS` - `pip install tensorflowjs`


