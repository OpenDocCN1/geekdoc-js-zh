  trans: "\n\n# 同步通信\n\n冻结窗口并不总是我们不希望看到的，有时算法（包括 UI）必须在接收响应之前保持停止。让我们使用以下代码来演示主进程与渲染进程之间的同步通信，并再次使用\
    \ `preload.js` 文件为渲染进程提供高级支持。如果使用得当，当我们的应用启动时，我们应该看到一个发送按钮和一个空消息框。当点击按钮时，窗口冻结一会之后，我们应该看到消息框显示“pong”（几乎是瞬间完成的，注意信号没有延迟）。请克隆一个新鲜的\
    \ `electron-quick-start` 项目，并将以下源代码相应地添加到各自的文件。某些文件与之前相同。\n\n### index.html\n\
    与 `asynchronous` 相同。\n\n### preload.js\n与 `asynchronous` 相同。\n\n### renderer.js\n\
    ```javascript\nconst ipcRenderer = window.ipcRenderer;\nconst syncMsgBtn = document.getElementById('send-btn');\n\
    syncMsgBtn.addEventListener('click', () => {\n    const replyMsg = ipcRenderer.sendSync('ipc1',\
    \ 'ping');\n    document.getElementById('msg').innerHTML = replyMsg;\n});\n```\n\
    在第 #4 到 #7 行，我们为发送按钮添加了一个“click”事件监听器。在第 #5 行，我们使用了 `ipcRenderer` 进程的 `sendSync`\
    \ 方法（对应异步通信的 `send`）通过名为 `rendererToMain` 的通道（对应异步通信的 `rendererToMain`，注：此处原文描述与代码逻辑有差异）向主进程发送任意消息“ping”，这行代码将在有人点击我们窗口上的发送按钮时执行。第\
    \ #6 行将获取回复并发布在我们网页的消息框上。\n\n注意这里我们为同步通信只使用了一个通道（`ipc1`），这是因为通道无法传输第二条通信线路，因为在主通信链完成之前软件将一直处于冻结状态。\n\
    \n### main.js\n```javascript\nconst { ipcMain } = require('electron');\nipcMain.on('ipc1',\
    \ (event, arg) => {\n    event.returnValue = 'pong';\n})\n```\n在这里我们导入了 `ipcMain`\
    \ 模块，使用它的 `on` 方法监听 `ipc1` 通道以接收来自任何渲染进程的任何消息，并在接收到消息后通过同一通道发送回复“pong”。`ipc1`\
    \ 是一个唯一的通道名称，只要它是唯一的字符串，可以可以是任何内容。\n\n# 隐藏窗口和远程\n\n在之前的 IPC 示例中，我们涵盖了主进程与渲染进程之间的通信，我们使用了\
    \ `ipcMain` 和 `ipcRenderer` 模块；在本节中，我们将仅使用 `ipcRenderer` 模块，并在两个渲染进程之间进行通信，而不是主进程和渲染进程之间。\n\
    \n现在，有时在窗口中运行代码会损害该窗口的性能，例如冻结窗口、减慢速度甚至破坏其图形。为了避免这种情况，与窗口不直接相关的代码应该在另一个窗口中运行，该窗口通常保持隐藏。为此我们需要\
    \ `remote` 模块和 `ipcRenderer` 模块。`remote` 模块将用于从渲染进程创建新的隐藏窗口，`ipcRenderer` 模块将启用不同窗口之间的通信。\n\
    \n注意：每个窗口都可以是一个独立的渲染进程。克隆 `electron-quick-start` 仓库，在这里我们将找到 3 个文件：\n\n* `main.js`:\
    \ 我们只需要从这里启用 `remote` 模块。\n* `index.html`: 将向此文件添加一个 id 为 `send-btn` 的按钮元素和一个\
    \ id 为 `msg` 的段落元素。此文件将决定我们第 1 个窗口（可见）的外观。\n* `renderer.js`: 此文件将附加到 `index.html`。\n\
    * `preload.js`: 此文件随所有其他 HTML 文件一起加载，就像它附加到每一个文件上一样。\n\n我们将由我们创建第 4 个文件，与 `index.js`\
    \ 并列存在。\n\n* `invisible.html`: 这将是我们隐藏窗口的网页，它将包含一个与 `renderer.js` 文件类似的嵌入 Javascript\
    \ 脚本。\n\n以下是这些文件的代码：\n\n### main.js (仅修改了新的 BrowserWindow 对象):\n```javascript\n\
    const { app, BrowserWindow } = require('electron')\nconst path = require('path')\n\
    \nfunction createWindow() {\n    const mainWindow = new BrowserWindow({\n    \
    \    width: 800,\n        height: 600,\n        webPreferences: {\n          \
    \  preload: path.join(__dirname, 'preload.js'),\n            enableRemoteModule:\
    \ true\n        }\n    })\n\n    mainWindow.loadFile('index.html')\n\n    mainWindow.webContents.openDevTools()\n\
    }\n\napp.whenReady().then(() => {\n    createWindow()\n\n    app.on('activate',\
    \ function () {\n        if (BrowserWindow.getAllWindows().length === 0) createWindow()\n\
    \    })\n})\n```\n在 `main.js` 中，我们保持的代码与 `electron-quick-start` 模板完全相同，但我们在第 #11\
    \ 行此处启用了 `remote` 模块。\n\n### preload.js (在文件末尾添加以下代码):\n```javascript\nconst {\
    \ BrowserWindow } = require('electron').remote\nconst ipcRenderer = require('electron').ipcRenderer\n\
    const path = require('path')\n\nwindow.browserWindow = BrowserWindow;\nwindow.ipcRenderer\
    \ = ipcRenderer;\nwindow.myPath = path;\n```\n这与之前的 IPC 部分保持一致。\n\n### renderer.js:\n\
    ```javascript\nconst BrowserWindow = window.browserWindow;\nconst ipcRenderer\
    \ = window.ipcRenderer;\nconst path = window.myPath;\n\nconst __dirname = path.resolve();\n\
    const invisMsgBtn = document.getElementById('send-btn')\nconst invisReply = document.getElementById('msg')\n\
    \ninvisMsgBtn.addEventListener('click', () => {\n    const windowID = BrowserWindow.getFocusWindow().id;\n\
    \    const invisPath = `file://${path.join(__dirname, 'invisible.html')}`\n  \
    \  let win = new BrowserWindow({\n        width: 400,\n        height: 400,\n\
    \        show: false,\n        webPreferences: {\n            nodeIntegration:\
    \ true,\n            enableRemoteModule: true\n        }\n    })\n    win.loadURL(invisPath)\n\
    \    win.webContents.on('did-finish-load', () => {\n        const input = 100\n\
    \        win.webContents.send('compute-factorial', input, windowID)\n    })\n\
    })\n\nipcRenderer.on('factorial-computed', (event, input, output) => {\n    const\
    \ message = `The factorial of ${input} is ${output}`\n    invisReply.textContent\
    \ = message\n})\n```\n尽可能与之前的 IPC 部分保持一致。我们在 #5 行定义了 `__dirname` 变量，因为我们没有 NodeJS\
    \ 访问。我们将 invisible.html 的路径存储在 `invisPath` 变量中。我们通过代码 #12 到 #20 创建了一个新窗口，通过 #15\
    \ 行的属性将其隐藏，并在 #17 和 #18 行启用了远程模块和 NodeJS 集成，因此隐藏窗口将能够使用 NodeJS 功能，以及允许在需要时创建更多窗口的远程模块。跟踪每个新窗口的\
    \ ID 是明智的（类似于我们在第 #10 行所做的），但我们在这里没有这样做以保持简单。注意这段代码创建了一个新窗口但没有关闭它。关闭操作应该在 #29\
    \ 到 #32 行的函数内部完成，我们之所以说是因为一旦收到回复，隐藏窗口就没有继续存在的理由了。编程真是诗意！在我个人看来，打开窗口的进程应该是跟踪该窗口的进程，然后关闭它。点击\
    \ send-btn 按钮后，我们的渲染进程（第 1 窗口）将执行以下操作：\n\n1. 通过代码 #12 到 #20 创建一个新的（隐藏）窗口。\n2.\
    \ 通过 #21 行的代码向第 2（隐藏）窗口加载 `invisible.html` 页面。\n3. 当第 2（隐藏）窗口页面加载完成后，我们创建一个任意输入数字，然后将其发送给第\
    \ 2（隐藏）窗口。\n\n"
