  trans: '


    在这里，我们使用了 `BrowserWindow` 类的 `webContents.send()` 方法，`webContents` (`eventEmitter`)
    可用于从一个进程向另一个进程发送信息。在这里，我们正通过名为“compute-factorial”的通道发送 `input` 和 `windowID`。


    4. 最后，从 `#29` 到 `#32` 的代码将用于接收来自第二个（不可见的）窗口的回复，并将其显示在 `index.html` 的段落元素中。

