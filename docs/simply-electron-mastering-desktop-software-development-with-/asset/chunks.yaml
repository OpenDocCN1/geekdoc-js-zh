    -R $USER /usr/local/lib/node_modules/` to solve any permissions problems, don’t
    use sudo. Also, replace `/usr/local/lib/node_modules/` with your desired filename
    to get access to it.​ Also, check out https://yeoman.io/generators/ for a list
    of yeoman generators similar to electron’s. You can also create custom generators
    for Yeoman.​ Similarly, check out the following repositories for electron:


    *   https://github.com/electron-userland


    *   https://github.com/maxogden/menubar


    *   https://github.com/sindresorhus/awesome-electron#boilerplates (They have a
    hiring and recruitment area).'
