    becomes “firstName”, “Last Name” becomes “lastName”, etc.5\. Variable names are
    case-sensitive.Each variable can take in 4 types of basic data:1\. Sting : which
    is anything wrapped in symbols like single quotation, double quotation, or back
    ticks.​ For example: ‘Hello World!’, “The Future is here”, or `That is the dream.`.2\.
    Number : which is anything that is an actual Real number, and is not a String
    in the first place.​ For example: 1, 2, or 3.1415.3\. Boolean : which is either
    true or false but not a string.4\. Null or Undefined : which are both distinguished
    data-types meaning a null value or an absence of value.Math with JavaScript​ JavaScript
