- fmt: "\nFrom now on you will write all the code you want in `index.ts` file, then\
    \ compile it to an `index.js` file using the command `tsc index.ts `, and then\
    \ run the app using the `node index.js` command.\n\n## Data-type prejudice\n\n\
    JavaScript is a dynamically typed programming language, and TypeScript adds optional\
    \ static typing to JavaScript. So ultimately we have a dynamically typed language\
    \ which can statically type whenever it wants, breaking the boundaries set by\
    \ data-type prejudice in programming languages.\n\nLet’s look at an example:\n\
    \nHere is JavaScript/ES6 with dynamic typing:\n```javascript\nlet x = 1 ;\nconsole\
    \ . log ( typeof ( x )); // logs: number\nx = ” one ” ;\nconsole . log ( typeof\
    \ ( x )); // logs: string\n```\n\nHere is TypeScript with static typing:\n```typescript\n\
    let x : number = 1 ;\nconsole . log ( typeof ( x )); // logs: number\nx = ” one\
    \ ” ; // Will throw an error\n```\n\nAnd since TypeScript compiles to JavaScript\
    \ it will not compile one line at a time, instead it will compile completely,\
    \ all at once; if there is even a single data-type violation it will throw an\
    \ error that looks like this: `Type '\"one\"' is not assignable to type 'number'.`\n\
    \n## Data-types in TypeScript\n\nTypeScript has all the same data-types as JavaScript,\
    \ and building upon it, TypeScript provides additional data-types. Following is\
    \ a list of Data-types in TypeScript:\n\n1. Number\n2. String\n3. boolean\n4.\
    \ Array (object)\n5. Tuple (object)\n6. Enum (object)\n7. Any\n8. Void\n9. Null\
    \ & Undefined\n10. Never\n11. Object\n\nLet’s learn about them:\n\n### Number\n\
    \nValues like regular numbers, negative numbers, floating point numbers, hexadecimal\
    \ numbers all are covered under the `Number` data-type. Additionally TypeScript\
    \ brings binary numbers, and octal numbers to the table which are also covered\
    \ under the `Number` data-type. Look at the following example:\n\nTypeScript code:\n\
    ```typescript\nlet myNumber : number   = 1 ;\nlet myNegative : number = - 1 ;\n\
    let myFloat : number = 1.5 ;\nlet myHex : number =   0x000f ; //returns 0x000f\n\
    let myBinary : number = 0b0101 ; //returns 5\nlet myOct : number = 0o007 ; //returns\
    \ 7\n```\n\nNotice how the hexadecimal values returned in their original form\
    \ however when transpiled to JavaScript the binary and octal values will be converted\
    \ to regular numbers; we must take this effect into account while working with\
    \ these new features.\n\n### String\n\nStrings declared with single quotations,\
    \ double quotations, and back-ticks (template literals) are all covered under\
    \ the `String` data-type in TypeScript. Look at the following example:\n\nTypeScript\
    \ code:\n```typescript\nlet x : string   = ‘ Hello ’ ;\nlet y : string = “ World\
    \ ” ;\nlet z : string = `${ x } ${ y }!` ; //Returns : “Hello World!”\n```\n\n\
    Notice how we are able to use Template literals without using Babel or looking\
    \ for ES6 support in our browser. These days almost all web browsers supports\
    \ ES6 features, however since TypeScript has all the latest features of ECMAScript\
    \ built-in we can use them without going through Babel. Lets look at what the\
    \ above TypeScript code transpiled to:\n\nPost Transpilation JavaScript code:\n\
    ```javascript\nvar x = 'Hello' ;\nvar y = \"World\" ;\nvar z = x + \" \" + y +\
    \ \"!\" ;\n```\n\nSee how all the TypeScript code was transpiled to JavaScript/ES5\
    \ code. This way we can run TypeScript and the latest ECMAScript features in places\
    \ where we have no support of ES6 at all!\n\n### Boolean\n\nThe boolean data-type\
    \ is very straight forward, variables that are determined to hold a boolean value\
    \ are always either true or false . Look at the following code:\n\nPost Transpilation\
    \ JavaScript code:\n```javascript\nvar x : boolean = false ;\n```\n\n### Array\n\
    \nThe Array data-type represents JavaScript arrays in which all the members are\
    \ of the same data-type. Now there are two ways to statically type arrays in TypeScript,\
    \ let’s look at the following example:\n\nTypescript code:\n```typescript\nlet\
    \ myArray1 : number [] = [ 1 , 2 , 3 , 4 , 5 ];\nlet myArray2 : Array < number\
    \ > = [ 1 , 2 , 3 , 4 , 5 ];\nlet myArray3 : string [] = [ ” one ” , ” two ” ,\
    \ ” three ” ];\nlet myArray4 : Array < number > = [ 1 , 2 , ” three ” ]; //throws\
    \ error\n```\n\nNotice how the Arrays can now only contain a single kind of data-type.\
    \ Also notice that upon mixing multiple data-types in a single array the compiler\
    \ throws an error. For now if you want to make a regular JavaScript array you\
    \ can just mix JavaScript code with TypeScript code.\n\n### Tuple\n\nA Tuple is\
    \ a data-type in TypeScript which allows us to make mixed data-type arrays with\
    \ fixed number of elements. Lets look at the following code:\n\nTypescript code:\n\
    ```typescript\nlet myArray1 : [ number , string ] = [ 1 , “ one ” ]; //returns\
    \ [1, “one”]\nlet myArray2 : [ number , string ] = [ “ one ” , 1 ]; //throws error\n\
    let myArray3 : [ number , string ] = [ 1 , “ one ” , ” two ” ]; //throws error\n\
    ```\n\nNotice how Tuple assignments only work in the correct order, an initialization\
    \ that is supposed to be `[number, string]` will not accept values `[1,”one”]`.\
    \ Also notice how initializing more values than the initially decided amount will\
    \ throw an error.\n\nNow look as we attempt to push values to a Tuple:\n\nTypescript\
    \ code:\n```typescript\nlet myArray : [ number , string ] = [ 1 , “ one ” ]; //returns\
    \ [1, “one”]\nmyArray . push ( 3 );\nmyArray . push ( “ three ” );\nmyArray .\
    \ push ( false ); //throws error\n```\n\nNotice how we can push the predetermined\
    \ values in Tuples, but we can’t add values of data-types that are not given in\
    \ the Tuple. So `[number, string]` can take numbers, and strings, but can’t take\
    \ anything. Now look as we try to log values outside the predetermined Array of\
    \ Tuple.\n\nTypescript code:\n```typescript\nlet myArray : [ number , string ]\
    \ = [ 1 , “ one ” ]; //returns [1, “one”]\nmyArray . push ( 3 );\nconsole . log\
    \ ( myArray ); //logs: [1, \"one\", 3]\nconsole . log ( myArray [ 0 ]); //logs:\
    \ 1\nconsole . log ( myArray [ 1 ]); //logs: \"one\"\nconsole . log ( myArray\
    \ [ 2 ]); //error\n```\n\nNotice that after pushing values to a Tuple we can log\
    \ it like an array but can call values outside the predetermined Array.\n\n###\
    \ Enum\n\nEnum is another helpful feature! It is a data-type in TypeScript that\
    \ gives us a way to correspond a group of values to a group of numbers. Look at\
    \ the following code:\n\nTypeScript code:\n```typescript\nenum Color { Red , Green\
    \ , Blue }\nlet c : Color = Green ;\nlet d = Color[1 ];\nconsole . log ( c );\
    \ //logs 1\nconsole . log ( d ); //logs Green\n```\n\nHere on line #1 we have\
    \ created a kind of Array. If we call `Color.Green` we get the index of `Green`\
    \ returned to us; and if we call `Color[1]` we get the value at index `1` returned\
    \ to us (which is `Green` in case). When assigning a value with the actual value\
    \ from enum we will use the new data-type (`Color` in case) instead of number,\
    \ string. For ease think of enums as JavaScript functions that return key for\
    \ numbers, and index numbers for keys. In the code above the enum starts from\
    \ zero but we can make it start from any index, like the following code:\n\n```typescript\n\
    enum Color { Red = 1 , Green , Blue }\n```\n\nWe can also manually assign each\
    \ value an index like the following example:\n```typescript\nenum Color { Red\
    \ = 1 , Green = 3 , Blue = 4 }\n```\n\nMissing indices will return `undefined`.\n\
    \n### Any\n\nThe `Any` data-type requirement is new in TypeScript, it is what\
    \ it sounds like! It will allow us to pass values of any data-type to variables.\
    \ Lets look at the following code:\n\n```typescript\nlet x : any = 1 ;\nconsole\
    \ . log ( x );\nconsole . log ( typeof ( x ));\nx = \"one\" ;\nconsole . log (\
    \ x );\n```\n\nThe `Object` type can also allow you to do the same thing but the\
    \ data-type of a variable determined to `any` changes with the data assigned to\
    \ it, thus allowing the methods of those data-types to be applied on the variable.\
    \ In contrast if a variable is determined to be of `object` data-type then there\
    \ will be no methods of the string, number, etc. present in it. For example:\n\
    \n```typescript\nlet x : any = 1 ;\nconsole . log ( x ++ );\nx = \"one\"\nconsole\
    \ . log ( x . length );\n```\n\nThe code provided above won’t work if the data-type\
    \ was determined be `Object` instead of `any`. Lines #2, and #5 would throw an\
    \ error.\n\n### Void\n\nVoid is a data-type determination used on functions that\
    \ don’t return anything. If we determine a variable to be of `void` data-type\
    \ then we can only assign it values like `null`, and `undefined`.\n\n### Null\
    \ & Undefined\n\nNull and Undefined are data-types that both represent an absence\
    \ of value. The main difference is that `null` is an absence of value that is\
    \ assigned to a variable; in contrast `undefined` tells us that no value has been\
    \ assigned to a variable, hence it lacks a value.\n\nNever is a data-type that\
    \ is used to predetermine the output of a `Function`. It tells the compiler that\
    \ this function will never return data as output. For example a function that\
    \ always throws an error or returns an error object is never actually returning\
    \ a value that is plain data like a number, or a string.\n\nObject is a data-type\
    \ that is anything that isn’t “primitive data”. Simply speaking anything is not\
    \ a number, string, boolean, symbol, null, or undefined.\n\n### Type Assertions\n\
    \nThere are times when we know what to do better than TypeScript does, for those\
    \ times we have Type assertions. They are a way to tell the compiler “trust me,\
    \ I know what I’m doing.”\n\nThere are two ways to write type assertions, the\
    \ “angle-bracket” syntax, and the `as` syntax. Lets look at them:\n\nThe angle-bracket\
    \ syntax:\n```typescript\nlet x : any = 1 ;\nlet y = < number > x ;\nconsole .\
    \ log ( typeof ( y )); //Output: number\n```\n\nThe as syntax:\n```typescript\n\
    let x : any = 1 ;\nlet y = x as number ;\nconsole . log ( typeof ( y )); //Output:\
    \ number\n```\n\nType assertions are just a way to override compiler preferences,\
    \ they shouldn't be used most of the time. If you feel the need to use a type\
    \ assertion then I suggest first revising your code before using it.\n\n## Data-types\
    \ with Functions\n\nStatic typing can also be applied to the parameters and outputs\
    \ of functions, let’s look at the following example.\n\n```typescript\nfunction\
    \ myFunk ( a : number , b : number ) {\n  return a + b ;\n}\nconsole . log ( myFunk\
    \ ( 1 , 2 )); //logs: 3\nconsole . log ( myFunk ( 1 , \"one\" )); //throws error\n\
    ```\n\nThis code will throw an error on the last line like `Argument of type '\"\
    one\"' is not assignable to type 'number'.` This is because in our function’s\
    \ parameters we have determined our parameters to be numbers and values are non-numeric\
    \ can’t be passed as arguments.\n\n```typescript\nfunction myFunk ( a : number\
    \ , b : number ) : number {\n  return a + b ;\n}\n```\n\n### Optional & Default\
    \ parameters\n\nIn simple JavaScript every parameter is optional. However that\
    \ is not true in TypeScript. If we want optional parameters than we use the `?`\
    \ after the parameter name. For example:\n\n```typescript\nfunction myFunk ( a\
    \ , b ? ) {\n  return a + b ;\n}\nconsole . log ( myFunk ( 1 , 2 )); //logs: 3\n\
    console . log ( myFunk ( 1 )); //logs: 1\n```\n\nNotice on 1st line we have the\
    \ default value of `b` set to `0`, this way the parameter `b` is optional, if\
    \ we don’t pass an argument the function will use the default value.\n\n```typescript\n\
    function myFunk ( a , b = 0 ) {\n  return a + b ;\n}\nconsole . log ( myFunk (\
    \ 1 , 2 )); //logs: 3\nconsole . log ( myFunk ( 1 )); //logs: 1\n```\n\n## Class\
    \ based OOP\n\nTypeScript enables us to use Class Oriented Programming. Classes\
    \ are basically Object factories and have been introduced in ES6, and TypeScript\
    \ combines it with static-typing to bring us a lot of stuff. Classes have a structure\
    \ which goes like this:\n\n1. On the first few lines inside Class's body we declare\
    \ properties/members for our Class’s Instances.\n2. After that we define `constructor()`\
    \ which takes in arguments ultimately used by the `constructor()` to initialize\
    \ our properties with values.\n3. Then we follow with methods for our Class’s\
    \ Instances.\n\nLook at the following code:\n\n```typescript\nclass Person {\n\
    \  name : string ;\n  constructor ( myName : string ) {\n    this . name = myName\
    \ ;\n  }\n  intro () {\n    return \"Hello, i am \" + this . name ;\n  }\n}\n\
    let harry = new Person ( \"Harry\" );\nconsole . log ( harry . name ); //logs:\
    \ \"Harry\"\n```\n\nSee how we were able to see the name of the `Harry` instance\
    \ without any special permissions? Not meant to be done like this, there is a\
    \ better way. To avoid this we can also make these members private using the `private`\
    \ modifier as a prefix to the variable declaration.\n\n```typescript\nclass Person\
    \ {\n  private name : string ;\n  constructor ( myName : string ) {\n    this\
    \ . name = myName ;\n  }\n  intro () {\n    return \"Hello, i am \" + this . name\
    \ ;\n  }\n}\nlet harry = new Person ( \"Harry\" );\nconsole . log ( harry . name\
    \ ); //throws error\n```\n\nNow since we have made our `name` member private it\
    \ is not directly accessible. Now it is only accessible via the `intro()` method.\
    \ To access private members from our Instances we use special methods called “Accessors”\
    \ aka “Getters” & “Setters”. Let’s see how to make them:\n\n```typescript\nclass\
    \ Person {\n  private _name : string ;\n  private _age : number ;\n  constructor\
    \ ( myName : string , myAge : number ) {\n    this . _name = myName ;\n    this\
    \ . _age = myAge ;\n  }\n  get name () : string {\n    return this . _name ;\n\
    \  }\n  get age () : number {\n    return this . _age ;\n  }\n  set name ( newName\
    \ : string ) {\n    this . _name = newName ;\n  }\n  set age ( newAge : number\
    \ ) {\n    this . _age = newAge ;\n  }\n}\nlet harry = new Person ( \"Harry\"\
    , 32 );\nlet larry = new Person ( \"Larry\", 33 );\nlet terry = new Person ( \"\
    Terry\", 34 );\nconsole . log ( harry .intro() ); //logs: \"Hello, i am Harry\"\
    \nconsole . log ( larry .intro() ); //logs: \"Hello, i am Larry\"\nconsole . log\
    \ ( terry .intro() ); //logs: \"Hello, i am Terry\"\n```\n\nNotice how we created\
    \ a single Class named `Person` which takes in a parameter `myName` and assigned\
    \ it’s value to the `name` member of our Instances `Harry`, `Larry`, and `Terry`.\
    \ Here `Harry`, `Larry`, and `Terry` are Instances of the `Person` Class . The\
    \ members of Instances like `Harry.name` are public by default. This means the\
    \ data can leak out of our Instances.\n\n```typescript\nclass Person {\n  name\
    \ : string ;\n  constructor ( myName : string ) {\n    this . name = myName ;\n\
    \  }\n  intro () {\n    return \"Hello, i am \" + this . name ;\n  }\n}\nlet harry\
    \ = new Person ( \"Harry\" );\nconsole . log ( harry . name ); //logs: \"Harry\"\
    \n```\n\nTo avoid this we can also make these members private using the `private`\
    \ modifier as a prefix to the variable declaration.\n\n```typescript\nclass Person\
    \ {\n  private name : string ;\n  constructor ( myName : string ) {\n    this\
    \ . name = myName ;\n  }\n  intro () {\n    return \"Hello, i am \" + this . name\
    \ ;\n  }\n}\nlet harry = new Person ( \"Harry\" );\nconsole . log ( harry . name\
    \ ); //throws error\n```\n\n## Modules\n\nModules are containers of reusable code.\
    \ They are an essential part of building software that scales without disruption.\
    \ In TypeScript we have two types of modules:\n\n1. Internal modules\n2. External\
    \ modules.\n\nThere are two ways to write Internal modules: `unnamed` aka `Implicit`\
    \ modules, and `Named` modules aka `Namespaces`. Implicit code is code that is\
    \ written inside the source file, and is not part of a named module, this is considered\
    \ bad practice in general; whenever we should isolate code into named modules.\n\
    \n```typescript\nnamespace ModuleName {\n//write code here\n}\n```\n\nThis is\
    \ a named module, declared with `namespace`, and named with the first letter capitalized\
    \ and the rest camelased. The important thing to remember is that nothing leaks\
    \ outside of this module unless `exported` by the programmer. Let’s look at an\
    \ example:\n\n```typescript\nnamespace Zoo {\n  export class Animal {\n    name\
    \ : string ;\n    constructor ( myName : string ) {\n      this . name = myName\
    \ ;\n    }\n  }\n}\nconst myCat = new Zoo.Animal ( \"Jacob\" );\nconsole . log\
    \ ( myCat ); //logs: Animal { name: 'Jacob' }\n```\n\nIn this code we have used\
    \ the `namespace` keyword to declare an internal module named `Zoo`. Inside this\
    \ module we have a class `Animal` that takes in an argument and assigns it to\
    \ a property `name`. Then we have written a variable `myCat` and made it an instance\
    \ of the class `Animal` by extracting/importing `Animal` from `Zoo`. Essentially\
    \ we have created a class and a single instance of it. There are two things to\
    \ notice here, the first one is the `export` keyword used to export the class\
    \ `Animal` outside of `Zoo` module, the second thing to notice is the dot-notation\
    \ used to access `Animal` from `Zoo` like `Zoo.Animal`.\n\nThis is the way to\
    \ write internal modules aka namespaces. We can also use the `module` keyword\
    \ instead of `namespace` keyword but that practice is discouraged. Now lets look\
    \ at actual `Modules` aka `external modules`. Make a new TypeScript file right\
    \ where `index.ts` file is, and name it `myModule.ts`. Now add the following code\
    \ to it:\n\n```typescript\nexport let x = \"Hello World\";\n```\n\nand then add\
    \ the following code in your `index.ts` file:\n\n```typescript\nimport { x } from\
    \ \"./myModule\";\nconsole . log ( x ); //logs: Hello World\n```\n\nAssuming your\
    \ `tsconfig.json` file (with code shown in the section \"Initializing a tsconfig.json\"\
    ) is in place you can just execute the command `tsc && node index.js` or else\
    \ you can execute the command `tsc index.ts && node index.js `. Together this\
    \ code will log \"Hello World\" to the console/Terminal. Here we have exported\
    \ a variable named `x` using the `export` keyword, however we can export anything\
    \ we want including functions, classes, etc.\n\n## Linting TypeScript with TSLint\n\
    \nLinting basically means wrinkling out any coding and stylistic errors from code.\
    \ TSLint is a code linting tool for lint TypeScript. To see it in action follow\
    \ the subsequent instructions:\n\n1. Open a Terminal/CMD.\n2. Make sure you have\
    \ NodeJS, NPM, and TypeScript installed with the following command: `node -v &&\
    \ npm -v && tsc -v`\nIf you get an output similar to the following then NodeJS\
    \ and NPM is installed properly: `v10.16.3 1.3 Version 3.6.3` Otherwise you need\
    \ to go back to the section \"NodeJS for Electron\" to find instructions to install\
    \ NodeJS and NPM.\n3. Install `TSLint` use the command: `sudo npm i tslint -g`\
    \ Here Windows users don’t need to use `sudo`, instead they need to run CMD as\
    \ administrator. If the operation went fine you should see a similar passage at\
    \ the end of it’s output `+ tslint@5.20.0 added 37 packages from 21 contributors\
    \ in 49.721s`\n4. Use the following command to create a fresh directory for your\
    \ app and move into it: `mkdir myTSLintApp && cd myTSLintApp`\n5. Use the following\
    \ command to initialize TSLint for your project: `tslint --init` This will create\
    \ a `tslint.json` file to configure your TSLint preferences.\n6. Now lets create\
    \ the following files for your app: `index.html`, `index.ts`, `main.css` using\
    \ the following command: `echo >> index.ts` Now you should see the files `index.ts`,\
    \ and `tslint.json` files in your app’s directory.\n7. Now let’s write the following\
    \ code in your `index.ts` file and save it:\n```typescript\nlet x : string = \"\
    Hello World\" ;\nconsole . log ( x );\n```\n8. Now let’s execute the following\
    \ command to run TSLint: `tslint -c tslint.json *.ts` Here we should see a similar\
    \ output to this: `ERROR: index.ts:1:6 - expected nospace before colon in variable-declaration`\n\
    `ERROR: index.ts:2:1 - Calls to 'console.log' are not allowed.`\n`ERROR: index.ts:2:16\
    \ - file should end with a newline`\n\nThe first `ERROR` TSLint caught is the\
    \ presence of a space between `x` and the colon (`:`) on the first line of our\
    \ code, this violates a styling rule in TypeScript called `nospace` rule; technically\
    \ we can run the code without listening to a word TSLint says, but linting our\
    \ code is a desirable practice and we should learn it and make it second nature\
    \ to us. To fix this `nospace` error we can just erase the unwanted space making\
    \ our code look this:\n```typescript\nlet x:string = \"Hello World\" ;\nconsole\
    \ . log ( x );\n```\nNotice the difference between `x : string` and `x:string`\
    \ on the first line in before and after versions of code. Replace the old code\
    \ in the `index.ts` file with this and save it. Lint the code again using the\
    \ following command: `tslint -c tslint.json *.ts` and notice the first ERROR disappearing\
    \ like this:\n`ERROR: index.ts:2:1 - Calls to 'console.log' are not allowed.`\n\
    `ERROR: index.ts:2:16 - file should end with a newline`\n\nThe second `ERROR`\
    \ TSLint caught tells us not to use `console.log` in our code. Usually we need\
    \ to listen to what TSLint says, but this time we need to use `console.log` in\
    \ our code so let’s add an exception in TSLint about the usage of `console.log`.\
    \ To do this we need to modify the `tslint.json` file:\n\n```json\n{\n  \"defaultSeverity\"\
    : \"error\",\n  \"extends\": [\n    \"tslint:recommended\"\n  ],\n  \"jsRules\"\
    : {},\n  \"rules\": {\n    \"no-console\": [ \"log\" ]\n  },\n  \"rulesDirectory\"\
    : []\n}\n```\nNotice here we have added a member named `no-console` to the `rules`\
    \ property. This tells TSLint to avoid enforcing the `no-console` rule while linting.\
    \ The value `log` tells us to just give us light warning instead of an ERROR,\
    \ however these warnings only show up in IDEs like VSCode and Atom. The value\
    \ `log` can also be replace by a simple boolean `false`. Now after modifying and\
    \ saving the `tslint.json` file let’s lint our code again using the command: `tslint\
    \ -c tslint.json *.ts` By this time both the first and the second ERROR should\
    \ be gone, the first one was fixed, and the second one was added as exception.\
    \ The final ERROR tells us to add a new line at the end of our source code: `ERROR:\
    \ index.ts:2:16 - file should end with a newline` To fix this error we have to,\
    \ as the error pointed out add a new line at the end of our source code.\n\nBefore\
    \ adding new line:\n```typescript\nlet x : string = \"Hello World\" ;\nconsole\
    \ . log ( x );\n```\n\nAfter adding new line:\n```typescript\nlet x : string =\
    \ \"Hello World\" ;\nconsole . log ( x );\n```\n3. Run TSLint one final time:\
    \ `tslint`\n4. And your code should be properly linted without ERROR.\n\n## Chapter\
    \ 3 – ElectronJS and Typescript setup\n\nElectron is a JavaScript framework used\
    \ to develop applications for desktop operating systems like Windows, Linux, and\
    \ MacOS using HTML, CSS, and JavaScript. Earlier in this book we also had a brief\
    \ introduction to TypeScript, which is an open-source, augmented version of JavaScript\
    \ by Microsoft. In this book we will use TypeScript & Electron together, However\
    \ separate projects will sometimes be provided for vanilla JavaScript users. To\
    \ get started in Electron + TypeScript follow the instructions in the following\
    \ sub-sections.\n\nTips: A lot of Electron debugging can be done using a web browser.\
    \ If you are editing files like HTML, CSS, or front-end JavaScript/TypeScript\
    \ then feel free to use the web browser for debugging. However code that is written\
    \ for Electron centered files like the code we’ll write in the `main.js` file\
    \ can’t be debugged this way.\n\n### Installing Electron\n\nTo install Electron\
    \ globally on your PC using NPM use the following steps:\n\n1. Open a Terminal/CMD.\
    \ Use sudo or admin privileges when required.\n2. Use the following command to\
    \ verify NPM installation: `node -v && npm -v`\nIf you see version numbers like\
    \ `v10.16.3` and `6.11.3` then move on to the next step. Else go back and install\
    \ NodeJS and NPM.\n3. Use the following command to install Electron: `sudo npm\
    \ i -D electron@latest`\nOr use the following command to install it globally:\
    \ `sudo npm i -g -D electron@latest --unsafe-perm=true --allow-root`\n4. Use the\
    \ following command to verify Electron installation: `electron -v`\nIf the installation\
    \ was successful you should see a version number like `v6.0.10`.\n\n### Setting\
    \ up an Electron Project with TypeScript\n\nFollow the subsequent instructions\
    \ to set up a new project directory to work from, and the required files, the\
    \ instructions are provided once in a comprehensive manner for the sake of understanding,\
    \ and then again in a manner of workflow:Note: Read an instruction properly following\
    \ it.Note: Mind the difference between `.ts` and `.js` extensions. The `.ts` extension\
    \ is a TypeScript file where we’ll write our TypeScript code and compile it to\
    \ a `.js` file, and the JavaScript files will be linked to HTML files and Electron\
    \ environment.\n\n1. Open a Terminal/CMD. Use sudo or Admin privileges when required.\n\
    2. Execute this command to see if NodeJS, NPM, TypeScript, TSLint, and Electron\
    \ is installed properly: `node -v && npm -v && tsc -v && tslint -v`\nYou should\
    \ see an output like this: `v10.16.3 6.11.3 3.6.3 5.20.0`\nHere we can see 4 numbers:\n\
    1st one `v10.16.3` is the version of NodeJS installed on my PC.\n2nd one `6.11.3`\
    \ is the version of NPM installed.\n3rd one `3.6.3` is the version of TypeScript\
    \ installed.\nthe last one `5.20.0` is the version of TSLint installed.\n\n3.\
    \ Create a new directory named `myProject` and move inside it using the following\
    \ command: `mkdir myProject && cd myProject`\nThis command will also your terminal\
    \ inside the newly created `myProject` directory.\n4. Use the following command\
    \ to check for a proper Electron installation: `electron -v`\nIf Electron is properly\
    \ installed we should see a version number like `v6.0.10`.\nIf you don’t see a\
    \ version number or see an error message go back to the previous section to install\
    \ Electron globally, or install electron locally for this project with the following\
    \ command: `sudo npm i -D electron@latest`\nIf you have installed Electron again\
    \ check it’s installation via the command `electron -v`.\n5. Create a new directory\
    \ named `app` inside your `myProject` directory using the following command: `mkdir\
    \ app`\n6. create a `main.ts` file inside your app directory using the following\
    \ command: `echo >> app/main.ts`\n7. Now from your project’s root (in case `myProject`)\
    \ initialize NPM using the command: `npm init`\nAfter executing this command the\
    \ CLI will ask you a few questions, use the default answers for every question\
    \ with the exception of the question about entry point; when asked about entry\
    \ point you need to use `app/main.js`.\nYour `package.json` file will be created\
    \ with this command, should look similar to:\n```json\n{\n  \"name\": \"myproject\"\
    ,\n  \"version\": \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"app/main.js\"\
    ,\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test\\\" && exit 1\",\n\
    \    \"start\": \"electron .\"\n  },\n  \"author\": \"\",\n  \"license\": \"ISC\"\
    \n}\n```\n8. Add the following script to your `scripts` property in your `package.json`\
    \ file: `\"start\": \"electron .\"`\nThis script simply executes electron, and\
    \ tells it that the current directory is our app’s main directory/root (that is\
    \ what the period for).\n9. When in the root directory (`myProject`) use the following\
    \ command to initialize TypeScript and TSLint for this project: `tsc --init &&\
    \ tslint --init`\n10. Add the following TypeScript code to your `main.ts` file:\n\
    ```typescript\nimport { app } from 'electron'\napp . on ( 'ready' , () => {\n\
    \  console . log ( 'Hello World'\n})\n```\n11. Now let’s compile our TypeScript\
    \ files to JavaScript, use the following command: `tsc`\nWhen executed from the\
    \ `myProject` directory, this command will compile all your TypeScript files to\
    \ their corresponding JavaScript files.\n12. Finally we can execute our code with\
    \ Electron using our `start` script (from package.json). To use the `start` script\
    \ execute the following command from the `myProject` Directory: `npm start`\n\
    If all went right then you should see `Hello World` logged to your CLI resembling\
    \ the following output:\n`> myproject@1.0.0 start /home/ray/electronProjects/myProject>\
    \ electron .Hello World`\nThe electron will still be running unless you stop it.\
    \ To stop Electrion press `Ctrl + c` or `CMD ⌘ + c`.\n13. Now we need to add HTML,\
    \ and CSS files to your Electron project, we also need an `index.ts` file to operate\
    \ JavaScript on the front-end. Use the following command to add these files: `echo\
    \ >> app/index.ts >> app/index.html >> app/main.css`\nNote: the `touch` command\
    \ is used but is not required when we have `echo`, plus `echo` is cross platform.\n\
    After executing this command from the `myProject` directory your app directory\
    \ should have 3 files added to it, these being `index.html`, `index.ts`, and `main.css`;\
    \ and your directory should have the files `main.ts` and it’s compiled version\
    \ `main.js` from the previous steps.\nThe front-end files are `index.html`, `index.ts`\
    \ or `.js`, and `main.css`. The front-end files will be used to design the `Graphical\
    \ User Interface` aka `GUI` of our app.\nThe back-end of our app is comprised\
    \ of the files `main.ts` or `.js` and any files like `package.json`, `tsconfig.json`,\
    \ etc. The back-end can be considered the actual software part of our app.\nNote:\
    \ The terminology used here is adapted from web development since a lot of the\
    \ readers will be coming from a web development background.\n14. Now replace the\
    \ existing code in `main.ts` with the following code:\n```typescript\nimport {\
    \ app , BrowserWindow } from \"electron\"\napp . on ( \"ready\" , () => {\n  const\
    \ mainWindow = new BrowserWindow ();\n  mainWindow . webContents . loadURL ( `file://${dirname}/index.html`\
    \ );\n});\n```\n15. Now lets add some stuff in our HTML, CSS, and JavaScript (in\
    \ case TypeScript) files. Add the following code to their corresponding files:\n\
    index.html:\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>My Electron App</title>\n\
    \  <script src=\"index.js\" defer></script>\n  <link rel=\"stylesheet\" href=\"\
    main.css\">\n</head>\n<body>\n  <h1>Hello Electron</h1>\n</body>\n</html>\n```\n\
    index.ts:\n```typescript\ndocument.body .innerHTML += \"<h2>I love JavaScript</h2>\"\
    ;\n```\nmain.css:\n```css\nbody {\n  background-color: #fe00fe ;\n  color: #222\
    \ ;\n}\n```\n16. At this point it’s optional to Lint our TypeScript code, the\
    \ code provided above is already linted. To Lint use the command: `tslint -c tslint.json\
    \ *.ts` After any linting errors move on to the next step. TSLint will output\
    \ detailed reports on Linting errors including the file name, line number, etc.\
    \ so you can know which file to revisit.\n17. Now to compile our TypeScript files\
    \ execute the command: `tsc`\n18. Now us run our app with the command: `npm start`\
    \ If everything went right we should be able to see a window up that looks like\
    \ this: (Image0034.jpg)\n\n### Express Approach #1 (with TypeScript)\n\nExpress\
    \ Approach #1 is a basic way to create a project setup, use it to practice using\
    \ Electron until you learn a better approach. Follow the instructions provided\
    \ in this section to set up an Electron project, with TypeScript, TSLint, etc.\
    \ in the fastest way possible:\n\nPrerequisites:\n1. NodeJS, NPM, TypeScript,\
    \ TSLint, and Electron all be globally installed.\n2. You should be familiar with\
    \ the Terminal/CMD commands.\n\nInstructions:\n1. Open a Terminal/CMD. Use sudo\
    \ or admin privileges when required.\n2. Verify the installation of all the required\
    \ software with the following commands: `node -v && npm -v && tsc -v && tslint\
    \ -v && electron -v`\nOutput should be 5 version number, one for each software\
    \ like we can see on the left. Don’t mind the comments\n`v10.16.3` // NodeJS\n\
    `6.11.3` // NPM\n`3.6.3` // TypeScript\n`5.20.0` // TSLint\n`6.0.10` // Electron\n\
    3. Create directories `ourProject`, and `app`. Use the following command: `mkdir\
    \ ourProject && cd ourProject && mkdir app` This command will also leave your\
    \ terminal inside the newly created `ourProject` directory.\n4. Create all the\
    \ required files including `main.ts`, `index.html`, `index.ts`, and `main.css`.\
    \ Use the following command: `echo >> app/main.ts >> app/index.html >> app/index.ts\
    \ >> app/main.css`\n5. Initialize NPM, TypeScript, and TSLint and use the `app/main.js`\
    \ file as entry-point to the project. Use the following command: `npm init &&\
    \ tsc --init && tslint --init` This will create the files `package.json`, `tsconfig.json`,\
    \ and `tslint.json`. Use `app/main.js` as entry-point.\n6. Add the following script\
    \ to your `package.json` file.\npackage.json:\"start\": \"electron .\"`\n7. Put\
    \ the following code in our `main.ts` file:\nmain.ts:\n```typescript\nimport {\
    \ app , BrowserWindow } from \"electron\"\napp . on ( \"ready\" , () => {\n  const\
    \ mainWindow = new BrowserWindow ();\n  mainWindow . webContents . loadURL ( `file://${dirname}/index.html`\
    \ );\n});\n```\n8. Now put whatever code you want on the front-end files like\
    \ `index.html`, `index.ts`, and `main.css`. Code for a basic calculator is provided\
    \ in the following practice Project.\n9. Execute the following command to Lint\
    \ (Linting fixes the way you write code) your TypeScript code: `tslint -c tslint.json\
    \ *.ts` Executing this line will show a list of errors thrown by the Linter. Here,\
