  trans: "\n从第 #7 行到 #11 行，我们为按钮元素添加了一个点击事件监听器，当点击时，渲染进程会调用 `setTray()` 函数（如果我们的应用图标在系统托盘中可见）来从托盘中移除该图标（这通过\
    \ `removeTray` 通道发生，如从托盘中移除图标）；如果图标不可见，则它将调用 `setTray()` 函数使其在系统托盘中显示（这通过 `putTray`\
    \ 通道发生，如将图标放入托盘）。然后，第 #10 行切换了 `trayOn` 的值，因为如果它是关闭的，它就会开启，反之亦然。\n\n注意：当我们说“可见”时，意思是“存在”，而“不可见”意味着“不存在”。\n\
    \n在第 #13 行到 #17 行，我们为 `trayRemoved` 通道添加了监听器，该通道的作用是监控托盘图标，因此如果图标通过任何其他方式被移除，主进程将通过此通道通知渲染进程。在第\
    \ #14 行，我们通过 `removeTray` 通道向主进程发送信号，这将通知主进程渲染进程知道图标已被移除，主进程据此调整其状态。在第 #15 行，我们将\
    \ `trayOn` 的值设置为 `false`，因为托盘图标是不可见的。最后，在第 #16 行，我们使用了 `setTrayStatus()` 函数来更改段落元素的文本。在第\
    \ #19 行，我们有 `signalMain` 函数，它用于通过不同的通道向主进程发送空信号（作为通道参数的参数提供）。从第 #20 行到 #23 行，我们有一个函数用于通过各种通道向主进程发送信号，并更改段落元素中显示的消息（提示）。此函数用于切换所有进程中应用图标相关变量的值。\n\
    \n### main.js（记得开启 nodeIntegration）\n\n```javascript\n1  const { app , BrowserWindow\
    \ , Menu , Tray , ipcMain } = require ( 'electron' );\n2  const path = require\
    \ ( 'path' );\n3  const channel = require ( './channel.js' );\n4  const iconPath\
    \ = path . join ( __dirname , 'iconTemplate.png' );\n5  let appIcon = null ;\n\
    6 \n7  ipcMain . on ( channel . putTray , ( event ) => {\n8      appIcon = new\
    \ Tray ( iconPath );\n9      \n10 const contextMenu = Menu . buildFromTemplate\
    \ ([{\n11      label : 'Remove' ,\n12      click : () => {\n13      event . sender\
    \ . send ( channel . trayRemoved );\n14      }\n15   }]);\n16      \n17  appIcon\
    \ . setToolTip ( 'Electron Demo in the tray.' );\n18  appIcon . setContextMenu\
    \ ( contextMenu );\n19 });\n20 \n21 ipcMain . on ( channel . removeTray , ()=>{\n\
    22     appIcon . destroy ;\n23 });\n24 \n25 app . on ( 'window-all-closed' , ()=>{\n\
    26     if ( appIcon ) appIcon . destroy ;\n27 });\n26 \n28 function createWindow\
    \ () {\n29     const mainWindow = new BrowserWindow ({\n30      width : 800 ,\n\
    31      height : 600 ,\n32      webPreferences : {\n33          preload : path\
    \ . join ( __dirname , 'preload.js' ),\n34          nodeIntegration : true\n35\
    \      }\n36    })\n37     mainWindow . loadFile ( 'index.html' )\n38 }\n39 \n\
    40 app . whenReady (). then (() => {\n41     createWindow ()\n42     \n43   app\
    \ . on ( 'activate' , function () {\n44      if ( BrowserWindow .getAllWindows\
    \ (). length === 0 ) createWindow ()\n45   })\n46 })\n47 \n48 app . on ( 'window-all-closed'\
    \ , function () {\n49  if ( process .platform !== 'darwin' ) app . quit ()\n```\n\
    \n从第 #1 行到 #5 行，我们包含了导入 `Tray`、`Menu`、`ipcMain`、`channel.js` 等模块的代码。我们在第 #4 行设置了应用图标的\
    \ URL。在第 #5 行，我们创建了一个名为 `appIcon` 的布尔值变量（`trayOn` 的对应项），用于跟踪我们的系统托盘图标是否可见（因此使用布尔值）。\n\
    \n从第 #7 行到 #19 行，我们正在监听 `putTray` 通道（连接到 `renderer.js` 的第 #9 行），在第 #8 行，我们实际上使用\
    \ `Tray` 模块在系统托盘中创建应用图标，并将其赋值给 `appIcon` 变量，以便稍后操作。\n\n从第 #10 行到 #15 行，我们创建了一个\
    \ `Menu`（记得菜单章节）。在这里，我们只有一个菜单项，它用于从系统托盘中移除图标。我们可以创建任何喜欢的菜单。此菜单在右键点击系统托盘中的应用图标时显示。在第\
    \ #17 行，我们为托盘图标设置了工具提示（Tooltip），此消息将在鼠标指针悬停在托盘图标上时可用。在第 #18 行，我们将第 #10 行创建的菜单挂载到应用的托盘图标上。从第\
    \ #21 行到 #23 行，我们为 `removeTray` 通道添加了监听器，当主进程在该通道上接收到信号时，它将从托盘移除图标。在第 #24 行下方，我们有在\
    \ `electron-quick-start` 中找到与图标无关的代码。\n\n### 拖放支持（Drag and Drop support）\n\n拖放的底层机制非常复杂，需要大量的代码和技巧。坦率地说，这只是提供了拖放的幻觉，记住\
    \ `webContents.startDrag()` API。以下代码提供了拖放支持的演示：\n\nindex.html\n```html\n1<!DOCTYPE\
    \ html>\n2<html>\n3<body>\n4<img id=\"drag-file\" src=\"./icon.png\" height=\"\
    50px\" width=\"50px\" />\n5<script src=\"./renderer.js\"></script>\n6</body>\n\
    7</html>\n```\n我们需要关心的是图像元素。高度和宽度是任意的，重要的是 `icon.png` 源和 `id`。现在，`id` 是任意的，但在所有要求的地方它应该保持一致。\n\
    \nrenderer.js\n```javascript\n1 const { ipcRenderer } = require ( 'electron' )\n\
    2 const dragFileLink = document. getById ( 'drag-file' );\n3 dragFileLink . addEventListener\
    \ ( 'dragstart' , ( event ) => {\n4  event . preventDefault ()\n5  ipcRenderer\
    \ . send ( 'on-drag-start' , __filename )\n6 })\n```\n在这里，我们在第 #2 行获取了图像元素。在第\
    \ #5 行，我们为该元素添加了 `dragstart` 事件监听器，当有人开始拖动元素时会触发。这里的另一个有趣的是第 #6 行的代码，`event.preventDefault()`\
    \ 方法用于停止该事件的默认行为。你可以使用 `Event.cancelable` 来检查事件是否可取消，因为对于不可取消的事件调用 `preventDefault()`\
    \ 没有效果。我们取消此事件的默认流，因为我们将使用第 #7 行构建一个自定义流。第 #7 行在 `on-drag-start` 通道上发送当前文件的 URL，这就是\
    \ `__filename` 常量的用途，这里当前文件是 `index.html`，因为 `renderer.js` 文件附加上，它是整个 HTML 文件的一部分。\n\
    \nmain.js\n```javascript\n1 const { app , BrowserWindow , ipcMain } = require\
    \ ( 'electron' )\n2 const path = require ( 'path' )\n3 \n4 ipcMain . on ( 'on-drag-start'\
    \ , ( event , filepath ) => {\n5   const iconName = 'icon.png'\n6   event . sender\
    \ . startDrag ({\n7     file : filepath ,\n8     icon : path . join ( __dirname\
    \ , iconName )\n9   })\n10 })\n11\n12 function createWindow () {\n13     const\
    \ mainWindow = new BrowserWindow ({\n14      width : 800 ,\n15      height : 600\
    \ ,\n16      webPreferences : {\n17          nodeIntegration : true\n18      }\n\
    19    })\n20     mainWindow . loadFile ( 'index.html' )\n21 }\n22 \n23 app . whenReady\
    \ (). then (() => {\n24     createWindow ()\n25 })\n26 \n27 app . on ( 'window-all-closed'\
    \ , function () {\n28   if ( process .platform !== 'darwin' ) app . quit ()\n\
    29 })\n```\n当 `renderer.js` 中第 #7 行的代码向主进程发送信号时，它将触发 `main.js` 文件中从第 #4 行到第 10\
    \ 行的代码，这是我们在这一部分关注的行，其余行都是标准的。\n\n注意：作者觉得“标准”这个词说得太多了。由于没有更好的词，在这里“标准”意味着读者到此为止应该非常熟悉的代码。\n\
    \n在这里从第 #4 行到第 #10 行，我们有一个通信监听器，它监听 `on-drag-start` 通道，当我们开始拖动项目时会触发其内部的代码。在第\
    \ #5 行，我们分配了拖动时需要复制的文件名。从第 #6 行到 #9 行，我们使用 `startDrag()` 方法告诉程序我们正在拖动的文件 URL，格式为包含图标的对象，该图标（你猜得没错！）持有文件的地址。\n\
    \n### 系统和硬件信息（System and Hardware information）\n\nElectron 应用可以访问用户的硬件、使用的操作系统等信息。获取这些信息需要\
    \ NodeJS 原生的对象和方法，因此在主进程和渲染进程（启用 `nodeIntegration`）中均可用，但某些方法仍然是专有的！同样，也有 Electron\
    \ 原生的对象和方法，因此仅在主进程可用（除非文档另有说明）。例如，在 `main.js` 或 `renderer.js`（启用 node）中添加以下代码并运行，然后检查其日志：\n\
    \n```javascript\n1 const { app } = require ( 'electron' )\n2 const os = require\
    \ ( 'os' )\n3\n4 console . log ( process . chrome );\n5 console . log ( process\
    \ . v8 );\n6 console . log ( process . node );\n7 console . log ( process . electron\
    \ );\n8\n9 console . log ( os . homir() );\n10 console . log ( app . getPath()\
    \ );\n```\n在这里我们从 `os` 模块导入 `app` 方法。在第 #4 行，我们使用全局 `process` 对象获取 Chromium 的版本，这可以指示\
    \ Electron 中哪些功能是可用的。在第 #5 行，我们使用全局 `process` 对象获取 V8 的版本。V8 是用于解释代码的 JavaScript\
    \ 和 WebAssembly 引擎，用 C++ 编写；由 Lars Bak 开发，JavaScript 和虚拟机领域的权威，“软件工程奖”的获得者。V8\
    \ 可以独立运行，也可以嵌入到任何操作系统和架构中。访问 [`v8.dev/`](https://v8.dev/) 了解更多。在第 #6 行，我们为此这样做。NodeJS\
    \ 是一个后端框架，允许我们在服务器端使用 JavaScript 和 TypeScript。由 Ryan Dahl 以及 Deno 开发，构建在 V8 之上的运行时。在第\
    \ #7 行，我们发现 Electron 的版本，它结合了这些技术并提供了原生桌面应用的幻觉。随后，使用如 `electron-forge` 等工具生成原生应用。在第\
    \ #9 行，我们使用 `os` 模块的 `homir()` 方法查找操作系统的主目录。在第 #10 行，我们使用 `app` 对象的 `getAppPath()`\
    \ 方法获取应用所在的目录地址。\n\n在渲染进程中关闭 `nodeIntegration` 的情况下，我们也可以通过 `ipc` 模块获取信息。另一个示例是使用\
    \ `enableRemoteModule` 在渲染进程中执行工作。在 `renderer.js` 文件中使用以下代码：\n\n```javascript\n\
    1 const { screen } = require ( 'electron' ).remote;\n2\n3 const screenSize = screen\
    \ . getPrimaryDisplay (). size;\n4 const message = `Your screen is: ${screen.width}px\
    \ x ${screen.height}px` ;\n5 document . getById ( \"disp\" ).innerHTML = message\
    \ ;\n```\n我们导入了 `screen` 对象，并使用 `getPrimaryDisplay()` 方法访问主显示器（如 LVSD1 等），并提取出一个包含\
    \ `height` 和 `width` 属性的对象，对应于该显示器的原始高宽。注意，原始维度并不代表可用空间，菜单栏、系统托盘、任务栏和其他窗口填充了这个空间，而剩余空间可以通过\
    \ `getPrimaryDisplay()` 方法提取的对象的 `workArea()` 方法找到。此 `renderer.js` 文件由以下 `main.js`\
    \ 文件支持：\n\n```javascript\n1 const { app , BrowserWindow } = require ( 'electron'\
    \ )\n2\n3 function createWindow () {\n4     const mainWindow = new BrowserWindow\
    \ ({\n5      width : 800 ,\n6      height : 600 ,\n7      webPreferences : {\n\
    8          nodeIntegration : true ,\n9          enableRemoteModule : true\n10\
    \      }\n11    })\n12     mainWindow . loadFile ( 'index.html' )\n13 }\n14 \n\
    15 app . whenReady (). then (() => {\n16     createWindow ()\n17 })\n18 \n19 app\
    \ . on ( 'window-all-closed' , function () {\n20   if ( process .platform !==\
    \ 'darwin' ) app . quit ()\n21 })\n```\n在这里只有第 #9 行是重要的，`remote` 模块需要启用。以下是此内容的\
    \ `index.html` 文件：\n\n```html\n1<!DOCTYPE html>\n2<html>\n3<body>\n4<p id=\"disp\"\
    ></p>\n5<script src=\"./renderer.js\"></script>\n6</body>\n7</html>\n```\n在这里第\
    \ #4 行，我们有一个 id 为 `disp` 的段落元素。\n\n第 5 章 –  Electron 特性（Chapter 5 – Contemporary\
    \ Electron Features）\n\nElectron 中有些多余功能可以在你的应用中使用，但在进入这一节之前，你必须彻底学习之前章节中的基础知识。此外，这些功能大部分很难实现，并且可能需要时间和书中之外的额外阅读，这是完全正常的，但在决定在应用中实现这些功能之前，要注意在实现时时会遇到的额外时间投入和错误。做好一件比做好很多更好。\n\
    \n高级跨平台特性（Advanced Cross Platform Features）以下是当今市场应用经常需要的特性演示和解释。然而，这些特性并不是使用\
    \ Electron 必须的。注意跨平台特性，它们总是很难实现，并且对于特定的实现有不同的关键。在这里我们学习 Electron 自带的默认模块，但可能时我们建议使用第三方库。\n\
    \n剪贴板模块（Clipboard Module）`clipboard` 模块具有方法从系统剪贴板执行复制和粘贴。在 `electron-quick-start`\
    \ 上构建以下代码以查看演示.index.html\n\n```html\n1<!DOCTYPE html>\n2<html>\n3<body>\n4<input\
    \ id=\"copy-input\" />\n5<button id=\"copy-btn\">copy</button>\n6<br>\n7<p id=\"\
    paste-box\"></p>\n8<button id=\"paste-btn\">paste</button>\n9<script src=\"./renderer.js\"\
    ></script>\n10</body>\n11</html>\n```\n在这里我们添加了输入元素（#4），在拖动时需要复制。第 #5 行的按钮（copy-btn）用于复制。第\
    \ #7 行的段落元素用于显示粘贴后的文本。renderer.js\n\n```javascript\n1 const { clipboard } = require\
    \ ( 'electron' );\n2\n3 // 复制剪贴板\n4 const copyBtn = document. getById ( 'copy-btn'\
    \ );\n5 const copyInput = document. getById ( 'copy-input' );\n6\n7 copyBtn .\
    \ addEventListener ( 'click' , () => {\n8   const textToCopy = copyInput . value\
    \ ;\n9   clipboard . writeText ( textToCopy );\n10 });\n11\n// 粘贴剪贴板内容\n12 const\
    \ pasteBtn = document. getById ( 'paste-btn' );\n13 const pasteBox = document.\
    \ getById ( 'paste-box' );\n14\n15 pasteBtn . addEventListener ( 'click' , ()\
    \ => {\n16   const textFromClipboard = clipboard . readText ();\n17   pasteBox\
    \ . innerHTML = textFromClipboard ;\n18 })\n```\n"
- fmt: '

    ### 2. Custom Protocol

    A custom protocol (like `http://`, `file://`, etc.) can be attached to your app,
    so any GET requests made on that protocol are sent to your app.


    ### 3. Note

    Linux and MacOS may have different settings depending upon their desktop environments
    and OS versions, check the latest guidelines for them.


    ### 4. Note

    Always refer to the developer documentation of the operating system you are going
    to be distributing your app to.

    '
