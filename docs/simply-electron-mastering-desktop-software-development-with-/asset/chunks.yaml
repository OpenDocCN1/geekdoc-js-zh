  raw: '​ From now on you will write all the code you want in “index.ts” file, then
    compile it to an “index.js” file using the command “tsc index.ts ”, and then run
    the app using the “node index.js ” command.Data-type prejudice​ JavaScript is
    a dynamically typed programming language, and TypeScript adds optional static
    typing to JavaScript. So ultimately we have a dynamically typed language which
    can statically type whenever it wants, breaking the boundaries set by data-type
    prejudice in programming languages. Let’s look at an example:Here is JavaScript/ES6
    with dynamic typing:let x = 1 ;console . log ( typeof ( x )); // logs: numberx
    = ” one ” ;console . log ( typeof ( x )); // logs: stringHere is TypeScript with
    static typing:let x : number = 1 ;console . log ( typeof ( x )); // logs: numberx
    = ” one ” ; // Will throw an error​ And since TypeScript compiles to JavaScript
    it will not compile one line at a time, instead it will compile completely, all
    at once; if there is even a single data-type violation it will throw an error
    that looks like this:Type ''"one"'' is not assignable to type ''number''.Data-types  in
    TypeScript​ TypeScript has all the same data-types as JavaScript, and building
    upon it, TypeScript provides additional data-types. Following is a list of Data-types
    in TypeScript:-1\. Number2\. String3\. boolean4\. Array (object)5\. Tuple (object)6\.
    Enum (object)7\. Any8\. Void9\. Null & Undefined10\. Never11\. Object​ Let’s learn
    about them:Number :​ Values like regular numbers, negative numbers, floating point
    numbers, hexadecimal numbers all are covered under the Number data-type. Additionally
    TypeScript brings binary numbers, and octal numbers to the table which are also
    covered under the Number data-type. Look at the following example:TypeScript code:let
    myNumber : number   = 1 ;let myNegative : number = - 1 ;let myFloat : number =
    1.5 ;let myHex : number =   0x000f ; //returns 0x000flet myBinary : number = 0b0101
    ; //returns 5let myOct : number = 0o007 ; //returns 7​ Notice how the hexadecimal
    values returned in their original form however when transpiled to JavaScript the
    binary and octal values will be converted to regular numbers; we must take this
    effect into account while working with these new features.String :​ Strings declared
    with single quotations, double quotations, and back-ticks (template literals)
    are all covered under the String data-type in TypeScript. Look at the following
    example:TypeScript code:let x : string   = ‘ Hello ’ ;let y : string = “ World
    ” ;let z : string = `${ x } ${ y }!` ; //Returns : “Hello World!”​ Notice how
    we are able to use Template literals without using Babel or looking for ES6 support
    in our browser. These days almost all web browsers supports ES6 features, however
    since TypeScript has all the latest features of ECMAScript built-in we can use
    them without going through Babel. Lets look at what the above TypeScript code
    transpiled to:Post Transpilation JavaScript code:var x = ''Hello'' ;var y = "World"
    ;var z = x + " " + y + "!" ;​ See how all the TypeScript code was transpiled to
    JavaScript/ES5 code. This way we can run TypeScript and the latest ECMAScript
    features in places where we have no support of ES6 at all!Boolean :​ The boolean
    data-type is very straight forward, variables that are determined to hold a boolean
    value are always either true or false . Look at the following code:Post Transpilation
    JavaScript code:var x : boolean = false ;Array :​ The Array data-type represents
    JavaScript arrays in which all the members are of the same data-type. Now there
    are two ways to statically type arrays in TypeScript, let’s look at the following
    example:Typescript code:let myArray1 : number [] = [ 1 , 2 , 3 , 4 , 5 ];let myArray2
    : Array < number > = [ 1 , 2 , 3 , 4 , 5 ];let myArray3 : string [] = [ ” one
    ” , ” two ” , ” three ” ];let myArray4 : Array < number > = [ 1 , 2 , ” three
    ” ]; //throws error​ Notice how the Arrays can now only contain a single kind
    of data-type. Also notice that upon mixing multiple data-types in a single array
    the compiler throws an error. For now if you want to make a regular JavaScript
    array you can just mix JavaScript code with TypeScript codeTuple :​ A Tuple is
    a data-type in TypeScript which allows us to make mixed data-type arrays with
    fixed number of elements. Lets look at the following code:Typescript code:let
    myArray1 : [ number , string ] = [ 1 , “ one ” ]; //returns [1, “one”]let myArray2
    : [ number , string ] = [ “ one ” , 1 ]; //throws errorlet myArray3 : [ number
    , string ] = [ 1 , “ one ” , ” two ” ]; //throws error​ Notice how Tuple assignments
    only work in the correct order, an initialization that is supposed to be [number,
    string] will not accept values [1,”one”].​ Also notice how initializing more values
    than the initially decided amount will throw an error.​ Now look as we attempt
    to push values to a Tuple:Typescript code:let myArray : [ number , string ] =
    [ 1 , “ one ” ]; //returns [1, “one”]myArray . push ( 3 );myArray . push ( “ three
    ” );myArray . push ( false ); //throws error​ Notice how we can push the predetermined
    values in Tuples, but we can’t add values of data-types that are not given in
    the Tuple. So [number, string]  can take numbers, and strings, but can’t take
    anything else.​ Now look as we try to log values outside to the predetermined
    Array length of a Tuple.Typescript code:let myArray : [ number , string ] = [
    1 , “ one ” ]; //returns [1, “one”]myArray . push ( 3 );console . log ( myArray
    ); //logs: [1, “one”, 3]console . log ( myArray [ 0 ]);console . log ( myArray
    [ 1 ]);console . log ( myArray [ 2 ]); //error​ Notice that after pushing values
    to a Tuple we can log it like an array but can call values outside of the predetermined
    Array length.Enum :​ Enum is another helpful feature of TypeScript! It is a data-type
    in TypeScript that gives us a way to correspond a group of values to a group of
    numbers. Look at the following code:TypeScript code:enum Color { Red , Green ,
    Blue }let c : Color = Color . Green ;let d : string = Color [ 1 ];console . log
    ( c ); //logs 1console . log ( d ); //logs Green​ Here on line #1 we have created
    a kind of Array. If we call Color.Green we get the index of “Green” returned to
    us; and if we call Color[1] we get the value at index “1” returned to us (which
    is “Green” in this case).​ When assigning a value with the actual value from the
    enum we will use the new data-type (“Color” in this case) instead of number, string,
    etc.​ For ease think of enums as JavaScript functions that return key for index
    numbers, and index numbers for keys.​ In the code above the enum starts from zero-index
    but we can make it start from any index we want, like the following code where
    we are making it start from 1:TypeScript code:enum Color { Red = 1 , Green , Blue
    }​ We can also manually assign each value an index number like the following example:TypeScript
    code:enum Color { Red = 1 , Green = 3 , Blue = 4 }​ Any missing indices will return
    undefined.Any :​ The “Any” data-type requirement is new in TypeScript, it is what
    it sounds like! It will allow us to pass values of any data-type to variables.
    Lets look at the following code:TypeScript code:let x : any = 1 ;console . log
    ( x );console . log ( typeof ( x ));x = "one"console . log ( x );console . log
    ( typeof ( x ));x = true ;console . log ( x );console . log ( typeof ( x ));​
    The “Object” type can also allow you to do the same thing but the data-type of
    a variable determined to be “any” changes with the data assigned to it, thus allowing
    the methods of those data-types to be applied on the variable. In contrast if
    a variable is determined to be of “object” data-type then there will be no methods
    of the string, number, boolean, etc. present in it. For example:TypeScript code:let
    x : any = 1 ;console . log ( x ++ );x = "one"console . log ( x . length );​ The
    code provided above won’t work if the data-type was determined to be “Object”
    instead of “any”. Lines #2, and #5 would throw an error.Void :​ Void is a data-type
    determination used on functions that don’t return anything.  If we determine a
    variable to be of void data-type then we can only assign it values like null ,
    and undefined .Null & Undefined :​ Null and Undefined are data-types that both
    represent an absence of value. The main difference is that “null” is an absence
    of value that is assigned to a variable; in contrast “undefined” tells us that
    no value has been assigned to a variable, hence it lacks a value.Never :​ Never
    is a data-type that is used to predetermine the output of a Function. It tells
    the compiler that this function will never return data as output. For example
    a function that always throws an error or returns an error object is never actually
    returning a value that is plain data like a number, or a sting.Object :​ Object
    is a data-type that is anything that isn’t “primitive data”. Simply speaking anything
    that is not a number, string, boolean, symbol, null, or undefined.Type Assertions​
    There are times when we know what to do better than TypeScript does, for those
    times we have Type assertions. They are a way to tell the compiler “trust me,
    I know what I’m doing.”​ There are two ways to write type assertions, the “angle-bracket”
    syntax, and the “as” syntax. Lets look at them:The angle-bracket syntax:let x
    : any = 1 ;let y = < number > x ;console . log ( typeof ( y )); //Output: numberThe
    as syntax:let x : any = 1 ;let y = x as number ;console . log ( typeof ( y ));
    //Output: number​ Type assertions are just a way to override compiler preferences,
    they shouldn''t be used most of the time. If you feel the need to use a type assertion
    then I suggest first revising your code before using it.Data-types with Functions​
    Static typing can also be applied to the parameters and outputs of functions,
    let’s look at the following example.TypeScript code:function myFunk ( a : number
    , b : number ) {  return a + b ;}console . log ( myFunk ( 1 , 2 )); //logs: 3console
    . log ( myFunk ( 1 , "one" )); //throws error​ This code will throw an error on
    the last line like “Argument of type ''"one"'' is not assignable to parameter
    of type ''number''.” This is because in our function’s parameters we have determined
    our parameters to be numbers and values that are non-numeric can’t be passed as
    arguments to them.​ Now let’s look at how to predetermine the data-type of our
    function’s output:TypeScript code:function myFunk ( a : number , b : number )
    : number {  return a + b + ” c ” ;}console . log ( myFunk ( 1 , 2 )); //throws
    error​ This code will throw an error on the 2nd line which reads like “Type ''string''
    is not assignable to type ''number''.”, this is because we have determined the
    data-type of our output to be “number”, and line #2 is making the output a string.​
    This is how we can predetermine the datatype of the output of our functions.Optional
    & Default parameters​ In simple JavaScript every parameter is optional. However
    that is not true in TypeScript. In TypeScript if we want optional parameters than
    we have use the “?” after the parameter name. For example:TypeScript code:function
    myFunk ( a , b ? ) {  return a + b ;}console . log ( myFunk ( 1 , 2 )); //logs
    : 3console . log ( myFunk ( 1 )); //logs : NaN​ Here on the 1st line the parameter
    “b” is optional since it has the “?” question mark symbol as a suffix. Notice
    how when we don’t pass this parameter an argument we get a “NaN” value. That is
    because the default value of b was “undefined” when we tried to sum up “1” and
    “undefined”. This can be avoided with default values:TypeScript code:function
    myFunk ( a , b = 0 ) {  return a + b ;}console . log ( myFunk ( 1 , 2 )); //logs
    : 3console . log ( myFunk ( 1 )); //logs : 1​ Notice on the 1st line we have the
    default value of the “b” parameter set to “0”, this way the parameter “b” is optional,
    if we don’t pass an argument to it the function will use the default value instead.Class
    based OOP​ TypeScript enables us to use Class based Object Oriented Programming.
    Classes are basically Object factories and have been introduced in ES6, and TypeScript
    combines it with express compiling and static data-typing to bring us a lot of
    exciting stuff. Classes have a fundamental structure which goes like this:1\.
    On the first few lines inside our Class''s body we declare properties/members
    for our Class’s Instances and predetermine their data-types.2\. After that we
    define a constructor() which takes in arguments ultimately used by the constructor()
    to initialize our properties with values.3\. Then we follow with methods for our
    Class’s Instances.Look at the following code:TypeScript code:class Person {    
    name : string ;     constructor ( myName : string ) {         this . name = myName
    ;    }     intro () {         return "Hello, i am " + this . name ;    }}let harry
    = new Person ( "Harry" );let larry = new Person ( "Larry" );let terry = new Person
    ( "Terry" );console . log ( harry . intro ()); //logs: “Hello, i am Harry”console
    . log ( larry . intro ()); //logs: “Hello, i am Larry”console . log ( terry .
    intro ()); //logs: “Hello, i am Terry”​ Notice how we created a single Class named
    “Person” which takes in a parameter named “myName” and assigned it’s value to
    the “name ” member of our Instances “Harry”, “Larry”, and “Terry”. Here “Harry”,
    “Larry”, and “Terry” are Instances of the “Person” Class .​ The members of Instances
    like “Harry.name” are public by default. This means the data can leak out of our
    Instances. Look at the following example of our data in the member “name” leaking
    out:TypeScript code:class Person {     name : string ;     constructor ( myName
    : string ) {         this . name = myName ;    }     intro () {         return
    "Hello, i am " + this . name ;    }}let harry = new Person ( "Harry" );console
    . log ( harry . name ); //logs: “Harry”​ See how we were able to see the name
    of the “Harry” instance without any special permissions? This not meant to be
    done like this, there is a better way. To avoid this we can also make these members
    private using the “private” modifier as a prefix to the variable declaration.
    Look at the following example:TypeScript code:class Person {     private name
    : string ;     constructor ( myName : string ) {         this . name = myName
    ;    }     intro () {         return "Hello, i am " + this . name ;    }}let harry
    = new Person ( "Harry" );console . log ( harry . name ); //throws error​ Now since
    we have made our “name” member private it is not directly accessible. Now it is
    only accessible via the intro() method.​ To access private members from our Instances
    we use special methods called “Accessors” aka “Getters” & “Setters”. Let’s see
    how to make them:TypeScript code:class Person {     private _name : string ;    
    private _age : number ;     constructor ( myName : string , myAge : number ) {        
    this . _name = myName ;         this . _age = myAge ;    }     get name () : string
    {       return this . _name ;    }     get age () : number {       return this
    . _age ;    }     set name ( newName : string ) {       this . _name = newName
    ;    }     set age ( newAge : number ) {       this . _age = newAge ;    }}let
    harry = new Person ( "Harry" , 32 );console . log ( harry . name , harry . age
    ); //logs: Harry 32harry . age = 33 ;console . log ( harry . name , harry . age
    ); //logs: Harry 33​ This way all the data passes through getters and setters
    which gives up more control over data flow. To transpile this TypeScript file
    from “.ts” to “.js” we should use the command “tsc -t es5 index.ts ”, then use
    “node index.js ” to execute our code; this helps us avoid the “Accessors are only
    available when targeting ECMAScript 5 and higher.” warning.​ Another way to avoid
    this warning is to initialize a “tsconfig.json” file. You can see the steps in
    the following section.Initializing a tsconfig.json file​ Go to the folder of your
    TypeScript project and use the following instructions to initialize a “tsconfig.json”
    file:1\. Use the command “echo >> tsconfig.json ” to create an empty “tsconfig.json”
    file. (we can also use the command “tsc –init ”, but leave that aside for now.)2\.
    Add the following code to the “tsconfig.json” file:{  "compilerOptions" : {    
    "target" : "es5"  },  "include" : [     "*.ts"  ]}3\. use the “tsc && node index.js
    ” to transpile and execute our code.​Using extends, protected, and super()​ Inheritance
    of properties is a pillar of OOP. Think of it as writing reusable blocks of code
    which are made up of other reusable blocks of code. There are a few ways to use
    it to our advantage with TypeScript. The first way we will look at is the extends
    feature that is used to extend the properties of one Class to another. Look at
    the following code:TypeScript code:class Animal {  adopt () {     console . log
    ( "You made a new friend" );  }}class Cat extends Animal {  meow () {     console
    . log ( "Meow Meow!" );  }}const myCat = new Cat ();myCat . adopt ();myCat . meow
    ();​ Notice how the class “Cat” is an extension of the class “Animal”. Also notice
    how the instance “myCat” is an instance of the class “Cat” but still is able to
    use the “adopt” method from the “Animal” class. This is the magic of extending
    classes!​ Now let’s look at the protect modifier. TypeScript allows three basic
    modifiers to control data leaks, they are “public” where all properties are public
    by default, “private” which doesn’t allow data to leak without Accessors like
    “get” and “set”, and the third one is “protected” which is basically private but
    allows inheriting properties to extending classes. Look at the following code:TypeScript
    code:class Animal {  protected name : string ; constructor ( name : string ) {
    this . name = name ;}}class Cat extends Animal {   constructor ( name : string
    ){     super ( name );  }  meow () {    console . log ( `Meow Meow! My name is
    ${ this . name }` );  }}const myCat = new Cat ( "Tom" );myCat . meow ();​ We can
    use the super() function to inherit properties from parent classes. Here we have
    use super() in the “Cat” class to accept the inheritance of the “name” property
    from the “Animal” class.Interfaces​ TypeScript gives us a simple way called Interfaces
    to create our own data-types. Lets look the how to create Interfaces:TypeScript
    code:interface MyDates {  myWord : string ;  myDigit : number ;  myReason ?: string
    ;}let myFavDate : MyDates = {  myWord : "Sep 28" ,  myDigit : 928 ,  myReason
    : "no reason" ,}console . log ( myFavDate ); //logs: { myWord: ''Sep 28'', myDigit:
    928, myReason: ''no reason'' }​ See how we created a new data-type named “myDates”,
    any variables that belong to this data-type must follow the following rules:1\.
    It must be objects that have two properties named “myWord”, and “myDigit”.2\.
    It may or may not have a property named “myReason”. (its optional because of the
    “?” operator as a suffix)3\. The “myWord” property must be a string.4\. The “myDigit”
    property must be a number.5\. The “myReason” property (if it exists) must be a
    string.​ There is also a modifier named “readonly” which is like the keyword “const”
    but for object properties. It creates immutable properties for objects. Lets look
    at how to use it:TypeScript code:interface MyDates {  myWord : string ; readonly
    myDigit : number ;}let myFavDate : MyDates = {  myWord : "Sep 28" ,  myDigit :
    928 ,}myFavDate . myWord = "28 Sep" ;myFavDate . myDigit = 289 ; //throws error​
    This code will work fine up until the final line, on the final line we attempt
    to modify “myDigit” which is a readonly property, so the compiler will throw the
    following error “Cannot assign to ''myDigit'' because it is a read-only property”.​
    By this time you must have realized how powerful interfaces are, imagine use interfaces
    within interfaces like the following code:TypeScript code:interface Weapon { 
    readonly type : string ;  readonly madeof ?: string ;}interface Hero {  readonly
    name : string ;  lvl : number ;  weapon : Weapon ;}let myPlayer : Hero = {  name
    : "Ray" ,  lvl : 14 ,  weapon : {     type : "sword" ,     madeof : "steel"  }}console
    . log ( myPlayer );/* logs:{ name: ''Ray'',  lvl: 14,  weapon: { type: ''sword'',
    madeof: ''steel'' } }*/​ See how we have use the interface named “Weapon” inside
    the interface “Hero”? Never thought it would be this easy in JavaScript. Before
    TypeScript if we wanted to write a piece of code like this we didn’t had the option
    of this type of strict data-typing and inheritance, at best what we could do was
    to keep track of data-types and inheritance ourselves.Implementing Interfaces​
    Now let’s learn about implementing Interfaces with classes, its kinda like extending
    classes. Let’s look at the following code:TypeScript code:interface Hardware { 
    model : string ;  ram : string ;}class Laptop implements Hardware {     brand
    : string ;    model : string = "2 core 4 thread" ;     ram : string = "8GB" ;   
    constructor ( myBrand : string , myModel : string , myRam : string ) {        
    this . brand = myBrand ;         this . model = myModel ;         this . ram =
    myRam ;    }}let myLaptop = new Laptop ( "IBN" , "j7" , "32GB" );console . log
    ( myLaptop );/* logs:Laptop { model: ''j7'', ram: ''32GB'', brand: ''IBN'' }*/​
    This is how we simply implement interfaces in classes. In the code above the class
    “Laptop” implements the “Hardware” interface which demands the class to have props
    named “mode” and “ram” with string values.TypeScript modules​ Modules are containers
    of reusable code. They are an essential part of building software that scales
    without disruption. In TypeScript we have two types of modules:1\. Internal modules
    aka Namespaces .2\. External modules aka Modules.​ There are two ways to write
    Internal modules: “unnamed” aka “Implicit” modules, and “Named” modules aka “Namespaces”.
    Implicit code is code that is written inside the source-code file, and is not
    part of a named module, this is considered a bad practice in general; whenever
    we can we should isolate code into named modules. Lets look at the following code:TypeScript
    code:namespace ModuleName {  //write code here}​ This is a named module, declared
    with the keyword “namespace”, and named with the first letter capitalized and
    the rest camel-cased. The important thing to remember is that nothing leaks outside
    of this module unless deliberately “exported” by the programmer.​ Let’s look at
    an example:TypeScript code:namespace Zoo {  export class Animal {     name : string
    ;    constructor ( myName : string ) { this . name = myName ;}  }}const myCat
    = new Zoo . Animal ( "Jacob" );console . log ( myCat ); //logs: Animal { name:
    ''Jacob'' }​ In this code we have used the “namespace” keyword to declare an internal
    module named “Zoo”. Inside this module we have a class named “Animal” that takes
    in an argument and assigns it to a property named “name”. Then we have written
    a variable named “myCat” and made it an instance of the class “Animal” by extracting/importing
    “Animal” from “Zoo” using the dot-notation.​ Essentially we have created a class
    and a single instance of it. There are two things to notice here, the first one
    is the “export” keyword used to export the class “Animal” outside of the “Zoo”
    module, the second thing to notice is the dot-notation used to access “Animal”
    from “Zoo” like “Zoo.Animal”.​ This is the way to write internal modules aka namespaces.
    We can also use the “module” keyword instead of the “namespace” keyword but that
    practice is discouraged.​ Now lets look at actual “Modules” aka “external modules”.
    Make a new TypeScript file right where your “index.ts” file is, and name it “myModule.ts”.
    Now add the following code to it:TypeScript code for “myModule.ts”:export let
    x = "Hello World" ;and then add the following code in your “index.ts” file:TypeScript
    code for “myModule.ts”:import { x } from "./myModule" ;console . log ( x ); //logs:
    Hello World​ Now assuming your “tsconfig.json” file (with code shown in the section
    “Initializing a tsconfig.json file”) is in place you can just execute the command
    “tsc && node index.js ” or else you can execute the command “tsc index.ts && node
    index.js ”. Combined together this code will log “Hello World” to the console/Terminal.​
    Here we have exported a variable named “x” using the “export” keyword, however,
    we can export anything we want including functions, classes, etc.Linting TypeScript
    with TSLint​ Linting basically means wrinkling out any coding and stylistic errors
    from our code. TSLint is a code linting tool for linting TypeScript. To see it
    in action follow the subsequent instructions:1\. Open a Terminal/CMD.2\. Make
    sure you have NodeJS, NPM, and TypeScript installed with the following command:node
    -v && npm -v && tsc -v​ If you get an output similar to the following then NodeJS
    and NPM is installed properly:v10.16.36.11.3Version 3.6.3​ Otherwise you need
    to go back to the section “NodeJS for Electron” to find instructions to install
    NodeJS and NPM.3\. Install “TSLint” use the command:sudo npm i tslint -g​ Here
    Windows users don’t need to use “sudo”, instead they need to run CMD as administrator.​
    If the operation went fine you should see a similar passage at the end of it’s
    output:+ tslint@5.20.0added 37 packages from 21 contributors in 49.721s4\. Use
    the following command to create a fresh directory for your app and move into it:mkdir
    myTSLintApp && cd myTSLintApp5\. Use the following command to initialize TSLint
    for your project:tslint --init​ This will create a “tslint.json” file to configure
    your TSLint preferences.6\. Now lets create the following files for our app: “index.html”,
    “index.ts”, “main.css” using the following command:echo >> index.ts​ Now you should
    see the files index.ts”, and “tslint.json” files in your app’s directory.7\. Now
    let’s write the following code in our “index.ts” file and save it:let x : string
    = "Hello World" ;console . log ( x );8\. Now let’s execute the following command
    to run TSLint:tslint -c tslint.json *.ts​ Here we should see a similar output
    to this:ERROR: index.ts:1:6 - expected nospace before colon in variable-declarationERROR:
    index.ts:2:1 - Calls to ''console.log'' are not allowed.ERROR: index.ts:2:16 -
    file should end with a newline​ The first ERROR TSLint caught is the presence
    of a space in between “x” and the colon character (“:”) on the first line of our
    code, this violates a styling rule in TypeScript called the “nospace” rule; technically
    we can run the code without listening to a word TSLint says, but linting our code
    is a desirable practice and we should learn it and make it a second nature to
    us.​ To fix this “nospace” error we can just erase the unwanted space character
    making our code look this this:let x : string = "Hello World" ;console . log (
    x );​ Notice the difference between “x : string” and “x: string” on the first
    line in the before and after versions of our code. Replace the old code in the
    “index.ts” file with this new code and save it.​ Lint the code again using the
    following command:tslint -c tslint.json *.tsand notice the first ERROR disappearing
    like this:ERROR: index.ts:2:1 - Calls to ''console.log'' are not allowed.ERROR:
    index.ts:2:16 - file should end with a newline​ Now the second ERROR TSLint caught
    tells us not to use “console.log” in our code. Usually we need to listen to what
    TSLint says to us, but this time we need to use “console.log” in our code so let’s
    add an exception in TSLint about the usage of “console.log”. To do this we need
    to modify the “tslint.json” file, let’s get on with it:Note: Since this is a JSON
    file, we can’t afford to make any mistakes, be very careful when editing a JSON
    file.Old tslint.josn:{     "defaultSeverity" : "error" ,     "extends" : [        
    "tslint:recommended"    ],     "jsRules" : {},     "rules" : {},     "rulesDirectory"
    : []}New tslint.josn:{     "defaultSeverity" : "error" ,     "extends" : [        
    "tslint:recommended"    ],     "jsRules" : {},     "rules" : {       "no-console"
    : [ "log" ]    },     "rulesDirectory" : []}​ Notice here how we have added a
    member named “no-console” to the “rules” property. This tells TSLint to avoid
    enforcing the “no-console” rule while linting. The value “log” tells us to just
    give us a light warning instead of an ERROR, however these light warnings only
    show up in IDE’s like VSCode and Atom. The value “log” can also be replace by
    a simple boolean value false .​ Now after modifying and saving the “tslint.json”
    file let’s lint our code again using the command:tslint -c tslint.json *.ts​ By
    this time both the first and the second ERROR should be gone, the first one was
    fixed, and the second one was added as an exception. The final ERROR tells us
    to add a new line at the very end of our source code:ERROR: index.ts:2:16 - file
    should end with a newline​ To fix this error we have to, as the error pointed
    out add a new line at the very end of our source code.Before adding new line:1
    : let x : string = "Hello World" ;2 : console . log ( x );After adding new line:1
    : let x : string = "Hello World" ;2 : console . log ( x );3 :​ Run TSLint one
    final time:tslint -c tslint.json *.ts​ And your code should be properly linted
    without ERROR’s.​ This is a basic introduction of linting, to learn & master Linting
    you need to learn tools like TSLint, ESLint, etc. and you may want to learn to
    integrate them with IDE’s like Atom, and VSCode.​ One thing you need to do is
    to go to [https://palantir.github.io/tslint/rules/](https://palantir.github.io/tslint/rules/)
    and read a comprehensive list of TSLint rules; you can also learn them as you
    go but a little back story helps a lot, for example the “no-console” rule exists
    because console outputs are for debugging purposes only, and the end-user shouldn''t
    be able to see them. (for context JavaScript is used in web-browsers and anyone
    can pull up the console of a web browser to see it’s logs).​ A thing to keep track
    of is the depreciation timeline of TSLint. See at the time of writing this book
    TSLint maintainers plan to depreciate TSLint gradually and encourage the usage
    of ESLint instead.  For more information visit their official repository on GitHub.
    Meanwhile we can use TSLint without any problems. Instructions for the usage of
    ESLint are provided in the book “Simply ES6” which can be a great companion to
    this books readers.Chapter 3 – ElectronJS and Typescript setup​ Electron is a
    JavaScript framework used to develop applications for desktop operating systems
    like Windows, Linux, and MacOS using HTML, CSS, and JavaScript. Earlier in this
    book we also had a brief introduction to TypeScript, which is an open-source,
    augmented version of JavaScript by Microsoft. In this book we will use TypeScript
    & Electron together, However separate projects will sometimes be provided for
    vanilla JavaScript users. To get started in Electron + TypeScript follow the instructions
    in the following sub-sections.Tips: A lot of Electron debugging can be done using
    a web browser. If you are editing files like HTML, CSS, or front-end JavaScript/TypeScript
    then feel free to use the web browser for debugging. However code that is written
    for Electron centered files like the code we’ll write in the “main.js” file can’t
    be debugged this way.Installing Electron​ To install Electron globally on you
    PC using NPM use the following steps:1\. Open a Terminal/CMD. Use sudo or admin
    privileges when required.2\. Use the following command to verify NPM installation:node
    -v && npm -v​ If you see version numbers like “v10.16.3” and  “6.11.3” then move
    on to the next step. Else go back and install NodeJS and NPM.3\. Use the following
    command to install Electron:s udo npm i -D electron@latestOr use the following
    command to install it globally:sudo npm i -g -D electron@latest --unsafe-perm=true
    --allow-root4\. Use the following command to verify Electron installation:electron
    -v​ If the installation was successful you should see a version number like “v6.0.10”.Setting
    up an Electron Project with TypeScript​ Follow the subsequent instructions to
    set up a new project directory to work from, and the required files, the instructions
    are provided once in a comprehensive manner for the sake of understanding, and
    then again in a manner of express workflow:Note: Read an instruction properly
    before following it.Note: Mind the difference between “.ts” and “.js” extensions.
    The “.ts” extention is a TypeScript file where we’ll write our TypeScript code
    and compile it to a “.js” file, and the JavaScript files will be linked to our
    HTML files and Electron environment.1\. Open a Terminal/CMD. Use sudo or Admin
    privileges when required.2\. Execute this command to see if NodeJS, NPM, TypeScript,
    TSLint, and Electron is installed properly:node -v && npm -v && tsc -v && tslint
    -vYou should see an output like this:v10.16.36.11.3Version 3.6.35.20.0​ Here we
    can see 4 version numbers:The 1st one “v10.16.3” is the version of NodeJS installed
    on my PC.The 2nd one “6.11.3” is the version of NPM installed.The 3rd one “Version
    3.6.3” is the version of TypeScript installed.The last one “5.20.0” is the version
    of TSLint installed.​ Even if a single software is missing we wouldn''t be able
    to do your job so if you don’t see 4 version numbers corresponding to node, npm,
    tsc, and tslint then go back and install the missing software.3\. Create a new
    directory named “myProject” and move inside it using the following command:mkdir
    myProject && cd myProject4\. Use the following command to check for a proper Electron
    installation:electron -v​ If Electron is properly installed we should see a version
    number like the following:v6.0.10​ If you don’t see a version number or if you
    see an error message either go back to the previous section to install Electron
    globally, or install electron locally for this project with the following command:s
    udo npm i -D [electron@latest](mailto:electron@latest)​ If you have installed
    Electron again check it’s installation via the command “electron -v”.5\. Create
    a new directory named “app” inside your “myProject” directory using the following
    command:m kdir app6\. create a “main.ts” file inside your app directory using
    the following command:echo >> app/main.ts7\. Now from your project’s root directory
    (in this case “myProject”) initialize NPM using the command:npm init​ After executing
    this command the CLI will ask you a few questions, use the default answers for
    every question with the exception of the question about entry point; when you
    are asked about entry point you need to use “app/main.js”.​ Your “package.json”
    file will be created with this command, it should look similar to this when read:{ 
    "name" : "myproject" ,  "version" : "1.0.0" ,  "description" : "" ,  "main" :
    "app/main.js" ,  "scripts" : {    "test" : "echo \"Error: no test specified\"
    && exit 1"  },  "author" : "" , "license" : "ISC"}8\. Add the following script
    to your “scripts” property in your “package.json” file:“start” : “electron .”​
    This script simply executes electron, and tells it that the current directory
    is our app’s main directory/root (that is what the period is for).​ Once this
    script is added to your “package.json” file it will look similar to this:{  "name"
    : "myproject" ,  "version" : "1.0.0" ,  "description" : "" ,  "main" : "app/main.js"
    ,  "scripts" : {    "test" : "echo \"Error: no test specified\" && exit 1" ,    
    "start" : "electron ."  },  "author" : "" ,  "license" : "ISC"}9\. When in the
    root directory (“myProject”) use the following command to initialize TypeScript
    and TSLint for this project:tsc –init && tslint –init10.  Add the following TypeScript
    code to your “main.ts” file:import { app } from ''electron'' ;app . on ( ''ready''
    , () => {  console . log ( ''Hello World'' );})11\. Now let’s compile our TypeScript
    files to JavaScript, use the following command:tsc​ When executed from the “myProject”
    directory, this command will compile all our TypeScript files to their corresponding
    JavaScript files.12\. Finally we can execute our code with Electron using our
    “start” script (from package.json). To use the “start” script execute the following
    command from the “myProject” Directory:npm start​ If all went right then you should
    see “Hello World” logged to your CLI resembling the following output:> myproject@1.0.0
    start /home/ray/electronProjects/myProject> electron .Hello World​ The clectron
    will still be running unless you stop it. To stop Electrion press “Ctrl + c” or
    “CMD ⌘ + c”.13\. Now we need to add HTML, and CSS files to our Electron project,
    we also need an “index.ts” file to operate JavaScript on the front-end. Use the
    following command to add these files:echo >> app/index.ts >> app/index.html >>
    app/ main .cssNote: The `touch` command is used but is not required when we have
    `echo`, plus `echo` is cross platform.​ After executing this command from the
    “myProject” directory your app directory should have 3 files added to it, these
    files being “index.html”, “index.ts”, and “main.css”; and your directory should
    have the files “main.ts” and it’s compiled version “main.js” from the previous
    steps.​ The front-end files are “index.html”, “index.ts or .js”, and “main.css”.
    The front-end files will be used to design the “Graphical User Interface” aka
    “GUI ” of our app.​ The back-end of our app is comprised of the files “main.ts
    or .js” and any files like “package.json”, “tsconfig.json”, etc. The back-end
    can be considered the actual software part of our app.Note: The terminology used
    here is adapted from web development since a lot of the readers will be coming
    from a web development background.14\. Now replace the existing code in “main.ts
    ” with the following code:import { app , BrowserWindow } from "electron" ;app
    . on ( "ready" , () => {  const mainWindow = new BrowserWindow ();    mainWindow
    . webContents . loadURL ( `file://${ __dirname }/index.html` );});15\. Now lets
    add some stuff in our HTML, CSS, and JavaScript (in our case TypeScript) files.
    Add the following code to their corresponding files:index.html:<!DOCTYPE html><
    html >  < head >    < tite >My Electron App</ title >    < script src = "index.js"
    defer ></ script >    < link rel = "stylesheet" href = "main.css" >  </ head >  <
    body >    < h1 >Hello Electron</ h1 >  </ body ></ html >index.ts:document. body
    . innerHTML += "<h2>I love JavaScript</h2>" ;main.cssbody {  background-color
    : #fe00fe ;  color : #222 ;}16\. At this point it’s optional to Lint our TypeScript
    code, the code provided above is already linted. To Lint use the command:tslint
    -c tslint.json app/*.ts​ After fixing any linting errors move on to the next step.
    TSLint will output detailed reports on Linting errors including the file name,
    line number, etc. so you can know which file to revisit.17\. Now to compile our
    TypeScript files execute the command:tsc18\. Now let us run our app with the command:npm
    start​ Here if everything went right we should be able to see a window pop up
    that looks like this:![](Image00034.jpg)Express Approach #1(with TypeScript)​
    Express Approach #1 is a basic way to create a project setup, use it to practice
    using Electron until you learn a better approach. Follow the instructions provided
    in this section to set up an Electron project, with TypeScript, TSLint, etc. in
    the fastest way possible:Prerequisites:1\. NodeJS, NPM, TypeScript, TSLint, and
    Electron should all be globally installed.2\. You should be familiar with the
    Terminal/CMD commands.Instructions:1\. Open a Terminal/CMD. Use sudo or admin
    privileges when required.2\. Verify the installation of all the required software
    with the following commands:node -vnpm -vtsc -vtslint -velectron -v​ Output should
    be 5 version number, one for each software like we can see on the left. Don’t
    mind the comments.V10.16.3        //NodeJS6.11.3          //NPMVersion 3.6.3 
    //TypeScript5.20.0          //TSLintv6.0.10         // Electron3\. Create directories
    “ourProject”, and “app”. Use the following command:mkdir ourProject && cd ourProject
    && mkdir app​ This command will also leave your terminal inside the newly created
    “ourProject” directory.4\. Create all the required files including “main.ts”,
    “index.html”, “index.ts”, and “main.css”. Use the following command:echo >> app/main.ts
    >> app/index.html >> app/index.ts >> app/main.css5.  Initialize NPM, TypeScript,
    and TSLint and use the “app/main.js” file as entry-point to the project. Use the
    following command:npm init && tsc --init && tslint --init​ This will create the
    files “package.json”, “tsconfig.json”, and “tslint.json”.​ Use `app/main.js `
    as entry-point.6\. Add the following script to your “package.json” file.package.json:“start”:
    “electron .”7\. Put the following code in our “main.ts” file:main.ts:1  import
    { app , BrowserWindow } from "electron" ;2  3  app . on ( "ready" , () => {4  
       const mainWindow = new BrowserWindow ();5      mainWindow . webContents . loadURL
    ( `file://${ __dirname }/index.html` );6 });8\. Now put whatever code you want
    on the front-end files like “index.html”, “index.ts”, and “main.css”. Code for
    a basic calculator is provided in the following practice Project.9\. Execute the
    following command to Lint (Linting fixes the way you write code) your TypeScript
    code:tslint -c tslint.json app/*.ts​ Executing this line will show a list of errors
    thrown by the Linter. Here, you may see an error like `ERROR: app/index.ts:2:1
    – Consecutive blank lines are forbidden`, this error indicates empty TypeScript
    files.10\. Execute the following command to compile your TypeScript code:tsc11\.
    Execute the following command to run your app with Electron:npm start​ The code
    may throw an error in NodeJS can’t find the `electron` package, if that happens
    use the following command to install electron as a dependency.npm i electron –save-dev​
    That’s it! Your project is up and running! Do as you please.Express Approach #2(without
    TypeScript)​ Express Approach #2 is a basic way to create a project setup, use
    it to practice using electron until you learn a better approach. Follow the instructions
    provided in this section to set up an Electron project without TypeScript:Prerequisites:1\.
    NodeJS, NPM, and Electron should all be globally installed.2\. You should be familiar
    with the Terminal/CMD commands.Note: If you want you can add the ESLint tool as
    a replacement of the TSLint tool, however this approach doesn’t include instructions
    for adding it. Read the book “Simply ES6” to learn and master JavaScript/ES6,
    the ESLint topic is covered in it.Instructions:1\. Open a Terminal/CMD. Use sudo
    or admin privileges when required.2\. Verify the installation of all the required
    software with the following command:node -v && npm -v && electron -v​ Output should
    be 3 version number, one for each software like we can see on the left. Don’t
    mind the comments.V10.16.3        //NodeJS6.11.3          //NPMv6.0.10        
    // Electron3\. Create directories “theProject”, and “app”. Use the following command:mkdir
    the Project && cd the Project && mkdir app​ This command will also leave your
    terminal inside the newly created “theProject” directory.4\. Create all the required
    files including “main.js”, “index.html”, “index.js”, and “main.css”. Use the following
    command:echo >> app/main. js >> app/index.html >> app/index. js >> app/main.css5. 
    Initialize NPM and use the “app/main.js” file as entry-point to the project. Use
    the following command:npm init​ This will create a “package.json” file for you.​
    Use `app/main.js ` as entry-point.6\. Add the following script to your “package.json”
    file.package.json:“start”: “electron .”7\. Put the following code in our “main.js”
    file:main.js:1  var electron = require ( "electron" )2  var { app , BrowserWindow
    } = electron ;3  4  app . on ( "ready" , function () {5        var mainWindow
    = new BrowserWindow ();6        mainWindow . webContents . loadURL ( "file://"
    + __dirname + "/index.html" );7   });8\. Now put whatever code you want on the
    front-end files like “index.html”, “index.js”, and “main.css”. Code for a basic
    calculator is provided in the following practice Project.9\. Execute the following
    command to run your app with Electron:npm start​ That’s it! Your project is up
    and running! Do as you please.Note: This approach doesn’t cover JavaScript linting,
    it’s only meant to be use as a reference point to build you own approach off.Note:
    Multiple approaches are shown in this chapter to do the same thing, this is done
    so you can learn better through comparison!Electron-quick-start Approach​ Electron-quick-start
    Approach is the easiest, and it’s the recommended approach for beginners! It gives
    us 3 basic files required for Electron Apps:'
