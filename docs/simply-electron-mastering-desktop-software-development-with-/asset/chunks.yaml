    还有更多的调试工具，你可以通过浏览 `GitHub` 轻松地为你的实例找到它们。


    ## 测试工具

    测试是软件开发中一个非常重要的部分，就像调试一样，可以使用多种工具，例如 `Spectron`、`Mocha`、`Chai` 等。所有这些工具都可以作为开发者依赖安装到你的项目中。要了解更多相关信息，请访问它们各自的网站、仓库和文档：

    - https://github.com/electron-userland/spectron

    - https://mochajs.org/

    - https://www.chaijs.com/


    由于测试是一个非常综合的话题，在进入 Electron 特定的测试之前，你应该花大量时间学习并掌握测试的基础。在未来的版本中将提供更全面的课程。


    # 第 6 章 – 使用 JavaScript 介绍机器学习、人工智能与机器人学（奖励章节）

    在本章中（节选 `Simply ES6` 作为示例），我们将揭示关于使用 `JavaScript` 进行 `机器学习`、`AI` 和 `机器人学` 相关编程的内容。请注意这不是一节编程课程！你将不会学习任何编程，但你将利用现有的编程技能来学习一些与
    `机器学习` 相关的新知识。本章将涵盖在入门水平使用 `TensorFlowJS` 进行 `张量数学`。在本章结束后，你将能够在某种程度上使用 `TensorFlowJS`。


    ## 机器学习

    学习被定义为知识、理解、技能等的获取。学习的能力是人类、动物甚至植物与生的本能。


    `机器学习` 是 `计算机科学` 的分支，旨在研究能够不断学习和改进的 `算法`，并最终给出更理想的输出。作为一个基础示例，我们可以想象一个`程序`，它接收个人的`教育`
    水平输入，并被预测其`收入`。起这个程序可能会向我们抛出随机值，但如果我们能告诉程序它离真实答案有多远，那么随着时间的推移，它将学习并调整，最终给出越来越准确的答案。这个程序有可能通过查看个人的教育水平为我们提供它能提供的最佳值，由于
    `教育` 水平与`收入`之间可能并不十分，该值仍然与实际值有差距，但结果将是尽可能好的。此类程序可能会使用数值绘图和回归分析等工具，反之它也可能学习避免数据中的离群值。这类程序的
    `算法` 将在 `机器学习` 领域中涵盖。


    `机器学习` 又称为 `ML`，在特定视角下比起`计算机科学`更偏`数学`，不过这种说法适用于所有的 `算法`！`机器学习` 是 `人工智能`（简称 `AI`）的一个分支，人们也可以说
    `ML` 是 `AI` 的一种应用。我经常将`机器学习`和`人工智能`统称为 `ML/AI`。


    以下是`术语`列表，并在需要的地方附有简要解释：


    ### 人工神经网络 简称 ANNs

    `人工神经网络` 是受人类和动物大脑启发的算法。这些程序通过示例进行学习，而不是为了特定目的而进行编程。


    ### 智能与人工智能

    `智能` 可以有许多定义方式，包括`逻辑`和`推理`、`学习与理解`、`自我意识`、`情感`、`创造力`等概念。泛义地说，`人工智能`是由`人工`事物（如`计算机`、`机器人`等）表达的`智能`，而不是`自然`有机体或系统。机器中`智能`的存在引发了许多关于智能本质、人格、人类与机器权利等哲学问题。


    ### 深度学习

    `深度学习` 是`机器学习`的一个分支，它使用`人工神经网络`和其他方法来创建和训练能够学习所提供`数据`更深层概念的算法。这些 `ANNs`（主要是 `CNNs`）具有许多层。


    ### NLP

    `NLP` 又称为“自然语言处理”，是`机器学习`的一个分支，侧重于训练程序以理解人类语言，包括但不限于语音、表达、意义、语境、潜台词等。


    ### 数据科学

    `数据科学`是一个交叉学科，使用`ML/AI`来理解`数据`。`数据科学`包含了数据挖掘、数据可视化、大数据等内容。


    ### 统计学

    `统计学`是`数学`的一个分支，涉及数据的收集以及使用`数学模型`来研究、理解、组织、分析、解释和展示数据。


    ### 机器人学

    在`机器人学`中，我们研究`机器人`的性质、设计与结构、构造与操作以及与之相关的任何其他。


    ### 脑机接口

    `脑机接口` 简称 `BCI` 本质上意味着通过感应控制计算机，而不是使用键盘、鼠标、语音等。这类计算机将具有更快的接口，消耗更少的能量，并使我们免于嗓子哑或腕隧道综合征等问题。


    ### 机器人运维

    `RobotOps` 是机器人领域的 `DevOps`。像“GORT”之类的工具被用于 `RobotOps`。


    ### 物联网

    基本上，物联网 简称 `IoT` 是一种`互联网`概念，它将我们的`微波炉`、`冰箱`、`手机`等连接到像我们使用的`互联网`一样巨大的网络中。


    ### 无处计算

    `无处计算技术`（也称为泛在计算、环境智能等）指的是与我们的生活无缝集成的技术，其以至于我们甚至不知道那是技术，或者不知道我们正在使用它。像衣服、书籍、床单和枕套、建筑等，都是许多人认为是自然而非人工的技术示例。`无处计算`指的是在用户没有意识上意识到正在使用的情况下使用计算机，例如使用智能冰箱等。


    ### Theano

    `Theano` 是一个用于`数学`的 `Python` 库和优化编译器。在编写时，`Theano` 采用“三条款 BSD 许可证”即“新 BSD 许可证”。


    ### Keras

    `Keras` 是一个用于`深度学习`模型的开源库。它结合了 `Theano` 和 `TensorFlow` 的强大，使我们能够创建并训练 `ANN` 模型。


    ### TensorFlow

    `TensorFlow` 是用于`张量数学`和`机器学习`的 Apache License 2.0 库。它可以与 `Python`、`JavaScript`、`NodeJS`、`Go`、`C`、`C++`
    等配合，并可以在带有或不带有 `GPU` 加速的情况下使用。


    ### 数据集

    数据集是带有适当`元数据`的`数据`集合。例如带有标签告诉我们图像内容的，如一张`狗`的照片配上“狗”字。`数据`通常计算机难以理解，而`元数据`是以计算机易理解的形式存在的。有像
    `MNIST` 这样的数据集，程序员（或者我们应该称他们为训练者）使用它们来训练`神经网络`和 `ML 模型`。`MINST` 是由数字的`手写图像`组成的`数据集`。你可以创建自己的`数据集`并将其发布在
    `GitHub` 之类……使用像 `MINST` 这样的数据集，`卷积神经网络` 简称 `CNN` 可以将图像中每个像素的信息作为输入层`神经元`的输入。因此，为了处理一个
    8px*8px 的 2bit 图像，如果没有额外的信息匹配，输入层需要 64 个神经元。


    ## AI/ML、数据科学与技术倡议

    `AI/ML`、`数据科学`和`技术` 领域始终处于研发的最前沿。如果你真的感兴趣，可能想要关注某些公司、人物和项目以获取最新动态。以下是我强烈推荐的：


    1. **Open AI**（Ilya Sutskever, Sam Altman, Greg Brockman）。曾是非营利组织，但现在不再是。与 `Microsoft
    Corp` 建立了 10 亿美元的投资关系。截至 2020 年约 120 人。他们的目标是“发现并实现通通用人工智能的路径”。LinkedIn 的 Reid
    Hoffman 和 Paypal 的 Peter Thiel 等人在某种程度上与之相关。


