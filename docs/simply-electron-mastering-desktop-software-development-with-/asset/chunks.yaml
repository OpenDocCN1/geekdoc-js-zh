  trans: "\n\n| 符号 | 功能 | 示例 | 结果 |\n| :--- | :--- | :--- | :--- |\n| + | 加两个数字，或连接两个字符串。也可以将字符串与数字连接。\
    \ | `1+2` | 3 |\n| - | 减两个数字。 | `1-2` | -1 |\n| * | 乘两个数字。 | `1*2` | 2 |\n| /\
    \ | 除两个数字。 | `1/2` | 0.5 |\n| % | 得除法的余数。 | `1%2` | 1 / *因为 1 个苹果无法在不切成碎片的情况下分给\
    \ 2 个人*/ |\n\n## 条件判断\n\n在 JavaScript 中，条件判断非常简单，我们要做的就是写一个 `if/else` 语句。看下面的示例：\n\
    \n```javascript\nlet x = 1;\nIf (x > 0) {  // 执行某些操作\n} else {\n  // 执行其他操作\n\
    }\n```\n\n我们也可以使用像下面这样的单行条件判断：\n\n```javascript\nlet x = 1;\nlet y = (x > 0) ?\
    \ true:false; // 因为 1 大于 0，所以 y 为 true\n```\n\n可以使用以下运算符进行比较：\n\n| 运算符 | 名称 |\
    \ 功能 | 示例 |\n| :--- | :--- | :--- | :--- |\n| `==` | 等于 | 检查左侧值是否等于右侧值。如果是返回 true。\
    \ | `1 == 2 //false` |\n| `===` | 严格等于 | 检查左侧值是否等于右侧值，且类型相同。如果是返回 true。 | `1 ===\
    \ “1” //false` |\n| `!=` | 不等于 | 检查左侧值是否等于右侧值。如果是返回 false。 | `1 != 2 //true` |\n\
    | `>` | 大于 | 检查左侧值是否大于右侧值。如果是返回 true。 | `2 > 1 //true` |\n| `<` | 小于 | 检查左侧值是否小于右侧值。如果是返回\
    \ true。 | `2 < 1 //false` |\n\n## 函数\n\n函数用于隔离一段代码并在多处通过引用它。看下面的示例：\n\n```javascript\n\
    function myFunk(x) {\n  alert(x);\n}\nmyFunk(“Hello World”);\n```\n\n在上面的代码中 `myFunk`\
    \ 是函数名。`x` 是函数使用的参数，`Hello World` 是该参数在最后一行被调用时的值。\n\n此代码输出：\n![](img/Image0025.jpg)\n\
    \n## 对象\n\nJavaScript 对象是非常数据管理工具。它们基本上是可以轻松转换为不同数据结构的集合。比较两种创建 JavaScript 对象的方法：\n\
    \n### 不使用对象：\n```javascript\nvar player1 = “Human”;\nvar health1 = 100;\nvar power1\
    \ = 50;\nvar weapon1 = “Hands”;\n```\n\n### 使用对象：\n```javascript\nvar player_1\
    \ = {\n  name: “Human”,\n  health: 100,\n  power: 50,\n  weapon: ”hands”\n}\n\
    ```\n\n使用对象的方法在变量之间提供了更好的集成和协调。看看调用对象内部值的几种方法：\n\nJavaScript 代码：\n```javascript\n\
    var myObj = {\n  firstName: \"Anna\",\n  lastName: \"Voice\"\n}\nconsole.log(myObj.firstName\
    \ );\nconsole.log(myObj.lastName );\nconsole.log(myObj[\"firstName\"] );\nconsole.log(myObj[\"\
    lastName\"] );\n```\n\n输出：\n![](img/Image0026.jpg)\n\n在这里我们两种方法调用了 `myObj` 中的\
    \ `firstName` 和 `lastName` 成员。第一种是使用 `myObj.firstName` 和 `myObj.lastName` 方法；这种方法被称为点符号表示（dot-notation）。\n\
    \n另一种调用这些对象的方法是使用 `myObj[\"firstName\"]` 和 `myObj[\"lastName\"]`。这种方法很有帮助，因为我们可以动态向对象传递键名。将其视为动态表示（dynamic-notation）。\n\
    \n## 数组\n\n数组是 JavaScript 中的一种数据类型，允许你在变量中存储有序的数据集合，就像列表一样！数组中的每个元素可以通过从 0 开始的索引数字来标识（这被称为零索引）。数组中的第一个元素索引为\
    \ 0，第二个索引为 1，第三个索引为 2，依此类推。简单来说，`Array` 就是列表，而数组索引就是我们列表中的项目编号：\n\n这是如何写数组：\n\
    ![](img/Image0027.jpg)\n\n要创建一个数组，我们只需要在一对括号内包含数据/元素列表；此外数据需要用逗号 `“` 分隔。这就是创建数组的所有内容！\n\
    \n要调用这些元素，只需调用变量并传递一个索引数字。例如：\n\n```javascript\nvar myList = [\"Jam\", \"Butter\"\
    , \"Bread\"];\nconsole.log( myList[0]); // 输出: Jam\nconsole.log( myList[1]); //\
    \ 输出: Butter\nconsole.log( myList[2]); // 输出: Bread\n```\n\n## For 循环\n\n多次编写相同的代码是疯狂的！相反，如果我们想让一段代码运行特定的次数，可以使用名为循环的工具。看下面的示例：\n\
    ![](img/Image0028.jpg)\n\n控制台输出：\n![](img/Image0029.jpg)\n\n与其这样做，我们只需要使用循环，只需看下面的示例：\n\
    \n```javascript\nfor (var i = 0; i <= 10; i++) {\n  console.log(i);\n}\n```\n\n\
    我们可以使用这段代码，输出将保持不变。这是一个 `for` 循环，还有其他类型的循环，但它们本质上都在做相同的工作。`for` 循环是你使用频率最高（80%）的循环，所以要学好它！\n\
    \n`for` 循环由三部分组成，其语法如下所示：\n![](img/Image0030.jpg)\n\n- `初始化` 部分声明一个变量并赋予一个值，通常是循环的起点；在示例中我们给变量赋了初始值\
    \ 1。\n- `条件` 部分要求一个比较运算符在每次循环开始时进行检查，只要条件为 `true` 循环就会运行；在示例中，我们希望循环运行 10 次，所以我们选择了条件\
    \ `i<=10`，这样在前 9 次执行时 `i` 的值小于 10，循环正常运行；第 10 次执行时值恰好等于 10，循环继续运行；第 11 次检查条件时，`i`\
    \ 的值为 `11`，它不再小于等于 10，因此条件返回 false，循环结束。\n- `迭代` 部分必须是一个 JavaScript 表达式，用于增加或减少我们变量\
    \ `i` 的初始值。\n\n"
- fmt: "\nA good example for their use will be:\nHTML: `<div id='root'></div>`\nJavaScript:\
    \ `document.getElementById('root').innerHTML = \"Hello World\";`\nIn this example\
    \ the result would be “Hello World” displayed on the web page.\n\n# ES6 AKA ES2015\n\
    \nSimply speaking “ES6” is an advanced version of `JavaScript`! Its also known\
    \ as `ES2015` since it is based on `ECMAScript 2015` standard set by European\
    \ Computer Manufacturers Association aka `ECMA`.\n\nAt first glance there is not\
    \ much to learn to integrate `ES6` in our daily JavaScript code, However before\
    \ you move on to the next sections we recommend having a good grasp of `ES6`,\
    \ it it not a prerequisite but nevertheless highly recommended. If you want to\
    \ learn `ES6` further you can buy the book “Simply ES6: Mastering JavaScript and\
    \ ES6 to its fullest” a bestseller which has been called:\"One of the best ES6\
    \ books of all time\" - `BookAuthority`\n\nFollowing is a list of basic stuff\
    \ we can learn to get started with `ES6`:\n\n1. Start using `let`, and `const`,\
    \ variable declarations instead of the `var` declaration. The `var` has it’s place\
    \ but avoid it as much as possible.\n2. Start using `ES6` classes in `JavaScript`.\n\
    3. Start using the back-tick character (`) (can be found below the “Esc” key)\
    \ for long, multi-line strings. These type of strings are called “Template literals”.\n\
    4. Start using fat-arrow functions when you don’t need keywords like `this`.\n\
    5. Go buy the book “Simply ES6”, its a very comprehensive topic.\n\nLet’s look\
    \ at how to do this!\n\n## Classes in ES6\n\nClasses are sort of “Object factories”\
    \ in the sense that they take in arguments and return objects. `ES6` provides\
    \ a very easy way to make classes in `JavaScript`! Let’s look the following code\
    \ to get a better understanding:\n\n```javascript\nclass FarmAnimal {\n  constructor\
    \ (species, name) {\n    this.species = species;\n    this.name = name;\n    this.love\
    \ = 0;\n  }\n  increaseLove () {\n    this.love += 10;\n  }\n}\nlet david = new\
    \ FarmAnimal (\"dog\", \"David\");\nconsole.log (david);\ndavid.increaseLove();\n\
    console.log (david);\n```\n\nConsole Output: ![](Image00031.jpg)\n\nSee how simple\
    \ writing classes are in `ES6`?! All we need to do is write the keyword `class`\
    \ followed by the name of our class, followed by the instructions for our objects\
    \ creation! Like here we have instructed the class to create a function named\
    \ `increaseLove()` and then called that function for the `david` object on the\
    \ 2nd last line. You see we only use the keyword `const` to declare variables\
    \ that we never want to change the value of! They are constant throughout our\
    \ code. Never try to re-assign/change the value of a `const` based variable.\n\
    \n## Fat Arrow Functions\n\n`ES6` brings a new type of function in `JavaScript`,\
    \ the “Fat-Arrow Function”. This type of function is not a replacement of the\
    \ traditional JavaScript functions, but they will be used most of the time. Let’s\
    \ look at the following functions:\n\n![](Image00032.jpg)\n\nAfter looking at\
    \ this fat arrow function it might seem like more work than the old way of writing\
    \ functions but that is not always true. Also notice the `=>` fat arrow notation,\
    \ stylish right?!\n\n## NodeJS for Electron\n\n`NodeJS` is a framework of `JavaScript`\
    \ that allows us to write code that runs on the back-end of websites & web-services,\
    \ at least that is the initial purpose of `NodeJS`.\n\nNote: A framework is just\
    \ a way to write, compile, and work with code.\nNote: Back-end is another name\
    \ for the server PC that serves web pages to the client / end-user / front-end\
    \ / the person visiting the website.\n\n## Downloading NodeJS\n\nTo use `NodeJS`\
    \ we need to download it from its website and install it. If you are using Windows\
    \ or Mac you can use the following steps to download and install `NodeJS`:\n\n\
    Steps :-\n1. The first step to download `NodeJS` is to go to its website “nodejs.org”\
    \ or whatever comes up on a search online. Find and click on this button (note:\
    \ 10.16.0 can be any version number):\n"
