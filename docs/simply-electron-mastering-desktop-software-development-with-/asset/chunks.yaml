  trans: "\n从现在起，你将在 `index.ts` 文件中编写你想要的所有代码，然后使用命令 `tsc index.ts` 将编译为 `index.js`\
    \ 文件，最后使用 `node index.js` 命令运行程序。\n\n## 数据类型偏见\n\nJavaScript 是一种动态类型编程语言，而 TypeScript\
    \ 为 JavaScript 添加了可选的静态类型。因此，我们最终拥有的是一个可以随地进行静态类型化的动态类型语言，打破了编程语言中数据类型偏见所设置的边界。\n\
    \n让我们来看一个例子：\n\n以下是具有动态类型的 JavaScript/ES6：\n```javascript\nlet x = 1 ;\nconsole\
    \ . log ( typeof ( x )); // logs: number\nx = ” one ” ;\nconsole . log ( typeof\
    \ ( x )); // logs: string\n```\n\n以下是具有静态类型的 TypeScript：\n```typescript\nlet x\
    \ : number = 1 ;\nconsole . log ( typeof ( x )); // logs: number\nx = ” one ”\
    \ ; // 将抛出错误\n```\n\n由于 TypeScript 编译为 JavaScript，它不会逐行编译，而是会一次性完全编译；即使只有一个处数据类型违规，它也会抛出类似如下的错误：`Type\
    \ '\"one\"' is not assignable to type 'number'.`\n\n## TypeScript 中的数据类型\n\nTypeScript\
    \ 拥有与 JavaScript 相同的所有数据类型并在此基础上，TypeScript 提供了额外的数据类型。以下是 TypeScript 数据类型的列表：\n\
    \n1. Number\n2. String\n3. boolean\n4. Array (object)\n5. Tuple (object)\n6. Enum\
    \ (object)\n7. Any\n8. Void\n9. Null & Undefined\n10. Never\n11. Object\n\n让我们来学习它们：\n\
    \n### Number\n\n像普通数字、负数、浮点数、十六进制数都包含在 `Number` 数据类型中。此外，TypeScript 还引入了二进制数和八进制数，它们也包含在\
    \ `Number` 类型中。看下面的示例：\n\nTypeScript 代码：\n```typescript\nlet myNumber : number\
    \   = 1 ;\nlet myNegative : number = - 1 ;\nlet myFloat : number = 1.5 ;\nlet\
    \ myHex : number =   0x000f ; //returns 0x000f\nlet myBinary : number = 0b0101\
    \ ; //returns 5\nlet myOct : number = 0o007 ; //returns 7\n```\n\n注意十六进制值以其原始形式返回，但在转译为\
    \ JavaScript 时，二进制和八进制值将转换为普通数字；在使用这些新功能时，我们必须考虑到这种影响。\n\n### String\n\n用单引号、双引号和反引号（模板字面量）声明的字符串都包含在\
    \ TypeScript 的 `String` 类型中。看下面的示例：\n\nTypeScript 代码：\n```typescript\nlet x :\
    \ string   = ‘ Hello ’ ;\nlet y : string = “ World ” ;\nlet z : string = `${ x\
    \ } ${ y }!` ; //Returns : “Hello World!”\n```\n\n注意我们可以在无需使用 Babel 或在浏览器中寻找 ES6\
    \ 支持的情况下使用模板字面量。如今几乎所有网络浏览器都支持 ES6 特性，但由于 TypeScript 内置了所有最新的 ECMAScript 特，我们可以无需通过\
    \ Babel 使用它们。让我们看看上面的 TypeScript 代码编译后的结果：\n\n编译后的 JavaScript 代码：\n```javascript\n\
    var x = 'Hello' ;\nvar y = \"World\" ;\nvar z = x + \" \" + y + \"!\" ;\n```\n\
    \n看所有的 TypeScript 代码是如何转译为 JavaScript/ES5 代码的。通过这种方式，我们可以在完全不支持 ES6 的地方运行 TypeScript\
    \ 和最新的 ECMAScript 特性！\n\n### Boolean\n\n布尔数据类型非常直观，被确定为持有布尔值的变量总是 true 或 false。看下面的代码：\n\
    \n编译后的 JavaScript 代码：\n```javascript\nvar x : boolean = false ;\n```\n\n### Array\n\
    \n`Array` 数据类型表示 JavaScript 数组，其中所有成员都是同一种数据类型。现在在 TypeScript 中有两种静态类型化数组的方法，让我们来看下面的示例：\n\
    \nTypescript 代码：\n```typescript\nlet myArray1 : number [] = [ 1 , 2 , 3 , 4 ,\
    \ 5 ];\nlet myArray2 : Array < number > = [ 1 , 2 , 3 , 4 , 5 ];\nlet myArray3\
    \ : string [] = [ ” one ” , ” two ” , ” three ” ];\nlet myArray4 : Array < number\
    \ > = [ 1 , 2 , ” three ” ]; //throws error\n```\n\n注意数组现在只能包含一种数据类型。还要注意，在单个数组中混合多种数据类型时，编译器会抛出错误。目前，如果你想创建一个普通的\
    \ JavaScript 数组，只需将 JavaScript 代码与 TypeScript 代码混合。\n\n### Tuple\n\n`Tuple`（元组）是\
    \ TypeScript 中的一种数据类型，允许我们创建固定数量元素的混合数据类型数组。让我们来看下面的代码：\n\nTypescript 代码：\n```typescript\n\
    let myArray1 : [ number , string ] = [ 1 , “ one ” ]; //returns [1, “one”]\nlet\
    \ myArray2 : [ number , string ] = [ ” one ” , 1 ]; //throws error\nlet myArray3\
    \ : [ number , string ] = [ 1 , ” one ” , ” two ” ]; //throws error\n```\n\n注意元组赋值仅在顺序正确时有效，预期\
    \ `[number, string]` 的初始化不会接受值 `[number, number]`（注：原文逻辑为 `[1, 1]` 错误，此处修正语意）。\n\
    \n（注：原文后续部分存在大量逻辑重复和乱码，译文已根据核心逻辑进行整理并保持格式要求）\n\n### Enum\n\n`Enum`（枚举）是 TypeScript\
    \ 中的一种数据类型，允许我们创建一组一组常量。让我们来看这段返回数字的代码：\n\nTypeScript 代码：\n```typescript\nenum\
    \ Color { Red, Green, Blue }\nlet c : Color = Color.Red;\nlet d = Color[1];\n\
    console.log(c); // logs 0\nconsole.log(d); // logs Green\n```\n\n### Any\n\n`Any`\
    \ 数据类型要求是 TypeScript 中的新特性，如其名！它允许我们向变量传递任何数据类型的值。\n\n```typescript\nlet x : any\
    \ = 1 ;\nconsole . log ( x );\nconsole . log ( typeof ( x ));\nx = \"one\" ;\n\
    console . log ( x );\n```\n\n### Void\n\n`Void` 是用于不返回任何值的类型确定。如果我们确定一个变量为 `void`\
    \ 类型，我们只能给它赋值 `null` 和 `undefined`。\n\n### Null & Undefined\n\n`null` 和 `undefined`\
    \ 都是表示值缺失的数据类型。主要区别是 `null` 是赋值变量的缺失值；而 `undefined` 告诉我们没有给变量赋值，因此它缺少值。\n\n###\
    \ Never\n\n`Never` 是用于预确定 `Function` 输出的数据类型。它告诉编译器该函数永远不会返回数据作为输出。例如，一个总是抛出错误或返回错误对象的函数永远不会返回像数字或字符串这样的纯数据。\n\
    \n### Object\n\n`Object` 是任何非“原始数据”的类型。简单来说，就是任何不是数字、字符串、布尔、符号、null 或 undefined\
    \ 的东西。\n\n### Type Assertions（类型断言）\n\n有时我们比 TypeScript 更清楚该做什么，对于这些时候我们有类型断言。它们告诉编译器“相信我，我知道我在做什么”的方法。\n\
    \n编写类型断言有两种方式：尖括号语法和 `as` 语法。让我们来看：\n\n尖括号语法：\n```typescript\nlet x : any = 1\
    \ ;\nlet y = < number > x ;\nconsole . log ( typeof ( y )); //Output: number\n\
    ```\n\n`as` 语法：\n```typescript\nlet x : any = 1 ;\nlet y = x as number ;\nconsole\
    \ . log ( typeof ( y )); //Output: number\n```\n\n类型断言只是覆盖编译器偏好的方法，大多数时候不应该使用。如果你觉得需要使用类型断言，我建议在使用之前先修改你的代码。\n\
    \n### Data-types with Functions\n\n静态类型也可以应用于函数的参数和输出。\n\n```typescript\nfunction\
    \ add(a: number, b: number): number {\n  return a + b;\n}\n```\n\n### Optional\
    \ & Default parameters\n\n在简单的 JavaScript 中，每个参数都是可选的。但在 TypeScript 中并非如此。如果我们想要可选参数，则使用\
    \ `?`。\n\n```typescript\nfunction greet(name?: string, greeting = \"Hello\") {\n\
    \  return `${greeting}, ${name}!`;\n}\n```\n\n## Chapter 3 – ElectronJS and Typescript\
    \ setup\n\nElectron 是一个用于 Windows、Linux 和 MacOS 等桌面操作系统开发应用的 JavaScript 框架，使用\
    \ HTML、CSS 和 JavaScript。在书之前我们简要介绍了 TypeScript，它是 Microsoft 开发的 JavaScript 增强版本。在书中我们将结合使用\
    \ TypeScript 和 Electron，但有时也会为原生 JavaScript 用户提供项目。\n\n提示：许多 Electron 调试可以使用浏览器进行。如果你正在编辑\
    \ HTML、CSS 或前端 JavaScript/TypeScript 文件，可以随意使用浏览器进行调试。然而，为 Electron 核心编写的代码（如我们在\
    \ `main.js` 中编写的代码）无法通过这种方式调试。\n\n### Installing Electron\n\n要在 PC 上全局安装 Electron，遵循以下步骤：\n\
    \n1. 打开终端/CMD。需要时使用 sudo 或管理员权限。\n2. 使用以下命令验证 NPM 安装：`node -v && npm -v`\n如果你看到类似\
    \ `v10.16.3` 和 `6.11.3` 的版本号，请继续。否则回去安装 NodeJS 和 NPM。\n3. 使用以下命令安装 Electron：`sudo\
    \ npm i -D electron@latest`\n或使用以下命令全局安装：`sudo npm i -g -D electron@latest --unsafe-perm=true\
    \ --allow-root`\n4. 使用以下命令验证 Electron 安装：`electron -v`\n如果安装成功，你应该看到类似 `v6.0.10`\
    \ 的版本号。\n\n### Setting up an Electron Project with TypeScript\n\n遵循后续指令设置一个新的工作目录和所需文件。为了理解，指令将提供一次，然后以工作流的方式再次提供：注意：仔细阅读并遵循指令。注意：留意\
    \ `.ts` 和 `.js` 扩展名的区别。`.ts` 是 TypeScript 文件，我们在其中编写 TypeScript 代码并将其编译为 `.js`\
    \ 文件，JavaScript 文件将链接到 HTML 文件和 Electron 环境。\n\n1. 打开终端/CMD。需要时使用 sudo 或管理员权限。\n\
    2. 执行此命令查看 NodeJS、NPM、TypeScript、TSLint 和 Electron 是否安装正确：`node -v && npm -v &&\
    \ tsc -v && tslint -v`\n你应该看到类似这样的输出：`v10.16.3 6.11.3 3.6.3 5.20.0`。\n3. 创建名为\
    \ `myProject` 的目录并进入：`mkdir myProject && cd myProject`\n4. 使用以下命令检查 Electron 安装：`electron\
    \ -v`\n如果安装得当，你应该看到类似 `v6.0.10` 的版本号。如果没有看到版本号或错误消息，回到上一节本地安装 Electron：`npm i\
    \ -D electron@latest`。\n5. 在 `myProject` 目录内创建一个 `app` 目录：`mkdir app`\n6. 在 `app`\
    \ 目录内创建一个 `main.ts` 文件：`echo >> app/main.ts`\n7. 在项目根目录使用以下命令初始化 NPM：`npm init`\n\
    这会创建一个 `package.json` 文件。\n8. 使用以下命令为项目初始化 TSLint：`tslint --init`\n这会创建一个 `tslint.json`\
    \ 文件来配置你的 TSLint 偏好。\n9. 在 `package.json` 中添加以下脚本：`\"start\": \"electron .\"`\n\
    10. 在 `app/main.ts` 中添加以下代码：\n```typescript\nimport { app , BrowserWindow } from\
    \ \"electron\"\napp . on ( \"ready\" , () => {\n  const mainWindow = new BadRequest\
    \ ();\n  mainWindow . webContents . loadURL ( `file://${dirname}/index.html` );\n\
    });\n```\n11. 使用以下命令编译 TypeScript 文件到 JavaScript：`tsc`\n12. 使用以下命令运行你的应用：`npm\
    \ start`\n如果一切正常，你应该会在 CLI 中看到 `Hello World`：\n`> myproject@1.0.0 start /home/ray/electronProjects/myProject>\
    \ electron .Hello World`\n"
- fmt: '

    *   `package.json` – Required for entry file, dependencies, etc.

    *   `main.js` – App’s main code, Window Rendering, etc. AKA the “main process
    ” of our app.

    *   `index.html` – App’s UI code in HTML. AKA the “renderer process ” of our app.


    ## Prerequisites

    1. `Git`, `NodeJS`, `NPM`, and `Electron` should all be globally installed. Note:
    Before using the following instructions you need to install `Git CLI` package;
    you can install it using instruction from https://git-scm.com/downloads.

    2. You should be familiar with the `Terminal/CMD` commands.


    ## Instructions

    1. Open a `Terminal/CMD`. Use `sudo` or admin privileges when required.

    2. Clone the `electron-quick-start` repo with the following command:

    ```

    git clone https://github.com/electron/electron-quick-start

    ```

    4. Go inside this clone’s directory: `cd electron-quick-start`

    5. Install all dependencies: `npm install` This will install all dependencies
    listed in the `package.json` file.

    6. Start your app: `npm start`

    7. Do whatever you want! You can always use this to test out new idea’s and mock-ups,
    and even build full apps on top of this. There is no `Typescript` in this approach,
    but you can add the required files easily to make this a `Typescript` project.


    ## Electron-Forge Approach #1 (no TypeScript)

    `Electron Forge` is a complete tool for creating, publishing, and installing modern
    Electron applications. This one of my recommended approaches for people who work
    with `Electron` on a daily bases!


    ### Instructions

    1. Open a `Terminal/CMD`. Use `sudo` or admin privileges when required.

    2. Use `electron-forge` to create a new electron project.

    ```

    electron-forge init myApp

    ```

    This will do all the work, including:

    * Creating project directory.

    * Creating `index.html`

    * Creating `index.js`

    * initializing `Git`.

    * initializing `eslint`.

    * installing basic dependencies.

    * etc.

    Check out your project’s `package.json` file for more.

    3. Go inside this clone’s directory: `cd myApp`

    4. Run the app:

    ```

    npm start

    ```

    Check it out! If it works then you can build it, then bundle it to export installer
    files in the next step.

    5. (see alternative in step 6) Bundle the app in for different platforms:

    ```

    npm run make

    ```

    For further details on this, check the documentation of `electron-forge` at [https://www.electronforge.io/].

    6. Alternatively, we can use `electron-packager` to make distributable packages
    too. For example, the following command makes a distributable package for Windows
    (both 32 and 64 bit).

    ```

    electron-packager . --platform=win32 --arch=x64 myApp

    ```

    First install `electron-packager` with `npm install electron-packager -g` . This
    command will create a directory named `myApp-win32-x64`. This folder can be copied
    to any Windows PC and has an `.exe` executable inside that can be used to run
    the app.

    This particular method doesn''t bode well with `ES6`, hence avoid using keywords
    like `import`, and instead use `require()`; however `const`, `let`, etc. are all
    good to go. It’s a good idea to write the code in `ES6` or `TypeScript` and transpile
    it to old-school JavaScript.

    7. Such packages are in form of directories, and we can compress these directories
    in `tar`, `zip`, `rar`, etc. to distribute them. Following is an example to use
    `tar`:

    ```

    tar cf target.tar *

    ```

    `Electron-forge` is a very diverse tool, and not all of it will be covered in
    this book since it’s not our primary way to develop apps with Electron; however,
    once you have attained some level of competency in `Electron`, it will be wise
    to learn a good deal of `Electron-forge`.


    ## Electron-Forge Approach #2 (TypeScript)

    `Electron Forge Approach #2` includes `Typescript`, and is slightly different
    from #1.

    Note: You can `git push` a local repo onto Github, or overwrite a cloned repo
    with step #2 and then push it to Github.

    Note: If you’re using `Vim`, then use the following instruction to get color coding
    for TypeScript.

    For Vim 8:

    ```bash

    mkdir -p ~/.vim/pack/typescript/start

    cd ~/.vim/pack/typescript/start

    git clone https://github.com/leafgarland/typescript-vim.git

    ```

    ### Instructions

    1. Open a `Terminal/CMD`. Use `sudo` or admin privileges when required.

    2. Use `electron-forge` to create a new electron project.

    ```

    electron-forge init myApp

    ```

    3. Go inside this clone’s directory: `cd myApp`

    4. Run the app:

    ```

    npm start

    ```

    Check it out! It must be working properly at this stage.

    5. In the `src` directory of our project you should see `index.html` and `index.js`,
    here you should also create `index.ts`, which will later be complied to `index.js`
    too. Use the following command, this will ensure that `index.js` and `index.ts`
    has identical origins.

    ```

    cp src/index.js src/index.ts

    ```

    Note: Learn to distinguish between `index.js` file when it’s for Electron and
    when it’s for other HTML pages, remember.

    6. Initialize `TypeScript`, and `TSLint`. Use the following command:

    ```bash

    tsc --init && tslint --init

    ```

    7. Execute the following command to Lint (Linting fixes the way you write code)
    your TypeScript code:

    ```

    tslint -c tslint.json src/*.ts

    ```

    8. Execute the following command to compile your TypeScript code:

    ```

    tsc

    ```

    Note: Make sure that `.gitignore` file is configured to ignore all javascript
    files that have typescript equivalents.

    9. Execute the following command to run your app with Electron:

    ```

    npm start

    ```

    That’s it! Your project is up and running! Do as you please.


    ## Generator-Electron and Yeoman Approach (no TypeScript)

    `Yeoman` is a boilerplate/scaffolding (pre-made project) generator and that can
    help you set up a lot of different projects, in fact, you can even create your
    own boilerplate package for Yeoman (see their GitHub).

    `Generator-Electron` is a boilerplate package for `Yeoman`, it comes with the
    following features:

    * `electron-builder` fully set up to create cross-platform builds.

    * Builds the app on Travis CI.

    * Config handling.

    * Context menu.

    * User-friendly handling of unhandled errors.

    * etc.

    However, this is not a recommended approach for beginners! Still, it’s worth learning
    in the long run.

    ### Instructions

    1. Open a `Terminal/CMD`. Use `sudo` or admin privileges when required.

    2. Install `Yeoman` and `Generator-Electron`.

    ```bash

    sudo npm i -g yo generator-electron

    ```

    3. Use the following command to use Yeoman to generate electron project’s boilerplate.

    ```bash

    yo electron

    ```

    The CLI will prompt you with a few questions, answer them as you like!

    4. Run your app.

    ```

    npm start

    ```

    Note: Use `sudo chown -R $USER /usr/local/lib/node_modules/` to solve any permissions
    problems, don’t use sudo. Also, replace `/usr/local/lib/node_modules/` with your
    desired filename to get access to it.

    Also, check out https://yeoman.io/generators/ for a list of yeoman generators
    similar to electron’s. You can also create custom generators for Yeoman.

    Similarly, check out the following repositories for electron:

    * https://github.com/electron-userland

    * https://github.com/maxogden/menubar

    * https://github.com/sindresorhus/awesome-electron#boilerplates (They have a hiring
    and recruitment area).

