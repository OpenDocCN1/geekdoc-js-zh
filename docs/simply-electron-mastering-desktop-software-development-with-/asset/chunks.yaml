  trans: "\n\n```javascript\nconst { app } = require ( ‘electron’ );\napp . on ( ‘ready’\
    \ , () => {\n    console . log ( ‘hello world’ );\n});\n```\n\n- 在 `~/myApp/`\
    \ 目录下的终端运行 `npm start`。\n- 你应该看到终端输出了 `hello world `。\n\n在第 #1 行，我们正在从 ‘electron’\
    \ 包中导入一些代码，并将其存储在一个名为 `app` 的对象中。从第 #3 行到第 #5 行，我们正在使用 `app ` 对象的 `on ` 方法来“等待应用准备就绪”，一旦准备就绪，它就会运行第\
    \ #4 行的代码。此时，从本质上讲，NodeJS 应用和 ElectronJS 应用之间并没有太大区别，但实际上我们正在使用 Electron JS。如果你在\
    \ `main.js` 中添加以下代码，只要你的程序配有一个 `index.js` 文件，它就会为你的应用显示一个头部/窗口：\n\n```javascript\n\
    const { app } = require ( ‘electron’ );\nlet mainWindow = null ;\n\napp . on (\
    \ ‘ready’ , () => {\n    console . log ( ‘hello world’ );\n    mainWindow = new\
    \ BrowserWindow ();\n    mainWindow . webContents . loadURL ( `file://${__dirname}/index.html`\
    \ );\n});\n```\n\n在第 #3 行，我们声明了一个变量，稍后将持有应用的主窗口对象。在第 #5 行到第 #9 行，我们有 `app.on()`\
    \ 函数，它会在应用准备就绪时触发。在第 #7 行，我们将一个 `ElectronJS` 窗口对象赋值给 `mainWindow` 变量。注意这里，ElectronJS\
    \ 是基于 Chromium 的，因此窗口对象包含了适配自 Chromium 项目的代码。在第 #8 行，我们告诉 `mainWindow` 窗口加载名为\
    \ `index.html` 的文件，该文件存储在项目的根目录下，这里的根目录是 `~/myApp/app/`，但 `__dirname` 是引用当前目录的另一种方式。现在你可能注意到我们还没有创建\
    \ `index.html` 文件，你可以在 `~/myApp/app/` 中创建一个，并向其中添加以下代码：\n\n```html\n<!DOCTYPE\
    \ html>< html ><head >  < title >Page Title</ title ></head ><body >  < h1 >Hello\
    \ Electron</ h1 ></body ></html >\n```\n\n现在运行 `npm start` 将显示以下窗口：\n![](img/Image00036.jpg)\n\
    \n## 进阶代码入门\n\n在本节中，我们将向你展示一些新的（稍微高级的方法），并在我们学习的过程中对每一行代码进行叙述性解释。其目的是为了让你与 ElectronJS\
    \ 代码之间建立熟悉感。即使你现在不理解这段源码，只需学习它即可；在后面的章节中，我们将遍历许多不同的场景和示例，当你读完这一章时，你将对 ElectronJS\
    \ 代码有很好的理解。观察以下 ElectronJS 代码，它通过颜色编码的方式将相似的代码分在一起：\n\n```javascript\nconst {\
    \ app , BrowserWindow } = require ( ‘electron’ );\nconst url = require ( “url”\
    \ );\nconst url = require ( “path” );\n\nconst mainWindow = null ;\n\napp . on\
    \ ( ‘ready’ , () => {\n    console . log ( ‘hello world’ );\n    mainWindow =\
    \ new BrowserWindow ({ height : 800 , width : 600});\n    const filePath = url\
    \ . format ({\n      pathname : path . join ( __dirname , “index.html” ),\n  \
    \    protocol : “file:” ,\n      slashes : true ,\n    });\n    console . log\
    \ ( filePath );\n    mainWindow . webContents . openDevTools ();\n    mainWindow\
    \ . on ( ‘closed’ , ()=>{\n      mainWindow = null ;\n    });\n    mainWindow\
    \ . webContents . loadURL ();\n});\n```\n\n此外，请以下颜色代码说明：\n\n1. 从第 #1 行到 #6 行的代码对于很多应用来说是相同的，它们对我们的程序至关重要。\n\
    2. 从第 #18 行到 #20 行的代码也是像这里这样复制粘贴的，它们对于我们的程序正常关闭至关重要。\n3. 从第 #11 行到 #15 行的代码通常不需要；我们可以自己写\
    \ Path，但这是推荐的方法，特别是对于跨平台软件。\n\n现在，在第 #1 行，我们从名为 `electron` 的包中导入名为 `app` 和 `BrowserWindow`\
    \ 的对象。在第 #3 行和第 #4 行，我们导入了 `url` 和 `path` 对象。这些对象包含了处理 URL 和文件路径的方法！此外，`path`\
    \ 和 `url` 是 NodeJS 的原生模块。在第 #10 行，我们向 `BrowserWindow()` 传递了一个对象作为参数，该对象有 `height`\
    \ 和 `width` 属性，它定义了应用程序窗口的起始高度和宽度。在第 #11 行到第 #15 行，我们使用“url”对象的方法 `format` 生成了一个\
    \ URL；我们向它传递另一个对象作为参数，该对象将包含如 `pathname`（我们在这里使用 path 来开发）、`protocol` 和 `slashes`\
    \ 等属性。在第 #17 行，我们为渲染进程（即可见的网页）打开了开发者工具；这类似于 Chromium 开发者工具！你不需要在商业发布的程序中放入此内容。在第\
    \ #18 行到第 #20 行，我们有主窗口关闭事件。`MainWindow` 是你进程的主线程，注意 `closed` 事件是如何嵌套在 `ready`\
    \ 事件之中的。在第 #21 行，我们加载了一个 URL。该 URL 将作为参数传递给它。为了更清晰的版本，看以下代码：\n\n```javascript\n\
    const { app , BrowserWindow } = require ( ‘electron’ );\nlet mainWindow = null\
    \ ;\n\napp . on ( ‘ready’ , () => {\n    console . log ( ‘hello world’ );\n  \
    \  mainWindow = new BrowserWindow ({ height : 800 , width :600 });\n    mainWindow\
    \ . webContents . loadURL ( `file://${__dirname}/index.html` );\n    mainWindow\
    \ . on ( ‘closed’ , ()=>{\n        mainWindow = null ;\n    });\n    mainWindow\
    \ . webContents . loadURL ();\n});\n```\n\n"
- fmt: "\n<body style=”-webkit-app-region: drag” > This allows you to drag windows\
    \ by holding window contents and dragging them.\n\nMenus\n\nOnce you’ve conjured\
    \ a Window for your program, now you can add a menu (the top bar where options\
    \ like File, Edit, View, Tools, Help, etc. are placed). Use the following procedures\
    \ to add a menu bar and menu items.\n\n1. Follow the Electron-quick-start Approach\
    \ to get a scaffold (base project to build off of!) for your project. It will\
    \ look the following (initially).\n\n![](Image00037.jpg)\n\n2. Notice how there\
    \ is a `default` menu with options like File, Edit, View, etc.\n\n3. Use the following\
    \ steps to generate a basic menu, code of all of these steps will be provided\
    \ below, and is used in the `main.js` file.\n\n    - Import the `Menu` class from\
    \ electron: `const { app , BrowserWindow , Menu } = require ( 'electron' )`\n\
    \    - At the end of this file, Create an Array named `template `, it’s structure\
    \ will be discussed down the line.\n```javascript\nconst template = [\n  {\n \
    \   label : 'Menu 1' ,\n    submenu : [\n      {\n        label : 'menu item 1'\n\
    \      }\n    ]\n  },\n  {\n    label : 'Menu 2' ,\n    submenu : [\n      {\n\
    \        label : 'menu item 1'\n      }\n    ]\n  }]\n```\n    - Set up a Menu\
    \ when the App is ready: `.app .whenReady (). then (() => {\n  const menu = Menu\
    \ . buildFromTemplate ( template );\n  Menu . setApplicationMenu ( menu );\n \
    \ createWindow ()\n})`\n\n4. Once all this is done, then use `npm start` to test\
    \ our app.\n\n   It should look like this:\n\n![](Image00038.jpg)\n\n5. Here,\
    \ each menu can have items and sub-menus, depending upon the structure of the\
    \ `template` array. Also note how the `label` prop determines the Item name (like\
    \ “menu 1`, “menu 2”, etc.).\n\n6. Our `main.js` file will look something like\
    \ this by the end:\n\nNote: Changes are made bold and their line numbers are marked\
    \ with an asterisk*, and code that isn’t required is omitted (but will still be\
    \ inside the `main.js` file), and mind the line-numbers (use them to guide you).\n\
    \n```javascript\n1*2   const { app , BrowserWindow , Menu } = require ( 'electron'\
    \ )\n3  const path = require ( 'path' )\n4\n5  function createWindow () {...}\n\
    1425 app . whenReady (). then (() => {*26     const menu = Menu . buildFromTemplate\
    \ ( template );*27     Menu . setApplicationMenu ( menu );28     createWindow\
    \ ()35 })36*47 const template = [.../*see in previous steps*/...]\n​\n```\n\n\
    In the code provided above, we have done the following:\n\n1. Imported `Menu`\
    \ class on line #2.\n2. On line #47 we have our menu object’s template (that’s\
    \ why we named it “template”).\n3. On line #26 we’ve built a menu using the template\
    \ using `Menu.buildFromTemplate(template)` and assigned it to the variable named\
    \ “menu”.\n4. On line #27 we’ve set that “menu” as our menu, here we have used\
    \ the `Menu` class’s `setApplicationMenu`.\n\nTo understand this better we need\
    \ to understand that we have several different things we are calling “menus”:\n\
    \n- We have a `Menu` class, this is a collection of Electron Methods used to work\
    \ with Electron menus. This one is distinguished by a Capital “M”. It’s imported\
    \ on line #2, then we’ve used it’s `buildFromTemplate()` method on #26, and then\
    \ we’ve used it’s `setApplicationMenu()` method on #27.\n- We have a variable\
    \ named “menu” which we’ve declared on line #26, and assigned it the menu we’ve\
    \ built.\n- Then there is the `template` variable declared on line #47, this holds\
    \ the structure of our actual menu. This is where the work on our part happens.\n\
    \n### Menu structure\n\nNow let’s talk about the structure of our menus. Observe\
    \ the following structure of our template:\n\n```javascript\nconst template =\
    \ [\n  {\n    label : 'Menu 1' ,\n    submenu : [\n      {\n        label : 'menu\
    \ item 1'\n      }\n    ]\n  },\n  {\n    label : 'Menu 2' ,\n    submenu : [\n\
    \      {\n        label : 'menu item 1'\n      }\n    ]\n  }]\n```\n\nIf you observe\
    \ closely the opening and closing of brackets, as well as the type of brackets\
    \ you will see that there is sense in the structure of the template object.​ Each\
    \ menu template must be a Javascript array, and each of it’s member items are\
    \ our major “menus”; these are the menus we see on the top tray with items like\
    \ File, Edit, View, Insert, etc. We can structure it like this:\n\n```javascript\n\
    const template = [\n  {/*File*/},\n  {/*File*/},\n  {/*Edit*/}]\n```\n\nEach Item\
    \ must be a Javascript Object, with required props like `label`.\n\nWe have a\
    \ prop named `submenu` which can be used to build menus within menus, where all\
    \ menus follow the same structuring rules that template follows. For example:\n\
    \n```javascript\n1  const template = [\n2      {\n3         label : 'Menu 1' ,\n\
    4         submenu : [\n5            {\n6               label : 'menu item 1'\n\
    7            }\n8         ]\n9      }\n10 ]\n11\n12 if ( process .platform ===\
    \ 'darwin' ){\n13     const name = app . getName ();\n14      template . unshift\
    \ ({\n15         name : name ,\n16         submenu : [{\n18  label : 'Quit' ,\n\
    19             click : function () { app . quit () }\n22 }]\n24     });\n25 }\n\
    ```\n\nHere the menu itself starts on line #1 and ends on #10, and it is initiated\
    \ with square brackets, the 1st menu item starts on line #2 and ends on line #9,\
    \ and since it’s a menu item (not a menu, but an item) it’s initiated with curly\
    \ brackets. In fact, this is a rule of thumb! If it’s initiated with curly brackets\
    \ then it’s a menu item , if initiated with with square brackets it’s a menu or\
    \ sub-menu or sub-sub-menu, and so on.​​ Another thing to notice here is the code\
    \ from line #12 to #25, this code is use to add an additional app menu for our\
    \ software if we are using Mac OS. You only need to worry about this code if you\
    \ are developing Mac OS (but that’s the least of your headaches for that!).Note\
    \ how we use the `click` prop to assign functions to items.\n\n### Menu Items\
    \ and Props\n\nA menu item can be anything, like “Cut”, “Copy”, “Paste”, “Save\
    \ File”, etc. A menu item has many props like label, role, click, type, checked,\
    \ accelerator, sublabel, icon, visible, id, etc. A full list is available here:\
    \ [https://www.electronjs.org/docs/api/menu-item](https://www.electronjs.org/docs/api/menu-item)​\
    \ Let’s take a look at a few of them:\n\n- `label` (string) : This prop defines\
    \ the name of our menu items (or sub-menus). Menu names can be like File, Edit,\
    \ View, etc.\n- `sublabel` (String) : This prop accompanies our menu-item’s label.\n\
    - `submenu` (menu array) : This prop can be used to make a pull-out sub-menu attached\
    \ to a menu item.\n- `click` (function) : This prop defines the function that\
    \ will be triggered when someone clicks the menu-item.\n- `role` (string – keyword)\
    \ : This can be set to pre-made agents like “cut”, “copy”, “paste”, “quit”, “about”,\
    \ etc. If this prop is used, then Label and Click is optional.\n- `type` (string\
    \ - keyword) : This can be used to generate different kinds of items like ‘radio\
    \ button’, checkbox`, ‘separator’, etc.\n- `checked` (Boolean) : This can either\
    \ be true or false , and can only be used meaningfully with the type checkbox\
    \ and radio .\n- `accelerator` (String – ShortcutFormat) : This can be used to\
    \ set our menu-item to a shortcut like `CommandOrControl+Shift+P`.\n"
