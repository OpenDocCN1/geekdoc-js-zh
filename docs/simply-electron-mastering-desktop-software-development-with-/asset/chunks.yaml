    ## 引言

    Electron 是一个用于构建原生、跨平台桌面软件的 JavaScript 框架。简单来说，如果你能创建一个网页，你就可以用 Electron 构建桌面软件。在本书中，我们将首先回顾一下软件开发的历史。本书还将涵盖
    `TypeScript` 和 `Electron` 等主题，这一终极组合将让我们直接进入顶尖领域。


