    NodeJS with NPM.11\. In your project’s directory you can use `npm init ` to start
    a questionnaire in your CLI, answer each question as you want, or leave the default
    value by pressing enter on each question. This will initialize NPM for your project,
    giving you a package.json file.​ What we have learned so far in this book is just
    a glimpse of NodeJS, it is far more powerful than even Electron. I suggest you
    make further effort to learn NodeJS even if you work front-end only.Chapter 2
    – TypeScript​ TypeScript is the chemical X for JavaScript, no joke! TypeScript
    is an open-source programming language developed and maintained by Microsoft.
    It is basically JavaScript with optional static typing, and latest ECMAScript
    features, that means it has ES6, ES7, etc. built-in. It also integrates really
    well with ReactJS, ElectronJS, ASP.NET, Ruby on Rails, Expo and React-Native.
    If you like JavaScript then you will love TypeScript!Data-types​ Lets learn a
    little about the classifications of data-typing in programming languages. Remember
    JavaScript is dynamically typed, weakly typed, and duck typed.Note : The following
    definitions are loosely typed. Pun intended!Dynamically typed:- Means we don’t
    have to assign a data-type to a variable when we are declaring it.Statically typed:-
    Means we must assign a variable a data-type when we declare it.Dynamically typed
    example:var x = 1 ;var y = “ one ” ;var z = true ;Statically typed example:int
    x = 1 ;string x = “ one ” ;bool = true ;​ See how in JavaScript ( a Dynamically
    typed language ) we can just use keywords like “var ”, “let ”, and “const ” to
    declare variables without knowing their data-types beforehand.​ However in the
    Statically typed code we have a pseudo-programming language which uses keywords
    like “int ”, “string ”, “bool ”, etc. to declare variables which have fixed, presumed
    data-types.Strongly typed:- Means it is hard for data-types to interact with each
    other, and convert to one another.Weakly typed:- Means it’s easy to switch among
    data-types, and make them interact.Weakly typed example:var x = 1 ;var y = “ one
    ” ;console . log ( x + y ); //logs “1one” as a stringStrongly typed example:int
    x = 1 ;string x = “ one ” ;console . log ( x + y ); //throws error​ See how in
    JavaScript ( a Weakly typed language ) we can just add a number and a string together,
    and JavaScript will join both together, then return an output with the data-type
    set to “string”, which it determined all by itself.​ However in Strongly typed
    section we have a pseudo-programming language which throws an error if we try
    to directly add values with two different data-types.​ Now JavaScript is also
    Duck typed language, which means data-types depends on what the data looks like!
    Get it?"If it walks like a duck and it quacks like a duck , then it must be a
    duck "​ What this means is that JavaScript doesn''t care what data-type a variable
    is intended to be, if it has methods of an array (like map()), then it must be
    an array! If it has methods of a string then it must be a string. You get the
    idea!​ To use TypeScript we need to Transpile (Translate/Compile) our TypeScript
    code in to standard JavaScript code. To do this we first need to download TypeScript,
    we can download it by using the following command:sudo npm install -g typescript​
    Also note that TypeScript files have a “.ts” extension, while JavaScript files
    have a “.js” extension.​ Here the “sudo” command prefix is only for Linux users.
    Windows users can run the command “npm install -g typescript” with after opening
    the CMD with administrator rights.​ Make sure you have the latest version of NodeJS
    and NPM. To update NodeJS and NPM after installing them use the commands:sudo
    npm install -g npmsudo npm install -g nodejs​ Once TypeScript is downloaded and
    installed we can check it’s version number and verify a proper installation using
    the following command “tsc -v ”. This command returns a version number like “3.6.3”.​
    Once NodeJS, NPM, and TypeScript is installed and up to date, lets set up create
    a new project directory and get to work.Creating a new Typescript project​ Follow
    the subsequent steps to set up a Typescript project:


    1.  Open a Terminal/CMD.


    2.  Create a new directory named “myTS”. Use the terminal command “mkdir myTS
    && cd myTS ”.


    3.  Initialize NPM with the command “npm init ” and select all the default choices.


    4.  Create an “index.ts” file for our TypeScript source-code. Use the command
    “echo >> index.ts ”.


    Note: The “index.ts” file has a “.ts” extension,  this file will later be transpiled
    to an “index.js” file which is the entry point of our app.


    5.  Open the “index.ts” file in a code editor, and add the following Typescript
    code to it:


    const message : string = ''hello world'' ;console . log ( message ); //logs hello
    world


    6.  Save the “index.ts” file.


    7.  Use the TypeScript-Compiler to transpile “index.ts” to an “index.js” file.
    Use the command “tsc index.ts ” to do it.


    8.  Use the command “ls ” to see the contents of our “myTS” directory. You should
    see an “index.js” file, an “index.ts” file, and a “package.json” file.'
