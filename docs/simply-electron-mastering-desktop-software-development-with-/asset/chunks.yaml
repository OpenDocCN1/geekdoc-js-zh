  trans: "\n\n# 异步通信\n\n为了避免窗口假死，我们的大多数 IPC（进程间通信）都应该是异步的。让我们使用以下代码来演示主进程与渲染进程之间的异步通信，其中\
    \ `preload.js` 文件为渲染进程提供高级支持。如果使用正确，当我们的应用启动时，我们应该看到一个发送按钮和一个空消息框。点击按钮后，过了一会儿（几乎是瞬间），我们应该看到消息框显示\
    \ `pong`。\n\n克隆一个全新的 `electron-quick-start` 项目，并将以下源代码相应地添加到它们的文件，同时要仔细考虑在特定文件的哪个位置添加代码。\n\
    \n### index.html\n```html\n<button id=\"send-btn\">Send Ping</button>\n<p id=\"\
    msg\">Reply here</p>\n<script src=\"./renderer.js\" defer></script>\n```\n在这里，我们创建了一个发送按钮、一个显示接收消息的消息框，此外，我们为\
    \ `renderer.js` 脚本添加了 `defer`，使其只会在网页上所有其他内容加载完成后才加载。\n\n### preload.js\n```javascript\n\
    const { ipcRenderer } = require('electron');\nwindow.ipcRenderer = ipcRenderer;\n\
    ```\n在这里，我们在第 #1 行从 `electron` 包中导入了 `ipcRenderer` 模块，并将其赋值给 `window` 对象的的一个属性，这样做是为了将\
    \ `ipcRenderer` 模块传递给渲染进程。虽然这可能不是实现此最佳方法（参见 Electron 的 `context Isolation` 和 `contextBridge`\
    \ 模块），但这绝对是最简单的方法，且无需开启 `nodeIntegration`（这是一个安全漏洞）。此外，请查看更多信息（可选）：https://github.com/electron/electron/issues/9920#issuecomment-575839738\n\
    注意：这也可以一行代码完成，但让我们在这里尽量避免复杂化。\n\n### renderer.js\n```javascript\nconst ipcRenderer\
    \ = window.ipcRenderer;\nconst asyncMsgBtn = document.getElementById('send-btn');\n\
    asyncMsgBtn.addEventListener('click', () => {\n    ipcRenderer.send('rendererToMain',\
    \ 'ping');\n})\nipcRenderer.on('reply', (event, arg) => {\n    document.getElementById('msg').innerHTML\
    \ = arg;\n})\n```\n在第 #1 行，我们声明了一个变量，并赋予了从 `preload.js` 文件传递过来的 `ipcRenderer`\
    \ 模块。在第 #4 行到 #6 行，我们为发送按钮添加了“click”事件监听器。在第 #5 行，代码使用 `ipcRenderer` 进程的 `send`\
    \ 方法通过名为 `rendererToMain` 的通道向主进程发送任意消息 `ping`，这行代码将在有人点击我们窗口上的发送按钮时执行。在第 #8 行到\
    \ #10 行，我们开始使用 `ipcRenderer` 模块的 `on` 方法监听名为 `reply` 的通道。在第 #9 行，代码将在我们通过 `reply`\
    \ 通道接收到消息时立即执行，该代码将获取接收的消息（存储在 `arg` 中），并将其插入到我们网页的消息框中（这里 `msg` 是我们消息框的 ID）。\n\
    \n### main.js\n```javascript\nconst { ipcMain } = require('electron');\nipcMain.on('rendererToMain',\
    \ (event, arg) => {\n    event.sender.send('reply', 'pong');\n})\n```\n到目前这应该足够简单了，`ipcMain`\
    \ 模块与 `ipcRenderer` 类似（只是它是用于主进程的）。我们导入了它，使用它的 `on` 方法监听 `rendererToMain` 通道，以接收来自任何渲染进程的任何消息，并在接收到消息后，通过\
    \ `reply` 通道发送回复 `pong`。注意在发送和接收消息时使用了不同的通道。此外，一个通道充当一个进程的发送者，另一个进程的接收者。\n\n在上面的所有代码中，以下关键字列表是任意的（以及其他等）：\n\
    \n1. `rendererToMain`：这是一个通道名称，可以使用任何我们喜欢的名称，只要它是唯一且有意义的。异步通信在唯一的通道上进行，因此一条消息可以与其他消息区分开来，每个通道专门用于发送消息或接收消息（单向）。该通道被渲染进程用于将消息\
    \ `ping` 发送给任何监听此通道的进程；这里主进程在 `main.js` 的第 #3 行监听了该通道。\n2. `ping` 和 `pong`：这些仅仅是\
    \ javascript 字符串，可以是任何我们喜欢的字符串。例如，`ping` 可以替换为“Hello, who is there?”，而 `pong`\
    \ 可以替换为“Hey, it’s me, the main process.”\n3. `reply`：这也是一个异步通信通道，并遵循命名规范。\n4.\
    \ `send-btn`：这是我们发送按钮的唯一元素 ID，遵循标准的 HTML 命名约定。\n5. `msg`：这也是我们回复消息框的唯一元素 ID。\n\
    6. `arg`：位于 `renderer.js` 的第 #8 行和第 #9 行，这仅仅是一个参数名称（可以是任何单词），该参数存储了我们从回复中收到的消息。\n\
    \n"
- fmt: "\n# Synchronous Communication\n\nFrozen windows may not always be undesired,\
    \ sometimes an algorithm (including UI) must stand still until it receives a response.\
    \ Let’s use the following code for a demonstration of sync-communication between\
    \ the main process and the renderer process, with `preload.js` file again providing\
    \ advanced support to the renderer process. Used correctly, when our app is started\
    \ we should see a send button and an empty message box. When the button is clicked\
    \ we should see the message box showing pong after the window freezes for a little\
    \ while (almost instantly, notice that there is no lag in the signal). Clone a\
    \ fresh `electron-quick-start` project, and appropriately add the following source-code\
    \ to their respective files. Some files will be same as before.\n\n### index.html\n\
    same as `asynchronous`.\n\n### preload.js\nsame as `asynchronous`.\n\n### renderer.js\n\
    ```javascript\nconst ipcRenderer = window.ipcRenderer;\nconst syncMsgBtn = document.getElementById('send-btn');\n\
    syncMsgBtn.addEventListener('click', () => {\n    const replyMsg = ipcRenderer.sendSync('ipc1',\
    \ 'ping');\n    document.getElementById('msg').innerHTML = replyMsg;\n});\n```\n\
    On line #4 to #7 we’ve added a ‘click’ event-listener to our send button. On #5\
    \ we have code that uses the `ipcRenderer` process’s `sendSync` (vs `send` for\
    \ Async-communication) method to send the arbitrary message ‘ping’ to the main\
    \ process over the channel named `rendererToMain` (vs `rendererToMain` for Async\
    \ communication), this line of code will be executed when someone clicks the send\
    \ button on our window. Line #6 will take the reply, and publish it on our web-page’s\
    \ message box.\n\nNotice here how we have only a single channel (`ipc1`) for our\
    \ Sync communications, this is because it’s impossible for the channel to be transmitting\
    \ a secondary line of communication since the software will be frozen until the\
    \ primary chain of communication is complete.\n\n### main.js\n```javascript\n\
    const { ipcMain } = require('electron');\nipcMain.on('ipc1', (event, arg) => {\n\
    \    event.returnValue = 'pong';\n})\n```\nHere, we’ve imported the `ipcMain`\
    \ module, used it’s `on` method to listen to the `ipc1` channel for any messages\
    \ from any of the renderer processes, and upon receiving a message we send the\
    \ reply ‘pong’ over the same channel. `ipc1` is a unique channel name, and can\
    \ be anything as long as it’s a unique string.\n\n# Invisible windows and remote\n\
    \nIn the prior IPC examples we covered communication between the main process\
    \ and a renderer process, for which we used the `ipcMain` and `ipcRenderer` modules;\
    \ in this lesson we’ll use only the `ipcRenderer` module, and we will communicate\
    \ between two renderer processes, instead of a main and a renderer process.\n\n\
    Now, sometimes running code in a window compromises that window’s performance,\
    \ like freezing that window, slowing it down, and even messing up it’s graphics.\
    \ To avoid this, code that is not directly related to a window should be ran in\
    \ another window, which is usually kept invisible. To do this we need the `remote`\
    \ module and the `ipcRenderer` module. The `remote` module will be used to create\
    \ new invisible windows from the renderer process, and the `ipcRenderer` module\
    \ will enable communication among different windows.\n\nNote: Each window can\
    \ be a distinguished renderer process. Make a clone of the `electron-quick-start`\
    \ repo, here we’ll find 3 files:\n\n* `main.js`: We only need to enable the `remote`\
    \ module from this.\n* `index.html`: A button element with id `send-btn`, and\
    \ a paragraph element with id `msg` will be added to this file. This file will\
    \ determine the look of our 1st window (visible).\n* `renderer.js`: This file\
    \ will be attached to `index.html`.\n* `preload.js`: This file is loaded with\
    \ all other HTML files as if it was attached to every single one of them.\n\n\
    A 4th file will be created by us, side by side with `index.js`.\n\n* `invisible.html`:\
    \ This will be the web-page from our invisible window, and it will have an embedded\
    \ Javascript script similar to the `renderer.js` file.\n\nFollowing is the code\
    \ for these files:\n\n### main.js (Only the new BrowserWindow object is modified):\n\
    ```javascript\nconst { app, BrowserWindow } = require('electron')\nconst path\
    \ = require('path')\n\nfunction createWindow() {\n    const mainWindow = new BrowserWindow({\n\
    \        width: 800,\n        height: 600,\n        webPreferences: {\n      \
    \      preload: path.join(__dirname, 'preload.js'),\n            enableRemoteModule:\
    \ true\n        }\n    })\n\n    mainWindow.loadFile('index.html')\n\n    mainWindow.webContents.openDevTools()\n\
    }\n\napp.whenReady().then(() => {\n    createWindow()\n\n    app.on('activate',\
    \ function () {\n        if (BrowserWindow.getAllWindows().length === 0) createWindow()\n\
    \    })\n})\n```\nIn `main.js` we have kept the code identical to the `electron-quick-start`\
    \ boilerplate, except, we’ve enabled the `remote` module here on line #11.\n\n\
    ### preload.js (add the following code to the end of the file):\n```javascript\n\
    const { BrowserWindow } = require('electron').remote\nconst ipcRenderer = require('electron').ipcRenderer\n\
    const path = require('path')\n\nwindow.browserWindow = BrowserWindow;\nwindow.ipcRenderer\
    \ = ipcRenderer;\nwindow.myPath = path;\n```\nThis is kept identical to the previous\
    \ IPC sections.\n\n### renderer.js:\n```javascript\nconst BrowserWindow = window.browserWindow;\n\
    const ipcRenderer = window.ipcRenderer;\nconst path = window.myPath;\n\nconst\
    \ __dirname = path.resolve();\nconst invisMsgBtn = document.getElementById('send-btn')\n\
    const invisReply = document.getElementById('msg')\n\ninvisMsgBtn.addEventListener('click',\
    \ () => {\n    const windowID = BrowserWindow.getFocusWindow().id;\n    const\
    \ invisPath = `file://${path.join(__dirname, 'invisible.html')}`\n    let win\
    \ = new BrowserWindow({\n        width: 400,\n        height: 400,\n        show:\
    \ false,\n        webPreferences: {\n            nodeIntegration: true,\n    \
    \        enableRemoteModule: true\n        }\n    })\n    win.loadURL(invisPath)\n\
    \    win.webContents.on('did-finish-load', () => {\n        const input = 100\n\
    \        win.webContents.send('compute-factorial', input, windowID)\n    })\n\
    })\n\nipcRenderer.on('factorial-computed', (event, input, output) => {\n    const\
    \ message = `The factorial of ${input} is ${output}`\n    invisReply.textContent\
    \ = message\n})\n```\nThis is also kept identical to the previous IPC sections\
    \ as much as possible. We’ve defined the `__dirname` variable on line #5 since\
    \ we don’t have NodeJS access. We’ve stored the path of out invisible.html in\
    \ the `invisPath` variable. We’ve created a new window with code from #12 to #20,\
    \ made it invisible with the property on #15, and enabled the remote module and\
    \ NodeJS integration on #17 and #18, hence the invisible window will have the\
    \ ability to use NodeJS features, as well as the remote module which allows it\
    \ to create more windows if needed. It’s usually wise to track the ID’s of each\
    \ new window (similar to what we’re doing on line #10), but we’re not doing it\
    \ here to keep things simple. Notice how this code is creating a new window, but\
    \ not closing it. The closing should be done inside the function from #29 to #32,\
    \ we’re saying this because once we’ve received the reply the invisible window\
    \ has no further reason to exist. Programming is so poetic! In my humble opinion,\
    \ the process that’s opening the window should be the one to track that window,\
    \ and then close it. Upon clicking the send-btn button our renderer process (1st\
    \ window) will do the following:\n\n1.  Create a new (invisible) window with code\
    \ from #12 to #20.\n2.  Load the `invisible.html` page to the 2nd (invisible)\
    \ window with code on #21.\n3.  When the page finished loading on the 2nd (invisible)\
    \ window we create an arbitrary input number, and then send it to the 2nd (invisible)\
    \ window.\n"
