    # 第 1 章 – 让我们开始吧


    这一章完全关于学习计算机的历史以及它是如何导致软件发展的。如果你喜欢学习计算机，那么你大有福了！


    我们还将涵盖一些基础的 HTML、CSS、JavaScript、ES6 和 NodeJS。在这里涵盖这些主题的目的是让你对书中需要的内容有一个初步了解。如果你觉得在这些基础主题上很薄弱，请回到基础，在回到本书之前良好地学习它们。如果你想学习
    HTML、CSS、JavaScript、ES6、 NodeJS 等，请阅读《Simply Web Development – Anna Voice, Ray
    Voice》一书。


    ## 计算机历史

    计算机基本上是任何用于计算的设备。有为特定目的制造的计算机硬件（如执行计算等），也有通用计算机，任何人都可以将其重新用于执行不同的任务，例如我们的笔记本电脑、台式机等。然而，“计算机”（Computer）一词第一次出现时，它是用来描述受雇执行计算的真实职业名称。


    ![伊象骨](img/Image00005.jpg)


    当人们开始解决超过他们思维计算能力的问题时，第一个计算设备被发明。计算设备的历史可以追溯到几年前。最早记录的计算设备是像伊象骨那样的计数棒。这些计数棒主要用于记忆目的和基础但冗长的计算。伊象骨大约使用于公元前
    19,000 年，那是旧石器时代。这种技术的相对现代的例子可以想象成念珠和电子计数器。


    ![安提基特亚机械的一部分](img/Image00006.jpg)


    关于古代计算设备的记录，例如安提基特亚机械，它被用于预测天文位置。在图中我们可以看到该设备的一部分。它是由希腊考古学家 Valerios Stais 在 1901
    年在安提基特腊岛附近打捞的残骸中发现的。该仪器被认为是由希腊科学家设计的，并被认为是已知的模拟计算机。它的复杂性表明它一定有此构建出这一成就的前身。它被确定制造于公元前
    87 年左右。然而，提到古代计算机时，我们不能忘记著名的中国算盘，又称“Suanpan”。它最早出现在公元 190 年的一本由许越编写的东汉时期书籍《许氏筹算记》中。虽然这种设备的确切设计尚为人知，但这种设备可以用来执行十进制和十六进制的计算。


    ![算盘](img/Image00007.jpg)


    世界各地使用了不同版本的算盘，最著名的版本是算盘和罗马手算盘。


    ![帕斯卡机又称帕斯卡计算器](img/Image00008.jpg)


    然后是法国数学家布莱斯·帕斯卡发明的帕斯卡机（Pascaline）。这台机器能够执行两个数字的加法，以及通过重复加法执行乘法和除法。帕斯卡机以其向位进位的能力而闻名。这台机器设计于
    1642 年。后来在 1672 年，著名的德国数学家戈特里德·威廉·莱布尼茨（微积分的发明者之一）开发了一种名为进位器（Stepped Reckoner）的设备。


    ![](img/Image00009.jpg)


    在图中我们可以看到进位器的模型。这是第一个能够执行所有算术计算的计算器。这台机器超越了当时的科技，除了机械问题外，还有一个严重的设计缺陷导致其无法可靠地运行。


    ![阿米机](img/Image00010.jpg)


    随后在 1851 年出现了阿米机（Arithmomètre），这是第一种强大且可靠到可以办公数字机械计算器。这种计算器可以直接加减两个数字，并能有效地执行长乘法和除法。一位名叫查尔斯·埃塞尔·托马斯·德科马尔的人在
    1851 年至 1915 年间获得了专利并制造了这种设计。


    ![](img/Image00011.jpg)


    随着阿米机的推出，机械计算器诞生了；在 1851 年到 1890 年的四十年里，它是商业生产中唯一类型的机械计算器。


    ![](img/Image00012.jpg)


    1819 年，英国数学家巴别奇开始制造一种名为“差分机”（Difference Engine）的设备。


    ![](img/Image00013.jpg)


    1837 年，查尔斯·巴别奇提出了该设备的继任者并将其命名为“分析机”（Analytical Engine）。


    ![](img/Image00014.jpg)


    艾伦·图灵被广泛认为是计算机科学和人工智能之父。


    ![艾伦·图灵](img/Image00015.jpg)


    ![](img/Image00016.jpg)


