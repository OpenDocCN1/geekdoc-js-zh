  trans: "\n\n1. 进程间通信，用于在用户在渲染进程中点击某些内容时，通知主进程何时打开“打开文件”对话框。它使用了 `ipcMain` 和 `ipcRenderer`\
    \ 模块。\n\n2. 对话框配置和激活会告诉主进程你将打开哪种类型的文件或目录对话框。它使用了 `dialog` 模块。\n\n3. 使用 `FS` 模块来处理文件的内容。这里不会涵盖这部分，因为它与\
    \ ElectronJS 的关系较小，更多是关于 NodeJS；但我们稍后在制作项目时会介绍它。\n\n使用下面提供的代码进行此类对话框的演示，基于 `electron-quick-start`\
    \ 脚手架构建：`index.html`\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n    <button\
    \ id='open-file-button'>Open file</button>\n    <p id='file-url'></p>\n    <script\
    \ src=\"./renderer.js\" defer></script>\n</body>\n</html>\n```\n\n\n\n非常标准：一个用于打开文件对话框的按钮，一个用于显示所选文件\
    \ URL 的段落元素，以及加载的 `renderer.js` 脚本。\n\n`renderer.js`\n\n```javascript\nconst {\
    \ ipcRenderer } = require('electron')\n\nconst syncMsgBtn = document.getElementById('open-file-button')\n\
    \nsyncMsgBtn.addEventListener('click', () => {\n    const reply = ipcRenderer.sendSync('sync-file-open');\n\
    \    const message = `Selection: ${reply}`;\n    document.getElementById('file-url').innerHTML\
    \ = message;\n    // 可以根据需要使用文件的 URL\n})\n```\n\n我们在第 #5 行到第 #10 行设置了同步通信，在第 #6\
    \ 行，我们通过 `sync-file-open` 通道发送了一个空信号，这让主进程知道按钮已被点击。第 #7 行和第 #8 行在我们的网页上显示回复（即我们选择的文件\
    \ URL）。由于这是同步通信，我们可以使用单个通道来发送和接收信息。\n\n`main.js`\n\n```javascript\nconst { app,\
    \ BrowserWindow, ipcMain, dialog } = require('electron')\nconst path = require('path')\n\
    \nipcMain.on('sync-file-open', (event, arg) => {\n    dialog.showOpenDialog({\n\
    \        properties: ['openFile', 'multiSelections'],//openDirectory\n       \
    \ filters: [{name: 'Images', extensions: ['jpg', 'png']}]\n    }).then(selection\
    \ => {\n        // 在这里使用 fs 模块处理文件\n        event.returnValue = selection.filePaths;\n\
    \    });\n});\n```\n\n整个文件将是一个标准的 `electron-quick-start` `main.js` 文件，导入了 `ipcMain`\
    \ 和 `dialog` 模块，并设置了第 #4 行到第 #12 行通过 `sync-file-open` 通道进行发送和接收信息的同步通信代码。第 #5\
    \ 行到第 #8 行的代码使用 `dialog` 模块打开一个“文件或目录选择”对话框，这里第 #6 行告诉对话框仅打开“文件”（不包含目录），第 #7 行告诉对话框只能选择扩展名为‘jpg’和‘png’的图片。然后，第\
    \ #8 行到第 #10 行的代码使用 `then()` 方法来解析对话框（在我们最终选择文件时它会被解析），并将返回的选择通过赋值给事件的 `event.returnValue`\
    \ 属性通过通道发送回去；这里我们的事件就是接收通信的主进程。\n\n### 保存对话框 (Save Dialog)\n\n如果你想保存文件，需要使用 NodeJS\
    \ 的 `fs` 模块（此处未涵盖，但在后面的练习项目章节中），然而，我们将演示保存对话框的使用，它可以为你完成以下操作：\n\n1. 当用户点击“保存文件”按钮时，它会打开。\n\
    2. 用户将选择目录和文件名，对话框将返回合并后的 URL。\n3. 然后你可以使用此 URL 配合 `fs` 模块实际保存文件。如果此时你还不知道如何使用\
    \ `fs` 模块，或者不知道 `fs` 模块是什么，我们建议在进入练习项目部分之前良好掌握它。\n\n"
- fmt: "\nNote: We’re not really saving files, we’re just going through the front-end\
    \ motions. To save files we need the `fs` module. To learn the basics of Web-development\
    \ technologies like NodeJS, MongoDB, etc. check out the book: Simply Web Development\
    \ : An Introduction to the world of Web development – Anna Voice, Ray Voice. The\
    \ book covers everything an aspiring programmer should master before moving on\
    \ to advanced programming concepts. To avoid knowledge gaps and heartache we suggest\
    \ that the reader go through that book at least once if there are any doubts.\
    \ Now, use the following code (built upon the electron-quick-start scaffold) to\
    \ work with the save dialog.\n\n### index.html\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n    <button id='save-file'>Save File</button>\n    <p id='file-url'></p>\n\
    \    <script src=\"./renderer.js\" defer></script>\n</body>\n</html>\n```\nPretty\
    \ standard, we have a button to open file dialogue with id `file-url`, a paragraph\
    \ element to show the saved file’s URL, and the `renderer.js` script loaded.\n\
