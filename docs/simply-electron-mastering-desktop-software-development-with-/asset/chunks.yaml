    # Chapter 1 – Lets dive in


    This chapter is all about the learning about the history of Computers and how
    it lead to the development of Software. If you like learning about computers then
    you are in for a treat!


    We will also cover some fundamental HTML, CSS, JavaScript, ES6, and NodeJS. The
    purpose of covering these topics here is to give you a hint of what is required
    in this book. If you feel weak in these elementary topics then go back to the
    basics and learn them well before coming back to this book. If you want to learn
    HTML, CSS, JavaScript, ES6, NodeJS, etc. Then read the book “Simply Web Development
    – Anna Voice, Ray Voice”.


    ## History of Computers

    A Computer is basically any device used to compute. There is computer hardware
    made for specific purposes like performing calculations, etc. and then there are
    general purpose computers that can be re-purposed to do different tasks by anyone,
    for example our laptops, desktops, etc. However the first time the term “Computer”
    appeared it was used to describe a job title of actual people who were paid to
    perform computations.


    ![ the Ishango bone](Image00005.jpg)


    The first computing devices are were invented when people set out to solve problems
    that surpassed the computing ability of their minds. There is history of Computing
    devices that goes back thousands of years. The earliest recorded computing devices
    are tally sticks like the Ishango bone. These tally sticks were used mostly for
    mnemonic purposes and basic but lengthy calculations. The Ishango bone was used
    around 19,000 BC which was the Old Stone Age. A relatively-modern example of this
    type of technology can be imagined as prayer beads, and electronic counters.


    ![ part of Antikythera mechanism](Image00006.jpg)


    There are records of Ancient computing devices like the Antikythera mechanism
    which was used to predict astronomical positions. In the picture we can see a
    part of this device. It was discovered by Greek archaeologist Valerios Stais in
    1901 among the wreckage retrieved near Antikythera island. The instrument is believed
    to have been designed by Greek scientists, and is acknowledged as the first known
    analogue computer. Its complexity suggests that it must have predecessors that
    built up to this. It is determined to be made around 87 BC. However when it comes
    to ancient computers we can’t forget the well known Chinese abacus aka “The Suanpan”.
    First appeared in a 190 CE book of Eastern Han Dynasty called “Supplementary Notes
    on the Art of Figures” by Xu Yue”. While the exact design of this device is not
    known, this device could be used to perform both decimal and hexadecimal computations.


    ![ Abacus ](Image00007.jpg)


    Different versions of the Abacus were used around the world, the most famous versions
    being the Suanpan, and the Roman hand abacus.


    ![The Pascaline aka Pascal’s calculator ](Image00008.jpg)


    Then there was The Pascaline aka Pascal’s calculator invented by French Mathematician
    Blaise Pascal. This machine was able to perform addition of two numbers, and multiplication,
    division through repeated addition and subtraction. The Pascaline was famous for
    its ability to carry leftover to next units. This machine was designed in 1642.
    Later in 1672 German mathematician Gottfried Wilhelm Leibniz famously known as
    the sort of a co-inventor of calculus developed a device called “The Stepped Reckoner”.


    ![](Image00009.jpg)


    In this image we can see the replace of the Stepped Reckoner. This was the first
    calculator that could perform all the arithmetic calculations. The machine was
    beyond the technology of its time and had mechanical problems in addition to a
    significant design flaw that rendered it unable to perform reliably.


    ![ the Arithmomètre](Image00010.jpg)


    Then in 1851 came the Arithmomètre, the first digital mechanical calculator strong
    and reliable enough to be used offices. This calculator could add and subtract
    two numbers directly and could perform long multiplications and divisions effectively.
    A man named Charles Xavier Thomas de Colmar patented and manufactured this design
    from 1851 to 1915.


    ![](Image00011.jpg)


    With the launch of Arithmomètre the mechanical calculator came to be; and for
    forty years, from 1851 to 1890, it was the only type of mechanical calculator
    in commercial production.


    ![](Image00012.jpg)


    In 1819 an English Mathematician named Babbage started the construction of a device
    called “The Difference Engine”.


    ![](Image00013.jpg)


    In 1837 Charles Babbage proposed a successor to this device and called it “The
    Analytical Engine”.


    ![](Image00014.jpg)


    Alan Turing is widely considered the father of computer science, and AI.


    ![Alan Turing](Image00015.jpg)


    ![](Image00016.jpg)

