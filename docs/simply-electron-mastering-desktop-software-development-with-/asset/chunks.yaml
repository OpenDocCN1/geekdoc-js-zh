- fmt: "\nFrom line #7 to #11 we’ve added a click event listener to our button element,\
    \ when clicked, the renderer process call the `setTray()` function (if our app\
    \ icon is visible in the system tray) to remove the icon from the tray (which\
    \ happens over the `removeTray` channel, as in remove icon from tray); if invisible,\
    \ then it will call the `setTray()` function to make it visible in the system\
    \ tray (which happens over the `putTray` channel, as in put the icon in the tray).\
    \ Then line #10 toggles the value of `trayOn` since if it was off it will be on\
    \ and vice-versa. \n\nNote: When we say visible we mean exists , and invisible\
    \ means not existing .​\n\nOn lines from #13 to #17 we’ve added a listener to\
    \ the `trayRemoved` channel, this channel serves the purpose of keeping an eye\
    \ on the tray icon, so if the icon is removed through any other means then the\
    \ main process will the renderer process know over this channel. On line #14 we\
    \ signal the main process on the `removeTray` channel, this will signal the main\
    \ process that the renderer process knows that the icon is removed, and the main\
    \ process can adjust it’s state accordingly. On line #15 we’ve set the value of\
    \ `trayOn` to false since the tray icon is invisible. Finally, on line #16 we’ve\
    \ used the `setTrayStatus()` function to change the text of our paragraph element.\
    \ On line #19 we have the function `signalMain` , it’s used to send empty signals\
    \ over the main process using different channels (provided as argument to the\
    \ channel parameter). From line #20 to #23 we have a function that is used to\
    \ signal the main process over various channels, and change the message (tip)\
    \ displayed in the paragraph element. This function is used to toggle the values\
    \ of app icon related variables throughout all processes.\n\n### main.js (Remember\
    \ to turn nodeIntegration on)\n\n```javascript\n1  const { app , BrowserWindow\
    \ , Menu , Tray , ipcMain } = require ( 'electron' );\n2  const path = require\
    \ ( 'path' );\n3  const channel = require ( './channel.js' );\n4  const iconPath\
    \ = path . join ( __dirname , 'iconTemplate.png' );\n5  let appIcon = null ;\n\
    6 \n7  ipcMain . on ( channel . putTray , ( event ) => {\n8      appIcon = new\
    \ Tray ( iconPath );\n9      \n10 const contextMenu = Menu . buildFromTemplate\
    \ ([{\n11      label : 'Remove' ,\n12      click : () => {\n13      event . sender\
    \ . send ( channel . trayRemoved );\n14      }\n15   }]);\n16      \n17  appIcon\
    \ . setToolTip ( 'Electron Demo in the tray.' );\n18  appIcon . setContextMenu\
    \ ( contextMenu );\n19 });\n20 \n21 ipcMain . on ( channel . removeTray , ()=>{\n\
    22     appIcon . destroy ;\n23 });\n24 \n25 app . on ( 'window-all-closed' , ()=>{\n\
    26     if ( appIcon ) appIcon . destroy ;\n27 });\n26 \n28 function createWindow\
    \ () {\n29     const mainWindow = new BrowserWindow ({\n30      width : 800 ,\n\
    31      height : 600 ,\n32      webPreferences : {\n33          preload : path\
    \ . join ( __dirname , 'preload.js' ),\n34          nodeIntegration : true\n35\
    \      }\n36    })\n37     mainWindow . loadFile ( 'index.html' )\n38 }\n39 \n\
    40 app . whenReady (). then (() => {\n41     createWindow ()\n42     \n43   app\
    \ . on ( 'activate' , function () {\n44      if ( BrowserWindow .getAllWindows\
    \ (). length === 0 ) createWindow ()\n45   })\n46 })\n47 \n48 app . on ( 'window-all-closed'\
    \ , function () {\n49  if ( process .platform !== 'darwin' ) app . quit ()\n``````\n\
    \nFrom line #1 to #5 we have our code for importing modules like `Tray`, `Menu`,\
    \ `ipcMain`, `channel.js`, etc. We’re also setting a URL of our app’s icon on\
    \ #4. On line #5 we’ve created a boolean valued variable named `appIcon` (counterpart\
    \ of `trayOn` ) to keep track of our system tray icon being visible or not (hence\
    \ the bool).\n\nOn line #7 to #19 we’re listening to the `putTray` channel (connecting\
    \ us to line #9 of `renderer.js` ), on line #8 we actually create our app’s icon\
    \ in the system tray using the `Tray` module, and we’ve assigned it to the `appIcon`\
    \ variable so we can later work with it.\n\nFrom line #10 to #15 we’ve created\
    \ a `Menu` (remember from the menu section). Here we only have a single menu item,\
    \ and it’s used to remove the icon from the system tray. We can create any menu\
    \ we like. This menu is visible upon right-clicking the app icon in the system\
    \ tray. On line #17 we’ve set a Tooltip for our tray icon, this message will be\
    \ available upon hovering the mouse pointer over the tray icon. On #18 we’ve attached\
    \ the menu we created on line #10 to our app’s tray icon. From line #21 to #23\
    \ we have added a listener to the `removeTray` channel, when the main process\
    \ receives a signal on this channel it will remove app icon from the tray. On\
    \ #24 and below we have standard (unrelated to tray icons) code found in electron-quick-start.\n\
    \n### Drag and Drop support\n\nThe background mechanics of drag and drop are very\
    \ numbing, requiring a lot of messy code and trickery. It basically gives an illusion\
    \ of dragging and dropping, always remember that. Frankly, Electron supports the\
    \ `webContents.startDrag()` API, following code provides a demonstration over\
    \ electron-quick-start:\n\nindex.html\n```html\n1<!DOCTYPE html>\n2<html>\n3<body>\n\
    4<img id=\"drag-file\" src=\"./icon.png\" height=\"50px\" width=\"50px\" />\n\
    5  <script src=\"./renderer.js\"></script>\n6</body>\n7</html>\n```\nVery standard\
    \ file, all we need to care about is the image element. The height and width is\
    \ arbitrary, the important things are the `icon.png` source and the `id`. Now,\
    \ the `id` is arbitrary, still it should be identical in all the required places.\n\
    \nrenderer.js\n```javascript\n1 const { ipcRenderer } = require ( 'electron' )\n\
    2 const dragFileLink = document. getById ( 'drag-file' );\n3 dragFileLink . addEventListener\
    \ ( 'dragstart' , ( event ) => {\n4  event . preventDefault ()\n5  ipcRenderer\
    \ . send ( 'on-drag-start' , __filename )\n6 })\n```\nHere, we’ve grabbed the\
    \ image element on line #2. On line #5 we’ve added a ‘dragstart’ event listener\
    \ to that image element, which triggers when someone starts to drag the attached\
    \ element. Another interesting thing here is the code on line #6, the `event.preventDefault()`\
    \ method is used to stop the natural flow of actions predetermined for that event.\
    \ Calling `preventDefault()` cancels the event. You can use `Event.cancelable`\
    \ to check if the event is cancelable since calling `preventDefault()` for a non-cancelable\
    \ event has no effect. We’re canceling the default flow of this event because\
    \ we will built a custom one using line #7. Line #7 sends a signal on the ‘on-drag-start’\
    \ channel and communicate the URL of the current file on that channel, this is\
    \ what the `__filename` constant is for, it stores the URL of the current file.\
    \ Here, the current file is `index.html` since the `renderer.js` file is attached\
    \ to it and hence is part of the whole HTML file.\n\nmain.js\n```javascript\n\
    1 const { app , BrowserWindow , ipcMain } = require ( 'electron' )\n2 const path\
    \ = require ( 'path' )\n3 \n4 ipcMain . on ( 'on-drag-start' , ( event , filepath\
    \ ) => {\n5   const iconName = 'icon.png'\n6   event . sender . startDrag ({\n\
    7     file : filepath ,\n8     icon : path . join ( __dirname , iconName )\n9\
    \   })\n10 })\n11\n12 function createWindow () {\n13     const mainWindow = new\
    \ BrowserWindow ({\n14      width : 800 ,\n15      height : 600 ,\n16      webPreferences\
    \ : {\n17          nodeIntegration : true\n18      }\n19    })\n20     mainWindow\
    \ . loadFile ( 'index.html' )\n21 }\n22 \n23 app . whenReady (). then (() => {\n\
    24     createWindow ()\n25 })\n26 \n27 app . on ( 'window-all-closed' , function\
    \ () {\n28   if ( process .platform !== 'darwin' ) app . quit ()\n29 })\n```\n\
    \nWhen the code on line #7 in `renderer.js` signals the main process it will trigger\
    \ the code from line #4 to #10 in the `main.js` file, which are the only lines\
    \ we are concerned with in this section, rest of the lines are pretty standard.\
