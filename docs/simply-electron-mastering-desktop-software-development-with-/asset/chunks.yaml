  trans: "\n\n* 点击并选择工具以选取 HTML 元素。\n* Elements（HTML 元素检查器）。\n* Console（控制台，用于日志记录）。\n\
    * Sources（源代码，用于检查应用涉及的文件）。\n* Network（网络，记录和观察网络活动）。\n* Performance（性能，记录和观察资源性能）。\n\
    * Memory（内存，观察内存信息）。\n* Application（应用程序，获取应用的完整全局视图）。\n* Security（安全，各种安全细节）。\n\
    * Lighthouse（灯，一个用于调试性能问题的强大功能）。\n\n在未来的版本中，我们计划对每个独立的开发工具进行更详细的说明，在此之前，学习 Chrome\
    \ 开发者文档中的内容会更好。记住，`Console` 是初级开发者最好的调试工具。\n\n## Devtron\nDevtron 是另一个可以添加到 Chrome\
    \ 开发者工具面板的有用工具。请按照以下指令安装和使用 Devtron：\n\n1. 使用 `npm i –D devtron` 安装 Devtron。在这里，Devtron\
    \ 通过 `-D` 作为开发依赖项安装。\n2. 在 `console` 中使用 `require('devtron').install()` 在该面板中安装\
    \ Devtron。\n3. 现在，在 Chrome 开发者工具面板中将有一个 Devtron 标签页，你可以在那里查看有关事件监听器、IPC 等信息。\n\
    4. 要配置 Manifest 功能，只需编辑 `node_modules/devtron/manifest.json` 文件。如果你不知道那是什么，可以安全地忽略它。\n\
    \n### Devtron 提供的功能：\n1. Require graph：可视化你的应用的依赖关系。\n2. IPC 监控：跟踪并检查进程之间的通信。\n\
    3. 事件检查器：检查在你的应用在核心 Electron API（如 `window`、`app` 和进程）上注册的事件和监听器。\n4. App Linter：分析你的应用可能的问题、缺失的功能等。\n\
    \n访问 [`github.com/electron-userland/devtron`](https://github.com/electron-userland/devtron)\
    \ 了解更多关于 Devtron 的信息。\n\n## VSCode 调试器\nVSCode IDE 内置了调试器，你可以轻松地用它来调试主进程，只需按照以下指令进行设置和使用：\n\
    \n1. 在应用的根目录（也称为 `workspace-root`）中创建一个 `.vscode` 目录。\n2. 创建一个 `.vscode/launch.json`\
    \ 文件。\n3. 在 `launch.json` 文件中添加以下代码。\n\n```json\n{\n  \"version\": \"0.2.0\",\n\
    \  \"configuration\": [\n    {\n      \"name\": \"Debug Main Process\",\n    \
    \  \"type\": \"node\",\n      \"request\": \"launch\",\n      \"cwd\": \"${workspaceRoot}\"\
    ,\n      \"runtimeExecutable\": \"${workspaceRoot}/node_modules/.bin/electron\"\
    ,\n      \"windows\": {\n        \"runtimeExecutable\": \"${workspaceRoot}/node_modules/.bin/electron.cmd\"\
    \n      },\n      \"args\": [\".\"]\n    }\n  ]\n}\n```\n\n4. 点击 VSCode 左上角的绿色播放按钮，它应该显示类似\
    \ \"Debugger listening on ws://127.0.0.1:somePort/someHash\" 和 \"Debugger attached\"\
    \ 的消息。\n5. 现在，点击 VSCode 中行号之前的红点来添加断点，当运行的应用到达该点时，主进程将停止，你可以在那里探索程序的状态。\n\n"
- fmt: '

    More tools exist for debugging, you can easily find them for your individual instances
    by going over `GitHub`.


    ## Testing Tools

    Testing is a very important part of software development, and like debugging,
    a diverse range of tools can be used for it, tools like `Spectron`, `Mocha`, `Chai`,
    etc. All of these can be installed as developer dependencies in your project.
    To learn more about them visit their respective websites, repositories, and documentations:

    - https://github.com/electron-userland/spectron

    - https://mochajs.org/

    - https://www.chaijs.com/


    Since testing is a very comprehensive topic, you should devote a significant time
    learning and master the basics of testing before getting into Electron Specific
    testing. In future editions of more comprehensive lessons will be provided.


    # Chapter 6 – Introduction to Machine Learning, AI, and Robotics with JavaScript
    (Bonus Chapter)

    In this chapter (taken from `Simply ES6` as a sample) we will unveil stuff about
    `Machine Learning`, `AI`, and `Robotics` related programming with `JavaScript`.
    Just to be this is not a programming lesson! You will not be learning any programming,
    however you will be using your existing programming skills to learn some new stuff
    related to `Machine Learning`. This chapter will cover the usage of `TensorFlowJS`
    for `Tensor Mathematics` on a Introductory level. When this chapter is over you
    will be able to use `TensorFlowJS` to some magnitude.


    ## Machine Learning

    Learning is defined as the acquisition of knowledge, understanding, skills, etc.
    The ability to learn is natural in humans, animals, and maybe even plants.


    `Machine Learning` is the branch of `Computer Science` which aims to study `Algorithms`
    that learn and improve, ultimately giving a more desirable output. As a elementary
    example we can imagine a `Program` that takes in input of an individual’s `Education`
    level and is asked to predict their `Income`, at first this program may throw
    random values at us, but if we can tell that program how far off it was from the
    real answer then in time it will learn and adjust, ultimately giving more and
    more accurate answers. Potentially this program is capable of giving us the best
    possible value it can just by looking at an individual’s education level, the
    value will still be far off from the actual values since `Education` level may
    not be that heavily correlated to `Income`, but the result will be as good as
    it can be. Such a program may use stuff like plotting values and regression analysis,
    also in turn it may learn to avoid the outliers in the data. The `Algorithm` of
    this type of program will be covered in the domain of `Machine Learning`.


    `Machine Learning` aka `ML` is more `Mathematics` than `Computer Science` under
    a particular light, however that can be said about all `Algorithms`! `Machine
    Learning` is a subdivision of `Artificial Intelligence` aka `AI`, one can also
    say that `ML` is sort of an application to `AI`. I often refer to `Machine Learning`
    and `Artificial Intelligence` as `ML/AI`.


    Following is a list of `Terminology` paired with brief explanations where needed:


    ### Artificial Neural Networks aka ANNs

    `Artificial neural networks` are algorithms inspired by the human and animal brain.
    These programs learn by examples, without being programmed for a particular purpose.


    ### Intelligence vs Artificial Intelligence

    `Intelligence` can be defined in many ways, including concepts like `Logic` and
    `Reasoning`, `Learning` & Understanding`, `Self-awareness`, `Emotions`, `Creativity`,
    etc. Vaguely speaking `Artificial intelligence` is `Intelligence` expressed by
    something `Artificial` like a `Computer`, `Robot`, etc. instead of a `Natural`
    organism or system. The presence of `Intelligence` in machines rises many philosophical
    questions about the nature of intelligence, person-hood, rights of humans and
    machines, etc.


    ### Deep Learning

    `Deep learning` is a subdivision of `Machine Learning` which uses `Artificial
    Neural Networks` and other methods to create and train algorithms that are capable
    of learning deeper concepts about the provided `Data`. These `ANNs` (`CNNs` mostly)
    are many layers deep.


    ### NLP

    `NLP` aka “Natural language processing” is a subdivision of `Machine Leaning`
    which focuses on training programs to understand human language, including but
    not limited to voice, expression, meaning, context, subtext, etc.


    ### Data Science

    `Data science` is a cross bred field that uses `ML/AI` to understand `Data`. `Data
    science` includes stuff like data mining, data visualization, big data, etc.


    ### Statistics

    `Statistics` is a branch of `Mathematics` that involves the collection of data,
    and the usage of `Mathematical models` to study, understand, organize, analyze,
    interpret, and present data.


    ### Robotics

    In `Robotics` we study the nature, design and structure, construction and operation,
    and anything else related to `Robots`.


    ### Brain-Computer Interface

    `Brain-Computer Interface` aka `BCI` essentially means telepathically controlling
    computer instead of using a keyboard, mouse, voice, etc. These type of computers
    will have a faster interface, will require less energy, and will save us from
    stuff like a sore voice, or carpel tunnel.


    ### RobotOps

    `RobotOps` is `DevOps` for `Robotics`. Tools like “GORT” are used for `RobotOps`.


    ### IoT

    Basically Internet of things aka `IoT` is the concept of an `Internet` that connects
    stuff like our `Microwaves`, `Refrigerators`, `Cellphones`, etc. into a gigantic
    network like the `Internet` we use.


    ### Ubiquitous computing

    The concept of `Ubiquitous Technology` (also known as pervasive computing, ambient
    intelligence, etc.) refers to technology that seamlessly integrates with our life
    to the point where we don’t even know it’s technology, or that we are using it.
    Stuff like clothes, books, bed-sheets and pillowcases, buildings, etc. are all
    examples of technology which many will consider natural instead of artificial.
    `Ubiquitous computing` refers to the usage of computers without users consciously
    realizing that they are using it, for example using a smart refrigerator, etc.


    ### Theano

    `Theano` is a `Python` library and optimizing compiler for `Mathematics`. At the
    time of writing `Theano` was a “3 Clause BSD License” aka “New BSD License”.


    ### Keras

    `Keras` is a FOSS library for `Deep Learning` models. It combines the power of
    `Theano` and `TensorFlow` enabling us to create and train `ANN` models.


    ### TensorFlow

    `TensorFlow` is a Apache License 2.0 library for `Tensor Mathematics` and `Machine
    Learning`. It can be used with `Python`, `JavaScript`, `NodeJS`, `Go`, `C`, `C++`,
    etc. and can be used both with and without `GPU` acceleration.


    ### Data-sets

    A `-set` is a collection of `Data` paired with proper `Meta-data`. For example
    `Images` with tags to telling us what the image is about, like a picture of a
    `Dog` paired with the work "Dog". The `Data` is usually hard to comprehend by
    a computer, and the `Meta-data` is in a easy to comprehend form for computers.
    There are `Data-sets` like `MINST` which programmers (or should we call them Trainers)
    use to train `Neural Networks` and `ML Models`. `MINST` is a `Data-set` comprised
    of `Hand-written Images` of numbers. You can make your own `Data-sets` and post
    them on `GitHub` or something… Using a `Data-set` like `MINST` a `Convolutional
    neural network` aka `CNN` can use each pixel''s info from an image as input to
    a `Neuron` on the input layer. Hence to process a 8px*8px 2bit image 64 neurons
    will be required in the input layer if no additional information is to be paired
    with it.


    ## AI/ML, Data Science and Technology Initiatives

    The fields of `AI/ML`, `Data Science`, and `Technology` is always on the bleeding
    edge of its R&D stuff. If you are really interested you may want to follow certain
    companies, people, and projects for the latest stuff. Following are the ones I
    strongly recommend:


    1. **Open AI** (Ilya Sutskever, Sam Altman, Greg Brockman). Used to be non-profit
    but not anymore. Partnered with `Microsoft Corp` in an investment of US$1 billion.
    Not so Open anymore. About 120 employed, as of 2020. Their objective is “Discovering
    and enacting the path to safe artificial general intelligence”. People like LinkedIn’s
    Reid Hoffman, and Paypal’s Peter Thiel are affiliated to some extent.

