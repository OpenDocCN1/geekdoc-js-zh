    building native, cross-platform desktop software. Simply speaking if you can create
    a basic web page, then you can build desktop software with Electron.​ If you have
    a firm grasp on HTML, CSS, and JavaScript, then lets move forward. Learning Electron
    is so easy it is redonkulous! All we have to do is set up our project and we are
    good to go.​ In this book we will first go through a little bit of history of
    software development. Hit and run topics like JavaScript & ES6\. Then we will
    learn TypeScript and Electron, an ultimate combo that will put us right up there
    in the big leagues. This book will also cover UI/UX Design principles, maxims,
    etc. In the end we have some Case Studies to learn a little bit about the competition.​
    Electron based applications are indistinguishable from other desktop software,
    with Electron we can build high performing software for Windows, Linux, and MacOS.
    Apps like Skype, VS code, etc. are all based on the Electron framework.​ At first
    Electron was for the development of GitHub''s code editor Atom. Now companies
    like Microsoft are adopting the “JavaScript Everywhere” movement! The unique nature
    of JavaScript renders it the best choice for 9 out of 10 of our everyday software
    needs.​ The ultra fast evolution of JavaScript is pushing the boundaries of Technology
    and Economics. For the first time in our history we are able enter the market
    with ease, and meet our increasing software needs. Electron is in fact a significant
    part of an economic revolution in the tech field! The rise of the “JavaScript
    Everywhere” movement means more and better software for everyone!​ JavaScript
    is easy to learn, has a strong community, and its projects are inexpensive. Imagine
    having a web development firm evolving into a software engineering firm! If they
    chose to use Electron, staff training will be inexpensive, will last about a week,
    and will pay off big time!​ JavaScript has no limitations! Its Open, it doesn''t
    force us to use an expensive, proprietary IDE or OS. It doesn''t force us to pay
    a hefty amount to publish our applications either!​ JavaScript runs on front-end
    inside browsers like Firefox, and Chrome. It has NodeJS for back-end. For mobile,
    and desktop platforms it has React Native, and Electron!​ JavaScript also has
    a lightweight engine called “JerryScript” for micro-controllers. It requires less
    than 64kb RAM, and less than 200kb ROM to run. JerryScript has on-device compilation,
    execution, and peripherals able to integrate with JavaScript.​ Samsung has IoT.js,
    a library that allows us to work with IoT using JavaScript.​ Most of these technologies
    are open-source.​ This book intends to give the reader all the tools required
    to master Electron. It puts us through a robust training regime including lessons,
    code narrations, advanced projects, case studies, and more. The end goal is to
    give the readers a strong foundation, and equip them with tools required to master
