    ## Introduction

    Electron is a JavaScript framework for building native, cross-platform desktop
    software. Simply speaking if you can create a web page, then you can build desktop
    software with Electron. In this book we will first go through a little bit of
    history of software development. This book will also cover de topics like `TypeScript`
    and `Electron`, an ultimate combo that will put us right up in the big leagues.


    Electron based applications are indistinguishable from other desktop software,
    with Electron we can build high performing software for Windows, Linux, and MacOS
    Apps like Skype, VS code, etc. are all based on the Electron framework. At first
    Electron was for the development of GitHub''s code editor Atom. Now companies
    like Microsoft are adopting the “JavaScript Everywhere” movement!


