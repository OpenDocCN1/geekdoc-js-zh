    \ give a `title` property in the BrowserWindow object, and give it a string value,\
    \ for example:\n\n    new BrowserWindow({ height:800, width:600, title: ‘My Title’})\n\
    \n*   Don’t add a `title` element (<title></title> ) in our HTML pages, this way\
    \ the “Window-title” will be the `name ` property from our app’s `package.json\
    \ ` file.\n\n*   Add a `title` element in our HTML pages, and the text inside\
    \ that element will become our Window-title.\n\n*   If both a `title` element\
    \ and a `name` property is missing, then the default Window-title will be `Electron`.\n\
    \n*   To hide the Window-title-bar, give a `frame` property in the BrowserWindow\
    \ object, and set it to `false `, for example:\n\n    new BrowserWindow({ height:800,\
    \ width:600, frame: false})\n\n*   Use the following code to do something similar;\
    \ you can set titleBarStyle to `hidden`, `hiddenInset`, etc. and experiment!\n\
    \n    new BrowserWindow({ height:800, width:600, titleBarStyle: ‘hiddenInset’\
    \ })\n\n​ To make frameless windows drag-able without the title-bar use:"
