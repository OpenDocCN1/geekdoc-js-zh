- fmt: "\n## 2. Clearview AI (Highly controversial and Weaponize-able Facial recognition).\
    \ Users include (but not limited to) American Law enforcement like `NYPD`, one\
    \ of the largest armed law enforcement agencies, not including state police, auxiliary\
    \ police officers, school safety agents, traffic police, and retired officers.\
    \ The program is used by law enforcement in Australia, Canada, Denmark, Norway,\
    \ and more. Commercial users include Security companies, Home Depot, `AT&T`, `Well\
    \ Fargo`, AI Center of Advanced Studies (Riyadh, Saudi Arabia), Founders Fund,\
    \ `SoftBank`, etc. The New York Times described the use of Clearview's app as\
    \ \"a secret plaything of the rich \".\n\n## 3. Google Brain (Deep learning, and\
    \ AI) Research Team. Is involved in AI-based encryption, Image enhancement, Google\
    \ Translate, Robotics, etc.\n\n## 4. Blue Brain Project (Swiss), Objective is\
    \ to create a digital brain of a rodent and eventually a human by reverse-engineering\
    \ mammalian brains. Lead by `Henry Markram`, who initially aimed to create a digital\
    \ neo-cortical column (the fundamental unit of a neo-cortex) of mice, the goal\
    \ was archived my `Markram` in 2006. The project has consistently progressed since\
    \ it’s inception. The project is funded primarily by the Swiss government and\
    \ the Future and Emerging Technologies grant. The project uses `Neuron` software\
    \ for modeling neurons; written in `C`, `C++`, and `FORTRAN`, the primary scripting\
    \ language is `Hoc` (`Brian Kernighan`, `Rob Pike`, also implemented in `Plan8`),\
    \ `Python` is also available.\n\n## 5. Project Jupyter (Objective: To support\
    \ interactive data science and scientific computing across all programming languages.).\
    \ Non -profit. Used by `Google`, `Microsoft`, `IBM`, `NASA`, `UC Berkeley`, etc.\n\
    \n## 6. Humanity+ (non-profit, `Nick Bostrom`) An international organization which\
    \ advocates the ethical use of emerging technologies to enhance human capacities.\n\
    \n## 7. 2045 Initiative (non-profit, `Dmitry Itskov`) A network and community\
    \ of researchers in the field of life extension, and Cyborgs.\n\n## 8. Elon Musk\
    \ (FRS) (Open AI, `Neuralink`, etc.), not on the board of `Open AI` anymore, but\
    \ still a donor and reportedly has significant affiliation. Owns `Neuralink`.\
    \ Is famous of cutting edge companies including `SpaceX`, `Tesla, Inc.`. The Boring\
    \ Company, `PayPal`, `SolarCity`, etc. And is doing amazing work on Hyperloop,\
    \ Musk electric jet, Sustainable energy, Mars colonization, and more.\n\n## 9.\
    \ Ray Kurzweil (Author, Inventor, Futurist, Transhumanist). Received the National\
    \ Medal of Technology and Innovation. Present in the National Inventors Hall of\
    \ Fame. Has 21 honorary doctorates. `Kurzweil`, `Google`, `NASA Ames Research\
    \ Center` created the “Singularity University”.\n\n## 10. Peter Thiel (Author\
    \ “Zero to One ”, Legendary Tech Investor and founder of “Founder’s Fund”). Portfolio\
    \ includes `Facebook`, `Airbnb`, `Linked-In`, `Yelp Inc.`, `Spotify`, `Space X`,\
    \ `Stripe`, `AltSchool`, and `ClearView AI`, etc. Initially invested in `Facebook`\
    \ via a Convertible bond. Once replaced `Elon Musk` as the CEO of `PayPal` (then\
    \ `X.com`). Invests in research and ventures related to AI, Life Extension, Sea\
    \ Steading. He is involved in `Breakout Labs` which funds research outside of\
    \ operate, government, or academics confines. The `Thiel Fellowship` annually\
    \ awards $100,000 to 20 people under the age of 23 for them to drop out of college\
    \ and create their own ventures.\n\n## 11. Other notable candidates are Future\
    \ of Life Institute, Mars Society, Singularity University, Lifeboat Foundation,\
    \ Human Brain Project, Apache Mahout, `BRAIN Initiative`, Operation Serenata de\
    \ Amor, `Cyc`, The Venus Project, etc.\n\nNote: For those of you interested in\
    \ AI/ML, Robotics, IoT, and other related technology from an Academic point of\
    \ view I suggest reading up on it in academic journals and following updates from\
    \ people actually doing the research instead of reading blogs, or listening to\
    \ podcasts. A good source is “arXiv.org ”. \n\n### Cylon, Artoo, and Gobot\nThe\
    \ Robotics projects `Cylon`, `Artoo`, and `Gobot` are frameworks for using `JavaScript`,\
    \ `Ruby`, and `Go` language for programming hardware like Robots, IoT, etc. When\
    \ I discovered these projects I instantly fell in love with them, and what a coincidence\
    \ it is?! `JavaScript`, `Ruby`, and `Go` are my favorite languages among others.\
    \ At the time of writing the following common hardware and related tech was supported:\n\
    \n1. `Arduino`\n2. `Raspberry Pi`\n3. `Intel Galileo`, `Edison.` and `IoT Analytics`\n\
    4. `OpenCV` (BSD, real-time Computer Vision Library)\n5. `WICED Sense.`\n6. `Bebop`\
    \ (Parrot's drone with dual-core CPI, quad-code GPU, 9GB flash Memory, 14MP camera,\
    \ and WiFi hot-spot).\n7. `Electric Imp` (IoT)\n8. `Joystick` (Dual-shock 3, `X-box\
    \ 360`, and all `SDL` compatible USB joystick.)\n9. `Keyboard`\n10. `Audio & Speech\
    \ interface.`\n\nThe following commonly General Purpose Input/Output aka `GPIO`\
    \ based devices are supported:\n\n1. `Analog sensor`\n2. `Button`\n3. `Direct\
    \ Pin`\n4. `IR Range Finder`\n5. `LED`\n6. `Motor`\n7. `Relay`\n\nThe support\
    \ is not limited to this list, and more and more support is coming everyday. These\
    \ projects come with modules for `HTTP/HTTPS` (REST), `socket.io`, and `mqtt`.\n\
    \n### TensorFlowJS\nIn it's essence `TensorFlow` and all other Machine Learning\
    \ libraries are just collection of function and routines for High Tech Mathematics.\
    \ `TensorFlowJS` is a `JavaScript` Framework that enables us to build and train\
    \ machine learning models with `JavaScript`. `TensorFlowJS` is used to build deep\
    \ neural network. It powers some of the greatest AI tech we have these days. In\
    \ recent chapters we have learned some Mathematics related with `Tensors`. As\
    \ a revision remember the following terms:\n\n1. 4-dimensional `Tensors` are Arrays\
    \ with 3-dimensional `Tensors` as members.\n2. 3-dimensional `Tensors` are Arrays\
    \ with 2-dimensional `Tensors` as members.\n3. 2-dimensional `Tensors` aka `Matrices`\
    \ are Arrays with 1-dimensional `Tensors` as members.\n4. 1-dimensional `Tensors`\
    \ aka `Arrays` aka `Vectors` are Arrays with 0-dimensional `Tensors` as members.\n\
    5. 0-dimensional `Tensors` aka `Scalars` are Numbers.\n\nIn Mathematics `Tensors`\
    \ can have any amount of dimensions as we want, they have shape which is defined\
    \ by the length of their members and sub-members, and sub-members of sub-members,\
    \ and so on. Just like `Arrays`, `Tensors` have index values too! However they\
    \ look more like map coordinates, so a 1-dimensional `Tensor` aka `Array` have\
    \ index values like `0, 1, 2, 3, 4`, etc. a 2-dimensional `Tensor` has index values\
    \ like `(0, 0)`, `(0 1)`, `(0, 2)`, `(1, 0)`, `(1, 1)`, etc. and a 3-dimensional\
    \ `Tensor` has index values like `(0, 0, 0)`, `(0, 0, 1)`, `(1, 0, 1)`, `(3, 1,\
    \ 0)`, etc. and so on, more the dimensions the more members present in an index\
    \ position. Note: `Tensors`, `Arrays`, `Matrices`, `Vectors`, etc. are not synonymous.\
    \ They have different definitions in Mathematics, and Computer Programming. Don’t\
    \ confuse them with each other! In `TensorFlow` `Tensors` are an immutable from\
    \ of data. With `TensorFlow` we can create, train, export, and import ML models\
    \ in form of sessions. `TensorFlow` can be used for stuff like Machine Learning,\
    \ Data Science, etc. In fact Many people use `TensorFlow`, `Keras`, etc. in Data\
    \ Science competitions on websites like `Kaggle`. `Keras` can be used to export\
    \ trained models, and \"TensorFlow as a tool\" can convert that model in into\
    \ a version that can be used by `TensorFlowJS`, we can install `TensorFlowJS`\
    \ with `pip` for this.\n\n### Setting Up TensorFlowJS\nLet’s do some actual stuff\
    \ with `TensorFlowJS`. In this section we will learn how to do a basic `TensorFlowJS`\
    \ setup, and we will also give you a few examples to get you started in TensorFlow..\
    \ To use `TensorFlowJS` we can use the following packages:\n\n1. `TensorFlowJS`\
    \ - `npm i @tensorflow/tfjs`\n2. `TensorFlowJS` for NodeJS - `npm i @tensorflow/tfjs-node`\n\
    3. `TensorFlowJS` for NodeJS with GPU acceleration - `npm i @tensorflow/tfjs-node-gpu`,\
    \ Requires NVIDIA’s CUDA installed on Linux and an NVIDIA Graphics Card.\n4. `TensorFlowJS`\
    \ as a tool form PIP - `pip install tensorflowjs`\n"
