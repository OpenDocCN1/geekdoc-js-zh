    \ you can make with it.\n\n# Project #1 Calculator\n\nThe goal of this project\
    \ is to build a basic calculator using HTML, CSS, and JavaScript (or TypeScript).\
    \ Use one of the above approaches.\n\nWe have provided code for both JavaScript,\
    \ and TypeScript. If you are using TypeScript use the code with the file extension\
    \ `.ts`, and if you are planing to use vanilla JavaScript then use the files with\
    \ the extension `.js`. \n\n**Note:** you will find a lot of HTML rendering done\
    \ with JavaScript instead of writing direct HTML code, this is for the sake of\
    \ practicing TypeScript/JavaScript. If you prefer you can write direct HTML instead.\n\
    \n**Tips:** Make the project both with and without TypeScript, compare the code\
    \ in both projects.\n\nFollowing is a list of checkpoints we need to cover in\
    \ our project:\n1. The project is a simple `Calculator`.\n2. The project should\
    \ have the following working keys `0` to `9`, `+`, `-`, `=`, and clear. Once the\
    \ project is complete you can add more and more stuff in it.\n3. The buttons should\
    \ be laid out properly in a grid like manner, using either HTML tables or a UI\
    \ framework.\n4. We show be able to see a GUI interface in the form of a desktop\
    \ window.\n\nFollowing is the source-code for all the required files:\n\n### index.ts\
    \ (Only use if using Typescript)\n```typescript\nconst d = document;\nconst display\
    \ = d . getById ( \"disp\" ) || d . body ;\nconst keypad = d . getById ( \"keypad\"\
    \ ) || d . body ;\n\nlet keypadDigits : any = [ [ 7 , 8 , 9 ], [ 4 , 5 , 6 ],\
    \ [ 1 , 2 , 3 ], [ \"+\" , 0 , \"-\" ] ];\n\nfor ( let x of keypadDigits ) {\n\
    \  const row = d . createElement ( \"TR\" );\n\n  for ( let y of x ) {\n    const\
    \ data = d . createElement ( \"TD\" );\n    const button = d . createElement (\
    \ \"BUTTON\" );\n    const buttonContent = d . createTextNode ( y );\n    button\
    \ . appendChild ( buttonContent );\n    button . onclick = () => keypress ( y\
    \ );\n    data . appendChild ( button );\n    row . appendChild ( data );\n  }\n\
    \  keypad . appendChild ( row );\n}\n\nfunction keypress ( input = \"keySt\" )\
    \ : void | null {\n  if ( display . innerHTML . length >= 5 ) { return ; }\n \
    \ const content = d . createTextNode ( input );\n  display . appendChild ( content\
    \ );\n}\n\nfunction clr () : void {\n  display . innerHTML = \"\";\n}\n\nfunction\
    \ equal () : void {\n  // This is a basic project no need to worry about eval()\
    \ or sanitizing.\n  display . innerHTML = eval( display . innerHTML ) || 0 ;\n\
    }\n```\n\n### index.html\n```html\n<!doctype html>\n<html>\n<head>\n  <title>Calculator</title>\n\
    \  <link rel=\"stylesheet\" type=\"text/css\" href=\"main.css\" />\n  <script\
    \ src=\"index.js\" defer></script>\n</head>\n<body>\n  <center>\n    <table>\n\
    \      <thead>\n        <tr>\n          <td colspan=\"3\"><div id=\"disp\"></div></td>\n\
    \        </tr>\n      </thead>\n      <tbody id=\"keypad\"></tbody>\n      <footer>\n\
    \        <tr>\n          <td colspan=\"2\"><button onclick=\"equal()\" id=\"eql\"\
    >=</button></td>\n          <td><button onclick=\"clr()\" id=\"clr\">Clr</button></td>\n\
    \        </tr>\n      </footer>\n    </table>\n  </center>\n</body>\n</html>\n\
    ```\n\n### main.css\n```css\nbutton, #disp {\n  font-size: 42px;\n  background-color:\
    \ #777;\n  color: white;\n  border: 1px solid #ffd;\n  width: 100%;\n}\n\n#disp\
    \ {\n  height: 42px;\n}\n\n#eql {\n  background-color: green;\n}\n\n#clr {\n \
    \ background-color: orange;\n}\n```\n\n### main.ts (Only use if using Typescript)\n\
    ```typescript\nimport { app , BrowserWindow } from \"electron\";\n\napp .on (\"\
    ready\", () => {\n  const mainWindow = new BrowserWindow ({ height : 380 , width\
    \ : 190 , resizable : false });\n  mainWindow . webContents . loadURL (`file://${\
    \ __dirname }/index.html`);\n});\n```\n\n### index.js (Only use if not using Typescript)\n\
    ```javascript\nvar d = document;\nvar display = d . getById ( \"disp\" );\nvar\
    \ keypad = d . getById ( \"keypad\" );\nvar keypadDigits = [[ 7 , 8 , 9 ], [ 4\
    \ , 5 , 6 ], [ 1 , 2 , 3 ], [ \"+\" , 0 , \"-\"]]];\nfor ( var i = 0 ; i < 4 ;\
    \ i++ ) {\n  makeRow ( i );\n}\n\nfunction makeRow ( x ){\n  var digitRow = keypadDigits[x];\n\
    \  var row = d . createElement ( \"TR\" );\n  for ( var j = 0 ; j < 3 ; j++ )\
    \ {\n    makeData ( row , digitRow[j]);\n  }\n  keypad . appendChild ( row );\n\
    }\n\nfunction makeData ( myRow , y ) {\n  var data = d . createElement ( \"TD\"\
    \ );\n  var button = d . createElement ( \"BUTTON\" );\n  var buttonContent =\
    \ d . createTextNode ( y );\n  button . appendChild ( buttonContent );\n  button\
    \ . onclick = function () { keypress ( y ) };\n  data . appendChild ( button );\n\
    \  myRow . appendChild ( data );\n}\n\nfunction keypress ( input ) {\n  if ( display\
    \ . innerHTML . length >= 5 ) { return ; }\n  var content = d . createTextNode\
    \ ( input );\n  display . appendChild ( content );\n}\n\nfunction clr () {\n \
    \ display . innerHTML = \"\";\n}\n\nfunction equal () {\n  // This is a basic\
    \ project no need to worry about eval() or sanitizing.\n  display . innerHTML\
    \ = eval( display . innerHTML );\n}\n```\n\n### main.js (Only use if not using\
    \ Typescript)\n```javascript\nvar electron = require(\"electron\");\nvar { app\
    \ , BrowserWindow } = electron;\n\napp .on (\"ready\", () => {\n  var mainWindow\
    \ = new BrowserWindow ({ height : 380 , width : 190 , resizable : false });\n\
    \  mainWindow . webContents . loadURL (\"file://\" + __dirname + \"/index.html\"\
    );\n});\n```\nElectron output: ![Image0035.jpg](Image0035.jpg)\n\nHere is our\
    \ rendition of a basic Calculator. Your turn!\n\n# Chapter 4 – Diving into ElectronJS\n\
    \nIf you already have experience with Javascript and NodeJs then ElectronJS should\
    \ be a walk in the park; ElectronJS makes sure that the difference between web\
    \ app development and desktop app development is reduced to the minimum. What\
    \ I like most about Electron is that it’s development process feels very similar\
    \ to the development process of older software for Unix-like operating systems,\
    \ which is very desirable since it ensures (in a way) that your software is good\
    \ quality!\n\nYou’ve already learned how to conjure up a desktop app window with\
    \ ElectronJS in the Express Approach #1 and #2 section; in this chapter we will\
    \ go over a few elementary procedures and narrative explanations for ElectronJS\
    \ code and features. Most of the stuff shown here will need some memorization\
    \ and practice, make sure you understand the procedures shown before moving on.\
    \ You already know JavaScript, learning ElectronJS is more about learning it’s\
    \ unique procedures and concepts like the difference between `IPC` (as a concept)\
    \ and Electron’s APIs! In fact the basics of ElectronJS are all about it’s APIs.\
    \ The procedures are shown with the help of Examples, so keep an eye out for boilerplate\
    \ code (code that is copy/pasted as is). During each section we’ll cover several\
    \ approaches to set up Electron App’s,\n\nProcedure for a basic Hello World program\n\
    \nSince the `hello world` program is the most basic thing we get to do in a conventional\
    \ programming class, let’s start there! Follow these instructions to write a basic\
    \ hello world program in ElectornJS.\n\n1. Create the following files and directories:-\
    \ Note: the directories follow the unix-like convention of naming, in windows\
    \ it’s different different, however the names will be same.\n- Our project’s main\
    \ directory `~/myApp/`.\n- A sub-directory `~/myApp/app/`.\n- A file in named\
    \ `myApp/app/main.js`.\n\n2. Inside `~/myApp/` use `npm init`, and use `app/main.js`\
    \ as entry point.\n\n3. Install the `Electron` package as a dev-dependency using\
    \ `npm i -D electron@latest `.\n\n4. Add the following script to `package.json`.\n\
    \n```json\n{\n  \"start\": \"electron .\"\n}\n```\n\n5. In `main.js` add the following\
    \ code:\n"
