- fmt: "\n```javascript\nconst { app } = require ( ‘electron’ );\napp . on ( ‘ready’\
    \ , () => {\n    console . log ( ‘hello world’ );\n});\n```\n\n- Run `npm start`\
    \ from a terminal placed in `~/myApp/`.\n- You should see `hello world ` printed\
    \ out in the terminal.\n\nHere on line #1 we’re importing some code from the ‘electron’\
    \ package and storing that code in an object named `app`. From line #3 to line\
    \ #5 we’re using the `on ` method from the `app ` object to “wait for the app\
    \ to be ready”, and once it is ready it’ll run the code on line #4. At this point\
    \ there isn’t much difference between a NodeJS app and an ElectronJS app at fact\
    \ value, however we are in fact using Electron JS.. If you add the following code\
    \ to `main.js` it will show you a head/window for your app as long you have an\
    \ `index.js` file accompanying your program:\n\n```javascript\nconst { app } =\
    \ require ( ‘electron’ );\nlet mainWindow = null ;\n\napp . on ( ‘ready’ , ()\
    \ => {\n    console . log ( ‘hello world’ );\n    mainWindow = new BrowserWindow\
    \ ();\n    mainWindow . webContents . loadURL ( `file://${__dirname}/index.html`\
    \ );\n});\n```\n\nHere on line #3 we have declared a variable which will later\
    \ hold our app’s main window object. On lines #5 to #9 we have our `app.on()`\
    \ function which will trigger when our app is ready. On line #7 we assign an `ElectronJS`\
    \ window object to our `mainWindow` variable. Notice here that ElectronJS is based\
    \ on Chromium, hence the window object has code adapted from the Chromium project.\
    \ On line #8 we tell our `mainWindow` window to load a file named `index.html`\
    \ which is stored in the root folder of our project, here the root is `~/myApp/app/`,\
    \ however `__dirname` is another way to refer to the current directory. Now you\
    \ may notice that we haven’t created an `index.html` file, you can create one\
    \ in `~/myApp/app/` and add the following code to it:\n\n```html\n<!DOCTYPE html><\
    \ html ><head >  < title >Page Title</ title ></head ><body >  < h1 >Hello Electron</\
    \ h1 ></body ></html >\n```\n\nNow running `npm start` will show the following\
    \ window:\n![](Image00036.jpg)\n\n## Approaching Advanced Code\n\nIn this section\
    \ we will show you some new (slightly advanced methods) and give narrative explanations\
    \ for each line as we go along. The purpose of this is to create a feeling of\
    \ familiarity between you and ElectronJS code. Even if you don’t understand this\
    \ source-code at this point just study it, in later sections we will go through\
    \ many different scenarios and examples, by this time you are done with this chapter\
    \ you will have a great understand of ElectronJS code. Observe the following ElectronJS\
    \ code, it’s color coded in a way which groups similar code together:\n\n```javascript\n\
    const { app , BrowserWindow } = require ( ‘electron’ );\nconst url = require (\
    \ “url” );\nconst url = require ( “path” );\n\nconst mainWindow = null ;\n\napp\
    \ . on ( ‘ready’ , () => {\n    console . log ( ‘hello world’ );\n    mainWindow\
    \ = new BrowserWindow ({ height : 800 , width : 600 });\n    const filePath =\
    \ url . format ({\n      pathname : path . join ( __dirname , “index.html” ),\n\
    \      protocol : “file:” ,\n      slashes : true ,\n    });\n    console . log\
    \ ( filePath );\n    mainWindow . webContents . openDevTools ();\n    mainWindow\
    \ . on ( ‘closed’ , ()=>{\n      mainWindow = null ;\n    });\n    mainWindow\
    \ . webContents . loadURL ();\n});\n```\n\nAlso, note the following color code\
    \ legend:\n\n1. Code from line #1 to #6 is usually the same for a lot of apps,\
    \ it is essential to our program.\n2. Code from line #18 to #20 is also copy/pasted\
    \ just like it was here, it’s essential for our program to close properly.\n3.\
    \ Code from line #11 to #15 may not be needed usually; we can write Path’s ourselves,\
    \ however this is the preferred method, especially for cross-platform software.\n\
    \nNow, on line #1 we are importing the objects named `app` and `BrowserWindow`\
    \ from the package named `electron`. On line #3 and #4 we have the `url` and `path`\
    \ objects imported. These object contain methods to work with URLs and File Paths!\
    \ Also, `path` and `url` are NodeJS native modules. On line #10 we have passed\
    \ `BrowserWindow()` an object as an argument, this objects has props called `height`\
    \ and `width`, it defines the starting height and width of your Application’s\
    \ window. On lines #11 to # 15 we have a URL generated by using a “url” object’s\
    \ method called `format`; we pass it another object as an argument, such object\
    \ will contain props like `pathname` (we use path to develop it here), `protocol`,\
    \ and `slashes`. On line#17 we open Developer tools for the rendered process aka\
    \ the web page visible; This is similar to Chromium Dev tools! You don’t need\
    \ to put this in commercially published programs. On lines #18 to #20 we have\
    \ the main window closed event. `MainWindow` is the main thread of your Process,\
    \ notice how the `closed` event in nested within the `ready` event. On line #21\
    \ we load a URL. The URL will be passed as an argument to it. For a cleaner version\
    \ for this code look at the following code:\n\n```javascript\nconst { app , BrowserWindow\
    \ } = require ( ‘electron’ );\nlet mainWindow = null ;\n\napp . on ( ‘ ready ’\
    \ , () => {\n    mainWindow = new BrowserWindow ({ height : 800 , width : 600\
    \ , backgroundColor :‘#000’, show : false });\n    mainWindow . once ( ‘ready-to-show’\
    \ , ()=> {\n        mainWindow . show ();\n    });\n    mainWindow . on ( ‘closed’\
    \ , ()=>{\n        mainWindow = null ;\n    });\n    mainWindow . webContents\
    \ . loadURL ( ‘https://www.google.com’ );\n});\n```\n\nOn line #6 we are using\
    \ the ‘ready-to-show’ event which triggers when the render process is complete\
    \ and the HTML page is fully ready to display; we use this here because without\
    \ this the app window may appear empty for a few moments before the page renders\
    \ fully. Here, `once` makes sure that the `ready-to-show` only triggers once.\
    \ On #7 we have the `mainWindow.show()` code that makes the Window visible. This\
    \ is why we have set the “show” property of our `BrowserWindow` to `false ` on\
    \ line #5. Ultimately, the window will be invisible until the program is ready\
    \ to display it properly, without delay.\n\n## Browser Window Properties\n\nThe\
    \ `BrowserWindow()` object can have a lot of props, for example:\n\n- `maxWidth`\n\
    - `minHeight`\n- `movable`\n- `resizeable`\n- `alwaysOnTop`\n- `frame`\n- `titleBarStyle`\n\
    - `show`\n- `transparent`\n- etc.\n\nYou can check the documentation of ElectronJS\
    \ (electronjs.org) to see a list of attributes and their default values, possible\
    \ values, etc. Some values like `maxHeight`, or `maxWidth` may be unlimited by\
    \ default, this needs to be fixed (no pun intended!); just set the values to `800`\
    \ and `1024` respectively. Most properties are either set to “Number” or “Boolean”\
    \ datatypes, for example:\n\n- `resizeable: true`\n- `frame: false` (hides the\
    \ Window title bar and frame)\n- etc.\n\n## Working with Window title bar\n\n\
    To modify a Window Title like we can take several approaches, following is a list:\n\
    \n- To set a Window Title, give a `title` property in the BrowserWindow object,\
    \ and give it a string value, for example:\n  ```javascript\n  new BrowserWindow({\
    \ height:800, width:600, title: ‘My Title’})\n  ```\n- Don’t add a `title` element\
    \ (<title></title>) in our HTML pages, this way the “Window-title” will be the\
    \ `name ` property from our app’s `package.json ` file.\n- Add a `title` element\
    \ in our HTML pages, and the text inside that element will become our Window-title.\n\
    - If both a `title` element and a `name` property are missing, then the default\
    \ Window-title will be `Electron`.\n- To hide the Window-title-bar, give a `frame`\
    \ property in the BrowserWindow object, and set it to `false `, for example:\n\
    \  ```javascript\n  new BrowserWindow({ height:800, width:600, frame: false})\n\
    \  ```\n- Use the following code to do something similar; you can set `titleBarStyle`\
    \ to `hidden`, `hiddenInset`, etc. and experiment!\n  ```javascript\n  new BrowserWindow({\
    \ height:800, width:600, titleBarStyle: ‘hiddenInset’ })\n  ```\n\nTo make frameless\
    \ windows drag-able without the title-bar use:\n"
