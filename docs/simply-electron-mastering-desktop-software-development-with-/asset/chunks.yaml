- fmt: "\n| Symbol | Function | Example | Result |\n| :--- | :--- | :--- | :--- |\n\
    | + | Add two numbers, or join two strings. Can also join a string with a number.\
    \ | `1+2` | 3 |\n| - | Subtract two numbers. | `1-2` | -1 |\n| * | Multiply two\
    \ numbers. | `1*2` | 2 |\n| / | Divide two numbers. | `1/2` | 0.5 |\n| % | Gives\
    \ the reminder of a division. | `1%2` | 1 / *since 1 apple can’t be divided among\
    \ 2 people without breaking it into fractions*/ |\n\n## Conditionals\n\nIn JavaScript\
    \ conditionals are very simple, all we have to do is write a `if/else` statement.\
    \ Look at the following example:\n\n```javascript\nlet x = 1;\nIf (x > 0) {  //\
    \ do something\n} else {\n  // do something else\n}\n```\n\nWe can also use single-lined\
    \ conditionals like the following:\n\n```javascript\nlet x = 1;\nlet y = (x >\
    \ 0? true:false); // y becomes true since 1 is greater than 0\n```\n\nThe comparison\
    \ can be done with the following 5 basic operators:\n\n| Operator | Name | Function\
    \ | Example: |\n| :--- | :--- | :--- | :--- |\n| `==` | Equal to | Checks if the\
    \ value on the left is equal to the value on the right. If true returns true.\
    \ | `1 == 1 //true 1 == 2 //false` |\n| `===` | Strictly equal to | Checks if\
    \ the value on the left is equal to the value on the right, and if they both has\
    \ the same data-type. If both are true returns true. | `1 === 1 //true 1 === “1”\
    \ //false` |\n| `!=` | Not equal to | Checks if the value on the left is not equal\
    \ to the value on the right. If true returns false. | `1 != 1 //false 1 != 2 //\
    \ true` |\n| `>` | Greater than | Checks if the value on the left is greater than\
    \ the value on the right. If true returns true. | `1 > 2 //false 2 > 1 // true`\
    \ |\n| `<` | Less than | Checks if the value on the left is lesser than the value\
    \ on the right. If true returns true. | `1 < 2 //true 2 < 1 //false` |\n\n## Functions\n\
    \nFunctions are used to isolate a piece of code and use it in multiple places\
    \ by reference. Look at the following example:\n\n```javascript\nfunction myFunk(x)\
    \ {\n  alert(x);\n}\nmyFunk(“Hello World”);\n```\n\nIn the code provided above\
    \ `myFunk` is the name of the function (same naming scheme is used as variables).\
    \ The `x` is a parameter used by this function, its sort of a variable built into\
    \ the function, and `Hello World` is the value of that parameter only when it’s\
    \ called on the last line.\n\nThe following output is given by this code: \n![](Image00025.jpg)\n\
    \n## Objects\n\nJavaScript Objects are a great data management tool. They are\
    \ basically a collection of data that can easily be converted to different data\
    \ structures. The following approach is used to create a JavaScript Object, compare\
    \ both approaches:\n\n### Without objects:\n```javascript\nvar player1 = “Human”;\n\
    var health1 = 100;\nvar power1 = 50;\nvar weapon1 = “Hands”;\n```\n\n### With\
    \ Objects:\n```javascript\nvar player_1 = {\n  name: “Human”,\n  health: 100,\n\
    \  power: 50,\n  weapon: ”hands”\n}\n```\n\nThe approach with Objects provides\
    \ much better integration and coordination among related variables. Let’s look\
    \ at a few ways to call the values within objects:\n\nJavaScript code:\n```javascript\n\
    var myObj = {\n  firstName: \"Anna\",\n  lastName: \"Voice\"\n}\nconsole.log(myObj.firstName\
    \ );\nconsole.log(myObj.lastName );\nconsole.log(myObj[\"firstName\"] );\nconsole.log(myObj[\"\
    lastName\"] );\n```\n\nOutput:\n![](Image00026.jpg)\n\nHere we have called the\
    \ `firstName` and the `lastName` members from `myObj` using two methods. The first\
    \ one was using `myObj.firstName` and `myObj.lastName` approach; this approach\
    \ is called the `dot-notation`.\n\nThere is another way to call these object,\
    \ we can use `myObj[\"firstName\"]` and `myObj[\"lastName\"]`. This way is helpful,\
    \ since we are dynamically passing key names to an object. Think of it as the\
    \ `dynamic-notation`.\n\n## Array\n\nArrays are a data-type in JavaScript that\
    \ allows you to store an ordered collection of data in a variable, like a list!\
    \ Each element in the array can be identified by an index number starting from\
    \ 0 (this is called zero-indexed counting). The first element in an array has\
    \ index 0, second element index 1, the third one has index 2, and so on. Simply\
    \ speaking an `Array` is a list, and array indexes are item numbers on our list:\n\
    \nHere is how to write an array:\n![](Image00027.jpg)\n\nTo make an array we just\
    \ need to enclose a list of data/elements inside a pair of square brackets; also\
    \ the data needs to be separated by a comma character `“`. That’s all it takes\
    \ to make an array!\n\nTo call these elements we can just call the variable, and\
    \ pass it an index number. For example:\n\n```javascript\nvar myList = [\"Jam\"\
    , \"Butter\", \"Bread\"];\nconsole.log( myList[0]); //logs: Jam\nconsole.log(\
    \ myList[1]); //logs: Butter\nconsole.log( myList[2]); //logs: Bread\n```\n\n\
    ## For Loops\n\nWriting the same code multiple times is mad! Instead we can use\
    \ a thing called loops if we want a piece of code to run a specific amount of\
    \ times. Let’s look at the following example:\n![](Image00028.jpg)\n\nConsole\
    \ output:\n![](Image00029.jpg)\n\nInstead of doing this we can just use loops,\
    \ just look at the following example:\n\n```javascript\nfor (var i = 0; i <= 10;\
    \ i++) {\n  console.log(i);\n}\n```\n\nWe can use this code and the output will\
    \ remain the same. This is a `for` loop, there are other types of loops but they\
    \ all essentially do the same work. The `for` loop is the loop you will use 80%\
    \ of the times, so learn it best!\n\nThe `for` loop is made up of three parts,\
    \ here is how the syntax/grammar of For loops looks like:\n![](Image00030.jpg)\n\
    \n- The `Initialization` part declares a variable and gives it a value, the value\
    \ is usually a starting point for the loop; since in the last example we wanted\
    \ to print numbers from 1 to 10 we gave our variable an initial value of `1`.\n\
    - The `Condition` parts demands a comparative operator to check each time a loop\
    \ begins to run, the loop only runs as long as the condition is `true`. In the\
    \ last example we wanted the loop to stop running once it runs 10 times, since\
    \ the distance from 1 to 10 is exactly 10 paces (counting the standing pace) we\
    \ chose the condition `i<=10`, this way the first 9 times the loop runs the value\
    \ of `i` is less than 10 so the loop runs fine, the 10th time the value is exactly\
    \ 10 so the loop runs fine, the 11th time the loop checks the condition the value\
    \ of `i` is `11` which is no less than or equal to 10, this way the condition\
    \ returns false and the loop comes to an end.\n- The `Iteration` part must be\
    \ a JavaScript expression that either increments, or decrements the initial value\
    \ from our `i` variable.\n\nSimply speaking `Initialization` gives a count, `Condition`\
    \ counts the count, and `Iteration` progresses the count. Combined these three\
    \ parts give us a way to make sure our loops come to an end! Because if our loops\
    \ go round and round forever they will crash our web browser. We have infinite\
    \ loops, and do anything we can to avoid them.\n\n## Document Object Model\n\n\
    When creating an interactive website with HTML, CSS, and JavaScript we would want\
    \ to grab HTML elements to alter their look, or to get some data from them; to\
    \ do that we need to know the following method of the built-in `DOM` object of\
    \ JavaScript:\n\n- Find HTML elements by id.\n- Find HTML elements by class.\n\
    - Find HTML elements by tag name.\n- Find HTML elements by query selectors.\n\n\
    Let’s get a good introduction of them:\n\n| Method | Description |\n| :--- | :---\
    \ |\n| `document.getElementById(‘Id name’);` | Grabs the element with the given\
    \ id name. |\n| `document.getElementsByClassName(‘Class name’);` | Grabs all elements\
    \ with the given class name. |\n| `document.getElementsByTagName(‘Tag name’);`\
    \ | Grabs all elements with the given tag name. |\n| `document.querySelectorAll(‘query’`\
    \ | Grabs all elements matching the query |\n"
