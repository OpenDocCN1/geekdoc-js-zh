    level, single-threaded programming language. It works on the front-end inside
    a web browser, and on the back-end via NodeJS. Historically JavaScript is mostly
    used to build websites, however lately due to the “JavaScript Everywhere” movement
    JavaScript is being used in areas like Mobile App development, Server side services,
    Desktop App development, etc.​ To attach JavaScript  files to our HTML we use
    the following tags:< script src = ”index.js” ></ script >​ Then we place an `index.js`
    file in the same directory as our HTML file, and we are good to go!Variables​
    In JavaScript comments are started via the /* characters, and ended with the */
    characters. Look at the following example:/* My comment goes here */​ JavaScript
    is a dynamically typed language, so we don’t have to declare variables coordinated
    with their data types. To declare a JavaScript/ES6 variable we just use the “var”,
    “Let”, or “Const” keyword; we suggest use the “let” keyword instead of the regular
    “var” since that is the ES6 way. Look at the example:-let x = 0;let y = 121;let
    z = “Hello World”;​ When naming variables in JavaScript make sure you follow the
    following rules:1\. The name must not have spaces.2\. The first character must
    be an alphabet, or underscore.3\. Always use meaningful names so you can later
    verify which variable does what.4\. Use camelCasing where the fist character must
    be a small alphabet, and if the variable named is comprised of multiple words
