  trans: "\n\n<body style=”-webkit-app-region: drag” > 这允许你通过按住窗口内容并拖动来移动窗口。\n\n菜单\n\
    \n一旦你为程序创建了窗口（Window），现在就可以添加菜单了（放置文件、编辑、视图、工具、帮助等选项的顶部栏）。使用以下步骤来添加菜单栏和菜单项。\n\n\
    1. 遵循 Electron-quick-start 的方法为你的项目获取一个脚架（用于构建的基础项目！）！它初始看起来如下所示。\n\n![](img/Image00037.jpg)\n\
    \n2. 注意看这里有一个 `default`（默认）菜单，其中包含文件、编辑、视图等选项。\n\n3. 使用以下步骤生成基础菜单，所有这些步骤的代码都将在下方提供，并用于\
    \ `main.js` 文件。\n\n    - 从 electron 导入 `Menu` 类：`const { app , BrowserWindow ,\
    \ Menu } = require ( 'electron' )`\n    - 在此文件的末尾，创建一个名为 `template ` 的数组，它的结构将在稍后讨论。\n\
    ```javascript\nconst template = [\n  {\n    label : 'Menu 1' ,\n    submenu :\
    \ [\n      {\n        label : 'menu item 1'\n      }\n    ]\n  },\n  {\n    label\
    \ : 'Menu 2' ,\n    submenu : [\n      {\n        label : 'menu item 1'\n    \
    \  }\n    ]\n  }]\n```\n    - 当 App 准备就绪设置设置：`.app .whenReady (). then (() =>\
    \ {\n  const menu = Menu . buildFromTemplate ( template );\n  Menu . setApplicationMenu\
    \ ( menu );\n  createWindow ()\n})`\n\n4. 完成所有操作后，使用 `npm start` 测试我们的应用。\n\n\
    \   它看起来应该是这样的：\n\n![](img/Image00038.jpg)\n\n5. 在这里，每个菜单都可以包含项目和子菜单，取决于 `template`\
    \ 数组的结构。还要注意 `label` 属性如何决定项的名称（例如“menu 1”、“menu 2”等）。\n\n6. 我们的 `main.js` 文件在结束时看起来像这样：\n\
    \n注意：修改的内容已**加粗**，其行号用星号* 标记，并省略了不需要的代码（但仍存在于 `main.js` 文件中），请留意行号（用它们引导你）。\n\n\
    ```javascript\n1*2   const { app , BrowserWindow , Menu } = require ( 'electron'\
    \ )\n3  const path = require ( 'path' )\n4\n5  function createWindow () {...}\n\
    1425 app . whenReady (). then (() => {*26     const menu = Menu . buildFromTemplate\
    \ ( template );*27     Menu . setApplicationMenu ( menu );28     createWindow\
    \ ()35 })36*47 const template = [.../*参见之前的步骤*/...]\n​\n```\n\n在提供的代码中，我们完成了以下操作：\n\
    \n1. 在 #2 行导入了 `Menu` 类。\n2. 在 #47 行是菜单对象的模板（这就是为什么我们将其命名为“template”）。\n3. 在 #26\
    \ 行，我们使用 `Menu.buildFromTemplate(template)` 使用模板构建菜单，并将其赋值给名为“menu”的变量。\n4. 在\
    \ #27 行，我们将该“menu” 设置为我们的菜单，在这里我们使用了 `Menu` 类的 `setApplicationMenu`。\n\n为了更好地理解这一点，我们需要理解我们正在调用的几个不同被称为“菜单”的东西：\n\
    \n- 我们有一个 `Menu` 类，这是用于处理 Electron 菜单的 Electron 方法集合。它通过大字母“M”来区分。它在 #2 行被导入，然后在\
    \ #26 行使用了它的 `buildFromTemplate()` 方法，最后在 #27 行使用了它的 `setApplicationMenu()` 方法。\n\
    - 我们有一个名为“menu”的变量，我们在 #26 行声明，并为其赋值了我们构建的菜单。\n- 然后是在 #47 行声明的 `template` 变量，它保存我们实际菜单的结构。这是我们工作的地方。\n\
    \n### 菜单结构\n\n现在让我们谈谈菜单的结构。观察我们模板的以下结构：\n\n```javascript\nconst template = [\n\
    \  {\n    label : 'Menu 1' ,\n    submenu : [\n      {\n        label : 'menu\
    \ item 1'\n      }\n    ]\n  },\n  {\n    label : 'Menu 2' ,\n    submenu : [\n\
    \      {\n        label : 'menu item 1'\n      }\n    ]\n  }]\n```\n\n如果你仔细观察括号的开启和关闭以及括号的类型，你会发现模板对象的结构是有意义的。每个菜单模板必须是一个\
    \ JavaScript 数组，它的每个成员项都是我们主要的“菜单”；这些是我们在顶部栏上看到的菜单，带有文件、编辑、视图、插入等项目项。我们可以这样结构化它：\n\
    \n```javascript\nconst template = [\n  {/*File*/},\n  {/*File*/},\n  {/*Edit*/}]\n\
    ```\n\n每个项（Item）必须是一个 JavaScript 对象，并带有如 `label` 等必要的属性。\n\n我们有一个名为 `submenu`\
    \ 的属性，可以用于构建菜单中的菜单，所有菜单都遵循 template 遵循的相同结构规则。例如：\n\n```javascript\n1  const template\
    \ = [\n2      {\n3         label : 'Menu 1' ,\n4         submenu : [\n5      \
    \      {\n6               label : 'menu item 1'\n7            }\n8         ]\n\
    9      }\n10 ]\n11\n12 if ( process .platform === 'darwin' ){\n13     const name\
    \ = app . getName ();\n14      template . unshift ({\n15         name : name ,\n\
    16         submenu : [{\n18  label : 'Quit' ,\n19             click : function\
    \ () { app . quit () }\n22 }]\n24     });\n25 }\n```\n\n在这里，菜单本身从 #1 行开始，到 #10\
    \ 行结束，并用方括号初始化。第一个菜单项从 #2 行开始到 #9 行结束，由于它是一个菜单项（不是菜单，而是一个项），所以它用大括号初始化。事实上，这是一个经验法则！如果用大括号初始化，它就是一个菜单项；如果用方括号初始化，它就是一个菜单或子菜单或子子菜单，以此类推。这里需要注意的另外一点是从\
    \ #12 行到 #25 行的代码，这段代码用于在我们在使用 Mac OS 时为我们的软件添加额外的应用程序菜单。只有在你开发 Mac OS 时才需要担心这段代码（但那将是你为此面临的最的最少头疼的问题了！）。注意我们如何使用\
    \ `click` 属性为项分配函数。\n\n### 菜单项和属性\n\n菜单项可以是任何内容，如“剪切”、“复制”、“粘贴”、“保存文件”等。菜单项有许多属性，如\
    \ label, role, click, type, checked, accelerator, sublabel, icon, visible, id\
    \ 等。完整列表可以在此处查看：[`www.electronjs.org/docs/api/menu-item`](https://www.electronjs.org/docs/api/menu-item)\
    \ 让我们来看看其中几个：\n\n- `label` (string) : 此属性定义了我们菜单项（或子菜单）的名称。菜单名称可以是文件、编辑、视图等。\n\
    - `sublabel` (String) : 此属性伴随我们菜单项的 label。\n- `submenu` (menu array) : 此属性可用于在菜单项上附加一个拉出式子菜单。\n\
    - `click` (function) : 此属性定义了当有人点击菜单项时触发的函数。\n- `role` (string – keyword) : 此属性可以设置为预定义的代理，如“剪切”、“复制”、“粘贴”、“退出”、“关于”等。如果使用了此属性，则\
    \ Label 和 Click 是可选的。\n- `type` (string - keyword) : 此属性可用于生成不同类型的项，如‘单选按钮’‘复选框’‘分隔符’等。\n\
    - `checked` (Boolean) : 此值可以是 true 或 false，并且只能在 type 为 checkbox 或 radio 时才有意义。\n\
    - `accelerator` (String – ShortcutFormat) : 此属性可用于为我们的菜单项设置快捷键，如 `CommandOrControl+Shift+P`。\n\
    \n"
- fmt: "\nLet’s go over examples for these one by one. We’ve already seen examples\
    \ for `label`, `submenu`, and `onclick`, and don’t worry, we’ll go over them again\
    \ later, but lets do examples for the rest. Check out the following menu:\n\n\
    ```javascript\nconst template = [{\n    label : 'MyMenu' ,\n    submenu : [\n\
    \      {\n        type : 'radio' ,\n        label : 'male'\n      },\n      {\n\
    \        type : 'radio' ,\n        label : 'female'\n      },\n      { type :\
    \ 'separator' },\n      { role : 'quit' },\n    ]\n  }]\n```\n\nNotice how the\
    \ radio buttons are separated from the rest of the menu using a `separator` menu-item,\
    \ this is required so we can differentiate between the radio items and other menu-items.\
    \ Always put a separator between radio buttons referring to the same category\
    \ and other menu-items, including radio buttons referring to a different category.\n\
    \nNow, let’s do something worthwhile, using what we’ve learned up to this point\
    \ let’s make a couple of new menu options. Use the following code for the menu\
    \ inside `main.js` :\n\n```javascript\nconst template = [{\n    label : 'MyMenu'\
    \ ,\n    submenu : [\n      {\n        label : 'reload' ,\n        accelerator\
    \ : 'CmdOrCtrl+R' ,\n        click : ( menuItem , focusedWindow ) => {\n     \
    \     if ( focusedWindow ) focusedWindow . reload ();\n        }\n      },\n \
    \     {\n        label : 'fullscreen' ,\n        accelerator : 'CmdOrCtrl+F' ,\n\
    \        click : ( item , focusedWindow ) => {\n          focusedWindow . setFullScreen(!\
    \ focusedWindow . isFullScreen ());\n        }\n      },\n      { type : 'separator'\
    \ },\n      { role : 'quit' }\n    ]\n  }]\n```\n\nHere we’ve made a reload button\
    \ for our menu with a Ctrl+R (or CMD) keyboard shortcut, we’ve also made a Fullscreen\
    \ button for our menu with a Ctrl+F shortcut, and after a separator item we finally\
    \ have our quit button. Note: Buttons like `fullscreen` can also be made with\
    \ the `togglefullscreen` role.\n\nNow, if you take note of the `click` prop, you\
    \ can see that it takes arguments in a certain order, that is a `Menu-Item`, Browser\
    \ Window object, and Event object. You can log them all to a console to check\
    \ them out.\n\n### Right-click menu\n\nHave you noticed how we don’t have a right-click\
    \ menu aka “Context Menu” inside an Electron app’s windows by default? To create\
    \ a Context menu we need to complete the following steps:\n\n*   Create an electron\
    \ menu, similar to `template`. In the following code it’s done from line #6 to\
    \ #10, and named `contextMenu` instead of `template`.\n*   Set up a function to\
    \ be triggered by the `context-menu` event, which is like a “right-click” event\
    \ in Electron. Here it’s done on line #12 to #15.\n\nReplace your app’s (electron-quick-start)\
    \ `createWindow` function with the following:\n\n```javascript\nfunction createWindow\
    \ () {\n  const mainWin = new BrowserWindow ({})\n  mainWin . loadFile ( 'index.html'\
    \ )\n\n  const contextMenu = Menu . buildFromTemplate ([\n    { role : \"cut\"\
    \ },\n    { role : \"copy\" },\n    { role : \"paste\" },\n  ]);\n\n  mainWin\
    \ . webContents . on ( 'context-menu' , ( event , params )=>{\n    console . log\
    \ ( `right click at ( ${ params . x } , ${ params . y } )` );\n    contextMenu\
    \ . popup ( mainWin , params . x , params . y );\n  });\n}\n```\n\nHere from line\
    \ #6 to #10 we have built a menu from the provided array, and assigned it to the\
    \ variable `contextMenu`. Then on line #12 we have used our window’s `webContents`\
    \ method to access the window’s contents, and then used it’s `on` method to check\
    \ for an event.\n\nThe event we’ve checked for is the `context-menu` event, which\
    \ triggers when we right-click on window’s contents. This event is passed to `on`\
    \ as it’s first argument. The second argument passed to `on` is a function which\
    \ is supposed to trigger when the event passed as the first argument (`context-menu’\
    \ in this case) is triggered.\n\nOn line #13 we are basically logging the location\
    \ of our right click with respect to x-axis and y-axis, like on a Cartesian plane\
    \ which you may remember from Math class. On line #14 we have given a location\
    \ where our Context-menu will appear. `contextMenu.popup()` method takes the following\
    \ arguments, in the following order:\n\n1.  The variable which holds the window\
    \ in which the context-menu is supposed to appear.\n2.  The x-coordinate of the\
    \ context menu’s location.\n3.  The y-coordinate of the context menu’s location.\n\
    \nUsing this, we can create a pop-up menu of our liking.\n\n### The Shell API\n\
    \nThere is a Shell package we can use to do remarkable things with Electron software\
    \ like Managing URL’s using their default apps. It is used to further integrate\
    \ the Electron App with the user’s operating system. The Shell API is best learned\
    \ from it’s docs at [https://www.electronjs.org/docs/api/shell](https://www.electronjs.org/docs/api/shell)\
    \ , however a demonstration in given below:\n\n```javascript\nconst { app , BrowserWindow\
    \ , Menu , shell } = require ( 'electron' )\nfunction createWindow () {\n  const\
    \ mainWin = new BrowserWindow ({})\n  mainWin . loadFile ( 'index.html' )\n\n\
    \  const contextMenu = Menu . buildFromTemplate ([\n    { role : \"cut\" },\n\
    \    { role : \"copy\" },\n    { role : \"paste\" },\n    {\n      label : 'reload'\
    \ ,\n      accelerator : 'CmdOrCtrl+R' ,\n      click : ( menuItem , focusedWindow\
    \ ) => {\n        if ( focusedWindow ) focusedWindow . reload ();\n        }\n\
    \      },\n      {\n        label : 'fullscreen' ,\n        accelerator : 'CmdOrCtrl+F'\
    \ ,\n        click : ( item , focusedWindow ) => {\n          focusedWindow .\
    \ setFullScreen(! focusedWindow . isFullScreen ());\n        }\n      },\n   \
    \   { type : 'separator' },\n      { role : 'quit' }\n  ]);\n\n  mainWin . webContents\
    \ . on ( 'context-menu' , ( event , params )=>{\n    console . log ( `right click\
    \ at ( ${ params . x } , ${ params . y } )` );\n    contextMenu . popup ( mainWin\
    \ , params . x , params . y );\n  });\n}\n```\n\nHere from line #6 to #10 we have\
    \ built a menu from the provided array, and assigned it to the variable `contextMenu`.\
    \ Then on line #12 we have used our window’s `webContents` method to access the\
    \ window’s contents, and then used it’s `on` method to check for an event. The\
    \ event we’ve checked for is the `context-menu` event, which triggers when we\
    \ right-click on window’s contents. This event is passed to `on` as it’s first\
    \ argument. The second argument passed to `on` is a function which is supposed\
    \ to trigger when the event passed as the first argument (`context-menu’ in this\
    \ case) is triggered. On line #13 we are basically logging the location of our\
    \ right click with respect to x-axis and y-axis, like on a Cartesian plane which\
    \ you may remember from Math class. On line #14 we have given a location where\
    \ our Context-menu will appear. The `contextMenu.popup()` method takes the following\
    \ arguments, in the following order:\n\n1.  The variable which holds the window\
    \ in which the context-menu is supposed to appear.\n2.  The x-coordinate of the\
    \ context menu’s location.\n3.  The y-coordinate of the context menu’s location.\n\
    \nThis code is similar to the code provided (in the context-menu), here we have\
    \ made the following changes:\n\n*   We’ve imported the `shell` module from ‘electron’\
    \ package.\n*   We’ve created a new context-menu item labeled “Electron”, and\
    \ given it a function that uses the shell module to open the provided URL with\
    \ an external application like Chrome or Firefox.\n\nFor more on shell see electron\
    \ docs at: `https://www.electronjs.org/docs/api/shell`\n\n### Live reloads\n\n\
    We can use Electron to build a live reload mechanism in our apps using the following\
    \ code:\n\n```javascript\nconst path = require ( 'path' )\nrequire ( 'electron-reload'\
    \ )( __dirname , {\n  electron : path . join ( __dirname , 'node_modules' , '.bin'\
    \ , 'electron' )\n});\n```\n\nTo get this code to work, you need to install the\
    \ `electron-reload` module as a development dependency, use the command: `npm\
    \ i -D electron-reload`. Note: `-D` is short of `--save-dev`.\n\nNow we can work\
    \ on our `index.html` or other HTML files with live reloading built-in to our\
    \ apps, however be sure to remove this code before bundling your app.\n\n### IPC\n\
    \nInter-process Communication AKA IPC is an Eventmitter module that allows the\
    \ main and renderer processes of your software to send/receive messages. This\
    \ communication can happen both synchronously and asynchronously. The module has\
    \ two parts, one for the main process called `ipcMain`, and one for the renderer\
    \ process called `ipcRenderer`.\n\nFor the sake of simplicity, let’s assume the\
    \ following basic definitions:\n\n*   **Process**: A Process is a Javascript file\
    \ in execution. For example `main.js`, `index.js`, etc. The difference between\
    \ a file and a process is that a file also becomes a process when it’s code is\
    \ being executed/ran.\n*   **Main Process**: It’s usually referring to the `main.js`\
    \ file, or whatever file we are using as an entry point in our `package.json`.\n\
    *   **Renderer Process**: It’s usually referring to files that are attached to\
    \ our HTML files, like `renderer.js` in the electron-quick-start approach.\n*\
    \   **Preload File**: This is a Javascript file that is always loaded with every\
    \ web-page by default, without mentioning it in their HTML file. Since we’re keeping\
    \ `nodeIntegration` false in our apps, our HTML files won’t have NodeJS and Electron’s\
    \ features, to overcome this in a safe way, we will use a `preload.js` file to\
    \ expose only certain features of NodeJS and Electron to our HTML and other front-end\
    \ files.\n"
