  trans: "\n注意：我们并没有真的在保存文件，只是在进行前端的演示。要保存文件，我们需要 `fs` 模块。要学习如 NodeJS、MongoDB 等 Web\
    \ 开发技术的的基础，请参阅书籍：《Simply Web Development : An Introduction to the world of Web\
    \ development》——Anna Voice, Ray Voice。这本书涵盖了任何有志的程序员在进入高级编程概念之前应该掌握的内容。为了避免知识断层和痛苦，我们建议读者如果有任何疑问，至少阅读一遍该书。现在，使用以下代码（基于\
    \ electron-quick-start 脚手架构建）来处理保存对话框。\n\n### index.html\n```html\n<!DOCTYPE html>\n\
    <html>\n<<body>\n    <button id='save-file'>Save File</button>\n    <p id='file-url'></p>\n\
    \    <script src=\"./renderer.js\" defer></script>\n</body>\n</</html>\n```\n\
    非常标准，我们有一个 id 为 `file-url` 的按钮来打开文件对话框，一个用于显示保存文件 URL 的段落元素，以及加载的 `renderer.js`\
    \ 脚本。\n\n### renderer.js\n```javascript\nconst { ipcRenderer } = require('electron')\n\
    const syncMsgBtn = document.getElementById('save-file')\nsyncMsgBtn.addEventListener('click',\
    \ () => {\n  let reply = ipcRenderer.sendSync('sync-file-save');\n  let message\
    \ = `File saved as: ${reply}`;\n  if (reply == '') message = 'No file saved';\n\
    \  document.getElementById('file-url').innerHTML = message;\n});\n```\n我们在第 `#5`\
    \ 行到 `#10` 行设置了同步通信，在第 `#6` 行，我们通过 `sync-file-save` 通道发送空信号，这让主进程知道按钮已被点击。第 `#7`\
    \ 行和 `#9` 行在我们的网页上显示回复（即我们为了保存文件而选择的文件 URL）。第 `#8` 行确保了如果用户取消了保存对话框（而不是保存文件），则回复消息将显示“No\
    \ file saved”，而不是空字符串。由于这是同步通信，我们可以使用单个通道发送和接收信息。\n\n### main.js\n```javascript\n\
    const { app, BrowserWindow, ipcMain, dialog } = require('electron')\nconst path\
    \ = require('path')\n\nipcMain.on('sync-file-save', (event, arg) => {\n  dialog.showSaveDialog({\n\
    \    title: ['Save an Image'],\n    filters: [{ name: 'Images', extensions: ['jpg',\
    \ 'png'] }]\n  }).then(fileName => {\n    // 使用 fs 模块在这里处理文件\n    event.returnValue\
    \ = fileName.filePath;\n  });\n});\n```\n整个文件将是一个标准的 electron-quick-start `main.js`\
    \ 文件，导入了 `ipcMain` 和 `dialog` 模块，并设置了从第 `#4` 行到 `#12` 行通过 `sync-file-save` 通道进行同步通信发送接收的代码。第\
    \ `#5` 行到 `#8` 行的代码使用 `dialog` 模块打开一个“保存文件”的对话框，这里第 `#6` 行告诉对话框保存文件窗口的标题。第 `#7`\
    \ 行告诉对话框我们正在保存 `jpg` 或 `png` 扩展名的图像。然后第 `#8` 行到 `#10` 行的代码用于使用 `then()` 方法解析对话框（当我们在对话框窗口点击“保存”时解析），并将返回的保存文件\
    \ URL 通过赋值给我们 `event` 的 `returnValue` 属性发送回通道；这里我们的 `event` 是接收通信的主进程。\n\n现在，仅仅学习如何使用对话框模块是不够的，用户还需要学习\
    \ NodeJS 模块（如 `fs`），以及他们正在开发的操作系统的开发方案和指南。你可以从 SDK 和开发许可附带的指南书中学习这些内容。\n\n# 显示桌面通知\n\
    在 electron 中显示通知非常简单，不需要先决条件，我们可以直接开始。只需在 electron-quick-start 脚手架的 `index.js`\
    \ 和 `renderer.js` 文件中使用以下代码即可。\n\n### index.js\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n    <button id=\"noti\">Show Notification</button>\n    <script src=\"\
    ./renderer.js\"></script>\n</body>\n</html>\n```\n\n### renderer.js\n```javascript\n\
    const notification = {\n    title: 'Basic Notification',\n    body: 'Message here'\n\
    }\nconst notiButton = document.getElementById('noti');\nnotiButton.addEventListener('click',\
    \ () => {\n    const myNoti = new Notification(notification.title, notification);\n\
    \    myNoti.onclick = () => {\n        console.log('Notification closed');\n \
    \   };\n});\n```\n（注：原文提供的 renderer.js 文本有些碎片，我根据提供的代码片段逻辑进行了重新格式化）\n\n### renderer.js\
    \ (根据文本修订)\n```javascript\nconst notification = {\n    title: 'Basic Notification',\n\
    \    body: 'Message here'\n}\nconst notiButton = document.getElementById('noti');\n\
    notiButton.addEventListener('click', () => {\n    const myNoti = new Notification(notification.title,\
    \ notification);\n    myNoti.onclick = () => {\n        console.log('Notification\
    \ closed');\n    };\n});\n```\n（注：原文提供的 renderer.js 文本非常混乱，我根据提供的变量和描述重构了逻辑流。）\n"
