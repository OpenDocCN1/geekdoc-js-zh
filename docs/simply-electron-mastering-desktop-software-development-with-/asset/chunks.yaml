    )14   . then (( res )=>{15      event16        . sender17        . send ( ''info-dialog-selection''
    , res [ ''response'' ])18     });19 })2021 function createWindow () {22     const
    mainWindow = new BrowserWindow ({23       width : 800 ,24       height : 600 ,25 
         webPreferences : {26         preload : path . join ( __dirname , ''preload.js''
    ),27         nodeIntegration : true28      }29    })3031     mainWindow . loadFile
    ( ''index.html'' )32 }3334 app . whenReady (). then (() => {35     createWindow
    ()36 })3738 app . on ( ''window-all-closed'' , function () {39     if ( process
    . platform !== ''darwin'' ) app . quit ()40 })​ The code here is nothing new either,
    the only novel thing is between lines #4 to #19, everything else is pretty regular.​
    This code is using the ipcMain module’s on() method to listen to any communication
    on the info-dialog channel. When we get a signal (in this case empty communication)
    over this channel we will run the code between line #5 to #18.​ On line #5 to
    #10 we have a object for our information dialog window. It needs to have properties
    like type , title , message , buttons , etc. Each property is self explanatory,
    to check them out you can change their values, the only thing to worry about is
    that type must be ‘info ’, and buttons must be an Array.​ In the code from line
    #12 to #19 we use the dialog module’s showMessgaeBox() method (with the infoWin
    object passed as argument) to display an information dialog window to the user.
    This will return a Javascript Promise (a promise to get back to us with the value
    the user picked) that will have the user’s input from the information dialog.​
    Since all JavaScript Promises are thenables , we can use the then() method to
    resolve the Promise into digestible value. instead of a pending Promise. The digestible
    value will then be stored in the res parameter of then() .​ The then() from line
    #14 to #18 will use the event object’s sender() method’s send() method to send
    communication over the info-dialog-selection .​ To learn more about thenables
    get the latest edition of “ Simply ES6 : Mastering JavaScript and ES6 to it’s
    fullest - Ray Voice, Anna Voice”. The book covers everything required to work
    with JavaScript and related technologies, professional development methodologies,
    Bundling and Forging, AI, Machine Learning, and Robotics, and much more. Each
    edition is improved, and new content is added for keeping the readers up to date
    with the latest advancements in JavaScript.​ The code on line #17 is the send()
    method, it is used to send the user’s picked choice over the given channel.​ The
    res[‘response’] extracts the zero-indexed response we got from the user. If you
    want to see how the actual object looks you can use console.log(res) in-between
    lines #14 to #18 to check it out.​ Done properly we should be able to see a window
    like the following:![](Image00040.jpg)Note: Title Heading’s aren’t visible with
    some linux desktop environments, and MacOS.Open a File or Directory​ Opening a
    file or directory is comprised of 3 parts:'
