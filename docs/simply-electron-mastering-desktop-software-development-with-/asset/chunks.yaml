  trans: "\n让我们逐一复习这些示例。我们已经看过了 `label`、`submenu` 和 `onclick` 的示例了，不用担心，我们稍后会再次回顾它们，但让我们先处理其余部分的。查看以下菜单：\n\
    \n```javascript\nconst template = [{\n    label : 'MyMenu' ,\n    submenu : [\n\
    \      {\n        type : 'radio' ,\n        label : 'male'\n      },\n      {\n\
    \        type : 'radio' ,\n        label : 'female'\n      },\n      { type :\
    \ 'separator' },\n      { role : 'quit' },\n    ]\n  }]\n```\n\n注意如何使用 `separator`\
    \ 菜单项将单选按钮与菜单的其他部分隔开，这是必要的，以便我们区分单选项目和其他菜单项。在引用同一类别的单选按钮与其他菜单项（包括引用不同类别的单选按钮）之间，始终放置分隔符。\n\
    \n现在，让我们做些有意义的事，利用我们目前为止学到的知识创建几个新的菜单选项。在 `main.js` 中使用以下代码创建菜单：\n\n```javascript\n\
    const template = [{\n    label : 'MyMenu' ,\n    submenu : [\n      {\n      \
    \  label : 'reload' ,\n        accelerator : 'CmdOrCtrl+R' ,\n        click :\
    \ ( menuItem , focusedWindow ) => {\n          if ( focusedWindow ) focusedWindow\
    \ . reload ();\n        }\n      },\n      {\n        label : 'fullscreen' ,\n\
    \        accelerator : 'CmdOrCtrl+F' ,\n        click : ( item , focusedWindow\
    \ ) => {\n          focusedWindow . setFullScreen(! focusedWindow . isFullScreen\
    \ ());\n        }\n      },\n      { type : 'separator' },\n      { role : 'quit'\
    \ }\n    ]\n  }]\n```\n\n在这里，我们为菜单创建了一个带有 Ctrl+R（或 CMD）键盘快捷键的刷新按钮，还创建了一个带有 Ctrl+F\
    \ 快捷键的全屏按钮，在分隔符项之后，我们终于有了退出按钮。注意：像 `fullscreen` 这样的按钮也可以 `togglefullscreen` 角色创建。\n\
    \n现在，如果你注意 `click` 属性，你会看到它按特定顺序接收参数，即 `Menu-Item`、浏览器窗口对象事件对象。你可以将它们全部打印到控制台中进行检查。\n\
    \n### 右键菜单\n\n你是否注意到在 Electron 应用的窗口中默认没有右键菜单（即“上下文菜单”）？要创建一个上下文菜单，我们需要完成以下步骤：\n\
    \n*   创建一个 electron 菜单，类似于 `template`。在以下代码中，它是从第 #6 行到第 #10 行完成的，并命名为 `contextMenu`\
    \ 而不是 `template`。\n*   设置一个由 `context-menu` 事件触发的函数，该事件类似于 Electron 中的“右键”事件。在这里是在第\
    \ #12 行到第 #15 行。\n\n将你应用的 (electron-quick-start) `createWindow` 函数替换为以下内容：\n\n\
    ```javascript\nfunction createWindow () {\n  const mainWin = new BrowserWindow\
    \ ({})\n  mainWin . loadFile ( 'index.html' )\n\n  const contextMenu = Menu .\
    \ buildFromTemplate ([\n    { role : \"cut\" },\n    { role : \"copy\" },\n  \
    \  { role : \"paste\" },\n  ]);\n\n  mainWin . webContents . on ( 'context-menu'\
    \ , ( event , params )=>{\n    console . log ( `right click at ( ${ params . x\
    \ } , ${ params . y } )` );\n    contextMenu . popup ( mainWin , params . x ,\
    \ params . y );\n  });\n}\n```\n\n在这里，从第 #6 行到第 #10 行，我们根据提供的数组构建了一个菜单，并将其赋值给变量\
    \ `contextMenu`。然后在第 #12 行，我们使用窗口的 `webContents` 方法访问窗口内容，然后使用它的 `on` 方法检查事件。\n\
    \n我们检查的事件是 `context-menu` 事件，它会在右键点击窗口内容时触发。该事件作为第一个参数传递给 `on`。传递给 `on` 的第二个参数是一个函数，它应该在作为第一个参数传递的事件（在此情况下为\
    \ `context-menu`）被触发时被触发。\n\n在第 #13 行，我们基本上是在记录右键点击位置相对于 x 轴和 y 轴的位置，就像你可能在数学课上记得过的笛卡尔坐标系一样。在第\
    \ #14 行，我们给出了上下文菜单出现的位置。`contextMenu.popup()` 方法按以下顺序接收以下参数：\n\n1.  持有上下文菜单应该出现的窗口变量。\n\
    2.  上下文菜单位置的 x 坐标。\n3.  上下文菜单位置的 y 坐标。\n\n利用此，我们可以创建我们自己喜好的弹出菜单。\n\n### Shell\
    \ API\n\n我们有一个 Shell 包可以对 Electron 软件执行一些了不起的事情，例如使用它们的默认应用程序管理 URL。它用于进一步将 Electron\
    \ 应用与用户的操作系统集成。Shell API 的最佳学习方式是其文档 [`www.electronjs.org/docs/api/shell`](https://www.electronjs.org/docs/api/shell)\
    \ ，但在下面给出了一个演示：\n\n```javascript\nconst { app , BrowserWindow , Menu , shell }\
    \ = require ( 'electron' )\nfunction createWindow () {\n  const mainWin = new\
    \ BrowserWindow ({})\n  mainWin . loadFile ( 'index.html' )\n\n  const contextMenu\
    \ = Menu . buildFromTemplate ([\n    { role : \"cut\" },\n    { role : \"copy\"\
    \ },\n    { role : \"paste\" },\n    {\n      label : 'reload' ,\n      accelerator\
    \ : 'CmdOrCtrl+R' ,\n      click : ( menuItem , focusedWindow ) => {\n       \
    \ if ( focusedWindow ) focusedWindow . reload ();\n        }\n      },\n     \
    \ {\n        label : 'fullscreen' ,\n        accelerator : 'CmdOrCtrl+F' ,\n \
    \       click : ( item , focusedWindow ) => {\n          focusedWindow . setFullScreen(!\
    \ focusedWindow . isFullScreen ());\n        }\n      },\n      { type : 'separator'\
    \ },\n      { role : 'quit' }\n  ]);\n\n  mainWin . webContents . on ( 'context-menu'\
    \ , ( event , params )=>{\n    console . log ( `right click at ( ${ params . x\
    \ } , ${ params . y } )` );\n    contextMenu . popup ( mainWin , params . x ,\
    \ params . y );\n  });\n```\n\n在这里从第 #6 行到第 #10 行，我们根据提供的数组构建了一个菜单，并将其赋值给变量 `contextMenu`。然后在第\
    \ #12 行，我们使用窗口的 `webContents` 方法访问窗口内容，然后使用它的 `on` 方法检查事件。我们检查的事件是 `context-menu`\
    \ 事件，它会在右键点击窗口内容时触发。该事件作为第一个参数传递给 `on`。传递给 `on` 的第二个参数是一个函数，它应该在作为第一个参数传递的事件（在此情况下为\
    \ `context-menu`）被触发时被触发。在第 #13 行，我们基本上是在记录右键点击位置相对于 x 轴和 y 轴的位置，就像你可能在数学课上记得过的笛卡尔坐标系一样。在第\
    \ #14 行，我们给出了上下文菜单出现的位置。`contextMenu.popup()` 方法按以下顺序接收以下参数：\n\n1.  持有上下文菜单应该出现的窗口变量。\n\
    2.  上下文菜单位置的 x 坐标。\n3.  上下文菜单位置的 y 坐标。\n\n利用此，我们可以创建我们自己喜好的弹出菜单。\n\n我们有一个 Shell\
    \ 包可以对 Electron 软件执行一些了不起的事情，例如使用它们的默认应用程序管理 URL。它用于进一步将 Electron 应用与用户的操作系统集成。Shell\
    \ API 的最佳学习方式是其文档 [`www.electronjs.org/docs/api/shell`](https://www.electronjs.org/docs/api/shell)\
    \ ，但在下面给出了一个演示：\n\n（抱歉，原文代码块在此处似乎不完整，已按原文结构翻译）\n\n```javascript\nconst { app ,\
    \ BrowserWindow , Menu , shell } = require ( 'electron' )\nfunction createWindow\
    \ () {\n  const mainWin = new BrowserWindow ({})\n  mainWin . loadFile ( 'index.html'\
    \ )\n\n  const contextMenu = Menu . buildFromTemplate ([\n    { role : \"cut\"\
    \ },\n    { role : \"copy\" },\n    { role : \"paste\" },\n    {\n      label\
    \ : 'reload' ,\n      accelerator : 'CmdOrCtrl+R' ,\n      click : ( menuItem\
    \ , focusedWindow ) => {\n        if ( focusedWindow ) focusedWindow . reload\
    \ ();\n        }\n      },\n      {\n        label : 'fullscreen' ,\n        accelerator\
    \ : 'CmdOrCtrl+F' ,\n        click : ( item , focusedWindow ) => {\n         \
    \ focusedWindow . setFullScreen(! focusedWindow . isFullScreen ());\n        }\n\
    \      },\n      { type : 'separator' },\n      { role : 'quit' }\n  ]);\n\n \
    \ mainWin . webContents . on ( 'context-menu' , ( event , params )=>{\n    console\
    \ . log ( `right click at ( ${ params . x } , ${ params . y } )` );\n    contextMenu\
    \ . popup ( mainWin , params . x , params . y );\n  });\n}\n```\n\n热加载\n\n我们可以使用以下代码在应用中使用构建热重载机制：\n\
    \n```javascript\nconst path = require ( 'path' )\nrequire ( 'electron-reload'\
    \ )( __dirname , {\n  electron : path . join ( __dirname , 'node_modules' , '.bin'\
    \ , 'electron' )\n});\n```\n\n为了使此代码工作，你需要作为开发依赖安装 `electron-reload` 模块，使用命令：`npm\
    \ i -D electron-reload`。注意：`-D` 是 `--save-dev` 的缩写。\n\n现在我们可以对 `index.html` 或其他\
    \ HTML 文件进行热更新，但在打包应用之前确保删除此代码。\n\n### IPC\n\n进程间通信 AKA IPC 是一种 EventEmitter 模块，允许软件的主进程和渲染进程之间发送/接收消息。这种通信可以同步也可以异步地进行。该模块有两个部分，用于主进程的\
    \ `ipcMain` 和用于渲染进程的 `ipcRenderer`。\n\n为了简单起见，让我们假设以下基本定义：\n\n*   **进程 (Process)**：进程是执行中的\
    \ JavaScript 文件。例如 `main.js`、`index.js` 等。文件和进程的区别在于，当文件的代码被执行/运行时，它就变成了一个进程。\n\
    *   **主进程 (Main Process)**：它通常指的是 `main.js` 文件，或者我们在 `package.json` 中作为入口点的任何文件。\n\
    *   **渲染进程 (Renderer Process)**：它通常指的是附加到 HTML 文件的文件，例如 electron-quick-start 方法中的\
    \ `renderer.js`。\n*   **预加载文件 (Preload File)**：这是一个与每个网页默认加载的 JavaScript 文件，无需在它们的\
    \ HTML 文件中提到。由于我们在应用中保持 `nodeIntegration` 为 false，我们的 HTML 文件将将没有 NodeJS 和 Electron\
    \ 的功能，为了安全地克服这个问题，我们将使用 `preload.js` 文件向我们的 HTML 和其他前端文件暴露 NodeJS 和 Electron 的某些功能。\n"
- fmt: "\n# Asynchronous Communication\n\nTo avoid frozen windows most of our IPC\
    \ should be asynchronous. Let’s use the following code for a demonstration of\
    \ async-communication between the main process and the renderer process, with\
    \ `preload.js` file providing advanced support to the renderer process. Used correctly,\
    \ when our app is started we should see a send button and an empty message box.\
    \ When the button is clicked we should see the message box showing `pong` after\
    \ a little while (almost instantly).\n\nClone a fresh `electron-quick-start` project,\
    \ and appropriately add the following source-code to their respective files, also\
    \ think carefully where you are adding the code in a particular file.\n\n### index.html\n\
    ```html\n<button id=\"send-btn\">Send Ping</button>\n<p id=\"msg\">Reply here</p>\n\
    <script src=\"./renderer.js\" defer></script>\n```\nHere we’ve created a send\
    \ button, a message box to show the received message, and also, we’ve added `defer`\
    \ to the `renderer.js` script so it loads only after everything else on the web-page\
    \ is done loading.\n\n### preload.js\n```javascript\nconst { ipcRenderer } = require('electron');\n\
    window.ipcRenderer = ipcRenderer;\n```\nHere we’ve imported the `ipcRenderer`\
    \ module from the `electron` package one line #1, and assigned it to a new prop\
    \ of the `window` object, this is done to pass the `ipcRenderer` module along\
    \ to the renderer process. While this may not be the best approach to do this\
    \ (see `context Isolation` and the `contextBridge` module of `Electron`), this\
    \ is definitely the easiest, without turning on `nodeIntegration` (which is a\
    \ security vulnerability). Also, see for more info (optional): https://github.com/electron/electron/issues/9920#issuecomment-575839738\n\
    Note: This can also be done in a single-line of code, however let’s avoid complications\
    \ here.\n\n### renderer.js\n```javascript\nconst ipcRenderer = window.ipcRenderer;\n\
    const asyncMsgBtn = document.getElementById('send-btn');\nasyncMsgBtn.addEventListener('click',\
    \ () => {\n    ipcRenderer.send('rendererToMain', 'ping');\n})\nipcRenderer.on('reply',\
    \ (event, arg) => {\n    document.getElementById('msg').innerHTML = arg;\n})\n\
    ```\nOn line #1 we’re declaring a variable and giving it the `ipcRenderer` module\
    \ passed along from the `preload.js` file. On line #4 to #6 we’ve added a ‘click’\
    \ event-listener to our send button. On #5 we have code that uses the `ipcRenderer`\
    \ process’s `send` method to send the arbitrary message `ping` to the main process\
    \ over the channel named `rendererToMain`, this line of code will be executed\
    \ when someone clicks the send button on our window. On line #8 to #10 we’ve started\
    \ listening to the channel named `reply` using the `ipcRenderer` module’s `on`\
    \ method. On #9 we have code that will be executed as soon as we receive a message\
    \ over the `reply` channel, the code will take the message received (stored in\
    \ `arg`), and insert it inside the message box on our web page (here `msg` is\
    \ the ID of our message box).\n\n### main.js\n```javascript\nconst { ipcMain }\
    \ = require('electron');\nipcMain.on('rendererToMain', (event, arg) => {\n   \
    \ event.sender.send('reply', 'pong');\n})\n```\nThis one should be simple enough\
    \ by now, the `ipcMain` module is similar to the `ipcRenderer` (except it’s for\
    \ the main process). We have imported it, used it’s `on` method to listen to the\
    \ `rendererToMain` channel for any messages from any of the renderer processes,\
    \ and upon receiving a message we send the reply `pong` over the channel `reply`.\
    \ Notice how different channels are being used in the sending and receiving of\
    \ messages. Also, one channel is acting as a sender of one process, and the receiver\
    \ of another process.\n\nIn all of the code above the following list of keywords\
    \ are arbitrary (among others):\n\n1. `rendererToMain`: This is a channel name,\
    \ and we can use any name we like, as long as it’s unique and meaningful. Asynchronous\
    \ communication happens over unique, channels so one message can be distinguished\
    \ from another, and each channel is dedicated to either sending messages or receiving\
    \ them (one way). This channel is being used by the renderer process to send the\
    \ message `ping` over to any process that is listening to this channel; here the\
    \ main process is listening to this channel on line #3 – `main.js`.\n2. `ping`\
    \ and `pong`: These are just javascript strings, and can be any strings we like.\
    \ For example, `ping` can be replaced with “Hello, who is there?”, and `pong`\
    \ can be replaced with “Hey, it’s me, the main process.”\n3. `reply`: This is\
    \ also an asynchronous communication channel, and follows the naming guidelines.\n\
    4. `send-btn`: This is just a unique element ID for our send button, and follows\
    \ the standard HTML naming conventions.\n5. `msg`: This is also a unique element\
    \ ID for our reply message box.\n6. `arg`: Found in `renderer.js` at line #8 and\
    \ #9, this is just a parameter name (can be any word), this parameter stores the\
    \ message we got from the reply.\n"
