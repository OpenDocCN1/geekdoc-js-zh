    console.​ The code provided here needs a button, hence use the following HTML
    file:1  <!DOCTYPE html>2   < html >3     < body >4       < button id = "shot-btn"
    >grab screen shot</ button >5       < script src = "./renderer.js" ></ script
    >6     </ body >7   </ html >Debugging and Testing​ Nearly half of the time you
    spend on your software’s development phase will be spent on debugging and testing
    your software, and as you move towards the deployment phase, more and more time
    will be spent towards debugging and testing. It will be worst right before you
    roll out a new release!​ Debugging and Testing consists of several parts, including
    learning tools of the trade, applying a system of testing, getting good feedback,
    studying case studies, etc. However, most of it will come instinctively after
    you gain some experience as a software engineer. The following sections deal with
    Debugging and Testing tools only.Debugging Tools​ In this section we’ll learn
    development tools used for debugging main and renderer processes. Learning Debugging
    tools can make your life significantly easier, it will also dramatically improve
    your understanding of software engineering, and help you develop a good amount
    of appreciation of the software engineering process and the work of your peers.Chrome
    Developer tools​ Chrome developer tools have a large collection of instrument
    to aid debugging of web-pages.![](Image00042.jpg)​ Following is a list of instruments
    available in Chrome Developer tools panel:'
