  trans: "\n\n在接下来的代码中（基于 `electron-quick-start` 脚手架），我们注册了一个任意名为‘cat ’ 的协议（我喜欢猫！）。（在没有额外配置，以下示例在某些\
    \ Linux 和 MacOS 机器上无法运行）\n\n### main.js\n```javascript\nconst { app, protocol,\
    \ BrowserWindow } = require('electron');\nconst path = require('path');\nconst\
    \ protocolName = 'cat';\n\nfunction createWindow () {\n  const partition = 'persist:one';\n\
    \n  const mainWindow = new BrowserWindow ({\n    width: 800,\n    height: 600,\n\
    \    webPreferences: { partition }\n  })\n\n  if (process.argv.length >= 3) {\n\
    \    mainWindow.loadFile(process.argv[2].slice(6, -1))\n  }\n  else {\n    mainWindow.loadFile('index.html')\n\
    \  }\n}\n\napp.whenReady().then(() => {\n  createWindow();\n  protocol.registerFileProtocol(protocolName,\
    \ (request, callback) => {\n    callback({ path: request.url });\n  })\n})\n```\n\
    \n### index.html\n```html\n<!DOCTYPE html>\n<html>\n  <body>\n    <a href=\"cat://example.html\"\
    >myFile</a>\n    <script src=\"./renderer.js\"></script>\n  </body>\n</</html>\n\
    ```\n\n### example.html (任意网页)\n```html\n<!DOCTYPE html>\n<html>\n  <body>\n \
    \   <h1>This is the example file</h1>\n  </body>\n</html>``` (注：修正为 </html>)\n\
    \n使用 `npm start` 启动应用，当点击“`cat://example.html`”URL 时（通过我们网页上的“myFile”链接），将向我们的应用发送一个请求，因为系统正试图通过任意的\
    \ `cat://` 协议访问 `example.html` 链接。\n\n该访问请求会被我们应用的第 2 个实例（某种意义上）接收，因为它被设置为拦截 `cat://`\
    \ 协议；然而，这次当我们的应用带有一个新窗口运行时，它将显示一个不同的网页（“example.html ” 网页）。\n\n在 `main.js` 代码中，在第\
    \ #1 行和第 #2 行我们导入了工作所需的模块：我们有 `app` 模块用于处理应用交互所需的方法，我们有 `protocol` 模块用于处理与操作系统协议相关的内容所需的方法，我们有\
    \ `BrowserWindow` 模块用于处理应用窗口的方法。\n\n在第 #3 行我们创建了一个变量来定义自定义协议名称（必须用 `const` 声明）。\n\
    \n在 #5 到 #18 行，我们有一个标准的 `createWindow()` 函数。唯一的新内容在第 #6、#11、#14 行，以及 #15 行的一些地方。\n\
    \n在 #6 行，我们创建了一个持久化分区（persistent partition），这在我们应用中从相同方法（在本例中为 `createWindow()`）启动的不同窗口，与其他具有相似性质的其它之间之间保持一个隔离层。`persist:`\
    \ 部分不是任意的，但 `one` 部分是任意的，因此分区名称可以是 `persist:one`、`persist:alpha`、`persist:myPart`\
    \ 等。\n\n在第 #11 行，我们为应用的窗口提供了一个名为 `webPreferences` 的属性，该属性本身包含另一个名为 `partition`\
    \ 的子属性，其值与第 #6 行相同。这是通过直接在对象的大括号内编写变量名实现的，这种写法被称为展开（spreading）。\n\n**注意：** 参数向量（argument\
    \ vector）由传递给终端（如 Terminal）等命令行程序的命令组成。事实上，终端不仅供人类使用，程序经常使用不可见的终端与其他程序进行交互。此类参数向量看起来像“npm\
    \ start”、“electron .”、“electron . myFile.html”等。\n\n在第 #14 行，我们正在检查参数向量（通过命令行传递的参数），如果向参数向量中传递了\
    \ 3 个或更多参数，则程序一定是由另一个程序运行的，因为我们应用的初始运行是由我们通过 `npm start` 完成的（由于 `package.json`\
    \ 中的 start 脚本，它等同于 `electron .`），这只有 2 个参数：“npm”和“start”。我们推测，带 3 个或更多参数运行我们的应用是当操作系统运行我们的应用时，因为它希望我们的应用拦截“cat://\
    \ ” 协议，当这完成后，我们的参数向量看起来会像：`electron /electron/electron.executable cat://filename.html/`，可以简化为：`electron\
    \ . cat://filename.html`。\n\n现在，当我们的应用带 3 个参数运行时，程序显然需要打开作为第 3 个参数提供的网页，这就是第 #15\
    \ 行所做的，在这里我们将第 3 个参数加载为我们的网页（而不是“index.html”）。我们使用 `process` 对象的 `argv[]` 数组属性来访问运行时应用提供的参数列表。第\
    \ 1 个参数通常是程序本身的名字（在这种情况下应该是 `electron`），第 2 个参数是你的应用的 URL，第 3 个参数是网页本身，且第 3 个是可选的。因此，`process.argv[2]`\
    \ 用于访问从零开始索引的参数向量中的第 3 个值。`slice()` 方法用于从第 3 个参数得到的字符串中删除前 6 个和最后的 1 个字符，因此“cat://example.html/\
    \ ”将变成“example.html ”\n\n如果应用正常运行（带 2 个向量），它将由于第 #17 行而像往启动“index.html”。\n\n在\
    \ #22 到 #24 行，我们使用 `protocol` 模块的 `registerFileProtocol()` 方法将“cat”名称注册为我们应用的协议，这样操作系统就能学会将协议名称与应用名称关联。除非你正在为\
    \ Windows 开发，否则这通常不会运行得非常顺畅；如果你决定开发其他技术栈，学习将会有帮助。要学习使用 electron 为其他操作系统开发，你可以检查\
    \ electron 的文档，注意 MacOS 指南，并留意 Linux 的所有特性。\n\n在第 #22 行 `registerFileProtocol()`\
    \ 方法接收 2 个参数作为参数。第一个参数是我们要注册的协议名称。第二个参数是一个方法，当有人（你的 OS）尝试使用参数的第 3 个项目作为调用你协议的\
    \ URL 来运行你的应用时，该方法会被执行，例如“cat://example.html/”。该方法本身有 2 个参数，以防是 `request` 和 `callback`，`request`\
    \ 参数将接收一个 `request` 对象，而 `callback` 参数将接收一个 `callback` 方法。`request` 对象具有 `url`\
    \ 属性，将持有应用调用的 URL，因此 `request.url` 将像“cat://example.html”。第 #23 行的 `callback()`\
    \ 方法实际上是通过操作系统运行我们的应用。\n\n**注意：** 如果你想了解更多关于分区（partitions）和会话（sessions）的内容，请查阅文档。\n\
    \n### 使用 I/O 设备\n输出功能可以是你应用程序的枢纽，请记住，在处理 I/O（输入/输出）功能时，不当的组合可能会成为你最大的漏洞。输出 I/O\
    \ 流是因为总是随着最新的 I/O 信息更新。\n\n### 显示流\nElectron 自带 `desktopCapt` 模块，可以访问桌面媒体流，并从中提取如音频、视频、屏幕等媒体流。这与\
    \ Chromium 中的 `getUserMedia` API 非常相似。在 electron-quick-start 脚手架上构建以下代码，运行应用程序后你就可以探索了。\n\
    \n**main.js:**\n```javascript\nconst { app, BrowserWindow } = require('electron')\n\
    function createWindow () {\n  const mainWindow = new BrowserWindow ({\n    width:\
    \ 800,\n    height: 600,\n    webPreferences: {\n      nodeIntegration: true,\n\
    \      enableRemoteModule: true\n    }\n  })\n  mainWindow.loadFile ('index.html')\n\
    \  mainWindow.webContents.openDevTools ()\n}\n\napp.whenReady().then(() => {\n\
    \  createWindow ()\n})\n``` 标准文件，这里重要的行是第 #8 行的 `nodeIntegration` 和第 #9 行的 `enableRemoteModule`。启用这两项是为了渲染进程能够工作。\n\
    \n**renderer.js:**\n```javascript\nconst { desktopCapturer } = require('electron')\n\
    const { screen } = require('electron').remote\nlet options = { types: ['window',\
    \ 'screen'] }\ndesktopCapturer\n  .getSources ( options )\n  .then (( sources\
    \ ) => {\n    console.log ( sources );\n  })\n``` 在第 #1 行我们从 `electron` 模块导入 `desktopCapturer`。在第\
    \ #2 行我们从 `electron.remote` 导入 `screen` 模块以便在渲染进程中使用。第 #3 行有一个空行。第 #4 行我们有一个对象，稍后用于配置窗口和屏幕。‘window’和‘screen’选项是\
    \ type 属性唯一的。这一行基本上是模板代码！在 #6 行和 #7 行我们使用 `getSources()` 方法（它返回一个 `Promise`）的\
    \ `desktopCapt` 模块来获取可用窗口和屏幕的列表；然后在第 #8 行使用 `then()` 方法来解析该 Promise。参数将传递给 `then()`\
    \ 方法的 `sources` 参数，它将在浏览器的控制台中第 #9 行打印。\n\n### 将桌面捕获为 PNG\n在 electron-quick-start\
    \ 脚手架上构建以下代码，创建一个可以捕获桌面截图、将其保存为 PNG 并在系统默认 PNG 查看器中打开的应用。`main.js` 文件与之前相同，我们可以使用以下\
    \ `renderer.js` 文件：\n\n**renderer.js:**\n```javascript\nconst { desktopCapturer,\
    \ shell } = require('electron')\nconst { screen } = require('electron').remote\n\
    const fs = require('fs')\nconst os = require('os')\nconst path = require('path')\n\
    \nconst screenshot = document.getElementById('shot-btn');\nconst thumbSize = determineScreenShotSize();\n\
    let options = {\n  types: ['window', 'screen'],\n  thumbnailSize: thumbSize\n\
    }\n\nscreenshot.addEventListener('click', captureScreen);\n\nfunction captureScreen\
    \ () {\n  desktopCapturer\n    .getSources ( options )\n    .then (( sources )\
    \ => {\n      sources.forEach (( s ) => {\n        if (s.name === 'Entire Screen'\
    \ || s.name === 'Screen 1') {\n          const shotPath = path.join(os.tmpdir(),\
    \ 'screenshot.png')\n          fs.writeFile (shotPath, s.toPNG (), (error) =>\
    \ {\n            if (error) console .log (error)\n            shell.openExternal(`file://${shotPath}`);\n\
    \            console .log (`Saved to: ${shotPath}`);\n          })\n        }\n\
    \      })\n    })\n}\n\nfunction determineScreenShotSize () {\n  const screenSize\
    \ = screen.getPrimaryDisplay().workArea\n  const maxDimension = Math.max(screenSize.width,\
    \ screenSize.height)\n  return {\n    width: maxDimension * window.devicePixelRatio,\n\
    \    height: maxDimension * window.devicePixelRatio\n  }\n}\n```\n第 #1 行和第 #2\
    \ 行我们导入 `electronJS` 模块。`desktopCapturer` 模块用于提取桌面真实的截图。`shell` 模块用于在外部图像查看器中打开截图。`screen`\
    \ 模块用于第 #8 行查找主显示器/屏幕的工作尺寸。从第 #4 行到第 #7 行我们导入 `NodeJS` 模块。从第 #26 行到第 #30 行使用 `fs`\
    \ 模块将之前提取的截图保存到提供的 URL。在第 #24 行使用 `os` 模块获取该 URL，`os.tmpdir()` 方法用于获取系统临时目录的地址。第\
    \ #8 行我们获取了 `shot-btn` 按钮，并将其赋值给 `screenshot` 变量。在第 #9 行我们使用了 `determineScreenSize()`\
    \ 函数来提取这些窗口 I/O 信息。\n\n"
- fmt: "\n* Click and select instrument for picking HTML elements.\n* Elements (HTML\
    \ Element Inspector).\n* Console (for logging stuff)\n* Sources (for inspecting\
    \ files involved in your app)\n* Network (Recording and observing network activity)\n\
    * Performance (recording and observing resource performance)\n* Memory (Observe\
    \ memory information)\n* Application (Get a complete bird’s eye view of the app)\n\
    * Security (various security details)\n* Lighthouse (An amazing feature for debugging\
    \ performance problems).\n\nIn future editions we plan on elaborating further\
    \ on each individual development instrument, until then you are far better off\
    \ studying stuff from Chrome developer’s documentation. Remember, `Console` is\
    \ the best debugging instrument for a beginner developer.\n\n## Devtron\nDevtron\
    \ is another useful instrument that can be added to your chrome developer tools\
    \ panel. Use the following instructions to install and use Devtron:\n\n1. Install\
    \ Devtron using `npm i –D devtron`. Here, Devtron is installed as a developer\
    \ dependency with `-D`.\n2. Use `require('devtron').install()` in a `console`\
    \ to install Devtron in that panel.\n3. Now, in the Chrome developer tools panel\
    \ there will be a Devtron tab available where you can get your eyes on information\
    \ regrading stuff like Event Listeners, IPC, etc.\n4. To configure the Manifest\
    \ feature just edit the `node_modules/devtron/manifest.json` file. If you don’t\
    \ know what that is, you can safely ignore it.\n\n### Features available in Devtron:\n\
    1. Require graph: visualize your app's dependencies.\n2. IPC monitor: track and\
    \ inspect the communication between processes.\n3. Event inspector: inspect the\
    \ events and listeners that are registered in your app on the core Electron APIs\
    \ such as the `window`, the app, and the processes.\n4. App Linter: analyze your\
    \ app for possible issues, missing functionality, etc.\n\nRead more about Devtron\
    \ at [https://github.com/electron-userland/devtron](https://github.com/electron-userland/devtron)\n\
    \n## VSCode debugger\nThe VSCode IDE has a built in debugger that you can use\
    \ to debug the main process very easily, just follow these instruction to set\
    \ it up and use it:\n\n1. Create a `.vscode` directory in your app’s central directory\
    \ (also known as the `workspace-root`).\n2. Create a `.vscode/launch.json` file.\n\
    3. Add the following code `launch.json` file.\n\n```json\n{\n  \"version\": \"\
    0.2.0\",\n  \"configuration\": [\n    {\n      \"name\": \"Debug Main Process\"\
    ,\n      \"type\": \"node\",\n      \"request\": \"launch\",\n      \"cwd\": \"\
    ${workspaceRoot}\",\n      \"runtimeExecutable\": \"${workspaceRoot}/node_modules/.bin/electron\"\
    ,\n      \"windows\": {\n        \"runtimeExecutable\": \"${workspaceRoot}/node_modules/.bin/electron.cmd\"\
    \n      },\n      \"args\": [\".\"]\n    }\n  ]\n}\n```\n\n4. Click on the green\
    \ play button on top-left of VSCode, and it should show a message like \"Debugger\
    \ listening on ws://127.0.0.1:somePort/someHash\" and \"Debugger attached\".\n\
    5. Now click on the red dots preceding line numbers in VSCode to add break points,\
    \ and when the running app reaches that point and main process will halt and you\
    \ can explore the state of the program there.\n"
  raw: '*   Click and select instrument for picking HTML elements.


    *   Elements (HTML Element Inspector).


    *   Console (for logging stuff)


    *   Sources (for inspecting files involved in your app)


    *   Network (Recording and observing network activity)


    *   Performance (recording and observing resource performance)


    *   Memory (Observe memory information)


    *   Application (Get a complete bird’s eye view of the app)


    *   Security (various security details)


    *   Lighthouse (An amazing feature for debugging performance problems).


    ​ In future editions we plan on elaborating further on each individual development
    instrument, until then you are far better off studying stuff from Chrome developer’s
    documentation.​ Remember, Console is the best debugging instrument for a beginner
    developer.Devtron​ Devtron is another useful instrument that can be added to your
    chrome developer tools panel. Use the following instructions to install and use
    Devtron:


    1.  Install Devtron using `npm i –D devtron `. Here, Devtron is installed as a
    developer dependency with `-D `.


    2.  Use `require(‘devtron’).install() ` in a console to install Devtron in that
    panel.


    3.  Now, in the Chrome developer tools panel there will be a Devtron tab available
    where you can get your eyes on information regrading stuff like Event Listeners,
    IPC, etc.


    4.  To configure the Manifest feature just edit the node_modules/devtron/manifest.json
    file. If you don’t know what that is, you can safely ignore it.


    Features available in Devtron:


    1.  Require graph: visualize your app''s dependencies.


    2.  IPC monitor: track and inspect the communication between processes.


    3.  Event inspector: inspect the events and listeners that are registered in your
    app on the core Electron APIs such as the window, the app, and the processes.


    4.  App Linter: analyze your app for possible issues, missing functionality, etc.


    Read more about Devtron at [https://github.com/electron-userland/devtron](https://github.com/electron-userland/devtron)VSCode
    debugger​ The VSCode IDE has a built in debugger that you can use to debug the
    main process very easily, just follow these instruction to set it up and use it:


    1.  Create a .vscode directory in your app’s central directory (also known as
    the workspace-root ).


    2.  Create a .vscode/launch.json file.


    3.  Add the following code launch.json file.


    1   {2     “version”: “0.2.0”,3     “configuration”: [4       {5         “name”:
    “Debug Main Process”,6         “type”: “node”,7         “request”: “launch”,8  
          “cwd”: “${workspaceRoot}”,9         “runtimeExecutable”: “${workspaceRoot}/node_modules/.bin/electron”,10 
          “windows”: {11          “runtimeExecutable”: “${workspaceRoot}/node_modules/.bin/electron.cmd”,12 
          },13        “args”: [“.”]14      }15    ]16 }


    5.  Click on the green play button on top-left of VSCode, and it should show a
    message like “Debugger listening on ws://127.0.0.1:somePort/someHash” and “Debugger
    attached”.


    6.  Now click on the red dots preceding line numbers in VSCode to add break points,
    and when the running app reaches that point and main process will halt and you
    can explore the state of the program there.'
