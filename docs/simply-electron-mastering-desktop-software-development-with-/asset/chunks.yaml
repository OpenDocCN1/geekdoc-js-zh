    away the punch card and redoing all the work again.​ The punch cards were a digital
    mechanical technology, like all mechanical tech it was subject to wear and tear.
    This technology was applied on tape, paper, wood, metal sheets, etc. and was very
    successful. The technology is so practical that it is used even today in many
    different devices, mostly antique replicas and factories.​ However here is the
    important stuff, The punch card was probably the first medium to store digital
    data for Electronic computation purposes. Punch cards were used in looms, calculators,
    and musical instruments like those piano’s with built-in scrolls that can play
