    ​ You’ve already learned how to conjure up a desktop app window with ElectronJS
    in the Express Approach #1 and #2 section; in this chapter we will go over a few
    elementary procedures and narrative explanations for ElectronJS code and features.​
    Most of the stuff shown here will need some memorization and practice, make sure
    you understand the procedures shown before moving on. You already know JavaScript,
    learning ElectronJS is more about learning it’s unique procedures and concepts
    like the difference between IPC (as a concept) and Electron’s APIs! In fact the
    basics of ElectronJS are all about it’s APIs.​ The procedures are shown with the
    help of Examples, so keep an eye out for boilerplate code (code that is copy/pasted
    as is).​ During each section we’ll cover several approaches to set up Electron
