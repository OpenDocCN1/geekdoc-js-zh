    \ HTML、CSS 和 JavaScript（或 TypeScript）构建一个基础计算器。请使用上述方法中的一种。\n\n我们已经提供了 JavaScript\
    \ 和 TypeScript 的代码。如果你使用 TypeScript，请使用扩展名为为 `.ts` 的文件代码；如果你计划使用原生 JavaScript，请使用扩展名为为\
    \ `.js` 的文件。\n\n**注意：** 你会发现有很多 HTML 渲染是通过 JavaScript 完成的，而不是直接编写 HTML 代码，这是为了练习\
    \ TypeScript/JavaScript。如果你愿意，也可以直接编写 HTML。\n\n**提示：** 分别用使用 TypeScript 和不使用 TypeScript\
    \ 制作该项目，并对比两个项目中的代码。\n\n以下是我们在项目中需要涵盖的检查点列表：\n1. 项目是一个简单的 `Calculator`（计算器）。\n\
    2. 项目应具有以下工作按键：`0` 到 `9`、`+`、`-`、=` 和清空（clear）。项目完成后，你可以在里面添加更多内容。\n3. 按钮应该以网格方式正确布局，可以使用\
    \ HTML 表格或 UI 框架。\n4. 我们应该能够以桌面窗口的形式看到 GUI 界面。\n\n以下是所有所需文件的源代码：\n\n### index.ts\
    \ (仅在在使用 Typescript 时使用)\n```typescript\nconst d = document;\nconst display =\
    \ d . getById ( \"disp\" ) || d . body ;\nconst keypad = d . getById ( \"keypad\"\
    \ ) || d . body ;\n\nlet keypadDigits : any = [ [ 7 , 8 , 9 ], [ 4 , 5 , 6 ],\
    \ [ 1 , 2 , 3 ], [ \"+\" , 0 , \"-\" ] ];\n\nfor ( let x of keypadDigits ) {\n\
    \  const row = d . createElement ( \"TR\" );\n\n  for ( let y of x ) {\n    const\
    \ data = d . createElement ( \"TD\" );\n    const button = d . createElement (\
    \ \"BUTTON\" );\n    const buttonContent = d . createTextNode ( y );\n    button\
    \ . appendChild ( buttonContent );\n    button . onclick = () => keypress ( y\
    \ );\n    data . appendChild ( button );\n    row . appendChild ( data );\n  }\n\
    \  keypad . appendChild ( row );\n}\n\nfunction keypress ( input = \"keySt\" )\
    \ : void | null {\n  if ( display . innerHTML . length >= 5 ) { return ; }\n \
    \ const content = d . createTextNode ( input );\n  display . appendChild ( content\
    \ );\n}\n\nfunction clr () : void {\n  display . innerHTML = \"\";\n}\n\nfunction\
    \ equal () : void {\n  // This is a basic project no need to worry about eval()\
    \ or sanitizing.\n  display . innerHTML = eval( display . innerHTML ) || 0 ;\n\
    }\n```\n\n### index.html\n```html\n<!doctype html>\n<html\n<head>\n  <title>Calculator</title>\n\
    \  <link rel=\"stylesheet\" type=\"text/css\" href=\"main.css\" />\n  <script\
    \ src=\"index.js\" defer></script>\n</head>\n<body>\n  <center>\n    <table>\n\
    \      <thead>\n        <tr>\n          <td colspan=\"3\"><div id=\"disp\"></div></td>\n\
    \        </tr>\n      </head>\n      <tbody id=\"keypad\"></tbody>\n      <footer>\n\
    \        <tr>\n          <td colspan=\"2\"><button onclick=\"equal()\" id=\"eql\"\
    >=</button></td>\n          <td><button onclick=\"clr()\" id=\"clr\">Clr</button></td>\n\
    \        </tr>\n      </footer>\n    </table>\n  </center>\n</body>\n</html>\n\
    ```\n\n### main.css\n```css\nbutton, #disp {\n  font-size: 42px;\n  background-color:\
    \ #777;\n  color: white;\n  border: 1px solid #ffd;\n  width: 100%;\n}\n\n#disp\
    \ {\n  height: 42px;\n}\n\n#eql {\n  background-color: green;\n}\n\n#clr {\n \
    \ background-color: orange;\n}\n```\n\n### main.ts (仅在在使用 Typescript 时使用)\n```typescript\n\
    import { app , BrowserWindow } from \"electron\";\n\napp .on (\"ready\", () =>\
    \ {\n  const mainWindow = new BrowserWindow ({ height : 380 , width : 190 , resizable\
    \ : false });\n  mainWindow . webContents . loadURL (`file://${ __dirname }/index.html`);\n\
    });\n```\n\n### index.js (仅在不使用 Typescript 时使用)\n```javascript\nvar d = document;\n\
    var display = d . getById ( \"disp\" );\nvar keypad = d . getById ( \"keypad\"\
    \ );\nvar keypadDigits = [[ 7 , 8 , 9 ], [ 4 , 5 , 6 ], [ 1 , 2 , 3 ], [ \"+\"\
    \ , 0 , \"-\"]]];\nfor ( var i = 0 ; i < 4 ; i++ ) {\n  makeRow ( i );\n}\n\n\
    function makeRow ( x ){\n  var digitRow = keypadDigits[x];\n  var row = d . createElement\
    \ ( \"TR\" );\n  for ( var j = 0 ; j < 3 ; j++ ) {\n    makeData ( row , digitRow[j]);\n\
    \  }\n  keypad . appendChild ( row );\n}\n\nfunction makeData ( row , digitRow[j])\
    \ {\n  var data = d . createElement ( \"TD\" );\n  var button = d . createElement\
    \ ( \"BUTTON\" );\n  var buttonContent = d . createTextNode ( y );\n  button .\
    \ appendChild ( buttonContent );\n  button . onclick = () => keypress ( y );\n\
    \  data . appendChild ( button );\n  row . appendChild ( data );\n}\n\nfunction\
    \ keypress ( input = \"keySt\" ) {\n  if ( display . innerHTML . length >= 5 )\
    \ { return ; }\n  const content = d . createTextNode ( input );\n  display . appendChild\
    \ ( content );\n}\n\nfunction clr () {\n  display . innerHTML = \"\";\n}\n\nfunction\
    \ equal () {\n  // This is a basic project no need to worry about eval() or sanitizing.\n\
    \  display . innerHTML = eval( display . innerHTML ) || 0 ;\n}\n```\n\n### main.js\
    \ (仅在不使用 Typescript 时)\n```javascript\nvar electron = require(\"electron\");\n\
    var { app , BrowserWindow } = electron;\n\napp .on (\"ready\", () => {\n  var\
    \ mainWindow = new BrowserWindow ({ height : 380 , width : 190 , resizable : false\
    \ });\n  mainWindow . webContents . loadURL (\"file://\" + __dirname + \"/index.html\"\
    );\n});\n```\nElectron 输出：![Image035.jpg](img/Image035.jpg)\n\n这是我们的基础计算器。轮到你了！\n\
    \n# 第 4 章 深入学习 ElectronJS\n\n如果你已经有 JavaScript 和 NodeJs 的经验，那么学习 ElectronJS 应该轻而易举；我最喜欢\
    \ Electron 的一点是它的开发过程与类 Unix 操作系统的旧开发过程非常相似，这在某种程度上确保了你的软件质量良好！\n\n你已经在第 #1 和\
    \ #2 节学习了如何使用 ElectronJS 弹出一个桌面窗口；在本章中，我们将介绍 ElectronJS 代码和特性的一些程序和说明。这里显示的大部分内容需要一些记忆和练习，在继续之前请确保你理解了所展示的程序。程序都是通过示例展示的，所以请注意样板代码（可以直接复制粘贴的代码）。在每个节中，我们将涵盖多种方法：\n\
