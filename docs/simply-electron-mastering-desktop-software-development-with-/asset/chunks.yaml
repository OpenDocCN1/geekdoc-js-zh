- fmt: "\nHere we will use TensorFlowJS with NodeJS. We can use `npm i @tensorflow/tfjs-node`,\
    \ the NodeJS specific backed for TensorFlow connects to TensorFlow-C. The Browser\
    \ and NodeJS packages come with their own API’s, hence `tf.browser` and `tf.node`\
    \ are only importable from their respective modules. The NodeJS module provides\
    \ synchronous operations only, hence the main thread will be blocked until the\
    \ operation in completed.\n\n### Procedure\nLet’s get started, use the following\
    \ steps to set up a NodeJS based CLI interface to use TensorFlowJS:\n\n1. Make\
    \ a new project directory and navigate to it from a Terminal.\n2. Initialize NPM\
    \ with `npm init -y`. Make sure to use `index.js` as an entry point if you don’t\
    \ use the `-y` flag.\n3. Install TensorFlowJS with `npm i @tensorflow/tfjs-node`.\n\
