  trans: "\n\n它们用法的一个很好的例子是：\nHTML: `<div id='root'></div>`\nJavaScript: `document.getElementById('root').innerHTML\
    \ = \"Hello World\";`\n在这个示例中，结果将在网页页上显示“Hello World”。\n\n# ES6 又称 ES2015\n\n\
    简单来说，“ES6”是 `JavaScript` 的高级版本！它也被称为 `ES2015`，因为它是基于欧洲计算机厂商协会（又简称 `ECMA`）制定的 `ECMAScript\
    \ 2015` 标准的。\n\n初看之下，要在日常的 `JavaScript` 代码中集成 `ES6` 似乎没什么需要学习的，然而，在继续阅读后续章节之前，我们建议你良好掌握\
    \ `ES6`，虽然它不是先决条件，但仍然非常推荐。如果你想进一步学习 `ES6`，可以购买《Simply ES6: Mastering JavaScript\
    \ and ES6 to its fullest》一书，这本畅销书被誉为：“有以来最好的 ES6 书籍之一”—— `BookAuthority`\n\n以下是我们可以开始学习\
    \ `ES6` 时可以学习的一些基础知识列表：\n\n1. 开始使用 `let` 和 `const` 变量声明来代替 `var` 声明。`var` 有其用处，但请尽量避免使用。\n\
    2. 在 `JavaScript` 中开始使用 `ES6` 类（classes）。\n3. 开始使用反引号（`)）（可以在“Esc”键下方找到）来编写多行字符串。这类字符串被称为“模板字符串字量”（Template\
    \ literals）。\n4. 当不需要 `this` 等关键字时，开始使用箭头函数（fat-arrow functions）。\n5. 去买《Simply\
    \ ES6》吧，这是一个非常全面的话题。\n\n让我们来看看如何实现！\n\n## ES6 中的类\n\n类在某种意义上是“对象工厂”，因为它们接收参数并返回对象。`ES6`\
    \ 为在 `JavaScript` 中创建类提供了一种简单的方法！让我们通过下面的代码来更好地理解：\n\n```javascript\nclass FarmAnimal\
    \ {\n  constructor (species, name) {\n    this.species = species;\n    this.name\
    \ = name;\n    this.love = 0;\n  }\n  increaseLove () {\n    this.love += 10;\n\
    \  }\n}\nlet david = new FarmAnimal (\"dog\", \"David\");\nconsole.log (david);\n\
    david.increaseLove();\n```\n\n控制台输出：![](img/Image00031.jpg)\n\n看在 `ES6` 中编写类是多么简单？！我们只需要编写关键字\
    \ `class`，后面跟上我们的类名称，然后是用于创建创建的指令！例如在这里，我们指示类创建一个名为 `increaseLove()` 的函数，然后在倒数第二行对\
    \ `david` 对象调用了该函数。你会发现我们只使用 `const` 关键字来声明那些我们永远不想更改其值的变量！它们在整个代码中都是常量。永远不要尝试重新赋值/更改\
    \ `const` 变量的值。\n\n## 箭头函数\n\n`ES6` 为 `JavaScript` 带来了一种新类型的函数——“箭头函数”。这种函数并不是传统\
    \ `JavaScript` 函数的替代品，但它们大部分时候会被使用。让我们看看下面的函数：\n\n![](img/Image00032.jpg)\n\n\
    看了这个箭头函数后，看起来似乎比旧的编写函数的方法要麻烦得多，但并非总是如此。另外注意 `=>` 箭头符号，很酷对吧？！\n\n## 用于 Electron\
    \ 的 NodeJS\n\n`NodeJS` 是一个 `JavaScript` 框架，允许我们编写运行在网站后端和网络服务的代码，至少这是 `NodeJS`\
    \ 的初始目的。\n\n注意：框架只是一种编写、编译和处理代码的方式。\n注意：后端是服务器 PC 的另一个名称，用于向客户端/终端用户/前端/访问网站的人提供网页服务。\n\
    \n## 下载 NodeJS\n\n要使用 `NodeJS`，我们需要从它的网站下载并安装。如果你正在使用 Windows 或 Mac，可以使用以下步骤下载并安装\
    \ `NodeJS`：\n\n步骤：\n1. 下载 `NodeJS` 的第一步是访问它的网站“nodejs.org”或在线搜索中出现的任何相关网站。找到并点击此按钮（注意：10.16.0\
    \ 可以是任何版本号）：\n\n"
- fmt: '

    ![](Image00033.jpg) An installer file will be downloaded. Install NodeJS using
    this installer. (An easy process with many online video guides if required).


    In Debian based Distros like Ubuntu, PopOS, etc. We can use the `APT` package
    manager to install NodeJS with the following command:

    ```bash

    sudo apt-get install nodejs

    ```

    In this command `sudo` is optional in case you need high-level privileges to install
    NodeJS. Similar steps can be followed to download NodeJS on Linux, use the default
    package manager of your Linux Distro if possible.


    On android you can install Termux and run the command:

    ```bash

    pkg install nodejs

    ```

    **Caution**: if you are using Terminal to install NodeJS you many need to install
    NPM separately; use the command:

    ```bash

    sudo apt-get install npm

    ```


    To check if NodeJS or `NPM` is installed in your computer use the following commands
    in your Terminal/CMD:

    ```bash

    node -v

    npm -v

    ```

    These commands will return a version number for their respective programs if they
    are installed properly.


    ### Writing your first NodeJS code:-


    Once NodeJS is installed open your Terminal/CMD and execute the command:

    ```bash

    node

    ```

    This will activate the NodeJS CLI, then you can run any JavaScript code inside
    your Terminal. For example, after activation the NodeJS CLI type out the following
    code:

    ```javascript

    console.log("Hello World") // Logs “Hello World” to console

    ```

    This code will log “Hello World” to console, however since its running in the
    NodeJS environment it will log it to the CLI of NodeJS, not the console of the
    browser.


    ### NodeJS with NPM


    `NPM` is an abbreviation for “Node Package Manager” which is a package management
    and workstation management tool that comes bundled (pre-installed) with NodeJS.


    Follow the subsequent instructions to initialize NPM for your project:-


    1. Open a Terminal/CMD.

    2. Create a new folder/directory named “myApp”. You can use the command `mkdir
    myApp`.

    3. Navigate to this directory via the Terminal. Use the `cd` command.

    4. Type `npm init` and press Enter. (you may have to wait a few moments after).
    You will be asked a few questions; Just keep pressing enter to skip through it
    using the default options.

    5. Now use the command `echo >> index.js` to create an `index.js` file inside
    this directory.

    6. Now use the `ls` command to see the contents in this directory, notice the
    new `package.json` file in your app’s directory; This file is the central instructions
    file for the NodeJS environment, this file tells NodeJS how to execute your code.

    7. Another thing to notice is the `index.js` file, which is empty for now but
    will hold you main NodeJS source-code.

    8. Add the following code to the `index.js` file: (Linux users can use tools like
    nano, or gedit)

    ```javascript

    console.log("Hello World") // Logs “Hello World” to console

    ```

    9. Save this file.

    10. Execute the command `node index.js`. This will log Hello World to your Terminal/CMD.
    This is how we can start using NodeJS with NPM.

    11. In your project’s directory you can use `npm init` to start a questionnaire
    in your CLI, answer each question as you want, or leave the default value by pressing
    enter on each question. This will initialize NPM for your project, giving you
    a `package.json` file.


    What we have learned so far in this book is just a glimpse of NodeJS, it is far
    more powerful than even Electron. I suggest you make further effort to learn NodeJS
    even if you work front-end only.


    ## Chapter 2 – TypeScript


    TypeScript is the chemical X for JavaScript, no joke! TypeScript is an open-source
    programming language developed and maintained by Microsoft. It is basically JavaScript
    with optional static typing, and latest ECMAScript features, that means it has
    ES6, ES7, etc. built-in. It also integrates really well with ReactJS, ElectronJS,
    ASP.NET, Ruby on Rails, Expo and React-Native. If you like JavaScript then you
    will love TypeScript!


    ### Data-types


    Lets learn a little about the classifications of data-typing in programming languages.
    Remember JavaScript is dynamically typed, weakly typed, and duck typed.

    **Note**: The following definitions are loosely typed. Pun intended!


    - **Dynamically typed:-**: Means we don’t have to assign a data-type to a variable
    when we are declaring it.

    - **Statically typed:-**: Means we must assign a variable a data-type when we
    declare it.


    Dynamically typed example:

    ```javascript

    var x = 1;

    var y = " one ";

    var z = true;

    ```

    Statically typed example:

    ```javascript

    int x = 1;

    string x = " one ";

    bool = true;

    ```

    See how in JavaScript ( a Dynamically typed language ) we can just use keywords
    like `var`, `let`, and `const` to declare variables without knowing their data-types
    beforehand.

    However in the Statically typed code we have a pseudo-programming language which
    uses keywords like `int`, `string`, `bool`, etc. to declare variables which have
    fixed, presumed data-types.


    - **Strongly typed:-**: Means it is hard for data-types to interact with each
    other, and convert to one another.

    - **Weakly typed:-**: Means it’s easy to switch among data-types, and make them
    interact.


    Weakly typed example:

    ```javascript

    var x = 1;

    var y = " one ";

    console.log(x + y); //logs “1one” as a string

    ```

    Strongly typed example:

    ```javascript

    int x = 1;

    string x = " one ";

    console.log(x + y); //throws error

    ```

    See how in JavaScript ( a Weakly typed language ) we can just add a number and
    a string together, and JavaScript will join both together, then return an output
    with the data-type set to “string”, which it determined all by itself.

    However in Strongly typed section we have a pseudo-programming language which
    throws an error if we try to directly add values with two different data-types.


    Now JavaScript is also Duck typed language, which means data-types depends on
    what the data looks like! Get it?

    "If it walks like a duck and it quacks like a duck , then it must be a duck"

    What this means is that JavaScript doesn''t care what data-type a variable is
    intended to be, if it has methods of an array (like `map()`), then it must be
    an array! If it has methods of a string then it must be a string. You get the
    idea!


    To use TypeScript we need to Transpile (Translate/Compile) our TypeScript code
    in into standard JavaScript code. To do this we first need to download TypeScript,
    we can download it by using the following command:

    ```bash

    sudo npm install -g typescript

    ```

    Also note that TypeScript files have a `.ts` extension, while JavaScript files
    have a `.js` extension.

    Here the `sudo` command prefix is only for Linux users. Windows users can run
    the command `npm install -g typescript` with after opening the CMD with administrator
    rights.

    Make sure you have the latest version of NodeJS and NPM. To update NodeJS and
    NPM after installing them use the commands:

    ```bash

    sudo npm install -g npm

    sudo npm install -g nodejs

    ```

    Once TypeScript is downloaded and installed we can check it’s version number and
    verify a proper installation using the following command `tsc -v`. This command
    returns a version number like “3.6.3”.

    Once NodeJS, NPM, and TypeScript is installed and up to date, lets set up create
    a new project directory and get to work.


    ### Creating a new Typescript project


    Follow the subsequent steps to set up a Typescript project:


    1. Open a Terminal/CMD.

    2. Create a new directory named “myTS”. Use the terminal command `mkdir myTS &&
    cd myTS`.

    3. Initialize NPM with the command `npm init` and select all the default choices.

    4. Create an “index.ts” file for our TypeScript source-code. Use the command `echo
    >> index.ts`.

    **Note**: The `index.ts` file has a `.ts` extension, this file will later be transpiled
    to an `index.js` file which is the entry point of our app.

    5. Open the `index.ts` file in a code editor, and add the following Typescript
    code to it:

    ```typescript

    const message : string = ''hello world'';

    console.log(message); //logs hello world

    ```

    6. Save the `index.ts` file.

    7. Use the TypeScript-Compiler to transpile `index.ts` to an `index.js` file.
    Use the command `tsc index.ts` to do it.

    8. Use the command `ls` to see the contents of our “myTS” directory. You should
    see an `index.js` file, an `index.ts` file, and a `package.json` file.

    '
