    image to our web page, we will use the following code:<!DOCTYPE html>< html ><
    meta charset = "UTF-8" >< meta name = "viewport" content = "width=devicewidth,
    initial-scale=1" >< link rel = "stylesheet" href = "main.css" >< body ><!-- Our
    HTML code begins go here -->< img src = "cat.jpeg" /><!-- Our HTML code ends here
    --></ body ></ html >​ This code will only work if there is an image file named
    “cat.jpeg” in the same folder/directory as our web page.​ In this code the <img
    /> element places an image on our web page. The “src” attribute must be set equal
    to the name of our image.​ Not all formats of images are supported, as a safe
    bet go for jpeg, png etc.![](Image00022.jpg)​ Now let''s write a little CSS for
    our HTML:body {  background-color:#efefef;}h1 {  font-family: Times New Roman;}img
