  trans: '


    ### 2. 自定义协议

    可以将自定义协议（如 `http://`、`file://` 等）附加到你的应用中，这样任何在该协议上发起的 GET 请求都会发送到你的应用。


    ### 3. 注意

    Linux 和 MacOS 的设置可能会根据其桌面环境和操作系统版本而异，请查看它们的最新指南。


    ### 4. 注意

    请务必参考你将分发应用的目标系统的开发者文档。

    '
- fmt: "\nIn the following code (built over `electron-quick-start` scaffold) we register\
    \ a protocol arbitrarily named ‘cat ’ (I like cats!). (The following examples\
    \ will not work on some Linux and MacOS machines without additional configuration)\n\
    \n### main.js\n```javascript\nconst { app, protocol, BrowserWindow } = require('electron');\n\
    const path = require('path');\nconst protocolName = 'cat';\n\nfunction createWindow\
    \ () {\n  const partition = 'persist:one';\n\n  const mainWindow = new BrowserWindow\
    \ ({\n    width: 800,\n    height: 600,\n    webPreferences: { partition }\n \
    \ })\n\n  if (process.argv.length >= 3) {\n    mainWindow.loadFile(process.argv[2].slice(6,\
    \ -1))\n  }\n  else {\n    mainWindow.loadFile('index.html')\n  }\n}\n\napp.whenReady().then(()\
    \ => {\n  createWindow();\n  protocol.registerFileProtocol(protocolName, (request,\
    \ callback) => {\n    callback({ path: request.url });\n  })\n})\n```\n\n### index.html\n\
    ```html\n<!DOCTYPE html>\n<html>\n  <body>\n    <a href=\"cat://example.html\"\
    >myFile</a>\n    <script src=\"./renderer.js\"></script>\n  </body>\n</html>\n\
    ```\n\n### example.html (arbitrary web page)\n```html\n<!DOCTYPE html>\n<html>\n\
    \  <body>\n    <h1>This is the example file</h1>\n  </body>\n</html>\n```\n\n\
    Launch the app with `npm start`, and upon clicking the “`cat://example.html`”\
    \ URL (via the “myFile” link on our web page) a request will be made to our app\
    \ because the system is trying to visit the link `example.html` via the arbitrary\
    \ `cat://` protocol.\n\nThe visitation request is received by a 2nd instance of\
    \ our app (sort of) because it’s set to intercept the `cat://` protocol, however,\
    \ this time when our app runs with a new window, it will display with a different\
    \ web-page (the “example.html ” web page).\n\nIn the `main.js` code, on line #1\
    \ and #2 we’re importing the modules we need to work, we have the `app` module\
    \ for the required methods to work with our app, we have the `protocol` module\
    \ for the required methods to work with protocol related stuff of our operating\
    \ system, and we have the `BrowserWindow` module for method to work with our app’s\
    \ windows.\n\nOn line #3 we’ve created a variable to create a custom protocol\
    \ name (must be declare with `const`).\n\nOn #5 to #18 we have a standard `createWindow()`\
    \ function. The only new things are on #6, #11, #14, and some on #15 too.\n\n\
    On #6 we have created a persistent partition, this keeps a separator layer between\
    \ different windows of our app that are launched from the same method (`createWindow()`\
    \ in this case), and other windows with a similar nature. The `persist:` part\
    \ is not arbitrary, but the `one` part is arbitrary, hence partitions names can\
    \ go like `persist:one`, `persist:alpha`, `persist:myPart`, etc.\n\nOn line #11\
    \ we’ve given a property named `webPreferences` to our app’s window, when the\
    \ property itself has another sub-property named `partition` with value same as\
    \ on line #6. This is done by simply writing the variable name inside the curly\
    \ brackets of an object, and this way of writing is known as spreading.\n\n**Note:**\
    \ An argument vector is comprised of commands passed to a command line program\
    \ like a Terminal, in fact Terminals aren’t only for people, programs use invisible\
