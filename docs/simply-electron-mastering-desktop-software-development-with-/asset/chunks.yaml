    in the textFromClip variable, and displays it in the paragraph element we have
    in our HTML file.​ Check out more methods of the clipboard module at [https://www.electronjs.org/docs/api/clipboard](https://www.electronjs.org/docs/api/clipboard)
    , there are methods for writing HTML, Images, etc.Frozen Windows and Crash Reports​
    Generating crash reports is a very import part of desktop application development,
    and it differs dramatically from web development crash reports. Essentially, you
    can listen to the ‘crash’ event using the on listener method of window objects,
    and then write code to inquire about the nature of the crash by observing the
    state of the program from a parent process, then finally you can send the report
    to an online API you’ve developed for your app. You can even crash windows using
    process.crash() .​ Similarly we can add code to our app to listen for a ‘unresponsive’
    event using a on listener method, and then write code to reload the window using
    mainWindow.reload() , or you can first prompt the user with a dialog saying ‘relaunch
    ’ or ‘close ’. Alternatively, you can listen for a ‘responsive’ event which occurs
    when a process becomes responsive again.​ Since we can’t predict all of the possible
    errors, we need to develop a coding (alpha-numeric codes) for errors, for example
    0-A1 for main process crashing, 1-A2 for a renderer process crashing, etc. However,
    crash reports need to be coded by a Cyber security professional, weakly coded
    and generated reports might as well be sent directly to the hackers! However,
    here we won’t be covering a coding system here since its easier to use basic hash
    systems for small scale development.​ To generate crash reports you are better
    off using libraries like PLCrashReporter, in fact, check out the article at this:[https://landonf.org/code/objc/Reliable_Crash_Reporting.20110912.html](https://landonf.org/code/objc/Reliable_Crash_Reporting.20110912.html)​
    You can also use a built in electron module like the following:1  const { crashReporter
    } = require ( ''electron'' )2  3  crashReporter . start ({ submitURL : ''https://my-web-site.com/url-to-submit-report''
    })​ This method submits your report to a remote server, here you can change the
    URL to yours, and the report can simply be submitted via a get request (if someone
    visited an specific URL, then a certain error must’ve occurred).​ To receive the
    report you can use the following (recommended by electron documentation) projects
    / request management systems:https://github.com/mozilla-services/socorro(Mozilla)[https://github.com/electron/mini-breakpad-server](https://github.com/electron/mini-breakpad-server)
    (Recommended for beginners)Note: Since these are independent projects, we will
    not be covering them here. As always, always stay on top of 3 rd party management
    systems, they have their own maintenance, crashes, errors, etc.Check out more
    about crashReporter API at:https://www.electronjs.org/docs/api/crash-reporterProtocol
    Handler'
