  md: '# Manipulating Strings by Position


    Chapter 5 showed you how to use regular expressions to manipulate strings and
    the characters within them. This chapter deals with string manipulation that is
    based on substrings and ordinal positions of characters within strings.


    The primary positional manipulation functions in Perl are length, substr, chomp,
    and chop.


    The length function returns the number of characters in a string; if no argument
    is passed to the function, the $_ variable''s length is returned.


    You use substr to extract substrings from a string based on position: you specify
    a starting location and the number of characters to extract (or to leave). You
    may be tempted to use substr to parse user input, relying on the fact that it
    will be formatted in specific ways. For example, a Web URL usually starts with
    http://. You could use substr to extract the body by dropping these first seven
    characters. However, if someone mistypes the URL you may wind up with more or
    fewer characters than seven; you are often safer to use the regular expressions
    described in Chapter 5 to locate the // or some other known character combination.
    (You can also use the index function described next.)


    The chomp and chop functions are used most often to remove the newline character
    (\n) from the end of a line of user input. chomp explicitly removes a newline
    character from the end of a string if it is present; chomp removes the last character
    (whatever it is) from a string, chop returns the number of characters removed;
    chop returns the character removed. Both can be used on lists; in that case, chomp
    returns the number of characters removed from all elements in the list, and chop
    returns the last character removed from the list elements (but it removes the
    last character from all elements).'
  merge: -1
