  md: '# File Test Operators


    Perl supports a number of ways of testing attributes of files. The most general
    way uses the attributes shown in Table 8-1. You form a condition by placing the
    attribute before a file name, as in this code to test whether a file exists:


    ```

    if (eof("test"))

    ```


    # Table 8-1. File System Attributes for Perl Tests


    | Attribute | Meaning |

    | - | - |

    | - | Is a file |

    | -C | Days since last directory change of this file''s |

    | -A | Days since last access |

    | -M | Days since last modification |

    | -B | Binary file |

    | -T | Text file |

    | -t | Text device (like a teletype—TTY) |

    | -d | Directory |

    | -f | File (not directory) |

    | -s | Size of file (in bytes) |

    | -e | Exists |

    | -r | Readable |

    | -w | Writable |

    | -x | Executable (a program) |

    | -z | Zero-size file |


    You can test for end-of-file on the next read using the **eof** function with
    a filehandle, as in


    ```

    if (eof(FILEHANDLE))

    ```


    If the file handle is not supplied, the test is applied to the last file read.
    (For more, see "File Permissions and Attributes" later in this chapter.)'
