  md: '# Equality Operators


    Equality operators test that two strings or numbers are (or are not) equal to
    one another. The operators for numbers are:


    +   * == (equals)

    * != (not equals)


    The operators for strings are:


    +   * eq (equals)

    * ne (not equals)


    Two operators combine relational and equality operators. Instead of returning
    a binary result (0/1), they return a ternary result indicating whether one expression
    is less than, equal to, or greater than the other. The values returned are -1,
    0, 1, respectively.


    The comparison operators are:


    +   * <=> (comparison for numbers)

    * cmp (comparison for strings)


    As with the relational operators, be sure to remember to use the correct operator
    so that you don''t inadvertently cause Perl to convert numbers to strings or vice
    versa.'
