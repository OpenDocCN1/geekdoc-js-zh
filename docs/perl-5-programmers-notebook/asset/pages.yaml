  md: '# HTML Forms: Get Method


    Each HTML form starts with a <FORM> tag such as this one:

    <FORM ACTION="/cgi-bin/psmform.pl" METHOD=POST>


    The Form tag has at least two attributes: the action and the method.


    +   1. As noted previously, the action is the URL to which the information on
    the form is passed. It is often a Perl script.

    2. The method can be either GET or POST. It determines how the data from the form
    is sent to the URL.


    In the case of the GET method, the data from the form is appended to the URL following
    a ?. The data is sent in name/value pairs. If, for example, you have a text control
    with the name From and the Value Me, that pair is sent as

    From=Me


    Name/value pairs are separated by &. Thus, a form can be sent to a URL such as

    http://www.mydomain.com/cgi-bin/psmform.pl?From=Me&To=You


    Decoding this data is very easy using Perl''s regular expressions, you will see
    on the opposite page.


    Note that the Get method has two potential drawbacks:


    +   1. All the data is transmitted as part of the URL to which the form is sent;
    it may be visible in browser status panels.

    2. Only text data can be sent using this method.


    “HTML Forms: Post Method,” next in this chapter, for a way of avoiding these issues.'
  merge: -1
  pgno: 245
- img_proc: true
  md: "```\n#!/usr/bin/perl\nThis script reads a query string from a URL and prints\
    \ it out.\nprint <<HTMLHeader;\nContent-type: text/html\n\n<html>\n<head>\n</head>\n\
    <body>\nHTMLHeader\n\nif ($ENV{'REQUEST_METHOD'} eq \"GET\") {\n    Check to see\
    \ that you have a GET rather than a POST method\n\n    $queryString = $ENV{'QUERY_STRING'};\n\
    \    Everything following the ? in the URL is in the QUERY_STRING variable.\n\
    \    @queryString = split(/\\&/, $queryString);\n    Split the SqueryString variable\
    \ into an array @queryString using the &separator;\n    foreach $nameValue (@queryString)\
    \ {\n        For each element of the array, split it into a name and a value based\
    \ on =\n        ($name, $value) = split(/\\=/, $nameValue);\n    }\n\n    $data{$name}\
    \ = $value;\n    Fill a hash %data with the name/value pairs.\n}\n\nforeach $i\
    \ (keys %data) {\n    print \"Key:\", $i, \" Value:\", $data{$i}, \"<BR>\";\n\
    \    For each name/value pair in the hash, print it out on the HTML page.\n}\n\
