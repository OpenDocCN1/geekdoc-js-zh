  md: '# Collection Arrays


    Collection arrays are unordered collections of information. You decide what to
    store in the array, and you maintain it. It could contain student names, grades,
    temperature readings, or anything else. When you use a collection array, you don''t
    particularly care whether you are dealing with the third or 27th element of an
    array—you just take each element in turn. Collection arrays may be called unordered
    or unsorted arrays to contrast them with ordered arrays. (These distinctions refer
    only to the use to which you put the arrays; Perl makes no such distinctions.)


    When you use collection arrays, you often do something to each element of the
    collection in turn. You can use a for or foreach statement for this; the most
    common version iterates through every item in an array.


    The foreach statement lets you specify values for an array subscript; the block
    of the foreach statement is executed for each of those values. The values are
    placed into the global $_ variable, which you can then use as a subscript.


    The for statement lets you specify a scalar to be used as the array subscript;
    you specify an initial value, a terminating test, and an increment. Most often,
    you will iterate through each item of the array, incrementing the scalar by one,
    but you can iterate backwards, skip elements, and otherwise modify the iteration.'
