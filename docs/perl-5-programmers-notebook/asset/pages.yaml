  md: '# # Manipulating Strings by Substring


    The **index** and **rindex** functions let you find substrings within a string.
    These functions can be faster than using regular expressions, because they search
    for specific strings rather than for sets of characters that may have a variety
    of.


    You use **index** to search forward in a string. You supply the string in which
    to search and the substring for which you are searching. You also provide the
    starting character number at to start. If it is omitted, it is assumed to be character
    0. (You can change the numbering scheme to start from another number than zero,
    but that approach is very dangerous.)


    The **rindex** function searches backward in a string. It, too, can take an optional
    third parameter that is the character in the string from which to search backward.
    If omitted, rindex starts at the end of the string.


    Neither index nor rindex has any effect on the string you are searching; if you
    want to remove the substring that you have found, if you are parsing user input,
    remember to include error checking in your code; you have no guarantee that users
    will correctly type their entries. If you are looking for a keyword (such as password),
    you may never find it. A common error is to attempt to extract a substring (such
    as “password=”) and then to take the next characters as having a specific meaning
    (such as the password itself). If “password” has been spelled “pasword,” index
    will return -1, and your code will fail unless you explicitly check for the error
    condition.'
  merge: -1
  pgno: 123
