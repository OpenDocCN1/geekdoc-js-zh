  md: '# How Perl Looks


    Perl programs—like most programs in any language—consist of statements. These
    statements in turn are composed of terms and operators—much as algebraic formulas
    are.


    Perl is designed to make easy to quickly write and execute programs; for that
    reason, assumptions are made about missing terms and operators. These allow you
    to write what apparently are incomplete statements that nevertheless do what you
    want them to do.


    The Perl program at the right contains a variety of Perl statements. They illustrate
    Perl syntax and the types of assumptions that Perl makes about syntactic elements
    that are not provided. They also demonstrate some of the constructs in Perl that
    may look unfamiliar to you if you have used other programming languages. These
    constructs are all discussed later in this book: the purpose of this program is
    to give you a feel for how Perl looks.


    Comments in Perl start with # and continue to the end of the line. They make the
    code easier to read and can be invaluable in modifying programs long after they
    have been written. If you have a comment that spans more than one line, you need
    to put a # at the beginning of each line.'
  merge: -1
