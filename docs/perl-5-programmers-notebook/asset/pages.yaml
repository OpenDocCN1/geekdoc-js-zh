- img_proc: true
  md: '# Using Subroutines


    Subroutines—sometimes called user functions—allow you to write more sophisticated
    Perl scripts that offer much of the complexity and power of programs written in
    traditional programming languages. Subroutines are like programs in a way: you
    execute them, provide input, and receive output. In fact, many programs are converted
    to subroutines with just a few keystrokes, and many subroutines can be converted
    to programs in the same way.


    Subroutines are designed to be run from inside Perl scripts—or from inside other
    subroutines. Calling them user functions emphasizes the fact that you are in writing
    something akin to a Perl function—something like print or chop.


    When you debug a Perl script, you may encounter bugs in the code that you have
    written, but you very rarely encounter a bug within print or chop. (You may print
    out the wrong thing or chop when you shouldn''t, but those operations have been
    developed, tested, and used thousands of times—they work.)


    Designing your application to incorporate subroutines may make it easier to develop
    and to maintain, since you can take sections of code that you commonly use and
    make them into subroutines. You then use those subroutines over and again; gradually,
    they acquire the stability and reliability of standard Perl functions, since you
    test them and use them over and over.


    Good software design encourages the use of subroutines and other such packaging
    devices for code. If you write a 100-line program, you may only have to worry
    about debugging 10 of those lines if the other 90 are in one or more subroutines.


    You can place Perl subroutines into packages to make them usable by a variety
    of Perl scripts. The more a section of code is used, the more chances exist for
    bugs to emerge—and be fixed.'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'A Perl script normally executes one line at a time. The exceptions are loops
    and conditional statements (if, while, etc.). In those cases, sections of code
    may be repeated or skipped.


    ![](img/dbe145bb02591d3632fc1f12880fdd5f_186_0.png)


    ![](img/dbe145bb02591d3632fc1f12880fdd5f_186_1.png)


    When you create a subroutine, you take a section of that code out of the main
    script and place it apart—in a subroutine. When the time comes to execute that
    code, control passes to the subroutine and then back to the main script.


    ![](img/dbe145bb02591d3632fc1f12880fdd5f_186_2.png)


    You can call several subroutines—or the same subroutine several times. This possibility
    can reduce the size of your script and can modularize it to make it easier to
    develop and test. It also can allow several people to work on one project more
    easily.'
  merge: -1
