  md: '# Logical Loops


    A very common task is to execute a block repeatedly—in a loop. You may do this
    for each line of input a user types or in order to perform a calculation for each
    customer of a business. These are different types of loops: the first handles
    as many lines of input as are there—until a user quits the program. The second
    type handles a discrete number of items—one for each customer. You can distinguish
    between logical loops (those that process while something happens) and enumerated
    loops (those that handle a specific number of items).


    Logical loops contain a logical expression, which controls when the loop is terminated.
    While loops execute while the expression is not true—as soon as it is, they terminate.


    Each type of loop may have the test at the beginning or end of the loop. This
    placement matters the first and/or last time through. A while loop evaluates the
    expression and then executes the block; this action continues as long as the expression
    is true. A do-while loop does the block and then executes the expression. until
    loops work the same way—except that they execute while the expression is false
    and until it is true.


    A continue block can be placed at the end of the loop; it is executed each time
    through the loop.'
  merge: -1
  pgno: 63
