  md: '# Stopping Loops


    The next statement passes control to the bottom of the loop (preparing for the
    next iteration). The redo statement passes control to the top of the loop (repeating
    the current iteration). The last statement passes control to the first statement
    after the loop.


    You can add the name of a block to each of these statements in order to transfer
    control to the corresponding statement (first or last) of that loop rather than
    the current loop.


    If you start to develop a complicated loop structure in which you need to jump
    out of embedded loops, consider restructuring your program. Most likely, you would
    be better off using subroutines, in which the control structure is more explicit.


    Another way of transferring control is simply to use the goto statement to transfer
    control to a specific named block (which often is outside the current loop). This
    quickly produces very unreadable code and is not recommended.


    Loops are most effective when their tests are clear and simple and when their
    operations are only a few lines long (even if you have to call subroutines). Longer
    loops tend to get lost—when you look at the code, you may not even realize that
    it is part of a loop!'
  merge: -1
