  md: '# Manipulating Lists


    Three functions let you easily manipulate lists:


    +   * reverse returns a new list with the elements of a list in reverse order

    * join creates a string from a list

    * splice removes elements from an array and (optionally) adds list elements in
    their place


    The reverse function creates a new list: it leaves the order of the existing list
    untouched. However, you can assign the reversed list to the original list''s identifier,
    thus effectively reversing the list in place.


    The join function takes a string as its first argument and the elements of a list
    as its subsequent argument. It creates a string in which each element of the list
    is separated by the string. Here is an example:


    ```

    join(''followed by'', "a", "b", "c")

    ```


    produces the following:


    a followed by b followed by c


    When the string is ''/'', you can easily construct a URL.


    The splice function removes elements from an array and adds new ones in their
    place. To use the splice function, you specify a base array, a starting position.
    (optionally) the number of items to remove, and (optionally) the list of items
    to insert. Two results occur from the splice function: it returns the elements
    removed from the array, and it inserts the new elements (if any) into the original
    array.'
