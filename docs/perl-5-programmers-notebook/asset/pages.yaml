  md: '# # Using a Hash and a DBM


    If you are using the dbmopen/dbclose syntax (which is compatible with all versions
    of Perl), you open a database by calling dbmopen. Its arguments are a hash, a
    file name, and a mode (which sets the permissions for the file):


    ```

    dbmopen(\$hash, "thefile", 0666) || die "Can''t dbmopen";

    ```


    (Since dbmopen and dbclose can return an error, you should check to make sure
    that they have succeeded.)


    After a successful dbmopen, the hash that you have specified (in this example,
    \$hash) is loaded from the file that you have specified. You do not have to explicitly
    read the hash—all that work is done for you. As you make changes to the hash,
    those changes are automatically reflected in the file. (Note that this implementation
    will destroy any unsaved contents of the hash that exist before the dbmopen call
    is made. If you are reusing a hash, make certain that you have stored its data
    properly before reusing it with dbmopen).


    When you are finished, you call dbmclose:


    ```

    dbclose(\$hash) || die "Can''t dbmclose";

    ```


    Starting with Perl 5, you can use the tie/untie functions instead of dbmopen and
    dbclose. These can be a more extensible architecture and make easier using other
    file and database storage systems with Perl. Consult your local system administrator
    to find out what options are available to you. However, you can function quite
    easily with the dbmopen/dbclose syntax in most cases.


    Note that DBM does not implement file features such as locking. In multi-user
    and high-volume situations, you may need to implement your own file reading and
    writing routines rather than using DBM.'
  merge: -1
  pgno: 221
