    Files are stored in disks and diskettes as well as on removable media such as
    tape cartridges. A single file on a disk may be located in a variety of sections
    of the disk. The operating system takes care of reading and writing it.


    Because each operating system handles the reading and writing of files for its
    own internal formats in its own way, you may not be able to read files from one
    computer on another. However, once the file has been assembled by the operating
    system, it can be read by any version of Perl on any operating system.


    ```

    10101000011101100110011010101000011101100110101010101000101

    ```


    The data in the file is in binary form—bits with values 0 and 1. However, most
    programs read it as characters—groups of 8 bits that represent characters such
    as A, %, or w. A pointer indicates the current position in the file: the place
    at which the next read or write will take place. The pointer is advanced after
    every read or write.


    | NAME | ADDRESS | CODE |


    Data in the file can consist of a long string of text—as in a word processing
    document. It also may be divided into logical sections. A common division is to
    identify fields such as "Name," "Address," and "Code." These are repeated in records
    for different people or other observations. In this example, a record has three
