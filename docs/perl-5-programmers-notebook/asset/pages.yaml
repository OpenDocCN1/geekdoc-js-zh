- img_proc: true
  md: '# # Using Formats for Reports


    Print statements output information from a Perl script in a format that is selected
    by Perl to best fit the data. You use the printf statement to format data according
    to your needs; and the sprintf statement is used to format data and place it in
    a string, rather than sending it to a file.


    Formats are used in conjunction with the write function; they also let you ouput
    data in a formatted manner; however, they are specifically designed for the needs
    of reports that produce repeated items—that is, columns of repeated data rows.


    Consider the two main aspects of using formats for reports:


    +   1. You define a format. It describes the layout that you want for the data.
    It also associates specific variables with locations within the format.

    2. For each set of data to be printed out using the format, set the values to
    be printed out and then call the write function.


    A format is defined with the keyword format; it is followed by a format name.
    By convention, the name of the format is the same as the filehandle for which
    it will be used in most cases. The line ends with a =. The definition of the format
    continues on subsequent lines. It is terminated with a line containing only a
    period. A format that prints out "This is the title" would look like this:


    ```

    format STDOUT =

    This is the title.

    ```'
  merge: -1
