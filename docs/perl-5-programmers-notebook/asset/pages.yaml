  md: '# # Lists


    Lists are ordered sets of scalars. An array consists of a list that is assigned
    to the array variable. The list itself is represented by zero or more scalars—variables
    or expressions—enclosed in parentheses. You can assign a list to an array variable.
    Thus, the following lines used in examples earlier in this chapter can be rewritten
    to use a list:


    ```

    $animals[0] = "cat";

    $animals[1] = "bird";

    $animals[2] = "fish";

    $animals[3] = "sloth";

    ```


    With a list, the code looks like the following:


    ```

    @animals = ("$cat", "bird", "fish", "sloth");

    ```


    Note that in the first case you are assigning scalars—such as "cat" to scalar
    variables—such as Animals[0]. In the second case, you are assigning a list to
    an array variable—@animals. (As previously noted, this difference is the distinction
    between the scalar context and the array context.)


    Within a list, you can use the list constructor function .. to indicate a range
    of values. The constructor function applies only to numbers; it increments (never
    decrements) the left-hand number until the right-hand value is reached.


    ```

    2..7

    ```


    expands to


    ```

    2, 3, 4, 5, 6, 7.

    ```


    When a list contains expressions, the list is used. If a list is assigned to an
    array variable, the results of any expressions (not the expressions themselves)
    are placed in the array.'
