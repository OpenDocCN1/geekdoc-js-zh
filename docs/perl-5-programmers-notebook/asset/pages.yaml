  md: '# # Redirection


    You can redirect users from one URL to another automatically. You do so by placing
    the following in the HTML for the first page (from which you want to redirect
    people):


    Location: http://www.newdomain.com/newlocation.html


    (Substitute the appropriate URL for the page to which you want to redirect people.)


    Note that two returns must follow the Location: line. Nothing is printed; rather,
    the new page is loaded.


    Some redirection is accomplished using server-side includes: in those cases, a
    page is displayed announcing the redirection; the server-side include then does
    the work.


    You can use redirection in many ways. If you use browser-specific features, you
    can have different pages for different browsers. You can also have different pages
    for different versions of browsers. The most common uses of redirection are either
    unconditional—everyone goes to the same place, or they are based on environmental
    variables, as the example on the opposite page shows.'
  merge: -1
  pgno: 237
- img_proc: true
  md: "```\n#!/usr/bin/perl\n\n$browser = $ENV {'HTTP_USER_AGENT};\nn# This is the\
    \ browser user is using. It should contain a version number.\nif ($browser =~\
    \ /Mozilla\\4/) {\n    # This tests for Netscape(\"Mozilla\"). Note the escaped\
    \ slash: it is checking for version 4. The string that is returned from HTTP_USER_AGENT\
    \ will be of the format:\n    Mozilla/4.04 (Macintosh; U; PPC)\n    print \"Location:\
    \ $URLforNetscape4\\n\\n\";n    exit 0;\n    # This redirects the user to a location\
    \ specifically for Netscape 4 and exits.\n}\n\n$IPAddress = $ENV {'REMOTE_ADDR};\\\
    n# You can also redirect based on the user's IP address (but remember that\n#\
    \ proxy servers may distort this address).\nif ($IPAddress =~ /205./) {\n    #\
    \ This tests for an address within the 205.xxx.xxx.xxx domain. (Note that 205.\n\
    \    # must be at the start of the string.) The string that is returned from\n\
    \    # REMOTE_ADDR will be of the format:\n    205.231.148.11\n    print \"Location:\
    \ $URLforASpecificDomain\\n\\n\";n    exit 0;\n    # The script exits here after\
    \ the redirection.\n}\n\nprint \"Location: $defaultURL\\n\\n\";\n# You must have\
    \ a default URL or an else so that the user goes somewhere.\n```"
