  md: '# # Basic Format Control Characters


    The characters in a format control string—the first argument in the list that
    follows `printf`—are inserted in the output. Format controls start with %. Thus,
    if you want to insert the % character, you must use %.


    Following the % of a format, you can specify a variety of formats. Each format
    introduced by a % is applied in turn to an element of the list that follows `printf`.
    In the simplest case, a single letter is used to determine how the corresponding
    element is to be formatted. Note that %s provides the simplest formatting (see
    Table 7-1).


    Table 7-1. Formats for List Elements


    | Sequence | Meaning |

    | --- | --- |

    | %s | converts the list element to a string as best it can |

    | %d | a signed integer, in decimal |

    | %i | a synonym for %d (old style) |

    | %u | an unsigned integer, in decimal |

    | %o | an unsigned integer, in octal |

    | %x | an unsigned integer, in hexadecimal |

    | %X | like %x, but using uppercase letters (old style) |

    | %e | a floating-point number, in exponential (scientific) notation |

    | %E | like %e, but using an uppercase "E" (old style) |

    | %f | a floating-point number, in fixed decimal |

    | %F | a synonym for %f (old style) |

    | %g | a floating-point number, in %e or %f notation, with choice determined by
    Perl according to space |

    | %G | like %g, but with an uppercase “E” (if applicable) |

    | %c | prints the ASCII character for the value in the list element |'
  merge: -1
