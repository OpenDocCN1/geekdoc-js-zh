  md: '# Passing Data to a Subroutine


    You''ve seen how to keep variables in a subroutine from interfering with those
    in your main script, but sometimes you want data to move—in a controlled way—between
    the two. You can pass arguments to a subroutine by including them in parentheses
    after the name of the subroutine when you invoke it:


    ```

    calculateArea ($length, $width);

    ```


    (Note that unlike some other programming languages, you do not have to include
    the arguments in the subroutine definition or declaration.)


    The variables that you pass in the subroutine invocation are placed in an array
    called @_; its elements are $[0], $[11], and so forth. Each subroutine has its
    own @_ array, so you don''t have to worry about arguments to one subroutine being
    sent to another.


    Inside the subroutine, you can use the elements of @_ as you see fit. If you modify
    them, the variables in your main script are modified, too. (This process is referred
    to as **call-by-name** or **call-by-reference**.) However, if you copy any elements
    of @_ into local variables within the subroutine, the variables in your main script
    are not modified—only your local copies are. (This process is referred to as **call-by-value**.)


    Note that you enforce these distinctions. You can make some changes to the @a
    array and copy data to local variables in other cases. Beware, however, of confusing
    yourself and other programmers who follow after you!'
