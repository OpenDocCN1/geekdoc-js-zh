  md: '# Stack Arrays


    Stacks and queues are traditional computer language structures that involve ordered
    arrays—but only the first (or last) items matter. Stacks can have their “top”
    at either end of an array: you can insert/remove items either at the first element
    of a stack or at the end of the array. It basically doesn''t matter, as long as
    you are consistent.


    Stacks are commonly used in parsing languages—such as Perl. They also can keep
    track of recent events—such as a browser''s history list. Each time you visit
    a new site, that URL is pushed onto the top of your browser''s history list. When
    you click the Back button, the browser''s history list—is popped back one item,
    and the browser goes to the previous page. (Like all arrays, the history list
    can also be used in ways other than a stack: when you look at a list of all previously
    visited pages, you are looking at the history list as an ordered array—ordered
    by visit sequence.)


    Since stacks are such a common part of computer system designs, Perl provides
    four language constructs to manipulate them. The constructs are paired: **push**
    and **pop** operate on the back of the array; **shift** and **unshift** operate
    on the front.


    +   1. `push` places an element at the back of the array, lengthening it by one.

    2. `pop` is the reverse—it removes the last element.

    3. `shift` places an element at the front of the array, lengthening it by one.

    4. `unshift` is the reverse—it removes the first element.


    If you are using Perl to manage a stack, you use either push or shift and unshift;
    do not mix push with unshift unless you are certain that you want unstacklike
    behavior.'
