  md: '# Reporting Input/Output Errors


    Input/output functions can fail for a variety of reasons; you should always check
    their results before continuing. This advice applies to every i/o operation that
    you perform—from opening a file to closing it.


    Many Perl programmers use the || (or) operator together with the warn or die function.
    If the || and warn/die follow the i/o statement, it will not be executed if the
    i/o statement succeeds. (The reason is that || executes only until the result
    is known: in the case of ||, if either side is true, the result is true. Thus,
    if the i/o statement is first and it is true, no reason exists to execute the
    warn/die statement.)


    You can report the actual error condition using the global variable $ in the text
    of the warn or die function. Furthermore, you can control whether or not an error
    message with a line number in your script is printed out: if your die/warn message
    ends with a newline character (\n), no such information is printed out. Otherwise,
    it is.


    Although this way of handling the situation is neat, it assumes that your Perl
    script is running interactively. Particularly in the case of scripts that are
    used in conjunction with Web pages, interactivity is not always the case. (The
    user interacts with the Web server, but the Web server software runs the Perl
    script.)


