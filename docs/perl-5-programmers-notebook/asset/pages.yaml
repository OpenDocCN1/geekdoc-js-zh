  md: '# Relational Operators


    Relational operators compare two values (string or numeric). They return a logical
    result (0/1), which you can use as a term in a logical expression. Two sets of
    relational operators exist—one for use in comparing numbers and the other for
    use in comparing strings.


    The four numeric relational operators are familiar algebraic symbols:


    +   * < (less than)

    * <= (less than or equal to)

    * > (greater than)

    * >= (greater than or equal to)


    The string relational operators are:


    +   * lt (less than)

    * le (less than or equal to)

    * gt (greater than)

    * ge (greater than or equal to)


    Remember that Perl automatically converts values to the types needed by the operators;
    thus, if you use a string relational operator to compare two numbers, Perl converts
    the strings to numbers. Usually this action gives a result other than what you
    were expecting. No error is generated if you use the wrong type of operator; for
    Perl, a wrong type never occurs.'
  merge: -1
  pgno: 41
