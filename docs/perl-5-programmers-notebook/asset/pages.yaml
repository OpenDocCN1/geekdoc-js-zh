  md: '# Sending Output to Users: Locally


    The **print** and **printf** functions let you send output to users. Normally,
    this goes to the same computer from which the user executes the Perl script. (You
    can also use Perl scripts to generate Web pages; that use is described next.)


    Both print and printf take a list of arguments—the data to be printed out. The
    difference between them is that print uses default formatting for the data; printf
    uses the first argument as a format control string. This lets you define spaces,
    the number of digits on numbers, the length of strings, and so forth. (More complex
    formatting can be done using the write function and formats.) Format control characters
    start with %. Anything else within the format control string is interpreted literally—it
    is simply printed out.


    As with all functions that take lists of arguments, that list can be enclosed
    in parentheses or not, as you choose; in some cases (such as lists that start
    with a parenthesized argument), ambiguity exists and you will need to be careful.
    If Perl finds a parenthesized argument as the first element of a non-parenthesized
    list, it interprets that argument as a list and ignores the rest of the line (remember,
    Perl tries not to fail).


    If you are used to other programming languages, you will probably parenthesize
    the argument list. Also, if you intend to become used to other programming languages
    (if you are a student), parenthesizing the argument list is a good habit to develop.


    The **sprintf** function is similar to printf. However, instead of printout output
    to a device such as a computer monitor, it formats the output into a single string.
    You can then store that string or send it as part of an e-mail message.'
