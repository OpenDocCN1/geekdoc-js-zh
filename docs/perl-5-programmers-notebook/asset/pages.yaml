  md: '# Variable Names


    Perl variables start with special symbols that identify the type of the variable.
    All scalars (simple values) start with \$. Arrays—ordered collections of scalars—start
    with @. Hashes—which are associative arrays that use keys to identify their elements—start
    with %. (Arrays and hashes are discussed in Chapter 4.)


    Each type of variable has its own namespace—which simply means that the names
    of all scalars are stored separately from the names of hashes and arrays. Thus,
    you can have a scalar called \$name; it is totally separate from an array called
    @$name.


    Variable names can consist of letters, digits, and the underscore character. They
    may also include special characters—like ^ or &; however, these variable names
    can be only one character long, and most of them are reserved for use by Perl.


    Variables are created when you first use them—you do not have to declare them.
    Thus, if you accidentally create a new variable, Perl will not warn you about
    it, since that is a perfectly normal and legal thing to do (from Perl''s point
    of view).


    As with all programming languages, use meaningful names for your variables. When
    you come back to your program, remembering what $last_pay_period means is much
    easier than remembering what $lpd means.


    Many programmers use several words in creating a variable name—as in \$last_pay_period.
    For readability, you should separate the words with underscore characters or by
    using embedded capitalization—as in \$PayPeriod. Remember, the goal is legibility.


    Finally, note that the contents of a variable are determined by its use. You implicitly
    create a numeric scalar by assigning a number to it; a string scalar is created
    when you assign a string to it'
  merge: -1
  pgno: 17
- img_proc: true
  md: '```

    #!/usr/bin/perl


    $title = "Perl Programmer''s Notebook";

    This is a scalar variable named title.

    title = "Perl Programmer''s Notebook";nThis line of code will not compile—there
    is no symbol before title to indicate

    whether it is a scalar, array, or hash.


    @title = "Perl Programmer''s Notebook";nThis variable is an array; it is totally
    separate from the Title scalar shown

    above. If you set an array to a single element, the first element (zero) of the

    array is set to that value. This is a typo in Perl—you may mean to use a sc-lar,
    you have actually created an array and set the 0-th element to the

    text.

    $title[1] = "Rhapsody Developer''s Guide";nThis is how you set an element of an
    array to a value.

    print @title;

    When you print out the array, both elements will be printed.

    $title_ = "Cyberdog";

    Here is something else to watch for: variable names that end with an under-score
    are often misread.


    $* = 15;


    $^ = 99;


    $^* = 99;

    Variables that contain characters other than letters, numbers, and the-underscore
    character are limited to a single character (in addition to the symbol at the
    beginning. The first two of these lines are legal; $^* will not compile.

    ```'
