  md: '# # Sending Mail with a Perl Script


    On many Web servers, you can use a mail program to send e-mail. A typical use
    would be to log guest book registrations or other activity on your site. As Chapter
    13 showed, you can capture information from HTML forms and store it in files or
    DBMSs. But what if you want to allow people to ask questions or send you mail?
    One way to do so, course, is to use a URL on your Web page that relies on a user''s
    browser to send e-mail. Such a URL is of the form:


    ```

    mailto:yourname@youraddress.com

    ```


    (Note that no / characters are in a mail URL.)


    Another way is to create a form that lets people send e-mail to you. The advantage
    of using an HTML form is that you can use all the error-checking described previously
    to make certain that people provide their name, the subject for a question, and
    any other required information that you specify.


    Then the only problem is sending the mail. The solution is to write a Perl script
    such as the one on the opposite page. It relies on a mail program found on many
    Web servers; it is called SENDMAIL. (In Windows, you need a command-line mail
    program.) This Perl program is designed to be run as an action in a form that
    uses the POST method. (See Chapter 13.)


    The only new feature that you use here is a filehandle that is associated with
    a process (a program) rather than a file. If you place the | character before
    the name of a program, output from the filehandle will be sent to that program.
    If you place a | after the name of a program, output from that program will be
    sent to your filehandle; you can read it as you would read data from a file.


    The program will be launched automatically; after you close the file-handle, the
    program will be terminated.'
  merge: -1
  pgno: 261
