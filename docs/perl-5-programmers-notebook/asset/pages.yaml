  md: '# Character Manipulation


    The functions in this section allow you to manipulate characters in a variety
    of ways by combining (concatenating) them and encrypting them.


    In Perl, the concatenation operator is the dot (.). (You may be used to other
    languages in which strings can be concatenated with the + or characters; others
    use an explicit concat function to combine strings.)


    If you want to concatenate a string several times onto itself, you can use the
    x operator to specify the number of times the string is to be concatenated. Thus,
    if $aString="abc","aString x 3 is "abcabcabc."


    Another form of character manipulation is encryption. The crypt function uses
    the computer''s standard encryption routines to encrypt a string. (Note that different
    computers may use different encryption mechanisms. The crypt function takes two
    arguments: the string to be encrypted and a two-character string called the salt.
    The salt and the string are passed to the system''s encryption routines; you get
    back a string of standard length in which the first two characters are the salt
    and the remaining characters are the encrypted string. You can store this string
    for future reference.


    If someone types in the string again, you can use the first two characters of
    the previously-encrypted string as a salt to produce a new encrypted string. If
    the two strings that have been entered are the same, the two encrypted strings
    will match (provided that the salts match—a result that will be the case if you
    use the first two characters of the encrypted string). This is one-way encryption;
    you cannot find out what the original string was. You can, however, use this process
    to see whether the string a user enters is the same as a string previously entered
    (such as a password).'
