  md: '# Creating and Using Modules


    Creating subroutines lets you reuse code that can be written, tested, and debugged
    once. In the examples shown so far in this chapter, the subroutines have been
    in the same file as your Perl script. This placement limits their reusability.


    You can create modules in which you place subroutines; these modules are in their
    own files. In this case, the modules with their subroutines are much more easily
    reused from script to script.


    The require keyword lets you import a file into your script as it runs. If you
    specify a file name (such as mysubs.pl), that is the file it looks for; if you
    do not specify a prefix, .pm is assumed (that is, mysubs is interpreted as mysubs.pm).


    The use keyword is similar to require, but it is more restrictive. The file name
    must end in .pm. More importantly, the import occurs during compilation—the scanning
    of the script that occurs before it runs.


    Perl searches the directories in the include array—@INC—to find the file. @INC
    is built automatically when you run Perl. You can add to it as you fit. The most
    common way to add to it is to use this code:

    unshift (@INC, "yourdirectory");


    This adds yourdirectory to the include array. Of course, this can make your code
    less portable if you use a directory that is not on the computer on which it is
    run. You are safest to use standard Perl directories or the present working directory
    (where your basic script is).'
