  md: "# Continuing to Get Input from Users (I)\n\nYou can construct loops to get\
    \ input repeatedly from the keyboard. Of the two types of loops, one uses <STDIN>\
    \ in a scalar context, and the other uses it in a list context.\n\nIn the scalar\
    \ context, you create a while loop that executes as long as <STDIN> returns a\
    \ line of text. The structure for such a loop is as follows:\n\n```\nwhile (<STDIN>)\n\
    {\n    code here\n}\n```\n\nWhen input is terminated (by ctrl-Z on a PC, ctrl-D\
    \ on Unix, or by command-- on a Macintosh), STDIN is not defined and the while\
    \ statement is false; control passes to the next statement after the loop. (You\
    \ can also use this to read from a file—see Chapter 8. In such a case, the physical\
    \ end-of-file marker terminates input.) Another way of terminating the loop is\
    \ to test for a certain input (such as the word “quit”) and to exit the loop with\
    \ the last statement.\n\nThe lines of text returned from <STDIN> have the newline\
    \ character at the end of each line. The chop function is used to drop that character.\
    \ As a result, the while loop almost looks like this:\n\n```\nwhile (<STDIN>)\n\
    {\n    chomp;\n    ... code here\n}\n```\n\nNote that by default <STDIN> places\
    \ the line of text in the $_ variable and chop acts on the same $__variable."
