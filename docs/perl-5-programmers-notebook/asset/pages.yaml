  md: '```

    #!/usr/bin/perl

    ```


    ```

    $aScalar = 17;

    This statement assigns a number—17—to aScalar.

    $newline = "\n";nThis statement assigns a string—consisting of the newline control
    character—nto Snewline. When you print Snewline, a return is generated; the text
    that follows Snewline will be on a new line.

    ```


    ```

    print $aScalar, $newline;

    This statement prints our aScalar--17—followed by Snewline.

    ```


    ```

    print $ascalar, $newline;

    Capitalization matters in Perl! And undefined variables are treated as blanks
    when printed. This statement prints a blank--aSScalar is not the same as aScalar--followed
    by Snewline. Remember when you''re tearing your hair out. (Also use the Perl -w
    warning flag to catch cases like this.)

    ```


    ```

    @array = (1,2,3);

    This is an array—note the instead of the scalar''s S. The values 1, 2, and 3 are
    assigned to the array.

    ```


