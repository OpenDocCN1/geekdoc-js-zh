  md: '# Logical Expressions


    Logical operators such as and & | work on logical terms—variables, values, or
    expressions that evaluate to true (1) or false (0). Sometimes these are constants
    or simple variables, but often they are logical expressions. These logical expressions
    often consist of string or numeric scalars that are combined into a logical test.
    In turn, the logical terms are used by logical operators.


    Thus, the numeric scalar $numberOfClients can form part of a logical term such
    as


    ```

    $numberOfClients > 1000

    ```


    or


    ```

    $numberOfClients <= $clientLimit

    ```


    Logical terms are of three sorts:


    +   1. Functions that return a logical (1/0) result.


    +   2. A unary operator (!), which inverts the logical value of a variable, value,
    or expression. It is like the unary – operator, which inverts the sign of a number.
    It is equivalent to NOT in some computer languages. (In some languages, NOT is
    implemented as a function.)


    +   3. Common relational operators such as < and >, combine scalar numeric or
    string values to produce a logical result. (They differ from the logical operators
    discussed previously in that the logical operators combine logical operators to
    produce a logical result. The relational operators operate on scalar numeric or
    string values to produce logical results.)'
  merge: -1
