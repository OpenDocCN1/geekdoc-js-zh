  md: '# If/Else and Unless Blocks


    Simple statements can have if, unless, while, and until modifiers appended to
    them. Blocks can be used in if/else constructs; these are common to many programming
    languages. You may know them as "if statements."


    You need to include two required components in if statements:


    +   1. A logical expression that is evaluated.

    2. A block that is executed if that expression is true.


    A third component may be present—an else block that is executed if the expression
    is false. You may nest if statements within one another.


    A common structure has if statements appearing in the else block to provide a
    nested set of tests. Perl provides the elsif keyword.


    The unless statement is the reverse of an if statement. In the unless statement,
    the logical expression is evaluated, and the first block that follows it is executed
    if that expression is false. An else block (if it is present) is executed only
    if the expression is true.'
  merge: -1
