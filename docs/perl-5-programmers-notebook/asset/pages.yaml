- img_proc: true
  md: '# Working with Directories


    In this chapter, you have seen how to manipulate files and how to set and test
    their attributes. On most file systems, directories (folders) are implemented
    as if they were files. You can access directories using a set of special functions.
    You may never need to use these functions, but they can be useful if you write
    a Perl script that needs to access all files in a directory (to print them, print
    their names, change their permissions, and so forth). Furthermore, you may want
    to change the default directories with which Perl works. These functions help
    you to do so, too.


    You use the opendir function to open a directory; it is similar to the open function
    for files. Instead of a filehandle, create a dirhandle. After you are finished
    with a directory, you use closedir to close it. In between, you can use these
    functions:


    +   * Use readdir to read the name of a file from a dirhandle. If you assign the
    result of readdir to an array or list, all files in the directory will be returned.

    * Use telldir to find the position within the directory of the next entry to read.

    * Use seekdir to change the position within the directory for the next read.

    * Use rewinddir to position the directory to the beginning (as it is just after
    having been opened).


    You can manipulate directories as well, although you normally need special privileges
    from your system administrator to do so:


    +   * Use mkdir to create a new directory.

    * Use rmdir to remove an existing directory. (Note: the directory must be empty
    before you remove it.)


    Finally, you can set the directory that Perl uses by default for the files it
    reads and writes.


    +   * Use chdir to change the default directory.'
  merge: -1
