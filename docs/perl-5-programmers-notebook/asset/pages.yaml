  md: '# Manipulating Hashes


    Five functions let you easily manipulate hashes:


    +   1. **Each.** This function returns a key/value pair each time it is called.
    As always with hashes, the order in which the key/value pairs are returned is
    not under your control. For each hash, Perl maintains an iterator that is adjusted
    each time you call each, so that you get each pair in turn.


    +   2. **Keys.** This function returns an array consisting of all the keys in
    a hash (the odd-numbered values). When you call the keys function, the hash''s
    iterator is reset to 0 after the call.


    +   3. **Values.** This function returns an array consisting of all the values
    in a hash (the even-numbered values). Like keys, it resets the hash''s iterator
    after it is called.


    +   4. **Exists.** This function returns a true/false value indicating whether
    a hash key exists. The hash key is specified as a scalar using curved brackets,
    as in


    ```

    if (exists ($theHash {$theKey}))

    ```


    +   5. **Delete.** This function deletes a key/value pair from the hash. You specify
    only the key, using the same notation as for the exists function:


    ```

    delete ($theHash {$theKey})

    ```'
