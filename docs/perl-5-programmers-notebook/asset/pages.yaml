  md: '# Splitting


    You can use regular expressions to match strings of characters and single characters
    within an expression. With the split function, you can easily parse a string of
    characters.


    You need to do this task when you are decoding a string of text that is entered
    as a command. This is very common in a command-line environment; it is less common
    with graphical user interfaces.


    Another case in which you may need to do this is in parsing a URL. (The example
    on the opposite page shows how to do this.) URLs are strings of characters separated
    by slashes and dots (with a colon thrown in at the scheme). They may contain a
    search part that follows a ?—the search part is used to pass variables to a search
    engine, database, or application server. Standards provide for search parts to
    consist of named variable of the form"


    ```

    myVariable=myValue

    ```


    The variables are separated from one another by &.. Thus, you can find each variable
    in a search part by splitting it as follows:


    ```

    @myVariables = split (//, $myVariables);

    ```


    A regular expression can contain a set of characters enclosed in ]. The set /&
    is interpreted as any of the characters in the set. Thus, /& consists of the character
    &; /[&:||] consists of the characters, :, and |. Any one of these characters can
    match the test string. When you construct a set of characters, you can use the
    ^ to mean "not.\ Thus, [^0-9] consists of all characters except 0–9. (Note that
    although the set of characters may consist of more than one character, the match
    is to a single character in that set, unless other options have been set.)'
