  md: '# Continuing to Get Input from Users (2)


    In the previous example, input is read from the user until a specific string ("quit"
    in this case) is entered. That is a good interface to use for an interactive application.
    For example, if you want to allow users to experiment with different inputs, you
    have no way of knowing how many items need to be processed. (In fact, if you are
    experimenting with Perl''s character and string manipulation routines, you may
    want to create a script and use the lines that you want to test instead of the
    vowel-capitalizing code.)


    In other cases, the amount of input is known in advance. This is akin to traditional
    batch data processing. You can use <STDIN> to create an array in which each element
    is a line of input. Then you can process the elements of the array from start
    to finish without requiring a special code to stop.


    If you compare this example with the previous one, you will see that it is much
    shorter. You can combine both methods of processing. You could read all the data
    into an array (as in this example): as you process each line, you might want to
    check for a certain code (like "quit") and terminate processing as in the previous
    example.


    Alternatively, you could read the data into an array and use a different code
    to skip processing certain lines. If you were writing a Perl processor, you would
    use the next command to skip lines starting with #-comments.


    In the case of large amounts of data, reading it all into an array increases the
    memory requirements of your program: all data must reside in memory, rather than
    just one line at a time. In most cases, this requirement is not a concern. (Even
    handheld devices have more memory than you would suspect.) The flip side of this
    is that reading in one line at a time requires the user to be present throughout
    the program''s execution. Again, this is normally not a concern with Perl scripts,
    but it can matter in large-scale applications.'
