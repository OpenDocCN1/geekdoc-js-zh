  md: '# Statements


    Perl statements may be simple or compound. When they are compound, they are enclosed
    in { } and are referred to as blocks. Note that unlike some other languages, simple
    and compound statements are not interchangeable. A simple statement surrounded
    by { } is a block and can be used in an if statement; a simple statement itself
    cannot be used in an if statement.


    A statement often includes assignment of a value to a variable, but it may not
    need. Thus,


    ```

    $y = 2;

    ```


    is a Perl statement, just as


    ```

    print $y;

    ```


    is a statement.


    Statements may be followed by any one of these four modifiers, each of which must
    in turn be followed by a logical expression:


    +   1. if

    2. unless

    3. while

    4. until


    Note that the first two of these modifiers are evaluated once (just as you would
    expect if you read them aloud). While and until create loops. Unless you modify
    the condition that is tested in the expression, they will execute indefinitely.'
