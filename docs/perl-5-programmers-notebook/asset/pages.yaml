  md: '# Perl Programming


    # PERL 5 Programmer''s Notebook


    # "Show me the code!" The easy, visual approach to PERL5–for the Web and beyond.


    Finally, there''s a book that presents PERL 5 the way you want to learn it—from
    real, working scripts! See it for yourself!


    ```

    #!/usr/bin/perl

    $title = "Perl Programmer''s Notebook";

    # This is a variable named title

    $title = "Perl Programmer''s Notebook";

    # The Perl code is not strange; there is no symbol before title to indicate whether
    it is a scalar, array, or hash.

    @array = ("Perl Programmer''s Notebook",

    # This is an array, which is similar to a scalar but contains multiple elements
    (elements) of

    the array. If you assign a value to it, Perl grows the array to that size—

    but just has automatically created an array and the 0th element to be

    $array[0] = "Shapeless Developer''s Guide";

    # This is how you set an element of an array to a value.

    print @array;

    # When you print the array, all elements will be printed.

    $score = "Shapeless";

    # There is something to watch out for variable names that end with an under-

    score

    $score = 15;

    $score = 99;

    # Variables that contain characters other than letters, numbers, and the under-

    score are limited to a single character (in addition to the symbol at

    the beginning). The Perl of these lines are legal; they will not complete.

    ```


    +   - Every example is a complete, working example


    +   - Syntax is complex.


    +   - Each line is annotated so you can see what it means and how to change it
    for your needs.


    The PERL 5 Programmer''s Notebook design makes it essentially handy to work with
    you''re programming. It''s not just convenient; it''s comprehensive, and organized
    to build your expertise one step at a time. Best of all, it covers all the PERL
    5 concepts and scripting techniques you need to know! You''ll love it all, and
    more,


