  md: '# Writing to a File


    You have two ways to write to a file. The first you already know: you can use
    the print and printf functions. You also have a write function: it is used to
    generate reports in conjunction with formats. They are discussed in Chapter 10.


    The read and write functions can work smoothly together: write out data and then
    read it in. They both are sensitive to character positions. So you can use write
    to format next columns of output and read (with its optional starting position
    fourth argument) to interpret the data easily.


    Print and printf are less sensitive to character positions. You can format parts
    of the output using a format string and printf, but for formatting is primarily
    focused on how the data is exported and how many decimal positions are used. Lining
    up columns is not always easy with print and printf.


    Similarly, reading by assigning a record to a scalar (as in $MYHANDLE>) lets you
    easily manipulate the input with character and string manipulation routines. You
    can search for commas, space, quotes, and so forth and then decode the text between
    them. This approach is different from picking up, for example, the 8 characters
    starting in position number 54.


    When you open a file for output, place a > at the beginning of the file name.'
