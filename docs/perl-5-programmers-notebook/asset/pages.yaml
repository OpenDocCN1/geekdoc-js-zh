  md: '# Logical (Binary) Operators


    Logical operators perform binary arithmetic on values. Unlike common, decimal
    arithmetic, which has ten values (0 through 9), binary arithmetic has only two
    values—true and false. (Perl uses 1 for true and 0 for false).


    The basic logical operators are AND and OR. AND combines two logical values; if
    both are true, the result is true. OR also combines two logical values; if either
    is true, the result is true. The less-used XOR operator is true if the two values
    are different (one true, one false); it is false if they are the same (either
    true or both false).


    Most of the time, you don''t need to worry about the intricacies of logical arithmetic.
    However, in two cases, you may need to delve deeper. In the first, you may need
    to know that the operator works on all the bits within the value. Although you
    may think of your scalar requests as having two possible values—true or false—it
    contains a number of bits. The right-most bit is set to 0 or 1; only the right-most
    bit is normally examined in an if. If some of the other bits have values, the
    logical operation will include those values. You can demonstrate this effect if
    you AND two strings together and then examine the result (the right-most bit).


    The other case in which you may need to know a little more is in the use of shortcut
    operators. Arithmetic operations may contain embedded expressions. To evaluate
    the full expression, all of the parts of it need to be evaluated. However, in
    the case of logical operations, sometimes evaluation can cease. For example, if
    any term in an AND is false, the expression must evaluate to false. If you use
    a shortcut operator, as soon as the result of the expression can be determined,
    evaluation ceases, and if you have an embedded assignment statement, it may not
    be executed.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'The AND operators are & (normal) (shortcut), and (the word). For expression
    such as x & y, find the value of x in the first column; then find the value of
    y in the top row. The intersection is the result.


    As with Perl operands, each expression can itself be a statement. Thus, instead
    of x & y, you may have x & ($y = $z | 1). If you use the shortcut operator (&&),
    Perl may not evaluate the second part of the expression ($y = $z | 1) if the result
    would not matter. You cannot rely on Perl executing or executing the right-hand
    part of the expression when you use shortcut operators.


    # AND — &&


    | | 0 | 1 |

    |---|---||

    | 0 | 0 | 0 |

    | 1 | 0 | 1 |


    The OR operators are | (normal) and || (shortcut).


    # OR — ||


    | | 0 | 1 |

    |---|---||

    | 0 | 0 | 1 |

    | 1 | 1 | 1 |


    The XOR operator is ^. No shortcut exists.


    # XOR — ^


    | | 0 | 1 |

    |---|---||

    | 0 | 0 | 1 |

    | 1 | 1 | 0 |


    Note: if you are trying to figure out which operator to use, diagram your desired
    results in a table and see which one matches.'
