  md: '# Environment Hash


    The %ENV hash is maintained by Perl with information about the environment in
    which the script is running. This information changes depending on the context.
    For a simple Perl script running on a personal computer, you will find at least
    three environment entries in the hash. They are listed in Table 15-1.


    # Table 15-1. Perl Environment Variables


    | Variable | Meaning |

    |---|---|

    | TMPDIR | The temporary directory for working storage. |

    | PERL5LIB | The directory in which Perl libraries are installed. |

    | USER | The user name (obtained from the operating system, if it is set). |


    When a Perl script runs as a CGI program, a number of other environment variables
    are set: they represent the environment in which that script is running (see Table
    15-2). Note that not all variables are set and not all of them are always set
    correctly! Note, too, that "Remote" is from the Web server''s point of view; it
    means the user and the browser in use.


    # Table 15-2. CGI Environment Variables


    | Variable | Meaning |

    |---|---|

    | DOCUMENT_ROOT | The directory from which Web pages are coming (this is your
    site''s directory). |

    | GATEWAY_INTERFACE | CGI Version in use on the server. |

    | HTTP_ACCEPT | A list of MIME types accepted by the browser (client). |

    | HTTP_ACCEPT_CHARSET | The character set accepted by the browser. |

    | HTTP_ACCEPT_LANGUAGE | The language(s) accepted by the browser. |

    | HTTP_CONNECTION | Type of connection (Keep-Alive is common). |'
