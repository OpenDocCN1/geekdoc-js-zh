- img_proc: true
  md: '# Getting Input from Users


    Until now, all the examples in this book have used data that has been entered
    into the script when you create it. In this chapter, you will see how to communicate
    with the user. Some of the examples that you have seen previously may have seemed
    self-evident: why search for commas in a string when you know exactly what the
    string is? In the real world, you generally don''t know the contents of a string,
    so you need to parse it and check for errors.


    The simplest way to get input from users is to use STDIN. STDIN is a filehandle
    to a stream that is assigned to the terminal keyboard; you can live very happily
    just thinking of it as the keyboard.


    (Two other streams are created for each Perl script: STDOUT is used for output
    from print statements, and STDERR is used for error messages. All are assigned
    to the screen, but they are used differently.)


    When <STDIN> appears in your Perl script, execution stops and characters are read
    from the terminal. When a return is entered, all the characters (including the
    return) are passed to the script. You can assign them to a scalar, as in:


    ```

    $Input = <STDIN>;

    ```


    This reads a line from the terminal and assigns it to the $Input scalar variable.


    You can also use <STDIN> in a list context, assigning it to an array, as in:


    ```

    @input = <STDIN>;

    ```


    In this case, lines of input are assigned to elements of the array until an end-of-file
    is encountered. (It may be ctrl-Z on your PC, ctrl-D on Unix, or command- on a
    Macintosh.)'
  merge: -1
  pgno: 131
