  md: '# String Operators


    Two operators let you work with strings. The simplest is . (period or dot)—the
    concatenation operator. It appends the second string to the first. (If you have
    used other programming languages, you may be used to use + & as a concatenation
    operator; this is legal in Perl, but it is not concatenation. The + converts both
    strings to numbers—usually 0—and adds them. The & performs the AND operation on
    both strings; the results are usually not what you had in mind.)


    The second string operator is ~. It is a frequently used Perl operator, and it
    is typical of the shortcuts that Perl lets you take. Perl provides many tools
    to let parse strings. You define the characters you want to choose from a string
    by using a regular expression. (Regular expressions are described elsewhere.)
    The character manipulation works on the $_ variable in which Perl keeps temporary
    values. To translate the contents of $_ to uppercase, you can write:


    ```

    $string3 = "three";

    $_ = $string3;

    t/a-z/A-Z/;

    ```


    If you use the ~ operator, you can write


    ```

    $string3 ~ tr/a-z/A-Z/;

    ```


    Perl will use the value in $string3 instead of that in $_. This can be very useful
    when performing repeated matching and parsing operations.'
