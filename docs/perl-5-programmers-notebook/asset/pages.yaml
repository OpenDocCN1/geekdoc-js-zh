  md: '# Octal and Hexadeimal Numbers


    You can use octal and hexadecimal numbers as well as normal decimal numbers. Hexadecimal
    numbers are often used to represent non-printing characters (such as line feeds,
    tabs, and so forth). A pair of hexadecimal digits represents any standard character.
    (The international Unicode character set requires four hex digits for each character.
    This permits the representation of non-Roman alphabets.) Hexadecimal numbers use
    the digits 0–9 and A (10), B (11)...up to F (15).


    Octal numbers use the digits 0–7. They are less frequently used than hexadecimal
    numbers.'
  merge: -1
