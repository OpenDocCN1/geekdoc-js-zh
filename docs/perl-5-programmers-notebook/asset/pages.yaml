  md: '# # Dynamically Varying Information on a Web Page


    The previous example showed you how to produce a Web page with varied information
    on it. What if you want to vary this information dynamically? In other words,
    what if you want to vary the files that are included? (This is how banner ads
    work on Web pages.)


    You have a number of ways to do this: one of them is outlined here. It relies
    on the previous examples in which you dynamically create a Web page from one or
    more files containing HTML. In addition, you insert a particular file at a given
    point: right after the header, right before the footer, after the second (or some
    other number) of your text files—wherever you want it.


    The file that you insert varies each time the script is called. You create a DBM-based
    hash that contains the names of a number of files; each one could be used as the
    inserted file. The 0th element of the hash contains the number of files in the
    hash; each subsequent element and contains a file name. (See the first example
    on the opposite page.)


    You insert the code from the second example wherever you want to be in your Perl
    script. This code opens the DBM-based hash, looks at the 0th element to see how
    many possible files are there, and then it computes a random number between 1
    and that number returns the name of that file, and you insert it. This randomly
    varies a banner ad, “quote of the day,” or whatever you choose to place in the
    DBM.'
  merge: -1
  pgno: 235
- img_proc: true
  md: "```\n#!/usr/bin/perl\nUse this to build filelist—the list of randomly used\
    \ files (ads, etc.).\ndbmopen (%filehash, \"filelist\", 0666);\n  Open the DBM.\
    \ It will create one if it doesn't exist.\n$filehash{0} = 5;\n  Use the underlined\
    \ value to the number of files to rotate through.\n$filehash{1} = \"first ad\"\
    ;\n\n$filehash{2} = \"second ad\";\n\n$filehash{3} = \"third ad\";          Enter\
    \ the file names to rotate.\n\n$filehash{4} = \"fourth ad\";\n\n$filehash{5} =\
    \ \"fifth ad\";\n```\n\ndbmclose (%filehash);\n  Close the DBM.\n\nWherever in\
    \ the previous example you want to insert a variable file, insert\nthis code (after\
    \ the header, before the footer, after the nth file, etc.):\ndbmopen (%filehash,\
    \ \"filelist\", 0666);\n  Open the DBM.\nuse integer;\n  Start using integer mode\
    \ so that the keys to the hash aren't fractions.\n$x = (rand ($filehash{0}) +\
    \ 1) * 1;\n  Use the rand number function to generate a number between 0 and\n\
    t number of files—which is stored in $filehash(0). Add 1 to it, since\nnumbers\
    \ start at 1 in this hash. Multiply by 1 to force an integer conversion.\nthefile\
    \ = $filehash{$x}, \"\\n\"\n  This is the file to use this time.\ndbmclose (%filehash);\n\
    \  Close the DBM."
