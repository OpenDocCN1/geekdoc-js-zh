  md: '# Glossary


    Note: Terms specific to Perl are defined in the text and are listed in the Index.
    This glossary contains some general programming terms that may be new to you.
    They are not specific to Perl.


    **ASCII character set** Characters are represented on computers by sequences of
    binary digits (bits). A common representation is the ASCII character set in which
    sequences of eight bits are used for each character. A computer can interpret
    those bits either as a number or a character. ASCII characters can range in value
    from 1 to 256; not all values have corresponding characters, and not all characters
    are able to be displayed.


    **CGI** The Common Gateway Interface is used to allow programs to communicate
    with Web servers and the environment on which they run. A program or script (such
    as a Perl script) has access to CGI variables (such as the name of the server).
    CGI is standard on most Web servers.


    **encryption** Encryption is the technique of disguising data using one or more
    manipulations. Encryption techniques are often one-way—that is, you can encrypt
    some text but you cannot decrypt it. Passwords are often stored this way. When
    you enter a password, it is immediately encrypted, and the encrypted version is
    compared to the stored password. However, it is impossible to ascertain what the
    original password is. Encryption techniques are often subject to export'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'restrictions which is why some software is marked “for domestic use only.”


    **interpolation** Interpolation is the process of expanding variables to their
    underlying values. It is the programming equivalent of changing “Good morning,
    <insert name here>” to “Good morning, Anni.”


    **namespace** Computer programs rely on one or more namespaces to keep their data
    organized. Within a given namespace, names are unique. It is like the telephone
    system where within a given area code, a number (such as 666-3333) is unique.


    **sort sequence** Data can be sorted on computers in many different ways. A sort
    sequence determines how each value is compared to each other one in the sequence.
    Common sorting sequences are plain numeric and alphabetic sequences.


    **TCP/IP** Transmission control protocol/Internet protocol is the method used
    to transmit data over the Internet. It is used whether your connection is via
    cable, telephone, or local area network; it is used for Web pages, e-mail, FTP,
    and other Internet protocols. It relies on packet-switching, in which a message
    is broken up into a number of component parts each of which is transmitted separately.


    **Unicode** This is another character set that allows for many more characters
    than ASCII. Unicode characters are 16 bits long (rather than ASCII’s 8 bits).
    This allows 65536 rather than 256 characters to be represented. Unicode is becoming
    an international standard since it makes easy to represent non-Roman alphabets
    that have far more characters than Roman counterparts.


    **Web server** A Web server is a program that runs on a computer (which may also
    be called a Web server) to which you connect via a URL like http://www.philmontmill.com.
    Common Web servers are Apache and Microsoft Internet Information Server. Your
    Perl scripts are often run by the Web server in response to a request from a user
    accessing a Web page. The results are sent to the user.'
