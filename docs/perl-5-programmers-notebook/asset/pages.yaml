  md: '# Guest Book and Passwords (3):

    Storing the Data


    If no error occurs (that is, if the user has entered a name), then you can store
    the information in your guest book. You have a number of ways of doing so, but
    you can use a DBM for quick access.


    The logic here is simple. You have a DBM for the guest book. The value associated
    with the name {0} is the count of guests. It is incremented each time you add
    someone.


    Here is the code from the opposite page annotated step-by-step:


    ```

    dbmopen ({gueshash, "guestbook", 0666);

    ```


    Open the DBM.


    ```

    $gueshash {0} ++;

    ```


    Update the {0} element by 1. This is the ID number.


    ```

    $gueshash {$gueshash{0}} = $data {"guestname"};

    ```


    Store the name entered on the form in the DBM with the ID number you created just
    now.


    ```

    print "Welcome, \ $gueshash {$gueshash{0}}, " Your ID is ", $gueshash {0}, "<BR>";

    ```


    Print out the HTML to welcome the new user and report the ID number.


    ```

    dbmclose ({loghash});

    ```


    Close the DBM.'
