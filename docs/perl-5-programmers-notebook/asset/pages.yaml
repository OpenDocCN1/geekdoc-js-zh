  md: '# Guest Book and Passwords (1): HTML Form


    Many Web sites let people register; some sites require it. Registration typically
    involves asking for someone''s name and other information—often an e-mail address.
    It serves the purpose of letting the site owner know who is accessing the site;
    it also cuts down substantially on casual browsing traffic from people who are
    only slightly interested in the site''s contents.


    Such registration is called a guest book. A typical guest book page is shown in
    Figure 13-3. This very simple HTML Web page consists of a form.


