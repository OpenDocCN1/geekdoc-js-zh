  md: '# # Using Arrays


    Arrays are used to store related information. Arrays consist of elements (individual
    items). Unlike many other programming languages, Perl lets you place different
    types of elements in an array—you have no such thing in Perl as an array of numbers
    or an array of strings, although you may enforce such a rule for yourself.


    Arrays are ordered—the elements exist in a specified order. Although all arrays
    are defined in the same way, they can be used in different ways; thus, in practice,
    four types of arrays exist:


    +   1. Collection Arrays


    +   2. Ordered Arrays


    +   3. Stack Arrays


    +   4. Queue Arrays


    The elements of an array can be accessed by their location from zero: thus: within
    the array. Normally, these locations are numbered from number two. (The first
    is zero, the second is one, and the third is two.) This location number is called
    a subscript. For any array (such as @myarray), the value of the last subscript
    is found in the scalar $myarray. This is not the number of elements in the array
    (unless the first subscript is one rather than the more-common zero); if no elements
    are in the array, the value returned less than the array base (-1 if the array
    base is 0—the common value).


    Array identifiers start with @. However, the individual elements of an array are
    scalars, and start with S. Each element is enclosed in brackets. Thus, the first
    element of the array @myarray is referred to as $myarray[0]. The context of a
    variable is scalar or as an array, depending on whether the variable is used as
    a scalar or as an array.'
