  md: '# Deleting a File


    You can delete a file using the **unlink** function. Deleting a file removes it
    from the computer on which it resides. Normally, no remnant of the file remains.


    Occasionally, parts of the file may remain on the disk, but the operating system
    no longer recognizes them as part of a file and may reuse the disk space. Special
    recovery programs sometimes can read this "blank" disk space, but not as often
    as most people think. Assume that deleted means deleted.


    Because Perl attempts to run without stopping for error conditions, in Perl you
    can more easily delete a file than in many programming languages—and doing so
    is already easy in many languages. Therefore, be very careful about using unlink.
    Visually inspect your code to make certain that you are deleting the file you
    want to delete. Furthermore, when you are editing a Perl script, be very careful
    with copy-and-paste operations: you can very easily paste an unlink command in
    the wrong place and delete the wrong file.


    Unlink is used in all versions of Perl. It is based on a Unix command. On some
    implementations of Perl (not Windows), two associated commands are implemented:
    link and symlink. They allow you to use multiple names for files.


    The **link** function lets you access the same file with two different names through
    the directory. The **symlink** function lets you create a small file that contains
    nothing but the name of another file. Accessing the small file causes the system
    to access the main file. Since these functions are not available on all Perl implementations,
    they are not discussed further here.'
