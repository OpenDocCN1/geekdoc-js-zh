  md: '# Metacharacters for Matching


    Metacharacters can be used in the regular expression. Four types of metacharacters
    exist:


    +   1. Style metacharacters are used to match stylistic attributes of characters
    such as capitalization. For example, (See Table 5-1.)


    +   2. Replacement metacharacters stand for characters (or sets of characters)
    other than themselves. Some metacharacters stand for predefined character sets.
    For D is the metacharacter for the set of non-digits; you can express the same
    set by explicitly creating a set as [^-9]


    +   3. Metacharacters for sets allow you to refer easily to sets of characters
    (digits, numbers, and so forth) using a single metacharacter and without defining
    the set yourself.


    +   4. Positional metacharacters provide information about where within the string
    characters must be in order to be matched.


    +   5. Repetition metacharacters can be used to specify the number of matches
    that are required to satisfy the regular expression.


    # Table 5-1. Style Metacharacters


    | Sequence | Meaning |

    | --- | --- |

    | \u | uppercase next char |

    | \V | lowercase next char |

    | \L | lowercase until \E |

    | \U | uppercase until \E |

    | \Q | quote non-alphanumeric characters until \E |

    | \E | end case or quote modification |'
