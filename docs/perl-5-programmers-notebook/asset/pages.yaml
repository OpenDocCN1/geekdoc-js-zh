  md: '# Queue Arrays


    Whereas stacks allow elements to be added or deleted only from one end. queues
    let you add at one end and delete from the other—just as a bus queue (UK) or supermarket
    checkout line (US) does. Stacks are sometimes called last in-in out (LIFO) structures,
    whereas queues are called first-in out (FIFO) structures.


    You use queues when you want to preserve the order of a sequence of items: a common
    use is when you allow a user to input several commands and then process them in
    sequence.


    You use the same four commands to manage queues as you use to manage stacks; however,
    the pairing is different. Use push and unshift if you add elements to the end
    and remove them from the front; use shift and pop if you add elements to the front
    and remove them from the back.'
