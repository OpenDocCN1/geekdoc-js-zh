  md: '# # Using Match Results


    When you have matched a regular expression to a string, you have three results
    (any of which can be empty):


    +   1. You can use `$^` to reference the string that precedes the matched characters.

    2. You can use `$S` to reference the string that follows the matched characters,

    3. You can use `$&` to reference the string that matched the regular expression.
    (Since a regular expression can contain very complex combinations of characters,
    what the match be is not at always clear. If you match on `/ca./` the result could
    be can, cat, or ca4.)


    The string on which you are performing the match is not altered in any way. If
    you want to break it apart into its components, you can use the split function
    (described next).'
