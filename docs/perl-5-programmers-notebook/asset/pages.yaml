    \ only on low-volume servers; on active servers, this loop could\n    tie up the\
    \ computer.\n}\n\n$loghash {$key} = $browser|\"\n    $IPaddress = \"\" .$identity;\n\
    \    Concatenate the log information into a value for the hash that is stored\
    \ in the\n    DBM. Note that | characters are inserted to make easy disassembling\
    \ the log\n    entry using a regular expression.\n\ndbmclose(%loghash);\n\nexit\
    \ 0;\n```"
