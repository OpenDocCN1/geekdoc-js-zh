  md: '# Guest Book and Passwords (2):

    Editing the Response


    When the user clicks the Submit button, the data from the form shown on the previous
    page is sent to the program you have specified—cgi-bin/guestbook.pl in this example.
    You need to interpret the input, to check it for errors, and then to process it.


    This page shows you how to interpret it and check for errors. In this case, only
    one error is tested: a blank name. You could do other tests at this time if you
    wanted. You probably know from your own experience entering data that a convenient
    approach is to get all the error messages at once so that you don''t have to keep
    going back and changing your data. (The only reason for not doing all is if the
    errors may be interrelated.)


    The results of error checks are stored in strings (in this case, only one—NameResult).
    A test sees whether string has a length greater than zero—in other words, was
    an error message generated. If so, a Web page is produced dynamically containing
    that error message.


    As noted in the code on the opposite page, you can add other error checks at this
    point.


    Note that several lines of code on the opposite page appear aligned; the lines
    starting with Content-type, HTMLHeader, and HTML-Footer must begin in the first
    character position of the line; you cannot indent them.'
