  md: '# Sending Output to Users: On the Web


    One of the most common uses of Perl today is to create dynamic Web pages. The
    previous example showed you how to create the HTML for a Web page, but how do
    you get it into someone''s browser?


    This section shows how you use a Perl program on a Web server to generate a dynamic
    Web page. You can also use Perl programs to process data from forms, generate
    Web page counters, and do a host of other things. They will be shown later; this
    section is only about generating a simple Web page.


    Despite the fact that the World Wide Web is a very widely used technology, you
    will find some variations in the deployment of Web resources at different Web
    sites. This variation is of concern to people who design and implement Web pages
    at each site; it is not of concern (or even visible) to users of the Web pages.


    When you use a browser such as Microsoft Internet Explorer or Netscape Navigator
    to connect to a Web site from your personal computer, a connection such as the
    one shown in the diagram below is created. (Note that this is a very high-level
    schematic, but it should be sufficient to show you how and where Perl scripts
    fit into the picture.)


    | Personal Computer | Internet Service Provider (Host) |

    | --- | --- |

    | Browser | Web Server |

    | HTML | HTML |

    | | .html .cgi .exe |'
