- img_proc: true
  md: '# Switching Filehandles and Formats


    So far, you have used the default STDOUT filehandle for output; STDOUT_TOP is
    the format for the tops of pages, and STDOUT is the format you have used for output.
    In fact, although these are the common defaults, you have more flexibility and
    you can manipulate every aspect of this process: you do not need to use the default
    filehandle and you can use formats with any names. (However, the convention of
    naming formats with the name of the filehandle and appending _TOP to the top-of-page
    format is widely recognized.)


    Perl recognizes a single filehandle as being selected. All print and write functions
    operate on that filehandle. By default, STDOUT is selected, but you can change
    that filehandle to any other filehandle that you have created with an open statement.


    You can set the S~ variable to any format; it will be used whenever the currently
    selected filehandle is used in a write statement. Similarly, the S^ variable is
    used to set the top-of-page format for the currently selected filehandle.


    Note that if you select another filehandle, you can change the formats for that
    filehandle, but the formats associated with the first filehandle remain in effect.
    In other words, S~ and S^ are the formats for the currently selected filehandle
    only. For this reason, it is a good practice to store the current values of S~
    and S^ in temporary values and to replace them after you have used your formats;
    you can''t tell who may rely on those formats.


    For example:


    ```

    $oldformat = $~;

    $~ = myformat;

    ...do something

    $~ = $oldformat;

    ```'
  merge: -1
