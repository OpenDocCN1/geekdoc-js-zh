  md: '# Flags for Format Control Strings


    You can place flags between the % and the formatting character in any element
    of a format control string. The flags are shown in Table 7-3.


    Together with the width formatting described earlier in “Specifying Widths for
    Formats in Format Control Strings,” you can use these flags to help format reports.
    However, you have two other ways to format reports that you may find more useful.
    Perl has report writing routines that use explicit formats that handle formatting
    of numbers and strings as well as headers, footers, and other page layout characteristics.


    In addition, Perl has a **here document**, a virtual document to which you can
    send output using the << operator. This is useful for sending large amounts of
    data. It is described later in “Printing to the Here Document.”


    You can also use Perl to create HTML that can be downloaded to a browser. HTML
    itself has many formatting routines such as tables that help you organize data
    on the page.


    Table 7-3. Flags for Formats

    | Sequence | Meaning |

    | --- | --- |

    | space | place spaces before number (default) |

    | 0 | place zeros before number |

    | + | put a + or - before number |

    | - | place number at left of field (left-justify) |

    | # | prefix octal with "0," hex with "0x" |'
