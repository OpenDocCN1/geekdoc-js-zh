  md: '# Appending to a File


    The > shown in "Writing to a File," earlier, lets you write to a file. If it is
    not present, it is assumed you want to read from an existing file. Of a total
    of three such indicators, each can take an alternate:


    +   1. < before the file name indicates that you want to read an existing file.
    An error is generated if the file does not exist. (If no indicator is supplied,
    < is assumed by default.)

    2. > before the file name indicates that you want to write to a new file. If a
    file with the same name already exists, it is written over by your new file.

    3. >> before the file name indicates that you want to append to an existing file.
    It does not generate an error if the file does not exist; it creates it. If it
    does exist, it is opened and your output follows whatever data is already in the
    file.


    The + operator can precede the indicator; it means that you also want to read
    an output file or write to an input file.


    +   +< means you want to open a file for reading but also write to it. Note that
    the file must exist.

    +-> means that you want to open a file for writing, but also read from it. Note
    that if the file exists, it is overwritten by the new file.

    ++ rounds out the indicators; it means you want to append to an existing file
    that you may also read from it.


    Note that appending and updating a file are different. When you open a file to
    append to it, it is positioned to its end. When you open for updating, you can
    read or write; each access—be it read or write—moves the file position further
    along.'
  merge: -1
