  md: '# # Substituting Characters with Regular Expressions


    In addition to matching, you can use regular expressions to substitute characters
    in strings. As with matching, you work by default on the S_ variable; you can
    use the =~ operator to work on a string to the left of that operator.


    Regular expressions have their same meanings in substitutions. A substitution
    is introduced by s, followed by two regular expressions, as in:

    `s/original string/new string/`


    As with matching, you can use alternate delimiters, such as:

    `s@original string@new string@`


    This can make your life easier if your regular expressions contain / characters
    as constants—by using an alternate delimiter, you can use the / character by itself
    rather than escaping it, as in \/. (Matching-expressions use the format `m/regular
    expression/`, but the m can be omitted.)


    Substitutions can be used to replace words and characters; they are particularly
    useful in creating dynamic scripts for use with the Internet, as the example on
    the opposite page shows.'
  merge: -1
