  md: '# Numbers


    Perl stores all of its numbers as double-precision floating point numbers. As
    a result, you can store very large and very small positive and negative numbers.
    Also, the results of some arithmetic operations may not be exactly what you expect.


    You can enter a number as an integer or decimal number. You can also use scientific
    notation—as in 3.4e5, which is 3.4 raised to the 5th power. Either part (or both)
    of the number can be negative—as in -3.4e5, 3.4e-5, and -3.4e-5.


    Any Perl scalar can contain a number. Arrays and hashes consist of scalars, and
    each element of an array or hash can be a number or string. (They can be mixed
    within a single data structure.) Perl does any necessary data conversions when
    it needs to use the data.


    Perl''s automatic data conversions are very helpful as you move through your operations.
    However, if you are used to a strongly typed language (such as C++), you may find
    Perl accepting and processing statements that you would have expected to generate
    an error. Be careful what you type in Perl: it usually won''t get an error, but
    the results may surprise you.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '```

    #!/usr/bin/perl


    $x = 5/3;

    print $x, "\n";

    This statement prints out 1.6666666666666667. 5/3 is a repeating decimal: results
    on your computer may vary with regard to the number of digits

    print 1.6666666666666667 * 3, "\n";

    However, if you type in the printed value of Sx and multiply it by 3, you get

    5.00000000000001.

    $a = "5";

    print $a, "\n";

    This code demonstrates Perl''s automatic type conversion. The scalar Sa is

    aigned string value—you can tell it''s a string because quotes are

    around "5."

    $a = $a/2;

    print $a, "\n";

    As needed, Perl does type conversions. Here, it converts the string "5" to the

    number 5 and divides it by 2—giving 2.5.

    $a = $a. cents";nprint $a, "\n";

    The period is the operator that concatenates (joins) two strings. For this

    operation, Perl needs to convert Sa to a string. It converts the number 2.5 to

    the string "2.5" and prints out 2.5 cents.

    $a = "z";nprint $a, "\n";

    However, type conversion is at work again. Sa is given a string value—"z".

    $a = $a. cents";nprint $a, "\n";

    This, when you divide Sa—the string value z—by 2, it is converted to a

    number. The only number Perl can convert it to zero. The result of the

    operation is 0—that is, 0/2.

    $a = $a. cents";nprint $a, "\n";

    However, the number zero is converted back to a string—0—and concatenated

    with the rest of the string.

    ```'
