  md: '# Strings


    Strings are the heart of many Perl programs. You can easily use Perl to assemble
    and disassemble strings, taking out quotes or commas, finding e-mail addresses,
    and generating the complicated HTML for Web pages.


    The most basic strings are sequences of characters that you enclose in straight
    double quotes ("). These are called **double-quoted strings**. They can be of
    any length, and they can contain any character that you can type (Perl''s characters
    are the ASCII character set found on most computers. Some computers use the newer
    Unicode character set, which allows for the entry and display of non-Roman alphabets).


    The only problem with these strings is that you sometimes need to enter characters
    on the keyboard; you may also need to enter a quotation mark—and that would end
    the string. In order to handle these cases, Perl lets you enter these special
    characters by preceding them with a \. In a double-quoted string, the \ always
    introduces a special character (it may introduce the \\\ inserts a single \ into
    the string).


    In addition to interpreting these special characters in a double-quoted string,
    Perl also **interpolates** variables found within the string.


    You can also use **single-quoted strings**. These have different rules. No interpolation
    occurs, and the only two special characters that are recognized are the single
    quote and the backslash—which are represented by \'' and \\, respectively. All
    other characters in the string (including carriage returns) are made part of the
    string.'
  merge: -1
  pgno: 25
