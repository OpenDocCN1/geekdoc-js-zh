  md: '# Converting Hex Numeric Strings to Alphanumeric


    The data that is passed from a form submitted via GET or POST may have special
    or non-printing characters. In the case of GET, you need to transmit these as
    hex strings—%xx where each x is a character from 0-9 and A-F. This is way how
    blanks, returns, and so forth are sent.


    If they were not encoded as hex strings, they would appear as characters that
    are interpreted as special URL characters. For example, the string of data that
    is passed after a URL consists of name/value pairs separated by &, as in


    ```

    aVariable=1234&anotherVariable=5678

    ```


    If the & character is part of a value, you could get a string, such as this, which
    cannot be parsed properly:


    ```

    aVariable=1&34&anotherVariable=5678

    ```


    The solution is to pass the & (or any other special character) as a hex value,
    so that the previous string would appear as


    ```

    aVariable=1%3834&anotherVariable=5678

    ```


    The % introduces a hex string of two characters—26—which can be converted to a
    & & after the string is parsed. (Note that this string is hexadecimal; its decimal
    equivalent is 38).


    You can use Perl''s regular expressions and the pack function to easily convert
    hex numeric strings to alphanumeric characters. This code should be added to each
    of the previous examples right after the second split (when you are separating
    $name and $value).


    The Perl module CGI.pm contains code to do many of these operations.'
  merge: -1
  pgno: 249
