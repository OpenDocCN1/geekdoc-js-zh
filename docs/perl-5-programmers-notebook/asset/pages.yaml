  md: '# # Repetition Metacharacters


    You use repetition metacharacters to match more than one occurrence of a string
    (see Table 5-5). If you follow a character or metacharacter with *, that will
    allow 0 or more occurrences to match. + allows 1 or more, and ? allows either
    0 or 1.


    Following a character or metacharacter with { and } allows you to specify a variable
    number of repetitions—n times, n or more, or n but not more than m.


    Table 5-5. Repetition Metacharacters

    | Sequence | Meaning |

    |---|---|

    | * | 0 or more |

    | + | 1 or more |

    | ? | 0 or 1 |

    | {n} | n times |

    | {n, } | at least n |

    | {n,m} | at least n, not more than m |'
