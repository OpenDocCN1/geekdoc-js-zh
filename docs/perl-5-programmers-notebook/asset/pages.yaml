  md: '# # Hashes


    Arrays consist of elements that are ordered by number. You can create arrays with
    "holes" in them—undefined elements—but all the elements can be referenced with
    the appropriate subscripts.


    Hashes are associative arrays—they are not ordered and their elements are not
    identified by a subscript number; instead, each element of a hash is identified
    by a **key**. The data elements of a hash are called **values**. A **key/value
    pair** is a particular combination of a key with a value. Hashes must always have
    an even number of elements—a key exists for each value and a value for each key.
    Perl keeps track of the elements; their order within the hash is basically undefined.
    No duplicate keys occur in a hash; when you assign a value to an existing key,
    it replaces the previous value.


    Hash variables are preceded with %, as in %myHash. As with array elements, you
    access individual elements within the hash as scalars. Array elements are identified
    by their subscripts; hash values are identified by their keys. Whereas array subscripts
    are enclosed in square brackets [ and ], hash keys are enclosed in curved brackets
    { and }.


    You can create a hash containing address information by assigning key/value pairs,
    such as


    ```

    $address {"street"} = "27 Dupont Circle";

    address {"city"} = "Washington, D.C.";

    ```


    You can also assign hash values by alternating key/value pairs, as in the equivalent
    to the code above:


    ```

    %address = ("street", "27 Dupont Circle", "city",

    "Washington, D.C.");

    ```


    Other languages have a similar construct; in Java, for example, it is the Hashtable.'
