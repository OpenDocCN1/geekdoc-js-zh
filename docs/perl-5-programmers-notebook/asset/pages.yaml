  md: '# Subroutine Control of Execution


    The return statement in a subroutine is the last statement that is executed, but
    it need not be the last statement in the subroutine. A subroutine can contain
    a number of return statements; usually, in such cases, they are enclosed in if
    statements so that different types of values are returned in different cases.


    For the sake of clarity, many programmers explicitly return values in return statements
    rather than relying on the Perl rule that the last statement evaluated is returned.
    Furthermore, a good idea is to end your subroutine with a final return statement.
    In the case of complex if statements, you will be certain to generate an appropriate
    return value.


    Another programming convention is the use of error codes. If your function calculates
    a value (such as area), you can designate certain values as error codes. This
    capability makes a certain degree of sense when some values are impossible to
    generate under ordinary circumstances. (For instance, a negative area is illogical.)
    Unfortunately, this style of programming often leads to problems when the rules
    change. (Many programs use the year 00 for special purposes—this is part of the
    so-called Y2K problem).


    You have two common ways of handling error codes. One is to use the return value
    of the subroutine in a parameter. Another method is to always use the first argument
    to a subroutine as an error flag. In either case, you must be careful to set the
    value in the subroutine and to check it in your script.


    One additional piece of Perl lore is @wantarray. If the result of a subroutine
    is be assigned to an array in your main script, the variable @wantarray is true
    (1); otherwise, it is false (0).'
