  md: '# HTML Forms: Post Method


    The POST method for HTML forms sends the data as part of the message; it is not
    visible as part of the URL. In practical terms, this means that your Perl script
    needs to read the data from the message rather than decoding it from the QUERY_STRING
    variable.


    One reason for using the POST method is that you can send data other than plain
    text. It is also appropriate for longer volumes of data than are practical to
    send with the GET method.


    You decode the data from a POST method in the same way that you do for a GET method.
    However, you use the read function to access the data.


    The read function takes up to four arguments:


    +   1. The first is the filehandle from which to read the data. In the case of
    a POST method, that is STDIN.

    2. The second is the scalar variable into which to place the data that has been
    read.

    3. Next, you specify the number of bytes to read.

    4. Optionally, you can specify an offset—the number of characters to skip before
    starting to read.


    The read function returns the number of bytes actually read—which should be less
    than or equal to the third parameter. A value of 0 means that the end of the file
    has been reached; a value of undef means that an error has occurred.'
  merge: -1
