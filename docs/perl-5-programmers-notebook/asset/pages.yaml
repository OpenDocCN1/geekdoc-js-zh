  md: '# # Preface


    Perl—the Practical Extraction Report Language—is a simple and powerful scripting
    language that you can use to manipulate text, files, and reports on a variety
    of operating systems (Unix, Windows, DOS, and Macintosh, among others). It is
    available for free under the Perl Artistic License; you can download it from http://www.perl.com.


    With the rapid growth of the World Wide Web, page designers and Webmasters keep
    encountering little tasks that are beyond the scope of HTML (the language of Web
    pages); these tasks include such things as editing data in forms, automatically
    generating e-mail, creating guest books, and managing Web site security. Lo and
    behold, Perl—the language designed to manipulate text, files, and reports—turn
    out to be a perfect tool for such tasks. And considering its pricing structure
    (as noted previously, free), it is scarcely surprising that it is available on
    many Web servers at many Internet service providers.


    In its simplicity, Perl is a great tool to get little jobs done (including getting
    your Web site working properly). It is also an excellent environment to use if
    you want to learn programming principles. You can write bad code with Perl (as
    you can with any programming language), but its simplicity can help you focus
    on the concepts of programming that apply to all languages. The examples given
    in this book not'
  merge: -1
  pgno: 12
