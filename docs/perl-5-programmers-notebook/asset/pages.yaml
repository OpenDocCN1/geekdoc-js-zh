  md: '# Using Files


    Computer data is stored in memory (RAM) as well as on disks and other physical
    media such as used tapes and a variety of cartridges. Traditionally, memory has
    been used for relatively small amounts of data that need to be accessed quickly.
    Memory is relatively expensive and scarce on computers—even today''s computers
    with the multiple megabytes of memory can store vastly more data on their disks
    than in memory. Memory on today''s personal computers is measured in megabytes—millions
    of bytes of data. Data in memory is stored in areas that go by a variety of names
    such as frames and stacks. A computer''s memory may be used for data from several
    programs as well as for the operating system; it also contains program instructions
    (a special kind of data).


    Disk storage (and storage on other media) has traditionally been used for large
    quantities of data; it is cheaper than memory, but its access time is slower.
    Disk capacity on today''s personal computers is measured in gigabytes—billions
    of bytes of data. The data on disks (and other storage media) is stored in files.


    Data that is transferred from one computer to another can be transferred as files
    or messages—such as the password that may be sent automatically when you log on
    to a computer. If you want, you can think of message data transfer as transfers
    at the memory level and file data transfers as transfers at the disk level.


    The operating system is responsible for maintaining files: they may be stored
    in multiple segments on disks, but the operating system makes this fact transparent.
    Within a given file, the programmer is responsible for the organization of data.


    Note: In "File Sharing," later in this chapter, many of the concepts of this chapter
    will be combined into a practical example: a Web page counter. Don''t be tempted
    to use the early sections to produce a counter—you need all the features to produce
    a foolproof one.'
  merge: -1
  pgno: 155
