  md: '# Sorting Lists


    Perhaps the most common manipulation of lists is sorting the elements. The Perl
    sort function does this. It operates on a list (which can be the elements of an
    array) and sorts it into another list (or array). If you assign the array back
    to itself, you can effectively sort it in place; if you assign it to another array
    variable, the original list is untouched. (Assigning sorted lists to new variables
    also means that each sorted list takes up more memory.)


    By default, list elements are sorted using the local alphanumeric sorting sequence.
    You can modify that sequence by writing your own sort routine. That routine can
    be in a separate subroutine or it can be in an anonymous reference to a subroutine.
    An anonymous reference is the code of the subroutine placed within brackets and
    then used within the sort statement itself. If the sorting code is brief, this
    is the easiest way to do it.


    Two global variables—\$ and \$b—represent each pair of elements passed to the
    sort. If you write your own sort routine, you can sort them in an order other
    than the default order; you can also sort based on criteria other than their alphanumeric
    values.


    The sort routine returns one of three values:


    +   1. -1 means that \$a should precede \$b.


    +   2. 0 means that \$a and \$b are equal (for the purposes of the sort).


    +   3. +1 means that \$a should follow \$b.


    The cmp (string) and <=> (numeric) operators are designed for this purpose.'
