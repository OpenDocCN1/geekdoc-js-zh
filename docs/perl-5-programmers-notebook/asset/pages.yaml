  md: 'A permission is a value from 0-7 (octal). It consists of three bits, each of
    which is on (1) or off (0):


    | Write |

    | Read Execute |


    +   - 001 (1) means execute, but don''t read or write

    - 010 (2) means write only

    - 011 (3) means write and execute

    - 100 (4) means read only

    - 101 (5) means read and execute

    - 110 (6) means read and write

    - 111 (7) means read, write, and execute


    A mode consists of three permissions: the first applies to the owner of the file,
    the second to all members of the group to which the owner belongs other than the
    owner, and the third to everyone else.


    | Group |

    | Owner Others |


    This assumes a multi-user environment that implements security. On a single personal
    computer, everything may be set to read/write/execute for everyone (which is a
    single user). The assignment of ids for owners and groups (and the collection
    of users into groups) is normally done by a system or network administrator.


    ```

    #!/usr/bin/perl

    chmod 0755, "countr4.txt";

    ```'
