  md: '# # Metacharacters for Sets


    The metacharacters shown in Table 5-4 let you use predefined sets of characters
    in your regular expressions. The advantage of doing so is that you do not have
    to worry about correctly constructing the sets yourself. This not only saves times
    but also means that your string scanning behaves the way that people expect it
    to (which is the way that other programs handle it).


    You commonly want to check that strings contain numbers, digits, or a combination
    thereof (many passwords are required to contain both numbers and digits). Further,
    you may need to check that no white space or character is contained in a string.
    (As shown in the example, sometimes checking the reverse of what you want is easier.)


    If you need to define your own set of characters, you can do so by enclosing the
    characters in [ and ].


    Table 5-4. Metacharacters for Sets

    | Sequence | Meaning |

    | --- | --- |

    | . | any character except newline |

    | \d | digit |

    | \D | not a digit |

    | \w | word character (digit or letter or _) |

    | \W | not a word character |

    | \s | space [ \r\t\n\f] |

    | \S | not a space |

    | [] | set |'
