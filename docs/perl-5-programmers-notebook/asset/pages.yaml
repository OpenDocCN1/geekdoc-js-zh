  md: '# Printing to the Here Document


    The here document is used to send data using the << operator, without out bothering
    with formatting. You access the here document with three steps:


    +   1. You provide a name for the data you are going to output—such as pageheader.
    You start the output with this line:


    ```

    print <<pageheader;

    ```


    +   2. You then type all the text that you want to output. You don''t use formatting
    codes, and you don''t need to insert newline (\n) characters at the end of each
    line. The lines you type will be output.


    +   3. After the last line, type


    ```

    pageheader

    ```


    (Make certain that this is not the last line of your Perl script: add a return
    if it is. Do not use a semicolon after the last line.)


    If the name is enclosed in ` quotes, the text will be output exactly as it is
    typed. If it is not enclosed in any quotes or is enclosed in ", variables will
    be interpolated.


    This process is useful for sending large amounts of data to be output. One of
    the most frequent uses of the here document is to create Web pages dynamically.'
  merge: -1
