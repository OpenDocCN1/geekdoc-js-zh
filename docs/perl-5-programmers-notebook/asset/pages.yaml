  md: '# Enumerated Loops


    Enumerated loops use the keyword for. The foreach loop specifies the values to
    use in executing the loop. These may be in an array, or they may be listed in
    the program. A variable—called an index variable—is assigned each value in turn.
    (You often use the index variable in the block that is executed by the loop).


    If you do not specify an index variable, Perl uses the $_ variable. You can reference
    it in the loop. In the case of embedded loops, Perl keeps the $_ variables separate
    for each loop.


    You can use the range operator .. in a foreach loop. The range operator takes
    the first value and adds one to it until the second value is reached. Thus "a".."z"
    is all lowercase letters; "A".."Z" is all uppercase letters. You can combine lists
    of values with ranges.


    A for loop specifies an initial value for the index variable, a formula by which
    to increment it, and a test to use in terminating the loop. All three clauses
    are set in parentheses and they are separated by semicolons;


    ```

    for ($i = 1; $i <=100; $i++)

    {\    print $i;

    }

    ```'
