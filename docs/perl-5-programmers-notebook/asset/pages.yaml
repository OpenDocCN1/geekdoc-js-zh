  md: '# Numeric Pictures


    In addition to specifying whether data in a field should be left- or right-adjusted
    or centered, you can specify how numeric data should be shown. The # character
    is used to represent a numeric character. Thus, to print out a value in five places,
    you use:


    ```

    #####

    ```


    You can specify where the decimal point appears by placing a . in the numeric
    picture, as in:


    ```

    ####.##

    ```


    # Multiline Fields


    When you write out a variable containing text, only the text up to the first newline
    character is processed. If the variable contains several lines of text, you need
    to use the @* symbol to specify the field.


    You do not specify a width for @* fields: each line of the text field is printed
    out using whatever length it happens to have. The entire text field is printed
    out using as many lines as are necessary.


    (You may want to check the length of a multiline field before writing it out so
    that you do not accidentally generate unwanted output.)'
  merge: -1
