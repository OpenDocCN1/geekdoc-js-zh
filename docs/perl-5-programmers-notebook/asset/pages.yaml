  md: '# Warning, Dying, and Exiting


    When you use the print or printf function, by default you write to the STDOUT
    device—the terminal, console, or computer that your user is using. Perl errors
    are sent to another device (STDERR), which is normally the same device. You need
    to keep these devices separate so that in the case where output is redirected
    to a file or printer, only substantive output (STDOUT) is printed or saved in
    a file and the errors are sent elsewhere.


    Two Perl functions let you write directly to STDERR. The warn function takes a
    list of strings (usually only one) and prints it to STDERR. The die function takes
    a similar list, prints it to STDERR, and terminates the program. Nothing stops
    you from writing out using warn or die, but it is bad programming. Likewise, you
    should not use die to end your program: it is considered an exception to normal
    processing.


    In fact, when a Perl script terminates, it terminates with a result code. This
    is usually zero, meaning no error has occurred. A value of one means that an error
    has occurred. Other values may be defined for specific installations, but they
    are not part of the Perl standard. When Perl scripts are run as part of batch
    routines, the operating system can check the result code to see whether the next
    step in the process should be carried out.


    You can use the exit function to stop the program and set this value. (Use die
    to print out a human-readable error message; use exit to produce a result code
    to be interpreted by another computer process.)


    (More information on warning and dying, as well as error handling in general,
    appears in “Reporting Input/Output Errors” on page 146.)'
