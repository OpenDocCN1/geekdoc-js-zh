  md: '# Positional Metacharacters


    Positional metacharacters are used to indicate that the character(s) that follow
    must appear at a specific location—usually the beginning or end of a string. Positional
    metacharacters are also used to indicate matches at the beginning or end of words,
    regardless of the characters involved (see Table 5-2). Thus, you can search for
    either a blank or a whitespace character in a string—or you can search for the
    presence/absence of a word boundary.


    In general, you are safest using predefined metacharacters rather than your own.
    Your character matching will work as most other character matching does, and you
    will not have to worry whether or not you have checked for all possible word-delimiting
    characters—you just use the word boundary metacharacter.


    Table 5-2. Positional Metacharacters

    | Sequence | Meaning |

    |---|---|

    | ^ | beginning of line |

    | $ | end of line |

    | \b | word boundary |

    | \B | not word boundary |

    | \A | beginning of string (with m modifier after regular expression) |

    | \Z | end of string (with m modifier after regular expression) |


    Strings are normally considered as a single entity, even if they contain newline
    characters (\n). The m modifier can be used after a match expression to cause
    Perl to interpret each line in a multiline string as a separate line. In that
    case, the \A and \Z metacharacters have meanings comparable to ^ and $ for each
    line of the string—not the string as a whole.'
  merge: -1
  pgno: 103
