  md: '# # File Permissions and file Attributes


    In order to implement security, each file has a set of permissions indicating
    who can read, write, and execute it. You use the `chmod` function to change these
    values in Perl. If you are changing these values manually in Windows, you use
    the `attrib` command; on Unix, you use the `chmod` Unix command; and on Macintosh,
    you use the Sharing pop-up from the Get Info menu item in the File menu (System
    8.5; earlier systems used the Sharing... command).


    You can use the `stat` function to return an array of 13 file attributes for a
    given file (these are used by Perl in evaluating the file tests shown on the previous
    page). Table 8-2. (For Windows, see the documentation for GetAttributes in the
    Win32::File package.)


    Table 8-2. File System Attributes for Perl Tests


    | Attribute | Mnemonic | Meaning |

    | 0 | dev | file system''s device number for the file |

    | 1 | ino | inode number |

    | 2 | mode | type and permissions |

    | 3 | nlink | links to the file (created by link) |

    | 4 | uid | numeric ID of file''s owner |

    | 5 | gid | numeric group ID of file''s owner |

    | 6 | rdev | device identifier (may not be set) |

    | 7 | size | bytes in file |

    | 8 | atime | last access time since 00:00 January 1, 1970 GMT |

    | 9 | mtime | last modify time since 00:00 January 1, 1970 GMT |

    | 10 | ctime | last inode (directory) change time since 00:00 January 1, 1970
    GMT |

    | 11 | blksize | preferred block size for file system I/O |

    | 12 | blocks | number of blocks allocated (NOT file size) |'
