  md: '# Handling Pages


    You can define a special format to be used at the top of each page. You can use
    it for titles, page numbers, and any other information that you see fit.


    A top-of-page format is defined as any other format is, but it has _TOP placed
    at the end of its name, as in:


    ```

    format STDOUT_TOP =

    ```


    You can''t call the top-of-page format directly; Perl uses it as necessary. The
    S% variable is maintained by Perl to indicate how many times that top-of-page
    format has been used. So you can use S% as a page number, as shown in the example
    on the opposite page.


    By default, Perl uses 60 lines as the length of each page. It stores this information
    in the S= variable. If you are sending output to a device that prints a different
    number of lines on a page, you may want to reset this variable. (For example,
    output to computer monitors is often sent in pages that are shorter than 60 lines,
    reflecting the fact that most monitors are wider than they are tall.)


    You may be thinking that you can use Perl''s formats and write statements to help
    you generate HTML pages. Although you can, be careful about thinking that your
    basic formatting code can be transferred to HTML. Web pages rely on special formatting
    code:: top-of-page formats, line spaces, and specially adjusted fields (left,
    right, or centered) need to be specified for HTML—they do not simply appear the
    way you have printed them. See Chapters 12, 13, and 14 for more details.'
  merge: -1
  pgno: 211
- img_proc: true
  md: "```\n#!/usr/bin/perl\n\nformat STDOUT_TOP =\n  Top of page @>>\\  A two-digit\
    \ right-adjusted page number will be printed at the top of the page.\n$%n  Remember\
    \ that you must specify the variable to be printed out.\n.\nformat STDOUT=\n@<<<<<\n\
    \  $aVar\n  SaVar is printed out in five spaces, left-adjusted.\n\n$aVar = 20;\n\
    \nwrite;\nwrite;\nwrite;\n\nTop of page       1\n20\n20\n20\nNote that the top-of-page\
    \ format is never called directly; it is used as needed.\n\n$% = 99;\n  You can\
    \ access the page number counter to reset page numbers.\n```"
