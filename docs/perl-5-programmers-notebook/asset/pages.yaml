  md: '# Table I-1: Escape (Control) Characters


    | Sequence | Title | Meaning |

    | --- | --- | --- |

    | \n | newline | Positions the next print position at the beginning of the next
    line. |

    | '' | single quote | Use to insert a single quote character into a single-quoted
    string. (Otherwise, the single quote would be interpreted as the end of the string.)
    |

    | " | double quote | Use to insert a double quote character into a double-quoted
    string. (Otherwise, the double quote would be interpreted as the end of the string.)
    |

    | \b | backspace | Backspaces and erases the last character. |

    | \216 | octal value | This is the é character (decimal 142). Note that the numeric
    representation of an octal number is 0216 (that is, 142, not é). |

    | \x8E | hex value | This is the é character (decimal 142). Note that the numeric
    representation of a hex number is 0x8E (that is, 142, not é). |

    | \ |slash | Use to insert a backslash; if you do not use this sequence, a backslash
    will be interpreted as introducing a control character. |

    | \r | return | Positions the next print position at the beginning of the same
    line. (May not work consistently on all terminals.) |

    | \t | tab | Moves to the next tab stop if set. (May not work consistently on
    all terminals.) |

    | \f | formfeed | Advances the paper to the top of the next page. (May not work
    consistently on graphical display terminals.) |

    | \v | vertical tab | Moves to the next vertical tab stop if set. (May not work
    consistently on all terminals.) |

    | \a | bell | Rings the terminal''s bell (or another attention device such as
    a beep). |

    | \e | escape | The escape character—often used to introduce a terminal-specific
    control sequence. |

    | \C | control character | Control-C on the keyboard. Replace the capital C with
    the character(s) that follow control-c for the terminal command you want. |'
