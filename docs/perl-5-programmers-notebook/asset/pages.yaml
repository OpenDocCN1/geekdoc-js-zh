  md: '# # Replacement Metacharacters


    Most of the regular expression replacement characters are the same as the replacement
    characters that you can use elsewhere (see Table 5-3). They allow you to use characters
    that you cannot easily type on the keyboard, either because they have special
    meaning on the keyboard (as the return and delete keys do) or because no keyboard
    equivalents exist.


    Table 5-3. Replacement Metacharacters

    | Sequence | Meaning |

    | --- | --- |

    | \n | newline |

    | \216 | octal value |

    | \x8E | hex value |

    | \r | return |

    | \t | tab |

    | \f | formfeed |

    | \v | vertical tab |

    | \a | bell |

    | \e | escape |

    | \cC | control character |'
