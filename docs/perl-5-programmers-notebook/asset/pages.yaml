  md: '# Changing Case and Using Quotes


    These functions let you change the case of characters in a string without scanning
    each one. You can convert a string to lowercase characters with the lc function.
    The lcfirst function converts the first character of a string to lowercase and
    leaves the other characters untouched.


    The uc and ucfirst functions work similarly: uc converts all characters to uppercase,
    and ucfirst converts only the first character of the string to uppercase.


    Changing the case of characters applies only to the characters a-z and A-Z. Special
    characters such as blanks, (, ), /, and so forth do not have case. Since they
    are often treated as delimiters and have purposes other than their normal grammatical
    meanings, you often need to make certain that they are handled appropriately.
    The standard is to precede such characters with \ to ensure that they are treated
    as text characters rather than as special Perl characters (such as the matching
    delimiter /). The \ is called anmer''s character; adding it before special characters
    is called escaping them.


    The quotemeta function inserts \ before each special character in a string. This
    lengthens the string, but it ensures that you can pass the string to a Perl function
    and otherwise use it in your script without worrying about the variable text that
    a user types in cause a program error. Any time that you are receiving unknown
    input from a user and doing anything with it other than simply printing it out,
    you may consider passing it through the quotemeta function to escape the special
    characters. (Remember, though, that this may lengthen the string and cause comparisons
    based on the length of the string to fail.)'
  merge: -1
  pgno: 125
