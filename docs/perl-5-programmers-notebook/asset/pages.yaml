  md: '# Scoping of Variables


    When a subroutine definition is placed in the same file as your script, all the
    variables in the file—both in your main script and in the subroutines—are accessible
    everywhere. You can limit this visibility by declaring a scope for a variable.
    The two scoping functions are `my` and `local`.


    The `my` function takes a list of variables—arrays, scalars, etc. They are made
    visible only to the block in which the `my` function appears, normally a subroutine.
    A variable declared as `my` in a subroutine is thus not able to be used in another
    subroutine or in your main script. This impossibility is an advantage, because
    it means that accidental duplicate names are not a problem: Customer in a subroutine
    cannot be confused with Customer in our main script if the subroutine''s Customer
    is declared as `$my` . Particularly when you start using subroutines from a variety
    of files, you need to know that they will not accidentally interfere with variables
    elsewhere. Furthermore, the use of `my` precludes you from sharing a subroutine
    and requiring its users to name their variables to accommodate your subroutine
    names. Everything is separate.


    Sometimes this separation becomes too much of a good thing, and the `local` function
    allows for an intermediate type of scoping. If you declare a variable as `local`,
    it is visible within the block in which it is made `local`, as well as to all
    subroutines called from that block. This visibility is useful if you have a set
    of subroutines that work together—perhaps to form the basis of an accounting module.
    The main subroutine can declare variables such as Customer and $Account to be
    `local`. When other subroutines are called from within that subroutine, those
    variables will be visible. However, when the subroutines are placed in a Perl
    script, script can use Customer and $Account as it wishes, since those variables
    will be separate from the `local` variables in the subroutine.'
