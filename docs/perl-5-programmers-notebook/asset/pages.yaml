  md: '# Character Translation


    The **tr** function uses regular expressions to define a set of characters to
    replace with another set. For example, you can use an expression such as:


    ```

    tr /a-z/A-Z/

    ```


    to replace all lowercase characters with uppercase characters. As with other regular
    expressions, the tr function works on the S_variable; it returns the number of
    characters translated.


    The example shown here operates the same way as the uc function (it uppcases characters).
    However, you can specify your own sets of characters for specialized translation,
    as shown on the opposite page.


    Three options are available for the tr function. Each is invoked with a single
    letter that follows the regular expression. They are mutually exclusive (you can
    use only one at a time).


    +   1. Delete—if you follow the regular expression with a d, any characters in
    the search string that do not appear in the replacement string are removed. Characters
    that do not appear in the search string are untouched

    2. Squeeze—if you follow the regular expression with an s, normal translation
    is done, but any repeated characters are translated just once. This repetition
    can let you remove multiple blanks from a string. Squeeze may reduce the length
    of the string.

    3. Complement—if you follow the regular expression with a c, any character not
    specified in the search string is translated to the character in the replacement
    string.'
  merge: -1
