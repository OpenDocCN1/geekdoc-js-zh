  md: '# Constants for the pack Function


    The pack function is used to convert a variable or value to a binary value. It
    is similar to formatting in that it uses a value and a formatting code; however,
    it is used primarily at the character/byte level.


    You specify how the data is packed by using a format string. Each character in
    the format string represents one element of the list (the data to be packed) and
    the format into which it is to be packed. If you place a * after a formatting
    character, it is repeated as as many times as necessary to pack all the remaining
    items in the list.


    The format constants for pack are shown in Table 15-3.


    | Table 15-3. pack Formating Constants |

    | Format Constant | Meaning |

    |---|---|n| @ | Fill with nulls. |

    | a | ASCII characters padded with nulls (at the end). |

    | A | ASCII characters padded with blanks (at the end). |

    | b | Bits, low-order bit first. |

    | B | Bits, low-order bit last. |

    | c | Signed char (as in C programming language). |

    | C | Unsigned char (as in C). |

    | d | Double precision float. |

    | f | Single precision float. |

    | h | Hex string, low-order nibble first. |

    | H | Hex string, low-order nibble last. |

    | i | Signed integer. |

    | I | Unsigned integer. |'
