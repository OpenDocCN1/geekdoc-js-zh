  md: '# Generating the Shell of a Web Page with Perl


    This code creates the shell of a Web page. Change the scalar $pageTitle to the
    name that you want a browser to display for the page. Replace the "test line"
    text with whatever you want to display on the Web page. (The replacement lines
    are underlined.)


    ```

    #!/usr/bin/perl


    $pageTitle = "This is the Page Title"

    # This variable will be interpolated in the section below.

    print <<HTMLHeader;

    Content-type: text/html

    TWO returns must follow the Content-type line or else you will get an error.

    <html>

    <head>

    <title>$pageTitle</title>

    </head>

    <body>

    HTMLHeader

    # This is the beginning of a standard HTML Web page. You can use—and reuse—this
    code to create a Web page.

    print "test line", "\n";n# Use another here document or standard print and printf
    calls to print the contents of a Web page.

    print <<HTMLFooter>

    </body></html>

    HTMLFooter

    # This is the end of a standard HTML Web page. You can use—and reuse—this code
    to create a Web page.


    exit 0;

    # The Web server may need a satisfactory result code to properly continue.

    ```'
