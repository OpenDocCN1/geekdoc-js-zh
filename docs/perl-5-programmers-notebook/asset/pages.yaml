  md: '# Modifiers for Matching


    You can add modifiers for matching after the closing / in a regular expression.
    These modifiers affect the way in which the match is performed.


    +   * *i* indicates that the matching should be case-insensitive. If you don''t
    care about capitalization, this can make your regular expressions much simpler
    (you specify only things like a-z instead of a-zA-Z).

    * *m* treats the string as multiple lines. This affects the positional metacters
    ^, S, \A, and \Z. If a string contains multiline lines, the m modifier will allow
    matching to ^ at the beginning of any line. Normally, the multi-line string is
    treated as a single string, and ^ refers to the beginning of the first line of
    the multiline string.

    * *s* treats the string as a single line. This is the default behavior, but s
    has the added behavior of treating the . character as including the \n (newline)
    character. Normally, . matches any character except \n; with the s modifier, it
    will match \n as well as other characters.

    * *x* allows your regular expression to contain blanks for readability and symbols
    to introduce comments. With the x modifier, blanks and # have their normal behaviors;
    to use a blank or # in the regular expression when you are using the x modifier,
    precede it with a \.'
  merge: -1
  pgno: 111
