  md: '# Using HTML Forms


    HTML forms are used for two primary purposes:


    +   1. They can be used to launch Perl scripts and other cgi programs to perform
    a variety of tasks (these tasks are limited only by the imagination of the script
    writer and the resources of the Web server).

    2. They can be used to let users enter information and send it on to a script.


    If you have used the Web beyond the most cursory exploration, you have seen forms.
    The first use—that of launching a Perl script—is shown in a Web page such as this
    one.


    ![](img/dbe145bb02591d3632fc1f12880fdd5f_243_0.png)


    When you click one of the buttons shown in Figure 13-1, the form is submitted.
    It is sent to a URL that often is a CGI program or Perl script. Buttons differ
    from HTML links in that they may send a deal of more data than just the name of
    a link to go to (or a script to execute).


    Figure 13-1: An HTML Form


    You can tell the difference between a standard HTML link and a form button because
    they look different: links are often underlined and highlighted in color; they
    may also be part of navigational image maps (such as the one shown on the left
    of this illustration). Buttons, on the other hand, have a distinctive shape (specific
    to each browser''s implementation).'
