  md: '# Variable Information on a Web Page (2)


    The example on the opposite page is very similar to the previous example, but
    it uses a different technique to assemble the HTML files that will be inserted
    into your dynamic Web page. In this case, you supply a directory name and the
    Perl script inserts each file in that directory into the page. To use this script,
    you need only change the underlined text—the name of the directory.


    You may wish to modify the script in several ways:


    +   1. You can sort the inserted files alphabetically (or in any other order).

    2. You can omit files with certain names, prefixes, or suffixes. (You may want
    to omit files that start with . or that do not end with .txt, .htm, or .html).


    To sort the files, use this code (but remember that sorting a large directory
    can take time):


    ```

    foreach $myfile (sort readdir (DIR))

    ```


    instead of


    ```

    while ($myfile=readdir (DIR))

    ```


    To omit files with certain names, prefixes, or suffixes, insert a regular expression
    in that loop where indicated by the underlined comment.'
  merge: -1
  pgno: 233
- img_proc: true
