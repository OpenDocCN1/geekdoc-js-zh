  md: '# Regular Expressions


    Regular expressions describe a set of strings. They are used in many Unix system
    utilities such as sed, grep, or awk; in Windows, the findstr command performs
    many of the functions of regular expressions.


    The Perl regular expression is normally enclosed in and /. It may contain a specific
    set of characters as “Perl.”. In that case, the regular expression /Perl/ describes
    a set consisting of one string—“Perl.”. However, you can use metacharacters and
    other special symbols to describe sets consisting of a variety of strings. For
    example, you can use the regular string /Pe.l/ to describe the set of all strings
    consisting of “Pe” followed by a single character—any single character—and ended
    with “l.”. That set includes “Perl”, “PeXL”, “Pepl,” and many other strings. It
    does not include “Pel” or “Prl.


    The purpose of describing such a set of strings is most often to locate them within
    a string whose contents are to be parsed. They may need to be parsed in order
    to locate a specific set of characters so that they can be extracted; in other
    cases, the characters may need to be changed (as from upper- to lowercase); and
    in still other cases the characters may need to be manipulated in a variety of
    ways.


    A regular expression may be part of a more complex expression that performs the
    substitution or extraction described here. Its simplest purpose, however, is to
    match characters in a string. By default, the global $_ variable is used for matching.


    You can use a string in a variable of your own for matching: in that case, you
    use the ~= operator with the regular expression. That causes the regular expression
    to match on the string to the left of the = operator.


    You can modify the matching operation by using commands such as i after the regular
    expression—ignore capitalization.'
