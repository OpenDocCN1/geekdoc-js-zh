  md: '# Blocks


    Blocks are compound statements enclosed in { and }. You can use them to improve
    the readability of your code, but they also are required in certain circumstances.
    For example, if statements require a block—a simple statement will not do.


    Blocks can be nested within one another and can refer to variables used in other
    blocks. However, you can declare a variable as local to a block by using my. At
    the first use of a variable, precede it with my and it will be created as a variable
    that has meaning only within the block.


    ```

    my $y = 5;

    ```


    You use my only when you declare the variable (normally its first use). The declaration
    need not explicitly assign a value to the variable: Perl automatically assigns
    default values to variables. (Programmers familiar with other languages that do
    not do this are inclined to explicitly set all variables.)


    ```

    my $y;

    ```


    Delimiters { and } are sufficient to delimit a block. However, you will frequently
    note that programmers add a ; at the end of a block (as is the case on the facing
    page). The ; in fact is a superfluous, empty statement. If you add else or elsif
    statement later on, you will need to remove the ;. This is a matter of sometimes
    fierce debate among programmers.'
