- img_proc: true
  md: '# DBM Basics


    A basic database-like implementation is provided with Perl—it is called DBM. It
    allows you to use a hash in a database-like manner, and it automatically saves
    and restores it between executions of your Perl script.


    You have two basic implementations of DBM—the set of functions dbmopen and dbmclose
    as well as a Perl 5 feature called tying. In addition to these two types of implementations,
    a number of variations use different database products. As a result, the features
    available to you at installation may be greater than those described here.


    In its basic implementation, DBM stores your hash in two files. One has the suffix
    .dir, and the other has the suffix .pag. Hashes contain pairs of items—keys and
    values. The keys are stored in the .dir file (the directory), and the values are
    stored in the .pag file (pages of data). Although this implementation is common,
    it may vary in your environment; do not access .dir or .pag files directly.


    Operations that use only keys can be performed by accessing the .dir file. For
    example, you can retrieve all the keys into an array by using @thehash


    When using DBM, such a process involves using only the .dir file. Similarly, retrieving
    all values (without keys) can be done using @thehash


    It need not access the .dir file. (Neither of these operations necessarily accesses
    the disk files—the hash could be in memory.)'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'A single data record is spread across two files; it needs to be assembled when
    you access it. As with databases, the more efficient approach is to use data from
    only one file—use the keys or values functions.


    ![](img/dbe145bb02591d3632fc1f12880fdd5f_220_0.png)


    .dir file (Directory)

    The .dir file contains the key values.


    .pag file (Data pages)

    The .pag file contains data other than the key.'
