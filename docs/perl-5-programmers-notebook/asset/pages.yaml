  md: "# Creating a Subroutine\n\nYou create a **subroutine** by defining it. A subroutine\
    \ **definition** consists of the keyword sub followed by a name and a block, as\
    \ in the following code:\n\n```\nsub footer {\n  print <<HTMLFooter;\n</body></html>\n\
    \  HTMLFooter\n}\n```\n\nA subroutine definition can appear anywhere in your script.\
    \ Unlike some other languages, it does not need to appear before it is used. However,\
    \ for readable code, place all your subroutines together either at the beginning\
    \ or at the end of the script (the beginning is the standard practice in most\
    \ programming languages).\n\nBy default, subroutines can access the variables\
    \ from your script; your script access variables from the subroutines in it. You\
    \ will see later how to control this access and why that control can be useful.\n\
    \nIf you have a section of code that is used several times in a script, consider\
    \ making a subroutine of it; that way you don't have to repeat the lines of code\
    \ (and debug and test them). You can extend this idea further by putting subroutines\
    \ in separate files (sometimes called **modules**). In that way, commonly used\
    \ code in your subroutines can be used in a number of your scripts.\n\nYou execute\
    \ a subroutine in any of several ways. They will be described later in this chapter.\
    \ One method is shown on the opposite page. For a subroutine named footer, execute\
    \ it by writing:\n\n```\nfooter ();\n```\n\nExecuting a subroutine is sometimes\
    \ called **calling** or **invoking** it."
