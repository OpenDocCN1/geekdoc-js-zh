  md: '# Escape (Control) Characters


    Perl uses sequences starting with \ to represent the non-printing characters.
    (You can also use such sequences to represent printing characters with their octal
    or hexadecimal representations, but this use is unusual.)


    These non-printing characters fall into two categories: some are non-keyable with
    the keyboard that you have. Examples of these characters are è (which you can
    represent using an escape sequence including its hexadecimal value-\x08E),  ®
    (\0xA8), and  ² (\0xB7). These characters can in printed on some devices (not
    all). Other characters represent device actions (like moving to a new line or
    ringing the terminal''s bell) that are not visible.


    The second category of characters can be understood most easily if you remember
    that this character set was devised at a time when most computer terminals were
    teletype devices or devices based on teletypes. They had bells to alert operators
    that messages were coming in, and they printed their output on paper rather than
    on computer monitors. When you run your Perl program on a computer that displays
    its output in a window, some of these characters'' actions may be undefined. Furthermore,
    some of these actions differ from computer to computer.


    The control characters shown in Table 1-1 are the most commonly used ones for
    general purposes. Others that relate specifically to string manipulation and matching
    are shown later in this book.'
  merge: -1
  pgno: 27
