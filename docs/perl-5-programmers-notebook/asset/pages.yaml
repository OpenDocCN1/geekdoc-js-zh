- img_proc: true
  md: '# Defining Formats


    Text that you type into the format is reproduced as you type it; you don''t need
    to put quotes around it or to use \n for a newline character. Just type (and use
    the return key) as you would in a word processing document.


    You can create column headings as shown in the example on the opposite page—Name
    and Value. When you want to insert data into the format, you use a @ or ^ to designate
    a field (a field is the area into which data will be placed).


    The line immediately following the field(s) that you want to print out must contain
    the names of variables to be interpolated and placed in those fields. (As shown
    here, you can use '' characters to enclose a variable name you want to print out.)
    The variables must be in the same order on this line as the field on the previous
    line; that way, Perl knows which data to put where.


    Note that in many programming languages, a write statement specifies the variables
    to be written out. In Perl, the format statement identifies the variables; you
    must place the appropriate values in them before you call the write statement.


    You use special characters to specify the width of the field and the alignment
    of its contents. The < indicates a left-adjusted field; a > indicates a right-adjusted
    field; and a | indicates a centered field. Use as many of these characters as
    you want: <<< is a three-character left-adjusted field; ||||| is a five-character
    centered field, etc. You cannot mix alignment characters within a field—<| is
    illegal.


    If a variable contains multiline text (that is, text containing the \n newline
    character), only the text up to the first newline is written out. See the section
    "Multiline Fields," later in this chapter for how to handle those cases.'
