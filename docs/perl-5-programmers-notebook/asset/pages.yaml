  md: '# Other Operators


    The other operators discussed here let you construct lists and ranges as well
    as reference and dereference variables.


    Lists and ranges are commonly used in Perl—particularly in character manipulation.
    You frequently need to specify a range of values for a list. The range operator
    (two dots) lets you do so. This is useful in two cases:


    +   1. You often need a range of values to control a loop. As you will see in
    the section on loops, you may want to write something like for (1..100). This
    will cause the loop to execute 100 times; it is simpler than writing a traditional
    for statement with explicit increments and tests.


    +   2. You may want to treat a range of values as an array (or elements thereof).
    You can write something like @base10digits=(0..9) to create an array of ten elements—each
    one of the digits from 0 to 9. This improves the readability of your code.


    You have seen how to create variables by assigning a value to a variable. Each
    of those variables has an internal reference name (actually a reference to the
    variable by its computer storage location \). Thus, if you had created the array
