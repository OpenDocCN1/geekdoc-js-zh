    $value = "%26";nIn URLs, hex characters are preceded by %.

    $value = ~ s/%(..)/pack("c",hex($1))/ge;

    Search for % followed by two characters. Substitute with one character

    packed for % followed by the hex value of the two characters that follow the %.

    #print $value;

