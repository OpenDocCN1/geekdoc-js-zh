  md: '# Variable Information on a Web Page (!)


    You often want to include variable information on a Web page. Sometimes that information
    is a counter (as in the previous example). Other times, it is a date, a time,
    a news headline—or even a banner ad. Using server-side includes, you can incorporate
    each of those variable items into a static HTML page. The Perl scripts that are
    executed each can return the appropriate HTML to be inserted into the page.


    However, since server-side includes are not always available—and even when they
    are, they are not always easy for Web page designers to use, you can use the technique
    shown here to produce dynamic Web pages. The trick here is to think backwards:
    instead of how to get variable information (counters, dates, etc.) onto a static
    Web page, use a Perl script to generate all the variable information and insert
    the static HTML using code like that on the opposite page.


    You need to produce HTML for the static portion(s) of your page, but you can do
    so by using any HTML editor. Remember only these three points:


    +   1. Omit the HTML header from these files.

    2. Omit the HTML footer from these files.

    3. Make sure that you end the static portion file(s) with an extra return.


    You can use this example to insert any files that you want onto a Web page. Simply
    change the underlined code to list the files that you want to include. Save this
    script as a .cgi or .pl file (according to your master''s instructions) and access
    it via a browser.'
  merge: -1
  pgno: 231
- img_proc: true
  md: "```\n#!/usr/bin/perl\n\n@thefiles = (\"file1.html\", \"file2.html\");\n  These\
    \ are the files that will be included in this page. See the next example for\n\
    \  another way of including them.\n$pageTitle = $thefiles[0];\n  print <<HTMLHeader;\n\
    Content-type: text/html\n\n<html>\n<head>\n<title>$pageTitle</title>\n</head>\n\
    <body>\nHTMLHeader\n\nforeach $thefile (@thefiles) {\n  open (HTMLFILE, $thefile);\n\
    \  while (<HTMLFILE>) {\n    print $\\$;\n  }\n  Each file is inserted sequentially\
    \ into the dynamic page. You may want to change this to insert one file, then\
    \ call a counter, then print out the date and time, and then insert another file,\
    \ etc.\n}\n\nprint <<HTMLFooter;\n</body></html>\nHTMLFooter\n\nexit 0;\n```"
  merge: -1
