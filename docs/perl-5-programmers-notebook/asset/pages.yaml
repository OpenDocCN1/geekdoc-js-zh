  md: '# Slices


    Elements of arrays can be selected using their subscripts and combined into a
    data structure called a slice. A slice—a collection of array elements—can be used
    as a list. The slice can be assigned to an array identifier—in that case, it becomes
    an array. It can be assigned to a series of scalars on the left-hand side of the
    = sign—in that case, each element of the list is a scalar and the slice no longer
    has an existence of its own.


    You can reference elements of an array just as you would in any other case—by
    an absolute subscript (a number), a scalar that evaluates to a subscript, or by
    the constructor function ..., which indicates a range of subscripts. The slice
    is part of an array; as such, it uses the @ prefix.


    For example, given an array @myArray, you can reference an individual element
    by using


    ```

    $myArray [1]

    ```


    or


    ```

    $myArray [$myScript]

    ```


    You can reference a slice of the array by using


    ```

    @myArray [1, 2, 4..6]

    ```


    or


    ```

    @myArray [$myScript, 99, 32]

    ```


    You can also reference a slice consisting of one element by using @myArray [1].
    Although it appears similar to the scalar array element $myArray [1], it is actually
    a one-element slice.'
