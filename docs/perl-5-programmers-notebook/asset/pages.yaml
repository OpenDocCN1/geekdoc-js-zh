  md: '# # Filling Fields


    A filling field allows you to fill data from a text variable into a format. It
    differs from a multiline field in that you can have more control over it and because
    the data need not have already been broken up into lines with newline characters—Perl
    will break it up for you.


    You define a filling field with the ^ character instead of @. You can then use
    <, >, | to specify whether the field is to be left- or right-adjusted or centered.
    For each line to be printed, you repeat the field. If you have a variable called
    $longtext that you want to print out over four lines, you would use:


    ```

    <<<<<<<<<<<

    $longtext

    <<<<<<<<<<<

    $longtext

    <<<<<<<<<<<

    $longtext

    <<<<<<<<<<<

    $longtext

    ```


    As much of $longtext as fits on the first line will be written out (left-adjusted);
    the same will be done with each successive line. In this case, four lines—no more
    nor less—will be used for the output. You can use - at the beginning of a line
    to prevent it from being written out if it''s blank. Thus the following produces
    at least two but no more than four lines. -- is used to repeat format lines (see
    the opposite page for examples).


    ```

    <<<<<<<<<<<

    $longtext

    <<<<<<<<<<<

    $longtext

    <<<<<<<<<<<

    $longtext

    <<<<<<<<<<>

    ```'
  merge: -1
