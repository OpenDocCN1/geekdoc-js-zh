  md: '# Scalars


    Scalars are simple variables in Perl; each scalar can contain a single value.
    That value can be either numeric or a string—Perl will automatically do any necessary
    data conversion. You can reuse scalars at will, switching their contents from
    number to string as needed.


    The names of scalars start with $. Scalars can be assembled into arrays. Names
    of arrays start with @, but when you refer to a specific element of an array,
    it is a scalar—and you use the $. Thus, @myarray[2] is element number three of
    an array called @myarray. (Perl arrays start at zero in most cases.)


    Before use, a scalar is given a special value—undef (for undefined). You can test
    to see whether a scalar is equal to undef. If it is undefined, you can still use
    it in expressions; it will be interpreted either as an empty string or as zero,
    depending on whether it is used as a string or a number.'
  merge: -1
  pgno: 19
