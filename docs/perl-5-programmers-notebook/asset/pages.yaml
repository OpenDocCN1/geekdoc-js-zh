  md: '# Creating a File


    You create a file by opening it for output. That means using the > >> prefix for
    the file name. A simple file name consists of a name that adheres to the naming
    convention of the computer on which your Perl script is running. A variety of
    conventions may or may not apply:


    +   - The name may be limited to 8 characters and a 3-character suffix—as in test.txt.
    (This is sometimes referred to as the 8.3 convention.)

    - Capitalization may matter: test, Test, and TEST may (or not) be three different
    files.

    - Special characters may be allowed within names. Often _ is allowed and a blank
    is not, which is why you see names such as test_3.

    - Special conventions within names may be implemented by the computer operator.
    Thus, in a school, all files created in Computer Science courses need to start
    with CS—as in Ctest_1, CSlab, and so forth. Or, within a class, all files may
    need to start with a student''s initials.


    If there is any possibility that your Perl script will run on a variety of computers,
    you should adhere to the most stringent convention: use 8.3 file names and act
    as if capitalization matters. Furthermore, do not use spaces within your file
    names.


    By default, the file is created in the same folder (directory) as your Perl script.
    You can also provide a fully specified path to the file, listing the folders and
    subfolders (directories and subdirectories) in which it resides. Placing files
    in other folders or directories can pose problems:


    +   - You may not have access to all directories on your computer; you may not
    be able to create directories at will.

    - Directory notation varies from operating system to operating system (see the
    example on the facing page).'
