  md: '# Random Access


    Each opened file has a pointer indicating where the next access (reading or writing)
    will take place in the file. (For more information, refer to the diagrams in "Using
    Files," in Chapter 8.) The file accesses that have been described so far in this
    chapter are called serial I/O or sequential I/O—they start at the beginning of
    the file and continue to the end.


    Random access allows you to jump around in the file, reading and writing wherever
    you choose. This ability is particularly useful when you want to update some data
    in a file. If you read a number from a file, increment it, and write it back,
    you will write the incremented number after the first number—not on top of it.


    In order to avoid this problem, you need to reposition the file to in front of
    15, not in back of it. In "Appending to a File," earlier in this chapter, you
    saw how to do so by closing and reopening the file. You can use the seek function
    to accomplish this more easily (and more efficiently).


    The seek function takes three arguments:


    +   1. The first is a filehandle.

    2. The second is the position in the file.

    3. The third parameter specifies how the position is to be calculated. It is one
    of three constants. SEEK_SET interprets the position parameter literally (starting
    from 0) as a position in the file. SEEK_CUR is an offset from the current position—that
    number of characters forward (positive number) or back (negative number). SEEK_END
    is an offset from the end of the file. It is almost always a negative number (counting
    backward from the end of the file). To use these constants, you must import the
    POSIX module; otherwise use the values 0, 1, and 2.'
  merge: -1
