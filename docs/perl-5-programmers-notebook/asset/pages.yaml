  md: '# The Counter Subroutine


    In Chapter 8, you saw how to read, write, and update files; you also saw how to
    handle file sharing and locking so that several people can access a single file
    at (almost) the same time. The examples given in that chapter included a Web counter
    that was almost complete. It is completed here.


    The code presented on the opposite page is a subroutine that implements a Web
    page counter. The next section shows you how to actually use that code on your
    own Web page.


    If you compare this subroutine with the code shown previously, you will note that
    it contains no error messages. Instead, it returns either a value or an error
    message to the script that called it, because the end-user who is browsing a Web
    page doesn''t see error messages from a Perl script that is being execute by the
    Web server. The Web page designer must decide how to handle errors that may occur
    in processing.


    This goal is accomplished by storing the result of the open function:

    $fileOpen = open (COUNT, "+\$countStats");


    Subsequent lines of code check to see whether $fileOpen is true (so that further
    work can be done) or whether $fileOpen is false (so that an appropriate message
    can be returned). This check is common—and good—programming practice. It may seem
    boring to keep writing this code, and you may think that some operations can never
    fail, but this style of programming is the most stable and robust.'
  merge: -1
  pgno: 227
- img_proc: true
  md: "# The Counter Subroutine\n\n```\n#!/usr/bin/perl\nuse POSIX;\nsub counter {\n\
    \    $countStats = \"countr.txt\";\n    $fileOpen = open (COUNT, \\+\\$countStats\"\
    );\n}\n\nif (!$fileOpen) {\n    $fileOpen = open (COUNT, \\>$countStats\");\n\
    \    chmod (0666, $countStats);\n}\n\nif ($fileOpen) {\n    flock ($countStats,\
    \ 2);\n} else {\n    return \"bad $fileOpen\";\n}\n\n$count = <COUNT>;\n$returnCount\
    \ = $count;\n$count++;\n\nseek (COUNT, 0, SEEK_SET);\nprint COUNT $count;\nflock\
    \ ($countStats, 8);\nclose (COUNT);\nreturn $returnCount;\n\n#$count = counter();\n\
    #print \"Count: \", $count;\n\n#exit 0;\n```\n\nYou need to store the counter\
    \ value in SreturnCount since Scount will be incremented in preparation for writing\
    \ it to the file for next time.\n\nBoth the seek and the print could fail and\
    \ be tested; however, by this point, the SreturnCount value has been obtained.\
    \ Any errors will be caught the next time the subroutine is called.\n\nYou can\
    \ test the subroutine by uncommenting these lines and running this script on its\
    \ own."
  merge: -1
  pgno: 228
