  md: '# Opening a File


    Chapter 7 showed you how to interact with the user dynamically—through the keyboard
    and monitor. In this chapter, you see how to interact through files. As with most
    programming languages, you can use Perl to read, write, and otherwise manipulate
    files. The basic principles are the same as for most languages, but a few Perl
    touches are possible.


    Before you can do anything with a file, you need to open it. You use the `open`
    function for that purpose. The open function takes two arguments:


    +   1. The `filehandle` is the variable that you use in your program to refer
    to the file. It should be meaningful to you (FILE1 is a bad choice; EMPLOYEES
    is good). By convention, Perl file handles are ALLCAPS with no embedded spaces.

    2. After the filehandle comes the name of the file on disk. This is a standard
    disk file name—it may include a drive identifier, a path, and an extension.


    Once the file has been opened, you refer to it by the filehandle. This allows
    you to do things such as rename the file and still be able to refer to it. (The
    filehandle is unchanged when you rename the file itself).


    The name of the file is a string, and it may be a computer-specific string. For
    example, f:\employee.txt is likely to be a file on a Windows computer—one that
    is configured to have a drive identifier identified as f. In contrast, /tmp/employee.txt
    could be a file on a Unix compute (note the change in slash direction). Employees.txt
    is a valid filename on the Macintosh, but it is not valid on early windows operating
    systems, which are limited to eight letters in the main part of the file name.'
