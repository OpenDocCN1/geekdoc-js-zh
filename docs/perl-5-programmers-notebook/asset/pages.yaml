  md: '# Predefined Variables


    Perl has a number of predefined variables that you can use to access system information.
    Some are read-only, but you can set others. (This is a standard way to set options
    from within a Perl script.) Perl''s predefined variables adhere to Perl''s naming
    conventions: many are scalars, but some are arrays and hashes.


    The English Perl module allows you to use meaningful names for many of the predefined
    variables. If you use the English names, you must specify that the English module
    is to be loaded; you do so by including use English at the top of the program,
    as in this script which prints the current version of Perl:


    ```

    #!/usr/bin/perl

    use English;

    print $PERL_VERSION, "\n";

    ```


    Although a small speed penalty is incurred when using the English module, its
    benefits are usually worth it.


    If you use the Perl abbreviations, you do not need to use the English module:


    ```

    #!/usr/bin/perl

    print $], "\n";

    ```


    Using predefined variables, you can change many of Perl''s defaults. For example,
    although Perl arrays normally start at 0, in fact, the starting number for arrays
    is stored in the $@ predefined variable. If you change it to 1, your arrays will
    start at 1. (This may confuse people who read your program—including yourself.)


    Predefined variables with general applicability are shown in Table 1-2; others
    are shown in the chapters where their concepts are explained.'
  merge: -1
