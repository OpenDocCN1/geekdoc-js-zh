- img_proc: true
  md: '# File Sharing


    Files can be shared among users and programs as well as among different computers
    on a network. If you are used to working only on a personal computer, you may
    not have had this experience, but it is an important part of developing networked
    systems. Your ability to access a file depends on its mode—its permissions and
    who you are with regard to the user, user''s group, and the rest of the world.
    However, permissions are basically a static control: if you have the appropriate
    permission you can access the file at any time.


    Locking is a dynamic control: it defines who can access a file at a specific time.
    It is generally used to allow controlled updating of a file (sometimes called
    single-threading). Consider the case of a Web page counter. If you update a file,
    read the previous value from it, and then write it out, in the interim another
    user might do the same thing. One of the updates may be lost. The solution is
    to lock the file briefly to prevent someone else from accessing it. You use the
    flock function to do this. The function takes two arguments: a filehandle and
    the operation. The operation parameter has four values:


    +   1. 1 (mnemonic LOCK_SH) requests a shared lock. It allows you to access the
    file even though others may also have access. flock waits until the lock is available;
    it returns true.


    +   2. 2 (LOCK_EX) requests an exclusive lock. You cannot get it if anyone else
    has access at the time, and no one else can access while you have an exclusive
    lock. flock waits until the lock is available; it returns true.


    +   3. 4 (LOCK_NB) requests a nonblocking lock. Add its value to 1 or 2 to get
    a nonblocking shared or exclusive lock. If the lock can''t be obtained immediately,
    flock returns a value of false.


    +   4. 8 (LOCK_UN) unlocks a lock.'
  merge: -1
  pgno: 179
