  md: '# Returning Data from a Subroutine


    You''ve seen how to get data into a subroutine and how to protect it from changes
    (as well as to force it to be changed). The next issue is how to get data out
    from a subroutine.


    You have four primary methods:


    +   1. If you pass a variable by name or reference (that is, you modify the elements
    of @_ directly), changes to the variables passed in to the subroutine are made
    to those variables in the main script or other subroutines.

    2. If you use global variables in the subroutine (that is, variables not declared
    my or own), they are accessible in the main script and you can set them in the
    subroutine and use their data elsewhere.

    3. You can output data by printing to a file or the user''s terminal. (Such is
    the case in the subroutines shown in “Creating a Subroutine,” earlier in this
    chapter that generate HTML code).

    4. A subroutine can return a value. Subroutines are called functions in some languages
    when they do so.


    The first three methods have been discussed previously in this chapter. The fourth
    is discussed here.


    The return statement transfers control back to the code that called the subroutine.
    If it is followed by a value, that value is returned and can be assigned to a
    variable, printed out, or used as you would any other value.'
  merge: -1
  pgno: 195
