  md: '# # Closing a File


    You need to explicitly open a file so that Perl knows the title of the file on
    disk and so that the operating system can be told whether you are reading, writing,
    updating, or appending to the file.


    Each file that is opened needs to be closed. By default, Perl (like most programming
    languages) causes opened files to be closed when the program terminates. Nevertheless,
    you should get in the habit of explicitly closing your files using the `close`
    function. Here are the major reasons:


    +   * While a file is open, it uses some memory and system resources. Closing
    files when you are finished with them (and not opening them before you need to
    use them) will reduce the amount of memory your program uses.

    * Data may not be written to a file when you think it is. The operating system
    sometimes stores up such data and writes it out in batches (sometimes called “flushing”).
    However, when you close a file, any unwritten data is immediately written to disk.

    * The global variable `$` keeps track of the number of lines read from files.
    When you close a file, `$` is set back to 0. Otherwise, it continues being incremented
    with each additional read.


    If you open a file that is already open, you will implicitly close it and then
    reopen it. In the case of an input file, that means repositioning the file to
    the beginning. In the case of an output file (>) that action means destroying
    the existing file and overwriting it with a new (blank) file.'
  merge: -1
