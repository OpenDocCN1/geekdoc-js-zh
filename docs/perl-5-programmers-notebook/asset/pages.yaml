  md: '# Arithmetic Operators


    Perl''s operators provide the same functionality that you would expect from any
    modern programming language—more in some cases. If you are familiar with C, you
    will find Perl to be very simple.


    Like most modern programming languages, Perl is left-handed—that is, a computation
    involving terms (operands) and operators is written to the right of an equal sign;
    the result is then stored into a variable on the left of the sign, as in


    ```

    y = (m * x) + b;

    ```


    Unlike algebraic formulas, terms must always be separated by operators. You can
    write


    ```

    y = mx + b

    ```


    in algebra, but a computer language parser needs a multiplication sign between
    the m and x so that it knows that it is not a new variable called mx.


    Statements are normally parsed from left to right, and operations are performed
    in that order. The exceptions are that certain operators have higher precedence
    than others—for example, multiplication and division are done before addition
    and subtraction. Furthermore, terms enclosed in parentheses are evaluated before
    other terms.


    In addition to standard arithmetic operators, Perl provides an exponentiation
    operator (**) as well as div (/) and mod (%) operators for integer division.'
  merge: -1
