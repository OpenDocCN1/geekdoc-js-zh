  md: '# Specifying Widths for Formats in Format Control Strings


    You can specify the width of format elements by inserting a number flag before
    the formatting. The number can be either the total width of the field or the width
    of the decimal portion of the field—or both.


    In keeping with other programming languages, Perl uses the conventions shown in
    Table 7-2. If a single number is given, it is the field width. If a number is
    preceded by a decimal point, it is the number of positions to the right of the
    decimal point. Thus, 10 is a field width of 10, and .4 requires 4 digits to the
    right of the decimal point. You can specify both, as in 10.4.


    You can also insert either or both of those numbers dynamically—as in 10.* or
    even *.* When the output is being created, a list element from the printf statement
    is placed in the position of the *. You can use this flexibility to vary the number
    of digits in a number. If the value of the number is relatively low, you can show
    more decimal positions. For larger numbers, you can decrease the number of such
    positions.


    # Table 7-2. Widths in Formats


    | Sequence | Meaning |

    | --- | --- |

    | number | minimum field width |

    | .number | "precision": digits after decimal point for floating-point, maximum
    length for string, minimum length for integer |

    | * | same as number, but value is read in list of data to be output |

    | .* | same as .number, but value is read in list of data to be output |'
  merge: -1
