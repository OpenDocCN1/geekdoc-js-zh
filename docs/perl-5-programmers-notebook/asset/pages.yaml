  md: '# # Site Searching


    The last example of dynamic Web pages is a page that implements searching for
    your site. It is remarkably easy, since it builds on the structures previously
    shown in this chapter.


    This script reads a directory and then searches through it looking for a text
    string. The directory and the text to search for are specified at the top of the
    script. (In Chapter 13, you will see how to use forms to easily pass information
    such as this to a Perl script).


    The directory is read into an array; this approach is preferable to keeping it
    open while you search through the files. It enables other people to access the
    directory and to add and delete files to or from it.


    Next, each file is read using a while loop. The text is searched for using a regular
    expression: if it is found, an HTML link is written out. Such links are of the
    form:


    ```

    <A HREF="filename">filename</a>

    ```


    where filename is the name of the file.


    Note that heavy-duty searches are not done in this way. For those searches, the
    site is indexed and important words or phrases are extracted. This involves scanning
    through each of the files in the manner shown here. Once the key words and phrases
    have been extracted, searches use only those index files rather than scanning
    through the entire site each time.


    You also may want to modify the loop that searches through @the-Files. You can
    use a regular expression to exclude file names starting with . or ending with
    certain suffixes. In addition, it would be a good idea to check whether the files
    themselves are subdirectories before opening them.'
  merge: -1
  pgno: 239
