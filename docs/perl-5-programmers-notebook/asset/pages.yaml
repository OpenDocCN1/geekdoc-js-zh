  md: '# Cookies


    Cookies are used to store data from Web pages on a user''s computer. A common
    use is to store ID numbers and passwords so that a person doesn''t have to re-enter
    them each time a site is visited. Cookies are specific to a Web page and the computer
    on which they are stored: if two people share a computer, their cookie data may
    be mixed up.


    Browsers let you control what cookies are stored on your computer; you cannot
    assume that every user will accept cookies. Likewise, many Web pages let users
    select an option as to whether or not cookies with log-in information will be
    stored.


    Cookies are set as part of the HTTP header of a Web page. That is the code that
    appears before the line at the top of Web pages:


    ```

    Content-type: text/html

    ```


    To set a cookie, you use the code Set-Cookie: followed by a string of name/value
    pairs, as in this example:


    ```

    Set-Cookie: userid=test, secondvar=12345, third=ABCD

    ```


    The names and values can be anything you want as long as they contain no , or
    ; characters.


    To access a cookie, you use the $ENV{''HTTP_COOKIE''} variable.


    Note that setting a cookie is done only in the HTTP section at the top of a page.
    That means that in order to set (or update) a cookie, you need to generate a page.
    Often a “Thank you” page is used to set a cookie. After you have ascertained the
    user''s name—as from a guest book form—you generate a page that says “Thank you,
    XXX” or “Welcome,YY.” At the top of that page, a cookie is set with the user''s
    name.'
  merge: -1
