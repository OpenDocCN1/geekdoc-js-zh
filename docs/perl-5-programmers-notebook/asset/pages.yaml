  md: '# Operator Precedence


    Perl expressions can combine many operators. As in common arithmetic, the order
    in which you perform operations can affect the outcome. For example, consider
    this equation:


    ```

    y = 5 + 2 * 4;

    ```


    If you perform the operations from left to right, you get 28 (5 + 2 = 7, 7 * 4
    = 28). If you perform them in the reverse order, you get 13 (2 * 4 = 8, 8 + 5
    = 13).


    Like all programming languages, Perl has rules to determine how expressions are
    evaluated. There are three sets of rules:


    +   1. Operator precedence. The expression is scanned to see what operators are
    used. Certain operators are evaluated first. For example, multiplication is performed
    before addition. (Perl would evaluate the expression above to 13.)


    +   2. Parentheses. Expressions within parentheses are performed before those
    not parenthesized. In the case of complex expressions, you can nest sets of parentheses
    within other sets to further control processing. (In the expression above, you
    can force a result of 28 by writing `$y = (5 + 2) * 4.`) Within each set of parentheses,
    the operator precedence applies.


    +   3. Left-to-right. For operators with the same level or precedence, they are
    evaluated from left to right.


    These rules provide an unambiguous way of evaluating expressions.


    Note that relying on these rules does not always generate readable and maintainable
    code. Use parentheses to make clear which parts of your expression need to be
    evaluated first—even if the operator precedence would take care of it. Furthermore,
    consider breaking complex expressions into several statements.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'Table 2-1 shows Perl''s operator precedence. If you have a question as to which
    of two operators is evaluated first, find them in the table. The one that is higher
    in the table is evaluated first. If the operators are at the same level (or if
    they are the same operator), the associativity rules apply—they are evaluated
    from the left or from the right according to the rule for the operator.


    # Table 2-1: Operator Precedence


    | Associativity | Operators |

    | --- | --- |

    | left | terms, list operators, array subscripts, functions, subroutine calls
    |

    | left | -> |

    | N/A | ++ -- |

    | right | ** |

    | right | ! ~ \ and unary + - |

    | left | = ~ |

    | left | * / % x |

    | left | + - |

    | left | << >> |

    | N/A | named unary operators |

    | N/A | <> <= >= gt le ge |

    | N/A | == != <= eq ne cmp |

    | left | & |

    | left | | ^ |

    | left | && |

    | left | || |

    | N/A | .. |

    | right | ?: += -= *= = etc. |

    | left | , => |

    | N/A | list operators (rightward) |

    | right | not |

    | left | and |

    | left | or xor |'
