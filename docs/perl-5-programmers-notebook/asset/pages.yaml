  md: '# Including the Counter in a Web Page


    You have a number of ways to include the counter in a Web Page.


    At the top of the opposite page is one method. You place the subroutine from the
    previous page inside a Perl script and then call it at the end of that script.
    The entire script is executed by using a server-side include in a Web page. If
    the name of the script is counter.cgi, that would look like this:


    ```

    <<!-- exec cgi="counter.cgi"-->

    ```


    The disadvantage to that method is that server-side includes are not available
    on all Web servers. The advantage is that you can place it within any Web page
    that you want and users do not have to use a non-standard address.


    At the bottom of the opposite page is another method. Here, the Perl script is
    a shell that generates an HTML file. As shown previously, this script prints out
    the standard HTML header and the standard HTML footer. At the beginning of the
    script, you specify a Perl file containing HTML code without the standard header
    and footer. (The variable name is thefile.) The entire file is printed out between
    the header and footer. In addition, you can call a counter subroutine or any other
    code that you want.


    The disadvantage to this method is that it uses a non-standard address; it might
    be something like www.mydomain.com/index.cgi. Some Web servers let you configure
    it so that index.cgi is automatically accessed whenever people type in www.mydomain.com.
    You will need to consult your system administrator for more information. The advantage
    of this method is that you have a very powerful mechanism to produce dynamic Web
    pages.'
  merge: -1
  pgno: 229
- img_proc: true
