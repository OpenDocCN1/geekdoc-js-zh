  md: '# A Web Counter Part 1: Code to Update a Counter in a File


    ```

    #!/usr/bin/perl

    use POSIX;

    $countStats = "count.txt";


    open (COUNT, "+\$countStats") || die "Cannot open: $!";

    The file is opened for reading with writing also permitted. It must exist or an
    error is generated.


    flock ($countStats, 2);

    Lock the file exclusively: you''re going to update its data, so you don''t want
    anyone reading it until you''re finished.


    $count = <COUNT>;

    Read the current value.


    $count +=;

    Update it by 1.

    seek (COUNT, 0, SEEK_SET) || die "Cannot seek: $!";

    Reposition the file to the beginning so that you don''t write the new value

    AFTER the old one.


    print COUNT $count || die "Cannot print: $!";


    flock ($countStats, 8);

    Release the lock as soon as possible. If you are going to display the counter

    on a Web page, put that HTML code here—after the lock has been released.


    close (COUNT) || die "Cannot close: $!";

    ```


    If you lock a file, use the least locking you can for the shortest period of time.
