- img_proc: true
  md: 'Your personal computer establishes a telecommunications link (often over a
    modem) to an Internet service provider or host. That link is referred to as a
    TCP/IP link. Once that link has been established, your browser can connect to
    a Web server on the Internet. (The same link can be used for your e-mail software
    to connect to a mailer.) The Web server can be located on the same computer as
    the one to you have connected directly with TCP/IP; alternatively, it can be on
    another computer. If it is, your Internet service provider or host takes care
    of making that further connection.


    When you request a Web page through your browser, you use http (HyperText Transmission
    Protocol). That is why you type in http at the start of a Web page address. The
    full address is called a URL (uniform resource locator). The protocol—http—specifies
    the way in which the data is to be sent to you. The rest of the address specifies
    what is to be sent to you.


    The format for what is sent is HTML (Hypertext Markup Language)—the layouts, texts,
    and graphics that your browser decodes to display the Web page. The Web server
    software is responsible for locating the resource (the what), extracting it in
    HTML, and sending it to you using http. The suffix of the resource name helps
    the Web server to know how to extract the HTML.


    If it is .html or .htm (depending on the Web server''s configuration), a file
    on the Web server is assumed to contain HTML formats and the file is simply transmitted
    to you. If the suffix is .cgi, the Web server may be configured to assume that
    this is an executable CGI (common gateway interface) program; it runs the program
    and directs the program''s output to you via http. Other standards may be implemented
    on specific Web servers: commonly a suffix of .exe represents a non-CGI program
    whose output nevertheless is HTML. If you have a Web site, you must check with
    your Internet provider to know what suffixes you can use. You may also be limited
    to the directories in which you can place programs.


    A Perl script whose name ends in .cgi or .pl can be accessed in this way; its
    output is assumed to be HTML.'
