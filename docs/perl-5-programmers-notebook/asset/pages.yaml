  md: '# Reading a File


    Having opened a file, you can read it in a number of ways. (Of course, as with
    all i/o functions, you will test the result each time you attempt to read.


    A variety of tools is available to you when you want to read a file. One of the
    most common is the one you have seen before with STDIN—you can assign <STDIN>
    to a scalar, and Perl will read from the terminal until you press the return or
    enter key (generating a newline character). If you have a filehandle MYFILEHANDLE,
    you can assign <MYFILEHANDLE> to a scalar and the same process will occur: Perl
    will read until a newline character and place the entire string (including the
    newline) in the scalar.


    You can also read a single character from a file using the getc function. This
    returns the next character from the file. it is most useful when you need to read
    one character from the user at a keyboard. you you need to inspect individual
    characters of input, read the entire record and use Perl''s string and character
    manipulation routines to parse it.


    Finally, a read function is available in Perl. It takes a minimum of two arguments
    and a maximum of four:


    +   1. You specify the filehandle from which you want to read.


    +   2. You specify the scalar variable into which data is to be placed.


    +   3. You specify the maximum number of bytes to be read. The actual number of
    bytes read is returned as the result. A failure returns undef, not 0.


    +   4. You specify the starting position in the record (optional).'
