  md: '# # Logging Web Access to a DBM


    You can use a DBM to store a log of accesses to a Web page. You can use some of
    the CGI variables previously discussed (“Installing a Perl-Created Web Page” in
    Chapter 7) to generate the log entries.


    (This example is the sort of use you can make of a DBM: be aware that actual logs
    are part of most Web server software. Also, implementing a log in this manner
    can slow down your server.)


    In order to use this log, the script needs to be called automatically. You have
    several ways to do so. (You will find more details in “Including the Counter in
    a Web Page” in Chapter 12.)


    You can place this code within a dynamic Web page that is accessed with an address
    that ends in .cgi or .pl (according to your server conventions). Such a page should
    also display some information—such as your home page (otherwise, no one would
    access it).


    On many servers, you can use server-side includes: an HTML feature that allows
    you to run Perl scripts from within a standard HTML page. Not all servers have
    this feature enabled—check with your system administrator. If it is enabled, the
    format for a server-side include is


    ```

    <!-- exec cgi="yourscriptname.cgi"-->

    ```


    Your script may need to be in a certain directory (such as cgi-bin). This information
    should be available from your system administrator; often it is posted on your
    server.'
  merge: -1
