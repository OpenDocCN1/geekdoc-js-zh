  md: '# Assignment Operators


    The primary assignment operator is =, as in


    $y = 4;


    In addition to assigning literal values to variables, you can assign results of
    computations to variables, as in


    $y = $a + $b;


    In the case where the same variable is used as the result and as the first term,
    you can combine both operators. Thus, instead of writing


    $y = $y + $b;


    you can write


    $y += $b;


    This can be used in any case where the same variable name appears immediately
    before and after the =. (In this case, $y is assumed to be both immediately before
    and after the =).


    Unlike some other languages, assignments can appear within expressions—that is,
    to the right of another assignment operator. Thus, the following is legal:


    $y = 2 * ($b = 2);


    Because the $b = 2 clause is parenthesized, it is evaluated first—and $b is set
    to 2. $y is then set to 4 (2 x2). If you are not used to this style, it may be
    hard to explain apparently bizarre behavior of expressions.


    Like C and Java, Perl provides autoincrement and autodecrement operators—++ and
    --, respectively. These automatically add or subtract 1 to or from a term.'
  merge: -1
