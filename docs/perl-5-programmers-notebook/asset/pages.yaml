  md: '# Predefined File Report Variables


    Perl uses global variables for report writing and formatting. Default values exist
    for all of them and you do not need to worry about them, but you can use them
    as you see fit (see Table 10-1).


    As always, you need to include the english.pl library (use English) to access
    the English-language versions of these variables.


    Table 10-1. Predefined File Report Variables


    | English | Perl | Meaning |

    | --- | --- | --- |

    | $FORMAT_NAME | ~ | The current format for the currently selected filehandle.
    If you set it, store the previous value and restore it after you are finished.
    |

    | $FORMAT_TOP_NAME | ^ | The current top-of-page format for the currently selected
    filehandle. If you set it, store the previous value and restore it after you are
    finished. |

    | $FORMAT_PER_PAGE | $= The number of lines on a page. The default is 60, but
    that is usually too many for displays on computer monitors that are wider than
    they are tall. |

    | $FORMAT_PAGE_NUMBER | $% | The number of times this top-of-page format has been
    called. You can use it as a page formats and filehandles, it may be wrong. Always,
    if you rely on this variable, store whatever value it have, set it to 0 (before
    page 1), and then restore the old value. |

    | $FORMAT_LINES_LEFT | $- | Lines left on the current page. Set to 0 to cause
    the next write to be at the top of the next page. |

    | $FORMAT_LINE_BREAK_CHARACTERS | $: Characters to break text for filling fields.
    Starts being by \n and -. If you want to break on other marks of punctuation,
    add them. |'
