  md: '# Ordered Arrays


    When you use an array to store a variety of items, you use this type of access.
    For example customerinfo[0] might contain a name, customerinfo[1] an address,
    and so forth. By collecting the information into an array, you can access each
    item individually and also access the array as a whole (using @customerinfo in
    this case). That capability lets you easily store, print, or move the array from
    one place to another without manipulating each individual item.


    When used in this way, an ordered array is like the C language struct; however,
    the struct identifies its elements by name (not number) and each element is typed,
    whereas Perl arrays can contain elements of any type.


    Ordered arrays may also contain similar data items (student names, for example)
    that are ordered using their subscripts. Thus, if you ordered an array of student
    names alphabetically, students[0] might be Alexis, students[1] could be Artemis,
    and so forth.


    Perl does not maintain anything beyond the array storage: if you decide that the
    third element of an array is an address, you must maintain that. If you decide
    that your array will be ordered alphabetically, your responsibility is to create
    and maintain that logic.


    With ordered arrays, you often iterate through the elements of the array until
    (or while) some condition is met. Since the elements are ordered, you can assume
    that the condition will change in some way connected to the order. If names are
    alphabetized, "Mohammed" will follow "Mikael."


    Remember that all Perl arrays are declared in the same way: what you do with the
    array determines whether it is an ordered array or not.'
