    with accesses to the global object, and later on, we will present a revised operation
    to reroute these accesses to a virtual global object. When an identifier expression
    does not have a corresponding variable declaration binding, the expression is
    considered as a global variable access. compile[[x_g]] transforms a global variable
    access x_g into an auxiliary function call Loadvar("x_g") defined as follows:


    ```

    1 Loadvar = λ(id).{

    2   Get(global, id);

    3 }

    ```


    The variable global designates the global object. Note that the semantics of a
    global variable read searches the global object and its prototype chain.


    We consider a translation of a field lookup operation compile[[x = e1[e2]]] where
    x is a local variable. The translated code to JSexplicit is as follows:


    ```

    1 fn = λ(o,s).{

    2   if (o === null || o === undefined)

    3     throw TypeError();

    4   s = ToString(s);

    5   x = Get(o, s);

    6 };

    7 fn(compile[[e1]], compile[[e2]])

    ```


    A field lookup operation first ensures that the given receiver o is a coercible
    value. If the receiver object is null or undefined, it throws a TypeError exception.
    Otherwise, the value is either an object value or able to be converted to an object
    value in the auxiliary function Get. Then, it converts the field name designator
    s to a string value by calling an operation ToString, and we use corresponding
    auxiliary function ToString presented in 6a. At last, it uses an auxiliary function
    for a field lookup operation Get and assigns the result to the local variable
    x.


    Rewriting explicit field accesses is not enough to prevent implicit field accesses
    as JavaScript accesses fields implicitly in many situations. For instance, let
    us consider the binary operation e1-e2. According to the JavaScript semantics,
    e1 and e2 have to be converted to a number before applying the subtraction. How
    to make the conversion depends on the type of e1 and e2. If it is an object, its
    valueOf field is used, That is, if one of e1 and e2 is an object, the subtraction
    operation involves implicit access to the valueOf field. This access has to be
    intercepted and replaced as explicit field accesses. For that, a translation of
    compile[[e1-e2]] to JSexplicit is defined as follows:


    ```

    1 fn = λ(lhs, rhs).{

    2   lhs = ToNumber(lhs);

    3   rhs = ToNumber(rhs);

    4   return lhs - rhs;

    5 };

    6 fn(compile[[e1]], compile[[e2]])

    ```


    The auxiliary function ToNumber presented in Figure 6b guarantees that the result
    is a number value. Thus, the actual subtract operation lhs - rhs at line 4 of
    the translated code does not involve implicit field access.


    In JavaScript, a function invocation is considered as a method invocation if and
    only if the syntactic form of the function is an object field access. That is,
    "obj.met(arg)" is a method invocation and the pseudo argument this will be bound
    to obj in the body of obj.met. On the other hand, in "var f=obj.met; f(arg)" is
    not a method invocation but as a regular function call and this will not be bound
    to obj. This difference between function invocation and method invocation demands
    the JSexplicit compilation to specially treat method invocation. We consider a
    translation of a method call expression compile[[x = e1[e2](e3)]] where x is a
    local variable as follows:


    ```

    1 fn = λ(o,s).{

    2   var f;

    3   f = compile[[o[s]]];

    4   return ◁apply(f, o, compile[[e3]]);

    5 };

    6 x = fn(compile[[e1]], compile[[e2]]);

    ```


    First, the syntactic part e1[e2] is transformed as regular field lookup operation.
    Second, when the function is found in the object, the function is invoked in such
    a way that e1 (the first argument o) is bound to this and e3 as the argument.


    # 4 IMPLEMENTATION: SecureJS


    In this section, we present the SecureJS implementation. SecureJS compiled programs
    execute as if they were in isolated realms, which do not share any references
    with other realms. Thus, if a compiled program does not export value to others,
    executions of the compiled program preserve total memory isolation, and it guarantees
    that running a compiled program with other uncompiled programs does not interfere
    with each other.


    This isolation relies on a secure runtime environment, which consists of an isolated
    virtual global object and intrinsic objects, and secure primitive operations,
    which reroute field accesses for the global and intrinsic objects to corresponding
    virtual ones. This section details the implementation the secure primitive operations
    and the runtime environment.


    # 4.1 Secure Primitive Operations


    The SecureJS compiler rewrites JavaScript programs in such a way that no expression
    can ever access, explicitly or implicitly, objects created by uncompiled code.
    For that, the compiled code replaces normal object field access and normal prototype
    chain lookups with custom operations that enforce memory isolation. Let us detail
    these operations.


    First of all, explicit references to global variables must be replaced with accesses
    to secure objects that proxy these global plain objects. For that, the compiler
    transforms a global variable access x into a library function call SJS.Loadvar("x")
    defined as:


    ```

    1 SJS.Loadvar = function SJSloadvar(id) {

    2   return Get(SJS.global, id);

    3 }

    ```


    The object SJS.global is a secure version of the global object. It ensures that
    all the interactions with the global object will not be exposed to the uncompiled
    code.


    Second, object field accesses have to be intercepted in order to prevent the normal
    prototype chain inspection to access objects of the uncompiled environment. For
    that, we provide a secure version of GetProperty auxiliary function defined as:


    ```

    1 SJS.GetProperty = function SJSGetProperty(O, P) {

    2   var prop;

    3   prop = SJS.getOwnPropertyDescriptor(O,P); /* (1) */

    4   if (prop !== undefined) return prop; /* (2) */

    ```'
