- md: '## 5.1 Experimentation Settings


    We implemented SecureJS on top of the front-end of the open-source JavaScript
    engine Hop compiler [12]. SecureJS takes a JavaScript program and generates an
    ECMAScript 5th specification compatible JavaScript program. Executions are done
    with state-of-the-art JavaScript engines V8, Hop, and JerryScript.


    We use the Test262 test suite and use the es5-tests branch from the github repository.
    Since the test programs of the Test262 test suites check the program states and
    flows by means of the assert function, the comparison of the resulting state confirms
    the equivalent execution of the programs. The Test262 programs also test the semantics
    of all the ECMAScript built-in functions and the semantics of the strict mode
    functions. We consider 10490 numbers of the test programs as our target test programs
    of the Test262 test suite and exclude 1082 numbers of the test programs from the
    target programs. In particular, we excluded tests using the eval function, the
    with statement. SecureJS does not support eval and with. Additionally, we excluded
    tests checking syntactic errors. The latest version of ECMAScript specifies less
    strict syntactic rules than the syntactic rules specified in ECMAScript 5th. Since
    the front-end parser of SecureJS supports the latest ECMAScript specification
    for compatibility, it parses the program that follows the latest ECMAScript specification
    and translates it into an ECMAScript 5th compatible program when possible.


    ## 5.2 Testing Semantic preservation


    The goal of this experiment is to show that SecureJS compiler preserves the semantics
    of an original program. For that, we compiled target test programs of the Test262
    suites and ran them on V8, Hop, and JerryScript JavaScript engines, and we checked
    whether the resulting states of both the program and the corresponding compiled
    program are equivalent.


    Among 10490 numbers of the test programs, V8 passed 10386 successfully. 104 failed
    because of the semantics differences between the source language test 262 assumed
    and the latest JavaScript evolutions V8 supports. SecureJS preserves this result.
    That is, the 10386 successful tests remain successful after SecureJS compilation,
    and the 104 failed tests remain failed. Hop passed 10414 numbers of the test programs
    and failed in 76 tests, and JerryScript passed 10474 numbers of the test programs
    and failed in 16 tests. SecureJS also preserves these results.


    ## 5.3 Testing Memory Isolation


    The SecureJS compiled programs run as if they were running in an isolated realm.
    If the compiled programs do not intentionally export values for interaction with
    others, the compiled and other uncompiled programs cannot reference each other.
    In this section, we test that such SecureJS compiled programs that do not use
    export comply with this isolation property. For that, we empirically verify that
    compiled programs ever access objects outside the controlled realm.


    For the experiment, we modified the Hop and JerryScript implementations to log
    all accesses to the [[Prototype]] field that is needed to walk prototype chains.
    We have used two radically different JavaScript implementations in order to reduce
    the probability of unnoticed [[Prototype]] accesses that would be removed by the
    JavaScript engine''s optimizer, independently of SecureJS. In addition, we modified
    the JerryScript engine also to log all accesses to global and intrinsic objects,
    which are outside of the controlled realm.


    We executed all the 10490 programs from the Test262 suite with the instrumented
    JavaScript engines. We confirmed that there is no field access attempt to global
    and intrinsic objects. We observed a single situation where [[Prototype]] is implicitly
    accessed by the programs compiled by SecureJS. During the initialization of a
    program, an empty object is created with an empty prototype chain by the expression
    Object.create(null). Later on, this object is used to optimized SecureJS field
    accesses. Since this object has no prototype chain, the accesses are harmless
    but are logged by the instrumented engines.


    ## 6 RELATED WORK


    A number of studies have been carried out so as to provide memory isolation in
    JavaScript.


    Bhargavan et al. [2] proposes defensive JavaScript (DJS), which is a small subset
    of the JavaScript language satisfying static typing constraints. DJS achieves
    memory isolation by the use of a small subset of the JavaScript language that
    does not involve dynamic features. The main limitation of DJS is that legacy code
    needs to be manually rewritten in the DJS subset and be typable in order to achieve
    memory isolation. A program written in DJS does not rely on a realm and cannot
    use built-in functions defined in ECMAScript specification.


    Swamy et al. [14] proposes JS*, which is a programming language supporting various
    dynamic features of JavaScript, while ensuring type safety in the presence of
    an untrusted JavaScript program. As it requires type-annotations for the trusted
    programs, legacy code needs to be manually rewritten in the JS*, and it supports
    only a small subset of JavaScript language in terms of the support of built-in
    functions. It implements a limited form of interfaces for inter-communication
    since the interface requires type-annotations and must implement the interface
    functions with the compiled interpreter programs.


    Terrace et al. [15] implements a JavaScript interpreter written in JavaScript.
    It supports interactions that use primitive values, typed objects, and functions
    that has typed argument and return values, and it does not work on the JerryScript
    engine. For these reasons, it cannot be applied to IoT environments in particular.


    Vasilakis et al. [16] proposes BreakApp, which provides isolation and interaction
    policies between programs. It relies on various levels of built-in isolation primitives,
    yet the isolation mechanisms strongly depends on Node.js. One of the isolation
    mechanisms BreakApp relies on is the isolated realm supported by Node.js.


    Guha et al. [7] proposes a formal semantics of a core calculus, λJS, and provides
    a reduction step of JavaScript to λJSexplicit. This reduction step is similar
    to our translation to JSexplicit, but our translation to JSexplicit focuses on
    rewriting primitive operations to their secure versions in order to simulate a
    JavaScript realm.


    ## 7 CONCLUSION


    We presented SecureJS, a secure JavaScript-to-JavaScript compiler. It transforms
    programs into equivalent ones but that would execute as if they were running inside
    an isolated realm. This compiler is portable and only uses standard features so
    it can be used by any JavaScript engine. In order to rewrite the semantics of
    dynamic features of JavaScript language, we presented JS$^{explicit}$, which does
    not involve implicit field accesses, and presented translation from JavaScript
    to JS$^{explicit}$. In the evaluation, we showed that the compilation preserves
    the semantics of the original programs that use full-features of ECMAScript 5.1
    and achieves memory isolation if a given program does not export a value. In order
    to show that executions of the compiled programs preserve memory isolation, we
    use instrumented JavaScript engines, and to the best of our knowledge, no one
    has attempted to test such properties before by JavaScript engine instrumentation.
    SecureJS compiler provides an essential building block to use JavaScript security
    enforcement libraries that rely on isolated realms, in particular, it enables
    us to use such libraries in JerryScript JavaScript implementation, which does
    not support a built-in isolation mechanism.


    ## REFERENCES


    [1] Agoric. 2020. SES: Proposal for Secure EcmaScript. https://github.com/tc39/proposal-ses.

    [2] Karthikeyan Bhargavan, Antoine Delignat-Lavaud, and Sergio Maffeis. 2013.
    Language-based Defenses Against Untrusted Browser Origins. In Presented as part
    of the 22nd USENIX Security Symposium (USENIX Security 13). USENIX, Washington,
    D.C., 653–670.

    [3] Martin Bodin, Arthur Charguéraud, Daniele Filaretti, Philippa Gardner, Sergio
    Maffeis, Daiva Naudziuniene, Alan Schmitt, and Gareth Smith. 2014. A Trusted Mechanised
    JavaScript Specification. In Proceedings of the 41st ACM SIGPLAN-SIGACT Symposium
    on Principles of Programming Languages (POPL ''14). ACM, New York, NY, USA, 87–100.
    https://doi.org/10.1145/2535838.2535876

    [4] European Association for Standardizing Information and Communication Systems
    (ECMA). 2011. ECMA-262: ECMAScript Language Specification. Edition 5.1.

    [5] Evgeny Gavrin, Sung-Jae Lee, Ruben Ayrapetyan, and Andrey Shitov. 2015. Ultra
    Lightweight JavaScript Engine for Internet of Things. In Companion Proceedings
    of the 2015 ACM SIGPLAN International Conference on Systems, Programming, Languages
    and Applications: Software for Humanity (SPLASH Companion 2015). ACM, New York,
    NY, USA, 19–20. https://doi.org/10.1145/2814189.2816270

    [6] Google. 2018. V8 JavaScript Engine. http://developers.google.com/v8.

    [7] Arjun Guha, Claudiu Saftoiu, and Shriram Krishnamurthi. 2010. The Essence
    of JavaScript. In ECOOP 2010 – Object-Oriented Programming, Theo D''Hondt (Ed.).
    Springer Berlin Heidelberg, Berlin, Heidelberg, 126–150.

    [8] Zhengqin Luo and Tamara Rezk. 2012. Mashup Compiler: Mashup Sandboxing Based
    on Inter-frame Communication. In Proceedings of the 2012 IEEE 25th Computer Security
    Foundations Symposium (CSF ''12). IEEE Computer Society, Washington, DC, USA,
    157–170. https://doi.org/10.1109/CSF.2012.22

    [9] Mark S. Miller, Mike Samuel, Ben Laurie, Ihab Awad, and Mike Stay. October
    2007. Caja - safe active content in sanitized JavaScript. http://math.ucr.edu/-mike/caja-spec-2008-06-06.pdf.

    [10] Nick Nikiforakis, Luca Invernizzi, Alexandros Kapravelos, Steven Van Acker,
    Wouter Joosen, Christopher Kruegel, Frank Piessens, and Giovanni Vigna. 2012.
    You are what you include: large-scale evaluation of remote javascript inclusions.
    In the ACM Conference on Computer and Communications Security. CCS''12, Raleigh,
    NC, USA, October 16-18, 2012. 736–747.

    [11] Joe Gibbs Politz, Spiridon Aristides Eliopoulos, Arjun Guha, and Shriram
    Krishnamurthi. 2011. ADsafety: Type-based Verification of JavaScript Sandboxing.
    In Proceedings of the 20th USENIX Conference on Security (SEC''11). USENIX Association,
    Berkeley, CA, USA, 12–12. http://dl.acm.org/citation.cfm?id=2028067.2028079

    [12] Manuel Serrano and Vincent Prunet. 2016. A Glimpse of Hopjs. In Proceedings
    of the 21st ACM SIGPLAN International Conference on Functional Programming (ICFP
    2016). ACM, New York, NY, USA, 180–192. https://doi.org/10.1145/2951913.2951916

    [13] Patrik Simek. 2020. VM2 npm package. https://www.npmjs.com/package/vm2.

    [14] Nikhil Swamy, Cedric Fournet, Aseem Rastogi, Karthikeyan Bhargavan, Juan
    Chen, Pierre-Yves Strub, and Gavin Bierman. 2014. Gradual Typing Embedded Securely
    in JavaScript. In Proceedings of the 41st ACM SIGPLAN-SIGACT Symposium on Principles
    of Programming Languages (POPL ''14). ACM, New York, NY, USA, 425–437. https://doi.org/10.1145/2535838.2535889

    [15] Jeff Terrace, Stephen R. Beard, and Naga Praveen Kumar Katta. 2012. JavaScript
    in JavaScript (js.js): Sandboxing Third-Party Scripts. In Presented as part of
    the 3rd USENIX Conference on Web Application Development (WebApps 12). USENIX,
    Boston, MA, 95–100.

    [16] Nikos Vasilakis, Ben Karel, Nick Roessler, Nathan Dautenhahn, André DeHon,
    and Jonathan M. Smith. 2018. BreakApp: Automated, Flexible Application Compartmentalization.
    In 25th Annual Network and Distributed System Security Symposium, NDSS 2018, San
    Diego, California, USA, February 18-21, 2018. The Internet Society.'
  mdcn: '## 5.1 实验设置


    我们在开源JavaScript引擎Hop编译器[12]的前端之上实现了SecureJS。SecureJS接收一个JavaScript程序，并生成一个符合ECMAScript第5版规范的JavaScript程序。执行使用了最先进的JavaScript引擎V8、Hop和JerryScript。


    我们使用Test262测试套件，并采用其github仓库中的es5-tests分支。由于Test262测试套件的测试程序通过assert函数来检查程序状态和流程，因此比较最终状态可以确认程序的等效执行。Test262程序还测试了所有ECMAScript内置函数的语义以及严格模式函数的语义。我们将10490个测试程序作为Test262测试套件的目标测试程序，并从目标程序中排除了1082个测试程序。具体来说，我们排除了使用`eval`函数和`with`语句的测试。SecureJS不支持`eval`和`with`。此外，我们还排除了检查语法错误的测试。最新版本的ECMAScript规定的语法规则比ECMAScript第5版规定的语法规则更宽松。由于SecureJS的前端解析器为了兼容性支持最新的ECMAScript规范，它会解析遵循最新ECMAScript规范的程序，并在可能的情况下将其翻译成兼容ECMAScript第5版的程序。


    ## 5.2 测试语义保持


    本实验的目标是展示SecureJS编译器保持了原始程序的语义。为此，我们编译了Test262套件的目标测试程序，并在V8、Hop和JerryScript JavaScript引擎上运行它们，然后检查原始程序和相应编译后程序的结果状态是否等效。


    在10490个测试程序中，V8成功通过了10386个。104个失败是由于源语言Test262所假设的语义与V8支持的最新JavaScript演进之间存在差异。SecureJS保持了这一结果。也就是说，10386个成功的测试在SecureJS编译后仍然成功，104个失败的测试仍然失败。Hop通过了10414个测试程序，76个测试失败；JerryScript通过了10474个测试程序，16个测试失败。SecureJS也保持了这些结果。


    ## 5.3 测试内存隔离


    SecureJS编译后的程序运行时，仿佛运行在一个隔离的领域中。如果编译后的程序没有有意导出值以与外界交互，那么编译后的程序和其他未编译的程序将无法相互引用。在本节中，我们测试不使用`export`的此类SecureJS编译程序是否遵守此隔离属性。为此，我们通过实验验证编译后的程序是否曾访问受控领域之外的对象。


    在实验中，我们修改了Hop和JerryScript的实现，以记录所有对遍历原型链所需的`[[Prototype]]`字段的访问。我们使用了两种截然不同的JavaScript实现，以降低未被注意到的`[[Prototype]]`访问（这些访问可能被JavaScript引擎优化器移除，与SecureJS无关）的概率。此外，我们还修改了JerryScript引擎，以记录所有对全局对象和内置对象（它们位于受控领域之外）的访问。


    我们使用插桩的JavaScript引擎执行了Test262套件中的所有10490个程序。我们确认没有对全局对象和内置对象的字段访问尝试。我们观察到一种情况，即SecureJS编译的程序隐式访问了`[[Prototype]]`。在程序初始化期间，表达式`Object.create(null)`创建了一个具有空原型链的空对象。随后，该对象被用于优化SecureJS的字段访问。由于该对象没有原型链，这些访问是无害的，但被插桩引擎记录了下来。


    ## 6 相关工作


    迄今为止，已有许多研究致力于在JavaScript中提供内存隔离。


    Bhargavan等人[2]提出了防御性JavaScript（DJS），这是JavaScript语言的一个小子集，满足静态类型约束。DJS通过使用不涉及动态特性的JavaScript语言小子集来实现内存隔离。DJS的主要局限性在于，遗留代码需要手动重写为DJS子集并具有可类型性才能实现内存隔离。用DJS编写的程序不依赖于领域，也不能使用ECMAScript规范中定义的内置函数。


    Swamy等人[14]提出了JS*，这是一种支持JavaScript各种动态特性的编程语言，同时在存在不受信任的JavaScript程序时确保类型安全。由于它要求受信任的程序进行类型注解，遗留代码需要手动重写为JS*，并且在内置函数支持方面，它只支持JavaScript语言的一个小子集。它实现了一种有限形式的接口用于相互通信，因为接口需要类型注解，并且必须使用编译后的解释器程序来实现接口函数。


    Terrace等人[15]实现了一个用JavaScript编写的JavaScript解释器。它支持使用原始值、类型化对象以及具有类型化参数和返回值的函数进行交互，并且它不能在JerryScript引擎上工作。由于这些原因，它尤其不能应用于物联网环境。


    Vasilakis等人[16]提出了BreakApp，它提供了程序之间的隔离和交互策略。它依赖于各种级别的内置隔离原语，但隔离机制强烈依赖于Node.js。BreakApp所依赖的隔离机制之一是Node.js支持的隔离领域。


    Guha等人[7]提出了核心演算λJS的形式语义，并提供了将JavaScript归约到λJSexplicit的步骤。这个归约步骤类似于我们到JSexplicit的翻译，但我们到JSexplicit的翻译侧重于将原始操作重写为其安全版本，以模拟JavaScript领域。


    ## 7 结论


    我们提出了SecureJS，一个安全的JavaScript到JavaScript编译器。它将程序转换为等效的程序，但这些程序执行时仿佛运行在一个隔离的领域内。该编译器是可移植的，并且只使用标准特性，因此可以被任何JavaScript引擎使用。为了重写JavaScript语言动态特性的语义，我们提出了JS$^{explicit}$，它不涉及隐式字段访问，并提出了从JavaScript到JS$^{explicit}$的翻译。在评估中，我们展示了编译保持了使用ECMAScript
    5.1全部特性的原始程序的语义，并且如果给定程序不导出值，则实现了内存隔离。为了展示编译后程序的执行保持了内存隔离，我们使用了插桩的JavaScript引擎，并且据我们所知，之前没有人尝试过通过JavaScript引擎插桩来测试此类属性。SecureJS编译器为使用依赖于隔离领域的JavaScript安全执行库提供了一个基本构建块，特别是，它使我们能够在不支持内置隔离机制的JerryScript
    JavaScript实现中使用此类库。


