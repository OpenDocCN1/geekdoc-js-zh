- md: '# SecureJS Compiler: Portable Memory Isolation in JavaScript


    Yoonseok Ko

    Inria

    Sophia-Antipolis, France

    yoon-seok.ko@inria.fr


    Tamara Rezk

    Inria

    Sophia-Antipolis, France

    tamara.rezk@inria.fr


    Manuel Serrano

    Inria

    Sophia-Antipolis, France

    manuel.serrano@inria.fr


    ## ABSTRACT


    The memory isolation mechanism plays an essential role to provide security enforcement
    in JavaScript programs. Existing secure interaction libraries such as Google Caja,
    SES, and VM2 rely on built-in memory isolation mechanisms provided by Node.js
    and browsers, yet most of the other engines such as JerryScript and Duktape, which
    are implementations for IoT devices, do not support such isolation mechanisms.


    In this paper, we report about the design and implementation of SecureJS, a portable
    JavaScript-to-JavaScript compiler that enforces memory isolation. As it only uses
    standard features, the compiled code it generates can be used by any JavaScript
    engine. We validated empirically the semantics preservation and memory isolation
    of SecureJS compiled programs by using 10,490 test programs of ECMAScript Test262
    test suite. We also developed a novel experiment to evaluate memory isolation
    property of compiled code by instrumented JavaScript engines.


    ## CCS CONCEPTS


    - Security and privacy → Software security engineering; Web application security;

    - Software and its engineering → Syntax; Semantics;


    ## KEYWORDS


    Compiler, Memory Isolation, JavaScript


    ACM Reference Format:

    Yoonseok Ko, Tamara Rezk, and Manuel Serrano. 2021. SecureJS Compiler: Portable
    Memory Isolation in JavaScript. In *The 36th ACM/SIGAPP Symposium on Applied Computing
    (SAC ''21)*, March 22–26, 2021, *Virtual Event, Republic of Korea*. ACM, New York,
    NY, USA, Article 4, 10 pages. https://doi.org/10.1145/3412841.3442001


    ## 1 INTRODUCTION


    JavaScript has been growing at a rapid pace over the years due to its easy manipulation
    and deployment in development. The dynamic nature of the language provides a smooth
    environment for the integration of code, and it contributes to the easy and fast
    development of complex applications [10].


    Whereas the dynamic features of JavaScript play an essential role in the language
    popularity by simplifying application developments, they also enable malicious
    JavaScript libraries to exploit these dynamic features to break the integrity
    and confidentiality of the applications [3]. Within a single JavaScript program
    execution all components share a global object and intrinsic objects such as Object
    and Object.prototype. Due to the idiosyncratic JavaScript semantics whose primitive
    operations implicitly access these global and intrinsic objects, all the components
    that form an application are tightly bond together. This gives opportunities to
    a malicious third-party code to pervert or extract undue pieces of information
    from others execution.


    Various researches have been carried out so as to provide security enforcement
    achieved by memory isolation [2, 8, 9, 11, 13–16]. Total isolation is the simplest
    way to run programs without unintended interplay. However, more complex programs
    that need interactions between programs cannot enjoy the benefit of isolation.
    The practical secure JavaScript programming solutions such as Google Caja [9],
    SES [1], and VM2 [13] rely on such an isolation mechanism provided by Node.js
    or browsers and provide secure interactions between isolated programs by controlling
    the interactions. Still, such built-in isolation mechanisms are not supported
    other popular JavaScript implementations such as JerryScript¹ and Duktape², which
    are JavaScript implementations for micro-controllers, and thus, it limits the
    use of these secure interaction solutions in a practical use. It motivates the
    need for portable isolated JavaScript environments independent from JavaScript
    implementations.


    A basic building block for JavaScript memory isolation is a *realm* (as it is
    defined in the latest ECMAScript specification³), which consists of a global object
    and intrinsic objects. Programs running in the same realm share the global and
    intrinsic objects, and isolated realms initially do not share any references between
    the realms. Running programs in different isolated realms guarantees that their
    memory accesses do not interfere with each other. However, programs in a realm
    are able to interact with programs in another realm by intentionally exporting
    a value, and it breaks the isolation. Thus, isolated realms are a basic and essential
    unit for secure program executions, and they can achieve security enforcement
    on further interactions by combining with the existing secure JavaScript programming
    solutions. Unfortunately, JavaScript realms are only supported by some JavaScript
    implementations, such as Node.js and browsers, and it limits the use of the existing
    secure programming solutions in other JavaScript implementations.


    ¹https://jerryscript.net

    ²https://duktape.org

    ³https://www.ecma-international.org/ecma-262/#sec-code-realms


    **Our Approach.** In this paper, we propose a novel technique, based on a JavaScript-to-JavaScript
    compilation, to run JavaScript programs in an isolated realm. Our method focuses
    on rewriting the semantics of implicit field accesses of the given program and
    achieves memory isolation by using revised field access operations. For that,
    we define a subset of JavaScript language, JS<sup>explicit</sup>, in which primitive
    operations do not involve implicit field accesses. The translation from JavaScript
    to JS<sup>explicit</sup> replaces all the implicit field accesses of the source
    program with explicit operations. JS<sup>explicit</sup> programs are meant to
    run in a dedicated secure runtime environment that creates an isolated virtual
    realm and provides secure primitive operations that implicitly access the isolated
    virtual realm.


    We have implemented a secure JavaScript-to-JavaScript compiler, SecureJS. It transforms
    programs into equivalent ones, but which would execute as if they were running
    inside an isolated memory. The compilation relies on the translation to JS<sup>explicit</sup>
    and replaces primitive operations to secure versions and thus execute in an isolated
    memory, which simulates a JavaScript realm. The program running in the isolated
    memory can interact with others by intentionally exporting a value of the isolated
    memory to outside. This compiler is portable and only uses standard features so
    it can be used by any JavaScript engine that complies with ECMAScript 5.1 specification.
    Thus, the compiler provides an isolation mechanism independently of JavaScript
    implementation, and it enables us to use existing secure interaction libraries
    in any JavaScript engine.


    **Contributions.**


    - We propose a subset of the JavaScript language JS<sup>explicit</sup>, in which
    primitive operations do not involve implicit field accesses, and we present a
    translation from JavaScript to JS<sup>explicit</sup> (Section 3).

    - We provide a secure JavaScript-to-JavaScript compiler, SecureJS, as a tool.
    This compiler transforms programs into equivalent ones but which would execute
    as if they are running inside an isolated realm without relying on any built-in
    mechanisms. This implementation is portable to any ECMAScript 5.1 compliant implementations
    and the isolated realm supports all features of ECMAScript 5.1⁴ (Section 4).

    - We provide instrumented JavaScript engines that detect implicit field accesses
    and field accesses to intrinsic objects. We have used it to test empirically the
    semantic preservation and memory isolation of the SecureJS compiled programs.
    The instrumented engines can be used independently of SecureJS to test memory
    isolation. Our tool and the patch for the instrumented engine are publicly available⁵
    (Section 5).


    ## 2 OVERVIEW


    We give an overview of our approach with an overly simple example that only use
    a field access operation that involves a dynamic type conversion and prototype
    chain field lookup.


    We demonstrate the evaluation of a JavaScript program construct. An evaluation
    of a single JavaScript program construct consists of a series of JavaScript *internal
    primitive operations*. We consider the following code fragment:


    ```

    1 Boolean.prototype.x = 10;

    2 var o = {toString: function() { return "x"; }};

    3

    4 true[o] === 10;

    ```


    The evaluation of the field lookup operation `true[o]` used in the test at line
    4 consists of a series of JavaScript primitive operations as follows:


    - (1) It applies ToObject to true to dynamically converts the value to an object.
    The semantics of ToObject creates an instance of Boolean intrinsic object by calling
    `new Boolean(true)`, and an internal field `[[Prototype]]`⁶ of the created object
    is set to the reference of `Boolean.prototype`.

    - (2) It applies the internal operation ToString to the field name designator
    o to dynamically convert the value to a string. The semantics of ToString *implicitly
    accesses* the field `toString` of the object o and calls it. As we defined at
    line 2, the function returns a string "x".

    - (3) The field lookup operation searches a field named "x" from the instance
    of Boolean intrinsic object. Since the instance does not have a field named "x",
    it *implicitly accesses* the field "x" of the object `Boolean.prototype`, which
    is the prototype chain object of the instance. Since the field value of the object
    `Boolean.prototype` is 10 as we defined at line 1, the result of the field lookup
    operation is evaluated to 10 and the equality test succeeds.


    The evaluation of a field lookup operation in JavaScript involves two implicit
    field accesses, and by one of these field accesses reads a field value of the
    intrinsic object `Boolean.prototype`.


    Our goal is to run programs *as if they were running in isolated realms*. For
    that we will actually run them in isolated *virtual realms* that rely on two ingredients:
    *i*) newly created controlled global and intrinsic objects, and, *ii*) a rerouting
    of the implicit field accesses from the original intrinsic objects to the controlled
    intrinsic objects.


    In order to reroute field accesses, we use the two steps code transformation.
    First, we transform programs into equivalent ones but were implicit operations
    have been replaced with equivalent explicit ones. For instance, in the above example,
    the implicit field accesses are involved in the dynamic type conversion. For example,
    the code `true[o] === 10` is converted as follows:


    ```

    1 // ToObject(true)

    2 var r = new Boolean(true);

    3 // ToString(o)

    4 var s = o.toString();

    5 // actual field lookup

    6 function Load(o,s) {

    7   if (o.hasOwnProperty(s)) return o[s];

    8   o = Object.getPrototypeOf(o);

    9   return Load(o,s);

    10 }

    11 Load(r,s) === 10;

    ```


    Second, we rewrite the code Load to reroute the field accesses as follows:


    > ⁶In ECMAScript specification, internal field and method names are presented
    with a double square brackets `[[Name]]`. These methods and field names are not
    allowed to be called or accessed directly from JavaScript programs but callable
    or accessible from other internal methods or operations.


    ⁴We intentionally do not provide eval and with constructs.

    ⁵https://gitlab.inria.fr/securejs/sjs-compiler'
  mdcn: '# SecureJS 编译器：JavaScript 中的可移植内存隔离


    Yoonseok Ko

    Inria

    Sophia-Antipolis, 法国

    yoon-seok.ko@inria.fr


    Tamara Rezk

    Inria

    Sophia-Antipolis, 法国

    tamara.rezk@inria.fr


    Manuel Serrano

    Inria

    Sophia-Antipolis, 法国

    manuel.serrano@inria.fr


    ## 摘要


    内存隔离机制在为 JavaScript 程序提供安全实施方面发挥着至关重要的作用。现有的安全交互库，如 Google Caja、SES 和 VM2，依赖于
    Node.js 和浏览器提供的内置内存隔离机制，然而大多数其他引擎，例如为物联网设备实现的 JerryScript 和 Duktape，则不支持此类隔离机制。


    在本文中，我们报告了 SecureJS 的设计和实现，这是一个可移植的 JavaScript 到 JavaScript 编译器，用于强制执行内存隔离。由于它仅使用标准特性，其生成的编译代码可被任何
    JavaScript 引擎使用。我们通过使用 ECMAScript Test262 测试套件中的 10,490 个测试程序，经验性地验证了 SecureJS
    编译程序的语义保持和内存隔离性。我们还开发了一种新颖的实验，通过插桩 JavaScript 引擎来评估编译代码的内存隔离特性。


    ## CCS 概念


    - 安全与隐私 → 软件安全工程；Web 应用程序安全；

    - 软件及其工程 → 语法；语义；


    ## 关键词


    编译器，内存隔离，JavaScript


    ACM 参考格式：

    Yoonseok Ko, Tamara Rezk, and Manuel Serrano. 2021. SecureJS Compiler: Portable
    Memory Isolation in JavaScript. In *The 36th ACM/SIGAPP Symposium on Applied Computing
    (SAC ''21)*, March 22–26, 2021, *Virtual Event, Republic of Korea*. ACM, New York,
    NY, USA, Article 4, 10 pages. https://doi.org/10.1145/3412841.3442001


    ## 1 引言


    多年来，JavaScript 因其易于操作和部署而迅速发展。该语言的动态特性为代码集成提供了流畅的环境，并有助于复杂应用程序的轻松快速开发 [10]。


    尽管 JavaScript 的动态特性通过简化应用程序开发在语言普及中发挥了重要作用，但它们也使得恶意 JavaScript 库能够利用这些动态特性来破坏应用程序的完整性和机密性
    [3]。在单个 JavaScript 程序执行中，所有组件共享一个全局对象和内置对象，如 Object 和 Object.prototype。由于 JavaScript
    特有的语义，其基本操作会隐式访问这些全局和内置对象，因此构成应用程序的所有组件都紧密地绑定在一起。这为恶意第三方代码提供了机会，使其能够歪曲或从其他执行中提取不当信息。


    迄今为止，已经进行了各种研究以通过内存隔离提供安全实施 [2, 8, 9, 11, 13–16]。完全隔离是运行程序而无意外交互的最简单方式。然而，需要程序间交互的更复杂程序无法享受隔离的好处。实际的
    JavaScript 安全编程解决方案，如 Google Caja [9]、SES [1] 和 VM2 [13]，依赖于 Node.js 或浏览器提供的此类隔离机制，并通过控制交互来提供隔离程序之间的安全交互。尽管如此，其他流行的
    JavaScript 实现，如 JerryScript¹ 和 Duktape²（它们是用于微控制器的 JavaScript 实现），并不支持此类内置隔离机制，因此限制了这些安全交互解决方案在实际使用中的应用。这促使了需要独立于
    JavaScript 实现的可移植隔离 JavaScript 环境。


    JavaScript 内存隔离的基本构建块是 *领域*（如最新 ECMAScript 规范³ 所定义），它由一个全局对象和内置对象组成。在同一领域中运行的程序共享全局和内置对象，而隔离的领域最初不共享任何领域间的引用。在不同隔离领域中运行程序可保证它们的内存访问不会相互干扰。然而，一个领域中的程序能够通过有意导出一个值与另一个领域中的程序交互，这破坏了隔离。因此，隔离领域是安全程序执行的基本和必要单元，它们可以通过与现有的
    JavaScript 安全编程解决方案结合来实现进一步交互的安全实施。不幸的是，JavaScript 领域仅由某些 JavaScript 实现（如 Node.js
    和浏览器）支持，这限制了现有安全编程解决方案在其他 JavaScript 实现中的使用。


    ¹https://jerryscript.net

    ²https://duktape.org

    ³https://www.ecma-international.org/ecma-262/#sec-code-realms


    **我们的方法。** 在本文中，我们提出了一种基于 JavaScript 到 JavaScript 编译的新技术，用于在隔离领域中运行 JavaScript
    程序。我们的方法专注于重写给定程序的隐式字段访问语义，并通过使用修改后的字段访问操作来实现内存隔离。为此，我们定义了 JavaScript 语言的一个子集
    JS<sup>explicit</sup>，其中基本操作不涉及隐式字段访问。从 JavaScript 到 JS<sup>explicit</sup> 的翻译将源程序的所有隐式字段访问替换为显式操作。JS<sup>explicit</sup>
    程序旨在在专用的安全运行时环境中运行，该环境创建一个隔离的虚拟领域，并提供隐式访问该隔离虚拟领域的安全基本操作。


    我们已经实现了一个安全的 JavaScript 到 JavaScript 编译器 SecureJS。它将程序转换为等效的程序，但这些程序将像在隔离内存中运行一样执行。编译依赖于翻译到
    JS<sup>explicit</sup>，并将基本操作替换为安全版本，从而在模拟 JavaScript 领域的隔离内存中执行。在隔离内存中运行的程序可以通过有意将隔离内存中的值导出到外部来与其他程序交互。该编译器是可移植的，仅使用标准特性，因此可被任何符合
    ECMAScript 5.1 规范的 JavaScript 引擎使用。因此，该编译器提供了独立于 JavaScript 实现的隔离机制，使我们能够在任何 JavaScript
    引擎中使用现有的安全交互库。


    **贡献。**


    - 我们提出了 JavaScript 语言的一个子集 JS<sup>explicit</sup>，其中基本操作不涉及隐式字段访问，并提出了从 JavaScript
    到 JS<sup>explicit</sup> 的翻译（第 3 节）。

    - 我们提供了一个安全的 JavaScript 到 JavaScript 编译器 SecureJS 作为工具。该编译器将程序转换为等效的程序，但这些程序将像在隔离领域中运行一样执行，而不依赖于任何内置机制。此实现可移植到任何符合
    ECMAScript 5.1 的实现，并且隔离领域支持 ECMAScript 5.1⁴ 的所有特性（第 4 节）。

    - 我们提供了插桩 JavaScript 引擎，用于检测隐式字段访问和对内置对象的字段访问。我们使用它来经验性地测试 SecureJS 编译程序的语义保持和内存隔离性。插桩引擎可独立于
    SecureJS 用于测试内存隔离。我们的工具和插桩引擎的补丁是公开可用的⁵（第 5 节）。


    ## 2 概述


    我们通过一个极其简单的示例概述我们的方法，该示例仅使用涉及动态类型转换和原型链字段查找的字段访问操作。


    我们演示了一个 JavaScript 程序构造的评估。单个 JavaScript 程序构造的评估由一系列 JavaScript *内部基本操作* 组成。我们考虑以下代码片段：


    ```

    1 Boolean.prototype.x = 10;

    2 var o = {toString: function() { return "x"; }};

    3

    4 true[o] === 10;

    ```


    第 4 行测试中使用的字段查找操作 `true[o]` 的评估由一系列 JavaScript 基本操作组成，如下所示：


    - (1) 它对 true 应用 ToObject 以动态将值转换为对象。ToObject 的语义通过调用 `new Boolean(true)` 创建 Boolean
    内置对象的实例，并且创建对象的内部字段 `[[Prototype]]`⁶ 被设置为 `Boolean.prototype` 的引用。

    - (2) 它对字段名指示符 o 应用内部操作 ToString 以动态将值转换为字符串。ToString 的语义 *隐式访问* 对象 o 的字段 `toString`
    并调用它。正如我们在第 2 行定义的，该函数返回字符串 "x"。

    - (3) 字段查找操作从 Boolean 内置对象的实例中搜索名为 "x" 的字段。由于该实例没有名为 "x" 的字段，它 *隐式访问* 对象 `Boolean.prototype`
    的字段 "x"，该对象是实例的原型链对象。由于对象 `Boolean.prototype` 的字段值如我们在第 1 行定义的为 10，因此字段查找操作的结果被评估为
    10，相等性测试成功。


    JavaScript 中字段查找操作的评估涉及两个隐式字段访问，其中一个字段访问读取了内置对象 `Boolean.prototype` 的字段值。


    我们的目标是 *像在隔离领域中运行一样* 运行程序。为此，我们将实际在依赖于两个要素的隔离 *虚拟领域* 中运行它们：*i*) 新创建的受控全局和内置对象，以及
    *ii*) 将隐式字段访问从原始内置对象重新路由到受控内置对象。


    为了重新路由字段访问，我们使用两步代码转换。首先，我们将程序转换为等效的程序，但其中的隐式操作已被等效的显式操作替换。例如，在上面的示例中，隐式字段访问涉及动态类型转换。例如，代码
    `true[o] === 10` 被转换如下：


    ```

    1 // ToObject(true)

    2 var r = new Boolean(true);

    3 // ToString(o)

    4 var s = o.toString();

    5 // 实际字段查找

    6 function Load(o,s) {

    7   if (o.hasOwnProperty(s)) return o[s];

    8   o = Object.getPrototypeOf(o);

    9   return Load(o,s);

    10 }

    11 Load(r,s) === 10;

    ```


    其次，我们重写代码 Load 以重新路由字段访问，如下所示：


    > ⁶在 ECMAScript 规范中，内部字段和方法名称用双方括号 `[[Name]]` 表示。这些方法和字段名称不允许从 JavaScript 程序直接调用或访问，但可以从其他内部方法或操作调用或访问。


    ⁴我们有意不提供 eval 和 with 构造。

    ⁵https://gitlab.inria.fr/securejs/sjs-compiler'
