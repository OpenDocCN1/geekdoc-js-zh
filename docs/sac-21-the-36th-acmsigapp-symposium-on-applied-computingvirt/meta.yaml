    # 3.2 Semantics


    We define the semantics of a program by the means of a big-step semantics. The
    semantics of the JS<sup>explicit</sup> follows the semantics of JavaScript language,
    but they do not involve dynamic type conversion and implicit field access. The
    configurations have the form $\mu, l_s, i, t \Downarrow \mu'', t''$, where $\mu,
    \mu'' \in \mathbb{M}$ are memories, $l_s \in \mathbb{V}_{loc}$ is a current scope
    object location, $i$ is an instruction, and $t$ is either a normal state or an
    exception state with a value $exc(v)$ where $v \in \mathbb{V}$. The state tag
    normal denote that the program state is in a normal state, and the state tag $exc(v)$
    denote that the program state is in an exception state with an exception value
    $v$. A memory $\mathbb{M} = \mathbb{V}_{loc} \rightarrow \mathbb{O}$ is a map
    from locations to objects and an object $o \in \mathbb{O} = \mathbb{V}_{fld} \rightarrow
    \mathbb{R}$ is a map from field names to field values where $\mathbb{V}_{fld}
    = \mathbb{V}_{str} \cup \mathbb{V}_i$ and $\mathbb{V}_{str}$ are strings and $\mathbb{V}_i$
    are special values used to name internal JavaScript fields such as @env and @proto,
    and $\mathbb{R} = \mathbb{V}_{str} \rightarrow \mathbb{V}$ is a map from record
    names to values and we write $\{name_1 : v_1, name_2 : v_2\}$ to denote a record
    that has two elements of names $name_1$ and $name_2$ respectively with its values
    $v_1$ and $v_2$.


    The evaluation of an expression $e$ has the form $\mu, l_s, e \Downarrow_E v$,
    where $\mu \in \mathbb{M}$ is a program memory, $v$ is a value of the expression
    in the memory.


    The auxiliary function $Put(l_s, x, v)$ either updates the current scope object
    with $x = v$ or walks the scope chain designated by the outer scope @env to update
    the value of a local variable $x$ as defined by:


    $$\frac{\mu'' = \mu[l_s \mapsto \mu(l_s)[x \mapsto v]]}{\mu, Put(l_s, x, v) \Downarrow_A
    \mu''} \quad x \in dom(\mu(l_s))$$


    $$\frac{\mu, Put(\mu(l_s)(@env).1, x, v) \Downarrow_A \mu''}{\mu, Put(l_s, x,
    v) \Downarrow_A \mu''} \quad x \notin dom(\mu(l_s))$$


    Figure 1 presents an excerpt of the formal semantics containing only the essential
    rules. It shows the semantics of object allocation, field lookup, and update operations.
    Unlike the standard JavaScript semantics, the field lookup and update operations
    only accept that a receiver is an object and a field name designator evaluates
    to a string value, and the operations do not search a field in a prototype-chain
    of the given receiver object.


    +   - **Alloc rule.** The instruction $x_1 = \diamond alloc(x_2)$ evaluates the
    argument $x_2$ to a value $v$, allocates a new object in a new location $l_n$
    with a prototype chain value $v$, and assigns the allocated object reference to
    the local variable $x_1$. The instruction requires the prototype value $x_2$ to
    either be a location value or a null value.

    - **Lookup rule.** The instruction $x_1 = x_2[e]$ first evaluates the receiver
    object $x_2$ and field name designator $e$ respectively to a location $l$ and
    a string value $k$. The semantics do not search a prototype chain, but merely
    read a field of the receiver object $\mu(l)(k)$. In this rule, the field must
    be a record, which has four fields $value$, $enumerable$, $configurable$, and
    $writable$, and it assigns the value of the field $value$ to the left-hand side
    variable $x_1$ by calling the auxiliary function Put.


    +   - **Update rule.** The instruction $x[e_1] = e_2$ also evaluates the receiver
    object $x$ to a location $l$, the field name $e_1$ to a string value $k$. It evaluates
    the expression $e_2$ to a value $v$, and it assigns the value $v$ as a record
    with enumerable, configurable, and writable fields to the field $k$ of the receiver
    object designated by the location $l$. This rule is applied when there was no
    field named $k$ in the receiver object, and it creates a new field.


    The semantics of non-standard instructions and operators follows the semantics
    of the corresponding JavaScript built-in functions, but they do not apply dynamic
    type conversion. Figure 2 shows three additional semantics rules:


    +   - **hasOwnProperty1 and hasOwnProperty2 rules.** The binary operation $\diamond
    hasOwnProperty$ tests whether the object $e_1$ has a field designated by the string
    name $e_2$ or not.

    - **getPrototypeOf rule.** The unary operation $\diamond getPrototypeOf$ $e$ returns
    the internal prototype chain value of the given object.


    The unary operations $\diamond toString$, $\diamond toNumber$, and $\diamond toBoolean$
    take a primitive value as an argument and returns their corresponding typed value.
    The conversion algorithm is defined in the ECMAScript specification<sup>7</sup>
    [4], and these conversion algorithm do not involve implicit field access.


    # 3.3 JavaScript Primitive Operations in JS<sup>explicit</sup>


    In this section, we present JavaScript primitive operations written in JS<sup>explicit</sup>.
    Each primitive operation is devised by a corresponding internal method or operation
    defined in ECMAScript specification. We write [[A]] and B to denote an internal
    field or method named A and an operation named B, respectively.


    Figure 3a shows the [[Get]] internal method of ECMAScript specification that defines
    the essential semantics of a field lookup operation in JavaScript. For a given
    code is o[s], o is passed as $base$ and s is passed as $P$ in the specification.
    Figure 3b shows the code of Get function which mimics the semantics of [[Get]]
    internal method in JS<sup>explicit</sup>. Each step of the auxiliary function
    Get is designed with the specification and written in JS<sup>explicit</sup>.


    First, the [[Get]] internal method of the specification converts the receiver
    value $base$ to an object by calling the ToObject operation (step 1). In the Get
    function, it calls the function ToObject which mimics the semantics of the operation
    ToObject in the specification. This operation returns the input value if a type
    of the input value is already an object. Otherwise, it allocates a typed object
    if a type of the input value is one of string, number, and boolean types. This
    semantics is defined by the auxiliary function ToString written in JS<sup>explicit</sup>.
    Then, it calls [[GetProperty]] internal method to search the field named $P$ from
    the object $base$ and its prototype chain (step 2). The result is either undefined
    value when it fails to find a field or a descriptor object. If the result is undefined,
    it returns undefined value (step 3). The descriptor object has value field if
    the field is an ordinary value field. Otherwise, the descriptor object has to
    have the get field and it is the getter value. Thus, it first checks whether the
    descriptor object has a field "value", and it returns the value of the field "value"
    when the descriptor object has the field (step 4).


