- md: "## 4 IMPLEMENTATION: SecureJS\n\nIn this section, we present the SecureJS implementation.\
    \ SecureJS compiled programs execute as if they were in isolated realms, which\
    \ do not share any references with other realms. Thus, if a compiled program does\
    \ not export value to others, executions of the compiled program preserve total\
    \ memory isolation, and it guarantees that running a compiled program with other\
    \ uncompiled programs does not interfere with each other.\n\nThis isolation relies\
    \ on a secure runtime environment, which consists of an isolated virtual global\
    \ object and intrinsic objects, and secure primitive operations, which reroute\
    \ field accesses for the global and intrinsic objects to corresponding virtual\
    \ ones. This section details the implementation the secure primitive operations\
    \ and the runtime environment.\n\n## 4.1 Secure Primitive Operations\n\nThe SecureJS\
    \ compiler rewrites JavaScript programs in such a way that no expression can ever\
    \ access, explicitly or implicitly, objects created by uncompiled code. For that,\
    \ the compiled code replaces normal object field access and normal prototype chain\
    \ lookups with custom operations that enforce memory isolation. Let us detail\
    \ these operations.\n\nFirst of all, explicit references to global variables must\
    \ be replaced with accesses to secure objects that proxy these global plain objects.\
    \ For that, the compiler transforms a global variable access `x` into a library\
    \ function call `SJS.Loadvar(\"x\")` defined as:\n\n```\nSJS.Loadvar = function\
    \ SJSloadvar(id) {\n  return Get(SJS.global, id);\n}\n```\n\nThe object `SJS.global`\
    \ is a secure version of the global object. It ensures that all the interactions\
    \ with the global object will not be exposed to the uncompiled code.\n\nSecond,\
    \ object field accesses have to be intercepted in order to prevent the normal\
    \ prototype chain inspection to access objects of the uncompiled environment.\
    \ For that, we provide a secure version of `GetProperty` auxiliary function defined\
    \ as:\n\n```\nSJS.GetProperty = function SJSGetProperty(O, P) {\n  var prop;\n\
    \  prop = SJS.getOwnPropertyDescriptor(O,P); /* (1) */\n  if (prop !== undefined)\
    \ return prop; /* (2) */\n  else {\n      O = SJS.getPrototypeOf(O); /* (3) */\n\
    \      if (O === null) return undefined; /* (4) */\n      if (SJS.securePrototypeOf(O)\
    \ !== undefined)\n          O = SJS.securePrototypeOf(O)\n      return SJSGetProperty(O,P);\
    \ /* (5) */\n  }\n}\n```\n\nThe crucial point is line 8. It ensures that the field\
    \ lookup will never escape the memory controlled by the compiled environment.\
    \ If the search for the field hits the global object that belongs to the uncompiled\
    \ code, it reroutes the search to another object (line 9) under the control of\
    \ SecureJS.\n\nFor compatibility with current IoT platforms such as JerryScript\
    \ [5], SecureJS compiles and targets ECMAScript 5 but it also supports a restricted\
    \ version of the ECMAScript 6 module export form. The export instruction to establish\
    \ communication channels between compiled and uncompiled code. The compiler transforms\
    \ a declaration `export id` into:\n\n```\nid = SJS.Loadvar(\"id\")\n```\n\nwhere\
    \ the left-hand side `id` designates the global variable `id` outside the realm.\n\
    \nThe last role of the compiler is to create a secure execution context for the\
    \ compiled code. For that, the compiled code will be embedded into an anonymous\
    \ function that will start creating the secure environment and that will then\
    \ execute client code. That is, all compiled programs have the following shape:\n\
    \n```\n(function() {\n    var SJS = SJSbootstrap();\n    ... client compiled code\
    \ ...\n})();\n```\n\nSecureJS compiled code guarantees that any uncompiled expression\
    \ cannot ever access objects created by compiled code. The variable `SJS` is hidden\
    \ in the local scope of the compiled code, and the function `SJSbootstrap` is\
    \ immutable and returns a new isolated realm whenever it is called.\n\n## 4.2\
    \ Secure Runtime Environment\n\nSecureJS compiled code initializes a secure environment\
    \ by invoking the `SJSbootstrap` (see Figure 7, line 42) function at the very\
    \ beginning of the execution. This function is defined in a library `sjs.js` that\
    \ captures native built-in objects and provides secure interfaces for compiled\
    \ programs. In this section, we present the implementation of that library.\n\n\
    The `sjs.js` library executes before any other computation. It captures the standard\
    \ JavaScript functions (line 2-5) and stores them in a function local variables\
    \ so that they cannot be tampered from outside the library. It creates an immutable\
    \ field `@call` to `SJScall` with the built-in value of `Function.prototype.call`\
    \ (line 6) so that the semantics of the call expression `SJScall['@call'](f,obj,args)`\
    \ also cannot be tampered, and the `SJScall['@call'](f,obj,args)` implements `«apply(f,obj,args)`\
    \ in JSexplicit. The library defines the function `SJSbootstrap` (line 9) that\
    \ is bound to the global JavaScript variable `SJSbootstrap` (line 42). The function\
    \ definition requires two steps, as this is the only way ECMAScript 5 proposes\
    \ to define read-only variables.\n\n```\n(function() {\n    var SJScall = Object.create;\n\
    \    var SJScall = Function.prototype.call;\n    var SJSObjProto = Object.prototype;\n\
    \    var SJSFunProto = Function.prototype; ...\n    Object.defineProperty(SJScall,\
    \ '@call',\n        { value: SJScall, configurable: false,\n          writable:\
    \ false, enumerable: false });\n    function SJSbootstrap() {\n        function\
    \ securePrototypeOf(obj) {\n            if(obj === SJSObjProto)\n            \
    \    return SecureObjP;\n            if(obj === SJSFunProto)\n               \
    \ return SecureFunP;\n            ...\n            return false;\n        }\n\
    \        var global = SJScall(null);\n        var SJS = SJScall(null);\n     \
    \   SJS.global = global;\n        function CheckObjectCoercible(o) {...};\n  \
    \      function Get(x) {...};\n        function DefaultValue_S(x) {...};\n   \
    \     function ToString(o) {...};\n        function ToNumber(o) {...};\n     \
    \   function ToInteger(o) {...};\n        SJS.Loadvar = function (id) {...};\n\
    \        SJS.GetProperty = function (O, P) {...};\n        global.Object = function\
    \ (v) {...};\n        ...\n        global.String.prototype.slice =\n         \
    \   function(v) {...};\n        var SecureObjP =\n            global.Object.prototype\
    \ =\n                SJScall(null);\n        var SecureFunP =\n            global.Function.prototype\
    \ =\n                SJScall(SecureObjP);\n        ...\n        return SJS;\n\
    \    };\n    Object.defineProperty(this,\n        \"SJSbootstrap\", {\n      \
    \      value:SJSbootstrap, configurable:false,\n            writable:false, enumerable:false\
    \ });\n})();\n```\n\nFigure 7: An excerpt of sjs.js.\n\nThe function `SJSbootstrap`\
    \ creates a regular JavaScript object (line 18) that will act as a replacement\
    \ of the standard JavaScript global object inside the secure code.\n\n## 5 EVALUATION\n\
    \nThis section seeks for an experimental validation that the SecureJS compiler\
    \ preserves the semantics of the original program and the compiled code complies\
    \ with memory isolation. First, we test that SecureJS compilation preserves the\
    \ semantics of the original program in practical JavaScript engines V8 [6], Hop\
    \ [12], and JerryScript [5] using the Test262 test suite. Second, we test that\
    \ a SecureJS compiled program complies with memory isolation by testing that execution\
    \ of the compiled program does not cause implicit field accesses. For this, we\
    \ used the Test262 test suite in Hop and JerryScript JavaScript engines."
  mdcn: "## 4 实现：SecureJS\n\n在本节中，我们将介绍 SecureJS 的实现。SecureJS 编译后的程序在隔离的领域中执行，这些领域与其他领域不共享任何引用。因此，如果编译后的程序不向其他程序导出值，其执行过程将保持完全的内存隔离，并保证运行编译后的程序与其他未编译程序不会相互干扰。\n\
    \n这种隔离依赖于一个安全的运行时环境，该环境由一个隔离的虚拟全局对象和内置对象，以及安全的原始操作组成。这些操作将全局和内置对象的字段访问重定向到相应的虚拟对象。本节将详细阐述安全原始操作和运行时环境的实现。\n\
    \n## 4.1 安全原始操作\n\nSecureJS 编译器重写 JavaScript 程序的方式，使得任何表达式都无法显式或隐式地访问未编译代码创建的对象。为此，编译后的代码用自定义操作替换了正常的对象字段访问和正常的原型链查找，以强制执行内存隔离。让我们详细说明这些操作。\n\
    \n首先，对全局变量的显式引用必须替换为对代理这些全局普通对象的安全对象的访问。为此，编译器将全局变量访问 `x` 转换为库函数调用 `SJS.Loadvar(\"\
    x\")`，定义如下：\n\n```\nSJS.Loadvar = function SJSloadvar(id) {\n  return Get(SJS.global,\
    \ id);\n}\n```\n\n对象 `SJS.global` 是全局对象的安全版本。它确保与全局对象的所有交互都不会暴露给未编译的代码。\n\n其次，必须拦截对象字段访问，以防止正常的原型链检查访问未编译环境的对象。为此，我们提供了一个安全版本的\
    \ `GetProperty` 辅助函数，定义如下：\n\n```\nSJS.GetProperty = function SJSGetProperty(O,\
    \ P) {\n  var prop;\n  prop = SJS.getOwnPropertyDescriptor(O,P); /* (1) */\n \
    \ if (prop !== undefined) return prop; /* (2) */\n  else {\n      O = SJS.getPrototypeOf(O);\
    \ /* (3) */\n      if (O === null) return undefined; /* (4) */\n      if (SJS.securePrototypeOf(O)\
    \ !== undefined)\n          O = SJS.securePrototypeOf(O)\n      return SJSGetProperty(O,P);\
    \ /* (5) */\n  }\n}\n```\n\n关键点在于第 8 行。它确保字段查找永远不会逃逸到编译环境控制的内存之外。如果字段搜索命中属于未编译代码的全局对象，它会将搜索重定向到\
    \ SecureJS 控制下的另一个对象（第 9 行）。\n\n为了与当前的物联网平台（如 JerryScript [5]）兼容，SecureJS 编译并以\
    \ ECMAScript 5 为目标，但它也支持受限版本的 ECMAScript 6 模块导出形式。导出指令用于在编译和未编译代码之间建立通信通道。编译器将声明\
    \ `export id` 转换为：\n\n```\nid = SJS.Loadvar(\"id\")\n```\n\n其中左侧的 `id` 指定领域外的全局变量\
    \ `id`。\n\n编译器的最后一个作用是为编译后的代码创建一个安全的执行上下文。为此，编译后的代码将被嵌入到一个匿名函数中，该函数将首先创建安全环境，然后执行客户端代码。也就是说，所有编译后的程序都具有以下形式：\n\
    \n```\n(function() {\n    var SJS = SJSbootstrap();\n    ... client compiled code\
    \ ...\n})();\n```\n\nSecureJS 编译后的代码保证任何未编译的表达式都无法访问编译代码创建的对象。变量 `SJS` 隐藏在编译代码的局部作用域中，而函数\
    \ `SJSbootstrap` 是不可变的，每次调用时都会返回一个新的隔离领域。\n\n## 4.2 安全运行时环境\n\nSecureJS 编译后的代码通过在执行开始时调用\
    \ `SJSbootstrap`（见图 7，第 42 行）函数来初始化安全环境。该函数定义在库 `sjs.js` 中，该库捕获原生内置对象并为编译后的程序提供安全接口。在本节中，我们将介绍该库的实现。\n\
    \n`sjs.js` 库在任何其他计算之前执行。它捕获标准 JavaScript 函数（第 2-5 行）并将它们存储在函数局部变量中，这样它们就不会被库外部篡改。它创建一个不可变字段\
    \ `@call` 指向 `SJScall`，其值为 `Function.prototype.call` 的内置值（第 6 行），这样调用表达式 `SJScall['@call'](f,obj,args)`\
    \ 的语义也无法被篡改，并且 `SJScall['@call'](f,obj,args)` 在 JSexplicit 中实现了 `«apply(f,obj,args)`。该库定义了函数\
    \ `SJSbootstrap`（第 9 行），该函数绑定到全局 JavaScript 变量 `SJSbootstrap`（第 42 行）。函数定义需要两个步骤，因为这是\
    \ ECMAScript 5 提出的定义只读变量的唯一方式。\n\n```\n(function() {\n    var SJScall = Object.create;\n\
    \    var SJScall = Function.prototype.call;\n    var SJSObjProto = Object.prototype;\n\
    \    var SJSFunProto = Function.prototype; ...\n    Object.defineProperty(SJScall,\
    \ '@call',\n        { value: SJScall, configurable: false,\n          writable:\
    \ false, enumerable: false });\n    function SJSbootstrap() {\n        function\
    \ securePrototypeOf(obj) {\n            if(obj === SJSObjProto)\n            \
    \    return SecureObjP;\n            if(obj === SJSFunProto)\n               \
    \ return SecureFunP;\n            ...\n            return false;\n        }\n\
    \        var global = SJScall(null);\n        var SJS = SJScall(null);\n     \
    \   SJS.global = global;\n        function CheckObjectCoercible(o) {...};\n  \
    \      function Get(x) {...};\n        function DefaultValue_S(x) {...};\n   \
    \     function ToString(o) {...};\n        function ToNumber(o) {...};\n     \
    \   function ToInteger(o) {...};\n        SJS.Loadvar = function (id) {...};\n\
    \        SJS.GetProperty = function (O, P) {...};\n        global.Object = function\
    \ (v) {...};\n        ...\n        global.String.prototype.slice =\n         \
    \   function(v) {...};\n        var SecureObjP =\n            global.Object.prototype\
    \ =\n                SJScall(null);\n        var SecureFunP =\n            global.Function.prototype\
    \ =\n                SJScall(SecureObjP);\n        ...\n        return SJS;\n\
    \    };\n    Object.defineProperty(this,\n        \"SJSbootstrap\", {\n      \
    \      value:SJSbootstrap, configurable:false,\n            writable:false, enumerable:false\
    \ });\n})();\n```\n\n图 7：sjs.js 的摘录。\n\n函数 `SJSbootstrap` 创建一个常规 JavaScript 对象（第\
    \ 18 行），该对象将作为安全代码内标准 JavaScript 全局对象的替代品。\n\n## 5 评估\n\n本节旨在通过实验验证 SecureJS 编译器保留了原始程序的语义，并且编译后的代码符合内存隔离。首先，我们使用\
    \ Test262 测试套件测试 SecureJS 编译在实用 JavaScript 引擎 V8 [6]、Hop [12] 和 JerryScript [5]\
    \ 中是否保留了原始程序的语义。其次，我们通过测试编译后程序的执行是否会导致隐式字段访问，来测试 SecureJS 编译后的程序是否符合内存隔离。为此，我们在\
    \ Hop 和 JerryScript JavaScript 引擎中使用了 Test262 测试套件。"
