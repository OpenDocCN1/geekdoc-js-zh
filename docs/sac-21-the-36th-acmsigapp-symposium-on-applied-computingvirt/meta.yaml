  md: '**Our Approach.** In this paper, we propose a novel technique, based on a JavaScript-to-JavaScript
    compilation, to run JavaScript programs in an isolated realm. Our method focuses
    on rewriting the semantics of implicit field accesses of the given program and
    achieves memory isolation by using revised field access operations. For that,
    we define a subset of JavaScript language, JS<sup>explicit</sup>, in which primitive
    operations do not involve implicit field accesses. The translation from JavaScript
    to JS<sup>explicit</sup> replaces all the implicit field accesses of the source
    program with explicit operations. JS<sup>explicit</sup> programs are meant to
    run in a dedicated secure runtime environment that creates an isolated virtual
    realm and provides secure primitive operations that implicitly access the isolated
    virtual realm.


    We have implemented a secure JavaScript-to-JavaScript compiler, SecureJS. It transforms
    programs into equivalent ones, but which would execute as if they were running
    inside an isolated memory. The compilation relies on the translation to JS<sup>explicit</sup>
    and replaces primitive operations to secure versions and thus execute in an isolated
    memory, which simulates a JavaScript realm. The program running in the isolated
    memory can interact with others by intentionally exporting a value of the isolated
    memory to outside. This compiler is portable and only uses standard features so
    it can be used by any JavaScript engine that complies with ECMAScript 5.1 specification.
    Thus, the compiler provides an isolation mechanism independently of JavaScript
    implementation, and it enables us to use existing secure interaction libraries
    in any JavaScript engine.


    **Contributions.**


    +   - We propose a subset of the JavaScript language JS<sup>explicit</sup>, in
    which primitive operations do not involve implicit field accesses, and we present
    a translation from JavaScript to JS<sup>explicit</sup> (Section 3).

    - We provide a secure JavaScript-to-JavaScript compiler, SecureJS, as a tool.
    This compiler transforms programs into equivalent ones but which would execute
    as if they are running inside an isolated realm without relying on any built-in
    mechanisms. This implementation is portable to any ECMAScript 5.1 compliant implementations
    and the isolated realm supports all features of ECMAScript 5.1<sup>4</sup> (Section
    4).

    - We provide instrumented JavaScript engines that detect implicit field accesses
    and field accesses to intrinsic objects. We have used it to test empirically the
    semantic preservation and memory isolation of the SecureJS compiled programs.
    The instrumented engines can be used independently of SecureJS to test memory
    isolation. Our tool and the patch for the instrumented engine are publicly available<sup>5</sup>
    (Section 5).


    # 2 OVERVIEW


    We give an overview of our approach with an overly simple example that only use
    a field access operation that involves a dynamic type conversion and prototype
    chain field lookup.


    We demonstrate the evaluation of a JavaScript program construct. An evaluation
    of a single JavaScript program construct consists of a series of JavaScript *internal
    primitive operations*. We consider the following code fragment:


    ```

    1 Boolean.prototype.x = 10;

    2 var o = {toString: function() { return "x"; }};

    3

    4 true[o] === 10;

    ```


    The evaluation of the field lookup operation `true[o]` used in the test at line
    4 consists of a series of JavaScript primitive operations as follows:


    +   (1) It applies ToObject to true to dynamically converts the value to an object.
    The semantics of ToObject creates an instance of Boolean intrinsic object by calling
    `new Boolean(true)`, and an internal field `[[Prototype]]`<sup>6</sup> of the
    created object is set to the reference of `Boolean.prototype`.

    (2) It applies the internal operation ToString to the field name designator o
    to dynamically convert the value to a string. The semantics of ToString *implicitly
    accesses* the field `toString` of the object o and calls it. As we defined at
    line 2, the function returns a string "x".

    (3) The field lookup operation searches a field named "x" from the instance of
    Boolean intrinsic object. Since the instance does not have a field named "x",
    it *implicitly accesses* the field "x" of the object `Boolean.prototype`, which
    is the prototype chain object of the instance. Since the field value of the object
    `Boolean.prototype` is 10 as we defined at line 1, the result of the field lookup
    operation is evaluated to 10 and the equality test succeeds.


    The evaluation of a field lookup operation in JavaScript involves two implicit
    field accesses, and by one of these field accesses reads a field value of the
    intrinsic object `Boolean.prototype`.


    Our goal is to run programs *as if they were running in isolated realms*. For
    that we will actually run them in isolated *virtual realms* that rely on two ingredients:
    *i*) newly created controlled global and intrinsic objects, and, *ii*) a rerouting
    of the implicit field accesses from the original intrinsic objects to the controlled
    intrinsic objects.


    In order to reroute field accesses, we use the two steps code transformation.
    First, we transform programs into equivalent ones but were implicit operations
    have been replaced with equivalent explicit ones. For instance, in the above example,
    the implicit field accesses are involved in the dynamic type conversion. For example,
    the code `true[o] === 10` is converted as follows:


    ```

    1 // ToObject(true)

    2 var r = new Boolean(true);

    3 // ToString(o)

    4 var s = o.toString();

    5 // actual field lookup

    6 function Load(o,s) {

    7   if (o.hasOwnProperty(s)) return o[s];

    8   o = Object.getPrototypeOf(o);

    9   return Load(o,s);

    10 }

    11 Load(r,s) === 10;

    ```


    Second, we rewrite the code Load to reroute the field accesses as follows:


    > <sup>6</sup>In ECMAScript specification, internal field and method names are
    presented with a double square brackets `[[Name]]`. These methods and field names
    are not allowed to be called or accessed directly from JavaScript programs but
    callable or accessible from other internal methods or operations.


    <sup>4</sup>We intentionally do not provide eval and with constructs.

    <sup>5</sup>https://gitlab.inria.fr/securejs/sjs-compiler'
