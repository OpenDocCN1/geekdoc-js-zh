  md: '# 5.1 Experimentation Settings


    We implemented SecureJS on top of the front-end of the open-source JavaScript
    engine Hop compiler [12]. SecureJS takes a JavaScript program and generates an
    ECMAScript 5th specification compatible JavaScript program. Executions are done
    with state-of-the-art JavaScript engines V8, Hop, and JerryScript.


    We use the Test262 test suite and use the es5-tests branch from the github repository.
    Since the test programs of the Test262 test suites check the program states and
    flows by means of the assert function, the comparison of the resulting state confirms
    the equivalent execution of the programs. The Test262 programs also test the semantics
    of all the ECMAScript built-in functions and the semantics of the strict mode
    functions. We consider 10490 numbers of the test programs as our target test programs
    of the Test262 test suite and exclude 1082 numbers of the test programs from the
    target programs. In particular, we excluded tests using the eval function, the
    with statement. SecureJS does not support eval and with. Additionally, we excluded
    tests checking syntactic errors. The latest version of ECMAScript specifies less
    strict syntactic rules than the syntactic rules specified in ECMAScript 5th. Since
    the front-end parser of SecureJS supports the latest ECMAScript specification
    for compatibility, it parses the program that follows the latest ECMAScript specification
    and translates it into an ECMAScript 5th compatible program when possible.


    # 5.2 Testing Semantic preservation


    The goal of this experiment is to show that SecureJS compiler preserves the semantics
    of an original program. For that, we compiled target test programs of the Test262
    suites and ran them on V8, Hop, and JerryScript JavaScript engines, and we checked
    whether the resulting states of both the program and the corresponding compiled
    program are equivalent.


    Among 10490 numbers of the test programs, V8 passed 10386 successfully. 104 failed
    because of the semantics differences between the source language test 262 assumed
    and the latest JavaScript evolutions V8 supports. SecureJS preserves this result.
    That is, the 10386 successful tests remain successful after SecureJS compilation,
    and the 104 failed tests remain failed. Hop passed 10414 numbers of the test programs
    and failed in 76 tests, and JerryScript passed 10474 numbers of the test programs
    and failed in 16 tests. SecureJS also preserves these results.


    # 5.3 Testing Memory Isolation


    The SecureJS compiled programs run as if they were running in an isolated realm.
    If the compiled programs do not intentionally export values for interaction with
    others, the compiled and other uncompiled programs cannot reference each other.
    In this section, we test that such SecureJS compiled programs that do not use
    export comply with this isolation property. For that, we empirically verify that
    compiled programs ever access objects outside the controlled realm.


    For the experiment, we modified the Hop and JerryScript implementations to log
    all accesses to the [[Prototype]] field that is needed to walk prototype chains.
    We have used two radically different JavaScript implementations in order to reduce
    the probability of unnoticed [[Prototype]] accesses that would be removed by the
    JavaScript engine''s optimizer, independently of SecureJS. In addition, we modified
    the JerryScript engine also to log all accesses to global and intrinsic objects,
    which are outside of the controlled realm.


    We executed all the 10490 programs from the Test262 suite with the instrumented
    JavaScript engines. We confirmed that there is no field access attempt to global
    and intrinsic objects. We observed a single situation where [[Prototype]] is implicitly
    accessed by the programs compiled by SecureJS. During the initialization of a
    program, an empty object is created with an empty prototype chain by the expression
    Object.create(null). Later on, this object is used to optimized SecureJS field
    accesses. Since this object has no prototype chain, the accesses are harmless
    but are logged by the instrumented engines.


    # 6 RELATED WORK


    A number of studies have been carried out so as to provide memory isolation in
    JavaScript.


    Bhargavan et al. [2] proposes defensive JavaScript (DJS), which is a small subset
    of the JavaScript language satisfying static typing constraints. DJS achieves
    memory isolation by the use of a small subset of the JavaScript language that
    does not involve dynamic features. The main limitation of DJS is that legacy code
    needs to be manually rewritten in the DJS subset and be typable in order to achieve
    memory isolation. A program written in DJS does not rely on a realm and cannot
    use built-in functions defined in ECMAScript specification.


    Swamy et al. [14] proposes JS*, which is a programming language supporting various
    dynamic features of JavaScript, while ensuring type safety in the presence of
    an untrusted JavaScript program. As it requires type-annotations for the trusted
    programs, legacy code needs to be manually rewritten in the JS*, and it supports
    only a small subset of JavaScript language in terms of the support of built-in
    functions. It implements a limited form of interfaces for inter-communication
    since the interface requires type-annotations and must implement the interface
    functions with the compiled interpreter programs.


    Terrace et al. [15] implements a JavaScript interpreter written in JavaScript.
    It supports interactions that use primitive values, typed objects, and functions
    that has typed argument and return values, and it does not work on the JerryScript
    engine. For these reasons, it cannot be applied to IoT environments in particular.


    Vasilakis et al. [16] proposes BreakApp, which provides isolation and interaction
    policies between programs. It relies on various levels of built-in isolation primitives,
    yet the isolation mechanisms strongly depends on Node.js. One of the isolation
    mechanisms BreakApp relies on is the isolated realm supported by Node.js.


    Guha et al. [7] proposes a formal semantics of a core calculus, λJS, and provides
    a reduction step of JavaScript to λJSexplicit. This reduction step is similar
    to our translation to JSexplicit, but our translation to JSexplicit focuses on
    rewriting primitive operations to their secure versions in order to simulate a
    JavaScript realm.


