  md: '# SecureJS Compiler: Portable Memory Isolation in JavaScript*


    Yoonseok Ko

    Inria

    Sophia-Antipolis, France

    yoon-seok.ko@inria.fr


    Tamara Rezk

    Inria

    Sophia-Antipolis, France

    tamara.rezk@inria.fr


    Manuel Serrano

    Inria

    Sophia-Antipolis, France

    manuel.serrano@inria.fr


    # ABSTRACT


    The memory isolation mechanism plays an essential role to provide security enforcement
    in JavaScript programs. Existing secure interaction libraries such as Google Caja,
    SES, and VM2 rely on built-in memory isolation mechanisms provided by Node.js
    and browsers, yet most of the other engines such as JerryScript and Duktape, which
    are implementations for IoT devices, do not support such isolation mechanisms.


    In this paper, we report about the design and implementation of SecureJS, a portable
    JavaScript-to-JavaScript compiler that enforces memory isolation. As it only uses
    standard features, the compiled code it generates can be used by any JavaScript
    engine. We validated empirically the semantics preservation and memory isolation
    of SecureJS compiled programs by using 10,490 test programs of ECMAScript Test262
    test suite. We also developed a novel experiment to evaluate memory isolation
    property of compiled code by instrumented JavaScript engines.


    # CCS CONCEPTS


    +   • Security and privacy → Software security engineering; Web application security;
    • Software and its engineering → Syntax; Semantics;


    # KEYWORDS


    Compiler, Memory Isolation, JavaScript


    ACM Reference Format:

    Yoonseok Ko, Tamara Rezk, and Manuel Serrano. 2021. SecureJS Compiler: Portable
    Memory Isolation in JavaScript. In *The 36th ACM/SIGAPP Symposium on Applied Computing
    (SAC ''21)*, March 22–26, 2021, *Virtual Event, Republic of Korea*. ACM, New York,
    NY, USA, Article 4, 10 pages. https://doi.org/10.1145/3412841.3442001


    # 1 INTRODUCTION


    JavaScript has been growing at a rapid pace over the years due to its easy manipulation
    and deployment in development. The dynamic nature of the language provides a smooth
    environment for the integration of code, and it contributes to the easy and fast
    development of complex applications [10].


    Whereas the dynamic features of JavaScript play an essential role in the language
    popularity by simplifying application developments, they also enable malicious
    JavaScript libraries to exploit these dynamic features to break the integrity
    and confidentiality of the applications [3]. Within a single JavaScript program
    execution all components share a global object and intrinsic objects such as Object
    and Object.prototype. Due to the idiosyncratic JavaScript semantics whose primitive
    operations implicitly access these global and intrinsic objects, all the components
    that form an application are tightly bond together. This gives opportunities to
    a malicious third-party code to pervert or extract undue pieces of information
    from others execution.


    Various researches have been carried out so as to provide security enforcement
    achieved by memory isolation [2, 8, 9, 11, 13–16]. Total isolation is the simplest
    way to run programs without unintended interplay. However, more complex programs
    that need interactions between programs cannot enjoy the benefit of isolation.
    The practical secure JavaScript programming solutions such as Google Caja [9],
    SES [1], and VM2 [13] rely on such an isolation mechanism provided by Node.js
    or browsers and provide secure interactions between isolated programs by controlling
    the interactions. Still, such built-in isolation mechanisms are not supported
    other popular JavaScript implementations such as JerryScript¹ and Duktape², which
    are JavaScript implementations for micro-controllers, and thus, it limits the
    use of these secure interaction solutions in a practical use. It motivates the
    need for portable isolated JavaScript environments independent from JavaScript
    implementations.


    A basic building block for JavaScript memory isolation is a *realm* (as it is
    defined in the latest ECMAScript specification³), which consists of a global object
    and intrinsic objects. Programs running in the same realm share the global and
    intrinsic objects, and isolated realms initially do not share any references between
    the realms. Running programs in different isolated realms guarantees that their
    memory accesses do not interfere with each other. However, programs in a realm
    are able to interact with programs in another realm by intentionally exporting
    a value, and it breaks the isolation. Thus, isolated realms are a basic and essential
    unit for secure program executions, and they can achieve security enforcement
    on further interactions by combining with the existing secure JavaScript programming
    solutions. Unfortunately, JavaScript realms are only supported by some JavaScript
    implementations, such as Node.js and browsers, and it limits the use of the existing
    secure programming solutions in other JavaScript implementations.


    ¹https://jerryscript.net

    ²https://duktape.org

    ³https://www.ecma-international.org/ecma-262/#sec-code-realms


    1265'
