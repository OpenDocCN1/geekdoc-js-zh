  \ JavaScript 应用的一些示例。创建你喜爱的网站的程序员们使用 JavaScript 制作了它们。\n\n5\n\n\n\n\n\n# 字符串与布尔值\n\
  \n像你狗的名字和眼睛颜色这样的数据在 JavaScript 中用字符串（strings）表示。字符串是字母、数字和标点符号的序列。字符串必须包含在引号中，例如：`“I\
  \ am a string.”`\n\n`.length` 命令告诉你字符串中有多少个字符。\n\n## 数据类型与操作\n\n最后，只能取两个可能值之一（`true`\
  \ 或 `false`）的数据被称为 `Boolean`（布尔值）。布尔值可以表示你是否喜欢某本书。\n\n每种数据类型都有其自己的一组可能的操作，或者处理它们的方法。你可以将两个数字相乘，但不能相乘两个字符串。你可以找到字符串的长度或字符数量。对于布尔，你可以检查两个值是否都为真。当你处理每种数据类型时，你将学习哪些运算符可以用它们。\n\
  \n你可以将任何内容转换为数据，从你是否喜欢某本书到你读了多少页，再到你喜欢的角色名字。\n\n## 变量\n\n变量存储了你以后要用的数据。当数据存储在变量中时，它被称为值（value）。每个变量可以有一个唯一的名称，并恰好存储一个值。要创建一个变量，使用关键字\
  \ `var`。\n\n```javascript\nvar myDogsName = “Rover”;\nvar myEyeColor = “brown”;\n\
  var myAge = 11;\nvar isBookGood = true;\n```\n\n选择有意义且自明其意的变量名是有帮助的，这样你的代码易于阅读。变量名不能有空格，也不能是关键字。\n\
  \n许多 JavaScript 控制台使用不同的颜色来帮助显示代码的每个部分。代码在你的屏幕上可能是这样的。\n\n在上一页的示例中，`var myDogsName`\
  \ 告诉 JavaScript `myDogsName` 是一个变量。`=` 是告诉 JavaScript `myDogsName` 应该存储值 `Rover`\
  \ 的方式。注意 `“Rover” 被包含在引号中，表示它是一个字符串。\n\n同样，`myAge` 是存储数值 `11` 的变量名。`isBookGood`\
  \ 存储了布尔值 `true`。如果你的家里有宠物，当你使用 JavaScript 时，它的名字可以可以是一个变量。\n\n## 重新赋值变量\n\n你可以更改已创建的变量的值。当你这样做时，不需要关键字\
  \ `var`，因为你不是在第一次创建变量。例如：\n\n```javascript\nmyDogsName = “Fido”;\nmyEyeColor = “green”;\n\
  ```\n\n是时候尝试一个有趣的活动了！首先，打开你的控制台。创建一个名为 `myFruit` 的新变量并给它赋值 `“Strawberry.”`。然后输入\
  \ `console.log(myFruit)`。你看到了什么？现在，通过分配一个新值 `“apple.”` 来更改 `myFruit` 的值。再次使用 `console.log(myFruit)`。你看到了什么？\n\
  \n## 比较运算符\n\n人类在生活中会这样做，计算机需要比较两个事物以查看它们是否相同。这种检查使用比较运算符完成。比较运算符的结果为 `true` 或 `false`。\n\
  \n## 存储数据\n\n一个比较运算符是 `===`。该运算符检查值和类型是否相同。例如，虽然数字 `12` 和字符串 `“12”` 有相同的值，但它们的类型不同。\n\
  \n```javascript\nvar numericValue = 12;\nvar stringValue = “12”;\nnumericValue ==\
  \ stringValue // true\nnumericValue === stringValue // false\n```\n\n有很多常见的比较运算符。让我们为下面的示例创建一个变量\
  \ `x = 10`。在这里，字母 `x` 代表数字 `10`。\n\n| 运算符 | 操作 | 示例 | 结果 |\n| :--- | :--- | :---\
  \ | :--- |\n| `==` | 等于 | `x == 11` | false |\n| `!=` | 不等于 | `x != 11` | true |\n\
  | `>` | 大于 | `x > 12` | false |\n| `<` | 小于 | `x < 12` | true |\n| `>=` | 大于等于 |\
  \ `x >= 10` | true |\n| `<=` | 小于等于 | `x <= 10` | true |\n\n## 数组\n\n数组在 JavaScript\
  \ 中也很重要。假设你正在写生日愿望清单。你在一张纸上写下第一个项目（或变量）。在另一张纸上写第二个项目（变量）。你继续这样写下去，直到每个项目都写下来。\n\n\
  但你不想跟踪很多张带有愿望清单项的纸。你想制作一个大列表，将所有变量写在一张纸上。这就是数组派上用场的地方。数组用于表示各种事物的列表。\n\n与其在像下面的列表中拥有五个不同的变量：\n\
  \n```javascript\nvar myFirstItem = “bicycle”;\nvar mySecondItem = “bike helmet”;\n\
  var myThirdItem = “bike bell”;\nvar myFourthItem = “bike mudguard”;\nvar myFifthItem\
  \ = “bike basket”;\n```\n\nJavaScript 允许你使用方括号创建一个包含许多项的数组。\n\n```javascript\nvar\
  \ myWishList = [“bicycle”, “bike helmet”, “bike bell”, “bike\nmudguard”, “bike basket”];\n\
  ```\n\n\n\nJavaScript 会记住数组中元素的顺序。这种顺序被称为 `index`（索引）。如果你忘记了数组中的第一个元素是什么（例如），你可以询问\
  \ JavaScript。然而，索引有点小技巧，因为第一个元素被标记为 0，而不是 1。在例例中，“bicycle”是第 0 个元素，“bike helmet”是第\
  \ 1 个，以此此类推。\n\n以下是如何使用索引在数组中查找特定元素的示例：\n\n```javascript\nconsole.log(myWishList[3]);\
  \ // bike mudguard\nconsole.log(myWishList[4]); // bike basket\n```\n\n假设你想存储关于你猫咪的信息，比如它的昵称、年龄、颜色、品种、最喜欢的玩具和最喜爱的食物。你还想为你朋友的猫和你表哥的猫存储相同的信息。这意味着有大量的变量需要记录。为了帮助你记录所有信息，你可以创建一个对象。\n\
  \n## Objects\n\n对象是另一种存储数据的方式。对象不像数组那样使用索引来访问数据，而是使用被称为 `keys`（键）的字符串。每个键都对应一个值。在我们的猫对象中有六个键值对——每个信息各对应一个。\n\
  \n```javascript\nvar myCat = {\n  \"nickname\": \"Fluffy\",\n  \"age\": 2,\n  \"\
  color\": \"white\",\n  \"breed\": \"Persian\",\n  \"toy\": \"paper ball\",\n  \"\
  food\": \"yummy yums\"\n};\n```\n\nJavaScript 几乎可以完成任何你想让它做的事情，包括存储猫颜色、品种、最喜欢的玩具等更多信息！\n\
  \n对象也可以由数组组成。键可以引用一个数组，而不是单个值。请看下例：\n\n```javascript\nvar iceCreamsike = [\"rock\"\
  , \"chocolate\"];\nvar myFavoriteThings = {\n  \"authors\": [\"Judy Blume\", \"\
  J. Rowling\", \"Walter Dean Myers\"],\n  \"iceCream\": iceCreamsike,\n  \"petsIHave\"\
  : [\"cat\", \"goldfish\", \"tarantula\"]\n};\n```\n\n### Mission: Code It!\n\n在\
  \ Chrome 中打开 JavaScript 控制台。\n1. 创建一个数组 `myTopFiveBooks`，由你最喜欢的五本书名组成。\n2. 创建一个数组\
  \ `myTopFiveGames`，由你最喜欢的五种桌游组成。\n3. 创建一个数组 `myTopFiveSnacks`，由你最喜欢的五种零食组成。\n4.\
  \ 最后，创建一个对象 `topFiveThings`，由你在步骤 1-3 中创建的数组组成。\n5. 对你的对象 `topFiveThings` 使用 `console.log`。你看到了什么？\n\
  \n# Chapter 4 Conditional Statements and Functions\n\n每天都会根据某些条件是否成立来做出决定。这种决策在编程中可以通过条件语句来实现。最简单的条件语句是\
  \ `if`：如果某事为真，则执行操作。\n\n如果你想在条件为真执行某件事，而在假时不做另一件事怎么办？在这种情况下，你可以使用 `if...else`。例如，如果你今天觉得不舒服就留在家，否则就去学校。\n\
  \n```javascript\nvar feelsSick = false;\nif (feelsSick == true) {\n  console.log(\"\
  Stay home.\");\n} else {\n  console.log(\"Go to school.\");\n}\n```\n\n当你想要反复执行同一个任务时，你可以编写函数。函数是一组你命名的指令。函数就像快捷方式。每当你把函数放入代码中，JavaScript\
  \ 就知道运行所有的指令，而不需要你每次都重写它们。\n\n函数的写法如下：\n\n```javascript\nfunction myFirstFunction(){\n\
  \  console.log(\"Hi, Coder!\");\n}\n```\n\n使用名称 `myFirstFunction()` 来指示电脑显示“Hi,\
  \ Coder!”。\n\n```javascript\nmyFirstFunction(); // Hi, Coder!\n```\n\n函数旁边的括号可以包含参数（arguments）。参数可以是数字、字符串、布尔值甚至是变量。例如，如果你写了一个检查数字是否为偶数的函数，你可以测试不同的数字作为参数。\n\
  \n现在你已经掌握了一些 JavaScript 的基础知识。继续磨练你的技能吧。谁知道呢？也许你可能会开发出下一个伟 JavaScript 作品！\n\n###\
  \ Mission: Code It!\n\n在 Chrome 中打开控制台。定义一个函数 `guessTheNumber`，接收数字 `myGuessNumber`\
  \ 作为唯一参数。在函数内部，创建一个变量 `myRandomNumber` 并赋值一个 1 到 10 之间的数字。使用条件语句 `if...else` 检查\
  \ `myGuessNumber` 是否等于 `myRandomNumber`。如果是，函数应该显示“You guessed it!”；否则（else），它应该显示“Nope,\
  \ try again.”。\n\n看看你的朋友能否猜中那个数字！使用这段代码作为示例来帮助完成活动。\n\n# Glossary\n\narguments:\
  \ 传递给函数的值，以便它们执行任务\n\narrays: 存储项目列表的变量\n\nconditional statements: 根据条件的真假告诉计算机执行不同任务的代码行\n\
  \nindex: 数组中元素的数字顺序\n\nkeywords: 编程语言中只能以特定方式使用的单词\n\nobject: 描述某物的键的集合\n\nprogramming\
  \ language: 一组告诉计算机如何理解程序的规则\n\n\n\n\n# 定义\n\n- **程序 (programs)**：计算机执行的特定有序命令集\n\
  - **字符串 (strings)**：用引号括起来的字母、数字和符号序列\n- **语法 (syntax)**：规定编写程序时符号、关键字和允许单词的规则\n\
  - **变量 (variable)**：用于存储数据的容器\n\n## 30\n\n![](img/14.png)![](img/Mission_Javascript_Spine_PM1.png)![](img/33.png)![](img/34.png)![](img/10.png)![](img/37.png)![](img/14.png)![](img/35.png)![](img/shutterstock_489762406_spy1.png)![](img/434.png)![](img/shutterstock_489762406_computer1.png)![](img/27.png)\n\
