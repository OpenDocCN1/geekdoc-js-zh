    # Introduction

    ## Language behind the Screen


    Want to write video games or even control robots? JavaScript is a great programming
    language to learn to do that.


    4


    ![](image/Mission_HTML_background1.jpg)![](image/33.png)![](image/34.png)![](image/35.png)![](image/10.png)![](image/37.png)![](image/14.png)![](image/Mission_HTML_background2.jpg)![](image/39.png)![](image/40.png)![](image/41.png)![](image/14.png)![](image/43.png)![](image/44.png)![](image/45.png)![](image/46.png)![](image/47.png)![](image/48.png)![](image/GettyImages-922708940.jpg)![](image/27.png)![](image/29.png)


    JavaScript is used everywhere! Popular websites such as Facebook, Twitter, Amazon,
    and YouTube use JavaScript to make their websites fun and interactive. Animations,
    sounds, and maps with location markers are some examples of JavaScript in action.
    The coders who created some of your favorite websites used JavaScript to make
    them.


    5


    ![](image/Mission_HTML_background.jpg)![](image/14.png)![](image/55.png)![](image/56.png)![](image/57.png)![](image/58.png)![](image/59.png)![](image/22.png)![](image/61.png)![](image/62.png)![](image/29.png)![](image/64.png)![](image/14.png)![](image/shutterstock_489762406_interior.png)![](image/27.png)


    Computers, by themselves, are not smart. They can do only what humans tell them
    to do. We talk to them through computer programs, which are step-by-step instructions
    written in a specific programming language. JavaScript is one such programming
    language.


    # Chapter 1: What Is JavaScript?


    6


    ![](image/Mission_HTML_background1.jpg)![](image/34.png)![](image/35.png)![](image/10.png)![](image/37.png)![](image/14.png)![](image/29.png)![](image/80.png)![](image/81.png)![](image/82.png)![](image/GettyImages-52252674.jpg)![](image/27.png)


    What makes up a programming language? Like other types of languages, programming
    languages have specific `syntax`. The `syntax` includes special `keywords` as
    well as `punctuation`. `Punctuation` could include semicolons, colons, and periods,
    as well as parentheses and brackets.


    All `keywords` and `punctuation` in a programming language must appear in a `particular`
    order. That’s what the word `syntax` means. If something is out of order, the
    computer won’t be able to read the language. It won’t do what you want to do.
    Practice makes perfect. Do a lot of coding, and you’ll be able to read and write
    it like a pro.


    7


    ![](image/14.png)![](image/14.png)![](image/14.png)![](image/Mission_HTML_background3.jpg)![](image/90.png)![](image/91.png)![](image/92.png)![](image/93.png)![](image/14.png)


    JavaScript works together with two other programming languages, `HTML` and `CSS`,
    to create awesome websites. It can be used to find, organize, and change pieces
    of information, or `data`, that you give to a website, such as you create an account
    or log in. It does all of this in the background, so that you don’t have to refresh
    the web page to see all the changes.


    8


    ![](image/14.png)![](image/14.png)![](image/14.png)![](image/108.png)


    There may be a lot going on behind the scenes in JavaScript, but with just a little
    effort, anyone can learn it. And once you do, you too may be creating an animation
    or even designing the next best-selling video game! Anyone at any age can learn
    to code.


    9


    ![](image/Mission_HTML_background.jpg)![](image/14.png)![](image/55.png)![](image/56.png)![](image/57.png)![](image/58.png)![](image/59.png)![](image/22.png)![](image/61.png)![](image/62.png)![](image/29.png)![](image/64.png)![](image/14.png)![](image/shutterstock_489762406_interior1.png)![](image/27.png)


    One of the powers of programming languages is that they can manipulate `data`.
    `Data` is any piece of information stored in a computer. Your dog’s name, your
    eye color, your age, how many siblings you have, and whether you liked a book
    or not are all examples of `data`.


    # Chapter 2: All about the Data


    10


    ![](image/Mission_HTML_background1.jpg)![](image/10.png)![](image/37.png)![](image/14.png)![](image/29.png)![](image/132.png)![](image/34.png)![](image/35.png)![](image/135.png)![](image/shutterstock_178172084_spy3.png)![](image/Page10-11-Basic-Arithmetic.png)


    JavaScript uses three basic types of data: `numbers`, `strings`, and `Booleans`.


    Data such as your age and how many siblings you have are expressed as `numbers`.
    In JavaScript, `numbers` are typed just as you’d normally write them, including
    decimals. You can even use JavaScript as a calculator. It can do both basic and
    more complicated calculations.


    Input lines in JavaScript begin with the `>` symbol. The output lines begin with
    the `<` symbol.


    11

