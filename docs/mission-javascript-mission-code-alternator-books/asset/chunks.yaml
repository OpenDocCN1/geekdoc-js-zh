    There are lots of common comparison operators. Let’s create a variable var x =
    10 for the examples below. Here, the letter x  represents the number 10.


    Arrays  are also important in JavaScript. Let’s say you are writing your birthday
    wish list. You write your first item, or variable, on one sheet of paper. You
    write your second item (variable) on another. You keep going this way until each
    item is written down.


