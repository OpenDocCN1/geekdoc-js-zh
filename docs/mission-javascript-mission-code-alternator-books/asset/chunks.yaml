- fmt: "\nJavaScript will remember the order of the items in an array. This order\
    \ is called the `index`. If you ever forget what the first item in your array\
    \ is, for example, you can ask JavaScript. However, the index is a little tricky,\
    \ because the first item is labeled with 0, not 1. In this example, “bicycle”\
    \ is item number 0, “bike helmet” is number 1, and so on.\n\nHere is an example\
    \ of how to find a specific item in an array with the index:\n\n```javascript\n\
    console.log(myWishList[3]); // bike mudguard\nconsole.log(myWishList[4]); // bike\
    \ basket\n```\n\n\n\nLet’s say you want to store information about your cat, such\
    \ as its nickname, age, color, breed, favorite toy, and favorite food. You also\
    \ want to store the same information about your friend’s cat and your cousin’s\
    \ cat. That is a lot of variables to keep track of. To help you keep track of\
    \ all this information, you can create an object.\n\n## Objects\n\nAn object is\
    \ another way to store data. Instead of using an index to access data, as an array\
    \ does, an object uses strings called `keys`. Each key is matched to a value.\
    \ There are six key-value pairs in our cat object—one for each piece of information.\n\
    \n```javascript\nvar myCat = {\n  \"nickname\": \"Fluffy\",\n  \"age\": 2,\n \
    \ \"color\": \"white\",\n  \"breed\": \"Persian\",\n  \"toy\": \"paper ball\"\
    ,\n  \"food\": \"yummy yums\"\n};\n```\n\nJavaScript can do almost anything you\
    \ want it to, including storing information about your cat’s color, breed, favorite\
    \ toy, and more!\n\nAn object can also be made up of arrays. Instead of a single\
    \ value, a key can refer to an array. See the example below:\n\n```javascript\n\
    var iceCreamsike = [\"rock\", \"chocolate\"];\nvar myFavoriteThings = {\n  \"\
    authors\": [\"Judy Blume\", \"J. Rowling\", \"Walter Dean Myers\"],\n  \"iceCream\"\
    : iceCreamsike,\n  \"petsIHave\": [\"cat\", \"goldfish\", \"tarantula\"]\n};\n\
    ```\n\n### Mission: Code It!\n\nOpen up the JavaScript console in Chrome. \n1.\
    \ Create an array `myTopFiveBooks` made of your five favorite book titles.\n2.\
    \ Create an array `myTopFiveGames` made of your five favorite board games.\n3.\
    \ Create an array `myTopFiveSnacks` made of your five favorite snack foods.\n\
    4. Finally, create an object `topFiveThings` made up of the arrays you created\
    \ in steps 1–3.\n5. Use `console.log` on your object `topFiveThings`. What do\
    \ you see?\n\n## Chapter 4 Conditional Statements and Functions\n\nEvery day,\
    \ you make decisions based on certain conditions being true. Such decision-making\
    \ can be expressed in programming through conditional statements. The simplest\
    \ conditional statement is `if`: if something is true, then do this.\n\nWhat if\
    \ you wanted to do one thing when the condition is true but another thing when\
    \ the condition is false? In that case, you can use `if...else`. For example,\
    \ if you feel sick today, you stay home, or else you go to school.\n\n```javascript\n\
    var feelsSick = false;\nif (feelsSick == true) {\n  console.log(\"Stay home.\"\
    );\n} else {\n  console.log(\"Go to school.\");\n}\n```\n\nWhen you want to perform\
    \ the same task over over, you can write a function. A function is a set of instructions\
    \ that you give a name. The function acts like a shortcut. Whenever you put the\
    \ function in your code, JavaScript knows to run all the instructions without\
    \ you having to write them out each time.\n\nA function is written as follows:\n\
    \n```javascript\nfunction myFirstFunction(){\n  console.log(\"Hi, Coder!\");\n\
    }\n```\n\nUse the name `myFirstFunction()` to instruct the computer to display\
    \ the words, “Hi, Coder!”\n\n```javascript\nmyFirstFunction(); // Hi, Coder!\n\
    ```\n\nThe parentheses next to the function name can contain arguments. Arguments\
    \ can be numbers, strings, Booleans, or even variables. For example, if you wrote\
    \ a function that checks if a number is even, you can test different numbers as\
    \ arguments.\n\nNow you have some of the basics of JavaScript down pat. Keep honing\
    \ your skills. Who knows? Someday you might develop the next great JavaScript\
    \ creation!\n\n### Mission: Code It!\n\nOpen the console in Chrome. Define a function\
    \ `guessTheNumber` that receives a number, `myGuessNumber`, as its only argument.\
    \ In the function, create a variable `myRandomNumber` and assign it a number between\
    \ 1 and 10. Use the conditional `if...else` to check if `myGuessNumber` equals\
    \ `myRandomNumber`. If it does, the function should show, “You guessed it!” Otherwise\
    \ (else), it should show, “Nope, try again.”\n\nSee if your friends can guess\
    \ the number! Use this code as an example to help with the activity.\n\n## Glossary\n\
    \narguments: values given to functions so they can do their tasks\n\narrays: variables\
    \ that store lists of items\n\nconditional statements: lines of code that tell\
    \ the computer to perform different tasks based on whether a condition is true\
    \ or false\n\nindex: the numeric order of items in an array\n\nkeywords: words\
    \ in a programming language that can be used only in a certain way\n\nobject:\
    \ a collection of keys that describe something\n\nprogramming language: a set\
    \ of rules that tell computers how to understand programs\n"
