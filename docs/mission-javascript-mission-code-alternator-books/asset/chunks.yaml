    # Strings and Booleans


    Data such as your dog’s name and your eye color are represented by strings in
    JavaScript. Strings are sequences of letters, numbers, and punctuation. Strings
    have to be enclosed in quotation marks, like this: `“I am a string.”`


    The command `.length` tells you how many characters are in a string.


    # Data Types and Operations


    Finally, data that can be only one of two possible values, `true` or `false`,
    is called a `Boolean`. A Boolean could be whether you liked a book or not.


    Each data type has its own set of possible operations, or ways of working with
    them. You can multiply two numbers, but you cannot multiply two strings. You can
    find the length, or number of characters, of a string. With Booleans, you can
    check if two values are both true. As you work with each data type, you will learn
    which operators can be used with each of them.


    You can turn anything into a piece of data, from whether you liked a book to how
    many pages you read to the names of your favorite characters.


    # Variables


    A variable holds a piece of data that you want to use later. When data is stored
    in a variable, it is called a value. Each variable can have a unique name and
    hold exactly one value. To create a variable, use the keyword `var`.


    ```javascript

    var myDogsName = “Rover”;

    var myEyeColor = “brown”;

    var myAge = 11;

    var isBookGood = true;

    ```


    It helps to choose variable names that are meaningful and self-explanatory so
    that your code is easy to read. Variable names cannot have spaces and cannot be
    keywords.


    Many JavaScript consoles use different colors to help show each part of the code.
    This is how the code might look on your screen.


    In the examples on the previous page, `var myDogsName` tells JavaScript that `myDogsName`
    is a variable. The `=` sign is the way you tell JavaScript that `myDogsName` should
    hold the value `Rover`. Notice that `“Rover” is enclosed in quotes to show that
    it is a string.


    Similarly, `myAge` is the name of the variable that holds the numeric value `11`.
    And `isBookGood` holds the Boolean value `true`. If your family has a pet, its
    name could be a variable when you work with JavaScript.


    # Reassigning Variables


    You can change the value of a variable that you have created. When you do this,
    the keyword `var` is not needed because you are not creating the variable for
    the first time. For example:


    ```javascript

    myDogsName = “Fido”;

    myEyeColor = “green”;

    ```


    It’s time to try a fun activity! First, open your console. Create a new variable
    named `myFruit` and assign it `“Strawberry.”` Then type `console.log(myFruit)`.
    What do you see? Now, change the value of `myFruit` by assigning it a new value:
    `“apple.”` Again, use `console.log(myFruit)`. What do you see?


    # Comparison Operators


    Sometimes humans do in real life, computers need to compare two things to see
    if they are the same. Such checks are done using comparison operators. Comparison
    operators result in either `true` or `false`.


    # Storing Data


    One comparison operator is `===`. This operator checks to see if the value and
    type are the same. For example, while the number `12` and the string `“12”` have
    the same value, they do not have the same type.


    ```javascript

    var numericValue = 12;

    var stringValue = “12”;

    numericValue == stringValue // true

    numericValue === stringValue // false

    ```


    There are lots of common comparison operators. Let’s create a variable `x = 10`
    for the examples below. Here, the letter `x` represents the number `10`.


    | Operator | Operation | Example | Result |

    | :--- | :--- | :--- | :--- |

    | `==` | Equal to | `x == 11` | false |

    | `!=` | Not equal to | `x != 11` | true |

    | `>` | Greater than | `x > 12` | false |

    | `<` | Less than | `x < 12` | true |

    | `>=` | Greater than or equal to | `x >= 10` | true |

    | `<=` | Less than or equal to | `x <= 10` | true |


    # Arrays


    Arrays are also important in JavaScript. Let’s say you are writing your birthday
    wish list. You write your first item, or variable, on one sheet of paper. You
    write your second item (variable) on another. You keep going this way until each
    item is written down.


    But you don’t want to keep track of lots of sheets of paper with your wish list
    items. You want to make one big list with all the variables written on one sheet.
    That’s where arrays come in handy. Arrays are used to represent a list of various
    things.


    Instead of having five different variables in a list like the one below:


    ```javascript

    var myFirstItem = “bicycle”;

    var mySecondItem = “bike helmet”;

    var myThirdItem = “bike bell”;

    var myFourthItem = “bike mudguard”;

    var myFifthItem = “bike basket”;

    ```


    JavaScript lets you create an array with many items using square brackets.


    ```javascript

    var myWishList = [“bicycle”, “bike helmet”, “bike bell”, “bike

    mudguard”, “bike basket”];

    ```

