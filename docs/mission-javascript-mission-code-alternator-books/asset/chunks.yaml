    One comparison operator is ===.  This operator checks to see if the value and
    the type of the value of two variables are both the same. For example, while the
    number 12 and the string “12” have the same value, they do not have the same type
    of value because one is a number and one is a string.


    var numericValue = 12; //number


    var stringValue = “12”; //string


    numericValue == stringValue //true


    numericValue === stringValue //false


    //The number 12 is not equal to the


    string “12”


    As humans do in real life, computers often need to compare two things to see if
    they are the same.


