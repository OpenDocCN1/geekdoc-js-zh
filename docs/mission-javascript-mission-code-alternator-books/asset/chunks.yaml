    # Definitions


    - **programs**: specific sets of ordered commands for a computer to perform

    - **strings**: sequences of letters, numbers, and symbols that are enclosed in
    quotation marks

    - **syntax**: the rules that specify the symbols, keywords, and allowed words
    for writing programs

    - **variable**: a container for storing data


