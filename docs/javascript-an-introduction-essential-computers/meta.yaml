    `open()` 方法允许你指定 URL、窗口名称以及新窗口的特性。\n\n- 1. 你想要加载到新窗口中的内容\n- 2. 将触发显示的事件\n- 3.\
    \ 新窗口的特性\n\n## 打开新窗口\n\n使用 JavaScript 打开新窗口非常简单。只需将此代码放入你的 HTML 文档中：\n\n```javascript\n\
    window.open(\"url\", \"name\", \"features\");\n```\n\n## 设计新窗口\n\n网页浏览器的外观根据用户的偏好有很大不同。在决定为任何打算创建的新窗口包含或省略哪些特性时，你需要考虑所有的浏览器设置。仅仅因为你无法在屏幕上看到某个浏览器功能，并不意味着你网站的访问者的浏览器配置也是完全相同的。因此，即使你在浏览器中关闭了工具栏，也要记住使用\
    \ `toolbar=no` 代码，以确保在所有浏览器中查看时新窗口中都不显示工具栏。\n\n## 可选方案\n\n这个典型的网页显示了当你使用 JavaScript\
