  md: '# USING COMMENTS IN JAVASCRIPT


    We saw in the last chapter how to use comments in HTML to hide JavaScript from
    older browsers. "Comments" also have a second use and a second meaning when compiling,
    because they can also be used within the JavaScript in order to write notes to
    yourself that will not be seen on the web page. Such comments are preceded or
    contained within comment tags, and the tags used will depend on whether you want
    to "comment out" a single line or several lines of notes. When writing a page
    JavaScript code, these comments can be a considerable aid in writing your code,
    allowing you to leave reminders for when you return to writing.


    # JAVASCRIPT COMMENTS


    +   - JavaScript comments enable you to intersperse your lines of code with lines
    of "invisible" explanatory notes. Some of your comments will be temporary editing-in-progress
    notes, but you may choose to leave others in the code to remind you what you were
    thinking of at the time of writing when you need to remove or improve the code.

    - If correctly formatted, your comments will not be displayed by the web browser,
    so anything can be typed following a comment tag.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_26_0.png)


    # COVER YOUR TRACKS


    Comments are not invisible to anyone who can read your source code, and any reader
    can do this simply by choosing from Internet Explorer''s View menu or opening
    the HTML document in a text reader. Therefore, you may wish to remove some of
    your comments before making your web pages available on the web.'
