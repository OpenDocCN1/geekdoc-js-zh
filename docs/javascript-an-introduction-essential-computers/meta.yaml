    \n![](img/aafe1085e7f90302649c9c77d13f0ae9_41_1.png)\n\n# The name tag\n\nIt helps\
    \ to think of the area on the page identified by the name tag as the space that\
    \ the image occupies. The files on.jpg and off.jpg will occupy the space called\
    \ image, depending on the cursor’s action.\n\n# PRELOADING IMAGES\n\nYou can use\
    \ JavaScript to preload images. This means that while your web page is first loading\
    \ in the visitor’s browser window, you can send the specified images to the browser\
    \ cache, a folder on your computer that stores recently accessed web pages. If\
    \ a web page is cached here, the browser can access it more quickly than a remote\
    \ server. Certain images required for rollovers are not visible until the page\
    \ has loaded. These are the images that can be usefully preloaded into the cache,\
    \ so they really spring into life when needed rather than being subject to the\
    \ slight delay that usually happens while they are being downloaded from the web.\n\
    \n# PRELOADING ON.JPG\n\nThe code to make on.jpg appear, when we pullover off.jpg,\
    \ goes into the body of the web page, but the code for preloading on.jpg goes\
    \ into the <head> tags within.\n\n```\n<head>\n<script language=\"JavaScript\"\
    >\n  Image=new Image(20,20)\n  Image.src=\"on.jpg\"\n</script>\n</head>\n```"
