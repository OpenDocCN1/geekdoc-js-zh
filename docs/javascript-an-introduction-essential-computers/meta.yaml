    browser attempts to go to the new page. Since there is no page to go to, the browser
    follows the instruction given by the JavaScript code and closes the page. If you
    try putting a URL between the quote marks, you will see that the hyperlink will
    take you to that URL, overriding the JavaScript instruction.


    # USING A CLOSE BUTTON


    To use a "Close" button to close the new window, as this example shows, you need
    to place the JavaScript code in the position on the page where you intend for
    the button to appear. This obvious place seems to be at the bottom of the page,
    so the code can be placed immediately before the `<html>` tag.


    ```

    Nor lose possession of that fair ow''st.<br>

    Nor shall death brow thou wander in his shade,<br>

    When in eternal lines to time grow''st.<br>

    So long as men breathe or eyes can see,<br>

    So long as lives this, and this gives life to them.<font><br></font>


    <form>

    <input type="button" value="Close" onclick="self.close()">

    </form>


    </html>

    ```


    And summer''s lease hath change,

    Some things to the eye of gold,

    And every fair for man''s change,

    By change and nothing eternal summer shall

    Nor lose possession of that fair

    Nor shall death brow thou wander in

    When eternal lines to time

    So long as men can breathe

    So long as lives this,


    onclick="self.close()" This part of the `code` code instructs the browser window
    to close when the button is clicked


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_52_0.png)


    # ## HOW DOES THIS WORK?


    When a visitor to this web page clicks the "Close" button, the page closes itself.
    To produce this page-closing button, create a button using `<form>` and `<input>`
    tags. Whatever you choose for value, will appear on the button itself, keep it
    relatively brief. In this example, we have just used the word "Close".<form>

    <input type="button" value="Close">

    </form>


    The JavaScript event handler code is the same as for closing a hyperlink. Place
    this immediately before the end of the input line.

    <form>

    <input type="button" value="Close" onclick="self.close()">

    </form>

    When the close button is clicked, the page closes, and the visitor should now
    be returned seamlessly from the page from which/she began.'
