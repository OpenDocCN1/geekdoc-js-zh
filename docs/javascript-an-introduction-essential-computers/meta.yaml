  md: '# Confirm Boxes


    Confirm boxes are essentially Alert boxes that offer a choice of two response
    buttons: OK or Cancel (which is the same as Yes or No). There is very little point
    in using the window.confirm() method unless you can do something useful with the
    response typed by the visitor. To make the most of this OK or Cancel response,
    you need to learn how to use the if...else statement in JavaScript.


    # USING THE IF... STATEMENT


    +   Here is a simple example that shows you can sometimes get the result you want
    merely by using the if clause. Clicking on the subscribe link brings up a Confirm
    box.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_31_0.png)


    +   The code that controls the Confirm box provides a conditional clause. This
    determines the effect of clicking on the OK button.


    ```

    ```html

    <html>

    <head>

    <script language="JavaScript">

    if (confirm("To subscribe to the newsletter

    click OK")) {

    location="subscribe.htm"

    }

    </script>

    </head>

    </html>

    ```

    ```


    +   If the visitor clicks the OK button, he or she will be taken to the URL defined
    in the line beginning location.href.


