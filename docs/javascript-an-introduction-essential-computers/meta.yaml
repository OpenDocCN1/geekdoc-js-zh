    # USING JAVASCRIPT


    The use of JavaScript in web page source code can be extensive, but in this chapter
    we will look at some of the most commonly-adopted ways of using the code.


    # WRITING TO THE DOCUMENT


    Of all the commands available in JavaScript one of the most widely used is document.write.
    This enables you to use JavaScript to write text into the browser window. The
    question that naturally arises, though, is why you would want to use a JavaScript
    command when you can do the same thing with HTML.


    # DYNAMIC AND STATIC WRITING


    The point of the “write” command (or “method,” to use the correct terminology)
    is that it allows you use much wider options than HTML for writing information
    to the browser window. The browser window only displays the text that you have
    written in the source code of the document. Using the document.write method, the
    text displayed can be dependent on information gleaned from the visitor. This
    can include “external” information, such as the visitor’s browser type and version,
    the date and time, and the number of pages previously visited. It can also include
    information provided by the visitor by means of prompt boxes.


    # TAGS OR AN EVENT HANDLER


    If you want to write anything to the browser window that includes any of this
    information, you must use the document.write method; and, since it is a JavaScript
    command, this has to appear either <script> and </script> tags, or within an event
    handler.


    # DOCUMENT.WRITE SYNTAX


    | To use the document.write() method, the information that you want to write to
    the | screen must be placed within quotation marks between after the command,
    leaving no | letter spaces except those within the text string: document.write("Add
    your text here”). |


