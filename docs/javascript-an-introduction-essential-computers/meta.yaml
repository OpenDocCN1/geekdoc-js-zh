  md: '# # JavaScript Basics


    Recognizing where to put blocks of JavaScript code into an HTML document is one
    of the first things you need to know when approaching the language for the first
    time.


    # ## Identifying JavaScript


    Lines of JavaScript code need to be identified separately from HTML code. If you
    look at the source code of any HTML document containing JavaScript, the JavaScript
    code is most easily recognized if it is contained within <script> tags.


    +   * When code is placed between <script> and </script> tags, most browsers assume
    that the encoded code is to be read as JavaScript.

    * Most browsers take JavaScript to be the default, but other scripts (VBScript,
    for example) can be used within these tags. For this it is advisable to specify
    the programming language that is being used, in this case by making the first
    tag <script language="JavaScript">


    ```

    How to use script tags.txt - Notepad

    <script language="JavaScript">

    ...... place your JavaScript code here......

    </script>

    ```


    | EMBED JASCRIPT ANYWHERE | When enclosed within <script> tags, JavaScript can
    be embedded anywhere in an HTML document (as long as it does not conflict with
    HTML rules), and as many times as required. If the script relates to a button
    on the page, can place the code adjacent to that block of HTML on the page. More
    often than not, though, the JavaScript is placed within the <head> section of
    the document. This is particularly true where functions are concerned |'
  merge: -1
  pgno: 13
- img_proc: true
  md: "# USING <head> TAGS\n\nWhen you open a web page, the code between the <head>\
    \ tags is loaded before the web page is displayed-screen.\n\nIn this example,\
    \ an Alert box containing the words Welcome to your website pops up before the\
    \ web page appears on your screen.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_14_0.png)\n\
    \n# USING A FUNCTION\n\nIt is not obligatory for any code within <script> tags\
    \ to appear between the <head> tags of the document, but it is good practice to\
    \ place it when using a function (or functions) that you will \"call\" further\
    \ down the page.\n\n```\n<SCRIPT language=\"JavaScript\">\nfunction myFunction()\
    \ {\n  ... The JavaScript statements that go to\n  ... make up myFunction (or\
    \ the name you\n  ... decide to call that particular function)\n  ... go here,\
    \ between the curly brackets.\n}\n</SCRIPT>\n```\n\n# THE IMPORTANCE OF RECOGNIZING\
    \ JAVASCRIPT\n\nThe ability to recognize JavaScript code will help you identify\
    \ those sections of code in other people's web pages that you can learn from,\
    \ adapt, and use to suit your own website. Also, sometimes you need to\n\nmodify\
    \ the JavaScript that has been generated using third-party software. Even the\
    \ best HTML design packages can sometimes get themselves into a tangle, leaving\
    \ you with no other solution than to open the source code and debug the\n\nscript.\
    \ More often than not, this simply involves locating the problem area and removing\
    \ a duplicate tag. Knowing your way around the code will also have obvious benefits\
    \ when it comes to tracking your own mistakes.\n\n+   Alert Boxes\n\n+   JavaScript\
    \ Functions"
  merge: -1
