    Image tells the browser the dimensions on the size of the image in pixels. It
    is saying “Reserve a space with these dimensions on the page and fill it with
    the new image called Image1. I am just to tell you where you can find location."
    Image1 provides location. If you want to preload more than one image, simply repeat
    the formula, keeping everything


    within the script tags. For example: Image2=new Image(100,50) Image2.src="services2.jpg"
    Image3=new Image(120,50) Image3.src="contact2.jpg" This tells the browser to preload
    two more images with the dimensions in names and gives them both variable names
    (Image2 and Image3). Initially, this profusion of names for what seem to be the
    same images can seem confusing, but, once grasped, it is really very simple.


    # HOW IT WORKS


    In this example, Image1 is the name that identifies the space into which the image
    off.jpg is loaded. This space is filled when the web page is first


