    | Char: 62 |

    | Error: Unterminated string constant |

    | Code: 0 |

    | URL: file://C:\my javascript folder\errors\error1.htm |


    Char: This indicates the position of the first character on the indicated line
    where the error occurs


    Error: This indicates the type of error that has occurred'
