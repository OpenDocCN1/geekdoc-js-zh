  md: '# FIND AND FIX


    The error message in this example gives you enough information to locate the area
    causing all the problems.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_55_0.png)


    # LOCATING THE ERROR


    +   - Open the source code of the relevant HTML document in Notepad.

    - Following the instructions in the error message, count 11 lines from the top
    of the page, including blank lines.

    - Now count 62 characters from the left of line 11.

    - The error line in your JavaScript error box can sometimes be a little cryptic,
    but in this case, character 62 of line leads to the end of a string that fails
    to close a pair of double quotes "that earlier (on that line) after the line break
    <br> at the end of this line.

    - Add the double quotes between the > and ), and you have fixed the problem that
    the error box has announced an "unterminated string constant."


