    # 微软的 FrontPage Express


    FrontPage Express 是微软的一款免费网页编辑器，它让您能够以易于使用的 WYSIWYG（所见即所得）布局来创建和格式化网页。它提供了 FrontPage
    Editor 和 FrontPage Explorer 完整版中的许多功能，包括插入 JavaScript 代码的能力。


    ## 添加您自己的 JAVASCRIPT 代码


    -   若要向您正在使用 FrontPage Express 创建的 HTML 文档中添加您自己的 JavaScript 代码，请先从“插入 (Insert)”菜单中选择“脚本
    (Script)”。将出现“脚本”对话框。


    -   在“脚本”对话框中，点击“语言 (Language)”面板中的 JavaScript 单选按钮。然后在下方的代码框中输入您的代码并点击“确定 (OK)”。无需用
    `<script>` 标签包围代码。


    您已插入到 HTML 中的 JavaScript 代码现在将作为符号显示在页面上。


    若要查看 HTML 源代码，请从“视图 (View)”菜单中选择“HTML”。


    ## 修改您的 JAVASCRIPT


    在使用 Frontpage Express 时，您可以随时修改现有的脚本，只需在 Frontpage Express 窗口中右键点击相应的脚本图标，并从下拉菜单中选择“脚本属性
    (Script Properties)”。这将打开脚本窗口，显示您的 JavaScript 代码（在脚本窗口中）。在完成脚本修改后点击“确定”，然后在主 Frontpage
    Express 窗口的“文件 (File)”菜单中选择“保存 (Save)”以保存 HTML 文档。


    ## 自动化脚本


    -   在本示例中，使用了 FrontPage Express 来显示用户提示（User Prompt），该提示由 `greet=prompt` 这行代码生成。如示例所示，FrontPage
    Express 对您在代码框中输入的代码进行了非常少的修改，但它执行了重要的任务。首先，它添加了注释标签以防止其在不支持 JavaScript 的浏览器中显示；其次，它在您的代码周围放置了必要的
    `<script>` 标签。如果您选择使用 FrontPage Editor 和 Explorer 这样复杂的网页设计包来生成 JavaScript 代码，您可能会在查看源代码时发现，它比您预想的要复杂。


    用户提示是由以 `greet=prompt` 开头的代码行生成的。


    ## MACROMEDIA 的 DREAMWEAVER


    Macromedia 的 Dreamweaver 是（分类为“行为 (Behaviors)”）工具之一，与目前最好的网站设计包一起。它的大多数高级 HTML
    效果以及与 JavaScript 相关的功能都是通过“行为 (Behaviors)”窗口访问。


    ## DREAMWEAVER 的行为菜单


    -   在本示例中，我们将使用“打开浏览器窗口 (Open Browser Window)”对话框为新的弹窗窗口设置功能。

    -   首先点击 `+` 按钮，并从下拉菜单中选择“打开浏览器窗口 (Open Browser Window)”。


    -   从“打开浏览器窗口”对话框中选择您需要的功能并点击“确定 (OK)”。

    -   Dreamweaver 会自动生成 JavaScript 代码并放在页面的 HTML 源代码中。


    ## 设计新窗口


    ## 添加您自己的脚本


    -   若要在使用 Dreamweaver 构建的 HTML 文档中放置您的 JavaScript，请先从“插入 (Insert)”下拉菜单中选择“脚本 (Script)”。


    -   在“插入脚本 (Insert Script)”对话框中，从“语言 (Language)”下拉框中选择“JavaScript”。


    -   在“内容 (Content)”框中输入您的脚本。无需在此框内内键入 `<script>` 标签或注释。点击“确定 (OK)”。


    ## 插入悬停图像 (ROLLVER IMAGE)


    -   若要插入悬停图像，首先从“插入 (Insert)”下拉菜单中选择“悬停图像 (Rollover Image)”。


    将打开“插入悬停图像”对话框。如果您希望预加载悬停图像，请勾选“预加载悬停 (Preload Rollover)”复选框。然后点击第一个“浏览 (Browse)”按钮。


    在“原始图像 (Original Image)”对话框中，导航到您打算用于原始图像的文件。一旦选中，您将返回到“插入悬停”对话框。点击第二个“浏览 (Browse)”按钮，导航到您打算用于悬停图像的图像文件，并点击“选择
    (Select)”。


    一旦在“插入悬停图像”对话框的字段中为原始图像和悬停图像命名，点击“确定”。


    一旦原始图像和悬停图像在字段中命名后，悬停效果将在鼠标悬停在页面上时显示。这种方法可以防止在不支持 JavaScript 的浏览器中显示不连续的图像。


