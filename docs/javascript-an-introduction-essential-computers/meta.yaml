    part closes the bold tag and displays the word.


    ```html

    <script language="JavaScript">

    document.write("I see you''re using the <b>" + navigator.appName + "</b>");

    </script>

    ```


    ```

    Getting to know your browser - Microsoft Explorer

    I see you''re using the Microsoft Explorer browser.

    ```


    # USING JAVASCRIPT


    The use of JavaScript in web page source code can be extensive, but in this chapter
    we will look at some of the most commonly-adopted ways of using the code.


    # WRITING TO THE DOCUMENT


    Of all the commands available in JavaScript one of the most widely used is document.write.
    This enables you to use JavaScript to write text into the browser window. The
    question that naturally arises, though, is why you would want to use a JavaScript
    command when you can do the same thing with HTML.


    # DYNAMIC AND STATIC WRITING


    The point of the “write” command (or “method,” to use the correct terminology)
    is that it allows you use much wider options than HTML for writing information
    to the browser window. The browser window only displays the text that you have
    written in the source code of the document. Using the document.write method, the
    text displayed can be dependent on information gleaned from the visitor. This
    can include “external” information, such as the visitor’s browser type and version,
    the date and time, and the number of pages previously visited. It can also include
    information provided by the visitor by means of prompt boxes.


    # TAGS OR AN EVENT HANDLER


    If you want to write anything to the browser window that includes any of this
    information, you must use the document.write method; and, since it is a JavaScript
    command, this has to appear either <script> and </script> tags, or within an event
    handler.


    # USING COMMENTS IN JAVCRIPT


    We saw in the last chapter how to use comments in HTML to hide JavaScript from
    older browsers. "Comments" also have a second use and a second meaning when compiling,
    because they can also be used within the JavaScript in order to write notes to
    yourself that will not be seen on the web page. Such comments are preceded or
    contained within comment tags, and the tags used will depend on whether you want
    to "comment out" a single line or several lines.


    # JAVCRIPT COMMENTS


    -- JavaScript comments enable you to intersperse your lines of code with lines
    of "invisible" notes. Some of your comments will be temporary editing-in-progress
    notes, but you may choose to leave others in the code to remind you what you were
    thinking at the time of writing when you need to remove or improve the code.

    - If correctly formatted, your comments will not be displayed by the web browser,
    so anything can be typed following a comment tag.


    # COVER YOUR TRACKS


    Comments are not invisible to anyone who can read your source code, and any reader
    can do this simply by choosing from Internet Explorer''s View menu or opening
    the HTML document in a text reader. Therefore, you may wish to remove some of
    your comments before making your web pages available on the web.

    '
