    # 使用 JavaScript


    在网页源代码中使用 JavaScript 的用法可以是广泛的，但在本章中，我们将查看一些最常用的代码使用方式。


    # 写入文档


    在 JavaScript 可用的所有命令中，最广泛之一是 `document.write`。它允许你使用 JavaScript 将文本写入浏览器窗口。然而，随而产生的问题是，既然你可以用
    HTML 实现相同的事情，为什么还想使用 JavaScript 命令呢？


    # 动态与静态写入


    “write”命令（或使用正确术语称为“方法”）的意义在于，它允许你使用比 HTML 广得多的选项向浏览器窗口写入信息。浏览器窗口只显示你在文档源代码中编写的文本。使用
    `document.write` 方法，显示的文本可以取决于从访问者那里获得的信息。这可以包括“外部”信息，例如访问者的浏览器类型和版本、日期和时间以及之前访问过的页面数量。它还可以包括访问者通过提示框（prompt
    boxes）提供的信息。


