    # GETTING HELP


    If your JavaScript code goes wrong, your browser will sometimes (but not always)
    provide you with help in the form of a JavaScript error message box.


    # DEBUGGING THE JAVASCRIPT


    If any of your JavaScript code contains errors, you will need to correct them
    before making the web page that contains them available to the public. This process
    is known as debugging. If you are lucky,


    will involve only one or two typographical corrections. Sometimes – if, for example,
    there are major syntactical errors in the JavaScript – it might necessitate rebuilding
    your code line by line.


    GETTING ADVICE FROM THE BROWSER

    If you have been working through the examples in


    the last chapter, typing the code into Notepad and testing it in your web browser
    as you go, you will


    almost certainly have seen one of these error message boxes, unless your typing
    skills are flawless!


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_53_0.png)


    If there is a further error, the browser will inform you when you click OK. Correcting
    the first error may stop all subsequent errors from occurring.'
