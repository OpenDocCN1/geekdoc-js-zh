    ![](img/aafe1085e7f90302649c9c77d13f0ae9_68_3.png)'
  - '[PAGE 69]


    # SCRIPTS FROM THE WEB


    The web can offer huge amounts of JavaScript code for all levels of author. You
    will also find some excellent tutorials and repositories of ready-made scripts.


    # READY-MADE SCRIPTS


    One of the quickest ways to see the range of JavaScript''s capabilities is to
    visit one of the many "script repositories" on the web, which have scripts available
    for you to cut and paste into your own documents. Usually, you are asked to credit
    the author in your HTML code or to place a shortcut to the site on your web page.
    Many of these sites give clear instructions about how to copy and paste the script
    into your HTML document, and you can learn a lot from the code.


    # WEBMONKEY JAVASCRIPT LIBRARY


    +   * HotWired WebMonkey is an essential site for any web page author. The JavaScript
    code library covers a wide range of subjects and offers a large number of free
    code samples to use in your source code. There is also a wealth of information
    from JavaScript authors that will stimulate your ideas and help you write better
    code. Or you can just copy and paste the scripts, marvel at the authors'' ingenuity,
    and leave the learning for another day...


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_69_0.png)


    # Reference JavaScript Code Library


    The Webmonkey code is our collection of code, function packages, and Web editor
    extensions—a generalized code, specific artworks, and good ideas that will enhance
    your pages in ways you may not know (or how may to program)


    Code samples are provided free for use on your web page. modification and redistribution
    of the code may depend on the code that you copy or paste or download from our
    site is respect


    # Editor Extensions


    +   * Find the capabilities of your HTML editor discover how'
  - '[PAGE 70]


    # THE JAVASCRIPTnSOURCE


    The JavaScript Source contains hundreds of free JavaScript that you can copy and
    paste into your source code. Organized by category, each script is illustrated
    with a fully working example. You can also choose an option that enables you to
    have any JavaScript sent directly to your email address.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_70_0.png)


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_70_1.png)


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_70_2.png)


    # WEBSITEnABSTRACTION


    This site offers an excellent library of free JavaScript code as well as a broad
    range of JavaScript-related resources, tutorials aimed at beginners to advanced-level
    users. The free JavaScript are arranged in more than 20 top-level categories.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_70_3.png)


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_70_4.png)


