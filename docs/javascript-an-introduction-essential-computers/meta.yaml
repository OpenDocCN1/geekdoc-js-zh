  md: '# HIDING JAVCRIPT


    In the context of JavaScript, there are two kinds of comments that can be included
    in the HTML document. The first of these, discussed in a later chapter, consists
    of comments keved into the JavaScript itself that allows you to write


    helpful notes to yourself. The second kind consists of comments keved into the
    HTML, and serve a more important purpose when writing JavaScript. HTML comments
    can hide your code from old browsers that cannot handle JavaScript.


    # USING AN HTML COMMENT


    +   Older browsers cannot display JavaScript may display your code as text on
    the page. To prevent this happening, comments in the HTML can


    be used to hide JavaScript. The example shows this in action. The opening of a
    comment in HTML is: <!--. The closing of a comment in HTML is: -->. A browser
    that can hide JavaScript will carry


    out of the JavaScript commands -- in this example, writing to the browser window.
    A browser that cannot handle JavaScript will simply ignore everything between
    the HTML comment tags.


    ```

    html comments Notepad

    File Edit Search Help

    <html>

    <head>

    <!-- HTML comments title -->

    </head>

    <script language="JavaScript">

    <!-- Hide JavaScript from older browsers

    document.write("All this text will appear in<br>");

    document.write("browsers that handle JavaScript <br>");

    document.write("Older browsers will display <br>");

    document.write("only the message in red <br>");

    document.write("at the bottom of the page.<br>");


    <!-- stop hiding JavaScript --

    </script>

    <hr>

    <!-- faint text: only this message is displayed

    you need to visit the <a href="textonly htm">text-only

    version <a> of this page.</font><h6>

    </html>

    ```'
