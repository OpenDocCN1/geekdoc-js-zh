- md: "\n## WRITING THE JAVASCRIPT\n\n- Now it is time to write the code for the rollover.\n\
    - The code loads the image file `on.jpg` when the mouse cursor moves over the\
    \ existing image (`off.jpg`), replacing the initial button image and creating\
    \ the illusion that the button has been pushed in.\n\n```html\n<html>\n<title>Example\
    \ of a simple rollover</title>\n<body>\n<h4>The example below shows a very simple\
    \ rollover.</h4>\n<a href=\"#\" onmouseover=\"document.image.src='on.jpg';return\
    \ true\">\n<img src=\"off.jpg\" border=no name=\"image\"></a>\n</body>\n</html>\n\
    ```\n\n- Until an `onmouseover` command has been added, the button will stay pushed\
    \ in even when the mouse cursor is moved away. The image space will continue to\
    \ be occupied by `on.jpg`.\n\nThe example below shows:\n\nThe example below shows:\n\
    \n![](img/aafe1085e7f90302649c9c77d13f0ae9_40_0.png)\n![](img/aafe1085e7f90302649c9c77d13f0ae9_40_1.png)\n\
    \n## 4 ADDING ONMOUSE\n\n- To complete the rollover and return `off.jpg` to the\
    \ image space, you need to add the `onmouseout` command. Its position immediately\
    \ follows the `onmouseover` statement, but it remains within the `<a href>` and\
    \ `</a>` HTML tags.\n\n```html\n<html>\n<title>Example of a simple rollover</title>\n\
    <body>\n<h4>The example below shows a very simple rollover.</h4>\n<a href=\"#\"\
    \ onmouseover=\"document.image.src='on.jpg';return true\"\nonmouseout=\"document.image.src='off.jpg';\
    \ return true\">\n<img src=\"off.jpg\" border=no name=\"image\"></a>\n</body>\n\
    </html>\n```\n\n## MAKING THE IMAGE A LIVE HYPERLINK\n\nTo keep things simple,\
    \ in this example we have a dead link (`#`) for the image. If anyone clicks on\
    \ the image, nothing will happen. Placing a live link here is simply a matter\
    \ of replacing `#` with the appropriate URL.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_41_0.png)\n\
    ![](img/aafe1085e7f90302649c9c77d13f0ae9_41_1.png)\n\n## The name tag\n\nIt helps\
    \ to think of the area on the page identified by the name tag as the space that\
    \ the image occupies. The files `on.jpg` and `off.jpg` will occupy the space called\
    \ `image`, depending on the cursor’s action.\n\n## PRELOADING IMAGES\n\nYou can\
    \ use JavaScript to preload images. This means that while your web page is first\
    \ loading in the visitor’s browser window, you can send the specified images to\
    \ the browser cache, a folder on your computer that stores recently accessed web\
    \ pages. If a web page is cached here, the browser can access it more quickly\
    \ than a remote server. Certain images required for rollovers are not visible\
    \ until the page has loaded. These are the images that can be usefully preloaded\
    \ into the cache, so they really spring into life when needed rather than being\
    \ subject to the slight delay that usually happens while they are being downloaded\
    \ from the web.\n\n## PRELOADING ON.JPG\n\nThe code to make `on.jpg` appear, when\
    \ we pull over `off.jpg`, goes into the body of the web page, but the code for\
    \ preloading `on.jpg` goes into the `<head>` tags within.\n\n```html\n<head>\n\
    <script language=\"JavaScript\">\n  Image=new Image(20,20)\n  Image.src=\"on.jpg\"\
    \n</script>\n</head>\n```\n\n## PRELOADING MULTIPLE IMAGES\n\n`Image1` is a variable\
    \ and you can choose any name you like for this, but it is always advisable to\
    \ keep things simple. The information in brackets after `new Image` tells the\
    \ browser the dimensions of the image in pixels. It is saying “Reserve a space\
    \ with these dimensions on the page and fill it with the new image called Image1.\
    \ I am just to tell you where you can find the location.” `Image1` provides the\
    \ location. If you want to preload more than one image, simply repeat the formula,\
    \ keeping everything within the script tags. For example: `Image2=new Image(100,50);\
    \ Image2.src=\"services2.jpg\"; Image3=new Image(120,50); Image3.src=\"contact2.jpg\"\
    ;` This tells the browser to preload two more images with the dimensions in names\
    \ and gives them both variable names (`Image2` and `Image3`). Initially, this\
    \ profusion of names for what seem to be the same images can seem confusing, but,\
    \ once grasped, it is really very simple.\n\n## HOW IT WORKS\n\nIn this example,\
    \ `Image1` is the name that identifies the space into which the image `off.jpg`\
    \ is loaded. This space is filled when the web page is first displayed. If the\
    \ visitor doesn't move the cursor over that space (i.e. that image), then nothing\
    \ will happen. If the mouse cursor is moved over the space named `Image1`, however,\
    \ the browser checks the folder to see if any images have been preloaded for use\
    \ in space; it will find `on.jpg`, which is the image that the browser is calling\
    \ for.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_42_0.png)\n\n- 1. Identifies\
    \ the space\n- 2. The image that will\n- 3. The image when the cursor moves\n\
    - 4. The space called \"Image1\"\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_42_1.png)\n\
    ![](img/aafe1085e7f90302649c9c77d13f0ae9_42_2.png)\n![](img/aafe1085e7f90302649c9c77d13f0ae9_42_3.png)\n\
    \n## NEW WINDOWS\n\n### NEW WINDOWS\n\nHave you ever wondered how websites use\
    \ pop-up windows?\n\n### THE WINDOW METHOD\n\nThe `open()` method creates a new\
    \ window. The features of the window can be included or excluded using JavaScript.\n\
    \n### OPEN() SYNTAX\n\nThe `open()` method allows you to specify the URL, the\
    \ name of the window, and the features of the new window.\n\n- 1. The content\
    \ you want to load into the new window\n- 2. The event that will trigger the appearance\n\
    - 3. The features of the new window.\n\n## OPENING A NEW WINDOW\n\nOpening a new\
    \ window using JavaScript is simple. Just drop this code into your HTML document:\n\
    \n```javascript\nwindow.open(\"url\", \"name\", \"features\");\n```\n\n## DEIGNING\
    \ THE NEW WINDOW\n\nThe appearance of web browsers can vary considerably, according\
    \ to user preference. You need to cater to all browser setups when deciding which\
    \ features to include or omit from any new windows you intend to create. Just\
    \ because you can't see a particular browser feature on-screen, it doesn't mean\
    \ visitors to your website will have their browsers configured in the same way.\
    \ So even if you have the toolbar switched off in your browser, remember to use\
    \ `toolbar=no` code if you want to ensure that it is absent from the new window\
    \ when viewed in all browsers.\n\n## OPTIONAL CHOICES\n\nThis typical web page\
    \ shows the features of the browser window that can be included or excluded when\
    \ you use JavaScript to open a new window.\n\n## DEACTIVATING FEATURES\n\nAll\
    \ these features are active by default when a new window is loaded. To deactivate\
    \ any of them, use this code: `menubar=no toolbar=no scrollbars=no status=no resizeable=no`.\n"
