    # RECEIVING AN ERROR MESSAGE


    Error message boxes can be very helpful, vague, or just confusing, depending on
    the kind of error detected and the type and version of the web browser that is
    being used to read the web page. The page may load, but the JavaScript fails to
    work. The only evidence that something is wrong may simply be a message in the
    status bar.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_54_0.png)


    Done, but with errors on page.


    Error messages can be vague


    # UNDERSTANDING THE DETAIL


    When a JavaScript error message appears in Internet Explorer, it usually contains
    the line and character position where the scripting problem has occurred. If you
    have been learning


    how to write your scripts using Notepad, or a similarly simple text editor, you
    will have little difficulty in finding things where have gone wrong. If you have
    copied-and-pasted a script from elsewhere (another web page or a script repository
    on the web, for example) or you have inserted a script created by a web design
    package (such as FrontPage or Dreamweaver), and need to rely on the information
    provided in the error message box, which will find that debugging can take considerably
    longer.


