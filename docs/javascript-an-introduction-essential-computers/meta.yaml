    \ `myVariable`。\n\n## ALERT 框\n\n`alert` 方法用于吸引访问者的注意。例如，一行 JavaScript 代码就可以创建一个简单的欢迎公告。Alert\
    \ 框还可以用来公布更复杂的 JavaScript 检测脚本的结果，例如访问者是否拥有查看你网站所需的所有插件。你可以选择创建任何你喜欢的复杂公告，但如此示例所示，启动\
