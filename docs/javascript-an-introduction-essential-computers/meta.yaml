  md: '# NON-JAVASCRIPT-ENABLED BROWERS


    Here the web page is being seen on a JavaScript-enabled browser. A link is provided
    to a text-only version of the page for browsers that cannot handle JavaScript.
    This requires more work, but will make your web page more widely available [].


