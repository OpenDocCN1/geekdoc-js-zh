    # CATERING FOR THE MINORITY


    Catering for those visitors to your site who use non-JavaScript browsers is a
    site-design issue that can be tackled in a number of ways. Writing a page that
    contains JavaScript, but that also provides sufficient information for anyone
    who cannot access the JavaScript material, requires careful planning. The solution
    depends on the nature of the web pages you are building, the information they
    contain, and how conscientious you are. Some authors design a separate page for
    users of older browsers. Others provide a link to a text-only version of the page.
    Some authors simply include a message that states: "Your web browser cannot cope
    with this page; perhaps it''s time to upgrade your browser," and they leave it
    at that.


