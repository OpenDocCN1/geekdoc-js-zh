  md: '# DESIGNING THE NEW WINDOW


    The appearance of web browsers can vary considerably, according to user preference.
    You need to cater to all browser setups when deciding which features to include
    or omit from any new windows you intend to create. Just because you can''t see
    a particular browser feature on-screen, it


    doesn''t mean visitors to your website will have their browsers configured in
    the same way. So even if you have the toolbar switched off in your browser, remember
    to use "toolbar=no" code if you want to ensure that it is absent from the new
    window when viewed in all browsers.


    # OPTIONAL CHOICES


    This typical web page shows the features of the browser window that can be included
    or excluded when you use JavaScript to open a new window.


    # DEACTIVATING FEATURES


    All these features are active by default when a new window is loaded. To deactivate
    any of them, use this code: menubar=no toolbar=no scrollbars=no status=no resizeable=no


    # COMBINED NOTATIONS


    Features can be set by using 1 (for "yes") and 0 (for "no"). Either notation works
    and they can also be combined.


    +   KEY TO WINDOW FEATURES

    1 Menu bar

    2 Toolbar (back, forward buttons, etc.)

    3 Address bar (URL location field)

    4 Scrollbar

    5 Status bar

    6 Resize corner


