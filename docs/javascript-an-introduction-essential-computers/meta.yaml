    # ADVANCED EFFECTS


    JavaScript can also be used to carry out equations or create interactive games.
    There are many sites, such as javascript.internet.com, that offer complex scripts
    that can be pasted into your HTML documents.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_9_1.png)


    # OVERDOING IT


    The interactivity that JavaScript offers can prove too tempting for many beginners,
    so use it sensitively to visit the visitor, rather than just to show off. For
    example, if you use JavaScript to detect the visitor''s browser type and version,
    it is irritating for the visitor to be told that you know.


    would be far better to divert the visitor to a part of the site specifically designed
    for users of that browser. To do this, you will need some knowledge of functions
    and "if...else" statements. These may sound complex, but they are surprisingly
    easy to learn.


    # SHOWING OFF


    +   Using JavaScript to activate an Alert box like this one is more likely to
    be annoying than helpful.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_9_2.png)


    +   JavaScript Functions


    +   Alert Boxes'
- md: "\n# JavaScript in Action\n\nYou can embed JavaScript in the HTML code of any\
    \ web page in your website. Before looking at an example of the code, let's look\
    \ at a typical sequence of web pages that demonstrates the kind of interactivity\
    \ that JavaScript can produce.\n\n## BRINGING UP AN ALERT BOX\n\n- The appearance\
    \ and content of this Alert box on the opening screen are controlled by JavaScript.\n\
    \n![](img/aafe1085e7f90302649c9c77d13f0ae9_10_0.png)\n\n## IDENTIFYING THE WEB\
    \ BROWSER\n\n- The ability to identify the particular web browser that the visitor\
    \ is using, and to insert the browser name into the onscreen text, is a feature\
    \ of JavaScript.\n\n## Learning about your browser\n\nI see you're using the Microsoft\
    \ Internet Explorer browser. This page will help you find out more about your\
    \ browser. Use the buttons at the bottom of the page to visit the main browser\
    \ producers' sites, or to read a history of Web browsers.\n\n> To do your own\
    \ research, follow these hyperlinks to our lists of leading Web directories and\
    \ recommended search engines.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_10_1.png)\n\
    \n## VIEWING TEXT IN THE STATUS BAR\n\n- In this case, the text appears in the\
    \ status bar at the bottom of the screen, in response to the pointer passing over\
    \ the link on the page, is defined in the JavaScript code.\n\nAt the bottom of\
    \ the page to visit the main browser producers' sites, or to read a history of\
    \ Web browsers.\n\n> To do your own research, follow these hyperlinks to our lists\
    \ of leading Web directories and search engines.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_10_2.png)\n\
    \nTry searching with one of these top search engines.\n\n## THE JAVASCRIPT BEHIND\
    \ THE EVENTS\n\nTaking the sequence that we have just seen and looking at the\
    \ HTML source code, we can see how the effects have been achieved using just a\
    \ few lines of JavaScript embedded in the HTML. The annotations highlight a few\
    \ points about the appearance and uses of JavaScript, which are developed in this\
    \ book.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_11_0.png)\n\nThis causes the\
    \ above Alert box to pop up when the page is opened.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_11_1.png)\n\
    \nThe `document.write` command writes everything in quotes, plus everything within\
    \ the + signs, to the web page.\n\nThis code `(navigator.appName)` detects the\
    \ visitor's browser type and writes the browser type dynamically to the web page.\n\
    \n## MAKING THINGS HAPPEN\n\nThe active elements within the windows we have just\
    \ seen (the appearance of an Alert box, the identification of the user's browser,\
    \ and the text seen in the status bar when the cursor moves over the hyperlinks)\
    \ are controlled by JavaScript embedded within this HTML document.\n\n## JAVASCRIPT\
    \ SYNTAX\n\n### QUOTATION MARKS IN TEXT\nUse quotation marks within text \"strings\"\
    \ carefully, because they can seriously confuse the browser about where the code\
    \ ends and the text begins. The rule is, you should use single quotation marks\
    \ within double quotation marks. For example: `document.write (\"Be very 'careful'\
    \ about using quote marks.\")`\n\n### SEMICOLONS\nIt is an optional, useful practice\
    \ to end each line of code with a semicolon. This punctuation mark tells the browser\
    \ unequivocally a new line of code begins. The newer versions of the most popular\
    \ web browsers may be able to work out for themselves where a new line of code\
    \ begins, but now and a missing semicolon can cause a mess.\n\n## JavaScript Basics\n\
    \nRecognizing where to put blocks of JavaScript code into an HTML document is\
    \ one of the first things you need to know when approaching the language for the\
    \ first time.\n\n### Identifying JavaScript\n\nLines of JavaScript code need to\
    \ be identified separately from HTML code. If you look at the source code of any\
    \ HTML document containing JavaScript, the JavaScript code is most easily recognized\
    \ if it is contained within `<script>` tags.\n\n- When code is placed between\
    \ `<script>` and `</script>` tags, most browsers assume that the encoded code\
    \ is to be read as JavaScript.\n- Most browsers take JavaScript to be the default,\
    \ but other scripts (VBScript, for example) can be used within these tags. For\
    \ this it is advisable to specify the programming language that is being used,\
    \ in this case by making the first tag `<script language=\"JavaScript\">`.\n\n\
    ```javascript\nHow to use script tags.txt - Notepad\n<script language=\"JavaScript\"\
    >\n...... place your JavaScript code here......\n</script>\n```\n\n### EMBED JAVCRIPT\
    \ ANYWHERE\nWhen enclosed within `<script>` tags, JavaScript can be embedded anywhere\
    \ in an HTML document (as long as it does not conflict with HTML rules), and as\
    \ many times as required. If the script relates to a button on the page, you can\
    \ place the code adjacent to that block of HTML on the page. More often than not,\
    \ though, the JavaScript is placed within the `<head>` section of the document.\n\
    \n## USING <head> TAGS\nWhen you open a web page, the code within the `<head>`\
    \ tags is loaded before the web page is displayed. In this example, an Alert box\
    \ pops up on your screen.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_14_0.png)\n\
    \n## USING A FUNCTION\nIt is not obligatory for any code within `<script>` tags\
    \ to appear further down the page, but it is good practice to use a function.\n\
    \n```javascript\n<script language=\"JavaScript\">\nfunction myFunction() {\n \
    \ // The JavaScript statements that go here, make up what you decide\n}\n</script>\n\
    ```\n\n## THE IMPORTANCE OF RECOGNIZING JAVCRIPT\nThe ability to recognize JavaScript\
    \ code will help you identify those sections in other people's pages that you\
    \ can learn from, adapt, and use to suit your own. Also, sometimes you need to\
    \ modify the JavaScript that has been generated using third-party software. Even\
    \ the best HTML design packages can sometimes get into a tangle, leaving you with\
    \ no other solution than to open the source code and debug.\n\n## Event Handlers\n\
    Some JavaScript code does not need to be placed within `<script>` tags. Usually,\
    \ these instances are known as event handlers. Examples include the commands that\
    \ make events when the visitor clicks the mouse or moves the cursor over text\
    \ or image. Whatever appears in quotes after one of these commands is interpreted\
    \ by the browser as JavaScript and is handled accordingly.\n\n### AN EVENT HANDLER\
    \ IN ACTION\n- Event handlers are words that begin with \"on\", followed by a\
    \ verb beginning with a capital letter. For example: onClick, onChange, onload,\
    \ onSubmit, or onMouseOver.\n- In this example, onUnload is being used to call\
    \ up an alert.\n\n```html\n<html>\n<title>Simple example of onUnload at work</title>\n\
    <body onUnload=\"alert('Thanks for visiting. Call again soon.')\"><p>When you\
    \ leave this Web page, or quit the Web browser, an alert box will appear containing\
    \ the words you have specified for the alert box.</p>\n<p>Note that you do not\
    \ need to use \"javascript\" tags in this example.</p>\n</body>\n</html>\n```\n\
    \n![](img/aafe1085e7f90302649c9c77d13f0ae9_15_0.png)\n"
  mdcn: "\n\n# JavaScript 实战\n\n你可以将 JavaScript 嵌入到网站中任何页面的 HTML 代码中。在查看代码示例之前，让我们先来看一个典型的网页序列，它展示了\
    \ JavaScript 能够产生的交互效果。\n\n## 弹出一个警告框\n\n- 启动屏幕上显示的此警告框的外观内容是由 JavaScript 控制的。\n\
    \n![](img/aafe1085e7f90302649c9c77d13f0ae9_10_0.png)\n\n## 识别网页浏览器\n\n- 识别访问者使用的特定网页浏览器并将浏览器名称插入屏幕文本，是\
    \ JavaScript 的一项功能。\n\n## 了解你的浏览器\n\n看到你正在使用 Microsoft Internet Explorer 浏览器。此页面将帮助你了解更多关于浏览器的信息。使用页面底部的按钮访问主要浏览器厂商网站，或阅读浏览器历史。\n\
    \n> 如需进行自己的研究，请点击这些链接访问我们的领先 Web 目录列表和推荐的搜索引擎列表。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_10_1.png)\n\
    \n## 在状态栏显示文本\n\n- 在这种情况下，文本出现在屏幕底部的状态栏，作为指针悬经过页面上链接的响应，这是在 JavaScript 代码中定义的。\n\
    \n在页面底部访问主要浏览器厂商网站，或阅读浏览器历史。\n\n> 如需进行自己的研究，请点击这些链接访问我们的领先 Web 目录和搜索引擎列表。\n\n\
    ![](img/aafe1085e7f90302649c9c77d13f0ae9_10_2.png)\n\n尝试使用这些顶级搜索引擎之一进行搜索。\n\n\
    ## 事件背后的 JavaScript\n\n通过我们刚刚看到的序列并查看 HTML 源代码，我们可以看到如何通过嵌入 HTML 中的短短几行 JavaScript\
    \ 实现这些效果的。注释强调了关于 JavaScript 外观和用途的几点，这些将在本书书中详细介绍。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_11_0.png)\n\
    \n这导致在页面打开时弹出上述警告框。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_11_1.png)\n\n\
    `document.write` 命令将引号内的所有内容以及 `+` 号之间的所有内容写入网页。\n\n此代码 `(navigator.appName)`\
    \ 检测访问者的浏览器类型，并将浏览器类型动态地写入网页。\n\n## 让事情发生\n\n我们刚刚看到的窗口中的活动元素（警告框的出现、对用户浏览器的识别以及光标移动到链接上时在状态栏看到的文本）都由嵌入此\
    \ HTML 文档的 JavaScript 控制。\n\n## JavaScript 语法\n\n### 文本中的引号\n在文本“字符串”中使用引号时要小心，因为它们可能会严重误导浏览器代码从何处结束以及文本从哪里开始。规则是，你应该在双引号内使用单引号。例如：`document.write\
    \ (\"Be very 'careful' about using quote marks.\")`\n\n### 分号\n在每行代码末尾加上分号是一个可选的但有用的习惯。这个标点符号明确地告诉浏览器新行代码开始了。虽然最流行的网页浏览器的新版本可能能够自行判断新行代码开始的位置，但现在缺少分号可能会导致混乱。\n\
    \n## JavaScript 基础\n\n在初次接触这种语言时，识别如何将 JavaScript 代码块放入 HTML 文档中是你需要掌握的基础知识之一。\n\
    \n### 识别 JavaScript\n\nJavaScript 代码行需要与 HTML 代码分开识别。如果你查看包含 JavaScript 的任何 HTML\
    \ 文档源代码，如果 JavaScript 代码包含在 `<script>` 标签内，最容易被识别。\n\n- 当代码放在 `<script>` 和 `</script>`\
    \ 标签之间时，大多数浏览器都会假设编码的代码被作为 JavaScript 读取。\n- 大多数浏览器将 JavaScript 作为默认值，但在这些标签内也可以其他脚本（例如\
    \ VBScript）。为了这一点，建议指定正在使用的编程语言，在这种情况下，通过将第一个标签设置为 `<script language=\"JavaScript\"\
    >`。\n\n```javascript\nHow to use script tags.txt - Notepad\n<script language=\"\
    JavaScript\">\n...... place your JavaScript code here......\n</script>\n```\n\n\
    ### 在任何地方嵌入 JavaScript\n当包含在 `<script>` 标签内时，JavaScript 可以嵌入 HTML 文档的任何位置（只要不与\
    \ HTML 规则冲突），并根据需要多次使用。如果脚本与页面上的按钮有关，可以将代码放置在页面上该 HTML 块旁边。但大多数情况下，JavaScript\
    \ 被放置在文档的 `<head>` 部分。\n\n## 使用 <head> 标签\n当你打开网页时，`<head>` 标签内的代码会在网页显示之前加载。在例例中，一个警告框会在你的屏幕上弹出。\n\
    \n![](img/aafe1085e7f90302649c9c77d13f0ae9_14_0.png)\n\n## 使用函数\n`<script>` 标签内的任何代码并不强制要求出现在页面下方，但使用函数是一个良好的习惯。\n\
    \n```javascript\n<script language=\"JavaScript\">\nfunction myFunction() {\n \
    \ // 这里的 JavaScript 语句取决于你的决定\n}\n</script>\n```\n\n## 识别 JavaScript 的重要性\n识别\
    \ JavaScript 代码的能力将帮助你识别他人页面中你可以学习、调整并适用于你自己的部分。此外，有时你需要修改第三方软件生成的 JavaScript。即使是最好的\
    \ HTML 设计包有时也会陷入混乱，让你除了打开源代码进行调试外别无选择。\n\n## 事件处理器\n某些 JavaScript 代码不需要放在 `<script>`\
    \ 标签内。通常，这些实例被称为事件处理器。示例包括访问者点击鼠标或光标移动到文本或图像上时触发事件的命令。出现在这些命令后的引号内的任何内容都会浏览器解释为\
    \ JavaScript 并进行相应的处理。\n\n### 事件处理器实例\n- 事件处理器是以 \"on\" 开头的单词，后跟着一个大写字母开头的动词。例如：onClick,\
    \ onChange, onload, onSubmit 或 onMouseOver。\n- 在此例中，onUnload 被用来调用警告。\n\n```html\n\
    <html>\n<title>onUnload 工作的简单示例</title>\n<body onUnload=\"alert('Thanks for visiting.\
    \ Call again soon.')\"><p>当你离开此网页或退出网页浏览器时，将出一个警告框，其中包含你为警告框指定的文字。</p>\n<p>注意在此例中你不需要使用\
    \ \"javascript\" 标签。</p>\n</</body>\n</html>\n```\n\n"
