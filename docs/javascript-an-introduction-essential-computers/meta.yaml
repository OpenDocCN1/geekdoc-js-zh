  md: '# GETTING HELP


    If your JavaScript code goes wrong, your browser will sometimes (but not always)
    provide you with help in the form of a JavaScript error message box.


    # DEBUGGING THE JAVASCRIPT


    If any of your JavaScript code contains errors, you will need to correct them
    before making the web page that contains them available to the public. This process
    is known as debugging. If you are lucky,


    will involve only one or two typographical corrections. Sometimes – if, for example,
    there are major syntactical errors in the JavaScript – it might necessitate rebuilding
    your code line by line.


    GETTING ADVICE FROM THE BROWSER

    If you have been working through the examples in


    the last chapter, typing the code into Notepad and testing it in your web browser
    as you go, you will


    almost certainly have seen one of these error message boxes, unless your typing
    skills are flawless!


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_53_0.png)


    If there is a further error, the browser will inform you when you click OK. Correcting
    the first error may stop all subsequent errors from occurring.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# RECEIVING AN ERROR MESSAGE


    Error message boxes can be very helpful, vague, or just confusing, depending on
    the kind of error detected and the type and version of the web browser that is
    being used to read the web page. The page may load, but the JavaScript fails to
    work. The only evidence that something is wrong may simply be a message in the
    status bar.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_54_0.png)


    Done, but with errors on page.


    Error messages can be vague


    # UNDERSTANDING THE DETAIL


    When a JavaScript error message appears in Internet Explorer, it usually contains
    the line and character position where the scripting problem has occurred. If you
    have been learning


    how to write your scripts using Notepad, or a similarly simple text editor, you
    will have little difficulty in finding things where have gone wrong. If you have
    copied-and-pasted a script from elsewhere (another web page or a script repository
    on the web, for example) or you have inserted a script created by a web design
    package (such as FrontPage or Dreamweaver), and need to rely on the information
    provided in the error message box, which will find that debugging can take considerably
    longer.


    Line: where the error has occurred


    | Line: 11 |

    | Char: 62 |

    | Error: Unterminated string constant |

    | Code: 0 |

    | URL: file://C:\my javascript folder\errors\error1.htm |


    Char: This indicates the position of the first character on the indicated line
    where the error occurs


    Error: This indicates the type of error that has occurred'
