- md: "\n## REPEAT THE PROCEDURE\n\nNow save the page and open the HTML document in\
    \ your Web browser. If the HTML document opens as you expect, all the JavaScript\
    \ code functioning correctly, you have solved the problem. If the browser encounters\
    \ another problem, you will need to address the new problem using the technique\
    \ just described. Repeat the procedure as many times as necessary!\n\n## FINDING\
    \ THE LINES\n\nIf there is a marked discrepancy between your calculation of a\
    \ line number and the number that appears in the browser's error message box,\
    \ try turning off the Word Wrap feature in Notepad. You'll find it in the Edit\
    \ menu. Some script editors and website design programs provide line numbers for\
    \ you. When you view the source code, may prove more helpful than Notepad when\
    \ correcting errors in your scripts. In Macromedia's Dreamweaver, for example,\
    \ you have the option of displaying line numbering alongside the HTML code. Simply\
    \ click on the check box to Line Numbers at the top of the page.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_56_0.png)\n\
    \nWhen you choose to view the source code in Macromedia's Dreamweaver, you can\
    \ opt to view line numbers by checking the Line Numbers at the top of the viewing\
    \ area.\n\n## ERROR WARNINGS IN INTERNET EXPLORER\n\nIf you are not seeing the\
    \ kind of JavaScript error warning box described on these pages, perhaps this\
    \ feature is inactive in your copy of Internet Explorer. If that is the case,\
    \ turn it on right away. It may not be everything you need, but it can prove invaluable\
    \ in sending you to the area of your script that is going wrong.\n\n## ACTIVATING\
    \ ERROR NOTIFICATION\n\n- Choose Internet Options from the Tools menu of Internet\
    \ Explorer.\n- Click the Advanced tab.\n- Place a check mark in the box next to\
    \ Display a notification about every script error.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_57_0.png)\n\
    \n## COMMON ERRORS in JavaScript Code\n\nThe two types of error in JavaScript—quotation\
    \ marks or parentheses—are known as syntax errors and runtime errors. This usually\
    \ means that you have either mistyped or omitted something. Syntax errors often\
    \ involve misspelled commands. Both kinds of errors will cause your web pages\
    \ to behave erratically, or they will stop loading in the browser.\n\n## A WORKING\
    \ EXAMPLE\n\n- Here we see source code for a web page that uses a simple level\
    \ of interactivity. The JavaScript code consists of just a few lines: a function\
    \ within the document's <head> tags and an onclick event handler within the document's\
    \ <body> tags.\n\n```html\n<html>\n<head>\n<script language=\"JavaScript\">\n\
    function whatYear() {\n  var n=prompt(\"What year is it?\");\n  confirm(\"Is it\
    \ really now \" + n + \" and we still haven't returned to the moon?\");\n}\n</script>\n\
    </head>\n<body>\n<form>\n<input type=\"button\" value=\"Answer me this...\" onclick=\"\
    whatYear()\">\n</form>\n</body>\n</html>\n```\n\n- The web page invites the user\
    \ to click on the Answer me button.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_58_1.png)\n\
    \n## GETTING HELP\n\n- Click on the button prompts a box to appear, asking a question.\
    \ The user keys the answer into the field below.\n- The user's input is then output\
    \ as part of the text that appears in an alert box that pops up.\n- We will now\
    \ introduce deliberate errors and look at the resulting error messages provided\
    \ by the web browser.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_59_0.png)\n\n\
    ## ROGUE PARENTHESES AND BRACKETS\n\n- Opened parentheses and brackets that are\
    \ not closed are a major cause of failure. Example shows a curly bracket in the\
    \ last line that is closed but never opened!\n- Netscape recognizes that there\
    \ is an error and tells you how to find out.\n- The error message explicitly states\
    \ that a curly bracket has been omitted from its expected position before the\
    \ body of the function, and the cursor in the code shows where it should be.\n\
    \nTo view JavaScript error messages in Netscape Navigator (v4.7), follow the instructions\
    \ in the browser's status bar.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_59_3.png)\n\
    \n## ROGUE QUOTATION MARKS\n\nQuotation marks also work in pairs. Confusion can\
    \ be caused by apostrophes. Internet Explorer thinks the error here is the absence\
    \ of a closing parenthesis, but in fact it is interpreting the apostrophe as a\
    \ closing quotation mark and expects it after. The best solution is to use double\
    \ quotation marks if you are going to use apostrophes, or if you can sidestep\
    \ the issue by avoiding contractions.\n\n```html\n<html>\n<head>\n<script language=\"\
    JavaScript\">\nfunction whatYear() {\n  var n=prompt(\"What year is it?\");\n\
    \  confirm(\"Is it really now \" + n + \" and we still haven't returned to the\
    \ moon?\");\n}\n</script>\n</head>\n```\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_60_0.png)\n\
    \n## THE CASES IN QUESTION\n\nIf you cant seem to detect that bug, make sure that\
    \ all case-sensitive words match exactly, especially in functions and variables\
    \ since these are the words you defined. The problem here is very clearly stated\
    \ by the Opera web browser. The function “whatYear” is defined, but the browser\
    \ has never heard of the variable “whatyear,” and it tells you so in its error\
    \ message.\n\n```html\n<html>\n<head>\n<script>\nfunction whatYear() {\n  var\
    \ n=prompt(\"What year is it?\");\n  confirm(\"Is it really now \" + n + \" and\
    \ we still haven't returned to the moon?\");\n}\n</script>\n</head>\n<body>\n\
    <form>\n<input type=\"button\" value=\"Answer me...\" onclick=\"whatYear()\">\n\
    </form>\n</body>\n</html>\n```\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_60_1.png)\n\
    \nA script on this page failed to execute. This keeps the page from displaying\
    \ or functioning properly.\n\n## AUTOMATED SCRIPTING\n\nSo far we have looked\
    \ at using a simple text editor, such as Notepad, to write JavaScript code as\
    \ a script or directly into an HTML document. There are alternatives...\n\n##\
    \ SOFTWARE: SCRIPT EDITORS\n\nIf you are likely to do much scripting, you may\
    \ find it helpful to use software that works like a kind of enhanced text editor.\
    \ Such programs take some of the routine keyboard work out of scripting, but still\
    \ leave you in control of what you produce. You can find plenty of programs of\
    \ this kind on software download sites as Tucows at www.tucows.com or Winfiles\
    \ at www.winfiles.com.\n\n## USING SCRIBLER 2000\n\nThis example features a shareware\
    \ program called Scribbler 2000 by Cream Software, which can be found at www.creamsoft.com/scribbler.\
    \ The program produces code that is almost identical (and equally effective) to\
    \ any coded-by-hand, Notepad-produced examples in this book so far. The example\
    \ shows how to use Scribbler 2000 to produce the kind of new window that was created\
    \ in Chapter 6.\n\n## A NEW WINDOW IN SCRIBLER 2000\n\nWith the program installed\
    \ and open on your PC, choose Open new window from the Script drop-down menu.\n\
    \n![](img/aafe1085e7f90302649c9c77d13f0ae9_61_0.png)\n\nIn the New window settings\
    \ dialog box, choose all the features you require the new window to have by defining\
    \ the dimensions in the Width and Height boxes, and by placing a check mark in\
    \ the appropriate Settings boxes. Finally, click on the OK button.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_62_0.png)\n\
    \nWhen you have defined the features of the new window, the program generates\
    \ the JavaScript code in the two windows at right. The top window is for any code\
    \ that you need to place within the <head> tags of the HTML document. The lower\
    \ window is to be placed in the <body> tags of the same document. Click the Copy\
    \ to Clipboard button to copy the relevant script to the clipboard for transfer\
    \ into your HTML document.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_62_1.png)\n"
  mdcn: "\n\n## 重复步骤\n\n现在保存页面并在 浏览器中打开 HTML 文档。如果 HTML 文档如你预期那样打开，且 JavaScript 代码运行正常，那么你已经解决了问题。如果浏览器遇到其他问题，你将需要使用刚刚描述的技术来解决新问题。根据需要重复此步骤！\n\
    \n## 查找行号\n\n如果你计算的行号与浏览器错误消息框中显示的数字之间存在明显差异，请尝试关闭记事本中的“自动换行”（Word Wrap）功能。你可以在“编辑”菜单找到它。某些脚本编辑器和网站设计程序会为你提供行号。查看源代码时，修正脚本中的错误可能比记事本更有帮助。例如，在\
    \ Macromedia 的 Dreamweaver 中，你可以选择在 HTML 代码旁边显示行号。只需点击页面顶部的“行号”（Line Numbers）复选框即可。\n\
    \n![](img/aafe1085e7f90302649c9c77d13f0ae9_56_0.png)\n\n当你在 Macromedia Dreamweaver\
    \ 中选择查看源代码时，可以通过勾选查看区域顶部的“行号”来选择显示行号。\n\n## INTERNET EXPLORER 中的错误警告\n\n如果没有看到这些页面描述的\
    \ JavaScript 错误警告框，可能是此功能在你的 Internet Explorer 中未激活。如果是这样，请立即开启它。它可能不是你需要的全部功能，但在引导你找到脚本出错区域时，它可以是无价之宝。\n\
    \n## 激活错误通知\n\n- 从 Internet Explorer 的“工具”菜单中选择“Internet 选项”。\n- 点击“高级”选项卡。\n\
    - 在“对每个脚本错误显示通知”旁边的框中打上标记。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_57_0.png)\n\
    \n## JavaScript 代码中的常见错误\n\nJavaScript 中的两种类型错误——引号或括号——被称为语法错误和运行时错误。这通常意味着你拼写错误或遗漏了某些内容。语法错误通常涉及拼写错误的命令。这两种错误都会导致你的网页行为异常，或者导致它们在浏览器中停止加载。\n\
    \n## 运行示例\n\n- 在这里我们看到了一个使用简单交互层面的网页源代码。JavaScript 代码仅包含几行：文档 `<head>` 标签内的一个函数以及文档\
    \ `<body>` 标签内的一个 `onclick` 事件处理程序。\n\n```html\n<html>\n<head>\n<script language=\"\
    JavaScript\">\nfunction whatYear() {\n  var n=prompt(\"What year is it?\");\n\
    \  confirm(\"Is it really now \" + n + \" and we still haven't returned to the\
    \ moon?\");\n}\n</script>\n</head>\n<body>\n<form>\n<input type=\"button\" value=\"\
    Answer me this...\" onclick=\"whatYear()\">\n</form>\n</body>\n</html>\n```\n\n\
    - 网页邀请用户点击“Answer me”（回答）按钮。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_58_1.png)\n\
    \n## 获取帮助\n\n- 点击按钮会弹出一个对话框询问问题。用户将答案输入到下方的字段中。\n- 用户的输入将作为弹出警告框中出现文本的一部分输出。\n\
    - 我们现在将引入故意错误，并查看 浏览器提供的相应错误消息。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_59_0.png)\n\
    \n## 异常的括号和大括号\n\n- 未关闭的左括号和中括号是失败的主要原因。示例显示最后一行有一个大括号被闭合了，但从未被开启！\n- Netscape\
    \ 识别到存在错误并告诉你如何找到它。\n- 错误消息明确指出，在函数体之前的预定位置漏了一个大括号，代码中的光标显示了它应该所在的位置。\n\n若要在 Netscape\
    \ Navigator (v4.7) 中查看 JavaScript 错误消息，请遵循浏览器状态栏中的指令。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_59_3.png)\n\
    \n## 异常的引号\n\n引号也是成对工作的。单引号（apostrophes）可能会引起混淆。Internet Explorer 认为这里的错误是缺少右括号，但实际上它将单引号解释为结束引号，并期望在其后出现引号。最好的解决方案是，如果你打算使用单引号，请使用双引号，或者通过避免使用缩写来规避此问题。\n\
    \n```html\n<html\n<head>\n<script language=\"JavaScript\">\nfunction whatYear()\
    \ {\n  var n=prompt(\"What year is it?\");\n  confirm(\"Is it really now \" +\
    \ n + \" and we still haven't returned to the moon?\");\n}\n</script>\n</head>\n\
    ```\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_60_0.png)\n\n## 问题所在之处\n\n如果你似乎无法检测到错误，请确保所有区分大小写的单词都完全匹配，特别是这些定义的函数和变量。Opera\
    \ 浏览器非常清楚地指出函数 whatYear 已经定义，但它从未听说过 whatyear。\n\n```html\n<html\n<head>\n<script\
    \ language=\"JavaScript\">\nfunction whatYear() {\n  var n=prompt(\"What year\
    \ is it?\");\n  confirm(\"Is it really now \" + n + \" and we still haven't returned\
    \ to the moon?\");\n}\n</script>\n</head>\n<body>\n<form>\n<input type=\"button\"\
    \ value=\"Answer me this...\" onclick=\"whatYear()\">\n</form>\n</body>\n</html>\n\
    ```\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_60_1.png)\n\n此脚本未能执行。这导致页面无法正常显示。\n\
    \n## 自动化脚本\n\n到目前为止，我们查看了使用记事本等简单文本编辑器直接将 JavaScript 代码写入 HTML 文档。还有其他选择……\n\n\
    ## 软件：脚本编辑器\n\n如果你可能编写大量脚本，可能会发现使用类似于增强编辑器的软件很有帮助。此类程序分了常规的键盘工作，但仍让你控制生成的内容。你可以在软件下载网站\
    \ Tucows 或 Winfiles 上找到此类程序。\n\n## 使用 Scribbler 2000\n\n此示例使用了 Cream Software\
    \ 的共享软件，可以在 creamsoft.com 获取。该程序产生的代码与书中之前任何手动编写、记事本生成的示例几乎相同（同样有效）。示例展示了如何使用\
    \ Scribbler 2000 生成第 6 章中创建的那种新窗口。\n\n## Scribbler 2000 中的新窗口\n\n在 PC 上安装并打开该程序后，从\
    \ Script 下拉菜单中选择 Open new window（打开新窗口）。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_61_0.png)\n\
    \n在新窗口设置对话框中，通过在 Width（宽度）和 Height（高度）框中定义尺寸并在相应的 Settings 框中勾选所需的功能。最后，点击 OK\
    \ 按钮。\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_62_0.png)\n\n当你定义好新窗口的功能后，程序会在右侧两个窗口中生成\
    \ JavaScript 代码。上方窗口用于你需要放置在 HTML 文档 `<head>` 标签内的任何代码。下方窗口应放在同一文档的 `<body>` 标签内。点击\
    \ Copy to Clipboard（复制到剪贴板）按钮将相关脚本复制到剪贴板，以便传输到你的 HTML 文档中。\n\n"
