    \ Image1 的新图像填充它。我只是告诉你你可以在哪里找到它。”`Image1` 提供了位置。如果你想预加载多个图像，只需重复该公式，并将所有内容保留在\
    \ script 标签内。例如：`Image2=new Image(100,50); Image2.src=\"services2.jpg\"; Image3=new\
    \ Image(120,50); Image3.src=\"contact2.jpg\";` 这告诉浏览器预加载两个具有指定尺寸的图像，并为它们都分配了变量名（`Image2`\
    \ 和 `Image3`）。起初，这些看似相同图像的大量名称可能看起来令人困惑，但一旦理解，它其实非常简单。\n\n## 工作原理\n\n在这个示例中，`Image1`\
    \ 是标识加载图像 `off.jpg` 空间的名称。该空间在网页首次显示时会被填充。如果访问者没有将光标移动到该空间（即该图像），则什么都不会发生。然而，如果鼠标光标移动到名为\
