  md: '# SOME JAVASCRIPT TERMINOLOGY


    If you want to take your web page authoring skills beyond simple coding and communicate
    with other authors, you will need to understand the "hierarchy" on which JavaScript
    is built; this includes understanding the relationships of the three principal
    concepts of "object,"property," and "method." These examples show only a few of
    the properties and methods relating to the window object, but the principles applies
    to all JavaScript objects, properties, and methods.


    # OBJECT


    +   An object in JavaScript is an entity that can usually be broken down into
    subcategories or parts. It can also have things done to it, or be acted upon.
    Objects include window, form, image, and button.


    ```

    syntax alert.txt - Notepad

    File Edit Search Help

    object


    Examples: window representing the Web

    The ''window'' object, browser window is the main JavaScript object.

    ```


    > In grammatical terms, an object is the JavaScript equivalent of a noun


    # PROPERTY


    +   A property in JavaScript is a quality that helps define an object - by providing
    a subcategory, or by describing a noun. The properties of an image, for example,
    are its name, border, height, and width.


    ```

    Untitled - Notepad

    File Edit Search Help

    object.property


    Examples: window.document

    window.history

    window.frames

    window.location

    ```


    > In JavaScript code, a property immediately follows the object it defines, separated
    by a period


    # METHOD


    +   A method describes an action that can be applied to an object. In this chapter,
    the alert, confirm, and prompt methods of the window object are described.


    ```

    Untitled - Notepad

    File Edit Search Help

    object.method


    Example: window.alert()

    window.prompt()

    window.confirm()

    window.open()

    ```


    > In JavaScript, the method acts on an object in the way that a verb acts on a
    noun'
