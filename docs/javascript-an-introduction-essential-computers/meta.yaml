    # SOME JAVASCRIPT TERMINOLOGY


    If you want to take your web page authoring skills beyond simple coding and communicate
    with other authors, you will need to understand the "hierarchy" on which JavaScript
    is built; this includes understanding the relationships of the three principal
    concepts of "object,"property," and "method." These examples show only a few of
    the properties and methods relating to the window object, but the principles applies
    to all JavaScript objects, properties, and methods.


    # OBJECT


    +   An object in JavaScript is an entity that can usually be broken down into
    subcategories or parts. It can also have things done to it, or be acted upon.
    Objects include window, form, image, and button.


