    # ## HOW DOES THE LINK METHOD WORK?


    When a visitor to this web page clicks the "Close this window" hyperlink, the
    browser attempts to go to the new page. Since there is no page to go to, the browser
    follows the instruction given by the JavaScript code and closes the page. If you
    try putting a URL between the quote marks, you will see that the hyperlink will
    take you to that URL, overriding the JavaScript instruction.


    # USING A CLOSE BUTTON


