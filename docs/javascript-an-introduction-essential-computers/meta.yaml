    # MICROSOFT’S FrontPage Express


    FrontPage Express is Microsoft’s free web page editor that enables you to create
    and format web pages in an easy-to-use WYSIWYG (what you see is what you get)
    layout. It offers many of the features available in the full versions of FrontPage
    Editor and FrontPage Explorer, including the capability to insert JavaScript code.


    ## ADDING YOUR OWN JAVASCRIPT CODE


    - To add your own JavaScript code to an HTML document that you are creating using
    FrontPage Express, first choose Script from the Insert menu. The Script dialog
    box will appear.


    - In the Script dialog box, click on the JavaScript radio button in the Language
    panel. Then type your code in the code box below and click on OK. There is no
    need to surround the code with <script> tags.


    The JavaScript code you have the inserted into the HTML will now appear as a symbol
    on the page.


    To see the HTML source code, choose HTML from the View menu.


    ## REVISING YOUR JAVASCRIPT


    You can revise an existing script at any time when you are using Frontpage Express,
    simply by right-clicking the appropriate script icon in the Frontpage Express
    window and choosing Script Properties from the drop-down menu. This will open
    the Script window, revealing your Javascript code (in the Script window). Click
    OK when you have finished revising the script and then save the HTML document
    by choosing Save from the File menu in the main Frontpage Express window.


    ## AUTOMATED SCRIPTING


    - In this example, FrontPage Express has been used to cause a User Prompt to appear,
    generated by the line of code being greet=prompt. As example shows, FrontPage
    Express has made very few modifications to the code you typed in the code box,
    but it has carried out important tasks. First, it has added comment tags to prevent
    it from being visible to non-JavaScript enabled browsers; second, it placed the
    necessary <script> tags around your code. If you opt to use such sophisticated
    web design packages as FrontPage Editor and Explorer to generate JavaScript code,
    you may find when you look at the source code, that it turns out to be more complex
    than you were expecting.


    The User Prompt is generated by the line of code beginning greet=prompt


    ## MACROMEDIA’S DREAMWEAVER


    Macromedia''s Dreamweaver is one of the (categorized as Behaviors), together with
    the best site-design packages available. Most of its advanced HTML effects, and
    its JavaScript-related features are accessed through the Behaviors window.


    ## DREAMWEAVER''S BEHAVIOR MENUS


    - In this example, we are going to use the Open Browser Window dialog box to set
    the features for a new pop-up window.

    - Start by clicking the + button and choosing Open Browser Window from the drop-down
    menu.


    - Choose the features you require from the Open Browser Window dialog box and
    click on OK.

    - Dreamweaver automatically generates the JavaScript code and places it within
    the HTML source code for the page.


    ## Designing the New Window


    ## ADDING YOUR OWN SCRIPTS


    - To place your JavaScript within an HTML document that you are building using
    Dreamweaver, start by choosing Script from the Insert drop-down menu.


    - In the Insert Script dialog box, choose JavaScript from the drop-down Language
    box.


    - Type your script in the Content box. There is no need to key in <script> tags
    or comments within this box. Click on OK.


    ## INSERTING A ROLLVER IMAGE


    - To insert a rollover image, start by choosing Rollover Image from the Insert
    drop-down menu.


    The Insert Rollover Image dialog box will open. Click the Preload Rollover check
    box if you want the rollover images to be preloaded. Then click on the first Browse
    button.


    In the Original Image dialog box, navigate to the file you intend to use for the
    original image. Once it is selected, you will return to the Insert Rollover dialog
    box. Click on the second Browse button, navigate to the image file you intend
    to use for the rollover image, and click on Select.


    Once the original and rollover images are named in the fields in the Insert Rollover
    Image dialog box, click on OK.


    The rollover will now be in place on your web page. This method reduces the need
    for you to know how to write code, but the code that it generates can be very
    confusing if you want to learn to do for yourself.


    ## Preloading Images


    ## SCRIPTS FROM THE WEB


    The web can offer huge amounts of JavaScript code for all levels of author. You
    will also find some tutorials and ready-made scripts.


    ## READY-MADE SCRIPTS


    One of the quickest ways to see range of JavaScript''s capabilities is to visit
    one of the many "script repositories" on the web, which have scripts available
    for you to cut and paste into your own documents. Usually, you are asked to credit
    the author in your HTML code or to place a shortcut to the site. Many of these
    sites give clear instructions about how to copy and paste the script, and you
    can learn a lot from the code.


    ## JAVASCRIPT LIBRARY


    Web is an essential site for any web page. The JavaScript library covers a wide
    range of subjects and offers a large number of free code to use in your source
    code. There is also a wealth of information from authors that will stimulate your
    ideas and help you write better code. Or you can just copy and paste the scripts,
    and leave the learning for another day...


    ## Reference Code


    Web code is our collection of code, function packages, and specific artworks that
    will enhance your pages in ways you may not know (or how to program). Code samples
    are provided for use on web page. modification and redistribution may depend on
    the code that you copy or download from our site.


    ## Editor Extensions


    Find the capabilities of HTML editor discover how THE SOURCE


    The Source contains hundreds of free JavaScript arranged by category, each script
    illustrated with a fully working example.


    ## GLOSSARY


    ## COMMENTS


    Explanatory text that appears in source code but not on the page.


    ## HOME PAGE


    The main page of a website, usually called home.htm or index.htm, which is opened
    first when you visit a website, consists of a series of pixels that display images
    on screen.


    ## CONCATENATE


    Run two or more strings together (using the character between each) to create
    one longer string.


    ## PNG


    A widely used compressed image format on the web, like the JPEG format, can display
    millions of colors.


    ## HTML


    Hypertext markup language. The "tagged" formatting language in which web pages
    are written.


    ## ROLLOVER


    In web pages, the swapping of one image for another when the mouse passes over
    a specific space, giving the effect of animation.


    ## DOWNLOAD


    The process of transferring a file from a remote computer to your computer.


    ## HYPERLINK


    Part of a web page (text, image, etc.) that links to a file or document on the
    internet.


    ## EMBED


    To place one block of code within another. JavaScript code is embedded within
    HTML.


    ## HYPERTEXT


    Text that links to other parts of a document, or to documents held on another
    computer.


    ## EVENT HANDLER


    A JavaScript command (such as onclick or onSubmit) that is carried out when the
    user executes appropriate mouse or key movement.


    ## ISP


    Internet Service Provider. Any organization that provides access to the internet.


    ## SERVER


