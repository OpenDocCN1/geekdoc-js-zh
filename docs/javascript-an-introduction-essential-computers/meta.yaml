  md: '# JavaScript Event Handlers


    Some Javascript code does not need to be placed within <script> tags. Usually,
    these instances are known as event handlers. Examples include the commands that
    make events when the visitor clicks the mouse or moves the cursor over text or
    an image. Whatever appears in quotes after one of these commands is interpreted
    by the browser as JavaScript and is handled accordingly.


    # AN EVENT HANDLER IN ACTION


    +   - Event handlers are words that begin with on, followed by a verb beginning
    with a capital letter. For example: onClick, onChange, onLoad, onSubmit, or onMouseOver.

    - In this example, onUnload is being used to call up an alert


    +   - This is the page that contains source code for the JavaScript event handler.
    Event handlers do not require "JavaScript" tags.


    ```

    <html>

    <title>Simple example of onUnload at work</title>

    <body onUnload="alert(''Thanks for visiting. Call again soon.'')">

    <p>When you leave this Web page, or quit the Web browser, an alert box will appear
    containing the words you have specified for the alert box.</p>

    <p>Note that you do not need to use "javascript" tags in this example.</p>

    </body>

    </html>

    ```


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_15_0.png)


    +   - When the user leaves the page or quits the browser, the alert box appears.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_15_1.png)'
  merge: -1
  pgno: 15
- img_proc: true
  md: "# # JavaScript Functions\n\nJavaScript uses a programming tool called a \"\
    function\" to work more efficiently. Once you understand how functions fit into\
    \ the general plan, you should be able to break down a page of code into something\
    \ that makes sense structurally.\n\n# ## THE PURPOSE OF FUNCTIONS\n\n+   - A function\
    \ is a named series of commands and is usually contained within the <head> tags.\n\
    - Once a function has been created, you can \"call\" it as many times as you like\
    \ further down the page by using a single line of code rather than typing a long\
    \ block of code into the body\n\n```\n<html>\n<head>\n  <title>The main Oscars\
    \ - by year</title>\n  <script language=\"JavaScript\">\n    function showA(awards)\
    \ {\n      alert(awards)\n    }\n  </script>\n</head>\n<body bgcolor=\"cyan\"\
    >\n  <h2>Academy Awards For 1951</h2>\n  <form>\n    <input type=\"button\" value=\"\
    Best Film\" onclick=\"showA('All Eve')\">\n    <input type=\"button\" value=\"\
    Best Director\" onclick=\"showA('Joseph L. Mankiewicz')\">\n    <input type=\"\
    button\" value=\"Best Actor\" onclick=\"showA('Jose Ferrer')\">\n    <input type=\"\
    button\" value=\"Best Actress\" onclick=\"showA('Judy Holliday')\">\n  </form>\n\
    </body>\n</html>\n```\n\n+   - What a function does, and what it is, is determined\
    \ by the author.\n- In this case, the function showAA is being used to bring up\
    \ an appropriate Alert box when a button is clicked.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_16_0.png)\n\
    \n+   - Clicking on the Best Actress causes the function to operate and bring\
    \ up an Alert box containing the words Judy Holliday.\n\n![](img/aafe1085e7f90302649c9c77d13f0ae9_16_1.png)"
  merge: -1
  pgno: 16
