- md: "\n## POP-Up Boxes\n\nOne of the easiest ways to enliven your web pages and\
    \ directly involve any visitors to your site is to use JavaScript's Alert, Confirm,\
    \ and Prompt pop-up dialog boxes.\n\n## JavaScript Dialog Boxes\n\nThe three kinds\
    \ of JavaScript dialog boxes share one important characteristic. Once any of them\
    \ has popped up-screen, all activity within the web page is frozen until an appropriate\
    \ button in the dialog box is clicked. For example, once an Alert box has popped\
    \ up, everything freezes until the OK button has been clicked. On-screen Alert\
    \ boxes cannot be sent to the back of the browser window. Nor can you click within\
    \ the main part of the browser window when an Alert box is displayed. The only\
    \ possible action is to click the OK button in the box. This same suspension of\
    \ activity holds true for the Confirm and Prompt boxes.\n\n## THE JAVASCRIPT POP-UP\
    \ BOXES\n\n- The Alert box is the simplest kind of box, and it is used mainly\
    \ to capture the attention of the visitor.\n- The Confirm box is also used in\
    \ this way, but has a Cancel button so that the visitor also has the choice of\
    \ refusing an option.\n- The Prompt box takes the process one stage further by\
    \ prompting the visitor to input information of some kind.\n\n## THE CASE IN QUESTION\n\
    \nIf you have wondered why capital letters are found throughout the variables,\
    \ functions, and other names used in JavaScript, the simple answer is convention.\
    \ It doesn't matter whether you use the spelling myvariable, MyVariable, or myVARIABLE,\
    \ but the way in which you spell it in the main body of the document should match\
    \ the case exactly, or your code may fail. For reason, most people tend to use\
    \ lower-case for functions and variables, reserving upper-case for the initial\
    \ letter of subsequent words within the name, for example, myVariable.\n\n## ALERT\
    \ Boxes\n\nThe alert method is used to catch the visitor's attention. For example,\
    \ one line of JavaScript can create a simple welcome announcement. An Alert box\
    \ can also announce the results of more complicated JavaScript detection scripts,\
    \ such as whether the visitor has all the plug-ins necessary to view your site.\
    \ You can choose to make any complex announcement that you like, but the code\
    \ for launching an Alert box is very straightforward, as this example shows.\n\
    \n## A WELCOMING ALERT BOX\n\n- This example shows how to produce an Alert box\
    \ that welcomes visitors to the “WebVerse” site.\n- Whatever the content, the\
    \ syntax works just the same.\n- The status bar shows that the appearance of the\
    \ Alert box has frozen the loading of the web page. The window.alert code is in\
    \ the head, the page will not load further until the OK button has been clicked.\n\
    \n## Prompt Boxes\n\nThe JavaScript Prompt box provides a text field in which\
    \ the visitor to your web page can type an answer in response to a question. The\
    \ box has an OK button, a Cancel button, and a text box to hold the response typed\
    \ by the visitor. The Prompt box must be closed by clicking one of the buttons\
    \ before being able to continue. The Prompt box enables you to capture the data\
    \ typed there and use it elsewhere. How this information is subsequently used\
    \ depends on the requirements of the web page and the skill and inventiveness\
    \ of the author.\n\n## THE PROMPT BOX IN ACTION\n\n- In this typical example,\
    \ the visitor is invited to type his or her name into a field on the Prompt box\
    \ and click the OK button.\n- The visitor's name then appears in an on-screen\
    \ greeting, which remains until the OK button is clicked.\n- The web page then\
    \ appears in the browser window incorporates the visitor's name within the text.\n\
    \n## USING VARIABLES WITH PROMPT BOXES\n\n- As this code shows, in order to use\
    \ what the visitor has, you need to create a variable name. The window.prompt()\
    \ captures the visitor's first name, but you can only use it if you associate\
    \ it with a variable (e.g. vName).\n- The variable can be placed anywhere on the\
    \ web page when used in conjunction with document.write().\n\n## WINDOW.PROMPT\
    \ SYNTAX\n\nThe prompt method must be used within <script> tags. The first string\
    \ comprises the contents of the pop-up dialog box (usually the question you are\
    \ asking the visitor). In the code, you define the question exactly as you would\
    \ for an Alert box. With the window.prompt(), however, you can use an optional\
    \ second string to determine the text that will appear in the text field. This\
    \ is usually filled with something helpful for the visitor like \"Type reply here,\"\
    \ and the visitor can immediately type it. If the second string is kept blank\
    \ (i.e. you just keep the quotation marks with them) and the visitor clicks OK\
    \ without typing anything in the text box, nothing will appear in the appropriate\
    \ position on the web page. To create a variable in JavaScript, first choose a\
    \ name for the variable, and then state what the variable represents, using the\
    \ following syntax: varVariableName=value. You can pick any name for a variable,\
    \ but it is more helpful to give it a descriptive name that shows what it contains.\n\
    \n## Confirm Boxes\n\nConfirm boxes are essentially Alert boxes that offer a choice\
    \ of two buttons: OK or Cancel (which is the same as Yes or No). There is very\
    \ little point in using the window.confirm() method unless you can do something\
    \ useful with the response from the visitor. To make the most of this OK or Cancel\
    \ response, you need to learn how to use if...else statements in JavaScript.\n\
    \n## USING THE IF...STATEMENT\n\n- Here is a simple example that shows you can\
    \ sometimes get the result you want merely by using the if clause. Clicking on\
    \ the subscribe link brings up a Confirm box.\n- The code that controls the Confirm\
    \ box provides a conditional clause. This determines the effect of clicking the\
    \ OK button.\n\n```html\n<html>\n<head>\n<script language=\"JavaScript\">\nif\
    \ (confirm(\"To subscribe to the newsletter\\nclick OK\")) {\nlocation=\"subscribe.htm\"\
    \n}\n</script>\n</head>\n</html>\n```\n\n- If the visitor clicks the OK button,\
    \ he or she will be taken to the URL defined in the line beginning location.href.\n\
    \nThe visitor is now taken to the defined URL (in this case, the subscription\
    \ page subscribe.htm).\n\nHowever, if the visitor clicks the Cancel button, he/she\
