    # JAVASCRIPT OVERVIEW


    If you are familiar with the basics of HTML, the markup language behind web pages,
    you should have few problems in understanding the basics of JavaScript.


    # WHAT IS JAVASCRIPT?


    JavaScript is a programming language – or, more specifically, an object-based
    scripting language – but not to put off by the technical jargon. JavaScript is
    far simpler to learn than other programming


    languages, such as Java and C++. JavaScript works with HTML to extend your control
    over the web browser, and to improve the way web pages work by making them more
    dynamic and efficient.


    # EASIER THAN IT LOOKS


    +   * Most JavaScript effects takes the form of a few lines of text embedded in
    an HTML document, you can learn sufficient programming skills to make significant
    improvements to your website.

    * Most browsers have built-in JavaScript compilers (the facility that interprets
    and runs JavaScript code), so users don''t need to install plug-ins to reap the
    benefits of JavaScript code included in a web page.


    ```

    <script language="JavaScript">

    -- Hide script from older browsers

    if (navigator.appName == "JavaEnabled")ndocument.write("NO PROBLEM! Your web browser
    is JAVA enabled")

    else {

    alert("PROBLEMS! Your web browser is not JAVA. Choose the UPGRADE or NON-JAVA
    buttons on the following page.")

    }

    // Ending script from older browsers --

    </script>

    ```


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_7_0.png)


    Each of these web browsers contains a JavaScript compiler.'
