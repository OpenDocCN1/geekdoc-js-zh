  md: '# NEW WINDOWS


    # NEW WINDOWS


    Have you ever wondered how some websites use pop-up windows to enhance their content?
    These sites are probably using JavaScript’s window.open() and window.close() commands.


    # THE WINDOW OPEN() METHOD


    The open() method of the window creates new windows when a link or button is clicked
    while keeping the original window open. In addition to specifying the contents
    of a new window, you can also determine its dimensions and use of features such
    as toolbar


    scrollbar. Some web page links lead to a pop-up text box rather than another web
    page, but the text box is probably a new web page. JavaScript has been used to
    strip the new web page of its features, which can be deactivated as easily as
    typing "feature=no" in a line of JavaScript.


    # WINDOW.OPEN SYNTAX


    "URL"


    If the HTML document is in the same folder (directory) as the main page, just
    type its name (e.g., pageload.htm). If it is in another directory, type the path
    (e.g., anotherfolder/pagetoad.htm). If the document is on another server (and
    if you have the owner’s permission to use it), type the full web address (e.g.,
    http://www.otherserver.com/pageload.htm).


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_43_0.png)


    "NAME"


    This name, surprisingly, does not appear in the title bar of the new page. It
    is required for more advanced JavaScript effects, but in the example it will have
    no effect on the appearance of the new window.


    "FEATURES"


    This contains all the optional features that determine the size and composition
    of the new window. If this third part of the string is left blank, the default
    window is opened with all the features in place.


    44 Designing the New Window'
