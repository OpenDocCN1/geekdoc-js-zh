    # OPENING THE SOURCE CODE


    +   - To open the source code of a web page (this includes your HTML documents
    stored on your hard disk), open the file in your web browser and choose Source
    from the View menu.


    +   - By default, Notepad will open, displaying the HTML document as a text file.


    +   - With the web page open in the background, edit the text document. To monitor
    the effect of your editing on the web page, first choose from the File menu in
    Notepad.


    +   - Now bring the web browser window to the front, click on the Refresh button,
    and review the changes.


