    # ## THE “LINK METHOD”


    To close a new window using a hyperlink, first create a link that goes nowhere;
    To do this, leave the quotation marks but leave a blank when the linked document
    or URL would normally appear: <a href=""></a> Then type the text that will appear
    on the page as the hyperlink between the < characters, as: <a href="">Close window</a>.
    Then add the JavaScript code immediately after the blank quotation marks: <a href="self.close()">Close
    this window</a>.'
