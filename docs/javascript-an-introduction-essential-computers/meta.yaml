    # THE CASE IN QUESTION


    If you have wondered why capital letters are found throughout the variables, functions,
    and other names used in JavaScript, the simple answer is convention. It doesn''t
    matter whether you use the spelling myvariable, MyVariable, or myVARIABLE, but
    the way in which you spell it in the main body of the document should match the
    case exactly, or your code may fail. For reason, most people tend to use lower-case
    for functions and variables, reserving upper-case for the initial letter of subsequent
    words within the name, for example, myVariable.


    # ALERT Boxes


    The alert method is used to catch the visitor''s attention. For example, one line
    of JavaScript can create a simple welcome announcement. An Alert box can also
    announce the results of more complicated JavaScript detection scripts, such as
    whether the visitor has all the plug-ins necessary to view your site. You can
    choose to make any complex announcement that you like, but the code for launching
    an Alert box is very straightforward, as this example shows.


    # A WELCOMING ALERT BOX


    +   * This example shows how to produce an Alert box that welcomes visitors to
    the “WebVerse” site.

    * Whatever the content, the syntax works just the same.

    * The status bar shows that the appearance of the Alert box has frozen the loading
    of the web page. The window.alert code is in the head, the page will not load
    further until the OK button has clicked.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_28_0.png)'
  - '[PAGE 29]


    28 · POP-UP BOXES


    # Prompt Boxes


    The JavaScript Prompt box provides a text field in which the visitor to your web
    page can type an answer in response to a question. The box has an OK button, a
    Cancel button, and a text box to hold the response typed by the visitor. The Prompt
    box must be closed by clicking one of the


    buttons before being able to continue. The Prompt box enables you to capture the
    data typed there and use it elsewhere. How this information is subsequently used
    depends on the requirements of the web page and the skill and inventiveness of
    the author.


    # THE PROMPT BOX IN ACTION


    +   - In this typical example, the visitor is invited to type his or her name
    into a field on the Prompt box and click the OK button.


    +   - The visitor''s name then appears in an on-screen greeting, which remains
    until the OK button is clicked.


    +   - The web page then appears in the browser window incorporates the visitor''s
    name within the text. The JavaScript code that makes all this happen can be seen
    on the opposite page.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_29_0.png)'
  - '[PAGE 30]


    # USING VARIABLES WITH PROMPT BOXES


    +   As this code shows, in order to use what your visitor has, you need to create
    a variable name. The window.prompt() captures the visitor''s first name for you,
    but you can only use it if you associate input with a variable name (e.g. vName).


    +   The variable can be placed anywhere on the web page when used in conjunction
    with the document.write() command.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_30_0.png)


    # WINDOW.PROMPT SYNTAX


    The prompt method must be used within <script> tags. The first string comprises
    the contents of the pop-up dialog box (usually the question you are asking the
    visitor). In the code, you define the question exactly as you would for an Alert
    box. With the window.prompt(), however, you can use an optional second string
    to determine the text that will appear in the text field. This is usually filled
    with something helpful for the


    visitor like "Type you reply here," and the visitor can immediately overtype it.
    If the second string is kept blank (i.e. you just keep the quotation marks with
    nothing between them) and the visitor clicks OK without typing anything in the
    text box, nothing will appear in the appropriate position on the web page. To
    create a variable in


    JavaScript, first choose a name for the variable, and then state what variable
    name represents, using the following syntax: var yourVariableName=value. You can
    pick any name you choose for a variable, but it is more helpful to give it a descriptive
    name that shows what it contains.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_30_1.png)


