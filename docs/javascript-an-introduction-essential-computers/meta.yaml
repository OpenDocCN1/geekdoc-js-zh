  md: '# POP-Up Boxes


    One of the easiest ways to enliven your web pages and directly involve any visitors
    to your site is to use JavaScript''s Alert, Confirm, and Prompt pop-up dialog
    boxes.


    # JavaScript Dialog Boxes


    The three kinds of JavaScript dialog boxes share one important characteristic.
    Once any of them has popped up-screen, all activity within the web page is frozen
    until an appropriate button in the dialog box is clicked. For example, once an
    Alert box has popped up, everything freezes until the OK button has been


    clicked. On-screen Alert boxes cannot be sent to the back of the browser window.
    Nor can you click within the main part of the browser window when an Alert box
    is displayed. The only possible action is to click the OK button in the box. This
    same suspension of activity holds true for the Confirm and Prompt boxes.


    # THE JASCRIPT POP-UP BOXES


    +   • The Alert box is the simplest kind of box, and it is used mainly to capture
    the attention of the visitor.


    +   • The Confirm box is also used in this way, but has a Cancel button so that
    the visitor also has the choice of refusing an option.


    +   • The Prompt box takes the process one stage further by prompting the visitor
    to input information of some kind.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_27_0.png)


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_27_1.png)


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_27_2.png)


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_27_3.png)


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_27_4.png)


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_27_5.png)'
