  md: '# WRITING JAVASCRIPT IN NOTPAD


    You don''t need any special software to write JavaScript. In fact, when you are
    starting out, it is best to use the simplest text editor at your disposal. Notepad,
    which is supplied with Windows 98, provides a good, no-frills tool. Whatever editor
    you use, you need to save your scripts in "text only" format. In this way, if
    you copy-paste JavaScript code from a saved file, you will guarantee you not be
    copying code placed there by the word-processing program.


    +   - Using Notepad, you can write JavaScript directly into HTML documents, or
    you can write the JavaScript separately, save the file, and then copy and paste
    the script into an HTML document later.

    - Here we are writing two scripts in a new Notepad document, making sure to give
    each script a descriptive heading that will help us identify it later.


    ```

    Untitled - Notepad

    File Edit Search Help

    SCRIPT 1 - Name Browser

    <script language="JavaScript">

    document.write("Welcome to my Web site. I see you are using the "navigator appName"+"<b>
    Web browser</b>")

    </script>


    SCRIPT 2 - Send main browser users to different intro pages

    <script language="JavaScript">

    if navigator appname == "Netscape"

    location.href="nsintro.htm"


    if navigator appname == "Microsoft Internet Explorer"

    location.href="ieintro.htm"

    </script>

    ```


    # SAVING THE DOCUMENT


    +   - Once the scripts are complete, save the document into a suitably named folder.

    - If you are creating an HTML document including JavaScript, remember to save
    it as an HTML document with either a .htm or .html extension.


    ![](img/aafe1085e7f90302649c9c77d13f0ae9_17_0.png)


    +   - Copy and paste the script'
