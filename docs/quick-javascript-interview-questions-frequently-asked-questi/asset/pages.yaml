  md: '# Chapter 15 App Cache


    Q. What is app cache? What are the benefits of using app cache API in a web application?

    ANSWER


    App cache API is the new feature provided by the HTML5.This API power up a web
    application working without an internet connection. The most important benefits
    by this API are listed below:


    +   **Speed**: Like all other cache it increases the speed of the page content.

    **Offline browsing**: It increases the usability of application as it can be accessed
    without internet.

    **Reduced load**: As the content and data is now cache in the browser the load
    of the application is reduced form the server.


    +   **Few network calls**: As most of reusable content is present in app cache
    this reduces the no of network call to the server.


    Q. How to enable application cache in an html file?

    ANSWER


    To enable application cache in a HTML file we need to have manifest attribute
    in <HTML> element. The syntax of declaring application cache in HTML file is as
    follows.


    ```

    <DOCTYPE HTML><html manifest="filename.appcache">

    ```


    Q. What is the media type of app cache?

    ANSWER


    A manifest file needs to have text/cache-manifest media type.


    Q. What are the 3 different section of manifest file?

    ANSWER


    A manifest file has 3 sections. These 3 different sections are as follows.

    **CACHE MANIFEST**: Files listed under this header will be cached after they are
    downloaded for the first time. **NETWORK**: Files under this header require a
    connection to the server, and will never be cached. **FALLBACK**: Files listed
    under this header specifies fallback pages if a page is inaccessible.


    Q. What is NETWORK section?

    ANSWER


    NETWORK is one of the sections in manifest file. The file name listed in the NETWORK
    section is never cached locally. The following code shows a sample of NETWORK
    section.

    NETWORK:login.html


    Q. What is FALLBACK section?

    ANSWER


    FALLBACK is one of the sections in manifest file. In this section we can mention
    the **file** name which will be called when application is offline. The following'
