  md: "# Chapter 3 Closure\n\nQ. What is Closure?\n\nANSWER\n\nA closure is an inner\
    \ function that has access to the outer wrapped function’s variables. It has three\
    \ different scope accesses:- Self-scope:\n\nIt has access to properties present\
    \ in its own scope.\n\nWrapped function’s scope:\n\nIt has access to the properties\
    \ present to its enclosing function.\n\nGlobal Scope:\n\nIt has access to the\
    \ properties present in global scope that is window scope.\n\nExample:\n\nThe\
    \ inner function still has the access to prop1 though prop1 belongs to outer function\
    \ scope.\n\n```\nfunction myOuterFunction(){ var prop1 = 5;\n  return innerFunction(){\n\
    \    return prop1;\n  }\n}\n\nvar res = myOuterFunction(); console.log(res.name);\n\
    console.log(res(res));\n```\n\nBelow screenshot shows the output of the above\
    \ code in the console.\n\n| Elements | Resources | Network | Sources | Timeline\
    \ |\n| --- | --- | --- | --- | --- |\n| > function myOuterFunction(){ var prop1\
    \ = 5; return innerFunction(){ return prop1; } var res = myOuterFunction(); console.log(res.name);\
    \ console.log(res(res)); innerFunction 5 | | | | |\n\nQ. Give an example of practical\
    \ implication of closure concept? ANSWER\n\nIn web development closures are more\
    \ frequently used by the developers. A most common scenario is when we need some\
    \ kind of factory which will return a function object with different value that\
    \ can be used by application.\n\nExample:\n\nThe following code has a background\
    \ color name backgroundColorFactory which returns a function with an input color.\
    \ Using this factory we have created greenBackground and blueBackground function\
    \ objects and bonded with the 2 buttons. Once user clicks the buttons background\
    \ color of the body is changed to the targeted color."
