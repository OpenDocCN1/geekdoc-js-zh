    <script>

    var aFragment = document.createDocumentFragment(), aHTMLElement = document.createElement("h2"),
    aHTMLElement = document.createTextNodeNode("SANDEEP");

    aHTMLElement.appendChild(aHTMLElement);

    aFragment.appendChild(aHTMLElement);\ocument.body.appendChild(aFragment);

    </script>

