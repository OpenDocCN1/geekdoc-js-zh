  md: '# Q. What are the different event handlers for a channel? ANSWER


    A channel has 4 different event handlers. These event handlers are as follows.


    Onopen: Executed when the connection is established. Onerror: Executed if there
    is an error creating the connection.


    Onmessage: When you receive a message, this method will execute


    Onclose: Executed if the other peer closes the connection.


    # Q. What is a signal channel? ANSWER


    WebRTC can''t create connections without some sort of server in the middle. We
    call this the Signal Channel.


    # Q. What is an ICE technique? ANSWER


    Interactive Connectivity Establishment (ICE) is a technique used in computer networking
    involving network address translators (NATs) in Internet applications of Voice
    over Internet Protocol (VoIP), peer-to-peer communications, video, instant messaging
    and other interactive media.


    # Q. What is an ICE Candidate? ANSWER


    While communication peers must exchange information about the network connection.
    This is known as an ICE candidate.


    # Q. What are the server side functionalities needed by the Web RTC? ANSWER


    Web RTC requires following functionalities from server side to create a communication
    between peers.


    User discovery and communication.

    Signaling.

    NAT/firewall traversal.

    Relay servers in case peer-to-peer communication fails.


    # Q. What is STUN protocol? ANSWER


    STUN (Session Traversal Utilities for NAT) is a standardized set of methods and
    a network protocol to allow an end host to discover its public IP address if it
    is located behind a NAT.'
