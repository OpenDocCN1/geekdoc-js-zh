  md: '# Chapter 11 Local Storage


    Q. What is local storage?


    ANSWER

    HTML5 provides a feature to store data locally in end user’s browser. Data is
    stored in the browser as key-value pair. Unlike cookie it has average space of
    5 MB. This storage comes in 2 different type sessionStorage and localStorage.


    localStorage : it stores data with no expiration date. sessionStorage : it stores
    data with an expiration date.


    Q. Which one is the main interface?


    ANSWER

    window.Storage() is the main interface from where the localStorage and sessionStorage
    are implemented. This interface has the below definition.


    ```

    interface Storage {

    readonly attribute unsigned long length;

    DOMString? key(unsigned long index);

    getter DOMString? getItem(DOMString key);

    setter void setItem(DOMString key, DOMString value); deleter void removeItem(DOMString
    key);

    void clear();


    ```


    The details of the above code are as follows:

    setItem(key,value) : This methods stored the value in storage using key-value
    pair.

    getItem(key) : This method retrieves the stored object using the key.

    removeItem(key) : This method removes the stored item based on the key.

    clear() : Deletes all the items from the storage. length : This property returns
    the length of the storage, no of elements inside the storage.

    key(position) : This method returns the key for the value in the numeric position.


    Q. How to store and retrieve an object in local storage? ANSWER

    Local storage provides setItem() and getItem() for storing and retrieving an object
    from the storage. setItem(key, value) method takes 2 parameter to store the object.
    The getItem(key) method retrieves the value using key as parameter. Below code
    shows the storing “Sandeep Kumar” string in “myName” key and then retrieves this
    string place it in a HTML element.


    ```

    <DOCTYPE html>

    <html>

    <body>

    <div id="resultContainer">

    </div>

    <script>

    var container =

    document.getElementById("resultContainer");


    ```'
