  md: "# Chapter 17 Miscellaneous Questions\n\nQ. What is strict mode?\nANSWER\n\n\
    Strict mode is a new directive in new ECMA 5 JavaScript specification. It is used\
    \ for secure JavaScript coding. It eliminates JavaScript silent errors by changing\
    \ them to throw errors.\n\nThe syntax of writing strict mode is below expression.\n\
    “use strict\"\nBelow code shows the use of strict mode inside a function.\n\n\
    ```\nfunction sayHello(){\n  \"use strict\";\n  myName = \"Sandeep\";\n}\nsayHello();\n\
    ```\n\nThe following screenshots show the error produced by using an undeclared\
    \ variable inside the sayHello() method.\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_83_0.png)\n\
    \nQ. List out some of the conditions that are not allowed in strict mode?\nANSWER\n\
    \nFind the list of the conditions that are not allowed in ECMA5 strict mode in\
    \ below:\n\nUsing a variable without declaring it is not allowed. Deleting a variable,\
    \ a function, or an argument is not allowed.\n\nDefining a property more than\
    \ once is not allowed. Duplicating a parameter name is not allowed.\n\nOctal numeric\
    \ literals and escape characters are not allowed.\n\nWriting to a read-only property\
    \ is not allowed. Deleting an undeletable property is not allowed."
