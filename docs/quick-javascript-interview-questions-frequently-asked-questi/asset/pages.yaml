  md: '# Chapter 13 Web RTC


    Q. What is Web RTC?


    ANSWER


    Web RTC provides the capability to browsers for real time communication without
    any additional plugin installed. It involves audio, video and other type of data
    streaming among the browser with their native capability.


    Q. What is the API implemented by Web RTC?


    ANSWER


    Web RTC implements three different API. These interfaces are listed below.


    MediaStream : This represents a synchronized media stream using camera and microphone.


    RTCPeerConnection : This interface is responsible for stable connection between
    peer browser during real time communication.


    RTCDataChannel : This interface is responsible for other type of data communication
    between peer browser. For example the remote desktop sharing using browser.


    Q. What is MediaStream?


    ANSWER


    MediaStream basically represents the stream captured by Camera and microphone.
    Each MediaStream has an input which captures the stream. This MediaStream can
    be accessed navigator.getUserMediaMedia() method.


    Q. What are the input parameters to getUserMedia()? ANSWER


    The getUserMedia() method takes 3 parameters as input. These parameters are as
    follows:


    Constraint Object similar to a configuration object. Success Callback Method.
    Error Callback Method.


    Q. What are MediaStreamTracks?


    ANSWER


    The MediaStream returned by getUserMedia() has 2 methods getAudioTracks() and
    getVideoTracks().Both of these methods returns an array of MediaStreamTracks.


    Q. What are the protocols used by Web RTC for communication?


    ANSWER


    Web RTC uses 2 different protocols for communication. These 2 protocols are listed
    as follows.


    DTLS: Datagram Transport Layer Security.

    SRTP: Secure Real-time Transport Protocol.


    Q. How to view the statistics of an progress Web RTC session in Chrome browser?


    ANSWER


    We can view the details statistics and charts of an ongoing Web RTC session in
    chrome browser using chrome://webrtc-internals/ in chrome browser.'
  merge: -1
