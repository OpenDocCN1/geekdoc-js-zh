  md: '# Chapter 8 Questions on Canvas API


    Q. What is a canvas in HTML5?


    ANSWER


    Canvas is a new element in HTML5 for drawing graphics. A graphics can be drawn
    on canvas by following below steps.


    Define the canvas area.

    Get the drawing context.

    Using the context start the drawing.


    Q. What is the difference between Canvas and SVG?


    ANSWER


    Difference between Canvas and SVG (Scalable Vector Graphics) are listed in below
    table.

    CANVAS SVG


    +   i. A diagram can be drawn in ii. using a context in Canvas.


    +   ii. A diagram drawn in ii. canvas is resolution dependent.


    +   iii. A diagram drawn in iii. Canvas can be saved to PNG or JPG format.


    +   iv. Diagram drawn in Canvas iv. is pixel based. No DOM elements are involved.


    +   v. Rendering game v. graphics, as sprites and backgrounds can be created.
    A diagram is drawn using XML like SVG element.


    +   A diagram drawn in SVG is resolution independent.


