  md: '# Chapter 10 Web Workers


    Q. What is a Web Worker?


    ANSWER


    Web Workers are new HTML5 feature to achieve concurrency in JavaScript execution
    in web application. A web worker is JavaScript file which run in the background
    of the browser without impacting the page performance. This helps in resolve the
    age old problem "Un responsive script alert box". Generally these workers can
    be used for extensive computation power.


    Q. How to detect Web Worker is supported by browser? ANSWER


    We can check the support of Web Worker in a browser by validating the Worker property
    present in the window object. Code for checking Web Worker support is as follows:


    ```

    <!DOCTYPE html>

    <html>

    <head lang="en">

    <title>Web Worker</title>

    </head>

    <body>

    <script>

    var isWorkerSupported = window.Worker ? true : false; console.log("Is Web Worker
    Supported:")

    "+isWorkerSupported);\n</script>

    </body>

    </html>

    ```


    In the previous code isWorkerSupported variable can contain TRUE or FALSE value
    based on the existence of Worker property inside window object. The following
    screenshot shows the output of above in chrome console.


    | Q Elements Network Sources |

    | | | < frame> |


    Is Web worker Supported: true


    Q. What is a dedicated worker?


    ANSWER


    A dedicated worker is only accessible by the calling script. A dedicated worker
    object can be created using worker constructor. Syntax for creating a dedicated
    worker is listed below.


    ```

    var aDedicatedWorker = new Worker("script.js")

    ```


    The parameter inside the Worker object is the JavaScript file which will run as
    worker in the background of the browser.'
