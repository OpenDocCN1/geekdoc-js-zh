    # Q. What is the purpose of Object.defineProperty() method? ANSWER


    ECMAScript 5.1 provides Object.defineProperty() method to create new properties
    to a defined object. It provides many configuration options to initialize these
    members. Below code shows use of this method.


    ```

    function Student(name) {

    this.name = name;

    }

    var student1 = Object.create(Student.prototype);

    properties={

    "subject": {

    value: "Computer",

    writable: true,

    enumerable:true

    },

    "marks": {

    value: 0,

    writable: false,

    enumerable:true

    }

    }

    Object.defineProperties(student1, properties);

    student1.name = "Sandeep";

    student1.subject="Mathematics";

    student1.marks=75;

    console.log(student1);

    ```


    In the above code student1 object created using Object.create() method. Then some
    new properties like subject and marks are added to this. The enumerable option
    decided whether the property can be enumerated as own property. Writable property
    decides whether the property is modifiable or not. The value property takes the
    default value of the property.'
