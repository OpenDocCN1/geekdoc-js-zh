- md: "\n![](img/beb9e4e69c3f782541f09594e1aab75e_9_0.png)\n\nWe need to follow 2\
    \ steps to create an inheritance.\n\n**Step1:**\nChild class prototype should\
    \ point to parent class object.\n`<ClassName>.prototype = new <ParentClass>();\n\
    \n**Step2:**\nReset the child class prototype constructor to point self.\n`<ClassName>.prototype.constructor=<ClassName>`\n\
    \n**Example:**\nBelow example shows **ScienceStudent** class as a child class\
    \ of **Student** class. The method **showMyType()** is available for ScienceStudent\
    \ object.\n\n```javascript\nfunction Student(name) {\n  this.name=name;\n}\nStudent.prototype.sayMyType\
    \ = function(){\n  console.log(\"I am student type\");\n}\nfunction ScienceStudent(name)\
    \ {\n  ScienceStudent.prototype = new Student();\n  ScienceStudent.prototype.constructor\
    \ = ScienceStudent;\n  var student2 = new ScienceStudent('sangeeta');\n  console.log(student2.sayMyType());\n\
    }\n```\n\nCheck out the below screen shot for the output of the above code in\
    \ the developer console.\n\n```javascript\nfunction Student(name){\n  this.name=name;\n\
    \  Student.prototype.sayType = function(){\n    console.log(\"I am student type\"\
