    \ Questions About The Author\nOne Last Thing...\n\n# Chapter 1 Inheritance\n\n\
    Q. How to create a class?\n\nANSWER\n\nJavaScript does not have a class definition.\
    \ To mimic classes in JavaScript functions can be used to declare a class.\n\n\
    Example :\n\nLet's create a student in JavaScript which takes two parameters name\
    \ and roll as property. The code will look like below,\n\n```javascript\nfunction\
    \ Student(name,roll){ this.name = name;\nthis.roll = roll;\n}\n```\n\nQ. How to\
    \ create an object?\n\nANSWER\n\nAn object in JavaScript can be created using\
    \ two ways:\n\nNew Keyword:\n\nTo create a student object from the above student\
    \ class we can call the Student function using new keyword.\n\nvar student1 =\
    \ new Student('sandeep',2)\n\nAnonymous Object:\n\nAnonymous objects can be created\
    \ using pair of curly braces containing property name and value pairs.\n\nvar\
    \ rose = {'color': 'red'}\n\nQ. How to declare a private and a public member?\n\
    \nPrivate members are declared using var keyword and constructor function.\n\n\
    ```javascript\nfunction Student(name,roll){ var id= ABCD123;\nthis.name = name;\n\
    this.roll = roll;\n}\n```\n\nWhen a Student object will be created the proprietied\
    \ name and roll will be accessible using dot operator but id will not be accessible\
    \ as it behaves as a private member and return undefined on call.\n\n```javascript\n\
    function Student(name,roll){\n  var id = \"ABCD123\";\n  this.name = name;\n \
    \ this.roll = roll;\n}\n```\n\n```javascript\nvar student1 = new Student('sandeep',25)\n\
    undefined\n```\n\n```javascript\nstudent1.name\n\"sandeep\"\n```\n\n```javascript\n\
    student1.id\nundefined\n```\n\nThe above chrome console is showing a student1\
    \ object is created.name property is accessible as it is showing sand on student1.name\
    \ call. So name is a public property for the student object. But id property is\
    \ not accessible and returned undefined on student1.id call. This shows id is\
    \ a private property in student1 object.\n\n# Q. What is prototype property?\n\
    \nBy Using Prototype we can add new members to an existing object. Every JavaScript\
    \ object has this property internally. Initially it is an empty object.\n\nExample:\n\
    \n```javascript\nfunction Student(name,roll){\nthis.name = name;\nthis.roll =\
    \ roll;\n}\n```\n\nvar student1 = new Student('sangeeta',30); Student.prototype.mark\
    \ = 100;\n\nCheckout the below chrome console for the use of prototype.\n\n```javascript\n\
    function Student(name,roll){\n  this.name = name;\n  this.roll = roll;\n}\nundefined\n\
    var student1 = new Student('sangeeta',30)\nundefined\nstudent1\nStudent {name:\
    \ \"sangeeta\", roll: 30}\nStudent.prototype.mark = 100\nstudent1\nStudent {name:\
    \ \"sangeeta\", roll: 30, mark: 100}\n```\n\nInitially the student1 object has\
    \ only two properties name and roll. By using a new property mark has been added\
    \ to student object with a value of 100.Now the console shows that the mark property\
    \ is also added to the existing student1 object.\n\n# Q. What is constructor property?\n\
    \n# ANSWER\n\nConstructor property of an object maintains a reference to its creator\
    \ function.\nExample:\n\nLet us checkout an example by creating a student object\
    \ and calling the constructor property on it.\n\n```javascript\nfunction Student(name,\
    \ mark){\nthis.name=name;\nthis.mark =mark;\n}\nvar student1 = new Student('sandeep',123);\
    \ console.log(student1.constructor);\n```\n\nCheckout the following screen shot\
    \ for above code in chrome console. The console log is printing the referenced\
    \ function by student1 object.\n\n```javascript\nfunction Student(name,mark){this.name=name;\
    \ this.mark=mark}\nundefined\n```\n\n```javascript\nvar student1 = new Student('sandeep',123)\n\
    undefined\n```\n\n```javascript\nconsole.log(student1.constructor)\nfunction Student(name,mark){this.name=name;\
    \ this.mark=mark}\nundefined\n```\n\n# How to call other class methods?\n\nANSWER\n\
    \nUsing call() and apply() method we can use methods from different context to\
    \ the current context. It is really helpful for reusability of code and context\
    \ binding.\n\ncall(): It is used to calls a function with a given value and arguments\
    \ provided individually.\napply(): It is used to call a function with a given\
    \ value and arguments provided as an array.\n\nBelow has two function getTypeOfNumber()\
    \ and getTypeOfAllNumber(). The details pf these functions are below. getTypeOfNumber\
    \ : This method takes single number as parameter and returns the type either Even\
    \ or Odd.\ngetTypeOfAllNumber : This method takes array of numbers as parameter\
    \ and returns the types in an array with Even or Odd.\n\n```javascript\nvar MyNumber\
    \ = {\ngetTypeOfNumber : function(number){\nvar type = (number % 2 === 0) ? \"\
    Even\" : \"Odd\"; return type;\n},\ntypeOfAllNumber : function () {\nvar result\
    \ = [],i=0;\nfor (i; i < arguments.length; i++){\nvar type =\nMyNumber.getTypeOfNumber.call(null,arguments[i]);\n\
    result.push(type)\n}\nreturn result;\n};\nvar getTypeOfNumber =\nMyNumber.getTypeOfNumber.call(null,21)\
    \ console.log(typeNumber)\nvar getTypeOfAllNumber =\nMyNumber.getTypeOfAllNumber.apply(null,[2,4,5,7,8,21])\n\
    ```\n\n```javascript\nconsole.log(typeofAllNumber)\n```\n\nBelow screenshot shows\
    \ output of the above code Firebug console.\n\n| Console HTML CSS Script DOM Net\
    \ Cookies Page Speed Typography |\n| :--- |\n| Clear Persist Profile All Errors\
    \ Warnings Info Debug Info Cookies |\n| var myNumber = { typeofOfNumber : function(...ull,\
    \ [2,4,5,7,8,21]) |\n| console.log(typeofAllNumber) |\n\n```javascript\n[ \"Even\"\
    , \"Even\", \"Odd\", \"Even\", \"Odd\" ]\n```\n\n# Q. Explain method overriding\
    \ with an Example?\n\nANSWER\n\nWe can override any inbuilt method of JavaScript\
    \ by declaring its definition again. The existing definition is accessible to\
    \ override by the prototype property. Consider the below example, split(it) is\
    \ a built-in method for a string object . Its default behaviour to break the specified\
    \ string to an array and is a member of function String Class. We have overridden\
    \ its definition using its prototype property.\n\nBelow screenshot shows the inbuilt\
    \ definition of split(it) method. We have divided the string into an array of\
    \ element.\n\n| Console HTML CSS Script DOM Net Cookies Page Speed Typography\
    \ |\n| :--- |\n| Clear Persist Profile All Errors Warnings Run Clear Copy Print\
    \ History |\n| var output1 = 'elephant'.split('e') |\n| console.log('before overriding\
    \ : ', output1); |\n\n```javascript\nbefore overriding : { \"1\", \"1\", \"phant\"\
    \ }\n```\n\nThe following screenshot shows the new overridden definition of split\
    \ (it) method. It is now normally returns string \"I am overridden\".\n\n| Console\
    \ HTML CSS Script DOM Net Cookies Page Speed Typography |\n| :--- |\n| Clear Persist\
    \ Profile All Errors Warnings Run Clear Copy Print History |\n| var output1 =\
    \ 'elephant'.split('e') |\n| console.log('before overriding : ', output1); |\n\
    | String.prototype.split = function(param) { \n| return \"I am overridden\"; }\n\
    | var output2 = \"elephant\".split(\"e\"); \n| console.log('after overriding :\
    \ ', output2); |\n\n```javascript\nafter overriding : I am overridden\n```\n\n\
    # Q. How to inherit from a class?\n\nANSWER\n\nInheritance can be achieved in\
    \ JavaScript using prototype property.\n"
  mdcn: "\n\n学习常见问题\n\n# 快速 JavaScript 面试题\n\n作者：Sandeep Kumar Patel\n\n# 快速 JavaScript\
    \ 面试题\n\n版权所有信息\n保留所有权利。未经出版者 Sandeep Kumar Patel 书面许可，本书不得以任何形式或通过任何电子或机械手段（包括信息存储和检索系统）复制，但文章或评测中的简短引用除外。\n\
    \n本书中使用的所有品牌名称和产品名称均为其所有者的商标、注册商标或贸易名称。我与书中的任何产品或供应商均无关联。\n\n出版商：\nSandeep Kumar\
    \ Patel。\n\n# 目录\n\n快速 JavaScript 面试题 目录\n第1章 继承\n第2章 关于事件的问题\n第3章 闭包\n第5章 关于\
    \ DOM 的问题\n第6章 Date 对象\n第7章 正则表达式\n第8章 关于 Canvas API 问题 第9章 Geo Location API\n\
    第10章 Web Workers\n第11章 Local Storage\n第12章 File API\n第13章 Web RTC\n第14章 Drag &\
    \ Drop API\n第15章 App Cache API\n第16章 Server Sent Events 第17章 杂项问题 关于作者\n最后一件事...\n\
    \n# 第1章 继承\n\nQ. 如何创建一个类？\n\n答案\n\nJavaScript 没有类定义。为了在 JavaScript 函数中模拟类，可以使用函数来声明类。\n\
    \n示例：\n\n让我们在 JavaScript 中创建一个学生，接受 `name` 和 `roll` 两个参数作为属性。代码如下：\n\n```javascript\n\
    function Student(name,roll){ this.name = name;\nthis.roll = roll;\n}\n```\n\n\
    Q. 如何创建一个对象？\n\n答案\n\n可以使用两种方式创建 JavaScript 中的对象：\n\n`new` 关键字：\n\n为了从上面的 `Student`\
    \ 类中创建一个学生对象，我们可以使用 `new` 关键字调用 `Student` 函数。\n\nvar student1 = new Student('sandeep',2)\n\
    \n匿名对象：\n\n可以使用包含属性名和值对的大括号对来创建匿名对象。\n\nvar rose = {'color': 'red'}\n\nQ. 如何声明私有和公共成员？\n\
    \n私有成员使用 `var` 关键字和构造函数声明。\n\n```javascript\nfunction Student(name,roll){ var\
    \ id= ABCD123;\nthis.name = name;\nthis.roll = roll;\n}\n```\n\n当创建一个 `Student`\
    \ 对象时，可以使用点操作符访问属性 `name` 和 `roll`，但无法访问 `id`，因为它表现得像私有成员，并在调用时返回 `undefined`。\n\
    \n```javascript\nfunction Student(name,roll){\n  var id = \"ABCD123\";\n  this.name\
    \ = name;\n  this.roll = roll;\n}\n```\n\n```javascript\nvar student1 = new Student('sandeep',25)\n\
    undefined\n```\n\n```javascript\nstudent1.name\n\"sandeep\"\n```\n\n```javascript\n\
    student1.id\nundefined\n```\n\n上面的 Chrome 控制台显示创建了一个 `student1` 对象。`name` 属性是可以访问的，因为调用\
    \ `student1.name` 时显示了 `sandeep`。因此 `name` 是学生对象的公共属性。但 `id` 属性不可访问，并在调用 `student1.id`\
    \ 时返回 `undefined`。这表明 `id` 是 `student1` 对象中的私有属性。\n\n# Q. 什么是 prototype（原型）属性？\n\
    \n通过使用 `prototype`，我们可以向现有对象添加新成员。每个 JavaScript 对象内部都拥有这个属性。初始时是一个空对象。\n\n示例：\n\
    \n```javascript\nfunction Student(name,roll){\nthis.name = name;\nthis.roll =\
    \ roll;\n}\n```\n\nvar student1 = new Student('sangeeta',30); Student.prototype.mark\
    \ = 100;\n\n查看下面的 Chrome 控制台了解 `prototype` 的用法。\n\n```javascript\nfunction Student(name,roll){\n\
    \  this.name = name;\n  this.roll = roll;\n}\nundefined\nvar student1 = new Student('sangeeta',30)\n\
    undefined\nstudent1\nStudent {name: \"sangeeta\", roll: 30}\nStudent.prototype.mark\
    \ = 100\nstudent1\nStudent {name: \"sangeeta\", roll: 30, mark: 100}\n```\n\n\
    初始 `student1` 对象只有 `name` 和 `roll` 两个属性。通过使用新属性 `mark`，学生对象被添加了一个值为 100 的 `mark`\
    \ 属性。现在控制台显示 `mark` 属性也被添加到了现有的 `student1` 对象中。\n\n# Q. 什么是 constructor（构造函数）属性？\n\
    \n答案\n\n对象的 `constructor` 属性维护对其创建者函数的引用。\n示例：\n\n让我们通过创建一个学生对象并对其调用 `constructor`\
    \ 属性来查看示例。\n\n```javascript\nfunction Student(name, mark){\nthis.name=name;\n\
    this.mark =mark;\n}\nvar student1 = new Student('sandeep',123); console.log(student1.constructor);\n\
    ```\n\n查看上述代码在 Chrome 控制台中的截图。控制台日志正在打印 `student1` 对象引用的函数。\n\n```javascript\n\
    function Student(name,mark){this.name=name; this.mark=mark}\nundefined\n```\n\n\
    ```javascript\nvar student1 = new Student('sandeep',123)\nundefined\n```\n\n```javascript\n\
    console.log(student1.constructor)\nfunction Student(name,mark){this.name=name;\
    \ this.mark=mark}\nundefined\n```\n\n# 如何调用其他类的方法？\n\n答案\n\n使用 `call()` 和 `apply()`\
    \ 方法，我们可以将不同上下文的方法应用到当前上下文。这对于代码的可重用和上下文绑定非常有帮助。\n\n`call()`：它用于通过给定值和单独提供的参数来调用函数。\n\
    `apply()`：它用于通过给定值和数组形式的参数来调用函数。\n\n"
