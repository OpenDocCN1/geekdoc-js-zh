    # Chapter 7 Regular Expression


    Q. What is Regular Expression in JavaScript?

    ANSWER Regular expressions are used for pattern matching in a string. A regular
    expression in JavaScript can be declared in two ways. Syntax for these two approaches
    is listed below.

    var AREExpression = new RegExp(pattern,modifiers); var aRegExpression = /pattern/modifiers;

    The details of these syntaxes are as follows:

    pattern : it represents the search string.

    modifiers : it represents the conditional switches that will be applied to the
    pattern

    matching


    Q. What are the methods of regular expression?

    ANSWER There are 3 different methods for regular expressions are listed below.

    exec() : scans for a matching and returns the first matched string

    test() : scans for a matching string and returns boolean value true or false.

    tString() : This method returns the string value of a regular expression.


    Q. What is the switch \w?

