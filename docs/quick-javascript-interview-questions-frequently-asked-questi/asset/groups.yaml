  - "[PAGE 81]\n\n# Chapter 16 Server Sent Events\n\nQ. What is Server Side Events\
    \ (SSE)?nANSWER\nHTML5 provides server side events feature by which a web page\
    \ gets the update from the server automatically. A great example of this feature\
    \ is Facebook notification or Google + updates.\n\nQ. What is the content type\
    \ of the server response? ANSWER\nThe content type of the server response is \"\
    text/event-stream\" for the \"Content-Type\" header.\n\nQ. How to create an event\
    \ source for listening to server updates? ANSWER\nan event source can be created\
    \ by instantiating the object of EventSource class with a server path. The syntax\
    \ for creating an event source is listed below.\n\n```\nvar source = new EventSource(\"\
    URL to Server\");\n```\n\nQ. What are the event types fired by an EventSource?\
    \ ANSWER\n EventSource fires 3 different events. Callback methods can be attached\
    \ to the source for listening to these events. These event types are listed below.\n\
    \n+   onopen : This event is fired when the server open the connection to the\
    \ browser.\nonmessage: This event is fired when server produces the new output\
    \ to the stream.\nonerrorwer: This event is fired when an error occurs by some\
    \ means.\n\nQ. How to close an event stream?\nANSWERnThe event stream can be closed\
    \ using close() method.\n\nQ. What is the format of event stream?\nANSWER\nThe\
    \ event stream is a simple stream of text data, which must be encoded using UTF-8.\n\
    Each message is separated by a pair of newline characters. A colon as the first\
    \ character of a line is, in essence, a comment, and is ignored."
