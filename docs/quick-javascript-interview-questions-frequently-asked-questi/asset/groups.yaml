    \ = new Object();\n      Object.prototype = null;\n      return result;\n    }\n\
    \  })()\n```\n\nThe above code checks if create() method is already present inside\
    \ Object using comparing its type to function. If this condition is true create()\
    \ method is not present. Then polyfill code executes and assigns the empty object\
    \ to property.\n\n## Q. What is the purpose of Object.defineProperty() method?\n\
    \nANSWER\nECMAScript 5.1 provides Object.defineProperty() method to create new\
