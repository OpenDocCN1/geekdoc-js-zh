    # Q. What is a shared worker?


    # ANSWER


    A Shared Worker can be accessed by multiple scripts. A shared worker is accessible
    by different window, iframes and other worker having same origin. Syntax for creating
    a new dedicated worker is as follows.


    ```

    var aSharedWorker = new SharedWorker("script.js");

    ```


    The parameter inside the Worker object is the JavaScript file which will run as
    shared worker in the background of the browser.


    # Q. Develop a dedicated worker to display the time?


    # ANSWER


    Let''s create the time worker in date.js file and we can call this worker in dateWorkerDemo.html
    file. The following code shows the content of dateWorker.js file which listens
    to the messages and posts the current time in every second.


    ```

    self.addEventListener("message",function(){setInterval(function(){

    var time = new Date();

    self.postMessage({

    hour:time.getHours(),

    minute:time.getMinutes(),

    second:time.getSeconds()

    });

    },1000)

    });

    });

    ```


    The following code shows the content of dateWorkerDemo.html containing creation
    of instance and listening to worker response.


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <title>Time Web Worker Demo</title>

    </head>

    <body>

    <h1 id="resultContainer"></h1>

    <button id="time">Get Time</button>

    <script>

    var dateWorker = new Worker("dateWorker.js");

    resultContainer = document.getElementById("resultContainer"), timeButton =\ocument.getElementById("timeButton\n

    timeButton.addEventListener("click",function(){

    dateWorker.postMessage(null);

    });

    dateWorker.addEventListener("message",function(workerEvent){ var responseData
    = workerEvent.data,

    hour = responseData.hour,

    minute = responseData.minute,

    second = responseData.second,

    resultContainer.innerText = "HOUR: "+hour+

    " MINUTE: " +minute+" SECOND: "+second;\n});

    </script>

    </body>

    </html>

    ```'
