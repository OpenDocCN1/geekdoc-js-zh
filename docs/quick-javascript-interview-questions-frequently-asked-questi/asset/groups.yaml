    ANSWER


    dataTransfer object holds the piece of data sent in a drag action. dataTransfer
    is set in the dragstart event and read/handeled in the drop event. The syntax
    for setting value in dataTransfer object is as follows.

    event.dataTransfer.setData(format, data),


    The above syntax will set the object''s content to the mime type and data payload
    passed as arguments.


