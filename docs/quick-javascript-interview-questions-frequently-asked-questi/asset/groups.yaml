    \n## Q. 如果浏览器中没有 Object.create() 方法，请编写补丁（polyfill）。\n\n回答\n\nECMAScript 5.1 在其规范中拥有此方法。如果浏览器没有\
    \ `Object.create()` 方法，我们需要编写一个补丁。下面的代码展示了 `Object.create()` 方法的补丁。\n\n```javascript\n\
    // 如果 Object 存在 create 方法\nif (typeof Object != 'function') {\n  // 定义 create\
    \ 方法\n  Object.create = (function() {\n    return function(prototype) {\n    \
    \  if (arguments.length > 1) {\n        throw Error('Second argument not supported');\n\
    \      }\n      if (typeof prototype != 'object') {\n        throw TypeError('Argument\
    \ must be an object');\n      }\n      Object.prototype = prototype;\n      var\
    \ result = new Object();\n      Object.prototype = null;\n      return result;\n\
    \    }\n  })()\n```\n\n上面的代码通过比较类型检查 `Object` 内部是否已经存在 `create()` 方法。如果不存在，则执行补丁代码并将空对象赋予属性。\n\
    \n## Q. Object.defineProperty() 方法的目的是？\n\n回答\n\nECMAScript 5.1 提供了 `defineProperty()`\
    \ 方法来为定义的对象创建新属性。它为这些成员提供了许多配置选项。下面的代码展示了其用法。\n\n```javascript\nfunction Student(name)\
    \ {\n  this.name = name;\n}\nvar student1 = Object.create(Student.prototype);\n\
