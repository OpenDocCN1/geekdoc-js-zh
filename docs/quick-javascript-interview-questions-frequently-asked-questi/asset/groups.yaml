    \n# 第11章 本地存储 (Local Storage)\n\nQ. 什么是本地存储？\n\n答案\nHTML5 提供了一种在终端用户浏览器本地存储数据的功能。数据以键值对的形式存储在浏览器中。与\
    \ cookie 不同，它的平均空间为 5 MB。这种存储分为两种类型：sessionStorage 和 localStorage。\n\nlocalStorage：它存储不带过期日期的数据。sessionStorage：它存储带有过期日期的数据。\n\
    \nQ. 哪一个是主接口？\n\n答案\nwindow.Storage() 是实现 localStorage 和 sessionStorage 的主接口。该接口有如下定义。\n\
    \n```javascript\ninterface Storage {\nreadonly attribute unsigned long length;\n\
    DOMString? key(unsigned long index);\ngetter DOMString? getItem(DOMString key);\n\
    setter void setItem(DOMString key, DOMString value); deleter void removeItem(DOMString\
    \ key);\nvoid clear();\n}\n```\n\n上述代码的细节如下：\n- setItem(key,value) : 此方法使用键值对在存储中存储值。\n\
    - getItem(key) : 此方法使用 key 获取所存储的对象。\n- removeItem(key) : 此方法根据 key 移除存储的项。\n\
    - clear() : 删除存储器中的所有项。\n- length : 此属性返回存储的长度，即存储器内部元素的数量。\n- key(position) :\
    \ 此方法返回数值位置对应值的键。\n\nQ. 如何在本地存储中存储和检索对象？\n答案\n本地存储提供了 setItem() 和 getItem() 来从存储中存储和检索对象。setItem(key,\
    \ value) 方法接收2个参数来存储对象。getItem(key) 方法使用 key 作为参数检索值。下面的代码展示了在“myName”键中存储“Sandeep\
    \ Kumar”字符串，然后检索该字符串并将其放在 HTML 元素中。\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <div id=\"resultContainer\">\n</div>\n<script>\nvar container = document.getElementById(\"\
    resultContainer\");\nlocalStorage.setItem(\"myName\", \"Sandeep Kumar\"); \ncontainer.innerHTML\
    \ = localStorage.getItem(\"myName\"); \n</script>\n</body>\n</html>\n```\n\n下方的截图显示了\
    \ Chrome 开发者工具存储预览，它以键值对的形式持有上述对象。\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_63_0.png)\n\
    \n# Sandeep Kumar\n\n- Elements 网络 Sources 时间线 Profiles\n\n| | Key | Value |\n\
    |---|---|---|\n| Frames | myName | Sandeep Kumar |\n| Web SQL | | |\n| IndexedDB\
    \ | | |\n| Local Storage | | |\n| http://127.0.0.1:51792 | | |\n| Session Storage\
    \ | | |\n| Cookies | | |\n| Application Cache | | |\n\nQ. 如何为本地存储附加事件？\n\n答案\n\
    当本地存储对象被修改时，会触发一个存储事件（storage event）。可以使用 addEventListener() 或 attachEvent() 方法在\
    \ window 对象上挂载回调方法。\n\n注意：\n当在与本地存储关联的存储区域调用 setItem()、removeItem() 和 clear()\
    \ 方法时，如果这些方法执行了操作，那么除了 x 之外，每个 Window 的 localStorage 属性的 Storage 对象关联同一个存储区域的\
    \ Document 对象都必须触发存储事件。\n\n简单来说，存储事件会在触发事件的更新 localStorage 对象之外的每一个窗口/标签页上触发。下面的代码有一个监听存储事件的回调方法。当点击其中一个标签页中的按钮来更新本地存储对象时，另一个标签页中的存储事件监听器会被触发，内容随之更新。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div id=\"resultContainer\"></div>\n\
    <button onclick=\"update()\">点击我</button> \n<script>\nvar container = document.getElementById(\"\
    resultContainer\"), \nmethodStorageEvent = function(event) {\n  container.innerHTML\
    \ = \"事件触发\" + localStorage.getItem(\"myName\"); \n},\ncounter = 1,\nupdate =\
    \ function(){\n  localStorage.setItem(\"myName\", ++counter);\n};\nwindow.addEventListener(\"\
    storage\", methodStorageEvent);\n</script>\n</body>\n</html>\n```\n\n下方的截图演示了存储事件是如何触发的。\n\
    \n![](img/beb9e4e69c3f782541f09594e1aab75e_64_0.png)\n\n"
