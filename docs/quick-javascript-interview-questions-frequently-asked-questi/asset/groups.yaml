    \ = 75;\nconsole.log(student1);\n```\n\n在上面的代码中，使用 `Object.create()` 方法创建了 student1\
    \ 对象。然后向其添加了 subject 和 marks 等新属性。`enumerable` 选项决定属性是否可以被枚举。`writable` 属性决定属性是否可修改。`value`\
    \ 取属性的默认值。下表显示了上述代码在开发者控制台中的输出。\n\n| 元素 | 资源 | 时间线 | 审核 |\n| :--- | :--- | :---\
    \ | :--- |\n\n```javascript\nfunction Student(name) {\n  this.name = name;\n}\n\
    var student1 = Object.create(Student.prototype);\nproperties={\n  \"subject\"\
    : {\n    value: \"Computer\",\n    writable: true,\n    enumerable: true\n  },\n\
    \  \"marks\": {\n    value: 0,\n    writable: false,\n    enumerable: true\n \
    \ }\n}\nObject.defineProperty(student1, properties);\nstudent1.name = \"Sandeep\"\
    ;\nstudent1.subject = \"Mathematics\";\nstudent1.marks = 75;\nconsole.log(student1);\n\
    Object {subject: \"Mathematics\", marks: 0, name: \"Sandeep\"}\n```\n\n## Q. 在\
    \ JavaScript 中如何区分作用域和上下文？\n\n回答\n\n作用域（Scope）涉及变量的可见性，上下文（Context）指的是方法所属的对象，可以通过\
    \ `call` 或 `apply` 进行更改。\n\n## Q. 将变量赋值给空对象的两种方法？\n\n回答\n\n创建一个空对象时，你可以实例化 `Object`\
    \ 构造函数，或者简单创建一个空对象字面量。在任何情况下，你都可以向对象添加属性。创建空对象的语法如下。\n\n```javascript\nvar aEmptyObject\
    \ = new Object();\nvar aEmptyObject = {};\n```\n\n# 第二章 事件问题\n\n## Q. 事件是如何工作的？\n\
    \n回答\n\n事件传播遵循两个阶段：捕获阶段和冒泡阶段。\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_15_0.png)\n\
    \n**捕获阶段：**\n在此阶段，事件首先通过所有内部元素从 DOCUMENT 向向目标元素移动。\n\n**冒泡阶段：**\n在此阶段，事件通过所有外层元素从目标元素向上向\
    \ DOCUMENT 移动。\n\n## Q. 如何将事件绑定到元素上？\n\n回答\n\n根据 DOM Level 2 事件规范，可以使用 `addEventListener()`\
    \ 方法通过三个参数将事件绑定到元素。\n\n语法：\n`<element>.addEventListener(<eventname>,<callback>,<booleanphase>)`\n\
    \n- **eventname**: 以字符串参数表示事件类型。例如 click, mouseover, mouseout\n- **callback**:\
    \ 这代表为了处理事件而调用的回调函数。\n- **booleanphase**: 代表监听器绑定的事件阶段。FALSE 值代表冒泡阶段，TRUE TRUE\
    \ 值代表捕获阶段。\n\n示例：\n在文档上添加了一个点击监听器，当点击发生时会弹出消息。\n```javascript\ndocument.addEventListener('click',\
    \ function () { \n  alert(\"Insider Event Listener\"); \n}, false);\n```\n\n##\
    \ Q. 在 IE9 浏览器版本之前如何绑定事件？\n\n回答\n\n在旧浏览器中，可以通过 `attachEvent()` 方法将事件绑定到元素。\n对于冒泡阶段，可以添加监听器。\n\
    \n语法：\n`<element>.attachEvent(<eventname>, <callback>)`\n\n示例：\n在文档上添加了点击事件监听器，可以发生点击事件。下方的截图显示在\
    \ IE 10 开发者工具栏中添加点击事件。\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_16_0.png)\n\
    \n```javascript\ndocument.attachEvent('onclick', function () {\n  console.log(\"\
    Insider Event Listener\");\n});\n// true\nInsider Event Listener\n```\n\n```javascript\n\
    document.attachEvent('onclick', function () {\n  console.log(\"Insider Event Listener\"\
    );\n};\n```\n\n除了 IE 之外，其他浏览器通过 `addEventListener()` 方法添加。下方的截图显示了该方法在 Firebug\
    \ 中的演示。\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_16_1.png)\n\n## 如何移除事件监听器？\n\
    \n回答\n\n根据 DOM Level 2 事件规范，可以使用 `removeEventListener()` 方法移除事件监听器。对于 IE 浏览器，必须使用\
    \ `detachEvent()` 方法。\n接下来的截图显示了为 IE 浏览器从文档移除点击事件处理程序。\n\n"
