    # Chapter 6 Date Object


    Q. What is a JavaScript Date Object?


    ANSWER


    JavaScript Date object returns time in that single moment. It contains the value
    in milliseconds since 1 January, 1970 UTC.


    Q. What are the different ways to create a Date object? Or what are the different
    constructor forms of Date object?


    ANSWER


    JavaScript Date object has 4 overloaded constructors. These constructors are listed
    below.


    ```

    new Date()

    new Date(milliseconds)

    new Date(dateString)

    new Date(year, month, day, hours, minutes, seconds, milliseconds)

    ```


