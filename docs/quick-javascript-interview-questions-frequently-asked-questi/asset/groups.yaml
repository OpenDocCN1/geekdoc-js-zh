    \ ApplicationCache\n```\n\n## Q. 如何手动更新 appcache？\n\n答案\n\n我们可以通过对浏览器进行强制刷新（hard\
    \ reload）来更新缓存。我们也可以调用 `swapCache()` 方法来程序化更新缓存。\n\n## 第 16 章服务器事件 (Server Sent\
    \ Events)\n\nQ. 什么是服务器事件 (SSE)？\n答案\nHTML5 提供了服务器事件功能，网页借此自动从服务器获取更新。该功能的一个很好的例子是\
    \ Facebook 通知或 Google+ 更新。\n\nQ. 服务器响应的响应类型是什么？答案\n服务器响应的响应类型在 \"Content-Type\"\
    \ 请求头中为 \"text/event-stream\"。\n\nQ. 如何创建一个事件源来监听服务器更新？答案\n可以通过实例化带有服务器路径的 `EventSource`\
    \ 类对象来创建事件源。创建事件源的语法列如下。\n\n```\nvar source = new EventSource(\"URL to Server\"\
    );\n```\n\nQ. EventSource 触发了哪些事件类型？答案\nEventSource 触发 3 种不同的事件。可以为源挂载回调方法来监听这些事件。这些事件类型列如下：\n\
    \n- onopen: 当服务器向浏览器打开连接时触发此事件。\n- onmessage: 当服务器向流产生新输出时触发此事件。\n- onerror: 当某种某种发生错误时触发此事件。\n\
    \nQ. 如何关闭事件流？\n答案\n可以使用 `close()` 方法关闭事件流。\n\nQ. 事件流的格式是什么？\n答案\n事件流是一个简单的文本数据流，必须使用\
    \ UTF-8 编码。\n每条消息由一对换行符分隔。行首的冒号本质上是注释，会被忽略。\n\n## 第 17 章 杂题\n\nQ. 什么是严格模式 (strict\
    \ mode)？\n答案\n严格模式是新 ECMA 5 JavaScript 规范中的新指令。它用于安全的 JavaScript 代码编写。它通过将静默错误转换为抛出错误来消除\
    \ JavaScript 错误。\n\n严格模式的语法如下：\n\"use strict\"\n下面的代码显示了在函数内部使用严格模式。\n\n```\n\
    function sayHello(){\n  \"use strict\";\n  myName = \"Sandeep\";\n}\nsayHello();\n\
    ```\n\n以下截图显示了在 sayHello() 方法内部使用未声明变量产生的错误。\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_83_0.png)\n\
    \nQ. 列出一些在严格模式下不允许的条件？\n答案\n在下方列出了 ECMA5 严格模式下不允许的条件列表：\n\n不允许在不声明的情况下使用变量。不允许删除变量、函数或参数。\n\
    \n不允许重复定义同一属性。不允许重复参数名。\n\n不允许使用八进制数字字面量和转义字符。\n\n不允许向只读属性写入。不允许删除不可删除的属性。\n\n\
    字符串 \"eval\" 不能作为变量。字符串 \"arguments\" 不能作为变量。\n\n不允许使用未来的预留关键字。\n\nQ. 控制台中产生 0.1+0.2\
    \ 的输出结果是什么？为什么？答案\nJavaScript 数学库遵循 IEEE 754 标准进行数学运算。IEEE 754 标准使用 64 位表示浮点数。这导致在评估\
    \ `0.1 + 0.2` 表达式时产生问题。下面的截图显示了该表达式的 Firebug 控制台。\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_84_0.png)\n\
    \nJavaScript 内部将 0.1 转换为 16 精度，变为 0.10000000000000001，然后加上 0.2 变为 0.30000000000000004。\n\
