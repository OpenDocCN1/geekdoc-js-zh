    JSON is less secure because of absence of JSON parser in browser.

    If the data is in XML, you can write it and run it over the XML to output the
    data into another format: HTML, SVG, plain text, comma-delimited, JSON.

    When you have data in JSON, it pretty much stuck there. There''s no easy way to
    change it into another data format. So here, XML scores over JSON.


