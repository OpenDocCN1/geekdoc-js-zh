    Q. How to resolve the issue 0.1+0.2 = 0.30000000000000004 and produce 03? ANSWER

    This can be resolved by using toFixed(1) method to explain this. toFixed() method
    converts a number to the specified decimal places. Below shows the use of toFixed()
    to produce the correct output is 0.3.


    ![](img/beb9e4e69c3f782541f09594e1aab75e_84_2.png)


    ```

    var sum = 0.1+0.2;

    console.log(sum);

    console.log(sum.toFixed(1));

    0.30000000000000004

    0.3

    ```


