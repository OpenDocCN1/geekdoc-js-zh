    # Q. What are the Drag and drop events?


    ANSWER


    There are 7 different drag and drop events that can be attached with a callback
    method programmatically.

    Dragstart: it is fired on an element when a drag is started Dragenter: it is fired
    when the mouse enters an element while a drag is occurring.

    Dragover: This event is fired as the mouse is moving over an element when a drag
    is occurring.

    Dragleave This event is fired when the mouse leaves an element while a drag is
    occurring.

    Drop: The drop event is fired on the element where the drop occurred at the end
    of the drag operation.

    Dragend: The source of the drag will receive a dragend event when the drag operation
    complete, whether it was successful or not.


