    **Blob property bag**: It takes one parameter representing type of the ASCII-encoded
    string

    lower case representing the media type of the Blob.


    The following code shows an example of creating Blob using new keyword:


    ```

    var a = new Blob();

    var b = new Blob(["foobarbazetcet" + "birdiebirdieoo"], {

    t"text/plain;charset=UTF-8"\});

    ```


    # Q. What are readable states for a Blob object?


    ANSWER


    A Blob must have a readability state, which is one of OPENED or CLOSED.


    A Blob that refers to a byte sequence, including one of 0 bytes, is said to be
    in the

    OPEN readability state.


    A Blob is said to be closed if its close method has been called. A Blob that is
    closed is said

    to be in the CLOSED readability state.


    # Q. What are different states of FileReader?


    ANSWER


    The FileReader object can be in one of 3 states. The readyState attribute, on
    getting, must

    return the current state, which is one of the following values:


    **EMPTY** : The FileReader object has been constructed, and there are no pending
    reads.

    None of the read methods have been called. This is the default state of a newly
    minted

    FileReader object, until one of the read methods have been called on it.


    **LOADING** : A File or Blob is being read. One of the read methods is being processed,

    and no error has occurred during the read.


    **DONE** : The entire File or Blob has been read into memory, OR a file error
    occurred

    during read, OR the read was aborted using abort(). The FileReader is no longer
    reading a

    File or Blob. If readyState is set to DONE it means at least one of the read methods
    have

    been called on this FileReader.'
- md: "\n## Chapter 13 Web RTC\n\nQ. What is Web RTC?\n\nANSWER\n\nWeb RTC provides\
    \ the capability to browsers for real time communication without any additional\
    \ plugin installed. It involves audio, video and other type of data streaming\
    \ among the browser with their native capability.\n\nQ. What is the API implemented\
    \ by Web RTC?\n\nANSWER\n\nWeb RTC implements three different API. These interfaces\
    \ are listed below.\n\n- MediaStream: This represents a synchronized media stream\
    \ using camera and microphone.\n- RTCPeerConnection: This interface is responsible\
    \ for stable connection between peer browser during real time communication.\n\
    - RTCDataChannel: This interface is responsible for other type of data communication\
    \ between peer browser. For example the remote desktop sharing using browser.\n\
    \nQ. What is MediaStream?\n\nANSWER\n\nMediaStream basically represents the stream\
    \ captured by Camera and microphone. Each MediaStream has an input which captures\
    \ the stream. This MediaStream can be accessed navigator.getUserMedia() method.\n\
    \nQ. What are the input parameters to getUserMedia()? ANSWER\n\nThe getUserMedia()\
    \ method takes 3 parameters as input. These parameters are as follows:\n\n- Constraint\
    \ Object similar to a configuration object.\n- Success Callback Method.\n- Error\
    \ Callback Method.\n\nQ. What are MediaStreamTracks?\n\nANSWER\n\nThe MediaStream\
    \ returned by getUserMedia() has 2 methods getAudioTracks() and getVideoTracks().\
    \ Both of these methods returns an array of MediaStreamTracks.\n\nQ. What are\
    \ the protocols used by Web RTC for communication?\n\nANSWER\n\nWeb RTC uses 2\
    \ different protocols for communication. These 2 protocols are listed as follows.\n\
    \n- DTLS: Datagram Transport Layer Security.\n- SRTP: Secure Real-time Transport\
    \ Protocol.\n\nQ. How to view the statistics of an progress Web RTC session in\
    \ Chrome browser?\n\nANSWER\n\nWe can view the details statistics and charts of\
    \ an ongoing Web RTC session in chrome browser using chrome://webrtc-internals/\
    \ in chrome browser.\n\n## Q. What are the different event handlers for a channel?\
    \ ANSWER\n\nA channel has 4 different event handlers. These event handlers are\
    \ as follows.\n\n- Onopen: Executed when the connection is established.\n- Onerror:\
    \ Executed if there is an error creating the connection.\n- Onmessage: When you\
    \ receive a message, this method will execute.\n- Onclose: Executed if the other\
    \ peer closes the connection.\n\n## Q. What is a signal channel? ANSWER\n\nWebRTC\
    \ can't create connections without some sort of server in the middle. We call\
    \ this the Signal Channel.\n\n## Q. What is an ICE technique? ANSWER\n\nInteractive\
    \ Connectivity Establishment (ICE) is a technique used in computer networking\
    \ involving network address translators (NATs) in Internet applications of Voice\
    \ over Internet Protocol (VoIP), peer-to-peer communications, video, instant messaging\
    \ and other interactive media.\n\n## Q. What is an ICE Candidate? ANSWER\n\nWhile\
    \ communication peers must exchange information about the network connection.\
    \ This is known as an ICE candidate.\n\n## Q. What are the server side functionalities\
    \ needed by the Web RTC? ANSWER\n\nWeb RTC requires following functionalities\
    \ from server side to create a communication between peers.\n\n- User discovery\
    \ and communication.\n- Signaling.\n- NAT/firewall traversal.\n- Relay servers\
    \ in case peer-to-peer communication fails.\n\n## Q. What is STUN protocol? ANSWER\n\
    \nSTUN (Session Traversal Utilities for NAT) is a standardized set of methods\
    \ and a network protocol to allow an end host to discover its public IP address\
    \ if it is located behind a NAT.\n\n## Chapter 14 Drag & Drop API\n\nQ. How to\
    \ make content draggable inside the browser? ANSWER\n\nHTML5 provides drag and\
    \ drop feature. An element can be made draggable by setting its draggable property\
    \ to true. Check the below code having 2 buttons. One button is draggable and\
    \ other is just a normal button.\n\n```html\n<! html>\n<html>\n<head>\n<title>Draggable\
    \ Element</title>\n</head>\n<body>\n<button draggable=\"true\">Draggable Button</button>\
    \ <button>Normal Button</button>\n</body>\n</html>\n```\n\nBelow screenshot shows\
    \ both these buttons. The draggable button is movable while the normal button\
    \ is fixed in its position.\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_72_0.png)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>...</head>\n<body>\n<button draggable=\"\
    true\">Draggable Button</button>\n<button>Normal Button</button>\n</body>\n</html>\n\
    ```\n\nQ. What happens when drag starts for an element? ANSWER\n\nThere are 3\
    \ important key points to note when a drag starts. These key points are as follows.\n\
    \n- **Drag Data**: It represent the type of data that will be transferred while\
    \ dragging.\n- Drag Feedback: This image which appears beside the mouse pointer\
    \ during the drag operation.\n- Drag Effect: This represents the type of drag\
    \ happens to element. It can be 3 types and listed below.\n    - * Copy: This\
    \ effect indicates that the data will be copied from its present location to the\
    \ drop location.\n    - * Move: This effect indicates that the data being dragged\
    \ will be moved from its original position to drop location.\n    - * Link: This\
    \ effect indicates that some form of relationship or connection will be created\
    \ between the source and drop locations.\n\n## Q. What are the Drag and drop events?\
    \ ANSWER\n\nThere are 7 different drag and drop events that can be attached with\
    \ a callback method programmatically.\n\n- Dragstart: it is fired on an element\
    \ when a drag is started.\n- Dragenter: it is fired when the mouse enters an element\
    \ while a drag is occurring.\n- Dragover: This event is fired as the mouse is\
    \ moving over an element when a drag is occurring.\n- Dragleave: This event is\
    \ fired when the mouse leaves an element while a drag is occurring.\n- Drop: The\
    \ drop event is fired on the element where the drop occurred at the end of the\
    \ drag operation.\n- Dragend: The source of the drag will receive a dragend event\
    \ when the drag operation complete, whether it was successful or not.\n\n## Q.\
    \ What is a dataTransfer property? ANSWER\n\ndataTransfer object holds the piece\
    \ of data sent in a drag action. dataTransfer is set in the dragstart event and\
    \ read/handled in the drop event. The syntax for setting value in dataTransfer\
    \ object is as follows.\n`event.dataTransfer.setData(format, data),`\n\nThe above\
    \ syntax will set the object's content to the mime type and data payload passed\
    \ as arguments.\n\n## Q. Develop an example to drag and drop an element from one\
    \ place to another? ANSWER\n\nTo demonstrate drag and drop we have created div\
    \ element with rounded border and background color red. We will drag this element\
    \ and drop it in a container. The following code shows the drag and drop example.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n#ball {\nwidth: 50px;\nheight:\
    \ 50px;\nbackground-color: red;\n}\n#dropZone {\nwidth:200px;\nheight:100px;\n\
    padding:10px;\nborder:1px solid #aaaaaa;\n}\n</style>\n</head>\n<body>\n<div id=\"\
    dropZone\"\nondrop=\"drop(event)\" ondragover=\"allowDrop(event)\">\n</div>\n\
    <br>\n<div id=\"ball\"\ndraggable=\"true\"\nondragstart=\"drag(event)\"></div>\n\
    <script>\nfunction allowDrop(ev) {\nev.preventDefault();\n}\nfunction drag(ev)\
    \ {\nev.dataTransfer.setData(\"text\", ev.target.id);\n}\nfunction drop(ev) {\n\
    ev.preventDefault();\nvar data = ev.dataTransfer.getData(\"text\");\nev.target.appendChild(document.getElementById(data));\n\
    }\n</script>\n</body>\n</html>\n```\n\nThe output of the code looks like following\
    \ screenshot before dragging with both the element are in there original position.\n\
    \n![](img/beb9e4e69c3f782541f09594e1aab75e_75_0.png)\n\nThe output of the code\
    \ looks like following screenshot after dragging and dropping the element to container.\n\
    \n![](img/beb9e4e69c3f782541f09594e1aab75e_75_1.png)\n\n## Chapter 15 App Cache\n\
    \nQ. What is app cache? What are the benefits of using app cache in a web application?\
    \ ANSWER\n\nApp cache API is the new feature provided by the HTML5. This API power\
    \ up a web application working without internet connection. The most important\
    \ benefits by this API are listed below:\n\n- Speed: Like all other cache it increases\
    \ the speed of the page.\n- Offline browsing: It increases the usability of application\
    \ as it can be accessed without internet.\n- Reduced load: As the content and\
    \ data is now cache in the browser the load of the application is reduced form\
    \ the server.\n- Few network calls: As most of reusable content is present in\
    \ app cache this reduces the no network call to the server.\n\nQ. How to enable\
    \ application cache in an html file? ANSWER\n\nTo enable application cache in\
    \ a HTML file we need to have manifest attribute in <HTML> element. The syntax\
    \ of declaring application cache in HTML file is as follows.\n\n```html\n<DOCTYPE\
    \ HTML><html manifest=\"filename.appcache\">\n```\n\nQ. What is the media type\
    \ of app cache? ANSWER\n\nA manifest file needs to have text/cache-manifest media\
    \ type.\n\nQ. What are the 3 different section of manifest file? ANSWER\n\nA manifest\
    \ file has 3 sections. These 3 different sections are as follows.\n\n- CACHE MANIFEST:\
    \ Files listed under this header will be cached after they are downloaded for\
    \ the first time.\n- NETWORK: Files under this header require a connection to\
    \ the server, and will never be cached.\n- FALLBACK: Files listed under this header\
    \ specifies fallback pages if a page is inaccessible.\n\nQ. What is NETWORK section?\
    \ ANSWER\n\nNETWORK is one of the sections in manifest file. The file name listed\
    \ in the NETWORK section is never cached locally. The following code shows a sample\
    \ of NETWORK section.\nNETWORK:login.html\n\nQ. What is FALLBACK section? ANSWER\n\
    \nFALLBACK is one of the sections in manifest file. In this section we can mention\
    \ the file name which will be called when application is offline. The following"
  mdcn: "\n\n## 第 13 章 Web RTC\n\nQ. 什么是 Web RTC？\n\n答案\n\nWeb RTC 为浏览器提供了无需安装任何额外插件即可进行实时通信的能力。它涉及浏览器之间通过原生能力进行音频、视频和其他类型的数据流。\n\
    \nQ. Web RTC 实现了哪些 API？\n\n答案\n\nWeb RTC 实现了三个不同的 API。这些接口列在下方：\n\n- MediaStream:\
    \ 它代表一个使用摄像头和麦克风的同步媒体流。\n- RTCPeerConnection: 该接口负责在实时通信期间在两个对等点浏览器之间建立稳定连接。\n\
    - RTCDataChannel: 该接口负责对等点浏览器之间其他类型的数据通信。例如使用浏览器进行远程桌面共享。\n\nQ. 什么是 MediaStream？\n\
    \n答案\n\nMediaStream 基本上代表由摄像头和麦克风捕制的流。每个 MediaStream 都有一个用于捕获流的输入。可以通过 `navigator.getUserMedia()`\
    \ 方法访问此 MediaStream。\n\nQ. `getUserMedia()` 的输入参数是什么？答案\n\n`getUserMedia()` 方法接收\
    \ 3 个参数作为输入。这些参数如下所示：\n\n-  约束对象（Constraint Object）：类似于配置对象。\n- 成功回调方法（Success\
    \ Callback Method）。\n- 错误回调方法（Error Callback Method）。\n\nQ. 什么是 MediaStreamTracks？\n\
    \n答案\n\n`getUserMedia()` 返回的 MediaStream 具有两个方法：`getAudioTracks()` 和 `getVideoTracks()`。这两个方法都返回一个\
    \ `MediaStreamTracks` 数组。\n\nQ. Web RTC 通使用了哪些协议？\n\n答案\n\nWeb RTC 使用 2 个不同的协议进行通信。这\
    \ 2 个协议如下：\n\n- DTLS: 数据报传输层安全（Datagram Transport Layer Security）。\n- SRTP: 安全实时传输协议（Secure\
    \ Real-time Transport Protocol）。\n\nQ 如何在 Chrome 浏览器中查看 Web RTC 会话的统计信息？\n\n答案\n\
    \n我们可以使用 Chrome 浏览器中的 `chrome://webrtc-internals/` 查看正在 Web RTC 会话的详细统计和图表。\n\n\
    ## Q. 通道的不同事件处理器有哪些？答案\n\n通道有 4 个不同的事件处理器。这些事件处理器如下：\n\n- Onopen: 当连接建立时执行。\n\
    - Onerror: 如果创建连接时出错则执行。\n- Onmessage: 当你收到消息时，将执行此方法。\n- Onclose: 如果对方关闭连接则执行。\n\
    \n## Q. 什么是信号通道？答案\n\nWebRTC 在没有中间某种服务器的情况下无法创建连接。我们称之为信号通道（Signal Channel）。\n\
    \n## Q. 什么是 ICE 技术？答案\n\n交互式连接建立（ICE）是计算机网络中的一项技术，涉及在互联网应用中的 IP 语音协议（VoIP）、点对点通信、视频、即时消息和其他交互式媒体中的网络地址转换器（NAT）。\n\
    \n## Q. 什么是 ICE 候选者？答案\n\n通信双方必须交换关于网络连接的信息。这被称为 ICE 候选者（ICE candidate）。\n\n##.\
    \ Web RTC 需要哪些服务器端功能？答案\n\nWeb RTC 需要服务器端功能来创建对等点之间的通信：\n\n- 用户发现与通信。\n- 信令（Signaling）。\n\
    - NAT/防火墙穿透。\n- 对等点通信失败时的中继服务器（Relay servers）。\n\n## Q. 什么是 STUN 协议？答案\n\nSTUN（NAT\
    \ 会话遍历工具）是一套标准化的方法和网络协议，允许位于 NAT 后的终端主机发现其公网 IP 地址。\n\n## 第 14 章 拖放 API\n\nQ.\
    \ 如何让浏览器内的内容可拖拽？答案\n\nHTML5 提供了拖放功能。通过将元素的 `draggable` 属性设置为 `true`，可以使其变为可拖拽。查看下方包含\
    \ 2 个按钮的代码。其中一个按钮是拖拽的，另一个只是普通按钮。\n\n```html\n<! html>\n<html>\n<head>\n<title>Draggable\
    \ Element</title>\n</head>\n<body>\n<button draggable=\"true\">Draggable Button</button>\
    \ <button>Normal Button</button>\n</body>\n</html>\n```\n\n下方的截图显示了这两个按钮。可拖拽的按钮是可以移动的，而普通按钮固定在它的原位置。\n\
    \n![](img/beb9e4e69c3f782541f09594e1aab75e_72_0.png)\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>...</head>\n<body>\n<button draggable=\"true\">Draggable Button</button>\n\
    <button>Normal Button</button>\n</body>\n</html>\n```\n\nQ. 当元素开始拖拽时会发生什么？答案\n\
    \n在拖拽开始时，有 3 个重要的关键点需要注意。这些关键点如下：\n\n- **拖拽数据（Drag Data）**: 它代表拖拽过程中将传输的数据类型。\n\
    - 拖拽反馈（Drag Feedback）：拖拽操作期间鼠标指针旁边出现的图像。\n- 拖拽效果（Drag Effect）：代表发生在元素上的拖拽类型。它可以是\
    \ 3 类型，列如下：\n    - *复制（Copy）*: 此效果表示数据将从当前位置复制到释放位置。\n    - *移动（Move）*: 此效果表示正在拖拽的数据将从原始位置移动到释放位置。\n\
    \    - *链接（Link）*: 此效果表示源位置和释放位置之间将创建某种形式的关系或连接。\n\n## Q. 哪些是拖放事件？答案\n\n有 7 个不同的拖放事件，可以通过编程方式与回调方法挂载。\n\
    \n- Dragstart: 当拖拽开始时，在元素上触发。\n- Dragenter: 在拖拽过程中，鼠标进入元素时触发。\n- Dragover: 在拖拽过程中，鼠标在元素上移动时触发此事件。\n\
    - Dragleave: 当鼠标离开元素时触发此事件。\n- Drop: 当释放拖拽时触发此事件。\n- Dragend: 当拖拽结束时触发此事件。\n\n\
    ## Q. 什么是 dataTransfer 对象？答案\n\n`dataTransfer` 对象用于在拖拽过程中存储数据。它包含 `setData` 和\
    \ `getData` 等方法。\n\n"
