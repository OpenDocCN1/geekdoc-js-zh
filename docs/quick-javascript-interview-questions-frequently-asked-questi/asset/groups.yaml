    \n# Chapter 11 Local Storage\n\nQ. What is local storage?\n\nANSWER\nHTML5 provides\
    \ a feature to store data locally in end user’s browser. Data is stored in the\
    \ browser as key-value pair. Unlike cookie it has average space of 5 MB. This\
    \ storage comes in 2 different type sessionStorage and localStorage.\n\nlocalStorage\
    \ : it stores data with no expiration date. sessionStorage : it stores data with\
    \ an expiration date.\n\nQ. Which one is the main interface?\n\nANSWER\nwindow.Storage()\
    \ is the main interface from where the localStorage and sessionStorage are implemented.\
    \ This interface has the below definition.\n\n```javascript\ninterface Storage\
    \ {\nreadonly attribute unsigned long length;\nDOMString? key(unsigned long index);\n\
    getter DOMString? getItem(DOMString key);\nsetter void setItem(DOMString key,\
    \ DOMString value); deleter void removeItem(DOMString key);\nvoid clear();\n```\n\
    \nThe details of the above code are as follows:\n- setItem(key,value) : This methods\
    \ stored the value in storage using key-value pair.\n- getItem(key) : This method\
    \ retrieves the stored object using the key.\n- removeItem(key) : This method\
    \ removes the stored item based on the key.\n- clear() : Deletes all the items\
    \ from the storage.\n- length : This property returns the length of the storage,\
    \ no of elements inside the storage.\n- key(position) : This method returns the\
    \ key for the value in the numeric position.\n\nQ. How to store and retrieve an\
    \ object in local storage?\nANSWER\nLocal storage provides setItem() and getItem()\
    \ for storing and retrieving an object from the storage. setItem(key, value) method\
    \ takes 2 parameter to store the object. The getItem(key) method retrieves the\
    \ value using key as parameter. Below code shows the storing “Sandeep Kumar” string\
    \ in “myName” key and then retrieves this string place it in a HTML element.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div id=\"resultContainer\">\n</div>\n\
    <script>\nvar container = document.getElementById(\"resultContainer\");\nlocalStorage.setItem(\"\
    myName\", \"Sandeep Kumar\"); \ncontainer.innerHTML = localStorage.getItem(\"\
    myName\"); \n</script>\n</body>\n</html>\n```\n\nBelow screenshot shows the chrome\
    \ developer storage preview which holds the above-object as key and value pair.\n\
    \n![](img/beb9e4e69c3f782541f09594e1aab75e_63_0.png)\n\n# Sandeep Kumar\n\n- Elements\
    \ Network Sources Timeline Profiles\n\n| | Key | Value |\n|---|---|---|\n| Frames\
    \ | myName | Sandeep Kumar |\n| Web SQL | | |\n| IndexedDB | | |\n| Local Storage\
    \ | | |\n| http://127.0.0.1:51792 | | |\n| Session Storage | | |\n| Cookies |\
    \ | |\n| Application Cache | | |\n\nQ. How to attach an event to a local storage?\n\
    \nANSWER\nWhen local storage objects get modify a storage event is fired. A callback\
    \ method can be attached to window object using addEventListener() or attachEvent()\
    \ method.\n\nNOTE:\nWhen the setItem(), removeItem(), and clear() methods are\
    \ called on a Storage area that is associated with a local storage area, if the\
    \ methods did something, then in every Document object whose Window's localStorage\
    \ attribute's Storage object is associated with the same storage area, other than\
    \ x, a storage event must be fired.\n\nIn simple sentence, a storage event is\
    \ fired on every window/tab except for the one that updated localStorage object\
    \ caused the event. Below code has a callback method listening storage event.\
    \ When the button is clicked in one of the tab to update the local storage object\
    \ the storage event listener in the other tab got triggered and content is updated.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div id=\"resultContainer\"></div>\n\
    <button onclick=\"update()\">Click Me</button> \n<script>\nvar container = document.getElementById(\"\
    resultContainer\"), \nmethodStorageEvent = function(event) {\n  container.innerHTML\
    \ = \"Event Fired\" + localStorage.getItem(\"myName\"); \n},\ncounter = 1,\nupdate\
    \ = function(){\n  localStorage.setItem(\"myName\", ++counter);\n};\nwindow.addEventListener(\"\
    storage\", methodStorageEvent);\n</script>\n</body>\n</html>\n```\n\nBelow screenshot\
    \ demonstrates how the storage event is fired.\n\n![](img/beb9e4e69c3f782541f09594e1aab75e_64_0.png)\n"
