    # Chapter 1 Inheritance


    Q. How to create a class?


    ANSWER


    JavaScript does not have a class definition. To mimic classes in JavaScript functions
    can be used to declare a class.


    Example :


    Let''s create a student in JavaScript which takes two parameters name and roll
    as property. The code will look like below,


    ```

    function Student(name,roll){ this.name = name;

    this.roll = roll;

    }

    ```


    Q. How to create an object?


    ANSWER


    An object in JavaScript can be created using two ways:


    New Keyword:


    To create a student object from the above student class we can call the Student
    function using new keyword.


    var student1 = new Student(''sandeep'',2)


    Anonymous Object:


    Anonymous objects can be created using pair of curly braces containing property
    name and value pairs.


    Var rose = {''color'': ''red''}


    Q. How to declare a private and a public member?


    Private members are declared using var keyword and constructor function.


    ```

    function Student(name,roll){ var id= ABCD123;

    this.name = name;

    this.roll = roll;

    }

    ```


    When a Student object will be created the proprietied name and roll will be accessible
    using dot operator but id will not be accessible as it behaves as a private member
    and return undefined on call.'
