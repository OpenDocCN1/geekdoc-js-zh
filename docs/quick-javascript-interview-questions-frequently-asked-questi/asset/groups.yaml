  - "[PAGE 24]\n\n# Chapter 4 Questions on JSON\n\nQ. What is JSON ?\n\nANSWER\n\n\
    The JSON text format is syntactically identical to the code for creating JavaScript\
    \ objects. JSON is only a subset of JS object literal notation, but apart from\
    \ looking similar, they have nothing in common. JSON is used as data exchange\
    \ format, like XML. JSON is built on two structures:\n\nA collection of name/value\
    \ pairs. In various languages, this is realized as an object, record, dictionary,\
    \ hash table, key list, or associative array. An ordered list of values. In most\
    \ languages, this is realized as an array, vector, list, or sequence.\n\nQ. Why\
    \ does Google prepend (1); to their JSON responses? \n\nIt prevents JSON hijacking.\
    \ This is to ensure some other site can't nasty tries try to steal data. By replacing\
    \ the array constructor, including this JSON URL via a <script> tag, a malicious\
    \ thirdparty site could steal the data from the JSON response. By putting while(1);\
    \ at the start, the script will crash. A same-site request using XHR and a separate\
    \ JSON parser, on the other hand, can easily ignore the while(1); prefix.\n\n\
    Q. What is JSON ?\n\nANSWER\n\nJSON stands for \"JSON with Padding\". It means\
    \ JSON data wrapped in a function call. A callback (processing/padding) function\
    \ already defined in the Web page at the time of requesting remote JSON data.\n\
    \nExample\n\n```\nThe below JavaScript code shows a callback function paddingFunction()\
    \ for a remote URL /abcdl.\nfunction paddingFunction(data){\nconsole.log(\"response\
    \ data processing\")\n}\nvar script = document.createElement('script');\nscript.src\
    \ = '/abcdl?callback=paddingFunction'\ndocument.getElementsByTagName('head')[0].appendChild(script);\n\
    ```\n\nQ. Why use JSON over XML ?\n\nANSWER\n\nThe following points are in favor\
    \ of JSON over XML format:\nJSON can contain Integer, String, List, Arrays. XML\
    \ just nodes and elements that needs to be parsed into Integer, String and so\
    \ before it is used by your application. JSON is smaller, faster and lightweight\
    \ compared to XML. So for data delivery between servers and browsers, JSON is\
    \ a better choice.\n\nJSON is best for use of data in web applications from web\
    \ services supports of JavaScript The overhead of parsing JSON nodes is more compare\
    \ to a quick look up in JSON.\n\nFor a newbie, JSON might look complex to read\
    \ and understand because of its structure"
