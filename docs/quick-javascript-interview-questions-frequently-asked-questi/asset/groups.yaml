    \n**Capturing Phase:**\nin this phase, event first makes its way downwards from\
    \ the DOCUMENT to the target element by passing all inner elements.\n\n**Bubbling\
    \ Phase:**\nin this phase makes its way upwards from the target element to DOCUMENT\
    \ by passing all outer elements.\n\n## Q. How to attach event to an element?\n\
    \nANSWER\nAccording to DOM Level 2 Event Specification an event can be attached\
