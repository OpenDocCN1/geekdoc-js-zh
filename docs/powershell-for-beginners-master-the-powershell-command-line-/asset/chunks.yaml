    关于命令的一些信息，所有命令后面都紧跟着一个参数。这是一个强制性公式。参数是在输入命令或小程序（cmdlet）后输入的单词、短语或符号，用于识别 shell
    被要求检索或搜索的项。


    对于 `Get-Help` 或 `Help` 小程序，参数是名称参数（name parameter）。这意味着当向帮助系统请求帮助时，只需输入你想让其提供信息的主题名称即可。


    例如，任务是清除“事件日志”。你希望通过 `Help` 查询 `run` 命令或小程序以了解如何完成清除“事件日志”。


    在控制台上输入 `Help` 空格 `log` 或 `Help` 空格 `event`。添加通配符符号 `*`，因为你正正在搜索所有可能的选项。如果不添加通配符符号
    `*`，结果将受到限制。它应该是这样的：


    `Help *log*`


    `Help *event*`


    结果列表将出现在控制台屏幕上。见下图 3.3。


    ![](img/00008.jpeg)


    图 3.3


    注意列表中的所有项目都指向事件日志主题。其中十一个是实际的命令运行或小程序，其余的是函数。现在选择最符合你要求的项。顶部的项目 `Clear-Eventlog`
    看起来是最佳选择。现在你拥有了准确的小程序来向 `Help` 查询该主题的信息：`Help Get-Eventlog`。在向 `Help` 查询其他小程序的信息时，遵循相同的公式。


    ### Tab 键补全 (Tab Completion)


    我们在前面的章节中讨论过这一点。再次提醒大家养成在控制台输入时按 Tab 键的习惯。Tab 补全允许你将输入的单词完成为最匹配的项。它显示了 shell 中可用的许多命令、函数、脚本选项。它增加了你对
    shell 内部内容的了解。如果 Tab 生成的信息不准确，没有必要输入另一个单词，只需再次按 Tab 键，它将循环显示选项。当 Tab 显示准确单词时停止。Tab
    补全让工作变得更加简单快捷。


    ### 通配符 (Wildcard)


    与 Tab 补全类似，`*` 通配符符号可以完成你要求 `Help` 提供信息的整个单词。只需在字母后添加 `*` 通配符符号，`Help` 就能将范围缩小到搜索的精确帮助主题。


    例如，在控制台上输入 `Help EventL*`。你会发现 `Help` 并没有像你输入 `Help log` 或 `Help event` 那样遍历它系统中所拥有的所有可能的事件日志项。相反，它直接进入了
    `EventLog` 的帮助文件。`*` 通配符符号直击主题并将你直接带到该主题。


    ### 摘要帮助 (Summary Help)


    如果你输入了 `Help EventL*`，那么下面的控制台屏幕应该是这样的。


    ![](img/00009.jpeg)


    图 3.4


    图 3.4 是摘要帮助。它描述了命令的名称。在这种情况下为 `Get-EventLog`。它提供了关于命令语法的信息。语法是命令的使用方法。


    ### 解释帮助文件 (Interpret a Help File)


    查看图 3.4 提供的摘要帮助，注意语法下方有 2 组不同的参数集。这意味着根据所选的参数集，运行此特定命令有 2 种独特方法。参数是包含在 `[ ]` 方括号中的所有项。


    两个参数集都以 `Get-EventLog` 开头。这就是我们识别有 2 组参数的方法。第一组的参数比第二组多。注意这 2 组参数还有一个共同的参数。它们都有
    `[Computer Name]` 参数。相反，总会有仅存在于一个参数集的特殊参数。`[AsString]` 和 `[List]` 是较短参数集中的唯一参数。较长参数集中的几个参数在较短的参数集中是找不到的。


    具有 2 组参数集的命令意味着只要你只使用共享参数，就可能使用两组参数来运行命令。如果你使用了仅存在于其中一个参数集的特殊参数（在上面的示例中，为 `[AsString]`），那么你就只能局限于使用该参数集中的参数。为了与多个参数集协同工作并访问更大的参数池，最好避免使用不被多个参数集共享的唯一参数。


    ### 不同类型的参数 (Different Types of Parameters)


    让我们来定义并区分参数，以更好地理解它们的功能。


    - **强制性参数 (Mandatory Parameters)**：任何不在 `[ ]` 方括号内的参数都是强制性的。在图 3.4 中，`string`
    是一个强制性参数。

    - **可选参数 (Optional Parameters)**：这些是 `[ ]` 括号中的参数。运行命令并不强制要求使用集合中的每个参数。事实上，大多数参数都是可选的，因为信息可以由系统提供。注意，在图
    3.4 的短参数集中，所有参数都是可选的。

    - **位置参数 (Positional Parameters)**：某些参数出现在所有的语法字符串中，因此不需要在每次运行命令时都输入它们。这些就是位置参数。在图
    3.4 中，位置参数是 `[InstanceId]`，因为它在另一组 `[ ]` 括号内含有一个 `[ ]` 方括号。这意味着你可以保留该参数，但必须为位置
    `<long[]>` 添加值。


    ### 参数值 (Parameter Values)


    关于理解参数值或参数运行命令时所需的输入的信息，请参考下方的图 3.5：


    ![](img/000010.jpeg)


    图 3.5 参数值


    首先是开关（switches）。开关是一个独立的、不需要值的参数。在图 3.5 中开关的示例是 `[AsString]`。在处理的完整语法时，开关会被明确标记为开关，以便管理员知道不要为其提供值。


    对于需要值输入的参数，其识别方式如下：

    1. 参数位于 `[ ]` 方括号内，并与其他参数隔开。例如：`[LogName] <string>`


    对于独立不需要值的参数，其识别方式如下：

    1. 参数后跟着等号、冒号、方括号等。例如：`[AsString]`


    ### 参数值的类型 (Types of Parameter Values)


    1. **DateTime**：可以视为日期的参数值。因此预期是一个数字字符串。例如 `12-01-2012`。DateTime 通常计算机的区域设置。

    2. **String**：字母和数字的组合。如果字符串之间有空格，应用引号括。

    3. **Int, Int64, Int32**：`Int` 代表整数。不是小数，而是整数。


    ### 为带有 [ ] 方括号的字符串添加值


    `[ComputerName <string>]`


    上述示例中的 `[ ]` 方括号意味着参数可以添加字符串数组或列表。例如：


    **单个值：**

    `Get –EventLog Security –computer Station-A2`


    **多个值：** 每个值之间应用逗号隔开，且中间没有空格。

    `Get –EventLog Security –computer Station-A2,AB5,Files02`


    **带有空格的多个值：** 应用引号括起来：

    `Get –EventLog Security –computer “Station-A2”, “AB5”, “Files02”`


    **文本文件值：** 这些值应每行输入。

    `Get –EventLog Security –computer Station-A2`, `Files02`, `Files07`, `Files30`,
    `AB5`, `AB8`


    如果你想读取文件内容，最有效的方法是通过 `Get-Content` 小程序强制 PowerShell 显示内容。下面的语法正是这样做的。注意获取内容的命令在括号中。那个符号可以让
    PowerShell 在给定的参数内执行命令。


    ```

    Get –EventLog Security –computer (Get-Content names.txt)

    ```

