    3. 输入 Set-Execu 然后按 Tab 键，添加空格和破折号 (`-`)，多次按 Tab 键。此时 PowerShell 将在参数之间循环切换。再次按
    Esc 键清除控制台。


    你刚刚学习了 Tab 补全的重要性。按下 Tab 键会生成 Shell 中可用的各种选项。它为用户提供关于 Shell 内部的各种命令、函数或参数名称的信息。


    ### Intellisense（智能感知）


    出现在 PowerShell ISE 控制台右侧的弹出菜单被称为 Intellisense。见下图 2.4。在菜单上向上或向下滚动以查找查找要搜索的项目，然后按
    Tab 键并继续输入以获取所需的信息或结果。


    ![](img/00004.jpeg)


    图 2.4 Intellisense


    **注意**：我们如何强调都不为过：在操作 PowerShell 控制台时，输入的准确性是需要掌握的最重要技能。曾出现过由于简单的拼写错误导致整个系统失效的情况。为了确保
    PowerShell 控制台的功能正常运行，在输入每个字符时最好保持非常警惕和谨慎。双击单词和符号是必须的。


    ### 如何确认你的 PowerShell 版本


    让我们确保计算机实际上至少运行在 V3 版本的 PowerShell 上。在控制台上输入此命令：`$PSVersionTable`


    ![](img/00005.jpeg)


    图 2.5 PowerShell V3 详细信息


    控制台上应出现上述图 2.5 所示。`PSVersion` 项目的值应显示为 `3.0` 或更高。如果没有显示该值，你至少需要升级或下载 V3 版本。该表还提供了该版本所兼容的所有
    PowerShell 相关技术的信息。


    ### PowerShell 实验室


    让我们通过几次控制台配置测试，以确保你的控制台属性已为后续课程做好了准备：


    1. 根据你的要求自定义控制台颜色。

    2. 根据你的要求自定义字体。但请记住，我们推荐的字体是 Lucida 字体，大小应比默认字体大小 `12` 大。如果有其他偏好且 `Lucida` 不满意，你可以选择不同的字体。

    3. 检查字符和符号的可读性。输入单引号（‘`）和反引号（` ` `）。检查你是否能区分两者。

    4. 输入括号 (`()`)、方括号 (`[]`)、角括号 (`<>`)、大括号 (`{}`)。确保符号易于识别。如果不是，请更改字体或增大字体大小，以便它们易于阅读。


    如果你已经完成了测试并对 PowerShell 控制台的外观满意，那么是时候进入下一章了。


    # 第 3 章：使用帮助系统发现命令


    本书不会对所有可能被提出的 PowerShell 问题提供所有答案。本书的目标是为管理员提供相关信息，说明 Shell 如何作为命令行实用程序运行，以便更好地理解其功能。本书希望确保
    PowerShell 是一个在通过命令运行来自动化和管理集成 Windows 系统时的有用工具。


    本书并不是一本包含所有答案的手手册。因此，我们强烈建议你专家并详细地掌握 PowerShell 最重要的发现功能——帮助系统。


    PowerShell 帮助系统提供了 Windows PowerShell 函数、脚本、模块以及 cmdlet（组合命令）或命令的详细说明。它能够解释 Windows
    PowerShell 语言的复杂之处，并解释每个 PowerShell 项目、符号、字符和元素的概念。


    我们建议你亲近帮助系统，花尽可能的时间与它相处，并真正了解帮助系统能提供的最细微的细节和最小的信息。如果你在帮助系统上投入了高质量的时间，它将回报你关于所有
    PowerShell 复杂且非常有用的细节的近专家级知识，让你成为真正的 PowerShell 魔法师。此外，拥有 PowerShell 的专家知识意味着每个
    PowerShell 用户的生活变得更轻松。它字面上拥有任何任何 PowerShell 问题的答案。


    不知道某个任务的命令？帮助系统会告诉你。不理解某些术的定义？帮助系统有答案。在获取命令的准确语法方面遇到困难？帮助系统知道每个命令的语法。想创建一个命令字符串但不知道如何做？帮助系统可以引导任何人按照正确将多个命令连接在一起的步骤进行操作。


    是的，你没错。帮助系统就是 PowerShell 系统手册。因此，从头到尾阅读它以充分理解 Shell 的工作原理是明智之举。这是让使用体验变得愉快且高效的唯一途径。否则，你会陷入困境。所以不要不要固执，要做一个聪明的
    PowerShell 用户。阅读帮助系统。掌握帮助系统。


    ## 更新帮助系统


    现在我们已经知道帮助系统对 PowerShell 用户有多重要了，现在是时候获取副本了。是的，帮助系统并没有预装在 PowerShell 中。这是因为它频繁更新。实际上，更新频率之，以至于让用户在购买
    PowerShell 后安装帮助系统版本更为实用。这样他们就能在购买当天获得最新版本的帮助系统。


    更新帮助系统应该是获取 Windows PowerShell 后的首要任务。这是在开始使用 Shell 进行任何工作之前要完成的第一项任务。


    那么让我们来尝试一下。一个重要的提醒——在控制台上输入 `Update Help` 命令之前，请确保检查你是否是以管理员身份运行 PowerShell。检查控制台的顶栏，它应该显示“Administrator:
    Windows PowerShell”。见图 3.1。


    ![](img/00006.jpeg)


    图 3.1


    如果显示的不是“Administrator”，请以管理员身份运行 Shell。只有在显示“Administrator”时，你才再次输入 `Update Help`
    命令。对于此任务，计算机连接互联网是重要的。输入 `Update Help` 后，给 PowerShell 一时间更新帮助系统。这需要几分钟。之后，你就可以继续使用
    PowerShell 了。


    **注意**：在 PowerShell 用户需要培养习惯中，每月更新帮助系统是最重要的。记住，PowerShell 会定期产生持续的新信息和功能。养成定期更新帮助的习惯。


    ### 请求帮助


    开始使用 PowerShell 帮助系统非常简单，在 PowerShell 控制台上输入 `Get-Help` 命令。你应该看到关于帮助系统的所有相关信息：描述、在线帮助、更新帮助、获取帮助。所有必要的命令函数也应该在页面上。见图
    3.2。


    ![](img/00007.jpeg)


    图 3.2


    某些来源建议使用 `Help` 或 `Man` 作为替代命令。两者都有效。它们产生与 `Get-Help` 相同的结果。


    ### 让帮助查找命令


    为了管理预期，帮助系统不提供关于系统中命令类型的信息。它知道自己的系统中有一系列帮助主题。然而，微软为它创建的每个命令都创建了帮助主题。因此，只要你知道自己在寻找什么命令，可以期待帮助系统的任何命令请求都能得到回答。


