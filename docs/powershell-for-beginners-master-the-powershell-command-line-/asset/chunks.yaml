- fmt: "\n1. `Verb–Noun format`: Every `cmdlet` or command will always, always have\
    \ a verb plus noun format.\n2. `The dash`: Every `cmdlet` or command noun should\
    \ be connected with a dash.\n3. `No space between`: Every `cmdlet` or command\
    \ shall never be separated by a space before or after the dash.\n\nRemember when\
    \ typing a command or `cmdlet` the format is: verb, dash, noun.\n\n## Parameters\
    \ Typing Rules\n\nThe same is true for typing parameters. Watch out for the all-important\
    \ space & dash. Here are the mandatory typing rules for parameters:\n\n1. All\
    \ parameters with no value get a dash in front of it.\n2. A `cmdlet` and a parameter\
    \ should have space between them.\n3. A parameter and another parameter after\
    \ it should have space between them.\n\n## PowerShell Laboratory\n\nHere are a\
    \ few test questions to refresh and practice the lessons for Chapter 4. If stumped\
    \ for answers look up online sources for a quick look.\n\n1. Gather a list together\
    \ of all `cmdlet` type of commands.\n2. Provide a list of 50 aliases.\n3. Find\
    \ out via `Help` more about Windows Firewall rules.\n\n## CHAPTER 5: Piping Function\n\
    \nThe great thing about running commands in PowerShell is its ability to string\
    \ together multiple sets of commands in a single neat syntax. In the previous\
    \ chapters we discussed everything there is to know about single commands. It\
    \ is now time to learn about how to bring together 2 or more sets of command syntax\
    \ to command the shell to work on multiple tasks.\n\nPiping is what we call this\
    \ ability of the shell to string together multiple commands. This is because the\
    \ `|` pipe symbol is placed in between each set of command syntax that are being\
    \ put together. It is referred to as the pipeline.\n\nThe pipeline serves as a\
    \ pathway for the previous command to pass through so that the next command can\
    \ receive it and have something to work on. The second command then does the same\
    \ thing. It passes through the pipeline so that the third command after it has\
    \ material to process.\n\nThe pipeline is actually one of the best and distinct\
    \ features of Windows PowerShell other command-run utilities are not equipped\
    \ with the same capability to run multiple commands in one syntax.\n\n## Comma-Separated\
    \ values (CSV) export\n\nLet’s say that the task is to get detailed information\
    \ on how a system’s CPU is being utilized and information on its memory. The multiple\
    \ command string for that would be:\n\n```\nGet-Process | Export-csv procs.csv\n\
    ```\n\nIn the syntax above there are 2 sets of commands. The first command is\
    \ `Get-Process` and the second command is `Export-csv procs.csv`.\n\nThe `Get-Process`\
    \ command is asking PowerShell to provide information on the computer’s processes.\
    \ For example: CPU utilization and computer memory.\n\nWhile the second command,\
    \ `Export-csv procs.csv`, is asking PowerShell to export to a CSV file via `|`\
    \ pipeline all of the `Get-Process` information on CPU utilization and memory.\n\
    \nLet’s type in only the command `Get-Process` on the shell. It should result\
    \ in figure 5.1 below.\n\n![](images/00017.jpeg)\n\nFigure 5.1\n\nThe set of information\
    \ on the table in Figure 5.1 tells of CPU utilization and systems memory use.\n\
    \nNow, to ask PowerShell to export it to a CSV file so that it can be transferred\
    \ to a Microsoft excel file for presentation purposes, type in the command run\
    \ below:\n\n```\nGet-Process | Export-csv c:\\procs.csv\n```\n\nLet’s look at\
    \ the detailed information on computer processes that the dual command `Get-Process\
    \ | Export-CSV` is able to provide by previewing the list on notepad.\n\nFigure\
    \ 5.2 should be the result on the console:\n\n![](images/00018.jpeg)\n\nFigure\
    \ 5.2\n\nThe first line distinguishes the information provided as ‘Systems Diagnostics\
    \ Process’. The second line identifies the nature of the information per table.\
    \ The third line provides a detailed listing of processes information running\
    \ in the computer. Above is the information extracted from the dual command-run\
    \ `Get-Process | Export-CSV c:\\procs.csv`.\n\nNow make sure to save that information\
    \ into a CSV file. Once that’s accomplished the file is ready to share with any\
    \ colleague who requires the information transferred to a presentation friendly\
    \ Microsoft excel file. \n\nIs it possible to import the CSV file to PowerShell?\
    \ Of course it is. Just type in `Import-CSV c:\\procs.csv` to the shell and the\
    \ result should look much the same way as in Figure 5.2.\n\n## Extensible Mark\
    \ Up Language (XML) Export\n\nAnother way to export and import files is via XML\
    \ or Extensible Mark Up Language. Some administrators prefer using XML because\
    \ it is not a flat file like CSV and more often than not it generates a richer\
    \ array of information than CSV.\n\nTo export an XML file the command run is much\
    \ the same except the 2nd command run is different:\n\n```\nGet-Process | Export-cliXML\
    \ C:\\procs.csv\n```\n\nTo import the file the command run should be:\n\n```\n\
    Get-Process | Import-cliXML C:\\procs.csv\n```\n\nSuggest testing the XML export\
    \ command run for familiarity’s sake. Make sure to run the import XML command\
    \ also and check the result on the Notepad to see if the process information can\
    \ be previewed.\n\n## The Compare Object Command\n\nPowerShell has a very nifty\
    \ feature called the compare object command. It allows file comparisons between\
    \ 2 sets of files. With PowerShell it is possible for example to compare the CSV\
    \ & XML generated process information recently worked on, place them side by side\
    \ and compare the differences between the 2 files.\n\nType the command `Help Compare-object`\
    \ on the shell. See command run result in Figure 5.3. \n\n![](images/00019.jpeg)\n\
    \nFigure 5.3\n\n`Compare-object` has 2 aliases indicated above. They are `compare`\
    \ and `diff`. This means there are 2 additional possible command runs for `compare-object`,\
    \ and they are the aliases `diff` & `compare`.\n\n`Compare-object` is self-explanatory.\
    \ It is the ability of PowerShell to take similar information from 2 computers\
    \ and bring them together in one file so that the difference between the 2 sets\
    \ of information can be determined.\n\nClose scrutiny of the syntax shows 3 important\
    \ parameters of `compare-object` – `referenceobject`, `differenceobject`, and\
    \ `property`.\n\nFor example, the task is to compare the process information from\
    \ 2 computers. The first computer will be referred as the reference computer where\
    \ the `referenceobject` will be extracted from. Because it is called `referenceobject`,\
    \ this means the information it has is the standard for accuracy which the `differenceobject`\
    \ will be measured against.\n\nThe second computer will be the difference computer\
    \ where the `differenceobject` will come from. The information from `diffrenceobject`\
    \ is what’s being checked for accuracy.\n\nTo exercise the `compare-object` command\
    \ run 2 sets of computers will be required. Once you have 2 computers identify\
    \ which computer will be the reference computer. Remember this is the computer\
    \ with the accurate information or the baseline standard. Then run this command\
    \ on the reference computer:\n\n```\nGet-Process | Export-cliXML reference.xml\n\
    ```\n\nThe next step is to transfer the file to the 2nd computer by running this\
    \ command on computer 2:\n\n```\nDiff –reference (Import-cliXML reference.xml)\
    \ –difference (Get-Process) –property name\n```\n\nThe command is a bit complicated\
    \ since it is a combination of a series of commands. A bit of explanation, every\
    \ time a parenthesis is used in a command syntax that means the command inside\
    \ the parenthesis will be executed first and the processed information sent to\
    \ the command run before it.\n\nIn the example above since `Import-cliXML reference.xml`\
    \ is in parenthesis PowerShell will import the reference cliXML first before sending\
    \ it to `Diff –reference`. The same is true for the command `(Get-Process)`. PowerShell\
    \ will process it first before sending it to `–difference`.\n"
