    # Introduction\n\nFor some time now, a lot of Windows `PowerShell` books and instructional\
    \ materials, and even Windows `PowerShell` presentations, have been developed\
    \ for people with VBScript experience. To understand the technical instructional\
    \ language of the book or attend the classes, readers and attendees were required\
    \ to have an understanding of scripting. Understandably, it limited the number\
    \ of people who could learn from the Windows `PowerShell` literature that was\
    \ being made available. And as much as certain Windows administrators want the\
    \ Windows `PowerShell` to be the next VBScript it is not likely to happen.\n\n\
    The Windows `PowerShell` is not just a scripting shell. It is first and foremost\
    \ a command-line shell where people can run command-line utilities. There is an\
    \ option not to use Windows `PowerShell` for scripting but it’s not possible to\
    \ use `PowerShell` without running a command-line function. It’s likely the first\
    \ and main use of the shell for any person is to perform command-line functions.\
    \ You can use it for scripting sometimes, but it’s not possible to not use the\
    \ shell for commands.\n\nIn this book, we will focus on discussing the key purpose\
    \ of the Windows `PowerShell` - its command-line utilities. If you are interested\
    \ in scripting then this book is not for you. But if you want to know everything\
    \ there is to know about the `PowerShell` command-line functions, well at least\
    \ as much of the basics useful for any beginner, then read on.\n\nWith this book\
    \ you will learn all the command runs that make the Windows `PowerShell` such\
    \ an effective tool for providing automation skills to any Windows Systems administrator.\
    \ It has the most flexible and user-friendly methods of automating a range of\
    \ administrative tasks. The Windows `PowerShell` is guaranteed to make any Windows\
    \ administrator more efficient and effective at work.\n\n## A Step Back Into Windows\
    \ PowerShell History\n\nSystems administrators have come a long way since the\
    \ days of the Graphical User Interface (GUI). The first tool Windows administrators\
    \ used to manage their company’s Windows Systems. GUI was actually the inspiration\
    \ for Windows `PowerShell`.\n\nIt was just too time consuming to accomplish tasks\
    \ using GUI. A more efficient tool was required to reduce the work process and\
    \ allow administrators to deliver work faster. For example, if in the past an\
    \ administrator using GUI required 5 hours to add new users into a computer system\
    \ Windows `PowerShell` was able to reduce the time to accomplish the task by an\
    \ hour. The less than efficient GUI therefore caused and inspired the creation\
    \ of its more efficient counterpart – the Windows `PowerShell`.\n\nExpect the\
    \ Windows `PowerShell` to improve through the years as features get more streamlined\
    \ to service the needs of Windows administrators. In the future, all tasks related\
    \ to automation and administration should be possible to manage within the shell\
    \ in the quickest possible time using the most precise commands.\n\n## Who is\
    \ the book speaking to?\n\nThis book is for Windows Systems Administrators who\
    \ are responsible for managing a company’s integrated Windows systems. This book\
    \ is also for Systems administrators who run commands and are in constant search\
    \ for command tools to add to a command knowledge base. New Windows Systems administrators\
    \ who have just jumped into the fray and are looking for a beginners guide to\
    \ Windows `PowerShell` to get them started would also find this e-book handy,\
    \ and so would anyone looking for a career in the field.\n\n## How to use the\
    \ book\n\nSince the book is focused mainly on how to run commands on the Windows\
    \ `PowerShell` suggest finding time every day to read through and go through the\
    \ tests of each chapter. It is not recommended to rush through the book and read\
    \ it in one sitting. It is not the best way to absorb all the technical information\
    \ you’ll be getting from reading it, much less acquire the skills it will teach\
    \ you in every chapter.\n\nSure and steady is the best pace to be reading the\
    \ book. Make sure to immerse yourself in each chapter and make the most of the\
    \ practical tests available to really sink your teeth into the command functions\
    \ of the shell.\n\n# Chapter 1: Setting up your PowerShell Playground\n\nHere\
    \ are the basic requirements for setting up your Windows PowerShell playground.\
    \ The space where you get to play around with the command functions of the Windows\
    \ `PowerShell`. It is necessary to make sure that all the technical components\
    \ are available and installed to ensure you get the most instruction from the\
    \ book:\n\n1.  Windows with a `PowerShell` version 3 at the very least. The minimum\
    \ would be the Windows 8 or Windows Server 2012.\n"
