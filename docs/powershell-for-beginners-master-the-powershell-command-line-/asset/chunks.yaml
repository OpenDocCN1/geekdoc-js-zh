    cannot be found in the shorter parameter set.


    A command with a syntax that has 2 parameter sets means it is possible to use
    both sets to run the command provided you only use the shared parameters. If you
    use a special parameter which only exists in one parameter set in the case of
    the above example, [AsString], then you’re stuck with working with the parameters
    found in that parameter set. To work with multiple parameter sets and to have
    access to a larger pool of parameters best to avoid using unique parameters not
    shared by multiple parameter sets.


    Different Types of Parameters


    Let’s define and distinguish parameters to gain a better understanding of their
    function.


    Mandatory Parameters: Any parameter that is not inside a [ ] square bracket is
    mandatory. In Figure 3.4 string is a mandatory parameter.


    Optional Parameters: These are the parameters in [ ] square brackets. To run a
    command it is not mandatory to use every parameter on the set. In fact most are
    optional because the information can be provided by the system. Notice that in
    the short parameter set in Figure 3.4 all the parameters are optional.


    Positional Parameters: Some parameters appear in all syntax language strings that
    it is not necessary to type them in every time a command is run. These are positional
    parameters. In Figure 3.4 the positional parameter is [InstanceId] because it
    has a [ ] square bracket within another set of [ ] bracket. This means you can
    keep that parameter but it is necessary to add value to the position <long[]>].


    Parameter Values


    For information on understanding parameter values or the input that a parameter
    requires to run a command refer to Figure 3.5 below:


    ![](images/00010.jpeg)


    Figure 3.5 Parameter Values


    First, switches. A switch is a parameter that is stand alone and will not require
    a value. In Figure 3.5 an example of a switch is [AsString]. In dealing with the
    full syntax of a command a switch will be clearly indicated as a switch so that
    administrators know not to put a value on them.


    For parameters that require a value input this is how to identify them:


    1.  When a parameter is inside a [ ] square bracket separated by a space from
    another parameter.


    Example: [LogName] <string>


    When a parameter is stand alone and does not require a value this is how to identify
    them:


    1.  When a parameter is followed by an equal sign, colon, square bracket, etc.  


    Example: [AsString]


    Types of Parameter Values


    1.  DateTime: A parameter value that can be seen as a date. Therefore expect it
    to be a string of numbers. Example: 12-01-2012\. DateTime is often dictated by
    the regional settings of the computer.


    2.  String: Combination of letters and numbers. If there is a space between a
    string should be encased in quotation marks.


    3.  Int, Int64, Int32: Int stands for integer. Not a decimal but a whole number.


    Adding value to a string with a [ ] square bracket 


    [ComputerName  <string>[ ] >]


    The [ ] square bracket in the above example means the parameter can add an array
    or list of strings. Example:


    Single Value:


    Get –EventLog Security –computer Station-A2


    Multiple Values: Each value should be separated by a comma & no space between.


    Get –EventLog Security –computer Station-A2,AB5,Files02


    Multiple Values with space between: Should be enclosed in quotation marks:


    Get –EventLog Security –computer “Station-A2”, “AB5”, “Files02”


    Text File Values: These values should be typed in single lines each.


    Get –EventLog Security –computer


    Station-A2


    Files02


    Files07


    Files30


    AB5


    AB8


    If you want to read the contents of files the most effective way to do so is to
    force PowerShell to show the contents via the Get-Content cmdlet. The below syntax
    does exactly that. Notice the command to get content is in a parenthesis. That
    is the symbol that can get PowerShell to execute a command within a given parameter.


    Get –EventLog Security –computer (Get-Content names.txt)


    Command Help to Get Examples'
