    When PowerShell sends an error message and it is not clear how to address it there
    are 3 ways to get back on track:


    1.  Ask Help for the answers.


    2.  Make sure all the parameter information on the syntax is accurate.


    3.  Go to Show Command to check for the accurate syntax information.


    Cmdlet Typing Rules


    Although PowerShell could not care less about whether the letters on the command
    are in lower or upper case it does care a whole lot about the spaces and dashes
    in a cmdlet or command. Get it wrong and you’ll see red text plastered all over
    your console.


    Here are the mandatory rules to memorize when typing a command or cmdlet:'
