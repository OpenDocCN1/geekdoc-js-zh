    ## 2. “x64” 操作系统


    检查方法：前往开始菜单。打开应用文件夹。寻找 `Windows PowerShell` 文件夹。如果在里面找到了 `Windows PowerShell`
    和 `Windows PowerShell ISE` 文件，说明你拥有了正确的操作系统。这意味着该版本的 `Windows PowerShell` 是所要求的
    64 位版本。


    注意：作为 32 位操作系统的“x86”版本与本书的教学材料不兼容。建议升级到 64 位操作系统。


    ## 运行 PowerShell


    虽然大多数电脑上已经预装了 `Windows PowerShell V3`，但检查一下你正在使用的电脑是否真的安装了它总是有好的。检查电脑上是否安装了 `PowerShell
    V3` 非常简单。


    进入开始菜单，点击“应用”，打开 `Windows PowerShell ISE` 文件夹。在 `Windows PowerShell` 控制台中输入 `$PSVersionTable`
    并按回车。检查屏幕上出现的 `PS Version` 信息。它应该显示版本为 `3.0`。如果不是，你将需要升级。


    如果你需要安装升级，请访问 [`download.microsoft.com`](http://download.microsoft.com)。在搜索框中输入
    `PowerShell 3`。下载 `Windows Management Framework 3.0`，它应该包含 `PowerShell V3`。记得下载
    64 位程序，因为这是本书所兼容的操作系统。


    注意：`Windows PowerShell V3` 有两个组件可供选择启动 Shell。第一个是 `PowerShell.exe`。它是基于文本的控制台主机。第二个是
    `PowerShell_ISE.exe`。它是基于图形的控制台。它提供了一个更视觉化的集成脚本环境。两者都适用于本书。因此，这取决于读者的喜好。然而，本书倾向于
    `.exe` 控制台主机版本。建议使用该控制台。


    ### 为 PowerShell.exe 自定义 Shell


    如果你决定使用基于文本的 `PowerShell` 控制台，我们强烈建议在开始操作 Shell 之前自定义控制台功能。需要考虑的更改：


    - **字体**：点击 `PowerShell` 图标（位于控制台左角的控制框）。从“菜单”中选择属性，在对话框中浏览选项卡，将默认字体更改为 `Lucida
    fixed-width font`。这是针对 `PowerShell` 命令优化的字体。为了确保在控制台中输入的单词、字符和符号清晰可见，请将字体大小增加比默认字体
    `12` 大。

    - **颜色**：也可以更改控制台背景和前景的颜色。选择你喜欢的颜色。

    - **窗口大小**：窗口大小和屏幕缓冲区应具有相同的宽度值。


    ### PowerShell V3 在线资源


    关于 `PowerShell V3` 的任何附加信息，请访问 `MoreLunches.com`。该网站提供了可以下载的代码列表相关信息。你还会在网站上找到书中测试题的答案。在网站上还可以访问关于
    `PowerShell V3` 的文章、视频和博客链接。


    # 第 2 章：向 PowerShell 问好


    在引言中提到过 `Windows PowerShell` 用户有 2 种可用控制台。准确地说，实际上有 4 种控制台选项。预览方法：前往“开始”，打开“所有应用”。图
    2.1 显示了点击“应用”后的桌面视图。


    ![](img/00001.jpeg)


    图 2.1


    我们之前提到过 `Windows PowerShell` 上有 2 种可用控制台。这些是基于文本和基于图形的控制台。还提到过驱动 `Windows PowerShell`
    的 2 种操作系统。这些是 64 位操作系统和 32 位操作系统。


    在 `PowerShell` 图标的桌面视图中，32 位系统的文本和图形控制台是带有 `(x86)` 标记的，而 64 位版本则没有。


    注意：出于本书的考虑，建议使用 64 位系统和标准的 `.exe` 文本控制台进行。


    ## 标准 PowerShell 控制台窗口（基于文本）


    ![](img/00002.jpeg)


    图 2.2


    在整本书中，我们将使用这个 `PowerShell` 控制台。见图 `2.2`。因为它比基于图形的选项更简单、更不复杂。


    ### 配置基于文本的控制台


    自定义控制台所需的所有选项都可以在窗口控制框的“属性”选项卡中找到。控制框是窗口左上角的 Windows 图标。属性文件夹将具有以下选项卡：


    - **选项**：建议增加 `Command History Buffer Size`（命令历史缓冲区大小）。这很重要，因为你希望能够清晰读取过去输入的命令信息。

    - **字体**：首选字体是 `Lucida fixed width-font`。字体大小应大于默认的 `12`。由于运行命令工作很大程度上取决于输入的准确性，你希望确保输入的每个字母和符号都是准确的。最好的检查方法是使用大字体，让你看清屏幕上精确的字符。

    - **布局**：宽度大小应具有相同的数字，以便窗口恰好适应屏幕。避免过度扩展控制台大小，以至于某些区域在屏幕上不再可见。这确保了屏幕上输入的所有信息都是可读的。-
    **颜色**：如果你喜欢看到不同的背景、字体和前景颜色，可以自行调整。如果不满意，总可以回到默认的蓝色和白色。


    ## 集成脚本环境 (ISE)


    使用基于图形的控制台 `(ISE)` 的优点是支持双字节字符集，并且由于为了视觉化，它是更好的 `PowerShell` 工作环境。另一个优势是它可以帮助高级用户创建
    `PowerShell` 命令和脚本。与文本版本不同，你可以在控制台上复制粘贴项目。查看图 `2.3` `ISE` 的视图。


    ![](img/00003.jpeg)


    图 2.3 集成脚本环境 (ISE)


    尽管如此，`ISE` 也有局限性，其中包括：它不支持转录、启动速度比文本控制台慢，并且需要 `Windows Presentation Foundation
    (WPF)`。这意味着硬件或电脑应安装 `GUI`，否则 `ISE` 将无法运行。


    许多 `Windows PowerShell` 用户喜欢从文本控制台开始，然后转向使用 `ISE` 版本。由于 `ISE` 设计用于更优化的命令运行和脚本体验，所有使用
    `PowerShell` 的管理员最终都会转向 `ISE`。


    由于本书为 `PowerShell` 初学者编写，因此从文本控制台开始是合适的。会有充足的时间让你熟悉 `PowerShell.exe`。


    ## 不要拼写错误！


    由于 `PowerShell` 是一个命令行界面，请预计会有大量的输入。这意味着准确、无错误的输入。严格不允许任何拼写错误，否则控制台无法生成正确的答案和响应。


    让我们试一下。你可能可以开始熟悉控制台的选择功能。让我们进行几次练习：


    1. 输入 `Get-S`，按几次 `Tab`，然后按 `Shift-Tab`。`PowerShell` 将循环遍历文件。意图是让用户扫描选项以获取所需的选项卡。完成后，按
    `Esc` 清除控制台。


    2. 输入 `Dir c:\` 然后按 `Tab`。`PowerShell` 将循环遍历文件夹，就像练习 `1` 一样。完成后再次按 `Esc` 清除控制台。


    '
- fmt: '

    3. Set-Execu then press Tab, add space and a dash (`-`), press Tab several times.
    This time PowerShell will cycle through parameters. Again press Esc to clear the
    console.


    You’ve just learned the importance of tab completion. Pressing the tab will generate
    the various options available in the shell. It gives the user information on a
    variety of commands, functions, or parameter names inscribed inside the shell.


    ### Intellisense


    The pop-up menu that appears on the right side of the PowerShell ISE console is
    referred to as Intellisense. See Figure 2.4 below. Scroll up or down on the menu
    to look for the item to search then hit Tab and continue typing to get desired
    information or result.


    ![](images/00004.jpeg)


    Figure 2.4 Intellisense


    **NOTE**: We cannot stress this enough: Accuracy in typing is the single most
    important skill to acquire while working with the PowerShell console. There have
    been instances when a simple typo error caused the entire system to fail. To ensure
    functionality of the PowerShell console it is best to be very alert and cautious
    when typing in each character. Double checking words and symbols is a must.


    ### How to confirm for your version of the PowerShell


    Let’s make sure the computer is actually running on at the very least the V3 version
    of the PowerShell. On the console type this command: `$PSVersionTable`


    ![](images/00005.jpeg)


    Figure 2.5 PowerShell V3 detailed information


    Figure 2.5 above should appear on the console. The value on the item `PSVersion`
    should say `3.0` or higher. If it does not indicate that then you’ll have to upgrade
    or download the V3 version at a minimum. The table also provides information on
    all the PowerShell related technologies the version is compatible with.


    ### PowerShell Laboratory


    Let’s go through a few console configuring tests to make sure your console properties
    are primed for the next lessons:


    1. Customize the color of the console to your specification.

    2. Customize the font to your specification. Be reminded though that our recommended
    font is Lucida font and the size should be bigger than the default font size `12`.
    You can choose to work with a different font if that is the preference and if
    `Lucida` is not satisfactory.

    3. Check for readability of characters and symbols. Type a quote (`‘`) and a backtick
    (` `). Check to see if you can distinguish between the two.

    4. Type a parentheses (`()`), type a square bracket (`[]`), type an angle bracket
    (`<>`), type a curly bracket (`{}`). Make sure the symbols are easily identifiable.
    If not change the font or increase the font size so that they are easily readable.


    If you have accomplished the test and are satisfied with the look of the PowerShell
    console then it is time to move on to the next Chapter.


    # Chapter 3: Discover Commands with the Help System


    This book will not have all the answers for all the possible PowerShell questions
    there is to be asked. The goal of the book is to provide the administrator relevant
    information on how the shell functions as a command-line utility for the purpose
    of better understanding its features. The book wants to make sure the PowerShell
    is a useful tool in automating and managing an integrated Windows system using
    command runs.


    The book is not a manual that contains all the answers. As such, we highly recommend
    expert and detailed knowledge of the PowerShell’s most important discoverability
    feature – the help system.


    The PowerShell Help System provides detailed description of the Windows PowerShell
    functions, scripts, modules and cmdlets or commands. It has the ability to explain
    the intricacies of the Windows PowerShell language as well as explain concepts
    of each PowerShell item, symbol, character and element.


    We recommend cozying up to the Help System, spend as much time as you can with
    it, and really get to know the minutest detail and the tiniest bit of information
    that the Help System can provide. If you invest quality time with the Help System
    it will reward you with near expert knowledge of all of PowerShell’s intricate
    and very useful details, making you a veritable PowerShell wizard. Plus expert
    knowledge of PowerShell means an easier life for every PowerShell user. It literally
    has all the answers to any and every PowerShell question.


    You do not know the command to a task? The Help System will tell you. Do not understand
    the definition of certain terms? The Help System has the answers. Having problems
    getting the accurate syntax for a command? The Help System knows the syntax to
    each command. Want to create a string of individual commands but do not know how?
    The Help System can guide anyone through the step by step procedure of properly
    stringing multiple commands together.


    Yes, you got it right. The Help System is the PowerShell system manual. Therefore,
    it is smart to read it front and back to fully understand how the shell works.
    That is the only way to make the experience of using it a pleasant and productive
    one. Otherwise you’ll be stuck. So do not be stubborn and be a smart PowerShell
    user. Read the Help System. Master the Help System.


    ## Updating the Help


    Now that we know how important the Help System is for the PowerShell user, time
    to acquire a copy. Yes, the Help System is not pre-installed in the PowerShell.
    The reason being is it goes through frequent updates. So frequent in fact that
    it’s more practical to ask users to install the Help System version after purchase
    of a PowerShell. That way they will be able to get the very latest version of
    the Help System on the day of purchase.


    Updating the Help System should be the first order of business after acquiring
    a Windows PowerShell. It is the first task to accomplish before starting any work
    with the shell.


    So let’s have a go at it then. An important reminder - before typing the command
    `Update Help` on the console make sure to check if you are running the PowerShell
    as an administrator. Check the top bar of the console it should say, ‘Administrator:
    Windows PowerShell’. See Figure 3.1.


    ![](images/00006.jpeg)


    Figure 3.1


    If it does not say ‘Administrator’, then run the shell as an administrator. Only
    if it says ‘Administrator’ should you type the command `Update Help` again. It
    is important that the computer is connected to the internet for this task. After
    typing `Update Help`, give the PowerShell time to update the Help System. It will
    take a few minutes. After that, you can proceed to work with the PowerShell.


    **NOTE**: Of all the habits to develop as a PowerShell user, it is the habit of
    updating the Help System every month that is most important. Remember that there
    will always be a constant stream of new information and features that will be
    generated for the PowerShell on a regular basis. Make it a habit to update help
    on a regular basis.


    ### Asking for Help


    It’s very simple to start using the PowerShell Help System, type in the cmdlet
    `Get-Help` on the PowerShell console. You should see all relevant information
    about the Help System: descriptions, online Help, update Help, get Help. All the
    necessary command functions for Help should be in the page also. See Figure 3.2.


    ![](images/00007.jpeg)


    Figure 3.2


    Some sources will suggest using the command `Help` or `Man` as alternative commands.
    Both work. They register the same result as `Get-Help`.


    ### Ask Help to Look for Commands


    To manage expectations, the Help system does not provide information on the type
    of commands that are in its system. It knows it has a range of Help topics in
    its system. It is great however Microsoft created Help topics for all commands
    it has created. So expect any request for commands from Help to be answered provided
