  trans: '


    1. `动词–名词格式`：每个 `cmdlet` 或命令始终始终始终遵循“动词+名词”的格式。

    2. `连字符 (dash)`：每个 `cmdlet` 或命令名词之间都应该用连字符连接。

    3.  连字符间不留空格`：每个 `cmdlet` 或命令在连字符的前或后都绝对不能有空格。


    在输入命令或 `cmdlet` 时，请记住格式为：动词、连字符、名词。


    ## 参数输入规则


    输入参数时也是同样的原则。请注意至关重要的空格和连字符。以下是参数的强制性输入规则：


    1. 所有没有值的参数其前面都应该有一个连字符。

    2. `cmdlet` 与参数之间应该有空格。

    3. 一个参数与其后的另一个参数之间应该有空格。


    ## PowerShell 实验室


    这里有几个测试题，用于复习和练习第 4 章的课程。如果卡住了答案，可以查找在线资源进行快速查看。


    1. 收集所有 `cmdlet` 类型命令的列表。

    2. 提供 50 个别名（aliases）的列表。

    3. 通过 `Help` 查找更多关于 Windows 防火墙规则的信息。


    ## 第 5 章：管道函数


    在 PowerShell 中运行命令的伟大之处在于，它能够在一个整洁的语法中将多组命令串联在一起。在之前的章节中，我们已经讨论了关于单条命令的所有知识。现在是时候学习如何将
    2 组或更多命令语法组合在一起，让 shell 执行多项任务了。


    管道（Piping）就是我们所说的 shell 将多个命令组合在一起的能力。这是因为 `|` 管道符号被放置在组合的每组命令语法之间。它被称为管道（pipeline）。


    管道充当前一个命令通过的通道，以便下一个命令可以接收它并有东西可做。第二个命令接着执行同样的操作。它通过管道传递，以便后面的第三个命令有素材可以处理。


    管道实际上是 Windows PowerShell 最优秀且独特的特征之一，其他命令行运行工具不具备这种在一种语法中运行多个命令的能力。


    ## 逗号分隔值 (CSV) 导出


    假设任务是获取系统 CPU 使用情况的详细信息以及内存信息。该任务的多条命令字符串为：


    ```

    Get-Process | Export-csv procs.csv

    ```


    在上面的语法中有 2 组命令。第一条命令是 `Get-Process`，第二条命令是 `Export-csv procs.csv`。


    `Get-Process` 命令是要求 PowerShell 提供有关计算机进程的信息。例如：CPU 利用率和计算机内存。


    而第二个命令 `Export-csv procs.csv` 是要求 PowerShell 通过 `|` 管道将 `Get-Process` 获取的所有 CPU
    利用率和内存信息导出到 CSV 文件。


    让我们在 shell 中只输入命令 `Get-Process`。结果应该如底 5.1 所示。


    ![](img/00017.jpeg)


    图 5.1


    图 5.1 表格中的信息描述了 CPU 利用率和系统内存使用情况。


    现在，要求 PowerShell 将其导出为 CSV 文件，以便传输到 Microsoft excel 文件用于演示，请输入下面的命令：


    ```

    Get-Process | Export-csv c:\procs.csv

    ```


    让我们通过在记事本上预览列表，查看双重命令 `Get-Process | Export-CSV` 提供的计算机进程详细信息。


    图 5.2 应该是控制台上的结果：


    ![](img/00018.jpeg)


    图 5.2


    第一行区分信息为“系统诊断进程”（Systems Diagnostics Process）。第二行识别了每个表格信息的性质。第三行提供了计算机中运行的进程详细列表。上方是从双重命令运行
    `Get-Process | Export-CSV c:\procs.csv` 中提取出的信息。


    现在确保将该信息保存到 CSV 文件中。一旦完成，该文件就可以与任何需要将信息转换到演示型 Microsoft excel 文件的同事共享。


    可以将 CSV 文件导入到 PowerShell 吗？当然可以。只需在 shell 中输入 `Import-CSV c:\procs.csv`，结果应该与图
    5.2 非常相似。


    ## 可扩展标记语言 (XML) 导出


    另一种导出和导入文件的方法是通过 XML 或可扩展标记语言。某些管理员倾向于使用 XML，因为它不像 CSV 那样是扁平文件，而且通常生成比 CSV 更丰富的信息数组。


    要导出 XML 文件，运行的命令非常相似，只是第二条命令不同：


    ```

    Get-Process | Export-cliXML C:\procs.csv

    ```


    要导入文件，运行的命令应为：


    ```

    Get-Process | Import-cliXML C:\procs.csv

    ```


    建议测试 XML 导出命令以以熟悉。确保也运行导入 XML 命令，并检查记事本上的结果，看是否可以预览进程信息。


    ## Compare-Object 命令


    PowerShell 有一个非常实用的功能叫做 `compare object` 命令。它允许在 2 组文件之间进行比较。通过 PowerShell，例如比较最近处理的
    CSV 和 XML 进程信息，将它们并排放置并比较两个文件之间的差异。


    在 shell 上输入命令 `Help Compare-object`。查看图 5.3 中的命令运行结果。


    ![](img/00019.jpeg)


    图 5.3


    `Compare-object` 有两个别名。它们是 `compare` 和 `diff`。这意味着 `compare-object` 有 2 种可能的命令运行方式，别名分别为
    `diff` 和 `compare`。


    `Compare-object` 是言自明的。它是 PowerShell 将来自两台计算机的相似信息合并到一个文件中，以便确定两组信息之间的差异。


    仔细观察语法显示了 `compare-object` 的 3 个重要参数——`referenceobject`、`differenceobject` 和 `property`。


    例如，任务是比较来自 2 台计算机的进程信息。第一台计算机将作为参考计算机（reference computer），从中提取 `referenceobject`。因为它是
    `referenceobject`，这意味着它拥有的信息是 `differenceobject` 衡量的标准。


    第二台计算机将作为差异计算机（difference computer），`differenceobject` 将来自那里。`differenceobject`
    的信息是要检查准确性的内容。


    为了练习 `compare-object` 命令，需要 2 台计算机。一旦有了 2 台计算机，请确定哪一台是参考计算机。记住，这是拥有准确信息或基准标准的计算机。然后在在参考计算机上运行此命令：


    ```

    Get-Process | Export-cliXML reference.xml

    ```


    下一步是在第 2 台计算机上运行此命令将文件传输过去：


    ```

    Diff –reference (Import-cliXML reference.xml) –difference (Get-Process) –property
    name

    ```


    该命令有点复杂，因为它是系列命令的组合。解释一下，每当在命令语法中使用括号时，意味着括号内的命令将首先执行，并将处理后的信息发送到之前的命令运行。


    在上面的示例中，由于 `Import-cliXML reference.xml` 在括号内，PowerShell 会先导入参考 cliXML，然后发送给 `Diff
    –reference`。命令 `(Get-Process)` 也是如此。PowerShell 会先处理它，然后发送给 `–difference`。


