    name that you would like to check for alias in the future. PS C:\> (get-command
    get-eventlog | select –ExpandProperty parameters).computername.aliases


    Positional Parameters:  When a parameter is enclosed in a [ ] square bracket then
    it is a positional parameter. Here’s a quick test, identify the 2 positional parameters
    in figure 4.3 below.


    ![](images/00013.jpeg)


    Figure 4.3


    If you answered [–Path] and [-Filter] then you are right. When it comes to positional
    parameters it is not mandatory to type in a parameter name which can take time.
    There is an option to keep them as they are.


    Show-Command


    A graphical representation of the syntax format where you get to input the values
    on each parameter in a given parameter set. See Figure 4.4 provided.


    ![](images/00014.jpeg)


    Figure 4.4 Show Command Box


    Instead of manually typing every word and symbol of a syntax or parameter go to
    the Show-Command option. It allows entry of required fields on the box and it
    can either be asked to run the command or it can be copied to the console after
    the box has been filled up.


    This makes work so much easier since it creates the parameters set for you. All
    you have to do is to input the values and names on each parameter. The possibility
