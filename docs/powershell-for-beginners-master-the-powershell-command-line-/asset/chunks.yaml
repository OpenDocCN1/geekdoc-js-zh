    如果你是那种喜欢摆弄系统并乐于通过尝试来学习的管理员，那么让 `Help` 为你提供命令示例将引起你的兴趣。以下是获取 `Help` 显示命令示例的语法：


    `Help Get-EventLog –examples`


    尽管去测试 `Help` 提供的 cmdlet 示例列表。只需确保你正在一台未连接到公司系统的计算机上操作，这样在测试示例列表时遇到错误，就不会对你的 Windows
    生产线产生影响。


    ## 获取常用参数的命令帮助


    回看图 3.5，图中展示了用于解释参数值的示例。如果我们仔细观察语法中的两组参数，我们会注意到它们都以 `[<CommonParameters>]` 结尾。`<CommonParameters>`
    是一组包含八个参数的集合，在每个 cmdlet 中都能被找到。


    让我们命令 `Help` 提供关于 `[<CommonParameters>]` 的更多信息。在控制台上输入以下命令：


    `Help common*`


    结果应该是 `About_common_parameters`。由于 `*` 通配符符号的存在，不应该有其他选项。此外，关于常用参数没有其他 Help 主题。仅此而已。


    查看 `About_common_parameters` 并查看 `<[CommonParameters>]` 中找到的 8 个参数。它们是：


    - `-Verbose`

    - `-Debug`

    - `-WarningAction`

    - `-WarningVariable`

    - `-ErrorAction`

    - `-ErrorVariable`

    - `-OutVariable`

    - `-OutBuffer`


    `About_common_parameters` 只是帮助系统中可“关于”（about）主题之一。如果你想查看所有其他“关于”主题，请在控制台上输入：


    `Help about*`


    尽管去尝试，随意摆弄并筛选 PowerShell 隐藏在 Help 中的更多海量文档吧。对于任何管理员来说，掌握 PowerShell 存储的这些大量信息总是一项优势。


    ## 如何访问在线帮助


    从一开始，我们就建议养成每月更新一次帮助系统的习惯。帮助系统正在被不断更新，只要 PowerShell 仍在使用中，它将一直保持更新。更新 `Help` 的最佳方法是访问在线版的
    `Help`。它是目前、并将永远是最新的版本。参与 PowerShell 开发的每个人都为添加和更新在线帮助系统做出了贡献。定期将所有这些新信息添加到你的
    PowerShell 帮助系统中是很好的。以下是访问 PowerShell 在线帮助的命令：


    `Help Get-EventLog -online`


    养成访问在线帮助并每月更新你的帮助系统的习惯。当你遇到新的且复杂的 Windows PowerShell 命令和脚本任务时，你会感谢自己自己的。


    ## 实验室测试


    1. 确保你已成功安装了 `Update-Help`。

    2. 找到可以输出到文件的 cmdlet。

    3. 找到可以输出到打印机的 cmdlet。

    4. 写入事件日志的命令是什么？

    5. 使用命令 `Help` 从安全日志日志获取最近的 50 条目。


    提示：如果测试遇到困难，请访问 `MoreLunches.com` 等在线资源寻找答案。事实上，与更新 `Help` 一样，建议养成定期检查可靠在线资源的习惯，以获取有关
    Windows PowerShell 的最新消息。跟上 PowerShell 的新动态将提高工作效率。


    # 第 4 章：使用命令——终于到了！


    每位系统管理员、Web 开发人员、IT 专业人员都有共同点。每个人，我们每一个人在职业生涯之初都经历并从某项任务开始。那个任务就是运行命令。没有比 Windows
    PowerShell 更好的命令行支持的计算机系统了。


    这就是 PowerShell 开发的初衷——为了运行命令。如果说 Windows PowerShell 是一个脚本工具是不准确的。它它可以执行脚本，但它开发的首要任务是运行命令。它能提供的任何其他附加功能都是其运行命令行能力和目的的次要任务。


    ## 它是一个 Shell


    与其他 shell（例如 `Cmd.exe`、`MS-DOS`、`Unix Bourne` 和 `Unix Bash`）一样，使用 PowerShell 方法非常简单。输入命令，添加所需的参数来告诉命令如何运行，按回车并查看输出。


    创建一个 PowerShell 脚本非常容易。只需编写一个脚本并在文件末尾添加 `.PS1` 即可。漂亮！你现在有一个 PowerShell 脚本了。创建非常复杂的
    PowerShell 脚本是可能的，随你所欲。PowerShell 也完全可能运行该脚本并实现脚本创建的目标。


    许多许多具有高技能的 IT 专业人员以编写想象中最复杂的脚本著称，而 PowerShell 能够运行这些命令。这就是 PowerShell 的可靠且同样复杂之处。无论你向它投掷什么，它都能给你反馈。


    但如果你是一个只想解决公司集成计算机系统产生的日常任务的管理员，那么创建复杂脚本的能力还没有运行解决系统问题和故障的命令的能力重要。因此，精通 PowerShell
    的命令运行比用复杂的脚本组合挑战 PowerShell 重要得多。


    如果我们对 PowerShell 要现实且实用，那么在运行命令方面变得非常精通并熟悉 PowerShell 的功能和特性，比创建最令人印象深刻的脚本重要得多。好利用你的时间并理解真正的优先级。


    ## 命令的元素


    ![](img/00011.jpeg)


    图 4.1


    上方是构成命令的每个元素或项目的详细列表。对于 PowerShell 及其功能，理解命令的组成部分至关重要。让我们开始吧。参考图 4.1。


    1. `Command`：称为 cmdlet。所有的 cmdlet 都采用动词-名词格式。

    2. `Parameter 1 Name`：`LogName` 是参数 1 的名称。如果参数名称包含标点或空格，需要添加引号。

    3. `Parameter 1 Value`：`Security` 是 Logname 的值。

    4. `Parameter 2 Name`：`ComputerName` 是参数 2 的名称。如果参数名称包含标点或空格，需要添加引号。

    5. `Parameter 2 Value`：`Win8` 和 `Server1` 是 ComputerName 的值。

    6. `Parameter 3 Name`：`Verbose` 是参数 3 的名称。它是一个常用参数。它不需要值。


    ## 创建命令的规则


    1. 始终在命令名称和第一个参数名称之间添加空格。

    2. 始终在每个参数名称前添加破折号。不要在破折号和参数名称之间添加空格。

    3. 始终用空格将参数名称与其值分开。

    4. 始终用空格将值与下一个参数名称分开。

    5. 输入命令不区分大小写。


    再次，完美输入命令会导致无错误的结果。练习、练习、练习输入技巧，并熟记创建命令的规则。当你使用 PowerShell 时将将一帆风顺。


