    processes that are different in the reference set and the difference set. <= is
    the indicator for the process that can only be found in the reference set. =>
    is the indicator for the processes that are found only in the difference set.
    See figure 5.3 for graphic example.


    ![](images/00020.jpeg) 


    Figure 5.4


    The above table indicates that the difference computer or computer 2 has calc,
    mspaint, and notepad while the reference computer or computer 1 does not. And
    while computer 1 or the reference computer has conhost and powershell_ise the
    difference computer does not.


    For administrators, the compare-object command run of the PowerShell can be very
    useful for checking on a regular basis the internal workings of an array of computers
    against a standard baseline or reference object. PowerShell’s compare-object command
    run therefore is the perfect tool for efficient systems management.


    PowerShell Out Cmdlets


    PowerShell has several cmdlets that allows for output of commands to files, printer,
    or even the option to delete or nullify. These are referred to as the out cmdlets.
    Go to the shell and type in Help Out*. The following out cmdlets should be the
    result


    1.  Out-null: The object in the command syntax whether single command or pipeline
    command that will be nullified or deleted.


    Example: PS C:\>get-newitem | out-null


    2. Out-default: The object in the command syntax that will be sent to the host
    or the shell. The information reflected on the shell.


    3. Out-host: Similar to Out-Default.


    4. Out-file: Processing a list of items generated from a command so that the output
    is a .txt file.


    Example: 


    PS C:\ get-process | outfile –filepath C:\docs\process.txt


    PS C:\ get-process | out-file C:\docs\process.txt


    5. Out-printer: Asking PowerShell to print a .txt file via pipeline.


    Example:


    PS C:\ get-content $pshome\about_signing.help.txt |


    Out-Printer


    6. Out-string: Searching for and manipulating data to output as string. Example
    1 sends a .txt file to the shell as a single string. Example 2 takes regional
    settings information from a computer and converts it to strings.


    Example:


    1. PS C:\ get-content C:\docs\test1.txt | out-string


    2. PS C:\> $cult = get-culture | select-object * out-string –inputobject $cult
    –width 100


    The Convert Command


    Before discussing the convert command-run of PowerShell it is necessary to differentiate
    between the export command and the convert command.


    Export in PowerShell terms means converting data into a format say CSV, then saving
    that converted format into a file for storage. Convert on the other hand means
    conversion to a different format only not necessarily saving it into a file. 


    Is it possible to convert a command to an HTML format? Yes. The command syntax
    would be:


    Get-Service | ConvertTo-HTML


    The command will convert Service to its HTML format. Is it possible to export
    the Get-Service HTML format to a .txt file? Yes it is.


    As a test, determine the pipeline command that will enable saving the Get-Service
    HTML format to .txt. The answer is accurate if you typed in:


    Get-Service | ConvertTo-HTML | Out-file services.html


    The service HTML data should be saved to a .txt file format easily with the above
    pipeline command run. 


    Other ConvertTo- cmdlets available on the PowerShell are:


    1.  ConvertTo-CSV: The command converts any data on the shell to a CSV format.


    2.  ConvertTo-Json: Converts any object to a JavaScript Object Notation (Json)
    string format. The conversion results in properties becoming field names, removal
    of methods and conversion of field values into property values.


    3.  ConvertTo-XML: For conversion of pipelined objects to an XML based representation.
    Will only work if there are multiple commands in a pipeline.


    Dangerous! cmdlets


    Crashing a computer system is a valid option if for example the user would like
    all the data & systems inside the computer to never be seen again. That is always
    a valid option if the purpose is to clean up a computer and wash your hands clean
    of what is inside it forever.


    But that is a rare instance and the reasoning behind should be so valid as to
    completely annihilate all the information acquired and stored in the device. More
    often than not, we would like to extend the life span of our computers devices
    for as long as possible. After all, the computer is such a personal device and
    typically contains some of the most important personal and work related information
    people cannot do without.


    Therefore, understanding the cmdlets that pose a danger to the continued functionality
    of computers is very important. This will prevent the unfortunate possibility
    of a computer crash.


    The dangerous cmdlets to avoid running in the shell are:


    1.  Get-Process | Stop-Process


    2.  Get-Service | Stop-Service


    Please do not test run the commands. Run them in the shell and it will proceed
    shutting down your computer permanently. DO NOT ask the shell to run these commands
    ever.


    If for some reason you have accidentally run the command PowerShell has a failsafe
    device that will ask, ‘Are you sure?’ before proceeding with the Stop-Process
    command.


    This is because PowerShell is designed to measure the impact level of every command.
    This is to make sure that when the stop command is requested they do not pose
    any threat to the integrity of the computer data and systems. To check for a computers
    impact level settings run this command on the shell:


    PS C:\ $confirmpreference


    The preferred resulting answer should be High. This means when PowerShell runs
    a command that is detrimental to the integrity of the computer systems and data
    PowerShell will first ask, ‘Are you sure?’ before running the command. This of
    course provides the option to abort the command and save the computer from crashing. 


    Make sure every computer’s PS C:\ $confirmpreference settings is set on high to
    ensure it is safe from inadvertent shut down.


    PowerShell Laboratory:


    Here are a few more practical tests to run on the shell recapping the lessons
    in this chapter:


    1.  What is the difference between a CSV and XML format? Run a command that exports
    to CSV.


    2.  Run a pipeline command and print the file into a printer.


    3.  Convert a command pipeline into Json.


    4.  Export a command pipeline into a .txt file.


    5.  Use convert & export in one pipeline command run.


    # Conclusion


    Congratulations! You have completed the book. Hopefully it has provided functional
    basic information you require to successfully run commands on PowerShell. Based
    on the lessons from the 5 chapters you should already be equipped to tinker inside
    the Help System of PowerShell for any information you require about cmdlets, functions,
    modules and scripts. Remember if unsure about what a cmdlet, script, or terms
    means Help has all the definitions that will inform on the matter.


    Commands have a specific formula that needs to be entered in the console accurately
    so that the shell runs the right command to generate the right result. The best
    way to get good at perfecting the command formula is to keep on practicing your
    typing skills. Remember PowerShell has 400++ built in commands that you can work
    on. It is to the advantage of any administrator working with the PowerShell to
    know all of them to make accomplishing tasks and systems management a more effective
    work process.


    Knowing all of the hundreds of cmdlets available inside the PowerShell system
    will allow the user to build pipeline commands that can be very beneficial to
    fast tracking tasks. They allow PowerShell to accomplish tasks and deliver results
    consecutively. Have fun with the pipeline command feature of PowerShell. It’s
    a wonderful skill to acquire and shows in-depth understanding of PowerShell cmdlets.


    Most important of all, remember not to run any Stop commands on the shell to prevent
    the systems from completely shutting down.'
