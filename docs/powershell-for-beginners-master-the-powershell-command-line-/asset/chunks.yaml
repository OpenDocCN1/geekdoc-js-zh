    # 5. 命令：指 cmdlet（谓词命令）、函数、工作流和应用程序。


    ## 微软推荐的 cmdlet 命名方式


    以动词（Verb）开头，后面接连字符（ - `），最后以名词（Noun）结束。例如：`Get-EventLog`。为 cmdlet 设定命名公式可以更容易猜测要使用的命令。PowerShell
    中可用的动词只有约 100 个，且只有少数会被频繁使用。通过 `Help` 或 `Get-Command` 确认动词也是一项快速的任务。


    ## 别名 (Alias)


    大多数情况下，命令名称非常长，因为它们通常是一系列组合在一起的单词。输入由 15 个单词组成的命令可能相当麻烦。这时别名就派上用场了。别名是命令的昵称，是冗长完整版本的缩写。以下是获取命令别名的方法：`get
    alias –Definition Get-Service`


    结果应该如下：


    | 能力名称 |

    | :--- | :--- |

    | cmdletgsv | `Get-Service` |


    命令 `Get-Service` 的别名是 `gsv`。请记住，使用别名不会改变命令的任何属性。只有名称变成了缩写，所有其他元素和参数都保持相同，唯一的区别就是别名。


    在处理和使用别名时，可能会出现这种情况：无论你如何尝试解析别名，都无法想起对应的命令名称。在这些时刻，请求 `Help` 帮助以澄清该别名代表哪个命令名称。使用上面的示例，请输入：`help
    gsv`


    控制台应反映下方的图 4.2。


    ![](img/00012.jpeg)

    图 4.2


    图 4.2 非常清楚地显示了命令的完整名称、组成命令的参数集以及它的别名。当对别名的含义感到困惑，进入 `Help` 请求信息始终是最佳解决方案。


    某些任务或项目可能会让你希望创建自己的别名。好消息是！你实际上可以为特定项目自定义别名。只需输入 `New-Alias` 以及你想要创建的别名。但请注意，你创建的新别名仅在当天的会话有效。如果你下次会话还需要它，则必须重新创建。


    ## 使用参数快捷径


    既然提到了快捷径，你会很高兴地发现可以创建参数的更短版本。以下是实现它的各种方法：


    - **截断 (Truncating)**：PowerShell 能够识别每个产品名称，即使只输入前 5 个字母。只需确保按下 Tab 键，以便 PowerShell
    补全名称，你就可以检查设置参数名称是否正确。

    - **参数别名 (Parameter Alias)**：这是一个如何查找参数名称别名的示例。加粗字体部分可以替换为未来你想要检查别名的命令名和参数名。`PS
    C:\> (get-command get-eventlog | select –ExpandProperty parameters).computername.aliases`

    - **位置参数 (Positional Parameters)**：当参数被括在 `[ ]` 方括号中时，它就是位置参数。这里有一个快速测试，识别下方图
    4.3 中的两个位置参数。


    ![](img/00013.jpeg)

    图 4.3


    如果你的答案是 `[–Path]` 和 `[-Filter]`，那么你是正确的。对于位置参数，并不强制输入参数名称，这可以节省时间。有一个选项可以保持它们的原样。


    ## Show-Command


    这是一个语法格式的图形化表示，你可以在给定的参数集中输入每个参数的值。参见提供的图 4.4。


    ![](img/00014.jpeg)

    图 4.4 Show 命令框


    与其手动输入语法或参数的每个单词和符号，不如进入 `Show-Command` 选项。它允许在框中输入必填字段，并且可以要求运行命令，或者在填充框后将其复制到控制台。


    这让工作变得简单得多，因为它为你创建了参数集。你只需要在每个参数上输入值和名称。手动输入语法或参数集的参数时，发生错误的概率非常高。`Show-Command`
    框减少了出错的可能性，因为它会以数字方式在参数集上添加正确的符号、名称和单词。


    如果你在获取参数集的正确语法遇到困难，只需输入 `show-command space`、命令名并按回车。控制台屏幕应该像图 4.5。在每个框中添加值。


    如前所述，使用 `show-command` 有选项。第一种是运行命令。完成要求后，点击框下方的 run 标签，它将直接运行命令。


    第二种选项是复制并粘贴到控制台。点击 copy，返回 shell 并粘贴命令 –ctrl + V。第二种选项的棒之处在于，你将看到语法的完整格式，以及每个参数的完整值和名称。这是熟悉命令完整详细语法信息的绝佳方法。参见图
    4.5 查看 `get-eventlog` 命令的完整语法。


    ![](img/00015.jpeg)

    图 4.5


    ## 外部命令 (External Commands)


    每台新购买的 Windows 计算机系统中都内置了至少 400 个 cmdlet。每个新的 Windows 服务器操作系统内部还有成千上万个内置 cmdlet。PowerShell
    还规定管理员在需要时可以创建自己的 cmdlet。例如，如果管理员以前具有 `NsLookup`、`Ipconfig`、`Net` 等方面的经验，并且实际上拥有这些程序的
    cmdlet 集合，那么非常有可能将它们导出到 PowerShell，并像在之前的程序中那样使用它们。


    有一点提示：不要期望所有导出到 PowerShell 的外部命令都能完美运行。由于它们不是 shell 的原生命令，错误将会很。在过去，特别是 PowerShell
    版本 1 & 2 时，必须添加准确的参数并手动修改外部命令，以便在 shell 内部无缝运行。这对于具有多个参数字符串的复杂外部命令来说尤为如此。


    但不要灰心。手动修正外部命令的日子已经结束了。从 PowerShell 版本 3 发布以来，无法在 PowerShell 中正常运行的外部命令已变得完全可用。这是通过在点击运行按钮之前外部命令前添加两个连字符解决的。


    ## 解析错误消息


    images/00016.jpeg)

    图 4.6


    PowerShell 错误消息是当 PowerShell 无法理解发送给它的命令时反映在控制台上的红色文本。错误信息的棒之处在于它非常清楚地说明了 PowerShell
    认为哪里错误，并且通常会提供如何解决问题的建议。就像上面的示例。


    当 PowerShell 发送错误消息且不清楚如何处理时，有三种方法回到正轨：


    1. 询问 `Help` 获取答案。

    2. 确保语法上所有的参数信息都是准确的。

    3. 进入 `Show Command` 检查准确的语法信息。


    ## cmdlet 输入规则


    虽然 PowerShell 完全不在乎命令上的字母是大写还是小写，但它非常在意 cmdlet 或命令中的空格和连字符。如果搞错了，你就会看到控制台上到处都是红色字体。


    在输入命令或 cmdlet 时必须记忆的强制规则有：


