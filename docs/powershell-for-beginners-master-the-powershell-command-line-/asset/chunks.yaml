    A bit of information about commands, all commands have a parameter that follows
    it. This is a mandatory formula. A parameter is the word, phrase or symbol that
    is typed after the command or cmdlet to identify the item that the shell is being
    asked to retrieve or search for.


    For the `Get-Help` or `Help` cmdlet, the parameter is a name parameter. It means
    when asking for help from the Help system just type in the name of the topic you
    would like it to give you information on.


    For example, the task is to clear an ‘event log’. You would like to ask `Help`
    for the command `run` or cmdlet on how to accomplish clearing an ‘event log’.


    Type `Help` space `log` or `Help` space `event` on the console. Add the wildcard
    symbol `*` because you are searching for all possible options. If you do not add
    the wildcard symbol `*` the result will be limited. It should look like this:


    `Help *log*`


    `Help *event*`


    The list of results should appear on the console screen. See Figure 3.3 below.


    ![](images/00008.jpeg)


    Figure 3.3


    Notice how all of the items in the list refer to event logs topics. Eleven of
    which are actual command runs or cmdlet and the rest are functions. Now choose
    the item that best suits your requirement. The top item `Clear-Eventlog` looks
    like it is the best choice. Now you have the accurate cmdlet to ask `Help` for
    information on the topic: `Help Get-Eventlog`. Follow the same formula when asking
    `Help` for information on other cmdlets.


    ### Tab Completion


    We discussed this in the early chapters. It’s good to be reminded again to get
    into the habit of pressing the tab when typing in the console. Tab completion
    allows you to complete the word you are typing to its closest match. It shows
    the many command, functions, scripts options available in the shell. It adds to
    your knowledge of what is inside the shell. If the information a tab generates
    is not accurate it is not necessary to type another word just press the tab again
    and it will cycle through the options. Stop when the tab shows the accurate word.
    Tab completion makes the work so much easier and faster.


    ### Wildcard


    Much like tab completion the `*` wildcard symbol completes the entire word you’re
    asking `Help` to give you information on. Just add in the `*` wildcard symbol
    after a letter and `Help` will be able to narrow down the choice to the exact
    Help topic of the search.


    For example, type into the console `Help EventL*`. You’ll find that `Help` did
    not go through all of the possible event log items it has in its system like it
    did when you typed in `Help log` or `Help event`. Instead it went directly to
    the Help file of `EventLog`. The `*` wildcard symbol cuts to the chase and brings
    you directly to the topic.


    ### Summary Help


    If you typed in `Help EventL*` then below is how the console screen should look
    like.


    ![](images/00009.jpeg)


    Figure 3.4


    Figure 3.4 is the Summary Help. It describes the name of the command. In this
    case `Get-EventLog`. And it provides information on the syntax of the command.
    Syntax is the use of the command.


    ### Interpret a Help File


    Looking at the summary help provided in figure 3.4 notice how there are 2 different
    parameter sets underneath syntax. This means there are 2 unique ways to run this
    particular command depending on the parameter set chosen. Parameters are all the
    items enclosed in a `[ ]` square bracket.


    Both parameter sets starts with `Get-EventLog`. That’s how we identify there are
    2 sets of parameters. The first one has more parameters than the second one. Notice
    also how the 2 parameter sets have a parameter in common. They both have the parameter
    `[Computer Name]`. Conversely, there will always be special parameters that will
    exist only in one parameter set. `[AsString]` and `[List]` are the unique parameters
    in the shorter parameter set. And several parameters in the longer parameter set
    cannot be found in the shorter parameter set.


    A command with a syntax that has 2 parameter sets means it is possible to use
    both sets to run the command provided you only use the shared parameters. If you
    use a special parameter which only exists in one parameter set in the case of
    the above example, `[AsString]`, then you’re stuck with working with the parameters
    found in that parameter set. To work with multiple parameter sets and to have
    access to a larger pool of parameters best avoid using unique parameters not shared
    by multiple parameter sets.


    ### Different Types of Parameters


    Let’s define and distinguish parameters to gain a better understanding of their
    function.


    - **Mandatory Parameters**: Any parameter that is not inside a `[ ]` square bracket
    is mandatory. In Figure 3.4 `string` is a mandatory parameter.

    - **Optional Parameters**: These are the parameters in `[ ]` brackets. To run
    a command it is not mandatory to use every parameter on the set. In fact most
    are optional because the information can be provided by the system. Notice that
    in the short parameter set in Figure 3.4 all the parameters are optional.

    - **Positional Parameters**: Some parameters appear in all syntax language strings
    that it is not necessary to type them in every time a command is run. These are
    positional parameters. In Figure 3.4 the positional parameter is `[InstanceId]`
    because it has a `[ ]` square bracket within another set of `[ ]` bracket. This
    means you can keep that parameter but it is necessary to add value to the position
    `<long[]>`.


    ### Parameter Values


    For information on understanding parameter values or the input that a parameter
    requires to run a command refer to Figure 3.5 below:


    ![](images/00010.jpeg)


    Figure 3.5 Parameter Values


    First, switches. A switch is a parameter that is stand alone and will not require
    a value. In Figure 3.5 an example of a switch is `[AsString]`. In dealing with
    the full syntax of a command a switch will be clearly indicated as a switch so
    that administrators know not to put a value on them.


    For parameters that require a value input this is how to identify them:

    1. When a parameter is inside a `[ ]` square bracket separated by a space from
    another parameter. Example: `[LogName] <string>`


    When a parameter is stand alone and does not require a value this is how to identify
    them:

    1. When a parameter is followed by an equal sign, colon, square bracket, etc.
    Example: `[AsString]`


    ### Types of Parameter Values


    1. **DateTime**: A parameter value that can be seen as a date. Therefore expect
    it to be a string of numbers. Example: `12-01-2012`. DateTime is often dictated
    by the regional settings of the computer.

    2. **String**: Combination of letters and numbers. If there is a space between
    a string should be encased in quotation marks.

    3. **Int, `Int64`, `Int32`**: `Int` stands for integer. Not a decimal but a whole
    number.


    ### Adding value to a string with a [ ] square bracket


    `[ComputerName <string>]`


    The `[ ]` square bracket in the above example means the parameter can add an array
    or list of strings. Example:


    **Single Value:**

    `Get –EventLog Security –computer Station-A2`


    **Multiple Values:** Each value should be separated by a comma & no space between.

    `Get –EventLog Security –computer Station-A2,AB5,Files02`


    **Multiple Values with space between:** Should be enclosed in quotation marks:

    `Get –EventLog Security –computer “Station-A2”, “AB5”, “Files02”`


    **Text File Values:** These values should be typed in single lines each.

    `Get –EventLog Security –computer Station-A2`, `Files02`, `Files07`, `Files30`,
    `AB5`, `AB8`


    If you want to read the contents of files the most effective way to do so is to
    force PowerShell to show the contents via the `Get-Content` cmdlet. The below
    syntax does exactly that. Notice the command to get content is in a parenthesis.
    That is the symbol that can get PowerShell to execute a command within a given
    parameter.


    ```

    Get –EventLog Security –computer (Get-Content names.txt)

    ```


    Command Help to Get Examples

