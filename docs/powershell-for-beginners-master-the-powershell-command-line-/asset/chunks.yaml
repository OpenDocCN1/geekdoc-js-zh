    External Commands


    Every newly purchased Windows computer will have at least 400 cmdlets built in
    to the system. Inside each new Windows server operating system are thousands more
    built in cmdlets. There is also provision in the PowerShell for administrators
    to create their own cmdlets that they can add into the existing ones if the need
    arises. Windows PowerShell was designed to be very open, inclusive, and compatible
    to cmdlets developed and used for other similar programs.


    If an administrator has for example prior experience with NsLookup, Ipconfig,
    Net and the like. And have in fact sets of cmdlets from these programs, then it
    is very possible to export them to PowerShell and use them as they would in the
    previous programs or shells.


    A bit of a caveat: do not expect all the external commands exported to PowerShell
    to work flawlessly. Errors will be common since they are not commands native to
    the shell. In the past, especially with the PowerShell Version 1 & 2, it was necessary
    to add accurate parameters and manually make changes to the parameters of the
    external command so that it works seamlessly inside the shell. This was particularly
    true for the more complicated external commands with multiple strings of parameters.


    But take heart. Those days of manually correcting external commands are over.
    Ever since PowerShell version 3 was released external commands that would not
    properly run on the PowerShell became fully functional. It was solved by adding
    2 dash lines in front of the external command before hitting the run button.


    Interpreting an Error Message


    ![](images/00016.jpeg)


    Figure 4.6


    PowerShell error messages are the red text that gets reflected on the console
    when PowerShell cannot understand the command that has been sent to it. The great
    thing about error messages is it is very clear about what PowerShell considers
