    If you are the sort of administrator who likes tinkering around with the systems
    and love to learn by trial & error then asking `Help` to give you examples of
    commands will be something of interest. This is the syntax to get `Help` to show
    command examples:


    `Help Get-EventLog –examples`


    Go ahead and test the list of cmdlet examples that `Help` has provided. Just make
    sure you are working on a computer that is not connected to your company’s systems
    so that your Windows production line does not get affected in case you encounter
    errors while testing the examples list.


    ## Command Help to Get Common Parameters


    Looking back at Figure 3.5, the example presented for interpreting parameter values.
    If we look closely at the 2 sets of parameters on the syntax we will notice that
    they both end with `[<CommonParameters>]`. `<CommonParameters> ` is a set of eight
    parameters that will always be found in every cmdlet.


    Let’s command `Help` to give us more information on `<<CommonParameters>]`. Type
    the command below on the console:


    `Help common*`


    The result should be `About_common_parameters`. There should not be any other
    options because of the `*` wildcard symbol. Plus there are no other Help topics
    on common parameters. That is it.


    Look through `About_common_parameters` and see the 8 parameters found in `<[CommonParameters>]`.
    They are:


    - `-Verbose`

    - `-Debug`

    - `-WarningAction`

    - `-WarningVariable`

    - `-ErrorAction`

    - `-ErrorVariable`

    - `-OutVariable`

    - `-OutBuffer`


    `About_common_parameters` is just one of the ‘about’ topics available in the Help
    System. If you wish to see all the other ‘About’ topics then type in the console:


    `Help about*`


    Go ahead and feel free to tinker around and sift through the myriad more documentation
    PowerShell has tucked away in Help. Always an advantage for any administrator
    to have information on the piles of information that PowerShell has in storage.


    ## How to Access Online Help


    From the beginning we have recommended developing the habit of updating the Help
    System on a monthly basis. The Help System is being constantly updated and will
    remain to do so for as long as PowerShell is being utilized. The best way to update
    `Help` is to access the online version of `Help`. It is and will always be the
    most updated version. Everyone involved in the development of PowerShell add and
    contribute to updating the Help System online. It would be good to have all that
    new information added to your PowerShell’s Help System on a regular basis. Below
    is the command for accessing PowerShell Online Help:


    `Help Get-EventLog -online`


    Make it a habit to visit Online Help and update your Help System on a monthly
    basis. You will thank yourself for it when encountering new & complex Windows
    PowerShell command & scripting tasks.


    ## Laboratory Test


    1. Make sure you have successfully installed `Update-Help`.

    2. Find cmdlets that can output into files.

    3. Find cmdlets that can output to a printer.

    4. What is the command for writing an event log?

    5. Command `Help` to get the recent 50 entries from the security event log.


    Reminder: Visit online sources like `MoreLunches.com` to find the answers if stuck
    with the test. In fact much like Updating `Help` it is highly recommended to make
    a habit to check reliable online resources on a regular basis also to get the
    most recent news about Windows PowerShell. Keeping abreast with everything new
    about PowerShell will translate to improved work efficiency.


    # Chapter 4: Working with Commands – Finally!


    Every systems administrator, web developer, IT professional have one thing in
    common. Everyone, every single one of us went through and started with one task
    at the onset of our careers. That task is running commands. And there is no other
    better computer system that provides command-line support out there but Windows
    PowerShell.


    That is what PowerShell was developed for – to run commands. It is not accurate
    when people say Windows PowerShell is a scripting tool. It can do script but it
    was developed first and foremost to run commands. Any other additional functions
    it can deliver on are secondary to its ability and purpose to run command-lines.


    ## It’s a Shell


    Like other shell’s, for example `Cmd.exe`, `MS-DOS`, `Unix Bourne`, and `Unix
    Bash`, the way to use PowerShell is very simple. Type a command, add the desired
    parameters to tell the command how to behave, press Enter and see the output.


    To make a PowerShell script is very easy. Just type up a script and add `.PS1`
    in the end of the file. Voila! You now have a PowerShell script. It is possible
    to create very complex PowerShell scripts, as complex as you would like them to
    be. It is also very possible for PowerShell to be able to run that script and
    achieve the result the script was created for.


    A lot of IT professionals with advanced skills have been known to throw in the
    most complex scripts imaginable with PowerShell being able to run the command.
    That is how dependable and equally complex PowerShell is. It will be able to give
    something back no matter what you throw at it.


    But if you are a systems administrator who only wants to solve the day to day
    tasks generated by a company’s integrated computers systems. The ability to create
    complex scripts is not as important as the ability to run commands that solve
    system questions and glitches. So mastery of the command runs of PowerShell is
    so much more important than challenging PowerShell with complicated script combinations.


    If we are going to be realistic and practical about PowerShell getting really
    good at running commands and getting familiar with PowerShell functions and features
    is so much more important than creating the most impressive script that can be
    created. Make good use of your time and understand the real priorities.


    ## The Elements of a Command


    ![](images/00011.jpeg)


    Figure 4.1


    Above is a detailed listing of each element or item that makes up a command. It
    is imperative in the understanding of PowerShell and its functions to understand
    the composition of a command. So, let’s start. Refer to Figure 4.1 above.


    1. `Command`: Also referred to as the cmdlet. All cmdlets have a verb-noun format.

    2. `Parameter 1 Name`: `LogName` is the parameter name of parameter 1. If a parameter
    name contains a punctuation or space it will be necessary to add quotation marks.

    3. `Parameter 1 Value`: `Security` is the parameter value of `Logname`.

    4. `Parameter 2 Name`: `ComputerName` is the name of Parameter 2. If a parameter
    name contains a punctuation or space it will be necessary to add quotation marks.

    5. `Parameter 2 Value`: `Win8` and `Server1` are the values of `ComputerName`.

    6. `Parameter 3 Name`: `Verbose` is the name of Parameter 3. It is a common parameter.
    It does not get a value.


    ## Rules for Creating a Command


    1. Always add a space between the command name and the first parameter name.

    2. Always start add a dash before every parameter name. Do not add a space between
    the dash and the parameter name.

    3. Always separate the parameter name from its value with a space.

    4. Always separate a value from the next parameter name with a space.

    5. Typing a command will never be case-sensitive.


    Again, perfection in typing a command results in desired error free result. Practice,
    practice, practice typing skills and know by heart the rules for creating a command.
    When you do working with PowerShell will always be smooth sailing.


    ## Terminologies


    1. `Cmdlet`: It is pronounced, command-let. It is a command utility exclusive
    to PowerShell and therefore can only be operational in PowerShell. The framework
    language is `.NET`

    2. `Function`: Almost the same as cmdlet except it is not written in the .NET
    framework. Instead it is written using PowerShell’s own scripting language.

    3. `Workflow`: It is compatible with PowerShell’s workflow system. The workflow
    is also a function.

    4. `Application`: a command-line utility which is externally executable.

