    ## 2. “x64” Operating System


    To check, go to start menu. Open the apps folder. Look for the `Windows PowerShell`
    folder. If inside you find the files `Windows PowerShell` and `Windows PowerShell
    ISE` then you have the right OS. That means that version of the `Windows PowerShell`
    is the required 64-bit version.


    NOTE: The “x86” version that is the 32-bit operating system is not compatible
    with the instructional materials of this book. It is recommended to upgrade to
    the 64-bit version of the OS.


    ## Get the PowerShell Running


    Although in most PCs the `Windows PowerShell V3` is already pre-installed it’s
    always good to check if the computer you are using actually has it. It’s easy
    to check if the `PowerShell V3` is installed in the computer.


    Go to Start Menu, click on Apps, and open the `Windows PowerShell ISE` Folder.
    On the `Windows PowerShell` console type `$PSVersionTable` and press Enter. Check
    `PS Version` information that will appear on the screen. It should say version
    `3.0`. If it does not then you will have to make an upgrade.


    If you have to install an upgrade then visit [http://download.microsoft.com](http://download.microsoft.com).
    Go to search box and enter `PowerShell 3`. Download `Windows Management Framework
    3.0` which should have the `PowerShell V3`. Reminder to download the 64-bit package
    as it is the OS system that this book is compatible with.


    Note: `Windows PowerShell V3` has 2 components to choose from to engage the shell.
    The first is `PowerShell.exe`. It is the text based console host. The second is
    `PowerShell_ISE.exe`. It is the graphic based console. It provides a more visual
    Integrated Scripting Environment. Both work for the purpose of this book. So,
    it’s a matter of preference for the reader. The book however is geared towards
    the `.exe` console host version. The recommendation is to work with that console.


    ### Customizing the Shell for PowerShell.exe


    If you have decided to use the text based `PowerShell` console, we highly recommend
    customizing the console features before starting work on the shell. Some changes
    to consider:


    - **Font**: Click on the `PowerShell` icon, the control box located in the upper
    left of the console. Select properties from the `Menu`, in the dialog box browse
    through tabs to change the default font to `Lucida fixed-width font`. This is
    the optimized font for the `PowerShell` commands function. To ensure the words,
    characters and symbols being typed in the console are readable increase the font
    size to more than the default font size `12`.

    - **Color**: It is also possible to change the color of the console background
    and foreground. Choose your preferred colors.

    - **Window Size**: The window size and the screen buffer should have the same
    width values.


    ### PowerShell V3 Online Resources


    For additional information on anything that concerns `PowerShell V3` go to `MoreLunches.com`.
    The website provides relevant information on code listings which can be downloaded.
    You’ll also find in the website answers to the book’s test questions. Articles,
    videos, and links to blogs about `PowerShell V3` can also be accessed in the website.


    # Chapter 2: Say Hello To PowerShell


    It’s been mentioned in the introduction that there are 2 types of consoles available
    to the `Windows PowerShell` user. Well, to be exact there are actually 4 console
    options. To preview go to Start, open All Apps. Figure 2.1 shows the desktop screen
    view after clicking on `Apps`.


    ![](images/00001.jpeg)


    Figure 2.1


    We said earlier that there are 2 types of consoles available on the `Windows PowerShell`.
    These are the text based and the graphics based consoles. It was also mentioned
    that there are 2 kinds of OS systems that power the `Windows PowerShell`. These
    are the 64-bit OS system and the 32-bit OS system.


    On the desktop view of the `PowerShell` icons the 32-bit system text and graphics
    based consoles are the ones with the `(x86)` sign while the 64-bit versions are
    the ones without.


    NOTE: For the purpose of the book, it is recommended to work with the 64-bit system
    using the standard `.exe` text based console.


    ## The Standard PowerShell Console Window (Text Based)


    ![](images/00002.jpeg)


    Figure 2.2


    Throughout the book we will be using this `PowerShell` console. See figure `2.2`.
    The reason being it is a simpler and less complicated console than the graphic
    based option.


    ### Configuring the text based console


    All tabs required to custom tailor the console can be found in the `Properties`
    tab on the control box of the window. The control box is the windows logo located
    in the upper left corner of the window. The properties folder will have the following
    tabs:


    - **Options**: Recommend to increase the size of the `Command History Buffer Size`.
    Important because you would like to be able to read clearly information on the
    commands typed in the past.

    - **Font**: The preferred font is `Lucida fixed width-font`. Font size should
    be more than the `12` default size. Since much about working with command runs
    is typing accuracy you would like to make sure every letter and symbol you are
    typing is accurate. And the best way to check is with a big font that allows you
    to see the exact character on the screen.

    - **Layout**: Width sizes should have the same numbers so that the window fits
    exactly in the screen. Avoid extending the console size too much to the point
    where certain areas are no longer visible on the screen. It ensures all information
    typed on the screen is readable.

    - **Colors**: If you prefer to see different background, font, and foreground
    colors, go ahead. Color schemes are up to you but in case you tweaked them to
    the point that you are no longer happy with what you see, there is always the
    option to go back to the default blue and white.


    ## The Integrated Scripting Environment (ISE) Console


    The upside of using the graphics based console `(ISE)` is that it supports double-byte
    character sets and, since it is meant to be more visual, it is a nier `PowerShell`
    console to work with. Another advantage is it does more to help create `PowerShell`
    commands and scripts for advance users. And unlike the text based version you
    can copy-paste items on the console. See figure `2.3` for the screen view of the
    `ISE`.


    ![](images/00003.jpeg)


    Figure 2.3 Integrated Scripting Environment (ISE)


    The `ISE` has limitations though, some of which are: it does not support transcription,
    it takes longer than the text based console to get working, and it needs `Windows
    Presentation Foundation (WPF)` for it. This means the hardware or the computer
    should have `GUI` installed otherwise the `ISE` will not function.


    Many `Windows PowerShell` users prefer to start with the text based console and
    move up to using the `ISE` version. Since the `ISE` was designed for a more optimized
    command run and scripting experience the eventual shift to the `ISE` has been
    observed from all Windows administrators using the `PowerShell`.


    Since the book was written for `PowerShell` beginners it is only appropriate to
    begin with the text based console. There will be plenty of time transition to
    the `ISE` console. For a start, might as well get comfortable with `PowerShell.exe`
    first.


    ## No Typos!


    Since the `PowerShell` is a `command-line interface`, expect to do a lot of typing.
    And that means accurate, error free typing. Literally no typos allowed because
    otherwise the console will not be able to generate the right answers and responses.


    Let’s give it a try. You might as well start getting comfortable with the tab
    selection function of the console. Let’s go through several exercises:


    1. `Get-S`, press `Tab` several times, and then press `Shift-Tab`. `PowerShell`
    will cycle through files. The intention is for the user to scan through the options
    to get at the right tab required. When done, press `Esc` to clear the console.


    2. Press `Dir space c:\` and then press `Tab`. `PowerShell` will cycle through
    folders much like in exercise `1`. Press `Esc` again to clear the console when
    done.

