    of 15 word combinations. That’s where an alias comes in handy. Aliases are nicknames
    for commands, the abbreviated version of an otherwise very lengthy complete version.
    Here’s how to get the alias of a command: get alias –Definition *Get-Service* 


    The result should look like this:


    Capability Name


    cmdletgsv -> Get-Service


    The alias of the command Get-Service is gsv. Reminder the use of an alias does
    not change anything about the command. Only the name gets an abbreviated version
    all other elements and parameters are the same the only thing different is the
    alias.


    In dealing and working with aliases there will be instances where no matter how
    much you try decrypting the alias the command name it represents will escape you.
    During these moments ask for assistance from Help to clarify what command name
    the alias stands for. Using the example above, go ahead type: help gsv


    The console should reflect Figure 4.2 below.


    ![](images/00012.jpeg)


    Figure 4.2


    Figure 4.2 shows very clearly the complete name of the command, the parameter
    sets that make up the command, and its alias. When stumped for the meaning of
    an alias going to Help and asking for information is always the best solution.


    There will be certain tasks or projects that will make you wish you can create
    your own aliases. Good news! You can in fact customize an alias for specific projects.
    Just type in New-Alias and the alias that you’d like to create. Note however that
    the new alias you created will only be good for the session on the day it was
    created. You have to create it again if you require it for the next session.


    Taking the Short Cut with Parameters


    Since we are on the topic of short cuts you’d be happy to know that it is possible
    to create shorter versions of parameters. Here are the varied ways to do it:


