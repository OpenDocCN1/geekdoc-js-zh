    , q, \"What is\", a, \"times\", b)\n    answer = input(\"?\")\n    answer = int(answer)\n\
    \    if answer == a * b:\n        print(\"correct\")\n        s = s + 1\n    else:\n\
    \        print(\"wrong\")\nprint(\"You scored\", s, \"out of 10\")\n```\n\nSet\
    \ score variable (s) to zero.\n\nStart a loop that runs from 1 to 10.\n\nAsk the\
