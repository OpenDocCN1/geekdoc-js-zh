    # TECHNICAL GUIDE


    The simple programming language Logo is an excellent tool for children to learn
    some simple coding. Each instruction they type will have an immediate effect,
    enabling them to quickly explore and experiment. With a small number of short
    commands, they can create simple drawings, shapes and patterns.


    # GETTING HOLD OF LOGO


    Because Logo was designed over 40 years ago, it won''t allow you to create the
    same sort of games as some other computer coding languages, but it is a great
    way to learn about some key coding concepts.


    If you are using a PC, it is worth downloading Logo. The online versions use the
    same instructions but can be a bit more fiddly to use. You can download a version
    for free from:

    **www.softronix.com/logo.html**


    Alternatively, both Mac and PC users can work with Logo online. Visit:

    **www.calormen.com/jslogo/**


    or

    **http://turtleacademy.com/playground/en**


    # USING LOGO


    To get started with Logo, just click in the command box and type a command (see
    opposite for useful commands). For example, type **fd 50** and press **''Enter''**.
    Each version of Logo is slightly different. Some have **''Run''** buttons and
    some don''t. If your version doesn''t, press **''Enter''** after typing a command.


    There are two ways to type longer programs that have multiple commands. Children
    can type the first command, then press ''Enter'', then the second command, press
    ''Enter'' and so on. Alternatively, to type all the commands in one go, type the
    first command, then press ''Space'', type the second command, press ''Space''
    and so on.


    For example: **fd 50 rt 90 fd 50 lt 90 fd 100 – then press ''Enter''**.


    Press the up and down cursor keys to bring back the last few commands you have
    typed.


    ![](img/67c80c813fc5d30d52471ee1f484e615_51_0.png)


    This is the drawing area.


    This is the turtle.


    This is the command box.


    Type your program here.


    Click **''Run''** to test your code or press the **''Enter''** key.


    ```

    fd 50 rt 90 fd 50 lt 90 fd 100

    ```'
- md: ' ## USEFUL LOGO COMMANDS


    ## DIRECTING THE TURTLE


    | Command | Description |

    |---------|-------------|

    | fd 50 | Move forward 50 steps. |

    | rt 90 | Turn right 90 degrees. |

    | lt 90 | Turn left 90 degrees. |

    | bk 50 | Move backward 50 steps. |

    | cs | Clear the drawing box. |

    | seth 0 | Make the turtle point up. |

    | st | Show turtle. |

    | ht | Hide turtle. |


    You can type ''forward'' instead of ''fd''. It doesn''t matter in Logo if you
    use capital letters or not. Most other languages are more fussy. Remember you
    can change the number after the command, to alter how far the turtle turns or
    moves. This number is called the parameter.


    ## POSITIONING THE TURTLE


    | Command | Description |

    |---------|-------------|

    | setpos[ 100 200 ] | Set the position of the turtle to 100, 200. |

    | setx 100 | Set the x coordinate (left to right) to 100. |

    | sety 200 | Set the y coordinate (bottom to top) to 200. |

    | wrap | When the turtle goes off the edge of the screen, wrap around and re-appear
    on the other side. |

    | fence | When the turtle reaches the edge of the screen, hit an invisible fence
    and stop. |


    ## DRAWING


    | Command | Description |

    |---------|-------------|

    | pu | Pen up: lift the pen up and stop drawing. |

    | pd | Pen down: put the pen down to draw. |

    | setpc 5 | Set the pen to colour number 5. (Most computer languages use numbers
    to represent colours.) |

    | setpensize 5 | Set thickness of line drawn by turtle to 5. |


    ## LOOPS


    | Command | Description |

    |---------|-------------|

    | repeat | Repeat a sequence of commands a specific number of times. For example:
    **repeat 4 [ fd 100 rt 90 ]** will repeat four times, forward 100 then right 90
    degrees. Both square brackets must be included to make the code work. |


    ## PRINTING


    | Command | Description |

    |---------|-------------|

    | print 10+10 | Output 20 on the screen. |

    | print heading | Print the heading (angle the turtle is facing) on the screen.
    |

    | print xcor | Print the current x value of the turtle on the screen. |

    | print ycor | Print the current y value of the turtle on the screen. |

    | ct | Clear any printed text from the screen. |


    ## ANGLES


    Learners need a basic understanding of degrees to make use of Logo. Knowing that
    90 degrees make a right angle or quarter-turn is necessary to draw simple shapes.
    However, Logo also gives children a perfect environment to explore and develop
    the concept of angles. Once your children have grasped how to draw a square using
    **rt 90** to turn the corners, ask them to try changing the 90 to 45 and see what
    happens.


    ## ESTIMATION


    Once children have learnt how to move the turtle 10 or 20 steps forward, try asking
    them questions like: ''How many steps will we need to move forward to reach the
    edge of the screen?'' Or put your finger on the screen and ask: ''How many steps
    will move the turtle to my finger?''


    ```

    fd 60

    rt 45

    fd 60

    rt 45

    fd 60

    rt 45

    fd 60

    ```


    Logo!


    ## SCRATCH TECHNICAL GUIDE


    Scratch is a programming language that uses a similar approach to Logo, making
    a turtle (called a ''sprite'' in Scratch) move around the screen. However, with
    Scratch you drag and join commands instead of typing them. Scratch is great fun
    for learning to code games and creating graphics and sound effects.


    ## GETTING HOLD OF SCRATCH


    You can use Scratch on a PC or Mac by opening your web browser and going to:

    **http://scratch.mit.edu**

    Then click ''Try it out'' or ''Create''.


    There is a very similar website called ''Snap'', which also works on iPads. It
    is available here:

    **http://snap.berkeley.edu/run**


    If you want to run Scratch without using the internet, you can download it from
    here:

    **http://scratch.mit.edu/scratch2download/**


    ## USING SCRATCH


    ## SAVING YOUR WORK


    Click the ''File'' menu at the top of the page on the left.

    Then click:


    **Download to your computer** – to save a file.

    **Upload from your computer** – to open a file you saved earlier.

    **New** – to start some new work.


    ## USEFUL SCRATCH COMMANDS


    | Category | Command Description |

    | :--- | :--- |

    | **MOTION GROUP** | Move sprite forward. |

    | | Rotate sprite right. |

    | | Rotate sprite left. |

    | | Point the sprite up, down, left or right. |

    | | Point the sprite towards the mouse or another sprite. |

    | | Set sprite x coordinate (left to right). |

    | | Set sprite y coordinate (up or down). |

    | **LOOKS GROUP** | Show message. |

    | | Show message then hide it. |

    | | Show sprite. |

    | | Hide sprite (make it disappear). |

    | **SOUND GROUP** | Play or record a sound file. |

    | | Play a musical note. |

    | | Choose which instrument will play it. |

    | | Play a drum beat. |

    | **PEN GROUP** | Clear the screen. |

    | | Draw when the sprite moves. |

    | | Don''t draw. |

    | | Choose colour to draw with. |

    | | Choose line thickness. |

    | **EVENTS GROUP** | Run commands below when the green flag is clicked. |

    | | Run commands below when the selected key is pressed. |

    | **CONTROL GROUP** | Repeat commands inside the ''C'' 10 times. |

    | | Repeat commands inside the ''C'' forever. |

    | | Repeat commands until the condition in the hexagon is true. |

    | | If the condition in the hexagon is true, run the commands. |

    | | If the condition in the hexagon is true, run the commands in the top ''C'',
    else run the commands in the bottom ''C''. |

    | **SENSING GROUP** | Ask the user a question. |

    | | Stores the answer to a question. |

    | | Use with ''Repeat until'' or ''if'' to check whether objects are touching.
    |

    | | Use with ''Repeat until'' or ''if'' to check the colour the sprite is touching.
    |

    | **OPERATORS GROUP** | Use with ''Repeat until'' or ''if'' to check values are
    equal. |

    | | Make a random number. |


    ## COMMON PROBLEMS


    - 1. Commands are in the wrong order. Try swapping blocks around to see if that
    fixes the problem.


    2. Children often confuse turning left with turning right, or setting x with setting
    y coordinates. Keep handy a diagram or a ''paper turtle'' marked with L and R.

    3. When more than one sprite is used, it is easy to forget to click on the correct
    sprite before adding or changing code.

    4. Some settings persist. For example, try clicking ''Pen down'' before making
    a program to draw a shape (but omitting the ''Pen down'' command from within the
    program), then save the program. The shape will draw because Scratch ''remembers''
    the ''Pen down'' command. However, if you open the program the next day, the shape
    won''t be drawn, because ''Pen down'' was not part of the program.

    5. The ''Touching color'' command block is tricky to use. Make sure the colour
    being checked for is exactly the same as the required colour by using the colour
    picker.


    ## PYTHON TECHNICAL GUIDE


    Python is a computer language that will help children learn more complex ideas
    and techniques. With Python, all commands need to be typed carefully to create
    programs. Python is free to download and comes with something called IDLE that
    lets you type and edit Python programs.


    ## GETTING HOLD OF PYTHON


    | Installing and running Python on a PC | Installing and running Python on a Mac
    |

    | :--- | :--- |

    | 1 Go to www.python.org. | 1 Go to www.python.org. |

    | 2 Click ''Downloads'' then choose ''Download Python'' (version 3.4 or higher).
    | 2 Click ''Downloads'' then choose ''Download Python'' (version 3.4 or higher).
    |

    | 3 Double-click the downloaded file, then follow the instructions on screen.
    | 3 Double-click the downloaded file, then follow the instructions on screen.
    |

    | 4 Click the ''Start'' button, click ''Python'' then click ''IDLE''. (In Windows
    8, go to the top right of the screen and click ''Search'', then type in ''idle''
    and click the program to run it.) | 4 To start using Python quickly, click ''Spotlight''.
    |

    | | 5 Type ''idle'' then press ''Enter''. |


    | USING PYTHON | SAVING YOUR WORK |

    | :--- | :--- |

    | When you want to create a new Python program: | Click the ''File'' menu at the
    top of the page on the left. Then click: |

    | • Start IDLE, the Python editor. | **Save** – To save a file onto your computer.
    |

    | • Click ''File'' then ''New''. Type your code into the IDLE window. | **Open**
    – To open a file you have saved earlier. Or click ''File'' and ''Recent files''
    then choose your file. |

    | • Before you run a program, you first need to save it (see right). | **New**
    – To start some new work. |

    | • Then click the ''Run'' menu and ''Run module'' to run it, or press ''F5''.
    This will open a new window to show the output from your program. If you are using
    the turtle library, another window will open to show the graphics output from
    your code. | |


    ### MAKING AN ICON FOR PYTHON ON A MAC


    - This will make Python easier to find on a Mac:

    1. Open ''Finder''.

    2. Click on ''Applications''.

    3. Click on ''Python''.

    4. Drag the IDLE icon to the ''dock'' (menu bar) at the bottom or side of the
    screen.'
