    some commands to get them ready, using a loop within a loop:


    ```

    repeat 4 [ repeat 300 [ put on shoe ] ]

    ```


    Remind children that they need to put square brackets around the commands they
    are repeating. As there are two loops, there will need to be two left and two
    right brackets.


    # TAKING IT FURTHER


