    ```


    # PAGES 16–17 Repeat until caught


    ![](img/67c80c813fc5d30d52471ee1f484e615_19_2.png)


    # OBJECTIVES


    Using Scratch, children will program a chasing game using another ‘repeat until’
    loop. In this program, children will learn to code a second sprite, and the loop
    will repeat until the two sprites are touching.


    # COMMON CONFUSIONS


    Programming a second sprite can be fiddly. Children will need to follow the instructions
    carefully. Make sure that the cat and dog each get the right bit of code. There
    are two different ‘mini-programs’ or loops running here – one for each sprite.
    To change the code for a sprite, make sure that sprite is clicked first!


    ![](img/67c80c813fc5d30d52471ee1f484e615_19_3.png)'
  - '[PAGE 20]


    # PAGES 18–19

    Adding sound


    ![](img/67c80c813fc5d30d52471ee1f484e615_20_0.png)


    OBJECTIVES

    In ‘Adding sound’, we introduce using sound as an output within coding. Using
    Scratch, we will code a tune and create a piano program. The Scratch ‘Play note’
    command needs two values. The first controls the pitch of the note, and the second
    how long the note lasts.


    TAKING IT FURTHER

    After children have completed the piano program, they could add some new key press
    events to change the instrument. Each of these will use the ‘Set instrument’ code
    block. Now let them experiment!


    ![](img/67c80c813fc5d30d52471ee1f484e615_20_1.png)


    # PAGES 20–21

    Sound effects


    ![](img/67c80c813fc5d30d52471ee1f484e615_20_2.png)


    OBJECTIVES

    Children will extend their ability to code with sound by looking at how sound
    can be added into games and other programs. The exercises on these pages combine
    playing sounds with loops. Children will also use sound files that have been recorded,
    such as a meowing cat for the chasing game in Book 2 pages 16–17.


    TAKING IT FURTHER

    Children can record their own sound files in Scratch. You need a built-in microphone
    on the computer or an external one. Make sure microphones are set up correctly.


    +   1. To add your own recorded sound, drag a ‘Play sound’ code block onto the
    scripts area and click ‘Record’.


    ![](img/67c80c813fc5d30d52471ee1f484e615_20_3.png)


    +   2. Click the ‘Record’ button and create your sound. Then click ‘Stop’.


    ![](img/67c80c813fc5d30d52471ee1f484e615_20_4.png)


    +   3. Click the ‘Scripts’ tab.


    ![](img/67c80c813fc5d30d52471ee1f484e615_20_5.png)


    +   4. Click ‘Recording1’ to select your recording, then click the ‘Play sound’
    block.


    ![](img/67c80c813fc5d30d52471ee1f484e615_20_6.png)


    Try putting this ‘Play sound’ block in a program.'
  - '[PAGE 21]


    # BOOK 2


    # PAGE-BY-PAGE GUIDE


    # PAGES 22–23


    # Variables


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_0.png)


    # OBJECTIVES


    These pages explain variables, which are a key concept in any programming language.
    Before moving on to more complex exercises on the following pages, children will
    grasp the idea of variables by creating a simple program using a single variable
    in Scratch.


    # KEY CONCEPT: VARIABLES


    Variables are a way that computer programs store pieces of data or information.
    Unlike normal numbers, variables can change their value when something happens.
    Although variables can seem like quite an abstract idea, children will be familiar
    with the use of a score variable in games. They will be used to the idea that
    the value of the score in a game can change from being zero at the start – and
    will increase as the game progresses.


    # COMMON CONFUSIONS


    Some children may be confused by the difference between the letter a, the variable
    a and the value of the variable a. This is how Scratch handles variables:


    This just means: display the letter a. In many other programming languages, it
    would have speech marks round it – "a" – and be called a string.


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_1.png)


    This means: display the value of the variable a. In our code it looks like an
    a but when we run the code, it shows up as the value in a.


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_2.png)


    # PAGES 24–25


    # Keeping score


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_3.png)


    # OBJECTIVES


    Using Scratch, children will learn to create a score variable (called s) for a
    game. The variable will keep track of how long the game is running. At the start
    of the game, the value of s is set to 0. Every time the main loop in the game
    repeats, the value of the variable s (our score) goes up by 1.


    # COMMON CONFUSIONS


    It is important that children understand the difference between setting a variable
    to a specific value, and increasing it. Try swapping round the **''Set s to 0''**
    and **''Change s by 1''** code blocks to demonstrate what happens.


    # TAKING IT FURTHER


    When children are ready to try more, ask them to:


    +   1. Change the shark game to make the score go up in 2s, 5s or 10s. Then check
    the answers on page 62.

    2. Use a **''Say''** code block to display the score at the end of the game.


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_4.png)'
  - '[PAGE 22]


    # PAGES 26-27

    Counting clicks


    ![](img/67c80c813fc5d30d52471ee1f484e615_22_0.png)


    # OBJECTIVES


    This project will extend children''s understanding of variables: instead of having
    a score that is increased in the main repeat loop, the score will increase when
    the sprite is clicked. This project also recaps on working with loops and coordinates.


    # HOW THE CODE WORKS


    ```

    when [green flag] clicked

    set x to -180

    set [s v] to [0]

    repeat until <touching [edge v] ?>

    move (5) steps

    end

    say (s)


    when this sprite clicked

    change [s v] by (1)

    ```


    +   1. Start the program.

    2. Move the cat sprite to the left of the screen.

    3. Reset the score to 0.

    4. Repeat the commands in the loop until the sprite reaches the edge of the screen.

    5. Move the sprite.

    6. Show the score (if the program breaks out of the loop because the sprite reaches
    the edge).

    7. When the sprite is clicked...

    8. Make the score go up.


    # PAGES 28-29

    Debugging


    ![](img/67c80c813fc5d30d52471ee1f484e615_22_1.png)


    # OBJECTIVES


    These pages will teach children the vital skill of debugging, while consolidating
    their knowledge of loops and variables. Now children are writing longer programs,
    they will be experiencing more bugs and need to develop their skills to fix them.
    These pages also offer tips on avoiding bugs in the first place.


    # TIP


    > One skill to start developing at this point is the ability to look through some
    code and see what each line does. Saying each line out loud, or to a partner,
    can really help. The act of explaining each line can allow children to check that
    what they want to happen is what the program is being told to do.


    This technique is used by professional programmers — in a quite surprising way.
    There is an established technique called ''rubber duck debugging''. Programmers
    look through any code that doesn''t work, and explain what each line does out
    loud... to a rubber duck!


    > Maybe one day the duck will learn to code too!


