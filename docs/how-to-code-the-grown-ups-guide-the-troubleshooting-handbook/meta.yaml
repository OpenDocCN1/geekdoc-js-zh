    ## 术语表


    **算法** 解决问题的步骤集合，或定义游戏或程序的一系列规则。


    **属性** 关于对象的额外信息，例如其宽度或高度。


    **浏览器** 用于查看网站和 HTML 页面的程序。流行的浏览器包括 Chrome、Internet Explorer、Firefox 和 Safari。


    **命令** 告诉计算机执行操作的词语或代码块。


    **坐标** 由对象的 x（从左到右）和 y（从下到上）值确定的位置。


    **CSS（层叠样式表）** 用于存储网页详细样式信息的语言。


    **调试** 修复计算机程序中的问题（错误）。


    **域名** 互联网中由以某种方式相关的计算机或网站组成的一部分。例如，它们可能都在英国，并且网址以 .co.uk 结尾。


    **下载** 使用互联网将数据从一台计算机复制到另一台。


    **编辑器（或文本编辑器）** 用于输入和编辑程序的程序。


    **嵌入** 将来自另一个网站的视频或地图包含在网页中。


    **事件** 程序运行时发生的事情；例如按下按键或程序启动。


    **函数** 创建的一系列命令，用于执行某项操作，例如每次函数运行或“调用”时绘制一个正方形。


    **HTML（超文本标记语言）** 用于定义网页上对象的语言。


    **HTTP（超文本传输协议）** 在互联网上传输 HTML 页面的规则。


    **超链接** 指向另一个网页的链接，可以通过单击鼠标或触摸触摸屏来访问。


    **IDLE** 用于编写 Python 代码的编辑器。


    **If...then...else** 编码中常见的选择形式，如果条件为真则运行一个命令，如果为假则运行另一个不同的命令。


    **导入** 将数据从一个程序取到另一个程序中。


    **缩进** 使用制表符或空格将一行代码从左侧向内移动。


    **输入** 告诉程序执行某项操作的动作（例如按键）。


    **整数** 一个完整的数字。在代码中，它指存储整数的变量类型。


    **互联网** 一个全球性的计算机网络。


    **JavaScript** 用于某些网页的编程语言。


    **语言** 用于编写程序的单词、数字、符号和规则的系统。


    **库** 一组已存储并准备使用的命令集合。


    **监听器（或事件监听器）** 仅在特定事件（如单击按钮）发生时运行的一行代码或函数。


    **Logo** 一种计算机语言，其中的命令移动屏幕上的海龟进行绘图。


    **循环** 重复执行一定次数的命令序列。


    **主循环** 游戏或程序中包含程序主要部分的循环。


    **网络** 通过导线或（如今通常是）无线链路连接的一组计算机。


    **在线** 连接到互联网。


    **运算符** 执行数学或逻辑操作的代码片段。


    **输出** 计算机程序为显示程序结果而执行的操作。


    **参数** 传递给命令的值。在代码行 `fd(50)` 中，参数是 50。


    **像素** 计算机或平板电脑屏幕上的一个小点。


    **纯文本** 存储的文本具有相同的大小、字体和颜色。


    **程序** 告诉计算机如何执行操作的特殊命令。


    **Python** 一种基于文本的编程语言。


    **Scratch** 一种使用积木块来制作程序的计算机语言。


    **选择** 计算机程序在简单问题或值检查后选择运行哪些命令的方式。


    **服务器** 存储和提供网页的计算机或计算机群组。


    **精灵** 在屏幕上移动的对象。


    **字符串** 字母或符号的序列。字符串是一种变量类型。字符串可以包含数字，但不能对它们进行数学运算。


    **标签** 用于描述网页上有哪些对象的特殊单词和符号。它们总是被尖括号 `<>` 包围。


    **海龟** 在 Logo 或 Python 中被移动来绘图的屏幕机器人。


    **上传** 将文件从你的计算机传输到另一台计算机，这台计算机通常更大且位于不同地点。


    **URL（统一资源定位符）** 网站或 HTML 页面的地址或位置。通常显示在浏览器窗口顶部。


    **变量** 计算机程序存储的值或数据片段。


    **网页** 使用 HTML 构建并与万维网相连的信息页面。


    **万维网（或 Web）** 全球性的 HTML 文件网络，我们可以通过互联网访问。


