  md: '# Draw a rocket


    Using the techniques shown opposite, create a rocket to use as a sprite in a Scratch
    program, such as the **Space Game** on the following pages.


    1. In Scratch, start by clicking ''Paint new sprite''.


    2. Select the **Ellipse** tool. Set to fill in. Choose red. Now draw a wide ellipse.


    3. Use the **Select** tool to draw a box round one end. Drag the end off the drawing
    area to remove it. Repeat for the other end.


    4. Zoom in. In a darker colour, use the **Line** tool to draw a pointed rocket
    tip.


    5. Use the **Fill** tool to colour in the rocket tip, then zoom out.


    6. Draw another ellipse, then chop off one end with the **Select** tool.


    7. Use the **Select** tool to draw round the top half and drag it off, making
    a rocket fin.


    8. Do the same with the other side.


    9. Decorate your rocket with the **Ellipse**, **Rectangle** and **Line** tools.


    Your picture will be stored as pixels.


    > Practise these techniques to make your own fabulous sprites. Use them in your
    own programs.'
