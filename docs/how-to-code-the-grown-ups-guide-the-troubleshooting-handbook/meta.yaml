    ## 实用的LOGO指令


    ## 控制海龟


    | 指令 | 描述 |

    |---------|-------------|

    | fd 50 | 向前移动50步。 |

    | rt 90 | 向右转90度。 |

    | lt 90 | 向左转90度。 |

    | bk 50 | 向后移动50步。 |

    | cs | 清除绘图区域。 |

    | seth 0 | 使海龟朝上。 |

    | st | 显示海龟。 |

    | ht | 隐藏海龟。 |


    你可以输入 ''forward'' 代替 ''fd''。在Logo中，使用大写字母或小写字母没有区别。大多数其他编程语言则更为严格。记住你可以更改指令后面的数字，以改变海龟转向或移动的距离。这个数字被称为参数。


    ## 定位海龟


    | 指令 | 描述 |

    |---------|-------------|

    | setpos[ 100 200 ] | 将海龟的位置设置为100, 200。 |

    | setx 100 | 将x坐标（从左到右）设置为100。 |

    | sety 200 | 将y坐标（从下到上）设置为200。 |

    | wrap | 当海龟移动到屏幕边缘时，环绕并从另一侧重新出现。 |

    | fence | 当海龟到达屏幕边缘时，碰到隐形围栏并停止。 |


    ## 绘图


    | 指令 | 描述 |

    |---------|-------------|

    | pu | 提笔：抬起笔并停止绘图。 |

    | pd | 落笔：放下笔开始绘图。 |

    | setpc 5 | 将笔的颜色设置为编号5。（大多数计算机语言使用数字表示颜色。） |

    | setpensize 5 | 将海龟绘制的线条粗细设置为5。 |


    ## 循环


    | 指令 | 描述 |

    |---------|-------------|

    | repeat | 将一组指令重复特定次数。例如：**repeat 4 [ fd 100 rt 90 ]** 将重复四次，向前100步然后向右转90度。两个方括号都必须包含才能使代码正常工作。
    |


    ## 输出


    | 指令 | 描述 |

    |---------|-------------|

    | print 10+10 | 在屏幕上输出20。 |

    | print heading | 在屏幕上打印海龟的朝向角度。 |

    | print xcor | 在屏幕上打印海龟当前的x值。 |

    | print ycor | 在屏幕上打印海龟当前的y值。 |

    | ct | 清除屏幕上打印的任何文本。 |


    ## 角度


    学习者需要对角度有基本的理解才能使用Logo。知道90度构成一个直角或四分之一圈是绘制简单形状所必需的。然而，Logo也为孩子们提供了一个完美的环境来探索和发展角度概念。一旦你的孩子掌握了如何使用
    **rt 90** 转弯来绘制正方形，让他们尝试将90改为45，看看会发生什么。


    ## 估算


    一旦孩子们学会了如何让海龟向前移动10步或20步，试着问他们这样的问题：“我们需要向前移动多少步才能到达屏幕边缘？”或者把你的手指放在屏幕上问：“移动多少步海龟会到达我的手指？”


    ```

    fd 60

    rt 45

    fd 60

    rt 45

    fd 60

    rt 45

    fd 60

    ```


    Logo!


    ## SCRATCH 技术指南


    Scratch是一种编程语言，它采用了与Logo类似的方法，让一只海龟（在Scratch中称为“角色”）在屏幕上移动。但是，在Scratch中，你是通过拖拽和连接命令来操作，而不是键入它们。Scratch对于学习编写游戏、创建图形和音效非常有趣。


    ## 获取SCRATCH


    你可以在PC或Mac上使用Scratch，方法是打开你的网络浏览器并访问：

    **http://scratch.mit.edu**

    然后点击“尝试一下”或“创建”。


    有一个非常类似的网站叫“Snap”，它也可以在iPad上使用。在这里访问：

    **http://snap.berkeley.edu/run**


    如果你想在不使用互联网的情况下运行Scratch，可以从这里下载：

    **http://scratch.mit.edu/scratch2download/**


    ## 使用SCRATCH


    ## 保存你的作品


    点击页面左上方的“文件”菜单。

    然后点击：


    **下载到你的电脑** – 保存文件。

    **从你的电脑上传** – 打开你之前保存的文件。

    **新建** – 开始新的工作。


    ## 实用的SCRATCH指令


    | 类别 | 指令描述 |

