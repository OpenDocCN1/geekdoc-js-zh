    If children are unable to visualize the shapes while doing the ‘Coding simple
    loops’ exercises, get them to read the commands out loud. They could even go outside
    with a piece of chalk and a partner. One child could read aloud the commands while
    the other becomes a ‘human robot’ – drawing on the ground while obeying the repeated
    commands. Note also that, when programming Logo loops, children may forget to
    type both brackets, or they may type curly brackets instead of square ones.'
  - "[PAGE 18]\n\n# PAGES 10–11\nLoops in Scratch\n\n![](img/67c80c813fc5d30d52471ee1f484e615_18_0.png)\n\
    \n# OBJECTIVES\n\nChildren will now learn to create loops in Scratch. Scratch\
    \ works in a similar way to Logo, making it straightforward to apply what has\
    \ already been learnt. Trying out loops in another programming language will help\
    \ children to focus on the concept of repetition. Discuss with children the similarities\
    \ and differences in creating a simple loop in the two languages.\n\n# TAKING\
    \ IT FURTHER\n\n1. Show this code to children and ask them to predict what it\
    \ will draw. (It's an octagon.)\n\n```\nclear\npen down\nrepeat 8\n  turn 45 degrees\n\
    \  move 50 steps\n```\n\n2. Ask children to change the code to draw a 12-sided\
    \ shape (a dodecagon).\n\nMost children will work out that they need to change\
    \ the number of repeats to 12 in order to draw a 12-sided shape. Most children\
    \ will find it harder to work out what angle they need to turn. Get them to experiment\
    \ with using larger or smaller values.\n\nThe correct angle to turn is 30 degrees.\
    \ This is because, in order to complete the shape, we need to turn 360 degrees\
    \ in total. We are doing this in 12 steps, so 360 degrees divided by 12 gives\
    \ us 30 degrees.\n\n# PAGES 12–13\nLoops forever\n\n![](img/67c80c813fc5d30d52471ee1f484e615_18_1.png)\n\
    \n# OBJECTIVES\n\nSo far, we have looked at loops that run a specific number of\
    \ times. Now children will learn to use loops that run forever – or until the\
    \ program is stopped. They will use a ‘forever’ loop to code a swimming fish in\
    \ Scratch. Children can discuss the idea that most games need a ‘main loop’ that\
    \ keeps running all the time. A main loop can do things like move objects or sprites\
    \ around the screen.\n\n# TAKING IT FURTHER\n\nIf children are ready to learn\
    \ more about ‘forever’ loops, ask them to carry out these exercises:\n\n+   1.\
    \ Discuss what would happen if, instead of using a ‘forever’ loop for our swimming\
    \ fish, we used a ‘repeat 100’ loop. (The game would stop after a few seconds.)\n\
    2. Using a ‘forever’ loop, make another game in Scratch, this time with a plane\
    \ that flies around the screen.\n3. Design your own game in which an object moves\
    \ around the screen following the mouse. Let your imagination run riot!\n\n![](img/67c80c813fc5d30d52471ee1f484e615_18_2.png)"
- md: "## BOOK 2 PAGE-BY-PAGE GUIDE\n\n## PAGES 14–15 Repeat until...\n\n![](img/67c80c813fc5d30d52471ee1f484e615_19_0.png)\n\
    \n## OBJECTIVES\n\nChildren will learn to use 'repeat until' loops in Scratch.\
    \ Most games that use loops will need to stop running at some point: for example,\
    \ when a car crashes into a wall.\n\n## KEY CONCEPT: 'REPEAT UNTIL' LOOPS\n\n\
    Before children start coding, it is worth talking about the idea of repeating\
    \ a task until something happens. For example:\n\n- Repeat [eat your peas] until\
    \ none left\n- Repeat [pour water into glass] until full\n\n## EXTRA HELP\n\n\
    Children may not have come across coordinates before, or used the terms x and\
    \ y to describe where things are located on a screen. If so, show children the\
    \ diagram below. Explain that the green dot is positioned at x=3 and y=2. The\
    \ red dot is at x=6 and y=4. Ask them to work out x and y for the other dots.\n\
    \nWhen we use 'Set x to' or 'Set y to' in Scratch, we are setting the position\
    \ of the sprite using x and y values. We could move the sprite to the blue dot\
    \ with this code:\n\n![](img/67c80c813fc5d30d52471ee1f484e615_19_1.png)\n\n```\n\
    set x to 4\nset y to 6\n```\n\n## PAGES 16–17 Repeat until caught\n\n![](img/67c80c813fc5d30d52471ee1f484e615_19_2.png)\n\
    \n## OBJECTIVES\n\nUsing Scratch, children will program a chasing game using another\
    \ 'repeat until' loop. In this program, children will learn to code a second sprite,\
    \ and the loop will repeat until the two sprites are touching.\n\n## COMMON CONFUSIONS\n\
    \nProgramming a second sprite can be fiddly. Children will need to follow the\
    \ instructions carefully. Make sure that the cat and dog each get the right bit\
    \ of code. There are two different 'mini-programs' or loops running here – one\
    \ for each sprite. To change the code for a sprite, make sure that sprite is clicked\
    \ first!\n\n![](img/67c80c813fc5d30d52471ee1f484e615_19_3.png)\n\n## PAGES 18–19\
    \ Adding sound\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_0.png)\n\n## OBJECTIVES\n\
    \nIn 'Adding sound', we introduce using sound as an output within coding. Using\
    \ Scratch, we will code a tune and create a piano program. The Scratch 'Play note'\
    \ command needs two values. The first controls the pitch of the note, and the\
    \ second how long the note lasts.\n\n## TAKING IT FURTHER\n\nAfter children have\
    \ completed the piano program, they could add some new key press events to change\
    \ the instrument. Each of these will use the 'Set instrument' code block. Now\
    \ let them experiment!\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_1.png)\n\
    \n## PAGES 20–21 Sound effects\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_2.png)\n\
    \n## OBJECTIVES\n\nChildren will extend their ability to code with sound by looking\
    \ at how sound can be added into games and other programs. The exercises on these\
    \ pages combine playing sounds with loops. Children will also use sound files\
    \ that have been recorded, such as a meowing cat for the chasing game in Book\
    \ 2 pages 16–17.\n\n## TAKING IT FURTHER\n\nChildren can record their own sound\
    \ files in Scratch. You need a built-in microphone on the computer or an external\
    \ one. Make sure microphones are set up correctly.\n\n1. To add your own recorded\
    \ sound, drag a 'Play sound' code block onto the scripts area and click 'Record'.\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_20_3.png)\n\n2. Click the 'Record'\
    \ button and create your sound. Then click 'Stop'.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_4.png)\n\
    \n3. Click the 'Scripts' tab.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_5.png)\n\
    \n4. Click 'Recording1' to select your recording, then click the 'Play sound'\
    \ block.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_6.png)\n\nTry putting\
    \ this 'Play sound' block in a program.\n\n## BOOK 2 PAGE-BY-PAGE GUIDE\n\n##\
    \ PAGES 22–23 Variables\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_0.png)\n\
    \n## OBJECTIVES\n\nThese pages explain variables, which are a key concept in any\
    \ programming language. Before moving on to more complex exercises on the following\
    \ pages, children will grasp the idea of variables by creating a simple program\
    \ using a single variable in Scratch.\n\n## KEY CONCEPT: VARIABLES\n\nVariables\
    \ are a way that computer programs store pieces of data or information. Unlike\
    \ normal numbers, variables can change their value when something happens. Although\
    \ variables can seem like quite an abstract idea, children will be familiar with\
    \ the use of a score variable in games. They will be used to the idea that the\
    \ value of the score in a game can change from being zero at the start – and will\
    \ increase as the game progresses.\n\n## COMMON CONFUSIONS\n\nSome children may\
    \ be confused by the difference between the letter a, the variable a and the value\
    \ of the variable a. This is how Scratch handles variables:\n\nThis just means:\
    \ display the letter a. In many other programming languages, it would have speech\
    \ marks round it – \"a\" – and be called a string.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_1.png)\n\
    \nThis means: display the value of the variable a. In our code it looks like an\
    \ a but when we run the code, it shows up as the value in a.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_2.png)\n\
    \n## PAGES 24–25 Keeping score\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_3.png)\n\
    \n## OBJECTIVES\n\nUsing Scratch, children will learn to create a score variable\
    \ (called s) for a game. The variable will keep track of how long the game is\
    \ running. At the start of the game, the value of s is set to 0. Every time the\
    \ main loop in the game repeats, the value of the variable s (our score) goes\
    \ up by 1.\n\n## COMMON CONFUSIONS\n\nIt is important that children understand\
    \ the difference between setting a variable to a specific value, and increasing\
    \ it. Try swapping round the **'Set s to 0'** and **'Change s by 1'** code blocks\
    \ to demonstrate what happens.\n\n## TAKING IT FURTHER\n\nWhen children are ready\
    \ to try more, ask them to:\n\n1. Change the shark game to make the score go up\
    \ in 2s, 5s or 10s. Then check the answers on page 62.\n2. Use a **'Say'** code\
    \ block to display the score at the end of the game.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_4.png)\n\
    \n## PAGES 26–27 Counting clicks\n\n![](img/67c80c813fc5d30d52471ee1f484e615_22_0.png)\n\
    \n## OBJECTIVES\n\nThis project will extend children's understanding of variables:\
    \ instead of having a score that is increased in the main repeat loop, the score\
    \ will increase when the sprite is clicked. This project also recaps on working\
    \ with loops and coordinates.\n\n## HOW THE CODE WORKS\n\n```\nwhen [green flag]\
    \ clicked\nset x to -180\nset [s v] to [0]\nrepeat until <touching [edge v] ?>\n\
    \    move (5) steps\nend\nsay (s)\n\nwhen this sprite clicked\nchange [s v] by\
    \ (1)\n```\n\n1. Start the program.\n2. Move the cat sprite to the left of the\
    \ screen.\n3. Reset the score to 0.\n4. Repeat the commands in the loop until\
    \ the sprite reaches the edge of the screen.\n5. Move the sprite.\n6. Show the\
    \ score (if the program breaks out of the loop because the sprite reaches the\
    \ edge).\n7. When the sprite is clicked...\n8. Make the score go up.\n\n## PAGES\
    \ 28–29 Debugging\n\n![](img/67c80c813fc5d30d52471ee1f484e615_22_1.png)\n\n##\
    \ OBJECTIVES\n\nThese pages will teach children the vital skill of debugging,\
    \ while consolidating their knowledge of loops and variables. Now children are\
    \ writing longer programs, they will be experiencing more bugs and need to develop\
    \ their skills to fix them. These pages also offer tips on avoiding bugs in the\
    \ first place.\n\n## TIP\n\n> One skill to start developing at this point is the\
    \ ability to look through some code and see what each line does. Saying each line\
    \ out loud, or to a partner, can really help. The act of explaining each line\
    \ can allow children to check that what they want to happen is what the program\
    \ is being told to do.\n\nThis technique is used by professional programmers —\
    \ in a quite surprising way. There is an established technique called 'rubber\
    \ duck debugging'. Programmers look through any code that doesn't work, and explain\
    \ what each line does out loud... to a rubber duck!\n\n> Maybe one day the duck\
    \ will learn to code too!\n\n![](img/67c80c813fc5d30d52471ee1f484e615_22_2.png)"
  mdcn: "\n## 第二册 逐页指南\n\n## 第14–15页 重复直到……\n\n![](img/67c80c813fc5d30d52471ee1f484e615_19_0.png)\n\
    \n## 教学目标\n\n孩子们将学习在 Scratch 中使用*\"重复直到\"*循环。大多数使用循环的游戏都需要在某个时刻停止运行：例如，当汽车撞到墙壁时。\n\
    \n## 核心概念：\"重复直到\"循环\n\n在孩子们开始编程之前，值得先讨论一下重复一项任务直到某件事发生的概念。例如：\n\n- 重复 [吃掉你的豌豆]\
    \ 直到没有剩下\n- 重复 [往杯子里倒水] 直到满\n\n## 额外帮助\n\n孩子们可能以前没有接触过坐标，或者没有使用过 x 和 y 这两个术语来描述事物在屏幕上的位置。如果是这样，请向孩子们展示下面的图示。解释绿点位于\
    \ x=3 和 y=2 的位置。红点位于 x=6 和 y=4。让他们计算其他点的 x 和 y 值。\n\n当我们在 Scratch 中使用\"将 x 设定为\"\
    或\"将 y 设定为\"时，我们是用 x 和 y 值来设定角色的位置。我们可以用以下代码将角色移动到蓝点的位置：\n\n![](img/67c80c813fc5d30d52471ee1f484e615_19_1.png)\n\
    \n```\nset x to 4\nset y to 6\n```\n\n## 第16–17页 重复直到被抓住\n\n![](img/67c80c813fc5d30d52471ee1f484e615_19_2.png)\n\
    \n## 教学目标\n\n使用 Scratch，孩子们将编写一个追逐游戏，其中使用了另一个*\"重复直到\"*循环。在这个程序中，孩子们将学习为第二个角色编写代码，循环将重复直到两个角色彼此接触。\n\
    \n## 常见困惑\n\n为第二个角色编程可能会比较棘手。孩子们需要仔细按照说明操作。确保猫和狗各自获得正确的代码。这里有两个不同的\"小程序\"或循环在运行——每个角色各一个。要更改某个角色的代码，请首先确保点击了该角色！\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_19_3.png)\n\n## 第18–19页 添加声音\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_0.png)\n\
    \n## 教学目标\n\n在\"添加声音\"中，我们介绍了将声音作为编程中的输出。使用 Scratch，我们将编写一段旋律并创建一个钢琴程序。Scratch\
    \ 的\"播放音符\"命令需要两个值。第一个控制音符的音高，第二个控制音符持续的时间。\n\n## 拓展延伸\n\n在孩子们完成钢琴程序后，他们可以添加一些新的按键事件来更换乐器。每个事件都将使用\"\
    设定乐器\"代码块。现在让他们自由实验吧！\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_1.png)\n\n\
    ## 第20–21页 音效\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_2.png)\n\n## 教学目标\n\
    \n孩子们将通过学习如何在游戏和其他程序中添加声音来扩展他们的声音编程能力。这些页面上的练习将播放声音与循环结合起来。孩子们还将使用已录制的声音文件，例如为第二册第16–17页的追逐游戏录制猫的喵喵声。\n\
    \n## 拓展延伸\n\n孩子们可以在 Scratch 中录制自己的声音文件。你需要电脑内置的麦克风或外接麦克风。确保麦克风设置正确。\n\n1. 要添加你自己录制的声音，将一个\"\
    播放声音\"代码块拖到脚本区，然后点击\"录制\"。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_3.png)\n\
    \n2. 点击\"录制\"按钮并创建你的声音。然后点击\"停止\"。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_4.png)\n\
    \n3. 点击\"脚本\"标签。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_5.png)\n\n4. 点击\"\
    Recording1\"选择你的录音，然后点击\"播放声音\"块。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_20_6.png)\n\
    \n尝试将这个\"播放声音\"块放入程序中。\n\n## 第二册 逐页指南\n\n## 第22–23页 变量\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_0.png)\n\
    \n## 教学目标\n\n这些页面解释了变量，这是任何编程语言中的核心概念。在进入后面更复杂的练习之前，孩子们将通过在 Scratch 中创建一个使用单个变量的简单程序来掌握变量的概念。\n\
    \n## 核心概念：变量\n\n变量是计算机程序存储数据或信息的一种方式。与普通数字不同，变量可以在某事发生时改变其值。虽然变量可能看起来是一个相当抽象的概念，但孩子们对游戏中使用分数变量会很熟悉。他们习惯于这样的想法：游戏中的分数值从开始时的零可以变化——并且会随着游戏的进行而增加。\n\
    \n## 常见困惑\n\n一些孩子可能会对字母 a、变量 a 和变量 a 的值之间的区别感到困惑。Scratch 处理变量的方式如下：\n\n这只是意味着：显示字母\
    \ a。在许多其他编程语言中，它周围会有引号——\"a\"——并称为字符串。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_1.png)\n\
    \n这意味着：显示变量 a 的值。在我们的代码中它看起来像一个 a，但当我们运行代码时，它显示的是 a 中的值。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_2.png)\n\
    \n## 第24–25页 计分\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_3.png)\n\n## 教学目标\n\
    \n使用 Scratch，孩子们将学习为游戏创建一个分数变量（称为 s）。该变量将跟踪游戏运行了多长时间。在游戏开始时，s 的值被设定为 0。每次游戏中的主循环重复时，变量\
    \ s（我们的分数）的值就增加 1。\n\n## 常见困惑\n\n重要的是让孩子们理解将变量设定为特定值与增加变量之间的区别。尝试交换**\"将 s 设定为\
    \ 0\"**和**\"将 s 增加 1\"**代码块的位置，演示会发生什么。\n\n## 拓展延伸\n\n当孩子们准备好尝试更多内容时，请让他们：\n\n\
    1. 修改鲨鱼游戏，使分数以 2、5 或 10 为单位增加。然后在第62页检查答案。\n2. 使用**\"说\"**代码块在游戏结束时显示分数。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_21_4.png)\n\
    \n## 第26–27页 点击计数\n\n![](img/67c80c813fc5d30d52471ee1f484e615_22_0.png)\n\n##\
    \ 教学目标\n\n这个项目将扩展孩子们对变量的理解：分数不是在主重复循环中增加，而是在点击角色时增加。这个项目还回顾了循环和坐标的使用。\n\n## 代码工作原理\n\
    \n```\nwhen [green flag] clicked\nset x to -180\nset [s v] to [0]\nrepeat until\
    \ <touching [edge v] ?>\n    move (5) steps\nend\nsay (s)\n\nwhen this sprite\
    \ clicked\nchange [s v] by (1)\n```\n\n1. 启动程序。\n2. 将猫角色移动到屏幕左侧。\n3. 将分数重置为 0。\n\
    4. 重复循环中的命令，直到角色到达屏幕边缘。\n5. 移动角色。\n6. 显示分数（如果程序因为角色到达边缘而跳出循环）。\n7. 当角色被点击时……\n\
    8. 使分数增加。\n\n## 第28–29页 调试\n\n![](img/67c80c813fc5d30d52471ee1f484e615_22_1.png)\n\
    \n## 教学目标\n\n这些页面将教授孩子们至关重要的调试技能，同时巩固他们对循环和变量的知识。现在孩子们编写的程序越来越长，他们会遇到更多的错误，需要培养修复错误的技能。这些页面还提供了从一开始就避免错误的技巧。\n\
    \n## 技巧\n\n> 此时需要开始培养的一项技能是通读代码并理解每行代码作用的能力。大声说出每行代码，或者对同伴说，真的很有帮助。解释每行代码的行为可以让孩子们检查他们想要发生的事情是否就是程序被指示要做的事情。\n\
    \n这种技巧被专业程序员使用——以一种相当令人惊讶的方式。有一种公认的技术叫做\"小黄鸭调试法\"。程序员会通读任何不能正常工作的代码，并大声解释每行代码的作用……对着一只橡皮小黄鸭！\n\
    \n> 也许有一天小黄鸭也会学会编程呢！\n\n![](img/67c80c813fc5d30d52471ee1f484e615_22_2.png)\n"
