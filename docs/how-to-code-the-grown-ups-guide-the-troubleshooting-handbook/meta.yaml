  md: 'EXTENSION PROJECTS


    # BOOK 4


    # Embedding


    This activity looks at how children can add extra resources to their web pages
    such as videos and maps. They will learn how to include these objects within a
    new HTML object called an iframe, and how to set the size for the embedded (added)
    object.


    # EMBEDDING A VIDEO


    There are times when you want to add a video to a web page. If you own the video
    and it is stored on your computer or server, you could include it like we added
    the photos in the previous project. Alternatively you could make a link to it
    if it is on another site. Embedding is something inbetween the two – it looks
    as if the video is on your website, but really it is being shown from another
    site.


    +   1. With an adult’s help, find a video online that you want to embed.


    > Always ask an adult if you can search for videos on the web.


    +   2. Look on the web page to find a ‘Share’ button, then click it.


    +   3. Click the ‘Embed’ button. Highlight all the code. Right-click your mouse
    and choose ‘Copy’.


    Share | Embed | Email

    <iframe width="560" height="315" src="https://www... ></iframe>


    On a Mac, you’ll have to hold the ‘Control’ key when you click.


    +   4. Start a new HTML file in your text editor. Type in a basic HTML file:


    ```

    <html>

    <h1>Videos</h1>

    <p>Here is a video about London</p>

    <iframe width="560" height="315" src...

    </html>

    ```


    > Right-click your mouse here, and choose ‘Paste’.


    ![](img/67c80c813fc5d30d52471ee1f484e615_45_0.png)


    The iframe code should appear in your HTML file. If it doesn’t, go back to the
    video and do step 3 again.


    Save and test the file in your browser.


