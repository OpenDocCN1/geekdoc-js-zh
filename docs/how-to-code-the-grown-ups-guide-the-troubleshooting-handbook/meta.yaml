  - "[PAGE 37]\n\n# BOOK 4 PAGE-BY-PAGE GUIDE\n\n# PAGES 6-7\nCreating web pages\n\
    \n# PAGES 8-9\nUsing HTML\n\n![](img/67c80c813fc5d30d52471ee1f484e615_37_0.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_37_1.png)\n\n# OBJECTIVES\n\nThese\
    \ pages will get young coders started with producing their own web pages. Children\
    \ will learn how web pages use special <tags> to mark different parts of the page.\
    \ Like most professional programmers, we will start by creating pages on our computer\
    \ and testing them 'locally', rather than working online with 'live' web pages.\
    \ Children will learn how to create a page in a text editor, save it as .html\
    \ and open it in a web browser – a process that needs mastering before we move\
    \ forward.\n\n# OBJECTIVES\n\nOnce children have become familiar with creating\
    \ a simple 3-line web page, saving it and opening it in a browser, they will be\
    \ ready to look at using different tags. The first tags they will have encountered\
    \ are <html> and </html> at the start and end of a document. Now we introduce\
    \ paragraph and heading tags. Children will also learn how to emphasize parts\
    \ of their text with tags such as <em>.\n\n# TAKING IT FURTHER\n\nFor extra tag\
    \ practice, start a new HTML document in your text editor. Add <html> and </html>\
    \ tags to the page. Write a list of animals between them. Save and test the page.\
    \ Now edit the page, using heading tags to make different animals larger and smaller.\
    \ For example:\n\n# EXTRA HELP\n\nChildren will benefit from getting the hang\
    \ of file saving and handling before moving on to more complex HTML and JavaScript\
    \ coding. Here are some practice tips:\n\n+   1. Practise using the text editor.\
    \ Make sure children can find the text editor themselves. If children are using\
    \ a Mac, first they need to click the 'TextEdit' menu then 'Preferences'. Choose\
    \ 'Plain text' and uncheck 'Smart quotes'.\n2. Children need to work on their\
    \ file handling. Make sure they know how to save files, and how to find them once\
    \ they have been saved. It is worth creating a folder on the desktop (or documents\
    \ area) that they can access easily and keep all their work in.\n3. Make sure\
    \ children understand that web pages must be saved as .html files or they won't\
    \ work properly.\n\n```\nText editor – animals.html\n<html>\n  <h1>Elephant</h1>\n\
    \  <h5>Mouse</h5>\n  <h2>Tiger</h2>\n  <h6>Fly</h6>\n</html>\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_37_2.png)\n\
    \n36"
  - '[PAGE 38]


    # PAGES 10–11


    # Addresses and links


    ![](img/67c80c813fc5d30d52471ee1f484e615_38_0.png)


    # PAGES 12–13


    # Lots of links


    ![](img/67c80c813fc5d30d52471ee1f484e615_38_1.png)


    # OBJECTIVES


    These pages start by teaching children more about URLs (web addresses). We then
    move on to the key skill of creating hyperlinks to other web pages. Children will
    become familiar with the anchor tag: <a>.


    # OBJECTIVES


    Now children are familiar with how to create links, they will create a page of
    their favourite links. They will use their own anchor tags (<a> and </a>), combining
    them with some of the heading and paragraph tags already learnt.


    > ### EXTRA HELP

    Some text editors will use ‘smart quotes’ and change vertical quotes (‘) for angled
    ones (‘). If this happens, refer to ‘Extra help’ on the opposite page to switch
    off this feature, or consider using a dedicated text editor – see ‘Tip’ on the
    right.


    # COMMON CONFUSIONS


    Some children may get mixed up about what goes inside the different parts of the
    anchor tags on a web page – <a> and </a>. Make sure they understand that the <a
    href = > part needs to contain the URL, while the part between the anchor tags
    will be shown on the web page as the text to click to link to the URL. Children
    also need to remember to put quotes around the URL.


    # TAKING IT FURTHER


    Ask children to make a list of international country codes used in URLs, starting
    with co.uk. This part of the domain is called the ‘suffix’. Can children discover
    any suffixes that reveal that a website is run by a charity, government or educational
    organization?


    > ### TIP

    A basic text editor, such as Notepad or TextEdit, will allow children to start
    creating web pages. It will also encourage them to look in detail at how a page
    is built. Once they get beyond simple experimenting, it is worth downloading a
    dedicated, more advanced HTML editor. There are many available for free: see page
    56 for more information on downloading one.


    A good HTML editor will require children to learn how to code and not do it all
    for them, but will provide features to support them, such as:

    * Auto-colouring text to emphasize tags, keywords, strings and numbers.

    * Auto-completing code to save time.

    * Indicating that tags, brackets and quotes have been closed and have matching
    pairs.

    * Allowing children to have multiple files open at the same time to work on.


    ![](img/67c80c813fc5d30d52471ee1f484e615_38_2.png)'
  - "[PAGE 39]\n\n# BOOK 4 PAGE-BY-PAGE GUIDE\n\n# PAGES 14-15 Colour it!\n\n# PAGES\
    \ 16-17 Adding JavaScript\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_0.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_39_1.png)\n\n**OBJECTIVES**\n'Colour\
    \ it!' will teach children how to change the colour and style of objects on a\
    \ web page. Large websites do this with additional files containing CSS (Cascading\
    \ Style Sheets; see page 58). Here we use a simpler approach to explore the concept,\
    \ by putting style attributes inside tags.\n\n**OBJECTIVES**\nSo far children\
    \ have been coding their web pages only with HTML. To make their web pages more\
    \ interactive, now they will learn how to combine their HTML coding with another\
    \ language, JavaScript. They will learn how to add a 'listener' to make some JavaScript\
    \ run when a button is clicked.\n\n**TAKING IT FURTHER**\nChildren could also\
    \ learn how to change the font their text is printed in:\n\n+   1. Start a new\
    \ HTML file in your text editor.\n2. Type in this code:\n3. Save and test your\
    \ page.\n4. Edit the second line to add a style attribute\n5. Experiment with\
    \ other fonts. Try using Impact and Tahoma first.\n\n```\n<html>\n  <h1>Fruit</h1>\n\
    \  <p>Apples</p>\n</html>\n```\n\nIf you set a font family that has more than\
    \ one word in its name, you need to put quotes round it. These need to be different\
    \ quotes from the ones you used to set the style attribute! For example, here\
    \ single quotes are used around the font name, double quotes around the style\
    \ attribute:\n\n```\n<h1 style=\"font-family:'Comic Sans MS'\">\n```\n\n**TAKING\
    \ IT FURTHER**\nOnce children have mastered the exercises in Book 4 pages 16-17,\
    \ they could create a new web page with three buttons. Each button needs to have\
    \ a riddle written on it. Add onclick listeners to each button so that when the\
    \ button is clicked, the answer is shown as a message. For example, try using\
    \ this code (type it all on one line):\n\n```\n<button onclick='alert(\"A bee\
    \ flying backwards\")'>What goes zzub zzub?</button>\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_2.png)"
  - "[PAGE 40]\n\n# PAGES 18–19\nJavaScript loops\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_0.png)\n\
    \n# PAGES 20–21\nJavaScript functions\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_1.png)\n\
    \nOBJECTIVES\nNow we will do some sums and counting, using JavaScript loops and\
    \ variables. Children will probably have used loops and variables before – whether\
    \ making patterns or keeping scores in Logo or Scratch (see Book 2), or counting\
    \ in Python (see Book 3). In this book, turn to page 16 for a refresher on loops,\
    \ and page 20 for a reminder on variables.\n\nOBJECTIVES\nThese pages introduce\
    \ the idea of functions. Functions are a sequence of commands that perform a specific\
    \ task every time that function is 'called' (run). The idea is explained through\
    \ the analogy of writing an instruction that tells a robot to make a sandwich.\
    \ The instructions work whatever sandwich fillings the robot is using. The idea\
    \ is then put into practice by creating a function that will ask a question and\
    \ check the answer is correct. Children will use this function to code a quiz.\n\
    \nTAKING IT FURTHER\nIn the counting exercises in Book 4 page 19, the numbers\
    \ displayed by a loop are shown next to each other. We can force the web browser\
    \ to show each on a separate line by telling it to show pre-formatted text, using\
    \ a `<pre>` tag:\n\nKEY CONCEPT: FUNCTIONS\nFunctions are an important concept\
    \ in coding. Here are some reasons to create and use your own functions:\n\n1.\
    \ Using a function means that you don't have to repeat lines of code – we just\
    \ 'call' the function whenever it is needed rather than repeating the same commands\
    \ over and over.\n2. Functions make long programs easier to read.\n3. Functions\
    \ make programs more flexible – a function can be used in more than one situation.\n\
    4. It is much easier to add a 'call' to a JavaScript function into an HTML listener\
    \ than write multiple lines of code.\n\n```\n<pre>\n<script>\nfor(var n=1; n<10;\
    \ n++)\n  document.writeln(n);\n</script>\n</pre>\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_2.png)\n\
    \nTo make a JavaScript loop count up in 5s, change the right-hand side of the\
    \ loop from `n++` to `n+=5`. For example, to write the numbers 0, 5, 10, 15, 20,\
    \ use: `for(var n=0; n<21; n+=5)`. Now try these exercises (answers are on page\
    \ 62):\n\n1. Make a loop that shows 0, 10, 20, 30, 40.\n2. Make a loop that shows\
    \ 2, 4, 6, 8, 10.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_3.png)"
- md: "[content]\n\n# PAGE-BY-PAGE GUIDE\n\n## BOOK 4\n\n## PAGES 22–23\n\n## JS Functions\
    \ with HTML\n\n![](img/67c80c813fc5d30d52471ee1f484e615_41_0.png)\n\n## OBJECTIVES\n\
    \nThese pages continue our work on JavaScript functions. This time we will be\
    \ combining JavaScript and HTML coding. The activities here show children how\
    \ to create a function that changes the background colour of a web page.\n\n##\
    \ TAKING IT FURTHER\n\nTo try something extra, we can create a similar function\
    \ to change the colour of text on a web page.\n\n- 1. Start a new web page in\
    \ your text editor. Type in the following:\n\n```\nText editor – creepyhouse.html\n\
    \n<html>\n<h1>The Creepy House</h1>\n<p>Once upon a time</p>\n<button onclick=\"\
    setcol('red')\">Red</button>\n<button onclick=\"setcol('blue')\">Blue</button>\n\
    <script>\nfunction setcol(col){\n  document.body.style.color=col;\n}\n</script>\n\
    </html>\n```\n\nThis program is very similar to the one in Book 4 page 23, but\
    \ it changes the colour of the text instead of the background colour. It uses\
    \ **style.color** to change the text colour.\n\n- 2. Save and test your file in\
    \ the same way as on page 23.\n\n- 3. Add more buttons and colours – have fun\
    \ experimenting!\n\n## PAGES 24–25\n\n## Pets project\n\n![](img/67c80c813fc5d30d52471ee1f484e615_41_1.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_41_2.png)\n\n## OBJECTIVES\n\nThis\
    \ project will teach children to create a simple website by linking together several\
    \ pages of information. They will also learn how to add images to their web pages.\
    \ As long as their website will not be online, children can use whatever images\
    \ they like – but if the website will be for public display, they need to be aware\
    \ of copyright and e-safety (see Book 4 pages 26–27). Children should always be\
    \ closely supervised when downloading images from the internet.\n\n## TAKING IT\
    \ FURTHER\n\nCreating small projects with multiple pages can give children very\
    \ good practice at handling files and creating links. You can help them by creating\
    \ a separate folder for each project. Here are some ideas for extra website projects:\n\
    \n- 1. This term's history topic, such as an ancient civilization and its artefacts.\n\
    \n- 2. Your favourite sports and sports stars.\n\n- 3. Reviews of your favourite\
    \ books or films.\n\n- 4. Science topics, such as materials and their uses.\n\n\
    ## PAGES 26–27\n\n## Sharing your website\n\n![](img/67c80c813fc5d30d52471ee1f484e615_42_0.png)\n\
    \n## OBJECTIVES\n\nThese pages explain how children can upload websites they have\
    \ created. Children can develop their coding and HTML skills while staying offline\
    \ (without uploading), but sometimes they may enjoy getting an audience for their\
    \ work. Make sure children are closely supervised if they are putting any information\
    \ online. Please follow the e-safety guidelines below, together with any other\
    \ rules you have at home or school about internet use.\n\n## E-SAFETY GUIDELINES\n\
    \nIf you are working with a group of children, it is worth displaying these guidelines\
    \ where everyone can read them and keep them in mind:\n\n- 1. Don't share personal\
    \ information online — such as your full name, address or email address.\n- 2.\
    \ Don't include photos of you or your family.\n- 3. Don't write anything unkind\
    \ about other people on your site.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_42_1.png)\n\
    \n## PAGES 28–29\n\n## Debugging\n\n![](img/67c80c813fc5d30d52471ee1f484e615_42_2.png)\n\
    \n## OBJECTIVES\n\nIn these exercises, children will need to fix some example\
    \ pieces of HTML and JavaScript code with bugs in. The pieces of code feature\
    \ all the key concepts we have learnt in Book 4: links, styling, loops and functions.\n\
    \n## TIP\n\nChildren could try using the console, a debugging tool built into\
    \ most web browsers. It will help them to see that there are errors and where\
    \ they are, although the messages may appear quite technical at first.\n\n## Showing\
    \ the console:\n\nOn a Mac, using Chrome:\n[alt] + [cmd] + [i]\n\nOn a PC, using\
    \ Internet Explorer or Chrome:\n[F12]\n\n![](img/67c80c813fc5d30d52471ee1f484e615_42_3.png)\n\
    \nThe console will appear here or at the bottom of your browser.\n\n## Typical\
    \ messages in the console:\n\n'scor' is not defined - mypage.html:3\n\nMeans the\
    \ browser doesn't know the variable or function called **scor**. This message\
    \ may show up when a variable or function is spelt incorrectly. The error is probably\
    \ in line 3.\n\n**Unexpected token ILLEGAL** - mypage.html:7\n\nor\n\n**Unterminated\
    \ string constant** - mypage.html:7\n\nMeans there is a quote or double quote\
    \ missing somewhere in line 7 — for example, `alert('hello)`.\n\n## Countries\
    \ website\n\nThis project will extend children's use of HTML by creating a mini\
    \ website with a number of new techniques. They will learn how to use an image\
    \ as a link and how to change the size of an image. These are very useful skills\
    \ to apply to other projects.\n\n- 1. Start a new web page in your text editor\
    \ and type in the following text:\n\n```\nText editor\n\n<html>\n<h1>Countries</h1>\n\
    </html>\n```\n\n- 2. Make a new folder for your project called 'Countries'. Save\
    \ your file there and call it index.html.\n\nTo make a new folder on a Mac, click\
    \ 'New folder' after clicking 'File' and 'Save'. On a PC, right-click in the save\
    \ box then click 'New' and 'Folder'.\n\n- 3. Open the Countries folder and double-click\
    \ the index.html file to test it.\n\n- 4. Arrange your desktop so you have the\
    \ Countries folder, your text editor and your browser all visible at once.\n\n\
    Double-click the Countries folder to open it. You will keep all the files for\
    \ your website in here.\n\n```\nFiles: desktop/Countries\n\nText editor — index.html\n\
    \n//desktop/Countries/index.html\n\n<html>\n<h1>Countries</h1>\n</html>\n```\n\
    \nYou need photos of Paris and Rome (or somewhere else if you prefer!). Ask an\
    \ adult to help you search for some online. Drag the photos into your Countries\
    \ folder and name them paris.jpg and rome.jpg.\n\nAlways ask an adult if you can\
    \ search for photos on the web.\n\n- 5. Click 'File' and 'New' to start the next\
    \ page. Type in this code:\n\n```\n<html>\n  <h1>France</h1>\n  <img src=\"paris.jpg\"\
    >\n</html>\n```\n\nSave this page as **france.html** in the Countries folder.\n\
    \n- 6. Edit your **index.html** file:\n\n```\nText editor – index.html\n\n<html>\n\
    <h1>Countries</h1>\n<a href=\"france.html\">\n  <img src=\"paris.jpg\">\n  France\n\
    </a>\n</html>\n```\n\nSave the file!\n\n- 7. Refresh the page. Click the 'France'\
    \ link and the France page will load in your browser.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_44_0.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_44_1.png)\n\n- 8. Both pictures will\
    \ be quite large. The one on the France page can be left that size, but on the\
    \ Index page we need to make it smaller. (For an online website, you would also\
    \ need to make the photo small to make it quicker to download.) Edit the 4th line\
    \ of code in your **index.html** file:\n\n```\n<img src=\"paris.jpg\" width=\"\
    100\" >\n```\n\nSet the width to **100**. This means 100 pixels.\n\nSave the file\
    \ and refresh the page to test it. The photo's height should also have changed\
    \ automatically.\n\n- 9. Now add another page for Italy and save it (see step\
    \ 5 for how). You will also need to make another link for it in your index file,\
    \ so edit your **index.html** file like this:\n\nUse `<br>` to make a line break\
    \ to start a new line.\n\n```\nText editor – index.html\n\n<html>\n<h1>Countries</h1>\n\
    <a href=\"france.html\">\n  <img src=\"paris.jpg\" width=\"100\">\n  France\n\
    </a>\n<br>\n<a href=\"italy.html\">\n  <img src=\"rome.jpg\" width=\"100\">\n\
    \  Italy\n</a>\n</html>\n```\n\n- 10. Add more information about each country\
    \ on its page. Use `<p>` paragraph `</p>` tags around the information. Look back\
    \ at Book 4 page 14 to change the colour of pages and text.\n\n## EXTENSION PROJECTS\n\
    \n### BOOK 4\n\n### Embedding\n\nThis activity looks at how children can add extra\
    \ resources to their web pages such as videos and maps. They will learn how to\
    \ include these objects within a new HTML object called an iframe, and how to\
    \ set the size for the embedded (added) object.\n\n### EMBEDDING A VIDEO\n\nThere\
    \ are times when you want to add a video to a web page. If you own the video and\
    \ it is stored on your computer or server, you could include it like we added\
    \ the photos in the previous project. Alternatively you could make a link to it\
    \ if it is on another site. Embedding is something in between the two – it looks\
    \ as if the video is on your website, but really it is being shown from another\
    \ site.\n\n- 1. With an adult's help, find a video online that you want to embed.\n\
    \n> Always ask an adult if you can search for videos on the web.\n\n- 2. Look\
    \ on the web page to find a 'Share' button, then click it.\n\n- 3. Click the 'Embed'\
    \ button. Highlight all the code. Right-click your mouse and choose 'Copy'.\n\n\
    | Share | Embed | Email |\n|-------|-------|-------|\n| <iframe width=\"560\"\
    \ height=\"315\" src=\"https://www...\"></iframe> | | |\n\nOn a Mac, you'll have\
    \ to hold the 'Control' key when you click.\n\n- 4. Start a new HTML file in your\
    \ text editor. Type in a basic HTML file:\n\n```\n<html>\n<h1>Videos</h1>\n<p>Here\
    \ is a video about London</p>\n<iframe width=\"560\" height=\"315\" src...\n</html>\n\
    ```\n\n> Right-click your mouse here, and choose 'Paste'.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_45_0.png)\n\
    \nThe iframe code should appear in your HTML file. If it doesn't, go back to the\
    \ video and do step 3 again.\n\nSave and test the file in your browser.\n\n[content]"
  mdcn: "\n\n# 逐页指南\n\n## 图书 4\n\n## 第 22–23 页\n\n## 配合 HTML 的 JS 函数\n\n![](img/67c80c813fc5d30d52471ee1f484e615_41_0.png)\n\
    \n## 学习目标\n\n这几页继续学习 JavaScript 函数的内容。这次我们将结合 JavaScript 和 HTML 进行编程。这里的活动向孩子们展示如何创建一个改变网页背景颜色的函数。\n\
    \n## 拓展提升\n\n如果想尝试额外的挑战，我们可以创建一个类似的函数来改变网页上文字的颜色。\n\n- 1. 在文本编辑器中新建一个网页。输入以下内容：\n\
    \n```\nText editor – creepyhouse.html\n\n<html>\n<h1>The Creepy House</h1>\n<p>Once\
    \ upon a time</p>\n<button onclick=\"setcol('red')\">Red</button>\n<button onclick=\"\
    setcol('blue')\">Blue</button>\n<script>\nfunction setcol(col){\n  document.body.style.color=col;\n\
    }\n</script>\n</html>\n```\n\n这个程序与图书 4 第 23 页的程序非常相似，但它改变的是文字颜色而非背景颜色。它使用 **style.color**\
    \ 来改变文字颜色。\n\n- 2. 按照第 23 页的方法保存并测试你的文件。\n\n- 3. 添加更多按钮和颜色——尽情享受实验的乐趣吧！\n\n##\
    \ 第 24–25 页\n\n## 宠物项目\n\n![](img/67c80c813fc5d30d52471ee1f484e615_41_1.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_41_2.png)\n\n## 学习目标\n\n这个项目将教孩子们如何通过链接多个信息页面来创建一个简单的网站。他们还将学习如何在网页中添加图片。只要网站不会上线，孩子们可以使用任何他们喜欢的图片——但如果网站将公开展示，他们需要注意版权和网络安全问题（见图书\
    \ 4 第 26–27 页）。孩子们从互联网下载图片时，应始终受到密切监督。\n\n## 拓展提升\n\n创建包含多个页面的小型项目可以让孩子们很好地练习处理文件和创建链接。你可以通过为每个项目创建单独的文件夹来帮助他们。以下是一些额外的网站项目创意：\n\
    \n- 1. 本学期的历史主题，例如古代文明及其文物。\n\n- 2. 你最喜欢的运动和体育明星。\n\n- 3. 你最喜欢的书籍或电影的评论。\n\n-\
    \ 4. 科学主题，例如材料及其用途。\n\n## 第 26–27 页\n\n## 分享你的网站\n\n![](img/67c80c813fc5d30d52471ee1f484e615_42_0.png)\n\
    \n## 学习目标\n\n这几页解释了孩子们如何上传他们创建的网站。孩子们可以在离线状态下（不上传）发展他们的编程和 HTML 技能，但有时他们也会享受让作品获得观众的机会。如果孩子们要在网上发布任何信息，请确保他们受到密切监督。请遵循以下的网络安全准则，以及你家中或学校关于互联网使用的任何其他规定。\n\
    \n## 网络安全准则\n\n如果你与一群孩子一起工作，值得将这些准则张贴在大家都能看到的地方，以便阅读和牢记：\n\n- 1. 不要在网上分享个人信息——例如你的全名、地址或电子邮箱地址。\n\
    - 2. 不要包含你或你家人的照片。\n- 3. 不要在你的网站上写任何关于他人的不友善内容。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_42_1.png)\n\
    \n## 第 28–29 页\n\n## 调试\n\n![](img/67c80c813fc5d30d52471ee1f484e615_42_2.png)\n\
    \n## 学习目标\n\n在这些练习中，孩子们需要修复一些有 bug 的 HTML 和 JavaScript 代码示例。这些代码片段涵盖了我们将在图书 4\
    \ 中学到的所有关键概念：链接、样式、循环和函数。\n\n## 提示\n\n孩子们可以尝试使用控制台，这是大多数网页浏览器内置的调试工具。这将帮助他们看到存在错误以及错误所在的位置，尽管这些消息一开始可能显得相当技术性。\n\
    \n## 显示控制台：\n\n在 Mac 上使用 Chrome：\n[alt] + [cmd] + [i]\n\n在 PC 上使用 Internet Explorer\
    \ 或 Chrome：\n[F12]\n\n![](img/67c80c813fc5d30d52471ee1f484e615_42_3.png)\n\n控制台将出现在此处或浏览器底部。\n\
    \n## 控制台中的典型消息：\n\n'scor' is not defined - mypage.html:3\n\n表示浏览器不知道名为 **scor**\
    \ 的变量或函数。当变量或函数拼写错误时，可能会出现此消息。错误可能出现在第 3 行。\n\n**Unexpected token ILLEGAL** -\
    \ mypage.html:7\n\n或\n\n**Unterminated string constant** - mypage.html:7\n\n表示第\
    \ 7 行某处缺少引号或双引号——例如，`alert('hello)`。\n\n## 国家网站\n\n这个项目将通过创建一个小型网站来扩展孩子们的 HTML\
    \ 应用，其中包含多种新技术。他们将学习如何使用图片作为链接以及如何改变图片大小。这些是非常有用的技能，可以应用到其他项目中。\n\n- 1. 在文本编辑器中新建一个网页，并输入以下文本：\n\
    \n```\nText editor\n\n<html>\n<h1>Countries</h1>\n</html>\n```\n\n- 2. 为你的项目新建一个名为\
    \ 'Countries' 的文件夹。将你的文件保存在那里，并将其命名为 index.html。\n\n在 Mac 上创建新文件夹，点击 'File' 后点击\
    \ 'Save'，然后点击 'New folder'。在 PC 上，在保存框中右键单击，然后点击 'New' 和 'Folder'。\n\n- 3. 打开\
    \ Countries 文件夹，双击 index.html 文件进行测试。\n\n- 4. 安排你的桌面，使 Countries 文件夹、文本编辑器和浏览器都能同时看到。\n\
    \n双击 Countries 文件夹将其打开。你将在这个文件夹中保存网站的所有文件。\n\n```\nFiles: desktop/Countries\n\n\
    Text editor — index.html\n\n//desktop/Countries/index.html\n\n<html>\n<h1>Countries</h1>\n\
    </html>\n```\n\n你需要巴黎和罗马的照片（如果你愿意，也可以是其他地方的照片！）。请成年人帮你在网上搜索一些。将照片拖入你的 Countries\
    \ 文件夹，并将它们命名为 paris.jpg 和 rome.jpg。\n\n在网上搜索照片时，请务必询问成年人。\n\n- 5. 点击 'File' 和\
    \ 'New' 开始下一页。输入以下代码：\n\n```\n<html>\n  <h1>France</h1>\n  <img src=\"paris.jpg\"\
    >\n</html>\n```\n\n将此页面保存为 Countries 文件夹中的 **france.html**。\n\n- 6. 编辑你的 **index.html**\
    \ 文件：\n\n```\nText editor – index.html\n\n<html>\n<h1>Countries</h1>\n<a href=\"\
    france.html\">\n  <img src=\"paris.jpg\">\n  France\n</a>\n</html>\n```\n\n保存文件！\n\
    \n- 7. 刷新页面。点击 'France' 链接，法国页面将在你的浏览器中加载。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_44_0.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_44_1.png)\n\n- 8. 两张图片都会相当大。法国页面上的图片可以保持该大小，但在索引页面上我们需要将其缩小。（对于在线网站，你还需要将照片变小以加快下载速度。）编辑\
    \ **index.html** 文件中第 4 行代码：\n\n```\n<img src=\"paris.jpg\" width=\"100\" >\n\
    ```\n\n将宽度设置为 **100**。这表示 100 像素。\n\n保存文件并刷新页面进行测试。照片的高度也应该会自动改变。\n\n- 9. 现在为意大利添加另一个页面并保存（参见步骤\
    \ 5 的方法）。你还需要在索引文件中为它添加另一个链接，因此像这样编辑你的 **index.html** 文件：\n\n使用 `<br>` 进行换行以开始新行。\n\
    \n```\nText editor – index.html\n\n<html>\n<h1>Countries</h1>\n<a href=\"france.html\"\
    >\n  <img src=\"paris.jpg\" width=\"100\">\n  France\n</a>\n<br>\n<a href=\"italy.html\"\
    >\n  <img src=\"rome.jpg\" width=\"100\">\n  Italy\n</a>\n</html>\n```\n\n- 10.\
    \ 在每个国家的页面上添加更多关于该国的信息。使用 `<p>` 段落 `</p>` 标签包裹信息。回顾图书 4 第 14 页以更改页面和文字的颜色。\n\n\
    ## 拓展项目\n\n### 图书 4\n\n### 嵌入\n\n本活动探讨孩子们如何在网页中添加额外的资源，如视频和地图。他们将学习如何在一个名为 iframe\
    \ 的新 HTML 对象中包含这些对象，以及如何设置嵌入（添加）对象的大小。\n\n### 嵌入视频\n\n有时你想在网页中添加视频。如果你拥有该视频，并且它存储在你的电脑或服务器上，你可以像我们在上一个项目中添加照片一样来包含它。或者，如果它在另一个网站上，你可以创建一个链接到它。嵌入介于两者之间——看起来视频好像在你的网站上，但实际上它是从另一个网站显示的。\n\
    \n- 1. 在成年人的帮助下，找到你想嵌入的在线视频。\n\n> 在网上搜索视频时，请务必询问成年人。\n\n- 2. 在网页上找到 'Share' 按钮，然后点击它。\n\
    \n- 3. 点击 'Embed' 按钮。高亮显示所有代码。右键单击鼠标并选择 'Copy'。\n\n| Share | Embed | Email |\n\
    |-------|-------|-------|\n| <iframe width=\"560\" height=\"315\" src=\"https://www...\"\
    ></iframe> | | |\n\n在 Mac 上，你必须在点击时按住 'Control' 键。\n\n- 4. 在文本编辑器中新建一个 HTML 文件。输入一个基本的\
    \ HTML 文件：\n\n```\n<html>\n<h1>Videos</h1>\n<p>Here is a video about London</p>\n\
    <iframe width=\"560\" height=\"315\" src...\n</html>\n```\n\n> 在此处右键单击鼠标，并选择 'Paste'。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_45_0.png)\n\niframe 代码应该出现在你的 HTML\
    \ 文件中。如果没有，返回视频页面并重新执行步骤 3。\n\n保存并在浏览器中测试文件。\n\n[content]\n"
