    \ the **Ellipse** tool. Set to fill in. Choose red. Now draw a wide ellipse.\n\
    \n3. Use the **Select** tool to draw a box round one end. Drag the end off the\
    \ drawing area to remove it. Repeat for the other end.\n\n4. Zoom in. In a darker\
    \ colour, use the **Line** tool to draw a pointed rocket tip.\n\n5. Use the **Fill**\
    \ tool to colour in the rocket tip, then zoom out.\n\n6. Draw another ellipse,\
    \ then chop off one end with the **Select** tool.\n\n7. Use the **Select** tool\
    \ to draw round the top half and drag it off, making a rocket fin.\n\n8. Do the\
    \ same with the other side.\n\n9. Decorate your rocket with the **Ellipse**, **Rectangle**\
    \ and **Line** tools.\n\nYour picture will be stored as pixels.\n\n> Practise\
    \ these techniques to make your own fabulous sprites. Use them in your own programs.\n\
    \n## Space game\n\nThis activity shows children how they can create games that\
    \ include their own graphics. It also builds on all the Scratch skills learnt\
    \ in Book 1. This Space Game uses a drawn rocket and background image. The rocket\
    \ will fly when different keys are pressed. One key will make the rocket fly straight,\
    \ and two other keys will make the rocket turn left or right. Once children have\
    \ built this game, encourage them to plan their own simple game, create the graphics\
    \ and code it!\n\n![](img/67c80c813fc5d30d52471ee1f484e615_15_0.png)\n\n+ 1. Start\
    \ Scratch. Delete the main sprite by right-clicking on it and then choosing 'Delete'.\
    \ (On a MAC, you'll need to hold the 'Control' key when you click the sprite.)\n\
    \n2. Now draw your own rocket sprite, like the one on page 13.\n\n3. Now we need\
    \ to add some code to make the rocket move forward, and to turn left and right.\n\
    \nRight-clicking means click the button on the right side of the mouse.\n\nClick\
    \ the rocket sprite.\n\nThen click the Scripts tab.\n\nDrag three 'When key pressed'\
    \ blocks from the Events group.\n\nDrag the 'Move' and 'Turn' blocks from the\
    \ Motion group.\n\nChoose the keys you want to use to make the rocket move forward\
    \ and turn left and right.\n\n```\nwhen [space v] key pressed\nmove 10 steps\n\
    \nwhen [left arrow v] key pressed\nmove 10 steps\nturn (-15) degrees\n\nwhen [right\
    \ arrow v] key pressed\nmove 10 steps\nturn (15) degrees\n```\n\nSPACE BAR\n\n\
    Now draw your own background picture for the game.\n\nFirst, click **'Stage'**.\n\
    \n| Sprites | |\n|:---|:---|\n| Stage | |\n| 1 backdrop | |\n\nSprite 1\n\nThen\
    \ click **'Backdrops'**.\n\n| Scripts | |\n|:---|:---|\n| Backdrops | |\n\nSounds\n\
    \nNew backdrop : backdrop 1\n\nClick the **Fill** tool and choose the black colour.\n\
    \nNow click the background to colour it in.\n\nUse the **Brush** tool to draw\
    \ some stars.\n\nUse the **Line width** slider to change the size of the stars.\n\
    \nUse the **Ellipse** tool to draw some planets. Hold down the **'Shift'** key\
    \ to make perfect circles.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_16_0.png)\n\
    \nClick this button to make your program as big as the screen!\n\n## Saving your\
    \ code\n\nTo save your work, click the **'File'** menu (top left of screen), then\
    \ click **'Download to your computer'**.\n\nTo get your work back another day,\
    \ first you need to open up Scratch on your browser. Then click the **'File'**\
    \ menu and choose **'Upload from your computer'**.\n\n---\n\n## PAGE-BY-PAGE GUIDE\n\
    \n## BOOK 2\n\n### PAGES 6–7\n\n## Loops\n\n### PAGES 8–9\n\n## Patterns with\
    \ loops\n\n![](img/67c80c813fc5d30d52471ee1f484e615_17_0.png)\n\n![](img/67c80c813fc5d30d52471ee1f484e615_17_1.png)\n\
    \n### OBJECTIVES\n\nOne of the key concepts in any programming language is the\
    \ use of loops to repeat instructions over and over again. In these exercises,\
    \ children will learn to use Logo to program simple loops that will draw shapes.\n\
    \n### KEY CONCEPT: LOOPS\n\nBefore moving to the computer, talk to children about\
    \ how we use loops in everyday life, and get them to think of some examples. How\
    \ about walking to school every day (repeating 5 times) or putting on shoes (repeating\
    \ 2 times)? Explain that using repetition is a way of making instructions more\
    \ efficient. Discuss the idea of telling a millipede to put on each of its shoes\
    \ one at a time – or using a repeat loop. Get children to write down some instructions,\
    \ for example:\n\nTell a 300-legged millipede to put on its shoes:\n\n**repeat\
    \ 300 [ put on shoe ]**\n\nTell a pupil to walk to school every day:\n\n**repeat\
    \ 5 [ walk to school ]**\n\n### OBJECTIVES\n\nThese exercises will take children's\
    \ understanding of loops to the next level. We will explore the power of running\
    \ one loop inside another loop. We will use this concept to make a pattern in\
    \ Logo.\n\n### KEY CONCEPT: LOOP INSIDE A LOOP\n\nThis can be a difficult concept\
    \ to explain to children, so it will be helpful to use a fun analogy before moving\
    \ to the computer. Imagine that a family of four 300-legged millipedes are getting\
    \ ready to put their shoes on. Let's write down some commands to get them ready,\
    \ using a loop within a loop:\n\n```\nrepeat 4 [ repeat 300 [ put on shoe ] ]\n\
    ```\n\nRemind children that they need to put square brackets around the commands\
    \ they are repeating. As there are two loops, there will need to be two left and\
    \ two right brackets.\n\n### TAKING IT FURTHER\n\nUsing Logo, ask children to\
    \ type this code:\n\n```\nrepeat 20 [ repeat 4 [ fd 100 rt 90 ] rt 5 ]\n```\n\n\
    The code will not draw a complete pattern. Experiment with different values for\
    \ the first repeat to complete the pattern. The answer is on page 62.\n\n> **EXTRA\
    \ HELP**\n>\n> If children are unable to visualize the shapes while doing the\
    \ 'Coding simple loops' exercises, get them to read the commands out loud. They\
    \ could even go outside with a piece of chalk and a partner. One child could read\
    \ aloud the commands while the other becomes a 'human robot' – drawing on the\
    \ ground while obeying the repeated commands. Note also that, when programming\
    \ Logo loops, children may forget to type both brackets, or they may type curly\
    \ brackets instead of square ones.\n\n### PAGES 10–11\n\n## Loops in Scratch\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_18_0.png)\n\n### OBJECTIVES\n\nChildren\
    \ will now learn to create loops in Scratch. Scratch works in a similar way to\
    \ Logo, making it straightforward to apply what has already been learnt. Trying\
    \ out loops in another programming language will help children to focus on the\
    \ concept of repetition. Discuss with children the similarities and differences\
    \ in creating a simple loop in the two languages.\n\n### TAKING IT FURTHER\n\n\
    1. Show this code to children and ask them to predict what it will draw. (It's\
    \ an octagon.)\n\n```\nclear\npen down\nrepeat 8\n  turn 45 degrees\n  move 50\
    \ steps\n```\n\n2. Ask children to change the code to draw a 12-sided shape (a\
    \ dodecagon).\n\nMost children will work out that they need to change the number\
    \ of repeats to 12 in order to draw a 12-sided shape. Most children will find\
    \ it harder to work out what angle they need to turn. Get them to experiment with\
    \ using larger or smaller values.\n\nThe correct angle to turn is 30 degrees.\
    \ This is because, in order to complete the shape, we need to turn 360 degrees\
    \ in total. We are doing this in 12 steps, so 360 degrees divided by 12 gives\
    \ us 30 degrees.\n\n### PAGES 12–13\n\n## Loops forever\n\n![](img/67c80c813fc5d30d52471ee1f484e615_18_1.png)\n\
    \n### OBJECTIVES\n\nSo far, we have looked at loops that run a specific number\
    \ of times. Now children will learn to use loops that run forever – or until the\
    \ program is stopped. They will use a 'forever' loop to code a swimming fish in\
    \ Scratch. Children can discuss the idea that most games need a 'main loop' that\
    \ keeps running all the time. A main loop can do things like move objects or sprites\
    \ around the screen.\n\n### TAKING IT FURTHER\n\nIf children are ready to learn\
    \ more about 'forever' loops, ask them to carry out these exercises:\n\n+ 1. Discuss\
    \ what would happen if, instead of using a 'forever' loop for our swimming fish,\
    \ we used a 'repeat 100' loop. (The game would stop after a few seconds.)\n\n\
    2. Using a 'forever' loop, make another game in Scratch, this time with a plane\
    \ that flies around the screen.\n\n3. Design your own game in which an object\
    \ moves around the screen following the mouse. Let your imagination run riot!\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_18_2.png)"
  mdcn: "\n## 绘制火箭\n\n运用前述技巧，创建一个火箭作为Scratch程序中的角色，例如下一页中的**太空游戏**。\n\n1.  在Scratch中，首先点击'绘制新角色'。\n\
    \n2.  选择**椭圆**工具。设置为填充模式。选择红色。现在绘制一个宽椭圆。\n\n3.  使用**选择**工具在一端画一个框。将该端拖出绘图区域以移除它。对另一端重复此操作。\n\
    \n4.  放大视图。使用较深的颜色和**线条**工具绘制一个尖锐的火箭头部。\n\n5.  使用**填充**工具为火箭头部上色，然后缩小视图。\n\n6.\
    \  绘制另一个椭圆，然后用**选择**工具切掉一端。\n\n7.  使用**选择**工具圈选上半部分并将其拖出，制作一个火箭尾翼。\n\n8.  对另一侧重复相同操作。\n\
    \n9.  使用**椭圆**、**矩形**和**线条**工具装饰你的火箭。\n\n你的图像将被存储为像素。\n\n> 练习这些技巧，制作你自己的精彩角色。将它们用在你自己的程序中。\n\
    \n## 太空游戏\n\n此活动向孩子们展示如何创建包含自定义图形的游戏。它也基于第1册中学到的所有Scratch技能。这个太空游戏使用绘制的火箭和背景图像。当按下不同按键时，火箭会飞行。一个键使火箭直线飞行，另外两个键使火箭向左或向右转弯。一旦孩子们构建了这个游戏，鼓励他们规划自己的简单游戏，创建图形并编写代码！\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_15_0.png)\n\n+ 1.  启动Scratch。右键点击主角色，然后选择'删除'来删除它。（在Mac上，点击角色时需要按住'Control'键。）\n\
    \n2.  现在绘制你自己的火箭角色，就像第13页上的那个。\n\n3.  现在我们需要添加一些代码来让火箭前进，以及向左和向右转弯。\n\n右键点击意味着点击鼠标右侧的按钮。\n\
    \n点击火箭角色。\n\n然后点击脚本选项卡。\n\n从事件组中拖出三个'当按下...键'积木。\n\n从运动组中拖出'移动'和'转弯'积木。\n\n选择你想要用来让火箭前进和左右转弯的按键。\n\
    \n```\n当按下 [空格 v] 键\n移动 10 步\n\n当按下 [左箭头 v] 键\n移动 10 步\n右转 (-15) 度\n\n当按下 [右箭头\
    \ v] 键\n移动 10 步\n左转 (15) 度\n```\n\n空格键\n\n现在为游戏绘制你自己的背景图。\n\n首先，点击**'舞台'**。\n\n\
    | 角色 | |\n|:---|:---|\n| 舞台 | |\n| 1 个背景 | |\n\n角色 1\n\n然后点击**'背景'**。\n\n| 脚本\
    \ | |\n|:---|:---|\n| 背景 | |\n\n声音\n\n新背景 : 背景 1\n\n点击**填充**工具并选择黑色。\n\n现在点击背景为其上色。\n\
    \n使用**画笔**工具绘制一些星星。\n\n使用**画笔大小**滑块来改变星星的大小。\n\n使用**椭圆**工具绘制一些行星。按住**'Shift'**键以绘制完美的圆形。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_16_0.png)\n\n点击此按钮使你的程序最大化到屏幕大小！\n\n\
    ## 保存代码\n\n要保存你的工作，点击**'文件'**菜单（屏幕左上角），然后点击**'下载到你的计算机'**。\n\n要再次打开你的工作，首先你需要在浏览器中打开Scratch。然后点击**'文件'**菜单并选择**'从你的计算机上传'**。\n\
    \n---\n\n## 逐页指南\n\n## 第 2 册\n\n### 第 6–7 页\n\n## 循环\n\n### 第 8–9 页\n\n## 用循环绘制图案\n\
    \n![](img/67c0c813fc5d30d52471ee1f484e615_17_0.png)\n\n![](img/67c0c813fc5d30d52471ee1f484e615_17_1.png)\n\
    \n### 目标\n\n在任何编程语言中，一个关键概念是使用循环来一遍又一遍地重复指令。在这些练习中，孩子们将学习使用Logo来编程简单的循环，以绘制形状。\n\
    \n### 核心概念：循环\n\n在接触计算机之前，和孩子们讨论我们在日常生活中如何使用循环，并让他们思考一些例子。比如每天步行上学（重复5次）还是穿鞋（重复2次）？解释使用重复是一种使指令更高效的方式。讨论告诉一只千足虫一次穿一只鞋——或者使用重复循环的想法。让孩子们写下一些指令，例如：\n\
    \n告诉一只300条腿的千足虫穿鞋：\n\n**重复 300 [ 穿上鞋子 ]**\n\n告诉一个学生每天步行上学：\n\n**重复 5 [ 步行上学 ]**\n\
    \n### 目标\n\n这些练习将把孩子们对循环的理解提升到一个新的水平。我们将探索在一个循环内运行另一个循环的威力。我们将使用这个概念在Logo中制作一个图案。\n\
    \n### 核心概念：循环中的循环\n\n这个概念可能很难向孩子们解释，因此在接触计算机之前，使用一个有趣的类比会很有帮助。想象一家四口、每只有300条腿的千足虫正准备穿鞋。让我们用一个循环嵌套另一个循环来写下一些准备工作的命令：\n\
    \n```\n重复 4 [ 重复 300 [ 穿上鞋子 ] ]\n```\n\n提醒孩子们，他们需要将正在重复的命令用方括号括起来。因为有两个循环，所以需要两个左方括号和两个右方括号。\n\
    \n### 拓展练习\n\n使用Logo，让孩子们输入这段代码：\n\n```\n重复 20 [ 重复 4 [ 前进 100 右转 90 ] 右转 5 ]\n\
    ```\n\n这段代码不会绘制出完整的图案。尝试使用第一个重复的不同值来完成图案。答案在第62页。\n\n> **额外帮助**\n>\n> 如果孩子们在做'编写简单循环'练习时无法想象出形状，让他们大声朗读命令。他们甚至可以和伙伴一起拿着粉笔到户外去。一个孩子可以大声读出命令，而另一个则成为一个'人类机器人'——在地面上一边画一边遵守重复的命令。还要注意，在编程Logo循环时，孩子们可能会忘记输入两个括号，或者可能输入了花括号而不是方括号。\n\
    \n### 第 10–11 页\n\n## Scratch 中的循环\n\n![](img/67c0c813fc5d30d52471ee1f484e615_18_0.png)\n\
    \n### 目标\n\n孩子们现在将学习在Scratch中创建循环。Scratch的工作方式与Logo类似，使得应用已学知识变得直接了当。在另一种编程语言中尝试循环将帮助孩子们专注于重复的概念。与孩子们讨论在两种语言中创建简单循环的相似之处和不同之处。\n\
    \n### 拓展练习\n\n1.  向孩子们展示这段代码，并让他们预测它会绘制什么。（它是一个八边形。）\n\n```\n清空\n落笔\n重复 8\n  右转\
    \ 45 度\n  移动 50 步\n```\n\n2.  让孩子们修改代码以绘制一个12边形（十二边形）。\n\n大多数孩子会意识到，为了绘制12边形，他们需要将重复次数更改为12。大多数孩子会发现确定需要转弯的角度更难。让他们尝试使用更大或更小的数值。\n\
    \n正确的转弯角度是30度。这是因为，为了完成形状，我们需要总共转弯360度。我们分12步完成，所以360度除以12得到30度。\n\n### 第 12–13\
    \ 页\n\n## 无限循环\n\n![](img/67c0c813fc5d30d52471ee1f484e615_18_1.png)\n\n### 目标\n\
    \n到目前为止，我们已经研究了运行特定次数的循环。现在孩子们将学习使用永远运行——或者直到程序停止的循环。他们将使用'重复执行'循环在Scratch中为一个游泳的鱼编码。孩子们可以讨论大多数游戏都需要一个'主循环'一直运行的想法。主循环可以执行诸如在屏幕上移动对象或角色之类的事情。\n\
    \n### 拓展练习\n\n如果孩子们准备好学习更多关于'重复执行'循环的知识，让他们进行以下练习：\n\n+ 1.  讨论一下，如果我们的游泳鱼不使用'重复执行'循环，而是使用'重复100次'循环，会发生什么。（游戏会在几秒钟后停止。）\n\
    \n2.  使用'重复执行'循环，在Scratch中制作另一个游戏，这次是一个在屏幕上飞行的飞机。\n\n3.  设计你自己的游戏，让一个物体在屏幕上跟随鼠标移动。让你的想象力尽情驰骋吧！\n\
    \n![](img/67c0c813fc5d30d52471ee1f484e615_18_2.png)\n"
