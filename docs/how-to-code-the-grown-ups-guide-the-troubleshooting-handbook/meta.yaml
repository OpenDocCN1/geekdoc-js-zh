    ## 第一册


    ## 逐页指南


    ## 第22-23页


    ### 按下一个键


    ![](img/67c80c813fc5d30d52471ee1f484e615_11_0.png)


    ## 第24-25页


    ### 输入与方向


    ![](img/67c80c813fc5d30d52471ee1f484e615_11_1.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_11_2.png)


    ### 目标


    "按下一个键"教授两个关键概念：输入和事件。孩子们将了解到，输入和事件对于创建几乎所有的游戏和更复杂的程序都至关重要。孩子们还将开始思考编程的含义。非常基础的编程是遵循一连串的命令。然而，当我们开始使用输入和事件时，程序会通过执行不同的命令序列来作出响应。


    ### 目标


    孩子们将学习通过按不同的键来让Scratch角色向不同方向移动。这些练习是前几页"按下一个键"内容的延伸。孩子们需要对角度有非常基本的了解（参见第一册第12-13页）。


    ### 核心概念：输入和事件


    输入是一种动作——比如按下一个键——它告诉计算机去做某事。我们将了解到，程序运行时，代码并非每次都以相同的方式执行，而是当不同的输入发生时，程序的不同部分会被执行。在第22-23页的示例中，按下''R''将运行Scratch代码使角色向右移动。按下''L''将运行另一段代码，使角色向左移动。


    程序员将按键这样的输入动作称为事件。其他事件可能是用鼠标点击某个东西，或者程序启动。


    此时，可能值得重新思考什么是算法——我们正开始超越最初将其定义为"解决问题的步骤"（参见第一册第8-9页），而更倾向于将其视为描述游戏或程序如何运行的"规则集"。


    ![](img/67c80c813fc5d30d52471ee1f484e615_11_3.png)


    ### 额外帮助


    要进行这些练习，孩子们需要使用"面向方向"代码块，它以度为单位给出方向。为了保持简单，我们只使用0、90、180、270和360度角。"面向方向"块还提供了一个下拉菜单，其中包含提醒信息，例如"90°（右）"。Scratch使用-90°来指向左——下拉菜单中同样有提示表示这是向左。


    ### 进一步探索


    如果孩子们想更进一步，请他们编写许多简短、简单的程序（答案见第62页）：


    1.  编写一个简单的程序，当按下**方向键**而不是''U''、''D''、''L''、''R''时，角色能上、下、左、右移动。

    2.  编写一个程序，当按下''B''键时角色移动一大段距离，按下''S''键时移动一小段距离。

    3.  编写一个程序，当按下**空格键**时角色能对角线移动。


    ## 第26-27页


    ### 用输入进行绘画


    ![](img/67c80c813fc5d30d52471ee1f484e615_12_0.png)


    ### 目标


    孩子们将使用Scratch创建自己的绘画游戏。这个练习提供了大量练习使用输入的机会，也为拓展想法提供了广阔的空间。一旦孩子们让他们的绘画程序基本运行起来，你可以和他们谈谈计算机如何使用数字来表示颜色。


    ### 进一步探索


    孩子们可以尝试给他们的游戏添加这些额外功能：


    1.  从**事件**组中添加一个**''当按下键时''**积木，以及从**画笔**组中添加一个**''清除''**积木，这样画师就可以通过按键来清空屏幕。

    2.  添加另一组积木，使画师在按下**''U''**键时能抬起画笔。

    3.  添加另一组积木，使画师在按下**''P''**键时能重新开始绘画。

    4.  添加更多积木（使用**事件**和**运动**组），使画师能对角线绘画。

    5.  尝试设置画笔颜色（使用**画笔**组），并利用你的发现制作一个表格。在一列中写下颜色名称，在下一列中写下设置画笔颜色的值。


    答案请核对第62页。


    ## 第28-29页


    ### 调试


    ![](img/67c80c813fc5d30d52471ee1f484e615_12_1.png)


    ### 目标


    孩子们将学习"调试"的含义，并练习修复Logo和Scratch代码中的一些简单错误。调试是一项需要培养的重要技能。然而，预防胜于治疗，因此这些页面也提供了关于规划和测试简短程序的指导原则。


    > **额外帮助**


    在教孩子如何调试时，建模和演示这个过程非常有用。例如，在Scratch中制作一个移动角色的简单程序。稍微修改其中一小部分使其无法正常工作或角色向错误方向移动。询问孩子们是否能找出问题所在。如果你在教导一个小组，让成功调试的孩子解释他们是如何修复代码的，这样他们可以为其他人示范这种方法。


    ### 常见困惑


    在这个编程阶段，一个常见的困惑是在倒置的角色周围移动时，哪个方向是左，哪个是右。为了帮助理解，可以用一小张纸制作一个简单的角色或三角形（参见本书第8页）。


    > **小贴士**


    有时对孩子们来说，重新开始可能比调试一个他们无法修复的代码更容易。让他们仔细计划或解释他们希望代码做什么，然后逐步重建和测试。确保他们计划切实可行。从简单的游戏或程序开始，然后逐步构建。


    ## 绘制Scratch图形


    随着孩子们成为更熟练的编码者，他们将享受在自己的程序中创作自己图形的乐趣。这将鼓励他们更有创造力，释放他们的想象力。这里是在Scratch中创建图形的指南。


    ### 关键技巧学习


    虽然我们可以在电脑上以类似在纸上绘画的方式绘制图像，但有一些重要的区别。了解这些区别将帮助你为程序创建更好的图像。你可以通过使用Scratch中的角色编辑器来练习本页的技巧。如果你使用的是Windows电脑，也可以使用Microsoft
    Paint这样的程序，或者使用更复杂的软件包如Adobe Photoshop。你创建的任何图像都可以保存并在代码中使用。


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_0.png)


    ### 撤销


    当我们用铅笔画错了，可以用橡皮擦掉错误。尽管大多数绘画程序中都有橡皮工具，但通常在出错后立即点击"撤销"按钮（或者点击"编辑"然后"撤销"）要好得多。"撤销"会撤销你最后做的操作。


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_1.png)


    ### 放大与缩小


    用鼠标精确绘制东西可能很困难。当你试图让东西对齐或放到正确位置时，放大以使一切看起来更大要容易得多。当你完成某部分的工作后，再次缩小以查看整体图像。


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_2.png)


    ### 移动物品


    在纸上，如果我们把东西画错了地方，我们必须擦掉重画。在电脑上，我们可以把它移动到正确的位置。如果你刚画了一个形状，可能会有手柄可以移动或调整大小。如果没有，使用**选择**工具在你的图画周围画一圈，然后将其拖动到需要的位置。


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_3.png)


    **或者使用选择工具。**


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_4.png)


    ### 用形状构建图像


    尽管你可以用画笔画任何东西，但用一系列形状构建数字图像通常更容易。线条会更直，曲线会更平滑。尝试使用**椭圆**工具绘制细节，如轮子、眼睛、头部、身体、花朵和火箭！何不尝试用**矩形**工具来画汽车、建筑、墙壁、道路、牙齿、机器人和树木。


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_5.png)


    **使用线条、椭圆和矩形工具。**


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_6.png)


    ### 切割形状


    如果你找不到或画不出需要的形状，就从另一个形状上分解出来。例如，用**椭圆**工具画一个椭圆，然后使用**选择**工具选择它的上半部分。把它拖出屏幕，你就得到了一个微笑！


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_7.png)


    **使用选择工具。**

