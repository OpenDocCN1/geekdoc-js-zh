    # 引言


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_0.png)


    本指南支持《如何编程》的第 1 至 4 册。它旨在供帮助儿童学习编程的家长、教师或其他成年人使用。


    # 如何使用本书


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_1.png)


    **逐页指南**


    当儿童使用第 1 至 4 册探索编程时，您可以使用我们的逐页指南来跟踪他们的学习进度。您会找到涵盖的**核心概念**的解释。对于一些可能难以理解的概念，这些页面为您提供**额外帮助**，指导如何向他们解释。它还列出了儿童可能遇到的**常见困惑**以及克服它们的方法。当儿童发现某些想法易于掌握时，**深入探究**部分提供了额外的挑战。


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_2.png)


    **技术指南**


    本书末尾提供了本系列涵盖的五种语言的技术指南：**Logo**、**Scratch**、**Python**、**HTML**（超文本标记语言）和 **JavaScript**。在这里，您将找到所有需要的信息来获取、使用和解决这些语言的问题。


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_3.png)


    **扩展项目**


    对于第 1 至 4 册中的每一册，您都会找到一些有趣的扩展项目，这些项目将巩固所学的核心概念，并让儿童的学习更深入。


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_4.png)


    **附录**


    **语言比较**部分将帮助您理解本系列涵盖的每种语言之间的异同。**进阶说明**将使儿童能够认识到自己的进步，并确定他们下一步的学习方向。您还会在本书中找到所有挑战的**答案**以及**术语表**。


    # 学习编程


    本系列的四本书涵盖了若干核心概念，例如循环、变量和选择。随着从一册到下一册的进展，这些概念的复杂性逐渐增加。每本书使用两种编程语言来帮助儿童更深入地思考这些核心概念。


    所有儿童的学习速度不同。有些儿童会与某些特定的想法作斗争，而发现编码的其他部分很容易。重要的是让他们以适合自己的速度进步，给予他们时间去探索和真正巩固他们的学习。


    许多儿童会很乐意在电脑或平板电脑上花上几个小时。这并不推荐！重要的是要定期休息，做一些其他事情。虽然编程是未来一项非常重要的技能，但许多核心概念可以在远离电脑的情况下学习和巩固。问题解决和将解决方案分解为部分的高级技能，同样可以通过使用建构玩具和创造性游戏来发展。


    即使您自己不是编程专家，也请让孩子们向您解释他们正在进行的活动是如何编码的——并且不要害怕自己也尝试一下。最重要的是，让孩子们在编程中探索并获得乐趣。


    # 第 1 册


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_0.png)


    第 1 册向孩子们介绍了计算机需要被给予指令来告诉它们做什么的概念。孩子们了解到，**命令**需要清晰、精确，并且按正确的顺序给出，计算机才会按照他们的意愿行事。书中提供了许多活动来帮助教授这些想法，最初无需使用计算机。


    然后介绍了两种计算机语言。第一种是 **Logo**，它用于教孩子们输入简单的指令并立即获得结果。当他们输入命令时，屏幕上的海龟会移动并绘制，鼓励他们进行实验。第二种语言
    **Scratch** 将这些想法进一步拓展，并向孩子们介绍了**输入**。孩子们学习编程一个使用输入的简单游戏：按下按键将使 Scratch 精灵在屏幕上移动。


    ISBN 978 1 78493 236 7


    # 第 2 册


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_1.png)


    系列的第二册首先解释了编程中的一个核心概念——**循环**和重复的使用。使用 **Logo** 然后是 **Scratch**，向孩子们展示他们如何使用循环来绘制简单的形状，然后将它们组合成有趣的图案。他们了解到循环可以附加条件，因此它们会循环直到特定事件发生——例如在一个游戏中，一个精灵捕获另一个精灵。


    通过使用**声音**，探索了除屏幕之外的输出的使用。孩子们学习如何创建基本的钢琴或合成器程序。接下来，使用**变量**向孩子们展示程序如何存储和更改数据，例如游戏中的分数。孩子们将在
    Scratch 中构建自己的游戏和活动来练习这些技能。


    ISBN 978 1 78493 237 4


    # 第 3 册


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_2.png)


    第 3 册探讨了**选择**的概念，使用 **Scratch** 构建一个问答游戏。孩子们通过将选择与变量结合，为他们的问答游戏添加计分功能，进一步发展了这一想法。他们还创建了一个游戏，其中精灵每“吃掉”一个苹果就得分。


    第 3 册随后将这些概念带入专业的编程环境，使用 **Python** 语言。孩子们学习如何使用特殊的文本编辑器输入命令，并在 Python 中创建自己的程序。他们了解到如何使用编程**库**来生成**随机数**并创建**图形**。


    ISBN 978 1 78493 238 1


    # 第 4 册


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_3.png)


    系列的最后一册介绍了**万维网**及其工作原理，包括 **URL（统一资源定位符）**和**超链接**。孩子们学习使用 **HTML（超文本标记语言）**和文本编辑器创建网页。他们了解到如何使用**标签**向页面添加不同的对象或元素，以及如何将页面链接在一起。


    然后第 4 册向孩子们展示如何在页面中添加 **JavaScript** 代码。HTML 是用于编码网页内容的语言，而 JavaScript 用于编码网页的行为。孩子们学习
    JavaScript 如何处理循环，以及如何创建自己的**函数**。他们探索了网页如何包含图像和按钮，以及代码如何与它们关联。


    ISBN 978 1 78493 239 8


