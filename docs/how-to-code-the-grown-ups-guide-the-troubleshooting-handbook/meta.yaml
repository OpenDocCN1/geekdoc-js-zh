    \ online map you want to embed. Zoom in to the level you want.\n\n- 2. Find the\
    \ 'Share' button and click it. (On Google Maps, click the cog * first.)\n\n- 3.\
    \ Click the 'Embed' button. Highlight all the code, right-click your mouse and\
    \ choose 'Copy'\n\n![](img/67c80c813fc5d30d52471ee1f484e615_46_0.png)\n\nOn a\
    \ Mac, you'll have to hold the 'Control' key when you click.\n\n- 4. Start a new\
