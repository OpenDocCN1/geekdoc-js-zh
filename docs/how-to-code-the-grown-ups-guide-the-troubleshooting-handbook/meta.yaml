  md: "# EXTENSION PROJECTS\n\n# BOOK 3\n\n# Random Python graphics\n\nThese activities\
    \ will extend children's learning by combining two Python libraries: random numbers\
    \ and graphics. By using these libraries with some loops and variables, we can\
    \ create amazing patterns.\n\n# 1 RANDOM SQUARE\n\nStart IDLE, the Python editor,\
    \ and open a new file.\n\n# 2\n\nType in the following commands:\n\n```\nfrom\
    \ turtle import *\nfrom random import *\n```\n\n> This tells Python to borrow\
    \ all the commands from the turtle and random libraries and bring them into our\
    \ program.\n\n# 3\n\nTo start with, we need to move the turtle to a random position\
    \ on the screen. We can use the **goto** command to do this. It needs two random\
    \ values: the x position and y position of the square. (For a reminder about x\
    \ and y coordinates, see page 18 of this book.)\n\n+   - Create a variable called\
    \ x, with a random value between 0 and 300.\n- Create a variable called y, with\
    \ a random value between 0 and 300.\n- Pen up (don't draw).\n- Make the turtle\
    \ go to the point on the screen with coordinates (x,y).\n- Pen down (start drawing).\n\
    - This loop draws a square.\n\n```\nfrom turtle import *\nfrom random import *\n\
    \nx=randint(0,300)\ny=randint(0,300)\npu()\ngoto(x,y)\npd()\n\nfor s in range(0,4):\n\
    \    forward(100)\n    right(90)\n```\n\nSave and run your code to test it. Each\
    \ time you run it, the square will be drawm in a different place."
