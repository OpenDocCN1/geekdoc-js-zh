    # Styling with HTML


    Book 4 gives children an overview of how to change the colour and style of objects
    on a web page. Large websites will do this with additional files containing CSS
    (Cascading Style Sheets). Here we use a simpler approach to explore the concept,
    by putting style attributes inside tags.


    # STYLE TAGS


    To understand style tags, try the following code:


    ```

    <html>

    <body style=''background-color:yellow''>

    <h1 style=''color:red''>Web</h1>

    <p style=''color:green''>Internet</p>

    </body>

    </html>

    ```


    ![](img/67c80c813fc5d30d52471ee1f484e615_59_0.png)


    Style attributes can be combined by using semi-colons:

    `<p style=''color:pink; text-align:left''>Hi</p>`


    # HTML, JAVASCRIPT AND CSS


    Most web pages use a combination of three languages or technologies: HTML, JavaScript
    and CSS.


    **HTML** tells the browser what will go on a web page. It specifies what text,
    pictures, video and other objects will be shown. HTML can''t do calculations or
    respond to inputs from the user, other than simple things like loading a new page.


    **JavaScript** was designed to complement HTML by adding interactive functions
    so that objects on the web page can be changed, moved or hidden. JavaScript can
    do calculations, and is now a programming language in its own right.


    **CSS** is used by designers to specify the appearance of what is shown to someone
    viewing the web page. It has become increasingly important as web pages are viewed
    on different-sized devices, from smart phones to large-screen TVs.


    # USEFUL HTML STYLE ATTRIBUTES


    | STYLE ATTRIBUTE | WHAT IT DOES | EXAMPLE |

    |---|---|---|

    | **background-color** | Sets the background colour for an element in a web page.
    | **background-color:red** |

    | **color** | Sets the colour for an element, some text for example. | **color:blue**
    |

    | **font-size** | Sets the size for an element containing some text. | **font-size:36px**
    |

    | **font-family** | Sets the font name for some text. | **font-family:''Times
    New Roman''** |

    | **text-align** | Centres text, or justifies it to the left or right. | **text-align:center**
    |

    | **border-style** | Creates a border around an HTML element. | **border-style:dotted**
    |

    | **padding** | Makes some space between the edge of an element and what is inside
    it. | **padding:10px** |


    Where sizes are used, **px** means pixels. Note the American spellings of ''color''
    and ''center''.'
- md: '# JAVASCRIPT TECHNICAL GUIDE


    After children have learnt to use HTML to create simple web pages, it is worth
    learning some JavaScript. JavaScript will allow children to control what happens
    when users click buttons or load a page, and make their pages much more interactive.


    ## ADDING JAVASCRIPT


    There are a number of different ways of adding JavaScript to a web page. In larger
    websites, JavaScript will be loaded from separate files. To give children a taste
    of the language, in this series we keep the JavaScript in the page, and use simple
    HTML event attributes to run code.


    In the examples in Book 4, JavaScript is added in 2 ways:


    1. Between `<script>` and `</script>` tags in an HTML page, which means it will
    run the script when the page loads.

    2. Within an onclick HTML event attribute. For example: `<button onclick=''alert("Hi")''>Press</button>`


    ![插图](img/67c80c813fc5d30d52471ee1f484e615_60_0.png)


    > Remember:

    HTML = what is on the page.

    JavaScript = what the page does.

    CSS = what the page looks like.


    ## USEFUL JAVASCRIPT COMMANDS


    | COMMAND | WHAT IT DOES | EXAMPLE |

    | :--- | :--- | :--- |

    | alert() | Displays a message to the user. | alert(''Hello world'') |

    | var | Defines a variable to be used. | var score=0 |

    | for | Makes a loop that repeats a number of times. | for(var n=0; n<10; n++)
    |

    | document.write() | Adds something to the web page. | document.write(1) |

    | document.writeln() | Adds something to the web page and starts a new line. (A
    `<pre>` tag also needs to be added to the web page.) | document.writeln(1) |

    | if | Tests to see if a condition is true and runs code if it is. | if(age==10)alert(''Ten'')
    |

    | else | If the condition is false, then runs some code. | else alert(''You are
    not ten.'') |

    | function | Starts defining a function. | function sayHello() { alert(''Hello!'')
    } |


    # LANGUAGE COMPARISON


    The four languages (or technologies) covered in this series – Logo, Scratch, Python
    and HTML/JavaScript – all play a part in helping children learn some of the key
    coding concepts. Each of the languages has its own strengths and weaknesses, and
    not all of them cover every concept.


    It is helpful to compare how different languages approach similar concepts. This
    comparison will help children in two ways. First, it helps children think about
    the coding concept more deeply. Secondly, it helps them move from one language
    to another, allowing their learning to progress further.


    ## LANGUAGES AND CONCEPTS


    | Concept | LOGO | SCRATCH | PYTHON | HTML/JAVASCRIPT |

    | :--- | :--- | :--- | :--- | :--- |

    | Loops | `repeat 10 [ ... ]` | ![Scratch block](image) | `for n in range(10):`
    | `for(var n=0;n<10;n++)` |

    | Loop counter | `repeat 10 [print repcount]` | ![Scratch block](image) | `for
    n in range(1,11):`<br>`print(n)` | `for(var n=1;n<=10;n++)`<br>`document.writeln(n);`
    |

    | Selection | Not covered with Logo in this series. | ![Scratch block](image)
    | `answer=input("name?")`<br>`if answer=="Ada":`<br>`  print("Hello!")` | `var
    answer=prompt("Name?")`<br>`if(answer=="Ada")`<br>`  alert("Hello!")` |

    | Structure* | Not covered with Logo in this series. | ![Scratch block](image)
    | `if answer=="Ada":`<br>`  print("Hello!")`<br>`  print("World!")`<br><br>Indent
    lines of code with tabs. | `if(answer=="Ada"){`<br>`  alert("Hello!");`<br>`  alert("World!");`<br>`}`<br><br>Put
    curly brackets `{}` around lines of code and a semi-colon at the end of a line.
    |

    | Variables | Not covered with Logo in this series. | ![Scratch block](image)
    | `a=10`<br>`a=a+20`<br>`a=a*2` Doubling a | `var a=10;`<br>`a=a+20;`<br>`a=a*2;`<br><br>The
    first time you use a variable, you need to declare it with `var`. |

    | Random numbers | Not covered with Logo in this series. | ![Scratch block](image)
    | `randint(1,6)`<br><br>The random library needs to be imported first with `from
    random import *` | `parseInt(1+6*Math.random())` |


    > Note that these are all short extracts of code. They need to be put in a program
    to be demonstrated.<br>*This is sometimes called indent style or bracketing. It
    describes the way different languages run multiple lines of code in a loop or
    after an ''if'' command.


    # PROGRESSION STATEMENTS


    All children learn at different rates. As they progress through this series of
    books and become better coders, there are a number of key concepts they need to
    understand and apply. This list will help children identify their own progress.


    ## BOOK 1


    - [ ] I understand that computers need instructions to do things.

    - [ ] I know that instructions need to be precise.

    - [ ] I know that instructions need to be given in the correct sequence.

    - [ ] I can give instructions in Logo to move the turtle around the screen.

    - [ ] I can give instructions in Scratch to move the sprite around the screen.

    - [ ] I know that inputs are needed to change the way a program runs.

    - [ ] I can make a program that uses a key press input to make a sprite move around.

    - [ ] I can make my own simple program to move a sprite around the screen.

    - [ ] I can debug my programs to spot and fix simple bugs.


    ## BOOK 2


    - [ ] I can explain what a loop is and why programs use them.

    - [ ] I can program a ''repeat'' loop in Logo or Scratch to draw a shape.

    - [ ] I understand the difference between a loop that repeats a certain number
    of times and one that goes on forever.

    - [ ] I can make a game that uses a ''repeat until'' loop.

    - [ ] I understand that sound is another output from a program and I can make
    a program that plays a sound.

    - [ ] I understand what a variable is and how it can be used to keep the score
    in a game.

    - [ ] I can make a game that uses a variable.

    - [ ] I can debug my programs to fix some bugs.


    ## BOOK 3


    - [ ] I understand selection and what an ''if'' command is.

    - [ ] I can make a simple quiz using ''if'' and ''else'' commands.

    - [ ] I can use Python to print messages on the screen and do simple calculations.

    - [ ] I can use a ''for'' loop to print a sequence of numbers.

    - [ ] I understand what random numbers are, and can use them in simple programs.

    - [ ] I can make my own simple game that uses loops, variables and ''if'' commands.

    - [ ] I can look through my code and work out where bugs are.


    ## BOOK 4


    - [ ] I understand that websites use HTML pages and how the Internet connects
    computers together in a network.

    - [ ] I can code a simple HTML page with different-sized headings and text.

    - [ ] I can link pages together with anchor tags.

    - [ ] I know how web pages call JavaScript when buttons are clicked or a web page
    loads.

    - [ ] I can use JavaScript to make simple loops that print a sequence on a page.

    - [ ] I can explain why making functions is a good idea.

    - [ ] I can understand some messages I get from a debugging tool.

    - [ ] I can make a mini web project linking several pages together and containing
    text and images.


