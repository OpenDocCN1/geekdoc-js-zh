    # BOOK 3 PAGE-BY-PAGE GUIDE


    # PAGES 6–7 ‘If’ commands


    # PAGES 8–9 Quiz time


    ![](img/67c80c813fc5d30d52471ee1f484e615_27_0.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_27_1.png)


    **OBJECTIVES**

    ‘If commands’ introduces a concept called selection. Selection allows a program
    to run different bits of code in response to a question or input. Using Scratch,
    children will code a question-and-answer program using selection.


    **OBJECTIVES**

    Children will extend their understanding of selection by programming a quiz in
    Scratch. This project also uses a variable to count the score.


    **KEY CONCEPT: SELECTION**

    When children start coding, most of their programs will run in the same way each
    time, following a sequence of commands, one after the other. This is called sequential
    code. For example:


    ![](img/67c80c813fc5d30d52471ee1f484e615_27_2.png)


    > **EXTRA HELP**

    Children may need a reminder of how to use variables, which were introduced in
    Book 2 of this series. Variables are a way that computer programs store pieces
    of data or information. Unlike normal numbers, variables can change their value
    when something happens. Although variables can seem like quite an abstract idea,
    children will quickly grasp the concept of using a variable to keep a score. Most
    children are already familiar with how a score starts at zero at the beginning
    of a game – and increases as the game progresses.


    Make sure children understand the difference between setting the score at the
    start of the quiz, and adding 1 to it when they get an answer correct. Explain
    that by putting **‘Change s by 1’** inside the ‘C’ shaped part of the ‘If then’
    block, it only runs if the answer is correct.


    Selection means that a program may branch off and run a different piece of code
    in response to something happening, such as a question being answered. For example:


    ![](img/67c80c813fc5d30d52471ee1f484e615_27_3.png)


    Programmers often call this a ‘conditional statement’.'
- md: "# 'Else' commands\n\n![](img/67c80c813fc5d30d52471ee1f484e615_28_0.png)\n\n\
    ## OBJECTIVES\n\n'Else commands' continues our work on selection. Children will\
    \ learn how to use 'if then else' commands in Scratch. A basic 'if' code block\
    \ allows us to do something if a condition is true - for example, to show 'Well\
    \ done!' if an answer is correct. Adding an 'else' part to the code block allows\
    \ us to run a different bit of code if the answer is wrong.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_28_1.png)\n\
    \n## EXTRA HELP\n\nMove away from the computer to play these fun games that demonstrate\
    \ the concept of 'if then else'. These exercises will also enable you to see whether\
    \ children have understood the key concept of selection or not.\n\nAsk these questions,\
    \ or type the questions on a computer (using a large font or projector):\n\n-\
    \ if your age equals 10 **then** stand up **else** sit down\n- if you have black\
    \ hair **then** wave your hands **else** pat your stomach\n- if you are a girl\
    \ **then** dance **else** put your fingers in your ears\n\nOr give each child\
    \ a playing card and ask questions such as:\n\n- if card = 5 **then** wave **else**\
    \ frown\n- if card = red **then** jump up and down **else** put your hands on\
    \ your head\n\n# If sprite is touched...\n\n![](img/67c80c813fc5d30d52471ee1f484e615_28_2.png)\n\
    \n## OBJECTIVES\n\nThis project will combine children's understanding of selection\
    \ with their knowledge of loops. Loops are covered in Book 2 of this series -\
    \ turn to page 16 of this book for a recap. In this apple-eating game, a 'forever'\
    \ loop keeps our cat sprite moving towards the mouse pointer. An 'if then' command\
    \ will make apple sprites disappear if they are touched (or eaten!) by the cat.\n\
    \n## TAKING IT FURTHER\n\nIf children are comfortable with both selection and\
    \ loops, they could try these extra activities:\n\n1. Make a game where a monster\
    \ has to eat up aliens.\n2. To make the game more difficult, program the aliens\
    \ to move around the screen.\n3. Make the car-racing game on pages 22-23 of this\
    \ book. Take out the 'Touching color' part of the 'Repeat until' loop and add\
    \ an 'if' statement. Now make the score go down by 1 point if the car touches\
    \ the grass.\n4. Try changing the car-racing game so that if the car touches the\
    \ grass, it moves forward by -1 step. This will make the car slow down.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_28_3.png)\n\
    \n# BOOK 3 PAGE-BY-PAGE GUIDE\n\n# PAGES 14–15 Starting Python\n\n# PAGES 16–17\
    \ Python printing\n\n![](img/67c80c813fc5d30d52471ee1f484e615_29_0.png)\n\n![](img/67c80c813fc5d30d52471ee1f484e615_29_1.png)\n\
    \n## OBJECTIVES\nThese pages introduce the Python language. After Logo and Scratch,\
    \ Python is an excellent next step for children’s coding as it uses a more standard\
    \ text-based approach.\n\n## OBJECTIVES\nIn ‘Python printing’, children will learn\
    \ how to use Python to print text on the screen and to make simple calculations.\
    \ Typing programs in Python requires close attention to detail.\n\n### EXTRA HELP\n\
    \nFor help installing Python, see page 54 of this book. Make sure children are\
    \ confident starting up IDLE, the Python editor. Then show them how to set up\
    \ their screen so that the text editor with their typed code is on the left-hand\
    \ side. Save and run a simple program. A new window will appear – this shows the\
    \ output from the program. Show children how to position this on the right-hand\
    \ side of their screen for ease of working.\n\n### TIP\n\nIt is common for children\
    \ to make small errors when typing in Python code. Unfortunately, the Python editor\
    \ won’t always give helpful feedback if there are mistakes. Here are some tips\
    \ to avoid problems:\n1 Python won’t make it obvious when words are typed incorrectly,\
    \ but if it recognizes a command such as **print** it will change the text to\
    \ purple.\n2 When children are typing in the contents of print brackets – such\
    \ as **print(123)** – the brackets and 123 will be highlighted if they are typed\
    \ correctly: **print(123)**\nChildren need to learn to look for these visual clues\
    \ to know their code is correct.\n\n```\nprint(\"hello\")\n>>>\nhello\n>>>\n```\n\
    \nGet children to practise making simple one- or two-line programs until they\
    \ are happy carrying out these basic tasks. Note that IDLE recognizes commands\
    \ (such as **print**) and displays them in different colours. This is to help\
    \ programmers spot mistakes in their code. In our books, we have represented these\
    \ colours in shades of grey.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_29_2.png)\n\
    \n# PAGES 18–19\nPython questions\n\n# PAGES 20–21\nPython loops\n\n![](img/67c80c813fc5d30d52471ee1f484e615_30_0.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_30_1.png)\n\n## OBJECTIVES\n\nHaving\
    \ used selection in Scratch in Book 3 pages 6–13, children will now work with\
    \ selection in Python. Python’s simple approach will help children get a better\
    \ understanding of selection. Although all the commands have to be typed in, it\
    \ can be quicker and less fiddly to create a quiz in Python than in Scratch.\n\
    \n## OBJECTIVES\n\nHere we will extend our work on loops by doing some counting\
    \ in Python. Coding Python loops will reinforce children’s understanding of the\
    \ concept.\n\n## TAKING IT FURTHER\n\nAsk children to compare how they would program\
    \ the same quiz in Python and Scratch. For example:\n\n## TAKING IT FURTHER\n\n\
    1. There is a shortcut to creating Python loops. If you don't care what number\
    \ the loop starts from, you can just write:\n\n    `for n in range(10):`\n   \
    \ `    print(n)`\n\n2. If we want the loop to go up in numbers greater than 1,\
    \ we can use 3 values (or ‘arguments’) in the brackets. Experiment with this to\
    \ see how it works:\n\n    `for n in range(0,50,5):`\n    `    print(n)`\n\n```\n\
    answer=input(\"What is the capital of England?\")\nif answer==\"London\":\n  \
    \  print(\"Correct\")\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_30_2.png)\n\
    \n### EXTRA HELP\nOne of the main differences between the way Python and Scratch\
    \ handle loops is that Python also introduces a variable (for example, n) that\
    \ increases as the loop repeats. This is the case with most modern coding languages.\
    \ If children need a reminder of variables, remember that we used a variable to\
    \ keep the score in ‘Quiz time’ in Book 3 pages 8–9. Compare these Scratch and\
    \ Python loops:\n\n### COMMON CONFUSIONS\n\nWhen using Python, make sure children\
    \ remember to type the colon (:) and check for the tab after an ‘if’ command (in\
    \ these books, we use tabs to indent Python, but many programmers prefer using\
    \ 4 spaces). Also note that Python is what programmers call ‘case-sensitive’ –\
    \ it cares about capital letters when comparing text. It thinks ‘London’ is not\
    \ the same as ‘london’. In contrast, Scratch is not case-sensitive and treats\
    \ ‘london’ as equal to ‘London’.\n\n```\nrepeat (10)\nsay [Hello!]\n\nfor n in\
    \ range(0,10):\n    print(\"Hello!\")\n```\n\n# BOOK 3 PAGE-BY-PAGE GUIDE\n\n\
    # PAGES 22–23\nPython graphics\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_0.png)\n\
    \n## OBJECTIVES\n\nThese pages teach children how to create graphics in Python\
    \ by importing a library of code called ‘turtle’. The turtle commands allow children\
    \ to draw by moving around a turtle or sprite, in a similar manner to the drawing\
    \ functions in Logo and Scratch. In the ‘Loops and graphics’ exercises, we will\
    \ use loops to draw shapes.\n\n## TAKING IT FURTHER\n\nBy using two loops together,\
    \ one inside the other, we can create some of the patterns made with Logo in Book\
    \ 2 pages 8–9. This exercise will reinforce children’s understanding of both loops\
    \ and Python.\n\nIn Logo: **repeat 36 [ rt 10 repeat 4 [ fd 120 rt 90 ] ]**\n\n\
    In Python:\n\n```\nfrom turtle import *\nfor r in range(0,36):\n    rt(10)\n \
    \   for s in range(0,4):\n        fd(120)\n        rt(90)\n```\n\nWe are using\
    \ **fd** and **rt** instead of forward and right – but either will work in Python.\
    \ Typing **speed(0)** before any drawing commands will speed things up!\n\nBoth\
    \ programs draw a pattern like this:\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_1.png)\n\
    \n# PAGES 24–25\nRandom Python\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_2.png)\n\
    \n## OBJECTIVES\n\nHere we introduce another library that can be added to Python\
    \ – this time to create random numbers. Children will learn about the usefulness\
    \ of randomness in computer games. They will code Python programs to simulate\
    \ a coin toss and make ‘random sandwiches’.\n\n## KEY CONCEPT: RANDOM NUMBERS\n\
    \nA good way for children to grasp the concept of randomness is to toss a coin.\
    \ It is also worthwhile to compare how we program randomness in Python and Scratch.\
    \ In Python, we import the **random** library. In Scratch, we use commands in\
    \ the **Operators** group. The commands to pick random numbers are very similar\
    \ in both languages:\n\nIn Python: **randint(1,6)**\n\nIn Scratch:\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_3.png)\n\
    \nOnce children have learnt how to use random numbers in Scratch, they can be\
    \ dropped into any white box that normally has a number in it. For example:\n\
    Always drag the ‘Pick random’ block from the left end\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_4.png)\n\
    \nso you can drop it in a number box.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_5.png)\n\
    \nThis will make a sprite appear in a random place across the screen."
  mdcn: "\n# 'Else' 命令\n\n![](img/67c80c813fc5d30d52471ee1f484e615_28_0.png)\n\n##\
    \ 目标\n\n“Else 命令”延续了我们关于选择结构的教学。孩子们将学习如何在 Scratch 中使用“如果...那么...否则”命令。一个基本的“如果”代码块允许我们在条件为真时执行某些操作——例如，如果答案正确，就显示“干得好！”。在代码块中添加“否则”部分，则允许我们在答案错误时运行另一段代码。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_28_1.png)\n\n## 额外帮助\n\n离开电脑，玩玩这些演示“如果...那么...否则”概念的有趣游戏。这些练习也能让你了解孩子们是否理解了选择结构的关键概念。\n\
    \n提出这些问题，或者在电脑上打出这些问题（使用大字体或投影仪）：\n\n- 如果你的年龄等于10 **那么** 站起来 **否则** 坐下\n- 如果你有黑头发\
    \ **那么** 挥挥你的手 **否则** 拍拍你的肚子\n- 如果你是个女孩 **那么** 跳舞 **否则** 把手指放进耳朵里\n\n或者给每个孩子一张扑克牌，并问这样的问题：\n\
    \n- 如果牌 = 5 **那么** 挥手 **否则** 皱眉\n- 如果牌是红色的 **那么** 上下跳 **否则** 把手放在头上\n\n# 如果接触到角色...\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_28_2.png)\n\n## 目标\n\n这个项目将把孩子们对选择结构的理解与他们的循环知识结合起来。循环在本系列的第2册中涵盖——请翻到本书的第16页进行复习。在这个苹果吃游戏中，一个“重复执行”循环让我们的小猫角色持续向鼠标指针移动。一个“如果那么”命令将在苹果角色被小猫接触到（或吃掉！）时让它们消失。\n\
    \n## 拓展挑战\n\n如果孩子们对选择结构和循环都感到得心应手，他们可以尝试这些额外的活动：\n\n1. 制作一个怪物必须吃掉外星人的游戏。\n2. 为了增加游戏难度，让外星人在屏幕上移动。\n\
    3. 制作本书第22-23页的赛车游戏。从“重复直到”循环中移除“碰到颜色”部分，并添加一个“如果”语句。现在，如果车碰到草地，得分就减1分。\n4. 尝试修改赛车游戏，使得如果车碰到草地，它就向前移动-1步。这会让车减速。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_28_3.png)\n\n# 第三册逐页指南\n\n# 第14-15页：Python入门\n\
    \n# 第16-17页：Python打印\n\n![](img/67c0c813fc5d30d52471ee1f484e615_29_0.png)\n\n\
    ![](img/67c80c813fc5d30d52471ee1f484e615_29_1.png)\n\n## 目标\n这些页面介绍了Python语言。在学习了Logo和Scratch之后，Python是孩子们编码的绝佳下一步，因为它使用了更标准的基于文本的方法。\n\
    \n## 目标\n在“Python打印”中，孩子们将学习如何使用Python在屏幕上打印文本并进行简单计算。在Python中输入程序需要非常注重细节。\n\n\
    ### 额外帮助\n\n关于安装Python的帮助，请参阅本书第54页。确保孩子们有信心启动IDLE（Python编辑器）。然后向他们展示如何设置屏幕，使带有输入代码的文本编辑器位于左侧。保存并运行一个简单的程序。会出现一个新窗口——这显示了程序的输出。向孩子们展示如何将其放在屏幕的右侧，以便于操作。\n\
    \n### 提示\n\n孩子们在输入Python代码时犯小错误是很常见的。不幸的是，Python编辑器并不总是在有错误时提供有用的反馈。这里有一些避免问题的技巧：\n\
    1 Python不会在单词输入错误时明显提示，但如果它识别出像**print**这样的命令，它会将文本变为紫色。\n2 当孩子们在输入print括号的内容时——例如**print(123)**——如果输入正确，括号和123将被高亮显示：**print(123)**\n\
    孩子们需要学会寻找这些视觉线索，以知道他们的代码是正确的。\n\n```\nprint(\"hello\")\n>>>\nhello\n>>>\n```\n\
    \n让孩子们练习编写简单的单行或两行程序，直到他们能熟练执行这些基本任务。注意，IDLE识别命令（如**print**）并用不同颜色显示它们。这是为了帮助程序员发现代码中的错误。在我们的书中，我们用灰度来表示这些颜色。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_29_2.png)\n\n# 第18-19页\nPython问题\n\n\
    # 第20-21页\nPython循环\n\n![](img/67c80c813fc5d30d52471ee1f484e615_30_0.png)\n\n\
    ![](img/67c80c813fc5d30d52471ee1f484e615_30_1.png)\n\n## 目标\n\n在第三册第6-13页的Scratch中使用过选择结构后，孩子们现在将在Python中使用选择结构。Python简单的方法将帮助孩子们更好地理解选择结构。虽然所有命令都必须手动输入，但在Python中创建测验可能比在Scratch中更快且更少麻烦。\n\
    \n## 目标\n在这里，我们将通过在Python中进行一些计数来扩展我们在循环方面的工作。编写Python循环将强化孩子们对这一概念的理解。\n\n##\
    \ 拓展挑战\n\n让孩子们比较他们将如何在Python和Scratch中为同一个测验编程。例如：\n\n## 拓展挑战\n\n1. 创建Python循环有一个快捷方式。如果你不在乎循环从哪个数字开始，你只需要写：\n\
    \n    `for n in range(10):`\n    `    print(n)`\n\n2. 如果我们希望循环以大于1的数字递增，我们可以在括号中使用3个值（或“参数”）。通过实验来观察它是如何工作的：\n\
    \n    `for n in range(0,50,5):`\n    `    print(n)`\n\n```\nanswer=input(\"What\
    \ is the capital of England?\")\nif answer==\"London\":\n    print(\"Correct\"\
    )\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_30_2.png)\n\n### 额外帮助\nPython和Scratch处理循环的主要区别之一是，Python还引入了一个变量（例如，n），它在循环重复时递增。大多数现代编程语言都是这种情况。如果孩子们需要回顾一下变量，请记住我们在第三册第8-9页的“测验时间”中使用了一个变量来记录分数。比较这些Scratch和Python循环：\n\
    \n### 常见困惑\n\n使用Python时，确保孩子们记得输入冒号(:)并在“if”命令后检查制表符（在这些书中，我们使用制表符来缩进Python，但许多程序员更喜欢使用4个空格）。还要注意，Python是程序员所说的“大小写敏感”——它在比较文本时区分大写字母。它认为“London”和“london”是不同的。相比之下，Scratch不区分大小写，将“london”视为等于“London”。\n\
    \n```\nrepeat (10)\nsay [Hello!]\n\nfor n in range(0,10):\n    print(\"Hello!\"\
    )\n```\n\n# 第三册逐页指南\n\n# 第22-23页\nPython图形\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_0.png)\n\
    \n## 目标\n\n这些页面教孩子们如何通过导入一个名为‘turtle’的代码库在Python中创建图形。turtle命令允许孩子们通过移动一个乌龟或精灵来绘图，方式类似于Logo和Scratch中的绘图功能。在“循环与图形”练习中，我们将使用循环来绘制形状。\n\
    \n## 拓展挑战\n\n通过同时使用两个循环，一个嵌套在另一个内部，我们可以创建出在第2册第8-9页用Logo制作的一些图案。这个练习将强化孩子们对循环和Python的理解。\n\
    \n在Logo中：**repeat 36 [ rt 10 repeat 4 [ fd 120 rt 90 ] ]**\n\n在Python中：\n\n```\n\
    from turtle import *\nfor r in range(0,36):\n    rt(10)\n    for s in range(0,4):\n\
    \        fd(120)\n        rt(90)\n```\n\n我们使用**fd**和**rt**而不是forward和right——但两者在Python中都有效。在任何绘图命令之前输入**speed(0)**将加快速度！\n\
    \n两个程序都绘制出这样的图案：\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_1.png)\n\n# 第24-25页\n\
    Python随机数\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_2.png)\n\n## 目标\n\n在这里，我们介绍另一个可以添加到Python的库——这次是为了创建随机数。孩子们将了解随机性在计算机游戏中的用途。他们将编写Python程序来模拟掷硬币和制作“随机三明治”。\n\
    \n## 核心概念：随机数\n\n孩子们掌握随机性概念的一个好方法是抛硬币。同样值得比较的是我们在Python和Scratch中如何编程实现随机性。在Python中，我们导入**random**库。在Scratch中，我们使用**运算符**组中的命令。在这两种语言中，选择随机数的命令非常相似：\n\
    \n在Python中：**randint(1,6)**\n\n在Scratch中：\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_3.png)\n\
    \n一旦孩子们学会了如何在Scratch中使用随机数，就可以将它们放入任何通常带有数字的白色框中。例如：\n始终从左端拖动“在...和...之间取随机数”积木\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_31_4.png)\n\n这样你就可以把它放入数字框中。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_31_5.png)\n\
    \n这将使一个精灵出现在屏幕上的随机位置。\n"
