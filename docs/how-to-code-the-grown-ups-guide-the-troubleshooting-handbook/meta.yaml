    # 第 3 册\n\n# 随机 Python 图形\n\n这些活动将通过结合两个 Python 库——随机数和图形库——来扩展孩子们的学习。通过将这些库与一些循环和变量结合使用，我们可以创建出令人惊叹的图案。\n\
    \n# 1 随机正方形\n\n启动 Python 编辑器 IDLE，并打开一个新文件。\n\n# 2\n\n输入以下命令：\n\n```\nfrom turtle\
