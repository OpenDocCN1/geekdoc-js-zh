  md: "# BOOK 4 PAGE-BY-PAGE GUIDE\n\n# PAGES 14-15 Colour it!\n\n# PAGES 16-17 Adding\
    \ JavaScript\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_0.png)\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_1.png)\n\
    \n**OBJECTIVES**\n'Colour it!' will teach children how to change the colour and\
    \ style of objects on a web page. Large websites do this with additional files\
    \ containing CSS (Cascading Style Sheets; see page 58). Here we use a simpler\
    \ approach to explore the concept, by putting style attributes inside tags.\n\n\
    **OBJECTIVES**\nSo far children have been coding their web pages only with HTML.\
    \ To make their web pages more interactive, now they will learn how to combine\
    \ their HTML coding with another language, JavaScript. They will learn how to\
    \ add a 'listener' to make some JavaScript run when a button is clicked.\n\n**TAKING\
    \ IT FURTHER**\nChildren could also learn how to change the font their text is\
    \ printed in:\n\n+   1. Start a new HTML file in your text editor.\n2. Type in\
    \ this code:\n3. Save and test your page.\n4. Edit the second line to add a style\
    \ attribute\n5. Experiment with other fonts. Try using Impact and Tahoma first.\n\
    \n```\n<html>\n  <h1>Fruit</h1>\n  <p>Apples</p>\n</html>\n```\n\nIf you set a\
    \ font family that has more than one word in its name, you need to put quotes\
    \ round it. These need to be different quotes from the ones you used to set the\
    \ style attribute! For example, here single quotes are used around the font name,\
    \ double quotes around the style attribute:\n\n```\n<h1 style=\"font-family:'Comic\
    \ Sans MS'\">\n```\n\n**TAKING IT FURTHER**\nOnce children have mastered the exercises\
    \ in Book 4 pages 16-17, they could create a new web page with three buttons.\
    \ Each button needs to have a riddle written on it. Add onclick listeners to each\
    \ button so that when the button is clicked, the answer is shown as a message.\
    \ For example, try using this code (type it all on one line):\n\n```\n<button\
    \ onclick='alert(\"A bee flying backwards\")'>What goes zzub zzub?</button>\n\
    ```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_2.png)"
