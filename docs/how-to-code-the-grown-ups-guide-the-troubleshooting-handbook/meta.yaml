  md: "# STRINGS AND INTEGERS\n\nWe use variables to store information. Some information,\
    \ such as the score in a game, will be a number. If it is a whole number, we call\
    \ that an integer. Other information, such as your name, will be made up of letters.\
    \ Information that is made up of letters is called a string. A variable created\
    \ by an input statement will be a string, even if it has numbers in it. Python\
    \ treats strings and integers in different ways. It thinks 20 is not the same\
    \ as \"20\". If we need to compare the value of a string to an integer, first\
    \ we need to convert the string into an integer. To make that conversion, we used\
    \ **answer=int(answer)** in our quiz.\n\n# ADDING MORE QUESTIONS AND A SCORE\n\
    \nTo make our quiz ask 10 questions, we need to create an outer loop than fits\
    \ around the main part of our code. We also need to add a score variable that\
    \ will be set to zero at the start, and will go up if a player answers a question\
    \ correctly. Finally, we need to show the score at the end of the game.\n\n+ \
    \  1. Start a new file, or edit your current file.\n2. Type in the following code:\n\
    \n```\nfrom random import *\n\ns = 0\nfor q in range(1,11):\n    a = randint(1,12)\n\
    \    b = randint(1,12)\n    print(\"Question\", q, \"What is\", a, \"times\",\
    \ b)\n    answer = input(\"?\")\n    answer = int(answer)\n    if answer == a\
    \ * b:\n        print(\"correct\")\n        s = s + 1\n    else:\n        print(\"\
    wrong\")\nprint(\"You scored\", s, \"out of 10\")\n```\n\nSet score variable (s)\
    \ to zero.\n\nStart a loop that runs from 1 to 10.\n\nAsk the question – for example:\
    \ 'Question 3 What is 3 times 8?'\n\nIf the answer is correct, add 1 to the score\
    \ (s).\n\nDisplay the number of correct answers (s).\n\nMake sure that your code\
    \ is indented like above. Use the 'Tab' or 'Delete' keys to make it match if you\
    \ need to. Without the correct indents, your code won't work!\n\n![](img/67c80c813fc5d30d52471ee1f484e615_36_0.png)\n\
    \n```\n>>>\nQuestion 1 What is 4 times 7\n?28\ncorrect\n```\n\n35"
