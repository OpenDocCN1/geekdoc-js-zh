    \ = int(answer)\n    if answer == a * b:\n        print(\"correct\")\n       \
    \ s = s + 1\n    else:\n        print(\"wrong\")\nprint(\"You scored\", s, \"\
    out of 10\")\n```\n\n将得分变量 (s) 设为零。\n\n启动一个从 1 到 10 的循环。\n\n提问——例如：'问题 3 3 乘以\
