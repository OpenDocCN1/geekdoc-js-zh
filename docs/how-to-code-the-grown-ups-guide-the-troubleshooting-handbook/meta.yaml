    \ **outer** loop to draw 30 of the flowers, each in a random position.\n\n1. Start\
    \ IDLE, the Python editor, and open a new file.\n\n2. Type in the following code:\n\
    \n```\nfrom turtle import *\nfrom random import *\n\nspeed(0)\n\nfor p in range(0,30):\n\
    \    x=randint(-300,300)\n    y=randint(-300,300)\n    pu()\n    goto(x,y)\n \
    \   pd()\n\n    for r in range(0,6):\n        right(60)\n\n        for s in range(0,4):\n\
    \            forward(50)\n            right(90)\n```\n\nImport turtle library\
    \ and random library.\n\nMake turtle move quickly.\n\nRepeat outer loop 30 times.\n\
    Create a random value for x between -300 and 300.\nCreate a random value for y\
    \ between -300 and 300.\nPen up (don't draw).\nMove the turtle to (x,y).\nPen\
    \ down (start drawing).\n\nRepeat loop 6 times.\nTurn right 60 degrees.\n\nNow\
    \ draw each square:\nRepeat inner loop 4 times.\nMove forward 50 pixels.\nTurn\
    \ right 90 degrees.\n\n3. Save and run your code to test it. It should look rather\
    \ like this:\n\n# Challenge!\n\nTry adding an extra variable to use as the size\
    \ of the pattern. Set it to a random value. Use it instead of moving forward 50\
    \ in the inner loop.\n\n# Random Python quiz\n\nThis project combines many of\
    \ the key concepts covered so far: inputs, variables and random numbers. We will\
    \ also be using different types of variables. We will create a quiz asking 10\
    \ random times tables questions, and also counting the total answered correctly.\n\
    \n# ASKING A RANDOM QUESTION\n\nBefore making a quiz with 10 questions, we will\
    \ try making a quiz with 1 question.\n\n- 1. First we need to create two random\
    \ numbers for our question – let's call them **a** and **b**.\n2. Next we need\
    \ to ask the player what **a** times **b** is.\n3. Finally we need to check if\
    \ the player is correct or not, then tell them.\n\n# 1\n\nStart IDLE, the Python\
    \ editor, and open a new file.\n\n# 2\n\nType in the following commands:\n\nImport\
    \ random library.\n\n```\nfrom random import *\n```\n\nCreate a variable called\
    \ **a** with a random value between 1 and 12. Create a variable called **b** with\
    \ a random value between 1 and 12.\n\n```\na=randint(1,12)\nb=randint(1,12)\n\
    ```\n\n```\nprint(\"What is\",a,\"times\",b)\n```\n\nAsk the question, for example:\
    \ 'What is 5 times 4?'\n\n```\nanswer=input(\"?\")\n```\n\nWait for the player\
    \ to answer and store it in a variable called **answer**.\n\n```\nanswer=int(answer)\n\
    ```\n\nThe answer will be a 'string'. We will convert it to an integer so we can\
    \ compare it to **a times b**.\n\n```\nif answer==a*b:\n    print(\"correct\"\
