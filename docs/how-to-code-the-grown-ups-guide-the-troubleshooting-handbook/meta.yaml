  md: '# BOOK 2 PAGE-BY-PAGE GUIDE


    # PAGES 14–15 Repeat until...


    ![](img/67c80c813fc5d30d52471ee1f484e615_19_0.png)


    # OBJECTIVES


    Children will learn to use ‘repeat until’ loops in Scratch. Most games that use
    loops will need to stop running at some point: for example, when a car crashes
    into a wall.


    # KEY CONCEPT: ‘REPEAT UNTIL’ LOOPS


    Before children start coding, it is worth talking about the idea of repeating
    a task until something happens. For example:


    +   - Repeat [ eat your peas ] until none left

    - Repeat [ pour water into glass ] until full


    # EXTRA HELP


    Children may not have come across coordinates before, or used the terms x and
    y to describe where things are located on a screen. If so, show children the diagram
    below. Explain that the green dot is positioned at x=3 and y=2. The red dot is
    at x=6 and y=4. Ask them to work out x and y for the other dots.


    When we use ‘Set x to’ or ‘Set y to’ in Scratch, we are setting the position of
    the sprite using x and y values. We could move the sprite to the blue dot with
    this code:


    ![](img/67c80c813fc5d30d52471ee1f484e615_19_1.png)


    ```

    set x to 4

    set y to 6

    ```


    # PAGES 16–17 Repeat until caught


    ![](img/67c80c813fc5d30d52471ee1f484e615_19_2.png)


    # OBJECTIVES


    Using Scratch, children will program a chasing game using another ‘repeat until’
    loop. In this program, children will learn to code a second sprite, and the loop
    will repeat until the two sprites are touching.


    # COMMON CONFUSIONS


    Programming a second sprite can be fiddly. Children will need to follow the instructions
    carefully. Make sure that the cat and dog each get the right bit of code. There
    are two different ‘mini-programs’ or loops running here – one for each sprite.
    To change the code for a sprite, make sure that sprite is clicked first!


    ![](img/67c80c813fc5d30d52471ee1f484e615_19_3.png)'
