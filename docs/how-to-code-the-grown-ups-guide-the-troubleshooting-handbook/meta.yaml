    ## 第6-7页

    ## 发出指令


    ![](img/67c80c813fc5d30d52471ee1f484e615_7_0.png)


    ## 学习目标


    成为优秀程序员的第一步是认识到计算机需要清晰且精确的指令才能完成任务。"发出指令"提供了一系列活动，帮助孩子们在开始使用电脑之前理解这一概念。通过轮流"扮演机器人"，孩子们将明白在开始编写代码之前，清楚地了解你希望程序做什么是至关重要的。


    ## 核心概念：精确性与顺序


    我们需要确保孩子们理解指令必须精确。在计算机程序中只说"移动"是不够的——我们需要告诉计算机哪个对象以及朝哪个方向移动。


    接下来我们需要做的是确保我们给程序的任何指令都按正确的顺序排列。我们可以通过打乱指令顺序并观察会发生什么来轻松地演示这一点。


    ### 额外帮助


    将指令写在单独的卡片上会非常有效。然后你和孩子可以重新排列它们。


    - 向前走

    - 停！

    - 右转

    - 左转

    - 捡起

    - 向下

    - 放下

    - 向上

    - 向右

    - 向左


    ## 第8-9页

    ## 循序渐进


    ![](img/67c80c813fc5d30d52471ee1f484e615_7_1.png)


    ## 学习目标


    在"循序渐进"中，孩子们将学习"算法"这个术语。算法被解释为程序为解决问题需要采取的步骤。在第9页的游戏中，孩子们写下从棋盘上的一个位置移动到另一个位置所需的步骤序列。这就是一个基本的算法。


    ## 拓展提升


    随着孩子们成为更有经验的程序员，他们对"算法"的定义需要变得更加完善。一旦他们超越了简单的编程，他们的代码可能会向不同方向分支，或响应不同的输入。此时，他们将不再使用简单的指令或步骤序列，因此将算法视为一组解决问题或使游戏运行的规则可能更有帮助。随着他们进一步深入，他们将开始创建包含多个不同算法的程序。


    ![](img/67c80c813fc5d30d52471ee1f484e615_7_2.png)


    ## 第10-11页

    ## 编码信息


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_0.png)


    ## 学习目标


    在这里，孩子们将了解到我们给计算机的指令需要包含更多信息并且更加精确。我们不只是告诉机器人向上移动，而是引入了可以使用像**U5**这样的指令来向上移动5格的概念。这一概念进一步发展，用于创建简单的程序，例如**U4
    R4 D4 L4**，可以用来绘制一个正方形。


    ## 拓展提升


    在第11页的"你来命名！"游戏中，孩子们将编写程序来拼出自己的名字或首字母缩写。如果孩子们想进一步拓展游戏，可以请他们发明一些新命令来改变将要绘制的颜色。他们可以选择用**PR**表示"画笔
    - 红色"或用**PY**表示"画笔 - 黄色"。使用这些新命令来创建更长的程序，甚至完整的单词。


    例如，以下程序将写出''elsa''：


    **PR**（画笔红色）**R3 U2 L3 D3 R4**


    **PB**（画笔蓝色）**U5 D5 R1**


    **PG**（画笔绿色）**R3 U2 L3 U1 R3**


    **PO**（画笔橙色）**R4 D3 L3 U2 R3**


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_1.png)


    ## 第12-13页

    ## 旋转绕行


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_2.png)


    ## 学习目标


    要在地面上移动机器人，或在屏幕上移动小海龟，我们需要使用命令使其向前移动一定距离，或旋转一定角度。本页解释了如何用度数来衡量旋转的程度。为了保持简单，目前我们只使用90度的"四分之一转"。


    ### 额外帮助


    当我们需要解释电脑屏幕上的物体大小时，通常用像素来衡量。电脑屏幕上的每个点都是一个像素（"picture element"的缩写）。如果孩子难以理解什么是像素，你可以用放大镜观察电脑屏幕，或者放大一张低质量的数码照片来演示。随着不断放大，图片会变得模糊或出现"马赛克"，各个像素就会显现出来。


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_3.png)


    ## 拓展提升


    玩"人体机器人"游戏。不用方格纸，而是到户外的铺路石上或操场上进行。让孩子们两人一组合作。一个孩子发出指令，另一个扮演机器人执行指令。扮演机器人的伙伴可以在执行指令时用粉笔在地上画线。


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_4.png)


    **第14-15页**


    ## 学习Logo


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_0.png)


    ## 学习目标


    在这里，孩子们将学习一种简单编程语言的基础知识：Logo。他们将进行第一次基础编程。孩子们将使用三个基本命令来编程控制屏幕上的小海龟（箭头）：向前移动、左转和右转。有关使用Logo的技术指南，请参阅本书第50页。


    ## 常见困惑


    有些孩子发现很难判断该让小海龟左转还是右转，尤其是当小海龟朝下时。一个很好的辅助方法是制作一个小纸海龟，孩子们可以转动它来与屏幕上小海龟的方向保持一致。


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_1.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_2.png)


    **第16-17页**


    ## Logo图形


    ![](img/67c80c813fc5d3d0d52471ee1f484e615_9_3.png)


    ## 学习目标


    既然孩子们已经学会了在Logo屏幕上移动小海龟，他们将学习编写更有目的性的程序来绘制特定图形。


    ## 拓展提升


    如果孩子们已准备好将Logo编程提升到更高水平，可以请他们：


    1. 设计一个简单图案并使用Logo创建它。写下代码并与伙伴分享，让他们也能制作出这个图案。

    2. 为年幼的孩子制作一张海报，解释如何使用Logo。

    3. 与伙伴一起玩"人体机器人"游戏，使用Logo命令。让伙伴按照命令在操场上移动，同时用粉笔画出图形。

    4. 使用Logo命令绘制你名字中的一些字母。写下你使用的命令。确保目前只使用水平线和垂直线。


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_4.png)


    ```

    fd 100 rt 90 fd 50 rt 90

    fd 50 rt 90 fd 50 rt 180

    fd 50 rt 90 fd 50

    ```


    ## 第18-19页

    ## Scratch入门


    ![](img/67c80c813fc5d30d52471ee1f484e615_10_0.png)


    ## 学习目标


    在这里，孩子们将学习Scratch编程语言的基础知识。Scratch是学习Logo之后的一个很好的进阶选择。它能让孩子们掌握更复杂的编程概念，但使用起来仍然非常简单。有关使用Scratch的技术指南，请参阅本书第52页。


    ### 额外帮助


    在孩子们开始使用Scratch编程之前，你可以先给他们演示一下它是如何工作的。首先向他们展示不同类别的代码积木（如"事件"和"运动"）。然后演示如何将代码积木拖到脚本区（屏幕右侧）并连接起来组成简短的程序。向他们展示如何通过点击来运行每个代码积木。让他们看到如何通过将代码积木从脚本区拖出来将其从程序中移除，以及如何通过将下方的积木向下拖动来分离积木。


    ## 拓展提升


    如果孩子们准备好尝试更多，可以请他们：


    1. 将角色拖到屏幕左侧。通过点击**"运动"**组中的**"移动10步"**使其一直移动到右侧。你需要点击多少次？在第62页查看答案。


    2. 更改每次点击时角色移动的步数。为了在5次点击内穿过屏幕，需要将步数改为多少？什么数字能让它在2次点击内穿过屏幕？你认为整个屏幕有多宽（多少步）？在第62页查看答案。


    ## 第20-21页

    ## 落笔绘图


    ![](img/67c80c813fc5d30d52471ee1f484e615_10_1.png)

