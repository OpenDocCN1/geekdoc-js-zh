    # # GLOSSARY


    **Algorithm** The set of steps that solves a problem, or set of rules that defines
    a game or program.


    **Attributes** Extra information about an object, such as its width or height.


    **Browser** A program used to view websites and HTML pages. Popular browsers include
    Chrome, Internet Explorer, Firefox and Safari.


    **Command** A word or code block that tells the computer what to do.


    **Coordinates** The position of an object determined by its x (left to right)
    and y (bottom to top) values.


    **CSS (Cascading Style Sheets)** The language used to store detailed style information
    for web pages.


    **Debugging** Fixing problems (bugs) in a computer program.


    **Domain** A part of the internet that is made up of computers or websites that
    are related in some way. For example, they may all be in the UK and have web addresses
    ending .co.uk.


    **Download** To copy data from one computer to another using the internet.


    **Editor (or text editor)** A program used to type and edit programs.


    **Embedding** Including a video or map from another website within a web page.


    **Event** Something that happens while a program is running:; for example a key
    being pressed, or the program starting.


    **Function** A sequence of commands created to do something such as draw a square
    every time the function is run or ''called''.


    **HTML (Hyper Text Mark-up Language)** The language used to define the objects
    that are on web pages.


    **HTTP (Hyper Text Transfer Protocol)** Rules for transporting HTML pages over
    the internet.


    **Hyperlink** Link to another web page, which can be reached by clicking the mouse
    or touching a touchscreen.


    **IDLE** The editor used to write Python code.


    **If...then...else** A common form of selection in coding, where a command is
    run if something is true, and a different command if it is false.


    **Import** To take data from one program into another.


    **Indent** Using tabs or spaces to move a line of code in from the left.


    **Input** An action (such as pressing a key) that tells a program to do something.


    **Integer** A whole number. In code it means a type of variable that stores whole
    numbers.


    **Internet** A worldwide network of computers.


    **JavaScript** The programming language used in some web pages.


    **Language** A system of words, numbers, symbols and rules for writing programs.


    **Library** A collection of commands that are already stored and ready for use.


    **Listener (or event listener)** A line of code or function that is only run when
    a particular event happens, such as a button being clicked.


    **Logo** A computer language where commands move a turtle around the screen to
    draw.


    **Loop** A sequence of commands repeated a number of times.


    **Main loop** A loop in a game or program that contains the main part of the program.


    **Network** A group of computers connected by wires or, often today, wireless
    links.


    **Online** Connected to the internet.


    **Operator** A piece of code that carries out a mathematical or logical operation.


    **Output** Something that a computer program does to show the results of a program.


    **Parameter** A value passed to a command. In the line of code fd(50), the parameter
    is 50.


    **Pixel** A tiny dot on the screen of a computer or tablet.


    **Plain text** Stored text that is all the same size, font and colour.


    **Program** The special commands that tell a computer how to do something.


    **Python** A text-based programming language.


    **Scratch** A computer language that uses blocks to make a program.


    **Selection** The way a computer program chooses which commands to run, after
    a simple question or value check.


    **Server** A computer or group of computers that stores and delivers web pages.


    **Sprite** An object moving around the screen.


    **String** A sequence of letters or symbols. A string is a type of variable. A
    string can contain numbers but you cannot do mathematical operations in them.


    **Tags** Special words and symbols used to describe what objects there are on
    a web page. They are always surrounded by angle brackets <>.


    **Turtle** An onscreen robot that is moved around to draw in Logo or Python.


    **Upload** To transfer files from your computer to another computer, which is
    often larger and in a different place.


    **URL (Uniform Resource Locator)** The address or location of a website or HTML
    page. It is usually shown at the top of the browser window.


    **Variable** A value or piece of data stored by a computer program.


    **Web page** A page of information constructed using HTML and connected to the
    World Wide Web.


    **World Wide Web (or web)** A worldwide network of HTML files, which we can access
    using the internet.


