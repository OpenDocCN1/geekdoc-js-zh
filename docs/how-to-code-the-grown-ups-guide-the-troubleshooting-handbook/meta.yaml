  md: '# TECHNICAL GUIDE


    The simple programming language Logo is an excellent tool for children to learn
    some simple coding. Each instruction they type will have an immediate effect,
    enabling them to quickly explore and experiment. With a small number of short
    commands, they can create simple drawings, shapes and patterns.


    # GETTING HOLD OF LOGO


    Because Logo was designed over 40 years ago, it won''t allow you to create the
    same sort of games as some other computer coding languages, but it is a great
    way to learn about some key coding concepts.


    If you are using a PC, it is worth downloading Logo. The online versions use the
    same instructions but can be a bit more fiddly to use. You can download a version
    for free from:

    **www.softronix.com/logo.html**


    Alternatively, both Mac and PC users can work with Logo online. Visit:

    **www.calormen.com/jslogo/**


    or

    **http://turtleacademy.com/playground/en**


    # USING LOGO


    To get started with Logo, just click in the command box and type a command (see
    opposite for useful commands). For example, type **fd 50** and press **''Enter''**.
    Each version of Logo is slightly different. Some have **''Run''** buttons and
    some don''t. If your version doesn''t, press **''Enter''** after typing a command.


    There are two ways to type longer programs that have multiple commands. Children
    can type the first command, then press ''Enter'', then the second command, press
    ''Enter'' and so on. Alternatively, to type all the commands in one go, type the
    first command, then press ''Space'', type the second command, press ''Space''
    and so on.


    For example: **fd 50 rt 90 fd 50 lt 90 fd 100 – then press ''Enter''**.


    Press the up and down cursor keys to bring back the last few commands you have
    typed.


    ![](img/67c80c813fc5d30d52471ee1f484e615_51_0.png)


    This is the drawing area.


    This is the turtle.


    This is the command box.


    Type your program here.


    Click **''Run''** to test your code or press the **''Enter''** key.


    ```

    fd 50 rt 90 fd 50 lt 90 fd 100

    ```'
