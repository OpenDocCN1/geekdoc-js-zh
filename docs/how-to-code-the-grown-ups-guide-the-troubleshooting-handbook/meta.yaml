  md: '# BOOK 2


    # PAGE-BY-PAGE GUIDE


    # PAGES 22–23


    # Variables


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_0.png)


    # OBJECTIVES


    These pages explain variables, which are a key concept in any programming language.
    Before moving on to more complex exercises on the following pages, children will
    grasp the idea of variables by creating a simple program using a single variable
    in Scratch.


    # KEY CONCEPT: VARIABLES


    Variables are a way that computer programs store pieces of data or information.
    Unlike normal numbers, variables can change their value when something happens.
    Although variables can seem like quite an abstract idea, children will be familiar
    with the use of a score variable in games. They will be used to the idea that
    the value of the score in a game can change from being zero at the start – and
    will increase as the game progresses.


    # COMMON CONFUSIONS


    Some children may be confused by the difference between the letter a, the variable
    a and the value of the variable a. This is how Scratch handles variables:


    This just means: display the letter a. In many other programming languages, it
    would have speech marks round it – "a" – and be called a string.


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_1.png)


    This means: display the value of the variable a. In our code it looks like an
    a but when we run the code, it shows up as the value in a.


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_2.png)


    # PAGES 24–25


    # Keeping score


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_3.png)


    # OBJECTIVES


    Using Scratch, children will learn to create a score variable (called s) for a
    game. The variable will keep track of how long the game is running. At the start
    of the game, the value of s is set to 0. Every time the main loop in the game
    repeats, the value of the variable s (our score) goes up by 1.


    # COMMON CONFUSIONS


    It is important that children understand the difference between setting a variable
    to a specific value, and increasing it. Try swapping round the **''Set s to 0''**
    and **''Change s by 1''** code blocks to demonstrate what happens.


    # TAKING IT FURTHER


    When children are ready to try more, ask them to:


    +   1. Change the shark game to make the score go up in 2s, 5s or 10s. Then check
    the answers on page 62.

    2. Use a **''Say''** code block to display the score at the end of the game.


    ![](img/67c80c813fc5d30d52471ee1f484e615_21_4.png)'
