    a number of new techniques. They will learn how to use an image as a link and
    how to change the size of an image. These are very useful skills to apply to other
    projects.


    1


    Start a new web page in your text editor and type in the following text:


    Text editor


    ```

    <html>

    <h1>Countries</控制不住</h1>

    </html>

    ```


    2


