    \ 50。\n\n# 随机 Python 测验\n\n这个项目结合了迄今为止涵盖的许多关键概念：输入、变量和随机数。我们还将使用不同类型的变量。我们将创建一个测验，随机询问\
    \ 10 个乘法表问题，并计算回答正确的总数。\n\n# 提问一个随机问题\n\n在制作一个包含 10 个问题的测验之前，我们将尝试制作一个包含 1 个问题的测验。\n\
    \n- 1. 首先我们需要为问题创建两个随机数——我们称它们为 **a** 和 **b**。\n2. 接下来我们需要询问玩家 **a** 乘以 **b**\
    \ 是多少。\n3. 最后我们需要检查玩家是否正确，然后告诉他们。\n\n# 1\n\n启动 Python 编辑器 IDLE，并打开一个新文件。\n\n#\
    \ 2\n\n输入以下命令：\n\n导入 random 库。\n\n```\nfrom random import *\n```\n\n创建一个名为 **a**\
    \ 的变量，其值为 1 到 12 之间的随机数。创建一个名为 **b** 的变量，其值为 1 到 12 之间的随机数。\n\n```\na=randint(1,12)\n\
    b=randint(1,12)\n```\n\n```\nprint(\"What is\",a,\"times\",b)\n```\n\n提问，例如：'5\
