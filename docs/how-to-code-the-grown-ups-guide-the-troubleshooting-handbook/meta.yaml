- md: " ## PAGES 26-27\nRandom art\n\n# OBJECTIVES\n\nIn 'Random art', we return to\
    \ Scratch to apply what has been learnt about random numbers. We will be making\
    \ a bubble picture using random coordinates, pen sizes and colours.\n\n# HOW THE\
    \ CODE WORKS\n\n```\n1. clear\n2. pen down\n3. set pen size to 10\n4. repeat 20\n\
    5.   pen up\n6.   set x to pick random -200 to 200\n7.   set y to pick random\
    \ -150 to 150\n8.   set pen size to pick random 1 to 50\n9.   set pen color to\
    \ pick random 0 to 200\n10.  pen down\n11. loop back\n12. hide\n```\n\n- 1. Clear\
    \ the screen.\n2. Pen down (so it will draw).\n3. Set pen size to 10 pixels.\n\
    4. Repeat the commands within the main loop 20 times.\n5. Pen up (don't join each\
