  md: '**BOOK 2**


    **EXTENSION PROJECTS**


    # Racing game


    This project will extend children''s learning by combining a ''repeat until''
    loop with a variable. Using Scratch, we will create a car-racing game in which
    the loop will keep the car moving until it hits something. A variable will be
    used to time how long the car has been driven without crashing.


    ![](img/67c80c813fc5d30d52471ee1f484e615_23_0.png)


    1. Start Scratch. Delete the main sprite by right-clicking on it and then choosing
    ''Delete''. (On a Mac, you will need to hold the ''Control'' key while you click.)


    2. Now draw your own car sprite.


    Start by clicking ''Paint new sprite''.


    ![](img/67c80c813fc5d30d52471ee1f484e615_23_1.png)


    Choose a colour and select the **Rectangle** tool. Draw the car body.


    ![](img/67c80c813fc5d30d52471ee1f484e615_23_2.png)


    Then add more rectangles, wheels and a driver (using the **Ellipse** tool).


    3. Make the car sprite smaller by clicking the **Shrink** icon and then clicking
    the car several times.


    ![](img/67c80c813fc5d30d52471ee1f484e615_23_3.png)


    4. Now draw your own track for the car to drive on. Don''t make it too narrow.


    Click ''Stage''.


    ![](img/67c80c813fc5d30d52471ee1f484e615_23_4.png)


    Then click ''Backdrops''.


    ![](img/67c80c813fc5d30d52471ee1f484e615_23_5.png)


    Click the **Fill** tool and choose a green colour. Now click the background to
    colour it in. Then use grey rectangles to draw the track.


