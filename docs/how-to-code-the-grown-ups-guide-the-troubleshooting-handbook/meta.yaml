  md: '# # USEFUL SCRATCH COMMANDS


    | Category | Command Description |

    | :--- | :--- |

    | **MOTION GROUP** | Move sprite forward. |

    | | Rotate sprite right. |

    | | Rotate sprite left. |

    | | Point the sprite up, down, left or right. |

    | | Point the sprite towards the mouse or another sprite. |

    | | Set sprite x coordinate (left to right). |

    | | Set sprite y coordinate (up or down). |

    | **LOOKS GROUP** | Show message. |

    | | Show message then hide it. |

    | | Show sprite. |

    | | Hide sprite (make it disappear). |

    | **SOUND GROUP** | Play or record a sound file. |

    | | Play a musical note. |

    | | Choose which instrument will play it. |

    | | Play a drum beat. |

    | **PEN GROUP** | Clear the screen. |

    | | Draw when the sprite moves. |

    | | Don''t draw. |

    | | Choose colour to draw with. |

    | | Choose line thickness. |

    | **EVENTS GROUP** | Run commands below when the green flag is clicked. |

    | | Run commands below when the selected key is pressed. |

    | **CONTROL GROUP** | Repeat commands inside the ''C'' 10 times. |

    | | Repeat commands inside the ''C'' forever. |

    | | Repeat commands until the condition in the hexagon is true. |

    | | If the condition in the hexagon is true, run the commands. |

    | | If the condition in the hexagon is true, run the commands in the top ''C'',
    else run the commands in the bottom ''C''. |

    | **SENSING GROUP** | Ask the user a question. |

    | | Stores the answer to a question. |

    | | Use with ''Repeat until'' or ''if'' to check whether objects are touching.
    |

    | | Use with ''Repeat until'' or ''if'' to check the colour the sprite is touching.
    |

    | **OPERATORS GROUP** | Use with ''Repeat until'' or ''if'' to check values are
    equal. |

    | | Make a random number. |


    # # COMMON PROBLEMS


    +   1. Commands are in the wrong order. Try swapping blocks around to see if that
    fixes the problem.

    2. Children often confuse turning left with turning right, or setting x with setting
    y coordinates. Keep handy a diagram or a ''paper turtle'' marked with L and R.

    3. When more than one sprite is used, it is easy to forget to click on the correct
    sprite before adding or changing code.

    4. Some settings persist. For example, try clicking ''Pen down'' before making
    a program to draw a shape (but omitting the ''Pen down'' command from within the
    program), then save the program. The shape will draw because Scratch ''remembers''
    the ''Pen down'' command. However, if you open the program the next day, the shape
    won''t be drawn, because ''Pen down'' was not part of the program.

    5. The ''Touching color'' command block is tricky to use. Make sure the colour
    being checked for is exactly the same as the required colour by using the colour
    picker.


    ![](img/67c80c813fc5d30d52471ee1f484e615_54_0.png)'
