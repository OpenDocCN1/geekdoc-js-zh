    \n```\nrepeat until touching color \U0001F7E9?\n    move 2 steps\n    change s\
    \ by 1\nend\n```\n\n点击这个按钮让游戏变大！\n\n![](img/67c80c813fc5d30d52471ee1f484e615_24_3.png)\n\
    \n> **挑战！**\n\n你能添加音效，让游戏结束时出现撞车声吗（尝试鼓声）？\n\n## 变量的趣味应用\n\n一旦孩子们掌握了变量并能自信地运用它们，就有许多方法可以扩展他们的理解。在这里，我们将使用\
    \ Scratch 将变量与循环、声音和图形结合起来。\n\n### 变量与声音\n\n试试这个程序，它结合了循环、变量和声音。\n\n+   1. 从**Control**组中，将一个“Repeat”循环块拖到脚本区域。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_25_0.png)\n\n+   2. 从**Sound**组添加一个“Play\
    \ note”代码块。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_25_1.png)\n\n+   3. 点击**Data**组，创建一个名为“a”的变量。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_25_2.png)\n\n+   4. 在循环开始前放入一个“Set\
    \ a to 0”代码块。将“a”设置为 60。\n\n```\nset a to 60\nrepeat 10\n  change a by 1\n  play\
    \ note a for 0.5 beats\n```\n\n将带有“a”的小圆圈拖到“Play note”代码块中。\n\n将“Change a by 1”代码块放入重复循环中。测试你的代码。进行实验！\n\
    \n现在创建这 3 个程序。它们会为哪类游戏创造出有用的音效？\n\n```\nset instrument to 17\nset a to 60\nrepeat\
    \ 12\n  play note 8 for 0.1 beats\n  change a by 5\n  repeat 10\n    play note\
    \ 8 for 0.1 beats\n    change a by -5\n```\n\n使用两个循环。\n\n```\nset volume to 100%\n\
    set a to 100\nrepeat 10\n  set volume to 8%\n  play note 60 for 0.1 beats\n  change\
    \ a by -10\n```\n\n创建回声效果。\n\n```\nset instrument to 16\nset a to 100\nrepeat\
    \ 20\n  play note 8 for 0.05 beats\n  change a by -5\n```\n\n尝试“a”的变化量以及循环重复次数。\n\
    \n### 变量与图形\n\n既然你已经学会了用循环创建基本图形模式，试着添加变量吧。在循环中使用变量来改变图形的边长等属性，可以创造出一些有趣的效果。在\
    \ Scratch 中绘图时，记得代谢产物缩小猫角色，以免它碍事。\n\n这个循环绘制一个正方形：\n\n```\npen down\nrepeat 4\n\
    \  move 100 steps\n  turn 90 degrees\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_0.png)\n\
    \n现在添加一个变量来制作螺旋：\n\n```\npen down\nset 'a' to 0\nrepeat 40\n  move a steps\n \
    \ turn 90 degrees\n  change 'a' by 2\n```\n\n你能解释这个循环是如何工作的吗？\n\n正方形程序的边长固定为 100\
    \ 步。\n\n螺旋图形的原理是每循环一次将边长增加 2 步，并将长度存储在名为“a”的变量中。\n\n现在尝试改变转动角度或“a”的变化量。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_1.png)\n\
    \n这个程序绘制一条粗线：\n\n```\npen down\nset pen size to 6\nrepeat 100\n  move 2 steps\n\
    ```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_2.png)\n\n变量让线条变得越来越粗：\n\n\
    ```\npen down\nset 'a' to 0\nrepeat 100\n  set pen size to a\n  move 2 steps\n\
    \  change 'a' by 1\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_3.png)\n\
    \n这个程序同时改变颜色和画笔大小。设置画笔颜色时，确保使用“Set pen color to 0”代码块。\n\n现在尝试用不同的方式让变量改变绘制的内容。\n\
    \n```\nset pen size to 1\npen down\nset 'a' to 0\nrepeat 200\n  move 2 steps\n\
    \  set pen color to a\n  change 'a' by 1\n  set pen size to a\n  turn 1 degrees\n\
    ```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_4.png)\n\n## 第三册 逐页指南\n\n###\
    \ 第 6–7 页 “如果”命令\n\n### 第 8–9 页 问答时间\n\n![](img/67c80c813fc5d30d52471ee1f484e615_27_0.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_27_1.png)\n\n**学习目标**\n“If commands”介绍了一个名为“选择”的概念。选择允许程序根据问题或输入运行不同的代码段。使用\
    \ Scratch，孩子们将利用选择编写一个问答程序。\n\n**学习目标**\n孩子们将通过在 Scratch 中编写问答程序来扩展他们对选择的理解。本项目还使用变量来统计分数。\n\
    \n**关键概念：选择**\n当孩子们开始编程时，他们的大多数程序每次都以相同的方式运行，按照顺序一个接一个地执行命令。这称为顺序代码。例如：\n\n![](img/67c80c813fc5d30d52471ee1f484e615_27_2.png)\n\
    \n> **额外帮助**\n孩子们可能需要回顾一下变量（本系列第二册中介绍过）的使用方法。变量是计算机程序存储数据或信息的一种方式。与普通数字不同，变量可以在某事发生时改变其值。虽然变量看起来是一个相当抽象的概念，但孩子们会很快理解使用变量来记录分数的概念。大多数孩子已经熟悉分数在游戏开始时从零开始——并随着游戏进行而增加的原理。\n\
    \n确保孩子们理解在测验开始时设置分数与答对时加 1 之间的区别。解释将**“Change s by 1”**放在“If then”代码块的“C”形部分内部时，只有在答案正确时才会执行\
    \ Southwest。\n\n选择意味着程序可能会分支并运行不同的代码段，以响应某事的发生，例如问题被回答。例如：\n\n![](img/67c80c813fc5d30d52471ee1f484e615_27_3.png)\n\
    \n程序员通常称之为“条件语句”。\n"
