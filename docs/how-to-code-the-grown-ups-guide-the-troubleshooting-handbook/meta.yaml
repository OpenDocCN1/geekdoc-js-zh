    \ If it is a whole number, we call that an integer. Other information, such as\
    \ your name, will be made up of letters. Information that is made up of letters\
    \ is called a string. A variable created by an input statement will be a string,\
    \ even if it has numbers in it. Python treats strings and integers in different\
