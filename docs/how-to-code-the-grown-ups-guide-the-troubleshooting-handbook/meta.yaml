  md: '# PAGES 26-27

    Random art


    ![](img/67c80c813fc5d30d52471ee1f484e615_32_0.png)


    # OBJECTIVES


    In ''Random art'', we return to Scratch to apply what has been learnt about random
    numbers. We will be making a bubble picture using random coordinates, pen sizes
    and colours.


    # HOW THE CODE WORKS


    ```

    1. clear

    2. pen down

    3. set pen size to 10

    4. repeat 20

    5.   pen up

    6.   set x to pick random -200 to 200

    7.   set y to pick random -150 to 150

    8.   set pen size to pick random 1 to 50

    9.   set pen color to pick random 0 to 200

    10.  pen down

    11. loop back

    12. hide

    ```


    +   1. Clear the screen.

    2. Pen down (so it will draw).

    3. Set pen size to 10 pixels.

    4. Repeat the commands within the main loop 20 times.

    5. Pen up (don''t join each dot).

    6. Set x (left to right position) to a random number from -200 to 200.

    7. Set y (top to bottom position) to a random number from -150 to 150.

    8. Set dot size to a random number from 1 to 50 pixels.

    9. Choose a random colour.

    10. Pen down (draw the dot).

    11. Loop back up.

    12. Hide the sprite at the end.


    # PAGES 28-29

    Debugging


    ![](img/67c80c813fc5d30d52471ee1f484e615_32_1.png)


    # OBJECTIVES


    These debugging exercises in Scratch and Python will help children to develop
    the key skills of spotting and fixing mistakes in their coding. In particular,
    the Python exercises will encourage good proofreading skills, which are essential
    when working with text-based programming languages.


    > > **EXTRA HELP**

    >

    > Debugging Python code can be a particularly difficult skill to master. Some
    children will be able to spot the mistakes in exercises 4-7 at first glance. Many
    children will need a little extra help. Ask them to type the buggy codes into
    IDLE. Although Python will not correct mistyped words, it will change the colour
    of commands such as **print** when it recognizes them. When programming anything
    in Python, remind children to look out for the colour changes and bracket highlighting
    to check code has been typed correctly.


    ![](img/67c80c813fc5d30d52471ee1f484e615_32_2.png)'
