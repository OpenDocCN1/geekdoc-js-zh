  md: '# PAGE-BY-PAGE GUIDE


    # BOOK 2


    # PAGES 6–7


    # Loops


    # PAGES 8–9


    # Patterns with loops


    ![](img/67c80c813fc5d30d52471ee1f484e615_17_0.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_17_1.png)


    # OBJECTIVES


    One of the key concepts in any programming language is the use of loops to repeat
    instructions over and over again. In these exercises, children will learn to use
    Logo to program simple loops that will draw shapes.


    # KEY CONCEPT: LOOPS


    Before moving to the computer, talk to children about how we use loops in everyday
    life, and get them to think of some examples. How about walking to school every
    day (repeating 5 times) or putting on shoes (repeating 2 times)? Explain that
    using repetition is a way of making instructions more efficient. Discuss the idea
    of telling a millipede to put on each of its shoes one at a time – or using a
    repeat loop. Get children to write down some instructions, for example:


    Tell a 300-legged millipede to put on its shoes:

    **repeat 300 [ put on shoe ]**


    Tell a pupil to walk to school every day:

    **repeat 5 [ walk to school ]**


    # OBJECTIVES


    These exercises will take children’s understanding of loops to the next level.
    We will explore the power of running one loop inside another loop. We will use
    this concept to make a pattern in Logo.


    # KEY CONCEPT: LOOP INSIDE A LOOP


    This can be a difficult concept to explain to children, so it will be helpful
    to use a fun analogy before moving to the computer. Imagine that a family of four
    300-legged millipedes are getting ready to put their shoes on. Let’s write down
    some commands to get them ready, using a loop within a loop:


    ```

    repeat 4 [ repeat 300 [ put on shoe ] ]

    ```


    Remind children that they need to put square brackets around the commands they
    are repeating. As there are two loops, there will need to be two left and two
    right brackets.


    # TAKING IT FURTHER


    Using Logo, ask children to type this code:


    ```

    repeat 20 [ repeat 4 [ fd 100 rt 90 ] rt 5 ]

    ```


    The code will not draw a complete pattern. Experiment with different values for
    the first repeat to complete the pattern. The answer is on page 62.


    > **EXTRA HELP**


    If children are unable to visualize the shapes while doing the ‘Coding simple
    loops’ exercises, get them to read the commands out loud. They could even go outside
    with a piece of chalk and a partner. One child could read aloud the commands while
    the other becomes a ‘human robot’ – drawing on the ground while obeying the repeated
    commands. Note also that, when programming Logo loops, children may forget to
    type both brackets, or they may type curly brackets instead of square ones.'
  merge: -1
  pgno: 17
