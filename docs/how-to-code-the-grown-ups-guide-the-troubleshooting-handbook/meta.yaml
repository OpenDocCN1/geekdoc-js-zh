  md: "# Random Python quiz\n\nThis project combines many of the key concepts covered\
    \ so far: inputs, variables and random numbers. We will also be using different\
    \ types of variables. We will create a quiz asking 10 random times tables questions,\
    \ and also counting the total answered correctly.\n\n# ASKING A RANDOM QUESTION\n\
    \nBefore making a quiz with 10 questions, we will try making a quiz with 1 question.\n\
    \n+   1. First we need to create two random numbers for our question – let's call\
    \ them **a** and **b**.\n2. Next we need to ask the player what **a** times **b**\
    \ is.\n3. Finally we need to check if the player is correct or not, then tell\
    \ them.\n\n# 1\n\nStart IDLE, the Python editor, and open a new file.\n\n# 2\n\
    \nType in the following commands:\n\nImport random library.\n\n```\nfrom random\
    \ import *\n```\n\nCreate a variable called **a** with a random value between\
    \ 1 and 12. Create a variable called **b** with a random value between 1 and 12.\n\
    \n```\na=randint(1,12)\nb=randint(1,12)\n```\n\n```\nprint(\"What is\",a,\"times\"\
    ,b)\n```\n\nAsk the question, for example: ‘What is 5 times 4?’\n\n```\nanswer=input(\"\
    ?\")\n```\n\nWait for the player to answer and store it in a variable called **answer**.\n\
    \n```\nanswer=int(answer)\n```\n\nThe answer will be a ‘string’. We will convert\
    \ it to an integer so we can compare it to **a times b**.\n\n```\nif answer==a*b:\n\
    \    print(\"correct\")\nelse:\n    print(\"wrong\")\n```\n\nCheck to see if the\
    \ answer is equal to **a times b**. If equal, display **correct**. Else display\
    \ **wrong**.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_35_0.png)\n\nIDLE will\
    \ keep adding tabs after you type **if**. You need to delete one of these before\
    \ typing **else**."
  merge: -1
