    \ a random value between 0 and 300.\n- Pen up (don't draw).\n- Make the turtle\
    \ go to the point on the screen with coordinates (x,y).\n- Pen down (start drawing).\n\
    - This loop draws a square.\n\n```\nfrom turtle import *\nfrom random import *\n\
    \nx=randint(0,300)\ny=randint(0,300)\npu()\ngoto(x,y)\npd()\n\nfor s in range(0,4):\n\
    \    forward(100)\n    right(90)\n```\n\nSave and run your code to test it. Each\
    \ time you run it, the square will be drawn in a different place.\n\n# DRAWING\
    \ MULTIPLE RANDOM PATTERNS\n\nWe will now extend our program to draw 30 flower\
