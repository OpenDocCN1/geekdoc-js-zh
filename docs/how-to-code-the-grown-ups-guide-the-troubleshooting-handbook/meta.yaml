  - '[PAGE 5]


    # INTRODUCTION


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_0.png)


    This guide supports Books 1 to 4 of How to Code. It is intended to be used by
    parents, teachers or other adults who are helping children learn to code.


    # How to use this book


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_1.png)


    **PAGE-BY-PAGE GUIDES**

    While children are exploring coding with Books 1 to 4, you can keep track of their
    learning with our page-by-page guides. You''ll find explanations of the **Key
    concepts** covered. Where some concepts may be hard to understand, these pages
    give you **Extra help** on how to explain them. It also lists **Common confusions**
    that children may experience and ways to overcome them. When children have found
    ideas easy to grasp, the **Taking it further** sections provide extra challenges.


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_2.png)


    **TECHNICAL GUIDES**

    At the back of the book are technical guides to the five languages covered in
    this series: **Logo**, **Scratch**, **Python**, **HTML** (Hyper Text Mark-up Language)
    and **JavaScript**. Here you''ll find all the information you need to get hold
    of, use and troubleshoot these languages.


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_3.png)


    **EXTENSION PROJECTS**

    For each of Books 1 to 4, you will find a number of fun extension projects that
    will reinforce the key concepts learnt and take children''s learning even deeper.


    ![](img/67c80c813fc5d30d52471ee1f484e615_5_4.png)


    **APPENDICES**

    The **Language comparison** section will help you understand the differences and
    similarities between each of the languages covered in this series. The **Progression
    statements** will allow children to recognize their own progress and identify
    their next steps for learning. You will also find a **Glossary** and all the **Answers**
    to the challenges set in this book.


    # Learning to code


    Each of the four books in this series covers a number of key concepts, such as
    loops, variables and selection. The concepts grow in complexity as you progress
    from book to book. Each book uses two coding languages to help children think
    more deeply about these key concepts.


    All children learn at different rates. Some children will struggle with particular
    ideas and find other parts of coding easy. It is important to let them progress
    at a rate that gives them time to explore and really embed their learning.


    Many children will be happy to spend several hours on a computer or tablet. This
    is not recommended! It is important to take a break and do something else at regular
    intervals. While coding is a very important skill for the future, many of the
    key concepts can be learnt and reinforced away from the computer. The higher-level
    skills of problem-solving and breaking down solutions into parts can be developed
    equally well by the use of construction toys and creative play.


    Even if you are not a coding expert yourself, ask children to explain to you how
    to code the activity they are working on – and don''t be afraid to have a go yourself.
    Most importantly, let children explore and have fun with their coding.'
