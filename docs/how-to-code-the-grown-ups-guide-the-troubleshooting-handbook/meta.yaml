    3. Now we need to add some code to make the rocket move forward, and to turn left
    and right.


    Right-clicking means click the button on the right side of the mouse.


    Click the rocket sprite.


    Then click the Scripts tab.


    Drag three ''When key pressed'' blocks from the Events group.


    Drag the ''Move'' and ''Turn'' blocks from the Motion group.


