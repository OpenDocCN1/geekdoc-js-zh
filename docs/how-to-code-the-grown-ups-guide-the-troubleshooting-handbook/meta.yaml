  md: '# SCRATCH TECHNICAL GUIDE


    Scratch is a programming language that uses a similar approach to Logo, making
    a turtle (called a ‘sprite’ in Scratch) move around the screen. However, with
    Scratch you drag and join commands instead of typing them. Scratch is great fun
    for learning to code games and creating graphics and sound effects.


    # GETTING HOLD OF SCRATCH


    You can use Scratch on a PC or Mac by opening your web browser and going to:

    **http://scratch.mit.edu**

    Then click ‘Try it out’ or ‘Create’.


    There is a very similar website called ‘Snap’, which also works on iPads. It is
    available here:

    **http://snap.berkeley.edu/run**


    If you want to run Scratch without using the internet, you can download it from
    here:

    **http://scratch.mit.edu/scratch2download/**


    # USING SCRATCH


    ![](img/67c80c813fc5d30d52471ee1f484e615_53_0.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_53_1.png)


    # SAVING YOUR WORK


    Click the ‘File’ menu at the top of the page on the left.

    Then click:


    **Download to your computer** – to save a file.

    **Upload from your computer** – to open a file you saved earlier.

    **New** – to start some new work.'
