  md: '# USEFUL LOGO COMMANDS


    # DIRECTING THE TURTLE


    | Command | Description |

    |---------|-------------|

    | fd 50 | Move forward 50 steps. |

    | rt 90 | Turn right 90 degrees. |

    | lt 90 | Turn left 90 degrees. |

    | bk 50 | Move backward 50 steps. |

    | cs | Clear the drawing box. |

    | seth 0 | Make the turtle point up. |

    | st | Show turtle. |

    | ht | Hide turtle. |


    You can type ''forward'' instead of ''fd''. It doesn''t matter in Logo if you
    use capital letters or not. Most other languages are more fussy. Remember you
    can change the number after the command, to alter how far the turtle turns or
    moves. This number is called the parameter.


    # POSITIONING THE TURTLE


    | Command | Description |

    |---------|-------------|

    | setpos[ 100 200 ] | Set the position of the turtle to 100, 200. |

    | setx 100 | Set the x coordinate (left to right) to 100. |

    | sety 200 | Set the y coordinate (bottom to top) to 200. |

    | wrap | When the turtle goes off the edge of the screen, wrap around and re-appear
    on the other side. |

    | fence | When the turtle reaches the edge of the screen, hit an invisible fence
    and stop. |


    # DRAWING


    | Command | Description |

    |---------|-------------|

    | pu | Pen up: lift the pen up and stop drawing. |

    | pd | Pen down: put the pen down to draw. |

    | setpc 5 | Set the pen to colour number 5. (Most computer languages use numbers
    to represent colours.) |

    | setpensize 5 | Set thickness of line drawn by turtle to 5. |


    # LOOPS


    | Command | Description |

    |---------|-------------|

    | repeat | Repeat a sequence of commands a specific number of times. For example:
    **repeat 4 [ fd 100 rt 90 ]** will repeat four times, forward 100 then right 90
    degrees. Both square brackets must be included to make the code work. |


    # PRINTING


    | Command | Description |

    |---------|-------------|

    | print 10+10 | Output 20 on the screen. |

    | print heading | Print the heading (angle the turtle is facing) on the screen.
    |

    | print xcor | Print the current x value of the turtle on the screen. |

    | print ycor | Print the current y value of the turtle on the screen. |

    | ct | Clear any printed text from the screen. |


    # ANGLES


    Learners need a basic understanding of degrees to make use of Logo. Knowing that
    90 degrees make a right angle or quarter-turn is necessary to draw simple shapes.
    However, Logo also gives children a perfect environment to explore and develop
    the concept of angles. Once your children have grasped how to draw a square using
    **rt 90** to turn the corners, ask them to try changing the 90 to 45 and see what
    happens.


    # ESTIMATION


    Once children have learnt how to move the turtle 10 or 20 steps forward, try asking
    them questions like: ''How many steps will we need to move forward to reach the
    edge of the screen?'' Or put your finger on the screen and ask: ''How many steps
    will move the turtle to my finger?''


    ```

    fd 60

    rt 45

    fd 60

    rt 45

    fd 60

    rt 45

    fd 60

    ```


    ![](img/67c80c813fc5d30d52471ee1f484e615_52_0.png)


    Logo!


    ![](img/67c80c813fc5d30d52471ee1f484e615_52_1.png)'
