    # BOOK 3 PAGE-BY-PAGE GUIDE


    # PAGES 14–15 Starting Python


    # PAGES 16–17 Python printing


    ![](img/67c80c813fc5d30d52471ee1f484e615_29_0.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_29_1.png)


    OBJECTIVES

    These pages introduce the Python language. After Logo and Scratch, Python is an
    excellent next step for children’s coding as it uses a more standard text-based
    approach.


    OBJECTIVES

    In ‘Python printing’, children will learn how to use Python to print text on the
    screen and to make simple calculations. Typing programs in Python requires close
    attention to detail.


    > EXTRA HELP


    For help installing Python, see page 54 of this book. Make sure children are confident
    starting up IDLE, the Python editor. Then show them how to set up their screen
    so that the text editor with their typed code is on the left-hand side. Save and
    run a simple program. A new window will appear – this shows the output from the
    program. Show children how to position this on the right-hand side of their screen
    for ease of working.


    > TIP


    It is common for children to make small errors when typing in Python code. Unfortunately,
    the Python editor won’t always give helpful feedback if there are mistakes. Here
    are some tips to avoid problems:

    1 Python won’t make it obvious when words are typed incorrectly, but if it recognizes
    a command such as **print** it will change the text to purple.

    2 When children are typing in the contents of print brackets – such as **print(123)**
    – the brackets and 123 will be highlighted if they are typed correctly: **print(123)**

    Children need to learn to look for these visual clues to know their code is correct.


    ```

    print("hello")

    >>>

    hello

    >>>

    ```


    Get children to practise making simple one- or two-line programs until they are
    happy carrying out these basic tasks. Note that IDLE recognizes commands (such
    as **print**) and displays them in different colours. This is to help programmers
    spot mistakes in their code. In our books, we have represented these colours in
    shades of grey.


    ![](img/67c80c813fc5d30d52471ee1f484e615_29_2.png)


