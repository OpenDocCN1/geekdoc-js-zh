  md: '# PAGES 26–27


    **Sketching with inputs**


    ![](img/67c80c813fc5d30d52471ee1f484e615_12_0.png)


    # **OBJECTIVES**


    Children will create their own drawing game using Scratch. This exercise offers
    plenty of opportunities to practise using inputs and a lot of scope to take ideas
    further. Once children have got a basic version of their drawing program working,
    you could talk to them about how computers use numbers to represent colours.


    # **TAKING IT FURTHER**


    Children can try adding these extra features to their game:


    +   1. Add a **''When key pressed''** block from the **Events** group and a **''Clear''**
    block from the **Pen** group, so the artist can clear the screen with a key press.

    2. Add another set of blocks so the artist can lift the pen up when **''U''**
    is pressed.

    3. Add another set of blocks so the artist can start drawing again when **''P''**
    is pressed.

    4. Add more blocks (using the **Events** and **Motion** groups) so the artist
    can draw diagonally.

    5. Experiment with setting the pen colour (using the **Pen** group) and use your
    findings to make a table. Write the colour names in one column and the value to
    set pen colour to in the next column.


    Check the answers on page 62.


    # PAGES 28–29


    **Debugging**


    ![](img/67c80c813fc5d30d52471ee1f484e615_12_1.png)


    # **OBJECTIVES**


    Children will learn the meaning of ''debugging'' and practise fixing some simple
    mistakes in Logo and Scratch codes. Debugging is an essential skill to develop.
    However, prevention is better than cure, so these pages also offer guidelines
    about planning and testing short programs.


    > **EXTRA HELP**


    When teaching children how to debug, it is very useful to model and demonstrate
    the process. For example, make a simple program that moves a sprite in Scratch.
    Change a small part of it so that it doesn''t work or the sprite moves in the
    wrong direction. Ask children if they can work out what is wrong. If you are working
    with a group, ask successful debuggers to explain how they fixed the code, so
    they can model this approach for everyone else.


    # **COMMON CONFUSIONS**


    A common confusion at this level of coding is which way is left and which is right
    when moving around an upside-down sprite. To help, make a simple sprite or triangle
    out of a small piece of paper (see page 8 of this book).


    > **TIP**


    Sometimes it may be easier for children to start again rather than debug code
    that they cannot fix. Get them to plan or explain carefully what they want their
    code to do, and to rebuild and test it gradually. Make sure they plan realistically.
    Start with simple games or programs, then build up.'
  merge: -1
