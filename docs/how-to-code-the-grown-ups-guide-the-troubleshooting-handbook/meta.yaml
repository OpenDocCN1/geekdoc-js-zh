  md: '# ACCOMPANIES THE HOW TO CODE SERIES


    # THE GROWN-UPS'' GUIDE


    # WELCOME TO THE WORLD OF COMPUTER CODING!


    This essential handbook for parents and teachers introduces and explains all aspects
    of coding covered in books 1–4.


    +   - Extra background information and detailed explanations to the main concepts
    are included to help grown-ups support their child or student.


    +   - Page-by-page guides cover all key areas and extra activities are included
    for children ready to take things further.


    +   - Explains algorithms, loops, variables, debugging and more!


    +   - Technical advice and troubleshooting tips are provided for each language
    explored in the series: Logo, Scratch, Python, HTML and JavaScript.


    **Contains all you need to know about How to Code!**


