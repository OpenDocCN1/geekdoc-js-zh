    How old are you?\") |\n| **if** | Test if a condition is true or not. | if n==10:\
    \ |\n| **else** | Run a block of code following an ‘if’ statement, when the condition\
    \ is false. | else:\n print(\"wrong\") |\n| **for…in…range** | Make a repeating\
    \ loop. | for n in range(0,10): |\n| **from…import…** | Import a code library,\
    \ for example containing graphics commands. | from random import * |\n| **turtle**\
    \ | A graphics library. | from turtle import * |\n| **forward** or **fd** | Move\
    \ the turtle forward. | forward(10) |\n| **left** or **lt** | Rotate the turtle\
    \ left. | left(90) |\n| **right** or **rt** | Rotate the turtle right. | right(45)\
    \ |\n| **pendown** or **pd** | Pen down: draw when the turtle moves. | pd() |\n\
    | **penup** or **pu** | Pen up: don’t draw when the turtle moves. | penup() |\n\
    | **goto** | Move the turtle to specific coordinates. | goto(200,100) |\n| **color**\
    \ | Set the colour for the turtle to draw with. Note the American spelling: ‘color’.\
    \ | color(\"orange\") |\n| **random** | A library to create and work with random\
    \ numbers. | from random import * |\n| **randint** | Create a random number between\
    \ two values. | dice=randint(1,6) |\n| **choice** | Randomly select an item from\
    \ a list. | days=[\"M\",\"Tu\",\"W\",\"Th\",\"F\"]\nprint(choice(days)) |\n| **int**\
