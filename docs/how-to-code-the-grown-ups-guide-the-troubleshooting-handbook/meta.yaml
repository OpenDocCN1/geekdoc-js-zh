    \ Brackets and quotes are missing or not matching. Encourage children to check\
    \ their typing. Python will give some warnings: “**EOL while scanning string literal**”\
    \ means there is a missing quote; “**unexpected EOF while parsing**” means something\
    \ is missing at the end of the line, often a bracket.\n\n2. Indents are incorrect.\
    \ Don’t forget to use tabs after ‘if’ commands and for loops. IDLE adds these\
    \ automatically, but if children want several things to happen after an ‘if’ statement\
    \ they may need to add tabs. If they only want one thing to happen, they will\
    \ need to delete a tab.\n\n3. The range in a ‘for’ loop is incorrect. The range\
    \ starts with the 1st number, but stops before the 2nd number. For example, **for\
    \ n in range(1,10)** makes a loop run from 1 to 9. Making a random number is different:\
    \ **randint(1,10)** creates random numbers from 1 to 10.\n\n4. Accidentally deleting\
