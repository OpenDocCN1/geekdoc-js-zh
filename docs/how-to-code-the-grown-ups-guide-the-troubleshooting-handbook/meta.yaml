    ## PAGE-BY-PAGE GUIDE


    ## PAGES 22-23


    ### Press a key


    ![](img/67c80c813fc5d30d52471ee1f484e615_11_0.png)


    ## PAGES 24-25


    ### Inputs and directions


    ![](img/67c80c813fc5d30d52471ee1f484e615_11_1.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_11_2.png)


    ### OBJECTIVES


    ''Press a key'' teaches two key concepts: inputs and events. Children will learn
    that inputs and events are vital to creating almost all games and more sophisticated
    programs. Children will also begin to develop their thinking about what programming
    means. Very basic programming is about following a single sequence of commands.
    However, when we start using inputs and events, programs will respond by following
    different sequences of commands.


    ### OBJECTIVES


    Children will learn to make the Scratch sprite move in different directions by
    pressing different keys. These exercises are a progression from those in ''Press
    a key'' on the previous pages. Children will need a very basic understanding of
    degrees (see Book 1 pages 12-13).


    ### KEY CONCEPTS: INPUTS AND EVENTS


    An input is an action – such as pressing a key – that tells a computer to do something.
    We will learn that, instead of our code working in the same way each time the
    program is run, different parts of the program will be followed when different
    inputs occur. In the example on pages 22-23, pressing ''R'' will run Scratch code
    to make the sprite move right. Pressing ''L'' will run a different bit of code,
    which will make the sprite move left.


    Programmers call an input action, such as a key press, an event. Other events
    might be something being clicked with a mouse, or the program starting.


    At this point, it may be worth revisiting what an algorithm is – we are starting
    to move on from our original definition of it being the ''steps to solve a problem''
    (see Book 1 pages 8-9) and more towards it being the ''set of rules'' to describe
    how a game or program works.


    ![](img/67c80c813fc5d30d52471ee1f484e615_11_3.png)


    ### EXTRA HELP


    To carry out these exercises, children will need to use the ''Point in direction''
    code block, which gives directions in degrees. To keep things simple, we are only
    going to work with the angles 0, 90, 180, 270 and 360 degrees. The ''Point in
    direction'' block also offers a pull-down menu that gives reminders, such as ''90°
    (right)''. Scratch uses -90° to point left – again, there is a reminder that this
    means left in the pull-down menu.


    ### TAKING IT FURTHER


    If children want to go further, ask them to write lots of short, simple programs
    (answers are on page 62):


    1.  Make a simple program that moves the sprite up, down, left and right when
    the **cursor keys** are pressed instead of ''U'', ''D'', ''L'', ''R''.

    2.  Make a program that moves the sprite a big distance when ''B'' is pressed
    and a small one when ''S'' is pressed.

    3.  Make a program that moves the sprite diagonally when the **space bar** is
    pressed.


    ## PAGES 26–27


    ### Sketching with inputs


    ![](img/67c80c813fc5d30d52471ee1f484e615_12_0.png)


    ### OBJECTIVES


    Children will create their own drawing game using Scratch. This exercise offers
    plenty of opportunities to practise using inputs and a lot of scope to take ideas
    further. Once children have got a basic version of their drawing program working,
    you could talk to them about how computers use numbers to represent colours.


    ### TAKING IT FURTHER


    Children can try adding these extra features to their game:


    1.  Add a **''When key pressed''** block from the **Events** group and a **''Clear''**
    block from the **Pen** group, so the artist can clear the screen with a key press.

    2.  Add another set of blocks so the artist can lift the pen up when **''U''**
    is pressed.

    3.  Add another set of blocks so the artist can start drawing again when **''P''**
    is pressed.

    4.  Add more blocks (using the **Events** and **Motion** groups) so the artist
    can draw diagonally.

    5.  Experiment with setting the pen colour (using the **Pen** group) and use your
    findings to make a table. Write the colour names in one column and the value to
    set pen colour to in the next column.


    Check the answers on page 62.


    ## PAGES 28–29


    ### Debugging


    ![](img/67c80c813fc5d30d52471ee1f484e615_12_1.png)


    ### OBJECTIVES


    Children will learn the meaning of ''debugging'' and practise fixing some simple
    mistakes in Logo and Scratch codes. Debugging is an essential skill to develop.
    However, prevention is better than cure, so these pages also offer guidelines
    about planning and testing short programs.


    > **EXTRA HELP**


    When teaching children how to debug, it is very useful to model and demonstrate
    the process. For example, make a simple program that moves a sprite in Scratch.
    Change a small part of it so that it doesn''t work or the sprite moves in the
    wrong direction. Ask children if they can work out what is wrong. If you are working
    with a group, ask successful debuggers to explain how they fixed the code, so
    they can model this approach for everyone else.


    ### COMMON CONFUSIONS


    A common confusion at this level of coding is which way is left and which is right
    when moving around an upside-down sprite. To help, make a simple sprite or triangle
    out of a small piece of paper (see page 8 of this book).


    > **TIP**


    Sometimes it may be easier for children to start again rather than debug code
    that they cannot fix. Get them to plan or explain carefully what they want their
    code to do, and to rebuild and test it gradually. Make sure they plan realistically.
    Start with simple games or programs, then build up.


    ## Drawing Scratch graphics


    As children become more proficient coders, they will enjoy creating their own
    graphics to use in their programs. This will encourage them to be more inventive
    and to unleash their imaginations. Here is a guide to creating graphics in Scratch.


    ### KEY TECHNIQUES TO LEARN


    Although we can draw images on computers in a similar way to drawing on paper,
    there are some important differences. Learning about these differences will help
    you create better images to use in your programs. You can practise the techniques
    on this page by using the sprite editor in Scratch. You could also use a program
    such as Microsoft Paint if you are using a Windows PC, or a more complex package
    such as Adobe Photoshop. Any images you create can be saved and used in your code.


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_0.png)


    ### UNDO


    When we make a mistake drawing with a pencil, we can use a rubber to erase what
    went wrong. Although there is a rubber in most painting programs, it is usually
    much better to click the ''Undo'' button straight away (or ''Edit'' then ''Undo'')
    after making a mistake. ''Undo'' will take away the last thing you did.


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_1.png)


    ### ZOOM IN AND ZOOM OUT


    It can be hard to draw things accurately with a mouse. It is much easier if you
    zoom in to make everything look larger when you are trying to make things line
    up or get something in the right place. When you have finished working on something,
    zoom out again to get a view of the overall image.


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_2.png)


    ### MOVE THINGS AROUND


    On a piece of paper, if we draw something in the wrong place we have to rub it
    out and draw it again. On a computer, we can move it to the correct place. If
    you have just drawn a shape, there may be handles to move or resize it. If not,
    use the **Select** tool to draw round part of your picture and drag it to where
    you need it.


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_3.png)


    **Or use the Select tool.**


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_4.png)


    ### BUILD IMAGES WITH SHAPES


    Although you can draw anything with a brush, it is often easier to build up a
    digital picture from a series of shapes. Lines will be straighter and curves will
    be smoother. Try working with the **Ellipse** tool for drawing details such as
    wheels, eyes, heads, bodies, flowers and rockets! Why not experiment with the
    **Rectangle** tool for drawing cars, buildings, walls, roads, teeth, robots and
    trees.


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_5.png)


    **Use the Line, Ellipse and Rectangle tools.**


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_6.png)


    ### CUT UP SHAPES


    If you can''t find or draw the shape you need, break up another one. For example,
    draw an oval with the **Ellipse** tool, then use the **Select** tool to choose
    the top part of it. Drag it off the screen and you''re left with a smile!


    ![](img/67c80c813fc5d30d52471ee1f484e615_13_7.png)


    **Use the Select tool.**'
