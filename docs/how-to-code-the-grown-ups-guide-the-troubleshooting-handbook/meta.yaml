    speed(0)\n\nfor p in range(0,30):\n    x=randint(-300,300)\n    y=randint(-300,300)\n\
    \    pu()\n    goto(x,y)\n    pd()\n\n    for r in range(0,6):\n        right(60)\n\
    \n        for s in range(0,4):\n            forward(50)\n            right(90)\n\
    ```\n\nImport turtle library and random library.\n\nMake turtle move quickly.\n\
    \nRepeat outer loop 30 times.\nCreate a random value for x between -300 and 300.\n\
    Create a random value for y between -300 and 300.\nPen up (don't draw).\nMove\
    \ the turtle to (x,y).\nPen down (start drawing).\n\nRepeat loop 6 times.\nTurn\
    \ right 60 degrees.\n\nNow draw each square:\nRepeat inner loop 4 times.\nMove\
    \ forward 50 pixels.\nTurn right 90 degrees.\n\n3. Save and run your code to test\
    \ it. It should look rather like this:\n\n# Challenge!\n\nTry adding an extra\
    \ variable to use as the size of the pattern. Set it to a random value. Use it\
    \ instead of moving forward 50 in the inner loop.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_34_0.png)"
  - "[PAGE 35]\n\n# Random Python quiz\n\nThis project combines many of the key concepts\
    \ covered so far: inputs, variables and random numbers. We will also be using\
    \ different types of variables. We will create a quiz asking 10 random times tables\
    \ questions, and also counting the total answered correctly.\n\n# ASKING A RANDOM\
    \ QUESTION\n\nBefore making a quiz with 10 questions, we will try making a quiz\
    \ with 1 question.\n\n+   1. First we need to create two random numbers for our\
    \ question – let's call them **a** and **b**.\n2. Next we need to ask the player\
    \ what **a** times **b** is.\n3. Finally we need to check if the player is correct\
    \ or not, then tell them.\n\n# 1\n\nStart IDLE, the Python editor, and open a\
    \ new file.\n\n# 2\n\nType in the following commands:\n\nImport random library.\n\
    \n```\nfrom random import *\n```\n\nCreate a variable called **a** with a random\
    \ value between 1 and 12. Create a variable called **b** with a random value between\
    \ 1 and 12.\n\n```\na=randint(1,12)\nb=randint(1,12)\n```\n\n```\nprint(\"What\
    \ is\",a,\"times\",b)\n```\n\nAsk the question, for example: ‘What is 5 times\
    \ 4?’\n\n```\nanswer=input(\"?\")\n```\n\nWait for the player to answer and store\
    \ it in a variable called **answer**.\n\n```\nanswer=int(answer)\n```\n\nThe answer\
    \ will be a ‘string’. We will convert it to an integer so we can compare it to\
    \ **a times b**.\n\n```\nif answer==a*b:\n    print(\"correct\")\nelse:\n    print(\"\
    wrong\")\n```\n\nCheck to see if the answer is equal to **a times b**. If equal,\
    \ display **correct**. Else display **wrong**.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_35_0.png)\n\
    \nIDLE will keep adding tabs after you type **if**. You need to delete one of\
    \ these before typing **else**."
  - "[PAGE 36]\n\n# STRINGS AND INTEGERS\n\nWe use variables to store information.\
    \ Some information, such as the score in a game, will be a number. If it is a\
    \ whole number, we call that an integer. Other information, such as your name,\
    \ will be made up of letters. Information that is made up of letters is called\
    \ a string. A variable created by an input statement will be a string, even if\
    \ it has numbers in it. Python treats strings and integers in different ways.\
    \ It thinks 20 is not the same as \"20\". If we need to compare the value of a\
    \ string to an integer, first we need to convert the string into an integer. To\
    \ make that conversion, we used **answer=int(answer)** in our quiz.\n\n# ADDING\
    \ MORE QUESTIONS AND A SCORE\n\nTo make our quiz ask 10 questions, we need to\
    \ create an outer loop than fits around the main part of our code. We also need\
    \ to add a score variable that will be set to zero at the start, and will go up\
    \ if a player answers a question correctly. Finally, we need to show the score\
    \ at the end of the game.\n\n+   1. Start a new file, or edit your current file.\n\
    2. Type in the following code:\n\n```\nfrom random import *\n\ns = 0\nfor q in\
    \ range(1,11):\n    a = randint(1,12)\n    b = randint(1,12)\n    print(\"Question\"\
    , q, \"What is\", a, \"times\", b)\n    answer = input(\"?\")\n    answer = int(answer)\n\
    \    if answer == a * b:\n        print(\"correct\")\n        s = s + 1\n    else:\n\
    \        print(\"wrong\")\nprint(\"You scored\", s, \"out of 10\")\n```\n\nSet\
    \ score variable (s) to zero.\n\nStart a loop that runs from 1 to 10.\n\nAsk the\
    \ question – for example: 'Question 3 What is 3 times 8?'\n\nIf the answer is\
    \ correct, add 1 to the score (s).\n\nDisplay the number of correct answers (s).\n\
    \nMake sure that your code is indented like above. Use the 'Tab' or 'Delete' keys\
    \ to make it match if you need to. Without the correct indents, your code won't\
    \ work!\n\n![](img/67c80c813fc5d30d52471ee1f484e615_36_0.png)\n\n```\n>>>\nQuestion\
    \ 1 What is 4 times 7\n?28\ncorrect\n```\n\n35"
- md: " # BOOK 4 PAGE-BY-PAGE GUIDE\n\n## PAGES 6-7\nCreating web pages\n\n## PAGES\
    \ 8-9\nUsing HTML\n\n![](img/67c80c813fc5d30d52471ee1f484e615_37_0.png)\n\n![](img/67c80c813fc5d30d52471ee1f484e615_37_1.png)\n\
    \n## OBJECTIVES\n\nThese pages will get young coders started with producing their\
    \ own web pages. Children will learn how web pages use special <tags> to mark\
    \ different parts of the page. Like most professional programmers, we will start\
    \ by creating pages on our computer and testing them 'locally', rather than working\
    \ online with 'live' web pages. Children will learn how to create a page in a\
    \ text editor, save it as .html and open it in a web browser – a process that\
    \ needs mastering before we move forward.\n\n## OBJECTIVES\n\nOnce children have\
    \ become familiar with creating a simple 3-line web page, saving it and opening\
    \ it in a browser, they will be ready to look at using different tags. The first\
    \ tags they will have encountered are <html> and </html> at the start and end\
    \ of a document. Now we introduce paragraph and heading tags. Children will also\
    \ learn how to emphasize parts of their text with tags such as <em>.\n\n## TAKING\
    \ IT FURTHER\n\nFor extra tag practice, start a new HTML document in your text\
    \ editor. Add <html> and </html> tags to the page. Write a list of animals between\
    \ them. Save and test the page. Now edit the page, using heading tags to make\
    \ different animals larger and smaller. For example:\n\n## EXTRA HELP\n\nChildren\
    \ will benefit from getting the hang of file saving and handling before moving\
    \ on to more complex HTML and JavaScript coding. Here are some practice tips:\n\
    \n1. Practise using the text editor. Make sure children can find the text editor\
    \ themselves. If children are using a Mac, first they need to click the 'TextEdit'\
    \ menu then 'Preferences'. Choose 'Plain text' and uncheck 'Smart quotes'.\n2.\
    \ Children need to work on their file handling. Make sure they know how to save\
    \ files, and how to find them once they have been saved. It is worth creating\
    \ a folder on the desktop (or documents area) that they can access easily and\
    \ keep all their work in.\n3. Make sure children understand that web pages must\
    \ be saved as .html files or they won't work properly.\n\n```\nText editor – animals.html\n\
    <html>\n  <h1>Elephant</h1>\n  <h5>Mouse</h5>\n  <h2>Tiger</h2>\n  <h6>Fly</h6>\n\
    </html>\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_37_2.png)\n\n36\n\n##\
    \ PAGES 10–11\n\n## Addresses and links\n\n![](img/67c80c813fc5d30d52471ee1f484e615_38_0.png)\n\
    \n## PAGES 12–13\n\n## Lots of links\n\n![](img/67c80c813fc5d30d52471ee1f484e615_38_1.png)\n\
    \n## OBJECTIVES\n\nThese pages start by teaching children more about URLs (web\
    \ addresses). We then move on to the key skill of creating hyperlinks to other\
    \ web pages. Children will become familiar with the anchor tag: <a>.\n\n## OBJECTIVES\n\
    \nNow children are familiar with how to create links, they will create a page\
    \ of their favourite links. They will use their own anchor tags (<a> and </a>),\
    \ combining them with some of the heading and paragraph tags already learnt.\n\
    \n> ### EXTRA HELP\n> Some text editors will use 'smart quotes' and change vertical\
    \ quotes (') for angled ones (''). If this happens, refer to 'Extra help' on the\
    \ opposite page to switch off this feature, or consider using a dedicated text\
    \ editor – see 'Tip' on the right.\n\n## COMMON CONFUSIONS\n\nSome children may\
    \ get mixed up about what goes inside the different parts of the anchor tags on\
    \ a web page – <a> and </a>. Make sure they understand that the <a href = > part\
    \ needs to contain the URL, while the part between the anchor tags will be shown\
    \ on the web page as the text to click to link to the URL. Children also need\
    \ to remember to put quotes around the URL.\n\n## TAKING IT FURTHER\n\nAsk children\
    \ to make a list of international country codes used in URLs, starting with co.uk.\
    \ This part of the domain is called the 'suffix'. Can children discover any suffixes\
    \ that reveal that a website is run by a charity, government or educational organization?\n\
    \n> ### TIP\n> A basic text editor, such as Notepad or TextEdit, will allow children\
    \ to start creating web pages. It will also encourage them to look in detail at\
    \ how a page is built. Once they get beyond simple experimenting, it is worth\
    \ downloading a dedicated, more advanced HTML editor. There are many available\
    \ for free: see page 56 for more information on downloading one.\n\nA good HTML\
    \ editor will require children to learn how to code and not do it all for them,\
    \ but will provide features to support them, such as:\n\n- Auto-colouring text\
    \ to emphasize tags, keywords, strings and numbers.\n- Auto-completing code to\
    \ save time.\n- Indicating that tags, brackets and quotes have been closed and\
    \ have matching pairs.\n- Allowing children to have multiple files open at the\
    \ same time to work on.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_38_2.png)\n\
    \n# BOOK 4 PAGE-BY-PAGE GUIDE\n\n## PAGES 14-15\nColour it!\n\n## PAGES 16-17\n\
    Adding JavaScript\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_0.png)\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_1.png)\n\
    \n## OBJECTIVES\n\n'Colour it!' will teach children how to change the colour and\
    \ style of objects on a web page. Large websites do this with additional files\
    \ containing CSS (Cascading Style Sheets; see page 58). Here we use a simpler\
    \ approach to explore the concept, by putting style attributes inside tags.\n\n\
    ## OBJECTIVES\n\nSo far children have been coding their web pages only with HTML.\
    \ To make their web pages more interactive, now they will learn how to combine\
    \ their HTML coding with another language, JavaScript. They will learn how to\
    \ add a 'listener' to make some JavaScript run when a button is clicked.\n\n##\
    \ TAKING IT FURTHER\n\nChildren could also learn how to change the font their\
    \ text is printed in:\n\n1. Start a new HTML file in your text editor.\n2. Type\
    \ in this code:\n3. Save and test your page.\n4. Edit the second line to add a\
    \ style attribute\n5. Experiment with other fonts. Try using Impact and Tahoma\
    \ first.\n\n```\n<html>\n  <h1>Fruit</h1>\n  <p>Apples</p>\n</html>\n```\n\nIf\
    \ you set a font family that has more than one word in its name, you need to put\
    \ quotes round it. These need to be different quotes from the ones you used to\
    \ set the style attribute! For example, here single quotes are used around the\
    \ font name, double quotes around the style attribute:\n\n```\n<h1 style=\"font-family:'Comic\
    \ Sans MS'\">\n```\n\n## TAKING IT FURTHER\n\nOnce children have mastered the\
    \ exercises in Book 4 pages 16-17, they could create a new web page with three\
    \ buttons. Each button needs to have a riddle written on it. Add onclick listeners\
    \ to each button so that when the button is clicked, the answer is shown as a\
    \ message. For example, try using this code (type it all on one line):\n\n```\n\
    <button onclick='alert(\"A bee flying backwards\")'>What goes zzub zzub?</button>\n\
    ```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_2.png)\n\n## PAGES 18–19\n\
    JavaScript loops\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_0.png)\n\n## PAGES\
    \ 20–21\nJavaScript functions\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_1.png)\n\
    \n## OBJECTIVES\n\nNow we will do some sums and counting, using JavaScript loops\
    \ and variables. Children will probably have used loops and variables before –\
    \ whether making patterns or keeping scores in Logo or Scratch (see Book 2), or\
    \ counting in Python (see Book 3). In this book, turn to page 16 for a refresher\
    \ on loops, and page 20 for a reminder on variables.\n\n## OBJECTIVES\n\nThese\
    \ pages introduce the idea of functions. Functions are a sequence of commands\
    \ that perform a specific task every time that function is 'called' (run). The\
    \ idea is explained through the analogy of writing an instruction that tells a\
    \ robot to make a sandwich. The instructions work whatever sandwich fillings the\
    \ robot is using. The idea is then put into practice by creating a function that\
    \ will ask a question and check the answer is correct. Children will use this\
    \ function to code a quiz.\n\n## TAKING IT FURTHER\n\nIn the counting exercises\
    \ in Book 4 page 19, the numbers displayed by a loop are shown next to each other.\
    \ We can force the web browser to show each on a separate line by telling it to\
    \ show pre-formatted text, using a `<pre>` tag:\n\n## KEY CONCEPT: FUNCTIONS\n\
    \nFunctions are an important concept in coding. Here are some reasons to create\
    \ and use your own functions:\n\n1. Using a function means that you don't have\
    \ to repeat lines of code – we just 'call' the function whenever it is needed\
    \ rather than repeating the same commands over and over.\n2. Functions make long\
    \ programs easier to read.\n3. Functions make programs more flexible – a function\
    \ can be used in more than one situation.\n4. It is much easier to add a 'call'\
    \ to a JavaScript function into an HTML listener than write multiple lines of\
    \ code.\n\n```\n<pre>\n<script>\nfor(var n=1; n<10; n++)\n  document.writeln(n);\n\
    </script>\n</pre>\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_2.png)\n\
    \nTo make a JavaScript loop count up in 5s, change the right-hand side of the\
    \ loop from `n++` to `n+=5`. For example, to write the numbers 0, 5, 10, 15, 20,\
    \ use: `for(var n=0; n<21; n+=5)`. Now try these exercises (answers are on page\
    \ 62):\n\n1. Make a loop that shows 0, 10, 20, 30, 40.\n2. Make a loop that shows\
    \ 2, 4, 6, 8, 10.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_3.png)"
  mdcn: "\n# 第4册 逐页指南\n\n## 第6-7页\n创建网页\n\n## 第8-9页\n使用 HTML\n\n![](img/67c80c813fc5d30d52471ee1f484e615_37_0.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_37_1.png)\n\n## 学习目标\n\n这些页面将帮助年轻程序员开始制作自己的网页。孩子们将学习网页如何使用特殊的\
    \ <标签> 来标记页面的不同部分。与大多数专业程序员一样，我们将从在电脑上创建页面并\"本地\"测试开始，而不是在线处理\"实时\"网页。孩子们将学习如何在文本编辑器中创建页面，将其保存为\
    \ .html 文件，并在网页浏览器中打开——在我们继续学习之前，需要掌握这一流程。\n\n## 学习目标\n\n一旦孩子们熟悉了创建简单的三行网页、保存并在浏览器中打开，他们就可以开始学习使用不同的标签了。他们首先会遇到的标签是文档开头和结尾的\
    \ <html> 和 </html>。现在我们将介绍段落标签和标题标签。孩子们还将学习如何使用 <em> 等标签来强调文本的某些部分。\n\n## 深入拓展\n\
    \n为了 extra 标签练习，在文本编辑器中新建一个 HTML 文档。在页面中添加 <html> 和 </html> 标签。在它们之间写下一列动物。保存并测试页面。现在编辑页面，使用标题标签让不同的动物显示得更大或更小。例如：\n\
    \n## 额外帮助\n\n在接触更复杂的 HTML 和 JavaScript 编码之前，孩子们最好先掌握文件保存和操作。以下是一些练习建议：\n\n1. 练习使用文本编辑器。确保孩子们能够自己找到文本编辑器。如果\
    \ hypo 孩子们使用的是 Mac，首先需要点击\"TextEdit\"菜单，然后选择\"偏好设置\"。选择\"纯文本\"并取消勾选\"智能引号\"。\n\
    2. 孩子们需要练习文件操作。确保他们知道如何保存文件，以及保存后如何找到文件。值得在桌面（或文档区域）创建一个文件夹，方便他们访问并存放所有作品。\n3.\
    \ 确保孩子们理解网页必须保存为 .html 文件，否则无法正常工作。\n\n```\nText editor – animals.html\n<html>\n\
    \  <h1>Elephant</h1>\n  <h5>Mouse</h5>\n  <h2>Tiger</h2>\n  <h6>Fly</h6>\n</html>\n\
    ```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_37_2.png)\n\n36\n\n## 第10–11页\n\
    \n## 地址与链接\n\n![](img/67c80c813fc5d30d52471ee1f484e615_38_0.png)\n\n## 第12–13页\n\
    \n## 大量链接\n\n![](img/67c80c813fc5d30d52471ee1f484e615_38_1.png)\n\n## 学习目标\n\n\
    这些页面首先教孩子们更多关于 URL（网页地址）的知识。然后我们转到关键技能——创建指向其他网页的超链接。孩子们将熟悉锚点标签：<a>。\n\n## 学习目标\n\
    \n现在孩子们已经熟悉了如何创建链接，他们将创建一页自己最喜欢的链接。他们将使用自己的锚点标签（<a> 和 </a>），并结合一些已经学过的标题和段落标签。\n\
    \n> ### 额外帮助\n> 某些文本编辑器会使用\"智能引号\"，将直引号（'）替换为弯引号（''）。如果发生这种情况，请参考对页的\"额外帮助\"来关闭此功能，或考虑使用专用文本编辑器——参见右侧的\"\
    提示\"。\n\n## 常见困惑\n\n一些孩子可能会混淆锚点标签中不同部分的用途——<a> 和 </a>。确保他们理解 <a href = > 部分需要包含\
    \ URL，而锚点标签之间的部分将显示为网页上可点击的文本以链接到该 URL。孩子们还需要记住在 URL 两侧加上引号。\n\n## 深入拓展\n\n让孩子们列出\
    \ URL 中使用的国际国家代码，从 co.uk 开始。域名的这部分称为\"后缀\"。孩子们能发现哪些后缀可以表明一个网站是由慈善机构、政府还是教育机构运营的吗？\n\
    \n> ### 提示\n> 基础文本编辑器，如记事本或 TextEdit，可以让孩子们开始创建网页。这也会鼓励他们仔细观察页面的构建方式。一旦他们超越了简单的尝试，值得下载一个更专业的、更高级的\
    \ HTML 编辑器。有许多免费的选择：第56页有更多关于下载的信息。\n\n一个好的 HTML 编辑器会要求孩子们学习如何编码，而不是替他们完成所有工作，但会提供一些功能来支持他们，例如：\n\
    \n- 自动为文本着色，以强调标签、关键字、字符串和数字。\n- 自动补全代码以节省时间。\n- 指示标签、括号和引号已关闭并匹配。\n- 允许孩子们同时打开多个文件进行工作。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_38_2.png)\n\n# 第4册 逐页指南\n\n## 第14-15页\n\
    给它上色！\n\n## 第16-17页\n添加 JavaScript\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_0.png)\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_39_1.png)\n\n## 学习目标\n\n\"给它上色！\"将教孩子们如何更改网页上对象的颜色和样式。大型网站使用包含\
    \ CSS（层叠样式表；参见第58页）的附加文件来实现这一点。这里我们采用更简的方法来探索这个概念，即在标签内部放置 style 属性。\n\n## 学习目标\n\
    \n到目前为止，孩子们只使用 HTML 来编码他们的网页。为了让网页更具交互性，现在他们将学习如何将 HTML 编码与另一种语言 JavaScript 结合起来。他们将学习如何添加一个\"\
    监听器\"，以便在点击按钮时运行一些 JavaScript 代码。\n\n## 深入拓展\n\n孩子们还可以学习如何更改文本显示的字体：\n\n1. 在文本编辑器中新建一个\
    \ HTML 文件。\n2. 输入以下代码：\n3. 保存并测试你的页面。\n4. 编辑第二行，添加 style 属性\n5. 尝试其他字体。先试试 Impact\
    \ 和 Tahoma。\n\n```\n<html>\n  <h1>Fruit</h1>\n  <p>Apples</p>\n</html>\n```\n\n\
    如果你设置的字体名称包含多个单词，需要在其周围加上引号。这些引号需要与用于设置 style 属性的引号不同！例如，这里字体名称使用单引号，style 属性使用双引号：\n\
    \n```\n<h1 style=\"font-family:'Comic Sans MS'\">\n```\n\n## 深入拓展\n\n一旦孩子们掌握了第4册第16-17页的练习，他们可以创建一个新网页，包含三个按钮。每个按钮上需要写一个谜语。为每个按钮添加\
    \ onclick 监听器，以便点击按钮时，答案会作为消息显示出来。例如，尝试使用以下代码（全部输入在一行中）：\n\n```\n<button onclick='alert(\"\
    A bee flying backwards\")'>What goes zzub zzub?</button>\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_39_2.png)\n\
    \n## 第18–19页\nJavaScript 循环\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_0.png)\n\
    \n## 第20–21页\nJavaScript 函数\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_1.png)\n\
    \n## 学习目标\n\n现在我们将使用 JavaScript 循环和变量来进行一些求和与计数。孩子们可能之前已经使用过循环和变量——无论是在 Logo 或\
    \ Scratch 中创建图案或记录分数（参见第2册），还是在 Python 中计数（参见第3册）。在本册书中，翻到第16页复习循环，第20页复习变量。\n\
    \n## 学习目标\n\n这些页面介绍了函数的概念。函数是一系列命令，每次\"调用\"（运行）该函数时执行特定任务。这个概念通过编写指令告诉机器人制作三明治的类比来解释。无论机器人使用什么三明治馅料，这些指令都有效。然后通过创建一个会提问并检查答案是否正确的函数来实践这一概念。孩子们将使用这个函数来编写一个测验。\n\
    \n## 深入拓展\n\n在第4册第19页的计数练习中，循环显示的数字是并列显示的。我们可以通过告诉浏览器显示预格式化文本，使用 `<pre>` 标签来强制浏览器将每个数字显示在单独的行上：\n\
    \n## 关键概念：函数\n\n函数是编程中的一个重要概念。以下是创建和使用自己函数的一些原因：\n\n1. 使用函数意味着你不必重复代码行——只需在需要时\"\
    调用\"函数，而不必一遍又一遍地重复相同的命令。\n2. 函数使长程序更易于阅读。\n3. 函数使程序更灵活——一个函数可以在多种情况下使用。\n4. 在\
    \ HTML 监听器中添加对 JavaScript 函数的\"调用\"要比编写多行代码容易得多。\n\n```\n<pre>\n<script>\nfor(var\
    \ n=1; n<10; n++)\n  document.writeln(n);\n</script>\n</pre>\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_2.png)\n\
    \n要让 JavaScript 循环以5为步长计数，将循环右侧的 `n++` 改为 `n+=5`。例如，要写出数字 0, 5, 10, 15, 20，使用：`for(var\
    \ n=0; n<21; n+=5)`。现在尝试这些练习（答案在第62页）：\n\n1. 制作一个显示 0, 10, 20, 30, 40 的循环。\n2.\
    \ 制作一个显示 2, 4, 6, 8, 10 的循环。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_40_3.png)\n"
