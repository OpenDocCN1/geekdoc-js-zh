  md: '# JAVASCRIPT TECHNICAL GUIDE


    After children have learnt to use HTML to create simple web pages, it is worth
    learning some JavaScript. JavaScript will allow children to control what happens
    when users click buttons or load a page, and make their pages much more interactive.


    # ADDING JAVASCRIPT


    There are a number of different ways of adding JavaScript to a web page. In larger
    websites, JavaScript will be loaded from separate files. To give children a taste
    of the language, in this series we keep the JavaScript in the page, and use simple
    HTML event attributes to run code.


    In the examples in Book 4, JavaScript is added in 2 ways:


    +   1. Between `<script>` and `</script>` tags in an HTML page, which means it
    will run the script when the page loads.

    2. Within an onclick HTML event attribute. For example: `<button onclick=''alert("Hi")''>Press<button>`


    ![](img/67c80c813fc5d30d52471ee1f484e615_60_0.png)


    > Remember:

    HTML = what is on the page.

    JavaScript = what the page does.

    CSS = what the page looks like.


    # USEFUL JAVASCRIPT COMMANDS


    | COMMAND | WHAT IT DOES | EXAMPLE |

    |---|---|---|

    | alert() | Displays a message to the user. | alert(''Hello world'') |

    | var | Defines a variable to be used. | var score=0 |

    | for | Makes a loop that repeats a number of times. | for(var n=0; n<10; n++)
    |

    | document.write() | Adds something to the web page. | document.write(1) |

    | document.writeln() | Adds something to the web page and starts a new line. (A
    <pre> tag also needs to be added to the web page.) | document.writeln(1) |

    | if | Tests to see if a condition is true and runs code if it is. | if(age==10)alert(''Ten'')
    |

    | else | If the condition is false, then runs some code. | else alert(''You are
    not ten.'') |

    | function | Starts defining a function. | function sayHello() { alert(''Hello!'')
    } |'
