    \ 屏幕顶部附近的绿色旗帜图标来测试你的代码。\n\n如果你点击旗帜时汽车没有移动到赛道上，调整“**Set x to**”和“**Set y to**”的数值。“**Point\
    \ in direction**”代码块会让它向右行驶。\n\n6. 从**Events**组添加两个“**When key pressed**”代码块来控制汽车方向。测试你的代码并尝试按下方向键。\n\
    \n```\nwhen ← key pressed\nturn ↺ 15 degrees\n\nwhen → key pressed\nturn ↻ 15\
    \ degrees\n```\n\n7. 现在创建一个变量来记录分数。\n\n选择**Data**组。\n\n```\nPen | Operators\n\
