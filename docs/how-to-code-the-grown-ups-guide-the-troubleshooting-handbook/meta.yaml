    \n+   2. Your favourite sports and sports stars.\n\n+   3. Reviews of your favourite\
    \ books or films.\n\n+   4. Science topics, such as materials and their uses."
  - '[PAGE 42]


    # PAGES 26-27

    Sharing your website


    ![](img/67c80c813fc5d30d52471ee1f484e615_42_0.png)


    # OBJECTIVES


    These pages explain how children can upload websites they have created. Children
    can develop their coding and HTML skills while staying offline (without uploading),
    but sometimes they may enjoy getting an audience for their work. Make sure children
    are closely supervised if they are putting any information online. Please follow
    the e-safety guidelines below, together with any other rules you have at home
    or school about internet use.


    # E-SAFETY GUIDELINES


    If you are working with a group of children, it is worth displaying these guidelines
    where everyone can read them and keep them in mind:


    +   1. Don''t share personal information online — such as your full name, address
    or email address.

    2. Don''t include photos of you or your family.

    3. Don''t write anything unkind about other people on your site.


    ![](img/67c80c813fc5d30d52471ee1f484e615_42_1.png)


    # PAGES 28-29

    Debugging


    ![](img/67c80c813fc5d30d52471ee1f484e615_42_2.png)


    # OBJECTIVES


    In these exercises, children will need to fix some example pieces of HTML and
    JavaScript code with bugs in. The pieces of code feature all the key concepts
    we have learnt in Book 4: links, styling, loops and functions.


    # TIP


    Children could try using the console, a debugging tool built into most web browsers.
    It will help them to see that there are errors and where they are, although the
    messages may appear quite technical at first.


    # Showing the console:


    On a Mac,

    using Chrome:

    [alt] + [cmd] + [i]


    On a PC, using Internet

    Explorer or Chrome:

    [F12]


    ![](img/67c80c813fc5d30d52471ee1f484e615_42_3.png)


    The console will appear here or at the bottom of your browser.


    # Typical messages in the console:


    ''scor'' is not defined - mypage.html:3

    Means the browser doesn''t know the variable or function called **scor**. This
    message may show up when a variable or function is spelt incorrectly. The error
    is probably in line 3.


    **Unexpected token ILLEGAL** - mypage.html:7

    or

    **Unterminated string constant** - mypage.html:7

    Means there is a quote or double quote missing somewhere in line 7 — for example,
    `alert(''hello)`.'
