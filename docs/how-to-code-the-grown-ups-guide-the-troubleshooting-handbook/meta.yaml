  md: "# PAGE-BY-PAGE GUIDE\n\n# BOOK 4\n\n# PAGES 22–23\n\n# JS Functions with HTML\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_41_0.png)\n\n# OBJECTIVES\n\nThese\
    \ pages continue our work on JavaScript functions. This time we will be combining\
    \ JavaScript and HTML coding. The activities here show children how to create\
    \ a function that changes the background colour of a web page.\n\n# TAKING IT\
    \ FURTHER\n\nTo try something extra, we can create a similar function to change\
    \ the colour of text on a web page.\n\n+   1. Start a new web page in your text\
    \ editor. Type in the following:\n\n```\nText editor – creepyhouse.html\n\n<html>\n\
    <h1>The Creepy House</h1>\n<p>Once upon a time</p>\n<button onclick=\"setcol('red')\"\
    >Red</button>\n<button onclick=\"setcol('blue')\">Blue</button>\n<script>\nfunction\
    \ setcol(col){\n  document.body.style.color=col;\n}\n</script>\n</html>\n```\n\
    \nThis program is very similar to the one in Book 4 page 23, but it changes the\
