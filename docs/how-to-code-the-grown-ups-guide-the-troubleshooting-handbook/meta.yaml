    \ **a times b**. If equal, display **correct**. Else display **wrong**.\n\nIDLE\
    \ will keep adding tabs after you type **if**. You need to delete one of these\
    \ before typing **else**.\n\n# STRINGS AND INTEGERS\n\nWe use variables to store\
