  md: '# Book 1


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_0.png)


    Book 1 introduces children to the idea that computers need to be given instructions
    to tell them what to do. Children learn that **commands** need to be clear and
    precise, and given in the correct sequence, if the computer is going to do what
    they want. A number of activities are offered that will help teach these ideas,
    initially without using a computer.


    Two computer languages are then introduced. The first, **Logo**, is used to introduce
    children to typing simple instructions that get an instant result. As they type
    commands, the onscreen turtle moves and draws, encouraging them to experiment.
    The second language, **Scratch**, takes these ideas further and introduces children
    to **inputs**. Children learn to program a simple game that uses inputs: pressing
    keys will move the Scratch sprite around the screen.


    ISBN 978 1 78493 236 7


    # Book 2


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_1.png)


    The second book in the series starts off by explaining one of the key concepts
    in coding – the use of **loops** and repetition. Using **Logo** and then **Scratch**,
    children are shown how they can use loops to draw simple shapes, and then build
    them into interesting patterns. They find out how loops can have conditions attached
    to them, so they will loop until a particular event occurs – such as one sprite
    catching another in a game.


    The use of outputs other than the screen is explored via the use of **sound**.
    Children learn how to create a basic piano or synthesizer program. Next, **variables**
    are used to show children how programs store and change data, such as the score
    in a game. Children will build their own games and activities to practise these
    skills in Scratch.


    ISBN 978 1 78493 237 4


    # Book 3


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_2.png)


    The concept of **selection** is explored in Book 3, using **Scratch** to build
    a quiz. Children develop this idea further by combining selection with variables
    to add point scoring to their quiz. They also create a game in which points are
    scored for each apple their sprite ''eats''.


    Book 3 then takes these concepts into a professional coding environment, using
    the **Python** language. Children learn how to enter commands using a special
    text editor and create their own programs in Python. They find out how to use
    programming **libraries** to generate **random numbers** and produce **graphics**.


    ISBN 978 1 78493 238 1


    # Book 4


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_3.png)


    The final book in the series takes a look at the **World Wide Web** and how it
    works, including **URLs (Uniform Resource Locators)** and **hyperlinks**. Children
    learn to create web pages using **HTML (Hyper Text Mark-up Language)** and a text
    editor. They find out how to add different objects or elements to a page using
    **tags**, and how to link pages together.


    Book 4 then shows children how they can add **JavaScript** coding to a page. While
    HTML is the language used to code what is on a web page, JavaScript is used to
    code what a web page does. Children learn how JavaScript handles loops and how
    they can create their own **functions**. They explore how web pages can include
    images and buttons, and how code can be linked to them.


    ISBN 978 1 78493 239 8


    ![](img/67c80c813fc5d30d52471ee1f484e615_6_4.png)'
