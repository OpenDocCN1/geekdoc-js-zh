    \ **if** 后持续添加制表符。在输入 **else** 之前，你需要删除其中一个制表符。\n\n# 字符串和整数\n\n我们使用变量来存储信息。有些信息，比如游戏中的得分，是一个数字。如果是整数，我们称之为整数。其他信息，比如你的名字，将由字母组成。由字母组成的信息被称为字符串。由输入语句创建的变量将是一个字符串，即使它包含数字。Python\
    \ 对字符串和整数的处理方式不同。它认为 20 和 \"20\" 是不同的。如果我们需要将字符串的值与整数进行比较，首先我们需要将字符串转换为整数。为了进行这种转换，我们在测验中使用了\
    \ **answer=int(answer)**。\n\n# 添加更多问题和得分\n\n为了使我们的测验能够提问 10 个问题，我们需要创建一个外部循环来包围代码的主要部分。我们还需要添加一个得分变量，它将在开始时设为零，并在玩家正确回答问题时增加。最后，我们需要在游戏结束时显示得分。\n\
    \n- 1. 开始一个新文件，或者编辑你当前的文件。\n2. 输入以下代码：\n\n```\nfrom random import *\n\ns = 0\n\
