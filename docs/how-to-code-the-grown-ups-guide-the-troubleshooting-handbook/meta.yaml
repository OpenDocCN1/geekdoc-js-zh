    > # Internet safety


    Children should be supervised when using the internet, particularly when using
    an unfamiliar website for the first time.


    Children can learn HTML and JavaScript without sharing their work online. Before
    uploading anything to the web, please read the advice about e-safety on page 41.


    The publishers and author cannot be held responsible for the content of the websites
