    # JavaScript 技术指南


    在孩子们学会使用HTML创建简单的网页后，值得学习一些JavaScript。JavaScript能让孩子们控制当用户点击按钮或加载页面时发生的事情，使他们的网页更具交互性。


    ## 添加JavaScript


    有多种方式可以将JavaScript添加到网页中。在较大的网站中，JavaScript将从单独的文件加载。为了让孩子们体验这门语言，在本系列中，我们将JavaScript保留在页面中，并使用简单的HTML事件属性来运行代码。


    在第4册的示例中，JavaScript通过两种方式添加：


    1.  在HTML页面的 `<script>` 和 `</script>` 标签之间，这意味着脚本将在页面加载时运行。

    2.  在onclick HTML事件属性内。例如：`<button onclick=''alert("Hi")''>点击</button>`


    ![插图](img/67c80c813fc5d30d52471ee1f484e615_60_0.png)


    > 记住：

    HTML = 页面上的内容。

    JavaScript = 页面的行为。

    CSS = 页面的外观。


    ## 实用的JavaScript命令


    | 命令 | 功能 | 示例 |

    | :--- | :--- | :--- |

    | alert() | 向用户显示一条消息。 | alert(''Hello world'') |

    | var | 定义一个要使用的变量。 | var score=0 |

    | for | 创建一个重复多次的循环。 | for(var n=0; n<10; n++) |

    | document.write() | 向网页添加内容。 | document.write(1) |

    | document.writeln() | 向网页添加内容并开始新行。（还需要在网页中添加 `<pre>` 标签。） | document.writeln(1)
    |

    | if | 测试条件是否为真，如果为真则运行代码。 | if(age==10)alert(''Ten'') |

    | else | 如果条件为假，则运行某些代码。 | else alert(''You are not ten.'') |

    | function | 开始定义一个函数。 | function sayHello() { alert(''Hello!'') } |


    # 语言比较


    本系列涵盖的四种语言（或技术）—— Logo、Scratch、Python 和 HTML/JavaScript—— 在帮助孩子们学习一些关键的编程概念方面都发挥了作用。每种语言都有其优点和缺点，并非所有语言都涵盖每个概念。


    比较不同语言处理相似概念的方式会很有帮助。这种比较将在两个方面帮助孩子们。首先，它帮助孩子们更深入地思考编程概念。其次，它帮助他们从一种语言过渡到另一种语言，使他们的学习能够更进一步。


    ## 语言与概念


    | 概念 | LOGO | SCRATCH | PYTHON | HTML/JAVASCRIPT |

    | :--- | :--- | :--- | :--- | :--- |

    | 循环 | `repeat 10 [ ... ]` | ![Scratch积木](image) | `for n in range(10):` | `for(var
    n=0;n<10;n++)` |

    | 循环计数器 | `repeat 10 [print repcount]` | ![Scratch积木](image) | `for n in range(1,11):`<br>`print(n)`
    | `for(var n=1;n<=10;n++)`<br>`document.writeln(n);` |

    | 选择 | 本系列不使用Logo讲解此概念。 | ![Scratch积木](image) | `answer=input("name?")`<br>`if
    answer=="Ada":`<br>`  print("Hello!")` | `var answer=prompt("Name?")`<br>`if(answer=="Ada")`<br>`  alert("Hello!")`
    |

    | 结构* | 本系列不使用Logo讲解此概念。 | ![Scratch积木](image) | `if answer=="Ada":`<br>`  print("Hello!")`<br>`  print("World!")`<br><br>使用制表符缩进代码行。
    | `if(answer=="Ada"){`<br>`  alert("Hello!");`<br>`  alert("World!");`<br>`}`<br><br>在代码行周围放置花括号
    `{}`，并在行末加上分号。 |

    | 变量 | 本系列不使用Logo讲解此概念。 | ![Scratch积木](image) | `a=10`<br>`a=a+20`<br>`a=a*2`
    将值加倍 | `var a=10;`<br>`a=a+20;`<br>`a=a*2;`<br><br>第一次使用变量时，需要用 `var` 声明。 |

    | 随机数 | 本系列不使用Logo讲解此概念。 | ![Scratch积木](image) | `randint(1,6)`<br><br>需要先使用 `from
    random import *` 导入随机数库 | `parseInt(1+6*Math.random())` |


    > 请注意，这些都是简短的代码片段。它们需要放在程序中才能演示。<br>*这有时被称为缩进风格或括号风格。它描述了不同语言在循环或''if''命令之后运行多行代码的方式。


    # 进阶说明


    所有孩子的学习进度都不同。当他们通过这一系列书籍并成为更好的编码者时，有许多关键概念需要理解和应用。此列表将帮助孩子们识别自己的进步。


    ## 第1册


    - [ ] 我理解计算机需要指令才能做事。

    - [ ] 我知道指令需要精确。

    - [ ] 我知道指令需要按正确的顺序给出。

    - [ ] 我可以使用Logo给出指令，让海龟在屏幕上移动。

    - [ ] 我可以使用Scratch给出指令，让精灵在屏幕上移动。

    - [ ] 我知道需要输入来改变程序的运行方式。

    - [ ] 我可以制作一个使用按键输入让精灵四处移动的程序。

    - [ ] 我可以制作自己的简单程序，让精灵在屏幕上移动。

    - [ ] 我可以调试我的程序，找出并修复简单的错误。


    ## 第2册


    - [ ] 我能解释什么是循环以及程序为什么使用它们。

    - [ ] 我可以在Logo或Scratch中编程一个''重复''循环来绘制形状。

    - [ ] 我理解重复固定次数的循环与无限循环之间的区别。

    - [ ] 我可以制作一个使用''重复直到''循环的游戏。

    - [ ] 我理解声音是程序的另一种输出，我可以制作一个播放声音的程序。

    - [ ] 我理解什么是变量，以及如何用它来在游戏中记分。

    - [ ] 我可以制作一个使用变量的游戏。

    - [ ] 我可以调试我的程序以修复一些错误。


    ## 第3册


    - [ ] 我理解选择以及''if''命令是什么。

    - [ ] 我可以使用''if''和''else''命令制作一个简单的测验。

    - [ ] 我可以使用Python在屏幕上打印消息并进行简单的计算。

    - [ ] 我可以使用''for''循环打印一串数字。

    - [ ] 我理解什么是随机数，并可以在简单的程序中使用它们。

    - [ ] 我可以制作一个使用循环、变量和''if''命令的自己的简单游戏。

    - [ ] 我可以检查我的代码并找出错误所在。


    ## 第4册


    - [ ] 我理解网站使用HTML页面，以及互联网如何将计算机连接成网络。

    - [ ] 我可以编写一个具有不同大小标题和文本的简单HTML页面。

    - [ ] 我可以使用锚点标签将页面链接在一起。

    - [ ] 我知道网页在按钮被点击或页面加载时如何调用JavaScript。

    - [ ] 我可以使用JavaScript制作简单的循环，在页面上打印一系列内容。

    - [ ] 我能解释为什么制作函数是个好主意。

    - [ ] 我能理解从调试工具获得的一些消息。

    - [ ] 我可以制作一个将几个页面链接在一起并包含文本和图像的迷你网页项目。


    # 答案


