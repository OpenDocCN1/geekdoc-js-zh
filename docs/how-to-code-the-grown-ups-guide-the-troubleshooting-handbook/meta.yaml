    | **运算模块** | 与“重复执行直到”或“如果”配合使用，检查值是否相等。 |

    | | 生成一个随机数。 |


    ## 常见问题


    - 1. 指令顺序错误。尝试交换积木块，看看是否能解决问题。


    2. 孩子们经常混淆左转和右转，或者设置x坐标与设置y坐标。手边准备一张图表或一个标有“L”和“R”的“纸海龟”。

    3. 当使用多个角色时，在添加或修改代码之前，很容易忘记点击正确的角色。

    4. 某些设置会持续存在。例如，尝试在创建绘图形状的程序之前点击“落笔”（但在程序中省略“落笔”指令），然后保存该程序。形状会被绘制出来，因为Scratch“记住”了“落笔”指令。然而，如果你第二天打开程序，形状将不会被绘制，因为“落笔”不是程序的一部分。

    5. “碰到颜色”指令块使用起来比较棘手。确保正在检查的颜色与所需颜色完全相同，可以使用颜色选择器。


    ## PYTHON 技术指南


