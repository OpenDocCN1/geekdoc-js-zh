    # PAGES 6-7

    # Giving instructions


    ![](img/67c80c813fc5d30d52471ee1f484e615_7_0.png)


    # ## OBJECTIVES


    The first step towards becoming a good programmer is to learn that computers need
    clear and precise instructions to make things happen. ''Giving instructions''
    offers a number of activities to help children learn this concept, before they
    start work at the computer. By taking it in turns to ''be a robot'', children
    will understand that it is essential to have a clear idea about what you want
    a program to do before you start coding.


    # ## KEY CONCEPTS: PRECISION AND SEQUENCE


    We need to make sure children understand that commands must be precise. It is
    no good saying ''move'' in a computer program – we need to tell the computer which
    object and which direction.


    The next thing we need to do is ensure that any commands we give a program are
    in the correct order. This is something that we can demonstrate quite easily by
    mixing up the order of instructions and seeing what happens.


    # ### EXTRA HELP


    It can be very effective to write down instructions on separate cards. Then you
    and your children can rearrange them.


    +   - Walk forwards

    - Stop!

    - Turn right

    - Turn left

    - Pick up

    - Down

    - Drop

    - Up

    - Right

    - Left


    # PAGES 8-9

    # Step by step


    ![](img/67c80c813fc5d30d52471ee1f484e615_7_1.png)


    # ## OBJECTIVES


    In ''Step by step'', children will learn the term ''algorithm''. An algorithm
    is explained as the steps a program needs to take in order to solve a problem.
    In the game on page 9, children write down the sequence of steps they need to
    take to get from one place on the board to another. This is a basic algorithm.


    # ## TAKING IT FURTHER


    As children become more experienced programmers, their definition of ''algorithm''
    will need to become more sophisticated. Once they progress beyond simple programming,
    their code may branch off in different directions, or respond to different inputs.
    At this point, they will not be using a straightforward sequence of commands or
    steps, so it may be more helpful to think about an algorithm as being a set of
    rules to solve a problem or make a game work. As they progress further, they will
    start to create programs that have a number of different algorithms at work.


    ![](img/67c80c813fc5d30d52471ee1f484e615_7_2.png)'
  - '[PAGE 8]


    # PAGES 10–11


    # Coded messages


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_0.png)


    # OBJECTIVES


    Here children will learn that the instructions we give to computers need to have
    more information and be precise. Rather than just telling a robot to move up,
    we introduce the idea that we can use instructions like **U5** to move up 5 squares.
    This idea is developed further to create simple programs, such as **U4 R4 D4 L4**,
    that can be used to draw a square.


    # TAKING IT FURTHER


    In the game ''You name it!'', on page 11, children will write programs to spell
    out their name or initials. If children want to take the game further, ask them
    to invent some new commands to change the colour of what they are going to draw.
    They might choose to use **PR** to mean ''pen – red'' or **PY** to mean ''pen
    – yellow''. Use these new commands to create longer programs or even whole words.


    For example, the following program would write ''elsa'':


    **PR** (pen red) **R3 U2 L3 D3 R4**


    **PB** (pen blue) **U5 D5 R1**


    **PG** (pen green) **R3 U2 L3 U1 R3**


    **PO** (pen orange) **R4 D3 L3 U2 R3**


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_1.png)


    # PAGES 12–13


    # Spinning around


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_2.png)


    # OBJECTIVES


    To move a robot around the floor, or a turtle around the screen, we need to use
    commands to move it forward by a certain amount, or rotate it by a number of degrees.
    This page explains how degrees are used to measure how far things are rotated.
    To keep things simple, for now we are using only ''quarter-turns'' of 90 degrees.


    # EXTRA HELP


    When we need to explain how big things are on a computer screen, we usually measure
    in pixels. Each dot on a computer screen is a pixel (short for ''picture element'').
    If children are having trouble grasping what a pixel is, you can demonstrate by
    using a strong magnifying glass to look at a computer screen, or by zooming into
    a low-quality digital photograph. As you keep zooming in, the picture will become
    blurry or ''blocky'' and the individual pixels will be apparent.


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_3.png)


    # TAKING IT FURTHER


    Play ''human robots''. Instead of using squared paper, work outside on some paving
    stones or in the playground. Ask children to work with a partner. One child will
    give instructions, and the other will be a robot carrying them out. The robot
    partner can use chalk to draw on the ground as they carry out the instructions.


    ![](img/67c80c813fc5d30d52471ee1f484e615_8_4.png)'
  - '[PAGE 9]


    **PAGES 14–15**


    # Learning Logo


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_0.png)


    # OBJECTIVES


    Here children will learn the basics of a simple programming language: Logo. They
    will do their first basic coding. Children will start programming an onscreen
    turtle (arrow) with three basic commands: move forward, turn left and turn right.
    For a technical guide to using Logo, turn to page 50 of this book.


    # COMMON CONFUSIONS


    Some children find it hard to work out whether to turn the turtle left or right,
    particularly when the turtle is facing downwards. A good way to support them is
    to make a small paper turtle that children can turn to face the same direction
    as the turtle on the screen.


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_1.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_2.png)


    **PAGES 16–17**


    # Logo shapes


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_3.png)


    # OBJECTIVES


    Now that children have learnt to move the turtle around on the Logo screen, they
    will learn to write more purposeful programs to draw particular shapes.


    # TAKING IT FURTHER


    If children are ready to take their Logo programming to the next level, ask them
    to:


    +   1. Design a simple pattern and create it using Logo. Write down the code and
    share it with a partner so they can make the pattern.

    2. Make a poster for younger children explaining how to use Logo.

    3. Play ‘human robots’ with a partner, using Logo commands. Give your partner
    commands to move around the playground while drawing shapes with a piece of chalk.

    4. Draw some of the letters in your name using Logo commands. Write down the commands
    that you use. Make sure you use only horizontal and vertical lines for now.


    ![](img/67c80c813fc5d30d52471ee1f484e615_9_4.png)


    ```

    fd 100 rt 90 fd 50 rt 90

    fd 50 rt 90 fd 50 rt 180

    fd 50 rt 90 fd 50

    ```'
  - '[PAGE 10]


    # PAGES 18-19

    Starting Scratch


    ![](img/67c80c813fc5d30d52471ee1f484e615_10_0.png)


    # OBJECTIVES


    Here children will learn the basics of the Scratch programming language. Scratch
    is a good next step after Logo. It enables children to grasp more complex coding
    ideas, but it is still very simple to use. For a technical guide to using Scratch,
    turn to page 52 of this book.


    # EXTRA HELP


    Before children start programming with Scratch, you can give them a demonstration
    of how it works. Start by showing them the different groups of code blocks (such
    as Events and Motion). Follow this by demonstrating how code blocks can be dragged
    to the scripts area (on the right of the screen) and joined up to make short programs.
    Show them how each code block can be run by clicking it. Let them see how code
    blocks can be removed from a program by dragging them out of the scripts area,
    and how blocks can be separated by dragging the bottom block downwards.


    # TAKING IT FURTHER


    If children are ready to try more, ask them to:


    +   1. Drag the sprite to the left of the screen. Make it move all the way to
    the right by clicking **''Move 10 steps''** in the **Motion** group. How many
    times do you need to click it? Check the answer on page 62.


    +   2. Change the number of steps the sprite moves each time you click it. In
    order to cross the screen in 5 clicks, what number do you need to change it to?
    What number makes it cross the screen in 2 clicks? How many steps do you think
    it is across the whole screen? Check the answers on page 62.


    # PAGES 20-21

    Pen down


    ![](img/67c80c813fc5d30d52471ee1f484e615_10_1.png)


    # OBJECTIVES


    In ''Pen down'', children will learn to draw all sorts of shapes and patterns
    using Scratch. The **Pen** group gives children access to the **''Pen up''** and
    **''Pen down''** commands. After allowing some time for experimentation, encourage
    children to plan the programs they will be creating in rough before they start.


    # TAKING IT FURTHER


    Ask children to have a go at these exercises:


    +   1. Write simple programs to draw each of the digits 1, 2 and 3. There are
    several different ways to draw these numbers. For one possible solution, turn
    to page 62.


    +   2. Drag the programs together to make a longer program that writes 123.


    +   3. Work with a partner. Draw a simple shape for them on a piece of paper.
    Only use horizontal and vertical lines. Use squared paper if you can. Challenge
    your partner to draw the pattern using Scratch.


    ![](img/67c80c813fc5d30d52471ee1f484e615_10_2.png)'
