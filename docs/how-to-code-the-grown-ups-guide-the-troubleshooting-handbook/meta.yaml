- md: '## USEFUL PYTHON COMMANDS, LIBRARIES AND FUNCTIONS


    | COMMAND | WHAT IT DOES | EXAMPLE |

    | :--- | :--- | :--- |

    | **print** | Print a string on the screen. | print("Hello") |

    | **input** | Ask the user to enter a value. | n=input("How old are you?") |

    | **if** | Test if a condition is true or not. | if n==10: |

    | **else** | Run a block of code following an ‘if’ statement, when the condition
    is false. | else: print("wrong") |

    | **for…in…range** | Make a repeating loop. | for n in range(0,10): |

    | **from…import…** | Import a code library, for example containing graphics commands.
    | from random import * |

    | **turtle** | A graphics library. | from turtle import * |

    | **forward** or **fd** | Move the turtle forward. | forward(10) |

    | **left** or **lt** | Rotate the turtle left. | left(90) |

    | **right** or **rt** | Rotate the turtle right. | right(45) |

    | **pendown** or **pd** | Pen down: draw when the turtle moves. | pd() |

    | **penup** or **pu** | Pen up: don’t draw when the turtle moves. | penup() |

    | **goto** | Move the turtle to specific coordinates. | goto(200,100) |

    | **color** | Set the colour for the turtle to draw with. Note the American spelling:
    ‘color’. | color("orange") |

    | **random** | A library to create and work with random numbers. | from random
    import * |

    | **randint** | Create a random number between two values. | dice=randint(1,6)
    |

    | **choice** | Randomly select an item from a list. | days=["M","Tu","W","Th","F"]
    print(choice(days)) |

    | **int** | Convert a string of characters to an integer. | n=int("10") |

    | **tab** | The ‘Tab’ key can be used to indent code after an ‘if’ statement (Python
    also accepts 4 spaces). | ...print("You are ten.") |


    ## COMMON PROBLEMS


    1. Brackets and quotes are missing or not matching. Encourage children to check
    their typing. Python will give some warnings: “**EOL while scanning string literal**”
    means there is a missing quote; “**unexpected EOF while parsing**” means something
    is missing at the end of the line, often a bracket.


    2. Indents are incorrect. Don’t forget to use tabs after ‘if’ commands and for
    loops. IDLE adds these automatically, but if children want several things to happen
    after an ‘if’ statement they may need to add tabs. If they only want one thing
    to happen, they will need to delete a tab.


    3. The range in a ‘for’ loop is incorrect. The range starts with the 1st number,
    but stops before the 2nd number. For example, **for n in range(1,10)** makes a
    loop run from 1 to 9. Making a random number is different: **randint(1,10)** creates
    random numbers from 1 to 10.


    4. Accidentally deleting saved work by choosing ‘**Save**’ instead of ‘**Open**’
    when trying to retrieve a program: this will replace a previous file with a blank
    one! Children should retrieve their work from the ‘**Recent files**’ list.


    5. Code is mistyped. Encourage children to wait for IDLE to automatically colour
    and highlight their code as they type.


    # HTML TECHNICAL GUIDE


    There are many different ways of creating web pages. This series focusses on giving
    children an introduction to HTML (Hyper Text Mark-up Language), the language of
    the web. A program called a text editor (Notepad on a PC, and TextEdit on a Mac)
    is needed to start writing HTML. You will need a browser (such as Internet Explorer,
    Safari or Chrome) to view it.


    ## USING A TEXT EDITOR


    ![](img/67c80c813fc5d30d52471ee1f484e615_57_0.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_57_1.png)


    ## USEFUL HTML TAGS


    | TAG | WHAT IT DOES | EXAMPLE |

    | --- | --- | --- |

    | `<html>` `</html>` | Starts and ends an HTML file. | `<html>`<br>`</html>` |

    | `<body>` `</body>` | The body tag goes around the page content of an HTML file.
    | `<html>`<br>`<body>`<br>`</body>`<br>`</html>` |

    | `<h1>` `</h1>`<br>`<h2>` `</h2>`<br>`<h6>` `</h6>` | Heading tags are used to
    make a heading. `<h1>` headings are the most important and therefore the biggest.
    | `<h1>My Page</h1>` |

    | `<p>` `</p>` | Paragraph tags are used to start and end a paragraph of text.
    | `<p>Once upon a time there was a monster. His name was Glug.</p>` |

    | `<br>` | The line break tag starts a new line in a web page. | Line 1<br>Line
    2 |

    | `<a>` `</a>` | The anchor tag is used to start and end a link, usually to another
    page. | `<a href="page2.html">Next page`<br>`</a>` |

    | `<img>` | The image tag is used to insert a picture or photo in a web page.
    | `<img src="dog.jpg">` |

    | `<button>` `</button>` | This puts a button on a page. | `<button>OK</button>`
    |

    | `<title>` `</title>` | The page title (shown in the browser bar) is set by using
    title tags. | `<title>This will show at the page top</title>` |

    | `<strong>` `</strong>` | Putting these tags around a word will make the word
    bold. | It was an `<strong>amazing</strong>` day. |

    | `<em>` `</em>` | Putting `<em>` and `</em>` around a word will make it italic.
    | It was a `<em>special`<br>`</em>` day. |

    | `<mark>` `</mark>` | Putting `<mark>` and `</mark>` around a word will highlight
    it. | You chose Yes `<mark>No</mark>`. |


    > The web pages in our books are made with minimal HTML to keep things simple.
    If children start creating pages to use online, they should begin each HTML file
    with `<!DOCTYPE html>` and use `<body>` and `<title>` tags.


    ## COMMON PROBLEMS


    1. The file type is wrong. Files must be saved as .html. Children must also make
    sure they save their file in the text editor and refresh the browser to see any
    changes.


    2. You''re not working in ''plain text''. If you are using TextEdit on a Mac,
    make sure it is set to ''plain text'' in ''Preferences''.


    3. Smart quotes are not turned off. Make sure these are turned off in ''Preferences''.
    Quotes should be vertical and look like '' or " not ‘ or “.


    4. The wrong file is open in the browser or it is not up to date. Sometimes children
    edit a file saved in one folder, but view one saved somewhere else in the browser.


    5. Tags are misspelled or missing. Check they are correct! This is much easier
    in a dedicated HTML editor. Make sure there is a closing tag where appropriate
    (e.g. `</script>`).


    6. Quotes or brackets are not matching. Make sure that there is a close bracket
    for every open bracket, and the same for every quote. Single quotes should match
    single quotes, and double match double quotes.


    ## Styling with HTML


    Book 4 gives children an overview of how to change the colour and style of objects
    on a web page. Large websites will do this with additional files containing CSS
    (Cascading Style Sheets). Here we use a simpler approach to explore the concept,
    by putting style attributes inside tags.


    ## STYLE TAGS


    To understand style tags, try the following code:


    ```html

    <html>

    <body style=''background-color:yellow''>

    <h1 style=''color:red''>Web</h1>

    <p style=''color:green''>Internet</p>

    </body>

    </html>

    ```


    ![](img/67c80c813fc5d30d52471ee1f484e615_59_0.png)


    Style attributes can be combined by using semi-colons:

    `<p style=''color:pink; text-align:left''>Hi</p>`


    ## HTML, JAVASCRIPT AND CSS


    Most web pages use a combination of three languages or technologies: HTML, JavaScript
    and CSS.


    **HTML** tells the browser what will go on a web page. It specifies what text,
    pictures, video and other objects will be shown. HTML can''t do calculations or
    respond to inputs from the user, other than simple things like loading a new page.


    **JavaScript** was designed to complement HTML by adding interactive functions
    so that objects on the web page can be changed, moved or hidden. JavaScript can
    do calculations, and is now a programming language in its own right.


    **CSS** is used by designers to specify the appearance of what is shown to someone
    viewing the web page. It has become increasingly important as web pages are viewed
    on different-sized devices, from smart phones to large-screen TVs.


    ## USEFUL HTML STYLE ATTRIBUTES


    | STYLE ATTRIBUTE | WHAT IT DOES | EXAMPLE |

    |---|---|---|

    | **background-color** | Sets the background colour for an element in a web page.
    | **background-color:red** |

    | **color** | Sets the colour for an element, some text for example. | **color:blue**
    |

    | **font-size** | Sets the size for an element containing some text. | **font-size:36px**
    |

    | **font-family** | Sets the font name for some text. | **font-family:''Times
    New Roman''** |

    | **text-align** | Centres text, or justifies it to the left or right. | **text-align:center**
    |

    | **border-style** | Creates a border around an HTML element. | **border-style:dotted**
    |

    | **padding** | Makes some space between the edge of an element and what is inside
    it. | **padding:10px** |


    Where sizes are used, **px** means pixels. Note the American spellings of ''color''
    and ''center''.'
  mdcn: '

    ## 实用的 Python 命令、库和函数


    | 命令 | 功能 | 示例 |

    | :--- | :--- | :--- |

    | **print** | 在屏幕上打印字符串。 | print("Hello") |

    | **input** | 提示用户输入一个值。 | n=input("How old are you?") |

    | **if** | 测试一个条件是否为真。 | if n==10: |

    | **else** | 当条件为假时，运行`if`语句之后的一个代码块。 | else: print("wrong") |

    | **for…in…range** | 创建一个重复循环。 | for n in range(0,10): |

    | **from…import…** | 导入一个代码库，例如包含图形命令的库。 | from random import * |

    | **turtle** | 一个图形库。 | from turtle import * |

    | **forward** 或 **fd** | 让海龟向前移动。 | forward(10) |

    | **left** 或 **lt** | 让海龟向左旋转。 | left(90) |

    | **right** 或 **rt** | 让海龟向右旋转。 | right(45) |

    | **pendown** 或 **pd** | 落笔：当海龟移动时进行绘制。 | pd() |

    | **penup** 或 **pu** | 提笔：当海龟移动时不进行绘制。 | penup() |

    | **goto** | 将海龟移动到特定的坐标。 | goto(200,100) |

    | **color** | 设置海龟绘图的颜色。注意美式拼写：''color''。 | color("orange") |

    | **random** | 一个用于创建和处理随机数的库。 | from random import * |

    | **randint** | 创建一个介于两个值之间的随机数。 | dice=randint(1,6) |

    | **choice** | 从一个列表中随机选择一个项目。 | days=["M","Tu","W","Th","F"] print(choice(days))
    |

    | **int** | 将一串字符转换为整数。 | n=int("10") |

    | **tab** | 在`if`语句和`for`循环之后，可以使用''Tab''键来缩进代码（Python 也接受 4 个空格）。 | ...print("You
    are ten.") |


    ## 常见问题


    1.  括号和引号缺失或不匹配。鼓励孩子们检查他们的输入。Python 会给出一些警告：“**EOL while scanning string literal**”表示缺少一个引号；“**unexpected
    EOF while parsing**”表示行尾缺少某些东西，通常是一个括号。


    2.  缩进不正确。不要忘记在`if`命令和`for`循环之后使用 Tab 键。IDLE 会自动添加这些，但如果孩子们希望在`if`语句之后发生多件事，他们可能需要手动添加
    Tab。如果他们只想发生一件事，则需要删除一个 Tab。


    3.  `for` 循环中的范围不正确。范围从第一个数字开始，但在第二个数字之前停止。例如，**for n in range(1,10)** 使循环从 1
    运行到 9。创建随机数则不同：**randint(1,10)** 创建从 1 到 10 的随机数。


    4.  尝试找回程序时，不小心选择了“**Save**”而不是“**Open**”，从而删除了保存的工作：这将用一个空白文件替换之前的文件！孩子们应该从“**Recent
    files**”列表中找回他们的工作。


    5.  代码输入错误。鼓励孩子们等待 IDLE 在他们输入时自动为代码着色和高亮显示。


    # HTML 技术指南


    创建网页有很多不同的方法。本系列侧重于向孩子们介绍 HTML（超文本标记语言），即网络语言。开始编写 HTML 需要使用一个名为文本编辑器的程序（PC 上的记事本和
    Mac 上的 TextEdit）。你需要一个浏览器（如 Internet Explorer、Safari 或 Chrome）来查看它。


    ## 使用文本编辑器


    ![](img/67c80c813fc5d30d52471ee1f484e615_57_0.png)


    ![](img/67c80c813fc5d30d52471ee1f484e615_57_1.png)


    ## 实用的 HTML 标签


    | 标签 | 功能 | 示例 |

    | --- | --- | --- |

    | `<html>` `</html>` | 开始和结束一个 HTML 文件。 | `<html>`<br>`</html>` |

    | `<body>` `</body>` | body 标签包围 HTML 文件的页面内容。 | `<html>`<br>`<body>`<br>`</body>`<br>`</html>`
    |

    | `<h1>` `</h1>`<br>`<h2>` `</h2>`<br>`<h6>` `</h6>` | 标题标签用于制作标题。`<h1>` 标题是最重要的，因此也是最大的。
    | `<h1>My Page</h1>` |

    | `<p>` `</p>` | 段落标签用于开始和结束一段文本。 | `<p>Once upon a time there was a monster.
    His name was Glug.</p>` |

    | `<br>` | 换行标签在网页中开始一个新行。 | Line 1<br>Line 2 |

    | `<a>` `</a>` | 锚点标签用于开始和结束一个链接，通常是链接到另一个页面。 | `<a href="page2.html">Next page`<br>`</a>`
    |

    | `<img>` | 图像标签用于在网页中插入图片或照片。 | `<img src="dog.jpg">` |

    | `<button>` `</button>` | 这会在页面上放置一个按钮。 | `<button>OK</button>` |

    | `<title>` `</title>` | 页面标题（显示在浏览器栏中）通过使用 title 标签设置。 | `<title>This will show
    at the page top</title>` |

    | `<strong>` `</strong>` | 将这些标签放在一个单词周围会使该单词加粗。 | It was an `<strong>amazing</strong>`
    day. |

    | `<em>` `</em>` | 将 `<em>` 和 `</em>` 放在一个单词周围会使其变为斜体。 | It was a `<em>special`<br>`</em>`
    day. |

    | `<mark>` `</mark>` | 将 `<mark>` 和 `</mark>` 放在一个单词周围会突出显示它。 | You chose Yes
    `<mark>No</mark>`. |


    > 我们书中的网页是用最少的 HTML 制作的，以保持简单。如果孩子们开始创建在线页面，他们应该在每个 HTML 文件的开头使用 `<!DOCTYPE html>`
    并使用 `<body>` 和 `<title>` 标签。


    ## 常见问题


    1.  文件类型错误。文件必须保存为 .html。孩子们还必须确保他们在文本编辑器中保存文件，并刷新浏览器以查看任何更改。


    2.  你没有在“纯文本”模式下工作。如果你在 Mac 上使用 TextEdit，请确保在“偏好设置”中将其设置为“纯文本”。


    3.  智能引号未关闭。确保在“偏好设置”中关闭这些选项。引号应该是垂直的，看起来像 '' 或 " 而不是 ‘ 或 “。


    4.  浏览器中打开的文件错误或未更新。有时孩子们编辑保存在一个文件夹中的文件，但在浏览器中查看保存在其他地方的文件。


    5.  标签拼写错误或缺失。检查它们是否正确！在专用的 HTML 编辑器中这要容易得多。确保在适当的地方有结束标签（例如 `</script>`）。


    6.  引号或括号不匹配。确保每个开括号都有一个闭括号，每个引号也是如此。单引号应与单引号匹配，双引号应与双引号匹配。


    ## 使用 HTML 进行样式设计


    第 4 册让孩子们概览如何改变网页上对象的颜色和样式。大型网站将使用包含 CSS（层叠样式表）的附加文件来实现这一点。这里我们使用一种更简单的方法来探索这个概念，即在标签内放置样式属性。


    ## 样式标签


    要理解样式标签，请尝试以下代码：


    ```html

    <html>

    <body style=''background-color:yellow''>

    <h1 style=''color:red''>Web</h1>

    <p style=''color:green''>Internet</p>

    </body>

    </html>

    ```


    ![](img/67c80c813fc5d30d52471ee1f484e615_59_0.png)


    样式属性可以通过使用分号组合起来：

    `<p style=''color:pink; text-align:left''>Hi</p>`


    ## HTML, JAVASCRIPT 和 CSS


    大多数网页使用三种语言或技术的组合：HTML、JavaScript 和 CSS。


    **HTML** 告诉浏览器网页上将放置什么内容。它指定了将显示哪些文本、图片、视频和其他对象。HTML 无法进行计算或响应用户的输入，除了加载新页面等简单操作。


    **JavaScript** 旨在补充 HTML，添加交互功能，以便可以更改、移动或隐藏网页上的对象。JavaScript 可以进行计算，并且现在本身已经成为一种编程语言。


    **CSS** 被设计者用来指定向查看网页的人显示内容的外观。随着网页在不同尺寸的设备（从智能手机到大屏幕电视）上被查看，它变得越来越重要。


    ## 实用的 HTML 样式属性


    | 样式属性 | 功能 | 示例 |

    |---|---|---|

    | **background-color** | 设置网页中某个元素的背景颜色。 | **background-color:red** |

    | **color** | 设置某个元素的颜色，例如一些文本。 | **color:blue** |

    | **font-size** | 设置包含一些文本的元素的大小。 | **font-size:36px** |

    | **font-family** | 设置一些文本的字体名称。 | **font-family:''Times New Roman''** |

    | **text-align** | 将文本居中，或向左或向右对齐。 | **text-align:center** |

    | **border-style** | 在 HTML 元素周围创建一个边框。 | **border-style:dotted** |

    | **padding** | 在元素的边缘及其内部内容之间留出一些空间。 | **padding:10px** |


    当使用尺寸时，**px** 表示像素。注意 ''color'' 和 ''center'' 的美式拼写。

    '
