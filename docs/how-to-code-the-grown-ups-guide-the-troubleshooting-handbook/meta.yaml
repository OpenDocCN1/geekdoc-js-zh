    # PAGES 10-11

    ''Else'' commands


    ![](img/67c80c813fc5d30d52471ee1f484e615_28_0.png)


    # OBJECTIVES


    ''Else commands'' continues our work on selection. Children will learn how to
    use ''if then else'' commands in Scratch. A basic ''if'' code block allows us
    to do something if a condition is true - for example, to show ''Well done!'' if
    an answer is correct. Adding an ''else'' part to the code block allows us to run
    a different bit of code if the answer is wrong.


    ![](img/67c80c813fc5d30d52471ee1f484e615_28_1.png)


    # EXTRA HELP


    Move away from the computer to play these fun games that demonstrate the concept
    of ''if then else''. These exercises will also enable you to see whether children
    have understood the key concept of selection or not.


    Ask these questions, or type the questions on a computer (using a large font or
    projector):


    +   - if your age equals 10 **then** stand up **else** sit down

    - if you have black hair **then** wave your hands **else** pat your stomach

    - if you are a girl **then** dance **else** put your fingers in your ears


    Or give each child a playing card and ask questions such as:


    +   - if card = 5 **then** wave **else** frown

    - if card = red **then** jump up and down **else** put your hands on your head


    # PAGES 12-13

    If sprite is touched...


    ![](img/67c80c813fc5d30d52471ee1f484e615_28_2.png)


    # OBJECTIVES


    This project will combine children''s understanding of selection with their knowledge
    of loops. Loops are covered in Book 2 of this series - turn to page 16 of this
    book for a recap. In this apple-eating game, a ''forever'' loop keeps our cat
    sprite moving towards the mouse pointer. An ''if then'' command will make apple
    sprites disappear if they are touched (or eaten!) by the cat.


    # TAKING IT FURTHER


    If children are comfortable with both selection and loops, they could try these
    extra activities:


    +   1. Make a game where a monster has to eat up aliens.

    2. To make the game more difficult, program the aliens to move around the screen.

    3. Make the car-racing game on pages 22-23 of this book. Take out the ''Touching
    color'' part of the ''Repeat until'' loop and add an ''if'' statement. Now make
    the score go down by 1 point if the car touches the grass.

    4. Try changing the car-racing game so that if the car touches the grass, it moves
    forward by -1 step. This will make the car slow down.


    ![](img/67c80c813fc5d30d52471ee1f484e615_28_3.png)'
