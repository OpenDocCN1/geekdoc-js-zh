- md: " **BOOK 2**\n\n**EXTENSION PROJECTS**\n\n## Racing game\n\nThis project will\
    \ extend children's learning by combining a 'repeat until' loop with a variable.\
    \ Using Scratch, we will create a car-racing game in which the loop will keep\
    \ the car moving until it hits something. A variable will be used to time how\
    \ long the car has been driven without crashing.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_0.png)\n\
    \n1. Start Scratch. Delete the main sprite by right-clicking on it and then choosing\
    \ 'Delete'. (On a MAC, you will need to hold the 'Control' key while you click.)\n\
    \n2. Now draw your own car sprite.\n\nStart by clicking 'Paint new sprite'.\n\n\
    ![](img/67c80c813fc5d30d52471ee1f484e615_23_1.png)\n\nChoose a colour and select\
    \ the **Rectangle** tool. Draw the car body.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_2.png)\n\
    \nThen add more rectangles, wheels and a driver (using the **Ellipse** tool).\n\
    \n3. Make the car sprite smaller by clicking the **Shrink** icon and then clicking\
    \ the car several times.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_3.png)\n\
    \n4. Now draw your own track for the car to drive on. Don't make it too narrow.\n\
    \nClick 'Stage'.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_4.png)\n\nThen\
    \ click 'Backdrops'.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_5.png)\n\n\
    Click the **Fill** tool and choose a green colour. Now click the background to\
    \ colour it in. Then use grey rectangles to draw the track.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_6.png)\n\
    \n5. Now we need to make the car move until it goes off the track.\n\nClick **Sprite1**\
    \ to make sure we are adding code to the car sprite. Then click on the 'Scripts'\
    \ tab.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_24_0.png)\n\nDrag all of these\
    \ code blocks onto the scripts area.\n\n```\nwhen \U0001F7E2 clicked\nset x to\
    \ 0\nset y to 120\npoint in direction 90 ▼\nrepeat until touching color \U0001F7E9\
    ?\n    move 2 steps\nend\n```\n\nYou need to set the '**Touching color**' code\
    \ block to the green of your grass. Click on the coloured square, then click on\
    \ the grass on the stage area.\n\nClick the green flag icon near the top of the\
    \ Scratch screen to test your code.\n\nIf the car doesn't move to the track when\
    \ you click the flag, adjust the '**Set x to**' and '**Set y to**' values. The\
    \ '**Point in direction**' block will make it drive to the right.\n\n6. Add two\
    \ '**When key pressed**' blocks from the **Events** group to steer the car. Test\
    \ your code and try pressing the arrow keys.\n\n```\nwhen ← key pressed\nturn\
    \ ↺ 15 degrees\n\nwhen → key pressed\nturn ↻ 15 degrees\n```\n\n7. Now make a\
    \ variable to keep the score.\n\nChoose the **Data** group.\n\n```\nPen | Operators\n\
    **Data** | More Blocks\n```\n\nClick '**Make a variable**'.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_24_1.png)\n\
    \nCall it '**s**' (for score).\n\n![](img/67c80c813fc5d30d52471ee1f484e615_24_2.png)\n\
    \nThen click '**OK**'.\n\n8. Drop a '**Set s to 0**' code block in at the start\
    \ of the game.\n\n```\nwhen \U0001F7E2 clicked\nset s to 0\nset x to 0\nset y\
    \ to 120\n```\n\n9. Drop a '**Change s by 1**' code block in the main repeat loop\
    \ to make the score go up.\n\n```\nrepeat until touching color \U0001F7E9?\n \
    \   move 2 steps\n    change s by 1\nend\n```\n\nClick this button to make the\
    \ game larger!\n\n![](img/67c80c813fc5d30d52471ee1f484e615_24_3.png)\n\n> **Challenge!**\n\
    \nCan you add sound effects so you get a crash at the end (try a drum sound)?\n\
    \n## Fun with variables\n\nOnce children have got to grips with variables and\
    \ are using them confidently, there are lots of ways to extend their understanding.\
    \ Here we will use Scratch to combine variables with loops, sound and graphics.\n\
    \n### VARIABLES AND SOUND\n\nTry out this program, which combines a loop with\
    \ a variable as well as sounds.\n\n+   1. From the **Control** group, drag a 'Repeat'\
    \ loop block over to the scripts area.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_25_0.png)\n\
    \n+   2. Add a 'Play note' code block from the **Sound** group.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_25_1.png)\n\
    \n+   3. Click the **Data** group and make a variable called 'a'.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_25_2.png)\n\
    \n+   4. Put a 'Set a to 0' code block before the loop starts. Set 'a' to 60.\n\
    \n```\nset a to 60\nrepeat 10\n  change a by 1\n  play note a for 0.5 beats\n\
    ```\n\nDrag over the small circle with 'a' in it and drop it in the 'Play note'\
    \ code block.\n\nDrop a 'Change a by 1' code block into the repeat loop. Test\
    \ your code. Experiment!\n\nNow create these 3 programs. What sort of games would\
    \ they create useful sound effects for?\n\n```\nset instrument to 17\nset a to\
    \ 60\nrepeat 12\n  play note 8 for 0.1 beats\n  change a by 5\n  repeat 10\n \
    \   play note 8 for 0.1 beats\n    change a by -5\n```\n\nUse two loops.\n\n```\n\
    set volume to 100%\nset a to 100\nrepeat 10\n  set volume to 8%\n  play note 60\
    \ for 0.1 beats\n  change a by -10\n```\n\nCreate an echo.\n\n```\nset instrument\
    \ to 16\nset a to 100\nrepeat 20\n  play note 8 for 0.05 beats\n  change a by\
    \ -5\n```\n\nExperiment with the amount 'a' changes by and how many times to repeat\
    \ loops.\n\n### Variables and graphics\n\nNow that you have learnt to create basic\
    \ graphic patterns with a loop, try adding variables. It is possible to create\
    \ some interesting effects by using a variable within a loop to change things\
    \ such as how long the shape's sides are. When drawing in Scratch, remember to\
    \ shrink the cat sprite so it doesn't get in the way.\n\nThis loop makes a square:\n\
    \n```\npen down\nrepeat 4\n  move 100 steps\n  turn 90 degrees\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_0.png)\n\
    \nNow add a variable to make a spiral:\n\n```\npen down\nset 'a' to 0\nrepeat\
    \ 40\n  move a steps\n  turn 90 degrees\n  change 'a' by 2\n```\n\nCan you explain\
    \ how this loop works?\n\nThe square program has a fixed side length of 100 steps.\n\
    \nThe spiral works by increasing the side length by 2 steps each loop and storing\
    \ the length in a variable called 'a'.\n\nNow try experimenting with the angle\
    \ that is turned, or the amount 'a' changes.\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_1.png)\n\
    \nThis program draws a thick line:\n\n```\npen down\nset pen size to 6\nrepeat\
    \ 100\n  move 2 steps\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_2.png)\n\
    \nA variable makes the line get thicker and thicker:\n\n```\npen down\nset 'a'\
    \ to 0\nrepeat 100\n  set pen size to a\n  move 2 steps\n  change 'a' by 1\n```\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_26_3.png)\n\nThis program changes the\
    \ colour as well as the pen size. When setting the pen colour, make sure you use\
    \ the 'Set pen color to 0' block.\n\nNow try playing around with different ways\
    \ that variables can change what is drawn.\n\n```\nset pen size to 1\npen down\n\
    set 'a' to 0\nrepeat 200\n  move 2 steps\n  set pen color to a\n  change 'a' by\
    \ 1\n  set pen size to a\n  turn 1 degrees\n```\n\n![](img/67c80c813fc5d30d52471ee1f484e615_26_4.png)\n\
    \n## BOOK 3 PAGE-BY-PAGE GUIDE\n\n### PAGES 6–7 'If' commands\n\n### PAGES 8–9\
    \ Quiz time\n\n![](img/67c80c813fc5d30d52471ee1f484e615_27_0.png)\n\n![](img/67c80c813fc5d30d52471ee1f484e615_27_1.png)\n\
    \n**OBJECTIVES**\n'If commands' introduces a concept called selection. Selection\
    \ allows a program to run different bits of code in response to a question or\
    \ input. Using Scratch, children will code a question-and-answer program using\
    \ selection.\n\n**OBJECTIVES**\nChildren will extend their understanding of selection\
    \ by programming a quiz in Scratch. This project also uses a variable to count\
    \ the score.\n\n**KEY CONCEPT: SELECTION**\nWhen children start coding, most of\
    \ their programs will run in the same way each time, following a sequence of commands,\
    \ one after the other. This is called sequential code. For example:\n\n![](img/67c80c813fc5d30d52471ee1f484e615_27_2.png)\n\
    \n> **EXTRA HELP**\nChildren may need a reminder of how to use variables, which\
    \ were introduced in Book 2 of this series. Variables are a way that computer\
    \ programs store pieces of data or information. Unlike normal numbers, variables\
    \ can change their value when something happens. Although variables can seem like\
    \ quite an abstract idea, children will quickly grasp the concept of using a variable\
    \ to keep a score. Most children are already familiar with how a score starts\
    \ at zero at the beginning of a game – and increases as the game progresses.\n\
    \nMake sure children understand the difference between setting the score at the\
    \ start of the quiz, and adding 1 to it when they get an answer correct. Explain\
    \ that by putting **'Change s by 1'** inside the 'C' shaped part of the 'If then'\
    \ block, it only runs if the answer is correct Southwest.\n\nSelection means that\
    \ a program may branch off and run a different piece of code in response to something\
    \ happening, such as a question being answered. For example:\n\n![](img/67c80c813fc5d30d52471ee1f484e615_27_3.png)\n\
    \nProgrammers often call this a 'conditional statement'."
  mdcn: "\n**第二册**\n\n**扩展项目**\n\n## 赛车游戏\n\n本项目将通过结合“重复直到”循环与变量来扩展孩子们的学习。我们将使用 Scratch\
    \ 创建一个赛车游戏，其中循环会让汽车持续前进，直到撞到障碍物为止。变量用于计时汽车在不受损的情况下行驶了多长时间。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_0.png)\n\
    \n1. 启动 Scratch。右键点击主角色，然后选择“删除”以将其删除。（在 MAC 上，你需要在点击的同时按住“Control”键。）\n\n2. 现在绘制你自己的汽车角色。\n\
    \n首先点击“绘制新角色”。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_1.png)\n\n选择颜色并选中**矩形**工具。绘制车身。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_23_2.png)\n\n然后再添加一些矩形、车轮以及一位驾驶员（使用**椭圆**工具）。\n\
    \n3. 点击**缩小**图标，然后多次点击汽车，使汽车角色变小。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_3.png)\n\
    \n4. 现在绘制你自己的赛道供汽车行驶。不要把赛道画得太窄。\n\n点击“舞台”。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_4.png)\n\
    \n然后点击“背景”。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_23_5.png)\n\n点击**填充**工具并选择绿色。现在点击背景为其着色。然后用灰色矩形绘制赛道。\n\
    \n![](img/67c80c813fc5d30d52471ee1f484e615_23_6.png)\n\n5. 现在我们需要让汽车移动，直到它偏离赛道。\n\
    \n点击**Sprite1**，确保我们正在为汽车角色添加代码。然后点击“脚本”选项卡。\n\n![](img/67c80c813fc5d30d52471ee1f484e615_24_0.png)\n\
    \n将所有这些代码块拖到脚本区域。\n\n```\nwhen \U0001F7E2 clicked\nset x to 0\nset y to 120\n\
