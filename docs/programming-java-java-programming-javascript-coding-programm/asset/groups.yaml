    \ author or copyright owner. Legal action will be pursued if this is breached.\n\
    \n## Disclaimer Notice:\n\nPlease note the information contained within this document\
    \ is for educational and entertainment purposes only. Every attempt has been made\
    \ to provide accurate, up to date and reliable complete information. No warranties\
    \ of any kind are expressed or implied. Readers acknowledge that the author is\
    \ not engaging in the rendering of legal, financial, medical or professional advice.\n\
    \nBy reading this document, the reader agrees that under no circumstances are\
    \ we responsible for any losses, direct or indirect, which are incurred as a result\
    \ of the use of information contained within this document, including, but not\
    \ limited to, errors, omissions, or inaccuracies.\n\n## Introduction to Java\n\
    \nJava – one of the most popular programming languages of the Internet age was\
    \ conceived and developed in 1991 at Sun Microsystems. The evolution of any programming\
    \ language is driven by necessity that arises due to development in the computing\
    \ ecosystem – and Java was no exception.\n\nThough code written in C or C++, the\
    \ powerful predecessors of Java could also run on all devices, the effort required\
    \ to compile them each time to make it work on specific devices was very expensive.\n\
    \nJava overcame this by simply taking the text source code (.java) and compiling\
    \ it to an intermediate byte code (.class) file, which can then be interpreted\
    \ by any device running an interpreter - Java Virtual machine (JVM). The idea\
    \ of byte code meant the code became architecture neutral, needs to be compiled\
    \ only once and can be interpreted on any device which can run a JVM on it.\n\n\
    Today, Java has grown into an important programming language and it is become\
    \ almost imperative for anyone interested in programming to know at least the\
    \ basics of Java. This book has been written exactly for this purpose. I want\
    \ to help anyone with little or no prior programming experience get an easy and\
    \ effective introduction to Java programming.\n\n## Chapter 1: Getting started\n\
    \n### Installation\n\nBefore anything else, we need to get our development environment\
    \ ready. Beginners can use online development environment (https://ideone.com/)\
    \ to execute small snippets of code, but if the code to be executed is a full-fledged\
    \ program, then the one must install Java to their system and setup their own\
    \ offline development environment. Java comes in three types –\n\n- The Micro\
    \ Edition (J2ME)\n- Standard Edition (J2SE)\n- Enterprise Edition (J2EE)\n\nFor\
    \ personal use, one can download .exe of latest SE version corresponding to their\
    \ operating system from the download page. After installing, check that the PATH\
    \ variable points to the Java installation. Executing “java” from the terminal\
    \ window will display the version of Java installed on the.\n\n## Code Structure\n\
    \n![](img/19cb7751e839eebf53a5a37b4de40341_8_0.png)\n\nEvery Java code is saved\
    \ with the extension “.java”. Each Java program contains one or more classes.\
    \ Each of these classes contains one or more method definitions and each method\
    \ carries a few statements in it.\n\n## Syntax and meanings of keywords\n\n```java\n\
    import java.io.*;\npublic class MyFirstProgram {\n    public static void main(String[]\
    \ args) {\n        //This is my first java program\n        System.out.println(\"\
    \ Hello World!\");\n    }\n}\n```\n\n**import java.io.*;** - The keyword \"import\"\
    \ is used for including Java libraries called \"packages\" which contain pre-defined\
    \ functions that can be used in the program.\n\n**Public class MyFirstProgram**\
    \ - this is the class definition, the keyword \"public\" indicates that this class\
    \ is available to all and \"class\" denotes to a class.\n\n**MyFirstProgram**\
    \ – This is the name of a class. Name of the class having the main () function\
    \ should be the same as the file name.\n\nThe class definition is enclosed within\
    \ {}\n\n**Public static void main(String[] args):** This is the main part of the\
    \ program. Since main () is the driver function, it should always be \"public\"\
    .\n\n**Static:** You need to keep in mind that main() method should always be\
    \ \"static\" because it makes the program memory efficient.\n\n**Void:** This\
    \ is the return type of the method. This means that the main() method will not\
    \ return anything.\n\n**Main:** name of the method. The interpreter starts execution\
    \ from the main method only. Running a program means instructing the JVM to load\
    \ the .class file which was compiled from the source code and start executing\
    \ from the main method.\n\nThe two uses of the main method can be summarized as:\n\
    \n1. To test all the other methods of the program\n2. To start execution of the\
    \ program.\n\nString[] args : is the argument that is passed to the “main” method.\
    \ This method always takes an array of strings as its input parameter, and the\
    \ array name should always be “args”.\n\nNote that the data type starts with an\
    \ upper case “S\", this is because “Strings” is a class in Java and all class\
    \ names start with upper case.\n\nTo print a statement to standard output console,\
    \ “System.out.println(\"\");” is used. Note that all statements must end with\
    \ a semi-colon (;);\n\nYou can also use System.out.print () to display output,\
    \ the difference is that print does not introduce a new line at the end of each\
    \ statement it prints.\n\nThe other statement within the main() method in our\
    \ program is called a “comment” statement. These are not compiled, the purpose\
    \ of these statements which are preceded by // are only to give the programmer\
    \ more information about code.\n\nJava doesn’t have the concept of global variables\
    \ at all; the same is achieved using keywords such as “final\", “static\", “public\"\
    .\n\n## Using the Java library\n\nWhen working with Java, you can see that there\
    \ are a number of predefined classes present. All these classes can be used within\
    \ the Java program leaving the user the task of reinventing the wheel. But for\
    \ use of these classes, you should have some minimum knowledge of what you need\
    \ to use and where.\n"
