    \ 导论\n\nJavaScript 是一种基于对象的动态脚本语言。网景（Netscape）是该语言的开发者。该语言用于开发服务器应用程序和网页。它是世界上最广泛的脚本语言。\n\
    \nJava 和 JavaScript 唯一相似之处是它们的名字听起来相似。除此之外，这两种语言在功能和概念上完全不同。让 JavaScript 区别于 Java\
    \ 和 C++ 等面向对象编程语言的特点在于，它的对象可以在运行时创建或修改。为了实现这一点，可以在空对象中添加方法和属性。对象一旦创建，就可以像原型一样在创建其他相似对象的过程中使用。变量参数列表、源码恢复、动态脚本创建、动态对象创建函数变量等都是\
    \ JavaScript 拥有的动态能力。\n\n# JavaScript 基础\n\n# 在 JavaScript 中存储数据\n\n- 本地存储（Local\
