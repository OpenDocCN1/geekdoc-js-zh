    # The Number Object


    The number objects in JavaScript are used to represent numerical values. It can
    hold both integers and floating point values.


    Whenever encountered with numerical values, the web browser converts those values
    into the number class instances automatically.


    Syntax:


    The syntax for creating a number object is as follows:


    ```

    var value = new Number(number);

    ```


    # Number Methods


    The following are the methods that are consisted in the number object.


    | Method | Description |

    | --- | --- |

    | constructor() | This method is used to return the function that created the
    instance of the object. |

    | toExponential() | This methods results in the display of a standard range number
    in the exponential form. |

    | toLocale() | This method takes a number and returns a string version for the
    number. It is done in a format that varies with the locale settings of the browser.
    |

    | toPrecision() | This method defines the number of digits to be displayed in
    a given number. This includes the digits that are present on either side of the
    decimal. |

    | toString() | This method helps to convert a number into a string value. |'
  - '[PAGE 109]


    | valueOf() | This method represents the value of the number. |'
  - '[PAGE 110]


    # The Boolean Object


    The Boolean object is used to represent a value that can be either a ‘True’ value
    or a ‘False’ value.


    Syntax:


    A boolen object can be created using the following syntax:


    ```

    var bval = new Boolean(value);

    ```


    The Boolean object’s initial value is false if the value parameter holds any of
    the following values: empty string, null, 0, Nan, -0, null or undefined.


    Boolean Methods:


    The following are the methods that are consisted in the Boolean object.


    | Method | Description |

    | --- | --- |

    | Source() | This method is used to return a string which consists of the Boolean
    object’ source. An equivalent object can be created using that string. |

    | toString() | This method is used to return a ‘true’ string or a ‘false’string
    based on the object’s value. |

    | valueOf() | This method is used to return the Boolean object’s primitive value.
    |'
