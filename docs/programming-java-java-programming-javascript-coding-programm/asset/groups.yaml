    \n## 免责声明：\n\n请注意，本文档中包含的信息仅供教育和娱乐之用。我们已尽一切提供准确、最新、可靠且完整的信息。不提供任何形式的明示或暗示保证。读者承认作者并未提供法律、财务、医疗或专业建议。\n\
    \n通过阅读本文，读者同意在任何情况下，我们对因使用本文包含的信息而导致的任何直接或间接损失（包括但不限于错误、遗漏或不准确）概不负责。\n\n## Java\
    \ 简介\n\nJava —— 互联网时代最流行的编程语言之一，于1991年在太阳微系统公司（Sun Microsystems）构思并开发。任何编程语言的演进都是由计算生态系统发展产生的需求驱动的——Java也不例外。\n\
    \n虽然用 C 或 C++ 编写的代码（Java 的强大前身）也可以在所有设备上运行，但每次为了让它们在特定设备上运行而进行编译的工作是非常昂贵的。\n\n\
    Java 解决了这个问题，它只需获取文本源代码（.java）并编译为中间字节码（.class）文件，然后该文件可以由任何运行解释器的设备——Java 虚拟机（JVM）进行解释。字节码的概念意味着代码变得架构中性，只需要编译一次就可以在任何可以运行\
    \ JVM 的设备上解释。\n\n今天，Java 已经成为一种重要的编程语言，对于任何对编程感兴趣的人来说，了解 Java 的基础知识几乎已成为必修。本书正是为此目的而写的。我想帮助任何几乎或完全没有先编程经验的人轻松、有效地入门\
    \ Java 编程。\n\n## 第1章：入门\n\n### 安装\n\n在进行任何事情之前，我们需要准备好开发环境。初学者可以使用在线开发环境（https://ideone.com/）来执行小段代码，但如果要执行的代码是一个完整的程序，则必须在他们的系统中安装\
    \ Java 并设置自己的离线开发环境。Java 有三种类型——\n\n- 微型版 (J2ME)\n- 标准版 (J2SE)\n- 企业版 (J2EE)\n\
    \n对于个人使用，可以从下载页面下载与其操作系统对应的最新 SE 版本的 .exe 文件。安装后，检查 PATH 变量是否指向 Java 安装路径。在终端窗口中执行“java”将显示已安装的\
    \ Java 版本。\n\n## 代码结构\n\n![](img/19cb7751e839eebf53a5a37b4de40341_8_0.png)\n\n\
    每段 Java 代码都以“.java”扩展名保存。每个 Java 程序包含一个或多个类。这些类中的每一个包含一个或多个方法定义，每个方法内部包含几条语句。\n\
    \n## 关键字的语法和含义\n\n```java\nimport java.io.*;\npublic class MyFirstProgram {\n\
    \    public static void main(String[] args) {\n        //这里是我的第一个java程序\n    \
    \    System.out.println(\" Hello World!\");\n    }\n}\n```\n\n**import java.io.*;**\
    \ - 关键字 \"import\" 用于引入名为“包”的 Java 库，这些包包含了可以在程序使用的预定义函数。\n\n**Public class MyFirstProgram**\
    \ - 这是类的定义，关键字 \"public\" 表示该类对所有人可用，\"class\" 表示一个类。\n\n**MyFirstProgram** –\
    \ 这是类名。拥有 main () 函数的类类名应与文件名相同。\n\n类定义被封装在 {} 之中。\n\n**Public static void main(String[]\
    \ args):** 这是程序的主部分。由于 main () 是驱动函数，它应该是“public”（公共的）。\n\n**Static:** 你需要记住，main()\
    \ 方法始终应该是“static”（静态的），因为这可以提高程序的内存效率。\n\n**Void:** 这是方法的返回类型。这意味着 main() 方法不会返回任何内容。\n\
    \n**Main:** 方法名。解释器仅从 main 方法开始执行。运行一个程序意味着指示 JVM 加载从源代码编译的 .class 文件并从 main 方法开始执行。\n\
    \nmain 方法的两个用途可以总结为：\n\n1. 测试程序的所有其他方法\n2. 启动程序的执行\n\nString[] args : 是传递给“main”\
    \ 方法的参数。该方法始终接收一个字符串数组作为输入参数，数组名称应始终为“args”。\n\n注意数据类型以大写“S”开头，这是因为“Strings”是\
    \ Java 中的一个类，所有类名都以大写开头。\n\n要向标准输出控制台打印语句，使用“System.out.println(\"\");”。注意所有语句必须以分号（;)\
    \ 结束；\n\n你也可以使用 System.out.print () 显示输出，区别是 print 不会在打印的每条语句末尾引入新行。\n\n我们程序中\
    \ main() 方法内的另一条语句被称为“注释”语句。这些语句不会被编译，这些以 // 开头的语句的作用仅为程序员提供更多关于代码的信息。\n\n Java\
    \ 完全没有全局变量的概念；同样的功能通过 “final”, “static”, “public” 等关键字来实现。\n\n## 使用 Java 库\n\n\
    在处理 Java 时，你会发现存在许多预定义的类。所有这些类都可以在 Java 程序中使用，从而让用户无需造轮子。但为了使用这些类，你应该对需要使用什么以及在哪里使用有一定的最少知识。\n\
    \n"
