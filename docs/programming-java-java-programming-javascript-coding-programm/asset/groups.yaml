    Abstract classes and interfaces are similar to each other considering the following
    similarities.


    +   - One cannot instantiate the abstract classes or interfaces.

    - Both of them cannot have a mix of methods that are declared or without implementation.


    Abstract classes I love you to declare Final and static, lets you define public,
    private and protected concrete methods. But interfaces all fields will automatically
    be defined as public, final and a static. And all the methods you define will
    be public by default. And you cannot extend them beyond one class but can implement
    multiple interfaces to it.


    # Which one is a better option?


    You can consider going with abstract classes if any one of the following statements
    relate to your situation.


    +   - You are planning to share the code with other closely related classes.

    - If you think that the classes with which you extend your abstract class have
    a common fields or methods.

    - If you require access modifiers in private or protected.

    - If you wish to declare non final or non-static fields.


    You can use interfaces if any of the following statements apply to your required
    situation.


    +   - If you think that your interface will be implemented by unrelated classes.
    Eg. Comparable and cloneable.'
