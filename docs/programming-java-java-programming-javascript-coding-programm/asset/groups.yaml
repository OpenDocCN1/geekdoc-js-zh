    \ 15;\nif( age > 18 ) {\ndocument.write(\"Allowed inside the pub.\");\n}else{\n\
    document.write(\"Not allowed.\");\n}\n</script>\n```\n\nOUTPUT: Not allowed (if\
    \ number below 18)\n\nif...else if... statement: This is like an extension of\
    \ the if statement.\n\n**SYNTAX:**\n\n```javascript\nif(condition){statements};\n\
    ```\n\nelse if(condition) {statements}\n\nelse if(condition) {statements}\n\n\
    **EXAMPLE:**\n\n```javascript\n<script type=\"javascript\">\nvar book = \"JAVCRIPT\"\
