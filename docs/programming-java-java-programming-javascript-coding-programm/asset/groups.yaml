    \ statement.\n\n## Wrapper Classes\n\nAs we know, Java is an object oriented programming\
    \ language and everything in Java can be viewed as an object. Anything from simple\
    \ files, images, an address of a system, etc. can all be considered as objects\
    \ in Java. We may change the date of type of an object using the wrapper classes.\
    \ In this tutorial we will look into the wrapper classes and their details. Using\
    \ Wrapper classes, you can convert any given data type into an object.\n\nThe\
    \ primitive datatypes in Java are not objects. These primitive data types don't\
    \ belong to any class. These are defined in the Java language itself. We may encounter\
    \ situations where we will have to change these primitive data types into objects.\
    \ What example, you can add a data type to vector or a stack by converting it\
    \ into an object. The Java design introduced wrapper classes for making these\
    \ conversions.\n\n## About wrapper classes\n\nAs the name suggests, wrapper classes\
    \ enclose (wrap) around any data type to give it an appearance of an object and\
    \ it can be used whenever the data type is needed. This is a process that can\
    \ be reversed. Wrapper classes can not only change the data types into classes\
    \ but also un-wrap the object and return back the data type. This is just like\
    \ chocolate wrapper on the chocolate. The manufacturer wraps the chocolate in\
