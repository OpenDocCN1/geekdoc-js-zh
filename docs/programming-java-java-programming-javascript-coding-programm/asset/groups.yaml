    }\n```\n\nThe break statement is used to indicate that it is the end of the preceding\
    \ switch case.\n\n# Looping in JavaScript\n\n# The for Loop:The loops are used\
    \ if one wants the same code to be repeated again and again. The ‘for’ loop is\
