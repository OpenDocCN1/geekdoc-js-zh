    - 会话存储（Session Storage）：会话存储与本地存储不同，因为它只保留单个会话的数据，并在用户关闭页面后丢弃数据。这种存储用于用于订票等的网页。\n\
    \n# 使用变量数据和常量数据存储数据\n\n变量（Variables）和常量（Constants）存储 JavaScript 中使用的数据和值。它们在 JavaScript\
