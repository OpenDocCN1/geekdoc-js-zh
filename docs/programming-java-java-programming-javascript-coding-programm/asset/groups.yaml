    \n# > JAVA..\n\nJavaScript 与编码编程指南 - 一天学会！\n\n## 编程\n初学者 Java、JavaScript 编码 –\
    \ 一天学会\n\n第2版\n作者：Os Swift\n\n## 目录\n\n- Java 简介\n- 第1章：入门\n- 第2章：面向对象编程\n- 第3章：变量声明与数据类型\n\
