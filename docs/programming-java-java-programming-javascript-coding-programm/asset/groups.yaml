- md: "\nto find it. These are called as the Java APIs. The library is nothing but\
    \ a huge pile of predefined classes that can be used anywhere within the program.\
    \ They contain predefined code and all the user needs to know is how to use it.\
    \ These libraries believe the user from typing long lines of code. This is also\
    \ called as the Java standard code library. Within the Java platform, the Java\
    \ standard code library serves three main purposes. They are:\n\n- Just like other\
    \ library is the Java libraries facilitate the programmer with a set of useful\
    \ facilities. These facilities include regular expression processing, container\
    \ classes etc.\n- The standard code library provides the user with abstract interfaces\
    \ with which he can execute tasks independently. With this user need not write\
    \ the complete code for complex processes like file access and network access.\n\
    - There are a few underlying platforms that do not support all of the Java applications.\
    \ In such cases you can use the Java library to emulate those features or you\
    \ use it to provide a way by which you can check for specific features presence.\n\
    \n## Implementation and configuration of the Java standard code library.\n\nMost\
    \ of the code in the standard library is written in Java. The code, which is needed\
    \ for the direct access of the operating system or the hardware are exceptions.\
    \ The Java native wrapper are used in such cases for accessing the APIs of the\
    \ operating system. Almost all of the Java code libraries are stored in a single\
    \ archive called as the \"rt.jar\". This file is distributed by the JDK and the\
    \ JRE distributions. The Java class library can be found in the bootstrap class\
    \ path.\n\n## Main features of the Java class Library.\n\nWe use classes to access\
    \ the Java class features. These come under packages. Some of the main features\
    \ of the Java class library are given below.\n\n- java.lang has all the fundamental\
    \ interfaces and classes. They are closely tied to the runtime system and the\
