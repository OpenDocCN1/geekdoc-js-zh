    UNKNOWN Book\");\n}\n</script>\n```\n\n输出：JAVCRIPT book\n\n# 嵌套 if\n\n“嵌套 if”是指另一个\
    \ `if` 语句内部的 `if` 语句。\n\n```javascript\n语法: if(condition) {if(condition) }\n```\n\
    \n# switch 和 break 语句：\n\n在 `switch` 语句中将有一个表达式，后面跟着多个语句。这些语句将根据表达式的值执行。\n\n**语法：**\
    \ `switch (expression)`\n\n```javascript\n{\n  case condition 1\n    : statement(s)\n\
    \    break;\n  case condition 2: statement(s)\n    break;\n  .\n  ,\n  case condition\
    \ n: statement(s)\n    break;\n  default:\n    statement(s)\n}\n```\n\n`break`\
    \ 语句用于表示前面的 switch case 的结束。\n\n# JavaScript 中的循环\n\n# for 循环：当人们想要重复相同的代码时使用循环。`for`\
    \ 循环是可以使用的三循环之一。`for` 循环简单且紧凑。\n它包含以下三点：\n\n1. 初始化语句在循环开始之前执行。\n2. 只有当给定的条件为真时循环才会执行。但测试代码会运行一次代码。\n\
    3. 迭代计数器可以增加或减少。\n\n**语法：**\n\n```javascript\nfor (initialization; test condition;\
    \ iteration statement) {\n如果测试条件为真，则执行的语句(s)\n}\n```\n\n**示例：**\n\n```javascript\n\
    <script type=\"text/javascript\">\nvar count;\ndocument.write(\"This will repeat\
