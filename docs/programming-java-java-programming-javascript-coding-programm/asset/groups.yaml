    \ be used for decision-making. This will allow the program to choose the correct\
    \ path.\n\nThe following conditional statements are supported by JavaScript.\n\
    \n1. if statement\n2. if...else statement\n3. if...else if... statement\n\n**if\
    \ statement:** if the fundamental statement used to make decisions.\n\n**SYNTAX:**\
