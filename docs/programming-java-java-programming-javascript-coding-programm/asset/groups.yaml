  mdcn: "\n为了找到它。这些被称为 Java API。该库无非是一大堆预定义的类，它们可以在程序的任何地方使用。它们包含了预定义的代码，用户只需要知道如何使用它们即可。这些库让用户无需编写长代码。这也被称为\
    \ Java 标准代码库。在 Java 平台中，Java 标准代码库有三个主要用途。它们是：\n\n- 就像其他库一样，Java 库为程序员提供了一组实用的工具。这些工具包括正则表达式处理、容器类等。\n\
    - 标准代码库为用户提供了抽象接口，用户可以通过这些接口独立地执行任务。这样用户就不需要为文件访问和网络访问等复杂过程编写完整的代码。\n- 有些底层平台不支持所有的\
    \ Java 应用程序在这种情况下，你可以使用 Java 库来模拟这些功能，或者使用它来提供一种检查特定功能是否存在的方法。\n\n## Java 标准代码库的实现与配置\n\
    \n标准库中的大部分代码都是用 Java 编写的。直接访问操作系统或硬件的代码除外。在这种情况下，使用 Java 原生封装（native wrapper）来访问操作系统的\
    \ API。几乎所有的 Java 代码库都存储在一个名为 \"rt.jar\" 的单一归文件中。该文件由 JDK 和 JRE 分发。Java 类库可以在引导类路径（bootstrap\
    \ class path）中找到。\n\n## Java 类库的主要特征\n\n我们使用类来访问 Java 类特征。这些类属于包。下面是 Java 类库的一些主要特征：\n\
    \n- java.lang 包含了所有的基础接口和类。它们与运行时系统和语言紧密相关。\n- 有一个专门用于数学运算的包，包含了数学表达式、求值和任意精度小数。它们都存在于\
    \ java.math 库中。\n- 工具与集合：Java 为用户提供了内置的工具类和数据结构。这些工具类和数据结构可以用于数据压缩、日志、并发和正则表达式。\n\
    - 2D 图形和图形用户界面：用户可以使用 AWT 包，它提供了图形用户界面。该包绑定到原生系统。你可以用它来设计平台无关工具包和可插的外观与外观（feel\
    \ and look）。该包还可以用于处理可编辑和不可编辑的文本组件。\n- 声音：此包为用户提供了类和接口，用于声音数据的写入、读取、合成和排序。\n-\
    \ 文本：java.text 接口用于处理文本、数字、消息和日期。\n- 数据库：用户可以使用 java.SQL 库访问数据库 (sql)。\n- Java.Security\
    \ 提供了安全性以及加密服务。加密服务存在于 javax.crypto 库中。\n- Java 还允许你访问脚本引擎。你可以使用 javax.script\
    \ 包使用任何符合get脚本语言。\n- 小程序（Applets）：Java.applet 包允许你通过网络下载应用程序，并允许你在受保护的沙箱中运行它们。\n\
    \n## 第2 章：面向对象编程\n\nJava 的语法与 C 相似，但编程哲学源自 C++ —— 即 Java 是一门面向对象的语言。\n\n在我们看到的第一个示例中，我们有一个类声明，并说明\
    \ main() 函数负责程序中执行的操作，嗯，这并没有让 Java 变成 OOP 语言，让我们看一个例子来更好地理解 OOP —— 对象和类。\n\n##\
    \ 过程化方法\n\n这并不简单，因为之前的形状是确定的，动画代码可以假设一个中心点并旋转形状，而对于像变形虫这样不确定的形状，它无法使用其他形状的代码进行旋转，相反\
    \ API 需要更多的参数来定义形状应该旋转的坐标。\n\n## 面向对象方法\n\n所以你可以为每个形状编写一个类文件，这样在添加变形虫或修改旋转方法时，无需干扰现有代码，只需简单地添加新类即可。你只需要测试新类。引入的任何新问题都可以轻松追踪到所做的新更改。\n\
    \n示例 1：\n\n```\nclass Movie{\n    //变量声明\n    //方法\n    m1; // m1 是类型为 \"Movie\"\
    \ 的类对象\n```\n\n示例 2：\n\n```\nclass Movie{\n    //变量声明\n    //方法\n}\n```\n\n```\n\
    class TestMovie{\n    public static void main(String[] args){\n        Movie m1\
    \ = new Movie(); // m1 是类型为 \"Movie\"的对象\n        m1.variable = value;\n     \
    \   m1.method();\n    }\n}\n```\n\n## 第3 章：变量声明与数据类型\n\n下一个最重要且基础的概念是用于创建实用程序的“变量”和“数据类型”。变量本质上是命名的内存位置，用于存储值。Java\
    \ 是一门强类型语言，所以类型为“x”的变量只能持有类型为“x”的值。\n\n例如：\n\n```\nint n;\n```\n\n在这里声明了一个类型为“int”的变量“n”来持有\
    \ int 类型的值。声明变量类型是 Java 的一种“类型安全”特性，这反过来有助于“安全性”。\n\nJava 中的变量可以是以下一种：\n\n- 局部变量（基本数据类型，如\
    \ int, float, double, Boolean 等）\n- 引用变量（对象 – 用户定义的类实例）\n\n假设你声明了一个类型为 int 的变量，你可能可以使用它来保存一个短值。如果这样做，它将会溢出。\n\
    \n还要注意，Java 认为任何带有小数点的数字默认都是“double”，因此在给的小数后面附加“f”是重要的。\n\n```\nfloat f = 1.56f;\n\
    ```\n\n变量命名的规则：\n\n- 不要使用预留字作为变量名。\n- 变量名不能以数字开头。\n\n一些应该知道流行的 Java 关键字：\n\n|\
    \ abstract | assert | boolean | break | byte | case |\n| --- | --- | --- | ---\
    \ | --- | --- |\n| catch | char | class | const | continue | default |\n| do |\
    \ double | else | enum | extends | final |\n| finally | float | for | goto | if\
    \ | implements |\n| import | instanceof | int | interface | long | native |\n\
    | new | package | private | protected | public | return |\n| short | static |\
    \ strictfp | super | switch | synchronized |\n| this | throw | throws | transient\
    \ | try | void |\n| volatile | while | | | | |\n\n表 1-1 关键字\n\n## 字符串\n\nString\
    \ 被声明为一个类。字符串上常用的操作有：\n\n```\nString str = \"Hello World\"; //声明\nint len = str.length();\
    \ // 获取字符串的长度\nint len = \"hello Wolrd\".length(); // 也获取字符串的长度\nString concatStr\
    \ = \"hello\"+'+world\"; // + 运算符可以重载以执行两个字符串的拼接\nString str1 = \"Heloo\";\nString\
    \ str2 = \"World\";\nif (str1 == str2) //比较两个字符串\nSystem.out.println(\"strings\
    \ are equal\");\n```\n\n## 引用变量\n\nMovie m1 = new Movie() 左侧是声明，指示 JVM 为引用变量留出空间，该变量持有到达实际对象的数据。\n\
    \n```\nint[] n; // 声明一个整数数组\nn = new int[5]; // 创建一个包含5个整数的数组\n```\n\n注意，即使是基本数据类型值的数组，数组也是一个对象。\n\
    \nMovie[] myArray; // 声明类型为 “Movie” 的对象数组\n\n大小：引用变量没有像基本类型那样的预定义大小。\n\n## equals\
    \ 操作我们知道 == 和 != 等比较运算符可以用基本类型使用，但为了对对象执行比较操作，不能使用默认运算符，相反 Java 提供了关键字 “equals”。\n"
