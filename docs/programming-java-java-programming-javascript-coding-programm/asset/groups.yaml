    \n例如：`var Dell;`\n\n上面的对象 `Dell` 被声明为一个变量。\n\n# 声明常量\n\n在名称前使用关键字 `const` 使成为常量。这种声明与声明常量一样。\n\
    \n例如：`const Book;`\n\n在上面的示例中，`Book` 被制为常量。\n\n# JavaScript 中的决策\n\n总是会出现我们必须在面前的两个路径中选择一个的情况。这时我们能够实现像\
    \ `if` 和 `else` 这样的条件语句。\n\n`if` 和 `else` 语句用于决策。这将允许程序选择正确的路径。\n\nJavaScript\
    \ 支持以下条件语句。\n\n1. if 语句\n2. if...else 语句\n3. if...else if... 语句\n\n**if 语句：**\
    \ 用于做出决策的基础语句。\n\n**语法：** `if(condition)`\n\n**示例：**\n\n```javascript\n<script\
    \ type=\"javascript\">\nvar age = 20;\nif( age > 18 ) {\ndocument.write(\"Allowed\
