  md: '# Form Validation


    After the client enters the required information and clicks the submit button,
    form validation occurs. The server must send all the data again to the user and
    request the user to resubmit the form with correct or valid information. This
    occurs, if the user fails to enter all of the required information or if he enters
    invalid data.


    Before sending the form to the web browser, JavaScript facilitates the validation
    of the form''s data on the client''s computer itself.

    Two functions will be generally performed by the form validation.


    +   * **Basic Validation** - To ensure that the data has been provided into every
    mandatory field, first the form needs to be checked. To check the data, it needs
    to loop through each field.

    * **Validation of the Data Format** –This is to check if correct or valid data
    has been entered in the form.'
