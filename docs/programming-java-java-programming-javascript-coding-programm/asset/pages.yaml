    page. This kind of storage is used on web pages used for booking tickets etc.


    # Storing Data using Variable Data and Constant Data


    The Variables and Constants store the data and values used in JavaScript. They
    both have their own importance in JavaScript. All the data stored cannot be made
    constant. Processes like time countdown use the variables and the Constants are
    used for non-changing data.


    Variable Data: As the name suggests, this type of data that changes its value
    over time is called the Variable Data. This type of data is widely used in JavaScript.
    Variables are dynamic in nature.


    Constant Data: The Constant data is something that never changes its value. This
    data will be constant through time. This type of data is static. We use this type
    of data for data which is which cannot be modified.'
