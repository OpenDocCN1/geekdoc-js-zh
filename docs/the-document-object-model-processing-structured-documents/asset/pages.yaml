  md: '# The Document Object Model: Processing Structured Documents


    Part I introduced the concepts of the DOM and discussed the basic interfaces of
    the API. In Part II, we focused mostly on DOM theory and examples to illustrate
    concepts. In Part III, starting here with Chapter 8, we''re going to concentrate
    on examples of practical uses of the DOM that you can put to work in your applications
    to make them more usable, dynamically engaging with the user, and process efficient.
    We''ll be taking a look at future directions of the DOM and what you can expect
    to see as the DOM matures and evolves.


    In this chapter, we will look at practical ways to use the DOM to make your documents
    and the information that they present more usable and easier to navigate. In particular,
    we''ll examine different ways of using the DOM to improve the presentation and
    navigability of the document''s structure and information. We''ll begin by looking
    at how you can provide a user with a list of interesting places in the document
    that you can link to immediately. Next, we''ll look at how your documents can
    automatically build tables of contents for the user that correspond to the document''s
    sections. Finally, we''ll build an example that allows users to mark their current
    place in the document so they can read another section and easily find their previous
    place in the page.


    > NOTE

    This chapter is not intended to serve as an official design reference or tutorial
    for creating usable websites in accordance with W3 or other accepted standards.
    There are plenty of good resources available on the Web you can refer to for this
    information. The purpose here is to illustrate how the DOM can be used to achieve
    certain practical design objectives. For more information on creating accessible
    web pages, refer to the W3C''s Web Accessibility Initiative at www.w3.org/WAI/.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_229_0.png)


    # Using the DOM to Provide Better Document Navigation


    Documents presented on the Web in a modern, DOM-capable browser have the distinct
    advantage of being live—that is, they are more than just static words printed
    on a piece of paper, as in this book. Because the content and structure of the
    information in a web page can be discovered by a DOM application on-the-fly, the
    developer can take advantage of some unique abilities of the browser to improve
    the way this information is displayed and consumed by the viewer.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Chapter 8: Providing Automatic Document Navigation 207


    For example, long documents (such as the W3C DOM specification itself) can be
    difficult to read or comprehend because there is too much information presented
    right up front. Navigating documents of this size becomes a challenge in itself
    because users often scroll through documents and read information in a nonlinear,
    random-access fashion. Using the DOM, your documents can automatically adapt to
    their content making themselves easier to navigate. This is accomplished by reading
    the structure of the content and modifying the page in the browser to provide
    user-interface elements allows users to quickly keep track of where they are in
    a document.


    Another good feature is enabling the user to keep track of where they are in a
    document by placing a temporary “marker” at a certain point in the document; they
    can then use this marker to find the same location later. For instance, if a user
    is reading a lengthy page and wants to refer to some particular information earlier
    or later in the document, they can just click the paragraph they are reading to
    mark with a visual indicator. They can scroll through the document and easily
    return to that section by looking for the marker.


    Let’s begin by taking a look at how the DOM can be used to improve the way a user
    jumps to specific information in a document.


    # Example: On-the-Fly Bookmarks


    One example of using the DOM to make a document to navigate is by providing a
    list of bookmarks that is generated on-the-fly for a particular page. This is
    especially useful if the page contains locations that you want to expose as bookmark
    destinations that don’t necessarily correspond exactly to locations in the document
    (such as <H1> tags, images, and so on). In this example, the DOM is used to dynamically
    create a list of virtual bookmarks or places of interest that the user can select
    from a standard <SELECT> list and automatically jump to. Figure 8-1 shows the
    bookmark list in the page seen in Internet Explorer 6.


    Each bookmark entry is created from a specially marked <span> tag that has a bookmark
    attribute on it. The content of the bookmark attribute becomes the text displayed
    in the <SELECT> list. For example, a bookmark named Hotels in the list would be
    indicated in the document source


    ```

    <SPAN bookmark="Hotels">Hotels Section</span>

    ```


    Listing 8-1 shows the code that is used to generate the bookmark list. This code
    is stored in a separate file named Bookmarks.js and is included in the target
    web page using a <SCRIPT> tag with a SRC attribute, like this:


    ```

    <SCRIPT SRC="Bookmarks.js"></SCRIPT>

    ```'
