    # Tracing Your Steps with TraceConsole


    Although using the ASSERT () function will find errors in programming logic by
    exposing illegal conditions in the code, sometimes bugs take on more insidious
    forms that cannot be detected or caught by an ASSERT () statement. To find these
    bugs, you need a slightly more advanced debugging tool.


    The TraceConsole is a utility for browser-based JavaScript DOM developers that
    displays a program’s variables and other interesting objects as they change while
    the application is running. It essentially provides a record of program execution
    that can be examined after the program has run to pinpoint logic errors in the
    code. Figure 7-2 shows a screenshot of the TraceConsole.


    Almost every JavaScript developer has used the alert() function at some point
    in their debugging process; it''s almost a passage as every web developer. The
    basic premise is that at some point in your application, you need to verify that
    a certain variable contains a certain value, or that array contains the right
    data. The main problem with alert() is that it is not very flexible. First, you
    have to deal with a pop-up window every time the alert() is called, which can
    make using alert() inside loops very impractical. Second, the amount of data that
    can be reasonably displayed inside an alert() window is pretty small. Once you
    start getting more than a half dozen or so lines of output, the readability of
    the information rapidly diminishes. Third, the information displayed by alert()
    is fleeting. Once you dismiss the dialog box, that information is gone (unless
    you’ve manually written down, which can become a huge pain).


    Enter the TraceConsole. Think of TraceConsole as alert() on steroids: instead
    of constantly bugging you with pop-up windows that must be manually dismissed
    before the execution of the code can continue in the browser, the data that would
    normally be displayed by the alert() function is routed to a separate window'
