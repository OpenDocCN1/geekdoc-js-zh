  md: '# 320 The Document Object Model: Processing Structured Documents


    would refer to all the section elements in the document, as long as they are grandchildren
    of the book node, though they do not have to be children of a chapter element.
    In this case, all of the section elements in our example document would be returned
    as a result, both in the chapter elements and the appendix element.


    XPath can also be used to take the values of attributes into account when evaluating
    the path expression. For example, to chapter elements that have a particular title,
    you can use a LocationPath expression such as


    ```

    book/chapter[@name="Chapter 1"]

    ```


    Using the @ character indicates the name of an attribute of the given element.
    The preceding example retrieves the chapter elements that have a name attribute
    value is Chapter 1.


    XPath provides a core set of functions that can be used when selecting nodes in
    a document. For example, the following XPath expression uses the position() function
    to select the first child node of the book node:


    ```

    book/chapter[position()]=1

    ```


    Of course, the XPath language supports far more than can be shown here in just
    a simple introduction. In addition to regular path selectors and functions, XPath
    supports comparison operators, branching, and filters. XPath is a very flexible
    way of working with nodes in a document, and it can often be more convenient to
    address nodes in a document using XPath than writing the corresponding application
    logic using standard DOM methods. This helps explain its growing popularity in
    real-world DOM implementations.


    # XPath Support in DOM Level 3


    The DOM Module specifies six interfaces for working with XPath expressions within
    DOM documents. Table 11-3 lists the interfaces and their purpose.


    The main interfaces used in evaluating XPath expressions are the XPathEvaluator,
    XPath, and XPathResult. To evaluate a DOM expression relative to a given node,
    applications use the XPathEvaluator interface to create a parsed and compiled
    Expression by calling createExpression() or by calling the evaluate() method directly
    to evaluate an expression contained within a DOMString. According to the DOM spec,
    the XPathEvaluator interface is expected to be available on the same object that
    provides the Document interface for a given implementation. The result of the
    expression is returned as an XPathResult.'
