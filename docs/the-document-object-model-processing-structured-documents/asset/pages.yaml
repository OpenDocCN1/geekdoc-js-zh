    # XSLT in Other Applications


    Among standalone implementations, Apache’s Xalan package is a free, open-source
    implementation of the XSLT specification, and it includes its own copy of the
    Xerces parser for manipulating XML documents. It also includes its support for
    using XSLT on Xerces DOM structures and an XPath implementation used for selecting
    nodes to transform in the source document. Microsoft’s MSXML4 parser also supports
    XSLT transformations.


    There are also XSLT author applications that support XSLT development, such as
    Xelerator, XMLSpy from Altova, Inc.; and XMetal from SoftQuad. All of these applications
    are available in downloadable demonstration from their respective company’s web
    site.


    # Transaction-Oriented Processing


    Transaction-based processing is a term used to describe a type of processing where
    several small actions can be grouped to form a single large, logical action. For
    example, consider the common task of doing a search-replace operation on a document
    in a word processor. When performing one search-and-replace operation at a time,
    each change to the document can be considered an individual action. If you were
    to stop making replacements and start using the application’s “undo” command,
    each change you had made to the document would be individually undone.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Chapter 11: Future Directions for the DOM 333


    However, if you were to use the “change all” function, in which the program automatically
    searches the entire document and replaces all of the matches that it finds, each
    one of those changes would no longer be considered individual change. If you were
    to use the undo “change all” command, all of the individual changes that were
    made to the document’s content would be undone all at once. In this case, all
    of the singular would be grouped together into one transaction.


    Another benefit of transactions is they lock out changes while the underlying
    data is being modified. An application allows concurrent processes access to a
    shared piece of data, such as a document, and each of those processes tries to
    modify the document at the same time, the results can become chaotic unless some
    type of control mechanism is employed. Transactions can prevent this from happening
    by ensuring that only one pending transaction can be active at any time.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_356_0.png)


    > NOTE

    The Level 3 DOM does not yet adhere transactions, although it is an idea that
    might find its way into future versions of the specification.


    Though it is beyond the scope of this section to provide an in-depth discussion
    of how transactions work and all their nuances, it is worth a brief exploration
    to see how transactions might be applied in the DOM.


    # Wrapping a Series of Edits as a Transaction


    To create a single transaction, it is necessary to indicate the beginning and
    end of the range of edits that will comprise the transaction. This can be done
    in several ways, but one way is to use explicit function calls to wrap each transaction.
    The following JavaScript pseudocode illustrates one of what this might look like:


    ```

    DOMImplementation impl = document.implementation;

    DOMTransaction tID = impl.beginTransaction();

    // perform some edits to the document

    var text = document.createTextNode("Some Text");

    document.documentElement.appendChild(text);

    // end the transaction

    impl.endTransaction(tID);

    ```


    This code explicitly wraps the beginning and ending of a transaction with calls
    to two made-up functions called beginTransaction() and endTransaction().'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# The Document Object Model: Processing Structured Documents


    The beginTransaction() call can also return an identifier token that can be used
    to identify the transaction.


    In addition, it may be useful for an application to be able to discover whether
    a transaction is currently taking place. This can be accomplished by calling a
    method like isInsideTransaction(), which would return the identifier of the current
    transaction ID or -1 if no transaction is underway.


    ```

    var tID = impl.isInsideTransaction();

    ```


    # Rolling Back a Transaction


    One of the nice about transactions is that once completed, they can be recorded
    and "rolled back," or undone on an individual basis. For example, an application
    can keep a list of completed transactions on a document and expose this to the
    user when implementing a "multiple undo" feature, or a history-like list of past
    operations that show all of the operations on a document. To roll a transaction
    back, the developer might use a function like rollBackTransaction(), which returns
    true if the transaction was able to be rolled back:


    ```

    var bResult = rollBackTransaction(tID);

    ```


    # Conclusion


    In this chapter, we examined the changes proposed in the latest working drafts
    of the DOM Level 3 modules and investigated some other trends and technologies
    that are affecting the development of the DOM, though they are not yet part of
    the official standard.


    We started off by examining the latest changes in DOM Level 3, beginning with
    the additions and changes to the existing interfaces. We looked at the new data
    types and methods added to the DOM to support such concepts as testing nodes for
    sameness and equality, extracting text content from nodes, attaching application-specific
    data to document nodes, and determining the positions of nodes in the document
    tree relative to other nodes.


    Next, we investigated some entirely new interfaces for the latest specification
    to support document loading and saving, error handling, working with and editing
    DTDs and other abstract schemas, and working with XPath expressions—all very useful
    functionality that has been noticeably absent from prior DOM levels.'
  merge: -1
