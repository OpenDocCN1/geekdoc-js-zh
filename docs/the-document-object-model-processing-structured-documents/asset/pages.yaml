  md: '# The Document Object Model: Processing Structured Documents


    DOM had its beginnings in the web browser, going back to Netscape 2 and Internet
    Explorer 3. In those days, the DOM was not an official specification, and the
    various browser vendors added functionality to browsers to fix their needs using
    their own proprietary interfaces. This, of course, made it very difficult to create
    web pages that would work across multiple browsers, which was supposed to be one
    of the main selling points of the Web.


    The situation has (thankfully) changed rather since then. The latest generation
    of browsers (6) from Microsoft, Netscape, and Opera Software incorporates the
    most complete support for the W3C DOM standards available to date. Although still
    not perfect, it is now much easier to create web pages that will work in multiple
    browsers than it was a couple of years ago. In this chapter, we review the DOM
    support of the latest releases of the major web browsers, take a look at some
    examples of browser-based DOM usage, and discuss some of its quirks and special
    features as they relate to the DOM.


    # DOM Support in the Major Browsers


    Perhaps the most logical place to start examining the DOM''s real-world support
    is today''s major web browsers. With Netscape 2 and Internet Explorer 3''s initial
    implementations of the JavaScript programming languages, web authors could give
    their pages some added interactivity. Developers could dynamically change the
    contents of documents, case an image to a new source URL, check the contents of
    forms, and more, all by writing some simple script code and tweaking the right
    properties of an HTML tag or two. Later browser versions allowed layers to be
    moved around without the screen, providing some animation effects. This was powerful,
    heady stuff at the time, though it was certainly limited. Not all of the properties
    of a given page could be manipulated, and some browsers offered more control than
    others (sometimes they come from the same vendor!). Even if you could technically
    accomplish everything you needed to, very often you had to write special-case
    code all over the place to handle the inevitable differences between the various
    browsers that visit the page.


    Today''s browsers have come a long way since. Using the DOM API, it is now possible
    to dynamically change the appearance of almost any part of a web page, from the
    style sheets to the actual structure and content of the page itself. In addition,
    because the DOM provides a standard set of interfaces for doing so, the need for
    special case code is often greatly reduced (though not yet eliminated). This allows
    for the building of more complex, engaging user interfaces,'
  merge: -1
