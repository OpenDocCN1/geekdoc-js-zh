    \nMost browsers will let you retrieve the content of an attribute by referring\
    \ to the attribute's name as a property of a tag (that is, document.title or image.src).\
    \ using the getAttribute() method is more flexible and more likely to work across\
    \ multiple DOM implementations, not just web browsers. In addition, some browsers\
    \ may not properly register custom-defined attributes as properties of a node,\
    \ so this notation may not work in those circumstances. To be safe, portable,\
    \ and in tune with the specification, always use getAttribute().\n\n# Creating\
    \ and Modifying Page Elements\n\nCreating and modifying document elements in a\
    \ web browser dynamically is relatively straightforward through the DOM. Once\
    \ you have obtained a reference to the node or list of nodes that you want to\
