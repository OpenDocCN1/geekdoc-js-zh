    This is important: the DOM was designed to be extensible from the beginning, and
    the decision was made that application vendors could add their own interfaces
    to a particular implementation without breaking conformance to the spec. This
    allows the freedom and flexibility to add convenient, differentiating features
    to their DOM implementations.


