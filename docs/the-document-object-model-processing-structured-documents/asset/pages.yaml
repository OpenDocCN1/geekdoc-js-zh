    XPath provides a way of describing the location of each node or a set of nodes
    using a path-like syntax. Technically, these are called “expressions,” which,
    when evaluated, represent a node set, a boolean value, a number, or a string.
    One of the most important types of expressions is called the LocationPath, which
    is the syntax used to describe a node’s location in relation to another node.
    Because XML documents are organized as hierarchical tree structures, much like
    the directories on a computer’s file system, you can think of LocationPaths the
    same way you would think of a directory path to a file on a computer system. For
    example, as a directory path can be absolute, starting from the very top of the
    hard drive, an XPath expression can start from the root of the document tree.
    On a computer system, directory paths can also be evaluated as “relative” paths—that
    is, relative to the current “working directory” on the computer. Likewise, XPath
    expressions are also evaluated relative to what is called the “context node” in
    the XML document.


    There is a major difference between directory paths and XPaths, however. In a
    computer’s file system, all of the files in a particular directory may have unique
    names. This is not the case in XML, where the child nodes of a given node may
    all have the same name—witness the book example just shown, where the book node
    has several chapter nodes. As a result, XPath must be able to represent not just
    one node path, but multiple nodes. In this sense, XPath expressions can be thought
    of as patterns in addition to regular paths.


    A basic XPathLocation describes a path through the XML hierarchy and uses forward-slash
    characters to separate the names of the elements. So, to refer to the chapter
    elements in our book example, the following path could be used:


    ```

    book/chapter

    ```


    Note that this LocationPath matches *all* of the chapter elements in the book,
    not the first one that it encounters. In addition to specifying actual element
    names within the path expression, XPath allows wildcard characters such as the
    * to be used in place of element names. So, a LocationPath specified as


    ```

    book/*/section

    ```'
