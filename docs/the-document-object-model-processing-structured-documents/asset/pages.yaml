    # Macromedia Dreamweaver


    Macromedia''s Dreamweaver application is a popular HTML authoring tool that exposes
    a DOM interface to its documents. Developers can create extensions to Dreamweaver
    using the familiar HTML and JavaScript languages, and these extensions have full
    access to the documents open in the application as well as in persistent storage.
    In this section, we''ll examine Dreamweaver''s support for the DOM and take a
    look at how Dreamweaver differs in its support from browsers such as Netscape
    Navigator and Internet Explorer.


    # Where to Get Dreamweaver


    Dreamweaver is available directly from Macromedia as well as third-party software
    resellers. A trial version is also downloadable from the Macromedia website (macromedia.com/software/dreamweaver/),
    which will last for 30 days. This version is fully functional, and you can try
    the examples in this chapter in the trial version.


    # The DOM in Dreamweaver


    Dreamweaver supports a limited subset of DOM Level 1, along with the Internet
    Explorer attributes innerHTML and outerHTML. Table 6-2 lists the DOM methods and
    properties supported by Dreamweaver.'
