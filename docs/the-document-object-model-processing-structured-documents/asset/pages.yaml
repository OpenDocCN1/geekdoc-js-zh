    # Conclusion


    In this chapter, you saw several ways of using the DOM to make web pages more
    usable and approachable by dynamically adapting to the content contained within
    the page. First, you saw how a document can build a list of bookmarks on-the-fly
    by searching the content for specially marked tags that indicate where bookmark
    destinations should be. Next, you saw how to automatically generate a table of
