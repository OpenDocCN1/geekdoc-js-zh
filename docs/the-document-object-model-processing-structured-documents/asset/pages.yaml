  md: '# The Document Object Model: Processing Structured Documents


    In Chapters 8 and 9, we show how to use the DOM to improve the usability of web
    pages and create more engaging user interfaces than were possible with earlier,
    HTML-based scripts. Creating these types of interfaces is made possible mainly
    because the DOM provides two important capabilities: the ability to access and
    modify any part of the document, and the ability to create entirely new elements
    in the document.


    In this chapter, we will examine how to use DOM capabilities, along with some
    browser JavaScript code to provide rich, client-side data processing functionality
    to users of your applications. We''ll start by looking at a simple example of
    sorting a list of items and continue with a more advanced demonstration of sorting
    any type in a web page. Next, you''ll see how to use the DOM to perform what''s
    commonly known as “screen-scraping,” in which a server-generated document to provide
    additional data presentation to the end user. For example, some pages are generated
    by server-side ASP or JSP scripts, and though their exact contents cannot be known
    at design time, your scripts can discover the data contained within the page and
    perform additional processing on it. Finally, we''ll look at how to embed XML
    data in a web page and use the DOM to create an advanced data-presentation application.


    # Processing Data-Driven Documents on the Client


    By using the DOM to process data directly in the client, your applications can
    help relieve the workload on the server and provide the user with a much more
    responsive application. The client will not need to hit the server each time the
    user wants to manipulate the information in the page, so the round-trip time from
    the server is eliminated, and data manipulation that would normally be on the
    server can be performed locally.


    For example, using the DOM, it is entirely possible to provide advanced features
    such as client-side data sorting, dynamic HTML generation, and advanced data analysis
    in your web pages. Along with some JavaScript code, your DOM applications can
    sort tables and lists, perform complex calculations, and even derive new data,
    all completely on the client. These capabilities become even more powerful when
    you'
