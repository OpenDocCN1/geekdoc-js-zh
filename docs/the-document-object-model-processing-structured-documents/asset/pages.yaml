    # Determining Relative Document Positions of Nodes


    One of the new features that DOM Level 3 will allow applications to take advantage
    of is the concept of a node’s “tree position” relative to other nodes in the document.
    In Chapter 4 we discussed the concept of document order—that is, the order in
    which nodes appear in the document when they are parsed. The Level 3 DOM API provides
    a new method on the Node interface compareTreePosition(), which takes a node as
    an argument. The return value of the function is in the document tree of the given
    node relative to the node that this method called (also referred to as the “reference”
    node). The possible return values from compareTreePosition() are:


    | Return Value | Meaning |

    |---|---|

    | TREE_POSITION_ANCESTOR | The given node is an ancestor of the reference node.
    |

    | TREE_POSITION_DESCENDANT | The given node is a descendant of the reference node.
    |

    | TREE_POSITION_DISCONNECTED | The two nodes do not have a relationship to each
    other. This occurs when the two nodes are in separate documents. |

    | TREE_POSITION_EQUIVALENT | The two nodes have an equivalent position. This is
    the case when comparing two attribute nodes that are on the same element. |

    | TREE_POSITION_FOLLOWING | The given node follows the reference node in the document.
    |

    | TREE_POSITION_PRECEDING | The given node comes before the reference node in
    the document. |

    | TREE_POSITION_SAME_NODE | The two nodes are the same. When two nodes are the
    same, they also have an equivalent position. |


    As an example, consider the document tree in Figure 11-2.'
