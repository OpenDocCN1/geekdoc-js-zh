    # Obtaining a List of Nodes Using getElementsByTagName()


    Recall from Chapter 2 that the getElementsByTagName() method returns a NodeList
    containing the nodes that match the given tag name. For example, the following
    code snippet will obtain a reference to the <BODY> tag:


    ```

    var oBody = document.getElementsByTagName("BODY").item(0);

    ```'
