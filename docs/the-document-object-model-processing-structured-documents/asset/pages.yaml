  md: '# The Document Object Model: Processing Structured Documents


    So far in Part II, we''ve examined DOM algorithms that you can use to perform
    operations that are common document processing applications, and we''ve taken
    a look at the extent of DOM support available in today''s browsers and other applications.
    In this section, we''ll examine some debugging strategies and useful code that
    you can use in your own DOM programs to make them as robust and stable as possible.


    # Importance of Good Debugging Skills


    It probably comes as no surprise that at some point during the development of
    your killer DOM application, you''re going to have to debug your code. It''s just
    a fact of programming life: even the best programmers among us run into trouble
    from time to when writing applications and tools to iron out the kinks. Indeed,
    sometimes debugging a problematic program can take as long as (or even longer)
    than writing the code itself. The art of debugging is perhaps one of the most
    important yet neglected skills that programmers need to develop. The reason for
    this is really quite simple: getting rid of bugs as quickly as possible translates
    directly into earlier dates.


    Unfortunately, if you''re a JavaScript developer, you''ve got it tough when it
    comes to debugging. Most browsers and other applications that use JavaScript today
    don''t have a good debugger built in, and even those that do sometimes can''t
    catch certain types of problems or have debuggers that are “loosely typed” language
    and thus is compounded by the fact that JavaScript is not force developers to
    explicitly declare what types of data their variables will contain.


    > NOTE

    Things will get a little better for JavaScript developers with the release of
    Mozilla 1.0, the open-source browser from mozilla.org, that will include tools
    such as a DOM Inspector for examining DOM structures and Vennman, a full-featured
    JavaScript debugger. For more information, visit mozilla.org. In addition, Microsoft
    is shipping a new version of its script debugger in Internet Explorer 6.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_193_0.png)


    Java and C++ developers have it much better—their development environments usually
    come with superb debuggers—but there''s still more that can be done to help the
    DOM application writer debug code and catch problems before they come up in production.'
