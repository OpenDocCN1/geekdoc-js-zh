  md: '# The Document Object Model: Processing Structured Documents


    Currently, there are two official DOM levels: Level 1 and Level 2. Each of these
    levels are W3C Recommendations. The latest level, Level 3, is in working draft
    form, meaning it has not yet been adopted by the W3C as a formal recommendation.
    A fourth level, informally referred to as Level 0, is not an official DOM specification
    or working draft; it refers to the DOM implementations that were provided by early
    web browsers as Netscape and Internet Explorer 3 before the DOM Working Group
    was formed. These levels have evolved over time, based upon input from the general
    public, as well as the DOM member companies.


    Each level is typically divided into two or more modules. The Core module, which
    specifies the core methods needed for working structured documents and objects.
    The remaining modules focus on more specific features of that particular level.
    DOM applications may conform to a particular DOM level, or to a specific module
    within a DOM level. For example, Level 1 of the DOM supports only two modules:
    XML and HTML. Level 2 increases this support to more than 14 different modules.


    > NOTE

    When discussing the DOM or a particular implementation of the DOM, the term conformance
    will often pop up. This term is used to describe how a particular level or module
    of the DOM is supported by an implementation. In general, an implementation is
    said to be conform to a DOM level if it supports the methods defined in the Core
    section of that level. DOM implementations may conform to a level of the DOM or
    even to a particular module within that level.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_33_0.png)


    # Level 1


    DOM 1 was adopted as a W3C Recommendation in October of 1998 (a second edition
    working draft was published in September of 2000). It is divided into two modules:
    Core and HTML. The Core module provides a basic set of methods for accessing and
    manipulating document objects in any structured document, along with a set of
    extended interfaces for working with XML content. The HTML module provides higher-level
    interfaces that are used along with those in the Core module for working with
    HTML documents, though the Core interfaces are usually enough for working with
    both XML and HTML content.


    These two modules provide sufficient functionality for working with parsed XML
    and HTML documents inside of products that use only the API and for populating
    a skeleton object using saving/loading to it and from persistent storage are left
    as application-specific operations.'
