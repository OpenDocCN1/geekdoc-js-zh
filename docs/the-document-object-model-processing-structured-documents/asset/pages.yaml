    # Where to Get More Information About Xerces


    The Xerces website is a good source for information, providing quality documentation
    along with a maintained FAQ and several good example projects to use starting
    points for your projects. In addition, the Xerces parser is supported by a community
    of knowledgeable developers on xerces-c-dev and xerces-j-dev mailing lists who
    are always willing to help new developers. Before posting a question to the mailing
    list, however, make sure you read the FAQ—many of the most commonly asked questions
    are already answered there, and it will save you a lot of time (and embarrassment)
    if you can find an answer to your question first.


    # The Microsoft MSXML Parser


    The MSXML parser is Microsoft''s implementation of the Core DOM Level 1 interfaces,
    along with a collection of Microsoft-specific extension APIs. MSXML version 4
    also provides support for XML Schema (XSD), XPath 1.0, the SAX2 API (an alternative
    to DOM processing), and XSLT 1.0.


    # Where to Get MSXML4


    You can download MSXML4 from the Microsoft Developer Network website at http://msdn.microsoft.com.
    Go to MSDN Downloads | Web Development | XML Web Services, and you will find installers
    for the current version of MSXML in a variety of languages, along with the redistributable
    files necessary to include with your application so it can use the MSXML library.


    # Installing MSXML4


    MSXML4 is installed on the user''s computer, it is installed in what Microsoft
    calls side-by-side mode, in which any previous existing version of MSXML is left
    untouched. This prevents introduction of incompatibilities with previous versions;
    different versions of the Microsoft Windows operating system and Microsoft Internet
    Explorer are released with different versions of MSXML.'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Chapter 6: Applications 153


    The MSXML4 SDK installation creates an MSXML4.0 directory on the computer''s hard
    drive containing three directories: doc, inc, and lib. The doc directory contains
    the MSXML4 SDK documentation in a standard WinHelp file. The inc folder contains
    the MSXML header files that contain the necessary DOM definitions, and the lib
    folder contains the import library that your application must link to in order
    to use the MSXML4 DLL.


    # Getting to Know the API


    The MSXML API prefixes the DOM class names with IXMLDOM. Thus, the Document interface
    becomes IXMLDOMDocument, Element becomes IXMLDOMElement, and most of the names
    are direct matches, with a few exceptions (for example, the MSXML parser names
    use the Attr interface IXMLDOMAttribute).


    Using the MSXML DOM interfaces is relatively straightforward, assuming that you
    are familiar with the things you need to do with COM interfaces, such as using
    VARIANT data types, checking HRESULT return values from functions, and using BSTRs
    of regular strings.


    The documentation provided with the MSXML SDK is fairly complete and well documented,
    although a little light on sample snippets. This is compounded by the unfortunate
    fact that, unlike the Xerces distribution, the MSXML SDK installer does not install
    any example code to learn from. It takes some searching, but it is possible to
    find some sample code on the MSDN site under the Web and Internet default.asp.
    There is a separate section under XXML for downloading MSXML-related sample code,
    whether you are using C++, Visual Basic, ASP, .NET, or JavaScript.


    This section, like the Xerces preceding it, will focus on C++, although the concepts
    illustrated here are easily portable across other language implementations.


    # Using MSXML4


    To use MSXML4, your application needs to initialize the COM interfaces for the
    application''s thread, obtain the appropriate MSXML interfaces, and call the desired
    DOM methods. In this section, we will examine how some common DOM operations are
    performed using the MSXML library. This section assumes that you'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# The Document Object Model: Processing Structured Documents


    are familiar with Microsoft''s COM specification and using COM classes. If you
    are not familiar with COM, you should still be able to follow along. A full tutorial
    on COM is beyond the scope of this chapter and book; more information on COM is
    available on the MSDN site and from several third-party books on the subject.


    # Initializing the Parser


    Nothing special needs to be done to initialize the MSXML parser outside of initializing
    the COM system, which must be done before you can call any COM methods. To initialize
    COM and begin using the MSXML parser DOM classes, your application calls the CoInitialize()
    method like this:


    ```

    CoInitialize();

    ```


    For each successful call to CoInitialize(), your application must call the Coinitialize()
    method to close the COM library and free any resources that it is maintaining.
    The call to Coinitialize() looks like this:


    ```

    CoUninitialize();

    ```


    # Creating a Document


    Creating a new DOM in MSXML is accomplished in two steps. First, you must retrieve
    the class ID (CLSID) of the COM class you wish to create, which in this case is
    the class ID for DOMDocument. Next, you call CoCreateInstance() to create an instance
    of the class. For example, the code to create a new, empty Document can be written


    ```

    // Get the CLSID for the MSXML4 DOMDocument

    CLSID CLSID_DOMDocument40;

    HRESULT hr;

    hr = CLSIDFromProgID(LPCSTR("Msxml2.DOMDocument.4.0"), &CLSID_DOMDocument40);


    // create a new instance of the document

    IXMLDOMDocument *pDocument = NULL;

    hr = CoCreateInstance(CLSID_DOMDocument40, // Class of object to create

    NULL, // pointer to unknown interface. Leave as NULL

    CLSTX_INPROC_SERVER, // context for the newly created object

    IID_IXMLDOMDocument2, // ID of the interface being requested

    (LPVOID*)pDocument // receives the new document

    );

    ```


    After the call to CoCreateInstance(), the returned DOM document in the pDocument
    pointer is empty and ready to receive content.'
