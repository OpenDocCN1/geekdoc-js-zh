    # Interface DocumentFragment


    The DocumentFragment was added as a lightweight way of extracting a portion of
    a document tree and manipulating it without having to construct and populate a
    new Document object because this might be an expensive operation in some implementations.
    For this reason, the DocumentFragment inherits directly from the Node interface.


    There are several methods in the DOM API that take Nodes as arguments that also
    allow DocumentFragments to be passed. Doing so operates on all of the child nodes
    in the DocumentFragment (but not the DocumentFragment node itself).


    DocumentFragments are not required to be well-formed XML documents (although they
    do need to follow the rules imposed upon well-formed XML parsed entities, which
    can have multiple top nodes). For example, a DocumentFragment node may have a
    Comment node as its only child.


    # Properties


    No properties other than those inherited from the Node interface.


    # Methods


    No methods other than those inherited from the Node interface.


    # Interface DocumentType


    The DocumentType interface in the DOM Level 1 Core provides an interface to the
    list of entities that are defined for the DOM. DOM Level 1 defines these properties
    to be read-only, recognizing that a future level of the DOM will specify how to
    read and write these settings.'
  merge: -1
  pgno: 370
