    // now copy in all of the sorted TR tags\nfor (i=0; i < numRows; i++) {\n  oTBody.appendChild(theSortedRows[i]);\n\
    }\n```\n\nThe sortTable() function works similarly to the sortList() function\
    \ in the previous example, with some exceptions. First, when sorting a table,\
    \ it is necessary to rearrange all of the rows for each of the columns in the\
    \ table, not just the column being sorted. In the list example, all the code to\
    \ keep track of the contents of each <li> it's a little more complex because the\
    \ code needs to keep track of the entire row contents. Second, when sorting the\
    \ list, it was okay to process all of the list's child nodes which are all <LI>\
    \ tags. In the case of the table, there are some child nodes of the table that\
    \ need to be left alone, as the header section. This job is made somewhat easier\
    \ because the two sections of the table are divided into <HEAD> and <TBODY> sections.\n\
    \n# Prepare the Data for Sorting\n\nJust as in the list example, the sortTable()\
    \ function begins by gathering some necessary information about the table to be\
    \ sorted. The first argument, whichTable, is the ID of the table to be sorted.\
    \ The function calls getElementById to find the table node with the given ID:\n\
    \n```\nvar oTable = document.getElementById(whichTable);\n```\n\nThe function\
    \ retrieves the TBODY node for the table that section contains the nodes for the\
    \ rows that need to be sorted. Once the TBODY has been found, its child <TR> tags\
    \ are retrieved, and the number of rows is sorted in a local variable:\n\n```\n\
    var oTBody = oTable.getElementsByTagName('TBODY')[0];\nvar aRows = oTBody.getElementsByTagName('TR');\n\
    var numRows = aRows.length;\n```"
