    # Cloning Existing Nodes


    Another way to create new nodes is to clone an node using the cloneNode() method
    on the Node interface. This will give you a copy of the existing node, optionally
    copies of all its child nodes.


    Using the example document shown in Figure 3-7, you could add <LI> tags to the
    end of the ordered list by using an existing <LI> tag as the template for each
    new one. For example, this code listing shows how to clone an <LI> tag, modify
    it, and add it to the ordered list:


    ```

    var templateNode = document.getElementById("node4");

    // make a clone of the node using a deep clone so that we

    // get the text node along with the element node

    var newNode = theTemplateNode.cloneNode(true);

    // modify the new node''s child node to have the

    // data that we want in the new node

    newNode.firstChild.data = "List Item E";

    // make a new id attribute for it

    newNode.setAttribute("id", "node5");

    // append it to the ordered list

    theTemplateNode.parentNode.appendChild(newNode);

    ```


    The code begins by retrieving the node with the ID attribute "node4", which corresponds
    to the last <LI> tag. Once you have a reference to that node, you clone it using
    a deep clone to make copies of the target node, as well as its child nodes.'
