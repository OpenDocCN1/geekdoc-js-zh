  md: 'The contains() method can be used to determine whether one node contains another
    node. It returns true if the node on which it contains another specific node,
    false otherwise. Its syntax is


    ```

    var bcontainsNode = node.contains(anotherNode);

    ```


    The swapNode() method swaps the position of the node upon which this method is
    called with the node represented by the argument to the function. Its syntax is


    ```

    var oNode = oElement.swapNode(anotherElement);

    ```


    The swapNode() method returns a reference to the element upon which the method
    was called.

    The applyElement() method makes the element upon which the function calls either
    the parent or child of another element. Its syntax is


    ```

    oElement = oObj.applyElement(oTarget [, sWhere]);

    ```


    The oTarget argument is the element that becomes either the parent or child of
    oObj. The sWhere argument is a string that indicates how the object is to be applied.
    A value of outside, which is the default, indicates that the oTarget element is
    to become the parent of oObj. A value of inside indicates that oTarget is to become
    a child of oObj. The function returns a reference to the applied element.

    The replaceNode() method is very similar to the Node interface''s replaceChild()
    method, but it replaces the node upon which it is called, not a child of the node.
    For example, this code snippet replaces a node with a new node:


    ```

    node.replaceNode(newNode);

    ```


    It is functionally equivalent to writing

    node.parentNode.replaceChild(node, newNode);


    The replaceNode() method returns a reference to the node that was replaced.


    # Browser Quirks


    Although the latest versions of the browsers do an admirable job of implementing
    the DOM standard, a few quirks are worth mentioning so you can avoid or deal with
    them in your browser-based DOM applications.'
