  md: "# Chapter 10: Client Processing of Data-Driven Documents 281\n\n# Data Islands\
    \ in Netscape Navigator\n\nUnfortunately, Netscape Navigator does not provide\
    \ native support for data islands the same way that Internet Explorer does. However,\
    \ you can emulate the same functionality in Netscape by using a few tricks and\
    \ some custom JavaScript code.\n\n# Inline Data Islands\n\nLet's take a look at\
    \ what happens when you try to view the document in Figure 10-7 inside Netscape\
    \ 6.2.\nAlthough Netscape correctly parses the contents of the XML tag, it also\
    \ renders the contents of the tag directly into the page instead of ignoring them.\
    \ To prevent this from happening, you can enclose the XML data island inside an\
    \ invisible DIV tag, as shown in Listing 10-9.\n\n+   Listing 10-9 Hiding a Data\
    \ Island Inside an Invisible DIV\n\n```\n<div id=\"xmlLayer1\" style=\"position:absolute;\
    \ width:0px; height:0px; z-index:1; visibility: hidden\">\n<xml id=\"myDataIsland\"\
    >\n<people>\n  <person>\n    <name>John</name>\n  </person>\n  ... XML tags ...\n\
    </people>\n</xml>\n</div>\n```\n\nNow, when you view the file in Netscape 6, the\
    \ XML data island will be invisible, hidden within the DIV layer. This technique\
    \ does not interfere with Internet Explorer, which still correctly finds the data\
    \ island when bound to an HTML element.\n\n# External Data Islands\n\nNetscape\
    \ also does not provide any native support for external data islands the way the\
    \ IE does. However, you can use the DOM’s createDocument() method along with the\
    \ Document’s load( ) function to simulate this behavior. The"
