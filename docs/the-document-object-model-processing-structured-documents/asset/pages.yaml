    The createDocument() method returns a reference to the DOM for the newly created
    document. To obtain a DOM reference for the currently active document in Dreamweaver,
    your extension calls the getDocumentDOM() method on the dreamweaver object:


    ```

    var currentDOM = dreamweaver.getDocumentDOM();

    ```


    In addition, the getDocumentDOM() method can be used to retrieve the DOM of a
    file stored on disk by passing the "file://" URL of the file to the method. Note
    that this does not actually open the document in a Dreamweaver window. For example,
    this code returns the DOM of a file myfile.html on the C drive:


    ```

    dreamweaver.getDocumentDOM("file://C|/myfile.html");

    ```


    Most of the document-related methods in Dreamweaver are methods of the document
    object. For this reason, it is almost impossible to write a useful Dreamweaver
    extension without using the getDocumentDOM() method.


    # Creating and Manipulating Document Content


    The Dreamweaver API does not support the W3C methods addChild(), insertBefore(),
    and so on. So, how do you get new content into a document? There are several ways;
    one is to use the innerHTML and outerHTML properties, with certain Dreamweaver-specific
    methods to insert text in a document.


    Recall that the innerHTML and outerHTML properties are defined by Microsoft Internet
    Explorer (see Chapter 5). In Dreamweaver, these properties can be used to simulate
    the various DOM methods that are missing. For example, the appendChild() method
    appends a node to the end of the node list of an existing node. This is functionally
    equivalent to


    ```

    oparentNode.innerHTML = oParentNode.innerHTML + HTML_for_new_node;

    ```'
