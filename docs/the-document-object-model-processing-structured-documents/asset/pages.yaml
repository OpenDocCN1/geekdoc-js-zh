  md: '# Conclusion


    In this chapter, we examined the properties and methods of the Node interface
    that allow us to get references to, inspect, modify, rearrange a document''s nodes.
    We also saw how to create new nodes in a document, how to move nodes between documents,
    and how to traverse a document''s set of nodes for processing using the Node interface.
    Finally, we took a look at the Traversal module of DOM Level 2, which can be used
    for advanced node processing.


    This brings us to the end of Part I, in which we introduce the DOM API, its concepts
    and history, and some basic knowledge of how to use the API to manipulate documents.
    In the next section, Part II, we''ll be taking a look at how the DOM is used in
    the real world, including common algorithms, the DOM support available in today''s
    browsers and applications, and some tips and tools for debugging your DOM application
    code.'
