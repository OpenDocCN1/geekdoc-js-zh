    Finally, the DOM is designed to be implemented in any language and avoid implementation
    dependencies, and the DOM spec particularly calls out four important points relevant
    to this fact:


    +   Attributes defined in the IDL do not imply concrete objects which must have
    specific data members.


    In other words, just not necessarily mean your code can access it using the form
