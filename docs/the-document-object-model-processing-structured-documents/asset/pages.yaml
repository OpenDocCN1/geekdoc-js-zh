    # Handling Events with the DOM Level 2 Interface


    One of the modules introduced in DOM Level 2 is the Events module, which specifies
    a method for handling events within DOM documents. Events are generated as the
    user performs certain actions within a document (such as mouse clicks, key presses,
    and so on) when the browser itself performs certain actions (a page has finished
