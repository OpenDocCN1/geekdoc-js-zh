  md: '# Chapter 9: Dynamic User Interfaces 245


    Once the edit control has been added, the script retrieves the Change, Cancel,
    and Delete buttons by calling the createElement() and setAttribute() methods.
    Each button is assigned a click event handler by calling the addClickHandler()
    function, which is a simple utility that takes a node and assigns a click event
    handler to it, depending on which browser the script is running. The Change button
    is assigned the commitChange() handler, and the Cancel button is assigned the
    cancelEdit() handler, and the Delete button is assigned the deleteItem() handler.
    Once each button has been created, it is added as a child of the LI node by appendingChild().


    When the editListItem() function completes, the controls have all been created
    and placed in position. Now, the script just needs to handle the button clicks
    for the item being edited.


    The commitChange() event handler, is called when the user clicks the button, retrieves
    the node for the edit control and extracts the value that the user has entered
    into the control. The script then sets the innerHTML attribute of the <LI> tag
    to the text string. It has two purposes: first, stores the value that the user
    entered into the control as the new text for the <LI> tag. Second, it has the
    side effect of deleting the controls because the document will be reflowed by
    the browser when the innerHTML property is set.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_268_0.png)


    > Even the innerHTML property is not part of the official W3C DOM specification,
    it is supported by both IE 6 and Netscape 6, which makes it safe to use for scripts
    where you know the code will be used in one of these browsers. In addition it
    is often more convenient and practical to use this property than to manually set
    each node of a given parent.


    If the user decides to edit an item by clicking the Cancel button, the cancelEdit()
    function retrieves the innerHTML property of the LI node to the text that was
    stored in the gIdContent variable when the item was first clicked. In the case
    of the commitChange() function, this sets the text value of the LI tag, as well
    as deleting the controls.


    Deleting an item by clicking the Delete button calls the deleteItem() function.
    The function retrieves the node for the edit control, then gets the <LI> tag using
    the parentNode property. The script then removes the removeChild() DOM method
    on the global getList, using the <LI> tag as the argument. This effectively removes
    the list item along with the editing controls.


    Adding new items to the list is accomplished with the addItem() method. This function
    uses the createElement() and createTextNode() DOM methods to make a new <LI> tag,
    which is appended to the list being edited via the appendChild() method.'
