  md: "# Chapter 6: Applications 151\n\ndisplay some data in a user interface that\
    \ is associated with a particular node, and may be inefficient to regenerate the\
    \ data each time you want to display it.\n\nThe DOM_Node class cannot be subclassed,\
    \ the Xerces library provides a separate mechanism for storing application-defined\
    \ data with document nodes. Each node has a property named userData, which can\
    \ be accessed using the Xerces API methods setUserData() and getUserData(). Note,\
    \ however, the memory pointed to by the userData field is not automatically deleted\
    \ for you when the node is deleted. It is your responsibility to delete any memory\
    \ pointed to by this field.\n\nThis code shows how to set and retrieve the userData\
    \ field:\n\n```\nDOM_Node myNode;\nttypedef struct {\n    int someValue;\n   \
    \ char *someString;\n} myStruct, *myStructPtr;\n\n// make a new myStruct and give\
    \ it some values\n// NOTE: your responsibility to delete!\nmyStructPtr theData\
    \ = new myStruct;\ntheData->someValue = 5;\ntheData->someString = new char[10];\n\
    stroppy(theData->someString, \"hello\");\n\n// set the user data field\n// we\
    \ assume we got a Node from the document\nmyNode.setUserData(theData);\n\n// later\
    \ on, we can retrieve it\ntheData = (myStruct*)myNode.getUserData();\ndelete []\
    \ theData->someString;\ndelete theData;\n```\n\n> NOTE\nThe DOM method cloneNode()\
    \ does not clone the data pointer associated with the userData field. The Xerces\
    \ FAQ has an in-depth discussion of why this decision was made, and the upshot\
    \ is if you want to clone the userData pointer along the node, you will have to\
    \ write your own wrapper interface that performs the cloning operation.\n\nIt\
    \ should be noted that the userData field is considered an experimental part of\
    \ the Xerces DOM API, and it may disappear in future versions. The new DOM Level\
