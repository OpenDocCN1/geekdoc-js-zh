  md: "# The Document Object Model: Processing Structured Documents\n\n![](img/dd1ccaaeafde765845e42d14df9ed839_305_0.png)\n\
    \nFigure 10-7 Viewing a document with XML data islands in Netscape\n\nload() method\
    \ of the document object was added by Netscape for compatibility with Microsoft.\
    \ It takes a single argument, a URL to a document to be loaded. load() method\
    \ is asynchronous; that is, it will return control back to your script before\
    \ the document has finished loading. To detect when the document has finished\
    \ loading, you must use an listener to listen for the load event.\n\nThe loading\
    \ process is in two steps. First, your script creates the document using the createDocument()\
    \ method, which is found on the DOMImplementation interface (note that createDocument\
    \ is a DOM Level 2 method). After the document has been created, you can call\
    \ the load() method on it. When the event listener fires, the document has been\
    \ loaded into memory, and your script can begin processing it. The following code\
    \ fragment illustrates the whole process:\n\n```\n// create the document\nvar\
    \ myXMLDoc = document.implementation.createDocument(\"\",myDoc\",null);\n// attach\
    \ a \"load\" event listener\nmyXMLDoc.addEventListener(\"load\",docLoaded,false);\n\
    // now load the document\nmyXMLDoc.load(\"myxmdoc.xml\");\n```\n\n```\nfunction\
    \ docLoaded(evt)\n{\n  // whatever processing is required\n  alert(doc.documentElement.nodeName);\n\
    }\n```"
