    The createTable() function creates a <TABLE> node and populates it with 12 rows
    of 18 cells, each representing a web-safe color. Each table row is generated in
    3 groups of 6 cells at a time. As each cell is created, a new color value is computed
    and assigned to the cell. When it is finished, the table contains 216 colors.
    Let''s examine the code to see how it works.


    # Set up the Color Picker User Interface


    The createTable() function begins by creating the TABLE, THEAD, and TBODY nodes
    that will hold the structure:


    ```

    var tableNode = document.createElement("TABLE");

    var tableHead = document.createElement("THEAD");

    var tableBody = document.createElement("TBODY");

    ```


    Next, some local variables are declared, including an array of 6 base hexadecimal
    numbers that will be used to create the RGB colors:


    ```

    var colorArray = new Array("00","33","66","99","CC","FF");

    ```


    The THEAD and TBODY are appended to the TABLE element, and common table settings
    are initialized and set as attributes on the table:


    ```

    tableNode.appendChild(tableHead);

    tableNode.appendChild(tableBody);

    tableNode.setAttribute("border","1");

    tableNode.setAttribute("width","400");

    tableNode.setAttribute("id","colorTable");

    ```


    The color cells are generated. In order to achieve a certain continuous tone and
    look to the table, the cells are generated in a particular pattern. There are
    12 rows of colors divided into two groups, consisting of 6 rows each. Within the
    row groups, there are three groups of cells, each consisting of 6 cells.'
