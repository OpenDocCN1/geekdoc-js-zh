    <TITLE>Transformed Document</TITLE>

    </HEAD>

    <BODY>

    <h1>Hello there, world!</h1>

    </BODY>

    </HTML>

    ```


    In other words, you want the text contained in the <hello> tag to be displayed
    inside an <h1> tag in the resulting HTML document. To perform this in XSLT requires
    a couple of steps.


    First, you need to define the XSL style sheet that will be responsible for generating
    the output. This means that an HTML document must be created with some kind of
    “holding slot” where the <hello> tag’s text will go. If you name the style “hello.xsl,”
    in XSL parlance, the style sheet would look like this:


    ```

    <xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:template match="">

    <HTML>

    <HEAD>

    <TITLE>Transformed Document</TITLE>

    </HEAD>

    <BODY>

    <h1><xsl:value-of select="hello"/></h1>

    </BODY>

    </HTML>

    </xsl:template>

    </xsl:stylesheet>

    ```


    The <xsl:stylesheet> tag indicates that this file defines an XSL style sheet.
    The <xsl:template> tag defines Its match attribute is an XPath expression indicating
    what part of the source document this template will'
