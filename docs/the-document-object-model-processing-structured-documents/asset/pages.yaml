- img_proc: true
  md: '# Chapter 11: Future Directions for the DOM 327


    ![](img/dd1ccaaeafde765845e42d14df9ed839_350_0.png)


    Figure 11-3 XSLT transformations


    Why would you want to do this? Increasingly, XML is being used as a format for
    data storage and representation, and there is a clear need for being able to take
    XML data and present it in a human-consumable form. Often, in fact, it is desirable
    to be able to present the same data in several forms, such as HTML for web pages,
    WML for mobile phones, PDF for print versions, CSV for importing into spreadsheets,
    and so on. This is essentially what XSLT allows developers to do: create transformations
    that can produce multiple versions of output for a single input document.


    # How XSLT Works


    XSLT works by applying a series of template rules to the source document tree
    to produce the result document tree. Each template rule consists of two parts:
    a pattern, which is used to determine which portions of the source tree are affected,
    and a template, which is used to produce a portion of the output tree.


    The rules are described in a construct called an XML style sheet using XML (Extensible
    Style Language). XML describes the data contained within an XML document should
    be presented—whether the presentation medium is a web page, handheld device, piece
    of paper, and so on.


    The style sheet is then associated with the XML document, typically by using the
    <?xml-stylesheet?> processing instruction defined in the W3C''s XML style sheet
    specification. To see how it works, let''s look at a simple example.'
