  md: '# The Document Object Model: Processing Structured Documents


    The Document Object Model specification, published by the World Wide Web Consortium
    (W3C), represents a significant advancement in the handling of structured documents.
    The specification provides a standard set of programming interfaces for working
    with information stored in XML (extensible Markup Language), HTML (HyperText Markup
    Language), and other types of documents containing structured information. Using
    the DOM application interface (API), application programmers can write their code
    to one common set of methods that will work across various DOM implementations.


    The W3C DOM specification is written for companies who want to implement DOM functionality
    in their applications and programmers who want to use the DOM to manipulate information.
    In this book, we explore the DOM mainly from the programmer''s point of view,
    using the core methods of DOM Level 1 to work with structured documents, along
    with other parts of the DOM specification necessary (such as events and Cascading
    Style Sheets, or CSS). We begin this chapter by examining the philosophy and history
    of the DOM and taking a look at the different DOM levels of support. We cover
    some important things to remember when reading the W3C DOM specification and general
    conventions that the specification uses.


    # What Is the Document Object Model?


    Put simply, the W3C Document Object Model, better known as the DOM, is a set of
    platform- and language-neutral application programming interfaces (APIs) that
    describe how to access and manipulate information stored in structured XML and
    HTML documents. It is a recognized and recommended standard published and maintained
    by the W3C, or World Wide Web Consortium, an organization of member companies
    dedicated to establishing and promoting standards for the World Wide Web. According
    to the W3C DOM specification, the term Document Object Model was chosen because
    the DOM is an object model in the traditional object-oriented programming sense:
    documents are modeled using objects, and the model describes the structure of
    the document as well as its behavior and the behavior of its objects.'
  merge: -1
  pgno: 27
