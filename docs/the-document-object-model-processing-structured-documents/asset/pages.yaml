  md: '# Chapter 10: Client Processing of Data-Driven Documents 257


    combine client-side data processing with embedded XML data in your web pages,
    a capability supported directly or indirectly by Netscape Navigator 6.x and Internet
    Explorer 5 and later. Both Internet Explorer and Netscape allow you to embed XML
    data fragments, called “data islands,” inside web pages. This enables applications
    to provide advanced data presentation to users by employing standard DOM, CSS,
    and JavaScript technologies.


    Let’s begin by taking a look at a common use of client-side data manipulation:
    data sorting in tables and lists.


    # Client-Side Sorting


    One of the more obvious applications of client-side data processing is the sorting
    of information. There are all kinds of instances where a user might want to sort
    the information displayed to them in a web page: listing your credit card transactions
    by date or amount, sorting lists of data alphabetically, displaying college courses
    by prerequisite classes and grade level, and so on.


    Usually, this kind of data sorting would be performed on the server. Typically,
    the user clicks a link in the first row of a column whose URL links to a server-side
    ASP or JSP script. The server script sorts the data, regenerates the table (along
    with the rest of the page), produces the finished document, and retransmits it
    to the client for display.


    That round-trip process can take a fairly long time, depending on the amount of
    processing load on the server at any given moment. In modern DOM-capable browsers,
    implementing the same sorting functionality using the DOM API along with standard
    JavaScript is pretty straightforward. Let’s look at a simple example of sorting
    the contents of the list.


    # Sorting a List


    Figure 10-1 shows a sample document containing an ordered list of items representing
    a grocery shopping list.'
