  md: "# Chapter 10: Client Processing of Data-Driven Documents 277\n\nData islands\
    \ can be defined in Internet Explorer as either inline or external. Inline data\
    \ islands embed the XML code directly within the page. External data islands reference\
    \ an external XML source, just as an <IMG> tag points to its image source file.\n\
    \n# Inline Data Islands\n\nTo define an inline XML data island in Internet Explorer,\
    \ your application needs to enclose the XML code within an <XML> tag. This XML\
    \ tag is then assigned a unique ID that can be used to refer to the element throughout\
    \ the document and bind the island to an HTML element that supports data binding.\
    \ Listing 10-7 shows a sample HTML page with an embedded XML data island, along\
    \ with an HTML table that uses the data to populate the table cells.\n\nListing\
    \ 10-7 HTML Document with an XML Data Island\n\n```\n<html>\n<head>\n  <title>Inline\
    \ XML Sample Document</title>\n</head>\n<body bgcolor=\"#FFFFFF\">\n<xml id=\"\
    myDataIsland\">\n<people>\n  <person>\n    <name>John</name>\n  </person>\n  <person>\n\
    \    <name>Paul</name>\n  </person>\n  <person>\n    <name>George</name>\n  </person>\n\
    \  <person>\n    <name>Ringo</name>\n  </person>\n</people>\n</xml>\n</body>\n\
    </html>\n```\n\nThe XML tag identifies an individual section of XML within the\
    \ HTML document and uses the ID myDataIsland to assign the island a unique ID\
    \ within"
