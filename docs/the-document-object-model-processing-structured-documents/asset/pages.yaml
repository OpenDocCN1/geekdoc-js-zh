    # Serializing Documents


    To save a document to disk, an extension can call the saveDocument () method from
    the Dreamweaver object. The function takes two arguments: the first argument is
    the DOM of the document to save, and the second argument is the file URL to save
    the document. To the following code, for example, saves the current document to
    the root of the C driver on the user''s computer:


    ```

    dreamweaver.saveDocument(dreamweaver.getDocumentDOM(),"file://c|/myfile.html");

    ```


    # Where to Get More Information About the Dreamweaver DOM


    These examples just barely scratch the surface of what can be accomplished with
    Dreamweaver extensions. To learn more about writing Dreamweaver extensions, the
    Macromedia Exchange website is a good place to get information about extending
    Dreamweaver (macromedia.com/exchange/dreamweaver). There is an SDK available for
    download, and most of the extensions available on the site are free and can be
    downloaded and examined in depth (after all, most are just HTML and JavaScript
    files).


    Dreamweaver also ships with online documentation detailing the workings of the
    Dreamweaver extensibility mechanism; it can be found under the Help menu by choosing
    Dreamweaver Extending.


    There are several books available that deal with extending Dreamweaver, such as
    Dreamweaver 4: The Complete Reference by Jennifer Kettlett (McGraw-Hill/Osborne,
    2001) and Building Dreamweaver 4 and UltraDev Extensions (McGraw-Hill/Osborne,
    2001) by Tom Muck and Ray West. Both are very good sources of information for
    building Dreamweaver extensions.


