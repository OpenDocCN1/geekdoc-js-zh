  md: '# Chapter 8: Providing Automatic Document Navigation 211


    variables that will be used to build the bookmarks: g_anchorAccount is used to
    create named anchors to serve as bookmark destinations, and the g_docLoc string
    holds the initial URL of the document. The script stores this value aside in a
    variable it needs to work with the original document''s URL each time the user
    chooses a bookmark. Note also that the value of g_docLoc is set by creating a
    New String and initializing it with the value of the document''s location property.
    Just writing the following code wouldn''t work.


    ```

    g_docLoc = document.location

    ```


    Why? Because the g_docLoc variable would just point to the same underlying object
    as the document.location property, and when it changed, you lose the original
    value of the document URL.


    # Creating the User Interface Elements


    The buildBookmarks() function next creates the user interface controls that will
    be needed to display the bookmarks. First, the enclosing <FORM> tag is created,
    then the <SELECT> list that will hold the bookmarks is created:


    ```

    // build the FORM to hold the controls

    var oForm = document.createElement("FORM")

    // create the SELECT element for the bookmarks

    var oSelect = document.createElement("SELECT")

    Select.setAttribute("id", "bookmarks");

    ```


    The <SELECT>list is also given the ID of "bookmarks" so it can be referred to
    later. After the select list is created, a text node is created to serve as a
    label for the list:


    ```

    var oText = document.createElement("Select a Bookmark: ");

    ```


    Then the list and <SELECT>list are added to the form element:


    ```

    oForm.appendChild(oText);

    oForm.appendChild(oSelect);

    ```


    Finally, the Go button is created and added to the form:


    ```

    var oBtn = document.createElement("INPUT")

    oBtn.setAttribute("type", "button")

    oBtn.setAttribute("value", "Go")

    oBtn.setAttribute("onclick", "jumpToBookmark()")

    oForm.appendChild(oBtn);

    ```'
