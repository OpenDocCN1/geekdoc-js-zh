    or maybe you don''t need that level of detail. What you need is a way of seeing
    the big picture: a snapshot of your application''s DOM structure in real time.
    This is the kind of situation that the DOMDumper tool is ideally suited for.


    Essentially, the DOMDumper tool takes a picture of the current state of a DOM
    structure in a web page starting from a given node in the document tree and dumps
    it'
