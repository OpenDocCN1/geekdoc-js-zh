    # Manipulating Nodes


    The Node interface provides all of the necessary methods for modifying the structural
    order and content of the nodes of a document. The DOM specification states that
    the firstChild, lastChild,'', previousSibling, and nextSibling properties are
    read-only, so the only way to change the order of nodes in a document via the
    Node interface is by using the provided methods—insertBefore(), appendChild(),
    replaceChild(), and removeChild().


    Consider a hypothetical document subtree containing five nodes, as shown in Figure
    3-2.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_79_0.png)


    **Figure 3-2** A document subtree'
