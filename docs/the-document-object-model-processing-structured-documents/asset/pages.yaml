  md: '# Conclusion


    In this chapter, you saw how to accomplish some common user interface techniques
    using the DOM that used to require browser-specific DHTML programming (and in
    some cases, couldn''t even be accomplished with DHTML). First, you saw how to
    create a web page-based color picker that allows users to select colors from a
    palette of web-safe color values. This example used mouse-move and click events
    to update the color selection fields. Next, you examined a new way to provide
    list editing functionality that allows a user to edit items in a list directly
    in-place by dynamically creating form controls when the user clicks a list item.
    Finally, you took a crack at a DOM-oriented solution to a familiar problem: cross-browser
    pop-up menus, written entirely using the DOM and CSS.


    In the next chapter, we''ll focus on how to use the DOM to perform client-side
    data-driven document processing. These techniques can make web pages even more
    powerful and useful to users without having the information contained within them
    be processed and manipulated without having to wait for round trips to the server
    time. This results in saved bandwidth, improved responsiveness, and a lighter
    processing load on the server.'
