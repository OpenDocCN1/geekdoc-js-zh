  md: "# Useful String Utilities\n\nThe Xerces library provides some string utilities\
    \ that almost all DOM applications need to use from time to time. For example,\
    \ the Xerces parser stores documents using 16-bit characters because this is how\
    \ Unicode is implemented. Unfortunately, most operating systems or existing applications\
    \ do not work directly with Unicode, so it may be necessary to first transcode\
    \ Xerces strings to the machine's local code page before operating on them. This\
    \ can be accomplished in two primary ways: by calling the DOMString class's transcode()\
    \ method or by using the static XMLString::transcode\n\nThe DOMString class provides\
    \ a method for transcoding Unicode strings to the local machine code page. It\
    \ allocates and returns a native C character pointer (char *), which can be passed\
    \ to C and C++ library methods, such as strlen(), strcpy(), or other OS methods\
    \ requiring C strings. For example, to convert a DOMString returned from a call\
    \ to getAttribute to a C string, you could use\n\n```\n// get myAttr attribute\n\
    DOMString dsAttr = element.getAttribute(\"myAttr\");\n```\n\n```\n// convert the\
    \ DOM to a C string\nchar *p = dsAttr.transcode(); // NOTE -- this allocates memory\n\
    // call some C library method that takes a char *\nint len = strlen(p);\n// when\
    \ finished, it is your responsibility to delete the pointer\ndelete [] p;\n```\n\
    \nNote that the call to transcode() allocates memory, so it is your responsibility\
    \ to deallocate the returned string pointer when you have finished with it.\n\n\
    ![](img/dd1ccaaeafde765845e42d14df9ed839_171_0.png)\n\n> NOTE\n you are building\
    \ for Windows, you must make sure that you are using the same runtime model as\
    \ the Xerces-C library when you deallocate memory that was allocated by Xerces.\
    \ For example, if you are using the debug version of the Xerces DLL, you must\
    \ make sure that you are linking against the debug version of the C runtime library,\
    \ or the OS may throw an exception.\n\nThe other option is to use the XMLString::transcode\
    \ method. This is useful when you don't have a DOMString, but you have a sequence\
    \ of XMLCh characters, which are defined to be 16 bits wide. There are four methods\
    \ provided for transcoding strings: two sets of functions for transcoding between\
    \ XMLCh strings and 8-bit char strings. Within each set, there is one function\
    \ that returns a newly allocated string and one that takes the address of a previously\
    \ allocated string."
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Chapter 6: Applications 149


    For example, the following code takes an XMLCh string and transcodes it to a char
    *:


    ```

    XMLCh *pXMLStr;

    char *p;

    // transcode the XML string to a char *

    p = XMLString::transcode(pXMLStr);

    ```


    As the previous example, the returned char must be deallocated by the caller.
    The XMLString class provides a number of other utility functions for working with
    16-bit XML strings, such as comparison, substractions, searching, hashing, functions,
    and so on. It''s not intended to be a full replacement for other string classes,
    such as MFC''s CString, but it does contain many of the common methods needed
    for manipulating 16-bit strings. For more information on XMLString, see the Xerces
    API documentation on the XMLString class.


    # Transcoding an Entire Document


    The Xerces parser stores its internal representation of the document content using
    Unicode characters, so it may be necessary to first transcode the document to
    the local machine code before saving it or handing it off to another application,
    such as a text editor. The Xerces library provides several built-in transducers
    to assist in this process. Transcode an entire document, your application needs
    to make use of the transcoding services provided by Xerces by following these
    general steps:


    +   Allocate the output buffer. Your application should allocate a buffer to store
    the resulting transcoded text. This need not large enough to hold the entire file
    because the transcoding engine can process slices of the document.


    +   Create a transcoder object. The XMLPlatform class contains a member variable
    fgTransService, which is an object that represents the transcoding service. To
    create a new transcoder, your application calls this object''s makeNewTranscoder
    method with the type of encoding to transcode.


    +   Decide how unrepresentable characters will be handled. The Unicode character
    set can represent thousands of characters, some of them may not be representable
    in the target character set. Your application needs to indicate the transcoder
    what to do when one of these characters is encountered. The transcoder can either
    replace the character with the default character for the target character set,
    which is guaranteed to be legal, or throw an exception.


    +   Call the transcodeTo method. Once the transcoder has been allocated, your
    application calls the transcodeTo method as many times as it needs to process
    all of the document''s content.'
