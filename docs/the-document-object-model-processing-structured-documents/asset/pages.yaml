  md: '# Chapter 11: Future Directions for the DOM 307


    specifications, where those specifications have started providing DOM extension
    methods and properties to their respective developers. This becomes an issue when
    fragments of one type of XML document (SVG, for example) are embedded within an
    XML document that follows a different schema (such as XHTML). The DOM Working
    Group realized that Level 2 did not provide enough functionality to cover all
    of the instances that come up with documents that can contain two or more different
    types of XML fragments.


    DOM Level 3 tries to remedy this by allowing DOM implementations to make specialized
    interfaces available when needed by an application to perform special processing
    on certain parts of the document that contain specialized node types. The solution
    takes the form of the new getInterface() method on the DOMImplementation interface,
    which has this IDL definition:


    ```

    DOMImplementation getInterface(DOMString feature);

    ```


    An application can request a specialized DOM implementation by passing the name
    of the feature that it wishes to support. If there is no alternative implementation
    that supports the requested feature, the return value is null.


    # Abstract Schema Support


    DOM Level 3 includes the new Abstract Schema module, which is intended to provide
    support for working with Document Type Definition (DTD) files, XML Schemas, and
    other nonspecific schema types. The DOM Working Group realized early on that such
    support would one day be a necessity in the DOM. In fact, the 1997 DOM document
    explicitly refers to the ability “determine the presence of a DTD” and “to add,
    remove, and change declarations in the underlying DTD (if available).” However,
    the spec notes that this was intentionally delayed beyond DOM Level 2 because
    XML Schemas were still being defined, and they hoped that any support provided
    for working with DTDs would be extended to work with XML Schemas as well as any
    other abstract schemas that came along later.


    The Abstract Schema module formalizes the API provided to address these issues,
    as well as other specific use cases, such as changing the abstract schema associated
    with a document, validating the document against the schema, and loading a schema
    independently from a document. Implementations can provide read-only access to
    abstract schemas, editing schemas, and document-editing access to schemas. Each
    of these capabilities can be discovered by a DOM application by calling the hasFeature()
    method on the DOMImplementation interface with the “AS-READ,” “AS-WRITE,” and
    “AS-DOC” feature strings.'
