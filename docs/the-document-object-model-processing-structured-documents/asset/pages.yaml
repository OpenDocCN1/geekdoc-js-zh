    \ code illustrates the transcoding process. In this example, the document is being\
    \ transcoded to the UTF-8 encoding.\n\n```\nXMLch *psDocument; // pointer to XML\
    \ string\nchar *psOutString; // pointer to char *, the output string\n// if the\
    \ transcoder cannot be created, this variable will contain\n// the code indicating\
    \ the reason for failure. The list of constants\n// can be found in the API docs\
    \ under the XMLTransService section.\nXMLTransService::Codes failReason;\nunsigned\
    \ int charsProcessed; // the number of characters processed\nunsigned int charsWritten;\
    \ // number of characters placed in output buffer\n\npsOutString = new char[1024];\
    \ // allocate the output buffer\n\n// assume that the psDocument pointer contains\
    \ the document source\n\nXMLTransCoder *pTransCoder;\npTransCoder = XMLPlformUtil::fgTransService->makeNewTransCoderFor(\n\
    \    \"UTF-8\", // the target character set\n    failReason, // holds the result\
    \ code\n    1024 // size of the buffer\n);\n\n// now call the transcodeTo method\
