  md: '# Chapter 9: Dynamic User Interfaces 231


    DOM makes it possible to create entirely new page elements, your applications
    can achieve user interactions that weren''t possible before: elements can come
    and go, text can change colors and styles, and even forms and elements can be
    created processed dynamically.


    Let''s begin by taking a look at how to create a color picker user interface.


    # Creating a Color Picker


    One of the more complex user-interface gadgets I''ve always admired is the color
    picker. Color pickers usually have several characteristics in common: they display
    a range of colors from which the user can choose, they display the currently selected
    color, and they display the color that the mouse is currently over. Using the
    DOM, you can create a color picker that performs all of these tasks.


