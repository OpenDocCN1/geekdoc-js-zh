    # How Event Listeners Interact with Old-Style Listeners


    Prior to the DOM Level 2 Events specification, event listeners were registered
    using attributes on the intended event target. Because all of the current browsers
    still allow this technique to provide backward compatibility, there has to be
    a way for the two to coexist.


    According to the DOM Level 2 Events specification, DOM implementations can view
    the setting of an event handler attribute on an element as analogous to creating
    and registering an event listener on that element, with the useCapture argument
    defaulting to false. In other words,


    ```

    someElement.onmouseover = myEventFunction;

    ```


    is the same as


    ```

    someElement.addEventListener("mouseover", myEventFunction, false);

    ```'
