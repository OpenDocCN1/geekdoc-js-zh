    \ traversal using the Tra interface is not presented here. For more information\
    \ on the Tra interface, see Chapter 3. The DOM document structure is organized\
    \ as a tree, so there are two ways to traverse nodes: depth first and breadth\
    \ first. The depth-first algorithm visits nodes starting at the root node of a\
    \ subtree and recursively processing each child node of the root node. Based upon\
    \ where you place the processing logic within the recursive function, the algorithm\
    \ processes either parent or child nodes. The node traversal algorithm we introduced\
    \ in Chapter 3 was an example of a depth-first traversal. Recall the code listing\n\
    \n```\nprocessNode(Node n)\n{\n    doStartNodeProcessing(n);\n    for (Node c\
