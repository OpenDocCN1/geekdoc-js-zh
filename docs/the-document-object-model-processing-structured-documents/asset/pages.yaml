  md: '# The Extended Core Interfaces


    In this section, we introduce the Extended Core interfaces, which are provided
    for working specifically with XML documents in addition to the fundamental Core
    interfaces. The interfaces covered in this section will not be encountered when
    working purely with HTML documents.


    The interfaces within this section are not mandatory for Core compliance, DOM
    applications should use the hasFeature() method of the DOMImplementation with
    the arguments XML and 1.0 for DOM Level 1 or 2.0 for DOM Level 2 to determine
    if these interfaces are available for use.


    # CDATASection Interface


    CDATA sections are used to prevent XML processors from attempting to parse a block
    of text as if it were markup. Everything in the CDATA section, between the opening
    <![CDATA[ and the closing ]] sequences, is ignored. The primary purpose of a CDATA
    section is to include markup text without escaping each delimiter. CDATA sections
    cannot be nested within each other.


    The CDATASection interface inherits from the CharacterData interface through the
    Text interface. Adjacent CDATASection nodes are not merged by use of the normalize()
    method of the Node interface.


    The CDATASection interface has the following IDL definition:


    ```

    interface CDATASection : Text {

    }

    ```


    # DocumentType Interface


    Each Document has a docType attribute whose value is either null or a DocumentType
    object. The DocumentType interface in the DOM Core provides an interface to the
    list of entities that are defined for the Document. Currently, the DOM Level 2
    spec does not support the editing of DocumentTypes. This has been left for a future
    version of the DOM.


    The DocumentType interface has the following IDL definition:


    ```

    interface DocumentType : Node {

    readonly attribute DOMString name;

    readonly attribute NamedNodeMap entities;

    readonly attribute NamedNodeMap notations;

    // Introduced in DOM Level 2;

    ```'
