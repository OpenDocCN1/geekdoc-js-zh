  md: '# Internet Explorer


    Some of Internet Explorer’s more notable DOM-related quirks:


    +   - Versions prior to 6 don''t support createAttribute(), getAttributeNode(),
    or setAttributeNode(). You must use the getAttribute() and setAttribute() methods.


    +   - Versions prior to 6 don''t support the normalize() method of the Node interface.


    +   - If you call getAttribute(''style'') on an Element, the return value will
    be not a string. You can get the content by using getAttribute(''style'').cssText.


    +   - Calling getAttribute(''class'') on an Element returns null, even if a class
    attribute has been defined.


    # Netscape Navigator


    Netscape Navigator’s more notable DOM quirks are


    +   - Newline characters are treated as individual text nodes. This may cause
    your DOM applications that expect child nodes of a certain type to always be in
    a particular location to fail because a newline character in the source text may
    be treated as a text node. Always check node types before operating on them to
    make sure that what you have is what you think you have (this is true for all
    browsers).


    +   - Versions of Navigator prior to 6.1 have event capturing problems when clicking
    on a text node contained within a DIV. The event will not properly captured by
    the <<div> element.


    +   - Navigator 6 doesn''t provide backward compatibility for old HTML constructs
    (like document.layers).


    # Conclusion


    In this chapter, we examined the DOM support provided by the major web browsers
    in use today from four different vendors. In particular, we discussed the support
    provided by Internet Explorer 6, Netscape Navigator 6, and Opera 6. Of these,
    Internet Explorer and Netscape 6 have the most complete support for the DOM specification,
    whereas Opera currently has the least support.'
