    \ The type argument specifies the type of event that the listener handles (see\
    \ the DOM2 Events module specification). The listener argument is the particular\
    \ Event that will handle the events. In the JavaScript DOM implementation, this\
    \ is a function that takes a single argument (an Event object). TheCapture argument\
    \ specifies whether this listener should use capture when listening for events.\
    \ If it is, the true target for this listener will receive events of the type\
    \ for which it is registered before any of its descendants in the document tree.\
    \ If a listener is added while an event target is already processing an event,\
    \ it will not be triggered by the current event. Adding identical event listeners\
    \ will cause the duplicate listener to be discarded.\n\n# NOTE\n\n> A node that\
    \ has an event handler registered for an event and another event handler that\
    \ is not using capture for the same event is considered to have two separate handlers,\
