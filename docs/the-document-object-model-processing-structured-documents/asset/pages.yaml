    To make the text inside the <P> tag bold, you could use the following code:


    ```

    var pNode = document.getElementById("paral")

    pNode.innerHTML = "<b>" + pNode.innerHTML + "</b>";

    ```


    This code surrounds the <P> node''s existing innerHTML (This is some text) with
    opening and closing <B> tags and places the result <B>This is some text</B> back
    into the innerHTML of the node.


    > NOTE

    Netscape Navigator 6 adds support for Internet Explorer''s innerHTML property.
    Scripts use the innerHTML property just as they would in Internet Explorer. Curiously,
    Netscape 6 does not support the outerHTML property—attempts to access it return
    "undefined."


