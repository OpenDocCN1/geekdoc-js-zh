    \ not available. The errorNode field indicates the node where the error occurred\
    \ or null if no node is available. The uri field will be the URI where the error\
    \ occurred or null if there is no URI available.\n\nErrors are reported by means\
    \ of a DOMErrorHandler, which represents a callback interface that an implementation\
    \ will call when reporting errors. The DOMErrorHandler has the following interface:\n\
    \n```\ninterface DOMErrorHandler {\n  boolean handleError(DOMError error);\n}\n\
    ```\n\nThe handleError () method is called when the DOM implementation needs to\
    \ report an error. The method returns a boolean value indicating what the implementation\
    \ should do after reporting the error. If the method returns true, the implementation\
    \ should continue as if the error didn't happen (the spec notes that this may\
    \ not always be possible). If the method returns false, the implementation should\
    \ stop any further processing (again, the spec notes that this may not always\
    \ be possible).\n\n# Loading and Saving DOM Documents\n\nIt may be hard to believe,\
    \ but Levels 1 and 2 of the DOM specification did not provide a way to load or\
    \ save documents to or from a DOM implementation. This was intentionally left\
    \ as an implementation-dependent function, and several DOM implementers such as\
    \ Macromedia, Apache, Microsoft, and Netscape went ahead and defined their own\
    \ interfaces and methods for loading and saving documents. The result, of course,\
    \ was that not all implementations used the same methods for document persistence.\
    \ For example, loading a document in Macromedia's Dreamweaver DOM implementation\
    \ is done via a method called openDocument( ), whereas in Microsoft Internet Explorer\
    \ the method is named load()."
