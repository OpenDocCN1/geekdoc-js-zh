    Once XML data has been embedded in a web page, it can be used to generate HTML
    to present that data. For example, the XML data island listed previously might
    appear in a web page as an HTML table or as the contents of a select list, as
    shown in Figure 10-5.


    In this section, you''ll examine how to embed XML data in web pages that will
    work across multiple browsers, and you will see how to write DOM code to manipulate
    the XML information and build HTML to display the data.


    Let''s begin by taking a look at the XML support currently provided by Internet
    Explorer 6, which provides robust built-in support for data islands.


    # Data Islands in Internet Explorer


    Internet Explorer provides native support for XML data islands, along several
    methods for working with them. For example, IE allows certain types of HTML elements
    to be “bound” to XML data islands for automatic data-driven HTML code generation.
    When the page is viewed in the browser, Internet Explorer automatically populates
    the HTML element with the data from the associated XML data island. In addition,
    IE supports using XSLT to transform the XML data island into HTML.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_299_0.png)


    Figure 10-5 XML as an HTML select list (left) and as an HTML table (right)'
