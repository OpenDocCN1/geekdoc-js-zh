  md: '# Chapter 6: Applications 141


    Aside from the name differences, programming Xerces in C++ is very similar to
    programming Xerces in Java, and a great deal of effort went into making the two
    as similar as possible. Most of the memory management is done automatically behind
    the scenes by the library, and the built-in DOM classes are implemented using
    object reference counting. For most part, your code will not have to do any explicit
    deletion. For this reason, there are some important points you need to keep in
    mind when writing Xerces C++ applications:


    +   Always try to create DOM classes as local variables on the stack, or as member
    of another class. Do not try to create them on the heap using new ( or malloc
    () because this will cause the internal automatic memory management to become
    confused and will most likely lead to objects not being freed correctly. In other
    words, this does:


    ```

    DOM_Document node =

    DOMDocumentImpl.createDocument(0,"root",DOM_DocumentType());

    ```


    Not this:


    ```

    DOM_Document *myDocument = new DOM_Document();

    ```


    +   The public DOM classes can be copied via the assignment operator (=), passed
    as function parameters, and returned from functions by value, just as they can
    be in Java.


    +   You should not try to subclass the public DOM classes (for example, DOM_Node,
    DOM_Document, DOM_Attr, and so on). In practice, this is almost never necessary.
    If you need to attach application-specific data to a DOM document tree, the DOM_Node
    class provides "user data" field that your application can use to store this data.
    You''ll see an example of this later in the chapter in "Using the Node''s userData
    Field" section.


