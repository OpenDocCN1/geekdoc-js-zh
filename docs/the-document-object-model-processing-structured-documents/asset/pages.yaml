  md: "# Opera 6\n\nThe Opera browser, made by the Norwegian company Opera Software,\
    \ does not yet (as of version 6) provide full support for the W3C DOM. However,\
    \ according to the company’s website (www.opera.com), they are working on providing\
    \ support for DOM Level 1, along with many other public Internet standards.\n\n\
    Using Opera’s (as of this writing) DOM implementation, applications cannot currently\
    \ modify the structure of the document or dynamically create new page elements\
    \ at runtime. They can, however, examine the document structure and discover its\
    \ contents. Opera 6’s support for DOM methods and properties is currently as follows.\n\
    \nThe document object:\n\n+   - getElementsByTagName() \n- getElementById() \n\
    - getElementsByName()\n\nOn HTML elements:\n\n+   - getElementsByTagName() \n\
    - contains() \n- parentNode\n\nMost of the examples in this chapter will work\
    \ with Opera 6, except where specifically noted.\n\n# Using the DOM in a Browser\
    \ Environment\n\nThe browsers in this chapter used JavaScript as their native\
    \ programming language, and each provides a JavaScript language binding for the\
    \ DOM in its implementation of the W3C DOM specification. Scripts do not have\
    \ to do anything special to start using the DOM methods and structures provided\
    \ by these browsers—they are an inherent part of the JavaScript namespace within\
    \ the browser and can be used in any script."
