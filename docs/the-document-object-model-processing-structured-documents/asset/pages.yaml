    do not provide support for DOM Level 2, and it technically should still be okay
    to use the older methods when working with XML documents that do not contain namespaces.
    For simplicity, this book will use the non-namespace-aware methods because the
    current versions of most browsers and applications don''t support DOM Level 2,
    although any new development that you do using DOM Level 2 should use the namespace-aware
    methods. More information on XML namespaces can be found at //www.w3.org/TR/REC-xml-namespaces/


    # Obtaining Object References to Nodes


    DOM applications can obtain references to a document''s nodes directly by using
    the properties of the Node interface. Node references can also be obtained by
    using certain node properties that return nodes and lists of nodes, such as the
    childNodes property of the Node interface; other specialized DOM methods as getElementsByTagName()
    on the Element interface; and getElementById(), provided by the Document interface.


    For example, to obtain a reference to the first child node of a document you would
    use the following code:


    ```

    var node = document.document.firstChild;

    ```


    ![](img/dd1ccaaeafde765845e42d14df9ed839_75_0.png)


    > NOTE

    The previous code is specific to DOM implementations that use a JavaScript implementation
    binding, such as Microsoft Internet Explorer and Netscape Navigator. Other implementations
    (such as Xerces) may use slightly different notation to access node properties;
    see your implementation''s documentation for more information.


    This line of code would return an object reference to the first child node of
    the document element; in our example, this would be the element represented by
    the <HEAD> tag.


    As stated previously, you can also use certain DOM methods that return nodes and
    lists of nodes to obtain references. For example, the following code fragment
    will return a NodeList containing all H1 elements in a document:


    ```

    var htags = document.document.getElementsByTagName("H1");

    ```


    The getElementsByTagName() method takes a DOMString as an argument, which is the
    type of tag to retrieve. The method scans the document for all tags that match
    the given name and returns them in the order in which those nodes were encountered
    in the document. You can also obtain a reference to a node using its ID attribute,
    if it has one:'
