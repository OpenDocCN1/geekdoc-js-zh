    # Creating a New Document


    Once the Xerces library has been initialized, your application can start using
    it to create andor process documents. To create a new document, your code calls
    the createDocument() method on the DOMImplementation interface. For example, the
    following snippet creates a new, empty document with a root element named rootnode:


    ```

    // declare an instance of the DOM Implementation class

    DOM_DOMImplementation impl;


    // create a document with no namespaceURI, a document element

    // named "root", and the default DocumentType

    DOM_Document doc = impl.createDocument(0,"root",DOM_DocumentType());

    ```


    Once the document is created, you can add elements to it or manipulate it other
    ways using the DOM interfaces.


    # Creating Document Content


    Once you create a new document, you can add new document objects to it. The following
    snippet builds a "Hello World" document containing a comment, a hello element,
    and a text string, assuming that the document has already been created as in the
    example above and is stored in a variable doc.


    ```

    // retrieve the document element from a DOM_Document

    // object variable "doc"

    DOM_Element theRoot = doc.getDocumentElement();

    ```


    ```

    // create the comment node and append it to the document

    DOM_Comment theComment = doc.createComment("This is a comment");

    theRoot.appendChild(theComment);

    ```


    ```

    // create the hello element. This will contain our text string

    DOM_Element helloNode = doc.createElement("hello");

    theRoot.appendChild(helloNode);

    ```


    ```

    // Finally, create the text string and append it to the hello element

    DOM_Text theTextStr = doc.createTextNodeNode("Hello World!");

    helloNode.appendChild(theTextStr);

    ```'
