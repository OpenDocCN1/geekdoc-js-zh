  md: "# Chapter 6: Applications 155\n\n# Adding Content to Documents\n\nOnce you\
    \ have obtained a pointer to the DOMDocument interface, you can use it to add\
    \ new document objects to the document. The MSXML parser provides the standard\
    \ DOM interfaces needed to create the various types of document elements. For\
    \ example, to add elements to the newly created document in the previous example,\
    \ the following code could be:\n\n```\nBSTR sNodeName = NULL;\nIXMLOMElement *pElem\
    \ = NULL;\nIXMLDOMNode *pNode;\nIXMLDOMText *pText;\n```\n\n```\n// new node named\
    \ \"rootNode\"\nsNodeName = ::SysAllocString(\"rootNode\")\npDocument->createElement(sNodeName,\
    \ &pElem)\n// append new root node, get back result node\npDocument->appendChild(pElem,\
    \ &pNode)\n::SysFreeString(sNodeName)\npElem->Release();\n```\n\n```\n// new node\
    \ named \"firstNode\"\nsNodeName = ::SysAllocString(\"firstNode\")\npDocument->createElement(sNodeName,\
    \ &pElem)\npNode->appendChild(pElem, &pNode)\n::SysFreeString(sNodeName)\npElem->Release();\n\
    ```\n\n```\nBSTR sText = ::SysAllocString(\"New Text Node\")\npDocument->createTextNode(sText,\
    \ &pNode)\npNode->appendChild(pText, &pNode)\n::SysFreeString(sText)\npText->Release();\n\
    ```\n\nThis code creates a new root node for the document, named \"rootNode.\"\
    \ It then creates an Element named firstNode, which it appends to the root node.\
    \ Finally, it creates a new Text node with the text \"New Text Node,\" which is\
    \ appended as the first child of the node firstNode. The resulting document structure\
