  md: "# Chapter 7: Debugging DOM Applications 177\n\nThe basic rules to follow here\
    \ are simple: first, don’t put code that must always execute into ASSERT() calls;\
    \ and second, use ASSERT() to catch bugs, not garden-variety errors that are going\
    \ to happen in the normal course of the program.\n\n# Getting Fancy with ASSERT()\n\
    \nOnce you get to use the idea of how ASSERT() works and where to effectively\
    \ use it, you can define a bunch of useful, special-purpose ASSERT() functions\
    \ that perform very specific tasks. For example, you can write an ASSERT() that\
    \ checks to see if a node is indeed “valid” node—that is, the nodeType actually\
    \ exists (in the JavaScript case) and it is between 1 (for Element nodes) and\
    \ 12 (for Notion nodes). The ASSERT() function for this JavaScript looks like\
    \ this:\n\n```\nfunction ASSERT_VALID_NODE(objNode)\n{\n  if (objNode == null)\
    \ {\n    alert(\"Invalid node -- node is null\");\n    return;\n  }\n  if (typeof\
    \ objNode.nodeType == \"undefined\") {\n    alert(\"Invalid node -- no nodeType\
