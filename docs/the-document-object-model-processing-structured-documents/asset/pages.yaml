  md: '# Conclusion


    In this chapter, you saw how some simple debugging tools and strategies can make
    finding and eradicating bugs in DOM applications much easier. First, we examined
    the humble ASSERT () function, and you saw how it can be used to force bugs to
    appear sooner in the testing process by making sure that illegal conditions in
    the code are checked and caught quickly. We also looked at ways to make the ASSERT
    () function more specialized for DOM applications by having it check for DOM-specific
    error conditions such as invalid node types and specific nodes in the document.


    Then we looked at a debugging tool called the TraceConsole, which can be used
    to trace output as it happens in an application. Using the TraceConsole API, a
    DOM application can record the logical progression of an application over the
    course of the program''s execution, similar to the way that a web server saves
    statistical information to a log file. After the program has been put through
    few tests, the trace output can be examined to help pinpoint hard-find logic bugs.


    Finally, we looked at DOMDumper, a tool that can display a real-time picture of
    the DOM substructure of any node in the document. Using the Dump () function,
    the DOM Dumper creates an HTML document that displays a document''s DOM beginning
    at a given node and encompassing all of that node children. The DOMDumper can
    be used to investigate the structure of a document at a particular point in time,
    helping to verify that an application is modifying a document in the intended
    way.


    This chapter brings us to the end of Part II, where we''ve seen how the DOM is
    supported in some real-world implementations. In Part III, we''ll use the foundations
    learned in Part I along with our real-world experience gained in Part II to examine
    some practical examples of how the DOM can be used to provide effective user interfaces
    and perform useful document processing in your DOM applications. We''ll also take
    a look at where the DOM is headed in the future.'
