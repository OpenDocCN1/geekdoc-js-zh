    # Node Helper Interfaces: NodeList and NamedNodeMap


    The Core interfaces provides two "helper" interfaces for working with sets of
    nodes: NodeList, which implements an interface for accessing a collection of ordered
    nodes, and NamedNodeMap, which provides support for accessing a collection of
    nodes by name.


