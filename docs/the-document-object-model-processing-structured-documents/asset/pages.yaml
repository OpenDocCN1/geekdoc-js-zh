  md: '# The Document Object Model: Processing Structured Documents


    several utility classes for working with XML documents and data, such as transcoding
    utilities to convert Unicode documents to local machine code and formatting XML
    output.


    In this section, we will examine Xerces’ support for the DOM and take a look at
    how common DOM operations are accomplished using the Xerces API.


    # Where to Get Xerces


    Xerces can be downloaded directly from the Apache XML website, located at http://xml.apache.org/xerces-c/
    (for the C++ version, Xerces-C) and http://xml.apache.org/xerces-j (for the Java
    version, Xerces-J). As of this writing, Xerces-J is at version 1.4.4, while Xerces-C
    is at version 1.7.0.


    Xerces can be downloaded in either source-code form or by binaries-only distribution.
    Prebuilt binaries are available for several platforms, including Windows, Macintosh,
    and several variants of the Unix operating system, such as Linux and Solaris.
    The Xerces parser is also available as part of the Apache Xalan Foundation, another
    open-source package available from the Apache Foundation. Xalan is an XSLT processing
    engine that uses Xerces as its XML parser. When you download and install Xalan
    from the Apache Xalan website (http://xml.apache.org/xalan/), Xerces is installed
    automatically.


    Whether you should use the Java or C++ version of Xerces depends on the application
    you’re writing an application that will be used in a server environment, the Java
    version is probably the better choice. If your application is on the client side
    and is a shrink-wrapped, commercially available application or is using a client
    interface library like MFC, the C++ version is probably the right way to go. Because
    there are several references available that use Java in their examples, this section
    will focus on the C++ version (though each version, of course, provides excellent
    support for Level 2 of the DOM specification). If you’re not a C++ programmer,
    don’t worry: one of the really nice things about Xerces-C is that it is very similar
    to the Java version in design and use. Converting Xerces Java code to use C++,
    and vice versa, is a straightforward process.


    > NOTE

    This section will focus only on the current, official Xerces-C DOM classes. The
    Xerces-C team is in the process of creating a new interface to the Xerces-C API
    called IDOM; this interface is experimental and will not be covered here. The
    Xerces distribution contains some information on this API and some related example
    code, and interested developers should look there for further information on IDOM.


