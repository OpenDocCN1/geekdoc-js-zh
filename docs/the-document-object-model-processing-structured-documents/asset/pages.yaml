    \ of special features you want to provide, and which browser you expect the user\
    \ to be viewing the page in.\n\nIf you’re using Internet Explorer as the target\
    \ browser, the available options are varied; you can bind the XML directly to\
    \ a table control and have the table populate automatically, you can use XPath\
    \ and XSLT to transform the XML code directly into HTML, or you can use the DOM\
    \ to generate the page. In Netscape, you give up the data-bound controls, but\
    \ you can still use the DOM and XSLT.\n\nBinding the XML to an HTML table provides\
    \ a direct solution in IE, but you want to provide some fairly advanced features\
    \ without redesigning the XML structure of"
