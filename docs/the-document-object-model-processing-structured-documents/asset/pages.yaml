    # XPath Support in Today''s Applications


    Microsoft Internet Explorer supports XPath operations in XML documents and XML
    data islands through the use of the selectSingleNode() and selectNodes() methods,
    which are proprietary Microsoft DOM extension methods available on the Node interface.
    To evaluate an expression relative to a particular node (the context node), your
    application calls one of these methods with an appropriate XPath expression. The
    selectNodes() method returns a NodeList containing the nodes that match the given
    XPath expression. It has the following IDL definition:


    ```

    NodeList selectNodes(in DOMString queryStr);

    ```


    The selectSingleNode() method returns a single node that matches the given XPath
    expression. If more than one node match the pattern, then only the first matching
    node is returned. It has the following IDL definition:


    ```

    Node selectSingleNode(in DOMString queryStr);

    ```


