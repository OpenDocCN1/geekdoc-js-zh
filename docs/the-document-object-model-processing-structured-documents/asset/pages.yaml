  md: '# The Document Object Model: Processing Structured Documents


    # Methods


    item


    Syntax:

    Node item(in unsigned long index);


    **index:** Index of the node in the NodeList to return

    **Description:** Retrieves the node in the collection at the given index.

    **Returns:** The node at the given index in the NodeList, or null of the given
    index is out of range

    **Exceptions:** None


    # Interface Notation


    This interface represents a notation declared in the DTD. A notation either declares
    by name the format of an unparsed entity, or is used for formal declaration of
    Processing Instruction targets. The **nodeName** attribute inherited from the
    Node interface is set to the declared name of the notation. The DOM Level 1 does
    not support editing Notation nodes, so all properties therefore read-only. Notation
    nodes do not have parent nodes.


    # Properties


    **publicID**


    **Type:** DOMString

    **Description:** The public identifier of this notation. If the public identifier
    was not specified, this is null.

    **Exceptions:** None


    **systemID**


    **Type:** DOMString

    **Description:** The system identifier of this notation. If the system identifier
    was not specified, this is null.

    **Exceptions:** None'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# Methods


    No methods other than those inherited from the Node interface.


    # Interface ProcessingInstruction


    Represents a processing instruction, which is used in XML as a way to keep processor-specific
    information stored in the document content.


    # Properties


    +   data

    **Type:** DOMString

    **Description:** Represents the content of this processing instruction. This is
    from the first non-whitespace character after the target to the character immediately
    preceding the ?>.

    **Exceptions:**

    NO_MODIFICATION_ALLOWED_ERR Raised if the ProcessingInstruction node is read-only


    +   target (read-only)

    **Type:** DOMString

    **Description:** The target of this processing instruction. XML defines this as
    being the first token following the markup that begins the processing instruction.

    **Exceptions:** None


    # Methods


    The ProcessingInstruction interface has no methods other than those inherited
    from the Node interface.


    # Interface Text


    The Text interface represents the textual content of an Element or Attr node.
    If there is no markup inside an element’s content, the text is contained in a
    single object'
  merge: -1
  pgno: 386
- img_proc: true
  md: 'implementing the Text interface that is the only child of the element. If there
    is markup, it is parsed into a list of elements and Text nodes that form the list
    of children of the element.


    # Properties


    See CharacterData interface.


    # Methods


    # splitText


    Syntax:

    splitText(in unsigned long offset) raises(DOMException);


    offset: Character offset at which to split the text content of the node

    Description: Breaks this Text node into two Text nodes at the specified offset,
    keeping both in the tree as siblings. This node then only contains all the content
    to the offset point. A new Text, which is inserted as the next sibling of this
    node, contains all the content at and after the offset point.


    Returns: The newly created Text node

    Exceptions:


    +   INDEX_SIZE_ERR Raised if the specified offset is negative or greater than
    the number of characters in data


    +   NO_MODIFICATION_ALLOWED_ERR Raised if this node is read-only'
