- img_proc: true
  md: '# Yet Another Standard?


    So why do we need another standard? As the XML language has grown in importance
    over the past several years, so, too, has the need for a standardized way of accessing
    the information stored in XML documents. The DOM provides a standardized set of
    methods for adding, removing, changing, and examining a document''s elements for
    navigating a document''s structure. It is important to note that the term document
    is used here in a very broad sense. Even though much of the information is presented
    via XML would normally be seen as raw data, XML information is presented as a
    document, and the DOM can be used to manage this information.


    Before the advent of the DOM, companies that wanted to exchange information using
    XML had to use their own proprietary APIs for getting the data within these documents;
    now, vendors can provide a standardized set of methods and objects that represent
    the logical structure of their information regardless of its representation. In
    fact, the DOM does not explicitly specify regarding how data must be stored internally
    to an application. Vendors are free to use whatever internal storage mechanism
    they feel most appropriate for their data. The DOM attempts to only describe how
    data is represented to the outside world from a user of that application''s point
    of view. Content authors can then write these standard APIs instead of having
    to learn the proprietary interfaces offered by a large number of different application
    vendors, which, in turn, enhances and increases the interoperability of the Internet.


    # The DOM Philosophy


    As with any large design project, the DOM Working Group had to choose a reasonable
    scope for their work, let the API get out of control and to accomplish everything.
    In addition, the group met face-to-face only every six weeks, so the design had
    to be modular enough to support collaboration among disparate and remote colleagues.
    The group also realized early on that there would be a variety of DOM API users,
    and satisfying them all would be no easy task.


    Faced with these realities, the DOM Working Group had to decide on a simple, flexible
    design philosophy for the DOM specification to succeed in being adopted by vendors.
    The principles were kept simple and realistic: be be open and extensible, make
    the spec as easy to understand and implement as possible, and stay language and
    platform neutral.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Chapter 1: Introduction to the DOM


    # Design Philosophy


    The DOM Working Group, composed of the W3C member companies interested in working
    together on the DOM specification, decided early on to adhere to a basic philosophy
    regarding the DOM: specify only what needs to be specified. In other words, focus
    only on the important parts of document manipulation without worrying about the
    details of how a program came to be in possession of the document object itself
    or a host of other platform-and implementation-specific details. The details of
    the implementation of these and other capabilities were intentionally left to
    the individual vendor companies, with the understanding that later versions of
    the DOM would attempt to address them.


    In addition, the W3C members realized that platform and language neutrality would
    play a key part in the DOM''s acceptance by application vendors. Thus, the DOM
    was designed to be used with any programming language; and today there are language
    bindings for almost every popular language, including Java, JavaScript (ECMAScript),
    Python, Perl, C/C++, and others. These bindings are available from well-known
    companies such as Oracle and IBM, as well as popular open-source movements, like
    the Apache Foundation.


    The DOM was also designed to be open and extensible; that is, a vendor may add
    methods and properties outside of those that the DOM specification defines, yet
    still be considered to compliant with the DOM spec. Microsoft, for example, provides
    several Internet Explorer-specific extensions to the DOM API for developers''
    convenience without breaking compliance with the base DOM specification.


    # Object-Oriented vs. Flat Views of the DOM Interfaces


    The DOM specification takes a couple of different approaches towards specifying
    interfaces for manipulating XML/HTML documents: a traditional, hierarchical *inheritance*
    approach, and a simpler, *flattened* approach. The inheritance approach works
    like any good object-oriented programmer would expect: there exists a hierarchy
    of interface classes, with each subclass inheriting the interfaces of its superclass.
    The flattened approach takes the view that all document manipulation can be accomplished
    using the Node interface without requiring the programmer to cast a node reference
    to another type of object.


    According to the specification, this decision was made because casting objects
    from one type to another can be an expensive operation in some programming environments,
    such as Java and Microsoft''s COM. The DOM Working Group realized that the DOM
    API would be used in performance-critical environments'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'where such operations could have a materially adverse impact on system performance.
    Thus, the decision was made to allow a significant amount of the DOM''s functionality
    to be used via the Node interface.


    Still, the DOM Working Group considers the hierarchical view of the API to be
    the “primary” view of the DOM, with the added functionality of the Node interface
    as “extra” functionality that developers can use at their discretion. The spec
    notes that this leads to some redundancy; even though there is a generic property
    called nodeName on the Node interface, there is a still property called tagName
    on the Element. Both of these properties contain the same value; however, the
    Working Group considers supporting both as being worthwhile (politics are hard
    to escape, especially when you''re trying to satisfy as many constituencies as
    the DOM Working Group is).


    # History of the DOM


    Before the DOM became an official W3C specification, the web community had started
    to develop ways of creating page-based script programs using languages like JavaScript
    that could be used among different web browsers. This early work led to the development
    of what was called Dynamic HTML, which was primarily used for such things as richer
    user interfaces than plain HTML could provide on its own. The origins of Dynamic
    HTML were in the web browsers, so its development was heavily influenced by the
    needs of web developers and the capabilities of the browsers themselves. For example,
    there was no way of dealing with selections of text in a document because the
    browser was not an editor and didn''t need to worry about things.

    When the DOM Working Group was formed at the W3C, application vendors from other
    domains, as XML and HTML editors, joined this early group of developers in manipulating
    documents in different ways. Several of these vendors already had experience with
    SGML (Standard Generalized Markup Language), an early forerunner of XML and HTML,
    and this experience helped influence the DOM''s development. Many of these vendors
    had developed their own proprietary interfaces for working with XML and HTML documents
    to serve their specific needs, such as document editing, and these interfaces
    have, in turn, influenced the DOM''s evolution.


    # The DOM on the Client


    The DOM got its start on the client side, becoming available around the time of
    Netscape 2 and Internet Explorer 3. Initially, these early implementations were'
