    \ type of meal: breakfast, lunch, or dinner, which is delimited by an <entree>\
    \ tag. Each <entree> tag has an optional attribute, vegetarian, which indicates\
    \ whether the entrée is vegetarian. If no vegetarian attribute is present, then\
    \ the item is assumed to be not vegetarian. Each <entree> tag in a section contains\
    \ child tags that describe the name of the item and its price. The <item> and\
    \ <price> tags each contain a single text node that describes the item name and\
    \ the price for the item.\n\nFrom this XML structure, your DOM code generates\
    \ the appropriate HTML and fills out the table in the page body with the results.\n\
    \n# Generating the Menu HTML\n\nOnce the menu XML code has been embedded in the\
