    \ simply require changing the selectColor () method to perform whatever function\
    \ was desired for the newly selected color.\n\n# In-Place List Editing\n\nLists\
    \ are common in web pages—common enough that the HTML language provides several\
    \ different list types, such as definition lists, ordered (numbered) lists, and\
    \ unordered (bulleted) lists. Lists are great for displaying information in a\
    \ columnar form, especially information that lends itself to list format, as such\
    \ sorted information. Unfortunately, HTML contains no built-in way for a user\
    \ to dynamically edit the content of a list. For example, a to-do list application\
    \ needs the user to add and delete list items, as well as edit the text description\
    \ of each item. In addition, the application might allow the user to specify the\
    \ priority of each to-do item and its required completion date.\n\nYou can achieve\
