  md: "# The Document Object Model: Processing Structured Documents\n\nthe page. This\
    \ ID attribute can be used to bind the XML data island to a data-driven HTML tag\
    \ in IE 5 and later versions (discussed shortly).\nThe XML element is parsed and\
    \ stored within the DOM tree just as any other element, so you can use the DOM\
    \ to interact with the contents of the data island. For example, to count the\
    \ number of <person> tags within the data island, you can use code like the following,\
    \ which will produce an alert displaying the number 4:\n\n```\nvar xmlDoc = document.getElementById('myDataIsland');\n\
    var tagList = xmlDoc.getElementsByTagName('person');\nalert(tagList.length);\n\
    ```\n\n# External Data Islands\n\nIn addition to specifying an XML data island\
    \ inline, the XML tag can refer to an external XML document using the SRC attribute.\
    \ The syntax for this is\n\n```\n<XML ID=\"myDataIsland\" SRC=\"http://localhost/docs/myxmldoc.xml\"\
    ></XML>\n```\n\nThe URL for the SRC attribute can be either a local file, as in\
    \ the previous example, or it can be a path to an XML file on a remote computer.\
    \ Using this type of syntax, the XML document can be kept independent of the HTML\
    \ page, which allows for easier updating of the document's data.\n\n# Using Data-Bound\
    \ Controls\n\nInternet Explorer supports binding XML data islands to certain types\
    \ of HTML constructs, such as tables. This is accomplished by using the dataSrc\
    \ and dataF1ld attributes of the HTML element that you want to bind to data. The\
    \ dataSrc attribute refers to the data island's ID attribute, preceded by a hash\
    \ symbol (#). For example, to bind an HTML table to the XML data island myDataIsland,\
    \ the syntax would be as follows:\n\n```\n<table dataSrc=\"myDataIsland\">\n \
    \ table contents ...\n</table>\n```\n\n> NOTE This only works on the Windows version\
    \ of Internet Explorer. Data-bound controls do not work in the Macintosh version\
    \ of IE.\n\n![](img/dd1ccaaeafde765845e42d14df9ed839_301_0.png)"
