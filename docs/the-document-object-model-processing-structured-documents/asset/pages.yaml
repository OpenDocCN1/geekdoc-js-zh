    # Determining Whether a Node Has an Ancestor of a Given Type\n\nSuppose your program\
    \ needs to determine whether a node is contained within another node. For example,\
    \ in HTML, image tags can be contained within anchor tags, which allow them to\
    \ serve as hyperlinks to other URLs, as in:\n\n```\n<a href=\"http://your.url.here.com\"\
    ><img src=\"myimage.jpg\"></a>\n```\n\nIf your application needs to treat a node\
    \ differently depending on whether it is contained by another type of node, you\
    \ can use the algorithm in the following code listing to determine if a node has\
    \ a particular ancestor:\n\n```\nBoolean isContainedBy(Node n, DOMString nodeName)\n\
    ```\n\n```\n{\n  Node testNode;\n  testNode = n.getParentNode();\n  while (testNode)\
    \ {\n    if (testNode.getNodeName().equals(nodeName))\n      return true;\n  \
    \  testNode = testNode.getParentNode();\n  }\n  return false;\n}\n```\n\nThis\
