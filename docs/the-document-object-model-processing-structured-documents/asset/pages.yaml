  md: '# 314 The Document Object Model: Processing Structured Documents


    and store them within a specially provided "slot" on the Node interface, such
    as the Apache Xerces DOM implementation provides two Node interfaces for working
    with data objects attached to document nodes: setUserData() and getUserData(),
    which (for Xerces-C) have the following function definitions:


    ```

    // Xerces-J setUserData and getUserData interfaces

    public void setUserData(java.lang.Object data);

    public java.lang.Object getUserData();

    ```


    ```

    // Xerces-C setUserData and getUserData interfaces

    void setUserData(void*);

    void *getUserData(void);

    ```


    These methods allow a Xerces-based application to attach an arbitrary block of
    data to a given node in the document (see the Xerces section of Chapter 6). The
    Xerces implementation has a few drawbacks; First, when a node is cloned, the Xerces
    parser explicitly does not clone the data with it, preferring to leave this as
    something the application should take care of. Second, there can be only one data
    block attached to a node at any given time, if an application wants to attach
    more than one piece of data to the node, it has to come up with its own management
    scheme to get and set the correct blocks. For example, in the Java version of
    Xerces, the application might choose to store a Vector object on the node and
    then use it to manage an array of other data objects.


    DOM Level 3 seeks to remedy these shortcomings and officially add the setUserData()
    and getUserData() methods to the Node interface. The new methods have the proposed
    IDL definition:


    ```

    UserData setUserData(in DOM key, in DOMUserData data, in UserDataHandler handler);

    UserData getUserData(in DOM key);

    ```


    The DOM solution differs from the Xerces-style solution in two important ways.
    First, it allows more than one piece of user data to be associated with a node
    by using a key-value approach. Each piece of data is associated with a key, which
    is used to identify a particular piece of data. When the data is stored in the
    node via the setUserData() method, the key is used as an indexing mechanism to
    locate it, much the same way that associative arrays work in JavaScript. When
    the data needs to be retrieved, the key is supplied to the getUserData() method
    and the data object is returned. Figure 11-1 illustrates how the data is stored
    within the node.'
