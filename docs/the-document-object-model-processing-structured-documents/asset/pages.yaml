    \ of this function, but unfortunately Netscape does not, so the script uses its\
    \ own version. Given the test node and the node that will be the container, the\
    \ code successively examines each parent of the test node to see if it is the\
    \ container node:\n\n```\nwhile (testNode.parentNode)\n{\n  testNode = testNode.parentNode;\n\
    \  if (testNode == containerNode)\n    return true;\n}\nreturn false;\n```\n\n\
    If the container node is found as one of the ancestors of the test node, the function\
    \ returns true. Otherwise, the top of the document is eventually reached, and\
