    +   * **Load/Save** Specifies interfaces for serializing a document to from persistent
    storage.


    +   * **XPath** Provides interfaces for using the XPath 1.0 syntax for declaratively
    locating nodes within a DOM document.


    # Conventions Used in the DOM Specification


    When reading the W3C DOM specification, there are some important issues that you
    need to keep in mind. First, because the DOM was intended to be used in a multitude
    of programming environments and implementation languages, the DOM Working Group
    had to select an interface definition language (IDL) with which to define the
    interfaces that are language- and platform independent. The Working Group chose
    to use the OMG (Object Management Group) IDL as specified by version 2.3.1 of
    the CORBA specification. The OMG IDL is used only as a way of specifying these
    interfaces and should not be used to infer an association with any particular
    implementation language. The following is an example of an interface definition
    using OMG IDL:


    ```

    Interface DOMImplementation {

    boolean hasFeature(in DOMString feature, in DOMString version);

    // Introduced in DOM Level 2:

    DocumentType createDocumentType(in DOMString qualifiedName, in DOMString publicID,
    in DOMString systemID)

    raises(DOMException);

    ```'
