  md: '# 18 The Document Object Model: Processing Structured Documents


    In this chapter, we examine the structure of a DOM document and the various types
    of objects the DOM uses to represent a document''s various parts. We also introduce
    the core data types and interfaces that the DOM uses to represent information
    that a DOM application needs to manipulate. In particular, we closely examine
