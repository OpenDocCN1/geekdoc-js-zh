  md: "# Chapter 10: Client Processing of Data-Driven Documents 269\n\nThe sortTable()\
    \ code sets the gbAscending global variable just as in the list sorting example,\
    \ but in this case also remembers which column is being sorted by storing the\
    \ index of the column in gbCol:\n\n```\ngbAscending = sortDir;\ngbCol = whichCol;\n\
    ```\n\nNow an array is created to hold all of the TR nodes. This is the array\
    \ that will be sorted:\n\n```\nvar theSortedRows = new Array(numRows);\n```\n\n\
    After the array has been created, each <TR> tag is copied into it using the clone()\
    \ method of the DOM's interface. The clone is performed as a deep copy, so that\
    \ all of the TR node's child nodes, such as the TD and Text nodes, are copied\
    \ as well. This will minimize the amount of code needed to replace the original\
    \ data with the sorted data later:\n\n```\nvar i;\nfor (i=0; i < numRows; i++)\
    \ {\n    theSortedRows[i] = aRows[i].cloneNode(true);\n}\n```\n\nAfter the array\
    \ has been filled with the TR nodes, the sort() method is called for the array.\
    \ As in the list sorting example, the only argument is the name of the callback\
    \ function to perform the actual sorting:\n\n```\ntheSortedRows.sort(sortCallback);\n\
    ```\n\n# Performing the Sort\n\nThe Array class's sort() method will repeatedly\
    \ call the sortCallback() function that was given as an argument to compare two\
    \ items together. In the list sorting example, this was easy because each item\
    \ in the array was a JavaScript string that could be compared to another. In the\
    \ case of the table sorting, each item will be a document fragment consisting\
    \ of a TR node with a number of TD and Text child nodes.\n\nTo compare each item,\
    \ the sortCallback() retrieves the <TD> tag representing the column that is being\
    \ sorted from each of the TR nodes. It does this using the gbCol global variable\
    \ to index the TD array for each TR:\n\n```\nvar coll = a.getElementsByTagName(\"\
    TD\")[gbCol];\\var col2 = b.getElementsByTagName(\"TD\")[gbCol];\n```"
  merge: -1
  pgno: 292
- img_proc: true
  md: "# 270 The Document Object Model: Processing Structured Documents\n\nAfter extracting\
    \ the <TD> tag, the function retrieves the text from the Text node of the column:\n\
    \n```\nvar text1 = coll.firstChild.data;\nvar text2 = col2.firstChild.data;\n\
    ```\n\nNow, the function can perform the comparison, just as in the list sorting\
    \ example. If the function returns > 0, the first argument will sort before the\
    \ second argument. If the function returns < 0, the second argument will sort\
    \ before the first argument. If the function returns 0, the two items are equal:\n\
    \n```\nif (text1 < text2)\n  return gbAscending ? -1 : 1;\nelse if (text1 > text2)\n\
    \  return gbAscending ? 1 : -1;\nelse return 0;\n```\n\nAfter all of the items\
    \ have been compared, the array of TR nodes will have been rearranged into the\
    \ proper order for the selected column.\n\n# Replace the Original Data with the\
    \ Sorted Data\n\nOnce the <TR> tags have all been sorted, the only remaining task\
    \ is to copy them back into the table structure. This is a little trickier than\
    \ the list example because you're replacing an entire structure of nodes and not\
    \ just a text string. To make things a little easier, the code removes any <<tbody>>\
    \ tag and replaces it with a new, empty one:\n\n```\noTable.removeChild(oTBody);\n\
    TBody = document.createElement(\"TBODY\");\noTable.appendChild(oTBody);\n```\n\
    \nOnce the <tbody> has been replaced, the function iterates over the array of\
    \ sorted <TR> tags and appends each one, child tags and all, to the new <tbody>:\n\
    \n```\nfor (i=0; i<numRows; i++) {\n  TBody.appendChild(theSortedRows[i]);\n}\n\
    ```\n\nThat's it! The new table rows are in place, and the screen is updated to\
    \ show the newly sorted table."
