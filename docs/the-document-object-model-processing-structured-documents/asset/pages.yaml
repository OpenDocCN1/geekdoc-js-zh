  md: '# 70 The Document Object Model: Processing Structured Documents


    ![](img/dd1ccaaeafde765845e42d14df9ed839_93_0.png)


    **Figure 3-9** Logical view vs. physical view


    Like other DOM collection objects, NodeIterators and TreeWalkers contain live
    node references; that is, their logical views reflect any changes made to the
    physical subtree they represent. The key difference between the two, however,
    is how they respond to such changes. NodeIterators will attempt to maintain their
    location relative to a sequence of nodes when the sequence changes. TreeWalkers
    will maintain their current location relative to their current node and stay attached
    to that node if it moves to a new context due to an external action on the tree
    by another part of the DOM program. These behaviors will be discussed in more
    detail later in this chapter.


    # NodeFilters


    NodeFilters are objects that are used to “filter” the node selection process.
    They can be associated with both NodeIterators and TreeWalkers, but they do not
    do any node navigation themselves. If a NodeFilter is associated with an iterator
    or walker, the associated traversal object applies the filter before returning
    the next node. The filter can decide either to accept or reject the node. If the
    node is accepted, the traversal object returns it to the caller. Otherwise, the
    node is skipped if it were not there, and the traversal object looks for the next
    node (this is how the logical view is generated from the physical view).


    NodeFilters do not have to perform any node navigation or traversal themselves,
    so they are easy to write and reused among several different traversal objects.
    The DOM itself does not provide any built-in NodeFilters. You can think of the
    NodeFilter interface as an “abstract base class” in C++ or an “interface definition”
    in Java that DOM programs can use as a starting point to build their own filters.'
