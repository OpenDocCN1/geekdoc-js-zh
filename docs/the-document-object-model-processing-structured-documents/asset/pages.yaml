    # Internet Explorer–Specific Methods


    Internet Explorer 6 has dozens of methods that are not part of the DOM standard,
    but they are useful to developers who are working within an IE-only environment
    or who are willing to sacrifice some code portability in exchange for the convenience
    or added features that they provide. In most cases, the functionality provided
    by one of these methods can be implemented in other browsers using existing DOM
    methods. Some of the most useful methods that Internet Explorer explores contains(),
    swapNode(), applyElement(), and replaceNode(). A full list of methods can be found
    on the Microsoft Developer Network site at msdn.microsoft.com/.


    *'
