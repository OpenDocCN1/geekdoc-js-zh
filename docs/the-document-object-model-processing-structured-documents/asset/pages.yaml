    \ it might just be easier to define a data structure and attach it to a node rather\
    \ than write a new subclass.\n\nLevels 1 and 2 of the DOM did not provide an official\
    \ way to do this, though certain DOM implementations allowed applications to take\
    \ arbitrary data pointers"
