    # Replacing Nodes


    replaceChild() method replaces one node with another. It has the following interface
    definition:


    ```

    Node replaceChild(in Node newChild, in Node oldChild) raises(DOMException);

    ```


    If the newChild is a DocumentFragment object, the old node is replaced by all
    of the newChild''s children, which are inserted in the same order as they appear
    under newChild. If the newChild node already exists somewhere else in the document
    tree, it is first removed from its current location before being inserted into
    its new location.

    This snippet demonstrates replacing node D with node B:


    ```

    nodeC.replaceChild(nodeB, nodeD);

    ```


