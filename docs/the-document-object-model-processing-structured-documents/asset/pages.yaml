  md: '# 302 The Document Object Model: Processing Structured Documents


    The W3C DOM is an evolving standard, designed from the beginning to be improved
    upon with time. The currently published version of the DOM is Level 2, which was
    adopted as a W3C Recommendation on November 13, 2000 (except for Level 2 HTML,
    which is currently in last status as of April 2002). The DOM Working Group is
    currently working on Level 3, which is available as a set of working draft publications
    on the W3C web site (www.w3.org/DOM). One of the major changes in the way that
    the DOM has been published since Level 2 is that separate DOM modules can now
    be put forth as recommendations on an individual basis to speed up the adoption
    process.


    This chapter takes a look at some of the new additions and changes to the DOM
    that are being developed for Level 3, along with some other trends and technologies
    that are shaping and influencing the development of the next version of the DOM
    standard. Some of these efforts are well underway, while some others are still
    ideas that are just now being discussed for future implementation in the DOM.


    > The information in this chapter is based on working draft publications and other
    in-progress work from the W3C and other sources, which may change before officially
    adopted as W3C recommendations or other accepted standards. Some of the information
    in this chapter may not become part of the standard at all. This information should
    be used only as a high-level guide to where the DOM API may be going in future
    releases. Readers are encouraged to check the W3C website for the most up-to-date
    information.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_325_0.png)


    # Where Is the DOM Headed?


    When DOM Level 1 was published, it provided a base reference for implementing
    a set of functionality that allowed applications to manipulate the contents of
    structured documents. Level 1 only allowed certain basic document operations,
    such as creating and deleting nodes, working with their contents, and traversing
    the document tree. Everything was left to implementation specific, even operations
    that might be considered obvious, such as loading and saving documents.


    DOM Level 2 included support for more types of document operations and content,
    such as events and styles. These additions give developers standardized ways of
    handling user events and working with Cascading Style Sheets (CSS) information
    within XML documents.'
