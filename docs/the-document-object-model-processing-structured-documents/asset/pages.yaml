  md: '# Introduction


    Web applications have come a long way since the release of Netscape Navigator
    2.0, the first web browser to have a scripting language embedded in it. That language,
    JavaScript, allowed developers for the first time to manipulate their web pages
    directly in the user’s browser. From those humble beginnings as the Document Object
    Model, a full-fledged specification of standard methods and properties for working
    with HTML and XML data.


    The need for a standard API for working with these types of documents became clear
    almost immediately after HTML and XML technologies began to catch up with the
    Internet development community. The World Wide Web Consortium (W3C) realized that
    the types of operations needed to work with these documents were common enough
    that they could be specified in a portable way, allowing different document-processing
    application vendors to offer a standard interface. This, in turn, allowed developers
    to focus their energies on building their applications rather than figuring out
    which browser or platform they need to port their work to.


    With this book, you use the DOM to work with HTML and XML data in a variety of
    settings, including web browsers, server-side applications, and consumer client
    applications. The DOM is language independent, so you don’t need to worry about
    learning an unfamiliar programming language. The DOM is also available in most
    of the web browsers in use today, such as Internet Explorer 5 and later and Netscape
    Navigator 6 and later (and Mozilla 1.0 and later), so finding a place to test
    your applications should be easy. You also learn the different ways of manipulating
    documents and their content, how to provide the user with new kinds of user interfaces,
    and how to lighten the server’s load by moving some processing to the client.


    # Who Should Read this Book


    Every day, XML and HTML are becoming more and prevalent in an ever-widening variety
    of applications. Developers who want to quickly create applications that leverage
    these technologies can use the Document Object Model to save themselves'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'a lot of time and trouble associated with learning one vendor’s proprietary
    interfaces for working with these kinds of structured documents. In this book,
    you’ll find out how to


    +   - Work with the common data types and structures needed to create professional
    DOM applications

    - Discover the structure of a document dynamically and navigate its elements

    - Discover and change any part of a document’s content

    - Build DOM applications that work across multiple browsers and other implementations

    - Use the browser-based DOM to create entirely new kinds of user interfaces and
    navigational elements

    - Offload server-side processing onto the client—for example, sorting data and
    deriving new data from existing data

    - Embed XML data in web pages and present it to the user at runtime

    - Take advantage of common algorithms and processes to avoid reinventing the wheel

    - Effectively debug DOM applications in browsers and other implementations


    # How to Use This Book


    This book is organized into 12 different chapters in three parts. Part I introduces
    the DOM, explains important concepts, and introduces the basic structures that
    the DOM uses to represent a document. It also introduces the DOM interfaces and
    reviews its functionalities and purposes. Part II addresses real-world DOM usage,
    from typical DOM algorithms to the DOM support available in various web browsers
    and other application packages. The subject of debugging DOM-based applications
    is also covered. Part III examines practical uses of the DOM and shows examples
    of how to take advantage of the DOM in your applications, from providing client-side
    data sorting to performing complex data manipulation directly in the client.


    If you aren’t already familiar with the DOM or its concepts, then you should read
    Chapters 1 and 2 for an introduction and high-level overview of the DOM, along
    with what specifically does not address and leaves as implementation detail. Otherwise,
    you can skip directly to Chapter 3 for a look at how DOM interfaces are used to
    perform common document operations.'
