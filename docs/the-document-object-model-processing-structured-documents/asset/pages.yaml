  md: 'The DOM Level 2 Event model takes care of these and other event features that
    DOM applications can use in an Events module–compliant browser. In this section,
    we introduce the DOM Level 2 Events interface and illustrate how it can be used
    to provide advanced interactivity in your web pages.


    > NOTE

    Currently, only Netscape Navigator 6.x implements the DOM Level 2 Events interface.
    Internet Explorer has a similar event model but does not follow the W3C standard.


    # # Events Flow Through a Document


    The term event flow is used to describe the process by which an event originates
    in a particular implementation of the DOM and travels through the document. Using
    the DOM methods, events can be handled in different ways: either locally at the
    element where the event originates, or higher up in the document tree at one of
    the element''s ancestors.


    Every has an associated event target. This is usually a particular node in the
    document at which the event originates. In addition, each event target may have
    one or more event listeners, which are triggered when an event is fired for the
    target. Figure 5-3 illustrates how an incoming event is processed by a target’s
    event listeners.


    There are two directions in which an event may flow in the document tree: up or
    down. The direction in which an event flows is dictated by what type of event
    listeners are registered for a given event. An event listener may designate itself
    as using event capture, in which case it will be the recipient of event before
    any of its descendants. This is how an event can flow downward in the document
    tree. Some types of events trigger listeners on their targets and then move upward
    through the


    ![](img/dd1ccaaeafde765845e42d14df9ed839_140_0.png)


    **Figure 5-3** An event triggering an event target’s listeners'
