  md: '# 312 The Document Object Model: Processing Structured Documents


    The async attribute specifies whether the document is loaded synchronously or
    asynchronously. When a document is loaded asynchronously, it means that control
    of the application is given back to the calling function before the load() function
    actually completes loading the document. In this case, your application should
    define an event handler for the document''s load event, which will fire when it
    has finished loading. On the other hand, when loading a document synchronously,
    everything stops until the load() finishes loading the document and returns control
    to the caller. This attribute defaults to false, meaning that documents are loaded
    synchronously by default.


    The abort() immediately interrupts the loading process of the document (if it
    is being loaded asynchronously). The document is cleared of any partial parsing
    result that may have taken place to the point where abort() was called and all
    the document content is discarded.


    The load() method will replace all the current contents of the document with the
    result of parsing the URI. If the value of the async attribute is false, the function
    immediately returns control to the caller. The document will fire a load event
    when it has finished loading, or a ParserError if the load fails. If this method
    is called on a document that is already loading, loading process is aborted and
    a new loading process is started with the new URI.


    The loadXML() method replaces the contents of the document with the parsed result
    of the XML string from the source argument. This method is always called synchronously,
    and it always returns UTF-16 encoded DOMString. The source argument must contain
    a legal, fully formed XML document. The method returns true if the source string
    was successfully parsed, or false if there was a parsing error.


    The saveXML() method saves the contents of the document to a DOMString. If the
    snode is null, the whole document is serialized. If node represents a node in
    the document, the given node is written to the string.


    Both Internet Explorer 6 and Netscape Navigator 6 currently support the load()
    method; however, only IE supports the async attribute (the W3C Level 3 spec says
    that supporting asynchronous loading is optional). Interestingly, even though
    the async attribute is not present in Netscape 6, the application loads documents
    asynchronously by default. IE also supports the loadXML() method for creating
    a document from a string XML. Neither application supports the saveXML() method,
    though IE6 has an xml property on the document object that contains a string of
    XML code that represents the entire contents.


    Even Netscape 6 doesn''t support the loadXML() or saveXML() methods, you can emulate
    them with some JavaScript code. To implement the saveXML() method, you need to
    create an XMLSerializer instance and then use it to serialize the document to
    a string, in the following code.'
