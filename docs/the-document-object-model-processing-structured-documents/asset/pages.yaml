    \    }\n    doEndNodeProcessing(n);\n}\n```\n\nIn this listing, parent nodes are\
    \ processed first (by the doStartNode Processing() function); then child nodes\
    \ are processed. Depth-first traversals follow the pattern shown in Figure 4-1.\n\
