  md: "# Chapter 7: Debugging DOM Applications 171\n\nIn this chapter, we're going\
    \ to take a look at some useful utilities and strategies that can take advantage\
    \ of in your own DOM applications. The examples in this chapter will emphasize\
    \ browser-debugging, though you should find the information useful regardless\
    \ of what language or platform you're developing.\n\n# Be Assertive: Use ASSERT()\n\
    \nOne of the best ways to rid your applications of bugs is to expose them as early\
    \ as possible during the development and testing process. The faster you can exterminate\
    \ them your program. One yet effective debugging tool that most C++ programmers\
    \ have using for quite some time is the humble ASSERT () function (technically,\
    \ a macro in the C++ language). This function evaluates a Boolean condition and\
    \ “asserts” that the outcome is true. If everything is OK, the program continues\
    \ on its way. If the Boolean condition is not met, it displays an error message.\
    \ The typical syntax for calling ASSERT () is simple:\n\n```\nASSERT(someBooleanCondition);\n\
    ```\n\nWhen an ASSERT() condition fails the test, there is usually some kind of\
    \ feedback present to the application user, such as the dialog in Figure 7-1.\
    \ Let’s take a closer look at how the ASSERT () function is actually defined.\n\
    \n# Defining ASSERT()\n\nThe ASSERT () function is defined a differently for different\
    \ platforms. In JavaScript, the ASSERT () function can be defined like this:\n\
    \n```\nfunction ASSERT(bCondition, strMsg)\n{\n  if (!bCondition)\n    alert(\"\
    ASSERTION FAILURE \" + strMsg);\n}\n```\n\nWe,’ve defined ASSERT() to take an\
    \ optional second argument, the message to display in the event that the condition\
    \ evaluates to false. In addition, because JavaScript doesn’t support the concept\
    \ of macros, you have to define ASSERT () as an actual function. In practice,\
    \ this function would probably be defined in an external .js file and then included\
    \ in the source file where it is used by a <SCRIPT> tag."
