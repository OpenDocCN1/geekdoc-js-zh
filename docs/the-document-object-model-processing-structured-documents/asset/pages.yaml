  md: '# The Document Object Model: Processing Structured Documents


    As discussed in the previous chapter, the DOM API''s Node interface provides several
    methods and properties for working with node information, such as obtaining a
    node''s content, discovering its position with respect to other nodes, and manipulating
    its child nodes. In this chapter, we''ll examine how to use the DOM API''s Node
    interface to navigate, and manipulate a document''s nodes and content. You''ll
    see how properties and methods are used to work with nodes in the context of structured
    XML and HTML documents. We''ll also look at how to handle copying nodes from one
    document to another, and we''ll finish up with an examination of the DOM API''s
    Traversal module, which makes processing documents and parts of documents easier.


    # Working with Nodes


    Structured documents (such as XML and HTML documents) consist of a collection
    of nodes, so you can use the properties and methods of the Node interface to perform
    many kinds of common types of document inspection and manipulation. Using the
    Node interface, you can discover the content of nodes; their positions in the
    document tree; and the nature of their surroundings, such as their parent, child,
    and sibling nodes.


    Consider the HTML document shown in Listing 3-1.


    Listing 3-1 Sample HTML Document


    ```

    <HTML>

    <HEAD>

    <TITLE>Sample Document</TITLE>

    <!-- This is a comment -->

    </HEAD>

    <BODY>

    <B>This is bold text</B>

    <I>This is italic text</I>

    <U>This is underlined text</U>

    </BODY>

    </HTML>

    ```


    Figure 3-1 shows the corresponding DOM tree structure for this document.'
