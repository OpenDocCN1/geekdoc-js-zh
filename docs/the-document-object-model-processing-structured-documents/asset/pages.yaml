  md: '# The Document Object Model: Processing Structured Documents


    The DOM Level 3 Load and Save module aims to standardize the methods used for
    performing these types of document persistence functions. The good news here is
    that the Load and Save module interfaces and methods are modeled on many of the
    already existing load and save implementations we use in DOM applications such
    as Apache Xerces, Microsoft Internet Explorer 6, and Netscape Navigator 6, so
    learning the new interfaces should be a relatively straightforward task.


    The Document Load and Save Module defines nine new major interfaces and a few
    smaller, ancillary interfaces for use when saving and loading XML documents. Table
    11-2 lists the major interfaces and describes each.


    | Load and Save Interface | Description |

    |--- |--- |

    | DOMImplementationLS | Provides the factory methods that are necessary for creating
    the objects used for loading and saving documents. |

    | DOMBuilder | An interface to an object that is capable of building a DOM document
    tree by reading data from a variety of input sources, such as files, URLs, and
    strings of text. |

    | DOMInputSource | Specifies a single source of data from which the application
    can read data. |

    | DOMResolver | Provides an interface through which applications can redirect
    references to any external entities. |

    | DOMBuilderFilter | Allows an application to examine document nodes as they are
    built when the document is being parsed. |

    | DOMWriter | Provides an API for writing a document out to an XML file. |

    | DOMWriterFilter | Allows an application to examine document nodes as they are
    being written to the output. The application can use this interface to affect
    which nodes get written out. |

    | DocumentLS | Extends the base Document interface with methods that allow loading
    and saving of an existing document''s contents. |

    | ParserEvent | Specifies the type of error event that is fired when an error
    is encountered when the document is being parsed. |


    Table 11-2 The DOM Level 3 Load and Save Module Interfaces'
