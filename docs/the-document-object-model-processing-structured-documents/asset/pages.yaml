    core W3C DOM specification, but they can make certain node and other programming

    tasks less cumbersome.


    The selectNodes() and selectNode() methods available on the

    IXMLDOMNode interface can be used to select a single node or create a NodeList

    of nodes using an XPath expression. For example, the code snippet selects

    all of the data in a document:


    ```

