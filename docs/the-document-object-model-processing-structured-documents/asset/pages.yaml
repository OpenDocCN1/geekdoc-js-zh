  md: '# The Document Object Model: Processing Structured Documents


    nt Document Object Model was mostly limited to browsers. However, with interest
    in XML growing by leaps and bounds every day, it has become clear that there is
    a need for developers to process XML and other structured documents in many places
    than has the tradition. As a result, DOM support is being added to an increasing
    number of applications and with good reason: its standard way of manipulating
    information in all kinds of structured documents flattens the learning curve,
    promotes code reuse, and reduces development time.


    In the previous chapter, we explored the DOM support provided by the major web
    browsers today (Internet Explorer, Netscape Navigator, and Opera Software’s Opera)
    using their native JavaScript language bindings. In this chapter, we’ll take a
    look at how the DOM is supported and accessed in several popular application packages,
    both standalone and embedded.


    # DOM Implementations Aren’t Just for Browsers


    Although the DOM traces its origins to the web browser, it is useful in many applications
    in which a web browser is not the ideal implementation form factor. Developers
    are beginning to realize the advantages of having a common way to manipulate structured
    information, and DOM support has started showing up in more and more non-browser-applications.
    After all, the DOM essentially gives developers a standard way of manipulating
    all kinds of data that fits a structured hierarchy, and many applications have
    a common need to do so.


    Consider one of the simplest, ubiquitous, yet overlooked examples: storing preferences
    or configuration information for an application. Most applications have some sort
    of configuration data that they store in a persistent state. This information
    is often manipulated in response to the user’s changes and needs because this
    kind of information is almost always stored in a well-defined, structured format
    (such as categories, settings, and values) it a perfect candidate for using the
    DOM to manage it. Major and minor categories for the configuration settings can
    be represented by XML tags, and the individual settings can be represented by
    XML tags, tag attributes, or a combination of both. Changing, adding, and removing
    settings requires simply calling the right DOM APIs to modify the given nodes.


    Some of the more popular nonbrowser DOM implementations available today can be
    found for both client- and server-based applications. Some of these implementations'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'are available standalone libraries that can be integrated into an application,
    whereas others are available as embedded implementations intended for use by application
    plug-ins and extensions.

    In this chapter, we will examine the DOM implementations in products developed
    by the Apache Software Foundation (the Xerces parser), Microsoft (MSXML), and
    Macromedia (Dreamweaver).


    # # Standalone vs. Embedded DOM Implementations


    Standalone DOM implementations are not tied to or embedded within a larger application,
    such as a web browser. These implementations are usually provided as statically
    or dynamically linked libraries that can be used by applications that need to
    work with structured information, and there are several such standalone DOM implementations
    available today. They are freely downloadable and can be integrated into a development
    project for zero or limited cost. Two of the more popular packages are the Apache
    Software Foundation''s Xerces parser and Microsoft''s MSXML parser. Each of these
    parser packages provides comprehensive support for the W3C DOM Level 1 Core specification.
    In the case of Xerces, DOM Level 2 support is also provided.


    Embedded implementations, on the other hand, are much like browser implementations
    where the DOM architecture is hosted and exposed by the application. In this case,
    the DOM is usually accessed through the hosting application''s extensibility architecture,
    which may be implemented in one or more languages, such as C++, Java, JavaScript,
    Perl, and so on. There are several such applications available that expose a DOM
    to their extensions, such as Macromedia''s Dreamweaver HTML.


    # # The Apache Xerces Parser


    The Apache Foundation''s Xerces Parser, commonly known as Xerces (named for the
    Blue Xer butterfly), is available as a free download from the Apache Software''s
    website (see the following section for specifics). Xerces is an XML parser that
    follows the DOM Level 2 specification and can be integrated into applications
    that need to manipulate structured information. It is available in both C++ and
    Java implementations. In addition to the core DOM APIs, Xerces provides'
