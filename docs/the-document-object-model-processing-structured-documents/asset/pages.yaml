    +   The publicID, systemID, and internalSubset properties are equal.


    +   The entities NamedNodeMap structures are equal.


    +   The notations NamedNodeMap structures are equal.


    For example, consider the following document fragment:


    ```

    <Node attr1="first attr" attr2="second attr"/>

