  md: '# Chapter 10: Client Processing of Data-Driven Documents 271


    # Post-Processing Server-Generated Documents


    So far, the examples you''ve seen have dealt with static HTML pages whose contents
    were known at the time the processing script was written. However, there will
    be times when your application will need to perform post-processing of documents
    that were created by a script on the server. For example, you might segment your
    application to split the responsibilities for the data presentation from the server,
    which will extract data from a database and generate the basic HTML, and the client,
    which will perform data transformation and display locally. This type of technique
    is often referred to as “screen-screening,” which means post-processing data that
    has already been generated for presentation by another source.


    Let’s use the document in Listing 10-5 as an example of the kinds of post-processing
    you can do within the client. This listing contains a table that represents the
    closing prices of the stock ticker for an imaginary company, JOEM, for seven days.
    Assume that this document was created by a server-side script that reads the prices
    from a database and generates the raw HTML output for display in the browser.


