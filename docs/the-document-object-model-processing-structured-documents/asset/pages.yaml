    You can find more information on this subject on Microsoft’s MSN website (http://msn.microsoft.com)\
    \ or on the Mozilla site (www.mozilla.org).\n\n# Attaching Application-Specific\
    \ Data to Nodes\n\nDevelopers often find it useful to be able to attach application-defined\
