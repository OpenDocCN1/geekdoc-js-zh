  md: "# 162 The Document Object Model: Processing Structured Documents\n\nThere is\
    \ a global object in Dreamweaver’s JavaScript namespace that represents the application\
    \ object, called dreamweaver (or for short). Many of the application’s properties\
    \ and methods are accessed using the dreamweaver object, as you’ll see in the\
    \ following section.\n\n# Using the Dreamweaver DOM\n\nUsing the Dreamweaver DOM\
    \ API is strikingly similar to using the DOM in a regular browser, with some notable\
    \ exceptions. Because Dreamweaver is an editing application, not just a viewing\
    \ application, there are methods and properties available to do things such as\
    \ manipulate the current selection in the document, create new documents, and\
    \ load and save documents from disk.\n\nIn this section, we will examine how common\
    \ DOM operations are accomplished using the Dreamweaver API. To create the command\
