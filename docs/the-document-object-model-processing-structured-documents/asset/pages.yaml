  md: '# Creating New Nodes


    Of course, it probably won''t be enough for your application to inspect and rearrange
    existing nodes. At some point, you''ll need to create new ones to insert into
    the document. The DOM provides different ways of doing this. You can create new
    nodes from scratch or duplicate existing nodes in the document.


    # Using the Factory Methods


    Usually, in object-oriented programming languages, you create a new object by
    using the new operator with the type of object you want to create, like this:


    ```

    var obj = new some();

    ```


    This doesn''t work with the DOM because there are some language bindings that
    do not support the new operator. To make these cases easier to handle, the DOM
    uses special methods called factory methods that are responsible for creating
    new nodes. It is up to the implementation to handle the actual memory management
    involved with creating these new nodes.


    Each type of node has an associated factory method. For example, to create a new
    node, you would write the following:


    ```

    var newTextNode = document.createTextNode("This is the node content");

    ```


    After a node has been created, it is in a state of limbo; it is not actually inserted
    into the document tree anywhere but is just floating in space. You need to attach
    it to the document tree using one of the node manipulation methods discussed earlier,
    such as appendChild().


    Table 3-5 lists the different factory methods that the DOM provides for creating
    new Document nodes.


    | Method | Description |

    | --- | --- |

    | Element createElement(in String tagName) | Creates a new Element of the type
    supplied by tagName. |

    | DocumentFragment createDocumentFragment() | Creates a new empty DocumentFragment.
    |

    | Comment createComment(in String data) | Creates a new Comment whose content
    is given by the data argument. |


    **Table 3-5** Factory Methods for Creating New Document Nodes'
