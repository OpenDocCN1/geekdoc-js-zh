    # How Nodelators Respond to Document Changes


    The contents of a document can change while a Nodelator is active, it must have
    a well-defined set of rules that govern its behavior as nodes are added or removed
    from the document tree. According to the DOM specification, document changes do
    not invalidate a Nodelator. In fact, the only thing that invalidates an iterator
    is calling its detach() method.


    To maintain a consistent state, Nodelators use their reference nodes to determine
    what happens when the document structure changes. Generally speaking, iterators
    always try to stay "close" to their reference node. Reference nodes are selected
    based upon which an iterator''s position is before or after its reference node.


    If a document''s changes don''t invalidate the reference node, the iterator doesn''t
    have to worry about anything. Consider the following examples, in which nodes
    are inserted into and removed from the document tree in Figure 3-10. First, here''s
    a node being inserted into the tree between node2 and node3 when node2 is the
    reference node:


    | node1 | node2 | node3 | node4 | node5 | node6 |


    The iterator always stays close to its reference node, so the insert takes place
    between the iterator''s position and node3.'
