  md: '# 280 The Document Object Model: Processing Structured Documents


    The tag in the body section binds itself to the data island using this ID as the
    value of a dataSrc attribute, preceded by a # character. The dataSrc attribute
    is available on a variety of HTML constructs within IE, such as tables, select
    lists, frames, layers, and so on.


    Once the table has been bound to a data source, it is populated using an HTML
    element that supports the dataField property, which refers to an individual field
    within the XML data. In this example, the XML data has the <people> tag as its
    document element is the root node. Under the root node, there are several <person>
    tags, each of which represent the series of data “records” within the data island.
    Each of these records has one field, <name>, which represents the person’s name.
    Thus, to fill the table with the names of the people, the TD must refer to the
    name field of each record. However, TDs cannot be bound directly to data because
    they don’t support the dataField property, so an element that must be enclosed
    within the TD, such as a SPAN. Each TD will be looped over using each successive
    recursive in the XML data to fill out the table with data.


    When this is viewed in Internet Explorer, the table is populated with all of the
    data records for the XML data island, as shown in Figure 10-6.


    More information on using XML data islands within Internet Explorer can be found
    on Microsoft’s developer network website at http://msn.microsoft.com/ (search
    on the term “XML Data Islands”—it will provide more than enough to start with).


    ![](img/dd1ccaaeafde765845e42d14df9ed839_303_0.png)


    **Figure 10-6** A table populated with XML data in IE'
