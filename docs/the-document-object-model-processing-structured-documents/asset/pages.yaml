    # Getting to Know the API


    The Dreamweaver application supports a very rich and robust API for creating all
    kinds of extensions with different capabilities and intended uses. For the purposes
    of this section, we will focus on one kind of Dreamweaver extension that allows
    developers the most power and flexibility when working with documents: the Dreamweaver
    Command extension.


    Command extensions are written as HTML files with embedded JavaScript and/or JavaScript
    contained within external .js files. The HTML file can contain an optional HTML
    <FORM> tag, which, if present, signals the application that the extension has
    a user interface. When the user invokes the command, the extension''s form (if
    it has one) is displayed in a modal dialog box, where the user is allowed to enter
    values for whatever form extension developer has made available. The extension
    can then use this input to perform its work. Commands are not required to have
    such a form, however, and if they do not, whatever JavaScript code is contained
    within the onLoad event handler of the HTML file’s <body> tag is executed when
    the user invokes the command.'
