  md: "# Chapter 5: Browsers 103\n\nas well as enhanced document processing programs\
    \ that work across multiple\nDOM-compliant browsers.\n\nIn this chapter, we will\
    \ examine the major web browsersnavavailable today: Microsoft Internet Explorer\
    \ 6, Netscape Navigator 6, and Opera 6.\nAll the major browsers available today\
    \ support at least some of the W3C DOM\nsification. Microsoft Internet Explorer\
    \ 6 and Netscape 6.x provide the most\ncomprehensive support. Opera 6 supports\
    \ some of the more important DOM API\nmethods but does not provide a full implementation.\
    \ Although the majority\nof the code examples in this chapter will work in all\
    \ three of the major browsers,\nsome will not; those do not be noted.\n\n# Microsoft\
    \ Internet Explorer 6\n\nWith the introduction of Internet Explorer 6, Microsoft\
    \ provides full support for\nDOM Level 1 in its flagship web application. Internet\
    \ Explorer 6 provides\nfull support for the Core and HTML interfaces of DOM Level\
    \ 1, along with CSS\n(Cascading Style Sheets). IE6 supports the DOM Level 2 method\\\
    getElementById(), along with several nonstandard properties and methods\n developers’\
    \ convenience that are not included in the W3C specification for\nDOM Level 1.\n\
    \nInternet Explorer 6 fully supports the DOM Level 1 interfaces, so scripts can\
    \ take\nfull advantage of the DOM’s capabilities, including creating page elements\
    \ dynamically\nat runtime, discovering and changing the structure and content\
    \ of a page, and modifying\npage’s appearance through style sheets.\n\n# Netscape\
    \ Navigator 6.x\n\nThe venerable Navigator web browser produced by Netscape (now\
