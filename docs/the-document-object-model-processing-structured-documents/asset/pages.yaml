    # # Conclusion


    In this chapter, we introduced some of the basic node processing algorithms that
    commonly appear in DOM applications. We first covered the basic depth-first and
    breadth-first node traversal algorithms and discussed their differences. Next,
    we introduced and discussed position-based and content-based algorithms, and you
    saw examples of each. In particular, we examined algorithms that showed how to
    tell if a node is contained within another node, how to see if a node contains
    another node, and how to retrieve lists of nodes based on node type and attribute
    values.


    In the next chapter, we''ll look at the DOM implementations provided by the more
    popular web browsers in use today, such as Internet Explorer 6, Netscape 6, and
    Opera 6.'
