    \ > 12) {\n    alert(\"Invalid node -- nodeType is invalid!\");\n    return;\n\
    \  }\n}\n```\n\nThis version of ASSERT(), named ASSERT_VALID_NODE, accepts a single\
    \ argument and determines whether the node argument is, in fact, a valid node.\
    \ The first test is whether an object was even specified. If the argument is null,\
    \ you definitely don’t have a valid node. The next test makes sure that the nodeType\
    \ property for JavaScript—Java and C++ wouldn’t need to do this). If the supplied\
    \ object has no nodeType property, the node can’t be valid. Finally, you check\
    \ to make sure that the nodeType property is inside the range of acceptable node\
    \ types."
