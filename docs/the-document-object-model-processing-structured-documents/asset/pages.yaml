  pgno: 31
- img_proc: true
  md: '# Chapter 1: Introduction to the DOM


    intended to allow web-scripting programmers to manipulate the contents of web
    pages, usually for things animation or richer user interface construction. Thus,
    these initial advancements in browser capabilities were referred to as Dynamic
    HTML, the ability to dynamically alter the appearance of HTML code in the browser.


    As the browsers improved, did their APIs for manipulating documents. However,
    there was no clear standard for doing so, and the programming interfaces for the
    two main browsers began to diverge. The W3C formed a working group to develop
    a standard way of working with structured documents, and it released its first
    recommendation in 1998. Microsoft and Netscape, the two main browser vendors,
    began working to bring their applications into compliance with the DOM specification;
    and with the release of Internet Explorer 6 and Netscape Navigator 6, the two
    companies achieved complete support for DOM Level 1. Other browser vendors followed,
    such as Opera, a compact, multiplatform browser, and Konqueror, a popular web
    browser for the Linux platform.


    # The DOM on the Server


    It was not long before certain realized that the benefits of the DOM could be
    applied on the server side as well as the client side, and DOM implementations
    began appearing for server-side products. One well-known example is the Xerces
    parser, available from the Apache Foundation, the open-source group responsible
    for the Apache web server. The Apache team implemented support for the DOM in
    their Xerces parser, available in Java and C++ source-code versions and additional
    language bindings for Perl and COM. The Xerces parser can be used for client applications,
    and also can be used to provide support for parsing and working with structured
    XML documents on the server.


    # Levels of the DOM


    The DOM is organized into separate levels, each providing its own methods and
    definitions. These levels define certain capabilities and services that a user
    of that level can expect from an application that supports the APIs defined in
    that level. It is tempting to think of the different DOM levels as “versions”
    of the DOM; however, they are not versions in the true sense of the word. Rather,
    they define a certain level of functionality that an application provides to its
    users; a developer who is working with a Level 1–compliant DOM implementation
    can expect less functionality and features than a Level 2–compliant implementation.'
