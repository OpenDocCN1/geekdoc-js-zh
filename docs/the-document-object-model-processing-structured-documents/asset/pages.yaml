  md: '# Appendix: DOM Core Level 1 API Reference 339


    Attribute values are determined as follows: if a value has been explicitly assigned
    to an attribute, it has that value. Otherwise, the DTD specifies a default value
    for the attribute, that default value is the attribute’s effective value. If neither
    condition is true, the attribute has no value and does not exist on the element
    until explicitly created.


    # Properties


    **name (read-only)**

    **Type:** DOMString

    **Description:** Represents the name of the attribute.

    **Exceptions:** None


    **specified (read-only)**

    **Type:** Boolean

    **Description:** Indicates whether the attribute was explicitly assigned a value
    in the source document.

    **Exceptions:** None


    **value**

    **Type:** DOMString

    **Description:** When retrieved, returns the value of the attribute as a string.
    When set, a new Text node is created for the attribute containing the unparsed
    text content of the string.

    **Exceptions:** None


    # Methods


    No methods other than those inherited from the Node interface.


    # Interface CDATA


    CDATA sections are used to escape blocks of text containing characters that would
    otherwise be processed by the XML parser as markup. CDATA sections cannot be nested,
    and they do not have any child nodes. According to the DOM specification, the
    primary purpose of a CDATA section is for including material such as XML fragments
    without needing to escape all the delimiters.'
