    # The DocumentFragment Interface


    The DocumentFragment interface was added as a "lightweight" way to extract portions
    of a document and manipulate them without having to populate another whole object.
    The DOM specification notes that a Document object could be used to perform such
    manipulations; however, documents may have the potential to be very heavy objects
    (depending on the implementation) that don''t readily lend themselves to use.
    It''s natural to use a node for something like this and a lightweight object could
    be used, so the DocumentFragment interface was created.


    When DocumentFragments are inserted as child nodes of another node, the children
    of the DocumentFragment (and not the actual DocumentFragment object) are inserted
    into the target node.


    DocumentFragments are comprised of zero or more child nodes that represent subtrees
    that define the structure of the document that they are part of. The child nodes
    of a DocumentFragment do not need to be well-formed XML documents. For example,
    a DocumentFragment may consist of a single comment node, which does not represent
    a well-formed HTML or XML document.


    The DocumentFragment interface has the following IDL definition:


    ```

    interface DocumentFragment : Node {

    };

    ```


    The DocumentFragment interface does not contain any properties or methods other
    than those it inherits from the Node interface.


    # The Element Interface


    The Element interface represents an element in an HTML or XML document. Elements
    inherit from the Node interface, so the attributes property of the Node interface
    can be used to retrieve an element’s attributes.'
