    # Importing Nodes from Other Documents


    Sometimes, DOM programs need to use or operate on nodes from different documents.

    For example, you might want to copy the information in a node contained in one

    document into another document. The DOM Level 2 API provides the importNode()

    method for this purpose, which can be found on the Document interface. It has
    the


    ```

    Node importNode(in importedNode, in boolean)

    raises(DOMException);

    ```


    As its name implies, the importNode() method imports a node from another

    document into the document from which this method is called. The node that is
    returned

    from this method has no parent (that is, its parentNode property is set to null)

    until it is inserted into the document tree, but it is owned by the calling document

    (the one doing the importing). This operation does not change the source node
    in

    the target tree—the importNode() method makes a copy of the source node, optionally

    copying all of its children nodes (if the deep argument is true).


    The node being imported may be entering a document that has a different DTD

    (Document Type Definition) from the source document from which it came, so the

    importing process affects different types of nodes in different ways. Table 3-6
    lists

    the different node types and the behavior of imported nodes of that type.


    | Node Type | Importing Behavior |

    | Element | Attribute nodes of the source element that have their specified property
    set to true are imported and attached to the generated element. Default attributes
    are not copied, though they are automatically assigned to the element if the importing
    document defines default attributes for this element type. If the deep argument
    is true, all of the element''s descendants are copied, and the resulting nodes
    are assembled into a corresponding document subtree. |


    Table 3-6 Imported Node Behavior of Different Node Types'
