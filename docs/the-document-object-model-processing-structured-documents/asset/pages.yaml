  md: '# Chapter 5: Browsers 107


    in one of two ways or a combination of both. The first is by using the DOM methods
    Getelelementsbytagname(), Getelementbyid(), and Getelementsbyname(). The getElementsByTagName()
    method is part of Core DOM Level 1, the getElementById() method is part of Core
    DOM Level 2 (although it is supported by most current browsers), and getElementsByName()
    is part of HTML DOM Level 1. The second way is to use the properties firstChild,
    lastChild, childNodes, and so on, which are part of the DOM Level 1 Node interface.
    Because none of the current major browsers implement the NodeListIterator or TreeWalker
    interfaces, they can''t be used to navigate the document.


    # Examining Single Nodes


    To obtain a reference to a single node in the document tree using the Node interface
    properties, you can chain any many of the Node interface''s accessor properties
    together as you need to build a path to the desired node. For example, consider
    the following document:


    ```

    <HTML>

    <HEAD>

    <TITLE>Sample Document</TITLE>

    </HEAD>

    <body>

    <P>Paragraph 1</p>

    <P>Paragraph 2</p>

    <P>Paragraph 3</p>

    </body>

    </HTML>

    ```


    > NOTE Opera 6 does not support the firstChild, lastChild, previousSibling, or
    nextSibling properties, so the next three examples will not work in Opera 6.


    To obtain a reference to the <P> tag that defines paragraph 1, the code snippet
    that follows can be used:


    ```

    var oParal = document.documentElement.lastChild.firstChild;

    ```


    The lastChild node of the document element is the <BODY> tag (the firstChild would
    be the <HEAD>), whose firstChild node is the <P> tag


