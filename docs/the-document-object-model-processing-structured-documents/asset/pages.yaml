    \ to retrieve the text field objects and set their contents to the calculated\
    \ high, and average price values.\n\n# Working with Embedded XML Data in Web Pages\n\
    \nThe potential of client-side data processing becomes even more evident when\
    \ with embedded XML. Both Internet Explorer and Netscape Navigator allow XML code\
    \ fragments to be embedded in a web page or referenced from an external XML file.\
    \ DOM applications can use these XML data “islands” to provide true-driven web\
    \ pages entirely on the client browser.\n\n> NOTE\nThere is currently no accepted\
    \ W3C standard for working with embedded XML in HTML web pages, although Microsoft\
    \ is working with the W3C to define one. There is no word yet on or if this will\
    \ be adopted as an official W3C recommendation, but stay tuned.\n\nA data island\
    \ is a section of XML code that is either directly embedded within the web page\
    \ (called “inline” XML) or referenced via a separate XML file (called “external”\
    \ XML). For example, the following code fragment illustrates an inline XML data\
    \ embedded in the body section of an HTML file:\n\n```\n<body>\n<xml id=\"myDataIsland\"\
    >\n  <people>\n    <person>\n      <name>John</name>\n    </person>\n    <person>\n\
    \      <name>Paul</name>\n    </person>\n    <person>\n      <name>George</name>\n\
    ```\n\n![](img/dd1ccaaeafde765845e42d14df9ed839_298_0.png)"
