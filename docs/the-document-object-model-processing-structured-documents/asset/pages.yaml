  md: "# Obtaining a Reference to the Document\n\nScripts do not need to do anything\
    \ special to obtain a reference to the document. The JavaScript DOM binding provides\
    \ a document keyword that represents the document object of the document in the\
    \ current browser window. Browser scripts are always run in the context of being\
    \ embedded in a document, so there is always a document to refer to. Scripts use\
    \ this keyword to operate on the document itself and obtain references to its\
    \ child nodes.\n\nFor example, consider the following code snippet, which will\
    \ display the title of the document in an alert box when a button is clicked:\n\
    \n```\n<HTML>\n<HEAD>\n<TITLE>The DOM Explorer Page</TITLE>\n<SCRIPT LANGUAGE=\"\
    JavaScript\">\nfunction handleClick() {\n  // \"document\" is a global keyword\
    \ that refers to the document\n  // \"title\" is a property of the DOM1 HTMLDocument\
    \ interface\n  alert(document.title);\n}\n</SCRIPT>\n</HEAD>\n<BODY BGCOLOR=\"\
    #FFFFFF\">\n<h1>The DOM Explorer</h1>\n<FORM NAME=\"form1\" METHOD=\"post\" ACTION=\"\
    \">\n  <INPUT TYPE=\"BUTTON\" NAME=\"Button\" VALUE=\"Button\"\n  onclick=\"buttonClick()\"\
    >\n</FORM>\n</body>\n</html>\n```\n\nWhen the button is clicked, an alert displaying\
    \ the title of the document appears, as shown next.\n\n![](img/dd1ccaaeafde765845e42d14df9ed839_128_0.png)"
