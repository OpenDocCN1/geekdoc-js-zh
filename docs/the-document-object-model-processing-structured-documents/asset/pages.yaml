  md: '# Acknowledgments


    Let me say right up front that this is my first full-length book, and I am very
    grateful to have worked with a wonderful team at McGraw-Hill/Osborne. Most of
    my writing up until this point had been in pursuit of much smaller-scale projects,
    and the McGraw-Hill/Osborne team made sure the book went smoothly.


    In particular, I want to thank Jim Schachterle for seeing the potential for a
    book about the Document Object Model, for believing in me, and for getting the
    project approved. Next, thanks to Timothy Madrid for making sure chapters stayed
    on schedule, and to Laura Stone for all the editing help and for putting up with
    all those times I changed my mind about something mid-stream.


    Special thanks go to Andrew Woolridge, my technical editor, whom I''ve known since
    the early Dreamweaver days. When I had to find someone with the technical ability
    to review pages of JavaScript, C++, and Java code, Andrew came through.


    I couldn''t have completed this book without the help of everyone mentioned above.
    You hold the completed work of all of us in your hands; I hope it helps create
    the next generation of web applications.'
