  md: "# Chapter 11: Future Directions for the DOM 311\n\nAfter reading Table 11-2,\
    \ you're probably asking the obvious question: why are there so many interfaces\
    \ for loading and saving documents? The simple answer is that loading and saving\
    \ DOM documents is not always as easy as it may seem at first blush. Consider,\
    \ for example, the seemingly simple task of loading an XML file and creating a\
    \ document tree from.\n\nRecall from Chapter 6 the process of using the Xerces\
    \ parser to load a document from a file; that is the closest analogy to the new\
    \ DOM interfaces work. First, there has to be a way to get the necessary interfaces\
    \ for creating the objects to the loading and parsing of data. This is usually\
    \ done by a \"factory method\" that creates an object that represents the input\
    \ source. Once the parser factory method has been called to create the object\
    \ that reads or writes the data source, an object needs to be created that parses\
    \ and builds a document. Because the document source might refer to an external\
    \ entity, such as a DTD or other Abstract Schema, an object will be needed to\
    \ fix the schema and cause it to be loaded. an error occurs during the loading\
    \ or parsing process, there needs to be an error handler to report the errors.\
    \ Suddenly, loading a document doesn't seem so simple!\n\nIn most of the DOM Level\
    \ 3 Load and Save interfaces are to serve the same functions that the ones in\
    \ the standalone DOM implementations as Xerces already provide. For example, the\
    \ DOMBuilder, DOMInputSource, DOMEntityResolver, and ParserErrorEvent interfaces\
    \ in Level 3 are formalized versions of the Xerces API's DOMParser, InputSource,\
    \ EntityResolver, and ErrorHandler interfaces. Implementations that allow creating\
    \ and loading documents from scratch will need to provide these interfaces for\
    \ their applications.\n\nFortunately, there are many common instances in loading\
    \ and saving XML is, in fact a simple process. Because browser-centric DOM applications\
    \ already have a document created and available to them, along with a built-in\
    \ way of reading data from a URL, they will usually need to deal with the simplest\
    \ of the interfaces, DocumentLS. The DocumentLS interface provides four methods\
    \ for loading and saving from an existing document. According to the W3C specification,\
    \ it is expected that each DOM implementation will have a way of using a binding-specific\
    \ mechanism to cast the regular Document interface to a DocumentLS interface methods.\
    \ It has the following IDL specification:\n\n```\ninterface DocumentLS {\n   \
    \ attribute boolean async;// raises DOMException on setting\n    void abort();\n\
    \    boolean load(in DOMString URI);\n    boolean loadXML(in DOMString source);\n\
    \    DOMString saveXML(in Node node) raises (DOMException);\n}\n```"
