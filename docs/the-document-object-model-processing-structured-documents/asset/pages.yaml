    Contained within the template is some literal HTML code that will be included
    in the output document, along with the <xsl:value-of> tag. This XSL tag means
    "take the value of the tag that matches your select attribute and insert it here."
    The select attribute uses an XPath expression to determine which node in the source
    document will supply the value. Here, the node is the <hello> tag.


    Now, you need to associate the XSL stylesheet file "hello.xsl" with the source
