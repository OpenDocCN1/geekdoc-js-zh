    > > NOTE

    The DOM specification defines certain operations as implementation-specific functions,
    such as obtaining a reference to the Document node. Some implementations, such
    as browser-based JavaScript, provide a global "document" object; others (such
    as Xerces and Macromedia of Dreamweaver) provide API methods for retrieving the
    document object from the application or parser. You should refer to the documentation
    for your particular DOM implementation for information.


    # A Word About Namespaces


    The DOM Level 1 interfaces do not deal with XML namespaces. Namespace support
    was added in DOM Level 2. According to the W3C DOM Working Group, developers should
    start using the namespace-aware methods in their new DOM applications; the old,
    non-namespace-aware methods are left mainly for backward compatibility and are
    considered deprecated. However, many DOM implementations'
