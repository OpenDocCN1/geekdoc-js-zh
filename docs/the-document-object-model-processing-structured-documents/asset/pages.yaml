    Table 3-1 lists the values of the Node interface properties for the Document node.
    Because the Document node is the root of the DOM structure, and because documents
    can have only one Document node, this node has no ownerDocument, previousSibling,
    nextSibling, or parentNode; thus they are all null.


    | Node Property | Value |

    |---|---|

    | ownerDocument | null |

    | previousSibling | null |

    | nextSibling | null |

    | parentNode | null |

    | firstChild | Element ("HTML") |

    | lastChild | Element ("HTML") |

    | nodeName | "document" |

    | nodeValue | null |

    | nodeType | 9 (Document node) |


    **Table 3-1** Node Properties for the Document Node'
