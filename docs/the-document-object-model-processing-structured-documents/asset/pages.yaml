  md: '# Chapter 2: How the DOM Represents Structured Documents


    ![](img/dd1ccaaeafde765845e42d14df9ed839_44_0.png)


    Figure 2-1 Document tree diagram


    Each box in Figure 2-1 is a node in DOM terminology. A node is an object representation
    of a particular element in the document’s content. Nodes have special names, depending
    on where they are located in the document tree and what their position is relative
    to other nodes.


    All documents have a root node, which is the node located at the base of the tree
    structure. In Figure 2-1, the root node is the box representing the <HTML> tag.
    If a node has one or more nodes below it, these nodes are referred to as child
    nodes of the given node, and each of these children is a descendant of its parent
    node. The node represented in the figure by the <HEAD> tag is a child of the <HTML>
    node, and in turn, has a child node that represents the <TITLE> tag. This parent-child
    relationship between nodes is used and referred extensively throughout the DOM
    API. Nodes that have no children of their own are called leaf nodes, and they
    are the nodes located at the furthest reaches of the tree. The text nodes that
    represent the content of the <B>, <I>, and <TITLE> tags in the figure are leaf
    nodes.


    Continuing with the parent-child relationship metaphor that share the same parent
    are called sibling. In Figure 2-1, the <BODY> and <HEAD> tags are sibling nodes.
    If two nodes descend from the same node somewhere in the tree structure, they
    are said to have a common ancestor node. Figure 2-2 highlights the common ancestor
    nodes shared by the nodes represented by the <B> and <I> tags, which are the <BODY>
    and <HTML> tags.'
