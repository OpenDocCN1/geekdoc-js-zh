    \ tracing(\"++-- Timer Stopped: \" + endTime + \"\\n\");\n  tracing(\"++-- Time\
    \ Difference: \" + (endTime-g_TimeStart) + \"\\n\");\n}\n```\n\n# NOTE\n\nJavaScript\
    \ is an interpreted language, so a script's execution speed will depend largely\
    \ on the power of the machine on which it is running and what other processes\
    \ are running concurrently. Because of this, the timer functions should only be\
    \ used to determine an approximation of relative performance; these routines do\
    \ not provide any type of specific accuracy in your measurements.\n\nFor example,\
