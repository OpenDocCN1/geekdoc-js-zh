    \ this:\n\n```\n// . . code from the previous 11 cases\ncase 12:\n// do case 12\
    \ stuff;\nbreak;\ndefault:\nASSERT(FALSE); // should never get here normally\n\
    break;\n```\n\nNow, should this switch statement ever try to execute the default\
    \ case, an ASSERT would automatically be raised because the only way the code\
    \ can reach this point is if an illegal value had been given earlier.\n\n# When\
    \ Not to Use ASSERT()\n\nIn general, the ASSERT () function should be used to\
    \ catch illegal conditions in your code. In other words, use ASSERT() to make\
    \ sure that things are what you expect them to be, such as legal values for a\
    \ function's arguments. Don't use ASSERT() to try and trap conditions that are\
    \ honest-to-goodness error conditions that can arise in your program under perfectly\
    \ normal circumstances and must be handled by your application.\n\nA good example\
    \ of when not to use an ASSERT () statement looks like this:\n\n```\nfunction\
    \ f()\n{\n  var age;\nASSERT((age = getAgeFromUser()) >= 21);\n}\n```\n\nThere\
    \ are two problems with this code. First, it uses an ASSERT () to make sure that\
    \ the user entered a value greater than equal to 21. However, it's entirely possible\
    \ and likely that the user may enter an age that's less than 21. This isn't a\
    \ bug in the code; it's a situation that your application needs to anticipate\
    \ and handle correctly. For example, the age may not be mandatory, and hence can\
    \ be ignored. On the other hand, if it is mandatory, the user should be prompted\
    \ to enter it before continuing. The second problem is that the code detects this\
    \ condition tries to be clever and save space by wrapping the ASSERT () statement\
    \ and the code that retrieves the input into one line. The problem here is that\
    \ if the ASSERT () function is disabled for some reason, such as building a release\
    \ version of the application, the line won't get executed because it will evaluate\
    \ to an empty statement."
