  md: '# Chapter 1: Introduction to the DOM 5


    DOM documents are represented by a tree structure, with each point in the tree
    called a node, as shown in the following example. Suppose you have a typical HTML
    document, such as:


    ```

    <HTML>

    <HEAD>

    <TITLE>This is a document.</TITLE>

    </HEAD>

    <BODY>

    <B>This is some bold text!</B>

    <I>This is some italic text!</I>

    </BODY>

    </HTML>

    ```


    This HTML code can be represented as a tree structure, as illustrated in Figure
    1-1. This figure neatly illustrates the relationship between different tags in
    the HTML document, much like a family tree. At the top, or root of the tree, is
    the <HTML> tag itself. Underneath the root, the other tags become children of
    the root tag. These child tags can, in turn, have children of their own; for example,
    the <HEAD> tag is clearly a child of the <HTML> tag; and the <TITLE> tag is, in
    turn, a child of the <HEAD> tag. Child tags that share the same parent are said
    to be siblings of each other. The DOM specification uses this type of notation
    and terminology extensively in its API.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_28_0.png)


    Figure 1-1 Document tree diagram'
  merge: -1
