    **Important Notes About NodeFilters** There are some important things to keep
    in mind when creating and using NodeFilters. The first is that you should avoid
    code for a NodeFilter that can cause exceptions to be thrown. The DOM cannot prevent
    this from happening, so NodeFilter behavior during an exception must be well defined.
    The DOM specification states that NodeIterators and TreeWalkers do not catch exceptions
    that are thrown by NodeFilters. Instead, they allow the exception to propagate
    up to the application code. For Iterators, the nextNode() and previousNode() methods
    will call NodeFilter to execute and propagate any exceptions that are thrown in
    the filter. For TreeWalkers, the firstChild(), lastChild(), nextSibling(), previousSibling(),
    nextNode(), previousNode(), and parentNode() methods will invoke the NodeFilter
    and propagate any exceptions thrown inside the filter.


    The second thing to remember is that NodeFilters should not modify the contents
    of a document. Again, the DOM cannot prevent this and does not provide any special
    processing to handle this case, though it goes against the spirit of what NodeFilters
    are intended to do. It is interesting to note that NodeFilters still accept a
    node even if it is removed from the document, which will cause the node to be
    returned to the caller. The caller might then try to operate on the node, which
    is no longer in the document tree. This can easily lead to confusing behavior,
    so the DOM specification urges programmers to leave all tree processing to the
    code that is outside the filter.


    The third thing to remember is that NodeIterators and TreeWalkers apply their
    whatToShow before applying the filter. If a node is skipped over by the whatToShow
    flag settings, the filter will not be called for the node. The type of behavior
    that is used to skip over nodes using the whatToShow mask is similar to that of
    FILTER_SKIP. The node is skipped, but its child nodes will still be considered.
    This is true even if the associated filter would have returned FILTER_REJECT'
