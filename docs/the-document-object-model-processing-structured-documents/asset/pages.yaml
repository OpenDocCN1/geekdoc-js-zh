    # DOM Interface Inheritance Tree


    Figure A-1 shows the inheritance relationships among the various Core DOM Level
    1 interfaces.


    The Attr interface represents an attribute node on an Element node. Typically
    the permissible values for an attribute are specified by a Document Type Definition
    (DTD) file. Attributes inherit from the Node interface, but they are not actually
    children of the Element node that they are attached to, and they are not considered
    part of the Document tree by the DOM. For this reason, previousSibling, andparentNode
    properties are always null.


