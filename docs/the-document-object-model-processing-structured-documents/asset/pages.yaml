    by the DOM spec, means that the nodes contained in a node collection are directly
    affected by changes to the node in the document tree. For example, if a particular
    node is in a certain node collection and that node is somehow changed in the document
    by another part of the DOM program, then that change is immediately reflected
    in all NodeLists and NamedNodeMaps that contain a reference to that node.


