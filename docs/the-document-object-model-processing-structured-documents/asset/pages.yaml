    # Interface Node


    The Node interface represents the primary, basic type of object present in DOM
    documents. All of the specific node types such as Elements, Attrs, and so on derive
    from the Node interface. However, even though the Node interface exposes properties
    and methods for working with child nodes, not all node types support children.'
