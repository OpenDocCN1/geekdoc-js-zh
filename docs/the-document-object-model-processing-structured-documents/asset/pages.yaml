    # Other Potential Future DOM Enhancements


    In this section, we''ll take a look at some technologies and concepts that haven''t
    officially found their way into the DOM yet may be considered for inclusion at
    some point. Specifically, we will examine the XSL Transformation language (XSLT)
    and the concepts behind transaction-oriented processing.


    # XSL Support in the DOM


    Extensible Style Language Transformation (XSLT) is becoming a rapidly accepted
    standard for transforming XML documents into other types of documents. It is being
    used primarily as a bridge language to data-centric XML documents and give them
    a visible appearance, such as HTML. XSL is a W3C Recommendation currently in version
    1.0, which was adopted on November 16, 1999 (and is available at www.w3.org/TR/xslt/).
    In this section, we''ll take a look at what XSL is, how it works, and what of
    XSL support available in today''s applications. Note that this isn''t intended
    to be a full introduction to XSLT. I encourage you to check out the XSLT specification
    on the W3C website and other good tutorials available on the web. The purpose
    here is to provide a brief introduction to XSLT concepts and examine some implementations
    at a high level.


    # What Is XSLT?


    In a nutshell, XSLT provides the ability to transform a source XML document tree,
    apply a transformation to it, and produce a result tree. The result document can
    be of almost any type: text, XML, HTML, and so on. Figure 11-3 illustrates this
    process.'
