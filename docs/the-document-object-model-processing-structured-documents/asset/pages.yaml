  md: '# About the Author


    Joe Marini has been a professional software engineer for 12 years at companies
    such as Quark, Inc., mFactory, Macromedia, and Panscopic Corporation. Joe also
    founded his own software development company, Lepton Technologies, which was acquired
    by Extensis Corp. in 1997. Joe served as Macromedia''s representative to the World
    Wide Web Consortium''s Document Object Model working group from 1999–2000.


    In addition to his engineering work, Joe has served as a contributing author on
    several books, including Fireworks MX Magic with Lisa Lopuck and the forthcoming
    Beyond Dreamweaver with Joseph Lowery. Joe is also a regular speaker at various
    industry conferences on web development and related subjects. Joe works and lives
    in San Francisco and Lake Tahoe, California with his wife, Stacy, and their dog,
    Milo.'
