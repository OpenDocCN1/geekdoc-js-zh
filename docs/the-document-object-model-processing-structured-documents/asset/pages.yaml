  md: '# Event Phases


    There are three phases that a DOM event can be in: the Event Capture phase, the
    At Target phase, and the Event Bubbling phase.


    When an event is being handled by an EventListener that is using event capture,
    the event is in the Event Capture phase. Each EventListener is registered for
    an event get first caught at an event before the target on which it is registered
    if the EventListener is using event capture (its useCapture argument) was set
    to true when it was attached to the target.


    When an event is being handled by an EventListener that is attached to the actual
    target of the event, then the event is in the At Target phase.


    If this event is specified as a bubbling event, the event begins to bubble back
    up the document tree hierarchy all to the Document node itself.


    # NOTE


    According to the DOM spec, when an event begins to bubble, the chain of event
    targets from the original event target to the top of the tree is determined before
    the event is actually dispatched. The structure of the document tree changes while
    the event is bubbling, the event follows the path of the initial state of the
    tree. Also, not all types of events bubble (for example, focus events). Refer
    to the DOM Events module specification for a list of events that bubble.


    ![](img/dd1ccaaeafde765845e42d14df9ed839_143_0.png)


    # The Event Interface


    All events in the DOM Events specification have the Event interface as their base
    interface. The Event interface has the following interface definition:


    interface Event {


    ```

    // unsigned short CAPTURING_PHASE = 1;

    const unsigned short AT_TARGET = 2;

    const unsigned short BUBBLING_PHASE = 3;


    readonly attribute DOMString type;

    readonly attribute EventTarget target;

    readonly attribute EventTarget currentTarget;

    readonly attribute unsigned short eventPhase;

    readonly attribute boolean bubbles;

    readonly attribute boolean cancelable;

    readonly attribute DOMTimeStamp timestamp;

    void stopPropagation();

    ```'
