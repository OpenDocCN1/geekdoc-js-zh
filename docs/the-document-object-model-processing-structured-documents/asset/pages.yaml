    # Internet Explorer–Specific Methods and Properties


    Unlike Netscape, Internet Explorer adds dozens of proprietary properties and methods
    to its version of the DOM API that are not specified by the W3C. In this section,
    we review some of the more important and interesting methods and properties and
    demonstrate their usage. A word to the wise: usingstandard properties and methods
    will make your code less portable, so you should use them only when you are sure
    that users of your application will be using a particular browser or when there
    is no other way to accomplish a particular programming task. In general, it is
    usually preferable to stick to the standard methods. A complete list of IE-specific
    properties and methods can be found on the Microsoft website http://msdn.microsoft.com.


    # Internet Explorer–Specific Properties


    Two of the more powerful and useful properties that Internet Explorer adds to
    its implementation of the DOM are `innerHTML` and `outerHTML`. Though not a part
    of the W3C DOM standard, they are very useful and can be used to perform a wide
    range of operations on document nodes.


    Essentially, these two properties provide access to the inner and outer HTML of
    the node upon which these properties are used. The inner HTML of a node is the
    HTML code contained between the closing bracket (>) of the opening tag and the
    opening bracket (<<) of the closing tag. The outer HTML of a node is the code
    between the opening bracket of the opening tag and the closing bracket of the
    closing tag. For example, consider the HTML tag for a document''s title:


    ```

    <TITLE>This Is My Document Title</TITLE>

    ```


    The innerHTML property of the title node would be This Is My Document Title—the
    content between the closing bracket of the `<TITLE>` tag and the outerHTML of
    the title node would be `<TITLE>This Is My Document Title </TITLE>`, as illustrated
    in Figure 5-5.'
