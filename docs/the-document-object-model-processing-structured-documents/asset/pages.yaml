  md: '# 244 The Document Object Model: Processing Structured Documents


    The initListEditor function takes one argument, the ID of the list to edit, and
    calls getElementById() to retrieve the node for list. The script stores node in
    a global variable gTheList. It adds an event handler for click events to list.
    IE and Netscape handle events slightly differently, so the script needs to detect
    which browser is running and call the appropriate API. Because only IE 6 has a
    window property named event, the script tests for the existence of the window.event
    property and calls attachEvent() method if not, the script calls the DOM Level
    2 Events method addEventListener() because that is what Netscape 6 uses. This
    handler, named onClick(), will be the one that processes mouse clicks on all of
    the list items.


    When the user clicks a list, the itemClick() event handler is called. If the function
    is running under Netscape 6, the function will be called with a single argument,
    an Event data structure. Under IE, the global window.event contains all of the
    event information. The function retrieves the target of the mouse click and stores
    it in a local variable, oTarget. The next line connects to see if the mouse clicked
    a text element, which would be the text node of <li>. So, the getParentITag()
    function is called to retrieve the corresponding <li> tag of the text node.


    Once the <li> tag that has been clicked, the script is ready to create the controls
    to handle the in-place editing. However, if the controls are already editing another
    item, they must first be moved to the new item. The script calls getItemById()
    with the itemText argument, which is the ID for the edit field. If this returns
    a non-null value, the script calls getParentITag() to retrieve the list item for
    the edit field and sets its innerHTML to the contents of the global variable gContent.
    The first time the list is clicked, there is no current list item being edited,
    so this code will not execute, and thus the gContent variable does not need to
    be initialized. Instead, the next line of the script, which sets the content of
    the gContent variable to the text content of the <li> tag, will be executed. This
    is used to store the original contents of the <li> in case the user decides to
    cancel editing or clicks another item. Finally, the script calls editListItem()
    with one argument, the li node that to be edited.


    The editListItem() function begins by retrieving the text of its child Text node,
    which will be used to initialize the value of the edit field. Next, the script
    uses the createElement() DOM method to create an <INPUT> element for the edit
    field. The setAttribute() method is used to set the type, value, and attributes
    for the edit control. The script calls the replaceChild() method on the <li> node
    to replace the child Text node with the edit field.'
