  md: '# The Document Object Model: Processing Structured Documents


    Part I introduced the DOM; discussed its concepts, design, theory, and origins;
    and introduced the main interfaces of the DOM application programming (API). It
    also explored how the DOM API can be used to examine and manipulate the information
    in HTML and XML documents.


    In Part II, we take a look at how the DOM is used in the real world (hence the
    title of the section). This chapter introduces and dissects several common algorithms
    and code patterns that appear regularly when using the DOM to process the information
    in structured documents.


    # DOM Algorithms


    When using the DOM API, it soon becomes clear that there are certain types of
    document processing algorithms that you need to use and over again. Common algorithms
    include


    +   * Determining whether a node is contained within another node


    +   * Determining whether a node has a sibling of a certain type


    +   * Finding a node based on the value of an attribute


    +   * Processing the children of a node


    These algorithms can be readily used in your own DOM code or modified slightly
    to suit a related but different purpose. Let''s start by discussing two different
    types of DOM algorithms: position based and content based. Position-based DOM
    algorithms are best when you are more interested in the position of nodes within
    a document than the node''s actual contents; content-based algorithms are best
    when you are more concerned with the contents of nodes.


    For example, determining whether a given node is contained within another node
    is an example of a position-based algorithm; you are trying to discover whether
    a node occupies a particular place in the DOM tree. Determining whether a node
    contains another node is an example of a content-based algorithm; you are more
    concerned about the contents of a node.


    # Basic Node Traversal Algorithms


