  md: '# Chapter 11: Future Directions for the DOM 303


    Currently, the DOM’s future is taking shape as the Level 3 specification, parts
    of which are now in “last call” phase (such as DOM XPath) and parts of which are
    still under development. In addition, there are other standards under development
    that affect how developers use it and may be considered for inclusion in the DOM
    at a later date. In the Level 3 version of the DOM, more attention is being paid
    to some of the things that were left out of earlier versions, such as loading
    and saving files. In addition, the DOM is beginning to consider the use of other
    W3C recommendations within DOM documents, such as XPath expression handling.


    In the following sections, I’ll summarize the changes and additions that are being
    developed for DOM Level 3 and examine some of the new modules that will be included.
    We’ll also take a look at some developing technologies and trends that are not
    yet being considered for inclusion in the DOM but probably will be at some later
    date.


    # Proposed Changes in DOM Level 3


    The working drafts of the Level 3 DOM modules incorporate several changes and
    additions to the specification that have been requested by developers. The size
    and scope of the changes range from relatively small, such as new data types and
    methods, to entirely new modules, such as Load and Save, Abstract Schemas, and
    XPath support. In this section, I’ll summarize the most important changes made
    to the existing modules and take a look at some of the new modules that will be
    included in Level 3.


    # General Changes


    Some of the more general changes in the Level 3 version of the DOM specification
    include new data types, new methods and properties for various interfaces, and
    modifications to existing interfaces and properties. In addition, Level 3 introduces
    some entirely new concepts to the DOM, such as mixed DOM implementations.


    # New Data Types


    DOM Level 3 introduces two new data types. The first is DOMObject, which represents
    an arbitrary memory object. The second is DOMUserData, which represents an interface
    to an arbitrary block of data in a DOM application.


    The DOMObject type has the following IDL specification:


    ```

    typedef Object DOMObject;

    ```'
