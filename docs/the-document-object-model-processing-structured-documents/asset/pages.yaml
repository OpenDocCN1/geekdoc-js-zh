    # Retrieving and Setting the Document Selection


    As an editing application, Dreamweaver must keep track of what the user has selected
    in the current document so it knows which element to edits. Extensions can retrieve
    the current selection and change it to any arbitrary object or range of text within
    the document using Dreamweaver''s built-in selection methods. There are methods
    for both retrieving and setting the selection as a range of text or as a document
    node, as listed in Table 6-3.


    | Selection Method | Description |

