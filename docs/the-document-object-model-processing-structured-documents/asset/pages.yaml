  md: '# Chapter 6: Applications 161


    Command extensions are stored inside the Commands folder, which is located inside
    the Configuration folder, which is located in the same folder as the Dreamweaver
    application itself. When a command is placed inside this folder, it shows up in
    Dreamweaver''s Commands menu, as shown in Figure 6-3. Each command is listed in
    the menu according to the contents of its <TITLE> tag.


    The following code illustrates a sample Dreamweaver command extension that displays
    an alert when invoked from the Commands menu:


    ```

    <HTML>

    <HEAD>

    <TITLE>Sample Extension</TITLE>

