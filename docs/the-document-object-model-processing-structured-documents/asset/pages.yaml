  md: '# The Document Object Model: Processing Structured Documents


    In Chapter 8, you saw some examples of how to build web pages that can use the
    DOM to provide automatic navigational aids to users by adapting to a document''s
    content-on-fly. This is accomplished by reading the structure and content of the
    page and dynamically configuring some common user interface controls to allow
    the user to easily move around within the document. These navigation controls,
    such as tables of contents, bookmarks, and so on, can be reused across multiple
    pages.


    In this chapter, we will take a look at how to build web pages with dynamic, interactive,
    cross-browser user interfaces using the DOM API. We will start with an example
    that illustrates how to create a dynamically generated color picker that allows
    users to interactively select a color. Then we will look at how to create lists
    of items that can be edited in-place. Finally, we will examine how to create pop-up
    menus using the DOM methods.


    # Building Dynamic User Interfaces with the DOM


    Prior to the DOM, building dynamic user interfaces for web pages usually meant
    dealing with Dynamic HTML (DHTML). This, in turn, usually meant with incredible
    headaches because there was no official standardization between the major browser
    vendors with respect to their proprietary object models and scripting APIs. As
    a result, browser-specific code often not needed to be to accomplish the same
    user interface results in different browsers from different vendors, and sometimes
    even between different versions of the same browser from one vendor.


    Though it still isnt quite seamless to build highly interactive user interfaces
    using completely browser-independent code today, the situation has improved significantly
    with the introduction of the latest DOM-capable browsers such as Netscape 6.2
    and Internet Explorer 6. In fact, most of the actual document manipulation itself
    can be accomplished with browser-independent code; it is the interactivity that
    is still not standardized, such as event processing and styling handler. Whereas
    Netscape 6.x faithfully supports the DOM Level 2 Events module, Internet Explorer
    implements its own event handling system. Even so, processing events across different
    browsers isnt as hard as it used to be because Internet Explorer at least follows
    the general principles as the DOM specification in its event handling APIs, such
    as event capture and event bubbling.


    One of the key benefits of using the DOM inside HTML to create web-based user
    interfaces is that every aspect of the page can be modified by the application,
    not just the parts of the page that the older HTML browsers specifically make
    available for manipulation (such as layers and images). In addition, because the'
