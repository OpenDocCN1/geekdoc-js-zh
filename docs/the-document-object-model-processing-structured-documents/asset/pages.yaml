  md: '# Chapter 3: Navigating and Manipulating Structured Documents 69


    interfaces provide robust node traversal functionality over a document''s nodes.
    The DocumentTraversal interface provides the factory methods necessary for creating
    TreeWalkers and NodeIterators.


    # Iterators vs. Walkers


    NodeIterators and TreeWalkers represent two very different ways of representing
    a document subtree''s set of nodes. NodeIterators present a “flattened” view of
    the document: the nodes are presented in the order they are encountered in the
    document, as if they had laid one after the other. They present their absent of
    the hierarchy in the document, so they allow you to move forward and backward
    through a list of nodes. TreeWalkers, on the other hand, maintain their representation
    of the document hierarchy relative to the node they are currently attached to.

    So why use a Iterator instead of a TreeWalker (or vice versa)? Generally speaking,
    NodeIterators are more useful when your DOM application is focused on the contents
    of each node. TreeWalkers are better when your application will manipulate the
    structures of the subtree''s nodes.


    # Logical Views and Physical Views


    NodeIterators and TreeWalkers have the ability to present views of the document
    subtree that may not contain all of the nodes that are actually in the subtree.
    For example, a Iterator or TreeWalker can be told to only visit Element nodes,
    excluding other node types. The DOM Traversal module specification refers to this
    as a logical view. The actual document subtree independent of the iterator or
    walker is called the physical view. The way this is accomplished by associating
    a NodeFilter object with the Iterator or TreeWalker. NodeFilter examines each
    node and determines whether it should be included in the logical view. NodeFilters
    are very powerful objects: they can include or exclude nodes based on almost any
    criteria you can think of, including node type, whether it has or doesn''t have
    certain attributes, what the node''s columnName is, and so on. Figure 3-9 illustrates
    the difference between a physical and a logical view of the same document. The
    document contains several different node types, and the logical view as seen by
    a certain traversal object contains only Element nodes (shown with bold outlines)
    because it has chosen to exclude all other node types.'
