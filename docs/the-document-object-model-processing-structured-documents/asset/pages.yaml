    # What the DOM Isn’t


    Now that we’ve spent the better part of the chapter discussing what the DOM is,
    we’ll take a moment and point out a few of the things that the DOM is not (in
    fact, the actual W3C specification goes out of its way to pretty much the same
    thing—perhaps we want to avoid any misconceptions of the DOM as early as possible):


    +   The DOM isn''t a way of creating programs that are, in the spec’s words, “binary
    compatible,” in other words, usable across disparate computer systems without
    recompiling. Programs that are written using the same language binding will be
    source-code compatible across platforms, but you can’t take a DOM program written
    for Windows and run it on a Macintosh without recompiling, for example.


    +   The DOM doesn’t describe how to insert objects into XML or HTML, like SOAP
    (Simple Object Access Protocol) does, for example. It represents documents as
    a collection of objects.


    +   The DOM isn''t a set of data structures. It merely describes relationships
    in a logical fashion. Even though the DOM specification (and this book) will talk
    about such things as parent-child relationships of objects, which are logical
    relationships and do not describe any internal representation of objects or data.


    +   The DOM does not describe what information in a document is relevant or how
    that information is structured; that’s what XML Infoset does. The DOM is just
    an API to this information.'
