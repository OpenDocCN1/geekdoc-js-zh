    ```

    var theNode = document.getElementById("thenodeid");

    ```


    The ID attribute is an attribute attached to Element nodes that uniquely identify
    them in a document. Note that the DOM does not enforce this requirement: you can
    give the same ID to more than one element, but the resulting behavior is undefined,
    according to the DOM specification.


    Node references, including those in NodeList and NamedNodeMap structures, are
    called “live” references. In other words, changes to a node contained in the document
    will be immediately reflected in all NodeLists and NamedNodeMaps where node is
    represented, and vice versa. For example, if a DOM application retrieves a list
    of child nodes of a given node and proceeds to add more child nodes to that node,
    the presence of the new child nodes will be immediately reflected in the NodeList
    that was returned previously.


    # Inspecting Nodes


    Using the example document represented by Listing 3-1 and illustrated in Figure
    3-1, we can list the properties of the Node interface as they would be populated
