  md: '# The Document Object Model: Processing Structured Documents


    The DOMUserData type has the following IDL specification:


    ```

    typedef Object DOMUserData;

    ```


    > NOTE

    The DOM Level 3 specification uses the DOMObject and DOMUserData types in its
    interfaces, though actual implementations may use different bindings. In Java,
    for example, the DOMObject and DOMUserData types are bound to the Java’s Object
    type. In C++, they may be specified as void pointers (void *), as in the Xerces-C
    implementation. In JavaScript, they can be bound to any type.


    Currently, the Level 3 specification uses DOMObject and DOMUserData types in the
    interfaces for handling user data on document nodes (discussed later).


    # New and Modified Interface Methods


    Several of the DOM interfaces have added new methods in the Level 3 specification.
    In this section, we will review the more notable additions to the DOM interfaces.


    The Node interface is slated to receive a fair number of additions, allowing developers
    to compare the document tree positions of nodes, test for node equality, retrieve
    the text content of nodes, and attach application-defined data to nodes.


    Comparing the tree positions of nodes is done via the compareTreeNode() method,
    which returns the position of a general relative node to the node it is called
    on. Application-specific data can now be attached to nodes using the setUserData()
    and getUserData() methods. Each of these new capabilities is discussed more fully
    later in this chapter in the section "Attaching Application-Specific Data to Nodes."


    Two new methods, isSameNode() and isEqual(), have been added to allow applications
    to test two nodes for sameness and equality, respectively. Two node references
    are referred to be the same if both node references refer to the same underlying
    node in memory. When two node references are the same, DOM operations on either
    reference will behave as if the same operation had been performed on the other
    reference.


    Two nodes are considered to be equal if all of the following conditions are met:


    +   - The two nodes are the same type (Element, Comment, and so on).


    +   - The nodeName, localName, namespaceURI, prefix, nodeValue, and baseURI properties
    on one node are all equal to the corresponding property on the other node. That
    is, they are both null, or they both have the same string value.'
