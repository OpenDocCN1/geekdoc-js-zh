    \ revision as\nof this writing, 6.2.1), which is based upon the open-source Mozilla\
    \ project. This\nlatest version of the Netscape browser provides full support\
    \ for DOM Level 1 and\npart of DOM Level 2, including the DOM 2 Events model.\n\
    \nScripts can take advantage of the DOM’s capabilities in Netscape Navigator\n\
    just as they would in Internet Explorer. Scripts can discover the structure and\
    \ content\nof pages and make changes to a page’s content at runtime. In addition,\
    \ because\nNavigator supports the DOM Level 2 Events model, script developers\
