  md: '# Chapter 1: Introduction to the DOM 11


    Most applications at the time of this writing support (to varying degrees) most
    of the methods in Level 1. In particular, the two main browser vendors, Netscape
    and Microsoft, have implemented almost complete support for DOM Level 1 in Netscape
    6 and Internet Explorer 6, respectively. Other applications, such as Macromedia''s
    popular Dreamweaver HTML editing program, support only a subset of the Level 1
    API.


    # Level 2


    Level 2 of the DOM was adopted as a W3C Recommendation in November of 2000. Level
    2 is divided into 14 distinct modules (Core, XML, HTML, Range, Traversal, CSS,
    CSS 2, Views, Stylesheets, Events, User Interface Events, Mouse Events, Mutation
    Events, and HTML Events) and organized into 5 major modules (Core, Views, Events,
    Style, and Traversal/Range).


    DOM 2 updated the Core functionality by DOM Level 1 with the addition of namespace
    support, as well as new methods to handle circumstances that Level 1 did not provide
    explicit support. For example, DOM Level 1 did not specify a way to create an
    empty document; DOM 2 now includes a method for handling this common case.


    In addition to providing fundamental interfaces for structured documents, DOM
    Level 2 stretches its wings a little bit and to address areas of document handling,
    such as


    +   * Range Specifies methods for working with ranges of content in a parsed DOM
    document. Though this does not necessarily mean every range corresponds to a selection
    of content made by a GUI user, these selections can be returned to a DOM client
    application as a range.


    +   * Traversal Provides utility interfaces for selectively traversing and filtering
    a document''s content.


    +   * Style/CSS Provides base interfaces for supporting any kind of style sheet.
    When a module provides support for a specific type of style sheet language, it
    includes interfaces that are derived from these base interfaces. For example,
    the CSS module provides interfaces that allow programmatic access to CSS constructs
    from within DOM applications.


    +   * Views Provides interfaces that allow documents to have more than one view
    of the document source. For example, a document may have a view that is computed
    in real time, as the application of style sheets, or it may have several views
    in different browser frames of the same document.'
