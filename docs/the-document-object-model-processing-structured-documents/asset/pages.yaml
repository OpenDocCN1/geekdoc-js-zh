    not support editing DTDs, thus the doctype cannot be altered.


    **Exceptions:** None


    **documentElement (read-only)**


    **Type:** Node

    **Description:** Refers to first child node of the document root. In HTML documents,
    this corresponds to the <HTML> tag.


    **Exceptions:** None'
