    \  <chapter name=\"Chapter 1\">\n    <section>text</section>\n    <section>text</section>\n\
    \  </chapter>\n  <chapter name=\"Chapter 2\">\n    <section>text</section>\n \
    \   <section>text</section>\n  </chapter>\n  <chapter name=\"Chapter 3\">\n  \
    \  <section>text</section>\n    <section>text</section>\n  </chapter>\n</book>\n\
    ```"
