    In addition, the Node interface specifies that the nodeValue of a Node node is
    null. The Node node has one child, the HTML element, which means that the node''s
    firstChild and lastChild are the same node. The nodeType for a Node node is defined
    to be 9.


    Table 3-2 lists the values of the Node properties for the Element node represented
    by the <TITLE> tag.


    The <Document> tag''s ownerDocument is set to the document that owns this. It
    is the first child of the <HEAD> tag, so it has no previousSibling. Its nextSibling
    property is the Comment node that follows it in the document; and because it is
    a direct descendant of the <HEAD> tag, it has the Element node as its parentNode.
    It has only one child—a Text node—so its firstChild and lastChild properties are
    the same. The nodeName property reflects the name of the tag that represents the
    node—in this case, <TITLE>. Element nodes, by definition, have no value, so the
    nodeValue property is set to null. The <TITLE> tag is an Element node, and its
    nodeType property reflects this with a value of 1. The TITLE element node, it
    has one additional property specified by the Element interface: the tagName property,
    which is the same as nodeName "TITLE".


    Table 3-3 lists the values of the Node interface properties for the Comment node.
    The Comment node is immediately preceded by the TITLE element, causing the previousSibling
    property to contain a reference to the TITLE node. There is no node after the
    comment, which is why the nextSibling property is null.


