    notations (read-only)

    Type: NamedNodeMap

    Description: A NamedNodeMap containing the notations declared in the DTD, with
    duplicates discarded. Every node in this map also implements the Notation interface.
    DOM Level 1 does not provide a way to edit these notations.

    Exceptions: None


    # Methods


    No methods other than those inherited from the Node interface.


    # Interface DOMImplementation


    The DOMImplementation interface is intended to provide methods that are independent
    of any particular document instance. DOM Level 1 does not specify a way of obtaining
    a DOMImplementation interface, leaving it as implementation-dependent operation.
    For example, in the browsers, you refer to the DOMImplementation by using the
    implementation object on the document interface (document.implementation).'
