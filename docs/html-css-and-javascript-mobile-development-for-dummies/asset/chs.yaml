  \n**排版服务**\n\n黛比·斯特利，排版服务总监\n\n## 引言\n\n当我刚开始撰写关于网站设计和设计网站时，主要的设计考量之一是弥补低带宽和低分辨率显示器的不足。创建网站需要在视觉内容（图像、声音和视频）与构成网页的文件总大小之间取得平衡。然而，渐渐地，计算机屏幕分辨率越来越高，高速互联网连接也越来越普及。网页设计师得以自由创建高度视觉化的网站，包含数字视频、Flash\
  \ 内容和大量图像。\n\n随后，支持网络的手机和其他移动设备出现了——它们拥有更小、更低分辨率的屏幕、更低的带宽和更弱的处理器。如今，设计限制甚至比互联网刚出现时更加严格。媒体文件必须更小，而且我们习惯使用的许多功能——大而美观的图像、数字视频、Flash\
  \ 内容——在这些小型设备上都不受支持。\n\n好消息是移动技术发展非常迅速。最新一代的智能手机和手持电脑（平板电脑）拥有漂亮的高分辨率屏幕。处理器每天都在变快。最新一代的\
  \ iPhone、iPad、Android 智能手机和平板电脑几乎支持台式电脑支持的所有网络功能。它们还支持 Wi-Fi、3G 和 4G 数据网络。为这些设备进行设计不再是一种克制性的练习。\n\
  \n然而，并非所有移动用户都升级到了最新一代的手持设备。这就是为什么这本书既回顾过去又展望未来。为了让尽可能多的移动用户能够访问您的网站，您确实需要创建既能利用最新技术又能弥补早期技术不足的页面。创建满足新设备用户期望、同时平衡旧设备局限性的移动网站至关重要。\n\
  \n## 关于本书\n\n我编写《HTML、CSS 和 JavaScript 移动开发傻瓜书》的目的是涵盖支持网络的手持设备十年来的发展历程——从几乎不支持网络的早期功能手机，到最新、极速的智能手机和平板电脑。这涉及广泛的技术。本书旨在教您如何为所有这些设备设计和开发网站及\
  \ Web 应用程序。\n\n尽管本书将基础知识放在前面，然后逐节深入更高级的主题，但每一节都是独立的——您不必从头到尾阅读本书就能找到所需的解决方案。例如，如果您想为移动网站创建联系表单，可以直接跳到第\
  \ 9 章。如果您想学习 JavaScript 的基础知识，请翻到第 3 章。\n\n您是否更愿意像上网页设计课程一样，从基本概念到更复杂的内容逐步学习？本书的组织方式也能满足您的需求。只需从第\
  \ 1 章开始即可。\n\n## 您不必阅读的内容\n\n真正的问题是您为什么购买这本书？本书包含几个面向任务的章节，旨在帮助您为手持设备创建特定的 Web 应用程序。如果您不打算在移动网站上销售任何东西，那么不必费心阅读第\
  \ 17 章。如果您没有时间或意愿创建多个版本的移动网站，那么不必阅读第 5 章和第 6 章。\n\n\n\n换句话说，利用目录和本引言中的“本书的组织方式”一节，来确定哪些章节能帮助你完成你想做的事情。如果你不想读其余部分，那就别读。我不会知道的。\n\
  \n## 本书使用的约定\n\nConventions 是一个术语，意为惯例或标准。因为它是一个术语，我选择用斜体来定义它（因为我想你可能不知道这个词）。用斜体介绍新术语是本书的惯例之一。以下是一些其他惯例：\n\
  \n- ![check.png](img/check.png) URL（网址）、代码、文件名、计算机文件夹名称、链接、菜单命令和电子邮件地址以`这种等宽字体`显示，以便你轻松识别和找到它们。\n\
  \n- ![check.png](img/check.png) 当我以逐步演示的方式向你展示如何操作时，这些说明会以粗体显示；同样，我要求你输入的单词、短语、URL\
  \ 和其他内容也会以粗体显示。\n\n- ![check.png](img/check.png) 当我以逐步的方式教授流程时，我会使用编号列表，以便你更容易跟上。\n\
  \n## 愚蠢的假设\n\n互联网上的许多网页在某些手持设备上显示效果不佳。然而，随着移动设备功能越来越强大，网站也越来越对移动设备友好，这种情况——就像互联网技术世界中的其他一切一样——正在迅速变化。\n\
  \n本书假设你几乎没有网页设计经验。只要你懂得如何打开电脑，并对计算机如何存储和整理文件有基本的了解，你就应该能够使用本书。\n\n然而，网页设计并非凭空发生。创建网页通常需要许多其他技术或程序的协助，例如图形编辑器、数字视频编辑器和\
  \ Flash 应用程序。绝大多数设计师使用 Adobe Dreamweaver 设计他们的网站（我也是如此）。如果你不熟悉这些应用程序及其创建的文件类型，那你很幸运。有大量的“傻瓜”系列书籍可以帮助你。\n\
  \n本书介绍了几个高度复杂的网页技术，例如 HTML、CSS 和 JavaScript。本书不是其中任何一种技术的手册或完整参考。相反，它是一本面向任务的参考书，为你提供完成任务所需的信息。不过，我确实提供了几个指向描述这些技术的页面的链接。如果你有兴趣深入学习其中任何一种或全部技术，你可能会发现诸如\
  \ Ed Tittel 和 Jeff Noble 合著的《HTML、XHTML 和 CSS 傻瓜全攻略》之类的书籍很有帮助。\n\n## 本书的组织方式\n\n\
  《HTML、CSS 和 JavaScript 移动开发傻瓜书》是一本完整的参考书，旨在让你无需阅读整本书就能完成特定的网页开发任务。然而，如果你对当前主题没有经验，你可能会发现自己需要参考前面的章节来补充对讨论中的概念的理解。当我认为你可能需要额外信息时，我会提供包含这些信息的章节的参考。\n\
  \n本节概述了五个部分以及每个部分的内容。每一章都以介绍该章涵盖的材料开始。有些章节包含完成任务的逐步说明，而有些章节则从多选项、你想实现什么的角度来描述完成任务。\n\
  \n# 第一部分：起初，没有移动设备……\n\n第一部分首先向你介绍普通移动设备用户，以及他们的上网习惯与普通台式机或笔记本电脑用户有何不同。然后你会了解 HTML、CSS\
  \ 和 JavaScript 的概述——这三种技术的作用以及它们如何协同工作来创建网站。本部分最后介绍了可帮助你成为网页开发者的设计软件、实用程序以及许多其他工具。\n\
  \n# 第二部分：创建移动网站\n\n在第二部分中，你将直接动手创建一个移动网站。首先，你将探索为手持设备设计与为标准计算机设计有何不同。然后，你将学习如何将移动流量引导到你的移动页面，以及如何根据移动设备的类型和功能创建不同的页面集。本部分以创建网站首页（网站的第一个页面）的练习结束，并介绍如何设计一个模板系统，以便完成网站其余部分以及将来修改和添加内容。\n\
  \n# 第三部分：使用高级交互和多媒体增强你的网站\n\n在这一部分中，你将学习如何让你的移动网站“唱歌”和“跳霹雳舞”。首先，你将创建一个联系表单，供网站访问者用来请求有关网站或你组织的信息。然后，你将获得一个关于使用数字媒体（图像、数字视频、声音和\
  \ Flash）的速成课程。本部分最后介绍了最新的移动网页技术：HTML5、CSS3 和 WebKit 扩展。你将学习如何使用最新、最棒的设计工具来创建外观精美的网站和交互式网页效果。\n\
  \n# 第四部分：构建实际应用\n\n现在我们讨论的是高级移动网站开发——实际执行某些操作的真实应用，例如使用 JavaScript 验证 HTML 表单字段，以及编写存储数据并根据用户输入做出决策的脚本。你将学习如何创建\
  \ JavaScript 测验，如何使你的网站对搜索引擎友好以便人们能够找到它，以及如何为你的网站构建搜索页面以便人们能够找到信息。你想在网站上销售东西吗？在这一部分中，我还会向你展示如何创建移动购物车。本部分最后讨论了如何创建博客移动界面。\n\
  \n# 第五部分：十大要点\n\n本部分提供了许多你应该会觉得有用的内容的链接。第 18 章告诉你到哪里寻找 10 种不同的移动设备模拟器，这些模拟器是小型应用程序，可以让你看到你的网站在特定设备上的显示效果。第\
  \ 19 章包含多个拥有多种移动网页模板的网站的链接——有些是免费的，有些是收费的。在第 20 章中，你将找到 10 个小部件的链接，这些小部件是可用于创建页面元素的小代码片段，例如菜单、谷歌地图、3D\
  \ 产品查看器以及其他几个有用的网页功能。\n\n## 本书使用的图标\n\n与其他“傻瓜”系列书籍一样，本书在页边空白处使用了几个图标或小图片，用于指示有用或重要的信息。\n\
