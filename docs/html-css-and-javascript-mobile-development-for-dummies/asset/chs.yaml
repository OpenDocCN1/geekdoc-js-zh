  \n## 关于作者\n\nWilliam Harrel 拥有近 25 年的数字设计经验。他是桌面计算机出版领域的先驱之一，从最早的数字设计和图形程序 PageMaker\
  \ 和 Photoshop 开始。与许多早期的“桌面出版者”一样，随着万维网的出现，他发现向网页设计过渡是顺理成章的下一步。他的设计公司设计了数百个网站、Flash\
  \ 网站和电子文档。他早期关于 Photoshop、PageMaker 以及数字媒体的一般性著作，是这些主题的首批出版物之一。\n\nWilliam Harrel\
  \ 已撰写或合著了 19 本关于在计算机上设计印刷媒体和电子文档（如网站、PDF、Flash 网站和 Flash 应用程序、幻灯片和多媒体演示）的书籍。这些书籍涵盖\
  \ Photoshop、Acrobat（《Acrobat 傻瓜书》）、PageMaker、Flash、Director 以及其他多个图形和出版软件包。\n\n\
  他最新的在线课程《Adobe Flash CS4 入门》、《Adobe Flash CS5 入门》、《Adobe Flash CS4 中级》和《Adobe Flash\
  \ CS5 中级》目前已在 2500 多所学院和大学开设。这些课程是经过完全认证的课程，提供 Flash 的深入教学，包括为手持设备开发 Flash 应用程序的课程。\n\
  \n他还撰写了数百篇杂志文章，主题涵盖 Mac、PC 及其他硬件评测，以及各类软件包——包括页面布局、图形、网页设计、Flash、多媒体和文字处理——发表在《PC\
  \ World》、《Home Office Computing》、《Compute》、《Windows Magazine》、《Publish》、《Entrepreneur》、《Home\
  \ Office》等众多知名杂志上。他目前为《Computer Shopper》评测打印机、笔记本电脑和平板电脑。\n\n\n\n\n哈雷尔的博客《通信技术观察》（[`http://commtechwatch.com`](http://commtechwatch.com)）是一个备受尊敬的信息来源，内容涉及为计算机设计及在计算机上使用的媒体。《通信技术观察》收录了大量关于使用\
  \ Flash 及其他应用程序（包括 Adobe Creative Suite 中的大部分程序）的资料。\n\n威廉·哈雷尔还曾是一家全国性互联网服务提供商（ISP）的业主兼经营者，长达\
  \ 14 年。除了托管数千个网站外，他的 ISP 公司还为数百名客户设计和维护网站。该公司还专注于 IP 语音（VoIP）电信技术，部分工作包括设计用于将移动设备集成到客户\
  \ VoIP 电话系统中的 Web 应用程序。\n\n哈雷尔管理并担任其设计公司的首席设计师已超过二十年。该公司为加州脊柱研究所、当地红十字会分会、当地匿名戒毒会分会等众多知名机构设计过网站及其他营销材料。如今，为客户网站设计移动版本已成为其公司日常业务的一部分。\n\
  \n## 献词\n\n献给我可爱的 13 岁女儿萨曼莎，她忍受着我长时间、不合时宜地坐在电脑前的时光。\n\n## 作者致谢\n\n如果没有 Wiley Publishing\
