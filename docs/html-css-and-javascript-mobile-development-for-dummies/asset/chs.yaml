  \n### Perfectory\nPerfectory 是另一个巨大的移动网页模板库。这里的许多模板在其他模板商店（如 `TemplateMonster.com`）也有，价格也相似。移动模板大约\
  \ 40 美元。你还会发现这里的一些模板在其他网站是无法获得的。其中许多移动模板是用 HTML5 和 CSS3 设计的，使其成为较新手持设备的理想选择，但它们可能需要一些修改以兼容所有移动设备。Perfectory\
  \ 的移动模板位于 `www.perfectory.com/category/mobile-templates.htm`。\n\n### FreeTemplatesOnline\n\
  尽管该网站名为其名，但 FreeTemplatesOnline (`freetamplesonline.com`) 提供了大量的移动网页模板，平均价格约为 40\
  \ 美元。我没有找到很多免费的移动模板。不过，这个网站确实有大量的 Zencart 购物车模板，其中一些非常好。（Zencart 在第 17 章中讨论过。）自定义\
  \ `Zencart` 的内置模板可能是一项苦差。这些购物车模板的价格在 130 美元到 150 美元之间，是让你的 `Zencart` 页面满足设计需求的一种快速简单的方法。\n\
  \n### bMobilized\n这不是一个模板网站。相反，它是一个移动网站转换工具，可以将现有网站转换为移动网站。你只需要输入 URL，bMobilized\
  \ (`bmobilized.com`) 就会完成剩下的所有工作。（参见图 19-6。）我在几个网站上尝试过，总的来说运行得还可以。它创建的不是我见过最华丽的网站，但它产生的结果是可以接受的——特别是考虑到这项技术和快速转换的速度。\n\
  \n如果你订阅了该网站（每月 19.99 美元，有点贵），你就可以访问模板和其他工具，帮助你自定义 `bMobilized` 创建的代码。你至少每月需要使用一次它才值回票价。你可以随时取消，并保留\
  \ `bMobilized` 为你生成的网站。我想为了一个移动网站支付 20 美元并不是一笔巨款，而且再次考虑到所有因素，我用这个工具生成的网站尚强可以接受。\n\
  \n**图 19-6：** bMobilized 是一项在线实用，可以快速将现有网站转换为移动网站，结果可以接受。\n\n![9781118026229-fg1906.tif](img/9781118026229-fg1906_opt.jpeg)\n\
  \n# 第 20 章\n\n## 十大移动组件\nWeb 应用？组件（Widget）？它们有什么区别？如果你在 Google 上搜索其中任何一个，你都会得到两者的结果。就本章而言，这种区别微乎其微。这里的\
  \ Web 应用或组件仅仅是你粘贴到网页中的一段代码，用于创建所需的对象，例如菜单、按钮、按钮数组、某种媒体查看器（如 3D 旋转查看器）等。互联网上有成百上千的\
  \ Web 应用和组件，它们都具有各种功能。为了简单起见，从现在起，我们就统称它们为“组件”。\n\n组件的优势在于它们可以让你避免重复造轮子。你可能想在网站中使用的许多页面元素已经在互联网上被开发并发布——你只需要将代码复制到网页的相应位置，然后进行一些微调，让组件的外观和行为符合你的预期即可。\n\
  \n本章发现并描述了十种最流行且最实用的组件。你可以在未来的项目中使用这些组件。\n\n### Google Maps JavaScript API\n此组件允许你为网站添加一个\
  \ Google 地图（如图 20-1 所示）。最新版本 `V3` 设计为可在标准计算机和移动设备上运行。关于关于在你的网站中安装它的说明，请参见第 16 章。你可以在\
  \ `http://code.google.com/apis/maps/documentation/javascript/` 获取此组件的代码。\n\n**图\
  \ 20-1：** Google Maps JavaScript API V3 允许你在网站上放置 Google 地图的移动版本。\n\n![9781118026229-fg2001.tif](img/9781118026229-fg2001_opt.jpeg)\n\
  \n### JqueryUI Accordion Menu\n手风琴菜单在你的页面上创建可折叠的部分。用户可以通过点击各个部分头部来打开这些部分，如图 20-2\
  \ 所示。网上上有几种手风琴组件，还有一个用于创建它们的 Dreamweaver 组件。你可以在 `http://jqueryui.com/demos/accordion/`\
  \ 找到一个好用的。\n\n**图 20-2：** 手风琴菜单组件帮助你在页面上创建可折叠的部分。\n\n![9781118026229-fg2002.tif](img/9781118026229-fg2002_opt.jpeg)\n\
  \n### YouTube Video Bar Widget\nYouTube 视频条组件允许你在网页上放置一个 YouTube 播放器。你的访问者可以使用它播放你网站上的\
  \ YouTube 内容。你还可以结合视频搜索控制组件使用它，允许用户搜索 YouTube 内容。此组件允许你设置参数来控制哪些 YouTube 内容可以从你的网站被搜索到。例如，假设你、你的组织或客户有一个\
  \ YouTube 频道。你可以将搜索限制在你的频道内。你可以在 `http://code.google.com/apis/youtube/getting_started.html`\
  \ 找到这两个组件的信息。\n\n### jQueryUI Tab Menu\n与本章早些时候讨论过的手风琴菜单类似，标签页菜单允许你在页面上创建标签式部分来显示内容，如图\
  \ 20-3 所示。互联网上有几种标签组件。其中最完整且易用的是 `http://jqueryui.com/demos/tabs`。\n\n**图 20-3：**\
  \ 标签菜单组件允许用户点击标签显示内容。\n\n![9781118026229-fg2003.tif](img/9781118026229-fg2003_opt.jpeg)\n\
  \n### Two-Column Widget\n用 CSS 创建两列并没有看起来那么简单，所以我创建了这种组件（如图 20-4 所示）。你需要的一切——整个页面的\
  \ HTML 和 CSS——都在这里。你只需要复制代码，根据你的需求进行修改，并将占位文本替换为你自己的。你可以在 `http://commtechwatch.com/?p=1058`\
  \ 找到这个组件。\n\n你可以在本书的配套网站找到此组件的代码。\n\n### jQuery Droppable Widget\n此组件允许你创建一个拖放组件。（参见图\
  \ 20-5。）用户将一个对象拖到另一个对象上，立即获得成功完成任务的反馈。这是一个创建简单的匹配测试的绝棒小组件——你知道的，“找到匹配的对象”。你可以在 `http://jqueryui.com/demos/droppable`\
  \ 找到这个组件。\n\n**图 20-4：** 这个简单的组件帮助你创建一个双列文本页面。\n\n![9781118026229-fg2004.tif](img/9781118026229-fg2004_opt.jpeg)\n\
  \n**图 20-5：** 这个组件允许你创建一个简单的拖放应用程序。\n\n![9781118026229-fg2005.tif](img/9781118026229-fg2005_opt.jpeg)\n\
  \n\n\n\n\n这将为你节省大量时间。它提供了创建 3D 产品查看器所需的所有代码，如图 20-6 所示。它非常棒的一点在于，智能手机和平板电脑用户可以使用手指旋转\
  \ 3D 图像。你可以在 [`www.uize.com/examples/3d-rotation-viewer.html`](http://www.uize.com/examples/3d-rotation-viewer.html)\
  \ 找到该组件的示例。\n\n创建图像和实现组件的说明位于 [`www.uize.com/reference/Uize.Widget.Drag.html`](http://www.uize.com/reference/Uize.Widget.Drag.html)。\n\
  \n**图 20-6：** 一个巧妙的 3D 图像旋转器 —— 创建 3D 产品查看器的极佳组件。\n\n![9781118026229-fg2006.tif](img/9781118026229-fg2006_opt.jpeg)\n\
  \n## HTML5 视频播放器组件\n\n此组件需要 Dreamweaver 来实现，但它是在移动网页中包含视频极极方法。它不使用 Flash，因此在 Apple\
  \ 设备上运行良好。它还具有对旧技术的后备支持，因此可以在不支持 HTML5 的旧设备和浏览器上播放。你可以在 Adobe Exchange 找到此组件：[`www.adobe.com/cfusion/exchange/index.cfm?event=extensionDetail&extid=2294029`](http://www.adobe.com/cfusion/exchange/index.cfm?event=extensionDetail&extid=2294029)。\n\
  \n## 圆角、渐变和投影投影组件\n\nHTML5 的圆角、渐变和投影投影在第 11 章中讨论过，它们通常可以消除在第三方图形应用程序中创建这些效果的需求。然而，创建这些效果可能需要研究和反复尝试。此组件如图\
  \ 20-7 所示，由作者 Andrew Polhill 命名为 `CSS Widget`，它可以为你创建这些效果。你只需要更改 `CSS` 和 `HTML`\
  \ 代码以满足你的特定需求。你可以在 [`http://thatguynamedandy.com/blog/css-widget-rounded-corner-gradient-drop-shadow`](http://thatguynamedandy.com/blog/css-widget-rounded-corner-gradient-drop-shadow)\
  \ 找到此组件及其使用说明。\n\n**图 20-7：** `CSS Widget` 创建了好看的圆角框、渐变和投影投影。\n\n![9781118026229-fg2007.tif](img/9781118026229-fg2007_opt.jpeg)\n\
