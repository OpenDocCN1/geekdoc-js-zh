  \n## 部署您的 Google 搜索引擎\n\n部署您的搜索引擎只需复制 Google 在此过程结束时为您生成的代码即可。在您按照上一节所述选择配色方案并点击\
  \ `Next` 后，您将进入“获取代码”页面，如图 16-11 所示。\n\n**图 16-11：** 要部署搜索引擎，请复制此代码并将其粘贴到您的网页中。\n\
  \n![9781118026229-fg1611.tif](img/9781118026229-fg1611_opt.jpeg)\n\n您可以创建一个专用的搜索页面，如图\
  \ 16-12 所示，或者将代码放入一个 `<div>` 容器中（在第 2 章和第 7 章中讨论），以便将搜索部署到现有页面的某个部分。\n\n**图 16-12：**\
  \ Google 自定义搜索引擎示例：代码视图、搜索和结果页面。\n\n![9781118026229fg1612.eps](img/9781118026229-fg1612_opt.jpeg)\n\
  \n## 将 Google 搜索添加到现有网站模板\n\n创建 Google 搜索引擎后，您可能希望将其整合到您的网站结构中，使搜索引擎页面尽可能与网站其他部分保持一致。如果您为网站创建了基础模板，这实际上非常简单。只需决定将代码放置在页面的哪个位置，或者放在哪个\
  \ `<div>` 容器内即可。创建和使用 CSS 选择器及容器在第 2 章和第 7 章中讨论。\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\
  \ Google 允许您修改结果列表的外观，并在其代码的核心或应用程序级别进行许多其他更改。但这确实是经验丰富的程序员的工作。如果您有兴趣修改 Google 搜索引擎结果列表的外观，请查看\
  \ [`http://code.google.com/apis/customsearch/docs/js/cselement-devguide.html`](http://code.google.com/apis/customsearch/docs/js/cselement-devguide.html)。\n\
  \n您可以将 Google 搜索引擎代码放置在页面上的任何位置。宽度会在合理范围内自动适应并调整为您指定的区域——但高度除外，如图 6-13 所示。无论将代码放在何处，用户都需要滚动才能看到搜索结果。这在\
  \ Google 的结果页面（无论是移动端还是其他设备）上并不罕见。\n\n## Web API 和 Ajax\n\n也许您已经从帮助页面和页面标题中注意到，Google\
  \ 的搜索引擎 API（应用程序编程接口）被称为 Ajax。Ajax（异步 JavaScript 和 XML）是一种设计方法和一组技术，用于在浏览器中为 Web\
  \ 应用程序提供交互式、类似桌面的用户体验。Ajax 通过仅重新加载页面的一部分（而不是整个页面）来响应用户输入，从而实现这一点。与整个页面刷新不同，它与服务器交换少量数据，使应用程序能够快速响应。这在移动设备上非常有用。\n\
  \nAjax 对网页设计师很有吸引力，因为它无需大量后端基础设施即可提供响应式 Web 应用程序。用户受益于具有桌面应用程序熟悉感并提供扩展功能的应用程序。\n\
  \nAjax 正成为创建低开销应用程序的重要技术，例如 Google 自定义搜索引擎和 Google Maps API（在本章下一节中讨论）。您可以在互联网上找到数千个现成的\
  \ Ajax 应用程序，其中一些专为在 Dreamweaver 中使用而设计。有关 Ajax 的更多信息，请访问 W3Schools 教程：[`w3schools.com/ajax/default.asp`](http://w3schools.com/ajax/default.asp)。\n\
  \n**图 16-13：** 在网站模板中部署的 Google 搜索引擎示例。\n\n![9781118026229-fg1613.tif](img/9781118026229-fg1613_opt.jpeg)\n\
  \n## 在您的网站上放置 Google 地图\n\n许多类型的企业，尤其是零售店以及律师事务所、医生办公室等服务公司，都受益于提供其位置的地图和路线。Google\
  \ Maps API 使得在计算机和手持设备上轻松部署地图成为可能。本质上，过程就像将代码复制到模板中并插入正确的地图坐标一样简单。本节将向您展示如何操作。\n\
  \n### 获取 Google Maps API 代码\n\nGoogle 有几种地图 API 版本，包括用于 Flash 和其他一些平台的版本。最新、最强大的是\
  \ Google Map JavaScript API V3，它针对移动设备进行了优化。除了道路地图外，它还支持卫星、航拍和全景照片街景。\n\n如果您在 Google\
  \ 上搜索 Google Maps API，会出现多个选项，包括早期版本的 JavaScript API。最新版本 V3 在 HTML5 中运行，并且对于移动设备来说是一个全面更好的应用程序。您可以在\
  \ [`http://code.google.com/apis/maps/documentation/javascript/`](http://code.google.com/apis/maps/documentation/javascript/)\
  \ 找到最新版本的地图 API（该页面如图 16-14 所示）。点击右上角“如何开始”部分第 2 步中的 `Tutorial` 链接。\n\n**图 16-14：**\
  \ Google Maps JavaScript API 代码和文档的入口页面。\n\n![9781118026229-fg1614.eps](img/9781118026229-fg1614_opt.jpeg)\n\
  \n### 嵌入 Google Maps API 代码\n\n在 Google Maps JavaScript API V3 教程页面上，您可以阅读并按照逐步说明进行操作，或者将示例文档代码复制到一个空白网页中并进行必要的更改。如果您想将地图整合到网站模板中，过程会稍微复杂一些，但也不会太复杂。请按照以下步骤将代码复制到空白\
  \ HTML 页面中，并修改它以显示您的企业或客户企业的位置：\n\n1. 在 Google Maps JavaScript API V3 教程页面上，向下滚动以显示图\
  \ 16-15 所示的代码。\n\n**图 16-15：** Google Maps API 代码。\n\n![9781118026229-fg1615.tif](img/9781118026229-fg1615_opt.jpeg)\n\
  \n2. 复制框中的所有代码。\n\n3. 启动一个空白 HTML 页面，并将代码粘贴到文档中。\n\n4. 找到代码行：`src=\"http://maps.google.com/maps/api/js?sensor=set_true_or_false\"\
  `，并将 `set_true_or_false` 改为 `true`。这告诉应用程序使用移动设备的 GPS 感知当前位置。将其设置为 `false` 当然会告诉应用程序不要感知当前位置。\n\
  \n5. 测试页面。\n\n默认情况下，地图设置为澳大利亚悉尼的一个地址。位置由经度和纬度在以下代码行中设置：\n`var latlng = new google.maps.LatLng(-34.397,\
  \ 150.644);`\n\n要将其设置为您的（或您客户的）企业位置，请确定该位置的经度和纬度并更改这些值。您可以通过更改 `zoom:` 选项来调整缩放级别，该选项位于\
  \ `var myOptions` 下的第一行。默认值为 8。数值越大，放大程度越高；数值越小，缩小程度越高。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 网上有许多网站可以确定经度和纬度。我发现一个很好用的是 iTouchMap.com。只需访问该网站（[`http://itouchmap.com/latlong.html`](http://itouchmap.com/latlong.html)），输入企业地址，iTouchMap.com\
  \ 就会给出坐标。请注意，有些坐标以减号（–）开头。注意减号（–）——它们对于显示正确位置至关重要。\n\n第 17 章\n\n创建移动购物车\n\n本章内容\n\
  \n\n\n\n\n# 购物车解决方案\n\n## ![arrow](img/arrow.png) 分析您的购物车需求\n\n## ![arrow](img/arrow.png)\
  \ 处理支付、税费和运费\n\n## ![arrow](img/arrow.png) 了解 SSL 证书\n\n## ![arrow](img/arrow.png)\
  \ 了解在线电子商务服务\n\n## ![arrow](img/arrow.png) 使用服务器端购物车应用程序\n\n## 概述\n\n在互联网上销售产品和服务已发展成一个价值数十亿美元的行业。每天使用移动设备在互联网上购买产品的用户数量不断增长，可能很快就会超过使用标准台式电脑和笔记本电脑进行购买的用户数量。为互联网购物（即电子商务）提供界面的\
  \ Web 应用程序被称为购物车。\n\n如果您曾在互联网上购买过任何东西，那么您很可能使用过购物车。事实上，世界上一些规模最大、最成功的公司，如亚马逊和 eBay，本质上就是巨大的购物车。而这些庞大的购物车都有移动版本。\n\
  \n由于屏幕尺寸和多样化的设备限制，专门为手持设备设计购物车会带来一系列独特的挑战。例如，驱动典型购物车的代码通常很长且对处理器有一定要求，因此您不希望创建一个在移动设备本身上处理大部分代码的购物车。此外，购物车通常会显示许多产品图片，每个产品往往有多个版本和尺寸的图片——而且同一页面上通常有很多图片。因此，您需要特别注意图片文件大小和下载时间。\n\
  \n购物车解决方案形式多样、来源众多。然而，与搜索引擎（在第 16 章中讨论）一样，为您的移动网站开发购物车实际上只有三种方法：使用在线解决方案，例如 MobiCart\
  \ 或 Google Checkout；使用现成的服务器端购物车应用程序，例如 X-Cart 或 Zen Cart；或者从头开始设计您自己的购物车。\n\n在本章中，我们将探讨前两种方案——使用在线购物车和使用购物车软件包。第三种方案——从头设计购物车，即编写自己的代码——在我看来并不可行；这将是一项耗时巨大的工程。考虑到有众多免费和低成本的解决方案可用，去承担那样的麻烦并非明智之举。时间是最宝贵的资源；您应避免浪费公司（或客户）的大量资金。\n\
  \n购物车解决方案确实形式多样、规模各异。在选择之前，您需要做出几个决定，例如：该解决方案是否适合销售您的产品或服务？您需要销售多少产品？您需要多久添加或移除产品？您将如何收取客户的款项？您将如何计算并收取运费、销售税等？\n\
  \n而这只是最基本的清单。还有许多其他事项需要考虑，因此本章首先列出一份清单，供您在决定解决方案并开始构建电子商务网站之前进行考量。\n\n## 确定您需要购物车实现什么功能\n\
  \n嗯？您只是想在线销售产品并收款？这难道不是小题大做吗？我保证，读完本节后，您会明白为什么决策和规划对于创建成功的购物车至关重要。不仅您的需求因销售内容而异，购物车行为的许多其他方面也至关重要。\n\
  \n例如，大多数购物车需要与一些第三方资源进行交互和服务。以计算和收取运费为例，您的购物车需要与至少一家运输服务商（UPS、FedEx、USPS）的费率表进行交互。如果您希望在交易过程中实时收取信用卡款项，则需要一个信用卡处理商，例如\
  \ PayPal 或与银行开设的商户账户。您选择的电子商务解决方案需要支持这些服务——来自您所使用的这些服务供应商！如果您的客户已经与这些服务的供应商有业务往来，那么您的电子商务解决方案应支持其现有的服务。说服一家公司更换这些关键任务供应商并不总是那么容易，尤其是当他们对自己正在使用的供应商感到满意时。\n\
  \n因此，如您所见，您需要进行一些规划和调研。\n\n## 处理支付\n\n无论您在线销售什么，都需要一种处理支付的方式——即某种商户账户供应商，用于从客户的信用卡或银行账户中收取款项，并将其存入您的银行账户。可用的解决方案有数百种。有些易于注册和使用；另一些则需要广泛的信用记录和个人财务担保。\n\
  \n您选择的支付流程还必须安全。如何处理安全性——确保客户的私人信息在传输过程中不被窃取——取决于您选择的支付解决方案。本节将探讨选择处理商和确保支付安全。\n\
  \n![tip.eps](img/tip_opt.jpeg) 人们在互联网上购物的一个主要原因是方便。无论您选择哪种支付解决方案，都必须简单且即时。我曾见过有人试图建立并运营电子商务系统，要求客户邮寄支票，或者让员工从电子邮件中获取订单并处理信用卡。除非您销售的是长生不老药，否则许多人不会继续这种结账流程，或者根本不会跟进邮寄支票。\n\
  \n### 支付处理商\n\n如果您的公司或客户已经与信用卡处理商建立了商户账户，那么该供应商很可能已经拥有一个安全的在线支付接口。在这种情况下，您需要将该解决方案整合到购物车中。请确保您选择的购物车软件或\
  \ Web 应用程序支持该商户账户接口，或者至少提供一种方法，将支付信息传递给第三方处理商并接收结果以完成交易。有时，根据软件的不同，包含此类功能可能需要一些最低限度的编程来搭建两个应用程序之间的桥梁。您应确保此过程有良好的文档记录——并且您了解其中涉及的内容。\n\
  \n如果您还没有商户账户，最流行且最容易获取、设置和使用的解决方案之一是 PayPal。（如果您曾在 eBay 上购买过任何东西，您可能对 PayPal 很熟悉。）除了易于部署之外，PayPal\
  \ 还有其他一些选择它作为解决方案的好理由：\n\n![check.png](img/check.png) 值得信赖的品牌认知度：使用 PayPal 的一个明显好处是，相当一部分客户对它很熟悉，并且会毫不犹豫地输入他们的支付信息。\n\
  \n![check.png](img/check.png) 无需账户：与许多其他解决方案不同，PayPal 允许您的客户无需拥有现有账户或经历繁琐的账户设置过程即可付款。\n\
  \n![check.png](img/check.png) 多样化的支付选项：PayPal 允许您的客户使用几乎所有可用的信用卡，或直接从他们的支票账户中扣款。这种安排确保您不会因支付类型限制而损失任何销售额。\n\
  \n![check.png](img/check.png) 无缝集成：如图 17-1 所示，购物车软件与 PayPal 之间的交接几乎是无缝的——客户不会在购物车界面和支付处理界面之间切换时产生突兀感。\n\
  \n**图 17-1：** PayPal 与大多数购物车应用程序紧密集成，在界面之间无缝传递信息。\n\n![9781118026229-fg1701.tif](img/9781118026229-fg1701_opt.jpeg)\n\
  \n## 安全性\n\n\n\n\n\n无论你使用什么支付方案，客户的交易都应该通过安全加密的连接进行处理。精明的网络用户知道他们在网站上输入的数据是否受到了防窥探的保护。他们知道从自己常用的浏览器中寻找指示，判断网页是否是“安全的”。图\
  \ 17-2 显示了 `WebKit` 浏览器中的安全网页，它通过地址栏中的锁图标以及 URL 的 `https`（相对于 `http`）部分来指示。\n\n\
  ![tip.eps](img/tip_opt.jpeg) 如果你使用 `PayPal` 或其他支付处理程序，交易的支付部分将自动获得保障。然而，你的许多客户在到达流程中的支付步骤之前，就会寻找安全交易的指示了。在我的网站上，我总是会对所有的购物车页面进行安全处理，这样当用户注册账户或输入任何其他个人数据时，这些数据也会被加密。\n\
  \n## 理解安全套接层 (SSL)\n\n`SSL` 是在 Web 服务器和浏览器之间建立并维护加密链接的行业标准安全机制。这种“套接字”确保在 Web 服务器和浏览器之间传递的所有数据都是加密的，或者在传输过程中经过重排，以便在被截获时无法解密。\n\
  \n要为网站创建一个 `SSL` 套接字，Web 服务器需要该网站的 `SSL` 证书。`SSL` 证书是可以从多个来源购买的产品，包括大多数网络托管公司。此外，为了允许\
  \ Web 服务器和浏览器传递加密数据，它们还会向用户验证该域名确实属于 `SSL` 证书的所有者，并且 `SSL` 颁发机构已核实了公司信息。\n\n加密提交数据的过程对你的客户来说是不可见的。相反，他们的浏览器会显示指示，让他们知道正在使用\
  \ `SSL` 加密页面——大多数浏览器会在浏览器窗口的某处显示锁图标。当用户点击锁图标时，浏览器会显示 `SSL` 证书及其所有者以及加密级别（`64-bit`、`128-bit`\
  \ 或 `256-bit`）。`SSL` 证书颁发给经过`证书颁发机构”（颁发证书的实体）验证的公司或个人。\n\n通常，一个 `SSL` 证书将包含你的域名、公司名称、地址、城市、州和国家。它还包含证书的过期日期以及颁发证书的`证书颁发机构`信息。当浏览器连接到\
  \ `SSL` 站点时，会获取 `SSL` 证书，检查其过期日期，并确保 (a) 证书是由受信任的`证书颁发机构`颁发的，以及 (b) 它正被颁发给该网站使用。如果其中任何信息不相符，用户将收到该站点是不安全的通知。\n\
  \n使用 `SSL` 会增加网站托管的额外费用。使用 `SSL` 的证书需要该站点拥有一个静态 IP 地址，这每月需要花费几美元（通常少于 `$5`），以及证书本身的费用（每年在\
  \ `$50` 到 `$150` 之间不等，取决于加密的位宽水平和证书颁发机构）。如果你在网站上销售产品或收集用户数据，你的客户和用户会感谢你考虑到了他们的数据安全保障。如果不这样做，某些用户将不会使用你的网站。\n\
  \n当安装了 `SSL` 证书后，你就可以通过 `HTTPS` 协议调用页面来安全地加载，例如使用 `https://mystore.mydomain.com`\
  \ 或 `https://www.mydomain.com/mystore`。\n\n使用 `HTTPS` 协议保护页面需要安全套接层 (`SSL`)。（事实上，每当你要求用户输入个人数据（如地址、电话号码等）时，都应该考虑使用\
  \ `SSL`。）你可以从你的网络托管供应商处为你的网站购买 `SSL`。有关此安全措施的更多信息，请参见随附的侧栏。\n\n**图 17-2：** URL 中的此锁和\
  \ `HTTPS` 协议指示这是一个安全站点。\n\n![9781118026229-fg1702.eps](img/9781118026229-fg1702_opt.jpeg)\n\
  \n## 你在卖什么？\n\n人们在网上卖的东西会让你惊讶。此外，我经常对某些人愿意购买的东西感到惊。但无论你在销售什么，它可能属于三类之一：可发货产品、可下载产品或服务。每种类型的产品都需要购物车具备不同的功能。\n\
  \n### 销售可发货产品\n\n这是互联网上销售最常见的产品类型。在线销售的产品范围非常广泛——从电脑线缆到船只和汽车。。要有效地销售这类产品，你的购物车必须支持许多功能。以下列表包含了最关键的功能：\n\
  \n![check.png](img/check.png) 图像：你可能想要显示产品的图像、显示多个不同的视角，或向用户展示一些放大视图，如图 17-3 所示。并不是所有的购物车都能做到这些。\n\
  \n![check.png](img/check.png) 物运：涉及到物运时，有太多需要考虑的事情。例如，你想提供免费邮运、固定费用邮运，还是基于运运公司费率的实际成本邮运？你想添加处理手续费吗？这个列表会一直持续下去。在确定解决方案之前，你应该预先了解这些需求是什么，而不是尝试将这些政策适应到你选择的电子商务软件。如果你正在运输超尺寸或笨重产品（如家具），请记住这些类型的物品通常需要通过货运而非标准运输。在这种情况下，你可能需要联系货运公司获取报价；这些类型的运费无法自动提供。你的电子商务解决方案必须为客户提供运费信息。\n\
  \n**图 17-3：** 根据你销售的产品，客户可能想要看到产品的放大视图或多个视角。\n\n![9781118026229-fg1703.eps](img/9781118026229-fg1703_opt.jpeg)\n\
  \n### 销售可下载产品\n\n可下载产品当然是软件——包括计算机程序、艺术作品、文档、电子书等。基本上，定义涵盖了你销售并从 Web 服务器传输到客户电脑的任何类型的文件。这些产品不需要运输，但它们为你的购物车程序带来了其他挑战。例如，电子商务解决方案必须为用户提供对下载产品的安全访问权限，如图\
  \ 17-4 所示。\n\n它还需要控制对文件的访问。换句话说，你不想提供一个允许无限下载的不受控链接或 URL——除非你不介意赠送你的产品。（你的客户或老板可能会介意！）\n\
  \n**图 17-4：** 在购买流程结束，客户应该获得对下载文件的访问权限。\n\n### 在线销售服务\n\n嗯……你会在网上卖什么服务？法律咨询？医疗检查？信你不信，确实有人在网上销售这些服务，也有人购买它们。但我想的更多是，例如，在线支持合同——或者访问某个特色博客或其他类型的网络内容。通常这些类型的服务具有周期性费用，例如月费或年费。\n\
  \n如果你正在销售订阅型服务，你需要一个支持此类产品的电子商务解决方案——类似于会员费或会费的服务。通常这些类型的产品是自动扣费的。当服务过期或需要续订时，购物车会自动“扣除”客户的信用卡或银行账户。\n\
  \n\n\n\n\n![9781118026229-fg1704.eps](img/9781118026229-fg1704_opt.jpeg)\n\n某些支付处理解决方案（如\
  \ `PayPal`）提供了按月、每季度、每年等对客户账户扣费的能力。然而，这里的关键在于让支付信息回流到电子商务软件中。当然，重点是要确保你选择的解决方案支持定期扣费，并为你的员工提供一种验证客户账户是否处于当前或活跃状态的方法。\n\
  \n例如，如果你正在销售支持合同，你的支持人员在继续支持电话之前，应该能够快速检查客户合同的状态。\n\n## 部署在线移动电子商务服务\n\n正如本章开头提到的，创建在线商店有两种基本选择：\n\
  \n![check.png](img/check.png) 使用在线服务：这通常是让你的购物车上线并运营的最简单、最快的方法——但这种解决方案通常也是限制性最大的。它在配置和产品展示方面没有提供太多的选项。\n\
  \n![check.png](img/check.png) 使用服务器端购物车软件应用程序：这种方法通常提供更丰富的功能集和配置选项，但这些软件包在设置和部署上往往也更加复杂且耗时。\n\
  \n本节将探讨如何寻找和设置在线移动购物车解决方案。下一节“创建服务器端移动购物车”将讨论如何在你的 Web 服务器上寻找和设置电子商务解决方案。\n\n在线电子商务解决方案仅仅就是那样东西——一个允许你列出产品并出售给访问你网站的人的\
  \ Web 应用。在我写这些时，这些解决方案在网上到处涌现。有些是免费的；有些收取小额的月费或年费。另一些对每笔交易或销售收取小额比例的费用。\n\n在 `Google`\
  \ 搜索移动购物车会得到数百万结果——这远超你可能查看和分析的结果（也远超我可能撰描述的范围）。在开始寻找解决方案之前，我建议你先阅读本章前面的“决定你需要你的购物车做什么”部分。在寻找帮助你销售产品的服务之前，先明确你需要什么。\n\
  \n除了本章之前讨论的信息所涵盖的决策外，我建议你考虑以下因素：\n\n![check.png](img/check.png) 成本：该服务将花费你多少钱？是否有月费或年费？该服务是否按每笔销售额收取比例？如果服务是免费的，是否意味着你必须允许该服务在你的移动购物车页面上投放广告？\n\
  \n![check.png](img/check.png) 支持的设备：该服务支持哪些设备？服务使用什么技术来确保兼容性？服务器端代码？应用程序（客户下载并安装到设备上的小程序）？`JavaScript`\
  \ 或其他限制哪些设备可以使用在线商店的客户端技术？\n\n![check.png](img/check.png) 易用性：选择在线服务的主要原因是易用和部署。在开始之前，确保你理解自己正在面对什么！\n\
  \n![check.png](img/check.png) 与你网站的集成：在线服务与你网站其他部分的集成程度如何？是否易于接近你现有网站的布局和配色方案？客户是否会被重定向到另一个网站来进行并完成交易？如果是，这种位置变化有多明显？\n\
  \n现在当你设置 PC 商店时，大多数在线电子商务解决方案设计为以下两种方式之一来补偿移动设备：\n\n![check.png](img/check.png)\
  \ 移动设备用户将自动看到网站的移动版本。\n\n![check.png](img/check.png) 网站将自动适应移动设备的显示。\n\n考虑到这一点，这里有一份适用于移动设备的电子商务解决方案列表：\n\
  \n![check.png](img/check.png) Yahoo Store：作为网上最流行的服务之一，`Yahoo Store` 功能非常强大，并且易于调整以匹配你的网站。它内置了支付处理、库存管理。它每月\
  \ 36 美元，并对每笔交易收取 1.5% 的费用。你可以在 [store.yahoo.com](http://store.yahoo.com) 了解更多信息。\n\
  \n![check.png](img/check.png) Big Commerce：作为一个快速增长的服务，`Big Commerce` 高度可定制，并针对\
  \ `WebKit` 浏览器进行了优化（见第 12 章）。`Big Commerce` 的定价是分级的，价格在 25 美元到 300 美元之间。你可以在 [www.bigcommerce.com](http://www.bigcommerce.com)\
  \ 了解更多并注册。\n\n![check.png](img/check.png) MobiCart：`MobiCart` 是创建购物车的另一种方法，它依赖移动应用来设置在线商店。尽管对于对于一次性购买的客户来说，这并不是理想的方法，但对于经常从你的商店下单的客户来说，这是一个非常棒的方式，无论他们身何处或做什么。在我写这些时，`MobiCart`\
  \ 是免费的。你可以在 [www.mobi-cart.com](http://www.mobi-cart.com) 了解更多信息。\n\n\n\n\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 许多托管服务都提供免费的购物车应用程序；事实上，许多服务还提供了 Zen Cart。在决定解决方案之前，请咨询你的托管服务商，查看他们提供哪些功能。确保他们提供的软件符合你的需求。请记住，在大多数情况下，你并不需要使用托管服务提供的程序。像\
  \ Zen Cart 这样的解决方案在任何服务器上安装都相对容易。\n\n**图 17-5：** 在桌面电脑和手机浏览器上显示的 Zen Cart 购物车。\n\
  \n![9781118026229-fg1705.eps](img/9781118026229-fg1705_opt.jpeg)\n\n# 安装和部署购物车\n\
  \n无论你选择哪种服务器端购物车程序，设置和启动它的步骤都包含以下八个基本步骤：\n\n1. 创建数据库。\n2. 安装软件。\n3. 配置软件。\n4. 定制界面。\n\
  5. 输入并配置你的产品。\n6. 设置支付处理。\n7. 设置物流处理。\n8. 部署购物车。\n\n每一个通用步骤都可能包含若干程序，取决于你销售什么以及软件如何处理特定任务。\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 为了演示如何设置和部署服务器端购物车，我正在使用安装在我的工作站上的测试服务器。你可以按照第\
  \ 4 节的描述，通过安装 Windows 版的 `XAMPP` 或 Macintosh 版的 `XAMPP` 来跟随并创建你自己的购物车。\n\n## 创建数据库\n\
  \n任何有价值的购物车程序都会动态创建其页面。换句话说，它不是让你为产品、结账页面等创建多个静态页面，而是根据需要动态生成 HTML 页面内容。为了实现这一点，这些内容被保存在数据库中。服务器端脚本（通常是\
  \ `PHP`）会调用数据库并请求每个特定页面所需的内容。\n\n与为购物车应用程序创建多个页面相比，这种方法有许多优势。通常，购物车是流动的——你经常会对产品、价格、促销活动、运费和税率以及购物车的其他几个方面进行更改。从数据库中保存和拉取数据，允许你或你的客户进行此类更改，而无需重新配置现有页面并创建新的网页。这种方法还确保了极高的准确性和完整性；它消除了每次更改产品或价格时修改多个页面的需求。\n\
  \n大多数购物车软件包使用 `MySQL` 数据库服务器；大多数基于 `Apache` 的 Web 服务器（大多数网络托管服务中最主要的 Web 服务器）都为客户提供\
  \ `MySQL`。设置购物车的首步是创建一个空数据库，用于存储你的产品和其他信息。通常，你只需要做的是创建一个数据库和一个供购物车软件使用的以配置数据库表和填充数据库的用户。\n\
  \n你的托管服务应该会为你提供一个用于创建 `MySQL` 数据库的 URL，类似于图 17-6 所示的页面。（我使用的是 `XAMPP MySQL` 界面页面。无疑，你所在托管公司的页面会有所不同。但它应该提供类似的功能——一种创建数据库和默认数据库用户的方法。）要创建你的购物车数据库，请遵循以下步骤：\n\
  \n**图 17-6：** 设置购物车的首步：创建一个空数据库。\n\n![9781118026229-fg1706.tif](img/9781118026229-fg1706_opt.jpeg)\n\
  \n1. 访问托管公司提供的 URL。\n2. 在相应字段中输入新数据库的名称。\n\n在本例中，我使用购物车软件的名称 `zencart`。购物车应用程序通常不需要特殊或自定义数据库；默认设置就能很好地工作。\n\
  3. 点击相应的按钮创建数据库。\n\n当服务器创建好数据库后，你将看到一个配置它的页面。在你数据库中创建了用户账户和密码后，你的购物车软件应该会为你完成大部分配置。在我的测试服务器上，这是通过\
  \ `Privileges`（权限）选项卡上的选项实现的。从那里点击 `Add a New User`（添加新用户）链接将弹出如图 17-7 所示的页面。\n\n\
  **图 17-7：** 为购物车软件创建一个用户账户用于填充你的数据库。\n\n![9781118026229-fg1707.tif](img/9781118026229-fg1707_opt.jpeg)\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 本节中的图片显示了我工作站上的 `MySQL` 服务器界面页面。这些页面提供了对服务器的完全、无限制的访问。很可能，出于安全考虑，你托管公司提供的界面不会为你提供这种级别的访问权限。因此，这些选项中的大部分不会显示，这使得为你的数据库创建用户账户变得简单得多，如图\
  \ 17-8 中 DreamHost 的 `Add a New User` 页面所示。事实上，如果你在托管服务的服务器上设置数据库，我建议你参考服务支持文件以获取有关创建数据库和新用户账户的说明。\n\
  \n4. 输入用户名和密码，并点击相应的按钮保存更改。\n\n![remember.eps](img/remember_opt.jpeg) 如果你在 `XAMPP`\
  \ 测试服务器上设置购物车，请确保点击 `Privileges` 部分中的 `Check All` 链接为用户账户提供所有权限。\n\n## 安装购物车软件\n\
  \n在这种情况下，“安装”一词有点不准确。很少、没有 Web 托管公司允许他们在服务器上实际安装任何东西。相反，你通常是在工作站上解压文件，将其上传到服务器，然后通过\
  \ URL 访问设置程序。\n\n**图 17-8：** 托管服务的 MySQL 配置页面会为你完成大部分设置。\n\n![9781118026229-fg1708.tif](img/9781118026229-fg1708_opt.jpeg)\n\
  \n如果你在测试服务器上安装购物车，只需将文件解压到运行购物车的子目录中。之后，你就可以访问 URL 并开始设置软件，正如图 17-9 所示。对于 Zen Cart，大部分初始设置涉及连接数据库并创建基本记录，例如公司名称、联系信息和购物车管理员凭据。\n\
  \n**图 17-9：** 当你将购物车文件上传到服务器后，可以浏览购物车 URL 开始安装过程。\n\n![9781118026229-fg1709.tif](img/9781118026229-fg1709_opt.jpeg)\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 如果你安装的是不同的购物车程序，设置页面和程序会有所不同。然而，后续步骤中提供的信息——做出哪些选择以及为什么——适用于任何使用\
  \ `MySQL` 作为数据库并使用 `PHP` 作为访问数据库和创建网页网页脚本的应用程序。不过，你手头应该准备好你所安装的程序的设置说明，以防程序截然不同。\n\
  \n\n\n\n我已将文件复制到我测试服务器上的 `Zencart` 子目录中。如果你正在你的 Web 服务器上安装购物车，可以使用 Dreamweaver 或\
  \ FTP 客户端（如 FileZilla）将它们 FTP 传输到服务器，你可以从 [`http://filezilla-project.org/`](http://filezilla-project.org/)\
  \ 免费下载 FileZilla。\n\n### 3. 浏览到购物车的初始设置页面。Zen Cart 欢迎页提供了有关该软件的信息以及开始安装过程的说明。在这种情况下，说明是浏览到\
  \ `zc_install/index.php`，该 URL 位于 `zencart` 目录的子目录下，这将打开设置欢迎页。\n\n### 4. 浏览到 `/Zencart/zc_install/index.php`。\n\
  \n### 5. 点击 Continue（继续）按钮。\n\n### 6. 选择单选按钮同意许可，然后点击 Continue（继续）。\n\nZen Cart\
  \ 会进行系统检查，以确保服务器运行着兼容版本的 `PHP`，如图 17-10 所示。如果检查发现服务器存在任何不兼容性，或者所需的 `PHP` 功能未激活，它将在此页面上通知你。\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) XAMPP 和其他 Apache 服务器通常默认配置正确，可以运行\
  \ Zen Cart 以及大多数其他 `PHP` 。如果你的 Web 主机默认没有运行必要的功能，你需要联系他们以了解如何启用它们。如果你运行的是 XAMPP\
  \ 以外的测试服务器，请参考该服务器的文档获取配置信息。再次，在大多数情况下，这是没有必要的。\n\n**图 17-10:** 购物车软件运行兼容性检查，以确保服务器已准备好运行应用程序。\n\
  \n![9781118026229-fg1710.tif](img/9781118026229-fg1710_opt.jpeg)\n\n### 7. 如果检查确定你的服务器已准备好运行购物车，点击\
  \ Install（安装）。\n\n步骤 7 将弹出数据库设置页面。虽然此页面上有许多选项，但你真正需要的是 Database Information（数据库信息）部分，如图\
  \ 17-11 所示。以下是这些选项的说明以及你应该如何填写它们：\n\n* **Database Type（数据库类型）**：除非系统除 `MySQL` 之外还运行了其他数据库软件（可能没有），否则此下拉列表应只有一个选项\
  \ — `MySQL`。在任何情况下，你应该选择 `MySQL`。\n* **Database Host（数据库主机）**：数据库主机是数据库的 DNS 名称。如果你在远程托管服务器上安装购物车，你应该使用你的托管服务提供商给你的\
  \ DNS 名称。如果你在工作站的测试服务器上安装，请使用 `localhost`。\n* **Database Username（数据库用户名）**：这是你在在本章稍之前的“创建数据库”部分设置数据库时创建的用户名。\n\
  * **Database Password（数据库密码）**：这是你在在本章“创建数据库”部分设置数据库时创建的密码。\n* **Database Name（数据库名）**：这是你在在本章稍早之前的“创建数据库”部分设置数据库时创建的数据库名称。\n\
  \n**图 17-11:** Zen Cart 的数据库配置屏幕。\n\n![9781118026229-fg1711.tif](img/9781118026229-fg1711_opt.jpeg)\n\
  \n### 8. 在必填字段中输入相应信息并点击 Save Database Settings（保存数据库设置）。\n\n步骤 8 显示系统设置页面。你可以接受此页面上的所有默认值。\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 如果你在远程服务器上安装，并且已经购买并安装了 SSL\
  \ 证书（如在本章之前的侧边栏“理解安全套接层 [SSL]”所述），你应该点击屏幕底部的“Enable SSL”（启用 SSL）和“Enable SSL in\
  \ Admin Area”（在管理区域启用 SSL）单选按钮，并使用托管服务提供的信息填写此页面 SSL Details（SSL 详情）部分的字段。\n\n###\
  \ 9. 点击 Save System Settings（保存系统设置）。\n\n## 配置你的购物车\n\n安装完购物车软件并配置数据库后，你需要配置你的商店。点击上一节步骤\
  \ 9 中的 Save System Settings 按钮将弹出如图 17-12 所示的 Store Setup（商店设置）页面。以下是此页面选项的列表：\n\
  \n**图 17-12:** 使用此页面个性化你的在线商店。\n\n![9781118026229-fg1712.tif](img/9781118026229-fg1712_opt.jpeg)\n\
  \n![check.png](img/check.png) **Store Name（商店名称）**：你可以用它来命名商店。这是从商店发送给客户的电子邮件中显示的名称。使用描述性的名称，例如“我的公司在线商店”。\n\
  \n![check.png](img/check.png) **Store Owner（商店所有者）**：商店所有者拥有并运营商店的个人或公司。\n\n![check.png](img/check.png)\
  \ **Store Owner Email（商店所有者邮箱）**：这是商店所有者的电子邮件。注意购物车不会使用此地址向商店管理员通知购买和其他事件。该选项在下一个屏幕。\n\
  \n![check.png](img/check.png) **Store Country（商店国家）**：商店所在的国家。\n\n![check.png](img/check.png)\
  \ **Store Zone（商店地区）**：这是商店所在地。对于位于美国的商店，输入州。\n\n![check.png](img/check.png) **Store\
  \ Address（商店地址）**：这是商店的物理地址。\n\n![check.png](img/check.png) **Default Language（默认语言）**：商店的语言（Zen\
  \ Cart 有若干语言模块可以安装）。\n\n![check.png](img/check.png) **Default Currency（默认货币）**：商店的默认货币，或你想进行交易的货币。\n\
  \n![check.png](img/check.png) **Store Demo（商店演示）**：Zen Cart 自带你可以安装以查看商店如何工作的示例。如果你想安装它们可以使用此选项。你可以轻松删除。\n\
  \n## 让你的购物车安全\n\n作为在线商店的运营者，你承担着一项责任：大多数购物车都存储信用卡和其他信息你有你有确保这些信息不被泄露。每个购物车应用程序都有自己的数据安全程序。例如，Zen\
  \ Cart 指导你删除安装文件夹 `zc_install`。你还应该按照 Setup Finished 页面上的说明将几个 `configure.php` 文件设置为只读，防止入侵者更改应用程序配置。\n\
  \n此外，当你第一次尝试访问应用程序的管理页面时，你会看到所示的警告。\n\n![9781118026229-sb1701.tif](img/9781118026229-sb1701_opt.jpeg)\
  \ 在你保护它们之前，程序将不允许你访问管理页面。在继续自定义商店并填充产品之前，你需要点击“重命名管理目录的帮助可以在此处找到”链接并遵循安全管理页面的说明。这非常简单直接。\n\
  \n要配置你的商店，请遵循以下步骤：\n\n1. 在 Store Setup 页面上输入所需信息并点击 Save Store Settings。\n\n这将弹出\
  \ Administrator Account Setup。在这里你可以配置商店管理员的用户名、密码和电子邮件地址。这是商店在发送购买和其他事件通知时使用的电子邮件地址。\n\
  \n2. 在 Administrator Account Setup 页面上填写字段并点击 Save Admin Settings。\n\n这完成了购物车的设置过程。下一个页面\
  \ Setup – Finished 提供了安全你的电子商务网站的说明。你可以通过点击页面上的 Click Here to Go to the Store 按钮进入商店。\n\
  \n## 自定义购物车界面\n\n\n\n\n如果你的购物车像 Zen Cart 一样使用 CSS 来格式化页面，那么修改购物车的外观以匹配你现有的网站应该非常简单。你只需要找到\
  \ CSS 文件并更改代码以适应你的需求即可。本书中的几个章节都讨论了如何编辑 CSS 样式表，主要是第 2 章和第 7 章。\n\n当然，每个购物车程序在修改界面外观方面会有略有不同的选项。Zen\
  \ Cart 鼓励创建一个默认模板的副本并对其进行修改。你可以在 [`http://tutorials.zen-cart.com/index.php?category=4`](http://tutorials.zen-cart.com/index.php?category=4)\
  \ 找到此项操作的说明以及许多其他外观更改方法。\n\n## [此处为原文重复错误修正] 输入并配置你的产品\n\n通常，将产品输入到购物车数据库包括创建产品类别、添加产品信息（如价格和描述）以及创建产品图像。除了创建和缩放图像外，大部分工作都在购物车的后台（或管理页面）中完成，如图\
  \ 17-13 所示。\n\n### 创建产品类别\n\n并不是所有的购物车都需要多个类别——这显然取决于你销售的产品数量以及它们在逻辑上是否属于不同的类别。在\
  \ Zen Cart 中，你至少需要一个类别。你可以从 `Categories` 页面创建它和其他类别，通过点击 `Catalog` 菜单然后选择 `Categories/Products`\
  \ 可以进入该页面。从那里，你点击 `New Category` 按钮，就会弹出如图 17-14 所示的 `New Category` 页面。只需填写简单的表单，为类别命名并提供描述。然后点击\
  \ `Save`。（如果你需要，也可以添加类别图像。这仅仅取决于个人喜好。）\n\n**图 17-13:** Zen Cart 管理界面，你可以在此处添加产品并控制购物车的行为。\n\
  \n![9781118026229-fg1713.tif](img/9781118026229-fg1713_opt.jpeg)\n\n**图 17-14:**\
  \ Zen Cart 的 New Category（新建类别）页面。\n\n![9781118026229-fg1714.tif](img/9781118026229-fg1714_opt.jpeg)\n\
  \n### 创建产品图像\n\n每个购物车应用程序处理产品图像的方式不同。例如，某些程序需要特定的显示尺寸。某些支持同一个产品对应多个图像；另一些则不支持。有些能够以不同的尺寸显示相同的图像。Zen\
  \ Cart 同时支持这两种选项——多图像以及以多个缩放级别显示相同图像的能力。\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\
  \ 虽然像 Zen Cart 这样的程序允许你在多个缩放级别上使用同一图像，但你需要对此保持小心。为了让此功能正常工作（即在所有尺寸下都能良好显示），图像必须配置为最大显示尺寸。这意味着无论图像在页面上的尺寸多大，移动设备都必须下载整个文件。在一个包含多个产品图像的页面上，你可能会为了以最小尺寸显示产品图像而下载许多巨大的文件，这会显著降低整个页面的下载和显示。\n\
  \nZen Cart 中配置和使用产品图像的选项非常详尽；因此，描述如何使用它们的信息也是如此。除了这里以及第 10 章（涵盖了 Web 媒体格式化）提供的信息外，你还可以在\
  \ [`http://tutorials.zen-cart.com/index.php?article=58`](http://tutorials.zen-cart.com/index.php?article=58)\
  \ 找到关于在购物车中创建和部署图像的额外信息。\n\n![tip.eps](img/tip_opt.jpeg) 请记住，在为购物车配置图像时，对称性很重要（如图\
  \ 17-15 所示）。保持所有缩略图（初始显示图像）尺寸相同，这样你的产品页面看起来才不会是不匹配的多尺寸图像拼贴画。\n\n**图 17-15:** 保持购物车中所有缩略图尺寸相同，以便保持页面的对称性。\n\
  \n![9781118026229-fg1715.tif](img/9781118026229-fg1715_opt.jpeg)\n\n### 添加产品\n\n\
  当你创建了类别和图像后，就可以开始向数据库中填充产品了。同样，每个购物车应用程序处理此方式会有所不同。Zen Cart 允许你在一个屏幕上创建产品，并同时选择和上传图像。\n\
  \n产品是在类别内部创建的。在本章“创建产品类别”部分讨论的并在图 17-15 中所示的 `Category` 页面上，点击你想添加产品的类别，然后点击 `New\
  \ Product` 按钮，这将弹出如图 17-16 所示的屏幕。\n\n**图 17-16:** Zen Cart 的类别内产品页面，允许你输入并配置产品。\n\
  \n![9781118026229-fg1716.tif](img/9781118026229-fg1716_opt.jpeg)\n\n你如何填写此页面对产品的显示方式至关重要。以下列表描述了每个选项及其配置方法：\n\
  \n![check.png](img/check.png) `In Stock/Out of Stock`: Zen Cart 以及其他购物车允许你控制库存。如果你勾选\
  \ `Out of Stock`，该产品在页面上将显示为售罄。\n\n![check.png](img/check.png) `Date Available`:\
  \ 使用此选项控制产品的可见日期。此选项出现在 New Product 部分。\n\n![check.png](img/check.png) `Product\
  \ is Free/Product is Call for Price/Product ised by Attributes`: 前两个选项不言自喻。第三个 `Product\
  \ ised by Attributes` 允许应用程序更高级的部分根据变量控制定价，例如客户购买下载版本还是发货版本。\n\n![check.png](img/check.png)\
  \ `Tax Class`: Zen Cart 以及其他功能全的应用程序允许创建多种税务场景，例如州。使用此选项为产品分配特定的税类。\n\n![check.png](img/check.png)\
  \ `Product Price (Net)/Product Price (gross)`: 这两个选项允许为产品设置两个价格：单价和批量多单位价格。\n\n\
  ![check.png](img/check.png) `Product is Virtual`: 虚拟产品是可下载的。当然，虚拟产品不需要收货地址。\n\n\
  ![check.png](img/check.png) `Always Free Shipping`: 使用此选项控制免邮选项。\n\n![check.png](img/check.png)\
  \ `Products Quantity Box Shows`: 此选项与页面下方的 Products Quantity 部分配合。使用它来控制客户是否可以看到库存数量。\n\
  \n![check.png](img/check.png) `Product Qty Minimum/Product Qty Maximum/Product Qty\
  \ Units/Product Qty Min/Unit Mix`: 这些选项允许你批量或成批销售产品。换句话说，客户必须购买特定数量。这些选项协同工作的方式较为复杂。你可以在\
  \ [`http://tutorials.zen-cart.com/index.php?article=37`](http://tutorials.zen-cart.com/index.php?article=37)\
  \ 获取更多信息。\n\n![check.png](img/check.png) `Product Description`: 此选项本身是不言自明的——但你应该知道此字段支持大多数标准的\
  \ HTML 标签。因此，你可以按需要格式化文本并创建链接、列表以及任何文本格式化功能，如图 17-17 所示。\n\n![check.png](img/check.png)\
  \ `Products Quantity`: 这是 Zen Cart 库存控制系统的一部分。除了跟踪现有数量，它还向客户显示当前库存。\n\n\n\n\n\n\
  ![check.png](img/check.png) **产品型号**：你可以使用此选项为产品创建或包含编号。\n\n![check.png](img/check.png)\
  \ **产品图像**：使用此选项选择产品图像文件。此选项还会将图像上传到远程服务器并创建图像链接，以便其正常显示。\n\n![check.png](img/check.png)\
  \ **产品 URL**：使用此选项创建产品页面的链接，以便为客户提供更详细的产品描述。你可以创建自己的产品页面，也可以链接到制造商的产品页面。\n\n![check.png](img/check.png)\
  \ **产品运重**：如果你使用基于产品重量的运输系统，购物车将使用此选项来计算运费。\n\n**图 17-17：** 使用 HTML 标签控制产品描述外观和功能的示例。\n\
  \n![9781118026229-fg1717.tif](img/9781118026229-fg1717_opt.jpeg)\n\n## 设置支付处理\n\n\
  在线支付处理是一个巨大的话题，有很多许多选项，正如本章前面的“处理付款”部分所讨论的那样。Zen Cart 支持几种流行的支付处理选项，包括 `Authorize.Net`\
  \ 和 `PayPal`，这是两个最广泛使用的。支付处理选项通过 `Payment` 模块配置，你可以从 `Modules` 菜单进入该模块。此页面还提供了每个选项的安装说明。\n\
  \n## 设置运输处理\n\n运输处理的选项几乎和支付处理器一样多。全功能购物车允许你创建自己的运输参数，或使用来自主要收运商的运表，例如 `UPS`、`FedEx`\
  \ 和 `美国邮政 (U.S. Postal Service)`。Zen Cart 让你同时具备这两者，还可以配置单独的“手续费”。你也可以选择收取固定费用或按产品收取费用。你可以在\
  \ `Shipping` 模块中设置运输参数，你可以从 `Modules` 菜单进入该模块。到达那里后，选项非常直观。如果你想与收运商的费表交互，可以在 [`http://tutorials.zen-cart.com/index.php?category=12`](http://tutorials.zen-cart.com/index.php?category=12)\
  \ 找到相关信息。\n\n## 部署购物车\n\n最后！你已经安装了购物车，配置了数据库，自定义了界面，输入了产品，设置了支付和运输处理——终于可以把你的商店上线并大赚了。要让它运行起来，你只需要从你的网站为它创建一个链接。如果网站将在\
  \ SSL 证书运行——如侧边栏“理解安全套字层 (SSL)”所讨论的——你应该在超链接中使用 `https` 协议。\n\n此外，正如第 15 章所讨论的，通过针对\
  \ Google 和其他搜索引擎优化页面，可以让你的购物车获得更多曝光。\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\
  \ 如果你已经在测试服务器上安装了 Zen Cart 并想将其移动到你的 Web 主机服务器，可以在 [`http://tutorials.zen-cart.com/index.php`](http://tutorials.zen-cart.com/index.php)\
  \ 找到相关信息。\n\n# 第五部分\n## 十部\n\n![9781118026229-pp0501.eps](img/9781118026229-pp0501_opt.jpeg)\n\
  \n### 在此部分中 . .\n\n本部分提供了许多你认为有用的内容的链接。第 19 章向你展示了在哪里可以找到十种不同的移动模拟器，这些是小型应用程序，可以让你看到网站在特定设备上的外观。第\
  \ 20 章包含了几个拥有多个移动 Web 模板的链接——有些是免费的，有些是出售的。在第 21 章中，你将找到十个组件（widgets）的链接，这些是你可以用来创建页面元素的简短代码段，例如菜单、`Google\
  \ Maps`、3D 产品查看器以及许多其他有用对象。\n\n# 第 18 章\n##十大移动模拟器\n\n移动模拟器允许你看到你的移动网站在特定移动设备上的模拟效果。虽然这完全无法与在实际移动设备上查看网站相比，但它们是次优选择。毕竟，没有其他方法（除非你在手机店工作）可以让你看到你的网站在市场上所有不同手持设备上的显示情况。\n\
  \n你应该尝试在尽可能多的移动模拟器中测试你的网站——或者在你有时间的情况下尽可能多。互联网上有许多移动模拟器。有些针对特定类型的移动设备，例如 `iPhones`\
  \ 或 `BlackBerry` 手持设备；另一些允许你在各种移动设备之间切换。有些是你安装在电脑上的可下载工具，另一些是在线网站，你可以在其中输入移动网站的\
  \ `URL` 并在网页上查看结果。\n\n本章介绍了一些流行且实用的移动模拟器。你将学习在哪里找到这些模拟器以及如何使用它们。在模拟器中查看你的移动网站允许你将在发布网站并向世界发布之前，对你的布局进行关键调整。\n\
  \n## Adobe Device Central\n\n在所有设备模拟器中，最全面的可能过于 Adobe 的 `Device Central`，如图 18-1\
  \ 所示。`Device Central` 是随大多数 Adobe 流行的设计和媒体编辑软件自带的工具，例如 `Flash`、`Dreamweaver`、`Photoshop`\
  \ 和 `Illustrator`。你不能作为独立应用程序购买它（尽管如果可以就好了）。\n\n**图 18-1：** Adobe Device Central\
  \ 模拟了几乎每一个移动设备。\n\n![9781118026229-fg1717.tif](img/9781118026229-fg1717_opt.jpeg)\n\
  \n就模拟器而言，我所知的 `Device Central` 拥有最大的移动设备数据库，而且该数据库不仅由 Adobe 更新，还由用户更新。`Device Central`\
  \ 还提供了我见过的最多的信息。\n\n例如，你可以来回切换方向，查看你的页面使用了多少内存（如图 18-2 所示），甚至可以看到你的网站在各种光照情况下的外观模拟。坦率地说，如果你有这个工具，你可能就不需要去网上寻找其他的。\n\
  \n真的没有比这更好的了。`Device Central` 甚至会在你点击链接或加载新页面时显示内存使用的变化。\n\n**图 18-2：** Device Central\
  \ 描绘了 Flash 文件使用了多少内存。\n\n![9781118026229-fg1717.tif](img/9781118026229-fg1717_opt.jpeg)\n\
  \n**图 18-3：** Device Central 可以模拟你的页面在室内、户外或直射阳光下的外观。\n\n![9781118026229-fg1717.tif](img/978111802629-fg1717_opt.jpeg)\n\
  \n### Opera Mini Simulator\n\n`Opera Mini` 是流行浏览器 `Opera` 的移动版本。许多中高级移动用户会在他们的手持设备上下载此浏览器，因为它提供了许多热门设备自带浏览器不支持的功能。它运行迅速并支持大多数\
  \ `WebKit` 扩展（在第 12 章讨论）。你可以在 [`www.opera.com/mobile/demo`](http://www.opera.com/mobile/demo)\
  \ 找到 `Opera Mini Simulator`。\n\n使用 `Opera Mini Simulator` 非常简单。只需在模拟器右上角的地址栏中输入你想查看的移动网站地址。当你的主页加载后，你还可以点击链接和菜单项以查看网站其他页面的显示情况。\n\
  \n### TestiPhone–iPhone Simulator\n\n互联网上的许多 `iPhone`、`iPod` 和 `iPad` 模拟器都很好。在使用\
  \ `TestiPhone` 时运气不错，它显示的内容相对准确。你可以在 [`www.testiphone.com`](http://www.testiphone.com)\
  \ 访问 `TestiPhone`。\n\n\n\n\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\
  \ 我注意到的的一点 — `TestiPhone` —— 是，模拟器似乎忘记了 iPhone 以及其他 Apple 手持设备并不支持 `Flash`。但无论如何，它们仍然会播放\
  \ `Flash` 内容。此外，某些 iPhone 模拟器与上一节中的 `Opera Mini Simulator` 不同，会忽略 `JavaScript`；另一些则会忽略检测和切换脚本（在第\
  \ 6 章中讨论）。如果你使用的模拟器是此类情况，只需输入网站移动版本的 URL 即可。\n\n使用图 18-4 所示的 `TestiPhone` 只需要访问到之前的\
  \ URL，并在模拟器顶部的地址栏中输入该 URL。当你的移动主页加载后，你就可以点击菜单和链接项来测试其他页面。\n\n**图 18-4：** `TestiPhone`\
  \ 是一个相当准确的 iPhone 模拟器。\n\n![9781118026229-fg1804.tif](img/9781118026229-fg1804_opt.jpeg)\n\
  \n### iPad Peek\n\n位于 [`http://ipadpeek.com`](http://ipadpeek.com) 的 `iPad Peek`\
  \ iPad 模拟器是查看你的移动页面在 iPad 上外观的绝佳资源。这些设备的屏幕相当大，通常你不需要在代码中为它们进行补偿。然而，它们不支持 `Flash`。\n\
  \n要使用图 18-5 所示的 `iPad Peek`，只需访问 [`http://ipadpeek.com`](http://ipadpeek.com) 并在地址栏中输入你想要测试的移动站点。当主页加载后，你可以通过点击菜单项和其他链接来测试你网站的其他部分。你可以点击\
  \ iPad 边框或显示区域周围的黑色区域来旋转 iPad 模拟器。\n\n**图 18-5：** 要在 `iPad Peek` 中旋转 iPad，请点击 iPad\
  \ 边框任意。\n\n![9781118026229-fg1805.eps](img/9781118026229-fg1805_opt.jpeg)\n\n###\
  \ Android 模拟器\n\n出于某种原因，寻找 Android 模拟器非常困难，尤其是在线版本。在我写这些内容时，我能找到的只有随 `Android Software\
  \ Development Kit` (`SDK`) 一起的模拟器。大多数操作系统 (`OS`) 都有 `SDK`，它们通常由操作系统的开发者发布。`SDK`\
  \ 的设计目的是帮助你为特定的 `OS` 创建应用。\n\n好消息是，你不需要下载并安装 `Android SDK` 来获取模拟器，这是一个相当繁琐且复杂的过程。`Redmond\
  \ Pie` 的人员从 `SDK` 中提取了模拟器，并将其封装成一个标准的 Windows 安装执行文件，你可以下载并轻松地安装在 Windows 电脑上。你可以在\
  \ [`www.redmondpie.com/android-emulator-for-windows`](http://www.redmondpie.com/android-emulator-for-windows)\
  \ 找到 Android 模拟器的安装文件以及安装和使用模拟器的说明。\n\n![tip.eps](img/tip_opt.jpeg) 并不是手持平台都有良好的在线模拟器。例如，很难为\
  \ `BlackBerry` 和 `Android` 设备找到良好的在线模拟器。事实上，我发现找一个好的 `BlackBerry` 模拟器都很困难，即使是可下载的模拟器也是如此。（注：此处原文存在大量重复，已按要求去重处理）\n\
  \n并不是手持平台都有良好的在线模拟器。例如，很难为 `BlackBerry` 和 `Android` 设备找到良好的在线模拟器。事实上，我发现找一个好的 `BlackBerry`\
  \ 模拟器都很困难，即使是可下载的模拟器也是如此。\n\n实际上，Firefox 会向服务器发送新的用户代理字符串，这取决于你是如何开发网站的。这是本书的主题。\n\
  \n`User Agent Switcher` 会定期开发额外的用户代理。你可以在开发者的帮助页面找到它们以及关于该插件的相关信息：[`http://chrispederick.com/work/user-agent-switcher/help`](http://chrispederick.com/work/user-agent-switcher/help)。\n\
  \n实际上，Firefox 会向服务器发送新的用户代理字符串，这取决于你是如何开发网站的。这是本书的主题。\n\n### 设备\n\nApple 的 Safari\
  \ 还具有强大的调试和 WebKit 检查功能，你可以通过将 Safari 置于开发者模式来开启它。开发者选项位于“开发”菜单中。“开发”菜单中还有一个“用户代理”选项，用于模拟用于\
  \ iPhone、iPad 和 iPod 的 `iOS`。\n\n### 手机手机模拟器\n\n`Mobile Phone Emulator` 允许你测试某些其他模拟器无法提供的设备，例如\
  \ `HTC` 和 `Samsung` 手持设备。它还允许你输入许多模拟器中不存在的值，例如屏幕分辨率和 `OS` 类型。你可以在 [`www.mobilephoneemulator.com`](http://www.mobilephoneemulator.com)\
  \ 找到 `Mobile Phone Emulator`。\n\n要使用此模拟器，你只需在 `Cell Phone Terminal` 下方的第一个下拉菜单中选择设备，并在\
  \ `Website to Simulate` 下方的第一个输入框中输入 URL。这并不是世界上最准确的模拟器，但我喜欢它的一点是，它能识别并使用我的检测和切换脚本。\n\
  \n### 第 19 章：前十个移动模板网站\n\n移动网站设计过程中最耗时的部分之一是创建和布局网站的初始设计——即构思网站的模板。（创建移动网页模板在第 8\
  \ 章中讨论。）通常，获得整体设计（如 `CSS` 容器、菜单、按钮和配色方案）需要大量的尝试。对于我来说，这通常是整个过程中最艰难的部分。\n\n\n\n\n\
  当你在为客户设计时，有时你可能需要为客户提供几个不同的设计方案供其考虑。即使是经验最丰富的设计师也会使用第三方模板，特别是当客户不愿意付钱让你为她的网站设计定制方案时。在这些情况下，通过从模板开始，你可以节省时间并为你的客户节省费用。\n\
  \n设计师和客户对使用模板最关心的问题之一是，你面临着开发出一个和别人太像的网站的风险。但我可以根据多年的经验告诉你，当你一旦更改了模板中的图像和配色方案时，它看起来像另一个使用相同模板的网站的概率就微乎其微了。此外，互联网上有成千上万个网页模板可用。你或你的客户选择一个许多其他公司或组织也选中的模板的可能性是极小的。\n\
  \n你可以在互联网上找到许多免费的移动网页模板，以及许多相对便宜的模板。我所说的便宜是指低于 100 美元。考虑到创建一个原创设计需要多长时间，这确实是一项非常划算的交易。\n\
  \n在本章中，我将向你展示互联网上最好的十个移动模板网站或模板商店。此外，我还会为你提供一些选择模板的建议。这些网站是选择几百个设计良好的模板的好去处，并关于如何自定义以及添加内容提供了非常好的文档。这些网站可以从整个设计和部署过程中缩短数小时。\n\
  \n## 如何选择网页模板\n\n好了，你可能在想，选择模板有什么困难的？这本身并不困难；你只需要在选择模板时做到“三思而后行”。哪个模板能为你节省最多的时间并提供通往成功的最高效路径？例如，选择一个你必须硬挤进去、操纵并做出妥协以适应你内容的模板，远不如选择一个能轻松适应你内容的模板来得理想。模板的文档同样重要。如果模板的创建者提供了关于如何修改模板和替换占位内容的充分描述，那将是非常有帮助的\n\
  \n### 使模板与你的内容匹配\n\n查看图 19-1 中的三个网站。显然，这三个模板的风格完全不同，适用于不同类型的内容。请记住，你将用自己的图像、图标和文本替换你看到的内容。你可能还会更改颜色。\n\
  \n**图 19-1：** 移动模板有许多不同的风格并适用于不同类型的内容。\n\n![9781118026229-fg1901.eps](img/9781118026229-fg1901_opt.jpeg)\n\
  \n例如，其中一个模板使用完全填充屏幕的图像。另一个仅由标志、图标和菜单项组成。另一个一个在顶部有一个小横幅。这三者传达了不同的基调。在为你的网站选择模板时，你应该考虑所有这些客观技术问题，以及更具主观的设计风格和基调问题。考虑你的内容，包括图像的大小、你的页面所需的文本量，以及你的网站是一个严谨的业务网站，还是一个花哨而有趣的网站。\n\
  \n你明白意思了，对吧？\n\n## 文档\n\n许多免费模板的缺点是它们的文档不详尽。并不是所有付费模板都有良好的文档，但较大的模板商店，如 `TemplateMonster.com`\
  \ 和 `Templates.com` 要求其设计师创建关于如何修改模板外观以及用你自己的内容替换占位内容的良好文档。许多模板商店还拥有强大的支持页面，描述了如何编辑\
  \ `CSS`、`HTML` 以及模板中包含的图像。\n\n诚然，你可能可以弄清楚模板是如何构建的——尤其是在读完这本书之后。但由他人提供这些信息可以为你节省大量时间。例如，如果网站的按钮是由\
  \ `CSS` 样式构建的，你如何更改按钮上的标签？\n\n为自己帮个忙，在购买或投入过多时间使用模板之前，查看网站的帮助文件、常见问题解答（FAQs）和其他支持页面。如果可能，查看模板的文档，并确保你理解自定义它和添加你的内容需要什么。\n\
  \n[Templates.com](http://www.Templates.com)\n\n图 19-2 显示的 Templates.com 是一个相当大的网页模板库，以及你可以在网页设计中使用的各种其他产品，如剪贴画和\
  \ 3D 模型。它提供出售的模板以及几个免费模板，包括免费的移动模板。Templates.com 上的模板都是专业设计且文档详尽的。\n\n**图 19-2：**\
  \ Templates.com 提供了大量的网页模板选择，包括移动模板。\n\n![9781118026229-fg1902.tif](img/9781118026229-fg1902_opt.jpeg)\n\
  \n[TemplateMonster.com](http://www.TemplateMonster.com)\n\n也许是世界上最大的模板库，`TemplateMonster.com`\
  \ 拥有数百个专业设计的移动网页模板，包括许多 `HTML5` 移动模板。模板按业务类型分类，但你并不被限制必须使用为特定业务类别设计的模板。\n\n尽管有几个免费模板，但移动模板的平均价格约为\
  \ 40 美元。这些模板的文档都非常完善且有支持。\n\n## MoveToDotMobi\n\n图 19-3 显示的 MoveToDotMobi 提供了约 40\
  \ 个（截至本文编写）非常良好的移动模板。这些模板每个约为 90 美元，并旨在根据手持设备重新格式。虽然该网站提供的模板数量不大，但多样性很好。你应该能够找到符合你网站整体基调和主题的模板。你可以在\
  \ `www.webdesignobile.com/html-ready-templates.php` 找到 MoveToDotMobi。\n\n**图 19-3：**\
  \ MoveToDotMobi 专业设计的移动模板。\n\n![9781118026229-fg1903.tif](img/978111802629-fg1903_opt.jpeg)\n\
  \n## MEE Templates\n\n图 19-4 显示的 MEE Templates 拥有越来越多的精美移动模板和移动博客模板。每个约为 30 美元，并提供多种语言。该公司还为自由职业者和营销公司提供\
  \ 40% 的折扣，使其更加划算。该公司在网站上的广告声称你可以在 20 分钟内建立网站。我不确定这一点，但自定义这些模板并将占位内容更换为你的内容非常简单。你可以在\
  \ `www.meetemplates.com` 找到 MEE Templates。\n\n**图 19-4：** MEE Templates 以合理的价格提供移动和移动博客模板。\n\
  \n![9781118026229-fg1904.tif](img/9781118026229-fg1904_opt.jpeg)\n\n\n\n\nAllwebco\
  \ Design Corporation 提供的 mobiHybrid 模板（如图 19-5 所示）是基于 PHP 的模板，适用于各种尺寸的计算机和手持屏幕。服务器端脚本会根据查看网站设备的屏幕尺寸提供相应的页面。由于所有脚本都是\
  \ PHP，这些模板应该能够兼容几乎所有的移动设备。大多数模板的价格略高于 20 美元，这是一个非常划算的选择。你可以在 `http://allwebcodesign.com/setup/mobi-templates.htm`\
