  \n## Google Web Toolkit 按钮\n\n此组件创建一个标准的 HTML 按钮，而无需创建所有典型的辅助表单代码——如今，网站上的按钮不仅仅是为了发送表单信息。该组件允许你创建启用和禁用的按钮，以及带有用于启动脚本的事件监听器的按钮。事件监听器在第\
  \ 3 章中讨论。\n\n你可以在 [`www.gwtapps.com/doc/html/com.google.gwt.user.client.ui.Button.html`](http://www.gwtapps.com/doc/html/com.google.gwt.user.client.ui.Button.html)\
  \ 获取如图 20-8 所示的 Google 组件。\n\n"
