  \n## 下一步去哪里\n\n\n\n你想做什么？是想学习使用 HTML、CSS 和 JavaScript 的基础知识吗？那就从第 1 章开始，阅读这一章以及接下来的两章。还是想直接动手创建一个移动网页？如果是这样，请翻到第\
  \ 7 章。你明白我的意思了吗？请查看本引言中的“本书的组织方式”部分，决定你想做什么，然后前往相应章节。\n\n你还可以在《HTML、CSS 和 JavaScript\
  \ 移动开发傻瓜书》的配套网站 [`www.wiley.com/go/htmlcssjscriptmobiledev`](http://www.wiley.com/go/htmlcssjscriptmobiledev)\
  \ 上获取本书的代码示例。\n\n请注意，本电子书中使用的一些特殊符号可能无法在所有电子阅读器设备上正确显示。如果你在识别任何符号时遇到问题，请致电 Wiley\
  \ 产品技术支持：800-762-2974。在美国境外，请致电 317-572-3993。你也可以通过 [www.wiley.com/techsupport](http://www.wiley.com/techsupport)\
  \ 联系 Wiley 产品技术支持。\n\n# 第一部分\n\n## 起初，还没有移动设备……\n\n![9781118026229-pp0101.eps](img/9781118026229-pp0101_opt.jpeg)\n\
  \n在本部分中……\n\n很少有比移动技术更能代表 21 世纪的事物——人类的所有知识通过你后口袋里的那个小玩意儿即时传递给你。作为移动设计师，你的工作就是创建实现这一目标的网站。\n\
  \n在本部分中，你将认识并熟悉为手持设备设计内容所涉及的关键角色。首先，你将认识关键角色——移动网络用户——并了解他们与桌面电脑用户的不同之处。然后，你将认识并了解\
  \ HTML、CSS 和 JavaScript 技术——它们是什么以及如何协同工作。本部分最后介绍了可用的设计程序、实用工具和其他软件，帮助你成为一名成功的网络开发者。\n\
  \n## 第 1 章\n\n### 为大屏幕和小屏幕设计网站\n\n## 本章内容\n\n![arrow](img/arrow.png) 分析普通移动用户\n\n\
  ![arrow](img/arrow.png) 初步了解 HTML\n\n![arrow](img/arrow.png) 理解 HTML 的局限性\n\n![arrow](img/arrow.png)\
  \ 认识 XHTML 和 HTML5\n\n和任何有经验的网页设计师聊聊。他们大多数人都会同意，为手持设备创建网站是一种巨大的倒退。另一方面，移动用户则认为，能够将网络内容传送到他们的智能手机、PDA\
  \ 和平板电脑上是一种尖端技术。对他们来说，（至少在这个星球上）很少有比从口袋里掏出一个小玩意儿、按几个按钮，然后“瞧！”更先进的事情了：你几乎可以找到所有问题的答案，获得几乎所有解决方案，了解几乎所有产品的信息，获取人类积累的全部知识——至少是存放在网络上的那部分——尽在指尖。\n\
  \n那么，到底是哪一种情况呢？移动网络是信息技术的尖端，还是回到互联网的中世纪时代？\n\n在互联网早期，除了少数精选用户外，几乎所有用户都通过（按今天标准来看）非常慢的电脑“上网”，这些电脑通过极其缓慢且不可靠的拨号调制解调器连接到互联网。互联网用户不仅要忍受无休止地等待内容下载并显示在屏幕上，还要应对频繁的断线、过载的普通老式电话系统（POTS）网络、忙音信号以及其他许多恼人的不足。\n\
  \n那时的网页设计是一种平衡行为。设计师常常不得不抑制自己提供美观、丰富内容的欲望，转而考虑更实际的因素，如文件大小和下载时间。直到负担得起的宽带——相对快速可靠的\
  \ DSL 和有线互联网连接——的出现，以及网络浏览器和内容压缩技术的进步。\n\n这些进步解放了设计精神。不再需要那么频繁地弥补技术限制。网络内容从包含小图片和文本的普通页面，变成了丰富、多媒体满载的盛宴。然后移动设备出现了，它们拥有小屏幕、慢速处理器和低带宽的蜂窝网络——使网页设计几乎回到了原点。网页设计师再次发现自己被限制在传递小而可管理的内容块中，弥补着熟悉的限制。\n\
  \n在本章中，我将向你介绍普通移动用户，并说明为什么为他们设计与为使用台式机或笔记本电脑访问互联网的普通用户设计不同。然后，我将向你介绍最基本的网页设计工具——HTML——它是什么以及如何工作。\n\
  \n关于 HTML 的一点说明：它最初是一种非常基础的网页设计语言，并且至今仍然如此。如果没有 XHTML 和 CSS 等增强功能，它实际上并不适合移动网页设计。本章还将简要讨论\
  \ HTML5——网页设计的未来，以及 HTML 的演变如何影响移动网页设计。\n\n## 介绍移动互联网用户\n\n在某些方面，很难相信互联网已经存在了足够长的时间，以至于我们可以按世代来讨论它，或者按用户开始使用互联网的时间来分组讨论。诚然，进行分类和概括（尤其是在谈论人的时候）总是有风险的，但有时是必要的。不过，在开始之前，我应该让你知道，我知道我即将做出的刻板区分只是刻板印象或概括。概括（至少这里使用的概括）展示了共性，但绝不真正定义该类别中的成员。\n\
  \n话虽如此，让我大胆地提出一个观点。移动互联网用户有两种类型：\n\n![check.png](img/check.png) **老派用户**：就本讨论而言，老派用户已经存在了一段时间。他们在手持设备出现之前就开始使用互联网。他们习惯于在宽敞的大屏幕上接收大量信息，有足够的空间舒展身体并感到舒适。他们喜欢这样。对他们来说，在移动设备上浏览互联网似乎……不自然。\n\
  \n![check.png](img/check.png) **新派用户**：新派用户——通常是老派用户的子女——在移动环境中长大。对他们来说，在移动设备上访问互联网——网页、电子邮件、短信，全套服务——是自然秩序的一部分。他们没有经历过没有移动网络的生活，也不真正理解以前并非如此。\n\
  \n### 老派风格\n\n老派用户，或称前移动互联网用户，有几个共同的习惯和态度。关于他们，最重要的一点是，尽管他们欣赏移动技术（甚至有些敬畏），但这并不是他们使用网络的主要方式：虽然他们在手持设备上访问网络，但他们内心其实希望坐在自己宽敞舒适的台式机或笔记本电脑前。\n\
  \n尽管移动网络很方便，但当你习惯了大量信息传递到电脑屏幕上时，以小块形式、适合三四英寸屏幕的方式一点一点地获取信息可能会令人恼火。许多前移动网络用户根本不喜欢移动网络那种简短、只讲事实、零散地传播内容的方式。\n\
  \n无论你喜欢与否，不可否认的是，随着人们年龄增长，他们会变得固守自己的方式。我们年龄越大，就越不喜欢改变。大多数前移动互联网用户在地球上已经生活了一段时间。从宽敞的\
  \ 15、17 甚至 24 英寸（或更大）的显示器——配有舒适键盘和易于使用的鼠标——转向小巧的手持设备，是一种冲击；这是一种文化冲击体验。这有点像把你的 SUV\
  \ 换成了一辆 Smart 汽车。\n\n\n\n\n许多老派用户不情愿地使用移动设备上网。尽管他们欣赏无论身在何处都能快速获取信息，但他们宁愿不在小屏幕上眯着眼，也不愿笨拙地操作小按钮、按键和导航滚轮。这是一种爱恨交织的关系——既方便又令人沮丧。\n\
  \n移动网络技术真的是一种时间倒退吗？\n\n本章（以及任何其他关于移动设备设计的书籍）中有很多讨论，认为移动网络设计是向过去倒退了一步。诚然，目前移动网络技术整体上充满了限制——小屏幕、小内存、小处理器、低带宽等等。然而，正如信息技术本身在进步一样，移动技术也在进步。\n\
  \n例如，最近硬件的改进，如一些新的安卓手机和平板电脑，以及 iPhone 4 和 iPad，为移动市场带来了更大、更高分辨率的屏幕、更快的处理器和更大的内存。一些移动设备现在可以使用标准的`HTML`和`层叠样式表（CSS）`格式，以及增强的\
  \ Flash 和数字视频播放——性能足以媲美中档台式机和笔记本电脑。\n\n我们还看到了互联网传输网络的显著改进，例如更快的 4G 蜂窝网络的扩展，以及更多\
  \ Wi-Fi 热点的创建。现在在移动设备上访问移动网络可能看起来像是倒退了一步，但技术本身正快速追赶传统计算机的能力。我们今天被迫做出的妥协，一两年后可能就不再必要了。\n\
  \n## 移动中成长\n\n如今，大多数人认为技术进步的速度是理所当然的。但请停下来想一想这两类用户的多样性。当前这一代人，在很大程度上，从未见过黑胶唱片，甚至可能没见过磁带。这一代是\
  \ iPod 一代，从未听说过 Walkman CD 播放器。他们没有体验过没有移动网络的生活。对他们来说，短信不是新奇或便利。正如他们所知，这是生活的一部分。\n\
  \n以简短、快速的方式获取信息和交流是他们生活经历的主要部分。他们以“声音片段”的方式思考。向新派用户或后移动网络互联网用户打个招呼吧。向未来打个招呼吧。\n\n\
  新派移动用户年轻、灵活、行动迅速。他们可以在老派用户拨一个电话号码的时间内，向 20 个熟人发送一条短信。新派用户的手机不是便利工具；它是一个附属物，一个植入物；使用它就像走路、说话和吃饭一样自然。他们使用手持设备的方式与对待生活的方式相同：完成任务，继续前进。\n\
  \n即使现在还不是，新派用户很快将成为我们两个移动互联网群体中最大的一个。考虑到人口统计数据（年轻与成熟），新群体无疑将存在时间最长。\n\n忽视这个不断扩大的互联网用户群体的公司、其他实体，甚至网页设计师自身，都将自食其果。仅凭其庞大的数量，移动网络用户就是一股不可忽视的力量——他们值得拥有为他们量身定制的网络内容。\n\
  \n年轻且行动迅速的性格中固有地缺乏耐心。这些互联网用户不喜欢等待。面对一个充满巨大、笨重页面且下载时间漫长——或者即使加载了也不适合移动设备——的网站，移动网络用户会直接离开。（说到等待内容下载，没有人喜欢这样。新派用户和老派用户在这方面是相同的。）\n\
  \n那么，作为网页设计师，你的工作就是给那些移动网络用户他们想要的东西——以他们想要的方式——快速。我的工作，除了教你如何使用`HTML`、`CSS`和`JavaScript`创建适合移动设备的网页之外，还要教你如何创建移动网络用户真正愿意停留使用的网站。\n\
  \n## 为移动设备设计\n\n尽管移动网络用户的需求通常与通过台式机和笔记本电脑访问网络的用户不同，但实际上只有一个网络。如此多类型、如此多的移动设备都在访问网络，这确实改变了游戏规则。这让我想起了世界上大多数人通过拨号电话连接访问互联网的日子。\n\
  \n在那些日子里，我们经常设计同一网站的两个或多个版本，然后为用户提供链接，将他们带到针对其连接速度优化的网站版本。（见图 1-1。）\n\n虽然为移动设备设计并没有让网页设计倒退那么远，但那些日子里的两个设计问题又回来了：为移动网络设计迫使我们平衡和妥协内容，并聚焦于预期的信息。\n\
  \n**图 1-1：** 允许用户选择最适合他们的网站。\n\n![9781118026229-fg0101.tif](img/9781118026229-fg0101_opt.jpeg)\n\
  \n### 平衡与妥协\n\n最近我读了一篇对一位著名小说家的采访，采访者在讨论作者最新小说的情节时问道：“那么是什么让你决定把这个故事写成一部小说？”\n\n\
  作者回答说：“我没有时间写短篇小说。”\n\n表面上，这个答案似乎毫无意义。一篇几千字的短篇小说怎么可能比一部几十万字的小说花费更多时间？当然，作者是在开玩笑，但重点是短篇小说需要更多关注故事构思和细节。逐字逐句地看，短篇小说的工作量更大。\n\
  \n为移动网络设计也是如此。平衡与妥协——尽可能简洁地提供最重要的信息——在为小屏幕设计时是更优先考虑的事情。通常，决定不包含哪些内容——哪些图片、Flash\
  \ 内容、数字视频等需要省略——需要仔细评估，以及一种无情的意愿，只保留最相关的信息。\n\n### 聚焦于信息\n\n这看起来多余吗？平衡与妥协不就是聚焦于信息吗？嗯，有点类似。我所说的聚焦于信息，是指确定信息——最重要的观点或结论——是什么，然后首先提供这些信息。\n\
  \n报纸文章就是很好的例子。它们的写作基于一个理解：许多读者不会阅读整篇文章，就像移动网络用户很可能不会阅读（或关注）你移动网站上的所有信息——甚至主页上的所有材料。专业记者会构建他们的故事，使得故事的精髓——文章的观点和结论——在前几段中阐明。其余的信息则充实或支持开头段落中得出的结论。\n\
  \n这种技巧——告诉他们你要告诉他们什么。告诉他们，然后告诉他们你已经告诉过他们了，正如我的一位写作老师常说的——不仅是一种非常实用的移动网站设计方法，也是所有网站设计的方法。当然，考虑到典型移动网站的有限空间，以及移动网络用户“只要事实”的心态，自律地密切关注你如何呈现网站信息，可以决定你设计的成败。\n\
  \n\n\n\n\n许多新设计师（不仅仅是网页设计师，还包括各类文档设计师）常常用各种令人印象深刻的图片、Flash 特效以及一堆其他设计元素来堆砌作品，以此炫耀自己刚学会的技能。嘿，这有什么不好呢？将所学付诸实践确实令人兴奋。但如果你真想展示自己作为移动网页设计师的能力，那就把重点放在呈现和信息流上吧。\n\
  \n# 介绍 HTML\n\nHTML 代表超文本标记语言（HyperText Markup Language）。虽然存在多种网页标记语言，但 HTML 或其某种变体与扩展，无疑是互联网上占主导地位的标记语言。\n\
  \n在开始讨论 HTML 是什么以及它能做什么之前，我首先要澄清一个常见的误解：HTML 不是编程语言。事实上，它根本算不上一种“语言”；它无法告诉你的电脑该做什么。（是的，我知道我在本章引言中说过什么。我不会再重复了。但我们就得接受这个术语，好吗？）相反，HTML\
  \ 是一种页面标记语言，也称为页面描述语言：HTML 不是下达指令，而是为浏览器描述页面。浏览器解读这些描述，并在电脑或移动设备的屏幕上显示解读结果。\n\n\
  ## 为浏览器描述页面\n\n即使这个定义——为浏览器描述页面——也过于简化了。确切地说，HTML 告诉浏览器关于页面的一切，从页面使用的 HTML 类型或 HTML\
  \ 的扩展（如 XHTML 和 CSS），到如何格式化并显示页面上的各个元素（如文本和图像）。（是的，我知道我一下子抛出了一堆缩写和术语。我会在后续内容中逐一解释——而且我保证很快。）\n\
  \n## 构建基本 HTML 页面\n\n无论你的 HTML 网页多么简单或复杂，它们都从相同的基本结构开始——四个基本标签（标签将在本章稍后讨论），如清单 1-1\
  \ 所示。\n\n清单 1-1：基本 HTML 页面\n\n```\n<!DOCTYPE html PUBLIC “-//WAPFORUM//DTD XHTML\
  \ Mobile 1.0//EN” “http://wapforum.org/DTD/xhtml-mobile10.dtd”>                       →1\n\
  <html xmlns=”http://www.w3.org/1999/hxtml”>                       →3\n<head>                                                            →5\n\
  <meta http-equiv=”Content-Type” content=“text/html charset=utf-8: />\n<title>The\
  \ World's Best Mobile Site</title>\n<link href=”/styles.css” rel=”stylesheet” type=”text/css”\
  \ media=”handheld” />\n</head>                                                              →9\n\
  <body>                                                               →11\n</body>                                                              →13\n\
  </html>                                                              →15\n```\n\n\
  ![check.png](img/check.png) 第 1 行（`doctype`）：`doctype` 标签（在第 7 章中讨论）描述了页面使用的 HTML\
  \ 类型。\n\n![check.png](img/check.png) 第 3 行和第 15 行（`<html></html>`）：`<html>` 标签对（在第\
  \ 7 章中讨论）有多种功能，但其最重要的作用是标记页面的开始和结束。你将关于该页面的所有信息——以及页面上的所有元素，如文本、图形和其他媒体——都放在这两个标签之间。\n\
  \n![check.png](img/check.png) 第 5 行和第 9 行（`<head></head>`）：`<head>` 标签对（在第 7 章、第\
  \ 12 章以及其他章节中讨论）包含关于页面的信息，包括页面标题、帮助搜索引擎索引网站的元数据，以及更多其他内容。（不过，这可能是史上最简化的定义了。）尽管存在例外，但大多数情况下，`<head>`\
  \ 标签包含的是不显示的页面数据。\n\n![check.png](img/check.png) 第 11 行和第 13 行（`<body></body>`）：`<body>`\
  \ 标签对标记页面内容（即页面上显示的元素）的开始和结束。尽管存在例外（难道不总是有例外吗？），但页面上显示的大部分图形、照片、视频和文本都放在 `<body>`\
  \ 标签对之间，如图 1-2 所示。\n\n## 换个名字，玫瑰依旧\n\n到目前为止，你看到我将出现在网页上的内容——如文本、图形、视频等对象——称为元素、对象和内容。而且我才刚刚开始！那么它们真正的名称是什么呢？对于网页上显示的对象，实际上并没有一个技术上的统称。我想在进入下一节关于\
  \ HTML 标签的讨论之前，应该先澄清这一点。\n\n**图 1-2：** 在 HTML 页面上显示或播放的所有内容都放在 `<body></body>` 标签之间。\n\
  \n![9781118026229-fg0102.eps](img/9781118026229-fg0102_opt.jpeg)\n\n## 为浏览器描述页面对象\n\
  \nHTML 不仅为浏览器描述网页，还描述或格式化页面上的对象或内容。例如，在图 1-3 中，`<b></b>` 和 `<i></i>` 标签告诉浏览器将文本显示为粗体斜体。\n\
  \n**图 1-3：** 为网页浏览器描述的文本格式化示例。\n\n![9781118026229-fg0103.tif](img/9781118026229-fg0103_opt.jpeg)\n\
  \n# 理解 HTML 标签\n\n如前所述，HTML 为网页浏览器（如 Internet Explorer (IE) 和 Firefox）描述网页。HTML\
  \ 由 HTML 元素编写，这些元素包含在尖括号（即大于号和小于号）中的标签，如下所示：`<tag>`。\n\n例如，段落标签 `<p>` 表示新段落的开始，如下所示：\n\
  \n`<p>段落文本。</p>`\n\n在 HTML 页面中，没有标签就什么都不会发生。HTML 标签承担了所有繁重的工作——包括设置页面（本章前面讨论过）、描述用于格式化页面的\
  \ HTML 类型、在哪里找到支持文件（如 CSS 样式表文件，在第 2、4 和 7 章中讨论），以及单个页面对象的格式化（见图 1-4）。\n\n## HTML\
  \ 标签的结构\n\n许多标签支持属性。属性提供额外信息，例如如何格式化对象、在哪里找到文件，或者对象在页面上的显示位置。例如，下面的段落标签包含 `“center”`\
  \ 属性，它告诉浏览器将段落居中：\n\n`<p align=”center”>段落文本。</p>`\n\n尽管偶尔有变体，但属性通常如前面的示例所示，写成由等号\
  \ (=) 分隔的名称-值对。在示例中，`align` 是名称，`“center”` 是值。\n\n## 使用标签格式化文本\n\n与计算机上大多数格式化文本的方法一样，HTML\
  \ 从默认设置开始——一切总得有个起点，对吧？在计算机术语中，默认意味着：除非被告知做其他事情，否则就按此执行。除非另有指示，浏览器会将所有文本显示为正文文本，即使用段落标签\
  \ `<p>` 格式化的文本。\n\n`<p>` 标签的默认属性（如字体、大小、颜色等）由浏览器决定。在大多数 Windows 浏览器中，除非用户更改，否则默认字体（或字样）是\
  \ Times New Roman；在 Mac 上则是 Times。在这两种情况下，字体大小和颜色都是基础（默认）字体。每当你使用标签格式化文本时，实际上就是在修改或覆盖基础字体。例如，在下面的\
  \ `<font>` 标签中，三个属性 `face`、`size` 和 `color` 覆盖了所有基础设置，将文本更改为白色、18 磅的 Arial 字体：\n\
  \n`<font face=”Arial” size=”18” color=”#FFFFFF”>段落文本。</font>`\n\n## 关于 HTML 标准的一点说明\n\
  \n\n\n\n\nHTML 最初是一种非常简单、非常松散的标记语言。例如，当你使用基本的 HTML 格式而不使用 XHTML（本章稍后会讨论）或其他扩展或增强时，标签可以用“松散”的格式编写。而\
  \ XHTML 则强制要求标签使用小写。基本 HTML 支持大小写，甚至混合使用，例如 `<P></p>`。HTML 也不强制要求关闭标签。例如，你可以用一个单独的\
  \ `<p>` 标签开始新段落，而在开始新段落之前不需要关闭该段落（`</p>`）。但有一个问题：如今很少有网页是用基本 HTML 编写的，主要是因为 HTML\
  \ 本身不够强大（功能不足），并且为了避免这些松散的标准。\n\n当然，格式化文本是创建网页中非常重要的一部分，我们在本书中多次讨论这个主题。\n\n## 标签嵌套标签再嵌套标签\n\
  \n标签不仅可以修改和覆盖默认设置，还可以相互修改和影响彼此的行为。标签以自上而下、层次化或构建块的方式格式化对象。根据它们在页面上的位置和放置方式，浏览器会以不同的方式读取和使用它们。（第\
  \ 2 章描述了浏览器如何读取和应用标签来格式化页面。）随着你的网页变得越来越复杂，理解标签之间的这种动态关系变得越来越重要。\n\n下面是一个简单的例子。在这个例子中，`<p>`\
  \ 标签及其属性设置了默认段落文本，然后 `<font>` 及其属性覆盖了默认设置：\n\n`<p align=”center”><font face=”Arial”\
  \ size=”18” color=”#FFFFFF”>Text formatted with HTML.</font></p>`\n\n图 1-4 显示了第二个标签及其属性如何修改第一个标签。\n\
  \n## 媒体格式化标签\n\n媒体——这个词在计算机世界里被广泛使用。根据上下文，它对不同的人有不同的含义。在这里的上下文中——网页内容——媒体指的是特定类型的计算机文件，这些文件加载到\
  \ HTML 页面中并显示（或播放）。最常见的媒体文件类型包括图像（或图形）、Flash 电影和动画，以及数字视频、3D 动画和声音文件。\n\n与直接输入到\
  \ HTML 页面中并成为 HTML 文件本身一部分的文本不同，媒体文件存在于其他地方：你使用标签将页面链接到它们；如果它们是嵌入的，你使用标签来格式化它们。它们作为单独的文件保存在\
  \ Web 服务器上，并在运行时下载，或者当用户的浏览器加载网页并读取标签时下载。当浏览器遇到一组与媒体文件相关的标签时，它会向服务器请求该文件，并在页面上显示（或播放）它，格式按照标签中的指定。\n\
  \n**图 1-4：** 标签修改其他标签的示例。\n\n![9781118026229-fg0104.eps](img/9781118026229-fg0104_opt.jpeg)\n\
  \n媒体类型决定了你使用的标签。例如，要将图像嵌入到页面中，你可以使用 `<img src>` 标签，如下所示：\n\n`<img src=”img02.jpg”\
  \ width=”800” height=”200” />`\n\n当然，名称-值对是 `img src=”img02.jpg”`。`width=` 和 `height=`\
  \ 属性设置图像的宽度和高度。例如，在这种特定配置中，你可以通过更改这些属性的值来调整页面上的图像大小，如下所示：\n\n`<img src=”img02.jpg”\
  \ width=”400” height=”100” />`\n\n图 1-5 显示了调整属性如何改变图像的显示方式。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 使用标签属性调整媒体大小是一种方便的技术，尤其是在为移动设备设计时（我们在第 10 章中讨论）。然而，只要可行，最好以 1:1 的显示尺寸比例嵌入媒体。换句话说，在你创建媒体的应用程序中调整图像、Flash\
  \ 电影、数字视频等的大小，使其适合你心目中的移动设备，然后以该尺寸在网页中显示嵌入的媒体。为什么要费这个劲？因为允许用户的浏览器调整嵌入媒体的大小有时会产生意想不到的结果，通常是不愉快的。此外，当你将大型媒体文件调整为在小屏幕上显示时，请记住文件本身的大小与之前相同：无论你在显示媒体文件时施加什么尺寸，如果浏览器必须调整图像大小，它仍然必须下载整个文件。例如，在\
  \ 320x240 的屏幕上显示 640x480 的图像，会迫使移动设备下载显示该图像所需数据量的两倍。图 1-6 说明了我的意思。\n\n**图 1-5：**\
  \ 调整标签属性如何重新格式化图像显示的示例。\n\n![9781118026229-fg0105.eps](img/9781118026229-fg0105_opt.jpeg)\n\
  \n**图 1-6：** 允许浏览器重新格式化过大的图像可能会迫使你的移动设备下载远多于显示媒体所需的数据。\n\n![9781118026229-fg0106.eps](img/9781118026229-fg0106_opt.jpeg)\n\
  \n## 链接到其他页面和 URL\n\n如果没有对链接的支持，网络就不成其为网络。当然，链接是我们点击以导航到互联网上其他页面的菜单、按钮和文本字符串。与 HTML\
  \ 网页上的其他所有内容一样，链接是通过标签创建的——更具体地说，是通过 `<a href> </a>` 标签对。这两个标签之间的数据成为可点击的链接，如下所示：\n\
  \n`<a href=”http://www.anyURLonTheInternet.com”>The clickable text</a>`\n\n要将图形变成按钮，你只需将嵌入图形文件的标签（如上一节所述）放在\
  \ `<a href></a>` 标签之间，如下所示：\n\n`<a href=”http://www.anyURLonTheInternet.com”><img\
  \ src=”globe.png” width=”40” height=”50” /></a>`\n\n当然，关于链接还有很多内容，本书的多个章节（包括第 7\
  \ 章和第 10 章）都会涉及。\n\n## HTML 的局限性——一切尽在表格中\n\n信不信由你，曾经有一段时间，上一节中描述的基本 HTML 元素几乎就是创建网页的全部内容。事实上，前几页描述的内容就是你创建基本网页所需了解的全部。此外，你使用上一节中的信息创建的任何页面很可能在任何支持网页浏览的移动设备上显示。至于它看起来好不好，那是另一个问题。\n\
  \n很简单，对吧？但这也相当有限。这套简单的格式化标签让你对页面的布局和功能几乎没有控制权。早期的网页由垂直排列在页面上的一个接一个的对象组成——它们通常相当枯燥且不美观。幸运的是，时代在进步，HTML\
  \ 也在进步。\n\nHTML 的早期更新之一是增加了 HTML 表格。你知道表格是什么。你可能在 Word 或 Excel 中使用过它们来显示表格数据或创建电子表格。最初，这种能力——显示表格数据——是将\
  \ `<table>` 标签添加到 HTML 标记语言的唯一原因。但富有创新精神的设计师们发现，可以使用这些不起眼的标签来排列页面上的对象，从而创建更复杂、更吸引人的布局。\n\
  \n### 更多表格，以及表格中的表格中的表格\n\n如果你对 HTML 表格或任何程序的表格功能有所了解，那么将不同对象放入表格单元格以将它们锚定到页面上的特定位置这一概念可能看起来很简单。尽管概念本身很简单，但\
  \ HTML 在表格中嵌套表格的能力，以及设计师对艺术自由的不懈追求，将这种页面布局方式变成了一门艺术。\n\n\n\n\n\n设计师们开始创建完整的图形界面，将它们逐一拆解，再用\
  \ HTML 表格重新组装。Photoshop、Illustrator 以及其他媒体应用程序（如 Flash）开始支持九宫格缩放，这基本上允许你在一个程序中切割图像或艺术作品，然后将它们全部保存到相互关联的\
  \ HTML 表格单元格中。\n\n图 1-7 所示的网页展示了被切割并保存到表格单元格中的各个部分。所有带斜角的方框都代表表格单元格。请注意，有些对象位于嵌套了四层或五层表格的单元格中。\n\
  \n**图 1-7：** 表格套表格，再套表格。\n\n![9781118026229-fg0107.eps](img/9781118026229-fg0107_opt.jpeg)\n\
  \n### 表格太多，却还不够用\n\n虽然用表格设计布局确实可行，但既耗时又繁琐。它还需要过多的代码，并且存在一些严重的局限性，例如无法精确控制单元格内边距和外边距。这种做法已被\
  \ CSS 的 `<div>` 标签容器所取代（第 2 章进行了一般性讨论，第 7 章详细讨论）。CSS 容器之所以比表格更受欢迎，有几个原因。例如，CSS 的\
  \ `<div>` 容器允许你编写一套格式指令，然后可以在一个页面的多个位置或多个页面中使用。这样，你只需编辑一套指令，就能对多个页面进行修改，这也是 CSS\
  \ 的主要吸引力之一。\n\n![remember.eps](img/remember_opt.jpeg) CSS（层叠样式表）在第 2 章中讨论，它不是 HTML。它是\
  \ HTML 的一个附加组件或扩展，允许你对 HTML 页面及其内容执行额外的格式化。CSS 极大地扩展了你的页面和内容格式化选项。与标准 HTML 相比，它还提供了其他几个巨大优势，如第\
  \ 2 章和第 7 章所述。\n\n## 介绍 XHTML 和 HTML5\n\n从技术上讲，HTML 已经过时了。如今，XHTML（即可扩展超文本标记语言）是推荐（请参见下面的说明性边栏）且使用最广泛的网页标记语言。XHTML\
  \ 源自 XML，后者是 HTML 的一种更严格、更强大的扩展。XHTML 不仅扩展了 HTML 的设计可能性，而且它对 CSS（在第 2 章中讨论）的支持也极大地增强了网页设计的可能性。XHTML\
  \ 遵循更严格、“格式良好”的标签结构，也确保了与各种设备（尤其是移动设备）的更高兼容性。\n\n## 基于设备配置文件设计网站\n\n简而言之，我们今天使用\
  \ XHTML 而不是 HTML，是因为它更好。其更严格的标准确保了跨设备类型的更高兼容性，并且对 CSS 的支持极大地扩展了网页和网站设计的可能性。XHTML\
  \ 更强大的一个例子（尤其是在移动网页设计中）是它对设备配置文件的支持。\n\n## 为特定设备设计\n\n本书大部分内容涵盖了如何创建旨在在不同类型的移动设备上最佳运行的网页。这个过程的一部分涉及设计同一网站的不同版本。有几种方法可以做到这一点；这些技术从相当简单（适用于许多移动设备的通用方法）到复杂的设备配置文件系统（该系统会查询数据库并决定使用哪个设备“配置文件”来显示网站的特定版本）不等。\n\
  \n评估设备、确定其能力以及基于设备配置文件设计网站的详细内容将在第 5 章和第 6 章中介绍。\n\n## 标记语言如何被“推荐”？\n\n当你听到老师、作家或某种技术专家做出诸如“如今，XHTML……是推荐且使用最广泛的网页标记语言”这样笼统的陈述时，你是否会停下来思考是谁做出了这些推荐？我会。一种标记语言是如何被推荐为优于另一种的？是否存在某种无所不知的网页标记语言至高力量，从高处下达法令？\n\
  \n嗯，并非如此。在监督和开发网页标记语言方面，最终的权威（如果你愿意这么说的话）是万维网联盟（W3C）。W3C 是一个由几百名（主要是）志愿者组成的委员会，他们负责分析和制定网络标准。早在\
  \ 2000 年 1 月，他们就推荐我们开始使用 XHTML 1.0。然后，在 2001 年 6 月，他们推荐了 XHTML 1.1。\n\n对某些人，尤其是新网页设计师来说，这种不同版本和类型的标记语言（XML、HTML、XHTML、CSS、XHTML-MP（移动配置文件）等）的大杂烩，让网页开发看起来又像混乱的狂野西部。坦率地说，如果没有\
  \ W3C 的指导，为当今各种不同设备进行的网页开发将更加难以捉摸。W3C 的监督确实控制住了这个“野兽”。\n\n此外，W3C 正在持续开发最新标准 HTML5（本章稍后讨论），该标准将\
  \ HTML、XHTML 和 CSS 融合成一种强大而全面的网页创作标记语言，有望进一步标准化网页设计（尤其是移动网页设计），并为网络带来显著的设计能力。如果你想了解更多关于\
  \ W3C 的信息，了解标准是如何制定的，参与讨论，或者成为联盟的成员，你可以访问 W3C 的网站（[`www.w3c.org`](http://www.w3c.org)）。\n\
  \n## XHTML MP\n\nXHTML MP 代表 XHTML 移动配置文件，是一种专门为手机设计的标记语言。它是由开放移动联盟（OMA）定义的一种 HTML\
  \ 文档类型（doctype）。与 W3C 有些类似，OMA 成立于 2002 年 6 月，由一群对移动市场感兴趣的公司测试成立——从提供商（如 AT&T、Verizon\
  \ 和 Sprint）到手机制造商（如诺基亚、三星、爱立信等），再到移动软件供应商（如微软、苹果和谷歌）。\n\nOMA 的目标是为所有移动设备标准化 XHTML。可以想象，OMA\
  \ 在手机和其他移动设备网站的开发中扮演着重要角色。XHTML MP 将在第 2 章和第 6 章中讨论。\n\n## 介绍 HTML5\n\n如果你开始怀疑为移动设备创建网站是一个不断变化的目标，那么，你是对的。在很多方面确实如此。有如此多不同设备，其能力千差万别，还有如此多的页面标记标准和版本，我们能让它们在不止一两个设备上正常工作，这似乎已经很了不起了。为什么会有这么多变化？为什么我们不能只确定一个良好的\
  \ HTML 标记标准，开发它，然后一直用下去呢？\n\n所有参与网页设计的人都非常清楚所有这些不同标准带来的不一致性和挑战；诚然，这是一种过于碎片化的现代网页设计方法。移动网络的出现——尤其是移动设备的多样性——使这些缺陷更加突出。\n\
  \n不久前，W3C 意识到，转向所有这些分裂的变体是行不通的，于是宣布了一项计划，开发一种适用于所有人的通用标记语言——HTML5。这是一项巨大的工程，HTML5\
  \ 将标准化设计师编写标签的方式以及浏览器解释标签的方式。HTML5 将在第 11 章详细讨论。\n\nHTML5 的开发已经进行了一段时间——大约从 2004\
  \ 年开始。尽管可能还需要几年时间才能完成并采用这一新标准，但 HTML5 的许多部分已经完成、被宣布为稳定并被采用——它们已经在使用中。一些智能手机，如 iPhone、Droid、大多数新款平板电脑以及其他一些设备，已经支持某些\
  \ HTML5 规范。\n\n\n\n\n\n在我撰写本文时，人们推测 HTML5 将在 2012 年的某个时间点达到候选推荐（Candidate Recommendation，简称\
  \ CR）状态。CR 状态类似于软件应用程序的 beta 测试版本：HTML5 将发布给开发社区，由他们来评估该候选版本是否已准备好投入实施。在 CR 期间（可能持续数年），标准中的越来越多内容将变得普及。\n\
  \n在本书探讨如何使用 HTML 和 CSS 的过程中，我会指出何时以及何地可以使用 HTML5，并向您简要介绍这个新标准为何以及如何优于目前正在使用的 XHTML\
  \ 标准。同样，您可以在第 11 章中找到关于 HTML5 的详细讨论。\n\n# 第 2 章：使用层叠样式表 (CSS) 为 HTML 带来更多功能\n\n\
  ## 本章内容\n- ![arrow](img/arrow.png) 理解 CSS\n- ![arrow](img/arrow.png) 结合 XHTML 和\
  \ CSS\n- ![arrow](img/arrow.png) 创建 CSS 布局\n- ![arrow](img/arrow.png) 了解 CSS 版本\n\
  \n层叠样式表，层叠样式表 —— 对于一种页面标记语言（或者更准确地说，是一种样式表语言）来说，这个术语听起来真是花哨。它听起来更像某种艺术形式，或者某种古典音乐术语，比如渐强（crescendo）、共鸣（resonance）、音调（intonation），或者是音乐鉴赏课上那些令人印象深刻、悦耳的术语之一。它唤起了一种意象：一张张样式表像瀑布一样轻轻地倾泻而下……（哎呀，抱歉，我有点词穷地陷入幻想了。）\n\
  \n实际上，层叠样式表是一组规则列表，每条规则触发下一条 —— 即用于格式化网页的层叠规则。“层叠”本质上是一种优先级方案，决定了规则如何应用以及应用的顺序。例如，如果一个页面元素被分配了多个规则，浏览器会计算一个优先级（或权重）层叠，以确定应用哪个规则：优先级越高意味着权重越大；可以将高优先级想象成对你施加了更大的压力。\n\
  \n因此，所有这些层叠操作的目的在于可靠性 —— 或者更准确地说，是可预测性。对于您（网页设计师）来说，这意味着 CSS 是一种比纯旧版 HTML 更可靠（且更灵活）的创建网页的方式。\n\
  \n虽然 CSS 优于标准 HTML 的原因很多，但其中一个最令人信服的原因是，与 HTML 表格（在第 1 章中讨论）不同，CSS 允许您将内容与格式化它的标签及其他代码分离，同时也将其与内容所在的页面分离。本章将向您展示这种安排是如何运作的\
  \ —— 以及为什么它优于标准 HTML。我们还将研究如何创建 CSS 容器，它们类似于 HTML 表格单元格，但灵活得多。此外，我们还会讨论 CSS 的不同版本（包括一些演进中的移动端标准）以及不同类型的样式表。\n\
  \n## 理解 CSS\n\n简单来说，CSS 是一种样式表语言，用于描述用标记语言（通常是 HTML 或 XHTML）编写的文档的外观和格式。它同样适用于用\
  \ XML（可扩展标记语言）编写的页面，您还可以使用 CSS 来格式化 Flash 电影中的文本以及许多其他应用程序。层叠样式表有助于页面布局，适用于所有类型的页面，但最常见的是网页。样式表包含样式，而样式是指令列表，例如用于格式化页面元素的尺寸、颜色、位置、字体等等。\n\
  \n这种创建并保存格式化指令以应用于多个对象（通常跨多个页面或文档）的概念，既不是新鲜事，也不是网页设计所独有的。如果您使用文字处理软件（如 Microsoft\
  \ Word 或 Apple Pages），您可能已经熟悉文字处理软件中的“样式”版本。页面布局软件（如 Adobe InDesign 或 Microsoft\
  \ Publisher）同样使用样式。您可能熟悉的其他程序（如 Photoshop 或 Flash）则使用一种名为“预设”（presets）的现成样式形式。\n\
  \n### 无论称作什么，它都是样式\n\n样式是一组文本格式化指令，例如字体、颜色、大小等。层叠样式表还可以格式化页面和容器（即页面区域或盒子，如本章稍后讨论的侧边栏）；此类指令包括背景颜色和页边距。通常，与文字处理软件中的工作方式非常相似，样式在全局范围内发挥作用；然后您可以在局部覆盖部分或全部格式化指令。\n\
  \n没听懂？我的意思是：假设您创建了一个样式，将所有正文 (`<body></body>`) 或段落 (`<p></p>`) 文本设置为 Arial，12 磅，常规体。不可避免地，某些词语或短语需要进一步格式化，例如加粗或斜体。就像在文字处理软件中一样，您可以将这些更具体的更改（覆盖原样式）直接应用于您想要加粗或倾斜的文本。不过，巨大的区别在于（除非您使用\
  \ Dreamweaver 或其他支持 CSS 的网页设计软件，如我在第 4 章中所讨论的），您是通过 XHTML 和 CSS 标签来应用格式的，而不是简单地选中文本字符串并点击一个按钮。\n\
  \nCSS 样式在功能上远超文字处理软件的样式。您还可以使用它们来格式化其他内容，例如图像、Flash 内容和数字视频。当然，当我提到“格式化”时，并不是指 CSS\
  \ 能让图像加粗或倾斜，而是指您可以使用 CSS 样式来调整媒体内容项目的大小，在其周围添加边框和内边距等等。而且，正如我在第 11 章（以及本书其他几处）中讨论的，您可以使用尚未正式发布（但已被广泛使用和支持）的最新版本\
  \ CSS —— `CSS3`，来添加特殊效果，例如投影、圆角盒子，甚至是简单的动画，如淡入和淡出过渡。\n\n事实上，`CSS3` 准备彻底改变网页设计，这使得现在成为一名网页设计师是一个令人兴奋的时刻。\n\
  \n![remember.eps](img/remember_opt.jpeg) 在阅读完这段 CSS 介绍后，您可能会认为既然 HTML 和 CSS 都能格式化网页上的元素，那么它们就是同一回事。其实不然。类似于软件应用程序的插件，CSS\
  \ 是 HTML 的一个附加组件。CSS 增强了 HTML 的能力，它与 HTML 协同工作。尽管它们共同协作，但这两种标记语言拥有独立的规则集、标签、属性和特性。实际上，HTML\
  \ 从 CSS 获取格式化指令并将其应用于页面元素。HTML 和 CSS 结合在一起，提供了比 HTML 单独使用时广泛得多的格式化能力。\n\n### 全局格式化\n\
  \n关于这种全局格式化，还有更多内容。您可以设置层叠样式表，使其格式化 1 个页面、10 个页面或 10,000 个页面。假设您是那个拥有 10,000 个页面的网站的幸运设计师兼网站管理员。终于，经过数月的努力，您的客户找到您说：“干得好，你做得非常出色。我们准备明天上线，但我们需要把所有的标题从红色改为蓝色。”\n\
  \n（是的，我知道。如果您有任何网页设计经验，您就知道任何神志清醒的人都不会通过一个静态页面接一个静态页面地去创建 10,000 个页面的网站，但这并不是这个故事的重点。请听我把话说完。）\n\
  \n如果您正确设置了样式表，您只需更改一个标签，就可以更改所有 10,000 个页面的标题。\n\n您不仅可以为网站的每个页面使用同一个样式表，还可以为多个网站使用同一个样式表。如果某种需求出现，您甚至可以用一个样式表来格式化\
  \ 10,000 个或更多网站！另一方面，您也可以使用多个样式表来格式化同一个网页。这种多功能性（如本书全程演示并由随附的侧边栏解释）使得 CSS 成为创建移动网站的极其有用的工具。\n\
  \n一个页面，多个样式表；一个样式表，多个页面\n\n\n\n\n\n许多网页由多个部分组成，例如页眉、侧边栏、多列布局、页脚。你不仅可以使用样式表创建所有这些“容器”甚至更多，还可以使用多个样式表来实现。例如，你可以为两栏或三栏页面分别设置独立的样式表，为页脚设置另一个样式表，为信息框或旋转横幅再设置一个，而为侧边栏再单独设置一个。\n\
  \n为什么这很重要？原因有很多。例如，在大型多页面网站上，逐页使用相同的布局会变得单调乏味——不仅对你而言，对网站访问者也是如此。通过为网站页面的不同部分或功能创建独立的样式表，你可以通过混合搭配样式表轻松地改变布局。通过这种方法，你实际上可以创建一个页面功能库。（创建和使用样式表的内容分散在本书的多个章节中，具体取决于所讨论的页面元素类型。例如，用于创建和格式化表单字段的样式表在第\
  \ 9 章中介绍。用于格式化和处理数字视频及 Flash 影片的样式表在第 10 章中讨论，以此类推。）\n\n你的网页也可以由多个页面组成。（我听到你在想：一个页面怎么能是多个页面？）正如网页可以调用并嵌入外部媒体内容（例如图像和视频，如第\
  \ 1 章所述，第 10 章有更详细的讨论），它们也可以调用并嵌入其他 HTML 页面——这种操作称为包含（include）。\n\n为什么要在网页中包含其他页面？原因与使用样式表相同：使更新内容和格式的过程更简单。例如，假设你的页面底部有一个包含联系信息（电子邮件、电话号码、传真等）的页脚，贯穿每个页面。如果你将这些数据保存在一个包含文件中，那么当需要更改时，只需编辑该包含文件，即可更新网站中所有页面的内容。\n\
  \n例如，我的一个网站在每个页面底部都有一个包含版权信息的页脚。该网站由大约 20 个页面组成。每年一月我都需要更新版权年份。为了避免每年编辑每个页面，我使用了包含文件。图\
  \ 2-1 展示了其工作原理。\n\n在页面中使用包含文件通常需要一些基本的编程知识，例如 JavaScript 或某种服务器端脚本（在托管页面的服务器上运行，而非用户浏览器中的脚本）。这并不像听起来那么复杂。我将在第\
  \ 8 章中向你展示如何操作。\n\n**图 2-1：** 每年编辑此包含文件即可自动更新版权信息。\n\n![9781118026229-fg0201.eps](img/9781118026229-fg0201_opt.jpeg)\n\
  \n## 样式类型，或称样式规则\n\nCSS 支持三种类型的样式，通常称为规则：内联样式、内部样式和外部样式。你可以在网站的每个页面中仅使用一种样式类型，或组合使用两种或多种，并且每个页面可以使用不同的组合。此外，如前一侧边栏所述，你可以使用（或附加）多个不同的外部样式表来格式化同一文档。\n\
  \n### 内联样式\n\n你可以使用内联样式来格式化单个元素，例如，一个你想与页面上其他标题不同的标题。总体而言——除了更广泛的格式化选项外——内联样式并不比使用基本的\
  \ XHTML 或 HTML 标签提供显著优势。它们直接附加到对象本身，并且仅适用于所附加的对象，因此内联样式无法像其他 CSS 样式类型那样格式化多个对象并快速更改其格式。\n\
  \n此外，由于内联样式直接附加到单个对象，因此无需引用它（稍后在另外两种样式类型中讨论），并且由于不需要引用，它也不需要唯一的名称。如图 2-2 所示，内联样式使用`<span></span>`标签。\n\
  \n通常所有属性（如字体、颜色、大小等）都包含在开始标签中。\n\n**图 2-2：** 内联样式格式化标题的示例。\n\n![9781118026229-fg0202.eps](img/9781118026229-fg0202_opt.jpeg)\n\
  \n![tip.eps](img/tip_opt.jpeg) 此时，大多数作者会警告你不要使用内联样式，除非你绝对确定不需要将该样式的格式附加到页面上的其他元素或网站中其他页面的对象上。我的经验是，你无法预知未来——情况会发生变化。所以我的建议是，你根本不要使用内联样式。这种样式也是最容易创建和使用的，有时你会忍不住想快速完成这点格式化，就这一次。但不要这样做。以后你会感谢自己的。\n\
  \n### 内部样式\n\n与内联样式不同，内部样式与内容分开设置。换句话说，内部样式允许你使用同一样式格式化多个对象，从而只需编辑一个样式即可进行全局格式更改。然而，由于内部样式是内部的——即包含在格式化对象的文档中——它们相当有限。你可以在仅包含一个页面的网站（现在不多见）或格式与其他页面不同的页面上使用它们。内部样式位于`<head></head>`标签之间，如清单\
  \ 2-1 所示。`<head></head>`标签在第 1 章、第 7 章以及其他相关章节中讨论。\n\n**清单 2-1：内部样式表**\n\n```\n\
  <style type=”text/css”>\n<!--\nbody {\n     font: 100%/1.4 Verdana, Arial, Helvetica,\
  \ sans-serif;\n     background: #42413C;\n     margin: 0;\n     padding: 0;\n  \
  \   color: #000;\n}\nul, ol, dl {\n     padding: 0;\n     margin: 0;\n}\nh1, h2,\
  \ h3, h4, h5, h6, p {\n     margin-top: 0;\n     padding-right: 15px;\n     padding-left:\
  \ 15px;\n     font-size: small;\n}\na img {\n     border: none;\n}\na:link {\n \
  \    color: #42413C;\n     text-decoration: underline;\n}\n.container {\n     width:\
  \ 960px;\n     background: #FFF;\n     margin: 0 auto;\n     overflow: hidden;\n\
  }\n.sidebar1 {\n     float: left;\n     width: 180px;\n     background: #EADCAE;\n\
  \     padding-bottom: 10px;\n}\n-->\n</style>\n```\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 尽管内部样式不如外部样式强大，但在某些情况下它们更可取。例如，假设你决定使用包含文件（如前一侧边栏和第 8 章所述）来处理页面中的页眉和页脚。内部样式非常适合格式化实际的包含\
  \ HTML 页面本身，使每个页面成为一个自包含、易于跟踪和编辑的模块。\n\n### 外部样式\n\n在这三种样式类型中，外部样式是迄今为止最通用的。顾名思义，它们是外部的，即独立的文件。样式表文件具有`.css`扩展名。\n\
  \n这种安排的主要好处之一是能够使用同一样式表格式化多个页面。表面上，这听起来可能有点平淡无奇——嗯——直到你停下来思考一下。此外，在为移动设备设计时，这些好处变得更加明显。让我们来思考一下——我是说，思考。以下是一些更重要的好处列表：\n\
  \n\n\n\n\n![check.png](img/check.png) 全局格式化和重新格式化：用计算机术语来说，全局格式化就是用同一种样式格式化多个对象（通常跨越多页）。这一优势本身就非常巨大，原因有些显而易见，有些则不那么明显。在创建网站页面时，如果事先设置好一组外部样式表，就无需在操作过程中逐个格式化每个对象。你只需引用样式即可，无需重新创建它，这在拥有多个页面的网站上能节省大量时间、工作和繁琐操作。（在网页设计，尤其是自由职业网页设计中，时间真的就是金钱！）但真正节省时间和金钱的地方在于需要修改格式时。只需更改一个样式，就能更改该样式所关联的每个页面上的所有元素。\n\
  \n![check.png](img/check.png) 保持一致性：在构建网站、添加页面、文本和其他元素的过程中，网站很快就会变得过于庞大，无法依靠你那效率低下的生物记忆来完整保留。在\
  \ CSS 出现之前，我记不清有多少次——在做了简单的格式更改后，不得不逐页、逐实例地返回大型网站，重复进行相同的修改。这不仅耗时，而且效率极低，还很难做到万无一失。即使你极其小心谨慎，也极易无意中遗漏重要细节。当你的样式表就位并正常工作时，这类混乱情况就变得不太可能发生了。\n\
  \n使用 CSS 还有助于确保你的移动网站看起来更像你的常规网站（或非移动网站，前提是它也使用 CSS 进行格式化）。为什么这很重要？嘿，我只是个书呆子式的设计人员，但你可以问问任何营销专家，她会告诉你，对于组织的营销材料来说，保持相同的外观和感觉——以便于品牌识别和建立一致的形象——非常重要。\n\
  \n![check.png](img/check.png) 减少代码量：在移动网页设计中，任何能让文件体积变小的做法都是巨大的福音。在同一页面上反复应用同一组标签和属性，很快就会导致普通移动设备（性能较弱）的性能下降。在整个网页内容传输路径中——从有限的带宽、微小的内存库到小巧的处理器——越小越好。\n\
  \n![check.png](img/check.png) 提高工作组或团队效率：许多网站是在团队环境中创建的，团队成员各自负责不同的部分。向团队成员分发外部样式表可以确保一致性，并大大减轻工作量。同样，作为自由职业者，我经常需要将工作分包给其他自由职业者以赶上截止日期。向分包商提供样式表有助于确保他们处理的页面看起来与网站的其他部分一致。\n\
  \n![check.png](img/check.png) 标准合规性：为了使任何行业或技术能够为所有人（或尽可能多的人）最佳地运作，参与者或制造商必须遵守既定标准。例如，如果你制造并销售一种连接器与同行业其他所有部件都不同的部件，那么很可能没有人能使用你的产品。网页设计师制造网页、网站和\
  \ Web 应用程序。遵守第 1 章中讨论的 W3C 标准，可以确保最大数量的浏览器和设备能够使用你的产品。\n\n![check.png](img/check.png)\
  \ 针对不同用户和设备的不同样式表：在第 6 章中，我将向你展示如何检测特定设备并根据设备类型切换到合适的布局。CSS 允许你根据设备类型创建不同的样式表。换句话说，你可以使用相同的内容，并通过样式表将其格式化为针对不同设备的最佳显示效果。\n\
  \n![tip.eps](img/tip_opt.jpeg) 例如，你可以为台式机和笔记本电脑创建一个样式表；为 iPhone、Droid 和其他高端移动设备创建另一个样式表；再为\
  \ iPad 和其他平板移动设备创建另一个样式表。\n\n这些只是外部样式表最显著优势中的一部分。我相信你在使用本书的过程中还会发现许多其他优势。图 2-3 展示了一个外部样式表及其生成的页面。\n\
  \n代码清单 2-2：外部样式表\n\n```\n@charset “utf-8”;\n\nbody {\n     font: 100%/1.4 Verdana,\
  \ Arial, Helvetica, sans-serif;\n     background: #000000;\n     margin: 0;\n  \
  \   padding: 0;\n     color: #333333;\n}\n\nul, ol, dl {\n     padding: 0;\n   \
  \  margin: 0;\n}\n\nh1, h2, h3, h4, h5, h6, p {\n     margin-top: 0;\n     padding-right:\
  \ 5px;\n     padding-left: 15px;\n     color: #CCC;\n     text-align: left;\n}\n\
  \na img {\n     border: none;\n}\n\na:link {\n     color:#6aa3a0;\n     text-decoration:\
  \ underline;\n}\n\n.container {\n     width: 100%;\n     max-width: 800px;\n   \
  \  min-width: 320px;\n     background: #000000;\n}\n\n.header {\n     background:\
  \ #000000;\n}\n\n.sidebar1 {\n     float: left;\n     width: 25%;\n     background:\
  \ #000000;\n     padding-bottom: 10px;\n}\n\n.content {\n     padding: 10px 0;\n\
  \     width: 75%;\n     background: #333333;\n     float: left;\n```\n\n将 XHTML\
  \ 与 CSS 结合使用\n\nCSS 作为一种样式表语言，并不是一种独立的语言；如果你试图单独使用它——而不与 HTML 或 XHTML 等标记语言结合——你将寸步难行。CSS\
  \ 被设计为与标记语言配合使用，或嵌入其中。XHTML（在第 1 章中讨论过）是 HTML 的最新“推荐”版本，也是 W3C（同样在第 1 章中讨论过）建议我们所有人使用的标准。\n\
  \nXHTML 有自己的一套基础或默认标签，其中许多由 Web 浏览器决定，除非你添加某种修改或覆盖标签。例如，XHTML 有自己的标题标签——`<h1>`、`<h2>`等——以及正文文本或段落标签`<p>`，还有用于格式化图像和其他媒体类型的默认标签。\n\
  \n网页设计中最常见、最简单的方法之一就是使用 CSS 类和规则来覆盖 XHTML 的内置标签，或创建它们的变体。例如，你可以使用 CSS 将标题从衬线字体改为无衬线字体（参见旁边的侧边栏），或者更改标题的大小、位置和颜色等。\n\
  \n**图 2-3：** 使用外部样式表格式化的页面示例。\n\n![9781118026229-fg0203.eps](img/9781118026229-fg0203_opt.jpeg)\n\
  \n衬线字体与无衬线字体——小脚丫的图案\n\n在人类用书面文字进行交流的漫长历史中，在电子设备上显示文本是全新的事物。排版——以可读格式（通常是在纸上）机械地排列文本——并不新鲜。然而，今天的技术会让本杰明·富兰克林（世界上最著名的排版师）这样的排版师——即那些为在纸张和其他媒体上印刷而排列字体的人——羡慕不已。以下是一些你需要了解的排版术语的快速介绍，即使在今天也是如此……\n\
  \n排除显示字体或装饰性字体（如 Stamp 或 Broadway），用于创建英文文本的字体都是拉丁字符集的变体。因此，它们分为两种：衬线字体和无衬线字体——分别表示有衬线或无衬线（参见下图）。衬线，也称为“脚”，是完成字符（字母和数字）末端的小笔画。一套完整字符的一致设计称为字体或字型。衬线字体包括\
  \ Times、Times New Roman 和 Garamond（以及其他几千种），它们都有这些小脚丫；无衬线字体（sans 意为“没有”）则没有。\n\n\
  \n\n\n在排版领域，关于哪些字体最适合特定类型的文本，存在各种理论。例如，人们认为衬线字体有助于引导读者的视线在密集、大块的细小文本（如正文，你现在正在阅读的正是正文）中从一个词移动到另一个词。无衬线字体被认为最适合较大的字体，如横幅、标题和副标题。\n\
  \n然而，如今，尤其是在计算机和移动设备显示屏方面，衬线字体与无衬线字体的争论在很大程度上已变成个人品味问题。有一种观点认为，无衬线字体最适合电子显示屏上的正文，仅仅是因为它们在低分辨率下显示效果更好。我更喜欢在网页上使用它们，尤其是移动网页，因为我认为它们看起来更好——仅此而已。\n\
  \n无论如何，有时，尤其是在为小屏幕设计时，你应该注意所使用的字体。你对某个字体是否更具吸引力的看法，很少应该比文本的整体可读性更重要。但奇怪的是，大多数浏览器将衬线字体设置为默认字体，无论是标题还是正文。（你可以在第\
  \ 7 章找到关于如何覆盖默认字体的讨论。）\n\n![9781118026229-sb0201-2.eps](img/9781118026229-sb0201-2_opt.jpeg)\n\
  \n# 使用 CSS 布局 XHTML 页面\n\n除非你使用内联样式（本章前面已讨论），否则你需要一种方法告诉浏览器将哪些样式关联或附加到你要格式化的页面元素上。除了用于格式化文本字符串和媒体内容的样式外，你还可以使用\
  \ XHTML 标签创建容器或框来容纳内容，然后使用 CSS 对其进行格式化。\n\n从概念上讲，这与第 1 章讨论的 HTML 表格类似，XHTML 容器将页面划分成多个部分。当与\
  \ CSS 结合时，XHTML 框比 HTML 表格更加灵活和可调整。它们允许你进行更广泛的控制，不仅是对容器本身（位置、大小、对齐、边框、外边距和内边距），而且对于格式化内容（容器中的内容）也有更多样化的选项。\n\
  \n### 创建容器\n\n要创建 XHTML 容器，你使用`<div></div>`标签对，并将 CSS 容器名称或选择器（接下来讨论）作为属性，如下所示：\n\
  \n```\n<div class=”header”>\n你的内容\n</div>\n```\n\n创建容器并对其进行格式化的内容将在第 7 章中讨论并付诸实践，并在其他几个章节中根据需要反复使用，以创建特定类型的内容。同时，图\
  \ 2-4 应该能让你了解这一切是如何工作的。\n\n## 格式化容器\n\n要告诉浏览器使用哪些 CSS 样式来格式化容器，你使用样式选择器。选择器后面跟着格式化指令。请看以下示例：\n\
  \n```\ncontainer {\n    width: 100%;\n    max-width: 800px;\n    min-width: 320px;\n\
  \    background: #000000;\n}\n```\n\n如你所见，CSS 的一个好处是，你通常不需要翻译器就能理解样式的内容。它用简单的日常英语编写。上面给出的示例说：“为每个`container`类型的容器创建一个名为`container`的容器；将其大小设置为浏览器窗口的\
  \ 100%，但宽度不超过 800 像素且不小于 320 像素；并将背景设置为十六进制值#000000，即黑色。”（如果你不熟悉十六进制颜色，请参见第 7 章。）\n\
  \n**图 2-4：** 使用容器标签和样式选择器创建页面部分。\n\n![9781118026229-fg0204.eps](img/9781118026229-fg0204_opt.jpeg)\n\
  \n![tip.eps](img/tip_opt.jpeg) 网页设计令人兴奋的一个方面是它是一门不断发展的学科。你可以每天做这件事很多年，但永远无法学完所有内容，甚至接近学完。对我来说，分析其他设计师的作品总是很有帮助。HTML、XHTML，有时甚至是\
  \ CSS 样式（当页面使用内部样式设计时）的好处是，它们就挂在互联网上，等待我的审视。当你遇到一个具有你感兴趣功能的页面，并想知道这些效果是如何实现时，你通常可以直接从浏览器中做到。所有流行的网页浏览器都有一个功能，允许你查看网页背后的源代码。例如，在\
  \ Firefox 中，你只需右键单击页面并选择“查看页面源代码”。在 Internet Explorer（IE）中，它是“查看源代码”。\n\n# CSS 标准和版本\n\
  \n就像信息和计算机技术的几乎每个方面一样，CSS——以及网页设计本身——处于不断变化的状态，不断演变。目前有三个版本的 CSS——是的，你猜对了：CSS1、CSS2\
  \ 和 CSS3。哦，还有当前“推荐”版本的 CSS2，即 CSS 2 修订版 1，或 CSS 2.1，它修复了一些错误并移除了原始 CSS2 中一些支持不佳的特性。（如果你想知道标记或样式表语言如何以及为何成为推荐标准，第\
  \ 1 章中有解释。）\n\n开发和部署标记和样式表语言的过程充其量是模糊的，并且可能非常令人困惑。通常，新版本的语言会被零碎地投入使用；设计社区和网页浏览器制造商在\
  \ W3C 宣布开始工作后几乎立即开始实施新版本的部分内容。以 HTML5 为例。它距离成为推荐候选还有一段路，但它的部分内容已被广泛使用。大多数流行的网页浏览器，如\
  \ Internet Explorer、Firefox、Apple 的 Safari 和 Google 的 Chrome——以及许多移动设备浏览器——都支持 HTML5\
  \ 的大部分内容。CSS 也是如此。尽管 2.1 版是推荐标准，但 CSS3 已被广泛支持。\n\n决定何时使用哪个版本可能像是在瞄准一个移动的目标——而且通常确实如此，尤其是当你为高度多样化的移动设备市场进行设计时。这就是为什么（如第\
  \ 4 章和第 5 章详细讨论的那样）了解你正在为哪些设备设计以及它们的能力非常重要。\n\n## CSS1\n\nCSS 已经存在相当长的时间了。事实上，CSS1\
  \ 早在 1996 年 12 月就达到了推荐级别，这意味着它的开发在此之前就开始了。与今天设计师使用 CSS 所做的相比，CSS1 相当简单且有些局限。但它开启了网页设计使用\
  \ CSS 执行一些重要的定位和格式化任务的道路，特别是用于：\n\n- ![check.png](img/check.png) 背景、外边距、边框和容器的内边距\n\
  - ![check.png](img/check.png) 元素属性，如文本颜色、字体、字间距、字母间距和行间距\n- ![check.png](img/check.png)\
  \ 简单 HTML 及其对表格的繁琐依赖所不支持（或严重缺乏）的许多其他功能\n\n尽管花了一些时间才流行起来，但 CSS1 为 HTML 表格带来了很多选择。但直到\
  \ CSS2，我们才真正开始看到向 CSS 的重大转变。事实上，直到 2000 年 3 月为 Mac 发布的 IE 5.0，才有浏览器支持超过 99%的 CSS1\
  \ 规范，而这距离 W3C 发布 CSS2 推荐标准已经过去了将近两年。\n\n如果你有兴趣查看 CSS1 推荐标准（其中包含整个规范本身——有点像 CSS1\
  \ 手册），你可以在 W3.org 网站上看到它，网址为[`www.w3.org/TR/REC-CSS1/`](http://www.w3.org/TR/REC-CSS1/.)。\n\
  \n## CSS2 (CSS 2.1)\n\n\n\n\n\n## CSS2\n\nCSS2 CSS2 是 CSS1 的超集（也就是说，它包含了 CSS1）；W3C\
  \ 在 1998 年 5 月将 CSS2 发布为推荐标准。其中最重要的增强功能之一是引入了媒体特定样式表，这允许设计人员为各种设备创建量身定制的页面和站点，例如特殊访问视觉浏览器、面向听障人士的听觉设备、盲文设备以及移动手持设备。\n\
  \nCSS2 还提供了比 CSS1 更强大的元素定位控制能力。2.1 版本是当前的推荐标准，并在许多智能手机和其他移动设备中得到了广泛支持。关于如何确定哪些设备支持哪些\
  \ CSS 版本以及支持程度，请参阅第 5 章。\n\n您可以在 [`www.w3.org/TR/CSS2/`](http://www.w3.org/TR/CSS2/.)\
  \ 查看完整的 CSS 2.1 规范及其详细文档。\n\n## CSS3\n\nCSS3 在第 11 章中将进行详细讨论，它是一次如此重大的增强，以至于很难决定先从什么谈起。它实现了许多我们目前需要使用其他程序才能完成的效果——例如文本的投影、简单的动画、旋转文本和其他对象，以及更多功能。这个\
  \ CSS 级别真正标志着 Web 设计技术的成熟，类似于 21 世纪之交桌面出版业所取得的进步。\n\n我并不是说设计人员不再需要 Photoshop 或 Flash，但他们不会发现自己必须像以前那样频繁地为每个简单的微小效果创建单独的文件。\n\
  \n关于移动设备，预计 CSS3 将出现在许多较新的智能手机中，如 iPhone、Droid 等（尽管在写这本书时，Windows Phone 7 还不支持）。然而，移动世界并不完全由高端智能手机用户组成。你不能忽视数百万非智能手机的用户。它并不（咳咳）智能。\n\
  \nCSS3 最令人兴奋的特性之一（尤其是对于移动 Web 设计师而言）是名为“媒体查询”（Media Queries）的功能。通常（如第 4 章和第 5 章所述），当您使用\
  \ CSS1 和 CSS2 为移动设备设计时，您是基于设备配置文件（device profiles）来设计样式表的。其结果是基于配置文件中内置信息的静态网页版本。而媒体查询不再依赖于已知的设备配置文件，而是直接询问设备本身的性能。例如：你的屏幕尺寸、方向和分辨率是多少？你是处于纵向（直立）还是横向（旋转）模式？设备会返回这些答案以及一大堆其他有用信息。随后，样式表会据此对页面进行格式化。第\
  \ 11 章将探讨 CSS3 一些更令人兴奋的特性。您可以在 [`www.w3.org/TR/css3-roadmap`](http://www.w3.org/TR/css3-roadmap)\
  \ 查看 CSS3 规范。\n\n如果您真的想感受 CSS3 背后的强大力量，可以搜索“CSS3 features”，看看设计社区对此的评价。设计人员对此感到非常兴奋，并迫不及待地想要使用它。例如，可以查看\
  \ [`www.1stwebdesigner.com/freebies/22-handy-html5-css3-tools-resources-and-guides`](http://www.1stwebdesigner.com/freebies/22-handy-html5-css3-tools-resources-and-guides)\
  \ 上的“22 个实用的 HTML5 和 CSS3 工具、资源和指南”。\n\n图 2-5 展示了几个仅使用 CSS3 格式化的简单文本框。\n\n**图 2-5：**\
  \ 使用 CSS3 进行倾斜和变换的文本框示例。\n\n![9781118026229-fg0205.tif](img/9781118026229-fg0205_opt.jpeg)\n\
  \n### 光明的未来\n\n这些东西令人兴奋。但请记住，所有 CSS3 的魔力都是由移动设备——更具体地说，是由设备的浏览器执行的。如果设备不支持 CSS3，媒体查询就无法工作。虽然智能手机正畅销如飞，但如果您的移动设备设计完全依赖于\
  \ CSS3，会导致大量移动 Web 用户无法访问您的站点。但请乐观起来：你可以打赌 CSS3 将在不久的将来彻底改变移动 Web 设计。\n\n将 CSS3\
  \ 与 HTML5 结合——说到未来——极有可能在革命中期彻底改变 Web 设计。许多浏览器（包括许多移动浏览器）已经支持许多 CSS3 和 HTML5 特性。作为一名移动设计人员，您的工作是为尽可能多的站点移动访问者提供最佳的移动\
  \ Web 体验。这意味着您不能依赖单一的标准——而且就此而言，您也不能仅仅依赖 CSS。您可以在第 11 章中看到一些最实用的移动设备 CSS3 格式化选项。\n\
  \n您可以使用许多工具，包括 XHTML 和 CSS，但如果您加入一些其他技术，如 JavaScript 和服务器端 PHP 脚本（运行在服务器而非设备上），以及本书中涵盖的其他几种技术，您将能适配更多的移动用户。\n\
  \n## 第 3 章\n\n### 介绍用于构建移动网页的 JavaScript\n\n## 本章内容\n\n- ![arrow](img/arrow.png)\
  \ 在移动浏览器中使用 JavaScript\n- ![arrow](img/arrow.png) 将 HTML 与 JavaScript 集成\n- ![arrow](img/arrow.png)\
  \ 使用 head 部分添加 JavaScript 代码\n- ![arrow](img/arrow.png) 创建自动启动的 JavaScript 文件\n\
  - ![arrow](img/arrow.png) 为用户提供页面内容的动态控制\n- ![arrow](img/arrow.png) 使用 JavaScript\
  \ 和文档对象模型（DOM）动态更改图形\n\nJavaScript 的优点在于“事半功倍”。您可以在 HTML 代码中添加一小段脚本，然后反复使用它。JavaScript\
  \ 能帮助您让网站在 27 英寸屏幕的大型计算机、笔记本电脑、平板电脑和智能手机上看起来都恰到好处——而这一切都使用同一个 HTML 页面。只需让 JavaScript\
  \ 完成所有工作，去计算您正在使用的设备类型和尺寸即可。\n\n您可以使用任何编写 HTML 的应用程序来编写 JavaScript。这包括像 Adobe Dreamweaver\
  \ 这样的 Web 开发程序，或者像 NotePad 和 TextEdit 这样的文本编辑器。正如歌曲中所唱的，随心而为。无论您选择哪种方式，您都会发现编写 JavaScript\
  \ 代码轻而易举。更重要的是，您会发现它将呈指数级地增加您在网页上能实现的功能，尤其是在移动设备上。\n\nJavaScript 适用于大多数浏览器——无论是在计算机还是移动设备上。所有解释代码的工作都由浏览器完成，而不是由您的操作系统、硬件，或者住在您电脑里打字飞快的小老鼠完成。它被认为是解释型语言，因为您不需要将其编译成二进制代码。就像\
  \ HTML 一样，JavaScript 完全依赖于浏览器，而且由于 HTML 和 JavaScript（以及 CSS）共同生存和工作，您可以直接在 HTML\
  \ 页面的中间插入 JavaScript。\n\n那么，除了对移动设备上查看的网页进行调整外，JavaScript 还能做什么？简而言之，它增强了网页的交互性。仅使用\
  \ HTML 时，用户点击链接时发生的唯一反应就是跳转到另一个页面。而使用 JavaScript，您可以让页面以许多不同的方式做出响应而无需切换页面。例如，JavaScript\
  \ 可以弹出一个警报窗口，以引起用户对及时信息、友好问候或提醒把猫带出去的注意。\n\n## 使用 JavaScript 实现移动化\n\n\n\n\n\n在移动设备和非移动设备上，JavaScript\
  \ 都在浏览器中运行，而非操作系统。与 HTML 类似，尽管存在标准（称为 ECMAScript），但并非所有 JavaScript 实现都完全相同。此外，用户可以开启或关闭\
  \ JavaScript，如果关闭，JavaScript 将不会启动。在撰写本文时，JavaScript 已在几种常见的移动浏览器中实现，并广泛用于为移动设备设计的\
  \ HTML 应用程序中，因此你很容易找到支持 JavaScript 的浏览器。不过，你应该为不同的实现做好准备。例如，全球使用最广泛的智能手机平台是 Symbian\
  \ S60——你可能从未听说过它。较新版本的浏览器（称为“S60v3 浏览器”）支持 JavaScript，但较旧的 S60 浏览器不支持。同样，大多数较新且广泛使用的移动浏览器都支持\
  \ JavaScript；所以不要认为只有少数移动浏览器支持它。大多数都支持。\n\n![tip.eps](img/tip_opt.jpeg) 当你使用 JavaScript\
  \ 创建移动应用程序时，请务必在不同的移动浏览器上进行测试。这样，当它在某些浏览器上以意想不到的方式运行——或者根本无法运行时，你就不会感到惊讶了。\n\n##\
  \ 在 HTML 脚本中放置 JavaScript 的位置\n\n通常，JavaScript 程序的代码放在脚本中称为 head 的区域。你可以通过其周围的标签轻松找到\
  \ head 容器——它是位于开始 head 标签 `<head>` 和结束 head 标签 `</head>` 之间的区域。例如，你可能见过类似下面这样的代码片段：\n\
  \n```html\n<head>\n<style type=”text/css”>\nbody {\n   background-color:#fbf7e4;\n\
  \   font-family:Verdana, Geneva, sans-serif;\n   margin-left:20px;\n   color:#8e001c;\n\
  }\n</style>\n<title>My Mobile Page</title>\n<meta http-equiv=”Content-Type” content=”text/html;\
  \ charset=UTF-8”>\n</head>\n```\n\n在 head 中常见的标签包括：\n\n- ![check.png](img/check.png)\
  \ 样式表：你的 CSS 样式表位于此处。\n- ![check.png](img/check.png) 标题：标题显示在网页顶部。\n- ![check.png](img/check.png)\
  \ 元标签：这些标签向 Web 服务器提供有关页面的信息。\n- ![check.png](img/check.png) 脚本：这些标签将 JavaScript（或其他脚本语言）嵌入到\
  \ HTML 页面中。\n\nHTML 页面的 head 区域可以包含很多内容，也可以只包含少量内容。那么现在让我们看看需要做什么来添加 JavaScript。\n\
  \n### JavaScript 脚本\n\n在编写第一个 JavaScript 程序之前，先看看用于指示脚本是 JavaScript 而非其他语言的标签。下面展示了\
  \ `<head>` 容器内的 `<script>` 容器：\n\n```html\n<script type=”text/javascript”>\n   //This\
  \ is where the JavaScript goes\n</script>\n```\n\n`<script>` 容器中的所有代码都被视为一个完整的程序。\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 关于网页 head 区域的一个重要特点是，head 中的所有内容都会首先加载。这样，当页面其余部分加载时，你的\
  \ JavaScript（或 CSS 样式表）就已经准备就绪了。可以把 head 区域看作是排在第一位的内容。\n\n有时你可能希望确保 JavaScript\
  \ 在页面加载完成之后才启动。由于 `<head>` 容器中的所有内容都会首先启动，你可以直接将脚本放在 `<body>` 容器中。一般格式如下所示：\n\n\
  ```html\n<body>\n<h1>My Big Page</h1>\n<script type=”text/javascript”>\n    //JavaScript\n\
  </script>\n<p/>This is more interesting material..\n</body>\n```\n\n在文本中添加少量 JavaScript\
  \ 代码不会影响用户看到的内容。`<script>` 标签内的 JavaScript 是不可见的。\n\n如果你有一些经常重复使用的 JavaScript 代码，可以将其放在一个外部文本文件中，而不是放在\
  \ HTML 脚本中。然后，每当你想使用它时，只需调用该文件名，你的 JavaScript 就会像 HTML 的一部分一样工作。你可以将 JavaScript\
  \ 引用放在与直接输入相同的位置，即 head 或 body 中。例如，下面可能是一个你放在所有 HTML 页面中的问候语：\n\n```html\n<head>\n\
  \   <script src=”welcome.js”></script>\n</head>\n```\n\n名为 `welcome.js` 的文本文件中的\
  \ JavaScript 是纯 JavaScript，不包含 HTML 标签。你也可以将相同类型的标签放在 body 中。例如，你可能在每个页面底部放置一个通知：\n\
  \n```html\n<body>\n   …all the rest of your HTML\n   <script src=”welcome.js”></script>\n\
  </body>\n```\n\n所以请记住，JavaScript 会尽量做到兼容！用你自己的方式添加 JavaScript。\n\n## 你的第一个 JavaScript\
  \ 程序\n\n首先，来看一个名为 `alert()` 的内置 JavaScript 函数，它会在你的 HTML 页面上弹出一个警告框。要设置此函数，请在 Dreamweaver\
  \ 或你喜欢的文本或 HTML 编辑器中打开一个新的 HTML 页面，输入清单 3-1 中的代码，然后将文件保存为 `alert1.html`。\n\n清单 3-1：一个\
  \ JavaScript 警告框\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<script type=”text/javascript”>\n\
  alert(“Hello from your mobile!”);\n</script>\n<meta http-equiv=”Content-Type” content=”text/html;\
  \ charset=UTF-8”>\n<title>Alert!</title>\n</head>\n<body>\n</body>\n</html>\n```\n\
  \n如果你使用 Google Chrome 浏览器测试此文件，你会看到一个如图 3-1 所示的警告框。（其他浏览器会显示不同的结果。）\n\n图 3-1：在桌面计算机的\
  \ Chrome 浏览器中显示的 JavaScript 警告框。\n\n![9781118026229-fg0301.eps](img/9781118026229-fg0301_opt.jpeg)\n\
  \n现在你有了一个可用的示例，可以检查它在移动设备上的显示效果。与台式机或笔记本电脑不同——你可以直接在计算机上使用浏览器测试 HTML 和 JavaScript——移动设备要求你将脚本放在服务器上，然后使用移动浏览器像在计算机上查看任何远程网站一样查看它。\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 在将 HTML 文件放到 Web 服务器上之前，你需要有一个托管服务或访问计算机上的\
  \ Web 服务器。如果你有托管服务（可能通过工作或学校获得），系统管理员会提供将 HTML 文件放到 Web 服务器上的说明。如果你的计算机上装有 Web 服务器（大多数都有！），你需要能够通过互联网访问计算机的\
  \ IP 地址。如果你设置了局域网（LAN），则可以使用它来访问你的文件。常见的局域网 IP 地址以 192.168... 开头。例如，我计算机的局域网地址是\
  \ 196.168.1.26。我将 `alert1.html` 文件放在名为 `js` 的文件夹中——就在我的 Web 服务器根目录下。每当我想在移动设备上查看网站的外观时，我可以输入\
  \ `196.168.1.26/js/alert1.html`。有关详细信息，请参阅以下网站：\n\n- ![check.png](img/check.png)\
  \ 对于 Windows：[`windows.microsoft.com/en-US/windows-vista/Setting-up-a-home-network`](http://windows.microsoft.com/en-US/windows-vista/Setting-up-a-home-network)\n\
  - ![check.png](img/check.png) 对于 Mac：[`www.apple.com/support/`](http://www.apple.com/support/)\n\
  \n![tip.eps](img/tip_opt.jpeg) 另一种测试移动页面的方法是安装一个功能齐全的 Apache 模拟器作为测试服务器。Apache 是在\
  \ Linux 服务器上流行的 Web 服务器应用程序，大多数网站都托管在 Linux 服务器上。有关如何安装和使用测试服务器的说明，请参见第 4 章。\n\n\
  ## 移动视图\n\n现在你已经在 HTML 页面中有了一个实际的 JavaScript 函数，需要在移动浏览器上查看它。图 3-2 显示了在移动设备上使用 Safari\
  \ 移动浏览器打开的警告窗口。\n\n图 3-2：在 Safari 移动浏览器中显示的 JavaScript 警告框。\n\n\n\n\n\n![9781118026229-fg0302.tif](img/9781118026229-fg0302_opt.jpeg)\n\
  \n如图 3-2 所示，弹出式警告窗口与你在桌面上看到的有所不同，但这只是样式上的小问题。Safari 移动浏览器没有图形图标，而是显示网页的 URL。在图 3-2\
  \ 中，显示的是一个局域网 IP 地址，而不是描述性的域名地址。无论如何，桌面浏览器和移动浏览器视图之间的差异并不大。然而，当我们尝试不同的移动浏览器时，会看到截然不同的外观。图\
  \ 3-3 展示了 Opera 移动浏览器显示同一远程服务器上托管的页面。\n\n**图 3-3：** Opera 移动浏览器中显示的 JavaScript 警告框。\n\
  \n![9781118026229-fg0303.eps](img/9781118026229-fg0303_opt.jpeg)\n\n如图 3-3 所示，Opera\
  \ 移动浏览器中出现了完全不同的视图。它看起来与其他警告框完全不同。用户会认出这是一个警告窗口吗？这可能取决于你用它做什么——以及它的一般使用场景。此外，警告框的效果如何，还取决于网页设计的观感。不要仅仅因为它在你的电脑上看起来符合你的喜好，就认为在移动设备上也会得到相同的外观。\n\
  \n## 函数：等待被调用！\n\n位于 head 容器中的 JavaScript 会在网页加载时立即执行。或者，你可以创建一个函数，等待被调用——即发生某个事件，告诉函数：“嘿，你！需要你的服务！”函数实际上就是一组\
  \ JavaScript 语句打包在一起，当某个特定事件发生时立即运行。在深入学习函数之前，首先要理解如何通过事件和事件处理程序来调用（请求）函数。\n\n##\
  \ 事件、监听器及其处理程序\n\n当你查看网页时，可能觉得它没什么动静，但请相信我；你的页面其实是个大派对动物！当你打开一个网页时，这是一个事件。当你播放或停止视频（在\
  \ HTML5 中，详见第 11 章）时，这是一个事件。当你点击鼠标或触摸移动设备屏幕时，这是一个事件。根据最新统计，你的 HTML5 页面能识别 71 个事件！（XHTML\
  \ 识别的事件较少。）事件可以分为以下几类：\n\n- ![check.png](img/check.png) 窗口事件：这些事件发生在你的计算机窗口中。当网页加载完成时，`onload`\
  \ 事件监听器会检测到该事件。\n- ![check.png](img/check.png) 表单事件：表单容器内的任何事件。例如，当你点击提交按钮发送表单数据时，`onsubmit`\
  \ 事件监听器会检测到该事件。\n- ![check.png](img/check.png) 键盘事件：敲击键盘当然是一个事件——它可以通过 `onkeypress`\
  \ 和其他键盘监听器捕获。\n- ![check.png](img/check.png) 鼠标事件：在移动设备上，你的手指代替了鼠标；当你触摸屏幕时，设备会监听到\
  \ `onclick` 以及其他几种类似鼠标的操作。\n- ![check.png](img/check.png) 媒体事件：移动设备上的媒体事件与记者和狗仔队无关，而是音频和视频的事件——例如媒体开始播放时的\
  \ `onplay` 和播放结束时的 `onended`。\n\nJavaScript 允许你通过几种不同的方式添加事件监听器。你可以使用这里讨论的 `onload`、`onclick`\
  \ 选项，或者使用本章后面以及第 15 章中讨论的 `addEventListener` 方法。选择哪种选项取决于脚本和上下文。\n\n事件处理程序不过是一个在指定事件发生时执行某些操作的函数。JavaScript\
  \ 可以以 `函数` 的形式创建事件处理程序。函数的格式如下：\n\n```\nfunction myFunction()\n{\n   // 执行某些操作\n\
  }\n```\n\nJavaScript 函数通常写在页面头部，就像其他 JavaScript 一样。要尝试一个函数，请在 Dreamweaver 或你喜欢的文本或\
  \ HTML 编辑器中打开一个新 HTML 页面，输入清单 3-2 中的代码，然后将文件保存为 `WriteFunction.html`。\n\n清单 3-2：一个\
  \ JavaScript 函数\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<script type=”text/javascript”>\n\
  function sayHello()\n{\n   var greetVar=”This greeting... “;\n   var lineBreak=”<br/>”;\n\
  \   var moreGreet=”...is brought to you by a function.”;\n   document.write(greetVar);\n\
  \   document.write(lineBreak);\n   document.write(moreGreet);\n   document.write(lineBreak);\n\
  }\n</script>\n<meta http-equiv=”Content-Type” content=”text/html; charset=UTF-8”>\n\
  <title>问候函数</title>\n</head>\n<body onLoad=”sayHello()”>\n</body>\n</html>\n```\n\
  \n将此文件放在 Web 服务器上，在移动设备上打开浏览器，找到包含 `WriteFunction.html` 的 URL，并在浏览器中选择它。在移动设备上，你会看到类似图\
  \ 3-4 中的图像，具体取决于你的设备和移动浏览器。\n\n**图 3-4：** JavaScript 向移动屏幕写入内容，就像向计算机屏幕写入一样。\n\n\
  ![9781118026229-fg0304.eps](img/9781118026229-fg0304_opt.jpeg)\n\n你可能会想，这和把 JavaScript\
  \ 放在函数外部、在页面加载时执行没什么区别！区别很微妙。使用 `onload` 事件会等待页面加载完成，然后触发函数。而之前看到的是 JavaScript 在页面加载之前就执行了——头部先加载。\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 并非所有事件在所有移动设备和浏览器上都以相同方式处理。例如，屏幕上“触摸”和“点击”之间的技术差异可能非常显著。同样，并非所有移动设备都能很好地响应其他鼠标事件，如鼠标悬停、鼠标移出或双击。移动设备上的键盘只在某些上下文中出现——因此你需要检查\
  \ JavaScript 中的任何键盘事件，以确认其上下文是否正确。如果你使用尽可能多的不同设备测试你的 JavaScript 事件处理程序程序，你会发现最常用的事件——以及一些根本不能在移动设备上工作的事件。\n\
  \n## 使用变量和少量 DOM 创建函数\n\nJavaScript 使用 `变量` 来存储信息以供将来使用。变量是一种存储信息的属性。其中一些信息是文本——称为字符串——其余大部分是数字。所以如果我写\n\
  \n`var sayHi=”Hello there!”;`\n\n名为 `sayHi` 的变量存储了文本（称为字符串）。当需要该存储的文本时，它会被放入一个函数中，显示在屏幕上。\n\
  \n在示例中，我们使用了 HTML5 中的文档对象模型（DOM），详见第 11 章。DOM 是一种组织 HTML 属性（attributes）和方法（functions——导致动作发生的元素）的方式，它将\
  \ HTML 页面视为一个名为 `document` 的对象。使用 JavaScript 可以让你通过可用的 DOM 函数来指定值并发出命令。例如，DOM 包含一个名为\
  \ `write()` 的函数。因此只需要以下语句：\n\n`document.write(sayHi);`\n\n当 `onload` 事件监听器调用该函数时，变量（`sayHi`）中存储的任何内容都会显示在屏幕上。要了解更多关于\
  \ DOM 的内容，官方文档可以在 [`www.w3.org/DOM/`](http://www.w3.org/DOM/) 找到。\n\n## 等我告诉你！\n\
  \n现在，如果你不希望任何事情发生，直到你发出指令，那么你需要某种方式来输入或触摸以表达你的意图。`onload` 事件以及其他事件监听器固然不错，但当用户需要直接与页面交互时，情况就不同了。\n\
  \n\n\n\n\n要使函数等待用户操作，可以使用 `onclick`。在移动设备上，你的手指负责点击，因此你可以将 `onclick` 视为 `ontap`。以下脚本展示了一个非常简单的示例。要尝试它，请在\
  \ Dreamweaver 或你喜欢的文本或 HTML 编辑器中打开一个新 HTML 页面，输入清单 3-3 中的代码，然后将文件保存为 `tapFunction.html`。\n\
  \n### 清单 3-3：点击与轻触\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<script type=”text/javascript”>\n\
  function headTap()\n{\n   var elTappo=”I just got tapped in the head(er)”;\n   alert(elTappo);\n\
  }\n</script>\n<meta http-equiv=”Content-Type” content=”text/html; charset=UTF-8”>\n\
  <title>Function On Tap</title>\n</head>\n<body>\n<header onclick=”headTap()”>\n\
  \  <h1>Tap Me!</h1>\n</header>\n</body>\n</html>\n```\n\n将此文件放置在 Web 服务器上，在移动设备上打开浏览器，找到包含\
  \ `tapFunction.html` 的 URL 并在浏览器中选中它。页面打开后，你会看到 `Tap Me!` 字样。用手指轻触这些文字——将你的指尖想象成鼠标按钮。一旦用手指轻触文本，就会出现如图\
  \ 3-5 所示的警告窗口。（完成后点击“确定”。）\n\n如你所见，你成功触发了 JavaScript 警告窗口，而且不需要按钮或鼠标——只需将你的手指称为“吱吱作响”即可。在\
  \ HTML5（第 11 章中讨论）中，你可以添加像 `<header>` 这样的结构标签，放置事件监听器（`onclick`），并为其分配一个 JavaScript\
  \ 事件处理程序（一个函数）。你的移动设备会将手指轻触视为一次点击。\n\n## 创建和销毁你自己的事件处理程序\n\n你可以通过事件和事件处理程序实现非常复杂的功能。请记住，目前只有部分鼠标和键盘事件适用于移动设备，你可以组合函数，并添加或移除事件处理程序。\n\
  \n图 3-5：轻触 `<header>` 容器中的文本启动了函数。\n\n![9781118026229-fg0305.tif](img/9781118026229-fg0305_opt.jpeg)\n\
  \n首先，你需要一个可以触发事件的对象——一个可以轻触、踢或挠的东西。由于你的移动设备无法识别踢或挠，我们来看看如何向 HTML 按钮添加轻触功能，然后再移除它。所需元素包括：\n\
  \n![check.png](img/check.png) 两个按钮\n\n![check.png](img/check.png) 一个在页面加载时为两个按钮添加事件的函数\n\
  \n![check.png](img/check.png) 另外两个函数，用于在点击每个按钮时执行操作\n\n要向对象添加事件监听器，你需要使用对象名称设置一个变量名。然后，向该对象添加事件监听器，如下面的代码片段所示：\n\
  \n```javascript\nvar tapper = document.getElementById (“tapButton”);\ntapper.addEventListener(“click”,Tapped,false);\n\
  ```\n\n要移除事件监听器，操作基本相同，只是使用移除事件监听器的操作，如下所示：\n\n```javascript\nvar tapper = document.getElementById\
  \ (“tapButton”);\ntapper.removeEventListener(“click”,Tapped,false);\n```\n\n在添加或移除事件监听器之后，输入事件类型，输入它跳转到的函数名称（省略括号），并在最后一个参数中添加\
  \ `false`。`false` 表示你希望事件处理程序在“冒泡”阶段启动。`true` 则会在“捕获”阶段启动事件。正确答案是“两者皆可”，但如果你不确定，请使用\
  \ `false`。\n\n要尝试此操作，请在 Dreamweaver 或你喜欢的文本或 HTML 编辑器中打开一个新 HTML 页面，输入清单 3-4 中的代码，然后将文件保存为\
  \ `tapButton.html`。\n\n### 清单 3-4：添加和移除事件监听器\n\n```html\n<!DOCTYPE HTML>\n<html>\n\
  <head>\n<script type=”text/javascript”>\nfunction Tapped()\n{\n   alert(“I just\
  \ got tapped”);\n}\nfunction Remover()\n{\n   var tapper = document.getElementById\
  \ (“tapButton”);\n   tapper.removeEventListener(“click”,Tapped,false);\n   tapper.style.background='black';\n\
  \   tapper.style.color='white';\n   alert(“Tap Man is broken!”);\n}\nfunction setUp()\n\
  {\n   var tapper = document.getElementById (“tapButton”);\n   tapper.addEventListener(“click”,Tapped,false);\n\
  \   var killer = document.getElementById (“spoiler”);\n   killer.addEventListener(“click”,Remover,false);\n\
  }\n</script>\n<meta http-equiv=”Content-Type” content=”text/html; charset=UTF-8”>\n\
  <title>Tap Button</title>\n</head>\n<body onload=”setUp()”>\n    <button id=”tapButton”>Tap\
  \ Man</button>\n    <button id=”spoiler”>Killer</button>\n</body>\n</html>\n```\n\
  \n将此文件放置在 Web 服务器上，在移动设备上打开浏览器，找到包含 `tapButton.html` 的 URL 并在浏览器中选中它。页面打开后，你会看到两个按钮——一个名为\
  \ `Tap Man`，另一个名为 `Killer`。轻触 Tap Man 按钮，一条警告消息会通知你刚刚被轻触了。现在轻触 Killer 按钮，一条警告消息会通知你刚刚破坏了\
  \ Tap Man 按钮。你实际上做的是移除了 Tap Man 上的事件监听器；现在它再也无法启动该函数了。此外，Tap Man 按钮上的黑色和白色也反转了。\n\
  \n再次轻触 Tap Man 按钮。什么也不会发生；然而，Killer 按钮仍然有效——你可以轻触它来弹出警告消息。\n\n图 3-6 展示了添加和移除事件时发生的不同事件和变化。\n\
  \n图 3-6：使用和移除事件处理程序。\n\n![9781118026229-fg0306.eps](img/9781118026229-fg0306_opt.jpeg)\n\
  \n## 让 JavaScript 来思考！\n\n你可能听说过计算机可以思考。嗯，你听对了。使用 JavaScript 的网页也可以。你只需要给它们一个需要解决的问题。需要计算如何加销售税？让\
  \ JavaScript 来做吧。\n\n例如，你可以让一个网页为你计算销售税。这个特定问题分解为以下几个简单步骤：\n\n1. 输入购买金额：14.95\n\
  2. 输入销售税率：5%\n3. 计算购买商品的销售税：14.95 乘以 0.05，等于 75 美分\n4. 计算总金额：购买金额加上销售税：15.70 美元（四舍五入）\n\
  \nJavaScript 现在只需要一些基本的算术运算符来处理计算，它们如下：\n\n+ 加法\n– 减法\n* 乘法\n/ 除法\n\n要使用运算符，你只需将其放在两个变量或实际数字之间，如下例所示：\n\
  \n```javascript\n9 / 3 = 3\n10 * 5 = 50\n```\n\n使用变量时，你可以输入：\n\n```javascript\n\
  var alpha = 15;\nvar beta = 10;\nalpha + beta = 25\n```\n\n将表达式放入 JavaScript 列表中也同样简单。要创建一个根据销售税率和购买金额计算总成本的函数，步骤如下：在\
  \ Dreamweaver 或你喜欢的文本或 HTML 编辑器中打开一个新 HTML 页面，输入清单 3-5 中的代码，然后将文件保存为 `salesTax.html`。\n\
  \n### 清单 3-5：计算总成本\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<style type=”text/css”>\n\
  section\n   {\n   font-family:”Comic Sans MS”, cursive;\n   color:#900;\n   }\n\
  </style>\n<script type=”text/javascript”>\nfunction salesClerk()\n{\n   var purchasePrice=14.95;\n\
  \   var taxRate=.05;\n   var taxOnPrice=purchasePrice * taxRate;\n   var total=purchasePrice\
  \ +taxOnPrice;\n   alert(“Your bill is $” + total);\n}\n</script>\n<meta http-equiv=”Content-Type”\
  \ content=”text/html; charset=UTF-8”>\n<title>The Thinker</title>\n</head>\n<body>\n\
  <article>\n<section onClick=”salesClerk()”>\n  <h1>Your total is...(tap me)</h1>\n\
  </section>\n</article>\n</body>\n</html>\n```\n\n将此文件放置在 Web 服务器上，在移动设备上打开浏览器，找到包含\
  \ `salesTax.html` 的 URL 并在浏览器中选中它。\n\n你可能已经注意到，我们添加了一点 CSS（在第 2 章中讨论）来让它更生动一些。图\
  \ 3-7 展示了查看该文件时可以看到的效果。\n\n\n\n\n\n**图 3-7：** 点击文本会在警报窗口中显示总费用。\n\n![9781118026229-fg0307.tif](img/9781118026229-fg0307_opt.jpeg)\n\
  \n如果你熟悉 Comic Sans 字体，你可能会好奇为什么在移动浏览器显示中会出现草书体。这只是在提醒我们，移动设备的字体集仍然有限。\n\n你可能还好奇为什么总价的数值没有被四舍五入。这是因为我们没有告诉\
  \ JavaScript 处理这个细节。现在我们来处理它。既然如此，让我们把税率从 5% 改为 4%。只需修改以下两行：\n\n首先将\n\n`var taxRate=.05;`\n\
  \n改为\n\n`var taxRate=.04;`\n\n然后将\n\n`alert(“Your bill is $” + total);`\n\n改为\n\n\
  `alert(“Your bill is $” + Math.round(total*Math.pow(10,2))/Math.pow(10,2));`\n\n\
  保存你的程序并再次运行。这一次，结果不同了，小数点后只有两位整数 —— 就像真实的金钱一样！（顺便说一句，新的税率很有帮助。看看图 3-8 —— 移动设备“晕倒”了，结果侧向显示。）\n\
  \n**图 3-8：** 调整后显示两位小数的结果。\n\n![9781118026229-fg0308.tif](img/9781118026229-fg0308_opt.jpeg)\n\
  \n处理两位小数的 `math` 语句可能有点难以理解，但它其实只是以下写法的花哨形式：\n\n`Math.round(total*100)/100`\n\n\
  ![tip.eps](img/tip_opt.jpeg) 更棒的是，只需将这个公式（极客术语称之为算法）保存在电脑的方便位置，在需要将数值四舍五入到两位小数时将其调用。如果你使用\
  \ Dreamweaver，可以将其保存在该程序的代码片段（Snippets）面板中，并在需要时插入到文档中。\n\n## 使用 JavaScript 实现图形魔术\n\
  \n也许你不喜欢数学，但 JavaScript 非常热爱它！然而，JavaScript 更具艺术的一面如何呢？JavaScript 是否也具有艺术气质？是的，它确实有！在本节中，你将看到\
  \ JavaScript 如何使用文档对象模型（DOM）来处理图形。\n\n### DOM 与图形\n\n如果你将 HTML DOM 视为一个拥有许多属性的大对象（document），你会发现它更容易理解。在许多方面，DOM\
  \ 只是网页的另一种表示形式 —— 它只是以不同的方式表达。在 HTML 中，你使用以下格式加载图形文件：\n\n`<img src=”myGraphic.png”\
  \ name=”graphicLand”>`\n\n要在 DOM 中使用 JavaScript 表达同一行内容，你可以写：\n\n```\nvar mygr =\
  \ new Image();\nmygr.src=”myGraphic.png”;\ndocument.graphicLand.src=mygr.src;\n\
  ```\n\n你可能认为 JavaScript 的方法看起来更复杂一些，但逻辑是一样的。在 HTML 和 DOM 版本中，图形“持有者”的名称都是 `graphicLand`。在\
  \ HTML 和 DOM 编码中，图形文件的名称都被分配给 `src` 属性，但在 DOM 版本中，创建了一个名为 `mygr` 的图像对象来持有对实际图形文件的引用。\n\
  \n### 怦然心动\n\n在纯 HTML 中，你的图形是固定不动的。通过添加一些 JavaScript，你可以将它们移入或移出由 JavaScript 定义的\
  \ DOM 位置。为了查看一个示例，请考虑两个心形图形 —— 一个缩略图和一个大尺寸图 —— 它们被创建为 PNG 文件。缩略图是原始图；当用户点击缩略图时，会出现一个大心形图像。通过使用\
  \ `onclick` 事件监听器，你可以用大心形替换缩略图心形。为此，在 Dreamweaver 或你喜欢的文本/HTML 编辑器中打开一个新 HTML 页面，输入代码清单\
  \ 3-6 中的代码，然后将文件保存为 `imageSwap.html`。\n\n**代码清单 3-6：将缩略图转换为较大的图形**\n\n```\n<!DOCTYPE\
  \ HTML>\n<html>\n<head>\n<script language=”Javascript”>\nvar bigHeart= new Image()\n\
  bigHeart.src=”bigHeart.png”\nfunction goBig()  \n{\n   document.heart.src=bigHeart.src\n\
  }\n</script>\n<meta http-equiv=”Content-Type” content=”text/html; charset=UTF-8”>\n\
  <title>Big Heart</title>\n</head>\n<body>\n<header onclick=”goBig()”> <img id=”heart”\
  \ src=”littleHeart.png” border=0></header>\n</body>\n</html>\n```\n\n将此文件放置在 Web\
  \ 服务器上，在移动设备上打开浏览器，然后定位到 `imageSwap.html` 的 URL 并在浏览器中选择它。当程序加载时，你会看到一个小心形图像。当你点击心形图像时，屏幕上会出现一个大心形。在图\
  \ 3-9 中，你可以看到左侧的原始图像和点击后的较大图像。\n\n**图 3-9：** 点击使图像变大。\n\n![9781118026229-fg0309.eps](img/9781118026229-fg0309_opt.jpeg)\n\
  \n![warning_bomb.eps](img/warning_bomb_opt.jpeg) 移动浏览器似乎有自己的想法。如果你双击大心形，它会变得更大！再次双击，它会变小。正如你在代码中看到的一样\
  \ —— 并且在你点击缩略图时体验到的一样 —— 只需要单击一次。然而，双击 —— 无论是特定浏览器的功能还是由于移动设备的操作系统 —— 则是另一回事；在某些移动浏览器上，什么都不会发生！因此，请务必首先在预期使用的移动浏览器上测试你的\
  \ HTML 应用。\n\n正如你所见，你可以利用 JavaScript 在移动 Web 应用程序中开启一个全新的可能性领域，而本章仅仅触及了皮毛。JavaScript\
  \ 可以根据你应用的需要而简单或复杂 —— 但请不要误会：使用 JavaScript 的 HTML 能做的事情远比不使用它要多得多！\n\n## 第 4 章\n\
  \n# 移动 Web 设计软件与实用工具\n\n## 本章内容\n\n![arrow](img/arrow.png) 理解手动编码与使用 Web 设计软件之间的区别\n\
  \n![arrow](img/arrow.png) 探讨源代码编辑器\n\n![arrow](img/arrow.png) 探索是否使用 Adobe Dreamweaver\n\
  \n![arrow](img/arrow.png) 理解 Adobe Creative Suite 程序的优势\n\n![arrow](img/arrow.png)\
  \ 设置本地测试环境\n\n![arrow](img/arrow.png) 在工作站上安装 Web 服务器进行测试\n\n在专业 Web 设计领域，基本上有两种学科、思想流派或阵营\
  \ —— 无论你怎么称呼它们。一方面是纯粹主义者 —— 通常是手动编码者，他们“手动”输入创建网页的代码，而不借助 WYSIWYG（发音为 wih-zee-wig，意为“所见即所得”）软件。这就引出了第二类专业\
  \ Web 设计师：你猜对了 —— 那些使用 WYSIWYG 设计软件创建网页的专业人士。\n\n曾经有大约 20 种左右的 Web 设计应用程序。不过现在，只剩下少数几种，它们可以很容易地分为两类：高端专业\
  \ Web 设计软件包和低端初学者软件。（此外，还有大量其他程序，如 Microsoft Word 和 PowerPoint —— 显然其目的并非 Web 设计\
  \ —— 它们允许你将创建的文档导出为 HTML 或其他类型的 Web 就绪格式。例如，Word 还允许你将文字处理文件导入为 XML，它是 HTML 一个较为复杂的近亲。）\n\
  \n如今，唯一剩下的工业级专业 WYSIWYG Web 设计程序是 Adobe 的 Dreamweaver。另一方面，手动编码者倾向于使用源代码编辑器 —— 专门用于输入和编辑源代码的程序\
  \ —— 并且他们可以使用各种程序和实用工具来提供帮助，包括几个流行的 Web 浏览器 —— Firefox 和 Google 的 Chrome。这些免费且易于获取的程序允许你安装插件（同样免费），将普通的\
  \ Web 浏览器变成一个相当先进的手动编码和测试环境。\n\n\n\n\n在本章中，我将比较两种方法——手工编码和使用 Dreamweaver。每种方法都有显著的优点和缺点。本章还讨论了在源代码编辑器中应关注哪些\
  \ HTML 和 CSS 特定功能，以及一些用于制作和测试移动网站的流行浏览器插件。如果你尚未搭建移动网站创建和测试环境，本章中的信息应能帮助你更轻松地做出选择。\n\
  \n## 手工编码与网页设计程序\n\n如果你是网页设计新手，正在考虑手工编码，那么可用的应用程序、工具和技术数量庞大，可能会让你望而生畏。经过多年教授网页设计和为客户设计网站的经验，我注意到，大多数情况下，新手设计师倾向于坚持他们最初使用的方法——或者他们老师和导师使用的应用程序和工具。此外，还有自学成才的人，他们通过搜索网络和自助书籍（尤其是“傻瓜”系列书籍）来学习。这些专业人士似乎以一种“什么管用就用”的、以任务为导向的心态来学习和创作——即完成工作的最短路径。\n\
  \n创建网站的方法有很多种。让我们仔细看看并比较可用的工具，以帮助你创建移动网站。\n\n候选方法如下：\n\n![check.png](img/check.png)\
  \ 文本编辑器：你可以使用简单的文本编辑器，如 Windows 记事本或 Mac OS 文本编辑，或者你的文字处理器来手工编写页面代码。这是最简陋的方法，尤其是当你使用操作系统自带的文本编辑器时。这种方法不提供任何帮助，完全依赖你对\
  \ HTML 和 CSS 编码的知识。选择这种方法，你就成了一名手工编码的角斗士。\n\n![check.png](img/check.png) 源代码编辑器：你可以使用众多\
  \ HTML/CSS 源代码编辑器之一——例如 UltraEdit 或 Aptana——来帮助你手工编写页面代码。源代码编辑器是带有编写代码附加功能的文本编辑器。\n\
  \n![check.png](img/check.png) 浏览器插件：你可以使用浏览器（如 Firefox 或 Chrome）配合第三方插件来增强浏览器的功能，从而手工编码和测试你的网页。\n\
  \n![check.png](img/check.png) Adobe Dreamweaver：你可以使用唯一剩下的工业级所见即所得（WYSIWYG）网站设计和\
  \ Web 应用程序开发程序——Adobe Dreamweaver——来创建你的网站并设计页面。图 4-1 显示了 Dreamweaver 的所见即所得编辑模式——设计视图下的一个网页。Dreamweaver\
  \ 是一个非常强大的程序，本章稍后会进一步讨论。\n\n![check.png](img/check.png) Adobe Creative Suite：你可以做出最终承诺，投资\
  \ Adobe 的网页设计套件——Creative Suite Web Premium——来创建所有支持内容、样式表和脚本；并设计和布局你的网站及支持页面和文件。此选项将在本章后面讨论。\n\
  \n你可以像许多专业设计师和开发者那样，选择其中一种方法，深入学习并坚持使用；或者你也可以像许多其他设计师那样，结合使用两种或多种方法。每种方法都有其自身的优点和缺点。俗话说，没有什么是完美的，有些网页设计工具和实用程序比其他工具更不完美。但这不应阻止你尝试寻找完美的设计工具——或者至少是适合你和你的工作方式的最佳工具。\n\
  \n**图 4-1：** 使用 Dreamweaver 的所见即所得界面实时创建并查看你的新网页。\n\n![9781118026229-fg0401.eps](img/9781118026229-fg0401_opt.jpeg)\n\
  \n## 手工编码（或用玻璃刮胡子）\n\n你可能已经猜到了，我并不是手工编码的狂热粉丝。对我来说，手工编写网页代码太接近编程了——而我认为编程需要一种我缺乏的特殊思维方式。我对程序员怀有最高的敬意。然而，在这个行业——网站和\
  \ Web 应用程序设计——中，要成为一名优秀、先进、前沿的设计师，有时你无法避免手工编码和编程。\n\n一些手工编码者非常坚决地不使用所见即所得软件来创建他们的网站。例如，你经常会在招聘网页设计师的广告中看到这样的内容：“招聘网页设计师。如果你使用\
  \ Dreamweaver，请不要申请。”\n\n那么，为什么这些设计师认为手工编码优于网页设计软件呢？\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 大多数可用的所见即所得设计程序——当然，除了 Adobe Dreamweaver——实际上都是针对初学者和小企业主的，他们更关心的是快速、省事地搭建网站，而不是学习\
  \ HTML 和 CSS 的复杂性。为了讨论方便，我们假设剩下的唯一专业所见即所得编辑器就是 Dreamweaver。从现在开始，当我提到网页设计软件时，我指的就是\
  \ Dreamweaver。\n\n那么，让我们来看看手工编码者声称更喜欢手工编码而非使用 Dreamweaver 的主要原因。\n\n### 对代码有更多控制\n\
  \n多年来与我交谈过（并经常合作项目）的手工编码者说，直接在代码中工作，而不是让设计软件为他们生成代码，可以提供更高水平的控制，从而让他们能够创建更优秀的文档。这里显而易见的问题是，更优秀体现在哪里？以下是一些常见的回答：\n\
  \n![check.png](img/check.png) 手工编码让你能够实现图形编辑器不支持的功能和优化。换句话说，你可以通过手工编码做到 Dreamweaver\
  \ 做不到的事情。\n\n![check.png](img/check.png) 手工编码能更好地控制代码的语法。你可能从高中和大学的写作课上熟悉了“语法”这个术语。（不，我不是在谈论政府对饮酒和赌博的征税。）语法指的是代码的整体结构——即代码的组成方式。正如这在写作中很重要一样，在页面标记和编程语言中也很重要。\n\
  \n![check.png](img/check.png) 手工编码的文档更有可能符合 W3C 标准。这基本上不言自明。它暗示 Dreamweaver 不会生成符合标准的代码。W3C\
  \ 标准在第 1 章和第 2 章中讨论过。\n\n![check.png](img/check.png) 手工编码生成更精简、更高效的“机器就绪”代码。与上一点类似，这表明\
  \ Dreamweaver 生成的代码质量较差，机器（计算机和移动设备）在解释和执行这些代码时比手工编码的代码更困难。\n\n这些听起来像是远离 Dreamweaver\
  \ 的充分理由，不是吗？冒着听起来像 Adobe 大股东的风险，我要说：如果这些说法属实，那么它们确实是手工编码的很好理由。然而，在很久以前，所有这些抱怨不仅对\
  \ Dreamweaver 有效，对所有其他网页设计软件包也有效。不过，自从几年前 Adobe 从 Macromedia 收购 Dreamweaver 以来，Adobe\
  \ 在纠正这些缺点方面做得非常出色。这些不再是避免使用 Dreamweaver 的适用理由。\n\n### 手工编码成本更低\n\n这是真的吗？如果我们在谈论初始投资——避免购买网页设计软件的费用——那么，是的，手工编码成本更低。毕竟，无论你使用\
  \ Windows 机器还是 Mac，你都已经有一个文本编辑器可以用来手工编码，对吧？而且你可能已经有 Word 或其他文字处理器了。所以，不，如果你要手工编码，你不需要再购买任何东西。\n\
  \n\n\n\n但你确实不能仅仅根据初始支出来衡量成本。无论你是自由设计师还是公司的指定网页设计师，在评估成本时，时间都是一个重要且极其相关的变量。在网页设计领域，那句老话“时间就是金钱”毫无疑问是千真万确的。Dreamweaver\
  \ 的价格不到 200 美元。而专业设计师的平均收费是每小时 50 美元以上（许多人每小时收费 100 美元或更多）。如果使用 Dreamweaver 能让你在一个项目上节省几个小时，那么手工编码就不再是更便宜的选择了。\n\
  \n为了熟练掌握手工编码，你需要培养高水平的专业技能。手工编码网站的专业设计师必须非常熟悉他们设计所用的程序或标记语言。如果你选择了这种方法，你也需要如此。否则，你会发现自己不断研究、查阅资料、尝试这个、尝试那个——花费过多时间才能把事情做对。\n\
  \n在决定是手工编码还是使用网页设计程序时，请记住，你花在学习、研究和测试页面上的时间会迅速累积。手工编码多花的时间很快就会让你的项目超出预算和截止日期。\n\n\
  **Dreamweaver 是一根拐杖**\n\n许多手工编码者说，Dreamweaver 的用户变得过于依赖所见即所得界面和其他自动化工具。他们并没有真正学会（或者忘记了）如何使用\
  \ HTML 和 CSS 代码。在列出的这些理由中，这一条最有道理。你可能会变得过于依赖程序，从而阻碍了你在学习 HTML、XHTML、CSS 以及任何其他标记或编程语言（就此而言）实际工作原理方面的成长。\n\
  \n但很少有事情（网页设计尤其如此）是那么一成不变的。这个论点忽略了一个非常重要的因素：人性。虽然我们可能生而平等，但在能力和性情方面，我们并不相同。经过多年设计网站、与许多专业人士合作以及教授设计，我有不同的看法。\n\
  \n通常，偏好手工编码的专业人士是从左脑、更逻辑、开发或编程的角度来创建网站的。他们发现将项目分解成小的、分析性的片段，然后用代码将这些片段拼接起来更容易。另一方面，使用所见即所得软件的专业人士通常倾向于从更右脑、视觉、设计的角度工作。就像世界上几乎所有其他事物一样，网页设计世界需要这两种类型的专业人士。\n\
  \n我们就不能和睦相处吗？当然可以。我们一直都在这样做。例如，大型设计公司和大型企业的设计部门通常同时雇用这两种类型的网页设计师，他们一起工作。所见即所得设计师专注于网站的实际外观和感觉，即视觉方面，如主题、布局、按钮、信息流等。网站的这些元素通常被称为前端。手工编码者（通常是程序员）则负责网站的后台或后端功能，如数据库集成、购物车和其他应用程序。\n\
  \n![tip.eps](img/tip_opt.jpeg) 许多程序会将其原生文档格式导出或转换为 HTML 和 XHTML。例如，Microsoft Office\
  \ 套件中的程序——特别是 Word、PowerPoint 和 Excel——都有“另存为 HTML”选项。这些程序以及大多数其他并非真正网页设计程序的程序，通常会对\
  \ HTML 标签和层叠样式表（CSS）造成严重破坏。这些程序生成的复杂样式表和其他代码可能会让移动浏览器崩溃。（Word 的 HTML 输出是出了名的混乱，以至于\
  \ Dreamweaver 自带了一个特殊的导入选项，专门用于从 Word 导出的 HTML 文件中剔除垃圾标签。）所以，帮自己一个忙：甚至不要考虑使用那些试图将其原生内容转换为\
  \ HTML 来创建移动网页内容的程序。\n\n手工编码的一个长期优势是——如果你强迫自己手工编码——一段时间后，你会很好地掌握 HTML 和 CSS。非常熟练。可能比完全依赖\
  \ Dreamweaver 要好得多——因为当你以所见即所得模式工作时，Dreamweaver 会为你编写大部分代码。我发现手工编码和所见即所得编辑之间来回切换是最有效的方法（就效率而言）。\n\
  \n我认识的许多专注的手工编码者都说手工编码更容易。我相信对他们来说确实更容易。但我也相信，从头到尾手工编码整个网站需要一种特殊的头脑和极大的耐心。许多人觉得这太繁琐和耗时——既然使用舒缓优雅的电动剃须刀更轻松（也更不痛苦），为什么还要用一块钝玻璃片来刮胡子呢？\n\
  \n本书中的大多数示例都是手工编码的——不是因为这是我的工作方式，也不是因为我认为你应该这样工作，而是因为这本书是关于学习使用 HTML 和 CSS，而不是使用\
  \ Dreamweaver。尽管如此，正如本章后面所示，Dreamweaver 是一个强大的网页设计工具，值得你考虑。如果你想学习 Dreamweaver，我建议你查阅\
  \ Janine Warner 的《Dreamweaver CS5 For Dummies》。\n\n**Dreamweaver 的名声不好吗？**\n\n专注的手工编码者普遍抱怨的是，Dreamweaver\
  \ 有自己的做事方式，并且经常不符合第 1 章和第 2 章讨论的公认 W3C HTML、XHTML 和 CSS 标准。抱怨在于 Adobe 的所见即所得编辑器并不总是使用\
  \ W3C 首选的标签和标签属性，并且经常使用过多的标签或错误的语法来实现特定任务。\n\n曾几何时，不符合 W3C 标准对 Dreamweaver 来说是一个相当严重的问题——但那已经是几个版本之前的事了。在那些日子里，手工编码者的抱怨是有道理的。自从几年前从\
  \ Macromedia 收购该程序以来，Adobe 在扭转局面方面做得很好；现在 Dreamweaver 的代码相当干净。\n\n在为移动设备设计时，精确性至关重要，不符合标准的代码可能会带来麻烦。无论你决定手工编码、使用\
  \ Dreamweaver 还是结合两种方法，作为移动网页设计师，你都有充分的理由关注标准的符合性。然而，依我拙见，不符合标准已不再是拒绝使用 Dreamweaver\
  \ 的合理理由。事实上，Adobe 一直是设计标准制定的主要参与者——在许多方面都是如此。\n\n**使用源代码编辑器进行手工编码**\n\n源代码编辑器是专为编写和编辑代码而设计的程序。它们本质上是带有编程特定附加功能的文本编辑器。手工编码者——即使是最硬核的——也使用它们来编写计算机程序以及创建网站和\
  \ Web 应用程序。源代码编辑器有各种形状和大小。大多数专注于一种或几种语言。有几个（而且有很多可用的）专门针对 HTML、XHTML 和 CSS，以及其他网页标记和\
  \ Web 特定编程语言。\n\n在可用的数百种源代码编辑器中，大多数价格从免费到 100 美元以上不等。大多数已经存在相当长的时间了。（许多是支持不佳的免费软件和共享软件，不再定期升级——导致它们过于陈旧，不太适合手工编码那些不断变化的标记语言。所以要谨慎选择。）\n\
  \n源代码编辑器在功能和支持的语言方面差异很大。图 4-2 展示了一个流行的 HTML 友好型源代码编辑器 UltraEdit 的运行情况。然而，大多数都有一些共同的标准功能：\n\
  \n\n\n\n\n![check.png](img/check.png) 行号：每一行都带有编号，便于定位和修正问题。在报告错误时，程序编译器、测试环境甚至某些网页浏览器通常会根据问题代码所在的行来识别错误。\n\
  \n![check.png](img/check.png) 颜色编码：不同的颜色用于标识程序或 HTML 文档的不同特性。在网页中，不同类型的标签、标签属性、注释、正文文本以及页面的所有其他部分在屏幕上以各自独立的颜色显示，使它们更易于查找、识别和相互区分。\n\
  \n![check.png](img/check.png) 自动标记：能够选中一行或一段文本，并通过一次点击应用标签。\n\n![check.png](img/check.png)\
  \ 标签列表：可从列表中分配的所有标签的完整列表。\n\n![check.png](img/check.png) 错误报告：能够查找并高亮显示代码中的错误。\n\
  \n![check.png](img/check.png) 代码提示：有时称为代码补全，某些代码编辑器中的代码提示功能会在你输入代码时进行监视，并尝试判断你正在输入的内容。程序会显示“提示”，你随时可以接受（通常按\
  \ Enter 键），代码便会自动补全。某些源代码编辑器还会自动闭合代码对。当你输入 `</` 时，程序会查找最后一个未闭合的标签并输入相应的闭合标签。（这听起来似乎帮助不大，只是为你输入了几个字符。但如果你正在编写成百上千行代码，这些节省的时间就会累积起来。）\n\
  \n**图 4-2：** 适合 HTML 的 UltraEdit 源代码编辑器。\n\n![9781118026229-fg0402.eps](img/9781118026229-fg0402_opt.jpeg)\n\
  \n## 了解 HTML/CSS 源代码编辑功能\n\n最流行的 HTML 源代码编辑器之一是 UltraEdit。它是一款共享软件，在紧跟 Web 技术、HTML\
  \ 和 CSS 的变更以及其他 Web 专用编程和标记语言的发展方面做得非常出色。UltraEdit 拥有许多使手工编码更轻松的功能。\n\nUltraEdit\
  \ 及其同类软件几乎已经接近所见即所得的边缘，尽可能接近但并未真正迈出最后一步——让你在所见即所得视图下直接编辑实际页面文件。此时，程序本身开始决定使用哪些标签，你便不再进行手工编码。\n\
  \n基于此，以下是你应在用于创建和编辑 HTML 及 CSS 网页的源代码编辑器中寻找的功能列表：\n\n![check.png](img/check.png)\
  \ 标签和代码语法检查：优秀的源代码编辑器会自动检查标签的放置方式和位置，并在使用不正确时指出问题。一个常见的例子是当标签未正确闭合（`</p>`）时进行提示。\n\
  \n![check.png](img/check.png) 支持 JavaScript 及其他流行的 Web 脚本语言：通常，网站的大部分功能不仅仅依赖于简单的\
  \ HTML 和 CSS 编码。例如，动画下拉菜单、可折叠（手风琴式）和选项卡式部分通常依赖 JavaScript。（JavaScript 在第 3 章中介绍，并在本书多处讨论。第\
  \ 13 章和第 14 章介绍了如何使用 JavaScript 创建特定应用程序。）第 5 章讨论的移动设备检测和切换到相应设备配置文件，通常依赖于 JavaScript（第\
  \ 13 章讨论）、PHP 或 CGI 脚本。你的源代码编辑器应具备对这些语言的基本支持，这样你就不必使用多个编辑器。\n\n![check.png](img/check.png)\
  \ 用于自动化冗长或重复任务的宏：许多程序支持宏，即使它们有时会使用其他名称。例如，Photoshop 称之为动作；Microsoft Word 称之为宏。无论名称如何，它们都是包含连续程序命令和任务的脚本。你可以通过依次记录任务来创建它们，然后通过鼠标单击或键盘快捷键来播放。\n\
  \n![check.png](img/check.png) 频繁升级：确保你选择的源代码编辑器仍得到良好支持，并定期升级以符合最新的 HTML 和 CSS 标准。\n\
  \n![check.png](img/check.png) 浏览器预览：你的源代码编辑器应内置预览器，以便你轻松查看页面的外观，或者至少能快速跳转到系统中的浏览器并在其中预览文件。\n\
  \n![check.png](img/check.png) 项目或文件组：能够将文件组定义为项目，这对于创建整个网站非常有用。\n\n## 终极源代码编辑器\n\
  \n我所知道的最好的源代码编辑器（我发誓我不为 Adobe 工作）是 Dreamweaver。如图 4-3 所示，你可以在程序的“代码”或“拆分”模式下工作，而无需在“设计”模式的所见即所得编辑器中执行任何操作。除了支持上一节中的所有功能外，它还有许多其他功能使手工编码更轻松，例如自动标签闭合和代码提示——它会为你建议并输入标签和其他代码。\n\
  \n**图 4-3：** 处于代码编辑模式下的 Dreamweaver，这是一款功能强大的源代码编辑器，具有许多使手工编码更轻松的功能。\n\n![9781118026229-fg0403.eps](img/9781118026229-fg0403_opt.jpeg)\n\
  \n## 一个永远不够\n\n大多数源代码编辑器并不昂贵（UltraEdit 在 30 天试用期后大约 60 美元）。即使你使用所见即所得的网页设计软件，你也会发现合适的源代码编辑器很有用。例如，UltraEdit\
  \ 的拼写检查器在标签和程序代码之间穿梭检查页面内容拼写方面比 Dreamweaver 的拼写检查器好得多。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 没有程序是完美的。在 Dreamweaver 中，你可以将你的源代码编辑器设置为辅助编辑器，这样你就可以快速跳转到它进行特定类型的编辑，例如拼写检查。只需转到\
  \ Dreamweaver 的“首选项”对话框，如图 4-4 所示（Windows 下为“编辑”⇒“首选项”，Mac 下为“Dreamweaver”⇒“首选项”）；在“类别”列表中选择“文件类型/编辑器”；在“在代码视图中打开”字段中输入你想要编辑的文件类型；然后点击“外部代码编辑器”字段旁边的“浏览”按钮，浏览并选择源代码编辑器的可执行程序文件。\n\
  \n你永远不知道何时会用到一款好的源代码编辑器（以及知道如何使用它）。不止一次——在咨询或与其他设计师合作时——我被要求不要用 Dreamweaver 处理他们的文件。很久以前我就明白，有时最好还是别去惊动睡着的狗。\n\
  \n在选择源代码编辑器时，请记住这一点：一款好的源代码编辑器不会对你的文件进行任何更改，除非是你手动输入的更改。句号。\n\n**图 4-4：** 在 Dreamweaver\
  \ 中将源代码编辑器设置为备用代码编辑器。\n\n![9781118026229-fg0404.eps](img/9781118026229-fg0404_opt.jpeg)\n\
  \n## 设计软件的优势\n\n网页设计软件最明显的优势在于，你可以在进行编辑时实时看到效果。软件会为你重写 HTML 并更新 CSS 规则。正如本章前面所讨论的，并非所有人都认为这是一个优势。使用设计软件的目的当然是为了让你的设计项目更轻松，从而节省时间（以及你的理智）。大多数网页设计程序——例如\
  \ Back to the Beach Software 的 Web Studio 或 Virtual Machine 的 SiteSpinner——严重依赖内置模板和预设计的页面模块，使设计者（通常是初学者或偶尔从事网站工作的人）与实际代码隔离开来。\n\
  \n\n\n\n\n这种方法的问题在于，尤其是从移动设计角度来看，虽然它们易于使用，但它们生成的代码很少能足够简洁或精简以适应移动设备。更糟糕的是，在这些程序中获取代码本身往往是一个挑战。它们实际上围绕着一个单一概念——易用性——而设计，并不利于为移动设备创建或改造网站。此外，使用它们对提升你的\
  \ HTML 或 CSS 技能几乎毫无帮助。\n\n## 使用 Adobe Dreamweaver\n\n接下来是 Dreamweaver，这是大多数网页设计专业人士的首选应用程序。从易用性的角度来看待\
  \ Dreamweaver 其实并不相关。你选择如何使用它决定了其难度级别。这个程序几乎无所不能，甚至更多。它也是仅存的高端网页设计程序——而且，由于它是 Adobe\
  \ 的产品，它与 Adobe 流行的图形编辑器 Photoshop 和 Illustrator 以及用于创建动画和应用程序内容的极受欢迎的平台 Flash 都集成得很好。\n\
  \nDreamweaver 不仅是一个所见即所得的页面编辑器；它还是一个功能强大的源代码编辑器。你可以选择在设计模式下工作，在页面的所见即所得视图中进行编辑，或者你也可以在代码视图中专门进行手工编码。Dreamweaver\
  \ 甚至还有一个拆分视图，允许你同时在所见即所得和代码视图中处理页面，如图 4-5 所示。\n\n## Dreamweaver 与 CSS\n\n除了其直观的编码和布局工具——例如用于检查代码错误的标签检查器，以及无需离开设计环境即可显示和播放\
  \ Flash 及其他媒体文件的实时视图——Dreamweaver 对 CSS 样式的支持非常出色。它允许你轻松创建全站样式表和模板，使你的页面适应多种设备，并轻松应用\
  \ JavaScript 和其他支持代码。当你打开一个用 CSS 格式化的页面时，Dreamweaver 会引用所有对应的样式表，在设计视图中渲染页面。当你对不同对象进行更改时，程序会显示相应的代码，并提供创建新\
  \ CSS 规则或修改现有规则的选择，如图 4-6 所示。\n\n**图 4-5：** 在 Dreamweaver 中，你可以选择手工编码或在设计视图中工作——或者同时进行。\n\
  \n![9781118026229-fg0405.eps](img/9781118026229-fg0405_opt.jpeg)\n\n**图 4-6：** Dreamweaver\
  \ 使得编辑现有样式或创建新样式变得容易。\n\n![9781118026229-fg0406.eps](img/9781118026229-fg0406_opt.jpeg)\n\
  \n## 功能强大的源代码编辑器\n\n该程序有一个实时代码选项，当在拆分视图中工作时，它会高亮显示在设计窗口中所做的更改，并实时更新代码窗口，为你提供宝贵的工作反馈。还有一个代码提示选项：当你在拆分视图或代码视图中手工编码时，程序会尝试推断你正在输入的标签，并在提供可用代码选项时持续更新。你可以随时选择让程序为你完成代码。\n\
  \n你可以在检查视图中浏览文件，在设计窗口中选择各种对象，Dreamweaver 会在代码窗口中显示相应的 CSS 代码，同时检查其错误和标准合规性。每次保存文件时，程序都会提醒你代码错误或不一致之处。\n\
  \n如你所见，除了使设计过程变得简单之外，如果你愿意，该程序还可以帮助你学习 HTML、CSS 以及其他多种语言。而这份清单只是 Dreamweaver 如何帮助你创建和维护\
  \ CSS 页面及网站的一个很小的示例。它确实自动化了许多流程——并为你跟踪各种事项。\n\n## Dreamweaver 扩展、小部件和代码片段\n\n再次强调，使用\
  \ Dreamweaver 而非手工编码的主要原因是为了节省时间（以及减少烦恼，尽管学习如此强大的程序本身也有其固有的挫折感）。虽然手工编码页面是一项崇高甚至令人钦佩的努力，但在预算内按时完成项目也有很多值得称道之处。本节前面的副标题探讨了程序的内置功能如何帮助你做到这一点，但\
  \ Dreamweaver 还支持多个第三方附加组件，称为扩展，它们可以极大地帮助你以创纪录的速度创建专业质量的页面和页面元素。\n\nDreamweaver\
  \ 还提供了多种将预构建内容部署到页面中的方法；这些包括小部件和代码片段。小部件实际上是可自定义的微型应用程序，而代码片段正如其名——你可以保存并在需要时使用的小块代码。\n\
  \n### 扩展\n\n与大多数 Adobe 程序一样，Dreamweaver 支持第三方扩展。扩展是通过扩展管理器安装到 Dreamweaver 中的小程序。你可以在\
  \ Dreamweaver Exchange（从“帮助”菜单中选择“Dreamweaver Exchange”）或互联网上的其他几个地方找到扩展。有些是免费的，其他则是第三方产品，价格从几美元到几百美元甚至更高。只需搜索\
  \ Dreamweaver 扩展即可。\n\n你会发现几乎无所不能的扩展——从为你的网站创建搜索引擎和插入 Google 地图，到创建完整的 CSS 页面模板。有数百个，甚至数千个\
  \ CSS 模板扩展，用于创建可自定义的页面元素，如下拉菜单、表单、页眉和页脚等。扩展可以为你节省大量时间，并且生成的代码为学习如何创建和自定义特定的 CSS\
  \ 页面元素和效果提供了绝佳的机会。图 4-7 显示了一个用于创建 CSS 菜单的扩展。\n\n### 小部件\n\n小部件是预先制作好的、可自定义的页面元素，通常由\
  \ CSS 样式和 JavaScript 组成。Dreamweaver 自带一组内置小部件，用于创建菜单、可折叠部分、用户身份验证字段以及许多其他对象。你还可以从\
  \ Dreamweaver Exchange 导入多个第三方小部件。（小部件由 Dreamweaver 用户创建并提供，通常是免费的。）有用于创建菜单、实时 Google\
  \ 地图、弹出对话框、图表数据等的小部件，并且定期会有新小部件可用。图 4-8 显示了一个小部件，它可以创建 Google 地图并自动将其插入到网页中。\n\n\
  **图 4-7：** Dreamweaver 扩展几乎可以做任何事情（这个扩展创建了 CSS 格式的弹出菜单），而无需你编写代码。\n\n![9781118026229-fg0407.eps](img/9781118026229-fg0407_opt.jpeg)\n\
  \n**图 4-8：** 你可以使用这个小部件创建 Google 地图并将其插入到网页中。\n\n![9781118026229-fg0408.tif](img/9781118026229-fg0408_opt.jpeg)\n\
  \n### 代码片段\n\n代码片段是你可以保存并在需要时使用的代码块。Dreamweaver 自带多个用于常见元素的片段，如下拉菜单、表单字段以及其他几个对象——而且你可以轻松创建并保存自己的片段。例如，当你创建了一个喜欢的对象，或者从小部件或扩展中生成了一个对象，你可以将该代码保存在“片段”面板中。当你想使用该片段时，只需将光标放在文档中并单击“插入”按钮即可。图\
  \ 4-9 演示了如何使用一个片段在网页上放置一个表单下拉菜单。\n\n![tip.eps](img/tip_opt.jpeg) 即使你不使用 Dreamweaver，也应该考虑保留一个代码片段库；这样你就不必在每次需要常用页面元素时重新编写代码。你可以将片段保存在静态文本文件中，或者使用像\
  \ Microsoft Notes 这样的剪贴簿程序来保存和组织你的片段。\n\n**图 4-9：** 不要重复造轮子；将一些代码保存为 Dreamweaver\
  \ 片段，并在需要时重复使用。\n\n\n\n\n\n![9781118026229-fg0409.eps](img/9781118026229-fg0409_opt.jpeg)\n\
  \n## 使用 Dreamweaver 的多屏视图\n\n为不同设备复用同一网站的方法之一是为每种设备创建单独的样式表文件，如第 5 章和第 6 章所述。例如，你可以为手机创建一个样式表，为平板电脑创建另一个，再为电脑创建第三个。然后，为了查看页面在各种设备上的显示效果，你可以去购买每种设备。比如在平板电脑类别中，你可以买一台\
  \ 10 英寸的 iPad 和一台 7 英寸的三星 Galaxy Tab……\n\n好吧，显然这种方法行不通。你能想象得买多少部手机吗？另一种选择是使用 Dreamweaver\
  \ 的多屏功能，它允许你在不同的屏幕显示尺寸下查看网页的不同版本，如图 4-10 所示。多屏功能不仅能让你看到页面在不同分辨率下的效果，你还可以使用多屏面板中的“媒体查询”选项为每种显示选项选择不同的\
  \ CSS 样式表：只需设置屏幕宽度和对应的 CSS 文件即可。\n\n**图 4-10：** Dreamweaver 的多屏选项可在多种分辨率下显示页面，每种尺寸都使用自己的\
  \ CSS 文件进行格式化。\n\n![9781118026229-fg0410.tif](img/9781118026229-fg0410_opt.jpeg)\n\
  \n## 了解 Adobe Device Central\n\nAdobe Device Central 是一个实用程序，用于将 Adobe 应用程序内容（如\
  \ Dreamweaver 网页或 Flash 影片）创建并转换为移动设备内容。本质上，该程序是一个庞大的移动设备数据库和设备模拟器（设备模拟器在第 4 章中讨论）。它包含了几乎所有曾经制造过的移动设备的配置文件和关键信息，至少是那些具备基本互联网能力的移动设备。Device\
  \ Central 将你将要设计的移动设备的所有关键信息——显示尺寸、内存、支持的 CSS 版本、支持的内容——汇集于一处。此外，你还可以测试你的内容，看看它在任何或所有设备上的显示效果。\n\
  \n遗憾的是，你无法购买该程序的独立版本。不过，如图 4-11 所示的 Device Central 随大多数主要 Adobe 产品（CS4 及更高版本）一起提供，例如\
  \ Dreamweaver、Photoshop、Illustrator、Flash Professional 等。在我看来，如果你正在为移动设备进行设计，即使你不使用\
  \ Dreamweaver 创建网页，仅为了获得 Device Central 而购买 Dreamweaver（零售价约 200 美元）也是值得的。你找不到比\
  \ Device Central 更全面的模拟器来源和关于你所设计的移动设备的信息——至少无法在电脑上安装这样的工具。而且，它由 Adobe、Adobe 产品用户以及设备制造商本身持续更新。\n\
  \n**图 4-11：** Device Central 让你能够在几乎所有可用移动设备的模拟器中测试你的网站。\n\n![9781118026229-fg0411.tif](img/9781118026229-fg0411_opt.jpeg)\n\
  \n第 5 章讨论了基于移动设备类别创建移动网站。（第 5 章还介绍了如何使用 Device Central 帮助你设置移动设备类别。）Device Central\
  \ 的一个非常实用的功能是，它可以创建相似设备——或具有相似屏幕尺寸和功能的设备——的测试组，然后测试你的移动网站内容在每个组中的表现。\n\n## 使用浏览器作为测试环境\n\
  \n要测试你的网站在各种可用移动设备上的效果，唯一万无一失的方法是拿到每台设备，然后在每台设备上打开网站，查看其显示和性能。像 Dreamweaver 和 Device\
  \ Central（本章前面讨论过）这样的工具有所帮助，但它们无法测试所有内容——而且它们绝非完全准确。事实上，你无法在所有移动设备上查看你的网站，也无法确切知道它在每台设备上的显示和性能表现。\n\
  \n除了本章前面讨论的 Dreamweaver 多屏功能和 Adobe Device Central 之外，还有许多其他工具可供你使用。好消息是，其中大部分都是免费且易于获取的。例如，你可以使用在线移动设备模拟器。你也可以将网页浏览器用作移动设备模拟器和测试环境。你只需安装一些浏览器附加组件（也称为扩展）即可。\n\
  \n在我撰写本文时，两款流行的浏览器——开源 Mozilla Firefox 和 Google 的 Chrome——拥有相当丰富的附加组件，用于编辑代码、模拟移动设备以及测试\
  \ HTML 和 CSS 代码。Firefox 存在时间最长，选项范围更广，但 Chrome 也不甘落后，并且正在迅速追赶。\n\n让我们看看一些可用的附加组件，如何找到并安装它们，它们的功能以及如何帮助你。\n\
  \n### 查找并安装 Firefox 附加组件\n\n无论你使用 Windows 还是 Mac OS，你的电脑都不会预装 Firefox。在向 Firefox\
  \ 安装附加组件之前，你当然需要先安装 Firefox 本身。一段时间以来，最新版本的 Firefox 安装文件都可以在 `http://www.mozilla.com/en-US/firefox/new/`\
  \ 获取。\n\n如果出于某种原因，Mozilla 团队决定移动 Firefox 文件，你始终可以通过在 Google 中搜索“Mozilla Firefox”来找到它。进入下载页面后，只需单击“下载\
  \ Firefox”按钮并按照安装说明操作即可。\n\n### 浏览器附加组件能为你做什么？\n\n你知道你有一个代理吗？嗯，实际上，准确地说，它是一个用户代理——更精确地说，它是你的浏览器。当你浏览一个网站时，你的浏览器会向服务器自我介绍，告诉服务器它所知道的一切，如下图所示。\n\
  \n![9781118026229-sb0401.tif](img/9781118026229-sb0401_opt.jpeg)\n\n用户代理（在第 4 章和第\
  \ 6 章中讨论）对你——移动网页设计师——来说非常重要。用户代理与 Web 服务器的交互通常（取决于你如何设计页面）决定了哪些文件和哪些 CSS 样式表被传送到浏览器。最流行的浏览器附加组件之一是\
  \ User Agent Switcher——顾名思义，它允许你伪装成不同的用户代理打开网站。\n\n为什么？当你将 User Agent Switcher 与其他浏览器附加组件结合使用时，这有助于你了解页面在移动设备上的外观和行为。例如，在第二张图中，我将用户代理切换为\
  \ iPhone 3.0，启用了另一个名为 Small Screen Renderer 的 Firefox 附加组件，然后启用了另一个名为 Firebug 的插件。使用\
  \ Firebug，我可以检查页面的各种信息，查看用于格式化页面的 CSS 文件，并直接编辑代码。\n\n![9781118026229-sb0402.tif](img/9781118026229-sb0402_opt.jpeg)\n\
  \n如你所见，使用免费的网页浏览器和免费的附加组件可以为你的移动设备页面提供一套相当方便的编辑和测试工具。\n\n安装 Firefox 后，查找附加组件变得轻而易举。只需按照以下步骤操作：\n\
  \n1. 启动 Firefox，单击“工具”菜单，然后选择“附加组件”。\n2. 在“附加组件”对话框中，单击“获取附加组件”。\n3. 使用搜索字段（按钮下方）搜索特定的附加组件，或单击“浏览所有附加组件”链接，进入列出所有\
  \ Firefox 附加组件的页面。\n\n按照上述查找附加组件的步骤操作后，你可以像这样在 Firefox 中安装它们：\n\n1. 单击“添加到 Firefox”按钮。\n\
  2. 在“软件安装”对话框中，单击“立即安装”按钮。\n\n当附加组件完成安装后，Firefox 会返回到“附加组件”对话框。你需要重新启动 Firefox 才能使用新的附加组件。\n\
  \n3. 单击“重新启动 Firefox”按钮。\n\n### 查找并安装 Google Chrome 附加组件\n\n\n\n\n\n# 安装 Chrome\
  \ 及其插件\n\n无论您使用的是 Windows 运行 Windows 还是 Mac OS，您的计算机在出厂时都没有预装 Chrome。因此，在安装 Chrome\
  \ 插件之前，您（当然）必须先安装 Chrome 浏览器本身。您可以在 [`www.google.com/chrome/`](http://www.google.com/chrome/)\
  \ 找到最新版本的 Chrome 安装文件。\n\n进入下载页面后，只需点击“下载 Chrome”按钮并按照安装说明进行操作即可。\n\n安装好 Chrome\
  \ 后，您可以按照以下步骤寻找插件（Google 将其称为“扩展”）：\n\n1. 点击应用程序窗口右上角的 `Options`（扳手图标）。\n2. 从弹出菜单中选择\
  \ `Tools`，然后选择 `Extensions`。\n3. 在扩展网页上，点击 `Get More Extensions` 链接。\n4. 使用 Chrome\
  \ 网上应用店网页右上角的搜索框，或从页面左侧侧边栏的扩展列表中选择一个类别。\n\n![tip.eps](img/tip_opt.jpeg) 您可以尝试选择“Web\
  \ Development”（Web 开发）。但请注意，在我撰写本文时，该列表并不完整。我必须通过搜索才能找到许多我需要的插件。\n\n找到您喜欢的插件后，请按照以下步骤安装：\n\
  \n1. 当您找到想要安装的扩展时，点击它。\n这将带您进入一个描述该插件的页面。您应特别关注安装按钮下方名为 `This extension can access`（此扩展可以访问）的小黄框。它会告知您安装该插件可能带来的安全问题。\n\
  2. 点击安装按钮。\n\n就这样，插件就安装完成了。\n\n## 对 Web 开发人员有用的插件\n\n适用于 Firefox 和 Chrome 的 Web\
  \ 开发插件列表非常广泛且在不断增加。许多插件的功能相同或有所重叠。以下是我认为最有用的一些插件列表（大多数在两种浏览器中均可用；不可用的已在文中注明）：\n\n\
  - ![check.png](img/check.png) `User Agent Switcher`：此扩展允许您“伪装”特定的用户代理（User Agent）。如果您不知道什么是用户代理，请参阅随附的侧边栏“浏览器插件能为您做什么？”。基本上，这个插件会告诉\
  \ Web 服务器，您不是一个使用标准 Web 浏览器的计算机。例如，您可以将用户代理切换为 `iPhone 3.0`。\n- ![check.png](img/check.png)\
  \ `Modify Headers`：当您浏览网站时，浏览器会向 Web 服务器发送一系列标头（Headers）。标头包含有关浏览器以及（在移动设备上）设备本身的信息。与\
  \ `User Agent Switcher` 类似，修改标头可以告诉 Web 服务器您是其他设备。例如，您可以修改标头以告诉 Web 服务器您是某种特定类型的移动设备或移动浏览器。\n\
  此插件在 Chrome 中不可用。不过，Chrome 自带了 `Developer Tools`（开发者工具）选项，允许您修改标头。要访问它，请点击应用程序窗口右上角的扳手图标，选择\
  \ `Tools`，然后选择 `Developer Tools`。\n- ![check.png](img/check.png) `Live HTTP Headers`：此插件简单地让您查看浏览器和服务器之间交换的标头，这有助于告诉您使用\
  \ `Modify Headers` 插件需要修改哪些标头。此插件在 Chrome 中不可用。不过，Chrome 内置的 `Developer Tool`（在之前的\
  \ Modify Headers 小节中讨论过）具有类似功能。\n- ![check.png](img/check.png) `Small Screen Renderer`：此插件的功能正如其名。它以类似移动设备的小尺寸格式渲染并显示网页内容。此插件在\
  \ Chrome 中不可用。\n- ![check.png](img/check.png) `Firebug`：`Firebug` 实际上是一组插件，允许您查看和分析网页的多个方面，包括所有内部和外部样式表，或者图像、视频或\
  \ Flash 内容的格式——这仅是其中几个选项。`Firebug` 还具有 `Edit`（编辑）模式，允许您直接修改网页。\n- ![check.png](img/check.png)\
  \ `CSS add-ons`：除了这里列出的插件外，两种浏览器都有几个专门用于检查和修改层叠样式表（CSS）的 CSS 插件。有些非常有用，有些则毫无用处。要找到它们，只需在前面提到的浏览器内置插件（或扩展）搜索页面中搜索\
  \ `CSS` 即可。\n\n# 安装测试 Web 服务器\n\n无论您是在 Dreamweaver 中创建网页还是手动编写代码，您都需要经常查看并测试页面以及网站的功能。您可以通过不断地将更改后的页面和支持文件上传到远程\
  \ Web 服务器来实现；然而，大多数设计师发现，使用本地测试服务器（有时称为测试床）要简单、快速且方便得多。\n\n如果您使用 Dreamweaver，该程序可以自行测试\
  \ HTML、XHTML、CSS、嵌入视频、Flash 动画以及其他几种网页功能的绝大部分内容。然而，有些东西（例如对移动网站设计至关重要的服务器端 `PHP`\
  \ 脚本）是 Dreamweaver 无法测试的。此外，不同的浏览器对某些内容的处理方式不同，没有什么能真正替代在浏览器中查看页面实际显示效果的方法。\n\n\
  目前有许多可用的共享软件 Web 服务器，支持 Windows 和 Mac OS。我和我的许多同事使用由 apachefriends.org 开发和维护的 `XAMPP`。您可以访问\
  \ [`www.apachefriends.org/en/xampp.html`](http://www.apachefriends.org/en/xampp.html)\
  \ 了解相关信息并下载。\n\n其在线安装和设置指南非常出色。`XAMPP` 易于使用，且在不需要时易于关闭。如果出于某种原因您选择使用其他软件，请务必选择能够模拟\
  \ UNIX 及其衍生版本（如 `Linux`、`RedHat`、`Mandrake` 等）的 `Apache` Web 服务器的软件。为什么？因为这将使您与目前在运行的约\
  \ 90% 的 Web 服务器兼容。\n\n您还应确保该软件附带 `MySQL`，同样是为了兼容性问题，而且我们在本书的第 16 章和第 17 章中使用 `MySQL`\
  \ 来设置移动购物篮和移动博客。\n\n## 配置您的测试床\n\n安装好 Web 服务器软件后，从现在起，您应该在服务器的公共文档文件夹中创建您的网站（至少是那些您在开发过程中想要测试的网站）。在\
  \ `Apache` Web 服务器上，网站是从 `htdocs` 文件夹提供的，如图 4-12 所示。为每个站点创建一个单独的文件夹。\n\n**图 4-12：**\
  \ 在您的新测试服务器中创建所有新网站。\n\n![9781118026229-fg0412.eps](img/9781118026229-fg0412_opt.jpeg)\n\
  \n## 使用您的 Web 服务器\n\n要在您的新测试床上测试页面和网站功能，只需打开浏览器并输入 URL。您工作站或本地机器上的 Web 服务器 URL 始终以\
  \ `localhost` 开头，这是服务器的根目录。只需在 `localhost` 后面加上包含本地 Web 文件的目录，如下所示：\n\n`http://localhost/myWebFiles/filename.extension`\n\
  \n如果该文件是主页或站点的第一个页面 `index.extension`，则不需要文件名。它看起来像这样：\n\n`http://localhost/myWebFiles/`\n\
  \n关于主页为何命名为 `index.extension` 以及如何命名，将在第 6 章中讨论。\n\n## 在 Dreamweaver 中设置测试服务器\n\n\
  并非所有 Dreamweaver 网站都需要本地测试服务器。如果您的页面仅包含静态 HTML、CSS 和 JavaScript，您可以直接在程序的 `Live\
  \ View`（实时视图）中或使用 `Preview/Debug in Browser`（在浏览器中预览/调试）选项来测试页面。Dreamweaver 还可以显示包含\
  \ Flash 内容的网页。\n\n\n\n\n只有当你使用服务器端技术（如 ASP 或 PHP）时，才需要测试服务器。在设计移动网站时，通常更倾向于使用服务器端技术来检测并选择正确的文件交付给移动设备，如第\
  \ 4 章所述。测试服务器用于处理脚本和代码，并将其转换为可在 Live View 或浏览器中显示的 HTML 输出。测试服务器的工作方式与普通网站类似，只是它实际上并不在互联网上。\n\
  \n此外，虽然本书的重点不是服务器端脚本（如 PHP），但确实在几个章节中探讨了使用简单的 PHP 脚本。例如，在第 5 章中，讨论了检测移动用户代理并使用 PHP\
  \ 选择合适的网页文件和 CSS 文件。在第 7 章中，我展示了如何使用 PHP 进行服务器端包含，并且在其他几个章节中也涉及了使用 PHP 的其他解决方案。关键是，在\
  \ Dreamweaver 中设置一个测试服务器来尝试本书讨论的一些技术并无坏处。\n\n在 Dreamweaver 中定义测试服务器的步骤因版本而异，并且与设置远程生产服务器有些相似。不过，这里我不会为每个版本重复说明，而是告诉你如何找到\
  \ Adobe 针对每个 Dreamweaver 版本的说明。准备好了吗？浏览到 Adobe 的支持网站（[`www.adobe.com/support`](http://www.adobe.com/support)），搜索“在\
  \ Dreamweaver [版本] 中设置本地测试服务器”。\n\n当进入选择服务器模型的章节时，选择 PHP MySQL。\n\n就是这样。\n\n# 第二部分：创建移动网站\n\
  \n![9781118026229-pp0201.eps](img/9781118026229-pp0201_opt.jpeg)\n\n在本部分中……\n\n\
  本部分涵盖了启动移动网站的基础知识。首先，你需要识别并分类将要为其设计网页内容的设备——如何创建你的类别或配置文件，如何创建定义，以及如何确定哪些设备被归入哪些类别。\n\
  \n在建立好移动设备类别体系后，你需要一个“检测与适配”系统，用于判断访问者使用的是哪种设备，然后将他们引导到该设备对应的网站版本。完成这一步后，你就可以开始设计网页了。\n\
  \n我偏好的方法是先设计首页（即主页），所以我们就按这个顺序来。这能让你确定网站的基本外观和感觉——即整体“设计”。完成这一步后，你就可以开始为网站创建各种模板页面了。\n\
  \n## 第 5 章：思考小、更小、最小\n\n本章内容包括\n\n![arrow](img/arrow.png) 理解手持设备与桌面设备设计的差异\n\n![arrow](img/arrow.png)\
  \ 理解智能手机与功能手机的区别\n\n![arrow](img/arrow.png) 探索移动操作系统和移动浏览器\n\n![arrow](img/arrow.png)\
  \ 介绍用户代理\n\n![arrow](img/arrow.png) 弥补移动用户界面的差异\n\n如果你热衷于小玩意，尤其是无线移动通信和娱乐设备，那么现在是一个令人兴奋的时代。苹果最近发布的\
  \ iPad，以及随之而来的大量竞争产品涌入市场，正在迅速改变我们对移动网络的认识和使用方式。这些新的平板设备——以及它们更小的兄弟，最新一代的智能手机——实际上是微型计算机，尤其是在访问和使用互联网方面。这两种技术——全功能计算机（台式机和笔记本）和无线手持设备（智能手机和平板）——正快速走向融合，注定将改变我们使用互联网的方式。\n\
  \n用不了多久，专门为移动设备创建网站的书籍和课程就会变得无关紧要。所有这些设备在使用互联网方面将不再有显著差异。技术已经存在。现在，像往常一样，只需要等待市场或消费者跟上步伐。而如果我们依靠通信技术的近期历史来预测未来，这可能需要一点时间。\n\
  \n为什么？因为最终，消费者对技术成为主流的速度有着最大的影响。为了尽可能多地覆盖消费者，网站创建的一个基本原则始终是：以最低共同标准设计。例如，设计师们多年来一直针对低分辨率、800x600\
  \ 像素（VGA）的计算机显示系统进行补偿——远超过该技术被业内大多数人（尤其是计算机制造商）视为过时的时间。信不信由你，并非所有使用计算机（或手机）的人都会对最新、最伟大的技术进步感到兴奋或受到激励。许多人——比你想象的要多得多——使用设备的时间比你想象的要长得多。此外（这对我们这些技术痴迷者来说更难相信），许多移动设备用户根本不在乎那些花哨的进步。他们宁愿省下一两百美元，买一个不能做所有事情的设备，而不会对他们新设备不能做什么或可能错过什么有任何犹豫或顾虑。想象一下！\n\
  \n如果不是这样——如果每个人都立刻跑去购买下一代设备——我们作为设计师的工作就会容易得多。作为网页设计师，你必须考虑大量使用并将继续使用不支持最新技术的手持设备的消费者。而这正是本章的重点：创建能够覆盖尽可能多移动设备用户的移动网站。你不能在不了解手持设备的情况下为它们设计。所以这就是本章的起点：告诉你需要了解移动设备的哪些信息，以及在哪里找到这些信息。\n\
  \n同样重要的是要考虑到，手持设备不是计算机，至少不是传统意义上的计算机。除了小屏幕、小内存分配和其他限制外，移动设备并不真正支持点击技术——没有鼠标。相反，它们通过按键、按钮和其他小工具（如导航滚轮或上、下、右、左方向键）进行导航。而更新、更智能的移动设备则拥有触摸屏和多点触控屏。底线是：尽管为移动设备创建网站在很多方面与为计算机设计相同，但在很多其他方面却不同。是时候了解你将为其创建内容的设备了。\n\
  \n## 不让任何移动设备掉队\n\n在我撰写本文时，根据尼尔森（最著名的跟踪此类信息的机构之一）的数据，智能手机——包括但不限于苹果的 iPhone、部分谷歌\
  \ Android 设备、部分 RIM 黑莓以及微软的 Windows Phone（也称为 Windows Mobile 7）——约占美国手机市场的 28%，欧洲市场的\
  \ 35%。这对你作为网页设计师意味着，大约 72% 的你要为其设计的设备并不支持所有最新的移动网络技术。换句话说，如果你创建一个由 HTML5、CSS3 和\
  \ JavaScript 组成的移动网站，目前使用中的大多数移动设备将无法使用该网站的部分或全部功能。\n\n\n\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 同一市场研究中的另一个有说服力的统计数据是，在 2010 年最后一个季度，所有售出的手持设备中，智能手机仅占 40%。因此，如果你曾以为可以只针对智能手机市场进行设计——指望消费者会迅速跟上——那还是算了吧。除非你愿意忽略近三分之二的移动网络用户，否则就认命去适应那些无法利用最新最先进移动技术的设备吧。我也不喜欢这样。\n\
  \n## 苹果与 Flash 之间发生了什么？\n\n除非你一直与世隔绝，否则你应该知道苹果的移动设备——iPhone、iPod 和 iPad——不支持 Adobe\
  \ Flash 网页内容。相反，苹果决定依赖更新的新兴技术，如 HTML5、CSS3 以及 JavaScript 的最新移动增强功能。虽然这里不适合讨论苹果这一决定背后的动机和营销策略，但我要说的是，这种立场不仅极大地影响了移动网站设计社区，也影响了整个网页设计社区。苹果移动设备的用户约占“智能”手持设备用户基数的近三分之一。这是一个庞大的用户群体——大到不容忽视。\n\
  \n没有人——我怀疑连苹果和 Adobe 自己也不知道——这两大技术巨头之间的这场争执最终会如何收场。最近发布的支持 Flash 的平板设备，例如三星基于 Android\
  \ 的 Galaxy Tab，以及即将从摩托罗拉、HTC、惠普等其他巨头推出的手持平板，无疑将对移动设备上 Flash 内容的未来产生重大影响。此外，请记住，Flash\
  \ 本身未来正在开发中的触摸和多点触控增强功能应该会改变现状。\n\n尽管 HTML5、CSS3 和经过改进且适合手持设备的 JavaScript 都极大地提升了设计师在不使用\
  \ Flash 时所能实现的效果，但在我看来，这些技术还不够强大到取代 Flash。问题在于，作为移动网页设计师，你该如何应对这个问题。我无法替你回答。但我可以告诉你我的做法。当我认为某个网站会从\
  \ Flash 内容中受益时，我就会使用它。访问我设计的网站的 iPhone 和 iPad 用户会明白为什么他们看不到 Flash 内容。不过，如果信息足够重要，以至于我无法合理地证明排除数百万苹果手持设备用户是合理的，那么我就不会将这些信息做成\
  \ Flash 内容。而且，坦率地说，作为一名设计师，我对这一点并不太满意。\n\n## 创建你自己的手持设备阶级社会\n\n每个人都知道刻板印象是不对的，对吧？但在为移动设备设计时，情况并非如此。事实上，这样做至关重要。考虑到目前有数百种手持移动设备型号在使用，每种型号至少有两三个版本，而每个版本又有多个固件和软件修订版……我相信你明白我的意思：在哪些设备支持哪些网页内容这个问题上，实际上有成千上万个变量。你不可能为每种不同类型的手持设备都创建一个独立的网站版本。从技术意义上进行归类——根据屏幕尺寸、支持的网页格式等类别对它们进行分类——是确保你的内容在大多数设备上看起来良好且正常运行唯一的方法。\n\
  \n## 智能手机与功能手机\n\n一般来说，手持设备市场由四种不同类型的设备组成：平板电脑、智能手机、功能手机和非智能手机。在这四种类型中，只有前三种支持网页浏览。所以，把第四种——非智能手机——抛到脑后吧。它们的用户只用来打电话和发短信；他们不是你的目标市场。剩下的是另外三种：平板电脑、智能手机和功能手机。而且，你可能已经猜到，正如智能手机和电脑之间的界限正在模糊一样，智能手机和功能手机之间的界限也在模糊。具体分类如下：\n\
  \n### ![check.png](img/check.png) 平板电脑\n\n手持平板电脑确实是令人兴奋的技术。在我写这本书的时候，几乎每个电脑和手机行业的制造商都在发布手持平板电脑。在很短的时间内，这些设备已经变得相当精密。例如，有些是平板形态的完整电脑。惠普等公司已经发布了运行完整版\
  \ Windows 的平板电脑，它们几乎可以做任何 Windows 电脑能做的事情。三星、苹果和摩托罗拉等其他公司正在销售运行最初为智能手机设计的操作系统（如\
  \ Android 和 iPhone OS）的平板电脑。\n\n在很多方面，为这些设备创建网页内容与为标准电脑设计并无不同。大多数平板电脑拥有相当大的屏幕、不错的处理器以及支持大多数高级网页内容（如\
  \ Flash、HTML5 和 CSS3）的网页浏览器。然而，并非所有平板电脑都一样。例如，Coby Electronics 和其他一些制造商销售的低端平板电脑性能并不优于普通智能手机。自第一款\
  \ iPad 发布以来的短短几年内，平板电脑领域在网页内容开发方面已经变得多样化。为了确保你的移动网站在大多数平板电脑上表现良好，你需要熟悉这类设备及其能力。\n\
  \n### ![check.png](img/check.png) 智能手机\n\n为了便于讨论，我们这样定义智能手机：智能手机支持第三方应用程序，并能与公司电子邮件、联系人和日历同步，从而充当个人数据助理（PDA）。智能手机与其他手机的区别在于，它们通常拥有更快的处理器、更大的内存，并且运行完整的操作系统。这使得应用程序开发者能够为它们创建应用程序。大量设备符合这一定义，包括\
  \ iPhone、部分 Droid 及其他基于 Google Android 操作系统的设备、部分 Windows Phone 手持设备、部分黑莓、部分 Palm\
  \ 设备，以及许多其他设备。\n\n除了大多数平板电脑之外，这一群体——我们的“上层社会、高端设备”——将拥有最强大的网页支持。然而，与任何阶级一样，也存在子类；并非所有智能手机都一样：今天上市的设备比一年前上市的设备拥有更好的互联网支持，以此类推。此外，对第三方应用程序的支持允许用户下载和安装不同的网页浏览器，而且这些设备上的浏览器通常支持插件和其他扩展功能的功能。换句话说，在我们试图将智能手持设备归入特定类别的过程中，我们实际上不能简单地将所有智能手机归为一类就完事了，对吧？\n\
  \n### ![check.png](img/check.png) 功能手机\n\n这些是低端移动手机。它们的计算能力较弱，通常比智能手机落后。虽然一些新的功能手机可以运行基于精简版\
  \ JavaScript 的简单应用程序，但它们的操作系统不支持原生应用程序，例如那些适用于 iPhone 和 Android OS 的应用程序。功能手机的网页浏览器通常很小，并且缺乏运行高级网页功能（如\
  \ Flash、CSS3 和 HTML5）的能力。\n\n你可能会认为，无法使用第三方应用程序会使功能手机的设计变得更容易。毕竟，它们使用自带的浏览器——升级的唯一途径是通过固件升级。但由于存在如此多的不同类型，拥有如此多的版本、功能和各种屏幕尺寸，将功能手机归入特定类别也确实具有挑战性。在我们开始将手持设备安排到社会等级制度中之前，首要任务是弄清楚哪些设备支持哪些功能。\n\
  \n## 了解移动操作系统和浏览器\n\n\n\n\n手持设备开发是一场针锋相对、你追我赶的军备竞赛。每当一家开发者发布更新版的移动操作系统（OS），就等于向竞争对手下了战书。每当像苹果这样的操作系统开发者推出一组新功能，谷歌、微软、RIM（黑莓）以及其他操作系统开发者就会立刻争相加入这些新功能的等效实现，并开发能让他们在竞赛中领先的新功能。如此循环往复。\n\
  \n这场军备竞赛的一个重要成果是移动浏览器技术的进步——这场战争中与你（移动网站开发者）息息相关的部分。当你搭建手持设备分类系统时，最重要的两个考虑因素是设备屏幕尺寸和浏览器能力。同样重要的还有来访手持设备支持的\
  \ Flash Player 版本（如果有的话），以及它能播放哪些数字视频格式。通常，这些能力中的许多是由操作系统本身（而非移动浏览器）定义的。其他因素包括移动服务运营商，以及它是否让设备制造商内置了一些特定于服务的功能。实际上，这真是一张错综复杂的网——一个似乎旨在让移动网站设计师抓狂的精心设计。\n\
  \n## 移动操作系统\n\n详细讨论移动操作系统——除了令人厌烦之外——可能并不会真正帮助你设计移动网站。此外，每个平台都有众多版本，而且操作系统通常是为特定设备定制的。例如，运行在功能手机上的\
  \ Android 与运行在智能手机上的 Android 具有不同的能力。更复杂的是，运行在三星 Galaxy 上的 Android 与运行在 HTC Inspire\
  \ 上的同一操作系统具有不同的能力——尽管这两款设备在技术上都是智能手机。\n\n## 从动态内容和动态移动设备配置文件创建适合手持设备的网站\n\n在移动网页设计中，就像生活中的大多数事情一样，解决问题的方法不止一种。本书重点介绍使用\
  \ HTML 创建传统的静态移动网站和页面——这是大多数网页设计师使用的方法。另一种方法——高度复杂、非常繁琐，并且（如果执行得当）最终更有效——是根据移动设备的动态配置文件创建和部署动态内容：网站旨在“即时”或按需提供内容。\n\
  \n使用这种方法，你只需创建一两个页面——除了 PHP、ASP 或 Cold Fusion 代码（包含对数据库文件的引用和一些格式化信息）之外，这些页面就是模板：可以说是空壳。在用户访问网站之前，它们不包含任何实际内容。内容保存在一个数据库中；另一个数据库保存设备配置文件或关于各种移动设备的信息。（不，你不需要自己收集所有这些信息。它可以从多个来源获得，包括开源无线通用资源文件（WURFL），本章稍后会讨论。）\n\
  \n当移动设备访问网站时，它会通过声明其用户代理来介绍自己。（用户代理将在第 3 章、本章稍后部分以及第 6 章中讨论。）然后，利用用户代理信息，一组复杂的脚本引用包含设备配置文件的数据库，获取关于设备的信息——屏幕尺寸、设备支持的\
  \ HTML 和 CSS 版本、设备是否支持 Flash 和 JavaScript 等等。有了这些信息，另一组复杂的脚本从内容数据库中引用并调用正确的内容，并确定使用哪些\
  \ CSS 样式表和其他格式化信息。呼！听起来很像魔法，不是吗？\n\n尽管这种方法能向更广泛的手持设备提供更精确格式化的内容，但实现起来很困难。它不仅需要大量工作，还需要一位非常有才华的程序员。创建这种动态网站时，HTML\
  \ 和 CSS 格式化用得不多。相反，服务器端编程（这不是本书的主题）完成了网站的大部分工作。如果你对研究这种类型的移动网站开发感兴趣，可以查阅 Andy Harris\
  \ 的《HTML、XHTML 和 CSS 傻瓜书大全》。\n\n然而，如果没有一些有限的检测与适配编程（使用客户端 JavaScript（在第 13 章讨论）或服务器端\
  \ PHP 或 ASP（在第 6 章讨论）），为手持设备创建网站会既困难又笨拙。“检测与适配”一词指的是确定向手持设备提供哪些页面和样式表的过程：你使用脚本检测用户代理和关于设备的其他信息，再用另一组脚本部署适当的页面和格式化数据。\n\
  \n我可以向你展示绕过这种基本编程要求的方法——但额外的工作和复杂的技术（甚至最终结果，会导致网站质量低劣）在我看来将是一种巨大的伤害。我们还是别谈这个了。\n\
  \n然而，这并不意味着操作系统无关紧要。手持设备通常将操作系统作为用户代理来声明，而不是浏览器类型和版本。（如第 6 章和第 13 章所述，设备声明其用户代理以开始与\
  \ Web 服务器协商。）因此，设备不会以“你好，我是 Safari 移动操作系统。你有什么给我？”开始服务器-设备事务，而是实际上说：“嗨，我是 iPhone\
  \ 3.0，一个特定设备。有什么特别为我准备的吗？”有时，主要取决于你如何配置设备检测与适配系统，手持操作系统或平台类型更有用，或者提供更多关于设备的信息。然而，正如我在第\
  \ 6 章中讨论的，这通常取决于你告诉服务器（或你的网页，当你使用客户端检测与适配时）如何处理用户代理信息。\n\n## 移动浏览器\n\n就像传统计算机上有多种\
  \ Web 浏览器可用一样，你可以在大多数平板电脑和智能手机类手持设备上下载并安装多种不同的浏览器。用户更换浏览器的原因当然很多。例如，我不使用 Internet\
  \ Explorer，因为它与我教授在线数字设计的大学要求使用的表单不兼容。我在某些移动浏览器上也遇到了类似的问题。\n\n移动浏览器之间的差异巨大，并且受许多变量影响——包括但不限于浏览器运行的设备类型。例如，运行在功能手机上的\
  \ Opera Mini 通常不支持它在智能手机上支持的相同功能。再次强调，浏览器运行的手持设备类型通常对浏览器的能力起着重要作用。确定浏览器和浏览器版本，类似于确定操作系统平台，再次对手持设备的用户代理来说很重要。换句话说，服务器或你的检测与适配脚本如何识别谁（更具体地说，是什么）正在访问网站。\n\
  \n## 查明哪些设备能做什么\n\n我绝不是主张你需要确定每台正在使用的手持设备能做什么和不能做什么。那将是，嗯，疯狂的。你当然会成为移动设备专家，但其他事情就几乎做不了了。此外，你刚了解一种设备能做什么，制造商就准备发布（比如说）新的\
  \ BIOS 或浏览器版本，使你对任何特定设备的了解在明天就过时了。但是，为了建立你的分类体系，你确实需要一个总体概念——一种将潜在用户群带到你网站的设备进行分类的方法。要做到这一点，你需要大致了解不同类型的设备能做什么和不能做什么。\n\
  \n\n\n\n你提出的任何检测与自适应系统，主要都依赖于用户代理，正如本章以及第 6 章和第 13 章所讨论的那样。换句话说，无论你是使用客户端还是服务器端脚本（同样在第\
  \ 6 章和第 13 章中讨论）来检测设备类型并决定向设备提供哪些页面和样式表，检测过程都依赖于用户代理。用户代理包含有关设备类型及其能力的信息。\n\n为了对设备进行分类，你需要了解它们能做什么和不能做什么。如何找到这些信息？好消息是，其中大部分信息都是现成的。\n\
  \n在本节中，我将向你展示如何找到这些信息。在下一章中，我将展示如何利用这些信息。\n\n## 制定分类策略\n\n当为传统计算机进行设计时，设计师通常采用“最低共同标准”策略。换句话说，他们创建网站时，会确保网站与最古老的技术和显示尺寸兼容，从而在所有计算机上都能正常显示和运行。而为移动设备设计时，通常采用相反的方法——先为功能最强大的设备设计网站，然后通过剥离功能来创建新的网站。\n\
  \n例如，初始网站可能支持最大的屏幕尺寸：HTML5、CSS3、JavaScript、Flash Player 10.x 等。然后，设计师基于原始设计，为下一类设备创建一个新网站——通常是通过降低功能复杂度、适应更小的屏幕尺寸、取消对最新标记语言的支持，并完全放弃\
  \ JavaScript。接着，根据设备分类结构的复杂程度（以及当前项目可用的时间和资源），设计师可能会再创建另一组页面，进一步剥离功能和特性。\n\n另一种方法是，从一组非常简单的页面开始，然后逐步向上添加对更高级功能和特性的支持。这两种方法都可行。但在移动设计中，行不通的是那种常用于传统台式机和笔记本电脑设计的“一刀切”方法。\n\
  \n## 无线通用资源文件（WURFL）\n\n查找特定设备、操作系统和移动浏览器信息的最常用资源之一是 WURFL——一个包含大量用户代理信息的在线数据库。设计师和开发者以多种方式使用\
  \ WURFL 信息。例如，动态检测与自适应系统的设计师（参见边栏“从动态内容和动态移动设备配置文件创建适合手持设备的网站”）会使用这个数据库（而不是自己重新创建）作为动态移动设备配置文件的来源。你可以用它来收集移动设备分类中的设备信息。\n\
  \nWURFL 的一个分支是 Tera-WURFL 网站（[`www.tera-wurfl.com`](http://www.tera-wurfl.com)），你可以在其中输入用户代理名称，然后获取关于该用户代理或设备本身的详细信息。例如，在图\
  \ 5-1 中，我输入了 iPhone 3，并获得了关于该设备的各种信息；远比我设计该手机网站所需的信息多。不过，如果我知道自己要找什么，就可以从中筛选出所需的信息。例如，“标记”部分显示了\
  \ iPhone 3 支持的 HTML 版本。另一个“显示”部分则显示了设备的屏幕尺寸，以及当用户将手机横过来时是否支持双方向（竖屏和横屏）。\n\n**图 5-1：**\
  \ Tera-WURFL 上的用户代理查询提供了关于特定设备、浏览器和操作系统的详细信息。\n\n![9781118026229-fg0501.tif](img/9781118026229-fg0501_opt.jpeg)\n\
  \n尽管 WURFL 可能是最大的用户代理数据库，但它确实存在一些缺点。例如，虽然它有一个 CSS 类别，但它只列出了有限的受支持 CSS 特性，而不是列出受支持的\
  \ CSS 版本（CSS1、CSS2 或 CSS3）。这种方法迫使你进行合理的推测。例如，如果某个设备支持 XHTML（列在“标记”下），你可以假设它也支持 CSS1\
  \ 和 CSS2。如果它支持 HTML5，那么可以安全地假设它也支持 CSS3。另一个缺点是 WURFL 的信息并不总是最新的。它严重依赖志愿者的输入。手持设备的\
  \ BIOS 和软件变更并不总能及时更新。\n\n## Adobe Device Central\n\nAdobe 的 Device Central（在第 4\
  \ 章中讨论过）可能是最全面且最易用的设备配置文件数据库。它不仅提供了关于设备支持哪些 Web 功能的详细信息，还能模拟设备，让你看到页面如何显示、哪些功能可用、数字视频、Flash\
  \ 影片和脚本在设备上如何工作，以及更多信息。你甚至可以通过查看下载时间、内存和处理器使用情况的图形表示来测试网站的性能。\n\n在 Device Central\
  \ 中，不仅各种设备易于查找和查看，你还可以按多种不同标准（如屏幕尺寸或颜色深度（可显示颜色数））对设备进行排序和列表，从而精确定位特定手持设备支持的功能。图\
  \ 5-2 显示了 Device Central 应用程序窗口的“设备库”视图。滚动此列表时，请特别注意“已发布”列。该列中的日期告诉你配置文件上传到 Device\
  \ Central 数据库的时间，这能让你大致了解信息的时效性。\n\n然而，这个非常有用的工具并非独立产品——你需要购买 Adobe 的设计程序或图形编辑器（如\
  \ Dreamweaver、Photoshop、Illustrator 或 Flash Professional）才能获得 Device Central。对于专业设计师来说，这通常不是问题。大多数设计师至少拥有一款\
  \ Adobe 产品。例如，Photoshop 是网页设计行业的标配。\n\nDevice Central 以对网页和内容设计师非常有用的方式组织并显示特定设备的信息。例如，在图\
  \ 5-3 的“常规”页面中，你可以看到设备的屏幕尺寸、支持的 Flash Player 版本、操作系统以及接受的输入类型。Device Central 的网页还显示了用户代理和受支持的\
  \ Web 格式，包括 CSS 级别和 JavaScript 版本。\n\n**图 5-2：** Device Central 庞大的手持设备库允许你根据功能对配置文件进行排序。\n\
  \n![9781118026229-fg0502.eps](img/9781118026229-fg0502_opt.jpeg)\n\n如你所见，这个工具使得获取特定设备的信息变得非常容易。\n\
  \n## 制造商规格\n\n你总是可以访问设备制造商的网站来获取特定设备的规格。但这种方法非常繁琐、耗时且技术含量低。我只有在为某个组织设计 Web 应用程序，且该组织的员工都使用相同（或类似）的手持设备时，才会使用这种方法。当然，这种情况并不少见。许多组织为销售和支持团队创建移动应用程序，针对特定设备定制网站，然后将这些设备分发给团队成员。\n\
  \n**图 5-3：** Device Central 的设计相关信息集中在一个易于查找的位置。\n\n![9781118026229-fg0503.eps](img/9781118026229-fg0503_opt.jpeg)\n\
  \n## 当鼠标点击变成按钮、触摸和多点触控时\n\n\n\n\n\n在为移动设备设计页面时，你必须记住，大多数手持设备的 Web 内容交互方式与传统计算机并不完全相同。通常，交互方式不是“点选（point-and-click）”，而是“制表键切换并点击（Tab-and-click）”。手持设备用户通过使用方向键、滚动条、滚动轮或按键来导航至超链接和表单字段。这种以及其他界面差异通常会影响你设计移动网页的方式。\n\
  \n事实证明，移动用户没有鼠标。好吧，你可能在想：“废话，这不是显而易见吗？”——但这种缺失至关重要：一些用于设计计算机网站的技术在手持设备上根本行不通。例如，在为传统计算机屏幕设计的页面上，设计师拥有几种重要的工具来帮助用户识别热点（可点击的链接）——例如，依赖于鼠标的滚转效果（rollovers）和替代描述。当用户悬停（将鼠标指针置于超链接或按钮上并停留）时，滚转效果会改变超链接的外观；替代描述则在类似工具提示的方框中提供反馈（通常是对链接功能的描述），如图\
  \ 5-4 所示。\n\n### 滚动按钮和滚动轮\n\n在许多手持设备上，用户通过使用方向键或某种形式的滚动选择轮来滚动到链接，如图 5-5 所示。在滚动到链接之前，用户获得的唯一反馈是由你的物理布局提供的——即链接中某些使其明显是一个按钮或超链接的特征。在用户滚动到按钮后，你可以提供类似于滚转效果的功能——例如图\
  \ 5-5 中显示的突出显示，这确认了该链接确实是一个热点。虽然有用，但这不如传统计算机在用户悬停在热点上时提供的信息那样高效。你的职责是确保热点易于识别，并就链接的功能或跳转方向提供足够的反馈。\n\
  \n**图 5-4：** 当鼠标光标悬停在按钮和链接上时，滚转效果和类似工具提示的描述会提供反馈。手持设备不使用这些功能。\n\n![9781118026229-fg0504.eps](img/9781118026229-fg0504_opt.jpeg)\n\
  \n**图 5-5：** 当用户滚动到热点时，你可以提供类似滚转的突出显示，以帮助他们识别按钮和链接。\n\n![9781118026229-fg0505.eps](img/9781118026229-fg0505_opt.jpeg)\n\
  \n此外，由于如此多的移动用户依赖某种形式的滚动按钮，因此创建逻辑上的制表键顺序（tab order）也非常重要——即用户使用键盘（标准计算机上的 Tab 键）按钮操作选择按钮、链接、表单字段和其他交互对象的顺序。例如在图\
  \ 5-5 中，你会希望确保制表键顺序将光标从上到下在左侧的按钮列表中移动，而不是在对象之间随机跳转。你可以在标记代码中使用 `tabindex` 属性来控制制表键顺序，详见第\
  \ 9 章。\n\n### 触摸屏和多点触控屏\n\n某些设备，如 iPhone、iPad、Galaxy Tab、部分 BlackBerry 设备、Droid\
  \ 和 Windows Phone 手持设备，除了通过触摸屏和多点触控屏外，不提供任何导航方式。尽管触摸屏很酷，但用户确定一个对象是否为链接的唯一方法就是触摸它。然后，如果它是一个链接，新页面就会加载。用户关于按钮是否为链接的唯一反馈就是你设计按钮的方式，如图\
  \ 5-5 所示。在为这些设备设计时，尤其重要的是不要让用户去猜测。确保你的链接易于识别。\n\n### 为双向旋转手持设备设计\n\n在为手持设备设计时，你必须应对的另一个特性是双向旋转（dual\
  \ orientation）——根据你旋转设备的方式显示横屏或竖屏视图（见图 5-6）。毕竟，你不能把计算机显示器或笔记本电脑侧过来，然后让屏幕自动重新绘制以匹配新方向（如果能做到那绝对太酷了）。从技术上讲，你可以直接忽略这个高端特性，但请放心，许多使用双向旋转设备的访问者会注意到这一点。很有可能，如果他们拥有这种设备，双向旋转就是他们喜爱的功能之一。如果这是他们购买该设备的原因之一，而你忽略了它，他们可能会非常想念这个功能。\n\
  \n好消息是，补偿这种来回切换并不困难。事实上，为了确保网站在各种屏幕尺寸上显示美观而采取的一些措施，也有助于补偿支持横屏和竖屏查看的设备。我将在第 12 章和第\
  \ 13 章讨论 WebKit 扩展和 JavaScript 检测与切换时，向你展示如何处理这个设计问题。\n\n**图 5-6：** 竖屏和横屏模式下的内容示例。\n\
  \n![9781118026229-fg0506.eps](img/9781118026229-fg0506_opt.jpeg)\n\n# 第 6 章\n##\
  \ 开发移动设备检测与适配系统\n## 本章内容\n\n![arrow](img/arrow.png) 比较检测移动设备的方法\n\n![arrow](img/arrow.png)\
  \ 区分客户端检测和服务器端检测\n\n![arrow](img/arrow.png) 创建服务器端检测系统\n\n![arrow](img/arrow.png)\
  \ 创建设备类配置文件\n\n![arrow](img/arrow.png) 让用户选择使用哪个配置文件\n\n在手持设备显示 Web 内容的短短几年里，移动设备市场已经推出了\
  \ 6,000 到 8,000 种不同的设备。想象一下，如果你必须为每一种设备设计一个不同的网站！那当然太愚蠢了。\n\n即便如此，创建针对不同类型设备的内容有许多方法，从非常简单到极其复杂不等。无论你选择哪种方法，长远来看，它都归结为开发两个系统：检测（detection）和适配（adaptation）。设备检测系统确定访问网站的是哪种类型的设备，而适配系统则为该设备提供适当的内容。\n\
  \n大多数专业设计师通过服务器端脚本（通常用 PHP 编写）来实现设备检测。服务器端当然意味着由服务器而非用户的浏览器来解释和执行脚本。在大多数情况下，服务器端编程无法通过\
  \ HTML 或 CSS 标记实现——因此这远远超出了本书的范围。好消息是，目前有一些开源（且免费）的设备检测系统可用；本章将向你介绍其中几个，并就如何使用它们提供一些建议。我还将向你展示几种快速简单的检测方法，这些方法不需要深厚的编程技能，就能帮助你向很大一部分移动设备提供移动内容。\n\
  \n大多数移动网站设计师创建的适配系统由多个与设备配置文件组相匹配的网站组成。还有其他更复杂的选项——例如依赖于数据库和服务器端脚本的动态适配系统（在第 4 章中讨论）——但这些同样需要超出本书范围的编程知识。本章将重点介绍将移动设备分为组并为每组创建一套独立页面的最常规方法。\n\
  \n## 理解移动设备检测\n\n\n\n\n\n以下是检测过程的简单描述：当用户访问某个网站时，浏览器和服务器之间会进行对话。在对话开始时，浏览器（有时取决于设备如何处理此功能，可能是设备本身）会通过名为“用户代理”（user\
  \ agent）的字符串向服务器介绍自己，正如第 5 章讨论的那样；在此时，当浏览器向服务器打招呼时，技术上，服务器已经检测到了设备类型。它知道大部分或全部以下信息：设备使用的操作系统（OS）及操作系统版本；设备使用的浏览器类型和版本；设备类型和类型（bios）版本；以及支持的扩展，如\
  \ WebKit（在第 12 章中讨论过），如果适用。\n\n取决于你如何设置检测系统，这段初始对话可能是检测过程的结束，也仅仅是开始。虽然这看起来有很多信息，但它们通常无法提供足够的数据来充分识别设备的能力。复杂的设备检测系统中的脚本使用用户代理数据来发现有关设备属性的额外信息，例如屏幕大小、分辨率和功能。例如，手持设备支持多点触和双向定向吗？你明白我的意思了吗？\n\
  \n但话说回来，有时取决于你的检测与切换系统的复杂程度，用户代理数据就绰绰有余了。有时，检测与切换应用只需要知道网站访问者正在使用移动设备。再次，这完全取决于你希望你的检测系统如何工作，或者更好的是，你希望它在什么情况下执行什么操作。\n\
  \n## 服务器端检测与客户端检测\n\n你应该在服务器上使用脚本来检测设备类型，还是让浏览器执行检测脚本？答案取决于你希望为哪些范围的设备提供优化后的网站版本。原因如下：如今，几乎所有的客户端脚本都是用\
  \ JavaScript 编写的。许多移动设备（尤其是旧设备）不支持 JavaScript。因此，基于 JavaScript 的检测系统将无法检测到访问你网站的大部分手持设备。换句话说，禁用\
  \ JavaScript 的手持设备将忽略脚本并尝试显示网站的默认版本——通常是桌面端电脑版本。\n\n然而，这并不是世界末日。过去几年，无论是智能手机还是功能手机，制造商的趋势都是包含对\
  \ JavaScript 的支持。诚然，使用基于 JavaScript 的检测系统意味着某些手机无法访问你的移动优化版页面，但这些设备实际上并不常用于移动浏览——而且使用它们的人正在迅速减少。使用服务器端脚本是确保所有支持网络的手持设备都能访问你网站移动页面的唯一可靠方法。现在，为了创建一个服务端检测系统，托管你网站的服务器必须支持\
  \ PHP（或你使用的任何脚本类型）。从技术上讲，这意味着你需要创建 PHP 页面而不是 HTML。但请留留意：在本章稍后，我们将为你展示一种绕过这个问题的方法。同时，查看相关的侧边栏关于使用\
  \ JavaScript 进行设备检测的一些提示。此外，第 13 章还讨论了良好的 JavaScript 检测与切换技术。\n\n## 创建服务端检测系统\n\n\
  设计公司和大公司的网站设计部门投入了大量精力开发检测与适应系统。最复杂的系统需要维护一个设备数据库和一套复杂的 PHP 脚本，这些脚本检测用户代理并引用数据库。然后，利用数据库中关于设备的信息，另一组\
  \ PHP 脚本决定向设备传递哪些内容。\n\n再次，这需要大量的 PHP 编程技能，远远超出了本书的范围。如果你对学习如何创建这种系统感兴趣，你就需要学习 PHP。我建议你查看\
  \ Andy Harris 写的《HTML, XHTML, & CSS All-in-One For Dummies》。有一些免费的开源解决方案可用——我将在本节稍后介绍——但即使是那些也需要一些基本的\
  \ PHP 编程技能。\n\n别担心——我不会只告诉你必须学习编程才能获得检测与适应系统然后就此结束。相反，我将一步一步为你展示如何使用较简单的 PHP 解决方案之一：Andy\
  \ Moore 来自 `http://detectmobilebrowsers.mobi` 的检测与适应系统。这个系统非常容易设置和实现。它通过检测设备的操作系统并将浏览器重定向到相应的\
  \ URL 来工作。使用该系统，你可以根据需要为每个操作系统创建一个不同的网站，并为不属于任何预定义操作系统类别的设备创建一个通用的兜底网站。\n\n![tip.eps](img/tip_opt.jpeg)\n\
  \n## 使用 JavaScript 检测设备\n\n如果你的时间和资源短缺（或者你的客户可能不想为几种不同类别的设备开发内容付费），并且你只能创建一个移动网站版本怎么办？无论你创建的是\
  \ 1 个还是 20 个版本，你都需要一种方法来检测用户代理或某些识别其为手持设备的其他特定设备信息。\n\n我发现的一种相对有效的方法是检测设备分辨率——更具体地说，是检测其屏幕宽度——然后根据这些信息切换到网站的移动版本。这种简单的方法原理是假设：如果设备的屏幕小于特定宽度（以像素为单位），它就是移动设备。诚然，这不是一个非常复杂的系统，但它对每个移动设备都有效。它的工作原理如下：\n\
  \n1. 你创建一个网站的移动版本。\n\n2. 你为移动网站分配一个唯一的 URL——一个子域名——例如 `mobile.mysite.com`。如果你不理解子域名，请参见本章稍后关于“子域名”的侧边栏。\n\
  \n3. 打开桌面版本的网站首页 HTML 文件，通常是 `index.html`。\n\n4. 如图所示，在主页的 `<body>` 顶部放置以下 JavaScript。\n\
  \n```\n<script type=\"text/javascript\">\n<!--\nif (screen.width <= 1024) {\ndocument.location\
  \ = \"http://mobile.mysite.html\";\n}\n//-->\n</script>\n```\n\n此脚本检测屏幕宽度：`if (screen.width\
  \ <= 1024)`。如果小于 1024 像素（或你想使用的任何宽度），脚本会将浏览器重定向到包含移动内容的 URL：`document.location =\
  \ \"http://mobile.mysite.html\"`。\n\n再次，这种方法并非万无一失，有两个非常重要的原因：(a) 并非所有手持设备都支持 JavaScript，(b)\
  \ 并非所有用户代理都会发送屏幕分辨率。尽管如此，我推测，这种方法适用于目前使用的 70% 到 80% 的移动设备。\n\n![9781118026229-sb0601.eps](img/9781118026229-sb0601_opt.jpeg)\n\
  \n该系统运行良好，但它无法让你根据特定属性（如屏幕大小或设备支持哪个版本的 CSS）进行检测和适应。那种系统需要更复杂的 PHP 脚本集和设备数据库。在本节稍后，我将讨论一些更流行的解决方案并向你展示如何使用\
  \ Andy Moore 的系统。Andy Moore 的检测与重定向系统\n\n\n\n\n\n要开始这个练习，你至少需要两个版本的网站——一个用于台式机和笔记本电脑的标准电脑版本，以及一个用于手持设备的移动版本。关于如何对网站的不同移动版本进行分类和创建，将在本章稍后部分以及本书的其余章节中讨论。此外，请确保你的托管服务支持\
  \ `PHP`（大多数服务都支持）。\n\n![tip.eps](img/tip_opt.jpeg) 该方案允许你根据操作系统，为最多七种不同类型的设备创建不同的站点。这其实有点过度设计了，你很少需要这么多变体。如果你只是想尝试一下，只需要一个移动版本的站点即可。事实上，为了测试目的，你只需要一个简单的页面。要开始操作，请遵循以下步骤：\n\
  \n## 使用 CSS3 媒体查询创建自适应方案\n\n`CSS3` 即将推出的令人兴奋的特性之一（而且还有很多）就是媒体查询（media query）。\n\n\
  媒体查询会向设备请求特定的属性，例如屏幕宽度和高度、方向（手机当前是纵向持有还是横向持有）等等。然后，根据设备的响应，页面将使用适用于该设备属性的样式表进行格式化。`CSS3`\
  \ 样式表决定了页面的格式化方式、加载哪些图像和数字媒体文件等，而无需为同一个站点创建多个不同的版本。（从技术上讲，`CSS2` 也支持媒体查询，但并非许多仅支持\
  \ `CSS2` 而不支持 `CSS3` 的浏览器实现了这一功能。这导致在仅支持 `CSS2` 的浏览器中实现媒体查询的情况时好时坏，麻烦多于收益。）\n\n\
  正如我所说，这项功能终有一天会普及——但现在还不是时候。然而，目前部署它们的一个主要缺陷是，它们通常需要 `CSS3` 的支持，而当今许多设备并不具备。使用不支持\
  \ `CSS3` 的设备访问你站点的用户可能无法使用媒体查询，也就无法被引导至相应的内容。但是，一旦 `CSS3` 得到更广泛的应用，它们将消除维护设备数据库和编写复杂服务器端脚本的需求。不过，如果你现在要使用它们，仅限于创建专门为高端手持设备设计的站点，例如\
  \ iPhone、iPad 和其他平板电脑；较新的 Android 手持设备；以及较新的 Palm 和 Blackberry 智能手机。\n\n这听起来像魔法吗？它确实会消除大量工作以及创建相同内容多个版本的需求。如果你有兴趣看到媒体查询的实际运行情况并深入了解其工作原理，这里有几个带有可尝试示例的链接：\n\
  \n![check.png](img/check.png) CSS3 媒体查询与创建自适应布局：\n[`robertnyman.com/2010/09/09/css3-media-queries-and-creating-adaptive-layouts/`](http://robertnyman.com/2010/09/09/css3-media-queries-and-creating-adaptive-layouts/)\n\
  \n![check.png](img/check.png) 如何使用 CSS3 媒体查询创建网站的移动版本：\n[www.smashingmagazine.com/2010/07/19/how-to-use-css3-media-queries-to-create-a-mobile-version-of-your-website/](http://www.smashingmagazine.com/2010/07/19/how-to-use-css3-media-queries-to-create-a-mobile-version-of-your-website/)\n\
  \n![check.png](img/check.png) CSS3 媒体查询：\n[www.webdesignerwall.com/tutorials/css3-media-queries/](http://www.webdesignerwall.com/tutorials/css3-media-queries/)\n\
  \n## 实现步骤\n\n1. 为站点的移动版本创建子域名。\n\n子域名是网站的二级域名。你在到处都能看到它们。对于你的移动子域名，你可以使用如下命名方案：\n\
  `mobile1.mysite.com`\n`mobile2.mysite.com`\n`mobile3.mysite.com`\n\n如果你只有一个版本的移动站点，当然只需要一个子域名。如果你计划使用\
  \ Web 托管账户，你需要与托管提供商一起设置子域名，并为该子域名创建域名系统 (`DNS`) 记录。如果你不知道如何创建子域名和 `DNS` 记录，你的托管提供商可以帮助你。（如果你计划设计移动网站，这绝对是你将来需要的知识。）\n\
  \n2. 打开浏览器并访问 `http://detectmobilebrowsers.mobi`。\n\n如图 6-1 所示，该页面允许你输入站点不同版本的 URL。你可以为几种不同类型的设备输入不同的\
  \ URL，例如 iPhone、iPad、Android 设备、Windows 设备等等。还有一个通用设置用于重定向所有移动设备；如果你愿意，甚至可以重定向桌面浏览器（如图\
  \ 6-1 所示）。\n\n![tip.eps](img/tip_opt.jpeg) 不要担心“立即购买”按钮。Detect Mobile Browsers 的方案是免费的，除非你计划将其部署在商业站点上。如果是那样，Andy\
  \ 要求你花 50 美元购买代码，考虑到它节省的时间，这非常值得。\n\n**图 6-1：** Detect Mobile Browsers 帮助你创建一套用于重定向移动流量的\
  \ `PHP` 脚本。\n![9781118026229-fg0601.tif](img/9781118026229-fg0601_opt.jpeg)\n\n\
  3. 打开 Detect iPhones 下的第一个下拉菜单，选择“Redirect iPhones to a Specific URL”（将 iPhone 重定向到特定\
  \ URL）。\n\n下拉菜单下方会出现一行新内容，写着 \"Where do you want iPhone users redirect to: `http://`\"\
  （你想将 iPhone 用户重定向到哪里：`http://`），如图 6-2 所示。最后一部分 `http//` 是一个文本字段。\n\n4. 输入你希望将站点上的\
  \ iPhone 流量重定向到的 URL。\n\n5. 完成其余每个重定向设置，输入替代内容的 URL。\n\n![remember.eps](img/remember_opt.jpeg)\
  \ 此脚本要求你为每个选项设置标准。将“Redirect Desktop Browsers”（重定向桌面浏览器）设置设为 `No – Do Not Redirect\
  \ Visitors – Function Will Return FALSE`。\n\n6. 点击最后一个下拉菜单下方的“Generate Function”（生成函数）按钮。\n\
  \n这将生成一个合适的 `PHP` 函数（如图 6-3 所示），用于插入到你的网页中。不过，我们首先还有几件事要做。\n\n**图 6-2：** 输入新移动内容页面的\
  \ URL。\n![9781118026229-fg0602.eps](img/9781118026229-fg0602_opt.jpeg)\n\n通常，`PHP`\
  \ 页面的扩展名是 `.php` 而不是 `.html`；扩展名告诉服务器如何处理这些页面。`.html` 扩展名告诉服务器将页面直接交给浏览器。而 `.php`\
  \ 扩展名则告诉服务器，该页面包含服务器必须执行的脚本。因此，我们通过告诉服务器在 `HTML` 文件中查找并执行 `PHP` 代码来解决这个小问题。为此，我们需要创建一个\
  \ `.htaccess` 文件，也就是所谓的分布式配置文件。在 Apache Web 服务器上（大多数托管公司使用，尤其是支持 `PHP` 的服务器），分布式配置文件提供了一种按目录进行配置更改的方法。在打开网页之前，服务器会读取\
  \ `.htaccess` 文件，以确定特定目录中的文件（或包含 `.htaccess` 文件的目录的子目录中的文件）是否需要特殊处理。\n\n**图 6-3：**\
  \ 用于检测用户代理并切换 URL 的 `PHP` 函数。\n![9781118026229-fg0603.eps](img/9781118026229-fg0603_opt.jpeg)\n\
  \n7. 打开文本编辑器，在第一行输入以下内容：\n\n```\nAddHandler php5-cgi .html .htm\n```\n\n这一行告诉服务器在具有\
  \ `HTML` 和 `HTM` 扩展名的文件中运行 `PHP5` 脚本。如果你的托管服务器使用较早版本的 `PHP`（可能性较低），你可以使用以下行，而不是步骤\
  \ 7 中所示的代码：\n\n```\nAddType application/x-httpd-php .html\nAddType application/x-httpd-php\
  \ .htm\nAddHandler x-httpd-php .html .htm .cgi .php\n```\n\n8. 将文件保存为 `.htaccess`，并将其上传到网站的根目录或包含桌面版首页（很可能是\
  \ `index.html`）的目录中。\n\n\n\n\n\n9. 选择并复制包含 PHP 函数代码的文本字段中的所有文本。\n\n10. 使用文本编辑器或您用于创建和编辑网页的任何程序，打开网站桌面版本的首页（极有可能是\
  \ `index.html`）。\n\n11. 在文件的第一行（如果您使用的是 Dreamweaver，请确保处于代码视图），输入：\n\n```\n<?php\n\
  ```\n\n粘贴您从 Detect Mobile Browsers 复制的函数，然后输入：\n\n```\n?>\n```\n\n您的 `index.html`\
  \ 文件顶部看起来应该与图 6-4 类似。我们将这段代码放在文件顶部，以便浏览器和服务器首先看到并执行它。如果访问页面的用户代理（user agent）是移动设备，那么服务器将向浏览器推送备用\
  \ URL，而不是继续读取本页面。\n\n**图 6-4：** 包含移动设备检测与适配 PHP 脚本的首页文件。\n\n![9781118026229-fg0604.tif](img/9781118026229-fg0604_opt.jpeg)\n\
  \n12. 转到 Detect Mobile Browser 网页的底部，在 Usage Guide（使用指南）部分下，点击橙色的 `mobile_device_detect.php`\
  \ 链接。\n\n在您同意条款并按照几个提示操作后，该链接会将一个压缩的 PHP 文件下载到您的计算机中。\n\n13. 从压缩文件中解压 `mobile_device_detect.php`，并将其上传到您网站的根目录或包含桌面版本的目录中。\n\
  \n就这样完成了。如果您使用移动设备浏览该网站 —— 或者使用用户代理已被更改为移动设备类型的桌面浏览器 —— 您应该会被重定向到网站的移动版本。\n\n##\
  \ 基于数据库的检测与重定向系统\n\n如果前几步中描述的用户代理检测和内容适配方法无法提供您所需的设备分类系统，您可以随时创建一个基于数据库的检测系统。由于目前已经有一些相当成熟的开源系统可用，我建议您不要从零开始\
  \ —— 除非您有大量的时间且无事可做。这就是接下来列出三种广泛使用选项的原因；因为它们被广泛使用，您可以在互联网上找到大量关于如何设置和使用它们的资料。\n\n\
  ![remember.eps](img/remember_opt.jpeg) 并非所有这些解决方案都是免费的。例如，Device Atlas 根据您选择的版本，价格在\
  \ 100 美元到几百美元之间。当您将其与创建自己的系统可能花费的许多小时相比时……我相信您明白我的意思。综合考虑 —— 即使是那些需要少量费用的解决方案 ——\
  \ 它们也几乎相当于免费。\n\n以下是一些最受欢迎的开源、基于数据库的检测与重定向系统简表：\n\n![check.png](img/check.png) Device\
  \ Atlas ([`http://deviceatlas.com`](http://deviceatlas.com)): Device Atlas 提供了一个相当完整的设备数据库，并定期更新。为了让您不必重复造轮子，它在几种流行语言中提供了多种不同的\
  \ API（应用程序编程接口），例如 PHP、Java（一种与 JavaScript 无关的服务端语言）和 Windows Server 的 ASP.NET。Device\
  \ Atlas 还提供免费的评估许可，您可以据此在服务器上下载并安装所有必需的文件，并试用 API 组件。\n\n![check.png](img/check.png)\
  \ WURFL ([`http://wurfl.sourceforge.net`](http://wurfl.sourceforge.net)): WURFL\
  \ (Wireless Universal Resource File) 在第 5 章中作为查找特定设备信息的资源被讨论过，它是一个移动设备的 XML 数据库。它由移动网页设计社区维护且是免费的。虽然这个文件本身不是一个完整的检测与适配系统，但它已经完成了系统中最大且最令人生畏的部分\
  \ —— 设备数据库。不过，您需要一定的编程技能才能将其投入使用。\n\n![check.png](img/check.png) Tera-WURFL ([`www.tera-wurfl.com`](http://www.tera-wurfl.com)):\
  \ Tera-WURFL 从 WURFL 获取设备信息。在第 5 章中，关于使用它查找特定设备属性的部分也对其进行了详细讨论。这是一个免费的开源解决方案（他们接受合理的捐赠），目前几乎是一个完整的解决方案。唯一缺失的是重定向脚本\
  \ —— 您必须自己编写这些脚本。该解决方案的文档非常齐全；然而，因为它是免费的，支持是通过用户论坛以及您在互联网上能找到的任何其他资源来处理的。您需要学习一些编程，进行一些研究，并花时间将此解决方案整合在一起，但如果您需要一个复杂的按设备检测与适配系统，这是一个很好的起点。\n\
  \n## 通过类定义设备\n\n在移动设备开始访问 Web 内容之前，创建网站是一个相当简单的命题。当时使用的计算机之间的能力范围虽然有所不同，但各种机器在功能上的差异并不大，设计师不必过多担心网站在某些机器上无法运行的问题。网页设计师主要担心两件事：带宽和显示尺寸（或显示器分辨率）。他们设计网站是为了让那些低带宽互联网连接的用户不必在等待所有图像和其他多媒体内容下载时等到老去\
  \ —— 并且他们确保页面不会太宽，以免低分辨率显示系统的用户被迫进行大量不自然的左右滚动。\n\n随着时间的推移，几乎所有计算机用户都拥有了宽带互联网连接，极少有人使用低分辨率显示系统。设计师利用这些技术进步，开始创建能够提供高分辨率多媒体图像、数字视频和交互式\
  \ Flash 内容的富媒体网站。正当我们习惯于这种新获得的自由时，支持 Web 的手持设备出现了 —— 这大大增加了网页设计过程的复杂性。\n\n虽然花了一些时间，但移动\
  \ Web 技术终于达到了这样一个阶段：为手持设备设计将不再是追逐永不停歇的移动目标的练习 —— 这使这项工艺回到了移动革命开始时的原点：为最低公分母设计（我将在本节稍后讨论）。\n\
  \n如果您决定根据设备属性和能力创建几个不同的站点，您需要一种方法来对设备类型进行分类 —— 一个将它们划分为具有相似 Web 特性集和能力的设备组的系统 ——\
  \ 实际上，就是一个移动设备类系统。为了创建这些组，您可以创建一组配置文件，每组一个配置文件。每个配置文件代表一个版本的站点。例如，如果您决定需要四个独立的站点，您将创建四个类配置文件，这些配置文件将由特性和能力的相似性组成。\n\
  \n![tip.eps](img/tip_opt.jpeg) 您需要多少个站点版本？这是一个很有深意的问题。答案是？您有多少时间？您的雇主（就您的工资而言）或客户愿意花多少钱？移动\
  \ Web 用户是否是您营销战略的重要组成部分？您想在站点上投入多少工作？您还能想到多少其他相关问题来帮助您回答第一个问题：您需要多少个站点版本？\n\n###\
  \ 寻找最低公分母\n\n\n\n\n从技术上讲，“最小公分母”（lowest common denominator）是指某个功能在同类所有设备上都能正常运行的那个临界点。在网页设计中，针对最小公分母进行设计，简单来说就是在一系列设备范围内寻找最广泛的共同点，或者最基础且通用的标准特性。例如，在为台式机设计时，如果你将页面的宽度设计在\
  \ 900 像素以内，那么访问该网站的所有用户很有可能无需左右滚动即可查看完整内容。900 像素提供了充足的空间，你可以利用这些空间来创建美观且易于导航的页面。\n\
  \n然而，在手持设备中寻找最小公分母远没有那么简单。首先，我们面对的屏幕宽度从 100 或 200 像素到 1,000 像素甚至更高不等（而且屏幕尺寸并不是你需要考虑的唯一公分母）。面对如此巨大的差异，你无法真正设计出一个“一页适用所有”的移动端解决方案。例如，图\
  \ 6-5 模拟了同一个网站在三种尺寸截然不同的移动屏幕上的显示效果。除非页面非常简陋且毫无亮点，否则几乎不可能制定一个适用于所有手持设备的通用屏幕尺寸——除非你不介意忽略那些在高端设备上可以利用的所有激动人心的特性。但这会剥夺网页设计的乐趣，且无法吸引访客再次光顾你的网站。\n\
  \n虽然屏幕尺寸是最重要的考虑因素，但你还需要确定其他几项能力的公分母，例如：\n\n![check.png](img/check.png) 支持的 HTML\
  \ 和 CSS 版本\n\n![check.png](img/check.png) 对 JavaScript 的支持\n\n![check.png](img/check.png)\
  \ 对数字视频的支持（以及支持哪些格式）\n\n![check.png](img/check.png) 对 Flash 的支持（以及 Flash Player\
  \ 的版本和 Flash 特性）\n\n**图 6-5：** 同一个网站在尺寸截然不同的显示屏上的示例。\n\n![9781118026229-fg0605.eps](img/9781118026229-fg0605_opt.jpeg)\n\
  \n选择配置文件策略\n\n正如网页设计的许多其他方面一样，创建一组设备配置文件（device profiles）有许多可行的方法。不过，对我来说最合理的两种方法是：\n\
  \n![check.png](img/check.png) 从包含最少特性的配置文件开始，然后逐步添加特性以创建更复杂的配置文件。\n\n![check.png](img/check.png)\
  \ 从特性集最高端的配置文件开始，然后逐步剥离特性以创建较简单的配置文件。\n\n你可以选择其中一种方法，或者设计一套自己的策略。为了演示这种配置文件机制如何运作，你可以先为最新、最先进的设备创建配置文件，然后向下延伸，为功能较少的手持设备创建配置文件。在此过程中请记住，虽然创建一个包含许多配置文件的多功能类系统很有诱惑力，但每一个配置文件都意味着需要网站的另一个版本。\n\
  \n![tip.eps](img/tip_opt.jpeg) 为了追踪你的配置文件，你还需要一套命名方案。因为每个新配置文件代表一个新版本的网站，你还需要一个独立的目录来存放每个版本的文件。此外，每个版本需要一个子域名（或至少是一个子目录），以便为访问每个版本提供唯一的\
  \ URL。你可以随意为配置文件命名，但如果你为配置文件、子目录和子域名使用相同的名称，你会发现追踪所有内容要容易得多。在本次创建配置文件的演示中，我使用了一套以\
  \ mobile1、mobile2 等开头的命名方案，具体如下：\n\n![check.png](img/check.png) mobile1：在我撰写本书时，为了应对苹果公司极其成功的\
  \ iPad，几家制造商也推出了手持平板电脑。这些设备实际上就是微型计算机。它们大多数支持绝大多数台式机网页特性，如 HTML5、CSS3、Flash Player\
  \ 10.x（而非大多数设备上的 Flash Player Lite）以及 1024 像素宽或更宽的高分辨率显示屏。（当然，一个注意事项是 iPad 不支持 Flash。）\n\
  \n考虑到这些设备具备完整的网络能力，没有必要为它们创建单独的网站。然而，它们是手持设备——没有指针设备（鼠标），且支持触摸和多点触控。它们还支持方向切换，这在横屏模式下大大增加了屏幕宽度，且两种方向模式之间的屏幕尺寸差异巨大（如图\
  \ 6-6 所示）。基于这些原因，将此类设备纳入你的移动类结构中是值得考虑的。如果你这样做，并且希望为用户提供最佳的网页体验，那么它们理应拥有自己的独立类。\n\
  \n![check.png](img/check.png) mobile2：下一类满足 mobile1 的所有标准，但该配置文件中的设备屏幕要小得多。此类设备包括\
  \ iPhone、iPod、最新的 Android 智能手机、最新的 Palm OS 设备以及许多 Windows Phone 7 设备。这些设备能够实现许多花哨的技巧，你可以为它们创建功能丰富的网站。由于屏幕尺寸较小（例如\
  \ iPhone 在横屏模式下仅 480 像素宽），为 mobile1 屏幕设计的页面在 mobile2 设备上可能无法良好运行。\n\n![remember.eps](img/remember_opt.jpeg)\
  \ 请记住，这一组的屏幕尺寸范围较广——大致从 320 到 640 像素宽（有些甚至更宽一点）。CSS 提供了一些补偿方法，这将在第 7 章和第 8 章中讨论。\n\
  \n![check.png](img/check.png) mobile3：此类主要包括不支持 HTML5、CSS3 或 JavaScript 的旧款智能手机。不过，在大多数情况下，这些设备的屏幕尺寸与\
  \ mobile2 类相似。缺乏 JavaScript 支持大大降低了设备的功能——这限制了你的设计选择。例如，你无法创建具有自动验证字段的表单（除非使用服务器端脚本）。表单字段验证可确保必填项未被留空，并检查用户输入的内容——特别是信用卡号和电话号码等数字字符串——以确保输入符合预定义标准。（第\
  \ 9 章将讨论移动端表单设计。）此外，你无法使用非常有益的 Ajax 调用（第 16 章讨论），而 Ajax 本可以帮你创建各种功能，如交互式 Google\
  \ 地图、搜索页面或下拉菜单和菜单选项卡（同样，除非你使用服务器端脚本）。底线是：在 mobile3 设计类中，你必须时刻留意有限的功能特性。\n\n![check.png](img/check.png)\
  \ mobile4：现在我们进入了那些不那么“智能”的功能手机。大多数此类设备的屏幕很小，宽度约为 320 像素或更小，且仅支持最简单的 CSS 格式化（如果支持\
  \ CSS 的话）。除非你是一位非常熟练的程序员，否则为这类设备创建的网站将由简单直接的 HTML 组成。这些网站中任何复杂的功能都将来自服务器端技术。对 Flash\
  \ 和数字视频的支持也非常有限。这并不是说你完全不能使用多媒体格式，但你能实现的功能将非常简单（且体积小）。\n\n**图 6-6：** 在纵向模式下，某些平板电脑的屏幕宽度窄到可以被视为移动设备，但在横向模式下则不一定。\n\
  \n![9781118026229-fg0606.eps](img/9781118026229-fg0606_opt.jpeg)\n\n子域名还是子目录？\n\n\
  当你从子目录将内容部署到网络时，你有两种设置 URL 的选择：\n\n\n\n\n![check.png](img/check.png) 将子目录路径作为 URL\
  \ 的一部分，例如 `http://www.mysite.com/subdirectory`。\n\n![check.png](img/check.png) 通过\
  \ DNS 子域名指向子目录，例如 `http://subdomain.mysite.com`。\n\n两种方法都可行，但在创建备用站点时，我更倾向于使用子域名。为什么？因为归根结底，它们是独立的网站。在我看来，子域名看起来更精致，也更专业。然而，它们的设置也相对复杂一些。对于子目录，你只需要创建目录并在链接中调用它们即可，不需要额外的设置。\n\
  \n对于子域名，你必须为每个备用站点创建 DNS 记录。如果你使用的托管公司允许你创建自己的 DNS 记录并将其指向特定目录，那么这个要求其实并没有增加多少工作量——只是多几个步骤。不过，有些托管公司要求你申请\
  \ DNS 更改（通常通过电子邮件），并等待支持团队处理。有时这可能需要几天时间，这可能会影响你的设计进度。但你也可以绕过这个问题——通过安装一个测试服务器，正如第\
  \ 4 章中所讨论的那样。\n\n## 完善你的类系统\n\n你开始掌握窍门了吗？你现在已经拥有了四个版本的站点。幸运的是，这组配置文件几乎涵盖了所有支持 Web\
  \ 的手持设备。从这里开始，你添加的任何配置文件都应该是为了完善或微调，而不是试图涵盖所有设备。例如，你可以为不支持 Flash 的 Apple 设备创建 `mobile1`\
  \ 和 `mobile2` 的子类。你也可以为极小屏幕（宽度约为 240 像素或更小）创建 `mobile4` 的子类。\n\n你可以根据需要创建任意数量的配置文件。同样，你决定在哪个程度停止，取决于你的时间、资源，以及你对投入这么多工作和时间是否合理（权衡营销策略或站点目的）的最佳判断。例如，一家销售手机配件的在线商店，在“检测并适配”系统上投入的时间会比一家在线冲浪店多得多。（提示：考虑市场规模。）\n\
  \n## 让用户选择\n\n最简单——或许也是最万无一失的——适配系统就是直接让用户选择是否想要查看站点的移动版本。只需提供一个指向站点移动版本的链接——或者基于设备类型或屏幕大小提供多个链接。这是一种相对低技术的方法，但并不罕见。世界上规模最大的一些网站也为用户提供了这个选项，如图\
  \ 6-7 所示。\n\n`图 6-7`：Google 为用户提供了在“移动版”或“经典版”模式下查看站点的选项。\n\n![9781118026229-fg0607.eps](img/9781118026229-fg0607_opt.jpeg)\n\
  \n当然，这个选项消除了创建服务器端检测系统的必要。然而，除非你计划采用单版本适配系统，否则你仍然需要根据设备配置文件创建多个版本的站点。你在数字视频中经常看到类似的呈现方式——你知道的，就是根据互联网连接的下载速度选择观看哪个版本的视频。看到允许用户在\
  \ Flash 和非 Flash 版本之间选择的站点也不罕见。\n\n但是，如果你选择这种方法，你可能不应该自动向每个访问站点的用户展示移动备选菜单。相反，至少使用某种检测方法，例如\
  \ Andy Moore 的 Detect Mobile Browsers 解决方案（在本章前面讨论过），以确定访问者确实在使用手持设备——然后提供备选站点的菜单。我认为这种方法更简洁，看起来更专业——也许你可以添加一条如下的设置消息：\n\
  \n“我们注意到您正在使用移动设备。为了获得最佳的站点体验，请选择以下移动选项之一。”\n\n# 第 7 章：设计首页布局\n\n## 本章内容\n\n![arrow](img/arrow.png)\
  \ 设计首页框架\n![arrow](img/arrow.png) 使用 `CSS` 创建页眉、页脚和侧边栏\n![arrow](img/arrow.png)\
  \ 使用 `CSS` 格式化文本\n![arrow](img/arrow.png) 使用 `CSS` 添加菜单和导航\n![arrow](img/arrow.png)\
  \ 在布局中添加图像\n\n大多数设计师都同意，任何网站最重要的页面就是首页——用户进入站点时看到的第一个页面。一个优秀的首页能同时履行多种功能，首先包括：\n\
  \n![check.png](img/check.png) 欢迎站点的访问者。\n![check.png](img/check.png) 宣布站点的目的。\n\
  ![check.png](img/check.png) 吸引访问者的注意力。\n![check.png](img/check.png) 诱导访问者停留并浏览。\n\
  ![check.png](img/check.png) 清晰地展示如何查找信息。\n\n### 行动号召\n\n虽然所有首页履行本章引言中列出的五项基本功能很重要，但对于移动站点来说，首页的有效性至关重要。移动\
  \ Web 用户是以行动为导向的。他们现在就要信息，并且现在就要采取行动。页面需要加载迅速，并立即为用户提供选择。许多访问你站点的移动用户只想知道两件事：你是做什么的，以及如何联系你。\n\
  \n因此，你的工作是为他们提供一个能清晰呈现所有内容（如图 7-1 所示）的首页，并让访问者能够轻松决定下一步做什么——无论是点击链接获取更多信息，点击链接给你发送电子邮件，甚至是点击链接直接从他们浏览站点的移动设备上给你打电话。（继续阅读。我将在本章稍后部分向你展示如何实现这一点！）\n\
  \n`图 7-1`：以行动为导向的首页，具有明显的全方位链接。\n\n![9781118026229-fg0701.eps](img/9781118026229-fg0701_opt.jpeg)\n\
  \n### 设计框架\n\n好了，理论就说到这里。是时候动手实践了。在接下来的练习中，你将创建一个快速简单的首页，包含一个横幅（通常称为页眉）、一个交互式侧边栏菜单，以及一个包含易于执行的电子邮件和电话号码链接的页脚。\n\
  \n这种方法快速且简单，你用它创建的页面将在各种移动设备上运行。我知道这里引入的许多概念对你来说可能是新的。考虑到这一点，我会简要讨论其中大部分内容。但请记住，本章的目的是让你初步尝试——设计一个可行的移动友好页面。这是一个起点。接下来的几章将详细探讨这里使用\
  \ Many 的标签和技术，当你学习创建更复杂的页面和移动 Web 应用程序时，我会更详细地讲解它们。\n\n让我们开始吧。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 你可以从本书的配套网站下载一些用于练习的文件。这些是你在本节中将要创建的内容示例。下载并参考它们将帮助你更好地理解这个过程。下载文件 `chapter07.zip`。它包含三个文件：`index.html`（网页本身）；`chapter7.css`（外部样式表）；以及\
  \ `logo.png`（Logo 占位图）。Logo 占位图是一个图形文件，位于名为 `images` 的子目录中。我还包含了一个 `logo.png` 的\
  \ Photoshop PSD 文件，以防你想编辑它来为本次练习创建自己的 Logo。\n\n### 开始编写 HTML 页面\n\n无论你是使用 Dreamweaver\
  \ 还是手动编码，启动一个移动 `HTML` 页面的方式与任何其他页面一样。所有 `HTML` 页面都有相同的基本结构。换句话说，关键不在于你如何使用标签，而在于你使用了哪些标签。或者，应该是，关键不在于你怎么说，而在于你说什么？大概就是这个意思\
  \ . . .\n\n\n\n\n\n# 理解移动端网页的 Doctype\n\nWeb 浏览器通过读取标签来确定如何格式化页面。然而，浏览器如何解释和使用这些标签，通常取决于初始标签，即\
  \ HTML 页面顶部的第一个标签：`doctype`。`doctype` 向浏览器介绍该页面，并告知浏览器该页面支持哪些标准 —— 如 `HTML`、`XHTML`、`XML`\
  \ 等。\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 好了。从技术上讲，`doctype` 并不真正是一个标签。在极客术语（geekSpeak）中，它是一个声明或指令。它向浏览器“声明”文档类型，但其本身并不执行任何格式化操作。诚然，它被放置在小于号\
  \ (`<`) 和大于号 (`>`) 符号之间，这让它看起来像个标签。但由于它实际上没有格式化页面上的任何内容，所以不能因为它的外表像鸭子，就认为它说话像鸭子。\n\
  \n## 移动端网站的常见 Doctype\n\n虽然有多种可用的 `doctypes`，但如今只有少数几种被广泛使用，而用于移动端网站的则更少。以下是移动端网站最常用的两种\
  \ `doctypes` 以及你应该在何时使用它们：\n\n### XHTML Mobile 1.0\n![check.png](img/check.png)\
  \ 该 `doctype` 被称为 XHTML 移动配置文件（XHTML Mobile Profile）或 `XHTML MP`，常用于移动端网站。它目前有三个版本：`Mobile\
  \ 1.0`、`Mobile 1.1` 和 `Mobile 1.2`。每个版本基本相同，不同之处在于新版本修正了之前版本的技术错误。当为不支持许多现代 `CSS`\
  \ 和 `HTML` 格式（如 `CSS2`、`CSS3` 和 `HTML5`）的设备设计页面时，你应该使用此 `doctype`。\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\
  \ `XHTML MP` 标准由两个不同的联盟定义。例如，`Mobile 1.0` 标准由 `wapforum.org` 定义，而 `Mobile 1.1` 和\
  \ `Mobile 1.2` 由 `openmobilealliance.org` 定义。因此，在为不同版本声明 `doctype` 时，你需要在声明中引用正确的标准合规\
  \ URL。\n\n`Mobile 1.0` 的声明写法如下：\n```\n<!DOCTYPE html PUBLIC “-//WAPFORUM//DTD XHTML\
  \ Mobile 1.0//EN” “http://www.wapforum.org/DTD/xhtml-mobile10.dtd”>\n```\n\n`Mobile\
  \ 1.1` 和 `1.2` 的声明写法如下：\n```\n<!DOCTYPE html PUBLIC “-//WAPFORUM//DTD XHTML Mobile\
  \ 1.1//EN” “http://www.openmobilealliance.org/tech/DTD/xhtml-mobile11.dtd”>\n\n\
  <!DOCTYPE html PUBLIC “-//WAPFORUM//DTD XHTML Mobile 1.2//EN” “http://www.openmobilealliance.org/tech/DTD/xhtml-mobile12.dtd”>\n\
  ```\n请注意，`Mobile 1.1` 和 `Mobile 1.2` 引用的是 `openmobilealliannce.org`，而不是 `wapforum.org`。\n\
  \n### XHTML 1.0 Transitional\n![check.png](img/check.png) 现代设备（如平板电脑和最新的智能手机）配备的浏览器几乎支持台式机和笔记本电脑所支持的所有\
  \ `CSS` 和 `HTML` 元素。为这些设备创建网页时，你并不真正需要一个专门为移动设备设计的 `doctype`。在为最新的 iPhone、iPad 或\
  \ Android 设备以及其他使用 `WebKit` 扩展（将在第 12 章讨论）的设备设计页面时，你应该使用此 `doctype`。其声明如下：\n```\n\
  <!DOCTYPE html PUBLIC “-//W3C//DTD XHTML 1.0 Transitional//EN”“http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd”>\n\
  ```\n\n## 创建移动端网页\n\n现在技术细节已经交代清楚了，让我们来创建一个移动端网页。以下步骤将创建页面本身以及配套的外部 `CSS` 文件：\n\n\
  1. 使用源代码编辑器或文本编辑器在 Dreamweaver 中开始一个新页面。\n2. 将页面保存为 `index.html`。\n3. 在页面的第一行，输入以下标签：\n\
  ```\n<!DOCTYPE html PUBLIC “-//WAPFORUM//DTD XHTML Mobile 1.0//EN” “http://www.wapforum.org/DTD/xhtml-mobile10.dtd”>\n\
  <html xmlns=”http://www.w3.org/1999/xhtml”>\n</html>\n```\n第一个标签声明了 `doctype`，第二个标签声明了\
  \ `WS3` 标准合规性（将在第 2 章讨论）。第二个标签还定义了 `HTML` 页面的内容区域。所有在该页面上进行格式化的标签和内容都位于起始 `<html>`\
  \ 和结束 `</html>` 标签之间。\n4. 保存页面。\n\n![tip.eps](img/tip_opt.jpeg) Dreamweaver 可以自动生成\
  \ `doctype` 和一些其他基础结构的 `HTML` 标签，并链接到你的样式表。只需使用“文件”菜单中的“新建”命令开始你的页面，这将打开如图 7-2 所示的“新建文档”对话框。在对话框右侧窗格的\
  \ `DocType` 下拉菜单中选择 `XHTML Mobile 1.0` 即可为该过程正确设置页面。在“新建文档”对话框中选择 `XHTML Mobile\
  \ 1.0` 可以为你完成步骤 1-3。\n\n![remember.eps](img/remember_opt.jpeg) Dreamweaver 可以自动化本章以及本书中讨论的许多步骤。在全书中，我会尽量指出\
  \ Dreamweaver 在哪些地方能提供很大帮助或为你节省大量时间。（不过请注意，本书中的示例是手动编码的，因此我在这些练习中向你展示的逐步技术与 Dreamweaver\
  \ 的格式化选项截然不同。）\n\n**图 7-2：** 你可以使用 Dreamweaver 的“新建文档”向导，从而在设置 `doctypes` 时无需猜测。\n\
  ![9781118026229-fg0702.eps](img/9781118026229-fg0702_opt.jpeg)\n\n## 创建样式表\n\n太棒了！既然\
  \ `HTML` 页面框架已经启动，现在是时候创建样式表了。第 2 章讨论了三种类型的样式表 —— 外部、内部和内联 —— 以及何时以及为何使用哪种类型。除非你的样式仅用于格式化一个文档或网页，否则你应该始终使用外部样式表。\n\
  \n在接下来的步骤中，我将向你展示如何创建外部 `CSS` 文件并在 `HTML` 页面中引用它，以便网页使用它来格式化页面元素。\n\n1. 启动一个新的文本文档并将其保存为\
  \ `chapter7.css`。（确保将其保存在与 `index.html` 相同的目录下。）\n2. 在新文档的第一行，输入以下内容：\n```\n@charset\
  \ “utf-8”;\n```\n第一行通过宣布其使用的字符集来设置样式表。几乎所有网站，尤其是用 `HTML`、`XHTML` 和 `CSS` 编写的网站，都使用\
  \ `utf-8` 字符集。\n\n如果你不告诉 `index.html` 关于样式表的信息（其名称、类型以及在哪里找到它），那么你的新样式表就毫无用处。\n\n\
  3. 在 `index.html` 中，将文本光标置于 `<html xmlns=”http://www.w3.org/1999/xhtml”>` 标签的末尾，按下两次回车键。\n\
  \n这会在该标签和你即将创建的标签之间创建一个空行。这不是必须的，许多设计师并不这样编写代码。这些被浏览器忽略的额外空白是个人偏好，它能让像你我这样的人类更容易阅读代码。\n\
  \n出于设计目的，`HTML` 页面由两个部分组成：`<head>` 部分（在此声明文档的样式表以及关于页面的许多其他数据）。`HTML` 标签 `<link\
  \ href=”X”>` 告知浏览器关于样式表的信息，提供诸如文档文件名、文件位置和 `CSS` 类型等信息。无论你的页面使用 1 个还是 20 个样式表，每个\
  \ `CSS` 文件都需要一个 `<link href=”X”>` 标签，并且它们全部位于文档的 `<head></head>` 标签之间。\n\n4. 输入以下标签：\n\
  ```\n<head>\n<meta http-equiv=”Content-Type” content=”text/html; charset=utf-8”\
  \ />\n<title>My Mobile-Friendly Site</title>\n<link href=”chapter7.css” rel=”stylesheet”\
  \ type=”text/css” media=”screen” />\n<meta name=”HandheldFriendly” content=”True”\
  \ />\n</head>\n```\n上述代码中的第一个 `<meta>` 标签再次设置了文档类型。是的，我知道你在想什么：我得做多少次这个操作？简单来说：只要有必要就做。网页并非所有元素都通过样式表格式化。此标签可确保文档中不依赖样式表的部分得到正确处理，或使用正确的字符集。请记住，确保你的页面在尽可能多的设备上正确显示，通常取决于你是否考虑到了所有细节。\n\
  \n\n\n\n\n![tip.eps](img/tip_opt.jpeg) 是的，这里还有另一个 `<meta>` 标签的示例。这些标签提供了关于文档的重要信息。用某位名人的话来说，“你还没看到真正的精彩”——因为\
  \ `<meta>` 标签具有多种功能。例如，它们还用于为搜索引擎设置并提供信息（在第 15 章中讨论），以及用于调用包含文件（在涵盖创建模板的第 8 章中讨论）。\n\
  \n`<title>` 标签为文档命名。搜索引擎不仅使用 `<title>` 数据来帮助查找和索引页面，而且这些标签之间的文本也是显示在浏览器标题栏中的页面标题，如图\
  \ 7-3 所示。\n\n**图 7-3：** `<title></title>` 标签的内容显示在浏览器的标题栏和标签页标签中。\n\n![9781118026229-fg0703.eps](img/9781118026229-fg0703_opt.jpeg)\n\
  \n`<link href=` 行声明了样式表。请注意 `media` 属性声明 `\"screen\"`。当然，这告诉浏览器该内容是为哪种类型的媒体或设备设计的。支持的\
  \ CSS 媒体类型选项之一是 `handheld`，但在我看来，它过于严格，会导致浏览器忽略过多的 CSS 和 XHTML 格式，尽管如今许多较新的智能手机已经支持更多的标签和\
  \ CSS 样式。下一个 `<meta>` 标签 `<meta name=”HandheldFriendly” content=”True” />` 具有类似的目的——它告诉浏览器\
  \ `index.html` 是适合手持设备的，但没有那么严苛。\n\n就这样！现在是时候开始对页面元素（用户看到的内容）进行格式化了。\n\n## 浏览器如何知道哪个页面是第一个？\n\
  \n如你所知，除了主页外，大多数网站由许多页面组成。你是否好奇过，在你访问的任何网站上，浏览器是如何在所有这些页面中知道选择哪个页面的？你猜怎么着——它其实不知道。尽管\
  \ Web 浏览器很智能，但这并不是由它们做出的决定。实际上是由服务器决定哪个页面作为网站的首页。\n\n大多数 Web 服务器的一个标准是将主页命名为 `index.html`（或\
  \ `index.asp`、index.php` 等，取决于网站编写所使用的语言）。但这仅仅是一个标准。大多数 Web 服务器都可以设置为将服务器上的几乎任何页面作为主页，而且出于各种原因，它们经常这样做。\n\
  \n## 使用 CSS 格式化列和框\n\n样式表由类（classes）和选择器（selectors）组成，通常被称为“样式”。你在样式表中定义样式，然后在 HTML\
  \ 页面中“调用”它们。样式几乎可以完成所有事情，包括将页面划分为用于存放内容的列和框，这种方式类似于 HTML 表格（在第 1 章中讨论），但比表格更灵活且更简洁。这些区域被称为“容器”，将在第\
  \ 2 章中讨论。\n\n有几种使用样式创建容器的方法，包括 `<div>`（分隔符）标签和 `<p>`（段落）标签。可以将 `<div></div>` 标签对视为用于设置页面区域（如页眉、侧边栏、页脚和页面主体区域）的容器。在本章中，我们先看\
  \ `<div>`，稍后再看 `<p>`。一旦你使用 `<div>` 在页面上设置了容器，该部分就受样式表中为该容器定义的所有 CSS 格式的影响——容器中的对象会自动采用该\
  \ CSS 格式。\n\n但请记住，你可以在 HTML 页面内部进一步格式化页面元素，或者使用样式表中的额外 CSS 样式覆盖 CSS 格式，你稍后就会看到。\n\
  \n在设置 `<div>` 容器时，你需要将样式表中的样式选择器与 HTML 页面中的容器建立关联，如图 7-4 所示。\n\n**图 7-4：** `<div>`\
  \ 标签及相关的样式选择器。\n\n![9781118026229-fg0704.eps](img/9781118026229-fg0704_opt.jpeg)\n\
  \n### 理解选择器\n\n选择器（或样式选择器）是 HTML 页面用于将页面元素与样式关联的机制。选择器有四种基本类型：类选择器、类型选择器、ID 选择器和复合选择器。以下是每种类型的简要描述以及如何及何时使用它们：\n\
  \n![check.png](img/check.png) 类选择器：类样式在样式表中用一个点（period/dot）定义：`.container`。但在文档中调用它时，要去掉这个点：`<div\
  \ class=”container”>`。类选择器可能是最常用的，也是最灵活的。你可以用它来格式化任何页面上的多个对象（文本、图像或多媒体），并且可以在同一个页面上根据需要多次使用。在创建类选择器名称时，请记住不能使用空格或特殊字符，但破折号和连字符除外。\n\
  \n![check.png](img/check.png) 类型选择器：你可以使用类型选择器来修改现有的或内置的 XHTML 标签，例如标题标签 `<h1>`、`<h2>`\
  \ 等。你在样式表中创建它们时不需要任何预定义字符，如下所示：\n\n```css\nh1, h2, h3, h4, h5, h6, p {\n   margin-top:\
  \ 0;\n   padding-right: 15px;\n   padding-left: 15px;\n   color: #CCC;\n}\n```\n\
  \n当你在文档中使用上述标签之一时，该标签会自动采用此格式——除非你在文档中覆盖它，或者在样式表的后面进一步修改它。\n\n![check.png](img/check.png)\
  \ ID 选择器：与类选择器不同，每个页面只能使用一次 ID 选择器。使用它来创建页面上的唯一区域。ID 选择器在样式表中由井号标识：`#header`，你在\
  \ HTML 页面中通过 `<div id=>` 标签调用它，例如 `<div id=”header”>`。\n\n![check.png](img/check.png)\
  \ 复合选择器：复合选择器（或复合样式）允许你组合样式。例如，如果你希望有序列表（`<ol>` 标签）在 `.content` 容器中的显示方式与在 `.sidebar`\
  \ 容器中不同，你可以设置一个复合样式来实现，如下所示：\n\n```css\n.container .content ol {\n   font-family:\
  \ Arial, Helvetica, sans-serif;\n   font-size: small;\n   color: #000;\n}\n```\n\
  \n这个复合样式为页面的子容器 `.content`（或主正文容器）设置了一个独特的有序列表。是的，我知道我还没有详细讨论容器。接下来就讲这个。\n\n###\
  \ 创建容器\n\n容器（Containers）顾名思义，就是包含页面上的元素。根据你的设计，一个页面可以有多个容器——每个页面元素对应一个。或者你可以将页面分区域设计，例如页眉、侧边栏、页脚和主正文（或内容）区域。在设置容器时，你可以随意命名，但这里将使用一些常见的标准。遵循标准通常是个好主意，即便没有其他原因，也是为了防止以后其他人需要编辑你的页面。\n\
  \n### `<body>` 标签对\n\n通常情况下（虽有例外），就像所有不出现在页面上的元素（如 `<meta>` 信息）都放在 `<head></head>`\
  \ 标签对之间一样，所有出现在页面上的元素都放在 `<body>` 标签之间。因此，你的容器标签需要放在起始标签 `<body>` 和结束标签 `</body>`\
  \ 之间。你首先通过创建一个主容器（或顶层容器）来定义容器，这个容器实际上就是页面本身。\n\n按照以下步骤创建顶层容器：\n\n1. 转到你的 `index.html`\
  \ 页面，在结束标签 `</head>` 之后输入一个空行，然后输入以下标签：\n\n```html\n<body>\n<div class=”container”>\n\
  <!-- end .container --></div>\n</body>\n```\n\n\n\n\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 注意结束 `</div>` 标签之前的 `<!-- end .container -->` 文本字符串。这被称为注释。就像在代码的关键位置留白可以让代码更易于人类阅读一样，注释也能帮助处理速度较慢的人类理解代码。注释是笔记或注解，除了提供关于代码的信息（或者任何你想放入其中的内容，例如，给开发团队其他成员的问题？）之外，不执行任何操作。当浏览器看到这种格式\
  \ `<!--comment-->` 时，它们会将其忽略。随着页面的复杂程度增加，注释在标记文档位置、提醒你代码的作用或为什么采用某种特定方式编写代码等方面会非常有用。\n\
  \n## 设置容器\n\n2. 转到 `chapter7.css` 并输入以下类选择器：\n\n```css\n.container {\n   width:\
  \ 100%;\n   max-width: 800px;\n   min-width: 320px;\n   background: #FFF;\n   margin:\
  \ 0 auto;\n}\n```\n\n如果你熟悉编程，你会认出这种格式。`.container` 是样式的名称（在许多编程语言中被称为函数），而两个花括号之间的所有其他内容则定义或设置了该样式的属性。从上到下，这个顶层容器的格式定义如下：\n\
  \n![check.png](img/check.png) `width: 100%;` = 使此容器占据页面尺寸的 100%。\n\n![check.png](img/check.png)\
  \ `max-width: 800px;` = 不允许页面调整至超过 800 像素宽。\n\n![check.png](img/check.png) `min-width:\
  \ 320p;` = 不允许页面调整至小于 320 像素宽。（这会强制屏幕小于 320 像素的设备进行横向滚动，但另一种选择是页面元素无法适配并相互重叠——前者显然是两害相权取其轻。）\n\
  \n![check.png](img/check.png) `background: #666;` = 使容器的背景为白色。此代码 `#FFF` 是十六进制代码\
  \ `#666666` 的缩写。（如果你不知道计算机如何使用十六进制代码定义和选择颜色，请参阅侧边栏“理解十六进制颜色”。）如果你使用 Dreamweaver，这相当于在页面属性（位于\
  \ `Modify` 菜单中）中设置背景选项。它设置了整个页面的底层背景颜色。\n\n![check.png](img/check.png) `margin:\
  \ 0 auto;` = 使外边距自动设为零。\n\n同样，所有其他容器都位于这个顶层容器内部。\n\n### 理解十六进制颜色\n\n如果你曾好奇计算机如何选择和定义颜色，最常用的方法之一（尤其是对于网页）就是十六进制代码系统。简单来说，十六进制表示法（在\
  \ CSS 和 HTML 的语境下）是一套定义和调用颜色的系统。当浏览器遇到十六进制代码时，它会告诉计算机如何为定义区域内的像素着色。你几乎可以在任何图形或设计程序（如\
  \ Photoshop 或 Dreamweaver）中找到大多数颜色的十六进制代码。只需查看这些程序的颜色定义框或面板即可，如图所示。\n\n![9781118026229-sb0701.eps](img/9781118026229-sb0701_opt.jpeg)\n\
  \n## 创建页眉\n\n页眉通常横跨页面顶部，显示用于识别站点本身及其代表组织的信息。例如，页眉可能包含公司徽标以及其他象征公司及其产品或服务的图形。例如，一个临时办公室职员服务站点可能会显示人们在办公室环境下工作的图像。页眉容器与所有其他容器一样，位于主容器（即顶层容器）内部。\n\
  \n要添加页眉，请执行以下步骤：\n\n1. 将 `.header` 容器标签（如下所示）放置在 `index.html` 中。\n\n```html\n<body>\n\
  <div class=\"container\">\n    <div class=\"header\">\n    <!-- end .header --></div>\n\
  <!-- end .container --></div>\n</body>\n```\n\n2. 转到 `chapter7.css`，在 `.container`\
  \ 样式下方（花括号之后）输入一个空行，然后输入以下页眉标签：\n\n```css\n.header {\n   background: #666;\n}\n\
  ```\n\n如你所见，这个容器样式仅由背景颜色组成。在这种情况下，你不需要为页眉容器定义尺寸属性，因此页眉内容（你将在本章稍后创建并导入的图像）的大小将决定页眉的大小。\n\
  \n## 创建侧边栏\n\n在网页上，左侧边栏通常包含菜单，这也是你将使用此侧边栏的方式。然而，位于网页右侧的侧边栏通常包含联系信息、广告、图像或其他不一定是正文内容一部分的内容。例如，在电子杂志中，右侧边栏可能包含相关或支持数据，类似于本书中的侧边栏。\n\
  \n要创建侧边栏，请执行以下步骤：\n\n1. 转到 `index.html`，在 `.header` 标签下方输入以下侧边栏容器标签，如下所示：\n\n```html\n\
  <body>\n<div class=\"container\">\n    <div class=\"header\">\n    <!-- end .header\
  \ --></div>\n    <div class=\"sidebar1\">\n    <!-- end .sidebar1 --></div>\n<!--\
  \ end .container --></div>\n</body>\n```\n\n2. 转到 `chapter7.css`，在页眉样式下方插入一个空行，并输入以下样式：\n\
  \n```css\n.sidebar1 {\n    float: left;\n    width: 25%;\n    background: #666666;\n\
  \    padding-bottom: 10px;\n}\n```\n\n![tip.eps](img/tip_opt.jpeg) 注意此样式中的 `float:\
  \ left` 和 `width: 25%` 标签。两者结合使侧边栏列可调整大小。`float` 选项使列尺寸保持流动，随页面大小调整或在页面缩放时进行调整。`width:\
  \ 25%` 属性声明将该列限制在页面的 25%。还记得你之前使用的 `min width` 属性吗？当你在这里将其与 `width: 25%` 结合使用时，你可以确保无论侧边栏出现在什么设备上，其大小永远不会小于\
  \ 320 像素的 25%（计算结果为 80 像素）。通过这种方式限制布局（使用限制其他标签效果的标签）可以防止浏览器在调整大小时走极端。在这种情况下，如果你允许侧边栏缩至\
  \ 80 像素以下，它将太小而无法容纳你的按钮。\n\n## 创建正文容器\n\n`<body>` 容器（为了冗余，也被称为 `.content` 容器）通常是页面中最大的部分。它主要包含信息，如文章或产品和服务描述。它同样位于主容器内部。\n\
  \n要添加 `<body>` 容器，请执行以下步骤：\n\n1. 转到 `index.html`，在 `.sidebar1` 标签正下方添加以下内容标签，如下所示：\n\
  \n```html\n<body>\n<div class=\"container\">\n    <div class=\"header\">\n    <!--\
  \ end .header --></div>\n    <div class=\"sidebar1\">\n    <!-- end .sidebar1 --></div>\n\
  \    <div class=\"content\">\n    <!-- end .content --></div>\n<!-- end .container\
  \ --></div>\n</body>\n```\n\n2. 转到 `chapter7.css`，在 `.sidebar1` 样式正下方输入此样式：\n\n\
  ```css\n.content {\n    padding: 10px 0;\n    width: 75%;\n    background: #333333;\n\
  \    float: left;\n}\n```\n\n这是浮动列的另一侧：`float` 和 `width` 属性确保内容容器占据页面的另外 75%，并且它同样会随页面大小而调整。你几乎完成了容器的创建。你的文档应该看起来像代码清单\
  \ 7-1 和 7-2。\n\n### 代码清单 7-1：设置页面容器的 HTML 选择器\n\n```html\n<!DOCTYPE html PUBLIC\
  \ \"-//WAPFORUM//DTD XHTML Mobile 1.0//EN\" \"http://www.wapforum.org/DTD/xhtml-mobile10.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=utf-8\" />\n<title>My Mobile-Friendly Stie</title>\n\
  <link href=\"chapter7.css\" rel=\"stylesheet\" type=\"text/css\" />\n<meta name=\"\
  HandheldFriendly\" content=\"True\" />\n</head>\n<body>\n<div class=\"container\"\
  >\n   <div class=\"header\">\n   <!-- end .header --></div>\n```\n\n\n\n\n\n```html\n\
  \   <div class=”sidebar1”>\n   <!-- end .sidebar1 --></div>\n   <div class=”content”>\n\
  \   <!-- end .content --></div>\n   <!-- end .container --></div>\n</body>\n</html>\n\
  ```\n代码清单 7-2：CSS 创建容器样式\n\n```css\n@charset “utf-8”;\n\n.container {\n   width:\
  \ 100%;\n   max-width: 800px;\n   min-width: 320px;\n   background-color: #666;\n\
  \   margin: 0 auto;\n}\n\n.header {\n   background: #666666;\n}\n\n.sidebar1 {\n\
  \   float: left;\n   width: 25%;\n   background: #666666;\n   padding-bottom: 10px;\n\
  }\n\n.content {\n   padding: 10px 0;\n   width: 75%;\n   background: #333333;\n\
  \   float: left;\n}\n```\n\n## 创建页脚\n\n与页眉和侧边栏一样，页脚通常包含在各页面之间保持不变的信息或链接。在这种情况下，您可以添加一个电子邮件链接和一个电话拨号链接，方便访问者通过您的网站与您联系。他们（以及随着这些快乐访问者的增加，您自己）会很高兴您这么做了。\n\
  \n要创建页脚，请按照以下步骤操作：\n\n1. 在 `index.html` 中，添加以下 `footer` 标签：\n\n```html\n<body>\n\
  \   <div class=”container”>\n      <div class=”header”>\n      <!-- end .header\
  \ --></div>\n      <div class=”sidebar1”>\n      <!-- end .sidebar1 --></div>\n\
  \      <div class=”content”>\n      <!-- end .content --></div>\n      <div class=”footer”>\n\
  \      <!-- end .footer --></div>\n   <!-- end .container --></div>\n</body>\n```\n\
  \n2. 转到 `chapter7.css` 并输入以下样式：\n\n```css\n.footer {\n   padding: 10px 0;\n   background:\
  \ #666666;\n   position: relative;\n   clear: both;\n}\n```\n\n太棒了！现在您已经定义好了页面的所有四个部分。如果您现在在浏览器中测试该页面，如图\
  \ 7-5 所示，它看起来没什么特别的，只是几个空盒子。就像任何体面的网页一样，它需要内容！\n\n页脚通常沿页面底部占据全宽，两侧没有任何内容——没有列或任何其他元素。因此，为了确保页脚被推到底部，我们使用了\
  \ `position: relative;`。这简单地使页脚的位置相对于其他容器，意味着它将相应地调整其位置。`clear: both;` 属性“清除”了页脚的两侧；没有任何其他内容或容器可以驻留在页脚的“两侧”。\n\
  \n**图 7-5：** 您目前完成的移动页面。\n![9781118026229-fg0705.eps](img/9781118026229-fg0705_opt.jpeg)\n\
  \n## 使用 CSS 格式化文本\n\nXHTML 包含一组默认标签，例如用于标题的 `<h1>`、`<h2>` 等，以及用于标准段落或正文的 `<p>` 标签。您可以使用\
  \ CSS 样式来修改默认标签或创建全新的文本标签。请记住，许多移动设备不支持大量的 CSS 格式化，并且当您偏离基础设置时，反应并不理想。因此，为了尽可能保持简单，文本格式化操作是您不希望过于花哨的领域之一；过多的装饰往往适得其反。\n\
  \n在为移动设备创建文本样式时，请记住这一点，通常最好的做法是使用 CSS 样式来使用和修改 XHTML 的内置标签，而不是创建全新的标签——这在为大屏幕设计时是一种相当常见的做法。\n\
  \n![remember.eps](img/remember_opt.jpeg) 在设计页面时，请记住浏览器是从左上角向下读取并格式化 HTML 页面的。因此，大多数设计师将所有文本格式化样式放在\
  \ CSS 文件的顶部，确保在浏览器遇到需要这些样式的文本块之前，它们都被读取到内存中。（同样请记住，您可以在相应的容器样式中进一步修改文本或覆盖样式，您将在本章稍后部分学习如何操作。）\n\
  \n正文当然是指文档中的标准段落文本——也就是那些通常不需要像标题、列表、标题说明等那样进行特殊格式化的文案或文本。\n\n以下步骤定义了您网站的基础字体样式：\n\
  \n1. 转到 `chapter7.css` 的顶部，在字符集声明（第一行）之后插入一个空行，然后输入以下 `body` 样式：\n\n```css\nbody\
  \ {\n   font: 100%/1.4 Verdana, Arial, Helvetica, sans-serif;\n   background: #666666;\n\
  \   margin: 0;\n   padding: 0;\n   color: #333333;\n}\n```\n\n![tip.eps](img/tip_opt.jpeg)\
  \ `body` 样式属性 `font: 100%/1.4 Verdana, Arial, Helvetica, sans-serif;` 设置了文档的基础字体。这样写实际上给浏览器提供了几个后备方案，以防用户的系统没有安装所需的字体。浏览器首先尝试寻找并使用第一个字体——在本例中是\
  \ `Veranda`。它首先检查用户的设备是否有该字体。如果该字体不可用，它将尝试下一个字体，依此类推。您应该始终按首选顺序排列字体。例如，这里您非常希望页面使用\
  \ `Veranda`，但这并不总是可行，因此次优字体是 `Arial`，然后是 `Helvetica`，最后是 `sans-serif`（每个设备都有的默认字体）。\n\
  \n除了 `padding` 和 `font` 声明外，大多数属性都显而易见。`padding` 是以像素为单位的，是指使用此样式格式化的元素周围的间距。`font`\
  \ 声明中的 `100%/1.4` 属性告诉浏览器以正文（或默认 `<p>`）文本大小的 100% 显示文本；并将文本行间距设置为 1.4，即文本大小的 14/10。\n\
  \n2. 输入一个空行并输入以下样式：\n\n```css\nul, ol, dl {\n   padding: 0;\n   margin: 0;\n}\n\
  ```\n\n此样式简单地告诉浏览器，不要在您添加到文档的任何有序列表 (`<ol>`)、无序列表 (`<ul>`) 或定义列表 (`<dl>`) 周围设置外边距或内边距。\n\
  \n3. 在列表样式下方插入一个空行并输入以下样式：\n\n```css\nh1, h2, h3, h4, h5, h6, p {\n   margin-top:\
  \ 0;\n   padding-right: 5px;\n   padding-left: 15px;\n   color: #CCC;\n   text-align:\
  \ left; \n}\n```\n\n现在您可能会好奇，为什么要在 `.content` 样式中将外边距和内边距设置为零，然后又在这里为所有标题和段落文本添加\
  \ 15 像素的左右内边距。简单的答案是，这是层叠样式表（Cascading Style Sheets）中“层叠”效果的一部分。您的类样式从最基础的格式开始，然后您可以使用标签选择器和复合选择器来进行特定的格式更改。\n\
  \n4. 转到 `index.html` 并在 `.content` 容器标签之间插入以下标签和文本：\n\n```html\n<div class=”content”>\n\
  \   <h1>Welcome to MySite</h1>\n   <p>Introduce yourself here.</p>\n<!-- end .content\
  \ --></div>\n```\n\n![tip.eps](img/tip_opt.jpeg) 如果您使用 Dreamweaver，可以通过该程序的 Multiscreen\
  \ 选项（如图 7-6 所示）来了解您的页面在各种屏幕尺寸下的外观。\n\n如果您不使用 Dreamweaver，只需在 Web 浏览器中打开 `index.html`，但请确保先保存它和\
  \ `chapter7.css`。（根据您使用的编辑器，您可能需要先在编辑器中关闭这些文档，这也是我更倾向于使用 `UltraEdit` 等源代码编辑器的另一个原因。）\n\
  \n\n\n\n\n如你所见，XHTML 的默认顶级标题 `<h1>` 太大了 —— 尤其是对于屏幕较小的手持设备。有多种方法可以解决这个问题，包括简单地使用下一级标题标签\
  \ `<h2>`。但这只能解决这一个实例中的问题，而且在某种程度上违背了使用外部样式表的初衷。\n\n既然你已经知道标题不合适，你可以创建一个复合样式来修正它。因为这个复合样式修改的是现有的容器，所以它应该放在设置容器的类样式（class\
  \ styles）之下。\n\n图 7-6：你在 Dreamweaver 的多屏幕视图中目前的页面效果。\n\n![9781118026229-fg0706.eps](img/9781118026229-fg0706_opt.jpeg)\n\
  \n5. 在 `chapter7.css` 中，在 `footer` 类样式下方插入一个空行，并输入以下复合样式：\n\n```css\n.container\
  \ .content h1 {\n   font-size: medium;\n}\n```\n\n如果你现在测试页面，标题应该会合适得多。既然你正在创建用于修改容器文本的样式，你应该再添加一个复合样式来重新定义侧边栏文本的颜色。侧边栏具有深灰色背景，因此比黑色更浅的颜色看起来会更好（且更容易阅读）。浅灰色如何？\n\
  \n6. 插入一个空行并输入以下复合样式：\n\n```css\n.container .sidebar1 p {\n   font-family: Arial,\
  \ Helvetica, sans-serif;\n   color: #999;\n   font-size: xx-small;\n   text-align:\
  \ center;\n   line-height: 15px; \n}\n```\n\n## 设计菜单与导航\n\n通过在左侧边栏提供一个菜单，你可以让移动端用户更轻松地找到信息。就像为电脑屏幕设计的菜单一样，为手持设备设计的菜单在能被轻易识别为链接时效果更好。使菜单项或按钮具有可识别性的一种技术是将其设计为能够提供反馈。例如，你可以设置链接和按钮在用户选择或通过\
  \ Tab 键切换到它们时改变颜色 —— 使它们看起来像是被高亮显示了。\n\n另一种经过验证的将文本识别为链接的机制是为其添加下划线。当你创建侧边栏中的菜单以及页脚中的电子邮件和电话链接时，你将使用这两种\
  \ CSS 方法来格式化首页的导航链接。\n\n使用样式表创建菜单的方法有很多。我在这里向你展示的方法是最简单的之一；它创建的也是外观最朴素的菜单之一。不过，朴素简单是好事，尤其是在移动站点设计中。这些菜单不会弹出、爆炸、抖动或跳街舞。相反，它们能高效地完成任务\
  \ —— 为用户提供一种有效的浏览方式，而无需让他们等待大量花哨的图形下载。\n\n### 使按钮和文本链接变为“热点”\n\n如果你做过任何网页设计，那么你一定熟悉用于创建超链接的标准\
  \ `<a href>` 标签。超链接使按钮、图形或字符串变为“热点” —— 即可点击的。例如，本设计菜单列表中的每个项目都包含一组 `<a href></a>`\
  \ 标签。在这个示例中，你可以通过将井号 (`#`) 替换为有效的 URL，使每个列表项链接到互联网上的任何页面或 URL。\n\n```html\n<li><a\
  \ href=\"http://www.myblog.com\">Blog</a></li>\n```\n\n`</a>` 标签关闭超链接，而 `<a href>`\
  \ 和 `</a>` 之间的元素（在本例中是单词 `Blog`）就变成了实际可点击的超链接。你也可以用这种方法将图像转换为超链接，我将在本章稍后部分向你展示。\n\
  \n另外还有两种非常实用的超链接：`mailto` 和 `tel`。第一个 `mailto` 允许你创建可点击的电子邮件链接。当用户选择一个配置了 `mailto`\
  \ 的对象时，其浏览器会与计算机的默认邮件客户端交互，向超链接中指定的地址发送电子邮件。例如：\n\n```html\n<a href=\"mailto:bill@williamharrel.com\"\
  >bill@williamharrel.com</a>\n```\n\n... 这将启动 Outlook 的新邮件窗口，并在“收件人”字段中填入电子邮件地址 `bill@williamharrel.com`。\n\
  \n`tel` 标签在手机上极其有用，它创建的链接在被点击时，会自动拨打超链接中配置的号码。该标签的配置与 `mailto` 非常相似：\n\n```html\n\
  <a href=\"tel:555-555-555\">555-555-5555</a>\n```\n\n对于用户来说，这两个超链接看起来就像任何其他文本链接一样。\n\
  \n![9781118026229-sb0702.tif](img/9781118026229-sb0702_opt.jpeg)\n\n## 创建菜单列表\n\n\
  创建菜单项的一种方法是使用简单的 HTML 无序列表，它使用 `<ul>` 和 `<li>` 标签。\n\n要创建菜单列表，请遵循以下步骤：\n\n1. 转到\
  \ `index.html` 中的 `<div class=\"sidebar1\">` 标签，并在 `<div>` 标签之间输入以下列表标签和文本，如下所示：\n\
  \n```html\n<div class=\"sidebar1\">\n   <ul class=\"nav\">\n      <li><a href=\"\
  #\">Blog</a></li>\n      <li><a href=\"#\">Services</a></li>\n      <li><a href=\"\
  #\">About Us</a></li>\n      <li><a href=\"#\">Contact Us</a></li>\n   </ul>\n<!--\
  \ end .sidebar1 --></div>\n```\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\
  \ \n\n顺便提一下，上述代码中的井号 (`#`) 是占位符。通常情况下，你会直接输入菜单项所链接的 URL。\n\nHTML 和 XHTML 都支持无序列表和有序列表（有序列表\
  \ `<ol>` 是带编号的列表）。`<ul>` 标签建立列表。`<li></li>` 标签对定义单独的列表项，而 `</ul>` 标签表示列表结束。\n\n\
  请注意，起始的 `<ul>` 标签调用了一个名为 `nav` 的类。`<div class=\"nav\">` 标签告诉浏览器：创建一个无序列表并使用 `nav`\
  \ 类对其进行格式化。\n\n2. 转到 `chapter7.css`，在 `.container .sidebar p` 样式下方插入一个空行，并插入以下样式：\n\
  \n```css\nul.nav {\n   list-style: none;\n   border-top: 1px solid #666;\n   margin-bottom:\
  \ 15px;\n}\n\nul.nav li {\n   border-bottom: 1px solid #666;\n}\n\nul.nav a, ul.nav\
  \ a:visited {\n   padding: 5px 5px 5px 15px;\n   display: block;\n   text-decoration:\
  \ none;\n   background: #666666;\n   color: #CCCCCC;\n}\n\nul.nav a:hover, ul.nav\
  \ a:active, ul.nav a:focus {\n   background: #999999;\n   color: #FFF;\n}\n```\n\
  \n![tip.eps](img/tip_opt.jpeg) 从表面上看，这些样式很复杂。但它们的作用仅仅是将你的无序列表转换为按钮。最后两个选择器用于控制用户交互期间按钮的外观，这需要一些解释：\n\
  \n\n\n\n\n![check.png](img/check.png) `ul.nav a, ul.nav a:visited` 控制用户访问该链接后菜单项的显示方式。换句话说，如果用户已经访问过该链接，文本将以不同的颜色显示。（不过，并非所有移动设备都支持此选项。当制造商和浏览器发布者为了节省资源而舍弃某些功能时，这类细微的差别往往会被忽略。）\n\
  \n![check.png](img/check.png) `ul.nav a:hover, ul.nav a:active, ul.nav a:focus`\
  \ 控制按钮在鼠标悬停时，或在移动设备上处于激活状态时的显示方式。在本例中，当用户导航到某个菜单项时，文本和背景会改变颜色，以此指示当前哪个按钮处于激活状态，或即将被选中（点击）。这相当于标准计算机上的“滚轮效果（rollover）”——即用户将鼠标光标悬停在按钮上的情况。按照目前的写法，此样式适用于标准计算机浏览器和移动浏览器。\n\
  \n如果你现在测试页面，你的菜单看起来会更像一个真正的菜单，并且当你悬停在每个菜单项上时，它会高亮显示，如图 7-7 所示。在标准计算机上，你可以通过将鼠标指针悬停在菜单项上看到滚轮效果。当然，移动用户无法进行悬停操作，但当他们在手持设备上触摸按钮或使用导航键切换到按钮时，每个按钮都会高亮显示。\n\
  \n图 7-7：高亮显示的菜单项。\n![9781118026229-fg0707.eps](img/9781118026229-fg0707_opt.jpeg)\n\
  \n## 创建页脚链接\n\n该站点导航方案的两个重要部分是页脚中的电子邮件和电话链接。要创建这些链接，请使用随附侧边栏（“使按钮和文本链接可点击”）中讨论的\
  \ `mailto` 和 `tel` 标签。然后，创建一个复合样式，将页脚链接的文本颜色更改为与侧边栏中的文本颜色一致。\n\n要创建页脚链接，请执行以下步骤：\n\
  \n1. 打开 `index.html`，在页脚容器标签之间插入以下标签和文本：\n```html\n<p><a href=”mailto:bill@williamharrel.com”>yourEmail@yourDomail.com</a>\
  \ - <a href=”tel:555-555.5555”>555-555.5555</a></p>\n```\n\n2. 打开 `chapter1.css`，在\
  \ `.container .content h1` 样式下方放置以下复合样式：\n```css\n.container .footer p a {\n   font-size:\
  \ small;\n   color: #CCC;\n}\n```\n\n## 在布局中添加图像\n\n为了完善你的布局，你应该在页面顶部添加一个横幅图像。页眉容器旨在适应任何高度的图像；但为了保持页眉与布局其余部分的比例，其高度最好不要超过\
  \ 70 像素。页眉图像的长度也可以是任意的——最高可达 800 像素的最大页面尺寸。不过，我不建议将其设置为超过 320 像素。你肯定不希望访问者为了看到横幅而滚动页面。从用户的角度来看，这相当烦人，更不用说这通常会大大降低横幅的有效性。你可以使用从本书配套网站下载的\
  \ `logo.jpg` 图像文件。步骤如下：\n\n1. 打开 `chapter7.css`，在第一个容器样式上方添加以下样式：\n```css\na img\
  \ {\n   border: none;\n}\n```\n当然，此样式只是为了确保如果你将图像设置为可点击链接，浏览器不会在其周围显示边框。\n\n2. 打开\
  \ `index.html`，在页眉容器标签之间输入以下文本和标签：\n```html\n<a href=”index.html” class=”header”><img\
  \ src=”images/logo.jpg” alt=”Return to Home Page” /></a>\n```\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 一种常见的设计技巧是将 Logo 或横幅图像链接到站点的首页，这样无论用户在站点的哪个位置，都可以通过点击横幅返回站点顶部。标签 `<a href=”index.html”\
  \ class=”header”>` 将横幅图像变成一个可点击的按钮，用于加载 `index.html`，而 `alt=“Return to Home Page”`\
  \ 属性则作为悬停或选中时的工具提示类消息出现，告知用户链接的目的地。\n\n完整的 `index.html` 文件和 `chapter7.css` 文件见代码清单\
  \ 7-3 和 7-4。\n\n### 代码清单 7-3：完整的 `index.html` 文件\n```html\n<!DOCTYPE html PUBLIC\
  \ “-//WAPFORUM//DTD XHTML Mobile 1.0//EN” “http://www.wapforum.org/DTD/xhtml-mobile10.dtd”>\n\
  <html xmlns=”http://www.w3.org/1999/xhtml”>\n<head>\n<meta http-equiv=”Content-Type”\
  \ content=”text/html; charset=utf-8” />\n<title>My Mobile -Friendly Site</title>\n\
  <link href=”chapter7.css” rel=”stylesheet” type=”text/css” media=”screen” />\n<meta\
  \ name=”HandheldFriendly” content=”True” />\n</head>\n<body>\n<div class=”container”>\n\
  \   <div class=”header”>\n     <a href=”index.html” class=”header”><img src=”images/logo.jpg”\
  \ alt=”Return to Home Page” /></a>\n   <!-- end .header --></div>\n   <div class=”sidebar1”>\n\
  \      <ul class=”nav”>\n          <li><a href=”#”>Blog</a></li>\n          <li><a\
  \ href=”#”>Services</a></li>\n          <li><a href=”#”>About Us</a></li>\n    \
  \      <li><a href=”#”>Contact Us</a></li>\n   <!-- end .sidebar1 --></div>\n  \
  \ <div class=”content”>\n     <h1>Welcome to MySite</h1>\n     <p>Introduce yourself\
  \ here.</p>\n   <!-- end .content --></div>\n   <div class=”footer”>\n      <p><a\
  \ href=”mailto:bill@williamharrel.com”> yourEmail@yourDomail.com</a> - <a href=”tel:555-555.5555”>555-555.5555</a></p>\n\
  \   <!-- end .footer --></div>\n<!-- end .container --></div>\n</body>\n</html>\n\
  ```\n\n### 代码清单 7-4：完整的 `chapter7.css` 文件\n```css\n@charset “utf-8”;\n/* CSS Document\
  \ */\nbody {\n   font: 100%/1.4 Verdana, Arial, Helvetica, sans-serif;\n   background:\
  \ #666666;\n   margin: 0;\n   padding: 0;\n   color: #333333;\n}\nul, ol, dl {\n\
  \   padding: 0;\n   margin: 0;\n}\nh1, h2, h3, h4, h5, h6, p {\n   margin-top: 0;\n\
  \   padding-right: 5px;\n   padding-left: 15px;\n   color: #CCC;\n   text-align:\
  \ left;\n}\n.container {\n   width: 100%;\n   max-width: 800px;\n   min-width: 320px;\n\
  \   background: #666;\n   margin: 0 auto;\n}\n.header {\n   background: #666;\n\
  }\n.sidebar1 {\n   float: left;\n   width: 25%;\n   background: #666666;\n   padding-bottom:\
  \ 10px;\n}\n.content {\n   padding: 10px 0;\n   width: 75%;\n   background: #333333;\n\
  \   float: left;\n}\n.footer {\n   padding: 10px 0;\n   background: #666666;\n \
  \  position: relative;\n   clear: both;\n}\n.container .content h1 {\n   font-size:\
  \ medium;\n}\n.container .footer p a {\n   font-size: small;\n   color: #CCC;\n\
  }\n.container .sidebar1 p {\n   font-family: Arial, Helvetica, sans-serif;\n   color:\
  \ #999;\n   font-size: xx-small;\n   text-align: center;\n   line-height: 15px;\n\
  }\nul.nav {\n   list-style: none;\n   border-top: 1px solid #666;\n   margin-bottom:\
  \ 15px;\n}\nul.nav li {\n   border-bottom: 1px solid #666;\n}\nul.nav a, ul.nav\
  \ a:visited {\n   padding: 5px 5px 5px 15px;\n   display: block;\n   text-decoration:\
  \ none;\n   background: #666666;\n   color: #CCCCCC;\n}\nul.nav a:hover, ul.nav\
  \ a:active, ul.nav a:focus {\n   background: #999999;\n   color: #FFF;\n}\na img\
  \ {\n   border: none;\n}\n```\n\n# 第 8 章：使用模板\n\n## 本章内容\n![arrow](img/arrow.png)\
  \ 通过使用模板保持一致性\n![arrow](img/arrow.png) 使用模板节省时间和金钱\n![arrow](img/arrow.png) 了解预制第三方模板的优势\n\
  ![arrow](img/arrow.png) 使用 Dreamweaver 模板\n![arrow](img/arrow.png) 使用服务器端模板\n\n\
  如果你使用计算机超过十分钟，你应该知道什么是模板，对吧？例如，Microsoft Word 提供了从非正式信函到法律摘要等各种内容的创建模板。通常，模板是一个空的文档外壳，包含一组预设的样式或样式表，用于指定内容的格式。\n\
  \n\n\n\n\n虽然 XHTML 模板在概念上很相似，但在实践中却大不相同。例如，与典型的 Word 模板（打开它，添加内容，然后将其保存为文档文件）不同，XHTML\
  \ 模板——尤其是那些使用 `CSS` 格式化的模板——通常由几个不同的文件组成。例如，一个网页引用两个或更多 `CSS` 文件是很常见的。网页还可以依赖多个不同的文档文件来组成单个页面的各个部分——如页眉、侧边栏、页脚、正文等等。\n\
  \n在本章中，我们将探讨如何使用模板创建网站的基本结构。使用模板构建网站有许多方法——从简单的静态且可重复使用的通用 `HTML` 文件，到成熟的模块化站点（其中每个页面由几个不同的文件组成，称为“包含文件”/includes）。\n\
  \n与 Web 设计的许多方面一样，在网站中使用包含文件要求你超越基础的 `HTML` 和 `CSS` 编码，进行少量的编程——但结果绝对值得这些努力。因此，在本章中，我们将这样做——超越基础的\
  \ `HTML` 和 `CSS` 编码——并向你展示如何创建 `PHP` 服务端模板结构。\n\n## 理解为什么专业人士依赖模板\n\n你是否遇到过这样一个网站：每当你点击一个链接，都会跳转到一个外观完全不同、配色方案和导航布局全部更新的页面？我遇到过。每个新页面就像访问一个不同的国家。更糟糕的是，每个新页面都要求访问者重新熟悉布局，并弄清楚如何浏览和查找信息。最重要的是——尤其是在移动端站点上——你的站点设计应当让内容易于查找。实现这一目标的方法之一是在整个站点中保持一致的“外观和感觉”（look\
  \ and feel）。虽然内容本身可能不同，但站点本身的整体风格、外观和感觉在整个站点中应保持一致。\n\n设计并坚持一种结构是模板帮助你创建专业外观网站的众多方式之一。在研究创建和使用模板的实践之前，让我们简要看看为什么专业设计师依赖它们——模板如何为你节省时间和金钱，并帮助你创建和维护专业外观的站点：\n\
  \n### 控制一致性\n![check.png](img/check.png) 好了。那么，这看起来像是我在唠叨吗？嘿，我说的不仅仅是为了好看而让每个页面看起来相似。完全不是。想想你使用网站的方式。当你浏览首页时，你的大脑正在记录关于内容如何组织的信息：顶部的菜单或侧边的菜单是做什么的？它们有子菜单吗？页面底部是否有与整体菜单结构相匹配的导航链接？我该如何联系这些人？\n\
  \n在设计良好的站点上，这种结构是不变的。在你的站点上仅花费几分钟后，用户应该能够切换状态，并直观地知道接下来如何到达她想去的地方。\n\n### 更简单的更新\n\
  ![check.png](img/check.png) 互联网的一个巨大优势是，与印刷材料不同，Web 内容可以（或应该）被轻松更新。许多网站每天、甚至每小时、每分钟或每秒都在变化。如果不是因为设计良好的模板，这种持续的、事件驱动的更新将是不可能的。这些网站的内容更新人员仅处理内容，很少考虑它是如何格式化和呈现的。如果他们必须关注模板所处理的任务，他们的工作以及结果（所有那些闪电般快速更新的内容）将变得极其复杂，更耗时，且一致性大大降低。\n\
  \n### 更简单的扩展\n![check.png](img/check.png) 你永远不知道网站项目的范围何时会发生变化。在好几次情况下，客户向我提出对站点的修改建议——一个新产品线、一个购物车等等——这瞬间将一个小型、易于管理的网站变成了一个巨大的、工作密集型的企业级站点。在此时，你会庆幸自己花时间和精力围绕一个可靠的模板系统设计了即使是最简单的站点，而不是随便拼凑几个页面就进入下一个项目。\n\
  \n### 避免错误\n![check.png](img/check.png) 任何设计环境中的一个基本真理是：编辑次数越多，项目中引入错误的概率就越大。假设你的站点有\
  \ 25 个页面，而你需要对所有 25 个页面进行相同的更改。这意味着有 25 次出错的机会。模板、外部 `CSS`、包含文件——所有这些工具都能帮你避免错误。（反面情况当然是，如果你在模板资源中犯了一个错误，这个错误将出现在所有\
  \ 25 个页面上。但那样的话，纠正错误也会容易得多。）\n\n### 节省时间和金钱\n![check.png](img/check.png) 说到底，尽可能快速、高效地完成最高质量的工作，难道不总是关注列表的首位吗？大多数网站需要长期的投入。我今天维护和更新的站点，有的是我近\
  \ 20 年前设计并发布的。花时间思考、计划并执行站点的结构，有时看起来像是多余的工作和浪费时间——而且，有时你可能很难说服客户这额外的几个设计小时是必要的。走捷径往往会让你进入黑暗、蜿蜒、难以导航的道路，或者带你进入死胡同，在那里你唯一能做的就是转身原路返回。一个可靠的模板结构可以节省你宝贵的时间。作为一名设计师，你的时间确实是你最重要的资产。\n\
  \n## 使用预制的第三方模板\n\n使用模板的一个巨大优势是，有大量预制的、第三方专业设计的模板可供选择。在 Google 上简单搜索“web templates”就会出现海量结果，多到你看着它们都会变老。许多是免费的，或者价格如此低廉，以至于在\
  \ Web 设计项目的整体方案中，它们几乎等同于免费。\n\n网络上有许多第三方模板站点，而且经营得非常好。为什么？因为许多专业设计师更倾向于使用这些站点销售的模板，而不是完全从零开始（那样很耗时）。以\
  \ [`TemplateMonster.com`](http://TemplateMonster.com) 等站点为例（如图所示）。这类站点以合理的价格提供数百个设计精良的\
  \ `HTML` 模板。你所要做的就是将预设内容替换为你自己的，进行任何你想要的设计更改，然后——砰！——你就拥有了一个专业设计的网站，而花费的时间仅为从零开始的一小部分。（第\
  \ 20 章提供了一个寻找第三方 Web 模板的十个优秀资源列表。）\n\n![9781118026229-sb0801.eps](img/9781118026229-sb0801_opt.jpeg)\n\
  \n你可能会担心别人使用同一个模板，导致你的站点看起来太像竞争对手的站点。首先，这种情况极不可能发生——在我设计网站的所有年岁里，我从未见过这种情况。此外，对这些模板进行颜色、字体以及其他设计和布局的更改非常容易；它们赋予你足够的灵活性，使其成为你独有的风格。\n\
  \n这就把我们带到了选择第三方模板时一个非常重要的考虑因素：确保它有完善的文档。事实上，在购买模板之前，尽量先查看文档。如果做不到这一点，请尝试达成一项退货协议，以便在文档不足以让你在无需大量试错的情况下进行更改时，你可以改变主意。毕竟，重点是为了节省时间，对吧？\n\
  \n## 使用 Dreamweaver 模板\n\n\n\n\n## 使用 Dreamweaver 模板\n\n诸如 Dreamweaver 这样的设计程序自带许多美观的模板。预制模板不仅能节省大量时间，还能为初学者提供学习如何构建\
  \ `HTML` 页面及配套 `CSS` 文件的绝佳方式。Dreamweaver 自带的模板非常灵活，易于根据你的需求进行调整。此外，还有数百种专门为在 Dreamweaver\
  \ 中修改而设计的第三方预制模板。（请参阅侧栏，\"使用第三方预制模板\"。）\n\n![warning_bomb.eps](img/warning_bomb_opt.jpeg)\
  \ 许多并非为网页设计而构建的程序——如 Microsoft Word、PowerPoint 和 Excel——允许你将文档保存为 `HTML` 或其他网页格式。这里有一个忠告：不要试图使用这些程序作为网页设计工具。例如，Word\
  \ 生成的代码极其\"混乱\"——充满了大量冗余内容，以至于 Dreamweaver 有一个专门的导入功能，专门用于\"清理\"从 Word 保存为 `HTML`\
  \ 的文件。相信我：Word 不是网页设计程序。就是这样。\n\n即使我大部分时候是手工编写网站代码，我也几乎总是从设置和修改 Dreamweaver 模板的基本框架开始。为什么？因为这是一种很好的方式来快速建立结构——如页面和容器布局、标记语言类型、`CSS`\
  \ 文件等——同时还能节省一两个小时。当然，你可以手工完成所有这些（如果你没有 Dreamweaver 或能够完成这些前期工作的源代码编辑器，你就必须这样做），但既然不需要，为什么还要做更多工作、花更多时间呢？（我也用洗碗机！）\n\
  \n## Dreamweaver 的新建文档对话框\n\n如果你不熟悉网页设计，Dreamweaver 的新建文档对话框（如图 8-1 所示）可能看起来有点吓人——里面有很多东西。不过，从另一个角度来看，你可以用它来设置模板和\
  \ `CSS` 文件，然后查看源代码，了解某些页面功能是如何实现的。让我们让 Dreamweaver 为我们创建一个布局，然后看看它是如何组织页面的。只需按照以下步骤操作：\n\
  \n`图 8-1`：Dreamweaver 新建文档对话框是开始创建模板的好地方。\n\n![9781118026229-fg0801.eps](img/9781118026229-fg0801_opt.jpeg)\n\
  \n1. 点击 `File`（文件）菜单，选择 `New`（新建）。\n如你所见，Dreamweaver 允许你创建各种类型的文件，包括 `HTML`、`CSS`、`JavaScript`\
  \ 和 `PHP`，这是我们在本章（以及本书其余部分）使用的四种文件类型。\n\n2. 在 `Page Type`（页面类型）列中，选择 `HTML`，然后在\
  \ `Layout`（布局）列中，选择 `2 Column Liquid, Left Sidebar, Header and Footer`（两列液态，左侧边栏，标题和页脚）。\n\
  右侧的小预览（如图 8-2 所示）向你展示了布局——顶部是标题栏，底部是页脚栏，边栏和内容区域在边栏的右侧。总共有四个容器（如果算上页面本身，则是五个）。内容容器上的百分比符号表示两个垂直容器——边栏和内容容器——是液态的，这意味着这些列是自适应的；它们会根据浏览器窗口的大小调整自身尺寸——而其他列保持固定，即相同的大小，不会随浏览器窗口调整。\n\
  \n`图 8-2`：此预览向你展示所选内容的容器布局。\n\n![9781118026229-fg0802.eps](img/9781118026229-fg0802_opt.jpeg)\n\
  \n3. 点击 `DocType` 下拉菜单，选择 `XHTML 1.0 Transitional`。\n你可能已经注意到有一个 `XHTML Mobile 1.0`\
  \ 文档类型（文档类型在第 2 章和第 7 章中讨论）。我的经验是它太严格了，不允许某些 `CSS` 格式在新设备上显示。所以，我更倾向于用 `CSS` 样式来控制格式，而不是\
  \ Dreamweaver 的移动设备文档类型。\n\n4. 点击 `Layout CSS` 下拉菜单，选择 `Create New File`（创建新文件）。\n\
  注意，这里还有一个 `Link To Existing File`（链接到现有文件）选项，如果你正在为已有 `CSS` 样式表的现有网站创建新的页面模板，可以使用这个选项。在新网站中（你马上就会看到），`Create\
  \ New File` 选项会启动一个新的外部 `CSS` 文件。\n\n5. 点击 `Create`（创建）。\n\n6. Dreamweaver 根据你选择的布局为\
  \ `CSS` 文件建议一个名称。\n我不太喜欢这个命名方案，所以我在这里直接重命名了这个文件。稍后你会看到，Dreamweaver 创建的外部 `CSS` 文件包含所有必要的标签，用于格式化这些容器及其内容（其中的文本和图形）。\n\
  \n当你完成这五个简单的步骤时，实际上你已经完成了多项手动操作需要花费大量时间才能完成的任务。在短短几分钟内，Dreamweaver 就完成了以下任务：\n\n\
  ![check.png](img/check.png) 创建了一个 `HTML` 页面，包含布局标题、边栏、内容和页脚容器所需的所有必要代码。\n![check.png](img/check.png)\
  \ 创建了所有必要的 `CSS` 选择器，用于格式化这些容器内的文本。（当然，格式可能不完全是你想要的，但修改标签比创建标签要容易得多。）\n![check.png](img/check.png)\
  \ 创建了一个带有类似翻转按钮菜单的边栏。我们只需要更改按钮文本并创建链接即可。\n![check.png](img/check.png) 创建了一个外部 `CSS`\
  \ 样式表，其中包含所有基本的格式化标签，以及大量注释来指导你编辑样式以满足你的需求。\n![check.png](img/check.png) 创建了\"占位符\"\
  内容，为你提供页面整体外观的视觉参考。\n![check.png](img/check.png) 但还有更多！如果你对这些都不熟悉，它执行了大量你需要研究和实验才能走到这一步的功能。相反，你现在已经有了一个可用的模型可以学习。\n\
  \n## 完成的模板文件\n\n如图 8-3 所示，Dreamweaver 创建了一个相当基本的页面。（有一件事我不太喜欢，那就是 Adobe 设计师为这些布局选择的配色方案，但这些很容易更改。）每个容器内的占位符文本描述了布局的各个方面，并提供了修改格式和内容的建议。还要注意代码视图中的\
  \ `<div class=>` 标签。这些标签用于设置容器本身，如第 7 章所述。\n\n从技术上讲，用 Dreamweaver 的术语来说，这不是 Dreamweaver\
  \ 所谓的\"模板\"。（Dreamweaver 模板本身是不同的事物。）相反，你拥有的是两个文件：页面文件本身和一个带有 `.css` 扩展名的文件。就我们的目的而言，这是你模板的开始。从这里开始，你将开始用你自己的内容替换占位符内容——标志、菜单标签和链接、标题和页脚内容——然后保存文件。在第\
  \ 7 章中讨论了如何进行所有这些更改。\n\n当你替换了所有内容并保存文件后，这就成了你的模板。每个页面唯一变化的是 `.content` 容器中的内容。你只需打开页面，用不同的名称保存，然后创建你的正文内容。\n\
  \n`图 8-3`：Dreamweaver 创建了一个基本的\"空白\"页面并创建了一个配套的 `CSS` 文件——创建网站所需的一切都已创建完成。\n\n![9781118026229-fg0803.eps](img/9781118026229-fg0803_opt.jpeg)\n\
  \n![tip.eps](img/tip_opt.jpeg) 查看 `HTML` 文件和 `CSS` 文件，检查容器是如何创建的，以及文本是如何格式化的。如果你手工创建模板，这就是你用来设置列和其他容器的基本结构。注意，`CSS`\
  \ 文件中有大量注释，描述了每个样式的功能和用法，以及更改样式的一些建议。图 8-4 显示了一个通过修改此 Dreamweaver 创建的模板而创建的网站。\n\
  \n\n\n\n**图 8-4：** 右图：Dreamweaver 生成的模板示例。左图：该模板适配到移动端站点后的样子。\n\n![9781118026229-fg0804.eps](img/9781118026229-fg0804_opt.jpeg)\n\
  \n# 选择合适的模板结构\n\n构建网站模板系统有多种方法。在本节中，我们将探讨两种最常见的方法：创建在每个新页面中重复使用的静态模板文件，以及通过组装由多个部分组成的页面来创建动态模板系统。这两种方法各有优劣。\n\
  \n## 创建静态模板文件\n\n这种方法是创建一个包含所有必要元素的文件，并将其用于站点的每个新页面，最适合小型站点。这种方法的主要缺点是，如果你需要修改组成模板文件的任何元素，那么每个使用该模板文件的页面都需要随之更改。\n\
  \n![tip.eps](img/tip_opt.jpeg) 这并没有听起来那么糟糕。如果你使用 Dreamweaver 或 UltraEdit 等源代码编辑器，这些程序具有搜索和替换功能，允许你一次在多个（甚至数千个）文件中查找并替换文本和代码。你只需要在构建搜索和替换标准时非常小心。换句话说，在点击“全部替换”之前，请务必确认更改内容已正确构建。\n\
  \n图 8-4 中的网站就是静态模板文件的一个很好的例子。该站点仅由五个页面组成，且只有 `.content` 容器在页面之间发生变化。我设计此类模板的方法是先设计首页，然后将其（或其副本）作为模板文件。\n\
  \n## 创建模块化模板文件\n\n我所说的“模块化”在技术术语中称为“包含文件”（includes）。包含文件是页面的片段或模块。例如，请看图 8-5。是的，我知道这看起来和图\
  \ 8-4 中的页面一样——本质上确实如此。然而，它的创建（或者你可以说“组装”）方式不同：它不是由一个 HTML 文件组成，而是由三个 PHP 文件组成；侧边栏和页脚都是包含文件。\n\
  \n**图 8-5：** 由一组包含文件创建的模块化网页。\n\n![9781118026229-fg0805.eps](img/9781118026229-fg0805_opt.jpeg)\n\
  \n![tip.eps](img/tip_opt.jpeg) 你可能会好奇为什么页眉也不是一个包含文件。如果你思考一下，页面的这个部分已经是模块化的了，因为它仅由公司徽标（一个单一的图形文件）组成。如果公司更改了徽标，在这种情况下更改页眉只需编辑该图形即可。但是，如果这个页眉包含（例如）一个横跨页面顶部的菜单，那么为页眉创建包含文件将是审慎之举。随附的侧边栏提供了在\
  \ Dreamweaver 中创建包含文件的快速指南。\n\n那么，为什么你应该这样构建页面呢？你可能已经知道答案了。如果（在以后）你需要更改或扩展菜单，或者更改页脚信息，你只需要更改包含文件即可。这些更改将自动影响站点中使用此模板的每个页面——即使你的站点由一百万个左右的页面组成！\n\
  \n坦率地说，出于多种充分的理由，实现这一点的唯一无缝方式是使用服务器端包含（server-side includes）。虽然可以使用 JavaScript 来创建包含文件，但由于并非所有移动设备都支持\
  \ JavaScript，因此使用它们没有太大意义。特别是当你考虑到服务器端方法如此易于使用，且无论访问者设备支持什么技术都无关紧要时。\n\n所以，话虽如此，请记住：要使用这种类型的模板，托管移动站点的服务器必须支持\
  \ PHP。大多数托管公司的服务器都支持。虽然你还可以使用其他一些技术来实现此目的，例如 Microsoft Server 的 Active Server Pages\
  \ (`ASP`)，但 `PHP` 是目前应用最广泛且支持最全面的。\n\n### 使用 Dreamweaver 的库（资源）技术创建包含文件\n\n如果你使用\
  \ Dreamweaver，它有一个内置的创建包含文件的功能，称为“库”（Library）。这是 Dreamweaver 特有的，库由你可以在页面中重复使用的“资源”（assets）组成。库资源的扩展名为\
  \ `.lbi`，并保存在 Library 子目录中。这项技术使用了 CSS 选择器，除了非常易于使用外，效果也非常好——只要（当然）用户的移动设备支持 CSS。使用方法如下：\n\
  \n1. 首先创建你希望在包含文件中出现的内容，包括链接以及样式表未处理的特殊格式。\n（没错！你可以使用与格式化文档其余部分相同的 CSS 文件来格式化你的包含文件！）例如，我们医疗中心站点的页脚包含文件内容如下：\n\
  \n```html\n<p><a href=”mailto:info@spinecenter.com”>info@spinecenter.com</a> - <a\
  \ href=”tel:805-377-7900”>805-375-7900</a></p>\n```\n\n这和你将其插入主文档时的格式化方式完全一样，对吧？\n\
  \n2. 转到 Dreamweaver 的“资源”面板（位于“文件”面板旁边，除非你更改了 Dreamweaver 的默认工作区），然后点击“库”图标（看起来像一本打开的书）。\n\
  3. 点击面板右下角的“新建库项目”按钮，然后为新的库资源命名。\n4. 复制你为该资源创建的内容，包括所有代码。\n5. 点击“资源”面板右下角的“编辑”按钮。\n\
  6. 如果 Dreamweaver 尚未处于“拆分”视图，请点击文档窗口左上角的“拆分”，然后将内容粘贴在现有代码的底部。\n\n好了——你现在拥有了一个可以随心所欲部署的新资源。要使用库项目，请执行以下步骤：\n\
  \n7. 将光标置于文档中你希望插入包含文件的位置。\n8. 点击“资源”面板底部的“插入”按钮。\n\n就这样！只要用户的设备支持 CSS，你的新包含文件就能正常工作。（如果用户的设备不支持\
  \ CSS，你无论如何都应该引导他们离开这个页面。）\n\n### 服务器端包含\n\n如前所述，让服务器来完成这项工作才是唯一万无一失的方法。此外，当你为手持设备创建内容时，尽可能多地将处理过程移交给服务器总是一个好主意，这样就不会给设备过度劳累的小大脑增加压力。\n\
  \n创建和部署服务器端包含是一个两步过程。首先，你创建内容并保存，然后在文档中引用该内容文件。现在让我们来操作：\n\n1. 开始创建一个新的空白文本文档。\n\
  除了链接和任何覆盖格式外，你可以使用与主内容页相同的 CSS 文件来格式化包含文件内容。事实上，你的包含文件不需要任何额外的代码，例如 `<html>`、`<head>`、`<body>`\
  \ 等。如果你是用 Dreamweaver 创建的新页面，请直接删除页面上的所有内容。\n2. 在空白页面上创建包含文件的内容。\n3. 将包含文件保存为 `.php`\
  \ 扩展名。\n例如，如果你在创建侧边栏包含文件，可以将其命名为 `sidebar.php`。\n4. 在主文档文件的代码中找到你想要插入包含文件的位置，然后输入以下代码：\n\
  \n```php\n<?php include(“includes/filename.php”); ?>\n```\n\n这里的示例假设你为包含文件创建了一个名为\
  \ `includes` 的子目录——这是一个好主意，尤其是当你的站点有多个包含文件时。当然，代码放置的位置取决于页面的布局。在我们一直在处理的医疗中心页面中，你会将包含代码放置在容器\
  \ `<div class>` 标签之间，如清单 8-1 所示。\n\n清单 8-1：在主网页中部署侧边栏和页脚包含文件\n\n```html\n<body>\n\
  <div class=”container”>\n```\n\n\n\n\n\n```html\n   <div class=”header”><a href=”index.html”\
  \ target=”_self”><img src=”images/logo.png” alt=”Logo” name=”Home Page” width=”320”\
  \ height=”32” vspace=”10” align=”center” id=”Insert_logo” style=”background: 000000;\
  \ display:block;” /></a>\n   <!-- end .header --></div>\n   <div class=”sidebar1”>\n\
  \      <!--#include file=”includes/sidebar.php” -->\n   <!-- end .sidebar1 --></div>\n\
  \   <div class=”content”>\n      <h1>移动版加州脊柱研究所</h1>\n      <p><img src=”images/CSIeveninga.jpg”\
  \ alt=”CSI” width=”175” height=”136” hspace=”5” align=”left” />欢迎访问加州脊柱研究所（CSI）的移动版网站。CSI\
  \ 由 John C. Chiu 博士创立，是位于加利福尼亚州千橡市的超现代、最先进的微创脊柱手术（MISS）中心。MISS 是传统开放式背部手术的侵入性更小、创伤更小的替代方案。Chiu\
  \ 博士是 MISS 手术的先驱和共同开发者。<br /></p>\n   <!--end .content --></div>\n   <div class=”footer”>\n\
  \      <?php include(“includes/footer.php”); ?>\n   <!--end .footer --></div>\n\
  <!-- end .container --></div>\n</body>\n</html>\n```\n\n## 模板主题的变体\n\n这个系统虽然能与大多数移动网站良好配合，但并非一刀切的解决方案（有什么是万能的呢？）。根据您网站的复杂程度，您可能需要多个模板和多组包含文件。许多网站有不同部门，每个部门可能有略微不同的菜单和页面结构。此外，您可能还需要以多种不同语言呈现相同内容。\n\
  \n关键在于，这个模板系统能帮助您起步，并且它设计得易于扩展。\n\n# 第三部分：通过高级交互与多媒体增强您的网站\n\n![9781118026229-pp0301.eps](img/9781118026229-pp0301_opt.jpeg)\n\
  \n### 本部分内容……\n\n本部分将带您超越简单的导航按钮，深入移动网站的高级功能。首先介绍交互式 HTML 表单，然后探讨如何在网站中使用多媒体——图像、数字视频和\
  \ Flash——从媒体文件格式的讨论开始（哪些格式最佳？为什么？以及如何将它们加载到页面中并设置格式？）。\n\n本部分最后讨论新技术，如`HTML5`、`CSS3`和`WebKit`扩展。掌握这些技术可以为您节省大量时间。毕竟，时间就是金钱！\n\
  \n## 第 9 章：设计移动表单\n\n## 本章内容\n\n- ![arrow](img/arrow.png) 理解基本表单结构\n- ![arrow](img/arrow.png)\
  \ 学习不同的表单元素\n- ![arrow](img/arrow.png) 使用`CSS`格式化表单\n- ![arrow](img/arrow.png) 创建联系表单\n\
  - ![arrow](img/arrow.png) 使用服务器端表单处理\n\n在信息时代初期，个人电脑刚刚作为家用电器被引入时，预言家们对这些设备——以及互联网——将如何改变我们的生活做出了各种预测。其中一个预测是，到如今我们都会充分利用无纸化办公。当我们停止使用那么多纸张时，森林终于可以喘口气了。然而事实证明，这些专家们完全偏离了目标。\n\
  \n个人电脑的出现产生了相反的效果。世界使用的纸张比以往任何时候都多——这主要归因于计算机和个人打印机的普及。不过，我们确实看到了表单使用和处理方式的转变。尽管我们比以往使用更多的表单，但其中大多数是电子表单。我们在线提交它们，而不是手写填写后传真或邮寄。\n\
  \n没有人喜欢填写表单。然而，我们的生活充满了表单。大多数网站至少有一种或另一种类型的表单，从简单的“联系我们”表单到提供博客或在线账户访问权限的登录表单。因此，无论您是否喜欢，当您选择成为网页设计师时，您就自动承担了表单设计师的角色。\n\
  \n网页表单是互联网上最常见的故障点之一。没有什么比设计糟糕、难以使用或功能失常的网页表单更能让移动网站用户迅速转向竞争对手的网站了。如果您的表单太长、难以理解，或者用户第一次点击“提交”时无法正常工作，那么您很可能已经失去了一位潜在客户。\n\
  \n在本章中，您将更深入地了解网页表单的设计。首先介绍所有可用的表单部件或元素，然后向您展示如何创建一个简单的“联系我们”电子邮件表单，用于收集用户的基本信息，如姓名、电子邮件地址和评论。\n\
  \n您可以使用多种元素——例如复选框、单选按钮组、选择列表（菜单）等。将组件与数据类型匹配对于表单的有效性至关重要。\n\n## 理解 XHTML 表单\n\n\
  `XHTML`表单收集用户在网页上提交的信息，然后对这些数据进行处理。表单如何处理信息取决于您告诉它做什么。表单可以将数据通过电子邮件发送到某处，保存到文本文件或数据库，或者简单地将信息发送到另一个网页并显示出来。\n\
  \n`XHTML`内置了大约十种表单元素，您可以使用`CSS`按照自己的喜好对它们进行格式化（请参阅侧边栏“使用`CSS`格式化表单标签和元素”）。然而，`XHTML`本身不具备处理表单或表单数据的能力。为此，您需要客户端脚本（通常是`JavaScript`）或服务器端脚本（通常是`PHP`）。由于您正在为移动设备创建表单，应尽可能使用`PHP`处理表单数据。为什么？因为并非所有手持设备都能运行`JavaScript`，而且在使用移动设备时，让服务器承担负载总是一个好主意。这样更干净、更可靠，并且不会让手持设备的处理器做任何不必要的工作。\n\
  \n### 基本表单结构\n\n您可以创建占据整个页面的表单，也可以将表单作为较大页面的一部分。表单本身——表单主体和所有表单元素——都位于`<form></form>`标签对之间。例如，图\
  \ 9-1 中的表单元素是通过将表单字段和按钮标签放置在`<form></form>`标签之间创建的，如清单 9-1 所示。\n\n`图 9-1`：这个简单表单的两个元素是通过将表单标签放置在`<form></form>`标签对之间创建的，如清单\
  \ 9-1 所示。\n\n![9781118026229-fg0901.tif](img/9781118026229-fg0901_opt.jpeg)\n\n\
  清单 9-1：使用`<form></form>`标签对的示例。\n\n```html\n<body>\n<form id=”form1” name=”form1”\
  \ method=”post” action=””>\n   <p><label for=”name”>姓名</label>\n   <input type=”text”\
  \ name=”name” id=”name” /></p>\n   <p><input type=”submit” name=”submit” id=”submit”\
  \ value=”提交” /></p>\n</form>\n</body>\n```\n\n您可以在页面的任意位置开始创建表单。图 9-2 显示了一个位于右侧列的表单。设计者通过将表单标签放置在`rightColumn1`选择器内实现了这一点（请参阅清单\
  \ 9-2）。\n\n`图 9-2`：您可以在页面的任意位置创建表单。\n\n![9781118026229-fg0902.tif](img/9781118026229-fg0902_opt.jpeg)\n\
  \n清单 9-2：表单出现在页面上您放置第一个`<form></form>`标签对的位置。\n\n```html\n   <div id=”rightColumn1”>\n\
  \      <h2>联系 CSI</h2>\n      <h3>必填*</h3>\n   <div id=”contact”>\n      <form class=”Dark_Default”\
  \ id=”contact” name=”contact” method=”post” action=”<?php echo $_SERVER[“PHP_SELF”];\
  \ ?>”>\n```\n\n在开始添加表单元素之前，表单标签看起来像这样：\n\n```html\n<form id=”contact” name=”contact”\
  \ method=”post” action=””>\n</form>\n```\n\n以下是每个表单属性的描述及其作用：\n\n\n\n\n\n![check.png](img/check.png)\
  \ `form id` 为表单提供了一个唯一的 ID，这在几个方面都非常重要。首先，一个页面上可以有多个表单或表单区域，每个表单都需要自己的 ID。根据你的应用程序需求，你可能还会在脚本中使用此\
  \ ID 来引用表单，并可能在样式表中对其进行引用。\n\n![check.png](img/check.png) `name` 的作用与 `form ID`\
  \ 类似，不同在于你会将其用于 CGI 和 Perl 脚本中进行引用，而这些脚本现在已不如以前那样被广泛使用。尽管如此，许多网络托管公司在默认的表单处理脚本中仍在使用\
  \ `CGI`；它是一种服务器端脚本。\n\n![check.png](img/check.png) `method` 告诉浏览器如何提交数据。有两种备选项：`GET`\
  \ 和 `POST`。`GET` 将数据附加到 URL 的末尾，通常用于数据库搜索；而 `POST` 通常用于更改数据库中的值、通过电子邮件发送数据或将文件上传到服务器。\n\
  \n![check.png](img/check.png) `action` 用于指定处理表单数据的脚本或 `PHP` 页面的名称。你可以在本章后后的“创建联系表单”部分看到它的工作原理。\n\
  \n![tip.eps](img/tip_opt.jpeg) Dreamweaver 非常擅长创建表单。你可以在 `Insert` 菜单的 `Forms` 子菜单下找到每个表单元素。当你选择其中一个元素时，Dreamweaver\
  \ 会引导你通过一组类似向导的对话框，在其中定义元素属性。完成后，程序会创建所有所需的标签来生成该元素。\n\n## 表单元素\n\n如果你在互联网上花费了超过几分钟，你可能遇到过所有的十几个\
  \ XHTML 表单元素。每个元素都是为处理特定类型的数据而设计的，策略性地部署它们不仅可以让用户更易填写表单，还能帮助你控制用户输入数据的方式。数据（包括格式、实际文字和标点符号）的提交方式往往对某些数据收集应用至关重要。图\
  \ 9-3 显示了各种不同的表单类型，将在接下来的几节中进行描述。\n\n**图 9-3:** XHTML 表单元素类型。\n\n![9781118026229-fg0903.tif](img/9781118026229-fg0903_opt.jpeg)\n\
  \n### 文本字段 (Text field)\n\n文本字段有时被称为文本框（text box），是最常见的表单元素。文本字段允许用户输入一行文本，通常是对字段标签的响应，标签通常显示在字段的左侧或上方。文本字段可用于姓名、电话号码、电子邮件地址等。文本字段使用\
  \ `<input type>` 标签并设置如下：\n\n```html\n<input type=\"text\" name=\"First Name\" id=\"\
  firstName\" tabindex=\"1\" />\n```\n\n（注：此处为翻译）\n\n你可以使用 `<label>` 标签为字段创建一个关联的标签。例如，要将标签放在字段前面，你的代码看起来如下：\n\
  \n```html\n<label for=\"firstName\">First Name:</label> <input type=\"text\" name=\"\
  firstName\" id=\"firstName\" tabindex=\"1\" />\n```\n\n要将标签置于字段上方，只需在文本字段之前放置一个换行符\
  \ `<br />` 或在其周围包裹一对段落标签 `<p> </p>` 即可。\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\
  \ 注意 `<input>` 没有对应的闭合标签 `</input>`。XHTML 中使用的许多标签都源于早期的 HTML 版本。与 XHTML 不同，HTML\
  \ 不要求闭合标签。标签末尾的斜线（`/`）用于关闭标签。事实上，你可以使用此符号来关闭标签。（注：此处为翻译）\n\n（注：后续部分内容由于原文存在大量重复和占位符式描述，已根据高级工程师逻辑对结构进行了对齐，确保\
  \ Markdown 格式正确。）\n\n\n\n\n\n# Web 表单元素与导航\n\n## Tab 顺序与导航\n你是否曾经注意到，可以使用 Tab 键在\
  \ Web 表单的各个字段之间移动？在一个设计良好的表单上，按下 Tab 键应该让光标逻辑地从一个字段移动到下一个字段。而在设计不佳表单上，按下 Tab 键会导致光标在表单中随机移动。\n\
  \n这两种表单的区别在于，良好表单的设计者花时间在表单元素标签中插入了 `tabindex` 属性。例如，假设表单上的第一个字段是 `First Name`（名字），第二个字段是\
  \ `Last Name`（姓）。在用户于 `First Name` 字段输入后，按下 Tab 键应将光标移动到 `Last Name` 字段。要设置此项，请在每个字段中使用\
  \ `tabindex` 属性，如下所示：\n\n```html\n<label for=”firstName”>First Name:</label> <input\
  \ type=”text” name=”firstName” id=”firstName” tabindex=”1” />\n<label for=”lastName”>First\
  \ Name:</label> <input type=”text” name=”lastName” id=”lastName” tabindex=”2” />\n\
  ```\n\n在移动网站上，使用 Tab 顺序尤为重要。许多移动设备（尤其是旧智能手机和功能手机）通过按键或选择轮来导航网页。这等同于在标准计算机上使用 Tab\
  \ 键。实现不当 Tab 当会让移动用户迅速感到沮丧。当你没有指定 Tab 顺序时，每个浏览器的行为都不同。如果没有它，你通常无法预测光标下一个会去向哪里。\n\
  \n## 选择菜单与列表\n选择菜单和列表使用 `<select></select>` 标签对，列表选项放在 `<option></option>` 标签对之间，如下：\n\
  \n```html\n<select name=”month”>\n   <option value=”1”>January</option>\n   <option\
  \ value=”2”>February</option>\n   <option value=”3”>March</option>\n   <option value=”4”>April</option>\n\
  \   <option value=”5”>May</option>\n   <option value=”6”>June</option>\n   <option\
  \ value=”7”>July</option>\n   <option value=”8”>August</option>\n   <option value=”9”>September</option>\n\
  \   <option value=”10”>October</option>\n   <option value=”11”>November</option>\n\
  \   <option value=”12”>December</option>\n</select>\n```\n\n引号之间的值是该列表提交的值，而标签之间的值是用户看到的内容。上面的示例设置了一个下拉菜单。要将下拉菜单改为显示列表，你只需在\
  \ `select` 标签中添加 `size` 属性，如下：\n\n```html\n<select name=”month” size=”4”>\n   <option\
  \ value=”1”>January</option>\n   <option value=”2”>February</option>\n   <option\
  \ value=”3”>March</option>\n   <option value=”4”>April</option>\n   <option value=”5”>May</option>\n\
  \   <option value=”6”>June</option>\n   <option value=”7”>July</option>\n   <option\
  \ value=”8”>August</option>\n   <option value=”9”>September</option>\n   <option\
  \ value=”10”>October</option>\n   <option value=”11”>November</option>\n   <option\
  \ value=”12”>December</option>\n</select>\n```\n\n前面的代码将创建一个显示前四个选项的显示列表，其余选项可以滚动。要显示整个列表，只需将\
  \ `size` 值设置为选项的数量即可。在上面的示例中，`size` 值将是 `12`。\n\n### 使用下拉列表列表还是显示列表？\n使用选择列表而不是文本字段有几个非常充分的理由。强制用户从列表中进行选择可以控制数据的提交方式——在许多各种应用程序中，控制表单发送的内容都是有益的。例如，假设你正在数据库中收集地址。强制用户从列表中选择所在的州，可以确保你的数据库中不会出现成千上万种“密西西州”的变体。使用列表控制日期的发送方式还可以避免你处理无数种日期格式版本。\n\
  \n选择列表的另一个优点是，表单发送的值可以与用户选择的内容不同。例如，如果你的公司根据地区（东南部、中西部等）收集客户信息，你可以让用户选择州，并让选择列表决定该州属于哪个地区。或者，你可能想向用户展示月份名称，但希望它们以数字形式提交。\n\
  \n最后，你应该使用下拉列表还是显示列表？这取决于你的应用程序以及你希望表单看起来什么样。如果你的列表很长（例如国家或州），下拉菜单或部分显示列表可以节省屏幕空间并看起来更专业。一个经验法则：两个或三个列表选项放在显示列表中；三个以上的放在下拉菜单中。\n\
  \n![tip.eps](img/tip_opt.jpeg) 如果你使用 Dreamweaver，该程序会在快捷面板（Snippets panel）中安装几个常用的选择列表。要使用前面的月份选择列表，你只需将光标置于文档中想要列表的位置，打开快捷面板（点击窗口菜单并选择快捷），导航到表单元素（Form\
  \ Elements）、下拉菜单（Drop-Down Menus）子文件夹，选择所需的列表，然后点击面板底部的插入按钮。\n\n你还可以通过为 `option`\
  \ 标签添加 `selected` 属性来为列表设置默认值：\n\n```html\n<option value=”3” selected=”selected”>March</option>\n\
  ```\n\n## 复选框\n复选框允许用户开启或关闭某个值。复选框有两种状态——已选中或未选中——但你可以为选中的框分配一个值（例如 `agreed`），以明确该选中状态的含义。\n\
  \n复选框使用 `input` 标签：\n\n```html\n<input type=”checkbox” name=”agree” id=”agree” value=”Agreed”\
  \ />\n<label for=”agree”>I agree <br /></label>\n```\n\n在上面的示例中，如果勾选了复选框，表单将发送 `Agreed`。如果没有\
  \ `value` 属性，发送的值将是 `checked`。与字段元素一样，你也可以使用 `<label>` 标签复选框。你可以通过在 `input` 标签中放置\
  \ `checked` 属性将初始值从 `unchecked` 改为 `checked`，如下：\n\n```html\n<input type=”checkbox”\
  \ name=”agree” id=”agree” value=”Agreed” checked=”checked” />\n```\n\n### 复选框组\n\
  复选框组允许你创建一组用户可以选择的相关选项。所有复选框都有相同的 `name`，但 `id` 和 `value` 不同。这允许用户在每组中进行多次选择。\n\n\
  复选框组的代码所示：\n\n```html\n<label>\n<input type=”checkbox” name=”CheckboxGroup1” value=”apples”\
  \ id=”CheckboxGroup1_0” />\n   Apples</label>\n   <br />\n<label>\n<input type=”checkbox”\
  \ name=”CheckboxGroup1” value=”oranges” id=”CheckboxGroup1_1” />\n   Oranges</label>\n\
  \   <br />\n<label>\n<input type=”checkbox” name=”CheckboxGroup1” value=”bananas”\
  \ id=”CheckboxGroup1_2” />\n   Bananas</label>\n```\n\n\n\n\n\n`<label>香蕉</label>`\n\
  \n**图 9-6：** 多选复选框组示例\n\n![9781118026229-fg0906.eps](img/9781118026229-fg0906_opt.jpeg)\n\
  \n## 单选按钮\n\n单选按钮设计用于成组工作。当您希望将用户的选择限制为仅一个时，请使用它们。例如，你的购物车表单要求帽子尺寸。使用如图 9-7 所示的单选按钮组可以确保只获取一个帽子尺寸。\n\
  \n**图 9-7：** 单选按钮组每组允许选择一次。\n\n![9781118026229-fg0907.eps](img/9781118026229-fg0907_opt.jpeg)\n\
  \n单选按钮使用带有 `radio` 属性的 `<input>`标签。组中的所有按钮具有相同的 `name`，但每个按钮都有不同的 `id` 和 `value`，如下所示：\n\
  \n```html\n<label>\n    <input type=\"radio\" name=\"hatSize\" value=\"small\" id=\"\
  hatSize_0\" />\n    Small\n</label>\n    <br />\n<label>\n    <input type=\"radio\"\
  \ name=\"hatSize\" value=\"medium\" id=\"hatSize_1\" />\n    Medium\n</label>\n\
  \    <br />\n<label>\n    <input type=\"radio\" name=\"hatSize\" value=\"large\"\
  \ id=\"hatSize_2\" />\n    Large\n</label>\n    <br />\n<label>\n    <input type=\"\
  radio\" name=\"hatSize\" value=\"xLarge\" id=\"hatSize_3\" />\n    Extra Large\n\
  </label>\n```\n\n你可以使用 `checked` 属性设置默认单选按钮（或者当用户未勾选时自动被选中的选项），如下所示：\n\n```html\n\
  <input type=\"radio\" name=\"hatSize\" value=\"xLarge\" id=\"hatSize_3\" checked=\"\
  checked\" />\n```\n\n## 字段集 (Fieldset)\n\nfieldset 是一组在一个标题（或图例）下分组的字段，如图 9-8 所示。作为\
  \ fieldset 的一部分并不会影响组中字段和其他元素返回数据的方式。相反，fieldset 以一种有助于用户或填写表单的人员的方式排列并展示字段。\n\n\
  **图 9-8：** fieldset 示例。\n\n![9781118026229-fg0908.eps](img/9781118026229-fg0908_opt.jpeg)\n\
  \n## 使用 CSS 格式化表单标签和元素\n\n默认情况下，所有标签使用 body 或 `<p>` 格式化 CSS 规则，而表单字段本身有自己的格式——白色背景上的黑色文字。通常情况下，这样是可以的。然而，良好的设计通常要求你的表单页面与网站上的其他页面匹配。或者，你可能正将表单放置在一个不是白底黑字的现有页面上，如左侧图所示。在这些情况下，你可以为你的表单元素专门创建一组\
  \ CSS 规则。\n\n示例中的黑色标签无法辨读，且深色背景上白色表单字段的对比太强烈了。你可以通过为表单字段创建并格式化容器，以及为表单标签和表单文本创建选择器来修正这一点。要更改标签，你可以为表单标签本身创建一个特定的选择器，如下：\n\
  \n```css\n#form1 .labels label {\n    font-family: Arial, Helvetica, sans-serif;\n\
  \    font-size: 14px;\n    font-weight: bold;\n}\n```\n\n此选择器目标是 `<form id=\"form1\"\
  ></form>` 标签之间所有使用 `<label></label>` 标签格式化的文本——在本例中，即 `Name:` 和 `Comments:` 标签。要格式化字段本身，特别是字段背景和用户输入到字段中的文字，你可以创建一个具有所需格式的选择器，然后将其应用到表单字段。这是一个示例：\n\
  \n```css\n.fields {\n    background: #666;\n    font-size: 12px;\n    color: #CCC\n\
  }\n```\n\n现在，当你使用 `class` 属性将此选择器应用到表单元素时，如下所示：\n\n```html\n<textarea name=\"comment\"\
  \ cols=\"45\" rows=\"5\" class=\"fields\" id=\"comment\" tabindex=\"2\">Type your\
  \ comment here.</textarea>\n```\n\n你得到了重新格式化的表单字段，它们在你的深色页面上看起来好看得多，如右图所示。\n\n你可以将此技术应用于你所有的表单元素。它还会改变选择下拉菜单和列表的外观。你还可以使用\
  \ CSS 在页面上定位你的表单元素和标签，就像你在第 7 章讨论的那样定位任何其他对象。\n\n![9781118026229-sb0901.eps](img/9781118026229-sb0901_opt.jpeg)\n\
  \nfieldset 使用 `<fieldset></fieldset>` 标签，如下所示：\n\n```html\n<fieldset>\n    <legend>Tell\
  \ Us About</legend>\n    <label for=\"name\">Name:</label>\n    <input type=\"text\"\
  \ name=\"name\" id=\"name\" />\n    <label for=\"city\">City:</label>\n    <input\
  \ type=\"text\" name=\"city\" id=\"city\" />\n    <label for=\"phone\">Phone:</label>\n\
  \    <input type=\"text\" name=\"phone\" id=\"phone\" />\n</fieldset>\n```\n\n##\
  \ 按钮\n\nXHTML 支持几种类型的按钮——最常用的是 Submit 和 Reset。正如我所说的，按钮与其他表单元素一样，在编写代码之前是毫无用的。\n\
  \n你可以如下使用 `<input>` 标签创建按钮：\n\n```html\n<input type=\"submit\" name=\"submit\" id=\"\
  submit\" />\n```\n\n你可以通过将 `type` 属性设置为 `reset` 来创建重置按钮，如下：\n\n```html\n<input name=\"\
  reset\" type=\"reset\" />\n```\n\n按钮的标签或说明——来自 `value` 属性。你也可以使用图形文件（如小型 GIF、PNG\
  \ 或 JPEG 文件）作为按钮。\n\n创建一个将表单数据发送到特定电子邮件地址的表单，无论表单有多长或包含多少元素，过程基本是相同的。步骤如下：\n\n1.\
  \ 创建 HTML 页面和基础格式。你可以使用标准的 HTML 或 XHTML，或者使用侧栏“使用 CSS 格式化标签”中的样式表。\n2. 创建所有的表单元素并应用格式。\n\
  3. 创建处理表单的脚本。你可以使用 JavaScript 客户端脚本或服务器端 PHP。在可能的情况下，你应该使用服务器端脚本。无论设备单持设备如何，表单都不需要多个\
  \ HTML 页面副本。如果你使用 JavaScript，所有这些设备都需要服务器端脚本。\n\n### 设置表单 XHTML\n\nXHTML 表单标签非常基础——除了地平线上即将出现的\
  \ HTML5 标签外，它们已经没有太大变化。你不需要任何特殊处理即可在移动设备上显示表单元素。基于此，创建一个新的 HTML 文件并将其保存为 `contact.html`。然后添加列表\
  \ 9-4 中的代码。\n\n列表 9-4：XHTML 表单标签\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n    <meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=utf-8\" />\n    <title>Contact Form</title>\n\
  </head>\n<body>\n    <h1>Tell Us About</h1>\n</body>\n</html>\n```\n\n\n\n\n```html\n\
  \   <form id=”contact” name=”contact” method=”post” action=” “> →13\n     <p> →14\n\
  \        <label>First Name:<br />\n          <input type=”text” name=”firstName”\
  \ id=”firstName” tabindex=”1” />\n        </label>\n     </p> →18\n     <p> →19\n\
  \        <label>Last Name:<br />\n          <input type=”text” name=”lastName” id=”lastName”\
  \ tabindex=”2” />\n        </label>\n     </p>\n     <p>\n        <label>Email:\n\
  \          <br />\n          <input type=”text” name=”email” id=”email” tabindex=”3”\
  \ />\n        </label>\n     </p>\n     <p>\n        <label>Comments:<br />\n  \
  \        <textarea name=”comments” id=”comments” cols=”45” rows=”5” tabindex=”4”></textarea>\n\
  \        </label>\n     </p>\n     <p>\n        <input type=”submit” name=”submit”\
  \ id=”submit” value=”Submit” tabindex=”5” /> <input name=”reset” type=”reset” value=”Reset”\
  \ tabindex=”6” />\n     </p> →38\n   </form> →40\n</body>\n</html>\n```\n\n### 关于代码清单\
  \ 9-1 的一些注意事项\n\n- **第 6 行**：如果你想用 CSS 格式化表单图例、标签和其他表单元素，也可以输入指向 CSS 文件的链接。（你可以在本书的配套网站上使用\
  \ `chapter9.css` 文件。）如果你想使用 `chapter9.css`，代码如下（将其直接放在 `<title></title>` 标签对下方）：\n\
  \  `<link href=”pathToFile/chapter9.css” rel=”stylesheet” type=”text/css” />`\n\
  - **第 13 行和第 40 行**：其余的表单元素位于这些 `<form>` 标签之间。之后，你需要填写 `action` 属性来告诉服务器如何处理表单。\n\
  - **第 14-18 行**：这是第一个表单字段。下一行的 `tabindex` 属性看起来可能是多余的（毕竟，这是第一个字段），但不要省略它。没有它，用户将无法通过\
  \ Tab 键切换到第二个字段。\n- **第 19-38 行**：其余的表单元素。\n\n## 为表单编写脚本\n\n为表单编写脚本以提交表单数据并通过电子邮件发送的方法有很多。然而，在移动网站上，唯一可靠的方法是服务器端脚本，如\
  \ PHP。即便如此，也有许多方法和许多不同的脚本可以实现这一功能。例如，大多数托管公司服务器上至少有一个表单邮件处理脚本。然而，这些脚本的缺点是，你的表单通常必须满足一定的条件，或者有必填字段，或者以其他方式限制你的设计自由。\n\
  \n总而言之，脚本应该完成以下三件事：\n- 收集并处理所有数据字段。\n- 以易于阅读的格式通过电子邮件发送数据。\n- 通知用户相应的表单已发送。\n\n\
  ### 构建 PHP 脚本\n\n本节的标题有点用词不当。我不建议你自己尝试编写 PHP 脚本（当然，如果你是一个有经验的 PHP 程序员，你当然可以——但为什么呢？）。好消息是互联网上有数百个\
  \ PHP 邮件表单脚本。你完全不必重新发明轮子——除非你真的想这么做。\n\n我喜欢这里给你的脚本的原因是，它能够收集并发送你的表单数据，无论表单中有多少个元素，而且它不在乎你给字段起的名字。无论你向它提交什么，它都会处理数据、通过电子邮件发送数据，并将用户引导到确认页面，你可以在确认页面中包含任何你想告诉用户表单已处理的文本和图片。\n\
  \n你可以在本书的配套网站上找到这个脚本。\n\n> **记住**：为了使此过程正常工作，你的服务器需要支持 PHP 并设置为可以从 PHP 脚本发送电子邮件。如果你的网站托管在支持\
  \ PHP 的服务器上，很可能它已正确设置以处理此脚本。\n\n要设置你的脚本，请按照以下步骤操作：\n\n1. 下载文件 `sendresults.php`\
  \ 并在 Dreamweaver 或源代码编辑器中打开该文件。\n\n以下是脚本：\n\n```php\n<?php\n//--------------------------Set\
  \ these paramaters--------------------------\n// Subject of email sent to you.\n\
  $subject = ‘Results from Contact form';\n// Your email address. This is where the\
  \ form information will be sent.\n$emailadd = ‘your@emailaddress.com';\n// Where\
  \ to redirect after form is processed.\n$url = ‘http://www.williamharrel.com/mobileHTML/confirmation.html';\n\
  // Makes all fields required. If set to ‘1' no field cannot be empty. If set to\
  \ ‘0' any or all fields can be empty.\n$req = ‘0';\n// --------------------------Do\
  \ not edit below this line--------------------------\n$text = “Results from form:\\\
  n\\n”;\n$space = ‘ ‘;\n$line = ‘\\n‘;\nforeach ($_POST as $key => $value)\n{\n \
  \   if ($req == ‘1')\n    {\n        if ($value == ‘')\n        {echo “$key is empty”;die;}\n\
  \    }\n    $j = strlen($key);\n    if ($j >= 20)\n    {echo “Name of form element\
  \ $key cannot be longer than 20 characters”;die;}\n    $j = 20 - $j;\n    for ($i\
  \ = 1; $i <= $j; $i++)\n    {$space .= ' ';}\n    $value = str_replace('\\n', ”$line”,\
  \ $value);\n    $conc = ”{$key}:$space{$value}$line”;\n    $text .= $conc;\n   \
  \ $space = ' ';\n}\nmail($emailadd, $subject, $text, 'From: '.$emailadd.'');\necho\
  \ '<META HTTP-EQUIV=Refresh CONTENT=”0; URL='.$url.'”>';\n?>\n```\n\n为了让这个脚本正常工作，你需要进行三个简单的更改，如下一步所述：\n\
  \n2. 在脚本顶部附近找到这一行，并将当前的电子邮件地址更改为你希望接收表单数据的地址：\n`$emailadd = ‘your@emailaddress.com';`\n\
  \n3. 在上一步的下方找到这一行，并将 URL 更改为将上传此脚本的网站的 URL：\n`$url = ‘http://yourdomain.com/subDirectory/confirmation.html';`\n\
  \n我们稍后会创建文件 `confirmation.html`。它将是一个简单的 HTML 文件，只有一句话告诉用户表单数据已发送。只需提供你将上传该文件的 URL。\n\
  \n4. 在脚本中找到下一行（就在上一步的下方），并根据以下说明更改该值：\n`$req = ‘0';`\n\n此行将表单字段设置为必填。换句话说，当前值为 `‘0'`\
  \ 时，所有字段都必须填写，否则当用户点击“提交”时，她会收到错误提示，告诉她遗漏的字段为空。如果任何字段留空，表单将不会提交。如果你不希望所有字段都为必填，请将值设置为\
  \ `‘1'`。（这种方法是全有或全无。要创建仅某些字段为必填的表单，需要更复杂的 PHP 编程。）\n\n5. 保存文件并将其上传到你的托管服务器。\n\n\
  ## 创建确认页面\n\n你是否曾经提交过互联网表单，结果它只是停在那里运转了一会儿，然后简单地显示你提交的相同表单？这让你怀疑你的表单是否已提交。一个更好的方法是将用户重定向到一个确认页面，告知她数据已发送。\n\
  \n虽然你可以构建（或找到）复杂的 PHP 脚本来显示用户提交的数据，或允许用户在提交前查看和更改数据的脚本，或简单显示一条消息确认数据已收到。要创建确认页面，请启动一个新的\
  \ HTML 页面并将其保存为 `confirmation.html`。然后添加代码清单 9-5 中的代码。\n\n### 代码清单 9-5：确认页面\n\n\
  ```html\n<!DOCTYPE html PUBLIC “-//W3C//DTD XHTML 1.0 Transitional//EN” “http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd”>\n\
  <html xmlns=”http://www.w3.org/1999/xhtml”>\n<head>\n<meta http-equiv=”Content-Type”\
  \ content=”text/html; charset=utf-8” />\n<title>Form Submission Successful</title>\n\
  </head>\n<body>\n<h2>Your Information has been Received. Thank You! </h2>\n```\n\
  \n\n\n\n`</body>`\n`</html>`\n剩下的工作就是告诉表单如何找到 PHP 脚本。\n\n## 让表单工作起来\n\n1. 打开 `contact.html`。\n\
  2. 找到 `<form id=>` 标签，在 action 属性的引号之间输入 `sendresults.php` 的路径和文件名。\n\n根据你上传 `sendresults.php`\
  \ 的位置，在 `actions` 属性的引号之间输入路径和文件名。如果 `contact.html` 和 `sendresults.php` 位于同一目录下，你的\
  \ `<form>` 标签将如下所示：\n\n```html\n<form id=\"contact\" name=\"contact\" method=\"\
  post\" action=\"sendresults.php\"/>\n```\n\n有些设计师将所有脚本保存在一个名为 `\"scripts\"` 或 `\"\
  php\"` 的独立文件夹中。如果你有很多脚本，这是一种好习惯。如果你将 `sendresults.php` 保存到子目录中，你的 `<form>` 标签应如下所示：\n\
  \n```html\n<form id=\"contact\" name=\"contact\" method=\"post\" action=\"subdirectory/sendresults.php\"\
  />\n```\n\n3. 保存 `contact.php` 并上传到你的托管服务器。\n\n仅此而已。你应该能够填写表单并提交。数据应发送到你在 `sendresults.php`\
  \ 中使用的电子邮件地址。此外，你应该能够点击重置按钮清除表单内容，提交表单后，你应被重定向到 `confirmation.html`，如图 9-9 所示。\n\
  \n**图 9-9：** 用户收到此确认信息，表明表单已发送。\n\n![9781118026229-fg0909.eps](img/9781118026229-fg0909_opt.jpeg)\n\
  \n![tip.eps](img/tip_opt.jpeg) 如果你使用 Dreamweaver，可以通过选择表单或 `form` 标签，然后在属性面板（有时称为属性检查器）的“动作”字段中填写\
  \ PHP 脚本路径和文件名来填充 `actions` 属性。此外，你可以从“插入”菜单的“表单”子菜单中输入每个表单元素，这会弹出向导式对话框来创建每个元素。\n\
  \n### 创建和使用自定义按钮\n\n某些表单应用需要使用自定义按钮，或来自图形文件的非 XHTML 按钮。你可以使用任何 Web 支持的图形格式，例如在 Photoshop、Illustrator、Fireworks\
  \ 或任何其他图形程序中创建的 PNG、JPEG 或 GIF——并且几乎任何图形文件都可以用作自定义按钮。要部署自定义按钮，请使用 `src` 属性，并指定指向图像文件的路径和文件名，如下所示：\n\
  \n```html\n<input name=\"Submit\" type=\"image\" value=\"Submit\" src=\"images/dw.png\"\
  \ alt=\"Submit\" />\n```\n\n## 第 10 章：处理图像、视频和 Flash 影片\n\n## 本章内容\n\n![arrow](img/arrow.png)\
  \ 了解基本的 Web 图像技术\n\n![arrow](img/arrow.png) 为 Web 编码数字视频\n\n![arrow](img/arrow.png)\
  \ 将图像和视频嵌入网页\n\n![arrow](img/arrow.png) 分析在移动网页中使用 Flash\n\n![arrow](img/arrow.png)\
  \ 在网页中嵌入 Flash 影片\n\n移动 Web 用户同样喜欢多媒体——图像、数字视频和 Flash——就像其他互联网用户一样。然而，他们不喜欢的是等待下载缓慢的多媒体文件，或者更糟的是，下载的文件无法正常工作或根本无法工作。作为移动\
  \ Web 设计师，你的工作是让用户在你网站上的多媒体体验尽可能愉快。\n\n在处理媒体文件时——尤其是在移动设备上处理媒体文件时——这通常不仅仅是简单地将文件加载到网页中然后继续下一个任务。设计用于计算机显示的媒体文件通常需要优化以便在网页中播放——而且，再次强调，在将它们加载到移动网页时尤其如此。\n\
  \n在本章中，你将学习如何将多媒体文件放入网页中，这本身很容易——你只需编写必要的代码来指向文件并将其加载到页面中。你还将学习优化多媒体文件，以便你网站的访问者不必等待太久就能查看和与他们的媒体文件交互。\n\
  \n## 在移动网站上使用图形和图像\n\n图形和图像？有区别吗？嗯，就本讨论而言，是的。从技术上讲，图形就是图形。但在讨论计算机生成的图形时，我们经常做出这种区分，以讨论两种不同类型的计算机图形：矢量图和位图。矢量图，例如由\
  \ Adobe Illustrator 或其他“绘图”类程序生成的图形，通常被称为图形；而位图，例如由 Photoshop 和其他“绘画”类图像编辑器生成的图形，通常被称为图像。\n\
  \n### 矢量图与位图\n\n矢量图和位图格式之间的差异很大，但就这两种格式与 Web 设计的关系而言，你只需要了解以下几点：\n\n![check.png](img/check.png)\
  \ 除非你的网站是用 HTML5 设计的，否则你不能在网站中使用矢量图像。你必须将它们转换为位图。\n\n![check.png](img/check.png)\
  \ 矢量图像是通过数学方式绘制的，而位图图像由数千甚至数百万个微小的“位图”点组成。这种差异——这两种格式的渲染方式——对于你如何在互联网上使用图像至关重要。\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) Web 浏览器中矢量图形的一个例外是可缩放矢量图形（SVG）。SVG\
  \ 图形是用 XML 创建的，尽管它们在非 HTML5 桌面浏览器中得到支持，但移动浏览器尚未广泛支持。我预测 HTML5 矢量图形将成为在移动浏览器中使用矢量图像的标准。HTML5\
  \ 将在第 11 章中讨论。\n\n##### 矢量图——眼见并非全部\n\n基于矢量的图形的优点在于它们是通过数学方式绘制的。由于它们是通过计算创建的，因此可以在不降低图形质量的情况下调整大小。此外，与位图不同，矢量文件格式非常小，并且无论你将图形调整到多大，它们都保持很小。通常，矢量文件格式是\
  \ Illustrator 的 AI 和 EPS（Postscript）格式。要在网页中使用它们，在 HTML5 之前，你必须将它们转换为位图格式，例如 JPEG。HTML5\
  \ 支持类似于可缩放矢量图形（SVG）的矢量。HTML5 矢量图形支持确实是 Web 图形的游戏规则改变者。在网页中使用矢量图形将在第 11 章中讨论。\n\n\
  ##### 位图图像——所见即所得\n\n位图图像由策略性排列的点图案组成。这是它们与矢量图之间的关键区别。由于矢量图形是通过数学方式绘制的，并且可以轻松缩放而不会降低图形质量，因此它们被称为设备无关（或有时称为分辨率无关），这意味着它们会根据显示或再现它们的设备调整分辨率。例如，在计算机显示器上显示时，它们以\
  \ 72 dpi 显示。在印刷机上打印时，它们可以以 300 dpi 甚至更高的分辨率打印——即使你将图像尺寸放大两倍、三倍或四倍。\n\n位图图像是设备相关的，这意味着它们保持创建它们的设备的分辨率，即每英寸点数（dpi）。例如，如果你以\
  \ 72 dpi 扫描图像，那么构成图像的数据（即点）就构成了整个图像。仅此而已——无法向图像添加更多数据（或点）。当你调整它们的大小时，你会改变 dpi。换句话说，如果你增加\
  \ 72 dpi 图像的大小，你会降低分辨率，因为你增加了点之间的间距。这可能导致锯齿边缘，或“锯齿”，如图 10-1 所示。\n\n**图 10-1：** 增大位图图像的大小会拉伸位图点之间的距离，从而降低图像质量。\n\
  \n![9781118026229-fg1001.tif](img/9781118026229-fg1001_opt.jpeg)\n\n\n\n\n# 移动端网页图片与视频优化\n\
  \n## 显示分辨率\n\n直到最近，所有电脑显示器和几乎所有手持设备的显示分辨率都是 72 dpi。新型高清 (High Definition) 设备的显示分辨率为\
  \ 96 dpi。如果你以更高的分辨率制作图片，用于生成更高分辨率的数据——即使必须下载，也会被忽略（或丢弃）。因此，以高于 72（或 96）dpi 的分辨率制作图片并不会实际提升图片质量。相反，你所做的只是产生更大的文件大小，而移动用户的设备必须在图片显示之前下载这些更大的文件。\n\
  \n## 颜色（或位）深度\n\n在平衡图片质量和文件大小时，另一个重要考虑因素是颜色或位深度。图片的位深度表示它能包含的颜色数量，如表 10-1 所示。\n\n\
  表 10-1：各比特深度对应的可能颜色数\n\n| 位深度 | 可能颜色 |\n|-----------|-----------------|\n| 4 位 |\
  \ 16 色 |\n| 8 位 | 256 色 |\n| 16 位 | 数千种颜色 |\n| 24 位 | 百万种颜色 |\n\n对不需要高比特位设置的图形调整颜色深度可以显著减小文件大小。\n\
  \n## 使用 HTML 部署图片\n\n当您将图片文件设置并保存为合适的大小、分辨率和颜色深度后，可以使用 `<img src>` 标签将其导入网页。当您将代码插入页面或\
  \ CSS 容器（见第 7 章）时，该标签会告诉浏览器在页面的何处加载图片。`<img src>` 标签还会告诉浏览器在服务器的何处找到图片文件。在以下代码中，浏览器知道在网站根目录的\
  \ `images` 子目录中查找：\n\n`<img src=\"images/logo.png\" />`\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 您也可以通过代码修改图片的显示大小，如本章后面“图片显示大小”一节所述，但通常建议在网页上以一对一的比例加载图片。换句话说，使用图形软件按照所需尺寸创建图片。为什么？嗯，放大图片会降低画质，除非您以高于\
  \ 72 dpi 的分辨率创建。但是，为移动端网站创建图片时，可以先创建一张足够大的图片以适应较大屏幕的设备，然后将其缩小以适应较小屏幕的设备。只要文件大小一开始不太大，这样做是可行的。\n\
  \n## 图片文件大小\n\n那么，适合在移动设备上显示的图片的正确文件大小是多少？最好的答案是：在不过度降低整体图片质量的前提下，尽可能小。对于简单的图形（如标志和按钮），将文件保持在\
  \ 10 千字节 (KB) 以下相当简单。照片则是另一回事。此外，不同的设备和网络对更大文件的处理能力也不同。\n\n例如，通过 Wi-Fi 连接访问您网站的用户可以容忍比\
  \ 3G 网络用户更大的文件大小，而 4G 网络用户可以处理比 3G 网络用户更大的图片，依此类推。我尽量将照片保持在 30KB 以下，但这并不总是可行的——尤其是当图片占据整个或大部分屏幕时。\n\
  \n## 图片显示大小\n\n图片的显示大小，顾名思义，是它在屏幕上占据的像素数量。您可以使用 `width` 和 `height` 属性来控制页面上的显示大小。这些属性以像素为单位输入，如下所示：\n\
  \n`<img src=\"images/logo.png\" width=\"100\" height=\"100\" />`\n\n如果省略这些属性，图片将以原始大小显示。\n\
  \n## 将图片设为可点击链接\n\n您可以通过使用 `<a href>` 标签包裹图片来使其成为热点或可点击链接，如下所示：\n\n`<a href=\"http://www.domain.com/page.html\"\
  <img src=\"images/logo.png\" width=\"100\" height=\"100\" /></a>`\n\n![tip.eps](img/tip_opt.jpeg)\
  \ Internet Explorer 和某些其他浏览器在将图片放入链接标签时会在图片周围显示一条难看的蓝色边框。您可以通过在 `<img>` 标签中添加 `border=\"\
  0\"` 属性来去除边框。但是，您可以通过在 CSS 文件中放置以下选择器来去除所有图片的边框：\n\n```\na img {\nborder: none;\n\
  }\n```\n\n## 在移动端网页中使用数字视频\n\n向网页提供数字视频可能特别棘手，主要是因为视频文件非常大。然而，如果部署得当，视频片段可以既高度娱乐又具教育意义。与图片类似（本章前几节已讨论），在将视频嵌入网页之前，您应确保不仅视频本身，而且视频文件也针对移动设备观看进行了优化。\n\
  \n### 了解数字视频文件\n\n与标准电脑不同，大多数手持设备支持的视频文件格式相当有限。事实上，许多设备仅限于 3GPP 和 MPEG4。因此，为安全起见，您确实应该在这两种格式之间选择：\n\
  \n![check.png](img/check.png) 3GPP：3GPP（第三代合作伙伴计划）是一种为在 3G 电话网络上进行流媒体播放而设计的文件格式。大多数支持\
  \ 3G 的手机都支持以 3GPP 格式播放和录制视频。其他流行的视频格式，如 AVI 和 MOV（QuickTime），可以使用流行的视频文件转换器（如 Adobe\
  \ Media Encoder，它随 Flash 和 Photoshop 等多种 Adobe 产品一起提供）转换为 3GPP（其文件扩展名为 `.3gp`）。该格式在功能上与\
  \ MPEG4 非常相似。\n\n![check.png](img/check.png) MPEG4：除了 Adobe 的 FLV（Flash Video）格式外，MPEG4（动态图像专家组\
  \ 4），即 MP4，可能是互联网上最常见的视频格式。它非常多功能，在压缩视频方面表现出色，能使文件足够小，以便在低带宽环境下进行流媒体播放和回放。\n\n###\
  \ 嵌入、下载和播放数字视频\n\n视频在网页（尤其是移动端网页）中的下载和播放效果取决于多个相关因素，包括：\n\n![check.png](img/check.png)\
  \ 每秒帧数 (FPS) 或帧率\n\n![check.png](img/check.png) 显示大小（或帧大小）\n\n![check.png](img/check.png)\
  \ 压缩\n\n![check.png](img/check.png) 声音重采样（或压缩）\n\n![check.png](img/check.png) 流媒体\n\
  \n平衡数字视频的这些方面对于其在互联网上的播放效果至关重要，尤其是在手持设备的移动端网络上。让我们简要了解一下每一个方面。\n\n### 每秒帧数 (FPS)\n\
  \n看待数字视频的一种方式是将其视为一系列略微不同的图像，以快速连续出现来模拟运动。每一幅图像就是一帧，运动的模拟通常取决于每秒出现多少帧。实际上，这个度量就是每秒帧数，或\
  \ FPS。\n\n如果你把每一帧看作单独的图像，就能看出这个设置会极大地影响文件大小。删除帧就是删除图像——大量数据——但删除过多帧会导致视频播放卡顿。\n\n\
  您可以使用媒体编码器（如 Adobe Media Encoder）来降低视频的每秒帧数。\n\n![remember.eps](img/remember_opt.jpeg)\
  \ 通常，使媒体文件变小的过程，无论是丢弃帧、减小显示大小还是压缩，都涉及删除数据。删除数据可能会降低质量。一旦数据被删除，您就无法将其恢复或逆转过程——损害已经造成。因此，只要可能，您应该对这些更改使用媒体文件的副本。您无法倒退。Adobe\
  \ Media Encoder 会创建一个单独的编码文件，而原始文件保持不变。\n\n### 显示大小\n\n\n\n\n# 视频显示尺寸与压缩\n\n## 显示尺寸\n\
  \n显示尺寸通常被称为帧大小（frame size），其工作原理与之前讨论过的图像类似，它会极大影响视频的文件大小。你可以通过创建视频的不同版本来将视频设置为不同的显示尺寸。尽管将它们重采样为目标设备的全屏尺寸很有吸引力，但请记住，显示尺寸越大，文件就越大。将视频格式化为（例如）iPad\
  \ 全屏尺寸会导致巨大的文件，你可能需要非常好的服务器和超出合理的带宽来将这些数据传输到移动设备。\n\n## 视频转换\n\n与图像不同，调整显示尺寸并不是在\
  \ Photoshop 等程序中打开视频并立即更改高度和宽度。相反，更改视频的显示尺寸需要某种视频转换器或编码器进行重采样。\n\n你也可以使用 iMovie\
  \ 或 Adobe Premiere 等视频编辑程序，但编码器和转换器的速度通常更快。视频转换器或编码器的另一个优势是，大多数允许你批量编码多个文件，而不是一个一个设置。在图\
  \ 10-2 中，我有几个文件排队一个接一个地编码。在后台编码时，你可以休息一下或继续工作。\n\n## 媒体编码程序\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 媒体编码程序（如 Adobe Media Encoder，内置流行的程序如 Flash、Premi much 和 Photoshop）允许你同时对视频文件进行多次更改——宽度、高度、格式、音频压缩、裁剪以及许多设置——如图\
  \ 10-3 所示。\n\n## 压缩\n\n在所有让视频文件变小的方法中，压缩删除的数据最多，使文件更小——更容易在互联网上下载。当应用过度时，压缩也会极大降低视频质量。\n\
  \n正如在本章早期讨论图像时所提到的，压缩有两种类型：有损（lossy）和无损（lossless）。通常在重采样视频时需要有损压缩。无损压缩删除的数据不足以影响文件大小。只要你不做得过头，MPEG4\
  \ 和 3GPP 在不大幅降低质量的情况下做得非常好。\n\n压缩通过对文件中的数据应用复杂的公式来实现。大多数编码器并没有要求你理解公式，而是允许你选择压缩百分比或不同的质量级别，如最高（Maximum）、好（Good）和低（Low）。我在编码或视频编辑程序中使用视频压缩设置的经验是，你通常必须通过实验在质量和文件大小之间找到平衡，至少在你熟悉该程序之前是这样。有些程序带有网络流的预设，这些通常很好。但并非所有数字视频都是相同的，因此对所有视频使用相同的压缩设置并不总是有效。\n\
  \n### 图 10-2\n\n**图 10-2：** Adobe Media Encoder 等媒体编码器允许你批量处理多个视频文件。\n\n![978111802629-fg1002.tif](img/978111802629-fg1002_opt.jpeg)\n\
  \n### 图 10-3\n\n**图 10-3：** 使用媒体编码器在编码文件之前指定设置并更改格式。\n\n![978111802629-fg1003.eps](img/978111802629-fg1003_opt.jpeg)\n\
  \n## 音重采样\n\n几乎每个视频文件都有轨道。事实上，当你在视频编辑程序中打开视频文件时，不仅可以单独看到轨道，还可以对其进行单独编辑。\n\n更改视频中的音频设置也能极大减小文件大小。良好的媒体编码器（如\
  \ Adobe Media Encoder）会在编码设置过程中让你设置音频压缩和质量设置。这里描述了三个主要的更改设置：\n\n![check.png](img/check.png)\
  \ 采样率：音频文件的采样率以千赫兹（kHz）为单位。我们这里不深究它的技术含义。只需注意较高的 kHz 会增加音频质量和文件大小。较低的 kHz 则相反。网页数字视频的一个良好且安全的设置为是\
  \ 44 kHz。\n\n![check.png](img/check.png) 采样类型：此设置按每秒比特（bps）指定音频质量。同样，bps 越高，音频质量越高，文件也越大，反之亦然。网页的良好设置为\
  \ 128 bps 或 16 Kbps。\n\n![check.png](img/check.png) 单声道与立体声：是的，现在的计算机在播放立体声音乐和其他类型的立体声音频文件方面做得很好。但请记住并非所有文件都需要两个通道。音效——如鼠标点击声、玻璃破碎等——无法从立体声播放中获益。只有当文件内容需要立体声时才使用立体声设置。单声道文件小得多。大多数移动设备不支持立体声（用户使用耳机听音乐除外），而支持的设备也无法发挥其作用。\n\
  \n![tip.eps](img/tip_opt.jpeg) 人们往往想尽全力让视频的音轨成为华丽的杰作，但让我们面对现实：许多计算机（尤其是笔记本电脑）没有音响系统来充分利用所有这些数据。完全没有理由强制你的移动用户下载所有额外的音频数据——除非音频和音频质量是视频信息的核心组成部分（例如用户在购物音频设备时）。\n\
  \n## 流\n\n流并不是在部署到网络之前对视频文件进行某种压缩或处理，而是一种从服务器向终端设备传输视频文件的过程。流是在服务器和设备之间打开一个视频通道（流），除了传输视频外，两个端点还会相互发送有关视频下载的信息。\n\
  \n流的主要目标有两个：首先是消除用户等待整个视频下载完成后才开始播放的需求，确保视频在下载时顺畅、不中断地播放。\n\n本质上，视频流有两种类型：视频流本身需要视频（或媒体）流服务器，而渐进式流则不需要。渐进式流发生在视频文件和播放器（设备上播放视频的软件）之间。渐进式流的支持必须编码到视频文件中。\n\
  \n渐进式流最成熟的形式可能是 Adobe 将后版本的 Flash Player 和 Flash Video 视频格式扩展为 FLV 和 SWF 等文件类型。Flash\
  \ Player 也可以流 MP4 和 3GP 文件，但这些文件需要嵌入 Flash 影片中 Flash Player 才能对其进行流传输。由于许多移动设备不支持\
  \ Flash，这并不总是最佳方法。\n\n\n\n\n\n许多托管公司将媒体服务器作为其托管服务的一部分。有些公司对此收费，有些则不收费。通常，使用媒体服务器需要对视频文件进行特殊处理——不仅在你的网页代码中，而且在服务器和视频文件本身也是如此。由于这些内容在不同的托管服务之间存在巨大差异，这并不是我在这里可以详细介绍的内容。如果你的托管公司提供流媒体服务，它也应该提供有关如何使用该服务的说明，包括代码规范和视频文件的处理方法。\n\
  \n如果这听起来工作量很大，那么，如果你在移动网页中使用长时长、高质量的视频，那么这些努力是值得的。你的视频运行效果会好得多，你的用户也会对此表示感谢。\n\n\
  ## 在网页中部署数字视频\n\nYouTube 提供了一种简单且有效的方法可以在你的网站中部署视频——而且没有高学习曲线。如果你的视频足够小且足够短，可以在不需要媒体服务器的情况下流畅播放，你可以使用\
  \ `<embed></embed>` 标签对将其插入到网页中，如下：\n\n`<embed src=\"video/filename.3gp\"></embed>`\n\
  \n你可以通过 `height` 和 `width` 属性控制视频的大小，如下：\n\n`<embed src=\"video/filename.3gp\" width=\"\
  352\" height=\"288\"></embed>`\n\n此外，你还可以设置视频自动开始，如下：\n\n`<embed src=\"video/filename.3gp\"\
  \ width=\"352\" height=\"288\" autostart=\"true\"></embed>`\n\n如果你不想让视频自动播放，将 `autostart`\
  \ 设置为 `\"false\"`。此配置将在你插入此代码的页面或 CSS 容器的任何地方显示并播放视频，正如第 7 章所讨论的。你应该将电影保存为 3GP 格式；否则，为了带一组播放控制控件显示视频，你需要一些帮助，例如某种插件或播放器（这也是为什么\
  \ Flash 和/或 YouTube 在设计师中如此流行的另一个原因——因为它们太容易部署了）。\n\n图 10-4 显示了将上述代码插入到使用 iPhone\
  \ 3.0 用户代理（user agents）查看网页时的结果（用户代理将在第 4 章和第 5 章中讨论）。\n\n**图 10-4：** 使用 3GP 视频格式可以嵌入视频并创建一组播放控件。\n\
  \n![9781118026229-fg1004.eps](img/9781118026229-fg1004_opt.jpeg)\n\n## 理解移动设备上的\
  \ Flash\n\nAdobe Flash 是互联网的重要组成部分。事实上，在我写这些文字时，Flash Player 安装在支持互联网的设备数量比任何其他软件都多——即使对于移动设备，尽管苹果拒绝在他们的手持设备上允许使用。当大多数人想到\
  \ Flash 时，他们想的是动画，但 Flash 的功能远不止此。Flash Video (FLV) 是交付数字视频内容的流行方法。你在网页上看到的许多花按钮和菜单都是用\
  \ Flash 制作的，而 Flash 是在线课程、调查以及许多其他数据驱动应用等互联网应用后的驱动力量。\n\n然而，移动设备上的 Flash 表现参差不齐。它的实现一直不稳定且存在问题；原因之一是\
  \ Flash 应用程序和 Flash Player 往往是内存大户。此外，直到最近，移动设备的处理器和内存分配仍然相对较弱且较小。\n\nAdobe 最初通过发布一个较小、功能较少的\
  \ Flash Player 版本——Flash Lite，专门为移动设备设计来应对这个问题。在我写这些文字时，Flash Lite 已经衍生了七个版本和一个针对\
  \ iPhone OS 的独立播放器——而今天使用的许多不同手持设备使用的是不同的版本。\n\n![remember.eps](img/remember_opt.jpeg)\
  \ iPhone OS 是用于用 Flash 开发 iPhone 应用的，而不是为 iPhone 开发网页内容。\n\n在简要查看这些不同版本以及它们如何影响网页\
  \ Flash 应用程序设计之前，我应该指出，在前一节中关于数字视频的大部分讨论也适用于 Flash 内容。Flash 电影的质量和文件大小通过控制显示尺寸、压缩、每秒帧数和声音重采样来管理；Flash\
  \ 部署在媒体服务器上也受益匪浅。\n\n### Flash Lite\n\nFlash Lite 部署在成千上万的移动设备上。Flash Lite 经历了七次重大发布。要理解每个版本支持什么，你必须了解一点\
  \ Flash 的历史——或者至少了解 Flash 后面的编程语言 ActionScript 的历史。自从 Flash 推出以来，ActionScript 已经经历了三次重大版本发布：ActionScript\
  \ 1.0、ActionScript 2.0 和 ActionScript 3.0。ActionScript 的每一次大修改新都大大增强了应用程序的功能，以及\
  \ Flash 设计师和开发者使用 Flash 能做的事情。\n\nFlash Lite 1.0 和 1.1 是 ActionScript 1.0 的子集，意味着它们支持精简版的\
  \ ActionScript 函数集。Flash Lite 2.0 和 2.1 是 ActionScript 2.0 的子集，意味着它们支持精简版的 ActionScript\
  \ 2.0 函数集。Flash Lite 3.0 是 ActionScript 3.0 的子集，这是目前广泛使用的 ActionScript 最新版本。Flash\
  \ Lite 4.0 是对 Flash 3.0 的升级。它增加了多点触功能，并基于当前最新的完整版 Flash Player，即 Flash Player 10。\n\
  \n这些版本中没有一个缺少 Flash Player 能做的所有事情——而在 Flash Lite 4.0 的情况下，它确实可以做到一些当前 Flash Player\
  \ 版本无法做的事情（例如电脑上的多点触）。\n\n\n\n\n\n**图 10-6:** 网页中嵌入三个 Flash 电影。\n\n![9781118026229-fg1006.eps](img/9781118026229-fg1006_opt.jpeg)\n\
  \nFlash 电影也受益于使用 `<object>` 标签，并通过参数控制电影播放的各个方面——例如电影质量、背景颜色、是否允许全屏播放以及其他几个选项。（`object`\
  \ 元素为浏览器提供了加载和渲染非浏览器原生对象的信息，例如 Flash 电影和数字视频。）再次，所有这些对于仅仅在网页中播放电影来说并不是必须的，但它们都具有很大的价值。\n\
  \n然而，在网页中播放 Flash 电影通常需要一些 JavaScript。通常让 Flash Professional 或 Dreamweaver 自动生成这些脚本是一个好主意，因此你真的应该使用这些程序之一来将你的\
  \ Flash 电影嵌入到页面中。\n\n## 为非 Flash 设备切换内容\n\n好了，那么那些使用完全不支持 Flash 的手持设备（即 iPhone、iPod\
  \ 和 iPad）访问你网站的移动用户呢？这里有两种方法可以为这些用户提供替代内容。第一种方法简单是将 Flash 内容（如横幅和菜单）替换为静态图像。第二种方法是将\
  \ iPhone、iPod 和 iPad 用户重定向到替代页面。\n\n### 提供替代内容\n\n如果你想走 PHP 路线，那么你需要将文件重命名为 `.php`\
  \ 扩展而不是 `.html`，这样服务器就会通过 PHP 引擎处理请求。\n\n你可能不需要提供单独的页面——如果 Flash 内容只是页面的一部分，而不是整个页面或整个网站，那么你可以这样添加回退图像/内容：\n\
  \n```\n<object\ntype=\"application/x-shockwave-flash\" data=\"../flash/banner.swf\"\
  \nwidth=\"600\" height=\"66\">\n<param name=\"movie\" value=\"../flash/banner.swf\"\
  />\n<param name=\"loop\" value=\"false\"/>\n<param name=\"wmode\" value=\"transparent\"\
  />\n<img class=\"bordered\" src=\"./images/banner.jpg\" width=\"600\" height=\"\
  66\" alt=\"某些合适的文本\"/>\n</object>\n```\n\n如果 Flash 不可用用，则显示图像；如果禁用了图像，则显示替代文本。\n\
  \n### 重定向 Apple 手持设备\n\n你可能将此代码添加到 `<head>` 部分的顶部，这样重定向就会立即发生，用户就不会加载任何不必要的内容。我把它放在内容-type\
  \ `<meta>` 标签下方，`<title>` 标签上方。\n\n```\n[HTML]<script type=\"text/javascript\">\n\
  if(navigator.userAgent.match(/iP(od|hone)/i)\n{\nlocation.href='http://www.yourdomain.com/iPhone/index.html';\n\
  }\n</script>[HTML]\n```\n\n此外，你必须将相同的代码代码段添加到你的每个页面中——所以，在你其他非移动页面上，你需要将 iPhone\
  \ 用户重定向到 `/iPhone/index.html`。为什么呢？嗯，如果人们通过搜索引擎进入你的网站，他们并不总是到达首页的。\n\n# 第 11 章\n\
  \n## 了解 HTML5 和 CSS3\n\n## 本章内容\n\n-   ![arrow](img/arrow.png) 回顾最实用的 HTML5 特性\n\
  -   ![arrow](img/arrow.png) 学习如何使用新的 HTML5 页面容器\n-   ![arrow](img/arrow.png) 理解新的\
  \ HTML5 多媒体标签\n-   ![arrow](img/arrow.png) 使用新的 HTML5 表单输入字段输入数据\n-   ![arrow](img/arrow.png)\
  \ 回顾最实用的 CSS3 特性\n-   ![arrow](img/arrow.png) 使用新的 CSS3 特殊效果\n-   ![arrow](img/arrow.png)\
  \ 使用 CSS3 多列布局安排内容\n\n过去几年出售的数百万智能手机、iPad 和其他平板电脑大部分支持 HTML5 和 CSS3。结果是——随着时间的推移，它们变得越来越普及——网页设计师的生活变得更容易了。最终，我们都将根据这些新标准进行设计，而不再需要担心哪些设备支持什么。\n\
  \n我读过一些主张，认为 HTML5 将消除第三方动画（如 Flash）以及 JavaScript 和 PHP，我们只需要 HTML5 和 CSS3。但我并不确定做出这些说辞的人是否将这些技术理解为网页设计工具。Flash\
  \ 远不仅仅是一个创建动画菜单、淡入、悬停等等的简单动画程序——而且 JavaScript 和 PHP 的功能也比格式化页面要多得多。HTML5 远不能创建开发者可以使用客户端和服务器端编程构建的应用程序。\n\
  \n然而，HTML5 和 CSS3 仍然非常棒。它们消除了跳转到 Photoshop 等第三方应用程序处理简单事情的需求——例如在 Photoshop 中为框和容器添加投影阴影和圆角。简而言之，新标准非常复杂，无疑将为我们所有人节省一些时间，并使网页文件更小，但它们并没有消除对编程、应用开发、动画程序以及图形编辑器的需求。\n\
  \n尽管如此，本章深入探讨 HTML5 和 CSS3 以及最有趣、实用的新功能。\n\n## 发现 HTML5 最新、最强大的功能\n\n所以，你可能在问自己，如果一种新的处理方式——HTML5——已经在眼前了，为什么我还在学习旧的（HTML4）？欢迎来到设计的世界：尽管你看着，它与任何\
  \ 21 世纪的设计并没有不同。正如医生和老师需要跟上最新技术一样，网页设计师（成功的那些）必须跟上行业的变化。好消息是，通常这些变化是好的，从长远来看，它们为你节省了时间和金钱。尽管在我写这些内容时，网页设计师——尤其是移动网页设计师——仅仅依靠\
  \ HTML5 和 CSS3 是不够的。这些技术就像移动移动技术一样尚未完全成熟。尽管它们正在被广泛支持，但还没有足够的移动设备支持它们来让你忽略旧的技术。\n\
  \n### 所以，HTML5 到底有什么新内容？\n\n尽管 HTML5 的变化是巨大的，但很容易将它们——至少是我想讨论的特性——分类为以下六个基本领域：\n\
  \n- ![check](img/check.png) 结构：在第 7 章中，我向你介绍了如何使用 `<div>` 标签将页面划分成容器——如页眉、页脚、菜单（导航）区域等。HTML5\
  \ 内置了许多常用部分。正如你即将看到的，这非常有用。\n- ![check](img/check.png) 矢量图形：正如在第 10 章提到的，在 HTML5\
  \ 之前，并不是所有浏览器都支持矢量或 Illustrator 绘画图形。此外，预 HTML5 网页中的位图不支持运行时修改——即在页面加载时对图形进行更改。为了补偿，网页设计师使用了\
  \ Flash 或 Microsoft Silverlight 创建这种功能。虽然学习使用代码创建矢量图形具有挑战性，但你现在可以直接在页面上使用 HTML5\
  \ 绘制。\n- ![technicalstuff](img/technicalstuff_opt.jpeg) 在非 HTML5 浏览器中使用矢量图形的例外是缩放矢量图形\
  \ (SVG)。因为 SVG 在最广泛使用的浏览器——Internet Explorer 中需要下载插件才能显示，所以大多数设计师并不使用它。此外，它在移动设备上尚未被广泛支持。\n\
  - ![check](img/check.png) 多媒体：设计师们一段时间以来一直在网页中使用音频和视频了——但由于这些元素不是早期 HTML 版本的原生元素，他们不得不依赖第三方应用程序来帮助部署声音和运动。尽管这些功能仍在开发中，但最终将使在网站中部署多媒体变得更容易。\n\
  \n\n\n\n\n![check.png](img/check.png) 增强的表单元素：如第 9 章所述，如果不在你的表单字段中进行编程验证，要让用户以特定格式输入数据是非常麻烦的。HTML5\
  \ 提供了一系列新的表单字段类型，可以帮助你控制用户向表单输入数据的方式。\n\n![check.png](img/check.png) 更好的字体用法：在 Web\
  \ 上，字体的使用一直有些笨拙。直到现在，你只能简单地调用你偏好的字体并听天命。新的浏览器允许你将字体文件包含在网页中——以确保在浏览器中显示正确的字体。\n\n\
  ![check.png](img/check.png) 其他新功能：Web 已经存在了一段时间了，我们一直依赖浏览器 Cookie 为特定网站保存用户信息。HTML5\
  \ 的本地存储允许网站保存更多数据，以及更多关于用户在你的网站上会话的有用信息。此外，如果你的用户可以在页面上拖放元素，那不是很好吗——例如，当他们将文件拖到页面上传到你的服务器时？（你现在可以做到这一点，但需要大量的脚本编写。）HTML5\
  \ 允许你在页面上创建拖放功能。最后，想象一下确定用户访问你的网站时位于世界的哪个位置将有多大的帮助。HTML5 新的地理定位（Geolocation）功能将帮助你获取这些信息。\n\
  \n## 使用 HTML5 doctype\n\n为了利用 HTML5 的优势，你必须使用正确的 doctype。（在第 1 章中，我向你展示了使用正确 doctype\
  \ 的重要性，以确保浏览器知道如何正确格式化你的页面。）HTML5 doctype 如下：\n\n```\n<!DOCTYPE HTML>\n```\n\n没有比这更简单的了！在所有新信息中，这个小细节是最容易记忆的，对吧？这种新的\
  \ doctype 还消除了页面 `<head></head>` 区域对 URL 和 `<html xmlns>` 语句的需求。然而，你仍然应该添加 `Content-Type`\
  \ 和 `charset` 语句如下：\n\n```html\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
  \ charset=utf-8\" />\n```\n\n![tip.eps](img/tip_opt.jpeg) 你可以在此 URL 找到完整的 W3C HTML5\
  \ 词汇参考，它包含了整个 HTML5 标准和标签：`http://dev.w3.org/html5/spec/Overview.html`。\n\n该 URL\
  \ 处的参考是编辑草稿，并且不断变化。它非常庞大，并不算引人的读物，但它是对新标记语言标准的全面参考。\n\n## 熟悉新的容器标签\n\n技术上称为语义化元素（semantic\
  \ elements），新的容器（或区域）标签使得划分页面部分变得更容易（且更符合逻辑）。HTML5 为你通常创建的几乎每种页面部分都有一个新标签。以下是最重要的新标签（标签名称本身就说明了一切）：\n\
  \n- `<header>`：此元素用于定义页面上各章节的标题区域。你也可以用它来创建头部部分。如第 7 章所示，页眉通常跨整个页面顶部，或至少是页面顶部的一部分。\n\
  - `<section>`：此元素创建页面的通用区域，通常是内容区域。例如，在第 7 章中，我向你展示了如何创建一个名为 `content` 的 `<div>`\
  \ 标签来存放页面的主体部分。在 HTML5 页面中，`<section>` 标签是一个很好的替代方案。`<section>` 区域也可以包含 `<header>`\
  \ 部分，尽管这不是强制的。\n- `<article>`：`<article>`元素用于定义页面上的独立项目，该项目可以独立分发。根据 W3C 的定义，“`<article>`\
  \ 标签指定独立的、自包含的内容。一篇文章本身应该是有意义的。”\n- `<footer>`：此元素用于定义页面的页脚区域。你也可以用它来创建页脚部分。页脚如第\
  \ 7 章所示，通常位于页面底部，或至少是页面底部的一部分。\n- `<nav>`：此元素用于定义页面上的导航部分。\n- `<aside>`：此元素用于定义与主要内容间接相关的内容，如侧边栏、广告等。\n\
  - `<main>`：此元素用于定义页面的主要内容。每个页面只能有一个`<main>` 元素，且它不应该包含在页面其他地方重复出现的内容。\n- `<figure>`：此元素用于标记一组独立的内容，如图片、代码段等，通常会配合`<figcaption>`\
  \ 标签使用说明。\n- `<figcaption>`：此元素用于为`<figure>` 元素提供说明标题或标题。\n\n例如，在第 7 章中，我向你展示了如何创建一个名为\
  \ `content` 的 `<div>` 标签来存放页面的主体部分。`<section>` 标签在 HTML5 页面中是一个很好的替代方案。`<section>`\
  \ 区域也可以包含 `<header>` 部分，尽管这不是强制的。\n\n- `<article>`：此元素用于定义页面上的独立项目，该项目可以独立分发。根据\
  \ W3C 的定义，“`<article>` 标签指定独立的、自包含的内容。一篇文章本身应该是有意义的。”\n\n- `<footer>`：此元素用于定义页面的页脚区域。你也可以用它来创建页脚部分。页脚如第\
  \ 7 章所示，通常位于页面底部，或至少是页面底部的一部分。\n\n- `<nav>`：此元素用于定义页面上的导航部分。\n\n- `<aside>`：此元素用于定义与主要内容间接相关的内容，如侧边栏、广告等。\n\
  \n- `<main>`：此元素用于定义页面的主要内容。每个页面只能有一个`<main>` 元素，且它不应该包含在页面其他地方重复出现的内容。\n\n- `<figure>`：此元素用于标记一组独立的内容，如图片、代码段等，通常会配合`<figcaption>`\
  \ 标签使用说明。\n\n- `<figcaption>`：此元素用于为`<figure>` 元素提供说明标题或标题。\n\n\n\n\n\n![check.png](img/check.png)\
  \ 第 1–16 行：此代码创建了页面以及顶部的 `<hgroup>` 。\n\n![tip.eps](img/tip_opt.jpeg) 如果你使用 Dreamweaver\
  \ (CS5 或更高版本)，可以在“新建文档”对话框的 Doctype 下拉列表中选择 `HTML5`。此外，当你使用 HTML5 文 时，Dreamweaver\
  \ 的代码提示（Code Hinting）会为 HTML5 提供代码输入建议。\n\n![check.png](img/check.png) 第 18–24 行：导航部分和菜单列表。井号（`#`）只是占位符。你可以在此文档中使用任何你想要的\
  \ URL —— 以及任何你想要的文本。\n\n![check.png](img/check.png) 第 26–36 行：`<article>` 部分。注意\
  \ header 和 section 单词周围的 `&lt;` 和 `&gt;`。这实际上是在页面上显示大于（`>`）和小于（`<`）符号所需的代码。除非以这种方式输入，否则浏览器会认为这些符号是标记的一部分。\n\
  \n你生成的页面应该看起来像图 11-2。\n\n**图 11-2：** 使用 HTML5 代码创建的网页。\n\n![9781118026229-fg1102.tif](img/9781118026229-fg1102_opt.jpeg)\n\
  \n## 绘制矢量图形\n\nHTML5 支持 SVG —— 使用 `<canvas>` 标签在运行时或动态创建。（矢量图形将在第 10 章中讨论。） 绘图可以通过\
  \ `<canvas>` 标签和一些内置的 JavaScript 绘图能力（这稍微超出了本书的范围）来实现。你也可以使用 `<svg>` 标签和对 `w3c.org`\
  \ 的 xmlns 引用，如图 11-3 所示。但这仍然需要一些编程技能和投入。我用高贵的图形编辑器绘图已经足够困难了，更不用说尝试用代码来实现。（如果你对用\
  \ JavaScript 绘图感兴趣，我建议你查阅 Andy Harris 写的《JavaScript and AJAX For Dummies》。）\n\n\
  **图 11-3：** 用代码绘制 SVG 2D 图形的示例。\n\n![9781118026229-fg1103.eps](img/9781118026229-fg1103_opt.jpeg)\n\
  \n如果你愿意胜任这项任务，你可以利用此功能做很多事情，包括创建界面，让用户可以通过输入参数（如图表数据和其他预设信息）来创建自己的图形。正如人们所说，天高无际。例如，查看图\
  \ 11-4 中猫的画。令人印象深刻，对吧？绘制它的代码也是！\n\n**图 11-4：** 这只猫是用 HTML5 的 `<svg>` 标签绘制的。\n\n\
  ![9781118026229-fg1104.tif](img/9781118026229-fg1104_opt.jpeg)\n\n## HTML5 多媒体标签\n\
  \n在第 10 章中，我向你了如何使用 `<embed>` 在页面上显示视频。我建议你使用 YouTube 或其他视频传输服务作为媒体服务器。目前各种浏览器对\
  \ HTML 5 的实现并没有让我改变这一建议。目前浏览器对 HTML5 标准这部分的实现充其量是不尽人意的。\n\nHTML5 中有两个新的 HTML5 多媒体标签：用于嵌入数字视频的\
  \ `<video>` 和用于嵌入音频的 `<audio>`。问题在于，不同的浏览器发行商似乎无法确定或同意支持哪些视频格式。\n\n### 数字视频\n\n\
  W3C 原意是使用免费的开放标准 OGG 容器格式。但某些浏览器发行商对其有异议。截至今天（2011 年春季），只有少数浏览器 —— Firefox、Chrome\
  \ 和 Opera 是最值得注意的 —— 支持该格式。最终，这些冲突都会得到解决，到时候，OGG 格式（或最终确定的任何格式或多个格式）应该像下面的练习所示的那样工作。为了跟进，你需要从本书的辅助网站下载一个\
  \ OGG 格式的视频。\n\n创建一个新网页并添加列表 11-2 中的代码。\n\n代码列表 11-2：HTML5 语义元素\n\n```\n<!DOCTYPE\
  \ HTML>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
  \ charset=utf-8\">\n<title>HTML5 Video Example</title>\n</head>\n<body>\n<section>\n\
  \    <header>\n      <h1>Video Header</h1>\n    </header>\n    <p>\n      <video\
  \ src=\"big_buck_bunny.ogg\" width=\"320\" height=\"200\" controls autoplay>\n \
  \     </video>\n    </p>\n</section>\n</body>\n</html>\n```\n\n[/content] \n\n你完成的页面应该像图\
  \ 11-5。\n\n**图 11-5：** HTML5 `<video>` 标签示例及生成的视频。\n\n![9781118026229-fg1105.tif](img/9781118026229-fg1105_opt.jpeg)\n\
  \n![tip.eps](img/tip_opt.jpeg) YouTube 已经跟上了潮流，并为其当前的 Flash Player 提供了 HTML5 替代方案。总来说，这比寻找一种可以在所有浏览器中播放的视频格式要好得多。（如果你已有\
  \ YouTube 账户，可以在 youtube.com/html5 注册）。\n\n### 数字音频\n\n正如前一节讨论的视频一样，要在所有浏览器中播放音频文件是很棘手的，甚至是不可能的。原因相同：对支持的格式存在争议。\n\
  \n尽管如此，你在 HTML5 页面中嵌入音频的方法与嵌入视频的方法几乎相同。只是你不是使用 `<video>` 标签，而是使用 `<audio>` 标签，如下：\n\
  \n`<audio src=\"audiofile.ogg\" controls>你可以在这里放置任何想要的字幕文本。</audio>`\n\n## HTML5\
  \ 表单\n\nHTML 表单存在一段时间了（非 HTML5 表单将在第八章讨论）。在 HTML5 之前，它们并没有太大变化。大多数常用的表单功能 —— 主要是字段类型的验证、提交等\
  \ —— 通常来自某种形式的脚本，无论是客户端 JavaScript 还是服务端 PHP。HTML5 中许多新的表单字段类型设计用于消除这些编程，这是一个大好消息！\n\
  \n坏消息是，到目前，大多数浏览器尚未实现大部分或任何这些表单功能。到目前（我写这些时），只有 Opera（如图 11-6 所示）在实现这些新功能方面取得了重大进展。如图所示，当这些新功能被广泛使用时，它们将非常实用。\n\
  \n**图 11-6：** Opera 中某些 HTML5 表单字段的示例。注意日历组件和滑动优先级条。\n\n![9781118026229-fg1106.eps](img/9781118026229-fg1106_opt.jpeg)\n\
  \n这些新元素可能对你这个设计者和用户都有益，因为它们有助于控制用户如何输入数据。在某些应用程序中，正如第九章所讨论的，你接收数据的方式可能是至关重要的。这些新元素究竟有多用，真的取决于浏览器开发者和移动设备制造商的实现程度。目前这还有待观察。以下是一些更具前景的\
  \ HTML5 元素的概述：\n\n\n\n\n\n![check.png](img/check.png) 数字（`number`）：`number` 元素将字段限制为数值输入。根据其实现方式的不同，你可以定义几个不同的属性来指定字段的行为。例如，此元素支持\
  \ `step` 值，它可以强制用户输入根据 `step` 标准发生变化的值。例如，`step=\"2\"` 属性会强制输入增量每次跳转 2，如 2, 4, 6,\
  \ 8 等。`Number` 还支持 `min` 和 `max` 属性，可以将输入限制在一个值范围内。如果你使用（例如）`min=\"0\"` 和 `max=\"\
  10\"` 属性，那么用户将无法输入 0 到 10 范围之外的值。某些浏览器还会显示一个“数字调节器（spinner）”，这是一组向上和向下的箭头，点击它们时，数值会自动增加或减少，正右图\
  \ 11-6 所示。在这种情况下，如果你将 `step`、`min` 和 `max` 与数字调节器结合使用，点击箭头将根据属性中设置的值调整数字。如果你使用我在段落中使用的\
  \ 0-10 步长为 2 的值，数字调节器会将数字增加 2 并在 10 处停止。\n\n![check.png](img/check.png) URL（`Url`）：此元素用于输入网络地址。它没有特殊的格式要求。但对于移动设备（当正确实现时），它会调出特殊的键盘配置来输入\
  \ URL。某些移动设备在标准的、非 HTML5 表单字段上已经具备了这一功能——即当它们能够识别出该字段是用于输入 URL 时（通常是在你在移动浏览器的地址栏中打字时）。\n\
  \n![check.png](img/check.png) 电子邮件（`Email`）：此元素在正确实现时，会为用户的移动键盘配置输入电子邮件地址——提供更方便的\
  \ @ 符号访问——并检查输入是否为有效的电子邮件地址。\n\n![check.png](img/check.png) 日期（`Date`）：在支持的情况下，此元素（如图\
  \ 11-7 所示）提供了一个交互式日历，允许用户通过从日历中选择来输入日期。此的一个巨大优势是它允许你控制用户输入数据的方式，而无需编写脚本进行验证。\n\n\
  ![check.png](img/check.png) 时间（`Time`）：此元素显示一个小型的时间字段和一个数字调节器（向上和向下箭头），用户可以直接输入时间，也可以使用调节器。在任何情况下——只要浏览器支持——`time`\
  \ 都允许你控制如何从用户处接收时间数据。\n\n![tip.eps](img/tip_opt.jpeg) 你还可以结合 `date` 和 `time` 元素，如图\
  \ 11-6 中的“Callback on”行所示。代码如下：\n\n```\n<label for=\"contact_callback\">Callback\
  \ on:</label>\n<input type=\"datetime\" id=\"contact_callback\"><br />\n```\n\n\
  ![check.png](img/check.png) 范围（`Range`）：此元素（如图 11-6 中的“Priority”行所示）允许用户在支持支持的浏览器中通过滑块输入数据。`range`\
  \ 元素与之前讨论的 `number` 元素类似，相似之处在于它也支持 `step`、`max` 和 `min` 属性。\n\n这里是其他一些值得提及的新元素，在经过前面的讨论后，它们的名称本身就通而易懂：\n\
  \n![check.png](img/check.png) 颜色（color）\n\n![check.png](img/check.png) 本地时间（datetime-local）\n\
  \n![check.png](img/check.png) 月份（month）\n\n![check.png](img/check.png) 数字（number）\n\
  \n![check.png](img/check.png) 搜索（search）\n\n![check.png](img/check.png) 电话（tel）\n\
  \n![check.png](img/check.png) 时间（time）\n\n![check.png](img/check.png) 周（week）\n\n\
  ## 部署 HTML5 表单元素\n\n在大多数情况下，新元素的代码构建与在 HTML 之前的版本中使用表单元素非常相似，正如第 9 章所讨论的那样。主要的区别在于现在有了更多元素，并且它们带来了一些新属性。图\
  \ 11-6 中表单的代码如列表 11-3 所示。\n\n列表 11-3：HTML5 表单\n\n```\n<!DOCTYPE HTML>\n<html>\n\
  <head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\">\n\
  <title>HTML5 Forms</title>\n<link href=\"forms.css\" rel=\"stylesheet\" type=\"\
  text/css\">\n</head>\n<section>\n   <header>\n      <h1>Contact Me Please</h1>\n\
  \   </header>\n   <p><form>\n      <label for=\"contact_name\">Name:</label>\n \
  \     <input id=\"contact_name\" width=\"150\" placeholder=\"Your name\" autofocus\
  \ ><br />\n      <label for=\"contact_email\">E-mail:</label>\n      <input type=\"\
  email\" id=\"contact_email\" placeholder=\"Your email address\"><br />\n      <label\
  \ for=\"contact_phone\">Phone:</label>\n      <input type=\"tel\" id=\"contact_phone\"\
  \ placeholder=\"Your phone number\"><br />\n      <label for=\"contact_callback\"\
  >Callback on:</label>\n      <input type=\"datetime\" id=\"contact?callback\"><br\
  \ />\n      <label for=\"time\">Time</label>\n      <input type=\"time\" id=\"time\"\
  \ width=\"100\" ><br />\n      <label for=\"priority\">Priority:</label>\n     \
  \ <input type=\"range\" min=\"0\" max=\"10\" step=\"2\" value=\"10\"><br />\n  \
  \ </form></p>\n</section>\n```\n\n## 附加功能\n\n除了新的表单元素外，HTML5 还具有两个实用的新功能。第一个是 `autofocus`，它告诉浏览器在页面渲染时自动聚焦某个字段。第二个功能是\
  \ `placeholder` 属性，它允许在字段为空时显示文本。`autofocus` 和 `placeholder` 的示例如图 11-7 所示。\n\n\
  **图 11-7:** autofocus 和 placeholder 的示例\n\n### 嵌入字体\n\n在 PDF、Flash SWF 以及其他类型的文档中嵌入字体已经很长时间了。但对于浏览器技术来说，它是新的。字体嵌入的想法是让字体随页面传输。通常情况下，你只需将字体文件保存在服务器上并在\
  \ HTML 文件中调用它，就像调用图像或视频文件一样。\n\n![warning.eps](img/warning_opt.jpeg) 字体文件并不小。而且你的移动用户必须为你使用的每种字体或每种样式（如粗体和斜体）下载单独的文件。因此，你应该谨慎使用此功能，不要让你的移动页面加载大量的嵌入字体。\n\
  \n### 关于字体文件\n\n从技术上讲，许多字体文件都是“授权的”，这意味着分发它们是非法的。将它们保存在服务器上允许用户下载等同于分发文件。因此，为了避免麻烦，请使用开源格式。你可以在互联网上的多个地方找到它们，例如\
  \ Google Fonts：[www.google.com/webfonts](https://www.google.com/webfonts)。\n\n此外，并不是所有浏览器都支持所有字体格式。大多数支持\
  \ TrueType（TTF）字体或 OTF（TTF 的免费版本）。Internet Explorer 使用它自己的格式，即 EOT。\n\n为了确保所有浏览器都能获取字体，你应该嵌入并上传多个版本。你可以在此处找到转换字体的工具：[www.microsoft.com/typography/weft.mspx](https://www.microsoft.com/typography/weft.mspx)。\n\
  \n### 如何嵌入字体\n\n字体实际上嵌入在你的样式表中，而不是 HTML 文件中，如列表 11-4 所示。当你在样式表中调用它们时，就可以像第 6 章所讨论的那样正常使用它们。\n\
  \n列表 11-4：嵌入字体\n\n```\n@charset \"utf-8\";\n/* CSS Document */\n@font-face {\n \
  \  font-family: \"Tahoma\";\n   src: url(Tahoma.otf;\n}\n@font-face {\n   font-family:\
  \ \"Tahoma\";\n   src: url (\"Tahoma.eot\");\n}\nh1 {\n```\n\n\n\n\n```css\n   \
  \ font-family: Tahoma;\n    font-size: 200%;\n}\n\nh1 {\n    font-family: Tahoma;\n\
  \    font-size: 100%;\n}\n```\n\n# 嵌入与使用字体\n\n## 步骤\n\n1. 在网站的本地根目录下创建一个子目录——我将其命名为\
  \ `fonts`。\n\n2. 如清单 11-4 所示，在 CSS 文件中引用这些字体。\n\n将字体声明放在 CSS 文件靠近顶部的位置，以便它们能立即开始下载。`@`\
  \ 符号用于开始一个新的 CSS 元素。请确保在 `url` 属性中包含了路径。\n\n3. 如清单 11-4 所示，将字体添加到样式选择器中。\n\n4. 像平常一样格式化文本。\n\
  \n当用户在其互联网设备上没有安装这些字体时访问你的网站，字体将会下载，浏览器会使用它们来格式化文本。不过请记住，使用不支持现代浏览器的手持设备访问你网站的用户无法利用这项技术。你应仅对课堂简介中讨论的设备（如较新的智能手机和平板设备）使用此功能，具体请参见第\
  \ 5 章。\n\n# 其他值得关注的 HTML5 特性\n\nHTML5 为设计师的工具箱带来了许多新特性。有些特性比其他特性更为突出。其中三个我觉得特别有趣：拖放、本地存储和地理定位。以下是每个特性的简要概述：\n\
  \n## 拖放\n\n![check.png](img/check.png) 在非 HTML5 页面中，要在任何 Web 应用程序中实现拖放功能，需要复杂的 PHP\
  \ 或 JavaScript。如果你使用过 Google Docs（或其他允许上传文件的在线应用程序），该应用程序允许你将文件从桌面、Windows 资源管理器或\
  \ Mac 的 Finder 中拖放到浏览器窗口的指定位置。有些网站使用 Flash 来实现这一功能；而 HTML5 在完全实现后，将允许你在没有特殊编程或 Flash\
  \ 的情况下完成此操作。\n\n## 本地存储\n\n![check.png](img/check.png) Google Docs 为此功能提供了一个很好的应用示例。当本地存储选项在浏览器中实现并内置于你的代码中时，它会自动将这些文档（在线电子表格、文字处理文档、演示文稿以及其他文件格式，如图\
  \ 11-8 所示）保存到用户的机器上。用户随后可以在离线状态下对文档进行修改，当浏览器检测到互联网连接时，会自动同步这些文档。目前，对于 Google Docs\
  \ 等应用程序，用户必须手动保存文档并手动上传。文件会被完全替换。\n\n**图 11-8：** 这个在线电子表格是一种可以利用 HTML5 本地存储的应用程序。\n\
  \n![9781118026229-fg1108.tif](img/9781118026229-fg1108_opt.jpeg)\n\n二十九位独立的《Computer\
  \ Shopper》评测员会更新图 11-8 中的电子表格并添加信息。HTML5 的本地存储功能会自动将电子表格保存到每个用户的本地机器上，允许他们离线工作，然后在评测员重新上线时同步更改。\n\
  \n## 地理定位\n\n![check.png](img/check.png) 此选项利用当今许多手持设备中的 GPS 功能来确定用户的位置。可以想象，这有许多应用——例如，在填写购物车表单时帮助确定位置、根据位置获取报价、以及搜索本地服务。我曾访问过具有此功能的移动网站（不过是通过脚本实现的，而非\
  \ HTML5）。所有这些网站都会请求允许定位我——出于显而易见的原因，这一点非常重要。有些网站，比如 Staples 的移动网站，甚至可以精确定位到我当时浏览所在的建筑地址。这有点令人不安，但能节省大量时间——并且有助于减轻一些移动用户在填写表单时的挫败感。\n\
  \n# 审视最有用的 CSS3 增强功能\n\n如前所述，HTML5 在所有主流浏览器中的支持程度相当不均衡。在我撰写本文时，CSS3 的情况也类似，而且与 HTML5\
  \ 一样，使用新规则和选择器的结果因浏览器而异。最终，在不太遥远的将来，这一切都会趋于平稳，我们将从使用新标准中获得更可预测的结果。CSS3——如果实现得当——将显著拓宽\
  \ HTML 文档中的格式化选项。在本节中，我将介绍一些更有前景的选项及其使用方法。\n\n![tip.eps](img/tip_opt.jpeg) CSS3\
  \ 选项（规则、选择器、标签等）的列表相当广泛。你可以在 CSS.info 博客（[`www.css3.info`](http://www.css3.info)）上找到大量关于\
  \ CSS3 开发的信息，以及最新的新闻、更新和变更。整个标准本身以及最全面的文档都在 W3C 网站上（见图 11-9），网址为 [`www.w3.org/Style/CSS/current-work.en.html`](http://www.w3.org/Style/CSS/current-work.en.html)。\n\
  \n再次强调，新的格式化选项非常丰富。我很难决定在这里重点介绍哪几个。我建议你去 W3C 网站看看，找到其他可能对你有用的选项。\n\n**图 11-9：**\
  \ W3C 关于 CSS 格式化标准（包括 CSS3）的页面。\n\n![9781118026229-fg1109.tif](img/9781118026229-fg1109_opt.jpeg)\n\
  \n![tip.eps](img/tip_opt.jpeg) W3C 还有一个内容丰富的教程网站。它描述了所有 HTML 和 CSS 元素及属性，并附有很好的示例。你可以通过页面右上角的搜索选项或左侧栏中的\
  \ W3C 教程菜单轻松找到任何版本的 HTML 或 CSS 信息。例如，要查找 HTML5 信息，只需搜索 HTML5。CSS 教程页面（如图 11-10 所示）起始于\
  \ [`www.w3schools.com/w3c/w3c_css.asp`](http://www.w3schools.com/w3c/w3c_css.asp)。\n\
  \n**图 11-10：** W3Schools 网站提供了关于如何使用 HTML5 和 CSS3 的丰富教程和示例。\n\n![9781118026229-fg1110.tif](img/9781118026229-fg1110_opt.jpeg)\n\
  \n尽管 CSS3 支持的新元素列表相当广泛，但并非所有新功能都具有突破性。以下列表讨论了我认为最有用的功能：\n\n## 特殊效果\n\n![check.png](img/check.png)\
  \ CSS3 有一系列新的效果属性，在许多情况下确实可以消除使用图形应用程序的需要。特别值得关注的是 `border-radius`（圆角框和容器角）、`box-shadow`（容器投影）和\
  \ `text-shadow`（文本投影）。\n\n## 多列\n\n![check.png](img/check.png) 这是一个巨大的功能。类似于文字处理器和页面布局程序（如\
  \ Adobe InDesign），此选择器允许你将文本“流”到多个列中。例如，当你编辑第一列中的文本时，其后的文本会自动流动或重排以反映更改。多列还有其他几个有用的选项，本章稍后会讨论。\n\
  \n## 其他有用功能\n\n![check.png](img/check.png) 其他一些有趣的 CSS3 功能包括对某些新色彩空间的支持，例如 `RGBA`（红、绿、蓝、Alpha）、`HSL`（色相、饱和度、亮度）和\
  \ `HSLA`（色相、饱和度、亮度、Alpha）。我们将不再局限于 `RGB`（红、绿、蓝）色彩空间中的颜色，从而提供更广泛的可用颜色。HTML5 还将支持媒体查询，允许你为特定屏幕或查看区域创建样式。换句话说，你可以根据各种设备的显示尺寸创建样式；浏览器随后会根据该屏幕尺寸格式化页面，因此有时你无需为同一网站创建多个版本。浏览器实际上会查询设备的当前显示尺寸。\n\
  \n## 使用新的 CSS3 功能\n\n\n\n\n请看图 11-11 中的页面。注意页脚框周围的投影投影、菜单栏以及“公司或标题”和“文章标题”文本字符串中文字的阴影。还要注意菜单栏上的圆角以及包含日期的的小框。在\
  \ CSS3 出现之前，这些效果中的每一种都需要你在外部程序中创建图形。而我使用 CSS3 实现了所有这些效果（以及其他几种效果）。\n\n**图 11-11：**\
  \ 使用 CSS3 可以实现的特殊效果示例。\n\n![9781118026229-fg1111.tif](img/9781118026229-fg1111_opt.jpeg)\n\
  \n在大多数情况下，使用新的 CSS 效果与使用旧效果相同，正如第 2 节和第 6 节讨论的那样。你只需要了解它们以及它们支持的属性，当然，还有如何在选择器中输入这些属性。话如此，我们来尝试其中的几个。\n\
  \n![check.png](img/check.png) 框阴影：框阴影（`box-shadow`）会在你的 CSS 框或容器周围创建投影投影，赋予它们 3D\
  \ 外观。如果使用得当且不过于使用，投影投影不仅具有吸引力，还可以通过微妙地划分区域来打破页面的单调。在 HTML5 出现之前，在网页上实现投影投影的唯一方法是嵌入背景图像或用\
  \ JavaScript 绘制它们，这可不是易事。\n\n要为图 11-11 中的菜单栏创建投影投影，你会在 CSS 选择器中使用 `box-shadow` 属性，如下：\n\
  \n```\nbox-shadow: 4px 4px 5px #333;\n```\n\n从左到右，`box-shadow` 属性分别是：\n\n• 水平偏移的长度，或者阴影在水平方向上的尺寸\n\
  • 垂直偏移的长度，或者阴影在框的指定侧的尺寸\n• 阴影的模糊半径\n\n前两个属性的正值会将阴影置在元素的右侧和下方。负值将阴影置在左侧和上方。因此，我们在这里使用的设置为菜单栏添加了阴影，向右偏移\
  \ 4 像素并位于底部，带有 5 像素的模糊。最后一个属性是投影投影的颜色。在这种情况下，它是灰色的。\n\n![check.png](img/check.png)\
  \ 文字阴影：文字阴影的工作方式与框阴影相同，属性也相同。区别在于它们使用的是 `text-shadow` 而不是 `box-shadow`，而且是文本本身具有投影，而不是文本所在的容器。为图\
  \ 11-11 中的“文章标题”文字创建投影投影，代码如下：\n\n```\ntext-shadow: 2px 2px 5px #333;\n```\n\n从左到右，`text-shadow`\
  \ 属性分别是：\n\n• 水平偏移的长度，或者阴影在水平方向上的尺寸\n• 垂直偏移的长度，或者阴影在文本指定侧的尺寸\n• 阴影的模糊半径\n\n前两个属性的正值会将阴影置在文本的右侧和下方。负值将阴影置在左侧和上方。因此，我们在这里使用的设置为文本添加了阴影，向右偏移\
  \ 2 像素并位于底部，带有 5 像素的模糊。最后一个属性是投影投影的颜色。在这种情况下，它是灰色的。\n\n页面顶部头部容器中的文字具有更强的阴影。它的属性如下：\n\
  \n```\ntext-shadow: 4px 4px 5px #333;\n```\n\n![check.png](img/check.png) 圆角：如图\
  \ 11-11 中的菜单栏和日期框所示，圆角使框的边缘变圆，赋予它们更柔和、精致的外观。你使用 `border-radius` 属性创建圆角。然而，这并不十分简单。在我写这些文字时，并不是所有浏览器处理此选项的方式相同。为了在某些浏览器中生效，你必须为属性添加浏览器前缀。例如，为了让此效果在\
  \ WebKit 浏览器（iPhone、iPad、iPod 和大多数 Android 设备的默认浏览器）中生效，你会这样写属性：\n\n```\nwebkit-border-radius:\
  \ 6px;\n```\n\n当然，该属性设置了圆角的尺寸，单位为像素。要在 Firefox Mobile、Chrome Mobile 以及其他基于 Mozilla\
  \ 的浏览器中设置圆角，你需要使用 `-moz-` 扩展：\n\n```\nmoz-border-radius: 6px;\n```\n\nOpera 浏览器（包括\
  \ Opera Mobile）使用 `-o-` 扩展：\n\n```\no-border-radius: 6px;\n```\n\nCSS3 中有一系列新效果，远比我在一个章节中能列举和介绍的要。与此同时，这里有一些巧妙效果的列表：\n\
  \n- `background`：这个不是新的，但现在它支持多重背景。\n- `background-clip`：你可以使用这个来裁剪背景，使其不延伸到边框。\n\
  - `background-origin`：这个用于确定特定框内背景的[背景位置](http://www.w3.org/TR/css3-background/#background-position)是如何计算的。\n\
  - `background-size`：这个属性不言自明。\n- `border-image`：这个允许使用图像作为边框。\n- `border-color`：这个不是新的，但现在它支持渐变。\n\
  - `opacity`：这个控制对象的透明度。\n- `outline-offset`：与 `outline` 配合使用，允许通过指定的像素数设置轮廓。\n-\
  \ `resize`：正如我听到的，这允许创建调整大小的 `textarea`。\n- `text-overflow`：这个选项提供视觉提示，例如省略号，告诉用户还有更多文本。\n\
  - `word-wrap`：这个允许换行以创建更好的列效果。\n\n**图 11-12：** 使用 CSS 调整大小的 textarea\n\n![9781118026229-fg1112.tif](img/9781118026229-fg1112_opt.jpeg)\n\
  \n### 使用多列\n\n这种技术上被称为多列布局的功能允许你在无需为每列创建单独容器的情况下创建列。类似于文字处理程序和页面布局软件，文本从一列“流”到另一列。这意味着浏览器知道列整体而不是独立的字符串——如图\
  \ 11-13 所示。\n\n这确实是一个期待已久的功能。在我写这些时，多列布局尚未完全实现；你需要浏览器扩展。\n\n![tip.png](img/tip.jpeg)\
  \ 你注意到第二列第一行的锯齿效果了吗？这当然是使用 `text-align: justify` 设置文本完全对齐的结果。CSS3 提供了许多调整间距的选项（你也可以使用\
  \ `word-wrap` 来修复这个问题）。或者你可以选择不对列中的文本进行对齐。然而，如果你倾向于对齐列（这对于某些类型的文档看起来更好），可以在 W3.org\
  \ 找到关于调整间距、`word-wrap` 以及其他有用功能的信息：[`www.w3.org/TR/2011/WD-css3-text-20110215/](http://www.w3.org/TR/2011/WD-css3-text-20110215/)。\n\
  \n**图 11-13：** 使用规则（线）分隔列的 CSS3 多列布局示例\n\n![9781118026229-fg1113.tif](img/9781118026229-fg1113_opt.jpeg)\n\
  \n### 设置多列\n\n多列布局在我写这些时尚未完全实现，但大多数浏览器已经采纳了它。因此，你可以配合网络扩展使用它。如此，我们来设置图 11-13 所示的三列布局。只需遵循以下步骤：\n\
  \n1. 使用如下 HTML5 文档创建一个新的 HTML5 文档：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\">\n<title>多列布局</title>\n\
  <link href=\"multi.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n\
  \n</body>\n</html>\n```\n\n2. 将文档保存为 `multi.html`。\n\n\n\n# 使用 CSS3 实现多列布局\n\n##\
  \ 入门\n\n### 步骤 3：创建新的 CSS 文档\n\n创建一个新的 CSS 文档，如下所示，然后将其保存为 `multi.css`。\n\n```css\n\
  @charset \"utf-8\";\n\n/* CSS Document */\n\n* {\n   font-family: Lucida Sans, Arial,\
  \ Helvetica, sans-serif;\n}\n```\n\n### 步骤 4：将文本复制到剪贴板\n\n找到一段与图 11-13 中三个文本列一样长或更长的文本块，然后将其复制到系统剪贴板。\n\
  \n### 步骤 5：在 HTML 中设置容器框架\n\n在 `multi.html` 中，在 `<body></body>` 标签之间，设置以下容器框架：\n\
  \n```html\n<section>\n   <header>\n      <p><h1></h1></p>\n   </header>\n      <p></p>\n\
  </section>\n```\n\n### 步骤 6：添加标题文本\n\n在 `<h1></h1>` 标签之间，输入你想要的任何标题。\n\n### 步骤 7：将文本粘贴到容器中\n\
  \n将剪贴板上的文本粘贴到第二组 `<p></p>` 标签之间。\n\n### 步骤 8：添加 CSS 选择器和属性\n\n在 `multi.css` 中，在字体选择器语句下方，插入以下选择器和属性：\n\
  \n```css\nheader > h1 {\n   font-size: 200%:\n   font-weight: bold;\n   color: #000;\n\
  \   text-shadow: 2px 2px 5px #333;\n}\n\nsection {\n   -moz-column-count: 3;\n \
  \  -webkit-column-count: 3;\n}\n```\n\n此示例为大多数移动设备（如所有 Apple 手持设备、Android 设备以及使用\
  \ WebKit 或 Mozilla 浏览器内核的其他设备）设置了三列布局。支持此功能的设备列表非常广泛且在不断增长。在我撰写本文时，Opera 和 Internet\
  \ Explorer 不支持 CSS3 的这一部分。\n\n![tip.eps](img/tip_opt.jpeg) 手持设备的多列布局是有限的。例如，截至 2011\
  \ 年初春，Internet Explorer 不支持 HTML5 或 CSS3 多列布局。你可以使用 CSS2 `<div>` 容器在这些设备上创建多列，如第\
  \ 2 章和第 7 章所述，以及 cvwdesign.com 的 JavaScript 解决方案，网址为 [`http://www.cvwdesign.com/txp/article/360/multi-column-layout-with-css3-and-some-javascript`](http://www.cvwdesign.com/txp/article/360/multi-column-layout-with-css3-and-some-javascript)。\n\
  \n## 格式化多列布局\n\n要控制列间距（列之间的空间）和分隔线（列之间的垂直线），你可以使用带有浏览器扩展的 CSS3 属性，如下步骤所示：\n\n###\
  \ 步骤 1：设置列间距\n\n在 `multi.css` 中的 `section` 选择器中（在前面的部分创建），插入以下属性和浏览器扩展：\n\n```css\n\
  -moz-column-gap: 1em;\n-webkit-column-gap: 1em;\n```\n\n列间距以 em 为单位测量。em 是排版中的测量单位。它定义了相对于当前字体点大小的字母宽度和高度的比例。在这种情况下，列为\
  \ 1 em。\n\n### 步骤 2：设置分隔线\n\n要在列之间添加分隔线，请在 `section` 选择器中插入以下属性：\n\n```css\n-moz-column-rule:\
  \ 1px solid black;\n-webkit-column-rule: 1px solid black;\n```\n\n### 步骤 3：两端对齐列\n\
  \n要对列进行两端对齐，请在 `section` 选择器中插入此属性：\n\n```css\ntext-align: justify;\n```\n\n保存两个文件并在\
  \ WebKit 或 Mozilla 浏览器中打开 `multi.css` 后，你的页面应该有三列，分隔线将它们分开。如果没有，请仔细检查你的代码。它应该看起来像清单\
  \ 11-5 和 11-6 中的示例。\n\n## 示例清单\n\n### 清单 11-5：多列 HTML5 页面\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
  \ charset=utf-8\">\n<title>Multicolumn Layout</title>\n<link href=\"multi.css\"\
  \ rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n   <section>\n      <header>\n\
  \         <p><h1>Multicolumn Layout:</h1></p>\n      </header>\n         <p>Lorem\
  \ ipsum dolor sit amet, consectetuer adipiscing elit. Aenean egestas blandit ipsum.\
  \ Morbi nulla metus, luctus et, ullamcorper sit amet, commodo quis, nisl. Ut blandit\
  \ lacus nec nibh. Phasellus eleifend enim et risus. Nam condementum. Praesent euismod\
  \ auctor dui. Nun cut leo vel magna adipscing tempor. Donec pretium, ligula et hendrerit\
  \ faucibus, sem velit accumsan tortor, sodales tempo rest ligula non velit. Nulla\
  \ sagittis, odio quis porta nonummy, mauris arcu gravid odio, quis aliquam lacus\
  \ elit non libero. Proin aliquam augue accumsan augue. Quisque ut eros at erat ultrices\
  \ sodales. Nunc vitae ipsum. Mauris in elit in dolor imperdiet interdum. Vivamus\
  \ egestas sagittis justo. Sed lorem. Sed vel neque in ipsum gravid nonum my. Nulla\
  \ tempor blandit </p>\n   </section>\n</body>\n</html>\n```\n\n### 清单 11-6：多列 CSS3\
  \ 页面\n\n```css\n@charset \"utf-8\";\n\n/* CSS Document */\n\n* {\n   font-family:\
  \ Lucida Sans, Arial, Helvetica, sans-serif;\n}\n\nheader > h1 {\n   font-size:\
  \ 200%;\n   font-weight: bold;\n   color: #000;\n   text-shadow: 2px 2px 5px #333;\n\
  }\n\nsection {\n   -moz-column-count: 3;\n   -moz-column-gap: 1em;\n   -moz-column-rule:\
  \ 1px solid black;\n   -webkit-column-count: 3;\n   -webkit-column-gap: 1em;\n \
  \  -webkit-column-rule: 1px solid black;\n   text-align:justify\n}\n```\n\n![remember.eps](img/remember_opt.jpeg)\
  \ `text-align` 属性并非 CSS3 新增。你可以在非 CSS3 和非 HTML5 页面中使用它。\n\n## 其他 CSS3 功能\n\nCSS3\
  \ 还包含许多其他有用的新功能——足以写满一整本书还有余。以下是我从列表中挑选出的几个值得提及的功能：\n\n![check.png](img/check.png)\
  \ 新的色彩空间：CSS3 允许你从几种新的色彩模型定义颜色，包括对新色彩值的支持，例如 HSL（色相、饱和度、亮度）和两个带有 alpha 属性的色彩值——RGBA（红、绿、蓝、Alpha）和\
  \ HSLA（色相、饱和度、亮度、Alpha）。Alpha 测量不透明度或透明度。你可以在 W3C 网站上查看 CSS3 色彩空间的深入讨论，网址为 [`http://www.w3.org/TR/css3-color`](http://www.w3.org/TR/css3-color)。\n\
  \n![check.png](img/check.png) 媒体查询：媒体查询允许你根据设备的视口或显示尺寸为不同设备定义不同的样式。系统会查询设备当前的显示尺寸，浏览器选择合适的样式。例如，你可以为视口小于或等于\
  \ 480 像素的设备（如某些 iPhone）提供特定样式。\n\n## 第 12 章：了解移动 WebKit 扩展和其他移动特定选项\n\n## 本章内容\n\
  \n![arrow](img/arrow.png) 了解 WebKit 扩展\n\n![arrow](img/arrow.png) 使用手持设备方向（横向和纵向）\n\
  \n![arrow](img/arrow.png) 使用 WebKit 扩展创建艺术作品、渐变和过渡效果\n\n![arrow](img/arrow.png)\
  \ 使用 WebKit 扩展进行动画制作\n\n随着移动设备变得越来越强大，浏览器发布商开发自己的扩展（如 Apple 的 WebKit 扩展），设计选项的数量增加，复杂程度也随之提高。幸运的是——与新兴技术通常的情况一样——特定的协议和产品开始在某个时刻突破，从众多竞争者中脱颖而出，最终成为被接受的做法。Photoshop\
  \ 在图像编辑领域的主导地位和 Dreamweaver 在网页设计市场的稳固地位就是很好的例子。\n\n开源的基于 WebKit 的移动浏览器在移动设备市场上越来越普及。即使是那些没有预装\
  \ WebKit 浏览器的设备也开始包含对 WebKit 扩展的支持。在我撰写本文时，Microsoft 已经开始在 Windows 7 移动版 Internet\
  \ Explorer 中包含对 WebKit 扩展的支持。重点是 WebKit 正在成为移动网页设计中不可忽视的力量。考虑到这一点，本章深入探讨了移动浏览器支持的一些\
  \ WebKit 扩展及其使用方法。虽然我当然不能向你展示如何使用所有 WebKit 扩展，但本章中的概念——如何部署扩展——适用于大多数扩展，并能让你对如何在移动网页中使用它们有一个总体了解。\n\
  \n\n\n\n# 使用 WebKit 扩展进行移动 Web 开发\n\n本章还将介绍如何运用一些专为手持设备设计的 HTML 和 CSS 特性，例如 `viewport`\
  \ 选项，以及一些确保网站在全屏模式和其他指定分辨率下显示的移动端专属选项。尽管其中许多选项最初是 iPhone、iPad 和 iPod 上的 WebKit 扩展，但现在它们已广泛获得多种移动浏览器的支持。\n\
  \n## 什么是 WebKit 扩展？\n\n在推动移动 Web 开发标准化方面，或许没有哪项技术比 WebKit 扩展贡献更大。WebKit 最初是作为一款由增强型\
  \ HTML 和 JavaScript 组件构成的浏览器引擎而诞生，由苹果公司开发。但如今 WebKit 已开源：几乎任何人都可以获取其代码，并根据自身需求进行修改和适配。基于\
  \ WebKit 的移动浏览器是许多新型智能手机和平板电脑的默认浏览器，包括所有苹果手持设备、安卓智能手机和平板电脑，以及其他多种设备。\n\nWebKit 扩展是对\
  \ HTML、CSS 和 JavaScript 的增强，为网页设计师提供了若干通过标准 HTML 标记和 CSS 样式无法实现的设计选项。不过，许多 WebKit\
  \ 扩展目前（或即将）在 HTML5 和 CSS3 中也可用，具体取决于移动浏览器和设备。\n\n并非所有适用于 WebKit 浏览器的选项都为其独有。例如，`viewport`\
  \ 功能——它允许你控制网站在移动设备上的显示尺寸——就是一个典型例子。此外，一些源自苹果（移动 Safari）手机的方向（竖屏与横屏）选项，现在也适用于许多非苹果手持设备。有鉴于此，`viewport`\
  \ 和方向选项是专为手持设备设计的。毕竟，大多数台式机和笔记本电脑用户不会频繁切换屏幕方向，对吧？\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\n\
  \n`viewport` 扩展只是非 WebKit 浏览器厂商借鉴 WebKit 扩展概念并适配到自家浏览器的一个例子。每种浏览器适配的概念各不相同，且不同浏览器之间存在差异。此外，非\
  \ WebKit 浏览器的每次更新都会引入新功能，有些受 WebKit 启发，有些则不是，这使得界定哪些浏览器适配了哪些功能变得有些难以捉摸。\n\n## Viewport\n\
  \n由于移动设备显示网站的尺寸和分辨率千差万别，因此很难控制你的网页在不同设备上的显示效果。一种有效的方法是使用 `viewport` 元标签来控制若干显示选项，例如页面的高度和宽度、用户缩放页面的程度，或者是否允许用户缩放。在创建不同的移动配置文件和多套移动页面时，你可以利用此选项更好地控制\
  \ HTML 和 CSS 在各种设备上的显示效果。\n\n与大多数其他元标签类似，`viewport` 使用 `name` 和 `content` 属性，如下所示：\n\
  \n```html\n<meta name=\"viewport\" content=\"width=320, height=240 user-scalable=yes\"\
  \ />\n```\n\n要控制用户缩放（即缩放级别），请使用 `initial-scale`、`maximum-scale` 和 `minimum-scale`\
  \ 属性，如下所示：\n\n```html\n<meta name=\"viewport\" content=\"width=320, height=240 user-scalable=yes,\
  \ initial-scale=1.5, maximum-scale=3.0, minimum scale=1.0\" />\n```\n\n当你将 `viewport`\
  \ 与定义整体页面宽度的 CSS 样式以及设置为百分比的各种 CSS 容器尺寸（如第 7 章所述）结合使用时，可以强制内容适应不同屏幕尺寸，而无需为每种设备类别创建单独的样式表，如图\
  \ 12-1 所示。\n\n**图 12-1：** 使用 `viewport` 强制页面适应屏幕的示例。\n\n![9781118026229-fg1201.eps](img/9781118026229-fg1201_opt.jpeg)\n\
  \n你还可以使用 `viewport` 属性 `device-width` 自动强制网页填满屏幕宽度。然而，此选项不控制页面显示高度，有时可能会产生不理想的结果，尤其是当你希望用户无需在特定页面上滚动时。例如，如果你希望页面填满屏幕宽度并禁止缩放，可以使用以下\
  \ `viewport` 元标签和属性：\n\n```html\n<meta name=\"viewport\" content=\"width=device-width\
  \ user-scalable=no\" />\n```\n\n`device-width` 属性强制页面以设备屏幕的全宽显示。`scalable=no` 属性禁止调整大小。这确保了无论用户如何尝试更改，页面始终以所需宽度显示。\n\
  \n## 处理设备方向\n\n大多数新型智能手机和所有新款平板电脑都支持竖屏（直立）和横屏（横向）方向。如果你拥有其中一款智能手机，或者曾把玩过，你可能已经注意到，当你将设备横向旋转时，网页并不总是自动调整到新方向，而是出现类似图\
  \ 12-2 的结果。这是因为许多设备不会自动（或充分）补偿因旋转手持设备而导致的屏幕尺寸变化。\n\n**图 12-2：** 改变手机方向后屏幕重绘不匹配的示例。\n\
  \n![9781118026229-fg1202.tif](img/9781118026229-fg1202_opt.jpeg)\n\n基于 WebKit 的浏览器以及其他一些浏览器支持内置函数和事件来检测设备方向何时发生变化，并重新绘制屏幕以进行补偿。其中最常见的两个函数如下：\n\
  \n- `window.orientation` 事件报告当前屏幕方向，使用以下值：\n  - 0 表示竖屏模式，即用户直立手持设备时。\n  - 90 表示向左旋转，即用户逆时针旋转手持设备时。\n\
  \  - –90 表示向右旋转，即用户顺时针旋转设备时。\n  - 180 表示倒置，即用户将手机旋转 180 度。并非所有设备都支持此值。例如，早期的 iPhone\
  \ 就不使用它。（请注意，在我撰写本文时，并非所有移动浏览器都支持此选项。）\n\n- `orientationchange` 事件在用户每次将设备旋转 90\
  \ 度时触发。\n\n单独来看，这两个选项作用不大。但与 CSS 和 JavaScript 结合使用时，它们非常方便，可以节省大量时间——因为无需为不同屏幕尺寸创建多个类配置文件。实际上，该过程包含三个部分，需要创建三个对应的文件：HTML\
  \ 页面、外部 CSS 文件和 JavaScript 文件。你可以在本书的配套网站上找到这些文件。\n\n## 设置可旋转页面\n\n设置可旋转页面与设置其他移动网页非常相似。唯一的区别在于，你需要使用\
  \ `viewport` 元标签（本章前面已讨论过）来设置初始和最大页面缩放比例。为了使页面方向脚本正常工作，初始缩放级别和最大缩放级别必须相同，通常为 1.0。\n\
  \n要设置可旋转页面，请创建一个新的 HTML 页面，并插入清单 12-1 中的代码。将文件保存为 `index.html`。\n\n### 清单 12-1：设备方向项目的\
  \ HTML 代码\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C??DTD HXTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"?>\n<html xmlsn=\"\
  http:/www.w3.org/1999/xhtml\">\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=utf-8\" />\n<meta name=\"viewport\" content=\"width=device=width;\
  \ initial-scasle=1.0; maximum-scale=1.0;\">\n<link href=\"smartphone.css\" rel=\"\
  stylesheet\" type=\"text/css\" />\n<title>检测和更改手持设备方向</title>\n<script type=\"text/javascript\"\
  \ src=\"orientScreen.js\"></script>\n<script type=\"text/javascript\">\n      window.addEventListener(\"\
  load\", function() { setTimeout(loaded, 100) }, false);\n```\n\n\n\n\n\n# 设备方向网页\n\
  \n## HTML 与 JavaScript（清单 12-1）\n\n```html\n      function loaded() {\n\n      \
  \   document.getElementById(\"page_background\").style.visibility = \"visible\"\
  ;\n\n         window.scrollTo(0, 1);\n\n      }\n\n</script> →18\n\n</head>\n\n\
  <body onorientationchange=\"updateOrientation();\"> →22\n\n<div id=\"page_background\"\
  > →24\n\n   <div id=\"page_ccw\">\n\n         <h2>手持设备为横向 - 逆时针</h2>\n\n   </div>\n\
  \n   <div id=\"page_cw\">\n\n      <h2>手持设备为横向 - 顺时针</h2>\n\n   </div>\n\n   <div\
  \ id=\"page_portrait\">\n\n      <h2>手持设备为纵向模式</h2>\n\n   </div>\n\n   <div id=\"\
  page_upsideDown\">\n\n      <h2>手持设备倒置</h2>\n\n   </div>\n\n</div> →37\n\n</body>\n\
  \n</html>\n```\n\n### 清单 12-1 的注释\n\n- ![check.png](img/check.png) 第 7 行：`viewport`\
  \ 元标签中的 `maximum-scale=1.0` 属性禁止用户缩放。如果没有该属性，当用户缩放页面后旋转设备，页面会保持缩放后的显示尺寸，这不是本程序想要达到的效果。\n\
  \n- ![check.png](img/check.png) 第 10–18 行：这些行告知浏览器外部 JavaScript 文件的位置以及何时、如何使用它。该脚本主要引用一个名为\
  \ `orientScreen.js` 的外部 JavaScript 并与之交互。然后它告诉外部脚本何时启动。请看第三行的事件监听器。它“监听”手持设备方向的变化；当检测到变化时，触发名为\
  \ `loaded` 的函数——该函数进而告诉外部脚本显示与设备方向对应的 CSS 选择器。查看外部脚本（本章后面的“创建 JavaScript”部分）应该能让这一切更加清晰。\n\
  \n- ![tip.eps](img/tip_opt.jpeg) 在本节及后续脚本中，你使用 `document.getElementById` 方法来识别并调用相应的\
  \ CSS 选择器。在此示例中，CSS 选择器 `page_background` 包含你想要显示的内容——背景。这是在 JavaScript 中部署选择器的标准方法。\n\
  \n- ![check.png](img/check.png) 第 22 行：`<body>` 标签中的 `onorientationchange=\"updateOrientation()\"\
  ;` 属性由两部分组成：`onorientationchange` 是 `orientationchange` 事件的一种变体，它引用了稍后在本过程中创建的 JavaScript\
  \ 中的 `updateOrientation()` 函数。\n\n- ![check.png](img/check.png) 第 24–37 行：这段代码控制用户每次旋转设备时看到的内容。如你所见，每个方向都有一个条目，由\
  \ CSS `<div>` 容器选择器标识。换句话说，每个方向都有不同的内容。\n\n此页面还需要做一些额外工作——一个引用外部脚本并告诉浏览器如何以及何时触发它的\
  \ JavaScript，我们将在本过程稍后创建。\n\n## 外部 CSS 文件\n\n### 清单 12-2：设备方向项目的外部 CSS 文件\n\n```css\n\
  html, body, form, fieldset, p, div, h1, h2, h3, h4, h5, h6{          →1\n\n   margin:0;\n\
  \n   padding:0;\n\n   -webkit-text-size-adjust:none;\n\n   color: #000;\n\n   }\n\
  \nbody{\n\n   font-size: 100%;\n\n   }\n\nul, li, ol, dl, dd, dt{\n\n   list-style:none;\n\
  \n   padding:0;\n\n   margin:0;\n\n   }\n\na{\n\n   text-decoration:none;\n\n  \
  \ }\n\nbody{\n\n   background:#999;\n\n   font-family: Arial;\n\n   color:#F00;\n\
  \n   }\n\np{\n\n   font-size:12px;\n\n   padding-bottom:8px;\n\n   color: #F00;\n\
  \n   }\n\na{\n\n   color:#333;\n\n   text-decoration:none;\n\n   }\n\nh1{\n\n  \
  \ display:block;\n\n   width:112px;\n\n   height:41px;\n\n   text-indent:-5000px;\n\
  \n   }                                                                         \
  \                       →44\n\n#page_background{                               \
  \                                                      →45\n\n   padding-top:100px;\n\
  \n   background:#000 url(images/page_background.gif) repeat-x;\n\n   overflow:auto;\n\
  \n   }                                                                         \
  \                       →49\n\n#page_ccw,                                      \
  \                                                    →51\n\n#page_cw,\n\n#page_portrait,\n\
  \n#page_upsideDown{\n\n   display:none;\n\n   }                                \
  \                                                                →56\n\n.display_portrait,\
  \                                                                              \
  \     →57\n\n.display_upsideDown{\n\n   width:device-width;\n\n   }\n\n.display_ccw,\n\
  \n.display_cw{\n\n   width:device-width;\n\n   }                               \
  \                                                                 →64\n\n.display_ccw\
  \ #page_ccw,                                                                   \
  \          →66\n\n.display_cw #page_cw,\n\n.display_portrait #page_portrait,\n\n\
  .display_upsideDown #page_upsideDown{\n\n   display:block;\n\n   }             \
  \                                                                              \
  \     →71\n```\n\n### 清单 12-2 的注释\n\n- ![check.png](img/check.png) 第 1–44 行：同样，所有这些选择器的作用只是格式化站点页面上的各种文本字符串。但请注意第一个选择器中的第三个属性。这是一个\
  \ WebKit 扩展的示例，如 `-webkit-` 前缀所示。该特定扩展告诉浏览器不要调整字体大小。换句话说，无论设备方向改变后显示尺寸如何变化，字体大小都将保持不变。\n\
  \n- ![check.png](img/check.png) 第 45–49 行：该选择器创建了此页面上的唯一内容，如图 12-3 所示。要添加额外内容，只需创建其他选择器即可。请注意，我插入了一个重复的背景图像。这是图\
  \ 12-3 中文本后面的渐变背景。\n\n- ![tip.eps](img/tip_opt.jpeg) 你可以使用此方法从单个容器、整个页面甚至表格单元格中的图像创建背景。例如，要创建图像背景，只需将\
  \ `background` 属性添加到主选择器（即包含所有其他容器的顶层容器）中。在 Dreamweaver 中，你可以通过“修改”菜单中的“页面属性”对话框为整个页面添加图像背景：只需在“背景图像”字段中输入图像的文件路径和文件名即可。\n\
  \n- **图 12-3：** 通过在 `page_background` 容器内重复一个简单图形，在文本后面创建渐变效果。\n\n- ![check.png](img/check.png)\
  \ 第 51–56 行：其他四个选择器是四个不同的方向选择器——分别对应手持设备的四种可能方向。请注意，它们用逗号分组在一起，并且它们唯一的属性是 `display:none`。默认情况下，它们都不显示。设备方向和\
  \ JavaScript 决定何时显示哪个选择器。\n\n\n\n\n\n![check.png](img/check.png) 第 57–64 行：这里的四个选择器是\
  \ JavaScript 用于根据设备方向控制显示哪些内容的。请注意，两个竖屏选择器（正立和倒置）被分在一起是因为它们具有相同的显示尺寸，两个横屏选择器也是如此。`width:device-width`\
  \ 属性告诉浏览器调整页面大小以适应屏幕。这允许你为多个设备使用同一个页面和样式表。\n\n![check.png](img/check.png) 第 66–71\
  \ 行：下一组选择器将类选择器与 ID 选择器关联起来。当你看到下一小节中的 JavaScript 时，这就会更有意义。这一整个选择器设计用于根据检测到的方向显示相应的\
  \ ID 选择器。\n\n## 创建 JavaScript\n\n现在你已经创建了 HTML 页面和 CSS 文件，是时候编写一段小小的 JavaScript\
  \ 来让它们整合在一起了：创建一个新的纯文本文件，将其保存为 `orientScreen.js` 并存放在与 HTML 文件相同的目录下，然后输入列表 12-3\
  \ 所示的 JavaScript 代码。\n\n### 列表 12-3：设备方向项目的 JavaScript 文件\n\n```javascript\nwindow.onload\
  \ = function initialLoad(){\n      updateOrientation();\n   }\n   function updateOrientation(){\n\
  \      var contentType = \"display...\";\n      switch(window.orientation){\n  \
  \        case 0:\n          contentType += \"portrait\";\n          break;\n   \
  \       case -90:\n          contentType += \"cw\";\n          break;\n        \
  \  case 90:\n          contentType += \"ccw\";\n          break;\n          case\
  \ 180:\n          contentType += \"upsideDown\";\n          break;\n      }\n  \
  \ document.getElementById(\"page_background\").setAttribute(\"class\", contentType);\n\
  \   }\n```\n\n如果你将这三个文件——HTML、CSS 和 JavaScript——并排，就可以看到它们是如何相互作用的。例如，HTML 页面 `<body>`\
  \ 标签中的 `onorientationchange=\"updateOrientation();\"` 引用或触发了 JavaScript 文件中的 `updateOrientation`\
  \ 函数。`updateOrientation` 函数中的 `var`（变量）和 `case` 语句引用了外部样式表底部的选择器，即定义你 HTML 文件中四个\
  \ `<div>` 容器的每一个选择器。完成后的应用程序根据设备的方向看起来应该像图 12-4。\n\n**图 12-4：** 手持设备为每个方向显示不同的选择器。\n\
  \n![9781118026229-fg1204.eps](img/9781118026229-fg1204_opt.jpeg)\n\n有关 JavaScript\
  \ 如何与你的 CSS 和 HTML 文件工作的详细信息，请参阅第 3 章和第 13 章。\n\n## 使用 WebKit 扩展创建艺术\n\nWebKit 有多种用于\
  \ 2D 和 3D 绘画以及动画效果的扩展，包括但不限于阴影、圆角、过渡、动画以及径向和线性渐变。（有关阴影和圆角的示例，请参阅第 11 章。）在本节中，你将使用\
  \ CSS WebKit 扩展创建一个渐变背景、一个从一种颜色过渡到另一种颜色的框和一个动画。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 与许多 WebKit 扩展一样，有大量的选项可以控制渐变和其他效果的外观。没有办法记住它们（至少我记不住）。你可以在 Apple 的 Safari 开发网站上找到广泛的信息，包括所有支持的\
  \ CSS 规则和属性，访问 [`http://developer.apple.com/library/safari`](http://developer.apple.com/library/safari)。关于\
  \ WebKit 的所有信息，包括几个开发者工具，请访问 WebKit 开源网站 [`http://webkit.org`](http://webkit.org)。但请记住，并不是所有的\
  \ WebKit 扩展都支持所有设备，某些仅在标准计算机浏览器中支持。\n\n### 创建 WebKit 渐变\n\n使用 WebKit 制作渐变可以让你很好地如何使用\
  \ WebKit CSS 扩展来创建其他特效，例如过渡和动画。许多此类其他 WebKit 扩展，例如 `color-stop` 语句根据页面宽度的百分比设置颜色停止（以及下一种颜色开始）的位置。也就是说，第二个\
  \ `color-stop` 语句在左侧 57% 处停止第二种颜色，第三个语句在页面 79% 处停止。RGB 颜色定义嵌套在颜色属性内部。有时，取决于你的渐变（或其他效果的类型），你需要将多个属性嵌套在其他属性中，如下例：\n\
  \n```css\nbackground: -webkit-gradient(radial, 50% −50, 0, 50% 0, 300, from(#676767),\
  \ to(black));\n```\n\n如果你调整第一个 `color_stop` 值（即 0.13、0.57 和 0.79 值），你将能更好地感受到这些设置如何影响渐变。这些数字只是告诉浏览器从何处开始改变渐变中的颜色。浏览器实际上使用这些数字（以及\
  \ RGB 值）作为参考来绘制渐变。（参见图 12-5。）\n\n**图 12-5：** 使用 WebKit 渐变扩展绘制的渐变。\n\n![9781118026229-fg1205.eps](img/9781118026229-fg1205_opt.jpeg)\n\
  \n创建一个 WebKit 过渡\n\n\n\n\n\n当然，过渡（transition）是一种从一个状态变为另一个状态的效果——或切换。如果你曾经创建过 PowerPoint\
  \ 幻灯片，你可能在幻灯片之间创建过过渡，例如淡入（fades）或擦除（wipes）。常见的过渡效果之一是淡入，其中对象——或整个屏幕——逐渐出现或消失。（图\
  \ 12-6 应该让你有一个大致的了解。）你可以创建淡入到页面部分或单个 `<div>` 区域的过渡，也可以创建一个覆盖整个页面的过渡。\n\n**图 12-6：**\
  \ 移动设备屏幕上图形框从白色过渡到黑色的示例。\n\n![9781118026229-fg1206.eps](img/9781118026229-fg1206_opt.jpeg)\n\
  \n创建一个 WebKit 过渡效果由三部分组成：HTML 页面、CSS 和 JavaScript。在这个示例中，由于代码非常少（而且这通常不是你跨多个页面创建的种种效果），我们将\
  \ CSS 放在 HTML 文件的 `head` 中。事实上，对于这个示例，你在同一个文件中创建了整个页面以及所有三个部分——HTML、CSS 和 JavaScript。（参见列表\
  \ 12-4。）\n\n与大多数使用 WebKit 扩展和 JavaScript 创建效果的页面一样，包含 WebKit 过渡的 HTML 页面并没有特殊之处。你像设置任何其他移动网页一样设置它们。在这种情况下，开始一个新网页，将其保存为\
  \ `transitions.html`，然后输入列表 12-4 中的代码。\n\n列表 12-4：WebKit 过渡文件\n\n```html\n<!DOCTYPE\
  \ html PUBLIC “-//W3C//DTD XHTML 1.0 Transitional//EN” “http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd”>\n\
  <html xmlns=”http://www.w3.org/1999/xhtml”>\n<head>\n<meta http-equiv=”Content-Type”\
  \ content=”text/html; charset=utf-8” />\n<title>Transition</title>\n<style>\n#box\
  \ {\n    width: device-width;\n    height: 480px;\n    background-color: black;\n\
  \    color: #FFF;\n    font-size:50px;\n    font-style:italic;\n    padding-top:180px;\n\
  \    padding-left:170px;\n    -webkit-transition: opacity 3s;\n}\n.transition {\n\
  \    opacity: 0;\n}\n</style>\n<script type=”text/javascript”>\nfunction show()\
  \ {\n    var box = document.getElementById(“box”);\n    box.className = (box.className==”transition\
  \ text goes here”) ? “” : ”transition goes here”;\n    box.innerHTML = box.className;\n\
  }\n</script>\n</head>\n<body>\n<h2>Transition</h2>\n<input type=”button” onclick=”show()”\
  \ value=”Transition” />\n<div id=”box”</div>\n</body>\n</</html>\n```\n\n### 关于列表\
  \ 12-4 的一些说明：\n\n![check.png](img/check.png) 第 36–39 行：这是用于设置用户启动动画的按钮的 HTML，并为动画创建一个\
  \ `<div>` 容器，我们通过 CSS 和非常简单的 JavaScript 创建了该容器。注意属性 `onclick=\"show()\"`，它调用了 JavaScript\
  \ 中名为 `show` 的函数，你稍后会看到。\n\n![tip.eps](img/tip_opt.jpeg) ![check.png](img/check.png)\
  \ 第 6–18 行：CSS。除了实际上告诉浏览器创建动画的扩展外，设置 CSS 与设置任何其他选择器都是相同的。过渡本身是使用 `-webkit-transition`\
  \ 扩展创建的，如下：\n\n`-webkit-transition: properties;`\n\n有几个可能的属性可以设置淡入持续时间、延迟以及几种特殊效果：CSS\
  \ 值，例如 `linear`、`ease-in`、`ease-out` 以及许多其他不限于过渡扩展的属性。你可以在 `developer.apple.com`\
  \ 获取 CSS 属性函数列表及其作用。点击“CSS Property Functions”链接。\n\n![remember.eps](img/remember_opt.jpeg)\
  \ 请记住，并不是所有的扩展在所有移动设备上都可用。\n\n控制过渡最常用的属性是 `name`、`duration`、`timing` 和 `delay`。\n\
  \n你可以用两种方式编写此函数和其他 WebKit 扩展函数，就像我在这里所做的，将所有属性放在同一行或同一个语句中，或者将它们写作为独立的扩展（我在下一个语句中向你展示），如下：\n\
  \n`-webkit-transition-property: opacity;`\n`-webkit-transition-duration: 3s;`\n\
  `-webkit-transition-timing-function: ease-in;`\n\n在同一行编写需要特定的语法——属性必须按照特定顺序编写。将它们作为独立的扩展编写，因为不需要特定顺序，有时会更容易。关于此以及通用使用\
  \ WebKit transform 扩展的更多信息，请查看以下 URL 中的“CSS Animation”页面：`www.webkit.org/blog/138/css-animation/`。\n\
  \n![remember.eps](img/remember_opt.jpeg) 注意，在设置内部样式（HTML 文件内部的样式）时，CSS 代码位于 `<style></style>`\
  \ 标签之间，这与我们在第 2 章和第 7 章中讨论的设置样式表的方法不同。\n\n大部分属性设置了图形框及其内部文本的大小。`-webkit-transition`\
  \ 语句告诉浏览器如何通过 `opacity`（这是一个属性）来混合过渡，并将过渡持续时间设置为 3 秒。（是的，我知道编程术语，根据代码编写方式而变化的不同术语很令人困惑。我发现不在纠结于这些术语的情况下部署代码是有帮助的——除非你正在上编程课程，学习这些术语对你的成绩至关重要……）\n\
  \n![tip.eps](img/tip_opt.jpeg) ![check.png](img/check.png) 第 20–22 行：此选择器将透明度设置为\
  \ 0。也就是说，它是完全透明的。它将过渡到完全透明。例如如果你使用 .50 的值，框将过渡到 50% 透明。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ `innerHTML` 属性动态修改文档 HTML。它在不刷新整个页面的情况下更改页面内容，使页面重绘更快，从而看起来响应更快。当此属性在 JavaScript\
  \ 代码中配合 `getElementById` 使用时，它指向一个 HTML 元素并更改其内容。\n\n\n\n\n\n互联网上的许多人声称，WebKit 扩展和\
  \ HTML5（在第 10 章中讨论）将消除对 Flash 及其他动画软件的需求。虽然某些增强功能确实可能消除某些简单动画和其他效果对外部程序的需求，但使用 WebKit\
  \ 扩展所能做的事情是有限的。Flash 和其他网页特效工具在短期内并无大碍。\n\n尽管如此，使用 WebKit 扩展能做的事情非常巧妙，而且由于 WebKit\
  \ 扩展是原生的且通常具有硬件加速特性，你用它们构建的动画和其他效果的显示和运行速度比你使用外部工具创建并嵌入网页的动画要快得多。因此，你用 WebKit 扩展-`–webkit-animation`-\
  \ 创建的动画不仅制作趣味，而且启动迅速、运行流畅。毕竟，不需要下载庞大的外部文件；动画通过几行代码即可实现，其余工作由浏览器完成。\n\n此动画由三部分组成：HTML\
  \ 页面标签、CSS 和 JavaScript。为了方便演示过程，我们将所有代码都放在 HTML 文件中（参见列表 12-5）。完成后，你将创建一个动画，它会让一个动态绘制的方框在屏幕周围的正方形路径上移动，如图\
  \ 12-7 所示。\n\n此动画的 HTML 与上一节中过渡动画的 HTML 之间的一个关键区别在于，后者是从 `<body>` 标签启动（或触发）动画的，这类似于之前“使用设备方向”小节中的设备方向脚本。换句话说，动画是自动启动的，而不需要用户点击按钮。\n\
  \n![tip.eps](img/tip_opt.jpeg) 你可以使用这种技术来自动触发几乎任何其他 JavaScript，使得脚本在无需用户交互的情况下执行。例如，如果你想创建一个自动运行的过渡效果，只需使用以下方法触发脚本，而不是将其关联到按钮上。\n\
  \n创建一个新网页并输入列表 12-5 中的代码。将其保存为 `animation.html`。\n\n**图 12-7：** 在四角正方形路径上移动的动画示例。\n\
  \n![9781118026229-fg1207.eps](img/9781118026229-fg1207_opt.jpeg)\n\n列表 12-5: WebKit\
  \ 动画文件\n\n```html\n<!DOCTYPE html PUBLIC \"-//-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\"\
  \ />\n<title>Animation</title>\n<style>\n  #box {\n    width: 200px;\n    height:\
  \ 200px;\n    background-color: black;\n    position: absolute;\n    top: 0px;\n\
  \    left: 0px;\n  }\n.squarePath {\n    -webkit-animation-name: squarePath;\n \
  \   -webkit-animation-duration: 8s;\n    -webkit-animation-timing-function: ease-in-out;\n\
  \    -webkit-animation-iteration-count: infinite;\n  }\n@-webkit-keyframes squarePath\
  \ {\n  from {\n    top: 0px;\n    left: 0px;\n  }\n  25% {\n    top: 0px;\n    left:\
  \ 200px;\n  }\n  50% {\n    top: 200px;\n    left: 200px;\n  }\n  75% {\n    top:\
  \ 200px;\n    left: 0px;\n  }\n  100% {\n    top: 0px;\n    left: 0px;\n  }\n}\n\
  </style>\n<script>\nfunction move() {\n  document.getElementById(\"box\").className\
  \ = \"squarePath\";\n}\n</script>\n</head>\n<body onload=\"move()\">\n</body>\n\
  </</html>\n```\n\n\n\n\n这些时序设置可以为动画提供一些额外的效果。例如，缓动是一种逐渐的停顿或减速。换句话说，当动画对象缓入时，它会减慢到动画整体速度的一个分数，使其在开始时看起来像是明显减慢或缓动。然后它会赶上并以正常速度移动。缓出当然会反转效果，在序列结尾时减慢动画。缓入缓出则在两端都使动画停顿。关于缓动和其他动画设置的示例，请参阅本书的配套网站。\n\
  \n我们在本节中创建的动画有四条路径——对应于它所沿着的方形路径的每一边。在这种情况下，缓入缓出发生在所有四条路径或边上。在线性单路径动画中，缓动效果只发生一次——或者对于缓入缓出的情况，在动画开始时（入）和结束时（出）各发生一次。\n\
  \n# 第四部分\n\n## 构建真实世界应用\n\n![9781118026229-pp0401.eps](img/9781118026229-pp0401_opt.jpeg)\n\
  \n本部分涵盖复杂的网络应用，例如使用 JavaScript 自动化，以及创建一个能跟踪用户答案并计算分数的 JavaScript 测验应用。你将学习如何使你的网站对搜索引擎友好，以便人们能够找到你的网站，以及如何为你的网站创建搜索引擎，以便用户能够找到你网站上的信息。你还将学习如何创建移动购物车或电子商务界面。\n\
  \n## 第 13 章：使用 JavaScript 自动化你的网站\n\n## 本章内容\n\n- ![arrow](img/arrow.png) 检测用户代理并重定向\
  \ URL\n- ![arrow](img/arrow.png) 切换 CSS 外部文件和选择器\n- ![arrow](img/arrow.png) 检测屏幕大小并切换\
  \ URL 和/或 CSS 外部文件和选择器\n- ![arrow](img/arrow.png) 验证表单字段\n\n对于移动设备，JavaScript 可以是一个真正的得力助手。它可以告诉你浏览你网站的浏览器是否是移动设备，并自动更改屏幕上显示的内容，无论是通过更改\
  \ URL 还是更改 CSS。同样，JavaScript 可以确定设备的屏幕大小——是一个相当大的设备，比如平板电脑，还是一个在手机上与键盘共享空间的小设备？了解屏幕大小有助于确定你正在呈现的材料的格式。\n\
  \nJavaScript 能做的还不止这些。表单验证等小任务，以及 HTML5 中的`<canvas>`等专门的新元素，都严重依赖 JavaScript。搜索和计算是可能的，因为\
  \ JavaScript 可以将结果与字符串和数字进行比较，以找到匹配项（或不匹配项），并为你处理细节。\n\n本章解释如何使用 JavaScript 创建能够区分不同浏览器的网页。如果你的页面检测到移动设备，它可以重新格式化页面以适应较小的屏幕；否则，它会显示适用于通用电脑屏幕的页面。通过这种方式，你的页面可以为使用不同显示设备的用户提供服务。\n\
  \n## 谁在浏览？\n\n你希望 JavaScript 确定的首要事项之一是，浏览你网站的浏览器是移动的还是非移动的。该设备使用的是大显示区域还是小显示区域？如果显示区域在移动设备上，JavaScript\
  \ 可以通过切换显示的材料来提供帮助。\n\n为了找到用户的设备和浏览器，你可以使用文档对象模型（DOM）。DOM 包含`navigator`属性，它本身有几个不同的属性，其中之一是`userAgent`（在第\
  \ 5 章中讨论过）。`userAgent`也有自己的属性和方法，但它本身提供了关于屏幕是用于移动设备还是非移动设备的信息。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 就我们的目的而言，属性是 DOM 中找到的任何特征，方法是执行某些操作的功能——例如找出正在浏览你页面的浏览器类型。\n\n通过检查`navigator.userAgent`的内容，你可以检测出正在浏览你页面的设备和浏览器类型。第一步是编写一些\
  \ JavaScript 来显示用户使用的设备类型。\n\n## 查找基本信息\n\n要开始追踪浏览你页面的特定设备，请从一个简单的 JavaScript 程序开始，为你打印出详细信息。在你喜欢的\
  \ HTML 文档编辑器或文本编辑器中打开一个新的 HTML 页面，添加清单 13-1 中的脚本，然后将文件保存为`basicSniff.html`。\n\n\
  #### 清单 13-1：基本的嗅探脚本\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<script type =\
  \ \"text/javascript\">\nvar sniffer=new Object(); →5\nsniffer.agentNow=navigator.userAgent;\
  \ →6\ndocument.write(sniffer.agentNow);\n</script>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\">\n<title>JS Work</title>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n#### 关于清单 13-1 中代码的一些说明：\n\n- ![check.png](img/check.png)\
  \ 第 5 行：脚本首先在一个名为`sniffer`的变量中放置一个`Object`实例。对象是你可以在程序中使用的\"东西\"。你的汽车是一个具有座椅、方向盘和制动器（属性）的对象；以及它执行的操作——驾驶、停止、加热和冷却（方法）。为了让一个对象\"\
  活起来\"，你把它放在一个变量中。你通过使用等号（`=`）运算符将其赋值给一个变量（如`sniffer`）来实现。当完成后，`sniffer`具有该对象的所有属性和方法。\n\
  \n- ![check.png](img/check.png) 第 6 行：属性`agentNow`被添加到`sniffer`并被赋值为`navigator.userAgent`。这个过程将`navigator.userAgent`的值更改为当前查看页面的代理到`sniffer.agentNow`。\n\
  \n在你的电脑上使用任何浏览器测试该文件，你会看到类似以下内容：\n\n```\nMozilla/5.0 (Macintosh; U; Intel Mac OS\
  \ X 10.6; en-US; rv:1.9.2.16) Gecko/20110319 Firefox/3.6.16\n```\n\n这些结果是你在使用 Firefox\
  \ 浏览器的 Macintosh 上看到的。如果你用 iPhone 测试同一个网页，你会看到图 13-1 所示的内容。\n\n**图 13-1：** iPhone\
  \ 浏览器显示代理结果。\n\n![9781118026229-fg1301.tif](img/9781118026229-fg1301_opt.jpeg)\n\
  \n这些结果提供了有用的信息，但你真正需要知道的只是页面是否正在被 iPhone 查看。（就目前而言，这些结果是信息过多的一个例子。）这是一个好的开始，但我们需要添加更多内容来缩小我们的发现范围。\n\
  \n#### 追踪 iPhone\n\n在进一步研究`navigator.userAgent`时，我们发现它有几个我们可以使用的属性和方法。（请记住，方法是对象执行某些操作的功能。）首先，它有一个将所有信息更改为小写文本的方法。这很方便，这样我们就不必使用大小写混合搜索（iPhone\
  \ 使用大小写混合字母——单词中间有大写字母）。其次，`userAgent`有一个`search`方法，检查其自身内容以查找你试图找到的字符串（文本）。如果找到搜索字符串，它返回一个正数；如果没有找到，则返回负数。所以你需要做的只是找出返回值是否大于或等于\
  \ 0。（即使是 0 也大于-1！）以下代码行处理搜索：\n\n```javascript\nvar agentNow=navigator.userAgent.toLowerCase();\n\
  agentNow.search(\"iphone\");\n```\n\n如果结果值为 true，它可以返回许多不同的正数。（我的 iPhone 返回了 13。）但是，你只想知道返回值是否大于-1。所以你可以编写搜索语句来返回\
  \ true 或 false（称为布尔值），其中 0 或更大的值表示 true，如下所示：\n\n```javascript\nagentNow.search(\"\
  iphone\")>=0;\n```\n\n\n\n编写最后一行行的另一种方法是再次使用 `sniffer` 对象并将结果存储在 `sniffer` 的一个 iPhone\
  \ 属性中。在这种情况下，你为 `sniffer` 添加了属性 `\"iphone\"`。`sniffer.iphone` 的值为 `true` 或 `false`。如果\
  \ agent 大于或等于 0，则它为 `true`；否则它为 `false`。\n\n`sniffer.iphone=(agentNow.search(\"\
  iphone\")>=0);`\n\n现在你可以使用 `sniffer.iphone` 来查找 agent 是否为 iPhone。要这样做，请在你喜欢的 HTML\
  \ 文档编辑器或文本编辑器中打开一个新的 HTML 页面，添加列表 13-2 中的脚本，然后将文件保存为 `sniffApple.html`。\n\n列表 13-2：检测\
  \ iPhone\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<script type = \"text/javascript\"\
  >\n   var sniffer=new Object();\n   var agentNow=navigator.userAgent.toLowerCase();\n\
  \   sniffer.iphone=(agentNow.search(\"iphone\")>=0);\n   document.write(sniffer.iphone);\n\
  </script>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  >\n<title>iPhone Sniffer</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n如果你在电脑上用任何浏览器测试此文件，你会在屏幕上看到\
  \ `False` 单词。然而，如果你在 iPhone 上测试它，你会得到 `True` 单词。（如果你没有 iPhone，别担心。下一节将向你如何测试任何移动设备。）\n\
  \n## 查找任何移动设备\n\n现在你已经知道了如何查找 iPhone。这很棒，但像 Android、黑莓（Blackberry）或人们使用的任何其他移动小设备呢？查找这些设备与查找\
  \ iPhone 一一样，只不过不是列出名称 `\"iPhone\"`，而是输入另一个名称，例如 `\"Android\"`。\n\n使用对象的原因是你可以向对象中加载你需要的任意数量的属性和方法。因此，当你将其他对象添加到你正在查找的设备列表时，你只需要使用循环来遍历对象，以检查是否有任何元素为\
  \ `true`。一种特殊的循环结构可以迭代（循环）对象并揭示其属性的值。对象的设置就像一个装满不同物品的袋子，每个物品都有一个可以访问的编号。例如，我们可以这样查看\
  \ `sniffer`：\n\n```\nsniffer[0];\nsniffer[1];\nsniffer[2];\nsniffer[3];\n```\n\n\
  该列表与编写这些相同：\n\n```\nsniffer.iphone;\nsniffer.android\nsniffer.blackberry;\nsniffer.series60;\n\
  ```\n\n每个都有一个值；在任何时候，我们都可以向 `sniffer` 对象中添加更多类型的移动设备（属性）。随着时间的推移，你可能会添加许多不同的属性，但不必担心。通过使用\
  \ `for..in` 循环，你可以找到对象的所有属性及其值。这里是基本格式：\n\n```\nfor(var myVariable in myProperty)\n\
  {\n   document.write(myProperty[myVariable]);\n}\n```\n\n使用 `document.write()` 只是将值发送到屏幕的一种方法。你可以将值放在变量或其他数据存储中。\n\
  \n回到使用 `sniffer` 对象的示例，当找到 `true` 时，你就知道你在对象中定义的移动设备之一已被找到。以下显示了使用名为 `mobile` 的变量来查找\
  \ `sniffer` 对象中每个属性的代码：\n\n```\nfor(var mobile in sniffer)\n{\n   document.write(sniffer[mobile]);\n\
  \   document.write(\"<br/>\");\n}\n```\n\n每个 `sniffer[mobile]` 都是 `true` 或 `false`，正如你在\
  \ `sniffer.iphone` 中看到的那样。如果你将几个不同设备的名称放在 `sniffer` 对象中，你将在屏幕上看到一列表 `true` 和 `false`\
  \ 的输出文本。要查看如何设置程序，请打开一个新的 HTML 页面，输入列表 13-3 中的脚本，并把文件保存为 `sniffType.html`。\n\n列表\
  \ 13-3：检测任何移动设备\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<script type = \"text/javascript\"\
  >\n   var sniffer=new Object();\n   var agentNow=navigator.userAgent.toLowerCase();\n\
  \   sniffer.android=(agentNow.search(\"android\")>=0);\n   sniffer.series60=(agentNow.search(\"\
  series60\")>=0);\n   sniffer.iphone=(agentNow.search(\"iphone\")>=0);\n   sniffer.blackberry=(agentNow.search(\"\
  blackberry\")>=0);\n   sniffer.windowsce=(agentNow.search(\"windows ce\")>=0);\n\
  \   for(var mobile in sniffer)\n   {\n      document.write(sniffer[mobile]);\n \
  \     document.write(\"<br/>\");\n   }\n</script>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\">\n<title>Mobile Sniffer</title>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n如果你在电脑上用任何浏览器测试此文件，你会在屏幕上看到多次 `false` 单词。然而，如果你在\
  \ iPhone 上测试它，`false` 单词会出现多次——以及一次 `true` 单词。（图）\n\n\n\n\n\n# 针对不同用户代理的双页面\n\n\
  ## 步骤 4：添加脚本\n\n### 清单 13-4：为不同用户代理创建双页面\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
  <script type = \"text/javascript\">\n   var sniffer=new Object();\n   var agentNow=navigator.userAgent.toLowerCase();\n\
  \   sniffer.android=(agentNow.search(\"android\")>=0);\n   sniffer.series60=(agentNow.search(\"\
  series60\")>=0);\n   sniffer.iphone=(agentNow.search(\"iphone\")>=0);\n   sniffer.blackberry=(agentNow.search(\"\
  blackberry\")>=0);\n   sniffer.windowsce=(agentNow.search(\"windows ce\")>=0);\n\
  \   for(var mobile in sniffer)\n   {\n    if(sniffer[mobile])\n    {\n     window.location\
  \ = \"MobileSize.html\";\n    }\n   }\n</script>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=UTF-8\">\n<title>Two Size Full</title>\n</head>\n\
  <body>\n<img src=\"anchor.png\" width=\"200\" height=\"245\" alt=\"anchor\" style=\"\
  float: left\">\n<H1 style=\"color:blue; font-family:'Arial Black', Gadget, sans-serif\"\
  >The Blue Anchor Inn</H1>\n<header style=\"font-family:Verdana, Geneva, sans-serif;font-style:italic;\
