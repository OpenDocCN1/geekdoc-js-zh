  \ daily for Lunch and Dinner:</h3>\n<h4>\nMonday-Thursday: 11:30am-10:00pm<br>\n\
  Friday-Saturday: 11:30-Midnight<br>\nSunday: 1:pm -10:00pm\n</h4>\n<ul>\n<li>Fish\
  \ </li>\n<li>Lobster</li>\n<li>Crab</li>\n<li>Clams </li>\n</ul>\n</body>\n</html>\n\
  ```\n\n## 步骤 5：测试文件\n\n### 图 13-3：全屏显示\n\n![9781118026229-fg1303.eps](img/9781118026229-fg1303_opt.jpeg)\n\
  \n### 图 13-4：移动显示\n\n![9781118026229-fg1304.eps](img/9781118026229-fg1304_opt.jpeg)\n\
  \n## 移动端重新设计\n\n在这里，你可以清晰地看到旅馆的名字和锚标志，但历史文本难以辨认，营业时间信息也难以阅读。幸运的是，可以针对移动设备重新设计页面。一种解决方案是使用清单\
  \ 13-5 中的脚本。打开一个新的 HTML 页面，添加清单 13-5 中的脚本，然后将其保存为`MobileSize.html`。\n\n### 清单 13-5：用于切换到移动设备的脚本\n\
  \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n<title>Mobile Size</title>\n</head>\n<body>\n<img src=\"\
  anchorMobile.png\" width=\"40\" height=\"49\" alt=\"little Anchor\" align=\"left\"\
  >\n<H1 style=\"color:blue; font-family:'Arial Black', Gadget, sans-serif\">The Blue\
  \ Anchor Inn</H1>\n<header style=\"font-family:Verdana, Geneva, sans-serif;font-style:italic;\
  \ font-size:32px; margin-left:10px; margin-right:20px\"> A place where you can drop\
  \ your anchor and relax with good food and good friends. Founded in 1844, it served\
  \ as a Civil War port for Union gunboats, monitors, and full-sail ships of the line.\
  \ In World Wars I and II, American troops disembarked to the African and European\
  \ theaters of war from this port. During Prohibition, the Inn was used as a place\
  \ of transfer for smuggled rum from Cuba and whiskey from Canada. Presidents Roosevelt,\
  \ Kennedy, and Nixon have been our guests. </header>\n<p><p><p>\n<h3 style=\"color:blue;\
  \ font-size:48px\">Open daily for Lunch and Dinner:</h3>\n<section style=\"font-family:Verdana,\
  \ Geneva, sans-serif;font-style:bold; font-size:24px; margin-left:10px; margin-right:20px\"\
  > Monday-Thursday: 11:30am-10:00pm<br>\nFriday-Saturday: 11:30-Midnight<br>\nSunday:\
  \ 1:pm -10:00pm\n<ul>\n  <li>Fish </li>\n  <li>Lobster</li>\n  <li>Crab</li>\n \
  \ <li>Clams </li>\n</ul>\n</section>\n</body>\n</html>\n```\n\n### 清单之间的差异\n\n-\
  \ ![check.png](img/check.png) 图片尺寸从 200x245 变为 40x49\n- ![check.png](img/check.png)\
  \ 在`<header>`容器中，字体大小从 16px 变为 32px\n- ![check.png](img/check.png) 边距（左/右）从 220/300px\
  \ 变为 10/20px\n- ![check.png](img/check.png) H3 从默认样式变为蓝色，字体大小为 48px\n- ![check.png](img/check.png)\
  \ 默认正文字体变为 24px 无衬线字体，边距为 10/20px\n\n## 加载移动页面\n\n现在，使用任何移动浏览器在移动设备上加载名为`FullSize.html`的\
  \ HTML 文件。浏览器中加载的页面应自动切换到`MobileSize.html`——结果如图 13-5 所示。\n\n### 图 13-5：改进后的移动显示\n\
  \n![9781118026229-fg1305.eps](img/9781118026229-fg1305_opt.jpeg)\n\n如图 13-5 所示，页面大不相同。图形标志缩小为一个小图标，标题材料的全部内容可见，营业时间信息以蓝色大标题显示，随后清晰展示开放时间和主菜。所有重要材料一目了然，无需用户费力调整屏幕大小。\n\
  \n## 移动页面的内容适配\n\n重要的一点是，移动页面通常需要与全尺寸电脑屏幕上显示的内容不同。你不想让用户选择查看哪个文件；因此只需让 JavaScript\
  \ 决定页面是为大屏幕还是移动屏幕选择内容。\n\n## 更改样式表\n\n### 不要更改页面——更改样式表\n\n无需为电脑和移动设备屏幕创建两个不同的 HTML\
  \ 页面，你可以使用单个页面更改样式表。由于开发是在电脑上而非移动设备上进行的，默认样式表是为电脑屏幕开发的。通过两个（或更多）样式表，你可以为不同类型的屏幕构建样式表，如第\
  \ 5 章所述。\n\n移动屏幕和电脑屏幕的一个讽刺之处在于，移动屏幕需要更大的字体作为默认渲染，以便用户无需通过拇指和手指拉伸屏幕来放大视图区域即可看到内容。（我使用两个拇指——现在你知道“笨手笨脚”这个说法的由来了。）如果你的网站无需强制用户放大移动屏幕即可查看，那么你更有可能拥有满意的移动用户。\n\
  \n### 移动和电脑屏幕样式表\n\n在本练习中，我使用两个不同的样式表来阐明一个简单的观点——电脑和移动设备屏幕需要不同大小的字体。我从一个在手机上查看的典型电脑页面开始，展示不同的样式表如何影响页面在移动屏幕上的可见性。在图\
  \ 13-6 中，左侧的文本几乎无法辨认，尽管它在标准电脑屏幕上非常清晰。然而，在右侧——使用不同的样式表——正文文本和标题都非常清晰。\n\n### 图 13-6：同一页面在手机上使用不同样式表的效果\n\
  \n![9781118026229-fg1306.eps](img/9781118026229-fg1306_opt.jpeg)\n\n\n\n\n\n图 13-6\
  \ 的重要特性是，单个网页生成了两种视图。此外，我们可以复用大量创建用于检测移动设备的 JavaScript 代码，并仅使用单个 `document.write()`\
  \ 语句来实现切换。然而，在查看主页面之前，你需要两个样式表。要制作这些样式表，请首先在你喜爱的 HTML 文档编辑器或文本编辑器中打开一个新的 CSS 页面。（注意，HTML\
  \ 文档编辑器通常具有创建 CSS 文件的选项）。输入列表 13-6 中的脚本并将其保存为 `standard.css`。然后打开另一个 CSS 页面，输入列表\
  \ 13-7 中的脚本，并将文件保存为 `styleMobile.css`。\n\n### 列表 13-6：标准样式表\n\n```css\n@charset\
  \ “UTF-8”;\n/* CSS Document */\nbody {\n    background-color: #dcdcdc;\n    font-family:\
  \ Arial, Helvetica, sans-serif;\n    font-size: 14px;\n    color: #cc0000;\n}\n\
  h1 {\n    font-family:”Arial Black”, Gadget, sans-serif;\n    color:#00f;\n    margin-left:40px;\n\
  }\n```\n\n如你所见，列表 13-6 中的 body 字体是整整 14 像素，且标题使用了 `h1` 元素。这在计算机屏幕上很容易看到——但正如你在图\
  \ 13-6 中所示，它在移动设备上几乎不可见。\n\n### 列表 13-7：移动设备样式表\n\n```css\n@charset “UTF-8”;\nbody\
  \ {\n    background-color: #0000cc;\n    font-family: Arial, Helvetica, sans-serif;\n\
  \    font-size: 48px;\n    color: #00ff00;\n}\nh1 {\n    font-family:”Arial Black”,\
  \ Gadget, sans-serif;\n    color:#FF0;\n    margin-left:20px;\n    font-size:72px;\n\
  \    text-align:center;\n}\n```\n\n在列表 13-7 中，body 字体放大到 48 像素，尽管这看起来很极端，但生成的文本在移动设备上无需放大屏幕即可清晰可见。为了强调差异，颜色发生了变化，`h1`\
  \ 被居中，并增大到 72 像素。\n\n## 进行切换\n\n现在你已经有了两个不同的外部样式表，你需要做的仅仅是在通过移动设备查看时切换它们。正如你可能记得的，安装外部样式表的标签是：`<link\
  \ rel=”stylesheet” type=”text/css” href=”sty.css”>`\n\n如果你在同一个 header 中放置了两个不同样式表的链接，页面将只使用最后一个样式表链接。换句话说，它取消了第一个样式表。\n\
  \n所以，你需要的只是在脚本检测到移动设备时添加第二个 link 标签。这样做的方法是使用 DOM 语句 `document.write()` 动态写入第二个样式表。以下脚本包含了检测移动设备的\
  \ JavaScript，并为你添加了第二个链接。要创建一个切换样式表的网页，请在你喜爱的 HTML 文档编辑器或文本编辑器中打开一个新的 HTML 页面，输入列表\
  \ 13-8 中的脚本，并将文件保存为 `styleSwitch.html`。\n\n### 列表 13-8：自动切换样式表\n\n```html\n<!DOCTYPE\
  \ HTML>\n<html>\n<head>\n<link rel=”stylesheet” type=”text/css” href=”standard.css\"\
  >\n<script type = “text/javascript”>\n    var sniffer=new Object();\n    var agentNow=navigator.userAgent.toLowerCase();\n\
  \    sniffer.android=(agentNow.search(“android”)>=0);\n    sniffer.series60=(agentNow.search(“series60”)>=0);\n\
  \    sniffer.iphone=(agentNow.search(“iphone”)>=0);\n    sniffer.blackberry=(agentNow.search(“blackberry”)>=0);\n\
  \    sniffer.windowsce=(agentNow.search(“windows ce”)>=0);\n    for(var mobile in\
  \ sniffer)\n    {\n      if(sniffer[mobile])\n      {\n        document.write('<link\
  \ rel=”stylesheet” type=”text/css” href=”styleMobile.css”>');\n        break;\n\
  \      }\n    }\n</script>\n<meta http-equiv=”Content-Type” content=”text/html;\
  \ charset=UTF-8”>\n<title>Style sheet</title>\n</head>\n<body>\n<h1>Style H</h1>\n\
  这是标准尺寸。\n</body>\n</html>\n```\n\n你可以在服务器上加载 `styleSwitch.html` 并使用任何移动浏览器查看它。此外，在你的计算机上测试该脚本。你会看到默认样式，它在计算机屏幕上看起来良好。通过此程序，你可以让你的页面在移动端或标准屏幕上显示正确。\n\
  \n## 验证你的表单\n\n表单验证用于密码保护的站点，也适用于每个使用存入数据库数据的应用程序。例如，假设你只想允许注册用户进入你的网站（并且他们为这种特权付费！）。你需要验证他们的输入。使用\
  \ `<form>` 元素，你可以构建一个网页，让用户在进入之前输入用户名和密码。JavaScript 会检查这两项输入并判断请求是否有效。\n\n### 在表单中使用\
  \ DOM\n\n由于 JavaScript 处理的是对象，你必须理解表单对象与 DOM 之间的关系。在代码中，表单的名称包含了应用于 `<form>` 元素的名称以及应用给不同输入元素的名称（表单将在第\
  \ 9 章详细讨论）。考虑以下代码段：\n\n```html\n<form name=\"validate\" onsubmit=\"return vaidationFunction()\"\
  >\n<input type=\"text\" name=\"userName\">\n```\n\n在 DOM 交互中，引用将是：`document.forms[\"\
  validate\"][\"userName\"].value`。`.value` 属性是用户在文本输入中输入的任何内容。第一个括号值（`validate`）是表单的名称，第二个括号值（`username`）是输入元素的名称。起初看起来可能很奇怪，但它非常有逻辑；当你习惯了这种格式后，它就完全合理了。注意\
  \ `document.forms` 使用复数，而不是 `form`。如果你记住这一点，将节省数小时的挫败！\n\n接下来，你将输入到表单中的值放入变量中。这些变量将与有效的用户名和密码进行比较，然后它们也被放入变量中。例如，此语句将\
  \ `uname` 的小写值与字符串 `tycoon` 进行比较，如果值相同，则会赋予一个 `true` 值。\n\n## HTML 与 JavaScript\
  \ 联合验证\n\n现在你准备好创建一个验证表单了。该网页为成功输入用户名和密码的用户提供有价值的信息（低买高卖）。开始之前，在你喜爱的 HTML 文档编辑器或文本编辑器中打开一个新的\
  \ HTML 页面，输入列表 13-9 中的脚本，然后将文件保存为 `Validate.html`。\n\n### 列表 13-9：验证表单\n\n```html\n\
  <!DOCTYPE HTML>\n<html>\n<head>\n<style type=”text/css\">\nh1 {\n    color:blue;\n\
  \    font-size:48px;\n    text-align:center;\n}\nbody {\n    margin-left:20px;\n\
  \    font-family:Verdana, Geneva, sans-serif;\n    font-size:24px;\n    color:#C60;\n\
  \    background-color:#FC0;\n}\n</style>\n<script type=”text/javascript”>\nfunction\
  \ vaidationFunction()\n{\n    var uname=document.forms[\"validate\"][\"userName\"\
  ].value;\n    var pw=document.forms[\"validate\"][\"secret\"].value;\n    var unb=(uname.toLowerCase()==“tycoon”);\n\
  \    var pwv=(pw.toLowerCase()==“money”);\n    var success=unb && pwv;\n    if(success)\n\
  \    {\n        alert(“大秘籍！->低买高卖.\");\n    }\n    else\n    {\n        alert(“请检查你的用户名和密码。”);\n\
  \    }\n}\n</script>\n</head>\n<meta http-equiv=”Content-Type” content=”text/html;\
  \ charset=UTF-8”>\n<title>Password Validation</title>\n</head>\n<body>\n```\n\n\n\
  \n\n\n```\n<h1>针对登录用户的有价值的财务建议！</h1>\n\n输入用户名：\n\n<form name=\"validate\" onsubmit=\"\
  return vaidationFunction()\">\n  <input type=\"text\" name=\"userName\">\n  <br/>\n\
  \ 输入密码：<br/>\n  <input type=\"password\" name=\"secret\">\n  <br/>\n  <input type=\"\
  submit\" value=\"验证\" name=\"sub\">\n</form>\n\n</body>\n\n</html>\n```\n\n现在，在移动设备上使用任意移动浏览器加载名为\
  \ `Validate.html` 的 HTML 文件。图 13-7 展示了你将看到的内容。样式表为移动用户放大了文本——但当用户点击数据输入框（输入表单）时，图像会变得非常大——实际上大得惊人，如图\
  \ 13-7 所示。这里的文本必须足够大，以便移动用户能立即看到需要执行的操作，但同时也要足够小，以便当设备放大数据输入区域时，文本仍然可读。24 像素字体是一种折中方案，但正如你所见，它们既不能更小也不能更大。验证按钮最初只是隐约可见，但一旦开始数据输入，它就变得清晰可见；因此似乎无需尝试改变其大小。\n\
  \n**图 13-7：** 验证过程中的三个步骤。\n\n![9781118026229-fg1307.eps](img/9781118026229-fg1307_opt.jpeg)\n\
  \n## 第 14 章：创建移动测验\n\n## 本章内容\n\n![arrow](img/arrow.png) 将大项目分解为可管理的部分\n\n![arrow](img/arrow.png)\
  \ 规划项目\n\n![arrow](img/arrow.png) 开发应用程序\n\n![arrow](img/arrow.png) 从 HTML 用户界面开始\n\
  \n![arrow](img/arrow.png) 使用 CSS 调整大小和外观\n\n![arrow](img/arrow.png) 使用 HTML 表单\n\
  \n![arrow](img/arrow.png) 将 HTML 值传递给 JavaScript\n\n![arrow](img/arrow.png) 使用 JavaScript\
  \ 计算结果\n\n除了其他有趣且令人兴奋的功能外，JavaScript 为你的网站带来了交互性。它允许你开发超越 HTML 和 CSS 提供的漂亮外观的网站。JavaScript\
  \ 让你能够赋予那个漂亮外观以才华——让你的美观网页跳舞、唱歌，甚至跳霹雳舞。除了为你的网页创作提供有趣的动画选项外，你还可以创建基于用户输入做出决策的 JavaScript\
  \ 应用程序——例如，一个交互式测验。\n\n假设你正在教授 JavaScript，并且想制作一个在线测验，让学生在移动设备上测试他们对 JavaScript\
  \ 概念和术语的掌握情况。这样，当他们在排队、等待或坐在公交车站时，就可以复习和测试自己对 JavaScript 术语和概念的理解。随着时间的推移，你可以更新测验，添加新内容——要么通过增加额外问题来扩展，要么用全新问题替换现有问题。\n\
  \n本章将介绍你成为测验构建大师所需的过程和技巧！与大多数大型项目一样，将完整的 Web 应用程序分解为不同的任务，定义每个任务并逐一解决，通常是个好主意。也就是说，你要将这个相对复杂的过程简化为一系列逻辑步骤。在本例中，创建在线测验的主要部分涉及三种不同的技术：HTML、CSS\
  \ 和 JavaScript。\n\n此外，测验本身将由不同的阶段或操作组成。这些操作并非单一技术的专属领域。你可能需要将两种或多种技术结合使用来完成不同阶段。本章将展示如何构建各个阶段，并将它们组合成一个完整的应用程序。\n\
  \n### 理解多阶段应用程序开发\n\n每种类型的 Web 应用程序都有自己的一组阶段，有时称为操作或例程。例如，在线测验将包含以下阶段：\n\n![check.png](img/check.png)\
  \ 用户输入：这是一种极客的说法，意思是测验参与者需要一种方式来输入测验问题的答案。\n\n![check.png](img/check.png) 数据存储：当答案输入后，你需要一种存储它们的方式。对于这个测验，存储是临时的，因此你无需担心将答案写入永久存储技术（如数据库甚至本地硬盘）。所有存储都在内存中完成，保存用户的答案，以便应用程序能够统计和评分测验。\n\
  \n![check.png](img/check.png) 测验评估：测验参与者会想知道自己答得如何。（当然，在你花时间创建测验后，你会得到 100 分！）应用程序的最后阶段是评分并向用户展示结果。\n\
  \n为了使测验全面（且有用），这些例程必须组合成一个无缝的应用程序。让我们从检查不同的操作部分以及每个阶段需要哪些技术开始。\n\n## 用户界面\n\n应用程序的用户界面（UI）代表程序中用户与网页交互的部分。在本例中，UI\
  \ 是用户实际参加测验的部分。因此，首先你应该确定哪些技术提供了哪些选项来帮助创建用户界面。例如，HTML 提供了必要的表单字段，在本例中包括文本框、单选按钮和复选框。表单和表单字段在第\
  \ 9 章中有详细讨论。\n\n在为移动环境开发时，需要记住的重要一点是，一旦用户开始用手指将查看窗口放大，UI 的相对大小就会发生变化。通过相对于查看 UI\
  \ 元素的表单来定义 CSS，你可以优化相对大小。因此，如果你要调整文本大小，请确保在表单标签以及 body 元素中都进行定义。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 无论你做什么，请记住，你的 UI 在移动设备上的显示效果会与在开发屏幕上不同。因此，请务必注意输入元素（文本输入、单选按钮输入和复选框输入）的相对大小，以及字体的大小。\n\
  \n## 文本框\n\n在为移动设备设计测验时，你可能不会有太多显示区域用于论述题（而且反正也没人喜欢它们）。此外，长单词和多句子的答案用 JavaScript\
  \ 评分会极其困难。\n\n你可以使用 `<textarea>` 标签（在第 9 章中讨论）包含一个大的论述区域，但这会占用其他问题的空间。因此，我们不会为这个测验创建任何论述题。不过，你确实有空间容纳简短答案，例如单个单词的答案。JavaScript\
  \ 有许多不同的命名部分，用你的学生应该知道的术语定义。因此，你可以测验学生对 JavaScript 术语和概念的掌握情况。让我们开始吧！\n\n例如，你可能问的一个问题是：“JavaScript\
  \ 中用于临时存储的元素是什么？”\n\n答案是变量。\n\n为了在将其放入 JavaScript 变量之前保存这些信息，你使用 HTML 的 `text input`（即文本字段）表单元素。文本字段（也称为文本框）和其他表单元素在第\
  \ 9 章中讨论。图 14-1 显示了一个文本字段的示例。\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg)\
  \ 对于某些移动设备，例如图 14-1 中显示的 iPhone，一旦你点击输入框，文本框就会放大，键盘也会出现。当点击“完成”按钮时，键盘消失，用户可以通过用手指和拇指拉伸屏幕来调整屏幕大小——这个过程称为多点触控。\n\
  \n**图 14-1：** 文本输入框，文本字段。\n\n![9781118026229-fg1401.tif](img/9781118026229-fg1401_opt.jpeg)\n\
  \n## 单选按钮\n\n\n\n\n\n## 单选按钮与复选框\n\n## 单选按钮\n\n创建测验的另一个实用工具是单选按钮，第 9 章也讨论过。当你希望从两个或更多可能的回答中只选一个正确答案时，请使用单选按钮。例如，**真**/**假**问题就是单选按钮擅长的互斥选择类型。如果你点击一个按钮，其他按钮的状态就会变为未选中。例如，图\
  \ 14-2 展示了一个由三种政治倾向组成的单选按钮组。如果点击（选中）其中任何一个按钮，另外两个按钮的状态就会变为未选中。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 如果你正在创建一份收集用户人口统计信息的问卷，受访者通常不愿意填写多个文本框。（我们过去常用纸笔来做这件事。人类真是被惯坏了！）单选按钮让他们更容易作答，你也更有可能获得你想要的信息！\n\
  \n## 复选框\n\n我们 JavaScript 测验中的第三个 UI 组件是复选框，第 9 章也讨论过。与单选按钮类似，复选框通过预定义的选项收集用户回答。然而，与单选按钮不同的是，复选框不是互斥的。用户可以对任何一个问题勾选任意数量的回答。例如，在设计一个在线商店时，开发者可能希望包含礼品包装、加急配送以及接收公司促销邮件的选项。用户可能想要全部、部分或这些选项中的任何一个，而复选框使得选择所需选项成为可能（且简单）。图\
  \ 14-3 展示了一个复选框可能派上用场的例子：\n\n**图 14-2：** 一个包含三个可能答案的单选按钮组。\n\n![9781118026229-fg1402.tif](img/9781118026229-fg1402_opt.jpeg)\n\
  \n**图 14-3：** 复选框允许用户进行多项选择。\n\n![9781118026229-fg1403.tif](img/9781118026229-fg1403_opt.jpeg)\n\
  \n# 数据存储\n\n数据存储的概念常常让人联想到服务器端编程和非常复杂的东西。但这里并非如此。每当你在 HTML 中使用表单时，你很可能就在存储数据。大多数\
  \ HTML 标签都有名称和值。当用户向表单中输入信息时，他们就将输入的数据放入一个临时存储区域——字段中。JavaScript 可以访问这些存储的信息并对其进行处理。在本节中，你将看到不同类型的表单如何存储数据，以及如何检索这些数据。\n\
  \n## 表单中的基本数据存储\n\n为了理解表单中的数据存储，我们需要查看文档对象模型（DOM），第 3 章讨论过。要用代码表示 DOM，我们必须设想一个大纲。大纲的顶部是文档——即“网页”的别称。因此，在\
  \ DOM 术语中，对页面的所有引用都是：\n\n`document`\n\n这很容易记住。文档（页面）中的内容通过点（句点）附加到文档上。因此，典型的 DOM\
  \ 语句看起来像这样：\n\n`document.myForm.myInput.value`\n\n这个 DOM 语句在大纲中看起来如下：\n\n1. 我的网页（document）\n\
  \   1. 我的表单（form 元素）\n      1. 我的输入（文本、单选按钮、文本框）\n         1. 左侧元素的值（内容）\n\n现在，你可以编写一个包含所有要素的小型\
  \ HTML 脚本了。为此，用你喜欢的 HTML 文档编辑器或文本编辑器打开一个新 HTML 页面，添加清单 14-1 中的脚本，并将其保存为`DataStorage.html`。\n\
  \n清单 14-1：HTML 数据存储脚本\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<script type=\"\
  text/javascript\">\nfunction showDOM()\n{\n   alert(document.myForm.myInput.value);\n\
  }\n</script>\n<style type=\"text/css\">\n/*BEC0CA,A99570,8B7155,6C4A36,491E42 */\n\
  body {\n   font-family:Verdana, Geneva, sans-serif;\n   color:#491E42;\n   background-color:#BEC0CA;\n\
  }\nform {\n   font-size:24px;\n}\n</style>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n<title>Data in Elements</title>\n</head>\n<body>\n\
  <form name=\"myForm\">\nEnter text:<br/>\n  <input type=\"text\" name=\"myInput\"\
  ><p/>\n  <input type=\"submit\" value = \"Click Me\" onClick=\"showDOM()\">\n</form>\n\
  </body>\n</html>\n```\n\n如果你在任何浏览器中在移动设备上测试这个文件，你会看到类似图 14-4 的内容。\n\n**图 14-4：**\
  \ 带有存储值的 DOM 语句。\n\n![9781118026229-fg1404.tif](img/9781118026229-fg1404_opt.jpeg)\n\
  \n回顾 DOM 语句，你可以看到`alert()`函数显示在文本框中输入的任何内容：\n\n`document.myForm.myInput.value`\n\
  \n这是因为名为`myInput`的文本输入框的内容位于名为`myForm`的表单容器内，而所有这些都位于网页（document）上。\n\n可以把这些小点想象成链条中的链环——就像钥匙链上的那些小珠链。DOM\
  \ 语句只是一种获取表单元素中存储的内容并对其进行处理的方式——例如，用 JavaScript 函数显示它。\n\n## 在单选按钮中存储和检索数据\n\n处理单选按钮比处理文本要稍微复杂一些。对于单选按钮，你必须提供一个值属性，并且必须检查单选按钮是否已被选中，即“checked”。最好从一些简单的代码开始：\n\
  \n```html\nChoose favorite:<br/>type of pet:<br/>\n  <input type=\"radio\" name=\"\
  zapRadio\" value=\"cats\">Cats<br/>\n  <input type=\"radio\" name=\"zapRadio\" value=\"\
  dogs\">Dogs<br/>\n  <input type=\"radio\" name=\"zapRadio\" value=\"birds\">Birds<br/>\n\
  ```\n\n首先，每个单选按钮的值属性被赋予一个字符串、数字或布尔值。在上面的列表中，`cats`、`dogs`和`birds`被分配给了单选按钮的值。其次，每个单选按钮可以处于`checked`或`unchecked`状态。第三，一个组中每个单选输入元素的名称必须相同。\n\
  \n### 在单选按钮中存储值\n\n在单选按钮中存储值只需要你为`value`属性赋值。用户通过点击其中一个按钮来选择值，这非常简单。在屏幕上，单选按钮看起来会像图\
  \ 14-5。\n\n看看图 14-5，问自己：“如何获取被点击单选按钮的值？”你不能使用 DOM 语句，因为所有单选按钮的名称相同：\n\n`document.formName.zapRadio.value`\n\
  \n此外，你必须指定只有被选中的单选按钮。这需要一个两步过程。\n\n1. 确定按钮是否已被选中（checked）。\n2. 获取选中按钮的值。\n\n**图\
  \ 14-5：** 单选按钮存储按钮是选中还是未选中的状态。\n\n![9781118026229-fg1405.tif](img/9781118026229-fg1405_opt.jpeg)\n\
  \n单选按钮名称的一个秘密是，虽然一个组中的所有按钮必须同名，但每个名称都被赋予了一个编号。（这正是数组元素的工作方式。）以下是这三个按钮的 DOM 的另一种表示方式：\n\
  \n`document.formName.zapRadio[0].checked;`\n\n`document.formName.zapRadio[1].checked;`\n\
  \n`document.formName.zapRadio[2].checked;`\n\n这些 DOM 语句的值可以是`True`或`False`。因为组中一次只能选中一个按钮，所以只有一个可以是`True`。因此，下一个技巧是确定哪个按钮被选中。\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 计算机讨厌浪费任何整数，因此 DOM 中的数组和类数组元素从\
  \ 0 开始而不是从 1 开始。与数组类似，你可以通过检查`length`属性来查找表单或输入组（如单选按钮）的长度。如果你的最高编号单选按钮是`myRadio[8]`，那么长度将是\
  \ 9，因为尽管数组以 8 结尾，从 0 到 8 编号，但元素总数是 9。\n\n### 遍历单选按钮\n\n\n\n\n为了找到哪个单选按钮（radio button）被选中以及该按钮的值，JavaScript\
  \ 使用了循环。循环简单来说就是重复的操作，就像询问：“我们到了吗？”。当我们到达时，我们会宣布：“我们到了！”，这个问题就不再被问起。然而，我们现在需要询问：“我们在哪里？”\
  \ 位置的“值”就是我们停止的地方——我们在动物园了！\n\nJavaScript 中的循环格式会不断询问：“这个被选中了吗？”。当循环找到被选中的单选按钮时，它会接着问：“值是多少？”。在\
  \ DOM 中，查询语句如下：\n\n```\nTrue? document.formName.zapRadio[XX].checked;\nValue? document.formName.zapRadio[XX].value;\n\
  ```\n\n`XX` 代表一个未知值。\n\n`for` 循环有一个起始值，该值将设置为 `0`，因为单选按钮数组从 `0` 开始。组中单选按钮的数量决定了循环运行的次数——每次“运行”被称为一次迭代。我们将使用一个单选组长度的变量，该长度可以从组名（`zapRadio`）中获取。\n\
  \n```\nvar radioSize=document.myForm.zapRadio.length;\n```\n\n接下来，使用 `radioSize`\
  \ 变量，我们将开始 `for` 循环，其中一个变量持有当前迭代的值并声明循环的起始点：\n\n```\nfor(var fl=0;fl<radioSize;fl++)\n\
  {\n```\n\n第一行声明：“用一个设置为 `0` 的变量 (`fl`) 开始循环。然后，检查它是否小于按钮组的长度（`radioSize`），然后将下一次迭代增加\
  \ 1（`fl++`）。”\n\n循环每次迭代时，它都会使用以下代码检查单选按钮是否被选中：\n\n```\nif(document.myForm.zapRadio[fl].checked)\n\
  {\n```\n\n记住，按钮要么被选中，要么未被选中，并回复 `True`（已选中）或 `False`（未选中）。如果它检测到 `True` 响应，它就会宣布该按钮被选中。在这种情况下，使用\
  \ `alert()` 函数即可解决问题：\n\n```\nalert(document.myForm.zapRadio[fl].value);\n```\n\n\
  就是这么了。我们现在可以编写一个小程序来查找用户更偏好哪种宠物。要这样做，请在你喜欢的 HTML 文档编辑器或文本编辑器上打开一个新的 HTML 页面，添加列表\
  \ 14-2 中的脚本，然后将文件保存为 `ChoiceDataStorage.html`。\n\n#### 列表 14-2：使用单选按钮\n\n```html\n\
  <!DOCTYPE HTML>\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction showDOM()\n\
  {\n  var radioSize=document.myForm.zapRadio.length;\n  for(var fl=0;fl<radioSize;fl++)\n\
  \    {\n      if(document.myForm.zapRadio[fl].checked)\n      {\n          alert(document.myForm.zapRadio[fl].value);\n\
  \      }\n    }\n}\n</script>\n<style type=\"text/css\">\nbody {\n    font-family:Verdana,\
  \ Geneva, sans-serif;\n    color:#491E42;\n    background-color:#BEC0CA;\n}\nform\
  \ {\n    font-size:24px;\n}\n</style>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n<title>Data in Elements</title>\n</head>\n<body>\n\
  <form name=\"myForm\">\n选择你喜爱的宠物类型：<br/>\n  <input type=\"radio\" name=\"zapRadio\"\
  \ value=\"cats\">猫<br/>\n  <input type=\"radio\" name=\"zapRadio\" value=\"dogs\"\
  >狗<br/>\n  <input type=\"radio\" name=\"zapRadio\" value=\"birds\">鸟<br/>\n  <input\
  \ type=\"submit\" value = \"Click Me\" onClick=\"showDOM()\">\n</form>\n</body>\n\
  </html>\n```\n\n使用任何浏览器在移动设备上测试该文件。图 14-6 显示了你将看到的内容。\n\n从单选按钮获取信息比文本输入表单稍微更有挑战性，但请记住它们对用户来说容易得多。作为一个一般原则，对用户来说越容易，对开发者来说越困难。\n\
  \n**图 14-6：** 从存储在单选按钮的数据中检索信息。\n\n![9781118026229-fg1406.tif](img/9781118026229-fg1406_opt.jpeg)\n\
  \n### 在复选框中存储和检索数据\n\n处理复选框（checkbox）与处理单选按钮非常相似，有一个重要的例外：在复选框组中，你可以进行多项选择。你可以将复选框命名为像单选按钮那样的数组分组，也可以将它们视为独立选择。前一节关于单选按钮的大部分信息适用于复选框——我们可以跳过一些基础工作。然而，你将在接下来的\
  \ DOM 表示中看到一个重要的区别，每个复选框显示有不同的名称：\n\n`document.codeForm`\n\n所有的复选框都属于同一个表单（`codeForm`），但每个都有唯一的名称。然而，我们仍然需要确定复选框是否被选中。此外，我们不再是简单地输出单个选择的名称，而是发送所有被选中的项。为了做到这一点，我们将所有被选中的项发送到变量中。这样做，每个被选中的值被放入变量：\n\
  \n```\nif(document.codeForm.checkH.checked)\n{\n  mycode += document.codeForm.checkH.value;\n\
  }\n```\n\n使用 `mycode` 变量通过 `+=` 运算符，所有被选中的值被连接（拼接）到变量中。以下代码显示了过程：\n\n```\nif(document.codeForm.checkH.checked)\
  \ {\n  mycode += document.codeForm.checkH.value;\n}\nif(document.codeForm.checkC.checked)\
  \ {\n  mycode += document.codeForm.checkC.value;\n}\nif(document.codeForm.checkJ.checked)\
  \ {\n  mycode += document.codeForm.checkJ.value;\n}\nif(document.codeForm.checkP.checked)\
  \ {\n  mycode += document.codeForm.checkP.value;\n}\nif(document.codeForm.checkA.checked)\
  \ {\n  mycode += document.codeForm.checkA.value;\n}\n```\n\n使用 `mycode` 变量通过 `+=`\
  \ 运算符，程序可以存储所有的选择。\n\n#### 列表 14-3：使用复选框\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
  <script type=\"text/javascript\">\nfunction checkPlease()\n{\n  var mycode=\"\"\
  ;\n  if(document.codeForm.checkH.checked) {\n    mycode+=document.codeForm.checkH.value;\n\
  \  }\n  if(document.codeForm.checkC.checked) {\n    mycode+=document.codeForm.checkC.value;\n\
  \  }\n  if(document.codeForm.checkJ.checked) {\n    mycode+=document.codeForm.checkJ.value;\n\
  \  }\n  if(document.codeForm.checkP.checked) {\n    mycode+=document.codeForm.checkP.value;\n\
  \  }\n  if(document.codeForm.checkA.checked) {\n    mycode+=document.codeForm.checkA.value;\n\
  \  }\n  alert(mycode);\n}\n</script>\n<style type=\"text/css\">\nbody {\n    font-family:Verdana,\
  \ Geneva, sans-serif;\n    color:#3C461;\n    background-color:#EAEC0;\n}\nform\
  \ {\n    font-size:24px;\n}\n</style>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\">\n<title>Checkbox Data</title>\n</head>\n<body>\n<form\
  \ name=\"codeForm\">\n你使用哪些网络编码？<br/>\n  <input type=\"checkbox\" name=\"checkH\"\
  \ value=\"html5\">HTML5<br/>\n  <input type=\"checkbox\" name=\"checkC\" value=\"\
  css3\">CSS3<br/>\n  <input type=\"checkbox\" name=\"checkJ\" value=\"javascript\"\
  >JavaScript<br/>\n  <input type=\"checkbox\" name=\"checkP\" value=\"php\">PHP<br/>\n\
  \  <input type=\"checkbox\" name=\"checkA\" value=\"actionscript\">ActionScript<br/>\n\
  \  <input type=\"submit\" value = \"Click Me\" onClick=\"checkPlease()\">\n</form>\n\
  </body>\n</html>\n```\n\n使用任何浏览器在你的电脑或移动设备上测试该文件。图 14-7 显示了带有多个选的复选框以及显示不同选择的警告窗口：\n\
  \n**图 14-7：** 多选选择和选择显示。\n\n![9781118026229-fg1407.tif](img/9781118026229-fg1407_opt.jpeg)\n\
  \n现在你已经学会了通过许多不同的 HTML 表单收集和检索数据，你已经有能力创建一些可以在移动设备上使用的东西了。\n\n\n\n\n为了专注于项目的不同部分，我将其分为三个部分：用于\
  \ UI 的 CSS、用于收集和存储数据的 HTML，以及用于检索和显示数据的 JavaScript。项目对 HTML 文件使用的 CSS 和 JavaScript\
  \ 使用了单独的文件。因此，请务必将这三个文件放在同一个目录下。\n\n# 用于 JavaScript 验的 CSS\n\n对于我们中艺术细胞匮乏的人来说，获取一组良好的配色可能是令人困难的。幸运的是，帮助就在身边。全世界的数字艺术家都在使用\
  \ Adobe Kuler ([`http://kuler.adobe.com`](http://kuler.adobe.com))。它是免费的、在线的且易用的。要开始，访问\
  \ Kuler，并在搜索窗口输入 Java Script（两个单词）。因为有人保存了一个名为 Java Script 的颜色组合，你将获得一组色彩协调的方案。拥有超过\
  \ 50 万种颜色组合，你会发现大多数搜索术语都有你想要的内容。当你获得 Java Script 颜色组合时，你会发现以下十六进制颜色值：\n\n`FFC30D,4F3817,FFFF95,\
  \ E89840,B8B86A`\n\n使用每个十六进制值的颜色描述，用你喜欢的编辑器打开一个新的 CSS 页面，添加列表 14-4 中的代码，并将文件保存为\
  \ `js.css`。\n\n### 列表 14-4: 用于 JavaScript 验的 CSS\n\n```css\n@charset “UTF-8”;\n\
  /* CSS Document \nOrange-Yellow FFC30D, Brown 4F3817, Cream FFFF95,\nLt Burnt OrangeE89840,\
  \ Light Rusted green B8B86A*/\nbody\n{\n    background-color:#FFFF95;\n    font-family:Verdana,\
  \ Geneva, sans-serif;\n    color:#4F3817;\n    font-size:24px;\n}\nform\n{\n   \
  \ font-size:24px;\n}\nh1\n{\n    font-size:62px;\n    background-color:#4F3817;\n\
  \    color:#B8B86A;\n    text-align:center;\n    padding-bottom:6px;\n}\n#notice\n\
  {\n    background-color:#E89840;\n}\n```\n\n该 CSS 与本章及本书其他地方创建的其他样式表类似。对于测试，添加了一个特殊的\
  \ `#notice` ID，以便高亮某些术语。在这种情况下，负向选择需要高亮。\n\n# HTML UI 和存储模块\n\n移动设备测试的核心在 HTML 中。该测试包含一个文本表单、两个单选按钮表单和一个复选框表单。这些表单都可以临时存储数据。提交按钮表单调用\
  \ JavaScript 程序来收集数据并生成展示给用户的评分。要创建 HTML 页面，用你喜欢的编辑器打开一个新的 HTML 页面，添加列表 14-5 中的脚本，然后将文件保存为\
  \ `JSquiz.html`，并与 `js.css` 文件放在同一目录下。\n\n### 列表 14-5: 用于 JavaScript 验的 HTML\n\n\
  ```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<!-- //Java Script\n//Orange-Yellow FFC30D,\
  \ Brown 4F3817, CreamFFFF95              →5\n//Lt Burnt OrangeE89840, Light Rested\
  \ green B8B86A            →6\n-->\n<script src=”jsquiz.js\"></script>          \
  \                →8\n<link rel=”stylesheet” type=”text/css” href=”js.css” />\n<meta\
  \ http-equiv=”Content-Type” content=”text/html; charset=UTF-8\">\n<title>JavaScript\
  \ Quiz</title>\n</head>\n<body>\n<h1>JavaScript Quiz</h1>\n<form name=”jsquiz\"\
  >\n  1\\. 用于延迟脚本执行的结构名称是什么？\n  <input type=\"\"text” name=\"\"defer\">>\n  <p/>\n\
  \  2\\. JavaScript 要求为变量提供数据类型声明语句。<br/>\n  <input type=\"\"radio” name=\"\"wtype”\
  \ value =”true”>\n  True  <input type=\"\"radio” name=\"\"wtype” value =”false”>\n\
  \  False\n  <p/>\n  3\\. 用什么来启动函数？（勾选所有正确的选项。）<br/>\n  <input type=\"\"checkbox”\
  \ name=\"\"launch\">          →26\n  a. 标签名\n  <input type=\"\"checkbox” name=\"\
  \"launch\">>\n  b. 事件\n  <input type=\"\"checkbox” name=\"\"launch\">>\n  c. 函数调用\n\
  \  <input type=\"\"checkbox” name=\"\"launch\">          →32\n  d. 表单属性\n  <p/>\n\
  \  4\\. 下列哪项可以通过 JavaScript 实现？<br/>\n  <input type=\"\"radio” name=\"\"uses” value\
  \ =”pg”>\n  a. 跳转到不同页面\n  <input type=\"\"radio” name=\"\"uses” value =”alert”>\n\
  \  b. 显示警告消息\n  <input type=\"\"radio” name=\"\"uses” value =”db”>\n  c. 将数据输入数据库\n\
  \  <input type=\"\"radio” name=\"\"uses” value =”validate”>\n  d. 验证输入\n  <input\
  \ type=\"\"submit” name=\"\"done” value=\"\"Send in answers” onClick=\"\"evalNow()\"\
  >\n</form>\n</body>\n</html>\n```\n\n在此接处，不要测试页面。它仍然需要其 JavaScript。然而，你应该注意一些细微的特征。\n\
  \n- 第 5-6 行：颜色描述位于页面顶部。你需要处理的调色板存储在 CSS 模块中。\n- 第 8 行：JavaScript 位于外部文件并通过 `<script>`\
  \ 标签调用。\n- 第 26-32 行：复选框元素具有相同的名称 (`launch`)。这是因为 JavaScript 可以像处理单选按钮一样处理每一个元素。唯一的区别是单选按钮组只能选择一个，这对于复选框不是如此。\n\
  \n此外注意复选框没有包含 value 属性。实际上，没有任何表单需要它，但为了扩展单选按钮添加了它。（当然，你也可以为复选框添加值。）\n\n测试现在只需要一个“引擎”来计算结果。正如你在下一节中看到的，这并不困难。\n\
  \n# 测试的 JavaScript 引擎\n\n测试拼图的最后一块是外部 JavaScript 文件。JavaScript 模块只是一个单一函数 `evalNow`，用于判断提交了多少正确答案。\n\
  \n要检查整个测试，你需要添加 JavaScript 模块。为此，用你喜欢的编辑器打开一个新的文本页面，添加列表 14-6 中的脚本，并将文件保存为 `jsquiz.js`，与\
  \ `JSquiz.html` 和 `js.css` 文件放在同一个文件夹中。\n\n某些文档编辑器如 Adobe Dreamweaver 有 JavaScript\
  \ 模板，但即使简单的文本编辑器也能胜任。\n\n### 列表 14-6: 用于 JavaScript 验的 JavaScript 评分引擎\n\n```javascript\n\
  // JavaScript Document\nfunction evalNow()\n{\n    var score=0;\n    var q1=document.jsquiz.defer.value;\n\
  \    if(q1.toLowerCase() ==“function”)\n    {\n        score++;\n    }\n    var\
  \ q2bC=document.jsquiz.wtype[1].checked;\n    if(q2bC)\n    {\n        score++;\n\
  \    }\n    var q3bC=document.jsquiz.launch[1].checked;\n    var q3cC=document.jsquiz.launch[2].checked;\n\
  \    if(q3bC && q3cC)\n    {\n        score++;\n    }\n    var q4cC=document.jsquiz.uses[2].checked;\n\
  \    if(q4cC)\n    {\n        score++;\n    }\n    alert(“你有 “ + score + “ 个正确回答。”);\n\
  }\n```\n\n\n\n\n\n在复选框问题中，第二个和三个选项是正确的，因此 JavaScript 使用逻辑与运算符 (`&&`) 来确保这两项都被选中。请注意，元素通过\
  \ `launch[1]` 和 `launch[2]` 进行标识，以检查第二个和第三个复选框是否被选中——记住 `launch[0]` 是第一个复选框。\n\n\
  当所有答案评估完成后，`score` 变量被放入 `alert()` 函数的字符串语句中，以向用户显示好（或坏）消息。图 14-8 显示了在评分期间和之后测试在移动设备上的显示。\n\
  \n**图 14-8：** 一个包含三个不同类型表单字段问题的移动端测试。\n\n![9781118026229-fg1408.tif](img/9781118026229-fg1408_opt.jpeg)\n\
  \n# 第 15 章：让你的移动网站有利于搜索引擎\n\n## 本章内容\n- ![arrow](img/arrow.png) 了解搜索引擎如何寻找网站\n-\
  \ ![arrow](img/arrow.png) 了解搜索引擎如何索引和排名网站\n- ![arrow](img/arrow.png) 使用 `meta` 标签\n\
  - ![arrow](img/arrow.png) 在网站文案中使用关键词\n- ![arrow](img/arrow.png) 了解关键词的放置和密度\n-\
  \ ![arrow](img/arrow.png) 使用站点地图 (Sitemaps) 将网站提交给搜索引擎\n\n搜索引擎？它们与 HTML 和 CSS 有什么关系？考虑到让你的网站在热门搜索引擎上被发现的过程在很大程度上取决于你的标记代码，因此让你的网站有利于搜索引擎与你的代码密切相关。\n\
  \n传统上，衡量网站成功的首要指标之一是流量大小——即获得多少次访问量或点击量。尽管在广播、电视和杂志广告上花费了大量资金，但搜索引擎（主要是 Google）才是塑造互联网流量的真正力量。如果你的网站很成功，那么通过搜索引擎发现并导航到你网站的人将多于通过任何其他媒体。\n\
  \n而如今，毫无疑问，最成功的搜索引擎是 Google。事实上，一些研究人员认为 Google 的搜索引擎市场份额高达 72%，是其所有竞争对手市场份额总和 3\
  \ 倍以上。因此，当你为搜索引擎优化网站时，将 Google 作为主要关注点是唯一合理的。此外，在许多情况下，为 Google 优化网站也为该网站适应许多其他搜索引擎做了准备。\n\
  \n本章探讨了准备你的网站和代码以便在 Google 上被发现的许多方法。你将学习搜索引擎如何发现和索引网站，包括除了付费之外，还有哪些标准让网站更接近搜索引擎列表的顶端。信不信由，仅仅是最相关的，或者说与用户的搜索术语最匹配，并不总是够的。有时，它甚至远远不够。\n\
  \n你可以做很多事情来提高你的网站在 Google 上的地位，例如在页面的 `<head>` 部分创建高效的 `<meta>` 标签；使用相关的页面标题、标题和副标题；在文案中使用关键词的密度（或使用频率）；关键词在页面上的放置；图像替代文本（alt\
  \ text）；站点地图；以及许多其他技术。本章将探讨最有效的搜索引擎优化 (SEO) 实践。\n\n## 你构建了，但他们不会来\n\n在为客户设计网站的多年里，我遇到过几个人，他们认为要在互联网上取得成功，你所做的只是建立外观漂亮、信息丰富的网站，然后坐等发富。这让我想起了凯凯文·科斯特纳的一部热门电影《梦幻之地》(Field\
  \ of Dreams) 中的那句名言。电影中的一个幽魂告诉考虑在自己的玉米田里建造棒球场的主角（科斯特纳）：“只要你建造它，他们就会来。”\n\n在产生网站流量方面，这种态度是非常天真的。从某种方式或另一种方式来说，大多数网站的设计都是为了执行某种营销——即使是网站本身就是产品的网站。营销是一项艰巨、持续且耗时的任务。搜索引擎优化是营销的一种形式，也是整体营销计划的重要部分。作为网站设计师，为搜索引擎准备网站的工作往往落在了你身上。\n\
  \n## 了解搜索引擎如何寻找网站\n\n坦率地说，“搜索引擎如何寻找网站？”这个问题的答案很简单。你——作为网站设计师、网站所有者或 SEO 专业人员——告诉搜索引擎关于该网站的信息以及在哪里（URL）找到它。你在页面本身中告诉他们关于网站的方式（或说得有多详细），决定了网站在列表中的位置（排名/排名）。\n\
  \n例如，Google 拥有一套复杂的标准，用来确定网站在搜索结果页面上的位置。它根据几个因素对网站进行评分，这些因素是通过检查和索引网站计算出来的。要做到这一点，Google\
  \ 必须先被告知该网站以及在哪里找到它。\n\n### 注册你的网站\n\n尽管所有的搜索引擎略有不同，但在它们知道你的网站存在以及在哪里找到它之前，无法检查和索引你的网站。例如，Google\
  \ 要求你注册网站。注册网站很容易，如图 15-1 所示。只需访问 [`google.com/addurl/?continue=/addurl`](http://google.com/addurl/?continue=/addurl)。\n\
  \n![tip.eps](img/tip_opt.jpeg) 多年来，这个 URL 发生了多次变化。你可以通过搜索“register site google”随时找到当前的注册页面。\n\
  \n**图 15-1：** Google 的网站。\n\n![9781118026229-fg1408.tif](img/9781118026229-fg1408_opt.jpeg)\n\
  \n### 蜘蛛、爬取、机器人或其他术语\n\n随着新技术的出现，它们会带来自己独特的（往往令人困惑且有趣的）术语。不熟悉互联网搜索技术的人一定对蜘蛛 (spiders)、爬取\
  \ (crawling)、机器人 (bots) 和机器人等术语感到困惑。基本上，所有这些术语指的都是同一种技术——Google 等搜索引擎用于检查和索引网站的软件。它们通常被称为蜘蛛。\n\
  \n### 为点击换取硬币\n\n人们经常问我如何让他们的网站位于 Google 的顶端或附近。答案是：“在 Google 和大多数其他搜索引擎上确保优先排名的唯一、可靠且经过测试的方法就是付费。”\n\
  \n当你查看 Google 搜索结果页面（如图所示）时，注意顶三个位置以及页面右侧的列表。这些是 Google AdSense 计划的广告商为这些位置付费。或者更准确地说，他们为这些位置“竞价”。占据顶部位置的广告商出价最高。\n\
  \n![9781118026229-sb1501.eps](img/9781118026229-sb1501_opt.jpeg) 然而，并非如此简单。这些广告商并不是每次列表出现在顶部位置之一时都会被收费。相反，只有当用户点击列表并进入广告主的网站时，他们才需要付费。换句话说，他们为每次“点击”愿意支付的金额进行竞价。在互联网术语中，这种产品通称为“按点击付费”（pay-per-click）广告。\n\
  \n\n\n\n\n# 搜索引擎如何对页面进行排名\n\n在爬虫收集到您网站的信息后，谷歌的服务器应用程序会使用谷歌自有的专有算法对数据进行加权或排名。其他搜索引擎使用类似的方法，但排名标准不同。例如，谷歌会忽略冠词（a、an、the）以及其他“不重要的”词汇。而其他搜索引擎（如\
  \ AltaVista）则不会忽略。词汇在网站中出现的位置、出现频率等，都是排名系统的一部分。例如，页面标题、副标题和 `meta` 标签中的词汇，其权重高于正文或文案中的词汇。\n\
  \n因此，本章介绍的 SEO 技术有助于您在搜索引擎结果页面的免费（即非按点击付费）部分中名列前茅。有时，根据您的预算，您可能只能满足于此。\n\n## 为搜索引擎准备您的网站\n\
  \n如何针对谷歌和其他搜索引擎优化您的网站，实际上取决于您打算如何使用搜索引擎。如果您使用侧边栏“冷冰冰的点击换现金”中描述的按点击付费方法，其流程与不使用该方法时大不相同。付费广告\
  \ SEO 主要通过搜索引擎的 SEO 设置页面进行，并不真正依赖于您如何设置页面。事实上，许多公司会付费请 SEO 专业人士来优化按点击付费服务。有时，根据您销售的产品或服务，您设置关键词的方式会对您的花费产生巨大影响。我们谈论的是数千美元。聘请一位了解各种服务运作方式的人可能是一项明智的投资。\n\
  \n不过，针对免费搜索引擎排名的 SEO 在财务上风险较小，因此您可以进行尝试。本节描述的技术大多经过反复试验和验证——不仅是我本人，许多网页设计和 SEO 专业人士也验证过。请记住，我排列这些技术的顺序至关重要。从第一个到最后一个，我按照谷歌对它们进行加权的顺序列出。例如，页面标题和其他\
  \ `meta` 标签中的关键词，其排名高于正文或网站文案中的关键词。\n\n### 使用 meta 标签进行优化\n\n如第 2 章和第 7 章所述，您将 `meta`\
  \ 标签放置在 HTML 页面的 `<head>` 部分。除了使用它们来定义 `Content-Type` 和页面的字符集之外，您还可以使用它们来创建关键词和描述，搜索引擎会利用这些信息来索引您的网站。其中最重要的三个是\
  \ `<title>`、`<META NAME=\"keywords\">` 和 `<META NAME=\"description\">`。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 页面标题和描述不仅对搜索引擎如何索引您的网站至关重要，而且谷歌和其他一些网站也会使用这些数据在搜索结果列表中描述您的网站。例如，在图 15-2 中，`<title></title>`\
  \ 之间的数据以及 `<META NAME=\"description\">` 标签中的数据，分别被谷歌用作搜索结果中的网站标题和网站描述。（注意没有按点击付费的列表。没有人争相将我的名字用作关键词——所以我无需付费就能排在列表顶部！）\n\
  \n**图 15-2：** 谷歌使用 `<title>` 和 meta 描述数据作为搜索结果列表中的页面标题和描述。\n\n![9781118026229%20fg1502.eps](img/9781118026229%20fg1502_opt.jpeg)\n\
  \n### 至关重要的页面标题\n\n从技术上讲，`<title>` 并不是一个 `meta` 标签。但它以及本节描述的其他元素对于搜索引擎排名和索引最为关键。为了方便和清晰起见，我将它们归为一组。\n\
  \n除了在浏览器标题栏中命名页面（如第 6 章所述）之外，`<title></title>` 标签之间的数据对 SEO 也至关重要。在不过分夸张的前提下，您应尽可能多地往其中塞入关键词。这实际上是一种平衡：既要让标题在浏览器标题栏中完整显示，又要让标题有意义，同时还要包含关键词。我认为图\
  \ 15-2 中的标题效果不错。（即使是我自己说的。）\n\n另外请记住，如果您为网站中的每个页面设置不同的标题，那么您可以索引到更多数据，并在搜索引擎中获得多个列表。例如，如果您或您的客户提供多种服务，请考虑为每个页面使用不同的页面标题——例如“公司名称–此服务”或“公司名称–彼服务”。对于接下来要讨论的描述也是如此。\n\
  \n![tip.eps](img/tip_opt.jpeg) 有些人倾向于在标题中塞入过多关键词。是的，搜索引擎对标题的权重很高，但它们对其他 `meta` 标签数据的权重也几乎同样高。这些标签更适合用来塞入关键词。\n\
  \n### 页面描述\n\n页面描述之所以重要，除了为搜索引擎提供数据之外，还有多个原因。搜索引擎不仅使用它们来索引关键词并在搜索结果列表中描述页面（如图 15-2\
  \ 所示），而且如果您不使用它们，谷歌和其他一些搜索引擎会使用页面正文中的文本。\n\n描述为您的关键词提供了比标题更多的空间。由于描述的部分或全部会显示在搜索结果列表中（如图\
  \ 15-3 所示），您的描述应该是一个连贯的句子，或者至少是一系列连贯的短语。\n\n页面描述使用带有 `description` 属性的 `meta` 标签，如下所示：\n\
  \n```html\n<META NAME=\"description\" content=\"The California Spine Institute is\
  \ the center for Minimally Invasive Spinal Surgery to help cure back pain, spinal\
  \ stenosis, and many other forms of chronic back pain using the latest techniques\
  \ in MISS including laser spine surgery, endoscopic back and neck surgery, and x\
  \ Stop\" />\n```\n\n![tip.eps](img/tip_opt.jpeg) 您应该对描述多加思考。上面的例子并不差。它包含了大量数据，同时又不至于难以阅读或理解。（它太长，无法完全显示在谷歌的描述字段中，但这并不罕见。）思考一下您想使用的所有关键词，以及您想传达的信息，并将它们优雅地结合起来。例如，假设您的业务只服务于某个特定地理区域。您可以用该信息开头：“服务南加州地区\
  \ 15 年，我们……”。看，仅用几个词就表达了这么多信息？此外，California 和 Southern California 现在也成为了您的搜索词或关键词的一部分。\n\
  \n**图 15-3：** 页面描述的部分或全部会显示在搜索结果列表中以及页面预览缩略图上方。\n\n![9781118026229-fg1503.tif](img/9781118026229-fg1503_opt.jpeg)\n\
  \n### 关键词\n\n与标题和描述不同，`keywords` 元数据在大多数搜索结果页面中不会显示。因此，您不必担心措辞或整个标签是否有意义。而且您可以使用任意数量的关键词。然而，并非所有搜索引擎都会使用全部关键词，因此请将最重要的关键词放在前面。\n\
  \n关键词 `meta` 标签使用 `keywords` 属性，写法如下：\n\n```html\n<META NAME=\"keywords\" content=\"\
  California, spine center, minimally invasive spinal surgery, spine surgery, laser\
  \ spine surgery, x stop, endoscopic back surgery, endoscopic neck surgery\" />\n\
  ```\n\n关键词、标题和描述都不区分大小写，不过出于显而易见的原因（它们会显示在搜索结果列表中），您应在后两者中适当使用大写字母。然而，为了确保最大效果，您还应遵循一些基本的格式和其他原则，例如：\n\
  \n![check.png](img/check.png) 使用逗号分隔每个关键词或短语。\n\n\n\n\n\n![check.png](img/check.png)\
  \ 正确排列术语。使用两个或三个词的短语是可以的，但你应该按照用户通常输入的顺序来排列它们。例如，“technical writer”（技术撰稿员）不应以“writer\
  \ technical”的顺序出现在你的关键词中。富有经验的搜索引擎用户经常使用引号来搜索特定的短语。例如，当他们搜索“web design”（网页设计）时（包括引号），搜索引擎会首先查找，然后按照其字面写法匹配该术语。\n\
  \n![check.png](img/check.png) 使用缩写词和首字母。如果你的网站推广的领域或产品有流行的缩写词和标题，例如代表电视的 TV，或代表\
  \ Web 或互联网的 WWW，请将它们包含在你的关键词中。\n\n![check.png](img/check.png) 使用关键词的变体和替代拼写。如果你是一名动画师（animator），你应该同时使用\
  \ animator 和 animation（动画）。使用关键词的复数形式也没有坏处。有些单词也有替代拼写，而且某些英语国家对单词的拼写方式不同；它们对同一事物通常会使用完全不同的单词。例如，英国人将\
  \ pajamas（睡衣）拼写为 pyjamas。尽管有数百种这样的变体，但你无法全部使用。\n\n![check.png](img/check.png) 在常见的情况下使用缩写。我当然并不主张缩写一切。但对于某些服务和产品，这样做是非常常见的——甚至是首的。例如，用\
  \ Dr. 来代替 doctor（医生）。\n\n# 关键词与网站内容\n\n除了索引和排名你的 `<title>` 和 `<meta>` 标签内容外，Google\
  \ 和其他搜索引擎还会索引并权重实际页面内容，即你的网站访问者阅读的文本（或至少是你希望他们阅读的文本）。这些数据的排名不会像 `meta` 数据那么高——尽管你应该注意到\
  \ Google 和其他搜索引擎会从页面正文中提取并索引关键词——在我看来，你应该平衡这一点。不要为了牺牲整洁、易于阅读的文案。换句话说，不要因为想要使用关键词的渴望而损害页面信息的传递。\n\
  \n此外，请记住关键词的位置非常重要。标题（headings）和副标题（subheads）中的关键词排名高于正文段落中的关键词。此外，不同的搜索引擎标准不同，你不可能满足所有它们的要求——也就是说，如果你想编写出有意义、专业的文案，就无法做到这一点。\n\
  \n## 理解和使用关键词\n\n在完成所有的 SEO 技巧和操作之后，关键词是搜索引擎索引的内容。没有了它们，搜索引擎就没有任何东西可以发现并在搜索结果页面上显示。你最重要的关键词是引导潜在客户进入你网页的因素。关键词产生网络流量。\n\
  \n## Google 如何读取和索引网站\n\nGoogle 的爬虫（spider）或机器人通常被称为 Googlebot。在 Google 服务器获知一个新网站后，通常\
  \ Googlebot 会去寻找该网站的首页。除了读取和索引元数据和页面文本外，Googlebot 还会读取页面上所有的链接。然后它顺着链接（爬取）到那些页面，并读取和索引它们。如果这些页面上有新链接，它会再次通过整个过程，循环往复。\n\
  \n这是 Googlebot 爬取 Web 并收集和索引网站的基本过程。这种方法使 Google 能够包含你网站上的所有页面——只要它们都是一个不连续链接链的一部分。换句话说，如图所示，只要\
  \ Googlebot 能够从首页以某种方式到达每一个页面，所有所有页面都将被索引。\n\n在图中，`index.html` 并没有直接链接到 `map.html`。然而，Googlebot\
  \ 在读取和索引 `contactUs.html` 时会了解到 `map.html` 的存在和位置。爬虫只是不断从一个页面爬取到另一个页面，直到链接耗尽。\n\n\
  ![9781118026229-sb1502-2.eps](img/9781118026229-sb1502-2_opt.jpeg)\n\n在文案中使用关键词时，最重要的两个考虑领域是：\n\
  \n- ![check.png](img/check.png) 位置：关键词所在的位置对于主要的搜索引擎来说具有不同程度的重要性。\n- ![check.png](img/check.png)\
  \ 密度：页面上关键词的数量对所有搜索引擎算法都有影响。在每个页面上选择目标关键词往往是关键——尤其是当使用竞争激烈的关键词时。\n\n![tip.eps](img/tip_opt.jpeg)\
  \ 对网页中使用关键词的简要讨论旨在作为一个概述。关于搜索引擎如何使用关键词的更详细解释，请参阅 Howie Jacobson 写的《Google AdWords\
  \ For Dummies\n\n## 关键词放置\n\n每个主要的搜索引擎对于页面上文案（或正文）中关键词的排名都有不同的标准。例如，Google 似乎并不关心关键词放置在页面的什么位置——顶部、中部还是底部。另一方面，Yahoo!\
  \ 似乎对放置在页面顶部的关键词赋予优先级。所有搜索引擎对标题和副标题中使用关键词的排名都略高于在标准段落中使用相同单词。此外，放置在粗体 `<b></b>`\
  \ 和斜体 `<i></i>` 标签之间的单词排名略高。\n\n此外，特别注意你在 `<image>` 标签的备用（`alt`）属性中放置的文本，这在第 6 章中讨论过。但请记住，大多数搜索引擎只有在图像带有超链接时才会索引和排名\
  \ `alt` 属性中的文本。\n\n换句话说，以下 `image` 标签文本会被索引和排名的：\n\n```html\n<a href=\"index.html\"\
  \ target=\"_self\"><img src=\"images/logo.png\" alt=\"California Spine Institute\"\
  \ width=\"320\" height=\"32\" /></a>\n```\n\n而以下 `image` 标签文本是不会被索引和排名的：\n\n```html\n\
  <img src=\"images/logo.png\" alt=\"California Spine Institute\" width=\"320\" height=\"\
  32\" />\n```\n\n## 关键词密度\n\n每个搜索引擎使用的关键词密度标准不同。某些搜索引擎允许页面上有更高的关键词数量和密度，而像 Google\
  \ 这样的搜索引擎则严格得多。Google 允许每页关键词浓度约为 2%；有些则允许高达 5%。当你超过这些百分比时，某些搜索引擎会视为垃圾信息。\n\n为了获得最大收益，网站的首页和其他页面应该各有略不同的重点。这对于竞争激烈的关键词——在互联网上具有高度集中或存在的产品或服务——尤为重要。例如，web\
  \ design 这个关键词组就是一个竞争激烈的搜索词。\n\n对于不常见的搜索词，你不需要专注于单个关键词。由于针对这些搜索词的网站较少，页面可以使用更多的单词和短语，从而通过不同的关键词组合被发现。\n\
  \n\n\n\n\n`![`tip.eps`](img/tip_opt.jpeg`) 在你为搜索引擎优化了页面后，你可能想知道这些优化的效果如何，对吧？互联网上有许多免费工具。其中一些非常棒且提供的信息很丰富——最棒的是，它们易于使用。位于\
  \ `seoworkers.com/tools/report.html` 上的 SEO 分析工具可以运行完整检查并提供一份包含几条优化建议的免费报告。不过，如果你正在寻找终极分析器，请查看\
  \ Google 网站管理员工具（Webmaster Tools）。你需要一个 Google 账号才能使用它（免费的）。网站管理员工具会分析你的网站，跟踪你的网络流量，并提供各种有用信息，例如哪些关键词为你带来了最多的流量，如图\
  \ 15-4 所示。\n\n**图 15-4:** Google 免费的网站管理员工具是一套用于分析和优化你的搜索引擎流量的应用程序集合。\n\n`![`9781118026229-fg1504.tif`](img/9781118026229-fg1504_opt.jpeg`)`\n\
  \n# 使用站点地图将网站提交到搜索引擎\n\n你可能认为这一节讨论的是许多网站上常见的站点地图，它们提供了特定网站内所有页面的列表和链接。但不是，相反，这是另一种类型的站点地图。这种\
  \ Sitemap 的首字母大写，并且执行的是完全不同的功能。这种 Sitemap 通知 Google 和其他搜索引擎关于你网站的页面信息。它提供了搜索引擎可以用于查找页面以及在搜索结果页上列出页面相关的信息。\n\
  \n创建和使用站点地图超出了本书的范围，但我想让你了解它们。本节中提供的信息主要是为了引起你的兴趣。\n\n## 为什么要用站点地图？\n\n站点地图发挥着许多实用的功能。最重要的是，它们确保搜索引擎知道你网站中的所有页面，或者至少知道站点地图中的所有页面。此外，它们提供了一种列出没有正文内容的绝佳方法，例如数字视频和\
  \ Flash 页面。例如，站点地图视频条目可以指定视频长度（分钟和秒）、主题和观众分级（PG、R 等）。图像条目可以描述图像的主题、类型、许可信息等。图 15-5\
  \ 显示了来自 Google“创建站点地图”页面的站点地图视频条目示例。\n\n**图 15-5:** XML 站点地图文件中视频站点地图条目的示例。\n\n\
  `![`9781118026229-fg1505.tif`](img/9781118026229-fg1505_opt.jpeg`)`\n\n你明白了吗？站点地图还可以包含关于页面的其他有用信息，例如页面创建日期、最后更新日期，以及你预计页面何时以及如何更改。\n\
  \n## 创建你的站点地图\n\nGoogle 接受几种不同格式的站点地图。然而，所有搜索引擎接受的协议都是 XML。我实际上使用一个名为 Zoom Search\
  \ Engine Indexer 的程序；它在分析网站后会自动生成站点地图。我没有尝试从零开始创建一个。在我写这些内容时，如图 15-6 所示的 Zoom Search\
  \ Engine Indexer 可以免费创建多达 99 页的 XML 站点地图。（不，我没有使用免费版。我的很多网站页面远超这个数量。）即便是如此，我经常需要在\
  \ Dreamweaver 或 UltraEdit 中打开 XML 文件并微调一些条目。\n\n我的观点是：除非你有处理 XML 的经验，否则使用某种站点地图生成器可能会更好。不过，如果你想尝试手动方法，Google\
  \ 有一些非常丰富的帮助页面，从其网站管理员中心页面开始，从 `google.com/support/webmasters/` 开始。\n\n**图 15-6:**\
  \ Zoom Search Engine Indexer。\n\n`![`9781118026229-fg1506.eps`](img/9781118026229-fg1506_opt.jpeg`)`\n\
  \n# 第 16 章：构建移动搜索页面\n\n## 本章内容\n\n`![`arrow`](img/arrow.png`) 查找和使用搜索引擎实用软件  \n\
  `![`arrow`](img/arrow.png`) 定义搜索页参数  \n`![`arrow`](img/arrow.png`) 定义结果页参数  \n`![`arrow`](img/arrow.png`)\
  \ 为你的网站创建 Google 自定义搜索  \n`![`arrow`](img/arrow.png`) 为你的网站添加 Google Map API\n\n\
  虽然菜单和超链接是帮助移动用户查找和导航你网站的极佳工具，但在某些时刻，网站会变得过大，包含过多的数据，以至于无法依靠简单的导航和交互机制。此外，简单的单词或几个单词的菜单条目并不总能恰当地描述页面内容。例如，描述激光手术过程的页面可能包含各种菜单条目或超链接文本字符串未涵盖的术语。\n\
  \n可能比其他计算机用户是，移动用户更倾向于匆忙。为他们提供尽可能在你的移动站点上查找信息的方法将使网站更成功，因此更受欢迎。毫无疑问，帮助用户在你的站点上查找信息的有用工具之一是搜索页面，或者是页面上的搜索框。\n\
  \n通常，创建网站搜索功能的方法有：\n\n`![`check.png`](img/check.png`) 使用创建搜索数据库和结果页的工具。有很多工具，例如\
  \ Zoom Search Engine 是免费或便宜的。\n`![`check.png`](img/check.png`) 使用搜索引擎 API（应用程序接口），例如\
  \ Google Search API 或 Yahoo Search API。这些工具允许你根据定义的站点创建 Google 或 Yahoo! 搜索引擎。\n\
  `![`check.png`](img/check.png`) 从零创建自己的搜索引擎，包括创建自己的搜索数据库和结果页。\n\n本章涵盖前两种方法。首先，我向你展示如何根据需求查找并选择合适的搜索引擎工具。然后我向你展示如何使用其中之一（Zoom\
  \ Search Engine）为你的网站创建搜索应用程序。本章还研究了使用 Google Custom Search，这是目前最流行的技术。我向你展示如何注册\
  \ Google API、如何部署它以及如何自定义搜索和结果页。\n\n在我看来，考虑到第三种方法涉及的复杂性和时间，从零创建搜索引擎并不是一种明智的方法。其他现成的、易于部署的选项使得从零创建变得复杂且没有必要。除非你的客户要求定制自己的搜索引擎（我的客户从未这样做），否则我不会浪费精力。此外，这需要大量的编程，远超本书的范围。\n\
  \n### 使你的网站可搜索\n\n索引是指收集网站上的关键词和短语，并将它们保存到于搜索的格式中，如平文本文件、表格或数据库。事实上，这就是 Google 和大多数其他搜索引擎所做的。它们的爬虫和机器人抓取页面并将数据保存在它们服务器上的巨大数据库中。要让你的网站可搜索，你需要进行类似的索引工作，当然规模要小得多。\n\
  \n基本上，无论用户是从搜索引擎（第 15 章描述）搜索你的网站，还是在本地搜索网站的内容，构成网站的数据——元标签、内容、图像 `alt` 标签、PDF 等——都应该被索引。另一种方案——在点击“搜索”时动态搜索并组织单个页面内容的脚本——效率太低且耗时太，除非网站小到不需要搜索功能！相反，搜索引擎脚本应该搜索索引。\n\
  \n\n\n\n\n# 查找与使用搜索引擎工具\n\n将我所讨论的这些产品称为“工具”可能有点不准确。它们实际上就是搜索引擎。但当大多数人听到“搜索引擎”一词时，他们会想到的\
  \ Google 和 Yahoo!。然而，那些在本地对网站进行索引并随后搜索和显示结果的程序（而不是搜索网站本身）也被称为搜索引擎。\n\n如果你搜索“搜索引擎”这个词，你会发现很多在线搜索引擎，甚至还有可以索引和搜索单个网站的在线工具。你必须仔细筛选搜索结果，以找到可以安装在你的\
  \ Web 服务器上的程序，这些程序会索引站点并提供搜索功能。目前有几款工具可供选择，它们的功能各不相同。其中许多工具运行在有限的几个 Web 服务器平台上。例如，`PerlFect`\
  \ 是一个仅运行在 Unix、Linux 和 `Windows NT` 上的免费搜索引擎，这排除了许多其他可能性。其他工具，如 `Zoom Search Engine`，声称是免费的，但免费版缺少了许多重要的搜索准则，例如索引\
  \ PDF 和其他重要文件格式的能力。\n\n确保你选择的搜索引擎支持并能满足你的需求。在接下来的几页中，我将带你了解最重要的功能以及它们为何值得考虑。\n\n\
  ## 选择你的搜索引擎\n\n几年前，当我开始在我一些较大的网站上加入搜索引擎时，我花费了大量时间进行寻找。是的，在找到符合我需求的工具之前，我确实踩过几次青蛙。我从那次经历中学到，并不是所有的搜索引擎都是平等的。要找到一个价格合理、易于使用并且具有足够的灵活性让我控制搜索处理方式（搜索什么以及如何显示结果）的搜索引擎，对于在合理时间内创建出非常有用的搜索引擎至关重要。这在为移动站点定义搜索应用时尤为重要。效率是关键。\n\
  \n考虑到这些标准，在审视搜索引擎这一相当庞大的领域时，有以下六点需要考虑：\n\n- ![check.png](img/check.png) **成本**：考虑到你可以免费为你的站点设置\
  \ `Google` 或 `Yahoo!` 搜索（如果你的站点代表一家小企业，费用也可以非常便宜），那么为搜索工具工具花费大量资金是没有意义的。有些工具限制了你可以搜索的页面数量、搜索内容，甚至允许的搜索次数。请确保“免费”并不意味着为了获得你所需的内容而支付高昂的升级费用。此外，还要确保购买许可不会限制你只能在一个网站上使用软件。许多产品允许你随意使用该软件，这可以为你节省大量的费用。\n\
  \n- ![check.png](img/check.png) **索引的文档类型**：另一个重要的考虑因素是你可以索引什么类型的文档。某些搜索引擎（尤其是免费和共享软件解决方案）只索引基于\
  \ HTML 和 HTM 的文档。确保你选择的软件索引了你网站上使用的所有类型文档，包括 PDF、`SWFs` (Flash)、`XML`、`PHP`、`DOC`\
  \ (Microsoft Word) 等。同样重要的是软件提供了一种简单的方法来排除目录和文档的索引。\n\n- ![check.png](img/check.png)\
  \ **易用性**：在购买之前，查看你你选择的软件文档。某些软件需要编写脚本并设置 `SQL` 或 `MySQL` 数据库，这会大大增加学习曲线。例如，我选择\
  \ `Zoom Search Engine` 的几个原因之一是它可以作为 `Dreamweaver` 扩展程序安装，并在 `Dreamweaver` 内部用于索引站点和部署搜索引擎。它还会创建自己的数据库。此外，它还允许我在工作站上索引站点，然后上传搜索应用和数据库文件。我觉得这一切都非常方便。\n\
  \n- ![check.png](img/check.png) **平台**：确保搜索引擎软件运行在你网站托管的 Web 服务器上。例如，如果站点的搜索和结果页面需要\
  \ `PHP`，请确保你的服务器支持 `PHP`。只要可能，除非你预计只有来自新款手机和平板的流量，否则请使用支持服务器端代码的程序。这增加了可以使用搜索引擎的设备数量。此外，使用支持服务器端代码的程序意味着访问你网站的移动设备不需要完成所有工作。让服务器处理应用代码要快得多且高效得多，特别是这种类型的应用可能拥有几千行代码！第\
  \ 6 章提供了关于服务器端脚本与客户端脚本优势的额外信息。\n\n- ![check.png](img/check.png) **支持**：确保你理解程序的支持条款。某些免费和共享软件只提供电子邮件或\
  \ `FAQ` 和博客支持。这没关系，但请看一眼 `FAQ` 或博客支持页面，注意软件发行商的支持人员响应支持问题需要多久。如果应用提供了文档，请确保你理解了它。花几分钟看看该程序的设置和使用有多困难。创建并部署搜索应用需要多长时间？\n\
  \n- ![check.png](img/check.png) **可定制**：你选择的软件应该允许你通过多种方式自定义搜索应用。它应该是容易的，例如更改搜索和结果页的外观；你不希望你的搜索页面看起来格格不入。它们看起来应该像是同一个网站的一部分。你应该能够通过多种方式修改被索引的内容，例如通过文档类型或目录，并且你应该能够排除特定的单词和短语。此外，能够应用权重或偏好，对你正在索引的文档特定部分进行处理也非常方便。例如，你可能希望给页面标题比正文更高的权重。关于搜索引擎权重的更多信息，请参阅第\
  \ 15 章。\n\n## 创建搜索应用\n\n你可能认为索引和搜索网站只需简单这样做，对吗？在大多数网站上，通常会有你不希望索引的数据，甚至是整个页面。你经常希望某个页面的数据在结果列表中比另一个页面的数据靠前。而且，你会希望搜索和结果页面与你网站上的其他页面尽可能一致。对于一个一直在浏览（例如）黑背景白字页的用户来说，突然来到白背景黑字页面将是非常突兀的！\n\
  \n在本节中，我将向你展示如何使用 `Zoom Search Engine` 提供的功能创建一个搜索应用——并不是因为我认为你应该使用这个应用，而是因为为我提供了一个背景，用来描述在你的站点上设置搜索功能时。很少有搜索引擎工具提供像\
  \ `Zoom Search Engine` 这样多的功能。`Zoom Search Engine` 程序多功能且可定制，并提供了创建非常有用的搜索引擎所需的所有功能。\n\
  \n我也喜欢 `Zoom Search Engine` 的其他几个原因。它很便宜。`99` 美元的 `Professional` 版本可以索引最多 200,000\
  \ 个页面，包含 500,000 个唯一的关键词和短语。它还支持 `PHP`、`JavaScript`、`ASP`、`ASP.NET` 和 `CGI` 搜索和结果页面。除了\
  \ HTML 和 HTM 页面外，它还可以索引几乎其他类型的文档，包括 PDF、`DOC` (Microsoft Word)、PowerPoint 以及许多其他格式。可以根据各种标准排除文档和目录。\n\
  \n\n\n\n\n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 我喜欢 Zoom Search Engine\
  \ 的另一个原因是它能让我创建站点地图（Sitemaps）提交给 Google 以及其他搜索引擎。关于站点地图的讨论，请参见第 15 章。\n\n你可以选择任何你解决方案。然而，无论你选择哪种程序，本节讨论的概念对于你的搜索应用的成功至关重要。图\
  \ 16-1 显示了我使用此工具创建的搜索页和结果页示例。\n\n**图 16-1:** 使用搜索引擎工具创建的 PHP 移动搜索引擎示例。\n\n![9781118026229-fg1601.eps](img/9781118026229-fg1601_opt.jpeg)\n\
  \n### 选择搜索引擎脚本语言\n\n你需要为搜索引擎选择一种编程语言，选择取决于网站托管的服务器。虽然许多应用程序允许你选择 `JavaScript` 作为搜索引擎脚本语言，但除非你正在设计一个仅运行在最新移动手机和平板电脑上的搜索引擎，否则你应该选择其他格式。正如第\
  \ 3、13 和 14 章所述，`JavaScript` 是一种客户端脚本语言，无法在某些移动设备上运行。而且，并不是所有的移动设备都支持所有的 `JavaScript`\
  \ 命令和函数。\n\n`CGI`、`Perl` 和 `PHP` 是最常见的服务端语言。你可以使用其中任何一种。然而，在这三者中，`PHP` 最快、最常用且最广泛。此外，大多数\
  \ `PHP` 代码包含在搜索和结果页本身中，因此你不需要上传和跟踪单独的脚本文件目录。`ASP` 和 `ASP.NET` 也是服务端语言。它们主要运行在基于\
  \ Windows 的 Web 服务器上。如果你的网站托管在 Windows 服务器上，这两种语言都非常强大。在两者中，`ASP.NET` 最新且最精简。\n\n\
  ![technicalstuff.eps](img/technicalstuff_opt.jpeg) 不使用 `JavaScript` 编写代码的另一个原因是移动设备——更具体地说是移动浏览器——必须解释并处理代码。服务器处理这些内容比普通移动设备快得多。与许多\
  \ `JavaScript` 应用不同，搜索引擎需要大量的代码，因此速度非常重要。\n\n### 决定索引哪些内容\n\n使用像 Zoom Search Engine\
  \ 这样开发良好的搜索引擎工具，方便之处之一是它可以让你选择要索引的文件，而不需要你编写大量耗时的代码。程序会为你编写代码。例如，在图 16-2 中，Zoom\
  \ Search Engine 仅索引 `Scan Extensions` 列表中指定的文件，以及仅在 `Indexing Options` 对话框中显示的页面元素。\n\
  \n![tip.eps](img/tip_opt.jpeg) 使用搜索引擎工具的另一个原因是，扫描和索引非 HTML 页面（如 `Flash SWFs` 和 `Acrobat\
  \ PDFs`）所需的代码要求非常高。一个良好的工具会为你创建这些代码。我不喜欢反复强调这些的，但从零开始为你的网站创建一个良好的搜索引擎需要大量的编程造诣。\n\
  \n决定索引哪些内容包含两个部分：索引哪个 URL 或多个 URL，以及索引哪些文件。在大多数情况下，你只索引一个 URL，即你为创建搜索引擎的网站地址。然而，许多工具允许你索引和搜索多个\
  \ URL，你可以使用此内置选项来索引子域名，例如 `mobile.mysite.com`。\n\n**图 16-2:** 搜索引擎工具允许你轻松地指定要扫描的文件，而无需研究如何编写代码。\n\
  \n![9781118026229-fg1602.eps](img/9781118026229-fg1602_opt.jpeg)\n\n### 决定不索引哪些内容\n\
  \n如果你的网站中有部分你不想被索引和搜索，良好的工具程序将让你通过几种不同的方式排除它们。除了根据页面和文件名排除内容外，例如 Zoom Search Engine\
  \ 还允许你从索引中排除特定的词汇。如果你不希望特定内容出现在搜索中，这是是理想的。一个排除最小字母数量单词的选项也很有。\n\n### 设计搜索页和结果页\n\
  \n设计搜索页和结果页包含两个阶段：修改页面的行为和修改它们的外观。行为通过代码（创建搜索引擎应用的 `PHP` 或或其他脚本语言）控制；外观则通过 `HTML`\
  \ 和 `CSS` 控制。搜索页上的行为考虑包括允许哪些类型的搜索，例如布尔算符或通配符；是否允许用户额外的选项，例如匹配搜索术语中的任何单词，或要求匹配搜索字段中输入的所有单词；搜索结果列表中出现项目数量等。\n\
  \n图 16-3 中的搜索页展示了许多旨在让用户搜索更成功的选项示例。Zoom Search Engine 对话框为你提供了一个值得考虑的选项良好示例，并让你了解，如果你尝试自己编写搜索应用，实现这一切的脚本将有多复杂。\n\
  \n**图 16-3:** 具有多个搜索选项的搜索页示例，以及用于创建这些选项的搜索引擎工具对话框。\n\n![9781118026229-fg1603.eps](img/9781118026229-fg1603_opt.jpeg)\n\
  \n![technicalstuff.eps](img/technicalstuff_opt.jpeg) 不同的搜索引擎具有控制搜索和结果页外观的方法。我喜欢\
  \ Zoom Search Engine 方法是因为你可以在模板中编辑 `HTML` 和 `CSS`。通过这种方法，你永远不需要实际编辑页面本身。\n\n设计结果页需要决定在页面和列表中显示什么。例如，你是否应该在结果列表中包含搜索结果数量、页面标题和元描述？你是否希望显示匹配项、搜索相关性评分、列表页面的创建日期、页面\
  \ `URL` 等等？图 16-4 显示了结果项目的对话框，以及所选项目在列表中的显示示例。\n\n![图 16-4:** 设计结果页时，你控制在页面和搜索列表中显示的内容。![9781118026229-fg1604.eps](img/9781118026229-fg1604_opt.jpeg)\n\
  \n### 权重（Weightings）\n\n权重是搜索引擎术语中的优先级或评分。（关于权重更多信息请参见第 15 章。）当你对页面元素或部分（如页面标题、元描述等）应用权重时，你是在告诉搜索引擎：这些元素中的关键词高于其他元素中的相同关键词。给页面标题中的关键词比页面正文中的关键词更高的评分是有不是吗？图\
  \ 16-5 显示了对各种页面元素应用权重的对话框。请注意对话框右侧的部分允许你根据单词在页面上的位置应用权重。靠近顶部的关键词可以比靠近底部的关键词权重更高。\n\
  \n**图 16-5:** 对特定页面元素应用权重，以便在该元素中索引的关键词优于其他元素中的关键词。\n\n![9781118026229-fg1605.eps](img/9781118026229-fg1605_opt.jpeg)\n\
  \n推荐、同义词、自定义元字段以及更多\n\n\n\n\n\n信你不信，有一整堆搜索引擎功能并未列在本节中——所有这些设计都是为了给你的用户提供更好的搜索体验。在考虑搜索引擎工具时，还有几个值得关注的选项：\n\
  \n![check.png](img/check.png) **推荐**：除了对关键词进行评分外，你还可以在搜索结果中推荐它们。换句话说，当用户搜索特定关键词时，你的搜索结果页面可以列出你希望他们首先查看的页面——甚至将它们作为“推荐”提出。\n\
  \n![check.png](img/check.png) **同义词**：这种功能是不言自明的，不是吗？创建同义词匹配允许你更进一步地控制显示结果。\n\n\
  ![check.png](img/check.png) **自定义元字段**：我发现一个非常有用的功能是创建自定义元标记（meta tags）来控制搜索结果。此选项提供了影响哪些页面在搜索结果中优先列出的另一种方法。\n\
  \n# 为你的网站部署 Google 搜索\n\n你可能在想，为什么要在你的网站上使用 Google 搜索。这难道不会为互联网上的其他网站提供搜索结果，并将你的用户引离开你的网站吗？答案是，如果你不想，它就不会。Google、Yahoo!、Bing\
  \ 以及其他主流搜索引擎都提供了 API 和服务（通常是免费的），让你能够使用它们的搜索引擎仅搜索你的网站。\n\nGoogle 有两个用于设置网站搜索的工具。你应该选择哪一个取决于你的需求。产品都需要\
  \ Google 账号，你可以免费注册。这两个工具是：\n\n![check.png](img/check.png) **Google 标准版 (Standard\
  \ Edition)**：标准版是免费的，但除非你的网站属于非营利组织、大学或政府机构，否则你必须允许 Google 在结果页面投放广告。一些网站管理员并不介意这一点。这是在网站上获取搜索引擎的一种免费且简单的方法。如果访客真的点击广告，此选项还可以通过\
  \ Google 的 AdSense 程序赚点钱。\n\n![check.png](img/check.png) **Google 站点搜索 (Google Site\
  \ Search)**：Google Site Search 是 Google 的业务搜索解决方案。在我撰写这段文字时，Site Search 每年 100 美元起，支持最多\
  \ 20,000 次搜索。考虑到平均每月有 1,667 次搜索，这并不差。如果你有这么多搜索量，你的网站将获得可观的流量，尤其是对于移动端网站。（并不是所有访客都会搜索网站。）然而，设计得越好，需要的搜索次数就越少。下一级别\
  \ 50,000 次搜索每年运行 250 美元。如果网站的流量足够每月获得超过 4,000 次搜索，那么你或你的客户都不应该介意每月支付低于 25 美元的搜索引擎费用，特别是当网站产生收入时！\n\
  \n## 注册 Google 搜索引擎\n\n如果你还没有使用 Google 产品（如 Gmail 或 YouTube），你可以在 `google.com` 注册免费账号。创建账号后，即可开始创建\
  \ Google 搜索引擎的流程，地址为 [`www.google.com/intl/en/options/](http://www.google.com/intl/en/options/)（该页面显示如图\
  \ 16-6 所示）。\n\n只需选择左列中的 `自定义搜索 (Custom Search)` 选项。\n\n点击 `Custom Search` 链接打开 Google\
  \ 自定义搜索页面，如图 16-7 所示。点击页面右上部分的 `创建自定义搜索引擎 (Create a Custom Search Engine)` 按钮进入流程的下一个阶段，在那个阶段，你可以阅读有关该搜索引擎产品的优点和功能。\n\
