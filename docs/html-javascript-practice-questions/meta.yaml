    \n---\n\n# HTML 与 JavaScript 练习题\n\n作者：Dheeraj Singh\n\n---\n\n## 关于本书\n\n本书是一套完整的\
    \ HTML 和 JavaScript 编程示例集。这些示例经过充分测试，基于计算机科学硕士生的教学大纲。\n\n---\n\n## 关于作者\n\nDheeraj\
    \ Singh 是一位热情的学生和教师，热爱计算机以及 HTML、JavaScript、C、C++ 和 Java 等编程语言。他拥有经济学硕士学位。尽管获得了经济学学位，但他总是被发现围绕着计算机。他目前在网络上开设自己的编程语言教程。他在20岁的早期就写了这本书。Dheeraj\
    \ 写这本书的主要目的是帮助愿意开始学习 HTML 和 JavaScript 编程的学生澄清那些小而必要的疑问。\n\n---\n\n## 内容目录\n\n\
    | 序号 | 程序名称 |\n|---|---|\n| | **HTML** |\n| 1. | 编写程序实现 marquee 标签及其属性。 |\n| 2.\
    \ | 编写程序使用 HTML 显示班级时间表。 |\n| 3. | 编写程序使用 html 实现表单。 |\n| 4. | 编写程序实现 `<img>`\
    \ 及其属性。 |\n| 5. | 编写程序使用 html 实现下标和上标。 |\n| 6. | 编写程序实现框架。 |\n| 7. | 编写程序使用 html\
    \ 实现 svg。 |\n| 8. | 编写程序实现内联 css。 |\n| 9. | 编写程序实现内部 css。 |\n| 10. | 编写程序实现外部\
    \ css。 |\n| | **JAVA SCRIPT** |\n| 11. | 编写程序显示 alert ()、prompt () 和 confirm ()。\
    \ |\n| 12. | 编写程序使用递归函数显示阶乘数。 |\n| 13. | 编写程序使用函数求给定数字的立方。 |\n| 14. | 编写程序使用函数将摄氏温度转换为华氏温度。\
    \ |\n| 15. | 编写一个 JavaScript 程序，接受两个整数并使用 if () 和 else if () 显示较大者。 |\n| 16. |\
    \ 编写程序使用 for 循环找出 3 位数的阿姆斯特朗数。 |\n| 17. | 编写一个 JavaScript 程序，使用嵌套 for 循环构造以下模式。\
    \ |\n| 18. | 编写一个 JavaScript 程序，使用 while 循环计算两个正整数的最大公约数 (GCD)。 |\n| 19. | 编写一个\
    \ JavaScript 函数，使用 switch () 将十进制数转换为二进制、十六进制或八进制数。 |\n| 20. | 编写一个 JavaScript\
    \ 程序，找出数组中出现最频繁的项。 |\n| 21. | 编写一个 JavaScript 函数，获取某个月份的天数。 |\n| 22. | 编写一个 JavaScript\
    \ 函数，向 Date 对象添加指定的分钟数。 |\n| 23. | 编写程序显示键盘的功能。 |\n| 24. | 编写程序使用 which 属性显示鼠标事件。\
    \ |\n| 25. | 编写程序显示 load 和 unload 事件。 |\n| 26. | 编写程序接收用户的真实数据并将其存储在 cookie 中。\
    \ |\n| 27. | 编写程序从 cookie 中检索值。 |\n| 28. | 编写程序检查表单验证。 |\n| 29. | 编写程序显示数字时钟。\
    \ |\n| 30. | 编写程序实现任意两种字符串方法。 |\n| 31. | 编写程序检查数字是偶数还是奇数。 |\n\n---\n\n## 1. 编写程序实现\
    \ marquee 标签及其属性。\n\n```html\n<HTML>\n\n    <HEAD>\n\n        <TITLE>Marquee 标签示例！！！</TITLE>\n\
    \n    </HEAD>\n\n    <BODY> <font color=\"blue\"><marquee\n    width=\"100%\"\
    \ height=\"15%\" behavior=\"slide\"\n    direction=\"right\" scrolldelay=10 scrollamount=8\n\
    \    loop=20>\n\n        <h1>Marquee 标签示例 ---></h1>\n\n    </marquee>\n\n    <marquee\
    \ behavior=\"scroll\" direction=\"left\">\n\n        <h1><--- 向左移动 </h1>\n\n \
    \   </marquee> </font>\n\n    <marquee behavior=\"alternate\">\n\n        <h1><----交替行为---></h1>\n\
    \n    </marquee>\n\n</BODY> </HTML>\n```\n\n---\n\n### 代码输出\n\n---\n\n## 2. 编写程序使用\
    \ HTML 显示班级时间表。\n\n```html\n<HTML>\n  <HEAD>\n    <TITLE>班级时间表</TITLE>\n  </HEAD>\n\
    \  <BODY>\n    <H2 align=\"center\">理学硕士 第<SUP>2</SUP>学期 </H2>\n    <BR>\n   \
    \ <H4 align=\"center\">班级时间表</H4>\n    <TABLE border=1 align=\"center\">\n   \
    \   <tr>\n        <th>日期</th>\n        <th>12:00-2:00</th>\n        <th>2:00-2:45</th>\n\
    \        <th>2:45-3:15</th>\n        <th>3:15-4:30</th>\n        <th>4:30-5:00</th>\n\
    \      </tr>\n      <tr>\n        <td>星期一</td>\n        <td>面向对象编程实验(批次 I)</td>\n\
    \        <td>计算理论</td>\n        <td>操作系统原理</td>\n        <td>Web 技术</td>\n   \
    \     <td>数据挖掘</td>\n      </tr>\n      <tr>\n        <td>星期二</td>\n        <td>面向对象编程实验(批次\
    \ II)</td>\n        <td>计算理论</td>\n        <td>面向对象编程</td>\n        <td>Web 技术</td>\n\
    \        <td>数据挖掘</td>\n      </tr>\n      <tr>\n        <td>星期三</td>\n      \
    \  <td>Web 技术实验(批次 I)</td>\n        <td>操作系统原理</td>\n        <td>面向对象编程</td>\n\
    \        <td>Web 技术</td>\n        <td>数据挖掘</td>\n      </tr>\n      <tr>\n   \
    \     <td>星期四</td>\n        <td>-</td>\n        <td>操作系统原理</td>\n        <td>面向对象编程</td>\n\
    \        <td>计算理论</td>\n        <td>数据挖掘</td>\n      </tr>\n      <tr>\n     \
    \   <td>星期五</td>\n        <td>Web 技术实验(批次 II)</td>\n        <td>操作系统原理</td>\n\
    \        <td>面向对象编程</td>\n        <td>计算理论</td>\n        <td>Web 技术</td>\n   \
    \   </tr>\n    </TABLE>\n  </BODY>\n</HTML>\n```\n\n### 代码输出\n\n| 日期 | 11:00-12:00\
