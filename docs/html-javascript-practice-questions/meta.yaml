    \ or about the reliability, accuracy or sufficiency of the information contained\
    \ in this book.\n\n---\n\n# HTML & JavaScript Practice Questions\n\nBy Dheeraj\
    \ Singh\n\n---\n\n## About the Book\n\nThe book is a complete set of HTML and\
    \ JavaScript Programming Examples. The examples are well tested and based on the\
    \ syllabus of Masters Degree of Computer Science Students.\n\n---\n\n## About\
    \ the Author\n\nDheeraj Singh, an enthusiastic student and teacher, loves computers\
    \ and programming languages like HTML, JavaScript, C, C++ and Java. He is having\
    \ the post graduation degree on Economics. Despite of getting a degree in Economics,\
    \ he is always found surrounded by computers. He is currently running his own\
    \ tutorials on Programming Languages online. He has written this book at an early\
    \ age of 20. The main aim of Dheeraj to write this book is to clear the small\
    \ and necessary doubts of students willing to start programming in HTML and JavaScript.\n\
    \n---\n\n## Content List\n\n| S.N. | Program Name |\n|---|---|\n| | **HTML** |\n\
    | 1. | Write a program to implement marquee tag with its attributes. |\n| 2. |\
    \ Write a program to display class time table using HTML. |\n| 3. | Write a program\
    \ to implement form using html. |\n| 4. | Write a program to implement `<img>`\
    \ with its attributes. |\n| 5. | Write a program to implement subscript and superscript\
    \ using html. |\n| 6. | Write a program to implement frames. |\n| 7. | Write a\
    \ program to implement svg with html. |\n| 8. | Write a program to implement inline\
    \ css. |\n| 9. | Write a program to implement internal css. |\n| 10. | Write a\
    \ program to implement external css. |\n| | **JAVA SCRIPT** |\n| 11. | Write a\
    \ program to show alert (), prompt () and confirm (). |\n| 12. | Write a program\
    \ to display factorial number using recursive function. |\n| 13. | Write a program\
    \ to find cube of the given number using function. |\n| 14. | Write a program\
    \ to convert Celsius to Fahrenheit using function. |\n| 15. | Write a JavaScript\
    \ program that accept two integers and display the larger using if () and else\
    \ if (). |\n| 16. | Write a program to find Armstrong number of 3 digits using\
    \ for loop. |\n| 17. | Write a JavaScript program to construct the following pattern,\
    \ using a nested for loop. |\n| 18. | Write a JavaScript program to compute the\
    \ greatest common divisor (GCD) of two positive integers using while loop. |\n\
    | 19. | Write a JavaScript function to convert a decimal number to binary, hexadecimal\
    \ or octal number using switch (). |\n| 20. | Write a JavaScript program to find\
    \ the most frequent item of an array. |\n| 21. | Write a JavaScript function to\
    \ get the number of days in a month. |\n| 22. | Write a JavaScript function to\
    \ add specified minutes to a Date object. |\n| 23. | Write a program to display\
    \ function of keyboard. |\n| 24. | Write a program to display mouse event using\
    \ which property. |\n| 25. | Write a program to display load and unload event.\
    \ |\n| 26. | Write a program Receive real data from the user and store it in a\
    \ cookie. |\n| 27. | Write a program to Retrieves values from cookie. |\n| 28.\
    \ | Write a program to check form validation. |\n| 29. | Write a program to display\
    \ digital clock. |\n| 30. | Write a program to implement any two string method.\
    \ |\n| 31. | Write a program to check whether number is even or odd. |\n\n---\n\
    \n## 1. Write a program to implement marquee tag with its attributes.\n\n```html\n\
    <HTML>\n\n    <HEAD>\n\n        <TITLE>Marquee Tag Example!!!</TITLE>\n\n    </HEAD>\n\
    \n    <BODY> <font color=\"blue\"><marquee\n    width=\"100%\" height=\"15%\"\
    \ behavior=\"slide\"\n    direction=\"right\" scrolldelay=10 scrollamount=8\n\
    \    loop=20>\n\n        <h1>An Example of Marquee Tag ---></h1>\n\n    </marquee>\n\
    \n    <marquee behavior=\"scroll\" direction=\"left\">\n\n        <h1><--- Moving\
    \ in Left Direction </h1>\n\n    </marquee> </font>\n\n    <marquee behavior=\"\
    alternate\">\n\n        <h1><----Alternate Behavior---></h1>\n\n    </marquee>\n\
    \n</BODY> </HTML>\n```\n\n---\n\n### Coding Output\n\n---\n\n## 2. Write a program\
    \ to display class time table using HTML.\n\n```html\n<HTML>\n  <HEAD>\n    <TITLE>CLASS\
    \ TIME TABLE</TITLE>\n  </HEAD>\n  <BODY>\n    <H2 align=\"center\">MSc 2<SUP>nd</SUP>\
    \ SEMESTER </H2>\n    <BR>\n    <H4 align=\"center\">Class Time Table</H4>\n \
    \   <TABLE border=1 align=\"center\">\n      <tr>\n        <th>DAY</th>\n    \
    \    <th>12:00-2:00</th>\n        <th>2:00-2:45</th>\n        <th>2:45-3:15</th>\n\
    \        <th>3:15-4:30</th>\n        <th>4:30-5:00</th>\n      </tr>\n      <tr>\n\
    \        <td>MONDAY</td>\n        <td>OOPs LAB(batch I)</td>\n        <td>TOC</td>\n\
    \        <td>POS</td>\n        <td>WT</td>\n        <td>DM</td>\n      </tr>\n\
    \      <tr>\n        <td>TUESDAY</td>\n        <td>OOPs LAB(batch II)</td>\n \
    \       <td>TOC</td>\n        <td>OOP</td>\n        <td>WT</td>\n        <td>DM</td>\n\
    \      </tr>\n      <tr>\n        <td>WEDNESDAY</td>\n        <td>WT LAB(batch\
    \ I)</td>\n        <td>POS</td>\n        <td>OOP</td>\n        <td>WT</td>\n \
    \       <td>DM</td>\n      </tr>\n      <tr>\n        <td>THURSDAY</td>\n    \
    \    <td>-</td>\n        <td>POS</td>\n        <td>OOP</td>\n        <td>TOC</td>\n\
    \        <td>DM</td>\n      </tr>\n      <tr>\n        <td>FRIDAY</td>\n     \
    \   <td>WT LAB(batch II)</td>\n        <td>POS</td>\n        <td>OOP</td>\n  \
    \      <td>TOC</td>\n        <td>WT</td>\n      </tr>\n    </TABLE>\n  </BODY>\n\
    </HTML>\n```\n\n### Coding Output\n\n| DAY | 11:00-12:00 | 12:00-1:00 | 1:00-2:00\
    \ | 2:00-3:30 | 3:30-4:00 | 4:00-5:00 | 5:00-6:00 |\n|---|---|---|---|---|---|---|---|\n\
    | MONDAY | DATA | LAB(Batch 1) | TIC | TIC | TIC | TIC | - |\n| TUESDAY | DATA\
    \ | LAB(Batch 2) | TIC | TIC | TIC | TIC | - |\n| WEDNESDAY | DATA | LAB(Batch\
    \ 3) | TIC | TIC | TIC | TIC | - |\n| THURSDAY | DATA | LAB(Batch 4) | TIC | TIC\
    \ | TIC | TIC | - |\n| FRIDAY | DATA | LAB(Batch 5) | TIC | TIC | TIC | TIC |\
    \ - |\n\n---\n\n## 3. Write a program to implement a form using HTML.\n\n```html\n\
    <HTML>\n\n  <HEAD>\n\n    <TITLE>FORM EXAMPLE</TITLE>\n\n  </HEAD>\n\n  <BODY>\n\
    \n    <FORM>\n\n      <H2 align=\"center\">Employee Data</H2>\n\n      <center>\n\
    \n        EMPLOYEE NAME :\n\n        <input type=\"text\" name=\"sname\">\n\n\
    \        <br><br>\n\n        FATHER'S NAME :\n\n        <input type=\"text\" name=\"\
    fname\">\n\n        <br><br>\n\n        GENDER :\n```"
