    \ 练习题\n\n## 18. 编写一个JavaScript程序，使用while循环计算两个正整数的最大公约数（GCD）。\n\n```\n<HTML>\n\
    \  <HEAD>\n    <TITLE>Pattern</TITLE>\n    <script>\n      function gcd()\n  \
    \    {\n        var x = document.getElementById(\"x\").value;\n        var y =\
    \ document.getElementById(\"y\").value;\n        var hcf=1;\n        if(x<y)\n\
    \        {\n          var t = x;\n          x = y;\n          y = t;\n       \
    \ }\n        while(hcf!=0)\n        {\n          hcf = x%y;\n          x = y;\n\
    \          y = hcf;\n        }\n        document.getElementById(\"result\").innerHTML\
    \ = \"GCD = \"+x;\n      }\n    </script>\n  </HEAD>\n\n  <BODY>\n    <h2>\n \
    \     输入两个数字：\n      <input type=\"text\" id=\"x\">\n      <input type=\"text\"\
