    |---|---|---|---|---|---|---|---|\n| 星期一 | 数据 | 实验(批次 1) | 计算机信息系统 | 计算机信息系统 |\
    \ 计算机信息系统 | 计算机信息系统 | - |\n| 星期二 | 数据 | 实验(批次 2) | 计算机信息系统 | 计算机信息系统 | 计算机信息系统\
    \ | 计算机信息系统 | - |\n| 星期三 | 数据 | 实验(批次 3) | 计算机信息系统 | 计算机信息系统 | 计算机信息系统 | 计算机信息系统\
