    ## Subprograms


    ### 4. Subprograms

    As covered above, computer programs are generally executed in order, from the
    start point to the end point. This is called the “path of execution.”


    The main series of instructions in a program is called the `main program`.


    It is sometimes valuable to create another program that can be used by the main
    program as needed. This is called a subprogram. It is no different from any other
    program—it is made up of the same elements (entrance point, variables, control
    & branching statements, and exit point). However, a subprogram isn''t used all
    by itself. Instead, the main program can execute the subprogram as needed. Here,
    the main program stops executing, and the subprogram starts executing. When the
    subprogram is done executing, the main program continues on where it left off.


    This is called "calling" the subprogram—that is, the main program calls the subprogram,
    the subprogram starts and stops, and the main program continues on where it left
    off before calling the subprogram.


    This is useful in creating programs because the computer programmer doesn''t have
    to enter the instructions of the subprogram over and over; you only type them
    in once, and then when you need that subprogram to be called by the main program,
    you only have to type in one instruction—the instruction to call the subprogram.
    This lets you reuse the instructions you entered in for the subprogram rather
    than rewriting them.


    ### 5. Exit

    Every program must have an instruction that tells the computer that the program
    is no longer running. Much like the Entrance, the exact instruction for this varies
    based on the computer language used, but all computer languages will have this
    type of instruction.


    You will have learned these five elements well by the time you’re through with
    this book.


    ## SECTION FOUR


    ### JAVASCRIPT

    JavaScript is a great language to use for an introduction to programming. So,
    what is JavaScript? Well, if you look it up online, the definition might say,
    “JavaScript is a high-level, untyped, and interpreted runtime language.”


    Right off the bat, that explanation shows why we made this book. The average person
    reading that definition doesn’t understand what is being said there. So, let’s
    dissect the definition—here are several terms you need to understand before fully
    comprehending what JavaScript is:


    - **Compiler**: A special computer program that is used to convert other computer
    programs to a form that the computer can actually use. When a computer programmer
    makes computer programs, the programs are usually written in a form that looks
    almost like English. For example, it might look like: `if age > 18, print “You
    are an adult”` (`>` in this case means “greater than”). Computers can’t understand
    language like that—the actual instructions that a computer can use are composed
    of unique patterns of the numbers 0 and 1. The code above would have to be changed
    into a form that the computer does understand. A compiler is a special program
    that converts the code that looks nearly English (high-level language) into a
    form that the computer can understand and operate off of. The product of a compiler
    would be a set of instructions understandable to the computer that the computer
    would execute. This would make the computer do what the “nearly English” code
    described. This collection of compiled code is called an “executable” because
    the computer can actually execute the instructions contained in it.


    **EXAMPLE**: You type this instruction into a computer program:

    ```

    if age > 18, print “You are an adult”

    ```

    A compiler would take what you wrote, change it into a form the computer can understand
    and then relay that command to the computer so it can be executed.


    One important aspect of how a compiler works is that it takes all of the instructions
    in the program and turns them all into language the computer can understand before
    actually executing the program. There are other methods of converting high-level
    languages to computer-readable form that don''t involve converting the entire
    program before it is executed; instead, each instruction is converted and executed
    one at a time. This is not how a compiler works.


    - **Interpreter**: An interpreter is a special program that converts high-level
    (similar to English) language instructions into low-level language (designed to
    be easy for a computer to execute) instructions. An interpreter converts code
    in this way one instruction at a time rather than converting the entire set of
    instructions in the program prior to execution. In other words, the interpreter
    will read an instruction, convert it to the language the computer can understand,
    have the computer execute that instruction, then go on to the next instruction
    in the program and repeat.


    **EXAMPLE**: Interpreted computer languages use interpreters.


    - **Runtime**: Computer programs are almost always written using one of many available
    high-level languages. Once the computer program is complete, it needs to be compiled
    in order for the instructions to actually be performed on the computer.


    There are two different approaches to running a program. In the first approach,
    the entire program is compiled. The program, now in machine language, is run by
    the computer at that point. In the second approach, the compiler converts one
    instruction at a time from the high-level language to machine language. Each instruction
    is executed as soon as it is converted to machine language.

