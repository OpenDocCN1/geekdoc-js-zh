            The increment or decrement operatorSECTION TENJAVASCRIPT OBJECTS​ We talked
    about objects earlier. Objects are items that can be represented in a computer
    program. They are often meant to represent real-world things.You are surrounded
    by objects—your dog, the TV, etc. Objects have state and behavior. The state of
    an object would be the size, color, etc. The behavior of an object would be what
    the object does—the actions it takes.  A race car could be an object. Things that
    describe its state could be: engine type, engine horsepower, wheel size, gas tank
    capacity, etc. Things that describe its behavior could be: accelerate, decelerate,
    turn right, turn left, etc.  In computers, objects are parts of computer programs.
    They share a similarity to real life objects: they have a state and behavior.
     EXAMPLE: An application might work with a “Customer” object. Again, the state
    of an object would be the characteristics and attributes of the object. The behavior
    would be what the object could do. In our example, the “Customer” object could
    have states like “active” or “deleted.” It could have behavior like “Upgrade Rewards
    Level” or “Add to Family Account.”  Objects are one of the first things you think
    about when designing a program. An object is something on a computer that you
    can click on, interact with, move around, etc. It can also be something behind
    the scenes that is made up of data and procedures to manipulate data. An object
    is what actually runs in the computer.  Another example: Let’s say you wanted
    to make two different types of cars on a computer; each car would be an object.
    Each object (car) would have its own size, shape, color, speed, distance it could
    travel without needing more gas, etc.Most programming languages include dictionaries.
    In coding, a dictionary is a key-value pair collection. Key-value pair is abbreviated
    “KVP.” These are sets of two linked data items that consists of: a key, which
    is a unique identifier for some item of data, and the value, which is the data
    that is identified by the key. The key is the unique name, and the value is the
    content.Collections of Key-Value Pairs are often used in computer programs.EXAMPLE:
    Here is an example of a collection of KVPs that might be used in a computer program
    for a school. Here, the KEY is used to store the name of a course at the school,
    and the VALUE is the description of the course:'
