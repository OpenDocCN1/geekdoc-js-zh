- fmt: "\n# SECTION TWENTY-ONE\n\n## FINAL CHALLENGE\n\nTo conclude this book, we’re\
    \ going to put it all together by creating a timer that will countdown by seconds.\
    \ Here we go! \n\nFirst, replace any existing code in your editor with the following:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>How many seconds would you like\
    \ to set your alarm for?</p>\n<input id=\"seconds\" value=\"\" /><\n<button onclick=\"\
    countdown()\">Click here</button>\n<p id=\"timer\"></p>\n</body>\n</html>\n```\n\
    \nThe idea here is that the user will be asked how many seconds he/she would like\
    \ to set the timer for. There is an input box available where a value may be entered.\
    \ A button is also created so that when clicked, it will send the value out to\
    \ be processed. The result will be a displayed countdown timer.\n\nRemember that\
    \ the `input` tag deals with information that the user enters. The `id` `\"minutes\"\
    ` and the `value` `\"\"` are associated with the JavaScript code that we’ll see\
    \ shortly. The `“button\"` tag will create a button that, when clicked, will look\
    \ in the JavaScript code for the `“countdown()\"` function. The result that the\
    \ `countdown` function produces will depend upon what the user submitted when\
    \ he/she clicked the button we made.\n\nThe tag with the `id` `\"timer\"` wants\
    \ to know the result of the `countdown` function so that it can display a timer\
    \ for the user to see. It will retrieve this information from the associated JavaScript.\n\
    \nSo, let’s take a look at the HTML code again, but this time, with the addition\
    \ of the JavaScript code:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>How\
    \ many seconds would you like to set your alarm for?</p>\n<input id=\"seconds\"\
    \ value=\"\" /><\n<button onclick=\"countdown()\">Click here</button>\n<p id=\"\
    timer\"></p>\n<script>\nfunction countdown() {\n  var seconds = document.getElementById(\"\
    seconds\").value;\n  function tick() {\n    seconds = seconds - 1;\n    timer.innerHTML\
    \ = seconds;\n    setTimeout(tick, 1000);\n    if(seconds == -1){\n      alert(\"\
    Time's up!\");\n    }\n  }\n  tick();\n}\n</script>\n</body>\n</html>\n```\n\n\
    You’ll notice right away that there are two separate functions in our JavaScript\
    \ code. In fact, the `“tick\"` function is sitting inside of the `“countdown\"\
    ` function! This is called “nesting functions.”\n\nThe `countdown` function is\
    \ called just one time, and it does only two things:\n1. It sets a variable named\
    \ `\"seconds\"` to the value that the user inputs.\n2. It creates and runs the\
    \ `tick` function.\n\nThe `tick` function, on the other hand, has several steps\
    \ to execute and will end up repeating multiple times. Immediately after the `countdown`\
    \ function has received the input value from the user, the `tick` function begins\
    \ laying out its instructions. It’s important to recognize that the `tick` function\
    \ is not actually being executed yet. It is simply letting its instructions be\
    \ made known in case the function ever actually needs to be used. Once the Interpreter\
    \ reads the `tick` function, it steps out and sees the `“tick()\"` instruction.\
    \ Upon seeing this function, the Interpreter knows to immediately go back through\
    \ the `tick` function. However, this time, instead of simply reading the function,\
    \ it is actually going to run the function.\n\nTake a look at the variable `\"\
    seconds\"` within the `tick` function. It is taking the value `\"seconds\"` from\
    \ the `countdown` function and subtracting 1 from it. The reason that this value\
    \ needs to be subtracted by 1 is that each time this function runs, it will last\
    \ one second (as we will see), and we need the variable `\"seconds\"` to subtract\
    \ 1 each time a second goes by.\n\nRight after 1 second is subtracted from the\
    \ user’s input the first time through the `tick` function, that same number that\
    \ has been subtracted by 1 will now be displayed for the user to see. This happens\
    \ because the `timer.innerHTML` is being assigned this number. Remember how we\
    \ put `\"id=timer\"` in one of our HTML tags? That tag now holds this number that\
    \ we assigned it.\n\nThe statement `setTimeout(tick, 1000);` simply means that\
    \ the program is pausing for 1,000 milliseconds (i.e., 1 second). This is important\
    \ because this function is going to potentially repeat multiple times—and every\
    \ time it repeats, it needs to do so for a duration of exactly one second.\n\n\
    We now have our conditional statement. What it’s telling us is that if the user’s\
    \ input ever counts all the way down to -1, stop everything and run the alert\
    \ box. You may be asking yourself, Why -1 instead of 0? The reason is that when\
    \ the interpreter sees -1, it hasn’t actually displayed it to the user yet. The\
    \ user is still seeing a 0. Therefore, before the -1 is displayed, the alert box\
    \ will show up, preventing any other code from running. As a note, if the user\
    \ clicks the OK button on the alert box, he/she will see the timer continue to\
    \ count down into the negatives. This is fine for now since we’re just practicing.\n\
    \nNow, if the user’s input does not equal -1, the Interpreter will simply step\
    \ out of the function like before. But wait; it’s going to run into that `“tick()\"\
    ` statement again! Exactly. Do you see how our function will continue to repeat\
    \ now? That is, until our conditional statement is met—wherein the alert box is\
    \ displayed.\n\nTry it out for yourself and don’t worry if you have to read the\
    \ code through several times before it really begins to sink in!\n\n## CONGRATULATIONS!!\n\
    \nYou have completed our book! Well done on your hard work and persistence! You\
    \ should now have a basic understanding of JavaScript and coding.\n\nThe Tech\
    \ Academy offers a Technology Boot Camp that trains students in several in-demand\
    \ programming languages and prepares them for entry-level developer positions.\
    \ Please visit our website: learncodinganywhere.com\nContact us to find out more!\n\
    \n## INDEX\n\n==, 69===, 69&&, 71||, 71!, 71\nAlgorithm definition, 15\nAnalog\
    \ definition, 14\nApostrophe handling, 42\nBackslash, 41\nBinary Operator, 53\n\
    Boolean Logic definition, 65\nhistory, 65\nlogic operators, 71\nBranching, 22\n\
    Calling, 28\nCentral Processing Unit definition, 14\nClass, 75\nCode definition,\
    \ 17\nCoding definition, 21\nCompiler, 29\nComputer definition, 13\nComputer Language\
    \ definition, 16\nComputer Programming definition, 21\nexample, 21\nConcatenating,\
    \ 42\n`()` method, 87\nConditional Statement, 83\n`Console.log`, 67\nConstructor,\
    \ 75\nkeywords, 77\nControl/Branching definition, 22\nloop, 25\nCPU (see Central\
    \ Processing Unit)\nDeveloper definition, 16\nDevelopment, 21\nDictionary creation,\
    \ 58\nDigital, 13\nDivision, 52\n`Document.getelementbyid`, 47\n`Document.write()`,\
    \ 39\nElement, 47\nElse If Statements, 84\nElse Statements, 84\nEntrance, 22\n\
    Executed, 37\nExit, 28\nFinal Challenge, 91\nFive Elements, 21\nFunction definition,\
    \ 47\nHello, World, 36\nHTML, 35\nhistory, 33\nHypertext, 35\nIdentifiers, 79\n\
    If Statements, 83\nIf/Then, 23\nInput, 15\nInstruction, 15\nInterpreter, 23\n\
    Introduction, 19\nInvoking, 47\nJavaScript definition, 33\nJava history, 35\n\
    Key-Value pairs, 57\nKeywords, 77\nLiteral, 35\nLogical Operators, 71\nLoop, 25\n\
    Low Level definition, 16\nMachine definition, 16\nMachine language, 17\nMain Program,\
    \ 28\nMarkup, 35\n`Math.random()`, 54\nMethod, 89\nModulus Operation, 52\nMultiple,\
    \ 43\nDivision, 52\nIncrement, 53\nModulus operation, 52\nMultiple Variables,\
    \ 43\nMultiplication, 52\nNested Functions, 79\nNetwork definition, 18\nNotepad,\
    \ 34\nNumbers, 52\nNumber Methods, 89\nObject definition, 38\nObject-Oriented\
    \ Programming, 75\nOperating System definition, 17\nOperator definition, 41\n\
    OS (see Operating System)\nPath, 22\nPeripheral definition, 14\nProgram definition,\
    \ 15\nProgrammer definition, 16\nProgramming Language definition, 16\nProtocol\
    \ definition, 18\nQuotes, 41\nReserved Words, 78\nRuntime, 30\nScope, 80\n`Slice()`,\
    \ 87\nSoftware definition, 21\nString concatenation, 42\ncreating one, 42\n`str.fontcolor(\"\
    \")`, 43\nSubprograms calling, 28\nSubtraction, 51\nTech Academy website, 11\n\
    Ternary Operator, 73\nTimer Challenge, 91\nTips, 33\nTrue/False, 65\nType Coercion,\
    \ 67\nUnary Operator, 53\nUntyped Language, 30\nValues boolean definition, 33\n\
    functions, numbers,objects, numbers, undefined\nVariables definition, 23\n`Window.alert()`,\
    \ 38\nWorld Wide Web definition, 19\nWWW (see World Wide Web)\nWeb (see World\
    \ Wide Web)\n"
