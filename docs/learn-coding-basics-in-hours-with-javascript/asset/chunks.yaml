    ## SECTION ELEVEN: FLOATING POINT

    A floating point is a specific way of representing large numbers. Instead of writing
    out the entire number, you can write the first part of it and then a factor to
    multiply it by—such that performing the multiplication will get you essentially
    the same number you would have written out in full. When you do this, you move
    the decimal point in the number; hence the name "floating point."


    **EXAMPLE**: Take the number three thousand, four hundred twenty-five. Written
    normally, it would be: `3425`; written in floating point notation, it could be:
    `3.425 x 10^3`. Since `10^3` is `1000`, this means "3.425 times 1000" or `3425`.


    A "float" is a type of data used by computers. The "float" type is used to store
    numbers with a very high degree of accuracy. It is primarily used for mathematical
    purposes.


    **Note**: When you see `E` at the end of a number, it means “10 to a given exponent.”
    An “exponent” is the power to which a number is multiplied. For example, `10^4`
    means 10 to the fourth power—which is 10,000 (10 multiplied by 10 multiplied by
    10 multiplied by 10). In this case, `4` is the exponent.


    Let’s say we want a shorter way to write 100,000. We could write `10E4`. `10E4`
    means `10^4` (10 multiplied by 10 four times). In JavaScript, all numbers are
    floating point numbers, and the limit of floating point numbers is `1.797693134862315E+308`
    (meaning JavaScript cannot handle a larger floating point number). Any number
    larger than `1.797693134862315E+308` is considered “infinity.”


    ## NUMBERS

    In JavaScript, there are 3 unique values that are considered to be numbers but
    actually not act the same. They are:

    - `NaN` (short for “Not a Number”)

    - `Infinity` (positive infinity)

    - `-Infinity` (negative infinity)


    The best way to understand these is to put them into action. Here’s an example—in
    a new document, write and execute the following:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Not_a_Number"></p>

    <script>

    document.getElementById("Not_a_Number").innerHTML = 0/0;

    </script>

    </body>

    </html>

    ```

    Save and execute your code. The result is `NaN` because you can’t divide 0 by
    0. We can check whether or not something is a number using the `isNaN()` function.
    In a new text document, type and execute the following:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Not_a_Number"></p>

    <script>

    document.getElementById("Not_a_Number").innerHTML = isNaN(''Hello World'');

    </script>

    </body>

    </html>

    ```

    Save and run your code. As you can see, the result is “true” because “Hello World”
    is not a number. Let’s change our code to the following:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Not_a_Number"></p>

    <script>

    document.getElementById("Not_a_Number").innerHTML = isNaN(''007'');

    </script>

    </body>

    </html>

    ```

    (We only changed “Hello World” to “007”). Save and run your code. Now it is false
    because 007 is a number. Now, delete your code and write the following:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Infinity"></p>

    <script>

    document.getElementById("Infinity").innerHTML = 1.797693134862315E+309;

    </script>

    </body>

    </html>

    ```

    Save and execute your code. You can see the result “infinity.” This is because
    we entered a number larger than `1.797693134862315E+308`. To see `-Infinity`,
    simply change your code to the following:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Infinity"></p>

    <script>

    document.getElementById("Infinity").innerHTML = -1.797693134862315E+309;

    </script>

    </body>

    </html>

    ```


