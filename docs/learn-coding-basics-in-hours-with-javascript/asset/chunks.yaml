    \ 20 道题的小型卷子。现在，如果计算机程序处理的卷子是测验，成绩将不再准确——即使学生正确回答了所有 20 道题，他得到的成绩也只有 20%（20/100）。\n\
    \n一个优秀的程序员会分析程序旨在解决的需求，然后构建程序，使其能够处理随时间变化而变化的需求。\n\n### 循环\n\n另一个非常有用的控制语句是循环。程序的某部分会被重复执行，直到满足特定条件。在现实世界中，一个例子可能是“一个一个批改卷子，直到所有卷子都批改完毕”或“复印五文件”。\n\
    \n在计算机程序中，循环看起来像这样：\n\n```\n[start loop]\n* Perform action\n* If [end condition\
    \ has been met] then [exit the loop]\n* If [end condition has not been met] then\
    \ [repeat the loop]\n[end loop]\n```\n\n我们看到的批改卷子的程序可以设定为一个循环。指令安排如下：\n\n```\n\
    [start loop]\n* 从“待批改”栈的顶部获取下一份学生卷子。\n* 批改卷子。\n* 将成绩写在卷子上。\n* 如果成绩是 70% 或更高，将卷子放入“通过”栈中。\n\
