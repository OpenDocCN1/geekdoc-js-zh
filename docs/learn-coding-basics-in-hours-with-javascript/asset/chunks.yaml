  trans: "\n\n# 第二十一节\n\n## 终极挑战\n\n为了结束本书，我们将通过创建一个按秒倒计的计时器来将所有所学知识整合起来。我们开始吧！\n\n\
    首先，将你编辑器中的任何现有代码替换为以下内容：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>How many\
    \ seconds would you like to set your alarm for?</p>\n<input id=\"seconds\" value=\"\
    \" /><\n<button onclick=\"countdown()\">Click here</button>\n<p id=\"timer\"></p>\n\
    </body>\n</html>\n```\n\n这里的思路是：询问用户他们想要设置多少秒的闹钟。提供了一个输入框，可以在其中输入值。还创建了一个按钮，当点击它时，它会将该值发送出去处理。结果将显示一个倒计时计时器。\n\
    \n请记住，`input` 标签处理用户输入的信息。`id` `\"seconds\"` 和 `value` `\"\"` 与我们即将看到的 JavaScript\
    \ 代码相关。`\"button\"` 标签将创建一个按钮，点击时，它会在 JavaScript 代码中查找 `\"countdown()\"` 函数。`countdown`\
    \ 函数产生的结果取决于用户点击我们创建的按钮时提交的内容。\n\n带有 `id` `\"timer\"` 的标签想要知道 `countdown` 函数的结果，以便为用户显示一个计时器供其查看。它将从相关的\
    \ JavaScript 中获取此信息。\n\n所以，让我们再次查看 HTML 代码，这次加上 JavaScript 代码：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<p>How many seconds would you like to set your alarm\
    \ for?</p>\n<input id=\"seconds\" value=\"\" /><\n<button onclick=\"countdown()\"\
    >Click here</button>\n<p id=\"timer\"></p>\n<script>\nfunction countdown() {\n\
    \  var seconds = document.getElementById(\"seconds\").value;\n  function tick()\
    \ {\n    seconds = seconds - 1;\n    timer.innerHTML = seconds;\n    setTimeout(tick,\
    \ 1000);\n    if(seconds == -1){\n      alert(\"Time's up!\");\n    }\n  }\n \
    \ tick();\n}\n</script>\n</body>\n</html>\n```\n\n你会立即注意到，我们的 JavaScript 代码中有两个独立的函数。事实上，`\"\
    tick\"` 函数就位于 `\"countdown\"` 函数内部！这被称为“函数嵌套”。\n\n`countdown` 函数只被调用一次，它只做两件事：\n\
    1. 它将一个名为 `\"seconds\"` 的变量设置为用户输入的值。\n2. 它创建并运行 `tick` 函数。\n\n相反，`tick` 函数有几个步骤要执行，并且最终会重复多次。在\
    \ `countdown` 函数接收到用户的输入值后，`tick` 函数开始列出它的指令。重要的一点是，`tick` 函数实际上还没有被执行。它只是在让它的指令广为人知，以防函数以后真的需要被使用。一旦解释器（Interpreter）读取了\
    \ `tick` 函数，它会跳出来并看到 `\"tick()\"` 指令。看到这个函数后，解释器知道要立即重新进入 `tick` 函数。然而，这次它不再仅仅是读取函数，而是要实际运行该函数。\n\
    \n看看 `tick` 函数内部的变量 `\"seconds\"`。它从 `countdown` 函数中获取 `\"seconds\"` 的值并对其减 1。这个值之所以需要减\
    \ 1 的原因是：每当该函数运行时，它将持续一秒（正如我们将看到的），我们需要每秒一次地让 `\"seconds\"` 变量减 1。\n\n在第一次通过 `tick`\
    \ 函数从用户输入中减去 1 秒后，相同的数字现在将显示给用户看。这是因为 `timer.innerHTML` 被赋值了这个数字。记得我们在 HTML 标签中设置的\
    \ `\"id=timer\"` 吗？该标签现在持有了这个数字。\n\n`setTimeout(tick, 1000);` 语句意味着程序暂停 1000 毫秒（即\
    \ 1 秒）。这是因为该函数可能会重复多次——并且每次重复都需要持续一秒。\n\n我们现在有了条件语句。它告诉我们：如果用户的输入计数到 -1，就停止所有操作并运行警告框（alert\
    \ box）。你可能会问，为什么不是 0 ？原因是当解释器看到 -1 时，它还没有向用户显示它。用户看到的还是 0。因此，在显示 -1 之前，警告框会弹出，防止其他代码运行。注意，如果用户点击警告框上的\
    \ OK 按钮，计时器将继续倒数到负数。这在练习阶段没关系。\n\n现在，如果用户的输入不等于 -1，解释器将像之前一样跳出函数。等一下；它将再次运行 `\"\
    tick()\"` 语句！准确地，直到满足条件语句——警告框才会显示。\n\n## 恭喜！！\n\n你完成了这本书！你的努力和坚持非常了不起！你现在应该对\
    \ JavaScript 和编码有了基本的了解。\n\nTech Academy 提供技术训练营（Technology Boot Camp），培训学生多种热门编程语言，并为他们的初级开发职位做准备。请访问我们的网站：learncodinganywhere.com\
    \ 了解更多信息！\n\n## 索引\n\n==, 69\n===, 69\n&&, 71\n||, 71!, 71\n算法定义, 15\n模拟定义, 14\n\
