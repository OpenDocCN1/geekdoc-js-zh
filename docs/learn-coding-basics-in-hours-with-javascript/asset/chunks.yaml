    is being assigned this number. Remember how we put “id=timer” in one of our HTML
    tags? That tag now holds this number that we assigned it.The statement “setTimeout(tick,
    1000);” simply means that the program is pausing for 1,000 milliseconds (i.e.,
    1 second). This is important because this function is going to potentially repeat
    multiple times—and every time it repeats, it needs to do so for a duration of
    exactly one second.We now have our conditional statement. What it’s telling us
    is that if the user’s input ever counts all the way down to -1, stop everything
    and run the alert box. You may be asking yourself, Why -1 instead of 0? The reason
    is that when the interpreter sees -1, it hasn’t actually displayed it to the user
    yet. The user is still seeing a 0\. Therefore, before the -1 is displayed, the
    alert box will show up, preventing any other code from running. As a note, if
    the user clicks the OK button on the alert box, he/she will see the timer continue
    to count down into the negatives. This is fine for now since we’re just practicing.Now,
    if the user’s input does not equal -1, the Interpreter will simply step out of
    the function like before. But wait; it’s going to run into that “tick()” statement
    again! Exactly. Do you see how our function will continue to repeat now? That
    is, until our conditional statement is met—wherein the alert box is displayed.Try
    it out for yourself and don’t worry if you have to read the code through several
    times before it really begins to sink in!CONGRATULATIONS!!​ You have completed
    our book! Well done on your hard work and persistence!​ You should now have a
    basic understanding of JavaScript and coding.​ The Tech Academy offers a Technology
    Boot Camp that trains students in several in-demand programming languages and
    prepares them for entry-level developer positions.​ Please visit our website:learncodinganywhere.comContact
