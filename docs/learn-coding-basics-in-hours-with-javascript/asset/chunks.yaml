    2. Put the shirt on.


    3. Look at yourself in the mirror.


    4. Decide whether you like the way you look in that shirt. If you like how you
    look, leave the shirt on and go to step 6. If you do not like how you look, take
    the shirt off and put it back in the closet where you got it from.


    5. Repeat steps 1–5 until you have made a decision about each shirt in the closet.

