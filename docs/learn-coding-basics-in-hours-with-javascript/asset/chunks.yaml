- fmt: "\nSecond Edition.© The Tech Academy, Prosper Consulting Inc. \n\n# LEARN CODING\
    \ BASICS IN HOURS WITH JAVASCRIPT\nAn Introduction to Coding for People with No\
    \ Prior Experience\nWritten by: Jack C. Stanley and Erik D. Gross, Co-Founders\
    \ of The Tech Academy\n\n## INTRODUCTION\nThe Tech Academy is a licensed career\
    \ school that delivers software developer training. Our main offering is the Software\
    \ Developer Boot Camp. The program can be taken online from anywhere or at one\
    \ of our campuses.\n\nPlease keep in mind that this is the first edition of this\
    \ book. There will be upgrades and revisions in the future.\n\nIf you find any\
    \ errors, have feedback or would like to give suggestions, please contact us immediately.\
    \ Our contact information can be found on our website: `learncodinganywhere.com`.\n\
    \nThank you for obtaining this book. We hope that you may enjoy it!\n\n## SECTION\
    \ ONE: THE PURPOSE OF THIS BOOK\nIf you have ever coded in `JavaScript`, created\
    \ websites, designed programs, written software—this book is not for you. Even\
    \ if you have not programmed in `JavaScript`, but you are a skilled developer\
    \ in another language, this book is not for you.\n\nAs the title states, this\
    \ is meant to be a first-time introduction to coding utilizing `JavaScript`. This\
    \ is a simplified, basic and ground-up approach for beginners. `JavaScript` is\
    \ a wonderful language to impart programming basics and give students experience\
    \ in coding. So, if you are a newbie, read on. If not, good luck with your travels\
    \ elsewhere!\n\nSome people may find this book “too simple.” In thinking this,\
    \ those individuals completely miss the purpose of The Tech Academy: to make computer\
    \ programming understandable for anyone and everyone.\n\nThis book is written\
    \ with the assumption that you have no prior experience in coding, and that’s\
    \ where many coding tutorials and books fail. They assume that the student knows\
    \ the basic terminology associated with coding and that he/she already understands\
    \ basic programming concepts. This approach inevitably results in information\
    \ going over the head of the learner. Many “introductory” resources use unfamiliar\
    \ words and refer to ideas that the average person or inexperienced beginner doesn’t\
    \ know—and at the risk of being called a dumbed-down coding publication, we have\
    \ provided a book here that requires no background or previous experience.\n\n\
    Both this book and The Tech Academy share the same purpose. We want to make programming\
    \ basics understandable while specifically gaining a fundamental understanding\
    \ of `JavaScript`. Where you go from there is your choice.\n\nThe next three sections\
    \ of this book will cover important information and concepts about programming\
    \ and `JavaScript`. The actual writing of code will happen after that. Why is\
    \ it that we don’t just throw you right into writing code? Because you wouldn’t\
    \ be following the natural sequence. If you were to teach someone how to drive\
    \ a car that didn’t even know what a car looked like or what it was used for,\
    \ you would first have to describe one and tell them what to do. It may be dangerous\
    \ to tell someone to drive without first telling them what a gas pedal, steering\
    \ wheel, and brake were.\n\nAdditionally, you will not learn everything there\
    \ is to know about `JavaScript` in this book. Instead, you will get a taste of\
    \ `JavaScript` here. Consider this an opportunity to see what programming is like.\
    \ What you do with it in the future is up to you.\n\nThis book should be read\
    \ from start to finish, with all assignments completed in order. All tasks and\
    \ code you are required to write herein are written in blue font. It is important\
    \ that you actually type the code. As a developer-in-training, you need all the\
    \ experience you can get in typing code!\n\nHappy learning,\nThe Tech Academy\n\
    \n## SECTION TWO: BASIC DEFINITIONS\nUnderstanding the terminology of a subject\
    \ is a vital component of mastering a subject. After all, how well could you drive\
    \ a car if you didn’t know what a gas pedal was?\n\nSo, while it may not seem\
    \ appealing, read through the following technological definitions so we can ensure\
    \ a firm foundation is in place to build upon.\n\nNote: If there are any technical\
    \ terms you would like to clear up that aren’t defined in this book, you can refer\
    \ to The Tech Academy’s Technology Basics Dictionary, Tech and Computers Simplified.\
    \ The dictionary is available on Amazon.\n\n### DEFINITIONS\n\n**Machine**: Something\
    \ that uses energy to do things. Machines are most commonly made out of metal\
    \ and plastic and have several parts that work together. They are usually made\
    \ up of fixed and moving parts that each serve a particular purpose. Machines\
    \ are used by people as tools to assist in getting something done.\nEXAMPLE: A\
    \ car is a machine.\n\n**Computer**: An electronic machine that stores and deals\
    \ with information. A computer is made up of many different parts through which\
    \ electricity passes. Computers are a tool that people use to help them do things.\
    \ Computers follow instructions entered into them by people. A computer can store\
    \ instructions to be done at later points in time so that people do not have to\
    \ re-enter the same instructions over and over again. The computer automatically\
    \ performs a series of functions when it is on and also responds to commands that\
    \ a person enters into it. The way it responds to commands is all set up beforehand\
    \ by people. Machines, such as cars and phones, can have computers inside them\
    \ that perform specific functions. Computers typically exist to help people by\
    \ performing repetitive activities, storing information and making certain activities\
    \ faster or more efficient.\nEXAMPLE: An electronic calculator is a very basic\
    \ type of computer.\n\n**Digital**: Of, or related to, a device or object that\
    \ represents magnitudes in digits. Computers are digital devices; data in computers\
    \ is represented using digits. The opposite of “digital” can be considered to\
    \ be “analog.” Analog refers to data flowing out in a continuous stream. Things\
    \ that are digital are made up of exact, distinct parts; these parts are always\
    \ in an exact, standard state (state is the condition of a thing—for example,\
    \ “green,” “empty,” “45 years old,” etc.). Digital things can only be in one of\
    \ the available states for that thing and not “in between” two of the available\
    \ states. For example, a light bulb with a regular flip switch would be digital\
    \ because it has only two states: totally off or totally on. If the light bulb\
    \ had one of those round dimmer switches instead of a flip switch, and it could\
    \ be set to somewhere between “totally off” and “totally on,” it would not be\
    \ digital. A black-and-white photo that is created using only small black and\
    \ white dots is digital. From a distance, you see the image that the photograph\
    \ represents. If you look at it up close, you see that the photo is composed of\
    \ individual small dots. The distinct dots are digital in that they are exact,\
    \ separated marks.\nEXAMPLE: In terms of physical universe objects, a staircase\
    \ would be considered digital, and a ramp would be analog. Stairs have distinct,\
    \ separated steps. A ramp is continuous. Computers are digital because they communicate\
    \ using two numbers: 0 (which tells the computer “off”) and 1 (which tells the\
    \ computer “on”).\nNote: People typically use the word “digital” to refer to anything\
    \ that has to do with computers.\n\n**Central Processing Unit**: `CPU` for short.\
    \ The CPU is basically the “brain” of the computer. A Central Processing Unit\
    \ is the part of a computer that controls all the actions the computer does. It\
    \ is a small device that contains billions of tiny electronic components. Most\
    \ CPUs have a set of built-in “instructions” in them. They define the various\
    \ actions the CPU can take—things like taking in data from a keyboard, storing\
    \ data in the computer, sending data to a display, etc.\nEXAMPLE: If you have\
    \ a list of students in a computer file, and you give the computer an instruction\
    \ to put the list in alphabetical order, it is the CPU that performs the analysis\
    \ and re-ordering of the list.\n\n**Peripheral**: These are things that can be\
    \ hooked up to a computer, including external devices. Peripherals include mice,\
    \ keyboards, external drives, displays, etc. Peripherals are often used to get\
    \ data into a computer or to receive data from the computer.\nEXAMPLE: A printer\
    \ is a peripheral device.\n\n**Input**: Input is data or information that is collected\
    \ by a computer. This can take many forms. It may be information a user has typed\
    \ into a form on the computer. It may be electronic signals sent to the computer\
    \ by an attached device, like a mouse or a display screen that takes touch input.\
    \ It may be a set of electronic data from another computer that is connected to\
    \ the first one by wires.\nEXAMPLE: A customer service agent at a retail store\
    \ takes down your information and types it into her computer; that information\
    \ is input for the computer to use.\n\n**Algorithm**: A mathematics word that\
    \ means a plan for solving a problem. Algorithms consist of a sequence of steps\
    \ to solve a problem or perform an action. Computers use algorithms. An algorithm\
    \ is a set of instructions that is used to get something done.\nEXAMPLE: An algorithm\
    \ for selecting the right kind of shirt might have the following steps:\n1. Pick\
    \ a shirt from your closet.\n"
