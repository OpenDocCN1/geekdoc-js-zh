    1. `Strings` (data that represent text or a series of text)

    2. `Numbers`

    3. `Booleans` (true or false statements)

    4. `Objects` (things with state and behavior)

    5. `Functions` (a block of organized, reusable computer code used to perform a
    single, related action—also called a subprogram or subroutine)

    6. `Values` that are undefined


    You will learn how to utilize these value types in this book.


    ### TIPS


    If you run into any trouble while going through this book, here are some tips:

    1. Ensure you understand all the words and terms being used – clear up any you
    don’t understand.

    2. Ensure your code is written exactly as laid out here. A small error in the
    code, such as a typo, can ruin the whole program. Code must be exact for programs
    to run properly, so always meticulously check your code for errors.

    3. Research online for solutions.

    4. You can also contact The Tech Academy and ask for assistance – `learncodinganywhere.com`.


    At the end of some sections, we will have an “END OF SECTION CHALLENGE.” These
    are opportunities for you to put together all that you’ve studied in that section
    thus far and more. At times you will also be instructed to figure out new things
    on your own. Working software developers are often assigned projects and tasks
    they’ve never done before. A key element of the job is researching solutions online.
    You’ll find that some of these challenges will instruct you to do something that
    we haven’t taught you yet. This was done intentionally. We want you to gain experience
    in locating new data online and figuring out things on your own. In the words
    of more than one software developer: “I get paid to Google things!”


    Some of these challenges will be a repeat of tasks you’ve already performed. The
    reasons for this are:

    a. Provide you with an opportunity to create your own approach, and

    b. Allow you to better understand and remember code through repetition.


    In this book, code and assignments are written in gray font.


    ### FIRST ASSIGNMENT


    Here is your first task:

    Download and install Notepad ++ here: [https://notepad-plus-plus.org/](https://notepad-plus-plus.org/)

    You will be writing your code using Notepad ++. Note: If you are using a Macintosh
    computer, you can utilize a different code editor—such as Brackets.


    ### SECTION FIVE: HTML AND JAVASCRIPT


    Before writing code in `JavaScript`, you must be familiar with some basic `HTML`.


    `HTML` is a computer language that describes the appearance, content, and behavior
    of web pages. The web page files that are served up by a web server are written
    in `HTML`.


    There are two main concepts in `HTML`: "hypertext" and "markup." Hypertext is
    a system for linking electronic documents. In an `HTML` document, hypertext is
    words, images, videos, etc., that link to other `HTML` documents. When a user
    selects the hypertext, the linked document is retrieved and displayed on the computer
    screen.


    Markup is the action of adding instructions to a document to control the format,
    style, and appearance of the content of the document. This applies to physical
    printed documents as well as to electronic documents that are displayed on a computer
    screen.


    A markup language is a type of programming language that is used to specify markup
    instructions for the data in a document. In other words, markup instructions aren’t
    the data in the document; they are data about the data in the document.


    `HTML` is a markup language. There are other markup languages. `HTML` is used
    to create web pages. A computer programmer uses `HTML` to put markup instructions
    before and after the content of a web page.


    These markup instructions give the computer data about the elements of the document—text,
    images, video, etc. When the document is actually displayed on a screen, those
    markup instructions aren’t displayed on the screen; instead, they are used to
    control how the actual content of the document is displayed.


    **EXAMPLE:** Here is an example of an actual `HTML` file that a browser might
    receive from a web server:


    ```html

    <html>

    <title>

    Ninjas Everywhere!

    </title>

    <body>

    Ninjas are <strong>everywhere</strong>. There might be one behind you right now!
    Be sure to wear ninja-proof clothing at all times.

    </body>

    </html>

    ```

