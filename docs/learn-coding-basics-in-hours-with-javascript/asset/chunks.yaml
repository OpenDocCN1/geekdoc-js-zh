    ## SECTION THIRTEEN COMPARISON OPERATORS

    In JavaScript, we can utilize double and triple equal signs. `==` (Double equal
    sign) is used to show that a comparison should be made. Specifically, `==` is
    an instruction to check whether the data on the left side of the symbol is equal
    to the right side. The answer to this comparison is an answer of “true” or “false.”
    When the `==` symbol is used to check for equality, usually it is used like this
    `[first item to be compared] == [second item to be compared]`.


    **EXAMPLE**: `(10 + 5) == 15`. In this example, we are asking the computer to
    check whether the result of adding 5 and 10 is equal to 15. Here, the response
    would be “true” since `(10 + 5)` is equal to 15.


    `===` (triple equal sign) is used to show that a comparison should be made. Specifically,
    `===` is an instruction to check whether the data on the left side of the symbol
    is equal to the right side and that it is the same type of data as that on the
    right. The answer to this comparison is an answer of “true” or “false.”


    **EXAMPLE**: You want to check whether two birth dates are equal. You have two
    pieces of data in the computer that represent these birth dates: `DateOfBirth1`
    is data of type “Date,” and the value of the data is “1/1/1970”; `DateOfBirth2`
    is data of type “Date,” and the value of the data is “1/1/1970.” You would use
    the `===` symbol like this: `DateOfBirth1 === DateOfBirth2`. This tells the computer
    to check whether the two pieces of data are equal in both VALUE and TYPE. Since
    they are, the computer responds with “true.”


    Like all code, it’s best understood by writing it! Now, let’s use a separate HTML
    document and JavaScript document again—just to ensure we’re used to that. First,
    open up your HTML code document (if you don’t have that, just make a new one)
    and ensure it contains the following code:


    ```html

    <!DOCTYPE HTML>

    <html>

    <body>

    <script src="test_1.js"></script>

    </body>

    </html>

    ```

    Ensure this file is saved as `HTML.html`. Then open up your JavaScript code file
    (entitled `test_1.js`—if you don’t have this file, create a new file) and type
    the following code:


    ```javascript

    document.write(10 == 10);

    ```

    Again, ensure this is saved as `test_1.js`. Then run your `HTML.html` code. It
    should return “true” (because 10 is equal to 10). To make it return “false” simply
    change a number in your JavaScript, such as:


    ```javascript

    document.write(5 == 10);

    ```

    Now, let’s use `===`. Write the following in your JavaScript code file:


    ```javascript

    X = 10

    Y = 10

    document.write(X === Y);

    ```

    Save it and run the HTML code. This returns “true” because they are both variables
    and both have the value 10. You can make this false by changing it to:


    ```javascript

    X = 10

    Y = 5

    document.write(X === Y);

    ```

    Save it and then run the HTML code—it returns “false.” Even though they are both
    variables, the values are different. We can also return false by writing the following
    JavaScript code:


    ```javascript

    X = "Ten"

    document.write(X === 10);

    ```


