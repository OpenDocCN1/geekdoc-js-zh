- fmt: "\nThe `&&` operator determines the logic between values or variables, such\
    \ as verifying that `___` and `___` are true (both must be true to return “true.”\
    \ If one or both is false, the code will return “false”). Write and execute the\
    \ following code:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>document.write(5\
    \ > 2 && 10 > 4);</script>\n</body>\n</html>\n```\n\nOur code returns “true” because\
    \ five is greater than two, and ten is greater than four. We can make our code\
    \ return “false” by changing one or both of the comparisons, such as:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>document.write(5 > 10 && 10 > 4);</script>\n\
    </body>\n</html>\n```\n\nThe `||` (or) operator means what it sounds like and\
    \ is best described through utilization. Write and execute the following code:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>document.write(5 > 10 || 10\
    \ > 4);</script>\n</body>\n</html>\n```\n\nSave and execute your code. It returned\
    \ “true” because, while 5 is not greater than 10, 10 is greater than 4. We can\
    \ make it return “false” with the following code since neither is true:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<body>\n<script>document.write(5 > 10 || 10 > 20);</script>\n\
    </body>\n</html>\n```\n\nThe `!` (not) operator checks whether or not something\
    \ is true. If `___` is not present, “true” will be returned. Write and execute\
    \ the following code:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"Not\"\
    ></p>\n<script>document.getElementById(\"Not\").innerHTML = !(5 > 10);</script>\n\
    </body>\n</html>\n```\n\nSave and run your code. And of course, if you want a\
    \ “double negative,” write and execute the following code:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<p id=\"Not\"></p>\n<script>document.getElementById(\"\
    Not\").innerHTML = !(20 > 10);</script>\n</body>\n</html>\n```\n\n# SECTION FIFTEEN\
    \ TERNARY OPERATORS\n\nTernary means “made up of three parts.” A ternary operator\
    \ operates on three values. It can be used to assign a value to a variable based\
    \ on a condition. This is also referred to as a conditional operator in that it\
    \ assigns a value to a variable based on a condition.\n\nThe syntax of this is:\n\
    `Name_of_variable = (condition) ? Value_1:Value_2`\n\nThe ternary operator is\
    \ `?`. Write and execute the following code:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<script>document.write(Bigger = (5 > 1) ? \"Left number is bigger\":\"\
    Right number is bigger\");</script>\n</body>\n</html>\n```\n\nWe said that if\
    \ it’s true that 5 is bigger than 1, display “Left number is bigger.” If you change\
    \ the numbers or flip the symbol to `<`, we can change the outcome of our code.\n\
    \nHere is something more elaborate that we can do with ternary operators:\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>Riders must be at least 52 centimeters\
    \ tall to ride.</p>\n<input id=\"Height\" value=\"52\" />\n<button onclick=\"\
    Ride_Function()\">Click here</button>\n<p id=\"Ride\"></p>\n<script>\nfunction\
    \ Ride_Function() {\n  var Height, Can_ride;\n  Height = document.getElementById(\"\
    Height\").value;\n  Can_ride = (Height < 52) ? \"You are too short\":\"You are\
    \ tall enough\";\n  document.getElementById(\"Ride\").innerHTML = Can_ride + \"\
    \ to ride.\";\n}\n</script>\n</body>\n</html>\n```\n\nInput is a command that\
    \ has the user input data.\n\n## END OF SECTION CHALLENGE\n- Write your own ternary\
    \ operator.\n\n# SECTION SIXTE OBJECT-ORIENTED PROGRAMMING\n\nA constructor is\
    \ a special part of a common computer programming tool called a `class`. Classes\
    \ are used in a type of computer programming called “object-oriented programming.”\n\
    \nAs we covered earlier, in the world around you, you are surrounded by objects—your\
    \ dog, the TV, etc. Objects have state and behavior. The state of an object would\
    \ be the size, color, etc. The behavior of an object would be what the object\
    \ does—the actions it takes. In object-oriented programming, objects are parts\
    \ of computer programs. They share a similarity to real life objects: they have\
    \ a state and behavior.\n\nYou create these objects by creating what are called\
    \ “classes” using the programming language. This would be created by making (or\
    \ “declaring”) a class called a `Customer` class. It is important to know that\
    \ when you first create this class, you are describing the POTENTIAL characteristics\
    \ and behavior of that `TYPE` of thing—you still need to create an actual one\
    \ of those things. This process is called “creating an INSTANCE” of the class,\
    \ where “instance” means “an actual one” of the things described when you declared\
    \ the class.\n\nA class can have a constructor. The constructor is a special part\
    \ of the class that describes the default state of any new instance of the class\
    \ that gets created. In other words, it gives default values for the properties\
    \ of the class.\n\nEXAMPLE: Let’s say you had a class called `Customer`. The computer\
    \ code to create the “customer” class might look something like this:\n\n```javascript\n\
    class Customer{\n  string FullName;\n  Boolean Active;\n}\n```\n\nNow let’s say\
    \ that whenever you created a new instance of the “customer” class, you wanted\
    \ it to be an active customer—in other words, you wanted the property `Active`\
    \ to be set to “true.” To do this, you would make a constructor for the “customer”\
    \ class. It would be a small subprogram, inside the class, that would be used\
    \ every time an instance of the “customer” class was created.\n\nThe constructor\
    \ might look something like this:\n\n```javascript\nCustomer(string name){\n \
    \ Fullname = name;\n  Active = true;\n}\n```\n\nThe entire class would look like\
    \ this:\n\n```javascript\nclass Customer{\n  string FullName;\n  Boolean Active;\n\
    \  Customer(string name){\n    Fullname = name;\n    Active = true;\n  }\n}\n\
    ```\n\nThe constructor would be used by asking for an instance of the `Customer`\
    \ class to be created and passing along the desired name of the customer. The\
    \ call to create the instance of the class would look like this:\n\n```javascript\n\
    Customer cust = new Customer(\"Brenda Smith\");\n```\n\nThis creates a new instance\
    \ of the “customer” class using the constructor inside the class. The constructor\
    \ uses the “Brenda Smith” it was given to set the value of the property `FullName`\
    \ and uses the instruction in the constructor to set the property `Active` to\
    \ “true.”\n\nThe new instance of the “customer” class, which is the variable `cust`\
    \ here, will, therefore, have the properties: `FullName = “Brenda Smith”`, `Active\
    \ = true`.\n\nNote: The above code is given as an example and is not meant to\
    \ be executed. We will create a constructor soon.\n\n## KEYWORDS\n\nAs discussed\
    \ earlier, JavaScript keywords identify actions to be performed. For example:\
    \ `var` is a keyword we use to assign variables. Another type of keyword is the\
    \ `new` keyword, which is used to create new objects. We also have the `this`\
    \ keyword. The `this` keyword indicates the object that is the owner of the code.\
    \ When used in an object, the value of `this` is the object. When used with a\
    \ function, the value of `this` is the object that possesses the function.\n\n\
    We just covered a lot of information about constructors, the `new` keyword, the\
    \ `this` keyword, and more. Now, let’s put them to use in a practical way!\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"Keywords_and_Constructors\"\
    ></p>\n<script>\nfunction Vehicle(Make, Model, Year, Color) {\n  this.Vehicle_Make\
    \ = Make;\n  this.Vehicle_Model = Model;\n  this.Vehicle_Year = Year;\n  this.Vehicle_Color\
    \ = Color;\n}\nvar Jack = new Vehicle(\"Dodge\", \"Viper\", 2018, \"Red\");\n\
    var Emily = new Vehicle(\"Jeep\", \"Trail Hawk\", 2017, \"White and Black\");\n\
    var Erik = new Vehicle(\"Ford\", \"into\", 1971, \"Mustard\");\ndocument.getElementById(\"\
    Keywords_and_Constructors\").innerHTML = \"Erik drives a \" + Erik.Vehicle_Color\
    \ + \"-colored \" + Erik.Vehicle_Model + \" manufactured in \" + Erik.Vehicle_Year;\n\
    </script>\n</body>\n</html>\n```\n\nRemember how we talked about “constructors”?\
    \ Well, the function `Vehicle` in our code is an object constructor.\n\n## RESERVED\
    \ WORDS\n\nIn JavaScript, there are certain words you can’t use as variables,\
    \ labels (names assigned to sections of code), and functions. Examples of reserved\
    \ words are `true` and `false`. If you’re interested, here is a link to the reserved\
    \ words in JavaScript: https://www.w3schools.com/js/js_reserved. The reason you\
    \ cannot use these words is they already mean something else.\n\n## Challenge\n\
    - Create a class.\n- Create a constructor.\n- Use the `new` keyword.\n- Use the\
    \ `this` keyword.\n\n# SECTION SEVENTEEN IDENTIFI & LITERALS\n\nAn `identifier`\
    \ is a name for something. In JavaScript, identifiers are the names of variables,\
    \ functions, and labels. In the following code, `X` is the identifier:\n\n```javascript\n\
    var X = 10\n```\n\nIn contrast to an identifier, a `literal` represents a value\
    \ within source code. Source code is the version of a computer as it is originally\
    \ written (i.e., typed into a computer in some language) by the designer of the\
    \ program. Normally, when the programmer is done making the program, he has the\
    \ code he wrote in another format that is easier and faster for the computer to\
    \ use. In that format, the program can't be easily understood by people. As a\
    \ note, `<br>` is the break tag and creates a line break in text (like pressing\
    \ enter on your keyboard). It also can't be modified by other programmers at that\
    \ point.\n\nLook at this code:\n\n```javascript\nvar X = 10\nvar Y = \"Charlie\"\
    \n```\n\nThe `10` is the integer (whole number) literal, `Charlie` is the string\
    \ literal, and `X` and `Y` are the identifiers. A literal is the data exactly\
    \ as it is meant to be processed. Whereas an identifier is a name, the literal\
    \ is the value itself.\n\n## NESTED FUNCTIONS\n\nNested refers to something contained\
    \ within something else. This can be a program within a program or sets of instructions\
    \ inside another set of instructions. The parameters of the nested entity are\
    \ explained within the larger (and enveloping) entity. It’s nested because it\
    \ is placed inside something.\n\nEXAMPLE: A nested procedure would be a set of\
    \ commands that are contained within a larger procedure.\n\nIn JavaScript, functions\
    \ have access to the functions that are above them in the code. A nested function\
    \ is a function under another function that is connected somehow. Write and execute\
    \ the following code:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"Counting\"\
    ></p>\n<script>\nfunction Count() {\n  var Starting_point = 9;\n  function Plus_one()\
    \ {\n    Starting_point += 1;\n  }\n  Plus_one();\n  return Starting_point;\n\
    }\n</script>\n</body>\n</html>\n```\n\nSave and execute this code. You should\
    \ get “10.” The `Plus_one()` function was the nested function.\n\n## SCOPE\n\n\
    In programming, code can have `scope`. Simply put, the scope is the functions,\
    \ variables, and objects you have access to. Scope can be limited. Variables have\
    \ scope that they can either be accessed by one, more than one, or all functions\
    \ in a program. The scope of variables is either `local` or `global`.\n\nIn JavaScript,\
    \ a global variable can be accessed from any function within the program, whereas\
    \ a local variable is only accessed by the function it is assigned to. Global\
    \ variables are declared outside of functions, and local variables are declared\
    \ inside of functions. A global variable would be written as follows (write and\
    \ execute the following code):\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    var X = 10;\nfunction Add_numbers_1() {\n  document.write(20 + X + \"<br>\");\n\
    }\nfunction Add_numbers_2() {\n  document.write(X + 100);\n}\nAdd_numbers_1();\n\
    Add_numbers_2();\n</script>\n</body>\n</html>\n```\n\nSave and execute your code.\
    \ It should return “30” and “110.” The variable `X` was assigned the value 10\
    \ outside of our function, but we still accessed it—therefore, the above is an\
    \ example of a global variable.\n\nNow, let’s try a local variable. Write and\
    \ execute the following code:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\n\
    function Add_numbers_1() {\n  var X = 10;\n  document.write(20 + X + \"<br>\"\
    );\n}\nfunction Add_numbers_2() {\n  document.write(X + 100);\n}\nAdd_numbers_1();\n\
    Add_numbers_2();\n</script>\n</body>\n</html>\n```\n\nSave and execute your code.\
    \ This time, it should only return “30” because the variable was local—meaning\
    \ it was written within the function `Add_numbers_1` and couldn’t be accessed\
    \ outside of it. Let’s say you wrote the above code and didn’t understand why\
    \ `Add_numbers_2` didn’t display a result. We could use the `console.log()` to\
    \ help us debug our code. Change your code to the following:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\nfunction Add_numbers_1() {\n  var X = 10;\n\
    \  document.write(20 + X + \"<br>\");\n}\nfunction Add_numbers_2() {\n  console.log(X);\n\
    \  document.write(X + 100);\n}\nAdd_numbers_1();\nAdd_numbers_2();\n</script>\n\
    </body>\n</html>\n```\n\nWait, the `console.log(X)` in `Add_numbers_2` will show\
    \ `undefined` because `X` is local to `Add_numbers_1`.\n\n## Challenge\n- Write\
    \ your own function that uses `console.log()`.\n\n# EIGHTEEN CONDITIONAL STATEMENTS\n\
    \n`if` statements are a type of code that executes if a condition is true. Write\
    \ and execute the following code:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <script>\nif (true) {\n  document.write(\"This is true\");\n}\n</script>\n</body>\n\
    </html>\n```\n\n`if` statements are what we use to make decisions. If the condition\
    \ is false, the code inside the block will not run.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\nif (false) {\n  document.write(\"This is true\");\n\
    }\n</script>\n</body>\n</html>\n```\n\n`else if` statements allow you to check\
    \ multiple conditions if the first `if` is false. Write and execute the following\
    \ code:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nif (5 > 10) {\n\
    \  document.write(\"5 is true\");\n} else if (5 > 2) {\n  document.write(\"5 is\
    \ greater than 2\");\n} else {\n  document.write(\"else\");\n}\n</script>\n</body>\n\
    </html>\n```\n\n`else` statements are used to execute code if none of the `if`\
    \ or `else if` conditions are met.\n\n`if` and `else` statements are used to control\
    \ the flow of a program by executing code based on a condition being true.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nif (10 > 5) {\n  document.write(\"\
    10 is greater than 5\");\n} else {\n  document.write(\"10 is not greater than\
    \ 5\");\n}\n</script>\n</body>\n</html>\n```\n\n## Comparison operators\n\nComparison\
    \ operators are used to compare two values. They include:\n- `==` (equal to)\n\
    - `!=` (not equal)\n- `>` (greater than)\n- `<` (less than)\n- `>=` (greater than\
    \ or equal to)\n- `<=` (less than or equal to)\n\n## Logical operators\n\nLogical\
    \ operators are used to combine multiple conditions. They include:\n- `&&` (AND)\n\
    - `||` (OR)\n- `!` (NOT)\n\n# NINETEEN STRING METHODS\n\nAs covered earlier, programming\
    \ languages have certain data types built into them. These are the most basic\
    \ data types and are referred as primitive data types. One of the key traits of\
    \ a primitive type is that it cannot be simplified any further. A primitive data\
    \ type is a predefined type of data that is built into the language. There are\
    \ five primitive types in JavaScript—these are: string, number, Boolean, null,\
    \ and undefined. Everything else (non-primitive data types) is an object. Objects\
    \ are created by the programmer, not predefined and built into the language. JavaScript\
    \ has string methods that allow you to perform tasks with strings.\n\n### CONCAT\
    \ METHOD\n\nThe `concat()` method concatenates (connects) two or more strings.\
    \ Write and execute the following code:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<p id=\"Concatenate\"></p>\n<script>\nvar part_1 = \"I have \";\nvar part_2\
    \ = \"made this \";\nvar part_3 = \"into a complete \";\nvar part_4 = \"sentence.\"\
    ;\nvar whole_sentence = part_1.concat(part_2, part_3, part_4);\ndocument.getElementById(\"\
    Concatenate\").innerHTML = whole_sentence;\n</script>\n</body>\n</html>\n```\n\
    \nSave and execute your code. It should display the sentence as a whole.\n\n###\
    \ SLICE METHOD\n\nThe `slice()` method is a string method that extracts a section\
    \ of a string and then returns the extracted section in a new string. Write and\
    \ execute the following code:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p\
    \ id=\"Slice\"></p>\n<script>\nvar Sentence = \"All work and no play makes Johnny\
    \ a dull boy.\";\nvar Section = Sentence.slice(27,33);\ndocument.getElementById(\"\
    Slice\").innerHTML = Section;\n</script>\n</body>\n</html>\n```\n\nSave and execute\
    \ your code. The numbers choose which characters in your string will be cut out\
    \ and displayed. This code should display “Johnny.”\n\nThere are many other string\
    \ methods you can use, but the above two should give you a good idea of how they\
    \ operate.\n\n## Challenge\n- Find three other string methods and write an example\
    \ for each.\n"
  raw: '​ The && operator determines the logic between values or variables, such as
    verifying that ___ and ___ are true (both must be true to return “true.” If one
    or both is false, the code will return “false”). Write and execute the following
    code:<!DOCTYPE html><html><body><script>document.write(5 > 2 && 10 > 4);</script></body></html>Our
    code returns “true” because five is greater than two, and ten is greater than
    four. We can make our code return “false” by changing one or both of the comparisons,
    such as:<!DOCTYPE html><html><body><script>document.write(5 > 10 && 10 > 4);</script></body></html>The
    || (or) operator means what it sounds like and is best described through utilization.
    Write and execute the following code:<!DOCTYPE html><html><body><script>document.write(5
    > 10 || 10 > 4);</script></body></html>​ Save and execute your code. It returned
    “true” because, while 5 is not greater than 10, 10 is greater than 4\. We can
    make it return “false” with the following code since neither is true:<!DOCTYPE
    html><html><body><script>document.write(5 > 10 || 10 > 20);</script></body></html>​
    The ! (not) operator checks whether or not something is true. If ___ is not present,
    “true” will be returned. Write and execute the following code:<!DOCTYPE html><html><body><p
    id="Not"></p><script>document.getElementById("Not").innerHTML = !(5 > 10);</script></body></html>Save
    and run your code. And of course, if you want a “double negative,” write and execute
    the following code:<!DOCTYPE html><html><body><p id="Not"></p><script>document.getElementById("Not").innerHTML
    = !(20 > 10);</script></body></html>SECTION FIFTEENTERNARY OPERATORS​ ​ Ternary
    means “made up of three parts.” A ternary operator operates on three values. It
    can be used to assign a value to a variable based on a condition. This is also
    referred to as a conditional operator in that it assigns a value to a variable
    based on a condition.​ ​ The syntax of this is:Name_of_variable = (condition)
    ? Value_1:Value_2​ ​ The ternary operator is “?”. Write and execute the following
    code:<!DOCTYPE html><html><body><script>document.write(Bigger = (5 > 1) ? "Left
    number is bigger":"Right number is bigger");</script></body></html>​ ​ We said
    that if it’s true that 5 is bigger than 1, display “Left number is bigger.” If
    you change the numbers or flip the symbol to <, we can change the outcome of our
    code.Here is something more elaborate that we can do with ternary operators:<!DOCTYPE
    html><html><body><p>Riders must be at least 52 centimeters tall to ride.</p><input
    id="Height" value="52" /><button onclick="Ride_Function()">Click here</button><p
    id="Ride"></p><script>function Ride_Function() {var Height, Can_ride;Height =
    document.getElementById("Height").value;Can_ride = (Height < 52) ? "You are too
    short":"You are tall enough";document.getElementById("Ride").innerHTML = Can_ride
    + " to ride.";}</script></body></html>​ Input is a command that has the user input
    data.END OF SECTION CHALLENGE●         Write your own ternary operator.SECTION
    SIXTEENOBJECT-ORIENTED PROGRAMMINGA constructor is a special part of a common
    computer programming tool called a class. Classes are used in a type of computer
    programming called “object-oriented programming."As we covered earlier, in the
    world around you, you are surrounded by objects—your dog, the TV, etc. Objects
    have state and behavior. The state of an object would be the size, color, etc.
    The behavior of an object would be what the object does—the actions it takes.
    In object-oriented programming, objects are parts of computer programs. They share
    a similarity to real life objects: they have a state and behavior.You create these
    objects by creating what are called “classes" using the programming language.
    This would be created by making (or “declaring”) a class called a “Customer” class.
    It is important to know that when you first create this class, you are describing
    the POTENTIAL characteristics and behavior of that TYPE of thing—you still need
    to create an actual one of those things. This process is called “creating an INSTANCE”
    of the class, where “instance” means “an actual one” of the things described when
    you declared the class.A class can have a constructor. The constructor is a special
    part of the class that describes the default state of any new instance of the
    class that gets created. In other words, it gives default values for the properties
    of the class.EXAMPLE: Let’s say you had a class called “Customer.” The computer
    code to create the “customer” class might look something like this:class Customer{string
    FullName;Boolean Active;}Now let’s say that whenever you created a new instance
    of the “customer” class, you wanted it to be an active customer—in other words,
    you wanted the property “Active” to be set to “true.”To do this, you would make
    a constructor for the “customer” class. It would be a small subprogram, inside
    the class, that would be used every time an instance of the “customer” class was
    created.The constructor might look something like this:Customer(string name){Fullname
    = name;Active = true;}The entire class would look like this:class Customer{string
    FullName;Boolean Active;Customer(string name){Fullname = name;Active = true;}}The
    constructor would be used by asking for an instance of the “customer” class to
    be created and passing along the desired name of the customer.The call to create
    the instance of the class would look like this:Customer cust = new Customer(“Brenda
    Smith”);This creates a new instance of the “customer” class using the constructor
    inside the class. The constructor uses the “Brenda Smith” it was given to set
    the value of the property “FullName” and uses the instruction in the constructor
    to set the property “Active” to “true.”The new instance of the “customer” class,
    which is the variable “cust” here, will, therefore, have the properties:FullName
    = “Brenda Smith”Active = true​ Note: The above code is given as an example and
    is not meant to be executed. We will create a constructor soon.KEYWORDS​ As discussed
    earlier, JavaScript keywords identify actions to be performed. For example: var
    is a keyword we use to assign variables.Another type of keyword is the “new” keyword,
    which is used to create new objects.We also have the “this” keyword. The “this”
    keyword indicates the object that is the owner of the code. When used in an object,
    the value of “this” is the object. When used with a function, the value of “this”
    is the object that possesses the function.We just covered a lot of information
    about constructors, the “new” keyword, the “this” keyword, and more. Now, let’s
    put them to use in a practical way!<!DOCTYPE html><html><body><p id="Keywords_and_Constructors"></p><script>function
    Vehicle(Make, Model, Year, Color) {this.Vehicle_Make = Make;this.Vehicle_Model
    = Model;this.Vehicle_Year = Year;this.Vehicle_Color = Color;}var Jack = new Vehicle("Dodge",
    "Viper", 2018, "Red");var Emily = new Vehicle("Jeep", "Trail Hawk", 2017, "White
    and Black");var Erik = new Vehicle("Ford", "Pinto", 1971, "Mustard");document.getElementById("Keywords_and_Constructors").innerHTML
    = "Erik drives a " + Erik.Vehicle_Color + "-colored " + Erik.Vehicle_Model + "
    manufactured in " + Erik.Vehicle_Year;</script></body></html>​ Remember how we
    talked about “constructors”? Well, the function “Vehicle” in our code is an object
    constructor.​ We recommend that you glance back at the earlier data in this section
    about constructors, classes, objects, the “this” keyword, and the “new” keyword
    and figure out what each of these is in our above code.RESERVED WORDS​ In JavaScript,
    there are certain words you can’t use as variables, labels (names assigned to
    sections of code), and functions. Examples of reserved words are: “true” and “false.”If
    you’re interested, here is a link to a list of the reserved words in JavaScript:https://www.w3schools.com/js/js_reserved.asp​
    The reason you cannot use these words is that they already mean something else.END
    OF SECTION CHALLENGE●         Create a class●         Create a constructor●        
    Use the “new ” keyword●         Use the “this” keyword.SECTION SEVENTEENIDENTIFIERS
    & LITERALS​ An “identifier” is a name for something. In JavaScript, identifiers
    are the names of variables, functions, keywords, and labels. In the following
    code, “X” is the identifier:var X = 10​ In contrast to an identifier, a literal
    is something that represents a value within source code. Source code is the version
    of a computer program as it is originally written (i.e., typed into a computer
    in some programming language) by the designer of the program. Normally, when the
    programmer is done making the program, he has the computer convert the code he
    wrote the program in (the “source code”) to another format that is easier and
    faster for the computer to use. In that new format, the program can''t be easily
    understood by people—but it is very useful to the computer. It also can''t be
    modified by other programmers at that point.​ Look at this code:var X = 10var
    Y = “Charlie”​ The 10 is the integer (whole number) literal, Charlie is the string
    literal, and “X” and “Y” are the identifiers.​ A literal is the data exactly as
    it is meant to be processed. Whereas an identifier is a name, the literal is the
    value itself.NESTED FUNCTIONS​ Nested refers to something contained within something
    else. This can be a program within a program or sets of instructions inside another
    set of instructions. The parameters of the nested entity are explained within
    the larger (and enveloping) entity. It’s nested because it is placed inside something
    else.EXAMPLE: A nested procedure would be a set of commands that are contained
    within a larger procedure.​ In JavaScript, functions have access to the functions
    that are above them in the code. A nested function is a function under another
    function that is connected somehow .Write and execute the following code:<!DOCTYPE
    html><html><body><p id="Counting"></p><script>document.getElementById("Counting").innerHTML
    = Count();function Count() {var Starting_point = 9;function Plus_one() {Starting_point
    += 1;}Plus_one();return Starting_point;}</script></body></html>​ Save and execute
    this code. You should get “10.” The Plus_one() function was the nested function.SCOPE​
    In programming, code can have “scope.” Simply put, the scope is the functions,
    variables, and objects you have access to. Scope can be limited. Variables have
    scope in that they can either be accessed by one, more than one, or all functions
    in a program. The scope of variables is either “local” or “global.”​ In JavaScript,
    a global variable can be accessed from any function within the program, whereas
    a local variable is only accessed by the function it is assigned to.​ Global variables
    are declared outside of functions, and local variables are declared inside of
    functions.​ A global variable would be written as follows (write and execute the
    following code):<!DOCTYPE html><html><body><script>var X = 10;function Add_numbers_1()
    {​ document.write(20 + X + "<br>");}function Add_numbers_2() {​ document.write(X
    + 100);}Add_numbers_1();Add_numbers_2();</script></body></html>​ Save and execute
    your code. It should return “30” and “110.” The variable X was assigned the value
    10 outside of our function, but we still accessed it—therefore, the above is an
    example of a global variable. As a note, <br> is the break tag and creates a line
    break in text (like pressing enter on your keyboard).Now, let’s try a local variable.
    Write and execute the following code:<!DOCTYPE html><html><body><script>function
    Add_numbers_1() {​ var X = 10;​ document.write(20 + X + "<br>");}function Add_numbers_2()
    {​ document.write(X + 100);}Add_numbers_1();Add_numbers_2();</script></body></html>​
    Save and execute your code. This time, it should only return “30” because the
    variable was local—meaning it was written within the function Add_numbers_1 and
    couldn’t be accessed outside of it. Let’s say you wrote the above code and didn’t
    understand why Add_numbers_2 didn’t display a result. We could use the console.log()
    to help us debug our code. Change your code to the following:<!DOCTYPE html><html><body><script>function
    Add_numbers_1() {​ var X = 10;​ console.log(15 + X);}function Add_numbers_2()
    {console.log(X + 100);}Add_numbers_1();Add_numbers_2();</script></body></html>​
    Save and execute your code. You’ll notice that no result is shown. Open the console,
    and there it is! It gives you the error “X is not defined.”END OF SECTION CHALLENGE●
            Write your own nested function●         Assign a local variable●        
    Assign a global variableSECTION EIGHTEENCONDITIONAL STATEMENTS​ “If statements”
    are a type of conditional statement that specifies that a section of code is to
    be executed if a condition is true.​ Write and execute the following code:<!DOCTYPE
    html><html><body><script>if (1 < 2) {document.write("The left number is smaller
    than the number on the right.")}</script></body></html>​ Save and execute your
    code. Since 1 is smaller than 2, the statement should appear. We can also get
    creative with “if” statements. Write and execute the following code:<!DOCTYPE
    html><html><body><p id="Greeting">How are you this evening?</p><script>if (new
    Date().getHours() < 18) {document.getElementById("Greeting").innerHTML = "How
    are you today?";}</script></body></html>​ We said that if it is later than (greater
    than) 6:00 p.m., display “How are you this evening?” If you wrote this code earlier
    than 6:00 p.m. in the day, “How are you today?” will display.​ As a note: The
    Date().getHours() method returns the hour in the specified date according to the
    local time, and the hours are listed as integers between 0 and 23\. For example:
    18 is equal to 6:00 p.m., 12 is noon, etc.​ So, what if we want two choices?ELSE
    STATEMENTS​ The else statement specifies a block of code that will be executed
    if the condition is false (opposite of the if statement).​ Write and execute the
    following code:<!DOCTYPE html><html><body><p>Write your age:</p><input id="Age"
    value="" /><p id="How_old_are_you?"></p><button onclick="Age_Function()">Click
    here</button><script>function Age_Function() {Age = document.getElementById("Age").value;​
    if (Age >= 18) {​ Vote = "You are old enough to vote!";}else {​ Vote = "You are
    not old enough to vote!";}document.getElementById("How_old_are_you?").innerHTML
    = Vote;}</script></body></html>​ Save and execute your code. Now, what if we want
    even more choices?ELSE IF STATEMENTS​ The “else if” statement follows an “if”
    statement and is executed if the “if” statement is found to be false. For example:
    If hungry, eat. Else if thirsty, drink. Else, rest. Write and execute the following
    code:<!DOCTYPE html><html><body><p id="Time_of_day"></p><script>function Time_function()
    {var Time = new Date().getHours();var Reply;if (Time < 12 == Time > 0) {Reply
    = "It is morning time!";}else if (Time > 12 == Time < 18) {Reply = "It is the
    afternoon.";}else {Reply = "It is evening time.";}document.getElementById("Time_of_day").innerHTML
    = Reply;}Time_function();</script></body></html>​ Save and run your code. The
    program should pull the time from your computer and tell you what time of day
    it is!END OF SECTION CHALLENGE●       Write your own function that contains an
    “if” statement, “else if” statement and “else” statement.SECTION NINETEENSTRING
    METHODS​ As covered earlier, programming languages have certain data types built
    into them. These are the most basic data types in the programming language and
    are referred to as primitive data types. One of the key traits of a primitive
    data type is that it cannot be simplified any further. A primitive data type is
    a predefined type of data that is built into the language.​ There are five primitive
    data types in JavaScript—these are: string, number, Boolean, null, and undefined.​
    Everything else (non-primitive data types) is an object. Objects are created by
    the programmer, not predefined and built into the programming language.​ JavaScript
    has string methods that allow you to perform tasks with strings.CONCAT() METHOD​
    The concat() method concatenates (connects) two or more strings. Write and execute
    the following code:<!DOCTYPE html><html><body><p id="Concatenate"></p><script>var
    part_1 = "I have ";var part_2 = "made this ";var part_3 = "into a complete ";var
    part_4 = "sentence.";var whole_sentence = part_1.concat(part_2, part_3, part_4);document.getElementById("Concatenate").innerHTML
    = whole_sentence;</script></body></html>​ Save and execute your code. It should
    display the sentence as a whole.SLICE() METHOD​ The slice() method is a string
    method that extracts a section of a string and then returns the extracted section
    in a new string. Write and execute the following code:<!DOCTYPE html><html><body><p
    id="Slice"></p><script>var Sentence = "All work and no play makes Johnny a dull
    boy.";var Section = Sentence.slice(27,33);document.getElementById("Slice").innerHTML
    = Section;</script></body></html>​ Save and execute your code. The numbers choose
    which characters in your string will be cut out and displayed. This code should
    display “Johnny.”​ There are many other string methods you can use, but the above
    two should give you a good idea of how they operate.END OF SECTION CHALLENGEYou
    will now be assigned some tasks we haven’t taught yet—see if you can find the
    solutions with a bit of online research:'
