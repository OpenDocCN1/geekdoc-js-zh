    - `-Infinity`

    - `NaN`


    ## SECTION TWELVE: BOOLEAN LOGIC

    George Boole was an English mathematician, educator and philosopher. He was the
    father of Boolean logic. Boolean logic is a form of logical analysis in which
    the only possible results of a decision are “true” and “false.” In Boolean logic,
    there aren’t any vague or “almost” answers to a calculation or decision.


    Boolean logic is especially important for the construction and operation of digital
    computers because it is relatively easy to create a machine where the result of
    an operation is either “true” or “false.” This is done by comparing two or more
    items—items that can only be “true” or “false.” Some examples of the types of
    comparisons that are performed are “AND” and “OR.”


    They are used like this: `[true/false condition #1] AND [true/false condition
    #2]`. That is an example of a Boolean comparison, using the Boolean operator `AND`.
    In Boolean logic, the `AND` operator (a symbol used to carry out a computation—logical
    operators like “and,” “or,” and “not” are used to evaluate whether an expression
    is true or false) is used to see whether ALL the true/false conditions are “true”
    or not. If ALL of them are “true,” then the answer to the overall comparison is
    “true.” If any of the true/false conditions are not “true,” then the answer to
    the overall comparison is “false.”


    **EXAMPLE**: `[6 > 3] AND [22 <= 23]`. In this Boolean comparison, each of the
    true/false conditions is “true”—six is greater than three, and twenty-two is less
    than or equal to twenty-three. Therefore, the answer to the overall Boolean comparison
    (`AND`) is “true.”


    **EXAMPLE**: `[6 > 3] AND [22 > 23]`. In this Boolean comparison, only one of
    the true/false conditions is “true”—six is greater than three, but twenty-two
    is not greater than twenty-three. Therefore, the answer to the overall Boolean
    comparison (“AND”) is “false.”


    In computers, this becomes valuable because we can build very precise instructions
    for the computer that allow it to make the same decisions we would make if we
    didn’t have the computer as a tool—but the computer can make those decisions very
    quickly and can perform many such decisions in a very short period of time—much
    faster than a person can.


    **EXAMPLE**: We have a computer program that needs to evaluate a class of students
    to determine which ones qualify for a special course. The qualifications for the
    course are that the student must be at least 16 years old, and their grade point
    average must be above 3.40. The Boolean comparison we program into the computer
    might look something like this: `[age >= 16] AND [GPA > 3.40]`. The Boolean values
    in JavaScript are true and false. Write and execute the following code (this can
    be done in a new document):


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    document.write(10 > 2);

    </script>

    </body>

    </html>

    ```

    Save and execute this code. You should see “true” displayed because it is true
    10 is larger than 2. If we change our code to the following, we will see “false”:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    document.write(10 < 2);

    </script>

    </body>

    </html>

    ```


    ## CONSOLE.LOG METHOD

    The `console.log` method can be used to display data in the console within the
    browser. The console is a tool you can use within your browser to debug code.
    You can access the console in a few ways:

    a. clicking `F12` and then clicking “Console,”

    b. clicking the three dots in the top-right of the browser and then clicking “More
    tools.”


    Finally, click “Developer tools” and then click “Console.” Write and execute the
    following:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    console.log(2 + 2);

    </script>

    </body>

    </html>

    ```

    Save and run your code. Don’t see anything? That’s because it’s displayed in the
    console. Open the console, and you should see “4.”


    ## COERCION

    In English, “coercion” means to force or persuade someone, typically by threats
    or punishment. Type coercion in JavaScript is when operands of an operator are
    different data types (such as “string” and “number”—like `"five" + 5`). The type
    coercion converts the value to the type it chooses. Let’s try this out. Write
    and execute the following:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    document.write("10" + 5);

    </script>

    </body>

    </html>

    ```

    Many other programming languages would return an error if we were to include two
    data types within an operation.


