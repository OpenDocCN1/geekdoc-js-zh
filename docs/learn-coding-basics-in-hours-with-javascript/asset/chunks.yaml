    我们显示了与键 "Sound" 关联的值 “Bark!”。


    ## 作为单词形式的运算符

    大多数运算符是以符号形式书写的：例如 `+`、`-`、`/` 等。但有些运算符是单词形式。`delete` 运算符就是这样一个例子。将你之前的代码修改为以下内容：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Delete"></p>

    <script>

    var Animal = {Species:"Dog",Sex:"Male",Age:5,Sound:"Bark!"};

    delete Animal.Sound;

    document.getElementById("Delete").innerHTML = Animal.Sound;

    </script>

    </body>

    </html>

    ```

    保存并执行你的代码。


    ## 运算符类型

    此运算符返回变量的数据类型。编写并执行以下代码：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <script>

    document.write(typeof "This is a string");

    </script>

    </body>

    </html>

    ```

    保存并执行你的代码。它返回了 “string”。


    ## 章节挑战

    - 创建一个键值对字典。

    - 使用 `delete` 运算符从你的字典中删除一个键值对。

    - 尝试创建一个两个值对具有相同键的键值对字典。看看会发生什么。

    - 使用 `typeof` 运算符确定你代码中某个部分的数据类型。


    ## 第十一章：浮点数

    浮点数是表示大数字的一种特定方式。与其写出整个数字，你可以写出它的部分，以及一个乘以它的因子——这样通过执行乘法，你将得到与完整写出的数字基本相同的数字。当你这样做时，你移动了数字中的小数点；因此被称为“浮点”（floating
    point）。


    **示例**：取数字三千四百二十五。正常写法是：`3425`；用浮点数表示法写，它可以是：`3.425 x 10³`。由于 `10³` 是 `1000`，这意味着“3.425
    乘以 1000”，即 `3425`。


    “float”（浮点）是计算机使用的一种数据类型。“float”类型用于存储具有极精度的数字。它主要用于数学目的。


    **注意**：当你在数字末尾看到 `E` 时，它意味着“10 的给定幂”。“指数”（exponent）是数字相乘的幂。例如，`10⁴` 意味着 10 的四次方——即
    10,000（10 乘以 10 乘以 10 乘以 10）。在这种情况下，`4` 就是指数。


    假设我们想用更短的方式来写 100,000。我们可以写成 `10E4`。`10E4` 意味着 `10⁴`（10 乘以 10 四次）。在 JavaScript
    中，所有数字都是浮点数，浮点数的限制是 `1.797693134862315E+308`（这意味着 JavaScript 无法处理更大的浮点数）。任何大于
    `1.797693134862315E+308` 的数字都被视为“无穷”（infinity）。


    ## 数字

    在 JavaScript 中，有 3 个被视为数字但实际行为并不相同的唯一值。它们是：

    - `NaN`（“Not a Number”的缩写）

    - `Infinity`（正无穷）

    - `-Infinity`（负无穷）


    理解这些值的最好方法是让它们投入运行。这里有一个示例——在一个新文档编写并执行以下内容：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Not_a_Number"></p>

    <script>

    document.getElementById("Not_a_Number").innerHTML = 0/0;

    </script>

    </body>

    </html>

    ```

    保存并执行你的代码。结果是 `NaN`，因为你不能将 0 除以 0。我们可以使用 `isNaN()` 函数来检查某物是否为数字。在一个新的文本文件中，输入并执行以下内容：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Not_a_Number"></p>

    <script>

    document.getElementById("Not_a_Number").innerHTML = isNaN(''Hello World'');

    </script>

    </body>

    </html>

    ```

    保存并运行你的代码。如你所见，结果是 “true”，因为 “Hello World” 不是数字。让我们将代码改为以下内容：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Not_a_Number"></p>

    <script>

    document.getElementById("Not_a_Number").innerHTML = isNaN(''Hello World'');

    </script>

    </body>

    </html>

    ```

