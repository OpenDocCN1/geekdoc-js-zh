- fmt: "\nYour browser will use this HTML to display a web page that might look something\
    \ like this:\n![](image_rsrc2BD.jpg)\n\nIn this section, we will be writing HTML\
    \ and JavaScript together. This way, you can see how they work together. Additionally,\
    \ when you state that you know JavaScript, most assume that means you know HTML.\
    \ Now that `Notepad++` is installed on your machine:\n\n1. Launch `Notepad++`\n\
    2. Click on `File` on the menu bar and open a New File (or just press `Ctrl +\
    \ N`).\n\n## “HELLO, WORLD” IN HTML \n\nThe first code that developers usually\
    \ write when learning a new language is to make the computer display the text:\
    \ “Hello world.” We are going to first use HTML to do this.\n\nInside `Notepad++`,\
    \ write the following code:\n```html\n<!DOCTYPE HTML><html><body>Hello, world!</body></html>\n\
    ```\n\nSave this document by clicking on “File,” then “Save As.” Name the document\
    \ `Test.html` and ensure you click on “Hypertext Markup Language” under “Save\
    \ as type.” Also, make sure you save this file to your desktop.\n\nNow, click\
    \ “Run” and then “Launch in Chrome” (from now on in this book, when we say “run”\
    \ or “execute” your code, we mean to “Launch it in Chrome”). Congratulations!\
    \ You made the browser display the text “Hello, world!” (For `Brackets`, you’ll\
    \ click “File” and then “Live Preview.”)\n\nNow, to define the code you wrote:\
    \ `<!DOCTYPE HTML>` isn’t a tag. It is an instruction to the browser telling it\
    \ you’re using HTML—there are other doctypes (types of documents) you could use,\
    \ so clarifying that helps the browser out.\n\nAs we mentioned earlier, the `/`\
    \ symbol denotes an “end tag.” \n\nThe `<html>` tag is inserted at the beginning\
    \ of your code, and all your HTML code is contained in between it and the end\
    \ tag (`</html>`). The `<body>` tag denotes where you can add the contents of\
    \ an HTML document, such as text, images, videos, lists, links, etc. In this case,\
    \ we included text.\n\n## “HELLO, WORLD” IN JAVASCRIPT \n\nNow, there are two\
    \ ways we can add JavaScript to this document. The first way is to just write\
    \ the code inside the HTML document as follows:\n```html\n<!DOCTYPE HTML><html><script>alert(\"\
    Hello, World!\");</script></html>\n```\n\nSave and execute this code. As a note:\
    \ When we say “execute” here, we mean “Run the code in Google Chrome (click ‘Run,’\
    \ then ‘Launch in Chrome’).” You should always save your code before running it.\n\
    \nGood job! We just made a pop-up! `<script>` means we are inserting a script,\
    \ and this is where we write our JavaScript code. `alert` is a method that displays\
    \ an alert box with an “OK” button.\n\nAs a note: an “object” is something that\
    \ has state and behavior. A “method” is something an object can do—a named sequence\
    \ of events. A method should always have a meaningful name such as `CalculateIncomeTax`.\n\
    \nAlso, did you notice we created a string? As we mentioned earlier, strings are\
    \ one of the six types of value. In JavaScript, we can create strings with double\
    \ quotes (`\"`) or single quotes (`'`), such as: “Mary had a little lamb,” or\
    \ ‘Its fleece was white as snow.’ In our above code, “Hello, World!” is a string.\
    \ It doesn’t matter whether you use double or single quotes; they both perform\
    \ the same functions.\n\nThere’s another way we can do this; that’s by connecting\
    \ our code to an external file, i.e., an HTML file with your HTML code, and a\
    \ separate file containing your JavaScript code. Here’s how that would work. First,\
    \ create a new file and write the following code:\n```javascript\nalert(\"Hello,\
    \ World!\");\n```\nSave this file on your desktop. Save it as “Test_1,” as a “JavaScript\
    \ file” (i.e., click `File`, Save As, write “Test_1” as the File name, and then\
    \ click on JavaScript file under “Save as type”). Now, go back to your original\
    \ HTML document and write the following code:\n```html\n<!DOCTYPE HTML><html><script\
    \ src=\"test_1.js\"></script></html>\n```\n\nSave and execute the code. Now, the\
    \ benefit to what we did here is, we separated our HTML code from our JavaScript.\
    \ This can be useful for large projects.\n\n## WINDOW.ALERT() \n\nWe can cause\
    \ an alert window to pop up using the `window.alert()` method. Delete your previous\
    \ code in `Notepad++`; then write, save and execute the following:\n```html\n\
    <!DOCTYPE html><html><body><script>window.alert(\"Hello, world!\");</script></body></html>\n\
    ```\n\n## DOCUMENT.WRITE() \n\nYou can also display text in JavaScript using the\
    \ `document.write()` method. Delete your previous code in `Notepad++`; then write,\
    \ save and execute the following:\n```html\n<!DOCTYPE html><html><body><script>document.write('Hello,\
    \ world!');</script></body></html>\n```\n\nAs you can see, there is more than\
    \ one way to do things in programming—problems have multiple solutions!\n\n##\
    \ END OF SECTION CHALLENGE \n\nWrite a program that includes the following:\n\
    - Use an external JavaScript file (`<script src = “ > attribute*) and `document.write()`\
    \ to display text of your choosing.\n*An attribute is a specification that assigns\
    \ a property to something. Basically, an attribute is metadata (data that describes\
    \ other data—“meta” means “beyond”).*\n\n## SECTION SIX: VARIABLES AND STRINGS\
    \ \n\nA common thing to do in coding is to assign variables. Variables are key\
    \ in every programming language. We defined the term earlier, and to put the definition\
    \ simply: it’s a value that can be altered, depending on conditions or data passed\
    \ to the program.\n\nIn mathematics, an operator is a symbol used to carry out\
    \ a computation. There are several different kinds of operators. Arithmetic operators\
    \ such as `+`, `-`, `/`, `*`, and `%` are used to perform math functions. Operators\
    \ such as `>=`, `==`, and `!=` are used to compare values. Logical operators like\
    \ \"and,\" \"or,\" and \"not\" are used to evaluate whether an expression is true\
    \ or false. In JavaScript, the assignment operator is `=`; it is used to assign\
    \ value to a variable. For example, to say that `X = 10` in JavaScript, we are\
    \ assigning the variable `X` the value `10`.\n\nLet’s assign a variable in JavaScript.\
    \ Delete your old code and write the following:\n```html\n<!DOCTYPE html><html><body><script>var\
    \ X = \"Hello, world!\"document.write(X);</script></body></html>\n```\n\nSave\
    \ and execute this code. We assigned variable `X` to string value “Hello, world!”\
    \ Note: the syntax for assigning variables in JavaScript is `var _ =`.\n\n## CREATE\
    \ A STRING \n\nThere are some characters and functions that cannot easily be put\
    \ within quotes when writing strings in JavaScript. For example, what if you wanted\
    \ to display: Sally said, “I don’t want to go”? You not only have additional quotation\
    \ marks around Sally’s statement, but you also have the single quote (apostrophe)\
    \ within “don’t.”\n\nThe solution to this problem is to add a backslash (`\\`)—this\
    \ is referred to as “escaping” the character and tells the computer that the character\
    \ that follows has a special meaning. For example: `\\\"` quote mark(s) will not\
    \ end the string but instead be printed on the screen.\n\nAlso, if you want to\
    \ start a new line, you can use the HTML `<br>`, which is like pressing Enter.\
    \ Let’s try this out. Delete your old JavaScript code and write the following:\n\
    ```html\n<!DOCTYPE html><html><body><script>document.write(\"Lisa told Bart, \\\
    \"Knock it off, Or'll tell dad!\\\"<br>Eat my shorts!\");</script></body></html>\n\
    ```\n\n## CONCATENATING A STRING \n\nConcatenate means to connect things together,\
    \ like links in a chain. It means to take one piece of data and stick it on the\
    \ end of another piece of data. For example: concatenating the text “device” and\
    \ the text “s” makes the text “devices.” To concatenate a string in JavaScript,\
    \ you use the `+` operator. Delete your JavaScript code and write the following:\n\
    ```html\n<!DOCTYPE html><html><body><script>document.write(\"\\\"Be who you are\
    \ and say what you feel,\"+ those who mind don’t matter and those who matter don’t.\\\
    \"+\"-Dr. Seuss\");</script></body></html>\n```\n\n## MULTIPLE VARIABLES \n\n\
    You can also assign multiple variables in one statement. Write execute the following:\n\
    ```html\n<!DOCTYPE html><html><body><script>var Family = \"The Areinis\", Dad\
    \ = \"Jeremiah\", Mom = \"Hermoine\", Daughter = \"Penny\", Son = \"Zorro\";document.write(Dad);</script></body></html>\n\
    ```\n\n## FONTCOLOR(\"\") \n\nA cool thing we can do with our strings is change\
    \ the font color using the `fontcolor` method. Open a `Notepad ++` document and\
    \ write the following:\n```html\n<!DOCTYPE html><html><body><script>var blues\
    \ = \"I have the blues.\";var blues =.fontcolor(\"blue\");document.write(blues);</script></body></html>\n\
    ```\n\n## END OF SECTION CHALLENGE \n\nWrite a program that includes the following:\n\
    - Assign several variables and display one utilizing the `document.write()` method\n\
    - Create a string, concatenate a string and change the font color\n\n## SECTION\
    \ SEVEN: EXPRESSIONS AND STATEMENTS \n\nExpressions are numbers, symbols, and\
    \ operators grouped together that show the amount of something. An expression\
    \ is a written problem. In computers, an expression is a combination of values\
    \ that are computed by the computer. There are different ways to write out expressions,\
    \ depending on which language you are programming. EXAMPLE: `Name = \"What person\
    \ types in the box\"` could be an expression. Also `x + 5` is an expression.\n\
    \nStatements are computer instructions. These are the instructions that are used\
    \ by people as they create computer programs. The simplest of these might be things\
    \ like \"print,\" \"delete,\" \"add,\" \"multiply,\" etc. The \"print\" statement\
    \ tells your computer to print whatever you typed as part of the. In JavaScript,\
    \ expressions and statements are different things. An expression results in a\
    \ value, while a statement performs a task—a program is basically a series of\
    \ statements. There are basically two types of expressions: ones that have a value\
    \ (or result in a value) and ones that assign a value to a variable.\n\nThe following\
    \ JavaScript code would be an expression: `3 + 3`\n```javascript\ndocument.write(3\
    \ + 3);\n```\nThat is a statement. `3 + 3` is also an expression. As a note, semicolons\
    \ separate statements.\n\n## END OF SECTION CHALLENGE \n\n- Write an expression\n\
    - Write a statement\n- Write a statement that contains an expression Note Ensure\
    \ the above statements and expressions display a result.\n\n## SECTION EIGHT:\
    \ FUNCTIONS \n\nA JavaScript function is a repeatable block of code that executes\
    \ certain actions and performs tasks. You execute a function by calling it. This\
    \ is also called “invoking” the function. In JavaScript, a `function` keyword\
    \ identifies actions to be performed. One writes a JavaScript function with the\
    \ keyword `function`, then a name, then parentheses. Functions are valuable because\
    \ of code reusability—you can invoke functions over and over. Since functions\
    \ in JavaScript contain properties and methods, they are basically objects. Functions\
    \ are useful so you don’t have to keep re-typing code; you can instead invoke\
    \ the function whenever needed.\n\n## DOCUMENT.GETELEMENTBYID \n\nTags are the\
    \ markup language words that surround the actual content on an HTML page. A tag\
    \ usually has two parts, a start tag and an end tag. They tell the computer what\
