    注意，在上面的列表中，你不能有第二个使用键 "HIS" 的键值对（Key-Value Pair），因为在给定的键值对集合中，键必须是唯一的。JavaScript
    不包含字典类型，但我们可以使用对象来创建一个字典。在一个新的文本文件中，编写以下代码：


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Dictionary"></p>

