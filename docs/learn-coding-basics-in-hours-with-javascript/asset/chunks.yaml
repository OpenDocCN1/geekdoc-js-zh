- fmt: "\n# 6. End this procedure\n\n## Instruction\nA command or set of commands\
    \ entered into a computer that performs a certain operation. Instructions control\
    \ a computer and tell it what to do.\n**EXAMPLE**: You could make a computer draw\
    \ a square by typing in instructions.\n\n## Program\nPrograms are written instructions\
    \ entered into the computer that make it perform certain tasks. Programs are the\
    \ things on a computer that you interact with to get things done. You use a program\
    \ of one sort or another for basically everything you do on your computer, whether\
    \ that is checking the weather or looking up banking information. There are countless\
    \ programs that people have created over the years to do countless different things.\n\
    **EXAMPLE**: “Paint” is a program on many computers that allows users to draw\
    \ and color things.\n\n## Programmer\nA computer programmer is someone who can\
    \ create computer programs. Another term for programmer is `developer`. A programmer\
    \ can type exact commands and instructions in a computer to create many of the\
    \ things we use computers for on a day-to-day basis.\n**EXAMPLE**: `Microsoft\
    \ Word` (a program mainly used to type documents) was created by programmers.\n\
    \n## Programming Language\nIn order to understand the term “programming language,”\
    \ you will need to understand the term “language.” Languages are communication\
    \ systems that allow you to transfer ideas in written and spoken words. Programming\
    \ languages are organized systems of words, phrases, and symbols that let you\
    \ create programs. Programming languages are also called computer languages.\n\
    \nThere are many different types of programming languages, each of which was created\
    \ to fill a specific purpose. Usually, a language is created in order to make\
    \ the creation of certain types of computer programs easier.\n**EXAMPLE**: `Python`\
    \ is a popular computer language. This is how you would tell a computer to display\
    \ the words “Hello, world!” on the screen using the computer language `Python`:\n\
    \n```\nprint (“Hello, world!\")\n```\n\n## Machine Language\nA machine instruction\
    \ is an instruction to your computer written in a form the `CPU` can understand—machine\
    \ code or machine language. Machine language is data that is composed of a series\
    \ of 1s and 0s; computers are operated using 1s and 0s since it is very easy to\
    \ make a machine that only has to differentiate between two different states.\n\
    \nWhen computers are manufactured, the `CPU` is made so it will obey certain instructions\
    \ and perform exact actions when given those instructions. The machine instructions\
    \ are available from the manufacturer of the computer.\n**EXAMPLE**: Let's say\
    \ “10010100 01101011 01011011 01010110” told the computer to “Delete the file\
    \ called `Vacation.doc`.” “10010100 01101011 01011011 01010110” is a machine instruction.\
    \ It is difficult for people to read and write in machine language since the instructions\
    \ are just unique patterns of ones and zeroes.\n\n## Low-level language\nA low-level\
    \ language is a programming language that is at the same level as or just above\
    \ machine language in terms of readability—that is, it uses codes to represent\
    \ specific machine language instructions or different combinations of machine\
    \ language instructions. These codes are not the ones and zeros of machine language;\
    \ rather, they might look like this:\n\n```\nMOV AL, 61h\n```\nThis might be codes\
    \ that mean “store the amount 97 in a special location in the `CPU` for later\
    \ use.” This is more readable than ones and zeros of machine language but is still\
    \ not very easy to work in.\n\n## Code\nThere are a couple of definitions for\
    \ “code.” The first is: what you type into a computer to make programs. Code is\
    \ written in specialized computer languages. Coding means typing out instructions\
    \ (using a particular computer language) to make a program that will make the\
    \ computer perform certain actions.\n**EXAMPLE**: You can write code that makes\
    \ a computer game. \n\nCode can also mean a system where you use a symbol to represent\
    \ another thing.\n**EXAMPLE**: Airports are often referred to by three-letter\
    \ codes—the Portland International Airport in Portland, Oregon, USA has the three-letter\
    \ code “PDX.” So here, `PDX` is a code that represents the Portland International\
    \ Airport.\n\n## Operating System\nAbbreviated `OS`. An operating system is a\
    \ special-purpose computer program that supports the computer’s basic functions,\
    \ such as scheduling tasks, running other computer programs, and controlling peripherals\
    \ (external devices such as keyboards, mice, and displays).\n\nMost computer programs\
    \ will require that an operating system already be installed on a computer before\
    \ they can function on that computer. Nearly all computers available today come\
    \ with an operating system already installed when they are purchased. Computer\
    \ manufacturers install the operating system before they sell a computer. Some\
    \ operating systems are free; others are available for a fee.\n\nOne of the most\
    \ well-known and popular operating systems in the world is called `Windows`. It\
    \ is created and sold by the technology company `Microsoft`. Other popular operating\
    \ systems are: `OS X` (created by the technology company `Apple`; it is used on\
    \ their desktop computers and laptops), `Linux` (a family of free and for-fee\
    \ operating systems; it is used on desktop computers and laptops), `Android` (owned\
    \ by the technology company `Google`; it is used on mobile devices like smartphones),\
    \ and `iOS` (created by `Apple`; it is used on their mobile devices like the iPhone\
    \ and iPad).\n**EXAMPLE**: `Windows 10` is a popular operating system.\n\n## Network\n\
    A network is a system where two or more computers are connected to each other.\
    \ The computers can be connected by a cable (wired) or connected wirelessly. Network\
    \ is the word used to describe a link between things that are working together.\
    \ Networks are used in many different ways with computers.\n**EXAMPLE**: Information\
    \ can be shared from computer to computer through the use of a network.\n\n##\
    \ Internet\nThe Internet is two things: an interconnected network of many computers\
    \ around the world and a set of methods or protocols for transferring different\
    \ types of data between those computers. This is the basic definition of the Internet.\
    \ A detailed description follows.\n\nA `protocol` is a formal description of how\
    \ a certain type of information will be formatted and handled. Basically, it’s\
    \ an agreement that the various people who work with that type of information\
    \ all adhere. Protocols are usually described in written documents and are very\
    \ precise. They are usually created by experts in the industry. An example of\
    \ a type of data where a `protocol` would be valuable is if various organizations\
    \ in the industry were to transfer data back and forth between computers, it would\
    \ be important that they all agree about things like the exact format of the information,\
    \ how to keep private safe, etc.\n\nThe Internet is a network of connected computers,\
    \ and there are lots of different types of data that can be sent back and forth\
    \ between these computers—things like electronic messages, electronic records,\
    \ etc. One or more protocols have been created for each type of data that can\
    \ be transferred around the Internet. All of that would be laid down in written\
    \ protocol. Several such protocols exist in the industry.\n**EXAMPLE**: A bank\
    \ could devise a `protocol` for how to format and exchange financial data between\
    \ its headquarters and various branches and then use computers connected to the\
    \ Internet.\n\n## World Wide Web\nAbbreviated `WWW`; usually referred to as “the\
    \ Web.” To understand what the World Wide Web is, you need to know about these\
    \ terms: `website`, `web page`, and `web server`. The Web is a collection of linked\
    \ electronic documents organized into groups called websites accessed by connecting\
    \ to the Internet. The computers involved in the operation of the Web are connected\
    \ to the Internet.\n\nA `website` is composed of one or more individual `web pages`,\
    \ where a “page” is an organized document containing text, images, and other elements.\
    \ The electronic files that make up a `website` are stored on specialized computers\
    \ called `web servers`. These computers accept requests from other (remote) computers\
    \ for specific web pages and deliver those files needed to make the web page display.\
    \ The type of program you would use to view web pages is called a `web browser`.\
    \ It is this program that would make the requests to the web server for the website\
    \ files.\n**EXAMPLE**: There are websites on the World Wide Web dedicated to the\
    \ films of actors.\n\n## JavaScript\n`JavaScript` is a computer language that\
    \ is able to work on most computers. It is useful for making websites. `JavaScript`\
    \ is used mainly to make websites more dynamic (describing websites that have\
    \ content that changes based on user action or other factors rather than being\
    \ static). There are many other uses for `JavaScript`; it is used in the creation\
    \ of many types of computer programs.\n**EXAMPLE**: `JavaScript` can be used to\
    \ make videos that start to play as soon as a user moves their mouse over the\
    \ video.\n\n# Section Three: What is Coding?\n\nCoding is computer programming.\
    \ It is the act of creating computer programs, which are prepared sets of computer\
    \ instructions to accomplish certain tasks. Programming consists of typing exact\
    \ commands and instructions into a computer to create many of the things we use\
    \ on a day-to-day basis. To do computer programming, you must learn various programming\
    \ languages and use these languages to create things on a computer that others\
    \ can use.\n**EXAMPLE**: The program on your computer entitled “calculator,” which\
    \ you can use to do math, is the result of computer programming.\n\nCoding also\
    \ refers to the creation of websites. Another word for these programs is `software`.\
    \ This is because the actual computer (the physical machine) is called `hardware`.\
    \ Therefore, the programs that run on that machine are called `software`. The\
    \ terms “coding” and “development” mean the same thing as programming. A `software\
    \ developer` is a computer programmer; so is a `coder`.\n\nProgramming is a spectacular\
    \ thing because it is one of the few skills that apply to virtually all industries.\
    \ Yes, companies that create `software` definitely utilize coding the most—but\
    \ if you think about it, most industries utilize technology (`software`, databases,\
    \ etc.). And so, coders are valuable assets for companies in any industry—construction,\
    \ food service, transportation, etc. There are many programming languages, and\
    \ technology is ever-changing. The whole thing can be quite overwhelming, but\
    \ there are basics that apply across the landscape of technology. In general,\
    \ the instructions in computer programs are executed in order, from the top down.\n\
    \n# Five Elements\nThere are five key elements to any computer program:\n1. `Entrance`\n\
    2. `Control/branching`\n3. `Variables`\n4. `Sub Program`\n5. `Exit`\n\n## Entrance\n\
    1. Entrance\nA computer is a simple machine when you get down to it. It can only\
    \ do one thing at a time, and it performs a computer program's instructions in\
    \ the exact order in which the computer programmer puts them. It can only execute\
    \ (perform or run) an instruction if it is directed to.\n\nThis means that any\
    \ computer program has to have a clearly marked “first instruction.” This is the\
    \ first task that the computer will perform when the computer program is started.\
    \ From that point forward, each instruction in the program will direct the computer\
    \ what instruction to perform next after it performs the current instruction.\
    \ There are different ways to specify the entrance point, depending on which computer\
    \ programming language is being used—but every computer program has a defined\
    \ entrance point.\n\n## Control/Branching\n2. Control/Branching\nComputers are\
    \ often used to automate actions that would otherwise be performed by people.\
    \ One of the most common things a person will be asked to do in performing a job\
    \ is to assess the condition of a thing and, based on the condition of that thing,\
    \ choose between two or more possible courses of action. In other words, they\
    \ will have to make a decision. An example would be the activity of \"a teacher\
    \ grading a stack of papers\":\n* Take the next student paper from the top.\n\
    * Grade the paper.\n* Write the grade on the paper.\n* If the grade is 70% or\
    \ higher, put the paper in a \"Passed\" stack.\n* If the grade is below 70%, put\
    \ the paper in a \"Failed\" stack.\n\nYou can see that there are two “paths” here.\
    \ A path is a fork in the road. In order to do this, the program will make use\
    \ of special instructions called “control.” These are just instructions that tell\
    \ the computer what to do. The most fundamental control statement for a computer\
    \ is `if`.\n\n```\nIF [condition] THEN [branching]\n```\n\n## Variables\n3. Variables\n\
    A variable is a piece of data that a computer program uses to keep track of values\
    \ that can change as the program is executed. This might be something like “the\
    \ grade of the student paper that was graded” or \"the color of paint to use for\
    \ the next car on the assembly line.”\n\nVariables are a vital part of any computer\
    \ program because they make it so a computer program can be used for more than\
    \ a single, predetermined set of values. You can imagine that if \"the color of\
    \ paint to use for the next car on the assembly line\" was only able to be “blue,”\
    \ the computer program using that data wouldn't be very useful. It would make\
    \ a lot more sense to make it so the computer program could change that value\
    \ for each car that was going to be.\n\nWhen you are writing variables in a computer\
    \ program, they usually are written in a manner like: `[name of the variable]\
    \ = [value of the variable]`. For example, you might have something like this:\
    \ `color = \"red\"`. Here, the variable is named `color`, and the value of that\
    \ variable has been set to “red.” In other words, the variable named `color` is\
    \ now “equal” to the word “red.”\n\nLet's look at the example of “a teacher grading\
    \ a stack of papers.” Here, we could have a variable called `Paper Grade` that\
    \ changed each time the teacher graded a paper. You could also have variables\
    \ for the total number of questions on the paper (`Total Questions`), for the\
    \ number of questions the student answered correctly (`Correct Questions`), and\
    \ for the grade of the paper.\n\nThe written description from above:\n* Take the\
    \ next student paper from the top of the \"To Be Graded\" stack.\n* Grade the\
    \ paper.\n* Write the grade on the paper.\n* If the grade is 70% or higher, put\
    \ the paper in a \"Passed\" stack.\n* If the grade is below 70%, put the paper\
    \ in a \"Failed\" stack.\n\nIn computer language, the procedure might look something\
    \ like this:\n"
