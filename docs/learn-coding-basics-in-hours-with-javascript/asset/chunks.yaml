    - **Step 1**: Count how many papers are in the "to be graded" stack and set the
    value of the `Total Papers` variable to that number.

    - **Step 2**: Create a variable called `Counter` and set it to the value zero.
    This variable will be used to keep track of how many papers are graded.

    - **Step 3**: Use the control statement `if` to see if we should execute a loop.

    - **Step 3a–3g**: Grade the paper; this has been covered above.

    - **Step 3h**: Since we have now graded a paper, add one to our `Counter` variable.

    - **Step 3i**: Go to the top of the loop, where we check to see if we need to
    execute the loop all over again.


    Let''s see what would happen if we used this program to grade two papers. Let''s
    say that the papers look like this:


    **Paper 1:**

    - Total questions on the paper: 100

    - Total questions that were answered correctly: 95


