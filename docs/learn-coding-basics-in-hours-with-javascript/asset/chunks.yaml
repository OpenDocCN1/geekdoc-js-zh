  trans: "\n你的浏览器将使用此 HTML 显示一个网页，其外观可能像这样：\n![](img/image_rsrc2BD.jpg)\n\n在本节中，我们将共同编写\
    \ HTML 和 JavaScript。通过这种方式，你可以看到它们是如何协同工作的。此外，当你表示你懂 JavaScript 时，大多数人认为这意味着你懂\
    \ HTML。现在你的机器上已经安装了 `Notepad++`：\n\n1. 启动 `Notepad++`\n2. 点击菜单栏上的 `File`（文件）并打开新文件（New\
    \ File）（或直接按 `Ctrl + N`）。\n\n## HTML 中的“HELLO, WORLD” \n\n开发者在学习新语言时通常编写的第一段代码是让计算机显示文本：“Hello\
    \ world”（你好，世界）。我们将首先使用 HTML 来来实现。\n\n在 `Notepad++` 中，编写以下代码：\n```html\n<!DOCTYPE\
    \ HTML><html><body>Hello, world!</body></html>\n```\n\n点击“File”（文件），然后点击“Save\
    \ As”（另存为）保存此文档。将文档命名为 `Test.html`，并确保在“Save as type”类型下点击“Hypertext Markup Language”（超文本标记语言）。此外，确保将此文件保存到桌面。\n\
    \n现在，点击“Run”（运行），然后点击“Launch in Chrome”（在 Chrome 中启动）（在本书以后，当我们说“运行”或“执行”你的代码时，我们的意思是“在\
    \ Chrome 中启动它”）。恭喜！你让浏览器显示了文本“Hello, world!”（对于 `Brackets`，你需要点击“File”然后点击“Live\
    \ Preview”）。\n\n现在，来定义你写的代码：`<!DOCTYPE HTML>` 并不是一个标签。它是告诉浏览器的指令，告诉它你正在使用 HTML——还有其他你可以使用的\
    \ doctypes（文档类型），因此澄清这一点有助于浏览器。\n\n正如我们早之前提到的，`/` 符号表示“结束标签”。\n\n`<html>` 标签插入在你代码的开头，你所有的\
    \ HTML 代码都包含在它和结束标签（`</html>`）之间。`<body>` 标签表示你可以在此处添加 HTML 文档的内容，例如文本、图像、视频、列表、链接等。在例中，我们包含了文本。\n\
    \n## JAVASCRIPT 中的“HELLO, WORLD” \n\n现在，有两种方法可以向此文档中添加 JavaScript。第一种是直接在 HTML\
    \ 文档中按如下方式编写代码：\n```html\n<!DOCTYPE HTML><html><script>alert(\"Hello, World!\"\
    );</script></html>\n```\n\n保存并执行此代码。注意：当我们在这里说“执行”时，我们的意思是“在 Google Chrome 中运行代码（点击‘Run’，然后点击‘Launch\
    \ in Chrome’）”。你应该在运行代码之前始终保存代码。\n\n干得好！我们刚刚创建了一个弹窗！`<script>` 意味着我们正在插入一个脚本，这就是我们编写\
    \ JavaScript 代码的地方。`alert` 是一个显示带有“OK”按钮的警报框的方法。\n\n注意：“对象”（object）是某些具有状态和行为的事物。“方法”（method）是对象可以执行的操作——一个具命名的事件序列。一个方法应该始终有一个有意义的名称，例如\
    \ `CalculateIncomeTax`。\n\n此外，你注意到我们创建了一个字符串吗？正如我们早之前提到的，字符串是六种值类型之一。在 JavaScript\
    \ 中，我们可以使用双引号（`\"`）或单引号（`' `）来创建字符串，例如：“Mary had a little lamb，”或‘Its fleece was\
    \ white as snow.’。在我们上面的代码中，“Hello, World!”是一个字符串。无论你使用双引号还是单引号都没有关系；它们都执行相同的功能。\n\
    \n我们还有另一种方法可以做到；那就是通过将我们的代码连接到外部文件，即一个包含你 HTML 代码的 HTML 文件，和一个包含你 JavaScript 代码的独立文件。以下是它的工作原理。首先，创建一个新文件并编写以下代码：\n\
    ```javascript\nalert(\"Hello, World!\");\n```\n将此文件保存到桌面。将其保存为“Test_1”，类型选择为“JavaScript\
    \ file”（即：点击 `File`，`Save As`，在文件名处输入“Test_1”，然后在“Save as type”类型下点击 JavaScript\
    \ file）。现在，回到你原始的 HTML 文档并编写以下代码：\n```html\n<!DOCTYPE HTML><html><script src=\"\
    test_1.js\"></script></html>\n```\n\n保存并执行代码。现在，我们在这里所做操作的好处是，我们将 HTML 代码和 JavaScript\
    \ 分离开开了。这对于大型项目非常有用。\n\n## WINDOW.ALERT() \n\n我们可以使用 `window.alert()` 方法让警报窗口弹出。删除你在\
    \ `Notepad++` 中之前的代码；然后编写、保存并执行以下内容：\n```html\n<!DOCTYPE html><html><body><script>window.alert(\"\
    Hello, world!\");</script></body></html>\n```\n\n## DOCUMENT.WRITE() \n\n你也可以使用\
    \ `document.write()` 方法在 JavaScript 中显示文本。删除你在 `Notepad++` 中之前的代码；然后编写、保存并执行以下内容：\n\
    ```html\n<!DOCTYPE html><html><body><script>document.write('Hello, world!');</script></body></html>\n\
    ```\n\n正如你所看到的，编程中有一种多种方法来完成任务——问题有多种解决方案！\n\n## 章节结束挑战 \n\n编写一个包含内容的程序：\n- 使用外部\
    \ JavaScript 文件（`<script src = “ > 属性*`）和 `document.write()` 显示你选择的文本。\n*属性（attribute）是为某物分配属性的规范。基本上，属性是元数据（描述其他数据的数据——“meta”意味着“超越”）。*\n\
    \n## 第六节：变量与字符串\n\n编码中常见的操作是赋值变量。变量在每种编程语言中都是关键的。我们之前定义过这个术语，简单来说：它是一个可以更改的值，取决于条件或传递给程序的数据。\n\
    \n在数学中，运算符是用于执行计算的符号。有几种不同类型的运算符。算术运算符如 `+`、`-`、`/`、`*` 和 `%` 用于执行数学函数。如 `>=`、`==`\
    \ 和 `!=` 等运算符用于比较值。逻辑运算符如“and”、“or”和“not”用于评估表达式是真是假。在 JavaScript 中，赋值运算符是 `=`；它被用于给变量赋值。例如，在\
    \ JavaScript 中说 `X = 10`，意味着我们正在给变量 `X` 赋值值 `10`。\n\n让我们在 JavaScript 中分配一个变量。删除你的旧代码并编写以下内容：\n\
    ```html\n<!DOCTYPE html><html><body><script>var X = \"Hello, world!\"document.write(X);</script></body></html>\n\
    ```\n\n保存并执行此代码。我们给变量 `X` 赋值值“Hello, world!”。\n\n此外，你注意到我们创建了一个字符串吗？正如我们早之前提到的，字符串是六种值类型之一。在\
    \ JavaScript 中，我们可以使用双引号（`\"`）或单引号（`' `）来创建字符串，例如：“Mary had a little lamb，”或‘Its\
    \ fleece was white as snow.’。在我们上面的代码中，“Hello, World!”是一个字符串。无论你使用双引号还是单引号都没有关系；它们都执行相同的功能。\n\
    \n我们还有另一种方法可以做到；那就是通过将我们的代码连接到外部文件，即一个包含你 HTML 代码的 HTML 文件，和一个包含你 JavaScript 代码的独立文件。（此处原文似乎存在逻辑错乱或重复，翻译已按语意对齐）\n\
    \n## 创建字符串\n\n有些字符和函数在编写 JavaScript 字符串时不能轻易地放在引号内。例如，如果你想显示：Sally said, “I’t\
    \ want to go”？这个问题的解决方法是添加反斜杠（`\\`）——这被称为“转义”（escaping）字符，它告诉计算机后面的字符具有特殊含义。\n\
    \n此外，如果你想换行，可以使用 `<br>`，这就像按回车键。让我们尝试一下。删除你的旧代码并编写以下内容：\n```html\n<!DOCTYPE html><html><body><script>document.write(\"\
    Lisa told Bart, \\\"Knock it off, \\<br>Eat my shorts!\");</script></body></html>\n\
    ```\n\n## 字符串拼接\n\n拼接（concatenate）意味着将事物连接在一起，就像链中的项。它意味着将一段数据附加到另一段数据的末尾。例如：拼接文本“device”和文本“s”会得到“devices”。在\
    \ JavaScript 中拼接字符串，你使用 `+` 运算符。删除你的 JavaScript 代码并编写以下内容：\n```html\n<!DOCTYPE\
    \ html><html><body><script>document.write(\"Be who you are and say what you feel,\"\
    + those who mind don’t matter and those who matter’t.\");script></body></html>\n\
    ```\n\n你也可以在一个语句中分配多个变量。执行以下内容：\n```html\n<!DOCTYPE html><html><body><script>var\
    \ Family = \"Theinis\", Dad = \"Jeremiah\", Mom = \"Hermoine\", Daughter = \"\
    Penny\", Son = \"Zorro\";</script></body></html>\n```\n（注：此处原文文本较为混乱）\n\n## FONTCOLOR\n\
    \n我们可以对字符串做的一件很酷的事情是使用 `fontcolor` 方法更改字体颜色。打开 `Notepad++` 文档并编写以下内容：\n```html\n\
    <!DOCTYPE html><html><body><script>var Family = \"Theinis\", Dad = \"Jeremiah\"\
    , Mom = \"Hermoine\", Daughter = \"Penny\", Son = \"Zorro\";document.write(Dad);</script></body></html>\n\
    ```\n（注：此处原文逻辑重复）\n\n## 多变量\n\n编写一个包含以下内容的程序：\n- 分配几个变量\n- 利用 `document.write()`\
    \ 方法创建一个字符串拼接字符串并更改字体颜色\n```html\n<!DOCTYPE html><html><body><script>var blues\
    \ = \"I have the blues.\";.fontcolor(\"blue\");</script></body></html>\n```\n\
    （注：此处原文逻辑重复）\n\n## 第七节：表达式与语句\n\n表达式是数字、符号和运算符组合在一起显示某物。在计算机中，表达式是经计算的值的组合。有不同的编写表达式的方法，取决于你正在使用的语言。例如：`Name\
    \ = \"What\"` 可能是一个表达式。此外 `x + 5` 是一个表达式。\n\n语句是计算机指令。人们在创建程序时使用这些指令。最简单的语句可能是“print”（打印）、“delete”（删除）、“add”（添加）、“multiply”（乘）等。“print”语句告诉计算机打印你输入的任何。在\
    \ JavaScript 中，表达式和语句是不同的事物。表达式产生一个值，而语句执行一个任务——程序基本上是一系列语句。基本上有两种类型的表达式：具有值的（或产生一个值的）以及给变量赋值的。在\
    \ JavaScript 中赋值变量的语法是 `var _ =`。\n\n以下 JavaScript 代码将产生一个表达式：\n```javascript\n\
    document.write(3 + 3);\n```\n这是一个语句。`3 + 3` 也是一个表达式。注意：分号（`;`）分隔语句。\n\n## 章节结束挑战\n\
    \n- 编写一个表达式\n- 编写一个语句\n- 编写一个包含表达式的语句\n- 确保上面的语句和表达式显示一个结果。\n\n## 第八节：函数\n\nJavaScript\
    \ 函数是一段可重复的块块，它执行某些操作并完成任务。你通过调用它来执行函数。这也被称为“调用”（invoking）函数。在 JavaScript 中，`function`\
    \ 关键字标识要执行的操作。使用 `function` 关键字、一个名称、然后是括号编写 JavaScript 函数。函数的价值在于代码的可重用——你可以反复调用函数。由于\
    \ JavaScript 函数包含属性和方法，它们基本上是对象。函数很有用，因为你不需要不断重新输入代码；你可以在需要时调用函数。\n\n## DOCUMENT.GETELEMENTBYID\n\
    \n标签是包围 HTML 页面实际内容的标记语言单词。一个标签通常有两个部分：开始标签和结束标签。它们告诉计算机如何处理开始标签和结束标签之间的文本。在 HTML\
    \ 中，“元素”（element）是一段代码，包括开始和结束标签。例如：`<body>Welcome to my website!</body>` 就是一个元素。\n\
    \n`document.getElementById` 方法返回一个元素。该元素有一个分配了特定值的 `ID` 属性。它主要用于控制或从代码中的元素获取信息。如果找不到具有指定值的元素，它将返回\
    \ `null`。一旦我们付诸行动，你就会更好地理解它！\n\n我们现在创建一个函数并使用 `document.getElementById()` 方法。首先，在\
    \ `Notepad++` 中打开你的 HTML 代码 (`Test.html`) 并编写以下内容：\n```html\n<!DOCTYPE html><html><body><button\
    \ onclick=\"My_First_Function()\">Click me!</button><p id=\"Irish\"></p><script>function\
    \ My_First_Function() {var String = \"Kiss me, I'm Irish!\";var result = String.fontcolor(\"\
    green\");document.getElementById(\"Irish\").innerHTML =result;}</script></body></html>\n\
    ```\n\n阅读你的代码并尝试弄清楚我们刚刚做了什么。\n首先，HTML 中的 `<p>` 标签简单意味着“段落”（paragraph）。\n我们创建了一个按钮元素。我们随后利用了\
    \ `ID` 属性并给按钮元素分配了值“Irish”。大括号 `{ }` 内部的所有都是我们的函数。我们通过调用早之前分配的 `Irish` 值（在编写 `ID`\
    \ 属性时）返回了按钮元素。\n呼！如果你在理解方面有任何困难，可以玩玩并尝试一些你自己的。\n\n## += 运算符\n\n你也可以使用 `+=` 运算符来拼接字符串。编写并执行以下内容：\n\
    ```html\n<!DOCTYPE html><html><body><p id=\"Concatenate\"></p><script>Sentence\
    \ = \"I am learning \";Sentence += \"a lot from this!\";document.getElementById(\"\
    Concatenate\").innerHTML = Sentence;</script></body></html>\n```\n\n## 章节挑战\n\n\
    编写一个包含以下内容的程序：\n- 函数\n- `getElementById()` 方法\n\n## 第 N 节：数字\n\n为了简单，我们将 HTML\
    \ 和 JavaScript 分开。首先，在 `Notepad++` 中打开你的文件 (`Test.html`) 并确保代码如下：\n```html\n<!DOCTYPE\
    \ HTML><html><body><p id=\"Math\"></p><script src=\"test_1.js\"></script></body></html>\n\
    ```\n从现在起，我们将此文件称为“HTML 代码”。正如我们之前讨论的，另一种值类型是“数字”。JavaScript 使用数字。算术运算符包括 `+`、`-`、`/`\
    \ 和 `*`。我们可以使用这些执行算术。现在，打开你的文件 (`test_1.js` —— 称为“JavaScript 代码”）并编写以下内容：\n```javascript\n\
    var Simple_Math = 2 + 2;document.getElementById(\"Math\").innerHTML = \"2 + 2\
    \ = \" + Simple_Math;\n```\n现在，如果你运行代码，它将正常工作。因为你需要运行 HTML 代码。\n\n## 减法\n\n让我们做一些减法——编辑你的\
    \ JavaScript 代码：\n```javascript\nvar Simple_Math = 5 - 2;document.getElementById(\"\
    Math\").innerHTML = \"5 - 2 = \" + Simple_Math;\n```\n\n## 乘法\n\n这是如何相法的——编辑你的\
    \ JavaScript 代码：\n```javascript\nvar Simple_Math = 6 * 8;document.getElementById(\"\
    Math\").innerHTML = \"6 * 8 = \" + Simple_Math;\n```\n\n## 除法\n\n我们可以除法——编辑你的\
    \ JavaScript 代码：\n```javascript\nvar Simple_Math = 4 / 6;document.getElementById(\"\
    Math\").innerHTML = \"4 / 6 = \" + Simple_Math;\n```\n\n## 多重算术运算符\n\n假设你想同时乘、减、加数字。编辑你的\
    \ JavaScript 代码如下：\n```javascript\nvar Simple_Math = (1 + 2) * 10 / 2 - 5;document.getElementById(\"\
    Math\").innerHTML = \"1 plus 2, multiplied by 10, divided in half then subtracted\
    \ by 5 equals \" + Simple_Math;\n```\n\n## 模运算\n\n模运算寻找两个数字之后的余数。记得数学中的吗？余数是除后剩余的数量。例如：`5\
    \ ÷ 2` 会有一个余数。另外两个术语是“除数”（被除数）和“除数”（除以数）。在我们的例子中，`5` 是除数，`2` 是除数。模是在除数被除数除后的余数。`%`\
    \ 符号表示模运算符。让我们使用它。打开你的 JavaScript 代码并编写以下内容：\n```javascript\nvar Simple_Math =\
    \ 25 % 6;document.getElementById(\"Math\").innerHTML = \"When you divide 25 by\
    \ 6 you have remainder of: \" + Simple_Math;\n```\n\n## 一元与二进制运算符\n\n“一元”意味着拥有、组成或作用于一个组件、项或元素。操作数是在数学运算中处理的数字。它不是对数字的操作，而是数字本身。例如：在\
    \ `5+6` 中，操作数是 `5` 和 `6`。`+` 是运算符。一元运算符是包含单个操作数的运算。它的例子是 `+ 5`。二进制运算符是需要两个操作的操作——一个在前一个在后。它的例子是\
    \ `5 + 5`。有一个一元运算符被称为“取反运算符”。它返回事物的相反或负形式。让我们在一个文本文档中写这个：\n```html\n<!DOCTYPE\
    \ html><html><body><p id=\"Negation\"></p><script>var x = 10;document.getElementById(\"\
    Negation\").innerHTML = -x;</script></body></html>\n```\n注意：取反运算符的语法是 `-x`。\n\n\
    ## 增运算符\n\n递增是对某物的添加或增加。“递增”意味着增加。JavaScript 中的递增运算符写为 `++` 并向上计数。编写并执行以下内容：\n\
    ```html\n<!DOCTYPE html><html><body><script>var X = 5;X++;document.write(X);</script></body></html>\n\
    ```\n保存并执行你的代码——它从 5 增到了 6。它的相反是递减运算符。编写并执行以下内容：\n```html\n<!DOCTYPE html><html><body><script>var\
    \ X = 5.25;X--;document.write(X);</script></body></html>\n```\n这应该显示为“4.25。”\n\
    \n## MATH.RANDOM()\n\n要返回 0 到 1 之间的随机数，编写以下代码：\n```html\n<!DOCTYPE html><html><body><script>window.alert(Math.random());</script></body></html>\n\
    ```\n注意：如果你想在 ___ 和 ___ 之间显示随机数（例如从 0 到 100），编写并执行以下代码：\n```html\n<!DOCTYPE html><html><body><script>window.alert(Math.random()\
    \ * 100);</script></body></html>\n```\n\n## 章节结束挑战\n\n- 使用二进制运算符\n- 使用一元运算符\n\
