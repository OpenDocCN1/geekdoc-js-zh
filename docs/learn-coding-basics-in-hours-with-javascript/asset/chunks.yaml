    2. 穿上衬衫。


    3. 看着镜子里的自己。


    4. 决定你是否喜欢穿这件衬衫的样子。如果你喜欢这个样子，就留着衬衫跳到第 6 步。如果你不喜欢，就把衬衫脱掉，放回衣柜里拿出来的地方。


    5. 重复步骤 1–5，直到你对衣柜里的每件衬衫都做出了决定。

