    ## Methods


    1. Utilize the `toUpperCase()` method.

    2. Utilize the `search()` method.


    ## NUMBER METHODS


    Number methods assist you in working with numbers. There are several, and we will
    use a couple in this section. One of these is the `toString()` method that returns
    a number as a string. Write and execute the following code:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Numbers_to_string"></p>

    <script>

    var X =182;

    document.getElementById("Numbers_to_string").innerHTML = X.toString();

    </script>

    </body>

    </html>

    ```

    This code should return “182.”


    ### TOPRECISION METHOD


    The `toPrecision()` method returns a string as a number of a specified length.
    Write and execute the following code:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <p id="Precision"></p>

    <script>

    var X = 12938.3012987376112;

    document.getElementById("Precision").innerHTML =X.toPrecision(10);

    </script>

    </body>

    </html>

    ```

    Save and run your code. You should get “12938.30130.” There are many number methods—the
    above two should give you an idea of how these work.


    ## END OF SECTION


    ### CHALLENGE


    You will now be assigned some tasks we haven’t taught yet—research online for
    solutions:


    1. Utilize the `toFixed()` method.

    2. Utilize the `valueOf()` method.

