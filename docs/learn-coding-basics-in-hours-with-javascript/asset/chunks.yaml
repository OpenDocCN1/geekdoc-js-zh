  trans: "\n`&&` 运算符确定值或变量之间的逻辑关系，例如验证 `___` 和 `___` 是否为真（两者都为真时返回“true”；如果其中一个或两个为假，代码将返回“false”）。编写并执行以下代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>document.write(5 > 2 && 10\
    \ > 4);</script>\n</body>\n</html>\n```\n\n我们的代码返回了“true”，因为 5 大于 2，且 10 大于 4。我们可以通过更改其中一个或两个比较结果来让代码返回“false”，例如：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>document.write(5 > 10 && 10\
    \ > 4);</script>\n</body>\n</html>\n```\n\n`||`（或）运算符的含义正如其字面意思所是，通过其使用场景来描述最为恰当。编写并执行以下代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>document.write(5 > 10 || 10\
    \ > 4);</script>\n</body>\n</html>\n```\n\n保存并执行你的代码。它返回了“true”，虽然 5 并不大于 10，但\
    \ 10 大于 4。我们可以通过以下代码让它返回“false”，因为两者都不为真：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<script>document.write(5 > 10 || 10 > 20);</script>\n</body>\n</html>\n\
    ```\n\n`!`（非）运算符检查某内容是否为真。如果 `___` 不存在（为假），将返回“true”。编写并执行以下代码：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<p id=\"Not\"></p>\n<script>document.getElementById(\"\
    Not\").innerHTML = !(5 > 10);</script>\n</body>\n</html>\n```\n\n保存并运行你的代码。当然，如果你想写一个“双重否定”，请编写并执行以下代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p id=\"Not\"></p>\n<script>document.getElementById(\"\
    Not\").innerHTML = !(20 > 10);</script>\n</body>\n</html>\n```\n\n# 第十五部分：三元运算符\n\
    \n三元（Ternary）意味着“由三部分组成”。三元运算符在三个值上进行操作。它可以用于根据条件为变量赋值。这也被称为条件运算符，因为它根据条件为变量分配一个值。\n\
    \n其语法为：\n`变量名 = (条件) ? 值 1 : 值 2`\n\n三元运算符是 `?`。编写并执行以下代码：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>document.write(Bigger = (5 > 1) ? \"Left number\
    \ is bigger\":\"Right number is bigger\");</script>\n</body>\n</html>\n```\n\n\
    我们提到过，如果 5 大于 1 是真的，就显示“Left number is bigger（左侧数字较大）”。如果你更改数字或将符号改为 `<`，我们就可以更改代码的结果。\n\
    \n这里是使用三元运算符可以做的更复杂的操作：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<p>骑者身高至少达到\
    \ 52 厘米才能骑。</p>\n<input id=\"Height\" value=\"52\" />\n<button onclick=\"Ride_Function()\"\
    >点击这里</button>\n<p id=\"Ride\"></p>\n<script>\nfunction Ride_Function() {\n  var\
    \ Height, Can_ride;\n  Height = document.getElementById(\"Height\").value;\n \
    \ Can_ride = (Height < 52) ? \"你太矮了\":\"你身高足够了\";\n  document.getElementById(\"\
    Ride\").innerHTML = Can_ride + \" 可以骑.\";\n}\n</script>\n</body>\n</html>\n```\n\
    \n输入（Input）是一个包含用户输入数据的命令。\n\n## 章节结束挑战\n- 编写你自己的三元运算符。\n\n# 第十六部分：面向对象编程\n\n\
    构造函数（constructor）是名为 `class`（类）的常用编程工具的一个特殊部分。类被用于称为“面向对象编程”的计算机编程类型。\n\n正如我们之前提到的，在你周围的世界里，你被对象包围着——你的狗、电视等。对象具有状态和行为。对象的状态可能是尺寸、颜色等。对象的行为就是对象所做的——它采取的动作。在面向对象编程中，对象是计算机程序的一部分。它们与现实世界中的对象相似：它们拥有状态和行为。\n\
    \n你通过使用编程语言创建所谓的“类”来创建这些对象。这将通过创建（或“声明”）一个名为 `Customer` 的类来实现。重要的一的一点是，当你第一次创建这个类时，你描述的是那种`类型（TYPE）`事物的潜在特征和行为——你仍然需要创建一个这些事物的实体。这个过程被称为创建类的“实例（INSTANCE）”，其中“实例”意味着当你声明类时所描述的事物的“真实一个”。\n\
    \n一个类可以有一个构造函数。构造函数是类的一个特殊部分，描述了所创建的任何新实例的默认状态。换句话说，它为类的属性赋予了默认值。\n\n示例：假设你有一个名为\
    \ `Customer` 的类。创建 `customer` 类的代码如下：\n\n```javascript\nclass Customer{\n  string\
    \ FullName;\n  Boolean Active;\n}\n```\n\n现在假设每当你创建一个 `customer` 类的实例实例时，你希望将\
    \ `Active` 属性设置为“true”。为了实现这一点，你会为 `customer` 类创建一个构造函数。构造函数是类内部的一个小程序，每当创建 `customer`\
    \ 类的实例时都会被使用。构造函数可能像这样：\n\n```javascript\nCustomer(string name){\n  Fullname =\
    \ name;\n  Active = true;\n}\n```\n\n整个类看起来如下：\n\n```javascript\nclass Customer{\n\
    \  string FullName;\n  Boolean Active;\n  Customer(string name){\n    Fullname\
    \ = name;\n    Active = true;\n  }\n}\n```\n\n构造函数通过请求创建 `Customer` 类的实例并传递所需的名称来使用。创建类实例的调用如下：\n\
    \n```javascript\nCustomer cust = new Customer(\"Brenda Smith\");\n```\n\n注意：上面的代码作为示例，并不是为了执行。我们将很快创建一个构造函数。\n\
    \n## 关键字\n\n正如之前讨论的，JavaScript 关键字标识要执行的操作。例如：`var` 是我们用于分配变量的关键字。另一种关键字是 `new`，用于创建新对象。我们还有\
    \ `this` 关键字。`this` 表示代码的所有者。当用于对象时，`this` 的值是对象本身。当用于函数时，`this` 的值是拥有该函数的对象。\n\
    \n我们涵盖了许多关于构造函数、`new` 关键字、`this` 关键字的信息。现在，让我们实际使用它们吧！\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p id=\"Keywords_and_Constructors\"></p>\n<script>\nfunction Vehicle(Make,\
    \ Model, Year, Color) {\n  this.Vehicle_Make = Make;\n  this.Vehicle_Model = Model;\n\
    \  this.Vehicle_Year = Year;\n  this.Vehicle_Color = Color;\n}\nvar Jack = new\
    \ Vehicle(\"Dodge\", \"Viper\", 2018, \"Red\");\nvar Emily = new Vehicle(\"Jeep\"\
    , \"Trail Hawk\", 2017, \"White and Black\");\nvar Erik = new Vehicle(\"Ford\"\
    , \"into\", 1971, \"Mustard\");\ndocument.getElementById(\"Keywords_and_Constructors\"\
    ).innerHTML = \"Erik 驾驶一辆 \" + Erik.Vehicle_Color + \"-颜色的 \" + Erik.Vehicle_Model\
    \ + \"制造于 \" + Erik.Vehicle_Year;\n</script>\n</body>\n</html>\n```\n\n记得我们讨论过“构造函数”吗？很好，我们代码中的\
    \ `Vehicle` 函数是一个对象构造函数。\n\n## 留关键字\n\n在 JavaScript 中，某些词你不能作为变量、标签（分配给代码段的名称）和函数。保留关键字的例子是\
    \ `true` 和 `false`。如果你感兴趣，这里是 JavaScript 关键字的链接：https://www.w3schools.com/js/js_reserved。你不能使用这些词是因为它们已经有了含义。\n\
    \n## 挑战\n- 创建一个类。\n- 创建一个构造函数。\n- 使用 `new` 关键字。\n- 使用 `this` 关键字。\n\n# 第十七部分：标识符与字面量\n\
    \n标识符（identifier）是一个名称。在 JavaScript 中，标识符是变量、函数和标签的名称。在以下代码中，`X` 是标识符：\n\n```javascript\n\
    var X = 10\n```\n\n与标识符相反，字面量（literal）代表源码中的值。源代码是程序设计者最初编写的计算机版本（即以某种语言输入计算机）。通常，当程序员完成程序制作后，他会将编写的代码转换为计算机更易、更快速使用的格式。在该格式下，人们无法轻松理解程序。注意`<br>`\
    \ 是换行标签，并在文本中创建换行（就像按下键盘上的回车键）。在该这一点它也无法被其他程序员修改。\n\n看这段代码：\n\n```javascript\n\
    var X = 10\nvar Y = \"Charlie\"\n```\n\n`10` 是整数（整数）字面量，`Charlie` 是字符串字面量，而 `X`\
    \ 和 `Y` 是标识符。字面量是按照预期方式处理的数据。而标识符是一个名称，字面量是值本身。\n\n## 嵌套函数\n\n嵌套（Nested）意味着包含在另一个东西内部。这可以是程序中的程序，或者是另一组指令内部的指令集。嵌套实体的参数是在更大的（包裹）实体内部解释的。嵌套是因为它被放置在某个东西内部。示例：嵌套过程是包含在一个过程中的命令集。在\
    \ JavaScript 中，函数可以访问它们上面的函数。嵌套函数是另一个函数下的函数。编写并执行以下代码：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<p id=\"Counting\"></p>\n<script>\nfunction Count() {\n  var Starting_point\
    \ = 9;\n  function Plus_one() {\n    Starting_point += 1;\n  }\n  Plus_one();\n\
    \  return Starting_point;\n}\n</script>\n</body>\n</html>\n```\n\n保存并执行这段代码。你应该得到“10。”`Plus_one()`\
    \ 函数是嵌套函数。\n\n## 作用域\n\n在编程中，代码有作用域（scope）。简单来说，作用域是函数、变量和你可以访问的对象。作用域可以是限制的。变量的作用域是局部（local）或全局（global）。全局变量可以从程序中的任何函数访问，而局部变量只被分配给它的函数访问。全局变量是在函数外部声明的，局部变量是在函数内部声明的。全局变量如下（编写并执行以下代码）：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nvar X = 10;\nfunction Add_numbers_1()\
    \ {\n  document.write(20 + X + \"<br>\");\n}\nfunction Add_numbers_2() {\n  document.write(X\
    \ + 100);\n}\nAdd_numbers_1();\nAdd_numbers_2();\n</script>\n</body>\n</html>\n\
    ```\n\n保存并执行你的代码。它返回“30”和“110”。`X` 被赋值在函数外部，但我们仍然访问了它——因此上面的是全局变量的示例。现在，让我们尝试局部变量。编写并执行以下代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nfunction Add_numbers_1()\
    \ {\n  var X = 10;\n  document.write(20 + X + \"<br>\");\n}\nfunction Add_numbers_2()\
    \ {\n  document.write(X + 100);\n}\nAdd_numbers_1();\nAdd_numbers_2();\n</script>\n\
    </body>\n</html>\n```\n\n保存并执行你的代码。这次它只返回“30”，因为变量是局部的——意味着它是写在 `Add_numbers_1`\
    \ 函数内部的，无法在外部访问。我们可以使用 `console.log()` 来帮助调试代码。将你的代码改为如下：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<script>\nfunction Add_numbers_1() {\n  var X = 10;\n\
    \  document.write(20 + X + \"<br>\");\n}\nfunction Add_numbers_2() {\n  console.log(X);\n\
    \  document.write(X + 100);\n}\nAdd_numbers_1();\nAdd_numbers_2();\n</script>\n\
    </body>\n</html>\n```\n\n等待，`Add_numbers_2` 中的 `console.log(X)` 将显示 `undefined`，因为\
    \ `X` 局部于 `Add_numbers_1`。\n\n## 挑战\n- 编写你自己的使用 `console.log()` 的函数。\n\n# 第十八部分：条件语句\n\
    \n`if` 语句是条件为真时执行的代码类型。编写并执行以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <script>\nif (true) {\n  document.write(\"This is true\");\n}\n</script>\n</body>\n\
    </html>\n```\n\n`if` 语句是我们用来做决策的方式。如果条件为假，块内的代码将不会运行。\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<script>\nif (false) {\n  document.write(\"This is true\");\n\
    }\n</script>\n</body>\n</html>\n```\n\n`else if` 语句允许在第一个 `if` 为假时检查多个条件。编写并执行以下代码：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nif (5 > 10) {\n  document.write(\"\
    5 is true\");\n} else if (5 > 2) {\n  document.write(\"5 is greater than 2\");\n\
    } else {\n  document.write(\"else\");\n}\n</script>\n</body>\n</html>\n```\n\n\
    `else` 语句用于在没有任何 `if` 或 `else if` 条件被满足时执行代码。\n\n`if` 和 `else` 语句用于根据条件为真执行代码来控制程序的流程。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script>\nif (10 > 5) {\n  document.write(\"\
    10 is greater than 5\");\n} else {\n  document.write(\"10 is not greater than\
    \ 5\");\n}\n</script>\n</body>\n</html>\n```\n\n## 比较运算符\n\n比较运算符用于比较两个值。它们包括：\n\
    - `==`（等于）\n- `!=`（不等于）\n- `>`（大于）\n- `<`（小于）\n- `>=`（大于等于）\n- `<=`（小于等于）\n\n\
    ## 逻辑运算符\n\n逻辑运算符用于组合多个条件。它们包括：\n- `&&`（与）\n- `||`（或）\n- `!`（非）\n"
