    \ args), delay);\n  };\n} // Usage\nwindow.addEventListener('resize', debounce(function()\
    \ {\n  console.log('Resized!');\n}, 250));\n```\n\n#### 4. Throttle Function\n\
    ```javascript\nfunction throttle(func, limit) {\n  let inThrottle;\n  return function()\
    \ {\n    const args = arguments;\n    const context = this;\n    if (!inThrottle)\
    \ {\n      func.apply(context, args);\n      inThrottle = true;\n      setTimeout(()\
