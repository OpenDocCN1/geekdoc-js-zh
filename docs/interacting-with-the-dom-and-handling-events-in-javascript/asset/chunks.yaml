    \ }\n      return await response.text();\n    } catch (error) {\n      console.error('Error\
    \ loading page:', error);\n      return '<h1>404 - Page Not Found</h1>';\n   \
    \ }\n}\n\nasync function renderPage(pageName) {\n    showLoader();\n    try {\n\
    \      const content = await fetchPageContent(pageName);\n      hideLoader();\n\
    \      contentElement.innerHTML = content;\n\n      // Update active link in navigation\n\
    \      document.querySelectorAll('nav a').forEach(link => {\n        link.classList.toggle('active',\
    \ link.dataset.page === pageName);\n      });\n\n      // Update the URL\n   \
    \   history.pushState(null, '', `#${pageName}`);\n    } catch (error) {\n    \
    \  hideLoader();\n      contentElement.innerHTML = '<h1>Error page</h1>';\n  \
    \  }\n}\n```\n\n## 4. Meta Information: Update the page title and meta description\
    \ for each page.\n\n```javascript\nconst pageMetaInfo = {\n  home: {\n    title:\
    \ 'Home - SPA',\n    description: 'Welcome to the home page of our single application.'\n\
    \  },\n  about: {\n    title: 'About Us - SPA',\n    description: 'Learn more\
    \ about our company and mission.'\n  },\n  contact: {\n    title: 'Contact Us\
    \ - SPA',\n    description: 'Get in touch with us for any inquiries.'\n  }\n};\n\
    \nfunction updateMetaInfo(pageName) {\n  const meta = pageMetaInfo[pageName] ||\
    \ {\n    title: '404 - Page Not Found',\n    description: 'The requested page\
    \ could not be found.'\n  };\n  document.title = meta.title;\n  document.querySelector('meta[name=\"\
    description\"]').setAttribute('content', meta.description);\n}\n\n// Modify the\
    \ renderPage function to include this\nfunction renderPage(pageName) {\n  // ...\
    \ existing code ...\n  updateMetaInfo(pageName);\n  // ... rest of the function\
    \ ...\n}\n```\n\n## 5. Active Link Styling: Enhance the active link styling in\
    \ the navigation.\n\n```css\nnav ul li a {\n    color: #fff;\n    text-decoration:\
    \ none;\n    padding: 5px 10px;\n    border-radius: 5px;\n    transition: background-color\
    \ 0.3s ease;\n}\nnav ul li a.active, nav ul li a:hover {\n    background-color:\
    \ #555;\n}\n```\n\n## 6. Error Handling: Improve error handling for non-existent\
    \ pages or failed content loads.\n\n```javascript\nfunction showErrorPage(message)\
    \ {\n  contentElement.innerHTML = `\n    <h1>Error</h1>\n    <p>${message}</p>\n\
    \    <a href=\"#\" data-page=\"home\">Return to Home</a>\n  `;\n}\n\nasync function\
    \ renderPage(pageName) {\n    showLoader();\n    try {\n      const content =\
    \ await fetchPageContent(pageName);\n      hideLoader();\n      if (content ===\
    \ '<h1>404 - Page Not Found</h1>') {\n        showErrorPage('The requested page\
    \ could not be found.');\n      } else {\n        contentElement.innerHTML = content;\n\
    \      }\n      // ... rest of the function ...\n    } catch (error) {\n     \
    \ hideLoader();\n      showErrorPage('An error occurred while loading the page.\
    \ Please try again later.');\n    }\n}\n```\n\nThese enhancements significantly\
    \ improve the functionality and user experience of the simple SPA:\n\n*   The\
    \ loading indicator provides feedback to users during page transitions.\n*   Smooth\
    \ transitions between pages create a more polished feel.\n*   Dynamic content\
    \ loading allows for easier maintenance and scalability.\n*   Updating meta information\
    \ improves SEO and social sharing capabilities.\n*   Enhanced active link styling\
    \ provides better visual feedback to users.\n*   Improved error handling creates\
    \ a more robust application.\n\nBy implementing these features, you're creating\
    \ a more sophisticated SPA that demonstrates advanced DOM manipulation, asynchronous\
    \ JavaScript, and consideration for user experience and performance. This project\
    \ showcases how to create a basic framework for single-page applications, which\
    \ can be extended and customized for more complex web applications.\n\n# Chapter\
    \ 8: Future of DOM Manipulation\n\n## 8.1 Introduction to Modern JavaScript Frameworks\n\
    \nIn recent years, the landscape of web development has been significantly transformed\
    \ by the emergence of modern JavaScript frameworks. These frameworks have revolutionized\
    \ the way developers approach web applications, offering powerful tools and abstractions\
    \ that simplify complex tasks. In this section, we'll explore some of the most\
    \ popular frameworks and how they've changed the game for web developers.\n\n\
    ### Overview of frameworks like React, Vue, and Angular\n\n#### React\n\nReact,\
    \ developed and maintained by Facebook, has become one of the most widely adopted\
    \ JavaScript libraries for building user interfaces. It introduces a component-based\
    \ architecture that allows developers to create UI elements.\n\nKey features of\
    \ React:\n\n1.  Virtual DOM: React uses a virtual representation of the DOM for\
    \ efficient updates.\n2.  JSX: A syntax extension that allows mixing HTML-like\
    \ code within JavaScript.\n3.  Unidirectional data flow: Data flows in a single\
    \ direction, making it easier to track changes.\n4.  Component-based architecture:\
    \ Encourages building UIs as a composition of small, reusable components.\n\n\
    Example of a simple React component:\n\n```javascript\nimport React from 'react';\n\
    function Welcome(props) {\n  return <h1>Hello, {props.name}</h1>;\n}\nexport default\
    \ Welcome;\n```\n\n#### Vue.js\n\nVue.js, created by Evan You, is known for its\
    \ simplicity and ease of integration. It's often described as taking the best\
    \ parts of Angular and React and combining them into a more approachable framework.\n\
    \nKey features of Vue.js:\n\n1.  Template-based: Uses HTML-based template syntax\
    \ that's easy to understand.\n2.  Reactive data binding: Automatically updates\
    \ the view when data changes.\n3.  Component system: Allows for building reusable\
    \ custom elements.\n4.  Virtual DOM: Like React, Vue uses a virtual DOM for efficient\
    \ updates.\n\nExample of a Vue component:\n\n```html\n<template>\n  <div>\n  \
    \  <h1>{{ greeting }}</h1>\n    <button @click=\"changeGreeting\">Change Greeting</button>\n\
    \  </div>\n</template>\n\n<script>\nexport default {\n  data() {\n    return {\n\
    \      greeting: 'Hello, Vue!'\n    }\n  },\n  methods: {\n    changeGreeting()\
    \ {\n      this.greeting = 'Welcome to Vue!'\n    }\n  }\n}\n</script>\n```\n"
