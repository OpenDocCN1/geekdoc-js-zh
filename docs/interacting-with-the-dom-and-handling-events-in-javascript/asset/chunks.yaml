    ## 5.4 Asynchronous Updates with DOM


    Asynchronous updates are a crucial aspect of creating responsive and dynamic web
    applications. They allow you to perform operations or update the DOM without blocking
    the main thread, resulting in a smoother user experience. In this section, we''ll
    explore various techniques for implementing asynchronous updates in the DOM.


    ### Using setTimeout(), setInterval(), and requestAnimationFrame() for DOM updates


    #### setTimeout()


    setTimeout() is a function that allows you to schedule a piece of code to run
    after a specified delay. It''s useful for creating simple animations, delaying
    operations, or breaking up long-running tasks to avoid blocking the main thread.


    Here''s an example of using setTimeout() to create a simple typewriter effect:


    function  typeWriter(element, text, index  =  0) {


      if (index  <  text.length) {


        element.textContent  +=  text.charAt(index);


        setTimeout(() =>  typeWriter(element, text, index  +  1), 100);


      }


    } const  heading  =  document.getElementById(''heading''); typeWriter(heading,
    ''Welcome to my website!'');


    In this example, we add one character at a time to the heading element, with a
    100ms delay between each character. This creates a typewriter-like effect.


    #### setInterval()


    setInterval() is similar to setTimeout(), but it repeatedly executes a piece of
    code at specified intervals. It''s useful for creating animations or updating
    content at regular intervals.


    Here''s an example of a simple countdown timer using setInterval():


    function  startCountdown(duration, display) {


      let  timer  =  duration;


      const  interval  =  setInterval(() => {const  minutes  =  parseInt(timer  /  60,
    10);


        const  seconds  =  parseInt(timer  %  60, 10);


        display.textContent  =  `${minutes}:${seconds  <  10  ?  ''0''  :  ''''}${seconds}`;


        if (--timer  <  0) {


          clearInterval(interval);


          display.textContent  =  ''Time''s  up!'';  }


      }, 1000);


    } const  fiveMinutes  =  60  *  5; const  display  =  document.querySelector(''#time'');
    startCountdown(fiveMinutes, display);


    This code creates a countdown timer that updates every second, displaying the
    remaining time in minutes and seconds.


    #### requestAnimationFrame()


    requestAnimationFrame() is a method specifically designed for creating smooth
    animations. It tells the browser that you wish to perform an animation and requests
    that the browser calls a specified function to update the animation before the
    next repaint.


    Here''s an example of using requestAnimationFrame() to create a smooth animation:


    function  animate(element) {


      let  start;


      const  totalDuration  =  2000; // 2 seconds  function  step(timestamp) {


        if (!start) start  =  timestamp;


        const  progress  =  timestamp  -  start;


        // Move the element from left to right     const  distance  =  Math.min(progress  /  totalDuration  *  window.innerWidth,
    window.innerWidth);


        element.style.transform  =  `translateX(${distance}px)`;


        if (progress  <  totalDuration) {


          requestAnimationFrame(step);


        }


      }


      requestAnimationFrame(step);


    } const  box  =  document.querySelector(''.box''); animate(box);


    This code animates a box element from the left side of the screen to the right
    over a duration of 2 seconds. requestAnimationFrame() ensures that the animation
    is smooth and optimized for the browser''s refresh rate.


    ### Introduction to promises and asynchronous event handling


    Promises are a powerful feature in JavaScript for handling asynchronous operations.
    They provide a cleaner and more manageable way to work with asynchronous code
    compared to traditional callback-based approaches.


    A Promise represents a value that may not be available immediately but will be
    resolved at some point in the future. Promises have three states:


    1.  Pending: The initial state; the promise is neither fulfilled nor rejected.


    2.  Fulfilled: The operation completed successfully.


    3.  Rejected: The operation failed.


    Here''s a basic example of creating and using a Promise:


    function  delay(ms) {


      return  new  Promise(resolve  =>  setTimeout(resolve, ms));


    } function  updateDOM() {


      const  element  =  document.getElementById(''async-content'');


      element.textContent  =  ''Loading...'';


      delay(2000)


        .then(() => {element.textContent  =  ''Content loaded!'';


          return  delay(1000);


        })


        .then(() => {element.textContent  +=  '' How are you?'';


        })


        .catch(error  => {console.error(''An error occurred:'', error);


          element.textContent  =  ''An error occurred while loading content.'';


        });


    } updateDOM();


    In this example, we create a delay function that returns a Promise that resolves
    after a specified number of milliseconds. We then use this function to create
    a sequence of asynchronous updates to the DOM.


    Promises can be chained using .then() methods, allowing you to sequence asynchronous
    operations. The .catch() method at the end handles any errors that might occur
    during the Promise chain.


    #### Async/Await


    Async/await is a more recent addition to JavaScript that builds on top of Promises,
    providing a more synchronous-looking way to write asynchronous code. Here''s the
    same example rewritten using async/await:


    async  function  updateDOM() {


      const  element  =  document.getElementById(''async-content'');


      element.textContent  =  ''Loading...'';


      try {await  delay(2000);


        element.textContent  =  ''Content loaded!'';


        await  delay(1000);


        element.textContent  +=  '' How are you?'';


      } catch (error) {


        console.error(''An error occurred:'', error);


        element.textContent  =  ''An error occurred while loading content.'';


      }


    } updateDOM();


    The async keyword before the function declaration allows the use of await within
    the function. The await keyword pauses the execution of the function until the
    Promise is resolved, making the code appear more synchronous and easier to read.


    #### Practical example: Fetching data and updating the DOM


    Let''s look at a more practical example of using Promises and async/await to fetch
    data from an API and update the DOM:


    async  function  fetchUserData(userId) {


      const  response  =  await  fetch(`https://api.example.com/users/${userId}`);


      if (!response.ok) {


        throw  new  Error(''Failed to fetch user data'');


      }


      return  await  response.json();


    } async  function  updateUserProfile(userId) {


      const  profileElement  =  document.getElementById(''user-profile'');


      profileElement.innerHTML  =  ''<p>Loading user data...</p>'';


      try {const  userData  =  await  fetchUserData(userId);


        profileElement.innerHTML  =  `        <h2>${userData.name}</h2>  <p>Email:
    ${userData.email}</p>  <p>Location: ${userData.location}</p>      `;


      } catch (error) {


        console.error(''Error fetching user data:'', error);


        profileElement.innerHTML  =  ''<p>Failed to load user data. Please try again
    later.</p>'';


      }


    } updateUserProfile(123);


    This example demonstrates several key concepts:


    1.  Asynchronous function: fetchUserData is an async function that fetches user
    data from an API.


    2.  Error handling: We check if the response is ok and throw an error if it''s
    not, which will be caught in the catch block.


    3.  DOM updates: We update the DOM to show a loading message, then replace it
    with the user data once it''s fetched.'
