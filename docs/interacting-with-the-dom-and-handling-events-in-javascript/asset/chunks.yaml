  trans: "\n# DOM 操作\n\n## `insertBefore()`\n\n`insertBefore()` 方法在指定父节点的子节点之前插入一个节点。\n\
    \n```javascript\nconst parent = document.getElementById('parentElement');\nconst\
    \ referenceNode = document.getElementById('referenceElement');\nconst newNode\
    \ = document.createElement('div');\nnewNode.textContent = 'Inserted before reference';\n\
    parent.insertBefore(newNode, referenceNode);\n```\n\n## `removeChild()`\n\n`removeChild()`\
    \ 从 DOM 中移除一个子节点，并返回被移除的节点。\n\n```javascript\nconst parent = document.getElementById('parentElement');\n\
    const childToRemove = document.getElementById('childElement');\nconst removedChild\
    \ = parent.removeChild(childToRemove);\n```\n\n## 现代方法：`append()`、`prepend()`、`remove()`\n\
    \n现代浏览器支持更直观的新方法来操作 DOM。\n\n### `append()`\n\n`append()` 在 `Element` 的最后一个子元素之后插入一组\
    \ `Node` 对象或 `DOMString` 对象。\n\n```javascript\nconst parent = document.getElementById('parentElement');\n\
    const newElement1 = document.createElement('div');\nconst newElement2 = document.createElement('span');\n\
    parent.append(newElement1, 'Some text', newElement2);\n```\n\n`append()` 可以接受多个参数，并可以直接将字符串作为文本节点插入。\n\
    \n### `prepend()`\n\n`prepend()` 在 `Element` 的第一个子元素之前插入一组 `Node` 对象或 `DOMString`\
    \ 对象。\n\n```javascript\nconst parent = document.getElementById('parentElement');\n\
    const newElement = document.createElement('div');\nparent.prepend(newElement,\
    \ 'Prepended text');\n```\n\n### `remove()`\n\n`remove()` 从 DOM 中移除元素。\n\n```javascript\n\
    const elementToRemove = document.getElementById('removeMe');\nelementToRemove.remove();\n\
    ```\n\n此方法比 `removeChild()` 更简单，因为它不需要引用父元素。\n\n## 3.4 创建和克隆元素\n\n创建新元素和克隆现有元素是构建动态网页的基本技术。\n\
    \n### `createElement()`\n\n`createElement()` 方法创建由 `tagName` 指定的新元素。\n\n```javascript\n\
    const newDiv = document.createElement('div');\nnewDiv.id = 'myNewDiv';\nnewDiv.className\
    \ = 'new-element';\nnewDiv.textContent = 'This is a newly created div';\ndocument.body.appendChild(newDiv);\n\
    ```\n\n此方法允许你以编程方式创建任何 HTML 元素。创建后，你可以设置属性、添加内容，并将其附加到 DOM。\n\n### `cloneNode()`\n\
    \n`cloneNode()` 方法创建节点的副本。\n\n```javascript\nconst originalElement = document.getElementById('original');\n\
    const clonedElement = originalElement.cloneNode(true);\nclonedElement.id = 'cloned';\n\
    document.body.appendChild(clonedElement);\n```\n\n`cloneNode(true)` 中的布尔参数指定是否也克隆元素的后代（深克隆）。如果设置为\
    \ `false`，则只克隆元素本身，不克隆其子元素。\n\n当你需要快速创建多个相似元素时，克隆可能很有用，但要注意 ID 和事件监听器，因为可能需要在克隆的元素中调整它们。\n\
    \n## 3.5 操作类\n\n类操作是动态更改元素外观和行为的强大方式。`classList` 属性提供了高效地 `add`、`remove` 和 `toggle`\
    \ 类的方法。\n\n### `classList`\n\n`classList` 属性是一个只读属性，返回元素类属性的实时 `DOMTokenList`\
    \ 集合。\n\n#### 添加类\n\n要向元素添加一个或多个类：\n\n```javascript\nconst element = document.getElementById('myElement');\n\
    element.classList.add('new-class');\nelement.classList.add('class1', 'class2',\
    \ 'class3');\n```\n\n#### 移除类\n\n要从元素移除一个或多个类：\n\n```javascript\nelement.classList.remove('old-class');\n\
    element.classList.remove('class1', 'class2');\n```\n\n#### 切换类\n\n要 `toggle` 一个类（如果不存在则\
    \ `add`，如果存在则 `remove`）：\n\n```javascript\nelement.classList.toggle('active');\n\
    ```\n\n你也可以强制指定状态：\n\n```javascript\n// 强制添加（第二个参数为 true）\nelement.classList.toggle('visible',\
    \ true);\n// 强制移除（第二个参数为 false）\nelement.classList.toggle('hidden', false);\n\
    ```\n\n#### 检查类是否存在\n\n检查元素是否具有特定类：\n\n```javascript\nif (element.classList.contains('highlight'))\
    \ {\n    console.log('Element has highlight class');\n}\n```\n\n#### 替换类\n\n用另一个类替换一个类：\n\
    \n```javascript\nelement.classList.replace('old-class', 'new-class');\n```\n\n\
    ### 实际示例\n\n1. 实现标签页系统：\n\n```javascript\nfunction switchTab(tabId) {\n    //\
    \ 从所有标签页移除 'active' 类\n    document.querySelectorAll('.tab').forEach(tab => {\n\
    \        tab.classList.remove('active');\n    });\n    // 向选中的标签页添加 'active' 类\n\
    \    document.getElementById(tabId).classList.add('active');\n}\n```\n\n2. 创建可折叠元素：\n\
    \n```javascript\nconst collapsible = document.getElementById('collapsible');\n\
    const content = document.getElementById('content');\ncollapsible.addEventListener('click',\
    \ () => {\n    content.classList.toggle('collapsed');\n    collapsible.classList.toggle('expanded');\n\
    });\n```\n\n3. 实现主题切换器：\n\n```javascript\nfunction toggleTheme() {\n    document.body.classList.toggle('dark-theme');\n\
    \    document.body.classList.toggle('light-theme');\n}\n```\n\n类操作是创建动态和交互式网页的强大技术。它允许你将样式关注点（在\
    \ CSS 中）与行为逻辑（在 JavaScript 中）分离，从而产生更易维护和灵活的代码。\n\n## 结论\n\n操作 DOM 元素是任何使用 JavaScript\
    \ 的 Web 开发者的基本技能。本章涵盖的技术为创建动态、交互式 Web 应用程序提供了坚实的基础。从修改元素内容和属性到添加和移除元素，以及操作类，这些技能使你能够创建响应式和引人入胜的用户界面。\n\
    \n记住，在进行频繁的 DOM 操作时要考虑性能影响，并且始终注意安全问题，特别是在处理用户生成的内容时。当你对这些技术越来越熟练时，你会发现它们为创建丰富的交互式\
    \ Web 体验开辟了无限可能。\n\n定期练习这些技术，不要犹豫去 MDN Web Docs 探索每个方法和属性的更多信息。编码愉快！\n\n# 第 4\
    \ 章：JavaScript 中的事件处理\n\n事件处理是 JavaScript 编程的关键方面，特别是在创建交互式 Web 应用程序时。本章深入探讨事件的复杂性、如何处理它们以及在\
    \ JavaScript 中使用事件的最佳实践。\n\n## 4.1 什么是事件？\n\n事件是你正在编程的系统中发生的动作或事件，系统会告诉你这些事件，以便你可以响应它们。在\
    \ Web 开发中，事件通常是用户操作或浏览器操作，可以使用 JavaScript 检测和响应这些事件。\n\n### 浏览器事件概述\n\n浏览器事件可以分为几种类型：\n\
    \n1. 鼠标事件：这些由用户与指针设备（如鼠标或触控板）的交互触发。\n\n   * `click`：当元素被点击时发生\n   * `dblclick`：当元素被双击时发生\n\
    \   * `mousedown`：当鼠标按钮在元素上按下时发生\n   * `mouseup`：当鼠标按钮在元素上释放时发生\n   * `mousemove`：当鼠标指针在元素上移动时发生\n\
    \   * `mouseover`：当鼠标指针进入元素时发生\n   * `mouseout`：当鼠标指针离开元素时发生\n\n2. 键盘事件：这些由用户与键盘的交互触发。\n\
    \n   * `keydown`：当按键按下时发生\n   * `keyup`：当按键释放时发生\n   * `keypress`：当按下产生字符值的键时发生（已弃用）\n\
    \n3. 表单事件：这些与 HTML 表单元素及其交互相关。\n"
- fmt: "\n- `submit`: Occurs when a form is submitted\n- `reset`: Occurs when a form\
    \ is reset\n- `change`: Occurs when the value of an input element changes\n- `input`:\
    \ Occurs immediately after the value of an input element changes\n- `focus`: Occurs\
    \ when an element receives focus\n- `blur`: Occurs when an element loses focus\n\
    \n4. Window Events: These are related to the browser window itself.\n- `load`:\
    \ Occurs when a page finishes loading\n- `unload`: Occurs when a page is unloaded\
    \ (for example, when navigating to a new page)\n- `resize`: Occurs when the browser\
    \ window is resized\n- `scroll`: Occurs when the document view or an element has\
    \ been scrolled\n\n5. Document Events: These are related to the HTML document.\n\
    - `DOMContentLoaded`: Occurs when the initial HTML document has been completely\
    \ loaded and parsed, without waiting for stylesheets, images, and subframes to\
    \ finish loading\n\n### Understanding the event flow: capture and bubbling\n\n\
    When an event occurs on an element that has parent elements, modern browsers run\
    \ two different phases - the capturing phase and the bubbling phase.\n\n1. Capturing\
    \ Phase: The event starts from the root of the document and moves down to the\
    \ target element. It's rarely used in practice, but can be utilized by passing\
    \ `true` as the third argument to `addEventListener()`.\n\n2. Target Phase: The\
    \ event reaches the target element.\n\n3. Bubbling Phase: After reaching the target,\
    \ the event bubbles up through its ancestors in the DOM tree, triggering any event\
    \ listeners on the way.\n\nHere's an example to illustrate event bubbling:\n\n\
    ```html\n<div id=\"outer\">\n  <div id=\"inner\">\n    <button id=\"button\">Click\
    \ me!</button>\n  </div>\n</div>\n```\n\n```javascript\ndocument.getElementById('outer').addEventListener('click',\
    \ function() {\n  console.log('Outer div clicked');\n});\ndocument.getElementById('inner').addEventListener('click',\
    \ function() {\n  console.log('Inner div clicked');\n});\ndocument.getElementById('button').addEventListener('click',\
    \ function() {\n  console.log('Button clicked');\n});\n```\n\nIf you click the\
    \ button, you'll see the following output in the console:\n\n```\nButton clicked\n\
    Inner div clicked\nOuter div clicked\n```\n\nThis demonstrates how the event bubbles\
    \ up from the target element through its ancestors.\n\n## 4.2 Adding Event Listeners\n\
    \nEvent listeners are the primary way to handle events in modern JavaScript. They\
