    document.addEventListener('DOMContentLoaded', function() {\n  // 在此处编写你的代码\n});\n\
    ```\n\n6.  考虑使用节流（throttle）或防抖（debounce）函数：对于可以快速触发的事件（如 'scroll' 或 'resize'），考虑使用节流或防抖函数来限制事件处理器调用的频率。这可以显著提高性能。\n\
    \n```javascript\n// 简单的防抖函数\nfunction debounce(func, wait) {\n  let timeout;\n\
    \  return function executedFunction(...args) {\n    const later = () => {\n  \
    \    clearTimeout(timeout);\n      func(...args);\n    };\n    clearTimeout(timeout);\n\
    \    timeout = setTimeout(later, wait);\n  };\n}\n// 使用\nwindow.addEventListener('resize',\
    \ debounce(function() {\n  console.log('Resize event debounced');\n}, 250));\n\
    ```\n\n7.  对滚动事件使用 passive（被动）选项：对于滚动事件，特别是移动设备上的，考虑使用 `passive` 选项来提高滚动性能。\n\n\
    ```javascript\ndocument.addEventListener('scroll', function() {\n  // 滚动处理代码\n\
    }, { passive: true });\n```\n\n通过遵循这些最佳实践，你可以创建更高效、易于维护且性能更好的事件驱动 JavaScript 应用程序。\n\
    \n## 结论\n\n事件处理是 JavaScript 编程的一个基本方面，特别是在 Web 开发背景下。理解事件如何工作、如何附加和移除事件监听器以及如何高效处理事件，对于任何\
    \ JavaScript 开发者来说都是至关重要的技能。\n\n本章涵盖了事件的基础知识，包括它们是什么以及如何在 DOM 中流转。我们探讨了如何添加和移除事件监听器，常见的事件类型，并讨论了如何处理事件对象。最后，我们涵盖了事件处理的最佳实践。\n\
    \n记住，有效的事件处理是创建交互式 Web 应用的关键。随着你继续学习 JavaScript，你会发现掌握事件处理为创建丰富的用户界面开启了无限可能。\n\
    \n在下一章中，我们将探索如何使用 JavaScript 操作 DOM，这结合你对事件处理的知识，将让你能够创建真正的动态网页。\n\n# 第 5 章：高级\
    \ DOM 操作技术\n\n## 5.1 事件委托\n\n### 理解事件委托及其重要性\n\n事件委托是 JavaScript 中一种强大的技术，允许你高效处理事件，特别是在处理动态内容或大量相似元素时。与其在单个元素上绑定监听器，事件委托涉及在父元素上绑定单个事件监听器，然后处理发生在其子元素上的事件。\n\
    \n事件委托的概念基于事件冒泡原理，即在子元素上触发的事件沿着 DOM 树向上传递到父元素。通过利用这种行为，我们可以在 DOM 层次结构中的更高位置捕捉并处理事件。\n\
    \n事件委托提供了几个重要的优势：\n\n1.  提高性能：与其在多个元素上附加多个事件监听器，你只需要在父元素上附加一个监听器。这减少了内存占用并提高了整体性能，特别是在处理大量元素时。\n\
    \n2.  动态内容处理：事件委托与动态添加或删除的元素无缝工作。你不需要每次修改 DOM 时都重新绑定事件监听器，因为父元素的监听器会处理其所有子元素的事件，包括新添加的元素。\n\
    \n3.  简化代码：事件委托可以产生更整洁、更易维护的代码，因为你将事件处理逻辑集中在一个地方而不是分散在多个元素中。\n\n"
- fmt: "\n# Event Delegation and Dynamic DOM Manipulation\n\n## Reduced Memory Leaks\n\
    \nWith fewer event listeners attached directly to elements, there's less risk\
    \ of memory leaks caused by forgotten or improperly removed event listeners.\n\
    \n### Implementing Event Delegation in Dynamic Content\n\nTo implement event delegation,\
    \ follow these steps:\n\n1. Identify a common parent element for the target elements\
    \ you want to handle events for.\n2. Attach an event listener to the parent element.\n\
    3. In the event handler, check if the event target matches the desired selector\
    \ for the child elements.\n4. If there's a match, execute the appropriate logic\
    \ for that element.\n\nHere's an example of implementing event delegation for\
    \ a list of items:\n\n```html\n<ul id=\"item-list\">\n  <li>Item 1</li>\n  <li>Item\
    \ 2</li>\n  <li>Item 3</li>\n</ul>\n```\n\n```javascript\nconst itemList = document.getElementById('item-list');\n\
    itemList.addEventListener('click', function(event) {\n  if (event.target.tagName\
    \ === 'LI') {\n    console.log('Clicked on:', event.target.textContent);\n  }\n\
    });\n```\n\nIn this example, we attach a single click event listener to the `<ul>`\
    \ element. When a click occurs on any of its child `<li>` elements, the event\
    \ bubbles up to the `<ul>`, and our event handler checks if the clicked element\
    \ is an `<li>`. If it is, we log the clicked item's text content.\n\nThis approach\
    \ works even if we dynamically add or remove list items:\n\n```javascript\n//\
    \ Adding a new item dynamically\nconst newItem = document.createElement('li');\n\
    newItem.textContent = 'Item 4';\nitemList.appendChild(newItem);\n```\n\nThe newly\
    \ added item will automatically be included in the event delegation, without requiring\
    \ any additional event listeners.\n\nWhen implementing event delegation for more\
    \ complex scenarios, you may need to use more specific selectors or traverse the\
    \ DOM to find the exact target element. Here's an example with nested elements:\n\
    \n```html\n<div id=\"container\">\n  <div class=\"item\">\n    <h2>Item 1</h2>\n\
    \    <button class=\"delete\">Delete</button>\n  </div>\n  <div class=\"item\"\
    >\n    <h2>Item 2</h2>\n    <button class=\"delete\">Delete</button>\n  </div>\n\
    </div>\n```\n\n```javascript\nconst container = document.getElementById('container');\n\
    container.addEventListener('click', function(event) {\n  if (event.target.classList.contains('delete'))\
    \ {\n    const item = event.target.closest('.item');\n    if (item) {\n      console.log('Deleting:',\
    \ item.querySelector('h2').textContent);\n      item.remove();\n    }\n  }\n});\n\
    ```\n\nIn this example, we use event delegation to handle clicks on delete buttons\
    \ within item containers. We check if the clicked element has the 'delete' class,\
    \ then find the closest parent with the 'item' class to identify which item should\
    \ be deleted.\n\nBy mastering event delegation, you can create more efficient\
    \ and flexible event handling systems in your web applications, especially when\
    \ dealing with dynamic content or large numbers of similar elements.\n\n## 5.2\
    \ Modifying the DOM Dynamically\n\n### Using Events to Modify the DOM in Response\
    \ to User Actions\n\nOne of the most powerful aspects of JavaScript is its ability\
    \ to modify the Document Object Model (DOM) in real-time, creating dynamic and\
    \ interactive web pages. By combining event handling with DOM manipulation, you\
    \ can create responsive user interfaces that update based on user actions.\n\n\
    Here are some common scenarios where you might modify the DOM in response to events:\n\
    \n1. **Toggling element visibility:**\n\n```javascript\nconst toggleButton = document.getElementById('toggle-button');\n\
    const targetElement = document.getElementById('target-element');\ntoggleButton.addEventListener('click',\
    \ function() {\n  if (targetElement.style.display === 'none') {\n    targetElement.style.display\
    \ = 'block';\n  } else {\n    targetElement.style.display = 'none';\n  }\n});\n\
    ```\n\n2. **Updating text content:**\n\n```javascript\nconst updateButton = document.getElementById('update-button');\n\
    const displayElement = document.getElementById('display-element');\nlet clickCount\
    \ = 0;\nupdateButton.addEventListener('click', function() {\n  clickCount++;\n\
    \  displayElement.textContent = `Button clicked ${clickCount} times`;\n});\n```\n\
    \n3. **Adding or removing classes:**\n\n```javascript\nconst toggleClassButton\
    \ = document.getElementById('toggle-class-button');\nconst targetElement = document.getElementById('target-element');\n\
    toggleClassButton.addEventListener('click', function() {\n  targetElement.classList.toggle('highlight');\n\
    });\n```\n\n4. **Creating and appending new elements:**\n\n```javascript\nconst\
    \ addItemButton = document.getElementById('add-item-button');\nconst itemList\
    \ = document.getElementById('item-list');\nlet itemCount = 0;\naddItemButton.addEventListener('click',\
    \ function() {\n  itemCount++;\n  const newItem = document.createElement('li');\n\
    \  newItem.textContent = `Item ${itemCount}`;\n  itemList.appendChild(newItem);\n\
    });\n```\n\n5. **Removing elements:**\n\n```javascript\nconst itemList = document.getElementById('item-list');\n\
    itemList.addEventListener('click', function(event) {\n  if (event.target.tagName\
    \ === 'LI') {\n    event.target.remove();\n  }\n});\n```\n\nThese examples demonstrate\
    \ how you can use events to trigger various DOM modifications, creating interactive\
    \ and dynamic web pages.\n\n### Creating Interactive Web Components\n\nBuilding\
    \ on the concept of modifying the DOM in response to events, you can create more\
    \ complex and reusable interactive web components. These components encapsulate\
    \ both the HTML structure and the associated JavaScript functionality, making\
    \ it easier to manage and reuse code across your application.\n\nHere's an example\
    \ of a simple accordion component:\n\n```html\n<div class=\"accordion\">\n  <div\
    \ class=\"accordion-item\">\n    <h3 class=\"accordion-header\">Section 1</h3>\n\
    \    <div class=\"accordion-content\">\n      <p>Content for section 1</p>\n \
    \   </div>\n  </div>\n  <div class=\"accordion-item\">\n    <h3 class=\"accordion-header\"\
    >Section 2</h3>\n    <div class=\"accordion-content\">\n      <p>Content for section\
    \ 2</p>\n    </div>\n  </div>\n  <div class=\"accordion-item\">\n    <h3 class=\"\
    accordion-header\">Section 3</h3>\n    <div class=\"accordion-content\">\n   \
    \   <p>Content for section 3</p>\n    </div>\n  </div>\n</div>\n```\n\n```javascript\n\
    class Accordion {\n  constructor(element) {\n    this.accordion = element;\n \
    \   this.headers = this.accordion.querySelectorAll('.accordion-header');\n   \
    \ this.init();\n  }\n\n  init() {\n    this.headers.forEach(header => {\n    \
    \  header.addEventListener('click', () => this.toggleSection(header));\n    });\n\
    \  }\n\n  toggleSection(header) {\n    const content = header.nextElementSibling;\n\
    \    const isExpanded = header.classList.contains('expanded');\n\n    // Close\
    \ all sections\n    this.headers.forEach(h => {\n      h.classList.remove('expanded');\n\
    \      h.nextElementSibling.style.maxHeight = null;\n    });\n\n    // If the\
    \ clicked section wasn't expanded, expand it\n    if (!isExpanded) {\n      header.classList.add('expanded');\n\
    \      content.style.maxHeight = content.scrollHeight + 'px';\n    }\n  }\n}\n\
    \n// Initialize all accordions on the page\ndocument.querySelectorAll('.accordion').forEach(accordion\
    \ => new Accordion(accordion));\n```\n\nThis accordion component demonstrates\
    \ several key concepts:\n\n1. **Encapsulation:** The component's functionality\
    \ is encapsulated within a class, making it easy to create multiple instances\
    \ and manage the code.\n2. **Event delegation:** The component uses event delegation\
    \ by attaching a single click event listener to each accordion header, rather\
    \ than individual content sections.\n3. **Dynamic DOM manipulation:** The component\
    \ modifies the DOM by toggling classes and adjusting the maxHeight of content\
    \ sections to create the accordion effect.\n4. **Reusability:** The component\
    \ can be easily reused by selecting all elements with the 'accordion' class and\
    \ initializing a new instance for each.\n\nBy creating such components, you can\
    \ build more complex and interactive user interfaces while keeping your code organized\
    \ and maintainable. As you develop more advanced components, consider implementing\
    \ additional features such as:\n\n* Accessibility enhancements (e.g., proper ARIA\
    \ attributes)\n"
  raw: '4.  Reduced memory leaks: With fewer event listeners attached directly to
    elements, there''s less risk of memory leaks caused by forgotten or improperly
    removed event listeners.


    ### Implementing event delegation in dynamic content


    To implement event delegation, follow these steps:


    1.  Identify a common parent element for the target elements you want to handle
    events for.


    2.  Attach an event listener to the parent element.


    3.  In the event handler, check if the event target matches the desired selector
    for the child elements.


    4.  If there''s a match, execute the appropriate logic for that element.


    Here''s an example of implementing event delegation for a list of items:


    <ul  id="item-list">


      <li>Item 1</li>


      <li>Item 2</li>


      <li>Item 3</li>


    </ul>


    const  itemList  =  document.getElementById(''item-list''); itemList.addEventListener(''click'',
    function(event) {


      if (event.target.tagName  ===  ''LI'') {


        console.log(''Clicked on:'', event.target.textContent);


      }


    });


    In this example, we attach a single click event listener to the <ul> element.
    When a click occurs on any of its child <li> elements, the event bubbles up to
    the <ul>, and our event handler checks if the clicked element is an <li>. If it
    is, we log the clicked item''s text content.


    This approach works even if we dynamically add or remove list items:


    // Adding a new item dynamically const  newItem  =  document.createElement(''li'');
    newItem.textContent  =  ''Item 4''; itemList.appendChild(newItem);


    The newly added item will automatically be included in the event delegation, without
    requiring any additional event listeners.


    When implementing event delegation for more complex scenarios, you may need to
    use more specific selectors or traverse the DOM to find the exact target element.
    Here''s an example with nested elements:


    <div  id="container">


      <div  class="item">


        <h2>Item 1</h2>


        <button  class="delete">Delete</button>


      </div>


      <div  class="item">


        <h2>Item 2</h2>


        <button  class="delete">Delete</button>


      </div>


    </div>


    const  container  =  document.getElementById(''container''); container.addEventListener(''click'',
    function(event) {


      if (event.target.classList.contains(''delete'')) {


        const  item  =  event.target.closest(''.item'');


        if (item) {


          console.log(''Deleting:'', item.querySelector(''h2'').textContent);


          item.remove();


        }


      }


    });


    In this example, we use event delegation to handle clicks on delete buttons within
    item containers. We check if the clicked element has the ''delete'' class, then
    find the closest parent with the ''item'' class to identify which item should
    be deleted.


    By mastering event delegation, you can create more efficient and flexible event
    handling systems in your web applications, especially when dealing with dynamic
    content or large numbers of similar elements.


    ## 5.2 Modifying the DOM Dynamically


    ### Using events to modify the DOM in response to user actions


    One of the most powerful aspects of JavaScript is its ability to modify the Document
    Object Model (DOM) in real-time, creating dynamic and interactive web pages. By
    combining event handling with DOM manipulation, you can create responsive user
    interfaces that update based on user actions.


    Here are some common scenarios where you might modify the DOM in response to events:


    1.  Toggling element visibility:


    const  toggleButton  =  document.getElementById(''toggle-button''); const  targetElement  =  document.getElementById(''target-element'');
    toggleButton.addEventListener(''click'', function() {


      if (targetElement.style.display  ===  ''none'') {


        targetElement.style.display  =  ''block'';


      } else {targetElement.style.display  =  ''none'';


      }


    });


    2.  Updating text content:


    const  updateButton  =  document.getElementById(''update-button''); const  displayElement  =  document.getElementById(''display-element'');
    let  clickCount  =  0; updateButton.addEventListener(''click'', function() {


      clickCount++;


      displayElement.textContent  =  `Button clicked ${clickCount} times`;


    });


    3.  Adding or removing classes:


    const  toggleClassButton  =  document.getElementById(''toggle-class-button'');
    const  targetElement  =  document.getElementById(''target-element''); toggleClassButton.addEventListener(''click'',
    function() {


      targetElement.classList.toggle(''highlight'');


    });


    4.  Creating and appending new elements:


    const  addItemButton  =  document.getElementById(''add-item-button''); const  itemList  =  document.getElementById(''item-list'');
    let  itemCount  =  0; addItemButton.addEventListener(''click'', function() {


      itemCount++;


      const  newItem  =  document.createElement(''li'');


      newItem.textContent  =  `Item ${itemCount}`;


      itemList.appendChild(newItem);


    });


    5.  Removing elements:


    const  itemList  =  document.getElementById(''item-list''); itemList.addEventListener(''click'',
    function(event) {


      if (event.target.tagName  ===  ''LI'') {


        event.target.remove();


      }


    });


    These examples demonstrate how you can use events to trigger various DOM modifications,
    creating interactive and dynamic web pages.


    ### Creating interactive web components


    Building on the concept of modifying the DOM in response to events, you can create
    more complex and reusable interactive web components. These components encapsulate
    both the HTML structure and the associated JavaScript functionality, making it
    easier to manage and reuse code across your application.


    Here''s an example of a simple accordion component:


    <div  class="accordion">


      <div  class="accordion-item">


        <h3  class="accordion-header">Section 1</h3>


        <div  class="accordion-content">


          <p>Content for section 1</p>


        </div>


      </div>


      <div  class="accordion-item">


        <h3  class="accordion-header">Section 2</h3>


        <div  class="accordion-content">


          <p>Content for section 2</p>


        </div>


      </div>


      <div  class="accordion-item">


        <h3  class="accordion-header">Section 3</h3>


        <div  class="accordion-content">


          <p>Content for section 3</p>


        </div>


      </div>


    </div>


    class  Accordion {constructor(element) {


        this.accordion  =  element;


        this.headers  =  this.accordion.querySelectorAll(''.accordion-header'');


        this.init();


      }


      init() {


        this.headers.forEach(header  => {header.addEventListener(''click'', () =>  this.toggleSection(header));


        });


      }


      toggleSection(header) {


        const  content  =  header.nextElementSibling;


        const  isExpanded  =  header.classList.contains(''expanded'');


        // Close all sections     this.headers.forEach(h  => {h.classList.remove(''expanded'');


          h.nextElementSibling.style.maxHeight  =  null;


        });


        // If the clicked section wasn''t expanded, expand it     if (!isExpanded)
    {


          header.classList.add(''expanded'');


          content.style.maxHeight  =  content.scrollHeight  +  ''px'';


        }


      }


    } // Initialize all accordions on the page document.querySelectorAll(''.accordion'').forEach(accordion  =>  new  Accordion(accordion));


    This accordion component demonstrates several key concepts:


    1.  Encapsulation: The component''s functionality is encapsulated within a class,
    making it easy to create multiple instances and manage the code.


    2.  Event delegation: The component uses event delegation by attaching a single
    click event listener to each accordion header, rather than individual content
    sections.


    3.  Dynamic DOM manipulation: The component modifies the DOM by toggling classes
    and adjusting the maxHeight of content sections to create the accordion effect.


    4.  Reusability: The component can be easily reused by selecting all elements
    with the ''accordion'' class and initializing a new instance for each.


    By creating such components, you can build more complex and interactive user interfaces
    while keeping your code organized and maintainable. As you develop more advanced
    components, consider implementing additional features such as:


    *   Accessibility enhancements (e.g., proper ARIA attributes)'
