    |

    |  | 3.2 Changing Element Attributes and Styles | • Using `setAttribute()` and
    `getAttribute()` • Adding, removing, and modifying CSS styles via JavaScript |

    |  | 3.3 Adding and Removing Elements | • Using `appendChild()`, `insertBefore()`,
    `removeChild()` • Using modern methods: `append()`, `prepend()`, `remove()` |

    |  | 3.4 Creating and Cloning Elements | • Creating new elements with `createElement()`
    • Cloning existing elements using `cloneNode()` |

    |  | 3.5 Manipulating Classes | • Using `classList` to add, remove, and toggle
    classes |

    | 4. Event Handling in JavaScript | 4.1 What are Events? | • Overview of browser
    events: mouse events, keyboard events, form events, etc. • Understanding the event
    flow: capture and bubbling |

    |  | 4.2 Adding Event Listeners | • Using `addEventListener()` to register event
    handlers • Differences between inline event handlers and `addEventListener()`
    |

    |  | 4.3 Common Event Types | • Mouse events: click, dblclick, mouseover, mouseout
    • Keyboard events: keydown, keypress, keyup |

