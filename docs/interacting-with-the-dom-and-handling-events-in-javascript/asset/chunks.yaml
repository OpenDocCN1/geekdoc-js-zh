    \ JavaScript 中处理日期。\n\n## 7.2 带有灯箱效果的图片库\n创建一个带有灯箱效果的图片库是另一个实用的项目，它展示了 DOM 操作和事件处理的力量。这个项目将允许用户查看图片集，并点击它们在灯箱覆盖层中查看更大的版本。\n\
    \n### HTML 结构\n让我们先从 HTML 结构开始：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <title>Image Gallery with Lightbox</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n    <div\
    \ class=\"container\">\n        <h1>Image Gallery</h1>\n        <div id=\"gallery\"\
    \ class=\"gallery\">\n            <!-- 图片将在这里动态添加 -->\n        </div>\n    </div>\n\
    \    <div id=\"lightbox\" class=\"lightbox\">\n        <span class=\"close\">&times;</span>\n\
    \        <img id=\"lightbox-img\" src=\"\" alt=\"\">\n        <div id=\"caption\"\
    ></div>\n    </div>\n    <script src=\"script.js\"></script>\n</body>\n</html>\n\
    ```\n\n### CSS 样式\n添加一些 CSS 来样式库和灯箱：\n\n```css\nbody {\n    font-family: Arial,\
    \ sans-serif;\n    margin: 0;\n}\n.container {\n    text-align: center;\n}\nh1\
    \ {\n    color: black;\n}\n.gallery {\n    display: grid;\n    grid-template-columns:\
    \ repeat(auto-fill, minmax(200px, 1fr));\n    gap: 15px;\n    padding: 20px;\n\
    }\n.gallery img {\n    width: 100%;\n    height: auto;\n    cursor: pointer;\n\
    \    transition: transform 0.3s;\n}\n.gallery img:hover {\n    transform: scale(1.05);\n\
    }\n.lightbox {\n    display: none;\n    position: fixed;\n    z-index: 999;\n\
    \    left: 0;\n    top: 0;\n    width: 100%;\n    height: 100%;\n    background-color:\
    \ rgba(0, 0, 0, 0.9);\n    text-align: center;\n}\n.lightbox img {\n    max-width:\
    \ 80%;\n    max-height: 80vh;\n    margin-top: 5vh;\n}\n.close {\n    position:\
    \ absolute;\n    top: 15px;\n    right: 35px;\n    color: #ccc;\n    font-size:\
    \ 40px;\n    font-weight: bold;\n    cursor: pointer;\n}\n.close:hover {\n   \
    \ color: #bbb;\n}\n#caption {\n    position: absolute;\n    bottom: 20px;\n  \
    \  width: 100%;\n    color: white;\n    font-size: 20px;\n}\n```\n\n### JavaScript\
    \ 实现\n现在，让我们实现库和灯箱功能：\n\n```javascript\n// 图片对象数组\nconst images = [\n    { src:\
    \ 'image1.jpg', alt: 'Description of Image 1' },\n    { src: 'image2.jpg', alt:\
    \ 'Description of Image 2' },\n    { src: 'image3.jpg', alt: 'Description of Image\
    \ 3' } // 根据需要添加更多\n];\n\n// 获取 DOM 元素\nconst gallery = document.getElementById('gallery');\n\
    const lightbox = document.getElementById('lightbox');\nconst lightboxImg = document.getElementById('lightbox-img');\n\
    const caption = document.getElementById('caption');\nconst close = document.querySelector('.close');\n\
    \n// 创建库项\nfunction createGalleryItems() {\n    images.forEach(image => {\n  \
    \      const img = document.createElement('img');\n        img.src = image.src;\n\
    \        img.alt = image.alt;\n        img.addEventListener('click', () => openLightbox(image));\n\
    \        gallery.appendChild(img);\n    });\n}\n\n// 打开灯箱\nfunction openLightbox(image)\
    \ {\n    lightboxImg.src = image.src;\n    caption.textContent = image.alt;\n\
    \    lightbox.style.display = 'block';\n}\n\n// 关闭灯箱\nfunction closeLightbox()\
    \ {\n    lightbox.style.display = 'none';\n}\n\n// 事件监听器\nclose.addEventListener('click',\
    \ closeLightbox);\nlightbox.addEventListener('click', (e) => {\n    if (e.target\
    \ === lightbox) {\n        closeLightbox();\n    }\n});\n\n// 初始化库\ncreateGalleryItems();\n\
    ```\n"
