    \ \"Parent clicked (capturing phase)\"，然后输出 \"Child clicked\"。\n\n## 事件委托\n\n\
    事件委托是一种利用事件冒泡来高效处理事件的技术，当你在一个父元素中包含许多相似的子元素时，这种技术特别有用。\n\n### 事件委托的工作原理\n\n不要为每个子元素附加事件监听器，而是为父元素附加一个单一的监听器。当某个事件发生在子元素上时，它会冒泡到父元素，你可以在父元素中处理该事件。\n\
    \n### 事件委托的好处\n\n1. 提升性能，尤其是在元素数量较多时\n2. 动态添加的元素会自动被处理\n3. 由于减少了事件监听器的数量，降低了内存占用\n\
    4. 代码更简洁、更易于维护\n\n### 事件委托示例\n\n```html\n<ul id=\"todo-list\">\n  <li>Task 1</li>\n\
    \  <li>Task 2</li>\n  <li>Task 3</li>\n</ul>\n```\n\n```javascript\nconst todoList\
    \ = document.getElementById('todo-list');\ntodoList.addEventListener('click',\
    \ function(event) {\n  if (event.target.tagName === 'LI') {\n    console.log('Task\
    \ clicked:', event.target.textContent);\n    event.target.classList.toggle('completed');\n\
    \  }\n});\n```\n\n在这个例子中，我们不为每个 `<li>` 元素添加点击事件监听器，而是为父 `<ul>` 添加一个单一的监听器。当列表项被点击时，事件会冒泡到\
    \ `<ul>`，我们会在那里检查被点击的元素是否是 `<li>`，然后再处理事件。\n\n## 常见的 DOM 事件\n\n### 鼠标事件\n\n1.\
    \ `click`：当元素被点击时触发。\n\n```javascript\nelement.addEventListener('click', function(event)\
    \ {\n  console.log('Element clicked');\n});\n```\n\n2. `dblclick`：当元素被双击时触发。\n\
    \n```javascript\nelement.addEventListener('dblclick', function(event) {\n  console.log('Element\
    \ double-clicked');\n});\n```\n\n3. `mouseover` 和 `mouseout`：当鼠标进入或离开元素时触发。\n\n\
    ```javascript\nelement.addEventListener('mouseover', function(event) {\n  console.log('Mouse\
    \ over element');\n});\nelement.addEventListener('mouseout', function(event) {\n\
    \  console.log('Mouse left element');\n});\n```\n\n4. `mousedown` 和 `mouseup`：当鼠标按钮在元素上按下或释放时触发。\n\
    \n```javascript\nelement.addEventListener('mousedown', function(event) {\n  console.log('Mouse\
    \ button pressed');\n});\nelement.addEventListener('mouseup', function(event)\
    \ {\n  console.log('Mouse button released');\n});\n```\n\n### 键盘事件\n\n1. `keydown`\
    \ 和 `keyup`：当键盘按键被按下或释放时触发。\n\n```javascript\ndocument.addEventListener('keydown',\
    \ function(event) {\n  console.log('Key pressed:', event.key);\n});\ndocument.addEventListener('keyup',\
    \ function(event) {\n  console.log('Key released:', event.key);\n});\n```\n\n\
    2. `keypress`：当按下产生字符值的键时触发。\n\n```javascript\ndocument.addEventListener('keypress',\
    \ function(event) {\n  console.log('Character key pressed:', event.key);\n});\n\
    ```\n\n### 表单事件\n\n1. `submit`：当表单提交时触发。\n\n```javascript\nconst form = document.querySelector('form');\n\
    form.addEventListener('submit', function(event) {\n  event.preventDefault(); //\
    \ Prevent the form from submitting\n  console.log('Form submitted');\n});\n```\n\
    \n2. `change`：当输入元素的值发生变化时触发。\n\n```javascript\nconst input = document.querySelector('input');\n\
    input.addEventListener('change', function(event) {\n  console.log('Input value\
    \ changed:', event.target.value);\n});\n```\n\n3. `focus` 和 `blur`：当元素获得或失去焦点时触发。\n\
    \n```javascript\ninput.addEventListener('focus', function(event) {\n  console.log('Input\
    \ focused');\n});\ninput.addEventListener('blur', function(event) {\n  console.log('Input\
    \ lost focus');\n});\n```\n\n### 窗口事件\n\n1. `load`：当页面加载完成时触发。\n\n```javascript\n\
    window.addEventListener('load', function(event) {\n  console.log('Page fully loaded');\n\
    });\n```\n\n2. `resize`：当浏览器窗口大小改变时触发。\n\n```javascript\nwindow.addEventListener('resize',\
    \ function(event) {\n  console.log('Window resized');\n});\n```\n\n3. `scroll`：当文档视图滚动时触发。\n\
    \n```javascript\nwindow.addEventListener('scroll', function(event) {\n  console.log('Window\
    \ scrolled');\n});\n```\n\n### 自定义事件\n\n```javascript\n// Create a custom event\n\
    const customEvent = new CustomEvent('myCustomEvent', {\n  detail: { message: 'Hello\
    \ from custom event!' }\n});\n\n// Add a listener for the custom event\ndocument.addEventListener('myCustomEvent',\
    \ function(event) {\n  console.log(event.detail.message);\n});\n\n// Dispatch\
    \ the custom event\ndocument.dispatchEvent(customEvent);\n```\n\n通过理解和有效使用这些事件，你可以创建丰富的、交互式的\
    \ Web 应用程序，这些程序可以响应用户操作和浏览器事件。\n\n## DOM 操作和事件处理的最佳实践\n\n### 1. 最小化 DOM 访问和操作\n\
    \n访问和操作 DOM 通常是性能方面最昂贵的操作。为了优化你的代码：\n\n* 当你需要多次使用一个元素时，缓存 DOM 引用。\n* 使用 `DocumentFragment`\
    \ 批量更新 DOM，或者在将元素添加到 DOM 之前进行修改。\n* 使用 CSS 类进行样式更改，而不是直接操作内联样式。\n\n```javascript\n\
    // Bad: Multiple DOM accesses\ndocument.getElementById('myElement').style.color\
    \ = 'red';\ndocument.getElementById('myElement').style.fontSize = '16px';\ndocument.getElementById('myElement').style.fontWeight\
    \ = 'bold';\n\n// Good: Single DOM access with cached reference\nconst element\
    \ = document.getElementById('myElement');\nelement.style.color = 'red';\nelement.style.fontSize\
    \ = '16px';\nelement.style.fontWeight = 'bold';\n\n// Even better: Use CSS classes\n\
    element.classList.add('highlighted');\n```\n\n### 2. 使用事件委托\n\n如前所述，事件委托可以显著提升性能并使代码更易于维护，尤其是在处理动态内容或大量相似元素时。\n\
    \n### 3. 对昂贵操作进行防抖或节流\n\n对于可以快速触发的事件（如 scroll 或 resize），使用防抖或节流技术来限制事件处理程序的调用频率。\n\
    \n```javascript\nfunction debounce(func, delay) {\n  let timeoutId;\n  return\
    \ function (...args) {\n    clearTimeout(timeoutId);\n    timeoutId = setTimeout(()\
    \ => func.apply(this, args), delay);\n  };\n}\nwindow.addEventListener('resize',\
    \ debounce(function() {\n  console.log('Window resized');\n}, 250));\n```\n\n\
    ### 4. 使用现代 DOM API\n\n现代 DOM API 通常提供更高效的方式来操作 DOM。例如：\n\n* 使用 `querySelector`\
    \ 和 `querySelectorAll` 而不是像 `getElementsByClassName` 这样的旧方法。\n* 使用 `classList`\
    \ 而不是直接操作 `className` 字符串。\n* 当你只设置文本内容时，使用 `textContent` 而不是 `innerHTML`。\n\n\
    ### 5. 清理事件监听器\n\n当事件监听器不再需要时，一定要将其移除，特别是对于将从 DOM 中移除的元素。这可以防止内存泄漏和意外行为。\n\n```javascript\n\
    function handleClick() {\n  // Handler logic\n}\n```\n"
