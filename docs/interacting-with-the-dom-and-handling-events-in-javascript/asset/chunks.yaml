    \n## 附\n- 术语表\n- 示例代码与模板\n\n# 第 1 章：DOM 简介\n\n## 1.1 什么是 DOM？\n文档对象模型（DOM）是用于\
    \ HTML 和 XML 文档的编程接口。它将文档结构表示为树形层次结构的对象，允许开发者使用 JavaScript 等编程语言动态地访问和操作网页的内容、结构和样式。\n\
    \n### 文档对象模型 (DOM) 解释\nDOM 充当网页与编程语言之间的桥梁，它提供了文档的结构化表示，可以使用 JavaScript 等脚本语言进行修改。它定义了：\n\
    \n1. 文档的结构\n2. 访问和操作文档的方式\n3. 文档元素之间的关系\n\nDOM 并不是一种编程语言，但没有它，JavaScript 就对网页、HTML\
    \ 文档、XML 文档及其组成部分没有任何模型或概念。文档中的每一个元素——整个文档、头部（head）、文档中的表格、表头、单元格内的文本——都是该文档文档对象模型的一部分。这些元素可以使用\
    \ DOM 和像 JavaScript 脚本语言进行访问和操作。\n\nDOM 的关键特性包括：\n- 与平台和语言无关：DOM 设计上用于在任何编程语言和任何平台上的运行。\n\
    - 动态访问：它允许对文档的内容、结构和样式进行动态访问。\n- 程序化控制：开发者可以通过编程更改文档的结构、样式和内容。\n- 标准化：DOM 是 W3C（世界维网联盟）标准，确保了不同浏览器和平台之间的一致性。\n\
    \n### 理解浏览器如何解释 HTML 文档\n当网页浏览器加载 HTML 文档时，它会经过几个步骤来解释并显示内容：\n\n1. 解析（Parsing）：浏览器解析\
    \ HTML，将其转换为 DOM 树结构。\n2. 创建 DOM 树：根据解析后的 HTML，浏览器创建一个表示文档内容和结构的层次化树形对象结构。\n3.\
    \ 创建 CSSOM：浏览器还解析 CSS 并创建 CSS 对象模型（CSSOM），它表示与 DOM 元素关联的样式。\n4. 构建渲染树（Render Tree）：浏览器结合\
    \ DOM 和 CSSOM 创建渲染树，该树仅包含处于最终样式和排序状态的可见元素。\n5. 布局（Layout）：浏览器计算页面上每个对象的精确位置和大小。\n\
    6. 绘制（Painting）：最后，浏览器将像素绘制到屏幕上，显示页面的视觉呈现。\n\n理解这一过程对于 Web 开发者至关重要，因为有助于优化网页性能并创建高效、响应式的设计。\n\
    \n## 1.2 DOM 树结构\nDOM 将文档表示为层次化的树结构，由各种类型的节点组成。这种树形表示允许对文档的内容和结构进行高效的遍历和操作。\n\n\
    ### 节点：元素、文本、注释、文档等\nDOM 树由不同类型的节点组成，每个节点代表文档的特定部分。主要的节点类型有：\n\n1. **文档节点 (Document\
    \ Node)**：\n   - 代表整个文档\n   - 作为 DOM 树的根节点\n   - 每个页面只有一个文档节点\n2. **元素节点 (Element\
    \ Nodes)**：\n   - 代表 HTML 元素（例如 `<div>`、`<p>`, `<a>`）\n   - 可以拥有属性和子节点\n   - 构成文档的结构\n\
    3. **属性节点 (Attribute Nodes)**：\n   - 代表元素节点的属性\n   - 不视为子节点，而是元素的属性\n4. **文本节点\
    \ (Text Nodes)**：\n   - 包含元素内的实际内容\n   - 始终是叶子节点（没有子节点）\n5. **注释节点 (Comment Nodes)**：\n\
    \   - 代表文档中的 HTML 注释\n   - 浏览器不渲染，但可以通过 DOM 访问\n6. **文档类型节点 (DocumentType Node)**：\n\
    \   - 代表类型声明（例如 `<!DOCTYPE html>`）\n7. **文档碎片节点 (DocumentFragment Node)**：\n \
    \  - 轻量级文档，用于存储文档片段\n   - 用于在将节点添加到活动 DOM 之前进行操作\n\n理解这些节点类型对于有效的 DOM 操作至关重要，因为不同类型的节点具有不同的属性和方法。\n\
    \n### DOM 树的层次结构表示\nDOM 树按照层次化的父子关系组织，其中：\n- 文档节点位于层次结构的顶端（根节点）。\n- 元素节点可以是其他元素的父节点、子节点或兄弟节点。\n\
    - 文本节点和注释节点始终是叶子节点（不能拥有子节点）。\n\n以下是 HTML 文档表示为 DOM 树的简化示例：\n\n```\nDocument\n\
    └── html\n    ├── head\n    │   ├── title\n    │   │   └── Text: \"My Web Page\"\
    \n    │   └── meta\n    └── body\n        ├── h1\n        │   └── Text: \"Welcome\"\
    \n        ├── p\n        │   └── Text: \"This is a paragraph.\"\n        └── div\n\
    \            ├── Comment: \"This is a comment\"\n            └── a\n         \
    \       └── Text: \"Click here\"\n```\n\n在此表示中：\n- Document 节点是根。\n- html 是 Document\
    \ 的子节点，是 head 和 body 的父节点。\n- head 和 body 是兄弟节点。\n\n"
- fmt: "\n*   Text nodes (like \"Welcome\" or \"This is a paragraph.\") are leaf nodes.\n\
    *   The comment node is a child of the `div` element.\n\nThis hierarchical structure\
    \ allows for efficient traversal and manipulation of the document. For example,\
    \ you can easily move from one node to its parent, children, or siblings, which\
    \ is fundamental for many DOM operations.\n\n## 1.3 Accessing the DOM with JavaScript\n\
    \nJavaScript plays a crucial role in manipulating the DOM, allowing developers\
    \ to create dynamic and interactive web pages. Through JavaScript, you can access,\
    \ modify, add, or delete elements and their content, change styles, and respond\
    \ to user interactions.\n\n### The role of JavaScript in manipulating the DOM\n\
    \nJavaScript interacts with the DOM through a set of APIs (Application Programming\
    \ Interfaces) provided by web browsers. These APIs allow JavaScript to:\n\n1.\
    \ Access Elements:\n   - Find and select specific elements in the document.\n\
    \   - Example: `document.getElementById('myElement')`\n\n2. Modify Content:\n\
    \   - Change the text or HTML content of elements.\n   - Example: `element.textContent\
    \ = 'New text'`\n\n3. Change Styles:\n   - Alter the CSS styles of elements dynamically.\n\
    \   - Example: `element.style.color = 'red'`\n\n4. Create and Delete Elements:\n\
    \   - Add new elements to the document or remove existing ones.\n   - Example:\
    \ `document.createElement('div')`, `element.remove()`\n\n5. Add and Remove Classes:\n\
    \   - Modify the classes applied to elements, affecting their styling and behavior.\n\
    \   - Example: `element.classList.add('highlight')`\n\n6. Handle Events:\n   -\
    \ Respond to user actions like clicks, key presses, or form submissions.\n   -\
    \ Example: `element.addEventListener('click', handleClick)`\n\n7. Traverse the\
    \ DOM:\n   - Move between parent, child, and sibling elements.\n   - Example:\
    \ `element.parentNode`, `element.children`\n\n8. Modify Attributes:\n   - Change\
    \ element attributes like src, href, or custom data attributes.\n   - Example:\
    \ `element.setAttribute('src', 'new-image.jpg')`\n\nThese capabilities allow developers\
    \ to create highly interactive and responsive web applications. By manipulating\
    \ the DOM, JavaScript can update the content and appearance of a web page without\
    \ requiring a full page reload, leading to a smoother user experience.\n\nKey\
    \ concepts in DOM manipulation with JavaScript include:\n\n*   Selecting Elements:\n\
    \    *   `document.getElementById()`\n    *   `document.getElementsByClassName()`\n\
    \    *   `document.getElementsByTagName()`\n    *   `document.querySelector()`\
    \ and `document.querySelectorAll()`\n\n*   Modifying Elements:\n    *   Changing\
    \ text content: `element.textContent` or `element.innerText`\n    *   Changing\
    \ HTML content: `element.innerHTML`\n    *   Modifying attributes: `element.setAttribute()`,\
    \ `element.getAttribute()`\n\n*   Creating and Removing Elements:\n    *   Creating:\
    \ `document.createElement()`\n    *   Appending: `parentElement.appendChild()`\n\
    \    *   Removing: `element.remove()` or `parentElement.removeChild()`\n\n*  \
    \ Modifying Styles:\n    *   Directly: `element.style.property = 'value'`\n  \
    \  *   Using classes: `element.classList.add()`, `element.classList.remove()`\n\
    \n*   Event Handling:\n    *   Adding event listeners: `element.addEventListener('event',\
    \ handler)`\n    *   Removing event listeners: `element.removeEventListener('event',\
    \ handler)`\n\nUnderstanding these concepts and methods is essential for effective\
    \ DOM manipulation and creating dynamic web applications with JavaScript.\n\n\
    ## 1.4 Setting Up Your Development Environment\n\nSetting up a proper development\
    \ environment is crucial for efficient and effective web development. This section\
    \ covers the essential tools and setup needed for JavaScript and DOM manipulation.\n\
    \n### Tools and editors for JavaScript development\n\n1. Text Editors and IDEs:\n\
    \   - Visual Studio Code: A popular, free, open-source editor with excellent JavaScript\
    \ support.\n     - Features: IntelliSense, debugging, Git integration, and a vast\
    \ extension marketplace.\n     - Recommended extensions for JavaScript:\n    \
    \   - ESLint: For code quality and style checking\n       - Prettier: For code\
    \ formatting\n       - JavaScript (ES6) code snippets: For quick code insertion\n\
    \       - Live Server: For running a local development server\n   - WebStorm:\
    \ A powerful IDE specifically designed for JavaScript development.\n     - Features:\
