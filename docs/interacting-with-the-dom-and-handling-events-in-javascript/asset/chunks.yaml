    \ block of the `DOM`, representing an element, attribute, or text in the document.\n\
    3. `Element`: A specific type of node that represents an HTML element.\n4. `Event`:\
    \ An action or occurrence detected by the program, often initiated by the user\
    \ or the browser.\n5. `Event Listener`: A function that waits for a specific event\
    \ to occur and then executes in response to that event.\n6. `Event Propagation`:\
    \ The process by which events travel through the `DOM` tree, either in the capturing\
    \ or bubbling phase.\n7. `Event Delegation`: A technique where a single event\
    \ listener is attached to a parent element to handle events for its child elements.\n\
    8. `Bubbling`: The default event propagation mode where an event starts from the\
    \ target element and bubbles up through its ancestors.\n9. `Capturing`: An event\
    \ propagation mode where an event starts from the root of the `DOM` tree and travels\
    \ down to the target element.\n10. `preventDefault()`: A method used to stop the\
    \ default action of an event from occurring.\n11. `stopPropagation()`: A method\
    \ used to prevent an event from bubbling up the `DOM` tree.\n12. `querySelector()`:\
    \ A method that returns the first element that matches a specified CSS selector.\n\
    13. `querySelectorAll()`: A method that returns a static `NodeList` containing\
    \ all elements that match a specified CSS selector.\n14. `innerHTML`: A property\
    \ that sets or returns the HTML content inside an element.\n15. `textContent`:\
    \ A property that sets or returns the text content of a node and its descendants.\n\
    16. `setAttribute()`: A method used to add a new attribute or change the value\
    \ of an existing attribute on an element.\n17. `classList`: A read-only property\
    \ that returns a live `DOMTokenList` collection of the class attributes of an\
    \ element.\n18. `DocumentFragment`: A lightweight object that stores a segment\
    \ of a document.\n19. `Reflow`: The process of recalculating positions of elements.\n\
    20. `Repaint`: The process of updating visual appearance.\n21. `Debounce`: A practice\
    \ used to ensure time-consuming tasks do not fire often.\n22. `Throttle`: A technique\
    \ to control how many times a function can be called over time.\n23. `Polyfill`:\
    \ A piece of code used to provide functionality on older browsers that do not\
    \ support it.\n24. `Feature Detection`: The practice of determining whether a\
    \ browser supports something.\n25. `Web Workers`: Scripts that run in the background\
    \ independently of other.\n\n### Sample Code and Templates\n\n#### 1. Basic Event\
