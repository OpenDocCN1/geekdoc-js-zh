    \        li.className = 'todo-item';\n        if (todo.completed) {\n        \
    \    li.classList.add('completed');\n        }\n        li.innerHTML = `     \
    \       <span>${todo.text}</span>            <span class=\"due-date\">${todo.dueDate\
    \ ? new Date(todo.dueDate).toLocaleDateString() : 'No due date'}</span>      \
    \      <div              <button class=\"complete-btn\">${todo.completed ? 'Undo'\
    \ : 'Complete'}</button>              <button class=\"edit-btn\">Edit</button>\
    \              <button class=\"delete-btn\">Delete</button>          </div>`;\n\
    \        // ... (其余的渲染代码)\n}\n// 修改表单以包含日期输入\ntodoForm.innerHTML = `<input type=\"\
    text\" id=\"todo-input\" placeholder=\"Enter a new task\" required><input type=\"\
    date\" id=\"todo-date\"><button type=\"submit\">Add Task</button>`; \nconst todoDateInput\
    \ = document.getElementById('todo-date');\ntodoForm.addEventListener('submit',\
