    Note: Be cautious when using innerHTML with user-provided content, as it can introduce
    security vulnerabilities if not properly sanitized.


    ### Modifying Element Attributes


    You can get, set, or remove element attributes using various methods and properties.


    #### getAttribute() and setAttribute()


    These methods allow you to get and set attribute values:


    const  link  =  document.querySelector(''a''); const  href  =  link.getAttribute(''href'');
    link.setAttribute(''href'', ''https://example.com'');


    #### Directly accessing attributes


    For many standard attributes, you can access them directly as properties of the
    element:


    const  image  =  document.querySelector(''img''); image.src  =  ''new-image.jpg'';
    image.alt  =  ''A new descriptive alt text'';


    #### removeAttribute()


    This method removes an attribute from an element:


    const  button  =  document.querySelector(''button''); button.removeAttribute(''disabled'');


    ### Modifying Element Styles


    You can change the styles of an element using the style property or by manipulating
    CSS classes.


    #### Using the style property


    The style property allows you to directly set inline styles on an element:


    const  div  =  document.querySelector(''div''); div.style.backgroundColor  =  ''blue'';
    div.style.fontSize  =  ''18px''; div.style.padding  =  ''10px'';


    #### Manipulating CSS classes


    You can add, remove, or toggle CSS classes using the classList property:


    const  element  =  document.querySelector(''.my-element''); // Add a class element.classList.add(''active'');
    // Remove a class element.classList.remove(''disabled''); // Toggle a class element.classList.toggle(''highlighted'');
    // Check if a class exists if (element.classList.contains(''important'')) {


      // Do something }


    Using CSS classes for styling is often preferred over inline styles, as it promotes
    better separation of concerns and makes it easier to manage styles across your
    application.


    ## Creating and Removing DOM Elements


    In addition to manipulating existing elements, you can dynamically create new
    elements and remove existing ones from the DOM.


    ### Creating Elements


    To create a new element, you use the createElement() method:


    const  newParagraph  =  document.createElement(''p''); newParagraph.textContent  =  ''This
    is a new paragraph.'';


    ### Adding Elements to the DOM


    Once you''ve created an element, you can add it to the DOM using methods like
    appendChild(), insertBefore(), or append():


    const  container  =  document.querySelector(''.container''); // Append the new
    paragraph to the end of the container container.appendChild(newParagraph); //
    Insert the new paragraph before an existing element const  existingElement  =  document.querySelector(''.existing-element'');
    container.insertBefore(newParagraph, existingElement); // Append multiple elements
    at once (newer method) container.append(newParagraph, document.createElement(''hr''),
    ''Some text'');


    ### Removing Elements from the DOM


    To remove an element from the DOM, you can use the removeChild() method on the
    parent element, or the remove() method on the element itself:


    const  elementToRemove  =  document.querySelector(''.remove-me''); // Using removeChild()
    elementToRemove.parentNode.removeChild(elementToRemove); // Using remove() (newer
    method) elementToRemove.remove();


    ### Replacing Elements


    You can replace an existing element with a new one using the replaceChild() method:


    const  oldElement  =  document.querySelector(''.old-element''); const  newElement  =  document.createElement(''div'');
    newElement.textContent  =  ''I am the replacement''; oldElement.parentNode.replaceChild(newElement,
    oldElement);


    Creating and removing elements dynamically allows you to build more interactive
    and responsive web applications that can adapt to user actions and changing data.


    ## Handling Events


    Event handling is a crucial aspect of creating interactive web applications. JavaScript
    allows you to respond to various user actions and browser events by attaching
    event listeners to DOM elements.


    ### Adding Event Listeners


    The most common way to handle events in modern JavaScript is by using the addEventListener()
    method. This method allows you to attach multiple event listeners to a single
    element without overwriting existing ones.


    const  button  =  document.querySelector(''#myButton''); button.addEventListener(''click'',
    function(event) {


      console.log(''Button clicked!'');


      console.log(event); // The event object contains information about the event
    });


    ### Event Object


    When an event occurs, the browser creates an event object that contains information
    about the event. This object is automatically passed to the event handler function.
    Some useful properties of the event object include:


    *   event.target: The element that triggered the event


    *   event.type: The type of event (e.g., ''click'', ''mouseover'')


    *   event.preventDefault(): A method to prevent the default behavior of the event


    *   event.stopPropagation(): A method to stop the event from bubbling up the DOM
    tree


    ### Common Event Types


    Here are some frequently used event types:


    1.  Mouse events:


    *   click: Fired when an element is clicked


    *   dblclick: Fired when an element is double-clicked


    *   mouseover: Fired when the mouse enters an element


    *   mouseout: Fired when the mouse leaves an element


    2.  Keyboard events:


    *   keydown: Fired when a key is pressed down


    *   keyup: Fired when a key is released


    *   keypress: Fired when a key is pressed (for printable characters)


    3.  Form events:


    *   submit: Fired when a form is submitted


    *   change: Fired when the value of an input element changes


    *   focus: Fired when an element receives focus


    *   blur: Fired when an element loses focus


    4.  Window events:


    *   load: Fired when the page finishes loading


    *   resize: Fired when the browser window is resized


    *   scroll: Fired when the document view is scrolled


    ### Removing Event Listeners


    To remove an event listener, you use the removeEventListener() method. Note that
    you need to provide the same function reference that was used to add the listener:


    function  handleClick(event) {


      console.log(''Button clicked!'');


    } button.addEventListener(''click'', handleClick); // Later, when you want to
    remove the listener: button.removeEventListener(''click'', handleClick);


    ### Event Handling Best Practices


    1.  Use semantic names for your event handler functions to improve code readability.


    2.  Keep your event handlers small and focused. If the handler becomes complex,
    consider breaking it into smaller functions.


    3.  Use event delegation for dynamically created elements or when dealing with
    many similar elements.


    4.  Be cautious with event listeners that may cause performance issues, such as
    ''scroll'' or ''resize'' events. Consider using throttling or debouncing techniques.


    5.  Always remove event listeners when they are no longer needed, especially for
    elements that will be removed from the DOM.


    ## Event Propagation


    Event propagation refers to the order in which events are received on the page.
    Understanding event propagation is crucial for properly handling events in complex
    DOM structures.


    ### Bubbling and Capturing


    There are two main phases of event propagation:


    1.  Capturing Phase: The event starts from the window, then the document, and
    moves down through the DOM tree to the target element.


    2.  Bubbling Phase: After reaching the target, the event bubbles up from the target
    element back through its ancestors to the window.


    By default, event listeners are triggered during the bubbling phase.


    ### Controlling Event Propagation


    You can control event propagation using the following methods:


    1.  event.stopPropagation(): Stops the event from bubbling up the DOM tree.


    2.  event.stopImmediatePropagation(): Stops the event from bubbling and prevents
    other listeners on the same element from being called.'
