    *   reset: Occurs when a form is reset


    *   change: Occurs when the value of an input element changes


    *   input: Occurs immediately after the value of an input element changes


    *   focus: Occurs when an element receives focus


    *   blur: Occurs when an element loses focus


    4.  Window Events: These are related to the browser window itself.


    *   load: Occurs when a page finishes loading


    *   unload: Occurs when a page is unloaded (for example, when navigating to a
    new page)


    *   resize: Occurs when the browser window is resized


    *   scroll: Occurs when the document view or an element has been scrolled


    5.  Document Events: These are related to the HTML document.


    *   DOMContentLoaded: Occurs when the initial HTML document has been completely
    loaded and parsed, without waiting for stylesheets, images, and subframes to finish
    loading


    ### Understanding the event flow: capture and bubbling


    When an event occurs on an element that has parent elements, modern browsers run
    two different phases - the capturing phase and the bubbling phase.


    1.  Capturing Phase:


    The event starts from the root of the document and moves down to the target element.
    It''s rarely used in practice, but can be utilized by passing true as the third
    argument to addEventListener().


    2.  Target Phase:


    The event reaches the target element.


    3.  Bubbling Phase:


    After reaching the target, the event bubbles up through its ancestors in the DOM
    tree, triggering any event listeners on the way.


    Here''s an example to illustrate event bubbling:


    <div  id="outer">


      <div  id="inner">


        <button  id="button">Click me!</button>


      </div>


    </div>


    <script> document.getElementById(''outer'').addEventListener(''click'', function()
    {


      console.log(''Outer div clicked'');


    }); document.getElementById(''inner'').addEventListener(''click'', function()
    {


      console.log(''Inner div clicked'');


    }); document.getElementById(''button'').addEventListener(''click'', function()
    {


      console.log(''Button clicked'');


    });


    </script>


    If you click the button, you''ll see the following output in the console:


    Button clicked


    Inner div clicked


    Outer div clicked


    This demonstrates how the event bubbles up from the target element through its
    ancestors.


    ## 4.2 Adding Event Listeners


    Event listeners are the primary way to handle events in modern JavaScript. They
    allow you to attach event handling functions to elements without cluttering your
    HTML with inline event handlers.


    ### Using addEventListener() to register event handlers


    The addEventListener() method is used to attach an event handler to an element.
    Its syntax is as follows:


    element.addEventListener(eventType, handlerFunction, useCapture);


    *   eventType: A string that specifies the type of event (e.g., ''click'', ''mouseover'',
    ''submit'')


    *   handlerFunction: The function to be executed when the event occurs


    *   useCapture: (Optional) A boolean value that specifies whether to use event
    capturing (true) or event bubbling (false, default)


    Here''s an example:


    let  button  =  document.getElementById(''myButton''); button.addEventListener(''click'',
    function(event) {


      console.log(''Button clicked!'');


    });


    You can also use named functions as event handlers:


    function  handleClick(event) {


      console.log(''Button clicked!'');


    } button.addEventListener(''click'', handleClick);


    ### Differences between inline event handlers and addEventListener()


    1.  Separation of Concerns: addEventListener() allows you to keep your JavaScript
    separate from your HTML, promoting better code organization.


    2.  Multiple Event Handlers: With addEventListener(), you can add multiple event
    handlers for the same event on the same element. Inline event handlers will overwrite
    each other.


    3.  Flexibility: addEventListener() provides more control over the event handling
    process, including the ability to use event capturing.


    4.  Removal: Event listeners added with addEventListener() can be removed using
    removeEventListener(), which is not possible with inline event handlers.


    Here''s a comparison:


    Inline event handler:


    <button  onclick="handleClick()">Click me</button>


    Using addEventListener():


    <button  id="myButton">Click me</button>


    <script>


      document.getElementById(''myButton'').addEventListener(''click'', handleClick);


    </script>


    The addEventListener() approach is generally considered better practice in modern
    web development.


    ## 4.3 Common Event Types


    Let''s explore some of the most commonly used event types in more detail.


    ### Mouse events


    1.  click:


    Triggered when an element is clicked (pressed and released) with a mouse or similar
    device.


    element.addEventListener(''click'', function(event) {


      console.log(''Element clicked'');


    });


    2.  dblclick:


    Triggered when an element is double-clicked.


    element.addEventListener(''dblclick'', function(event) {


      console.log(''Element double-clicked'');


    });


    3.  mouseover:


    Triggered when the mouse pointer enters an element.


    element.addEventListener(''mouseover'', function(event) {


      console.log(''Mouse over element'');


    });


    4.  mouseout:


    Triggered when the mouse pointer leaves an element.


    element.addEventListener(''mouseout'', function(event) {


      console.log(''Mouse left element'');


    });


    5.  mousemove:


    Triggered repeatedly as the mouse pointer moves over an element.


    element.addEventListener(''mousemove'', function(event) {


      console.log(''Mouse position:'', event.clientX, event.clientY);


    });


    ### Keyboard events


    1.  keydown:


    Triggered when a key is pressed down.


    document.addEventListener(''keydown'', function(event) {


      console.log(''Key pressed:'', event.key);


    });


    2.  keyup:


    Triggered when a key is released.


    document.addEventListener(''keyup'', function(event) {


      console.log(''Key released:'', event.key);


    });


    3.  keypress:


    Triggered when a key that produces a character value is pressed down. Note that
    this event is deprecated and keydown should be used instead.


    document.addEventListener(''keypress'', function(event) {


      console.log(''Key pressed (character):'', event.key);


    });


    ### Form events


    1.  submit:


    Triggered when a form is submitted.


    form.addEventListener(''submit'', function(event) {


      event.preventDefault(); // Prevent the form from actually submitting   console.log(''Form
    submitted'');


    });


    2.  change:


    Triggered when the value of an input element changes and loses focus.


    input.addEventListener(''change'', function(event) {


      console.log(''Input value changed to:'', this.value);


    });


    3.  input:


    Similar to ''change'', but triggered immediately when the value changes.


    input.addEventListener(''input'', function(event) {


      console.log(''Input value is now:'', this.value);


    });


    4.  focus:


    Triggered when an element receives focus.


    input.addEventListener(''focus'', function(event) {


      console.log(''Input focused'');


    });


    5.  blur:


    Triggered when an element loses focus.


    input.addEventListener(''blur'', function(event) {


      console.log(''Input lost focus'');


    });


    These events form the foundation of interactivity in web applications. By combining
    them creatively, you can create rich, responsive user interfaces.


    ## 4.4 Handling Events with Event Objects


    When an event occurs, the browser creates an event object, a special object that
    contains details about the event. This object is automatically passed to event
    handler functions.


    ### Understanding the event object and its properties


    The event object contains a wealth of information about the event that occurred.
    Some common properties include:


    *   type: The type of event (e.g., ''click'', ''keydown'')


    *   target: The element that triggered the event


    *   currentTarget: The element that the event listener is attached to


    *   clientX/clientY: The horizontal/vertical coordinate of the mouse pointer relative
    to the client area of the browser window


    *   keyCode or key: The key pressed (for keyboard events)


    *   preventDefault(): A method to prevent the default action of the event


    *   stopPropagation(): A method to stop the event from bubbling up the DOM tree'
