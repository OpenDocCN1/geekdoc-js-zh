    });\nparent.addEventListener('click', function(event) {\n  console.log('Parent\
    \ clicked'); // This won't be logged if the child is clicked });\n```\n\nTo attach\
    \ an event listener that triggers during the capturing phase, set the third parameter\
    \ of `addEventListener()` to true:\n\n```javascript\nparent.addEventListener('click',\
    \ function(event) {\n  console.log('Parent clicked (capturing phase)');\n}, true);\n\
    child.addEventListener('click', function(event) {\n  console.log('Child clicked');\n\
    });\n```\n\nIn this example, clicking the child element will log \"Parent clicked\
    \ (capturing phase)\" first, followed by \"Child clicked\".\n\n## Event Delegation\n\
    \nEvent delegation is a technique that leverages event bubbling to handle events\
    \ efficiently when you have many similar child elements inside a parent element.\n\
    \n### How Event Delegation Works\n\nInstead of attaching event listeners to each\
    \ child element, you attach a single listener to a parent element. When an event\
    \ occurs on a child element, it bubbles up to the parent, where you can handle\
    \ it.\n\n### Benefits of Event Delegation\n\n1. Improved performance, especially\
    \ for large numbers of elements\n2. Dynamically added elements are automatically\
    \ handled\n3. Reduced memory usage due to fewer event listeners\n4. Cleaner and\
    \ more maintainable code\n\n### Example of Event Delegation\n\n```html\n<ul id=\"\
    todo-list\">\n  <li>Task 1</li>\n  <li>Task 2</li>\n  <li>Task 3</li>\n</ul>\n\
    ```\n\n```javascript\nconst todoList = document.getElementById('todo-list');\n\
    todoList.addEventListener('click', function(event) {\n  if (event.target.tagName\
    \ === 'LI') {\n    console.log('Task clicked:', event.target.textContent);\n \
    \   event.target.classList.toggle('completed');\n  }\n});\n```\n\nIn this example,\
    \ instead of adding a click event listener to each `<li>` element, we add a single\
    \ listener to the parent `<ul>`. When a list item is clicked, the event bubbles\
    \ up to the `<ul>`, where we check if the clicked element is an `<li>` before\
    \ handling the event.\n\n## Common DOM Events\n\n### Mouse Events\n\n1. `click`:\
    \ Triggered when an element is clicked.\n\n```javascript\nelement.addEventListener('click',\
    \ function(event) {\n  console.log('Element clicked');\n});\n```\n\n2. `dblclick`:\
    \ Triggered when an element is double-clicked.\n\n```javascript\nelement.addEventListener('dblclick',\
    \ function(event) {\n  console.log('Element double-clicked');\n});\n```\n\n3.\
    \ `mouseover` and `mouseout`: Triggered when the mouse enters or leaves an element.\n\
    \n```javascript\nelement.addEventListener('mouseover', function(event) {\n  console.log('Mouse\
    \ over element');\n});\nelement.addEventListener('mouseout', function(event) {\n\
    \  console.log('Mouse left element');\n});\n```\n\n4. `mousedown` and `mouseup`:\
    \ Triggered when a mouse button is pressed or released over an element.\n\n```javascript\n\
    element.addEventListener('mousedown', function(event) {\n  console.log('Mouse\
    \ button pressed');\n});\nelement.addEventListener('mouseup', function(event)\
    \ {\n  console.log('Mouse button released');\n});\n```\n\n### Keyboard Events\n\
    \n1. `keydown` and `keyup`: Triggered when a key is pressed or released.\n\n```javascript\n\
    document.addEventListener('keydown', function(event) {\n  console.log('Key pressed:',\
    \ event.key);\n});\ndocument.addEventListener('keyup', function(event) {\n  console.log('Key\
    \ released:', event.key);\n});\n```\n\n2. `keypress`: Triggered when a key that\
    \ produces a character value is pressed.\n\n```javascript\ndocument.addEventListener('keypress',\
    \ function(event) {\n  console.log('Character key pressed:', event.key);\n});\n\
    ```\n\n### Form Events\n\n1. `submit`: Triggered when a form is submitted.\n\n\
    ```javascript\nconst form = document.querySelector('form');\nform.addEventListener('submit',\
    \ function(event) {\n  event.preventDefault(); // Prevent the form from submitting\n\
    \  console.log('Form submitted');\n});\n```\n\n2. `change`: Triggered when the\
    \ value of an input element changes.\n\n```javascript\nconst input = document.querySelector('input');\n\
    input.addEventListener('change', function(event) {\n  console.log('Input value\
    \ changed:', event.target.value);\n});\n```\n\n3. `focus` and `blur`: Triggered\
    \ when an element gains or loses focus.\n\n```javascript\ninput.addEventListener('focus',\
    \ function(event) {\n  console.log('Input focused');\n});\ninput.addEventListener('blur',\
    \ function(event) {\n  console.log('Input lost focus');\n});\n```\n\n### Window\
    \ Events\n\n1. `load`: Triggered when the page has finished loading.\n\n```javascript\n\
    window.addEventListener('load', function(event) {\n  console.log('Page fully loaded');\n\
    });\n```\n\n2. `resize`: Triggered when the browser window is resized.\n\n```javascript\n\
    window.addEventListener('resize', function(event) {\n  console.log('Window resized');\n\
    });\n```\n\n3. `scroll`: Triggered when the document view is scrolled.\n\n```javascript\n\
    window.addEventListener('scroll', function(event) {\n  console.log('Window scrolled');\n\
    });\n```\n\n### Custom Events\n\n```javascript\n// Create a custom event\nconst\
    \ customEvent = new CustomEvent('myCustomEvent', {\n  detail: { message: 'Hello\
    \ from custom event!' }\n});\n\n// Add a listener for the custom event\ndocument.addEventListener('myCustomEvent',\
    \ function(event) {\n  console.log(event.detail.message);\n});\n\n// Dispatch\
    \ the custom event\ndocument.dispatchEvent(customEvent);\n```\n\nBy understanding\
    \ and effectively using these events, you can create rich, interactive web applications\
    \ that respond to user actions and browser events.\n\n## Best Practices for DOM\
    \ Manipulation and Event Handling\n\n### 1. Minimize DOM Access and Manipulation\n\
    \nAccessing and manipulating the DOM is often the most expensive operation in\
    \ terms of performance. To optimize your code:\n\n* Cache DOM references when\
    \ you need to use an element multiple times.\n* Batch DOM updates using `DocumentFragment`\
    \ or by modifying elements before adding them to the DOM.\n* Use CSS classes for\
    \ styling changes instead of manipulating inline styles directly.\n\n```javascript\n\
    // Bad: Multiple DOM accesses\ndocument.getElementById('myElement').style.color\
    \ = 'red';\ndocument.getElementById('myElement').style.fontSize = '16px';\ndocument.getElementById('myElement').style.fontWeight\
    \ = 'bold';\n\n// Good: Single DOM access with cached reference\nconst element\
    \ = document.getElementById('myElement');\nelement.style.color = 'red';\nelement.style.fontSize\
    \ = '16px';\nelement.style.fontWeight = 'bold';\n\n// Even better: Use CSS classes\n\
    element.classList.add('highlighted');\n```\n\n### 2. Use Event Delegation\n\n\
    As discussed earlier, event delegation can significantly improve performance and\
    \ make your code more maintainable, especially when dealing with dynamic content\
    \ or large numbers of similar elements.\n\n### 3. Debounce or Throttle Expensive\
    \ Operations\n\nFor events that can fire rapidly (like scroll or resize), use\
    \ debouncing or throttling techniques to limit how often the event handler is\
    \ called.\n\n```javascript\nfunction debounce(func, delay) {\n  let timeoutId;\n\
    \  return function (...args) {\n    clearTimeout(timeoutId);\n    timeoutId =\
    \ setTimeout(() => func.apply(this, args), delay);\n  };\n}\nwindow.addEventListener('resize',\
    \ debounce(function() {\n  console.log('Window resized');\n}, 250));\n```\n\n\
    ### 4. Use Modern DOM APIs\n\nModern DOM APIs often provide more efficient ways\
    \ to manipulate the DOM. For example:\n\n* Use `querySelector` and `querySelectorAll`\
    \ instead of older methods like `getElementsByClassName`.\n* Use `classList` instead\
    \ of manipulating the `className` string directly.\n* Use `textContent` instead\
    \ of `innerHTML` when you're only setting text content.\n\n### 5. Clean Up Event\
    \ Listeners\n\nAlways remove event listeners when they are no longer needed, especially\
    \ for elements that will be removed from the DOM. This prevents memory leaks and\
    \ unexpected behavior.\n\n```javascript\nfunction handleClick() {\n  // Handler\
    \ logic\n}\n```\n"
