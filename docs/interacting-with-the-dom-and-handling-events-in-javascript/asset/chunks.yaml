    # Chapter 3: Manipulating DOM Elements


    The Document Object Model (DOM) is a programming interface for HTML and XML documents.
    It represents the structure of a document as a tree-like hierarchy of objects,
    where each object represents a part of the document, such as an element, attribute,
    or text node. JavaScript provides powerful tools to manipulate the DOM, allowing
    developers to dynamically modify the content, structure, and style of web pages.


    In this chapter, we''ll explore various techniques for manipulating DOM elements
    using JavaScript, including modifying element content, changing attributes and
    styles, adding and removing elements, creating and cloning elements, and manipulating
    classes.


    ## 3.1 Modifying Element Content


    When working with the DOM, one of the most common tasks is modifying the content
    of elements. JavaScript provides several ways to achieve this, each with its own
    use cases and considerations.


    ### Using textContent


    The textContent property allows you to get or set the text content of an element,
    excluding any HTML tags. This is useful when you want to work with plain text
    without worrying about HTML parsing or potential security issues.


    // Getting text content const  element  =  document.getElementById(''myElement'');
    console.log(element.textContent); // Setting text content element.textContent  =  ''New
    text content'';


    Using textContent is generally faster than innerHTML because it doesn''t involve
    parsing HTML. It''s also safer when dealing with user-generated content, as it
    doesn''t execute any scripts that might be present in the text.


    ### Using innerHTML


    The innerHTML property allows you to get or set the HTML content inside an element.
    This is useful when you need to work with HTML structures or insert formatted
    content.


    // Getting HTML content const  element  =  document.getElementById(''myElement'');
    console.log(element.innerHTML); // Setting HTML content element.innerHTML  =  ''<strong>New</strong>
    HTML content'';


    While innerHTML is powerful, it should be used with caution, especially when dealing
    with user-generated content. Inserting arbitrary HTML can lead to cross-site scripting
    (XSS) vulnerabilities if not properly sanitized.


    ### Using outerHTML


    The outerHTML property is similar to innerHTML, but it includes the element itself
    in addition to its content.


    // Getting outer HTML const  element  =  document.getElementById(''myElement'');
    console.log(element.outerHTML); // Setting outer HTML (replaces the entire element)
    element.outerHTML  =  ''<div id="newElement">Replaced element</div>'';


    When setting outerHTML, the entire element is replaced, which can be useful for
    completely swapping out elements but may require careful handling of event listeners
    and references.


    ### Working with templates and script-generated HTML


    For more complex HTML structures, it''s often better to use HTML templates or
    create elements programmatically. This approach can provide better performance
    and maintainability compared to large string concatenations.


    #### Using template literals


    Template literals in JavaScript allow for easy creation of multi-line strings
    and string interpolation, making them useful for generating HTML:


    const  name  =  ''John Doe''; const  age  =  30; const  htmlContent  =  `    <div
    class="user-card">      <h2>${name}</h2>  <p>Age: ${age}</p>    </div>  `; document.getElementById(''container'').innerHTML  =  htmlContent;


    #### Using DocumentFragment


    For better performance when creating multiple elements, you can use a DocumentFragment
    as a lightweight container:


    const  fragment  =  document.createDocumentFragment(); for (let  i  =  0; i  <  1000;
    i++) {


      const  div  =  document.createElement(''div'');


      div.textContent  =  `Item ${i}`;


      fragment.appendChild(div);


    } document.getElementById(''container'').appendChild(fragment);


    This approach minimizes DOM reflows and repaints, leading to better performance
    when adding many elements at once.


    ## 3.2 Changing Element Attributes and Styles


    Modifying element attributes and styles is crucial for dynamic web applications.
    JavaScript provides several methods to achieve this, allowing you to change how
    elements look and behave on the fly.


    ### Using setAttribute() and getAttribute()


    The setAttribute() and getAttribute() methods allow you to work with element attributes
    directly.


    const  link  =  document.getElementById(''myLink''); // Getting an attribute const  href  =  link.getAttribute(''href'');
    console.log(href); // Setting an attribute link.setAttribute(''href'', ''https://example.com'');
    link.setAttribute(''target'', ''_blank'');


    These methods are useful for working with custom attributes or when you need to
    ensure cross-browser compatibility.


    ### Adding, removing, and modifying CSS styles via JavaScript


    JavaScript provides multiple ways to manipulate an element''s styles.


    #### Using the style property


    The style property allows direct access to an element''s inline styles:


    const  element  =  document.getElementById(''myElement''); // Setting individual
    styles element.style.color  =  ''red''; element.style.fontSize  =  ''16px''; //
    Setting multiple styles at once Object.assign(element.style, {


      backgroundColor:  ''black'',


      padding:  ''10px'',


      borderRadius:  ''5px'' });


    This method is useful for making quick, specific style changes, but it sets inline
    styles, which have high specificity and may override styles set in CSS files.


    #### Using classList


    The classList property provides methods to add, remove, and toggle classes, which
    is often a better approach for applying predefined styles:


    const  element  =  document.getElementById(''myElement''); element.classList.add(''highlight'');
    element.classList.remove(''hidden''); element.classList.toggle(''active'');


    This approach is more flexible and maintainable, as it allows you to define styles
    in CSS and apply them dynamically with JavaScript.


    #### Using getComputedStyle()


    To read the actual computed styles of an element, including those set by CSS files,
    you can use the getComputedStyle() method:


    const  element  =  document.getElementById(''myElement''); const  styles  =  window.getComputedStyle(element);
    console.log(styles.color); console.log(styles.fontSize);


    This is useful when you need to read styles that might not be set inline or when
    you need to get the final computed values after all CSS rules have been applied.


