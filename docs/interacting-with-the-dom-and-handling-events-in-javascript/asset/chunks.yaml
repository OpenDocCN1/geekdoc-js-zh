    const parent = document.getElementById('parentElement');\nconst referenceNode\
    \ = document.getElementById('referenceElement');\nconst newNode = document.createElement('div');\n\
    newNode.textContent = 'Inserted before reference';\nparent.insertBefore(newNode,\
    \ referenceNode);\n```\n\n## `removeChild()`\n\n`removeChild()` removes a child\
    \ node from the DOM and returns the removed node.\n\n```javascript\nconst parent\
    \ = document.getElementById('parentElement');\nconst childToRemove = document.getElementById('childElement');\n\
    const removedChild = parent.removeChild(childToRemove);\n```\n\n## Modern Methods:\
    \ `append()`, `prepend()`, `remove()`\n\nModern browsers support newer, more intuitive\
    \ methods for manipulating the DOM.\n\n### `append()`\n\n`append()` inserts a\
    \ set of `Node` objects or `DOMString` objects after the last child of the `Element`.\n\
    \n```javascript\nconst parent = document.getElementById('parentElement');\nconst\
    \ newElement1 = document.createElement('div');\nconst newElement2 = document.createElement('span');\n\
    parent.append(newElement1, 'Some text', newElement2);\n```\n\n`append()` can accept\
    \ multiple arguments and can directly insert strings as text nodes.\n\n### `prepend()`\n\
    \n`prepend()` inserts a set of `Node` objects or `DOMString` objects before the\
    \ first child of the `Element`.\n\n```javascript\nconst parent = document.getElementById('parentElement');\n\
    const newElement = document.createElement('div');\nparent.prepend(newElement,\
    \ 'Prepended text');\n```\n\n### `remove()`\n\n`remove()` removes the element\
    \ from the DOM.\n\n```javascript\nconst elementToRemove = document.getElementById('removeMe');\n\
    elementToRemove.remove();\n```\n\nThis method is simpler than `removeChild()`\
    \ as it doesn't require a reference to the parent element.\n\n## 3.4 Creating\
    \ and Cloning Elements\n\nCreating new elements and cloning existing ones are\
    \ essential techniques for building dynamic web pages.\n\n### `createElement()`\n\
    \nThe `createElement()` method creates a new element specified by `tagName`.\n\
    \n```javascript\nconst newDiv = document.createElement('div');\nnewDiv.id = 'myNewDiv';\n\
    newDiv.className = 'new-element';\nnewDiv.textContent = 'This is a newly created\
    \ div';\ndocument.body.appendChild(newDiv);\n```\n\nThis method allows you to\
    \ create any HTML element programmatically. After creation, you can set attributes,\
    \ add content, and append it to the DOM.\n\n### `cloneNode()`\n\nThe `cloneNode()`\
    \ method creates a copy of a node.\n\n```javascript\nconst originalElement = document.getElementById('original');\n\
    const clonedElement = originalElement.cloneNode(true);\nclonedElement.id = 'cloned';\n\
    document.body.appendChild(clonedElement);\n```\n\nThe boolean parameter in `cloneNode(true)`\
    \ specifies whether to clone the element's descendants as well (deep clone). If\
    \ set to `false`, only the element itself is cloned without its children.\n\n\
    Cloning can be useful when you need to create multiple similar elements quickly,\
    \ but be careful with IDs and event listeners, as they may need to be adjusted\
    \ in the cloned elements.\n\n## 3.5 Manipulating Classes\n\nClass manipulation\
    \ is a powerful way to change the appearance and behavior of elements dynamically.\
    \ The `classList` property provides methods to `add`, `remove`, and `toggle` classes\
    \ efficiently.\n\n### `classList`\n\nThe `classList` property is a read-only property\
    \ that returns a live `DOMTokenList` collection of the class attributes of the\
    \ element.\n\n#### Adding classes\n\nTo add one or more classes to an element:\n\
    \n```javascript\nconst element = document.getElementById('myElement');\nelement.classList.add('new-class');\n\
    element.classList.add('class1', 'class2', 'class3');\n```\n\n#### Removing classes\n\
    \nTo remove one or more classes from an element:\n\n```javascript\nelement.classList.remove('old-class');\n\
    element.classList.remove('class1', 'class2');\n```\n\n#### Toggling classes\n\n\
    To `toggle` a class (`add` if it's not present, `remove` if it is):\n\n```javascript\n\
    element.classList.toggle('active');\n```\n\nYou can also force a specific state:\n\
    \n```javascript\n// Force add (second parameter is true)\nelement.classList.toggle('visible',\
    \ true);\n// Force remove (second parameter is false)\nelement.classList.toggle('hidden',\
    \ false);\n```\n\n#### Checking if a class exists\n\nTo check if an element has\
    \ a specific class:\n\n```javascript\nif (element.classList.contains('highlight'))\
    \ {\n    console.log('Element has highlight class');\n}\n```\n\n#### Replacing\
    \ a class\n\nTo replace one class with another:\n\n```javascript\nelement.classList.replace('old-class',\
    \ 'new-class');\n```\n\n### Practical Examples\n\n1. Implementing a tab system:\n\
    \n```javascript\nfunction switchTab(tabId) {\n    // Remove 'active' class from\
    \ all tabs\n    document.querySelectorAll('.tab').forEach(tab => {\n        tab.classList.remove('active');\n\
    \    });\n    // Add 'active' class to selected tab\n    document.getElementById(tabId).classList.add('active');\n\
    }\n```\n\n2. Creating a collapsible element:\n\n```javascript\nconst collapsible\
    \ = document.getElementById('collapsible');\nconst content = document.getElementById('content');\n\
    collapsible.addEventListener('click', () => {\n    content.classList.toggle('collapsed');\n\
    \    collapsible.classList.toggle('expanded');\n});\n```\n\n3. Implementing a\
    \ theme switcher:\n\n```javascript\nfunction toggleTheme() {\n    document.body.classList.toggle('dark-theme');\n\
    \    document.body.classList.toggle('light-theme');\n}\n```\n\nClass manipulation\
    \ is a powerful technique for creating dynamic and interactive web pages. It allows\
    \ you to separate your styling concerns (in CSS) from your behavioral logic (in\
    \ JavaScript), leading to more maintainable and flexible code.\n\n## Conclusion\n\
    \nManipulating DOM elements is a fundamental skill for any web developer working\
    \ with JavaScript. The techniques covered in this chapter provide a solid foundation\
    \ for creating dynamic, interactive web applications. From modifying element content\
    \ and attributes to adding and removing elements, and manipulating classes, these\
    \ skills enable you to create responsive and engaging user interfaces.\n\nRemember\
    \ to consider performance implications when making frequent DOM manipulations,\
    \ and always be mindful of security concerns, especially when working with user-generated\
    \ content. As you become more comfortable with these techniques, you'll find that\
    \ they open up a world of possibilities for creating rich, interactive web experiences.\n\
    \nPractice these techniques regularly, and don't hesitate to explore the MDN Web\
    \ Docs for more detailed information on each method and property discussed. Happy\
    \ coding!\n\n# Chapter 4: Event Handling in JavaScript\n\nEvent handling is a\
    \ crucial aspect of JavaScript programming, especially when creating interactive\
    \ web applications. This chapter delves into the intricacies of events, how to\
    \ handle them, and best practices for working with events in JavaScript.\n\n##\
    \ 4.1 What are Events?\n\nEvents are actions or occurrences that happen in the\
    \ system you are programming, which the system tells you about so you can respond\
    \ to them. In the context of web development, events are typically user actions\
    \ or browser manipulations that can be detected and responded to using JavaScript.\n\
    \n### Overview of browser events\n\nBrowser events can be categorized into several\
    \ types:\n\n1. Mouse Events: These are triggered by user interactions with a pointing\
    \ device, such as a mouse or touchpad.\n\n   * `click`: Occurs when an element\
    \ is clicked\n   * `dblclick`: Occurs when an element is double-clicked\n   *\
    \ `mousedown`: Occurs when a mouse button is pressed down on an element\n   *\
    \ `mouseup`: Occurs when a mouse button is released over an element\n   * `mousemove`:\
    \ Occurs when the mouse pointer moves while it's over an element\n   * `mouseover`:\
    \ Occurs when the mouse pointer enters an element\n   * `mouseout`: Occurs when\
    \ the mouse pointer leaves an element\n\n2. Keyboard Events: These are triggered\
    \ by user interactions with the keyboard.\n\n   * `keydown`: Occurs when a key\
    \ is pressed down\n   * `keyup`: Occurs when a key is released\n   * `keypress`:\
    \ Occurs when a key that produces a character value is pressed down (deprecated)\n\
    \n3. Form Events: These are associated with HTML form elements and their interactions.\n"
