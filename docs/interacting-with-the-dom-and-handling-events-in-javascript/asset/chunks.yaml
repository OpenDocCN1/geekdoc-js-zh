  trans: "\n*   文本节点（如\"Welcome\"或\"This is a paragraph.\"）是叶子节点。\n*   注释节点是`div`元素的子节点。\n\
    \n这种层次结构允许高效地遍历和操作文档。例如，你可以轻松地从一个节点移动到它的父节点、子节点或兄弟节点，这对于许多 DOM 操作来说是基础。\n\n##\
    \ 1.3 使用 JavaScript 访问 DOM\n\nJavaScript 在操作 DOM 方面起着至关重要的作用，使开发者能够创建动态和交互式网页。通过\
    \ JavaScript，你可以访问、修改、添加或删除元素及其内容，更改样式，并响应用户交互。\n\n### JavaScript 在操作 DOM 中的作用\n\
    \nJavaScript 通过 Web 浏览器提供的一组 API（应用程序编程接口）与 DOM 进行交互。这些 API 允许 JavaScript：\n\n\
    1. 访问元素：\n   - 在文档中查找和选择特定元素。\n   - 示例：`document.getElementById('myElement')`\n\
    \n2. 修改内容：\n   - 更改元素的文本或 HTML 内容。\n   - 示例：`element.textContent = 'New text'`\n\
    \n3. 更改样式：\n   - 动态更改元素的 CSS 样式。\n   - 示例：`element.style.color = 'red'`\n\n4.\
    \ 创建和删除元素：\n   - 向文档添加新元素或删除现有元素。\n   - 示例：`document.createElement('div')`、`element.remove()`\n\
    \n5. 添加和删除类：\n   - 修改应用于元素的类，影响其样式和行为。\n   - 示例：`element.classList.add('highlight')`\n\
    \n6. 处理事件：\n   - 响应用户操作，如点击、按键或表单提交。\n   - 示例：`element.addEventListener('click',\
    \ handleClick)`\n\n7. 遍历 DOM：\n   - 在父元素、子元素和兄弟元素之间移动。\n   - 示例：`element.parentNode`、`element.children`\n\
    \n8. 修改属性：\n   - 更改元素属性，如 src、href 或自定义数据属性。\n   - 示例：`element.setAttribute('src',\
    \ 'new-image.jpg')`\n\n这些功能使开发者能够创建高度交互式和响应式的 Web 应用程序。通过操作 DOM，JavaScript 可以在不需要完全重新加载页面的情况下更新网页的内容和外观，从而带来更流畅的用户体验。\n\
    \nJavaScript 中 DOM 操作的关键概念包括：\n\n*   选择元素：\n    *   `document.getElementById()`\n\
    \    *   `document.getElementsByClassName()`\n    *   `document.getElementsByTagName()`\n\
    \    *   `document.querySelector()` 和 `document.querySelectorAll()`\n\n*   修改元素：\n\
    \    *   更改文本内容：`element.textContent` 或 `element.innerText`\n    *   更改 HTML 内容：`element.innerHTML`\n\
    \    *   修改属性：`element.setAttribute()`、`element.getAttribute()`\n\n*   创建和删除元素：\n\
    \    *   创建：`document.createElement()`\n    *   追加：`parentElement.appendChild()`\n\
    \    *   删除：`element.remove()` 或 `parentElement.removeChild()`\n\n*   修改样式：\n\
    \    *   直接修改：`element.style.property = 'value'`\n    *   使用类：`element.classList.add()`、`element.classList.remove()`\n\
    \n*   事件处理：\n    *   添加事件监听器：`element.addEventListener('event', handler)`\n  \
    \  *   移除事件监听器：`element.removeEventListener('event', handler)`\n\n理解这些概念和方法对于有效地操作\
    \ DOM 和使用 JavaScript 创建动态 Web 应用程序至关重要。\n\n## 1.4 设置你的开发环境\n\n设置适当的开发环境对于高效和有效的\
    \ Web 开发至关重要。本节涵盖 JavaScript 和 DOM 操作所需的基本工具和设置。\n\n### JavaScript 开发的工具和编辑器\n\
    \n1. 文本编辑器和 IDE：\n   - Visual Studio Code：一款流行、免费、开源的编辑器，具有出色的 JavaScript 支持。\n\
    \     - 功能：IntelliSense、调试、Git 集成和大量的扩展市场。\n     - 推荐的 JavaScript 扩展：\n      \
    \ - ESLint：用于代码质量和风格检查\n       - Prettier：用于代码格式化\n       - JavaScript (ES6) 代码片段：用于快速插入代码\n\
    \       - Live Server：用于运行本地开发服务器\n   - WebStorm：一款专为 JavaScript 开发设计的强大 IDE。\n\
    \     - 功能：高级代码补全、重构工具和内置调试器。\n   - Sublime Text：一款轻量级、快速的文本编辑器，拥有强大的插件生态系统。\n\
    \   - Atom：另一款具有良好 JavaScript 支持和可定制性的开源编辑器。\n\n2. 浏览器开发者工具：\n   - 对于调试和检查网页至关重要。\n\
    \   - 主要功能：\n     - 元素检查器：用于检查和修改 DOM\n     - 控制台：用于 JavaScript 输出和测试\n     -\
    \ 网络标签：用于监控 HTTP 请求\n     - 源代码标签：用于调试 JavaScript 代码\n   - 所有现代浏览器都提供（Chrome、Firefox、Safari、Edge）\n\
    \n3. 版本控制：\n   - Git：使用最广泛的版本控制系统。\n   - GitHub Desktop 或 SourceTree：Git 的图形界面客户端，适合不熟悉命令行界面的用户。\n\
    \n4. 包管理器：\n   - npm（Node 包管理器）：随 Node.js 安装一起提供，用于管理 JavaScript 包。\n   - Yarn：npm\
    \ 的替代方案，提供更快的包安装和更好的依赖管理。\n\n5. 任务运行器和构建工具：\n   - Webpack：模块打包器和构建工具，对于现代 JavaScript\
    \ 开发至关重要。\n   - Gulp 或 Grunt：用于自动化开发工作流程的任务运行器。\n\n6. 代码检查器和格式化工具：\n   - ESLint：用于识别和报告\
    \ JavaScript 代码中的模式。\n   - Prettier：一个固执己见的代码格式化工具，确保一致的代码风格。\n\n7. 测试框架：\n  \
    \ - Jest：一个全面的 JavaScript 测试框架。\n   - Mocha：一个灵活的 JavaScript 测试框架，适用于 Node.js\
    \ 和浏览器。\n\n8. 浏览器扩展：\n   - React Developer Tools：用于调试 React 应用程序。\n   - Redux\
    \ DevTools：用于调试 Redux 状态管理。\n   - Vue.js devtools：用于调试 Vue.js 应用程序。\n\n设置这些工具将大大提升你的\
    \ JavaScript 开发体验，使编写、调试和维护代码变得更加容易。\n\n### 基本的 HTML 模板设置\n\n基本的 HTML 模板作为 Web\
    \ 开发项目的起点。以下是一个简单的、现代的 HTML5 模板，你可以用它作为基础：\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n    <title>My Web Page</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n</head>\n<body>\n    <header>\n\
    \        <h1>Welcome to My Web Page</h1>\n    </header>\n    <main>\n        <p>This\
    \ is the main content area.</p>\n    </main>\n    <footer>\n        <p>&copy;\
    \ 2023 My Web Page. All rights reserved.</p>\n    </footer>\n    <script src=\"\
    script.js\"></script>\n</body>\n</html>\n```\n\n让我们分解这个模板的关键组件：\n\n1. DOCTYPE\
    \ 声明：`<!DOCTYPE html>` 声明这是 HTML5 文档。\n2. HTML 元素：HTML 页面的根元素，设置了 lang 属性以便于无障碍访问和\
    \ SEO。\n3. Head 部分：\n   - `<meta charset=\"UTF-8\">`：指定文档的字符编码。\n   - `<meta name=\"\
    viewport\" ...>`：确保在移动设备上正确渲染。\n   - `<title>`：设置出现在浏览器标签页中的页面标题。\n   - `<link>`：链接到外部\
    \ CSS 文件以进行样式设置。\n4. Body 部分：\n   - 包含网页的可见内容。\n   - 使用语义化 HTML5 元素（`<header>`、`<main>`、`<footer>`）进行结构化。\n\
    5. 脚本包含：\n   - `<script>` 标签放在 `<body>` 末尾，以获得更好的页面加载性能。\n\n这个模板为构建网页提供了坚实的基础，适合涉及\
    \ JavaScript DOM 操作的项目。随着项目的发展，你可以扩展这个基本结构。\n\n要开始使用这个模板：\n"
- fmt: "\n1. Create a new file with a `.html` extension (e.g., `index.html`).\n2.\
    \ Copy the template code into this file.\n3. Create separate files for CSS (`styles.css`)\
    \ and JavaScript (`script.js`).\n4. Link these files in the HTML as shown in the\
    \ template.\n5. Open the HTML file in a web browser to view your page.\n\nRemember\
    \ to adjust the content, add more elements, and customize the styles and scripts\
    \ as needed for your specific project requirements.\n\n## Interacting with the\
    \ DOM and Handling Events in JavaScript\n\nInteracting with the DOM and handling\
    \ events are fundamental aspects of creating dynamic and interactive web applications.\
    \ This section will cover the basics of DOM manipulation and event handling in\
    \ JavaScript.\n\n### Basic DOM Manipulation\n\n1. Selecting Elements:\nJavaScript\
    \ provides several methods to select elements from the DOM:\n\n```javascript\n\
    // By ID \nconst element = document.getElementById('myId'); \n// By class name\
    \ \nconst elements = document.getElementsByClassName('myClass'); \n// By tag name\
    \ \nconst paragraphs = document.getElementsByTagName('p'); \n// Using CSS selectors\
    \ \nconst firstMatch = document.querySelector('.myClass'); \nconst allMatches\
    \ = document.querySelectorAll('.myClass');\n```\n\n2. Modifying Element Content:\n\
    You can change the text or HTML content of an element:\n\n```javascript\n// Changing\
    \ text content \nelement.textContent = 'New text content'; \n// Changing HTML\
    \ content \nelement.innerHTML = '<strong>New HTML content</strong>';\n```\n\n\
    3. Modifying Attributes:\nAttributes of elements can be accessed and modified:\n\
    \n```javascript\n// Get attribute value \nconst src = img.getAttribute('src');\
    \ \n// Set attribute value \nimg.setAttribute('src', 'new-image.jpg'); \n// Remove\
    \ attribute \nelement.removeAttribute('class');\n```\n\n4. Modifying Styles:\n\
    Element styles can be changed directly or by manipulating classes:\n\n```javascript\n\
    // Direct style modification \nelement.style.color = 'red'; \nelement.style.fontSize\
    \ = '16px'; \n// Class manipulation \nelement.classList.add('highlight'); \nelement.classList.remove('hidden');\
    \ \nelement.classList.toggle('active');\n```\n\n5. Creating and Removing Elements:\n\
    New elements can be created and added to the DOM, and existing elements can be\
    \ removed:\n\n```javascript\n// Create a new element \nconst newDiv = document.createElement('div');\
    \ \nnewDiv.textContent = 'New Element'; \n// Append to an existing element \n\
    document.body.appendChild(newDiv); \n// Remove an element \nelement.remove();\
    \ \n// or \nelement.parentNode.removeChild(element);\n```\n\n### Event Handling\n\
    \nEvents are actions or occurrences that happen in the system you are programming,\
    \ which the system tells you about so you can respond to them. Here's how to work\
    \ with events in JavaScript:\n\n1. Adding Event Listeners:\nThe `addEventListener`\
    \ method is used to attach an event handler to an element:\n\n```javascript\n\
    const button = document.querySelector('button'); \nbutton.addEventListener('click',\
    \ function() {\n    console.log('Button clicked!');\n});\n```\n\n2. Common Events:\n\
    Some frequently used events include:\n* `click`: When an element is clicked\n\
    * `submit`: When a form is submitted\n* `keydown`, `keyup`: When a key is pressed\
    \ or released\n* `mouseover`, `mouseout`: When the mouse enters or leaves an element\n\
    * `load`: When a page or an element has finished loading\n* `change`: When the\
    \ value of an input element changes\n\n3. Event Object:\nThe event handler function\
    \ receives an event object that contains information about the event:\n\n```javascript\n\
    button.addEventListener('click', function(event) {\n    console.log('Clicked at\
    \ coordinates:', event.clientX, event.clientY);\n    event.preventDefault(); //\
    \ Prevent default behavior \n});\n```\n\n4. Removing Event Listeners:\nEvent listeners\
    \ can be removed when they're no longer needed:\n\n```javascript\nfunction handleClick()\
    \ {\n    console.log('Clicked!');\n} \nbutton.addEventListener('click', handleClick);\
    \ \n// Later, when you want to remove the listener \nbutton.removeEventListener('click',\
    \ handleClick);\n```\n\n5. Event Delegation:\nInstead of adding event listeners\
    \ to multiple elements, you can use event delegation by adding the listener to\
    \ a parent element:\n\n```javascript\ndocument.getElementById('parent-list').addEventListener('click',\
    \ function(e) {\n    if(e.target && e.target.nodeName == \"LI\") {\n        console.log(\"\
    List item \", e.target.id, \" was clicked!\");\n    }\n});\n```\n\n6. Custom Events:\n\
    You can create and dispatch custom events:\n\n```javascript\n// Create a custom\
    \ event \nconst customEvent = new CustomEvent('myCustomEvent', {\n    detail:\
    \ { message: 'Hello from custom event!' }\n}); \n// Dispatch the event \nelement.dispatchEvent(customEvent);\
    \ \n// Listen for the custom event \nelement.addEventListener('myCustomEvent',\
    \ function(e) {\n    console.log(e.detail.message);\n});\n```\n\n### Practical\
    \ Example: Interactive To-Do List\n\nLet's put these concepts together in a practical\
    \ example of an interactive to-do list:\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1.0\">\n    <title>Interactive To-Do List</title>\n\
    \    <style>\n        .completed { text-decoration: line-through; }\n    </style>\n\
    </head>\n<body>\n    <h1>My To-Do List</h1>\n    <input type=\"text\" id=\"todoInput\"\
    \ placeholder=\"Enter a new task\">\n    <button id=\"addButton\">Add Task</button>\n\
    \    <ul id=\"todoList\"></ul>\n    <script>\n        const todoInput = document.getElementById('todoInput');\n\
    \        const addButton = document.getElementById('addButton');\n        const\
    \ todoList = document.getElementById('todoList');\n        addButton.addEventListener('click',\
    \ addTodo);\n        todoInput.addEventListener('keypress', function(e) {\n  \
    \          if (e.key === 'Enter') addTodo();\n        });\n        function addTodo()\
    \ {\n            const todoText = todoInput.value.trim();\n            if (todoText)\
    \ {\n                const li = document.createElement('li');\n              \
    \  li.textContent = todoText;\n                li.addEventListener('click', function()\
    \ {\n                    this.classList.toggle('completed');\n               \
    \ });\n                const deleteButton = document.createElement('button');\n\
    \                deleteButton.textContent = 'Delete';\n                deleteButton.addEventListener('click',\
    \ function(e) {\n                    e.stopPropagation(); // Prevent triggering\
    \ the li click event\n                    li.remove();\n                });\n\
    \                li.appendChild(deleteButton);\n                todoList.appendChild(li);\n\
    \                todoInput.value = '';\n            }\n        }\n    </script>\n\
    </body>\n</html>\n```\n\nThis example demonstrates:\n* Selecting elements from\
    \ the DOM\n* Adding event listeners to elements\n* Creating and appending new\
    \ elements\n* Modifying element styles and classes\n* Event delegation (for the\
    \ delete buttons)\n* Preventing event propagation\n\nBy interacting with the DOM\
    \ and handling events, we've created a simple but functional to-do list application.\
    \ Users can add new tasks, mark tasks as completed, and delete tasks, all without\
    \ reloading the page.\n\nThis example serves as a foundation that can be expanded\
    \ with more features, improved styling, and potentially integration with backend\
    \ services for data persistence.\n\n### Advanced DOM Manipulation Techniques\n\
    \nAs you become more comfortable with basic DOM manipulation, you can explore\
    \ more advanced techniques to create more complex and efficient web applications.\n\
    \n1. Document Fragments:\nWhen adding multiple elements to the DOM, using a `DocumentFragment`\
    \ can improve performance:\n\n```javascript\nconst fragment = document.createDocumentFragment();\
    \ \nfor (let i = 0; i < 1000; i++) {\n    const li = document.createElement('li');\n\
    \    li.textContent = `Item ${i}`;\n    fragment.appendChild(li);\n} \ndocument.getElementById('myList').appendChild(fragment);\n\
    ```\n\n2. Mutation Observers:\nThese allow you to watch for changes being made\
    \ to the DOM tree:\n\n```javascript\nconst targetNode = document.getElementById('someElement');\
    \ \nconst observer = new MutationObserver((mutationsList, observer) => {\n   \
    \ for(let mutation of mutationsList) {\n        // handle mutation\n    }\n});\n\
    ```\n"
