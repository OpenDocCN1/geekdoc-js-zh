    \n```javascript\nfunction renderPage(pageName) {\n    showLoader();\n\n    //\
    \ Simulate an asynchronous page load\n    setTimeout(() => {\n      hideLoader();\n\
    \n      // Create a new div for the new content\n      const newContent = document.createElement('div');\n\
    \      newContent.innerHTML = pages[pageName] || '<h1>404 - Page Not Found</h1>';\n\
    \      newContent.className = 'page';\n\n      // Add the new content to the DOM\n\
    \      contentElement.appendChild(newContent);\n\n      // Trigger a reflow\n\
    \      newContent.offsetHeight;\n\n      // Add the 'active' class to trigger\
    \ the transition\n      newContent.classList.add('active');\n\n      // Remove\
    \ the old content after the transition\n      const oldContent = contentElement.querySelector('.page:not(.active)');\n\
    \      if (oldContent) {\n        oldContent.addEventListener('transitionend',\
    \ () => {\n          oldContent.remove();\n        });\n        oldContent.classList.remove('active');\n\
    \      }\n\n      // Update active link in navigation\n      document.querySelectorAll('nav\
    \ a').forEach(link => {\n        link.classList.toggle('active', link.dataset.page\
    \ === pageName);\n      });\n\n      // Update the URL\n      history.pushState(null,\
