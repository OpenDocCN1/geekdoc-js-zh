  trans: "\n\n# 表单验证实现\n\n## 代码\n\n```javascript\n// 获取表单和输入元素\nconst form = document.getElementById('registration-form');\n\
    const username = document.getElementById('username');\nconst email = document.getElementById('email');\n\
    const password = document.getElementById('password');\nconst confirmPassword =\
    \ document.getElementById('confirm-password');\n// 获取错误元素\nconst usernameError\
    \ = document.getElementById('username-error');\nconst emailError = document.getElementById('email-error');\n\
    const passwordError = document.getElementById('password-error');\nconst confirmPasswordError\
    \ = document.getElementById('confirm-password-error');\n// 验证函数\nfunction validateUsername()\
    \ {\n    const value = username.value.trim();\n    if (value === '') {\n     \
    \   showError(username, usernameError, 'Username is required');\n    } else if\
    \ (value.length < 3) {\n        showError(username, usernameError, 'Username must\
    \ be least 3 characters');\n    } else {\n        showSuccess(username, usernameError);\n\
    \        return true;\n    }\n    return false;\n}\nfunction validateEmail() {\n\
    \    const value = email.value.trim();\n    if (value === '') {\n        showError(email,\
    \ emailError, 'Email is required');\n    } else if (!isValidEmail(value)) {\n\
    \        showError(email, emailError, 'Please enter a valid email');\n    } else\
    \ {\n        showSuccess(email, emailError);\n        return true;\n    }\n  \
    \  return false;\n}\nfunction validatePassword() {\n    const value = password.value.trim();\n\
    \    if (value === '') {\n        showError(password, passwordError, 'Password\
    \ is required');\n    } else if (value.length < 6) {\n        showError(password,\
    \ passwordError, 'Password must be at least 6 characters');\n    } else {\n  \
    \      showSuccess(password, passwordError);\n        return true;\n    }\n  \
    \  return false;\n}\nfunction validateConfirmPassword() {\n    const passwordValue\
    \ = password.value.trim();\n    const confirmValue = confirmPassword.value.trim();\n\
    \    if (confirmValue === '') {\n        showError(confirmPassword, confirmPasswordError,\
    \ 'Please confirm your password');\n    } else if (confirmValue !== passwordValue)\
    \ {\n        showError(confirmPassword, confirmPasswordError, 'Passwords do not\
    \ match');\n    } else {\n        showSuccess(confirmPassword, confirmPasswordError);\n\
    \        return true;\n    }\n    return false;\n}\n// 辅助函数\nfunction showError(input,\
    \ errorElement, message) {\n    input.classList.add('error');\n    input.classList.remove('success');\n\
    \    errorElement.textContent = message;\n}\nfunction showSuccess(input, errorElement)\
    \ {\n    input.classList.add('success');\n    input.classList.remove('error');\n\
    \    errorElement.textContent = '';\n}\nfunction isValidEmail(email) {\n    const\
    \ re = /^(([^<>()\\[\\]\\\\.,;:\\s@\"]+(\\.[^<>()\\[\\]\\\\.,;:\\s@\"]+)*)|(\"\
    .+\"))@((\\[[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}])|(([a-zA-Z\\-0-9]+\\\
    .)+[a-zA-Z]{2,}))$/;\n    return re.test(String(email).toLowerCase());\n}\n//\
    \ 实时验证事件监听器\nusername.addEventListener('input', validateUsername);\nemail.addEventListener('input',\
    \ validateEmail);\npassword.addEventListener('input', validatePassword);\nconfirmPassword.addEventListener('input',\
    \ validateConfirmPassword);\n// 表单提交\nform.addEventListener('submit', (e) => {\n\
    \    e.preventDefault();\n    const isUsernameValid = validateUsername();\n  \
    \  const isEmailValid = validateEmail();\n    const isPasswordValid = validatePassword();\n\
    \    const isConfirmPasswordValid = validateConfirmPassword();\n    if (isUsernameValid\
    \ && isEmailValid && isPasswordValid && isConfirmPasswordValid) {\n        //\
    \ 如果所有验证通过，你就可以提交表单\n        alert('Form submitted successfully!');\n        //\
    \ 在这里通常你会将表单数据发送到服务器\n    }\n});\n```\n\n## 功能概述\n\n这段 JavaScript 代码实现了以下功能：\n\
    \n1. 我们获取了所有表单输入框和错误消息元素的引用。\n\n2. 我们为每个输入字段定义了验证函数：\n\n* `validateUsername`:\
    \ 检查 `username` 是否为空以及长度是否至少 3 个字符。\n* `validateEmail`: 检查 `email` 是否为空以及是否匹配有效的邮箱格式。\n\
    * `validatePassword`: 检查 `password` 是否为空以及长度是否至少 6 个字符。\n* `validateConfirmPassword`:\
    \ 检查 `confirmPassword` 是否与 `password` 匹配。\n\n3. 使用辅助函数 `showError` 和 `showSuccess`\
    \ 显示错误消息并更新输入样式。\n\n4. 我们为每个输入框添加了事件监听器，以便在用户输入时进行实时验证。\n\n5. 在提交表单时，阻止默认操作，运行所有验证，并仅在所有验证通过时才继续。\n\
    \n### 增强与扩展\n\n为了进一步改进此表单验证项目，考虑实现以下功能：\n\n1. **异步用户名可用性检查**：通过调用 API 检查 `username`\
    \ 是否已被。\n\n```javascript\nlet usernameTimeout;\nusername.addEventListener('input',\
    \ () => {\n    clearTimeout(usernameTimeout);\n    usernameTimeout = setTimeout(checkUsernameAvailability,\
    \ 500);\n});\nfunction checkUsernameAvailability() {\n    const value = username.value.trim();\n\
    \    if (value.length >= 3) {\n        // 模拟 API 调用\n        setTimeout(() =>\
    \ {\n            if (['admin', 'user', 'test'].includes(value)) {\n          \
    \      showError(username, usernameError, 'Username is already taken');\n    \
    \        } else {\n                showSuccess(username, usernameError);\n   \
    \         }\n        }, 1000);\n    }\n}\n```\n\n2. **密码强度计**：为 `password` 强度添加视觉指示器。\n\
    \n```javascript\nfunction checkPasswordStrength(password) {\n    let strength\
    \ = 0;\n    if (password.match(/[a-z]+/)) strength += 1;\n    if (password.match(/[A-Z]+/))\
    \ strength += 1;\n    if (password.match(/[0-9]+/)) strength += 1;\n    if (password.match(/[$@#&!]+/))\
    \ strength += 1;\n    return strength;\n}\npassword.addEventListener('input',\
    \ () => {\n    const strength = checkPasswordStrength(password.value);\n    const\
    \ strengthMeter = document.createElement('div');\n    strengthMeter.className\
    \ = 'strength-meter';\n    strengthMeter.style.width = `${strength * 25}%`;\n\
    \    strengthMeter.style.backgroundColor = ['red', 'orange', 'yellow', 'green'][strength\
    \ - 1];\n    const existingMeter = password.parentElement.querySelector('.strength-meter');\n\
    \    if (existingMeter) {\n        existingMeter.remove();\n    }\n    password.parentElement.appendChild(strengthMeter);\n\
    \    const strengthText = ['Weak', 'Fair', 'Good', 'Strong'][strength - 1];\n\
    \    passwordError.textContent = strengthText || '';\n    passwordError.style.color\
    \ = strengthMeter.style.backgroundColor;\n});\n```\n\n将此 CSS 添加到样式表中：\n\n```css\n\
    .strength-meter {\n    height: 5px;\n    margin-top: 5px;\n    transition: all\
    \ 0.3s;\n}\n```\n\n此实现在 `password` 输入框下方添加了一个视觉强度计。强度计根据 `password` 的强度改变颜色和长度。\n\
    \n3. **显示/隐藏密码**：添加一个切换按钮来显示或隐藏 `password`。\n\n```javascript\nfunction createPasswordToggle(inputElement)\
    \ {\n    const toggleButton = document.createElement('button');\n    toggleButton.type\
    \ = 'button';\n    toggleButton.textContent = 'Show';\n    toggleButton.className\
    \ = 'password-toggle';\n\n    toggleButton.addEventListener('click', () => {\n\
    \        if (inputElement.type === 'password') {\n            inputElement.type\
    \ = 'text';\n            toggleButton.textContent = 'Hide';\n        } else {\n\
    \            inputElement.type = 'password';\n            toggleButton.textContent\
    \ = 'Show';\n        }\n    });\n\n    inputElement.parentElement.appendChild(toggleButton);\n\
    }\ncreatePasswordToggle(password);\ncreatePasswordToggle(confirmPassword);\n```\n\
    \n将此 CSS 添加到样式表中：\n\n```css\n.password-toggle {\n    position: absolute;\n   \
    \ right: 10px;\n    top: 50%;\n    transform: translateY(-50%);\n    background:\
    \ none;\n    border: none;\n    cursor: pointer;\n    color: #333;\n}\n.form-group\
    \ {\n    position: relative;\n}\n```\n\n"
- fmt: "\n## 4. Form Data Persistence\n\nSave form data to `localStorage` to persist\
    \ across page reloads.\n\n```javascript\nfunction saveFormData() {\n    const\
    \ formData = {username: username.value,\n        email: email.value };\n    localStorage.setItem('formData',\
    \ JSON.stringify(formData));\n}\n\nfunction loadFormData() {\n    const savedData\
    \ = localStorage.getItem('formData');\n    if (savedData) {\n        const formData\
    \ = JSON.parse(savedData);\n        username.value = formData.username || '';\n\
    \        email.value = formData.email || '';\n    }\n}\n\nform.addEventListener('input',\
    \ saveFormData);\nwindow.addEventListener('load', loadFormData);\n```\n\n## 5.\
    \ Custom Validation Messages\n\nAllow users to set custom validation messages.\n\
    \n```javascript\nfunction setCustomValidationMessage(input, message) {\n    input.setCustomValidity(message);\n\
    \    input.reportValidity();\n}\n\nusername.addEventListener('invalid', (e) =>\
    \ {\n    if (username.value === '') {\n        setCustomValidationMessage(username,\
    \ 'Please enter a username');\n    } else {\n        setCustomValidationMessage(username,\
    \ 'Username must be at least 3 characters long');\n    }\n});\n\nemail.addEventListener('invalid',\
    \ (e) => {\n    if (email.value === '') {\n        setCustomValidationMessage(email,\
    \ 'Please enter an email address');\n    } else {\n        setCustomValidationMessage(email,\
    \ 'Please enter a valid email address');\n    }\n});\n```\n\n## 6. Accessibility\
    \ Improvements\n\nEnhance the form's accessibility with ARIA attributes and keyboard\
    \ navigation.\n\n```javascript\n// Add ARIA attributes to form elements\nform.setAttribute('aria-live',\
    \ 'polite');\n\nconst inputs = form.querySelectorAll('input');\ninputs.forEach(input\
    \ => {\n    const errorElement = document.getElementById(`${input.id}-error`);\n\
    \    input.setAttribute('aria-describedby', errorElement.id);\n});\n\n// Improve\
    \ keyboard navigation\nform.addEventListener('keydown', (e) => {\n    if (e.key\
    \ === 'Enter' && e.target.tagName === 'INPUT') {\n        e.preventDefault();\n\
    \        const inputs = Array.from(form.querySelectorAll('input'));\n        const\
    \ index = inputs.indexOf(e.target);\n        if (index < inputs.length - 1) {\n\
    \            inputs[index + 1].focus();\n        } else {\n            form.querySelector('button[type=\"\
    submit\"]').focus();\n        }\n    }\n});\n```\n\nThese enhancements significantly\
    \ improve the user experience and functionality of the form:\n\n- The password\
    \ strength meter provides immediate visual feedback to users about the security\
    \ of their chosen password.\n- The show/hide password toggle improves usability,\
    \ especially on mobile devices.\n- Form data persistence helps users who may need\
    \ to leave the page and come back later.\n- Custom validation messages provide\
    \ more specific and helpful feedback to users.\n- The accessibility improvements\
    \ make the form more usable for people using screen readers or keyboard navigation.\n\
    \nBy implementing these features, you're creating a more robust, user-friendly,\
    \ and accessible registration form. This project demonstrates advanced form handling\
    \ techniques, real-time validation, and consideration for user experience and\
    \ accessibility.\n\n## 7.4 Simple SPA Navigation\n\nCreating a Simple Single Page\
    \ Application (SPA) navigation system is an excellent way to demonstrate DOM manipulation\
    \ and event handling. This project will show how to create a basic SPA that allows\
    \ users to navigate between different \"pages\" without actually reloading the\
    \ page.\n\n### HTML Structure\n\nLet's start with the basic HTML structure:\n\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Simple SPA Navigation</title>\n    <link rel=\"stylesheet\" href=\"\
    styles.css\">\n</head>\n<body>\n    <nav>\n        <ul>\n            <li><a href=\"\
    #\" data-page=\"home\">Home</a></li>\n            <li><a href=\"#\" data-page=\"\
    about\">About</a></li>\n            <li><a href=\"#\" data-page=\"contact\">Contact</a></li>\n\
    \        </ul>\n    </nav>\n    <main id=\"content\">\n        <!-- Content will\
    \ be dynamically loaded here -->\n    </main>\n    <script src=\"script.js\"></script>\n\
    </body>\n</html>\n```\n\n### CSS Styling\n\nAdd some basic CSS to style the navigation\
    \ and content area:\n\n```css\nbody {\n    font-family: Arial, sans-serif;\n \
    \   line-height: 1.6;\n    margin: 0;\n    padding: 0;\n}\n\nnav {\n    background-color:\
    \ #333;\n    color: #fff;\n    padding: 1rem;\n}\n\nnav ul {\n    list-style-type:\
    \ none;\n    padding: 0;\n    margin: 0;\n    display: flex;\n}\n\nnav ul li {\n\
    \    margin-right: 1rem;\n}\n\nnav ul li a {\n    color: #fff;\n    text-decoration:\
    \ none;\n}\n\nmain {\n    padding: 2rem;\n}\n\n.page {\n    display: none;\n}\n\
    \n.page.active {\n    display: block;\n}\n```\n\n### JavaScript Implementation\n\
    \nNow, let's implement the SPA navigation functionality:\n\n```javascript\n//\
    \ Define page content\nconst pages = {\n    home: `\n        <h1>Welcome to Our\
    \ SPA</h1>\n        <p>This is the home page of our single page application.</p>\n\
    \    `,\n    about: `\n        <h1>About Us</h1>\n        <p>We are a company\
    \ dedicated to creating amazing SPAs.</p>\n    `,\n    contact: `\n        <h1>Contact\
    \ Us</h1>\n        <p>Get in touch with us at contact@example.com</p>\n    `\n\
    };\n\n// Get the main content element\nconst contentElement = document.getElementById('content');\n\
    \n// Function to render a page\nfunction renderPage(pageName) {\n    contentElement.innerHTML\
    \ = pages[pageName] || '<h1>404 - Page Not Found</h1>';\n    \n    // Update active\
    \ link in navigation\n    document.querySelectorAll('nav a').forEach(link => {\n\
    \        link.classList.toggle('active', link.dataset.page === pageName);\n  \
    \  });\n    \n    // Update the URL\n    history.pushState(null, '', `#${pageName}`);\n\
    }\n\n// Add click event listeners to navigation links\ndocument.querySelectorAll('nav\
    \ a').forEach(link => {\n    link.addEventListener('click', (e) => {\n       \
    \ e.preventDefault();\n        const pageName = e.target.dataset.page;\n     \
    \   renderPage(pageName);\n    });\n});\n\n// Handle browser back/forward navigation\n\
    window.addEventListener('popstate', () => {\n    const pageName = window.location.hash.slice(1)\
    \ || 'home';\n    renderPage(pageName);\n});\n\n// Initial page load\nconst initialPage\
    \ = window.location.hash.slice(1) || 'home';\nrenderPage(initialPage);\n```\n\n\
    This JavaScript code implements a basic SPA navigation system:\n\n1. We define\
    \ an object `pages` that contains the HTML content for each \"page\" of our SPA.\n\
    2. The `renderPage` function is responsible for updating the content of the page\
    \ and the active state of navigation links.\n3. We add click event listeners to\
    \ all navigation links. When a link is clicked, we prevent the default action\
    \ and render the appropriate page.\n4. We handle browser back/forward navigation\
    \ by listening to the `popstate` event.\n5. On initial page load, we render the\
    \ appropriate page based on the URL hash or default to the home page.\n\n### Enhancements\
    \ and Extensions\n\nTo improve this simple SPA navigation system, consider implementing\
    \ the following features:\n\n1. **Loading Indicator**: Add a loading indicator\
    \ for a more polished user experience.\n\n```javascript\nfunction showLoader()\
    \ {\n    const loader = document.createElement('div');\n    loader.className =\
    \ 'loader';\n    loader.textContent = 'Loading...';\n    contentElement.innerHTML\
    \ = '';\n    contentElement.appendChild(loader);\n}\n\nfunction hideLoader() {\n\
    \    const loader = document.querySelector('.loader');\n    if (loader) {\n  \
    \      loader.remove();\n    }\n}\n\n// Modify the renderPage function\nfunction\
    \ renderPage(pageName) {\n    showLoader();\n    \n    // Simulate an asynchronous\
    \ page load\n    setTimeout(() => {\n        hideLoader();\n        contentElement.innerHTML\
    \ = pages[pageName] || '<h1>404 - Page Not Found</h1>';\n        \n        //\
    \ Update active link in navigation\n        document.querySelectorAll('nav a').forEach(link\
    \ => {\n            link.classList.toggle('active', link.dataset.page === pageName);\n\
    \        });\n        \n        // Update the URL\n        history.pushState(null,\
    \ '', `#${pageName}`);\n    }, 100);\n}\n```\n"
