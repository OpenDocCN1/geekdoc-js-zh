  trans: "\n\n*   自定义配置选项（例如，允许同时打开多个部分）\n*   用于平滑过渡的动画\n*   供外部代码挂钩组件行为的事件回调\n\n\
    请记住在组件的复杂性与其重用性及可维护性之间取得平衡。随着组件变得复杂，请考虑将其拆分为更小、更集中的组件，并通过组合这些组件来创建更大的 UI 元素。\n\
    \n## 5.3 处理表单\n\n表单是许多 Web 应用程序的关键部分，允许用户输入数据并与应用程序交互。JavaScript 在增强表单功能方面起着至关重要的作用，从验证用户输入到处理表单提交以及处理数据。\n\
    \n### 使用 JavaScript 验证用户输入\n\n客户端表单验证是创建用户友好且安全的 Web 表单的基本环节。虽然 HTML5 提供了一些内置的验证属性（例如\
    \ `required`、`pattern`、`min`、`max`），但 JavaScript 允许更复杂的自定义验证逻辑。\n\n这是一个带有 JavaScript\
    \ 验证的表单示例：\n\n```html\n<form id=\"registration-form\">\n  <div>\n    <label for=\"\
    username\">Username:</label>\n    <input type=\"text\" id=\"username\" name=\"\
    username\" required>\n  </div>\n  <div>\n    <label for=\"email\">Email:</label>\n\
    \    <input type=\"email\" id=\"email\" name=\"email\" required>\n  </div>\n \
    \ <div>\n    <label for=\"password\">Password:</label>\n    <input type=\"password\"\
    \ id=\"password\" name=\"password\" required>\n  </div>\n  <div>\n    <label for=\"\
    confirm-password\">Confirm Password:</label>\n    <input type=\"password\" id=\"\
    confirm-password\" name=\"confirm-password\" required>\n  </div>\n  <button type=\"\
    submit\">Register</button>\n</form>\n```\n\n```javascript\nconst form = document.getElementById('registration-form');\n\
    const username = document.getElementById('username');\nconst email = document.getElementById('email');\n\
    const password = document.getElementById('password');\nconst confirmPassword =\
    \ document.getElementById('confirm-password');\nform.addEventListener('submit',\
    \ function(event) {\n  event.preventDefault();\n  if (validateForm()) {\n    console.log('Form\
    \ submitted successfully');\n    // Here you would typically send the form data\
    \ to a server\n}\n});\nfunction validateForm() {\n  let isValid = true;\n  //\
    \ Username validation\n  if (username.value.trim().length < 3) {\n    showError(username,\
    \ 'Username must be at least 3 characters long');\n    isValid = false;\n  } else\
    \ {\n    clearError(username);\n  }\n  // Email validation\n  const emailRegex\
    \ = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n  if (!emailRegex.test(email.value)) {\n\
    \    showError(email, 'Please enter a valid email address');\n    isValid = false;\n\
    \  } else {\n    clearError(email);\n  }\n  // Password validation\n  if (password.value.length\
    \ < 8) {\n    showError(password, 'Password must be at least 8 characters long');\n\
    \    isValid = false;\n  } else {\n    clearError(password);\n  }\n  // Confirm\
    \ password validation\n  if (password.value !== confirmPassword.value) {\n   \
    \ showError(confirmPassword, 'Passwords do not match');\n    isValid = false;\n\
    \  } else {\n    clearError(confirmPassword);\n  }\n  return isValid;\n}\nfunction\
    \ showError(input, message) {\n  const formControl = input.parentElement;\n  const\
    \ errorElement = formControl.querySelector('.error-message') || document.createElement('div');\n\
    \  errorElement.className = 'error-message';\n  errorElement.textContent = message;\n\
    \  formControl.appendChild(errorElement);\n  formControl.classList.add('error');\n\
    }\nfunction clearError(input) {\n  const formControl = input.parentElement;\n\
    \  const errorElement = formControl.querySelector('.error-message');\n  if (errorElement)\
    \ {\n    formControl.removeChild(errorElement);\n  }\n  formControl.classList.remove('error');\n\
    }\n```\n\n此示例演示了验证的几个方面：\n\n1. **阻止默认提交**：调用 `preventDefault()` 停止表单的自动提交，允许我们先进行验证。\n\
    2. **自定义验证**：我们为每个字段定义了规则，例如 `username` 的最小长度、邮箱格式以及密码匹配检查。\n3. **实时反馈**：错误信息动态显示在相关字段中，提供即时反馈。\n\
    4. **清除错误**：当字段有效时，我们会移除任何相关的消息。\n5. **灵活性**：这种方法允许轻松添加新规则或修改现有规则。\n\n为了增强用户体验，你可以在用户输入字符时实现实时验证，而不是等待表单提交：\n\
    \n```javascript\nconst inputs = [username, email, confirmPassword];\ninputs.forEach(input\
    \ => {\n  input.addEventListener('input', function() {\n    validateInput(this);\n\
    \  });\n});\nfunction validateInput(input) {\n  switch(input.id) {\n    case 'username':\n\
    \      if (input.value.trim().length < 3) {\n        showError(input, 'Username\
    \ must be at least 3 characters long');\n      } else {\n        clearError(input);\n\
    \      }\n      break;\n    case 'email':\n      const emailRegex = /^[^\\s@]+@[^\\\
    s@]+\\.[^\\s@]+$/;\n      if (!emailRegex.test(input.value)) {\n        showError(input,\
    \ 'Please enter a valid email address');\n      } else {\n        clearError(input);\n\
    \      }\n      break;\n    case 'password':\n      if (input.value.length < 8)\
    \ {\n        showError(input, 'Password must be at least 8 characters long');\n\
    \      } else {\n        clearError(input);\n      }\n      break;\n    case 'confirm-password':\n\
    \      if (input.value !== confirmPassword.value) {\n        showError(input,\
    \ 'Passwords do not match');\n      } else {\n        clearError(input);\n   \
    \   }\n      break;\n  }\n}\n```\n\n这段代码为每个表单字段添加了 `input` 事件监听器，在用户输入时触发验证。这提供了更实时的反馈并可以提升用户体验。\n\
    \n### 处理表单提交和数据\n\n一旦表单通过验证，下一步是处理表单提交并处理数据。在许多情况下，这涉及到通过 AJAX 请求将数据发送到服务器。这是一个处理表单提交和数据数据的示例：\n\
    \n```javascript\nform.addEventListener('submit', function(event) {\n  event.preventDefault();\n\
    \  if (validateForm()) {\n    const formData = new FormData(form);\n    fetch('/api/register',\
    \ {\n      method: 'POST',\n      body: formData\n    })\n    .then(response =>\
    \ response.json())\n    .then(data => {\n      if (data.success) {\n        showSuccessMessage('注册成功！');\n\
    \        form.reset();\n      } else {\n        showErrorMessage(data.message\
    \ || '注册失败，请重试。');\n      }\n    })\n    .catch(error => {\n      console.error('错误:',\
    \ error);\n      showErrorMessage('发生错误，请稍后再试。');\n    });\n  }\n});\nfunction\
    \ showSuccessMessage(message) {\n  const formElement = document.createElement('div');\n\
    \  formElement.className = 'success-message';\n  formElement.textContent = message;\n\
    \  form.insertAdjacentElement('beforebegin', formElement);\n  setTimeout(() =>\
    \ {\n    formElement.remove();\n  }, 5000);\n}\nfunction showErrorMessage(message)\
    \ {\n  const formElement = document.createElement('div');\n  formElement.className\
    \ = 'error-message';\n  formElement.textContent = message;\n  form.insertAdjacentElement('beforebegin',\
    \ formElement);\n  setTimeout(() => {\n    formElement.remove();\n  }, 5000);\n\
    }\n```\n\n此代码演示了几个重要的概念：\n\n1. **使用 FormData**：`FormData` 对象提供了一种简单的方法，用于构建表示表单字段及其对应值的键值对集合。\n\
    2. **异步提交**：我们使用 `fetch` API 异步将表单数据发送到服务器，允许页面在提交过程中保持响应。\n3. **处理响应**：我们处理服务器的响应，并根据情况显示成功或错误消息。\n\
    4. **用户反馈**：显示成功和错误消息，以告知用户操作的结果。\n5. **重置表单**：在提交成功后，我们重置表单以清除所有输入字段。\n\n"
- fmt: "\n*   Sanitize input: Even with client-side validation, always sanitize and\
    \ validate data on the server-side to prevent security vulnerabilities.\n*   Handle\
    \ all possible states: Account for success, various types of errors, and network\
    \ issues in your code.\n*   Provide clear feedback: Always inform the user about\
    \ the result of their action, whether it's successful or not.\n*   Consider accessibility:\
    \ Ensure that success and error messages are accessible to screen readers and\
    \ other assistive technologies.\n\nBy implementing robust form handling and data\
    \ processing, you can create more user-friendly and secure web applications that\
    \ effectively manage user input and interactions.\n\n## 5.4 Asynchronous Updates\
    \ with DOM\n\nAsynchronous updates are a crucial aspect of creating responsive\
    \ and dynamic web applications. They allow you to perform operations or update\
    \ the DOM without blocking the main thread, resulting in a smoother user experience.\
    \ In this section, we'll explore various techniques for implementing asynchronous\
    \ updates in the DOM.\n\n### Using `setTimeout()`, `setInterval()`, and `requestAnimationFrame()`\
    \ for DOM updates\n\n#### `setTimeout()`\n\n`setTimeout()` is a function that\
    \ allows you to schedule a piece of code to run after a specified delay. It's\
    \ useful for creating simple animations, delaying operations, or breaking up long-running\
    \ tasks to avoid blocking the main thread.\n\nHere's an example of using `setTimeout()`\
    \ to create a simple typewriter effect:\n\n```\nfunction typeWriter(element, text,\
    \ index = 0) {\n  if (index < text.length) {\n    element.textContent += text.charAt(index);\n\
    \    setTimeout(() => typeWriter(element, text, index + 1), 100);\n  }\n}\nconst\
    \ heading = document.getElementById('heading');\ntypeWriter(heading, 'Welcome\
    \ to my website!');\n```\n\nIn this example, we add one character at a time to\
    \ the heading element, with a 100ms delay between each character. This creates\
    \ a typewriter-like effect.\n\n#### `setInterval()`\n\n`setInterval()` is similar\
    \ to `setTimeout()`, but it repeatedly executes a piece of code at specified intervals.\
    \ It's useful for creating animations or updating content at regular intervals.\n\
    \nHere's an example of a simple countdown timer using `setInterval()`:\n\n```\n\
    function startCountdown(duration, display) {\n  let timer = duration;\n  const\
    \ interval = setInterval(() => {\n    const minutes = parseInt(timer / 60, 10);\n\
    \    const seconds = parseInt(timer % 60, 10);\n    display.textContent = `${minutes}:${seconds\
    \ < 10 ? '0' : ''}${seconds}`;\n    if (--timer < 0) {\n      clearInterval(interval);\n\
    \      display.textContent = 'Time's up!';\n    }\n  }, 1000);\n}\nconst fiveMinutes\
    \ = 60 * 5;\nconst display = document.querySelector('#time');\nstartCountdown(fiveMinutes,\
    \ display);\n```\n\nThis code creates a countdown timer that updates every second,\
    \ displaying the remaining time in minutes and seconds.\n\n#### `requestAnimationFrame()`\n\
    \n`requestAnimationFrame()` is a method specifically designed for creating smooth\
    \ animations. It tells the browser that you wish to perform an animation and requests\
    \ that the browser calls a specified function to update the animation before the\
    \ next repaint.\n\nHere's an example of using `requestAnimationFrame()` to create\
    \ a smooth animation:\n\n```\nfunction animate(element) {\n  let start;\n  const\
    \ totalDuration = 2000; // 2 seconds\n  function step(timestamp) {\n    if (!start)\
    \ start = timestamp;\n    const progress = timestamp - start;\n    // Move the\
    \ element from left to right\n    const distance = Math.min(progress / totalDuration\
    \ * window.innerWidth, window.innerWidth);\n    element.style.transform = `translateX(${distance}px)`;\n\
    \    if (progress < totalDuration) {\n      requestAnimationFrame(step);\n   \
    \ }\n  }\n  requestAnimationFrame(step);\n}\nconst box = document.querySelector('.box');\n\
    animate(box);\n```\n\nThis code animates a box element from the left side of the\
    \ screen to the right over a duration of 2 seconds. `requestAnimationFrame()`\
    \ ensures that the animation is smooth and optimized for the browser's refresh\
    \ rate.\n\n### Introduction to `Promise`s and asynchronous event handling\n\n\
    `Promise`s are a powerful feature in JavaScript for handling asynchronous operations.\
    \ They provide a cleaner and more manageable way to work with asynchronous code\
    \ compared to traditional callback-based approaches.\n\nA `Promise` represents\
    \ a value that may not be available immediately but will be resolved at some point\
    \ in the future. `Promise`s have three states:\n\n1.  Pending: The initial state;\
    \ the promise is neither fulfilled nor rejected.\n2.  Fulfilled: The operation\
    \ completed successfully.\n3.  Rejected: The operation failed.\n\nHere's a basic\
    \ example of creating and using a `Promise`:\n\n```\nfunction delay(ms) {\n  return\
    \ new Promise(resolve => setTimeout(resolve, ms));\n}\nfunction updateDOM() {\n\
    \  const element = document.getElementById('async-content');\n  element.textContent\
    \ = 'Loading...';\n  delay(2000)\n    .then(() => {\n      element.textContent\
    \ = 'Content loaded!';\n      return delay(1000);\n    })\n    .then(() => {\n\
    \      element.textContent += ' How are you?';\n    })\n    .catch(error => {\n\
    \      console.error('An error occurred:', error);\n      element.textContent\
    \ = 'An error occurred while loading content.';\n    });\n}\nupdateDOM();\n```\n\
    \nIn this example, we create a `delay` function that returns a `Promise` that\
    \ resolves after a specified number of milliseconds. We then use this function\
    \ to create a sequence of asynchronous updates to the DOM.\n\n`Promise`s can be\
    \ chained using `.then()` methods, allowing you to sequence asynchronous operations.\
    \ The `.catch()` method at the end handles any errors that might occur during\
    \ the `Promise` chain.\n\n#### Async/Await\n\n`Async`/`await` is a more recent\
    \ addition to JavaScript that builds on top of `Promise`s, providing a more synchronous-looking\
    \ way to write asynchronous code. Here's the same example rewritten using `async`/`await`:\n\
    \n```\nasync function updateDOM() {\n  const element = document.getElementById('async-content');\n\
    \  element.textContent = 'Loading...';\n  try {\n    await delay(2000);\n    element.textContent\
    \ = 'Content loaded!';\n    await delay(1000);\n    element.textContent += ' How\
    \ are you?';\n  } catch (error) {\n    console.error('An error occurred:', error);\n\
    \    element.textContent = 'An error occurred while loading content.';\n  }\n\
    }\nupdateDOM();\n```\n\nThe `async` keyword before the function declaration allows\
    \ the use of `await` within the function. The `await` keyword pauses the execution\
    \ of the function until the `Promise` is resolved, making the code appear more\
    \ synchronous and easier to read.\n\n#### Practical example: Fetching data and\
    \ updating the DOM\n\nLet's look at a more practical example of using `Promise`s\
    \ and `async`/`await` to fetch data from an API and update the DOM:\n\n```\nasync\
    \ function fetchUserData(userId) {\n  const response = await fetch(`https://api.example.com/users/${userId}`);\n\
    \  if (!response.ok) {\n    throw new Error('Failed to fetch user data');\n  }\n\
    \  return await response.json();\n}\nasync function updateUserProfile(userId)\
    \ {\n  const profileElement = document.getElementById('user-profile');\n  profileElement.innerHTML\
    \ = '<p>Loading user data...</p>';\n  try {\n    const userData = await fetchUserData(userId);\n\
    \    profileElement.innerHTML = `\n      <h2>${userData.name}</h2>\n      <p>Email:\
    \ ${userData.email}</p>\n      <p>Location: ${userData.location}</p>\n    `;\n\
    \  } catch (error) {\n    console.error('Error fetching user data:', error);\n\
    \    profileElement.innerHTML = '<p>Failed to load user data. Please try again\
    \ later.</p>';\n  }\n}\nupdateUserProfile(123);\n```\n\nThis example demonstrates\
    \ several key concepts:\n\n1.  Asynchronous function: `fetchUserData` is an `async`\
    \ function that fetches user data from an API.\n2.  Error handling: We check if\
    \ the response is ok and throw an error if it's not, which will be caught in the\
    \ `catch` block.\n3.  DOM updates: We update the DOM to show a loading message,\
    \ then replace it with the user data once it's fetched.\n"
