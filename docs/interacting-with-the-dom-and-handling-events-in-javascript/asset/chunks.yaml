    ## Interacting with the DOM and Handling Events in JavaScript


    Interacting with the DOM and handling events are fundamental aspects of creating
    dynamic and interactive web applications. This section will cover the basics of
    DOM manipulation and event handling in JavaScript.


    ### Basic DOM Manipulation


    1.  Selecting Elements:


    JavaScript provides several methods to select elements from the DOM:


    // By ID const  element  =  document.getElementById(''myId''); // By class name
    const  elements  =  document.getElementsByClassName(''myClass''); // By tag name
    const  paragraphs  =  document.getElementsByTagName(''p''); // Using CSS selectors
    const  firstMatch  =  document.querySelector(''.myClass''); const  allMatches  =  document.querySelectorAll(''.myClass'');


    2.  Modifying Element Content:


    You can change the text or HTML content of an element:


    // Changing text content element.textContent  =  ''New text content''; // Changing
    HTML content element.innerHTML  =  ''<strong>New HTML content</strong>'';


    3.  Modifying Attributes:


    Attributes of elements can be accessed and modified:


    // Get attribute value const  src  =  img.getAttribute(''src''); // Set attribute
    value img.setAttribute(''src'', ''new-image.jpg''); // Remove attribute element.removeAttribute(''class'');


    4.  Modifying Styles:


    Element styles can be changed directly or by manipulating classes:


    // Direct style modification element.style.color  =  ''red''; element.style.fontSize  =  ''16px'';
    // Class manipulation element.classList.add(''highlight''); element.classList.remove(''hidden'');
    element.classList.toggle(''active'');


    5.  Creating and Removing Elements:


    New elements can be created and added to the DOM, and existing elements can be
    removed:


    // Create a new element const  newDiv  =  document.createElement(''div''); newDiv.textContent  =  ''New
    Element''; // Append to an existing element document.body.appendChild(newDiv);
    // Remove an element element.remove(); // or element.parentNode.removeChild(element);


    ### Event Handling


    Events are actions or occurrences that happen in the system you are programming,
    which the system tells you about so you can respond to them. Here''s how to work
    with events in JavaScript:


    1.  Adding Event Listeners:


    The addEventListener method is used to attach an event handler to an element:


    const  button  =  document.querySelector(''button''); button.addEventListener(''click'',
    function() {


        console.log(''Button clicked!'');


    });


    2.  Common Events:


    Some frequently used events include:


    *   click: When an element is clicked


    *   submit: When a form is submitted


    *   keydown, keyup: When a key is pressed or released


    *   mouseover, mouseout: When the mouse enters or leaves an element


    *   load: When a page or an element has finished loading


    *   change: When the value of an input element changes


    3.  Event Object:


    The event handler function receives an event object that contains information
    about the event:


    button.addEventListener(''click'', function(event) {


        console.log(''Clicked at coordinates:'', event.clientX, event.clientY);


        event.preventDefault(); // Prevent default behavior });


    4.  Removing Event Listeners:


    Event listeners can be removed when they''re no longer needed:


    function  handleClick() {


        console.log(''Clicked!'');


    } button.addEventListener(''click'', handleClick); // Later, when you want to
    remove the listener button.removeEventListener(''click'', handleClick);


    5.  Event Delegation:


    Instead of adding event listeners to multiple elements, you can use event delegation
    by adding the listener to a parent element:


    document.getElementById(''parent-list'').addEventListener(''click'', function(e)
    {


        if(e.target  &&  e.target.nodeName  ==  "LI") {


            console.log("List item ", e.target.id, " was clicked!");


        }


    });


    6.  Custom Events:


    You can create and dispatch custom events:


    // Create a custom event const  customEvent  =  new  CustomEvent(''myCustomEvent'',
    {


        detail: { message:  ''Hello from custom event!'' }


    }); // Dispatch the event element.dispatchEvent(customEvent); // Listen for the
    custom event element.addEventListener(''myCustomEvent'', function(e) {


        console.log(e.detail.message);


    });


    ### Practical Example: Interactive To-Do List


    Let''s put these concepts together in a practical example of an interactive to-do
    list:


    <!DOCTYPE html>


    <html  lang="en">


    <head>


        <meta  charset="UTF-8">


        <meta  name="viewport"  content="width=device-width, initial-scale=1.0">


        <title>Interactive To-Do List</title>


        <style>


            .completed { text-decoration: line-through; }


        </style>


    </head>


    <body>


        <h1>My To-Do List</h1>


        <input  type="text"  id="todoInput"  placeholder="Enter a new task">


        <button  id="addButton">Add Task</button>


        <ul  id="todoList"></ul>


        <script>


            const  todoInput  =  document.getElementById(''todoInput'');


            const  addButton  =  document.getElementById(''addButton'');


            const  todoList  =  document.getElementById(''todoList'');


            addButton.addEventListener(''click'', addTodo);


            todoInput.addEventListener(''keypress'', function(e) {


                if (e.key  ===  ''Enter'') addTodo();


            });


            function  addTodo() {


                const  todoText  =  todoInput.value.trim();


                if (todoText) {


                    const  li  =  document.createElement(''li'');


                    li.textContent  =  todoText;


                    li.addEventListener(''click'', function() {


                        this.classList.toggle(''completed'');


                    });


                    const  deleteButton  =  document.createElement(''button'');


                    deleteButton.textContent  =  ''Delete'';


                    deleteButton.addEventListener(''click'', function(e) {


                        e.stopPropagation(); // Prevent triggering the li click event
                        li.remove();


                    });


                    li.appendChild(deleteButton);


                    todoList.appendChild(li);


                    todoInput.value  =  '''';


                }


            }


        </script>


    </body>


    </html>


    This example demonstrates:


    *   Selecting elements from the DOM


    *   Adding event listeners to elements


    *   Creating and appending new elements


    *   Modifying element styles and classes


    *   Event delegation (for the delete buttons)


    *   Preventing event propagation


    By interacting with the DOM and handling events, we''ve created a simple but functional
    to-do list application. Users can add new tasks, mark tasks as completed, and
    delete tasks, all without reloading the page.


    This example serves as a foundation that can be expanded with more features, improved
    styling, and potentially integration with backend services for data persistence.


    ### Advanced DOM Manipulation Techniques


    As you become more comfortable with basic DOM manipulation, you can explore more
