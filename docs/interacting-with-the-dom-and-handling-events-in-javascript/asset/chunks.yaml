  trans: "\n\n# DOM 选择方法\n\n## 2.1 getElementById()\n\n```html\n          // 输出: \"\
    This is a div with id \"myDiv\"\"  // 选择段落元素           const  pElement  =  document.getElementById('myParagraph');\n\
    \n          console.log(pElement.textContent);\n\n          // 输出: \"This is a\
    \ paragraph with id \"myParagraph\"\"  // 尝试选择一个不存在的元素           const  nonExistent\
    \  =  document.getElementById('nonExistentId');\n\n          console.log(nonExistent);\n\
    \n           // 输出: null      </script>\n\n</body>\n\n</html>\n```\n\n### 使用场景\n\
    \n1. 选择唯一元素：当你需要选择页面上某个特定的、唯一的元素时，`getElementById()` 是最高效的方法。\n\n2. 表单处理：在处理表单时，你可以通过\
    \ ID 轻松地选择表单元素。\n\n   ```javascript\n   const usernameInput = document.getElementById('username');\n\
    \   const passwordInput = document.getElementById('password');\n   ```\n\n3. 更新特定元素：当你需要更新特定元素的内容或样式时。\n\
    \n   ```javascript\n   const header = document.getElementById('mainHeader');\n\
    \   header.textContent = 'New Header Text';\n   header.style.color = 'blue';\n\
    \   ```\n\n4. 事件监听器：在特定元素上绑定事件监听器时。\n\n   ```javascript\n   const submitButton\
    \ = document.getElementById('submitBtn');\n   submitButton.addEventListener('click',\
    \ function() {\n       console.log('Button clicked!');\n   });\n   ```\n\n###\
    \ 最佳实践\n\n1. 使用唯一 ID：确保 HTML 文档中的每个 ID 都是唯一的。重复的 ID 会导致意外之外的行为。\n\n2. 大写敏感性：记住\
    \ ID 是区分大小写的。'myElement' 和 'myelement' 被视为不同的 ID。\n\n3. 避免过度使用：虽然 ID 对于唯一元素很有用，但要避免过度使用。对于重复的元素或通用样式，使用类（classes）通常更合适。\n\
    \n4. 性能考虑：`getElementById()` 通常是选择单个元素快的方法。如果你知道所需元素的 ID，它通常是最佳选择。\n\n## 2.2 getElementsByClassName()\
    \ 和 getElementsByTagName()\n\n虽然 `getElementById()` 对于选择单个唯一元素非常棒，但很多时候你需要选择多个具有共同特征的元素。这时，`getElementsByClassName()`\
    \ 和 `getElementsByTagName()` 就能派上用场了。\n\n### getElementsByClassName()\n\n该方法选择所有具有特定类名或多个类的元素。\n\
    \n#### 语法\n\n```javascript\nconst elements = document.getElementsByClassName('className');\n\
    ```\n\n#### 关键点\n\n1. 它返回一个包含所有指定类名元素的动态 `HTMLCollection`。\n\n2. 你可以通过用空格分隔多个类名来指定多个类。\n\
    \n3. 类名的顺序不重要。\n\n4. 它是区分大小写的。\n\n#### 代码示例\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n    <title>getElementsByClassName() 示例</title>\n</head>\n<body>\n    <div\
    \ class=\"highlight\">第一个高亮的 div</div>\n    <p class=\"highlight\">高亮的段落</p>\n\
    \    <div class=\"highlight important\">重要的高亮 div</div>\n    <script>\n      \
    \  // 选择所有类名为 'highlight' 的元素\n        const highlightedElements = document.getElementsByClassName('highlight');\n\
    \        console.log(highlightedElements.length); // 输出: 3\n\n        // 循环遍历选中的元素\n\
    \        for (let element of highlightedElements) {\n            console.log(element.textContent);\n\
    \        }\n\n        // 选择具有多个类的元素\n        const importantHighlights = document.getElementsByClassName('highlight\
    \ important');\n        console.log(importantHighlights.length); // 输出: 1\n  \
    \      console.log(importantHighlights[0].textContent); // 输出: \"Important highlighted\
    \ div\"\n    </script>\n</body>\n</html>\n```\n\n### getElementsByTagName()\n\n\
    该方法选择所有指定 HTML 标签名的元素。\n\n#### 语法\n\n```javascript\nconst elements = document.getElementsByTagName('tagName');\n\
    ```\n\n#### 关键点\n\n1. 它返回一个包含所有指定标签名元素的动态 `HTMLCollection`。\n\n2. 标签名是不区分大小写的。\n\
    \n3. 它可以选择任何有效的 HTML 标签。\n\n#### 代码示例\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>getElementsByTagName() 示例</title>\n</head>\n<body>\n    <p>第一个段落</p>\n\
    \    <p>第二个段落</p>\n    <div>一个 div 元素</div>\n    <p>第三个段落</p>\n    <script>\n\
    \        // 选择所有段落元素\n        const paragraphs = document.getElementsByTagName('p');\n\
    \        console.log(paragraphs.length); // 输出: 3\n\n        // 循环遍历选中的元素\n  \
    \      for (let p of paragraphs) {\n            console.log(p.textContent);\n\
    \        }\n\n        // 选择所有 div 元素\n        const divs = document.getElementsByTagName('div');\n\
    \        console.log(divs.length); // 输出: 1\n\n        // 选择所有元素\n        const\
    \ allElements = document.getElementsByTagName('*');\n        console.log(allElements.length);\
    \ // 输出: 5\n    </script>\n</body>\n</html>\n```\n\n### 理解 HTMLCollection\n\n\
    `getElementsByClassName()` 和 `getElementsByTagName()` 返回的是 `HTMLCollection`，这是一个动态的、类似数组的对象。\n\
    \n#### HTMLCollection 的特性\n\n1. 动态集合：`HTMLCollection` 会随着 DOM 的变化而自动更新。\n\n2.\
    \ 类似数组但不是数组：它看起来像数组并具有 `length` 属性，但它并不是数组。它没有 `push()`、`pop()` 或 `forEach()`\
    \ 等方法。\n\n3. 索引访问：可以使用括号表示法（例如 `collection[0]`）或 `item()` 方法进行访问。\n\n4. 命名访问：如果集合中的元素具有\
    \ `id` 或 `name` 属性，可以使用 `namedItem()` 方法或直接作为属性访问。\n\n#### 使用 HTMLCollection\n\
    \n以下是使用 `HTMLCollection` 的示例：\n\n```javascript\nconst paragraphs = document.getElementsByTagName('p');\n\
    \n// 访问元素\nconsole.log(paragraphs[0]); // 第一个段落\nconsole.log(paragraphs.item(1));\
    \ // 第二个段落\n\n// 遍历元素\nfor (let i = 0; i < paragraphs.length; i++) {\n    console.log(paragraphs[i].textContent);\n\
    }\n\n// 转换为真正的数组\nconst paragraphArray = Array.from(paragraphs);\nparagraphArray.forEach(p\
    \ => console.log(p.textContent));\n\n// 使用扩展运算符转换为数组\nconst anotherArray = [...paragraphs];\n\
    ```\n\n### 使用场景\n\n1. 多个元素的样式：当你需要对具有相同类或标签的多个元素应用样式或修改时。\n\n   ```javascript\n\
    \   const highlights = document.getElementsByClassName('highlight');\n   for (let\
    \ element of highlights) {\n       element.style.backgroundColor = 'yellow';\n\
    \   }\n   ```\n\n2. 表单验证：在处理表单时，你可能想验证所有的输入字段。\n\n   ```javascript\n   const inputs\
    \ = document.getElementsByTagName('input');\n   for (let input of inputs) {\n\
    \       if (input.value.trim() === '') {\n           console.log('发现空输入');\n \
    \      }\n   }\n   ```\n\n3. 创建动态列表：当你需要处理列表项或其他重复元素时。\n\n   ```javascript\n \
    \  const listItems = document.getElementsByTagName('li');\n   for (let item of\
    \ listItems) {\n       item.addEventListener('click', function() {\n         \
    \  this.classList.toggle('selected');\n       });\n   }\n   ```\n\n### 最佳实践\n\n\
    1. 注意其动态性：记住 `HTMLCollection` 是动态的。如果你在迭代时删除元素，考虑先将其转换为数组。\n\n"
- fmt: "\n## 2. Use specific selectors\nWhen possible, use more specific selectors\
    \ to improve performance. For example, `getElementsByClassName('highlight')` is\
    \ generally faster than `getElementsByTagName('*')` followed by filtering.\n\n\
    3. **Consider alternatives**: For more complex selections, consider using `querySelectorAll()`,\
    \ which offers more flexibility and returns a static `NodeList`.\n\n4. **Caching**:\
    \ If' you're going to use the collection multiple times, consider caching it in\
    \ a variable to avoid repeated DOM queries.\n\n## 2.4 Using `querySelector()`\
    \ and `querySelectorAll()`\n\nThe `querySelector()` and `querySelectorAll()` methods\
    \ provide a powerful and flexible way to select elements using CSS selectors.\
    \ These methods were introduced in newer versions of JavaScript and offer more\
    \ versatility compared to the older selection methods.\n\n### `querySelector()`\n\
    \nThe `querySelector()` method returns the first element that matches the specified\
    \ CSS selector(s).\n\n#### Syntax\n\n```javascript\nconst element = document.querySelector('selector');\n\
    ```\n\n#### Key Points\n\n1. It returns the first matching element or `null` if\
    \ no matches are found.\n2. It can use any valid CSS selector.\n3. It's part of\
    \ the `document` object and can also be called on any element to search within\
    \ that element's descendants.\n\n#### Code Examples\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <title>querySelector() Example</title>\n</head>\n<body>\n\
    \    <div id=\"container\">\n        <p class=\"highlight\">First paragraph</p>\n\
    \        <p>Second paragraph</p>\n        <p class=\"highlight\">Third paragraph</p>\n\
    \    </div>\n    <script>\n        // Selecting the first paragraph\n        const\
    \ firstP = document.querySelector('p');\n        console.log(firstP.textContent);\
    \ // Output: \"First paragraph\"\n        // Selecting the first element with\
    \ class 'highlight'\n        const firstHighlight = document.querySelector('.highlight');\n\
    \        console.log(firstHighlight.textContent); // Output: \"First paragraph\"\
    \n        // Selecting an element with a specific id\n        const container\
    \ = document.querySelector('#container');\n        console.log(container.tagName);\
    \ // Output: \"DIV\"\n        // Using a more complex selector\n        const\
    \ secondHighlight = document.querySelector('p.highlight:nth-of-type(2)');\n  \
    \      console.log(secondHighlight.textContent); // Output: \"Third paragraph\"\
    \n        // Selecting within a specific element\n        const secondPInContainer\
    \ = container.querySelector('p:nth-child(2)');\n        console.log(secondPInContainer.textContent);\
    \ // Output: \"Second paragraph\"\n    </script>\n</body>\n</html>\n```\n\n###\
    \ `querySelectorAll()`\n\nThe `querySelectorAll()` method returns all elements\
    \ that match the specified CSS selector(s).\n\n#### Syntax\n\n```javascript\n\
    const elements = document.querySelectorAll('selector');\n```\n\n#### Key Points\n\
    \n1. It returns a static `NodeList` containing all matching elements.\n2. If no\
    \ elements match, it returns an empty `NodeList`.\n3. Like `querySelector()`,\
    \ it can use any valid CSS selector and can be called on any element.\n\n####\
    \ Code Examples\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>querySelectorAll()\
    \ Example</title>\n</head>\n<body>\n    <div id=\"container\">\n        <p class=\"\
    highlight\">First paragraph</p>\n        <p>Second paragraph</p>\n        <p class=\"\
    highlight\">Third paragraph</p>\n        <div class=\"highlight\">A div element</div>\n\
    \    </div>\n    <script>\n        // Selecting all paragraphs\n        const\
    \ allP = document.querySelectorAll('p');\n        console.log(allP.length); //\
    \ Output: 3\n        // Selecting all elements with class 'highlight'\n      \
    \  const allHighlights = document.querySelectorAll('.highlight');\n        console.log(allHighlights.length);\
    \ // Output: 3\n        // Using more complex selector\n        const oddParagraphs\
    \ = document.querySelectorAll('p:nth-child(odd)');\n        console.log(oddParagraphs.length);\
    \ // Output: 2\n        // Looping through the NodeList\n        allHighlights.forEach(element\
    \ => console.log(element.tagName));\n        // Selecting within a specific element\n\
    \        const container = document.querySelector('#container');\n        const\
    \ highlightsContainer = container.querySelectorAll('.highlight');\n        console.log(highlightsContainer.length);\
    \ // Output: 3\n    </script>\n</body>\n</html>\n```\n\n### Introduction to CSS\
    \ Selectors in JavaScript\n\nCSS selectors are patterns used to select and style\
    \ HTML elements. When used with `querySelector()` and `querySelectorAll()`, they\
    \ provide a powerful way to select elements in JavaScript. Here's an overview\
    \ of some common selectors:\n\n1. **Element Selector**: Selects all elements of\
    \ a specified type. `document.querySelectorAll('p')` selects all `<p>` elements.\n\
    2. **Class Selector**: Selects elements with a specific class. `document.querySelectorAll('.highlight')`\
    \ selects all elements with class `highlight`.\n3. **ID Selector**: Selects an\
    \ element with a specific id. `document.querySelector('#header')` selects the\
    \ element with id `header`.\n4. **Attribute Selector**: Selects elements with\
    \ a specific attribute or value. `document.querySelectorAll('[data-role=\"button\"\
    ]')` selects elements with `data-role=\"button\"`.\n5. **Descendant Selector**:\
    \ Selects elements that are descendants of another element. `document.querySelectorAll('div\
    \ p')` selects all `<p>` inside `<div>`.\n6. **Child Selector**: Selects elements\
    \ that are direct children of another element. `document.querySelectorAll('ul\
    \ > li')` selects all `<li>` elements that are direct children of `<ul>`.\n7.\
    \ **Pseudo-class Selectors**: Selects elements based on a certain state. `document.querySelectorAll('a:hover')`\
    \ selects all `<a>` elements on hover state; `document.querySelectorAll('li:first-child')`\
    \ selects all `<li>` elements that are the first child of their parent.\n8. **Pseudo-element\
    \ Selectors**: Selects a part of an element. `document.querySelectorAll('p::first-line')`\
    \ selects the first line of all `<p>` elements.\n9. **Combinators**: Combine other\
    \ selectors in various ways. `document.querySelectorAll('div + p')` selects all\
    \ `<p>` elements that come immediately after `<div>` elements.\n\n### Examples\
    \ of Selecting Using Complex Selectors\n\nLet's look at some examples of using\
    \ complex selectors with `querySelector()` and `querySelectorAll()`:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>Complex Selectors</title>\n</head>\n\
    <body>\n    <div id=\"container\">\n        <header>\n            <h1>Main Heading</h1>\n\
    \            <nav>\n                <ul>\n                    <li><a href=\"#\"\
    \ class=\"active\">Home</a></li>\n                    <li><a href=\"#\">About</a></li>\n\
    \                    <li><a href=\"#\">Contact</a></li>\n                </ul>\n\
    \            </nav>\n        </header>\n        <main>\n            <section>\n\
    \                <h2>Section 1</h2>\n                <p>First paragraph in section\
    \ 1</p>\n                <p>Second paragraph in section 1</p>\n            </section>\n\
    \            <section>\n                <h2>Section 2</h2>\n                <p>First\
    \ paragraph in section 2</p>\n                <p>Second paragraph in section 2</p>\n\
    \            </section>\n        </main>\n        <footer>\n            <p>&copy;\
    \ 2023 My Website</p>\n        </footer>\n    </div>\n    <script>\n        //\
    \ Selecting the active navigation link\n        const activeLink = document.querySelector('nav\
    \ a.active');\n        console.log(activeLink.textContent); // Output: \"Home\"\
    \n        // Selecting all paragraphs in the main content area\n        const\
    \ mainParagraphs = document.querySelectorAll('main p');\n        console.log(mainParagraphs.length);\
    \ // Output: 4\n        // Selecting the first paragraph of each section\n   \
    \     const firstParagraphsInSections = document.querySelectorAll('section > p:first-of-type');\n\
    \        firstParagraphsInSections.forEach(p => console.log(p.textContent));\n\
    \        // Selecting all headings (h1, h2, etc.) in the document\n        const\
    \ allHeadings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');\n    </script>\n\
    </body>\n</html>\n```\n"
