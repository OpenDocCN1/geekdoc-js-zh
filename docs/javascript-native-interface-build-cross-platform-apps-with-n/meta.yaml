  md: '# Example: Callback After Random Delay


    Let''s see how to implement the randomDelay() function using JavaScript Native
    Interface. The implementation will be almost identical to the setTimeoutNative()
    function from the previous chapter, except for two things


    +   1. The delay time will be randomly set inside the function,

    2. The callback will include the elapsed time as a parameter.


    We can create a random delay time between 0 and 1000 milliseconds by creating
    and seeding a random number generator, creating a distribution range and picking
    a random number from the range:


    ```

    C++\int get_random_number(int low, int high) {

    random_device_random_number_generator;

    tmt19937 picker(random_number_generator());

    uniform_int_distribution<> distribution(low, high);

    int random_number = distribution(picker);

    return random_number;

    }

    ```


    > Sample 16.9: Create a random integer


    When we execute the callback function, we pass the random number as a facebook:js_i:Value
    as a parameter of the callback:


    ```

    C++

    int timeoutMilliseconds = get randomnumber(0, 1000);

    callback.call(runtime, Value(timeoutMilliseconds));

    ```


