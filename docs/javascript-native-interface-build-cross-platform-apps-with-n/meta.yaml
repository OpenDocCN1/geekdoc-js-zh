  md: "![](img/bda9545f10e8303b87afef4dd62e47e9_142_0.png)\n\nFigure 14.2: Parallel\
    \ execution creates a smoother user experienc\n\nThe way asynchronous functions\
    \ are expressed have changed several times in the last few years as JavaScript\
    \ and TypeScript have evolved as languages.\n\nYou may recognize the older, Promise-based\
    \ implementation:\n\n```\nTypeScript\nasyncFunction().then(result => {\n  console.log(`result:\
    \ ${result}`);\n});\n```\n\nSample 14.3: Calling an asynchronous function using\
    \ `.then()`\n\nThe async function supports a failure response, this implementation\
    \ may include an `.error()` function:\n\n```\nTypeScript\nasyncFunction()\n.then(result\
    \ => console.log(`result: ${result}` `))\n.error(error => console.error(error.message));\n\
    ```\n\nSample 14.4: Calling an asynchronous function using .then() and .errort\n\
    \nThe modern way to call an asynchronous function is to use the await keyword,\
    \ like this:\n\n```\nTypeScript\nconst result = await asyncFunction();\nconsole.log(`result:\
    \ ${result}`);\n```\n\nSample 14.5: Calling an asynchronous function using awa."
