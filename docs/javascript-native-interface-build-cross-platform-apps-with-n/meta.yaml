  md: '# Appendix I: JSI Data Types


    **Array** - a list or collection of data


    **Boolean** - a single-bit, true / false or 0 / 1 value


    **Null** - a value an empty assignment.


    **Function** - callable unit of code which can be executed by another par of the
    program.


    **Number** - any numeric value including integers such as 123 or -123 or floating
    point numbers such as 1.23 or -1.23.


    **Object** - a structured data which contains named values and functions


    **Promise** - an object which can execute a callback or throw an error after an
    unknown time delay.


    **String** - an object containing a sequence of characters and properties such
    as length and several functions. JavaScript strings are assumed to be UTF-8 compatible.


    **Undefined** - a value which has not been assigned.


    **Value** - a generic data type which can represent any of boolean, array, number,
    string, object, null, function, or unknown.'
