  mdcn: "\n\n# 17\n\n## 函数 14: 抛出错误 (Throws Errors)\n\n在 TypeScript 中，当出现问题时，抛出错误通常是非常用的。\n\
    \n通常情况下，你应该假设你的代码可能会失败，而错误提供了一种诊断失败方式、原因以及何地失败的便捷方法。错误允许开发者解释代码中发生了什么类型的问题，并说明生成的堆栈跟踪（stack\
    \ trace）中导致错误或受错误影响的每一行代码。\n\n因此，抛出错误很有用，特别是在编写跨越语言边界的代码时。JSI 函数对 TypeScript 来说本质上是不透明的，这意味着如果不抛出描述性的错误，可能无法知道\
    \ JSI 函数是如何失败、为什么失败、甚至不知道是否失败了。\n\n在 TypeScript 中，我们可以像这样抛出一个 Error：\n\n```typescript\n\
    const throwErrorFunction = () => {\n  throw new Error(\"This message describes\
