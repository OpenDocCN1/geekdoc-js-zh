- md: "\nThe resulting array from these methods will look like this in TypeScript:\n\
    \n```typescript\nconst result:[] = {\n\"Hello\",\n32,\nnull,\nundefined,\n[1]\n\
    };\n```\n\n> Sample 9.13: The result of populating the example array:\n\n## Putting\
    \ It All Together\n\nLet's say we have a function called `listFruit()` that returns\
    \ a list of fruit names: apple, banana, kiwi.... The function declaration for\
    \ such a function may look like this:\n\n```typescript\nconst listFruit = () =>\
    \ string[];\n```\n\n> Sample 9.14: Function declaration for a fruit listing function:\n\
    \nWe can implement a trivial fruit listing function in C++ using a static array\
    \ of fruit names. In C++, there are several ways to implement this, but we will\
    \ use a vector of strings. Using vectorS is a way of working with array-like data\
    \ without worrying about memory leaks and stack overflow errors.\n\nIn this case\
    \ we create a static vector of fruit names, then initialize the facebook::jsi::Array.\
    \ We iterate over the fruit vector to populate each item in the Array, then return\
    \ the Array as a facebook::jsi::Value.\n\n```cpp\nFunction listFruit = Function::createHostFunction(...,\
    \ {\n// define a static list of fruit names\nstd::vector<std::string> fruit =\
    \ {\n\"apple\", \"banana\", \"kiwi\", \"cherry\"\n};\n\n// Create a JSI Array\
    \ with the size of the std::vector\nArray jsFruitArray(runtime, fruit.size());\n\
    \n// Populate the JSI Array with strings from the std::vector\nfor (size_t i =\
    \ 0; i < fruit.size(); ++i)\n// Convert each std::string to a JSI String\njsiFruitArray.setValueAtIndex(\n\
    \  runtime,\n  i,\n  String::createFromf8(runtime, fruit[i]);\n);\n// return the\
    \ Array as a JSI Value\nreturn Value(runtime, jsiFruitArray);\n});\n```\n\nExample\
    \ 9.1: Return a string array of fruit name\n\nNote that we convert the native\
    \ string type to a facebook::js::String type when setting the array item because\
    \ the JSI String data type is not compatible with std::string.\n\n## Declare this\
    \ function in the global context so that calling it doesn’t throw any errors:\n\
    \n```typescript\ndeclare global {\n  function listFruit(): string[];\n}\n```\n\
    \nSample 9.15: Declaring a JSI function in TypeScript\n\nWe can call this method\
    \ from JavaScript with the following result:\n\n```typescript\nconst fruits[]\
    \ = listFruit();\nconsole.log(\n  `found ${fruits.length} fruits: ${fruits.join(\"\
    , \")}`\n);\n// found 4 fruits: apple, banana, cherry\n```\n\nSample 9.16: Resulting\
    \ function call and output from listFruit() function:\n\n# 10\n\n## Function 7:\
    \ Returns an Object\n\nOne of the features that makes TypeScript a truly great\
    \ functional language is the ability to pass objects as function arguments. This\
