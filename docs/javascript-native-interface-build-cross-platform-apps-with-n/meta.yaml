    Use the package management system available on your flavor of Linux to install
    CMake.


    For example using APT on Ubuntu and Debian systems:


    ```

    sudo apt update

    sudo apt install cmake

    ```


    > Example 2.7: Installing CMake using apt on Debian


    Fedora and RedHat Enterprise Linux systems use the Dandified YUM package manager:


    ```

    Console

    sudo dnf install cmake

    ```


    > Example 2.8: Installing CMake using yum on RedHat


    In any case, once CMake is installed you make sure it works by running it from
