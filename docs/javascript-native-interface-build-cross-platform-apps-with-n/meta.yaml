  md: '# # Introduction


    JavaScript Interface (JSI) offers developers to the convenience of cross-platform
    apps with the performance of native apps.


    It lets developers to write functions in C++ that can be called directly from
    JavaScript, for example in a React Native front-end. It works by combining two
    existing features of React Native:


    +   1. The native code (for example Swift or Java) can call binary functions from
    compiled C++

    2. React Native JavaScript can call properly-defined native functions


    C++ code can be written in a cross-platform way and compiled for a variety of
    devices, such as Android and iOS, as long as it doesn''t work on device-specific
    or platform-specific features such as user interfaces or certain sensors or specific
    camera features.


    Since both the JavaScript and C++ are cross-platform and the native layer can
    bind these languages together, it is possible to create React Native apps for
    several platforms with one code base.


    Javascript Native Interface code must be written so that functions and data types
    are compatible with the JavaScript type system, and those functions must be properly
    exported to the JavaScript environment.


    This book will walk you through how to set up a React Native project to use JSI,
    and how to implement common function types in JSI, including those that take or
    return arrays and complex object types, Promises, and multi-threaded functions.'
  merge: -1
  pgno: 6
