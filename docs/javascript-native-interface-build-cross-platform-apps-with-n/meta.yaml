  md: '# Prepare Your Environment


    Every development project requires its own tools. React Native requires coding
    C++ and TypeScript or Javascript, so it''s important to have a code editor, a
    C compiler, and a JavaScript or TypeScript interpreter such as Node.js, as well
    as an emulator or simulator to test your software.


    If you plan to develop for Android, you must install Android Studio, CMake, Android
    Native Development Kit (NDK), and an Android Emulator. If you plan to develop
    for iOS or MacOS, you must have a Mac computer with Xcode installed, as well as
    Ruby and CocoaPods.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Finally you''ll need a code editor. The editor of choice for React Native developers
    tends to be Visual Studio (vscode) but of course you should use whatever editor
    makes you feel at home.


    In summary, you will need:


    +   1. Node.js


    +   1. Visual Studio Code or some other code editor


    +   1. For Android Development:


    +   1. Android Studio


    +   1. Android Native Development Kit


    +   1. An Android Emulator


