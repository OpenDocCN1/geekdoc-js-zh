    \ showing that arrays are objects in TypeScript*\n\nThis behavior is because although\
    \ TypeScript provides type-hinting in the editor, it gets executed as regular\
    \ JavaScript, which has a simpler type system, and because arrays in JavaScript\
    \ are actually objects, complete with a `length` property, and `push()` and `append()`\
    \ methods.\n\nHowever arrays don't behave the same. The `string[]` type is not\
