    ```\n\nSample 16.5: Isolate a callback function parameter\n\nJavaScript Native\
    \ Interface has no specific way of knowing that this function takes any specific\
    \ parameters of any specific types. We can execute the callback using any Value,\
    \ so it’s best to create a consistent API and document your functions well for\
    \ other developers.\n\nLet’s say you have created a String parameter:\n\n```C++\n\
    String value = String::createUtf8(\"Hello\");\n```\n\nSample 16.6: Creating a\
    \ String value\n\nYou can then execute the callback by passing that value as an\
    \ argument:\n\n```C++\ncallback.call(runtime, value);\n```\n\nSample 16.7: Execute\
    \ the callback with a parameter\n\nIf you have multiple parameters in your callback,\
    \ you can simply call the callback with those parameters:\n\n```C++\ncallback.call(runtime,\
    \ value1, value2, value3);\n```\n\nSample 16.8: Execute callback with multiple\
    \ parameter\n\n# Example: Callback After Random Delay\n\nLet's see how to implement\
    \ the randomDelay() function using JavaScript Native Interface. The implementation\
    \ will be almost identical to the setTimeoutNative() function from the previous\
    \ chapter, except for two things:\n\n- 1. The delay time will be randomly set\
    \ inside the function,\n- 2. The callback will include the elapsed time as a parameter.\n\
    \nWe can create a random delay time between 0 and 1000 milliseconds by creating\
    \ and seeding a random number generator, creating a distribution range and picking\
    \ a random number from the range:\n\n```C++\nint get_random_number(int low, int\
    \ high) {\n  random_device random_number_generator;\n  mt19937 picker(random_number_generator());\n\
    \  uniform_int_distribution<> distribution(low, high);\n  int random_number =\
    \ distribution(picker);\n  return random_number;\n}\n```\n\n> Sample 16.9: Create\
    \ a random integer\n\nWhen we execute the callback function, we pass the random\
    \ number as a JS Value as a parameter of the callback:\n\n```C++\nint timeoutMilliseconds\
    \ = get_random_number(0, 1000);\ncallback.call(runtime, Value(timeoutMilliseconds));\n\
    ```\n\n> Sample 16.10: Execute the callback with an argument\n\nIf you need to\
    \ return more than one parameter (wait, the logic suggests \"pass more than one\
    \ parameter\") - if you need to pass more than one parameter, you can execute\
    \ the callback with an array of Values and the size, for example like this:\n\n\
    ```C++\nValue callbackArguments[] = { Value(1), Value(2), Value(3) };\ncallback.call(runtime,\
    \ *callbackArguments, 3);\n```\n\n> Sample 16.11: Execute callback with multiple\
    \ parameter\n\nPutting these together, we have a function that receives a callback\
    \ function as the first parameter and a delay time as the second parameter. It\
    \ sleeps for the timeout period and then executes the callback before returning\
    \ undefined:\n\n```C++\nFunction randomDelay = Function::createFromHostFunction(\n\
    \  Function callback = arguments[0]\n  .getObject(runtime)\n  .getFunction(runtime);\n\
    \  int timeoutMilliseconds = get_random_number(0, 1000);\n  // delay for some\
    \ time\n  usleep(timeoutMilliseconds);\n  // execute the callback\n  callback.call(runtime,\
    \ Value(timeoutMilliseconds));\n  return Value::undefined();\n);\n```\n\nExample\
    \ 16.1: Native implementation of setTimeout() method\n\nThis results in the creation\
    \ of a function with the following TypeScript definition:\n\n```TypeScript\nconst\
    \ randomDelay = (\n  callback: (milliseconds: number) => void\n) => void;\n```\n\
    \n> Sample 16.12: TypeScript function definition of randomDelay()\n\nOf course\
    \ the function declaration in `global` is slightly different:\n\n```TypeScript\n\
    declare global {\n  function randomDelay(\n    callback: (millisecondsElapsed:\
    \ number) => void\n  ): void;\n}\n```\n\n> Sample 16.13: Declaring a JSI function\
    \ in TypeScript\n\nCalling this method from TypeScript should look familiar, simply\
    \ pass a callback function as the parameter and capture the millisecond timeout\
    \ number as the callback's parameter:\n\n```typescript\nrandomDelay((millisecondsElapsed:\
    \ number) => {\n  console.log(\n    `callback executed after ${millisecondsElapsed}\
    \ ms`\n  );\n});\n```\n\n> Sample 16.14: Calling the native randomDelay() function:\n\
    \nFor clarity, you can also define the callback response separately, and pass\
    \ it as an argument to the `randomDelay()` function by name:\n\n```typescript\n\
    const randomDelayCallback = (millisecondsElapsed: number) => {\n  console.log(\n\
    \    `callback executed after ${millisecondsElapsed} ms`\n  );\n};\nrandomDelay(randomDelayCallback);\n\
    ```\n\n> Sample 16.15: Alternative method of calling randomDelay() function:\n"
  mdcn: "\n将这些结合在一起，我们得到了一个函数，它第一个参数接收一个回调函数，第二个参数接收延迟时间。它会睡眠超时时长，然后在执行回调之前返回 `undefined`：\n\
    \n```C++\n#include <unistd.h>\n\nFunction setTimeoutNative = Function::createFromHostFunction(\n\
    \  Function callback = arguments[0]\n  .getObject(runtime)\n  .getFunction(runtime);\n\
    \  int timeoutMilliseconds = arguments[1].getNumber();\n\n// 睡眠 'timeoutMilliseconds'\
    \ 毫秒\nusleep(timeoutMilliseconds);\n// 当计时器完成后执行回调\n  callback.call(runtime);\n\
    \  return Value::undefined();\n);\n```\n\n示例 15.1：setTimeout() 方法的原生实现\n\n这将创建一个具有以下\
    \ TypeScript 函数定义的函数：\n\n```TypeScript\nconst setTimeoutNative = (\n  callback:\
    \ () => void,\n  timeoutMilliseconds: number\n) => void;\n```\n\n示例 15.11：setTimeoutNative\
    \ 的 TypeScript 函数定义\n\n你必须在全局上下文中声明它，以便 TypeScript 知道它是可用的：\n\n```TypeScript\n\
    declare global {\n  function setTimeoutNative(callback: () => void, timeoutMilliseconds:\
    \ number): void;\n}\n```\n\n示例 15.12：在 TypeScript 中声明 JSI 函数\n\n在 TypeScript 中调用此方法看起来很熟悉，只需将一个回调函数作为第一个参数，并将一个毫秒超时数字作为第二个参数传递：\n\
    \n```typescript\nsetTimeoutNative(() => {\n  console.log(\"Native timeout exceeded,\
    \ callback called\");\n}, 1000);\n// 1000 毫秒后...\n// Native timeout exceeded,\
    \ callback called\n```\n\n示例 15.13：调用原生 setTimeoutNative() 方法\n\n**注意：在此函数的更贴实际的实现中，你可能会创建第二个线程来处理回调。C++\
    \ 中的多线程有点复杂，并且超出了本书的讨论范围。在这种情况下，你将在主函数中返回 undefined，可能在回调执行之前就返回了。**\n\n# 16\n\
    \n## 函数 13：接受带参数作为参数\n\n回调函数不仅仅是一个事件。有时，它必须包含某些结果或用户操作的结果。因此，当回调函数接受参数时，它会非常有用。\n\
    \n这种模式在 React Native 中很常见，例如处理来自 `TextInput` 的 `onChangeText()` 事件：\n\n```TypeScript\
    \ JSX\n<TextInput\n  onChangeText={(text: string) => {\n    console.log(`Text:\
    \ ${text}`);\n  }}\n/>\n```\n\n> 示例 16.1：onChanged() 事件上的参数化回调函数\n\n或者如果你在设置新值时需要知道\
    \ `useState()` 的当前值，例如在实现递增方法时：\n\n```TypeScript\nconst [count, setCount] = useState(0);\n\
    const incrementCount = () => {\n  setCount((oldCount) => oldCount + 1);\n};\n\
    ```\n\n示例 16.2：使用回调状态设置器增加值\n\n这些都是接收参数的回调函数示例。参数对于了解回调在某一刻的结果至关重要。\n\n假设我们有一个名为\
    \ `randomDelay()` 的函数，它在随机延迟后执行回调。回调包含一个参数，显示从调用 `randomDelay()` 到执行回调之间的延迟长度。\n\
    \n该函数的定义如下：\n\n```TypeScript\nconst randomDelay = async (\n  millisecondsElapsed:\
    \ number) => void\n) => void;\n```\n\n示例 16.3：函数接受一个带参数的回调\n\n我们可以这样调用 `randomDelay()`\
    \ 函数来打印执行回调的时间延迟：\n\n```TypeScript\nrandomDelay((millisecondsElapsed: number)\
    \ => {\n  console.log(\n    `callback executed after ${millisecondsElapsed} ms`\n\
    \  );\n  // 例如，在 1924 毫秒后...\n  // callback executed after 1924 ms\n});\n```\n\
    \n示例 16.4：在回调中调用带参数的函数。\n\n## JSI 实现\n\n将回调函数从 JSI 函数中分离的过程与前一章描述的方法相同：\n\n```C++\n\
    Function callbackFunction = arguments[0]\n.getObject(runtime);\n```\n\n示例 16.5：分离回调函数参数\n\
    \nJavaScript Native Interface 没有特定方法来知道此函数是否接受任何特定类型的任何特定参数。我们可以使用任何 `Value` 执行回调，因此最好创建一个一致的\
    \ API，并为其他开发者写说明你的函数。\n\n假设你创建了一个字符串参数：\n\n```C++\nString value = String::createUtf8(\"\
    Hello\");\n```\n\n示例 16.6：创建一个字符串值\n\n然后你可以通过将该值作为参数传递来执行回调：\n\n```C++\ncallback.call(runtime,\
    \ value);\n```\n\n示例 16.7：带参数执行回调\n\n如果你在回调中有多个参数，你可以简单地使用这些参数调用回调：\n\n```C++\n\
    callback.call(runtime, value1, value2, value3);\n```\n\n示例 16.8：带多个参数执行回调\n\n\
    # 示例：随机延迟后的回调\n\n让我们看看如何使用 JavaScript Native Interface 实现 `randomDelay()` 函数。该实现与前一章中的\
    \ `setTimeoutNative()` 函数几乎相同，但有两点不同：\n\n- 1. 延迟时间将在函数内部随机设置，\n- 2. 回调将包含经过的时间作为参数。\n\
    \n我们可以通过创建并种子随机数生成器、创建分布范围并从中选择，来创建一个 0 到 1000 毫秒之间的随机延迟时间：\n\n```C++\nrandom_device\
    \ random_device;\nmt19937 picker(random_device);\nuniform_int_distribution<> distribution(low,\
    \ high);\nrandom_number = distribution(picker);\n```\n\n> 示例 16.9：创建一个随机数\n\n\
    当我们执行回调时，我们将随机数作为参数传递：\n\n```C++\nint timeoutMilliseconds = distribution(picker);\n\
    callback.call(runtime, Value(timeoutMilliseconds));\n```\n\n> 示例 16.10：带参数执行回调\n\
    \n如果你需要传递多个参数，可以像这样使用 Values 数组：\n\n```C++\nValue callbackArguments[] = { Value(1),\
    \ Value(2), Value(3) };\ncallback.call(runtime, callbackArguments);\n```\n\n>\
    \ 示例 16.11：带多个参数执行回调\n\n将这些结合在一起，我们得到了一个函数，它第一个参数接收一个回调函数，第二个参数接收延迟时间。它会睡眠超时时长，然后在执行回调之前返回\
