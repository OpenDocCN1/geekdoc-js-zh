  md: "# Function 12: Accepts Callback Functions as Parameters\n\nSimilar to Promises,\
    \ Callback functions are a way to execute asynchronous code in TypeScript. They\
    \ are commonly used to define what happens when an event occurs, such as a button\
    \ click or a URL request finishes executing. They help to make code that can trigger\
    \ and cancel events regardless of when or where the event happens, or how long\
    \ an algorithm takes to execute.\n\nYou may recognize the following pattern the\
    \ `setTimeout()` method, which executes a callback after so many milliseconds:\n\
    \n```\nTypeScript\nsetTimeout(() => {\n  console.log('Task executed after 1000\
    \ ms');\n}, 1000);\n```\n\nSample 15.1: Using setTimeout() callback."
