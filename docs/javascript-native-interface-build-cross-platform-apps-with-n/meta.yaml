    Error: This message describes what went wrong\nat at throwFunction(/src/utilities/errors.ts:7:15)\n\
    at at exampleFrontendFile(/src/ui/frontend.ts:12:23)\nat at main(/src/main.ts:18:5)\n\
    ```\n\nSample 17:3: Example stack trace\n\nAs you see, the error message and stack\
    \ trace can tell a developer what problem occurred and they found the source of\
    \ the error by seeing each line of code that was involved in the error.\n\nTypeScript\
    \ function declarations unfortunately dont support describing potential Errors,\
    \ but they can be described using JSDoc comments, a standard for writing code\
    \ comments in JavaScript:\n\n```\nResulting TypeScript Function Definition\n/**\n\
