  md: '# Function 11: Returns a Promise


    Sometimes executing a function takes an indeterminate amount of time, such as
    URL queries, database lookups, and generating machine learning content.


    In TypeScript, these types of functions are typically executed through asynchronous
    functions, also known as Promises.


    An asynchronous, or async function definition that typically looks like this,
    where the function is both declared with the async keyword and returns a Promise
    resolving to type, in this case a method that converts an number to a string:


    TypeScript


    ```

    const toString = async (number: number) => Promise<string>;

    ```


    Sample 14.1: Asynchronous function declaration, returning a string;'
