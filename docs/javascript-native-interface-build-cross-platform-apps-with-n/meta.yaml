  md: "# Example: String To Number Function\n\nIn the stringToNumber() function described\
    \ earlier in the chapter, we try to convert a string into a number and throw an\
    \ Error if the result is not a valid number or there was some other problem in\
    \ the conversion.\n\n```\nC++\nFunction stringToNumber = Function::createHostFunction(...{\n\
    // casting as string if 'arguments[0]' isn't a string\nstring input = arguments[0].getString().utf8(runtime);\n\
    try {\n    return Value(std::stod(input));\n} catch (const std::invalid_argument&\
    \ e) {\n// Error: input is not a valid number\nthrow JSError(\n    \"Input string\
    \ is not a valid number\"\n);\n} catch (const std::out_of_range& e) {\n// Error:\
    \ result is out of range for a double\nthrow JSError(\n    \"Number is out of\
    \ range\"\n);\n}\n});\n```\n\nExample 17.1: Implementing a function that throws\
    \ Error"
