    \nextern \"C\" JNIEXPORT void JNICALL\nExampleModule_initialize(\nJNIEnv *env,\n\
    jobject clazz,\njlong jsiPtr\n){\n    Runtime *runtime = reinterpret_cast<Runtime\
    \ *>(jsiPtr);\n    if (runtime) {\n    jsiNamespace::installExampleJsiLibrary(runtime);\n\
    \    }\n}\n```\n\n## Initialize the React Native Environment in Java\n\nWe need\
    \ a module that can load our JSI file into memory and execute cpp-bridge.cpp to\
    \ install JSI functions. The class must extend ReactContextBaseModule.\n\n```java\n\
    public class YourJsIModule extends ReactContextBaseModule\n```\n\nImportantly,\
    \ the class must load the compiled binary from cpp folder.\n\n```java\npublic\
    \ static String myLibraryFolder = \"cpp\";\nSystem.loadLibrary(myLibraryFolder);\n\
    ```\n\nSample 1.5: Loading the JSI library using native\n\nThe installExampleJsiLibrary\
    \ is the native method we wrote in cpp/exampleJsiLibrary.cpp. In Java we can declare\
    \ it as a native method, meaning it will execute binary code rather than Java,\
    \ and the long jsi parameter refers to the memory address of the loaded library.\n\
    \n```java\npublic native void installExampleJsiLibrary(long jsi);\n```\n\nSample\
