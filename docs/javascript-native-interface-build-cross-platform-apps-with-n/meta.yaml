    \ what works so that it can be reproduced and then avoid changing software versions\
    \ without the ability to test or revert back to a working version.\n\n# Android\n\
    \nThanks to Java, Android has long had the ability to load and run C++ code from\
    \ the Java Virtual Machine. This feature is called “Java Native Interface,” and\
    \ it lets us run our C++ code when our Android app starts up.\n\nDoing this of\
    \ course is a little involved, as it requires configuring a C compiler, creating\
    \ an interface between Java and C++, creating a few Java classes, and executing\
    \ specific functions at certain times in our app lifecycle.\n\nLet’s see how to\
    \ do this for Android.\n\nUsing Android Studio, open the android folder of your\
    \ React Native project.\n\n## Calling the JSI Module Installer\n\nIn order to\
    \ tell Java how to call the native code, we must create a bridge using the Java\
    \ Native Interface which can call native code external to Java. Create a new file\
    \ in your Android Studio project.\n\n![](img/bda9545f10e8303b87afef4dd62e47e9_38_0.png)\n\
    \nFigure 1.1: Create a new file in Android Studio\n\nName this file as cpp-adapter.cpp:\n\
    \n```cpp\ncpp-adapter.cpp\n```\n\nFigure 1.2: Name the new file\n\nThis file is\
    \ responsible for installing the Native Interface functions by executing the installExampleJsiLibrary()\
    \ function.\n\nTo do this, we must include the Java Native Interface (JNI) and\
    \ JavaScript Native Interface headers, as well as the header for our JSI library:\n\
    \n```cpp\n#include <jni.h>\n#include <jsi/jsi.h>\n#include \"exampleJsiLibrary.h\"\
    \n```\n\ndeclare that we are using the facebook::jsi namespace. This way we can\
    \ write Runtime instead of facebook::jsi::Runtime for example:\n\n```cpp\nusing\
