    ## About the Author


    ![](img/bda9545f10e8303b87afef4dd62e47e9_174_0.png)


    Tony is an open source contributor to the react-native-libsodium project and the
    PKT Blockchain. His curiosity compels him to want to open up and understand everything
    he touches so he can share that understanding with others.


    He has two true passions: branding and inventing.


    His passion for branding led him to start a company that did branding and marketing
    in four countries for firms such as Apple, Intel, and Sony BMG. He loves weaving
    the elements of design, writing, product, and strategy into an essential truth
    that defines a company.


    His passion for inventing led him to start a company that uses brain imaging to
    quantify meditation and to predict seizures, which acquired $1.5m in funding and
    was incubated in San Francisco where he currently resides.


    Those same passions have led him on some adventures as well, including living
    in a Greek monastery with orthodox monks and tagging along with a busker in Spain
    to learn how to play flamenco guitar.


    ## About this Book


    In mobile development, there is a trade-off between portability code and fast
    execution. A new feature of React Native called JavaScript Native Interface (JSI)
    removes that trade-off by allowing developers to write portable code that executes
    as binary code on the native device.


    ## What You Will Learn


    This book teaches you how to write JSI code so that you can have write once, run-everywhere
    mobile apps that feel like they are written in native code.


