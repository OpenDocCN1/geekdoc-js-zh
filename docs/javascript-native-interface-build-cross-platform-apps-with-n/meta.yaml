  md: '# # Integrating Into a Project


    Integrating JavaScript Native Interface into a React Native project can be a little
    tricky. It requires that the compiler correctly find and build the JSI code, and
    that the native code (for example Swift or Java) can locate, load, and execute
    the resulting binary, and that the corresponding functions are correctly exposed
    to the React Native environment.


    Any mistake in configuration or change to the version or features of one of these
    components can result in strange compile or runtime errors, due to compile failures,
    linking failures, inability to load dependent libraries or execute linked functions,
    memory leaks, or simply due to unexplainable application crashes such as segmentation
    faults or signal halts.


    Even with a step-by-step tutorial, you may find unique qualities on your system
    that cause strange failures. It is important do document what works so that it
    can be reproduced and then avoid changing software versions without the ability
    to test or revert back to a working version.'
