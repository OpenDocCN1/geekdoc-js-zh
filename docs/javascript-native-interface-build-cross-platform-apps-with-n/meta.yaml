    \ 的错误\n\n将错误传回 TypeScript 有两种方法。一种方法是使用 `runtime.throwException()` 函数：\n\n```cpp\n\
    runtime.throwException(JSError(\n  runtime,\n  \"Explanation of error message\"\
    \n));\n```\n\n> 示例 17.6：使用 throwException() 函数抛出错误\n\n# 另一种方法是简单地抛出它，就像处理任何其他原生异常一样：\n\
