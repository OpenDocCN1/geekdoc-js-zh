    # Android


    Thanks to Java, Android has long had the ability to load and run C++ code from
    the Java Virtual Machine. This feature is called “Java Native Interface,” and
    it lets us run our C++ code when our Android app starts up.


    Doing this of course is a little involved, as it requires configuring a C compiler,
    creating an interface between Java and C++, creating a few Java classes, and executing
    specific functions at certain times in our app lifecycle.


    Let’s see how to do this for Android.


    Using Android Studio, open the android folder of your React Native project.'
