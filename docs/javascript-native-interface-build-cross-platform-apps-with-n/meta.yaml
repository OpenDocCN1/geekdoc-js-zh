    @implementation ReactNativeJsiBridge\n\nRCT_EXPORT_MODULE()\n\n//synthesize methodQueue\
    \ = _methodQueue;\n// ...\n\n//synthesize bridge = _bridge;\n// ...\n\n@end\n\
