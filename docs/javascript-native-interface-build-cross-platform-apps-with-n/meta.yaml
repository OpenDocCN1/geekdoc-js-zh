    Open source software projects are constantly changing. Small changes in these
    softwares can result in major issues for a developer, due to incompatibilities,
    poor documentation, bugs, or other issues. In order to have a stable development
    environment, it is important install and maintain versions that are known to work
    together.


    This is especially important when working in cross-platform environments such
    as React Native and JavaScript Native Interface. Changes to the organization of
    header files on the host platform or compiler''s libraries, deprecated configuration
    features, and other small changes can make it impossible to compile a React Native
    project with JSI.


    At the time of this writing, the current working versions are React Native 0.74,
    Xcode 15 and Android Studio 2024.1.1 (Canary 8).


    # Install Node.js


    Node.js is a free and open source JavaScript runtime environment essential for
    React Native development. It provides an environment for managing dependencies
    and executing JavaScript outside the browser, facilitating the build and testing
    of React Native applications.


    At the time of writing, React Native requires NodeJS 18 or higher.


    # Install on MacOS


    If you are using HomeBrew with brew.sh, the popular package manager for MacOS,
    you can install Node.js using the brew command:


    ```

    Console

    brew install nodejs

    ```


    > Example 2.1: Installing Node.js using Homebrew


    Alternately you can download and install the latest version from the Node.js website,
    nodejs.org. Once downloaded, you can double-click the installer and follow the
    installation instructions.


    # Install on Windows


    On Windows, you can download the latest version of Node.js from nodejs.org.'
