    \ = (s1: string, s2: string) -> string;\n```\n\nSample 8.3: Creating a two-parameter\
    \ string concatenate function\n\n## TypeScript call\n\n```typescript\nconcatenate(\"\
    hello\");\n```\n\nSample 8.4: Calling a two-parameter function with one argument\n\
    \nIn many cases you will want to loop over the arguments, in which case it is\
    \ useful to know how many arguments have been passed into the function at runtime.\
    \ This is done by accessing the last parameter of the lambda function, size_t\
    \ count:\n\n```cpp\nHostFunctionType simplePrintLambda = [](\n  Runtime &runtime,\n\
    \  const Value &thisValue,\n  const Value *arguments,\n  size_t count\n) -> Value\
    \ {\n  for (int i = 0; i < count; i++) {\n    Value& argument = arguments[i];\n\
    \    // work with argument\n  }\n  return thisValue;\n};\n```\n\nExample 8.2:\
    \ Iterating over runtime parameter\n\n> Note: although it is not a good practice,\
    \ it is possible to create functions which accept an arbitrary number of parameters.\
    \ In this case, the number of parameters and the number of arguments passed to\
    \ the function may be different.\n\n## Putting it All Together\n\nBy combining\
    \ these principles, we can create the sum() function described earlier in the\
    \ chapter. We will throw an error if the number of arguments is less than two\
    \ and then sum the arguments to return the total. We will see more about throwing\
    \ errors in Chapter 17:\n\n```cpp\nFunction sumFunc = Function::createHostFunction(...\
    \ {\n  if (count < 2) {\n    throw JSError(runtime, \"Invalid argument count\"\
    );\n  }\n  double total = 0.0;\n  for (int i = 0; i < count; i++) {\n    total\
    \ += arguments[i].toNumber();\n  }\n  return Value(total);\n});\n```\n\nExample\
    \ 8.3: Looping over the number arguments to sum the value\n\nBefore using this\
    \ function, you must declare it in your global context:\n\n```typescript\ndeclare\
    \ global {\n  function sum(a: number, b: number): number;\n}\n```\n\nSample 8.3:\
    \ Declaring a JSI function in TypeScript\n\nWe can then call the sum() function\
    \ from React Native like this:\n\n```typescript\nconst result = sum(5, 10);\n\
    console.log(result);\n```\n\nSample 8.4: Calling the sum function from React Native\n\
    \n## Function 6: Accepts Multiple Parameters\n\nIn these cases, we must construct\
    \ a facebook::jsi::Array and populate it with items:\n\n```cpp\nunsigned int numItems\
    \ = 100;\nArray array(runtime, numItems);\nfor (int i = 0; i < numItems; i++)\
    \ {\n  array.setValueAtIndex(runtime, i, Value(i));\n}\n```\n\nThen each position\
    \ in the Array can be set using the setValueAtIndex(index) method:\n\n```cpp\n\
    array.setValueAtIndex(runtime, index, value);\n```\n\nThe Value can be any type,\
    \ as shown before. For example String, null, undefined, or even an Array or Object.\n\
    \nFor example, here is how to set a String at array index 0:\n\n```cpp\nString\
    \ stringValue = String::createUtf8(runtime, \"Hello\");\nexampleArray.setValueAtIndex(runtime,\
    \ 0, stringValue);\n// arr[0] = \"Hello\"\n```\n\nFor example, here is how to\
    \ set a number at array index 1:\n\n```cpp\nValue numberValue = Value(32);\nexampleArray.setValueAtIndex(runtime,\
    \ 1, numberValue);\n// arr[1] = 32;\n```\n\nFor example, here is how to set a\
    \ null at array index 2:\n\n```cpp\nValue nullValue = Value();\nexampleArray.setValueAtIndex(runtime,\
    \ 2, nullValue);\n// arr[2] = null\n```\n\nFor example, here is how to set undefined\
    \ at index 3:\n\n```cpp\nValue undefinedValue = Value::undefined();\nexampleArray.setValueAtIndex(runtime,\
    \ 3, undefinedValue);\n// arr[3] = undefined\n```\n\nHere is how to build a single\
    \ element array, [1] and set it as element 4:\n\n```cpp\nArray arrayValue(runtime,\
    \ 1);\narrayValue.setValueAtIndex(runtime, 0, Value(1));\n// [1]\nexampleArray.setValueAtIndex(runtime,\
    \ 4, Value(arrayValue));\n// arr[4] = [1]\n```\n\nTo return the Array, you must\
    \ put it into a Value. All data exchanged with JavaScript data is packaged as\
    \ the facebook::jsi::Value type.\n\n```cpp\nreturn Value(runtime, exampleArray);\n\
    ```\n\nSample 9.12: Return the Array as a JavaScript Value\n"
