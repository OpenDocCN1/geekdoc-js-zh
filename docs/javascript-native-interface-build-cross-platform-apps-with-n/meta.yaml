- md: "\nSince the PropNameId and the global property should have the same name, we\
    \ can simplify the code a little by calling the .utf8() method to retrieve the\
    \ PropNameId as a UTF-8 std::string, like this:\n\n```C++\nPropNameId simplePrintName\
    \ = PropNameID::forAscii(\n  runtime,\n  \"simplePrint\"\n);\nFunction simplePrintFunc\
    \ = Function::createHostFunction(\n  runtime,\n  simplePrintName,\n  // ...\n\
    );\nruntime.global().setProperty(\n  runtime,\n  simplePrintName.utf8(),\n  simplePrintFunc\n\
    )\n```\n\nSample 4.10: Separating the PropNameId to increase code reusability:\n\
    \n> Note: Knowing that the lambda function is a facebook::js::HostFunctionType,\
    \ we can choose to separate the lambda from the JSI function declaration, like\
    \ this:\n\n```C++\n// Property name\nPropNameId simplePrintPropId = PropNameID::forAscii(\n\
    \  runtime,\n  \"simplePrint\"\n);\n\n// Define the lambda\nHostFunctionType simplePrintLambda\
    \ = [](\n  Runtime &runtime,\n  const Value &Value,\n  const Value *arguments,\n\
    \  size_t count\n) -> Value {\n  // echo to the console\n  cout << \"Hello from\
    \ C++\" << endl;\n  return a TypeScript-compatible value\n  return Value::undefined();\n\
    }\n\n// Create the host function\nFunction simplePrintFunc = Function::createHostFunction(\n\
    runtime,\nsimplePrintPropId,\n0,\nsimplePrintLambda\n);\n```\n\nSample 4.11: Separating\
    \ lambda and property name from JSI declaration:\n\n# Putting it All Together\n\
    \nWe can put these concepts together into a single function call that registers\
    \ a JSI function which executes a lambda that echoes “Hello World” to the console\
    \ and returns an undefined-compatible Value:\n\n```cpp/exampleJsiLibrary.cpp\n\
    // ... includes and namespace\nvoid installExampleJsiLibrary(Runtime&runtime)\
    \ {\nPropNameId simplePrintName = PropNameID::forAscii(\nruntime,\n\"simplePrint\"\
    \n);\nFunction simplePrintFunc = Function::createFromHostFunction(\nruntime,\n\
    PropNameID::forAscii(runtime, \"simplePrint\"),\n(\n  Runtime& runtime,\n  const\
    \ Value&thisValue,\n  const Value*arguments,\n  size_t count\n) -> Value\n{\n\
    \  // echo to the console\n  cout << \"Hello from C++\" << endl;\n  // return\
    \ a TypeScript-compatible undefined value\n  return Value::undefined();\n});\n\
    runtime.global().setProperty(\nruntime,\nsimplePrintName.utf8(),\nsimplePrintFunc\n\
    );\n}\n```\n\n> Example 4.6: Install and link a JSI Function using C++\n\nBe sure\
    \ to declare the function in your global context to make the TypeScript compiler\
    \ and your editor aware that this function is available:\n\n```TypeScript\ndeclare\
    \ global {\n  function simplePrint(): void;\n}\n```\n\n> Sample 4.12: Declaring\
    \ a JSI function in TypeScript\n\n# 5\n\n# Function 2: Accepts No Parameters and\
    \ Returns a String\n\nMany times it is useful for a function to return a value.\
    \ This is especially true on React Native where the user can't see what is printed\
    \ in the console.\n\nFor this reason, we want to make a function that returns\
    \ some data, for example, a JavaScript string containing the text \"Hello World\"\
    .\n\nIn Typescript, we need to define such a function like this:\n\nResulting\
    \ TypeScript Function Definition\n\n```\nconst functionName = () => string;\n\
    ```\n\nLet's say we call such a function from an onPress method inside React Native,\
    \ setting a variable to the returned value. The implementation would look like\
    \ this:\n\n```TypeScript\nconst onPress = () => {\n  const stringValue: return\
    \ HelloString();\n  console.log(stringValue); // \"Hello World\"\n}\n```\n\n#\
    \ JSI Implementation\n\nThe corresponding JSI function is declared the same as\
    \ the previous example, including the Value return.\n\nThe difference is that\
    \ instead of returning a Value::undefined(), the lambda function returns Value\
    \ containing a facebook::jsi::String object.\n\n> Note: the facebook::jsi::String\
    \ type is different from std::string you may already be familiar with C++. String\
    \ is specifically designed to be JavaScript-compatible and supports UTF-8 character\
    \ encoding.\n\nThere are two methods for creating Strings in JSI:\n\n| Static\
    \ Method | Explanation |\n| --- | --- |\n| createFromUtf8 | Create UTF-8 compatible\
    \ JavaScript String |\n| createAscii | Create ASCII compatible JavaScript String\
    \ |\n\n*Table 5.1: String creation methods Interface*\n\nTo create a UTF-8 compatible\
    \ String, simply pass text into the createFromUtf8 method:\n\n```C++\nString s\
    \ = String::createFromUtf8(runtime, \"Hello World\");\n```\n\nSample 5.3: Create\
    \ UTF-8 compatible String in JS\n\nTo create an ASCII-compatible String, use the\
    \ createAscii() static method instead:\n\n```C++\nString s = String::createAscii(runtime,\
    \ \"Hello World\");\n```\n\nSample 5.4: Create ASCII-compatible String in JS\n\
    \nNote: a good rule of thumb is that if you are working with human-language text\
    \ you should always use UTF-8 as it supports accented characters and other symbols.\
    \ If you are using String to serialize large binary data such as encryption keys,\
    \ use ASCII since it handles large binary data well. JSI supports returning Value\
    \ type, so it is important to wrap the String into a Value object when returning\
    \ string in JSI function. To do this, you must create and return a Value object,\
    \ like this:\n\n```C++\nreturn Value(runtime, s);\n```\n\nSample 5.5: Return a\
    \ String as a JavaScript-compatible Value object\n\n# Putting it All Together\n\
    \nWe can put these concepts together into a single function call that registers\
    \ a JSI function which executes a lambda that returns \"Hello World\" from a string-like,\
    \ JavaScript-compatible Value object:\n\n```cpp/exampleJsilibibrary.cpp\nvoid\
    \ installExampleJsilibibrary(Runtime& runtime) {\n// create a function the same\
    \ way\nFunction returnStringFunc = Function::createHostFunction(\nruntime,\nPropNameID::forAscii(runtime,\
    \ \"returnString\"),\n0,\n(\n  Runtime &runtime,\n  const Value &thisValue,\n\
    \  const Value *arguments,\n  size_t count\n) -> Value {\n  // return a Value\
    \ that represents a string from UTF-8 text\n  return Value(String::createFromUtf8(runtime,\
    \ \"Hello World\"));\n}\n// register the function as callable\nruntime.global().setProperty(\n\
    \  runtime,\n  \"returnString\",\n  returnStringFunc\n);\n```\n\nExample 5.1:\
    \ A JSI function that returns a string Don’t forget to declare the function in\
    \ your global context to make the TypeScript compiler and your editor aware that\
    \ this function is available:\n\n```TypeScript\ndeclare global {\n  function returnString():\
    \ string;\n}\n```\n\nSample 4.6: Declaring a JSI function in TypeScript\n\n# 6\n\
    \n# Function 3: Returns Primitive Type\n\nStrings aren't the only thing a function\
    \ can return. Sometimes you want to return types other than string from your JSI\
    \ code, for example number, null, OR undefined.\n\nFor example a function that\
    \ returns a number, such as a random number generator:\n\nExample TypeScript Function\
    \ Definition\nconst getRandomNumber = () => number;\n\n> Sample 6.1: Function\
    \ with no parameters and returns a number\n\nSuch a function can be called from\
    \ TypeScript like this:\n\n```TypeScript\nconst onPress = () => {\n  const numberValue:\
    \ number = getRandomNumber();\n  console.log(numberValue); // number\n}\n```\n\
    \n> Sample 6.2: Calling a random number generator from a Button\n\nIt is even\
    \ possible have a function that returns one of several types, although it's generally\
    \ not a good practice to implement such methods as it makes type checking difficult.\n\
    \n*Example TypeScript Function Definition*\n\n```TypeScript\nconst exampleFunc\
    \ = () => string |\nnumber |\nboolean |\nnull |\nundefined;\n```\n\nSample 6.3:\
    \ Function with no parameters, returns any primitive data type\n\nSuch function\
    \ can be called from TypeScript like this. In this example, each time exampleFunc()\
    \ is called it returns a different value:\n\n```TypeScript\nconst onPress = ()\
    \ => {\n  const val1 = exampleFunc();\n  console.log(typeof val1, val1); // string\
    \ Hello\n\n  const val2 = exampleFunc();\n  console.log(typeof val2, val2); //\
    \ boolean true\n\n  const val3 = exampleFunc();\n  console.log(typeof val3, val3);\
    \ // number\n\n  const val4 = exampleFunc();\n  console.log(typeof val4, val4);\
    \ // object null\n\n  const val5 = exampleFunc();\n  console.log(typeof val5,\
    \ val5); // undefined\n}\n```\n\n> Sample 6.4: Function returns random-typed result\n\
    \nA common way this is implemented in TypeScript is to have a function that returns\
    \ data or either undefined or null depending on the circumstance, that it is easy\
    \ to check the type after to know if meaningful data was returned:\n\nFunction\
    \ returning a value or undefined\nconst exampleFunction = () => string | undefined;\n\
    \n> Sample 6.5: Function returns number under some circumstance\n\nSay for example\
    \ we are looking up a user's email address on a system where the user is logged\
