    \ (continued)\n\n## Define the Package that Loads the Module\n\nAs Java development\
    \ tends to favor verbosity, we must also define a Package class which is capable\
    \ of creating the native modules and other relevant features.\n\nIMPORTANT this\
    \ file extends the ReactPackage class and overrides the createNativeModules()\
    \ function to load the ExampleModule when called.\n\nCreate a new file in your\
    \ project called SimpleJsiModulePackage.java.\n\n- YourProjectName\n- android\n\
    \  - java\n    - com.reactnativesimplejsi\n      - SimpleJsiModule.java\n    \
