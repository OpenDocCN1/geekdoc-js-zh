    # Install on Linux


    Many Linux distributions have their own package management system which can install
    Node.js.


    For example the Advanced Package Tool (APT) on Ubuntu and Debian systems:


    ```

    Console

    sudo apt update

    sudo apt install nodejs npm

    ```


    > Example 2.2: Installing Node.js using apt on Linux.


    Fedora and RedHat Enterprise Linux systems use the Dandified YUM package manager:


    ```

    Console

    sudo dnf install nodejs

    ```


    > Example 2.3: Installing Node.js using yum on Linux.


    In any case, once Node.js is installed you make sure it works and is a useful
    version by running it from the command line:


    ```

    Console

    node --version

    ```


    > Example 2.4: Get the version of the installed NodeJS program.


    Node.js should respond with text resembling the following:


    ```

    Console

    v18.4.0

    ```


    > Example 2.1: Example output of a NodeJS version.


    # Install Android Development Kit


    NDK is a toolset that lets you implement parts of your app native-code languages
    such as C and C++. If you intend to develop React Native applications for Android
    devices such as phones, tablets, or Chromebook, you will need to install NDK.


    In order to install NDK, you must first install Android Studio or your operating
    system by downloading it from developer.android.com/studio. After running Android
    Studio, you can open the Tools menu, then open SDK Manager, switch to the SDK
    Tools. Look through the available tools to find NDK (Side by side) and check the
    box next to it. You may also want to check the boxes for CMake and LLB.


    ![](img/bda9545f10e8303b87afef4dd62e47e9_25_0.png)


    Figure 2.1: Installing NDK and CMake from Android Studio


    Click OK to confirm your selection, and Android Studio will download and install
    the selected tools.


    # Installing CMake


    CMake is a cross-platform, open source software for automation the building of
    other software. It lets developers build software for multiple platforms without
    manually configuring the build environment of each platform, by providing a simple
    language to get and set variables and configure and linking options in a single
    configuration file.


    # Installation on MacOS


    If you are using HomeBrew, you can install CMake using the brew command:


    ```

    Console

    brew install cmake

    ```


    > Example 2.5: Installing cmake on MacOS using Homebrew


    Alternately you can download and install the latest version from the CMake website,
    cmake.org. For most users that will be the macOS 10.13 user disk image (dmg).
    Once downloaded you can double-click the install image and then run the following
    command in your Terminal:


    ```

    Console

    sudo "/Applications/CMake.app/Contents/bin/cmake-gui" --install

    ```


    > Example 2.6: Installing the cmake-gui on MacOS from Download


    # Installation on Windows


    On Windows, you can download the latest version of CMake from cmake.org. For most
    users that will be the Windows x64 installer file.


    Once downloaded, double-click the installer file in your File Explorer to run
