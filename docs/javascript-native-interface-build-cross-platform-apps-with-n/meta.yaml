    \ void installLib(JavaScriptContext context) {\n    this.installExampleJsiLibrary(context.get());\n\
    }\n```\n\nSample 1.6: Calling the JSI instance\n\n## Putting it All Together\n\
    \nYou can put it all together by finding the SimpleJsiModule.java file in your\
    \ project path.\n\n- YourProject\n- android\n- com.reactnativesimsi\n- SimpleJsiModule.java\n\
    \nFigure 1.3: Project folder structure with SimpleJsiModule\n\nThis class extends\
