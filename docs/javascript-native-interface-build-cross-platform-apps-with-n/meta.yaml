  md: "It is useful to know that an asynchronous function in TypeScript is implemented\
    \ using a Promise object, which has one method .resolve() to return a value and\
    \ one method .reject() to handle a failure:\n\n```\nTypeScript\nconst toString\
    \ = async (number: number) => Promise<string> {\n  return new Promise((resolve,\
    \ reject) => {\n    setTimeout(() => resolve(\"Promise succeeded\"), 100);\n \
    \   reject(new Error(\"Promise failed\"));\n  });\n};\n```\n\nSample 14.2: Simple\
    \ Promise implementation in TypeScript\n\nAlthough JavaScript supports asynchronous\
    \ function calls, Today's JavaScript engines are single-threaded. This means that\
    \ all code is executed in sequence, sometimes resulting in apps that feel laggy.\n\
    \n![](img/bda9545f10e8303b87afef4dd62e47e9_141_0.png)\n\nFigure 14.1: Single-thread\
    \ execution Promise creates delays in user interaction:\n\nHowever, methods that\
    \ are called from TypeScript aren't required to run on the same thread. This is\
    \ one of the powers of JavaScript Native Interface: C++ can be used to create\
    \ multi-threaded applications that take advantage of the multiple CPU cores available\
    \ on modern computers and smartphones. This can leave the main thread free to\
    \ focus on user-interface updates such as animations while other tasks can be\
    \ done in parallel."
