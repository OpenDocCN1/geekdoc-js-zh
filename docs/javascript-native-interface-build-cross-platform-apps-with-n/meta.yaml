    ## 引言


    JavaScript Interface (JSI) 为开发者提供了跨平台应用的便利性以及原生应用的性能。


    它允许开发者在 C++ 中编写函数，并可以直接从 JavaScript（例如在 React Native 前端中）调用它们。它通过结合 React Native
    的两个现有功能来实现工作：


    1. 原生代码（例如 Swift 或 Java）可以调用编译后的 C++ 的二进制函数。

    2. React Native JavaScript 可以调用定义良好的原生函数。


    C++ 代码可以以跨平台的方式编写，并为各种设备（如 Android 和 iOS）编译，只要它不依赖设备特定或平台特定的功能（如用户界面、某些传感器或特定的摄像头功能）。


    由于 JavaScript 和 C++ 都是跨平台的，且原生层可以将这些语言绑定在一起，因此可能使用一个代码库为多个平台创建 React Native 应用。


    JavaScript Native Interface 代码的编写必须确保函数和数据类型与 JavaScript 类型系统兼容，并且这些函数必须正确导出到
    JavaScript 环境中。


    本书将引导你如何设置 React Native 项目以使用 JSI，以及如何在 JSI 中实现常见的函数类型，包括接收或返回数组和复杂对象类型、Promise
    以及多线程函数。


    # 1


    # 什么是 JavaScript Native Interface


    JavaScript Interface (JSI) 是 Facebook 提供的一种轻量级通用 API，用于在 C++ 代码中与 JavaScript 数据类型和函数进行交互。在
    React Native 的背景下引入的 JSI 提供了一种从 JavaScript 直接调用 C++ 函数以及反之的方法。


    在引入 JSI 之前，React Native 使用“原生桥接”（Native Bridge）功能，这要求开发者使用设备的原生语言编写原生代码，例如 iOS
    上的 Swift 或 Android 上的 Java 或Kotlin。因此想要原生应用性能的 React Native 开发者需要为同一功能维护两个代码库。JSI
    通过允许开发者仅维护一个高性能代码库解决了这个问题。


    虽然 JSI 经常通过维护高性能的 C++ 代码来实现高性能代码，但值得注意的是，JSI 是 React Native 架构的一部分，旨在提高性能。


    由于 JavaScript 和 C++ 都是跨平台的，且原生层可以将这些语言绑定在一起，因此可能使用一个代码库为多个平台创建 React Native 应用。


    JavaScript Native Interface 代码的编写必须确保函数和数据类型与 JavaScript 类型系统兼容，并且这些函数必须正确导出到
    JavaScript 环境中。


    本书将引导你如何设置 React Native 项目以使用 JSI，以及如何在 JSI 中实现常见的函数类型，包括接收或返回数组和复杂对象类型、Promise
    以及多线程函数。

