    \ though JSI back to React Native:\n\n## Return a number\n\nBy passing any double\
    \ value into the Value constructor, it will be converted to a JavaScript-compatible\
    \ number type. For example, here is how to return the number 37.5 back to JavaScript:\n\
    \n```C++\nValue numberValue = Value(37.5);\n```\n\nSample 6.7: Create a JSI number\
    \ Value\n\nSince the lambda function returns a Value, the JSI implementation simply\
    \ needs to return the number as a Value:\n\n```C++\nvoid exampleJsLibrary(Runtime\
    \ &runtime) {\n  // number\n  Function returnNum = Function::createFromHostFunction(...,\
    \ {\n    return Value(37.5);\n  });\n  runtime.global().setProperty(...);\n}\n\
    ```\n\nSample 6.8: Returning a numeric Value in JS\n\nSince JavaScript automatically\
    \ reduces the number of significant figures of number types, passing return Value(37.0000);\
    \ in JSI will automatically convert to a 37 in JavaScript and TypeScript.\n\n\
    # Return a boolean\n\nTo create a boolean value, simply pass a true or false into\
