    \n```typescript\ntry {\n  throwErrorFunction();\n} catch (error: any) {\n  console.error(error.message);\n\
    \  console.error(error.stack);\n}\n```\n\n> 示例 17.2：捕获错误并显示堆栈跟踪\n\n堆栈跟踪对于调试是无价的，因为它显示了执行通过程序调用栈到达错误发生点的精确路径。这允许开发者追溯函数调用，并理解导致错误的操作序列，这对于诊断和修复代码中的问题至关重要。\n\
    \n堆栈跟踪高度依赖项目使用的文件、方法名和框架，但一个示例堆栈跟踪如下：\n\n```console\nError: This message describes\
