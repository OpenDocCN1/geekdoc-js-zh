  md: '# # Appendix II: Glossary


    **ASCII** - a character encoding scheme which supports up to 255 characters due
    to its 8-bit encoding of characters. Typically used to represent latin letters
    (a-z and A-Z) and numbers 0-9.


    **Argument** - data that is passed into a function at runtime.


    **Array** - a linear collection or list of data.


    **Callback** - a function that is passed as an argument to another function, so
    it can be called after some time has passed or an event has been triggered.


    **Java** - A bytecode-compiled language which has sophisticated object handling
    and type checking.


    **JSDoc** - A standard style of block comment in JavaScript


    **Java Native Interface JNI** - a feature of Java that can execute binary code.


    **JavaScript** - A programming language invented to program web pages, but now
    runs on desktop and mobile devices.


    **JavaScript Native Interface (JSI)** - a feature of React Native JavaScript which
    can execute binary code.


    **Lambda** - An nameless function that gets called on-the-fly by another function.


    **Object** - A data structure which contains addressable values.


    **Parameter** - the expected argument type(s) defined to be passed into a function.


    **Pointer** - a memory address where an array, object, or other data structure
    can be found.


    **React** - A JavaScript framework for building web pages.'
