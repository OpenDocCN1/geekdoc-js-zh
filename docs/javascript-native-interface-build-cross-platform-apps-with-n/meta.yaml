    \ function will return undefined:\n\n```TypeScript\nconst onPress = () => {\n\
    \  const userEmail: string | undefined = getUserEmail();\n  if (userEmail ===\
    \ undefined) {\n    console.log(\"User not logged in\");\n  } else {\n    console.log(userEmail);\
    \ // \"email@example.com\"\n  }\n}\n```\n\n> Sample 6.6: Determine login state\
    \ of user by checking if email is undefined\n"
