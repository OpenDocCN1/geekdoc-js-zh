    \ 函数隐式返回的是 void 或 undefined，我们将使用 `facebook::jsi::Value::undefined()` 静态方法显式创建一个，并在\
    \ C++ 代码中返回它。\n\n```cpp\nFunction simplePrintFunc = Function::createFromHostFunction(\n\
