  md: '# What is JavaScript Native Interface


    JavaScript Interface (JSI) is a lightweight, general-purpose API provided by Facebook
    for interacting with JavaScript data types and functions in C++ code. Introduced
    in the context of React Native, JSI offers a way to call C++ functions directly
    from JavaScript and vice versa.


    Before JSI, React Native used a “Native Bridge” feature, which required developers
    to write native code in the device-native language, for example Swift on iOS or
    Java or Kotlin on Android. React Native developers who wanted to have the performance
    of a native app therefore needed to maintain two code-bases for the same features.
    JSI solves this by allowing developers to maintain high-performance code in only
    one language: C++.


    While JSI brings numerous advantages, especially for complex and performance-critical
    applications, it''s worth noting that it requires a good understanding of both
    C++ and JavaScript, as well as the internals of React Native. As such, it''s often
    used for building advanced features, or optimizing performance-critical paths.


    JSI is evolving as part of React Native''s architecture, with ongoing efforts
    to leverage its capabilities for enhancing the framework''s performance and developer
    experience. As such, JSI has an evolving set of features and best practices, making
    it more challenging to work with than typical JavaScript-only or Native Bridge
    applications.


    # Why It Was Created


    JSI addresses fundamental limitations in React Native''s original architecture,
    particularly the inefficiencies of the bridge mechanism that facilitated communication
    between JavaScript and native code. Traditionally, this bridge relied on serializing
    data into a JSON-like format to pass messages, a process that introduced significant
    overhead, especially for operations requiring frequent or complex data exchanges.
    This serialization not only slowed down performance but also made synchronous
    calls between JavaScript and native layers'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'cumbersome, limiting the types of interactions and optimizations developers
    could implement


    By enabling direct and type-safe interactions between JavaScript and C++ without
    serialization, JSI significantly reduces this overhead, offering a pathway to
    improved performance and synchronous execution capabilities. This solves critical
    performance bottlenecks, simplifies the development of high-performance native
    modules, and supports a more flexible and efficient integration of JavaScript
    with native code. Additionally, JSI''s engine-agnostic API lays a foundation for
    future advancements in React Native, facilitating new features like TurboModules
    and the Fabric renderer that aim to enhance Native''s performance, startup times,
    and developer experience.


    Take for example the speed difference between two libraries, Async Storage and
    MMKV. Both are in-memory key/value store databases for React Native, but Async
    Storage is written in JavaScript and MMKV is written in C++ for JavaScript Native
    Interface. This difference results in MMKV having a twenty times performance increase
    over Async Storage.


    ![](img/bda9545f10e8303b87afef4dd62e47e9_9_0.png)


    Figure 1.1: MMKV vs AsyncStorage time in executing 1000 request'
  merge: -1
