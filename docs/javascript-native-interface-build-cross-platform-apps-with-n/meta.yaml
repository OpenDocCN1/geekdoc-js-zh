    \n## 函数 5: 接受多个参数\n\n很多时候，你可能想要向函数发送多个参数，例如一个计算两个数字之和的函数。\n\n```typescript\nconst\
    \ sum = (a: number, b: number) => {\n  return a + b;\n}\n```\n\n示例 8.1: 增加多个函数参数的函数的\
    \ Typescript 实现。\n\n在这种情况下，有必要支持多个函数参数。\n\n`createHostFunction` 的 lambda 函数参数包含一个表示参数的\
    \ `Value` 数组，以及一个表示数组参数数量的计数。因此，通过遍历 `Value` 数组，可以轻松处理传递给 JSI 函数的任意数量参数。\n\n为了看到效果，让我们使用\
    \ JSI 实现 `sum()` 方法。\n\nTypeScript 函数声明如下：\n\n```typescript\n生成的 TypeScript 函数定义:\n\
    const sum = (a: number, b: number) => number;\n```\n\n示例 8.2: 两个参数 sum 方法的函数声明\n\
    \n要在 JSI 中实现此函数，我们需要：\n\n- 1. 验证已向函数传递了两个参数，\n- 2. 将两个参数转换为原生 double 类型，\n- 3.\
    \ 将和作为 `facebook::jsi::Value` 对象返回。\n\n实现如下：\n\n```cpp\nFunction returnObject\
    \ = Function::createFromFunction(... {\n  if (count < 2) {\n    // 抛出错误\n    double\
    \ a = arguments[0].toNumber();\n    double b = arguments[1].toNumber();\n    return\
    \ Value(a + b);\n  }\n});\n```\n\n示例 8.1: 在 JS 中实现的两个参数求和\n\n如果你尝试访问不存在的参数，原生代码将由于栈溢出错误而崩溃。这可能会发生，例如，如果你创建了一个需要某些参数的\
    \ JSI 函数，但你从 TypeScript 调用它时提供的参数太少，例如：\n\n## JSI 函数定义\n\n```cpp\nFunction concatenate\
    \ = Function::createFromFunction(... {\n  string s1 = arguments[0].toString().utf8();\n\
    \  string s2 = arguments[1].toString().utf8();\n  string output = s1 + \"\" +\
    \ s2;\n  return Value(\n    runtime,\n    String::createUtf8(runtime, output)\n\
    \  );\n});\n// 结果函数定义:\n// const concatenate = (s1: string, s2: string) -> string;\n\
    ```\n\n示例 8.3: 创建一个两个参数的字符串拼接函数\n\n## TypeScript 调用\n\n```typescript\nconcatenate(\"\
    hello\");\n```\n\n示例 8.4: 使用一个参数调用两个参数函数\n\n在许多情况下，你可能希望遍历参数，在这种情况下，知道运行时向函数传递了多少参数是有用的。这是通过访问\
    \ lambda 函数的最后一个参数 `size_t count` 实现的：\n\n```cpp\nHostFunctionType simplePrintLambda\
    \ = [](\n  Runtime &runtime,\n  const Value &thisValue,\n  const Value *arguments,\n\
    \  size_t count\n) -> Value {\n  for (int i = 0; i < count; i++) {\n    Value&\
    \ argument = arguments[i];\n    // 处理 argument\n  }\n  return thisValue;\n};\n\
    ```\n\n示例 8.2: 遍历运行时参数\n\n> 注意：虽然这不是一种良好的实践，但可以创建接受任意数量参数的函数。在这种情况下，参数的数量和传递给函数的参数数量可能会不同。\n\
    \n## 整合所有内容\n\n通过结合这些原则，我们可以创建本章节较早描述的 `sum()` 函数。如果参数数量少于两个，我们将抛出一个错误，然后对参数进行求和并返回总和。我们将在第\
    \ 17 章中看到更多关于抛出错误的知识：\n\n```cpp\nFunction sumFunc = Function::createHostFunction(...\
    \ {\n  if (count < 2) {\n    throw JSError(runtime, \"Invalid argument count\"\
    );\n  }\n  double total = 0.0;\n  for (int i = 0; i < count; i++) {\n    total\
    \ += arguments[i].toNumber();\n  }\n  return Value(total);\n});\n```\n\n示例 8.3:\
    \ 循环数量数量以求和值\n\n在使用此函数之前，你必须在你的全局上下文中声明它：\n\n```typescript\ndeclare global {\n\
    \  function sum(a: number, b: number): number;\n}\n```\n\n示例 8.3: 在 TypeScript\
    \ 中声明 JSI 函数\n\n然后我们可以这样从 React Native 调用 `sum()` 函数：\n\n```typescript\nconst\
    \ result = sum(5, 10);\nconsole.log(result);\n```\n\n示例 8.4: 从 React Native 调用\
    \ sum 函数\n\n## 函数 6: 接受多个参数\n\n在这些情况下，我们必须构造 `facebook::jsi::Array` 并为其填充项：\n\n\
    ```cpp\nunsigned int numItems = 100;\nArray array(runtime, numItems);\nfor (int\
