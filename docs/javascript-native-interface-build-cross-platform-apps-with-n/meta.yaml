  md: '# # Examples of JSI Projects


    There are several popular React Native projects that leverage JSI for enhanced
    performance or capabilities.


    +   1. **Hermes**

    hermesengine.dev

    Hermes is the default JavaScript engine used by React Native. It''s fast, has
    a quick start-up time, and a smaller memory footprint than the JavaScriptCore
    engine.


    +   1. **Reanimated2**

    docs.swmansion.com/react-native-reanimated

    Reanimated2 is an animation library for React Native. It uses JS for smooth, native-like
    animations by running them on the UI thread, reducing overhead and enhancing responsiveness.


    +   1. **React Native Vision Camera**

    react-native-vision-camera.com

    An developer-friendly library that provides full control over camera features
    with great error handling and native-speeds.


    These projects are at the core of a lot of other React Native Projects to varying
    degrees, so you are already using JSI perhaps without even realizing it.


    # ## Using Javascript Native Interface


    To use Javascript Native Interface, you must create a C++ file that will get compiled
    with your React Native project.


    This C++ file will have a function describing which custom native functions will
    be available to JavaScript. This function is the JSI equivalent of the `main()`
    function of a standalone C program.


    Unlike `main()`, this function can be given any name. But generally developers
    like to call it something that implies it''s role of installing a'
