    \n# It will run code on the main thread, or “queue” as its called in Objective-C:\n\
    \n```\nios/ReactNativeJsiBridge.mm\n@synthesize methodQueue = _methodQueue;\n\
    + (BOOL)requiresMainQueueSetup {\n  return YES;\n}\n```\n\nSample 1.17: Declaring\
    \ that code runs on main thread by default\n\nIt will use the React Native Bridge\
    \ to interact with native code and JavaScript, to run the installExampleJsiLibrary\
    \ method from a JSI file. In this example, the installer function is in the MyJsiNamespace\
    \ namespace:\n\n```\nios/ReactNativeJsiBridge.mm\n@synthesize bridge = _bridge;\n\
    \n- (void)setBridge:(RCTBridge *)bridge\n  _bridge = bridge;\n  _setBridgeOnMainQueue\
    \ = RCTISMainMainQueue();\n  RCTBridge *cppBridge = (RCTBridge*)self.bridge;\n\
    \  if (cppBridge.runtime) {\n    MyJsiNamespace::installExampleJsiLibrary(\n \
    \     *(facebook::jsi::Runtime)cppBridge.runtime\n    );\n  }\n```"
- md: "\n## Sample 1.18: Connecting JSI to React Native Bridge and installing function\n\
    \nIf you chose not to define a namespace for your JSI installer function, you\
    \ can simply call it without namespace prefix, like this:\n\n```C++\ninstallExampleJsiLibrary(\n\
    *(facebook::jsi::Runtime)*cxxBridge.runtime\n);\n```\n\nSample 1.19: Calling JSI\
    \ installer function without a namespace prefix.\n\n## Putting it it All Together\n\
    \nYou can put it all together by finding the ReactNativeJsiBridge.h and ReactNativeJsiBridge.mm\
    \ files in your project path in Xcode, as well as the cpp folder you linked.\n\
    \n- YourProjectName\n  - cpp\n    - exampleJsiLibrary.cpp\n    - exampleJsiLibrary.h\n\
    \    - ReactNativeJsiBridge.h\n    - ReactNativeJsiBridge.mm\n\n![](img/bda9545f10e8303b87afef4dd62e47e9_56_0.png)\n\
    \nThe ReactNativeJsiBridge.mm file contains the following code, described already:\n\
    \n```ios/ReactNativeJsiBridge.mm\n#import \"ReactNativeJsiBridge.h\"\n\n@implementation\
    \ ReactNativeJsiBridge\n\n@synthesize bridge = bridge;\n@synthesize methodQueue\
    \ = _methodQueue;\n\nRCT_EXPORT_MODULE()\n\n+(BOOL)requiresMainQueueSetup {\n\
    \  return YES;\n}\n\n-(void)setBridge:(RCTBridge *)bridge {\n  bridge = bridge;\n\
    \  setBridgeOnMainQueue(RCTIsMainQueue());\n  RCTCppBridge *cppBridge = (RCTCppBridge\
    \ *)self.bridge;\n  if (cppBridge.runtime) {\n    MyJsiNamespace::installExampleJsiLibrary(\n\
    \      *(facebook::js::Runtime)cppBridge.runtime\n    );\n  }\n}\n\n@end\n```\n\
    \nFigure 1.6: Describing the React Native Bridge to the Native Interface\n\nThe\
    \ ReactNativeJsiBridge.h file imports and extends the RCTBridgeModule.h class\
    \ to link features related to loading and running your native binary through the\
    \ React Native Bridge.\n\n```cpp\nReactNativeJsiBridge.h\n#ifndef ReactNativeJsiBridge_h\n\
    #define ReactNativeJsiBridge_h\n\n#import <RCTBridge+Private.h>\n#import <RCTBridgeModule.h>\n\
    #import <RCTUtils.h>\n#import <jsi/jsi.h>\n#import \"cpp/exampleJsiLibrary.h\"\
    \n\n@interface ReactNativeJsiBridge : <RCTBridgeModule>\n@property (nonatomic,\
    \ assign) BOOL setBridgeOnMainQueue;\n@end\n\n#endif\n```\n\nExample 1.7: Exposing\
    \ the setBridgeOnMainQueue through header\n\nThat's all for iOS. When you compile\
    \ your project for iOS Simulator or a device, the ReactNativeJsiBridge object\
    \ will automatically be compiled and your project will load.\n\n## Calling JSI\
    \ Methods in TypeScript\n\nBy default, TypeScript has a pre-defined understanding\
    \ of what functions and variables are included in the global object. For example,\
    \ functions such as parseInt() and atob() are part of the default JavaScript global\
    \ context.\n\nTherefore, you can call parseInt() directly, which is the same as\
    \ calling global.parseInt().\n\nJavaScript Native Interfaces are not part of the\
    \ default global object definition, meaning that your editor and the TypeScript\
    \ compiler will throw errors when you try to call a JSI function in your TypeScript\
    \ code, for example if we try to call a JSI method called yourJsiFunctionName()\
    \ from React Native:\n\n```typescript\nApp.tsx\nconst onPress = () => {\n  yourJsiFunctionName();\n\
    }\n```\n\nSample 1.19: Calling an un-typed JSI function in TypeScript\n\nYour\
    \ editor should underline yourJsiFunctionName() function as it doesn't exist in\
    \ the known global context. When you run React Native, the\n\n```console\nconsole\
    \ will print a message like this when you try to execute the\nyoursiFunctionName()\
    \ function;\n```\n\n> Console\n> ReferenceError: Property 'yourJsiFunctionName'\
    \ doesn't exist, js engine: hermes\n\nSample 1.20: TypeError thrown when calling\
    \ an unknown JSI function\n\nTo let TypeScript know that a JSI function exists,\
    \ we can define it by writing its method signature in a declare block, like this:\n\
    \n```ts\nApp.ts\ndeclare global {\n  yourJsiFunctionName(param: type): type;\n\
    }\n```\n\n> Sample 1.21: Declaring JSI functions in the global context\n\nAfter,\
    \ the editor will no longer complain about the new function and the JavaScript\
    \ engine will execute the function.\n\n## 4\n\n## Function 1: Accepts No Parameters\
    \ and Returns Void\n\nIn your React Native code, you may want to execute a function\
    \ that performs some action but doesn't return a value. In TypeScript, we tend\
    \ to define such a function like this:\n\nResulting TypeScript Function Definition\n\
    \n```typescript\nconst functionName = () => void;\n```\n\nSample 4.1: Function\
    \ with no parameters and returns void\n\nNote: In JSI, we aim to create a function\
    \ that TypeScript sees the way we've written in such a function declaration, even\
    \ though the JSI is written in C++. In this book we will often use the TypeScript\
    \ function declaration to demonstrate how a JSI behaves in the world of TypeScript.\
    \ We do this because it allows us to understand the outcome of the C++ declaration\
    \ from the perspective of the language we will be calling the method from.\n\n\
    A common example of such a function in React Native is the button onPress() function,\
    \ which is often implemented like this:\n\n```typescript\nconst onPress = () =>\
    \ {\n  console.log(\"button clicked\");\n};\n```\n\n> Sample 4.2: Function with\
    \ no parameters returns void\n\nFor example, let's say we have a function called\
    \ simplePrint which returns a value.\n\n```typescript\nconst simplePrint = ()\
    \ => {\n  return \"Hello World\";\n};\n```\n\n## JSI Implementation\n\nIn TypeScript,\
    \ if we call such a function from React Native, the implementation would look\
    \ like this:\n\n```typescript\nconst simplePrint = () => {\n  simplePrint();\n\
    };\n```\n\n> Sample 4.3: Calling the JSI function\n\n## The number of parameters\n\
    \nUnlike TypeScript, we must always return a value in C++. We create a new function\
    \ like this:\n\n```cpp\nFunction simplePrintFunc = Function::createFromHostFunction(\n\
    \  runtime,\n  NameID::forAscii(runtime, \"simplePrint\"),\n  0, // zero parameters\n\
    \  (\n    Runtime &runtime,\n    const Value &thisValue,\n    const Value *arguments,\n\
    \    size_t count\n  ) -> Value {\n  // execute code here\n  cout << \"Hello World\"\
    \ << endl;\n}\n;\n```\n\n> Sample 4.4: Create a JSI function with no parameters\n\
    \nUnlike TypeScript, we must always explicitly return a value in C++. Since the\
    \ simplePrint() function implicitly returns void OR undefined, we will explicitly\
    \ create one using the facebook::jsi::Value::undefined() static method and return\
    \ that in our C++ code.\n\n```cpp\nFunction simplePrintFunc = Function::createFromHostFunction(\n\
    \  ...\n[(..)] -> Value {\n  cout << \"Hello World\" << endl;\n  return Value::undefined();\n\
    }\n;\n```\n\n> Sample 4.5: Returning an empty value\n\nLastly we register this\
    \ JSI function to be callable from React Native, so that JavaScript can know that\
    \ the function name simplePrint refers to the simplePrintJSI function. We do this\
    \ by using the Global.setProperty method to link the name simplePrint in the React\
    \ Native runtime environment to the pointer to the jsi::Function we just created.\n\
    \n```cpp\nruntime.global().setProperty(\n  runtime,\n  \"simplePrint\",\n  simplePrintFunc\n\
    );\n```\n\n> Sample 4.6: Make the JSI function callable from JavaScript\n"
  mdcn: "\n\n## 示例 1.18: 将 JSI 连接到 React Native Bridge 并安装函数\n\n如果你选择不为 JSI 安装函数定义命名空间，你可以直接调用它而无需命名空间前缀，如下：\n\
    \n```C++\ninstallExampleJsiLibrary(\n*(facebook::jsi::Runtime)*cxxBridge.runtime\n\
    );\n```\n\n示例 1.19: 在没有命名空间前缀的情况下调用 JSI 安装函数。\n\n## 整合\n\n你可以通过在 Xcode 项目路径中找到\
    \ `ReactNativeJsiBridge.h` 和 `ReactNativeJsiBridge.mm` 文件，以及你链接的 `cpp` 文件夹来将它们整合在一起。\n\
    \n- YourProjectName\n  - cpp\n    - exampleJsiLibrary.cpp\n    - exampleJsiLibrary.h\n\
    \    - ReactNativeJsiBridge.h\n    - ReactNativeJsiBridge.mm\n\n![](img/bda9545f10e8303b87afef4dd62e47e9_56_0.png)\n\
    \n`ReactNativeJsiBridge.mm` 文件包含了上述描述的代码：\n\n```ios/ReactNativeJsiBridge.mm\n\
    #import \"ReactNativeJsiBridge.h\"\n\n@implementation ReactNativeJsiBridge\n\n\
    @synthesize bridge = bridge;\n@synthesize methodQueue = _methodQueue;\n\nRCT_EXPORT_MODULE()\n\
    \n+(BOOL)requiresMainQueueSetup {\n  return YES;\n}\n\n-(void)setBridge:(RCTBridge\
    \ *)bridge {\n  bridge = bridge;\n  setBridgeOnMainQueue(RCTIsMainQueue());\n\
    \  RCTCppBridge *cppBridge = (RCTCppBridge *)self.bridge;\n  if (cppBridge.runtime)\
    \ {\n    MyJsiNamespace::installExampleJsiLibrary(\n      *(facebook::js::Runtime)cppBridge.runtime\n\
    \    );\n  }\n}\n\n@end\n```\n\n图 1.6: 向原生接口描述 React Native Bridge\n\n`ReactNativeJsiBridge.h`\
    \ 文件导入并扩展了 `RCTBridgeModule.h` 类，以便通过 React Native Bridge 连接加载和运行你的原生二进制文件的相关功能。\n\
    \n```cpp\nReactNativeJsiBridge.h\n#ifndef ReactNativeJsiBridge_h\n#define ReactNativeJsiBridge_h\n\
    \n#import <RCTBridge+Private.h>\n#import <RCTBridgeModule.h>\n#import <RCTUtils.h>\n\
    #import <jsi/jsi.h>\n#import \"cpp/exampleJsiLibrary.h\"\n\n@interface ReactNativeJsiBridge\
    \ : <RCTBridgeModule>\n@property (nonatomic, assign) BOOL setBridgeOnMainQueue;\n\
    @end\n\n#endif\n```\n\n示例 1.7: 通过头文件暴露 setBridgeOnMainQueue\n\niOS 部分就到这里。当你为\
    \ iOS 模拟器或设备编译项目时，`ReactNativeJsiBridge` 对象将被自动编译，你的项目将被加载。\n\n## 在 TypeScript\
    \ 中调用 JSI 方法\n\n默认情况下，TypeScript 对全局对象包含的函数和变量有预定义。例如，`parseInt()` 和 `atob()`\
    \ 等函数是默认 JavaScript 全局上下文的一部分。\n\n因此，你可以直接调用 `parseInt()`，这等同于调用 `global.parseInt()`。\n\
    \nJavaScript Native Interfaces（JSI）并不是默认全局定义的一部分，这意味着当你尝试在 TypeScript 代码中调用 JSI\
    \ 函数时，编辑器和 TypeScript 编译器将报错。例如，如果我们尝试从 React Native 调用一个名为 `yourJsiFunctionName()`\
    \ 的 JSI 方法：\n\n```typescript\nApp.tsx\nconst onPress = () => {\n  yourJsiFunctionName();\n\
    }\n```\n\n示例 1.19: 在 TypeScript 中调用未定义的 JSI 函数\n\n你的编辑器会为 `yourJsiFunctionName()`\
    \ 函数下划线，因为它在已知的全局上下文中不存在。当你运行 React Native 时，当你尝试执行 `yoursiFunctionName()` 函数时，\n\
    \n```console\nconsole 在尝试执行 yoursiFunctionName() 函数时会打印类似这样的消息；\n```\n\n> Console\n\
    > ReferenceError: Property 'yourJsiFunctionName' doesn't exist, js engine: hermes\n\
    \n示例 1.20: 调用未知 JSI 函数时抛出的 TypeError\n\n为了让 TypeScript 知晓 JSI 函数存在，我们可以通过 `declare`\
    \ 块中编写其方法签名来定义它，如下：\n\n```ts\nApp.ts\ndeclare global {\n  yourJsiFunctionName(param:\
    \ type): type;\n}\n```\n\n> 示例 1.21: 在全局上下文中声明 JSI 函数\n\n之后，编辑器不再对该新函数报错，JavaScript\
    \ 引擎将执行该函数。\n\n## 4\n\n## 函数 1：不接受参数并返回 Void\n\n在你的 React Native 代码中，你可能想要执行一个执行操作但不返回值的函数。在\
    \ TypeScript 中，我们倾向于这样定义此类函数：\n\n生成的 TypeScript 函数定义\n\n```typescript\nconst functionName\
    \ = () => void;\n```\n\n示例 4.1：无参数且返回 void 的函数\n\n注意：在 JSI 中，我们的目标是创建一个函数，让 TypeScript\
    \ 看到的是与我们在函数声明中写的一样的方式，尽管 JSI 是用 C++ 编写的。在书中，我们经常使用 TypeScript 函数声明来演示 JSI 在 TypeScript\
    \ 世界中的行为。这样做是因为它允许我们从调用该方法的语言的角度来理解 C++ 声明的结果。\n\nReact Native 中这种函数的常见例子是按钮的\
    \ `onPress()` 函数，它通常实现方式如下：\n\n```typescript\nconst onPress = () => {\n  console.log(\"\
