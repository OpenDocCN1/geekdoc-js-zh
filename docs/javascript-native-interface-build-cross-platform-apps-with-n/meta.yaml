    const [count, setCount] = useState(0);\nconst incrementCount = () => {\n  setCount((oldCount)\
    \ => oldCount + 1);\n};\n```\n\nSample 16.2: Incrementing a value using a callback\
    \ state setter\n\nThese are both examples of callback functions that receive a\
    \ parameter. The parameter is important in knowing what the outcome of the callback\
    \ is at that moment.\n\nLet's say we have a function called randomDelay() that\
    \ executes a callback after a random delay. The callback contains a parameter\
    \ that shows the length of the delay between calling randomDelay() and executing\
    \ the callback.\n\nThe definition of this function would be as follows:\n\n```TypeScript\n\
    const randomDelay = async (\n  millisecondsElapsed: number) => void\n) => void;\n\
    ```\n\nSample 16.3: Function accepts callback, which takes a parameter\n\nWe can\
