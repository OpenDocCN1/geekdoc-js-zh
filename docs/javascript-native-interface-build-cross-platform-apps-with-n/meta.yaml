    \n```typescript\nfunction toNumber(input: string): number;\n```\n\n> 示例 17.10：声明可以抛出的函数\n\
    \n```typescript\ntry {\n  const result = toNumber(\"Hello\");\n  console.log(result);\n\
    } catch (error: any) {\n  console.error(error.message);\n  console.error(error.stack);\n\
    }\n```\n\n> 示例 17.11：调用可以抛出的函数\n\n# 附录 I：JSI 类型\n\n- **Array**：列表或集合\n- **Boolean**：单比特值，真或假\n\
    - **Null**：空赋值\n- **Function**：可调用的代码单元\n- **Number**：数值\n- **Object**：包含命名值的数据结构\n\
    - **Promise**：可以处理回调的对象的\n- **String**：包含字符序列的对象\n- **Undefined**：未赋值的值\n- **Value**：通用类型\n\
    \n# 附录 II：术语表\n\n- **ASCII**：一种使用 8 位 ASCII 编码的字符方案。通常用于表示文字母 (a-z 和 A-Z) 和数字\
    \ 0-9。\n- **Argument**：在运行时传递函数的数据。\n- **Array**：线性数据集合。\n- **Callback**：作为参数传递给另一个函数，以便在一段时间后或事件触发后被调用。\n\
    - **Java**：具有复杂的对象处理和类型检查的字节码编译语言。\n- **JSDoc**：JavaScript 中一种块注释的标准风格。\n- **Java\
    \ Native Interface JNI**：Java 的一种可以执行二进制代码的功能。\n- **JavaScript**：发明用于编写网页的语言，现在运行在桌面和移动设备上。\n\
    - **JavaScript Native Interface (JSI)**：React Native JavaScript 的一种可以执行二进制代码的功能。\n\
    - **Lambda**：由另一个函数调用的匿名函数。\n- **Object**：包含值的数据结构。\n- **Parameter**：进入函数的预期参数。\n\
    - **Pointer**：数组、对象或其他数据结构所在的内存地址。\n- **React**：用于构建网页的 JavaScript 框架。\n- **React\
    \ Native**：使用 TypeScript 或 JavaScript 编写的跨平台移动和桌面应用开发语言\n- **Reference**：将对象或数组等结构化数据传递给函数的方式，可以直接访问对象。\n\
    - **Thread**：代码的顺序执行。\n- **TypeScript**：JavaScript 的扩展，为变量和函数增加了类型提示和验证。\n- **UTF-8**：一种使用\
