  md: '# How it Works


    JSI introduces a set of C++ classes and methods that represent JavaScript entities
    like values, objects, functions, and arrays. For instance, through JSI, a C++
    function can be exposed to JavaScript as though it were defined in JavaScript.
    Conversely, JSI allows native code to call JavaScript functions directly. This
    bidirectional interaction enables a seamless integration of native and JavaScript
    code.


    ![](img/bda9545f10e8303b87afef4dd62e47e9_10_0.png)


    Figure 1.2: Simplified React Native architectur'
