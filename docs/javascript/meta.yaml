    # Node


    文档树中的节点


    # 子类


    - Attr, Comment, Document, DocumentFragment, Element, Text


    # 常量


    HTML 文档中的所有节点都是上述列出的 Node 子类之一的实例。每个 Node 对象都拥有一个 `nodeType` 属性，用于指定它是哪一个子类的实例。以下常量是
    `nodeType` 的合法值。请注意，这些是 `Node` 的静态属性，而不是单个 Node 对象的属性。它们在 Internet Explorer 4、5
    或 6 中没有定义；在这些浏览器中，你必须使用对应的整数字面量。


    ```

    Node.ELEMENT_NODE = 1; // Element

    Node.ATTRIBUTE_NODE = 2; // Attr

    Node.TEXT_NODE = 3; // Text

    Node.COMMENT_NODE = 8; // Comment

    Node.DOCUMENT_NODE = 9; // Document

    Node.DOCUMENT_FRAGMENT_NODE = 11; // DocumentFragment

    ```


    # 属性


    ### attributes[]


    如果此节点是一个 Element，则 `attributes` 属性是一个只读的 `Attr` 对象数组，代表该元素的属性。该数组可以通过数字或属性名称进行索引。然而，所有的
    HTML 属性都有对应的 Element 属性，因此很少使用 `attributes[]` 数组。


    ### childNodes[]


    这是一个只读的 `Node` 对象数组，包含此节点的节点。如果节点没有节点，则该属性为长度为 0 的数组。


    ### firstChild


    此只读属性指向此节点的第一个子节点，如果节点没有节点，则为 `null`。


    ### lastChild


    此只读属性指向此节点的最后一个子节点，如果节点没有节点，则为 `null`。


    ### nextSibling


    `parentNode` 的 `childNodes[]` 数组中紧跟在该节点之后的兄弟节点，如果不存在这样的节点，则为 `null`。只读。


    ### nodeName


    节点的名称。对于 Element 节点，此属性指定了元素的标签名，也可以通过 Element 的 `tagName` 属性获取。对于 Attr 节点，此属性指定了属性名称。对于其他类型的节点，该值是一个指定节点类型的常量字符串。只读。


    ### nodeType


    节点的类型。此属性的合法值由上述列出的常量定义。


    ### nodeValue


    节点的字符串值。对于 Text 和 Comment 节点，此属性持有文本内容。对于 Attr 节点，它持有属性值。此属性是可读可写的。


    ### ownerDocument


    此节点所属的 Document 对象。对于 Document 节点，此属性为 `null`。只读。


    ### parentNode


    此节点的父节点或容器节点，如果没有父节点，则为 `null`。请注意，Document 和 Attr 节点永远没有父节点。从文档中移除的节点或新创建且尚未插入文档树的节点，其
    `parentNode` 为 `null`。只读。


    ### previousSibling


    `parentNode` 的 `childNodes[]` 数组中紧邻在该节点之前的兄弟节点，如果不存在这样的节点，则为 `null`。


    # 方法


    ### addEventListener(type, listener, useCapture)

    为此节点注册一个事件监听器。`type` 是一个字符串，用于指定事件类型，但不包含 "on" 前缀（例如 "click" 或 "submit"）。`listener`
    是事件处理函数。当触发时，它将以一个 `Event` 对象作为参数被调用。如果 `useCapture` 为 `true`，则这是一个捕获事件处理程序。如果为
    `false` 或省略，则是一个普通事件处理程序。无返回值。DOM Level 2；在 IE 4、5 或 6 中不支持。


    ### appendChild(newChild)

    通过将 `newChild` 节点添加到此节点的 `childNodes[]` 数组末尾，将其添加到文档树中。如果节点已经在文档树中，则会先将其移除，重新插入到新位置。返回
    `newChild` 参数。


    ### cloneNode(deep)

    返回此节点的副本。如果 `deep` 为 `true`，则节点的后代也将被递归复制。


    ### hasAttributes()

    如果此节点是一个 Element 且具有任何属性，则返回 `true`。DOM Level 2。


    ### hasNodes()

    如果此节点有任何子节点，则返回 `true`。


    ### insertBefore(newChild, refChild)

    将 `newChild` 节点插入到文档树中 `refChild` 节点之前，`refChild` 必须是此节点的子节点。如果要插入的节点已经在树中，则会先将其移除。返回
    `newChild`。


    ### isSupported(feature, version)

    如果此节点支持命名特征指定的版本号，则返回 `true`。另见 `DOMImplementation.hasFeature()`。DOM Level 2。


    ### normalize()

    通过删除空的 Text 节点并合并相邻的 Text 节点，规范此节点的所有 Text 后代节点。无返回值。


    ### removeChild(oldChild)

    从文档树中移除 `oldChild` 节点。`oldChild` 必须是此节点的子节点。返回 `oldChild`。


    ### removeEventListener(type, listener, useCapture)

    移除指定的事件监听器。无返回值。DOM Level 2；在 IE 4、5 或 6 中不支持。


    ### replaceChild(oldChild, newChild)

    用 `newChild` 节点替换 `oldChild` 节点（后者必须是此节点的子节点）。如果 `newChild` 已经在文档树中，则会先从其当前位置移除。返回
    `oldChild`。


    # 另


    Attr, Comment, Document, DocumentFragment, Element, Text


    # Number


    核心 JavaScript 1.1; JavaScript 1.79; 2.0; ECMA v1


    对数字的支持


    # 构造函数


    ```

    new Number(value)

    Number(value)

    ```


    使用 `new` 操作符，`Number` 构造函数将其参数转换为数值并返回封装了该值的 Number 对象。如果不使用 `new`，`Number()`
    是一个将其参数转换为数字并返回该值的函数。


    # 常量


    Number.MAX_VALUE

    最大的数字。约为 1.79e308。


    Number.MIN_VALUE

    最小的数字。约为 5e-324。


    Number.NaN

    非数字。同全局 NaN。


    Number.NEGATIVE_INFINITY

    负无穷。


    Number.POSITIVE_INFINITY

    无穷。同全局 Infinity。


    # 方法


    ### toExponential(digits)

    以指数计数法返回数字的字符串表示，小数点前有一位，小数点后 `digits` 位。数字的小数部分将被舍入，并根据需要填充零。如果省略，则尽可能。


    ### toFixed(digits)

    返回一个不使用指数计数法的数字字符串表示，小数点后恰好有 `digits` 位。`digits` 必须在 0 到 20 之间。数字将被舍入，并根据需要填充零。


    ### toLocaleString()

    返回一个根据本地环境格式化的数字的字符串表示。这可能会影响用于小数点和千分位分隔符的字符。


    ### toPrecision(precision)

    返回包含 `precision` 位有效数字的数字字符串表示。`precision` 必须在 1 到 21 之间。返回的字符串尽可能使用固定点法，否则使用指数计数法。数字将被舍入，并根据需要填充零。


    ### toString(radix)

    使用指定的基数（base）将数字转换为字符串并返回该字符串。`radix` 必须在 2 到 36 之间。如果省略，使用基 10。


    # 另


    Math


    # Object


    JavaScript 对象的超类


    # 构造函数


    ```

    new Object();

    ```


    此构造函数创建一个空对象，你可以对其添加任意属性。


    # 属性


    所有 JavaScript 对象无论如何创建，都拥有以下属性。


    - constructor 指向构造对象的 JavaScript 函数的引用。JS 1.1; JavaScript 2.0; ECMA v1。


    # 方法


    所有 JavaScript 对象无论如何创建，都拥有以下方法。


    - hasOwnProperty(propname) 如果对象拥有指定名称的非继承属性，则返回 `true`。如果对象没有该属性，或者它继承自原型对象，则返回
    `false`。JS 1.5; JavaScript 5.5; ECMA v3。


    - isPrototypeOf(a) 如果此是 `a` 的原型，则返回 `true`。如果 `a` 不是对象或者此对象不是它的原型，则返回 `false`。JS
    1.5; JavaScript 5.5; ECMA v3。


    - propertyIsEnumerable(propname) 如果对象拥有指定名称的非继承的可枚举属性，则返回 `true`，否则返回 `false`。可枚举属性是可以通过
    for/in 循环枚举的属性。JS 1.5; JavaScript 5.5; ECMA v3。


