  md: '# JavaScript Pocket Reference


    JavaScript—the powerful, object-based scripting language that can be embedded
    directly into HTML pages—has earned its place in the web developer''s toolkit,
    to the extent that it''s not considered required knowledge for web developers.
    You can use JavaScript to create dynamic, interactive applications that run completely
    within a web browser. JavaScript is also the language of choice for developing
    dynamic HTML content.


    The JavaScript Pocket Reference, Second Edition, provides a complete overview
    of the core Java language and client-side scripting environment, as well as quick-reference
    material covering core and client-side objects, methods, and properties. The new
    edition covers JavaScript 1.5 and is particularly useful for developers working
    with the latest standards-compliant web browsers, such as Internet Explorer 6,
    Netscape 6 and 7, and Mozilla. This pocket-sized book is easy to take anywhere
    and serves as the perfect companion volume to the bestselling JavaScript: The
    Definitive Guide.


    ![](img/c595610b738444dc06a09036110543e5_147_0.png)


    ![](img/c595610b738444dc06a09036110543e5_147_1.png)'
  merge: -1
