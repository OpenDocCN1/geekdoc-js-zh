    Window 对象的属性。这允许一个窗口或帧中的脚本使用另一个窗口或帧定义的变量和函数。例如，通常会在顶层窗口的 `<head>` 中定义函数，然后让嵌套帧中的脚本和事件处理器使用
    `top` 属性调用这些函数：


    ```

    // 帧中的代码调用顶层窗口的代码。

    top.stop_scrolling();

    ```


    # Document 对象（Document）


    每个 Window 对象都有一个 `document` 属性，指向一个 Document 对象。可以说，Document 对象比 Window 对象本身更重要；Window
    代表浏览器窗口，而 Document 对象代表在窗口中显示的 HTML 文档。Document 对象具有各种指向其他对象的属性，这些属性允许访问和修改文档内容。访问和修改文档内容的方式被称为文档对象模型，或
    DOM，目前存在多种 DOM：


    # 遗留 DOM (Legacy DOM)


    原始的遗留文档对象模型随着 JavaScript 语言早期版本的发展而进化。它得到了所有浏览器的支持，但允许访问文档的某些关键部分，例如表单、表单元素和图像。


    # W3C DOM


    该文档对象模型允许访问和修改所有文档内容，并由世界维网联盟（W3C）标准化。Netscape 6 及更高版本、Internet Explorer 5 及更高版本以及其他现代浏览器至少部分支持它。W3C
    DOM 与 IE4 DOM 并不完全兼容，但它确实标准化了原始 DOM 的许多遗留特性。本书涵盖了该标准的核心功能，并为处理 HTML 文档的 JavaScript
    程序员提供了一个相关的 DOM 子集。你可以在《JavaScript: The Definitive Guide》中找到完整内容。


    # IE 4 DOM


    微软的 Internet Explorer 4 为遗留 DOM 增加了强大的功能，用于访问和修改文档内容。这些功能从未标准化，但非微软浏览器支持其中的某些功能。


    # 遗留 DOM (Legacy DOM)


    原始的客户端 JavaScript DOM 通过对象属性提供了对文档内容的访问。几个只读属性（如 `title`、`URL` 和 `lastModified`）提供了关于文档整体的信息。其他属性是指向特定类型内容的数组：


    - `forms[]`：文档中表单对象的数组。

    - `images[]`：文档中图像对象的数组。

    - `applets[]`：表示嵌入文档的 Java applet 数组。JavaScript 实际上可以用于编写和控制这些 applet，但这超出了本文的范围。

    - `links[]`：文档中超链接对象的数组。

