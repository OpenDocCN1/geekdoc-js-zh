    ## Element DOM Level 1, IE 4


    文档中的 HTML 标签


    继承自：Node (在 DOM Level 1 中)


    ### 描述


    Element 对象代表 HTML 元素或标签。IE 4 及后续版本、符合 DOM 标准的浏览器（如 IE 5 及后续）以及 Netscape 6 及后续允许访问文档的每个元素。它们在这些元素上定义了此处列出的属性和方法。遗憾的是，IE
    4 DOM 定义的方法和属性与 W3C DOM 标准定义的方法和属性并不相同。由于这种不兼容性，它们在后续列表中被分组成。


    ## W3C DOM 属性


    在支持 W3C DOM 的网页浏览器中，HTML 文档中的所有元素都具有与其 HTML 属性对应的属性，包括如 dir、id、lang 和 title 等通用属性。当
    HTML 属性名由多个单词组成时，对应的 JavaScript 属性使用小写。否则如此（例如 id 和 href，tagName 和 accessKey）。有两个
    HTML 属性名称是 JavaScript 或 Java 中的保留字，需要特殊的属性名。JavaScript 使用属性 `className` 来引用所有
    HTML 标签的 class 属性，并使用 `htmlFor` 来引用 `<label>` 和 `<script>` 标签的 for 属性。除了 HTML
    属性外，所有元素都定义了以下属性。同时记住，在符合 DOM 标准的浏览器中，所有 HTML 元素继承 Node 对象的属性。


    ## className


    元素的类属性的字符串值，指定一个或多个 CSS 类。注意，该属性未名为 "class"，因为该名称是 JavaScript 中的保留字。


    ## style


    一个代表 HTML 元素样式属性的 Style 对象。


    ## tagName


    元素的只读标签名。对于 HTML 文档，无论文档源代码中的大小写如何，返回的标签名均为大写。�。在 XHTML 文档中，值为小写。


    ## IE DOM 属性


    Internet Explorer 4 及后续版本定义了私有的 DOM。在 IE 4 DOM 中，与 W3C DOM 一样，每个 HTML 元素都有与其 HTML
    属性对应的 JavaScript 属性。此外，IE 4 DOM 为每个元素定义了以下属性：


    ### all[]


    包含此元素的所有后代 Element 对象的数组。此数组可以通过数字索引按源顺序访问元素。或者也可以通过元素 id 或 name 进行索引。另请 Document.all()。


    ### children[]


    包含此元素直接子节点的 Element 对象的数组。注意，IE 4 DOM 没有等于 Text 或 Comment 的节点，因此元素的子节点只能是 Element
    对象。


    ## className


    一个可读可写的字符串，用于指定元素类属性的值。


    ## document


    指向包含它的 Document 对象的引用。


    ## innerHTML


    元素内部的 HTML 文本，不包括元素本身的起始和结束标签。设置此属性将替换元素的内容。由于此非标准属性强大且广泛使用，包括 Netscape 6 及后续版本和
    Mozilla 在内的其他浏览器已实现它。


    ## innerText


    元素内部的纯文本，不包括元素本身的起始和结束标签。设置此属性会将元素的内容替换为未解析的纯文本。


    ## offsetHeight


    元素及其所有内容的高度（像素为单位）。


    ## offsetLeft


    元素相对于 offsetParent 容器元素的 X 坐标。


    ## offsetParent


    指定定义测量 offsetLeft 和 offsetTop 所在坐标系的容器元素。对于大多数元素，offsetParent 是包含它们的 Document
    对象。然而，如果一个元素具有动态定位的祖先，则该祖先就是 offsetParent。表格单元格是相对于它们所在的行进行定位的。


    ## offsetTop


    元素相对于 offsetParent 容器元素的 Y 坐标。


    ## offsetWidth


    元素及其所有内容的宽度（像素为单位）。


    ## outerHTML


    元素的 HTML 文本，包括其起始标签、结束标签和内容。设置此属性将替换该元素及其内容。


    ## outerText


    元素的纯文本，包括其起始和结束标签。设置此属性将替换元素及其内容。


    ## sourceIndex


    元素在文档中的索引。


    ## style


    代表此元素内联样式的 Style 对象。设置此对象会更改元素的显示。


    ## tagName


    指定标签名的只读字符串。


    ## W3C DOM 方法


    在支持 W3C DOM 的网页浏览器中，HTML 文档中的所有元素都支持以下方法，并继承 Node 的方法。许多这些方法用于获取和设置属性值，但很少使用，因为
    Element 对象拥有镜像所有 HTML 属性的属性。


    getAttribute(name)


    返回命名属性的字符串值。


    getAttributeNode(name)


    返回命名属性的 Attr 节点。


    getElementsTagName(name)


    返回此元素中所有具有指定名称的数组，按它们在文档中出现的顺序排列。


    hasAttribute(name)


    如果元素具有指定的属性，则返回 true，否则返回 false。


    removeAttribute(name)


    从元素中删除指定的属性及其值，无返回。


    removeAttribute(oldAttr)


    从元素的属性列表中移除指定的 Attr 节点。返回被移除的 Attr 节点。


    setAttribute(name, value)


    将命名属性设置为指定的字符串值，无返回。


    setAttributeNode(newAttr)


    将指定的 Attr 节点添加到元素的列表中。如果存在同名属性，则替换其值。返回被 newAttr 替换的 Attr 节点，如果没有属性被替换则返回 null。


    ## IE DOM 方法


    Internet Explorer 4 及后续版本为所有文档元素支持以下非标准方法。


    contains(target)


    如果此元素包含 Element target，则返回 true，否则返回 false。


    getAttribute(name)


    返回元素命名属性的字符串值，如果没有此类属性则返回 null。


    insertAdjacentHTML(where, text)


    在元素附近的根据 where 指定的位置插入 HTML 文本。where 必须是 "BeforeBegin","AfterBegin","BeforeEnd"
    或 "AfterEnd" 字符串之一。无返回。


    insertAdjacentText(where, text)


    在元素附近的根据 where 指定的位置插入纯文本。无返回。


    removeAttribute(name)


    从元素中删除命名属性及其值。成功返回 true；失败返回 false。


    scrollToView(top)


    滚动文档使此元素在窗口的顶部或底部可见。如果 top 为 true 或省略，元素出现在窗口顶部。如果为 false，元素出现在窗口底部。


