    String(s)

    new String(s)

    ```


    使用 `new` 运算符，`String()` 函数将其参数转换为字符串。使用 `new` 运算符，它是将转换的值封装在 `String` 对象中的构造函数。


    ## 属性


    ```

    length

    ```

    字符串中的字符数。只读。


    ## 方法


    ```

    charAt(n)

    ```

    返回字符串位置 n 处的字符。


    ```

    charCodeAt(n)

    ```

    返回字符串位置 n 处的 Unicode 编码。JS 1.2; JavaScript 5.5; ECMA v1.


    ```

    concat(value, ...)

    ```

    返回从每个参数转换为字符串并拼接字符串得到的新字符串。JS 1.2; JavaScript 3.0; ECMA v3.


    ```

    indexOf(substring, start)

    ```

    返回字符串中在 `start` 位置之后首次出现 `substring` 的位置，如果没有找到则返回 -1。如果省略 `start`，则使用 0。


    ```

    lastIndexOf(substring, start)

    ```

    返回字符串中在 `start` 位置之前最后一次出现 `substring` 的位置，如果没有找到则返回 -1。如果省略 `start`，则使用字符串长度。


    ```

    match(regexp)

    ```

    将此字符串与指定的正则表达式匹配，返回一个包含匹配结果的数组，如果没有找到则返回 `null`。如果 `regexp` 不是全局正则表达式，返回的数组与 `RegExp.exec()`
    方法相同。如果 `regexp` 是全局的（具有 `g` 属性），返回数组的元素包含每个匹配项的文本。JS 1.2; JavaScript 3.0; ECMA
    v3.


    ```

    replace(regexp, replacement)

    ```

    返回新字符串，将匹配 `regexp` 的文本替换为 `replacement`。`regexp` 可以是正则表达式或普通字符串。`replacement`可以是字符串，包含可选的正则表达式转义序列（如
    $1），这些序列会被匹配文本的部分替换。它也可以是一个函数，根据传入的匹配细节计算替换字符串。JS 1.2; JavaScript 3.0; ECMA v3.


    ```

    search(regexp)

    ```

    返回字符串中第一个匹配 `regexp` 的子字符串的起始位置，如果没有找到则返回 -1。JS 1.2; JavaScript 3.0; ECMA v3.


