    ## Netscape 4 属性


    innerHeight, innerWidth

    读写属性，用于指定此窗口文档显示区域的高度和宽度（以像素为单位）。这些维度不包括菜单栏、工具栏、滚动条等的高度。


    outerHeight, outerWidth

    读写整数，用于指定窗口的总高度和宽度（以像素为单位）。这些维度包含了菜单栏、工具栏、滚动条、窗口边框等的高度和宽度。


    pageXOffset, pageYOffset

    只读整数，用于指定当前文档向右（pageXOffset）和向下（pageYOffset）滚动的像素数。


    screen, screenY

    只读整数，用于指定窗口在屏幕上左上角的 X 和 Y 坐标。如果此窗口是一个帧（frame），这些属性指定包含该帧的顶层窗口的 X 和 Y 坐标。


    ## IE 4 属性


    clientInformation

    IE 特有的 `navigator` 属性的别名。指向 `navigator` 对象。


    event

    event 属性指向一个 Event 对象，该对象包含此窗口内最近发生事件的详细信息。在 IE 事件模型中，Event 对象不作为参数传递给事件处理程序，而是赋值给此属性。


    ## 方法


    Window 对象具有以下可移植方法。由于 Window 对象是客户端 JavaScript 中的全局对象，它还定义了 Global 引用页面上列出的方法。


    alert(message)

    在对话框中显示消息。无返回值。JS 1.0。


    blur()

    释放键盘焦点并无返回值。JS 1.1。


    clearInterval(intervalId)

    取消由 `intervalId` 指定的代码的周期性执行。参见 `setInterval()`。无返回值。JS 1.2。


    clearTimeout(timeoutId)

    取消由 `timeoutId` 指定待定超时。参见 `setTimeout()`。无返回值。JS 1.0。


    close()

    关闭窗口并无返回值。JS 1.0。


    confirm(question)

    在对话框中显示问题并等待“是”或“否”的响应。如果用户点击确定 按钮，返回 true；如果用户点击取消按钮，则返回 false。JS 1.0。


    focus()

    请求键盘焦点；这也会所有平台上将窗口置于顶层。无返回值。JS 1.1。


    getComputedStyle(elt)

    返回一个只读的 Style 对象，其中包含应用于指定文档元素 `elt` 的所有 CSS 样式（而不只是内联样式）。从此计算样式对象查询的定位属性（如 left、top
    和 width）始终以像素值形式返回。DOM 第 2 级。


    moveBy(dx, dy)

    将窗口从当前位置移动指定的距离并无返回值。JS 1.2。


    moveTo(x, y)

    将窗口移动到指定的位置并无返回值。JS 1.2。


    open(url, name, features)

    在命名窗口中显示指定的 `url`。如果省略了 `name` 参数或没有同名的窗口，则创建一个新窗口。可选的 `features` 参数是一个字符串，以逗号分隔的特性列表指定新窗口的大小和装饰。所有平台通常支持的特性名称有：`width=pixels``height=pixels`、location、menubar、resizable、status
    和 toolbar。在 IE 中，使用 `left=x` 和 `top=y` 设置窗口位置。在 Netscape 中，我们使用 `screenX=x` 和
    `screenY=y`。返回现有或新的 Window 对象。JS 1.0。


    print()

    模拟点击浏览器的打印按钮并无返回值。Netscape 4；IE 5。


    prompt(message, default)

    在对话框中显示消息并等待用户输入文本响应。显示可选的 `default` 作为默认响应。返回用户输入的字符串；如果用户未输入字符串，返回空字符串；如果用户点击取消，则返回
    null。JS 1.0。


    resizeBy(dw, dh)

    按指定量调整窗口并无无。JS 1.2。


    resizeTo(width, height)

    按指定大小调整窗口并无返回值。JS 1.2。


    scroll(x, y)

    将窗口滚动到指定的坐标并无返回值。JS 1.1；在 JS 1.2 中已弃用，改为 `scrollTo()`。


    scrollToBy(dx, dy)

    按指定量滚动窗口并无返回值。JS 1.2。


    scrollTo(x, y)

    将窗口滚动到指定的位置并无返回值。JS 1.2。


    setInterval(code, interval, args...)

    每隔 interval 毫秒执行一次 JavaScript 代码。在 Netscape 4 和 IE 5 中，`code` 可以是函数引用而不是字符串。在这种情况下，函数每隔
    interval 毫秒被调用一次。在 Netscape 中，interval 之后的任何参数都会传递给该函数，但 IE 不支持此功能。返回一个间隔 ID，可以传递给
    `clearInterval()` 取消周期性执行。JS 1.2。


    setTimeout(code, delay)

    在延迟 delay 毫秒后执行字符串 `code` 中的 JavaScript 代码。在 Netscape 4 和 IE5 中，`code` 可能是函数而不是字符串；参见
    `setInterval()` 下的讨论。返回一个 ID 值，可以传递给 `clearTimeout()` 取消待定的执行。注意此方法立即返回。JS 1.0。


    ## 事件处理器


    blur

    当窗口失去焦点时触发。


    onerror

    当发生错误时触发。


    focus

    当窗口获得焦点时触发。


    onload

    当文档完全加载时触发。


    resize

    当窗口大小改变时触发。


    unload

    当浏览器离开文档时触发。


