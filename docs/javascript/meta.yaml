    # Window control


    The Window object defines methods to move, resize, and scroll windows, and methods
    to give keyboard focus to and take focus away from windows. For example:


    ```

    // Automatically scroll 10 pixels a second

    setInterval("scrollBy(0,1)", 100);

    ```


    moveTo(), moveBy(), resizeTo(), resizeBy(), scrollTo(), scrollBy(), focus() and
    blur() in the Window object entry of the reference section for more information.


    More important than these methods that manipulate an existing window are the open()
    method that creates a new browser window and the close() method that closes a
    script-created window. The open() method takes three arguments. The first is the
    URL to be displayed in the new window. The second is an optional name for the
    window. If a window by that name already exists, it is reused and no new window
    is created. The third argument is an optional string that specifies the size of
    the new window and the features, or chrome, that it should display. For example:


    ```

    // Open a new window

    w = open("new.html", "newwin", // URL and name

    "width=400,height=300," + // size

    "location,menubar," + // chrome

    "resizable,scrollbars,status,toolbar");

    w.close();

    ```


    Note that most browsers only allow scripts to close windows that they have opened
    themselves. Also, because of the recent proliferation of nuisance pop-up advertisements
    on the Web, some browsers do not allow scripts to open new windows at all.


    # Multiple windows and frames


    As discussed previously, the open() method of the Window object allows you to
    create new browser windows that are represented by new Window objects. The window
    that a script is running in the global object for that script, and you can use
    all the properties and methods of that Window object as if they were globally
    defined. When a script running in one window needs to control or interact with
    a different window, however, you must explicitly specify the Window object:


    ```

    // Create a new window and manipulate it

    var w = open("newdoc.html");

    w.alert("Hello new window");

    w.setInterval(scroll(0,1),50);

    ```


    HTML allows a single window to have multiple frames. Many web designers choose
    to avoid frames, but they are still in fairly common use. JavaScript treats each
    frame as a separate Window object, and scripts in different frames run independently
    of each other. The frames property of the Window object is an array of Window
    objects, representing the sub-frames of a window:


    ```

    // Scripts in frames refer to frames like this:

    frames[0].location = "frame1.html";

    frames[1].location = "frame2.html";

    // With nested frames, you can use:

    frames[1].frames[2].location = "frame2.3.html";

    // Code in a frame refers to the top-level window:

    top.status = "Hello from the frame";

    ```


    The parent property of a Window object refers to the containing browser window
    or window. The top property refers to the top-level frame or window that is at
    the root of the frame hierarchy. If the Window object represents a top-level window
    rather than a frame, a parent and top properties simply refer to the Window object
    itself.


    Each browser window and frame has a separate JavaScript execution context, and
    in each context, the Window object is the global object. This means that any variables
    declared or functions defined by scripts in the window or frame become properties
    of the corresponding Window object. This allows a script in one window or frame
    to use variables and functions defined in another window or frame. It is common,
    for example, to define functions in the <head> of a top-level window, and then
    have scripts and event handlers in nested frames call those functions using the
    top property:


    ```

    // Code in a frame calls code in the top-level window.

    top.stop_scrolling();

    ```


    # The Document Object


    Every Window object has a document property that refers to a Document object.
    The Document object is arguably more important than the Window object itself;
    while the Window represents the browser window, the Document object represents
    the HTML document that is displayed in that window. The Document object has various
    properties that refer to other objects which allow access to and modification
    of document content. The way that document content is accessed and modified is
    called the document object model, or DOM, and there are several DOMs in existence:


    # Legacy DOM


    The original legacy document object model evolved along with early versions of
    the JavaScript language. It is well supported by all browsers, but allows access
    to certain key portions of documents, such as forms, form elements, and images.


    # W3C DOM


    This document object model allows access and modification of all document content
    and is standardized by the World Wide Web Consortium (W3C). It is at least partially
    supported by Netscape 6 and later, Internet Explorer 5 and later, and other modern
    browsers. The W3C DOM is not closely compatible with the IE4 DOM, but it does
    standardize many of the legacy features of the original DOM. This book covers
    the core features of the standard, and presents a simplified subset of the DOM
    relevant for JavaScript programmers working with HTML documents. You can find
    complete coverage in JavaScript: The Definitive Guide.


    # IE 4 DOM


    Microsoft''s Internet Explorer Version 4 extended the legacy DOM with powerful
    new features for accessing and modifying all content of a document. These features
    were never standardized, but some of them are supported in non-Microsoft browsers.


    The following sections explain each of these DOMs in more detail and describe
    how you can use them to access and modify document content.


    # The Legacy DOM


    The original client-side JavaScript DOM provides access to document content through
    properties of the document object. Several read-only properties, such as title,
    URL, and lastModified provide information about the document as a whole. See the
    reference section for details on these and all methods. Other properties are arrays
    that refer to specific types of document content:


    - forms[]

    An array of Form objects representing the forms in a document.

    - images[]

    An array of Image objects representing the images that appear in a document.

    - applets[]

    An array of objects that represent Java applets embedded in a document. JavaScript
    can actually be used to script and control these applets, but doing so is beyond
    the scope of this reference.

    - links[]

    An array of Link objects representing the hyperlinks in the document.

    - anchors[]

    An array of Anchor objects representing the anchors (named positions created with
    the name attribute of the <a> tag) in the document.


    These arrays contain objects in the order they appear in the document. So the
    first form in a document is document.forms[0], and the third image is document.images[2].
    Another way to refer to document forms, images, and applets is to give them names
    with the HTML name attribute:


    ```

    <form name="address">...</form>

    ```


    When an form, image, or applet is given a name in this way, you can use that name
    to look it up in the array, or to look it up directly as a property of the document
    itself:


    ```

    document.forms["address"] // A named form

    document.address // The same thing

    ```


    The Form object is particularly interesting. It has an elements[] array that contains
    objects representing the elements of the form, in the order they appear in the
    form. Input, Select, and Textarea section in the reference section for details
    on these form elements.


    The elements[] array of a Form works much like the forms[] array of a Document:
    it holds form elements in the order they appear in the form, but it also allows
