    ## Link


    Client-side JavaScript 1.0


    <a> or <area> link


    Inherits From: Element


    ## Synopsis


    ```

    document.links[i]

    ```


    ## Properties


    Many of the properties of a Link object represent portions of its URL. For each
    such property, the example given is a portion of the following (fictitious) URL:


    ```

    http://www.oreilly.com:1234/catalog/search.html?q=JavaScript&m=10results

    ```


    ### hash


    A read/write string property that specifies the anchor portion of the Link''s
    URL, including the leading hash (#) mark. For example: “#result”.


    ### host


    A read/write string property that specifies the hostname and port portions of
    a Link''s URL. For example: “www.oreilly.com:1234”.


    ### hostname


    A read/write string property that specifies the hostname portion of a Link''s
    URL. For example: “www.oreilly.com”.


    ### href


    A read/write string property that specifies the complete text of the Link''s URL.


    ### pathname


    A read/write string property that specifies the pathname portion of a Link''s
    URL. For example: "/catalog/search.html".


    ### port


    A read/write string (not a number) property that specifies the port portion of
    a Link''s URL. For example: "1234".


    ### protocol


    A read/write string property that specifies the protocol portion of a Link''s
    URL, including the trailing colon: For example: "http:".


    ### search


    A read/write string property that specifies the query portion of a Link''s URL,
    including the leading question mark. For example: "?q=JavaScript&m=10".


    ### target


    A read/write string property that specifies the name of a Window object (i.e.,
    a frame or a top-level browser window) in which the linked document should be
    displayed. This property is the standard target HTML attribute. The special names
    "blank", "top", "parent", and "self" are allowed.


    ## Event Handlers


    onclick


    Invoked when the user clicks on the link. In JavaScript 1.1, this event handler
    may prevent the link from being followed by returning false.


    mouseout


    Invoked when the user moves the mouse off the link. JS 1.1.


    mouseover


    Invoked when the user moves the mouse over the link. The status property of the
    current window may be set here. Return true to tell the browser not to display
    the URL of the link in the status line.


    ## See Also


    Anchor, Location


    ## Location


    Client-side JavaScript 1.0


    current browser location


    ## Synopsis


    location

    window.location


    ## Properties


    The Location object defines the same URL-related properties that the Link object
    does, with the exception of the hash, host, href, pathname, port, protocol, and
    search properties. See the Link object for a description of the target.target.
    Setting any of these properties causes the browser to load and display the document
    from the new URL. As a shortcut, you can also load a new document by assigning
    a URL string to the location property of the Window.


    ## Methods


    reload(force)


    Reloads the current document from the cache or the server. The force argument
    is optional. If true, it forces a complete reload, even if the document has not
    been modified. Returns nothing. JS 1.1.


    replace(url)


    Replaces the current document with a new one, without generating a new entry in
    the browsing history. Returns nothing. JS 1.1.


    ## See Also


    Link, Window.location


    ## Math


    Core JavaScript 1.0; JavaScript 1.0; ECMA v1


    mathematical functions and constants


    ## Synopsis


    ```

    Math.constant

    Math.function()

    ```


    ## Description


    The Math object is a placeholder for grouping mathematical constants and functions.
    It does not define a class of objects as Date and String do. There is no Math()
    constructor, and functions like Math.sin() are simply functions, not methods that
    operate on an object.


    ## Constants


    Math.E: The constant e, the base of the natural logarithm.


    Math.LN10: The natural logarithm of 10.


    Math.LN2: The natural logarithm of 2.


    Math.LOG10E: The base-10 logarithm of e.


    Math.LOG2E: The base-2 logarithm of e.


    Math.PI: The constant $\pi$.


    Math.SQRT1_2: 1 divided by the square root of 2.


    Math.SQRT2: The square root of 2.


    ## Functions


    Math.abs(x): Returns the absolute value of x.


    Math.acos(x): Returns the arc cosine of x; the return value is between 0 and $\pi$
    radians.


    Math.asin(x): Returns the arc sine of x; the return value is between $-\pi/2$
    and $\pi/2$ radians.


    ## Math.atan(x)


    Returns the arc tangent of $x$; the return value is between $-\pi/2$ and $\pi/2$
    radians.


    ## Math.atan2(y, x)


    Returns a value between $-\pi$ and $\pi$ radians that specifies the counterclockwise
    angle between the positive X-axis and the point.


    ## Math.ceil(x)


    Returns the nearest integer greater or equal to $x$.


    ## Math.cos(x)


    Returns the cosine of $x$.


    ## Math.exp(x)


    Returns $e$ raised to the power of $x$.


    ## Math.floor(x)


    Returns the nearest integer less than or equal to $x$.


    ## Math.log(x)


    Returns the natural logarithm of $x$.


    ## Math.max(args...)


    Returns the largest of the arguments.


    ## Math.min(args...)


    Returns the smallest of the arguments.


    ## Math.pow(x, y)


    $x$ to the power of $y$.


    ## Math.random()


    Returns a pseudo-random number between 0.0 and 1.0.


    ## Math.round(x)


    Returns the integer closest to $x$.


    ## Math.sin(x)


    Returns the sine of $x$.


    ## Math.sqrt(x)


    Returns the square root of $x$.


    ## Math.tan(x)


    Returns the tangent of $x$.


    ## See Also


    Number


    ## Navigator


    Client-side JavaScript 1.0


    information about the browser


    ## Synopsis


    navigator


    ## Properties


    appName


    A read-only string that specifies a nickname for the browser. In all Netscape,
    this is “Mozilla”. In IE, this is “Mozilla”.


    appVersion


    A read-only string that specifies version and platform information for the browser.
    The first part of this string is a version number. Pass the string to parseInt()
    to obtain the major version number or to parseFloat() to obtain the major and
    minor version numbers as a floating-point value. The remainder of the string provides
    other details about the browser version, including the operating system it is
    running on. Unfortunately, however, the format of this information varies widely
    from browser to browser.


    cookieEnabled


    A read-only boolean that is true if the browser has cookies enabled, and false
    if they are disabled. IE 4, Netscape 6.


    language


    A read-only string that specifies the default language of the browser. The value
    of this property is a standard two-letter language code such as “en” for English
    or “fr” for French. It can also be a five-letter string indicating a language
    and regional variant, such as “fr_CA” for French, as spoken in Canada. Netscape
    4; note that IE 4 provides two different language-related properties.


    platform


    A read-only string that specifies the operating system and/or hardware platform
    the browser is running under. Although there is not standard set of values for
    this property, some typical values are “Win32”, “MacPPC”, and “Linux i586”. JS
    1.2.


    systemLanguage


    A read-only string that specifies the default language of the operating system
    using the same standard codes used by the Netscape-specific language property.
    IE 4.


    userAgent


    A read-only string that specifies the value the browser uses for the user-agent
    header in HTTP requests. Typically, this is the value of navigator.appName followed
    by a slash and the value of navigator.appVersion.


    userLanguage


    A read-only string that specifies the preferred language of the user using the
    same standard codes used by the Netscape-specific language property. IE 4.


    ## Methods


    ```

    javaEnabled()

    ```


    Returns true if Java is supported and enabled in the current browser, or false
    if it is not. JS 1.1.


