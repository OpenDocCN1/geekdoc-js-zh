    Link, Window.location


    ## Math


    Core JavaScript 1.0; JavaScript 1.0; ECMA v1


    数学函数和常量


    ## 概要


    ```

    Math.constant

    Math.function()

    ```


    ## 描述


    Math 对象是用于分组数学常量和函数的占位符。它不像 Date 和 String 那样定义了一类对象。没有 Math() 构造函数，像 Math.sin()
    这样的函数只是函数，而不是作用于对象的方法。


    ## 常量


    Math.E: 常数 e，自然对数的底。


    Math.LN10: 10 的自然对数。


    Math.LN2: 2 的自然对数。


    Math.LOG10E: e 以 10 为底的对数。


    Math.LOG2E: e 以 2 为底的对数。


    Math.PI: 常数 $\pi$。


    Math.SQRT1_2: 1 除以 2 的平方根。


    Math.SQRT2: 2 的平方根。


    ## 函数


    Math.abs(x): 返回 x 的绝对值。


    Math.acos(x): 返回 x 的反余弦；返回值在 0 到 $\pi$ 弧度之间。


    Math.asin(x): 返回 x 的反正弦；返回值在 $-\pi/2$ 到 $\pi/2$ 弧度之间。


    ## Math.atan(x)


    返回 $x$ 的反正切；返回值在 $-\pi/2$ 到 $\pi/2$ 弧度之间。


    ## Math.atan2(y, x)


    返回一个 $-\pi$ 到 $\pi$ 弧度之间的值，指定正 X 轴与点之间的逆时针角。


    ## Math.ceil(x)


    返回大于或等于 $x$ 的最近整数。


    ## Math.cos(x)


    返回 $x$ 的余弦。


    ## Math.exp(x)


    返回 $e$ 的 $x$ 次方。


    ## Math.floor(x)


    返回小于或等于 $x$ 的最近整数。


    ## Math.log(x)


    返回 $x$ 的自然对数。


    ## Math.max(args...)


    返回参数中最大的。


    ## Math.min(args...)


    返回参数中最小的。


    ## Math.pow(x, y)


    $x$ 的 $y$ 次方。


    ## Math.random()


    返回一个 0.0 到 1.0 之间的伪随机数。


    ## Math.round(x)


    返回距离 $x$ 的整数。


    ## Math.sin(x)


    返回 $x$ 的正弦。


    ## Math.sqrt(x)


    返回 $x$ 的平方根。


    ## Math.tan(x)


    返回 $x$ 的正切。


    ## 参见下


    Number (数字)


    ## Navigator (导航)


    客户端 JavaScript 1.0


    关于浏览器的信息


    ## 概要


    navigator


    ## 属性


    appName


    一个只读字符串，指定浏览器的昵称。在所有 Netscape 中都是“Mozilla”。在 IE 中也是“Mozilla”。


    appVersion


    一个只读字符串，指定浏览器的版本和平台信息。字符串的第一部分是版本号。将字符串传递给 `parseInt()` 获取主版本号，或传递给 `parseFloat()`
    获取浮点数格式的版本号。字符串的其余部分提供了有关浏览器的其他细节，包括它运行的操作系统。然而，信息的格式在浏览器之间差异很大。


    cookieEnabled


    一个只读布尔值，如果浏览器启用了 cookie 则为 `true`，否则为 `false`。IE 4, Netscape 6。


    language


    一个只读字符串，指定浏览器的默认语言。属性的值是一个标准的双字母代码，例如英语的“en”或法语的“fr”。它也可以是五个字母，表示语言和地区变体，例如加拿大法语的“fr_CA”。Netscape
    4；注意 IE 4 提供了两个语言相关属性。


    platform


    一个只读字符串，指定浏览器运行的操作系统和或硬件平台。虽然此属性没有标准值集，但一些典型值有“Win32”、“MacPPC”和“Linux i586”。JS
    1.2。


    systemLanguage


    一个只读字符串，指定操作系统的默认语言，使用与特定 语言属性相同的标准代码。IE 4。


    userAgent


    一个只读字符串，指定浏览器在 HTTP 请求的 user-agent 请求头中使用的值。通常，这是 `navigator.appName` 的值后跟一个斜杠和
    `navigator.appVersion` 的值。


    userLanguage


    一个只读字符串，指定用户的首选语言，使用与特定 语言属性相同的标准代码。IE 4。


    ## 方法


    ```

    javaEnabled()

    ```


    如果当前浏览器支持并启用了 Java，返回 `true`，否则返回 `false`。JS 1.1。


