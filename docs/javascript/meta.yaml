    普通事件处理程序具有防止事件进一步传播的选项，尽管这种实现方式在每个模型中都是不同的。


    # 事件处理程序注册


    在 W3C 事件模型中，事件处理程序并非简单地赋值给文档对象的属性。相反，文档对象拥有一个 `addEventListener()` 方法，你通过调用该方法为特定类型的事件注册事件处理程序函数。这允许高级应用程序为同一个事件类型注册多个处理程序。


    # JavaScript 安全限制


    出于安全考虑，客户端 JavaScript 实现通常会对脚本可以执行的任务施加限制。最显而易见的限制是省略了危险的能力：例如，客户端 JavaScript
    无法删除用户本地硬盘上的文件。此外还存在其他限制，以防止私有信息泄露或防止脚本骚扰用户。目前没有标准的安全限制集，但以下是典型浏览器实现中常见的限制。不要尝试编写执行这些操作的脚本：即使它们在你的浏览器中可以运行，在其他浏览器中也可能无法工作。


    # 同源策略


    脚本只能读取从同一 Web 服务器加载的窗口和文档的属性。这是对跨窗口脚本的一项重大且普遍的限制，防止脚本从用户正在查看的其他无关文档中读取信息。该限制还防止脚本在无关文档上注册事件处理程序或伪造事件。


    # 文件上传


    脚本无法设置 `FileUpload` 表单元素的 `value` 属性。


    发送邮件和发布新闻

    在没有用户确认的情况下，脚本无法将表单提交到 `mailto:` 或 `news:` URL。


    关闭窗口

    脚本只能关闭其自己创建的浏览器窗口，除非获得用户确认。


    嗅探缓存

    脚本不能加载任何 `about:` URL，例如 `about:cache`。


    隐藏窗口和窗口装饰

    脚本不能创建微小的、离屏的窗口，或没有标题栏的窗口。


    请注意，这个安全限制列表并不是静态的。随着 JavaScript 使用的增长，广告商和不法分子已开始利用它做一些骚人的事情。因此，较新的浏览器（如 Mozilla
    1.0）允许用户可配置的限制，可以防止脚本打开新窗口（如弹出窗口广告），或移动或调整现有窗口的大小。


    # JavaScript API 参考




    本书的其余部分包含了核心和客户端 JavaScript API 的快速参考。它涵盖了遗留的（Level 0）DOM API，并展示了 W3C Level 2
    DOM API 的简化视图。省略了与处理 HTML 文档的 JavaScript 程序无关 API 部分。每个参考条目标题块的右上角包含信息，说明该功能是核心
    API 还是客户端 API 的，并进一步指示了哪个版本的 JavaScript、哪个浏览器或哪个版本的 DOM 引入了该功能。


    由于 JavaScript 是一种弱类型语言，因此 JavaScript API 的类和对象没有官方类名集，它们有时在不同的参考书中以不同的名称出现。（为了简洁起见，本书实际使用的名称集与它的“大哥”《JavaScript:
