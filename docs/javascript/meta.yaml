    The Window object defines the following properties. Non-portable, browser-specific
    properties are listed separately after this list. Note that the Window object
    is the Global object for client-side JavaScript; therefore the Window object also
    has the properties listed on the Global reference page.


    closed

    A read-only boolean value that specifies whether the window has been closed.


    defaultStatus

    A read/write string that specifies a persistent message to appear in the status
    line whenever the browser is not displaying another message.


    document

    A read-only reference to the Document object contained in this window or frame.
    See Document.


    frames[]

    A array of Window objects, for each frame contained within this window. Note that
    frames referenced by the frames[] array may themselves contain frames and may
    have a frames[] array of their own.


    history

    A read-only reference to the History object of this window or frame. See History.


    length

    Specifies the number of frames contained in this window or frame. Same as frames.length.'
