    var s=\"e.value=(new Date()).toLocaleString();\";\nsetInterval(s, 1000); // 每秒运行一次\n\
    </script>\n```\n\n## 表单验证\n\n`<form>` 标签支持 `onSubmit` 事件处理器，它会在用户尝试提交表单时触发。你可以使用此事件处理器执行验证：例如，检查所有必填字段是否已填写。如果\
