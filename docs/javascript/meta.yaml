  md: '# Image rollovers


    The legacy DOM allows you to accomplish one common special effect: dynamically
    replacing one image on the page with another. This is often done for image rollovers,
    in which an image changes when the mouse moves over it. The images[] array of
    the Document object contains Image objects that represent the document''s images.
    Each Image object has a src property that specifies the URL of the image to be
    displayed. To change the image that is displayed, simply set this property to
    a new URL:


