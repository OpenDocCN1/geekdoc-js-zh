    # JavaScript Pocket Reference


    # The JavaScript Language


    JavaScript is a lightweight, object-based scripting language that can be embedded
    in HTML pages. This book starts with coverage of the core JavaScript language,
    followed by material on client-side JavaScript, as used in web browsers. The final
    portion of this book is a quick-reference for the core and client-side JavaScript
    APIs.


    # Syntax


    JavaScript syntax is modeled on Java syntax, Java syntax, in turn, is modeled
    on C and C++ syntax. Therefore, C, C++, and Java programmers should find that
    JavaScript syntax is comfortably familiar.


    # Case sensitivity


    JavaScript is a case-sensitive language. All keywords are in lowercase. All variables,
    function names, and other identifiers must be typed with a consistent capitalization.


    # Whitespace


    JavaScript ignores whitespace between tokens. You may use spaces, tabs, and newlines
    to format and indent your code in a readable fashion.'
  - "[PAGE 11]\n\n# Semicolons\n\nJavaScript statements are terminated by semicolons.\
    \ When a statement is followed by a newline, however, the terminating semicolon\
    \ may be omitted. Note that this place places a restriction on where you may legally\
    \ break lines in your JavaScript programs: you may not break a statement across\
    \ two lines if the first line can be a complete legal statement on its own.\n\n\
    # Comments\n\nJavaScript supports both C and C++ comments. Any amount of text,\
    \ on one or more lines, between /* and */ is comment ignored by JavaScript. Also,\
    \ any text between // and the end of the current line is a comment, and is ignored.\
    \ Examples:\n\n```\n// This is a single-line, C++-style comment.\n/*\n  * This\
    \ is a multi-line, C-style comment.\n  * Here is the second line.\n*/\n/* Another\
    \ comment. */ // This too.\n```\n\n# Identifiers\n\nVariable, function, and label\
    \ names are JavaScript identifiers. Identifiers are composed of any number of\
    \ letters and digits, and and $ characters. The first character of an identifier\
    \ must not be a digit, however. The following are legal identifiers:\n\n```\n\
    i\nmy_variable_name\nv13\n$str\n```\n\n# Keywords\n\nThe following keywords are\
    \ part of the JavaScript language, and have special meaning to the JavaScript\
    \ interpreter. Therefore, they may not be used as identifiers:"
  - '[PAGE 12]


    ```

    break do if switch typeof

    case else in this var

    catch false instanceof throw

    continue finally new true while

    deafault for null try with

    delete function return

    ```


    JavaScript also reserves the following words for possible future extensions. You
    may not use any of these words as identifiers either:


    ```

    abstract int short

    boolean export interface static

    byte extends long super

    char final native synchronized

    class float package throws

    const goto private transient

    debugger implements protected volatile

    double import public

    ```


    In addition, you should avoid creating variables that have the same name as global
    properties and methods: see the Global, Object, and Window reference pages. Within
    functions, do not use the identifier arguments as an argument name or local variable
    name.


    # Variables


    Variables are declared and initialized with the var statement:


    ```

    var i = 1+2+3;

    var x = 3, message = ''hello world'';

    ```


    Variable declarations in top-level JavaScript code may be omitted, but they are
    required to declare local variables within the body of a function.


    JavaScript variables are untyped: they can contain values of any data type.


    Global variables in JavaScript are implemented as properties of a special Global
    object. Local variables within functions are implemented as properties of the
    Argument object for'
  - '[PAGE 13]


    that function. Global variables are visible throughout a JavaScript program. Variables
    declared within a function are only visible within that function. Unlike C, C++,
    and Java, JavaScript does not have block-level scope: variables declared within
    the curly braces of a compound statement are not restricted to that block and
    are visible outside of it.


    # Data Types


    JavaScript supports three primitive data types: numbers, booleans, and strings;
    and two compound data types: objects and arrays. In addition, it defines specialized
    types of objects that represent functions, regular expressions, and dates.


    # Numbers


    Numbers in JavaScript are represented in 64-bit floating-point format. JavaScript
    makes no distinction between integers and floating-point numbers. Numeric literals
    appear in JavaScript programs using the usual syntax: a sequence of digits, with
    an optional decimal point and an optional exponent. For example:


    +   1

    3.14

    0001

    6.02e23


    Integers may also appear in hexadecimal notation. A hexadecimal literal begins
    with 0x:


    ```

    0xFF // The number 255 in hexadecimal

    ```


    When a numeric operation overflows, it returns a special value that represents
    positive or negative infinity. When an operation underflows, it returns zero.
    When an operation such as taking the square root of a negative number yields an
    error or meaningless result, it returns the special value NaN, which represents
    a value that is not-a-number. Use the global function NaN() to test for this value.'
  - '[PAGE 14]


    The Number object defines useful numeric constants. The Math object defines various
    mathematical functions such as Math.sin(), Math.pow(), and Math.random().


    # Booleans


    The boolean type has two possible values, represented by the JavaScript keywords
    true and false. These values represent truth or falsehood, on or off, yes or no,
    or anything else that can be represented with one bit of information.


    # Strings


    A JavaScript string is a sequence of arbitrary letters, digits, and other characters
    from the 16-bit Unicode character set.


    String literals appear in JavaScript programs between single or double quotes.
    One style of quotes may be nested within the other:


    ```

    ''testing''

