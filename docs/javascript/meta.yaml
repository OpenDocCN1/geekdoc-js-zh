    客户端 JavaScript 1.0


    一个图形化选择列表


    继承自：Element


    ## 摘要


    ```

    form.elements[i]

    form.elements[element_name]

    form.element_name

    ```


    ## 属性


    `Select` 对象为 HTML `<select>` 标签的每个属性定义了属性，例如 `disabled`、`multiple`、`name` 和 `size`。此外，它还定义了以下属性：


    ## Select


    form

    包含此 `Select` 对象的 Form 对象。只读。


    length

    一个只读整数，指定 `options[]` 数组中的元素数量。此属性的值与 `options.length` 相同。


    options[]

    `Option` 对象数组，每个对象描述 `Select` 元素内显示的选项之一。你可以通过将 `options.length` 属性设置为较小的值来缩短选项集（或通过设置为零来移除所有选项）。你可以通过将数组中的某个元素设置为
    `null` 来移除单个选项——这将其上方的元素下移，从而缩短数组。你可以使用 `Option()` 构造函数创建一个新的 `Option` 并将其赋值给
    `options[options.length]` 来向 `Select` 对象添加选项。


    selectedIndex

    一个可读/写的整数，指定 `Select` 对象中被选中选项的索引。如果没有选中任何选项，`selectedIndex` 为 -1。如果选中了多个，`selectedIndex`
    指定第一个选项的索引。


    type

    一个只读字符串，指定元素的类型。如果 `Select` 对象仅允许一个，则此属性为“single”；否则为“multiple”。另见 Input。


    ## 方法


    add(new, old)

    将 `new` 插入 `options[]` 中 `old` 之前的位置。如果 `old` 为 `null`，则将 `new` 追加到数组末尾。无返回值。


    blur()

    获取焦点且无返回值。


    remove(n)

    从 `options[]` 中删除第 n 个元素。无返回值。


    ## 事件处理器


    onblur

    失去输入焦点时调用。


    onchange

    当用户选择或取消选择项目时调用。


    onfocus

    获得输入焦点时调用。


