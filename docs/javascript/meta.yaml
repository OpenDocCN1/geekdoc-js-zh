    # Event Handlers


    Event handlers for a Window object are defined by attributes of the <body><body>
    tag of the document.


    onblur

    Invoked when the window loses focus.


    onerror

    Invoked when a JavaScript error occurs. This is a special event handler that is
    invoked with three arguments that specify the error message, the URL of the document
    that contained the error, and the line number of the error, if available.


    onfocus

    Invoked when the window gains focus.


    onload

    Invoked when the document (or frameset) is fully loaded.


    onresize

    Invoked when the window is resized.


    onunload

    Invoked when the browser leaves the current document.


