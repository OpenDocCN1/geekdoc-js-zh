    ## slice(start, end)

    Returns a new string that contains all the characters of string from and including
    start and up to but not including end. If end is omitted, the slice extends to
    the end of the string. Negative arguments specify character positions measured
    from the end of the string. JS 1.2; JavaScript 3.0; ECMA v3.


    ## split(delimiter, limit)

    Returns an array of strings, created by splitting string into substrings at the
    boundaries specified by delimiter. delimiter may be a string or a RegExp. if delimiter
    is a RegExp with a parenthesized subexpression, the delimiter text that matches
    the subexpression is included in the returned array. See also Array.join(). JS
    1.1; JavaScript 3.0; ECMA v1.


    ## substring(from, to)

    Returns a new string that contains characters copied from positions from to to-1
    of string. If to is omitted, the substring extends to the end of the string. Negative
    arguments are not allowed.


    ## substr(start, length)

    Returns a copy of the portion of this string starting at start and continuing
    for length characters, or to the end of the string, if length is not specified.
    JS 1.2; JavaScript 3.0; Non-standard: use slice() or substring() instead.


    ## toLowerCase()

    Returns a copy of the string, with all uppercase letters converted to their lowercase
    equivalent, if they have one.


    ## toUpperCase()

    Returns a copy of the string, with all lowercase letters converted to their uppercase
    equivalent, if they have one.


    ## Static Functions

    String.fromCharCode(c1, c2, ...)

    Returns a new string containing characters with the encodings specified by the
    numeric arguments. JS 1.2; JavaScript 3.0; ECMA v1.


    ## Style

    DOM Level 2; IE 4


    inline CSS properties of an element Inherits From:


    ## Synopsis

    ```

    element.style

    ```


    ## Properties

    The Style object defines a large number of properties: one property for each CSS
    attribute defined by the CSS2 specification. The property names correspond closely
    to the CSS attribute names, with minor changes to avoid syntax errors in JavaScript.
    Multiword attributes that contain hyphens, such as font-family are written without
    hyphens in JavaScript, and each word after the first is capitalized: fontFamily.
    Also, the float attribute conflicts with the reserved word float, so it translates
    to the property cssFloat.


    The visual CSS properties are listed in the following table. Since the properties
    correspond directly to CSS attributes, no individual documentation is given for
    each property. See a CSS reference (such as Cascading Style Sheets: The Definitive
    Guide (O''Reilly)), by Eric A. Meyer) for the meaning and legal values of each.
    Note that current browsers do not implement all of these properties.


    All of the properties are strings, and care is required when working with properties
    that have numeric values. When querying such a property, you must use parseFloat()
    to convert the string to a number. When setting such property you must convert
    your number to a string, which you can usually do by adding the required units
    specification, such as "px".


