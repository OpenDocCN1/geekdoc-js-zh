    \ 998-9938 或 corporate@oreilly.com。\n\n编辑：Paula Ferguson\n制作编辑：Philip Dangler\n\
    封面设计：Edie Freedman\n室内设计：David Fututo\n\n印刷历史：\n1998年10月：第一版\n2002年11月：第二版\n\n\
    Nutshell Handbook、Nutshell Handbook Logo 以及 O'Reilly 标志是 O'Reilly & Associates,\
    \ Inc. 的注册商标。制造商和销售商用于区分其产品的许多标记均被主张为商标。当这些标记出现在书中且 O'Reilly & Associates, Inc.\
    \ 知晓该商标主张时，这些标记以大写或首字母大写打印。犀牛图像与 JavaScript 主题之间的关联是 O'Reilly & Associates, Inc.\
    \ 的商标。\n\n在编写本书时已采取一切措施，但出版商和作者对错误或遗漏，或因使用此处包含的信息而造成的损害不承担责任。\n\n# 目录\n\n- JavaScript\
    \ 语言 1\n- 语法 1\n- 变量 3\n- 数据类型 4\n- 表达式和运算符 9\n- 语句 12\n- 面对象 JavaScript 18\n\
    - 正则表达式 19\n- JavaScript 版本 22\n- 客户端 JavaScript 24\n- HTML 中的 JavaScript 25\n\
    - Window 对象 26\n- Document 对象 32\n- 传统 DOM 33\n- W3C DOM 38\n- IE 4 DOM 43\n-\
    \ DHTML: 脚本 CSS 样式 45\n- 事件和事件处理 47\n- JavaScript 安全限制 51\n- JavaScript API 参考\
    \ 52\n- 锚点 54\n- Applet 54\n- 参数 55\n- 数组 56\n- Attr 58\n- 布尔 58\n- 注释 59\n- DOMException\
    \ 59\n- DOMImplementation 60\n- Date 61\n- Document 65\n- DocumentFragment 71\n\
    - Element 72\n- Error 78\n- Event 78\n- Form 84\n- Function 86\n- Global 87\n\
    - History 89\n- Image 89\n- Input 91\n- Layer 93\n- Link 97\n- Location 99\n-\
    \ Math 99\n- Navigator 102\n- Node 104\n- Number 107\n- Object 109\n- Option 110\n\
    - RegExp 111\n- Screen 113\n- Select 113\n- String 115\n- Style 118\n- Text 119\n\
    - Textarea 120\n- Window 122\n\n# JavaScript 口袋参考\n\n# JavaScript 语言\n\nJavaScript\
    \ 是一种轻量级的基于对象的脚本语言，可以嵌入到 HTML 页面中。本书首先介绍 JavaScript 核心语言，随后介绍在网络浏览器中客户端 JavaScript\
    \ 内容。本书的最后部分是核心和客户端 JavaScript API 的快速参考。\n\n# 语法\n\nJavaScript 语法基于 Java 语法，而\
    \ Java 语法又模仿了 C 和 C++ 语法。因此，C、C++ 和 Java 程序员应该会发现 JavaScript 语法非常熟悉。\n\n# 大小敏感\n\
    \nJavaScript 是一种大小写敏感的语言。所有关键字均为小写。所有变量、函数名和其他标识符必须使用一致的大小写进行输入。\n\n# 空白字符\n\n\
    JavaScript 忽略标记之间的空白字符。你可以使用空格、制表符和换行符来格式化和缩进代码，使其易于阅读。\n\n# 分号\n\nJavaScript\
    \ 语句以分号结束。然而，当语句后面跟着换行符时，可以省略结束的分号。请注意，这限制了你在 JavaScript 程序中合法的换行位置：如果第一行本身可以是一个完整的合法语句，则你不能将一个语句跨行分为两行。\n\
    \n# 注释\n\nJavaScript 支持 C 和 C++ 注释。`/*` 和 `*/` 之间的任意数量文本（跨多行）会被 JavaScript 忽略。此外，`//`\
    \ 到当前行末尾之间的任何文本都是注释，并会被忽略。示例：\n\n```\n// 这是一个单行的 C++ 风格注释。\n/*\n  * 这是一个多行的 C\
    \ 风格注释。\n  * 这是第二行。\n*/\n/* 另一个注释。 */ // 也是。\n```\n\n# 标识符\n\n变量、函数和标签名由字母和数字组成。\n\
    \n# 关键字\n\nJavaScript 保留了以下单词，不能作为标识符使用：\n\n```\nabstract\nbreak\ncase\ncontinue\n\
    class\nconst\ndebugger\ndelete\ndo\ndouble\nelse\nexport\nextends\nfalse\nfinally\n\
    float\nfor\nfunction\nif\ninstanceof\nint\ninterface\nlong\nnew\nnull\npackage\n\
    private\npublic\nreturn\nstatic\nsuper\nswitch\nthis\nthrow\ntry\ntypeof\nvolatile\n\
    while\nwith\n```\n\n# 变量\n\n变量被声明和初始化。在 JavaScript 中，你可以使用 `var` 来声明：\n\n```\n\
    var i = 1\nvar x = 3\nvar message = 'hello';\n```\n\n# 数据类型\n\nJavaScript 支持三种原始类型：数字、布尔和字符串；两种复合类型：对象和数组。\n\
    \n# 数字\n\nJavaScript 中的数字采用双浮点格式表示。JavaScript 不区分整数和浮点数。数字字面量在 JavaScript 程序中使用通常语法出现：数字序列，带有可选的小数点和可选指数。整数也可以以十六进制法出现：\n\
    \n```\n0xFF // 十进制的 255\n```\n\n当数值运算溢出时，它返回一个表示正或负无穷大的特殊值。当运算下溢时，它返回零。当诸如负数的平方根产生错误或无意义的结果时，它返回特殊值\
    \ NaN。使用全局函数 `NaN()` 测试此值。Number 对象定义了有用的数值常量。Math 对象定义了各种数学函数，如 `Math.sin()`、`Math.pow()`\
    \ 和 `Math.random()`。\n\n# 布尔\n\n布尔类型有两个可能，由关键字 `true` 和 `false` 表示。这些值代表真或假、开启或关闭、是或否，或其他任何可以用一个比特表示的内容。\n\
    \n# 字符串\n\nJavaScript 字符串是任意字母、数字以及来自 16 位 Unicode 字符集的序列。字符串字面量出现在 JavaScript\
    \ 程序中，位于单引号或双引号之间。一种引号可以嵌套另一种引号：\n\n```\n'testing'\n\"3.14\"\n'name=\"myform'\n\
    'Wouldn't you prefer O'Reilly's book?'\n```\n\n当反斜字符 (\\) 出现在字符串字面量时，它会改变或转义随后的字符的含义。下表列出了这些特殊转义序列：\n\
    \n| 转义 | 表示 |\n| --- | --- |\n| \\b | 退格 |\n| \\f | 换页 |\n| \\n | 换行符 |\n| \\\
    r | 回车 |\n| \\t | 制表符 |\n| \\' | 撇号或单引号（不终止字符串） |\n| \\\" | 双引号（不终止字符串） |\n| \\\
    \\ | 单个反斜杠字符 |\n\n"
