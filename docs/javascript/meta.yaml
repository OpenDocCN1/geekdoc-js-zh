    \n# # JavaScript\n\n口袋参考\n\n# JavaScript 口袋参考\n\nDavid Flanagan\n\n北京 • 剑桥 • 法纳纳姆\
    \ • 科隆 • 巴黎 • 塞巴斯托尔 • 台北 • 东京\n\n# JavaScript 口袋参考，第二版\nDavid Flanagan\n\n版权 ©\
