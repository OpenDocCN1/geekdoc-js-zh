    \ to separate alternatives. Parenthesized groups have a special behavior: when\
    \ a pattern match is found, the text that matches each group is saved and can\
    \ be referred to by group number. The following table summarizes this syntax.\n\
    \n| Character | Meaning |\n| :--- | :--- |\n| (expression) | Capturing group |\n\
    | (?:expression) | Non-capturing group |\n| a|b | Alternation (match a or b) |\n\
    \n## Anchoring\n\nAnchors are used to match a position within the string rather\
    \ than a character itself.\n\n| Character | Meaning |\n| :--- | :--- |\n| ^ |\
    \ Match the start of the string or line |\n| $ | Match the end of the string or\
