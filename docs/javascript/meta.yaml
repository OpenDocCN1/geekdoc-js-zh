  md: '# Traversing the document tree


    You can traverse IE 4 document tree in much the same way that you can traverse
    a W3C document tree. The difference is in the names of the relevant properties:
    instead of childNodes[], IE 4 uses children[], and instead of parentNode, IE 4
    uses parentElement. IE 4 does not have any analogs tofirstChild, nextSibling,
    and related W3C properties. One important difference between the IE 4 and W3C
    DOMs is that the IE 4 document tree only includes HTML tags: comments are ignored
    and document text is not part of the tree itself. Instead, the text contained
    by any element is available through the innerHTML and innerText properties of
    the element object.We’ll see more about innerHTML in the next section.)


    # Modifying document content and structure


    The nodes of an IE 4 document tree are Element objects that are similar to the
    Element node of the W3C DOM. Like the Element nodes of a W3C document tree, these
    objects have properties that correspond to the attributes of the HTML tags, and
    you can query and set the properties as desired. To change the textual content
    of a document element, set its innerText property to the desired text. This deletes
    any existing tags or text within the element and replaces it with the specified
    text.


    The IE 4 DOM does not have any methods for explicitly creating, inserting, removing,
    or replacing nodes of the document tree. However, it supports the very important
    innerHTML property, which allows you to replace the content of any document element
    with an arbitrary string of HTML. Doing this requires an invocation of the HTML
    parser, making it less efficient than manipulating the nodes directly. On the
    other hand, it is tremendously convenient, so much that Mozilla, Netscape 6 and
    later, and other modern browsers have implemented innerHTML despite the fact that
    it is non-standard.'
