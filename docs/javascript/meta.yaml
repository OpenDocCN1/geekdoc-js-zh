    \ checkAddress() {\nvar f = document.address; // 要检查的表单\n// 遍历所有元素\nfor(var i\
    \ = 0; i < f.elements.length; i++) {\n// 忽略文本输入元素以外的所有元素\nif (f.elements[i].type\
    \ != \"text\") continue;\n// 获取用户的输入\nvar text = f.elements[i].value;\n// 如果未填写，则提示用户\n\
    if (text == null || text.length == 0) {\nalert(\"请填写所有表单字段。\");\nreturn false;\n\
    }\n}\n}\n</script>\n```\n\n## 图片悬停切换 (Image rollovers)\n\n遗留 DOM 允许你完成一种常见的特殊特效：动态用另一张图片替换页面上的图片。这通常用于图片悬停切换，即图片在鼠标移动到其上方时发生变化。Document\
    \ 对象的 `images[]` 数组包含了表示文档图片的 Image 对象。每个 Image 对象都有一个 `src` 属性，用于指定要显示的图片的 URL。要更改显示的图片，只需将此属性设置为新的\
    \ URL 即可：\n\n```\ndocument.images[0].src = \"newbanner.gif\";\n```\n\n要使用此技术进行图片悬停切换，你必须结合在鼠标移动进入和离开图片时触发的\
    \ `mouseover` 和 `mouseout` 事件处理器使用它。以下是带有 JavaScript 事件处理器的基础 HTML 代码，用于实现切换：\n\
    \n```\n<img name=\"button\" src=\"b1.gif\"\nonmouseover=\"document.button.src='b2.gif';\n\
    onmouseout=\"document.button.src='b1.gif';\">\n```\n\n当图片要动态显示时，预先将其加载到浏览器缓存中是有帮助的，这样在它出现之前就不会有网络延迟。你可以通过动态创建一个离屏的\
    \ Image 对象来实现：\n\n```\nvar i = new Image(); // 创建 Image 对象\ni.src=\"b2.gif\";\
    \ // 加载但不显示图片\n```\n\n## 使用 cookie\n\nDocument 对象的 `cookie` 属性是一个特殊的属性，它允许你设置和查询与文档相关的\
    \ cookie。要与文档关联一个瞬态 cookie，只需将 `cookie` 属性设置为如下格式的字符串：\n\n```\n\nname=value\n\
    ```\n\n这将为该文档创建一个具有指定名称和值的 cookie。如果你想创建一个即使用户退出浏览器也会存储的 cookie，请使用如下格式的字符串添加过期日期：\n\
    \nname=value; expires=date\n\n过期日期应该是 `Date.toString()` 返回的格式。如果你希望你网站的其他文档可以访问该\
    \ cookie，可以指定路径前缀：\n\nname=value; expires=date; path=prefix\n\n单个文档可能有多个与其相关的\
    \ cookie。要查询文档的 cookie，只需读取 `cookie` 属性。该字符串包含由分号和空格分隔的多个 `name=value` 字符串。这里是一个获取命名\
    \ cookie 值的函数。它假设 cookie 永远不包含分号。\n\n```\nfunction getCookie(name) {\n  // 将 cookies\
    \ 拆分为数组\n  var cookies = document.cookie.split('; ');\n  for(var i = 0; i < cookies.length;\
    \ i++) {\n    var c = cookies[i]; // 一个 cookie\n    var pos = c.indexOf('=');\
    \ // 找到符号\n    var n = c.substring(0,pos); // 获取名称\n    if (n == name) // 如果匹配\n\
    \      return c.substring(pos+1); // 返回值\n  }\n  return null; // 找不到命名的 cookie\n\
    }\n```\n\n\n W3C DOM 标准化了遗留 DOM 的大部分功能，但也增加了一些重要的新功能。除了支持 `forms[]`、`images[]`\
    \ 以及 Document 对象的其他数组属性外，它还定义了允许脚本访问和操作任何文档元素的方法，而不仅仅是表单和图片等特殊用途元素。\n\n### 通过\
