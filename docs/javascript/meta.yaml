    ## DOMException


    signals DOM errors


    ## Properties


    code

    An error code that provides some detail about what caused the exception. Some
    possible values (and their meanings) for this property are defined by the constants
    listed below.


    ## Constants


    The following constants define the code values that may be encountered when working
    with HTML documents. Note that these constants are static properties of DOMException,
    not properties of individual exception objects.


    DOMException.INDEX_SIZE_ERR = 1

    Out-of-bounds error for an array or string index.


    DOMException.HIERARCHY_REQUEST_ERR = 3

    An attempt was made to place a node somewhere illegal in the document tree hierarchy.


    DOMException.WRONG_DOCUMENT_ERR = 4

    An attempt was made to use a node with a document other than the document that
    created the node.


    DOMException.INVALID_CHARACTER_ERR = 5

    An illegal character was used (in an element name, for example).


    DOMException.NOT_FOUND_ERR = 8

    A node was not found where it was expected.


    DOMException.NOT_SUPPORTED_ERR = 9

    A method or property is not supported in the current DOM implementation.


    DOMException.INUSE_ATTRIBUTE_ERR = 10

    An attempt was made to associate an Attr with an Element when that Attr node was
    already associated with a different Element node.


    DOMException.SYNTAX_ERR = 12

    A syntax error occurred, such as in a CSS property specification.


