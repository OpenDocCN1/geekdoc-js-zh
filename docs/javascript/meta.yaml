    ## 事件处理器


    HTML 文档的元素定义了以下事件处理器，以响应鼠标和键盘事件。元素类型（例如 Form 和 Input 对象）可能会定义更专门的事件处理器（如 onSubmit
    和 onchange），这些处理器会对原始输入事件施加特定的解释。


    - onclick

    当用户点击元素时触发。

    - ondblclick

    当用户双击元素时触发。

    - onhelp

    当用户请求帮助时触发。仅限 IE 。

    - keydown

    当用户按下按键时触发。

    - keypress

    当用户按下并释放按键时触发。

    - keyup

    当用户释放按键时触发。

    - onmousedown

    当用户按下鼠标键时触发。

    - onmousemove

    当用户移动鼠标时触发。

    - onmouseout

    当用户将鼠标移出元素范围时触发。

    - onmouseover

    当用户将鼠标悬停在元素上时触触发。

    - onmouseup

    当用户松开鼠标键时触发。


