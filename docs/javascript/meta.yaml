    ## 属性


    Error 及其所有子类定义了相同的两个属性：


    message

    一个提供异常详细信息的错误对象。该属性持有传递给构造函数的字符串，或由实现定义的默认字符串。


    name

    一个指定异常类型的字符串。该属性始终是用于创建异常对象的构造函数的名称。


    ## 方法


