    - Select 113\n- String 115\n- Style 118\n- Text 119\n- Textarea 120\n- Window\
    \ 122\n\n# JavaScript Pocket Reference\n\n# The JavaScript Language\n\nJavaScript\
    \ is a lightweight, object-based scripting language that can be embedded in HTML\
    \ pages. This book starts with coverage of the core JavaScript language, followed\
    \ by material on client-side JavaScript, as used in web browsers. The final portion\
    \ of this book is a quick-reference for the core and client-side JavaScript APIs.\n\
    \n# Syntax\n\nJavaScript syntax is modeled on Java syntax, Java syntax, in turn,\
    \ is modeled on C and C++ syntax. Therefore, C, C++, and Java programmers should\
    \ find that JavaScript syntax is comfortably familiar.\n\n# Case sensitivity\n\
    \nJavaScript is a case-sensitive language. All keywords are in lowercase. All\
    \ variables, function names, and other identifiers must be typed with a consistent\
    \ capitalization.\n\n# Whitespace\n\nJavaScript ignores whitespace between tokens.\
    \ You may use spaces, tabs, and newlines to format and indent your code in a readable\
    \ fashion.\n\n# Semicolons\n\nJavaScript statements are terminated by semicolons.\
    \ When a statement is followed by a newline, however, the terminating semicolon\
    \ may be omitted. Note that this place places a restriction on where you may legally\
    \ break lines in your JavaScript programs: you may not break a statement across\
    \ two lines if the first line can be a complete legal statement on its own.\n\n\
    # Comments\n\nJavaScript supports both C and C++ comments. Any amount of text,\
    \ on one or more lines, between /* and */ is comment ignored by JavaScript. Also,\
    \ any text between // and the end of the current line is a comment, and is ignored.\
    \ Examples:\n\n```\n// This is a single-line, C++-style comment.\n/*\n  * This\
    \ is a multi-line, C-style comment.\n  * Here is the second line.\n*/\n/* Another\
    \ comment. */ // This too.\n```\n\n# Identifiers\n\nVariable, function, and label\
    \ names are composed of letters and digits.\n\n# Keywords\n\nJavaScript reserves\
    \ the following words which cannot be used as identifiers:\n\n```\nabstract\n\
    break\ncase\ncontinue\nclass\nconst\ndebugger\ndelete\ndo\ndouble\nelse\nexport\n\
    extends\nfalse\nfinally\nfloat\nfor\nfunction\nif\ninstanceof\nint\ninterface\n\
    long\nnew\nnull\npackage\nprivate\npublic\nreturn\nstatic\nsuper\nswitch\nthis\n\
    throw\ntry\ntypeof\nvolatile\nwhile\nwith\n```\n\n# Variables\n\nVariables are\
    \ declared and initialized. In JavaScript, you may use `var` to declare:\n\n```\n\
    var i = 1\nvar x = 3\nvar message = 'hello';\n```\n\n# Data Types\n\nJavaScript\
    \ supports three primitive types: numbers, booleans, and strings; and two compound\
    \ types: objects and arrays.\n\n# Numbers\n\nNumbers in JavaScript are represented\
    \ in 64-bit floating-point format. JavaScript makes no distinction between integers\
    \ and floating-point numbers. Numeric literals appear in JavaScript programs using\
    \ the usual syntax: a sequence of digits, with an optional decimal point and optional\
    \ exponent. Integers may also appear in hexadecimal notation:\n\n```\n0xFF //\
    \ The number 255 in hexadecimal\n```\n\nWhen a numeric operation overflows, it\
    \ returns a special value that represents positive or negative infinity. When\
    \ an operation underflows, it returns zero. When an operation such as the square\
    \ root of a negative number yields an error or meaningless result, it returns\
    \ the special value NaN. Use the global function NaN() to test for this value.\
    \ The Number object defines useful numeric constants. The Math object defines\
    \ various mathematical functions such as Math.sin(), Math.pow(), and Math.random().\n\
    \n# Booleans\n\nThe boolean type has two possible values, represented by the keywords\
    \ true and false. These values represent truth or falsehood, on or off, yes or\
    \ no, or anything else that can be represented with one bit of information.\n\n\
    # Strings\n\nA JavaScript string is a sequence of arbitrary letters, digits, and\
    \ other characters from the 16-bit Unicode character set. String literals appear\
    \ in JavaScript programs between single or double quotes. One style of quotes\
    \ may be nested within the other:\n\n```\n'testing'\n\"3.14\"\n'name=\"myform'\n\
    'Wouldn't you prefer O'Reilly's book?'\n```\n\nWhen backslash character (\\) appears\
    \ within a string literal, it changes, or escapes, the meaning of the character\
    \ that follows it. The following table lists these special escape sequences:\n\
    \n| Escape | Represents |\n| \\b | Backspace |\n| \\f | Form feed |\n| \\n | Newline\
    \ |\n| \\r | Carriage return |\n| \\t | Tab |\n| \\' | Apostrophe or single quote\
    \ that does not terminate the string |\n| \\\" | Double-quote that does not terminate\
    \ the string |\n| \\\\ | Single backslash character |\n"
