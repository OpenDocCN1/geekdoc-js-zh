- md: '

    Image constructor creates an off-screen Image object that cannot be displayed.
    The width and height arguments are optional. Setting the src attribute of the
    resulting object causes the browser to preload an image into cache.


    # Properties


    The Image object defines properties for each of the attributes of the HTML `<img>`
    element, such as src, border, width, height, vspace, and hspace. In addition,
    it defines or provides special behavior for the following properties:


    - *complete*: false if the image is still loading, true if it has finished loading
    or if there was an error while loading. Read-only.

    - *src*: A read/write string that specifies the URL of the image to be displayed
    by the browser. This property simply mirrors the src attribute of the `<img>`
    tag, but is detailed here because many important HTML effects are created by dynamically
    setting the src property of an Image object, to replace one image with another.


    # Event Handlers


    Image inherits event handlers from Element and also defines the following:


    - *onabort*: Invoked if the user aborts the download of an image.

    - *onerror*: Invoked if an error occurs while downloading the image.

    - *onload*: Invoked when the image successfully finishes loading.


    # Input


    Client-side JavaScript 1.0


    a form input element


    Inherits From: Element


    # Synopsis


    ```

    form.elements[i]

    form.elements[name]

    form.name

    ```


    # Properties


    The Input object defines properties for each of the attributes of the HTML `<input>`
    tag, such as maxLength, readOnly, size, and tabIndex. In addition, it defines
    the following properties:


    - *checked*: A read/write boolean that specifies whether an input element of type
    "checkbox" or "radio" is checked (true) or not (false).

    - *checked*: A boolean that specifies whether an input element of type "checkbox"
    or "radio" is checked when first created or when it is reset to its initial state.

    - *defaultValue*: A string that specifies the text that appears in an input element
    of type "text" or "password" when it is first created or when it is reset to its
    initial state. For security reasons, this property does not affect input elements
    of type file.

    - *form*: A read-only reference to the Form object that contains the element.
    This property is defined for input elements of all types.

    - *name*: The name of this input element, as specified by the HTML name attribute.
    This property is defined for input elements of all types.

    - *type*: A string that specifies the type of the form element. This property
    mirrors the HTML type attribute. Legal values are listed in the following table;
    the default is text. Submit and Textarea objects also have a type property, with
    possible values select-one, select-multiple, and textarea. JS 1.1.


    | Type | Description |

    | --- | --- |

    | "button" | Push button |

    | "checkbox" | Checkbox element |

    | "file" | File upload element |

    | "hidden" | Hidden element |

    | "image" | Graphical form submit button |

    | "password" | Masked text entry field |

    | "radio" | Mutually-exclusive radio button |

    | "reset" | Form reset button |

    | "text" | Single-line text entry field |

    | "submit" | Form submission button |


    - *value*: The string value that is sent when the form is submitted. For input
    elements of type "text", "password", and "file", this is the editable text displayed
    in the element. You can set this property to change displayed text. For input
    elements of type "button", "submit", and "reset", value is the label that appears
    in the button. For other types, the value string is not displayed. Note that for
    security reasons, the value property of elements of type "file" is usually read-only.


    # Methods


    - *blur()*: Yields the keyboard focus and returns nothing. Defined for all element
    types except "hidden".

    - *click()*: Simulates a mouse click on the form element and returns nothing.
    Defined for button element types: "button", "checkbox", "radio", "reset", and
    "submit".

    - *focus()*: Takes the keyboard focus and returns nothing. Defined for all element
    types except "hidden".

    - *select()*: Selects the text that appears in the element and returns nothing.
    Works for elements of type "text", "password", and "file". Also defined by the
    Textarea object.


    # Event Handlers


    - *onblur*: Invoked when the element loses keyboard focus. Defined for all element
    types except "hidden".

    - *onchange*: For text-entry elements of type "text", "password", and "file",
    this event handler is invoked when the user changes the displayed text and then
    transfers keyboard focus away from the element, signaling that text entry is complete.
    It is not invoked for each keystroke.

    - *onclick*: For button elements of type "button", "checkbox", "radio", "reset",
    and "submit", this event handler is invoked when the user clicks the button. Return
    false to prevent form submission or reset for elements of type "submit" and "reset",
    respectively.

    - *onfocus*: Invoked the element gains keyboard focus. Defined for all element
    types except "hidden".


    # See Also


    Form, Option, Select, Textarea


    # Layer


    An independent document layer


    # Synopsis


    ```

    document.layers[i]

    document.layers[layer-name]

    document.layer-name

    ```


    # Constructor


    ```

    new Layer(width, parent_layer)

    ```


    # Description


    The Layer object is supported only in Netscape 4 and was discontinued in Netscape
    6.


    # Properties


    - *above*: The layer above this, if any. Read-only.

    - *below*: The layer below this, if any. Read-only.

    - *background*: The background image of the layer.

    - *bgColor*: The background color of the layer.

    - *height*: The height of the layer.

    - *left*: The X-coordinate of this layer, relative to the containing layer or
    document.

    - *name*: The name of the layer.

    - *layers[]*: An array that contains any Layer objects of this layer.

    - *parentLayer*: A read-only reference to the Layer object that contains (is the
    parent of) this layer.

    - *src*: A read-write string that specifies the URL, if any, of the contents of
    a layer. Setting this property to a new URL causes the browser to read the contents
    of that URL and display them in the layer.

    - *visibility*: A read-write string that specifies the visibility of the layer.
    The three legal values are: "show", "hide", and "inherit".

    - *window*: The Window object that contains the layer, regardless of how deeply
    nested the layer is within other layers.

    - *x, y*: The X and Y-coordinates of the layer. x is a synonym for the left property
    and y is a synonym for the top property.

    - *zIndex*: The position of the layer in the z-order, or stacking order, of layers.
    When two layers overlap, the one with the higher zIndex appears on top and obscures
    the one with the lower zIndex. If two sibling layers have the same zIndex, the
    one that appears later in the layers[] array of the containing document is displayed
    later and overlaps the one that appears earlier.


    # Methods


    - *load(src, width)*: Loads a new URL into the layer, sets the layer width, and
    returns nothing.

    - *moveAbove(other_layer)*: Moves this layer above another and returns nothing.

    - *moveBelow(other_layer)*: Moves this layer below another and returns nothing.

    - *moveToBy(dx, dy)*: Moves the layer relative to its current position and returns
    nothing.

    - *moveTo(x, y)*: Moves the layer to the point (x,y) relative to its containing
    layer or window and returns nothing.

