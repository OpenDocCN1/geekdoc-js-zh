    URL。第二个是窗口的可选名称。如果已经存在同名的窗口，则会重用它，而不会创建新窗口。第三个参数是一个可选的字符串，用于指定新窗口的大小以及它应该显示的特性（或外框，chrome）。例如：


    ```

    // 打开一个新窗口

    w = open("new.html", "newwin", // URL 和名称

    "width=400,height=300," + // 大

    "location,menubar," + // 外框

    "resizable,scrollbars,status,toolbar");

    w.close();

    ```


    注意，大多数浏览器仅允许脚本关闭自己打开的窗口。此外，由于最近 Web 上讨厌弹出广告的泛滥，某些浏览器完全不允许脚本打开新窗口。


    # 多个窗口和帧（frames）


    如前所述，Window 对象的 `open()` 方法允许你创建由新 Window 对象表示的新浏览器窗口。脚本运行的窗口是该脚本的全局对象，你可以像使用它们是全局定义的一样使用该
    Window 对象的所有属性和方法。然而，当运行在一个窗口中的脚本需要控制或与另一个窗口交互时，你必须显式指定该 Window 对象：


    ```

    // 创建新窗口并对其进行操作

    var w = open("newdoc.html");

    w.alert("Hello new window");

    w.setInterval(scroll(0,1),50);

    ```


    HTML 允许单个窗口拥有多个帧（frames）。许多网页设计师选择避免使用帧，但它们仍然相当常用。JavaScript 将每个帧视为一个独立的 Window
    对象，不同帧中的脚本独立运行。Window 对象的 `frames` 属性是一个 Window 对象数组，表示窗口的子帧：


    ```

    // 帧中的脚本通过这种方式引用帧：

    frames[0].location = "frame1.html";

    frames[1].location = "frame2.html";

    // 对于嵌套帧，你可以使用：

    frames[1].frames[2].location = "frame2.3.html";

    // 帧中的代码引用顶层窗口：

    top.status = "Hello from the frame";

    ```


    Window 对象的 `parent` 属性指向包含它的浏览器窗口或窗口。`top` 属性指向位于帧层次结构根节点的顶层帧或窗口。如果 Window 对象代表的是顶层窗口而非帧，那么
