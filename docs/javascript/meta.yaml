  md: '# Other Titles Available from O''Reilly


    # Web Programming


    ActionScript for Flash MX:

    The Definitive Guide, 2nd Edition


    By Colin Moock

    2nd Edition November 2002 (est.)

    904 pages (est.), ISBN 0-596-00396-X


    This is the only, up-to-date reference available for the latest version of ActionScript,
    Macromedia''s programming language for Flash. The book''s language reference alone
    has nearly doubled from the first edition, with over 250 new classes, objects,
    methods, and properties! Hundreds of new code examples show Flash MX techniques
    in the real world—how to draw circles, save data to disk, convert arrays to onscreen
    tables, create reusable components, load variables, XML and sounds.


    Programming ColdFusion MX, 2nd Edition

    By Rob Brooks-Wilson

    2nd Edition November 2002 (est.)

    1000 pages (est.), ISBN 0-596-00380-3


    This exhaustive resource covers everything from ColdFusion basics to advanced
    topics, so not only is the book ideal for intermediate developers—with topics
    on sharing application data and accessing databases—ColdFusion MX continues to
    be a one-stop clearinghouse for techniques for the most seasoned ColdFusion developers.
    Topics include advanced database techniques, working with the Verity search engine,
    interacting with data sources such as LDAP directories, creating custom tags,
    integrating ColdFusion with Flash, and calling external objects.


    JavaScript: The Definitive Guide,4th Edition


    By David Flanagan

    4th Edition November 2001

    936 pages, ISBN 0-596-00048-0


    To stay on top of their work, web professionals need the most up-to-date, complete
    reference available on the core JavaScript language, which is growing more and
    more essential for effective web design and development. This new edition covers
    JavaScript 1.5, the latest version of the language. The book''s comprehensive
    reference section documents every object, property, method, event handler, function
    and constructor used by client-side JavaScript.


    HTTP: The Definitive Guide


    By Brian Toby & David Gourley

    Majorie Mayer, Anshu Aggarwal & Sailor Reddy

    1st Edition September 2002 (est.)

    700 pages (est.), ISBN 1-56592-509-2


    HTTP: The Definitive Guide gives a complete and detailed description of the HTTP
    protocol and how it shapes the landscape of the Web. It doesn''t stop at a simple
    listing of the HTTP methods and headers, and explains HTTP in the context of the
    web technologies that it supports. This is a book that every serious web programmer
    will need on his or her shelf.


    ![](img/c595610b738444dc06a09036110543e5_138_0.png)


    To order: 800-998-9938 • order@oreilly.com • www.oreilly.com

    Online editions of most O''Reilly titles are available by subscription at safari.oreilly.com

    Also available at most retail and online bookstores.'
