    ## Boolean


    a wrapper object for boolean values


    ## Constructor


    new Boolean(value)

    Boolean(value)


    Invoked as a function, without the new operator, Boolean() converts value to a
    boolean value (not a Boolean object) and returns it. All values convert to true
    except for 0, NaN, null, undefined, and the empty string, "". When invoked with
    the new operator, the Boolean() constructor performs the same conversion and wraps
    the result in a Boolean object.


