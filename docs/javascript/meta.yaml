    \n## Lookahead and Lookbehind\n\nLookahead and lookbehind are types of assertions\
    \ that match a position based on the surrounding text.\n\n| Character | Meaning\
    \ |\n| :--- | :--- |\n| (?=...) | Positive lookahead |\n| (?!...) | Negative lookahead\
    \ |\n| (?<=...) | Positive lookbehind |\n| (?<!...) | Negative lookbehind |\n"
