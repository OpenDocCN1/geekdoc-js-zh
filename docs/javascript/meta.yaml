    ,\n1000);\n```\n\n## 动态表单\n\n正如我们看到的，Form  `elements[]` 数组包含了表示表单输入元素的对象。这些许多对象都具有你可以用于查询或设置显示在表单元素中的值的属性。这提供了动态更改文档内容的另一种方法。例如，以下代码设置\
