  md: '# Creating Applications with Mozilla


    # PHP Cookbook


    By David Boswell, Brian King, Ian Oeschger, Pete Collins & Eric Murphy

    1st Edition September 2002 (est.)

    480 pages (est.), ISBN 0-59600052-9


    By David Sklar & Adam Trachtenberg

    1st Edition October 2002

    500 pages, ISBN 1-56592-681-1


    This book is designed for anyone interested in learning more about what Mozilla
    is and how to create applications using Mozilla technologies. Already applications
    such as Netscape 6, ActiveState''s Komodo, Jabberzilla and others have taken advantage
    of Mozilla''s unique abilities as a development framework. After reading this
    book you will be able to take advantage of this framework for your own applications.


    This cookbook has a wealth of solutions for problems that PHP programmers face
    regularly. With topics ranging from beginner to advanced web programming techniques,
    the PHP Cookbook contains practical examples—or “recipes”—for any programmer or
    web designer using the scripting language to generate dynamic web content. With
    each recipe, the authors include a discussion that explains the logic and concepts
    underlying the solution.


    # Web Database Applications with PHP & MySQL


    # Programming PHP


    By Hugh E. Williams & David Lane

    1st Edition March 2002

    582 pages, ISBN 0-596-00041-3


    By Rasmus Lerdorf & Kevin Tatroe

    1st Edition March 2002

    528 pages, ISBN 1-56592-610-2


    This book offers both theoretical and practical guidance for creating web database
    applications. The detailed information on designing relational databases and the
    web application architectures that interact with them will be especially useful
    to readers who have worked with built database-backed web sites before. The book
    implements a sample web application using PHP and MySQL on the Apache platform.


    Programming PHP is a comprehensive guide to PHP, a simple yet powerful language
    for creating dynamic web content. Filled with the unique knowledge of the creator
    of PHP, Rasmus Lerdorf, this book is a detailed reference to the language and
    its applications, including such topics as form processing, sessions, databases,
    XML, and graphics. Covers PHP 4, the latest version of the language.'
