    ## Select


    Client-side JavaScript 1.0


    a graphical selection list


    Inherits From: Element


    ## Synopsis


    ```

    form.elements[i]

    form.elements[element_name]

    form.element_name

    ```


    ## Properties


    The Select object defines properties for each of the attributes of the HTML <select>
    tag, such as disabled, multiple, name, and size. In addition, it defines the following
    properties:


    ## Select


    form

    The Form object that contains this Select object. Read-only.


    length

    A read-only integer that specifies the number of elements in the options[] array.
    The value of this property is the same as options.length.


    options[]

    array of Option objects, each describing one of the options displayed within the
    Select element. You can shorten the set of options by setting the options.length
    property to a smaller value (or remove all options by setting it to zero). You
    can remove individual options by setting an element of the array to null—this
    shifts the elements above it down, shortening the array. You can append options
    to the Select object by using the Option() constructor to create a new Option
    and assigning it to options[options.length].


    selectedIndex

    A read/write integer that specifies the index of the selected option within the
    Select object. If no option is selected, selectedIndex is -1. If more than one
    is selected, selectedIndex specifies the index of the first option.


    type

    A read-only string that specifies the type of the element. If Select object allows
    only, this property is “single”. Otherwise, it is “multiple”. See also Input.


    ## Methods


    add(new, old)

    Inserts new into options[] at the position before old. If old is null, new is
    appended to the array. Returns nothing.


    blur()

    Grabs the focus and returns nothing.


    remove(n)

    Removes the nth element from options[]. Returns nothing.


    ## Event Handlers


    onblur

    Invoked when input focus is lost.


    onchange

    Invoked when the user selects or deselects an item.


    onfocus

    Invoked when input focus is gained.


