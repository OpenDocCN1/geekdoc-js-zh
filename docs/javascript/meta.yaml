    JavaScript APIs. It covers the legacy (Level 0) DOM API, and presents a simplified
    view of the W3C Level 2 DOM API. Portions of API not relevant to JavaScript programs
    working with HTML documents have been omitted. The upper-right corner of the title
    block for each reference entry contains information that states whether a feature
    is part of the core or client-side API, and further indicates which version of
    JavaScript, which browsers, or which version of the DOM introduced the feature.'
