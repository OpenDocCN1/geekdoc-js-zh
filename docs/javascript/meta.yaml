    \n## Literal characters\n\nLetters, numbers, and most other characters are literals\
    \ in a regular expression: they simply match themselves. As we will see in the\
    \ sections that follow, however, there are a number of punctuation characters\
    \ and escape sequences (beginning with \\) that have special meanings. The simplest\
    \ of these escape sequences provide alternative ways of representing literal characters:\n\
    \n| Character | Meaning |\n| :--- | :--- |\n| \\n, \\r, \\t | Match literal newline,\
    \ carriage return, tab |\n| \\,, /, \\*, \\+, \\?, etc. | Match a punctuation\
    \ character literally, ignoring or escaping its special meaning |\n| \\xnn | The\
    \ character with hexadecimal encoding nn. |\n| \\xxxx | The Unicode character\
    \ with hexadecimal encoding xxxx. |\n\n## Character classes\n\nRegular expression\
    \ syntax uses square brackets to represent character sets or classes in a pattern.\
    \ In addition, escape sequences define certain commonly-used character classes,\
    \ as shown in the following table.\n\n| Character | Meaning |\n| :--- | :--- |\n\
    | [...] | Match any one character between brackets |\n| [^...] | Match any one\
    \ character not between brackets |\n| . | Match any character other than newline\
    \ |\n\n| Character | Meaning |\n| :--- | :--- |\n| \\w, \\W | Match any word/non-word\
    \ character |\n| \\s, \\S | Match any whitespace/non-whitespace |\n| \\d, \\D\
    \ | Match any digit/non-digit |\n\n## Repetition\n\nThe following table shows\
    \ regular expression syntax that controls the number of times that a match may\
    \ be repeated.\n\n| Character | Meaning |\n| :--- | :--- |\n| ? | Optional term;\
    \ Match zero or one time |\n| + | Match previous term one or more times |\n| *\
    \ | Match previous term zero or more times |\n| {n} | Match previous term exactly\
    \ n times |\n| {n,} | Match previous term n or more times |\n| {n,m} | Match at\
    \ least n but no more than m times |\n\nIn JavaScript 1.5, any of the repetition\
    \ characters may be followed by a question mark to make them non-greedy, which\
    \ means they match as few repetitions as possible while still allowing the complete\
    \ pattern to match.\n\n## Grouping and alternation\n\nRegular expressions use\
    \ parentheses to group subexpressions, just as mathematical expressions do. Parentheses\
    \ are useful, for example, to allow a repetition character to be applied to an\
