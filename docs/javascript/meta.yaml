    Client-side JavaScript 1.0; DOM Level 1


    an HTML document Inherits From: Node (in DOM Level 1)


    # Synopsis


    window.document document


    # Description


    The Document object represents an HTML document and is one of the most important
    objects in client-side JavaScript. It was introduced in JavaScript 1.0, and a
    number of methods and properties were added in JavaScript 1.1. Netscape and Internet
    Explorer each add non-standard methods and properties to the Document object,
    and the W3C DOM standardizes additional properties and methods.


    # Common Properties


    All implementations of the Document object support the following properties. This
    list is followed by separate lists of properties defined by the W3C DOM Document
    object and by the IE 4 and Netscape 4 Document objects.


    - A string that specifies the color of activated links. Deprecated.


    - anchors[]

    An array of Anchor objects, one for each anchor that appears in the document.
    JS 1.2.


    - applets[]

    An array of Applet objects, one for each applet that appears in the document.
    JS 1.1.


    - bgColor

    A string that specifies the background color of the document. Deprecated.


    - cookie

    A string-valued property with special behavior that allows the cookies associated
    with this document to be queried and set.


    - domain

    A string that specifies the Internet domain the document is from. Used for security
    purposes. JS 1.1.


    - embeds[]

    An array of objects that represent data embedded in the document with the <embed>
    tag. A synonym for plugins[]. Some plugins and ActiveX controls can be controlled
    with JavaScript. The API depends on the specific control. JS 1.2


    - fgColor

    A string that specifies the default text color for the document. Deprecated.


    - forms[]

    An array of Form objects, one for each HTML form that appears in the document.


    - images[]

    An array of Image objects, one for each image that is embedded in the document
    with the HTML <img> tag. JS 1.1.


    - lastModified

    A read-only string that specifies the date of the most recent change to the document
    (as reported by the web server). JS 1.0.


    - linkColor

    A string that specifies the color of unvisited links. Deprecated.


    - links[]

    An array of Link objects, one for each hypertext link that appears in the document.


    - location

    The URL of the document. Deprecated in favor of the URL property.


    - plugins[]

    A synonym for the embeds[ ] array. JS 1.1.


    - referrer

    A read-only string that contains the URL of the document, if any, from which the
    current document was linked.


    - title

    The text contents of the <title> tag. Read-only prior to DOM Level 1.


    - URL

    A read-only string that specifies the URL of the document. JS 1.1.


    - vlinkColor

    A string that specifies the color of visited links. Deprecated.


    # W3C DOM Properties


    In DOM-compliant browsers, the Document object inherits the properties of Node,
    and defines the following additional properties.


    - body

    A reference to the Element object that represents the <body> tag of this document.


    - defaultView

    The Window in which the document is displayed. Read-only. DOM Level 2.


    - documentElement

    A read-only reference to the <html> tag.


    - implementation

    The implementation object that represents the document.


    # IE 4 Properties


    The following non-standard (and portable) properties are defined by Internet Explorer
    4:


    - activeElement

    A read-only reference to the element that is currently active.


    - all[]

    An array of all elements in the document, regardless of position.


    - charset

    The character set of the document.


    - children[]

    An array of direct children of the document.


    - defaultCharset

    The default character set of the document.


    - readyState

    Specifies the loading status of the document.


    - loading

    The document is loading.


    - interactive

    The document has loaded sufficiently for the user to interact with.


    - complete

    The document has completely loaded.


    - height

    The height, in pixels, of the document.


    - layers[]

    An array of Layer objects that represents the layers contained within the document.
    This property is only available in Netscape 6.


    - parentWindow

    The window that contains the document.


    - uninitialized

    The document has not started loading.


    - width

    The width, in pixels, of the document.


    # Common Methods


    All implementations of the Document object support the following methods. This
    list is followed by separate lists of methods defined by the W3C DOM standard
    and by the IE 4 and Netscape 4 Document objects.


    - clear()

    Eases the contents of the document and returns nothing. This method is deprecated
    in JavaScript 1.1.


    - close()

    Closes a document stream opened with open() and returns nothing. JS 1.0.


    - open()

    Deletes existing document content and opens a stream to which new document contents
    may be written. Returns nothing. JS 1.0.


    - write(value, ...)

    Inserts the specified string or strings into the document currently being parsed
    or appends to document opened with open(). Returns nothing. JS 1.0.


    - writ(value, ...)

    Identical to write(), except it appends a newline character to the output. Returns
    nothing. JS 1.0


    # W3C DOM Methods


    In DOM-compliant browsers, the Document object inherits the methods of Node, and
    defines the following additional methods.


    - createAttribute(name)

    Returns a newly-created Attr node with the specified name.


    - createComment(text)

    Creates and returns a new Comment node containing the specified text.


    - createDocumentFragment()

    Creates and returns an empty DocumentFragment node.


    - createElement(tagName)

    Creates and returns a new Element node with the specified tag name.


    - createTextNode(text)

    Creates and returns a new Text node that contains the specified text.


    - getElementById(id)

    Returns the Element of this document that has the specified value for its id attribute,
    or null if no such Element exists in the document.


    - getElementsByName(name)

    Returns an array of nodes of all elements in the document that have a specified
    value for their name attribute. If no such elements are found, returns a zero-length
    array.

