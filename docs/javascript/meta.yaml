    \  var t = document.getElementById(\"title\");\n</script>\n```\n\n### 通过标签名查找元素\n\
    \n访问文档元素的另一种方法是通过标签名查找它们。Document 对象的 `getElementsByTagName()` 方法返回一个该类型元素的数组。每个文档元素也支持相同的方法，因此你也可以获取特定元素后代的特定类型标签的数组：\n\
    \n```\n// 获取所有 <ul> 标签的数组\nvar lists = document.getElementsByTagName(\"ul\");\n\
    // Find第二个 <ul> 中的第 3 个 <li>\nvar item = lists[1].getElementsByTagName(\"li\"\
    )[2];\n```\n\n### 遍历文档树\n\nW3C DOM 将每个文档表示为树。树的节点代表组成文档的 HTML 标签、文本字符串和 HTML 注释。树的每个节点由一个\
    \ JavaScript 对象表示，每个节点都有允许遍历树的属性，代码片段所示：\n\n```\n// 在文档中查找节点\nvar n = document.getElementById(\"\
    mynode\");\nvar p = n.parentNode; // 父标签\nvar c0 = n.firstChild; // n 的第一个子节点\n\
    ```\n\n"
