    Attr, Comment, Document, DocumentFragment, Element, Text


    # Number


    Core JavaScript 1.1; JavaScript 1.79; 2.0; ECMA v1


    support for numbers


    # Constructor


    ```

    new Number(value)

    Number(value)

    ```


    With the new operator, the Number constructor converts its argument to a numeric
    value and returns a Number object wrapped around that value. Without new, Number()
    is a function that converts its argument to a number and returns that value.


    # Constants


    Number.MAX_VALUE

    The largest representable number. Approximately 1.79e308.


    Number.MIN_VALUE

    The smallest representable number. Approximately 5e-324.


    Number.NaN

    Not-a-number value. Same as global NaN.


    Number.NEGATIVE_INFINITY

    Negative infinite value.


    Number.POSITIVE_INFINITY

    Infinite value. Same as global Infinity.


    # Methods


    ### toExponential(digits)

    Returns a string representation of the number, in exponential notation, with one
    digit before the decimal place and digits after the decimal place. The fractional
    part of the number is rounded, padded with zeros so it has the specified length.
    digits if omitted, as many digits as necessary.


    ### toFixed(digits)

    Returns a string representation of the number that does not use exponential notation,
    and has exactly digits after the decimal place. digits must be between 0 and 20.
    The number is rounded or padded with zeros if necessary.


    ### toLocaleString()

    Returns an implementation-dependent string representation of the number, formatted
    according to local. This may affect things like punctuation characters used for
    the decimal point and the thousands separator.


    ### toPrecision(precision)

    Returns a string representation of number that contains precision significant
    digits. precision must be between 1 and 21. The returned string uses fixed-point
    notation where possible, or exponential notation otherwise. The number is rounded
    or padded with zeros if necessary.


    ### toString(radix)

    Converts a number to a string, using a specified radix (base), and returns the
    string. radix must be between 2 and 36. If omitted, base 10 is used.


    # See Also


    Math


    # Object


    the superclass of all JavaScript objects


    # Constructor


    ```

    new Object();

    ```


    This constructor creates an empty object to which you can add arbitrary properties.


    # Properties


    All JavaScript objects, however ever they are created, have the following properties.


    - constructor A reference to the JavaScript function that was the constructor
    for the object. JS 1.1; JavaScript 2.0; ECMA v1.


    # Methods


    All JavaScript objects, however ever they are created, have the following methods.


    - hasOwnProperty(propname) Returns true if the object has a non-inherited property
    with the specified name. Returns false if the object does not have a property
    with the specified name, or if it inherits from its prototype object. JS 1.5;
    JavaScript 5.5; ECMA v3.


    - isPrototypeOf(a) Returns true if this is the prototype of a. Returns false if
    a is not an object or if this object is not its prototype. JS 1.5; JavaScript
    5.5; ECMA v3.


    - propertyIsEnumerable(propname) Returns true if this object has a non-inherited
    enumerable property with the specified name, and returns false otherwise. Enumerable
    properties are those that are enumerated by for/in loops. JS 1.5; JavaScript 5.5;
    ECMA v3.

