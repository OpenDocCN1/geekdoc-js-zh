    # Description


    The Layer object is supported only in Netscape 4 and was discontinued in Netscape
    6. It is entirely non-standard, but is documented here because it provides the
    only way to work with dynamically positioned objects in Netscape 4. Any HTML element
    with a CSS position attribute of absolute is represented by a Layer object in
    JavaScript. You can also create layers with the non-standard <layer> tag, or with
    the Layer() constructor.


