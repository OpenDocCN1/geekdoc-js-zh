    Form, Input, Node, Select, Textarea


    ## Error


    Core JavaScript 1.5; JavaScript 5.5; ECMA v3

    Inherits From: Object


    predefined exception types


    ## Constructor


    - new Error(message)

    new EvalError(message)

    new RangeError(message)

    new ReferenceError(message)

    new SyntaxError(message)

    new TypeError(message)

    new URIError(message)


    These constructors create an instance of the Error class or of one of its subclasses.
    The message argument is optional.


    ## Properties


    Error and all of its subclasses define the same two properties:


    message

    An error that provides details about the exception. This property holds the string
    passed to the constructor, or an implementation-defined default string.


    name

