    An array of Form objects representing the forms in a document.


    +   images[]

    An array of Image objects representing the images that appear in a document.


    +   applets[]

    An array of objects that represent the Java applets embedded in a document. JavaScript
    can actually be used to script Java and control these applets, but doing so is
    beyond the scope of this pocket reference.


    +   links[]

