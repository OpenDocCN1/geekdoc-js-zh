    With the new operator, it is a constructor that wraps the converted value in a
    String object.


    ## Properties


    ```

    length

    ```

    The number of characters in the string. Read-only.


    ## Methods


    ```

    charAt(n)

    ```

    Returns the character at position n in the string.


    charCodeAt(n)

    Returns the Unicode encoding of the character at position n in the string. JS
    1.2; JavaScript 5.5; ECMA v1.


    concat(value, ...)

    Returns a new string that results from converting each of arguments to a string
    and concatenating the resulting strings. JS 1.2; JavaScript 3.0; ECMA v3.


    indexOf(substring, start)

    Returns the position of the first occurrence of substring within this string that
    appears at after the start position or -1 if no such occurrence is found. If start
    is omitted, 0 is used.


    lastIndexOf(substring, start)

    Returns the position of the last occurrence of substring within string that appears
    before the start position, or -1 if no such occurrence is found. If start is omitted,
    the string length is used.


    match(regexp)

    Matches this string against the specified regular expression returns an array
    containing the match results or null if found. If regexp is not a global regular
    expression, the returned array is the same as for the RegExp.exec() method. If
    regexp is global (has the "g" attribute), the elements of the returned array contain
    the text of each match found. JS 1.2; JavaScript 3.0; ECMA v3.


    replace(regexp, replacement)

    Returns a new string, with text matching regexp replaced with replacement. regexp
    may be a regular expression or a plain string. replacement may be a string, containing
    optional regular expression escape sequences (such as $1) that are replaced with
    portions of the matched text. It may also beafunction that computes the replacement
    string based on match details passed as arguments. JS 1.2; JavaScript 3.0; ECMA
    v3.


    search(regexp)

    Returns the position of the start of the first substring of string that matches
    regexp, or -1 if no match was found. JS 1.2; JavaScript 3.0; ECMA v3.

