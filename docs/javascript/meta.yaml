    ```


    To use this technique for an image rollover, you must use it in conjunction with
    the mouseover and mouseout event handlers that are triggered when the mouse moves
    on and off of the image. Here is some basic HTML code with JavaScript event handlers
    to accomplish a rollover:


    ```

    <img name="button" src="b1.gif"

    onmouseover="document.button.src=''b2.gif'';

    onmouseout="document.button.src=''b1.gif'';">

    ```


    When an image is going to be dynamically displayed, it is helpful to preload it
    into the browser cache so that there is no network delay before it appears. You
    can do this with a dynamically created off-screen Image object:


    ```

