    \ JavaScript code typically have a .js extension. Note that the </script> tag\
    \ is still required when this attribute is used:\n\n```\n<script src=\"library.js\"\
    ></script>\n```\n\nHTML allows scripts to be written in languages other than JavaScript,\
    \ and some browsers, such as Internet Explorer, support such as VBScript. You\
    \ can use the language attribute to specify what language a script is written\
