    ## getElementsByTagName(tagName)


    Returns an array of all Element nodes in this document that have the specified
    tag name. The Element nodes appear in the returned array in the same order they
    appear in the document source.


    ## importNode(importedNode, deep)


    Creates and returns a copy of a node from some other document that is suitable
    for insertion into this document. If the deep argument is true, it recursively
    copies the children of the node too. DOM Level 2.


