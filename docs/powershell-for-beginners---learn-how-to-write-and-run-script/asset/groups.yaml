    \ There are some variables for your assistance:\n\n```\n$name = 'Jon'\n$number\
    \ = 12345\n$location = 'Charlotte'\n$listofnumbers = 6,7,8,9\n$my_last_math_grade\
    \ = 'D+'\n```\n\nYou should declare all variables with dollar sign and use any\
    \ name for variable without any space in the name. You have to give space followed\
    \ by equal sign and then give another space.\n\nIf you want to have text in the\
    \ value of a variable, you should add one single quote on both sides of your text.\
    \ You have to declare one variable without writing value and reserve the particular\
    \ name. It proves helpful in the center of the better than at other time.\n\n\
    You can add output of cmdlet and t is one code moniker to refer the simple bit\
    \ of your .net-based code and you can use to execute it to return the result.\
    \ If you want to list all procedures, you can use Get-Process command and the\
    \ Get-PSSnapin cmdlet display current PowerShell snap-in to activate new functionality.\
    \ If you want to calculate the actual number of cmdlets on your system, you can\
    \ use:\n\n```\n$(get-command).count\n```\n\nYou can declare one variable to store\
    \ and it is known as:\n\n```\n$numberofcmdlets\n```\n\nYou have to store the output\
    \ in the variable of .count entry:\n\n```\n$numberofcmdlets = (get-command).count\n\
    ```\n\nPowerShell helps you find out the present value of a particular variable\
    \ and write its name in the prompt:\n\n![](img/dcd30329fa29a8abe29fc8f78488dd81_30_0.png)\n\
    \nThis variable can be used as a part of anything else. For instance, look at\
    \ the cmdlet writehost to simply script the text to particular screen of hosting\
    \ machine in the PowerShell session. The Write-Host may have one of proficiencies,\
    \ but in simple manner, as:\n\n```\nWrite-Host \"Whatever text I want, as long\
    \ as it is inside double quotes.\"\n```\n\nYou can copy this line in the window\
    \ of PowerShell and you want to see the results. If you want the integration of\
    \ variables with the Write-Host, you can write a dollar sign, such as:\n\n```\n\
    Write-Host \"There are $numberofcmdlets available for use on this system.\"\n\
    ```\n\nYou will get this from the PowerShell:\n\n![](img/dcd30329fa29a8abe29fc8f78488dd81_30_1.png)\n\
    \n## Phase 02: Do-White, If/Then and forEach\n\nIn the next phase, you will do\
    \ some amazing magic, such as you have to store the value of variables.\n\n###\
    \ If/Then\n\nThe simple form to make a decision in the PowerShell is the special\
    \ if/then mechanism. It is called if/then construct in PowerShell. It works in\
    \ the particular way, such as:\n\nIf you want to do comparison of something with\
