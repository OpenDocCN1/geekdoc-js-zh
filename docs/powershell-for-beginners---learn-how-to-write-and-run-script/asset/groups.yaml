    \ you have to do something without question, you should make a new loop and cover\
    \ it in bit. It will be good to practice these braces on the line. You can match\
    \ them on the place where you want to write complicated scripts. If you are interested\
    \ to compare two numbers, 5 and 10, the PowerShell should display that 10 is greater\
    \ than 5 and you can write this script in the following way:\n\n```\nIf (10 -gt\
    \ 5)\n{\n  Write-Host \"Yes\"\n}\n```\n\nIf you want to run the prompt of PowerShell,\
    \ you will get:\n\n![](img/dcd30329fa29a8abe29fc8f78488dd81_31_0.png)\n\nIf you\
    \ want to make functional construct with more nests, you can try this:\n\n```\n\
    If (10 -gt 11)\n{\n  Write-Host \"Yes\"\n} else (11 -gt 10)\n{\n  Write-Host \"\
    This time, yes\"\n}\n```\n\nIt will be easy to follow everyone and see the results:\n\
    \n```\nPS:\\Users\\Jonathan> If (10 -gt 11)\n>> {\n  Write-Host \"Yes\"\n>> else\
    \ (11 -gt 10)\n>> {\n  Write-Host \"This time, yes\"\n>> }\n>> This time, yes\n\
    PS:\\Users\\Jonathan>\n```\n\nYou can get different output with different values\
    \ and names. It will be an easy way to manage functional scripts. If you want\
    \ bunch blocks in your script, you can establish different conditions. You can\
    \ select different blocks, but there is an example to make your work easy:\n\n\
    ```\nIf (10 -gt 11)\n{\n    Write-Host \"Yes\"\n}\nelse if (11 -lt 10)\n{\n  \
    \  Write-Host \"This time, yes\"\n}\nelse if (20 -gt 40)\n{\n    Write-Host \"\
    Third time was a charm\"\n}\nelse {\n    Write-Host \"You're really terrible at\
    \ math, aren't you?\"\n}\n```\n\nYou can run this construct and get this result:\n\
    \n![](img/dcd30329fa29a8abe29fc8f78488dd81_33_0.png)\n\n### Do While Examples\n\
    \n```\n$numbers = 1\n```\n\nLet's set up a simple Do While construct that adds\
    \ 1 to whatever is already in that variable, until the variable has the number\
    \ 10 in it.\n\n```\nDo {\n    $numbers = $numbers + 1\n    Write-Host \"The current\
    \ value of the variable is $numbers\"\n} While ($numbers -lt 10)\n```\n\nRun this\
    \ script and your resultant command will be:\n\n```\nPS:\\Users\\Jonathan> $numbers\
    \ = 1\nPS:\\Users\\Jonathan> Do {\n  $numbers += 1\n  Write-Host \"The current\
    \ value of the variable is $numbers\"\n}\nWrite($numbers)\nThe current value of\
    \ the variable is 2\nThe current value of the variable is 3\nThe current value\
    \ of the variable is 4\nThe current value of the variable is 5\nThe current value\
    \ of the variable is 6\nThe current value of the variable is 7\nThe current value\
    \ of the variable is 8\nThe current value of the variable is 9\nThe current value\
    \ of the variable is 10\nPS:\\Users\\Jonathan>\n```\n\nYou can set up one do while\
    \ you use your commands for execution:\n\n```hell\nWhile ($numbers -lt 10) {\n\
    \    $numbers = $numbers + 1\n    Write-Host \"The current value of the variable\
    \ is $numbers\"\n}\n```\n\nYou can notice difference among image management in\
    \ before and after versions. All Windows PowerShell’s version enables images to\
    \ carefully share the layers. For instance, you can grab one image to share similar\
    \ layers of image as one image and it may be already pulled. The daemon Windows\
    \ PowerShell can recognize this and pulls the required layers out of their stored\
    \ location. The second pull proves helpful to pull images with common features\
    \ and layers.\n\nThis illustration can help you, just start with 15.04 Ubuntu\
    \ image that you have recently pulled and make some changes into it to build a\
    \ new image. You can use Windows PowerShell build or Windows PowerShell command\
    \ to make your work easy.\n\nYou can optimize resources by sharing them and people\
    \ often do this impulsively in their life. For instance, Joseph and Jane are twins\
    \ calculating calculus at separate times from separate teachers. They can share\
    \ their exercise book by passing it to each other. Jane has to complete the homework\
    \ on the 11th page his book. Now, the original exercise book can be changed and\
    \ only Jane can copy this page.\n\nCopy-on-write strategy is simple for copying\
    \ and sharing. This strategy enables system (that requires similar data) processes\
    \ the data instead of getting their own copy. At a particular point, if one procedure\
    \ requires some modification to write data, only the procedure that should be\
    \ written will copy the data. All other procedures will be continuing to the use\
    \ of actual data.\n\nWindows PowerShell requires copy-on-write technology with\
    \ containers and image. This strategy can optimize the performance of your container\
    \ and disk space. In the next\n"
  mdcn: "\n\n# 第 5 章 脚本的命令与过程\n\n脚本的命令和过程是 PowerShell 的基础。你可以利用框架的优势创建脚本，并添加一些条件使其具有逻辑性。PowerShell\
    \ 脚本是扩展名为 .ps1 的特殊文本文件。如果你想创建一个脚本，你必须在记事文件中按照特定的顺序输入一组命令。你可以将其保存为 .ps1，且名称应该是一个易于描述且不带任何空格的名字。如果你想运行\
    \ PowerShell 脚本，可以进入 PowerShell 窗口。\n\n你必须输入包含特定脚本文件夹名称和文件名的完整路径，例如：\n\n```\n\
    c:\\powershell\\myscript.ps1\n```\n\n如果脚本位于当前目录，控制台可以使用一个点和一个反斜杠，例如：\\myscript.ps1。\n\
    在 PowerShell 中创建一个脚本并没有什么特殊之处。你可以根据自己的喜好添加命令。脚本管理员通常多年来使用登录脚本，以便在每次登录时根据用户的需要配置环境和桌面。随着技术的发展，任何内容都可以实现脚本化，从在服务器上对系统的裸机安装到服务器上的工作负载。它还包括文件服务器角色或安装\
    \ Exchange。\n\n为了编写脚本，涵盖几个元素至关重要，并且有几个阶段可以提供帮助：\n\n## 01 阶段：变量\n\n此阶段对于以一致的方式制作脚本非常重要。这种脚本将使你的重复工作更容易。你可以使用相同的命令执行相似的操作。变量被称为容器，你可以使用它们来存放单词、数字、值和任何内容。这些变量前面总有一个美元符号。有一些变量可以提供帮助：\n\
    \n```\n$name = 'Jon'\n$number = 12345\n$location = 'Charlotte'\n$listofnumbers\
    \ = 6,7,8,9\n$my_last_math_grade = 'D+'\n```\n\n你应该用美元符号声明所有变量，并使用任何不含空格的名称。你必须给一个空格，后面跟着等号，然后再给另一个空格。\n\
    \n如果你想让变量的值包含文本，应该在文本的两边加上一个单引号。你可以在不写值的情况下声明一个变量并预留特定的名称。这在需要更好的时候比在其他时候更有帮助。\n\
    \n你可以添加 cmdlet 的输出，`t` 是一个用于引用你的 .net 代码中简单部分的代码别名，你可以使用它来执行并返回结果。如果你想列出所有过程，可以使用\
    \ `Get-Process` 命令，而 `Get-PSSnapin` cmdlet显示当前的 PowerShell snap-in 以激活新功能。如果你想计算系统上\
    \ cmdlet 的实际数量，可以使用：\n\n```\n$(get-command).count\n```\n\n你可以声明一个变量来存储，它被称为：\n\
    \n```\n$numberofcmdlets\n```\n\n你必须将输出存储在 `.count` 条目的变量中：\n\n```\n$numberofcmdlets\
    \ = (get-command).count\n```\n\nPowerShell 帮助你找到特定变量的当前值，并在提示符中输入它的名称：\n\n![](img/dcd30329fa29a8abe29fc8f78488dd81_30_0.png)\n\
    \n这个变量可以作为任何其他内容的一部分。例如，看 `writehost` cmdlet，它可以简单地将文本脚本到 PowerShell 会话中托管主机的特定屏幕。`Write-Host`\
    \ 可能具有某种精通，但以简单的方式，如下：\n\n```\nWrite-Host \"Whatever text I want, as long as it\
    \ is inside double quotes.\"\n```\n\n你可以将这一行复制到 PowerShell 窗口中并查看结果。如果你想将变量与 `Write-Host`\
    \ 集成，可以写一个美元符号，例如：\n\n```\nWrite-Host \"There are $numberofcmdlets available for\
    \ use on this system.\"\n```\n\n你将从 PowerShell 得到这个：\n\n![](img/dcd30329fa29a8abe29fc8f78488dd81_30_1.png)\n\
    \n## 02 阶段：Do-White, If/Then 和 forEach\n\n在下一阶段，你将执行一些神奇的操作，例如你必须存储变量的值。\n\n###\
    \ If/Then\n\n在 PowerShell 中做出决策的简单形式是特殊的 if/then 机制。它在 PowerShell 中被称为 if/then\
    \ 结构。它的工作方式如下：\n\n如果你想对某物进行比较并带有 `else`，可以使用 `with` 命令。你可以通过括号帮助进行格式化，并在新行写一个大括号。添加\
    \ cmdlet 或执行操作很容易，如果此操作为真，你可以在新行写上一个大括号。你必须涵盖以下几点，例如应该有 False 或 True。如果你必须在没有任何疑问的情况下执行某事，你应该创建一个新循环并将其包含在位中。在行上练习这些大括号会很好。你可以在想要编写复杂脚本的地方匹配它们。如果你对比较两个数字\
