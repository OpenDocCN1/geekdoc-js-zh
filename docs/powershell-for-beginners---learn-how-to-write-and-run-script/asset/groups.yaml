    ## Introduction


    PowerShell including PowerShell Core and Windows PowerShell is a configuration
    management and task automation framework. It is offered from Microsoft and has
    allied scripting language and one command-line shell built on .NET Framework.


    It provides complete access to WMI and COM, permitting administrators to execute
    administrative activities on both remote and local Windows system and CIM and
    WS-Management enabling the excellent management of remote network devices and
    Linux systems. Initially, one Windows component, the PowerShell was created cross-platform
    and open-source on 18th August 2016.


    In the PowerShell, the administrative chores are typically performed by command-lets
    (cmdlets) and are particular .NET classes executing a specific operation. The
    cmdlets sets can be united into scripts and executable that are standalone applications
    and by instantiating steady .NET classes or COM/WMI objects.


    They often work by retrieving data in various stores of data, such as registry
    or file systems that are available to the runtime PowerShell through providers
    of PowerShell. It provides one API hosting and the PowerShell runtime may be embedded
    in various other applications.


    These apps use the functionality of PowerShell to implement particular operations,
    such exposed via graphic interface. This ability is used by the servers of Microsoft
    to expose the functionality of management because cmdlets of PowerShell and providers
    implement the tools of graphical management as the hosts of PowerShell. It may
    invoke the essential cmdlets.


