    ## Chapter 2 – Getting Started with Your PowerShell


    The PowerShell of Windows is one Windows command-line shell and it is designed
    especially for the system administrators. The PowerShell has one interactive prompt
    and one scripting environment that can be used in combination or independently.


    Unlike other shells that return and accept text, the PowerShell of windows is
    often built on the top of .Net Framework common language runtime (CLR) and .NET
    Framework returns and accepts the objects of .Net Framework. This important change
    in environment transports the whole set of new methods and tools to configure
    and manage windows.


    The PowerShell of Windows often introduces the actual concept of the cmdlet and
    single function command-line tool in the shell. You can utilize every cmdlet separately
    and their power can be realized as you use simple tools with complex tasks. The
    PowerShell of Windows has more than 100 basic cmdlets and you may write your own
    cmdlets and share these cmdlets with others.


    Similar to various others, the PowerShell of Windows offer access to the file
    system on your computer. The providers of Windows PowerShell enable you to get
    to the data stores, such as certificate stores of digital signature are easy to
    access with the file system.


    This guide will help you to learn about Windows PowerShell and cmdlets language,
    utilization of objects and the providers. You will find the requirements of system
    there along with particular features, including CIM commands, integrated scripting
    (ISE) environment and the workflows.


    ## Requirements for Operating System


    The 4.0 PowerShell runs on the latest Windows version:


    - The Windows 8.1, by default installation.

    - 2012 of Windows Server R2, by default installation.

    - Windows 07 and its 01 service pack, you will install the 4.0 Framework of Windows
    to run updated PowerShells.

    - 2008 Windows Server and R2 with the 01 Service Pack, you have to install the
    4.0 Management Framework of windows to get latest 4.0 PowerShell.


    The 3.0 PowerShell versions are available for the given varieties of Windows:


    - By default installation of Windows 8

    - 2012 Windows installation


    ## Framework of Microsoft .NET Requirements


    - If you want to use Windows 4.0 PowerShell, you should have a complete installation
    of the 4.5 .NET Framework of the Microsoft. The windows 8.1 and the 2012 server
    R2 have 4.5 .NET Framework for Microsoft by default.


    - The 3.0 PowerShell of windows requires complete installation of the .NET Framework
    0.4. The Server 2012 and Windows 8 have 4.5 .NET Framework of Windows by default;
    it should fulfill all important requirements.


    - If you want to install the 4.5 .NET Framework of Microsoft (dotNetFx45_Full_exe),
    you can get this from the download center of Microsoft.


    - To install the full installation of Microsoft .NET Framework 4 (dotNetFx40_Full_exe),
    you can get framework from the download center of Microsoft.


    ## WS-Management


    The 3.0 and 4.0 PowerShell of Windows requires 3.0 WS-Management that supports
    WSMan protocol and WinRM service. This program may be included in the 8.1 Windows
    and server R2 2012, Server 2012 and Windows 8 and the 4.0 Framework of Windows
    management and 3.0 Framework of Windows Management.


    ## Instrumentation 3.0


    The 3.0 and 4.0 Windows PowerShell requires the proper management of WMI 3.0 instrumentation.
    You can get this program in 2012 server of Windows and Windows 8.1 or advanced,
    R2, Server 2012 and Windows 8, the 4.0 Management Framework. You may not be able
    to access program on your computer, the features may require WMI and the CIM command
    may not run.


    The 3.0 and 4.0 PowerShell of Windows may be complied against the CLR 4.0 (common
    linguistic runtime).


    ## Graphical User-Interface Requirements


    The PowerShell of Windows is based on console applications that may not require
    any graphical user-interface. It is suitable for the computers without monitors,
    user interface and screens, as R2 server 2012 or Windows 2012 server. There are
    some items that are required for the graphical user interface.


    - Incorporated Scripting Environment of Windows PowerShell (ISE)

    - Cmdlets

    - 1. Out-GridView

    - 2. Show-Command

    - 3. Show-ControlPanel

    - 4. Show-EventLog

    - Structures

    - 1. Get-Help cmdlet ShowWindow structure.

    - 2. Register-PSSessionConfiguration, Set-PSSessionConfiguration cmdlets and ShowSecurityDescriptorUI.


    ## Engine Requirements for Windows PowerShell


    It is compatible with the PowerShell 3.0 along 2.0 versions. The cmdlets providers,
