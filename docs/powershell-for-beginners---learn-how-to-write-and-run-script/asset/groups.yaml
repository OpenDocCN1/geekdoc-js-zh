    .NET Framework 构建了联合脚本语言和一种命令行 shell。


    它提供了对 WMI 和 COM 的完全访问，允许管理员在远程和本地 Windows 系统上执行管理活动，并支持 CIM 和 WS-Management，实现了对远程网络设备和
    Linux 系统的卓越管理。最初，作为 Windows 组件的 PowerShell 于 2016 年 8 月 18 日以跨平台开源的形式创建。


    在 PowerShell 中，管理任务通常由命令令（cmdlets）执行，它们是执行特定操作的特殊 .NET 类。cmdlet 组可以结合成脚本和可执行文件（即独立应用程序），并通过实例化稳定的
    .NET 类或 COM/WMI 对象来运行。


    它们通常通过从各种数据存储（如注册表或文件系统）中检索数据来工作，这些数据通过 PowerShell 提供程序供运行时环境可以使用。它提供了一个 API 托管，PowerShell
    运行时可以嵌入到各种其他应用程序中。


    这些应用程序使用 PowerShell 的功能来实现特定的操作，例如通过图形界面暴露的功能。微软服务器使用这种能力来暴露管理功能，因为 PowerShell
    的 cmdlet 和提供者作为 PowerShell 的宿主实现了图形化管理工具。它可以调用核心的 cmdlet。


