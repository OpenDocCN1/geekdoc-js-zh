    \ window of PowerShell.\n\nYou have to write the complete directory containing\
    \ name of folder and file of the particular script, such as:\n\n```\nc:\\powershell\\\
    myscript.ps1\n```\n\nIf the script is located in the present directory and the\
    \ console may use one period and backslash, such as: \\myscript.ps1.\nThere is\
    \ no special thing to create one script in the PowerShell. You can add commands\
