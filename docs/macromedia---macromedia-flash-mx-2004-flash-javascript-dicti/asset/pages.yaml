  md: '# flash object


    Availability


    Flash MX 2004.


    Description


    The flash object represents the Flash application.


    # Method summary for the flash object


    The following methods can be used with the flash object.


    | Method | Description |

    | --- | --- |

    | fl1.browseFileURL() | Opens a File Open or Save system dialog box and lets the
    user specify a file to be opened or saved. |

    | fl1.closeAll() | Closes all open documents, displaying the Save As dialog box
    for any documents that were not previously saved. |

    | fl1.closeDocument() | Closes the specified document. |

    | fl1.createDocument() | Opens a new document and selects it. |

    | fl1.enableImmediateUpdates() | Lets the script developer enable immediate visual
    updates of the Timeline when executing effects. |

    | fl1.fileExists() | Checks whether a file already exists on. |

    | fl1.findDocumentIndex() | Finds the index of an open document with the specified
    name. |

    | fl1.getDocumentDOM() | Retrieves the DOM (Document object) of the currently
    active document |

    | fl1.mapPlayerURL() | Maps an escaped Unicode URL to a UTF-8 or MBCS URL. |

    | fl1.openDocument() | Opens a Flash (FLA) document for editing in a new Flash
    window and gives it the focus. |

    | fl1.openProject() | Opens a Flash Project (FLP) file in the author tool for
    editing. |

    | fl1.openScript() | Opens a script (JSFL, AS, ASC) or other file (XML, TXT) in
    the Flash text editor. |

    | fl1.quit() | Quits Flash, prompting the user to save any changed documents.
    |

    | fl1.reloadEffects() | Reloads all effects descriptors in the user''s Configuration
    Effects folder. |

    | fl1.reloadTools() | Rebuilds the toolbar from the toolconfig.xml. Used only
    when creating extensible tools. |

    | fl1.revertDocument() | Reverts the specified FLA document to its last saved
    version. |

    | fl1.runScript() | Executes a JavaScript file. |

    | fl1.saveAll() | Saves all open documents, displaying the Save As dialog box
    for any documents that were not previously saved. |

    | fl1.saveDocument() | Saves the specified document as a FLA document. |'
