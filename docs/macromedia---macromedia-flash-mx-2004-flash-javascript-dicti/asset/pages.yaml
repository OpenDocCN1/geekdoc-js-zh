  md: '# library object


    Availability


    Flash MX 2004.


    Description


    The library object represents the Library panel. It is a property of the Document
    object (see document.library) and can be accessed by f1.getDocumentDOM().library.


    The library object contains an array of items of different types, including symbols,
    bitmaps, sounds, and video.


    # Method summary for the library object


    The following methods are available for the library object:


    | Method | Description |

    | --- | --- |

    | library.addItemToDocument() | Method adds the current or specified item to the
    Stage at the specified position. |

    | library.addNew() | Method creates a new item of the specified type in the Library
    panel and sets the new item to the currently selected item. |

    | library.deleteItem() | Method deletes the current items or specified item from
    the Library panel. |

    | library.duplicateItem() | Method makes a copy of the currently selected or specified
    item. |

    | library.editItem() | Method opens the currently selected or specified item in
    Edit mode. |

    | library.expandFolder() | Method expands or collapses the currently selected
    or specified folder in the library. |

    | library.findIndex() | Method returns the library item''s index value (zero-based).
    |

    | library.getProperty() | Method gets the property for the selected item. |

    | library.getType() | Method gets the type of object currently selected or specified
    by a library path. |

    | library.getSelectedItems() | Method gets an array of all currently selected
    items in the library. |

    | library.importEmbeddedSWF() | Method imports a Shockwave (SWF) file into the
    library as a compiled clip. |

    | library.itemExists() | Method checks to see if a specified item exists in the
    library. |

