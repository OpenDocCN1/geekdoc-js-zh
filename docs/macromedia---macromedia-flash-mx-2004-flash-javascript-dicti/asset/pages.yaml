    an instance of a movie that has been converted to a compiled clip library item.


    # Property summary for the CompiledClipInstance object


    In addition to the properties of the Instance object, the CompiledClipInstance
    has the following properties:


    | Property | Description |

    | --- | --- |

    | compiledClipInstance.accName | Property: a string that is equivalent to the
    Name field in the Accessibility panel. |

    | compiledClipInstance.actionScript | Property: a string that represents the ActionScript
    for this instance; equivalent to symbolInstance.actionScript. |

    | compiledClipInstance.description | Property: a string that is equivalent to
    the Description field in the Accessibility panel. |

    | compiledClipInstance.forceSimple | Property: a Boolean value that enables and
