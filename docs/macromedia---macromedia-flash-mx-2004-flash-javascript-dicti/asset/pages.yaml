    edge.setControl( index, x, y )


    Parameters


    +   index specifies which control point to set. Use values 0, 1, or 2 to specify
    the beginning, middle, and end control points, respectively.


    +   x A floating point value that specifies the horizontal location of the control
    point. If the Stage in Edit or Edit-in mode, the point coordinate is relative
    to the edited object. Otherwise, the point coordinate is relative to the Stage.


