  md: '# Parameters


    boundingRectangle A rectangle object that specifies the new size within which
    the text item should flow.


    # Returns


    A Boolean value: true if the size of at least one text field is changed; false
    otherwise.


    # Description


    Method; changes the bounding rectangle for the selected text item to the specified
    size. This method causes the text to reflow inside the new rectangle; the text
    item is not scaled or transformed. If the text is horizontal and static, the method
    takes into account only the width of the rectangle (the height is automatically
    computed to fit all text). If the text is vertical, the method takes into account
    the height of the rectangle (the width is automatically computed to fit all text).
    If the text is dynamic or input, the method is limited by the width and height
    of the rectangle, but the text field is constrained to fit all text.


