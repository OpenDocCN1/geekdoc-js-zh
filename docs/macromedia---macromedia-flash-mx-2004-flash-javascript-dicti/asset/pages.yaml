  md: '# drawingLayer object


    # Availability


    Flash MX 2004.


    # Description


    The drawingLayer object is accessible from JavaScript as a child of the flash
    object. The drawingLayer object is useful for extended tools when the user wants
    to temporarily draw dragging—for example, when creating a selection masque. You
    should call `drawingLayer.beginFrame()` before you call any other drawingLayer
    methods.


    # Method summary for the drawingLayer object


    The following methods are available for the drawingLayer object:


    | Methods | Description |

    | --- | --- |

    | drawingLayer.beginDraw() | Method: puts Flash in drawing mode. |

    | drawingLayer.beginFrame() | Method: erases what was previously drawn using the
    drawingLayer and prepares for more drawing commands. |

    | drawingLayer.cubicCurveTo() | Method: draws a cubic curve from the current pen
    location using the parameters as the coordinates of the cubic segment. |

    | drawingLayer.curveTo() | Method: draws a quadratic curve segment starting at
    the current drawing position and ending at a specified point. |

    | drawingLayer.drawPath() | Method: draws the specified path. |

    | drawingLayer.endDraw() | Method: exits drawing mode. |

    | drawingLayer.endFrame() | Method: signals the end of a group of drawing commands.
    |

    | drawingLayer.lineTo() | Method: draws a line from the current drawing position
    to the point (x,y). |

    | drawingLayer.moveTo() | Method: sets the current drawing position. |

    | drawingLayer.newPath() | Method: returns a new Path object |

    | drawingLayer.setColor() | Method: sets the color of subsequently drawn data.
    |


    # drawingLayer.beginDraw()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    drawingLayer.beginDraw([persistentDraw])

    ```'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Parameters


    persistentDraw A Boolean value (optional). If set to true, it indicates that the
    drawing in the last frame remains on the Stage until a new beginDraw() or beginFrame()
    is called. (In this context, frame refers to where you start and end drawing;
    it does not refer to Timeline frames). For example, when users draw a rectangle,
    they can preview the outline of the shape while dragging the mouse. If you want
    preview shape to remain after the user releases the mouse button, set persistentDraw
    to true.


    # Returns


    Nothing.


    # Description


    Method; puts Flash in drawing mode. Drawing mode is for temporary drawing while
    the mouse button is put. You typically use this method only when creating extensible
    tools.


    # Example


    The following example puts Flash in drawing mode:


    ```

    fl.drawingLayer.beginFrame();

    ```


    # drawingLayer.beginFrame()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    drawingLayer.beginFrame();

    ```


    # Parameters


    None.


    # Returns


    Nothing.


    # Description


    Method; erases what was previously drawn using the drawingLayer.beginFrame() and
    prepares for more drawing commands. Should be called after drawingLayer.beginDraw().
    Everything drawn between drawingLayer.beginFrame() and an drawingLayer.endFrame()
    remains on the Stage until you call the next beginFrame() and endFrame(). (In
    this context, frame refers to where you start and end drawing; it does not refer
    to Timeline frames). You typically use this method only when creating extensible
    tools.'
