- img_proc: true
  md: '# Parameters


    startFrameIndex A zero-based index that specifies the beginning of a range of
    frames to paste. If you omit startFrameIndex, the method uses the current selection.
    This parameter is optional.


    endIndex A zero-based index that specifies the frame at which to stop pasting
    frames. The method pastes up to, but not including, endIndex. If you specify only
    startFrameIndex, endIndex defaults to the startFrameIndex value. This parameter
    is optional.


    # Returns


    Nothing.


    # Description


    Method; pastes the range of frames from the Clipboard to the specified frames.


    # Example


    The following example pastes the frames on the Clipboard to the currently selected
    frame or playback location:


    ```

    fl.getDocumentDOM().getTimeline().pasteFrames();

    ```


    The following example pastes the frames on the Clipboard at Frame 2 up to, but
    not including, Frame 10 (remember that index values are different from frame number
    values):


    ```

    fl.getDocumentDOM().getTimeline().pasteFrames(1, 9);

    ```


    The following example pastes the frames on the Clipboard starting at Frame 5:


    ```

    fl.getDocumentDOM().getTimeline().pasteFrames(4);

    ```


    # timeline.removeFrames()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    timeline.removeFrames([startFrameIndex, endIndex])

    ```


    # Parameters


    startFrameIndex A zero-based index that specifies the first frame at which to
    start removing frames; if there is no selection, if you omit startFrameIndex,
    the method uses the current selection; all frames at the current head on all layers
    are removed. This parameter is optional.


    endIndex A zero-based index that specifies the frame at which to stop removing
    frames; the range of frames goes up to, but does not include, endIndex. If you
    specify only startFrameIndex, endIndex defaults to the startFrameIndex value.
    This parameter is optional.


    # Returns


    Nothing.'
