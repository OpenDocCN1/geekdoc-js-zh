    # # BitmapInstance object


    Inheritance Element object > Instance object > BitmapInstance object


    Availability


    Flash MX 2004.


    Description


    The BitmapInstance object is a subclass of the Instance object and represents
    a bitmap in a frame.


    # # Method summary for the BitmapInstance object


    In addition to the Instance object methods, you can use the following methods
    with the BitmapInstance object:


    | Method | Description |


    | bitmapInstance.getBits() | Method; lets you create bitmap effects by getting
    the bits out of the bitmap, manipulating them, and returning them to Flash. |


    | bitmapInstance.setBits() | Method; sets the bits of an existing bitmap element.
    |


    # # Property summary for the BitmapInstance object


    In addition to the Instance object properties, you can use the following properties
    with the BitmapInstance object.


    | Property | Description |


    | bitmapInstance.hPixels | Read-only; an integer that represents the width of
    the bitmap, pixels. |


    | bitmapInstance.vPixels | Read-only; an integer that represents the height of
    the bitmap, pixels. |'
