- img_proc: true
  md: '# Timeline object


    # Availability


    Flash MX 2004.


    # Description


    The Timeline object represents the Flash Timeline, which can be accessed for the
    current document by fl.getDocumentDOM().getTimeline().This method returns the
    Timeline of the current sensor or scene that is being edited.


    When you work with scenes, each scene''s timeline has an index value, and can
    be accessed for the current document by fl.getDocumentDOM().timelines[i]. In this
    example, i is the index of the value of the Timeline.


    When you work by using the methods and properties of the Timeline object, remember
    that the frame value is a zero-based index (not the actual frame in the sequence
    of frames in Timeline). That is, the first frame has a frame index of 0.


    # Method summary for the Timeline object


    The following methods are available for the Timeline object.


    | Method | Description |

    |---||

    | timeline.addMotionGuide() | Adds a motion guide layer above the current layer
    and attaches the current layer to the newly added guide layer |

    | timeline.addNewLayer() | Adds a new layer to the document and makes it the current
    layer |

    | timeline.clearFrames() | Deletes all the contents from a frame or range of frames
    on the current layer |

    | timeline.clearKeyframes() | Converts a keyframe to a regular frame and deletes
    its contents on the current layer |

    | timeline.convertToBlankKeyframes() | Converts frames to blank keyframes on the
    current layer |

    | timeline.convertToKeyframes() | Converts a range of frames to keyframes (or
    the selection if no frames are selected) on the current layer |

    | timeline.copyFrames() | Copies range of frames on the current layer to the Clipboard
    |

    | timeline.createMotionTween() | Sets the Frame.Type property to "motion" for
    each selected frame on the current layer, and converts each frame''s contents
    to a single symbol instance if necessary |

    | timeline.cutFrames() | Cuts range of frames on the current layer from the Timeline
    and saves them to the Clipboard |

    | timeline.deleteLayer() | Deletes a layer |

    | timeline.expandFolder() | Expands or collapses the specified folder or folders
    |

    | timeline.findLayerIndex() | Finds an array of indexes for the layers with the
    given name |'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Method


