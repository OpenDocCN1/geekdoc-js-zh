    # timeline.reorderLayer()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    timeline.reorderLayer(layerToMove, layerPutItBy, bAddBefore);

    ```


    # Parameters


    layerToMove A zero-based index that specifies layer to move.


    layerPutItBy A zero-based index that specifies layer you want to move the layer
    next

    to. For example, if you specify 1 for layerToMove and 0 for layerPutItBy, the
    second layer is

    placed next to the first layer.


    bAddBefore Specifies whether to move the layer before or after layerToPutItBy.
    If you specify

    false, the layer is moved after layerPutItBy. The default value is true. This
    parameter is

