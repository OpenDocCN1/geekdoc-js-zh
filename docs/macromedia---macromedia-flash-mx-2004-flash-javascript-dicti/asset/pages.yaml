    Availability


    Flash MX 2004.


    Usage


    ```

    edge.getControl()

    ```


    Parameters


    +   An integer that specifies which control point of the edge to return. Specify
    0 for the first control point, 1 for the middle control point, or 2 for the end
    control point. If edge.isLine property is true, the middle control point is set
    to the midpoint of the segment joining the beginning and ending control points.


    Returns


    The specified control point.


    Description


    Method; gets a point object set to the location of the specified control point
    of the edge.'
