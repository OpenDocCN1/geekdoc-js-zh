  md: '# document.setTextString()


    Availability


    Flash MX 2004.


    Usage


    ```

    document.setTextString( text [, startIndex [, endIndex] )

    ```


    Parameters


    +   text A of the characters to insert in the text field.


    +   startIndex An integer that specifies the first character to replace. The first
    character position is 0 (zero). This parameter is optional.


    +   endIndex An integer that specifies the last character to replace. The first
    character position is 0 (zero). This parameter is optional.


    Returns


    A Boolean value: true if the text of at least one string is set; false otherwise.


    Description


    Method; inserts a string of text. If the optional parameters are not passed, the
    existing text selection is replaced; if the text object isnt currently being edited,
    the whole text is replaced. If only startIndex is passed, the string passed is
    inserted at this position. If startIndex and endIndex are passed, the string passed
    replaces the segment of text starting from startIndex up, but not including, endIndex.
    See document.setTextString().


    Example


    The following example replaces the current text selection with "Hello World":


    ```

    var success = fl.getDocumentDOM().setTextString("Hello World!");

    ```


    The following example inserts "hello" at position 6 of the current text selection:


    ```

    var pass = fl.getDocumentDOM().setTextString("hello", 6);

    ```


    The following example inserts "Howdy" at position 2 and up to, but not including,
    position 7 of the current text selection:


    ```

    var ok = fl.getDocumentDOM().setTextString("Howdy", 2, 7);

    ```


