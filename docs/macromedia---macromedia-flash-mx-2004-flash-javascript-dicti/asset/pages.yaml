  md: '# Shape object


    Inheritance Element object > Shape object


    Availability


    Flash MX 2004.


    Description


    The Shape object is a subclass of the Element object. The Shape object provides
    more precise control over the Drawing APIs when manipulating or creating geometry
    on the Stage. This control is necessary so that scripts can create useful effects
    and other drawing commands.


    All shapes and properties that can change a shape or any of its subordinate parts
    must be placed between shape.beginEdit() and shape.endEdit() calls to function
    correctly.


    # Method summary for the Shape object


    In addition to the Element object methods, you can use the following methods with
    the Shape object:


    | Method | Description |

    | --- | --- |

    | shape.beginEdit() | Method: defines the start of an edit session. |

    | shape.deleteEdge() | Method: deletes the specified edge. |

    | shape.endEdit() | Method: defines the end of an edit session for the shape.
    |


    # Property summary for the Shape object


    In addition to the Element object properties, the following properties are available
    for the Shape object:


    | Property | Description |

    | --- | --- |

    | shape.contours | Read-only; an array of Contour objects for the shape (see Contour
    object). |

    | shape.edges | Read-only; an array of Edge objects (see Edge object). |

    | shape.isGroup | Read-only; if true, the shape is a group. |

    | shape.vertices | Read-only; an array of Vertex objects (see Vertex object).
    |


    # shape.beginEdit()


    Availability


    Flash MX 2004.


    Usage


    ```

    shape.beginEdit()

    ```


    Parameters


    None.'
