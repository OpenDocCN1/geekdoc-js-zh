  md: '# CHAPTER 4

    C-Level Extensibility


    The C-level extensibility mechanism lets you implement Macromedia Flash MX 2004
    and Macromedia Flash Professional MX 2004 extensibility files using a combination
    of JavaScript and custom C code. You define functions using C, bundle them in
    a dynamic linked library (DLL) or a shared library, save the library in the appropriate
    directory, and then call the functions from JavaScript API (JSAPI).


    For example, you might want to define a function that performs calculations more
    efficiently than JavaScript does, or when you want to create more advanced tools
    or effects.


    This extensibility mechanism is essentially a subset of the Macromedia Dreamweaver
    MX 2004 API. If you are familiar with that API, you might recognize the functions
    in this API. However, this API differs from the Dreamweaver API in the following
    ways:


    +   * This API does not contain all the commands in the Dreamweaver API.

    * All declarations types of wchar and char in the Dreamweaver API are implemented
    as unsigned short declarations in this API, to support Unicode when strings are
    passed.

    * The JSVal JSBytesValue() in this API is not part of the Dreamweaver API.

    * The location DLL or shared library files must be stored is different (see "How
    integrating C functions works on page 369").


    # Integrating C functions


    The C-level extensibility mechanism lets you implement Flash extensibility files
    using a combination of JavaScript and C code. The process for implementing this
    capability is summarized in the following steps:


    +   1. Define functions using the C or C++ language.

    2. Bundle them in a DLL file (Windows) or a shared library (Macintosh).

    3. Saves the DLL file or library in the appropriate location:

    * Windows 2000 or 2003 Windows XP:

    C:\Documents and Settings\<user>\Local Settings\Application Data\Macromedia\Flash
    MX2004\<language>\Configuration\Templates\External Libraries'
  merge: -1
  pgno: 368
- img_proc: true
  md: '+   - Windows 98:

    - C:\Windows\ApplicationData\Macromedia\Flash MX 2004\<language>\Configuration\Templates\External
    Libraries

    - Macintosh OS X:

    - Hard Drive/Users/username/Library/Application Support/Macromedia/Flash MX 2004/<language>/Configuration/Templates/External
    Libraries


    +   4. Create a JSFL file that calls the functions.


    +   5. Run the JSFL file from the Commands in the Flash authoring environment.

    For more information, see "Sample implementation" on page 374.


    # C-level extensibility and the JavaScript interpreter


    The code in the DLL or shared library interacts with the Flash JSAPi at three
    different times:


    +   - At startup, to register the library''s functions

    - When the C function is called, to unpack the arguments that are being passed
    from JavaScript to C

    - Before the C function returns, to package the return value


    To accomplish this, the interpreter defines several data types and exposes an
    API. Definitions for the data types and functions that are listed in this section
    appear in the mm_jsapi.h file. For your library to work properly, you must include
    the mm_jsapi.h file at the top of each file in your library, with the following
    line:


    ```

    #include "mm_jsapi.h"

    ```


    Including the mm_jsapi.h file includes the mm_jsapi_environment.h file, which
    defines the MM_Environment structure.


    To get a copy of the mm_jsapi.h, download the sample ZIP or SIT file (see "Sample
    implementation" on page 374), or copy the following code into a file you name
    mm_jsapi.h:


    ```

    #ifndef _MM_JSAPI_H_

    #define _MM_JSAPI_H_

    ```


