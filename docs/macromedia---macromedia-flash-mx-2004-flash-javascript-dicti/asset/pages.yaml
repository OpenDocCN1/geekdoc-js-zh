    ```


    # Description


    Property: a Boolean value that enables and disables the accessibility of the object''s
    children. This property is equivalent to the inverse logic of the Make Child Objects
    Accessible setting in the Accessibility panel. For example, if forceSimple is
    true, it is the same as the Make Child Object option being unchecked. If forceSimple
    is false, it is the same as the Make Child Object option being checked.


    This property is available only for movie clip objects.


    # Example


    The following example checks to see if the children of the object are accessible;
    a return value of false means the children are accessible:


    ```

    var arChildrenAccessible = fl.getDocumentDOM().selection[0].forceSimple;

    ```


    The following example allows the children of the object to be accessible:


    ```

    fl.getDocumentDOM().selection[0].forceSimple = false;

