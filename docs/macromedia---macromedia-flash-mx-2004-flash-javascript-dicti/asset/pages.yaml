    JSContext *cx, javal, long *lp


    +   * The cx argument is the opaque JSContext pointer that passes to the JavaScript
    function.

    * The v argument is the javal structure from which the integer is to be extracted.

    * The lp argument is a pointer to a 4-byte integer. This function stores the converted
    value in *lp.


    # Returns


