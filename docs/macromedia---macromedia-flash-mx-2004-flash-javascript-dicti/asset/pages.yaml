    | timeline.getLayerProperty() | Retrieves the specified property''s value for
    the selected layers. |


    | timeline.getSelectedFrames() | Retrieves the currently selected frames in an
    array. |


    | timeline.getSelectedLayers() | Retrieves the zero-based index values of the
    currently selected layers. |


    | timeline.insertBlankKeyframe() | Inserts a blank keyframe at the specified frame
    index: if the index is not specified, inserts the blank keyframe using the playhead/selection.
    |


    | timeline.insertFrames() | Inserts the specified number of frames at the given
    frame number. |


    | timeline.insertKeyframe() | Inserts a keyframe at the specified frame. |


    | timeline.pastePastes() | Pastes the range of frames from the Clipboard into
    the specified frames. |


    | timeline.removeFrames() | Deletes the frame. |


    | timeline.reorderLayer() | Moves the first specified layer before or after the
    second specified layer. |


    | timeline.reverseFrames() | Reverses a range of frames. |


    | timeline.selectAllFrames() | Selects all the frames in the current Timeline.
    |


    | timeline.setFrameProperty() | Sets the property of the Object for the selected
    frames. |


    | timeline.setLayerProperty() | Sets the specified property on all the selected
    layers to a specified value. |


    | timeline.getSelectedFrames() | Selects a range of frames in the current layer
    or sets the selected frames to the selection array passed into this method. |


    | timeline.getSelectedLayers() | Sets the layer to selected; also makes the specified
    layer the current layer. |


    | timeline.showLayerMasking() | Shows the layer masking during authoring by locking
    the mask and masked layers. |


    # Property summary for the Timeline object


    The following methods are available for the Timeline object.


    # Property


    # Description


    | timeline.currentFrame | A zero-based index for the frame at the current playhead
    location. |


    | timeline.currentLayer | A zero-based index for the currently active layer. |'
