    In addition to the properties listed in the following table, Effect objects also
    have user-defined parameters, which must be specified in the XML file that specifies
    the effect.effectName and effect.sourceFile properties. These parameters specify
    which UI elements are created (as edit fields, check boxes, and boxes), which
    is controlled by the type of effect you are creating. You can specify labels that
