  md: '# bitmapInstance.getBits()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    bitmapInstance.getBits()

    ```


    # Parameters


    None.


    # Returns


    An object that contains width, height, depth, bits, and, if if the bitmap has
    a color table, cTab properties. The bits element is an array of bytes. The cTab
    element is an array of color values of the form "#rrggbb". The length of the array
    is the length of the color table.


    > Note: The byte array is meaningful only when referenced by an external library.
    You typically use it only when creating an extensible tool or effect.


    # Description


    Method; lets you create bitmaps by getting the bits out of the bitmap, manipulating
    them, and returning them to Flash. See also bitmapInstance.setBits().


    # Example


    The following code creates a reference to the currently selected object; tests
    whether the object is a bitmap; and traces the height, width, and depth of the
    bitmap:


    ```

    var bitmap = fl.getDocumentDOM().selection[0].instanceType;

    if(bitmap == "bitmap")

    var bits = fl.getDocumentDOM().selection[0].getBits();

    fl.trace("height = " + bits.height);

    fl.trace("width = " + bits.width);

    fl.trace("depth = " + bits.depth);

    ```


    # bitmapInstance.hPixels


    # Availability


    Flash MX 2004.


    # Usage


    ```

    bitmapInstance.hPixels

    ```


    # Description


    Read-only property; an integer that represents the width of the bitmap, in pixels.


    # Example


    The following code retrieves the width of the bitmap in pixels:


    ```

    // Get the number of pixels in the horizontal dimension.

    var bmDOj = fl.getDocumentDOM()..selection[0];

    ```'
