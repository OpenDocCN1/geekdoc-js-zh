  md: '# BitmapItem object


    Inheritance Item object > BitmapItem


    # Availability


    Flash MX 2004.


    # Description


    A BitmapItem refers to a bitmap in the library of a document. The BitmapItem object
    is a subclass of the Item object.


    # Property summary for the BitmapItem object


    In addition to the Item object, the BitmapItem object has following properties:


    | Property | Description |

    | --- | --- |

    | bitmapItem.allowSmoothing | Property: A Boolean. Set to true to allow smoothing
    of a bitmap; false otherwise. |

    | bitmapItem.compressionType | Property: a string that determines the type of
    image compression applied to the bitmap |

    | bitmapItem.quality | Property: an integer that specifies the quality of the
    bitmap |

    | bitmapItem.useImportedJPEGQuality | Property: A Boolean. To use the default
    imported JPEG quality, specify true; false otherwise. |


    # bitmapItem.allowSmoothing


    # Availability


    Flash MX 2004.


    # Usage


    ```

    bitmapItem.allowSmoothing

    ```


    # Description


    Property: A Boolean value. Set to true to allow smoothing of a bitmap; false otherwise.


    # Example


    The following code sets the allowSmoothing property of the first item in the library
    of the current document to true:


    ```

    fl.getDocument().library.items[0].allowSmoothing = true;

    alert(fl.getDocument().library.items[0].allowSmoothing);

    ```'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# bitmapItem.compressionType


    # Availability


    Flash MX 2004.


    # Usage


    bitmapItem.compressionType


    # Description


    Property: a string that determines the type of image compression applied to the
    bitmap. Accept values are "photo" or "lossless". If bitmapItem.useImportedJPEGQuality
    is false, "photo" corresponds to JPEG using a quality from 0 to 100; if bitmapItem.useImportedJPEGQuality
    is true, "photo" corresponds to JPEG using the default quality. The value "lossless"
    corresponds to GIF or PNG formats.


    # Example


    The following code sets the compressionType property of the first item in the
    library of the current document to "photo":


    ```

    fl.getDocumentDOM().library.items[0].compressionType = "photo";

    alert(fl.getDocumentDOM().library.items[0].compressionType);

    ```


    # bitmapItem.quality


    # Availability


    Flash MX 2004.


    # Usage


    bitmapItem.quality


    # Description


    Property: an integer that specifies the quality of the bitmap. To use the default
    document quality, specify -1; otherwise, specify an integer from 0 to 100. Available
    only for JPEG compression.


    # Example


    The following code sets the quality property of the first item in the library
    of the current document to 65:


    ```

    fl.getDocumentDOM().library.items[0].quality = 65;

    alert(fl.getDocumentDOM().library.items[0].quality);

    ```


    # bitmapItem.useImportedJPEGQuality


    # Availability


    Flash MX 2004.


    # Usage


    bitmapItem.useImportedJPEGQuality'
