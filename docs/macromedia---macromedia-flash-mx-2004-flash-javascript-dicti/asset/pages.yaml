    # Property summary for the SymbolInstance object


    In addition to the Instance object properties, the SymbolInstance object has the
    following properties:


    | Property | Description |

    | --- | --- |

    | symbolInstance.accName | A string that is equivalent to the Name field in the
    Accessibility panel. |

    | symbolInstance.actionScript | A string that specifies the actions assigned to
    the symbol. |

    | symbolInstance.buttonTracking | A string that, for buttons only, sets the same
    property as the pop-up menu for Button or Track as Menu in the Property inspector.
    |

    | symbolInstance.colorAlphaAmount | An integer that is part of color transformation
    for the instance, specifying the Advanced Effect Alpha settings; equivalent to
    using the Color > Advanced setting in the Property inspector and adjusting the
    controls on the right of the dialog box. |

    | symbolInstance.colorAlphaPercent | An integer that specifies part of the color
    transformation for the instance; equivalent to using the Color > Advanced setting
    in the Instance inspector (percentage controls on the left of the dialog box).
    |

    | symbolInstance.colorBlueAmount | An integer that is part of color transformation
    for the instance; equivalent to using the Color > Advanced setting in the Instance
    inspector. |

    | symbolInstance.colorBluePercent | An integer that is part of color transformation
    for the instance; equivalent to using the Color > Advanced setting in the Property
    inspector (percentage controls on the left of the dialog box). |

    | symbolInstance.colorGreenAmount | An integer that is part of color transformation
    for the instance; equivalent to using the Color > Advanced setting in the Instance
    Property inspector. Allowable values are from -255 to 255. |

    | symbolInstance.colorGreenPercent | Part of the color transformation for the
    instance; equivalent to using the Color > Advanced setting in the Instance Property
    inspector (percentage controls on the left of the dialog box). |'
