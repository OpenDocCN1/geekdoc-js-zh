    typedef long jsval;

    #ifndef JSBool

    typedef long JSBool;

    #endif

    ```


    ```

    typedef JSBool (*JSNative)(JSContext cx, JSObject obj, unsigned int argc,

    jsval *argv, jsval *rval);

    ```


    ```

