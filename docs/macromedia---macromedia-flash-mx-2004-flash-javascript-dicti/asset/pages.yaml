  md: '# # SymbolItem object


    Inheritance Item object > SymbolItem object


    # Availability


    Flash MX 2004.


    # Description


    The SymbolItem object is a subclass of the SymbolItem object.


    # Method summary for the SymbolItem object


    In addition to the Item object methods, you can use the following methods with
    the SymbolItem object:


    | Method | Description |

    | --- | --- |

    | symbolItem.convertToCompiledClip() | Method; converts a symbol item in the library
    to a compiled movie clip |

    | symbolItem.exportSWC() | Method; exports the symbol to a SWC file |

    | symbolItem.exportSWF() | Method; exports the symbol item to a SWF file specified
    by a URI |


    # Property summary for the Item object


    In addition to the Item object properties, the properties are available for the
    SymbolItem object:


    | Property | Description |

    | --- | --- |

    | symbolItem.sourceAutoUpdate | Property; a Boolean value. If true, the item is
    updated when the FLA is published. |

    | symbolItem.sourceFilePath | Property; a string that specifies the path for the
    source FLA in URI format (://). |

    | symbolItem.symbolName | Property; a string that specifies the name of the item
    in the source file library. |

    | symbolItem.symbolType | Property; a string that specifies the type of symbol.
    |

    | symbolItem.timeline | Read-only; a Timeline object. |


