  md: '# Stroke object


    Availability


    Flash MX 2004.


    Description


    The Stroke object contains all the settings for a stroke, including the custom
    settings. This object represents the information contained in the Stroke Properties
    inspector. Using the Stroke object together with the document.setCustomStroke()
    method, you can change the stroke settings for the toolbar, the Properties Inspector,
    and the current selection. You can also get the stroke settings of the toolbar
    and Properties Inspector, or by using the document.getCustomStroke() method.


    This object has the following four properties: style, thickness, color, and breakCorners.
    Other properties can be set, depending on the style property.


    # Summary for the Stroke object


    The following properties are available for the Stroke object:


    | Property | Description |

    | --- | --- |

    | stroke.breakCorners | Same as the Sharp Corners setting in the custom Stroke
    dialog box. |

    | stroke.color | A string in hexadecimal (#rrggg) format or an integer containing
    the value. |

    | stroke.curve | A string that specifies type of hatching for the stroke. |

    | stroke.dash1 | An integer that specifies the lengths of the solid part of a
    dashed line. |

    | stroke.dash2 | An integer that specifies the lengths of the blank part of a
    dashed line. |

    | stroke.density | A string that specifies the density of a stippled line. |

    | stroke.dotSize | A string that specifies the dot size of a stippled line. |n|
    stroke.dotSpace | An integer that specifies the spacing between dots in a dotted
    line. |

    | stroke.hatchThickness | A string that specifies the hatching of a hatch line.
    |

    | stroke.jiggle | A string that specifies the jiggle of a hatched line. |

    | stroke.length | A string that specifies the length of a hatch line. |

    | stroke.pattern | A string that specifies the pattern of a ragged line. |

    | stroke.rotate | A string that specifies the rotation of a hatch line. |

    | stroke.space | A string that specifies the spacing of a hatched line. |

    | stroke.style | A string that describes the stroke style. |

    | stroke.thickness | An integer that specifies the stroke size. |

    | stroke.variation | A string that specifies the variation of a stippled line.
    |'
