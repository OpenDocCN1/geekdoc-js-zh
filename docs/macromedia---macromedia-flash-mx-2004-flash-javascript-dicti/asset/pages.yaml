  md: '# Description


    Property: changes the text string within this object. If you omit the optional
    parameters, the whole text is replaced. If you specify only startIndex, the specified
    string is inserted at the startIndex position. If you specify both startIndex
    and endIndex, the specified string replaces the segment of text starting from
    startIndex up to, but not including, endIndex.


    # Example


    The following example assigns the string "this is a string" to the selected field:

    fl.getDocumentDOM().selection[0].setText("this is a string");

    The following example inserts the string "abc" beginning at the fifth character
    of the selected field:


    ```

    fl.getDocumentDOM().selection[0].setText("01234567890");

    fl.getDocumentDOM().selection[0].setText("abc", 4);

    // text field is now "0123abc567890"

    ```


    The following example replaces the text from the third to the eighth character
    of the selected text with the string "abcdefghij". Characters between startIndex
    and endIndex are overwritten. Characters beginning endIndex follow the inserted
    string.


    ```

    fl.getDocumentDOM().selection[0].setText("01234567890");

    fl.getDocumentDOM().selection[0].setText("abcdefghij", 2);

    // text field is now "0lababcdefghij90"

    ```


