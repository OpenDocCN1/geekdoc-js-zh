    # Description


    Method; extracts a function from a javal structure, converts it to a string, if
    possible,

    and passes the converted value to the caller.


    Note: Do not modify the returned buffer or you might corrupt the data structures
    of the

    JavaScript interpreter. To change the string, you must copy the characters into
    another buffer and

    create a new JavaScript string.


    # Arguments


    JSContext *cx, javal, unsigned int *pLength


    +   * The cx argument is the opaque JSContext pointer to the JavaScript function.

    * The v argument is the javal structure from which the string is to be extracted.

    * The pLength argument is a pointer to an unsigned integer. This function sets
    *plength equal to the length of the string in bytes.


    # Returns


    A pointer that points to a null-terminated string if successful or to a null value
    on failure.

    calling routine must not free when this function finishes.


