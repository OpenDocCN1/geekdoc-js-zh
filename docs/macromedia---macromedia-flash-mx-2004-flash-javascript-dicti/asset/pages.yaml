  md: '# # CHAPTER 3

    Objects


    This chapter describes the Flash JSAPI objects, listed in alphabetical order.
    The objects are listed in the following table:


    | Object | Description |

    |---|---|n| BitmapInstance object | The BitmapInstance is a subclass of the Instance
    object and represents a bitmap in a frame. |

    | Bitmap object | A Bitmap refers to a bitmap of a document. The Bitmap is a subclass
    of the item object. |

    | CompiledClipInstance object | The CompiledClipInstance object is a subclass
    of the Instance object. |

    | ComponentInstance object | The ComponentInstance object is a subclass of the
    SymbolInstance and represents a component in a frame. |

    | componentsPanel object | The componentsPanel, which represents the Components
    panel, is a property of the flash object and can be accessed by flash_componentsPanel.
    |

    | Contour object | A Contour represents a closed path of half edges on the boundary
    of a shape. |

    | Document object | The Document object represents the Stage. |

    | drawingLayer object | The drawingLayer is accessible from JavaScript as a child
    of the flash object. |

    | Edge object | The Edge object represents an edge of a Stage. |

    | Effect object | The Effect object represents an instance of a Timeline effect.
    |

    | Element object | Everything that appears on the Stage is of type Element. |

    | EmbeddedVideoobject | The EmbeddedVideoobject is a subclass of the Instance
    object. |

    | Fill object | The Fill contains all the properties of the Fill color setting
    of the Tools panel or of a selected shape. |

    | flash object | The flash object represents the Flash application. |

    | folderItem object | The folderItem object is a subclass of the Item object.
    |'
