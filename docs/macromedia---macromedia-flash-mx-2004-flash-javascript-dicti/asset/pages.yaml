    ```


    # Parameters


    attrName A string that specifies the name of the TextAttrs object to be returned.


    Note: For a list of possible values for attrName, see Property summary for the
    TextAttrs object.


    startIndex An integer that is the index of first character. This parameter is
    optional.


    endIndex An integer that specifies the end of the range, which starts with startIndex
    and goes up, but including, endIndex. This parameter is optional.


    # Returns


