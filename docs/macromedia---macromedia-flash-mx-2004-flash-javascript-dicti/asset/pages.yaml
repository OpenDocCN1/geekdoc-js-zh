  md: '# TextAttrs object


    Availability


    Flash MX 2004.


    Description


    The TextAttrs object contains all the properties that can be applied to a subselection.
    The object is a property of the TextRun object (textRun.textAttrs).


    # Property summary for the TextAttrs object


    The following properties are available for the TextAttrs object.


    | Property | Description |

    | --- | --- |

    | textAttrs.aliasText | Property; a Boolean value that specifies that Flash should
    draw the text using a method optimized for increasing the legibility of small
    text. |

    | textAttrs.alignment | Property; a string that specifies paragraph justification.
    Acceptable values are "left", "center", "right", and "justify". |

    | textAttrs.autoKern | Property; a Boolean value that determines whether uses
    (true) or ignores (false) kerning information in the font(s) to kern the text.
    |

    | textAttrs.bold | Property; a Boolean value. A value of true causes text to appear
    with the bold version of the font. |

    | textAttrs.characterPosition | Property; a string that determines the baseline
    for the text. |

    | textAttrs.characterSpacing | Property; an integer that represents the space
    between characters. |

    | textAttrs.face | Property; a string that represents the name of the font, such
    as "Arial". |

    | textAttrs.fillColor | Property; a string that specifies the fill color. |

    | textAttrs.indent | Property; an integer that specifies paragraph indentation.
    |

    | textAttrs.italic | Property; a Boolean value. A value of true causes text to
    appear with the italic version of the font. |

    | textAttrs.leftMargin | Property; an integer that specifies the paragraph''s
    left margin. |

    | textAttrs.lineSpacing | Property; an integer that specifies the line spacing
    (leading) of the paragraph. |

    | textAttrs.rightMargin | Property; an integer that specifies the paragraph''s
    right margin. |

    | textAttrs.rotation | Property; a Boolean value. A value of true causes Flash
    to rotate the characters of the text 90. The default value is false. |

    | textAttrs.size | Property; an integer that specifies the size of the font. |

    | textAttrs.target | Property; a string that represents the target property of
    the text field. |

    | textAttrs.url | Property; a string that represents the URL property of the text
    field. |'
