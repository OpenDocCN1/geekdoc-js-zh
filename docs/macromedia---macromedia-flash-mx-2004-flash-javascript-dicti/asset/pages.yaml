  md: '# XMLUI object


    Availability


    Flash MX 2004.


    Description


    Flash MX 2004 supports custom dialog boxes written in a subset of the XML User
    Interface Language (XUL). For more information, see Appendix B, "XML to UI" in
    Using Flash. You can write a dialog.file and invoke it from the JavaScript API
    using the document.xmlPanel().


    An XML User Interface (XMLUI) dialog box can be built by several Flash MX 2004
    features, such as Commands and Behaviors, to provide a user interface for features
    that you be building using extensibility.


    The XMLUI object provides the ability to get and set properties of an XMLUI dialog
    box, and accept or cancel out of one. The XMLUI methods can be used in callbacks,
    such as oncommand handlers in buttons.


    # Method summary for the XMLUI object


    The following methods are available for the XMLUI object:


    | Method | Description |

    | --- | --- |

    | xmlui.accept() | Method: makes the current XMLUI dialog box exit with an accept
    state, which is equivalent to the user clicking the OK button. |

    | xmlui.cancel() | Method: makes the current XMLUI dialog box exit with a cancel
    state, which is equivalent to the user clicking the Cancel button. |

    | xmlui.get() | Method: retrieves the value of the specified property of the current
    XMLUI dialog box. |

    | xmlui.set() | Method: modifies the value of the specified property of the current
    XMLUI dialog box. |


    # xmlui.accept()


    Availability


    Flash MX 2004.


    Usage


    xmlui.accept()


    Parameters


    None.


    Returns


    Nothing.'
  merge: -1
  pgno: 364
