  md: '# Path object


    Availability


    Flash MX 2004.


    Description


    The Path object defines a sequence of line segments (straight, curved, or both),
    which you typically use when creating extensible tools. The following example
    shows an instance of a Path object returned from the flash object:


    ```

    path = fl.drawingLayer.newPath();

    ```


    See also the drawingLayer object.


    # Method summary for the Path object


    The following methods are available for the Path object:


    | Method | Description |

    | --- | --- |

    | path.addCubicCurve() | appends a cubic Bézier curve segment to the path. |

    | path.addCurve() | appends a quadratic Bézier segment to the path. |

    | path.addPoint() | adds a point to the path. |

    | path.clear() | removes all points from the path. |

    | path.close() | appends a point at the location of the first point of the path
    and extends it to that point, which closes the path. |

    | path.makeShape() | creates a shape on the Stage using the current stroke and
    fill settings. |

    | path.newContour() | starts a new contour in the path. |


    # Property summary for the Path object


    The following properties are available for the Path object:


    | Property | Description |

    | --- | --- |

    | path.nPts | Read-only; an integer representing the number of points in the path.
    |


    # path.addCubicCurve()


    Availability


    Flash MX 2004.


    Usage


    ```

    path.addCubicCurve(xAnchor, yAnchor, x2, y2, x3, y3, x4, y4)

    ```


    Parameters


    xAnchor A floating-point number that specifies the x position of the first control
    point.'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'yAnchor A floating-point number that specifies the y position of the first
