  md: '# # Text object Element object


    Inheritance Element object > Text object


    # Availability


    Flash MX 2004.


    # Description


    The Text object represents a single text item in a document. All properties of
    the text pertain to the entire text block.


    To sets properties of a text run within the text field, "Property summary for
    the TextRun object" on page 322. To change properties of a selection within a
    text field, you can use document.setTextElementtr() and specify a range of text,
    or use the current selection.


    To sets properties of the selected text field, document.setElementProperty().
    The following example shows the currently selected text field to the variable
    textVar:


    ```

    fl.getDocumentDOM().setElementProperty("variableName", "textVar");

    ```


    # # Method for the Text object


    In addition to the Element methods, you can use the following methods with the
    Text object:


    | Method | Description |

    | --- | --- |

    | text.getTextAttr() | Method; retrieves the specified attribute for the text
    identified by the optional startIndex and endIndex. |

    | text.getTextString() | Method; retrieves the specified range of text. |

    | text.setTextAttr() | Method; sets the specified attribute associated with the
    text identified by startIndex and endIndex. |

    | text.setTextString() | Method; changes the text string within this text object.
    |


    # # Property summary for the Text object


    In addition to the Element object properties, the properties are available for
    the Text object:


    | Property | Description |

    | --- | --- |

    | text.accName | Property; a string that is equivalent to the Name field in the
    Accessibility panel. |

    | text.autoExpand | Property; a Boolean value that controls the expansion of the
    bounding width for static text fields or the bounding width and height for dynamic
    input text. |

    | text.border | Property; a Boolean value that controls whether Flash shows (true)
    or hides (false) a border around dynamic or input text. |

    | text.description | Property; a string that is equivalent to the Description
    field in the Accessibility panel. |'
