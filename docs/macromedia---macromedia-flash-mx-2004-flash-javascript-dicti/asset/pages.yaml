    Description


    The Parameter object type is accessed from the screen.parameters array (which
    corresponds to the Screen inspector in the Flash tooling tool) or by the componentInstance.parameters
    array (which corresponds to the component Property inspector in the tooling tool).


    # Method summary for the Parameter object


    The following methods are available for the Parameter object:


    | Method | Description |

    | --- | --- |

    | parameter.insert() | Method: if a parameter is a list, object, or array, the
    value property is an array |

    | parameter.removeItem() | Method: removes an element of the list, object, or
    array type of a screen or component parameter |


    # Property summary for the Parameter object


    The following properties are available for the Parameter object:


    | Property | Description |

    | --- | --- |

    | parameter.category | Property; string that specifies the category property for
    the screen parameter or componentInstance parameter. |

    | parameter.listIndex | Property; an integer that specifies the value of the listed
    item. |

    | parameter.name | Read-only; a string that specifies the name of the parameter.
    |

    | parameter.value | Property; corresponds to the Value field in the Parameters
    tabs of the Component Inspector panel, in the Component Property inspector, or
    in the Screen Property inspector. |

    | parameter.valueType | Read-only; a string that indicates the type of the screen
    or component parameter. |

    | parameter.verbose | Read-only; specifies whether the parameter appears in the
    Parameters tab of the Component inspector panel, the Parameters tab of the Property
    inspector, or the Components Inspector panel. |


    # parameter.category


    Availability


    Flash MX 2004.


    Usage


    parameter.category'
