    source file for the specified effect. |

    | effect.symbolType | Read-only; a string that specifies the type of symbol to
    create during the initial application of the effect. |

    | effect.useXMLUI | Property; a Boolean value that lets you override the default
    behavior using XMLML to construct a dialog box that consists of one or more controls.
    |


