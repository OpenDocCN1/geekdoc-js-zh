  md: '# Screen object


    Availability

    Flash MX 2004.


    Description

    The Screen object represents a single screen in a slide or form document. This
    object contains properties related to the slide or form. For access to the array
    of all Screen objects in the document, using the following code:


    ```

    fl1.getDocumentDOM().screenOutline.screens

    ```


    # Property summary for the Screen object

    The Screen object has the following properties:


    | Properties | Description |

    | --- | --- |

    | screen.accName | Property; a string that is equivalent to the Name field in
    the Accessibility panel. |

    | screen.childScreens | Read-only; the array of child screens for this screen.
    The array is empty if there are no child screens. |

    | screen.description | Property; a string that is equivalent to the Description
    field in the Accessibility panel. |

    | screen.forceSize | Property; a Boolean value that enables and disables accessibility
    for the object''s children. |

    | screen.hidden | Property; a Boolean value that specifies whether a screen is
    visible. |

    | screen.instanceName | Read-only; a string that represents the instance name
    used to access the object from ActionScript. |

    | screen.name | Read-only; a string that represents the name of the screen. |

    | screen.nextScreen | Read-only; an object that represents the next screen in
    the parent''s childScreen array. |

    | screen.parameters | Read-only; an array of ActionScript properties that are
    accessible from the Property inspector. |

    | screen.parentScreen | Read-only; an object that represents the parent screen.
    |

    | screen.prevScreen | Read-only; an object that represents the previous screen
    in the parent''s childScreen array. |

    | screen.silent | Property; a Boolean value that specifies whether the object
    is accessible. |

    | screen.tabIndex | Property; equivalent to the Tab Index field in the Accessibility
    panel. |

    | screen.timeline | Read-only; the Timeline object for the screen. |'
  merge: -1
  pgno: 247
- img_proc: true
  md: "# screen.accName\n\nAvailability\nFlash MX 2004.\n\nUsage\nscreen.accName\n\
    \nDescription\nProperty; a string that is equivalent to the Name field in the\
    \ Accessibility panel. Screen readers identify objects by reading the name aloud.\n\
    \nExample\nThe following example shows the value of the name of the object in\
    \ the theName variable:\nvar theName = fl.getDocumentDOM().screenOutline[1].accName;\n\
    The following example sets the name of the object to 'Home Button':\nfl.getDocumentDOM().screenOutline[1].accName\
    \ = 'Home Button';\",\n\n# screen.childScreens\n\nAvailability\nFlash MX 2004.\n\
    \nUsage\nscreen.childScreens\n\nDescription\nRead-only property; the array of\
    \ child screens for this screen. The array is empty if there are no child screens.\n\
    \nExample\nThe following example checks to see if the current document is a slide\
