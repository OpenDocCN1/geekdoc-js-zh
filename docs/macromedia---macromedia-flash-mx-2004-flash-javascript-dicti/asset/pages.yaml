    # ## screenOutline.copyScreenFrom()


    # ### Availability


    Flash MX 2004.


    # ### Usage


    ```

    screenOutline.copyScreenFromFile(fileURI [, screenName])

    ```


    # ### Parameters


    **fileURI** Stringing as a filename for the file that contains the screens to
    copy into the document, in URI format (for example, `file:///C:/assets.fla`).


    **screenName** The name of the screen to copy. If the **screenName** parameter
    is present, Flash copies that screen and its children. If the **screenName** is
    not specified, Flash copies the whole document. This parameter is optional.


    # ### Returns


    Nothing. If the file is not found or not a valid FLA file, or if the specified
    screen is not found, an error is reported and the script is cancelled.


    # ### Description


    Method; inserts all the screens, or a named screen and its children, from a specified
    document under the currently selected screen. If more than one is selected, the
    screen(s) are inserted under the last selected, as its sibling.


    # ### Example


    The following example copies the "slide1" screen from the myTarget.fla file on
    the Desktop to the current document (substitute your user for username):


    ```

    fl.getDocumentDOM().screenOutline.copyScreenFromFile("file:///C|/Documents and
    Settings/username/Desktop/myTarget.fla "slide1");

    ```'
