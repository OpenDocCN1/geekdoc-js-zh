  md: '# Math object


    # Availability


    Flash MX 2004.


    # Description


    The Math object is available as a read-only property of the flash object; see
    fl.Math. This object provides methods that perform common mathematical operations.


    # Method summary for the Math object


    The following methods are available for the Math object:


    | Method | Description |

    | --- | --- |

    | Math.concatMatrix() | Performs a matrix concatenation and returns the result.
    |

    | Math.invertMatrix() | Returns the inverse of the specified matrix. |

    | Math.pointDistance() | Computes the distance between two points. |


    # Math.concatMatrix()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    Math.concatMatrix(mat1, mat2)

    ```


    # Parameters


    mat1 and mat2 Specify the Matrix objects to be concatenated (see Matrix object).
    Each parameter must be one of fields a, b, c, d, tx, and ty.


    # Returns


    A concatenated object matrix.


    # Description


    Method; performs a matrix concatenation and returns the result.


    # Example


    The following example stores the currently selected object in the elt variable,
    multiplies the object matrix by the view matrix, and stores value in the mat variable:


    ```

    var elt = fl.getDocumentDOM().selection[0];nvar mat = fl.Math.concatMatrix( elt.matrix
    , fl.getDocumentDOM().viewMatrix );

    ```'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Math.invertMatrix()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    Math.invertMatrix(mat)

    ```


    # Parameters


    mat Indicates the Matrix object to invert. It must have the following fields:
    a, b, c, d, tx, and ty.


    # Returns


    A Matrix object that is the inverse of the original matrix.


    # Description


    Method: returns the inverse of the specified matrix.


    # Example


    The following example stores the currently selected object in the elt variable,
    assigns that to the mat variable, and stores the inverse of the matrix in the
    inv variable:


    ```

    var elt = fl.getDocumentDOM().selection[0];

    var mat = elt.matrix;

    var inv = fl.Math.invertMatrix( mat );

    ```


    # Math.pointDistance()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    Math.pointDistance(pt1, pt2)

    ```


    # Parameters


    pt1 and pt2 Specify the points between which distance is measured.


    # Returns


    A floating-point value that represents the distance between the points.


    # Description


    Method: computes the distance between two points.


    # Example


    The following example stores the value for the distance between pt1 and pt2 in
    the dist variable:


    ```

    var pt1 = (x:10, y:20)

    var pt2 = (x:100, y:200)

    var dist = fl.Math.pointDistance(pt1, pt2);

    ```'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Matrix object


    Availability

    Flash MX 2004.


    Description

    The Matrix object represents a transformation matrix.


    # Property summary for the Matrix object

    The following properties are available for the Matrix object:


    | Property | Description |

    | --- | --- |

    | matrix.a | Property: a floating-point value that specifies the (0,0) element
    in the transformation matrix. |

    | matrix.b | Property: a floating-point value that specifies the (0,1) element
    in the matrix. |

    | matrix.c | Property: a floating-point value that specifies the (1,0) element
    in the matrix. |

    | matrix.d | Property: a floating-point value that specifies the (1,1) element
    in the matrix. |

    | matrix.tx | Property: a floating-point value that specifies the x-axis location
    of a symbol''s registration point or the center of a shape. |

    | matrix.ty | Property: a floating-point value that specifies the y-axis location
    of a symbol''s registration point or the center of a shape. |


    # matrix.a


    Availability

    Flash MX 2004.


    Usage

    matrix.a


    Description

    Property: a floating-point value that specifies the (0,0) element in the transformation
    matrix. This value represents the scale factor of the object''s x-axis.


    Example


    The a and d properties in matrix represent scaling. In the following example,
    the values are set to 2 and 3, respectively, to scale the selected object to two
    times its width and three times its height.


    ```

    var mat = fl.getDocumentDOM().selection[0].matrix;

    mat.a = 2;

    mat.d = 3;

    fl.getDocumentDOM().selection[0].matrix = mat;

    ```'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'You can rotate an object by setting the a, b, c, and d properties relative
    to one another,

    where a = d and b = c. For example, values of 0.5, 0.8, -0.8, and 0.5 rotate the
    object 60°:


    ```

    var mat = fl.getDocumentDOM().selection[0].matrix;

    mat.a = 0.5;

    mat.b = 0.8;

    mat.c = 0.8*(-1);

    mat.d = 0.5;

    fl.getDocumentDOM().selection[0].matrix = mat;

    ```


    You can set a = d = 1 and c = b = 0 to reset the object back to its original shape.


    # matrix.b


    # Availability


    Flash MX 2004.


    # Usage


    matrix.b


    # Description


    Property: a floating-point value that specifies the (0,1) element in the matrix.
    This value represents the vertical skew of a shape; it causes Flash to move the
    shape''s right edge along the vertical axis.


    The matrix.b and matrix.c properties in a matrix skewing.


    # Example


    In the following example, you can set b and c to -1 and 0, respectively; these
    settings skew the object at a 45° vertical angle:


    ```

    var mat = fl.getDocumentDOM().selection[0].matrix;

    mat.b = -1;

    mat.c = 0;

    fl.getDocumentDOM().selection[0].matrix = mat;

    ```


    To skew the object back to its original shape, you can set b and c to 0.


    See the matrix.a example.


    # matrix.c


    # Availability


    Flash MX 2004.


    # Usage


    matrix.c


    # Description


    Property: a floating-point value that specifies the (1,0) element in the matrix.
    This value causes Flash to skew the object by moving its bottom edge along a horizontal
    axis.


    The matrix.b and matrix.c properties in a matrix skewing.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Example


    See matrix.b example.


    # matrix.d


    # Availability


    Flash MX 2004.


    # Usage


    ```

    matrix.d

    ```


    # Description


    Property: a floating-point value that specifies the (1,1) element in the matrix.
    This value represents the scale factor of the object''s y-axis.


    # Example


    See matrix.a.


    # matrix.tx


    # Availability


    Flash MX 2004.


    # Usage


    ```

    matrix.tx

    ```


    # Description


    Property: a floating-point value that specifies the x-axis location of a symbol''s
    registration point or the center of a shape. It defines the x translation of the
    transformation.


    You can move an object by setting the matrix.tx and matrix.ty properties.


    # Example


    In the following example, setting tx and ty to 0 moves the registration point
    of the object to point 0,0 in the document:


    ```

    var mat = fl.getDocumentDOM().selection[0].matrix;

    mat.tx = 0;

    mat.ty = 0;

    fl.getDocumentDOM().selection[0].matrix = mat;

    ```


