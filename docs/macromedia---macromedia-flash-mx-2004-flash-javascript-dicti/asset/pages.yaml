    # Usage


    text.selectionStart


    # Description


    Property: a zero-based integer that specifies the beginning of a subselection.
    You can use this property with text.selectionEnd to select a range of characters.
    Characters up to, but not including, text.selectionEnd are selected.


    +   * If there is an insertion or no selection, text.selectionEnd is equal to
    text.selectionStart.

    * If text.selectionStart is set to a value greater than text.selectionEnd, text.selectionEnd
    is set to text.selectionStart, and no text is selected.


