  md: '# typedef JSBool (*JSNative)(JSContext *cx, JSObject *obj, unsigned int argc,
    jval *argv, jval *rval);


    # Description


    Method: describes C-level implementations of JavaScript functions in the following
    situations:


    +   - The ctx pointer is a pointer to an opaque JSContext structure, which must
    be passed to the functions in the JavaScript API. This variable holds the interpreter''s
    execution count.

    - The obj pointer is a pointer to the object whose context the script executes.
    While the script is running, this keyword is equal to this object.

    - The argc integer is the number of arguments being passed to the function.

    - The argv pointer is a pointer to an array of jval structures. The array is argc
    elements in length.

    - The rval pointer is a pointer to a single jval structure. The function''s return
    value should be written to *rval.


    The function returns JS_TRUE if successful; JS_FALSE otherwise. If the function
    returns JS_FALSE, the current script stops execution and an error message appears.


    # JSBool_JS_DefineFunction()


    # Usage


    ```

    JSBool_JS_DefineFunction(unsigned short *name, JSNative call, unsigned int nargs);

    ```


    # Description


    Method: registers a C-level function with the JavaScript interpreter in Flash.
    After the JS_DefineFunction() function registers the C-level function that you
    specify in the call argument, you can invoke it in a JavaScript script by referring
    to it with the name that you specify in the name argument. The name is case-sensitive.


    Typically, this function is called by the MM_Init() function, which Flash calls
    during startup.


    # Arguments


    unsigned short *name, JSNative call, unsigned int nargs


    +   - The name argument is the name of the function as it is exported to JavaScript.

    - The call argument is a pointer to a C-level function. The function must return
    a JSBool, which indicates success or failure.

    - The nargs argument is the number of arguments that the function expects to receive.


    # Returns


    A Boolean value: JS_TRUE indicates success; JS_FALSE indicates failure.'
