- img_proc: true
  md: '# Description


    Method; creates a shape on the Stage by using the current stroke and fill settings.
    The path is cleared after the shape is created. This method has two optional parameters
    for suppressing the fill and stroke of the resulting shape. If you omit these
    parameters or set them to false, the current values for fill and stroke are used.


    # Example


    The following example creates a shape with the current fill and no stroke:


    ```

    var myPath = fl.drawingLayer.newPath();

    Path.makeShape(false, true);

    ```


    # path.newContour()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    path.newContour()

    ```


    # Parameters


    None.


    # Returns


    Nothing.


    # Description


    Method; starts a new contour in the path.


    # Example


    The following example creates a hollow square:


    ```

    var myPath = fl.drawingLayer.newPath();

    myPath.addPoint( 0, 0 );

    myPath.addPoint( 0, 30 );

    myPath.addPoint( 30, 30 );

    myPath.addPoint( 30, 0 );

    myPath.addPoint( 0, 0 );


    myPath.newContour();

    myPath.addPoint( 10, 10 );

    myPath.addPoint( 10, 20 );

    myPath.addPoint( 20, 20 );

    myPath.addPoint( 20, 10 );

    myPath.addPoint( 10, 10 );


    myPath.makeShape();

    ```'
