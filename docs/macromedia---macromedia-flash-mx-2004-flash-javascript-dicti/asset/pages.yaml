  md: '# Parameters


    boundingRectangle A rectangle that specifies the bounds of the oval to be added.


    bSuppressFill A Boolean value that, if set to true, causes the method to create
    the shape without a fill. The default value is false. This parameter is optional.


    bSuppressStroke A Boolean value that, if set to true, causes the method to create
    the shape without a stroke. The default value is false. This parameter is optional.


    # Returns


    Nothing.


    # Description


    Method; adds a new oval in the specified bounding rectangle. This method performs
    the same operation as the oval tool. The method uses the document’s default stroke
    and fill attributes and adds the oval to the current frame and layer. If bSuppressFill
    is set to true, the oval is drawn without a fill. If bSuppressStroke is set to
    true, the oval is drawn without a stroke. If both bSuppressFill or bSuppressStroke
    are set to true, the method will do nothing.


    # Example


    The example adds a new oval within the specified coordinates:


    ```

    flash.getDocumentDOM().addOval({left:72,top:50,right:236,bottom:228});

    ```


    The example draws an oval without fill:


    ```

    flash.getDocumentDOM().addOval({left:72,top:50,right:236,bottom:228},

    t);

    ```


    The example draws an oval without stroke:


    ```

    flash.getDocumentDOM().addOval({left:72,top:50,right:236,bottom:228},

    false,true);

    ```


