  md: '# HalfEdge object


    Availability


    Flash MX 2004.


    Description


    The HalfEdge object is directed to the edge of a Shape object. An edge has two
    half edges. You can traverse the contours of a shape by "walking around" these
    half edges. For example, starting from a half edge, you can visit all the half
    edges around a contour of a shape, and return to the original half edge.


    Half edges are ordered. One half edge represents one side of the edge; the other
    half represents the other side.


    # Method summary for the HalfEdge object


    The methods are available for the halfEdge object:


    | Method | Description |

    | --- | --- |

    | halfEdge.edge() | Gets the Edge object for the halfEdge object. |

    | halfEdge.next() | Gets the next half edge on the current contour. |

    | halfEdge.getOppositeHalfEdge() | Gets the halfEdge on the other side of the
    edge. |

    | halfEdge.getPrev() | Gets the preceding half edge on the current contour. |

    | halfEdge.vertex() | Gets the Vertex object at the head of the halfEdge object.
    |


    # Property summary for the HalfEdge object


    The following properties are available for the halfEdge object:


    | Property | Description |

    | --- | --- |

    | halfEdge.id | Read-only; a unique integer identifier for the halfEdge object.
    |


    # halfEdge.getEdge()


    Availability


    Flash MX 2004.


    Usage


    ```

    halfEdge.getEdge()

    ```


    Parameters


    None.


    Returns


    An Edge object.'
  merge: -1
  pgno: 194
