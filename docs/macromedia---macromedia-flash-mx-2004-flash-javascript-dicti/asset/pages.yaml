  md: '# # CHAPTER 1

    Introduction


    The documents on this site assume you are familiar with JavaScript or ActionScript
    syntax and with basic programming concepts such as functions, parameters, and
    data types. They also assume that you understand the concept of working with objects
    and properties. For a reference to JavaScript, see the Netscape JavaScript documentation.


    Netscape Edge has a JavaScript Developer Central site (http://developer.netscape.com/tech/javascript/index.html)
    that contains documentation and articles useful for understanding JavaScript.
    The most valuable resource is the Core JavaScript Guide.


    This chapter contains the following sections:


    +   - Overview of the Macromedia Flash JavaScript API .....................................................................
    17

    - The Flash Document Object Model. .................................................................................
    . . . . . . . . . . . 19

    - The PolyStar example. .................................................................................
    . . . . . . . . . . . . . . . . . . . . . . 23


    # ## Overview of the Macromedia Flash JavaScript API


    The ActionScript language lets you scripts to perform actions in the Macromedia
    Flash environment (that is, while a SWF file is playing). The Flash JavaScript
    API (JSAPI) lets you write scripts to perform several actions in the Flash authorizing
    (that is, while a user has the Flash program open). You can write scripts that
    act like commands and scripts that add tools to the Tools panel. These scripts
    can be used to help automate the authorizing process.


    Flash JSAPI is designed to resemble the Macromedia Dreamweaver and Fireworks API
    (which were designed on the Netscape JavaScript API). The Flash JSAPI is based
    on a Document Object Model (DOM), which allows Flash documents to be accessed
    using JavaScript objects. The Flash JSAPI includes all elements of the Netscape
    JavaScript API, plus the Flash DOM. These added objects and their methods and
    properties are described in this document. You can use any of the elements of
    the native JavaScript language in a Flash script, but only elements that make
    sense in the context of a Flash document will have an effect.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'You can use Macromedia Flash MX 2004 Professional or your preferred editor
    to write or edit Flash JavaScript (JSFL). If you use Flash Professional, these
    files have a .jsfl extension by default. To make a script appear in the Commands
    menu, save its JSFL file in the following folder:


    +   * Windows 2000 or Windows XP:

    C:\Windows\Settings\user\Local Settings\ Application Data\Macromedia\Flash MX2004\language\Configuration\Commands

    * Windows 98:

    C:\Windows\Application Data\Macromedia\Flash MX 2004\language\Configuration\Commands

    * Mac OS X:

    Hard Drive/user/userName/Library/Application Support/Macromedia/Flash MX 2004/language/Configuration/Commands


    JSFL files that create tools need to be stored in the Tools folder, which can
    be found in the following location:


    +   * Windows 2000 or Windows XP:

    C:\Documents\Settings\user\Local Settings\ Application Data\Macromedia\Flash MX2004\language\Configuration\Tools

    * Windows 98:

    C:\Windows\Application Data\Macromedia\Flash MX 2004\language\Configuration\Tools

    * Mac OS X:

    Hard Drive/user/userName/Library/Application Support/Macromedia/Flash MX 2004/language/Configuration/Tools


    If a JSFL file has other files that go with it, as XML files, they should be stored
    in the same directory as the JSFL file.

    You can also run a JSFL file by selecting one or more commands in the History
    panel and clicking the Save As Command button in the History panel or selecting
    the Save As Command from the Options pop-up menu. The command (JSFL) file is saved
    in the Commands folder. You can open the file and edit it as same as any other
    script file.


    To run a script, do one of the following:


    +   * Select Commands > Command Name.

    * Select Commands > Run Command and select the script to run.


    To add a tool implemented in a JSFL file to the Tools panel:


    +   1. Copy the JSFL file for the tool and any other associated files to the Tools
    folder.

    2. Select Edit > Customize Tools Panel (Windows) or Flash > Customize Tools Panel
    (Macintosh).

    3. Add the tool to the list of available tools.

    4. Click OK.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'You can embed JSAPI commands in ActionScript files using the MMExecute() command,
    in the Flash MX 2004 ActionScript Language Reference. However, the MMExecute()
    command has an effect only when it is used in the context of a custom user interface,
    such as a component inspector, or a SWF panel within the authorizing environment.
    Even from ActionScript, JSAPI commands have no effect in Flash Player or outside
    the surrounding environment.


    The JSAPI also contains number of methods to implement extensibility using a combination
    of JavaScript and C code. For more information, see Chapter 4, "C-Level Extensibility,"
    on page 369.


    Flash JSAPI objects contains properties and methods. Each defined as a primitive
    type such as Boolean, integer, array, float, or reference data types such as color,
    object, point, rect, and String, are used to describe the object. The methods
    used to perform a function on the objects to access the properties or methods
    of an object, dot notation is used. Also, most objects have getProperty() and
    setProperty() methods, which get the value for a specified property or set the
    value for a specified property. Most methods take parameters that are used to
    specify options for the method.


    The JavaScript interpreter in the Mozilla SpiderMonkey engine, version 1.5, is
    available on the web at http://www.mozilla.org/js/spidermonkey/. SpiderMonkey
    is one of the two implementations of the JavaScript language developed by Mozilla.org.
    It is the same engine that is embedded in the Mozilla browser.


    SpiderMonkey implements the entire JavaScript language as defined in the ECMA-262
    specification. With ECMA-262 Edition 3, Only the browser-specific host objects,
    which are not fully compliant with all of the ECMA-262, are not supported.


    All "Core JavaScript" sections of Netscape''s JavaScript documentation at http://devedge.netscape.com/central/javascript/
    apply to the Flash JavaScript interpreter. All "Client-Side JavaScript" sections
    do not apply because they only apply to browser environments.


    SpiderMonkey is also used in Fireworks MX 2004, Dreamweaver MX 2004, Director
    MX 2004 and Flash Communication Server MX.


    # The Flash Document Object Model


    The DOM for the Flash JavaScript API consists of a set of top-level functions
    ("Top-level functions" on page 25) and the top-level flash object. The flash authoring
    is guaranteed to be available to a script because it always exists when the Flash
    authoring environment is present. When referring to this object, you can use flash
    or fl. For example, to close all open files, you can use either of the following
    statements:


    ```

    flash.closeAll();nfl.closeAll();

    ```'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# The Flash object containing the following children:


    | Object | How to access |

    | --- | --- |

    | componentsPanel object | Use fl.componentsPanel to access the componentsPanel
    object. This object corresponds to the Components panel in the Flash authoring
    environment. |

    | Document object | Use fl.documents to retrieve an array of all the open documents;
    use fl.documents[Index] to access a particular document; use fl.getDocumentDOM()
    to access the current document (the one with focus). |

    | drawingLayer object | Use fl.drawingLayer to access the drawingLayer object.
    |

    | Effect object | Use fl.effects to retrieve an array of effect descriptors that
    corresponds to the effects when Flash starts; use fl.effects[index] to access
    a particular effect; use fl.activeEffect descriptor for the current effect being
    applied. |

    | Math object | Use fl.Math to access the Math object. |

    | outputPanel object | Use fl.outputPanel to access the outputPanel object. This
    object corresponds to the Output panel in the Flash authoring environment. |

    | Tools object | fl.tools is an object that has a toolObjs property. The toolObjs
    property is an array of toolObj objects. Each tool0bj object represents a tool
    in the Flash Tools. |

    | ToolObj object | Use fl.tools.toolObjs to retrieve an array of all tools (tools.toolObjs);
    use fl.tools.activeTool to access the currently active tool (tools.activeTool).
    |

    | XMLUI object | Use fl.xmlui to access an XML User Interface (XMLUI) object.
    The XMLUI object provides the ability to get and set properties of an XMLUI dialog
    box. |


    # The Document object


    An important property of the top-level flash object is the documents property.
    The Documents property contains an array of Document objects that represent one
    of the FLA files currently open in the authoring environment. The properties of
    each Document object represent most of the elements that a FLA file can contain.
    Therefore, a large portion of the DOM is composed of child objects and properties
    of the Document object.


    To refer to the first document, for example, use the statement flash.documents[0];
    or fl.documents[0]. The first document is the first document that was opened during
    the current session in the authoring environment. When the first opened document
    is closed, the indexes of the other open documents are necessarily.


    To find a particular document''s index use fl.findDocumentIndex(nameOfDocument).


    To access the document that is currently focused, use the statement flash.getDocumentDOM()
    or fl.getDocumentDOM(). The latter is the syntax used for the examples in this
    document.


    To find a particular document in the documents array, iterate through the array
    and test each document for its name property.'
  merge: -1
  pgno: 19
- img_proc: true
  md: "All objects in the DOM that aren't listed in the previous table (see \"The\
    \ Flash Object Model on page 19\") are accessed from the Document object. For\
    \ example, to access the library property of the Document object, which retrieves\
    \ a library object:\n\n```\nfl.getDocumentDOM().library\n```\n\nTo access an array\
    \ of items in the library, you use the items property of the Library object; each\
    \ element in the array is an Item object:\n\n```\nfl.getDocumentDOM().library.items\n\
    ```\n\nTo access a particular item in the library, you use a member of the items\
    \ array:\n\n```\nfl.getDocumentDOM().library.items[0]\n```\n\nIn other words,\
    \ the Library object is a child of the Document object, and the Item object is\
    \ a child of the Library object.\n\n# Specifying the target of an action\n\nUnless\
    \ otherwise specified, methods affect the current focus or selection. For example,\
    \ the following script doubles the size of the current selection no particular\
    \ object is specified:\n\n```\nfl.getDocumentDOM().scale(2, 2);\n```\n\nIn some\
    \ cases, you might want an action to specifically target the currently selected\
    \ item in the Flash document. To do this, use the Document.selection property\
    \ contains. The first element in the array represents the currently selected item,\
    \ as shown in the following example:\n\n```\nvar accDescription = fl.getDocumentDOM().selection[0].description;\n\
    ```\n\nThe following script doubles the size of the first element on the Stage\
    \ that is inside the element array, instead of the current selection:\n\n```\n\
    var element =\nfl.getDocumentDOM().Timeline.layers[0].frames[0].elements[0];\n\
    if (element) {\nelement.width = element.width*2;\nelement.height = element.height*2;\n\
    }\n```\n\nYou can also do something like loop through all the elements on the\
    \ Stage and increase the width and height by a specified amount, as shown in the\
    \ following example:\n\n```\nvar elementArray =\nfl.getDocumentDOM().Timeline.layers[0].frames[0].elements;\n\
    for (var i=0; i < elementArray.length; i++) {\n  var offset = 10;\nelementArray[i].width\
    \ += offset;\nelementArray[i].height += offset;\n}\n```"
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Summary of the DOM structure


    The following list displays the DOM structure in outline format. Numbers at the
    beginning of each line represent the level of an object. For example, an object
    preceded by "03" is a child of next highest "02" object, which in turn, is a child
    of the next highest "01"


    In some cases, an object is be accessed by specifying a property of its parent
    object. For example, the document.timelines property contains an array of Timeline
    objects. These properties are noted in the following outline:


    Finally, some objects are subclasses of other objects, rather than being children
    of other objects. An object that is a subclass of another object has methods and/or
    properties of its in addition to the methods and properties of the other object
    (the subclass). Subclasses share the same level in the hierarchy as their superclass.
    Relationships are introduced in the following outline:


    +   01 Top-level functions

    01 flash object

    02 ComponentsPanel object

    02 Document object (fl.documents array)

    03 Matrix object

