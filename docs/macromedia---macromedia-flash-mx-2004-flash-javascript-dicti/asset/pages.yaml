    # frame.elements


    # Availability


    Flash MX 2004.


    # Usage


    ```

    frame.elements

    ```


    # Description


    Read-only property; an array of Element objects (see Element object). The order
    of elements is the order which they are stored in the FLA file. If there are multiple
    shapes on the Stage, and each is ungrouped, Flash treats them as element. If each
    is grouped, so are multiple groups on the Stage, Flash sees them as separate elements.
    In other words, Flash treats raw, ungrouped shapes as a single element, regardless
    of how many separate shapes are on the Stage. If a frame contains three, ungrouped
    shapes, for example, then elements.length in frame returns a value of 1. Select
    each shape individually, and group it to around this issue.


    # Example


    The following example stores an array of current elements on the top layer, first
    frame in the myElements variable:


    ```

    var myElements =

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].elements;

    ```


