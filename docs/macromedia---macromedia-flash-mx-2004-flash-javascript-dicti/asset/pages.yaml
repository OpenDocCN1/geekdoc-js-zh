  md: '# JSBool_JS_ValueToObject


    # Usage


    JSBool JS_ValueToObject(JSContext *cx, javal v, JSObject *op);


    # Description


    Method; extracts an argument from a javal structure, converts it to an object
    (if possible), and passes the converted value back to caller. If the object is
    an array, use JS_GetArrayLength() and JS_GetElement() to read its contents.


    # Arguments


    JSContext *cx, javal v, JSObject **op


    +   * The cx argument is the opaque JSContext pointer that passes to the JavaScript
    function.

    * The v argument is the javal structure from which the object is extracted.

    * The op argument is a pointer to a JSObject pointer. This function stores the
    converted value in *op.


    # Returns


    A Boolean value: JS_TRUE indicates success; JS_FALSE indicates failure.


    # JSBool_JS_StringToValue


    # Usage


    JSBool JS_StringToValue(JSContext *cx, unsigned short *bytes, uint sz, javal *vp);


    # Description


    Method; stores a string return value in a javal structure. It allocates a new
    JavaScript string object.


    # Arguments


    JSContext *cx, unsigned short *bytes, size_t sz, javal *vp


    +   * The cx argument is the opaque JSContext pointer that passes to the JavaScript
    function.

    * The bytes argument is the string to be stored in the javal structure. The string
    is copied, so the caller frees the string when it is not needed. If the string
    size is not specified (see sz argument), the string must be null-terminated.

    * The sz argument is the size of the string, in bytes. If sz is 0, the length
    of the null-terminated string is computed automatically.

    * The vp argument is a pointer to the javal structure into which the contents
    of the string should be copied.


    # Returns


    A Boolean value: JS_TRUE indicates success; JS_FALSE indicates failure.'
