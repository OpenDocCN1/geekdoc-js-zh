  md: '# outputPanel object


    # Availability


    Flash MX 2004.


    # Description


    This object represents the Output panel, which displays troubleshooting information
    such as syntax errors. To access this object, use `fl.outputPanel` (or `flash.outputPanel`).


    # Method summary for the outputPanel object


    The outputPanel object uses the following methods.


    | Method | Description |

    | --- | --- |

    | outputPanel.clear() | Method; clears the contents of the Output panel. |

    | outputPanel.save() | Method; saves the contents of the Output panel to a local
    text file, in UTF-8 encoding. |

    | outputPanel.trace() | Method; adds a line to the contents of the Output panel,
    terminated by a new line. |


    # outputPanel.clear()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    outputPanel.clear()

    ```


    # Parameters


    None.


    # Returns


    Nothing.


    # Description


    Method; clears the contents of the Output panel. You can use this method in a
    batch processing application to clear a list of errors, or to save them incrementally
    by using this method with `outputPanel.save()`.


    # Example


    The following example clears the current contents of the Output panel:


    ```

    fl.outputPanel.clear();

    ```'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# outputPanel.save()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    outputPanel.save(fileURI [, bAppendToFile])

    ```


    # Parameters


    fileURI A string that specifies the local file to contain the Output panel’s contents.


    bAppendToFile optional parameter, if it has a value of true, appends the Output
    panel’s contents to the output file. If bAppendToFile is false, the method overwrites
    the output file if it already exists. The default value is false.


    # Returns


    Nothing.


    # Description


    Method; saves the contents of the Output panel to a local text file, in UTF-8
    encoding. The local filename must be specified as a URI. You can also specify
    that the contents are appended to the contents of a local file, rather than being
    overwritten. If the URI is invalid or unspecified, an error is reported.


    This method is useful for batch processing. For example, you can create a JSFL
    file that compiles several components. Any compile errors appear in the Output
    panel, and you can use this method to save the resulting errors to a text file,
    which can be automatically parsed by the build system in use.


    # Example


    The following example saves the Output panel’s contents to the batch.log file
    in the /tests folder:

    fl.outputPanel.save("file:///c|tests/batch.log");


    # outputPanel.trace()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    outputPanel.trace(message)

    ```


    # Parameters


    The message parameter is a string that contains the text to add to the Output
    panel.


    # Returns


    Nothing.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Description


    Method; adds a line to the contents of the Output panel, terminated by a new line.
    This method shows the Output panel if it is not already visible.


    The outputPanel.trace() method duplicates the functionality of fl.trace().


    # Example


    The following example writes "hello world" to the Output panel:


    ```

    fl.outputPanel.trace("hello world");

    ```'
  merge: -1
