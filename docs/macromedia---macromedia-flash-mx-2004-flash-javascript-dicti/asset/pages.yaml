    The SoundItem object is a subclass of the Item object. It represents a library
    item used to create a sound. See also frame.soundLibraryItem.


    # Property summary for the SoundItem object


    In addition to the Item object, the following properties are available for the
    SoundItem object:


    | Property | Description |

    | --- | --- |

    | soundItem.bitRate | A string that specifies the bit rate of a sound in the library.
    Available only for the MP3 compression type. |

    | soundItem.bits | A string that specifies the bits value for a sound in the library
    that has ADPCM. Acceptable values are "2 bit", "3 bit", "4 bit", and "5 bit" when
    the type of compression is ADPCM. |

    | soundItem.compressionType | A string that specifies the type for a sound in
    the library. Acceptable values are "Default", "ADPCM", "MP3", "Raw", and "Speech".
    |

    | soundItem.convertStereoMono | A Boolean value available only for MP3 and Raw
    compression types. |

    | soundItem.quality | A string that specifies the playback quality of a sound
    in the library. Available only for MP3 compression type. |

    | soundItem.sampleRate | Available only for ADPCM, Raw, and Speech compression
    types. |

    | soundItem.useImportedMP3Quality | A Boolean value; if true, all other properties
    are ignored and the imported MP3 quality is used. |


    # soundItem.bitRate


    # Availability


    Flash MX 2004.


    # Usage


    ```

    soundItem.bitRate

    ```'
