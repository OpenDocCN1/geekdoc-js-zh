  md: '# Layer object


    # Availability


    Flash MX 2004.


    # Description


    The Layer object represents a layer in the Timeline. The timeline.layers property
    contains an array of Layer objects, which can be accessed by fl.getDocumentDOM().getTimeline().layers.


    # Property summary for the Layer object


    The following properties are available for the Layer object:


    | Property | Description |

    | --- | --- |

    | layer.color | Property; a string that specifies the color assigned to outline
    the layer. |

    | layer.frameCount | Read-only; an integer that specifies the number of frames
    in the layer. |

    | layer.frames | Read-only, an array of Frame objects. |

    | layer.height | Property; an integer that specifies the percentage layer height;
    equivalent to the Layer height value in the Layer Properties dialog box. |

    | layer.layerType | Property; a string that specifies the current use of the layer;
    equivalent to the Type setting in the Layer Properties dialog box. |

    | layer.locked | Property; a Boolean value that specifies the locked status of
    the layer. |

    | layer.name | Property; a string that specifies the name of the layer. |

    | layer.outline | Property; a Boolean value that specifies the status of all objects
    on the layer. |

    | layer.parentLayer | Property; a Layer object that represents the layer''s containing
    folder, guiding, masking layer. |

    | layer.visible | Property; a Boolean value that specifies whether the layer''s
    objects on the Stage are shown or hidden. |


