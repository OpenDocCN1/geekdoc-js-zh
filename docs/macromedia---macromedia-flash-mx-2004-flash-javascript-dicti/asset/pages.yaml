  md: '# Description


    Property: an integer that specifies the amount of easing that should be applied
    to the tweened object. Valid values are -100 to 100. To begin the motion slowly
    and accelerate the tween toward the end of the animation, a value between -1 and
    -100. To begin the motion rapidly and accelerate the tween toward the end of the
    animation, a positive value between 1 and 100.


    # Example


    The following example specifies that the motion of the tweened object should begin
    fairly rapidly and accelerate the end of the animation:


    ```

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].tweenEasing = 50;

    ```


    # frame.tweenType


    # Availability


    Flash MX 2004.


    # Usage


    ```

    frame.tweenType

    ```


    # Description


    Property: a string that specifies the type of tween; valid values are "motion",
    "shape", or "none". The value "none" removes the motion tween. Use the timeline.createMotionTween()
    to create a tween.


    If you specify "motion", the object in the frame must be a symbol, text field,
    or grouped object. It will be tweened from its location in the current keyframe
    to the location in the following keyframe.


    If you specify "shape", the object in the frame must be a shape. It will blend
    from its shape in the current keyframe to the shape in the following keyframe.


    # Example


    The following example specifies that the object is a motion tween, and therefore,
    it should be tweened from its location in the current keyframe to the location
    in the following keyframe:


    ```

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].tweenType = "motion";

    ```'
