  md: '# library object


    Availability

    Flash MX 2004.


    Description

    The library object represents the Library panel. It is a property of the Document
    object (see document.library) and can be accessed by f1.getDocumentDOM().library.


    # Method summary for the library object


    The following methods are available for the library object:


    | Method | Description |

    | --- | --- |

    | library.addItemToDocument() | Method; adds the current or specified item to
    the Stage at the specified position. |

    | library.addNew() | Method; creates a new item of the specified type in the Library
    panel and sets the new item to the currently selected item. |

    | library.deleteItem() | Method; deletes the current items or a specified item
    from the Library panel. |

    | library.duplicateItem() | Method; makes a copy of the currently selected or
    specified item. |

    | library.editItem() | Method; opens the currently selected or specified item
    in Edit mode. |

    | library.expandFolder() | Method; expands or collapses the currently selected
    or specified folder in the library. |

    | library.findFieldIndex() | Method; returns the library item''s index value (zero-based).
    |

    | library.getProperty() | Method; gets the property for the selected item. |

    | library.getItemType() | Method; gets the type of object currently selected or
    specified by a library path. |

    | library.getSelected() | Method; gets the array of all selected items in the
    library. |

    | library.importEmbeddedSWF() | Method; imports a Shockwave (SWF) file into the
    library as a compiled clip. |

    | library.itemExists() | Method; checks if a specified item exists in the library.
    |

    | library.moveToFolder() | Method; moves the currently selected or specified library
    item to a specified folder. |

    | library.newFolder() | Method; creates a new folder with the specified name,
    or a default name ("untitled folder #") if no folderName is provided, in the currently
    selected folder. |

    | library.renameItem() | Method; renames the currently selected library item in
    the Library panel. |'
