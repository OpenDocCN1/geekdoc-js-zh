  md: '# bitmapItem.compressionType


    Availability


    Flash MX 2004.


    Usage


    bitmapItem.compressionType


    Description


    Property: a string that determines the type of image compression applied to the
    bitmap. Acceptable values are "photo" or "lossless". If bitmapItem.useImportedJPEGQuality
    is false, "photo" corresponds to JPEG using a quality from 0 to 100; if bitmapItem.useImportedJPEGQuality
    is true, "photo" corresponds to JPEG using the default quality value. The value
    "lossless" corresponds to GIF or PNG formats.


