  md: '# bitmapInstance.getBits()


    Availability

    Flash MX 2004.


    Usage

    bitmapInstance.getBits()


    Parameters

    None.


    Returns

    An object that contains width, height, depth, bits, and, and if the bitmap has
    a color table, cTab properties. The bits element is an array of bytes. The cTab
    element is an array of color values of the form "rrggbb". The length of the array
    is the length of the color table.


    > Note: The byte array is meaningful only when referenced by an external library.
    You typically use it only when creating an extensible tool or effect.


