  md: '# Frame object


    Availability


    Flash MX 2004.


    Description


    The Frame object represents frames in the layer.


    # Property summary for the Frame object


    The following properties can be used with the Frame object:


    | Property | Description |

    | --- | --- |

    | frame.actionScript | a string representing ActionScript code. |

    | frame.duration | Read-only: an integer that represents the number of frames
    in a frame sequence. |

    | frame.elements | Read-only: an array of objects (see Element object). |

    | frame.labelType | Property: a string that specifies the type of Frame. |

    | frame.motionTweenOrientPath | Property: A Boolean value; specifies how the tweened
    element rotates as it moves along a path to maintain its angle with respect to
    each point on the path (true) or whether it does not rotate (false). |

    | frame.motionTweenRotate | Property: a string that specifies how the tweened
    element rotates. |

    | frame.motionTweenRotateTimes | Property: an integer that specifies the number
    of times the tweened element rotates between the starting keyframe and the next
    keyframe |

    | frame.motionTweenScale | Property: A Boolean value; specifies how the tweened
    element scales to the size of the object in the following keyframe, increasing
    its size with each frame in the tween (true) or doesn''t scale (false). |

    | frame.motionTweenSnap | Property: A Boolean value; specifies whether the tweened
    element automatically snaps to the nearest point on the motion guide layer with
    this frame''s layer (true) or not (false). |

    | frame.motionTweenSync | Property: A Boolean value; if set to true, synchronizes
    the animation of the tweened object with the Main timeline. |

    | frame.name | Property: a string that specifies the name of the frame. |

    | frame.shapeTweenBlend | Property: a string that specifies how a shape is blended
    between the shape in the keyframe at the start of the tween and the shape in the
    following keyframe. |

    | frame.soundEffect | Property: a string that specifies effects for a sound that
    is attached directly to a frame (frame.soundLibraryItem). |'
