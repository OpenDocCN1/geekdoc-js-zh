  md: '# # CHAPTER 3 Objects


    This chapter describes the Flash JSAPI objects, listed in alphabetical order.
    The objects are listed in the following table:


    | Object | Description |

    |---|---|

    | BitmapInstance object | The BitmapInstance object is a subclass of the Instance
    object and represents a bitmap in a frame. |

    | BitmapItem object | A Bitmap object refers to a bitmap of a document. The Bitmap
    object is a subclass of the Item object. |

    | CompiledClipInstance object | The CompiledClipInstance object is a subclass
    of the Instance object. |

    | ComponentInstance object | The ComponentInstance object is a subclass of the
    Symbol object and represents a component in a frame. |

    | componentsPanel object | The ComponentsPanel object, which represents the Components
    panel, is a property of the flash object and can be accessed by componentsPanel.
    |

    | Contour object | A Contour object represents a closed path of half edges on
    the boundary of a shape. |

    | Document object | The Document object represents the Stage. |

    | drawingLayer object | The drawingLayer object is accessible from JavaScript
    as a child of the flash object. |

    | Edge object | The Edge object represents an edge of a Stage. |

    | Effect object | The Effect object represents an instance of a Timeline effect.
    |

    | Element object | Everything that appears on the Stage is the type Element. |

    | EmbeddedVideo object | The EmbeddedVideo object is a subclass of the Instance
    object. |

    | Fill object | The Fill object contains all the properties of the Fill color
    setting of the Tools panel or of a selected shape. |

    | flash object | The flash object represents the Flash application. |

    | folderItem object | The folder object is a subclass of the Item object. |'
  merge: -1
