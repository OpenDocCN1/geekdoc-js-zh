  md: '# Description


    Read-only property; an integer that represents the number of frames in a frame
    sequence.


    # Example


    The following example stores the number of frames in a frame sequence that starts
    at first frame

    the top layer in the `frameSpan` variable:


    ```

    var frameSpan =

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].duration;

    ```


    # frame.elements


    # Availability


    Flash MX 2004.


    # Usage


    frame.elements


    # Description


    Read-only property; an array of Element objects (see Element object). The order
    of elements is

    the in which they are stored in the FLA file. If there are multiple shapes on
    the Stage, and

    each is ungroup, Flash treats them as one element. If each is grouped, so there
    are

    multiple groups on the Stage, Flash sees them as separate elements. In other words,
    Flash treats

    raw, ungrouped shapes as a single element, regardless of how many separate shapes
    are on

    Stage. If a frame contains three raw, ungrouped shapes, for example, then elements.length
    in

    frame returns a value of 1. Select each shape individually, and group it to around
    this

    issue.


    # Example


    The following example stores an array of current elements on the top layer, first
    frame in

    myElements variable:


    ```

    var myElements =

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].elements;

    ```


    # frame.labelType


    # Availability


    Flash MX 2004.


    # Usage


    frame.labelType


    # Description


    Property; a string that specifies the type of Frame name. Valid values are "none",
    "name",

    "comment", and "anchor". Setting a label to "none" clears the frame.name property.'
