  md: '# Description


    Property: an integer that specifies the amount of easing that should be applied
    to the tweened object. Valid values are -100 to 100. To begin the motion tween
    slowly and accelerate the tween toward the end of the animation, a value between
    -1 and -100. To begin the motion rapidly and accelerate the tween toward the end
    of the animation, a positive value between 1 and 100.


    # Example


    The following example specifies that the motion of the tweened object should begin
    fairly rapidly and decelerate toward the end of the animation:


    ```

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].tweenEasing = 50;

    ```


    # frame.tweenType


    # Availability


    Flash MX 2004.


    # Usage


    ```

    frame.tweenType

    ```


    # Description


    Property: a string that specifies the type of tween; valid values are "motion",
    "shape", or "none". The value "none" removes the motion tween. Use the timeline.createMotionTween()
    to create a tween.


    If you specify "motion", the object in the frame must be a symbol, text field,
    or grouped object. It will be tweened from its location in the current keyframe
    to the location in the following keyframe.


    If you specify "shape", the object in the frame must be a shape. It will blend
    from its shape in the current keyframe to the shape in the following keyframe.


    # Example


    The following example specifies that the object is a motion tween, and therefore,
    it should be tweened from its location in the current keyframe to the location
    in the following keyframe:


    ```

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].tweenType = "motion";

    ```'
  merge: -1
  pgno: 193
- img_proc: false
  md: '# HalfEdge object


    # Availability


    Flash MX 2004.


    # Description


    The HalfEdge object is the directed side of the edge of a Shape object. An edge
    has two half edges. You can traverse the contours of a shape by "walking around"
    these edges. For example, starting from a half edge, you can visit all half edges
    around a contour of a shape, and return to the original half edge.


    Half edges are ordered. One half edge represents one side of the edge; the other
    half represents the other side.


    # Method summary for the HalfEdge object


    The methods are available for the halfEdge object:


    | Method | Description |

    | --- | --- |

    | halfEdge.getEdge() | Gets the Edge object for the halfEdge object. |

    | halfEdge.getNext() | Gets the next half edge on the current contour. |

    | halfEdge.getOppositeHalfEdge() | Gets the halfEdge object on the other side
    of the edge. |

    | halfEdge.getPrev() | Gets the preceding half edge on the current contour. |

    | halfEdge.getVertex() | Gets the Vertex object at the head of the halfEdge object.
    |


    # Property summary for the HalfEdge object


    The following properties are available for the halfEdge object:


    | Property | Description |

    | --- | --- |

    | halfEdge.id | Read-only; a unique integer identifier for the halfEdge object.
    |


    # HalfEdge.getEdge()


    # Availability


    Flash MX 2004.


    # Usage


    ```

    halfEdge.getEdge()

    ```


    # Parameters


    None.


    # Returns


    An Edge object.'
