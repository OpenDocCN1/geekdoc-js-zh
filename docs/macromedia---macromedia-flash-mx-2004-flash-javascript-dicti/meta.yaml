  md: 'Description

    Property: an integer value that specifies the number of times a sound that is
    attached directly to a

    frame (frame.soundLibraryItem) plays. If you want to specify a value for this
    property, set

    frame.soundLoopMode to "repeat".


    Example


    See frame.soundLoopMode.


    # frame.soundLoopMode


    Availability


    Flash MX 2004.


    Usage


    frame.soundLoopMode


    Description


    Property: a string that specifies whether a sound that is attached directly to
    a frame

    (frame.soundLibraryItem) should play a specific number of times or loop indefinitely.
    Valid

    values are "repeat" and "loop". To specify the number of times the sound should
    play, set a

    value for frame.soundLoop.


    Example


    The following example specifies that a sound should play two times:


    ```

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].soundLoopMode =

    "repeat";

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].soundLoop = 2;

    ```


    # frame.soundName


    Availability


    Flash MX 2004.


    Usage


    frame.soundName


    Description


    Property: a string that specifies the name of a sound that is attached directly
    to a frame

    (frame.soundLibraryItem), as stored in the library.


    Example


    The following example changes the soundName property of the first frame to "song1.mp3";

    song1.mp3 must exist in the library:


    ```

    fl.getDocumentDOM().getTimeline().layers[0].frames[0].soundName = "song1.mp3";

    ```'
