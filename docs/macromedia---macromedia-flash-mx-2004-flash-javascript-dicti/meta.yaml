    value of "noFill".


    If this value is "linearGradient" or "radialGradient", the properties fill.colorArray
    and fill.posArray are also available.


    Example


    The following example specifies the colors to use in a gradient for the current
    selection:


    ```

    var fill = fl.getDocumentDOM().setCustomFill();

    fill.style="linearGradient";

    fill.colorArray = [ 0x00ff00, 0xff0000, 0x0000ff ];

    fill.posArrayArray = [ 0, 100, 200];

    fl.getDocumentDOM().setCustomFill( fill );

    ```'
