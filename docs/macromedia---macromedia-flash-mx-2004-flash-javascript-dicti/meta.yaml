  md: '# Summary of the DOM structure


    The following list displays the DOM structure in outline format. Numbers at the
    beginning of each line represent the level of an object. For example, an object
    preceded by "03" is a child of next highest "02" object, in turn, is a child of
    the next highest "01" object.


    In some cases, an object is available by specifying a property of its parent object.
    For example, the document.timelines property contains an array of Timeline objects.
    These properties are noted in the following outline:


    Finally, some objects are subclasses of other objects, rather than being children
    of other objects. An object that is a subclass of another object has methods and/properties
    of its own in addition to the methods and properties of the other object (the
    superclass). Subclasses share the same level in the hierarchy as their superclass.
    Relationships are introduced in the following outline:


    +   01 Top-level functions

    01 flash object

    02 ComponentsPanel object

    02 Document object (fl.documents array)

    03 Matrix object

    03 Fill object

    03 Stroke object

    04 Library object

    04 Item object (library.Items array)

    04 Bitmap object (subclass of Item object)

    04 Folder object (subclass of Item object)

    04 Fontitem object (subclass of Item object)

    04 Sounditem object (subclass of Item object)

    04 Symbolitem object (subclass of Item object)

    04 Video object (subclass of Item object)

    03 Timeline object (document.timelines array)

    04 Layer object (timeline.layers array)

    05 Frame object (layer.frames array)

    06 Element object (element.matrix)

    07 Matrix object (Element.matrix)

    06 Instance object (abstract class, subclass of Element object)

    06 BitmapInstance object (subclass of Instance object)

    06 CompiledClip object (subclass of Instance object)

    06 ComponentInstance object (subclass of SymbolInstance object)

    07 Parameter object (Element.parameters)

    06 EmbeddedVideo object (subclass of Instance object)

    06 LinkedVideo object (subclass of Instance object)

    06 SymbolInstance object (subclass of Instance object)

    06 Text object (subclass of Element object)

    07 TextRun object (text.textRuns array)

    08 TextAttrs object (textRun.textAttrs array)

    06 Shape object (subclass of Element object)

    07 Contour object (shape.contours array)

    08 Halfedge object

    09 Vertex object

    09 Edge object

    07 Edge object (shape.edges array)

    08 HalfEdge object'
