  md: '# flash object


    Availability


    Flash MX 2004.


    Description


    The flash object represents the Flash application.


    # Method summary for the flash object


    The following methods can be used with the flash object.


    | Method | Description |

    | --- | --- |

    | fl.browseURL() | Opens a File Open or Save system dialog box and lets the user
    specify a file to be opened or saved. |

    | fl.closeAll() | Closes all open documents, displaying the Save As dialog box
    for any documents that were not previously saved. |

    | fl.closeDocument() | Closes the specified document. |

    | fl.createDocument() | Opens a new document and selects it. |

    | fl.enableImmediateUpdates() | Lets the script developer enable immediate visual
    updates of the Timeline when executing effects. |

    | fl.fileExists() | Checks whether a file already exists on. |

    | fl.findDocumentIndex() | Finds the index of an open document with the specified
    name. |

    | fl.getDocumentDOM() | Retrieves the DOM (Document object) of the currently active
    document. |

    | fl.mapPlayerURL() | Maps an escaped Unicode URL to a UTF-8 or MCBS URL. |

    | fl.openDocument() | Opens a Flash (FLA) document for editing in a new Flash
    window and gives it the focus. |

    | fl.openProject() | Opens a Flash Project (FLP) file in the authoring tool for
    editing. |

    | fl.openScript() | Opens a script (JSFL, ASC) or other file (XML, TXT) in the
    Flash text editor. |

    | fl.quit() | Quits Flash, prompting the user to save any changed documents. |

    | fl.reloadEffects() | Reloads all effects defined in the user''s Configuration
    Effects folder. |

    | fl.reloadTools() | Rebuilds the toolbar from toolconfig.xml file. Used only
    when creating extensible tools. |

    | fl.revertDocument() | Reverts the specified FLA document to its last saved version.
    |

    | fl.runScript() | Executes a JavaScript file. |

    | fl.saveAll() | Saves all open documents, displaying the Save As dialog box for
    any documents that were not previously saved. |

    | fl.saveDocument() | Saves the specified document as a FLA document. |'
