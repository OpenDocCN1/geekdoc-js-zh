  md: "All the objects in the DOM that aren't listed in the previous table (see \"\
    The Flash Object Model\" on page 19) are accessed from the Document object. For\
    \ example, to use the library property of the Document object, which retrieves\
    \ a library object:\n\n```\nfl.getDocumentDOM().library\n```\n\nTo access the\
    \ items in the library, you use the items property of the Library object; each\
    \ element in the array is an Item object:\n\n```\nfl.getDocumentDOM().library.items\n\
    ```\n\nTo access a particular item in the library, you specify a member of the\
    \ items array:\n\n```\nfl.getDocumentDOM().library.items[0]\n```\n\nIn other words,\
    \ the Library object is a child of the Document object, and the Item object is\
    \ a child of the Library object.\n\n# Specifying the target of an action\n\nUnless\
    \ otherwise specified, methods affect the current focus or selection. For example,\
    \ the following script doubles the size of the current selection because no particular\
    \ object is specified:\n\n```\nfl.getDocumentDOM().scaleSelection(2, 2);\n```\n\
    \nIn some cases, you might want an action to specifically target the currently\
    \ selected item in the Flash document. To do this, use the Document.selection\
    \ property. The first element in the array represents the currently selected item,\
    \ as shown in the following example:\n\n```\nvar accDescription = fl.getDocumentDOM().selection[0].description;\n\
    ```\n\nThe following script doubles the size of the first element on the Stage\
    \ that is in the element array, instead of the current selection:\n\n```\nvar\
    \ element =\nfl.getDocumentDOM().Timeline.layers[0].frames[0].elements[0];\nif\
    \ (element) {\nelement.width = element.width*2;\nelement.height = element.height*2;\n\
    }\n```\n\nYou can also do something like loop through all the elements on the\
    \ Stage and increase the width and height by a specified amount, as shown in the\
    \ following example:\n\n```\nvar elementArray =\nfl.getDocumentDOM().Timeline.layers[0].frames[0].elements;\n\
    for (var i=0; i < elementArray.length; i++) {\n  var offset = 10;\n  elementArray[i].width\
    \ += offset;\n  elementArray[i].height += offset;\n}\n```"
  merge: -1
