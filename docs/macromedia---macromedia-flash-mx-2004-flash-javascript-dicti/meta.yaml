  md: '# Item object


    Availability


    Flash MX 2004.


    Description


    The Item object is an abstract base class. Anything in the library derives from
    Item. See also library object.


    # Method summary for the Item object


    The following methods are available for the Item object.


    | Method | Description |

    | --- | --- |

    | item.addData() | Method; adds specified data to a library item. |

    | item.getData() | Method; retrieves the value of the specified data. |

    | item.hasData() | Method; determines whether the library item has the named data.
    |

    | item.removeData() | Method; removes persistent data from the library item. |


    # Property summary for the Item object


    The following properties are available for the Item object.


    | Property | Description |

    | --- | --- |

    | item.item | Read-only; a string that specifies the type of element. |

    | item.linkageClassName | Property; a string that specifies the ActionScript 2.0
    class that will be associated with the symbol. |

    | item.linkageExportForAS | Property; a Boolean value. If true, the item is exported
    for ActionScript. |

    | item.linkageExportForRS | Property; a Boolean value. If true, the item is exported
    for runtime sharing. |

    | item.linkageExportInFirstFrame | Property; a Boolean value. If true, the item
    is exported in the first frame. |

    | item.linkageIdentifier | Property; a string that specifies the Flash will use
    to identify the asset when linking to the destination SWF file. |

    | item.linkageImportForRS | Property; a Boolean value. If true, the item is imported
    for runtime sharing. |

    | item.linkageURL | Property; a string that specifies the URL where the SWF file
    containing the shared asset is located. |

    | item.name | Property; a string that specifies the name of the library item,
    which includes the folder structure. |'
