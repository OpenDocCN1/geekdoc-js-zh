    null;


    undefined;  // be careful -- undefined can be redefined!


    The conditional code


    This is only applicable when you want to run a large amount of code as long as
    certain conditions apply. Here, you will use Flow control through if and else
    blocks. Here is an example in a flow control:


    var foo = right;


    var bar = wrong;


    if (bar) {


