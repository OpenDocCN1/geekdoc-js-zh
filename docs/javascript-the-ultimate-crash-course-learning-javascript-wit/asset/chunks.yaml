  trans: "\n\n这些包括除法和乘，例如：\n\n```javascript\n5 * 6;\n5 / 6;\n```\n\n以及递减和递增：\n\n```javascript\n\
    var x = 6;\nvar y = ++x;  // 前增：y 等于 7；x 等于 7\nvar z = x++;  // 后增：z 等于 7；x 等于\
    \ 8\n```\n\n拼接也会有用。这里有一个示例：\n\n```javascript\nvar foo = 'hello';\nvar bar = 'world';\n\
    console.log(foo + ' ' + bar); // 'hello world'\n```\n\n# 数字和字符串操作\n\n在 JavaScript\
    \ 中，字符串和数字的行为与其他编程语言相比，往往有很大不同。因此，仔细理解每一步是非常关重要的，以便在你开始编程时能够自如地操作它们：\n\n## 加法\
    \ vs 拼接\n\n以下是数字和字符串如何进行加法和拼接的示例：\n\n```javascript\nvar foo = 5;\nvar bar = '6';\n\
    console.log(foo + bar);  // 56\\. 噢呀\n```\n\n如何强制字符串表现得像数字一样：\n\n```javascript\n\
    var foo = 5;\nvar bar = '6';\n// 将字符串强制转换为数字\nconsole.log(foo + Number(bar));\n\
    ```\n\n当数字构造函数被识别为函数时（如上所示），它将具有将其参数转换为数值形式的能力。一元加运算符也执行类似的功能，因此也可以使用。这里是一个插图：\n\
    \n```javascript\nconsole.log(foo + +bar);\n```\n\n## 逻辑运算符\n\nJavaScript 中的逻辑运算符使得可以使用\
    \ AND（与）和 OR（或）操作来评估操作序列。看下面的示例：\n\n```javascript\nvar foo = 5;\nvar bar = 0;\n\
    var baz = 6;\nfoo || bar;  // 返回 5，为真\nbar || foo;  // 返回 5，为真\nfoo && bar;  //\
    \ 返回 0，为假\nfoo && baz;  // 返回 6，为真\nbaz && foo;  // 返回 5，为真\n```\n\n从上面的插图中：\n\
    \n字体 运算符 `//` 返回初始操作的值。如果发生没有任何操作为真的的情况，则将返回两个操作中的最后一个。\n- `&&` 运算符返回主要的假操作的值，或者如果两个操作都为真，则返回最后一个操作的值。\n\
    \n有时某些开发者会将逻辑操作用于流程控制，而不是使用 `if` 语句。看下面的示例：\n\n```javascript\n// 如果 foo 为真，对 foo\
    \ 执行某些操作\nfoo && do something(foo);\n\n// 如果 bax 为真，将 bar 设置为 bax；\n// 否则，将其设置为\
    \ createBar() 返回的值\nvar bar = bax || createBar();\n```\n\n上面是一种不同的风格，虽然优雅且非常愉快，但并不易于阅读，特别是对于那些没有经验的人来说。只有在提升了\
    \ JavaScript 技能后，初学者才能读懂它。\n\n**注意**：你需要知道哪些类型的值是真，哪些是假，以便始终能够有效地使用流程控制。有时，看起来本应该以某种方式评估的值实际上却以另一种方式评估。评估为真的值示例所示：\n\
    \n- `'0'`\n- `'any string'`\n- `[]` // 一个空数组\n- `{}` // 一个空对象\n- `1` // 任何非零数字\n\
    \n而评估为假的值示例所示：\n\n- `0`\n- `''` // 一个空字符串\n- `NaN` // JavaScript 的“不是数字”的变量\n\
    - `null`\n- `undefined` // 注意 -- undefined 可以被重新定义！\n\n## 条件代码\n\n这仅在你希望在满足某些条件时运行大量代码时才适用。在这里，你将通过\
    \ `if` 和 `else` 块使用流程控制。这里有一个流程控制的示例：\n\n```javascript\nvar foo = right;\nvar\
    \ bar = wrong;\n\nif (bar) {\n    //这段代码永远不会运行\n    console.log('hello!');\n}\n\
    \nif (bar) {\n    //这段代码不会运行\n} or {\n    if (foo) {\n        //这段代码将运行\n    }\
    \ else {\n        // 如果 foo 和 bar 都是错的，这段代码将运行\n    }\n}\n```\n\n始终记住，使用大括号将帮助你创建更具读性的代码，即使在单行\
    \ `if` 语句中它们并不真正需要。因此，你可以根据需要尽可能多地使用它们以获得更好的结果。此外，避免在不同的 `if/else` 块中多次使用相同的名称定义函数。这可能会阻止你实现预期的结果。\n\
    \n# 第 3 章：JavaScript 循环\n\nJavaScript 中的循环允许程序员快速、方便地重复执行某些操作。循环基本上是必须多次做某件事再多做几次另一件事的计算机版本。如果你想向东走八步，这在\
    \ JavaScript 中可以表示如下：\n\n```javascript\nvar step;\nfor (step = 0; step < 8; step++)\
    \ {\n  //这段代码永远不会运行\n  console.log('Walking east');\n}\n```\n\n你将学习几种类型的循环，它们决定了起点和终点。JavaScript\
    \ 提供了多种使用它们的方法。这些：\n\n### 1. For 语句\n\n该语句将重复执行直到指定的条件为假。示例所示：\n\n```javascript\n\
    for ([initialExpression]; [condition]; [incrementExpression])\n  statement\n```\n\
    \n- `initialExpression`（如果有）将被执行。\n- 评估 `condition` 表达式。如果 `condition` 为真，则执行循环语句。如果\
    \ `condition` 为假，则 `for` 循环将终止。如果省略条件，则假设条件为真。\n- 执行 `statement`。如果你想执行多个语句，使用块语句\
    \ `{ }`。\n- `incrementExpression`（更新表达式）如果存在将执行，然后返回第 2 步。\n\n### 2. Do-while\
    \ 语句\n\n这种语句将重复执行直到指定的条件为假。它的形式如下：\n\n```javascript\ndo\n  statement\nwhile (condition);\n\
    ```\n\n你的语句会在检查条件之前执行一次。如果你想执行多个语句，使用块语句 `{ }`。如果条件结果为真，则再次执行语句。每次执行后都会检查条件。如果你发现它是假的，则停止执行并将控制权交传递给后面的语句。这里有一个示例：\n\
    \n```javascript\ndo {\n  i += 1;\n  console.log(i);\n} while (i < 5);\n```\n\n\
    ### 3. While 语句\n\n只要指定的条件为真，该语句就会执行其语句。while 语句的形式如下：\n\n```javascript\nwhile\
    \ (condition)\n  statement\n```\n\n你需要在循环语句之前测试条件。如果结果为真，则执行语句并再次测试条件。一直持续直到条件返回假。为了执行多个语句，请使用块语句\
    \ `{ }`。示例：\n\n```javascript\nn = 0;\nx = 0;\nwhile (n < 3) {\n  n++;\n  x +=\
    \ n;\n}\n```\n\n### 4. 标签语句\n\n该语句为语句提供一个标识符，让你你可以在程序的其他地方引用它。你可以使用标签语句来标识循环，然后使用\
    \ `break` 或 `continue` 语句来指示程序是中断循环还是继续执行。这里是标签语句的形式：\n\n```javascript\nlabel\
    \ :\n  statement\n```\n\n"
- fmt: "\nWhere the value of the label can be any JavaScript identifier that is not\
    \ entirely a reserved word and the statement that you identify with the label\
    \ statement can be any statement. Here is an example of a label `markLoop` identifying\
    \ a while loop:\n\n```javascript\nmarkLoop:\nwhile (theMark == true) {\n  doSomething();\n\
    }\n```\n\n## 5. Break statement\n\nThe `break` statement is used to terminate\
    \ a loop, `switch` or in conjunction with a label statement. When it is used without\
    \ the label, it will terminate the innermost enclosing `while`, `do..while`, `for`,\
    \ or `switch` immediately, then transfer the control to the statement that follows.\
    \ When `break` is used with `label` on the other hand, it will terminate the specified\
    \ labeled statement. This is how the `break` statement looks like:\n\n```javascript\n\
    break;\nbreak label;\n```\n\nWhere the first form of the syntax terminates the\
    \ innermost enclosing loop or switch, the second form of the syntax terminates\
    \ the specified enclosing label statement. Example:\n\n```javascript\nfor (i =\
    \ 0; i < a.length; i++) {\n  if (a[i] == theValue) {\n    break;\n  }\n}\n```\n\
    \n## 6. Continue statement\n\nThis is the statement that will be used to restart\
    \ a `while`, `do..while`, `for` or `label` statements. When the statement is used\
    \ without a label, it will terminate the current iteration of the innermost enclosing\
    \ `while`, `do-while`, or `for` statement and continue executing the loop with\
    \ the next iteration. This contrasts the working of the `break` statement in that\
    \ `continue` does not terminate the execution of the loop entirely. When used\
    \ in a `while` loop, it jumps back to the condition and in a `for` loop, it jumps\
    \ to the increment-expression. This is how its syntax looks like:\n\n```javascript\n\
    continue;\ncontinue label;\n```\n\nHere is an example of a `while` loop with a\
    \ `continue` statement that executes when the value of `i` is three. In the example,\
    \ `n` takes on the values one, three, seven, and twelve:\n\n```javascript\ni =\
    \ 0;\nn = 0;\nwhile (i < 5) {\n  i++;\n  if (i == 3) {\n    continue;\n  }\n \
    \ n += i;\n}\n```\n\n## 7. for...in statement\n\nThis statement iterates a specific\
    \ variable over all the enumerable properties of an object. Its syntax is as below:\n\
    \n```javascript\nfor (variable in object) {\n  statements\n}\n```\n\n## 8. for...of\
    \ statement\n\nThis is the statement that will create a loop that will Iterate\
    \ over objects that can be iterated for instance `Array`, `Map`, `Set`, `arguments`\
    \ object among many. It will invoke a custom iteration hook with statements that\
    \ are to be executed for the value of each distinct property. Its syntax will\
    \ look like:\n\n```javascript\nfor (variable of object) {\n  statement\n}\n```\n\
    \n# Chapter 4: JavaScript Functions and Scope\n\nFunctions in JavaScript contain\
    \ blocks of code which needs to be executed repeatedly. Functions here can take\
