    \ doSomething();\n}\n```\n\n## 5. break 语句\n\n`break` 语句用于终止循环、`switch` 或与标签语句结合使用。当它不带标签使用时，它会立即终止最内层的\
    \ `while`、`do..while`、`for` 或 `switch` 语句，然后将控制权转移到后续语句。另一方面，当 `break` 与 `label`\
    \ 使用时，它将终止指定的标签语句。这是 `break` 语句的写法：\n\n```javascript\nbreak;\nbreak label;\n```\n\
    \n第一种语法形式终止最内层的循环或 switch，第二种语法形式终止指定的嵌套标签语句。示例如下：\n\n```javascript\nfor (i =\
    \ 0; i < a.length; i++) {\n  if (a[i] == theValue) {\n    break;\n  }\n}\n```\n\
    \n## 6. continue 语句\n\n该语句用于重启 `while`、`do..while`、`for` 或 `label` 语句。当该语句不带标签使用时，它会终止最内层\
    \ `while`、`do-while` 或 `for` 语句的当前迭代，并继续执行下一次迭代。这与 `break` 语句的作用不同，`continue`\
    \ 不会完全终止循环的执行。在 `while` 循环中使用，它会跳回条件部分；在 `for` 循环中，它会跳转到增量表达式。其语法如下：\n\n```javascript\n\
    continue;\ncontinue label;\n```\n\n这是一个带有 `continue` 语句的 `while` 循环示例，当 `i` 的值为三时执行。在示例中，`n`\
    \ 取值为一、三、七和十二：\n\n```javascript\ni = 0;\nn = 0;\nwhile (i < 5) {\n  i++;\n  if\
    \ (i == 3) {\n    continue;\n  }\n  n += i;\n}\n```\n\n## 7. for...in 语句\n\n该语句遍历对象的所有可枚举属性的特定变量。其语法如下：\n\
    \n```javascript\nfor (variable in object) {\n  statements\n}\n```\n\n## 8. for...of\
    \ 语句\n\n该语句将创建一个循环，用于遍历可迭代的对象，例如 `Array`、`Map`、`Set`、`arguments` 对象等。它将调用一个自定义迭代钩子，并为每个不同属性的值执行相应的语句。其语法如下：\n\
    \n```javascript\nfor (variable of object) {\n  statement\n}\n```\n\n# 第 4 章：JavaScript\
    \ 函数与作用域\n\nJavaScript 中的函数包含需要重复执行的代码块。这里的函数可以接受零或多个参数，并且如果需要，它们可以返回一个值。在 JavaScript\
    \ 中创建函数有多种方法：\n\n- 函数声明：`function foo() { /* do something */ }`\n- 命名函数表达式：`var\
    \ foo = function() { /* do something */ }`\n\n以下是不同类型函数的示例：\n\ni) 简单函数的示例如下：\n\
    \n```javascript\nvar greet = function(person, greeting) {\n  var text = greeting\
    \ + ', ' + person;\n  console.log(text);\n};\ngreet('Rebecca', 'Hello');\n```\n\
    \nii) 返回值的函数示例如下：\n\n```javascript\nvar greet = function(person, greeting) {\n\
    \  var text = greeting + ', ' + person;\n  return text;\n};\nconsole.log(greet('Richard','hello'));\n\
    ```\n\niii) 返回另一个函数的函数示例如下：\n\n```javascript\nvar greet = function(person, greeting)\
    \ {\n  var text = greeting + ', ' + person;\n  return function() { console.log(text);\
    \ };\n};\nvar greeting = greet('Richard', 'Hello');\ngreeting();\n```\n\n### 自执行匿名函数\
    \ (Self-Executing Anonymous Functions)\n\n这是目前 JavaScript 中常用的模式。该模式创建一个函数表达式，然后立即执行该函数。如果你不想让你的代码弄乱全局命名空间，这种模式非常有用。请注意，在函数内部声明的所有变量在外部都是可见的。自执行匿名函数的写法如下：\n\
    \n```javascript\n(function(){\n  var foo = 'Hello world';\n})();\nconsole.log(foo);\
    \  // undefined!\n```\n\n### 作为参数的 JavaScript 函数\n\n函数在 JavaScript 中非常重要；它们被视为一等公民，这意味着它们可以轻松地赋值给变量，也可以作为参数传递给其他函数。将匿名函数作为参数传递的语法如下：\n\
    \n```javascript\nvar myFn = function(fn) {\n  var result = fn();\n  console.log(result);\n\
    };\n```\n"
