    # Chapter 3: JavaScript Loops


    Loops in JavaScript’s enable a programmer to quickly and easily do something repeatedly.
    A loop is basically a computerized version of having to do something several times
    and another thing several more times. If you want to take eight steps to the east,
    this can be expressed as below in JavaScript:


    var step;


    for (step = 0; step < 8; step++) {


      // Runs 8 times, with values of step 0 through 7.


      console.log(''Walking east one step'');


    }


    You will learn about several kinds of loops in this programming language, but
    one thing for sure is that they all do the same thing, which is repeating the
    same action a number of times. The number of times can be zero. What the different
    types of loop mechanisms offer are different ways to determine the start point
    and the end points of the loop. There are various situations that will be more
    easily served by one type of loop compared to the others.


    JavaScript provides a variety statements that will be used for loops/. These are:


    1.  For statement:


    This statement will repeat until a specified condition evaluates to a false. Here
    is an -example statement:


    for ([initialExpression]; [condition]; [incrementExpression])


      statement


    The results of a for loop execution are:


    *   The initializing expression, if any, will be executed.


    *   The condition expression will be evaluated. If the value of condition is true,
    the loop statement will execute it. If the value of condition is false, the for loop
    will terminate it. If the condition expression is totally omitted, the condition
    will then be assumed to be true.


    *   The statement executes. If you want to execute multiple statements, use a
    block statement ({ ... }) in order to group those statements.


    *   The update expression, which is incrementExpression, will execute if it is
