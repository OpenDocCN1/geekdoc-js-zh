    \ statement. This is how the `break` statement looks like:\n\n```javascript\n\
    break;\nbreak label;\n```\n\nWhere the first form of the syntax terminates the\
    \ innermost enclosing loop or switch, the second form of the syntax terminates\
    \ the specified enclosing label statement. Example:\n\n```javascript\nfor (i =\
    \ 0; i < a.length; i++) {\n  if (a[i] == theValue) {\n    break;\n  }\n}\n```\n\
    \n## 6. Continue statement\n\nThis is the statement that will be used to restart\
    \ a `while`, `do..while`, `for` or `label` statements. When the statement is used\
    \ without a label, it will terminate the current iteration of the innermost enclosing\
    \ `while`, `do-while`, or `for` statement and continue executing the loop with\
    \ the next iteration. This contrasts the working of the `break` statement in that\
    \ `continue` does not terminate the execution of the loop entirely. When used\
    \ in a `while` loop, it jumps back to the condition and in a `for` loop, it jumps\
    \ to the increment-expression. This is how its syntax looks like:\n\n```javascript\n\
    continue;\ncontinue label;\n```\n\nHere is an example of a `while` loop with a\
    \ `continue` statement that executes when the value of `i` is three. In the example,\
    \ `n` takes on the values one, three, seven, and twelve:\n\n```javascript\ni =\
    \ 0;\nn = 0;\nwhile (i < 5) {\n  i++;\n  if (i == 3) {\n    continue;\n  }\n \
    \ n += i;\n}\n```\n\n## 7. for...in statement\n\nThis statement iterates a specific\
    \ variable over all the enumerable properties of an object. Its syntax is as below:\n\
    \n```javascript\nfor (variable in object) {\n  statements\n}\n```\n\n## 8. for...of\
    \ statement\n\nThis is the statement that will create a loop that will Iterate\
    \ over objects that can be iterated for instance `Array`, `Map`, `Set`, `arguments`\
    \ object among many. It will invoke a custom iteration hook with statements that\
    \ are to be executed for the value of each distinct property. Its syntax will\
    \ look like:\n\n```javascript\nfor (variable of object) {\n  statement\n}\n```\n\
    \n# Chapter 4: JavaScript Functions and Scope\n\nFunctions in JavaScript contain\
    \ blocks of code which needs to be executed repeatedly. Functions here can take\
    \ zero or more arguments, and they can return a value if they opt to. There is\
    \ more than one way in which you can create functions in JavaScript:\n\n- Function\
    \ declaration: `function foo() { /* do something */ }`\n- A named function expression:\
    \ `var foo = function() { /* do something */ }`\n\nHere are examples of different\
    \ types of functions:\n\ni) A simple function will be illustrated as:\n\n```javascript\n\
    var greet = function(person, greeting) {\n  var text = greeting + ', ' + person;\n\
    \  console.log(text);\n};\ngreet('Rebecca', 'Hello');\n```\n\nii) A function that\
    \ returns a value will be illustrated as:\n\n```javascript\nvar greet = function(person,\
    \ greeting) {\n  var text = greeting + ', ' + person;\n  return text;\n};\nconsole.log(greet('Richard','hello'));\n\
    ```\n\niii) A function that returns another function will be illustrated as:\n\
    \n```javascript\nvar greet = function(person, greeting) {\n  var text = greeting\
    \ + ', ' + person;\n  return function() { console.log(text); };\n};\nvar greeting\
    \ = greet('Richard', 'Hello');\ngreeting();\n```\n\n### The Self-Executing Anonymous\
    \ Functions\n\nThis is a common pattern in JavaScript today. The pattern creates\
    \ a function expression, then immediately executes the function. This is a pattern\
    \ that will be very useful if you do not want to create a mess in the global namespace\
    \ with your code. Note that all the variables that will be declared inside of\
    \ the function will be visible on the outside. This is how the self-executing\
    \ anonymous function will look like:\n\n```javascript\n(function(){\n  var foo\
    \ = 'Hello world';\n})();\nconsole.log(foo);  // undefined!\n```\n\n### JavaScript\
    \ functions as arguments\n\nFunctions are very important in JavaScript; they are\
    \ treated as first-class citizens and this means that they can be assigned to\
    \ variables with ease or they can be passed over to the other functions as arguments.\
    \ The syntax for passing an anonymous function as an argument will be:\n\n```javascript\n\
    var myFn = function(fn) {\n  var result = fn();\n  console.log(result);\n};\n\
    ```\n"
