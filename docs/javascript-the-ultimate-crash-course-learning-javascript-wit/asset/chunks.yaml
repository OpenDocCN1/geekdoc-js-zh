  trans: "\n\n![](img/cover0003.jpeg)\n\nJavaScript：终极速成课程：使用新方法一天内学会 JavaScript，实现快速编程\n\
    \n（节省时间与精力）\n\n作者：\nJM Shepal\n\n由 Shepal 出版，保留所有权利\n版权所有 2016\n纽约\n\n# 引言\n\n\
    在这一科技领先的时代，能够使用计算机对于任何想要在生活中取得有所成就的人来说都是至关重要的。然而，仅仅会打开电脑并发送电子邮件是不够的。在大多数行业中，基础计算机技能已无法满足需求，因此人们必须追求更多计算机使用的技能和知识，以便完成更多工作。\n\
    \n正因为如此，编程语言对于各行各业的人来说每天变得越来越重要。在所有支持经济的行业中，如果人们需要编程资质或理解能力，这并不令人意外。这就是为什么许多人正在寻找更多掌握编程技能的方法，以确保自己在就业领域中拥有优势。\n\
    \n学习编程被称为掌握代码。虽然有很多编程语言需要学习，但至少掌握一门语言对于你在这生活中获得更好的机会至关重要。\n\nJavaScript 是一门卓越的编程语言；它易于掌握，简单而又强大。无论你在哪个行业工作，这门语言都能让你处于良好的位置。这门编程语言为你提供了一个机会，只需一天就能学习这门奇妙的编程语言！\n\
    \n# 第一章：JavaScript 基础\n\nJavaScript 是一门丰富且富有表现力的编程语言。它由太阳内部系统公司（Sun Microsystems）于\
    \ 1991 年建立，由 Mike Sheridan、Patrick Naughton 和 James Gosling 三人组成的团队开发。它曾被称为 Oak，后来被称为\
    \ Green，在 1995 年被命名为 Java（以咖啡命名）。JavaScript 的基本概念是初学者需要掌握的最重要内容。你还应该了解一些以前在使用这门富有表现力的编程语言的人可能会掉的陷阱，这样你就能精通它，并像专家一样开始编程。\n\
    \nJavaScript 是学习编程的绝佳起点，有了这些知识，你会发现掌握不同的编程语言变得更容易。首先，我们将探索语法（Syntax）的含义。这里是一些可以帮助你入门的语法基础：\n\
    \n## 语法基础\n\nJavaScript 语法是指定义一个结构良好的 JavaScript 程序的的一系列规则。当你开始学习 JavaScript 编程时，需要学习的重要语法包括语句、变量命名和空白等。首先，你需要知道什么是计算机程序。在最基础的，计算机程序是告诉计算机必须执行的指令列表。在编程语言中，这些程序指令我们称为语句（statements）。\n\
    \n**大小写敏感（Case sensitivity）**：JavaScript 是一种大小写敏感的编程语言。你必须以大写字母开头构造函数的名称，以小写字母开头函数的名称。记住这一点很重要，因为某些其他编程语言对大小写敏感，这意味着使用它们时的体验会有不同。\n\
    \n**空白（Whitespace）**：这些是用于字符串常量之外的空格、制表符和换行符。字符串常量可以识别为用于创建 JavaScript 编程语言代码的一些字母和符号。JavaScript\
    \ 中的空白非常重要，它可以直接影响语义，这在像 C 等其他编程语言中并非如此。\n\n**分号（Semicolon）**：JavaScript 中的语句通常用分号隔开。JavaScript\
    \ 中有一种称为“自动分号插入”（Automatic Semicolon Insertion）的技术。这意味着在解析新行后，某些格式良好的语句将被视为完成，就像在换行符之前插入分号一样被视为完成。你可以选择显式以分号结束的语句，以减少自动分号插入带来的意外影响。\n\
    \n以下是分号使用的示例：\n\n```javascript\nvar a = 8;\nvar b = 9;\nvar c = a + b;\n```\n\n\
    ## JavaScript 语句\n\n在 JavaScript 中，语句有几个组成部分，包括：值（Values）、运算符（Operators）、表达式（Expressions）、关键字（Keywords）和注释（Comments）。\n\
    \n**值（Values）**：在 JavaScript 语法中，你将了解到两种值：固定值和变量值。固定值称为字面量（literals），变量值就是我们说的变量。\n\
    \n编写 JavaScript 固定值/字面量最重要的规则是：\n\n- 数字可以带小数也可以不带小数。例如：\n```\n10.50\n1001\n```\n\
    - 字符串是文本，写双引号或单引号内。例如：\n```\n\"Alpha Delta\"\n'Alpha Delta'\n```\n\n另一方面，JavaScript\
    \ 变量用于存储数据值，就像其他编程语言一样。因此，`var` 关键字将用于在编程中声明变量。等号用于给变量赋值。这是一个示例：\n\n```javascript\n\
    var a;\na = 8;\n```\n\n这是一个简单的变量声明示例：\n\n```javascript\nvar foo = 'hello world';\n\
    ```\n\n如所示，引号之外的空白没有重要意义：\n\n```javascript\nvar foo = 'hello world';\n```\n\n\
    括号将指示优先级，如下：\n```javascript\n3 * 2 + 6;    // 返回 12；因为先执行乘法\n3 * (5 + 3);  //\
    \ 返回 24；因为先执行加法\n```\n\n制表符没有任何意义，但会提高可读性：\n```javascript\nvar foo = function(){\n\
    \    console.log('hello');\n};\n```\n\n## JavaScript 表达式\n\nJavaScript 中的表达式用于引用值、变量和运算符的组合，所有这些将计算出一个特定的值。最后的计算被称为求值（evaluation）。这是一个简单表达式的示例：\n\
    \n`2 * 10` 结果为 20：\n```javascript\n2 * 10\n```\n表达式也包含变量值，`a * 10`。\n\n此类表达式中使用的值可以是各种类型，例如数字和字符串。`\"\
    Alpha\" + \" \" + \"Delta\"` 求值结果为 `\"Alpha Delta\"`：如下所示：\n\n```javascript\n\"\
    Alpha\" + \" \" + \"Delta\"\n```\n\n## JavaScript 关键字\n\n这些用于标识要执行的操作。`var` 关键字将用于告诉浏览器创建一个新变量。例如：\n\
    \n```javascript\nvar a = 8 + 9;\nvar b = a * 10;\n```\n\n## 注释\n\n首先，你需要意识到并不是所有的\
    \ JavaScript 语句都会执行。出现在双斜杠 `//` 之后或 `/*` 和 `*/` 之间的代码将被视为注释。注释应该被忽略，而不是执行。例如：\n\
    \n```javascript\nvar a = 8;  // 我将被执行\n// var a = 9;  我不会被执行\n```\n\n## 标识符\n\n\
    标识符基本上是名称。在 JavaScript 中，它们用于命名变量、关键字、函数和标签。合法的名称行为是相同的，规则在所有编程语言中保持一致。在 JavaScript\
    \ 中，第一个字符必须是字母、下划线（`_`）或美元符号（$`）。随后的字符可以是字母、数字、下划线或美元符号之间的任何字符。注意数字不允许作为开头。这使得人们能够轻松地区分\
    \ JavaScript 中的标识符和数字。\n\n# 第二章：JavaScript 基本运算符\n\nJavaScript 基本运算符用于操作编程中的不同值。JavaScript\
    \ 使用赋值运算符（即等号）来给变量赋值。示例如下：\n\n```javascript\nvar a = 8;\nvar b = 9;\n```\n\n另一方面，算术运算符用于计算值。这些符号为\
    \ `+`、`-`、`*`、`/`。以下是一个示例：\n\n```javascript\n(8 + 9) * 17\n```\n\n"
- fmt: "\nThese includes division and multiplication, for example:\n\n```javascript\n\
    5 * 6;\n5 / 6;\n```\n\nAnd decrementing and incrementing:\n\n```javascript\nvar\
    \ x = 6;\nvar y = ++x;  // pre-increment:  y equals 5; x equals 6\nvar z = x++;\
    \  // post-increment: z equals 5; x equals 6\n```\n\nConcatenation will also be\
    \ useful. Here is an example:\n\n```javascript\nvar foo = 'hello';\nvar bar =\
    \ 'world';\nconsole.log(foo + ' ' + bar); // 'hello world'\n```\n\n# Numbers and\
    \ Strings Operations\n\nIn JavaScript, the behavior of strings and numbers is\
    \ often very different manner when compared to how they behave with other programming\
    \ languages. It is therefore important to understand each step carefully to be\
    \ able to operate them with ease when you start programming:\n\n## Addition vs.\
    \ concatenation\n\nHere is an example of how additions and concatenations happen\
    \ on numbers and strings:\n\n```javascript\nvar foo = 5;\nvar bar = '6';\nconsole.log(foo\
    \ + bar);  // 56\\. uh oh\n```\n\nHow to force a string to behave like numbers:\n\
    \n```javascript\nvar foo = 5;\nvar bar = '6';\n// coerce strings towards a number\n\
    console.log(foo + Number(bar));\n```\n\nWhen a number constructor is identified\
    \ as a function as it is illustrated above, it will have the ability to cast its\
    \ argument to numerical form. The unary plus operator carries out a similar function,\
    \ therefore it can also be used. Here is an illustration:\n\n```javascript\nconsole.log(foo\
    \ + +bar);\n```\n\n## Logical operators\n\nThe logical operators in JavaScript\
    \ make it possible to gauge a sequence of operations using AND as well as OR operations.\
    \ Look at the illustration below:\n\n```javascript\nvar foo = 5;\nvar bar = 0;\n\
    var baz = 6;\nfoo || bar;  // takes back 5, that is true\nbar || foo;  // takes\
    \ back 5, that is true\nfoo && bar;  // takes back 0, that is false\nfoo && baz;\
    \  // takes back 6, that is true\nbaz && foo;  // takes back 5, that is true\n\
    ```\n\nFrom the illustration above:\n\n- The operator `//` brings back the value\
    \ of the initial operation. Should it occur that none of the operations is true,\
    \ the last of the two operations will be returned.\n- The `&&` operator brings\
    \ the value of the primary false operation or that of the final operation if both\
    \ of the operations were true.\n\nSometimes logical operations are used for the\
    \ flow control rather than making use of if statements by some developers. See\
    \ the example below:\n\n```javascript\n// do a thing with foo if foo is true\n\
    foo && do something(foo);\n\n// set bar to bax if bax is true;\n// or else, set\
    \ it to the take back\n// value of==for createBar()\nvar bar = bax || createBar();\n\
    ```\n\nThe above is a different kind of style, that is elegant and quite pleasant\
    \ but it is not easy to read, particularly for those without experience. Only\
    \ after advancing the skills in JavaScript can a beginner be able to read that.\n\
    \n**Note**: you need to know which kinds of values are truth and which ones are\
    \ false so as to use flow control effectively all the time. There are times when\
    \ values that look like they should evaluate in one way evaluate in a different\
    \ way instead. Values that evaluate to true are illustrated as:\n\n- `'0'`\n-\
    \ `'any string'`\n- `[]` // an empty array\n- `{}` // an empty object\n- `1` //\
    \ any non-zero number\n\nAnd those that evaluate to the false are illustrated\
    \ as:\n\n- `0`\n- `''` // an empty string\n- `NaN` // JavaScript's \"not-a-number\"\
    \ variable\n- `null`\n- `undefined` // be careful -- undefined can be redefined!\n\
    \n## The conditional code\n\nThis is only applicable when you want to run a large\
    \ amount of code as long as certain conditions apply. Here, you will use Flow\
    \ control through if and else blocks. Here is an example in a flow control:\n\n\
    ```javascript\nvar foo = right;\nvar bar = wrong;\n\nif (bar) {\n    // this code\
    \ shall never run\n    console.log('hello!');\n}\n\nif (bar) {\n    // this code\
    \ shan't run\n} or {\n    if (foo) {\n        // this code will run\n    } else\
    \ {\n        // this code would run if foo and bar were both wrong\n    }\n}\n\
    ```\n\nAlways remember that use of curly braces will help you in the creation\
    \ of more readable codes, even when they are not really necessary with single-line\
    \ if statements. You can therefore use them as much as you want for better results.\
    \ Also, avoid defining functions using the a name which is the same many times\
    \ within different if/else blocks. This may prevent you from achieving the desired\
    \ results.\n\n# Chapter 3: JavaScript Loops\n\nLoops in JavaScript’s enable a\
    \ programmer to quickly and easily do something repeatedly. A loop is basically\
    \ a computerized version of having to do something several times and another thing\
    \ several more times. If you want to take eight steps to the east, this can be\
    \ expressed as below in JavaScript:\n\n```javascript\nvar step;\nfor (step = 0;\
    \ step < 8; step++) {\n  // this code shall never run\n  console.log('Walking\
    \ east');\n}\n```\n\nYou will learn about several kinds of loops, which de determine\
    \ the start point and end points. JavaScript provides various ways to use them.\
    \ These are:\n\n### 1. For statement\n\nThis statement will repeat until a specified\
    \ condition evaluates to false. Here is example:\n\n```javascript\nfor ([initialExpression];\
    \ [condition]; [incrementExpression])\n  statement\n```\n\n- The `initializing\
    \ expression`, if any, will be executed.\n- The `condition` expression will be\
    \ evaluated. If the value of `condition` is true, the loop statement will execute.\
    \ If the value of `condition` is false, the `for` loop will terminate it. If the\
    \ condition is totally omitted, the condition will be assumed to be true.\n- The\
    \ `statement` executes. If you want to execute multiple statements, use a block\
    \ statement `{ }`.\n- The `update expression`, which is `incrementExpression`,\
    \ will execute if it is present then the control returns to step 2.\n\n### 2.\
    \ Do–while statement\n\nThis kind of statement will repeat until a specified condition\
    \ evaluates to false. This is how it looks:\n\n```javascript\ndo\n  statement\n\
    while (condition);\n```\n\nYour statements will be executed once before the condition\
    \ is checked. If you want to execute more than one statements, use a block statement\
    \ `{ }`. If the conditions turns out to be true, the statement execute again.\
    \ The condition should be checked after every execution. If you find it false,\
    \ the execution is stopped and total control is now passed on to the statement\
    \ that follows. Here is an example:\n\n```javascript\ndo {\n  i += 1;\n  console.log(i);\n\
    } while (i < 5);\n```\n\n### 3. While statement\n\nThis statement will execute\
    \ its statements as long as a specified condition evaluates to true. This is how\
    \ a while statement will look like:\n\n```javascript\nwhile (condition)\n  statement\n\
    ```\n\nYou have to test the condition before the statement in the loop is executed.\
    \ If the results are true, the statement is executed and the condition is tested\
    \ once more. This is done until the condition returns false. In order to execute\
    \ multiple statements, use a block statement `{ }`. Example:\n\n```javascript\n\
    n = 0;\nx = 0;\nwhile (n < 3) {\n  n++;\n  x += n;\n}\n```\n\n### 4. Label statement\n\
    \nThis statement will provide a statement with an identifier that will let you\
    \ refer to it elsewhere in your program. You can use the label statement in order\
    \ to identify a loop, then use the `break` or the `continue` statements in order\
    \ to indicate whether a program will interrupt the loop or it will continue its\
    \ execution. This so how the label statement looks like:\n\n```javascript\nlabel\
    \ :\n  statement\n```\n"
