    # Chapter 4: JavaScript Functions and Scope


    Functions in JavaScript contain blocks of code which needs to be executed repeatedly.
    Functions here can take zero or more arguments, and they can return a value if
    they opt to. There is more than one way in which you can create functions in JavaScript:


    -              Function declaration: function foo() { /* do something */ }


    -              A named function expression: var foo = function() { /* do something
    */ }


    Here are examples of different types of functions:


    i)              A simple function will be illustrated as:


    var greet = function(person, greeting) {


        var text = greeting + '', '' + person;


        console.log(text);


    };


    greet(''Rebecca'', ''Hello'');


    ii)              A function that returns a value will be illustrated as:


    var greet = function(person, greeting) {


        var text = greeting + '', '' + person;


        return text;


    };


    console.log(greet(''Richard'',''hello''));


    iii)              A function that returns another function will be illustrated
    as:


    var greet = function(person, greeting) {


        var text = greeting + '', '' + person;


        return function() { console.log(text); };


    };


    var greeting = greet(''Richard'', ''Hello'');


    greeting();


    The Self-Executing Anonymous Functions


    This is a common pattern in JavaScript today. The pattern creates a function expression,
    then immediately executes the function. This is a pattern that will be very useful
    if you do not want to create a mess in the global namespace with your code. Note
    that all the variables that will be declared inside of the function will be visible
    on the outside. This is how the self-executing anonymous function will look like:


    (function(){


        var foo = ''Hello world'';


    })();


    console.log(foo);   // undefined!


    JavaScript functions as arguments


    Functions are very important in JavaScript; they are treated as first-class citizens
    and this means that they can be assigned to variables with ease or they can be
    passed over to the other functions as arguments. The syntax for passing an anonymous
    function as an argument will be:


    var myFn = function(fn) {


        var result = fn();


        console.log(result);


    };


    myFn(function() { return ''hello world''; });   // logs ''hello world''


    while the syntax for passing a named function as an argument will be:


    var myFn = function(fn) {


        var result = fn();


        console.log(result);


    };


    var myOtherFn = function() {


        return ''hello world'';


    };


    myFn(myOtherFn);   // logs ''hello world''


    Testing


    There is a way one can test the type of variable in JavaScript. This is shown
    by use of typeof operator in order to determine the type of a specific value.
    Below is an illustration of how one can test the type of various variables in
    programming:


    var myFunction = function() {


    console.log(''hello'');


    };


    var myObject = {


    foo : ''bar''


    };


    var myArray = [ ''a'', ''b'', ''c'' ];


    var myString = ''hello'';


    var myNumber = 3;


    typeof myFunction;   // takes back ''function''


    typeof myObject;     // takes back ''object''


    typeof myArray;      // takes back ''object'' -- careful!


    typeof myString;     // takes back ''string'';


    typeof myNumber;     // takes back ''number''


    typeof null;         // takes back ''object'' -- careful!


    if (myArray.push && myArray.slice && myArray.join) {


    // probably an array


    // (this is called "duck typing")


    }


    if (Object.prototype.toString.call(myArray) === ''[object Array]'') {


    // Definitely an array!


    // This is widely considered as the most robust way


    // to determine if a specific value is an Array.


    Scope


    Scope is basically a variable that is available in a certain code at a given time.
    If you are unable to understand scope, you will have constant issues with debugging,
    therefore this is very important. When you declare a variable inside a function
    using the var keyword, it will only be available to the code inside of that function
    and the code outside the function will not be able to access the variable. Again,
    functions that have been defined inside that function will be able to access the
    declared variable.


    Those variables that will be declared inside a function without the var keyword
    are not local to the function as this means that JavaScript will go back the scope
    chain up to the window scope in order to find the point where the variable was
    defined at first. If there was no declaration at the beginning, the variable will
    then be declared in the global scope, and this can have great expected consequences.


    The example below shows functions that have access to variables defined in the
    same scope:


    var foo = ''hello'';


    var sayHello = function() {


        console.log(foo);


    };


    sayHello();         // logs ''hello''


    console.log(foo);   // also logs ''hello''


    This example shows that a code outside the scope in which a variable was defined
    does not have access to the variable


    var sayHello = function() {


        var foo = ''hello'';


        console.log(foo);


    };


    sayHello();         // logs ''hello''


    console.log(foo);   // doesn''t log anything


