    When a number constructor is identified as a function as it is illustrated above,
    it will have the ability to cast its argument to numerical form. The unary plus
    operator carries out a similar function, therefore it can also be used. Here is
    an illustration:


    console.log(foo + +bar);


    Logical operators


    The logical operators in JavaScript make it possible to gauge a sequence of operations
    using AND as well as OR operations. Look at the illustration below:


    var foo = 5;


    var bar = 0;


    var baz = 6;


    foo || bar;   // takes back 5, that is true


    bar || foo;   // takes back 5, that is true


    foo && bar;   // takes back 0, that is false


    foo && baz;   // takes back 6, that is true


    baz && foo;   // takes back 5, that is true


    From the illustration above:


