  md: "Typical mobile procedures such as in-call handover may leave the realm of stan-\n\
    \ndardized technology. To perform good in-call WiFi-to-GSM handover may not \n\
    \nrequire a new 3GPP standard, but may require ﬁne real-time analysis of the voice\
    \ \n\nquality, for example.\n\nIs there a trend toward more cellular technologies\
    \ such as HSPA, against non-\n\ncellular such as VDSL? No. IP rules the world,\
    \ and uses whatever underlying tech-\n\nnology to get to the end user.\n\nIs there\
    \ a need for more mobility? Or have GSM and CDMA fully satisﬁed our \n\ndemand?\
    \ Well, new demand for mobility could for example come from in-vehicle devices\
    \ \n\nsuch as car entertainment systems, the on-board computer or the alarm system.\n\
    \nAre we going more wireless? For sure, there’s a demand for broadband wireless\
    \ \n\nInternet access in emerging markets, but also covering cities, trains, petrol\
    \ stations \n\nand holiday resorts.\n\n**1.8**\n\n**Presence and Availability**\n\
    \nTimeliness, expectation and unpredictability are the cornerstones of genuine\
    \ \n\ncommunications.\n\nHowever, these three aspects can create an “on call”\
    \ atmosphere in which com-\n\nmunication users feel forced to be reachable within\
    \ the shortest possible time at \n\nunpredictable moments and in inconvenient\
    \ situations.\n\nAs a reaction, they might start shutting down their mobile phones,\
    \ mobile e-\n\nmail clients and computers for too long, and might (probably after\
    \ a few bad expe-\n\nriences) develop a sentiment of anxiety to miss an important\
    \ communication or \n\npiece of information — either good or bad news.\n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_26_0.png)\n\
    \n**Figure 1.5**\n\n**Cellular mobile wireless networks can fence you in!**"
  merge: -1
  pgno: 26
