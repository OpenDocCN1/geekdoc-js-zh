  md: "It’s a *very* diﬃcult question. Today’s NGN are mainly rolled out by incum-\n\
    \nbent ﬁxed telephony providers (the ex-PTTs) for PSTN emulation (see Section\
    \ 3.5) \n\n— they automatically think in terms of connection fees and duration.\
    \ However, \n\noften they also have an ISP division, which thinks in terms of\
    \ Megabit/s and desti-\n\nnations. And greenﬁeld NGNSPs come and knock at the\
    \ ISP door ﬁrst. What will \n\nthey then charge their peer NGNSP’s?\n\nIf greenﬁeld\
    \ NGN providers do not start charging per minute, that is, because \n\nthe general\
    \ trend is to oﬀer ﬂat-fee, all-you-can-eat models, there will be no way \n\n\
    for them to close TDM interconnection agreements to drop oﬀ outbound traﬃc \n\n\
    to E.164 numbers or to purchase this traﬃc from international carriers. Greenﬁeld\
    \ \n\nNGN providers would thus have to focus on inbound calls for a while, for\
    \ example, \n\nto mobile devices as we saw in Section 4.5.\n\nPerhaps greenﬁeld\
    \ NGNSP’s should simply not oﬀer the E.164 telephone num-\n\nbering scheme at\
    \ all. Alice could only sip\\* Cal Sandburg at sip:carl.sandburg@\n\nchicago.com,\
    \ eventually relayed by the biloxi.com domain.\n\nSeen from the other angle, if\
    \ the “ex-PSTN” NGN providers do not start peer-\n\ning based on volumes (and\
    \ other parameters) instead of minutes, they will not be \n\nable to oﬀer more\
    \ advanced SIP-based end user services such as video-on-demand, \n\nand will continue\
    \ to emulate the PSTN only.\n\nThere’s a need for TDM interconnection and ISP\
    \ peering agreements to con-\n\nverge to a new type of agreement, the ***NGN peering***\
    \ agreement.\n\nIn general, a new NGNSP needs to be the following:\n\n**Interconnected\
    \ to existing TDM Core Networks **of ﬁxed, mobile ser-\n\nvice providers and long-distance\
    \ carriers, via Media Gateway Controllers \n\n(MGC) and Media Gateways (MGW^†).\
    \ The all-IP MGC (i.e., speaking \n\nISUP over SIGTRAN) is connected to the TDM\
    \ (SS7) networks via a \n\nSignaling GateWay (SGW). Service providers refer to\
    \ the entire conver-\n\nsion of NGNs to TDM as “TDM trunking.” In fact, as real-life\
    \ NGNs \n\nare less monolithic than what the standardization organizations describe\
    \ \n\n(Figure 3.1), trunking sometimes ends up being performed and operated \n\
    \nby separate, dedicated organizations that have already deployed SGW and \n\n\
    MGW in diﬀerent countries, and are operating central MGC. Trunking \n\nis country-speciﬁc\
    \ and relies on a very diﬀerent skill set than deploying \n\nnext generation networks:\
    \ ITU-T or ANSI SS7 point codes, national SS7 \n\nISUP ﬂavors, SS7-to-SIGTRAN\
    \ signaling gateways, transcoding, E1 or \n\nT1 leased lines, ﬁxed operator licenses,\
    \ interconnection agreements, in-\n\ncountry local premises or hosting, and so\
    \ on. If the NGNSP decides to \n\noutsource TDM trunking, he will need to peer\
    \ with his TDM trunking \n\nproviders via IP (SIP and RTP).\n\n\\* Yes, we’ll\
    \ have to start using this verb in a totally diﬀerent context.\n\n† These are\
    \ referred to as Trunking Gateways (TGW) in the TISPAN standards."
