  md: "Function (PCF, terminating GGSN in this case) and the PDF (at the Terminating\
    \ \n\nP-CSCF). “Yes, these resources have been previously authorized …”\n\nDuring\
    \ this process, the PDF informs the PCF about the maximum IP QoS \n\nto be applied\
    \ for each access channel. The PCF will also inform the PDF/P-CSCF \n\nabout the\
