  md: "Within communication service providers, but in general within many commercial\
    \ \n\norganizations, there’s a diﬃcult equilibrium to be found between the mix\
    \ of product \n\ntypes and the tailoring options. Having too many product types\
    \ and no individual \n\noptions usually has a greater impact on the organization\
    \ (in terms of complexity, cost, \n\ntraining, etc) than having too few product\
    \ types and too many options.\n\nIdeally, the product catalog should regularly\
    \ be compared to the subscriber \n\ndatabase in order to detect and suppress unpopular\
    \ product types and options, \n\nhence to simplify the oﬀer toward the end user.\
    \ We’ll talk about this in the context \n\nof reporting (Section 6.25).\n\nIn\
    \ the peer-to-peer world, the product catalog should be part of the user interface\
    \ \n\nor at least of some central Web site explaining the oﬀer to the peer-to-peer\
    \ users.\n\nSubscribers and prepaid users of telecom services used to have a lifecycle:\
    \ preuse, \n\nactive, dormant, suspended, fraudulent, porting out pending, and\
    \ so on — please \n\nrefer to the Section 6.2 on user accounts. Any lifecycle\
    \ should not also include the \n\ncurrent state but the history and future planned\
    \ states, as of precise dates and time. \n\nA new evolution is that product catalogs\
    \ are evolving to include a lifecycle and \n\nrenewal policy also for the product\
    \ type and for the individual options.\n\nFor example, the user subscribing to\
    \ the cell phone insurance could select to \n\nhave this personal option starting\
    \ on the ﬁrst day of the next month. The option \n\ncould be automatically renewed\
    \ each month if there are suﬃcient funds in the \n\naccount, or the system could\
    \ automatically ask for conﬁrmation prior to renewing \n\nthat option, or the\
    \ user could opt for a scheme in which the option is suppressed \n\nafter one\
    \ month — for example to buy the insurance only to go on holidays.\n\nThe tariﬀ\
    \ implications of that renewal policy is an area that is going to be devel-\n\n\
    oped in the coming years.\n\n**5.2**\n\n**Account **** User **** Wallet**\n\n\
    An account is a term for a customer relationship with an end user of communica-\n\
    \ntion means, but may also be used w.r.t. a revenue sharing partner (e.g., carrier,\
    \ \n\nroaming partner, application service provider).\n\nSome communication users\
    \ could demand multiple accounts, even for the same \n\ncommunication events.\
    \ For example, corporate organizations today want to look \n\nat their end users\
    \ and usage by division, by country, by communications product \n\nand worldwide.\n\
    \nThe degree of trust should determine the prepaid or postpaid nature of such\
    \ \n\naccount, more than type of user or partner. For example, when NGNSP will\
    \ have \n\nthousands of NGN peering relationships, we expect prepaid accounts\
    \ to appear \n\nalso for (what is today called) inter-operator accounting.\n\n\
    What is stored in such account is credit, expressed either in monetary or in non-\n\
    \nmonetary *balances* (e.g., minutes, megabits). The balances in an account may\
    \ be of \n\nthe debit type (positive values, “prepaid”) or credit type (negative\
    \ values, “postpaid”)."
  merge: -1
