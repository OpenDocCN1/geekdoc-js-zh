  md: "forbidden (black-listed) or sabotaged (gray-listed; e.g., competitors’ applications).\
    \ \n\nAlso, it is made aware what to do with traﬃc that cannot be recognized as\
    \ being \n\npart of any service/destination (“background traﬃc”).\n\nIn the coming\
    \ years, the palette of services to be metered should probably be \n\nmerged into\
    \ a single product catalog. Too often, the deﬁnition of available data ser-\n\n\
    vices have remained separate from the main voice and messaging product catalog.\n\
    \nIf the background traﬃc requires online charging, the metering device obtains\
    \ \n\na credit slice from the online charging system.\n\nWhen the user/partner\
    \ accesses a service/destination deﬁned in the palette, the \n\nmetering device\
    \ obtains credit (sometimes also referred to as “quota” in this con-\n\ntext)\
    \ from the online charging system, or produces tickets for oﬀ-line charging.\n\
    \nHighly granular metering is thus required for both interaction with online \n\
    \ncharging systems, as well as for oﬀ-line charging.\n\nIt is sometimes referred\
    \ to as “content charging” but that’s an inaccurate descrip-\n\ntion, as content\
    \ can be charged without metering, by applications (end points) tap-\n\nping directly\
    \ from the account (see Section 5.12 on openness).\n\n**5.6**\n\n**Reverse Charging**\n\
    \nMost users understand the principle of a toll-free (800) number: the call is\
    \ free to \n\nthe caller because it’s fully paid by the called party.\n\nThe decision\
    \ for the charging system to allocate the charges to the content ser-\n\nvice\
    \ provider (the freephone number owner in this case) used to be simple (namely\
    \ \n\nbased on the called number range).\n\nThat is changing in modern communication\
    \ services.\n\nLet’s consider the example of an online game where the game itself\
    \ is charged \n\nper new downloaded game level, and normal GPRS volume charges\
    \ apply for the \n\nnondownload traﬃc.\n\nThe metering device is smart enough\
    \ (or instructed) not to take into account the \n\ngame level downloading packets\
    \ to calculate the volume of the background session — \n\nand to modify the background\
    \ session to become time-based when using WiFi.\n\nIf a new game level download\
    \ succeeds, it is charged to the end user as a unit \n\nprice.\n\nIf the user\
    \ had already successfully downloaded that game but later lost or \n\nerased it,\
    \ the game level can be restored and the gaming user pays only for volume \n\n\
    charges — except when on WiFi.\n\nIf, however, a game level download is incomplete\
    \ or unsuccessful, the volume \n\ncorresponding to that failed download should\
    \ be charged to the game provider. \n\nAgain, except when on WiFi.\n\nThis small\
    \ example illustrates that charging decisions are far from being static, \n\n\
    and that the communication service provider’s charging processes should be in\
    \ full \n\ncontrol of normal vs. reverse charging."
