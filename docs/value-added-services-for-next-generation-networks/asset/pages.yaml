  md: "**33**\n\n***Chapter 3***\n\n**Review of the **\n\n**Standardization Work **\n\
    \n**for Next Generation **\n\n**Networks**\n\nIn this chapter we take a tour through\
    \ the work of the standards bodies that are \n\ncurrently driving Next Generation\
    \ Networks.\n\nWhen a telecommunication technology is successfully standardized,\
    \ it results \n\nin a world market for devices, services and business models.\n\
    \nAt ﬁrst sight, it may seem an arid world of acronyms, architectures, procedures\
    \ \n\nand protocols, driven by strong industrial interests.\n\nBut people should\
    \ try and form a personal opinion: not only engineers and \n\nmanagers at communication\
    \ service providers and their equipment vendors but also \n\nthe consumers of\
    \ devices, connectivity and services — a large group.\n\nIs it still worth reviewing\
    \ technology standards from the perspective of a com-\n\nmunication service provider\
    \ only?\n\nYes, insofar as these technologies could lead to operational eﬃciencies,\
    \ better \n\nbusiness models and a better end user experience. Yes also if introducing\
    \ these \n\nimproves the SWOT-situation of the communication service providers,\
    \ in general.\n\nShould businesses buy a 3G phone ﬂeet now, or wait for IEEE Mobile\
    \ WiMAX \n\nto be built into the next laptops?\n\nAre nonstandard IM/VoIP clients\
    \ going to be marketed as freeware, adware, and \n\nspyware, versus standard SIP\
    \ clients under a licensed, pay-per-call, ﬂat-free model?"
