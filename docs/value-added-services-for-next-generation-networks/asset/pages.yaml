    \ ﬁxed or mobile telecom network today, less \n\nthan half of the calls are successfully\
    \ established between two human end users.\n\nFor the transmission of stored media,\
    \ the receivers have the choice of the deliv-\n\nery channel. For blockbusters,\
    \ one has the choice to go and see the movie, rent the \n\nDVD, use digital TV\
