  md: "The TISPAN NGN is much more versatile than the “naked” 3GPP IMS. It \n\ncan\
    \ be used to provide PSTN emulation services, SIP-based IMS services, IP TV, \n\
    \npeer-to-peer solutions, or even allows the end user to request more bandwidth\
    \ on \n\nthe ﬂy — sometimes referred to as “the Turbo button.”\n\n**3.6**\n\n\
    **ITU-T**\n\nThroughout the 1980s and the 1990s, the Telecommunications Standardization\
    \ Sector \n\nof the International Telecommunications Union (ITU) produced the\
    \ most important \n\nstandards for public and private circuit-switched telecommunications.\n\
    \n***3.6.1***\n\n***ISDN***\n\nDigital telephony was introduced at the end of\
    \ the 1980s under ITU-T’s ISDN stan-\n\ndards (Integrated Services Digital Network):\
    \ the Q.9XX series of recommendations.\n\nThe ISDN spanned the digital core network,\
    \ the residential access network \n\n(analog and digital), and the enterprise\
    \ network (digital PBX) — as the NGN today \n\ndoes.\n\nBritish Telecom completed\
    \ ISDN with DPNSS (Digital Private Network Sig-\n\nnaling System), allowing advanced\
    \ supplementary services to be supported across \n\nmultiple company PBX’s.\n\n\
    ETSI took a similar initiative (QSIG) which was more widely adopted, but \n\n\
    DPNSS remains technically superior.\n\n***3.6.2***\n\n***SS7 Signaling***\n\n\
    In order to convey the core network signaling, ITU-T created Signaling System\
    \ \n\nnumber 7 (SS7) as the Q.7XX series of recommendations, with a ﬁrst stable\
    \ ver-\n\nsion in 1988 (the so-called Blue Book) and quite stable revision in\
    \ 1993 (the White \n\nBook). It has permitted national and international interconnection\
    \ of digital tele-\n\nphony exchanges. It is universally appreciated for its accuracy,\
    \ robustness, excel-\n\nlent interworking (e.g., with international ISUP, Q.767).\
    \ Even though inevitably, \n\nregional variants have appeared (ANSI SS7).\n\n\
    SS7 is structured as the Message Transfer Part (MTP) at data link and network\
    \ \n\nlayer, and either the ISDN User Part (ISUP, for call set-up), or the Signaling\
    \ Con-\n\nnection and Control Part (SCCP, for other signaling). Above SCCP, the\
    \ Transac-\n\ntion Capabilities Application Part (TCAP) allows associate requests\
    \ and responses \n\nin a dialogue. (Wow! This is probably the shortest overview\
    \ ever on SS7!).\n\nThe Global System for Mobile communications (GSM), the largest\
    \ telecom-\n\nmunication system on earth, relies heavily on SS7, for call set-up\
    \ as well as for \n\nmobility tracking (location update procedures, routing of\
    \ incoming calls and mes-\n\nsages) and security (terminal and SIM authentication).\
    \ Overall, probably 80% of"
  merge: -1
  pgno: 67
- img_proc: true
  md: "the signaling exchange for calls, SMS and mobility events uses pure SS7. A\
    \ small \n\nportion in the mobile access network (between MS and MSC, and between\
    \ BTS \n\nand BSC) is based on ISDN access signaling.\n\nAn interesting ITU-T\
    \ development is Bearer Independent Call Control \n\n(BICC, Q.1901), a signaling\
    \ protocol allowing broadband multimedia streams to \n\nbe set up (Q.1970) besides\
    \ narrowband circuits to be connected (Q.1950). Also, \n\nBICC signaling itself\
    \ can be conveyed over a broadband network (IP). Besides \n\nthe two core network\
    \ protocols, there’s also a BICC variant for access signaling \n\n(Q.1930).\n\n\
    BICC Capability Set 2 (2001) was adopted by 3GPP for its Release 4 UMTS \n\nspeciﬁcations.\n\
    \n***3.6.3***\n\n***Intelligent Network***\n\nPart of the success of GSM is due\
    \ to the ability for customers to use it without \n\npreestablished contract,\
    \ monthly subscription fee, or billing address. The prepaid \n\nmode has dramatically\
    \ lowered the barrier of entry, and is used today by more than \n\n60% of all\
    \ mobile phone users worldwide. This fraction is bound to rise further, as \n\n\
    almost all new users are connected in developing countries.\n\nWith their Q.12XX\
    \ series laying the basis of the Intelligent Network, ITU-T \n\ncreated the standard\
    \ to let digital telephony exchanges communicate with exter-\n\nnal computers\
    \ (the prepaid IN platforms). Also there, more reﬁned variants have \n\nappeared\
    \ (ETSI Core INAP, GSM CAMEL, CDMA Wireless IN) but the impact \n\nof ITU-T has\
    \ been decisive. Though the IN was foreseen to become a multiapplica-\n\ntion\
    \ VAS platform, the killer app is prepaid.\n\nITU-T’s Intelligent Network Application\
    \ Part (INAP) is carried over TCAP, \n\nover SCCP, over MTP. But it can also be\
    \ carried over IP networks as INAP over \n\nTCAP over SIGTRAN SUA.\n\n***3.6.4***\n\
    \n***Media Encoding***\n\nAlso in the media and border gateways layer, ITU-T is\
    \ the main actor, for the \n\nISDN, GSM and NGN. Echo canceling and the compression\
    \ of audio and voice \n\n(multiple codecs) are standardized in ITU-T’s G series.\
    \ The most commonly used \n\ncodecs for VoIP are\n\nG.711: 64 Kbit/s, also used\
    \ for circuit-switched digital landline telephony, \n\nMOS\\*  4.1.\n\nG.729.1:\
    \ as of 14 Kbit/s, for wideband audio (50–7000 Hz), MOS q 4.\n\nG.729: 8Kbit/s\
    \ only, but unable to transmit DTMF or fax, MOS  3.92.\n\n\\* Mean Opinion Score,\
    \ a subjective average mark given by listeners on a scale between 1 and 5."
  merge: -1
  pgno: 68
- img_proc: true
  md: "G.729a: 8 Kbit/s, less computing-intensive version of G.729, MOS  3.7\n\nG.723.1:\
    \ 6.3 or 5.3 Kbit/s, MOS  3.9 or 3.65\n\nIn noisy wireless environments, ETSI\
    \ and 3GPP have been in the driving seat:\n\nGSM-FR: Full Rate, 13 Kbit/s, invented\
    \ in the early 1990s but today out-\n\ndated, MOS up to 3.2.\n\nGSM-HR: Half Rate,\
    \ 6.5 Kbit/s, also from the early 1990s, MOS < 3.\n\nGSM-EFR: Enhanced Full Rate,\
    \ 12.2 Kbit/s, delivers wireline-like MOS \n\nup to 4.5 in a quiet street (4.1\
    \ in-car with 10^ ³ BER\\*).\n\nAMR: Adaptive Multi Rate, from 4.75 to 12.2 Kbit/s,\
    \ adopted by 3GPP \n\nin 1998 as the standard codec for GSM; includes GSM-EFR\
    \ and IS136 \n\nEFR (the TIA variant).\n\nAMR-WB: AMR Wide Band, 50–7000Hz, from\
    \ 6.60 to 23.05 Kbit/s, \n\ndesigned for UMTS.\n\nObviously, the latter codecs\
    \ are suitable for VoIP in wireless NGN and IMS.\n\n***3.6.5***\n\n***NGN Signaling***\n\
    \nIf the IETF deserves the title of the founder of the NGN, ITU-T deserves the\
    \ title \n\nof pioneer.\n\nIn the 1990s, ITU-T launched the ﬁrst architecture\
    \ for audio and video trans-\n\nmission over an IP network, as H.323. They were\
    \ the ﬁrst to adopt RTP (IETF \n\nRFC 3550) in the media and border gateways layer.\
    \ The main signaling protocol \n\nwas H.225.0, based on ISDN access protocol.\n\
    \nH.323 was well suited for enterprise telephony — most VoIP PBXs supported \n\
    \nH.323 well before SIP.\n\nBut around 2000, ITU-T failed to get suﬃcient vendor\
    \ and operator attention \n\nfor BICC, the signaling protocol allowing to set\
    \ up media streams.\n\nConveying the media streams themselves requires routing\
    \ technology, some-\n\nthing the traditional telephone exchange vendors did not\
    \ master in those days. \n\nMoreover, their energy was dragged away by the implementation\
    \ of IETF’s SIG-\n\nTRAN (Signaling TRANsport), to carry signaling over IP networks.\
    \ It became \n\ntempting to phase out BICC until after ISUP over SIGTRAN.\n\n\
    The need to carry signaling over IP was so high that individual companies had\
    \ \n\ndeveloped Reliable User Datagram Protocol (before IETF SCTP) and Extended\
    \ \n\nISUP over IP (E-ISUP, before carrying ISUP over IETF M3UA).\n\nThe lack\
    \ of adoption of ITU-T BICC opened a window of opportunity for the \n\nIETF to\
    \ initiate the Session Initiation Protocol (RFC 2543) in 1999 and clarify it \n\
    \nas RFC 3261 in 2002.\n\n\\* Bit Error Rate."
