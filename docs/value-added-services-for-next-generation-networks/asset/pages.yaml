    \ war economy:\n\n*Hog Butcher for the World,*\n\n*Tool Maker, Stacker of Wheat,*\n\
    \n*Player with Railroads and the Nation’s Freight Handler;*\n\n*Stormy, husky,\
    \ brawling,*\n\n*City of the Big Shoulders:*\n\n*They tell me you are wicked and\
    \ I believe them, for I have seen your painted *\n\n*women under the gas lamps\
    \ luring the farm boys.*\n\n*And they tell me you are crooked and I answer: Yes,\
    \ it is true I have seen the *\n\n*gunman kill and go free to kill again.*\n\n\
    *And they tell me you are brutal and my reply is: On the faces of women and *\n\
    \n*children I have seen the marks of wanton hunger.*\n\n*And having answered so\
    \ I turn once more to those who sneer at this my city, and *\n\n*I give them back\
    \ the sneer and say to them:*\n\n*Come and show me another city with lifted head\
    \ singing so proud to be alive *\n\n*and coarse and strong and cunning.*\n\n*Flinging\
    \ magnetic curses amid the toil of piling job on job, here is a tall bold *\n\n\
    *slugger set vivid against the little soft cities;*\n\n*Fierce as a dog with tongue\
    \ lapping for action, cunning as a savage pitted *\n\n*against the wilderness,*\n\
    \n*Bareheaded,*\n\n*Shoveling,*\n\n*Wrecking,*\n\n*Planning,*\n\n*Building, breaking,\
    \ rebuilding,*\n\n*Under the smoke, dust all over his mouth, laughing with white\
    \ teeth,*\n\n*Under the terrible burden of destiny laughing as a young man laughs,*\n\
    \n*Laughing even as an ignorant ﬁghter laughs who has never lost a battle,*\n\n\
    *Bragging and laughing that under his wrist is the pulse, and under his ribs the\
    \ *\n\n*heart of the people, Laughing!*\n\n*Laughing the stormy, husky, brawling\
    \ laughter of Youth, half-naked, sweating, *\n\n*proud to be Hog Butcher, Tool\
    \ Maker, Stacker of Wheat, Player with Rail-*\n\n*roads and Freight Handler to\
