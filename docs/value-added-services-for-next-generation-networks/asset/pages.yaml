  md: "A next generation communication service could certainly be launched on the\
    \ \n\nbasis of pure functionality only, with Skype as school example — well, at\
    \ least \n\nbefore SkypeOut was added.\n\nHowever, oﬀering a new communication\
    \ service in a sustainable fashion will \n\nrequire the appropriate dose of attention\
    \ for each of the aspects of charging and \n\nrating. A reasonable shopping list\
    \ could include the following:\n\nA single, solid product catalog, well balanced\
    \ between a limited set of prod-\n\nuct types and an extensive set of individual\
    \ options\n\nAn account which is the sum of a user proﬁle and a wallet, with a\
    \ wallet \n\nusage policy allowing a single user to tap into multiple wallets,\
    \ and shared \n\nwallets among corporations, families and the tribes of Section\
    \ 1.11.2\n\nIn general, online charging whenever possible, oﬀ-line charging as\
    \ second \n\nchoice\n\nLimited need for rating, by using nonmonetary credit in\
    \ the wallets (e.g., \n\nseconds, megabits, clicks)\n\nHighly granular metering,\
    \ to be preferred over blind openness to third \n\nparty applications\n\nReverse\
    \ charging where necessary and fair to the service user\n\nClear, real-time Advice\
    \ of Charge at least toward end users\n\nRedirection to top-up and bill payment\
    \ pages\n\nA more ﬂexible payments policy, allowing to use multiple payment chan-\n\
    \nnels independently of the pre- or postpaid nature of an account (anyway, \n\n\
    a single wallet could contain both pre- and postpaid credit)\n\nA well-thought\
    \ promotions and loyalty strategy, after the initial growth phase"
