  md: "*q*\n\nIdeally, a new application could automatically use all existing service\
    \ capabili-\n\nties, and conversely, all applications could easily be improved\
    \ to make use of a \n\nnew service capability. Meaning that the common “language”\
    \ (e.g., API, protocol, \n\nprocedures, message bus) through which the applications\
    \ communicate with the \n\nconnectors should be universal from start: standard\
    \ but extensible, extensible but \n\nfast to decode and encode, and giving both\
    \ parties a good grip on the state of the \n\nother one. It is not an evident\
    \ choice.\n\nThe purpose of this section is not to compare multiple competing\
    \ technologies \n\nfor this language (e.g., JAIN SLEE, Parlay, Parlay X, OMA).\
    \ Some of these stan-\n\ndards are discussed in Section 3.7.\n\nSIP itself is\
    \ of course a candidate. Today’s Media Servers (for packetized voice \n\nand video),\
    \ for example, can already be invited in the session by back-end applica-\n\n\
    tions, using the SIP INVITE method. The Media Server then uses HTTP GET in \n\n\
    order to obtain VoiceXML scripts from the back end and play them (or other media\
    \ \n\ninformation in IETF MSML/MOML format, PacketCable NCS, etc.). SIP itself\
    \ is \n\nthus not enough, and needs to be complemented or extended.\n\nEven for\
    \ quite basic call or message control, can the legacy and the new network \n\n\
    protocols\\* reliably be mapped to internal SIP, by the front-end service capabilities?\
    \ \n\nWill SIP allow preventing the network-speciﬁc aspects from impacting the\
    \ back-\n\nend applications?\n\nThere has been a long debate on whether the “front-end”\
    \ service capabilities \n\nshould reside on the same physical servers as the “back-end”\
    \ applications, or whether \n\nthe servers should be dedicated (Service Capability\
    \ Servers and Application Serv-\n\ners). In principle, it sounds like a waste\
    \ of computing and communication resources \n\n(server I/O,^† network bandwidth)\
    \ to create a front-end-to-back-end dialogue that \n\nwould become (due to the\
    \ protocol encapsulation required) almost as consuming \n\nas the network-to-front-end\
    \ communication. Moreover, inside a front-end Service \n\nCapability, the mapping\
    \ of protocol states, messages, parameters and values from \n\nnetwork side to\
    \ application side should remain a vendor-speciﬁc competence. Stan-\n\ndardization\
    \ attempts have failed. Let’s further assume that the VAS AS run both \n\nthe\
    \ applications and the service capabilities.\n\nAs a quite unrelated topic, service\
    \ creation is often only possible in the Application \n\nlayer, that is, through\
    \ graphical environments where service logic can be modiﬁed.\n\nFew service creation\
    \ environments exist which allow editing database object \n\nstructures, and automatically\
    \ adapting the IT aspects such as screens, security \n\npermissions, provisioning\
    \ commands or call tickets. Therefore, developing the IT \n\naspects for a new\
    \ communications application today often amounts to 90% of the \n\neﬀort to develop\
    \ the service.\n\n\\* ITU-T INAP, ISUP, H.323, 3GPP CAMEL, MAP, IETF RADIUS, DIAMETER,\
    \ etc.\n\n† Input/Output."
  merge: -1
