  md: "For secure communication to the NGN’s SIP proxy, the originating user agent\
    \ may \n\neventually encrypt that outbound SIP INVITE message using IP secure\
    \ (IPSec).\n\nIf no IPSec is used, the enterprise Firewall‘s Application-Level\
    \ Gateway (ALG) \n\nfor SIP is able to look at the requested RTP ports for media,\
    \ and may open them \n\non-the-ﬂy — whereas normally they are kept securely closed.\n\
    \nIf IPSec is used, the enterprise ALG is unable to decrypt the SIP message, so\
    \ it \n\ncannot open RTP ports on-the-ﬂy. The originating user agents must thus\
    \ use RTP \n\nports which are preconﬁgured as open on the Firewall. If the enterprise’s\
    \ IT depart-\n\nment is not willing to leave dedicated ports open, IPsec will\
    \ have to be sacriﬁced.\n\nWhile STUN allows an originating user agent on an enterprise\
    \ LAN to set up \n\noutbound SIP sessions through a NAT, clearly it doesn’t allow\
    \ the external world \n\n(the NGNSP in this case) to set up an inbound session\
    \ to that SIP user agent. The \n\nport (on the external side of the NAT) on which\
    \ SIP INVITEs should be received \n\nkeeps changing, whenever the user agent obtains\
    \ a diﬀerent internal IP address, via \n\nDynamic Host Control Protocol (DHCP).\
    \ In most enterprise networks, new IP \n\naddresses are allocated every couple\
    \ of days.\n\nTraversal Using Relay NAT (TURN) is a principle that allows the\
    \ SIP User \n\nAgent to obtain a *permanent* external address and port from a\
    \ TURN server on the \n\nexternal network, at which the UA can then be contacted.\n\
    \nFrom the description above, it would sound as if SIP user agents should absolutely\
    \ \n\nperform a STUN or TURN query before registering to an NGN and announcing\
    \ \n\ntheir Contact: address, or would otherwise be unreachable when in the enterprise\
    \ \n\nenvironment. STUN and TURN servers should reside inside the SBC that is\
    \ going \n\nto be used to deliver that inbound communication. Otherwise the information\
    \ is \n\nunreliable, certainly if the enterprise has multiple NAT boxes and ISPs.\n\
    \nAs most SIP user agents are today still shipping without STUN/TURN cli-\n\n\
    ent, this issue could hamper the deployment of the NGN itself, until each of these\
    \ \n\ndevices can be allocated a permanent (static) IPv6 address.\n\nThe situation\
    \ is not that dramatic.\n\nToday’s smart SBC’s work in Application-Level Gateway\
    \ (ALG) mode, for user \n\nagents unable to perform the STUN/TURN queries. These\
    \ smart SBC’s automati-\n\ncally translate the periodic SIP registration requests\
    \ to include the temporary exter-\n\nnal address and port on the NAT box.\n\n\
    If the SBC notices that the user agent’s IP address is frequently changing (in\
    \ SIP \n\nregistrations and session initiation requests), thus that the external\
    \ address and port \n\nallocated by the NAT are unreliable, the SBC will even\
    \ insert one of its own perma-\n\nnent IP addresses and ports in the SIP registration,\
    \ and act as the TURN server.\n\n***4.7.3***\n\n***Media Stream Latching***\n\n\
    All the above helps the SIP signaling to ﬂow in the two directions, between user\
    \ \n\nagents behind NAT and an NGN. How about the media streams themselves?"
