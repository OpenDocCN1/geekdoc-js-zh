  md: "a 50,000-person company, or 60 GB^  per employee. Across all communication\
    \ \n\nmeans, world demand could be estimated to be in the order of 5 EB^† today.^‡\n\
    \nFurther demand could arise from storing media in these data centers; that is,\
    \ if \n\npeople would be allowed to leave all their e-mails and attachments on\
    \ the servers, or \n\nif video would start prevailing over voice communication,\
    \ we would be on a steep \n\ncurve to the ZB.^§\n\nWhereas this calls for advances\
    \ in database technology and economies of scale, \n\na second aspect are the networks\
    \ to access all these messages. Broadband connec-\n\ntivity providers are perhaps\
    \ not connecting users to other users, but users to their \n\nmessage library.\n\
    \nThe evolution to deferred communications could end up in a world where mes-\n\
    \nsages and multimedia content are stored and universally accessible, and people\
    \ \n\ncommunicate in terms of “links” (pointers) to stored content. A world where\
    \ know-\n\ning how and where to ﬁnd the info is a more precious skill than knowing\
    \ much or \n\nproducing much new information.\n\nIn that sense it would be useful\
    \ for people to be able to talk about these pointers; \n\nfor communication service\
    \ providers to invent and promote extensions to language. \n\nUniversal Resource\
    \ Locators (URL) are obviously not appropriate.\n\nAfter all, haven’t SMS and\
    \ IM users invented their own “pointers” to longer \n\nexpressions?\n\n**1.10**\n\
    \n**On-Demand, Triggered, and Periodic**\n\nThe circumstances in which communications\
    \ are launched (originated) have an \n\nincreasing inﬂuence on their frequency.\n\
    \nIt’s a pretty vague statement, so let’s pick an example.\n\nNewspapers, for\
    \ example, are available in three modes: on demand at a news-\n\npaper outlet,\
    \ triggered by events such as major catastrophes, or periodically, in \n\nsubscription\
    \ mode.\n\nOn-demand communications require repeated purchase decisions by the\
    \ end \n\nuser, therefore limiting commercial success in the long term, certainly\
    \ in a world \n\nwhere communication means are abundant and compete with each\
    \ other. Their \n\nbeneﬁt, on the other hand, is that they look less obtrusive.\n\
    \n\\* A gigabyte  more than 10⁹ bytes  more than a billion bytes.\n\n† An exabyte\
    \  more than 1018 bytes  more than a billion billion bytes.\n\n‡ According to\
    \ a September 2006 report of industry analyst IDC, shipped storage capacity grew\
    \ \n\nto 704 PB in the second quarter of 2006, representing 51.5% year-on-year\
    \ growth. With an \n\naverage system lifetime of 12 quarters, total installed\
    \ capacity should be at around 7 times that \n\nnumber (4  2  1).\n\n§ A zettabyte\
    \  more than 1021 bytes."
