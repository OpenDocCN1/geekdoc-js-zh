  md: "*q*\n\nConﬁguration management: the NMS should be able to modify conﬁgu-\n\n\
    ration details (e.g., addresses, timers, table sizes) in the VAS platform \n\n\
    — this is very seldom the case.\n\nAccounting management: the VAS platform should\
    \ produce a CDR for \n\neach service event, and transport it to the BSS.\n\nPerformance\
    \ management: the VAS platform should produce statistics \n\ncounters regarding\
    \ each object in the MIB, and periodically send them \n\nto the NMS.\n\nSecurity\
    \ management: the VAS platform should protect itself from intru-\n\nsion by nonauthorized\
    \ persons, a.o. with individual logins also to appli-\n\ncation screens, a periodic\
    \ passwords reset policy, etc.\n\n**6.27 Migration Tools**\n\nSubscriber and service\
    \ database structures in a VAS platform will be enriched \n\nover time, as new\
    \ functions are plugged in to the VAS software. A migration tool \n\nwill extract\
    \ the subscriber and service data used by the previous application soft-\n\nware\
    \ release, manipulated and reinsert it in the database, to be used by the next\
    \ \n\nrelease.\n\nThis process can happen in batches of say 10,000 subscribers,\
    \ or as a continuous \n\nprocess (one by one). But it is important to include\
    \ the roll-back functionality, the \n\nability to restore the previous situation\
    \ before the batch, or even the initial situation.\n\nA major new application\
    \ software release will also bring new screens, MML pro-\n\nvisioning commands,\
    \ CDRs, alarms, statistics, reports, and so on. In most cases, it \n\nwill be\
    \ unfeasible to upgrade the neighboring IT systems to switch to the new version\
    \ \n\novernight, or support two versions simultaneously (e.g., old provisioning\
    \ commands \n\nfor nonmigrated subscribers, and new commands for the migrated\
    \ and new ones).\n\nHere, the best strategy is probably to install the new software\
    \ release support-\n\ning both the old and the new version of the MML, switch\
    \ these external interfaces \n\nto use the new MML one by one, migrate all subscribers\
    \ (by batch or continuous \n\nprocess), and then only stop supporting the old\
    \ MML. The same is true for screens \n\nand the other components. It sounds like\
    \ common sense but how many times is \n\nonly the application software per se\
    \ considered to be a user of the subscriber and \n\nservice data?\n\nMigration\
    \ tools should thus include “railroad switch” processes between old and \n\nnew\
    \ versions of a provisioning interface, screens server or alarms generating process.\n\
    \nDuring major upgrades, hardware, OS and databases will also need to be \n\n\
    replaced. Most of these changes can however be performed in production environ-\n\
    \nments, without requiring migration tools, thanks to the N 1 or 2N redundant\
    \ \n\ndesign of the VAS platform.\n\nA VAS platform architecture needs to be scalable\
    \ not only from the quantitative \n\nperspective but increasingly from a functional\
    \ perspective."
  merge: -1
