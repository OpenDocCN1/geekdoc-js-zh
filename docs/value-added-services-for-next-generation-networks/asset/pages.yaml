  md: "**109**\n\n***Chapter 6***\n\n**Technical Requirements **\n\n**for a Modern\
    \ **\n\n**VAS Platform**\n\nAlong the years, communication service providers and\
    \ their suppliers have accu-\n\nmulated quite some valuable experience to develop,\
    \ test, operate, supervise and \n\nmaintain Value-Added Services (VAS).\n\nIndependently\
    \ of these VAS, they found some common basic principles and recur-\n\nring requirements,\
    \ some of which (e.g., high availability, scalability) are also applica-\n\nble\
    \ to the NGN core network itself, and even to certain access network elements.\n\
    \nWherever it is delivered (e.g., in an access network, core network, VAS platform,\
    \ \n\nbilling system) a “Value-Added Service” can best be considered as an “application”\
    \ \n\nsurrounded by “enablers”: besides the solid layered VAS platform itself\
    \ (hardware \n\nservers, software architecture), also surrounding enablers such\
    \ as training, well-\n\ndocumented operational procedures, data warehousing, ﬁnancial\
    \ supervision and \n\ntargeted marketing, which all have great eﬀects on the quality\
    \ and success of any \n\ncommunication service.\n\nSome Service Providers would\
    \ therefore consider a VAS platform to also include \n\nthese surrounding enablers,\
    \ but here, let’s limit ourselves to the technical aspects of \n\nthe VAS hardware\
    \ and software itself.\n\nLet’s also try and keep this chapter independent of\
    \ the communication means \n\nwe are going to adopt. As such, calls, messages,\
    \ data sessions, multimedia sessions, \n\nand so forth, can be referred to as\
    \ “communication sessions” including several \n\n“transactions.”"
  merge: -1
  pgno: 117
