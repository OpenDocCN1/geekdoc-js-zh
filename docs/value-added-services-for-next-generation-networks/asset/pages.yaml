  md: '# Telecommunications/Business


    In the NGN world, no truer words are spoken than “the future is now.” And the
    competition in the information networking arena will only intensify in the next
    5 to 10 years. Choosing the correct NGN-VAS strategy will set your company apart.
    Value-Added Services for Next Generation Networks examines the quest for the real
    added value in modern communication systems. The author covers more than just
    the technology itself, but also examines how it is being used and how it could
    be used to gain a strategic advantage.


    The book starts with a SOTW analysis for PSTN/GSM operators and new entrants and
    the threats they will undoubtedly face. The author examines the fundamentals of
    genuine communication services and the service providers’ starting position, takes
    you on a tour through the landscape of NGN standards, contrasting the 3GPP IMS
    architecture with that of IETF, UMA, and OMA. He discusses practical ways to build
    an NGN SDP and the essential business aspects involved in this enterprise. The
    book highlights how, technically, the NGN can be interconnected, or glued, to
    the existing GSM/PN infrastructure, justifying the choice of protocols and network
    architecture. It also describes general concepts, architectural requirements,
    and technologies in modern VAS platform and new VAS for the NGN in terms of network
    implementation, end user experience, business scope, and cost/revenue projections.


    But is NGN just a game of investments in equipment, of CAPEX and OPEX savings?
    Is the so-called triple play just a matter of marketing, partnerships, and mergers?
    How will the market play out? Where will the NGN and VAS ultimately go? And more
    importantly, what is your NGN-VAS strategy? By addressing these questions and
    more, this book prepares you for success in the emerging telecommunications environment.


    ![](img/c8fd2b908ba0cdfc90277ef68c496c74_175_0.png)'
