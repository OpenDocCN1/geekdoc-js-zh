  md: "Of course, ASPs are in a special position. Contrary to peer NGNSP’s, ASP’s\
    \ are \n\nproposing their services to the NGNSP’s subscribers (e.g., individuals,\
    \ enterprises). \n\nASPs will have speciﬁc requirements such as the possibility\
    \ to do the following:\n\nOﬀer free services to the end user, services which are\
    \ then perhaps funded \n\nby advertisement or other business models (see also\
    \ Section 5.6) or other-\n\nwise announce the price of an item to the end user\
    \ (Section 5.7)\n\nObtain the end user’s agreement\n\nCheck an end user’s account\
    \ state, and perhaps reserve funds, prior to deliv-\n\nering the service or item\n\
    \nAssess whether the service or item was properly delivered\n\nDebit the user’s\
    \ account when this is the case, and notify the end user\n\nRequest the NGNSP\
    \ to waive other charges associated with the delivery (i.e., the \n\ncharge for\
    \ the transported volume in Megabits, associated to a game level)\n\nInclude ASP\
    \ services in the NGNSP’s product catalog, so the end user bill \n\n(or online\
    \ log) would contain an accurate description of the services ren-\n\ndered and\
    \ items purchased\n\nParticipate in the NGNSP’s subscription, lawful intercept\
    \ and customer \n\ncare processes\n\nThe requirements go far beyond the mechanics\
    \ of session control and media \n\ninjection.\n\nTherefore, ASPs should be treated\
