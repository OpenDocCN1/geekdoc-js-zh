  md: "To ISDN Access GateWays (AGW) located within the enterprise, or on service\
    \ \n\nprovider premises, oﬀering the ISDN Primary Rate Interface (PRI service\
    \ \n\nat the so-called “T” reference point) and more advanced variants (DPNSS,\
    \ \n\nQSIG). The AGCF receives (“backhauls”) the ISDN DSS1 signaling over \n\n\
    SIGTRAN ISDN User Adaptation (IUA), and pilots the AGW via H.248 \n\nprotocol,\
    \ in order to create RTP media streams to the IP access network.\n\nTo V5.2 Access\
    \ GateWays (AGW), which were referred to as “Remote Sub-\n\nscriber Units” (RSU)\
    \ in classic telephony, and which are connected to the \n\ncore network via the\
    \ V5.2 interface: the V5.2 protocol over SIGTRAN V5 \n\nUser Adaptation (V5UA).\
    \ The AGCF also pilots these AGW via H.248.\n\nTo analog and ISDN Access GateWays\
    \ (AGW) also controlled via H.248, \n\nwithin a Multi-Service Access Node (MSAN).\
    \ A MSAN may include V5/\n\nRSU technology, and will also provide the broadband\
    \ Internet access ser-\n\nvices (using DSL technologies, cable, ﬁber to the home,\
    \ etc.). Again, the \n\nAGCF pilots the AGW via H.248.\n\nTo the SIP-I core network\
    \ (SIP for Interconnection, see Section 3.6.5), for \n\nexample, in order to reach\
    \ the Trunking Gateway Control Function \n\n(TGCF). The TGCF controls Trunking\
    \ GateWays (TGW) via H.248, \n\nand sends SS7 ISUP over SIGTRAN M3UA (or MTP3\
    \ over SIGTRAN \n\nM2PA) via Signaling GateWays (SGW) to the legacy PSTN and ISDN.\n\
    \nTo the other TISPAN NGN subsystems, which includes the RACS. The \n\nRACS deals\
    \ with admission control (possibly with overbooking), resource \n\nreservation\
    \ (for bearer resources such as port numbers), policy control (to \n\nenforce\
    \ IP QoS), remote NAT traversal and local NAT. It is composed of\n\nThe Service\
    \ Policy Decision Function (SPDF): a single point of contact for Access \n\nFunctions\
    \ (AF) such as the Proxy-Call Session Control Function (P-CSCF) \n\nor Interconnection\
    \ Border Control Function (I-BCF) over a DIAMETER \n\nGq’ interface; the SPDF\
    \ opens and closes the gates for communication on the \n\nCore or Interconnection\
    \ Border Gateway Functions (C-BGF or I-BGF).\n\nThe Access and Resource Allocation\
    \ Control Function (A-RACF): is invoked \n\nby the SPDF in order to take decisions\
    \ based on current network load, and \n\ncommunicates them to the IP Edge, for\
    \ example, a Broadband Remote \n\nAccess Server (BRAS) for xDSL access (Layer\
    \ 2 Termination Function and \n\nResource Control Enforcement Function), via the\
    \ Re interface.\n\nThe NASS is responsible for IP address allocation and other\
    \ traditional Authen-\n\ntication, Authorization and Accounting (AAA) functions\
    \ in the access network. \n\nIt is invoked by an Access Management Function (AMF)\
    \ at the IP edge (i.e., the \n\nBRAS, in the xDSL access example). It stores the\
    \ IP address which was allocated to \n\na given user device, as this may be useful\
    \ information to applications.\n\nThe TISPAN architecture is very complete and\
    \ advanced, however one may \n\nwonder whether it doesn’t require specialized\
    \ entities or sub-contractors to operate \n\nthe RACS and NASS."
