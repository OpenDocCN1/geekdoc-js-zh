  md: "For a single, mainstream communication means to be successful, it should \n\
    \ntoday probably always be conceived as a contextual part followed by an interactive\
    \ \n\npart.\n\nIf not, the missing portion will have to be added as a bolt-on\
    \ feature and this \n\ncan never be as successful as incorporating it in the original\
    \ design.\n\n**1.6**\n\n**Device, Connectivity, and Service**\n\nBoth true communication\
    \ and stored media transfer involve consumers purchasing \n\nmore or less tightly\
    \ packaged oﬀers including a device (e.g., a pocket PC), some \n\nconnectivity\
    \ (e.g., WiFi and DSL for Internet access) and some services: e-mail, \n\nWeb\
    \ browsing, instant messaging, search engines, VoIP just to name the most \n\n\
    popular on the Internet. These three components can, together, be considered to\
    \ \n\nform a “communication means.”\n\nAs we will see in Chapter 6, developing\
