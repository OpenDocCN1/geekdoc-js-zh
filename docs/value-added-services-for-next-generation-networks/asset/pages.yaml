  md: "some quality of service, even if enforced end-to-end — even if corporations,\
    \ \n\nlarge and small, might find telepresence (videoconferencing over IP) extremely\
    \ \n\nvaluable.\n\nIt is essential for modern telecommunication service providers\
    \ to position them-\n\nselves relative to genuine communication versus the transmission\
    \ of stored media: \n\nshould they invent and launch new communication means,\
    \ or provide high quality \n\nbit pipes for stored contents they don’t interpret?\
    \ Are they going to deliver Value-\n\nAdded Services or just Next Generation Networks?\
    \ *Are they going to be the diplomat *\n\n*or the pigeon?*\n\nFailing to specialize\
    \ and be successful in the one or the other, some of them \n\nmay be tempted to\
    \ become *the bard* — the creators of stored content — resulting in \n\ninvestments\
    \ in portals to *walled gardens*, movie-on-demand servers, soccer broad-\n\ncasting\
    \ rights, music catalogs, and so on.\n\nThese digressions from the original company\
    \ mission and core business cannot \n\nbe justiﬁed with the need to demonstrate\
    \ the usefulness of the bit pipes. Remember \n\nthese nineteenth-century railway-owned\
