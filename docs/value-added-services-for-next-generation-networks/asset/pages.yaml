  md: "**69**\n\n***Chapter 4***\n\n**Engineering the NGN**\n\nUp to here, we have\
    \ examined the fundamentals of genuine communication \n\nservices (Chapter 1),\
    \ considered at a modern service provider’s starting position\n\n(Chapter 2),\
    \ and taken a tour through the landscape of NGN standards (Chapter 3).\n\nWhat\
    \ does it take to become a NGN Service Provider (NGNSP)?\n\nAs we’ll see in the\
    \ upcoming chapters, we’ll need a way to charge our customers \n\n(Chapter 5)\
    \ and a reliable VAS platform (Chapter 6).\n\nBut here, let’s concentrate on the\
    \ practical way to build a NGNSP, which should \n\nlead us to consider some essential\
    \ business aspects too.\n\nTo start quickly, we could download the SIP Express\
    \ Router (SER) and SIP Express \n\nMedia Server (SEMS) from iptel.org on a Linux\
    \ PC, and be ready in minutes to convey \n\nvoice and video traﬃc over IP. Let’s\
    \ call our little enterprise ngvas.com.\n\nThe next step is to persuade Alice\
    \ White,\\* our model user, to conﬁgure her IP \n\nphone, softphone or multiplayer\
    \ game to use ngvas.com as the default proxy for \n\noutbound voice and video\
    \ communications.\n\nWould Alice submit her outgoing session initiation requests\
    \ for sip:19191234567@\n\nngvas.com, sip:19191234567@chicago.com or even sip:carl.sandburg@chicago.\n\
    \ncom^† to ngnvas.com?\n\nHow would Alice know of the existence of ngnvas.com\
    \ — through search \n\nengines? Would her IT administrator in atlanta.com look\
    \ for new VoIP carrier \n\n\\* Alice is the originating user in IETF RFC 3261\
    \ on SIP. Alice White was an American ﬁlm \n\nactress born as Alva White (1904–1983),\
    \ who started her career in silent ﬁlms but successfully \n\nswitched to talking\
    \ movies in the late 1920s, as her voice matched her screen image perfectly.\n\
    \n† Carl Sandburg (1878–1967) was an American poet, historian and novelist who\
    \ focused most \n\nof his poetry on Chicago, praising American agriculture and\
    \ industry, a. o. in his famous \n\npoem “Chicago” in 1916."
