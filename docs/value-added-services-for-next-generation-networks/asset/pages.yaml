  md: "Warehouse, price comes second. Third are style factors: form factor (e.g.,\
    \ clam shell, \n\nslidephone, PDA), weight, design, and brand image.\n\nThe consumer\
    \ of mobile connectivity lost attention for the complex tariﬀ \n\nplans of mobile\
    \ service providers, but was attracted by practical services such as \n\nnew prepaid\
    \ top-up methods, Web-based prepaid (oﬀered by MVNOs — Mobile \n\nVirtual Network\
    \ Operators), or single-stop shopping for communications, Internet, \n\nand TV.\n\
    \nThe “Full MVNO” trend, where independent organizations operate their own \n\n\
    HLRs and prepaid platforms, is a perfect illustration of how services can be split\
    \ oﬀ from \n\nconnectivity. Of course both layers continue to communicate in real\
    \ time to control the \n\nrouting and duration of calls, sessions, messages, and\
    \ hopefully one day which media \n\nare allowed and what QoS is applied (we’ll\
    \ discuss that further in Section 3.3.2).\n\nIn such an environment, the choice\
    \ of services can and will thus still be made \n\nlater. Televoting, gaming, navigation,\
    \ music download, community services and \n\ntelemetry will not necessarily come\
    \ from your current mobile and Internet con-\n\nnectivity providers.\n\n***1.6.4***\n\
    \n***Evolution***\n\nThe cellular communications industry isn’t quite there yet,\
    \ but a similar evolution took \n\nplace in the personal computing and Internet\
    \ space, around 15 years earlier.\n\nSince the early 1990s, the markets for computing\
    \ devices, Internet connectivity \n\nand services evolve completely independently.\n\
    \nSpecialized form factors (e.g., laptop, pocket PC, cube, server blade, set-top\
    \ \n\nbox) and designs appeared on the device market.\n\nConnectivity technologies\
    \ evolved from dial-up to digital subscriber lines, \n\ncable, wireless and soon\
    \ mobile.\n\nThe services market is probably also 10 years ahead of what we see\
    \ in the cellular \n\nspace, where the usage of search engines for example, is\
    \ marginal. The usage of Web-\n\nbased address books is nil from cellular devices\
    \ (people use the local address book \n\nin the SIM and/or the phone). But it\
    \ is substantial in the PC/Internet world — for \n\nexample, with free services\
    \ such as Plaxo and LinkedIn.\n\nNew communication means should be developed and\
    \ positioned either as a \n\ndevice feature, or as a connectivity mode, or as\
    \ a service. It won’t be possible to \n\nbundle the three aspects anymore.\n\n\
    **1.7**\n\n**Cellular, Mobile, and Wireless**\n\nIn an ideal world, the service\
    \ plane would be completely decoupled from the con-\n\nnectivity plane; therefore\
    \ we wouldn’t need to consider these connectivity proper-\n\nties when discussing\
    \ services."
