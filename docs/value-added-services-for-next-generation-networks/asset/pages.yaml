  md: "per Hertz. In real life, that value is a bit higher for downlink and lower\
    \ \n\nfor uplink traﬃc, but never mind, is roughly double of what you can get\
    \ \n\nout of CDMA transmission (3GPP HSPA and 3GPP2 EVDO).\n\nWirelessMAN-OFDMA¢\
    \ (“Orthogonal Frequency Division Multiple \n\nAccess”): Here, the subcarriers\
    \ (e.g., 10, adjacent or not) are grouped in \n\nsubsets (i.e., 20) named subchannels.\
    \ In the uplink, several transmitters \n\nmay transmit simultaneously as long\
    \ as they use diﬀerent subchannels\n\n(e.g., 3) or other times (e.g., 4 OFDMA\
    \ symbols) to transmit — hence \n\nthe name “Multiple Access.” The combination\
    \ of a subchannel and time is \n\ncalled a slot; in the example there are 12 slots\
    \ available.\n\nIn unlicensed mode below 11 GHz, WirelessHUMAN¢ is the term IEEE\
    \ \n\nuses to deﬁne the usage of one of the three PHY options above, plus the\
    \ \n\nspeciﬁc requirements for unlicensed operation.\n\nIt is WirelessMAN-OFDM\
    \ (licensed or not), and thus also WirelessHUMAN \n\n(unlicensed), which support\
    \ both PMP and Meshed network architectures.\n\nAs for any two-way radio technology,\
    \ WiMAX uplink and downlink transmis-\n\nsion either have to use diﬀerent times\
    \ (TDD: Time Division Duplex) or diﬀerent \n\nfrequencies (FDD: Frequency Division\
    \ Duplex); both modes are supported in \n\nWiMAX. GSM is only TDD and for 3G,\
    \ incompatible variants have appeared:\n\nChinese TD-SCDMA is obviously TDD.\n\
    \n3GPP W-CDMA is FDD.\n\n3GPP2 EVDO is FDD.\n\nBesides WiMAX, and contrary to\
    \ 3GPP/3GPP2, which only focuses on long \n\nrange wireless technologies, the\
    \ IEEE also developed a low-power, ultra-short range \n\n(10m) wireless technology,\
    \ Bluetooth (802.15.1), to build Wireless Personal Access \n\nNetworks (WPAN)\
    \ or wireless peer-to-peer networks.\n\nThe short-range wireless technologies\
    \ beneﬁt from rapid and worldwide adop-\n\ntion by the computer and peripheral\
    \ manufacturers.\n\nWith the mobile cellular phone now a computer, IEEE technologies\
    \ ﬁnd \n\ntheir way into these devices, perhaps at an even faster pace than 3GPP/3GPP2\
    \ \n\ntechnologies.\n\n**3.8**\n\n**OMA**\n\nThe OMA was created in June 2002\
    \ in response to various organizations attempt-\n\ning to standardize mobile data\
    \ services: the WAP Forum (focused on browsing and \n\ndevice provisioning protocols),\
    \ the Wireless Village (dealing with instant messaging \n\nand presence), the\
    \ SyncML Consortium (for data synchronization), the Location \n\nInteroperability\
    \ Forum, the Mobile Games Interoperability Forum and the Mobile \n\nWireless Internet\
    \ Forum. The OMA was created to gather these initiatives under a \n\nsingle umbrella.\n\
    \nN\n\nN"
