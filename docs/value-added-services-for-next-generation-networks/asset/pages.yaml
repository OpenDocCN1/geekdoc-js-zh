  md: "Some will see the hand of the GSM Association, who would have refused to \n\
    \ngrant full membership to ISPs and WiFi federations, therefore would have denied\
    \ \n\nthem the rights to\n\nClose roaming agreements, specifying their inter-operator\
    \ tariﬀs (IOT) for \n\nInternet access via WiFi and other broadband access technologies\n\
    \nConnect to the international SS7 networks (using MAP for authentication \n\n\
    and mobility procedures)\n\nUse CAMEL (Customized Application of Mobile Enhanced\
    \ Logic, 3GPP \n\nTS 03.78 / 23.078 / 09.78 / 29.078) for real-time charging to\
    \ the mobile \n\nprepaid account\n\nConnect to roaming clearing houses, for inter-operator\
    \ CDR exchange \n\nand settlement\n\nThe aforementioned scheme (let’s call it\
    \ UMA 2.0) was actually realized and \n\nis currently in commercial operation\
    \ by a few hot spot federations owned by, or \n\nclosely linked to, mobile operators.\n\
    \nFrom a macroeconomic perspective, it would have made sense to reuse the exist-\n\
    \ning charging, top-up, billing and customer care resources (infrastructure, employ-\n\
    \nees) of the (home) mobile operators. Broadband Internet service providers and\
    \ hot \n\nspot federations could have become diligent and loyal resellers of what\
    \ remains \n\nessentially a basket of mobile operator services.\n\nIt is also\
    \ a safe bet that the addition of unlicensed Internet access would have \n\nincreased\
    \ the general adoption and turnover of mobile data.\n\nBut UMA 2.0, by supporting\
    \ VoIP and IM, would have put circuit-switched \n\nvoice and sms revenue and price\
    \ under strong pressure. It’s a battle the GSM opera-\n\ntors aren’t prepared\
    \ to ﬁght. Today’s regulatory threats to roaming revenues are a little \n\nteaser\
    \ compared to what could happen in case of widespread UMA 2.0.\n\nUMA (1.0) market\
    \ trials have indeed shown that in practice, 70% of communi-\n\ncations were made\
    \ through the residential hot spot, and 30% via GSM.\n\n***3.3.2***\n\n***IMS***\n\
    \nFundamentally, the 3GPP IMS’s goal is to be an IETF NGN “plus.”\n\nBut, as we\
    \ will see in the upcoming Section 3.5, it soon became a TISPAN \n\nNGN “minus.”\n\
    \n3GPP has used its recognized experience in the domains of authentication and\
    \ \n\nmobility to address the main “holes” in the IETF NGN: security, mobility,\
    \ service \n\nhooks and QoS enforcement. These are actually area’s which are still\
    \ open, con-\n\nstantly evolving and where it’s not sure whether a dominant solution\
    \ will emerge. \n\nLet’s therefore consider them more closely in the upcoming\
    \ sections.\n\nBesides these topics, 3GPP IMS also\n\nDeﬁned private and public\
    \ user identities"
