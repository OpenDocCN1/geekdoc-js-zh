  md: "Today, as the distinction between a network and a service is almost gone, “Engi-\n\
    \nneering the NGN” is to be interpreted in a totally diﬀerent way.\n\nNevertheless,\
    \ in this book we still think it’s worth maintaining the distinction \n\nbetween\
    \ “NGN” and “VAS” even if they might be oﬀered under the same com-\n\nmercial\
    \ label (ngvas.com).\n\n**4.1**\n\n**Advertising and Discovery**\n\nOne of the\
    \ reasons why communication consumers used to rely on central com-\n\nmunication\
    \ service providers is the addressing plan. We already mentioned this \n\nas a\
    \ strength in Section 2.1. As the service providers are mutually interconnected\
    \ \n\nin a cascade model, end users are able to communicate with a large number\
    \ of \n\neasily addressable destination users, identiﬁed by unique and permanent\
    \ contact \n\naddresses, that is, E.164 telephone numbers.\n\nCommunication consumers\
    \ have a fundamental need, namely to resolve these \n\nhigher level contact addresses\
    \ (URI, Uniform Resource Identiﬁers, RFC 2396) to \n\ndiscover a routable IP address\
    \ — either directly of the destination end user, or more \n\nlikely of a suitable\
    \ border gateway, able to relay the media streams onwards to the \n\nactual destination\
    \ network or user.\n\nWhereas for classic telephony the originating user would\
    \ rely heavily on the \n\ncommunication service provider as an “address translator,”\
    \ the ubiquitous avail-\n\nability of always-on IP connectivity (broadband) and\
    \ the packetization of our com-\n\nmunication means are changing that model. The\
    \ end user today has a wide range \n\nof options to discover the routable IP address\
    \ corresponding to a buddy in a contact \n\nlist or (maybe soon) a geographic\
    \ location on a map, a character in an online game, \n\nand so on.\n\nDomain Name\
    \ Service queries (DNS, RFC 1035 and related) may be per-\n\nformed to obtain\
    \ host names and ﬁnally routable IP addresses for various applica-\n\ntion addresses,\
    \ for genuine communications or for the transfer of stored media, for \n\nSIP-\
    \ and non-SIP based applications. A DNS server can, for a single destination \n\
    \ndomain, hold diﬀerent records\\* for SIP and for other applications (e.g., e-mail,\
    \ \n\nbrowsing).\n\nThe public DNS infrastructure has not been populated with\
    \ records for SIP, but \n\nif they wanted, ISPs could thus use that general public\
    \ mechanism to direct SIP \n\nrequests from their broadband users to the NGNSP’s.\n\
    \nAlternatively, the ISP could allow each broadband customer to select a default\
    \ \n\nNGNSP, or even to indicate their preferred NGNSP in the SIP URI, on a per\
    \ ses-\n\nsion basis (sip:carl.sandburg@chicago.com.ngvas.com).\n\nIn an even\
    \ more advanced scheme, the user agent may choose to send all SIP \n\nrequests\
    \ to an address resolution service (locally preconﬁgured as an IP address or \n\
    \n\\* IETF RFC 3403 deﬁnes these as the Naming Authority Pointer (NAPTR) Resource\
    \ Records \n\n(RR)."
