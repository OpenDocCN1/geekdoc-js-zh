  md: "Is digital TV a truly interactive experience with potentially thousands of\
    \ chan-\n\nnels on very specialized and local topics (communication), or will\
    \ it only allow me to \n\nwatch previous shows and download movies on demand (storage)?\n\
    \nWhy is wireless broadband access (WiFi) suddenly built into this new por-\n\n\
    table gaming device? For multiplayer games (communication) or to download new\
    \ \n\ngames (storage)?\n\nThe line may seem thin between “genuine” communication\
    \ and “just” the elec-\n\ntronic transmission of stored media. But it isn’t!\n\
    \nGenuine communication diﬀerentiates itself from stored media transmission \n\
    \nwith *timeliness*,* expectation,* and *unpredictability*.\n\nAs the time increases\
    \ between the production of the data and their transfer, \n\nsuch as in the case\
    \ of books, art exhibitions or song downloads, people tend not to \n\nqualify\
    \ this as communication anymore. Even though press critics clearly provide \n\n\
    feedback on books, movies and recorded music (the bidirectional aspect).\n\nIf\
    \ the initiator expects a response, communication takes place, even if technically\
    \ \n\nno response may actually come. Sending an application letter to a company\
    \ would \n\nqualify as genuine communication, posting your curriculum vitae online\
    \ wouldn’t.\n\nUnpredictability is required too. Is *using a search engine *genuine\
    \ communica-\n\ntion? No — do the same query in 5 minutes and it will result in\
    \ the same results. \n\nIn a corporate organization, the outcome of a Web training\
    \ is less predictable (in \n\nterms of questions from the attendants, unexpected\
    \ disagreement, next actions aris-\n\ning, etc.) than the outcome of a written\
    \ note on the same subject, to the same list \n\nof persons (of which the impact\
    \ will probably be more limited). The Web training \n\nwould qualify as genuine\
    \ communication; the note would be only transmission of \n\nstored media.\n\n\
    The volume of data, or the pace at which it is transferred, plays no role to qual-\n\
    \nify an interaction as “communication.” For example, one sigh says more (can\
    \ better \n\nbe qualiﬁed as genuine communication) than a thousand words. And\
    \ people are \n\nwilling to pay 50 cents to send one byte of information (a single\
    \ digit) in a televot-\n\ning sms taking 10 seconds to reach the TV show. But\
    \ 1 Euro sounds expensive for \n\na megabyte of high-speed mobile data traﬃc (for\
    \ example, containing 10 e-mails). \n\nA higher volume and speed are not necessarily\
    \ perceived as more valuable com-\n\nmunication. There’s a common belief that\
    \ broadband services actually kill more \n\nvalue (the revenue of narrowband services)\
    \ than the amount of new value they \n\ncreate. Volume and bandwidth are rapidly\
    \ commoditized, genuine communication \n\nservices probably won’t be.\n\nIs genuine\
    \ communication more attractive and valuable than long-term \n\nstorage?\n\nNot\
    \ necessarily. Things change with age. Teenagers may have many contacts \n\nwith\
    \ peers, but as life advances, elderly people love their music collection, movies,\
    \ \n\nbooks and photo albums.\n\nFor sure, the transfer of stored media over IP\
    \ networks has become a commodity, \n\nand it is still a question whether the\
    \ residential end user is willing to pay for"
