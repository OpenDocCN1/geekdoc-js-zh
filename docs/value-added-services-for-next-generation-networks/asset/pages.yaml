  md: "*g*\n\n*g*\n\n*g*\n\n*q*\n\nLimited credit and single-use (non-rechargeable)\
    \ balances are the two other types. An \n\naccount will thus never be 100% prepaid\
    \ or 100% postpaid.\n\nA single balance may be organized in multiple *buckets*\
    \ of credit, each with a dif-\n\nferent validity date (after which the credit\
    \ is suppressed) or future installment date \n\n(as of which the credit becomes\
    \ usable). A balance thus has no expiration date; it is \n\nthe bucket which has\
    \ it.\n\nA good idea is also to group multiple balances into a wallet. An end\
    \ user could \n\nuse credit from multiple *wallets*: a shared company wallet for\
    \ business communi-\n\ncations in the day time, a shared family wallet for international\
    \ calls to a favorite \n\ndestination, and a personal wallet for all other calls,\
    \ for example. The wallet to be \n\nused could be determined either by the end\
    \ user or by the communication service \n\nprovider, based on the service being\
    \ used, the destination, time of the week, and so \n\non: a real “wallet usage\
    \ policy.”\n\nWhat kind of data will we ﬁnd in the *user*’s proﬁle? In there,\
    \ for end users as \n\nwell as partners, we will ﬁnd the user’s identiﬁcation\
    \ and contact details, the history \n\nor customer care contacts, the lifecycle\
    \ data, links to purchased options (with their \n\nown lifecycles and renewal\
    \ policies), preferred destinations (e.g., friends and family) \n\nand negotiated\
    \ discounts.\n\nAs the user and the wallet together determine the tariﬀ being\
    \ applied, besides of \n\ncourse the commercial channel and individual options\
    \ which nevertheless have less \n\neﬀect, the combination of a user and a wallet\
    \ forms a valid deﬁnition of an *account*.\n\nAn account is thus not only a user\
    \ having selected a product type and options, nor \n\nonly a wallet full of balances\
    \ and buckets (credit). It is encompassing both aspects.\n\nAn account is also\
    \ not to be confused with a *payment channel*. Multiple pay-\n\nment channels\
    \ (an invoicing address, a credit card authorization, a scratch voucher, \n\n\
    a bank-to-mobile transfer, etc.) could indeed be used to settle a bill or top-up\
    \ a wal-\n\nlet. A scratch voucher could for example be used to settle a postpaid\
    \ bill.\n\nMobile operators used to implement the user account databases as “Operator\
    \ \n\nSupport Systems” (OSS) on one side and “Prepaid Intelligent Network” systems\
    \ on \n\nthe other, but there’s no reason to make such distinction. A generic\
    \ “accounts sys-\n\ntem” would do, and could even be used for reseller/dealer\
    \ accounts, inter-operator \n\naccounting and application service providers.\n\
    \nAre the options speciﬁc to a user? Today they are, but one could imagine options\
    \ \n\non the wallets too. In that sense it is a more future-proof idea to link\
    \ new options \n\nto an account rather than to a user or partner proﬁle.\n\n**5.3**\n\
    \n**Charging**\n\nCharging is the process through which the network delivering\
    \ the communications \n\nservice is interacting with the system holding the accounts.\n\
    \nIn theory, the network should interact with a charging system, which in turn\
    \ \n\nshould tap from an accounts system, which would ﬁnally consult a product\
    \ catalog."
