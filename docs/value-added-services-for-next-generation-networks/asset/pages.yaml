    \ \n\nscheme, build up a captive community and let your advertisers pay for the\
    \ band-\n\nwidth being consumed by your central servers. “Don’t worry about quality;\
    \ your \n\nend users are captive.” Sure?\n\nThe business model of an NGNSP, using\
