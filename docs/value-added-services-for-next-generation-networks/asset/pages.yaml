  md: "*g*\n\nI had been working in the A&W (avatar and wink) industry in the 2010s,\
    \ \n\nfor various kloonie design bureaus. We created the ﬁrst real video kloonies,\
    \ with \n\ntext-to-speech technology, and got their lips moving and their faces\
    \ being really \n\nexpressive. We added their very ﬁrst communication skills,\
    \ allowing them to act as \n\nfully independent NGN user agents. It’s also in\
    \ those days that the Kloonies started \n\nto transfer themselves from mobile\
    \ to mobile, through the SIP session, with their \n\nmedia backpacks full of music\
    \ and videos.\n\nIt’s a long story but kloonies themselves were born in 2006,\
    \ when skype (now \n\nneurobay) launched them as simple avatars to cheer up their\
    \ sessions.\n\nYou all know what happened when they connected the ﬁrst animals\
    \ (dogs \n\nand horses) to the Internet around 2020. One-megasensor Wibree chips\
    \ had been \n\nimplanted, and their brain signals would be made available as raw\
    \ output on the ﬁrst \n\nneurosites. These brain instructions would be received\
    \ by very simple devices in the \n\nfront end, like robotic dogs and radio-controlled\
    \ toy cars. The live animals in the back \n\nend would thus watch and hear the\
    \ front end devices move and speak. As always, the \n\nietf did a great job with\
    \ their Neuro Session Control Protocol (NSCP, RFC 8682) and \n\nNeuro Real Time\
    \ Protocol (NRTP, RFC 9057) in 2021. The neuronet was born.\n\nA popular joke\
    \ was that NASA let neurosites control their rovers in the 2022–\n\n2024 missions\
    \ to Ceres. A shame for humanity!\n\nIt’s your dad who had the idea to connect\
    \ a kloonie to the neuronet. We mapped \n\nthe kloonies’ SIP protocol and media\
    \ streams to NSCP and NRTP, as many others \n\nhad done for other applications.\
    \ We allowed the kloonies to interact with diﬀerent \n\nneurosites, and to build\
    \ their own local intelligence. And we called the result “bots.”\n\nWe saw our\
    \ creations, under instruction of the neurosites, setting up the ses-\n\nsions\
