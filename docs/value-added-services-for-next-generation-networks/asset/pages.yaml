  md: "*q*\n\nIndeed, it is inconceivable to deﬁne UNIX logins, passwords and ﬁle\
    \ permis-\n\nsions on a per machine basis.\n\nThe topic of remote access brings\
    \ up a related topic, namely the passwords \n\npolicy. It should not be allowed\
    \ to deﬁne trivial general password acceptance and \n\nrefreshment policies. Trivial\
    \ passwords should not be accepted; the user should be \n\ninformed about the\
    \ estimated strength of his newly chosen password, and access \n\nshould not be\
    \ permitted without the user regularly being forced to refresh his/her \n\npassword.\n\
    \nOf course the remote access pipe needs to be secure. Various IP VPN products\
    \ \n\nallow remote support personnel to access the company LAN through the public\
    \ \n\nInternet, but their permissions should be limited to a given set of machines\
    \ and \n\nlogins.\n\nLimiting the access to only a set of machines is a poor option,\
    \ as support teams \n\nfrom diﬀerent software vendors should be able to log in\
    \ to a shared VAS application \n\nserver, and see only their application’s directories\
    \ and ﬁles (or only the database, for \n\nexample) — perhaps a noble but unachievable\
    \ goal.\n\n**6.24 Hosting**\n\nThe all-IP NGN and VAS platform architecture calls\
    \ for hardware, OS and soft-\n\nware hosting.\n\nHosting is today known as the\
    \ activity to rent and maintain computer hard-\n\nware, operating systems, databases,\
    \ remote access servers, ﬁrewalls, rack space, \n\nreliable power, cooling, and\
    \ LAN and IP connectivity for either NGN service pro-\n\nviders or VAS software\
    \ suppliers.\n\nHosting is providing a hotel for applications.\n\nAnd in a hotel,\
    \ check-in and check-out are among the more important proce-\n\ndures inﬂuencing\
    \ customer satisfaction.\n\n**6.25 Reporting**\n\nReporting is too often confused\
    \ with performance management (which we’ll \n\naddress in Section 6.26).\n\nPeriodic,\
    \ triggered and on-demand reports should inform the NGNSP about \n\nthe uptake\
    \ of communication means and value-added services, both in terms of \n\nsubscription\
    \ and usage.\n\nThis starts from the number of subscribers having subscribed,\
    \ via a given com-\n\nmercial channel, to a given service, product type and individual\
    \ options — the \n\nstructure we discussed in Section 5.1.\n\nNext, the usage\
    \ needs to be analyzed not only in terms of successful communi-\n\ncation events\
    \ per service, product type, option and destination, but also in terms of \n\n\
    failed session establishment attempts."
