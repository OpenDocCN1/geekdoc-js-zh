  md: "**131**\n\n***Chapter 7***\n\n**New Generation**\n\n**of Value-Added Services**\n\
    \nIn the past chapters, we have made an attempt to do the following:\n\nCharacterize\
    \ communication means, in Chapter 1\n\nExamine the communication service providers’\
    \ starting position, in Chapter 2\n\nSummarize the networks proposed by the standards\
    \ bodies, in Chapter 3\n\nInterconnect these networks, in Chapter 4\n\nEvaluate\
    \ the charging requirements, in Chapter 5\n\nProduce the wish list for the service\
    \ platforms that will host the new appli-\n\ncations, in Chapter 6\n\nWe should\
    \ now have a good idea of the environment in which successful Value-\n\nAdded\
    \ Services (VAS) could be created, at least from a technical perspective.\n\n\
    Our macro-view in Section 2.5 even suggested that there could be room for new\
    \ \n\nVAS proposals, to be accessed by enterprise telephones and mobile data devices:\n\
    \nWill basic TISPAN NGN service (establishing SIP sessions, with QoS enforce-\n\
    \nment and SBC functions) at $10 a month be considered superior to Plain Old \n\
    \nTelephone Service (PSTN) at $6 a month?\n\nWould you invest in your own $35-a-head,\
    \ fully serviced enterprise IP PBX, or \n\nwould you rather rely on a $10-a-month\
    \ voice and video centrex oﬀer from your \n\nNGN service provider?\n\nRather than\
    \ subscribing to a $35-a-month IPTV program, digital DVB-H or \n\neven plain old\
    \ analogue broadcasting at $20 a month, people might pay a $5 to $10 \n\npremium\
    \ a month to view YouTube videos on large screens, in a high-deﬁnition \n\nvideo\
    \ version — with some IP QoS enforced."
  merge: -1
