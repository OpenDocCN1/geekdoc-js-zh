  md: "In fact, an NGN service provider could add the VAS platform inside the user\
    \ \n\ndevice (on top of a NGN User Agent), on servers in the core network (the\
    \ most eas-\n\nily manageable and commonly used model) or even let “third parties”\
    \ deliver the \n\nVAS (the model of application service providers). Similar requirements\
    \ would arise \n\nin the three cases, for the VAS platform.\n\nFor a long time\
    \ the domain of Requests for Information (RfI), Requests for \n\nQuotation (RfQ)\
    \ and Requests for Proposal (RfP) by ﬁxed and mobile communi-\n\ncation service\
    \ providers, here’s an attempt to summarize the common requirements \n\nfor these\
    \ VAS platforms, independently of the application(s) that would be hosted \n\n\
    on these systems.\n\n**6.1**\n\n**Toward a Layered Platform Architecture**\n\n\
    Traditional VAS platforms (prepaid systems, voicemail, etc.) used to each have\
    \ their \n\nown hardware, operating system, database, data structures, service\
    \ logic, “south-\n\nbound” network interfaces and “northbound” interfaces for\
    \ provisioning, billing and \n\nsupervision. A single subscriber would have been\
    \ deﬁned in each of these platforms.\n\nA beneﬁt of these vertical “VAS silos”\
    \ has been that they could be selected from \n\ndiﬀerent vendors, without too\
    \ much integration eﬀort by the communication ser-\n\nvice provider.\n\nHowever,\
    \ new eﬃciencies could be found if the VAS platforms were organized \n\nas follows\
    \ (from top to bottom):\n\nAn IT sublayer, essentially a near-real-time (oﬀ-line)\
    \ environment providing \n\nthe so-called “northbound interfaces” (provisioning,\
    \ billing, supervision) \n\nto external IT systems, and oﬀering a service creation\
    \ environment\n\nAn Applications sublayer, selecting and executing service logic\
    \ based on \n\nsubscriber and service data in real time (online) — not only for\
    \ charging \n\npurposes but also to deliver meaningful communication services\n\
    \nA Service Capabilities sublayer, stateful\\* “connectors” isolating network\
    \ and \n\nprotocol diﬀerences from the applications; some connectors are providing\
    \ \n\nthe server side to the outside world, whereas others should act as the client\
    \ \n\nto third party databases; but in principle, the Service Capabilities them-\n\
    \nselves should not require access to subscriber data^† (only applications do)\n\
    \nAn Infrastructure sublayer, consisting of best-of-breed servers, operating sys-\n\
    \ntems, database, protocol stacks, switches, routers, gateways for signaling \n\
    \nand media\n\n\\* Stateful means that such connector (or Service Capability)\
    \ should maintain a communica-\n\ntion session state (Context information), contrary\
    \ to a protocol stack which only maintains a \n\ntransaction state.\n\n† The problem\
    \ would then arise how one Service Capability would access subscriber data held\
    \ \n\non third party databases, through another Service Capability."
  merge: -1
