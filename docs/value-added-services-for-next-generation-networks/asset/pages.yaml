  md: "**6.19**\n\n**Modularity**\n\nSoftware is modular when the functionality is\
    \ broken down to appropriately sized, \n\nnonoverlapping entities. These entities\
    \ are typically one notch lower in the hierar-\n\nchy than the components we discussed\
    \ in Section 6.12.\n\nUsing a reasonable number of Dynamic Linked Libraries (.dll),\
    \ each dedicated \n\nto an understandable function, for example, decoding/encoding\
    \ a given protocol, \n\nis a good example of modular design.\n\nAn average Service\
    \ Capability, for example, would need to speak at least a \n\nsouthbound protocol\
    \ (toward the network) and a northbound protocol (toward the \n\napplication),\
    \ plus libraries for TMN FCAPS functions and so forth.\n\nHence the rules outlined\
    \ in Sections 6.1 and 6.12 unfortunately do not prevent \n\ntelecom software (VAS\
    \ platform software in this case) to become nonmodular. A \n\nsame protocol library\
    \ is included as diﬀerent code in two service capabilities; diﬀer-\n\nent applications\
    \ start using diﬀerent code for database access or CDR generation, \n\ndiﬀerent\
    \ screen panels and underlying database tables include similar subscriber \n\n\
    information, and so on.\n\nAs this level of detail is usually visible only in\
    \ the detailed design documents \n\nand in the source code itself, it is diﬃcult\
    \ for the communication service provider \n\nto assess the modularity of the code.\n\
    \n**6.20 Data Model**\n\nThe data model is a representation of the persistent\
    \ information in the subscriber \n\nand service database. It can also be used\
    \ to describe in-memory information such \n\nas call contexts or protocol state\
    \ machines.\n\nUsually a call model comes as a diagram of database tables, linked\
    \ to each other \n\nvia one-to-many and many-to-many relationships.\n\nIt helps\
    \ people understand the existing information, and to imagine how new \n\ninformation\
    \ can best be added.\n\nA data model needs to be modular, avoiding tables with\
    \ too many columns or \n\ntoo few rows.\n\nThere should only be one data model\
    \ for the entire VAS platform, not for each \n\nApplication. Transgressing this\
    \ rule invariably results in silo applications, where the \n\nobject “Subscriber”\
    \ exists within each application silo, in a slightly diﬀerent form.\n\nHaving\
    \ a single data model forces the VAS application developer to recognize \n\nthe\
    \ fact that the subscriber may have subscribed to multiple applications at once.\n\
    \nA good data model puts the Subscriber at the center. But, often, large groups\
    \ \n\nof subscribers will share the same values for most of the attributes. Repeating\
    \ this \n\ninformation in thousands or millions of rows is an ineﬃcient approach.\
    \ Therefore, \n\nthe common properties of a group of Subscribers should be deﬁned\
    \ as a Product. \n\nThis Product may be application-speciﬁc or platform-wide."
  merge: -1
