  md: "Triggered communications are a relative novelty. SMS, e-mail, IM and RSS are\
    \ \n\nexamples where the communication is accomplished when the recipient user\
    \ “sur-\n\nfaces” (powers on the device or launches a program). Diﬀerent events\
    \ could be imag-\n\nined to trigger such communications, from world news, over\
    \ stock quote changes, a \n\ncar accident, to a particular location or mood of\
    \ the recipient user. The possibilities \n\nof such communication means are yet\
    \ to be explored fully. What is their degree of \n\nperceived obtrusiveness in\
    \ the long term?\n\nPeriodic communications are probably the most obtrusive, if\
    \ established between \n\nhumans. Even if touted as more acceptable between machines\
    \ (e.g., for telemetry), \n\ncost-conscious communication consumers (i.e., of\
    \ mobile data megabits) are look-\n\ning for less “chatty” applications. Consumers\
    \ may end up feeling trapped in a sys-\n\ntem they subscribed to, with no possibility\
    \ to cancel. The periodic mode is probably \n\nmore suitable for the transfer\
    \ of stored information, than for true communication \n\nservices. Online gaming\
    \ providers who impose to their end users to be online at \n\ncertain times of\
    \ the week could soon discover the negative eﬀects of periodicity.\n\nWhen conceiving\
    \ new communication means, the on-demand, triggered and \n\nperiodic aspects need\
    \ to be evaluated in great detail.\n\nThe role of the communication service providers\
    \ could be expanded from grant-\n\ning permissions for on-demand services today\
    \ (calls being made thanks to an exist-\n\ning billing relationship or prepaid\
    \ account) to storing all information regarding \n\ntriggers and subscriptions\
    \ to communication and information services, tomorrow.\n\nIt is just another weapon\
    \ in the battle against the growing commoditization of \n\nconnectivity, communication\
    \ and information.\n\n**1.11 Contact Lists and Tribes**\n\nDuring the course of\
    \ their social lives, individuals build personal contact lists which \n\nare today\
    \ maintained on mobile phones, on PCs, and on the Internet.\n\nAccording to the\
    \ Mobile Life Report 2006 by The Carphone Warehouse, mobile \n\nphones have allowed\
    \ us “to return to the more natural and humane communication \n\npatterns of preindustrial\
    \ society, when we lived in small, stable communities and \n\nenjoyed frequent\
    \ communication with a tightly integrated social network of family, \n\nneighbours\
    \ and friends.”\n\nThe report further ﬁnds six socio-demographic segments which\
    \ it labels as \n\n“Tribes” (Generation Mobile, Phonatics, Practical Parents,\
    \ Smart Connected, Fin-\n\nger and Thumbs and Silver Cynics). These are, however,\
    \ merely market segments: \n\nthough these people must certainly have a common\
    \ usage pattern of mobile phones, \n\nthey don’t necessarily communicate more\
    \ with people within the same segment. \n\nAlso, it is diﬃcult to say whether\
    \ or not these segments are also applicable to diﬀer-\n\nent communication means\
    \ such as instant messaging.\n\nThrough our social life we become members of schools,\
    \ companies, sports \n\nclubs, interest groups, political parties and unions —\
    \ “real” organizations. In the"
