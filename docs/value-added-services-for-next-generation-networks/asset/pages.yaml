  md: "Let’s therefore try and walk a diﬀerent path; let’s try and uncover the essence\
    \ of \n\na communication service.\n\nBut before that, perhaps we can start by\
    \ deﬁning and delineating communica-\n\ntion against its two natural rivals: storage\
    \ and computing. The relationship between \n\ncommunication, storage and computing\
    \ is in constant evolution; allied to provide \n\none communication service, they\
    \ are enemies for the next one.\n\n**1.1**\n\n**Symbolic Devices**\n\nWe all know,\
    \ from what we experience and within ourselves, that our \n\nconscious acts spring\
    \ from our desires and our fears. Intuition tells us \n\nthat that is true also\
    \ of our fellows and of the higher animals. We all \n\ntry to escape pain and\
    \ death, while we seek what is pleasant. We are all \n\nruled in what we do by\
    \ impulses; and these impulses are so organized \n\nthat our actions in general\
    \ serve for our self preservation and that of \n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_11_0.png)\n\
    \n**Figure**** 1.2**\n\n**Albert Einstein playing the violin.**"
  merge: -1
  pgno: 11
- img_proc: true
  md: "the race. Hunger, love, pain, fear are some of those inner forces which \n\n\
    rule the individual’s instinct for self preservation. At the same time, \n\nas\
    \ social beings, we are moved in the relations with our fellow beings \n\nby such\
    \ feelings as sympathy, pride, hate, need for power, pity, and so \n\non. All\
    \ these primary impulses, not easily described in words, are the \n\nsprings of\
    \ man’s actions. All such action would cease if those powerful \n\nelemental forces\
    \ were to cease stirring within us. Though our conduct \n\nseems so very diﬀerent\
    \ from that of the higher animals, the primary \n\ninstincts are much alike in\
    \ them and in us.\n\nThe most evident diﬀerence springs from the important part\
    \ which is \n\nplayed in man by a relatively strong power of imagination and by\
    \ the capac-\n\nity to think, aided as it is by language and other symbolic devices.\n\
    \nThought is the organizing factor in man, intersected between the \n\ncausal\
    \ primary instincts and the resulting actions. In that way imagina-\n\ntion and\
    \ intelligence enter into our existence in the part of servants of \n\nthe primary\
    \ instincts. But their intervention makes our acts to serve ever \n\nless merely\
    \ the immediate claims of our instincts.\n\n**—Albert Einstein**\n\nFollowing\
    \ the reasoning of the great scientist, language and symbolic devices help \n\n\
    us to construct imagination and intelligence: the tools that mitigate the eﬀect\
    \ of \n\nour primary instincts on our acts.\n\nFrom the picture above, I’m sure\
    \ Einstein would have named music as one of \n\nthe symbolic devices.\n\nSome\
    \ symbolic devices such as the mathematical and physical formalisms have \n\n\
    helped mankind to construct the intelligence to address basic impulses such as\
    \ cold \n\n(with electricity from nuclear energy), fear (with insight on the origin\
    \ and evolution \n\nof the universe) and need for power (with atomic weapons).\n\
    \nScience, art, medicine, religions, political systems, law and economics have\
    \ \n\nbecome the major symbolic devices in today’s world.\n\nIt is in that prestigious\
    \ enumeration that we would like to add telecommunica-\n\ntions one day: not what\
    \ is said in the billions of daily phone calls, messages, and \n\nWeb pages; not\
    \ the copper wire, glass ﬁber, and ethereal networks themselves; but \n\nthe set\
    \ of underlying protocols, network structures, and procedures used by man-\n\n\
    kind to communicate.\n\nCommunication is essential for life — would the Darwinist\
    \ evolution have \n\ntaken place without it?\n\nBut in the big picture of things,\
    \ speech and languages are relative novelties.\n\nEarly humans must have developed\
    \ speech and languages for rather functional \n\nreasons, such as to give each\
    \ other simple orders, to teach children faster how to \n\nsurvive, or to join\
    \ forces when hunting. Speech and languages were born as the \n\ndirect servants\
    \ of the primary instincts."
  merge: -1
  pgno: 12
- img_proc: true
  md: "As cognitive intelligence grew, so did the number of abstract topics (e.g.,\
    \ love, \n\nwar, religion, possessions, tribes) and the number of words available\
    \ to construct \n\nspoken phrases. Speech and languages became tools to construct\
    \ intelligence and \n\nimagination, through a process of sustained communication.\n\
    \nIt is indeed hard to imagine building intelligence and imagination in complete\
    \ \n\nisolation. As the great Einstein would say, “The secret of creativity is\
    \ knowing how \n\nto hide your sources.”\n\nThe relationship between communication,\
    \ intelligence and imagination is fas-\n\ncinating. Our knowledge economy depends\
    \ on people ﬁnding the right balance. \n\nWhat will be the future role of communication?\n\
    \n**1.2**\n\n**Communication and Storage**\n\nDid communication grow out of knowledge\
    \ or the reverse?\n\nThe human need for communication fuelled the development\
    \ of diﬀerent means \n\nwhich today we would call “media.” In order of appearance:\
    \ speech, theatre, the \n\ntelegraph, telephone, radio, TV, cellular communications,\
    \ sms, chatting, blogging, \n\npodcasting, and so on.\n\nMost of these communication\
    \ channels could not have emerged without an \n\nunderlying support at the end\
    \ points (some “storage” means): more brain cells for \n\nspeech, the grotto wall\
    \ for paintings, papyrus for writing, printed books, newspa-\n\npers, photo paper,\
    \ movie ﬁlm, vinyl records, magnetic storage, computer memory, \n\nﬁle systems,\
    \ optical storage (CD, DVD), nonvolatile memory, and so on.\n\nThese storage means\
    \ are the support for all our knowledge. The rest are thoughts, \n\nexperience\
    \ and imagination.\n\nIn the course of history, communication and storage have\
    \ gone hand in hand. \n\nMore brain cells meant more speech. More writing skills\
    \ meant an increased need \n\nfor papyrus. Gutenberg’s printed bible was read\
    \ by a whole new category of readers, \n\nwho couldn’t have aﬀorded the medieval\
    \ calligraphy. And so on.\n\nBut today, communication and storage seem to compete\
    \ with each other on a \n\ndaily basis, and to *exclude* each other for various\
    \ reasons.\n\nShould we have a conference call on this project (communication)\
    \ or await \n\neveryone’s written input (storage)? Knowing that most conference\
    \ calls are not min-\n\nuted (stored) anymore …\n\nShould I e-mail this document\
    \ to my colleagues (communication) or post it on \n\nour intranet (storage)?\n\
    \nAm I going to take incoming calls (communication), or are the callers going\
