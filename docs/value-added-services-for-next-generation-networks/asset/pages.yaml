  md: "It is up to the NGN service provider to ensure the upstream and downstream\
    \ \n\ninformation is delivered with minimal delay.\n\nHow far will the pointing\
    \ arrow move, and how sharp will that snowboarder \n\nturn to the left? Well,\
    \ if the upstream DTMF information remains in band to \n\nthe NGNSP, or is encoded\
    \ as in RFC 2833 (including duration), or if the DTMF \n\nsignals are carried\
    \ in-band of a circuit-switched call, the NGNSP is able to com-\n\nmunicate the\
    \ duration to the Media Pilot.\n\nHence a Media Pilot transforms your plain vanilla\
    \ SIP phone into a universal, \n\nstandard remote control for everyday life: it\
    \ will allow you to key in the ﬂoor you \n\nwant to go to, in advance of you entering\
    \ the elevator. It could allow construction \n\nworkers to move the crane on a\
    \ building site. To lock your car’s doors, open your \n\ngarage door, pilot your\
    \ domotics system, your media center, or the music played at \n\nthe club: the\
    \ possibilities are thus inﬁnite and unexplored to date.\n\nNetwork-based media\
    \ pilots have the potential to make Windows Vista look \n\nlike grandma’s user\
    \ interface.\n\nMany applications will arise from the fact that today only one\
    \ or two remote \n\ncontrols are provided with any appliance, that these remotes\
    \ have a short range, and \n\nare incompatible.\n\nPerhaps this will also call\
    \ for a motion control protocol to be invented between \n\nthe media pilot and\
    \ the end device or application.\n\n**7.2**\n\n**Personal Contact Pages**\n\n\
    Personal welcome pages are the evolution of the personalized ring back tone, per-\n\
    \nsonalized welcome video, company Web site, and personal Web space. It builds\
    \ \n\nfurther on the idea from the previous section to turn multimedia user experiences\
    \ \n\ninto NGN media streams.\n\nUsers of the service receive a default “contact\
    \ page” which will be played as \n\nvideo, for all session establishment requests\
    \ (SIP INVITE) arriving at their current \n\ntelephone number and preferred domain\
    \ name (e.g., sip:32472700855@mycom-\n\npany.com). The scope could be extended\
    \ to other SIP methods such as SIP MES-\n\nSAGE, or other incoming communications\
    \ such as traditional circuit-switched \n\ncalls or texts (SMS).\n\nThe provider\
    \ of this new VAS, the personalized contact page service provider \n\n(PCPSP),\
    \ will thus become the default SIP server for the mycompany.com domain, \n\nwhich\
    \ would need to be communicated to the public DNS infrastructure. De facto, the\
    \ \n\nPCPSP thus becomes the inbound communication handler (the ICH of Section\
    \ 4.5).\n\nThe idea of a PCPSP of course also responds to the requirement to deliver\
    \ a \n\ncontextual portion for NGN communications (Section 1.5).\n\nIt is probably\
    \ not up to the NGNSP to take on this contextual portion; a whole \n\necosystem\
    \ of specialized PCPSP might appear in the residential service.\n\nIn response\
    \ to the session establishment request, the originator would be pre-\n\nsented\
    \ an audio stream, video stream or message response, showing information as"
  merge: -1
