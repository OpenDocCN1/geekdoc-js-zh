    \ only free \n\npreviews, trials and contests.\n\nWhy spend $35 a month on mobile\
    \ data connectivity when for $10 you could \n\nsubscribe to a media kiosk at your\
    \ federation of WiFi hotspots, automatically down-\n\nloading your selection of\
