  md: "In the end, the user may feel unsatisﬁed both when the communications device\
    \ \n\nis on and oﬀ — something all telecommunications and information providers\
    \ \n\nshould of course try and avoid at all cost.\n\nTo counter-balance the sentiment\
    \ of intrusiveness, the root cause of the trouble, \n\nmodern communication means\
    \ should be able to track and take into account the pres-\n\nence, availability\
    \ and preference of the user on the receiving end.\n\nPresence was largely ignored\
    \ by the Plain Old Telephone System (POTS); it was \n\nimpossible for the receiving\
    \ user to publish his/her presence, namely to signal that \n\nhe/she was or wasn’t\
    \ physically in the neighborhood of the black phone. Hence the \n\ncaller simply\
    \ had to try and wait for someone to pick up the horn.\n\nAnswering machines and\
    \ Interactive Voice Response (IVR) systems started \n\ntaking calls in the 1970s,\
    \ and people would have them switched on even when they \n\nwould be around —\
    \ either at home or in the enterprise. This may be interpreted \n\nas an expression\
    \ of protective attitude against intrusiveness (you could delete these \n\nunwanted\
    \ messages, ﬁlter out callers not having a customer number, etc.), but also \n\
    \nthe attractiveness of deferred communication (the messages could be answered\
    \ \n\nlater). We’ll address immediate vs. deferred communication in Section 1.9.\n\
    \nBasic presence is suﬃciently addressed by existing mobile cellular networks,\
    \ and \n\nthis convenience has most certainly contributed to their success. Mobile\
    \ phones \n\nmay be switched oﬀ, set to vibrate and to silent mode. The mobile\
    \ network can \n\nforward incoming calls in case the called person is unreachable,\
    \ busy, or doesn’t \n\nanswer the call. The phone’s on/oﬀ status is known by the\
    \ network, but once the \n\nhandset is powered on, the decision to answer the\
    \ call can still be made based by \n\nthe called user (based on who’s calling:\
    \ Calling Line ID Presentation).\n\nFixed enterprise telephony solutions (Private\
    \ Branch eXchanges, but increasingly \n\nCentrex and VoIP Centrex) oﬀer advanced\
    \ incoming call handling. Automated or \n\nhuman attendants can limit the intrusiveness.\
    \ Increasingly, these attendants are \n\nable to take into account of calendar\
    \ information (appointments, meetings, holi-\n\ndays). Call centers are the school\
    \ example of the practical use of presence and avail-\n\nability information to\
    \ handle inbound calls.\n\nCompany e-mail servers allow you can set an automatic\
    \ reply message, when on \n\nholidays. Web-based e-mail servers usually don’t.\
    \ On the other hand, as with your \n\nletter box, your e-mail server can’t refuse\
    \ to take an incoming e-mail. Therefore, \n\nlists of senders and keywords can\
    \ be set up to ﬁlter junk e-mail. The IETF devel-\n\noped an e-mail ﬁltering language\
    \ called Sieve (RFC 3028).\n\nInstant Messaging programs oﬀer a good view on the\
    \ presence and availability \n\nof buddies in a buddy list, but then again not\
    \ on their presence on other devices \n\n(mobile phone, gaming console, IPTV set-top\
    \ box).\n\nThe availability of the user is sometimes discovered by the device\
    \ itself — for \n\nexample, the availability is set to “Away” when the keyboard\
    \ and mouse are not \n\ntouched for a while.\n\nSome IM programs now allow logging\
    \ in as invisible, which shows that peo-\n\nple are maybe not that willing to\
    \ show their actual presence anymore. Could the"
  merge: -1
  pgno: 27
- img_proc: true
  md: "solution be to publish diﬀerent presence and availability to diﬀerent groups\
    \ of \n\nbuddies?\n\nOther communication means have until now remained presence-,\
    \ availability- \n\nand preference-agnostic: SMS, for example, does not allow\
    \ the sender to see the \n\ndestination’s presence in advance of sending the message.\n\
    \nOn the inbound side, SMS does not allow you to set an autoreply, to forward\
    \ \n\ninbound SMSs to another terminal, or to bar messages from some sources.\n\
    \nAre presence and availability going to spice up existing communication means?\
    \ \n\nThey could, for example in the case of SMS, or even the POTS.\n\nIf your\
    \ PC detects keystrokes or mouse movements, this could be communi-\n\ncated to\
    \ a presence server in the POTS, assuming that your telephone is on your \n\n\
    desk next to your PC. Callers could then hear that you are away, if you didn’t\
    \ use \n\nyour PC for say 10 minutes.\n\nConversely, if the upgraded, presence-aware\
    \ ﬁxed telephony network detects \n\nthat you make or receive a call, it might\
    \ be conﬁgured to inform your IM provider, \n\nso your IM contacts can now see\
    \ that you are “at work.”\n\nOr are presence and availability going to enable\
    \ completely new communica-\n\ntion means?\n\nFor sure, presence and availability\
    \ information would pave the way for “push” ser-\n\nvices. Today, most content\
    \ and services are consulted in “pull” mode, in which the end \n\nuser has to\
    \ take the initiative. If the user could let his/her presence and availability\
    \ be \n\nnotiﬁed to a selected set of applications, these applications could send\
    \ “fresh,” relevant \n\ncontent, rather than continuously pushing down needless\
    \ streams of information that \n\nare going to remain unread in some Inbox. This\
    \ notify-and-push principle exists in an \n\nembryonic format on the Internet,\
    \ as “syndication” (even though today the RSS Web \n\nfeeds — Really Simple Syndication\
    \ — are in fact a pull technology).\n\nSelectiveness and trust are essential;\
    \ users would be reluctant to let their pres-\n\nence information be notiﬁed to\
    \ all contacts, tribes and applications, for unknown \n\n(worse: undesired) communications\
    \ and content to be pushed down. Similarly, \n\ntoday people are (rightfully!)\
    \ increasingly reluctant to provide their contact details \n\n(e-mail addresses\
    \ and telephone numbers).\n\nObviously this sector will mature, and the presence\
    \ and availability of informa-\n\ntion may be merged into a larger functional\
    \ entity such as personal homepages, \n\nWeb-based address books or social networks.\n\
    \nCommunication service providers should consider presence and availability as\
    \ \n\none of the healthy ingredients in the cooking recipe for any new communication\
    \ \n\nservice.\n\nThey should inspire the conﬁdence that the users will always\
    \ be able to do the \n\nfollowing:\n\nGrant and revoke permissions to their personal\
    \ contacts, tribes, and appli-\n\ncations to watch their own presence"
  merge: -1
