  md: "Would people be willing to pay a premium to ﬁnd the nearest pizza restaurant\
    \ \n\nin Paris (an iconic example at GSM congress presentations), rather than\
    \ just asking \n\nsomeone?\n\nSome people started to think about location-based\
    \ services (in mobile networks) \n\nas a remedy to poor user input interface on\
    \ the terminal (small display): “the mobile \n\ndevice would automatically display\
    \ the map of where I am.” OK, but that’s precisely \n\nwhat a GPS navigation system\
    \ does.\n\nOr as input data for push services: “walk into the shopping center\
    \ and receive a \n\ntargeted advertisement,” another example in the same series.\n\
    \nA few niche services have been launched, but in general, location based services\
    \ \n\nhave not delivered on the promise.\n\nWorse, the market is so immature that\
    \ an Italian operator saw a sudden decrease \n\nof subscriber numbers once their\
    \ current location became available on the Internet, \n\neven if previous permissions\
    \ had to be granted by the mobile subscriber. People did \n\nnot even want to\
    \ enter the debate on whether they would grant the viewing permis-\n\nsions or\
    \ not; they simply cancelled their subscription to get rid of the problem.\n\n\
    In the recipe of a new communication service, I would therefore qualify loca-\n\
    \ntion as the garlic: excellent for health, deterring to many, and always to be\
    \ used in \n\nextreme moderation."
