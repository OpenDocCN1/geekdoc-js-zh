  md: "IETF’s cornerstone speciﬁcation in the session control layer is the Session\
    \ Initia-\n\ntion Protocol (SIP, RFC 3261), complemented with a procedural RFC\
    \ on how to \n\nextend it (RFC 3427).\n\nSIP is built on a comparable syntax to\
    \ HTTP, SMTP, RTSP and other IETF \n\nsignaling protocols.\n\nWhereas RTSP’s primary\
    \ focus was to set up RTP media streams to IP mul-\n\nticast addresses and make\
    \ it more suitable for broadcasting, SIP creates an infra-\n\nstructure of clients\
    \ and servers, comparable to a telephony network, even though IP \n\nmulticast\
    \ sessions should also be set up using SIP.\n\nWith HTTP, the client (browser)\
    \ always issues GET or POST requests. With \n\nSMTP, the client uses SEND to submit\
    \ an outgoing e-mail to a SMTP server. With \n\nRTSP, the client is the only one\
    \ issuing the PLAY request.\n\nHowever, SIP user agents (UA) are able to register\
    \ to the network previously \n\n(using the SIP REGISTER method). Actually the\
    \ UA consists of a User Agent Cli-\n\nent (UAC) side and a User Agent Server (UAS)\
    \ side, and it’s the UAC performing \n\nthat registration. Following the registration,\
    \ the network (SIP Proxy server, UAC) \n\ncan direct incoming session requests\
    \ (SIP INVITE), messages (SIP MESSAGE) or \n\ncapability discovery requests (SIP\
    \ OPTIONS) from the entire world to the destina-\n\ntion UA (more speciﬁcally\
    \ its UAS side).\n\nAs RFC 3261 says, SIP supports personal mobility: users can\
    \ maintain a single \n\nexternally visible identiﬁer (e.g., sip:32496127638@ngvas.com)\
    \ regardless of their \n\nnetwork location. The managers of this mobility are\
    \ the SIP servers of the domain \n\nof that identiﬁer (e.g., sip1.ngvas.com and\
    \ sip2.ngvas.com). External sources will \n\nﬁnd these SIP servers by querying\
    \ the public Domain Name Server (DNS) infra-\n\nstructure, as explained in RFC\
    \ 3263 (Locating SIP servers).\n\nThe IETF’s enum group went as far as submitting\
    \ a DNS directory structure to \n\nIANA for the e164.arpa domain (e.g., 8.3.6.7.2.1.6.9.4.2.3.e164.arpa),\
    \ in an attempt \n\nto let SIP servers discover the next hop to reach any telephone\
    \ number on the planet. \n\nSome countries (e.g., Austria) tried to launch a public\
    \ ENUM infrastructure. But \n\nthis attempt to attract the E.164 numbering plan\
    \ into the Internet has not been very \n\nsuccessful, for security, performance,\
    \ and organizational reasons — who would have \n\nhad the authority to update\
    \ this DNS information? To allocate number ranges? \n\nWorse, to deal with number\
    \ portability processes?\n\nOf course, the originating UA (UAC) can also submit\
    \ outbound requests to a \n\nSIP server (UAS; e.g., sip.ngvas.com), in order to\
    \ reach the rest of the world. That \n\nUAS could then react as one of the following:\n\
    \nSIP Redirect server: uses 301/203 responses to indicate a new URI (Uni-\n\n\
    versal Resource Identiﬁer; e.g., sip:32496127638@ngn.bics.com) to the \n\nUAC,\
    \ asking the UAC send the request to the SIP servers of that new \n\ndomain.\n\
    \nN"
  merge: -1
