  md: "core network and its set of VAS platforms, is actually a very attractive business\
    \ \n\nmodel for today’s IXCs\\* and ILECs.\n\nIf that happens, new NGNSP’s will\
    \ be able to use the same *NGN peering* equip-\n\nment, processes and contracts\
    \ with TDM trunking providers, TDM access provid-\n\ners, IP access networks,\
    \ enterprise IP networks and other NGNSPs.\n\nThe key equipment you need for NGN\
    \ peering is a Session Border Controller \n\n(SBC). According to the TISPAN deﬁnitions\
    \ we reviewed in Section 3.5, an SBC \n\nperforms both the I-BCF and the I-BGF,\
    \ at the edge between the core network and \n\nother NGNSP’s. At the edge between\
    \ access and core networks, TISPAN deﬁnes \n\nthe SBC as performing the P-CSCF\
    \ and CBGF.\n\nBut, following the idea of generic NGN peering equipment, there’s\
    \ no reason to \n\ndistinguish these two SBC deployment cases anymore.\n\nIn an\
    \ open world, there’s no reason to consider the access network “trusted” and \n\
    \npeer NGNSPs as “untrusted.”\n\nThe User Agents accessing the NGN Core Network\
    \ (end users in an IP Access \n\nNetwork or an Enterprise IP Network; an SBC or\
    \ SIP proxy server in a peer NGN) \n\nmay never be “trusted”:\n\nThey might be\
    \ tempted to set up a session and disconnect it immediately, \n\nonly to discover\
    \ the RTP ports, and continue to exchange media on these \n\nports for a longer\
    \ period, after the end of the initial short session.\n\nThey might be tempted\
    \ to pass payload (text, images or even audio and \n\nvideo) within the signaling\
    \ messages; SIP is a very extensible protocol \n\nand this is perhaps also its\
    \ weakness.\n\nThey might try and discover the network topology, to launch malicious\
    \ \n\nattacks such as SIP Denial-of-Service (attempting to set up a huge num-\n\
    \nber of SIP sessions without ever actually completing any).\n\n**4.7**\n\n**Session\
    \ Border Control**\n\nThe Session Border Controller (SBC) is the element that\
    \ allows an NGNSP to \n\nsecurely interconnect their core network to access networks,\
    \ IP-enabled enterprises \n\nand peer NGNSP.\n\nIt is thus the instrument by excellence\
    \ to realize NGN peering — well, at least \n\nthe Session Control and the Border\
    \ Gateways layers.\n\nIdeally, an SBC should be decomposed into a Border Control\
    \ Function (BCF) \n\nin the session control layer, and a border gateway (BGW)\
    \ in the media and border \n\ngateways layer, interconnected via the ITU-T H.248.1\
    \ gateway control protocol. We \n\nlooked at that architecture back in Section\
    \ 3.1, and at the protocol in Section 3.6.6.\n\n\\* International eXchange Carriers,\
    \ operating circuit-switched international exchanges, and \n\nwell-interconnected\
    \ to ILECs and CLECs."
