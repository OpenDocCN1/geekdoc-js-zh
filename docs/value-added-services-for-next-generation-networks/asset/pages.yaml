  md: "The speciﬁcations cover service requirements, architecture and protocols, plus\
    \ a \n\nfew extra aspects such as security, QoS, ENUM and TMN.\n\nTISPAN has endorsed\
    \ the 3GPP IMS Stage 2 architecture (TS 182 006, 3GPP \n\n23.338), corrected 3GPP\
    \ Release 7 IMS for ﬁxed broadband access (ES 282 007), \n\nand added the\n\n\
    PSTN/ISDN Emulation Subsystem (PES, TS 182 012 and ES 282 002)\n\nResource and\
    \ Admission Control Subsystem (RACS, ES 282 003)\n\nNetwork Attachment SubSystem\
    \ (NASS, ES 282 004)\n\nEmergency Call Services (ECS, TS 182 009)\n\nFigure 3.5\
    \ represents the architecture of the PES:\n\nThis diagram is inspired by ES 282\
    \ 002, but illustrates the position of the vari-\n\nous gateways in the home,\
    \ the enterprise and the service provider realm.\n\nWithin the PES, the Access\
    \ Gateway Control Function (AGCF) has interfaces\n\nTo the Residential GateWays\
    \ (RGW in the home), controlled via ITU-T’s \n\nH.248 protocol, and oﬀering local\
    \ analog telephony (twisted copper pair \n\nat the Z reference point) or ISDN\
    \ (double copper pair, S/T interface \n\npoint).\n\n**Figure 3.5**\n\n**TISPAN\
    \ PSTN Emulation Subsystem (PES).**\n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_65_0.png)\n\
    \n*A*\n\n*A*\n\n*A*"
