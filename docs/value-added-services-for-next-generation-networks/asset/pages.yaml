    \ \n\ncapacity. Peer-to-peer services are, by the way, very good at consuming\
    \ a larger \n\nportion of the available bandwidth than client-server applications\
    \ (or spoke wheel \n\narchitectures).\n\nAt the heart of the discussion about\
    \ whether we’ll see more NGNSPs or more \n\nISPs in the future lies the question\
    \ of whether the NGN can eat away enough Inter-\n\nnet bandwidth from peer-to-peer\
    \ applications.\n\nToday, an ISP installing additional bandwidth only improves\
    \ the quality of \n\npeer-to-peer services — not necessarily that of other applications.\n\
    \nThe abilities to make outgoing communications to any destination outside of\
    \ \n\nthe NGN, or to receive incoming sessions from the outside world, are also\
    \ not jus-\n\ntifying the existence of a NGNSP either. Today these services are\
    \ already oﬀered \n\nto SIP users directly, by outbound VoIP carriers and inbound\
    \ TDM collectors. \n\nSometimes these companies are not even establishing public\
    \ interconnections or \n\noperating media gateways themselves anymore.\n\nAnother\
    \ aspect of such deﬁnition is that it does not diﬀerentiate the NGN \n\nfrom the\
    \ “Current Generation Networks” such as ISDN, the Integrated Services \n\nDigital\
    \ Network from the late 1980s (Section 3.6.1), on which GSM networks are \n\n\
    also based.\n\nThe ITU-T’s ISDN could be used to set up various types of channels\
    \ (speech, \n\nfax, and circuit-switched data such as video) which could be considered\
    \ as media \n\nstreams. Strong QoS was guaranteed by the fact that these media\
    \ streams were con-\n\nveyed on dedicated circuits — which is why NGNSPs would\
    \ deploy QoS-enabled \n\nborder gateways.\n\nDiﬀerentiation of the NGN is possible\
    \ only with an extra (architectural) condi-\n\ntion in the deﬁnition:\n\n*In an\
    \ NGN, there’s an open interface between the Session Control Layer and the *\n\
    \n*Media and Border Gateways.*\n\nBut is the communication service consumer going\
    \ to care?\n\nAnd if the session control and media gateway planes are split in\
    \ the core of a \n\ntraditional GSM network — splitting up today’s MSC in an MSC\
    \ server and a \n\nmedia gateway — does it then become a Next Generation Network?\n\
    \nIt could be worth examining whether diﬀerent organizations could deploy the\
    \ ses-\n\nsion control layer and the media and border gateways. Probably this\
    \ would lead to \n\neconomies of scale, but slow down the implementation of QoS\
    \ enforcement.\n\nIn conclusion of this little deﬁnition exercise, please ﬁnd\
    \ below an overall dia-\n\ngram deﬁning the architecture of the NGN, to our best\
    \ current knowledge.\n\nThis diagram should allow us to position the work of multiple\
    \ standards bodies \n\nwhich are active in the telecommunications ﬁeld."
