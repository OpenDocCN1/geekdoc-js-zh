  md: "a computer transmitting the heartbeat rate to the Internet, via Wibree and\
    \ your \n\nmobile phone, during your jogging. A personal trainer might even return\
    \ advice to \n\nyou, in real time, to your Bluetooth headset, again containing\
    \ a computer.\n\nAs computing expands toward the edges, so will transmission and\
    \ storage, but \n\nwill the telecommunication sector (i.e., telecommunication\
    \ service providers) ben-\n\neﬁt from this movement?\n\nAlso, what are the forces\
    \ limiting this expansion?\n\nSome people feel unhappy about the ineﬃcient use\
    \ of computing resources \n\nmade by modern operating systems and distributed\
    \ software. It is not sure that \n\npeople will keep buying ever more computing\
    \ power to cope with this. Virtual-\n\nization, Web services and Display-over-IP\
    \ (DoIP) terminals will save computing \n\nresources, by simplifying the user\
    \ device and recentralizing computing, storage and \n\nsoftware as a pool of on-demand\
    \ resources.\n\nThe success of memory sticks and media players using media compression\
    \ tech-\n\nnology (e.g., MP3, AAC, MPEG4) resulted from the need to save on nonvolatile\
    \ \n\nmemory but also illustrates a trend away from computing power. Today’s consumers\
    \ \n\nappear to be willing to pay the same price for a high-end portable media\
    \ player as \n\nfor a basic desktop computer.\n\nCan true, valuable communication\
    \ appear between computers, rather than \n\nthe mere transmission of stored media?\
    \ We are not so far from this. Comput-\n\ners have started relaying packets for\
    \ peer-to-peer services, without their human \n\nowners knowing about it. The\
    \ next step could be that these computers would \n\nmake autonomous purchasing\
    \ decisions for evolving communication services: \n\nfor example, “quality-of-service”\
    \ (high bandwidth and throughput, low jitter \n\nand delay), “least-cost routing,”\
    \ “unpredictable results from peer computers.” \n\nThe prerequisite would be that\
    \ they (yes, the computers!) have some form of \n\nrevenue — for example, from\
