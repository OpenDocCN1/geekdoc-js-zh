    \ charging. When a time-based IMS session took place, the corresponding \n\naccess\
    \ volume charges will probably be waived.\n\nWhen all secondary access channels\
    \ are successfully set up, and the bindings veri-\n\nﬁed, UE 2 informs UE 1 by\
    \ acknowledging the PRACK message (with SIP 200 OK).\n\nUE 1, the Originating\
    \ GGSN and PDF/P-CSCF in IMS 1 now also set up the \n\nsecondary access channels\
    \ and verify the bindings.\n\nAt the end, SIP UPDATE informs IMS 2 and UE 2, and\
    \ when UE 2 acknowl-\n\nedges (SIP 200 OK), the QoS is ﬁnally enforced.\n\nNext\
    \ (not shown anymore on the diagram), IMS 2 will send a backwards SIP \n\n180\
    \ Ringing signal, which will be acknowledged by IMS 1 with a forward PRACK \n\n\
    (and IMS 2 acknowledges that PRACK with backwards 200 OK).\n\nWhen UE 2 ﬁnally\
    \ accepts the session (takes the call), a backwards 200 OK \n\nmessage ﬂows to\
    \ UE 1, which acknowledges that to UE 2 (forward SIP ACK). \n\nMedia can then\
    \ ﬁnally ﬂow between UE 1 and UE 2.\n\nThe IP QoS can be of the DiﬀServ type,\
    \ where access network router sets the \n\nIP Type of Service (ToS) bits, also\
    \ called DiﬀServ Code Point (DSCP, IETF RFC \n\n2427). DiﬀServ is a coarse QoS\
    \ mechanism, as the same QoS is then applied for all \n\npackets in that access\
    \ channel (e.g., PDP context)\n\nOptionally in some PCF, the IP QoS can be of\
    \ the IntServ type, a ﬁne-grained \n\nQoS mechanism by which the access node (e.g.,\
    \ GGSN) will use Reservation Pro-\n\ntocol (RSVP) to request a QoS better than\
    \ best eﬀort, for each uplink and down-\n\nlink media stream within a single access\
    \ channel (e.g., PDP context).\n\nIMS QoS enforcement not only impacts the access\
    \ network nodes (e.g., GGSN) \n\nbut *also the User Entities* of each present\
    \ and future access technology. That is, it \n\nrequires new mobile phones, which\
    \ link the SIP layer to the transport technology \n\n(e.g., GPRS, UMTS).\n\nAs\
    \ such, IMS QoS enforcement may actually never happen.\n\nSeen in the broad picture\
    \ of a User Plane, a Session Plane and an Service Plane, \n\nagain is diﬃcult\
    \ to see how the Service Plane will:\n\nBe informed about the proposed and the\
    \ ultimately negotiated media \n\nstreams (e.g., for prepaid tariﬀ determination)\n\
    \nInﬂuence the QoS being applied (e.g., increase the QoS for calls to/from \n\n\
    the operator’s own IP access networks)\n\nSo, last but not least, QoS enforcement\
    \ in IMS is *service-agnostic*."
