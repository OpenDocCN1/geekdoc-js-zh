  md: "*g*\n\n*g*\n\nThe SBC plays important roles: media cut-through, NAT traversal\
    \ for signal-\n\ning, media stream latching, topology hiding, transcoding, admission\
    \ control and \n\nmore than a dozen other functions.\n\nAs most of the functions\
    \ rely on tight integration between the BCF and the BGW, \n\nthere’s today a technico-commercial\
    \ debate on whether the BCF should reside inside the \n\nNGN core network softswitch\
    \ (a server), or may be colocated with the BGW (a router).\n\n***4.7.1***\n\n\
    ***Media Cut-Through***\n\nAs soon as third-party IP-based networks need to be\
    \ connected to an NGN or IMS, \n\nthus in the latter three cases of the previous\
    \ section, an SBC is required to prevent \n\nmedia transfer outside of correctly\
    \ established, chargeable SIP sessions.\n\nMore precisely, during session set-up,\
    \ early media (ring-tones etc) may already \n\nbe received by the session originator.\
    \ The ring tones may be generated by the \n\nresponding user agent or by the network\
    \ (e.g., by a media server). But the forward \n\naudio (and video) channels should\
    \ be opened only when a SIP 200 OK message is \n\nreceived from the responding\
    \ user agent.\n\nThis process is called “media cut-through” and is the SBC’s primary\
    \ task.\n\n***4.7.2***\n\n***NAT Traversal for Signaling***\n\nA second role of\
    \ the SBC is to help SIP sessions to be established through enterprise \n\nFireWalls\
    \ (FW) and Network Address Translators (NAT).\n\nDiﬀerent types of NAT exist,\
    \ but the most commonly used form is symmetric \n\nNAT, in which all requests\
    \ from the same internal (private) IP address and port to a \n\nspeciﬁc destination\
    \ IP address and port are mapped to a unique external (public or \n\nprivate\\\
    *) source IP address and port. If the same internal host sends a packet with the\
    \ \n\nsame source address and port to a diﬀerent destination, a diﬀerent mapping\
    \ is used.\n\nWith Simple Traversal of UDP through NAT (STUN), a user agent inside\
    \ the \n\nenterprise environment (containing a STUN client) can ask a STUN server\
    \ on the \n\nexternal network to tell him what the external address of the NAT\
    \ is, and what \n\nport was opened by the NAT to allow incoming traﬃc back in\
    \ to the network. \n\nObviously, the STUN server needs to be colocated with the\
    \ NGN operator’s SBC. \n\nOtherwise, the symmetric NAT will allocate diﬀerent\
    \ external ports for the STUN \n\nquery as for the upcoming SIP request.\n\nThe\
    \ originating user agent can then use that STUN response to ﬁll in the IP \n\n\
    address in the From: ﬁeld of the outbound SIP INVITE (or other message). This\
    \ \n\nwill allow the ﬁrst SIP proxy (the service provider’s SBC in this case)\
    \ to return SIP \n\nresponses to the originating user agent, via the NAT’s external\
    \ address and port.\n\n\\* The NGN provider may, on the interconnection to a corporate\
    \ network, have obtained an \n\naddress from the private address space of that\
    \ corporate network. An entire private address \n\nspace may even be used on the\
    \ interconnection only, with NAT functions both on the service \n\nprovider and\
    \ the enterprise side."
