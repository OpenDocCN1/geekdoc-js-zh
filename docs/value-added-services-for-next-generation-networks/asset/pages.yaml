  md: "Cellular, mobile and wireless\n\nPresence and availability\n\nImmediate and\
    \ deferred mode\n\nOn-demand, triggered and periodic\n\nPersonal contacts and\
    \ tribes\n\nLocation based\n\nTraditionally, communication means would have been\
    \ classiﬁed as\n\nFixed or mobile\n\nVoice, text, video or data\n\nPre- or postpaid\n\
    \nRetail or wholesale\n\nCircuit- or packet-switched\n\nPoint-to-point or multiparty\n\
    \nBest-eﬀort or guaranteed Quality-of-Service\n\nPrivate or public\n\nBut in the\
    \ context of the Next Generation Networks, these refer to the properties of \n\
    \nbit pipes (connectivity) rather than to recognizable communication services.\n\
    \nAnd this book is about genuine communication services, not about connectivity.\n\
    \nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_10_0.png)\n\
    \n**Figure**** 1.1**\n\n**Basic forces structuring modern communication means.**"
