  md: "**1**\n\n***Chapter 1***\n\n**Basic Forces**\n\nWelcome to this ﬁrst chapter!\n\
    \nIn this book, let’s undertake a quest for the real “added value” of modern \n\
    \n(tele)communication services.\n\nI never liked general statements such as “eﬃcient\
    \ communications increase \n\nproductivity” or “social persons communicate frequently.”\
    \ Aren’t our buddies and \n\ncolleagues being ﬂooded by the numerous calls, messages\
    \ and streaming media? \n\nWhat are we, our employers or advertisers willing to\
    \ pay for true communication \n\nmeans? Are our children going to adopt them or\
    \ will they invent their own? Will \n\nour machines start communicating in unpredictable\
    \ ways?\n\nThis book is not only about technology itself; also on how it is being\
    \ used and \n\ncould be used in the best possible way.\n\nWe have a long way to\
    \ go to be able to conceive Value-Added Services (VAS) for \n\nNext Generation\
    \ Networks (NGN) — at least that’s my feeling at the start of this \n\nbook. A\
    \ NGN is not so easy to deﬁne either.\n\nIt’s going to be a dangerous journey;\
    \ we might lose ourselves in the wilderness \n\nof networks, the ecosystem of\
    \ companies, or daunting traﬃc predictions. We might \n\nend up with a list of\
    \ dozens of possible services with no way to prioritize or even \n\nunderstand\
    \ their extent.\n\nLet’s therefore weapon ourselves for the trip!\n\nIn this chapter,\
    \ we’ll take a helicopter tour over the basic forces (“dimensions”?) \n\nwhich\
    \ to my opinion are structuring modern communication means:\n\nMeans and appropriateness\n\
    \nContextual and interactive portions\n\nDevice, connectivity and service\n\n\
    N\n\nN\n\nN"
  merge: -1
  pgno: 9
