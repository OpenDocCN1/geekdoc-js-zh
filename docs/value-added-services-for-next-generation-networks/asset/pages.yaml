  md: "UE 2 communicates its SDP information (according to RFC 3264) in a backward\
    \ \n\nSIP 183 Session Progress message, which will be authorized by both S-CSCF.\n\
    \nAlso at this point, UE 2 already generates Flow-IDs, for each secondary \n\n\
    access channel (PDP context) that will be set-up for a media type listed in the\
    \ \n\nSDP. The PDF at the Terminating P-CSCF in IMS 2 authorizes the use of these\
    \ \n\nresources: “is there enough overall bandwidth left to set up all these secondary\
    \ \n\naccess channels?”\n\nSo does the PDF at the Originating P-CSCF in IMS 1,\
    \ upon receipt of SIP 183 \n\nSession Progress. It also produces an Authorization\
    \ Code.\n\nUpon receipt of the SIP 183 message, UE 1 produces Flow-IDs for the\
    \ Autho-\n\nrization Token, and informs UE 2 (SIP PRACK).\n\nNow UE 2 activates\
    \ secondary access channels for each of the media types \n\ninvolved, passing\
