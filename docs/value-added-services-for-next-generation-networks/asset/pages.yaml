  md: "***3.6.7***\n\n***Transmission***\n\nITU-T played a prominent role in the worldwide\
    \ standardization of digital subscriber \n\nlines; the G series also contains\
    \ the standards for ADSL and its higher speed ﬂavors.\n\nAlso in the transmission\
    \ layer, G.703 contains the physical/electrical character-\n\nistics of any digital\
    \ hierarchical interface (e.g., the DS1 system: E1 at 2 Mbit/s, or \n\nT1 at 1.5\
    \ Mbit/s).\n\nG707/708 speciﬁes the Synchronous Digital Hierarchy (SDH) for transmis-\n\
    \nsion over optical networks (e.g., STM-1 at 155 Mbit/s, STM-16 at 2.5 Gbit/s\
    \ up to \n\nSTM-1024 at 159 Gbit/s).\n\n**3.7**\n\n**IEEE**\n\nAs mentioned in\
    \ Section 1.7, the IEEE today plays a capital role in driving new \n\nwireless\
    \ access technologies in both unlicensed and licensed frequency bands (i.e., \n\
    \nWiFi and WiMAX, respectively), to carry IP.\n\nIn the history of telecommunications,\
    \ IEEE 802.1-2004 (“WiMAX”) and \n\n802.16e-2005 (“Mobile WiMAX”), with the latter\
    \ written as a delta speciﬁcation on \n\nthe former, are major milestones. At\
    \ the start of the twenty-ﬁrst century, these 800-\n\npage documents truly reﬂect\
    \ the latest advances in radio technology, corresponding \n\nto the OSI\\* model’s\
    \ Layers 1 (PHYsical) and Layer 2 (Medium Access Control).\n\nOne could object\
    \ that these are connectivity technologies rather than enabling \n\ncommunication\
    \ services.\n\nBut the WiMAX standards introduce a revolutionary and long-awaited\
    \ Meshed \n\nnetwork architecture, where WiMAX Subscriber Stations (SS) are allowed\
    \ to trans-\n\nmit to each other, obviously not at the same time on the same frequency.\
    \ Though \n\nthere are currently also examples with WiFi Meshing, 3GPP and 3GPP2\
    \ have held \n\ntight to the Point-to-MultiPoint (PMP) architecture, where one\
    \ Base Station (BS) \n\ntransmits to multiple Subscriber Stations (SS), but the\
    \ SS don’t transmit to each \n\nother.\n\nSo the IEEE WiMAX standards are worth\
    \ a few words in this chapter on NGN \n\nstandards, with the humble ambition to\
    \ provide a very basic overview only.\n\nSeen from the Network Layer 3, the WiMAX\
    \ MAC Layer 2, by including the \n\nappropriate “Convergence Sublayer” (CS: the\
    \ top part of the MAC) can behave as \n\none of the following:\n\nAn ATM Virtual\
    \ Circuit (VC)\n\nAn Ethernet (IEEE 802.3) Local Area Network (LAN)\n\nA Virtual\
    \ LAN (IEEE 802.1Q-1998)\n\nAn IP router (RFC 791, 2460)\n\n\\* Open Systems Interconnection."
