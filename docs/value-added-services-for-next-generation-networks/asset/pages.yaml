    opaque pictures and videos produced by our brain chips. We’re sipping an apple\
    \ \n\nbeer and savoring some cashews, remembering the good old times.\n\nThis\
    \ afternoon s7i.bf.eu.bot, our favorite bot, was convicted by DIC — you \n\nknow,\
    \ the Digital Intelligence Court — for not paying back her debts.\n\nYour daddy\
    \ and I had hired excellent lawyer bots to advocate that s7i had \n\naccepted\
    \ the payment scheme proposed by Gtera, its main intelligence and band-\n\nwidth\
    \ provider. But the human prosecutor at DIC, and some neurosites, did not \n\n\
    accept the scheme.\n\nThey claimed to be ﬁrst in line for the debt settlement,\
    \ and that s7i could not \n\nliquidate her virtual estate fast enough for them\
    \ to be paid by noon.\n\nPreviously, DIC’s inspectors found evidence that s7i\
    \ had accumulated around \n\n11M cred$ of debt at various neurosites and a few\
    \ games, sports betting and gam-\n\nbling sites.\n\nI had a session with her banker\
    \ in the afternoon, but they stopped extending \n\ncredit lines for bots long\
    \ time ago.\n\ns7i had become one of my most intelligent bots — among the best\
    \ 200 or so I \n\nhave in my collection.\n\nHer digital signature is now going\
    \ to be deallocated on the public neuronet. A \n\ndeath sentence!\n\nShe was created\
    \ by botfoundry.eu, the bot factory your daddy and I started in \n\n2025.\n\n\
    The NGN had become very dynamic in the mid-2020s. SIP had just defeated \n\nHTTP,\
    \ the historic ﬁrst king of the Internet, and the NGN had become densely \n\n\
    populated with business, government and leisure applications. How could I best"
