  md: "UMA is probably a historic missed opportunity to extend the 2.5G/3G global\
    \ \n\nmobility management (GPRS/UMTS core network) toward independent, visited\
    \ \n\nfederations of WiFi hot spots, connected to the GPRS Roaming eXchange (GRX)\
    \ \n\nbackbone via the GPRS Tunneling Protocol (GTP, 3GPP TS 09.60 / 29.060).\
    \ Some \n\nindependent companies\\* had built these bridges between hot spot federations\
    \ and \n\nthe GRX providers, but mobile service providers, having ambitions to\
    \ roll out their \n\nown hot spots in the homes, never adopted this principle.\n\
    \nThe local mobility protocol (across the hot spots of a single federation) would\
    \ then \n\nhave been out of scope of 3GPP. It could have been IETF MIPv4, MIPv6,\
    \ a propri-\n\netary non-device-impacting solution, or better, the upcoming non-device-impacting\
    \ \n\nwork of IETF netlmm.\n\nAuthentication could have used Extensible Authentication\
    \ Protocol in the \n\naccess network (EAP, IETF RFC 3748) and Mobile Application\
    \ Part in the core \n\n(MAP, 3GPP TS 09.02 / 29.002). Or SMS authentication, a\
    \ very strong scheme in \n\nwhich the mobile phone owner requests a password to\
    \ be sent by SMS to the mobile \n\nhandset, and enters his mobile phone number\
    \ plus that password to access the hot \n\nspot (or service in general). Or any\
    \ other mechanism to verify an existing active \n\ncharging/billing relationship\
    \ with the home mobile operator.\n\n\\* That is, the WeRoam.com oﬀer by Comfone\
    \ of Switzerland, part of the Togewa holding.\n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_53_0.png)\n\
    \n**Figure 3.2**\n\n**Unlicensed Mobile Access — a strategic mistake?**"
