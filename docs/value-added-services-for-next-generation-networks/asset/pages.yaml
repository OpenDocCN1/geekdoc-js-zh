    \ on video camera’s, in cell phones or in home theatres. It’s not a matter \n\n\
    of unwillingness.\n\nThe distribution of basic NGN service could thus become a\
    \ thin, subtle\n\nprocess. Even existing and well-established IM, voice or video\
    \ providers could add \n\nthe standards to their existing software clients, and\
    \ let consumers choose between"
