  md: "will not be able to reproduce the content itself in many formats (e.g., as\
    \ movie, \n\nbook, comic strip, Web site, piece of art).\n\nFor genuine telecommunication\
    \ services to be more successful, things could and \n\nshould be improved on the\
    \ receiving end. Receivers of genuine communications \n\ndeserve a similar degree\
    \ of choice as the receivers of stored media.\n\nTelecom service providers would\
    \ then take on the duties to let the user subscribe \n\nto, select, ﬁlter, translate,\
    \ adapt, store, organize and reroute *incoming* communica-\n\ntions and information,\
    \ rather than today passively conveying the *outgoing* communi-\n\ncation or information\
    \ to the selected destination — a commodity.\n\nThis paradigm shift is probably\
    \ too large a step for today’s communication \n\nservice providers to take, meaning\
    \ that new, dedicated organizations will emerge \n\nwhich will successfully deal\
    \ with these aspects. \n\nThe knowledge economy needs to tackle the problem of\
    \ communication \n\nmeans and appropriateness, if it does not want to create a\
    \ class of the super- \n\ncommunicating, super-informed, who can assimilate the\
    \ information streams com-\n\ning in through dozens of channels, and a class of\
    \ isolated and noninformed people \n\nwho feel ﬂooded and anxious. We need a middle\
    \ class too!\n\n**1.5**\n\n**Contextual and Interactive Portions**\n\nThe potential\
    \ intrusiveness of incoming communications was recognized in the \n\ncorporate\
    \ and business environment, where human or automated telephone atten-\n\ndants,\
    \ receptionists and call centers were introduced to handle the ﬁrst part of \n\
    \nthe call, before connecting the caller through to the ﬁnal destination (the\
    \ correct \n\ndepartment or most knowledgeable professional).\n\nIt is similar\
    \ to the physical lay-out of many companies, with a reception desk \n\nwhere the\
    \ employees provide the ﬁrst layer of interaction with the external world. \n\n\
    The ﬁrst (and sometimes the only) impression that a company makes, is made at\
    \ \n\nthat reception desk.\n\nModern directory inquiry services are partially\
    \ human, partially automated. \n\nAfter a welcome prompt, the system selects an\
    \ available human attendant. He/she \n\nasks for the name or address, looks up\
    \ the directory number, and immediately \n\ntransfers control to the system, which\
    \ reads the number by text-to-speech. The \n\nsystem then proposes to connect\
    \ the caller through to the ﬁnal destination, to send \n\nthe number by SMS, and\
    \ so on. It’s been a cost-saving trend: a minimal interactive \n\nhuman portion\
    \ is complemented with a growing automated portion.\n\nCalling card services require\
    \ you to call a free number, key in your card num-\n\nber, followed by the number\
    \ you want to reach.\n\nThe most basic ﬁxed telephone call today still starts\
    \ with a sequence where the \n\ncaller gets dial tone from the ﬁrst (local) telephone\
    \ exchange, dials the number and \n\nhears the ring tone produced by the last\
    \ telephone exchange."
