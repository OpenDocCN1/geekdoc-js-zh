  md: "5.The Layer 2 Termination, where devices such as a Broadband Remote \n\nAccess\
    \ Server are terminating layer 2 tunnels to the customer premises \n\nequipment\
    \ (i.e., a DSL modem), but also of course using various wireless \n\ntechnologies\n\
    \nFrom a service provider perspective, this diagram is also designed to better\
    \ \n\nillustrate “real life” rather than only their own network: interconnections\
    \ to other \n\nservice providers, to enterprises, northbound integration, the\
    \ competition from \n\nnon-SIP services on the public Internet are items that\
    \ do not appear in traditional \n\ntelco-space standardization diagrams.\n\nEven\
    \ though that won’t be a major point of attention in this book, IP probes \n\n\
    containing content ﬁlters, policy enforcers, and traﬃc metering functions will\
    \ need \n\nto be integrated in the NGNSP’s admission control and billing systems\
    \ — certainly \n\nif the NGNSP organization (the communication service provider)\
    \ is also playing \n\nthe role of the ISP (Internet service provider). However,\
    \ for sake of simplicity and \n\nin order not to blur our NGN deﬁnition with non-SIP-based\
    \ services, let’s not con-\n\nsider such equipment to be part of the NGN itself.\n\
    \nThe interconnection to peer networks and applications deserves special atten-\n\
    \ntion, due to the security risks involved. Let’s discuss that aspect later, in\
    \ a dedicated \n\nChapter 4.\n\nChapter 5 will address the charging and rating\
    \ requirements for communica-\n\ntion means in the NGN.\n\nWe will take a closer\
    \ look at the Service layer in Chapter 6.\n\n**3.2**\n\n**IETF**\n\nThe Internet\
    \ Engineering Task Force can be considered to be the founder of the \n\nNext Generation\
    \ Network, but, as we will see, not the author.\n\nIts Internet, Operations and\
    \ Management, Routing, Security, and Transport \n\nAreas are laying the groundwork\
    \ for a solid NGN.\n\nMore speciﬁcally, the Internet Area delivers a network layer,\
    \ which can be used \n\nfor both session signaling and media transport.\n\nThe\
    \ Real-Time Applications and Infrastructure Area (a confusing name) stan-\n\n\
    dardizes the session and media layers.\n\nThe Applications Area deals with e-mail,\
    \ Web authoring, calendar sharing, and \n\nso forth, but not speciﬁcally in relation\
    \ to an underlying NGN. Therefore, we won’t \n\ndiscuss its work in this book.\n\
    \nThe IETF also created SIGTRAN (Signaling TRANsport), a set of important \n\n\
    standards for the reliable transport of signaling over IP networks. The stream\
    \ con-\n\ntrol transmission protocol (SCTP, RFC 2960, year 2000) laid the groundwork\
    \ \n\nto carry signaling protocols requiring the reliability of the Transmission\
    \ Control\n\nProtocol (TCP, RFC 793, 1981) without its slowness in networks with\
    \ packet loss."
  merge: -1
  pgno: 45
