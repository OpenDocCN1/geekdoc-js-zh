  md: "*g*\n\n*g*\n\n*g*\n\n*q*\n\nFor online charging, at some point the charging\
    \ process reserves a slice of credit \n\nout of a balance (or multiple balances\
    \ in a cascade) — a process known as credit \n\nslicing. Ideally, the slice of\
    \ credit is small enough to permit multiple simultaneous \n\nservices to be delivered\
    \ with that balance, but large enough not to lead to too fre-\n\nquent charging\
    \ interaction with the network. The charging process needs to consult \n\nthe\
    \ account’s product type in order to know which balance cascade to tap from.\n\
    \n*If the balance is monetary*, inverse rating takes place: the inverse rating\
    \ process \n\nconsults the product catalog and determines the total price or the\
    \ price per unit of \n\nthe communication event. It transforms the credit slice\
    \ from monetary to nonmon-\n\netary units.\n\nLet’s stress that, if all balances\
    \ were expressed in minutes, no inverse rating \n\nwould occur in order to charge\
    \ online for calls!\n\nIf credit reservation took place, the online charging process\
    \ then allocates the \n\nnumber of nonmonetary units (e.g., seconds, megabits,\
    \ clicks) to the network or just \n\ngives an acknowledgement (“go” signal). In\
    \ some implementations of time-based \n\ncharging, the online charging system\
    \ just gives a go signal but does not instruct the \n\nnetwork to meter the seconds.\
    \ It runs its own timer and will either tap more credit \n\nout of the wallet,\
    \ or interrupt the call if there’s no credit anymore.\n\nThe oﬀ-line charging\
    \ process usually does not acknowledge the request for deb-\n\niting. Rating may\
    \ occur immediately or much later: looking up the service in the \n\nproduct catalog\
    \ and transforming nonmonetary into monetary units.\n\nFor oﬀ-line charging as\
    \ for online charging, the charging process ends up debit-\n\ning (lowering) the\
    \ balance (monetary or not).\n\nIn conclusion, oﬀ-line charging uses rating, and\
    \ online charging uses inverse \n\nrating, only if the balance is monetary.\n\n\
    If, in a NGN, online charging thus became possible for inter-operator account-\n\
    \ning, and all balances were expressed in nonmonetary units, no rating would be\
    \ \n\nrequired anymore!\n\n**5.5**\n\n**Metering**\n\nAs described above, the\
    \ online charging process may allocate the number of non-\n\nmonetary units to\
    \ the network.\n\nUsually these used to be the seconds granted by a prepaid IN\
    \ system (i.e., an \n\nonline charging process) to a Mobile Switching Center (MSC).\n\
    \nIn the last 5 years, however, advanced metering devices have been developed\
    \ that \n\nare able to meter the seconds, kilobits or number of clicks for a wide\
    \ palette of services \n\nand destinations, even within a single mobile data session.\n\
    \nUpon establishment of such session, the metering device retrieves the palette\
    \ \n\nof services to be metered, for a given user, from a central Authorization\
    \ server. The \n\nmetering device is also informed whether online or oﬀ-line charging\
    \ is to be applied \n\nfor each service and/or destination. Some services/destinations\
    \ could be marked as"
