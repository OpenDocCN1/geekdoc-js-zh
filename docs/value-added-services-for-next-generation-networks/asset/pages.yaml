    \nIn the future, PCP would present the originator with buttons to leave an e-mail,\
    \ \n\ncontact another responsible via SIP redirection, or immediately leave a\
    \ message \n\nwithout disturbing the destination PCP user.\n\nA company PCP would\
    \ hold routing and hunting logic comparable to today’s \n\nfreephone numbers.\n\
    \nFrom a marketing perspective, the service could be sold to residential, SOHO\
    \ \n\nbusinesses and corporate customers. It could be given for free to residential\
    \ users, \n\nas there’s incoming interconnection revenue, when the NGNSP and PCPSP\
    \ receive \n\ncalls and texts from traditional networks.\n\n**7.3**\n\n**Multichannel\
    \ Media**\n\nA frequent complaint about VoIP is the disappointing audio quality\
    \ (the Mean \n\nOpinion Score, we discussed that back in Section 3.6.4).\n\nHence\
    \ the idea is to multiply the parallel audio channels transmitted over the \n\n\
    NGN, to obtain stereo, 5.1, or even “N.1” sound.\n\nThis calls for WiFi microphones\
    \ that can be positioned in the four corners of \n\nyour living room and communicate\
    \ via SIP/RTP, through the NGNSP, to a Multi-\n\nChannel Media Service Provider\
    \ (MCMSP). On the other side, N channels are \n\ndelivered to the recipient’s\
    \ Bluetooth headset.\n\nThe audio stream being played to the recipient’s headphones\
    \ depends on his \n\nposition relative to the microphones in the room. In other\
    \ words, in a 5.1 sys-\n\ntem, as the listener (destination user) moves closer\
    \ to the back left microphone, the"
