  md: "But the possible usage patterns of services are today strongly inﬂuenced by\
    \ the \n\ndegree to which this connectivity is cellular, mobile or wireless.\n\
    \nA good example is the current situation within IEEE\\* LAN/MAN Standards \n\n\
    Committee (LMSC), where three competing long-range broadband wireless access \n\
    \nsystems have been standardized: 802.16-2004 (Wireless MAN, “WiMAX”), \n\n802.16e-2005\
    \ (“Mobile WiMAX,” February 2006) and 802.20 (“Mobile-Fi”). \n\nThese three connectivity\
    \ technologies can be diﬀerentiated by their degree of mobil-\n\nity (handover\
    \ speed) and degree of being wireless (the range), among other impor-\n\ntant\
    \ factors such as throughput per cell and spectral eﬃciency (i.e., bit/s/Hz).\n\
    \nBy the way, it must be said that in the most recent simulations,¹ Mobile WiMAX,\
    \ \n\nbased on an OFDM air interface, achieves remarkable results in comparison\
    \ to CDMA-\n\nbased 3GPP HSPA and 3GPP2 EVDO. For the ﬁrst time, for example,\
    \ Mobile WiMAX \n\nwill break the magic line of 1 bit/s per Hz and achieve downlink\
    \ throughputs of 6 to 14 \n\nMbit/s per cell (compared to 4 Mbit/s for HSPA and\
    \ EVDO).\n\nOf course, some nontechnical considerations will come into play as\
    \ well (econom-\n\nics, politics). Mobile-Fi is technically better suitable for\
    \ mobile VoIP (faster handover, \n\nlower latency), but more 3G-threatening due\
    \ to its low frequency bands below 3.1GHz. \n\nAnd anyway, the actual implementation\
    \ of Mobile-Fi would be further ahead, as Mobile \n\nWiMAX development is now\
    \ almost completed. Therefore, the IEEE Standards Author-\n\nity just decided\
    \ to freeze the Mobile-Fi work for a few months.\n\n***1.7.1***\n\n***Cellular***\n\
    \nIn a *cellular* network, small groups of devices share a single local resource\
    \ (antenna, \n\nbase station) based on their current geographic location.\n\n\
    IEEE Mobile WiMAX, 3GPP, and 3GPP2 are of course standardized cel-\n\nlular networks.\n\
    \nBut cellular networks, in our opinion, are not necessarily wireless: a LAN \n\
    \ncan perfectly be considered to be a cell, with the IEEE 802.3 hub as the shared\
    \ \n\nresource.\n\nEven a Virtual LAN (VLAN), spanning multiple physical locations\
    \ and using the \n\nIEEE 802.1Q-1998 tagging protocol, but no IP routing, can\
    \ be considered to be a cell.\n\nExamples of noncellular networks are DSL and\
    \ cable networks, in which a ded-\n\nicated resource (copper wire, coax cable)\
    \ is used to connect the end device (modem) \n\nto the core network (DSLAM, CMTS).\n\
    \n***1.7.2***\n\n***Mobile***\n\nIn a *mobile* network, devices/users have the\
    \ rights to roam across multiple geographic \n\nlocations within a same city,\
    \ same country, across countries and — increasingly — \n\nacross diﬀerent networks,\
    \ technologies and devices. Coming back to the example \n\n\\* Institute of Electrical\
    \ and Electronics Engineers."
  merge: -1
  pgno: 24
- img_proc: true
  md: "of the enterprise network, such network will often oﬀer a degree of mobility\
    \ (I can \n\nplug in my laptop in any meeting room).\n\nHandover is the process\
    \ of keeping communications active across the boundaries \n\nof cells, regions\
    \ and technologies. Handover needs to happen fast for a technology \n\nreally\
    \ to be considered mobile; for example, Mobile WiMAX will allow handover at \n\
    \nvehicle speeds up to 120 km/h and Mobile-Fi up to 250 km/h.\n\nIf a technology\
    \ uses more widely available frequency bands, such as Mobile-Fi com-\n\npared\
    \ to Mobile WiMAX, it can also be considered to be more mobile, as it has the\
    \ \n\npotential to be deployed in more countries. Mobile WiMAX has been deﬁned\
    \ to work in \n\nﬁve distinct frequency bands (“Release-1 System Proﬁles”) between\
    \ 2.3 and 3.8 GHz.\n\nLet’s note that some cellular networks are nonmobile: CDMA\
    \ cellular technol-\n\nogy is currently used in India to connect Public Central\
    \ Oﬃces (PCO, ﬁxed phone \n\nshops) in rural areas. But speciﬁc software in the\
    \ network will prevent such PCO \n\ndevices to be moved to the next village.\n\
    \nFinally, some mobile networks are noncellular: digital video broadcasting by\
    \ \n\nsatellite (DVB-S and DVB-S2), for example.\n\n***1.7.3***\n\n***Wireless***\n\
    \nIn a *wireless* network, the physical communication takes place over the ether.\n\
    \nMost networks today are wired. Even in a modern cellular mobile network, a \n\
    \ncall or message uses wires for more than 99% of the distance.\n\nThe general\
    \ technology trend is even to lower the range which the wireless \n\ndevices have\
    \ to bridge (the wireless reach). Cells can then accommodate more users \n\nor\
    \ deliver more throughput per user, fewer transmission errors, and less power\
    \ \n\nconsumption.\n\nHealth considerations and the use of unlicensed frequency\
    \ bands will also force \n\nus to reduce power and wireless reach.\n\nIn this\
    \ sense, the degree to which networks can be considered to be “wireless” \n\n\
    is decreasing.\n\nIn developing countries, the demand for wireless access will\
    \ be stronger due to \n\nthe relative scarcity of copper wires, coax cables and\
    \ ﬁber glass.\n\n***1.7.4***\n\n***Trends***\n\nMore than the need to remove a\
    \ popular confusion between these three aspects \n\nof modern communication, it\
    \ is important to be able to position communication \n\ntechnologies along these\
    \ three axes and to notice trends.\n\nTechnologies which used to cover the three\
    \ aspects (e.g., UMTS) may be \n\nattacked by cocktails of more “specialized”\
    \ technologies (e.g., DSL  WiFi  Mobile \n\nIP). DSL technology does not need\
    \ to consider cellular aspects, WiFi standards are \n\nnot polluted by mobility,\
    \ and Mobile IP does not worry about cellular or wireless."
  merge: -1
  pgno: 25
