  md: "***1.6.1***\n\n***Stage 1***\n\nIn the 1980s and early 1990s, most decisions\
    \ would have been made by the — then \n\ntightly coupled — connectivity and service\
    \ provider, by the equipment manufac-\n\nturer or by some corporate IT department.\n\
    \nThe engineers in there would have made decisions on signaling standards in \n\
    \naccess and core networks, but also on “approved” end user devices (e.g., ﬁxed\
    \ ana-\n\nlogue and digital phones, private branch exchanges, telematic terminals).\n\
    \n***1.6.2***\n\n***Stage 2***\n\nIn the late 1990s, with the mass adoption of\
    \ digital cellular communications, the \n\ncommunication consumer gained power\
    \ through the mobile device manufacturers: \n\nno new network technology (i.e.,\
    \ connectivity or service) would become successful \n\nif it wasn’t spreading\
    \ down quickly enough from high-end devices to the lower end. \n\nA few examples\
    \ were SMS, WAP, GPRS, CDMA2000, UMTS, CMDA1X, and \n\nMMS.\n\nThe joint selling\
    \ and cross-subsidies between connectivity and device lead to \n\nstrange technical\
    \ solutions such as CDMA/TDMA phones without SIM, locking \n\nin the consumer\
    \ to a given CDMA/TDMA connectivity provider. On GSM side, \n\nphones were programmed\
    \ to lock in the SIM, forcing to use the connectivity pro-\n\nvider which had\
    \ subsidized the phone.\n\nThe joint selling of connectivity and service was also\
    \ a common practice, result-\n\ning in 50/50 deals for premium SMS services, “walled\
    \ gardens” for mobile data and \n\na ﬂourishing ring tone market. Service A could\
    \ exclusively be used through con-\n\nnectivity A, and service B only through\
    \ connectivity B.\n\nThis second period ended in a fragmented market of dozens\
    \ of “communica-\n\ntion silos” (tightly coupled device/connectivity/service combinations),\
    \ with no new \n\ncommunication means *really* emerging — most people continued\
    \ to only talk and \n\ntext. Seen from a distance, the chance that mobile service\
    \ providers would have \n\nsucceeded to combine the *killer* device (O2s XDA?)\
    \ with the *killer* connectivity \n\n(UMTS with roaming?) and the *killer* service\
    \ (a music store?) was thin.\n\n***1.6.3***\n\n***Stage 3***\n\nWith the advent\
    \ of Internet connectivity and more open operating systems in the \n\nearly 2000s,\
    \ even if the actual use of IP services on mobile devices is still in its \n\n\
    infancy in 2006, a third period has started, in which the markets for devices,\
    \ con-\n\nnectivity and services started to diverge.\n\nThe mobile device consumer’s\
    \ attention shifted from communication technol-\n\nogies to “local” functions\
    \ such as cameras, storage cards and local connectivity \n\n(Bluetooth, WiFi).\
    \ According to the Mobile Life Report 2006 by The Carphone"
