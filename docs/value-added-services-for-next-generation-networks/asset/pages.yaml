  md: "*q*\n\nSecond, it should be avoided that a network element receives conﬂicting\
    \ instruc-\n\ntions from multiple VAS servers, therefore a pair of servers (active\
    \  stand-by) must \n\nbe deﬁned (conﬁgured) to be responsible for each application,\
    \ origin and destina-\n\ntion. The responsible pair collects the counters from\
    \ the other servers and takes the \n\ndecision to ask all the network elements\
    \ for throttling.\n\nThird, the conditions should be deﬁned in which the throttling\
    \ will be stopped \n\n(or at least, reduced). If this happens too fast, the rate\
    \ at which throttling instruc-\n\ntions are given by the VAS layer will be too\
    \ high.\n\nAny overload protection strategy is strongly dependent on the network\
    \ and user \n\ndevice to accept instructions to retry later, indicating the reason\
    \ (temporary overload).\n\nOverload can also occur in diﬀerent processes of the\
    \ VAS platform — not only \n\nin service execution. Database access is an example.\
    \ Batch operations on the data-\n\nbase (e.g., to provision new subscribers, clean\
    \ up old CDRs) can deprive the appli-\n\ncation execution processes.\n\n**6.12**\n\
    \n**Software Distribution**\n\nThe software on a complex VAS platform will evolve\
    \ over time through multiple \n\nversions, under inﬂuence of new requirements,\
    \ but also in order to correct errors \n\ndiscovered by operators worldwide.\n\
    \nThe layered architecture described in Section 6.1 is not a guarantee that changes\
    \ \n\nwithin one layer will not impact components in the other layers. For example,\
    \ new \n\napplication features often go hand in hand with new database objects\
    \ (in the Infra-\n\nstructure layer), and screens, CDRs or subscriber provisioning\
    \ commands (in the \n\nIT layer). Service Capabilities are usually more isolated,\
    \ having less impact on the \n\nother layers but still, they also produce CDRs,\
    \ alarms, statistics, and so on, which \n\nneed to be processed in the IT layer.\n\
    \nA convenient way to deal with this is for the VAS platform provider to supply\
    \ \n\nsoftware “packages,” containing the multiple components required to introduce\
    \ a \n\ngiven functionality.\n\nPackages should also contain the install process\
    \ used to install them; sometimes this \n\nis an interactive process where the\
    \ Operator needs to ﬁll in license keys, conﬁguration \n\npreferences, and so\
    \ on. Also the uninstall process should be part of any package.\n\nThe package\
    \ install process may need to check the presence of other packages \n\nbefore\
    \ attempting to remove a component, if it may be shared by components of \n\n\
    diﬀerent packages.\n\nEven updates to documentation or training materials can\
    \ be part of a package.\n\nAt any time it should be possible to check the full\
    \ list of installed packages on \n\nthe servers, preferably from a central point.\n\
    \nThese are all very common concepts in IT industry, but VAS providers have not\
    \ \n\nalways oﬀered the appropriate level of rigor, transparency and consistency."
  merge: -1
