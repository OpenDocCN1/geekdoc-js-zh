  md: "*g*\n\n*g*\n\nCan the NGN, essentially using client-server protocols and not\
    \ splitting up \n\nmedia streams, ﬁght the peer-to-peer phenomenon?\n\nNot today,\
    \ that’s our impression, not in the present state of the standards.\n\nBut better\
    \ times might be ahead.\n\nWe introduced H.248 in Section 3.6.6. In 2004, ITU-T\
    \ standardized an H.248 \n\npackage allowing the media and border gateways to\
    \ communicate the RTCP XR \n\nmeasurements to a higher layer: the ITU H.248.30\
    \ package. With this package, \n\nobjective measurements can be collected either\
    \ per segment, or for an end-to-\n\nend media path, but also subjective metrics:\
    \ the estimated Mean Opinion Scores \n\n(MOS) which end users would have granted,\
    \ for Listening Quality (MOSLQ) and \n\nConversational Quality (MOSCQ).\n\nOther\
    \ H.248 packages allow the gateways to report on congestion (H.248.10, \n\nH.248.32),\
    \ overload (H.248.11) or jitter buﬀer metrics (H.248.31).\n\nRTCP XR measurements\
    \ could eventually be obtained from a network of inde-\n\npendent test call emulators\
    \ using H.248.30 to report, but then the other H.248 \n\npackages would not be\
    \ covered.\n\nSimilar metrics can be used to assess video quality.\n\nSelected\
    \ friendly users could also be invited to report on quality, during or after \n\
    \neach call, and be rewarded for this.\n\nImagine that it would be the Meshed\
    \ Mobile WiMAX\\* Subscriber Stations \n\n(SS) doing the RTCP XR measurements\
    \ — the metrics would constantly change \n\nas the SS would move around. It would\
    \ become a computing-intensive job, that’s \n\nfor sure.\n\nCommunication buyers\
    \ — initially the NGNSPs themselves, maybe later the \n\nend users — are thus\
    \ going to be looking for independent organizations receiving \n\nthis information,\
    \ exchanging it peer-to-peer, analyzing it in detail and delivering \n\nindependent,\
    \ objective routing advice, as fast as possible.\n\nWithin such framework, the\
    \ “advertising overlay,” NGNSPs should also be able \n\nto communicate on other\
    \ aspects such as price, available total capacity, network \n\nroll-out plans\
    \ or current number of customers.\n\nThe idea is thus a “stock exchange” for NGN\
    \ communication services.\n\nThe common goal should be to beat peer-to-peer media\
    \ conveyers, not by bar-\n\nring their port numbers in ﬁrewalls or sabotaging\
    \ their traﬃc in other ways, but \n\nthrough an objectively and subjectively better\
    \ service.\n\nA tough battle for ngvas.com, our little NGNSP.\n\nThe idea for\
    \ networks to advertise their quality through standard protocols \n\nis not new.\
    \ It was originally the case in GSM international roaming, for exam-\n\nple, where\
    \ the visited networks would announce the minimum radio signal level \n\n(RxLevMin)\
    \ a mobile would need to receive from that network, in order to have \n\na decent\
    \ quality voice conversation. If multiple networks would be available, the \n\n\
    mobile handset would select the network it received the best, if that network\
    \ had \n\n\\* The WirelessMAN-OFDM¢ with IP Convergence Sublayer – please refer\
    \ to Section 3.7."
