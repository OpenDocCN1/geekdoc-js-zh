  md: "Extended SIP (in IMS Stage 3, TS 24.229 Release 7, Section 7), and adopted\
    \ \n\nSIP signaling (header) compression (in Section 8)\n\nSpeciﬁed the interworking\
    \ of the IM core network with the circuit-switched \n\ndomains (GSM/UMTS/PSTN/ISDN)\
    \ using ISUP and BICC (in TS \n\n29.163 Release 7)\n\nEmbraced some services such\
    \ as presence, instant messaging, conferencing, \n\ngroup management\n\nIt should\
    \ be noticed that 3GPP uses slightly diﬀerent terminology for the func-\n\ntional\
    \ planes:\n\n“Control Plane” for session control\n\n“User Plane” for the border\
    \ and media gateways\n\n*3.3.2.1 Security*\n\nWhereas the distribution of authentication\
    \ credentials is not addressed in an IETF \n\nNGN, 3GPP speciﬁed an own access\
    \ security mechanism (AKA: Authentication \n\nand Key Agreement, TS 33.203) based\
    \ on SIP registration and on a secret number \n\nin the ISIM, rather than on IETF’s\
    \ lower layer protocols (IPsec/TLS/IKE). The \n\nIMS User Entity (UE) thus consists\
    \ of a SIP User Agent (UA) and the IP Multime-\n\ndia Subscriber Identity Module\
    \ (ISIM).\n\nMaybe 3GPP should have been more forward-looking and adopted the\
    \ *Exten-*\n\n*sible Authentication Protocol* (EAP, RFC 3748) instead of SIP REGISTER.\n\
    \nThe security algorithm itself, which the ISIM uses to calculate a response \n\
    \n(XRES) for a random challenge, with the ISIM’s secret number as the other input,\
    \ \n\nis not part of standardization.\n\nGood access security also means that\
    \ the UE should also be able to authenticate \n\nthe IMS. Therefore, the UE receives\
    \ a message authentication code (MAC) from \n\nthe network, and calculates an\
    \ expected message authentication code (XMAC) to \n\nsee if these match. The algorithm\
    \ is also out of scope of standardization.\n\nOnce the ISIM has been authenticated\
    \ by the IMS, and vice versa, SIP signaling \n\nbetween the User Agent and the\
    \ network is encrypted using an agreed session key.\n\nIn an IMS, the IETF’s lower\
    \ layer security protocols are only used for network \n\ndomain security (between\
    \ the SIP servers and HSS, see 3GPP TS 33.210).\n\n*3.3.2.2 Mobility*\n\nContrary\
    \ to the IETF which is still struggling, ETSI and 3GPP have always real-\n\nized\
    \ the beneﬁts of hierarchical mobility architectures. The structure of the GSM\
    \ \n\nradio and core networks reﬂects this:\n\nThe Base Transceiver Station (BTS)\
    \ preserves radio contact while the \n\nMobile Station (MS) moves within one or\
    \ a few cells.\n\nThe Base Station Controller (BSC) manages the mobility of the\
    \ MS across \n\na set of BTS."
  merge: -1
  pgno: 55
- img_proc: true
  md: "The Visited Mobile Switching Center (VMSC) manages the mobility of the \n\n\
    MS across multiple BSCs. When the MS moves from VMSC to another, \n\nthe Home\
    \ Location Register (HLR) keeps track of where to ﬁnd the MS \n\n(i.e., at which\
    \ VMSC), should there be incoming calls or messages. If the \n\nnew VMSC is within\
    \ the same network (i.e., the MS is not roaming out to \n\na foreign VMSC), ongoing\
    \ calls are seamlessly handed over from the old to \n\nthe new VMSC (but the old\
    \ VMSC remains involved in the call).\n\nThe Gateway Mobile Switching Center (GMSC)\
    \ is able to direct inbound \n\ncalls to the correct VMSC, by querying the HLR\
    \ (the HLR then obtains \n\na temporary number from the VMSC). For incoming calls,\
    \ the GMSC \n\nand HLR thus manage the top level mobility in a 2G network. The\
    \ same \n\ndesign philosophy is present in the Packet-Switched domain (2.5G–\n\
    \n2.75G–3G–3.5G PS) and in the IMS (see 3GPP 23.228, IMS Stage 2).\n\nThe node-B\
    \ preserves radio contact while the User Entity (UE) moves \n\nwithin one or a\
    \ few cells.\n\nThe Radio Network Controller (RNC) and Packet Coding Unit (PCU)\
    \ \n\nmanage the mobility of the UE within a Routing Area (i.e., a set of cells).\n\
    \nThe Serving GPRS Support Node (SGSN) manages the mobility of the \n\nUE across\
    \ multiple Routing Area’s. When the MS moves from SGSN to \n\nanother, the Home\
    \ Subscriber Server (HSS) keeps track of where to ﬁnd \n\nthe MS, should there\
    \ be network-requested Packet Data Protocol (PDP) \n\ncontexts. If the new SGSN\
    \ is within the same network (i.e., the MS is \n\nnot roaming out to a foreign\
    \ SGSN), active PDP contexts are seamlessly \n\nhanded over from the old to the\
    \ new SGSN.\n\nThe Gateway GPRS Support Node (GGSN) forms the permanent point\
    \ of \n\ninterconnection with Public Data Networks (PDN) such as the Internet.\
    \ \n\nPDP contexts are created between the SGSN and GGSN using a proto-\n\ncol\
    \ called GTP (GPRS Tunneling Protocol). The GGSN is informed by \n\nGTP if the\
    \ UE moves to a new SGSN while a PDP context is active. The \n\nGGSN is also capable\
    \ to query the HSS to ﬁnd the UE’s current SGSN, \n\nfor network-requested PDP\
    \ context activation toward that UE.\n\nA Proxy Call Session Control Function\
    \ (P-CSCF) is the ﬁrst point of con-\n\ntact for all SIP messages between the\
    \ UE and the IMS; it receives the SIP \n\nREGISTER request from the UE, and proxies\
    \ it to an Interrogating CSCF \n\n(I-CSCF), which queries the HSS. The HSS allocates\
    \ a suitable Serving \n\nCSCF (S-CSCF) and the I-CSCF proxies SIP REGISTER to\
    \ that S-\n\nCSCF. The P-CSCF proxies outbound (i.e., UE-originated) SIP INVITE\
    \ \n\ndirectly to a S-CSCF in the Home Network. The P-CSCF is also the ﬁrst \n\
    \npoint of contact for inbound sessions to the Visited Network.\n\nThe I-CSCF\
    \ in the Home Network is capable of querying the HSS in order \n\nto ﬁnd the UE’s\
    \ current S-CSCF, for inbound sessions toward that UE.\n\nThe I-CSCF and HSS thus\
    \ manage the top-level mobility in an IMS, for \n\ninbound sessions."
  merge: -1
