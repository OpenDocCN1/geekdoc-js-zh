  md: "SCTP was designed to carry adaptation layers for ITU-T SS7 (see Section 3.6).\
    \ \n\nBut today, SCTP is considered as a viable alternative to UDP and TCP, in\
    \ order to \n\ncarry SIP (RFC 3261 in 2002 uses UDP; RFC 4168 in 2005 proposes\
    \ SCTP) but \n\nalso DIAMETER (RFC 3588 in 2003 used TCP).\n\n***3.2.1***\n\n\
    ***Internet Area***\n\nThe Internet area puts a lot of energy into mobility management,\
    \ through diﬀerent \n\nworking groups.\n\n*3.2.1.1 netlmm*\n\nThe Network-Based\
    \ Localized Mobility Management (netlmm) working group \n\nis developing a two-stage\
    \ mobility architecture similar from what we know from \n\nmobile data networks\
    \ (e.g., GPRS, CDMA) and from 3GPP’s IP Multimedia Sub-\n\nsystem (described in\
    \ Section 3.3).\n\nLocal mobility involves movements across some administratively\
    \ and geograph-\n\nically contiguous set of subnets, while global mobility involves\
    \ movements across \n\nbroader administrative, geographical and topological domains.\n\
    \nDuring such movements, at least within a geographic area such as a city or \n\
    \ncampus, the objective is to preserve the higher-layer communication (e.g., a\
    \ TCP \n\nsession) by very fast handover and limited packet loss. Other objectives\
    \ are low \n\nsignaling overhead.\n\nThis work is relevant in a NGN context, as\
    \ very promising unlicensed access \n\nstandards (WiMAX) are about to be launched\
    \ commercially.\n\n*3.2.1.2 mipshop, mip4, mip6*\n\nThe MIP Performance, Signaling,\
    \ and Handoﬀ Optimization (mipshop) work-\n\ning group has proposed a suitable\
    \ mobility architecture for low overhead as the \n\nHierarchical Mobile IPv6 (HMIPv6).\
    \ The standard for fast handover was named \n\nFMIPv6.\n\nPrevious work in the\
    \ IETF mip4 and mip6 working groups had focused on \n\nthe mobility management\
    \ protocols themselves (MIPv4 and MIPv6), which would \n\nallow the devices to\
    \ announce their current position (real IPv4 or IPv6 address) \n\nto a mobility\
    \ manager in the network. However, these protocols have not known \n\nenough commercial\
    \ success on the IP devices (wireless or wired. cellular or not). \n\nIn the cellular\
    \ space for example, MIPv4 was adopted by 3GPP2 CDMA2000 but \n\nnot by 3GPP GPRS.\n\
    \nOn the contrary, commercial WiFi switches appeared to be capable to track a\
    \ \n\ndevice’s mobility across a set of hot spots, *without* speciﬁc mobility\
    \ protocols on the \n\ndevice. The device keeps its allocated IP address, and\
    \ the handover is performed fast \n\nenough for advanced communication applications\
    \ such as voice not to be aﬀected."
  merge: -1
  pgno: 46
- img_proc: true
  md: "So the IETF netlmm working group is now chartered to standardize an \n\napproach\
    \ that has become a *de facto* market trend.\n\n*3.2.1.3 Other Working Groups*\n\
    \nOther working groups have addressed the mobility theme. For example, the \n\n\
    Seamoby group proposed Candidate Access Router Discovery (CARD, experimen-\n\n\
    tal RFC 4066) and Context Transfer Protocol (CXTP, experimental RFC 4067) \n\n\
    to speed up the handover of authentication, authorization, accounting, PPP and\
    \ \n\nheader compression contexts when the Mobile Node is moving or may be moving\
    \ \n\nfrom one Access Router (AR) to another.\n\nRedirecting the incoming IP packets\
    \ as fast as possible to the new AR may not \n\nbe the sole goal of a mobility\
    \ management solution.\n\nOf course, the Internet Area includes multiple other\
    \ working groups aiming for \n\nthe support of IP (v6 and/or v4) over new physical\
    \ layers such as 802.16 WiMAX, \n\nlow power Wireless Personal Access Networks\
    \ (WPAN) or Digital Video Broadcast \n\n(DVB).\n\nTunneling, for example for remote\
    \ access to enterprise intranets, also remains a \n\ncontinuous point of attention.\n\
    \n***3.2.2 Real-Time Applications and Infrastructure ***\n\n***Area — Media Layer***\n\
    \nWithin this area, the Audio/Video Transport (AVT) working group has delivered\
    \ \n\nthe cornerstone for media transport in the NGN: the Real Time Protocol (RTP,\
    \ \n\nIETF RFC 3550, which superseded RFC 1889).\n\nRTP implements application-level\
    \ framing and integrated layer processing, as \n\ndeﬁned in David D. Clark and\
    \ David L. Tennenhouse’s paper, “Architectural Con-\n\nsiderations for a New Generation\
    \ of Protocols,” ACM, 1990. The sequence numbers \n\nin RTP allow the receiver\
    \ to reconstruct the sender’s packet sequence, or the loca-\n\ntion of a packet\
    \ in a video stream. RTP supports underlying transport layers with \n\npossible\
    \ packet loss and out-of-sequence arrival (UDP).\n\nEmbedded in RFC 3550 is the\
    \ Real Time Control Protocol (RTCP), of which \n\nthe aims are to monitor the\
    \ quality of service and to convey information about \n\nthe participants in an\
    \ on-going session. Indeed, RTP and RTCP were designed to \n\nmake use of IP Multicast\
    \ at the lower layer. Hence for example, each participant to \n\nan audio conference\
    \ will periodically multicast a reception report plus the name of \n\nits user\
    \ on the RTCP control port.\n\nRFC 3550 also introduces two important RTP relay\
    \ nodes: mixers and translators. \n\nMixers are able to convert media (RTP packets)\
    \ from multiple sources into a new out-\n\ngoing RTP stream, with its own timing.\
    \ Translators are able to receive multicast RTP \n\npackets and send out unicast\
    \ RTP, for example, to go through a company ﬁrewall."
  merge: -1
  pgno: 47
- img_proc: true
  md: "RFC 3550 is not a ﬁnal protocol speciﬁcation and makes no assumption about\
    \ \n\nthe media stream being conveyed; for each new media type, RFC 3550 needs\
    \ to be \n\ncompleted with two companion documents:\n\n“RTP Proﬁle”: the RFC 3551\
    \ for audio and video.\n\n“RTP Payload Format”: how, for example, H.261-encoded\
    \ video is carried \n\nin an RTP packet.\n\nRTCP was extended in 2003 with the\
    \ eXtended Report (XR) message (RFC 3611), \n\nallowing intermediates and end\
    \ users to discover new objective metrics for media qual-\n\nity: packet loss\
    \ and discard, burst, delay, Mean Opinion Scores, and so on.\n\n***3.2.3 Real-Time\
    \ Applications and Infrastructure ***\n\n***Area — Session Control Layer***\n\n\
    *3.2.3.1 mmusic*\n\nHere we enter the work of the Multiparty Multimedia Session\
    \ Control (mmusic) \n\nworking group. I would consider them to be the inventors\
    \ of IP television.\n\nThe Real Time Streaming Protocol (RTSP, IETF RFC 2326,\
    \ 1998) is sometimes \n\ndescribed as “the VCR remote control of multimedia networks.”\
    \ Very similar to \n\nHTTP, this protocol allows participants to setup, play,\
    \ pause and teardown media \n\nstreams within a session. It is used by the major\
    \ video players today (RealPlayer, \n\nWindows Media Player and Quicktime). The\
    \ group drafted RTSP 2.0, known as \n\nRFC 2326bis, and which can be regarded\
    \ as a correction of RTSP 1.0.\n\nImmediately next, mmusic catered for a way to\
    \ describe the media present in a \n\nstreaming session — the Session Description\
    \ Protocol (SDP, RFC 2327) and the \n\nway these media can be negotiated during\
    \ session establishment, using an oﬀer/\n\nanswer model (RFC 3264). In 2006, RFC\
    \ 2327 was superseded by RFC 4566.\n\nNext, mmusic is preparing a way for clients\
    \ to announce not only their media \n\ncapabilities, but also their capabilities\
    \ to negotiate the media which will be used in \n\na session.\n\nMmusic is also\
    \ chartered to deliver an Internet Media Guide (IMG): a collection \n\nof multimedia\
    \ session descriptions, comparable to a television program guide.\n\n*3.2.3.2\
    \ SIP/SIPPING*\n\nThis brings us to the work of the Session Initiation Protocol\
    \ (SIP) working group, in \n\nfact a spin-oﬀ from mmusic, and the SIP Investigation\
    \ (SIPPING) working group, \n\nwhich considers new services and feeds requirements\
    \ into sip.\n\nN\n\nN"
