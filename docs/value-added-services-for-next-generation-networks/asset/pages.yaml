  md: "*3.3.2.5 Conclusion for the IMS*\n\nRegarding the IMS, there are some concerns\
    \ that:\n\nThe degree of security, mobility and service triggering is not suﬃcient\
    \ to jus-\n\ntify the investment in a much more complex system than the IETF NGN.\n\
    \nThe decomposed architecture itself of the IMS (breakdown of a softswitch \n\n\
    to P-CSCF, S-CSCF, I-CSCF and even HSS) cannot be justiﬁed any-\n\nmore, and wastes\
    \ computing resources on internal interfaces.\n\nQoS enforcement is complex in\
    \ IMS, increases the delay to set up a basic call, \n\nand requires close interaction\
    \ between the SIP signaling and underlying mobile \n\ndata transport layer in\
    \ the terminal; it is thus not possible to just download an IMS \n\nUser Entity\
    \ on any IP device.\n\nThe features of PSTN/ISDN networks (supplementary services,\
    \ and regu-\n\nlatory obligations such as lawful interception and number portability)\
    \ \n\nwill not be supported by the IMS itself anyway.\n\nMessaging (SMS, MMS)\
    \ appears to have been totally forgotten in the IMS.\n\nArchitectural separation\
    \ of a session plane and a user plane is possible, even \n\nin the circuit-switched\
    \ (CS) domain of 2G mobile networks, using MSC \n\nservers controlling media gateways,\
    \ without deploying an IMS on the \n\npacket-switched (PS) side.\n\n3GPP stretched\
    \ itself from the mobile/wireless space into ﬁxed broadband, an \n\narea with\
    \ very diﬀerent requirements.\n\nAn IETF NGN would outperform a 3GPP IMS if that\
    \ IETF NGN would be \n\naugmented with:\n\nUser authentication via EAP or SMS\
    \ (instead of ISIM/USIM).\n\nTLS/PKI security between network nodes (same as in\
    \ IMS).\n\nNon-device impacting local mobility (instead of 2.5G-3G mobility man-\n\
    \nagement of the GERAN/UTRAN).\n\nEither 3GPP GTP, IETF SIP or IETF MIP as global\
    \ mobility mechanism \n\n(instead of 3GPP GTP  IMS SIP), with header compression\
    \ (as in IMS).\n\nNo QoS enforcement (best eﬀort service), but downgraded DiﬀServ\
    \ QoS \n\nfor peer-to-peer services.\n\nDedicated SIP servers, proxying to each\
    \ other.\n\nSession Border Controllers on the access and interconnect sides (same\
    \ as in \n\nIMS).\n\nClass 4 Media Gateway Control Function (supporting SS7 ISUP,\
    \ SIP-T \n\nand H.248) and Media Gateways (same as in IMS).\n\nClass 5 Softswitch\
    \ for PSTN/ISDN emulation.\n\nIP Centrex Server for enterprise PBX services (perhaps\
    \ asterisk, perhaps still \n\nwith H.323 and ISDN support)."
