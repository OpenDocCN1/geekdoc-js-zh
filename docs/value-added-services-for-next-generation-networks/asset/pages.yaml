  md: "deﬁned by the destination (called) PCP user. Personalized ring tones, videos,\
    \ and \n\nmessages could be returned to the originator, based on the PCP user’s\
    \ preferences (a \n\ndiﬀerent ring tone for my parents than for my colleagues)\
    \ or originating terminal’s \n\ncapabilities. It should be possible to present\
    \ an existing Web site to the originator \n\n(e.g., ﬂash intro of the company)\
    \ as the video response.\n\nPCP’s fundamental objectives are to protect the end\
