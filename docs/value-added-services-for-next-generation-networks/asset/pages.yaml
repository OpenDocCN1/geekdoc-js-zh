  md: "**3.3**\n\n**3GPP**\n\nThe 3rd Generation Partnership Project (3GPP) is the\
    \ current owner, from network \n\nstandards perspective, of GSM (2G\\*), the packet-based\
    \ GPRS (2.5G^†), and related \n\nhigher-speed cellular mobile wireless technology\
    \ (2.75G^‡–3G^§–3.5G^¶). 3GPP inher-\n\nited the responsibility for 2G technology\
    \ from ETSI SMG (Special Mobile Group).\n\nSome of the 3GPP technologies are pure\
    \ radio network technologies (EDGE, \n\nUMTS, HSPA), designed to enhance access\
    \ speeds (for packetized data) in the \n\nradio access network, with as little\
    \ impact as possible on the core network. In fact \n\nthere’s only one technology\
    \ for the packet-based core network: GPRS.\n\nIt is on top of this packet-switched\
    \ domain that 3GPP deﬁned its “NGN plus” \n\nas the IP Multimedia Subsystem (IMS).\n\
    \n3GPP’s strategy is one of Fixed-Mobile Convergence (FMC), with as midterm \n\
    \ntarget that the IMS would become the umbrella core network not only above the\
    \ \n\nmobile packet-switched radio access network but also above the ﬁxed broadband\
    \ \n\naccess networks (e.g., DSL, cable modems, DVB). The IMS would oﬀer solutions\
    \ \n\nfor universal problems such as strong authentication, mobility management\
    \ across \n\naccess networks, and quality-of-service over packet networks.\n\n\
    The assumption is that the mobile and ﬁxed networks in a same country will be\
    \ \n\nrun by a same administrative entity, oﬀering multiplay services.\n\nThe\
    \ services layer, the supervision, provisioning and charging/billing infra-\n\n\
    structures could then be shared among ﬁxed broadband and mobile access divi-\n\
    \nsions, producing cost savings in these FMC-ready organizations.\n\n***3.3.1***\n\
    \n***UMA***\n\nStep zero of FMC has been the adoption by 3GPP of Unlicensed Mobile\
    \ Access \n\n(UMA) technology, where the WiFi hot spot federation needs to be\
    \ directly con-\n\nnected to the GSM Network SubSystem (via the so-called A-interface)\
    \ for voice, \n\nand to the Packet-Switched Core (via Gb/Iu interface) for data.\
    \ Thus, UMA access \n\ncould not be oﬀered from say a hotel’s WiFi hot spot in\
    \ a foreign visited country, as \n\nthe hotel’s ISP is not connected to a GSM/GPRS\
    \ core network.\n\nUMA is an extension of the 2G-2.5G authentication and *local*\
    \ (access network) \n\nmobility schemes to cover the WiFi domain.\n\nDue to the\
    \ immaturity of IETF’s SIP technology for authentication and mobil-\n\nity management\
    \ issues, 3GPP was forced to adopt the GSM A-interface protocols \n\n(BSSMAP/DTAP,\
    \ 3GPP TS 04.08) and to rely on the GSM SIM.\n\n\\* Global System for Mobile communications,\
    \ the second generation cellular network.\n\n† General Packet Radio Service.\n\
    \n‡ EDGE: Enhanced Data rates for GSM Evolution.\n\n§ UMTS: Universal Mobile Telephony\
    \ System, also known as Wideband CDMA (W-CDMA).\n\n¶ HSDPA: High Speed Downlink\
    \ Packet Access."
