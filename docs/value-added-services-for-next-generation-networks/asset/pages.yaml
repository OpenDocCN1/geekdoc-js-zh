  md: "*q*\n\nsoftware vendor to start supporting the latest (more powerful) CPUs,\
    \ as \n\nthe overall license revenue will simply be reduced.\n\nNumber of telecom\
    \ events being handled by the platform: successful only \n\nor also unsuccessful\
    \ communication attempts?\n\nNumber of potential (i.e., usually preprovisioned)\
    \ users of the VAS: active \n\nonly, or also users which have obviously stopped\
    \ using the service but are \n\nstill provisioned on the system?\n\nApplication-speciﬁc\
    \ metrics such as number of scratch vouchers, credit top-\n\nup operations, voice\
    \ messages, presence notiﬁcations.\n\nAny traﬃc-related metric will have to be\
    \ very accurately deﬁned as a peak value, \n\nan average or a median value, over\
    \ a given measurement period (e.g., 1 hour), with a \n\nnumber of measurements\
    \ (e.g., 3600) and granularity (e.g., 1 second).\n\nLicense measurement could\
    \ be a continuous process, whereby the last N mea-\n\nsurement periods are averaged\
    \ out (or the peak or median is calculated).\n\nAlternatively, the time-of-week\
    \ and day-of-year should be speciﬁed on which \n\nsuch measurements (a period\
    \ of 1 hour in the example) will be conducted; maybe \n\nit’s worth not taking\
    \ into account exceptional events such as New Year’s eve for \n\ncommercial license\
    \ calculation.\n\nAbove a given usage threshold, the VAS system may even automatically\
    \ stop \n\naccepting new requests, but we think this shall be done only to protect\
    \ the serv-\n\ners from crashing (overload protection), not to enforce a commercial\
    \ license. As \n\na golden design and operational rule, the infrastructural capacity\
    \ should always \n\nexceed the commercially licensed capacity.\n\n**6.18**\n\n\
    **Openness**\n\nWe already discussed the potential need for openness of the prepaid\
    \ or postpaid \n\nsubscriber account in Section 5.12.\n\nDiﬀerent forms of “openness”\
    \ will also be required on the VAS platform:\n\nOf course, the openness of the\
    \ provisioning, billing and supervision inter-\n\nfaces to the northbound IT systems\
    \ (OSS, BSS and TMN).\n\nThe ability for third-party applications to use the Service\
    \ Capabilities of \n\nthe platform, via open Application Programming Interfaces,\
    \ and vice \n\nversa; this openness should not be over-valued by communication\
    \ service \n\nproviders, as there are almost no such “third parties” able to develop\
    \ com-\n\nponents for multiple systems.\n\nThe ability for the VAS platform’s\
    \ IT layer (local supervision screens) to \n\nincorporate alarms, statistics and\
    \ conﬁguration of closely linked third \n\nparty network elements such as Signaling\
    \ GateWays, Media Servers or \n\nMedia GateWays."
