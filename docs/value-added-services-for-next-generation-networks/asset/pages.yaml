  md: "Internet era, we subscribe to newsletters, use Web applications (banking),\
    \ cre-\n\nate Web passports and log in to various machines and applications, and\
    \ become \n\nmembers of Web communities. The distinction between the former organizations\
    \ \n\nand the new “electronic organizations” is getting more blurred every day.\
    \ A generic \n\nname for these groups of users could be “tribes.”\n\nThe ability\
    \ to maintain these contacts and tribe memberships has become an \n\nimportant\
    \ aspect of everyday life; who would like to lose his/her personal login/\n\n\
    passwords ﬁle without having a backup? Who has never experienced the frustration\
    \ \n\nof transferring the contacts list from an old to a new mobile phone? Or\
    \ to log in to \n\nyour company’s Web mail portal and discover that you can’t\
    \ send e-mails because \n\nyour contacts are not in there?\n\n***1.11.1***\n\n\
    ***Contact lists***\n\nThe Internet Mail Consortium’s standard vCard format is\
    \ an XML document \n\nallowing storage of a personal contact’s e-mail addresses,\
    \ telephone numbers, home \n\npages and geographic address. It allows the PC’s\
    \ address book to be synchronized \n\nwith most mobile devices.\n\nAs for presence\
    \ and availability, one can wonder whether this information \n\nbelongs only within\
    \ devices or also within the network.\n\nPlaxo, for example, oﬀers individuals\
    \ the opportunity to copy personal contacts \n\nto a Web application, and to keep\
    \ them synchronized.\n\nWeb-based e-mail programs rely entirely on Web-based contact\
    \ lists.\n\nPeople however are not ready for a Web-only contacts list: synchronization\
    \ can \n\nbe a tedious task, but it should remain possible to watch the contacts\
    \ without hav-\n\ning network access.\n\n***1.11.2 Tribe Memberships***\n\nHow\
    \ about the tribe memberships?\n\nLet’s here consider a tribe from the strict\
    \ communications sense: the list of users \n\nof a given service.\n\nToday the\
    \ tribe’s own member list is maintained in (hopefully a set of redun-\n\ndant)\
    \ servers.\n\nTribe members themselves have their own schemes (from text ﬁles\
    \ to spread-\n\nsheets) to maintain their personal list of memberships. There\
    \ are no standards \n\n(yet?) to store and synchronize this information between\
    \ the tribe and the member. \n\nHigher security services such as Web banking now\
    \ even require additional physical \n\nsignature devices.\n\nWithout local address\
    \ books, people would make fewer outgoing calls and send \n\nfewer text messages\
    \ from mobile phones.\n\nWould it therefore be a fair explanation of today’s low\
    \ success of mobile data \n\nservices, that there’s simply no tribe membership\
    \ ﬁle on today’s mobile handsets?"
