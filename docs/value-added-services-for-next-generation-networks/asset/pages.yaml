  md: "**6.6**\n\n**High Availability**\n\nHigh Availability (HA) is the result of\
    \ technical but also operational factors.\n\nMost VAS and NGN platform vendors\
    \ claim 99,999% availability, in general.\n\nBut communication service providers\
    \ have come to rely on more precise Service \n\nLevel Agreements (SLAs) with their\
    \ suppliers.\n\nIn these contracts, it has been very diﬃcult to come to a clear\
    \ deﬁnition of \n\nservice availability, as the communication service consists\
    \ of the application and all \n\nsurrounding enablers (IT, Service Capabilities\
    \ and Infrastructure).\n\nAlso, the distinction between congestion, partial unavailability,\
    \ and outage, or \n\nthe classiﬁcation of faults into severity levels (i.e., critical,\
    \ major, minor), has been \n\na point of lengthy discussions.\n\nA high degree\
    \ of redundancy alone does not ensure HA. For example, if all \n\nongoing communications\
    \ are lost when an application instance fails, the platform \n\ncan still be considered\
    \ to be redundant (if there are other application instances), \n\nbut it is obviously\
    \ less HA than if there would be memory synchronization for the \n\ncontext information.\
    \ And even then, a memory leak (an application reserving more \n\nmemory than\
    \ it deallocates for each context) could occur in a perfectly redundant \n\nsystem,\
    \ probably aﬀecting all application instances at once.\n\n**6.7**\n\n**Scalability**\n\
    \nAnother popular confusion is between redundancy and scalability.\n\nVery redundant\
    \ systems can turn out to be totally nonscalable.\n\nWhen adding the next (often\
    \ more powerful) AS, database replication, memory \n\nsynchronization or other\
    \ processes (CDR collection) can turn out to burn an ever \n\nincreasing amount\
    \ of computing and communication resources, until all previous \n\nAS have to\
    \ be replaced by more powerful models.\n\nFunctional scalability is also to be\
    \ considered: it cannot be the case that adding \n\nonline charging, for example,\
    \ totally ruins the performance of a number translation \n\nservice.\n\nIt is\
    \ useful to have, from start, a dimensioning (simulation) tool which predicts\
    \ \n\nresource utilization (CPU, memory, database, I/O) for both functional and\
    \ capac-\n\nity upgrades, along the years.\n\n**6.8**\n\n**Resource Allocation**\n\
    \nResource utilization is of course strongly depending on the resource allocation\
    \ policy.\n\nA multitasking OS can make sure it grants suﬃcient CPU power and\
    \ I/O access \n\nto diﬀerent processes, also based on their conﬁgurable relative\
    \ priority.\n\nA database can also be tuned to provide optimal response times\
    \ to the most \n\ncritical users (applications)."
  merge: -1
  pgno: 124
- img_proc: true
  md: "*q*\n\nBut memory allocation is typically not governed by the infrastructure\
    \ layer.\n\nIt should be possible for protocol stacks and service capabilities\
    \ to receive \n\ninvalid, nonsupported or forbidden requests from the network,\
    \ without memory \n\nbeing needlessly reserved to hold a transaction or communication\
    \ state.\n\nIf the network request is valid and permitted, Service Capabilities,\
    \ by deﬁni-\n\ntion, rely on resource allocation to store the context information\
    \ pertaining to the \n\ncommunication session.\n\nApplications must be able to\
    \ extend this reservation, for example, to append \n\nother transactions to the\
    \ communication session.\n\nBut before the Application intervenes, Service selection\
    \ uses the context infor-\n\nmation, as mentioned in Section 6.9 below.\n\n**6.9**\n\
    \n**Service Selection**\n\nWhen a communication service request (e.g., SIP INVITE)\
    \ comes in from the net-\n\nwork, it is important to design a good strategy to\
    \ map the parameters of the request \n\nto the correct application instance.\n\
    \nBut often, the actual application service logic to be applied cannot be deter-\n\
    \nmined before the subscriber and service database has been consulted (e.g., to\
    \ dis-\n\ncover the originating user’s product type).\n\nThis process of service\
    \ selection too often ends up being performed at the start of \n\nthe execution\
    \ of a “default” application. When a new application is added, the network \n\n\
    or service capabilities still select the default application, and application\
    \ chaining is then \n\nrequired (to pass service control from one application\
    \ to the next one). Introducing a \n\nnew service ends up impacting all existing\
    \ default applications on the AS.\n\nThe network and service capabilities should\
    \ thus invoke the service selection \n\nprocess ﬁrst, by default.\n\nApplication\
    \ instances should be able to signal their state and load to the service \n\n\
    selection process, for it to take action. It is therefore not a good idea to build\
    \ the service \n\nselection process into each service capability: they would all\
    \ need to be informed.\n\nThe service selection problem is diﬀerent from service\
    \ chaining: the service \n\nselection process should normally select only one\
    \ application to be executed.\n\n**6.10**\n\n**Watchdog**\n\nIt would be naive\
    \ to assume that service capability instances, service selection \n\ninstances,\
    \ application instances, and common processes will never become con-\n\ngested\
    \ or fail.\n\nA highly available platform should therefore include a watchdog\
    \ process, continu-\n\nously polling the other processes with “are you OK?” and\
    \ “are you congested?” mes-\n\nsages, and taking appropriate action upon time-out\
    \ or negative responses."
  merge: -1
  pgno: 125
- img_proc: true
  md: "The watchdog process should restart failed processes and instruct the service\
    \ selec-\n\ntion instances to divert new requests to non-overloaded application\
    \ instances.\n\n**6.11**\n\n**Overload Protection**\n\nOverload protection is\
    \ the ability of the VAS platform to either reject incoming \n\nrequests from\
    \ (the Session layer of) the network, or to instruct to throttle (lower) \n\n\
    the number of requests.\n\nWhatever is used (rejection or throttling), the VAS\
    \ platform should maintain \n\ncounters of network events per second, per application,\
    \ but perhaps also per origin, \n\ndestination, and so forth, if communication\
    \ requests should be rejected at that \n\nmore granular level.\n\nThe overload\
    \ thresholds (limits as of which overload is detected) may either be \n\npreprovisioned\
    \ (static mode) or the system may, in real time, discover a top-10 of \n\napplications,\
    \ origins and destinations causing the overload (dynamic mode).\n\nThe counters\
    \ and thresholds may be applicable within each VAS server (plat-\n\nform-speciﬁc),\
    \ or maintained and enforced across the full set of VAS servers \n\n(application-wide).\n\
    \nPlatform-speciﬁc overload control means that if one server is overloaded, the\
    \ \n\nnetwork may decide to route new requests to the remaining other servers,\
    \ which \n\nare usually also busy at that moment, therefore causing a chain reaction.\
    \ Therefore \n\nthe platform-speciﬁc approach to overload control is forbidden\
    \ in cases where the \n\ncore network elements cannot be instructed to lower the\
    \ number of requests (rather \n\nthan redistributing them to diﬀerent VAS servers).\n\
    \nThe application-wide overload protection approach requires a smart way to \n\
    \ncommunicate counters and overload events between the VAS servers, as otherwise\
    \ \n\nthe VAS severs might end up consuming more resources *talking about the\
    \ overload*\n\nthan actually *resolving it*.\n\nWhichever of these two methods\
    \ is used, if the VAS platform simply rejects the \n\nnetwork’s request because\
    \ of overload, the network should of course not simply retry \n\nthat request\
    \ to the same server. Redistributing it to a diﬀerent one is as pernicious.\n\n\
    The originating (calling or message sending) user needs to be informed promptly\
    \ \n\nand properly, otherwise he/she will simply retry, not knowing the nature\
    \ of the \n\nproblem.\n\nIf the network can be instructed (by the VAS platforms)\
    \ to throttle (lower) the \n\nnumber of requests, this method should be preferred,\
    \ but a number of extra issues \n\nis to be addressed.\n\nWhat level of granularity\
    \ is supported in the network (e.g., by application, \n\norigin, destination)?\
    \ The application to be invoked, for example, is sometimes \n\nunknown by the\
    \ network — only the fact that *an application* needs to be invoked \n\nfor a\
    \ given subscribe, number range or domain."
