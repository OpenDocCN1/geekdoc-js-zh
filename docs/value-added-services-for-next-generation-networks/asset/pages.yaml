  md: "**6.28 Documentation**\n\nHere we arrive at the edge of the VAS platform features,\
    \ and enter the domain of \n\nwhat we called the surrounding enablers in the introduction\
    \ of this chapter.\n\nDocumentation should be built into provisioning, operations\
    \ and supervision \n\nscreens (as hyperlinks) and MML commands (as help pages)\
    \ as much as possible.\n\nThe days are over when CRM agents, operations and supervision\
    \ engineers \n\ncould be trained for weeks on the signiﬁcation of ﬁelds, on processes\
    \ and available \n\nfeatures.\n\nA new application or platform software release\
    \ should thus also come with the \n\nappropriate new documentation modules.\n\n\
    **6.29 Support**\n\nPlatform and application software support is another, yet\
    \ even more important \n\nenabler of modern communication services.\n\nIt would\
    \ require a dedicated book to describe the aspects of a competitive sup-\n\nport\
    \ process. The Service-Level Agreement (SLA) between service provider and \n\n\
    platform or software supplier would be one of the chapters.\n\nStrictly from a\
    \ VAS platform perspective, the supportability of a VAS platform \n\nand software\
    \ of course depends on almost all characteristics we discussed in this \n\nchapter.\n\
    \nSupportability, which can be expressed, for example, as a reasonable number\
    \ of \n\ncases and rapid resolution times, is the reward for service providers\
    \ and suppliers \n\nwho have respected these principles of VAS platform design."
  merge: -1
