  md: "In the beginning of the twentieth century, before the advent of automatic tele-\n\
    \nphone exchanges, the caller would be connected to a switch board attendant and\
    \ \n\nask to be connected to a given number.\n\nPart of a telephone communication\
    \ is contextual; part of it is truly interactive.\n\nIt is the mix of both which\
    \ seems to make communication means attractive \n\nand successful.\n\nWhen the\
    \ communication is mainly interactive, the contextual portion on the \n\nother\
    \ hand gives the originator the time to structure his/her thoughts. Didn’t you\
    \ \n\never feel confused when (by some technical fault) no ring tones were played\
    \ but the \n\ncalled party suddenly took the call?\n\nSome modern communication\
    \ means that used to be purely interactive are \n\nevolving to also include a\
    \ contextual portion.\n\nChatting and instant messaging, for example, used to\
    \ be purely interactive. Some \n\nIM users then started to modify their display\
    \ name every day, telling about their \n\nmood or upcoming activities. Later it\
    \ was added in as a feature, separate from the \n\nnickname. IM/VoIP clients allow\
    \ users to add a picture, some proﬁle information, \n\nand so forth, that can\
    \ be viewed by the caller before the actual communication takes \n\nplace. Some\
    \ mobile operators allow their users to select the ring tone that callers will\
    \ \n\nhear (known as “Personalized Ring Back Tone” or “Colored Ring Tone”) and\
    \ this \n\nservice is a smash hit in some countries (Korea).\n\nConversely, communication\
    \ means that used to have only the contextual por-\n\ntion, are now adding the\
    \ interactive part.\n\nMost company Web sites (and intranets) used to be contextual\
    \ only. But air-\n\nline, insurance company and utility Web sites have been transformed\
    \ to include \n\nan interactive portion, where people can ﬁll in their phone number\
    \ and click “Call \n\nMe” buttons. “Skype Me” buttons, which you can insert, for\
    \ example, in your e-\n\nmail signature, make the persons who click this button\
    \ use their Skype VoIP client \n\nto contact you. On some public and intranet\
    \ sites, it’s already possible to directly \n\nclick other employees, departments\
    \ or knowledge areas to set up voice-on-Web calls \n\nand video-on-Web sessions.\n\
    \nIn the television space, there’s a similar trend where viewers are invited to\
    \ use SMS, \n\ne-mail or the show’s Web site to participate to the quiz or give\
    \ their opinion.\n\nOf course people will use diﬀerent communication means in\
    \ parallel, in some \n\nparticular situations. The typical example is chatting\
    \ during a conference call or \n\nWebinar. Another one is photographing or ﬁlming\
    \ the surroundings with your \n\ncam phone, and transmitting that as a video call,\
    \ while continuing the voice \n\nconversation using your Bluetooth headset. These\
    \ are referred to as *combinatory *\n\n*services*.\n\nIn the long run, the contextual\
    \ part of the communication may thus become \n\nextended to cover the entire duration\
    \ of the interactive part, as illustrated on the \n\ndiagram below."
