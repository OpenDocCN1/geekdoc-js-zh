  md: "Services and Protocols for Advanced Networks (SPAN)\n\nTelecom and Internet\
    \ Protocol Harmonization Over Networks (TIPHON)\n\nWhereas ETSI’s inﬂuence was\
    \ conﬁned to Europe, TISPAN.org is now leading \n\nan independent and international\
    \ life, just like 3GPP.\n\nAnd we must say, with success.\n\nOﬃcially, TISPAN\
    \ has incorporated the 3GPP IMS at the heart of its NGN \n\narchitecture and there\
    \ will be a single IMS for both mobile and ﬁxed access. The \n\nfollowing diagram\
    \ shows the overall architecture of the TISPAN Next Generation \n\nNetwork, as\
    \ described in the standard ES 282 001:\n\nIn fact, TISPAN has corrected the mobile-centric\
    \ aspects of 3GPP IMS releases \n\n5 and 6, and many shortcomings in the ﬁxed\
    \ access part of 3GPP IMS release 7.\n\nTISPAN NGN Release 1 contains over 70\
    \ deliverables of various types:\n\n12 Technical Reports (TR)\n\n39 Technical\
    \ Speciﬁcations (TS) issued by TISPAN only\n\n20 ETSI Standards (ES) endorsed\
    \ by the ETSI members\n\n**Figure 3.4**\n\n**TISPAN NGN overall architecture.**\n\
    \nApplications\n\nOther\n\nSubsystems\n\nCore\n\nIMS\n\nPSTN/ISDN\n\nEmulation\n\
    \nSubsystem\n\nUser\n\nProfiles\n\nService\n\nLayer\n\nNetwork\n\nAttachment\n\
    \nSubsystem\n\nResource and\n\nAdmission Control\n\nSubsystem\n\nTransport\n\n\
    Layer\n\nTransfer Functions\n\nUser Equipment\n\nOther Networks"
