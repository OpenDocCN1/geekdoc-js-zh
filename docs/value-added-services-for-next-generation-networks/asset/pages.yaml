  md: "*g*\n\n*g*\n\n*g*\n\n*q*\n\ncustomer segments certainly helps. It is of no\
    \ use to grant free MMSs to the Silver \n\nCynics; they’d, however, very much\
    \ appreciate free texts to their grandchildren.\n\nThe system ends up applying\
    \ a promotional action: moving the account up the \n\nladder in a loyalty scheme\
    \ (e.g., from Gold to VIP in a frequent caller program), \n\ngranting bonus credit\
    \ in the wallets, and so on. Please note that it is often the wallet \n\nreceiving\
    \ this promotion, not the user/partner itself.\n\nA promotion loses its eﬀect\
    \ if the users of the wallet are not informed in near \n\nreal-time of it. Granting\
    \ a bonus at the end of the month will have only a minor \n\neﬀect on loyalty.\n\
    \nIn most cases, but certainly if a promotion is granted upon subscription to\
    \ a \n\nservice, loyalty can be greatly improved by not granting the whole reward\
    \ at once. \n\nCredit bonuses can be spread over time as “periodic credit installments”\
    \ (e.g., one \n\nfree SMS a day for the coming month).\n\nIt is important to be\
    \ able to simulate a promotional campaign in advance of \n\nactually launching\
    \ it. Too often, communication service providers launch cam-\n\npaigns with meager\
    \ eligibility criteria, to unclear segments (too many people) and \n\ngranting\
    \ an insigniﬁcant or inappropriate beneﬁt.\n\nPromotions can be used as a tool\
    \ to steer end users toward more proﬁtable behav-\n\nior, for example to use e-vouchers\
    \ rather than scratch vouchers to top-up their pre-\n\npaid wallets, or to top-up\
    \ with larger amounts rather than frequent small amounts.\n\n**5.12**\n\n**Openness**\n\
    \nMuch has been said and written regarding the edge between mobile operators and\
    \ \n\nﬁnancial institutions.\n\nOperations on a mobile account (e.g., topping\
    \ up a prepaid account using a \n\nscratch voucher) are for example subject to\
    \ VAT, contrary to a bank account. A \n\ncommunications invoice is sent to you\
    \ including VAT.\n\nM-commerce has been touted as the possibility for the mobile\
    \ communications \n\nconsumers, using their mobile account, to purchase various\
    \ services and goods, \n\nother than mobile communications and content, sometimes\
    \ forgetting about these \n\nVAT issues.\n\nGradually, the mobile service providers\
    \ realized that by opening up that “purse” \n\nfor a competitive fee (meaning\
    \ at the level with credit card fees), they would face \n\ncompeting services\
    \ being oﬀered by these third parties directly to their own sub-\n\nscriber base.\n\
    \nWe looked at this from a technical angle in Section 4.8.\n\nPremium SMS and\
    \ MMS (short messages and multimedia messages to short \n\ncodes) have been oﬀered\
    \ as means for third party application service providers to \n\n“tap” (debit funds)\
    \ from the user’s prepaid mobile account, or to add items on the \n\npostpaid\
    \ bill. It is a case of bundled selling, where the mobile service providers do\
    \ \n\nnot wish to oﬀer access to the purse (the payment method) without a message\
