  md: "Today, most operators generate invoices for only postpaid accounts (charged\
    \ in \n\noﬀ-line mode). Prepaid subscribers can get an invoice for top-up events\
    \ (e.g., for \n\nvouchers) but not for usage (calls, messages).\n\nBut there’s\
    \ no technical reason to link the production of a bill to the charging \n\nmode\
    \ — that is, billing should be possible in case of online charging too. Prepaid\
    \ \n\nservices could appear on an invoice, that is, to allow the customer to pay\
    \ VAT only \n\non usage, rather than today on the facial value of the top-up vouchers.\
    \ Top-up \n\nvouchers could then be sold without VAT, to customers having a veriﬁed\
    \ billing \n\nrelationship (name and address).\n\nAs for product types and lifecycles,\
    \ one can wonder whether bills should not be \n\nproduced regarding a wallet,\
    \ rather than regarding a user or partner.\n\n**5.10**\n\n**Payment**\n\nThe payment\
    \ methods should not be imposed by the bill. It should be perfectly pos-\n\nsible\
    \ to settle a postpaid bill using a prepaid scratch voucher, ATM reload or bank-\n\
    \nto-account or inter-account credit transfer — whereas these payment methods\
    \ are \n\ntoday considered only to top up prepaid accounts.\n\nAs for some public\
    \ utility services, the customer could be proposed the option \n\nto pay a monthly\
    \ ﬁxed amount, to even out consumption peaks. The monthly \n\namount would be\
    \ recalculated annually.\n\nAs for tax payments in some countries, the customer\
    \ could be invited to \n\nmake advance payments in return for lower rates or bonuses\
    \ (see Section 5.11 on \n\npromotions).\n\nCredit notes should be issued to correct\
    \ billing mistakes — nobody’s perfect.\n\nCustomers and partners having real payment\
    \ problems should be converted to \n\nprepaid or at least limited credit accounts.\n\
    \nBills, credit notes and payments should be tracked in a ledger closely linked\
    \ to \n\nthe account, for customer care reasons.\n\nPayment chasing represents\
    \ today roughly one third of an average communica-\n\ntion service provider’s\
    \ CRM department.\n\n**5.11**\n\n**Promotions**\n\nPromotions can be granted upon\
