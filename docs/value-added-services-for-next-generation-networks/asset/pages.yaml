    \ enemies, and can tear apart each other’s business \n\nmodels, companies and\
    \ end users.\n\n**1.3**\n\n**Communication and Computing**\n\nTrue communications\
    \ are clearly fuelled by the advances in computing.\n\nIt sounds unbelievable\
    \ that the major inventions for the digital age (the transistor, \n\nthe microchip,\
    \ magnetic and optical storage) all happened less than 50 years ago, that \n\n\
    the Internet appeared less than 20 years ago. That the GSM handsets evolved from\
    \ a \n\ncell phone to a networked personal computer in less than 10 years — at\
    \ the center of \n\ntheir own personal access network of Bluetooth headsets, car\
    \ kits and keyboards.\n\nComputing is still in its expansion phase and the movement\
    \ seems to accelerate.\n\nWireless broadband technology is going to expand the\
    \ reach of the Internet \n\ninto remote areas without copper pairs or even without\
    \ electricity; therefore creat-\n\ning new markets for low cost computing devices\
    \ (laptop PCs, batteries and solar \n\npanels).\n\nThe expansion of computing\
    \ is not restricted by the number of humans — \n\ntherefore by the human assimilation\
    \ bandwidth or human desire to communicate. \n\nCars and household appliances\
    \ contain computers. Our electricity meters might \n\nsoon contain one. Radio-frequency\
    \ identiﬁcation (RFID) tags would allow every \n\nitem in a clothes shop to contain\
    \ a disposable computer. Watches will soon contain"
