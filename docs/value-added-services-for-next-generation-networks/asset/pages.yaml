  md: "Some areas get little attention, such as Media Resource Function Controllers\
    \ \n\n(MRFC), Media Resource Function Points (MRFP) and Media Gateways — especially\
    \ \n\nwhen migrating from voice to video or new media types.\n\nAnother important\
    \ no-man’s-land is the IT part (OSS, BSS and TMN); whereas \n\ntoday, 40% of the\
    \ eﬀort to deploy a new service probably goes into provisioning, \n\nbilling and\
    \ supervision tools and processes. Organizations that used to cover this \n\n\
    area, for example, the Object Management Group (OMG) with a.o. the Common \n\n\
    Object Request Broker Architecture (CORBA), have lost ground and momentum. \n\n\
    Rather than focusing on the telecom sector, they tried to be everything to everyone,\
    \ \n\nincluding the ﬁnancial sector.\n\nFortunately, the times where a diﬀerent\
    \ radio access technology (GSM, CDMA) \n\nwould lead to diﬀerent core network\
    \ architectures and even diﬀerent VAS plat-\n\nforms, seem to be behind us. As\
    \ a result of this bitter ﬁght, 3GPP and 3GPP2 lost a \n\nlot of authority and\
    \ credibility. GSM has won that battle, with 85% of subscribers \n\nworldwide.\n\
    \nThis has left an open space to TISPAN, to deﬁne the PSTN Emulation Sub-\n\n\
    system (PES) and make advances in network attachment, resource and admission \n\
    \ncontrol and service-based policy decisions, based on IETF (DIAMETER) and ITU\
    \ \n\n(H.248) protocols.\n\nHowever perhaps on a larger scale, IETF and ITU are\
    \ now competing to adopt \n\nand globalize the TISPAN standards. TISPAN seems\
    \ to push toward ITU.\n\nThe battle between bitheads and bellheads is likely to\
    \ be pursued for the fore-\n\nseeable future.\n\nAnd at an even greater scale,\
    \ communication standards will keep competing \n\nwith powerful vendor-speciﬁc\
    \ solutions at all layers of the NGN: peer-to-peer com-\n\nmunication technologies,\
    \ regional HD TV formats, closed instant messengers and \n\nsearch engines, incompatible\
    \ music and video formats, proprietary radio technolo-\n\ngies such as Flash-OFDM\
    \ or WiBree."
