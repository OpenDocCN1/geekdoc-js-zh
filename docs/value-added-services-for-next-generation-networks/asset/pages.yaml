  md: "Should the car industry adopt communication standards such as SIP today, \n\
    \nwait for new ones, or develop their own? Considering their recent (and maybe\
    \ not \n\nso successful) experience in navigation systems ….\n\nIt helps to look\
    \ at the new standards from the perspective of past success for-\n\nmulas. Are\
    \ the features still there (e.g., echo cancellation for voice)? Are known \n\n\
    issues and imitations of past technologies (e.g., long call setup delays) successfully\
    \ \n\naddressed in the new one?\n\nSome services such as video calling were even\
    \ developed throughout multiple \n\nstandards (ISDN; 3GPP Release 1999 circuit\
    \ switched; SIP), which helps to form \n\nan opinion on the beneﬁts of each standard.\n\
    \nAlso, uncovering the main drivers behind an organization’s work one can shed\
    \ \n\nsome light on the usefulness of a technology.\n\nBut before we dive into\
    \ the organizations and standards in the area (in order of \n\nrelevance), it\
    \ is time for some ﬁrst attempts to deﬁne a Next Generation Network.\n\nNot too\
    \ broad, not too narrow.\n\n**3.1**\n\n**Deﬁnition of a Next Generation Network**\n\
    \n*A Next Generation Network is a set of servers that allows User Agents to establish\
    \ and be *\n\n*charged for Sessions, within which they can convey Media streams.*\n\
    \nThis statement is too trivial; it’s like deﬁning the Internet as a network in\
    \ which \n\nwe use HTTP to browse sites hosted on Web servers — which ignores\
    \ the myriad \n\nof other applications on IP.\n\nUnder this basic NGN deﬁnition,\
    \ user agents may, once they have established \n\nthe session, exchange media\
    \ streams freely, outside of the control of the Next Gen-\n\neration Network Service\
    \ Provider (NGNSP).\n\nWe will use this new acronym, NGNSP, throughout the book,\
    \ in analogy with \n\nISP (Internet service providers) mainly providing connectivity\
    \ to the Internet (but \n\nalso e-mail, hosting, name servers and other services)\
    \ and CSPs (communication \n\nservice providers) providing traditional ﬁxed and\
    \ mobile communication services. \n\nFor the moment, let’s park the question whether\
    \ NGNSPs will ever be part of the \n\nCSP family.\n\nOne can wonder whether a\
    \ NGNSP is required, and could claim revenue, for \n\nsuch simple task as setting\
    \ up SIP sessions to telephone numbers at domains.\n\nSome people have even started\
    \ to think of SIP as a peer-to-peer protocol, remov-\n\ning the need for a NGNSP\
    \ to switch (analyze and route) these addresses.\n\nWould it help to add the following\
    \ conditions to the deﬁnition?\n\n*The Media streams will be forced to use a Border\
    \ Gateway of the same organization *\n\n*as the one charging for the Session establishment.\
    \ This NGNSP will take the responsi-*\n\n*bility to deliver adequate Quality-of-Service,\
    \ according to the codec negotiated for the *\n\n*media stream.*"
