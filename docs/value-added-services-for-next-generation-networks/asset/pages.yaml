  md: "**6.13**\n\n**Software Versioning**\n\nAt each layer of the architecture of\
    \ Section 6.1, the version will have a diﬀerent sig-\n\nniﬁcance; examples are\
    \ a diﬀerent screen layout in the IT layer, a more reﬁned service \n\nlogic in\
    \ the Applications layer, support for new network interfaces in the Service \n\
    \nCapabilities layer, or a new database object model in the Infrastructure layer.\n\
    \nOf course within a single layer, multiple software components will need to \n\
    \ncoexist, each dedicated to a single task and therefore having its own lifecycle\
    \ of \n\nimprovements and corrections.\n\nMany problems can be avoided with an\
    \ upfront, clear and unambiguous deﬁni-\n\ntion of a software versioning scheme.\n\
    \nVersion numbers should be given to software components, *not to packages*. The\
    \ \n\npackage should therefore clearly indicate the version number of each component.\n\
    \nFour digits are usually suﬃcient to qualify the version of a software component,\
    \ \n\nin the format X.Y.Z.P where:\n\nX is best used to indicate a Major Upgrade\
    \ of the component, *aﬀecting *\n\n*the way existing functionality is executed*,\
    \ together with introducing new \n\nfunctionality.\n\nY should denote a Minor\
    \ Upgrade, introducing signiﬁcant new functional-\n\nity *but not aﬀecting the\
    \ way existing functionality is performed.*\n\nZ should denote an Update, introducing\
    \ limited new functionality that may \n\neven be speciﬁc to a group of customers\
    \ (as opposed to Minor Upgrades \n\nwhich should be kept customer-independent!).\n\
    \nP should denote a Patch level, not introducing any new functionality and only\
    \ \n\ncorrecting bugs of diﬀerent severity (of course, Updates, Minor and Major\
    \ \n\nUpgrades should include ﬁxes for all known bugs at their time of issue).\n\
    \nThis deﬁnition is only a general canvas, from experience, but may in practice\
    \ fur-\n\nther be reﬁned by suppliers and operators.\n\nThe purpose of this deﬁnition\
    \ is not only clarity during operational discussions, \n\nbut also in commercial,\
    \ contractual and legal domains. For example, it is very \n\nimportant in a support\
    \ contract to specify which software versions will be sup-\n\nplied and/or installed\
    \ for free by the supplier; which ones will be supplied/installed \n\nsubject\
    \ to a ﬁxed agreed price, and which ones will be subject to new, independent \n\
    \ncommercial oﬀers.\n\n**6.14**\n\n**Software Release Cycle**\n\nEach software\
    \ version goes through diﬀerent phases in the software production \n\nprocess\
    \ — from concept, over scoping and planning, requirements, high-level \n\ndesign,\
    \ detailed design, unit testing, internal functional testing including nonre-\n\
    \ngression, compatibility and performance, to early ﬁeld trial, general availability,"
  merge: -1
  pgno: 128
- img_proc: true
  md: "*q*\n\nand so on. The know-how and experience of the software vendor are key\
    \ to evaluate \n\nwhich steps to perform for which type of component and version.\n\
    \nIt is possible that not all intermediate versions (especially Patch levels)\
    \ should be \n\ninstalled in order to update or upgrade a platform to the latest\
    \ available version.\n\nAlso there needs to be a well-documented procedure to\
    \ announce the end of \n\nlife (EOL) of a version or the component itself, and\
    \ the consequences in terms of \n\nvendor support: usually only Patches are available\
    \ for severe bugs and for a limited \n\ntime after the EOL announcement.\n\nThe\
    \ release cycle greatly inﬂuences the total cost of ownership (TCO).\n\nLow-quality\
    \ software will result in many patches (for severe bugs), updates, \n\nupgrades,\
    \ forcing the operator to engage signiﬁcant human, capital and opera-\n\ntional\
    \ expenditure even to keep a comparable level of functionality throughout the\
    \ \n\nyears.\n\nHigh-quality software will consist of major upgrades (e.g., one\
    \ every two years) that \n\ncontain enough functionality, in advance of a low\
    \ number of minor upgrades (e.g., two \n\na year). Operator-speciﬁc updates will\
    \ be delivered/installed for free and without much \n\nintervention from the operator.\
    \ There will be almost no need to install patches; the \n\nseverity of bugs will\
    \ be low and the patches could wait for the next update.\n\n**6.15**\n\n**Backward\
    \ Compatibility**\n\nEach new version of a component brings along the risk to\
    \ impact surrounding \n\ncomponents.\n\nIf these components are all within a same\
    \ package, usually the versions in that \n\npackage will have been tested by the\
    \ vendor to interoperate correctly.\n\nThings get fuzzier when packages introduce\
    \ new components (or versions) \n\nwhich need to interoperate with diﬀerent existing\
    \ versions of other components \n\n(i.e., outside of the new package).\n\nTherefore\
    \ it is a good practice by the vendor to maintain and publish a software \n\n\
    compatibility grid or workbook. For all versions of any component, the compatibil-\n\
    \nity grid should indicate with which other components (and their version) backward\
    \ \n\ncompatibility is\n\nEnsured and veriﬁed\n\nAssumed but nontested\n\nNot\
    \ assumed but nontested\n\nTested, resulting in noncompatibility\n\n**6.16**\n\
    \n**Version Activation**\n\nIt is an operational nightmare having to install new\
    \ software packages and com-\n\nponents at night in the so-called “operational\
    \ window,” right before they go into \n\nproduction in the morning."
