    \ price per minute) to the CLEC/ICH, as speciﬁed by a national \n\nreference interconnection\
    \ oﬀer. Even the interconnection infrastructure to termi-\n\nnate these calls\
    \ (leased lines) is, according to most regulation, fully at the expense of \n\n\
    the ILEC; conversely, trunk groups being used for CLEC-to-ILEC calls are entirely\
    \ \n\nat the charge of the CLEC.\n\nBy 2008–10, many regulators and ILEC are expected\
    \ to introduce VoIP inter-\n\nconnections as a cost-eﬀective alternative the E1/T1\
    \ leased lines — a loss of revenue \n\nfor the ILEC’s transmission wholesale department.\n\
    \nWorse, as a new cost, the ILEC will incur the costs of media gateways perform-\n\
    \ning the circuit-to-VoIP conversion for a while, as long as many calls keep being\
    \ \n\noriginated in circuit-switched mode.\n\nRegulators and service providers\
    \ have some hard work ahead, extending today’s \n\ncircuit-switched Reference\
    \ Interconnection Oﬀers to the packetized world, thus \n\ntransforming them into\
    \ NGN peering agreements.\n\nThis brings us to the subject of our next section."
