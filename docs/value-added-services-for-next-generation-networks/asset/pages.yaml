  md: "**27**\n\n***Chapter 2***\n\n**A SWOT Analysis **\n\n**for Communication **\n\
    \n**Service Providers**\n\nIn this chapter, let’s land our chopper on the grounds\
    \ of the Communication Service \n\nProviders (CSP): Fixed and Mobile Operators,\
    \ including new entrants such as Quad \n\nPlay\\* Service Providers, Instant Messaging\
    \ and VoIP Service Providers, and Web-\n\nbased Mobile Virtual Network Operators\
    \ (MVNO).\n\nLet’s consider their assets in terms of strengths and weaknesses,\
    \ and the oppor-\n\ntunities and threats oﬀered by the immediate surroundings\
    \ of our landing spot.\n\n**2.1**\n\n**Strengths**\n\nToday, Mobile and Fixed\
    \ Operators have highly valuable assets.\n\nGSM/CDMA cellular radio **coverage\
    \ and copper** lines have both proven to be \n\nable to carry IP traﬃc in always-on\
    \ mode, using GPRS, CDMA2000 and DSL tech-\n\nnologies. The bandwidth is suﬃcient\
    \ for many services, and can still be increased, \n\nat the cost of huge investments\
    \ though (3G on the mobile side, VDSL on the ﬁxed \n\nside). This should enable\
    \ streaming services such as digital radio, digital TV and \n\nvideo calls to\
    \ be carried over these packet networks — services which put quite \n\nstringent\
    \ requirements on the underlying bit pipes in terms of Quality of Service: \n\n\
    \\* Simultaneously providing ﬁxed, mobile telecom, Internet access and digital\
    \ TV."
