  md: "And certainly, the NGNSP should get a good view of how *infrequently* certain\
    \ \n\noptions are used, in order to simplify the commercial oﬀer.\n\nFinally,\
    \ an important aspect of reporting is that it should allow a NGNSP to \n\ndetect\
    \ a decrease in usage by certain partners (peer NGN, ASP’s) or subscribers. \n\
    \nToday this is often considered to be a data warehouse function, generating a\
    \ weekly \n\nreport, but in an increasingly volatile NGN environment, a sudden\
    \ decrease in \n\ntraﬃc from a given source can already indicate that an important\
    \ peer, ASP or user \n\nagent has selected another NGNSP as the next hop. Conversely,\
    \ a too interesting \n\noﬀer can suddenly attract far too much traﬃc and result\
    \ in Service Level Agree-\n\nments not being met anymore.\n\nIt is not a subscriber\
    \ decision anymore.\n\nFor all these reasons, reports cannot be generated by post-processing\
    \ CDRs col-\n\nlected from the core network and VAS platforms.\n\nThe VAS platform\
    \ itself needs to generate a conﬁgurable set of reports, a set of \n\ncounters\
    \ and even alarms on these counters (thresholds), informing the NGNSP’s \n\ncommercial\
    \ chain about a corrective action to be taken (advertising a new price, \n\nfor\
    \ example).\n\nThis commercial battle can be won only with suﬃcient automation.\n\
    \n**6.26 TMN FCAPS**\n\nThe Telecommunications Management Network (TMN) is originally\
    \ a protocol \n\nmodel deﬁned by the International Standards Organization (ISO),\
    \ then ITU-T \n\nwith the M.3000 series of recommendations. TMN was structured\
    \ in Business, \n\nService, Network and Element management. It included a protocol\
    \ called Common \n\nManagement Information Protocol (CMIP, ITU-T X.700 series),\
    \ which today is \n\nlargely superseded by the IETF Simple Network Management\
    \ Protocol (SNMP).\n\nSNMP deﬁnes an Agent, located on the VAS platform in this\
    \ case, communi-\n\ncating with an external Network Management System (NMS), which\
    \ is shared by \n\nmany network systems (e.g., access network, core network, VAS\
    \ platforms). The \n\nAgent can eventually be split up as a Master Agent and Subagents,\
    \ each responsible \n\nfor a particular subsystem.\n\nThe Management Information\
    \ Base (MIB) deﬁnes the objects being managed \n\nand their properties. For a\
    \ VAS platform, the quality and documentation of a MIB \n\nis an indicator for\
    \ the quality of supervision to be expected (does it cover the soft-\n\nware components?).\n\
    \nToday, in practice TMN compatibility means that a VAS platform and the \n\n\
    applications should be supervised or managed by 5 functions:\n\nFault management:\
    \ alarms of various severity levels are sent by the Agent to \n\nthe NMS, as SNMP\
    \ Traps. An important role of the NMS is to correlate \n\nalarms produced by diﬀerent\
    \ network systems, and consecutive alarms \n\nproduced repeatedly, to be due to\
    \ a single event."
  merge: -1
  pgno: 136
