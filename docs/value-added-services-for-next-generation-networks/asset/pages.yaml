  md: "*g*\n\n*g*\n\na URI’\\*), which would respond with SIP 301 “Moved Permanently,”\
    \ returning a \n\nContact:^† leading to the actual NGNSP^‡.\n\nThat SIP URI resolution\
    \ service could be operated independently, or be part of \n\na real NGNSP (i.e.,\
    \ carrying media too, according to our deﬁnition in Section 3.1).\n\nIt may even\
    \ be developed as a peer-to-peer SIP (P2PSIP) service, ultimately redirect-\n\n\
    ing the user agent’s request to the physical server responsible for the requested\
    \ URI.\n\nMultiple technical options are thus available for the selection of a\
    \ NGNSP.\n\nWhatever option is taken by user agents and people distributing them\
    \ (we’ll \n\ntalk about distribution in the next section), the advertising and\
    \ discovery of NGN \n\nnetworks boils down to a quite simple question: will existing\
    \ name resolution algo-\n\nrithms and processes (e.g., DNS, SIP) be able to discover\
    \ the *best* NGNSP for a \n\ngiven destination address?\n\nEarly attempts to answer\
    \ this question had resulted in TRIP (Telephony Rout-\n\ning over IP, RFC 3219,\
    \ 2002), a routing protocol to advertise the reachability of \n\ntelephony destinations\
    \ (E.164 numbers and ranges), independently of the applica-\n\ntion (signaling\
    \ and media) ultimately used to reach those destinations. By listening \n\nto\
    \ TRIP updates from neighbors, a NGN network element can construct a Tele-\n\n\
    phony Routing Information Base (TRIB): a database of both internal media paths\
    \ \n\nwithin the IP Telephony Administrative Domain (ITAD) and external media\
    \ paths \n\nto diﬀerent ITADs.\n\nDNS is of course the general name resolution\
    \ protocol used by most Internet \n\napplications to reach a destination address.\
    \ Therefore, the IETF also undertook the \n\ntElephone NUmber Mapping eﬀort (ENUM,\
    \ RFC 3761, 2004) recommending \n\nthe use of DNS to obtain Naming Authority Pointer\
    \ Resource (NAPTR) records, \n\ncontaining the various URIs (e.g., Universal Resource\
    \ Information for SIP, e-mail, \n\nclassic telephony, instant messaging) in order\
    \ to reach a given destination telephone \n\nnumber (in the format 8.7.6.5.4.3.2.1.8.7.9.1.e164.arpa.).\n\
    \nHowever, whether we use TRIP or ENUM to resolve destination NGN \n\naddresses,\
    \ it will always result in media streams (RTP packets) being routed directly \n\
    \nto the ﬁnal NGNSP (recipient operator) “owning” the destination user.\n\nIndeed,\
    \ the destination-based forwarding paradigm results in the most speciﬁc \n\nroute\
    \ being used. If an intermediate NGN provider has advertised to be capable \n\n\
    to route the entire number range 1978XXXXXXX, but the ﬁnal NGN provider \n\nadvertises\
    \ to be responsible for the range 1978123XXXX, both TRIP and ENUM \n\nwill result\
    \ in the ﬁnal NGN provider being selected.\n\nRTP packets will thus be routed\
    \ end-to-end, from the originating NGN pro-\n\nvider’s border gateway to the public\
    \ IPv4 address of the ﬁnal NGN provider’s bor-\n\nder gateway, along a route discovered\
