  md: "At the PHY layer, WiMAX is in fact a whole family of Broadband Wireless \n\n\
    Access (BWA) technologies:\n\nWirelessMAN-SC¢ (“Single Carrier”; Wireless MAN\
    \ SCa¢ single car-\n\nrier advanced): in the 10 to 66 GHz frequency band, wavelength\
    \ is short \n\n(3 cm to 4.5 mm), hence multipath reﬂections against buildings\
    \ and the \n\nlandscape are negligible, so Line-Of-Sight transmission (LOS) is\
    \ required. \n\nThe transmitter and the receiver need “see” each other. With a\
    \ channel \n\nbandwidth of 25 MHz, raw data rates in excess of 120 Mbit/s can\
    \ be \n\nobtained.\n\nIn the frequency band up to 11 GHz, reﬂections are signiﬁcant,\
    \ Non-Line-\n\nOf-Sight (NLOS) or near-line-of-sight operation is possible, but\
    \ interfer-\n\nence appears (i.e., receiving two signals with the same frequency\
    \ from two \n\ntransmitters). So either the available spectrum needs to be allocated\
    \ in \n\nslices to individual operators (licensed mode), or the power at which\
    \ these \n\noperators transmit needs to be limited (unlicensed mode, primarily\
    \ in the \n\n5–6 GHz band). In the latter case also, speciﬁc collision avoidance\
    \ mecha-\n\nnisms such as Dynamic frequency Selection (DFS) may be imposed by\
    \ \n\nthe national regulator. Below 11 GHz, either in licensed or in unlicensed\
    \ \n\nmode, there are three options for the PHY layer:\n\nWirelessMAN-OFDM¢ (“Orthogonal\
    \ Frequency Division Multiplex-\n\ning”): OFDM is a transmission technology where,\
    \ using a channel band-\n\nwidth BW (e.g., of 5MHz) centered around a carrier\
    \ at frequency *f**c* (e.g., \n\n2302.5 MHz), 200 orthogonal subcarriers (e.g.,\
    \ spaced 22266 Hz from \n\neach other) are used to transmit a set of 200 complex\
    \ numbers ck during \n\none Symbol time Tb (1/22266 Hz  45 μs in this case). If,\
    \ for example, c13\n\nis zero, it means that bit 13 (out of 200) is zero. The\
    \ 200 bits transmitted \n\nduring Tb are visually represented as a QAM\\* constellation\
    \ (dots on a grid, \n\neither lit or dark). Besides these 200 frequencies, as\
    \ 256 is the smallest \n\npower of 2 above 200, 56 frequencies are used as a “guard\
    \ band” transmit-\n\nting zero Voltage, in order not to interfere with the next\
    \ channel (e.g., 2305 \n\nto 2310 MHz).\n\nThe transmitter uses an Inverse Fourier\
    \ Transform (IFT) from frequency \n\nto time domain, in order to derive the voltage\
    \ being sent to the ampliﬁer \n\nand the antenna.\n\nWhen the receiver applies\
    \ a Fast Fourier Transform on the signal, it recal-\n\nculates these 200 complex\
    \ numbers ck, and if they haven’t moved too \n\nmuch, meaning if the QAM constellation\
    \ dots were suﬃciently apart, \n\ndiscovers the correct value of the 200 bits.\n\
    \nThe bandwidth eﬃciency in this simple but realistic example is 200 bits r\n\n\
    22266 Hz  4.453 Mbit/s, over 5 MHz bandwidth, thus almost one bit/s \n\n\\* Quadrature\
    \ Amplitude Modulation.\n\nN\n\nN"
