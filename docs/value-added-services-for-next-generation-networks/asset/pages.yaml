  md: "SIP AS for real-time charging (in Stateful Proxy mode).\n\nFMC server for voice\
    \ call continuity (in B2BUA mode).\n\nMedia Server, controllable by VoiceXML and\
    \ SIP.\n\nAn XMPP or SIP/SIMPLE IM and presence server.\n\nAn SMS/MMS gateway.\n\
    \nSome of these items are today addressed by TISPAN, of which we’ll review the\
    \ \n\nwork in Section 3.5.\n\n**3.4**\n\n**3GPP2**\n\nThe 3rd Generation Partnership\
    \ Project 2 was established in 1998, as a cooperation \n\nbetween standards institutes\
    \ from Japan, China, North America, and South Korea.\n\n3GPP2 is today driving\
    \ the CDMA2000 family of packet-based technologies, \n\nas the successor to 2G\
    \ CDMA (cdmaOne, TIA IS-95), and in analogy with 3GPP \n\ndriving the evolution\
    \ of GSM.\n\nWithin the CDMA2000 family, multiple generations of mobile wireless\
    \ cel-\n\nlular technologies were born: 2.5G-2.75G (CDMA2000 1x) and 3G (CDMA2000\
    \ \n\n1x EV-DO\\*).\n\nOn top of these radio access technologies, and besides\
    \ the circuit-switched core \n\nnetwork, 3GPP2 developed a packet-based core network\
    \ similar to 3GPP GPRS. \n\nIt consists mainly of Packet Data Serving Nodes (PDSN,\
    \ the equivalent of 3GPP’s \n\nSGSN) and the Home Agent (HA, the counterpart of\
    \ 3GPP’s GGSN).\n\nContrary to 3GPP, 3GPP2 adopted IETF’s Mobile IP protocol,\
    \ allowing the \n\nHA to track a subscriber’s mobility across a set of PDSN.\n\
    \nBut on top of this core network, 3GPP probably made a strategic mistake not\
    \ to \n\nadopt the IMS, and ended up specifying their own MultiMedia Domain (MMD).\n\
    \nAlso, 3GPP2 does not have the market power to develop an FMC strategy, to \n\
    \nlet this MMD span ﬁxed access networks too.\n\nIt is not the ﬁrst time that\
    \ 3GPP2 would deﬁne a technology that would stall \n\ndue to lack of implementation\
    \ and adoption (e.g., CDMA2000 1x EV-DV^†).\n\n**3.5**\n\n**TISPAN**\n\nETSI has\
    \ bundled its Next Generation Network eﬀorts in the Telecommunications \n\nand\
    \ Internet Converged Services and Protocols for Advanced Networking (TIS-\n\n\
    PAN) “one-stop-shopping” working group, a merger of the former groups:\n\nNetwork\
    \ Aspects (NA)\n\nSignaling Protocols and Switching (SPS)\n\n\\* Evolution for\
    \ Data Only, or “Data Optimized,” TIA IS-856.\n\n† Evolution for Data and Voice,\
    \ of which Qualcomm halted the development in 2005."
