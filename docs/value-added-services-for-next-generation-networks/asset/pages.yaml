    \ still packetized voice) over managed quality networks, \n\nin case low voice\
    \ quality is detected. Skype might submit these calls to gateways, \n\nwhose performances\
    \ (traﬃc handled and voice quality increase) would be assessed \n\nand rewarded\
    \ (e.g., in the form of SkypeOut credit). Voice quality could be mea-\n\nsured\
    \ technically (e.g., in terms of packet loss, latency, jitter) but also by a network\
