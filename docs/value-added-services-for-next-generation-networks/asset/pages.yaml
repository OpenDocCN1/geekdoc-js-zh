  md: "In practice it is not easy to deﬁne open interfaces between these, so the three\
    \ func-\n\ntions should remain combined in a same “charging system.”\n\nThe timeliness\
    \ and speed of this interaction is described in terms as “real-time,” \n\n“hot,”\
    \ “warm,” “cold,” but the truly important distinction is “online” versus “oﬀ-line.”\n\
    \nIn online charging, the network consults the charging system prior to delivering\
    \ \n\nthe service, and asks for permission and for credit (in nonmonetary units).\n\
    \nIn oﬀ-line charging, the network informs the charging system that the service\
    \ \n\njust got delivered.\n\nHistorically the online approach has been more suitable\
    \ for user charging \n\n(retail), as it avoided any fraud in conjunction with\
    \ prepaid payment methods. \n\nWith oﬀ-line charging, prepaid services could be\
    \ delivered while the charging sys-\n\ntem would notice afterwards that the balance\
    \ was too low to pay for these. The \n\nservices (calling, texting) would then\
    \ have to be deprovisioned in the network, and \n\nreprovisioned after top-up.\n\
    \nAnd the oﬀ-line approach was preferred for inter-operator accounting (whole-\n\
    \nsale), as the network could pass more information to the charging system (trunk\
    \ \n\ngroup being used for the outbound or inbound call) than through the online\
    \ charg-\n\ning interfaces.\n\nThis has lead to a few industrial camps and matching\
    \ departments within the \n\noperators: “Service Nodes” / “Prepaid IN” for online\
    \ charging; and “Billing Media-\n\ntion”  “Billing Support Systems” for oﬀ-line\
    \ charging.\n\nToday there’s no technical nor economic justiﬁcation anymore to\
    \ use oﬀ-line \n\ncharging for postpaid (contract) users — except maybe risk sharing.\
    \ Online charg-\n\ning systems can and should charge every user whether prepaid,\
    \ postpaid, credit \n\nlimited postpaid or single use (e.g., a calling card).\n\
    \nThe online charging approach remains the ideal target method if it could \n\n\
    address inter-operator accounting.\n\nHowever, today we see little evidence that\
    \ the online charging interface of the \n\nnext generation network will support\
    \ this.\n\n**5.4**\n\n**Rating**\n\nRating is the process of letting the charging\
    \ process interact with the accounts system \n\nand the product catalog to determine\
    \ the price of a communications event.\n\nIn general, it happens within the communication\
    \ service provider’s online or \n\noﬀ-line charging system. Alternatively, a third\
    \ party could perform rating if it has \n\nits own product catalog (see Section\
    \ 5.12) but let’s for the moment set aside this \n\npossibility. All interaction\
    \ between the network and the charging process is based \n\non nonmonetary units.\n\
    \nAs an online/oﬀ-line charging process, a product catalog or an accounts data-\n\
    \nbase cannot be described in a generic way, it is also diﬃcult to describe the\
    \ rating \n\nprocess."
