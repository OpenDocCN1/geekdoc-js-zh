  md: "**7.1**\n\n**Media Pilot**\n\nMobile service providers and device manufacturers\
    \ have been struggling for a long \n\nwhile to bring the Internet browsing or\
    \ TV experience to a handheld device, and \n\nthey still do. The network infrastructure\
    \ is capable of delivering these services, \n\nbut the relatively tiny screens\
    \ on cell phones and absence of keyboard remove the \n\npleasure from browsing.\
    \ And a convincing digital TV experience starts with fast \n\nchannel ﬂicking.\n\
    \nThe idea here is to start using the NGN device (e.g., IP phone, SIP softphone)\
    \ \n\nas a controller for the media experience (browsing or digital TV). These\
    \ devices are \n\nvery likely to include a keypad, so let’s try and use that one\
    \ to control which link \n\nis clicked on a Web page, whether the movie needs\
    \ to play, pause, fast forward, the \n\nmovements of a character in an online\
    \ game, and so forth.\n\nWith circuit-switched telephony it would have been inconceivable\
    \ to set up a \n\ncall and pass DTMF digits (the tones corresponding to key strokes)\
    \ in-band to the \n\nTV station — let alone that the TV station would in those\
    \ days have been able to \n\nprovide video or games on demand to individuals.\n\
    \nNGN technology has removed both barriers. The new economics of NGN net-\n\n\
    works imply that sessions are allowed to last much longer than circuit-switched\
    \ calls \n\nused to be. An NGN user agent has four methods at its disposal to\
    \ pass DTMF \n\ninformation to the network (we listed them in Section 4.7.7);\
    \ whether the keypad \n\nstrokes travel as SIP signaling (INFO, NOTIFY) or in\
    \ RTP packets doesn’t matter \n\n(at ﬁrst sight).\n\nSecond, the NGN allows emitting\
    \ personalized video and audio streams to the \n\nend user, using standard encoding/decoding\
    \ mechanisms. The conversion of Web \n\npages, analog, digital TV channels and\
    \ games to H.263 and H.324M encoded \n\nvideo, plus the injection of, for example,\
    \ a pointing arrow in the picture is an \n\nimportant, resource-intensive task.\n\
    \nSo it becomes possible for the media pilot, this new NGN VAS provider, to col-\n\
    \nlect these upstream keystrokes, look up the originating user’s proﬁle, and pilot\
    \ the \n\ndownstream media experience accordingly. A media pilot thus browses\
    \ the Web, \n\nﬂicks the TV channels or inputs moves to an online game on behalf\
    \ of the end \n\nuser. It transforms the results (highlighted Web links, the next\
    \ Web page, a paused \n\nmovie, a personal settings menu, etc.) to the device\
    \ chosen by the end user as NGN \n\nmedia streams or even digital TV.\n\nPressing\
    \ “1” on the keypad means clicking that link on the top left corner of the \n\n\
    Web page. Pressing “2” means moving the pointing arrow northbound. Pressing \n\
    \na “5” in the middle of the keypad is used to pause or resume a movie on demand.\
    \ \n\nPressing a “4” means the snowboarder moves to the left in the game. Pressing\
    \ “6” \n\ncould make a home surveillance camera turn right. Pressing “8” while\
    \ navigating \n\nGoogle Earth on your TV will make the image tilt so you can see\
    \ the horizon."
