  md: "Ideally, packages should be installed well in advance, without removing the\
    \ \n\ncurrent components and versions being used in production.\n\nThe VAS platform\
    \ would then include a version management and activation \n\nprocess allowing\
    \ traﬃc (and screens, provisioning commands, etc) to be switched \n\nfrom one\
    \ version of a component to a next one. In fact, allowing the components \n\n\
    of an entire package to exist in multiple versions, installed simultaneously on\
    \ the \n\nsame platform.\n\nTo avoid excessive backwards compatibility requirements,\
    \ all components of a \n\nsingle package should be brought into production at\
    \ once, but this is sometimes not \n\neasy. Imagine the simultaneous traﬃc, subscriber\
    \ data, and provisioning screens \n\nmigration during a major upgrade. Should\
    \ a new version of the subscriber manage-\n\nment screens (or provisioning commands)\
    \ be made compatible with the previous \n\nversion of the database structures?\n\
    \nThe support of multiple versions running in parallel on a VAS platform remains,\
    \ \n\nin practice, a noble objective to achieve. One with major beneﬁts in terms\
    \ of opera-\n\ntional expenses, but only to be realized for software patches and\
    \ updates (not for \n\nminor and major upgrades).\n\n**6.17**\n\n**Licensing**\n\
    \nSoftware licensing is an extensive area covering technical aspects (e.g., what\
    \ is \n\nallowed to be used, how frequently, how to measure) but also commercial,\
    \ contrac-\n\ntual and legal aspects.\n\nIs a license granted for a package, for\
    \ a software product (consisting of multiple \n\npackages), or for a solution\
    \ (a combination of products)?\n\nWhat happens, for example, when an operator\
    \ using the software license is \n\nacquired by a parent company also using the\
    \ same product, but in a diﬀerent ver-\n\nsion? Are the two licenses somehow merged?\n\
    \nIn this little section let’s focus on the technical aspects, assuming that the\
    \ license \n\nis granted for a software product with a feature road map.\n\nThe\
    \ basic question is what metric will be used to identify the usage of the soft-\n\
    \nware product:\n\nSite-wide license: this unlimited usage will usually be aﬀordable\
    \ by very \n\nlarge corporate organizations.\n\nDuration for which the license\
    \ is required: a free test or evaluation license \n\nmay be granted for a limited\
    \ period.\n\nNumber of CPUs of the servers on which the product is installed:\
    \ unfair if \n\nonly some components are installed on some servers (front end\
    \ Service \n\nCapability servers) and other components on diﬀerent ones (back\
    \ end \n\nApplication Servers). Also unfair if the software is deployed on NM\n\
    \nservers for redundancy. And this scheme doesn’t oﬀer an incentive to the"
