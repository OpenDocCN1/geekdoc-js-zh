  md: "(as we reviewed in Section 3.3.2), but assumes an IMS at either end of the\
    \ com-\n\nmunication and no intermediate service providers. End users would probably\
    \ think \n\nof “uptime” when talking about quality of service.\n\nLet’s go through\
    \ a list of questions to ﬁgure out what NGNSP’s should target \n\nwhen talking\
    \ about quality.\n\nWill NGNSP’s take a defensive attitude, and let their softswitches\
    \ interrogate \n\nsome local TISPAN Resource and Admission Control Subsystem (the\
    \ RACS we \n\ndiscussed in Section 3.5) to verify whether there’s enough bandwidth\
    \ to establish \n\nthe session the customer wants?\n\nWould that be based on the\
    \ proposed media type (oﬀered SDP) or, better, on \n\nthe negotiated one?\n\n\
    Could the NGNSP then, after SDP negotiation, simply refuse to establish the \n\
    \nsession — what release cause should be invented for this and will the end customers\
    \ \n\naccept this?\n\nOr should the NGNSP, over a given IP access bandwidth, try\
    \ and demonstrate \n\nbetter end-to-end media quality (voice and video) than ISPs\
    \ currently calculating \n\nthe best IP route, by calculating the best media path?\
    \ That would be the pro-active \n\nstrategy.\n\nWho can rightfully (both commercially\
    \ and technically) claim to know the \n\nbetter next hop for media and other applications?\n\
    \nIs it the same best next hop for all applications, or could it be the NGNSP\
    \ con-\n\ntrolling the best media resources toward a list of speciﬁc destination\
    \ domains, as \n\nmeasured via RTCP XR? (Real-Time Control Protocol’s eXtended\
    \ Reports, IETF \n\nRFC 3611, brieﬂy mentioned in Section 3.2.2)\n\nOur hope is\
    \ that the best next hop will not only be a discount NGNSP oﬀering \n\nthe lowest\
    \ price regardless of quality, or a super virtual private network with the \n\n\
    best quality at an unaﬀordable price. There will be a wide palette of opportunities\
    \ \n\nbetween the extremes, if there’s an objective and independent way to assess\
    \ a qual-\n\nity increase above best eﬀort.\n\nWill specialization occur, with\
    \ some NGN providers guaranteeing bandwidth (for \n\nvideo), vs. others oﬀering\
    \ the lowest round trip delay and packet loss rate (for voice)?\n\nThese are the\
    \ questions we would need to investigate before positioning and \n\nlaunching\
    \ ngvas.com, our little NGNSP.\n\nIntuitively, one can imagine that by diverting\
    \ media (and real-time applications \n\nin general) to less occupied IP routes\
    \ than the ones calculated by the ISPs, some \n\naspects of media quality could\
    \ be improved.\n\nPeer-to-peer applications, which according to ISPs today account\
    \ for 50 to 75% of \n\nall traﬃc on the Internet, have demonstrated that by splitting\
    \ a single media stream \n\nover multiple peer relays, and recombining the streams\
    \ at the receiving end, better \n\nthroughput and quality could be obtained. Besides\
    \ for genuine communication ser-\n\nvices, peer-to-peer networks are also better\
    \ at distributing stored content (ﬁle shar-\n\ning). In fact, peer-to-peer networks\
    \ are currently “eating” the bandwidth originally \n\ndeployed to be used by client-server\
    \ applications such as browsing or email."
