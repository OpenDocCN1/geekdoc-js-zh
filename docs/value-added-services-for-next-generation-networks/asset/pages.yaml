  md: "The media industry, and more speciﬁcally broadcasting, is heading for a major\
    \ \n\nclash with the telcos and ISPs if it doesn’t embrace these standards in\
    \ the early \n\ndigital TV and radio deployments.\n\nBefore selecting a retail\
    \ or wholesale strategy for ngvas.com, or even focusing on \n\nthe corporate enterprise\
    \ segment, let’s therefore consider an important aspect of the \n\noﬀer: is ngvas.com\
    \ going to oﬀer outbound or inbound communications?\n\n**4.4**\n\n**Outbound Communications**\n\
    \nToday’s public networks and the Internet allow reaching almost any destination\
    \ \n\nnumber or address on the planet.\n\nThis has been realized through almost\
    \ a century of carrier interconnections, \n\nand twenty years of Internet service\
    \ provider peering.\n\nConveying these communications over IP, using an NGN infrastructure\
    \ and \n\npossibly an advertising overlay to improve the quality and availability,\
    \ may sound as \n\na good plan toward countries well-connected to the Internet.\
    \ But there will always \n\nbe these hard-to-reach Internet destinations, which\
    \ could easily deteriorate the per-\n\nceived overall quality oﬀered by the NGN\
    \ provider, certainly in the business and \n\ncorporate communication markets.\n\
    \nMedia gateway operators, providing the packet-to-circuit conversion toward \n\
    \nthese countries (in fact, today’s international voice carriers), should of course\
    \ also be \n\nable to advertise their termination services on the peer-to-peer\
    \ overlay. They should \n\nthen provide the same media quality metrics and advice-of-charge\
    \ information as \n\nthe “IP-only” NGN providers.\n\nIn fact, many multinational\
    \ enterprises are today using such international voice \n\ncarrier, even for internal\
    \ calls, which could be carried over the enterprise’s “own” IP \n\nbackbone. Enterprise\
    \ PBX users are today forced to dial 9 or 0 to get an outside line, \n\noften\
    \ to the local media gateway, and as soon as they do, their PBX is incapable of\
    \ \n\nrecognizing that the destination is internal (but on the other side of the\
    \ world).\n\nBy switching from a “carrying” to an “advisory overlay” role, the\
    \ international \n\ncarriers could start using these corporate IP backbones to\
    \ carry media streams. On \n\ncircuit-switching PBX sites, the media gateways\
    \ converting circuits to packets could \n\nbe operated by the carrier. The sites\
    \ where IP telephony is introduced (i.e., where a \n\ncommercial or open source\
    \ IP PBX is deployed to replace the legacy PBX) can be \n\nused as a transit points\
    \ for signaling and media.\n\nWith the necessary security precautions, and under\
    \ responsibility of a trusted \n\nNGNSP, the media streams of enterprise A could\
    \ even make use of the softswitches \n\nand media relays of enterprise B, and\
    \ vice versa.\n\nInitially both enterprises A and B should probably be customers\
    \ of a single NGNSP; \n\nlater, NGN peering agreements will appear between competing\
    \ NGNSPs.\n\nOne can see a scheme where not only service providers and carriers,\
    \ but also \n\nenterprises are rewarded for their contribution to the NGN maze."
