  md: "control, resource control, and border gateways, to set up an executive video\
    \ com-\n\nmunication to the employees.\n\nLast but not least, the diagram also\
    \ highlights the fact that, besides oﬀering \n\nnew online transactional capabilities,\
    \ a BSS needs to continue invoicing end users \n\nbut also third parties (PSTN/ISDN,\
    \ Enterprises, Other NGNSP and the ASP) for \n\nthe usage of the communication\
    \ infrastructure.\n\n**4.9**\n\n**Conclusion**\n\nWe are arriving at the end of\
    \ our chapter, so let’s summarize our reasoning and \n\nﬁndings, while trying\
    \ to engineer our NGN.\n\nWe started from a long list of questions to be answered\
    \ in the business plan of \n\nngvas.com, our hypothetical little NGNSP.\n\nWe\
    \ discussed the need for NGNSPs to advertise their media quality and price \n\n\
    toward certain destinations, hence to be automatically discovered by other NGNSPs\
    \ \n\nand end users, in a worldwide jungle of competitors.\n\nThis situation calls\
    \ for an advertising overlay, an independent organization in \n\nwhich the quality\
    \ metrics and price information could be exchanged in real time — \n\nthe “stock\
    \ exchange” function of the NGN.\n\nWith business models moving from retail to\
    \ wholesale, NGNSPs will have \n\nto use a new form of subtle, thin distribution,\
    \ which boils down to convincing \n\nthe established IM players to add the standard\
    \ protocols in their client soft-\n\nware. Indeed, blunt linking of an IM client\
    \ or device to a given service provider \n\n— linking iPods to iTunes — will not\
    \ be tolerated by the market much longer.\n\nAn idea for diﬀerentiation is for\
    \ NGNSPs to focus either on outbound commu-\n\nnications (thus charge end users\
    \ and enterprises), or on inbound communications \n\n(thus live from interconnect\
    \ revenue only).\n\nThe cornerstone of each NGN strategy should be NGN peering,\
    \ rather than \n\nTDM interconnection. TDM trunking and access are best left to\
    \ specialized \n\nplayers — probably today’s ILECs and IXCs.\n\nA new, dedicated\
    \ network element has appeared for this purpose — the Session \n\nBorder Controller.\n\
    \nSBCs could also play a role in allowing third party Application Service Provid-\n\
    \ners to be interconnected to the NGN, though other methods exist.\n\nConsidering\
    \ the blurred distinction between ASP and other peer NGNSP, and \n\nthe need for\
    \ a uniform wholesale charging policy for both third party NGNSPs and \n\nASPs,\
    \ the SBCs are also the best option to interconnect ASPs.\n\nFinally, the ASP\
    \ requirements we examined in this chapter are a ﬁrst indication \n\nthat we should\
    \ take a closer look at the charging and rating requirements for new \n\ncommunication\
    \ means, which is the topic of our next Chapter 5.\n\nAfter that, we’ll take a\
    \ dive into the technical architecture of VAS platforms, to \n\nengineer the Service\
    \ layer properly in Chapter 6."
