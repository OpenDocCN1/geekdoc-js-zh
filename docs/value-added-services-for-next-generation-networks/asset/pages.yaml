  md: "**95**\n\n***Chapter 5***\n\n**Charging and Rating **\n\n**Requirements for\
    \ New **\n\n**Communication Means**\n\nAs the CFO of our ngvas.com NGNSP would\
    \ say, of course it is required to develop \n\ntariﬀ plans and payment methods,\
    \ for either true communication services or for the \n\ntransmission of stored\
    \ media.\n\nBut tariﬀ plans alone should not become the primary concern of a communica-\n\
    \ntion service provider’s marketing department. The excess of creativity in this\
    \ area \n\nresults in a general sentiment of unfairness and alienation, rather\
    \ than in a trusted \n\nand valued brand. The initial early adopters do not switch\
    \ to the new tariﬀ plans, \n\npromotions and payment methods, and feel left behind.\n\
    \nAnd the name of the game is customer ownership. Once this high quality cus-\n\
    \ntomer relationship is created (the “account”), several services may be sold\
    \ through \n\nit: connectivity, communication services, and even content, physical\
    \ goods and \n\nother services than communication.\n\nInventing and implementing\
    \ charging and billing schemes for too many of \n\nthese could eventually again\
    \ turn into a digression.\n\nThe purpose of this chapter is not to make a sterile\
    \ overview of charging and \n\nrating systems used by today’s communication service\
    \ providers, nor to try and \n\ncompare them or provide migration advice. The\
    \ fact that the world is moving to \n\nreal-time rather than batch processing,\
    \ for example, is an example.\n\nLet’s ﬁrst try and build a set of essential deﬁnitions,\
    \ and then examine the likelihood \n\nfor future communication means to require\
    \ a product catalog, charging, rating, meter-\n\ning, advice of charge, redirection,\
    \ billing, promotions, openness and/or correlation."
