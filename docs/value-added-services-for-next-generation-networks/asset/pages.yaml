  md: "OK, service marketing is quite diﬀerent from the marketing of Fast Moving Con-\n\
    \nsumer Goods, and requires an extended marketing mix adding three P’s (People,\
    \ \n\nProcess and Physical evidence). The right (sales) people would apply well-oiled\
    \ pro-\n\ncesses and demonstrate physical evidence (though free trials, previews,\
    \ etc). In viral \n\nmarketing, the sales people can be the VAS users themselves.\n\
    \nSome of these Ps would certainly inﬂuence technical solutions, and as such,\
    \ \n\nVAS engineering and marketing would march hand in hand.\n\nThis entire approach,\
    \ however, remains end user centric. According to such \n\napproach, very heteroclitic\\\
    * VAS could be developed at any cost, well in advance of \n\ndemand, and independently\
    \ of legacy infrastructure and services — as long as they \n\nwould be well targeted\
    \ at certain market segments.\n\nTo my opinion, there are multiple potential stakeholders\
    \ in the success of a \n\nVAS, besides residential, business and corporate communication\
    \ consumers:\n\nThe communication service providers themselves, who need to capitalize\
    \ \n\non past investments, that is, in PSTN or GSM networks; as such, the \n\n\
    new VAS should span diﬀerent networks by nature\n\nApplication service providers,\
    \ who are going to compare the NGN ver-\n\nsion of a VAS to the non-NGN (Internet-only)\
    \ version — IM/VoIP \n\nproviders, for example, are today not the demanding party\
    \ for NGN \n\nstandardization\n\nRegulators and governments, who are looking at\
    \ widely adopted services \n\nbut lack of control — are lawful interception, emergency\
    \ calling, carrier \n\nselection and number portability going to be supported\
    \ for these new \n\ncommunication means?\n\nAdvertisers, a party which has propelled\
    \ many Internet service business \n\nmodels, but seems to be absent from today’s\
    \ telecom services\n\nDevice manufacturers, who are sometimes not convinced of\
    \ the need to \n\nuse communication rather than storage and computing (remember\
    \ our \n\ndiscussions in Sections 1.2 and 1.3)\n\nCommunities, who need to beneﬁt\
    \ from these VAS, sometimes even \n\nagainst the interest of individual consumers\
    \ — for example, the com-\n\nmunity moderator should be able to refuse new members,\
    \ scan content, \n\nand block end users.\n\nThe telecom/IT sector in general,\
    \ which cannot support another wave of \n\nfailing hypes after the mobile data\
    \ bubble in the early 2000s\n\nWe could even extend the list of stakeholders to\
    \ the investors, workforce, and sup-\n\npliers of these organizations.\n\nMany\
    \ of these parties deserve to be treated as customers, but they haven’t been \n\
    \nin the past, in many examples.\n\n\\* Diﬀerent and incoherent."
