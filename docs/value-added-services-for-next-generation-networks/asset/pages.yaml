    \n**4.5**\n\n**Inbound Communications**\n\nPerhaps without noticing, we have looked\
    \ at NGN advertising, media quality and \n\ndistribution from the angle of outbound\
    \ communications.\n\nIn the 1980s, International Voice Carriers (IVC) started\
    \ their business by pro-\n\nviding outbound international and long distance telephony\
    \ service to enterprises. \n\nThe incumbent PTT would continue to deliver the\
    \ inbound calls to the E.164 \n\nnumbers, that is, over ISDN Primary Rate Interfaces\
    \ (PRI) to the PBX.\n\nThroughout the 1990s, even through new access technologies\
    \ appeared to \n\nbridge the last mile (e.g., microwave transmission), and the\
    \ carriers were rolling \n\nout their metropolitan, national and international\
    \ glass ﬁber loops, the intercon-\n\nnect revenues the alternative carriers could\
    \ receive would not justify handling the \n\ninbound communications to the enterprises.\
    \ Besides transmission, the cost of the \n\ndigital telephony exchanges (switching)\
    \ would also be a show stopper.\n\nCompetitive Local Exchange Carriers (CLEC)\
    \ and Local Number Portabil-\n\nity (LNP) were introduced by the US Telecommunications\
    \ Act of 1996. But even \n\nthen, CLECs would have to lease digital exchange capacity\
    \ from the Incumbent \n\nLEC (ILEC) and thus would not be able to introduce lower-cost\
    \ switching technol-\n\nogy (NGN). Local Loop Unbundling (LLU) — where a CLEC\
    \ only has to lease \n\nnaked copper pairs from the ILEC — was only introduced\
    \ in the early 2000s in \n\nadvanced markets (2003 in the U.S.).\n\nLLU and DSL\
    \ standardization have permitted the emergence of aﬀordable \n\nbroadband IP connectivity,\
    \ together with new access technologies such as Cable, \n\nWiFi and WiMAX.\n\n\
    Now residential users and businesses can enjoy aﬀordable broadband IP access,\
    \ \n\nand with the emergence of VoIP technology and devices, new providers are\
    \ taking a \n\nfresh look at inbound communication handling. The telephony interconnect\
    \ revenue \n\nis low per minute, and the cost of interconnection is not negligible,\
    \ but the avail-\n\nable broadband capacity for VoIP termination is high. The\
    \ added value is high too: \n\ncall centers can now be centralized and located\
    \ anywhere, taking inbound calls col-\n\nlected on local E.164 numbers in dozens\
    \ of countries. And the opportunity to provide\n\npresence-based VAS is looming\
    \ — the basic force we discussed in Section 1.8.\n\nHence a new type of communication\
    \ service provider has appeared in the mid-\n\n2000s: the Inbound Communications\
    \ Handler (ICH), operating TDM-to-VoIP"
