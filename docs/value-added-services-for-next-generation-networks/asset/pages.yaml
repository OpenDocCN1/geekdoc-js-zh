  md: "OMA is seriously addressing messaging services with the Multimedia Messag-\n\
    \ning Service (MMS) and Instant Messaging and Presence Service (IMPS), today \n\
    \nwidely implemented on mobile phones, in frontal competition with IETF’s XMPP,\
    \ \n\nwith Jabber and of course IM provider-speciﬁc protocols.\n\nOMA Data Synchronization\
    \ and Device Management are deﬁned using the \n\nsyncML (synchronization Markup\
    \ Language).\n\nFurther, there’s a standard for mobile broadcasting (BCAST).\n\
    \nOMA is today the best promoter of GSM/GPRS/UMTS mobile data services \n\nand\
    \ matching handsets, but will this model prevail over the TISPAN NGN or — \n\n\
    even more diﬃcult — the wide open Internet?\n\n**3.9**\n\n**Summary**\n\nIn this\
    \ chapter we started from a layered deﬁnition of the NGN, and after having \n\n\
    reviewed the work of the most relevant standardization organizations one by one,\
