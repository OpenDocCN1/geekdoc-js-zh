  md: "There are two categories of IP routing protocols: Interior Gateway Protocols\
    \ \n\n(IGP) to be used within an administrative domain (AS: “Autonomous System”;\
    \ e.g., \n\nan ISP), and Exterior Gateway Protocol (EGP) for use on inter-AS interfaces.\n\
    \nWithin the IGP, distance-vector routing protocols (e.g., Routing Information\
    \ \n\nProtocol, RIPv2, RFC 2453) advertise routing information as the distance\
    \ to a \n\ndestination IP address range, but each router is unaware of the network\
    \ topology. \n\nThe propagation of new routing information can be quite slow.\
    \ With link-state \n\nrouting protocols (e.g., Open Shortest Path First, OSPFv2,\
    \ RFC 2328), each router \n\nhas the same link-state database describing the entire\
    \ network topology of the AS: \n\n“Autonomous System,” administrative domain).\
    \ Link-State Advertisements (LSA), \n\nwhen broadcast throughout the AS, can form\
    \ quite some overhead traﬃc. There-\n\nfore, both distance-vector and link-state\
    \ routing protocols are not suitable on inter-\n\nAS interfaces.\n\nThe most commonly\
    \ used EGP is the Border Gateway Protocol (BGP-4, origi-\n\nnally RFC 1105, now\
    \ RFC 4271, 2006), suitable for use on inter-AS interfaces.\n\nTRIP is based on,\
    \ and very similar to BGP-4. The Autonomous Systems (AS) \n\nof BGP-4 correspond\
    \ to IP Telephony Administrative Domains (ITAD) in TRIP. \n\nWhere BGP-4 lets\
    \ IP routers advertise NEXT\\_HOPs, TRIP lets location servers \n\n(LS) advertise\
    \ NextHopServers.\n\nBGP-4 and TRIP share the same fundamental limitation: the\
    \ inability for the \n\noriginating service provider to select a transit AS resp.\
    \ ITAD in order to reach a desti-\n\nnation AS/ITAD, *if* the originating service\
    \ provider has received routing information \n\nconcerning the destination AS/ITAD.\
    \ This is of course often the case.\n\nIn summary, today it’s fair to state that\
    \ NGNSPs are blind for media qual-\n\nity metrics, and are unable to select transit\
    \ NGNSPs objectively oﬀering better \n\nmedia quality to reach a given destination.\
    \ The existing query/response proto-\n\ncols (SIP, DNS and ENUM) or telephony\
    \ routing protocol (TRIP) could be \n\nused to communicate better next hops, but\
    \ the oversight is missing. The result \n\nis that media compete for bandwidth\
    \ with less critical applications on the same \n\nIP routes. The situation is\
    \ comparable to what aviation must have been before the \n\nbirth of Air Traﬃc\
    \ Control.\n\nThere appears thus to be a need for a new intelligent overlay, that\
    \ would be \n\naware of the media resources, throughput and quality in the media\
    \ and border \n\ngateways layer, and able to return better next hops when queried\
    \ by the session \n\ncontrol layer.\n\nOn a busy Friday afternoon, the media stream\
    \ from Alice in Atlanta to Carl in \n\nChicago, and the backwards stream, should\
    \ perhaps be routed like this:\n\nCould ngvas.com also be launched as such “advertising\
    \ overlay,” not conveying the \n\nactual media streams, and not even the session\
    \ establishment signaling?\n\nIt looks like an attractive perspective, but either\
    \ ngvas.com would have to build \n\nits own network of probes, permanently making\
    \ test calls using various providers to \n\nvarious destination domains; or, more\
    \ realistically, there needs to be a mechanism"
