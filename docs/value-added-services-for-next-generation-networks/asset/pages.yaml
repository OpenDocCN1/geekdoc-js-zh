  md: "*g*\n\n*g*\n\nto obtain objective information from the existing NGNSPs, who\
    \ in turn are relying \n\non IP service providers — the transport layer.\n\nSo\
    \ in the next section, let’s start from what should be the ﬁrst concerns of \n\
    \nany NGN communication service provider: how to provide media throughput and\
    \ \n\nquality over third party IP networks and the public Internet?\n\n**4.2**\n\
    \n**The Quest for Throughput and Quality**\n\nMuch has been said about quality\
    \ of service (QoS) and, as for security, these topics \n\nare too large to be\
    \ treated from a single angle.\n\nAlso, it means something else to diﬀerent parties.\
    \ ISPs would think in terms of \n\nresource reservations along an IP route, prioritizing\
    \ speciﬁc IP packets within each \n\nrouter, labeling packets using MPLS, providing\
    \ virtual private networks, and so \n\nforth. The 3GPP IMS, another example, promises\
    \ “end-to-end” QoS enforcement \n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_83_0.png)\n\
    \n**Figure 4.3**\n\n**Media streams avoiding a congested zone of the Internet.**"
