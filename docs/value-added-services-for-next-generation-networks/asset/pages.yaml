  md: "*g*\n\n*g*\n\nWhen an originating user agent sets up a session (SIP INVITE),\
    \ it includes its \n\nown address as the Origin (“o” parameter) of the Session\
    \ Description Protocol \n\n(SDP) oﬀer. If it hasn’t performed any STUN/TURN query,\
    \ that address is inter-\n\nnal, unreachable by the NGNSP, for downstream media\
    \ toward that user agent. If \n\nthe user agent did the STN/TURN query, the address\
    \ in there might be good. In \n\ngeneral, from the NGNSP’s perspective, it is\
    \ thus unreliable.\n\nMedia latching is a principle whereby the SBC ignores that\
    \ address information \n\nin SDP, but monitors the source IP address and port\
    \ of the upstream RTP packets, \n\nin order to determine the destination IP address\
    \ and port of downstream RTP pack-\n\nets. It is a continuous process, not only\
    \ occurring just after session establishment.\n\nTo speak in TISPAN and H.248\
    \ terms, the Border Control Function (BCF) \n\nshould be able to instruct the\
    \ Border Gateway Function (BGF) to ignore the address \n\nit sends in the H.248.1\
    \ ADD request, but to rely on media stream latching instead.\n\n***4.7.4***\n\n\
    ***Topology Hiding***\n\nAn SBC should also include a Topology Hiding Internetwork\
    \ Gateway (THIG).\n\nThis function makes sure that the list of hosts through which\
    \ the SIP request is \n\nproxied (in the Via: and Record-route: headers) is erased\
    \ from the SIP header before \n\nsending out the message to the outside world\
    \ (untrusted or trusted access network, \n\nenterprise or peer network).\n\nThis\
    \ protects the NGN from Denial-of-Service (DoS) and Distributed Denial-\n\nof-Service\
    \ (DDoS) attacks that could be set up against the NGN core network \n\nelements\
    \ and VAS platforms.\n\n***4.7.5***\n\n***Transcoding***\n\nAs mentioned in Section\
    \ 3.6, the ITU-T and ETSI/3GPP have deﬁned several \n\naudio and voice encoding\
    \ formats.\n\nWe looked at some of them back in Section 3.6.4.\n\nThe SBC is ideally\
    \ placed to transcode the formats into each other. For example, \n\noptimal audio\
    \ quality might be realizable with the G.711 codec (64 Kbit/s) on the \n\nNGN\
    \ provider’s own backbone, but a good quality/price ratio might be obtained \n\
    \nfrom long-distance providers using G.723.1 at 5.3 or at 6.3 Kbit/s.\n\nIdeally,\
    \ the SBC would also perform transcoding for video formats and media \n\ntypes\
    \ other than voice. For example, today 3G circuit-switched video calls use the\
    \ \n\nH.324M codec, whereas most “ﬁxed” SIP-based video sessions use the H.263\
    \ or \n\nH.264 codec. If mobile users wished to participate in enterprise video\
    \ sessions one \n\nday, transcoding would be required.\n\nTransrating is the process\
    \ to adapt the packetization interval — for example, \n\nfrom 20 ms of encoded\
    \ voice in the RTP payload, to two RTP packets of 10 ms each. \n\nIndeed, the\
    \ standards organizations, national regulators, service providers and enter-\n\
    \nprises do not always seem to have come to compatible choices in that area either."
