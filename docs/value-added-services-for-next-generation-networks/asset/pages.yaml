  md: "**5.1**\n\n**Product Catalog**\n\nSince the mid 1990s, mobile service providers\
    \ have multiplied the number of new \n\n“product” oﬀers — merely corresponding\
    \ to handset subsidies and tariﬀ plans, rather \n\nthan to packages of value-added\
    \ services. It is as if petrol companies would have sub-\n\nsidized new cars,\
    \ and invented various packages containing a monthly mileage or a \n\nnumber of\
    \ gallons of fuel. Plus a higher price per extra gallon, plus a more expensive\
    \ \n\nrate if you would ﬁll your tank at competing petrol stations (roaming).\n\
    \nNew, more competitive product oﬀers were launched to grab extra market share,\
    \ \n\nwithout inviting the earlier subscribers to migrate from the old products.\
    \ This cre-\n\nated a situation with sometimes more than 100 tariﬀ plans on a\
    \ single network.\n\nIn such an environment, it is impossible to launch any new\
    \ service to the existing \n\nsubscriber base. Any new service oﬀer results in\
    \ doubling the number of products, as \n\neach product now exists in a version\
    \ without and with the new service.\n\nA well-structured product catalog should\
    \ be at the heart of any modern com-\n\nmunications company. All processes within\
    \ a communication service provider (rat-\n\ning, charging, billing but also marketing,\
    \ retail and customer care) depend on it, \n\nand should interact with it in real\
    \ time. The accuracy and quality of these processes \n\nwill depend on the quality\
    \ of the product catalog.\n\nFrom experience, communication service providers\
    \ have converged to the following \n\nelementary object model of a product catalog.\
    \ Single-headed arrows represent one-to-\n\nmany integrity relationships, double-headed\
    \ arrows are many-to-many relationships:\n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_104_0.png)\n\
    \nCommercial\n\nChannel\n\nProduct\n\nType\n\nIndividual\n\nOption\n\nUser\n\n\
    Wallet\n\n**Figure 5.1**\n\n**A simple object model of a product catalog.**"
  merge: -1
  pgno: 104
- img_proc: true
  md: "*g*\n\n*g*\n\n*g*\n\n*q*\n\nA product catalog deﬁnes the oﬀer to the end user,\
    \ in terms of product types \n\n(basic and advanced services) and additional individual\
    \ options.\n\nThe product catalog needs to include information on the compatibility\
    \ of these \n\nindividual options (mutual and with the product types). This is\
    \ illustrated by the \n\nmany-to-many relationship between product types and individual\
    \ options. One \n\nproduct type may include multiple individual options, but a\
    \ particular option may \n\noccur in several product types.\n\nThe product catalog\
    \ (product types and options) could be diﬀerent for each \n\ncommercial channel\
    \ — each organization (e.g., residential/business division, \n\nreseller, internal\
    \ test lab) selling communication services to the end users, even \n\nif technically\
    \ all channels are hosted in a single environment. Such system is also \n\ncalled\
    \ “multitenant.”\n\nHowever, having a dedicated product type for a single customer\
    \ could be one \n\nbridge too far, even toward a large corporate organization.\
    \ It is then probably better \n\nto grant tailored discounts, or maybe promotional\
    \ rates for on-net communications \n\ninside a virtual private network.\n\nTypically,\
    \ the tariﬀ being applied (e.g., activation fees, periodic subscription fees,\
    \ \n\nsource-destination combination\\*, measurement unit^†, initial charge, subsequent\
    \ charge \n\nper unit) will depend on the combination of all objects in the product\
    \ catalog:\n\nBy which commercial channel was this user acquired?\n\nWhich product\
    \ type did the user select (e.g., gold, silver, vip)?\n\nWhat individual options\
    \ did the user subscribe to (e.g., a promotional mes-\n\nsaging bundle)?\n\nWhich\
    \ wallet is the user currently using (e.g., an company’s shared wallet \n\nin\
    \ the daytime, or an individual wallet at night — see Section 5.2)?\n\nIt is thus\
    \ wrong to attach a tariﬀ plan only to a Product Type.\n\nOver time, a product\
    \ catalog is a living database and should therefore be fully \n\nversioned, indicating\
    \ the date and time of start and end (past and future dates) of \n\neach aspect\
    \ of the oﬀer, however tiny. When any oﬀer ends (product type, option), it \n\n\
    should specify the new oﬀer by which it is replaced (and to which users are thus\
    \ going \n\nto be migrated). This is often forgotten in the design of basic charging\
    \ systems.\n\nHow complex should a product catalog become? In marketing terms,\
    \ we are \n\nlooking for the perfect match between a limited number of appropriately\
    \ posi-\n\ntioned products ( price, place and promotion) for each customer segment\
    \ (deﬁned \n\nbased on their usage of the communication means). Besides the limited\
    \ number of \n\nproducts (e.g., Silver, Gold and VIP), additional individual options\
    \ may be pur-\n\nchased or simply selected by the customer (e.g., an insurance\
    \ for the cell phone, a \n\nfavorite destination country, or friends and family\
    \ numbers with lower rates).\n\n\\* From my home zone to a premium rate video\
    \ site.\n\n† Seconds, minutes, megabits, Web pages, game levels, and so on."
