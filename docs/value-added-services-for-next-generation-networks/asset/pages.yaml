  md: "The key decision when to perform that handover can be made only by the service\
    \ \n\nplane, based on presence, availability or VoIP quality measurements. But\
    \ the ser-\n\nvice plane would then need to instruct the session plane “mid-call’’/“mid-session.”\n\
    \nThird, can the 3GPP IMS session plane invite the service *selectively*, only\
    \ for \n\ncertain media types, origins or destinations (e.g., not for emergency\
    \ calls)?\n\nNext, is the 3GPP IMS session plane going to be capable of inviting\
    \ *multiple *\n\n*services* (for example, prepaid and lawful interception) for\
    \ a given session, in parallel \n\nor sequentially? Or will the SIP AS have to\
    \ proxy one to another? It’s too easy for \n\n3GPP to push out the service orchestration\
    \ issues to the service plane.\n\nIn summary, 3GPP networks do support some hooks\
    \ to the service plane, but \n\nwill need to progress in this area.\n\nFor inbound\
    \ traﬃc, communication service subscribers today demand added \n\nvalue: the convenience\
    \ to be reachable behind an expensive E.164 mobile phone \n\nnumber is not enough\
    \ anymore.\n\nIf 3GPP fails to enable the new FMC and multiplay services, in the\
    \ near future \n\nwe might well set up our calls and sessions using SIP to e-mail\
    \ addresses instead of \n\nto E.164 telephone numbers.\n\n*3.3.2.4 QoS Enforcement*\n\
    \nIn the 3GPP IMS, the P-CSCF contains a Policy Decision Function (PDF), which\
    \ \n\ncan instruct the access network node (Gateway GPRS Support Node, Mobile\
    \ IP \n\nHome Agent or Broadband Remote Access Server) to apply a given IP Quality\
    \ of \n\nService (IP QoS) via Common Open Policy Service (COPS) protocol on the\
    \ Go \n\ninterface. This is the COPS response to an initial query by the GGSN.\\\
    *\n\nIn order to understand the IMS session binding and QoS enforcement, let’s\
    \ \n\nconsider the case of an IMS session being set up between two User Entities\
    \ (UE 1 \n\nand UE 2). UE 1 is registered to the Originating IMS 1, and UE 2 to\
    \ the Terminat-\n\ning IMS 2. Therefore, a primary access channel (e.g., PDP context,\
    \ PPPoE session) \n\nmust have been created to convey the SIP signaling in IMS\
    \ 1.\n\nUpon SIP INVITE, the Originating S-CSCF as well as the Terminating S-\n\
    \nCSCF will verify that UE 1 and UE 2 are entitled to set up the media streams\
    \ \n\nproposed by UE 1 (described in the SDP, RFC 2327). Indeed, the HSS contains\
    \ \n\nthe allowed media.\n\nSIP INVITE is acknowledged hop-by-hop with a “100\
    \ Trying” provisional \n\nresponse, in order to avoid time-outs.\n\nThe PDF at\
    \ the Terminating P-CSCF produces an IMS Authorization Token \n\nand adds it in\
    \ the SIP INVITE toward UE 2.\n\n\\* And, in the future, by a Home Agent (HA)\
    \ for Mobile IP networks, or a Broadband Remote \n\nAccess Server (BRAS) for DSL\
    \ networks."
