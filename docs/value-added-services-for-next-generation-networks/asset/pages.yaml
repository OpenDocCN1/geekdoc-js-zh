  md: "the session plane will need to trigger and invite services regarding terminating\
    \ calls \n\nand sessions.\n\nA destination user may indeed have chosen to receive\
    \ the inbound call/session \n\nin a non-GSM or non-IMS environment, meaning without\
    \ having informed the \n\nHLR/HSS about its location in that new environment.\
    \ Maybe the user has devices \n\nlocated simultaneously in both 3GPP and non-3GPP\
    \ networks.\n\nExamples include the following:\n\nAn instant messaging, gaming\
    \ user, or IPTV watcher wishing to receive \n\ninbound calls, messages and sessions\
    \ inside an IM program, online game \n\nor MPEG2 stream, when logged on there\
    \ (rather than to the cell phone)\n\nA business user away from his/her desktop\
    \ PC, and expecting the incoming \n\ncalls to be handled by the company’s receptionist\n\
    \nThe mobile user of a standard dual-mode GSM/WiFi phone, supporting \n\nVoIP\
    \ and maybe SIP, but not necessarily IMS, and expecting seamless \n\nWiFi-to-GSM\
    \ handover\n\nAn outbound roamer, for whom it is cheaper to receive incoming VoIP\
    \ calls \n\non a plain vanilla VoIP/WiFi handset than on the roaming GSM phone\n\
    \nAn American mobile user, who pays for incoming calls to the mobile side \n\n\
    but not for incoming VoIP calls through a WiFi hotspot\n\nWith revenues from subscriptions,\
    \ outbound, and international roaming traﬃc \n\ndecreasing, it becomes very important\
    \ for 3GPP network operators to attract more \n\ninbound traﬃc through its GMSCs\
    \ and I-CSCFs as the anchor points.\n\nThough 3GPP networks would support these\
    \ terminating services (as well as of \n\ncourse the originating) in a basic form,\
    \ the hooks in the session plane are insuﬃ-\n\ncient to compete with nonstandard\
    \ implementations, hence to keep attracting that \n\ninbound traﬃc.\n\nWhen interrogated\
    \ by the I-CSCF in the Terminating Home Network, a ﬁrst \n\nhurdle is that the\
    \ HSS should accept to reply with a default S-CSCF, if the destina-\n\ntion subscriber\
    \ is not registered in the HSS (or even unknown). It is a design ﬂaw that \n\n\
    the I-CSCF cannot query the SIP AS *directly* (as the GMSC can query the CSE\\\
    *).\n\nThe service plane can then instruct the session plane to proxy the call\
    \ or session \n\nto the non-3GPP environment, via a conversion gateway.\n\nSecond,\
    \ 3GPP GSM and IMS oﬀer no hooks in the call/session plane to provide \n\nseamless,\
    \ *in-call handover* from one environment (e.g., inbound VoIP over WiFi) to \n\
    \nthe other (e.g., GSM). This is true for both terminating calls/sessions to the\
    \ E.164 \n\ntelephone number, as for calls/sessions originating in a 3GPP network\
    \ which need \n\nto be handed over to a non-3GPP environment.\n\n\\* CAMEL Service\
    \ Environment."
