  md: "Stateless Proxy: will add itself as a Via: line to the header, will proxy the\
    \ SIP \n\nmethod onwards, receive all nonﬁnal and ﬁnal responses (e.g., 200 OK),\
    \ \n\nbut not be in the signaling path of subsequent signaling messages of the\
    \ \n\nsession (i.e., the forward SIP ACK)\n\nStateful Proxy: will adopt the stateless\
    \ proxy behavior, but also add itself \n\nas a Record-route: line in the header,\
    \ in order to be in the signaling path of \n\nsubsequent signaling messages pertaining\
    \ to the same session (ACK, BYE, \n\nCANCEL requests and associated responses)\n\
    \nBack-to-Back User Agent (B2BUA): will act as a User Agent (i.e., negotiate \n\
    \nmedia streams) on either side, hence is capable of complex leg manipulation\
    \ \n\noperations\n\nSession Border Controller: will also negotiate the media streams\
    \ using \n\nSDP, and force any media (RTP) to be routed through itself, for the\
    \ fol-\n\nlowing purposes: security, service reach maximization (Network Address\
    \ \n\nTranslation traversal), SLA assurance, revenue and proﬁt protection, and\
    \ \n\nregulatory and law enforcement\n\nSIP Forking server: will proxy the outbound\
    \ request onwards to multiple \n\ndestinations — which includes a known security\
    \ risk for loops (ampliﬁca-\n\ntion vulnerability, IETF draft-ietf-sip-fork-loop-ﬁx-01)\n\
    \nThe IETF sip working group’s charter indicates the following next objectives:\n\
    \nMechanisms for secure expression of identity in requests and responses\n\nMechanism\
    \ to securely request services delivery by nonterminal elements \n\n(“end-to-middle”)\n\
    \nGuidelines for use of existing security mechanisms such as TLS, IPsec, and \n\
    \ncertiﬁcates\n\nGuidelines for the use of descriptive techniques such as SAML\
    \ (Security \n\nAssertion Markup Language) with SIP\n\nDraft standard versions\
    \ of SIP and critical supporting speciﬁcations\n\n*3.2.3.3 SIMPLE*\n\nSIP for\
    \ Instant Messaging and Presence Leveraging Extensions, that’s the descrip-\n\n\
    tion IETF came up with to match the acronym SIMPLE.\n\nThis working group is extending\
    \ SIP to deal with a full suite of services in the \n\ndomain of instant messaging\
    \ and presence, in accordance with IETF RFC 2779, \n\nthe Common Proﬁle for Presence\
    \ (CPP, RFC 3859) and for Instant Messaging \n\n(CPIM, RFC 3860).\n\nThe latter\
    \ used to be managed by the concluded IETF impp working group, \n\ndealing with\
    \ instant messaging and presence protocols (XMPP protocol, RFCs \n\n3920 to 3923).\
    \ XMPP is today a fairly mature standard, correctly dealing with \n\nhandshaking,\
    \ privacy and security, and adopted by the open source community \n\n(Jabber)\
    \ and several IM clients (Google Talk).\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\nN\n\n\
    N\n\nN\n\nN"
  merge: -1
  pgno: 50
- img_proc: true
  md: "The IETF simple group also came up with the XML Conﬁguration Access \n\nProtocol\
    \ (XCAP) used to add/query/remove entries in a buddy list.\n\nThe buddy list itself\
    \ had been created by IETF impp as an XML document \n\nnamed the Presence Information\
    \ Data Format (PIDF, RFC 3863). SIMPLE inher-\n\nited the PIDF from the impp,\
    \ but extended it to cater for watcher information, \n\ncontact information, rich\
    \ presence extensions and timed status information.\n\n***3.2.4***\n\n***Security\
    \ Area***\n\nNext to mobility aspects, security is a rising general concern for\
    \ new communica-\n\ntion protocols and architectures. The success of a technology\
    \ like GSM is partly \n\ndue to the facts that nobody ever succeeded to break\
    \ GSM authentication (i.e., to \n\nimpersonate someone else’s Subscriber Identity\
    \ Module) nor to pull down a GSM \n\nnetwork with a Denial-of-Service attack.\n\
    \nCurrent Internet Protocol security protocol (IPsec), Transport Layer Security\
    \ \n\n(TLS) and Internet Key Exchange protocol (IKE) present somewhat of an all-or-\n\
    \nnothing alternative; these protocols provide protection from a wide array of\
    \ possible \n\nthreats, but, as the Better-Than-Nothing Security (BTNS) working\
    \ group recog-\n\nnizes, are sometimes not deployed because of the need for preexisting\
    \ credentials, \n\nsuch as the ones inside a GSM SIM.\n\n***3.2.5***\n\n***Conclusion\
    \ for the IETF NGN***\n\nThe IETF continues to deliver, by far, the most solid\
    \ standardization work for the \n\nNGN. It could beneﬁt from a more coherent approach\
    \ toward mobility manage-\n\nment, though.\n\nAt Network level, the IETF promoted\
    \ device-impacting technologies such as \n\nIPv6, MIPv4/v6, HMIP/FMIP, and, in\
    \ general, IP over new bearers. It now realizes\n\nthat it could have decoupled\
    \ the non-device-impacting mobility inside a local area, \n\nfrom whatever mobility\
    \ protocol in the core of the Internet (e.g., MIPv4, MIPv6, \n\n3GPP GPRS Tunneling\
    \ Protocol, SIP REGISTER).\n\nIn the Media and Border Gateways layer, IP multicast\
    \ and RTP are brilliant \n\ntechnologies but the generally perceived VoIP quality\
    \ is low on the public Internet, \n\nexcept with QoS enforcement or peer-to-peer\
    \ protocols.\n\nIn the Session Control layer, the IETF also came to the conclusion\
    \ that mobil-\n\nity needs to be hierarchical, namely as hierarchical as there\
    \ will be SIP proxies in \n\nthe path of an incoming SIP INVITE. In theory, IETF’s\
    \ DNS queries are going \n\nto be slower than 3GPP’s DIAMETER queries to a Home\
    \ Subscriber Server \n\n(HSS).\n\nBut the degree of mobility communication consumers\
    \ are expecting is rapidly \n\nincreasing anyway: cross-network, cross-technology\
    \ and with seamless in-session \n\nhandover.\n\nThis brings us to the work of\
    \ the 3GPP."
