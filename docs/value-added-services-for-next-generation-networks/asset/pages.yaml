  md: "Voice-over-IP telephones are now supposed to have stickers with “do not use\
    \ in \n\ncase of emergency.” Before the TISPAN standards, it is indeed impossible\
    \ for VoIP \n\nservice providers to physically locate them. And anyway most VoIP\
    \ phones, IP \n\nrouters and WiFi access points do not have a battery, for cases\
    \ of power outage.\n\nDevice manufacturers are facing a fragmented market of form\
    \ factors (e.g., \n\ndesktop, laptop, pocket PC, navigator, mobile phone, portable\
    \ game console, media \n\nplayer). Moreover, they have to select and maintain\
    \ mobile voice and data commu-\n\nnication technologies and provide on-board features\
    \ such as cameras, Bluetooth, \n\nWiFi, ﬁrewall, music, games and video players.\
    \ Maybe we should requalify the \n\nmanufacturers as device assemblers, because\
    \ that’s what they have become by using \n\nso many advanced shared components.\
    \ They get little indications from network \n\nvendors and service providers when\
    \ it comes to predicting how end users will use \n\nthe device to communicate.\n\
    \nIn a recent survey by the GSM Association, American mobile phone users \n\n\
    ranked mobile e-mail as the number one mobile data service, but the GSM ser-\n\
    \nvice providers, network vendors and 3GPP never speciﬁed any enhancement for\
    \ \n\ne-mail delivery. One could have imagined standards for compression, free\
    \ header \n\npreviews, lawful interception possibilities, personal storage space\
    \ for attachments \n\nin the network rather than on the mobile device, and so\
    \ on. Instead, 3GPP and \n\nGSMA developed and promoted MMS, a competing technology\
    \ with per-message \n\ncharging model.\n\nClassic mobile telephony and text messaging\
    \ has oﬀered very few opportunities \n\nfor sponsoring and advertising, contrary\
    \ to instant messaging clients.\n\nCommunities (e.g., my son’s soccer club) cannot\
    \ subscribe to any communica-\n\ntion service at all; if a match is canceled,\
    \ the trainer uses his personal prepaid credit \n\nto notify the parents by SMS.\n\
    \nThis new, expanded environment is disruptive to classic telcos and cellcos;\
    \ it \n\ngoes along the trend to decouple the device, connectivity and service\
    \ we discussed \n\nin Section 1.6.\n\nIt requires a transition of the same magnitude\
    \ as the step from state-owned \n\nPTTs (Post, Telecom and Telegraph) to a competitive\
    \ landscape in the 1990s.\n\nAs of now, no single player can pretend to oﬀer the\
    \ dominating device, connec-\n\ntivity or service anymore, certainly not for a\
    \ long time. And due to the merging and \n\nacquisition activity in the background,\
    \ it becomes diﬃcult to identify that “single \n\nplayer” anyway. The game is\
    \ about specialization, complementarity, and collabora-\n\ntion, rather than overlaps\
    \ and head-to-head competition.\n\nSo in summary of this introduction, VAS proposals\
    \ should be evaluated \n\nalong an extended list of attributes: the basic forces\
    \ we discussed in Chapter 1, \n\nthe 7-P service marketing mix and of course the\
    \ interests of an extended list of \n\nstakeholders.\n\nWith this in mind, let’s\
    \ examine a few examples of these VAS."
