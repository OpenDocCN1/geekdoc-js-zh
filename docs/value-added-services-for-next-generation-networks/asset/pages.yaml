  md: "That there’s no “single sign-on” procedure to the services, except maybe to\
    \ the ser-\n\nvices in the walled garden of the connectivity service provider?\n\
    \nIf these contact lists and tribe memberships are well thought of, it should\
    \ be \n\npossible to organize them in the following ways:\n\nWith multiple identities:\
    \ I may be identiﬁed by application X as a company, \n\nand by application Y as\
    \ an individual.\n\nWith multiple proﬁles: I may not wish to reveal my personal\
    \ vCard in a \n\nprofessional context, and vice versa.\n\nBy category: it is diﬃcult\
    \ on today’s phones to organize contacts in various \n\ncategories (e.g., family,\
    \ friends, colleagues, recently used), and to keep \n\nthat organization while\
    \ synchronizing.\n\nWith extensible attributes: it should be possible to add future\
    \ contact details \n\nthrough new communication means (e.g., the SIP address).\n\
    \nRelationally: it should be possible to jump from contact to contact, along \n\
    \nrelationships representing the real structure of our social networks (e.g.,\
    \ \n\nbrother, employer, coach of).\n\nWith two-way handshaking: when contact\
    \ B is added in person A’s address \n\nbook, it should be possible to invite person\
    \ B to add contact A in person \n\nB’s own address book.\n\n***1.11.3 Evolution***\n\
    \nAs in the case of presence and availability, various industry players are going\
    \ to \n\nﬁght to hold contact lists (historically the domain of mobile phone manufacturers\
    \ \n\nand e-mail client producers) and tribe memberships (e.g., for the production\
    \ and \n\ndistribution of security certiﬁcates).\n\nMaybe a new industry will\
    \ emerge.\n\nAlternatively, contact lists and tribes will migrate from the domain\
    \ of e-mail \n\nand telecommunications into the realm of various industries related\
    \ to authentica-\n\ntion, security, identity management and electronic purses.\n\
    \n**1.12 Location**\n\nMuch has been said about location and its beneﬁts, for\
    \ example the possibility \n\nto adapt content, tariﬀs or incoming call handling\
    \ based on the user’s current \n\nlocation.\n\nThe mobile communications industry\
    \ has tried to assess which granularity of \n\nlocation information would be required\
    \ for which services. For sure, navigation \n\nrequires the granularity of GPS.\
    \ But could so-called home/oﬃce zone services \n\n(lower tariﬀs) be provided based\
    \ on the GSM cell ID, in an attempt to displace the \n\nlandlines?"
