  md: "*g*\n\n*g*\n\n**4.6**\n\n**NGN Peering**\n\nTDM\\* (circuit-switched) communication\
    \ networks have been ***interconnected***.\n\nBilateral interconnection agreements\
    \ have been set up between the communication \n\nservice providers (CSP). Without\
    \ going into too much detail, these bilateral agree-\n\nments are based on a connection\
    \ fee per call, and a price per time unit. CSP X is \n\ncharged by CSP Y to connect\
    \ outbound calls (X to Y) to a given destination (e.g., \n\nLebanon). And CSP\
    \ X is also charged by CSP Y for inbound calls (Y to X) to free-\n\nphone numbers,\
    \ or when CSP Y provides the physical access network allowing to \n\nselect CSP\
    \ Y as a carrier. Inter-operator accounting is based on call detail records, \n\
    \nwhich are generated for every call. At the end of the month, the net amount\
    \ due by \n\nCSP X to CSP Y (or vice versa) is calculated, in a process called\
    \ “settlement.”\n\nInternet Service Providers (ISPs, “Autonomous Systems” in Internet\
    \ standard \n\nterms) are however establishing ***peering*** agreements. Originally,\
    \ ISPs would use \n\nsettlement-free peering, reﬂecting the fact that traﬃc was\
    \ symmetrical and both \n\nparties would automatically beneﬁt from peering.\n\n\
    This is no longer the case. In a laconic recommendation D.50 approved in Montreal\
    \ \n\nin 2000, the ITU-T spoke of commercial agreements taking into account the\
    \ traﬃc \n\nﬂow^†, the number of reachable destinations^‡ and even the “geographical\
    \ coverage”^§ as \n\nelements of the compensation, even when the actual transmission\
    \ (the leased line) would \n\nalready have been paid for 100% by the new ISP or\
    \ country. In practice, it meant that \n\nsmall countries wishing to connect to\
    \ a large public Internet eXchange Point (IXP, often \n\nin the United States)\
    \ could be dismissed with a high oﬀer, whereas most of that IP traﬃc \n\n(browsing,\
    \ e-mail) would actually be routed to servers outside of the United States.\n\n\
    Contrary to TDM interconnection, the principles of ISP peering were thus \n\n\
    left to be organized by each national regulator (for public peering — many little\
    \ \n\nISPs, low capacity), but most often by the private sector (private peering\
    \ — high- \n\ncapacity peering between the larger ISPs). Today, most of the Internet\
    \ traﬃc occurs \n\nat private peering points, often implemented as third party\
    \ “carrier hotels.”\n\nA starting pure NGNSP will thus have to go through multiple\
    \ stages to obtain \n\nInternet access: ﬁrst probably commercial broadband Internet\
    \ access, then public \n\npeering, and then private peering over time — unless\
    \ of course the NGNSP teams \n\nup from the start with a large ISP.\n\nNGN peering\
    \ is the interconnection of session-based networks. A session has a \n\nduration\
    \ but is essentially set up to transport a certain volume of data (megabits).\
    \ \n\nWill NGN peering then follow the principles of TDM interconnection (mainly\
    \ \n\ntime-based), or of ISP peering (volume, number of reachable destinations,\
    \ etc.)?\n\n\\* Time-Division Multiplexed.\n\n† But what traﬃc ﬂow: the estimated\
    \ rate in Megabit/s or the actually measured rate? The aver-\n\nage rate or the\
    \ peak rate? Based on which formula? The principles out there are numerous. \n\
    \n‡ IP routes, reachable DNS domains, etc.\n\n§ The number of square miles of\
    \ the country?"
