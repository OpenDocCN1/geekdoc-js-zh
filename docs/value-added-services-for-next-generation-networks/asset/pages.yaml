  md: "***4.7.6***\n\n***Admission Control***\n\nSBC’s are also the ideal place to\
    \ limit the total number of sessions being admitted from \n\na given source domain,\
    \ in order to protect the NGN core network from overﬂow.\n\nIn a network with\
    \ multiple SBC’s across the globe, it becomes diﬃcult for these \n\nSBC’s to share\
    \ a common set of real-time counters, representing the total number of \n\nongoing\
    \ sessions to/from a given NGN peer, enterprise or application service provider.\n\
    \nHence as we saw in Section 3.5, the more recent view is that the SBC, more spe-\n\
    \nciﬁcally its interconnection border control function (I-BCF), should query a\
    \ central \n\nAdmission and Resource Control layer (RACS).\n\nIndeed, the RACS\
    \ has an overview of the total number of sessions going on \n\nin the whole network,\
    \ and can take into account the various interconnection \n\nagreements.\n\nThe\
    \ need for admission control is also related to the need for overload protec-\n\
    \ntion; we’ll look at that in Section 6.11.\n\n***4.7.7***\n\n***Other Functions***\n\
    \nThe SBC is such an important and strategically positioned new element in a NGN\
    \ \n\narchitecture that new functions keep being added to it:\n\nLawful Interception\
    \ (LI), where certain media streams need to be inter-\n\ncepted and copied to\
    \ the law enforcement agencies\n\nVirtual Local Area Network (VLAN) tagging, allowing\
    \ it, for example, to \n\ncarry signaling and payload on separate VLANs\n\nQuality-of-Service\
    \ (QoS) marking\n\nQoS and ﬂow statistics reporting\n\nBandwidth policing, probably\
    \ by querying the TISPAN RACS we saw in \n\nSection 3.5\n\nEcho Canceling\n\n\
    DTMF interworking between multiple methods, in-band\\* and out-of-band^†\n\nSIP\
    \ security, screening the use of SIP messages, header ﬁelds and values, for \n\
    \neach interconnected peer NGN or enterprise\n\nAccounting\n\nLeast-cost routing\n\
    \nService assurance\n\nReporting on media quality\n\nSome of the functions (e.g.,\
    \ QoS marking) rely on tightening the bonds between \n\nthe media and border gateways\
    \ layer and the IP transport layer.\n\n\\* Using RTP payload or RFC 2833.\n\n\
    † Using either SIP INFO or NOTIFY messages."
