  md: "Make sure that their own presence data will never be watched nor modiﬁed \n\
    \nby nonauthorized individuals and applications\n\nHandle incoming communication\
    \ based on their presence and availabil-\n\nity data\n\n**1.9**\n\n**Immediate\
    \ and Deferred Communications**\n\nMaybe as a consequence of the protective measures\
    \ against intrusiveness, commu-\n\nnication users have discovered the beneﬁts\
    \ of deferred communications.\n\nWe saw that timeliness is essential for genuine\
    \ communication to take place: a \n\nshort time span between the production and\
    \ the reception of information.\n\nWhen it used to be humans receiving the information,\
    \ machines (e.g., answer-\n\ning machines, IVR systems, voicemail systems, e-mail\
    \ clients, SMS/MMS-enabled \n\nmobile phones) are now receiving these calls and\
    \ messages. Humans now have the \n\ncomfort to read, interpret and react on them\
    \ later.\n\nCommunication is deferred, and sometimes buried among stored information\
    \ \n\nrequiring no action.\n\nHas it therefore become less “genuine”?\n\nTo some\
    \ extent, yes. In large companies, there’s today a noticeable erosion of \n\n\
    the value of an e-mail, for example. Senior executives and their assistants receive,\
    \ \n\nskip, archive, interpret and send hundreds of e-mails a day. A certain error\
    \ rate is \n\naccepted by the originators. The expected time of reaction is, after\
    \ having gone \n\ndown since the adoption of e-mail and mobility, increasing again.\
    \ Senders “esca-\n\nlate” by using multiple communication means, which is worsening\
    \ the problems. \n\nHow many voicemails start with “Hey I sent you an e-mail,”\
    \ and vice versa?\n\nAre users expecting their communication service providers\
    \ to play a role in \n\nimproving things, by sending reminders for pending messages\
    \ or actions? Perhaps, \n\nif these notiﬁcations could be limited and aggregated\
    \ (providing a daily summary \n\ninstead of a continuous stream).\n\nPerhaps someone\
    \ could also suggest priorities to all these messages, by learning from \n\nthe\
    \ priorities we assigned ourselves, our past reaction time to that sender, and\
    \ so on.\n\nAs for most basic forces structuring modern communications, value-added\
    \ ser-\n\nvices relying on them will become more successful if they can be provided\
    \ spanning \n\nmultiple communication means. Today this is not the case; you would\
    \ be notiﬁed \n\nby your cell phone, your instant messenger, your online game,\
    \ and so forth.\n\nThe idea of the communication service provider as a personal\
    \ Inbound Com-\n\nmunications Handler (ICH) will come back throughout this book.\n\
    \nIn the meanwhile, our pending and archived communications are stored \n\nin\
    \ giant data centers around the world, for example, in the order of 3 PB\\* for\
    \ \n\n\\* A petabyte  more than 10^(15) bytes  more than a million billion bytes."
