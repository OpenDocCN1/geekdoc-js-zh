  md: "However, the need to break the CSCF into three entities, or even the need for\
    \ an \n\nopen interface between CSCF and HSS has gone away, since 3GPP recognized\
    \ that \n\nthe IMS would be accessed solely through GGSNs of the Home PLMN.\n\n\
    Indeed, in the early days of IMS (2000-2002), it was believed that a P-CSCF \n\
    \nin Visited Network A (just next to Visited GGSN A) would have to communicate\
    \ \n\nwith an I-CSCF in Home Network B, via SIP and over an international network\
    \ \n\ncalled IPX (IP eXchange). Also, a S-CSCF may have been assigned in the Visited\
    \ \n\nNetwork A (just next to Visited GGSN A), to communicate with the HSS in\
    \ Home \n\nNetwork B.\n\nToday, we know that in practice, the SGSN A will only\
    \ communicate to a \n\nGGSN B in the Home Network, over the GRX (GPRS Roaming\
    \ eXchange). \n\nIndeed, as many services (e.g., real-time charging, IP content\
    \ ﬁltering) are Home \n\nGGSN-based, using Visited GGSNs is not an option anymore.\
    \ Moreover, there \n\nhad been the unsolved questions about how the inbound roamer\
    \ B would ﬁnd the \n\nAccess Point Name to GGSN A in a visited network, why he/she\
    \ would even try to, \n\nand whether that APN would be have been provisioned in\
    \ his/her HLR B (or just a \n\ndefault setting then allowing any APN).\n\nHence\
    \ as all elements (P-CSCF, I-CSCF, S-CSCF, HSS but also SBC and \n\nMGCF) are\
    \ all in the subscriber’s home network anyway, the functional separation \n\n\
    into diﬀerent logical entities is not needed anymore, and just makes *ineﬃcient\
    \ use *\n\n*of resources*, compared to a traditional architecture of Class 5 and\
    \ Class 4 NGN \n\nsoftswitches. The elements waste a lot of energy (CPU power)\
    \ to encode/decode \n\nmessages between each other, rather than spending these\
    \ cycles on the interfaces to \n\nthe external world (user entities and other\
    \ networks).\n\n*3.3.2.3 Service Hooks*\n\nBesides session-level mobility, 3GPP\
    \ provides the hooks to let the session plane trigger/ \n\ninvite the service\
    \ plane, but only at call/session setup stage.\n\nThe 2G-2.5G-3G mechanism is\
    \ CAMEL.\\* The HLR holds the necessary \n\nCAMEL subscription information (CSI,\
    \ including the address of the Service Con-\n\ntrol Function). For originating\
    \ calls, the HLR inserts O-CSI into the Visited Net-\n\nwork (Visited MSC/VLR)\
    \ when the mobile phone is initially powered on (more \n\nspeciﬁcally during the\
    \ Location Update/Insert Subscriber Data procedure). For \n\nterminating calls,\
    \ the T-CSI is interpreted by the Home Network (Gateway MSC) \n\nwhen received\
    \ from the HLR (in response to a Send Routing Info request).\n\nThe IMS mechanism\
    \ is the “evaluation of initial ﬁlter criteria” and is performed \n\nby the S-CSCF\
    \ in the Originating or in the Terminating Home Network, which can \n\ninvite\
    \ SIP Application Servers (AS). Again the HSS holds the necessary criteria.\n\n\
    The session plane needs to trigger/invite important “originating” services such\
    \ \n\nas prepaid/real-time charging, lawful interception, and centrex. But increasingly,\
    \ \n\n\\* Customised Application of Mobile Enhance Logic."
