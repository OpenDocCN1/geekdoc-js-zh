  md: "Under our deﬁnition, an NGN consists of ﬁve logical layers:\n\n1\\. An IT and\
    \ Services layer, containing the\n\nTelecom Management Network (TMN) for supervision\n\
    \nHome Subscribe Server (HSS), supposed to become the master data-\n\nbase and\
    \ mobility manager for all subscribers in an IP Multimedia \n\nSubsystem (IMS)\n\
    \nApplication Servers (AS), executing subscriber-dependent service logic\n\nOperations\
    \ Support System (OSS), the IT system for subscribers, \n\nproduct catalogs and\
    \ provisioning processes\n\nBilling Support System (BSS), the charging system\
    \ receiving network \n\ninformation after the facts (oﬀ-line) or before the facts\
    \ (online)\n\n2.The Session Control layer, conveying the necessary signaling to\
    \ let end \n\nusers establish multimedia communication sessions\n\n3.The Resource\
    \ and Admission Control layer, allocating bandwidth resources \n\nto individual\
    \ media streams, and admitting or refusing users to the NGN\n\n4.The Media and\
    \ Border Gateways layer, conveying the IP packets contain-\n\ning encoded media\
    \ (voice, video), performing the necessary conversions \n\nand enforcing the policies\
    \ decided by the Resource and Admission Con-\n\ntrol layer\n\nN\n\nN\n\nN\n\n\
    N\n\nN\n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_44_0.png)\n\n**Figure 3.1**\n\
    \n**A layered deﬁnition of the Next Generation Network.**"
  merge: -1
  pgno: 44
