    \ requests an appropriate access QoS for each media type listed in the \n\nSDP.\
    \ Strangely, in IMS, *it is up to the UE to select the access QoS*, so it could\
    \ request \n\na high UMTS QoS for media not requiring it!\n\nThe local GGSN veriﬁes\
    \ the bindings between Authorization Token and Flow-\n\nIDs, via COPS protocol\
    \ on the Go interface. Go is set up between a Policy Control \n\n**Figure 3.3**\n\
