  md: "In the category of stored media transmission, is it appropriate to post someone’s\
    \ \n\nlast words as an MP3 track on the Internet? Is it socially acceptable to\
    \ set up a Web \n\nsite regarding someone’s death and funeral? Or is only the\
    \ newspaper’s necrology \n\npage regarded as socially acceptable?\n\nHow is law\
    \ going to deal with the subtle distinction between distributing copy-\n\nrighted\
    \ electronic content by e-mail (legal), making it available for download on a\
    \ \n\nhome page (illegal), and all forms in between (e.g., peer-to-peer networks,\
    \ blogs, \n\nchat sessions)?\n\nIs it legal for a content provider to encode/protect\
    \ the contents so it can be \n\ndecoded/read only on a given computing device?\
    \ Or be distributed only through a \n\ngiven telecommunications network?\n\nAt\
    \ present, I am not aware of any law school teaching Digital Rights Manage-\n\n\
    ment (DRM).\n\nIs it a good idea to set up a Web site about your community, advocating\
    \ the \n\nmerits of its shops, restaurants and leisure clubs in good faith? If\
    \ your site attracts \n\nmany visitors, the baker might start giving you your\
    \ Sunday sandwiches for free, \n\nfor his shop to appear on top of the list. Is\
    \ that socially appropriate behavior, or a \n\nnew kind of corruption?\n\nAs the\
    \ number of social conventions and rules also keep growing, the origina-\n\ntors\
    \ and authors could become tired of having to make such decisions of appropri-\n\
    \nateness. The combinatory explosion of mappings between communication means \n\
    \nand social conventions is diﬃcult to learn and to remember.\n\nIf the receiver’s\
    \ availability and preferences are ignored, it may also generate a \n\nsentiment\
    \ of intrusiveness on the receiver’s side and we’ll discuss that in Section 1.8.\
    \ \n\nBut the point here is that the originator is tired of having to guess what\
    \ communi-\n\ncation means or content format will most please the receiver(s),\
    \ be socially accept-\n\nable, legal, and so forth.\n\nThe result may be no genuine\
    \ communication and no production of stored media \n\nat all: a post-Communication\
    \ society comparable to today’s post-Industrial Age.\n\nTherefore, it may be time\
    \ to ease the life of originators and authors, by shifting \n\nsome of the burden\
    \ and responsibility to the receiving end.\n\nBut have they (the receivers) got\
    \ the choice today to select the communication \n\nmeans that are going to be\
    \ used?\n\nIn genuine telecommunications, to a certain degree, the answer is yes.\
    \ One can \n\nswitch oﬀ a mobile phone (a radical method) and expect the callers\
