  md: "MCMSP presents a mix of audio streams containing more sound recorded at the\
    \ \n\nback left microphone of the originator.\n\nLet’s try and imagine the video\
    \ version of this service: four SIP/WiFi Webcams \n\nrecord an image on the originating\
    \ side (front left/right, back left/right) and the \n\nimage the recipient sees\
    \ on his portable NGN device (e.g., a portable WiFi-enabled \n\ngaming console)\
    \ depends on the position and orientation of that device relative to \n\nhis/her\
    \ own cameras.\n\nThe MCMSP calculates a resulting image based on this info, and\
    \ the four video \n\nfeeds from the originating cameras.\n\nAlternatively, the\
    \ image could depend on motion sensors in the recipient device, \n\nor Galileo,\\\
    * instead of external position beacons.\n\nWhatever positioning technology is\
    \ used, you could explore every angle of a \n\n3D object (a statue on the originating\
    \ museum for example), by physically walking \n\n“around it” on the destination\
    \ side (your living room).\n\nNow combine video and audio and the communication\
    \ experience could be \n\ntremendous, even with relatively compact handheld NGN\
    \ devices (screens) on the \n\nreceiving end.\n\nMultichannel media have the potential\
    \ to introduce new forms of clubbing/par-\n\ntying, casino, games and sports.\
    \ Imagine virtually standing on the soccer ﬁeld dur-\n\ning the match, watching\
    \ the action from a couple of meters, including the audio!\n\n**7.4**\n\n**Combinatory\
    \ Services**\n\nThe separation of audio device (microphone and speaker in a Bluetooth\
    \ headset) and \n\nterminal device (camera phone, even already with two cameras)\
    \ has opened new pos-\n\nsibilities to share pictures or video during the voice\
    \ conversation.\n\nContrary to the multichannel media above, combinatory services\
    \ do not require \n\nthe diﬀerent media streams to be mixed together to produce\
    \ a new media stream. \n\nAs such, they don’t rely on massive computing power\
    \ to process the streams.\n\nIt would probably also be ﬁne to launch the service\
    \ without synchronizing the \n\naudio and video streams — the recipient would\
    \ see the originator’s lips moving out \n\nof sync, but if this service is meant\
    \ to be used to ﬁlm or picture landscapes and \n\ninteriors, who cares?\n\nShould\
    \ these multiple media streams then be added to a single session, or may \n\n\
    they be negotiated and carried in diﬀerent sessions? At ﬁrst sight, it seems ﬁne\
    \ to \n\ndo the latter.\n\nIs there a need to have these multiple sessions being\
    \ established by a single, \n\n500€ phone? Or could I use a 100€ SIP camera and\
    \ my 100€ cell phone?\n\n\\* The future European GPS system, which will provide\
    \ accuracy down to a few centimeters, \n\nwith a subscription."
