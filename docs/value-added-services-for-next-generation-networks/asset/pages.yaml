  md: "IETF SIP-T (RFC 3372) is a binary encapsulation of ISUP inside SIP (as a \n\
    \nMIME attachment), with the purpose of not losing information when transferring\
    \ \n\ncalls over SIP networks. 3GPP deﬁned this as TS 29.163.\n\nBut as ITU-T\
    \ ISUP was heavily modiﬁed and extended by national PTTs, which \n\nlead to over\
    \ 60 national or regional variants across the world, SIP-T is also national.\n\
    \nA new variant, SIP-I is therefore currently under development as an interna-\n\
    \ntional superset of the national SIP-T variants.\n\nThe ITU-T Study Group 11\
    \ is deﬁning a new encapsulation called Generic \n\nTransparency Descriptor (Q.GTD.1).\n\
    \nThe reason for these encapsulations is that even in 2006, it is not possible\
    \ for \n\nan MGC\\* to map the full set of ISUP messages and parameters to basic\
    \ SIP mes-\n\nsages and ﬁelds, despite all additional SIP RFCs trying to cover\
    \ the most evident \n\nholes (e.g., there’s still no originally called number,\
    \ redirecting number nor privacy \n\nindications in SIP).\n\nAnno 2006, ITU-T\
    \ ISUP, and BICC contain a superset of IETF SIP function-\n\nality, so the battle\
    \ between *bellheads* and the *bitheads* is still raging.\n\n***3.6.6***\n\n***NGN\
    \ Gateway Control***\n\nAlso in the NGN area, in 2000, the ITU-T initiated another\
    \ major and ambitious \n\ndevelopment: an open interface between the session control\
    \ layer and (initially only) \n\nthe media gateways: Media Gateway Control (MEGACO,\
    \ then recommendation \n\nH.248, today H.248.1).\n\nToday’s version (H.248.1 version\
    \ 3, 2005) includes 13 basic packages and has \n\nover 40 optional packages to\
    \ control various telecom features on circuit-to-IP media \n\ngateways and IP-to-IP\
    \ border gateways. TISPAN deﬁnes Core Border Gateway \n\nFunctions (C-BGF, at\
    \ the edge between access and core network) and Interconnec-\n\ntion Border Gateway\
    \ Functions (I-BGF, interconnecting the core networks). The \n\ngeneral term “gateway”\
    \ could be used to refer to both media and border gateways.\n\nITU-T H.248.1 is\
    \ adopted both by TISPAN (for “ﬁxed” NGNs) and by 3GPP \n\n(for the “mobile” IMS).\n\
    \nThe physical decomposition of session plane and user plane is now even adopted\
    \ \n\nin the new generation of GSM (Phase 2) and UMTS core networks (3GPP Release\
    \ \n\n1999 and Release 4), where centralized MSC servers are now controlling decentral-\n\
    \nized media gateways. Hence ITU-T H.248 has also become one of the reasons why\
    \ \n\nIMS (3GPP Releases 5-6-7) is losing ground.\n\nThe IETF ﬁrst adopted H.248\
    \ (as Megaco 1.0, RFC 3015) in 2000, but con-\n\ntinued to develop its own Media\
    \ Gateway Control Protocol (MGCP, RFC 2705 \n\nsuperseded by RFC 3435 in 2003).\n\
    \nToday we see MGCP losing ground against H.248.1, which is considered more \n\
    \n“open” and “extendible.”\n\n\\* Media Gateway Controller, please refer to Section\
    \ 3.1."
