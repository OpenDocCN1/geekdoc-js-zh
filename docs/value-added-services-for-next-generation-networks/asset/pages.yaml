  md: "Diﬀerent service creation environments must be used to create new connectors\
    \ \n\nin the Service Capabilities layer, for example tools based on the Object\
    \ Manage-\n\nment Group’s (OMG) Uniﬁed Modeling Language (UML).\n\nIn the Infrastructure\
    \ layer, the biggest eﬀort is probably to continuously requal-\n\nify and adapt\
    \ the software (service capabilities and applications) to an ever evolving \n\n\
    environment of servers, operating systems, databases and gateways. The Advanced\
    \ \n\nTelecommunications Computing Architecture (AdvancedTCA) using Carrier Grade\
    \ \n\nLinux is today the most important standardization eﬀort in the server hardware\
    \ area.\n\nLayering is of course a popular concept and has been used to justify\
    \ “convergent \n\nbilling” (i.e., in fact generalized online charging) or the\
    \ NGN architecture itself \n\n(see Section 3.1).\n\nLayering cannot become a goal\
    \ in itself. Establishing the communication between \n\nthe layers is a long term\
    \ investment; in the short term, the cost and complexity of add-\n\ning another\
    \ VAS silo will generally be lower and the performance (the handling capac-\n\n\
    ity of communication events) will be higher. A lot of processing power can indeed\
    \ be \n\nspent on inter-layer communication rather than on actual network interaction.\n\
    \nThe layered architecture of these platforms should ideally be reﬂected in matching\
    \ \n\norganizations, on telecom equipment manufacturer/software vendor side as\
    \ well as on \n\ntelecom service provider side. Otherwise, even the most perfectly\
    \ layered technical plat-\n\nform will not lead to cost savings nor noticeable\
    \ service quality improvements.\n\n**6.2**\n\n**Load Balancing**\n\nVAS platforms\
    \ sometimes initiate transactions to core networks, but for most of the \n\ntime\
    \ respond to requests from these networks.\n\nIn SS7 networks, SCCP Relay Nodes\
    \ are able to spread or balance the load of \n\nmessages across a set of Signaling\
    \ End Points (e.g., SS7-to-SIGTRAN signaling \n\ngateways). The MTP layer underneath\
    \ then ensures that multiple routes are avail-\n\nable to reach that Signaling\
    \ End Point.\n\nSIGTRAN network elements (e.g., the signaling gateway mentioned\
    \ above) use an \n\nAddress Mapping Function to share the load across a set of\
    \ SIGTRAN hosts.\n\nContent Service Switches have been developed to balance a\
    \ load of (Layer 7) \n\nHTTP requests across a Web server farm (Layer 4). These\
    \ CSS are today also select-\n\ning the target Web server farm using advanced\
    \ criteria such as proximity, user \n\nprioritization, client device or requested\
    \ content type. Smart functions have been \n\nadded, for example, to oﬀ-load SSL\
    \ processing (Layer 5) from the Web servers, \n\nhence accelerate content delivery.\n\
    \nSimilar network solutions now exist for SIP.\n\nThe call routing logic of telephony\
    \ exchanges (ﬁxed and mobile) is almost \n\nalways designed in three stages: analysis\
    \ objects to (pre)analyze the called party \n\nnumber, routing objects a.o. to\
    \ spread the load across multiple destinations, and \n\ntrunk groups (groups of\
    \ circuits) to reach that next destination."
  merge: -1
  pgno: 120
- img_proc: true
  md: "*q*\n\nIn general, eﬀective load balancing is only possible using timely information\
    \ \n\nabout the target server’s state, and/or the communication application itself\
    \ on that \n\nserver (if the server itself is reachable).\n\nFor example, by default,\
    \ SIP (user agents or proxy servers) and HTTP clients \n\nuse Domain Name Service\
    \ (DNS) resolution to direct the SIP messages to the des-\n\ntination servers\
    \ (e.g., SIP registrars, proxies or Application Servers). The DNS could \n\nreturn\
    \ various answers in order to spread the load of SIP requests (this is known as\
    \ \n\nthe DNS round robin mode). However, the DNS servers are not informed of\
    \ sud-\n\nden unavailability of a destination SIP or HTTP server. Hence they cannot\
    \ react \n\nto such event, and the client needs to discover such unavailability\
    \ itself, through \n\ntime-out (e.g., 30 seconds). It then needs to use a back-up\
    \ server, indicated in the \n\nDNS response.\n\nSo when designing a VAS platform,\
    \ we should thus ﬁrst think about a watchdog \n\nprocess (see Section 6.10) that\
    \ will monitor the applications not only to restart them \n\nin case of failure,\
    \ but also to inform the third party load balancers.\n\nSecond, if the VAS platform\
    \ is going to be used for the entire duration of the \n\ncommunication, the load\
    \ balancer should also maintain (count) the number of \n\ncommunications in progress\
    \ to each VAS platform and application.\n\nThird, within a VAS platform itself,\
    \ which can consist of multiple geographi-\n\ncally remote physical servers, each\
    \ layer (of Section 6.1) should be designed to share \n\nthe load across the layer\
    \ above it. This means that each layer should oﬀer a degree \n\nof redundancy:\
    \ the ability for separate modules to execute the same function. We’ll \n\naddress\
    \ that in Section 6.3.\n\nIn the long term, one can wonder whether both network-based\
    \ load sharing \n\nand platform-internal load sharing are both required. Let’s\
    \ say here that the former \n\nshould rely on open standards, whereas the latter\
    \ can be optimally designed within \n\nthe VAS platforms, hence be more accurate.\
    \ Designing too advanced internal load \n\nbalancing schemes may end up consuming\
    \ an exaggerated amount of computing \n\nand memory resources, compared to the\
    \ service execution itself.\n\n**6.3**\n\n**Redundancy**\n\nAs introduced above,\
    \ redundancy implies that multiple modules should be able to \n\ndeliver the same\
    \ service.\n\nIn the IT layer, multiple servers can be used to hold the platform’s\
    \ clustered \n\nmaster database; each server is connected to the shared disk array.\
    \ Solutions exist to \n\nback-up the database to a remote site (server and disk\
    \ array) periodically, in near real-\n\ntime, should a catastrophic outage occur\
    \ in the main disk array.\n\nOn the real-time Application Servers, multiple instances\
    \ (independent UNIX \n\nprocesses) can be used to avoid that the failure of one\
    \ process would bring the \n\nwhole AS down. Each so-called back-end process should\
    \ reserve its own portion of \n\nmemory to store the Context information (e.g.,\
    \ the parameters of the calls, mes-\n\nsages, sessions in progress, subscriber\
    \ and service data, counters, timers)."
  merge: -1
  pgno: 121
- img_proc: true
  md: "In the Service Capabilities layer, multiple instances can also be used to implement\
    \ \n\na single “front-end” service capability (such as a messaging interface),\
    \ but usually they \n\nend up listening to a particular communication port (TCP,\
    \ UDP port number) or \n\npool of port numbers of the server’s local IP stack.\
    \ Hence, load balancing across the \n\nservice capability instances of a single\
    \ server is normally network-based. Of course, \n\none such service capability\
    \ instance should be able to balance the load of requests to \n\nmultiple application\
    \ instances, based on their current load and availability.\n\nAt Infrastructure\
    \ level, mirrored disks should protect the data from corrup-\n\ntion. Multiple\
    \ physical (Ethernet) interfaces should connect the server to a single \n\nexternal\
    \ LAN switch. And a single server should be connected to multiple LAN \n\nswitches.\
    \ That single server should be able to use multiple IP routers (behind these \n\
    \nLAN switches) to reach any IP destination. Routing protocols should be appropri-\n\
    \nately conﬁgured to inform the local servers of the availability of particular\
    \ routes \n\n(i.e., next hops) to reach any particular destination — and, conversely,\
    \ to inform \n\nthe external world of the IP reachability of the local servers.\n\
    \nAfter having performed load balancing, it is important for external load balancers\
    \ \n\nto direct all subsequent requests (messages, packets) of a same communication\
    \ session, \n\nto the same physical server (service capability instance). In the\
    \ network, a frequently \n\nused technique is to assign a general network address\
    \ (e.g., SCCP Global Title, HTTP/\n\nSIP URI, host name) to an application, but\
    \ then to let each server or service capability \n\ninstance indicate its own\
    \ network address in the ﬁrst response to the external client.\n\nIs this also\
    \ the case for a service capability instance toward the set of application \n\n\
    instances? In principle, yes, all subsequent requests should go to the same applica-\n\
    \ntion instance: only a given application instance has access to the necessary\
    \ context \n\ndata to handle the current communication session.\n\nThis means\
    \ that, if the application instance fails in the busy hour, all ses-\n\nsions\
    \ handled by that instance will be lost. In practice that can correspond to, for\n\
    \nexample, 100K€ of prepaid credit, allocated to ongoing communication sessions,\
    \ \n\nand which cannot be debited from the accounts.\n\nWhereas this sounds unacceptable\
    \ for a banking transactions server, most com-\n\nmunications service providers\
    \ accept this risk (of loss of context data).\n\nBut in more advanced designs,\
    \ the application instances can share common \n\nfunctions (e.g., running timers,\
    \ incrementing counters) to a dedicated process, \n\nwhich again can exist in\
    \ multiple instances.\n\nNext, we’ll discuss database replication in Section 6.4,\
    \ and memory synchronization \n\nin 6.5, as techniques to share the information\
    \ among multiple application instances.\n\n**6.4**\n\n**Database Replication**\n\
    \nAll layers, except the Infrastructure layer itself, require data (e.g., subscribers,\
    \ ser-\n\nvice conﬁguration data, CDRs, alarms, statistics) to be stored persistently\
    \ for days, \n\nif not weeks or years. It is unacceptable to keep these data in\
    \ memory only, and \n\nassume that the servers will never fail or need to be upgraded."
  merge: -1
  pgno: 122
- img_proc: true
  md: "*q*\n\nIn this context, the pace at which these data change is referred to\
    \ as the database \n\nvolatility.\n\nAs the added value of a service increases,\
    \ so does database volatility.\n\nData can be frequently altered at provisioning\
    \ time, through user self-care, but \n\nincreasingly due to network events. Communication\
    \ service providers expect good \n\nvisibility on the communications sessions,\
    \ the attempts to set up such sessions, the \n\ncurrent health state of the platform\
    \ and all activities executed (see Section 6.26).\n\nThe IT layers of VAS platforms\
    \ are sometimes evolving into real “data ware-\n\nhouses” for marketing studies\
    \ on user behavior.\n\nPersistent data should be propagated from the IT layer’s\
    \ master database into \n\nthe real-time databases on the AS. The application\
    \ and service capability instances \n\nshould read from their *local* real-time\
    \ database\\* *only*.\n\nWhen one AS needs to alter the persistent data, it could\
    \ request the update to \n\none peer AS, to all peer AS, or to the IT layer. From\
    \ the IT layer, replication to the \n\nother AS can be more selective and conﬁgurable\
    \ (to get only the correct pieces of \n\ninformation in the correct AS).\n\nIn\
    \ peer-to-peer networks, replications happens to a subset of peer AS: a set of\
    \ \n\n“super nodes” maintaining the persistent data. Try installing the Skype\
    \ client on a \n\ndiﬀerent computer and logging in with your credentials: it takes\
    \ a while for Skype to \n\nreplicate your list of contacts from one of these super\
    \ nodes into your new computer.\n\nWhatever strategy is adopted, pending database\
    \ replication requests (from AS \n\nto IT or vice versa) should be cached in memory\
    \ or written to the local database, \n\nshould the connectivity disappear or should\
    \ the remote AS be out of service. As \n\nlong as there’s available space allocated\
    \ in the replication buﬀers, automatic data-\n\nbase resynchronization should\
    \ be possible when the connectivity is restored.\n\nIn case of longer outages,\
    \ manual database resynchronization is possible.\n\nDatabase replication schemes\
    \ should never be used for communication context \n\ndata. The consequence of\
    \ writing these data to disk would dramatically handicap \n\nthe execution of\
    \ service logic.\n\n**6.5**\n\n**Memory Synchronization**\n\nHorizontal memory\
    \ synchronization is the only viable method to propagate con-\n\ntext information\
    \ across the AS farm, hence to reduce the risks associated with the \n\nloss of\
    \ context data.\n\nUsually it will be performed to the peer AS (of an active/standby\
    \ pair); but why not \n\nto several AS, if the context data can be held in a suﬃciently\
    \ compact format.\n\nAlso here, buﬀering and resynchronization after outages is\
    \ a must.\n\nCompact, binary data structures are highly beneﬁcial to database\
    \ replication \n\nand memory synchronization, but other factors come into play\
    \ when selecting a \n\ndatabase schema (see Section 6.20).\n\n\\* As mentioned,\
    \ applications may also read from third party databases, through certain service\
    \ \n\ncapabilities."
  merge: -1
  pgno: 123
