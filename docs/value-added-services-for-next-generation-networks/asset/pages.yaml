  md: "networks, usually with end-to-end Security and Quality-of-Service enforcement.\
    \ The \n\nthroughput requirements are however not much lower than in SAN, even\
    \ though \n\nprevious responses can be cached in the application servers, if the\
    \ data are not too vol-\n\natile. Also, only persistent database information can\
    \ be shared this way (no transient \n\nin-memory data). Finally, Virtualization\
    \ is not a guarantee that the actual data will \n\nbe stored on multiple sites.\
    \ For a disaster-proof architecture, it is up to the application \n\ndeveloper\
    \ to make sure (or preferably at VAS Infrastructure level) that all processes\
    \ \n\nwrite to two diﬀerent databases (Data Source Names) located on diﬀerent\
    \ sites.\n\nThere’s a third possible storage strategy, besides SAN (brutal force)\
    \ and Virtu-\n\nalization (a partial solution). But it requires the VAS platform\
    \ supplier to develop \n\nhis own selective Database Replication strategy (top-down\
    \ — cf. Section 6.4) and \n\nMemory Synchronization (horizontal — cf. Section\
    \ 6.5). The in-memory data \n\nwill namely often end up being written and committed\
    \ to the database too. This \n\napproach will be less bandwidth-hungry, as storage\
    \ is local (inside the servers or \n\ndisk arrays on a local SAN). Only data requiring\
    \ to be replicated (insert, update and \n\ndelete queries), are actually transmitted\
    \ to the central master replication servers or \n\npeer servers. Read queries\
    \ are performed locally.\n\nWe believe it is a good idea to align the storage\
    \ strategy for both the Application \n\nand IT layers of the VAS platforms. Today,\
    \ with full throttle on Virtualization of \n\nIT infrastructures, but little attention\
    \ to VAS platforms, this is seldom the case.\n\n**6.22 Backup and Recovery**\n\
    \nBesides holding the same data, it is important for the Application Servers and\
    \ IT \n\nservers to beneﬁt from back-up and recovery procedures to and from the\
    \ so-called \n\ndisaster recovery (DR) sites.\n\nDR is a booming business, which\
    \ is, by the way, still a candidate to be out-\n\nsourced from many organizations.\n\
    \nDR sites have become the atomic bunkers of any sustainable business (e.g., \n\
    \ncommunication, banking, insurance, airlines). And it is tempting to test the\
    \ evacu-\n\nation procedure to these bunkers once and for all, namely, upon construction\
    \ of the \n\nbunker. Nobody also worries about what will happen when people ultimately\
    \ get \n\nout of such bunker, and huge data streams ﬂow out of their DR sites.\n\
    \nNow speaking about the scope of the backup, everyone would certainly agree \n\
    \nthat subscriber, account, and CDR databases should be backed up. IT administra-\n\
    \ntors could already be more skeptical about conﬁguration ﬁles and application\
    \ soft-\n\nware, but what if it took 10 hours to reinstall the software packages\
    \ and all patches, \n\nin order to restore a failed system?\n\n**6.23 Remote Access**\n\
    \nRemote access to a park of VAS servers should happen through a single entry\
    \ point \n\n(e.g., a terminal server) or at least a single sign-on procedure."
