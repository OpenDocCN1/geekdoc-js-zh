  md: "Managed communication networks and computing end-points may one day \n\nbecome\
    \ better allies than communication and storage.\n\n**1.4**\n\n**Means and Appropriateness**\n\
    \nThe explosion of number of available communication and storage methods requires\
    \ \n\nthe originator of the communication, but also the author of stored media\
    \ to make \n\nfrequent choices, based on the context of the communication.\n\n\
    The degree to which timely arrival, a response or unpredictable reactions \n\n\
    (i.e., genuine communication) are desired by the originator/author will drive\
    \ him/\n\nher to one of the readily available communication means or stored media\
    \ transmis-\n\nsion means.\n\nThe ultimate selection of some means requires judgment\
    \ and careful decision. \n\nThe receiver of the genuine communication or the transmitted\
    \ stored media will \n\nindeed make a judgment whether the means are appropriate\
    \ for the subject of the \n\ncommunication or message.\n\nThe appropriateness\
    \ may simply be a matter of common sense, personal inter-\n\npretation and company\
    \ policy. “Do not send large attachments to our entire staﬀ, \n\nbut post your\
    \ document on our intranet and distribute the link only,” your IT \n\nadministrator\
    \ might say. “And use YouTube to post your funny joke videos rather \n\nthan sending\
    \ them around as e-mails to your colleagues.”\n\nIn some cases, the choice could\
    \ be so complex that it requires public debate, \n\nlaws and/or court decisions.\n\
    \nIs it legal to ﬁre an employee by sms? Has the sms delivery notiﬁcation message\
    \ \n\n(the proof that the sms was delivered to the mobile phone) got the legal\
    \ value of an \n\nassigned letter in such case?\n\n![](img/c8fd2b908ba0cdfc90277ef68c496c74_17_0.png)\n\
    \n**Figure 1.3**\n\n**Storage is the cornerstone of computing, which is likely\
    \ to fuel com-**\n\n**munication. But storage also pushes back the need for communication.**"
