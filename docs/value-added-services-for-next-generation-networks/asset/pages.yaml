  md: "*q*\n\nHowever, with today’s highly personalized VAS, there’s a risk of explosion\
    \ of the \n\nnumber of Products. It is indeed tempting, whenever a new feature\
    \ X needs to be \n\nintroduced, to break down Product A into (i.e., divide Subscribers\
    \ among) a Prod-\n\nuct A1 containing the new feature and a Product A2 not containing\
    \ it. The next \n\nfeature comes along, and Products A11, A12, A21, and A22 appear.\n\
    \nTherefore it is interesting and necessary to create the object Option too, linked\
    \ \n\nto the Subscriber in a one-to-many relationship, and to the Product.\n\n\
    The communication service provider will acquire subscribers through diﬀerent \n\
    \ndirect and indirect channels, with potentially diﬀerent requirements in terms\
    \ of \n\navailable applications and features. It is a good idea to link the Subscribers\
    \ and the \n\nProduct Types to a Channel object. Diﬀerent Channels could also\
    \ represent internal \n\nand test subscribers. CRM agents belonging to a given\
    \ Channel should be entitled \n\nto view and update only their “slice” (Subscribers,\
    \ Products) of the system.\n\nThe platform-wide Subscriber-Product-Option-Channel\
    \ paradigm has proven \n\nto be very diﬃcult to add, once diﬀerent Subscriber\
    \ objects had been deﬁned in \n\nmultiple applications.\n\nIt is therefore something\
    \ to be enforced at the heart of the VAS platform, as part \n\nof the fundamental\
    \ infrastructure, or even throughout the entire communication \n\nservice provider\
    \ organization.\n\n**6.21 Storage Strategy**\n\nThe persistent data model needs\
    \ to be stored in nonvolatile media: typically, hard \n\ndisk drives.\n\nThese\
    \ can be located inside each VAS server, or centrally deployed as disk \n\narrays,\\\
    * accessed by the servers via a SAN (Storage Access Network) — usually \n\nusing\
    \ optical ﬁber channels. Hard disk controllers (whether inside the server, or\
    \ in \n\ncentral disk arrays), will normally write the same information on two\
    \ hard disks, a \n\nprinciple called mirroring.\n\nWhereas mirroring is a must,\
    \ the degree of redundancy of the disk arrays and \n\nof the (single or dual)\
    \ controllers inside each disk array is to be appreciated by the \n\nVAS supplier\
    \ and the NGN communication service provider.\n\nThe inconvenient truth about\
    \ SAN is that they require immense and unpredictable \n\nbandwidth between a server\
    \ on site A and a disk array on site B (in the order of a few \n\nto hundreds\
    \ of Mbit/s), which is a problem in wide area and transnational set-ups. The \n\
    \nbandwidth needs to be purchased from transmission providers (e.g., STM-1, OC-3)\
    \ \n\nrather than from Internet service providers — a much more competitive sector.\n\
    \nTherefore the new trend in IT industry is called Virtualization: database servers\
    \ \n\non central sites are accessed by decentralized, remotely located application\
    \ servers \n\n(VAS servers in this case), using SQL\\*Net, LDAP or other protocols;\
    \ over MPLS/IP \n\n\\* Not to be confused with a database server."
  merge: -1
