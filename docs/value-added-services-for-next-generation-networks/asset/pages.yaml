  md: "*g*\n\n*g*\n\n*g*\n\n*q*\n\n**5.7**\n\n**Advice of Charge**\n\nAs the complexity\
    \ of the product catalog and account structure increases, so does \n\nthe need\
    \ for clear Advice of Charge (AoC) to the end user, and sometimes explicit \n\n\
    acknowledgement or even additional authentication, in advance of actually deliver-\n\
    \ning the service.\n\nIn PSTN, toll exchanges completing premium rate calls are\
    \ able to inform \n\nthe originating local exchange of the tariﬀ in real time\
    \ (through signaling). The \n\noriginating local exchange can then inform payphones\
    \ of the charges to be applied\n\n(16 KHz pulses).\n\nIn some countries it is\
    \ a legal requirement to inform the customer of the tariﬀ \n\nof premium rate\
    \ calls, premium SMS, or to inform the caller that the destination \n\nnumber\
    \ is ported out (with a warning beep).\n\nMetering devices are also able to redirect\
    \ the mobile data request to an AoC \n\npage, or to insert the AoC information\
    \ in the downlink content.\n\nWhat will be the price of SIP sessions to various\
    \ destination domains, \n\nworldwide?\n\nIncreasingly for data services and next\
    \ generation services, the operator will \n\nbe held accountable for informing\
    \ the users and partners of costs, in advance of \n\ndelivering the actual service.\n\
    \nIn the NGN standards there’s currently no sign of an AoC facility.\n\nEarly\
    \ adopters won’t bother, but cost conscious users might hesitate to use the \n\
    \nservices.\n\n**5.8**\n\n**Redirection**\n\nAs mentioned above, mobile data users\
    \ are sometimes redirected to AoC pages or \n\npopup windows and may explicitly\
