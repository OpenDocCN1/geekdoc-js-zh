  md: "There are many questions around combinatory services, and it is much too early\
    \ \n\nto rush into (e.g., 3GPP IMS) standardization.\n\n**7.5**\n\n**Contact List\
    \ Overlay**\n\nWe have addressed the need for network-based contact lists and\
    \ tribe memberships \n\nin Section 1.11.\n\nIt is time for communication service\
    \ providers to provide the network-based \n\naddress book, or at least to periodically\
    \ synchronize the NGN device’s address book \n\nwith the network-based copy.\n\
    \nIt’s so easy to join a company or soccer club and have access to all employees\
    \ \n\nand members from day one. How much more would we communicate if things \n\
    \nwere so easy?\n\nHow easy would be the decision to change your NGN device monthly,\
    \ or even \n\nhave several for diﬀerent uses, if you didn’t have to worry about\
    \ your address book \n\nanymore and, by extension, your agenda, tasks, and messages?\n\
    \nThe IETF SIMPLE group has proposed the PIDF (see Section 3.2.3.3), laying \n\
    \nthe groundwork for a standards-based form of Plaxo, today’s leading network-based\
    \ \n\naddress book.\n\nHuge developments are to be expected if the NGN User Agent\
    \ starts to be con-\n\nsidered as a contacts repository too, rather than today\
    \ only as a session establisher, \n\ncodec negotiator and media encoder/decoder.\n\
    \n**7.6**\n\n**Voice on Web**\n\nIs a NGN user agent — a downloadable piece of\
    \ software as we know it today — \n\ninstalled in your PC for a few months or\
    \ years?\n\nSince the advent of voice-on-Web,\\* one can doubt it. In such cases,\
    \ the software of \n\nthe user agent is perhaps downloaded and executed as an\
    \ ActiveX component setting \n\nup the session (SIP INVITE). It might even be\
    \ the site itself (the Web server) register-\n\ning itself as User Agent in the\
    \ NGN and setting up the sessions.\n\nIt was already obvious from the skins on\
    \ music playing software, that end users \n\nwould expect the looks of their music,\
    \ video and communication software to be \n\nfully customizable.\n\nBut it would\
    \ be suﬃcient to add “NGN buttons” to existing Web sites, “desk-\n\nbars” to the\
    \ user’s desktop PC environment, and so on.\n\nPerhaps one day we will start a\
    \ SIP session when clicking on a Google adword, \n\nor a term in Wikipedia? Ask\
    \ the experts …\n\n\\* The abbeyphone.com site by Abbeynet.com is a “SIP VoIP\
    \ Web portal.”"
