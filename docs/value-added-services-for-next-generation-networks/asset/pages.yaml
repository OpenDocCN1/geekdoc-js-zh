  md: "*g*\n\n*g*\n\nLeading suppliers and more than a dozen start-up companies have\
    \ succeeded to \n\nbuild and commercialize these platforms, which are now commonly\
    \ considered as \n\nthe “edge routers” and “ﬁrewalls” of Next Generation Networks.\n\
    \n**4.8**\n\n**ASP Interconnections**\n\nIn the past, various standards had been\
    \ proposed to open a service provider’s net-\n\nwork to third party Application\
    \ Service Providers (ASP).\n\nMore speciﬁcally, the standards bodies launched\
    \ open Application Program-\n\nming Interfaces (API’s) that could be oﬀered to\
    \ ASP’s, allowing them to use the \n\nService Capabilities (“the bottom part”)\
    \ of the VAS platforms.\n\nThe common point of these standards (e.g., Java J2EE,\
    \ Parlay, Parlay X, OMA) \n\nis that they are very focused on the mechanics of\
    \ call control, but overlooked essen-\n\ntial aspects such as subscription (which\
    \ ASP may interact with which user), inter-\n\noperator accounting (how would\
    \ revenue be shared) or media (who would play \n\nannouncements, ring tones, videos,\
    \ etc.).\n\nTherefore, they appeared to be very unsuccessful at opening up PSTN\
    \ and \n\nGSM networks to developer communities.\n\nIn the future, VAS platforms\
    \ may of course be further developed to oﬀer access to \n\ntheir service capabilities,\
    \ by third party ASP’s, for charging or content delivery pur-\n\nposes. We’ll\
    \ take a look at this strategy in Sections 5.12 and 6.18, respectively.\n\nOn\
    \ the other hand, GSM service providers have been successful at building \n\n\
    up a network of premium SMS service providers (e.g., SMS “Large Accounts,” \n\n\
    “Short Codes”) via pretty basic TCP/IP protocols\\*. These SMS service providers\
    \ \n\nare semi-trustable; constant monitoring is required to protect the GSM end\
    \ users \n\nfrom fraud, scams and spam.\n\nCan the NGN be opened up in a similarly\
    \ simple way, but including better \n\nsecurity, in order to connect more ASPs\
    \ in the long term?\n\nWhen SMPP was conceived, the GSM network was not accessible\
    \ by IP.\n\nBut fundamentally, in an NGN, where IP access is ubiquitous, is there\
    \ still a \n\nreason to make a distinction between an end user and an ASP?\n\n\
    End users are, for example, admitted to a 3GPP IMS based after ISIM authenti-\n\
    \ncation and authorization based on a proﬁle held in the HSS (see Section 3.3.2).\n\
    \nAnd as we saw in the previous section, enterprises, access networks, and peer\
    \ \n\nNGNSP will be admitted to the NGN core network by SBCs.\n\nIf we want to\
    \ avoid developing yet another access method, besides end user \n\naccess (via\
    \ IMS P-CSCF) and SBCs (TISPAN I-BCF), should ASPs then be treated \n\nas end\
    \ users, or as peer networks?\n\n\\* For example, Short Message Peer to Peer,\
    \ developed by a little Irish company Aldiscon, later \n\nacquired by Logica,\
    \ now LogicaCMG; in 1999, SMPP was handed over to the SMS forum."
