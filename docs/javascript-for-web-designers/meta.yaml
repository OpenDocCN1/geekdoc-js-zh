    }\n```\n\n### break and continue\nThe `break` statement is used to exit a loop\
    \ early. The `continue` statement is used to skip the current iteration of a loop\
    \ and move to the next one.\n\n```javascript\nfor (var i = 0; i < 10; i++) {\n\
    \  if (i === 5) {\n    break;\n  }\n  console.log(i);\n}\n\nfor (var i = 0; i\
    \ < 10; i++) {\n  if (i === 5) {\n    continue;\n  }\n  console.log(i);\n}\n```\n\
    \n### nested loops\nA nested loop is a loop inside another loop. This is often\
