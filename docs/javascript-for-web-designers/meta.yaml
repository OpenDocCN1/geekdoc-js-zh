- md: "\n- The `while` loop executes a block of code as long as a specified condition\
    \ is true.\n- In the example below, the loop continues until the random number\
    \ is equal to 3.\n\n```javascript\nvar random = Math.floor( Math.random() * 10\
    \ );\nwhile( random !== 3 ){\n  console.log( \"Nope, not \" + random );\n  var\
    \ random = Math.floor( Math.random() * 10 );\n}\nconsole.log( \"Got it!\" );\n\
    ```\n*Nope, not 5*\n*Nope, not 9*\n*Nope, not 2*\n*Got it!*\n\nIn the example\
    \ below, we use a `while` loop to print a random number until it matches 5.\n\n\
    ```javascript\nvar random = Math.floor( Math.random() * 10 );\nwhile(random !==\
    \ 5){\n  console.log( \"Is it... \" + random );\n  random = Math.floor( Math.random()\
    \ * 10 );\n}\nconsole.log( \"Got it!\" );\n```\n\n*Is it... 1*\n*Is it... 4*\n\
    *Is it... 7*\n*Is it... 3*\n\nThe `do...while` loop is similar to the `while`\
    \ loop, but with one key difference: it executes the code block at least once\
    \ before checking the condition. \n\n```javascript\nvar i = 0;\ndo {\n  console.log(\
    \ \"Loop.\" );\n  i++;\n} while (i < 3);\n```\n*(3) Loop.*\n\nIn the example below,\
    \ the `do...while` loop is used to print a random number until it is equal to\
    \ 3.\n\n```javascript\nvar random;\ndo {\n  console.log( \"Is it... \" + random\
    \ );\n  random = Math.floor( Math.random() * 10 );\n} while (random !== 3);\n\
    console.log( \"Got it!\" );\n```\n*Is it... 2*\n*Is it... 8*\n*Is it... 0*\n*Is\
    \ it... 3*\n\nThe `break` statement can be used to exit a loop prematurely, regardless\
    \ of whether the condition is still true.\n\n```javascript\n/* #1 \"This is a\
    \ loop with a break\" */\nvar i = 0;\nwhile(true){\n  console.log( \"This is a\
    \ loop with a break \" + i );\n  if(i === 5){\n    break;\n  }\n  i++;\n}\n```\n\
    In the example below, the `break` statement is used to exit the loop when `i`\
    \ reaches 5.\n\n```javascript\nvar i = 0;\nwhile(true){\n  console.log( \"This\
    \ is a loop with a break \" + i );\n  if(i === 5){\n    break;\n  }\n  i++;\n\
    }\n```\n\nThe `continue` statement is used to skip the rest of the current loop\
    \ iteration and jump to the next iteration.\n\n```javascript\nfor( var i = 0;\
    \ i < 5; i++ ) {\n  console.log(i);\n}\n```\n*0*\n*1*\n*2*\n*3*\n*4*\n\nIn the\
    \ example below, the `continue` statement is used to skip the rest of the loop\
    \ when `i` is equal to 2.\n\n```javascript\nfor( var i = 0; i < 5; i++ ) {\n \
    \ if(i === 2){\n    continue;\n  }\n  console.log(i);\n}\n```\n*0*\n*1*\n*3*\n\
    *4*\n\nThe `continue` statement is used to skip the rest of the loop iteration\
    \ when `i` is equal to 2.\n\n```javascript\nfor( var i = 0; i < 5; i++ ) {\n \
    \ if(i === 2){\n    continue;\n  }\n  console.log(i);\n}\n```\n*0*\n*1*\n*3*\n\
    *4*\n\nThe `break` statement is used to exit the loop when `i` is equal to 2.\n\
    \n```javascript\nfor( var i = 0; i < 5; i++ ) {\n  if(i === 2){\n    break;\n\
    \  }\n  console.log(i);\n}\n```\n*0*\n*1*\n\nThe `continue` statement is used\
    \ to skip the rest of the loop iteration when `i` is equal to 2.\n\n```javascript\n\
    for( var i = 0; i < 5; i++ ) {\n  if(i === 2){\n    continue;\n  }\n  console.log(i);\n\
    }\n```\n*0*\n*1*\n*3*\n*4*\n\nThe `break` statement is used to exit the loop when\
    \ `i` is equal to 2.\n\n```javascript\nfor( var i = 0; i < 5; i++ ) {\n  if(i\
    \ === 2){\n    break;\n  }\n  console.log(i);\n}\n```\n*0*\n*1*\n\nThe `break`\
    \ statement is used to exit the loop when the `concatString` length reaches 5.\n\
    \n```javascript\nvar concatString = \"a\";\nwhile(true) {\n  concatString = concatString\
    \ + \"a\";\n  if(concatString.length === 5){\n    break;\n  }\n  console.log(concatString);\n\
    }\n```\n*aa*\n*aaa*\n*aaaa*\n\nAn infinite loop is a loop that never ends because\
    \ the condition is always true.\n\n```javascript\nwhile(true) {\n  console.log(\
    \ \"This is an infinite loop\" );\n}\n```\n\nAn infinite loop can be broken out\
    \ using the `break` statement.\n\n```javascript\nvar i = 0;\nwhile(true) {\n \
    \ console.log( \"This is an infinite loop \" + i );\n  if(i === 10){\n    break;\n\
    \  }\n  i++;\n}\n```\n\n### window: THE GLOBAL CONTEXT\nThe `window` object is\
    \ the global context in the browser. It contains all the global variables and\
    \ functions available in the browser.\n\n```javascript\nwindow\n```\nThe `window`\
    \ object is the global context in the browser. It contains all the global variables\
    \ and functions available in the browser.\n\n```javascript\nwindow\n```\nThe `window`\
    \ object is the global context in the browser. It contains all the global variables\
    \ and functions available in the browser.\n\n```javascript\nwindow\n```\nThe `window`\
    \ object is the global context in the browser. It contains all the global variables\
    \ and functions available in the browser.\n"
  mdcn: "\n\n- `while` 循环只要指定的条件为真，就会一直执行代码块。\n- 在下面的示例中，循环将一直持续，直到随机数等于 3。\n\n```javascript\n\
    var random = Math.floor( Math.random() * 10 );\nwhile( random !== 3 ){\n  console.log(\
    \ \"Nope, not \" + random );\n  var random = Math.floor( Math.random() * 10 );\n\
    }\nconsole.log( \"Got it!\" );\n```\n*Nope, not 5*\n*Nope, not 9*\n*Nope, not\
    \ 2*\n*Got it!*\n\n在下面的示例中，我们使用 `while` 循环打印随机数，直到它匹配 5。\n\n```javascript\nvar\
    \ random = Math.floor( Math.random() * 10 );\nwhile(random !== 5){\n  console.log(\
    \ \"Is it... \" + random );\n  random = Math.floor( Math.random() * 10 );\n}\n\
    console.log( \"Got it!\" );\n```\n\n*Is it... 1*\n*Is it... 4*\n*Is it... 7*\n\
    *Is it... 3*\n\n`do...while` 循环与 `while` 循环相似，但有一个关键区别：它在检查条件之前至少会执行一次代码块。\n\n\
    ```javascript\nvar i = 0;\ndo {\n  console.log( \"Loop.\" );\n  i++;\n} while\
    \ (i < 3);\n```\n*(3) Loop.*\n\n在下面的示例中，使用 `do...while` 循环打印随机数，直到它等于 3。\n\n```javascript\n\
    var random;\ndo {\n  console.log( \"Is it... \" + random );\n  random = Math.floor(\
    \ Math.random() * 10 );\n} while (random !== 3);\nconsole.log( \"Got it!\" );\n\
    ```\n*Is it... 2*\n*Is it... 8*\n*Is it... 0*\n*Is it... 3*\n\n`break` 语句可用于提前退出循环，无论条件是否仍然为真。\n\
    \n```javascript\n/* #1 \"This is a loop with a break\" */\nvar i = 0;\nwhile(true){\n\
    \  console.log( \"This is a loop with a break \" + i );\n  if(i === 5){\n    break;\n\
    \  }\n  i++;\n}\n```\n在下面的示例中，`break` 语句用于在 `i` 达到 5 时退出循环。\n\n```javascript\n\
    var i = 0;\nwhile(true){\n  console.log( \"This is a loop with a break \" + i\
    \ );\n  if(i === 5){\n    break;\n  }\n  i++;\n}\n```\n\n`continue` 语句用于跳过当前循环迭代的剩余部分并跳转到下一次迭代。\n\
    \n```javascript\nfor( var i = 0; i < 5; i++ ) {\n  console.log(i);\n}\n```\n*0*\n\
    *1*\n*2*\n*3*\n*4*\n\n在下面的示例中，`continue` 语句用于在 `i` 等于 2 时跳过循环的剩余部分。\n\n```javascript\n\
    for( var i = 0; i < 5; i++ ) {\n  if(i === 2){\n    continue;\n  }\n  console.log(i);\n\
    }\n```\n*0*\n*1*\n*3*\n*4*\n\n`continue` 语句用于在 `i` 等于 2 时跳过循环迭代的剩余部分。\n\n```javascript\n\
    for( var i = 0; i < 5; i++ ) {\n  if(i === 2){\n    continue;\n  }\n  console.log(i);\n\
    }\n```\n*0*\n*1*\n*3*\n*4*\n\n`break` 语句用于在 `i` 等于 2 时退出循环。\n\n```javascript\n\
    for( var i = 0; i < 5; i++ ) {\n  if(i === 2){\n    break;\n  }\n  console.log(i);\n\
    }\n```\n*0*\n*1*\n\n`continue` 语句用于在 `i` 等于 2 时跳过循环迭代的剩余部分。\n\n```javascript\n\
    for( var i = 0; i < 5; i++ ) {\n  if(i === 2){\n    continue;\n  }\n  console.log(i);\n\
    }\n```\n*0*\n*1*\n*3*\n*4*\n\n`break` 语句用于在 `i` 等于 2 时退出循环。\n\n```javascript\n\
    for( var i = 0; i < 5; i++ ) {\n  if(i === 2){\n    break;\n  }\n  console.log(i);\n\
    }\n```\n*0*\n*1*\n\n`break` 语句用于在 `concatString` 长度达到 5 时退出循环。\n\n```javascript\n\
    var concatString = \"a\";\nwhile(true) {\n  concatString = concatString + \"a\"\
    ;\n  if(concatString.length === 5){\n    break;\n  }\n  console.log(concatString);\n\
    }\n```\n*aa*\n*aaa*\n*aaaa*\n\n无限循环是指条件始终为真而永远不会结束的循环。\n\n```javascript\nwhile(true)\
    \ {\n  console.log( \"This is an infinite loop\" );\n}\n```\n\n无限循环可以使用 `break`\
    \ 语句跳出。\n\n```javascript\nvar i = 0;\nwhile(true) {\n  console.log( \"This is\
    \ an infinite loop \" + i );\n  if(i === 10){\n    break;\n  }\n  i++;\n}\n```\n\
    \n### window: 全局上下文\n`window` 对象是浏览器中的全局上下文。它包含了浏览器中可用的全局变量和函数。\n\n```javascript\n\
