- md: "\n## Conditional Statements\n\nIn JavaScript, `if` statements are used to根据条件执行特定的代码。如果条件为真，大括号中的代码将运行。\n\
    \n```javascript\nfunction addNumbers(num1, num2) {\n  return num1 + num2;\n}\n\
    addNumbers(2, 3); // 5\ntypeof addNumbers(2, 2); // \"number\"\n```\n\n```javascript\n\
    function addNumbers(num1, num2) {\n  return num1 + num2;\n}\nvar sum = addNumbers(2,\
    \ 3); // 5\ntypeof sum // \"number\"\n```\n\nThe `else` statement allows you to\
    \ execute code only if the condition is false.\n\n```javascript\nfunction combineStrings(firstString,\
    \ secondString) {\n  return firstString + secondString;\n  console.log(\"Hello?\
    \ Can anyone hear me?\");\n}\ncombineStrings(\"Test\", \"strings\"); // \"Test\
    \ strings\"\n```\n\nThe `else if` statement allows you to check multiple conditions\
    \ in sequence.\n\n```javascript\nvar score = 85;\nif (score >= 90) {\n  console.log(\"\
    A\");\n} else if (score >= 80) {\n  console.log(\"B\");\n} else if (score >= 70)\
    \ {\n  console.log(\"C\");\n} else {\n  console.log(\"F\");\n}\n```\n\nThe `length`\
    \ property is used to determine the number of characters in a string or elements\
    \ in an array.\n\n```javascript\nvar name = \"John\";\nif (name.length > 5) {\n\
    \  console.log(\"Long name\");\n} else {\n  console.log(\"Short name\");\n}\n\
    ```\n\n```javascript\nvar maths = 5;\nif (maths == 5) {\n  console.log(\"This\
    \ number is five.\");\n}\n```\n\n```javascript\nvar foo = false;\nif (foo) {\n\
    \  /* Any code placed here will never execute, unless you change foo to true */\n\
    } else {\n  // This code runs because foo is false\n}\n```\n\n```javascript\n\
    var maths = 2;\nif (maths > 5) {\n  console.log(\"Greater than five.\");\n} else\
    \ {\n  console.log(\"Less than or equal to five.\");\n}\n```\n\n```javascript\n\
    var lunch = \"burrito\";\nif (lunch == \"gravel\") {\n  console.log(\"That isn't\
    \ food.\");\n} else if (lunch == \"burrito\") {\n  console.log(\"A burrito is\
    \ an excellent choice.\");\n} else {\n  console.log(\"It might not have been a\
    \ burrito, but at least it wasn't gravel.\");\n}\n```\n"
  mdcn: "\n\n## 条件语句\n\n在 JavaScript 中，`if` 语句用于根据条件执行特定的代码。如果条件为真，大括号中的代码将运行。\n\n\
    ```javascript\nfunction addNumbers(num1, num2) {\n  return num1 + num2;\n}\naddNumbers(2,\
    \ 3); // 5\ntypeof addNumbers(2, 2); // \"number\"\n```\n\n```javascript\nfunction\
    \ addNumbers(num1, num2) {\n  return num1 + num2;\n}\nvar sum = addNumbers(2,\
    \ 3); // 5\ntypeof sum // \"number\"\n```\n\n`else` 语句允许你仅在条件为假时执行代码。\n\n```javascript\n\
    function combineStrings(firstString, secondString) {\n  return firstString + secondString;\n\
    \  console.log(\"Hello? Can anyone hear me?\");\n}\ncombineStrings(\"Test\", \"\
    strings\"); // \"Test strings\"\n```\n\n`else if` 语句允许你按顺序检查多个条件。\n\n```javascript\n\
    var score = 85;\nif (score >= 90) {\n  console.log(\"A\");\n} else if (score >=\
    \ 80) {\n  console.log(\"B\");\n} else if (score >= 70) {\n  console.log(\"C\"\
    );\n} else {\n  console.log(\"F\");\n}\n```\n\n`length` 属性用于确定字符串中的字符数或数组中的元素个数。\n\
    \n```javascript\nvar name = \"John\";\nif (name.length > 5) {\n  console.log(\"\
    Long name\");\n} else {\n  console.log(\"Short name\");\n}\n```\n\n```javascript\n\
    var maths = 5;\nif (maths == 5) {\n  console.log(\"This number is five.\");\n\
    }\n```\n\n```javascript\nvar foo = false;\nif (foo) {\n  /* 此处的任何代码永远不会执行，除非你将\
    \ foo 改为 true */\n} else {\n  // 这段代码会运行是因为 foo 是 false\n}\n```\n\n```javascript\n\
    var maths = 2;\nif (maths > 5) {\n  console.log(\"Greater than five.\");\n} else\
    \ {\n  console.log(\"Less than or equal to five.\");\n}\n```\n\n```javascript\n\
    var lunch = \"burrito\";\nif (lunch == \"gravel\") {\n  console.log(\"That isn't\
    \ food.\");\n} else if (lunch == \"burrito\") {\n  console.log(\"A burrito is\
    \ an excellent choice.\");\n} else {\n  console.log(\"It might not have been a\
    \ burrito, but at least it wasn't gravel.\");\n}\n```\n\n"
