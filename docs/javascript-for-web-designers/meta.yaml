    secondObject.containsName(); // true\n```\n\n但是，这种方法也有一个缺陷：如果一个对象本身有一个名为 `name`\
    \ 的属性（即使其值为 `false`），`for...in` 循环也会检测到这个属性。为了解决这个问题，我们可以使用 `hasOwnProperty` 方法来检查属性是否是属于对象本身的：\n\
    \n```javascript\nObject.prototype.containsName = function() {\n  var result =\
    \ false;\n  for( var key in this ) {\n    if(this.hasOwnProperty(key) && key ===\
    \ \"name\") {\n      result = true;\n    }\n  }\n  return result;\n};\n```\n\n\
    ### 使用 hasOwnProperty\n\n`hasOwnProperty` 方法用于检查对象是否直接拥有某个属性，而不是通过原型链继承该属性。\n\n\
    ```javascript\nvar swamp = {\n  \"bunk1\": \"Hawkeye\",\n  \"bunk2\": \"BJ\",\n\
    \  \"bunk3\": \"Frank\"\n};\n\nfor( var bunk in swamp ) {\n  if(swamp.hasOwnProperty(bunk))\
    \ {\n    console.log(swamp[bunk]);\n  }\n}\n// 输出: Hawkeye, BJ, Frank\n```\n\n\
    然而，如果我们想遍历一个对象的所有属性（包括原型链上的属性），`for...in` 配合 `hasOwnProperty` 就不够了。我们可以手动遍历原型链：\n\
    \n```javascript\nObject.prototype.customPrototypeMethod = function() {\n  console.log(\
