- md: "\n## 1. What is JavaScript?\n\nJavaScript is a lightweight, interpreted programming\
    \ language that follows the ECMAScript specification. It is one of the core technology\
    \ technologies of the World Web, along with HTML and CSS. While it is primarily\
    \ used to make web pages interactive, it is also used in server-side development\
    \ through Node.js.\n\n- JavaScript is a versatile language.\n- It is widely used\
    \ in web browsers.\n- It supports both client-side and server-side development.\n\
    \n## 2. Including JavaScript in HTML\n\nTo include JavaScript in your HTML document,\
    \ you use the `<script>` tag. There are two main ways to load scripts: `async`\
    \ and `defer`.\n\n```html\n<script async></script>\n<script defer></script>\n\
    ```\n\n- The async attribute allows the script to be downloaded in the background\
    \ and executed as soon as it's available.\n- The defer attribute allows the script\
    \ to be downloaded in the background but executes it only after the HTML document\
    \ has been completely parsed.\n\nExample:\n```html\n<script src=\"script.js\"\
    \ async></script>\n<script src=\"script.js\" defer></script>\n```\n\n## 3. JavaScript\
    \ Variables and Constants\n\nVariables are used to store data values. In JavaScript,\
    \ there are three ways to declare variables: `let`, `const`, and `var`.\n\n```javascript\n\
    let name = \"John\";\nconst age = 30;\nvar city = \"London\";\n```\n\n- `let`\
    \ is used for variables that can be reassigned.\n- `const` is used for constants\
    \ that cannot be reassigned.\n- `var` is the older way of declaring variables\
    \ and is function-scoped.\n\n## 4. JavaScript Data Types\n\nJavaScript has several\
    \ primitive data types:\n\n- String: `\"Hello\"`\n- Number: `42`, `3.14`\n- Boolean:\
    \ `true`, `false`\n- Undefined: Variable declared but not assigned a value\n-\
    \ Null: Intentional empty value\n- Symbol: Unique identifiers\n- BigInt: For very\
    \ large integers\n\n## 5. JavaScript Functions\n\nFunctions are blocks of code\
    \ designed to perform a particular task.\n\n```javascript\nfunction greet(name)\
    \ {\n  return \"Hello, \" + name;\n}\n\nconsole.log(greet(\"World\"));\n```\n\n\
    You can also use arrow functions:\n\n```javascript\nconst greet = (name) => `Hello,\
    \ ${name}`;\n```\n\n## 6. JavaScript Control Flow\n\nControl flow allows you to\
    \ make decisions in your code. \n\n```javascript\nlet hour = 15;\n\nif (hour <\
    \ 12) {\n  console.log(\"Good morning\");\n} else if (hour < 18) {\n  console.log(\"\
    Good afternoon\");\n} else {\n  console.log(\"Good evening\");\n}\n```\n\nLoops\
    \ are used to repeat code:\n\n```javascript\nfor (let i = 0; i < 5; i++) {\n \
    \ console.log(i);\n}\n```\n\n## 7. JavaScript Arrays\n\nArrays are used to store\
    \ multiple variables in one.\n\n```javascript\nlet fruits = [\"Apple\", \"Banana\"\
    , \"Cherry\"];\nconsole.log(fruits[0]); // Apple\nfruits.push(\"Orange\"); //\
    \ Adds to end\nconsole.log(fruits.length); // 4\n```\n\n## 8. JavaScript Objects\n\
    \nObjects are collections of properties (key-value pairs).\n\n```javascript\n\
    const user = {\n  firstName: \"Jane\",\n  lastName: \"Doe\",\n  age: 25\n};\n\n\
    console.log(user.firstName); // Jane\nuser.age = 26;\n```\n\n## 9. JavaScript\
    \ DOM Manipulation\n\nThe DOM (Document Object Model) allows JavaScript to change\
    \ HTML content and CSS.\n\n```javascript\nconst title = document.getElementById(\"\
    title\");\ntitle.textContent = \"New Title\";\n\nconst btn = document.querySelector(\"\
    .btn\");\nbtn.style.backgroundColor = \"red\";\n```\n\n## 10. JavaScript Events\n\
    \nEvents are actions that happen in the browser, like clicks or key presses.\n\
    \n```javascript\nconst button = document.querySelector(\"button\");\n\nbutton.addEventListener(\"\
    click\", () => {\n  alert(\"Button clicked!\");\n});\n```\n\n## 11. JavaScript\
    \ Fetch API\n\nThe Fetch API is used to make network requests.\n\n```javascript\n\
    fetch('https://api.example.com/data')\n  .then(response => response.json())\n\
    \  .then(data => console.log(data))\n  .catch(error => console.error(\"Error:\"\
    , error));\n```\n\n## 12. JavaScript Async/Await\n\nAsync/await provides a cleaner\
    \ way to handle asynchronous operations.\n\n```javascript\nasync function fetchData()\
    \ {\n  try {\n    const response = await fetch('https://api.example.com/data');\n\
    \    const data = await response.json();\n    console.log(data);\n  } catch (error)\
    \ {\n    console.error(\"Error:\", error);\n  }\n}\n```\n"
  mdcn: "\n\n## 1. 什么是 JavaScript?\n\nJavaScript 是一种轻量级的解释型编程语言，遵循 ECMAScript 。它和\
    \ HTML 以及 CSS 一样，是网页的核心技术之一。虽然它主要用于制作交互网页，但也通过 Node.js 用于服务器端开发。\n\n- JavaScript\
    \ 是一种多功能的语言。\n- 它在网页浏览器中被广泛使用。\n- 它支持客户端和服务器开发。\n\n## 2. 在 HTML 中引入 JavaScript\n\
    \n要在 HTML 文档中引入 JavaScript，你可以使用 `<script>` 标签。加载脚本有两种主要方式：`async` 和 `defer`。\n\
    \n```html\n<script async></script>\n<script defer></script>\n```\n\n- `async`\
    \ 属性允许脚本在后台下载并在下载完成后立即执行。\n- `defer` 属性允许脚本在后台下载，但会在 HTML 文档完全解析后才执行。\n\n示例：\n\
    ```html\n<script src=\"script.js\" async></script>\n<script src=\"script.js\"\
    \ defer></script>\n```\n\n## 3. JavaScript 变量与常量\n\n变量用于存储数据值。在 JavaScript 中，有三种声明变量的方式：`let`、`const`\
    \ 和 `var`。\n\n```javascript\nlet name = \"John\";\nconst age = 30;\nvar city =\
    \ \"London\";\n```\n\n- `let` 用于可以重新赋值的变量。\n- `const` 用于不可重新赋值的常量。\n- `var` 是声明变量的旧方式，具有函数作用域。\n\
    \n## 4. JavaScript 数据类型\n\nJavaScript 具有几种原始数据类型：\n\n- 字符串 (String): `\"Hello\"\
    `\n- 数字 (Number): `42`, `3.14`\n- 布尔值 (Boolean): `true`, `false`\n- 未定义 (Undefined):\
    \ 已声明但未赋值的变量\n- 空 (Null): 刻意的空值\n- 符号 (Symbol): 唯一标识符\n- 大整数 (BigInt): 用于非常大的整数\n\
    \n## 5. JavaScript 函数\n\n函数是执行特定任务的代码块。\n\n```javascript\nfunction greet(name)\
    \ {\n  return \"Hello, \" + name;\n}\n\nconsole.log(greet(\"World\"));\n```\n\n\
    你也可以使用箭头函数：\n\n```javascript\nconst greet = (name) => `Hello, ${name}`;\n```\n\
    \n## 6. JavaScript 控制流\n\n控制流允许你在代码中做出决策。\n\n```javascript\nlet hour = 15;\n\n\
    if (hour < 12) {\n  console.log(\"Good morning\");\n} else if (hour < 18) {\n\
    \  console.log(\"Good afternoon\");\n} else {\n  console.log(\"Good evening\"\
    );\n}\n```\n\n循环用于重复代码：\n\n```javascript\nfor (let i = 0; i < 5; i++) {\n  console.log(i);\n\
    }\n```\n\n## 7. JavaScript 数组\n\n数组用于在一个变量中存储多个值。\n\n```javascript\nlet fruits\
    \ = [\"Apple\", \"Banana\", \"Cherry\"];\nconsole.log(fruits[0]); // Apple\nfruits.push(\"\
    Orange\"); // 添加到末尾\nconsole.log(fruits.length); // 4\n```\n\n## 8. JavaScript\
    \ 对象\n\n对象是属性（键值对）的集合。\n\n```javascript\nconst user = {\n  firstName: \"Jane\"\
    ,\n  lastName: \"Doe\",\n  age: 25\n};\n\nconsole.log(user.firstName); // Jane\n\
    user.age = 26;\n```\n\n## 9. JavaScript DOM 操控\n\nDOM（文档对象模型）允许 JavaScript 更改\
    \ HTML 内容和 CSS。\n\n```javascript\nconst title = document.getElementById(\"title\"\
    );\ntitle.textContent = \"New Title\";\n\nconst btn = document.querySelector(\"\
    .btn\");\nbtn.style.backgroundColor = \"red\";\n```\n\n## 10. JavaScript 事件\n\n\
    事件是浏览器发生的动作，例如点击或按键。\n\n```javascript\nconst button = document.querySelector(\"\
    button\");\n\nbutton.addEventListener(\"click\", () => {\n  alert(\"Button clicked!\"\
    );\n});\n```\n\n## 11. JavaScript Fetch API\n\nFetch API 用于发送网络请求。\n\n```javascript\n\
    fetch('https://api.example.com/data')\n  .then(response => response.json())\n\
    \  .then(data => console.log(data))\n  .catch(error => console.error(\"Error:\"\
    , error));\n```\n\n## 12. JavaScript Async/Await\n\nAsync/Await 提供了一种更简洁的方式来处理异步操作。\n\
    \n```javascript\nasync function fetchData() {\n  try {\n    const response = await\
    \ fetch('https://api.example.com/data');\n    const data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error(\"Error:\", error);\n\
    \  }\n}\n```\n\n"
