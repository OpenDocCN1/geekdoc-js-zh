- md: "\n## JavaScript Basics\n\nJavaScript is a programming language that allows\
    \ you to create interactive web pages. It is primarily used for client-side scripting\
    \ but it can also be used on the server-side with Node.js.\n\nJavaScript is used\
    \ to make web pages interactive. For example, you can use it to validate form\
    \ data, create image sliders, or update content on the page.\n\nTo use JavaScript,\
    \ you can embed it directly in your HTML page using the `<script>` tag.\n\n```html\n\
    <script>\n  console.log(\"Hello World\");\n</script>\n```\n\n### Variables\n\n\
    In JavaScript, variables are used to store data values. There are three ways to\
    \ declare variables: `var`, `let`, and `const`.\n\n- `var` is the old way of declaring\
    \ variables. It is function-scoped and can be re-declared.\n- `let` is the modern\
    \ way to declare variables. It is block-scoped.\n- `const` is used to declare\
    \ variables that cannot be reassigned.\n\n```javascript\nlet name = \"John\";\n\
    let age = 25;\nconst pi = 3.14;\n```\n\n### Data Types\n\nJavaScript has several\
    \ built-in data types:\n\n- String: Represents text.\n- Number: Represents integers\
    \ and floating-point numbers.\n- Boolean: Represents logical entities (true or\
    \ false).\n- Array: A list-like object.\n- Object: A collection of related data.\n\
    - Undefined: A variable that has not been assigned a value.\n- Null: Represents\
    \ the intentional absence of any value.\n\n```javascript\nlet str = \"Hello\"\
    ;\nlet num = 42;\nlet bool = true;\nlet list = [\"apple\", \"banana\", \"cherry\"\
    ];\nlet person = { name: \"Alice\", age: 30 };\n```\n\n### Functions\n\nFunctions\
    \ are blocks of code designed to perform a particular task. You can define a function\
    \ using the `function` keyword.\n\n```javascript\nfunction greet(name) {\n  return\
    \ \"Hello, \" + name + \"!\";\n}\n\nconsole.log(greet(\"World\"));\n```\n\n###\
    \ Objects\n\nObjects in JavaScript are collections of properties. Each property\
    \ is key-value pairs. You can access object properties using dot notation or bracket\
    \ notation.\n\n```javascript\nlet car = {\n  brand: \"Toyota\",\n  model: \"Corolla\"\
    ,\n  year: 2022\n};\n\nconsole.log(car.brand); // Toyota\nconsole.log(car[\"model\"\
    ]); // Corolla\n```\n\n### Control Flow\n\nControl flow allows you to execute\
    \ different code based on conditions.\n\n#### If-Else Statements\n\n```javascript\n\
    let age = 18;\nif (age >= 18) {\n  console.log(\"You are an adult.\");\n} else\
    \ {\n  console.log(\"You are a minor.\");\n}\n```\n\n#### Loops\n\nLoops are used\
    \ to repeat code multiple times.\n\n```javascript\n// For loop\nfor (let i = 0;\
    \ i < 5; i++) {\n  console.log(\"Iteration \" + i);\n}\n\n// For...of loop\nlet\
    \ fruits = [\"apple\", \"banana\", \"orange\"];\nfor (let fruit of fruits) {\n\
    \  console.log(fruit);\n}\n```\n\n### DOM Manipulation\n\nThe DOM (Document Object\
    \ Model) allows JavaScript to interact with HTML. You can change content, styles,\
    \ and attributes.\n\n```javascript\n// Change the content of an element\nlet element\
    \ = document.getElementById(\"demo\");\nelement.innerHTML = \"New Content\";\n\
    \n// Change the style\nelement.style.color = \"red\";\n\n// Add an event listener\n\
    let button = document.querySelector(\"button\");\nbutton.addEventListener(\"click\"\
    , function() {\n  alert(\"Button clicked!\");\n});\n```\n\n### Asynchronous JavaScript\n\
    \nJavaScript uses asynchronous programming to handle tasks that take time, like\
    \ fetching data from an API.\n\n#### Promises\n\n```javascript\nfetch(\"https://api.example.com/data\"\
    )\n  .then(response => response.json())\n  .then(data => console.log(data))\n\
    \  .catch(error => console.error(\"Error:\", error));\n```\n\n#### Async/Await\n\
    \n```javascript\nasync function fetchData() {\n  try {\n    let response = await\
    \ fetch(\"https://api.example.com/data\");\n    let data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error(\"Error:\", error);\n\
    \  }\n}\n```\n"
  mdcn: "\n\n## JavaScript 基础\n\nJavaScript 是一种允许你创建交互式网页的编程语言。它主要用于客户端脚本，但也可以通过 Node.js\
    \ 在服务器端使用。\n\nJavaScript 用于让网页具有交互性。例如，你可以用它来验证表单数据、创建图像轮播器或更新页面上的内容。\n\n要使用 JavaScript，你可以使用\
    \ `<script>` 标签将其直接嵌入到 HTML 页面中。\n\n```html\n<script>\n  console.log(\"Hello World\"\
    );\n</script>\n```\n\n### 变量\n\n在 JavaScript 中，变量用于存储数据值。声明变量有方式：`var`、`let` 和\
    \ `const`。\n\n- `var` 是声明变量的旧方式。它是函数作用域的，并且可以重新声明。\n- `let` 是声明变量的现代方式。它是块作用域的。\n\
    - `const` 用于声明不可重新赋值的变量。\n\n```javascript\nlet name = \"John\";\nlet age = 25;\n\
    const pi = 3.14;\n```\n\n### 数据类型\n\nJavaScript 有若干种内置数据类型：\n\n- String（字符串）：表示文本。\n\
    - Number（数字）：表示整数和浮点数。\n- Boolean（布尔值）：表示逻辑实体（true 或 false）。\n- Array（数组）：一种类似列表的对象。\n\
    - Object（对象）：相关数据的集合。\n- Undefined（未定义）：未赋值的变量。\n- Null（空）：表示刻意缺失的任何值。\n\n```javascript\n\
    let str = \"Hello\";\nlet num = 42;\nlet bool = true;\nlet list = [\"apple\",\
    \ \"banana\", \"cherry\"];\nlet person = { name: \"Alice\", age: 30 };\n```\n\n\
    ### 函数\n\n函数是用于执行特定任务的代块。你可以使用 `function` 关键字定义函数。\n\n```javascript\nfunction\
    \ greet(name) {\n  return \"Hello, \" + name + \"!\";\n}\n\nconsole.log(greet(\"\
    World\"));\n```\n\n### 对象\n\nJavaScript 中的对象是属性的集合。每个属性都是键值对。你可以使用点符号法或括号表示法来访问对象属性。\n\
    \n```javascript\nlet car = {\n  brand: \"Toyota\",\n  model: \"Corolla\",\n  year:\
    \ 2022\n};\n\nconsole.log(car.brand); // Toyota\nconsole.log(car[\"model\"]);\
    \ // Corolla\n```\n\n### 控制流\n\n控制流允许你根据条件执行不同的代码。\n\n#### If-Else 语句\n\n```javascript\n\
    let age = 18;\nif (age >= 18) {\n  console.log(\"You are an adult.\");\n} else\
    \ {\n  console.log(\"You are a minor.\");\n}\n```\n\n#### 循环\n\n循环用于多次重复代码。\n\n\
    ```javascript\n// For 循环\nfor (let i = 0; i < 5; i++) {\n  console.log(\"Iteration\
    \ \" + i);\n}\n\n// For...of 循环\nlet fruits = [\"apple\", \"banana\", \"orange\"\
    ];\nfor (let fruit of fruits) {\n  console.log(fruit);\n}\n```\n\n### DOM 操作\n\
    \nDOM（文档对象模型）允许 JavaScript 与 HTML 交互。你可以更改内容、样式和属性。\n\n```javascript\n// 修改元素的内容\n\
    let element = document.getElementById(\"demo\");\nelement.innerHTML = \"New Content\"\
    ;\n\n// 修改样式\nelement.style.color = \"red\";\n\n// 添加事件监听器\nlet button = document.querySelector(\"\
    button\");\nbutton.addEventListener(\"click\", function() {\n  alert(\"Button\
    \ clicked!\");\n});\n```\n\n### 异步 JavaScript\n\nJavaScript 使用异步编程来处理耗时的任务，例如从\
    \ API 获取数据。\n\n#### Promises（承诺）\n\n```javascript\nfetch(\"https://api.example.com/data\"\
    )\n  .then(response => response.json())\n  .then(data => console.log(data))\n\
    \  .catch(error => console.error(\"Error:\", error));\n```\n\n#### Async/Await\n\
    \n```javascript\nasync function fetchData() {\n  try {\n    let response = await\
    \ fetch(\"https://api.example.com/data\");\n    let data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error(\"Error:\", error);\n\
    \  }\n}\n```\n\n"
