    Foreword by Lara Hogan


    JAVASCRIPT FOR WEB DESIGNERS


    **Mat Marquis**


    *Brief books for people who make websites*


    20


    MORE FROM A BOOK APART


    **THE ART OF CODE**

    *A practical guide for creative developers*


    **DESIGNING CODE**

    *A visual guide to clean code*


    **USER EXPERIENCE FLUX**

    *A guide to user-centered design*


    **USER INTERFACE IDEALS**

    *A guide to UI/UX design*


    **TOUCHSCREEN DESIGN**

    *A guide to mobile design*


    **RESPONSIVE DESIGN**

    *A guide to responsive layouts*


    **THE WEB STYLE**

    *A guide to modern web styling*


    **DESIGN PATTERNS**

    *A handbook of patterns for designers*


    **WEB REVOLUTION**

    *The history of the modern web*


    **USER CENTER METHOD**

    *A guide to user-centered design*


    **USABILITY LEARNING**

    *A practical guide to usability testing*


    **INFORMATION DESIGN**

    *A guide to information architecture*


    **VISUAL DESIGN SYSTEM**

    *A practical guide to visual design*


    **INTERACTIVE DESIGN**

    *A guide to interactive design*


    TABLE OF CONTENTS


    1 | Introduction

    7 | The Evolution of the Web

    24 | Designing Code

    54 | User Experience Flux

    75 | User Interface Ideals

    92 | Interaction

    127 | Acknowledgments

    128 | Preface

    130 | About the Author

    132 | Index

    133 | Backword


    FOREWORD


    I have known Matt Marquis for many years, and he has always been one of the most
    talented designers I have ever met. Matt has a unique gift for understanding the
    intersection of design and technology, and he is able to translate complex ideas
    into beautiful and functional digital experiences. His work has been a huge inspiration
    to me, and I am honored to write the introduction to this book.


    Matt has made a significant contribution to the design community, and his work
    has helped many people to improve their skills. He is a fantastic teacher and
    a mentor, and he is always willing to share his knowledge and experience with
    others. Matt''s insights into the world of web design are invaluable to anyone
    who wants to succeed, and his work has helped many of us become better designers
    ourselves.


    I am confident that this book will be a valuable resource for anyone who wants
    to learn more about web design, and I look forward to seeing what Matt will do
    in the future.


    INTRODUCTION


    The web has changed a lot over the last few decades. What started as a simple
    collection of static pages has evolved into a complex and dynamic platform that
    is used for almost everything in our lives. This change has been driven by rapid
    advancements in technology, and by a growing demand for more interactive and engaging
    digital experiences.


    In the past, web design was mostly about making things look good. Today, it is
    also about creating experiences that are both functional and enjoyable. This means
    that designers need to have a wide range of skills, including knowledge of design
    principles, technology, psychology, and marketing.


    In this book, Matt Marquis will explore some of the key aspects of web design.
    He will cover topics such as visual design, user interface, user experience, and
    much more. He will also provide practical tips and techniques that you can use
    to improve your own work.


    Whether you are a beginner or an experienced designer, this book will give you
    a rewarding read. It will provide you with a deeper understanding of the world
    of web design and will help you to develop your own style.


    I hope you enjoy this book as much as I enjoyed reading it.


    Lara Hogan

