- md: "\nvar myDog = new Object();\n*undefined*\nmyDog.nickname = \"Falsy\";\n*\"\
    Falsy\"*\n\nIf the property does not exist:\n```javascript\nvar myDog = {\n  \"\
    nickname\": \"Falsy\"\n};\n*undefined*\n```\n\nIf you add a property to an object:\n\
    ```javascript\nvar myDog = {\n  \"name\": \"Zero\"\n};\n*undefined*\n```\n\n**Properties**\n\
    \n```javascript\nmyDog.name;\n*Zero*\n```\n\nWhen you access a property of an\
    \ object, it returns the value of that property. If the property does not exist,\
    \ it returns undefined. The object has the property \"name\":\n\n```javascript\n\
    var myDog = {\n  \"name\": \"Zero\"\n};\n*undefined*\nmyDog[\"name\"];\n*Zero*\n\
    ```\n\nIf you change the value of an object property, the object is updated:\n\
    \n```javascript\nvar myDog = {\n  \"name\": \"Zero\"\n};\n*undefined*\nmyDog.name\
    \ = \"New\";\n```\n\nIf you delete a property from an object, the property is\
    \ removed:\n\n```javascript\nvar cars = {\n  \"car1\": \"red\",\n  \"car2\": \"\
    blue\",\n  \"car3\": \"green\"\n};\n*undefined*\ndelete cars.car2;\n```\n\nIf\
    \ you access a property that does not exist, it returns undefined:\n\n```javascript\n\
    var cars = {\n  \"car1\": \"red\",\n  \"car2\": \"blue\",\n  \"car3\": \"green\"\
    \n};\n*undefined*\nvar carKey = \"car\" + 2;\n*undefined*\ncarKey;\n*\"car2\"\
    *\ncars.carKey;\n*undefined*\n```\n\nIf you access a property using a variable,\
    \ it returns the property value:\n\n```javascript\nvar cars = {\n  \"car1\": \"\
    red\",\n  \"car2\": \"blue\",\n  \"car3\": \"green\"\n};\n*undefined*\nvar carKey\
    \ = \"car\" + 2;\n*undefined*\ncars[carKey];\n*\"blue\"*\n```\n\nIf you change\
    \ the value of an object property using a variable, the object is updated:\n\n\
    ```javascript\nvar cars = {\n  \"car1\": \"red\",\n  \"car2\": \"blue\",\n  \"\
    car3\": \"green\"\n};\n*undefined*\nvar carKey = \"car\" + 2;\n*undefined*\ncars[carKey]\
    \ = \"yellow\";\n```\n\n**Functions**\n\nWhen you define a function, you can call\
    \ it to execute the code:\n\n```javascript\nvar whatup = function() {\n  console.log(\"\
    Hello again, world.\");\n};\n*undefined*\nwhatup();\n*Hello again, world.*\n```\n\
    \nIf you call a function with arguments, the function uses those arguments as\
    \ parameters:\n\n```javascript\nvar greet = function(username) {\n  console.log(\"\
    Hello again, \" + username + \".\");\n};\n*undefined*\ngreet(\"Alice\");\n*Hello\
    \ again, Alice.*\n```\n\nIf you call a function without passing an argument, the\
    \ parameter is undefined:\n\n```javascript\nvar greet = function(username) {\n\
    \  console.log(\"Hello again, \" + username + \".\");\n};\n*undefined*\ngreet();\n\
    *Hello again, undefined.*\n```\n"
