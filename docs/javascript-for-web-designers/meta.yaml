    var body = doc.body;\n\n// Get the head of the document\nvar head = doc.head;\n\
    \n// Get all paragraph elements in the document\nvar paragraphs = doc.getElementsByTagName(\"\
    p\");\n\n// Get the first paragraph\nvar firstParagraph = paragraphs[0];\n\n//\
    \ Get the last paragraph using length minus 1\nvar lastParagraph = paragraphs[paragraphs.length\
    \ - 1];\n\n// Change the content of the first paragraph\nfirstParagraph.innerHTML\
    \ = \"Listen up, chumps:\";\n\n// Change the content of the last paragraph ownlastParagraph.innerHTML\
    \ = \"And that's how I spent my vacation.\";\n\n// Example of manipulating the\
