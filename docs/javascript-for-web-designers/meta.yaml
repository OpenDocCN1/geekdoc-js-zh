- md: "\n## Infinity and NaN\n\nIn JavaScript, `Infinity` is a numeric value representing\
    \ a value greater than any other number. It can be created when a mathematical\
    \ operation results in a value that is too large.\n\n```javascript\nlet a = 1\
    \ / 0; // Infinity\nconsole.log(a); // Infinity\n\nlet b = 1 / -0; // -Infinity\n\
    console.log(b); // -Infinity\n\nlet c = Infinity * 2; // Infinity\nconsole.log(c);\
    \ // Infinity\n\nlet d = Infinity - Infinity; // NaN\nconsole.log(d); // NaN\n\
    \nlet e = Infinity / Infinity; // NaN\nconsole.log(e); // NaN\n```\n\n`NaN` stands\
    \ for Not-a-Number and is a special numeric value representing the result of an\
    \ undefined or unrepresentable mathematical operation.\n\n```javascript\nlet f\
    \ = 0 / 0; // NaN\nconsole.log(f); // NaN\n\nlet g = \"hello\" / 2; // NaN\nconsole.log(g);\
    \ // NaN\n\nlet h = undefined + 5; // NaN\nconsole.log(h); // NaN\n\nlet i = Math.sqrt(-1);\
    \ // NaN\nconsole.log(i); // NaN\n```\n\n## 2021 Features\n\nIn 2021, several\
    \ new features were introduced to JavaScript to make coding more concise and expressive.\n\
    \n### Logical Assignment Operators\n\nLogical assignment operators (`&&=`, `||=`,\
    \ `??=`) allow you to assign a value to a variable based on its current value\
    \ and a logical condition.\n\n```javascript\nlet a = 1;\na &&= 2; // a remains\
    \ 1 because a is truthy\nconsole.log(a); // 1\n\nlet b = 0;\nb ||= 2; // b becomes\
    \ 2 because b is falsy\nconsole.log(b); // 2\n\nlet c = null;\nc ??= 3; // c becomes\
    \ 3 because c is null or undefined\nconsole.log(c); // 3\n\nlet d = 0;\nd ??=\
    \ 3; // d remains 0 because d is not null or undefined\nconsole.log(d); // 0\n\
    ```\n\n### String.prototype.replaceAll()\n\nThe `replaceAll()` method returns\
    \ a new string with all occurrences of a pattern or regular expression replaced\
    \ by a specified string.\n\n```javascript\nlet text = \"apple banana apple orange\"\
    ;\nlet result = text.replaceAll(\"apple\", \"orange\");\nconsole.log(result);\
    \ // \"orange banana orange orange\"\n\nlet text2 = \"the quick brown fox\";\n\
    let result2 = text2.replaceAll(/x/g, \"cat\");\nconsole.log(result2); // \"the\
    \ cat brown fox\"\n```\n\n### Array.prototype.at()\n\nThe `at()` method returns\
    \ the element at a specified index. It supports negative integers to count back\
    \ from the end of the array.\n\n```javascript\nlet arr = [10, 20, 30];\nconsole.log(arr.at(0));\
    \ // 10\nconsole.log(arr.at(-1)); // 30 (last element)\nconsole.log(arr.at(-2));\
    \ // 20 (second last element)\n```\n\n### Promise.any()\n\n`Promise.any()` returns\
    \ a promise that fulfills as soon as any of the promises in the iterable fulfills.\n\
    \n```javascript\nlet p1 = Promise.reject(\"Error 1\");\nlet p2 = Promise.resolve(\"\
    2\");\nlet p3 = Promise.reject(\"Error 3\");\n\nPromise.any([p1, p2, p3]).then((value)\
    \ => {\n  console.log(value); // \"2\"\n}).catch((error) => {\n  console.log(error);\n\
    });\n```\n\n## WeakMap and WeakSet\n\n`WeakMap` and `WeakSet` are collections\
    \ that hold weak references to objects. This allows the garbage collector to reclaim\
    \ memory if the object is no longer referenced elsewhere.\n\n### WeakMap\n\n```javascript\n\
    let wm = new WeakMap();\nlet obj = { key: \"value\" };\nwm.set(obj, \"some data\"\
    );\nconsole.log(wm.get(obj)); // \"some data\"\n\nobj = null; // The object can\
    \ be garbage collected\n```\n\n### WeakSet\n\n```javascript\nlet ws = new WeakSet();\n\
    let obj2 = { id: 1 };\nws.add(obj2);\nconsole.log(ws.has(obj2)); // true\n\nobj2\
    \ = null; // The object can be garbage collected\n```\n\n## globalThis property\n\
    \nThe `globalThis` property provides the global object, regardless of the environment\
    \ (browser, Node.js, etc.).\n\n```javascript\nconsole.log(globalThis); // window\
    \ in browser, global in Node.js\nglobalThis.myVar = \"hello\";\nconsole.log(globalThis.myVar);\
    \ // \"hello\"\n```\n\n## Class Fields\n\nClasses can now define private fields\
    \ and methods using the `#` prefix.\n\n```javascript\nclass User {\n  #name; //\
    \ private field\n\n  constructor(name) {\n    this.#name = name;\n  }\n\n  getName()\
    \ {\n    return this.#name;\n  }\n}\n\nlet user = new User(\"Alice\");\nconsole.log(user.getName());\
    \ // \"Alice\"\n// console.log(user.#name); // Syntax Error\n```\n\n## Private\
    \ Static Class Fields\n\nStatic fields and methods can also be made private using\
    \ `#`.\n\n```javascript\nclass Counter {\n  static #count = 0;\n\n  static increment()\
    \ {\n    this.#count++;\n    return this.#count;\n  }\n\n  static getCount() {\n\
    \    return this.#count;\n  }\n}\n\nconsole.log(Counter.increment()); // 1\nconsole.log(Counter.getCount());\
    \ // 1\n// console.log(Counter.#count); // Syntax Error\n```\n\n## Numeric Separators\n\
    \nYou can use underscores as numeric separators to make large numbers more readable.\n\
    \n```javascript\nlet population = 8_000_000_000;\nconsole.log(population); //\
    \ 8000000000\n\nlet price = 1_250.50;\nconsole.log(price); // 1250.5\n```\n\n\
    ## BigInt\n\n`BigInt` is a data type used for representing integers larger than\
    \ the maximum safe integer for the `Number` type. It is created by appending `n`\
    \ to the end of an integer.\n\n```javascript\nlet big1 = 9007199254740991n;\n\
    let big2 = BigInt(\"9007199254740991\");\nconsole.log(big1 + 1n); // 9007199254740992n\n\
    ```\n\n## Optional Chaining and Nullish Coalescing\n\nOptional chaining (`?.`)\
    \ allows you to read property values of a chain of connected objects without checking\
    \ if each reference is valid. Nullish coalescing (`??`) returns the right-hand\
    \ side operand when its left-hand side operand is `null` or `undefined`.\n\n```javascript\n\
    let user = {\n  address: {\n    city: \"Berlin\"\n  }\n};\n\nconsole.log(user?.address?.city);\
    \ // \"Berlin\"\nconsole.log(user?.profile?.age); // undefined\n\nlet count =\
    \ 0;\nconsole.log(count ?? 10); // 0 (because 0 is not null/undefined)\nlet name\
    \ = null;\nconsole.log(name ?? \"Anonymous\"); // \"Anonymous\"\n```\n\n## Array.prototype.flat()\n\
    \nThe `flat()` method creates a new array with all sub-array elements concatenated\
    \ into it up to a specified depth.\n\n```javascript\nlet arr = [1, 2, [3, [4],\
    \ 5]];\nconsole.log(arr.flat()); // [1, 2, 3, [4], 5]\nconsole.log(arr.flat(2));\
    \ // [1, 2, 3, 4, 5]\n```\n\n## Array.prototype.flatMap()\n\nThe `flatMap()` method\
    \ is equivalent to calling `map()` followed by calling `flat()` a depth of 1.\n\
    \n```javascript\nlet arr = [1, 2, 3, 4];\nlet result = arr.flatMap(x => [x, x\
    \ * 2]);\nconsole.log(result); // [1, 2, 2, 4, 3, 6, 4, 8]\n```\n\n## String.prototype.repeat()\n\
    \nThe `repeat()` method returns a new string which contains the specified string\
    \ repeated specified number of times.\n\n```javascript\nlet str = \"abc\";\nconsole.log(str.repeat(3));\
    \ // \"abcabcabc\"\n```\n\n## String.prototype.padStart() and padEnd()\n\n`padStart()`\
    \ and `padEnd()` pad the current string with another string at the start until\
    \ the resulting string reaches the given length.\n\n```javascript\nlet str = \"\
    5\";\nconsole.log(str.padStart(3, \"0\")); // \"005\"\nconsole.log(str.padEnd(5,\
    \ \"!\")); // \"5!!!!!\"\n```\n\n## Object.entries()\n\n`Object.entries()` static\
    \ method returns an array of a given object's own enumerable string-keyed [key,\
    \ value] pairs.\n\n```javascript\nlet obj = { a: 1, b: 2 };\nconsole.log(Object.entries(obj));\
    \ // [[\"a\", 1], [\"b\", 2]]\n```\n\n## Object.keys()\n\n`Object.keys()` returns\
    \ an array of a given object's own enumerable enumerable string-property names.\n\
    \n```javascript\nlet obj = { a: 1, b: 2 };\nconsole.log(Object.keys(obj)); //\
    \ [\"a\", \"b\"]\n```\n\n## Object.values()\n\n`Object.values()` static method\
    \ returns an array of a given object's own enumerable string-property values.\n\
    \n```javascript\nlet obj = { a: 1, b: 2 };\nconsole.log(Object.values(obj)); //\
    \ [1, 2]\n```\n\n## Object.fromEntries()\n\n`Object.fromEntries()` creates an\
    \ object from a list of key-value pairs.\n\n```javascript\nlet entries = [[\"\
    a\", 1], [\"b\", 2]];\nconsole.log(Object.fromEntries(entries)); // { a: 1, b:\
    \ 2 }\n```\n\n## Array.prototype.includes()\n\nThe `includes()` method determines\
    \ whether an array includes a certain value among its entries, returning true.\n\
    \n```javascript\nlet arr = [1, 2, 3];\nconsole.log(arr.includes(2)); // true\n\
    console.log(arr.includes(4)); // false\n```\n\n## Array.prototype.find()\n\nThe\
    \ `find()` method returns the first element in the provided array that satisfies\
    \ the provided testing function.\n\n```javascript\nlet numbers = [2, 12, 8, 130];\n\
    let found = numbers.find(element => element > 10);\nconsole.log(found); // 12\n\
    ```\n\n## Array.prototype.findIndex()\n\nThe `findIndex()` method returns the\
    \ index of the first element in the array that satisfies the provided testing\
    \ function.\n\n```javascript\nlet users = [\n  { name: 'John', age: 30 },\n  {\
    \ name: 'Jane', age: 25 }\n];\nlet index = users.findIndex(user => user.age <\
    \ 30);\nconsole.log(index); // 1\n```\n\n## Array.prototype.some()\n\nThe `some()`\
    \ method tests whether at least one element in the array passes the provided testing\
    \ function.\n\n```javascript\nlet numbers = [1, 2, 3, 4];\nlet hasEven = numbers.some(element\
    \ => element % 2 === 0);\nconsole.log(hasEven); // true\n\nlet oddNumbers = [1,\
    \ 3, 5];\nlet hasEvenOdd = oddNumbers.some(element => element % 2 === 0);\nconsole.log(hasEvenOdd);\
    \ // false\n```\n\n## Array.prototype.every()\n\nThe `every()` method tests whether\
    \ all elements in the array pass the provided testing function.\n\n```javascript\n\
    let numbers = [2, 4, 6];\nlet allEven = numbers.every(element => element % 2 ===\
    \ 0);\nconsole.log(allEven); // true\n\nlet mixedNumbers = [2, 4, 4];\nlet allEvenMixed\
    \ = mixedNumbers.every(element => element % 2 === 0);\nconsole.log(allEvenMixed);\
    \ // true\n```\n\n## Array.prototype.reduce()\n\nThe `reduce()` method executes\
    \ a reducer function on each element of the array, resulting in a single output\
    \ value.\n\n```javascript\nlet numbers = [1, 2, 3, 4];\nlet sum = numbers.reduce((accumulator,\
    \ currentValue) => {\n  return accumulator + currentValue;\n}, 0);\nconsole.log(sum);\
    \ // 10\n```\n\n## Array.prototype.filter()\n\nThe `filter()` method creates a\
    \ new array with all elements that pass the test implemented by the provided function.\n\
    \n```javascript\nlet numbers = [1, 2, 3, 4];\nlet filtered = numbers.filter(element\
    \ => element > 2);\nconsole.log(filtered); // [3, 4]\n```\n\n## Array.prototype.map()\n\
    \nThe `map()` method creates a new array populated with the results of calling\
    \ a provided function on every element in the array.\n\n```javascript\nlet numbers\
    \ = [1, 2, 3, 4];\nlet doubled = numbers.map(x => x * 2);\nconsole.log(doubled);\
    \ // [2, 4, 6, 8]\n```\n\n## Array.prototype.slice()\n\nThe `slice()` method returns\
    \ a shallow copy of a portion of an array into a new array object.\n\n```javascript\n\
    let fruits = ['apple', 'banana', 'orange', 'mango'];\nlet citrus = fruits.slice(1,\
    \ 3);\nconsole.log(citrus); // ['banana', 'orange']\n```\n\n## Array.prototype.splice()\n\
    \nThe `splice()` method changes the contents of an array by removing or replacing\
    \ elements and adding new elements in place.\n\n```javascript\nlet fruits = ['apple',\
    \ 'banana', 'orange'];\nlet removed = fruits.splice(1, 1, 'strawberry', 'kiwi');\n\
    console.log(fruits); // ['apple', 'strawberry', 'kiwi', 'orange']\nconsole.log(removed);\
    \ // ['banana']\n```\n\n## Array push() and pop()\n\n`push()` adds one or more\
    \ elements to the end of an array and returns the new length. `pop()` removes\
    \ the last element from an array and returns that removed element.\n\n```javascript\n\
    let fruits = ['apple', 'banana'];\nfruits.push('orange', 'mango');\nconsole.log(fruits);\
    \ // ['apple', 'banana', 'orange', 'mango']\n\nlet last = fruits.pop();\nconsole.log(last);\
    \ // 'mango'\nconsole.log(fruits); // ['apple', 'banana', 'orange']\n```\n\n##\
    \ Array shift() and unshift()\n\n`shift()` removes the first element from an array\
    \ and returns that element. `unshift()` adds one or more elements to the beginning\
    \ of an array and returns the new length.\n\n```javascript\nlet fruits = ['apple',\
    \ 'banana'];\nlet first = fruits.shift();\nconsole.log(first); // 'apple'\nconsole.log(fruits);\
    \ // ['banana']\n\nfruits.unshift('orange');\nconsole.log(fruits); // ['orange',\
    \ 'banana']\n```\n\n## Array sort()\n\nThe `sort()` method sorts the elements\
    \ of an array in place and returns the sorted array.\n\n```javascript\nlet fruits\
    \ = ['banana', 'apple', 'orange'];\nfruits.sort();\nconsole.log(fruits); // ['apple',\
    \ 'banana', 'orange']\n\nlet numbers = [40, 100, 1, 5];\nnumbers.sort((a, b) =>\
    \ a - b);\nconsole.log(numbers); // [1, 5, 40, 100]\n```\n\n## Array reverse()\n\
    \nThe `reverse()` method reverses the order of an array in place and returns the\
    \ reversed array.\n\n```javascript\nlet fruits = ['apple', 'banana', 'orange'];\n\
    fruits.reverse();\nconsole.log(fruits); // ['orange', 'banana', 'apple']\n```\n\
    \n## Array concat()\n\nThe `concat()` method is used to merge two or more arrays.\
    \ It does not change the existing arrays, but returns a new array.\n\n```javascript\n\
    let array1 = [\"banana\"];\nlet array2 = [\"apple\", \"orange\"];\nlet array3\
    \ = array1.concat(array2);\nconsole.log(array3); // [\"banana\", \"apple\", \"\
    orange\"]\n```\n\n## join()\n\nThe `join()` method creates and returns a string\
    \ by joining all the elements in an array, separated by specified separator string.\n\
    \n```javascript\nlet fruits = [\"\", \"Fruits\", \"Banana\", \"Cherry\", \"\"\
    ];\nconsole.log(fruits.join()); // \",Fruits,Banana,Cherry,\"\nconsole.log(fruits.join(\"\
    -\")); // \"-Fruits-Banana-Cherry-\"\n```\n\n## Error Handling with try...catch\n\
    \nThe `try...catch` statement is used for error handling in JavaScript.\n\n```javascript\n\
    try {\n  console.log(\"Attempting to run some code...\");\n  throw new Error(\"\
    Something went wrong!\");\n} catch (error) {\n  console.log(\"Caught an error:\
    \ \" + error.message);\n} finally {\n  console.log(\"This block always runs.\"\
    );\n}\n```\n\n## Custom Errors\n\nYou can create custom error classes by extending\
    \ the base `Error` class.\n\n```javascript\nclass MyError extends Error {\n  constructor(message)\
    \ {\n    super(message);\n    this.name = \"MyError\";\n  }\n}\n\ntry {\n  throw\
    \ new MyError(\"Custom error message\");\n} catch (e) {\n  console.log(e.name\
    \ + \": \" + e.message);\n}\n```\n\n## Asynchronous Promises and Async/Await\n\
    \nJavaScript handles asynchronous operations using Promises and the `async/await`\
    \ syntax.\n\n```javascript\nfunction fetchData() {\n  return new Promise((resolve,\
    \ reject) => {\n    setTimeout(() => {\n      const success = true;\n      if\
    \ (success) {\n        resolve(\"Data fetched successfully!\");\n      } else\
    \ {\n        reject(\"Failed to fetch data\");\n      }\n    }, 1000);\n  });\n\
    }\n\nasync function getData() {\n  try {\n    const data = await fetchData();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error(error);\n  }\n\
    }\n\ngetData();\n```\n"
  mdcn: "\n\n## 无穷与 NaN\n\n在 JavaScript 中，`Infinity` 是一个表示比任何数字都大的数值。当数学运算产生的数值过大时，就会创建它。\n\
    \n```javascript\nlet a = 1 / 0; // Infinity\nconsole.log(a); // Infinity\n\nlet\
    \ b = 1 / -0; // -Infinity\nconsole.log(b); // -Infinity\n\nlet c = Infinity *\
    \ 2; // Infinity\nconsole.log(c); // Infinity\n\nlet d = Infinity - Infinity;\
    \ // NaN\nconsole.log(d); // NaN\n\nlet e = Infinity / Infinity; // NaN\nconsole.log(e);\
    \ // NaN\n```\n\n`NaN` 代表 Not-a-Number（不是数字），是一个特殊的数值，表示未定义或无法表示的数学运算的结果。\n\n\
    ```javascript\nlet f = 0 / 0; // NaN\nconsole.log(f); // NaN\n\nlet g = \"hello\"\
    \ / 2; // NaN\nconsole.log(g); // NaN\n\nlet h = undefined + 5; // NaN\nconsole.log(h);\
    \ // NaN\n\nlet i = Math.sqrt(-1); // NaN\nconsole.log(i); // NaN\n```\n\n## 2021\
    \ 特性\n\n2021 年，JavaScript 引入了几个新特性，使代码更加简洁和富有表现力。\n\n### 逻辑赋值运算符\n\n逻辑赋值运算符（`&&=`、`||=`\
    \ `、`??=`）允许你根据变量的当前值和逻辑条件给变量赋值。\n\n```javascript\nlet a = 1;\na &&= 2; // a 保持\
    \ 1，因为 a 为真\nconsole.log(a); // 1\n\nlet b = 0;\nb ||= 2; // b 变为 2，因为 b 为假\n\
    console.log(b); // 2\n\nlet c = null;\nc ??= 3; // c 变为 3，因为 c 是 null 或 undefined\n\
    console.log(c); // 3\n\nlet d = 0;\nd ??= 3; // d 保持 0，因为 d 不是 null 或 undefined\n\
    console.log(d); // 0\n```\n\n### String.prototype.replaceAll()\n\n`replaceAll()`\
    \ 方法返回一个新字符串，其中所有模式或正则表达式的出现都被替换为指定的字符串。\n\n```javascript\nlet text = \"apple\
    \ banana apple orange\";\nlet result = text.replaceAll(\"apple\", \"orange\");\n\
    console.log(result); // \"orange banana orange orange\"\n\nlet text2 = \"the quick\
    \ brown fox\";\nlet result2 = text2.replaceAll(/x/g, \"cat\");\nconsole.log(result2);\
    \ // \"the cat brown fox\"\n```\n\n### Array.prototype.at()\n\n`at()` 方法返回指定索引处的元素。它支持负整数从数组末尾倒数。\n\
    \n```javascript\nlet arr = [10, 20, 30];\nconsole.log(arr.at(0)); // 10\nconsole.log(arr.at(-1));\
    \ // 30 (最后一个元素)\nconsole.log(arr.at(-2)); // 20 (倒第二个元素)\n```\n\n### Promise.any()\n\
    \n`Promise.any()` 返回一个 promise，只要可迭代对象中的任何一个 promise 变为完成，它就会完成。\n\n```javascript\n\
    let p1 = Promise.reject(\"Error 1\");\nlet p2 = Promise.resolve(\"2\");\nlet p3\
    \ = Promise.reject(\"Error 3\");\n\nPromise.any([p1, p2, p3]).then((value) =>\
    \ {\n  console.log(value); // \"2\"\n}).catch((error) => {\n  console.log(error);\n\
    });\n```\n\n## WeakMap 和 WeakSet\n\n`WeakMap` 和 `WeakSet` 是对对象持有弱引用的集合。这允许垃圾回收器在对象不再其他不再被引用时回收内存。\n\
    \n### WeakMap\n\n```javascript\nlet wm = new WeakMap();\nlet obj = { key: \"value\"\
    \ };\nwm.set(obj, \"some data\");\nconsole.log(wm.get(obj)); // \"some data\"\n\
    \nobj = null; // 对象可以被垃圾回收\n```\n\n### WeakSet\n\n```javascript\nlet ws = new\
    \ WeakSet();\nlet obj2 = { id: 1 };\nws.add(obj2);\nconsole.log(ws.has(obj2));\
    \ // true\n\nobj2 = null; // 对象可以被垃圾回收\n```\n\n## globalThis 属性\n\n`globalThis`\
    \ 属性提供了全局对象，无论环境如何（浏览器、Node.js 等）。\n\n```javascript\nconsole.log(globalThis);\
    \ // 浏览器中为 window，Node.js 中为 global\nglobalThis.myVar = \"hello\";\nconsole.log(globalThis.myVar);\
    \ // \"hello\"\n```\n\n## 类字段 (Class Fields)\n\n现在可以使用 `#` 前缀定义私有字段和方法。\n\n```javascript\n\
    class User {\n  #name; // 私有字段\n\n  constructor(name) {\n    this.#name = name;\n\
    \  }\n\n  getName() {\n    return this.#name;\n  }\n}\n\nlet user = new User(\"\
    Alice\");\nconsole.log(user.getName()); // \"Alice\"\n// console.log(user.#name);\
    \ // 错误\n```\n\n## 私有静态字段\n\n静态字段和方法也可以 `#` 进行私有化。\n\n```javascript\nclass Counter\
    \ {\n  static #count = 0;\n\n  static increment() {\n    this.#count++;\n  }\n\
    \n  static getCount() {\n    return this.#count;\n  }\n}\n\nCounter.increment();\n\
    console.log(Counter.getCount()); // 1\n// console.log(Counter.#count); // 错误\n\
    ```\n\n## 数字分隔符\n\n可以使用下划线作为数字分隔符来增加数字的可读性。\n\n```javascript\nlet population =\
    \ 8_000_000_000;\nconsole.log(population); // 8000000000\n\nlet price = 1_250.5;\n\
    console.log(price); // 1250.5\n```\n\n## BigInt\n\n`BigInt` 是用于表示大于 `Number` 类型最大整数的数据类型。通过附加\
    \ `n` 创建。\n\n```javascript\nlet big1 = 9007199254740991n;\nlet big2 = BigInt(\"\
    9007199254740991\");\nconsole.log(big1 + 1n); // 9007199254740992n\n\n## 可选链和空值合并\n\
    \n可选链（`?.`）允许在不检查每个引用是否有效的情况下读取属性值。空值合并（`??`）当左侧操作数为 `null` 或 `undefined` 时返回右侧操作数。\n\
    \n```javascript\nlet user = {\n  address: {\n    city: \"Berlin\"\n  }\n};\n\n\
    console.log(user?.address?.city); // \"Berlin\"\nconsole.log(user?.profile?.age);\
    \ // undefined\n\nlet count = 0;\nconsole.log(count ?? 10); // 0\nconsole.log(null\
    \ ?? 10); // 10\n\n## Array.prototype.flat()\n\n`flat()` 方法创建一个拼接指定深度子数组元素的新数组。\n\
    \n```javascript\nlet arr = [1, 2, [3, [4]], 5];\nconsole.log(arr.flat()); // [1,\
    \ 2, 3, [4], 5]\nconsole.log(arr.flat(2)); // [1, 2, 3, 4, 5]\n```\n\n## Array.prototype.flatMap()\n\
    \n`flatMap()` 方法等于调用 `map()` 然后再调用 `flat()`，深度为 1。\n\n```javascript\nlet arr =\
    \ [1, 2, [3, 4]];\nlet result = arr.flatMap(x => [x, x * 2]);\nconsole.log(result);\
    \ // [1, 2, 2, 4, 3, 8]\n```\n\n## String.prototype.repeat()\n\n`repeat()` 方法返回一个重复指定次数的字符串。\n\
    \n```javascript\nlet str = \"abc\";\nconsole.log(str.repeat(3)); // \"abcabcabc\"\
    \n```\n\n## String.prototype.padStart() and padEnd()\n\n`padStart()` 和 `padEnd()`\
    \ 在开头或结尾填充另一个字符串直到字符串达到给定长度。\n\n```javascript\nlet str = \"5\";\nconsole.log(str.padStart(3,\
    \ \"0\")); // \"005\"\nconsole.log(str.padEnd(5, \"!\")); // \"5!!!!\"\n```\n\n\
    ## Object.entries()\n\n`Object.entries()` 静态方法返回对象的可枚举字符串键的[键, 值]对数组。\n\n```javascript\n\
    let obj = { a: 1, b: 2 };\nconsole.log(Object.entries(obj)); // [[\"a\", 1], [\"\
    b\", 2]]\n```\n\n## Object.keys()\n\n`Object.keys()` 返回对象的可枚举字符串属性名的数组。\n\n```javascript\n\
    let obj = { a: 1, b: 2 };\nconsole.log(Object.keys(obj)); // [\"a\", \"b\"]\n\
    ```\n\n## Object.values()\n\n`Object.values()` 静态方法返回对象的可枚举字符串属性值的数组。\n\n```javascript\n\
    let obj = { a: 1, b: 2 };\nconsole.log(Object.values(obj)); // [1, 2]\n```\n\n\
    ## Object.fromEntries()\n\n`Object.fromEntries()` 从键值对的列表创建对象。\n\n```javascript\n\
    let entries = [[\"a\", 1], [\"b\", 2]];\nconsole.log(Object.fromEntries(entries));\
    \ // { a: 1, b: 2 }\n```\n\n## Array.prototype.includes()\n\n`includes()` 方法确定数组是否包含其元素中的某个值，返回\
    \ true。\n\n```javascript\nlet arr = [1, 2, 3];\nconsole.log(arr.includes(2));\
    \ // true\nconsole.log(arr.includes(4)); // false\n```\n\n## Array.prototype.find()\n\
    \n`find()` 方法返回提供的数组中满足测试函数的第一个元素。\n\n```javascript\nlet numbers = [2, 12, 8,\
    \ 130];\nlet found = numbers.find(element => element > 10);\nconsole.log(found);\
    \ // 12\n```\n\n## Array.prototype.findIndex()\n\n`findIndex()` 方法返回数组中满足测试函数的元素的索引。\n\
    \n```javascript\nlet users = [\n  { name: 'John', age: 30 },\n  { name: 'Jane',\
    \ age: 25 }\n];\nlet index = users.findIndex(user => user.age < 30);\nconsole.log(index);\
    \ // 1\n```\n\n## Array.prototype.some()\n\n`some()` 方法测试数组中至少有一个元素通过了测试函数。\n\n\
    ```javascript\nlet numbers = [1, 2, 3, 4];\nlet hasEven = numbers.some(element\
    \ => element % 2 === 0);\nconsole.log(hasEven); // true\n\nlet oddNumbers = [1,\
    \ 3, 5];\nlet hasEvenOdd = oddNumbers.some(element => element % 2 === 0);\nconsole.log(hasEvenOdd);\
    \ // false\n```\n\n## Array.prototype.every()\n\n`every()` 方法测试数组中的所有元素是否通过了测试函数。\n\
    \n```javascript\nlet numbers = [2, 4, 6];\nlet allEven = numbers.every(element\
    \ => element % 2 === 0);\nconsole.log(allEven); // true\n\nlet mixedNumbers =\
    \ [2, 4, 5];\nlet allEvenMixed = mixedNumbers.every(element => element % 2 ===\
    \ 0);\nconsole.log(allEvenMixed); // false\n```\n\n"
