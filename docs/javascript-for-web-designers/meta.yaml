- md: "\nfor(var i = 0; i < 3; i++) {\n  console.log(\"This loop will run three times.\"\
    )\n}\n*(3) This loop will run three times.*\n\nThe for statement is used to execute\
    \ a block of code a certain number of times. The for statement accepts three optional\
    \ expressions: initialization, condition, and final-expression.\n\nThe initialization\
    \ expression is executed once before the loop starts. The condition is evaluated\
    \ before each iteration of the loop; if the condition evaluates to false, the\
    \ loop terminates. The final-expression is executed after each iteration of the\
    \ loop.\n\nExample:\n```javascript\nfor (var i = 0; i < 5; i++) {\n  console.log(i);\n\
    }\n```\nIn this example, the variable `i` is initialized to 0. The loop continues\
    \ as long as `i` is less than 5. After each iteration, `i` is incremented by 1.\n\
    \nThe for statement can also be used to iterate over arrays:\n```javascript\n\
