- md: "\nIn JavaScript, comparison operators are used to compare two values and return\
    \ a boolean value.\n\n## COMPARISON OPERATORS\n\n- `==` checks if two values are\
    \ equal after performing type coercion.\n- `===` checks if two values are equal\
    \ without performing type coercion.\n- `!=` checks if two values are not equal\
    \ after performing type coercion.\n- `!==` checks if two values are not equal\
    \ without type coercion.\n- `>` checks if the left value is greater than the right.\n\
    - `<` checks if the left value is less than the right.\n- `>=` checks if the left\
    \ value is greater than or equal to the right.\n- `<=` checks if the left value\
    \ is less than or equal to the right.\n\nFor example, `5 == \"5\"` is true because\
    \ the string is converted to a number. However, `5 === \"5\"` is false because\
    \ the types are different (number and string).\n\n### Equality Operators: `==`\
    \ and `===`\n\nThe `==` operator checks for equality after type conversion. The\
    \ `===` operator (strict equality) checks both value and type.\n\n```javascript\n\
    console.log(5 == \"5\"); // true\nconsole.log(5 === \"5\"); // false\nconsole.log(null\
    \ == undefined); // true\nconsole.log(null === undefined); // false\n```\n\n###\
    \ Inequality Operators: `!=` and `!==`\n\nThe `!=` operator checks for inequality\
    \ after type conversion. The `!==` operator (strict inequality) checks for inequality\
    \ without type conversion.\n\n```javascript\nconsole.log(5 != \"5\"); // false\n\
    console.log(5 !== \"5\"); // true\nconsole.log(null != undefined); // false\n\
    console.log(null !== undefined); // true\n```\n\n### Relational Operators: `>`,\
    \ `<`, `>=`, `<=`\n\nThese operators are used to compare numbers or strings (based\
    \ on lexicographical order).\n\n```javascript\nconsole.log(10 > 5); // true\n\
    console.log(5 < 10); // true\nconsole.log(10 >= 5); // true\nconsole.log(5 <=\
    \ 10); // true\n```\n\n### String Comparison\n\nWhen comparing strings, JavaScript\
    \ compares them lexicographically based on their Unicode values.\n\n```javascript\n\
    console.log(\"apple\" > \"banana\"); // false\nconsole.log(\"Banana\" > \"apple\"\
    ); // true (Uppercase letters come before lowercase)\n```\n\n### Special Values:\
    \ null, undefined, NaN\n\nJavaScript has some special values that behave uniquely\
    \ in comparisons.\n\n| Value | `==` | `===` | `!=` | `!==` |\n| :--- | :--- |\
    \ :--- | :--- | :--- |\n| `null` | true | false | false | true |\n| `undefined`\
    \ | true | false | false | true |\n| `NaN` | false | false | true | true |\n\n\
    Note that `NaN` is never equal to anything, including itself.\n\n```javascript\n\
    function greetUser(name) {\n  if (name) {\n    console.log(\"Welcome, \" + name\
    \ + \"!\");\n  } else {\n    console.log(\"Welcome, whoever you are!\");\n  }\n\
    }\n\ngreetUser(\"Muscles Touchdown\"); // Welcome, Muscles Touchdown!\ngreetUser();\
    \ // Welcome, whoever you are!\n```\n\n### Falsy and Truthy Values\n\nIn JavaScript,\
    \ certain values are \"falsy\" when evaluated in a boolean context. The only falsy\
    \ values are:\n\n- `false`\n- `0`\n- `\"\"` (empty string)\n- `null`\n- `undefined`\n\
    - `NaN`\n\nAll other values are \"truthy\", including empty arrays `[]` and empty\
    \ objects `{}`.\n\n```javascript\nfunction greetUser(name) {\n  if (name === undefined)\
    \ {\n    name = \"whomever you are\";\n  }\n  console.log(\"Welcome, \" + name\
    \ + \"!\");\n}\n\ngreetUser(\"Muscles Touchdown\"); // Welcome, Muscles Touchdown!\n\
    greetUser(undefined); // Welcome, whoever you are!\n```\n\n### Default Parameters\n\
    \nYou can define default values for function parameters to handle `undefined`\
    \ arguments automatically.\n\n```javascript\nfunction greetUser(name = \"whomever\
    \ you are\") {\n  console.log(\"Welcome, \" + name + \"!\");\n}\n\ngreetUser(\"\
    Muscles Touchdown\"); // Welcome, Muscles Touchdown!\ngreetUser(); // Welcome,\
    \ whoever you are!\n```\n\n### Logical Operators\n\nThe logical `&&` (AND) and\
    \ `||` (OR) operators are used to combine comparisons.\n\n```javascript\nvar foo\
    \ = 2;\nif (foo != 5) {\n  console.log(\"foo is not equal to five\");\n}\n\nconsole.log(true\
    \ == 1); // true\nconsole.log(false == 0); // false\n```\n\n### Comparison Operators\
    \ (Continued)\n\nThe operators `>=` (greater than or equal to) and `<=` (less\
    \ than or equal to) are useful for range checks.\n\n```javascript\nconsole.log(10\
    \ >= 5); // true\nconsole.log(5 <= 5); // true\n```\n\n### Strict Equality vs.\
    \ Loose Equality\n\nThe difference between `==` and `===` is type coercion. Using\
    \ `===` is generally preferred to avoid unexpected bugs from unexpected type conversions.\n\
    \n```javascript\nconsole.log(0 == \"\"); // true\nconsole.log(0 === \"\"); //\
    \ false\n```\n"
  mdcn: "\n\n在 JavaScript 中，比较运算符用于比较两个值并返回一个布尔值。\n\n## 比较运算符\n\n- `==` 检查两个值在执行类型转换后是否相等。\n\
    - `===` 检查两个值在不执行类型转换的情况下是否相等。\n- `!=` 检查两个值在执行类型转换后是否不等相等。\n- `!==` 检查两个值在不执行类型转换的情况下不等相等。\n\
    - `>` 检查左侧值是否大于右侧。\n- `<` 检查左侧值是否小于右侧。\n- `>=` 检查左侧值是否大于或等于右侧。\n- `<=` 检查左侧值是否小于或等于右侧。\n\
    \n例如，`5 == \"5\"` 为 `true`，因为字符串转换为了数字。然而，`5 === \"5\"` 为 `false`，因为类型不同（数字和字符串）。\n\
    \n### 等等运算符：`==` 和 `===`\n\n`==` 运算符在类型转换后检查相等性。`===` 运算符（严格相等）同时检查值和类型。\n\n```javascript\n\
    console.log(5 == \"5\"); // true\nconsole.log(5 === \"5\"); // false\nconsole.log(null\
    \ == undefined); // true\nconsole.log(null === undefined); // false\n```\n\n###\
    \ 不等运算符：`!=` 和 `!==`\n\n`!=` 运算符在类型转换后检查不等性。`!==` 运算符（严格不等）在不进行类型转换的情况下检查不等性。\n\
    \n```javascript\nconsole.log(5 != \"5\"); // false\nconsole.log(5 !== \"5\");\
    \ // true\nconsole.log(null != undefined); // false\nconsole.log(null !== undefined);\
    \ // true\n```\n\n### 关系运算符：>`, `<`, `>=`, `<=`\n\n这些运算符用于比较数字或字符串（基于字典序顺序）。\n\
    \n```javascript\nconsole.log(10 > 5); // true\nconsole.log(5 < 10); // true\n\
    console.log(10 >= 5); // true\nconsole.log(5 <= 10); // true\n```\n\n### 字符串比较\n\
    \n在比较字符串时，JavaScript 根据它们的 Unicode 值按字典序进行比较。\n\n```javascript\nconsole.log(\"\
    apple\" > \"banana\"); // false\nconsole.log(\"Banana\" > \"apple\"); // true\
    \ (大写字母在小写字母之前)\n```\n\n### 特殊值：null, undefined, NaN\n\nJavaScript 有一些在比较中行为独特的的特殊值。\n\
    \n| 值 | `==` | `===` | `!=` | `!==` |\n| :--- | :--- | :--- | :--- | :--- |\n\
    | `null` | true | false | false | true |\n| `undefined` | true | false | false\
    \ | true |\n| `NaN` | false | false | true | true |\n\n注意 `NaN` 永远不等于任何值，包括它本身。\n\
    \n```javascript\nfunction greetUser(name) {\n  if (name) {\n    console.log(\"\
    Welcome, \" + name + \"!\");\n  } else {\n    console.log(\"Welcome, whoever you\
    \ are!\");\n  }\n}\n\ngreetUser(\"Muscles Touchdown\"); // Welcome, Muscles Touchdown!\n\
    greetUser(); // Welcome, whoever you are!\n```\n\n### 假值与真值 (Falsy and Truthy\
    \ Values)\n\n在 JavaScript 中，某些值在布尔上下文中求时为“假值 (falsy)”。唯一的假值为：\n\n- `false`\n-\
    \ `0`\n- `\"\"`（空字符串）\n- `null`\n- `undefined`\n- `NaN`\n\n所有其他值都是“真值 (truthy)”，包括空数组\
    \ `[]` 和空对象 `{}`。\n\n```javascript\nfunction greetUser(name) {\n  if (name ===\
    \ undefined) {\n    name = \"whomever you are\";\n  }\n  console.log(\"Welcome,\
    \ \" + name + \"!\");\n}\n\ngreetUser(\"Muscles Touchdown\"); // Welcome, Muscles\
    \ Touchdown!\ngreetUser(undefined); // Welcome, whoever you are!\n```\n\n### 默认参数\n\
    \n你可以为函数参数定义默认值，自动处理 `undefined` 参数。\n\n```javascript\nfunction greetUser(name\
    \ = \"whomever you are\") {\n  console.log(\"Welcome, \" + name + \"!\");\n}\n\
    \ngreetUser(\"Muscles Touchdown\"); // Welcome, Muscles Touchdown!\ngreetUser();\
    \ // Welcome, whoever you are!\n```\n\n### 逻辑运算符\n\n逻辑 `&&`（与）和 `||`（或）运算符用于组合比较结果。\n\
    \n```javascript\nvar foo = 2;\nif (foo != 5) {\n  console.log(\"foo is not equal\
    \ to five\");\n}\n\nconsole.log(true == 1); // true\nconsole.log(false == 0);\
    \ // false\n```\n\n### 比较运算符（续）\n\n运算符 `>=`（大于或等于）和 `<=`（小于或等于）对于范围检查非常有用。\n\n\
    ```javascript\nconsole.log(10 >= 5); // true\nconsole.log(5 <= 5); // true\n```\n\
    \n### 严格相等 vs 宽松相等\n\n`==` 和 `===` 之间的区别是类型转换。通常优选 `===` 以避免由意外类型转换导致的意外 bug。\n\
    \n```javascript\nconsole.log(0 == \"\"); // true\nconsole.log(0 === \"\"); //\
    \ false\n```\n"
