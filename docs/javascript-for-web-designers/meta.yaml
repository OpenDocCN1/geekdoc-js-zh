    : \"BJ\",\n  \"bunk3\": \"Frank\"\n};\n\n// 遍历原型链的逻辑\n```\n\n### 遍历原型链\n\n我们可以通过一个循环来手动遍历原型链：\n\
    \n```javascript\nvar newObject = {\n  \"name\": \"Frank\"\n};\n\nvar i = 0;\n\
    while(i < 3) {\n  console.log( \"Loop.\" );\n  i++;\n}\n```\n"
