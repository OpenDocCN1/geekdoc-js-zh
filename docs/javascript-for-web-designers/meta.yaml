    \n```javascript\nvar myObject = {};\nvar unrelatedObject = {};\n\nmyObject.toString();\n\
    *\"[object Object]\"*\n\nmyObject.__proto__.toString = function() {\n  console.log(\
    \ \"I just broke JavaScript a LOT.\" );\n};\n\nmyObject.toString();\n*I just broke\
    \ JavaScript a LOT.*\n\nunrelatedObject.toString(); // Uh oh.\n*I just broke JavaScript\
    \ a LOT.*\n```\n\n在这种情况下，`unrelatedObject` 继承了 `myObject` 的原型链中的 `toString` 方法，因为我们修改的是\
    \ `myObject` 的原型，而不是全局的 `Object.prototype`。\n\n### 添加自定义方法\n\n如果我们想让所有对象都拥有一个\
    \ `containsName` 方法，可以在 `Object.prototype` 上定义它：\n\n```javascript\nObject.prototype.containsName\
    \ = function() {\n  var result = false;\n  for( var key in this ) {\n    if( key\
    \ === \"name\" {\n      result = true;\n    }\n  }\n  return result;\n};\n\nvar\
    \ firstObject = {\n  \"foo\": false\n};\n\nvar secondObject = {\n  \"name\": \"\
