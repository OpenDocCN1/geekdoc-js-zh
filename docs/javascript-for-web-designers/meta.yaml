- md: "\n## 1. Variables\n\nA variable is a container for storing data value. In JavaScript,\
    \ you can declare variables using `let`, `const`, and `var`.\n\n- `let`: Used\
    \ to declare variables that can be reassigned.\n- `const`: Used to declare variables\
    \ that cannot be reassigned.\n- `var`: The older way to declare variables (now\
    \ avoided in modern JS).\n\nExample:\n```javascript\nlet x = 10;\nx = 20; // Allowed\n\
    \nconst y = 5;\n// y = 10; // Will throw an error\n```\n\n## 2. Data Types\n\n\
    Data types define the type of data a variable can hold. JavaScript has several\
    \ types:\n\n- String: Text data wrapped in quotes.\n- Number: Integers and floating-point\
    \ numbers.\n- Boolean: true or false.\n- Undefined: A variable that has been declared\
    \ but not assigned a value.\n- Null: Represents the absence of any value.\n- Object:\
    \ A collection of properties.\n- Array: A list-like data.\n\nExample:\n```javascript\n\
    let name = \"Alice\";\nlet age = 25;\nlet isStudent = true;\nlet score;\nlet result\
    \ = null;\nlet user = { name: \"Bob\", age: 30 };\nlet colors = [\"red\", \"green\"\
    , \"blue\"];\n```\n\n## 3. Operators\n\nOperators are used to perform operations\
    \ on variables and values.\n\n### Arithmetic Operators\n| Operator | Description\
    \ | Example | Result |\n| :--- | :--- | :--- | :--- |\n| `+` | Addition | `5 +\
    \ 2` | 7 |\n| `-` | Subtraction | `5 - 2` | 3 |\n| `*` | Multiplication | `5 *\
    \ 2` | 10 |\n| `/` | Division | `5 / 2` | 2.5 |\n| `%` | Modulus (remainder) |\
    \ `5 % 2` | 1 |\n| `**` | Exponentiation | `5 ** 2` | 25 |\n| `++` | Increment\
    \ | `x++` | 6 |\n| `--` | Decrement | `x--` | 4 |\n\n### Comparison Operators\n\
    - `==`: Equal to (checks value only).\n- `===`: Strict equal to (checks value\
    \ and type).\n- `!=`: Not equal to.\n- `!==`: Strict not equal.\n- `>`: Greater\
    \ than.\n- `<`: Less than.\n- `>=`: Greater than or equal to.\n- `<=`: Less than\
    \ or equal to.\n\n### Assignment Operators\n- `=`: Assign value.\n- `+=`: Add\
    \ and assign.\n- `-=`: Subtract and assign.\n- `*=`: Multiply and assign.\n- `/=`:\
    \ Divide and assign.\n\n### Logical Operators\n- `&&`: AND (true if both operands\
    \ are true).\n- `||`: OR (true if one of the operands is true).\n- `!`: NOT (reverses\
    \ the result).\n\n## 4. Control Flow\n\nControl structures determine the execution\
    \ path of code.\n\n### Conditional Statements (if...else)\n```javascript\nlet\
    \ age = 18;\nif (age >= 18) {\n  console.log(\"Adult\");\n} else {\n  console.log(\"\
    Minor\");\n}\n```\n\n### Loops (for, while)\nLoops are used to repeat a block\
    \ of code multiple times.\n\n```javascript\n// For loop\nfor (let i = 0; i < 5;\
    \ i++) {\n  console.log(i);\n}\n\n// While loop\nlet j = 0;\nwhile (j < 5) {\n\
    \  console.log(j);\n  j++;\n}\n```\n\n## 5. Functions\n\nFunctions are reusable\
    \ blocks of code designed to perform a particular task.\n\n```javascript\n// Function\
    \ declaration\nfunction greet(name) {\n  return \"Hello, \" + name;\n}\n\nconsole.log(greet(\"\
    World\"));\n\n// Arrow function\nconst add = (a, b) => a + b;\nconsole.log(add(5,\
    \ 3));\n```\n\n## 6. Arrays\n\nArrays are used to store multiple values in a single\
    \ variable.\n\n```javascript\nlet fruits = [\"apple\", \"banana\", \"cherry\"\
    ];\nconsole.log(fruits[0]); // Apple\nfruits.push(\"orange\"); // Adds to end\n\
    console.log(fruits.length); // 4\n```\n\n## 7. Objects\n\nObjects are used to\
    \ store collections of related data and methods.\n\n```javascript\nlet car = {\n\
    \  brand: \"Toyota\",\n  model: \"Corolla\",\n  year: 2022,\n  start: function()\
    \ {\n    console.log(\"Engine is starting...\");\n  }\n};\n\nconsole.log(car.brand);\n\
    car.start();\n```\n\n## 8. DOM Manipulation\n\nThe Document Object Model (DOM)\
    \ allows JavaScript to change HTML and CSS.\n\n```javascript\n// Selecting an\
    \ element\nlet title = document.getElementById(\"title\");\n\n// Changing content\n\
    title.innerText = \"New Title\";\n\n// Changing style\ntitle.style.color = \"\
    blue\";\n\n// Adding event listeners\nlet btn = document.querySelector(\"button\"\
    );\nbtn.addEventListener(\"click\", () => {\n  alert(\"Button clicked!\");\n});\n\
    ```\n\n## 9. Understanding Data Types (Detailed)\n\nJavaScript is dynamically\
    \ typed, meaning variables can change types dynamically.\n\n- `string`: Text sequences.\n\
    - `number`: Integers and floats.\n- `boolean`: `true` or `false`.\n- `undefined`:\
    \ Variable declared with no value.\n- `null`: Explicitly empty value.\n- `object`:\
    \ Complex data structures.\n- `array`: Special type of object for lists.\n- `function`:\
    \ Functions are also objects.\n- `symbol`: Unique identifiers.\n- `bigint`: For\
    \ large integers.\n\n### Special Values\n- `NaN`: Not a Number (result of invalid\
    \ mathematical operations).\n- `Infinity`: Value greater than any number.\n- `-Infinity`:\
    \ Value less than any number.\n- `undefined`: Automatically assigned to uninitialized\
    \ variables.\n- `null`: Intentional absence of any value.\n\n### Primitive Types\
    \ vs Non-Primitive Types\n- **Primitives**: Immutable and stored by value (String,\
    \ Number, Boolean, undefined, null, symbol, bigint).\n- **Non-Primitives (Objects)**:\
    \ Mutable and stored by reference (Object, Array, Function).\n"
  mdcn: "\n\n## 1. 变量\n\n变量是存储数据值的容器。在 JavaScript 中，你可以使用 `let`、`const` 和 `var` 来声明变量。\n\
    \n- `let`: 用于声明可以重新赋值的变量。\n- `const`: 用于声明不可重新赋值的变量。\n- `var`: 声明变量的旧方式（在现代 JS\
    \ 中已避免使用）。\n\n示例：\n```javascript\nlet x = 10;\nx = 20; // Allowed\n\nconst y =\
    \ 5;\n// y = 10; // 将抛错误\n```\n\n## 2. 数据类型\n\n数据类型定义了变量可以包含的数据类型。JavaScript 有几种类型：\n\
    \n- String（字符串）：用引号括的文本数据。\n- Number（数字）：整数和浮点数。\n- Boolean（布尔值）：true 或 false。\n\
    - Undefined（未定义）：已声明但未赋值的变量。\n- Null（空）：表示任何值的缺失。\n- Object（对象): 属性的集合。\n- Array（数组):\
    \ 列表类数据。\n\n示例：\n```javascript\nlet name = \"Alice\";\nlet age = 25;\nlet isStudent\
    \ = true;\nlet score;\nlet result = null;\nlet user = { name: \"Bob\", age: 30\
    \ };\nlet colors = [\"red\", \"green\", \"blue\"];\n```\n\n## 3. 运算符\n\n运算符用于对变量和值执行操作。\n\
    \n### 算术运算符\n| 运算符 | 描述 | 示例 | 结果 |\n| :--- | :--- | :--- | :--- |\n| `+` | 加法\
    \ | `5 + 2` | 7 |\n| `-` | 减法 | `5 - 2` | 3 |\n| `*` | 乘法 | `5 * 2` | 10 |\n|\
    \ `/` | 除法 | `5 / 2` | 2.5 |\n| `%` | 取模（余数） | `5 % 2` | 1 |\n| `**` | 幂 | `5\
    \ ** 2` | 25 |\n| `++` | 增一 | `x++` | 6 |\n| `--` | 减一 | `x--` | 4 |\n\n### 比较运算符\n\
    - `==`: 等于（仅检查值）。\n- `===`: 严格相等（检查值和类型）。\n- `!=`: 不等于。\n- `!==`: 严格不等于。\n- `>`:\
    \ 大于。\n- `<`: 小于。\n- `>=`: 大于等于。\n- `<=`: 小于等于。\n\n### 赋值运算符\n- `=`: 赋值。\n- `+=`:\
    \ 加并赋值。\n- `-=`: 减并赋值。\n- `*=`: 乘并赋值。\n- `/=`: 除并赋值。\n\n### 逻辑运算符\n- `&&`: 与（当两个操作数都为真时为真）。\n\
    - `||`: 或（当其中一个操作数为为真时为真）。\n- `!`: 非（反转结果）。\n\n## 4. 控制流\n\n控制结构决定代码的执行路径。\n\n\
    ### 条件语句 (if...else)\n```javascript\nlet age = 18;\nif (age >= 18) {\n  console.log(\"\
    Adult\");\n} else {\n  console.log(\"Minor\");\n}\n```\n\n### 循环 (for, while)\n\
    循环用于重复执行一段代码块。\n\n```javascript\n// For 循环\nfor (let i = 0; i < 5; i++) {\n  console.log(i);\n\
    }\n\n// While 循环\nlet j = 0;\nwhile (j < 5) {\n  console.log(j);\n  j++;\n}\n\
    ```\n\n## 5. 函数\n\n函数是可重用的代码块，旨在执行特定任务。\n\n```javascript\n// 函数声明\nfunction greet(name)\
    \ {\n  return \"Hello, \" + name;\n}\n\nconsole.log(greet(\"World\"));\n\n// 箭头函数\n\
    const add = (a, b) => a + b;\nconsole.log(add(5, 3));\n```\n\n## 6. 数组\n\n数组用于在单个变量中存储多个值。\n\
    \n```javascript\nlet fruits = [\"apple\", \"banana\", \"cherry\"];\nconsole.log(fruits[0]);\
    \ // Apple\nfruits.push(\"orange\"); // 添加到末尾\nconsole.log(fruits.length); //\
    \ 4\n```\n\n## 7. 对象\n\n对象用于存储相关数据和方法的集合。\n\n```javascript\nlet car = {\n  brand:\
    \ \"Toyota\",\n  model: \"Corolla\",\n  year: 2022,\n  start: function() {\n \
    \   console.log(\"Engine is starting...\");\n  }\n};\n\nconsole.log(car.brand);\n\
    car.start();\n```\n\n## 8. DOM 操作\n\n文档对象模型（DOM）允许 JavaScript 修改 HTML 和 CSS。\n\
    \n```javascript\n// 选择元素\nlet title = document.getElementById(\"title\");\n\n\
    // 修改内容\ntitle.innerText = \"New Title\";\n\n// 修改样式\ntitle.style.color = \"blue\"\
    ;\n\n// 添加事件监听\nlet btn = document.querySelector(\"button\");\nbtn.addEventListener(\"\
    click\", () => {\n  alert(\"Button clicked!\");\n});\n```\n\n## 9. 理解数据类型（详细）\n\
    \nJavaScript 是动态类型语言，这意味着变量可以动态地更改类型。\n\n- `string`: 文本序列。\n- `number`: 整数和浮点数。\n\
    - `boolean`: `true` 或 `false`。\n- `undefined`: 声明但未赋值的变量。\n- `null`: 显式的空值。\n\
    - `object`: 复杂数据结构。\n- `array`: 用于列表的特殊对象类型。\n- `function`: 函数也是对象。\n- `symbol`:\
    \ 唯一标识符。\n- `bigint`: 用于大整数。\n\n### 特殊值\n- `NaN`: 不是数字（无效数学运算的结果）。\n- `Infinity`:\
    \ 比任何数字都大的值。\n- `-Infinity`: 比任何数字都小的值。\n- `undefined`: 自动赋值给未初始变量。\n- `null`:\
    \ 有意的缺失。\n\n### 基本类型 vs 非基本类型\n- **基本类型 (Primitives)**: 不可变的并按值存储（String, Number,\
    \ Boolean, undefined, null, symbol, bigint）。\n- **非基本类型 (Objects)**: 可变的并按引用存储（Object,\
    \ Array, Function）。\n\n"
