- md: "\n## HTML 基础\n\nHTML (HyperText Markup Language) 是用于构建网页结构的标准标记语言。它通过各种标签（Tags）来定义页面的元素。\n\
    \n### 常用 HTML 标签\n- `<html>`: 页面的根元素。\n- `<head>`: 包含文档元数据（如标题、样式表等）。\n- `<body>`:\
    \ 包含网页的可可见内容。\n- `<h1>` 到 `<h6>`: 定义标题。\n- `<p>`: 定义段落。\n- `<a>`: 定义超链接。\n- `<img>`:\
    \ 定义图像。\n- `<ul>`, `<li>`: 定义无序列表。\n- `<ol>`, `<li>`: 定义有序列表。\n- `<table>`: 定义表格。\n\
    \n## CSS 样式表\n\nCSS (Cascading Style Sheets) 用于控制网页的呈现样式、布局和视觉效果。\n\n### CSS 常用属性\n\
    - `color`: 设置文本颜色。\n- `background-color`: 设置背景颜色。\n- `font-size`: 设置字体大小。\n- `margin`:\
    \ 设置元素外边距。\n- `padding`: 设置元素内边距。\n- `border`: 设置元素边框。\n- `display`: 控制显示模式（如\
    \ `block`, `inline`, `flex` 等）。\n\n## JavaScript 交互\n\nJavaScript 是一门脚本语言，用于为网页添加交互功能。\n\
    \n### DOM 操作\nDOM (Document Object Model) 允许 JavaScript 动态访问 HTML 结构。\n- `document.getElementById(id)`:\
    \ 通过 ID 获取元素。\n- `document.querySelector(selector)`: 通过选择器获取元素。\n- `element.addEventListener()`:\
    \ 添加事件监听。\n- `element.innerHTML`: 修改元素内容。\n- `document.createElement()`: 创建新元素。\n\
    \n## 示例代码\n\n以下是一个简单的 HTML 页面结构示例：\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    zh-CN\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>示例页面</title>\n    <link\
    \ rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n    <h1 id=\"title\"\
    >欢迎来到我的网页</h1>\n    <p class=\"description\">这是一个通过 OCR 修复后的示例内容。</p>\n    <button\
    \ id=\"myBtn\">点击我</button>\n\n    <script src=\"script.js\"></script>\n</body>\n\
    </html>\n```\n"
  mdcn: "\n\n## HTML 基础\n\nHTML (HyperText Markup Language) 是用于构建网页结构的标准标记语言。它通过各种标签（Tags）来定义页面的元素。\n\
    \n### 常用 HTML 标签\n- `<html>`: 页面的根元素。\n- `<head>`: 包含文档元数据（如标题、样式表等）。\n- `<body>`:\
    \ 包含网页的可可见内容。\n- `<h1>` 到 `<h6>`: 定义不同层级的标题。\n- `<p>`: 定义段落。\n- `<a>`: 定义超链接。\n\
    - `<img>`: 定义图像。\n- `<ul>`, `<li>`: 定义无序列表。\n- `<ol>`, `<li>`: 定义有序列表。\n- `<table>`:\
    \ 定义表格。\n\n## CSS 样式表\n\nCSS (Cascading Style Sheets) 用于控制网页的呈现样式、布局和视觉效果。\n\n\
    ### CSS 常用属性\n- `color`: 设置文本颜色。\n- `background-color`: 设置背景颜色。\n- `font-size`:\
