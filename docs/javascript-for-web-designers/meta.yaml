- md: "\n## JavaScript Variables\n\nIn JavaScript, there are three ways to declare\
    \ variables: `var`, `let`, and `const`. The `var` keyword was the only way to\
    \ declare variables before ES6 (2015).\n\n```javascript\nvar foo;\nconsole.log(foo);\
    \ // undefined\n```\n\nWhen you declare a variable without assigning a value,\
    \ its value is `undefined`.\n\n```javascript\nvar bar;\n*undefined*\nbar;\n*undefined*\n\
    whatever;\n*Uncaught ReferenceError: whatever is not defined*\n```\n\nIf you try\
    \ to use a variable that has not been declared, JavaScript will throw a ReferenceError.\n\
    \n```javascript\nvar bar;\n* bar; // undefined\n```\n\nIf you declare a variable\
    \ and assign it a value, that value is stored.\n\n```javascript\nvar foo = 5;\n\
    *undefined*\n```\n\nIf you declare a variable and then reassign it, the old value\
    \ is lost.\n\n```javascript\nvar foo = 5;\n*undefined*\nfoo = 10; // 10\n```\n\
    \n## Let and Const\n\nIn ES6, `let` and `const` were introduced to provide better\
    \ alternatives to `var`. `let` and `const` are block-scoped, whereas `var` is\
    \ function-scoped.\n\n```javascript\nif (true) {\n  let x = 10;\n  console.log(x);\
    \ // 10\n}\nconsole.log(x); // ReferenceError: x is not defined\n```\n\n`let`\
    \ allows you to reassign values, but `const` does not.\n\n```javascript\nlet foo\
    \ = \"hello\";\nfoo = \"world\"; // ok\n\nconst bar = \"hello\";\nbar = \"world\"\
    ; // TypeError: Assignment to constant variable\n```\n\n`const` must be initialized\
    \ at the time of declaration.\n\n```javascript\nconst pi = 3.14;\nconst fruits\
    \ = [\"apple\", \"banana\"];\nfruits.push(\"orange\"); // ok, the array itself\
    \ is not reassigned\n```\n\n## Arrays\n\nArrays in JavaScript are used to store\
    \ multiple values in a single variable. Arrays can hold different types of data.\n\
    \n```javascript\nvar fruits = [\"apple\", \"banana\", \"orange\"];\nconsole.log(fruits.length);\
    \ // 3\nconsole.log(fruits[0]); // apple\n```\n\nYou can add elements to an array\
    \ using the `push()` method.\n\n```javascript\nvar fruits = [\"apple\", \"banana\"\
    ];\nfruits.push(\"cherry\");\nconsole.log(fruits.length); // 3\n```\n\nYou can\
    \ also access elements by their index, which is zero-based. If you try to access\
    \ an index that doesn't exist, it returns `undefined`.\n\n```javascript\nvar fruits\
    \ = [\"apple\", \"banana\"];\nconsole.log(fruits[1]); // banana\nconsole.log(fruits[5]);\
    \ // undefined\n```\n\n## Functions\n\nFunctions are blocks of code designed to\
    \ perform a particular task. They are executed when they are called.\n\n```javascript\n\
    function greet() {\n  console.log(\"Hello, world!\");\n}\ngreet(); // Hello, world!\n\
    ```\n\nFunctions can take parameters and return values.\n\n```javascript\nfunction\
    \ add(a, b) {\n  return a + b;\n}\nconsole.log(add(5, 3)); // 8\n```\n\n## Arrow\
    \ Functions\n\nArrow functions provide a shorter syntax for writing functions.\n\
    \n```javascript\nconst multiply = (a, b) => {\n  return a * b;\n};\nconsole.log(multiply(4,\
    \ 3)); // 12\n```\n\nFor single-expression functions, you can omit the curly braces\
    \ and the `return` keyword.\n\n```javascript\nconst square = (n) => n * n;\nconsole.log(square(5));\
    \ // 25\n```\n\n## Objects\n\nObjects are used to store collections of data in\
    \ key-value pairs.\n\n```javascript\nvar user = {\n  name: \"Alice\",\n  age:\
    \ 30,\n  city: \"New York\"\n};\nconsole.log(user.name); // Alice\n```\n\nYou\
    \ can access object properties using dot notation or bracket notation.\n\n```javascript\n\
    console.log(user.name); // Alice\nconsole.log(user[\"age\"]); // 30\n```\n\nObjects\
    \ can also have methods, which are functions stored as properties.\n\n```javascript\n\
    var person = {\n  name: \"Bob\",\n  greet: function() {\n    console.log(\"Hello,\
    \ my name is \" + this.name);\n  }\n};\nperson.greet(); // Hello, my name is Bob\n\
    ```\n\n## Classes\n\nClasses are blueprints for creating objects. They help encapsulate\
    \ data and behavior.\n\n```javascript\nclass Animal {\n  constructor(name) {\n\
    \    this.name = name;\n  }\n  speak() {\n    console.log(this.name + \" makes\
    \ a sound.\");\n  }\n}\nconst myAnimal = new Animal(\"Rex\");\nmyAnimal.speak();\
    \ // Rex makes a sound.\n```\n\nInheritance allows one class to inherit properties\
    \ and methods from another.\n\n```javascript\nclass Dog extends Animal {\n  constructor(name,\
    \ breed) {\n    super(name);\n    this.breed = breed;\n  }\n  bark() {\n    console.log(this.name\
    \ + \" barks!\");\n  }\n}\nconst myDog = new Dog(\"Buddy\", \"Golden Shepherd\"\
    );\nmyDog.bark(); // Buddy barks!\n```\n\n## Asynchronous JavaScript\n\nAsynchronous\
    \ programming allows JavaScript to perform long-running tasks without blocking\
    \ the main execution thread.\n\n```javascript\nconsole.log(\"Start\");\nsetTimeout(()\
    \ => {\n  console.log(\"Timeout after 2 seconds\");\n}, 2000);\nconsole.log(\"\
    End\");\n// Output:\n// Start\n// End\n// Timeout after 2 seconds\n```\n\nPromises\
    \ are objects representing the eventual completion (or failure) of an asynchronous\
    \ operation.\n\n```javascript\nconst promise = new Promise((resolve, reject) =>\
    \ {\n  const success = true;\n  setTimeout(() => {\n    if (success) {\n     \
    \ resolve(\"Success!\");\n    } else {\n      reject(\"Error!\");\n    }\n  },\
    \ 1000);\n});\n\npromise\n  .then(result => console.log(result))\n  .catch(error\
    \ => console.error(error));\n```\n\n`async/await` syntax provides a cleaner way\
    \ to work with promises.\n\n```javascript\nasync function fetchData() {\n  try\
    \ {\n    const result = await promise;\n    console.log(result);\n  } catch (error)\
    \ {\n    console.error(error);\n  }\n}\nfetchData();\n```\n\n## DOM Manipulation\n\
    \nThe DOM (Document Object Model) allows JavaScript to interact with and modify\
    \ HTML content.\n\n```javascript\nconst title = document.getElementById(\"mainTitle\"\
    );\ntitle.textContent = \"New Title\";\n\nconst button = document.querySelector(\"\
    .myButton\");\nbutton.addEventListener(\"click\", () => {\n  alert(\"Button clicked!\"\
    );\n});\n```\n"
  mdcn: "\n\n## JavaScript 变量\n\n在 JavaScript 中，有三种声明变量的方法：`var`、`let` 和 `const`。在\
    \ ES6 (2015) 之前，`var` 关键字是声明变量的唯一方式。\n\n```javascript\nvar foo;\nconsole.log(foo);\
    \ // undefined\n```\n\n当你在声明变量时不为其赋值时，它的值值为 `undefined`。\n\n```javascript\nvar\
    \ bar;\n*undefined*\nbar;\n*undefined*\nwhatever;\n*Uncaught ReferenceError: whatever\
    \ is not defined*\n```\n\n如果你尝试使用一个未声明的变量，JavaScript 将抛出 `ReferenceError`。\n\n\
    ```javascript\nvar bar;\n* bar; // undefined\n```\n\n如果你声明了一个变量并给它赋值，该值就会被存储起来。\n\
    \n```javascript\nvar foo = 5;\n*undefined*\n```\n\n如果你声明了一个变量然后对其进行重新赋值，旧值将会丢失。\n\
    \n```javascript\nvar foo = 5;\n*undefined*\nfoo = 10; // 10\n```\n\n## Let 和 Const\n\
    \n在 ES6 中，引入了 `let` 和 `const` 来为 `var` 提供更好的替代方案。`let` 和 `const` 是块级作用域，而 `var`\
    \ 是函数作用域。\n\n```javascript\nif (true) {\n  let x = 10;\n  console.log(x); // 10\n\
    }\nconsole.log(x); // ReferenceError: x is not defined\n```\n\n`let` 允许你重新赋值，但\
    \ `const` 不行。\n\n```javascript\nlet foo = \"hello\";\nfoo = \"world\"; // ok\n\
    \nconst bar = \"hello\";\nbar = \"world\"; // TypeError: Assignment to constant\
    \ variable\n```\n\n`const` 必须在声明时初始化。\n\n```javascript\nconst pi = 3.14;\nconst\
    \ fruits = [\"apple\", \"banana\"];\nfruits.push(\"orange\"); // ok, 数组本身没有被重新赋值\n\
    ```\n\n## 数组\n\nJavaScript 中的数组用于在单个变量中存储多个值。数组可以包含不同类型的数据。\n\n```javascript\n\
    var fruits = [\"apple\", \"banana\", \"orange\"];\nconsole.log(fruits.length);\
    \ // 3\nconsole.log(fruits[0]); // apple\n```\n\n你可以使用 `push()` 方法向数组添加元素。\n\n\
    ```javascript\nvar fruits = [\"apple\", \"banana\"];\nfruits.push(\"cherry\");\n\
    console.log(fruits.length); // 3\n```\n\n你也可以通过索引访问元素，索引从 0 开始。如果你尝试访问一个不存在的索引，它将返回\
    \ `undefined`。\n\n```javascript\nvar fruits = [\"apple\", \"banana\"];\nconsole.log(fruits[1]);\
    \ // banana\nconsole.log(fruits[5]); // undefined\n```\n\n## 函数\n\n函数是用于执行特定任务的代码块。它们在被调用时执行。\n\
    \n```javascript\nfunction greet() {\n  console.log(\"Hello, world!\");\n}\ngreet();\
    \ // Hello, world!\n```\n\n函数可以接收参数并返回结果。\n\n```javascript\nfunction add(a, b)\
    \ {\n  return a + b;\n}\nconsole.log(add(5, 3)); // 8\n```\n\n## 箭头函数\n\n箭头函数为编写函数提供了更短的语法。\n\
    \n```javascript\nconst multiply = (a, b) => {\n  return a * b;\n};\nconsole.log(multiply(4,\
    \ 3)); // 12\n```\n\n对于单表达式函数，你可以省略大括号和 `return` 关键字。\n\n```javascript\nconst\
    \ square = (n) => n * n;\nconsole.log(square(5)); // 25\n```\n\n## 对象\n\n对象用于以键值对的形式存储数据集合。\n\
    \n```javascript\nvar user = {\n  name: \"Alice\",\n  age: 30,\n  city: \"New York\"\
    \n};\nconsole.log(user.name); // Alice\n```\n\n你可以使用点符号或方括号符号来访问对象的属性。\n\n```javascript\n\
    console.log(user.name); // Alice\nconsole.log(user[\"age\"]); // 30\n```\n\n对象还可以拥有方法，即作为属性存储存储的函数。\n\
    \n```javascript\nvar person = {\n  name: \"Bob\",\n  greet: function() {\n   \
    \ console.log(\"Hello, my name is \" + this.name);\n  }\n};\nperson.greet(); //\
    \ Hello, my name is Bob\n```\n\n## 类\n\n类是创建对象的蓝图。它们有助于封装数据和行为。\n\n```javascript\n\
    class Animal {\n  constructor(name) {\n    this.name = name;\n  }\n  speak() {\n\
    \    console.log(this.name + \" makes a sound.\");\n  }\n}\nconst myAnimal = new\
    \ Animal(\"Rex\");\nmyAnimal.speak(); // Rex makes a sound.\n```\n\n继承允许一个类继承另一个类的属性和方法。\n\
    \n```javascript\nclass Dog extends Animal {\n  constructor(name, breed) {\n  \
    \  super(name);\n    this.breed = breed;\n  }\n  bark() {\n    console.log(this.name\
    \ + \" barks!\");\n  }\n}\nconst myDog = new Dog(\"Buddy\", \"Golden Shepherd\"\
    );\nmyDog.bark(); // Buddy barks!\n```\n\n## 异步 JavaScript\n\n异步编程允许 JavaScript\
    \ 执行耗时任务而不阻塞主执行线程。\n\n```javascript\nconsole.log(\"Start\");\nsetTimeout(() =>\
    \ {\n  console.log(\"Timeout after 2 seconds\");\n}, 2000);\nconsole.log(\"End\"\
    );\n// 输出：\n// Start\n// End\n// Timeout after 2 seconds\n```\n\nPromises 是代表异步操作最终完成（或失败）的对象。\n\
    \n```javascript\nconst promise = new Promise((resolve, reject) => {\n  const success\
    \ = true;\n  setTimeout(() => {\n    if (success) {\n      resolve(\"Success!\"\
    );\n    } else {\n      reject(\"Error!\");\n    }\n  }, 1000);\n});\n\npromise\n\
    \  .then(result => console.log(result))\n  .catch(error => console.error(error));\n\
    ```\n\n`async/await` 语法为处理 promise 提供了一种更简洁的方式。\n\n```javascript\nasync function\
    \ fetchData() {\n  try {\n    const result = await promise;\n    console.log(result);\n\
    \  } catch (error) {\n    console.error(error);\n  }\n}\nfetchData();\n```\n\n\
    ## DOM 操作\n\nDOM（文档对象模型）允许 JavaScript 与 HTML 内容交互并修改。\n\n```javascript\nconst\
    \ title = document.getElementById(\"mainTitle\");\ntitle.textContent = \"New Title\"\
    ;\n\nconst button = document.querySelector(\".myButton\");\nbutton.addEventListener(\"\
    click\", () => {\n  alert(\"Button clicked!\");\n});\n```\n\n"
