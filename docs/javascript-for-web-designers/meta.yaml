- md: "\n## 数组\n\n数组是JavaScript中用于存储多个值的数据结构。数组可以存储任何类型的值，包括字符串、数字、布尔值、甚至是另一个数组或对象。数组是有序的，这意味着每个元素都有特定的索引（index）。\n\
    \n- 数组的索引从0开始计数的。\n- 数组可以动态地改变长度。\n- 数组提供了许多内置方法来操作其中的元素。\n\n### 如何创建数组\n\n你可以使用字面量符号\
    \ `[]` 来创建一个数组。\n\n```javascript\nvar myFirstArray = [ \"item1\", 2, 3, true,\
    \ \"last item\" ];\n```\n`*undefined*`\n`myFirstArray`\n`[\"item1\", 2, 3, true,\
    \ \"last item\"]*`\n\n### 访问元素\n\n你可以通过索引来访问数组中的元素。索引从0开始。\n\n```javascript\n\
    myFirstArray[ 0 ];\n*\"first\"*\n\nmyFirstArray[ 1 ];\n*\"second\"*\n\nmyFirstArray[\
    \ 2 ];\n*\"third\"*\n```\n\n### 修改元素\n\n你可以通过索引来修改数组中的特定值。\n\n```javascript\n\
    var mySecondArray = [ \"first\", \"second\", \"third\" ];\n```\n`*undefined*`\n\
    `mySecondArray;`\n`[\"first\", \"second\", \"third\"]*`\n\n```javascript\nmySecondArray[\
    \ 0 ] = \"apple\";\nmySecondArray[ 1 ] = \"banana\";\nmySecondArray[ 2 ] = \"\
    cherry\";\nmySecondArray[ 3 ] = \"date\";\n```\n\n### 数组长度\n\n数组有一个 `length` 属性，表示数组中元素的数量。\n\
    \n```javascript\nvar mySecondArray = [ \"first\", \"second\", \"third\" ];\n```\n\
    `mySecondArray.length;`\n*3*`\n\n### 添加元素\n\n你可以使用 `push()` 方法向数组末尾添加新元素。\n\n\
    ```javascript\nmySecondArray.push(\"date\");\n```\n`mySecondArray;`\n`[\"first\"\
    , \"second\", \"third\", \"date\"]*`\n\n### 删除元素\n\n你可以使用 `pop()` 方法从数组末尾删除最后一个元素。\n\
    \n```javascript\nmySecondArray.pop();\n```\n`mySecondArray;`\n`[\"first\", \"\
    second\", \"third\"]*`\n\n### Shift 方法\n\n你可以使用 `shift()` 方法从数组开头删除第一个元素。\n\n\
    ```javascript\nmySecondArray.shift();\n```\n`mySecondArray;`\n`[\"second\", \"\
    third\"]*`\n\n### Unshift 方法\n\n你可以使用 `unshift()` 方法向数组开头插入新元素。\n\n```javascript\n\
    mySecondArray.unshift(\"apple\");\n```\n`mySecondArray;`\n`[\"apple\", \"second\"\
    , \"third\"]*`\n\n### Splice 方法\n\n`splice()` 方法用于在数组的任何位置添加、删除或替换元素。\n\n```javascript\n\
    var mySecondArray = [ \"first\", \"second\", \"third\" ];\nmySecondArray.splice(1,\
    \ 1, \"new item\");\n```\n`mySecondArray;`\n`[\"first\", \"new item\", \"third\"\
    ]*`\n\n### Slice 方法\n\n`slice()` 方法返回一个数组的一个部分的新数组，不会修改原数组。\n\n```javascript\n\
    var mySecondArray = [ \"first\", \"second\", \"third\" ];\nvar result = mySecondArray.slice(1,\
    \ 3);\n```\n`result;`\n`[\"second\", \"third\"]*`\n\n### Join 方法\n\n`join()` 方法将数组的所有元素连接成一个字符串。\n\
    \n```javascript\nvar myFirstArray = [ \"item1\", 2, 3 ];\nvar str = myFirstArray.join(\"\
    -\");\n```\n`str;`\n*\"item1-2-3\"*\n\n\n\n### IndexOf 方法\n\n`indexOf()` 方法返回指定元素在数组中第一次找到的索引。\n\
    \n```javascript\nvar myFirstArray = [ \"item1\", 2, 3 ];\nvar index = myFirstArray.indexOf(2);\n\
    ```\n`index;`\n*1*`\n\n### Find 方法\n\n`find()` 方法返回数组中第一个通过提供测试函数的元素。\n\n```javascript\n\
    var myFirstArray = [ \"item1\", 2, 3 ];\nvar item = myFirstArray.find(function(element)\
    \ { return element > 1; });\n```\n`item;`\n*2*`\n\n### Filter 方法\n\n`filter()`\
    \ 方法创建一个包含所有通过提供测试函数的元素的新数组。\n\n```javascript\nvar myFirstArray = [ 1, 2, 3 ];\n\
    var filtered = myFirstArray.filter(function(element) { return element > 1; });\n\
    ```\n`filtered;`\n*[2, 3]*`\n\n### Map 方法\n\n`map()` 方法创建一个新数组，其结果是对原数组每个元素执行回调函数的结果。\n\
    \n```javascript\nvar myFirstArray = [ 1, 2, 3 ];\nvar doubled = myFirstArray.map(function(element)\
    \ { return element * 2; });\n```\n`doubled;`\n*[2, 4, 6]*`\n\n### ForEach 方法\n\
    \n`forEach()` 方法对数组的每个元素执行一次提供的函数。\n\n```javascript\nvar myFirstArray = [ \"item1\"\
    , 2, 3 ];\nmyFirstArray.forEach(function(element) { console.log(element); });\n\
    ```\n\n## 对象\n\n对象是JavaScript中存储键值对（key-value pairs）的数据结构。每个属性由一个键（也称为属性名）和一个值组成。\n\
    \n### 创建对象\n\n你可以使用字面量符号 `{}` 来创建一个对象。\n\n```javascript\nvar myDog = {\n  name:\
    \ \"Zero\",\n  color: \"orange\",\n  ageInYears: 3,\n  wellBehaved: false\n};\n\
    ```\n\n### 访问属性\n\n你可以通过点符号或方括号来访问对象的属性。\n\n```javascript\nmyDog.name;\n*\"Zero\"\
    *\n\nmyDog[\"color\"];\n*\"orange\"*\n```\n\n### 修改属性\n\n你可以通过赋值来修改对象的属性值。\n\n\
    ```javascript\nmyDog.name = \"Buddy\";\nmyDog.ageInYears = 5;\n```\n\n### 添加属性\n\
    \n你可以随时向对象添加新属性。\n\n```javascript\nmyDog.breed = \"Golden Retriever\";\nmyDog.isHappy\
    \ = true;\n```\n\n```javascript\nmyDog.breed;\n*\"Golden Retriever\"*```\n\n###\
    \ 删除属性\n\n你可以使用 `delete` 关键字来删除对象的属性。\n\n```javascript\ndelete myDog.wellBehaved;\n\
    ```\n\n### 遍历对象\n\n你可以使用 `for...in` 循环来遍历对象的属性键。\n\n```javascript\nfor (var key\
    \ in myDog) {\n  console.log(key + \": \" + myDog[key]);\n}\n```\n\n### 嵌套对象\n\
    \n对象可以包含另一个对象作为属性。\n\n```javascript\nvar myDog = {\n  name: {\n    first: \"Zero\"\
    ,\n    middle: \"Baskerville\",\n    last: \"Marquis\"\n  },\n  color: \"orange\"\
    ,\n  ageInYears: 3,\n  wellBehaved: false\n};\n```\n\n```javascript\nmyDog.name.first;\n\
    *\"Zero\"*\n\nmyDog.name.last;\n*\"Marquis\"*\n```\n"
