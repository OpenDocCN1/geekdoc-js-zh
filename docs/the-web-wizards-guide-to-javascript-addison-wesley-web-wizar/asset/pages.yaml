  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_120_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_120_1.png)\n\
    \nFrequently Asked Questions about Cookies 109 \n\nfrequently Asked Questions\
    \ about Cookies \n\nQ. Can cookies transmit computer viruses? \n\nA. No. Viruses\
    \ are computer programs. Plain text files are not computer programs. \n\nBecause\
    \ cookies are plain text residing in text files, they can't store or run computer\
    \ \n\nprograms the way viruses can. Also, the size of a cookie is limited to 4\
    \ kilobytes. \n\nEven if a computer program could be stored in a cookie, it would\
    \ be difficult to cre¬ \n\nate one that small. \n\nQ. Can hackers use cookies\
    \ to steal credit card information? \n\nA. It's unlikely. Cookies contain only\
    \ information that you supply. When you sup¬ \n\nply your credit card number during\
    \ an online purchase, the Web server stores that \n\ninformation in its secure\
    \ database and not in a cookie on your hard drive. Any \n\ncompany foolish enough\
    \ to store sensitive information in a cookie would soon be \n\nout of business.\
    \ Because cookies are readable text files, it would be only a matter of \n\nhours\
    \ before some alert visitor noticed the presence of her credit card number in\
    \ a \n\ncookie on her hard drive. \n\nQ. Can hackers read the information stored\
    \ in my cookies? \n\nA. No. Cookies contain information about the site that created\
    \ them. Only the site \n\nthat creates a cookie can read that cookie. If some\
    \ site actually stored sensitive \n\ninformation in a cookie, it would be the\
    \ only site that could retrieve it. \n\nQ. Can marketing firms invade my privacy\
    \ using cookies? \n\nA. Potentially. The Doubleclick Network stores customer profiles\
    \ in cookies but \n\ndoes not store user names, e-mail addresses, or telephone\
    \ numbers. Instead, each \n\ncustomer profile is anonymous. Banner ads on sites\
    \ that use the Doubleclick serv¬ \n\nice are customized to suit the interests\
    \ of the person described in the customer pro¬ \n\nfile. In February 2000, Doubleclick\
    \ proposed to link these customer profiles with \n\nactual identities. The furor\
    \ that arose was enough to convince Doubleclick and \n\nother companies that such\
    \ behavior would yield nothing but ill will. Even so, \n\nmany persons feel uncomfortable\
    \ with the idea that they are being profiled on the \n\nInternet. \n\nQ. Is there\
    \ anything I can do to minimize privacy issues with cookies? \n\nA. Certainly.\
    \ All Web browsers have preference settings to allow you to manage \n\nyour cookies.\
    \ You can choose to have the browser automatically accept all cookies, \n\nnever\
    \ accept any cookies, or ask you each time a site wishes to send a cookie. Also,\
    \ \n\nsites that use cookies to store visitor preferences should have a posted\
    \ policy on \n\nwhat information is stored and how it will be used. \n\nQ. How\
    \ many cookies can I create for my Web page? \n\nA. No more than 20 cookie records\
    \ can be stored in the cookie property per \n\ndomain. Most professional sites\
    \ that use cookies store only one cookie to identify \n\nthe visitor with a unique\
    \ ID number or text string. The rest of the data needed to \n\ncustomize the visitor's\
    \ experience is stored in a related database record on the serv¬ \n\ner. This\
    \ is a good practice because it avoids storing sensitive information in cookie\
    \ \n\nrecords."
