    \nw Summary \n\nForms are popular features of the Web, particularly in elec¬ \n\
    \ntronic commerce. JavaScript is often used to ensure that \n\nvisitors enter\
    \ required information before submitting a \n\nform, a process known as form validation.\
    \ \n\n► To validate a text field, you first determine whether a \n\nvalue has\
    \ been entered. For example, to determine \n\nwhether the visitor neglected to\
    \ enter information into a \n\nrequired field, you may test the expression \n\n\
    (! document. survey. visitor. value). If that \n\nexpression is true then the\
    \ visitor failed to enter required \n\ninformation into the visitor field.You\
    \ can also check to \n\nmake sure the information is in the correct format in\
    \ terms of numbers and punctu¬ \n\nation. \n\nYou can create JavaScript code that\
    \ will change the format of visitor-entered text if \n\nit is in the wrong format\
    \ for your purposes. \n\nBrowsers automatically store a set of radio buttons,\
    \ all bearing the same name, in an \n\narray. For example, if you have two radio\
    \ buttons called gender, the first one, \n\ngender \\[ 0 \\], might have a value\
    \ of male and the second one, gender \\[ 1 \\], might \n\nhave a value of female.\
    \ You can use JavaScript expressions to see which button is \n\nchecked and to\
    \ find its value. \n\nOften, it makes sense to create a series of check boxes\
    \ with sequential names such as \n\ndegree 1, degree2, and so on. You can then\
    \ use a loop to determine which ones \n\nare checked. \n\nA common technique for\
    \ obtaining the value of a selected item in a SELECT menu \n\nis to store the\
    \ SELECT object in a variable, find the number of the selected option \n\n(the\
    \ selectedlndex property), and then find the value of the selected option. \n\n\
    A variant of form validation allows you to create self-grading online study aids.\
    \ \n\nA Online References \n\nDr. Estrella's Interactive Web Programming. This\
    \ site contains examples of form valida¬ \n\ntion. Look in the \"Scripts to Study\"\
    \ section for examples, \n\nhttp://www.stevenestrella.com/IWP \n\nW3Schools.com\
    \ has a collection of useful form validation examples, \n\nhttp://www.w3schools.com/js/js\
    \ form.asp \n\n58"
