    ,\"Montana\") ; v \n\nvar capital \\= new Array(\"Cheyenne\",\"Boise\",\"Helena\"\
    ) ; \n\nvar population \\= new Array (\" 455,975 \" , \" 1,011,986 \" , \\-> \n\
