    \n3 \n\nFundamental Concepts \n\nMS\\*\\* \n\nof javaScript \n\norganized very\
    \ differently in Netscape Navigator 3 and Internet Explorer 3. As a \n\nresult,\
    \ the procedures for using JScript in Internet Explorer were different from the\
    \ \n\nprocedures for using JavaScript in Netscape Navigator. As the browsers developed,\
    \ \n\nthe languages began to diverge to accommodate the different object models\
    \ of \n\nthe two browsers. \n\nA European computer standards group known only\
    \ as ECMA (pionounced \n\n\"Eckma\") worked with Netscape and Microsoft to produce\
    \ a standard scripting lan¬ \n\nguage called ECMAScript in 1997. Both Netscape\
    \ Communicator 4 and Internet \n\nExplorer 4 implemented ECMAScript as the foundation\
    \ for the latest versions of \n\nJavaScript and JScript. Using ECMA and a little\
    \ creativity, Web authors gradually \n\ndeveloped programming practices that worked\
    \ equally well with the object models \n\nof both browsers. Those are the practices\
    \ that you'll learn in this book. \n\nfundamental Concepts of javaScript \n\n\
    As you read the following overview of JavaScript concepts and vocabulary, keep\
    \ in \n\nmind that it's an introductory reference. The first time each concept\
    \ or term \n\nappears in subsequent chapters, it will be explained in more detail.\
    \ For now, review \n\nthis section to get an overview of the language. \n\n☆TIP\
    \ The Web site for this book contains an interactive version of this overview\
    \ to \n\nassist you in understanding the concepts. Visit http: //www.awl.com/estrella.\
    \ \n\nObjects \n\nAn object is any definable thing. A car is one example of an\
    \ object in the physical \n\nworld. A car may contain other objects, such as a\
    \ trunk. In turn, the trunk may con¬ \n\ntain other objects, such as a spare tire.\
    \ \n\nJavaScript is an object-oriented language. In JavaScript, a hierarchy of\
    \ objects \n\nis represented in code using dot syntax. For example, here s how\
    \ you might use \n\ndot syntax to represent a spare tire: \n\ncar.trunk.sparetire\
    \ \n\nIn JavaScript, a Web browser window and a currently loaded HTML document\
    \ \n\nare examples of common objects created by the host environment (i.e., the\
    \ Web \n\nbrowser itself). The window contains the document, and the document\
    \ may con¬ \n\ntain other objects, such as images, forms, buttons, and links.\
    \ In JavaScript, every \n\nobject can be given a name and referred to in the code\
    \ using dot syntax. Here s an \n\nexample (illustrated in Figure 1.1): \n\nwindow.document.gardendog\
    \ \n\nThe code for this window would refer to an image \n\n☆tip Think of objects\
    \ as the named \"gardendog\" in a document loaded in a Web \n\nnouns of the javaScript\
    \ language. browser wjndow."
