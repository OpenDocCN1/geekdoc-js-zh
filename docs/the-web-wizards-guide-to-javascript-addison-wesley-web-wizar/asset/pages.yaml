    \ \n\nSelection Menu Form Validation \\- Netscape \n\nVisitor Site Preference\
    \ Survey \n\nName:^Thomas Dolby) \n\nChoose your favorite Web site: \n\nbeatnik.com\
    \ \n\nShow Author's Choice \n\nGo There! \n\nSend Survey \n\nFigure 3.5 Output\
    \ of Listing 3.6 \n\nHow Does It Work? \n\nListing 3.6 generates the following\
    \ sequence of events. \n\n1. The browser loads the page and creates the necessary\
    \ FORM and SELECT \n\nobjects in memory. A global variable called chosenSite is\
    \ created with an \n\ninitial value of an empty text string. The three functions\
    \ in the HEAD will use \n\nthis variable, so it must be placed outside any of\
    \ the functions. \n\n2. The visitor chooses a command from the SELECT menu labeled\
    \ \"Select a site\" \n\nand then clicks the Go There! button. That button is an\
    \ input of type \"but¬ \n\nton\" with an one lick handler that calls the opensite\
    \ ( ) function. \n\n3. The openSite( ) function, in the HEAD, calls the getSelectValue\
    \ ( ) \n\nfunction and passes the name of the form (survey) and the name of the\
    \ \n\nselect menu (websites) to determine the visitor's choice. \n\n4. The getSelectValue\
    \ ( ) function creates a temporary variable called \n\ntheMenu and fills it with\
    \ the websites SELECT object on the survey \n\nform. It does this by exploiting\
    \ the built-in arrays of the document and \n\nform objects. The document contains\
    \ an array of all objects on the page."
