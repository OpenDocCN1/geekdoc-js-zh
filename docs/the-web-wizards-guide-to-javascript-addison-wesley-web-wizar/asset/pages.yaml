    \n18 \n\nChapter Two Enhancing Web Pages with JavaScript \n\n☆ \n\n★ \n\nTo learn\
    \ how to use a Web page that creates other Web pages \n\nTo understand how to\
    \ create a Web page to test your code \n\nSequence: Doing Things in a Given Order\
    \ \n\nImagine for a moment that you are the parent of a 13-year-old boy who is\
    \ begin¬ \n\nning to grow facial hair. Let's call him Alex. It's your job to teach\
    \ Alex how to shave \n\nhis face. Your explanation might go something like this:\
    \ \n\n1. Wash your face with a wet cloth. \n\n2. Apply shaving cream to your skin.\
    \ \n\n3. Scrape a razor blade over your skin to remove facial hair. \n\n4. Apply\
    \ after-shave lotion to your face. \n\n5. Scream loudly. \n\nThese five steps\
    \ represent a sequence of \n\ninstructions. Alex performs instruction 2 only \n\
    \nafter completing instruction 1 and so on. \n\nSimilarly, a Web browser performs\
    \ a series of \n\nJavaScript statements in the order it receives \n\nthem. Unlike\
    \ Alex, however, your browser doesn't have any intelligence. You must \n\ntherefore\
    \ take care to be precise in crafting your instructions. \n\nl^TTIP If you read\
