    \nFundamental Concepts of JavaScript \n\n8 \n\nStfilliSl \n\nChapter One JavaScript\
    \ Basics \n\n<html><head><title>sunflower image swap</title></head> \n\n<body\
    \ bgcolor=\"white\"> \n\n<a href=\"#\" onmouseover=\"document.sunflowerphoto.src\
    \ \\= “• \n\n'sunflowers.jpg';\" \n\nonmouseout=\"document.sunflowerphoto.src\
    \ \\= \n\n'sunflowerlady.jpg'; \n\n<img src=\"sunflowerlady.jpg\" width=\"300\"\
    \ height=\"200\" \n\nname=\"sunflowerphoto\" border=\"0\"></a> \n\n</body> \n\n\
    </html> \n\nListing 1.2 Image Swapping \n\n☆TIP JavaScript portions of the code\
    \ \n\nlistings in this book appear in blue. \n\n☆ warning Be Sensitive! \n\nWhen\
    \ you learned HTML, you were probably relieved to discover that HTML tags are\
    \ not case-sen¬ \n\nsitive. <IMG> and <img> are the same in HTML. JavaScript,\
    \ however, is case-sensitive. In the cur¬ \n\nrent example, \"sunflowerphoto\"\
    \ and \"SunflowerPhoto\" are not equivalent. As you name objects \n\nand refer\
    \ to them in JavaScript code, be aware of uppercase and lowercase letters. \n\n\
    Variables \n\nIn real life, we deal with variables all the time. At a diner, several\
    \ regular cus¬ \n\ntomers may order \"the usual.\" The food server, being familiar\
    \ with each patron, \n\nassigns the value \"ham and cheese\" to the variable \"\
    the usual\" for one patron, and \n\nassigns the value \"veggie burger\" to the\
    \ variable \"the usual\" for another patron. In \n\nthis case, the scope of the\
    \ variable is local. It is valid only at a particular diner. If \n\nthe patron\
    \ goes to a new diner and requests \"the usual,\" the food server will not \n\n\
    understand. A global variable, on the other hand, would be understood in every\
    \ \n\nrestaurant in the world. An example of a global variable is \"the check\"\
    ; every food \n\nserver understands that each customer must pay for the food.\
    \ \n\nWhen a variable contains a value, you can assign that value to the property\
    \ of \n\nan object. The following code illustrates the creation and use of a variable\
    \ to assign \n\nthe color teal to the Beetle instance of the car object. Notice\
    \ that the var keyword \n\nis used to initialize (that is, to create) a variable.\
    \ \n\nvar myFavoriteColor \\= \"teal\"; \n\nBeetle.color \\= myFavoriteColor;\
    \ \n\nSimilarly, in JavaScript, the value for a property such as bgColor can be\
    \ placed \n\nin a variable: \n\nvar myBackgroundColor \\= \"silver\"; \n\nwindow.document.bgColor\
    \ \\= myBackgroundColor;"
