- img_proc: true
  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_174_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_174_1.png)\n\
    \n■SB \n\nControlling Text Displayed in the Status Bar \n\n163 \n\n<li><a href=\"\
    http://www.stevenestrella.com/\" \n\nonmouseover=\"statusUpdate{3);return true;\"\
    \ \n\nonmouseout=\"statusUpdate(0);return true;\"\\> \n\nThe Author's Web Site</a></li>\
    \ \n\n</ul> \n\n</body> \n\n</html> \n\nListing 9.4 Changing Text Displayed in\
    \ the Status Bar \n\nFigure 9.4 shows the output of Listing 9.4. \n\nFigure 9.4\
    \ Output of Listing 9.4 \n\nUsing the return true Statement \n\nIn the inner workings\
    \ of standard browsers, a simple link such as \n\n<a href=\"somepage.html\">A\
    \ Link</a> \n\nhas a built-in response to the mouseover event. When the mouse\
    \ is rolled over \n\nthe link, the link becomes active. When a link becomes active,\
    \ two things happen. \n\nFirst, the content of the HREF property (the URL) is\
    \ sent to the status property of \n\nthe window object (window, status). Second,\
    \ the new status text is displayed in \n\nthe status bar. \n\nIf an onmouseover\
    \ handler is added to a link, a different sequence of events \n\noccurs. \n\n\
    <a href=\"somepage.html\" \n\nonmouseover=\"window.status='stuff';return true;\"\
    > \n\nA Link</a> \n\nControlling Text Displayed in the Status Bar"
