    \ A Simple Clock \n\nt^TlP Using the setlnterval () Method \n\nThe setlnterval\
    \ ( ) method of the window object is very similar to the setTimeout() method.\
    \ \n\nThe setTimeout ( ) method schedules a task to be executed once after a given\
    \ delay. The \n\nsetlnterval ( ) method schedules a task to be executed repeatedly\
