  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_113_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_113_1.png)\n\
    \nCreating a Countdown Page \n\n102 \n\nChapter Six Working with Dates and Times\
    \ \n\njffi888S8S88B8i^@8BBMME88 \n\nHow Does It Work? \n\n1. The HEAD portion\
    \ of the page loads. The external library, mylibrary. js, \n\nloads into memory.\
    \ The arrays for the names of the days of the week and the \n\nmonths are stored\
    \ there. \n\n2. Global variables for the visitor's birth year, day, month, and\
    \ retirement year \n\nare created. The familiar global variable timer ID is also\
    \ created to allow the \n\nvisitor to control the countdown. Two new date objects\
    \ are created. The one \n\ncalled f irstdate will hold the visitor's birthdate.\
    \ The one called \n\nlastdate will hold the visitor's date of retirement. The\
    \ startClock( ), \n\nstopClock( ), and showTime( ) functions load into memory.\
    \ \n\n3. The BODY loads a form with several fields to hold the output of the \n\
    \nshowTime( ) function. The BODY also contains two buttons to allow the \n\nvisitor\
    \ to start and stop the countdown. \n\n4. When the visitor clicks the Start Clock\
    \ button, the startClock( ) function \n\nis called. \n\n5. The startClock( ) function\
    \ uses the window, prompt ( ) method to \n\ngather the visitor's birthdate and\
    \ planned retirement age. \n\n6. The f irstdate Date object from step 2 is filled\
    \ with the visitor's birth¬ \n\ndate. The variable retirementyear is then filled\
    \ with the sum of the visi¬ \n\ntor's birthyear and the planned retirement age.\
    \ Finally, the lastdate Date \n\nobject from step 2 is filled with the visitor's\
    \ date of retirement as calculated \n\nfrom the birthdate. \n\n7. The last line\
    \ of the startClock( ) function invokes the setlnterval( ) \n\nmethod to call\
    \ the showTime( ) function repeatedly each second. The ID \n\nfor this task is\
    \ stored in timer ID. \n\n8. The showTime ( ) function creates the variable now\
    \ as an instance of the \n\nDate object. \n\n9. A variable called seconds is then\
    \ filled with the number of seconds \n\nbetween the current moment and the moment\
    \ the visitor retires. The \n\ngetTime ( ) method of the Date object returns the\
    \ number of milliseconds \n\nbetween January 1, 1970, and whatever instance of\
    \ the date object is invok¬ \n\ning the method. Because the Date object lasttime\
    \ represents a date in \n\nthe future, the number of milliseconds returned by\
    \ the getTime ( ) method \n\nwill be larger than the number returned when the\
    \ now Date object invokes \n\nthe getTime ( ) method. By dividing the difference\
    \ by 1000, we get the \n\nnumber of seconds between the two dates."
