    \ 25 percent of their development time \n\ndealing with the inconsistencies between\
    \ the DOMs of the two major browsers. \n\nDOM1 now adds a third to the mix. \n\
    \nA DOM is an internal map of all objects found on a Web page (see Figure 1.5).\
    \ \n\nIn all current DOMs, the browser window is at the top of the hierarchy.\
    \ The docu¬ \n\nment object is one level below the window object. Any scriptable\
