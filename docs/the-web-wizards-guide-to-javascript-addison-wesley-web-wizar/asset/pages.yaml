    \nWorking with Selection Menus \n\n53 \n\n' M \n\nThe FORM survey is one such\
    \ object. The expression document \\[ \"sur¬ \n\nvey\" \\] then represents the\
    \ FORM. In turn, the form creates another array of \n\nall its objects. The SELECT\
    \ websites is one such object. The expression \n\ndocument\\[ \"survey\" \\] \\\
    [ \"websites\" \\] then represents the SELECT object \n\ncalled websites. Because\
    \ survey and websites are stored in variables, \n\nthe expression document \\\
    [ f ormname \\] \\[ selectname \\] properly references \n\nthe SELECT object called\
    \ websites. \n\nA second variable, selectedltem, is then filled with the \n\n\
    selectedlndex of theMenu. The selectedlndex refers to the number \n\nof the chosen\
    \ command on the SELECT menu. The numbering begins with 0. \n\nThe value of the\
    \ chosen command on theMenu can then be determined with \n\nthe expression theMenu.\
    \ options \\[ selecteditem\\] . value. This works \n\nbecause the SELECT object\
    \ contains an array of its OPTIONS. In this case, \n\noption number 1 (the second\
    \ option when numbered from 0) is \n\nj avascript. com with a value of http: /\
    \ /www. javascript. com. The \n\nexpression document. survey .websites .options\
    \ \\[ 1 \\] .value would \n\nreturn the value http: / /www. j avascript. com.\
    \ Because the first part of \n\nthat expression is assigned to the variable theMenu,\
    \ it is possible to use the \n\nexpression theMenu. options \\[ 1 \\] . value\
    \ instead. \n\n5. The global variable chosenSite now contains the value of the\
    \ command \n\nchosen by the visitor. The getSelectValue ( ) function is finished\
    \ with its \n\nwork, so the opensite ( ) function continues to the next line.\
    \ \n\n6. The variable chosenSite is tested to see whether it is empty. If it is,\
    \ the visi¬ \n\ntor receives an alert box with instructions to select something.\
    \ \n\n7. If the visitor has selected something, the browser loads the site chosen\
    \ by the \n\nvisitor. The code window, location.href \\= URL loads the given URL\
    \ \n\ninto the href property of the location object of the current window. \n\n\
    Because the location object stores the URL of the currently loaded docu¬ \n\n\
    ment in its HREF property, changing the value of the HREF property causes \n\n\
    the browser to load the new page. \n\n8. The visitor becomes overwhelmed with\
    \ curiosity about which site is preferred \n\nby the author of the page. The visitor\
    \ clicks the button labeled Show Author's \n\nChoice, which calls the showSelectValue\
    \ ( ) function and passes three \n\nparameters: the name of the FORM ( survey),\
    \ the name of the SELECT \n\n(websites ), and the value to display (http: //www.\
    \ beatnik. com). \n\n9. The showSelectValue ( ) function steps through the elements\
    \ of the array \n\nof options in the SELECT until it finds a value that matches\
    \ the desired value. \n\nThen it sets the selectedlndex of the SELECT to the number\
    \ of the \n\noption with the matching value. The displayed text of the SELECT\
    \ changes to \n\nmatch the new value. \n\nWorking with Selection Menus"
