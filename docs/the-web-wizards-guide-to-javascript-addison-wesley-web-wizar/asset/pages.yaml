    \nFundamental Concepts of JavaScript \n\nmmmmm \n\nSimilarly, in the JavaScript\
    \ language, each object can have many associated \n\nproperties. For example,\
    \ the document object has a built-in property called \n\nbgColor (note the use\
    \ of both upper- and lowercase letters) that represents the \n\nbackground color:\
    \ \n\nwindow.document.bgColor \n\nValues \n\nIn real life, properties have values.\
    \ A car object may have a property known as \n\ncolor with a value known as blue.\
    \ If the owner of a Beetle (an instance of the car \n\nobject) paints the car\
    \ a different color, he would assign a new value to the color \n\nproperty. The\
    \ following code assigns the value red to the property color of the \n\ncar object\
    \ instance Beetle: \n\nBeetle.color=\"red\"; \n\nJavaScript objects also have\
    \ properties, and you can assign values to them. For \n\nexample, the document\
    \ object has a property called bgColor, which represents \n\nthe background color\
    \ and can be assigned a value such as silver using this \n\nJavaScript statement:\
    \ \n\nwindow.document.bgColor=\"silver\"; \n\nPerhaps the most common use of JavaScript\
    \ is to create rollover graphics, in \n\nwhich the image changes when the viewer\
    \ moves the mouse over it. This tech¬ \n\nnique relies on the SRC (source) property\
    \ of the image object in JavaScript. The SRC \n\nproperty has a value to indicate\
    \ the location and name of a graphics file located on \n\nthe hard drive of the\
    \ Web server. \n\nThe HTML page in Listing 1.1 presents an image of a woman in\
    \ a field of sun¬ \n\nflowers (see Figure 1.2). The image is created using the\
    \ standard HTML tag IMG, \n\nwhich has the SRC property. In this example, SRC\
    \ has the value \n\n\"sunflowerlady.jpg,\" which indicates that an image file\
    \ called \"sunflowerlady.jpg\" \n\nresides in the same folder as the Web page\
    \ itself. Another property of the IMG tag is \n\nthe NAME property, which here\
    \ is set to the value \"sunflowerphoto.\" \n\nchtmlxheadxtitle>sunflower lady</titlex/head>\
    \ \n\n<body bgcolor=\"white\"> \n\n<img src=\"sunflowerlady.jpg\" width=\"300\"\
    \ \n\nheight=\"200\" name=\"sunflowerphoto\"> \n\n</body> \n\n</html> \\_ \n\n\
    Listing 1.1 HTML Page with IMG Tag \n\nWhen this code is included in a Web page\
    \ and loaded into a window by a Web \n\nbrowser, an instance of the generic image\
    \ object is created and exists in the mem¬ \n\nory of the browser under the name\
    \ sunflowerphoto."
