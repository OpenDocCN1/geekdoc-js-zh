    \n. \n\nWhat's Next? \n\n167 \n\nSSM8H \n\n3. The visitor types a line of text\
    \ into a text field called usertext. The visitor \n\nthen clicks the button Scroll\
    \ It! An one lick handler calls the \n\nstartScroll( ) function. \n\n4. The startScroll(\
    \ ) function sets the scrollstatus variable to \n\nScrolling, displays scrollstatus\
    \ in the form field \n\nscrollfeedback, and calls the scrollIt( ) function. \n\
    \n5. The scrollIt( ) function begins by examining scrollstatus to see \n\nwhether\
    \ the current value is Scrolling. If it is, scrollIt( ) places into \n\nthe variable\
    \ blurb the value the visitor typed. Then a portion (substring) \n\nof blurb is\
    \ stored in the variable f irstpart. The first time through the \n\nloop, the\
    \ value of counter is 0, so the variable f irstpart will contain the \n\nentire\
    \ blurb. The fifth time through, however, the value of counter will be \n\n4,\
    \ so f irstpart will contain characters 4 to the end of blurb plus a space. \n\
    \nThe variable secondpart will contain characters 0 to 4. \n\n6. The contents\
    \ of f irstpart and secondpart are displayed in the field \n\nscrolledtext on\
    \ the form called myform. \n\n7. A conditional structure checks to see whether\
    \ counter is at the end of the \n\nblurb string. If it is, counter is reset to\
    \ 0. Otherwise, counter is incre¬ \n\nmented by 1. \n\n8. The variable delay is\
    \ set to the value typed by the visitor in the field called \n\nspeed. \n\n9.\
    \ The variable timer ID is set to an ID number that identifies the scheduled \n\
    \ntask generated by the setTimeout( ) method. \n\n10. The setTimeout( ) method\
    \ schedules the scrollIt( ) function to exe¬ \n\ncute again after waiting the\
    \ number of milliseconds indicated by the variable \n\ndelay. Because setTimeout\
    \ ( ) is calling the function in which it resides, a \n\nloop is created. \n\n\
    ifTIP A function \n\ncontaining a statement \n\nthat calls itself is known \n\n\
    as a recursive function. \n\n11. The visitor clicks the button Stop This Crazy\
    \ Thing! The \n\nstopScroll( ) function is called. The clearTimeout ( ) \n\nmethod\
    \ cancels the next scheduled performance of \n\nscrolllt ( ). The variable scrollstatus\
    \ is set to Not \n\nScrolling and displayed in the scrollf eedback field. \n\n\
