    \ showStateName(index){ \n\ndocument.rookies.facts.value \\= statename\\[index\\\
    ]; \n\nRetrieves information from all the arrays, \n\nadds label text and line\
    \ breaks, and displays \n\nj- . . , v , it all in the facts field. \n\nfunction\
    \ showStateFacts(index){ \\- \n\nvar justthefacts \\= statename\\[index\\] + \"\
    \\\\n\"; \n\njustthefacts += \"Population: \" + population\\[index\\] \\-» \n\n\
    + \"\\\\n\"; \n\njustthefacts += \"Capital: \" + capital\\[index\\] + \"\\\\n\"\
    ; \n\njustthefacts += \"Entered the union in \" \n\n+ admissionyear\\[index\\\
