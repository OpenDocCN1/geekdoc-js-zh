    \ because it produces a \n\ndelay in loading the second image. \n\n► Preloading\
    \ image files into the browser's cache creates \n\nmore effective rollovers and\
    \ lets you expand your rollover \n\ncode to accommodate multiple rollover images\
    \ or even \n\ndouble rollovers. Testing for the presence of the \n\ndocument.\
