    \n78 \n\nChapter Five More Image Swapping \n\n■■■■■■■■■■nMBmmmiwMiCTMrrrainiTiffnTOi'TTn\
    \ ...... 1 «. mh \n\n☆ 11 If-Else Made Easier \n\nThe showSlide ( ) function introduces\
    \ a shortcut form of the if-else structure that uses the condi¬ \n\ntional operator\
    \ (the question mark). \n\n(slidenumber \\== totalslides) ? slidenumber \\= 1\
    \ : slidenumber++; \n\nEverything before the question mark is the condition. If\
    \ the condition is true, the statement before \n\nthe colon (:) is executed. Otherwise,\
    \ the statement after the colon is executed. \n\nFigure 5.1 shows the output of\
    \ Listing 5.1. \n\n\\\\ \n\nFigure 5.1 Output of Listing 5.1 \n\nHow Does It Work?\
    \ \n\n1. The browser loads the HEAD and stores six new image objects in an array\
    \ \n\ncalled mySlides beginning at array element 1. The SRC property of each \n\
    \nimage is filled with a . jpg file located in the images folder. This step effec¬\
    \ \n\ntively preloads all the images. \n\n'uTTIP Note that each image in the series\
