    \ \n\nalert(\"You must enter your name before submitting \\-> \n\nthis form.\"\
    ); \n\ndocument.survey.visitor.focus(); \n\nreturn false; \n\n}else{ \n\nreturn\
    \ true; \n\n\\> \n\n}"
