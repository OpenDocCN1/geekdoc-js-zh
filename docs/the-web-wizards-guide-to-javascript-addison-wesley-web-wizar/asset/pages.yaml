    \nWorking with Selection Menus \n\n52 Chapter Three ★ Working with Forms \n\n\\\
    * \n\n★ shortcut Put It in the Library \n\nBe sure to add the getSelectValue (\
    \ ) and showSelectValue ( ) functions from listing 3.6 to \n\nyour mylibrary.\
    \ js file. These functions control the value chosen on a SELECT menu in a FORM.\
    \ \n\nSince you will create many pages with SELECT menus, it makes sense to store\
