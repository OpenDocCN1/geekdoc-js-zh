    \ne Object \n\n88 \n\nChapter Six ★ Working with Dates and Times \n\n☆ \n\n☆ \n\
    \nTo see how to add a greeting to a Web page that changes with the time \n\nof\
    \ day \n\nTo learn how to add a time-sensitive greeting to your Web page clock\
    \ \n\nTo discover how to perform calculations based on dates \n\njhe Date Object\
    \ \n\nJavaScript works with objects in a host environment, typically a Web browser.\
    \ By \n\nnow youTe familiar with the window, document, form, and image objects.\
    \ The \n\nbrowser creates these objects. The Date object, however, is one of a\
    \ handful of core \n\nobjects that exists in the JavaScript language independently\
    \ of the host environ¬ \n\nment. If all you ever do with JavaScript is to create\
    \ Web pages, this distinction isn't \n\nterribly important. JavaScript is increasing\
    \ in popularity, however, and this means \n\nyour new skills in JavaScript programming\
    \ will be valuable in scripting the objects \n\nof other host environments you'll\
    \ encounter. \n\nTo use the Date object you must first create an instance of it\
    \ in memory. \n\nvar currentDate \\= new Date(); \n\nThe variable currentDate\
    \ now contains a number equal to the number of mil¬ \n\nliseconds that have elapsed\
    \ since midnight of January 1, 1970. Dates before 1970 \n\nare represented as\
    \ negative milliseconds. \n\nAfter you create an instance of the Date ( ) object,\
    \ you can apply a variety of \n\nmethods to determine the current minute, hour,\
    \ second, month, and so on. \n\nFollowing are some common Date methods: \n\n☆\
    \ currentDate . getDate ( ) returns the date (1-31) of the month. \n\n☆ currentDate\
    \ . getDay ( ) returns the day of the week (0-6 for Sunday \n\nthrough Saturday).\
    \ \n\n\"uT currentDate . getFullYear ( ) returns the four-digit year (for example,\
    \ \n\n☆ \n\n☆ \n\n☆ \n\n☆ \n\n☆ \n\n☆ \n\n2001). \n\ncurrentDate . getHours (\
    \ ) returns the hour (0-23). \n\ncurrentDate . getMilliseconds ( ) returns the\
    \ milliseconds elapsed \n\nsince the last second (0-999). \n\ncurrentDate . getMinutes\
    \ ( ) returns the minutes elapsed since the last \n\nhour (0-59). \n\ncurrentDate.\
    \ getMonth ( ) returns the month (0-11 for January through \n\nDecember). \n\n\
    currentDate. getSeconds ( ) returns the seconds elapsed since the last \n\nminute\
    \ (0-59). \n\ncurrentDate . getTime ( ) returns the milliseconds elapsed since\
    \ January \n\n1, 1970."
