    \ type=\"text/javascript\" language=\"javascript\"> \n\n<! — \n\nfunction showText(inputdata){\
    \ \n\nwindow.alert(inputdata); \n\n} \n\n//—> \n\n</script> \n\n</head> \n\n<body\
