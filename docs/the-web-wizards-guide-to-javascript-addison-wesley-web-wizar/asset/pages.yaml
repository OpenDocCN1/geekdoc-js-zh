  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_119_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_119_1.png)\n\
    \n108 \n\nChapter Seven Cookies: Maintaining State \n\nChapter Objectives \n\n\
    ☆ \n\n☆ \n\n★ \n\n★ \n\n★ \n\nTo understand the nature and limitations of cookies\
    \ \n\nTo discover how to create and delete cookies \n\nTo learn how to set and\
    \ retrieve your visitors' preferences in cookies \n\nTo understand how to customize\
    \ your Web page using cookies \n\nTo learn how to create a simple online shopping\
    \ cart with cookies \n\nWhat Are Cookies? \n\nIn the parlance of the Internet,\
    \ there are servers and clients. Servers are comput¬ \n\ners that store and transmit\
    \ Web pages. Clients are the computers that receive and \n\ndisplay these pages.\
    \ A Web browser is often referred to as client software. \n\nSuppose you're managing\
    \ a Web site with a members-only section, A page sent \n\nby a server may contain\
    \ a login form that appears on the client. The visitor using \n\nthe client software\
    \ (the browser) fills out the form with a name and password. The \n\ninformation\
    \ is then sent back to the server for storage in a database. Each time the \n\n\
    visitor returns to your page, he must remember his user name and password to log\
    \ \n\nin again. \n\nNow imagine that the visitor could click a button on your\
    \ login screen to store \n\nthe user name and password conveniently on his hard\
    \ drive. Now each time he \n\nreturns to your login page, the client software\
    \ automatically retrieves the name and \n\npassword and sends it to the server.\
    \ The visitor's hard drive stores the login infor¬ \n\nmation until it's needed.\
    \ \n\nCookie is a computer science term that refers to a piece of data held by\
    \ an inter¬ \n\nmediary. In this case, the visitor's hard drive is the intermediary\
    \ positioned between \n\nthe client and the server. Cookies are actually small\
    \ chunks of text usually stored in \n\na plain old text file on the hard drive\
    \ of the client. In the early 1990s, Lou Montuili \n\ncreated the original cookie\
    \ specification for Netscape Navigator version 1.0, the first \n\nbrowser to have\
    \ this feature. \n\nMost major Web sites use cookies to personalize the browsing\
    \ experience for \n\neach visitor. A customized start page is a common example.\
    \ Yahoo, Excite, \n\nNetscape, and many others allow visitors to create such pages.\
    \ These pages allow \n\nyou to set preferences and then display, for example,\
    \ your local weather, links to \n\nyour favorite sites, even a table showing your\
    \ stock portfolio. The first time you \n\naccess your new start page, you type\
    \ a user name and password. Each subsequent \n\ntime you visit, however, no login\
    \ is necessary because a cookie on your hard drive \n\ncontains the login information.\
    \ The client software matches the site address of the \n\npage with the site address\
    \ stored in the cookie. If they match, the client software \n\ntransmits the cookie\
    \ containing the login information to the server."
