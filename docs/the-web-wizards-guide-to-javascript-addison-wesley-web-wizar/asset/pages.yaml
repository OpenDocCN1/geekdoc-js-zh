    60\\*1000). The toGMTString( ) method converts the new date to GMT. \n\n60 \\\
    * 1000); \n\nvar expirationdate \\= new Date(); \n\nvar oneyear \\= \\-> \n\n\
    expirationdate.getTime() + (365 \\* 24 \\* 60 \n\nexpirationdate.setTime(oneyear);\
    \ \n\ndocument. cookie \\= \"username=clara; \n\nexpires= \" + expirationdate.toGMTString()\
    \ ; \n\nPath and domain information are sometimes added to a cookie to specify\
