    \n79 \n\n. . . MUM \n\nCreating a Slide Show \n\nmm \n\n2. The browser stores\
    \ all the captions in an array called myC apt ions beginning \n\nwith array element\
    \ 1. Each caption is a simple text string. Notice the use of \n\nthe add-by-value\
    \ operator (+=) to store the long caption for the first image in \n\nmyCaptions\\\
    [1\\]. \n\n3. A global variable, slidenumber, is created to hold the number of\
    \ the cur¬ \n\nrent slide. A second global variable, totalslides, is created to\
    \ hold the \n\nnumber of slides in the presentation. Because element 0 of the\
    \ mySlides \n\narray is not used, we must subtract 1 from the length of the array\
    \ to determine \n\nthe number of slides. \n\n4. The function showSlide (direction)\
    \ is stored in memory and will per¬ \n\nform its tasks when called upon later.\
    \ \n\n5. The BODY of the document includes an image called slidef rame and a \n\
    \nFORM called slidecontrols. Within the FORM is a TEXTAREA called \n\ncaption\
    \ set to display 2 rows and 50 columns of text. An initial text string \n\ninforms\
    \ the visitor that the slide show begins with the flag of India. The FORM \n\n\
    also includes two buttons. The first button calls the showSlide ( ) function \n\
    \nand sends it the value previous. The second button calls the \n\nshowSlide (\
    \ ) function and sends it the value next. \n\n6. The showSlide ( ) function in\
    \ the HEAD takes the value of the parameter it \n\nreceives (previous or next)\
    \ and places it in a temporary variable called \n\ndirection. If direction is\
    \ next, the function looks to see whether the \n\ncurrent slide number (stored\
    \ in the global variable slidenumber) is the last \n\nslide in the series. If\
    \ it is, slidenumber is reset to 1. Otherwise, slidenum¬ \n\nber is incremented\
    \ by 1. If direction is previous, the function looks to \n\nsee whether the current\
    \ slide number (stored in the global variable \n\nslidenumber) is the first slide\
    \ in the series. If it is, slidenumber is set to \n\nthe total number of slides.\
    \ Otherwise, slidenumber is decremented by 1. \n\nWith this technique, the slide\
    \ show wraps around from the last image to the \n\nfirst. \n\n7. The showSlide\
    \ ( ) function checks to make sure that the browser supports \n\nthe images array.\
    \ It then uses the current value of slidenumber to deter¬ \n\nmine which element\
    \ of the myS lides array and which element of the \n\nmyCaptions array to display.\
    \ Finally, slidenumber is also displayed in the \n\ntext field called currentslide\
    \ so that the visitor will see the number of the \n\ncurrent slide. \n\nThis slide\
    \ show technique is useful for building pages where you want the visi¬ \n\ntor\
    \ to proceed through a series of images by clicking buttons. Corporate presenta¬\
    \ \n\ntions, travel logs, and instructional demonstrations are some of the possible\
    \ appli¬ \n\ncations. Sometimes, however, it's desirable for the images to change\
    \ at predeter¬ \n\nmined intervals to produce an animation. We take a look at\
    \ that next. \n\nCreating a Slide Show"
