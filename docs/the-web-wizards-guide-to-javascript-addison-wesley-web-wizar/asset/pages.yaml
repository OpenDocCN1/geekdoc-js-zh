  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_147_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_147_1.png)\n\
    \ning Window Methods to Enhance the HTML Builder \n\n136 \n\nChapter Eight Working\
    \ with Windows and Frames \n\n^1 mmmm t \n\nA new window with all attributes included\\\
    * would require the following state¬ \n\nment. The example includes carriage returns\
    \ for readability. You should be sure to \n\ntype it all on one line with no spaces.\
    \ \n\nwindow.open(\"somepage.html\",\"myWin\",\"width=750, \n\nheight=550,left=100,screenX=100,top=50,screenY=50,\
    \ \n\ncopyhistory=0,directories=l,location=l,menubar=0, \n\nresizable=l,scrollbars=l,\
    \ status=0,toolbar=l\"); \n\nThis example creates a window with all features enabled\
    \ (values set to 1) except \n\ncopyhistory, menubar, and status (values set to\
    \ 0). Both left/top and \n\nscreenX/screenY attributes are included to provide\
    \ compatibility with all ver¬ \n\nsions of Netscape 4 and Internet Explorer 4\
    \ and later browsers. \n\nThe only problem with creating a window this way is\
    \ that you can't easily close \n\nit by using a script. Fortunately, the open\
    \ ( ) method returns a value to identify the \n\nnew window. By setting up a global\
    \ variable, you can store the value and later refer \n\nto it to close the window.\
    \ \n\nvar Wl \\= null; \n\nWl \\= window.open(\"foo.html\",\"myW\",\"width=750,height=550,\
    \ \n\nscrollbars=l\"); \n\nLater, when you wish to close the window, use the close(\
    \ ) method of the \n\nwindow object and reset the variable to null. \n\nWl.close();\
    \ \n\nWl \\= null; \n\nOne of the tedious aspects of creating windows is typing\
    \ the long list of fea¬ \n\ntures and deciding which features are needed. Listing\
    \ 8.1 solves that problem by \n\nusing a function to create a new window called\
    \ myWindow. The function takes \n\nseven parameters. The first two are the URL\
    \ and the target name. The next four \n\nspecify the size and location of the\
    \ new window. The final parameter contains the \n\nfeature set. \n\nThere are\
    \ three prebuilt feature sets. The variable no features contains a list \n\nof\
    \ all the common features, with the values set to 0 to disable them. The variable\
    \ \n\nbasicfeatures enables scrollbars, makes the window resizable, and shows\
    \ the \n\nmenu bar (Microsoft Windows only). The variable moref eatures enables\
    \ all the \n\nother features. The variable dimensions contains a string specifying\
    \ the desired \n\nwidth and height. The variable placement contains a long string\
    \ to indicate the \n\nleft and top coordinates in a way that works on all current\
    \ browsers. \n\nA switch control structure lets you choose the desired feature\
    \ set. If you pass the \n\nvalue none as the seventh parameter, the nofeatures\
    \ set is used. If you pass the \n\nvalue basic, the basicf eatures set is used.\
    \ If you pass the value full, both the \n\nbasicfeatures and the morefeatures\
    \ \n\nUse Netscape's sets are used. If the value is none of these, the \n\nJavaScript\
    \ console (see Chapter value is assumed to be a valid text string con- \n\nTwo)\
    \ to assist you in debugging taining a custom feature set. \n\nthe script."
