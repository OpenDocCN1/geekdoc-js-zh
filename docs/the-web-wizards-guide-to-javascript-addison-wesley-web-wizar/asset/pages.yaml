- img_proc: true
  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_175_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_175_1.png)\n\
    \nScrolling Text in a Text Field \n\n164 \n\nChapter Nine Applied Web Programming\
    \ Techniques \n\nNow when the visitor rolls the mouse over the link, the onmouseover\
    \ handler \n\nresponds to the mouseover event before the link gets to it. The\
    \ onmouseover \n\nhandler calls a function that changes the status property of\
    \ the window object to \n\n\"stuff.\" The built-in behavior of the link that displays\
    \ the text in the status bar, \n\nhowever, does not occur because the link does\
    \ not receive the mouseover event. \n\nYou need the second statement, \n\nreturn\
    \ true; \n\nto get the link to recognize the mouseover event and display the current\
    \ value of \n\nwindow, status. Otherwise, the status text would be changed but\
    \ no one would \n\nsee it because the link would never receive the message to\
    \ display it. \n\nHow Does It Work? \n\n1. An array called statusText is filled\
    \ with four text strings. The first is blank \n\nto clear the status text. The\
    \ remaining three text strings describe the links on \n\nthe page. \n\n2. Each\
    \ link contains onmouseover and onmouseout handlers that intercept \n\nthe mouseover\
    \ and mouseout events and call the statusUpdate ( ) func¬ \n\ntion. A number is\
    \ passed to statusUpdate ( ), and that number determines \n\nwhich element of\
    \ the statusText array is assigned to the status property \n\nof the window object.\
    \ \n\n3. The return true statement returns control to the link that responds to\
    \ the \n\nmouseover event by displaying in the status bar the current text found\
    \ in \n\nthe window, status property. \n\nScrolling Jext in a jext field \n\n\
    Although scrolling text in the status bar may be tasteless, scrolling text in\
    \ a text field \n\ncan be useful. Sometimes you may wish to attract visitors'\
    \ attention to an important \n\nannouncement but your design doesn't permit a\
    \ fancy animation. One way to add \n\ninterest to your page and gain attention\
    \ without a lot of multimedia overhead is to \n\nuse a small text field with scrolling\
    \ text. Listing 9.5 demonstrates the basic code \n\ninvolved. In this example,\
    \ the visitor controls the text and its speed. When you cre¬ \n\nate your pages,\
    \ you'll probably choose to set these parameters yourself. \n\n<html><head><title>Scrolling\
    \ Text</title> \n\n<script type=\"text/javascript\" language=\"JavaScript\"> \n\
