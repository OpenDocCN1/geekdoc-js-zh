    \n166 \n\nChapter Nine Applied Web Programming Techniques \n\n'uTTIP Reset Buttons\
    \ \n\nTo assist visitors in clearing the form content and starting over, it's\
    \ helpful to include a Reset button. \n\nAll you need is an input of type=mreset\"\
    \ to clear all fields and reset all select and radio but¬ \n\nton elements. \n\
    \nFigure 9.5 shows the output of Listing 9.5. \n\nFigure 9.5 Output of Listing\
    \ 9.5 \n\nHow Does It Work? \n\n1. The variable blurb is created to hold the text\
    \ the visitor types into the form. \n\nThe variables f irstpart and secondpart\
    \ are created to hold the two \n\nhalves of the blurb as it scrolls. The variable\
    \ delay is created to set the scroll \n\ndelay between characters. The timerlD\
    \ variable is initialized. Later it will be \n\nused with the setTimeout ( ) method.\
    \ The variable counter is created to \n\ntrack the character number of the leftmost\
    \ character displayed in the field as \n\nthe text scrolls. Finally, the variable\
    \ scroll status is created to display \n\nscrolling or not scrolling as appropriate.\
    \ \n\n2. Functions are created to start, maintain, and stop the scrolling."
