    \ the HTML and display it in the mycode \n\nfield. The value in mycode is then\
    \ stored in a variable called displaycode. Then \n\ndisplaycode is written to\
    \ the document object contained in the content frame \n\nof the parent window\
    \ (parent. content. document .write (displaycode)). \n\nFinally, the write session\
    \ to the content frame is closed. The visitor then sees the \n\nnew Web page displayed\
    \ in the content frame, as shown in Figure 8.4. \n\nFigure 8.4 Output of Listings\
    \ 8.6 and 8.7"
