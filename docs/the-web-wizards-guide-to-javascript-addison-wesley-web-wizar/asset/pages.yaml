    ><br><br> \n\n<input type=\"button\" name=\"mybutton\" value=\"show text\" \n\n\
    onclick=\"showText(document.sampleform.userinfo.value);\"\\> \n\n</form> \n\n\
    The onclick event handler sends the information typed by the \n\n</bodv> \n\n\
