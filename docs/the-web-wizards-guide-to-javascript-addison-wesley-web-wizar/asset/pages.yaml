  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_164_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_164_1.png)\n\
    \n153 \n\nGenerating Content with Nested Looping \n\nmmi imm&immmmm \n\nHow Does\
    \ It Work? \n\n1. The entire content of the SCRIPT tag in the HEAD executes when\
    \ the page \n\nloads. \n\n2. An array is established to hold the six hexadecimal\
    \ values used in the \n\n216 Web-safe colors. The variable hexvalue is created\
    \ to hold the hexadeci¬ \n\nmal value to be displayed in each cell of the table.\
    \ Then the variable \n\ntablecontent is created to hold all the HTML code that\
    \ will be used to \n\ncreate the table. \n\n3. Several variables are then initialized\
    \ to hold the various parts of each table \n\ndata cell (the <td> tag). Each table\
    \ data cell will display with a different \n\nbackground color and will contain\
    \ a button; an one lick handler will \n\nchange the background color of the page\
    \ when the button is clicked. In the \n\nforthcoming loop, the parts of each table\
    \ data cell will be combined with the \n\ncolor value for each cell. \n\n4. A\
    \ triple nested loop begins, starting with the red values in the outer loop. For\
    \ \n\neach red value, six rows are created. The six rows have the same red value\
    \ \n\nbut different green values. The six cells of each row have the same red\
    \ and \n\ngreen values but different blue values. \n\n5. The elements of the saf\
    \ eRGB array are assembled and stored in the variable \n\nhexvalue. Then the pieces\
    \ of each table data cell are assembled into the \n\nstandard code for an HTML\
    \ table data cell. Here's the string for one of the \n\ncells (see \"Warning:\
    \ Nested Quotes in JavaScript\"): \n\n<td width=80 height=40 bgcolor=#ffcc99 align=center\
    \ \n\nvalign=middle><input type=button value=\"ffcc99\" \n\nonclick=1 document.bgColor=\"\
    #ffcc99\"1\\></td\\> \n\n6. Each cell of the table is added to the contents of\
    \ the variable tablecon¬ \n\ntent. After six cells are created, the code to add\
    \ a new row is also added. \n\nAfter all the cells are added, the final closing\
    \ table tag is added and the table \n\nis complete. \n\n7. The BODY loads a FORM\
    \ containing a normal table to display a button that \n\nreloads the page when\
    \ clicked. \n\n8. A SCRIPT in the BODY uses the document .write ( ) method to\
    \ add the \n\ntable (from the contents of the variable tablecontent) to the document.\
    \ \n\nThe FORM ends. \n\n9. Text is added at the end of the document to assist\
    \ the visitor in making judg¬ \n\nments about the appropriateness of a given background\
    \ color when used \n\nwith black text. \n\n10. The visitor clicks the buttons\
    \ to experiment with the colors. If she resizes the \n\nwindow in some Netscape\
    \ browsers, the color table will not be redrawn, but \n\nthe opening table with\
    \ the Reset button will continue to be present. When \n\nthat happens, she clicks\
    \ the Reset button to restore the table. \n\nGenerating Content with Nested Looping"
