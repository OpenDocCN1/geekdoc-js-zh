  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_167_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_167_1.png)\n\
    \n156 \n\nChapter Nine Applied Web Programming Techniques \n\nSometimes it's convenient\
    \ to trigger a JavaScript function or statement when the \n\nvisitor clicks on\
    \ a defined area in an image map. There are two ways to do this: the \n\nonclick\
    \ technique and the pseudo-URL technique. \n\nThe onclick technique adds an onclick\
    \ handler to the AREA tag and returns false \n\nto prevent the browser from attempting\
    \ to load the page in the HREF property. \n\n<area shape=\"RECT\" coords=\"0,0,200,300\"\
    \ \n\nhref=\"alternatecontent.html\" onclick=\"myEffect(); \n\nreturn false\"\
    > \n\nRecent browsers (version 4.0 and later) recognize the onclick event handler\
    \ in \n\nAREA tags. A visitor clicks the link, the myEf f ect ( ) function executes,\
    \ and false \n\nis returned. As a result, the link to alternatecontent. html does\
    \ not execute, \n\nand the visitor remains on the page. But if the same code loads\
    \ in an older brows¬ \n\ner, the onclick handler is ignored and alternatecontent.\
    \ html loads when \n\nthe link is clicked. \n\nThe second technique uses a pseudo-URL.\
    \ A pseudo-URL has the protocol \n\njavascript: in place of the expected http:\
    \ and tells the browser to execute \n\nthe statement that follows as JavaScript\
    \ code. The advantages of this technique are \n\nits brevity and its compatibility\
    \ with older browsers. \n\n<area shape=\"RECT\" coords=\"0, 0,200,300\" \n\nhref=\"\
    javascript:myEffeet();\"> \n\nOne small disadvantage of the pseudo-URL technique\
    \ is that the text \n\njavascript: myEf feet ( ) ; is displayed in the status\
    \ bar of the window unless \n\nyou change the status bar text in the myEf feet\
    \ ( ) function. Also, if the function \n\nbeing called returns a value, an error\
    \ may be generated. To instruct the browser to \n\nignore the returned value,\
    \ include the void operator: \n\n\"javascript:void myEffect();\" \n\nIn Listing\
    \ 9.2, the void operator is not needed because the function does not \n\nreturn\
    \ a value. \n\nHow Does It Work? \n\n1. When the HEAD loads, several arrays are\
    \ created to hold the factual informa¬ \n\ntion about each state. \n\n2. The function\
    \ showStateName ( ) is created to display the name of a state. \n\n3. The function\
    \ showStateFacts ( ) is created to display a formatted string of \n\ninformation\
    \ about the state. \n\n4. The BODY section of the page displays an image of the\
    \ Northern Rocky \n\nMountain states and an empty text field. The USEMAP property\
    \ of the IMG tag \n\nconnects the image to the MAP labeled RockiesMap further\
    \ down the page."
