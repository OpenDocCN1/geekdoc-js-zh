    \nCreating a Countdown Page \n\n101 \n\nwmmmmmm \n\n^WARNING Getting Numbers from\
    \ Text Strings \n\nIn Listing 6.9, the code \n\nretirementyear \\= parselnt(birthyear)\
    \ + parselnt(retirementage) \n\nadds the visitor's age at retirement to the visitor's\
    \ birth year. If the visitor was born in 1962 and \n\nintends to retire at age\
    \ 65, the result should be 2027. The problem is that the values in birthyear \n\
    \nand retirementage were obtained with window prompts and stored as text strings.\
    \ Combining the \n\ntext strings \"1962\" and \"65\" produces \"196265\", which\
    \ would ensure our visitor great longevity \n\nbut a long wait to retirement.\
    \ \n\nThe parselnt ( ) function is useful to convert text strings to integers\
    \ when the first character is a \n\nnumeric value. The expressions parselnt (1165a\"\
    ) and parselnt (\"65.75\") would both return \n\nthe integer value of 65. The\
    \ expression parselnt (\"a65\") would return the value NaN to indicate \n\nthat\
    \ the value passed to the function was not a number. The parselnt ( ) function\
    \ parses (ana¬ \n\nlyzes) the text string. Use the parselnt ( ) function or the\
    \ parseFloat () function (for values \n\nwith numbers after the decimal point)\
    \ whenever you have a text string that must be interpreted as \n\na number. These\
    \ are global functions built into JavaScript. \n\nUsing the parselnt ( ) function\
    \ in Listing 6.9, the numbers 1962 and 65 can be summed correctly \n\nand the\
    \ visitor can retire in 2027. \n\nFigure 6.5 shows the output of Listing 6.5.\
