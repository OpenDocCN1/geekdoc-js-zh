  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_18_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_18_1.png)\n\
    \nFundamental Concepts of JavaScript \n\nBHiMMSHinii \n\nEvents and Event Handlers\
    \ \n\nIn real life, objects sometimes encounter events. An instance of the car\
    \ object \n\nmight encounter the blowout event, resulting in a change in the shape\
    \ of the tire. \n\nThe tire responds to the event by changing its shape to flat.\
    \ A JavaScript event \n\nhandler is the code that responds to events initiated\
    \ by visitors to a Web page. In \n\nthis example, the blowout event is handled\
    \ by an onBlowOut handler, which \n\nresponds to the event by changing the value\
    \ of the shape property of the tire \n\nobject: \n\nonBlowOut=Beetle.tire.shape=\"\
    flat\"; \n\nSimilarly, JavaScript objects encounter many events. One of the most\
    \ common \n\nevents is the mouseover event triggered when a visitor moves the\
    \ mouse on top \n\nof an object. The anchor tag (<a>) can be set to respond to\
    \ mouseover events. Any \n\ntext or graphics enclosed by an anchor tag can then\
    \ be used to trigger the \n\nmouseover event. \n\nIn the following example, a\
    \ link (the <a> tag) is coded with the \n\nonmouseover handler to change the background\
    \ color of the page to silver when \n\nthe visitor moves the mouse over the link.\
    \ The HREF property is set to \"#\" so that \n\nnothing happens if the user clicks\
    \ the link. \n\n<a href=\"#\" onmouseover=\"document.bgColor='silver\"> \n\nRoll\
    \ over to change background to silver.</a> \n\nTo implement the image swap, you\
    \ use an IMG tag in place of the text. Listing \n\n1.2 sets up a rollover graphic.\
    \ When the user moves the mouse over the image of \n\nthe sunflower lady, a mouseover\
    \ event is generated. The anchor tag has an event \n\nhandler onmouseover to handle\
    \ the mouseover event. The event handler sends \n\na single line of code to the\
    \ browser to change the SRC property of the \"sunflower- \n\nphoto\" image to\
    \ display the close-up of the sunflowers. An onmouseout event \n\nhandler restores\
    \ the original image when the mouse is no longer on top of the \n\nimage. \n\n\
    Read the code in Listing 1.2. You may be surprised at how much you understand\
    \ \n\neven this early in your study of JavaScript. \n\nft ORTCUT You will learn\
    \ about image swapping in greater \n\ndetail in Chapters Four and Five. To create\
    \ Listing 1.2 yourself, down¬ \n\nload the two images from http: //www.awl.com/estrella/,\
    \ type \n\nthe code into any text editor, save it as a plain text file with the\
    \ file \n\nname extension .html, and open it in your Web browser. \n\n^TIP in\
    \ the code listings, the symbol \\-»indicates a line of text that wraps (runs\
    \ over) to the next \n\nline because of the line length limitations of the printed\
    \ page (see the code at the top of the next \n\npage). It's important to avoid\
    \ placing unnecessary carriage returns in your code. A JavaScript state¬ \n\n\
    ment with a carriage return in the middle won't work properly in the Web browser."
