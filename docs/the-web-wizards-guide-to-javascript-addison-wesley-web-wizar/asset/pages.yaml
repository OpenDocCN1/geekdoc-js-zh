    \nCombining JavaScript with Client-Side Image \n\nc \n\n• am \n\nCL \n\nCL \n\n\
    fS 2 \n\n154 Chapter Nine Applied Web Programming Techniques \n\n## Combining\
    \ JavaScript with Client-Side image Mapping \n\nIt's often desirable to use images\
    \ to create customized interfaces for your Web \n\npages. In your studies of HTML\
    \ 4, you probably learned how to create a simple \n\nimage map, an image that\
    \ contains hot spots linked to different pages. The term \n\nclient-side means\
    \ that the coordinates for the hot spots in the image are stored \n\nin the HTML\
    \ code and read by the client software (the browser). Listing 9.2 demon¬ \n\n\
    strates how you can make your image maps even more interactive by adding event\
    \ \n\nhandlers and JavaScript functions. In this example, the name of each northern\
    \ U.S. \n\nRocky Mountain state is displayed when the visitor rolls the mouse\
    \ over the por¬ \n\ntion of the image corresponding to the state. When the visitor\
    \ clicks the image, \n\nmore detailed information about the state is displayed.\
