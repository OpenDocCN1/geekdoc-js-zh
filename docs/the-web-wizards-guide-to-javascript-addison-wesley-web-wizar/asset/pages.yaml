    \ 3.4 Radio Button Form Validation \n\n★ 10RTC0 Put It in the Library \n\nThe\
    \ getRadioValue() and showRadioValue() func¬ \n\ntions from listing 3.4 control\
    \ the value checked on a set of \n\nradio buttons in a FORM. You will create many\
    \ pages with \n\nradio buttons—including examples later in this book—so it \n\n\
    makes sense to store these functions in mylibrary. js \n\nrather than copy them\
    \ into every page. \n\nHow Does It Work? \n\nListing 3.4 generates the following\
    \ sequence of events. \n\n1. The browser loads the HEAD into memory and displays\
    \ the BODY. \n\n2. The BODY contains a FORM object named survey and an array of\
    \ two radio \n\nbutton objects named gender. When multiple radio buttons share\
    \ the same \n\nname, the browser creates an array in memory to hold the related\
    \ radio but¬ \n\ntons. The individual radio buttons in the array are assigned\
    \ to elements in the \n\nnew array. In this case, gender \\[ 0 \\] is the radio\
    \ button for male, and \n\ngender \\[ 1 \\] is the one for female. Neither radio\
    \ button is checked by default. \n\n3. The visitor clicks the Send Survey button\
    \ to submit the form. The button gen¬ \n\nerates a submit event. \n\n4. The FORM\
    \ object's onsubmit handler sends a line of code to the JavaScript \n\ninterpreter\
    \ in the browser. This code calls the validate ( ) function and \n\nreturns a\
    \ value of true or false to the FORM object. If the value returned is \n\nfalse,\
    \ the FORM object does not send the e-mail. \n\n5. The validate ( ) function begins\
    \ by creating a variable called \n\nchosenGender and setting its initial value\
    \ to the value returned by the \n\ngetRadioValue ( ) function. The getRadioValue\
    \ ( ) function receives \n\ntwo parameters: the name of the form and the name\
    \ of the radio button set."
