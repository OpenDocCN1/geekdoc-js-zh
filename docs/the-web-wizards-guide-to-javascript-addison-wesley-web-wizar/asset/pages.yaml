    \ \n\nHow Does It Work? \n\n1. The mylibrary. js file is loaded into memory when\
    \ the HEAD loads. When \n\nthe page finishes loading, an onload handler in the\
    \ BODY tag calls the \n\nshowCookies ( ) function. The showCookies ( ) function\
    \ calls the \n\nGetCookie ( ) function to see whether the cookies visitor and\
    \ \n\ncolorchoice exist. If either of these cookies exists, the showCookies (\
    \ ) \n\nfunction displays the cookie values in the visitorcookie and \n\ncolorcookie\
    \ fields. \n\n2. The visitor types a name and color choice and clicks the Make\
    \ Cookies button. \n\n3. The makeCookies ( ) function places the values the visitor\
    \ typed into two \n\nvariables: visitorname and visitorcolor. \n\n4. The SetCookie(\
    \ ) function, stored in mylibrary. js, is called with the \n\nword visitor as\
    \ the cookie name and the variable visitorname as the \n\ncookie value. \n\n5.\
    \ The SetCookie ( ) function, stored in mylibrary. j s, is called with the \n\n\
    word colorchoice as the cookie name and the variable visitorcolor as \n\nthe cookie\
    \ value. \n\n6. An alert notifies the visitor that his cookies have been created.\
    \ \n\n7. The visitor browses any other page on the Web and then returns to this\
    \ page. \n\n8. The onload handler calls the showCookies ( ) function and retrieves\
    \ and \n\ndisplays the information found in the cookies."
