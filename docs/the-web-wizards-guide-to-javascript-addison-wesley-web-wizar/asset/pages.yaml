    \nFundamental Concepts of JavaScript \n\nArrays \n\nAn array is an ordered collection\
    \ of data. Each element of an array is a variable and \n\ncan hold data of any\
    \ type. You usually use an array to hold related data. An exam¬ \n\nple is an\
    \ array that represents the nooks in a spice rack. In this case, each element\
    \ \n\nof the array represents a nook. Each nook can contain any spice you might\
    \ like. \n\nVar spicerack \\= \n\nspicerack\\[0\\] \\= \n\nspicerack\\[l\\] \\\
    = \n\nspicerack\\[21 \\= \n\nnew Array( \n\n\"oregano\"; \n\n\"salt\"; \n\n\"\
    pepper\"; \n\n); \n\nThe numbering of the array elements always begins at 0, but\
    \ sometimes pro¬ \n\ngrammers do not populate the \\[0\\] element so that numbering\
    \ can begin more nat¬ \n\nurally at 1. You can reassign the value of any element\
    \ in the array by using a state¬ \n\nment such as this one: \n\nspicerack\\[0\\\
    ] \\= \"garlic\"; \n\nArrays are useful because you can change the value of each\
    \ array element using \n\na programming loop. You will learn about loops in Chapter\
    \ Two. \n\nMethods \n\nIn real life, objects sometimes have actions associated\
    \ with them. In JavaScript, an \n\nobject's associated actions are called methods.\
    \ Each generic object has methods \n\nassociated with it. All instances of the\
    \ car object, for example, have an associated \n\nmethod called brake that slows\
    \ the car. \n\nLike variables, methods can take values. For example, the brake\
    \ \n\nyyT|P Think of method could take values of fast or slow depending on how\
    \ much \n\nmethods as the force the driver applied to the pedal. In JavaScript,\
    \ parentheses are \n\nverbs in the JavaScript USed to contain the values associated\
    \ with a method. \n\niangijage. Methods associated with an object are inherited\
    \ by any instance \n\nof that object. A Beetle is an instance of a generic car\
    \ object. \n\nTherefore, the Beetle can use the brake method: \n\nBeetle.brake(\"\
    fast\"); \n\nBeetle.brake(\"slow\"); \n\nOften, methods are triggered by events.\
    \ Suppose our Beetle car object encoun¬ \n\nters the blowout event. The Beetle\
    \ must handle this event by performing the brake \n\nmethod. In this example,\
    \ the blowout event is handled by the onBlowOut event \n\nhandler, which responds\
    \ to the event by initiating the brake method: \n\nonBlowOut \\= Beetle.brake('fast');\
    \ \n\nSimilarly, Web browser objects have many methods. One of the simplest meth¬\
    \ \n\nods is the write method of the document object. This method is used to write\
    \ \n\ntext to the current document as the page loads: \n\ndocument.write(\"Greetings\
    \ JavaScript Students );"
