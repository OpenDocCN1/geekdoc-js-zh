  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_76_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_76_1.png)\n\
    \nCreating a More Effective Rollover by Preloading Images \n\n, m jgMSgMM Wllllll\
    \ \n\n65 \n\nHow Does It Work? \n\nListing 4.3 produces the following sequence\
    \ of events. \n\n1. The browser loads the HEAD portion of the HTML document into\
    \ its memory. \n\n2. The browser creates two blank image objects called theOff\
    \ Image and \n\ntheOnlmage. \n\n3. The browser fills the SRC properties of the\
    \ new images by retrieving graphics \n\nfiles found in the images folder, which\
    \ is located in the same folder as the \n\ncurrent document. The image files are\
    \ now located in the browser's cache \n\nfolder on the visitor's hard drive. \n\
    \n4. The browser loads the rollOn( ) and rollOf f ( ) functions into memory. \n\
    \nThese functions do nothing until they are called. \n\n5. The browser loads the\
    \ BODY section of the document. An IMG tag in the \n\nHTML code causes an image\
    \ to appear in the current document, and the \n\nbrowser creates an image object\
    \ called beethoven as one of an array of \n\nobjects in its internal map of the\
    \ document. \n\n6. The visitor moves the mouse on top of the image. A mouseover\
    \ event is gen¬ \n\nerated in the browser's memory. \n\n7. The anchor tag handles\
    \ the mouseover event by calling the function \n\nrollOn ( ) and passing the name\
    \ of the image, beethoven, to the function. \n\n8. The rollOn( ) function takes\
    \ the name of the image beethoven and puts \n\nit into a variable called imagename.\
    \ It then finds the value of the SRC prop¬ \n\nerty of the image object theOnlmage\
    \ (from step 3) and assigns it to replace \n\nthe SRC property of the beethoven\
    \ image object. The image swap on \n\nrollover is accomplished. \n\n9. The visitor\
    \ moves the mouse outside the image, and the function rollOf f ( ) \n\nswaps the\
    \ image back to the original. \n\nThis technique is more complex but much more\
    \ effective because there is no \n\nimage swap delay. The technique is also flexible\
    \ enough to be used with multiple \n\nimage rollovers on a single page. \n\n☆WARNING\
    \ Take some extra time to study the steps and concepts in Listing 4.3 before proceed¬\
    \ \n\ning. When you're learning to program, diligence at the beginning pays off\
    \ in less time spent debug¬ \n\nging code later. \n\n☆tip Dealing with Old Browsers\
    \ \n\nA few Web visitors use browsers that do not recognize the Image object as\
    \ a part of their document \n\nobject models. To avoid generating errors when\
    \ your page loads in these early browsers, you may \n\nwish to include a conditional\
    \ statement to test for the presence of the document.images array. This \n\narray\
    \ exists only in the memory of browsers that support the Image object. The next\
    \ examples show \n\nhow to implement this safeguard."
