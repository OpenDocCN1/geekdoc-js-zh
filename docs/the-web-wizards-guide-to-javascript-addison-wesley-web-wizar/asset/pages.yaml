    \ an HREF property that calls a pseudo-URL. This \n\nconsists of javascript: and\
    \ a call to the showStateFacts ( ) function. \n\nA number is passed to the function.\
    \ \n\n8. The showStateFacts ( ) function takes the number it is passed and looks\
    \ \n\nup the necessary information in the various arrays containing factual informa¬\
    \ \n\ntion about each state. The information is assembled into a text string and\
    \ dis¬ \n\nplayed in the field. \n\nDetecting the Visitor's Browser and platform\
    \ \n\nAbout 25% of the work that goes into Web development involves testing Web\
    \ \n\npages on different browsers and platforms and then creating workarounds\
    \ for any \n\ncompatibility issues that arise. Some sites even have multiple versions\
    \ of their \n\nopening pages to accommodate different browsers. To determine which\
    \ page to \n\nload, they must first sniff (identify) the visitor's browser. Listing\
    \ 9.3 presents a \n\nsimple browser sniffer script along with a field and a button.\
    \ When the button is \n\nclicked, the field displays information about the visitor's\
    \ browser and computer \n\nplatform. \n\n<html><head><title>browser test</title>\
    \ \n\n<script type=\"text/javascript\" language=\"JavaScript\"> \n\n<! — \n\n\
    /\\* Add this browser detection code to mylibrary.js \\*/ \n\nvar theApp \\= navigator.appName.toLowerCase();\
    \ \n\n/\\* variables for the two major browsers in existence \n\ntoday. \\*/ \n\
    \nvar isIE \\= (UA.indexOf(1msie’) \\>= 0) ? true : false; \n\nvar isNS \\= (UA.indexOf(’mozilla')\
    \ \\>= 0) ? true : false; \n\n/\\* 'compatible' text string exists only in non-Netscape\
    \ \n\nbrowsers \\*/ \n\nif (UA.indexOf('compatible')>0){ \n\nisNS \\= false; \n\
    \n}"
