    \nPRErACt \n\nAbout Addison-Wesley's Web Wizard Series \n\nThe beauty of the Web\
    \ is that, with a little effort, anyone can harness its power to \n\ncreate sophisticated\
    \ Web sites. Addison-Wesley's Web Wizard Series helps students \n\nmaster the\
    \ Web by presenting a concise introduction to one important Internet \n\ntopic\
    \ or technology in each book. The books start from square one and assume no \n\
    \nprior experience with the technology being covered. Mastering the Web doesn't\
    \ \n\ncome with a wave of a magic wand; but by studying these accessible, highly\
    \ visu¬ \n\nal textbooks, readers will be well on their way. \n\nThe series is\
    \ written by instructors who are familiar with the challenges begin¬ \n\nners\
    \ face when learning the material. To this end, the Web Wizard books offer more\
    \ \n\nthan a cookbook approach: they emphasize principles and offer clear explanations,\
    \ \n\ngiving the reader a strong foundation of knowledge on which to build. \n\
    \nNumerous features highlight important points and aid in learning: \n\n☆ Tips\
    \ — important points to keep in mind \n\n☆ Shortcuts — timesaving ideas \n\n☆\
    \ Warnings — things to watch out for \n\n☆ Do It Yourself — activities to try\
    \ now \n\n☆ Review questions and hands-on exercises \n\n☆ Online references —\
    \ Web sites to visit to obtain more information \n\nSupplementary materials for\
    \ the books, including updates, additional examples, \n\nand source code, are\
    \ available at http: / /www. aw. com/webwizard. Also avail¬ \n\nable for qualified\
    \ instructors adopting a book from the series are instructor's \n\nmanuals, sample\
    \ tests, and solutions. Please contact your Addison-Wesley sales rep¬ \n\nresentative\
    \ for the instructor resources password. \n\nAbout This Book \n\nWhen I first\
    \ began developing Web sites way back in 1994, 1 was grateful to be able \n\n\
    to display a simple graphic or add bold to my text. The Web was a static medium\
    \ \n\nin those days. Interactivity was limited to the links you created to navigate\
    \ from \n\none page to another. Web designers had little control over how their\
    \ content would \n\nappear. Media elements other than text and simple graphics\
    \ were rarely used due \n\nto bandwidth limitations and lack of standards. The\
    \ most popular background \n\ncolor for a Web page back then was gray. My, how\
    \ things have changed. \n\nToday's Web sites are highly interactive and rich in\
    \ media content. JavaScript \n\nplays a large role in the development of contemporary\
    \ Web sites because it offers \n\na relatively easy way to interact with the objects\
    \ that Web browsers create. As a \n\nresult, Web designers no longer view their\
    \ creations as a series of static pages linked \n\ntogether by navigation icons.\
    \ Instead, Web designers create environments where \n\nix"
