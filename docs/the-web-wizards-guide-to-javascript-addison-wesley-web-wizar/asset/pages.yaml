    \ \\-\\* \n\nexpires=Mon, 18-Jun-01 00:00 : 01 GMT; \\-1 \n\npath=/aw; domain=stevenestrella.com;\
    \ secure\"; \n\nThe browser stores the cookie as plain text. The exact appearance\
