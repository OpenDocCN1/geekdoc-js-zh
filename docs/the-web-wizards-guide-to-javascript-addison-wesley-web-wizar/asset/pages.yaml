  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_15_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_15_1.png)\n\
    \nFundamental Concepts of JavaScript \n\n4 \n\nChapter One JavaScript Basics \n\
    \nmm \n\nFigure 1.1 An Image Object in a Web Browser Window \n\nInstance \n\n\
    An instance is one particular incarnation of an object. For example, a car is\
    \ an \n\nobject, and the Beetle parked across the street is one instance of the\
    \ car object. An \n\ninstance of an object inherits all the characteristics of\
    \ the object type. For example, \n\nif a car always has a trunk and a spare tire,\
    \ any instance of the car object, includ¬ \n\ning my neighbor's Beetle, can be\
    \ assumed to have these items. \n\nBeetle. trunk. sparetire would be the code\
    \ used to designate the spare \n\ntire in the trunk of a Beetle (one instance\
    \ of the more generic car object). \n\nIn the same way, a photograph named \"\
    gardendog\" loaded in a Web page is one \n\ninstance of the more generic image\
    \ object. \n\nProperties \n\nIn real life, instances of objects can also have\
    \ properties. An instance of the car \n\nobject might have a property known as\
    \ color. That property would be referred to \n\nin JavaScript as \n\nBeetle.color"
