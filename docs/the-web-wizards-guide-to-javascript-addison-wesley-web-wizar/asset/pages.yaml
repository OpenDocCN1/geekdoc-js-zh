    \nDetecting the Visitor's Browser and Platform \n\n160 \n\nChapter Nine Applied\
    \ Web Programming Techniques \n\nHHMK \n\nFigure 9.3 Output of Listing 9.3 \n\n\
    How Does It Work? \n\n1. The first line of the SCRIPT in the HEAD creates a variable,\
    \ theApp, to hold \n\na lowercase version of the text string describing the appName\
    \ property of the \n\nnavigator object. The navigator object represents the browser.\
    \ The \n\nappName property holds a text string such as Microsoft Internet \n\n\
    Explorer or Netscape to describe the browser. \n\n2. The variable UA is created\
    \ to hold a lowercase version of the text string \n\ndescribing the userAgent\
    \ property of the navigator object. This property \n\ncontains identifying information\
    \ about the browser. The value returned will \n\nvary (see 'Tip: User Agent Values\
    \ for Popular Browsers\"). \n\n3. The variable is IE is created and set to true\
    \ if UA contains the text string \n\nmsie. To determine this, the familiar indexOf\
    \ ( ) method is used. \n\n4. A variable called isNS is created and set to true\
    \ if UA contains the text \n\nstring mozilla. \n\n5. Netscape uses the mozilla\
    \ trade name, but other browsers include the words \n\nmozilla and compatible\
    \ in their userAgent properties. As a result, it is \n\nnecessary to test for\
    \ the presence of compatible in UA. If it's found, the \n\nbrowser is not a Netscape\
    \ browser and isNS is set to false."
