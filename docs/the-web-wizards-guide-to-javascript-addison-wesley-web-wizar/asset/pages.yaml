  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_150_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_150_1.png)\n\
    \n139 \n\nAdditional Methods of the Window Object \n\nimsmammstsmasmsam ■■■■■■■■■■■■■■\
    \ \n\n10. The next line of code in showPage ( ) after the call to openWin ( )\
    \ takes the \n\ncontent of the variable display code and writes it to the document\
    \ in the \n\nnew window referred to by the variable myWindow. Because the content\
    \ of \n\nthe variable displaycode is a text string containing standard HTML code,\
    \ \n\nthe new window displays a nicely formatted Web page. \n\n11. The focus (\
    \ ) method of the window object is applied to the new window \n\nto ensure that\
    \ it is not hidden behind any other windows. \n\n12. The close ( ) method of the\
    \ document object is applied to the document \n\nloaded in the new window to indicate\
    \ that no further content will be written \n\nto the document. However, the close\
    \ ( ) method of the document object \n\ndoes not close the window. It ends the\
    \ writing session that was begun when \n\nthe document .write ( ) method was applied.\
    \ \n\n13. The visitor stares appreciatively at the new window, moves it to one\
    \ side of \n\nthe screen, clicks back on the main window, and clicks the button\
    \ Close New \n\nWindow. The closeWin( ) function is called. It checks to see whether\
    \ the \n\nvalue in the variable myWindow is anything other than null. If it is,\
    \ it calls \n\nthe close ( ) method of the window object. Because that closes\
    \ the new \n\nwindow, it then makes sense to set the value of myWindow to null\
    \ to indi¬ \n\ncate that the window no longer exists. \n\n14. The visitor notices\
    \ some sample code in the final text field. The sample code \n\nincludes a call\
    \ to openWin ( ). The visitor changes the width and height val¬ \n\nues in the\
    \ third and fourth parameters of the openWin ( ) function call and \n\nchanges\
    \ the seventh parameter from basic to full. \n\n15. The visitor clicks the button\
    \ Execute My Code, which calls the runCode ( ) \n\nfunction. \n\n16. The runCode\
    \ ( ) function takes the text the visitor altered in the field \n\ncodefield and\
    \ assigns it to a variable called thecode. The eval ( ) func¬ \n\ntion then evaluates\
    \ the contents of thecode. Because the contents contain \n\nvalid JavaScript statements,\
    \ the code is executed and a new window appears \n\non the screen with the altered\
    \ feature set and dimensions. \n\nAdditional Methods of the Window Object \n\n\
    Throughout this book you have made liberal use of the window.alert ( ) \n\nmethod\
    \ to display alert boxes. You have also used the window.prompt( ) \n\nmethod to\
    \ obtain text input from your visitors. Another useful method of the win¬ \n\n\
    dow object is the confirm( ) method, which displays a dialog box containing \n\
    \nany text you pass to it. If the visitor clicks OK, the confirm ( ) method returns\
    \ the \n\nvalue true. If the visitor clicks Cancel, the value returned is false.\
    \ The returned \n\nvalue can be placed in a variable and tested, as shown in Listing\
    \ 8.2."
