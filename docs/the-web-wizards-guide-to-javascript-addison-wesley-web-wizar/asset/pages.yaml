  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_148_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_148_1.png)\n\
    \n137 \n\nUsing Window Methods to Enhance the HTML Builder \n\nTo begin experimenting\
    \ with code for managing windows, create the page from \n\nListing 8.1 and load\
    \ it into a Netscape browser version 4.7 or later. \n\n☆ tip Put It in the Library\
    \ \n\nAlways remember to place reusable scripts in your mylibrary. js file. In\
    \ Listing 8.1, the \n\nopenWin( ) function will be useful whenever you wish to\
    \ create a new window and control its size, \n\nposition, and features. \n\n☆\
    \ TIP Using Switch \n\nWhen you want a script to do something depending on the\
    \ value of a variable, use a switch control \n\nstructure. It tests the value\
    \ of a variable or other expression to see whether it matches any of several \n\
    \npossible values. When a match is found, specific statements execute; then the\
    \ break; statement \n\ntells the switch control structure not to bother testing\
    \ the other possible cases. If none of the cases \n\nis a match, the statements\
    \ under the word default will execute. The switch control structure \n\nworks\
    \ in Netscape and Internet Explorer versions 4 and later. \n\nFigure 8.1 shows\
    \ the output of Listing 8.1. \n\nn .. , HTML Builder Page with Window Generator-\
    \ Netscape 6 0 S \n\nFigure 8.1 Output of Listing 8.1"
