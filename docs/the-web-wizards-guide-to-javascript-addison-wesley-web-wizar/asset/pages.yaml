    \ decision making based on a variable's \n\nvalue. The eval ( ) function is built\
    \ into JavaScript and \n\nevaluates whatever text is passed to it. Valid JavaScript\
    \ \n\nstatements passed to the eval ( ) function are executed \n\nby the JavaScript\
    \ interpreter in the Web browser. \n\n► You can use the window.confirm( ) method\
    \ to query \n\nvisitors and get a true or false response, storing it in a vari¬\
    \ \n\nable that determines what happens next. The HREF property of the location\
    \ object \n\nreveals the URL of the current page; changing HREF loads a new page.\
    \ Each window \n\nobject also contains a history object. The history object maintains\
    \ a list of pages \n\nthat have been loaded in the current window. \n\nFrames\
    \ can be seen as a parent-child hierarchy of window objects. Each window can \n\
    \nbe referred to as self in any script located in the window; the window at the\
    \ top \n\nof the hierarchy can be referred to as top. Because framesets can be\
    \ nested, refer¬ \n\nences to \"parent\" will not always be equivalent to \"top.\"\
    \ The replace ( ) method \n\nof the location object changes the URL stored in\
    \ the history index for that page. \n\nWhen you create a page that changes location\
    \ upon loading, use the replace ( ) \n\nmethod instead of changing the HREF property.\
    \ This practice avoids creating prob¬ \n\nlems with the Back button. \n\n★ Online\
