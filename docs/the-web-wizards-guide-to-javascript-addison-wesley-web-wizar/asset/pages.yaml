  md: "![](img/7705a881c3cbfe90339b9b12a38fc1c6_149_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_149_1.png)\n\
    \nUsing Window Methods to Enhance the HTML Builder \n\n138 \n\nChapter Eight Working\
    \ with Windows and Frames \n\nHow Does It Work? \n\n1. The HEAD portion of the\
    \ page loads into memory. The my library. js file \n\nloads, a global variable\
    \ called myWindow is created, and three functions are \n\nloaded into memory,\
    \ ready to be called. \n\n2. The BODY loads and displays a form with fields and\
    \ buttons. The visitor types \n\na title and body text into the first two fields\
    \ and clicks the button Build My \n\nPage. The buildPage( ) function (stored in\
    \ mylibrary. js) is called to \n\nassemble a standard HTML page and display the\
    \ code in the field mycode. For \n\nmore information about the buildPage( ) function,\
    \ see Chapter Two. \n\n3. The visitor clicks the button Show My Page, which calls\
    \ the showPage ( ) \n\nfunction. \n\n4. The showPage ( ) function takes the contents\
    \ of the mycode field and stores \n\nit in the new variable displaycode. Then\
    \ the openWin( ) function is \n\ncalled and seven parameters are passed. The first\
    \ parameter is empty because \n\nthe document you wish to display is not a preexisting\
    \ Web page but rather is \n\nthe output of the code found in the mycode field.\
    \ The second parameter is an \n\narbitrary name, myPopup, to serve as the target\
    \ name. The next four parame¬ \n\nters establish the width, height, left coordinate,\
    \ and top coordinate of the new \n\nwindow. The final parameter passes the value\
    \ basic to indicate that only \n\nbasic features are requested in the new window.\
    \ \n\n5. The openWin( ) function receives the seven parameters and stores them\
    \ in \n\nthe temporary variables url, targetname, W, H, L, T, and thef eatures.\
    \ \n\n6. A variable called params is created to store the text string with all\
    \ the attrib¬ \n\nutes of the new window. Then the three prebuilt feature sets\
    \ are defined: \n\nnofeatures, basicfeatures, and morefeatures. A variable dimen¬\
    \ \n\nsions and a variable placement are created to hold the values for the desired\
    \ \n\nsize and location of the new window. \n\n7. A switch control structure chooses\
    \ the feature set based on the seventh param¬ \n\neter. In this case, the value\
    \ basic was passed, so the contents of the variable \n\nbasicf eatures are added\
    \ to the contents of the variable params. \n\n8. A comma and the values in the\
    \ variables dimensions and placement are added \n\nto the variable params. The\
    \ resulting text string containing in params \n\nwould read \n\nscrollbars=l,resizable=l,menubar=1,width=400,\
    \ \n\nheight=200,left=100,top=40,screenX=100,screenY=40 \n\n9. The window, open(\
    \ ) method is called to open a new window with the \n\ndesired feature set. The\
    \ window.open( ) method returns a value to identify \n\nthe new window. That value\
    \ is placed in the global variable myWindow creat¬ \n\ned in step 1. Because the\
    \ openWin( ) function is finished, control returns to \n\nthe showPage ( ) function."
