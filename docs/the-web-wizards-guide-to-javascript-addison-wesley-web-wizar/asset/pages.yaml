    \ elements that will \n\nbe visible to Web page visitors. \n\nScripts can be stored\
    \ in both the HEAD and the BODY sections. The HEAD is used \n\nmost often because\
    \ it loads first. In this way, you can refer to your code in the \n\nBODY with\
    \ the assurance that the code will be completely loaded into the brows¬ \n\ner's\
    \ memory. Listing 2.4 shows a typical JavaScript-enhanced page with a script in\
    \ \n\nthe HEAD and a reference to that script in the BODY (see Figure 2.4). \n\
    \nIn Listing 2.4, a value is passed (sent) from the one lick event handler in\
