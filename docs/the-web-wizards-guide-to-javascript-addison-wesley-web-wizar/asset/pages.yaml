    \ \n\n' \n\nSHHlKliKHn \n\nFigure 5.2 Output of Listing 5.2 with All Four Images\
    \ \n\n'uTTiP Using the setTimeout() method \n\nThe window object created by most\
    \ browsers can perform actions known as methods. One method \n\nyou've encountered\
    \ in earlier examples is the alert method. The formal statement of this method,\
    \ \n\nwindow.alert ( ), would include the object name, but in practice the name\
    \ of the window object \n\nis assumed. \n\nalert(’Some message here.’) \n\nThe\
    \ setTimeout( ) method of the window object lets you execute a JavaScript function\
    \ after a \n\ndelay (in milliseconds) of your choosing. You can think of the setTimeout(\
    \ ) method as a way to \n\nschedule a task for the browser to perform. The setTimeout(\
    \ ) method generates an ID number \n\nto identify the task. It's best to store\
    \ this ID in a variable so that you can later cancel the scheduled \n\ntask with\
