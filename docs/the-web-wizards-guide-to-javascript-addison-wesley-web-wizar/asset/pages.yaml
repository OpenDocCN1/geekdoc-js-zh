    \njavaScript and Frames \n\n141 \n\n\\-r.' \n\nmmsmsmsmm \n\nThe window object\
    \ has a useful history object that stores a list of pages recent¬ \n\nly loaded\
    \ into the window. To navigate to any of the pages in the list, use the fol¬ \n\
    \nlowing statement and substitute a positive or negative integer as the parameter.\
    \ \n\nwindow.history.go(integer); \n\nFor example, window, history. go(-3 ) would\
    \ produce a result similar to \n\nclicking the Back button three times. \n\njavaScript\
    \ and frames \n\nFrames are common in Web sites both large and small. A typical\
    \ arrangement con¬ \n\nsists of a set of two frames (called a frameset): a navigation\
    \ frame on the left, and \n\na content frame on the right. Listing 8.3 creates\
    \ a set of two frames, called navi¬ \n\ngation and content, to assist visitors\
    \ in viewing the listings from Chapter Two. \n\nListing 8.4 shows the navbar .\
    \ html file that will appear in the navigation frame. \n\nListing 8.5 shows the\
    \ code for the home.html file that is initially loaded in the \n\ncontent frame.\
    \ \n\n<html><head><title>Frameset for Chapter Two</title> \n\n</head> \n\n<frameset\
    \ cols=\"150,\\*\"> \n\n<frame src=\"navbar.html\" name=\"navigation\"> \n\n<frame\
    \ src=\"home.html\" name=\"content\"> \n\n</frameset></html> \n\nListing 8.3 A\
    \ Frameset for the Examples in Chapter Two \n\n<html><head><title>Navigation Bar\
    \ for Chapter Two \n\n</title></head> \n\n<body bgcolor=\"aqua\"> \n\n<h4><a href=\"\
    home.html\" target=\"content\">HOME</a></h4> \n\n<h4><a href=\"listing2.1.html\"\
    \ target=\"content\"> \n\nlisting 2.1</a></h4> \n\n<h4><a href=\"listing2.2.html\"\
