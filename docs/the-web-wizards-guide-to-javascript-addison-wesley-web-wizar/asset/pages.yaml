    loop, an element of the form survey is examined to see whether it is \n\nchecked.\
    \ That element is determined by combining degree with the cur¬ \n\nrent value\
    \ of the index variable (i). \n\n6. If a checked box is found, its value is stored\
    \ in the degree variable. If multi¬ \n\nple degrees are checked, each one will\
    \ replace the previous contents of the \n\ndegree variable. \n\n7. The index variable\
    \ of this loop (i) is used to determine which element of the \n\ncomments array\
    \ should be displayed in the feedback field. \n\n8. The next section of the code\
    \ contains conditional structures to test the value \n\nof the degree variable.\
    \ \n\n9. If none of the boxes is checked, it means that degree is empty. An alert\
    \ box \n\nappears with instructions. After the visitor dismisses the alert box,\
    \ a value of \n\nfalse is returned to the FORM object that called the function,\
    \ and that pre¬ \n\nvents the e-mail from being sent. \n\n10. If degree contains\
    \ anything other than an empty text string, a value of \n\ntrue is returned to\
    \ the FORM object, which then sends the form contents \n\nvia e-mail to the address\
