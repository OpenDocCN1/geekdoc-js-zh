    \nSummary \n\n► Cookies are small pieces of information stored on the visi¬ \n\
    \ntor's hard drive. Cookies are mostly harmless, but valid \n\nprivacy concerns\
    \ exist about the use of cookies in con¬ \n\njunction with invasive marketing\
    \ techniques. You can \n\ncreate as many as 20 cookies per domain. \n\n► Cookies\
    \ are set when a JavaScript statement in a Web page \n\nassigns content to the\
    \ cookie property of the document \n\nobject. By default, the content includes\
    \ information about \n\nthe domain and directory location of the page that created\
    \ \n\nit. When a Web page attempts to retrieve a cookie, the \n\nlocation of the\
    \ Web page is compared to the domain and \n\ndirectory of the page that created\
    \ the cookie. If the two locations do not match, the \n\ncookie cannot be retrieved.\
    \ You can set an expiration date for your cookies. The \n\nform of the expiration\
    \ date is always GMT. Bill Dortch's cookie code is widely used \n\non the Internet\
    \ and has been placed in the public domain. \n\n► One popular use of cookies is\
    \ to store visitor preferences, such as background color \n\nand login information.\
    \ \n\nP When a Web page retrieves information from a cookie, the page can act\
    \ on that \n\ninformation by changing the page appearance to suit the expressed\
    \ preferences of \n\nthe visitor. \n\nAnother popular use of cookies is to retain\
    \ selected items as visitors move through \n\nthe pages of an online shopping\
    \ cart. The shopping cart technique can also be \n\nadapted to delivering surveys\
    \ or tests online. \n\nA Online References \n\nMarshall Brain's How Stuff Works\
    \ site has a nice article on cookies. \n\nhttp://www.howstuffworks.com/cookie.htm\
    \ \n\nWebopedia's basic definition of cookies \n\nhttp://webopedia.internet.com/TERM/c/cookie.html\
    \ \n\nCookieCentral.com offers an overview of cookies and links to related news\
    \ articles. \n\nhttp://www.cookiecentral.com \n\nThe Electronic Privacy Information\
    \ Center offers information to address privacy concerns \n\nabout cookies. \n\n\
    http://www.epic.org/privacy/internet/cookies/ \n\nRoger Clarke offers a scholarly\
    \ article and basic history about cookies. \n\nhttp://www.anu.edu.au/people/Roger.Clarke/II/Cookies.html\
    \ \n\n129"
