    ## 总结


    - 预加载多个图片的技巧可以创建幻灯片。图片切换可以由多种事件触发。鼠标悬停（mouseover）事件是常见的触发器，但点击（CLICK）事件同样有效。

    - 然后可以使用带有单个点击处理器的按钮或链接来触发图片切换。如果函数接受参数，其行为将根据参数的值而变化。用于更改幻灯片图片的函数在接收到 `next`
    参数时可能执行一种操作，而在接收到 `previous` 参数时执行另一种操作。

    - 按照时间表更改图片的广告横幅是 `setTimeout()` 方法的应用。`window` 对象的这种方法允许你为 Web 浏览器调度任务，以便在指定的延迟后执行。每个请求任务的唯一数字可以存储在变量中，以便使用
    `clearTimeout()` 方法取消任务。


