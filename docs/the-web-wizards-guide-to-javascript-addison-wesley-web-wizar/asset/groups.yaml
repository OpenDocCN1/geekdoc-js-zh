    \nTest \n\n56 \n\n## Chapter Three Working with Forms\n\nFigure 3.6 shows the\
    \ form. \n\n### Selection Menu Diagnostic Quiz\n\nBack Forward Stop Refresh Home\
    \ AutoFill Print Mail \n\nhttp://www.angelo/stevenestrella.com/stdev/listings.html\
    \ \n\nDiagnostic Quiz on Composer Dates\n\nQuestion 1: What is Bach's year of\
    \ death? \n\n1750 \n\nQuestion 2: What is Mozart's year of death? \n\n1791 \n\n\
    Question 3: What is Beethoven's year of death? \n\n1827 \n\nCheck Answers \n\n\
    Your score is \n\n.... USkss?,1 20n.............\n\nFigure 3.6 Output of Listing\
    \ 3.7\n\n**WARNING No Peeking!**\n\nA visitor to the page created by Listing 3.7\
    \ could cheat by viewing the source code. To avoid this problem, you can hide\
    \ the answers by placing the script section in an external library. Be aware,\
    \ however, that experienced computer users can locate the text of the external\
    \ library. With that in mind, such online tests are suitable as diagnostic study\
    \ aids but should not be used to determine grades.\n\n### How Does It Work?\n\n\
    Listing 3.7 generates the following sequence of events.\n\n1. The browser loads\
    \ the HEAD section of the page into memory. This includes an array containing\
    \ the correct answers to the quiz. Element 0 of the array is not filled with any\
    \ value; as a result, the element numbers begin with 1 to match the question numbers.\n\
    \n2. The BODY portion of the page is loaded. The SELECT objects on the page are\
    \ created and given sequential names \"q1\", \"q2\", and \"q3\".\n\n3. The visitor\
    \ selects answers to each of the questions and clicks the Check Answers button.\
    \ The onclick handler calls the `checkAnswers()` function.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_68_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_68_1.png)\n\
    \n57\n\n### Creating a Self-Grading Test\n\n4. The `checkAnswers()` function creates\
    \ a variable called `score` and sets it to 0.\n\n5. The `checkAnswers()` function\
    \ performs a loop. On each pass through the loop, an index variable (i) increases\
    \ in value by 1 until it reaches 4.\n\n6. The `checkAnswers()` function creates\
    \ a temporary variable called `theMenu` and fills it with the SELECT object on\
    \ the survey form having the name q1, q2, or q3 depending on the value of i. A\
    \ second variable, `selectedIndex`, is then filled with the `selectedIndex` of\
    \ theMenu.\n\n7. A temporary variable called `deathDate` is created and filled\
    \ with the value of the selected option of the theMenu.\n\n8. The index variable\
    \ of this loop (i) is then used to determine which element of the `correctAnswers`\
    \ array is to be compared to the value of `deathDate`. If the values match, the\
    \ score variable increases by 1. The operator `++` is an abbreviation used to\
    \ increment a variable by 1.\n\n9. Finally, the score is assigned to the value\
    \ of the `score` field text input on the quiz form. The visitor's score appears\
    \ in the text field on the screen.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_69_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_69_1.png)\n\
    \n### Summary\n\nForms are popular features of the Web, particularly in electronic\
    \ commerce. JavaScript is often used to ensure that visitors enter required information\
    \ before submitting a form, a process known as form validation.\n\n- To validate\
    \ a text field, you first determine whether a value has been entered. For example,\
    \ to determine whether the visitor neglected to enter information into a required\
    \ field, you may test the expression `(!document.survey.visitor.value)`. If that\
    \ expression is true then the visitor failed to enter required information into\
    \ the visitor field. You can also check to make sure the information is in the\
    \ correct format in terms of numbers and punctuation.\n\nYou can create JavaScript\
    \ code that will change the format of visitor-entered text if it is in the wrong\
    \ format for your purposes.\n\nBrowsers automatically store a set of radio buttons,\
    \ all bearing the same name, in an array. For example, if you have two radio buttons\
    \ called gender, the first one, `gender[0]`, might have a value of male and the\
    \ second one, `gender[1]`, might have a value of female. You can use JavaScript\
    \ expressions to see which button is checked and to find its value.\n\nOften,\
    \ it makes sense to create a series of check boxes with sequential names such\
    \ as degree1, degree2, and so on. You can then use a loop to determine which ones\
    \ are checked.\n\nA common technique for obtaining the value of a selected item\
    \ in a SELECT menu is to store the SELECT object in a variable, find the number\
    \ of the selected option (the `selectedIndex` property), and then find the value\
    \ of the selected option.\n\nA variant of form validation allows you to create\
    \ self-grading online study aids.\n\n### Online References\n\n- Dr. Estrella's\
    \ Interactive Web Programming. This site contains examples of form validation.\
    \ Look in the \"Scripts to Study\" section for examples, http://www.stevenestrella.com/IWP\n\
    - W3Schools.com has a collection of useful form validation examples, http://www.w3schools.com/js/jsform.asp\n\
    \n58\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_70_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_70_1.png)\n\
    \n59\n\n### Hands-On Exercises\n\n### Review Questions\n\n1. How is the `focus()`\
    \ method used in form validation?\n2. When the visitor clicks the Submit button\
    \ on a form, how does the Web browser know what to do next?\n3. What method is\
    \ used to extract one or more characters from a string of text?\n4. A visitor\
    \ changes a value in a text field and presses the {Tab} key. What event handler\
    \ is needed to respond to this action?\n5. What property of an array can be used\
    \ to find out the number of elements in the array?\n6. How can you test to see\
    \ whether a radio button is checked? How can you obtain the value of a radio button?\n\
    7. If you wish to use a loop to find the values of check boxes, what scheme should\
    \ you use?\n8. What happens when a validation function returns false?\n9. What\
    \ is `selectedIndex`?\n10. What is a global variable? What is a local variable?\n\
    \n### Hands-On Exercises\n\n1. Create a five-question self-grading study aid using\
    \ text fields.\n2. Create a five-question self-grading study aid using radio buttons.\n\
    3. Create a five-question self-grading study aid using check boxes.\n4. Create\
    \ a five-question self-grading study aid using selection menus.\n5. Add form validation\
    \ to make sure the visitor enters an email address to the previous exercises.\n"
