    \ ECMA. \n\nJavaScript is an object-oriented language. Elements present \n\non\
    \ Web pages are stored as objects in the memory of the \n\nbrowser. Like objects\
    \ in the real world, Web browser \n\nobjects have properties and capabilities.\
    \ Objects in a Web browser may respond to \n\nevents like mouseover and click.\
    \ Event handlers are small pieces of code designed to \n\nrespond to events. Variables\
    \ are containers for information. The value held in a vari¬ \n\nable may be changed\
    \ using an assignment operator (=). Arrays are ordered collec¬ \n\ntions of data.\
    \ A spice rack is an array in the real world. Each position in the spice \n\n\
    rack may be filled with any spice and the chef may rearrange the spices at any\
    \ time. \n\nMethods are the verbs of the JavaScript language. Methods describe\
    \ the actions that \n\nobjects may perform. The most frequent programming error\
    \ is confusing the assign¬ \n\nment operator (=) with the equality operator (==).\
    \ The assignment operator changes \n\nvalues in a variable. The equality operator\
