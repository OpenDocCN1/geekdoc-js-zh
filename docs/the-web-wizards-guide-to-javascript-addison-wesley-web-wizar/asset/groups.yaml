    \ This technique can be called a double rollover because \n\nrolling the mouse\
    \ over a linked image results in two image swaps rather than one. \n\nListing\
    \ 4.5 creates the same rollover effects as Listing 4.4 but also displays image\
    \ \n\nfiles of the birth and death dates of each composer. \\_ \n\n<html><head><title>Rollover\
