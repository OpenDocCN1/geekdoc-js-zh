    </body>\n</html>\n```\n代码列表 7.2 设置两个 Cookie 的简单页面\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_126_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_126_1.png)\n\
    \n图 7.1 显示了列表 7.2 的输出。\n\n图 7.1 列表 7.2 显示检索到的 Cookie 输出\n\n### 它是如何工作的？\n\n1.\
    \ `mylibrary.js` 文件在 HEAD 加载时加载到内存中。当页面加载完成后，BODY 标签中的 onload 处理器调用 `showCookies()`\
    \ 函数。`showCookies()` 函数调用 `GetCookie()` 函数检查 `visitor` 和 `colorchoice` cookie\
    \ 是否存在。如果存在任何一个 cookie，`showCookies()` 函数会在 `visitorcookie` 和 `colorcookie` 字段中显示它们的值。\n\
    2. 访客输入姓名和颜色选择并点击“Make Cookies”按钮。\n3. `makeCookies()` 函数将访客输入的值放入两个变量：`visitorname`\
    \ 和 `visitorcolor`。\n4. 调用存储在 `mylibrary.js` 中的 `SetCookie()` 函数，将 `visitor` 作为\
    \ cookie 名称，将变量 `visitorname` 作为 cookie 值。\n5. 调用存储在 `mylibrary.js` 中的 `SetCookie()`\
    \ 函数，将 `colorchoice` 作为 cookie 名称，将变量 `visitorcolor` 作为 cookie 值。\n6. 警示框通知访客其\
    \ cookie 已创建。\n7. 访客浏览互联网上的任何其他页面，然后返回此页面。\n8. `onload` 处理器调用 `showCookies()`\
    \ 函数并检索 cookie 中发现的信息。\n\n"
