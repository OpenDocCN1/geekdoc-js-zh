    ## 成为互联网大亨


    像 PayPal.com 等在线支付系统允许小企业和个人无需设置昂贵的信用卡处理和商户银行账户，即可从他们的网站销售产品。PayPal 处理所有的信用卡交易，并保留支付金额的一小部分作为费用。收集到的剩余资金将转入您的结算账户。访问
    http://www.time.org 查看小型非营利组织如何使用 PayPal 在线接受会员费。


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_140_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_140_1.png)


    ### 总结


    - Cookie 是存储在访问者硬盘上的极小部分信息。Cookie 大多是无害的，但在结合侵入性营销技术使用 cookie 时，确实存在隐私担忧。你每个域名最多可以创建
    20 个 cookie。

    - 当 Web 页面中的 JavaScript 语句将内容分配给对象的 `cookie` 属性时，cookie 就会被设置。默认情况下，内容包含有关创建它的页面的域名和目录位置的信息。当
    Web 页面尝试检索 cookie 时，会将该页面的位置与创建 cookie 的页面的域名和目录进行比较。如果两个位置不匹配，则无法检索 cookie。你可以为
    cookie 设置过期日期。过期日期的格式始终是 GMT。Bill Dortch 的 cookie 代码在互联网上被广泛使用，并已置于公共领域。

    - Cookie 的一个流行用途是存储访问客偏好，例如背景颜色和登录信息。

    - 当 Web 页面从 cookie 中检索信息时，页面可以通过更改页面外观来适应访问客的偏好，从而对该信息采取行动。

    - Cookie 的另一个流行用途是在访问客在在线购物车的页面之间移动时保留选定的项目。购物车技术也可以用于在线交付调查问卷或测试。


