    \nCreating Animated Advertising Banners \n\n82 \n\nChapter Five More Image Swapping\
    \ \n\n' \n\nSHHlKliKHn \n\nFigure 5.2 Output of Listing 5.2 with All Four Images\
    \ \n\n'uTTiP Using the setTimeout() method \n\nThe window object created by most\
    \ browsers can perform actions known as methods. One method \n\nyou've encountered\
    \ in earlier examples is the alert method. The formal statement of this method,\
    \ \n\nwindow.alert ( ), would include the object name, but in practice the name\
    \ of the window object \n\nis assumed. \n\nalert(’Some message here.’) \n\nThe\
    \ setTimeout( ) method of the window object lets you execute a JavaScript function\
    \ after a \n\ndelay (in milliseconds) of your choosing. You can think of the setTimeout(\
    \ ) method as a way to \n\nschedule a task for the browser to perform. The setTimeout(\
    \ ) method generates an ID number \n\nto identify the task. It's best to store\
    \ this ID in a variable so that you can later cancel the scheduled \n\ntask with\
    \ a call to the clearTimeout ( ) method. \n\nvar timerlD \\= setTimeout(1somefunction()’,delayvariable);\
    \ \n\nIn this case, if delayvariable is set to 1000, somef unction ( ) will execute\
    \ after a one-second \n\ndelay. The task is assigned a number and stored in timerlD.\
    \ To cancel this task, use the \n\nclearTimeout method and the timerlD. \n\nclearTimeout(timerlD);\
    \ \n\nHow Does It Work? \n\n1. The browser loads the HEAD and creates four new\
    \ image objects in an array \n\ncalled my Ads. The SRC property of each image\
    \ is preloaded with a . jpg file \n\nlocated in the images folder. Each image\
    \ is the same width and height."
- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_94_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_94_1.png)\n\
    \nCreating Animated Advertising Banners 83 \n\n2. The browser stores timings for\
    \ the slide show in an array called myTimings.\n\nThe values are in milliseconds.\
    \ For example, the value 3000 in myTimings [1] indicates a delay of 3 seconds\
    \ between the appearance of image 1 and the appearance of image 2.\n\n3. The mySites\
    \ array stores Web addresses that will be linked to the images.\n\n4. A global\
    \ variable, adnumber, is created to hold the number of the current image. A second\
    \ global variable, totalads, is created to hold the number of images in the animation.\
    \ Because element 0 of the myAds array is not used, we must subtract 1 from the\
    \ length of the array to determine the number of images. A third global variable,\
    \ timer ID, is initialized here for later use.\n\n5. The functions showAd( ) and\
    \ goSite( ) are stored in memory and will perform their tasks when called upon\
    \ later.\n\n6. The BODY of the document includes an image called myBanner surrounded\
    \ by an anchor tag (<a><a></a>>). Version 4.0 and later Web browsers recognize\
    \ the onclick handler in the anchor tag. Earlier browsers ignore it but recognize\
    \ the HREF property.\n\n7. When the page finishes loading, the LOAD event occurs.\
    \ The window object will react to the LOAD event if an onload event handler is\
    \ present in the BODY tag. In this example, the onload handler calls the startBanner(\
    \ ) function, which sets the adnumber variable to 0 and calls the showAd( ) function\
    \ to start the banner animation.\n\n8. The showAd ( ) function in the HEAD checks\
    \ first to make sure that the images array is supported by the browser. It then\
    \ checks to make sure that the current image is complete; it makes little sense\
    \ to begin loading image 2 if image 1 has not been displayed. The global variable\
    \ adnumber is incremented by 1. Then adnumber is tested to see whether it is larger\
    \ than totalads. If it is, adnumber is reset to 1 and the animation begins again\
    \ at the first image. The value in adnumber determines which image file gets loaded\
    \ into the SRC property of myBanner.\n\n9. The setTimeout ( ) method calls the\
    \ showAd ( ) function repeatedly. The delay between calls is determined by the\
    \ value of element adnumber of the myTimings array. In this way, the timing between\
    \ images can vary according to the image content. For example, you can set images\
    \ having more text to a longer delay, thereby allowing time for the visitor to\
    \ read the text. A unique ID number is stored in the global variable timer ID\
    \ for each task scheduled by the setTimeout ( ) method.\n\n10. The visitor clicks\
    \ on the Bach image, the second image in the series. At that moment the value\
    \ of adnumber is 2. A click event is generated. The onclick event handler in the\
    \ anchor tag surrounding the image responds to the click event by calling the\
    \ goSite ( ) function.\n\nCreating Animated Advertising Banners\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_95_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_95_1.png)\n\
    \nCreating Animated Advertising Banners 84 \n\nChapter Five More Image Swapping\n\
    \n11. The goSite ( ) function stops the banner animation using the clearTimeout\
    \ ( ) method. The goSite ( ) function passes the timerID variable, which tells\
    \ the clearTimeout ( ) method which task to cancel.\n\n12. The goSite ( ) function\
    \ changes the href property of the location object of the current window to the\
    \ Web address stored in element adnumber of the mySites array. Because adnumber\
    \ is currently 2, the Bach page loads in the current window. This works because\
    \ the location object represents the URL currently loaded in the window. If the\
    \ href property of the location object is changed to a different URL, the new\
    \ URL is automatically loaded.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_96_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_96_1.png)\n\
    \n## Summary\n\n- The technique of preloading multiple images can be applied to\
    \ creating slide shows. Image swapping may be triggered by a variety of events.\
    \ Mouseover events are common triggers but CLICK events work just as well.\n-\
    \ Buttons or links with one click handlers may then be used to trigger image swaps.\
    \ If a function accepts parameters, its behavior will vary depending on the value\
    \ of parameter. A function to change images in a slide show may do one thing if\
    \ the parameter next is received and another if the parameter previous is received.\n\
    - An advertising banner with images that change according to a schedule is use\
    \ of the setTimeout ( ) method. This method of the window object allows you to\
    \ schedule tasks for the Web browser to perform after a given delay. A unique\
    \ number for each requested task may be stored in a variable so that the task\
    \ may be cancelled using the clearTimeout ( ) method.\n\n## Online References\n\
    \n- Raymond Camden has published a slide show template that is free for use: http://www.camdenfamily\n\
    - The Maricopa Center for Learning and Instruction has published a useful slide\
    \ show template consisting of several HTML files and some JavaScript: http://www.dist.maricopa.edu/proj/clicker/\n\
    - Webreference.com has a helpful tutorial on creating text banners: http://www.webreference.com/js/columns/\n\
    - ZNet developer's site presents a slight variant of the rotating image banner\
    \ explained in this chapter: http://www.zdnet.com/devhead/stories/articles/4413-242293-0.html\n\
    - CNET's builder site has helpful articles on creating graphics for use on the\
    \ Web: http://builder.cnet.com/\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_97_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_97_1.png)\n\
    \n86 Chapter Five More Image Swapping\n\n## Review Questions\n\n1. What code must\
    \ you add to a button on a form so that it will perform a function when clicked?\n\
    2. What is the conditional operator? Give an example.\n3. What is a parameter,\
    \ and how do you pass one?\n4. What object uses the setTimeout ( ) method?\n5.\
    \ What does the clearTimeout ( ) method do?\n6. How do you start a banner animation\
    \ as soon as the page loads?\n7. How do you change the page currently displayed?\n\
    \n## Hands-On Exercises\n\n1. Create a slide show with navigation buttons and\
    \ text fields.\n2. Create an animated banner and link the images to your favorite\
    \ Web sites.\n3. Combine elements of Exercises 1 and 2 to create a variant of\
    \ the slide show that allows the visitor to choose the image to be displayed.\
    \ Use a table of links on the bottom of the screen and a single large image on\
    \ the top. When the visitor clicks each link, a different image replaces the one\
    \ already displayed. Each link should contain an onclick handler to call the image\
    \ swapping function.\n\n![](img/705a881c3cbfe90339b9b12a38fc1c6_98_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_98_1.png)\n\
    \nOne easy way to add dynamic content to your Web pages is to base the content\
    \ on the current date or time. Your Web page might display a clock that updates\
    \ each second, or it might greet visitors with a different message depending on\
    \ the time of day. You can also produce interesting pages by allowing visitors\
    \ to make simple date and time calculations. Perhaps your visitor would be interested\
    \ to know that a famous person was born on the visitor's birthday or that the\
    \ current time in New Zealand is 2 AM.\n\n- To understand JavaScript's Date object\n\
    - To learn how to add a clock to a Web page\n- To find out how to display the\
    \ time and date in any format you like\n\n88 Chapter Six Working with Dates and\
    \ Times\n\n## Date Object \n\n- To see how to add a greeting to a Web page that\
    \ changes with the time of day\n- To learn how to add a time-sensitive greeting\
    \ to your Web page clock\n- To discover how to perform calculations based on dates\n\
    \n## The Date Object\n\nJavaScript works with objects in a host environment, typically\
    \ a Web browser. By now you are familiar with the window, document, form, and\
    \ image objects. The browser creates these objects. The Date object, however,\
    \ is one of a handful of core objects that exists in the JavaScript language independently\
    \ of the host environment. If all you ever do with JavaScript is create Web pages,\
    \ this distinction isn't terribly important. JavaScript is increasing in popularity,\
    \ however, and this means your new skills in JavaScript programming will be valuable\
    \ in scripting the objects of other host environments you'll encounter.\n\nTo\
    \ use the Date object you must first create an instance of it in memory.\n\n`var\
    \ currentDate = new Date();`\n\nThe variable currentDate now contains a number\
    \ equal to the number of milliseconds that have elapsed since midnight of January\
    \ 1, 1970. Dates before 1970 are represented as negative milliseconds.\n\nAfter\
    \ you create an instance of the object, you can apply a variety of methods to\
    \ determine the current minute, hour, second, month, and so on. Following are\
    \ some common Date methods:\n\n- currentDate.getDate() returns the date (1-31)\
    \ of the month.\n- currentDate.getDay() returns the day of the week (0-6 for Sunday\
    \ through Saturday).\n- currentDate.getFullYear() returns the four-digit year\
    \ (for example, 2001).\n- currentDate.getHours() returns the hour (0-23).\n- currentDate.getMilliseconds()\
    \ returns the milliseconds elapsed since the last second (0-999).\n- currentDate.getMinutes()\
    \ returns the minutes elapsed since the last hour (0-59).\n- currentDate.getMonth()\
    \ returns the month (0-11 for January through December).\n- currentDate.getSeconds()\
    \ returns the seconds elapsed since the last minute (0-59).\n- currentDate.getTime()\
    \ returns the milliseconds elapsed since January 1, 1970.\n"
