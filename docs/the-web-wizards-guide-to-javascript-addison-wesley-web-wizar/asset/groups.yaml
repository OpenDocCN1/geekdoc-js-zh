    \ = score;\n}\n//-->\n</script>\n\n</head>\n\n<body bgcolor=\"white\">\n\n<h1>作曲家日期测试</h1>\n\
    \n<form name=\"quiz\">\n\n<h4>问题 1：巴赫去世于哪一年？</h4>\n\n<select name=\"q1\">\n<option\
