    \n18\n\n第二章 使用 JavaScript 增强网页\n\n☆ ★\n\n学习如何使用可以创建其他网页的网页 \n\n了解如何创建一个用于测试你代码的网页\n\
    \n## 序列：按给定顺序执行任务\n\n想象一下，你是一个 13 岁男孩的父母，他开始长胡须了。我们叫他 Alex 吧。你的任务是教 Alex 如何刮脸。你的解释可能如下：\n\
    \n1. 用湿毛擦脸。\n2. 在皮肤上涂抹剃须膏。\n3. 用剃须刀在皮肤上刮，以去除胡须。\n4. 在脸上涂上须须水。\n5. 大声尖叫。\n\n这五个步骤代表了一个指令序列。Alex\
    \ 只有在完成指令 1 之后才会执行指令 2，依此类推。\n\n同样，Web 浏览器按照它接收语句的顺序执行一系列 JavaScript 语句。然而，与 Alex\
    \ 不同，你的浏览器并不具备智能。因此，你必须在编写指令时确保精确。\n\n提示：如果你在连接互联网时阅读本章，可以在书籍网站 http://www.awl.com/estrella/\
    \ 查看所有代码示例的运行情况。\n\n列表 2.1 中的 JavaScript 语句序列创建了一个文本字符串，然后通过警告框（alert box）显示给用户，如图\
    \ 2.1 所示。\n\n`<script> </script>` 标签将其包含的所有语句识别为待解释的代码。`type=\"text/javascript\"\
    ` 属性将代码识别为 JavaScript。最新的浏览器（Internet Explorer 5+ 和 Netscape 6+）识别 `<script>`\
    \ 标签中的 `TYPE` 属性，因为它是 HTML 4.0 规范的一部分。旧版浏览器依赖于 `language=\"JavaScript\"` 属性。为了保险起见，最好同时包含这两个属性，如示例所示。\n\
    \n提示 想写注释吗？\n\n在你的 JavaScript 代码中放置注释将帮助你和他人理解你编写的代码。SCRIPT 标签内的注释文本块可以用 `/*`\
    \ 开头，以 `*/` 结尾，如列表 2.1 所示。\n\n单行注释可以用 `//` 开头。浏览器在执行代码时会忽略注释文本。然而，HTML 中的注释使用更熟悉的\
    \ HTML 注释字符（`<!-- HTML 注释放在这里 -->`）。\n\n脚本的第一行以 HTML 注释标签（`<!--`）开头，这会让旧版浏览器（Netscape\
