    2. 一个名为 survey 的 FORM 对象开始出现在屏幕上。ACTION 属性设置为将表单内容（编码为纯文本）发送到电子邮件地址。在表单内部，出现了文本
    INPUT 字段 `email`，并提示访客输入电子邮件地址。

    3. 类型为 `submit` 的 INPUT 标签创建了一个提交按钮。`Send Survey` 的值是显示在按钮上的文本。

    4. 访客在未输入任何内容的情况下，点击 Send Survey 按钮来提交表单。按钮产生一个提交事件。

    5. FORM 对象的 `onsubmit` 处理程序向浏览器中的 JavaScript 解释器发送一行代码。该代码调用 `validate()` 函数并向
    FORM 对象返回 `true` 或 `false` 值。如果返回值为 `false`，FORM 对象将不会发送电子邮件。

    6. `validate()` 函数创建一个变量 `theEmail` 来存储访客输入的值。创建一个变量 `atLoc` 来存储 `@` 字符的位置（如果它是字符
    1 或之后，从零计数）。创建一个变量 `dotLoc` 来存储 `.` 字符的位置（如果它在 `@` 符号之后至少两个字符）。创建一个变量 `len` 来存储访客输入的地址长度。

    7. 一个 `if-else` 结构检查 `@` 的位置是否大于 0，点的位置是否大于 0，以及电子邮件地址是否在点之后至少两个字符结束。使用 `&&` 代码创建逻辑与条件来检查所有变量。如果所有条件为
    `true`，则 `validate()` 函数返回 `true` 并发送电子邮件。否则，访客将收到提示框。


    ### 修改文本字段中的信息


    有时，表单接收到的信息格式必须是特定的。标准的美国电话号码例如 (555) 333-4444 包含三位区码、三位交换码和四位扩展码。标准格式使用括号隔开区码，并在交换码和扩展码之间使用连字符。列表
    3.3 展示了如何对文本字段中输入的信息进行重新格式化。你可以将此技术应用于社会安全码、邮政编码、信用卡号或任何具有一致结构的数字。


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_51_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_51_1.png)


    ### 修改文本字段中的信息


    ```html

    <html>

    <head>

    <title>字段自动格式化</title>

    <script type="text/javascript" language="JavaScript">

    function formatNumber(){

    var theNumbersOnly = "";

    var theChar = "";

    var input = document.phoneform.phone.value;

    for (i = 0; i < input.length; i++){

    theChar = input.substring(i,i+1);

    if (theChar >= "0" && theChar <= "9"){

    theNumbersOnly = "" + theNumbersOnly + theChar;

    }

    }

    if (theNumbersOnly.length < 10){

    alert("必须输入10位数字。");

    document.phoneform.focus();

    }else{

    var areaCode = theNumbersOnly.substring(0,3);

    var exchange = theNumbersOnly.substring(3,6);

    var extension = theNumbersOnly.substring(6,10);

    var newNumber = "(" + areaCode + ") ";

    newNumber += exchange + "-" + extension;

    document.phoneform.phone.value = newNumber;

    }

    }

    </script>

    </head>

    <body bgcolor="WHITE">

    <h1>基础格式化</h1>

    <p>在表单中输入数字，然后按 Tab 键。<br>

    您的号码将按照电话系统进行格式化。<br>

    </p>

    <form name="phoneform"><input type="text" name="phone" value="(555) 555-1234"
    size="20" onchange="formatNumber();"></form>

    </body>

    </html>

    ```


