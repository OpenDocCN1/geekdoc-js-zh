    \ you the flexibility to refer to the image name as an expression or \n\nvariable\
    \ rather than having to literally type beethoven each time. \n\n<html><head><title>Rollover\
    \ Beethoven</title></head> \n\n<body bgcolor=\"white\"> \n\n<div align=\"center\"\
    > \n\n<hl>Rollover Beethoven</hl> \n\n<img src=\"images/beethovenoff.jpg\" width=\"\
    250\" \n\nheight=\"70\" name=\"beethoven’ \n\nalt=\"Picture of Beethoven\"> \n\
    \n</div> \n\n</body> \n\n</html> \n\nborder=\"0\" \n\nIt is good form to include\
    \ the alt tag. This tag provides \n\ncontent for those browsing the Web with images\
    \ \n\nturned off. \n\nListing 4.1 HTML Page Displaying a Single Image"
- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_74_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_74_1.png)\n\
    \n## Creating a Simple Rollover\n\n63\n\nTo create a crude rollover effect, the\
    \ SRC property of the 'beethoven' image must be changed to another image file\
    \ only when the mouse is moved over the image. Unfortunately, the image objects\
    \ created by most browsers do not respond to mouse events. The link objects created\
    \ by the anchor tags (`<a>``</a>`), however, do respond to mouse events. By surrounding\
    \ the IMG tag with a simple link, you can work around the limitations of current\
    \ browsers (see Listing 4.2).\n\n```html\n<html>\n<head>\n<title>Rollover Beethoven</title>\n\
    </head>\n<body bgcolor=\"white\">\n<div align=\"center\">\n<hl>Rollover Beethoven</hl>\n\
    <a href=\"#\" onmouseover=\"document['beethoven'].src='images/beethovenon.jpg'\"\
    \ onmouseout=\"document['beethoven'].src='images/beethovenoff.jpg';\n<img src=\"\
    images/beethovenoff.jpg\" width=\"250\" height=\"70\" name=\"beethoven\" border=\"\
    0\" alt=\"Picture of Beethoven\"></a>\n</div>\n</body>\n</html>\n```\n\nListing\
    \ 4.2 The IMG Tag Surrounded by a Link with Mouse Event Handlers\n\n`border=\"\
    0\"` prevents the border of the image from appearing in the same color as the\
    \ other links on the page. The Anchor tag responds to mouseover and mouseout events.\n\
    \n### How Does It Work?\n\nListing 4.2 produces the following sequence of events.\n\
    \n1. An IMG tag in the HTML code causes an image to appear in the current document\
    \ displayed in a Web browser window.\n    a. The name property in the IMG tag\
    \ creates an image object in the browser's memory called beethoven with the height\
    \ and width as specified.\n    b. The SRC property of the IMG tag assigns the\
    \ image file `beethovenoff.jpg` to the SRC property of the image object beethoven.\
    \ The image then appears on the screen.\n    c. The BORDER property is set to\
    \ 0 to prevent the link color from showing around the borders of the image.\n\
    \    d. The HREF property is set to a null value (#) so that no page is loaded\
    \ if the visitor clicks on the graphic. If desired, this value can be changed\
    \ to point to any Web page.\n2. The visitor moves the mouse on top of the image.\
    \ A mouseover event is generated in the browser's memory. The anchor tag handles\
    \ the mouseover event by sending a single line of JavaScript code to the browser.\
    \ That line of code instructs the browser to find the image `beethovenon.jpg`\
    \ located in a folder called images in the same location as the current document.\
    \ Depending on the size of the image and the speed of the connection, retrieving\
    \ the image may take seconds or minutes.\n3. The browser loads `beethovenon.jpg`\
    \ into its memory and assigns it to replace the image file currently assigned\
    \ to the SRC property of the image object beethoven loaded in the current document.\n\
    4. The browser displays the new image file in the same location as the old one.\
    \ The image swap on rollover is accomplished.\n\nA Simple Rollover\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_75_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_75_1.png)\n\
    \n## Creating a More Effective Rollover by Preloading Images\n\n64\n\nThe technique\
    \ described is simple and easy to understand. Unfortunately, it produces an unacceptable\
    \ delay in retrieving and displaying the second image. Listing 4.3 corrects the\
    \ problem by preloading the image files. Read the comments in the code to understand\
    \ how it works.\n\n```html\n<html>\n<head>\n<title>Rollover Beethoven</title>\n\
    <script type='text/javascript'>\n/* Creates blank image objects in the browser's\
    \ memory \n   and assigns them to the variables listed here */\nvar theOffImage\
    \ = new Image;\nvar theOnImage = new Image;\ntheOffImage.src = \"images/beethovenoff.jpg\"\
    ;\ntheOnImage.src = \"images/beethovenon.jpg\";\n\nfunction rollOn(imagename){\n\
    \    document[imagename].src = theOnImage.src;\n    /* A similar function to handle\
    \ the mouseout events */\n}\nfunction rollOff(imagename){\n    document[imagename].src\
    \ = theOffImage.src;\n}\n</script>\n</head>\n<body bgcolor=\"white\">\n<div align=\"\
    center\">\n<hl>Rollover Beethoven</hl>\n<a href=\"#\" onmouseover=\"rollOn('beethoven')\"\
    \ onmouseout=\"rollOff('beethoven');\n<img src=\"images/beethovenoff.jpg\" width=\"\
    250\" height=\"70\" name=\"beethoven\" border=\"0\" alt=\"Picture of Beethoven\"\
    ></a>\n</div>\n</body>\n</html>\n```\n\nListing 4.3 New and Improved Rollover\
    \ Technique\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_76_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_76_1.png)\n\
    \n### How Does It Work?\n\n65\n\nBecause all the code in the HEAD part of the\
    \ web page loads before the body, all the image files listed here will begin loading\
    \ before anything appears on the screen. Listing 4.3 produces the following sequence\
    \ of events.\n\n1. The browser loads the HEAD portion of the HTML document into\
    \ its memory.\n2. The browser creates two blank image objects called `theOffImage`\
    \ and `theOnImage`.\n3. The browser fills the SRC properties of the new images\
    \ by retrieving graphics files found in the images folder, which is located in\
    \ the same folder as the current document. The image files are now located in\
    \ the browser's cache folder on the visitor's hard drive.\n4. The browser loads\
    \ the `rollOn()` and `rollOff()` functions into memory. These functions do nothing\
    \ until they are called.\n5. The browser loads the BODY section of the document.\
    \ An IMG tag in the HTML code causes an image to appear in the current document,\
    \ and the browser creates an image object called beethoven as one of an array\
    \ of objects in its internal map of the document.\n6. The visitor moves the mouse\
    \ on top of the image. A mouseover event is generated in the browser's memory.\n\
    7. The anchor tag handles the mouseover event by calling the function `rollOn()`\
    \ and passing the name of the image, beethoven, to the function.\n8. The `rollOn()`\
    \ function takes the name of the image beethoven and puts it into a variable called\
    \ `imagename`. It then finds the value of the SRC property of the image object\
    \ `theOnImage` (from step 3) and assigns it to replace the SRC property of the\
    \ beethoven image object. The image swap on rollover is accomplished.\n9. The\
    \ visitor moves the mouse outside the image, and the function `rollOff()` swaps\
    \ the image back to the original.\n\nThis technique is more complex but much more\
    \ effective because there is no image swap delay. The technique is also flexible\
    \ enough to be used with multiple image rollovers on a single page.\n\n☆WARNING\
    \ Take some extra time to study the steps and concepts in Listing 4.3 before proceeding.\
    \ When you're learning to program, diligence at the beginning pays off in less\
    \ time spent debugging code later.\n\n☆TIP Dealing with Old Browsers\n\nA few\
    \ Web visitors use browsers that do not recognize the Image object as a part of\
    \ their document object models. To avoid generating errors when your page loads\
    \ in these early browsers, you may wish to include a conditional statement to\
    \ test for the presence of the `document.images` array. This array exists only\
    \ in the memory of browsers that support the Image object. The next examples show\
    \ how to implement this.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_77_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_77_1.png)\n\
    \nChapter Four Image Swapping\n\n## Creating Multiplelover Images\n\nListing 4.4\
    \ creates a single Web page with four images, each of which displays an image\
    \ on rollover. Notice that the `rollOn()` and `rollOff()` functions have been\
    \ replaced with a single `swapImage()` function.\n\n```html\n<html>\n<head>\n\
    <title>Rollover Composers</title>\n<script type='text/javascript'>\n/* Creates\
    \ blank image objects in the browser's memory \n   and assigns them to the variables\
    \ listed here */\nvar greatcomposersON = new Image;\nvar bachON = new Image;\n\
    var mozartON = new Image;\nvar beethovenON = new Image;\nvar greatcomposersOFF\
    \ = new Image;\nvar bachOFF = new Image;\nvar mozartOFF = new Image;\nvar beethovenOFF\
    \ = new Image;\ngreatcomposersON.src = \"images/greatcomposerson.jpg\";\nbachON.src\
    \ = \"images/bachon.jpg\";\nmozartON.src = \"images/mozarton.jpg\";\nbeethovenON.src\
    \ = \"images/beethovenon.jpg\";\ngreatcomposersOFF.src = \"images/greatcomposersoff.jpg\"\
    ;\nbachOFF.src = \"images/bachoff.jpg\";\nmozartOFF.src = \"images/mozartoff.jpg\"\
    ;\nbeethovenOFF.src = \"images/beethovenoff.jpg\";\n\nfunction swapImage(version,\
    \ imagename){\n    if (document.images){\n        document[imagename].src = eval(imagename\
    \ + version + \".jpg\");\n    }\n}\n/* This function turns all images back to\
    \ their 'off' versions */\nfunction rollOffAll(){\n    swapImage('OFF','greatcomposers');\n\
    \    swapImage('OFF','bach');\n    swapImage('OFF','mozart');\n    swapImage('OFF','beethoven');\n\
    }\n</script>\n</head>\n<body bgcolor=\"white\">\n<div align=\"center\">\n<hl>Rollover\
    \ Composers</hl>\n<a href=\"#\" onmouseover=\"swapImage('ON','greatcomposers')\"\
    \ onmouseout=\"rollOffAll();\"\n<img src=\"images/greatcomposersoff.jpg\" width=\"\
    250\" height=\"70\" name=\"greatcomposers\"></a>\n<a href=\"#\" onmouseover=\"\
    swapImage('ON','bach')\" onmouseout=\"rollOffAll();\"\n<img src=\"images/bachoff.jpg\"\
    \ width=\"250\" height=\"70\" name=\"bach\"></a>\n<a href=\"#\" onmouseover=\"\
    swapImage('ON','mozart')\" onmouseout=\"rollOffAll();\"\n<img src=\"images/mozartoff.jpg\"\
    \ width=\"250\" height=\"70\" name=\"mozart\"></a>\n<a href=\"#\" onmouseover=\"\
    swapImage('ON','beethoven')\" onmouseout=\"rollOffAll();\"\n<img src=\"images/beethovenoff.jpg\"\
    \ width=\"250\" height=\"70\" name=\"beethoven\"></a>\n</div>\n</body>\n</html>\n\
    ```\n\nThis function takes two parameters, the version name (ON or OFF) and the\
    \ image name. This makes it possible to handle all image swapping with only this\
    \ one function.\n"
  mdcn: "\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_74_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_74_1.png)\n\
    \n## 创建简单的鼠标切换效果\n\n63\n\n要创建一个粗略的鼠标切换效果，只有当鼠标移动到图像上时，将'beethoven'图片的 SRC 属性更改另一个图像文件。遗憾的是，大多数浏览器创建的图像对象对鼠标事件没有响应。然而，由锚点标签（`<a></a>`）创建的链接对象对鼠标事件有响应。通过简单的链接包裹\
    \ IMG 标签，你可以绕过当前浏览器的局限性（参见列表 4.2）。\n\n```html\n<html\n<head>\n<title>Rollover\
    \ Beethoven</title>\n</head>\n<body bgcolor=\"white\">\n<div align=\"center\"\
    >\n<hl>Rollover Beethoven</hl>\n<a href=\"#\" onmouseover=\"document['beethoven'].src='images/beethovenon.jpg'\"\
    \ onmouseout=\"document['beethoven'].src='images/beethovenoff.jpg';\n<img src=\"\
    images/beethovenoff.jpg\" width=\"250\" height=\"70\" name=\"beethoven\" border=\"\
    0\" alt=\"Picture of Beethoven\"></a>\n</div>\n</body>\n</</html>\n```\n\n列表 4.2\
    \ 用带有鼠标事件处理程序的链接的 IMG 标签\n\n`border=\"0\"` 防止图像边框显示与页面上其他链接相同的颜色。锚点标签响应 mouseover\
    \ 和 mouseout 事件。\n\n### 它是如何工作的？\n\n列表 4.2 产生了以下顺序的事件。\n\n1. HTML 代码中的 IMG 标签导致在\
    \ Web 浏览器窗口显示的当前文档中出现一张图像。\n    a. IMG 标签中的 name 属性在浏览器内存中创建一个名为 beethoven 的图像对象，并具有指定的高度和宽度。\n\
    \    b. IMG 标签的 SRC 属性将图像文件 `beethovenoff.jpg` 分配给图像对象 beethoven 的 SRC 属性。然后图像显示在屏幕上。\n\
    \    c. BORDER 属性设置为 0，以防止链接颜色显示在图像边框周围。\n    d. HREF 属性设置为空值 (#)，这样如果访问者点击图形，则不会加载任何页面。如果需要，可以将此值更改为任何\
    \ Web 页面。\n2. 访问者将鼠标移动到图像上方。浏览器内存中产生一个 mouseover 事件。锚点标签通过向浏览器发送单行 JavaScript\
    \ 代码来处理 mouseover 事件。该代码指令浏览器在与当前文档相同位置的名为 images 的文件夹中寻找图像 `beethovenon.jpg`。根据图像的大小和连接速度，检索该图像可能需要几秒钟或几分钟。\n\
    3. 浏览器将 `beethovenon.jpg` 加载到其内存中，并将其分配以替换已加载到当前文档中、当前已分配给图像对象 beethoven 的 SRC\
    \ 属性的图像文件。\n4. 浏览器在与旧文件相同的位置显示新图像文件。鼠标切换图像切换完成。\n\n简单的鼠标切换\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_75_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_75_1.png)\n\
    \n## 通过预加载图像创建更有效的鼠标切换\n\n64\n\n所描述的技术简单易于理解。遗憾的是，它在检索和显示第二张图像时会产生不可接受的延迟。列表 4.3\
    \ 通过预加载图像文件解决了这个问题。阅读代码中的注释以理解它是如何工作的。\n\n```html\n<html\n<head>\n<title>Rollover\
    \ Beethoven</title>\n<script type='text/javascript'>\n/* 在浏览器内存中创建空白图像对象，\n  \
    \ 并将它们分配给这里列出的变量 */\nvar theOffImage = new Image;\nvar theOnImage = new Image;\n\
    theOffImage.src = \"images/beethovenoff.jpg\";\ntheOnImage.src = \"images/beethovenon.jpg\"\
    ;\n\nfunction rollOn(imagename){\n    document[imagename].src = theOnImage.src;\n\
    \    /* 另一个处理 mouseout 事件的类似函数 */\n}\nfunction rollOff(imagename){\n    document[imagename].src\
    \ = theOffImage.src;\n}\n</script>\n</head>\n<body bgcolor=\"white\">\n<div align=\"\
    center\">\n<hl>Rollover Beethoven</hl>\n<a href=\"#\" onmouseover=\"rollOn('beethoven')\"\
    \ onmouseout=\"rollOff('beethoven');\n<img src=\"images/beethovenoff.jpg\" width=\"\
    250\" height=\"70\" name=\"beethoven\" border=\"0\" alt=\"Picture of Beethoven\"\
    ></a>\n</div>\n</body>\n</</html>\n```\n\n列表 4.3 新且改进的鼠标切换技术\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_76_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_76_1.png)\n\
    \n### 它是如何工作的？\n\n65\n\n因为网页页面 HEAD 部分的所有代码在 body 之前加载，这里列出的所有图像将在显示任何内容之前开始加载。列表\
    \ 4.3 产生了以下事件序列。\n\n1. 浏览器将 HTML 文档的 HEAD 部分加载到内存中。\n2. 浏览器创建两个名为 `theOffImage`\
    \ 和 `theOnImage` 的空白图像对象。\n3. 浏览器通过检索位于当前文档相同文件夹下的 images 图形文件来填充新图像的 SRC 属性。这些图像文件现在位于访问者的硬盘缓存中。\n\
    4. 浏览器将 `rollOn()` 和 `rollOff()` 函数加载到内存中。这些函数在被调用之前什么都不做。\n5. 浏览器加载文档的 BODY 部分。HTML\
    \ 代码中的 IMG 标签导致当前文档中出现一个图像，浏览器在文档内部映射中创建一个名为 beethoven 的图像对象。\n6. 访问者将鼠标移动到图像上方。浏览器内存中产生一个\
    \ mouseover 事件。\n7. 锚点标签通过调用函数 `rollOn()` 并传递图像名称 `beethoven` 来处理 mouseover 事件。\n\
    8. `rollOn()` 函数获取图像名称 `beethoven` 并将其放入变量 `imagename`。然后找到图像对象 `theOnImage` 的\
    \ SRC 属性值，并将其分配以替换 beethoven 对象的 SRC 属性。鼠标切换完成。\n9. 访问者将鼠标移出图像，函数 `rollOff()`\
    \ 将图像切回原始状态。\n\n这种技术更复杂，但由于没有切换延迟而有效得多。该技术也足够灵活，适用于单个页面上的多个鼠标切换。\n\n☆警告 花些额外时间研究列表\
