    \nWorking with Check Boxes \n\n49 \n\nHow Does It Work? \n\nListing 3.5 generates\
    \ the following sequence of events. \n\n1. The browser loads the HEAD into memory\
    \ and displays the BODY. \n\n2. The BODY contains a FORM object named survey.\
    \ FORM objects automati¬ \n\ncally create an array of all form elements enclosed\
    \ by the <f orm> and \n\n</form> tags. The names of the four check boxes in this\
    \ form are degree \n\nfollowed by a number from 0 to 3. The number can be stored\
    \ in a variable. \n\nIn this way, you can use an expression such as document.\
    \ survey \n\n\\[ ' degree ' +x \\] . checked to determine whether a given box\
    \ is checked. \n\nNone of the boxes here is checked by default. \n\n3. The visitor\
    \ clicks the Send Survey button to submit the form, and the button \n\ngenerates\
    \ a submit event. The FORM object handles the event by calling the \n\nvalidate(\
    \ ) function. If validate! ) returns true, the form content is \n\nsent by e-mail.\
    \ \n\n4. The validate ( ) function begins by creating a variable called degree\
    \ and \n\nsetting its initial value to an empty text string. Then an array is\
    \ created to \n\nhold the four comments associated with the four degrees. \n\n\
    5. The validate ( ) function loops through a series of statements four times \n\
    \nwhile an index variable (i) counts from 0 to 3. On each pass through the \n\n\
    loop, an element of the form survey is examined to see whether it is \n\nchecked.\
    \ That element is determined by combining degree with the cur¬ \n\nrent value\
    \ of the index variable (i). \n\n6. If a checked box is found, its value is stored\
    \ in the degree variable. If multi¬ \n\nple degrees are checked, each one will\
    \ replace the previous contents of the \n\ndegree variable. \n\n7. The index variable\
    \ of this loop (i) is used to determine which element of the \n\ncomments array\
    \ should be displayed in the feedback field. \n\n8. The next section of the code\
    \ contains conditional structures to test the value \n\nof the degree variable.\
    \ \n\n9. If none of the boxes is checked, it means that degree is empty. An alert\
    \ box \n\nappears with instructions. After the visitor dismisses the alert box,\
    \ a value of \n\nfalse is returned to the FORM object that called the function,\
    \ and that pre¬ \n\nvents the e-mail from being sent. \n\n10. If degree contains\
    \ anything other than an empty text string, a value of \n\ntrue is returned to\
    \ the FORM object, which then sends the form contents \n\nvia e-mail to the address\
    \ listed in the ACTION property. \n\n11. The recipient receives an e-mail message\
    \ containing a name-value pair for \n\neach checkbox."
