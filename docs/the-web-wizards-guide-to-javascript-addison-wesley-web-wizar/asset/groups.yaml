    <head>

    <title>Automatic Field Formatting</title>

    <script type="text/javascript" language="JavaScript">

    function formatNumber(){

    var theNumbersOnly = "";

    var theChar = "";

    var input = document.phoneform.phone.value;

    for (i = 0; i < input.length; i++){

    theChar = input.substring(i,i+1);

    if (theChar >= "0" && theChar <= "9"){

    theNumbersOnly = "" + theNumbersOnly + theChar;

    }

    }

    if (theNumbersOnly.length < 10 ){

    alert("You must enter 10 numbers.");

    document.phoneform.phone.focus();

    }else{

    var areaCode = theNumbersOnly.substring(0,3);

    var exchange = theNumbersOnly.substring(3,6);

    var extension = theNumbersOnly.substring(6,10);

    var newNumber = "(" + areaCode + ") ";

    newNumber += exchange + "-" + extension;

    document.phoneform.phone.value = newNumber;

    }

    }

    </script>

    </head>

    <body bgcolor="WHITE">

    <h1>Basic Automatic Formatting</h1>

    <p>Type 10 numbers in any form and then press the tab key.<br>

    Your number will be formatted for the U.S. telephone system.<br>

    </p>

    <form name="phoneform"><input type="text" name="phone" value="(555) 555-1234"
    size="20" onchange="formatNumber();"></form>

    </body>

    </html>

