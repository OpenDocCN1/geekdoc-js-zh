    \ Image 对象的浏览器内存中。接下来的示例显示了如何实现这一点。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_77_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_77_1.png)\n\
    \n第四章图像切换\n\n创建多个切换图像\n\n列表 4.4 创建了一个包含四张图像的单个 Web 页面，每张图像在鼠标切换时都会显示。注意 `rollOn()`\
    \ 和 `rollOff()` 函数被替换为了单一的 `swapImage()` 函数。\n\n```html\n<html\n<head>\n<title>Rollover\
    \ Composers</title>\n<script type='text/javascript'>\n/* 在浏览器内存中创建空白图像对象，\n  \
    \ 并将它们分配给这里列出的变量 */\nvar greatcomposersON = new Image;\nvar bachON = new Image;\n\
    var mozartON = new Image;\nvar beethovenON = new Image;\nvar greatcomposersOFF\
    \ = new Image;\nvar bachOFF = new Image;\nvar mozartOFF = new Image;\nvar beethovenOFF\
