    \n5. The length property can be used to find the number of elements in an array\
    \ or the number of characters in a string object.\n\n7. Consistent, sequential\
    \ naming of objects makes it possible to use loops effectively.\n\n9. A SELECT\
    \ object on a form has one or more OPTIONS associated with it. The selectedIndex\
    \ property contains the number of the option selected by the visitor.\n\n1. The\
    \ first form always requires the literal name of the image object. The second\
    \ form lets you use expressions or variables to refer to an image object. The\
    \ second form is more useful when you're creating functions that will be used\
    \ with multiple images on a page.\n\n3. Trick question. HTML is not case-sensitive\
    \ today, but you should get in the habit of using all lowercase letters to make\
    \ your code more compatible with the new version of strict HTML 4.01 known as\
    \ XHTML. All the following links work equally well today, but the third version\
    \ is preferred. JavaScript, however, is case-sensitive, so in this example, swapImage()\
    \ should always have an uppercase.\n<A href=\"url\" onMouseOver=\"swapImage();\"\
    >link</A>\n<A href=\"url\" ONMOUSEOVER=\"swapImage();\">link</A>\n<a href=\"url\"\
    \ onmouseover=\"swapImage();link</a>\n\n5. The Image object is supported in all\
    \ browsers that store their images in the document.images array. Test for the\
