    ></p>\n\n</form>\n\n</body>\n\n</html>\n\nListing 3.6 Selection Menu Form Validation\
    \ with Navigation Button\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_63_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_63_1.png)\n\
    \nWorking with Selection Menus\n\n52 Chapter Three ★ Working with Forms\n\n★ shortcut\
    \ Put It in the Library\n\nBe sure to add the getSelectValue() and showSelectValue()\
    \ functions from listing 3.6 to your mylibrary.js file. These functions control\
    \ the value chosen on a SELECT menu in a FORM. Since you will create many pages\
    \ with SELECT menus, it makes sense to store these functions in mylibrary.js rather\
    \ than copy them into every page.\n\nSelection Menu Form Validation - Netscape\n\
    \nVisitor Site Preference Survey\nName: Thomas Dolby\nChoose your favorite Web\
    \ site:\nbeatnik.com\nShow Author's Choice\nGo There!\nSend Survey\n\nFigure 3.5\
    \ Output of Listing 3.6\n\nHow Does It Work?\n\nListing 3.6 generates the following\
    \ sequence of events.\n\n1. The browser loads the page and creates the necessary\
    \ FORM and SELECT objects in memory. A global variable called chosenSite is created\
    \ with an initial value of an empty text string. The three functions in the HEAD\
    \ will use this variable, so it must be placed outside any of the functions.\n\
    \n2. The visitor chooses a command from the SELECT menu labeled \"Select a site\"\
    \ and then clicks the Go There! button. That button is an input of type \"button\"\
    \ with an onclick handler that calls the openSite() function.\n\n3. The openSite()\
    \ function, in the HEAD, calls the getSelectValue() function and passes the name\
    \ of the form (survey) and the name of the select menu (websites) to determine\
    \ the visitor's choice.\n\n4. The getSelectValue() function creates a temporary\
    \ variable called theMenu and fills it with the websites SELECT object on the\
    \ survey form. It does this by exploiting the built-in arrays of the document\
    \ and form objects. The document contains an array of all objects on the page.\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_64_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_64_1.png)\n\
    \nWorking with Selection Menus\n\n53\n\nThe FORM survey is one such object. The\
    \ expression document[\"survey\"] represents the FORM. In turn, the form creates\
    \ another array of all its objects. The SELECT websites is one such object. Because\
    \ survey and websites are stored in variables, the expression document[name][selectname]\
    \ properly references the SELECT object called websites. A second variable, selecteditem,\
    \ is then filled with the selectedindex of theMenu. The selectedindex refers to\
    \ the number of the chosen command on the SELECT menu. The numbering begins with\
    \ 0. The value of the chosen command on theMenu can then be determined with the\
    \ expression theMenu.options[item].value. This works because the SELECT object\
    \ contains an array of its OPTIONS. In this case, option number 1 (the second\
    \ option when numbered from 0) is javascript.com with a value of http://www.javascript.com.\
    \ The expression document.survey.websites.options[1].value would return the value\
    \ http://www.javascript.com. Because the first part of that expression is assigned\
    \ to the variable theMenu, it is possible to use the expression theMenu.options[1].value\
    \ instead.\n\n5. The global variable chosenSite now contains the value of the\
    \ command chosen by the visitor. The getSelectValue() function is finished with\
    \ its work, so openSite() function continues to the next line.\n\n6. The variable\
    \ chosenSite is tested to see whether it is empty. If it is, the visitor receives\
    \ an alert box with instructions to select something.\n\n7. If the visitor has\
    \ selected something, the browser loads the site chosen by the visitor. The code\
    \ window, location.href=URL loads the given URL into the href property of the\
    \ location object of the current window. Because the location object stores the\
    \ URL of the loaded document in its HREF property, changing the value of the HREF\
    \ property causes the browser to load the new page.\n\n8. The visitor becomes\
    \ overwhelmed with curiosity about which site is preferred. The visitor clicks\
    \ the button labeled Author's Choice, which calls showSelectValue() and passes\
    \ three parameters: the name of the FORM (survey), the name of the SELECT (websites),\
    \ and the value to display (http://www.beatnik.com).\n\n9. The showSelectValue()\
    \ function steps through the elements of the array in the SELECT until it finds\
    \ a value that matches the desired value. Then it sets the selectedindex of the\
    \ SELECT to the number of the option with the matching value. The displayed text\
    \ of the SELECT changes to match the new value.\n\nWorking with Selection Menus\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_65_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_65_1.png)\n\
    \nCreating a Self-Grading Test\n\n54 Chapter Three Working with Forms\n\nWARNING\
    \ Global Versus Variables\n\nWhen you create a variable within a function, the\
    \ variable is local to the function. This means that other functions in the script\
    \ will not understand any references to the local variable. If a variable must\
    \ be shared among functions, be sure to declare it outside any particular function,\
    \ as shown in Listing 3.6 with the global variable chosenSite.\n\nCreating a Self-Grading\
    \ Test\n\nEducators often use forms to create self-grading tests for students\
    \ to use on the Web. Sometimes the content of the form is not submitted; instead,\
    \ feedback is presented to the student to aid in studying the. Listing 3.7 presents\
    \ a simple, three-question test on music history.\n\n<html><head><title>Selection\
    \ Menu Diagnostic Quiz</title>\n<script type=\"text/javascript\" language=\"JavaScript\"\
    \ src=\"mylibrary.js\"></script>\n<script type=\"text/javascript\" language=\"\
    JavaScript\">\n<!--\nvar correctAnswers = new Array();\ncorrectAnswers[1] = \"\
    1750\";\ncorrectAnswers[2] = \"1791\";\ncorrectAnswers[3] = \"1827\";\nfunction\
    \ checkAnswers(){\n  for (i=1; i<4; i++){\n    deathDate = getSelectValue(\"quiz\"\
    ,\"q\" + i);\n    if (deathDate == correctAnswers[i]){\n      score++;\n    }\n\
    \  }\n  document.quiz.scorefield.value = score;\n}\n//-->\n</script>\n\n</head>\n\
    \n<body bgcolor=\"white\">\n\n<h1>Diagnostic Quiz on Composer Dates</h1>\n\n<form\
    \ name=\"quiz\">\n\n<h4>Question 1: What is Bach's year of death?</h4>\n\n55\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_66_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_66_1.png)\n\
    \nCreating a Self-Grading Test\n\n<select name=\"q1\">\n<option selected>Select\
    \ your answer</option>\n  <option value=\"1670\">1670</option>\n  <option value=\"\
    1685\">1685</option>\n  <option value=\"1695\">1695</option>\n  <option value=\"\
    1725\">1725</option>\n  <option value=\"1750\">1750</option>\n</select>\n\n<h4>Question\
    \ 2: What is Mozart's year of death?</h4>\n\n<select name=\"q2\">\n<option selected>Select\
    \ your answer</option>\n  <option value=\"1750\">1750</option>\n  <option value=\"\
    1765\">1765</option>\n  <option value=\"1773\">1773</option>\n  <option value=\"\
    1791\">1791</option>\n  <option value=\"1812\">1812</option>\n</select>\n\n<h4>Question\
    \ 3: What is Beethoven's year of death?</h4>\n\n<select name=\"q3\">\n<option\
    \ selected>Select your answer</option>\n  <option value=\"1770\">1770</option>\n\
    \  <option value=\"1791\">1791</option>\n  <option value=\"1827\">1827</option>\n\
    \  <option value=\"1833\">1833</option>\n  <option value=\"1841\">1841</option>\n\
    </select>\n\n<hr>\n\n<p><input type=\"button\" value=\"Check Answers\" onclick=\"\
    checkAnswers();\"></p>\n\n<p>Your score is:<input type=\"text\" name=\"scorefield\"\
    \ value=\"\" size=\"10\"></p>\n\n</form>\n\n</body>\n\n</html>\n\nListing 3.7\
    \ Quiz with Selection Menus\n"
