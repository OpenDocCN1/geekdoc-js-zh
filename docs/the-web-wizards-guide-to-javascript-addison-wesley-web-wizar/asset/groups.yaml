    ## PREFACE


    ### About Addison-Wesley''s Web Wizard Series


    The beauty of the Web is that, with a little effort, anyone can harness its power
    to create sophisticated Web sites. Addison-Wesley''s Web Wizard Series helps students
    master the Web by presenting a concise introduction to one important Internet
    topic or technology in each book. The books start from square one and assume no
    prior experience with the technology being covered. Mastering the Web doesn''t
    come with a wave of a magic wand; but by studying these accessible, highly visual
    textbooks, readers will be well on their way.


    The series is written by instructors who are familiar with the challenges beginners
    face when learning the material. To this end, the Web Wizard books offer more
    than a cookbook approach: they emphasize principles and offer clear explanations,
    giving the reader a strong foundation of knowledge on which to build.


    Numerous features highlight important points and aid in learning:


    - Tips — important points to keep in mind

    - Shortcuts — timesaving ideas

    - Warnings — things to watch out for

    - Do It Yourself — activities to try now

    - Review questions and hands-on exercises

    - Online references — Web sites to visit to obtain more information


    Supplementary materials for the books, including updates, additional examples,
    and source code, are available at http://www.aw.com/webwizard. Also available
    for qualified instructors adopting a book from the series are instructor''s manuals,
    sample tests, and solutions. Please contact your Addison-Wesley sales representative
    for the instructor resources password.


    ### About This Book


    When I first began developing Web sites way back in 1994, I was grateful to be
    able to display a simple graphic or add bold to my text. The Web was a static
    medium in those days. Interactivity was limited to the links you created to navigate
    from one page to another. Web designers had little control over how their content
    would appear. Media elements other than text and simple graphics were rarely used
    due to bandwidth limitations and lack of standards. The most popular background
    color for a Web page back then was gray. My, how things have changed.


    Today''s Web sites are highly interactive and rich in media content. JavaScript
    plays a large role in the development of contemporary Web sites because it offers
    a relatively easy way to interact with the objects that Web browsers create. As
    a result, Web designers no longer view their creations as a series of static pages
    linked together by navigation icons. Instead, Web designers create environments
    where visitors interact with text, graphics, animation, sound, and video. The
    visitor is an active participant rather than a passive recipient.


    This book will introduce you to the fundamentals of the JavaScript language and
    help you learn to visualize the interaction of objects in a Web browser environment.
    A solid grounding in HTML 4 is recommended before studying JavaScript. The concepts
    and skills you learn here will take your HTML code to the next level. You will
    learn to manipulate the content of your Web page both before and after the page
    loads. You will learn how to gather information from your visitors to customize
    their Web browsing experiences. You will gain a solid understanding of a language
    that has changed the nature of the Internet.


    ### Acknowledgments


    No book is produced by one person. I would like to extend my thanks to my editors
    Elinor Actipis and Susan Hartman Sullivan for their encouragement—and for the
    wonderful chocolate desserts. Thanks go to my industrious and alert copy editor,
    Betsy Hardinger, and to Gillian Hall for her creative typesetting. Many thanks
    go to Diane Freed for her humor and diligence in keeping everyone on schedule.


    In addition, the book reviewers offered many excellent ideas and changes, which
    truly made this a better book. These reviewers include


    - John Hollenbeck, San Francisco State University

    - Donna Occhifinto, County College of Morris

    - Carla Gesell-Streeter, Cincinnati State Technical and Community College

    - Robert N. Barger, University of Notre Dame

    - James A. White, Ph.D., University of South Florida

    - Tammy Ashley, New Hampshire Community Technical College-Manchester

    - Don Anderson, Chadron State College.


    My apologies to my pet corgi, Clara Belle, whose frisbee unfortunately were neglected
    during the writing of this book. Most of all, I extend my thanks and admiration
    to my best friend and wife, Kathleen Schietroma, whose persistence and focus continue
    to inspire me.


    Steven Estrella

    September 2001


