    ## Creating a Countdown Page


    10. The various fields in the clock form are filled with calculated values based
    on the variable seconds. For example, the minutes face field will contain the
    number of minutes, which is equal to the seconds divided by 60.


    The workdays field value is calculated by multiplying the number of days by 0.65
    because approximately 65% of the remaining days until retirement will be spent
    working.


    11. A variable called `birthdatedisplay` is created to hold the formatted text
    string containing the visitor''s birthdate. A variable called `retirementdisplay`
    is created to hold the formatted text string containing the visitor''s retirement
    date. The strings are created using the technique explained in Listing 6.4.


    12. The values in the text fields `birthdate` and `retirementdate` are then changed
    to the values in the variables `birthdatedisplay` and `retirementdate`.


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_115_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_115_1.png)


    JavaScript contains a set of core objects, including the `Date` object, that exist
    independently of any host environment such as a Web browser. To use the `Date`
    object, you first create an instance of it and then apply a method to obtain date
    and time information.


    A quick way to create a simple clock is to use the `toLocaleString()` method of
    the `Date` object, which returns the date and time formatted as text.


    - To create customized presentations of the time, you obtain the current hour,
    minute, and seconds using methods of the `Date` object. These values can be stored
    as variables and then concatenated (joined together) to create a string of text
    to express the time.


    - It is possible to vary the information displayed on your Web page according
    to the time or date. If code exists in the `HEAD` to test for the time of day,
    you can create variable content in the `BODY` using the `document.write()` method.


    JavaScript''s `Math` object is a built-in calculator. To perform math operations
    on information obtained from text fields, you first convert the values to numbers
    using the `parseInt()` or `parseFloat()` function.


    ## Online References


    Netscape has a complete reference for JavaScript 1.5 on its developer Web site.
    The section in Chapter One on the Date object has complete documentation,

    http://developer.netscape.com/docs/manuals/js/core/jsref15/contents.html


    W3Schools.com offers tutorials and code samples to help you learn about using
    dates and times in JavaScript.

    http://www.w3schools.com/js/js_datetime.asp


    Earthweb offers a nice set of Time/Date samples and templates.

    http://webdeveloper.earthweb.com/pagedev/websjs/timedate


    ## A Review Questions


    1. What is a host environment?

    2. What date is used as the basis for all dates and times in JavaScript?

    3. What value is returned by the `getTime()` method of the Date object?

    4. Name three methods of the Date object that return zero-based data.


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_116_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_116_1.png)


    ## Hands-On Exercises


    5. Which method of the Date object returns the date and time formatted as a text
    string to local standards?

    6. What are the differences between the `setInterval()` and `setTimeout()` methods?

    7. Do JavaScript statements contained in a function in the `HEAD` automatically
    execute when the page loads?

    8. When is it possible to include scripts in the `BODY`?

    9. If `now.getDay()` returns the number 6, to what day of the week does it refer?

    10. If `now.getMonth()` returns the number 8, to what month does it refer?


    ### Hands-On Exercises


    1. Create a Web page with a customized clock to display the date and time in whatever
    form you choose.

    2. Create a page that greets your visitor with a time-appropriate message.

    3. Create a page to give your visitor a horoscope.

    4. Create a page to count the seconds, minutes, hours, days, and years until some
    important event occurs. Choose any event you like.

    5. Create a page containing an e-mail form (see Chapter Three). In one of the
    fields, update the number of seconds the visitor spent viewing the form.


