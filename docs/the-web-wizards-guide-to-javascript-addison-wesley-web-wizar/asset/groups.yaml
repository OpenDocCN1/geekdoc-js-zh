- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_147_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_147_1.png)\n\
    \n## Window Methods to Enhance the HTML Builder\n\n136\n\nChapter Eight Working\
    \ with Windows and Frames\n\nA new window with all attributes included* would\
    \ require the following statement. The example includes carriage returns for readability.\
    \ You should be sure to type it all on one line with no spaces.\n\n```javascript\n\
    window.open(\"somepage.html\",\"myWin\",\"width=750, height=550,left=100,screenX=100,top=50,screenY=50,\
    \ copyhistory=0,directories=1,location=1,menubar=0, resizable=1,scrollbars=1,\
    \ status=0,toolbar=1); \n```\n\nThis example creates a window with all features\
    \ enabled (values set to 1) except copyhistory, menubar, and status (values set\
    \ to 0). Both left/top and screenX/screenY attributes are included to provide\
    \ compatibility with all versions of Netscape 4 and Internet Explorer 4 and later\
    \ browsers.\n\nThe only problem with creating a window this way is that you can't\
    \ easily close it by using a script. Fortunately, the open() method returns a\
    \ value to identify the new window. By setting up a global variable, you can store\
    \ the value and later refer to it to close the window.\n\n```javascript\nvar Wl\
    \ = null;\nWl = window.open(\"foo.html\",\"myW\",\"width=750,height=550,scrollbars=1);\n\
    ```\n\nLater, when you wish to close the window, use the close() method of the\
    \ window object and reset the variable to null.\n\n```javascript\nWl.close();\n\
    Wl = null;\n```\n\nOne of the tedious aspects of creating windows is typing the\
    \ long list of features and deciding which features are needed. Listing 8.1 solves\
    \ that problem by using a function to create a new window called myWindow. The\
    \ function takes seven parameters. The first two are the URL and the target name.\
    \ The next four specify the size and location of the new window. The final parameter\
    \ contains the feature set.\n\nThere are three prebuilt feature sets. The variable\
    \ nofeatures contains a list of all the common features, with the values set to\
    \ 0 to disable them. The variable basicfeatures enables scrollbars, makes the\
    \ window resizable, and shows the menu bar (Microsoft Windows only). The variable\
    \ morefeatures enables all the other features. The variable dimensions contains\
    \ a string specifying the desired width and height. The variable placement contains\
    \ a long string to indicate the left and top coordinates in a way that works on\
    \ all current browsers.\n\nA switch control structure lets you choose the desired\
    \ feature set. If you pass the value none as the seventh parameter, the nofeatures\
    \ set is used. If you pass the value basic, the basicfeatures set is used. If\
    \ you pass the value full, both the basicfeatures and the morefeatures sets are\
    \ used. If the value is none of these, the JavaScript console (see Chapter Two)\
    \ value is assumed to be a valid text string to assist you in debugging a custom\
    \ feature set in the script.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_148_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_148_1.png)\n\
    \n137\n\nUsing Window Methods to Enhance the HTML Builder\n\nTo begin experimenting\
    \ with code for managing windows, create the page from Listing 8.1 and load it\
    \ into a Netscape browser version 4.7 or later.\n\n**☆ tip Put It in the Library**\n\
    Always remember to place reusable scripts in your mylibrary.js file. In Listing\
    \ 8.1, the openWin() function will be useful whenever you wish to create a new\
    \ window and control its size, position, and features.\n\n**☆ TIP Using Switch**\n\
    When you want a script to do something depending on the value of a variable, use\
    \ a switch control structure. It tests the value of a variable or other expression\
    \ to see whether it matches any of several possible values. When a match is found,\
    \ specific statements execute; then the break; statement tells the switch control\
    \ structure not to bother testing the other possible cases. If none of the cases\
    \ is a match, the statements under the word default will execute. The switch control\
    \ structure works in Netscape and Internet Explorer versions 4 and later.\n\n\
    Figure 8.1 shows the output of Listing 8.1.\n\nFigure 8.1 Output of Listing 8.1:\
    \ HTML Builder Page with Window Generator - Netscape 6.0\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_149_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_149_1.png)\n\
    \nUsing Window Methods to Enhance the HTML Builder\n\n138\n\nChapter Eight Working\
    \ with Windows and Frames\n\nHow Does It Work?\n\n1. The HEAD portion of the page\
    \ loads into memory. The mylibrary.js file loads, a global variable called myWindow\
    \ is created, and functions are loaded into memory, ready to be called.\n\n2.\
    \ The BODY loads and displays a form with fields. The visitor types a title into\
    \ the first field and clicks the Build button. The buildPage() function (in mylibrary.js)\
    \ is called.\n\n3. The visitor clicks the Show My button, which calls showPage().\n\
    \n4. The showPage() function takes the content of the field and stores it in the\
    \ variable displaycode. The openWin() is called. The first parameter is empty\
    \ because the window you wish to display is not. The second parameter is an arbitrary\
    \ name, popup.\n\n5. The openWin() function receives the seven parameters and\
    \ stores them in the variable params. The new window is created.\n\n6. The content\
    \ of params indicate that the three prebuilt feature sets are defined: nofeatures,\
    \ basicfeatures, and morefeatures.\n\n7. A switch control structure chooses the\
    \ feature set based on the seventh parameter. In this case, the value basic was\
    \ passed, so the basicfeatures are added to params.\n\n8. The dimensions and placement\
    \ variables are added to params. The resulting text string containing: scrollbars=1,resizable=1,menubar=1,width=750,height=550,left=100,screenX=100,screenY=50\n\
    \n9. The open() method returns a value to identify the new window. That value\
    \ is placed in the global variable Wl. The new window displays the standard HTML\
    \ page.\n\n10. The JavaScript console value is assumed to be a valid text string\
    \ after the open() is finished.\n\n11. The focus() method of the window object\
    \ is applied to the new window to ensure it is not hidden behind any windows.\n\
    \n12. The close() method of the document object is applied to the document to\
    \ indicate that no further content will be written.\n\n13. The visitor stares\
    \ appreciatively at the new window, moves it to one side of the screen, clicks\
    \ back on the main window, and clicks the button Close New Window. The closeWin()\
    \ function is called. It checks to see whether the value in Wl is anything other\
    \ than null. If it is, calls the close() method of the window object. Because\
    \ that closes the window, it then makes sense to set the value of Wl to null to\
    \ indicate that the window no longer exists.\n\n14. The visitor notices some sample\
    \ code in the final field. The sample code includes a call to openWin(). The visitor\
    \ changes the width and height values in the third and fourth parameters of the\
    \ openWin() call and changes the seventh parameter from basic to full.\n\n15.\
    \ The visitor clicks the button Execute My Code, which calls the runCode() function.\n\
    \n16. The runCode() function takes the text the visitor altered in the field and\
    \ assigns it to a variable called thecode. The eval() function then evaluates\
    \ the contents of thecode. Because the contents contain valid JavaScript statements,\
    \ the code is executed and a new window appears on the screen with the altered\
    \ feature set and dimensions.\n\nAdditional Methods of the Window Object\n\nThroughout\
    \ this book you have made liberal use of the window.alert() method to display\
    \ alert boxes. You have also used the window.prompt() method to obtain text input\
    \ from your visitors. Another useful method of the window object is the confirm()\
    \ method, which displays a dialog box containing any text you pass to it. If the\
    \ visitor clicks OK, the confirm() method returns the value true. If the visitor\
    \ clicks Cancel, the value returned is false. The returned value can be placed\
    \ in a variable and tested, as shown in Listing 8.2.\n"
  mdcn: "\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_147_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_147_1.png)\n\
    \n## 用于增强 HTML 生成器的窗口方法\n\n136\n\n第八章 窗口与框架的操作\n\n创建一个包含所有属性的新窗口需要以下语句。示例中为了可读性包含了换行符。你应该确保将其全部写在一行，且没有空格。\n\
    \n```javascript\nwindow.open(\"somepage.html\",\"myWin\",\"width=750, height=550,left=100,screenX=100,top=50,screenY=50,\
    \ copyhistory=0,directories=1,location=1,menubar=0, resizable=1,scrollbars=1,\
    \ status=0,toolbar=1); \n```\n\n此示例创建了一个启用了所有功能（值设置为1）的窗口，但 copyhistory、menubar\
    \ 和 status 除外（值设置为0）。包含了 left/top 和 screenX/screenY 属性，以兼容所有版本的 Netscape 4 以及\
    \ Internet Explorer 4 及以后的浏览器。\n\n通过这种方式创建窗口的唯一问题是，你无法通过脚本轻松关闭它。幸运的是，`open()`\
    \ 方法返回一个值来标识新窗口。通过设置一个全局变量，你可以存储该值并在稍后引用它来关闭窗口。\n\n```javascript\nvar Wl = null;\n\
    Wl = window.open(\"foo.html\",\"myW\",\"width=750,height=550,scrollbars=1);\n\
    ```\n\n稍后当你想关闭窗口时，使用窗口对象的 `close()` 方法并将变量重置为 `null`。\n\n```javascript\nWl.close();\n\
    Wl = null;\n```\n\n创建窗口繁琐方面之一是输入长功能列表并决定需要哪些功能。列表 8.1 通过使用函数创建一个名为 `myWindow`\
    \ 的新窗口解决了这个问题。该函数接受七个参数。前两个是 URL 和目标名称。接下来的四个指定新窗口的大小和位置。最后一个参数包含功能集。\n\n有三个预构建的功能集。变量\
    \ `nofeatures` 包含所有常用列表，值设置为 0 以禁用它们。变量 `basicfeatures` 启用滚动条、使窗口可调整大小并显示菜单栏（仅限\
    \ Microsoft Windows）。变量 `morefeatures` 启用所有其他功能。变量 `dimensions` 包含一个指定所需宽度高度的字符串。变量\
    \ `placement` 包含一个长字符串，以一种适用于所有当前浏览器的方式指示左侧顶部坐标。\n\n`switch` 控制结构允许你选择所需的功能集。如果你将值\
    \ `none` 作为第七个参数传递，则将使用 `nofeatures` 集。如果你传递值 `basic`，则将使用 `basicfeatures` 集。如果你传递值\
    \ `full`，则将同时使用 `basicfeatures` 和 `morefeatures` 集。如果值不是其中任何一个，则假设 JavaScript\
    \ 控制台（见第二章）的值为有效文本字符串，以帮助你调试脚本中的自定义功能集。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_148_0.png)![](img/7705a881c3cbfe9039b9b12a38fc1c6_148_1.png)\n\
    \n137\n\n使用窗口方法增强 HTML 生成器\n\n要开始实验管理窗口的代码，请从列表 8.1 创建页面并将其加载到 Netscape 4.7 或更高版本的浏览器中。\n\
    \n**☆ 提示 放入库中**\n始终将可重用的脚本放在你的 `mylibrary.js` 文件中。在列表 8.1 中，当你想创建一个新窗口并控制其大小、位置和功能时，`openWin()`\
    \ 函数将非常有用。\n\n**☆ 提示 使用 switch**\n当你想让脚本根据变量的值执行操作时，请使用 `switch` 控制结构。它测试变量或其他表达式的值，以检查它是否匹配多个可能值之一。当找到匹配时，会执行特定的语句；然后\
    \ `break;` 语句告诉 `switch` 控制结构不要测试其他可能的情况。如果没有一个情况匹配，将执行 `default` 关键字下的语句。`switch`\
    \ 控制结构在 Netscape 和 Internet Explorer 4 及更高版本中均有效。\n\n图 8.1 显示了列表 8.1 的输出。\n\n\
    图 8.1 列表 8.1 输出：带有窗口生成器的 HTML 生成器页面 - Netscape 6.0\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_149_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_149_1.png)\n\
    \n使用窗口方法增强 HTML 生成器\n\n138\n\n第八章 窗口与框架的操作\n\n它是如何工作的？\n\n1. 页面的 `HEAD` 部分加载到内存中。`mylibrary.js`\
    \ 文件加载，创建一个名为 `myWindow` 的全局变量，函数被加载到内存中准备好调用。\n\n2. `BODY` 加载并显示带有字段的表单。访问者在第一个字段中输入标题并点击“Build”按钮。调用位于\
    \ `mylibrary.js` 中的 `buildPage()` 函数。\n\n3. 访问者点击“Show My”按钮，这调用了 `showPage()`。\n\
    \n4. `showPage()` 函数获取字段的内容并将其存储在变量 `displaycode` 中。调用 `openWin()`。第一个参数为空，因为你想要显示的窗口不是空的。第二个参数是任意名称\
    \ `popup`。\n\n5. `openWin()` 函数接收七个参数并将它们存储在变量 `params` 中。创建新窗口。\n\n6. `params`\
    \ 的内容指示定义了三个预构建的功能集：`nofeatures`、`basicfeatures` 和 `morefeatures`。\n\n7. `switch`\
    \ 控制结构根据第七个参数选择功能集。在这种情况下，传递了值 `basic`，因此 `basicfeatures` 被添加到 `params` 中。\n\n\
    8. `dimensions` 和 `placement` 变量被添加到 `params` 中。生成的字符串包含：`scrollbars=1,resizable=1,menubar=1,width=750,height=550,left=100,screenX=100,screenY=50`。\n\
    \n9. `open()` 方法返回一个值来标识新窗口。该值被放在全局变量 `Wl` 中。新窗口显示标准的 HTML 页面。\n\n10. 在 `open()`\
    \ 完成后，假设 JavaScript 控制台值为有效文本字符串。\n\n11. 将窗口对象的 `focus()` 方法应用于新窗口，以确保它不会隐藏在任何窗口之后。\n\
    \n12. 将文档对象的 `close()` 方法应用于文档，以指示不再有进一步内容被写入。\n\n13. 访问者赞赏地盯着新窗口，将其移动到屏幕一侧，回到主窗口，并点击“Close\
    \ New Window”按钮。调用 `closeWin()` 函数。它检查 `Wl` 中的值是否为 `null`。如果是，则调用窗口对象的 `close()`\
    \ 方法。因为这关闭了窗口，所以将 `Wl` 的值设置为 `null` 是合有意义的，表示窗口不再存在。\n\n14. 访问者在最后一个字段中注意到一些示例代码。示例代码包含对\
    \ `openWin()` 的调用。访问者更改了 `openWin()` 调用中第三、第四参数的宽度高度值，并将第七个参数从 `basic` 改为 `full`。\n\
    \n15. 访问者点击“Execute My Code”按钮，这调用了 `runCode()` 函数。\n\n16. `runCode()` 函数获取访问者在字段中修改的文本并将其分配给变量\
    \ `thecode`。然后 `eval()` 函数评估 `thecode` 的内容。由于内容包含有效的 JavaScript 语句，代码被执行，屏幕上会显示一个带有更改后的功能集和尺寸的新窗口。\n\
    \n窗口对象的其他方法\n\n在本书中，你大量使用了 `window.alert()` 方法来显示警告框。你还使用了 `window.prompt()` 方法来获取访问者的文本输入。窗口对象的另一个有用方法是\
    \ `confirm()` 方法，它显示一个包含你传递给它的任何文本的对话框。如果访问者点击 OK，`confirm()` 返回值 `true`。如果访问者点击\
    \ Cancel，返回的值为 `false`。返回的值可以放在变量中进行测试，如列表 8.2 所示。\n\n"
