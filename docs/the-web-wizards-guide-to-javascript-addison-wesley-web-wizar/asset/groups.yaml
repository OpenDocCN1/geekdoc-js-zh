    ## form Validation


    Imagine you''re shopping at k9treats.com (not a real company). You''ve just clicked
    the button to add a box of liver treats to your online shopping cart. You then
    click the Check Out button. The next screen probably displays an HTML form that
    asks for your name, address, and credit card information. Suppose you type your
    name and address but neglect to type your credit card information. When you click
    Continue, text on the screen reminds you that you must enter a credit card number
    before proceeding.


    The reminder screen was the result of a JavaScript technique known as form validation.
    When you clicked Continue, a JavaScript function was called. The function detected
    that there was no valid entry in the credit card field and created a page to remind
    you to enter the required information.


    ### Working with Text Fields


    Text fields within a form are created with the HTML `<input type="text">` tag
    (for text input that fits on a single line) or the HTML `<textarea></textarea>`
    tag (for text input that requires multiple lines). You can assign names and values
    to both tags using the NAME and VALUE properties.


    This means that when a visitor types something into a text field on your page,
    you can query the input field by name and find out the value the visitor typed.
    In many cases, you may wish to create a form with a required field. It is useful
    to be able to determine whether the visitor entered information into a required
    field before the form gets sent to you via e-mail. Listing 3.1 demonstrates a
    simple form validation procedure to make sure the visitor types something into
    the visitor text field before the form is mailed.


    ```html

    <html><head><title>Basic Form Validation</title>

    <script type="text/javascript" language="JavaScript">

    <! //

    function validate(){

    if (document.survey.visitor.value){

    alert("You must enter your name before submitting this form.");

    document.survey.visitor.focus();

    return false;

    }else{

    return true;

    }

    //-->

    </script>

    </head>

    <body bgcolor="white">

    <hl>Visitor Color Preference Survey</hl>

    <form action="mailto:jstext@stevenestrella.com"

    method="POST" enctype="text/plain" name="survey"

    onsubmit="return validate();">

    ```


    When the form is submitted, the validate() function is called. It returns a value
    of true or false. If true, then the information on the form is sent using the
    mailto method defined in the action attribute. If false, no mail is sent.


    <p>Name (required): <input type="text" name="visitor" value="" size="40"></p>


    <p>Favorite Color: <input type="text" name="color" value="" size="30"></p>

    <p>What are your thoughts on using this survey?<br>

    <textarea name="thoughts" rows="5" cols="50" value=""></textarea></p>

    <input type="submit" value="Send Survey"></p>

    </form>

    </body>

    </html>

    ```


    Listing 3.1 Simple Form Validation of a Text Field


    ### How Does It Work?


    The code in Listing 3.1 produces the following sequence of events.


    1. The browser loads the HEAD section, which contains the JavaScript function
    validate(). That function is now in memory and ready to do its work when called.

    2. The browser loads the BODY section and displays a level-1 heading `<hl>`.

    3. A FORM object with the name survey begins to appear on the screen. The ACTION
    property is set to post the contents of the form, encoded as plain text, to an
    e-mail address.

    4. Within the form, the visitor text input field appears with an instruction to
    the visitor to type a name. The color text input field appears with an instruction
    to the visitor to type a favorite color. The size properties of the two fields
    are set to different values because names of people are longer than the names
    of colors.

    5. A TEXTAREA field is displayed that allows the user to type multiple lines of
    text to provide feedback on the survey.

    6. An INPUT tag, of type submit, creates a Submit button. The value of Send Survey
    is the actual text displayed on the button.

    7. Having typed nothing, the visitor clicks the Send Survey button to submit the
    form. The button generates a submit event.

    8. The FORM object''s onSubmit handler sends a line of code to the JavaScript
    interpreter in the browser. That line of code calls the validate() function and
    returns a value of true or false to the FORM object. If the value returned is
    false, the FORM object does not send the e-mail.

    9. The validate() function begins with an if-else structure to check the value
    of the visitor field on the survey form. The code is translated as "There is not
    value in the visitor field." In this case, that statement evaluates as true. An
    alert box appears with instructions. After the visitor dismisses the alert box,
    the pointer is placed conveniently on the visitor field using the focus() method.
    Finally, a value of false is returned to the FORM object that preventing the e-mail
    from being sent.

    10. The visitor types a name in the visitor field and clicks Send Survey again.
    This time the validate() function detects a value in the visitor field and returns
    a value of true. The FORM object then sends its contents to the e-mail address
    listed in its ACTION property. The form is shown in Figure 3.1.


