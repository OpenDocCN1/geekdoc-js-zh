    </body>\n</html>\n```\n\n列表 2.1 一序列 JavaScript 语句\nWeb 浏览器将完全按照你的指令执行，没有任何争议。\n\
    图 2.1 列表 2.1 的输出\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_31_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_31_1.png)\n\
    \n循环：重复执行任务\n20\n\n第二章 使用 JavaScript 增强网页\n\n## 循环：重复执行任务\n\n你是否注意到洗发水瓶上的这些指令？“揉搓、冲洗、重复。”如果你是一台计算机，你永远不会离开淋间，因为这些指令创建了一个无限循环。为了避免这个问题，JavaScript\
    \ 中的循环结构必须更精确一些。\n\nJavaScript 中最常见的循环形式是 `for` 循环。其格式如下：\n\n```javascript\nfor\
    \ (初始化表达式; 测试条件; 更新表达式){\n    这里是 JavaScript 语句。\n}\n```\n\n`for` 循环中的初始化表达式由设置初始值的变量组成。程序员通常使用\
    \ `i` 作为索引变量，但任何变量名都可以。列表 2.2 为索引变量 `i` 分配初始值5。分号（`;`）分隔初始化表达式和测试条件。测试条件决定循环何时结束。例如，为了避免终生洗头，你可以修改洗发水瓶上的指令为：“揉搓、冲洗、重复。直到头发干净。”\n\
    \n在列表 2.2 中，测试条件规定只有当 `i` 大于1（`i > 1`）时循环才会继续。如果 `i` 为1，循环停止。更新表达式指定了每次循环结束后如何更改索引变量。在列表\
    \ 2.2 中，递减运算符（`--`）在每次循环后将 `i` 的值减1。\n\n大括号（`{}`）内部有两个语句。第一个语句将 `i` 的当前值与字符串组合，并将结果写入浏览器中的当前\
