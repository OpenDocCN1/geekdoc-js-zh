- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_19_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_19_1.png)\n\
    \n# Fundamental Concepts of JavaScript\n8\n\n## Chapter One JavaScript Basics\n\
    \n```html\n<html><head><title>sunflower image swap</title></head> \n<body bgcolor=\"\
    white\">\n<a href=\"#\" onmouseover=\"document.sunflowerphoto.src = 'sunflowers.jpg';\"\
    \ \nonmouseout=\"document.sunflowerphoto.src = 'sunflowerlady.jpg';\n<img src=\"\
    sunflowerlady.jpg\" width=\"300\" height=\"200\" \nname=\"sunflowerphoto\" border=\"\
    0\"></a>\n</body>\n</html>\n```\n\nListing 1.2 Image Swapping\n\n☆TIP JavaScript\
    \ portions of the code listings in this book appear in blue.\n\n☆ warning Be Sensitive!\n\
    \nWhen you learned HTML, you were probably relieved to discover that HTML tags\
    \ are not case-sensitive. <IMG> and <img> are the same in HTML. JavaScript, however,\
    \ is case-sensitive. In the current example, \"sunflowerphoto\" and \"SunflowerPhoto\"\
    \ are not equivalent. As you name objects and refer to them in JavaScript code,\
    \ be aware of uppercase and lowercase letters.\n\n### Variables\n\nIn real life,\
    \ we deal with variables all the time. At a diner, several regular customers may\
    \ order \"the usual.\" The food server, being familiar with each patron, assigns\
    \ the value \"ham and cheese\" to the variable \"the usual\" for one patron, and\
    \ assigns the value \"veggie burger\" to the variable \"the usual\" for another\
    \ patron. In this case, the scope of the variable is local. It is valid only at\
    \ a particular diner. If the patron goes to a new diner and requests \"the usual,\"\
    \ the food server will not understand. A global variable, on the other hand, would\
    \ be understood in every restaurant in the world. An example of a global variable\
    \ is \"the check\"; every food server understands that each customer must pay\
    \ for the food.\n\nWhen a variable contains a value, you can assign that value\
    \ to the property of an object. The following code illustrates the creation and\
    \ use of a variable to assign the color teal to the Beetle instance of the car\
    \ object. Notice that the var keyword is used to initialize (that is, to create)\
    \ a variable.\n\n```javascript\nvar myFavoriteColor = \"teal\";\nBeetle.color\
    \ = myFavoriteColor;\n```\n\nSimilarly, in JavaScript, the value for a property\
    \ such as bgColor can be placed in a variable:\n\n```javascript\nvar myBackgroundColor\
    \ = \"silver\";\nwindow.document.bgColor = myBackgroundColor;\n```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_20_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_20_1.png)\n\
    \nFundamental Concepts of JavaScript\n\n### Arrays\n\nAn array is an ordered collection\
    \ of data. Each element of an array is a variable and can hold data of any type.\
    \ You usually use an array to hold related data. An example is an array that represents\
    \ the nooks in a spice rack. In this case, each element of the array represents\
    \ a nook. Each nook can contain any spice you might like.\n\n```javascript\nvar\
    \ spicerack = new Array();\nspicerack[0] = \"oregano\";\nspicerack[1] = \"salt\"\
    ;\nspicerack[2] = \"pepper\";\n```\n\nThe numbering of the array elements always\
    \ begins at 0, but sometimes programmers do not populate the [0] element so that\
    \ numbering can begin more naturally at 1. You can reassign the value of any element\
    \ in the array by using a statement such as this one:\n\n```javascript\nspicerack[0]\
    \ = \"garlic\";\n```\n\nArrays are useful because you can change the value of\
    \ each array element using a programming loop. You will learn about loops in Chapter\
    \ Two.\n\n### Methods\n\nIn real life, objects sometimes have actions associated\
    \ with them. In JavaScript, an object's associated actions are called methods.\
    \ Each generic object has methods associated with it. All instances of the car\
    \ object, for example, have an associated method called brake that slows the car.\n\
    \nLike variables, methods can take values. For example, the brake method could\
    \ take values of fast or slow depending on how much force the driver applied to\
    \ the pedal. In JavaScript, parentheses are verbs in the JavaScript used to contain\
    \ the values associated with a method. Methods associated with an object are inherited\
    \ by any instance of that object. A Beetle is an instance of a generic car object.\n\
    \nTherefore, the Beetle can use the brake method:\n\n```javascript\nBeetle.brake(\"\
    fast\");\nBeetle.brake(\"slow\");\n```\n\nOften, methods are triggered by events.\
    \ Suppose our Beetle car object encounters the blowout event. The Beetle must\
    \ handle this event by performing the brake method. In this example, the blowout\
    \ event is handled by the onBlowOut event handler, which responds to the event\
    \ by initiating the brake method:\n\n```javascript\nonBlowOut = Beetle.brake('fast');\n\
    ```\n\nSimilarly, Web browser objects have many methods. One of the simplest methods\
    \ is the write method of the document object. This method is used to write text\
    \ to the current document as the page loads:\n\n```javascript\ndocument.write(\"\
    Greetings JavaScript Students!\");\n```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_21_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_21_1.png)\n\
    \nFundamental Concepts of JavaScript\n10\n\nChapter One JavaScript Basics\n\n\
    ### Assignment Operators\n\nTo assign a value to a variable, you use a simple\
    \ assignment operator such as the equal sign (\"=\"):\n\n```javascript\nvar myAge\
    \ = 39;\nvar myName = \"Steven\";\n```\n\nAfter a value has been assigned, you\
    \ can alter it using compound operators such as the add-by-value (+=), subtract-by-value\
    \ (-=), multiply-by-value (*=), and divide-by-value (/=) operators:\n\n```javascript\n\
    var myAge = 39;\nmyAge += 4; // Result is 43\nmyAge -= 4; // Result is 35\nmyAge\
    \ *= 4; // Result is 156\nmyAge /= 4; // Result is 9.75\n```\n\nComparison Operators\
    \ allow you to compare values. The result of a comparison is a Boolean value (true\
    \ or false). One of the most common errors in JavaScript is to use the assignment\
    \ operator (=) when you really want the equality operator (==). Comparison operators\
    \ let you compare values. The result of a comparison is a Boolean value (true\
    \ or false). One of the most common errors in JavaScript is to use the assignment\
    \ operator (=) when you really want the equality operator (==).\n\nComparison\
    \ operators include:\n- == (equal to)\n- != (not equal to)\n- > (greater than)\n\
    - < (less than)\n- >= (greater than or equal to)\n- <= (less than or equal to)\n\
    \nExample of comparison:\n\n```javascript\nvar myAge = 39;\nmyAge == 39; // Result\
    \ is true\nmyAge != 40; // Result is true\nmyAge > 39;  // Result is false\nmyAge\
    \ < 40;  // Result is true\nmyAge >= 39; // Result is true\nmyAge <= 38; // Result\
    \ is false\n```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_22_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_22_1.png)\n\
    \nFundamental Concepts of JavaScript\n11\n\n### Functions\n\nA function is a group\
    \ of statements that performs a designated task. Functions are often stored in\
    \ the HEAD section of an HTML document and do their work when invoked (that is,\
    \ called) by other JavaScript statements.\n\n```javascript\nfunction doSomething(){\n\
    var theVisitor = document.myform.visitor.value;\nwindow.alert(\"Is this OK, \"\
    \ + theVisitor + \"?\");\n}\n```\n\nHere is a simple example. The HTML code in\
    \ Listing 1.3 creates a form that contains a place for the visitor to type a name\
    \ along with a button to click (see Figure 1.4). When the button is clicked, the\
    \ doSomething function is called and an alert box containing the visitor's name\
    \ is displayed. The alert box is generated by the alert method of the window object.\
    \ The alert method takes a value consisting of a string of text plus whatever\
    \ value was typed into the username field on the page plus a question mark. The\
    \ result is displayed as an alert box.\n\n^TIP You will learn how to write code\
    \ in detail in Chapter Two, but you may wish to try typing Listing 1.3 just to\
    \ get your feet wet. Type carefully (spelling counts), or the code won't work.\n"
  mdcn: "\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_19_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_19_1.png)\n\
    \n# JavaScript 基础概念\n8\n\n## 第一章 JavaScript 基础\n\n```html\n<html><head><title>向日葵图片切换</title></head>\
    \ \n<body bgcolor=\"white\">\n<a href=\"#\" onmouseover=\"document.sunflowerphoto.src\
    \ = 'sunflowers.jpg';\" \nonmouseout=\"document.sunflowerphoto.src = 'sunflowerlady.jpg';\n\
    <img src=\"sunflowerlady.jpg\" width=\"300\" height=\"200\" \nname=\"sunflowerphoto\"\
    \ border=\"0\"></a>\n</body>\n</html>\n```\n\nListing 列表 1.2 图片切换\n\n☆提示 本书中代码列表中的\
    \ JavaScript 部分显示为蓝色。\n\n☆警告 注意敏感！\n\n当你学习 HTML 时，可能发现 HTML 标签不区分大小写而松了一口气。在 HTML\
    \ 中，`<IMG>` 和 `<img>` 是相同的。然而，JavaScript 是区分大小写的。在当前的示例中，“sunflowerphoto\" 和 \"\
    SunflowerPhoto\" 是不等价。在 JavaScript 代码中命名对象并引用它们时，请注意大写和小写字母。\n\n### 变量\n\n在现实生活中，我们一直都在处理变量。在餐馆里，几位常客可能会点“老样子式”。服务员熟悉每位顾客，会为其中一位顾客的变量\
    \ \"the usual\" 赋值值“火腿加奶士”，而为另一位顾客的变量 \"the usual\" 赋值值“蔬菜汉堡”。在这种情况下，变量的作用域是局部的。它只在特定的餐馆有效。如果顾客去了一家新餐馆并要求“老样子”，服务员将无法理解。相反，全局变量在世界上每家餐厅都能被理解。全局变量的一个例子是“账单”；每个服务员都理解每个顾客必须为食物付费。\n\
    \n当变量包含一个值时，你可以将该值赋值给对象的属性。以下代码说明了如何创建和使用变量将青色（teal）赋值给汽车对象的 Beetle 实例。注意使用 `var`\
    \ 关键字来初始化（即创建）变量。\n\n```javascript\nvar myFavoriteColor = \"teal\";\nBeetle.color\
    \ = myFavoriteColor;\n```\n\n同样，在 JavaScript 中，像 `bgColor` 这样的属性值可以放在变量中：\n\n\
    ```javascript\nvar myBackgroundColor = \"silver\";\nwindow.document.bgColor =\
    \ myBackgroundColor;\n```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_20_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_20_1.png)\n\
    \nJavaScript 基础概念\n\n### 数组\n\n数组是有序的数据集合。数组的每个元素都是变量，可以包含任何类型的数据。你通常使用数组来存放相关数据。例如，代表调料架上隔间的数组。在这种情况下，数组的每个元素代表一个隔间。每个间都可以包含你喜欢的任何香料。\n\
    \n```javascript\nvar spicerack = new Array();\nspicerack[0] = \"oregano\";\nspicerack[1]\
    \ = \"salt\";\nspicerack[2] = \"pepper\";\n```\n\n数组元素的编号始终从 0 开始，但有时程序员不会填充 `[0]`\
    \ 元素，以便编号可以更自然地从 1 开始。你可以使用像下面这样的语句重新分配数组中任何元素的值：\n\n```javascript\nspicerack[0]\
    \ = \"garlic\";\n```\n\n数组非常有用，因为你可以使用编程循环更改每个数组元素的值。你将在第二章学习循环循环。\n\n### 方法\n\
    \n在现实生活中，对象有时会有与之关联的操作。在 JavaScript 中，与对象关联的操作被称为方法（methods）。每个通用对象都有与其关联的方法。例如，汽车对象的所有实例都有一个名为\
    \ `brake` 的关联方法，用于减慢汽车。\n\n像变量一样，方法可以接收值。例如，`brake` 方法可以根据驾驶员对踏板施加的力量大小接受快或慢的值。在\
    \ JavaScript 中，括号 `()` 是 JavaScript 中用于动词，用于包含与方法关联的值。与对象关联的方法由该对象的任何实例继承。Beetle\
    \ 是一个通用汽车对象的实例。\n\n因此，Beetle 可以 `brake` 方法：\n\n```javascript\nBeetle.brake(\"\
    fast\");\nBeetle.brake(\"slow\");\n```\n\n方法通常由事件触发。假设我们的 Beetle 汽车对象遇到了爆胎事件（blowout）。Beetle\
    \ 必须通过执行 `brake` 方法来处理此事件。在这个示例中，爆胎事件由 `onBlowOut` 事件处理器处理，它通过启动 `brake` 方法来响应事件：\n\
    \n```javascript\nonBlowOut = Beetle.brake('fast');\n```\n\n同样， 浏览器对象有很多方法。简单的方法之一是\
    \ `document` 对象的 `write` 方法。该方法用于在页面加载时向当前写入文本：\n\n```javascript\ndocument.write(\"\
    Greetings JavaScript Students!\");\n```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_21_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_21_1)\n\
    \nJavaScript 基础概念\n10\n\n### 赋值运算符\n\n要给变量赋值一个值，你使用简单的赋值运算符，如 `=`：\n\n```javascript\n\
    var myAge = 39;\nvar myName = \"Steven\";\n```\n\n赋值一个值后，你可以使用复合运算符更改它，例如加赋值 `+=`、减法赋值\
    \ `-=`、乘法赋值 `*=` 和除法赋值 `/=` 运算符：\n\n```javascript\nvar myAge = 39;\nmyAge += 4;\
    \ // 结果为 43\nmyAge -= 4; // 结果为 35\nmyAge *= 4; // 结果为 156\nmyAge /= 4; // 结果为\
    \ 39\n\n\n\n比较运算符允许你比较值。比较的结果是一个布尔值（true 或 false）。JavaScript 中最常见的错误是使用了赋值运算符\
    \ `=`，而你想要的是相等运算符 `==`。\n\n比较运算符包括：\n- ==（等于）\n- !=（不等于）\n- >（大于）\n- <（小于）\n-\
    \ >=（大于或等于）\n- <=（小于或等于）\n\n比较示例：\n\n```javascript\nvar myAge = 39;\nmyAge ==\
