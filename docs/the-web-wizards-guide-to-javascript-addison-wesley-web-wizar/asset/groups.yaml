    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_30_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_30_1.png)\n\
    \n序列：按给定顺序执行任务\n19\n\nSCRIPT 部分包含四个 JavaScript 语句。第一个使用 `var` 初始化了新变量 `myTextContainer`。然后，赋值运算符（=`）将文本\
    \ \"A Web browser \" 赋值给变量 `myTextContainer`。在接下来两行中，累加运算符（`+=`）向变量 `myTextContainer`\
