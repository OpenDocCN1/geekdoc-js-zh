    \ function.\n5. The SetCookie() function is called to create a cookie with the\
    \ name set to the content of variable country and the value set to the content\
    \ of variable itemqty.\n6. A variable called feedback is created to hold a string\
    \ of text to inform user that his order has been added to the shopping cart.\n\
