- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_166_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_166_1.png)\n\
    \n## Combining JavaScript with Client-Side Image Mapping\n\n155\n\n**Click the\
    \ states to view the facts.** \n\n<form name=\"rockies\">\n  <img src=\"images/rockymts.gif\"\
    \ width=\"135\" height=\"90\" border=\"0\" usemap=\"#RockiesMap\">\n  <p><textarea\
    \ name=\"facts\" cols=\"50\" rows=\"5\"></textarea></p>\n</form>\n\n<map name=\"\
    RockiesMap\">\n  The image map areas are defined by coordinates.\n  <area shape=\"\
    POLY\" coords=\"69,83,118,85,121,50,73,45\" href=\"javascript:showStateFacts(0);\"\
    \ alt=\"Wyoming\" title=\"Wyoming\" onmouseover=\"showStateName(0);\">\n  <area\
    \ shape=\"POLY\" coords=\"38,1,27,64,68,71,70,48,57,43,45,5\" href=\"javascript:showStateFacts(1);\"\
    \ alt=\"Idaho\" title=\"Idaho\" onmouseover=\"showStateName(1);\">\n  - When the\
    \ mouse rolls over a defined area, the onmouseover handler passes a number to\
    \ the showStateName() function.\n  <area shape=\"POLY\" coords=\"120,47,121,10,46,1,59,44\"\
    \ href=\"javascript:showStateFacts(2);\" alt=\"Montana\" title=\"Montana\" onmouseover=\"\
    showStateName(2);\">\n</map>\n\nListing 9.2 JavaScript with Client-Side Image\
    \ Map\n\nFigure 9.2 shows the output of Listing 9.2.\n\nWhen the mouse is clicked\
    \ on a defined area, the href attribute sends a pseudo-URL that passes a number\
    \ to the showStateFacts() function.\n\n| Northern Rocky Mountain States |\n| :---\
    \ |\n| Roll your mouse over the map to view state names. |\n| Click the states\
    \ to view the facts. |\n| Wyoming |\n| Population: 455,975 |\n| Capital: Cheyenne\
    \ |\n| Entered the union in 1890 as the 44th state. |\n| javascript:showStateFacts(0);\
    \ |\n\nFigure 9.2 Output of Listing 9.2\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_167_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_167_1.png)\n\
    \n156\n\nChapter Nine Applied Web Programming Techniques\n\nSometimes it's convenient\
    \ to trigger a JavaScript function or statement when the visitor clicks on a defined\
    \ area in an image map. There are two ways to do this: the onclick technique and\
    \ the pseudo-URL technique.\n\nThe onclick technique adds an onclick handler to\
    \ the AREA tag and returns false to prevent the browser from attempting to load\
    \ the page in the HREF property.\n\n`<area shape=\"RECT\" coords=\"0,0,200,300\"\
    \ href=\"alternatecontent.html\" onclick=\"myEffect(); return false\">`\n\nRecent\
    \ browsers (version 4.0 and later) recognize the onclick event handler in AREA\
    \ tags. A visitor clicks the link, the myEffect() function executes, and false\
    \ is returned. As a result, the link to alternatecontent.html does not execute,\
    \ and the visitor remains on the page. But if the same code loads in an older\
    \ browser, the onclick handler is ignored and alternatecontent.html loads when\
    \ the link is clicked.\n\nThe second technique uses a pseudo-URL. A pseudo-URL\
    \ has the protocol `javascript:` in place of the expected http: and tells the\
    \ browser to execute the statement that follows as JavaScript code. The advantages\
    \ of this technique are its brevity and its compatibility with older browsers.\n\
    \n`<area shape=\"RECT\" coords=\"0, 0,200,300\" href=\"javascript:myEffect();\"\
    >`\n\nOne small disadvantage of the pseudo-URL technique is that the text `javascript:myEffect();`\
    \ is displayed in the status bar of the window unless you change the status bar\
    \ text in the myEffect() function. Also, if the function being called returns\
    \ a value, an error may be generated. To instruct the browser to ignore the returned\
    \ value, include the void operator:\n\n`\"javascript:void myEffect();\"`\n\nIn\
    \ Listing 9.2, the void operator is not needed because the function does not return\
    \ a value.\n\n### How Does It Work?\n\n1. When the HEAD loads, several arrays\
    \ are created to hold the factual information about each state.\n2. The function\
    \ showStateName() is created to display the name of a state.\n3. The function\
    \ showStateFacts() is created to display a formatted string about the state.\n\
    4. The BODY section of the page displays an image of the Northern Rocky Mountain\
    \ states and an empty text field. The USEMAP property of the IMG tag connects\
    \ the image to the MAP labeled Rockies further down the page.\n5. The MAP called\
    \ Rockies defines six areas using coordinates that define the polygons surrounding\
    \ each state.\n6. Each AREA tag contains an onmouseover handler that calls showStateName()\
    \ and passes a number. The showStateName() function looks up the number in the\
    \ array of state names and displays the appropriate state in the text field.\n\
    7. Each AREA tag also contains an HREF property that calls a pseudo-URL. This\
    \ consists of javascript: and a call to showStateFacts() function. A number is\
    \ passed to the function.\n8. The showStateFacts() function takes the number it\
    \ is passed and looks up the necessary information in the various arrays containing\
    \ information about each state. The information is assembled into a text string\
    \ and displayed in the field.\n\n### Detecting the Visitor's Browser and Platform\n\
    \nAbout 25% of the work that goes into Web development involves testing on different\
    \ browsers and platforms and then creating workarounds for any compatibility issues.\
    \ Some sites even have multiple versions of pages to accommodate different browsers.\
    \ To determine which page to load, they first sniff (identify) the visitor's browser.\
    \ Listing 9.3 presents a simple browser sniffer script along with a field and\
    \ a button. When the button is clicked, the field displays information about the\
    \ visitor's browser and computer platform.\n\n`<head><title>browser test</title><script\
    \ type=\"text/javascript\" language=\"JavaScript\">\n/* Add this browser detection\
    \ code to library.js */\nvar theApp = navigator.appName.toLowerCase();\n/* variables\
    \ for the two major browsers in existence today. */\nvar isIE = (UA.indexOf('msie')\
    \ >= 0) ? true : false;\nvar isNS = (UA.indexOf('mozilla') >= 0) ? true : false;\n\
    /* 'compatible' text string exists only in non-Netscape browsers */\nif (UA.indexOf('compatible')>0){\n\
    \  isNS = false;\n}`\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_168_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_168_1.png)\n\
    \n158\n\nChapter Nine Applied Web Programming Techniques\n\n/* platform */\nvar\
    \ thePlatform = navigator.platform.toLowerCase();\nvar isMAC = (UA.indexOf('mac')\
    \ >= 0) ? true : false;\nvar isWIN = (UA.indexOf('win') >= 0) ? true : false;\n\
    /* Most UNIX users use X-Windows so this detects UNIX most of the time. */\nvar\
    \ isUNIX = (UA.indexOf('x11') >= 0) ? true : false;\n\n/* browser version */\n\
    var version = navigator.appVersion;\nvar isMajor = parseInt(version);\n/* Internet\
    \ Explorer version 5 on the Mac reports itself as version 4. This code corrects\
    \ the problem. */\nif(isIE && isMAC) {\n  if(UA.indexOf(\"msie 5\")) {\n    isMajor\
    \ = 5;\n    var stringLoc = UA.indexOf(\"msie 5\");\n    version = UA.substring(stringLoc\
    \ + 5, stringLoc + 8);\n  }\n}\n/* Netscape 6 reports itself as version 5 on all\
    \ platforms. This code corrects the problem. */\nif(isNS && isMajor>4) {\n  if(UA.indexOf(\"\
    netscape6\")) {\n    isMajor = 6;\n    var stringLoc = UA.indexOf(\"netscape6\"\
    );\n    version = UA.substring(stringLoc + 10, stringLoc + 14);\n  }\n}\nvar isMinor\
    \ = parseFloat(version);\nvar obsolete = (document.getElementById) ? false : true;\n\
    /* End of browser detection code */\n\nThe variable obsolete is a handy way to\
    \ encourage visitors to upgrade to a modern browser.\n\nfunction showInfo(){\n\
    \  var temp=\"\";\n  temp += \"User Agent: \" + UA + \"\\n\";\n  temp += \"Platform:\
    \ \" + thePlatform + \"\\n\";\n  temp += \"Macintosh: \" + isMAC + \"\\n\";\n\
    \  temp += \"Windows: \" + isWIN + \"\\n\";\n  temp += \"Application: \" + theApp\
    \ + \"\\n\";\n  temp += \"Version: \" + version + \"\\n\";\n  temp += \"Netscape:\
    \ \" + isNS + \"\\n\";\n}\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_169_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_169_1.png)\n"
  mdcn: "\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_166_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_166_1.png)\n\
    \n## 将 JavaScript 与客户端图像映射结合\n\n155\n\n**点击州查看详情。**\n\n<form name=\"rockies\"\
    >\n  <img src=\"images/rockymts.gif\" width=\"135\" height=\"90\" border=\"0\"\
    \ usemap=\"#Rockies\">\n  <p><textarea name=\"facts\" cols=\"50\" rows=\"\"></textarea></p>\n\
    </form>\n\n<map name=\"Rockies\">\n  图像映射区域通过坐标定义。\n  <area shape=\"POLY\" coords=\"\
    69,83,118,85,121,50,73,45\" href=\"javascript:showStateFacts(0);\" alt=\"怀俄明州\"\
    \ title=\"怀俄明州\" onmouseover=\"showStateName(0);\">\n  <area shape=\"POLY\" coords=\"\
    38,1,27,64,68,71,70,48,57,43,5\" href=\"javascript:showStateFacts(1);\" alt=\"\
    爱达荷州\" title=\"爱达荷州\" onmouseover=\"showStateName(1);\">- 当鼠标悬停在定义区域时，onmouseover处理器会将一个数字传递给\
    \ `showStateName()` 函数。\n  <area shape=\"POLY\" coords=\"120,47,121,10,46,1,59,44\"\
    \ href=\"javascript:showStateFacts(2);\" alt=\"蒙大拿州\" title=\"蒙大拿州\" onmouseover=\"\
    showStateName(2);\">\n</map>\n\n9.2 JavaScript 与客户端图像映射\n\n图 9.2 显示了 9.2 的输出。\n\
    当点击定义区域时，href 属性发送一个伪 URL 给 `showStateFacts()` 函数。\n\n| 洛基山脉各州 |\n| :--- |\n|\
    \ 将鼠标悬停在地图上查看州名。 |\n| 点击州查看详情。 |\n| 怀俄明州 |\n| 人口：455,975 |\n| 首府：切雅西 |\n| 1890\
    \ 年加入联邦的第 44 州。 |\n| javascript:showStateFacts(0); |\n\n图 9.2 9.2 的输出\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_167_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_167_1.png)\n\
    \n156\n\n第九章 Web 编程技术\n\n有时当用户点击图像映射中的定义区域时触发 JavaScript 函数或语句非常方便。实现这一点有两种：`onclick`\
    \ 技术和伪 URL 技术。\n\n`onclick` 技术在 `AREA` 标签上添加一个 `onclick` 处理器并返回 `false`，以防止浏览器加载\
    \ `HREF` 属性中的页面。\n`<area shape=\"RECT\" coords=\"0,0,200,300\" href=\"alternatecontent.html\"\
    \ onclick=\"myEffect(); return false\">`\n\n现代浏览器（4.0 及以后）识别 `AREA` 标签中的 `onclick`\
    \ 事件。用户点击链接时，`myEffect()` 函数执行并返回 `false`。结果是，链接 `alternatecontent.html` 不执行，用户留在页面上。\n\
    \n第二种技术使用伪 URL。伪 URL 使用 `javascript:` 协议代替预期的 `http:`，并告诉浏览器执行后面的 JavaScript 代码。这种技术的优点是简洁且对旧版浏览器兼容性良好。\n\
    `<area shape=\"RECT\" coords=\"0,0,200,300\" href=\"javascript:myEffect();\">`\n\
    \n伪 URL 技术的一个小缺点是 `javascript:myEffect();` 会显示在窗口的状态栏中。此外，如果调用的函数返回值，可能会产生错误。为了指示浏览器忽略返回的值，可以使用\
    \ `void` 操作符：\n`\"javascript:void myEffect();\"`\n\n在 9.2 中，不需要 `void` 操作符，因为函数没有返回值。\n\
    \n### 它是如何工作的？\n\n1. 当 `HEAD` 加载时，会创建几个数组来存储每个州的详细信息。\n2. 创建 `showStateName()`\
    \ 函数来显示州名。\n3. 创建 `showStateFacts()` 函数来显示关于州的格式化字符串。\n4. 页面的 `BODY` 部分显示洛基山脉各州的图像和一个空白字段。`IMG`\
    \ 标签的 `USEMAP` 属性将图像连接到页面下方名为 `Rockies` 的 `MAP`。\n5. `MAP` Rockies 使用坐标定义了每个州的多边形。\n\
    6. 每个 `AREA` 标签包含一个 `onmouseover` 处理器，调用 `showStateName()` 并传递一个数字。`showStateName()`\
    \ 函数在州名数组中查找该数字并将州显示在字段中。\n7. 每个 `AREA` 标签还包含一个调用伪 URL 的 `HREF` 属性。这向 `showStateFacts()`\
    \ 函数传递一个数字。`showStateFacts()` 函数接收传递的数字，并在包含州信息的数组中查找必要信息。信息组合成文本字符串显示在字段中。\n\n\
    ### 检测用户的浏览器和平台\n\nWeb 开发中约 25% 的工作涉及在不同浏览器和平台上进行测试，并为任何兼容性问题创建替代方案。有些网站甚至有多个版本的页面以适应不同的浏览器。为了确定加载哪个页面，它们首先“嗅探”（识别）用户的浏览器。9.3\
    \ 展示了一个简单的浏览器嗅探脚本，带有一个字段和一个按钮。当点击按钮时，字段会显示用户的浏览器和计算机平台信息。\n\n`<head><title>browser\
    \ test</title><script type=\"text/javascript\" language=\"JavaScript\">\n/* 将此浏览器检测代码加入\
    \ library.js */\nvar theApp = navigator.appName.toLowerCase();\n/* 目前两个主流浏览器的变量\
    \ */\nvar isIE = (UA.indexOf('msie') >= 0) ? true : false;\nvar isNS = (UA.indexOf('mozilla')\
    \ >= 0) ? true : false;\n/* 'compatible' 字符串仅存在于非 Netscape 浏览器 */\nif (UA.indexOf('compatible')>0){\n\
    \  isNS = false;\n}`\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_168_0.png)![](img/7705a881c3cbfe90339bb12a38fc1c6_168_1.png)\n\
    \n158\n\n第九章 Web 编程技术\n\n/*  */\nvar thePlatform = navigator.platform.toLowerCase();\n\
    var isMAC = (UA.indexOf('mac') >= 0) ? true : false;\nvar isWIN = (UA.indexOf('win')\
    \ >= 0) ? true : false;\n/* 大多数 UNIX 用户使用 X-Windows，所以大多数时候这检测的是 UNIX。 */\nvar\
    \ isUNIX = (UA.indexOf('x11') >= 0) ? true : false;\n\n/* 浏览器版本 */\nvar version\
    \ = navigator.appVersion;\nvar isMajor = parseInt(version);\n/* Mac 上的 Internet\
    \ Explorer 版本 5 报告版本 4。这段代码修复了问题。 */\nif(isIE && isMAC) {\n  if(UA.indexOf(\"\
    msie 5\")) {\n    isMajor = 5;\n    var stringLoc = UA.indexOf(\"msie 5\");\n\
    \    version = UA.substring(stringLoc + 5, stringLoc + 8);\n  }\n}\n/* Netscape\
    \ 6 在所有平台上都报告版本为 5。这段代码修复了问题。 */\nif(isNS && isMajor>4) {\n  if(UA.indexOf(\"\
    netscape6\")) {\n    isMajor = 6;\n    var stringLoc = UA.indexOf(\"netscape6\"\
    );\n    version = UA.substring(stringLoc + 10, stringLoc + 14);\n  }\n}\nvar isMinor\
    \ = parseFloat(version);\nvar obsolete = (document.getElementById) ? false : true;\n\
    /* 浏览器检测代码结束 */\n\n变量 `obsolete` 是鼓励用户升级到现代浏览器的方便方法。\n\nfunction showInfo(){\n\
    \  var temp=\"\";\n  temp += \"User Agent: \" + UA + \"\\n\";\n  temp += \"Platform:\
    \ \" + thePlatform + \"\\n\";\n  temp += \"Macintosh: \" + isMAC + \"\\n\";\n\
    \  temp += \"Windows: \" + isWIN + \"\\n\";\n  temp += \"Application: \" + theApp\
    \ + \"\\n\";\n  temp += \"Version: \" + version + \"\\n\";\n  temp += \"Netscape:\
    \ \" + isNS + \"\\n\";\n}\n\n"
