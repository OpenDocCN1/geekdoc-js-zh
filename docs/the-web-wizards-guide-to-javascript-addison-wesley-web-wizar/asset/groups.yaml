    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_34_0.png)![](img/7705a881c3cbfe9039b9b12a38fc1c6_34_1.png)\n\
    \n23\n\n### 将脚本置于 HEAD 部分\n\n用 HTML 创建的网页被分为两个大部分部分。HEAD 部分包含有关页的信息，例如标题和指向任何样式表的链接。BODY\
