    #### How Does It Work?


    Listing 3.2 produces the following sequence of events.


    1. The browser loads the HEAD section, which contains the JavaScript function
    validate(). That function is now in memory and ready to do its work when called.

    2. A FORM object named survey begins to appear on the screen. The ACTION property
    is set to post the contents of the form, encoded as plain text, to an e-mail address.
    Within the form, the text INPUT field email appears with an instruction to the
    visitor to type an e-mail address.

    3. An INPUT tag of type submit creates a Submit button. The value of Send Survey
    is the text displayed on the button.

    4. Having typed nothing, the visitor clicks the Send Survey button to submit the
    form. The button generates a submit event.

    5. The onsubmit handler of the FORM object sends a line of code to the JavaScript
    interpreter in the browser. That code calls the validate() function and returns
    a value of true or false to the FORM object. If the value returned is false, the
    FORM object does not send the e-mail.

    6. The validate() function creates a variable theEmail to hold the value typed
    by the visitor. A variable atLoc is created to hold the location of the @ character
    if it is character 1 or later (counting from zero). A variable dotLoc is created
    to hold the location of the "." character if it is at least two characters after
    the @ symbol. A variable len is created to hold the length of the address typed
    by the visitor.

    7. An if-else structure checks to see whether the location of @ is greater than
    0, the location of dot is greater than 0, and the e-mail address ends at least
    two characters after the dot. The && code is used to create the AND condition
    to check all variables. If all of them are true, the validate() function returns
    true and the e-mail is sent. Otherwise, the visitor receives an alert.


    ### Changing information in text fields


    Sometimes the format of information received on a form must be specific. A standard
    U.S. telephone number such as (555) 333-4444 has a three-digit area code, a three-digit
    exchange, and a four-digit extension. The standard format uses parentheses to
    set off the area code and a hyphen between the exchange and the extension. Listing
    3.3 demonstrates how information typed in a text field can be reformatted. You
    can apply this technique to Social Security numbers, ZIP codes, credit card numbers,
    or any number with a consistent structure.


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_51_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_51_1.png)


