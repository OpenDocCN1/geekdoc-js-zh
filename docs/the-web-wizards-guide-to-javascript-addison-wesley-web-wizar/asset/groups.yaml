    \nWorking with Radio Buttons \n\n45 \n\nl^TIP Pass Me That Value \n\nYou probably\
    \ first encountered the term \"parameter\" in your high school algebra \n\nclass.\
    \ A parameter is a container for values. You can think of a parameter as a type\
    \ \n\nof variable. In javaScript the term \"parameter\" refers to any variable\
    \ required for a \n\nfunction to do its job. A function to convert Farenheit to\
    \ Celsius, for example, \n\nwould require a parameter to hold the Fahrenheit temperature\
    \ value. The expres¬ \n\nsion convertToCelsius(temperature) calls the conversion\
    \ function and passes the \n\nvalue found in the temperature parameter. \n\nThe\
    \ document object contains an array of all its subsidiary objects, includ¬ \n\n\
    ing the FORM called survey. The FORM survey in turn creates an array of \n\nall\
    \ its subsidiary objects, including the radio button set gender. The \n\nexpression\
    \ document! \"survey\" \\] \\[ \"gender\" \\] can then be used to \n\nidentify\
    \ the radio button set. The entire radio button set is an object that is \n\n\
    then stored in the new variable theRadioButtons, which is itself an \n\narray\
    \ consisting of two buttons: one for male and one for female. A loop \n\nthen\
    \ proceeds through each element of theRadioButtons to determine \n\nwhether any\
    \ of them is checked. If it finds that a radio button is checked, it \n\nreturns\
    \ the value of that radio button (male or female) to the vali¬ \n\ndate ( ) function,\
    \ which places that value into chosenGender. If no \n\nradio button is checked,\
    \ the value of chosenGender will be null, mean¬ \n\ning that it is empty. Note\
    \ that null is not in quotes because it is not a text \n\nstring. Instead, it\
    \ indicates the absence of any value. \n\n6. The next section of the code contains\
    \ three conditional structures to check \n\nfor the three possible values that\
    \ might be in chosenGender: null, \n\nmale, or female. \n\n7. If neither radio\
    \ button is checked, it means that chosenGender is empty. \n\nAn alert box appears\
    \ with instructions. After the visitor dismisses the alert \n\nbox, a value of\
    \ false is returned to the FORM object that called the func¬ \n\ntion, and that\
    \ prevents the e-mail from being sent. The script ends as soon \n\nas a value\
    \ is returned, so chosenGender is not tested further. If \n\nchosenGender contains\
