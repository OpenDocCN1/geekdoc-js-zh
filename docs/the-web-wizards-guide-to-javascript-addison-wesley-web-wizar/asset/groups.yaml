    数组的元素 0 未被使用，我们必须从数组长度中减去 1 来确定图片的数量。在这里初始化了第三个全局变量 `timerID` 以备后用。


    5. 函数 `showAd() ` 和 `goSite() ` 被存储在内存中，并在稍后被调用时执行它们的任务。


    6. 文档的 `BODY` 部分包含一个名为 `myBanner` 的图片，它被一个锚点标签 (`<a></a>`) 包围。4.0 及更高版本的 Web 浏览器可以识别锚点标签中的
    `onclick` 处理器。早期的浏览器忽略它，但识别 `HREF` 属性。


    7. 当页面加载完成后，会发生 `LOAD` 事件。如果 `BODY` 标签中存在 `onload` 事件处理器，`window` 对象将对 `LOAD`
    事件做出响应。在这个示例中，`onload` 处理器调用 `startBanner() ` 函数，该函数将 `adnumber` 变量设置为 0 并调用 `showAd()
    ` 函数来启动横幅动画。


    8. `HEAD` 中的 `showAd() ` 函数首先检查浏览器是否支持图片数组。然后它检查当前图片是否加载完成；如果图片 1 还没有显示，那么开始加载图片
    2 是没有意义的。全局变量 `adnumber` 加 1。然后测试 `adnumber` 是否大于 `totalads`。如果是，则将 `adnumber`
    重置为 1，动画从第一张图片重新开始。`adnumber` 中的值决定了哪个图片文件被加载到 `myBanner` 的 `SRC` 属性中。


    9. `setTimeout()` 方法反复调用 `showAd()` 函数。调用之间的延迟由 `myTimings` 数组中元素 `adnumber` 的值决定。通过这种方式，图片之间的时间可以根据图片的内容而变化。例如，你可以为文本较多的图片设置较长的延迟，从而为访问者留出阅读文本的时间。对于每个由
    `setTimeout()` 方法调度的任务，全局变量 `timerID` 中都存储了一个唯一的 ID 数字。


    10. 访问者点击了巴赫图片，即系列中的第二张图片。在此时，`adnumber` 的值为 2。产生了一个点击事件。包围图片的锚点标签中的 `onclick`
    事件处理器通过调用 `goSite() ` 函数对点击事件做出响应。


