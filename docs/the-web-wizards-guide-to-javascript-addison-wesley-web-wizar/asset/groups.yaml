    \ loads the page called listing7.5.html. Listing 7.5 creates the second page,\
    \ where the visitor reviews the items in shopping cart before proceeding with\
    \ payment.\n\n<html>\n<head>\n<title>Flag Shopping Cart</title>\n<script type=\"\
