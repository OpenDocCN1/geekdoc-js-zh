    </div>\n</body> \n</html>\n```\n\n列表 6.1 简单的时钟\n\n### 使用 setInterval() 方法\n\n\
    window 对象的 `setInterval()` 方法与 `setTimeout()` 方法非常相似。`setTimeout()` 方法调度任务在给定的延迟后执行一次。`setInterval()`\
    \ 方法调度任务在给定的重复间隔内重复执行。`setInterval()` 方法是生成每秒（1000 毫秒）更新一次的时钟的理想选择，并被版本号为 4 及以上的浏览器支持。\n\
    \n创建一个简单的时钟\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_101_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_101_1.png)\n\
    \n90\n\n第六章 日期与时间处理\n\n图 6.1 显示了列表 6.1 的输出。\n\n- Basic Clock \n- Tuesday, 31 July,\
    \ 2001 11:03:19 AM\n- Back, Forward, Stop, Refresh, Home, AutoFill\n- A Very Basic\
    \ JavaScript Clock\n- Jul 31 11:04:27 2001\n\n图 6.1 在 Internet Explorer（顶部）和 Netscape\
    \ 中列表 6.1 的输出\n\n#### 它是如何工作的？\n\n1. 页面加载，`setInterval()` 方法开始每 1000 毫秒重复调用一次\
    \ `showTime()` 函数。\n2. 每次调用 `showTime()` 函数时，变量 `now` 作为 `Date` 对象的实例被创建。\n3.\
    \ 对 `now` 日对象应用 `toLocaleString()` 方法。\n4. 结果显示在名为 `clock` 的表单中名为 `face` 的字段中。日期的具体格式将取决于位置、浏览器和操作系统。图\
    \ 6.1 显示了在 Internet Explorer 5（顶部）和 Macintosh 上的 Netscape Communicator 4.7 的输出。\n\
    \n在 Web 页面上实现列表 6.1 很容易，但它对日期和时间的格式提供的控制力很小。例如，`toLocaleString()` 方法同时显示日期和时间，但你可能只想显示时间。某些浏览器和操作系统将显示\
    \ 24 小时制时间，而另一些将显示美国时间（AM 和 PM）。幸运的是，你可以对日期和时间进行更多控制，正如接下来的讨论。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_102_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_102_1.png)\n\
    \n91\n\n创建一个更好的时钟\n\n列表 6.2 展示了一种向你的 Web 页面上添加自定义时钟的方法。\n\n```html\n<html><head><title>A\
    \ Better Clock</title>\n<script type=\"text/javascript\" language=\"JavaScript\"\
    >\n<!--\nvar timerID = \"\";\nfunction startClock(){\n  timerID = setInterval('showTime()',\
    \ 1000);\n}\nfunction stopClock(){\n  clearInterval(timerID);\n}\nfunction showTime(){\n\
    \  var now = new Date();\n  var hours = now.getHours();\n  var minutes = now.getMinutes();\n\
