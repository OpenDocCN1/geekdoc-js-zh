    ></script>\n<script type=\"text/javascript\" language=\"JavaScript\">\nThis page\
    \ will not work unless you have placed Bill Dort's cookie code in mylibrary.js.\n\
    function showCookies(){\n    if (GetCookie(\"visitor\") || GetCookie(\"colorchoice\"\
