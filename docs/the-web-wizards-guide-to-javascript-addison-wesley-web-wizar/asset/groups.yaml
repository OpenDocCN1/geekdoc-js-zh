    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_52_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_52_1.png)


    #### 它是如何工作的？


    列表 3.3 产生了以下事件序列。


    1. 浏览器加载 HEAD 到内存并显示 BODY。注意，文本字段 phone 在页面加载时有一个值，以帮助访客理解格式。

    2. 访客在文本字段中输入数字和其他符号。

    3. 访客按 Tab 键使光标离开字段。由于字段值发生了变化，浏览器接收到一个变化事件。

    4. 文本字段 phone 有一个处理器来响应变化事件。它调用了 HEAD 中定义的 `formatNumber()` 函数。

    5. `formatNumber()` 函数创建一个变量 `theNumbersOnly` 来仅存储数字。任何字母或其他字符都将被忽略。

    6. 创建第二个变量 `theChar` 来存储每个正在检查的字符，以确定其是否为数字。

    7. 创建第三个变量 `input` 来存储访客输入的值。

    8. 循环开始检查 `input` 中的每个字符。循环从字符 0（第一个字符）开始，持续到 `input` 的长度。使用 `substring( )` 方法从
    `input` 中提取每个字符。例如，`Steven.substring (0,3)` 将返回字符串 Steven 的第 0、1 和 2 个字符。在这种情况下，`substring(
    )` 方法在达到字符 3 处停止提取。结果将为 Ste。


