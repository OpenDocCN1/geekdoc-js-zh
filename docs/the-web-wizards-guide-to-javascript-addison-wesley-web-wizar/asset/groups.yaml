- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_29_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_29_1.png)\n\
    \n18\n\nChapter Two Enhancing Web Pages with JavaScript\n\n☆ ★\n\nTo learn how\
    \ to use a Web page that creates other Web pages \n\nTo understand how to create\
    \ a Web page to test your code\n\n## Sequence: Doing Things in a Given Order\n\
    \nImagine for a moment that you are the parent of a 13-year-old boy who is beginning\
    \ to grow facial hair. Let's call him Alex. It's your job to teach Alex how to\
    \ shave his face. Your explanation might go something like this:\n\n1. Wash your\
    \ face with a wet cloth.\n2. Apply shaving cream to your skin.\n3. Scrape a razor\
    \ blade over your skin to remove facial hair.\n4. Apply after-shave lotion to\
    \ your face.\n5. Scream loudly.\n\nThese five steps represent a sequence of instructions.\
    \ Alex performs instruction 2 only after completing instruction 1 and so on.\n\
    \nSimilarly, a Web browser performs a series of JavaScript statements in the order\
    \ it receives them. Unlike Alex, however, your browser doesn't have any intelligence.\
    \ You must therefore take care to be precise in crafting your instructions.\n\n\
    TIP If you read this chapter while connected to the Internet, you can see all\
    \ the code examples in action at the book's Web site, http://www.awl.com/estrella/.\n\
    \nThe sequence of JavaScript statements in Listing 2.1 creates a string of text\
    \ that is then displayed to the user in an alert box, as shown in Figure 2.1.\n\
    \nThe `<script> </script>` tags identify all the statements they enclose as code\
    \ to be interpreted. The `type=\"text/javascript\"` attribute identifies the code\
    \ as JavaScript. The latest browsers (Internet Explorer 5+ and Netscape 6+) recognize\
    \ the `TYPE` attribute in the `<script>` tag because it is part of the HTML 4.0\
    \ specification. Older browsers rely on the `language=\"JavaScript\"` attribute.\
    \ To be on the safe side, it's best to include both attributes, as shown in the\
    \ example.\n\nTIP Care to Comment?\n\nPlacing comments in your JavaScript code\
    \ will help you and others to understand the code you write. Blocks of commented\
    \ text within a SCRIPT tag can be preceded by `/*` and followed by `*/` as shown\
    \ in Listing 2.1.\n\nComments that fit on one line may be preceded with `//`.\
    \ The browser ignores commented text when the code is executed. Comments in HTML,\
    \ however, use the more familiar HTML commenting characters (`<!-- HTML comments\
    \ go here -->`).\n\nThe first line of the script begins with an HTML comment tag\
    \ (`<!--`), which hides the script from older browsers (Netscape 1.0 and Internet\
    \ Explorer 2 and earlier). If you neglect to include this tag in your scripts,\
    \ these old browsers will display the text of your script in the body of the page.\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_30_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_30_1.png)\n\
    \nSequence: Doing Things in a Given Order\n19\n\nThe SCRIPT section contains four\
    \ JavaScript statements. The first one uses `var` to initialize the new variable\
    \ `myTextContainer`. Then the assignment operator (`=`) assigns the text \"A Web\
    \ browser \" to the variable `myTextContainer`. In the next two lines the add-by-value\
    \ operator (`+=`) adds additional text to the variable `myTextContainer`. Then\
    \ the alert method of the window object displays the contents of the variable\
    \ `myTextContainer` in a small alert box. After the visitor clicks OK, the text\
    \ in the BODY section of the HTML document is displayed.\n\nBecause you've studied\
    \ HTML, you probably have a favorite text editor. Type the code from Listing 2.1\
    \ into your text editor, save the document as `listing21.html`, and open it in\
    \ your favorite browser.\n\n```html\n<html>\n<head>\n<title>alert me</title>\n\
    <script type=\"text/javascript\" language=\"javascript\">\n// the var keyword\
    \ initializes a variable.\nvar myTextContainer = \"A web browser \";\nmyTextContainer\
    \ += \"will follow your instructions \";\nmyTextContainer += \"exactly and without\
    \ an argument.\";\n/* The alert method of the window object creates an alert box\
    \ that demands the attention of the visitor. */\nwindow.alert(myTextContainer);\n\
    // ends script -->\n</script>\n</head>\n<body bgcolor=\"white\">\n<p>Isn’t it\
    \ nice how computers do what they are told?</p>\n</body>\n</html>\n```\n\nListing\
    \ 2.1 A Sequence of JavaScript Statements\nA web browser will follow your instructions\
    \ exactly and without an argument.\nFigure 2.1 The Output of Listing 2.1\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_31_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_31_1.png)\n\
    \nLooping: Doing Things Repeatedly\n20\n\nChapter Two Enhancing Web Pages with\
    \ JavaScript\n\n## Looping: Doing Things Repeatedly\n\nHave you ever noticed these\
    \ instructions on a shampoo bottle? \"Lather, rinse, repeat.\" If you were a computer,\
    \ you would never leave the shower because these instructions create an endless\
    \ loop. To avoid this problem, loop structures in JavaScript must be a bit more\
    \ precise.\n\nPerhaps the most common form of looping in JavaScript is the for\
    \ loop. Here's the form:\n\n```javascript\nfor (initial expr.; test condition;\
    \ update expr.){\n    JavaScript statements go here.\n}\n```\n\nThe initial expression\
    \ in a for loop consists of a variable set to an initial value. Programmers commonly\
    \ use `i` as the index variable in for loops, but any variable name will do. Listing\
    \ 2.2 assigns an initial value of 5 to the index variable `i`. A semicolon (`;`)\
    \ separates the initial expression from the test condition. The test condition\
    \ determines when the loop ends. To avoid spending the rest of your life washing\
    \ your hair, for example, you would modify the instructions on the shampoo bottle\
    \ to read, \"Lather, rinse, repeat. Stop when your hair is clean.\"\n\nIn Listing\
    \ 2.2, the test condition specifies that the loop should continue only while `i`\
    \ is greater than one (`i > 1`). If `i` is one, the loop stops. The update expression\
    \ specifies how to change the index variable after each cycle of the loop finishes.\
    \ In Listing 2.2, the decrement operator (`--`) reduces the value of `i` by 1\
    \ after each cycle of the loop.\n\nWithin the curly braces (`{}`) are two statements.\
    \ The first statement combines the current value of `i` with a text string and\
    \ writes the result to the current Web document in the browser window. The second\
    \ statement adds another sentence to the document. Notice that both statements\
    \ contain the HTML break tag (`<br>`) as part of the text string. The `<br>` tag\
    \ creates a line break. The loop then repeats until the value of `i` goes down\
    \ to 1. When the loop ends, the JavaScript statements outside the curly braces\
    \ then add two final lines of text to the document. Figure 2.2 shows the output\
    \ of this example.\n\n```html\n<html>\n<head>\n<title>loop me</title>\n<script\
    \ type=\"text/javascript\" language=\"javascript\">\n<!--\nfor (i=5;i>1;i--){\n\
    \    document.write(i + \" bottles of root beer on the wall.<br>\");\n    document.write(\"\
    You take one down, pour a round.<br>\");\n    document.write(\"<br>There is only\
    \ one bottle of root beer left.<br>\");\n    document.write(\"<hl>Now stop drinking\
    \ all my root beer.</hl>\");\n}\n// -->\n</script>\n</head>\n<body bgcolor=\"\
    white\">\n</body>\n</html>\n```\n\nListing 2.2 The Classic For Loop in Action\n\
    Figure 2.2 Output of Listing 2.2\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_32_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_32_1.png)\n\
    \nConditional Branching: Code That Makes Decisions\n21\n"
