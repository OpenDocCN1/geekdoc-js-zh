- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_179_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_179_1.png)\n\
    \n168 \n\n# Chapter Nine\n## Applied Web Programming Techniques\n\n- Allowing\
    \ the visitor to drag objects in a window\n- Selectively hiding or showing elements\
    \ in a window\n\nYou can create these effects, and many others, using Dynamic\
    \ HTML.\n\nDynamic HTML combines HTML version 4, Cascading Style Sheets (CSS),\
    \ and a scripting language such as JavaScript. If you have recently learned HTML\
    \ 4, you're familiar with CSS. Cascading Style Sheets level 1, known as CSS1,\
    \ gives you many formatting options. The current version is CSS2. Internet Explorer\
    \ 5.5 (IE5.5) and later and Netscape Navigator 6 (NN6) and later fully support\
    \ CSS1 and most of CSS2. IE4 and NN4 supported some of CSS1 as well as most of\
    \ the content positioning features of CSS2.\n\nPerhaps the most attractive feature\
    \ of CSS2 is content positioning. For many years, Web authors have wanted an easy\
    \ way to have complete control over the position of content. CSS2 lets you position\
    \ each element precisely on the screen, making the process more efficient than\
    \ earlier versions. Also, you can indicate the stacking order using the z-index\
    \ property, allowing overlap of page elements. You can modify the color, size,\
    \ shape, and position of elements even after the page has loaded. The result is\
    \ a higher level of interactivity, animation, sound, and video, and even the ability\
    \ to implement drag-and-drop interfaces. Dynamic HTML takes you and JavaScript\
    \ to the next level.\n\nAnother popular use of JavaScript is to enhance the interactivity\
    \ possible with products such as Macromedia's Flash, Shockwave, and Dreamweaver,\
    \ Apple's QuickTime, Adobe's Livemotion and Acrobat, and a host of other programs.\
    \ These software packages use JavaScript or JavaScript-like languages to offer\
    \ developers more creative control. As a result, your new skills in JavaScript\
    \ programming will provide many opportunities to create compelling interactive\
    \ content.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_180_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_180_1.png)\n\
    \n## Summary\n\nYou can use a short group of nested loops to create lengthy and\
    \ complex tables that include background colors and JavaScript code. When you\
    \ include quotes within quotes within quotes, you may need to escape the deeply\
    \ nested quote using the backslash character.\n\nBy using client-side image maps\
    \ with JavaScript, you can create novel and compelling user interfaces that involve\
    \ substantial interactivity. You can use pseudo-URLs and onclick handlers to execute\
    \ JavaScript code when links and map areas are clicked.\n\nBrowser detection is\
    \ often necessary to deliver different content for different browsers and platforms.\
    \ Browser detection scripts (sniffers) are ideal candidates for placement in external\
    \ code libraries such as your mylibrary.js file.\n\n- You can control the text\
    \ that is displayed in the status bar of visitors' computers. To avoid interfering\
    \ with status messages coming from the browser, be sure to place only temporary\
    \ information in the status bar. An example is a short message that appears when\
    \ visitors move the mouse over a link.\n\n- Scrolling text in a form field is\
    \ an economical, low-bandwidth way to attract the attention of visitors to important\
    \ announcements on your page.\n\n- Your new skills in JavaScript programming will\
    \ assist you in creating Dynamic HTML and using authoring environments such as\
    \ Flash and Director. Dynamic HTML is the combination of JavaScript, HTML 4, and\
    \ Cascading Style Sheets. Flash and Director are two of many products that use\
    \ JavaScript or JavaScript-like languages to create interactivity.\n\n## Online\
    \ References\n\nInternet development tutorials and scripts are available at Apple\
    \ Computer's developer site.\nhttp://developer.apple.com\n\nW3Schools.com interactive\
    \ tutorials contain many useful script ideas.\nhttp://www.w3schools.com/\n\nDr.\
    \ Estrella's Interactive Web Programming site contains code examples for Dynamic\
    \ HTML.\nhttp://www.stevenestrella.com/IWP\n\n169\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_181_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_181_1.png)\n\
    \n170 \n\n# Chapter Nine Applied Web Programming Techniques\n\n## Review Questions\n\
    \n1. What are the six hexadecimal values used in all Web-safe colors?\n2. When\
    \ is it necessary to use the backslash to escape a single or double quote character?\
    \ Give an example.\n3. What is a pseudo-URL?\n4. What is the userAgent property?\n\
    5. What is mozilla?\n6. How are Boolean values used in browser detection?\n7.\
    \ Which of the major browsers support DOM1?\n8. Why must return true; be the final\
    \ statement in an onmouseover handler for changing status bar text?\n9. What is\
    \ the easiest way to allow your visitor to blank out all fields on a form and\
    \ start over?\n10. What is a recursive function?\n\n## ★ Hands-On Exercises\n\n\
    1. Create a page that uses two nested loops to create content using the document.write()\
    \ method. Then expand the page to include three nested loops.\n2. Create a page\
    \ with a client-side image map and JavaScript code to display text or swap images\
