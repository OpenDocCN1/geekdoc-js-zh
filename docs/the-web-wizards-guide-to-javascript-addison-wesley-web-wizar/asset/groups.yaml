    你可能读这本书是因为你已经知道如何用超文本标记语言（HTML）创建网页，现在你想让你的页面更有趣、更动态。本书将通过提供 JavaScript 语言基础的清晰解释，并以代码示例演示关键概念，帮助你起步。


    发现学习 JavaScript 的许多充分理由：

    - 学习 JavaScript 的历史

    - 掌握基础概念：对象、属性、值、方法、事件、变量、数组和函数

    - 熟悉文档对象模型（DOM）


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_12_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_12_1.png)


    ## 第一章：JavaScript基础


    ### 为什么要学习 JavaScript？


    JavaScript 是一种为 Web 设计的脚本语言。你将 JavaScript 代码直接集成到 HTML 文档中，访问者的浏览器在加载文档时会解释这些代码。JavaScript
    主要成名于它允许 Web 开发者在网页中包含高水平的交互性。学习 JavaScript 有许多很好的理由。


    - 几乎所有的 Web 浏览器都支持 JavaScript。

    - JavaScript 是一种非常流行的语言。因此，JavaScript 网站上有成百上千个脚本可以下载。你可以向他人学习。

    - 越来越多的多媒体制作软件（如 Macromedia Flash 和 Macromedia Director）依赖 JavaScript 或类 JavaScript
    语言来创建交互并增强界面。

    - JavaScript 让你可以使用外部代码库（.js 文件），鼓励代码用。

    - JavaScript 的语法与 C、C++ 和 Java 的语法非常相似。投入学习 JavaScript 时间将长期受益。


    学习编程语言对大脑有益。要在编程中成功，你需要使用创造性的问题解决逻辑思维。编程的学习有助于培养这些能力。


    ### 简史


    JavaScript 最初被称为 LiveScript，是由 Brendan Eich 在 1995 年在 Netscape 发明的。Netscape 和太阳公司合作将
    JavaScript 引入了 Netscape Navigator 2.0 浏览器。这次更名利用了围绕太阳 Java 语言的营销热度。


    JavaScript 的流行随着 Netscape Navigator 3.0 的推出而增加。网页作者开始加入图像切换、状态栏滚动文本、表单验证和其他动态效果。不久后，微软的
    Internet Explorer 3.0 引入了竞争语言 JScript，它与原始的 LiveScript 语言几乎完全相同。JavaScript 和 JScript
    之间的差异大可以不忽略。JavaScript 不是 Java！这些语言在外观和结构上相似，但 Java 是一种功能完整的结构化编程语言，范围上类似于 C 或
    C++。相比之下，JavaScript 是一种用于增强网页的小型脚本语言。对你来说最相关的区别是 JavaScript 学起来容易得多。


