    \ the form called myform. \n\n7. A conditional structure checks to see whether\
    \ counter is at the end of the \n\nblurb string. If it is, counter is reset to\
    \ 0. Otherwise, counter is incre¬ \n\nmented by 1. \n\n8. The variable delay is\
    \ set to the value typed by the visitor in the field called \n\nspeed. \n\n9.\
    \ The variable timer ID is set to an ID number that identifies the scheduled \n\
