    \ value of counter is 0, so the variable f irstpart will contain the \n\nentire\
    \ blurb. The fifth time through, however, the value of counter will be \n\n4,\
    \ so f irstpart will contain characters 4 to the end of blurb plus a space. \n\
    \nThe variable secondpart will contain characters 0 to 4. \n\n6. The contents\
