    \ BODY 中对该脚本进行引用（见图 2.4）。\n\n在列表 2.4 中，一个值从 BODY 中的一个事件处理程序传递（发送）到 HEAD 中的 showText()\
    \ 函数。showText() 函数获取收到的值并将其存储在一个名为 inputdata 的临时变量中。window 对象的 alert 方法随后将 inputdata\
