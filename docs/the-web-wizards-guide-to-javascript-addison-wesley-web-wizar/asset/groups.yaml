    \ \"Good afternoon\";\n    }\n  } else {\n    greeting = \"Good evening\";\n \
    \ }\n} else {\n  greeting = \"Isn't it past your bedtime?\";\n}\n//-->\n</script>\n\
    </head>\n<body bgcolor=\"white\">\n<div align=\"CENTER\">\n<h1>Dynamic Greetings</h1>\n\
    <h2>\n<script type=\"text/javascript\" language=\"JAVASCRIPT\">\n<!--\ndocument.write(greeting);\n\
    //-->\n</script>\n</h2>\n<p>上面的问候是根据一天的时间通过 JavaScript 生成的。</p>\n</div>\n</body>\n\
    </html>\n```\n\n列表 6.3 动态问候\n\n图 6.3 显示了列表 6.3 的输出。\n\n"
