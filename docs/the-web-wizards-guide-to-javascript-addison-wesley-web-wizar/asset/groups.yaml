- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_33_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_33_1.png)\n\
    \n22\n\nChapter Two Enhancing Web Pages with JavaScript\n\n```html\n<html>\n<head><title>prompt\
    \ me</title>\n\n<script type=\"text/javascript\" language=\"javascript\">\n<!--\n\
    var yourSpecies = window.prompt(\"Are you human or -alien?\");\n\nif (yourSpecies\
    \ == \"human\"){\n  document.write(\"Greetings Earthling.<br>\");\n}}else{\n \
    \ document.write(\"Nanu nanu. Kaplagh!<br>\");\n}\n//-->\n</script>\n\n</head>\n\
    \n<body bgcolor=\"white\">\n\n</body>\n</html>\n```\n\nListing 2.3 Conditional\
    \ Branching with If-Else\n\nIn line 1 of the SCRIPT section, the prompt method\
    \ of the window object asks the Web page visitor a question. The user types an\
    \ answer, which is assigned to the variable yourSpecies.\n\n| Internet Explorer\
    \ Script Prompt |\n| :--- |\n| Are you human or alien? |\n\nFigure 2.3 Asking\
    \ a Question of the Web Page Visitor\n\nLine 2 of Listing 2.3 tests the condition\
    \ (yourSpecies == \"human\"). If the visitor typed human, the condition evaluates\
    \ as true and \"Greetings Earthling\" is written to the current document. If the\
    \ visitor types anything else, the condition evaluates as false and \"Nanu nanu.\
    \ Kaplagh!\" is written to the current document.\n\n**WARNING Why Use ==?**\n\
    The most common error made by beginning programmers is to confuse the assignment\
    \ operator (=) with the equality sign (==). In writing if-else structures, be\
    \ sure to use the equality sign (==) to test your conditions. If you use the assignment\
    \ operator by mistake, the condition you create will always evaluate as true and\
    \ you won't get the results you desire.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_34_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_34_1.png)\n\
    \n23\n\n### Placing Scripts in the HEAD Section\n\nWeb pages created with HTML\
    \ are divided into two large sections. The HEAD section contains information about\
    \ the page, such as the title and links to any style sheets. The BODY section\
    \ contains the text, graphics, and media elements that will be visible to Web\
    \ page visitors.\n\nScripts can be stored in both the HEAD and the BODY sections.\
    \ The HEAD is used most often because it loads first. In this way, you can refer\
    \ to your code in the BODY with the assurance that the code will be completely\
    \ loaded into the browser's memory. Listing 2.4 shows a typical JavaScript-enhanced\
    \ page with a script in the HEAD and a reference to that script in the BODY (see\
    \ Figure 2.4).\n\nIn Listing 2.4, a value is passed (sent) from the one event\
    \ handler in the BODY to the showText() function in the HEAD. The showText() function\
    \ takes the value it receives and stores it in a temporary variable called inputdata.\
    \ The alert method of the window object then displays the value found in inputdata\
    \ as an alert window. The value being passed around is document.sampleform.userinfo.value,\
    \ which represents the text the visitor typed into the userinfo field on the sampleform\
    \ FORM of the current document.\n\n```html\n<html>\n<head><title>a place for scripts</title>\n\
    \n<script type=\"text/javascript\" language=\"javascript\">\n<!--\nfunction showText(inputdata){\n\
    \  window.alert(inputdata);\n}\n//-->\n</script>\n\n</head>\n\n<body bgcolor=\"\
    white\">\n<p>Please type any text and then click the button.</p>\n<form name=\"\
    sampleform\">\n  <input type=\"text\" size=50 name=\"userinfo\"><br><br>\n  <input\
    \ type=\"button\" name=\"mybutton\" value=\"show text\" onclick=\"showText(document.sampleform.userinfo.value);\"\
    >\n</form>\n</body>\n</html>\n```\n\nThe onclick event handler sends the information\
    \ typed by the visitor to the showText() function in the head, the showText()\
    \ function then displays the information in an alert window.\n\nListing 2.4 Placing\
    \ Scripts in the HEAD Section\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_35_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_35_1.png)\n\
    \nChapter Two Enhancing Web Pages with JavaScript\n\nFigure 2.4 The Output of\
    \ Listing 2.4\n\n### Creating Reusable Libraries of your favorite Code\n\nIn the\
    \ long run, it's most efficient to store your favorite scripts in libraries. In\
    \ that way, you won't have to retype functions every time you use them. For example,\
    \ function showText() from Listing 2.4 will likely be of use to you in other pages.\n\
    \nTo create a library of your favorite code, create a plain text file in any text\
    \ editor and then save the file with the extension .js. Listing 2.5 shows the\
    \ complete contents of mylibrary.js. You will add more code to this library as\
    \ you work through this book.\n\n```javascript\nfunction showText(inputdata){\n\
    \  window.alert(inputdata);\n}\n```\n\nListing 2.5 The Complete Contents of mylibrary.js\n\
    \nListing 2.6 shows how easy it is to use your new library (see Figure 2.5). You\
    \ simply add the SRC attribute to the SCRIPT tag in the HEAD and then type the\
    \ path to the library file. The HTML code creates two buttons. Both buttons call\
    \ the showText() function stored in mylibrary.js, but the values they pass differ.\n\
    \n```html\n<html>\n<head><title>using external libraries of code</title>\n<script\
    \ type=\"text/javascript\" language=\"javascript\" src=\"mylibrary.js\">\n</script>\n\
    </head>\n```\n\nCode from the file 'mylibrary.js' is referenced here.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_36_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_36_1.png)\n\
    \nCreating Reusable Libraries of Your Favorite Code\n\n25 \n\n```html\n<html>\n\
    <body bgcolor=\"white\">\n<form name=\"sampleform\">\n  <input type=\"button\"\
    \ value=\"Quote 1\" onclick=\"showText('If you want to database')\">\n  <input\
    \ type=\"button\" value=\"Quote 2\" onclick=\"showText(\\\"If you want to\\\"\
    )\">\n</form>\n</body>\n</html>\n```\n\nListing 2.6 A Web page That Uses an External\
    \ Library\n\n**WARNING Single versus Double Quotes**\nThe onclick handler in Listing\
    \ 2.6 contains both single and double quotes. The text in single quotes is nested\
    \ within the text in double quotes. When you nest quotes in this way, the Web\
    \ browser can correctly determine where each expression begins and ends. As you\
    \ debug your code, be sure to look for improperly nested quotes. It's a common\
    \ error.\n\n| Microsoft |\n| :--- |\n| File Edit View Favorites |\n| Back Forward\
    \ Refresh Home |\n| “h1 Quote 2 |\n| Quote 1 Quote 2 |\n\nFigure 2.5 The Output\
    \ of Listing 2.6\n\n### Debugging Your Scripts\n\nOne of the easiest ways to detect\
    \ errors in your code is to use the JavaScript console built into Netscape Communicator\
    \ 4 or later. In Netscape 4, type javascript: and press [Return] in the location\
    \ field of any Netscape window to bring up the JavaScript console. In Netscape\
    \ 6, from the TASKS menu choose TOOLS and JASCRIPT CONSOLE. To view any errors\
    \ generated by your code, keep the console open while you test your pages.\n\n\
    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_37_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_37_1.png)\n\
    \n26\n\nChapter Two Enhancing Web Pages with JavaScript\n\n### Creating a Page\
    \ to Make HTML Code\n\nAs you work through this book, you will create many Web\
    \ pages containing all the standard HTML markup tags in addition to all the JavaScript\
    \ code you will type. That is a lot of typing. With a little ingenuity, you can\
    \ build a JavaScript-enhanced page to quickly create standard HTML code for use\
    \ in your projects.\n\nFirst, add the code in Listing 2.7 to your mylibrary.js\
    \ file.\n\n```javascript\nfunction buildPage(){\n  var pagecontent = \"<<html><head><title>\"\
    ;\n  pagecontent += document.pageform.pagetitle.value;\n  pagecontent += \"</title></head>\\\
    n\";\n  pagecontent += \"<body bgcolor='white'>\\n\";\n  pagecontent += document.pageform.bodytext.value;\n\
    \  pagecontent += \"\\n</body>\\n</html>\";\n  document.pageform.mycode.value=pagecontent;\n\
    }\n```\n\nListing 2.7 The buildPage Function\n\nNext, create a text file with\
    \ the HTML code found in Listing 2.8.\n\n```html\n<html>\n<head><title>HTML Builder\
    \ page</title>\n<script type=\"text/javascript\" language=\"javascript\" src=\"\
    mylibrary.js\">\n</script>\n</head>\n\n<body bgcolor=\"white\">\n<h1>HTML Builder</h1>\n\
    <p>Fill out the form below to create a basic html page.</p>\n<form name=\"pageform\"\
    >\n  <h2>Title:</h2>\n  <p>Type the title for your web page below.<p>\n  <input\
    \ type=\"text\" name=\"pagetitle\" size=\"50\" value=\"a basic html page\">\n\
    \  </p>\n  <h2>Body text:</h2>\n  <p>Type the body text for your page below.<br>\n\
    \  <textarea name=\"bodytext\" cols=\"80\" rows=\"10\"></textarea>\n  </p>\n</form>\n\
    </body>\n</html>\n```\n"
