  mdcn: "\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_179_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_179_1.png)\n\
    \n168 \n\n# 第九章\n## 应用 Web 编程技术\n\n- 允许访问者在窗口中拖动对象\n- 选择性地隐藏或显示窗口中的元素\n\n你可以使用动态\
    \ HTML（Dynamic HTML）创建这些效果以及许多其他效果。\n\n动态 HTML 结合了 HTML 4 版本、层级样式表（CSS）以及如 JavaScript\
    \ 等脚本语言。如果你最近学习了 HTML 4，那么你对 CSS 并不陌生。层级样式表 级（称为 CSS1）为你提供了许多格式化选项。当前版本是 CSS2。Internet\
    \ Explorer 5.5 (IE5.5) 及更高版本以及 Netscape Navigator 6 (NN6) 及更高版本完全支持 CSS1 和 CSS2\
    \ 的大部分功能。IE4 和 NN4 也支持 CSS1 的部分内容以及 CSS2 的大部分内容定位功能。\n\nCSS2 最具吸引力的特征可能是内容定位。多年来，Web\
    \ 作者一直希望有一种简单的方法来完全控制内容的位置。CSS2 允许你在屏幕上精确定位每个元素，使得该过程比之前的版本更高效。此外，你可以使用 `z-index`\
    \ 属性指定堆叠顺序，允许页面元素重叠。你甚至可以在页面加载后修改元素的颜色、大小、形状和位置。其结果是更高水平的交互性、动画、声音和视频，甚至具有实现拖放接口的能力。动态\
    \ HTML 将你和 JavaScript 提升到了新的高度。\n\nJavaScript 的另一个流行用途是增强如 Macromedia 的 Flash、Shockwave\
    \ 和 Dreamweaver，Apple 的 QuickTime，Adobe 的 Livemotion 和 Acrobat 以及许多其他程序等可能的交互性。这些软件包使用\
    \ JavaScript 或类 JavaScript 语言为开发者提供更多的创意控制。因此，你在 JavaScript 编程方面的新技能将为创建引人入目的交互式内容提供许多机会。\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_180_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_180_1.png)\n\
    \n## 总结\n\n你可以使用一组简短的嵌套循环来创建包含背景颜色和 JavaScript 代码的长且复杂的表格。当你引号中嵌套引号、引号中再嵌套引号时，你可能需要使用反斜杠字符来转义深度嵌套的引号。\n\
    \n通过使用 JavaScript 使用图像映射（image maps），你可以创建具有实质性交互性的新颖且迷人的用户界面。你可以使用伪 URL（pseudo-URLs）和\
    \ `onclick` 处理程序在点击链接和映射区域时执行 JavaScript 代码。\n\n为了给不同的浏览器和平台交付不同的内容，浏览器检测通常是必要的。浏览器检测脚本（嗅探器）是放置在外部代码库（例如你的\
    \ `mylibrary.js` 文件）中的理想人选。\n\n- 你可以控制在访问者计算机状态栏中显示的文本。为了避免干扰来自浏览器的状态消息，请务必只在状态栏中放置临时信息。例如，当访问者将鼠标移动到链接上时显示的简短消息。\n\
    \n- 表单字段中的滚动文本是一种经济、低带宽的方法，可以吸引访问者注意你页面上的重要公告。\n\n- 你在 JavaScript 编程方面的新技能将帮助你创建动态\
    \ HTML 并使用 Flash 和 Director 等编写环境。动态 HTML 是 JavaScript、HTML 4 和层级样式表的结合。Flash\
    \ 和 Director 是许多使用 JavaScript 或类 JavaScript 语言创建交互性的产品之一。\n\n## 在线参考\n\n在 Apple\
    \ 计算机开发者网站上提供了 Internet 开发教程和脚本。\nhttp://developer.apple.com\n\nW3Schools.com\
    \ 交互式教程包含许多的脚本思路。\nhttp://www.w3schools.com/\n\nEstrella 博士的交互式 Web 编程网站包含动态 HTML\
    \ 代码示例。\nhttp://www.stevenestrella.com/IWP\n\n169\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_181_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_181_1.png)\n\
    \n170 \n\n# 第九章 应用 Web 编程技术\n\n## 复习题\n\n1. 所有 Web 安全颜色中使用的六个十六进制值是什么？\n2. 何时需要使用反斜杠来转义单引号或双引号？请举例说明。\n\
    3. 什么是伪 URL？\n4. `userAgent` 属性是什么？\n5. mozilla 是什么？\n6. 布尔值在浏览器检测中是如何使用的？\n7.\
    \ 哪些主流浏览器支持 DOM1？\n8. 为什么 `return true;` 必须是更改状态栏文本的 `onmouseover` 处理程序中的最后一个语句？\n\
    9. 允许访问者清空表单上所有字段并重新开始的最简单方法是什么？\n10. 什么是递归函数？\n\n## ★ 练习\n\n1. 创建一个使用两个嵌套循环通过\
