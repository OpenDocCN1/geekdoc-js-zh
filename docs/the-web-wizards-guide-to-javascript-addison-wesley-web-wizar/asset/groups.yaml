  - "[PAGE 179]\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_179_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_179_1.png)\n\
    \n168 \n\nChapter Nine \n\nApplied Web Programming Techniques \n\nW Allowing the\
    \ visitor to drag objects in a window \n\nW Selectively hiding or showing elements\
    \ in a window \n\nYou can create these effects, and many others, using Dynamic\
    \ HTML. \n\nDynamic HTML combines HTML version 4, Cascading Style Sheets (CSS),\
    \ \n\nand a scripting language such as JavaScript. If you have recently learned\
    \ HTML 4, \n\nyou're familiar with CSS. Cascading Style Sheets level 1, known\
    \ as CSS1, gives you \n\nmany formatting options. The current version is CSS2.\
    \ Internet Explorer 5.5 (IE5.5) \n\nand later and Netscape Navigator 6 (NN6) and\
    \ later fully support CSS1 and most of \n\nCSS2. IE4 and NN4 supported some of\
    \ CSS1 as well as most of the content posi¬ \n\ntioning features of CSS2. \n\n\
    Perhaps the most attractive feature of CSS2 is content positioning. For many \n\
    \nyears, Web authors have wanted an easy way to have complete control over the\
    \ \n\nposition of content. CSS2 lets you position each element precisely on the\
    \ screen, \n\nmaking the process more efficient than earlier versions. Also, you\
    \ can indicate the \n\nstacking order using the z-index property, allowing overlap\
    \ of page elements. You \n\ncan modify the color, size, shape, and position of\
    \ elements even after the page has \n\nloaded. The result is a higher level of\
    \ interactivity, animation, sound, and video, \n\nand even the ability to implement\
    \ drag-and-drop interfaces. Dynamic HTML takes \n\nyou and JavaScript to the next\
    \ level. \n\nAnother popular use of JavaScript is to enhance the interactivity\
    \ possible with \n\nproducts such as Macromedia's Flash, Shockwave, and Dreamweaver,\
    \ Apple's \n\nQuickTime, Adobe's Livemotion and Acrobat, and a host of other programs.\
    \ These \n\nsoftware packages use JavaScript or JavaScript-like languages to offer\
    \ developers \n\nmore creative control. As a result, your new skills in JavaScript\
    \ programming will \n\nprovide many opportunities to create compelling interactive\
    \ content."
