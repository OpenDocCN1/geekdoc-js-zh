    `clearTimeout()` 方法取消哪个任务。


    12. `goSite() ` 函数更改当前窗口的 `location` 对象的 `href` 属性，将其更改为存储在 `mySites` 数组元素 `adnumber`
    中的 Web 地址。由于 `adnumber` 目前为 2，巴赫页面将在当前窗口中加载。这之所以有效是因为 `location` 对象代表了当前加载到窗口的
    URL。如果 `location` 对象的 `href` 属性被更改为不同的 URL，新 URL 将自动加载。


