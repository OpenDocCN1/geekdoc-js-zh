    ## 前言


    ### 关于 Addison-Wesley 的 Web Wizard 系列


    Web 的魅力在于，只要付出一点努力，任何人都可以利用它的力量来创建复杂的网站。Addison-Wesley 的 Web Wizard 系列通过在每本书中对一个重要的互联网主题或技术进行简要介绍，帮助学生掌握
    Web。这些书籍从零开始，假设读者对所涵盖的技术没有先验经验。掌握 Web 并非挥一下魔杖就能实现的，但通过学习这些易于理解、高度视觉化的教科书，读者将走上正确的道路。


    该系列由讲师编写，他们熟悉初学者在学习材料时面临的挑战。为此，Web Wizard 系列书籍不仅提供了食谱式的方法：它们更强调原理并提供清晰的解释，为读者提供坚实的知识基础，以便在此基础上进行构建。


    许多特性突出了重点内容并辅助了学习：


    - 提示（Tips）——需要记住的重要要点

    - 快捷方式（Shortcuts）——节省时间的想法

    - 警告（Warnings）——需要注意的事

    - 动手尝试（Do It Yourself）——现在就可以尝试的活动

    - 复习题和实践练习

    - 在线参考（Online references）——获取更多信息的网站


    书籍的补充材料（包括更新、额外示例和源代码）可以在 http://www.aw.com/webwizard 获取。对于采用本系列书籍的合格讲师，还提供讲师手册、样本测试和答案。请联系您的
    Addison-Wesley 销售代表获取讲师资源密码。


    ### 关于本书


    当我最早在 1994 年开始开发网站时，我能显示一个简单的图形或给文本加**粗**就已感到非常感激了。那时，Web 是一个静态媒介。交互性仅限于您创建的用于在不同页面间跳转的链接。Web
    设计师对内容的呈现方式几乎没有控制权。由于带宽限制和缺乏标准，文本和简单图形以外的媒体元素很少被使用。那时网页最流行的背景颜色是灰色。天哪，一切都发生了巨大的变化。


    今天的网站具有高度的交互性和丰富的媒体内容。JavaScript 在现代网站的开发中起着巨大作用，因为它提供了一种相对简单的方法来与浏览器创建的对象进行交互。因此，Web
    设计师不再将他们的创作视为一系列通过导航图标连接的静态页面。相反，Web 设计师创建了让访问者与文本、图形、动画、声音和视频交互的环境。访问者是主动参与者，而不是被动接受者。


    本书将介绍 JavaScript 语言的基础，并帮助你学习可视化浏览器环境中的对象交互。在学习 JavaScript 之前，建议具有坚实的 HTML 4 基础。在这里学的概念技能将让你的
    HTML 代码提升一个层次。你将学习在页面加载前后操作你的网页内容。你将学习如何从访问者那里收集信息以定制他们的浏览体验。你将充分理解一种改变了互联网本质的语言。


