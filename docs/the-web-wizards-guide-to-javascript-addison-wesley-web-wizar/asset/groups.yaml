    \nInternet Explorer Script Alert Is this OK, Steve?\n\n### The Document Object\
    \ Model\n\nDocument Object Model (DOM) is a hierarchical model to represent the\
    \ objects created by a Web browser. In 2000 the World Wide Web Consortium (W3C)\
    \ published a standard DOM called DOM1. The latest Web browsers, including Netscape\
    \ 6 and Internet Explorer 5.5, use DOM1. The older browsers, such as Netscape\
    \ 4 and Internet Explorer 4, use their own proprietary DOMs. As a result, JavaScript\
    \ programmers must be careful to produce code that works well in all three DOMs.\
    \ Web page authors historically have spent about 25 percent of their development\
    \ time dealing with the inconsistencies between the DOMs of the two major browsers.\
    \ DOM1 now adds a third to the mix.\n\nA DOM is an internal map of all objects\
    \ found on a Web page (see Figure 1.5). In all current DOMs, the browser window\
    \ is at the top of the hierarchy. The document object is one level below the window\
    \ object. Any scriptable objects within the document, such as forms and links,\
    \ may also have subordinate objects. For example, the text field example in the\
    \ preceding section is an INPUT object of type TEXT and is called visitor. The\
    \ visitor object is part of a FORM object called myform, which in turn is part\
    \ of the current document and window. It is necessary to specify the complete\
    \ path to any object you wish to manipulate in scripting. Hence, you can use a\
    \ line of JavaScript code such as this one to alter the value of the visitor object:\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_24_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_24_1.png)\n\
    \n#### The Document Object Model\n13\n\n```javascript\nwindow.document.myform.visitor.value\
    \ = \"Some text goes here\";\n```\n\nIn practice, the reference to the current\
    \ window can be assumed, so programmers often simply type\n\n```javascript\ndocument.myform.visitor.value\
    \ = \"Some text goes here\";\n```\n\nOne of the principal differences between\
    \ the DOMs of Netscape and Microsoft is the use of the ALL keyword in Microsoft's\
    \ Internet Explorer. The ALL keyword makes it easier to create references to deeply\
    \ nested objects in Internet Explorer than in Netscape Communicator. You can reference\
    \ any uniquely named object in the Internet Explorer DOM using the following structure:\n\
    \n```javascript\ndocument.all.someobjectname;\n```\n\nDOM1 establishes a new method\
    \ for accessing an object on a Web page:\n\n```javascript\ndocument.getElementByld(elementID);\n\
    ```\n\nThis works for SPAN and DIV tags or any other object with a unique ID property\
    \ coded in HTML. Netscape Communicator 6 and Internet Explorer 5.x now support\
    \ DOM1.\n\nAs older browser versions fall into disuse, it may eventually be possible\
    \ to code pages for compatibility only with DOM1. For now, however, you need to\
    \ learn techniques that work with all three DOMs. Understanding all the details\
    \ of the three DOMs takes time and patience. Fortunately, the techniques you will\
    \ learn in this book have already been tested for compatibility with the three\
    \ DOMs. Concepts related to the DOMs will be introduced in context as needed.\n\
    \n| WINDOW |\n| :--- |\n| HISTORY |\n| LOCATION |\n| DOCUMENT |\n| LINK |\n| ANCHOR\
    \ |\n| FORM |\n| SELECT |\n| CHECKBOX |\n| TEXTAREA |\n| PASSWORD |\n\nFigure\
    \ 1.5 Hierarchy of Objects in the Document Object Model\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_25_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_25_1.png)\n\
    \n### Summary\n\nJavaScript is a scripting language designed for the Web. It is\
    \ the most popular and supported language today to enhance Web pages. Like Netscape\
    \ created it, the language is also known as ECMAScript. JavaScript is an object-oriented\
    \ language. Elements on Web pages have properties. Like the real world, objects\
    \ may respond to events. Variables are containers for information. Arrays are\
    \ ordered collections of data. Methods are the verbs of JavaScript. The most frequent\
    \ programming error is confusing the assignment operator (=) with the equality\
    \ operator (==). Functions are groups of statements that perform a task and often\
    \ return a value. The Document Object Model is an internal map of objects. Netscape\
    \ and Internet Explorer use different DOMs, but the new DOM1, recently published\
    \ by W3C, has created a standard for future versions of all browsers.\n\n### References\n\
    \n- Netscape's official pages for JavaScript: http://developer.netscape.com/docs/manuals/javascript\n\
    - CNET.com's JavaScript tips: http://builder.cnet.com\n- The official W3C page\
    \ on DOM: http://www.w3.org/TR/DOM-Level-1\n"
