    How Does It Work? \n\nListing 4.4 produces the following sequence of events. Take\
    \ your time and exam¬ \n\nine each step as it relates to the code. \n\n1. The\
    \ browser loads the HEAD portion of the HTML document into its memory. \n\n2.\
    \ The browser creates eight blank image objects with names corresponding to \n\
    \nthe on and off states of the four images on the page. \n\n3. The browser fills\
    \ the SRC properties of the new images by retrieving graphics \n\nfiles found\
    \ in the images folder located in the same folder as the current docu¬ \n\nment.\
    \ The image files are now located in the browser's cache folder on the vis¬ \n\
    \nitor's hard drive. \n\n4. The browser loads the swaplmage( ) and rollOffAll(\
    \ ) functions into \n\nmemory, but these functions do nothing until they are called.\
    \ \n\n5. The browser loads the BODY section of the document, including four named\
    \ \n\nimage objects created with the IMG tag. \n\n6. The visitor moves the mouse\
    \ on top of the image called beethoven. \n\nA mouseover event is generated in\
    \ the browser's memory. \n\n7. The anchor tag handles the mouseover event by calling\
    \ the \n\nf unctionswaplmage ( ) and passing the desired version, ON, and the\
    \ name \n\nof the image, beethoven, to the function."
