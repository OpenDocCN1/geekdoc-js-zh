    ## Chapter One: JavaScript Basics


    ### Why Learn JavaScript?


    JavaScript is a scripting language designed for the Web. You integrate JavaScript
    code directly into HTML documents, and your visitors'' Web browsers interpret
    the code when they load the document. JavaScript''s main claim to fame is that
    it allows Web developers to include high levels of interactivity in Web pages.
    There are many great reasons for learning JavaScript.


    - Virtually all Web browsers support JavaScript.

    - JavaScript is a very popular language. As a result, hundreds of scripts are
    available for download at JavaScript sites. You can learn from the work of others.

    - An increasing number of multimedia authoring programs, such as Macromedia Flash
    and Macromedia Director, rely on JavaScript or JavaScript-like languages to create
    interactivity and enhance interfaces.

    - JavaScript lets you use external code libraries (.js files), encouraging reusable
    code.

    - The syntax of JavaScript is very similar to the syntax of C, C++, and Java.
    The time you invest in learning JavaScript will bear fruit for years to come.


    Learning a programming language is good for the mind. To succeed in programming,
    you must use creative problem solving and logical thinking. The study of programming
    encourages you to develop these abilities.


    ### A Little History


    Originally called LiveScript, JavaScript was invented by Brendan Eich at Netscape
    in 1995. Netscape and Sun Microsystems worked together to include JavaScript in
    the Netscape Navigator 2.0 Web browser. The name change capitalized on the marketing
    hype surrounding Sun''s Java language.


    JavaScript''s popularity increased with the introduction of Netscape Navigator
    3.0. Web page authors began to include image swapping, scrolling text in the status
    bar, form validation, and other dynamic effects. Shortly thereafter, Microsoft''s
    Internet Explorer 3.0 introduced a competing language, JScript, which was almost
    identical to the original LiveScript language. The differences between JavaScript
    and JScript are largely inconsequential. JavaScript is not Java! The languages
    are similar in appearance and structure, but Java is a full-featured, structured
    programming language similar in scope to C or C++. JavaScript, on the other hand,
    is a small scripting language designed to enhance Web pages. The most relevant
    difference for you is that JavaScript is much easier to learn.


