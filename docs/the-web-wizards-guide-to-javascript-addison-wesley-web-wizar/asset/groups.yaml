    ## 第七章：维护状态


    ### 目标


    - 理解 cookie 的本质和局限性

    - 发现如何创建删除 cookie

    - 学习如何在 cookie 中设置和检索你的偏好

    - 理解如何使用 cookie 自定义你的 Web 页面

    - 学习如何使用 cookie 创建简单的购物车


    ### 什么是 Cookie？


    在互联网术语中，有服务器和客户端。服务器是存储和传输 Web 页面的计算机。客户端是接收和显示这些页面的计算机。Web 浏览器通常被称为客户端软件。


    假设你正在管理一个带有会员区域的网站。服务器发送的页面可能包含一个显示在客户端的登录表单。使用客户端软件（浏览器）的访问者填写用户名和密码。这些信息随后发送回服务器存储在数据库中。每当访问者返回你的页面时，必须记住他的用户名和密码登录。


    现在想象访问者可以点击你登录屏幕上的按钮，将用户名和密码方便地存储在他的硬盘上。现在每当他访问时，客户端软件会自动检索用户名和密码并发送到服务器。


    Cookie 是计算机科学术语，指的是由中间层持有的数据。在这种情况下，访问者的硬盘是位于客户端和服务器之间的中间层。Cookie 实际上是存储在客户端硬盘上的普通文本文件的小数据块。20世纪初，Lou
    Montuili 为 Netscape Navigator 1.0 创建了最初的 cookie 规范，这是第一个具有此功能的浏览器。


    大多数主要的网站都使用 cookie 为每个访问者个性化浏览体验。自定义主页就是一个常见的例子。Yahoo、Excite、Netscape 以及许多其他网站都允许访问者创建页面。这些页面允许你设置偏好，然后显示例如你的当地天气、喜喜网站的链接，甚至是显示你股票组合的表格。当你第一次访问新主页时，输入用户名和密码。然而，之后的每次访问都不再需要登录了，因为硬盘上的
    cookie 包含了登录信息。


