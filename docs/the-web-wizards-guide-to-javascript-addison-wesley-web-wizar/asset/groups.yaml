    \n7. The double rollover technique provides visitors with additional information\
    \ about a link before they click on the link. This interface enhancement is an\
    \ impressive and practical way to make navigation easier for your visitors.\n\n\
    1. You must add an onclick event handler to call the function.\n\n3. Parameter\
    \ is another word for variable. When a function is called, it's possible to send\
