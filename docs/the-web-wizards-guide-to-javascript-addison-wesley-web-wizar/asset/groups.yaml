    关于 Cookie 的常见问题 109


    关于 Cookie 的常见问题


    问：Cookie 会传输计算机病毒？


    答：不能。病毒是计算机程序。纯文本文件不是计算机程序。


    由于 Cookie 是存储在文本文件中的纯文本，它们无法像病毒那样存储或运行计算机程序。此外，Cookie 的大小被限制在 4 千字节。即使计算机程序可以存储在
    Cookie 中，要创建一个那么小的程序也是困难的。


    问：黑客能利用 Cookie 窃取信用卡信息吗？


    答：不太可能。Cookie 只包含你提供的信息。当你在在线购买期间提供信用卡号时，Web 服务器会将该信息存储在它的安全数据库中，而不是存储在你硬盘上的 Cookie
    中。任何愚蠢到将敏感信息存储在 Cookie 中的公司很快就会倒闭。因为 Cookie 是可读的文本文件，某个警觉的访问者发现自己硬盘 Cookie 中存在信用卡号只是几小时内的事。


    问：黑客能读取我 Cookie 中存储的信息吗？


    答：不能。Cookie 包含有关创建它的站点的信息。只有创建 Cookie 的站点才能读取该 Cookie。如果某个站点确实将敏感信息存储在 Cookie
    中，它将是唯一能够检索它的站点。


    问：营销公司会利用 Cookie 侵犯我的隐私吗？


    答：可能。。DoubleClick 网络在 Cookie 中存储客户画像，但不存储用户名、电子邮件或电话号码。相反，每个客户画像都是匿名的。使用 Doubleclick
    服务网站上的横幅广告是定制的，以符合客户画像中描述的人的兴趣。2000 年 2 月，DoubleClick 提议将这些客户画像与真实身份关联起来。引发的骚动足以说服
    Doubleclick 和其他公司，这种行为只会产生恶感。尽管如此，许多人对自己在互联网上被画像化的想法感到不适。


    问：我能做什么来减少 Cookie 带来的隐私问题吗？


    答：当然可以。所有 Web 浏览器都有偏好设置，允许你管理 Cookie。你可以选择让浏览器自动接受所有 Cookie、从不接受任何 Cookie，或在每次站点想要发送
    Cookie 时询问你。此外，使用 Cookie 存储访问者偏好的站点应该发布关于存储了哪些信息以及如何使用这些策略。


    问：我可以为我的 Web 页面创建多少 Cookie？


    答：每个域名的 Cookie 属性最多可以存储 20 条 Cookie 记录。大多数使用 Cookie 的专业网站只存储一个 Cookie，用唯一的 ID
    数字或文本字符串来标识访问者。定制访问者体验所需的其余数据存储在服务器上相关的数据库记录中。这是一个良好的做法，因为避免了在 Cookie 记录中存储敏感信息。


    ![](img/7705a881c3cbfe9033b9b12a38fc1c6_121_0.png)![](img/7705a881c3cbfe9033b9b12a38fc1c6_121_1.png)


    ## 第章 Cookie：维护状态


    ### 创建和删除 Cookie 110


    Cookie 是文档对象的一个属性。Cookie 属性的值由一个字符串组成。在大多数情况下，创建 Cookie 仅涉及创建一个 Cookie 名称及其关联的值。在本示例中，Cookie
    属性被设置为包含一个名为 `username` 且值为 `clara` 的 Cookie：


    `document.cookie = "username=clara";`


    Cookie 中的可选信息可以指定它的过期时间。过期日期后，浏览器会自动删除该 Cookie。如果没有指定过期日期，Cookie 将访问者退出或关闭 Web
    浏览器时过期。


    `document.cookie = "username=clara; expires=Mon, 18-Jun-01 00:00:01 GMT";`


    过期日期始终以 GMT（格林尼治时间）表示。要将本地时间转换为 GMT，可以使用如下代码所示的语句序列。该序列通过查找自 1970 年 1 月 1 日以来经过的毫秒数（`getTime()`
    方法），并加上一年的毫秒数（365*24*60*60*1000），来创建一个一年后的过期日期。`toGMTString()` 方法将新日期转换为 GMT。


    ```javascript

    var expirationdate = new Date();

    var oneyear = expirationdate.getTime() + (365 * 24 * 60 * 60 * 1000);

    expirationdate.setTime(oneyear);

    document.cookie = "username=clara; expires=" + expirationdate.toGMTString();

    ```


    路径和域信息有时会被添加到 Cookie 中，以指定授权检索 Cookie 的页面位置。如果未设置这些选项，则假设创建 Cookie 的页面的位置和域。


    `document.cookie = "username=clara; expires=Mon, 18-Jun-01 00:00:01 GMT; path=/aw;
    domain=stevenestrella.com";`


    最后，你可能要求在发送 Cookie 之前使用安全通道（HTTPS 协议）。


    `document.cookie = "username=clara; expires=Mon, 18-Jun-01 00:00:01 GMT; path=/aw;
    domain=stevenestrella.com; secure`


    浏览器以纯文本存储 Cookie。Cookie 的具体外观在不同浏览器之间会有不同。以下 Cookie 记录来自 Netscape Communicator
    4.7 的 Cookie 文本文件。它们是由位于 stevenestrella.com 的 /aw 目录下的页面创建的。既没有设置过期日期也没有设置 secure
    选项，这就是为什么每个 Cookie 记录中会出现两次 FALSE。


