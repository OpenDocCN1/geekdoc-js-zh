    \ `location` 对象，你在第五章中遇到过它。`location` 对象是当前窗口加载的 URL。`location` 对象的 `href` 属性包含整个\
    \ URL。将 `href` 属性更改为不同的 URL会导致窗口加载不同的页面。在列表 8.1 中，创建了一个名为 `myWindow` 的新窗口。要更改新窗口的\
    \ URL，可以使用如下语句：\n\n`myWindow.location.href = \"someURL.html\";`\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_152_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_152_1.png)\n\
    \nJavaScript 与框架\n\n141\n\nwindow 对象有一个非常有用的 `history` 对象，它存储了最近加载到窗口的页面列表。要导航到列表中的任何页面，请使用以下语句并用正整数或负整数作为参数。\n\
    \n`window.history.go(integer);`\n\n例如，`window.history.go(-3)` 产生的结果类似于点击了三次“后退”按钮。\n\
    \n框架在各种大小的网站中都很常见。一种典型的布局由一组两个框架（称为 `frameset`）组成：左侧是导航框架，右侧是内容框架。列表 8.3 创建了一组名为\
    \ `navigation` 和 `content` 的两个框架，帮助访问者查看第二章中的列表。列表 8.4 显示了将出现在导航框架中的 `navbar.html`\
    \ 文件。列表 8.5 显示了最初加载到内容框架中的 `home.html` 文件的代码。\n\n```html\n<head><title>Frameset\
