    Type your favorite color here.\"></p>\n    <ol>\n        <li>Click this button\
    \ to make your cookies.<br>\n        <input type=\"button\" value=\"Make Cookies\"\
    \ onclick=\"makeCookies();\"></li>\n        <li>Go to any other page on the internet.</li>\n\
    \        <li>Click the back button to return to this page and see your cookies.</li>\n\
    \    </ol>\n    <br><br>\n    <hr>\n    <p>Cookies will appear here.</p>\n   \
    \ <p><input type=\"text\" name=\"visitorcookie\" size=\"35\" value=\"\">\n   \
    \ <input type=\"text\" name=\"colorcookie\" size=\"20\" value=\"\"></p>\n</form>\n\
    </body>\n</html>\n```\nListing 7.2 A Simple Page to Set Two Cookies\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_126_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_126_1.png)\n\
    \nFigure 7.1 shows the output of Listing 7.2.\n\nFigure 7.1 Output of Listing\
    \ 7.2 Showing Retrieved Cookies\n\n### How Does It Work?\n\n1. The mylibrary.js\
    \ file is loaded into memory when the HEAD loads. When the page finishes loading,\
    \ an onload handler in the BODY tag calls the showCookies() function. The showCookies()\
    \ function calls the GetCookie() function to see whether the cookies visitor and\
    \ colorchoice exist. If either of these cookies exists, the showCookies() function\
    \ displays the cookie values in the visitorcookie and colorcookie fields.\n2.\
    \ The visitor types a name and color choice and clicks the Make Cookies button.\n\
    3. The makeCookies() function places the values the visitor typed into two variables:\
    \ visitorname and visitorcolor.\n4. The SetCookie() function, stored in mylibrary.js,\
    \ is called with the word visitor as the cookie name and the variable visitorname\
    \ as the cookie value.\n5. The SetCookie() function, stored in mylibrary.js, is\
    \ called with the word colorchoice as the cookie name and the variable visitorcolor\
    \ as the cookie value.\n6. An alert notifies the visitor that his cookies have\
    \ been created.\n7. The visitor browses any other page on the Web and then returns\
    \ to this page.\n8. The onload handler calls the showCookies() function and retrieves\
    \ the information found in the cookies.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_127_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_127_1.png)\n\
    \n## Customizing a Web Page with Cookies\n\nNow that you have built a simple page\
    \ to set and get cookies, you can build a slightly more elaborate page. Listing\
    \ 7.3 builds a page that automatically sets the background color to the visitor's\
    \ preferred color and displays a welcome message that includes the date the visitor\
    \ last visited the page.\n"
