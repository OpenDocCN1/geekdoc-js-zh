    \n11. 如果 `NumbersOnly` 中的字符数为 10 个或更多，将创建变量来存储 `NumbersOnly` 的区号、交换局和分机部分。会创建另一个变量\
    \ `newNumber`，用于包含格式化后的区号、交换局和分机组合，并带有完整的括号和连字符。\n\n12. 将电话字段的值更改为 `newNumber`。访问者的号码将重新格式化以符合美国电话标准并显示在屏幕上。\n\
    \n使用单选按钮\n\n典型的问卷包含一些只有有限数量答案才有意义的问题。例如，关于性别的问题只能用“男性”或“女性”回答。在这种情况下，使用开放式文本字段几乎意义。相反，你可以使用单选按钮，这是一系列提供互斥选择的按钮。列表\
    \ 3.4 展示了你如何确定访问者点击的单选按钮所关联的值。\n\n```html\n<html><head><title>单选按钮表单验证</title>\n\
    <script type=\"text/javascript\" language=\"JavaScript\">\n/* getRadioValue 函数\
    \ - 存储在 mylibrary.js 中 */\nfunction getRadioValue(formname,radioname) {\n  var\
    \ theRadioButtons = document[formname][radioname];\n  for (i=0;i<theRadioButtons.length;i++)\
    \ {\n    if (theRadioButtons[i].checked) {\n      return theRadioButtons[i].value;\n\
    \    }\n  }\n}\n\n/* showRadioValue 函数 - 存储在 mylibrary.js 中 */\nfunction showRadioValue(formname,radioname,thevalue)\
    \ {\n  var theRadioButtons = document[formname][radioname];\n  for (i=0;i<theRadioButtons.length;i++)\
    \ {\n    var temp = theRadioButtons[i].value;\n    if (temp == thevalue) {\n \
    \     theRadioButtons[i].checked = true;\n    }\n  }\n}\n```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_54_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_54_1.png)\n\
    \n使用单选按钮\n43 SSI\n\n```javascript\nfunction validate() {\n  var chosenGender =\
    \ getRadioValue(\"survey\",\"gender\");\n  if (chosenGender==null) {\n    alert(\"\
    这是一个棘手的问题吗？\");\n    return false;\n  }\n  if (chosenGender == \"male\") {\n \
    \   document.survey.feedback.value = \"感谢您，先生。\";\n  } else {\n    document.survey.feedback.value\
    \ = \"感谢您，女士。\";\n  }\n  return true;\n}\n\nfunction changeGender() {\n  if (getRadioValue(\"\
    survey\",\"gender\")==null) {\n    document.survey.feedback.value = \"未指定性别。\"\
    ;\n    return;\n  }\n  if (getRadioValue(\"survey\",\"gender\")=='male') {\n \
    \   showRadioValue('survey','gender','female');\n    document.survey.feedback.value\
    \ = \"感谢您，女士。\";\n  } else {\n    showRadioValue('survey','gender','male');\n\
    \    document.survey.feedback.value = \"感谢您，先生。\";\n    return;\n  }\n}\n//-->\n\
    ```\n</script>\n</head>\n<body bgcolor=\"white\">\n<h1>访问者性别问卷</h1>\n<form action=\"\
    mailto:jsradio@stevenestrella.com\"\nmethod=\"POST\" enctype=\"text/plain\" name=\"\
    survey\"\nonsubmit=\"return validate();\">\n<p>姓名:<input type=\"text\" name=\"\
    visitor\" value=\"40\"></p>\n<p>性别:<input type=\"radio\" name=\"gender\" value=\"\
    male\">男性\n<input type=\"radio\" name=\"gender\" value=\"female\">女性</p>\n\n使用单选按钮\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_55_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_55_1.png)\n\
    \n44 第三章 处理表单\n\n使用单选按钮\n45 SSI\n\n你可能最早在高中代数中首次遇到“参数”（parameter）这个术语。参数是值的容器。你可以将参数看作变量的一种类型。例如，一个将华氏度转换为摄氏度的函数需要一个参数来存储温度值。表达式\
    \ `convertCelsius(temperature)` 调用该函数并传递找到的值。\n\n它是如何工作的？\n\n文档对象（document object）包含一个所有子对象的数组，包括名为\
    \ `survey` 的 FORM。`FORM` 反过来创建一个其所有子对象的数组，包括名为 `gender` 的单选按钮。单选按钮集是一个对象，然后存储在新变量\
    \ `theRadioButtons` 中，该变量本身是一个由两个按钮组成的数组：一个用于男性，一个用于女性。然后循环遍历 `theRadioButtons`\
    \ 的每个元素，以确定是否任何一个被选中。如果发现某个单选按钮被选中，它会将该按钮的值（男性或女性）返回给 `validate()` 函数，该函数将该值放入\
    \ `chosenGender`。如果没有单选按钮被选中，`chosenGender` 的值将为 `null`，意味着它是空的。注意 `null` 没有引号因为它不是文本字符串。相反，它表示值的缺失。\n\
    \n6. 代码的下一个部分包含三个条件结构，用于检查 `chosenGender` 中可能存在的三个值：`null`、`male` 或 `female`。\n\
    \n7. 如果没有单选按钮被选中，意味着 `chosenGender` 是空的。会出现一个带有指令的警告框。在访问者关闭警告框后，向调用该函数的 `FORM`\
    \ 对象返回 `false` 值，这将防止电子邮件的发送。脚本在返回值后立即结束，因此 `chosenGender` 不会被进一步测试。\n\n8. 如果\
    \ `chosenGender` 为 `male`，则将文本 `Thank you sir` 位于“Send Survey”按钮正下方的反馈字段中。\n\n\
    9. 如果 `chosenGender` 为 `female`，则将文本 `Thank you madame` 放入反馈字段中。\n\n10. 返回 `true`\
    \ 值给 `FORM` 对象，然后它通过电子邮件向 `ACTION` 属性中列出的地址发送表单内容。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_56_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_56_1.png)\n\
    \n"
