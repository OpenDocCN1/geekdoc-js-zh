    \ type=\"button\" name=\"Show\" value=\"\nShow Browser Info\" onclick=\"showInfo();\"\
    ></p>\n</form>\n</body>\n</html>\n\nListing 9.3 Browser Detection\n\nThe sniffer\
    \ script in Listing 9.3 will come in\n\nhandy for many uses. It's a good idea\
    \ to add this reusable code\n\nto your library.js file.\n\nLearn from the Best\n\
    \nThe browser detection script in Listing 9.3 is based on code made public\nby\
    \ Apple Computer on its developer site. Apple's version detects more browsers\
    \ and provides even more information. One of the great things about working with\
    \ JavaScript is that an enormous amount of sample code is available online at\
    \ sites such as http://developer.apple.com/, http://www.builder.com, and http://www.javascripts.com.\n\
    \nFigure 9.3 shows the output of Listing 9.3.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_171_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_171_1.png)\n\
    \nDetecting the Visitor's Browser and Platform \n\n160\n\nChapter Nine Applied\
    \ Web Techniques\n\n## Figure 9.3 Output of Listing 9.3 How Does It Work?\n\n\
    1. The first line of the SCRIPT in the HEAD creates a variable, app, to hold a\
    \ lowercase version of the text string describing the appName property of navigator\
    \ object. The navigator object represents the browser. The appName property holds\
    \ a text string such as Microsoft Internet Explorer or Netscape to describe the\
    \ browser.\n\n2. The variable UA is created to hold a lowercase version of the\
    \ text string describing the userAgent of the navigator object. This property\
    \ contains identifying information about the browser. The value returned will\
    \ vary (see 'Tip: User Agent Values for Popular Browsers\").\n\n3. The variable\
    \ IE is created and set to true if UA contains the text string ie. To determine\
    \ this, the familiar indexOf() method is used.\n\n4. A variable called isNS is\
    \ created and set to true if UA contains the text string mozilla.\n\n5. Netscape\
    \ uses the mozilla trade name, but other browsers include the words mozilla and\
    \ compatible in their userAgent properties. As a result, it is necessary to test\
    \ for the presence of compatible in UA. If it's found, the browser is not a Netscape\
    \ browser and isNS is set to false.\n\nDetecting the Visitor's Browser and Platform\
    \ \n\n161\n\n6. The variable platform is created to hold information about the\
    \ hardware and operating system in use. The platform property of the navigator\
    \ object returns values such as Win32 (for recent versions of Windows) and MacPPC\
    \ (for recent versions of Macintosh).\n\n7. Variables are established to hold\
    \ Boolean values that identify the platform and the various versions of popular\
    \ operating systems. Because of the popularity of the X-Windows graphical browser\
    \ on the various versions of UNIX, you can test for the UNIX platform by searching\
    \ for the unix string in UA.\n\n8. A version variable is created to hold the version\
    \ number information available in the appVersion property of the navigator object.\
    \ The isMajor variable is created to hold the integer portion of the version number.\n\
    \n9. Internet Explorer 5 on the Macintosh and Netscape 6 on both platforms report\
    \ their version numbers incorrectly. As a result, two short conditional structures\
    \ identify the browser and platform and, if necessary, adjust the version number.\n\
    \n10. The isMinor holds the full version number.\n\n11. The obsolete variable\
    \ is created to hold a Boolean value that indicates whether the browser is recent.\
    \ Your viewpoint on what is obsolete may be different. Only a few browsers, such\
    \ as Netscape 6 and Internet Explorer 5, use the new Document Object Model (DOM1)\
    \ sanctioned by the World Wide Web consortium. All DOM1 browsers recognize the\
    \ getElementById() method of the document object. Those that do not are tagged\
    \ as obsolete in this code snippet.\n\n12. A function showInfo() is created to\
    \ assemble a text string to report the browser and platform information. The showInfo()\
    \ function is called when the visitor clicks the Show Browser Info button. If\
    \ the variable obsolete evaluates as true, the visitor is cajoled into upgrading\
    \ his browser.\n\nTip User Agent Values for Popular Browsers\n\nInternet Explorer\
    \ 5 on the Macintosh: mozilla/4.0 (compatible; msie)\nInternet Explorer 5 on Windows:\
    \ mozilla/4.0 (compatible; msie)\nNetscape 4 on the Macintosh: mozilla/4.77 (macintosh)\n\
    Netscape 4 on Windows: mozilla/4.77 (windows)\nNetscape 6 on the Macintosh: mozilla/6.1\
    \ (macpc)\nNetscape 6 on Windows: mozilla/6.1 (windows)\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_172_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_172_1.png)\n\
    \nDetecting the Visitor's Browser and Platform \n\n162\n"
