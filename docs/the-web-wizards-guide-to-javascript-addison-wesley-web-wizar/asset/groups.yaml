    \nCreating a Simple Rollover \n\n62 \n\nChapter Four Image Swapping \n\n☆ \n\n\
    ★ \n\nTo learn how to create a navigation page with multiple rollover images \n\
    \nTo understand how to create a double-rollover page \n\nCreating a Simple Rollover\
    \ \n\nLet's begin with a simple example. Figure 4.1 shows two image files created\
    \ with \n\nthe text tool in a graphics program. The image on the left depicts\
    \ the word \n\nBeethoven in a stylized typeface with a nice drop-shadow effect.\
    \ The image on the \n\nright is exactly the same size and adds a glow effect.\
    \ \n\nFigure 4.1 Two Versions of a Simple Image \n\nListing 4.1 creates a simple\
    \ page to display the first image. Note that the SRC \n\nproperty of the IMG tag\
    \ indicates that the image file beethovenof f . jpg resides \n\nin a folder called\
    \ images located in the same folder as the HTML file itself. \n\nAlso note that\
    \ the name property is set to beethoven. When the Web brows¬ \n\ner loads this\
    \ page, an image object called beethoven will exist in the browser's \n\nmemory.\
    \ This object can be referenced in JavaScript as either \n\ndocument. beethoven\
    \ or document \\[ ' beethoven ' \\]. \n\n\\*£? The form document\\[ 'beethoven'\
    \ \\] is much more useful because it \n\nrefers to the 'beethoven' object as one\
