    ## Chapter Seven: Maintaining State


    ### Objectives


    - To understand the nature and limitations of cookies

    - To discover how to create and delete cookies

    - To learn how to set and retrieve your preferences in cookies

    - To understand how to customize your Web page using cookies

    - To learn how to create a simple shopping cart with cookies


    ### What Are Cookies?


    In the parlance of the Internet, there are servers and clients. Servers are computers
    that store and transmit Web pages. Clients are the computers that receive and
    display these pages. A Web browser is often referred to as client software.


    Suppose you''re managing a Web site with a members-only section. A page sent by
    a server may contain a login form that appears on the client. The visitor using
    the client software (the browser) fills out the form with a name and password.
    The information is then sent back to the server for storage in a database. Each
    time the visitor returns to your page, he must remember his name and password
    to log in.


    Now imagine that the visitor could click a button on your login screen to store
    the name and password conveniently on his hard drive. Now each time he visits,
    the client software automatically retrieves the name and password and sends it
    to the server.


    Cookie is a computer science term that refers to a piece of data held by an intermediary.
    In this case, the visitor''s hard drive is the intermediary positioned between
    the client and the server. Cookies are actually small chunks of text usually stored
    in a plain old text file on the hard drive of the client. In the early 1990s,
    Lou Montuili created the original cookie specification for Netscape Navigator
    1.0, the first browser to have this feature.


    Most major Web sites use cookies to personalize the browsing experience for each
    visitor. A customized start page is a common example. Yahoo, Excite, Netscape,
    and many others allow visitors to create such pages. These pages allow you to
    set preferences and then display, for example, your local weather, links to your
    favorite sites, even a table showing your stock portfolio. The first time you
    access your new start page, you type a user name and password. Each subsequent
    time you visit, however, no login is necessary because a cookie on your hard drive
    contains the login information. The client software matches the site address of
    the page with the site address stored in the cookie. If they match, the client
    software transmits the cookie containing the login information to the server.

