    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_22_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_22_1)\n\
    \nJavaScript 基础概念\n11\n\n### 函数\n\n函数是一组执行指定任务的语句组。函数通常存储在 HTML 文档的 HEAD 部分，并在被其他\
    \ JavaScript 语句调用（即调用）时执行工作。\n\n```javascript\nfunction doSomething(){\nvar theVisitor\
    \ = document.myform.visitor.value;\nwindow.alert(\"Is this OK, \" + theVisitor\
    \ + \"?\");\n}\n```\n\n这是一个简单的示例。列表 1.3 中的 HTML 代码创建了一个表单，包含一个供访问者输入的地方和一个点击按钮（见图\
    \ 1.4）。当点击按钮时，就会调用 `doSomething` 函数，并显示包含访问者名字的警告框。警告框是由窗口 对象的 `alert` 方法生成的。`alert`\
    \ 方法接收一个值，该值由字符串加上页面用户名字段中输入的任何值以及一个问号组成。结果以警告框的形式显示。\n\n"
