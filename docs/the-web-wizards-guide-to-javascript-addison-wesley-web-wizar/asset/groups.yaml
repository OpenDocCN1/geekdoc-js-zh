- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_89_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_89_1.png)\n\
    \n78\n\n## Chapter Five More Image Swapping\n\n### 11 If-Else Made Easier\n\n\
    The showSlide() function introduces a shortcut form of the if-else structure that\
    \ uses the \nconditional operator (the question mark).\n\n`(slidenumber == totalSlides)\
    \ ? slidenumber = 1 : slidenumber++;`\n\nEverything before the question mark is\
    \ the condition. If the condition is true, the \nstatement before the colon (:)\
    \ is executed. Otherwise, the statement after the colon is\nexecuted.\n\nFigure\
    \ 5.1 shows the output of Listing 5.1.\n\nFigure 5.1 Output of Listing 5.1\n\n\
    How Does It Work?\n\n1. The browser loads the HEAD and stores six new image objects\
    \ in an array \ncalled mySlides beginning at array element 1. The SRC property\
    \ of each \nimage is filled with a .jpg file located in the images folder. This\
    \ step \neffectively preloads all the images.\n\nTIP Note that each image in the\
    \ series must be exactly the same width and height.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_90_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_90_1.png)\n\
    \n79\n\nCreating a Slide Show\n\n2. The browser stores all the captions in an\
    \ array called myCaptions beginning \nwith array element 1. Each caption is a\
    \ simple text string. Notice the use of \nthe add-by-value operator (+=) to store\
    \ the long caption for the first image in \nmyCaptions[1].\n\n3. A global variable,\
    \ slidenumber, is created to hold the number of the current \nslide. A second\
    \ global variable, totalSlides, is created to hold the \nnumber of slides in the\
    \ presentation. Because element 0 of the mySlides \narray is not used, we must\
    \ subtract 1 from the length of the array to determine \nthe number of slides.\n\
    \n4. The function showSlide(direction) is stored in memory and will perform \n\
    its tasks when called upon later.\n\n5. The BODY of the document includes an image\
    \ called slideframe and a \nFORM called slidecontrols. Within the FORM is a TEXTAREA\
    \ called \ncaption set to display 2 rows and 50 columns of text. An initial text\
    \ string \ninforms the visitor that the slide show begins with the flag of India.\
    \ The FORM \nalso includes two buttons. The first button calls the showSlide()\
    \ function \nand sends it the value previous. The second button calls the \nshowSlide()\
    \ function and sends it the value next.\n\n6. The showSlide() function in the\
    \ HEAD takes the value of the parameter it \nreceives (previous or next) and places\
    \ it in a temporary variable called \ndirection. If direction is next, the function\
    \ looks to see whether the \ncurrent slide number (stored in the global variable\
    \ slidenumber) is the last \nslide in the series. If it is, slidenumber is reset\
    \ to 1. Otherwise, slidenumber \nis incremented by 1. If direction is previous,\
    \ the function looks to \nsee whether the current slide number (stored in the\
    \ global variable \nslidenumber) is the first slide in the series. If it is, slidenumber\
    \ is set to \nthe total number of slides. Otherwise, slidenumber is decremented\
    \ by 1. \nWith this technique, the slide show wraps around from the last image\
    \ to the \nfirst.\n\n7. The showSlide() function checks to make sure that the\
    \ browser supports \nthe images array. It then uses the current value of slidenumber\
    \ to determine \nwhich element of the mySlides array and which element of\nmyCaptions\
    \ array to display. Finally, slidenumber is also displayed in the \nfield called\
    \ currentslide so that the visitor will see the number of \ncurrent slide.\n\n\
    This slide show technique is useful for building pages where you want the \nvisitor\
    \ to proceed through a series of images by clicking buttons. Corporate \npresentations,\
    \ travel logs, and demonstrations are some of the possible applications.\nSometimes,\
    \ however, it's desirable for the images to change at predetermined intervals\
    \ to \nproduce an animation. We take a look at that.\n\nCreating a Slide Show\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_91_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_91_1.png)\n\
    \n80\n\nCreating Animated Advertising Banners\n\nDuring the dot-com mania of the\
    \ late 1990s, a new form of advertising was born.\nAnimated banner images were\
    \ created to encourage Web visitors to link to sites displaying\nrelated information\
    \ or products. For example, let's look at a page about music\nhistory that has\
    \ an ad banner to encourage the visitor to use an online dictionary\nof composers.\
    \ The banner consists of the dictionary's logo followed by a series of three composer\
    \ names. If the visitor clicks on the dictionary logo, the dictionary home page\
    \ loads. If the visitor clicks on a name, the appropriate biography page loads.\
    \ Listing 5.2 demonstrates this banner using some familiar image from Chapter\
    \ Four.\n\n```html\n<html>\n<head>\n<title>Rotating Ad</title>\n<script language=\"\
    JAVASCRIPT\" type=\"text/javascript\">\nvar myAds = new Array();\nmyAds[1] = new\
    \ Image();\nmyAds[2] = new Image();\nmyAds[3] = new Image();\nmyAds[4] = new Image();\n\
    myAds[1].src = \"images/composerdictionary.jpg\";\nmyAds[2].src = \"images/bachoff.jpg\"\
    ;\nmyAds[3].src = \"images/mozartoff.jpg\";\nmyAds[4].src = \"images/beethovenoff.jpg\"\
    ;\n\nvar myTimings = new Array();\nmyTimings[1] = 3000;\nmyTimings[2] = 1500;\n\
    myTimings[3] = 1500;\nmyTimings[4] = 1500;\n// The timings represent the number\
    \ of milliseconds delay between the images.\n\nvar my = new Array();\nmySites[1]\
    \ = \"http://www.stevenestrella.com/composers\";\nmySites[2] = \"http://www.stevenestrella.com/bach.html\"\
    ;\nmySites[3] = \"http://www.stevenestrella.com/mozart.html\";\nmySites[4] = \"\
    http://www.stevenestrella.com/beethoven.html\";\n\nvar adnumber = 0;\nvar totalads\
    \ = myAds.length - 1;\nvar timerID = \"\";\n\nfunction startBanner() {\n    adnumber\
    \ = 0;\n    showAd();\n}\n\nfunction showAd() {\n    if (document.images) {\n\
    \        if (document.myBanner.complete) {\n            adnumber++;\n        \
    \    (adnumber > totalads) ? adnumber = 1 : adnumber = adnumber;\n           \
    \ document.myBanner.src = myAds[adnumber].src;\n        }\n        timerID = setTimeout(\"\
    showAd()\", myTimings[adnumber]);\n    }\n}\n\nfunction goSite() {\n    clearTimeout(timerID);\n\
    \    window.location.href = mySites[adnumber];\n}\n</script>\n</head>\n<body bgcolor=\"\
    #FFFFFF\" onload=\"startBanner();\">\n<div align=\"CENTER\">\n    <a href=\"http://www.stevenestrella.com/composers\"\
    \ onclick=\"goSite();return false;\">\n        <img src=\"images/composerdictionary.jpg\"\
    \ name=\"myBanner\" width=\"250\" height=\"70\" border=\"0\" alt=\"composer dictionary\"\
    >\n    </a>\n</div>\n</body>\n</html>\n```\n\nListing 5.2 An Animated Banner Advertisement\n\
    \nOlder browsers ignore the onclick handler and load the URL from the HREF attribute.\n\
    Newer browsers support the onclick handler and call the goSite() function to load\
    \ the\nappropriate URL. The statement return false; ensures that the URL from\
    \ the HREF\nattribute will NOT be loaded on new browsers.\n\nThis condition ensures\
    \ that each image loads completely before the next image appears in the sequence.\n\
    \nFigure 5.2 shows the output of Listing 5.2.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_93_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_93_1.png)\n\
    \n82\n\nChapter Five More Image Swapping\n\nFigure 5.2 Output of Listing 5.2 with\
    \ All Images\n"
  mdcn: "\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_89_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_89_1.png)\n\
    \n78\n\n## 第五章 更多图片切换\n\n### 11 让 If-Else 变得简单\n\n`showSlide()` 函数引入了 if-else\
    \ 结构的简写形式，它使用了条件运算符（问号）。\n\n`(slidenumber == totalSlides) ? slidenumber = 1 :\
    \ slidenumber++;`\n\n问号之前的内容是条件。如果条件为真，则执行冒号（:）之前的语句。否则，执行冒号之后的语句。\n\n图 5.1 显示了列表\
    \ 5.1 的输出。\n\n图 5.1 列表 5.1 的输出\n\n它是如何工作的？\n\n1. 浏览器加载 HEAD 部分，并在一个名为 `mySlides`\
    \ 的数组中存储六个新的图片对象，从数组元素 1 开始。每个图片的 `SRC` 属性都填充了位于 images 文件夹中的 .jpg 文件。这一步骤有效地预加载了所有图片。\n\
    \n提示 注意系列中的每张图片的宽度和高度必须完全相同。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_90_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_90_1.png)\n\
    \n79\n\n创建幻灯片\n\n2. 浏览器将所有说明存储在一个名为 `myCaptions` 的数组中，从数组元素 1 开始。每个说明都是简单的文本字符串。注意使用值加运算符（+=）将第一个图片的详细说明存储在\
    \ `myCaptions[1]` 中。\n\n3. 创建一个全局变量 `slidenumber` 来存储当前幻灯片的编号。创建第二个全局变量 `totalSlides`\
    \ 来存储演示中幻灯片的总数。由于 `mySlides` 数组的元素 0 未被使用，我们必须从数组长度中减 1 来确定幻灯片的数量。\n\n4. 函数 `showSlide(direction)`\
    \ 被存储在内存中，并在以后被调用时执行其任务。\n\n5. 文档的 `BODY` 包括一个名为 `slideframe` 的图片和一个名为 `slidecontrols`\
    \ 的 `FORM`。表单内有一个名为 `caption` 的 `TEXTAREA`，设置为显示 2 行 50 列。初始文本字符串告知访问者幻灯片从印度国旗开始。表单还包含两个按钮。第一个按钮调用\
    \ `showSlide()` 函数并向其发送 `previous` 值。第二个按钮调用 `showSlide()` 函数并向其发送 `next` 值。\n\
    \n6. HEAD 中的 `showSlide()` 函数获取接收到的参数值（previous 或 next），并将其放在一个名为 `direction`\
    \ 的临时变量中。如果 `direction` 为 `next`，函数检查当前幻灯片编号（存储在全局变量 `slidenumber` 中）是否为系列中的最后一张图片。如果是，`slidenumber`\
    \ 重置为 1。否则，`slidenumber` 加 1。如果 `direction` 为 `previous`，函数检查当前幻灯片编号（存储在全局变量 `slidenumber`\
    \ 中）是否为系列中的第一张图片。如果是，`slidenumber` 设置为幻灯片的总数。否则，`slidenumber` 减 1。通过这种技术，幻灯片会从最后一张图片循环回到第一张。\n\
    \n7. `showSlide()` 函数检查浏览器是否支持图片数组。然后使用 `slidenumber` 的当前值来确定显示 `mySlides` 数组的哪个元素以及\
    \ `myCaptions` 数组的哪个元素。最后，`slidenumber` 也显示在名为 `currentslide` 的字段中，以便访问者看到当前幻灯片的编号。\n\
    \n这种幻灯片技术用于构建你希望访问者通过点击按钮浏览一系列图片的页面。公司演示、旅行日志和演示都是一些可能的应用。然而，有时我们希望图片按预定间隔发生变化以产生动画。我们来看一下。\n\
    \n创建幻灯片\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_91_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_91_1.png)\n\
    \n80\n\n创建动画广告横幅\n\n在 20 世纪 90 年代末的 dot 热期间，一种新型广告形式诞生了。创建动画横是为了鼓励 Web 访问者访问显示相关信息或产品的网站。例如，让我们看一个关于音乐历史的页面，它有一个广告横幅鼓励访问者使用在线作曲家字典。横幅由字典\
    \ Logo 开头，随后是三个作曲家的名字。如果访问者点击字典 Logo，就会加载字典首页。如果访问者点击某个名字，就会加载相应的传记页。列表 5.2 使用第四章中一些熟悉的图片演示了此横幅。\n\
    \n```html\n<html>\n<head>\n<title>Rotating Ad</title>\n<script language=\"JAVASCRIPT\"\
    \ type=\"text/javascript\">\nvar myAds = new Array();\nmyAds[1] = new Image();\n\
    myAds[2] = new Image();\nmyAds[3] = new Image();\nmyAds[4] = new Image();\nmyAds[1].src\
    \ = \"images/composerdictionary.jpg\";\nmyAds[2].src = \"images/bachoff.jpg\"\
    ;\nmyAds[3].src = \"images/mozartoff.jpg\";\nmyAds[4].src = \"images/beethovenoff.jpg\"\
    ;\n\nvar myTimings = new Array();\nmyTimings[1] = 3000;\nmyTimings[2] = 1500;\n\
    myTimings[3] = 1500;\nmyTimings[4] = 1500;\n// 计时代表图片之间的毫秒延迟时间。\n\nvar my = new\
    \ Array();\nmySites[1] = \"http://www.stevenestrella.com/composers\";\nmySites[2]\
    \ = \"http://www.stevenestrella.com/bach.html\";\nmySites[3] = \"http://www.stevenestrella.com/mozart.html\"\
    ;\nmySites[4] = \"http://www.stevenestrella.com/beethoven.html\";\n\nvar adnumber\
    \ = 0;\nvar totalads = myAds.length - 1;\nvar timerID = \"\";\n\nfunction startBanner()\
    \ {\n    adnumber = 0;\n    showAd();\n}\n\nfunction showAd() {\n    if (document.images)\
    \ {\n        if (document.myBanner.complete) {\n            adnumber++;\n    \
    \        (adnumber > totalads) ? adnumber = 1 : adnumber = adnumber;\n       \
    \     document.myBanner.src = myAds[adnumber].src;\n        }\n        timerID\
    \ = setTimeout(\"showAd()\", myTimings[adnumber]);\n    }\n}\n\nfunction goSite()\
    \ {\n    clearTimeout(timerID);\n    window.location.href = mySites[adnumber];\n\
    }\n</script>\n</head>\n<body bgcolor=\"#FFFFFF\" onload=\"startBanner();\">\n\
    <div align=\"CENTER\">\n    <a href=\"http://www.stevenestrella.com/composers\"\
    \ onclick=\"goSite();return false;\">\n        <img src=\"images/composerdictionary.jpg\"\
    \ name=\"myBanner\" width=\"250\" height=\"70\" border=\"0\" alt=\"composer dictionary\"\
    >\n    </a>\n</div>\n</body>\n</</html>\n```\n\n列表 5.2 动画广告横幅\n\n旧浏览器忽略 `onclick`\
    \ 处理器并加载 HREF 属性中的 URL。新浏览器支持 `onclick` 处理器并调用 `goSite()` 函数来加载相应的 URL。`return\
    \ false;` 语句确保在新浏览器中不会加载 HREF 属性中的 URL。\n\n此条件确保了每张图片在序列中的下一张出现之前完全加载。\n\n图 5.2\
    \ 显示了列表 5.2 的输出。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_93_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_93_1.png)\n\
    \n82\n\n第五章 更多图片切换\n\n图 5.2 显示所有图片的列表 5.2 输出\n\n"
