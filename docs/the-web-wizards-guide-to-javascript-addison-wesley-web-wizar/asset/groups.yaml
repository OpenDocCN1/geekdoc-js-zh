    \ `j` 表示）。此偏移量被传递给 `getCookieVal()` 函数，通过查看从偏移量字符开始的整个 cookie 字符串来提取该值。\n\n3.\
    \ `getCookieVal()` 函数创建一个变量 `endstr` 来存储请求值中最后一个字符的字符数。它通过使用 `indexOf()` 方法定位由偏移参数所表示的字符数之后的第一个分号来实现这一点。如果没有分号，则从偏移量开始的值就是\
    \ cookie 中的最后一个值。在这种情况下，`indexOf()` 方法返回值为 -1，且 `endstr` 被 设置为匹配 cookie 的长度。最后，从偏移量开始到\
    \ `endstr` 结束的 cookie 子字符串被传递给 `unescape()` 函数。`unescape()` 函数将任何十六进制字符（如 %20）转换回可读文本。`Bob%20Fitch`\
    \ 返回为 `Bob Fitch`。\n\n4. `DeleteCookie()` 函数与 `SetCookie()` 函数相似。`DeleteCookie()`\
    \ 函数将过期日期设置为1970 年 1 月 1 日午夜后一秒。这是互联网时间的开始。每当浏览器启动时，都会删除所有过期的 cookie。将过期日期设置为过去的某个日期是删除\
    \ cookie 的标准方法。\n\n## 设置和获取你的第一个 Cookie\n\n现在你已经将代码列表 7.1 添加到 `mylibrary.js`，是时候创建你的第一个\
