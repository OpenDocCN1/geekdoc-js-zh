    \ value=\"1685\">1685</option>\n  <option value=\"1695\">1695</option>\n  <option\
    \ value=\"1725\">1725</option>\n  <option value=\"1750\">1750</option>\n</select>\n\
    \n<h4>问题 2：莫扎特的去世于哪一年？</h4>\n\n<select name=\"q2\">\n<option selected>选择一个答案</option>\n\
    \  <option value=\"1750\">1750</option>\n  <option value=\"1765\">1765</option>\n\
    \  <option value=\"1773\">1773</option>\n  <option value=\"1791\">1791</option>\n\
    \  <option value=\"1812\">1812</option>\n</select>\n\n<h4>问题 3：贝多芬的去世于哪一年？</h4>\n\
    \n<select name=\"q3\">\n<option selected>选择一个答案</option>\n  <option value=\"1770\"\
    >1770</option>\n  <option value=\"1791\">1791</option>\n  <option value=\"1827\"\
    >1827</option>\n  <option value=\"1833\">1833</option>\n  <option value=\"1841\"\
    >1841</option>\n</select>\n\n<hr>\n\n<p><input type=\"button\" value=\"检查答案\"\
    \ onclick=\"checkAnswers();\"></p>\n\n<p>你的分数是：<input type=\"text\" name=\"scorefield\"\
    \ value=\"\" size=\"10\"></p>\n\n</form>\n\n</body>\n\n</html>\n\nListing 3.7\
    \ 带有选择菜单的测验\n"
