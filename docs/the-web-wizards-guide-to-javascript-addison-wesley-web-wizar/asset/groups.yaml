    \ Web pages. \n\nThere are many great reasons for learning JavaScript. \n\nVirtually\
    \ all Web browsers support JavaScript. \n\nJavaScript is a very popular language.\
    \ As a result, hundreds of scripts are \n\navailable for download at JavaScript\
    \ sites. You can learn from the work of \n\nothers. \n\nAn increasing number of\
    \ multimedia authoring programs, such as \n\nMacromedia Flash and Macromedia Director,\
    \ rely on JavaScript or JavaScript- \n\nlike languages to create interactivity\
    \ and enhance interfaces. \n\nJavaScript lets you use external code libraries\
    \ (. js files), encouraging \n\nreusable code. \n\nThe syntax of JavaScript is\
    \ very similar to the syntax of C, C++, and Java. The \n\ntime you invest in learning\
    \ JavaScript will bear fruit for years to come. \n\nitf Learning a programming\
    \ language is good for the mind. To succeed in pro¬ \n\ngramming, you must use\
    \ creative problem solving and logical thinking. The \n\nstudy of programming\
    \ encourages you to develop these abilities. \n\nA Little History \n\nOriginally\
    \ called LiveScript, JavaScript was invented by Brendan Eich at Netscape \n\n\
    in 1995. Netscape and Sun Microsystems worked together to include JavaScript in\
    \ \n\nthe Netscape Navigator 2.0 Web browser. The name change capitalized on the\
    \ mar¬ \n\nketing hype surrounding Sun's Java language. \n\nJavaScript's popularity\
    \ increased with \n\nthe introduction of Netscape Navigator 3.0. \n\nWeb page\
    \ authors began to include image \n\nswapping, scrolling text in the status bar,\
    \ \n\nform validation, and other dynamic effects. \n\nShortly thereafter, Microsoft's\
    \ Internet \n\nExplorer 3.0 introduced a competing lan¬ \n\nguage, JScript, which\
    \ was almost identical \n\nto the original LiveScript language. The dif¬ \n\n\
    ferences between JavaScript and JScript are largely inconsequential. Both are\
    \ script¬ \n\ning languages. Scripts in the theater world direct the actions of\
    \ players on a stage. \n\nScripts in the Web world direct the behavior of objects\
    \ (documents, images, \n\nforms, etc.) loaded in a Web browser's window. Unfortunately,\
    \ these objects were \n\nWARNING JavaScript is not Java! The lan¬ \n\nguages are\
    \ similar in appearance and structure, \n\nbut Java is a full-featured, structured\
    \ program¬ \n\nming language similar in scope to C or C++. \n\nJavaScript, on\
    \ the other hand, is a small scripting \n\nlanguage designed to enhance Web pages.\
    \ The \n\nmost relevant difference for you is that JavaScript \n\nis much easier\
    \ to learn."
- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_14_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_14_1.png)\n\
    \n3 \n\n## Fundamental Concepts of JavaScript\n\nMS of JavaScript was organized\
    \ very differently in Netscape Navigator 3 and Internet Explorer 3. As a result,\
    \ the procedures for using JScript in Internet Explorer were different from the\
    \ procedures for using JavaScript in Netscape Navigator. As the browsers developed,\
    \ the languages began to diverge to accommodate the different object models of\
    \ the two browsers.\n\nA European computer standards group known only as ECMA\
    \ (pronounced \"Eckma\") worked with Netscape and Microsoft to produce a standard\
    \ scripting language called ECMAScript in 1997. Both Netscape Communicator 4 and\
    \ Internet Explorer 4 implemented ECMAScript as the foundation for the latest\
    \ versions of JavaScript and JScript. Using ECMA and a little creativity, Web\
    \ authors gradually developed programming practices that worked equally well with\
    \ the object models of both browsers. Those are the practices that you'll learn\
    \ in this book.\n\n### Fundamental Concepts of JavaScript\n\nAs you read the following\
    \ overview of JavaScript concepts and vocabulary, keep in mind that it's an introductory\
    \ reference. The first time each concept or term appears in subsequent chapters,\
    \ it will be explained in more detail. For now, review this section to get an\
    \ overview of the language.\n\n☆TIP The Web site for this book contains an interactive\
    \ version of this overview to assist you in understanding the concepts. Visit\
    \ http://www.awl.com/estrella.\n\n### Objects\n\nAn object is any definable thing.\
    \ A car is one example of an object in the physical world. A car may contain other\
    \ objects, such as a trunk. In turn, the trunk may contain other objects, such\
    \ as a spare tire.\n\nJavaScript is an object-oriented language. In JavaScript,\
    \ a hierarchy of objects is represented in code using dot syntax. For example,\
    \ here is how you might use dot syntax to represent a spare tire:\n\n`car.trunk.sparetire`\n\
    \nIn JavaScript, a Web browser window and a currently loaded HTML document are\
    \ examples of common objects created by the host environment (i.e., the Web browser\
    \ itself). The window contains the document, and the document may contain other\
    \ objects, such as images, forms, buttons, and links. In JavaScript, every object\
    \ can be given a name and referred to in the code using dot syntax. Here is an\
    \ example (illustrated in Figure 1.1):\n\n`window.document.gardendog`\n\n☆tip\
    \ Think of objects as the named \"gardendog\" in a document loaded in a Web browser\
    \ window.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_15_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_15_1.png)\n\
    \nChapter One JavaScript Basics\n4\n\nFundamental Concepts of JavaScript\n\nFigure\
    \ 1.1 An Image Object in a Web Browser Window\n\n### Instance\n\nAn instance is\
    \ one particular incarnation of an object. For example, a car is an object, and\
    \ the Beetle parked across the street is one instance of the car object. An instance\
    \ of an object inherits all the characteristics of the object type. For example,\
    \ if a car always has a trunk and a spare tire, any instance of the car object,\
    \ including my neighbor's Beetle, can be assumed to have these items.\n\n`Beetle.trunk.sparetire`\
    \ would be the code used to designate the spare tire in the trunk of a Beetle\
    \ (one instance of the more generic car object).\n\nIn the same way, a photograph\
    \ named \"gardendog\" loaded in a Web page is one instance of the more generic\
    \ image object.\n\n### Properties\n\nIn real life, instances of objects can also\
    \ have properties. An instance of the car object might have a property known as\
    \ color. That property would be referred to in JavaScript as\n\n`Beetle.color`\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_16_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_16_1.png)\n\
    \nFundamental Concepts of JavaScript\n\nSimilarly, in the JavaScript language,\
    \ each object can have many associated properties. For example, the document object\
    \ has a built-in property called bgColor (note the use of both upper- and lowercase\
    \ letters) that represents the background color:\n\n`window.document.bgColor`\n\
    \n### Values\n\nIn real life, properties have values. A car object may have a\
    \ property known as color with a value known as blue. If the owner of a Beetle\
    \ (an instance of the car object) paints the car a different color, he would assign\
    \ a new value to the color property. The following code assigns the value red\
    \ to the property color of the car object instance Beetle:\n\n`Beetle.color=\"\
    red\";`\n\nJavaScript objects also have properties, and you can assign values\
    \ to them. For example, the document object has a property called bgColor, which\
    \ represents the background color and can be assigned a value such as silver using\
    \ this JavaScript statement:\n\n`window.document.bgColor=\"silver\";`\n\nPerhaps\
    \ the most common use of JavaScript is to create rollover graphics, in which the\
    \ image changes when the viewer moves the mouse over it. This technique relies\
    \ on the SRC (source) property of the image object in JavaScript. The SRC property\
    \ has a value to indicate the location and name of a graphics file located on\
    \ the hard drive of the Web server.\n\nThe HTML page in Listing 1.1 presents an\
    \ image of a woman in a field of sunflowers (see Figure 1.2). The image is created\
    \ using the standard HTML tag IMG, which has the SRC property. In this example,\
    \ SRC has the value \"sunflowerlady.jpg,\" which indicates that an image file\
    \ called \"sunflowerlady.jpg\" resides in the same folder as the Web page itself.\
    \ Another property of the IMG tag is the NAME property, which here is set to the\
    \ value \"sunflowerphoto.\"\n\n```html\n<html>\n<head>\n<title>sunflower lady</title>\n\
    </head>\n<body bgcolor=\"white\">\n<img src=\"sunflowerlady.jpg\" width=\"300\"\
    \ height=\"200\" name=\"sunflowerphoto\">\n</body>\n</html>\n```\n\nListing 1.1\
    \ HTML Page with IMG Tag\n\nWhen this code is included in a Web page and loaded\
    \ into a window by a Web browser, an instance of the generic image object is created\
    \ and exists in the memory of the browser under the name sunflowerphoto.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_17_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_17_1.png)\n\
    \nFundamental Concepts of JavaScript\n\n6\n\nChapter One JavaScript Basics\n\n\
    Fundamental Concepts of JavaScript\n\n☆tip Think of objects as the named \"gardendog\"\
    \ in a document loaded in a Web browser window.\n\nFigure 1.1 An Image Object\
    \ in a Web Browser Window\n\nFigure 1.2 Close-up of the sunflowers\n\nFigure 1.3\
    \ Close-up of the sunflowers\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_18_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_18_1.png)\n\
    \n### Events and Event Handlers\n\nIn real life, instances of objects sometimes\
    \ encounter events. An event handler is the code that responds to events. In this\
    \ example, the blowout event is handled by an onmouseover handler, which responds\
    \ to the event by changing the value of the tire:\n\n`onmouseover=Beetle.shape=\"\
    flat\";`\n\nSimilarly, in the JavaScript language, each object can encounter many\
    \ events. One of the most common events is the mouseover event triggered when\
    \ a visitor moves the mouse on top of an object. The anchor tag (<a>) can be set\
    \ to respond to mouseover events. Any text or graphics enclosed by an anchor tag\
    \ can then be used to trigger the event.\n\nIn the following example, a link (the\
    \ <a> tag) is coded with the onmouseover handler to change the background color\
    \ of the page to silver when the visitor moves the mouse over the link.\n\n```html\n\
    <a href=\"#\" onmouseover=\"document.bgColor='silver'\">Roll over to change background\
    \ to silver</a>\n```\n\nTo implement the image swap, you use an IMG tag in place\
    \ of the text. Listing 1.2 sets up a rollover graphic. When the user moves the\
    \ mouse over the image, a mouseover event is generated. The anchor tag has an\
    \ event handler onmouseover to handle the mouseover event. The event handler sends\
    \ a single line of code to the browser to change the SRC property of the \"sunflowerphoto\"\
    \ image to display the close-up of the sunflowers.\n\nRead the code in Listing\
    \ 1.2. You may be surprised at how much you understand even this early in your\
    \ study of JavaScript.\n\nft ORCUT You will learn about image swapping in greater\
    \ detail in Chapters Four and Five. To create Listing 1.2 yourself, download the\
    \ two images from http://www.awl.com/estrella/, type the code into any text editor,\
    \ save it as a plain text file with the file extension .html, and open it in your\
    \ Web browser.\n\n^TIP in the code listings, the symbol -» indicates a line of\
    \ text that wraps (runs over) to the next line because of the line length limitations\
    \ of the printed page. It's important to avoid placing unnecessary carriage returns\
    \ in your code. A JavaScript statement with a carriage return in the middle won't\
    \ work properly in the Web browser.\n"
  mdcn: "\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_14_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_14_1.png)\n\
    \n3 \n\n## JavaScript 的基本概念\n\nJavaScript 的微软在 Netscape Navigator 3 和 Internet\
    \ Explorer 3 中的组织方式非常不同。因此，在 Internet Explorer 中使用 JScript 的步骤与在 Netscape Navigator\
    \ 中使用 JavaScript 的步骤不同。随着浏览器的发展，这两种语言开始分化，以适应这两个浏览器不同的对象模型。\n\n一个仅被称为 ECMA（读作\
    \ \"Eckma\"）的欧洲计算机标准组织与 Netscape 和微软合作，在 1997 年产出了一种名为 ECMAScript 的标准脚本语言。Netscape\
    \ Communicator 4 和 Internet Explorer 4 都将 ECMAScript 作为最新版本 JavaScript 和 JScript\
    \ 的基础。通过使用 ECMA 和一些创意，Web 开发者逐渐开发出了在两种浏览器对象模型中运行同样良好的编程实践。这些就是你将在本书中学习到的实践。\n\n\
    ### JavaScript 的基本概念\n\n在阅读以下 JavaScript 概念和词汇的概述时，请记住这是一份入门参考。当每个概念或术语在后续章节中首次出现时，将会有更详细的解释。现在，请回顾本节以概述该语言。\n\
    \n☆提示 本书的网站包含此概述的交互版本，以帮助你理解概念。访问 http://www.awl.com/estrella。\n\n### 对象\n\n对象是任何可以定义的实体。汽车是物理世界中对象的一个例子。汽车可能包含其他对象，例如后备箱。反之，后备箱可能包含其他对象，例如备胎。\n\
    \nJavaScript 是一种面向对象的语言。在 JavaScript 中，对象的层级结构在代码中使用点语法（dot syntax）表示。例如，这里是你可能如何使用点语法来表示备胎：\n\
    \n`car.trunk.sparetire`\n\n在 JavaScript 中，Web 浏览器窗口和当前加载的 HTML 文档是宿主环境（即 Web 浏览器本身）创建的常见对象示例。窗口包含文档，文档可能包含其他对象，如图像、表单、按钮和链接。在\
    \ JavaScript 中，每个对象都可以赋予一个名称，并在代码中使用点语法引用。以下是一个示例（如图 1.1 所示）：\n\n`window.document.gardendog`\n\
    \n☆提示将对象想象成 Web 浏览器窗口加载的文档中具命名的“gardendog”。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_15_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_15_1.png)\n\
    \n第一章 JavaScript 基础\n4\n\nJavaScript 的基本概念\n\n图 1.1 Web 浏览器窗口中的图像对象\n\n### 实例\n\
    \n实例是对象的一个特定化身。例如，汽车是一个对象，而停在街对面的甲虫汽车（Beetle）就是汽车对象的一个实例。对象的实例继承了对象类型的所有特征。例如，如果一辆汽车都有后备箱和备胎，那么汽车对象的任何实例（包括我邻居的甲虫汽车）都可以被假设拥有这些物品。\n\
    \n`Beetle.trunk.sparetire` 将是指定甲虫汽车后备箱中备胎（更通用的汽车对象的一个实例）的代码。\n\n同样，加载到 Web 页面中命名为“gardendog”的照片是更通用图像对象的一个实例。\n\
    \n### 属性\n\n在现实生活中，对象的实例也可以有属性。汽车对象的实例可能有一个名为 color（颜色）的属性。该属性在 JavaScript 中将引用为：\n\
    \n`Beetle.color`\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_16_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_16_1.png)\n\
    \nJavaScript 的基本概念\n\n同样，在 JavaScript 语言中，每个对象都可以有许多关联属性。例如，文档对象有一个名为 bgColor\
    \ 的内置属性（注意同时使用了大写和小字母），它表示背景颜色：\n\n`window.document.bgColor`\n\n### 值\n\n在现实生活中，属性有值。汽车对象可能有一个名为\
    \ color 的属性，其值为 blue（蓝色）。如果甲虫汽车（汽车对象的一个实例）的所有者将汽车漆成不同的颜色，他将为 color 属性分配新值。以下代码为汽车对象实例\
    \ Beetle 的 color 属性分配值 red（红色）：\n\n`Beetle.color=\"red\";`\n\nJavaScript 对象也有属性，并且你可以为它们赋值。例如，文档对象有一个名为\
    \ bgColor 的属性，表示背景颜色，并可以使用此 JavaScript 语句分配 silver（银色）等值：\n\n`window.document.bgColor=\"\
    silver\";`\n\nJavaScript 最常用的用途可能是创建鼠标悬图形，当观众将鼠标移动到图像上时，图像会变化。这种技术依赖于 JavaScript\
    \ 中图像对象的 SRC（源）属性。SRC 属性有一个值，用于指示 Web 服务器硬盘上图形文件的位置和名称。\n\n列表 1.1 中的 HTML 页面展示了一个位在向日葵田里的女性（见图\
    \ 1.2）。该图像使用标准的 HTML 标签 IMG 创建的，该标签具有 SRC 属性。在这个示例中，SRC 的值为 \"sunflowerlady.jpg\"\
    ，表示名为 \"sunflowerlady.jpg\" 的图像文件位于 Web 页面本身所在的文件夹中。IMG 标签的另一个属性是 NAME 属性，这里它被设置为值\
    \ \"sunflowerphoto\"。\n\n```html\n<<html>\n<head>\n<title>sunflower lady</title>\n\
    </head>\n<body bgcolor=\"white\">\n<img src=\"sunflowerlady.jpg\" width=\"300\"\
    \ height=\"200\" name=\"sunflowerphoto\">\n</body>\n</</html>>\n```\n\n列表 1.1\
    \ 带有 IMG 标签的 HTML 页面\n\n当这段代码包含在 Web 页面中并通过 Web 浏览器加载到窗口中时，就会创建一个通用图像对象的实例，并以\
    \ sunflowerphoto 的名称存在浏览器内存中。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_17_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_17_1.png)\n\
    \nJavaScript 的基本概念\n\n6\n\n第一 基础\n\nJavaScript 的基础\n\n☆提示将对象想象成 Web 浏览器窗口加载的文档中具命名的“gardendog”。\n\
    \n图 1.1 Web 浏览器窗口中的图像对象\n\n图 1.2 向日葵田中的女性\n\n图 1.3 向日葵的特写\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_18_0.png)\n\
    \n### 事件与事件处理器\n\n在现实生活中，对象的实例有时会遇到事件。事件处理器是响应事件的代码。在这个示例中，爆胎事件由 onmouseover 处理器处理，该处理器通过更改轮胎的值来响应事件：\n\
    \n`onmouseover=Beetle.shape=\"flat\";`\n\n同样，在 JavaScript 语言中，每个对象都可以遇到许多事件。最常用的事件之一是访问者移动到对象上方时触发的\
    \ mouseover 事件。锚标签（<a>）可以被设置为响应 mouseover 事件。在锚标签内的任何文本或图形都可用于触发事件。\n\n在下面的示例中，链接（<a>\
    \ 标签）带有 onmouseover 处理器，当访问者将鼠标移动到链接上时将页面颜色更改为银色。\n\n```html\n<a href=\"#\" onmouseover=\"\
    document.bgColor='silver'\">鼠标悬停更改背景</a></a>\n```\n\n要实现图像切换，你使用 IMG 标签代替文本。列表\
    \ 1.2 设置了鼠标悬停图形。当用户将鼠标移动到图像上，就会产生 mouseover 事件。锚标签有一个 onmouseover 事件处理器来处理 mouseover\
    \ 事件。事件处理器向浏览器发送单行代码，更改 \"sunflowerphoto\" 图像的 SRC 属性以显示向日葵的特写。\n\n阅读列表 1.2 中的代码。你可能会在学习\
    \ JavaScript 的早期阶段理解这么多而感到惊讶。\n\n切除 你将在第四章和第五章更详细地学习图像切换。要自己创建列表 1.2，请从 http://www.awl.com/estrella\
    \ 下载两个图像，在任何文本编辑器中输入代码，将其保存为扩展名为 .html 的纯文本文件，然后用你的 Web 浏览器打开它。\n\n^提示 在代码列表中，符号\
    \ -» 表示由于打印页面行长度限制而换行到下一行的文本。避免在代码中放置不必要的换行符是重要的。中间有换行符的 JavaScript 语句在 Web 浏览器中无法正常工作。\n\
    \n"
