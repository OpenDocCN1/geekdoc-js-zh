- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_57_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_57_1.png)\n\
    \n# Chapter Three Working with Forms\n\nWorking with Check Boxes\n\n11. Rarely,\
    \ a visitor may wish to change the response to the gender question. For that reason,\
    \ a button is provided labeled Change Gender. It calls the changeGender() function\
    \ when clicked. The changeGender() function calls the getRadioValue() function\
    \ to determine which radio button is checked. If none is checked, Gender not specified\
    \ is displayed in the feedback field. Otherwise, the showRadioValue() function\
    \ is called to change the checked radio button to the opposite gender.\n\n12.\
    \ The showRadioValue() function receives three parameters: the name of the FORM,\
    \ the name of the radio button set, and the value of the radio button to be checked.\
    \ A variable theRadioButtons is again created to hold the array of radio buttons.\
    \ A loop steps through each element of the theRadioButton array to determine whether\
    \ its value matches the desired value. If it does, the checked property of that\
    \ radio button is set to true, and that causes the button to appear checked. Control\
    \ returns to the changeGender(), function which displays Thank you madame or Thank\
    \ you sir as appropriate (see Figure 3.3).\n\nFigure 3.3 Output of Listing 3.4\n\
    \nWorking with Check Boxes\n\nSurvey questions often employ check boxes to allow\
    \ visitors to \"check all that apply.\" Each check box can be assigned name and\
    \ value properties. Each check box exists in either an unchecked or a checked\
    \ state. When a form is submitted, the names and values of any checked boxes are\
    \ sent with the form. The names and values of the unchecked boxes are not sent.\
    \ To determine which boxes are checked, you test for the checked property. Listing\
    \ 3.5 demonstrates the use of check boxes in a simple survey of education levels.\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_58_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_58_1.png)\n\
    \nWorking with Check Boxes\n\n```html\n<html><head><title>Check Box Form Validation</title>\n\
    <script type=\"text/javascript\" language=\"JavaScript\">\n<!\nfunction validate(){\n\
    var degree = \" \";\nvar comments = new Array(4);\ncomments[0] = 'You are competent.';\n\
    comments[1] = 'You are educated.';\ncomments[2] = 'You are highly educated.';\n\
    comments[3] = 'You spent too much time in school.';\nfor (i=0;i< 4;i++){\nif (document.survey['degree'+i].checked){\n\
    degree = document.survey['degree'+i].value;\ndocument.survey.feedback.value =\
    \ comments[i];\n}\n}\nif (degree == \"\"){\nalert(\"You need to get an education!\"\
    );\nreturn false;\n}else{\nreturn true;\n}\n}\n//-->\n</script>\n</head>\n<body\
    \ bgcolor=\"white\">\n<h1>Visitor Education Survey</h1>\n<form action=\"mailto:jscheckbox@stevenestrella.com\"\
    \nmethod=\"POST\" enctype=\"text/plain\" name=\"survey\"\nonsubmit=\"return validate();\"\
    >\n<p>Name:<input type=\"text\" name=\"visitor\" value=\"\" size=\"40\"></p>\n\
    <h4>Degrees you have earned (check all that apply):</h4>\n<input type=\"checkbox\"\
    \ name=\"degree0\" value=\"H.S.\">\nHigh School Diploma<br>\n<input type=\"checkbox\"\
    \ name=\"degree1\" value=\"B.A.\">\nBachelor's Degree<br>\n<input type=\"checkbox\"\
    \ name=\"degree2\" value=\"M.A.\">\nMaster's Degree<br>\n``` The survey form has\
    \ html checkboxes called degree0, degree1, etc. By adding the current value of\
    \ i to the word degree, this conditional structure checks to see if a particular\
    \ box is checked.\n\n```html\n<input type=\"checkbox\" name=\"degree3\" value=\"\
    Ph.D.\">\nDoctorate<br>\n<p><input type=\"submit\" value=\"Send Survey\"></p>\n\
    <hr>\n<p>Feedback:<br>\n<input type=\"text\" name=\"feedback\" value=\"\" size=\"\
    50\">\n</p>\n</form>\n</body>\n</html>\n```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_59_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_59_1.png)\n\
    \nWorking with Check Boxes\n\nFigure 3.4 Output of Listing 3.5\nCheck Box Form\
    \ Validation - Netscape\nVisitor Education Survey\nName\nDegrees you have earned\
    \ (check all that apply):\n- High School Diploma\n- Bachelor's Degree\n- Master's\
    \ Degree\n- Doctorate\nSend Survey\nFeedback:\nspent too much time in school.\n\
    \n### SHORTCUT What name?\nWhen you create surveys or tests, it usually makes\
    \ sense to name the text fields, radio buttons, or check boxes with sequential\
    \ names such as \"q1,\" \"q2,\" \"q3,\" and so on. Using a consistent and sequential\
    \ scheme allows you to use a loop efficiently to poll the values in these elements.\n\
    \n### How Does It Work?\nListing 3.5 generates the following sequence of events:\n\
    1. The browser loads the HEAD into memory and displays the BODY.\n2. The BODY\
    \ contains a FORM object named survey. FORM objects automatically create an array\
    \ of all form elements enclosed by <form> and </form> tags. The names of the four\
    \ check boxes in this form are followed by a number from 0 to 3. The number can\
    \ be stored in a variable. In this way, you can use an expression such as document.survey['degree'+i].checked\
    \ to determine whether a given box is checked. None of the boxes here checked\
    \ by default.\n3. The visitor clicks the Send Survey button to submit the form,\
    \ and the button generates a submit event. The FORM object handles the event by\
    \ calling the validate() function. If validate() returns true, the form content\
    \ is sent by e-mail.\n4. The validate() function begins by creating a variable\
    \ called degree and setting its initial value to an empty text string. Then an\
    \ array is created to hold the four comments associated with the four degrees.\n\
    5. The validate() function loops through a series of statements four times while\
    \ an index variable (i) counts from 0 to 3. On each pass through the loop, an\
    \ element of the form survey is examined to see whether it is checked. That element\
    \ is determined by combining degree with the current value of the index variable\
    \ (i).\n6. If a checked box is found, its value is stored in the degree variable.\
    \ If multiple degrees are checked, each one will replace the previous contents\
    \ of the degree variable.\n7. The index variable of this loop (i) is used to determine\
    \ which element of the comments array should be displayed in the feedback field.\n\
    8. The next section of the code contains conditional structures to test the value\
    \ of the degree variable.\n9. If none of the boxes is checked, it means that degree\
    \ is empty. An alert box appears with instructions. After the visitor dismisses\
    \ the alert box, a value of false is returned to the FORM object that called the\
    \ function, and that prevents the e-mail from being sent.\n10. If degree contains\
    \ anything other than an empty text string, a value of true is returned to the\
    \ FORM object, which then sends the form contents via e-mail to the address listed\
    \ in the ACTION property.\n11. The recipient receives an e-mail message containing\
    \ a name-value pair for each checkbox.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_61_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_61_1.png)\n\
    \nWorking with Selection Menus\n\nWorking with Selection Menus\n\nAnother convenient\
    \ way to present multiple options on a survey question is to use selection menus.\
    \ The <select> tag creates a pop-up selection menu on the screen with the menu\
