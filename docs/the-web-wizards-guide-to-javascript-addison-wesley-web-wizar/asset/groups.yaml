    ## Becoming an Internet Mogul


    Online payment systems such as PayPal.com allow small businesses and individuals
    to sell products from their Web sites without having to set up costly credit card
    processing and merchant banking accounts. PayPal takes care of all the credit
    card processing and retains a small portion of the payment as a fee. The remaining
    funds collected are then transferred to your checking account. Visit http://www.time.org
    to see how a small nonprofit organization uses PayPal to accept membership payments
    online.


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_140_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_140_1.png)


    ### Summary


    - Cookies are small pieces of information stored on the visitor''s hard drive.
    Cookies are mostly harmless, but valid privacy concerns exist about the use of
    cookies in conjunction with invasive marketing techniques. You can create as many
    as 20 cookies per domain.

    - Cookies are set when a JavaScript statement in a Web page assigns content to
    the cookie property of the document object. By default, the content includes information
    about the domain and directory location of the page that created it. When a Web
    page attempts to retrieve a cookie, the location of the web page is compared to
    the domain and directory of the page that created the cookie. If the two locations
    do not match, the cookie cannot be retrieved. You can set an expiration date for
    your cookies. The form of the expiration date is always GMT. Bill Dortch''s cookie
    code is widely used on the Internet and has been placed in the public domain.

    - One popular use of cookies is to store visitor preferences, such as background
    color and login information.

    - When a Web page retrieves information from a cookie, the page can act on that
    information by changing the page appearance to suit the expressed preferences
    of the visitor.

    - Another popular use of cookies is to retain selected items as visitors move
    through the pages of an online shopping cart. The shopping cart technique can
    also be adapted to delivering surveys or tests online.


    ### References


    - Marshall Brain''s How Stuff Works site has a nice article on cookies. http://www.howstuffworks.com/cookie.htm

    - Webopedia''s basic definition of cookies: http://webopedia.internet.com/TERM/c/cookie.html

    - CookieCentral.com offers an overview of cookies and links to related news articles.
    http://www.cookiecentral.com

    - The Electronic Privacy Information Center offers information to address privacy
    concerns about cookies. http://www.epic.org/privacy/internet/cookies/

