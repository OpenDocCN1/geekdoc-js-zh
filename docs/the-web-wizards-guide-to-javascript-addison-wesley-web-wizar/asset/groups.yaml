    \n89\n\nCreating a Simple Clock\n\ncurrentDate.getYear() returns the two-digit\
    \ year (for example, 01).\n\nThis method was common before 2000 but has since\
    \ been replaced with the getFullYear() method.\n\ncurrentDate.toLocaleString()\
    \ expresses the date and time as text formatted to local standards (for example,\
    \ \"Tuesday, 31 July, 2001 11:03:19 AM\").\n\nNotice that the getDate() method\
    \ returns the date in a range of 1 to 31. Most of the other methods return zero-based\
    \ information. For example, zero represents January in the getMonth() method.\
    \ Note that the values returned by the Date() object are only as accurate as the\
    \ clock on the visitor's computer.\n\nCreating a Simple Clock\n\nListing 6.1 demonstrates\
    \ how easy it is to add a simple clock to a Web page.\n\n```html\n<html><head><title>Basic\
    \ Clock</title>\n<script type=\"text/javascript\" language=\"JavaScript\">\n<!--\n\
    function showTime(){\n  // A new Date() object is created and stored in a variable.\n\
    \  var now = new Date();\n  document.clock.face.value = now.toLocaleString();\n\
    }\n</script>\n<body onload=\"setInterval(showTime(),1000);\">\n<div align=\"CENTER\"\
    >\n<h1>A Very Basic JavaScript Clock</h1>\n<form name=\"clock\"><input name=\"\
    face\" size=\"50\"></form>\n</div>\n</body> \n</html>\n```\n\nListing 6.1 A Simple\
    \ Clock\n\n### Using the setInterval() Method\n\nThe setInterval() method of the\
    \ window object is very similar to the setTimeout() method. The setTimeout() method\
    \ schedules a task to be executed once after a given delay. The setInterval()\
    \ method schedules a task to be executed repeatedly with a given delay between\
    \ repetitions. The setInterval() method is ideal for generating a clock that updates\
    \ every second (1000 milliseconds) and is supported by browsers with version numbers\
    \ 4 and higher.\n\nCreating a Simple Clock\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_101_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_101_1.png)\n\
    \n90\n\nChapter Six Working with Dates and Times\n\nFigure 6.1 shows the output\
    \ of Listing 6.1.\n\n- Basic Clock\n- Tuesday, 31 July, 2001 11:03:19 AM\n- Back,\
    \ Forward, Stop, Refresh, Home, AutoFill\n- A Very Basic JavaScript Clock\n- Jul\
    \ 31 11:04:27 2001\n\nFigure 6.1 Output of Listing 6.1 in Internet Explorer (top)\
    \ and Netscape\n\n#### How Does It Work?\n\n1. The page loads, and the setInterval()\
    \ method begins to call the showTime() function repeatedly every 1000 milliseconds.\n\
    2. Each time the showTime() function is called, the variable now is created as\
    \ an instance of the Date object.\n3. The toLocaleString() method is applied to\
    \ the now date object.\n4. The result is displayed in a field called face on a\
    \ form called clock. The exact form of the date and time will vary depending on\
    \ location, browser, and operating system. Figure 6.1 shows the output in Internet\
    \ Explorer 5 (top) and Netscape Communicator 4.7 on a Macintosh.\n\nIt's easy\
    \ to implement Listing 6.1 on a Web page, but it gives you little control over\
    \ the format of the date and time. For example, the toLocaleString() method shows\
    \ both the date and the time, but you may wish to display only the time. Some\
    \ browsers and operating systems will display military time, and others will display\
    \ U.S. time (AM and PM). Fortunately, you can exercise more control over dates\
    \ and times, as discussed next.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_102_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_102_1.png)\n\
    \n91\n\nCreating a Better Clock\n\nListing 6.2 demonstrates one way to add a customized\
    \ clock to your Web page.\n\n```html\n<html><head><title>A Better Clock</title>\n\
    <script type=\"text/javascript\" language=\"JavaScript\">\n<!--\nvar timerID =\
    \ \"\";\nfunction startClock(){\n  timerID = setInterval('showTime()', 1000);\n\
    }\nfunction stopClock(){\n  clearInterval(timerID);\n}\nfunction showTime(){\n\
    \  var now = new Date();\n  var hours = now.getHours();\n  var minutes = now.getMinutes();\n\
    \  var seconds = now.getSeconds();\n\n  // getHours(), getMinutes(), and getSeconds()\
    \ are built-in methods of the Date object.\n  /* This routine adds leading zeroes\
    \ when needed. */\n  var timeValue = hours > 12 ? hours - 12 : hours;\n  if (timeValue\
    \ == 0) timeValue = 12;\n  \n  timeValue += \":\" + (minutes < 10 ? \"0\" + minutes\
    \ : minutes);\n  timeValue += \":\" + (seconds < 10 ? \"0\" + seconds : seconds);\n\
    \n  var suffix = hours >= 12 ? \" PM\" : \" AM\";\n  document.clock.face.value\
    \ = timeValue + suffix;\n}\n//-->\n</script>\n</head>\n<body bgcolor=\"white\"\
    \ onload=\"startClock()\">\n<div align=\"CENTER\">\n<h1>A Better Clock</h1>\n\
    <form name=\"clock\"><input name=\"face\" size=\"50\"></form>\n<input type=\"\
    button\" value=\"Start Clock\" onclick=\"startClock()\">\n<input type=\"button\"\
    \ value=\"Stop Clock\" onclick=\"stopClock()\">\n</div>\n</body>\n</html>\n```\n\
    \nListing 6.2 A Customized Clock\n\nThe startClock() function is called when the\
    \ document is completely loaded in the browser window.\n\n#### How Does It Work?\n\
    \n1. The page loads, a global timer ID is created, and the onload handler in the\
    \ body calls startClock().\n2. The startClock() function begins. The setInterval()\
    \ method calls the showTime() function repeatedly every 1000 milliseconds.\n3.\
    \ Each time the showTime() function is called, the variable now is created as\
    \ an instance of the Date object.\n4. getHours(), getMinutes(), and getSeconds()\
    \ are used. A variable called timeValue is created to hold the time with leading\
    \ zeroes where needed.\n5. The result is displayed in a field called face on a\
    \ form called clock.\n6. The stopClock() function uses the clearInterval() method\
    \ of the window object to prevent any further calls to the showTime() function.\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_103_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_103_1.png)\n\
    \n93\n\nCreating Dynamic Greetings\n\nNow that you know how to determine the time,\
    \ it might be nice to greet your visitors appropriately. Listing 6.3 demonstrates\
    \ one way to add a greeting that varies with the time of day.\n\n```html\n<html><head><title>Dynamic\
    \ Greeting</title>\n<script type=\"text/javascript\" language=\"JavaScript\">\n\
    <!--\nvar now = new Date();\nvar hours = now.getHours();\nvar greeting = \"\"\
    ;\n\nif (hours < 24) {\n  if (hours <= 17) {\n    if (hours <= 11) {\n      greeting\
    \ = \"Good morning\";\n    } else {\n      greeting = \"Good afternoon\";\n  \
    \  }\n  } else {\n    greeting = \"Good evening\";\n  }\n} else {\n  greeting\
    \ = \"Isn't it past your bedtime?\";\n}\n//-->\n</script>\n</head>\n<body bgcolor=\"\
    white\">\n<div align=\"CENTER\">\n<h1>Dynamic Greetings</h1>\n<h2>\n<script type=\"\
    text/javascript\" language=\"JAVASCRIPT\">\n<!--\ndocument.write(greeting);\n\
    //-->\n</script>\n</h2>\n<p>The greeting above was generated with JavaScript based\
    \ on the time of day.</p>\n</div>\n</body>\n</html>\n```\n\nListing 6.3 A Dynamic\
    \ Greeting\n\nFigure 6.3 shows the output of Listing 6.3.\n"
