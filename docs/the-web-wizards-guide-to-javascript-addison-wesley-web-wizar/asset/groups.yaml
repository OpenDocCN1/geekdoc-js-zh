    \n图 7.2 列表 7.3 显示已获取 Cookies 的输出\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_130_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_130_1.png)\n\
    \n119 \n\n使用 Cookies 定制网页 \n\n它是如何工作的？ \n\n1. 当 HEAD 加载时，`mylibrary.js` 文件被加载到内存中。当页面加载完成后，BODY\
    \ 标签中的 `onload` 处理器调用 `showCookies()` 函数。`showCookies()` 函数调用 `GetCookie()` 函数尝试检索包含访问者上次访问日期的\
    \ `lastvisited` Cookie。结果存储在名为 `lastvisit` 的变量中。如果 `lastvisit` 为空，则在 `cookieform`\
    \ 的 cookie jar 字段中显示字符串 \"No cookies found\"。如果 `lastvisit` 包含任何内容，剩余的 `visitor`\
    \ 和 `colorchoice` Cookie 也会被检索。这些 Cookie 值存储在变量 `thevisitor` 和 `color` 中。\n\n\
    2. 存储在 `mylibrary.js` 文件中的 `showSelectValue()` 函数（来自第三章）会更改 `colorpicker` SELECT\
    \ 的显示，以匹配访问者的偏好颜色。\n\n3. 创建一个新变量 `welcome` 来存储欢迎消息。它被一个包含访问者姓名和其上次访问日期的拼接文本字符串填充。\n\
    \n4. 创建一个新变量 `feedback` 来存储显示 Cookie 格式的文本字符串。它被一个包含 Cookie 中每个键值对的拼接文本字符串填充。\n\
    \n5. `feedback` 的内容显示在 `cookieform` 的 cookie jar 字段中。\n\n6. `welcome` 的内容显示在 `cookieform`\
    \ 的 visitor 字段中。\n\n7. 调用 `setBG()` 函数。`setBG()` 函数调用 `getSelectValue()` 函数（来自第三章）从\
    \ `colorpicker` SELECT 中获取选中的值。然后将 document 对象的 `bgColor` 属性更改为选的背景颜色。\n\n8. 访问者使用\
    \ `colorpicker` SELECT 选择新的背景颜色。SELECT 中的 `onchange` 处理器调用 `setBG()` 函数以立即更改背景颜色。\n\
    \n9. 访问者更改 `visitor` 字段中的名称，然后点击“制作 Cookies”按钮。按钮中的 `onclick` 处理器调用 `makeCookies()`\
    \ 函数。\n\n10. `makeCookies()` 函数创建一个新的 `Date` 对象，将当前日期设定为访问者上次访问页面的日期。该日期通过日期对象的\
    \ `toLocaleString()` 方法以本地格式作为文本字符串存储在变量 `lastvisit` 中。\n\n11. 创建变量 `expHours`\
    \ 来存储 Cookie 过期前的小时数。创建第二个 `Date` 对象 `expireDate`，并填充未来 24 小时后的新时间。\n\n使用 Cookies\
    \ 定制网页\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_131_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_131_1.png)\n\
    \n创建 \n\n120 \n\n第七章 Cookies：维持状态 \n\n12. 两个新变量——`visitorname` 和 `visitorcolor`\
    \ 被访问者在 `visitor` 字段和 `colorpicker` SELECT 中输入的值填充。\n\n13. 调用三次 `SetCookie()`\
    \ 函数来创建 `lastvisit`、`visitor` 和 `colorchoice` Cookies，并设置为 24 小时后过期。\n\n14. 提示框通知访问者\
    \ Cookies 已完成。\n\n15. 访问者进入另一个网页然后返回此页面。当她返回时，BODY 标签中的 `onload` 处理器调用 `showCookies()`\
