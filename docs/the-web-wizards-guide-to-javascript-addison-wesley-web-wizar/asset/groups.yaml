  - "[PAGE 173]\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_173_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_173_1.png)\n\
    \nControlling Text Displayed in the Status Bar \n\n162 Chapter Nine Applied Web\
    \ Programming Techniques \n\n## Controlling Jext Displayed in the Status Bar \n\
    \nWeb browsers usually have a status bar at the bottom of the window to show the\
    \ \n\nstatus of the page as it loads and to show a URL when the visitor moves\
    \ the mouse \n\nover a link. One of the earliest uses of JavaScript was to place\
    \ scrolling text in the \n\nstatus bar. This effect, like the dreaded <blink>\
    \ tag, is now considered tasteless \n\nand is rarely used. Sometimes, however,\
    \ it makes sense to control the text displayed \n\nin the status bar. Listing\
    \ 9.4 demonstrates an easy way to create custom status bar \n\nmessages that display\
    \ when the visitor rolls the mouse over your links. \n\n^WARNING Use this effect\
    \ with care. Text you place in the status bar will override any text the \n\n\
    browser wishes to place there. Because the main purpose of the status bar is to\
    \ allow the browser to \n\ncommunicate with visitors, be sure to make only temporary\
    \ changes to the text displayed there. \n\n<html><head><title>Status Bar Update</title>\
    \ \n\n<script type=\"text/javascript\" language=\"JavaScript\"> \n\n<! — \n\n\
    var statusText \\= new Array(); \n\nstatusText\\[0\\] \\= \n\nstatusText\\[1\\\
    ] \\= \"A great place to find scripts for \\-> \n\nyour pages.\"; \n\nstatusText\\\
    [2\\] \\= \"Make your pages come alive with \n\nsound.\"; \n\nstatusText\\[3\\\
    ] \\= \"More silliness from your favorite \n\nauthor.\"; \n\nfunction statusUpdate(index){\
    \ \n\nwindow.status \\= statusText\\[index\\]; \n\n} \n\n//—> \n\n</script> \n\
    \n</head> \n\n<body bgcolor=\"white\"> \n\n<p><b>Roll your mouse over the links\
    \ to see the change \n\nin the status bar.</b></p> \n\n<ul> \n\n<li><a href=\"\
    http://www.javascripts.com/\" \n\nonmouseover=\"statusUpdate(1);return true;\"\
    \ \n\nonmouseout=\"statusUpdate(0);return true;\"\\>javascripts.com \n\n</a></li>\
    \ \n\n<li><a href=\"http://www.beatnik.com/\" \n\nonmouseover=\"statusUpdate(2);return\
    \ true;\" \n\nonmouseout=\"statusUpdate(0);return true;\"\\>beatnik.com \n\n</a></li>\
    \ \n\nThe status property of the \n\nwindow object can be set to \n\nany text\
    \ string."
  - "[PAGE 174]\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_174_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_174_1.png)\n\
    \n■SB \n\nControlling Text Displayed in the Status Bar \n\n163 \n\n<li><a href=\"\
    http://www.stevenestrella.com/\" \n\nonmouseover=\"statusUpdate{3);return true;\"\
    \ \n\nonmouseout=\"statusUpdate(0);return true;\"\\> \n\nThe Author's Web Site</a></li>\
    \ \n\n</ul> \n\n</body> \n\n</html> \n\nListing 9.4 Changing Text Displayed in\
    \ the Status Bar \n\nFigure 9.4 shows the output of Listing 9.4. \n\nFigure 9.4\
    \ Output of Listing 9.4 \n\nUsing the return true Statement \n\nIn the inner workings\
    \ of standard browsers, a simple link such as \n\n<a href=\"somepage.html\">A\
    \ Link</a> \n\nhas a built-in response to the mouseover event. When the mouse\
    \ is rolled over \n\nthe link, the link becomes active. When a link becomes active,\
    \ two things happen. \n\nFirst, the content of the HREF property (the URL) is\
    \ sent to the status property of \n\nthe window object (window, status). Second,\
    \ the new status text is displayed in \n\nthe status bar. \n\nIf an onmouseover\
    \ handler is added to a link, a different sequence of events \n\noccurs. \n\n\
    <a href=\"somepage.html\" \n\nonmouseover=\"window.status='stuff';return true;\"\
    > \n\nA Link</a> \n\nControlling Text Displayed in the Status Bar"
- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_175_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_175_1.png)\n\
    \n# Scrolling Text in a Text Field\n\n164\n\n## Chapter Nine Applied Web Programming\
    \ Techniques\n\nNow when the visitor rolls the mouse over the link, the onmouseover\
    \ handler\n\nresponds to the mouseover event before the link gets to it. The onmouseover\n\
    \nhandler calls a function that changes the status property of the window object\
    \ to\n\n\"stuff.\" The built-in behavior of the link that displays the text in\
    \ the status bar,\n\nhowever, does not occur because the link does not receive\
    \ the mouseover event.\n\nYou need the second statement,\n\nreturn true;\n\nto\
    \ get the link to recognize the mouseover event and display the current value\
    \ of\n\nwindow.status. Otherwise, the status text would be changed but no one\
    \ would\n\nsee it because the link would never receive the message to display\
    \ it.\n\n### How Does It Work?\n\n1. An array called statusText is filled with\
    \ four text strings. The first is blank\n\nto clear the status text. The remaining\
    \ three text strings describe the links on\n\nthe page.\n\n2. Each link contains\
    \ onmouseover and onmouseout handlers that intercept\n\nthe mouseover and mouseout\
    \ events and call the statusUpdate() function. A number is passed to statusUpdate(),\
    \ and that number determines\n\nwhich element of the statusText array is assigned\
    \ to the status property\n\nof the window object.\n\n3. The return true statement\
    \ returns control to the link that responds to the\n\nmouseover event by displaying\
    \ in the status bar the current text found in the\n\nwindow.status property.\n\
    \n### Scrolling Text in a text field\n\nAlthough scrolling text in the status\
    \ bar may be tasteless, scrolling text in a text field\n\ncan be useful. Sometimes\
    \ you may wish to attract visitors' attention to an important\n\nannouncement\
    \ but your design doesn't permit a fancy animation. One way to add\n\ninterest\
    \ to your page and gain attention without a lot of multimedia overhead is to\n\
    \nuse a small text field with scrolling text. Listing 9.5 demonstrates the basic\
    \ code\n\ninvolved. In this example, the visitor controls the text and its speed.\
    \ When you create your pages, you'll probably choose to set these parameters yourself.\n\
    \n```html\n<html><head><title>Scrolling Text</title>\n\n<script type=\"text/javascript\"\
    \ language=\"JavaScript\">\n//-->\nvar blurb=\"\";\nvar firstpart=\"\";\nvar secondpart=\"\
    \";\nvar delay = 0;\nvar timerID;\nvar counter=0;\nvar scrollstatus=\"Not Scrolling\"\
    ;\n// Holds the number of the leftmost character in the text string scrolling\
    \ in the field.\n```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_176_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_176_1.png)\n\
    \n165\n\nScrolling Text in a Text Field\n\n```javascript\nfunction scrolllt(){\n\
    \    if (scrollstatus == \"Scrolling\"){\n        blurb = document.myform.usertext.value;\n\
    \        firstpart = blurb.substring(counter, blurb.length) + \" \";\n       \
    \ secondpart = blurb.substring(0,counter);\n        document.myform.scrolledtext.value\
    \ = firstpart + secondpart;\n        (counter > blurb.length) ? counter = 0 :\
    \ counter+1;\n        delay = document.myform.speed.value;\n        timerID =\
    \ setTimeout(\"scrolllt()\",delay);\n    }\n}\n// When counter reaches the end\
    \ of the blurb, it starts over at 0. Otherwise, it's incremented by 1.\n\nfunction\
    \ startScroll(){\n    scrollstatus = 'Scrolling';\n    document.myform.scrollfeedback.value\
    \ = scrollstatus;\n    scrolllt();\n}\n\nfunction stopScroll(){\n    clearTimeout(timerID);\n\
    \    scrollstatus = 'Not Scrolling';\n    document.myform.scrollfeedback.value\
    \ = scrollstatus;\n}\n//-->\n```\n</script></head>\n\n<body bgcolor=\"white\"\
    >\n\n<form name=\"myform\">\n<hl>Scrolling Text in a Field</hl>\n<p>Type the text\
    \ you want to scroll here.<br>\n<input type=\"text\" name=\"usertext\" size=\"\
    50\"></p>\n<p>Type delay in milliseconds here.<br>\n<input type=\"text\" name=\"\
    speed\" size=\"10\"></p>\n<p><input type=\"BUTTON\" onclick=\"startScroll();\"\
    \ value=\"Scroll It!\">\n<input type=\"BUTTON\" onclick=\"stopScroll();\" value=\"\
    Stop This Crazy Thing!\">\n<input type=\"RESET\" onclick=\"stopScroll();return\
    \ true;\" value=\"Reset All Fields\"></p>\n<p>Click the buttons above to control\
    \ the scrolling text below.<br>\n<input type=\"text\" name=\"scrolledtext\" size=\"\
    50\"></p>\n<p>Status<br>\n<input type=\"text\" name=\"scrollfeedback\" size=\"\
    25\"></p>\n</form>\n\n</body>\n</html>\n```\n\nListing 9.5 Scrolling Text Displayed\
    \ in a Form Field\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_177_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_177_1.png)\n\
    \n166\n\nChapter Nine Applied Web Programming Techniques\n\n### Reset Buttons\n\
    \nTo assist visitors in clearing the form content and starting over, it's helpful\
    \ to include a Reset button.\n\nAll you need is an input of type=\"reset\" to\
    \ clear all fields and reset all select and radio button elements.\n\nFigure 9.5\
    \ shows the output of Listing 9.5.\n\nFigure 9.5 Output of Listing 9.5\n\n###\
    \ How Does It Work?\n\n1. The visitor types a line of text into a field called\
    \ usertext. The visitor then clicks the button Scroll It! An handler calls the\
    \ startScroll() function.\n2. The startScroll() function sets the scrollstatus\
    \ to Scrolling, displays scrollstatus in the form scrollfeedback, and calls the\
    \ scrolllt() function.\n3. The scrolllt() function begins by examining scrollstatus\
    \ to see whether the current value is Scrolling. If it is, scrolllt() places into\
    \ the variable blurb the value the visitor typed. Then a portion (substring) of\
    \ blurb is stored in the variable firstpart. The first time through the loop,\
    \ the value of counter is 0, so the firstpart will contain the entire blurb. The\
    \ fifth time through, however, the value of counter will be 4, so firstpart will\
    \ contain characters 4 to the end of blurb plus a space. The variable secondpart\
    \ will contain characters 0 to 4.\n4. The contents of firstpart and secondpart\
    \ are displayed in the field scrolledtext.\n5. A conditional structure checks\
    \ to see whether counter is at the end of the blurb. If it is, counter is reset\
    \ to 0. Otherwise, counter is incremented by 1.\n6. The variable delay is set\
    \ to the value typed by the visitor in the field speed.\n7. The variable timerID\
    \ is set to an ID number that identifies the scheduled task generated by the setTimeout()\
    \ method.\n8. The setTimeout() method schedules the scrolllt() function to execute\
    \ again after waiting the number of milliseconds indicated by the variable delay.\
    \ Because setTimeout() is calling the function in which it resides, a loop is\
    \ created.\n9. The visitor clicks the button Stop This Crazy Thing! The stopScroll()\
    \ function is called. The clearTimeout() method cancels the next scheduled performance\
    \ of scrolllt(). The variable scrollstatus is set to Not Scrolling and displayed\
    \ in the scrollfeedback field.\n\n10. The variable blurb is created to hold the\
    \ text the visitor typed. The variables firstpart and secondpart are created to\
    \ hold the two halves of blurb as it scrolls.\n11. The variable counter is created\
    \ to track the character number of the leftmost character in the text string scrolling\
    \ in the field. Finally, the variable scrollstatus is created to display scrolling\
    \ or not scrolling as appropriate.\n\n### What's Next?\n\n167\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_178_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_178_1.png)\n\
    \nWhat's Next?\n\nJavaScript is a great tool for adding interactivity to Web pages,\
    \ but, by itself, it can't do certain things. Among them are the following:\n\n\
    - Controlling and animating the location of graphics and text on the screen\n\
    - Controlling the stacking order of Web page elements to allow objects to overlap\n"
  mdcn: "\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_175_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_175_1.png)\n\
    \n# 文本框中的滚动文本\n\n164\n\n## 第章 应用 Web 编程技术\n\n现在当访问者将鼠标悬停在链接上时，onmouseover 处理器会在链接处理它之前响应\
    \ mouseover 事件。onmouseover 处理器调用一个函数，将窗口对象的 `status` 属性更改为 \"stuff\"。然而，链接在状态栏中显示文本的内置行为并没有发生，因为链接没有接收到\
    \ mouseover 事件。\n\n你需要第二个语句，\n\nreturn true;\n\n来让链接识别 mouseover 事件并显示 `window.status`\
    \ 的当前值。否则，状态文本会被更改，但没有人能看到它，因为链接永远不会接收到显示它的消息。\n\n### 它是如何工作的？\n\n1. 一个名为 `statusText`\
    \ 的数组被填充了四个文本字符串。第一个是空白的，用于清除状态文本。其余三个文本字符串描述了页面上的链接。\n\n2. 每个链接包含 `onmouseover`\
    \ 和 `onmouseout` 处理器，它们拦截 mouseover 和 mouseout 事件并调用 `statusUpdate()` 函数。一个数字被传递给\
    \ `statusUpdate()`，该数字决定将 `statusText` 数组中的哪个元素赋值给窗口对象的 `status` 属性。\n\n3. `return\
    \ true` 语句将控制权返回给响应 mouseover 事件的链接，并在状态栏中显示 `window.status` 属性中的当前文本。\n\n###\
    \ 文本框中的滚动文本\n\n虽然状态栏中的滚动文本可能显得乏味，但文本框中的滚动文本可能是很有用的。有时你可能希望吸引访问者注意某项重要公告，但你的设计不允许花哨的动画。增加页面趣味并吸引注意力而不产生过多多媒体开销的方法之一，是使用带有滚动文本的小型文本框。列表\
    \ 9.5 展示了涉及的基本代码。在这个示例中，访问者控制文本及其速度。当你创建页面时，你可能会选择自己设置这些参数。\n\n```html\n<html><head><title>Scrolling\
    \ Text</title>\n\n<script type=\"text/javascript\" language=\"JavaScript\">\n\
    //-->\nvar blurb=\"\";\nvar firstpart=\"\";\nvar secondpart=\"\";\nvar delay =\
    \ 0;\nvar timerID;\nvar counter=0;\nvar scrollstatus=\"Not Scrolling\";\n// 存储字段中滚动的文本字符串中最左侧字符的数字。\n\
    ```\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_176_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_176_1.png)\n\
    \n165\n\n文本框中的滚动文本\n\n```javascript\nfunction scrolllt(){\n    if (scrollstatus\
    \ == \"Scrolling\"){\n        blurb = document.myform.usertext.value;\n      \
    \  firstpart = blurb.substring(counter, blurb.length) + \" \";\n        secondpart\
    \ = blurb.substring(0,counter);\n        document.myform.scrolledtext.value =\
    \ firstpart + secondpart;\n        (counter > blurb.length) ? counter = 0 : counter+1;\n\
    \        delay = document.myform.speed.value;\n        timerID = setTimeout(\"\
    scrolllt()\",delay);\n    }\n}\n// 当 counter 到达 blurb 的末时，它将从 0 开始。否则，它加 1。\n\n\
    function startScroll(){\n    scrollstatus = 'Scrolling';\n    document.myform.scrollfeedback.value\
    \ = scrollstatus;\n    scrolllt();\n}\n\nfunction stopScroll(){\n    clearTimeout(timerID);\n\
    \    scrollstatus = 'Not Scrolling';\n    document.myform.scrollfeedback.value\
    \ = scrollstatus;\n}\n//-->\n```\n</script></head>\n\n<body bgcolor=\"white\"\
    >\n\n<form name=\"myform\">\n<hl>文本框中的滚动文本</hl>\n<p>在此输入你想要滚动的文本。<br>\n<input\
    \ type=\"text\" name=\"usertext\" size=\"50\"></p>\n<p>在此输入毫秒级延迟。<br>\n<input\
    \ type=\"text\" name=\"speed\" size=\"10\"></p>\n<p><input type=\"BUTTON\" onclick=\"\
    startScroll();\" value=\"滚动它!\">\n<input type=\"BUTTON\" onclick=\"stopScroll();\"\
    \ value=\"停止这个疯狂的东西!\">\n<input type=\"RESET\" onclick=\"stopScroll();return true;\"\
    \ value=\"重置所有字段\"></p>\n<p>点击上方按钮控制下方的滚动文本。<br>\n<input type=\"text\" name=\"\
    scrolledtext\" size=\"50\"></p>\n<p>状态<br>\n<input type=\"text\" name=\"scrollfeedback\"\
    \ size=\"25\"></p>\n</form>\n\n</body>\n</html>\n```\n\n列表 9.5 在表单字段中显示的滚动文本\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_177_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_177_1.png)\n\
    \n166\n\n第九章 应用 Web 编程技术\n\n### 重置按钮\n\n为了帮助访问者清除表单内容并重新开始，包含一个 `type=\"reset\"\
    ` 的按钮是有用的。你只需要一个 `type=\"reset\"` 的元素。图 9.5 显示了列表 9.5 的输出。\n\n它是如何工作的？\n\n1. 访问者在\
    \ `usertext` 字段中输入文本。然后点击“滚动它!”按钮调用 `startScroll()` 函数。\n2. `startScroll()` 函数将\
    \ `scrollstatus` 设置为 'Scrolling'，在 `scrollfeedback` 中显示状态，并调用 `scrolllt()` 函数。\n\
    3. `scrolllt()` 函数首先检查 `scrollstatus` 是否为 \"Scrolling\"。如果是，`scrolllt()` 将访问者输入的值放入变量\
    \ `blurb`。循环第一次运行时，`counter` 的值为 0，因此 `firstpart` 将包含整个 `blurb`。但在第五次运行时，`counter`\
    \ 的值为 4，因此 `firstpart` 将包含从字符 4 到结尾的内容加上一个空格。变量 `secondpart` 将包含 0 到 4 的字符。\n\
    4. `firstpart` 和 `secondpart` 的内容显示在 `scrolledtext` 字段中。\n5. 条件结构检查 `counter`\
    \ 是否到达 `blurb` 的末尾。如果是，则将其重置为 0。否则，加 1。\n6. 变量 `delay` 被设置为访问者在 `speed` 字段中输入的值。\n\
    7. 变量 `timerID` 被设置为标识 `setTimeout()` 方法生成的调度任务的数字。\n8. `setTimeout()` 方法在等待变量\
    \ `delay` 指定的毫秒后调度 `scrolllt()` 函数。由于 `setTimeout()` 调用了它所在的函数，因此创建了一个循环。\n9.\
    \ 访问者点击“停止这个疯狂的东西!”调用 `stopScroll()` 函数。`clearTimeout()` 取消了下一次 `scrolllt()` 执行。变量\
    \ `scrollstatus` 被设置为 Not Scrolling 并显示在 `scrollfeedback` 中。\n\n10. 创建变量 `blurb`\
    \ 用于存储访问者的文本。创建变量 `firstpart` 和 `secondpart` 用于存储滚动时 `blurb` 的两个部分。\n11. 创建变量\
    \ `counter` 用于跟踪字段中滚动文本字符串中最左侧字符的数字。最后，创建变量 `scrollstatus` 用于根据情况显示滚动或未滚动。\n\n\
    ### 接下来？\n\nJavaScript 是为 Web 页面添加交互性的极佳工具，但单凭它无法完成某些事情。其中包括以下内容：\n\n- 控制屏幕上图形和文本的位置并制作动画\n\
    - 控制 Web 页面元素的堆叠顺序以允许对象重叠\n\n"
