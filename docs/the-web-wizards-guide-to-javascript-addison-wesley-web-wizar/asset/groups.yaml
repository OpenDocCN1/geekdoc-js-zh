    \ in for loops, but any \n\nvariable name will do. Listing 2.2 assigns an initial\
    \ value of 5 to the index variable \n\ni. A semicolon (;) separates the initial\
    \ expression from the test condition. \n\nThe test condition determines when the\
    \ loop ends. To avoid spending the rest \n\nof your life washing your hair, for\
    \ example, you would modify the instructions on \n\nthe shampoo bottle to read,\
    \ \"Lather, rinse, repeat. Stop when your hair is clean.\" \n\nIn Listing 2.2,\
    \ the test condition specifies that the loop should continue only while \n\ni\
    \ is greater than one (i \\> 1). If i is one, the loop stops. \n\nThe update expression\
    \ specifies how to change the index variable after each \n\ncycle of the loop\
    \ finishes. In Listing 2.2, the decrement operator (—) reduces \n\nthe value of\
    \ i by 1 after each cycle of the loop. \n\nWithin the curly braces ({ }) are two\
    \ statements. The first statement combines \n\nthe current value of i with a text\
    \ string and writes the result to the current Web \n\ndocument in the browser\
    \ window. The second statement adds another sentence to \n\nthe document. Notice\
    \ that both statements contain the HTML break tag (<br>) as \n\npart of the text\
    \ string. The <br> tag creates a line break. The loop then repeats \n\nuntil the\
    \ value of i goes down to 1. When the loop ends, the JavaScript statements \n\n\
    outside the curly braces then add two final lines of text to the document. Figure\
    \ \n\n2.2 shows the output of this example. \n\n<html><head><title>loop me</title>\
    \ \n\n<script type=\"text/javascript\" language=\"javascript\"> \n\n<!-- \n\n\
