- md: "\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_151_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_151_1.png)\n\
    \n## Additional Methods of the Window Object\n\n140\n\nChapter Eight Working with\
    \ Windows and Frames\n\n```html\n<head><title>Confirmation</title>\n<script type='text/javascript'\
    \ language='Javascript'>\n<! —\nvar visitorChoice = window.confirm(\"Are you sure\
    \ you want to be here?\");\nvar stuffToWrite = \"\";\n\nif (visitorChoice){\n\
    \    stuffToWrite = \"It is good to see you can make decisions.\";\n    visitorChoice\
    \ will be true if the visitor clicks OK.\n}else{\n    stuffToWrite = \"Too bad.\"\
    ;\n}\n// —>\n</script>\n</head>\n<body bgcolor='white'>\n<p>\n<script type='text/javascript'\
    \ language='Javascript'>\ndocument.write(stuffToWrite);\n</script>\n</p>\n</body>\n\
    </html>\n```\n\nListing 8.2 The window.confirm( ) Method\n\nFigure 8.2 shows the\
    \ output of Listing 8.2.\n\nFigure 8.2 Output of Listing 8.2\n\nAnother useful\
    \ feature of the window object is the location object, which you first encountered\
    \ in Chapter Five. The location object is the URL loaded in the current window.\
    \ The HREF property of the location object contains the entire URL. Changing the\
    \ HREF property to a different URL causes the window to load a different page.\
    \ In Listing 8.1, a new window called myWindow was created. To change the URL\
    \ of the new window, you can use a statement such as the following.\n\n`myWindow.location.href\
    \ = \"someURL.html\";`\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_152_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_152_1.png)\n\
    \nJavaScript and Frames\n\n141\n\nThe window object has a useful history object\
    \ that stores a list of pages recently loaded into the window. To navigate to\
    \ any of the pages in the list, use the following statement and substitute a positive\
    \ or negative integer as the parameter.\n\n`window.history.go(integer);`\n\nFor\
    \ example, `window.history.go(-3)` would produce a result similar to clicking\
    \ the Back button three times.\n\nFrames are common in Web sites both large and\
    \ small. A typical arrangement consists of a set of two frames (called a frameset):\
    \ a navigation frame on the left, and a content frame on the right. Listing 8.3\
    \ creates a set of two frames, called navigation and content, to assist visitors\
    \ in viewing the listings from Chapter Two. Listing 8.4 shows the navbar.html\
    \ file that will appear in the navigation frame. Listing 8.5 shows the code for\
    \ the home.html file that is initially loaded in the content frame.\n\n```html\n\
    <head><title>Frameset for Chapter Two</title></head>\n<frameset cols=\"150,*\"\
    >\n<frame src=\"navbar.html\" name=\"navigation\">\n<frame src=\"home.html\" name=\"\
    content\">\n</frameset>\n</html>\n```\n\nListing 8.3 A Frameset for the Examples\
    \ in Chapter Two\n\n```html\n<head><title>Navigation Bar for Chapter Two</title></head>\n\
