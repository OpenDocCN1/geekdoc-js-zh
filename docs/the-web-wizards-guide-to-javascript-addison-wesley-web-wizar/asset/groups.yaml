    \ onclick=\"runCode()\">\n</form>\n</body>\n</html>\n```\n\nWhen this button is\
    \ clicked, the browser calls the `runCode()` function. The `runCode()` function\
    \ calls the `eval()` function to take the text in the textarea above and execute\
    \ it as JavaScript code.\n\n### Listing 8.1 The HTML Builder Page with Window\
    \ Generator and Code Tester\n\nTo understand the script, you must first understand\
    \ the `open()` method of the window object. This method opens a new window.\n\n\
    `window.open(URL,targetname,features);`\n`window.open(\"http://www.aol.com\",\"\
    aw\",\"width=800,height=600,scrollbars=1\");`\n\nThe `window.open()` method takes\
    \ three parameters. The first parameter, `URL`, contains the location of a document\
    \ to load into the new window. The second parameter, `targetname`, contains a\
    \ text string to identify the window to any links on your page that have a TARGET\
    \ attribute. That allows you to build simple links in one window that change the\
    \ content of the new window.\n\n`<a href=\"newpage.html\" target=\"aw\">link</a>`\n\
    \nThe third parameter, `features`, contains a comma-separated list of features\
    \ to include in the new window. Table 8.1 shows the features supported by current\
    \ browsers (version 4.0 and later of Netscape and Internet Explorer). You can\
    \ list these attributes in any order, and you need not include all.\n\n**WARNING**:\
    \ When you type the window method attributes, be sure not to type any spaces.\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_146_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_146_1.png)\n\
    \n#### Table 8.1 window.open() Method Attributes\n\n| Attribute | Value(s) | Description\
    \ |\n| :--- | :--- | :--- |\n| width | Integer | Allows you to specify the width\
    \ of the new window's content area apart from any space needed by toolbars and\
    \ other elements of the window's chrome (portions of the window other than the\
    \ content). |\n| height | Integer | Allows you to specify the height of the new\
    \ window's content area apart from any space needed by toolbars and other elements\
    \ of the window's chrome. |\n| left | Integer | Allows you to specify the horizontal\
    \ position of the left side of the new window. Earlier versions of Netscape 4\
    \ did not support this attribute. In practice, versions after 4.77 support it,\
    \ although Netscape's online documentation suggests using screenX instead for\
    \ Netscape. |\n| top | Integer | Allows you to specify the vertical position of\
    \ the top side of the new window. Earlier versions of Netscape 4 did not support\
    \ this attribute. In practice, versions after 4.77 support it, although Netscape's\
    \ online documentation suggests using screenY instead for Netscape. |\n| screenX\
    \ | Integer | Allows you to specify the horizontal position of the left side of\
    \ the new window. This attribute works only on Netscape 4 and later browsers.\
    \ |\n| screenY | Integer | Allows you to specify the vertical position of the\
    \ top side of the new window. This attribute works only on Netscape 4 and later\
    \ browsers. |\n| copyhistory | 1 or 0 | Transfers the window history (contents\
    \ of the GO menu) from the old window to the new window. |\n| directories | 1\
    \ or 0 | The Favorites bar in Internet Explorer or the Personal toolbar in Netscape.\
    \ |\n| location | 1 or 0 | The Location or Netsite field on top of the browser\
    \ window that shows the current URL. |\n| menbar | 1 or 0 | The menu bar at the\
    \ top of a window in the Microsoft Windows operating system. On the Macintosh,\
    \ the menu bar is always present, so this attribute is ignored. |\n| scrollbars\
    \ | 1 or 0 | Allows control over whether the window displays scrollbars. |\n|\
    \ resizable | 1 or 0 | This interface element is usually found in the lower-right\
    \ corner of the window on Macintosh and Windows. Users can drag it to resize the\
    \ window. |\n| status | 1 or 0 | The status bar at the bottom of the window. |\n\
    | toolbar | 1 or 0 | The toolbar with the Back button found on all browsers. |\n"
