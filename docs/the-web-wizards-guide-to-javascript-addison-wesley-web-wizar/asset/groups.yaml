    Frequently Asked Questions about Cookies 109


    Frequently Asked Questions about Cookies


    Q. Can cookies transmit computer viruses?


    A. No. Viruses are computer programs. Plain text files are not computer programs.


    Because cookies are plain text residing in text files, they can''t store or run
    computer

    programs the way viruses can. Also, the size of a cookie is limited to 4 kilobytes.

    Even if a computer program could be stored in a cookie, it would be difficult
    to create

    one that small.


    Q. Can hackers use cookies to steal credit card information?


    A. It''s unlikely. Cookies contain only information that you supply. When you
    supply

    your credit card number during an online purchase, the Web server stores that

    information in its secure database and not in a cookie on your hard drive. Any

    company foolish enough to store sensitive information in a cookie would soon be

    out of business. Because cookies are readable text files, it would be only a matter
    of

    hours before some alert visitor noticed the presence of her credit card number
    in a

    cookie on her hard drive.


    Q. Can hackers read the information stored in my cookies?


    A. No. Cookies contain information about the site that created them. Only the
    site

    that creates a cookie can read that cookie. If some site actually stored sensitive

    information in a cookie, it would be the only site that could retrieve it.


    Q. Can marketing firms invade my privacy using cookies?


    A. Potentially. The Doubleclick Network stores customer profiles in cookies but

    does not store user names, e-mail addresses, or telephone numbers. Instead, each

    customer profile is anonymous. Banner ads on sites that use the Doubleclick service

    are customized to suit the interests of the person described in the customer profile.

    In February 2000, Doubleclick proposed to link these customer profiles with

    actual identities. The furor that arose was enough to convince Doubleclick and

    other companies that such behavior would yield nothing but ill will. Even so,

    many persons feel uncomfortable with the idea that they are being profiled on
    the

    Internet.


    Q. Is there anything I can do to minimize privacy issues with cookies?


    A. Certainly. All Web browsers have preference settings to allow you to manage

    your cookies. You can choose to have the browser automatically accept all cookies,

    never accept any cookies, or ask you each time a site wishes to send a cookie.
    Also,

    sites that use cookies to store visitor preferences should have a posted policy
    on

    what information is stored and how it will be used.


    Q. How many cookies can I create for my Web page?


    A. No more than 20 cookie records can be stored in the cookie property per

    domain. Most professional sites that use cookies store only one cookie to identify
    the

    visitor with a unique ID number or text string. The rest of the data needed to

    customize the visitor''s experience is stored in a related database record on
    the

    server. This is a good practice because it avoids storing sensitive information
    in cookie

    records.


