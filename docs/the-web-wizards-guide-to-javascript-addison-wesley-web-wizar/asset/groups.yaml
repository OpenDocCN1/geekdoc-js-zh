    \n使用选择菜单\n\n52 第三章 ★ 使用表单\n\n★ 快捷：将其放入库中\n\n请务必将列表 3.6 中的 `getSelectValue()` 和\
    \ `showSelectValue()` 函数添加到你的 `mylibrary.js` 文件中。这些函数控制 FORM 中 SELECT 菜单的选值。由于你将创建许多带有\
    \ SELECT 菜单的页面，将这些函数存储在 `mylibrary.js` 中比复制到每个页面中更合理。\n\n选择菜单表单验证 - Netscape\n\
    \n访客网站偏好调查\n姓名：Thomas Dolby\n选择你最喜欢的网站：\nbeatnik.com\n显示作者选择\n立即前往！\n提交调查\n\n\
    图 3.5 列表 3.6 的输出\n\n如何工作？\n\n列表 3.6 生成了以下事件序列。\n\n1. 浏览器加载页面并在内存中创建必要的 FORM 和\
    \ SELECT 对象。会创建一个名为 `chosenSite` 的全局变量，初始值为空文本字符串。HEAD 中的三个函数将使用该变量，因此它必须放置在任何函数之外。\n\
    \n2. 访客从标记为“选择一个站点”的 SELECT 菜单中选择一个命令，然后点击“立即前往！”按钮。该按钮是一个类型为 \"button\" 的输入，带有一个调用\
    \ `openSite()` 函数的 `onclick` 句处理器。\n\n3. HEAD 中的 `openSite()` 函数调用 `getSelectValue()`\
    \ 函数，并传递表单名称 (survey) 和选择菜单的名称 (websites) 以确定访客的选择。\n\n4. `getSelectValue()` 函数创建一个名为\
    \ `theMenu` 的临时变量，并用 survey 表单上的 websites SELECT 对象填充它。它通过利用 document 和 form 内置数组来实现。document\
    \ 包含了页面上所有对象的数组。\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_64_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_64_1.png)\n\
    \n使用选择菜单\n\n53\n\nFORM survey 是此类对象之一。表达式 `document[\"survey\"]` 代表该 FORM。反之，表单创建了其所有对象的另一个数组。SELECT\
    \ websites 是其中一个对象。由于 survey 和 websites 存储在变量中，表达式 `document[name][selectname]`\
    \ 正确地引用了名为 websites 的 SELECT 对象。然后，第二个变量 `selecteditem` 被填充为 `theMenu` 的 `selectedIndex`。`selectedIndex`\
    \ 指 SELECT 菜单上被选命令的数字。编号从 0 开始。然后可以使用表达式 `theMenu.options[item].value` 确定 Menu\
    \ 上被选命令的值。这之所以能通，是因为 SELECT 对象包含了其 OPTIONS 的数组。在这种情况下，编号为 1 的选项（从 0 开始编号的第二个选项）是\
    \ javascript.com，其值为 `http://www.javascript.com`。表达式 `document.survey.websites.options[1].value`\
    \ 将返回值 `http://www.javascript.com`。由于该表达式的第一部分被赋值给变量 `theMenu`，因此可以使用表达式 `theMenu.options[1].value`\
    \ 代替。\n\n5. 全局变量 `chosenSite` 现在包含了访客选择的命令值。`getSelectValue()` 函数完成了工作，因此 `openSite()`\
    \ 函数继续执行下一行。\n\n6. 测试变量 `chosenSite` 是否为空。如果为空，访客将收到一个带有选择指令的警报框。\n\n7. 如果访客选择了某些内容，浏览器将加载访客选择的站点。代码窗口\
    \ `location.href=URL` 将给定的 URL 加载到当前窗口 location 对象的 href 属性中。因为 location 对象在它的\
    \ HREF 属性中存储了已加载文档的 URL，所以更改 HREF 属性的值的值会导致浏览器加载新页面。\n\n8. 访客对哪个站点更受青睐感到好奇心勃勃。访客点击标记为“作者选择”的按钮，这会调用\
    \ `showSelectValue()` 并传递三个参数：FORM 的名称 (survey)、SELECT 的名称 (websites) 以及要要的值的值\
    \ (http://www.beatnik.com)。\n\n9. `showSelectValue()` 函数逐步遍历 SELECT 数组中的元素，直到找到一个与所需值匹配的值。然后，它将\
    \ SELECT 的 `selectedIndex` 设置为匹配值选项的数字。SELECT 显示的文本将更改以匹配新值。\n\n使用选择菜单\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_64_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_64_1)\n\
    \n54 第三章 ★ 使用表单\n\n全局变量与 局域变量\n\n如果你在函数内部创建一个变量，它是局部的。这意味着它在函数外部是不可访问的。如果你在函数外部创建一个变量，它是全局的。这意味着它在任何函数中都可以被访问。请确保在任何特定函数之外声明它。\n\
    \n教育者经常使用表单创建自测题，这有助于学习。正如列表 3.6 所示，创建一个简单的音乐自测题\n\n<html><head><title>Composer\
