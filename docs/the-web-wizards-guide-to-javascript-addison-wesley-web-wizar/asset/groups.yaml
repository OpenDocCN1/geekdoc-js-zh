    \n列表 9.3 中的嗅探脚本对很多用途非常有用。将此可重用代码添加到你的 library.js 文件中是一个好主意。\n\n向优秀人士学习\n\n列表 9.3\
    \ 中的浏览器检测脚本是基于苹果公司在其开发者网站上公开的代码。苹果的版本可以检测更多的浏览器，并提供更多信息。使用 JavaScript 的伟大之处之一是可以在如\
    \ http://developer.apple.com/、http://www.builder.com 和 http://www.javascripts.com\
