    \n检测访问者的浏览器和平台 \n\n160\n\n第九章 应用 Web 技术\n\n## 图 9.3 列表 9.3 的输出 它是如何工作的？\n\n1.\
    \ HEAD 中 SCRIPT 的第一行创建了一个变量 `app`，用于存储描述 navigator 对象 `appName` 属性的文本字符串的小写版本。navigator\
    \ 对象代表浏览器。`appName` 属性持有如 Microsoft Internet Explorer 或 Netscape 之类的文本字符串，用于描述浏览器。\n\
    \n2. 创建了变量 `UA` 来存储描述 navigator 对象 `userAgent` 的文本字符串的小写版本。该属性包含关于浏览器的标识信息。返回的值会有所不同（参见“提示：常用浏览器的\
    \ User Agent 值”）。\n\n3. 创建了变量 `IE`，如果 UA 包含字符串 `ie`，则将其设置为 `true`。为了确定这一点，使用了熟悉的\
    \ `indexOf()` 方法。\n\n4. 创建了名为 `isNS` 的变量，如果 UA 包含字符串 `mozilla`，则将其设置为 `true`。\n\
    \n5. Netscape 使用 `mozilla` 商标，但其他浏览器在它们的 `userAgent` 属性中也包含了 `mozilla` 和 `compatible`\
    \ 字样。因此，必须测试 UA 中是否存在 `compatible`。如果找到，则该浏览器不是 Netscape 浏览器，`isNS` 被设置为 `false`。\n\
    \n检测访问者的浏览器和平台 \n\n161\n\n6. 创建了变量 `platform`，用于存储正在使用的硬件和操作系统信息。navigator 对象的\
    \ `platform` 属性返回如 `Win32`（针对最新 Windows 版本）和 `MacPPC`（针对最新 Macintosh 版本）等值。\n\n\
    7. 建立了用于存储标识平台以及各种流行操作系统版本的布尔值。由于 X-Windows 图形浏览器在各种 UNIX 版本上非常流行，你可以通过在 UA 中搜索\
    \ `unix` 字符串来测试 UNIX 平台。\n\n8. 创建了一个版本变量来存储 navigator 对象 `appVersion` 属性中提供的版本号信息。创建了\
    \ `isMajor` 变量来存储版本号的整数部分。\n\n9. Macintosh 上的 Internet Explorer 5 和两个平台上的 Netscape\
    \ 6 报告的版本号是不正确的。因此，通过两个短条件结构来识别浏览器和平台，并在必要时调整版本号。\n\n10. `isMinor` 持有完整的版本号。\n\
    \n11. 创建了 `obsolete` 变量来存储一个指示浏览器是否为新的布尔值。你对什么是过时的观点可能不同。只有少数浏览器（如 Netscape 6\
    \ 和 Internet Explorer 5）使用了万维网联盟批准的新型文档对象模型 (DOM1)。所有 DOM1 浏览器都能识别文档对象的 `getElementById()`\
    \ 方法。不符合的在段代码段中被标记为过时。\n\n12. 创建了函数 `showInfo()` 来组合一个文本字符串以报告浏览器和平台信息。当访问者点击“Show\
    \ Browser Info”按钮时会调用 `showInfo()` 函数。如果变量 `obsolete` 结果为 `true`，则引导访问者升级其浏览器。\n\
    \n提示常用浏览器的 User Agent 值\n\nMacintosh 上的 Internet Explorer 5: mozilla/4.0 (compatible;\
    \ msie)\nWindows 上的 Internet Explorer 5: mozilla/4.0 (compatible; msie)\nMacintosh\
    \ 上的 Netscape 4: mozilla/4.77 (macintosh)\nWindows 上的 Netscape 4: mozilla/4.77\
    \ (windows)\nMacintosh 上的 Netscape 6: mozilla/6.1 (macpc)\nWindows 上的 Netscape\
    \ 6: mozilla/6.1 (windows)\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_172_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_172_1.png)\n\
    \n检测访问者的浏览器和平台 \n\n162\n\n"
