    \nSummary \n\nYou can use a short group of nested loops to create \n\nlengthy\
    \ and complex tables that include background col¬ \n\nors and JavaScript code.\
    \ When you include quotes within \n\nquotes within quotes, you may need to escape\
    \ the most \n\ndeeply nested quote using the backslash character. \n\nBy using\
    \ client-side image maps with JavaScript, you can \n\ncreate novel and compelling\
    \ user interfaces that involve \n\nsubstantial interactivity. You can use pseudo-URLs\
    \ and \n\nonclick handlers to execute JavaScript code when links \n\nand map areas\
    \ are clicked. \n\nBrowser detection is often necessary to deliver different content\
    \ for different \n\nbrowsers and platforms. Browser detection scripts (sniffers)\
    \ are ideal candidates for \n\nplacement in external code libraries such as your\
    \ mylibrary. js file. \n\nP You can control the text that is displayed in the\
    \ status bar of visitors' computers. 1b \n\navoid interfering with status messages\
    \ coming from the browser, be sure to place \n\nonly temporary information in\
    \ the status bar. An example is a short message that \n\nappears when visitors\
    \ move the mouse over a link. \n\nScrolling text in a form field is an economical,\
    \ low-bandwidth way to attract the \n\nattention of visitors to important announcements\
    \ on your page. \n\n► Your new skills in JavaScript programming will assist you\
    \ in creating Dynamic \n\nHTML and using authoring environments such as Flash\
    \ and Director. Dynamic \n\nHTML is the combination of JavaScript, HTML 4, and\
    \ Cascading Style Sheets. Flash \n\nand Director are two of many products that\
    \ use JavaScript or JavaScript-like lan¬ \n\nguages to create interactivity. \n\
    \nik Online References \n\nInternet development tutorials and scripts are available\
