    \n## Summary\n\n- You can open new windows of any size or position using \nthe\
    \ `window.open()` method, which returns an ID \nvalue that can be stored in a\
    \ variable. You close the \nnew window through scripting (for example, \n`window.close()`).\
    \ You can use switch control structures \nto implement decision making based on\
    \ a variable's \nvalue. The `eval()` function is built into JavaScript and \n\
    evaluates whatever text is passed to it. Valid JavaScript \nstatements passed\
    \ to the `eval()` function are executed \nby the JavaScript interpreter in the\
    \ Web browser. \n\n- You can use the `window.confirm()` method to query \nvisitors\
    \ and get a true or false response, storing it in a \nvariable that determines\
    \ what happens next. The HREF property of the location object \nreveals the URL\
    \ of the current page; changing HREF loads a new page. Each window \nobject also\
    \ contains a history object. The history object maintains a list of pages \nthat\
    \ have been loaded in the current window. \n\nFrames can be seen as a parent-child\
    \ hierarchy of window objects. Each window can \nbe referred to as `self` in any\
    \ script located in the window; the window at the top \nof the hierarchy can be\
    \ referred to as `top`. Because framesets can be nested, references \nto \"parent\"\
    \ will not always be equivalent to \"top.\" The `replace()` method \nof the location\
    \ object changes the URL stored in the history index for that page. \nWhen you\
    \ create a page that changes location upon loading, use the `replace()` \nmethod\
    \ instead of changing the HREF property. This practice avoids creating problems\
    \ with the Back button.\n\n### Online References\n\n- Danny Goodman's JavaScript\
    \ and Browser Objects Quick Reference \nhttp://www.dannyg.com/javascript/quickref/index.html\
    \ \n\n- W3Schools.com reference and tutorial on creating sites with frames \n\
    http://www.w3schools.com/html/html_frames.asp \n\n- W3Schools.com interactive\
    \ examples of using window method \nhttp://www.w3schools.com/js/js_window.asp\
    \ \n\n- W3Schools.com interactive examples of using frames \nhttp://www.w3schools.com/js/js_frames.asp\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_158_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_158_1.png)\n\
    \n# Hands-On Exercises\n\n### Review Questions\n\n1. Explain the use of `screenX`\
    \ and `screenY` as opposed to `left` and `top`.\n2. Why is it desirable to create\
    \ a global variable for the name of each new window you create?\n3. Explain the\
    \ default section of a switch control structure.\n4. What is the `focus()` method?\n\
    5. What is the difference between the HREF property of the window, location object\
    \ and the URL property of the document object?\n6. Why is `parent` not always\
    \ `top` in the hierarchy of frames?\n7. What is `self`?\n8. Explain how the `eval()`\
    \ function can be used in testing code.\n9. Given a frameset with a frame on the\
    \ left called `nav` and a frame on the right called `stuff`, what is the code\
    \ to add to the document in the nav frame to write content to the stuff frame?\n\
    \n### Hands-On Exercises\n\n1. Make sure you have placed the `var window = null`\
    \ declaration, the `openWin()` function, and the `closeWin()` function from Listing\
    \ 8.1 into your `mylibrary.js` file. Create a page that loads `mylibrary.js` and\
    \ opens a new window when the visitor clicks a button. The code will be shown\
    \ here.\n2. Change the parameters in the previous exercise to create new windows\
    \ with different sizes and locations.\n3. Create a page with a new `window.confirm()`\
    \ method. Create a button that calls it. If the visitor confirms, the window closes.\
    \ Otherwise, the window does not.\n4. Create a variant of the previous exercise.\
    \ In this version have a new window when the visitor clicks a button.\n5. Create\
    \ a frameset with two frames. Create a button in the left frame that changes content\
    \ in the right frame. Create a button in the right frame that changes content\
    \ in the left frame. The content will load in both frames.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_159_0.png)\
    \ - Wait, let me re-align the flow.\n\n# Chapter Nine: Applied Web Techniques\n\
    \n150\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_160_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_160_1.png)\n\
    \nIn the previous chapters you learned fundamental concepts about JavaScript and\
    \ the ways it interacts with the browser. In this chapter you'll see practical\
    \ examples of those concepts in action. Dynamic HTML and Cascading Style Sheets\
    \ can boost the power of your JavaScript.\n\n## Generating Content with Nested\
    \ Looping\n\nWeb developers make aesthetic judgments about the background color\
    \ of each page. One way to experiment with background colors is a tedious process.\
    \ With a little programming, you can create a highly interactive table (see Figure\
    \ 9.1). Listing 9.1 creates a standard HTML table and stores it in a variable\
    \ while the HEAD loads. When the BODY loads, a script writes the content of the\
    \ variable to the document to create the table. The trick here is to use a triple\
    \ loop for the red, green, and blue values used in the table. This array holds\
    \ the six hexadecimal values used in the table. This triple loop generates all\
    \ the rows and cells of the table.\n\n"
