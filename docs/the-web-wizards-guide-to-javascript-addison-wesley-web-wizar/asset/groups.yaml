    \n### 6.5 Using the Math Object\n\nThe Math object, like the Date object, is a\
    \ core JavaScript object. The principal difference between the two is that the\
    \ Math object is static, meaning that you never create instances of it. Instead,\
    \ think of it as JavaScript's built-in calculator. When you need to round a number\
    \ use `Math.round(number)`. Here are some of the other common methods of the Math\
    \ object:\n\n- Math.abs(x) returns the absolute value of x.\n- Math.floor(x) returns\
    \ the integer portion of x.\n- Math.max(x, y) returns the greater of x or y.\n\
    - Math.min(x, y) returns the lesser of x or y.\n- Math.random() returns a random\
    \ number between 0 and 1.\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_112_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_112_1.png)\n\
    \n### Getting Numbers from Text Strings\n\nIn Listing 6.9, the code `retirementyear\
    \ = parseInt(birthyear) + parseInt(retirementage)` adds the visitor's age at retirement\
    \ to the visitor's birth year. If the visitor was born in 1962 and intends to\
    \ retire at age 65, the result should be 2027. The problem is that the values\
    \ in `birthyear` and `retirementage` were obtained with window prompts and stored\
    \ as text strings. Combining the text strings \"1962\" and \"65\" produces \"\
    196265\", which would ensure our visitor great longevity but a long wait to retirement.\n\
    \nThe `parseInt()` function is useful to convert text strings to integers when\
    \ the first character is a numeric value. The expressions `parseInt(\"165\")`\
    \ and `parseInt(\"65.75\")` would both return the integer value of 65. The expression\
    \ `parseInt(\"a65\")` would return the value NaN to indicate that the value passed\
    \ to the function was not a number. The `parseInt()` function parses (analyzes)\
    \ the text string. Use the `parseInt()` function or the `parseFloat()` function\
    \ (for values with numbers after the decimal point) whenever you have a text string\
    \ that must be interpreted as a number. These are global functions built into\
    \ JavaScript.\n\nUsing the `parseInt()` function in Listing 6.9, the numbers 1962\
    \ and 65 can be summed correctly and the visitor can retire in 2027.\n\nFigure\
    \ 6.5 shows the output of Listing 6.5.\n\n[Figure 6.5 representation: Retirement\
    \ Countdown, Birth Date: Wednesday, 12 September, 1962, Retirement Date: Sunday,\
    \ 12 September, 2027, Countdown to retirement: Seconds: 824128812, Minutes: 3735430,\
    \ Hours: 228925, Days: 9539, Years: 26, Work Days versus Fun Days, Work days left:\
    \ 6200, Fun days before retirement: 3338]\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_113_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_113_1.png)\n\
    \n## How It Work?\n\n1. The HEAD portion of the page loads. The external library,\
    \ `mylibrary.js`, loads into memory. The arrays for the names of the days of the\
    \ week and the months are stored there.\n2. Global variables for the visitor's\
    \ birth year, month, and retirement year are created. The familiar variable timer\
    \ ID is also created to allow the visitor to control the countdown.\n3. The BODY\
    \ loads a form with several fields to hold the output of the `showTime()` function.\
    \ The BODY also contains two buttons to allow the visitor to start and stop the\
    \ countdown.\n4. When the visitor clicks the Start button, the `startClock()`\
    \ function is called.\n5. The `startClock()` function uses the `window.prompt()`\
    \ method to gather the visitor's birthdate and retirement age.\n6. The `firstdate`\
    \ Date object from step 2 is filled with the visitor's birthdate. The variable\
    \ `retirementyear` is then filled with the sum of the visitor's birthyear and\
    \ the planned retirement age. Finally, the `lastdate` Date object from step 2\
    \ is filled with the visitor's date of retirement as calculated from the birthdate.\n\
    7. The last line of the `startClock()` function invokes the `setInterval()` method\
    \ to call the `showTime()` function repeatedly each second. The ID for this task\
    \ is stored in timer ID.\n8. The `showTime()` function creates the variable `now`\
    \ as an instance of the Date object.\n9. A variable called `seconds` is then filled\
    \ with the number of seconds between the current moment and the moment the visitor\
    \ retires. The `getTime()` method of the Date object returns the number of milliseconds\
    \ between January 1, 1970, and whatever instance of the date object is invoking\
    \ the method. Because the Date object `lasttime` represents a date in the future,\
    \ the number of milliseconds returned will be larger than the number returned\
    \ when the `now` Date object invokes the `getTime()` method. By dividing the difference\
    \ by 1000, we get the number of seconds between the two dates.\n"
