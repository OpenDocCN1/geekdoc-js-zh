    You''re probably reading this book because you know how to create Web pages with
    Hypertext Markup Language (HTML) and now you want to make your pages more interesting
    and dynamic. This book will help you get started by providing clear explanations
    of the fundamentals of the JavaScript language together with code examples to
    demonstrate key concepts.


    To discover the many good reasons to learn JavaScript:

    - To learn the history of JavaScript

    - To master fundamental concepts: objects, properties, values, methods, events,
    variables, arrays, and functions

    - To become familiar with the Document Object Model


