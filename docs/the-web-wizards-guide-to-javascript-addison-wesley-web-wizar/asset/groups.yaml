    Listing 2.8 The HTML Builder Web Page Code


    TIP View the completed HTML Builder page at http://www.awl.com/estrella/.


    In Listing 2.8, notice the <form> HTML form containing three fields: pagetitle,
    bodytext, and mycode. Visitors will type text into the first two fields, click
    the button, and see HTML code displayed in the mycode field. Web wizardry is possible
    because of the buildPage() function in library shown in Listing 2.7.


    The buildPage() function begins by creating a variable called pagecontent. It
    then adds the standard HTML tags <html>, <head>, and <title>. After the <title>
    tag, the text from the pagetitle field is added to the variable pagecontent. Then
    the closing </title> and </head> tags are added. The new line (\n) is then added
    to create a line break to aid readability. Next, the <body> tag is added. Then
    the text the visitor typed into bodytext field is added. The closing </body> and
    </html> tags complete the code. The final line of code places the complete contents
    of the variable pagecontent into the on-screen text field mycode. To be precise,
    the contents of the variable pagecontent are assigned to the value of the text
    field mycode of the form of the current document (see Figure 2.6).


