    \ Work? \n\n1. The mylibrary. js file is loaded into memory when the HEAD loads.\
    \ \n\nWhen the page finishes loading, an onload handler in the BODY tag calls\
    \ \n\nthe showCookies ( ) function. The showCookies ( ) function calls the \n\n\
    GetCookie ( ) function to attempt to retrieve the lastvisited cookie \n\ncontaining\
    \ the date of the visitor's last visit. The result is stored in a variable \n\n\
    called thelastvisit. If thelastvisit is empty, the string No \n\ncookies found,\
    \ is displayed in the cookie jar field on cookieform. \n\nIf thelastvisit contains\
    \ anything at all, the remaining visitor and \n\ncolorchoice cookies are also\
    \ retrieved. These cookie values are stored in \n\nthe variables thevisitor and\
    \ thecolor. \n\n2. The showSelectValue ( ) function (from Chapter Three) stored\
    \ in the \n\nmylibrary. js file changes the display of the colorpicker SELECT\
    \ to \n\nmatch the visitor's preferred color. \n\n3. A new variable, thewelcome,\
    \ is created to hold the welcome message. It is \n\nfilled with a concatenated\
    \ text string containing the visitor's name and the \n\ndate she last visited.\
    \ \n\n4. A new variable, thef eedback, is created to hold a text string to show\
    \ the \n\nformat of the cookie. It is filled with a concatenated text string containing\
    \ \n\neach name-value pair from the cookie. \n\n5. The contents of thef eedback\
    \ are displayed in the cookie jar field on \n\nthe cookieform. \n\n6. The contents\
    \ of thewelcome are displayed in the visitor field on the \n\ncookieform. \n\n\
    7. The setBG( ) function is called. The setBG( ) function calls the \n\ngetSelectValue\
    \ ( ) function (from Chapter Three) to get the selected \n\nvalue from the colorpicker\
    \ SELECT. Then the bgColor property of the \n\ndocument object is changed to the\
    \ selected background color. \n\n8. The visitor chooses a new background color\
    \ using the colorpicker \n\nSELECT. The onchange handler in the SELECT calls the\
    \ setBG( ) func¬ \n\ntion to change the background color immediately. \n\n9. The\
    \ visitor changes the name in the visitor field and then clicks the \n\nMake Cookies\
    \ button. An one lick handler in the button calls the \n\nmakeCookies ( ) function.\
    \ \n\n10. The makeCookies ( ) function creates a new Date object to establish\
    \ the \n\ncurrent date as the date the visitor last visited the page. The date\
