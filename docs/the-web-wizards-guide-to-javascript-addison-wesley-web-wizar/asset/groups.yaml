    \n## 总结\n\n- 你可以使用 `window.open()` 方法打开任何大小或位置的新窗口，该方法会返回一个可以存储在变量中的 ID 值。你通过脚本关闭新窗口（例如，`window.close()`）。你可以使用\
    \ `switch` 控制结构来根据变量的值来实现决策。`eval()` 函数是 JavaScript 内置的，它会评估传递给它的任何文本。传递给 `eval()`\
    \ 函数的有效 JavaScript 语句将由 浏览器中的 JavaScript 解释器执行。\n\n- 你可以使用 `window.confirm()`\
    \ 方法查询访问者并获取真或假响应，将其存储在变量中以决定接下来发生什么。location 对象的 HREF 属性显示了当前页的 URL；更改 HREF 会加载新页面。每个窗口对象还包含一个\
    \ history 对象。history 对象维护了在当前窗口中加载的页面列表。\n\n框架（Frames）可以被视为窗口对象的父子层级结构。窗口中的任何脚本都可以将该窗口称为\
    \ `self`；层级结构顶部的窗口可以称为 `top`。由于框架集可以嵌套，对“parent”的引用并不等同于“top”。location 对象的 `replace()`\
    \ 方法会更改存储在该页面历史索引中的 URL。当你创建一个在加载时更改位置的页面时，请使用 `replace()` 方法而不是更改 HREF 属性。这种做法可以避免产生返回按钮的问题。\n\
    \n### 在线参考\n\n- Danny Goodman 的 JavaScript 和浏览器对象快速参考 \nhttp://www.dannyg.com/javascript/quickref/index.html\
    \ \n\n- W3Schools.com 使用框架创建网站的参考和教程 \nhttp://www.w3schools.com/html/html_frames.asp\
    \ \n\n- W3Schools.com 使用 window 方法的交互式示例 \nhttp://www.w3schools.com/js/js_window.asp\
    \ \n\n- W3Schools.com 使用框架的交互式示例 \nhttp://www.w3Schools.com/js/js_frames.asp\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_158_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_158_1.png)\n\
    \n# 动手练习\n\n### 复习题\n\n1. 解释 `screenX` 和 `screenY` 与 `left` 和 `top` 的区别。\n2. 为什么为你创建的每个新窗口创建一个全局变量名称是理想的？\n\
    3. 解释 `switch` 控制结构的默认部分。\n4. `focus()` 方法是什么？\n5. 窗口 location 对象的 HREF 属性与 document\
    \ 对象的 URL 属性有什么区别？\n6. 为什么在框架层级结构中，`parent` 并不总是 `top`？\n7. 什么是 `self`？\n8. 解释\
    \ `eval()` 函数如何用于测试。\n9. 给定一个名为 `nav` 的框架和一个名为 `stuff` 的框架的集，向 `stuff` 框架写入代码是什么？\n\
    \n### 动手练习\n\n1. 确保你已将列表 8.1 中的 `var window = null` 声明、`openWin()` 函数和 `closeWin()`\
    \ 函数放入 `mylibrary.js` 文件。创建一个在访问者点击按钮时打开新窗口的页面。代码将在此显示。\n2. 更改上练习中的参数以创建不同大小的窗口。\n\
    3. 创建带有 `window.confirm()` 方法的页面。创建一个调用它的按钮。如果访问者确认，则关闭窗口；否则。\n4. 创建上练习的变体。在这个版本中，点击按钮时打开新窗口。\n\
    5. 创建包含两个框架的集。在左侧框架中创建一个按钮更改右侧框架的内容。在右侧框架中创建一个按钮更改左侧框架的内容。内容将在两个框架中加载。\n\n\n"
