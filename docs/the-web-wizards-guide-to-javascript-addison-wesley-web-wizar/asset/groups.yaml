    ## Chapter Seven Cookies: Maintaining State


    ### Creating and Deleting Cookies 110


    The cookie is a property of the document object. The value of the cookie property
    consists of a string of text. In most cases, creating a cookie involves creating

    only a cookie name and its associated value. In this example, the cookie property
    is set to contain a cookie called username with a value of clara:


    `document.cookie = "username=clara";`


    Optional information in the cookie can specify when it expires. After the expiration
    date, the browser automatically deletes the cookie. If an expiration date is

    not specified, the cookie expires when the visitor exits or quits the Web browser.


    `document.cookie = "username=clara; expires=Mon, 18-Jun-01 00:00:01 GMT";`


    The expiration date is always expressed in GMT (Greenwich Mean Time). To

    convert local time to GMT, you could use a sequence of statements like the snippet
    shown next. This sequence creates an expiration date one year in the future by

    finding the number of milliseconds elapsed since January 1, 1970 (the `getTime()`
    method), and adding a year''s worth of milliseconds (365*24*60*60*1000). The `toGMTString()`
    method converts the new date to GMT.


    ```javascript

    var expirationdate = new Date();

    var oneyear = expirationdate.getTime() + (365 * 24 * 60 * 60 * 1000);

    expirationdate.setTime(oneyear);

    document.cookie = "username=clara; expires=" + expirationdate.toGMTString();

    ```


    Path and domain information are sometimes added to a cookie to specify the

    location of pages that are authorized to retrieve the cookie. If these options
    are not

    set, the location and domain of the page creating the cookie are assumed.


    `document.cookie = "username=clara; expires=Mon, 18-Jun-01 00:00:01 GMT; path=/aw;
    domain=stevenestrella.com";`


    Finally, you may require that the server be using a secure channel (the HTTPS

    protocol) before sending the cookie.


    `document.cookie = "username=clara; expires=Mon, 18-Jun-01 00:00:01 GMT; path=/aw;
    domain=stevenestrella.com; secure";`


    The browser stores the cookie as plain text. The exact appearance of the cookie

    will vary among browsers. The following cookie records come from the cookie text

    file of Netscape Communicator 4.7. They were created by a page located in the
    /aw

    directory on www.stevenestrella.com. Neither the expiration date nor the

    secure option was set, and that''s why the word FALSE appears twice in each cookie
    record.


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_122_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_122_1.png)


