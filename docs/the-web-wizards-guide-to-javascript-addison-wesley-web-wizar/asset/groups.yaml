    \ if necessary, adjust the \n\nversion number. \n\n10. The variable isMinor holds\
    \ the full version number. \n\n11. The obsolete variable is created to hold a\
    \ Boolean value that indicates \n\nwhether the browser is recent. Your viewpoint\
    \ on what is obsolete may be \n\ndifferent. Only a few browsers, such as Netscape\
    \ 6 and Internet Explorer 5, \n\nuse the new Document Object Model (DOM1) sanctioned\
    \ by the World Wide \n\nWeb consortium. All DOM1 browsers recognize the getElementByld(\
    \ ) \n\nmethod of the document object. Those that do not are tagged as obsolete\
    \ in \n\nthis code snippet. \n\n12. A function showInfo( ) is created to assemble\
    \ a text string to report the \n\nbrowser and platform information. The showInfo(\
    \ ) function is called \n\nwhen the visitor clicks the Show Browser Info button.\
    \ If the variable \n\nobsolete evaluates as true, the visitor is cajoled into\
