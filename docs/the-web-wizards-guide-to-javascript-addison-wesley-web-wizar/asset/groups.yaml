    \ Cookies \n\n### Using the mylibrary.js File \n\nIn Listing 7.3 the getSelectValue(\
    \ ) and showSelectValue( ) functions are called but not defined in the code. Instead,\
    \ they're stored in the mylibrary.js file. These two functions were created in\
    \ Chapter Three. By continuing to add functions to mylibrary.js you will be able\
    \ to more quickly create new pages without having to reinvent the wheel each time\
    \ you perform a familiar task. \n\nFigure 7.2 shows the output of Listing 7.3.\
    \ \n\nFigure 7.2 Output of Listing 7.3 Showing Retrieved Cookies\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_130_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_130_1.png)\n\
    \n119 \n\nCustomizing a Web Page with Cookies \n\nHow Does It Work? \n\n1. The\
    \ mylibrary.js file is loaded into memory when the HEAD loads. When the page finishes\
    \ loading, an onload handler in the BODY tag calls the showCookies( ) function.\
    \ The showCookies( ) function calls the GetCookie( ) function to attempt to retrieve\
    \ the lastvisited cookie containing the date of the visitor's last visit. The\
    \ result is stored in a variable called lastvisit. If the lastvisit is empty,\
    \ the string No cookies found, is displayed in the cookie jar field on cookieform.\
    \ If the lastvisit contains anything at all, the remaining visitor and colorchoice\
    \ cookies are also retrieved. These cookie values are stored in the variables\
    \ thevisitor and the color. \n\n2. The showSelectValue( ) function (from Chapter\
    \ Three) stored in the mylibrary.js file changes the display of the colorpicker\
    \ SELECT to match the visitor's preferred color. \n\n3. A new variable, the welcome,\
    \ is created to hold the welcome message. It is filled with a concatenated text\
    \ string containing the visitor's name and the date she last visited. \n\n4. A\
    \ new variable, the feedback, is created to hold a text string to show the format\
    \ of the cookie. It is filled with a concatenated text string containing each\
    \ name-value pair from the cookie. \n\n5. The contents of the feedback are displayed\
    \ in the cookie jar field on the cookieform. \n\n6. The contents of the welcome\
    \ are displayed in the visitor field on the cookieform. \n\n7. The setBG( ) function\
    \ is called. The setBG( ) function calls the getSelectValue( ) function (from\
    \ Chapter Three) to get the selected value from the colorpicker SELECT. Then the\
    \ bgColor property of the document object is changed to the selected background\
    \ color. \n\n8. The visitor chooses a new background color using the colorpicker\
    \ SELECT. The onchange handler in the SELECT calls the setBG( ) function to change\
    \ the background color immediately. \n\n9. The visitor changes the name in the\
    \ visitor field and then clicks the Make Cookies button. An onclick handler in\
    \ the button calls the makeCookies( ) function. \n\n10. The makeCookies( ) function\
    \ creates a new Date object to establish the current date as the date the visitor\
    \ last visited the page. The date is stored in the variable lastvisit as a text\
    \ string in the local format using the toLocaleString( ) method of the date object.\
    \ \n\n11. A variable, expHours, is created to hold the number of hours before\
    \ the cookie will expire. A second Date object, expireDate, is created and filled\
    \ with a new time 24 hours in the future. \n\nCustomizing a Web Page with Cookies\n\
    \n![](img/7705a881c3cbfe90339b9b12a38fc1c6_131_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_131_1.png)\n\
    \nCreating \n\n120 \n\nChapter Seven Cookies: Maintaining State \n\n12. Two new\
    \ variables—visitorname and visitorcolor—are filled with the values the visitor\
    \ entered in the visitor field and colorpicker SELECT. \n\n13. The SetCookie(\
    \ ) function is called three times to create the cookies lastvisit, visitor and\
    \ colorcolor set to expire in 24 hours. \n\n14. An alert notifies the visitor\
    \ that the cookies are finished. \n\n15. The visitor goes to another Web page\
    \ and then returns to this page. When she returns, the onload handler in the BODY\
    \ tag calls the showCookies( ) function to display the appropriate welcome message\
    \ and change the background color to reflect the visitor's preference. \n\n16.\
    \ The visitor clicks the Delete Cookies Button. The trashCookies( ) function is\
    \ called. \n\n17. The trashCookies( ) function calls the DeleteCookie( ) function\
    \ three times to delete the three cookies. An alert informs the visitor that the\
    \ cookies have been deleted. The SELECT is reset. The background color is set\
    \ to white. Default values are set for the visitor and cookie jar fields. \n\n\
