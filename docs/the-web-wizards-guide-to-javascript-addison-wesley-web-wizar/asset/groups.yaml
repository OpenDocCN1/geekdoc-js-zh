    \nJavaScript and Frames \n\n142 \n\nChapter Eight Working with Windows and Frames\
    \ \n\n<html><head><title>Frame Scripting</title> \n\n<script type=\"text/javascript\"\
    \ language=\"JavaScript\"> \n\n<! — \n\nDisplays the page without frames. \n\n\
    function unframelt(){ \n\nif (top.location != self.location){ \n\ntop.location.replace(self.location);\
    \ \n\n} \n\nDisplays the page within the frameset. \n\n} I- \n\nfunction framelt(){\
    \ \n\nif (top.location \\== self.location){ \n\ntop.location.replace(\"listing8.3.html\"\
    ); \n\n} \n\n} \n\n// —> \n\n</script> \n\n</head> \n\n<body bgcolor=\"white\"\
    > \n\n<p><a href=\"javascript:unframelt();\"\\>View this page \n\nwithout frames.</a></p>\
    \ \n\n<p><a href=\"javascript:framelt();\"\\>View this page with \n\nframes.</a></p>\
    \ \n\n</body> \n\n</html> \n\nListing 8.5 home.html, the Content Frame for the\
    \ Frameset in Listing 8.3 \n\nFigure 8.3 shows the result of executing Listings\
    \ 8.3, 8.4, and 8.5. \n\nFrames are best visualized as a hierarchy of multiple\
    \ window objects in a parent- \n\nchild relationship. In fact, browsers treat\
    \ individual frames almost exactly the way \n\nthey treat windows. The parent\
    \ window in Listing 8.3 contains a document \n\nobject that merely includes the\
    \ HTML code to load the frameset. Each of the two \n\nchild windows (Listings\
    \ 8.4 and 8.5), however, contains a document object that \n\nloads standard HTML\
    \ pages (navbar. html and home. html in this example) \n\ninto the left and right\
    \ frames. \n\nEach window can be referred to as self in any script located in\
    \ the window. \n\nThe window at the top of the hierarchy can be referred to as\
    \ top. In Listing 8.5, \n\nthe functions unframelt( ) and framelt ( )are called\
    \ by pseudo-URLs in the \n\ntwo links on the page. \n\nThe unframelt( ) function\
    \ compares the location of the current window \n\n(self) to the location of the\
    \ window at the top of the hierarchy (top). If they are \n\nnot the same, it means\
    \ that the child window (self) is being viewed inside a \n\nframeset. To get the\
    \ child window out of the frameset, the location of the top win¬ \n\ndow (top)\
    \ is replaced with the location of the child window (self)."
