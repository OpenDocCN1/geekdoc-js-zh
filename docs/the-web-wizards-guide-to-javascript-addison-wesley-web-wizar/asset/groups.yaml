    ## 表单验证


    想象你正在 k9treats.com 购物（这不是一家真实的公司）。你刚刚点击了按钮，将一盒肝脏零食加入你的在线购物车。然后你点击了“结账”（Check Out）按钮。下一个页面可能会显示一个
    HTML 表单，要求你输入姓名、地址和信用卡信息。假设你输入了姓名和地址，但忽略了输入信用卡信息。当你点击“继续”（Continue）时，屏幕上的文字会提醒你，在继续之前必须输入信用卡号。


    该提醒页面是使用被称为“表单验证”（form validation）的 JavaScript 技术实现的。当你点击“继续”时，会调用一个 JavaScript
    函数。该函数检测到信用卡字段中没有有效输入，并创建了一个页面提醒你输入所需信息。


    ### 文本字段的操作


    表单内的文本字段是通过 HTML `<input type="text">` 标签（用于单行文本输入）或 HTML `<textarea></textarea>`
    标签（用于多行文本输入）创建的。你可以使用 NAME 和 VALUE 属性为这两个标签分配名称和值。


    这意味着，当访客在你的页面上向文本字段中输入某些内容时，你可以通过名称查询输入字段，并找到访客输入的值。在许多情况下，你可能希望创建一个包含必填字段的表单。在表单通过电子邮件发送给你之前，能够判断访客是否在必填字段中输入了信息是非常用的。列表
    3.1 演示了一个简单的表单验证程序，以确保访客在邮件表单之前在文本字段中输入了内容。


    ```html

    <html><head><title>基础表单验证</title>

    <script type="text/javascript" language="JavaScript">

    <! //

