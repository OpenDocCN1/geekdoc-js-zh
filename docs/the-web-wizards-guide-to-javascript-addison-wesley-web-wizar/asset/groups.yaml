    \ the window.location.href property to load different pages for the different\
    \ browsers.\n4. Create a page of links to display different text in the status\
    \ bar when the visitor rolls the mouse over the links.\n5. Create an example of\
    \ scrolling text in a field. Can you get the text to scroll backward?\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_182_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_182_1.png)\n\
