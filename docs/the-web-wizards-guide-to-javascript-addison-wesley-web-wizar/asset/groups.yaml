    visitor returns to your page, he must remember his user name and password to log\
    \ \n\nin again. \n\nNow imagine that the visitor could click a button on your\
    \ login screen to store \n\nthe user name and password conveniently on his hard\
    \ drive. Now each time he \n\nreturns to your login page, the client software\
    \ automatically retrieves the name and \n\npassword and sends it to the server.\
    \ The visitor's hard drive stores the login infor¬ \n\nmation until it's needed.\
    \ \n\nCookie is a computer science term that refers to a piece of data held by\
    \ an inter¬ \n\nmediary. In this case, the visitor's hard drive is the intermediary\
    \ positioned between \n\nthe client and the server. Cookies are actually small\
    \ chunks of text usually stored in \n\na plain old text file on the hard drive\
    \ of the client. In the early 1990s, Lou Montuili \n\ncreated the original cookie\
    \ specification for Netscape Navigator version 1.0, the first \n\nbrowser to have\
    \ this feature. \n\nMost major Web sites use cookies to personalize the browsing\
