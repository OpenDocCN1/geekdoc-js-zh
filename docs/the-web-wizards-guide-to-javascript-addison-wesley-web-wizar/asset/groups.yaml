    ## a Page to Test Code


    Summary Programming requires an understanding of sequence, the order in which
    tasks are executed. When your script requires repetitive actions, the best approach
    is often a for loop. Scripts that require decision making use branching structures
    as if-else. Scripts can be placed in either the HEAD or BODY section but are usually
    placed in the HEAD. External libraries often make it easier to create multiple
    pages. Using the eval() function makes it easy to test your code.


    Online References


