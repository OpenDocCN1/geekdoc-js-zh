    FORM contains text fields in the second column to display the quantity desired
    of each flag. The prices in the third column are already set so they appear as
    plain text. The totals in the fourth column are calculated from the quantities
    in the second column.


    3. The onload handler in the BODY tag calls the showCookies ( ) function to find
    the cookies the visitor created while shopping at the previous page. The showCookies
    ( ) function uses a loop to check for cookies that correspond to the names found
    in the myproducts array. Any values it finds are displayed in the appropriate
    form field.


    4. The calculate ( ) function is called as the last statement in the showCookies
    ( ) function. A variable called amountdue is created. Then a loop steps through
    the elements of the myproducts array. The first statement inside the loop finds
    the value in a field whose name is the combination of the name of the country
    and the characters qty. That value is placed in the variable itemqty. The parseInt(
    ) function then converts the content of itemqty to an integer, and that value
    is multiplied by the price of the item found in my prices array. The result is
    stored in a variable called itemtotal and then displayed in a field whose name
    is the combination of the current element of the myproducts array (Canada, usa,
    or uk) and the word total. The variable amountdue is then increased by the amount
    stored in itemtotal and displayed in the field grandtotal.


    5. The visitor makes any desired changes to the quantity fields. An onchange handler
    in each field calls the qtyUpdate ( ) function. The qtyUpdate ( ) function updates
    the three cookies and calls the calculate ( ) function to update the item totals
    and the amount due.


