    \n列表 9.1 网络安全色预览表\n\n使用嵌套循环生成内容\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_163_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_163_1.png)\n\
    \n使用嵌套循环生成内容\n\n152\n\n第九章 实用 Web 编程技术\n\n## 警告：JavaScript 中的嵌套引号\n\n在将字符串赋值给变量时，必须用引号将文本括起来。如果文本本身包含引号，可以使用单引号作为嵌套引号。然而，如果嵌套单引号内的文本也需要引号，则该引号必须使用反斜杠（`\\\
    `）进行转义，以确保浏览器将该引号视为目标文本字符串的一部分。否则，引号将提前标记文本字符串的结束，导致您的脚本无法工作。在这里，反斜杠确保了赋值给 `tdcontent`\
    \ 的文本字符串包含了十六进制颜色值周围的引号：\n\n`var tdcontent = \"onclick = 'document.bgColor = \\\
    \"#FFFFFF\\\"\"`\n\n006699\n009999\n009933\n00CCFF\n139999\n3399CC\n33CC66\nFFFFFF\n\
    66FFD0\n993300\n99FF00\nCC6600\nCC6633\n\n网络安全色 - Netscape 6\n\n216 种网络安全色表\n\n\
    点击任何数字来更改背景颜色。\n\n重置 (RESET)\n\n| | | | | | |\n|---|---|---|---|---|---|\n| 003333\
    \ | 003366 | 003399 | 0033CC | 00FF | |\n| 006600 | 006633 | 006699 | 0099CC |\
    \ 0099FF | |\n| 009900 | 009966 | 00CC00 | 00CC33 | 00CC66 | |\n| 00CC99 | 00CCCC\
    \ | | | | |\n| 00FF00 | 00FF33 | 00FF66 | 00FF99 | 00FFCC | |\n| 00FFFF | 333300\
    \ | 333333 | 333366 | 333399 | |\n| 339900 | 339933 | 339966 | 3399CC | 3399FF\
    \ | |\n| 33FFFF | 666600 | 666633 | 666666 | 666699 | |\n| 66CC00 | 66CC33 | 66CC66\
    \ | 66CC99 | 66FFFF | |\n| 990000 | 990033 | 990066 | 990099 | 9900CC | |\n| 993300\
    \ | 993366 | 999999 | | | |\n| 99FFFF | | | | | |\n\n图 9.1 列表 9.1 的输出\n\n![](img/7705a881c3cbfe90339b9b12a38fc1c6_164_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_164_1.png)\n\
    \n153\n\n使用嵌套循环生成内容\n\n它是如何工作的？\n\n1. HEAD 中的 `<script>` 标签所有内容在页面加载时执行。\n2. 建立一个数组来存储\
    \ 216 种网络安全的十六进制值。变量 `hexvalue` 用于存储显示在每个单元格中的十六进制值。然后创建变量 `tablecontent` 用于存储创建表格所需的\
    \ HTML 代码。\n3. 初始化几个变量来存储每个单元格的各个部分（`<td>` 标签）。每个单元格将以不同的背景颜色显示，并包含一个按钮；点击按钮时，处理程序将更改背景颜色。在后续的循环中，单元格的部分将与颜色值相结合。\n\
    4. 开始三重嵌套循环，外层循环从红色值开始。对于每个红色值，创建六行。这六行具有相同的红色，但绿色值不同。每行的六个单元格具有相同的红色和绿色，但蓝色值不同。\n\
    5. 组合 RGB 数组并存储在变量 `hexvalue` 中。然后将每个单元格的片段组合成标准的 表格单元格代码。一个单元格的字符串（参见“JavaScript\
    \ 中的嵌套引号”）：\n`<td width=80 height=40 bgcolor=#ffcc99 align=center valign=middle><input\
    \ type=button value=\"ffcc99\" onclick=\"document.bgColor='#ffcc99'\"></td>`\n\
    6. 将表格每个单元格添加到 `tablecontent` 中。创建六个单元格后，还会添加新行的代码。在添加所有单元格后，添加最后的表格结束标签，表格即完成。\n\
    7. BODY 加载一个包含普通表格的 `<form>`，其中包含一个点击会刷新页面的按钮。\n8. BODY 中的 `<script>` 使用 `document.write()`\
    \ 方法将表格（来自 `tablecontent` 内容）添加到文档。`<form>` 结束。\n9. 文档末尾添加文本，协助访问者判断给定背景颜色与黑色文字配合时的适用性。\n\
    10. 访问者点击按钮尝试颜色。如果她在某些 Netscape 浏览器中调整窗口，表格将不会重绘，但她点击重置按钮可以恢复表格。\n\n"
