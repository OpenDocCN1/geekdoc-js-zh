    \nGenerating Content with Nested Looping\n\n152\n\nChapter Nine Applied Web Programming\
    \ Techniques\n\n## Warning: Nested Quotes in JavaScript\n\nWhen assigning a text\
    \ string to a variable, you must \nenclose the text in quotes. If the text itself\
    \ contains \nquotes, you can use single quotes for the nested \nquote. If the\
    \ text within the nested single quotes \nrequires a quote, however, that quote\
    \ must be \nescaped (\\) using a backslash (\\\\) to ensure that \nthe browser\
    \ will interpret the quote as part of the \ndesired text string. Otherwise, the\
    \ quote will prematurely \nmark the end of the text string and your script \n\
    won't work. Here, the backslash ensures that the text \nstring assigned to tdcontent\
    \ contains quotes \naround the hexadecimal color value:\n\nvar tdcontent = \"\
    onclick = 'document.bgColor = \\\"#FFFFFF\\\"'\"\n\n006699\n009999\n009933\n00CCFF\n\
    139999\n3399CC\n33CC66\nFFFFFF\n66FFD0\n993300\n99FF00\nCC6600\nCC6633\n\nWeb\
    \ Safe Colors - Netscape 6\n\nChart of 216 Web safe Colors\n\nClick any number\
    \ to change the background color.\n\nRESET\n\n| | | | | |\n|---|---|---|---|---|\n\
    | 003333 | 003366 | 003399 | 0033CC | 00FF |\n| 006600 | 006633 | 006699 | 0099CC\
    \ | 0099FF |\n| 009900 | 009966 | 00CC00 | 00CC33 | 00CC66 |\n| 00CC99 | 00CCCC\
    \ | | | |\n| 00FF00 | 00FF33 | 00FF66 | 00FF99 | 00FFCC |\n| 00FFFF | 333300 |\
    \ 333333 | 333366 | 333399 |\n| 339900 | 339933 | 339966 | 3399CC | 3399FF |\n\
    | 33FFFF | 666600 | 666633 | 666666 | 666699 |\n| 66CC00 | 66CC33 | 66CC66 | 66CC99\
    \ | 66FFFF |\n| 990000 | 990033 | 990066 | 990099 | 9900CC |\n| 993300 | 993366\
    \ | 999999 | | | |\n| 99FFFF | | | | |\n\nFigure 9.1 Output of Listing 9.1\n\n\
    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_164_0.png)[](img/7705a881c3cbfe90339b9b12a38fc1c6_164_1.png)\n\
    \n153\n\nGenerating Content with Nested Looping\n\nHow Does It Work?\n\n1. The\
    \ entire content of the SCRIPT tag in the HEAD executes when the page loads.\n\
    2. An array is established to hold the hexadecimal values used in 216 Web-safe\
    \ colors. The variable hexvalue is created to hold the hexadecimal value to be\
    \ displayed in each cell of the table. Then the variable tablecontent is created\
    \ to hold all the HTML code that will be used to create the table.\n3. Several\
    \ variables are then initialized to hold the various parts of each table data\
    \ cell (the <td> tag). Each table data cell will display with a different background\
    \ color and will contain a button; one click handler will change the background\
    \ color of the page when the button is clicked. In the forthcoming loop, the parts\
    \ of each table data cell will be combined with the color value for each cell.\n\
    4. A triple nested loop begins, starting with the red values in the outer loop.\
    \ For each red value, six rows are created. The six rows have the same red value\
    \ but different green values. The six cells of each row have the same red and\
    \ green values but different blue values.\n5. The elements of the RGB array are\
    \ assembled and stored in the variable hexvalue. Then the pieces of each table\
    \ data cell are assembled into the standard code for an HTML table data cell.\
    \ Here's the string for one of the cells (see \"Warning: Nested Quotes in JavaScript\"\
    ):\n`<td width=80 height=40 bgcolor=#ffcc99 align=center valign=middle><input\
    \ type=button value=\"ffcc99\" onclick=\"document.bgColor='#ffcc99'\"></td>`\n\
    6. Each cell of the table is added to the contents of the variable tablecontent.\
    \ After six cells are created, the code to add a new row is also added. After\
    \ all the cells are added, the final closing table tag is added and the table\
    \ is complete.\n7. The BODY loads a FORM containing a normal table to display\
    \ a button that reloads the page when clicked.\n8. A SCRIPT in the BODY uses the\
    \ document.write() method to add the table (from the contents of the variable\
    \ tablecontent) to the document. The FORM ends.\n9. Text is added at the end of\
    \ the document to assist the visitor in making judgments about the appropriateness\
    \ of a given background color when used with black text.\n10. The visitor clicks\
    \ the buttons to experiment with the colors. If she resizes the window in some\
    \ Netscape browsers, the table will not be redrawn, but she clicks the Reset button\
    \ to restore the table.\n"
