    makeCookies()\"></li>\n        <li>浏览互联网上的任何其他页面。</li>\n        <li>返回此页面以查看你的\
    \ cookies。</li>\n    </ol>\n    <br><br>\n    <hr>\n    <p>Cookies 将在这里显示。</p>\n\
