    ## Creating Multiple Rollover Images


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_78_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_78_1.png)


    67


    ### Chapter Four Image Swapping


    ### How Does It Work?


    Listing 4.4 produces the following sequence of events. Take your time and examine
    each step as it relates to the code.


    1. The browser loads the HEAD portion of the HTML document into its memory.

    2. The browser creates eight blank image objects with names corresponding to the
    on and off states of the four images on the page.

    3. The browser fills the SRC properties of the new images by retrieving graphics
    files found in the images folder located in the same folder as the current document.
    The image files are now located in the browser''s cache folder on the visitor''s
    hard drive.

    4. The browser loads the swapImage() and rollOffAll() functions into memory, but
    these functions do nothing until they are called.

    5. The browser loads the BODY section of the document, including four named image
    objects created with the IMG tag.

    6. The visitor moves the mouse on top of the image called beethoven. A mouseover
    event is generated in the browser''s memory.

    7. The anchor tag handles the mouseover event by calling the function-swapImage()
    and passing the desired version, ON, and the name of the image, beethoven, to
    the function.

    8. The swapImage() function takes the name of the image beethoven and puts it
    into a variable called imagename. It then uses the eval() function to combine
    imagename with version (ON) and .src to produce beethovenON.src. The eval() function
    takes the contents of beethovenON.src (an image file) and assigns it to replace
    the SRC property of the beethoven image object. The image swap on rollover is
    accomplished.

    9. The visitor moves the mouse outside the image, and the onmouseout event handler
    calls the rollOffAll() function. The rollOffAll() function calls the swapImage()
    function four times to change each image back to its off version.

    10. The visitor rolls the mouse over any image. The mouseover and mouseout events
    are handled as described earlier. Glowing versions of each image appear on rollover.

    11. The visitor clicks the bach image with the intention of viewing a related
    page about J.S. Bach.

    12. The browser handles the click event by calling the rollOffAll() function.
    All the images revert to their off versions. rollOffAll() is particularly useful
    when you''re using this page in a frameset.

    13. The click event handler returns a value of true, and that allows the browser
    to continue its normal link behavior and load the new Web page indicated in the
    HREF property of the <a> tag.


    ### Creating a Double Rollover


    The classic rollover technique is a nice interface enhancement. It provides feedback
    to visitors as they move the mouse. An even more useful enhancement gives visitors
    additional information about each link each time the mouse is rolled on top of
    the linked image. This technique can be called a double rollover because rolling
    the mouse over a linked image results in two image swaps. Listing 4.5 creates
    the same rollover as Listing 4.4 but also displays the birth and death dates of
    each composer.


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_79_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_79_1.png)


    68


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_80_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_80_1.png)


    69


    ![](img/7705a881c3cbfe90339b9b12a38fc1c6_81_0.png)![](img/7705a881c3cbfe90339b9b12a38fc1c6_81_1.png)

