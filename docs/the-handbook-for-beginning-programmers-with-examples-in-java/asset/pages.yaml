  md: '# Case Sensitive


    JavaScript is case sensitive, so if you want your JavaScript program to work,
    you must be careful to always type characters with the correct case. For example,
    to cause the computer to open a popup window, you must type window.alert not Window.Alert.


    # Declaring Variables


    A variable is a location within the computer''s memory to store data. When writing
    a computer program, a programmer declares variables so that the computer will
    reserve space in memory for the variables'' contents. In JavaScript, we declare
    a variable by writing the keyword var and the variable''s name. Here are several
    examples of declaring variables in JavaScript.


    ```

    var price;

    var numStudents;

    var name;

    ```


    # String Concatenation


    Within a JavaScript program a piece of text is called a string of text. In JavaScript
    you must surround all strings of text with quotes. It doesn''t matter if you use
