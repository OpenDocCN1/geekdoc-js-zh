  md: '# Chapter Summary


    +   * A function is a reusable part of a program that performs one task such as
    calculating the average of a list of numbers or the area of a triangle.

    * A function has a header, also called the signature, and a body.

    * The header of a function includes the function''s parameters. Each parameter
    is a variable. The values for a function''s parameters come from the point in
    the program where a function is called.

    * The body of a function includes all the statements to perform a task such as
    a calculation and a return statement to return a calculated value to the call
    point.

    * To call a function, write the function''s name followed by the arguments that
    the function will need to perform its task.

    * To store the value returned from a function write a variable name and the assignment
    operator (=) at the call point of the function.


