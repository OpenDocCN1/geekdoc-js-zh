  md: "You might be wondering how a sort function works. There are many different,\
    \ well known sort algorithms (selection, exchange, insertion, heap, quick, etc.).\
    \ They all work by repeatedly comparing elements in an array to other elements\
    \ in the array and simply moving the elements within the array. Shown below is\
    \ JavaScript code to sort an array using insertion sort algorithm. Insertion sort\
    \ is a simple and reasonably fast algorithm, although it is usually not as fast\
    \ as the quick sort algorithm.\n\n# Example 24\n\n```\n// Sorts the contents of\
    \ the specified array\n// ascending sort order using the insertion sort algorithm.\n\
    function sort(list) {\n  var last = list.length - 1;\n  for (var i = last - 1;\
    \ i >= first; i--) {\n    var swap = list[i];\n    for (var j = i + 1; j <= last;\
    \ j++) {\n      if (swap <= list[j]) {\n        break;\n      }\n      list[j\
    \ - 1] = list[j];\n    }\n    list[j - 1] = swap;\n  }\n}\n```\n\n# Desk Check\n\
    \n| list | | | first | last | swap | j |\n|---|---|---|---|---|---|-|\n| 6 | 8\
    \ | 9 | 7 | 0 | | |\n| 6 | 8 | 9 | | | | |\n| | -8 | | | | | |\n| 6 | 0 | 7 |\
    \ 9 | | | |\n| | | | 7 | 9 | | |\n| [0] | [1] | [2] | [3] | [4] | | |"
