  md: '# # Chapter 6. Selection


    In order for computer programs to be useful, a computer must be able to make decisions.
    The computer makes sets of decisions by evaluating a condition and if the condition
    is true, selecting one of statements to execute. If the condition evaluates to
    false, then the computer selects a different set of statements to execute. This
    decision making ability is known as **selection** because the computer is selecting
    either group of statements or another group of statements to execute. A selection
    statement is also called an **statement** because in most programming languages
    it starts with the keyword if.


    # ## Chapter Outcomes


    By the end of this chapter you will be able to read and write:


    +   * if statements with a single condition

    * nested if statements

    * a set of if...else if...else statements

    * switch statements which can be used instead of a set of if...else if...else
    statements


    # ## Relational Operators


    A selection statement always has a **condition** which is the test the computer
    uses to select one set of statements or the other. A condition always evaluates
    to either true or false. Any expression that evaluates to either true or false
    is called a boolean expression named after the British mathematician George Boole.
    There are JavaScript **relational operators** which test the relation between
    two values and yield true or false.


    # ### JavaScript Relational Operators


    | Operator | Name | Example |

    | --- | --- | --- |

    | < | less than | if (i < 3) |

    | > | greater than | if (x > y) |

    | <= | less than or equal to | if (row <= end) |

    | >= | greater than or equal to | if (age >= 8) |

    | == | equal to | if (col == last) |

    | != | not equal to | if (col != last) |


    The relational operators are used inside the condition of selection statements.
    Shown below are the different forms of selection statements available in JavaScript.'
  merge: -1
  pgno: 74
