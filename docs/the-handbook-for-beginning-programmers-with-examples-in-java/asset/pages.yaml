  md: "# Example 13\n\n```\n// Reverses the contents of the specified array.\nfunction\
    \ reverse(list) {\n    var left = 0;\n    var right = list.length - 1;\n\n   \
    \ while (left < right) {\n        // Exchange two elements.\n        var swap\
    \ = list[left];\n        list[left] = list[right];\n        list[right] = swap;\n\
    \n        // Move the indexes toward the center.\n        left++;\n        right--;\n\
    \    }\n}\n```\n\n| Desk Check | left | right | swap |\n|---|---|---|---|---||\n\
    | 3.4 | -2 | 5 | 7 | 12 |\n| [0] | [1] | [2] | [3] | [4] |\n\n# Summing the Values\
    \ in an Array\n\nWithin a program, we often have a series of numbers stored in\
    \ an array, and the program needs to calculate the sum of those numbers. This\
    \ is easily done by writing a function with a variable to hold the sum and a loop\
    \ that adds each value in an array to that variable.\n\n# Example 14\n\n```\n\
    // Returns the sum of the values stored in an array.\nfunction sum(list) {\n \
    \   var s = 0;\n    for (var i = 0; i < list.length; i++) {\n        s += list[i];\n\
    \    }\n    return s;\n}\n```\n\n| Desk Check | i | s |\n|---|---|---||\n| 3.4\
    \ | -2 | 5 | 7 | 12 |\n| [0] | [1] | [2] | [3] | [4] |"
