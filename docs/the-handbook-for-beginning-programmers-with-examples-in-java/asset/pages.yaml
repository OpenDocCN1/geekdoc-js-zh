  md: '# # Chapter 12. Strings


    Within a computer program the term **string** refers to a string of text or a
    group of characters strung together. When writing JavaScript code, a good way
    to visualize a string is as an array of individual characters inside an object
    with 0 as the index of the first character.


    # ## Chapter Outcomes


    By the end of this chapter you will be able to:


    +   - Create strings that include special characters as escape sequences.

    - Use the length attribute of a string.

    - Access a single character within a string.

    - Compare two strings.

    - Use the built-in string methods.


    # ## Creating a String


    To create a string you can use a string literal inside single ('''') or double
    (")") quotes or the new keyword.


    # ## Templates


    ```

    var name = ''any text here'';

    var name = ''any text here'';

    var name = new String(thing);

    ```


    where thing is any valid JavaScript expression to be converted to a string.


    # ## Example 1


    ```

    var title = ''Oh Say, What is Truth?'';

    var other = "Truth Reflects upon Our Senses";

    var another = new String(''Put Your Shoulder to the Wheel'');

    ```


    # ## Example 2


    ```

    var x = 3;

    var s = new String(x);

    ```'
