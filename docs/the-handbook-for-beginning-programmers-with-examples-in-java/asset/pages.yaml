  md: "# Variable Scope\n\nThe scope determines how long that variable exists and\
    \ where it can be used. Within a JavaScript program, there are two categories\
    \ of scope: local and global. A local variable is declared inside a function,\
    \ exists for as long as its containing function is executing, and can be used\
    \ within its containing function only. A global variable is declared outside all\
    \ functions, exists for as long as its containing file is loaded in the computer's\
    \ memory, and can be used within all functions in its containing file. Parameters\
    \ are local variables because they are declared within a function, specifically\
    \ within a function's header.\n\n# JavaScript Variable Scope\n\n| | Local | Global\
    \ |\n|---|---||---|\n| Where Declare | Inside a function | Outside all functions\
    \ |\n| Owner | The function where the variable is declared | The JavaScript program,\
    \ or more accurately, the HTML file that contains the script tag where it is declared\
    \ |\n| Lifetime | Only as long as its containing function is executing | As long\
    \ as its containing HTML file is loaded in the memory |\n| Where Usable | Only\
    \ inside the function where it is declared | In all functions in the JavaScript\
    \ program |\n\nBecause local variables are visible only within the function where\
    \ they are declared, you can declare two variables with the same name as long\
    \ as they are declared in different functions. In the example code below there\
    \ are two functions each with a local variable named length and a local variable\
    \ named area. The variables are entirely separate and do not conflict in any way\
    \ the scope of each variables is within the function where it is declared.\n\n\
    # Example 9\n\n```\nfunction squareArea(length) {\n  var area = length * length;\n\
    \  return area;\n}\n\nfunction rectangleArea(width, length) {\n  var area = width\
    \ * length;\n  return area;\n}\n```"
  merge: -1
