  md: "# Chapter 9. Functions\n\nBecause most useful computer programs are very large,\
    \ computer programmers divide their programs into parts. A part of a program is\
    \ called a module. In JavaScript the smallest module that performs actions is\
    \ a function, which is sometimes called a method. Nearly all statements in a JavaScript\
    \ program must be written inside a function.\n\nThe term function comes from mathematics\
    \ and is the name of the concept that one value (the argument of the function)\
    \ completely determines another value (the result of the function). Consider the\
    \ function $f$ with one argument $x$: $f(x) = 2x - 1$. We can substitute any number\
    \ for the argument $x$ which completely determines the result of the function\
    \ $f$. For example, substituting 5 for $x$ produces 9 as the result of the function:\
    \ $f(5) = 2(5) - 1 = 9$. Functions in a computer program work in a similar way,\
    \ taking arguments and producing results.\n\n# Chapter Outcomes\n\nBy the end\
    \ of this chapter you will:\n\n+   * Write functions that accept and use parameters.\n\
    * Write code to return a value from a function to its call point.\n* Write code\
    \ to call a function and pass arguments to that function.\n* Write code to store\
    \ the result returned from a function in a variable.\n* Distinguish between a\
    \ parameter and an argument.\n* Distinguish between displaying output for the\
    \ user to see and returning a value to be used by the program.\n* Understand local\
    \ variable scope.\n\n# Writing a Function\n\nTo write a function in JavaScript,\
    \ simply type code that matches this template.\n\n# Template\n\n```\nfunction\
    \ functionName(param1, param2, ... paramN) {\n  statements;\n  return value;\n\
    }\n```\n\nThe first line of a function is called the header or signature, and\
    \ it includes\n\n+   1. the keyword function\n2. the function name\n3. the parameter\
    \ list"
  merge: -1
  pgno: 132
- img_proc: true
  md: "The function name must start with a letter, the underscore (_), or the dollar\
    \ sign ($). The rest of the name must be made of letters, digits (0–9), the underscore,\
    \ or the dollar sign. A function name cannot include spaces. It should be a meaningful\
    \ name that curtly describes what the function does. The parameter list contains\
    \ data stored in variables that the function needs to complete its task.\n\nThe\
    \ statements inside a function are called the body of the function. A function\
    \ may contain as many statements as you wish to write inside of it. However, it\
    \ is a good idea to limit functions to less than a page (60 lines) long. To return\
    \ a result from a function so that the result can be used somewhere else in your\
    \ program, simply type the keyword followed by whatever value you returned to\
    \ the calling function.\n\n# Example 1\n\nWrite the header for a function named\
    \ drawCircle that takes three parameters: the x and y values for the center of\
    \ the circle and the radius of the circle, all in pixels.\n\n```\nfunction drawCircle(centerX,\
    \ centerY, radius)\n```\n\n# Example 2\n\nWrite the header for a function named\
    \ getDiscountRate which returns the discount rate applied to a student's car insurance\
    \ premium. The function requires two parameters: the student's birthday and GPA.\n\
    \n![](img/ef8ee93db95f659f7e069b8fe140b87b_133_0.png)\n\nWhy does the getDiscountRate\
    \ function require two parameters? In other words, what rule does the insurance\
    \ company have that requires getDiscountRate to have two parameters?\n\n# Example\
    \ 3\n\nWrite a function (header and body) that computes and returns the average\
    \ of three numbers.\n\n```\n// Computes and returns the average of three numbers.\n\
    function average(a, b, c) {\n  var sum = a + b + c;\n  var avg = sum / 3;\n  return\
    \ avg;\n}\n```"
