  md: "# Common Mistakes\n\nWriting an infinite loop\n\n```\nIncorrect\nvar i = 0;\n\
    while (i < 3) {\n    window.alert(\"Hello\");\n}\n```\n\n```\nCorrect\nvar i =\
    \ 0;\nwhile (i < 3) {\n    window.alert(\"Hello\");\n    i++;\n}\n```\n\n```\n\
    // or\nfor (var i = 0; i < 3; i++) {\n    window.alert(\"Hello\");\n}\n```\n\n\
    Writing a loop that never repeats\n\n```\nIncorrect\nfor (var i = 0; i > 3; i++)\
    \ {\n}\n```\n\n```\nCorrect\nfor (var i = 0; i < 3; i++) {\n}\n```\n\n```\n//\
    \ or\nfor (var i = 0; i != 3; i++) {\n}\n```\n\nUsing commas to separate the parts\
    \ of a for\n\n```\nIncorrect\nfor (var i = 0, i < 5, i++) {\n}\n```\n\n```\nCorrect\n\
    for (var i = 0; i < 5; i++) {\n}\n```\n\nForgetting braces when there is more\
    \ than one statement inside a loop\n\n```\nIncorrect\nfor (var i = 0; i < n; i++)\
    \ {\n    interest = balance * rate;\n    balance += interest;\n}\n```\n\n```\n\
    Correct\nfor (var i = 0; i < n; i++) {\n    interest = balance * rate;\n    balance\
    \ += interest;\n}\n```"
