  md: '# Assignment Operators


    In addition to the arithmetic operators described above, JavaScript also has assignment
    operators that perform arithmetic. These operators are really shortcuts for performing
    arithmetic using the current value of a variable and storing the result of the
    arithmetic back into that variable.


    # JavaScript Assignment Operators


    | Operator | Name | Example | Equivalent Expression |

    | --- | --- | --- | --- |

    | *= | multiplication assignment | x *= 5; | x = x * 5; |

    | /= | division assignment | s /= t; | s = s / t; |

    | %= | modulus assignment | w %= z; | w = w % z; |

    | += | addition assignment | x += y; | x = x + y; |

    | -= | subtraction assignment | r -= t; | r = r - t; |


    For example, x += 2 is equivalent to x = x + 2. In other words the += operator
    is a combination of addition and assignment and is shortcut for writing a command
    with both. Here are some interesting uses of the assignment operators and some
    equivalent statements. Understanding these examples will help you better understand
    the assignment operators.


    # Example 11


    # Equivalent Example


    ```

    x += x;

    // 1. retrieve the value in x

    // 2. add the value in x to it

    // 3. store the sum back in x

    ```


    ```

    x *= 2;

    // 1. retrieve the value in x

    // 2. multiply that value by 2

    // 3. store the sum back in x

    ```


    # Example 12


    # Equivalent Example


    ```

    x -= x;

    // 1. retrieve the value in x

    // 2. subtract the value in x from it

    // 3. store the difference back in x

    ```


    ```

    x = 0;

    // 1. store the 0 in x

    ```


    # Example 13


    # Equivalent Example


    ```

    x *= -1;

    // 1. retrieve the value in x

    // 2. multiply that value by -1

    // 3. store the product back in x

    ```


    ```

    x = -x;

    // 1. change the sign of x

    ```'
