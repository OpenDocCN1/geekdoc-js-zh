  md: '# Example 6


    Given any two conditions $a$ and $b$, show the result of (a Or b) And Not a a

    To solve this problem:


    +   1. We draw a truth table with a row for the headings and four rows for boolean
    values.

    2. In columns $1$ and $2$ we write the headings $a$ and $b$ and all possible combinations
    of true and false.

    3. In columns $3$, $4$, and $5$ we translate the logical expression: $(a \| b)$
    \&& $!a$ into JavaScript operators:

    4. We write the result of $(a \| b)$ in column $3$. We write column $3$ before
    columns $4$ and $5$ because $a \| b$ is inside parentheses.

    5. We write the result of $a$ in column $4$. We write column $4$ before column
    $5$ because Not is not a unary operator and has a higher precedence than And.

    6. Finally, in column $5$ we combine the results of columns $3$ and $4$ using
    \&&. Column $5$ is the result of (a Or b) And Not a.


    | a | b | (a \| b) | \&& | !a |

    |---|---|---|---|---|

    | False | False | False | False | True |

    | False | True | True | True | False |

    | True | False | True | False | False |

    | True | True | True | False | False |'
