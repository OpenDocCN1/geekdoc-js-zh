  md: '# Advanced Word Search


    The logical operators &&, || and ! can be used when searching for documents on
    your computer or on the internet. At google and other search engines, this is
    often known as advanced search and can be very powerful. Learning to use advanced
    search will make you more efficient when searching for information and will help
    you better understand boolean logic.


    # Example 3


    Imagine you are trying to find the web page for every Madison County in the United
    States except Idaho. To find these web pages, you might think of a boolean logic
    query such as


    ```

    madison && (county || parish) && !idaho

    ```


    meaning look for all documents that include "Madison" and either "County" or "Parish"
    (because Louisiana has parishes and not counties) but exclude "Idaho". Using the
    advanced search form at google, we enter madison, county, parish, and idaho in
    the correct text boxes as shown in Figure 25. Notice in the top most text box
    of Figure 25 that the google advanced search form wrote the search query as I
    entered the words in the other text boxes. From this we learn that the google
    advanced query that corresponds to our boolean logic query is


    ```

    madison county OR parish -idaho

    ```


    The google advanced query doesn''t require the (&&) operator or parentheses. If
    there is no operator between two words, the google search engine assumes the user
    meant And. Also, the Or operator has a higher precedence than And, so the parentheses
    are unnecessary in our particular search.'
  merge: -1
