  md: "# switch\n\nUse when:\n\n+   - More than two choices exist\n- Each choice is\
    \ based on the same variable and uses equals (==)\n- Comparison values are integer\
    \ or string\n\nTemplate\n\n```\nswitch (variable) {\n  case constValue1: statements;\
    \ break;\n  case constValue2: statements; break;\n  default: statements; break;\n\
    }\n```\n\nA switch statement functions like a group of connected if else if else\
    \ statements that all test one variable for equality. When the computer executes\
    \ a switch statement, it compares the value of the variable with each case at\
    \ a time. The computer skips statements for the cases that do not equal the value\
    \ of the variable and continues executing statements after the first case that\
    \ equals the value of the variable until the switch ends whenever it encounters\
    \ a break statement or the switch ends. If none of the cases equals the value\
    \ of the variable, the computer skips the statements in all cases and executes\
    \ the statements in the default case until it encounters a break or the switch\
    \ ends. The default case is optional.\n\nExample 4\n\n```\nvar registerDate;\n\
    witch (classStanding) {\n  case 'F':\n    registerDate = \"Nov 23\";\n    break;\n\
    \  case 'S':\n    registerDate = \"Nov 17\";\n    break;\n  case 'J':\n    registerDate\
    \ = \"Nov 12\";\n    break;\n  case 'N':\n    registerDate = \"Nov 6\";\n    break;\n\
    \  default:\n    registerDate = \"none\";\n    window.alert(\"unknown class standing\"\
    );\n    break;\n}\ndocument.getElementById('outputDiv').innerHTML = registerDate;\n\
    ```\n\n| Desk Check | registerDate |\n| --- | --- |\n| 'F' | \"Nov 23\" |\n| Desk\
    \ Check | registerDate |\n| 'J' | \"Nov 12\" |\n| Desk Check | registerDate |\n\
    | 'Q' | \"none\" |"
  merge: -1
