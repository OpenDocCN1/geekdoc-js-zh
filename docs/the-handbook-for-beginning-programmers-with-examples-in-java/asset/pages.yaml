  md: "# Odd Integers\n\nBecause the result of the modulus operator is signed, when\
    \ determining if an integer is even or the result of the modulus operator must\
    \ always be compared to zero. Comparing the result to one will *not* work for\
    \ negative, odd integers. Consider this JavaScript code and two corresponding\
    \ desk checks.\n\n# Example 6\n\n```\n// Wrong! Doesn't work for negative odd\
    \ integers!\nif ((number % 2) == 1) {\n  document.getElementById('outputDiv').innerHTML\
    \ = number + ' is odd';\n} else {\n  document.getElementById('outputDiv').innerHTML\
    \ = number + ' is even';\n}\n```\n\n| Desk Check number % 2 | output | Desk Check\
    \ number % 2 | output |\n|---|---|---|--|\n| 5 | \"5 is odd\" | -1 | \"- 9 is\
    \ even\" |\n\nNote that comparing (value % 2) == 1 works fine for positive integers\
    \ whether they are even or odd. However, as shown in the desk check above, it\
    \ does *not* work for negative, odd integers. If you need to write code that takes\
    \ action only if an integer is odd, the correct way to write the comparison is\
    \ with the not equal relational operator (!=).\n\n# Example 7\n\n```\n// Correct\
    \ check for odd integers\nif ((value % 2) != 0) {\n  document.getElementById('outputDiv').innerHTML\
    \ = value + ' is odd';\n}\n```\n\nSometimes a programmer will use the bitwise\
    \ & operator to test if an integer is even as shown below. Such code works but\
    \ is a bad solution for at least two reasons.\n\n+   * It is not as straightforward\
    \ as using the modulus operator.\n* It depends on the computer using two’s complement,\
    \ binary representation for integers. (Admittedly, computers will continue to\
    \ represent integers using two’s  complement for the foreseeable future.)"
  merge: -1
