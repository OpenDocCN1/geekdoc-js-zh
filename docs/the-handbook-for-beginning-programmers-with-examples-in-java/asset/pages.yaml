  md: '# Fixing a Program that Doesn’t Work


    After you have finished writing a JavaScript program, if it isn’t working, do
    the following to find and fix the problems.


    +   1. Make sure you saved your HTML file with the suffix .html

    2. Validate your HTML file by uploading it to the online validator validator.w3.org

    3. Load your HTML document in a web browser and check the JavaScript console for
    errors. You can view the console in Google Chrome by pressing Shift-Ctrl-J (Windows
    and Linux) or Command-Option-J (Mac).

    4. Click the button in your HTML document to execute your code and check the JavaScript
    console again for errors.

    5. Use the JavaScript debugger that is built into your web browser to step through
    your code line by line and watch the values of the variables.


    # Common Mistakes


    Misspelling onclick


    Incorrect

    <button type="button" onclick="funcName()"

    Correct

    <button type="button" onclick="funcName()">


    Leaving the onclick attribute of a button empty


    Incorrect

    <button type="button" onclick=""

    Correct

    <button type="button" onclick="funcName()">


    Forgetting the parentheses after the function name in the onclick attribute


    Incorrect

    <button type="button" onclick="funcName"

    Correct

    <button type="button" onclick="funcName()">'
