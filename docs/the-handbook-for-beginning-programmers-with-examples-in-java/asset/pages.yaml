  md: "# Example 9\n\n```\nvar skip = 2;\nvar n = 5;\nfor (var i = 0; i < n; i +=\
    \ skip) {\n  window.alert(\"aphid\\n}\n```\n\n| Desk Check |\n|---|---|---|\n\
    | i | skip | n |\n\n# Infinite Loop\n\nWhat does the computer do if a programmer\
    \ forgets to write the update part of a loop?\nFor example:\n\n```\nvar i = 0;\n\
    while (i < 5) {\n  window.alert('Hello');\n}\n```\n\nOr this example:\n\n```\n\
    for (var i = 0; i < 5; ) {\n  window.alert('Hello');\n}\n```\n\nNotice in both\
    \ examples that after the value of the counting variable $i$ is initialized to\
    \ zero (0), its value is never changed. This means that $i$ will start at the\
    \ value zero, and each time the computer evaluates the continuation condition\
    \ ($i < 5$), $i$ will be less than 5. In other cases, the continuation condition\
    \ will always evaluate to true and the computer will keep repeating the statements\
    \ inside the loop forever or the user kills the program. This is called an **infinite\
    \ loop** and is usually, although not always, a mistake. Of course the way to\
    \ fix both of the above infinite loop examples is to add code to change the value\
    \ of $i$ within the body of the loops, for example:\n\n```\nvar i = 0;\nwhile\
    \ (i < 5) {\n  window.alert('Hello');\n  i++;\n}\n```\n\n```\nfor (var i = 0;\
    \ i < 5; i += 2) {\n  window.alert('Hello');\n}\n```\n\n8. Repetition"
