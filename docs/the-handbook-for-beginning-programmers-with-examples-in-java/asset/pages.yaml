  md: '# Truth Tables


    Truth tables can help us write simpler boolean expressions and allow us to prove
    certain propositions about boolean expressions. We create a truth table by considering
    two or more conditions. These can be any conditions, for example “if (gpa > 3.5)”
    or “if (balance > 100)”. We label these conditions $a, b, c,$ etc.. Then in the
    columns beneath the named conditions ($a, b, c,$ etc.), we write all possible
    combinations of the values of these conditions. For example, if a boolean expression
    includes two conditions, $a$ and $b$, then


    +   1. both the conditions may be false;

    2. $a$ may be false and $b$ true;

    3. $b$ may be false and $a$ true; or

    4. both may be true.


    These four combinations are shown in the truth tables below. After writing all
    possible combinations of true and false in the left columns of the table, we write
    the logic that we want to evaluate as the heading in the right side of the table.
    Then we evaluate that logic using the true and false values given in the left
    columns.


    # Example 5


    Given any two conditions $a$ and $b$, show Not $a$, Not $b$, a $And$ $b$, a $Or$
    $b$, a $Xor$ $b$


    | a | b | !a | !b | a &&b | a ||b | a ^ b |

    |---|---|---|---|---|---||

    | False | False | True | True | False | False | False |

    | False | True | True | False | False | True | True |

    | True | False | False | True | False | True | True |

    | True | True | False | False | True | True | False |'
