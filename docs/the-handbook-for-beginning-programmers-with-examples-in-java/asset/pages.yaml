  md: '# Creating an Array


    Declaring an array in JavaScript does not cause the computer to reserve space
    for the elements of the array. To do this, a programmer must also create the array.
    All objects, including arrays, are created in JavaScript using the keyword new.


    # Template


    ```

    arrayName = new Array(size);

    ```


    # Example 2


    ```

    data = new Array(6);

    scores = new Array(25);

    ```


    In the previous example, the first line causes the computer to reserve space for
    an array that holds 6 values with indexes numbered from 0 to 5 inclusive. The
    second line causes the computer to reserve space for an array named scores that
    holds 25 values numbered from 0 to 24 inclusive.


    It is possible to combine the array declaration and creation into a single statement.


    # Example 3


    ```

    var data = new Array(6);

    var scores = new Array(25);

    ```


    # Example 4


    Declare and create an array named altitudes that has 50 elements in it.


    ![](img/ef8ee93db95f659f7e069b8fe140b87b_155_0.png)


    It is also possible to declare, create, and initialize the elements in an array
    in a single JavaScript statement.


    # Template


    ```

    var arrayName = [ value0, value1, ... valueN ];

    ```


    # Example 5


    ```

    var measures = [ 4.7, -3, 2.1, 0, 7.2 ];

    ```'
