  md: "# Compound Interest\n\nMany bank accounts and other investments pay compound\
    \ interest on the money that is saved in the account. This means each time the\
    \ bank pays interest, the interest is added to the original money, which is called\
    \ the principal. The next time the bank pays interest, it pays interest on the\
    \ principal and the previous interest. The balance of such an account and its\
    \ compound interest can easily be computed using a loop.\n\n# Example 10\n\n```\n\
    <!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Compound\
    \ Interest</title>\n<script type=\"text/javascript\">\n/* Input:\n* An amount\
    \ to invest: balance\n* The annual rate of growth: annualRate\n* The number of\
    \ months to invest: numMonths\n* Processing: Use a loop to compute the balance\
    \ of an account after\n* a bank has paid interest for numMonths of months.\n*\
    \ Output: The balance after numMonths have passed.\n*/\nfunction calculate() {\n\
    \  var balance = parseFloat(document.getElementById('balance').value);\n  var\
    \ annualRate = parseFloat(document.getElementById('annualRate').value);\n  var\
    \ numMonths = parseInt(document.getElementById('months').value);\n  var monthlyRate\
    \ = annualRate / 12;\n\n  // For each month, compute the interest and add it to\
    \ the balance.\n  for (var month = 1; month <= numMonths; month++) {\n    // Compute\
    \ the interest for a month.\n    var interest = balance * monthlyRate;\n\n   \
    \ // Round the interest to pennies.\n    interest = Math.round(interest * 100)\
    \ / 100;\n\n    // Add the interest to the balance.\n    balance += interest;\n\
    \  }\n  document.getElementById('output').innerHTML = \"Your balance after \"\
    \ + numMonths + \" months will be $\" + balance;\n}\n</script>\n</head>\n</html>\n\
    ```"
