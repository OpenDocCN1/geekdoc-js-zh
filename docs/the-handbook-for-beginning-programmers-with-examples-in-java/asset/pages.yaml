    \ arithmetic\n  - compare values\n  - repeat operations\n  - call a function\n\
    - All high level tasks that a computer can do, such as edit photographs, play\
    \ music, and search data for the basic operations.\n- A computer program contains\
    \ both data and instructions. In JavaScript, the instructions are called statements.\n\
    - The three basic control structures that a programmer uses to control the order\
