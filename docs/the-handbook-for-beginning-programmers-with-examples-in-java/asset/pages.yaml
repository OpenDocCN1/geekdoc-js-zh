  md: "# Surface Area of a Pyramid\n\nImagine designing one of the great pyramids.\
    \ The stones on the inside of the pyramids are very rough and are basically just\
    \ filler. The stones on the outside are finished smooth to reflect sunlight. If\
    \ you were writing the software to design a pyramid, your software would have\
    \ to compute the surface area of a pyramid so the builders would know how much\
    \ finished stone they need to cover the outside of the pyramid.\n\nFigure 32 shows\
    \ a regular pyramid (all four sides are the same size) with edge length $e$, height\
    \ $h_l$, and base length $b$. Since it is a regular pyramid, to compute the surface\
    \ area multiply that by 4. If the builder of a regular pyramid’s the triangular\
    \ faces and specified the base length and the height, then your software could\
    \ use this formula for computing the edge length from the base length and height:\n\
