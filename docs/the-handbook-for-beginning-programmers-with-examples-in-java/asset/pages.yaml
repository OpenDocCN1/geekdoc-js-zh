  md: "# Character Data\n\nEverything in a computer's memory is stored as a number\
    \ or set of numbers. Pictures, songs, text, instructions, everything. Each text\
    \ symbol is stored in the computer's memory as a number.\n\n+   36. ASCII – an\
    \ acronym for American Standard Code for Information Interchange; a coding system\
    \ (essentially a table) with 128 rows that assigns a number to each English letter\
    \ and common punctuation symbol. See asitabable.com\n\n+   37. Unicode – a very\
    \ large coding system that includes ASCII and assigns a number to symbols from\
    \ many languages, such as English, Portuguese, Greek, Hebrew, Arabic, and Tagalog.\
    \ See unicode.org\n\n# Execution Example\n\nTo help you understand how the parts\
    \ of a computer work together, consider what happens when a user double clicks\
    \ on a Microsoft Word document file (a file with a filename suffix of .docx).\n\
    \n+   1. The operating system commands the hard drive to copy the Microsoft Word\
    \ Application (MS Word) into main memory.\n2. The hard drive copies MS Word over\
    \ a bus into main memory.\n3. After MS Word is in main memory, the operating system\
    \ executes MS Word and sends a command to MS Word telling it to open the document\
    \ that the user clicked on.\n4. MS Word requests the operating system to read\
    \ the document from the hard drive and place it in main memory.\n5. The operating\
    \ system commands the hard drive to copy the document file into main memory.\n\
    6. The hard drive copies the document file over a bus into main memory.\n7. For\
    \ each character that is in the document\n   a. MS Word reads the character's\
    \ Unicode number from main memory and requests the operating system to draw that\
    \ character in a window.\n   b. The operating system, finds the Unicode number\
    \ and its corresponding symbol in a table and draws the symbol."
  merge: -1
