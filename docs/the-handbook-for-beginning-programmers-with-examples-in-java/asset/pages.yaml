  md: '# Appendix B. Robust Code


    There is an old computer programming joke that goes like this. A consultant went
    to a large company to teach the software engineers in the company. At the beginning
    of the class she said to the students, "If you go on an airplane and realized
    that your team had written the software that runs the airplane, how many of you
    would be afraid for your life and get off the plane?" Every student except one
    put his hand up. The consultant looked at the one student who didn''t raise his
    hand and asked, "What does your team do differently so that you wouldn''t be afraid
    to ride on the airplane?"


    The student answered, "Ha! If my team had written the software, the plane would
    never get off the ground. I would be perfectly safe."


    Below are some programming practices that if you follow will make your software
    robust (fewer errors) and help you rest easy on a working airplane for which you
    and your team wrote the software.


    +   - Turn on compiler warnings and never ignore them.

    - Follow generally accepted coding standards and conventions, including naming
    conventions.

    - Write and use assertions. Test primarily with assertions turned on.

    - Write and execute unit tests and don''t ignore test failures.

    - Whenever possible, write simple, straight forward code. For example when writing
    in JavaScript, Java, C++, and C do not use the left shift operator (<<) to multiply
    by a power of two. Instead use multiplication (*) and rely on the compiler to
    generate fast code.

    - Write each function to perform one and only task.

    - Minimize the number of execution paths through your code. (See the section Finding
    a Range in chapter 10 of this book for an example of how to do this.)

    - Write each function with only one exit point (return statement).

    - Consider writing a tricky algorithm twice, once with a straight forward, once
    with a sophisticated, fast solution. In the debugging version of your program
    use the slow solution to verify the results of the fast solution.

    - When writing in a language that has exceptions, never return error codes from
    a function. Instead throw exceptions to indicate an error.'
