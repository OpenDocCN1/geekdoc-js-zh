  md: "# Reversing a String\n\nOccasionally you will want to reverse the order of\
    \ the characters in a string. This is easily done with a loop and string concatenation.\n\
    \n# Example 10\n\n```\n// Reverses the contents of a string.\nfunction reverse(s)\
    \ {\n  var rev = '';\n  for (var i = s.length - 1; i >= 0; i--) {\n    rev +=\
    \ s.charAt(i);\n  }\n  return rev;\n}\n```\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_191_0.png)\n\
