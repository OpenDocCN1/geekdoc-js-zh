  md: '# String Methods


    JavaScript includes several useful string methods that you can use to manipulate
    the contents of strings.


    | Method | Description |

    | --- | --- |

    | s.charAt(index) | Returns the character at the given index. |

    | s.charCodeAt(index) | Returns a number indicating the Unicode value of the character
    at the given index. |

    | s.concat(s2, s3, ..., sN) | Combines the text of two or more strings and returns
    a new string. |

    | s.contains(toFind, start) | Returns true if the s contains the characters of
    the string toFind. |

    | s.endsWith(toFind) | Returns true if the s ends with the characters of the string
    toFind. |

    | s.indexOf(toFind, start) | Returns the index within the string s of the first
    occurrence of the toFind, or -1 if not found. |

    | s.lastIndexOf(toFind, start) | Returns the index within the string s of the
    last occurrence of the toFind, or -1 if not found. |

    | s.replace(toFind, replacement) | Used to find a match between a regular expression
    and a string, and to replace the matched substring with a new substring. |

    | s.split([sep], limit) | Splits a string into an array of strings by separating
    the string into substrings. |

    | s.startsWith(toFind, start) | Returns true if the s starts with the characters
    of the string toFind. |

    | s.substr(start, length) | Returns the characters of a string starting at the
    specified index and continuing for the specified number of characters. |

    | s.substring(start, end) | Returns the characters of a string between two indexes
    into the string. |

    | s.toLowerCase() | Returns a copy of the string s with all characters converted
    to lower case. |

    | s.toUpperCase() | Returns a copy of the string s with all characters converted
    to upper case. |

    | s.trim() | Trims whitespace from the beginning and end of the string. |'
