  md: '# Chapter 4. JavaScript Basics


    JavaScript was originally developed by Brendan Eich at Netscape under the name
    Mocha, later renamed LiveScript, and finally renamed JavaScript. JavaScript is
    most often used in web pages on the client side (web browser). Despite its name,
    JavaScript has very little in common with the Java programming language. The little
    that they have in common includes the syntax of the C programming language and
    some naming conventions and names, such as Date, Math, and String. You can find
    a good online tutorial for JavaScript w3schools.com and a good online reference
    for JavaScript at developer.mozilla.org


    # Chapter Outcomes


    By the end of this chapter you will be able to:


    +   - Read and write simple JavaScript programs embedded inside HTML documents.

    - Write a JavaScript program that the computer runs when a user clicks a button.

    - Write a JavaScript program that gets input from a popup window and sends output
    to a popup window.

    - Write a JavaScript program that gets input from a text field and sends output
    to an HTML div.


