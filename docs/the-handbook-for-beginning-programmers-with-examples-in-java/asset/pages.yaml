  md: '# Example 7


    Given any two conditions $a$ and $b$, prove that Not (a Or b) $\Leftrightarrow$
    Not a And Not b

    To solve this problem:


    +   1. We draw a truth table with a row for the headings and four rows for boolean
    values.

    2. In columns 1 and 2 we write the headings $a$ and $b$ and all possible combinations
    of true and false.

    3. In columns 3 and 4 we translate the logical expression: Not (a Or b) into JavaScript
    operators: `!(a || b)`.

    4. In columns 5, 6, and 7 we translate the logical expression: Not a And Not b
    into JavaScript operators: `!a && !b`.

    5. We write the result of $(a || b)$ in column 3. We write column 3 before column
    4 because $a$ is inside parentheses.

    6. We write the result of `!(a || b)` in column 4 which finishes all the logic
    on the left side of the equivalence arrow ($\Leftrightarrow$).

    7. We write the result of !a in column 5.

    8. We write the result of !b in column 6.

    9. In column 7 we combine columns 5 and 6 using `&&` which finishes all the logic
    on the left side of the equivalence arrow ($\Leftrightarrow$).

    10. Finally, we compare proven that Not (a Or b) $\Leftrightarrow$ Not a And Not
    b. In other words, we have computed Not (a Or b) for all possible combinations
    of true and false, and we computed Not a And Not b for all possible combinations
    of true and false, and we found in all cases that the results were the same. Because
    Not (a Or b) always gives the same result as Not a And Not b, the two logical
    expressions are equivalent.


    | a | b | 3 | 4 | (a || b) | $\Leftrightarrow$ | 5 | 7 | 6 |

    |---|---|---|---|---|---|---|---||

    | False | False | True | False | | True | True | True |

    | False | True | False | True | | True | False | False |

    | True | False | False | True | | False | False | True |

    | True | True | False | True | | False | False | False |'
