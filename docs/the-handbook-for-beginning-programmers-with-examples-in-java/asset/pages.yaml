  md: '# String Concatenation


    To create a large string of text from smaller strings of text you can use the
    string concatenation operator which is the plus symbol (+). For example:


    # Example 3


    ```

    var name = "Samantha";

    var message = "Hello, " + name + ". How are you today?";

    ```


    # Escape Sequences


    Occasionally you will want to include single or double quotes or other special
    characters in a string literal. You can also include a special character by placing
    a backslash character (\ immediately before it. Within a string literal a backslash
    followed by one or more characters is called an escape sequence. You can also
    write escape sequences to include characters (see unicode.org chars) in a string
    literal that you would not be able to type from your keyboard. This includes mathematical
    symbols and characters from languages other than English.


    # JavaScript Escape Sequences


    | Sequence | Description |

    |---|---|

    | \b | Backspace |

    | \f | Form feed |

    | \n | New line |

    | \r | Carriage return |

    | \t | Horizontal tab |

    | \v | Vertical tab |

    | \u0 | Null character |

    | \'' | Single quote |

    | \" | Double quote |

    | \\ | Backslash |

    | \uxxxx | The Unicode character specified by the four hexadecimal digits dddd.
    For example the copyright symbol (*) is \u00a9. |


    # Example 4


    ```

    var quote = "Mr. Churchill declared, \Never give in!";

    var greek = "The first three letters of the Greek alphabet are \u03b1 \u03b2";

    ```'
