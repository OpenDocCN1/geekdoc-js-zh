  md: "# Filling an Array with a Ramp\n\nWithin programs that perform image processing,\
    \ we often use an array as a palette or look up table. To get the color value\
    \ of a pixel, the computer reads the value of the pixel stored in the image and\
    \ then looks up that value in the palette. Then the computer displays the color\
    \ from the palette at the corresponding pixel location on the monitor. Often the\
    \ palette must be initialized to contain values that are constantly increasing,\
    \ for example: 0, 1, 2, 3... This is known as a ramp because if you plotted the\
    \ values in the array, you would see a sloping line or ramp constantly increasing\
    \ to the right as shown in Figure 36.\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_158_0.png)\n\
    \nHere is a code example showing how to initialize an array to an increasing array.\n\
    \n# Example 11\n\nDesk Check\n\n```\n// Fills the specified array with constantly\
    \ increasing values\n// values from 0 to list.length - 1, inclusive.\nfunction\
    \ ramp(list) {\n  for (var i = 0; i < list.length; i++) {\n    list[i] = i;\n\
    \  }\n}\n```\n\n| | list | i |\n|---|---||\n| [0] | [1] | [2] | [3] | [4] |"
  merge: -1
