  md: "# How Long to Invest\n\nA common question when saving and investing money is\
    \ “How long will I need to invest a certain amount of money in order for money\
    \ to grow to a certain larger amount of money?” For example, how many months will\
    \ I need to invest $100 at 6% fixed annual growth rate compounded monthly in order\
    \ for my investment to grow to $103?\n\nExample 15 HTML>\n\n```\n<!DOCTYPE>\n\
    <html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>How Long to Invest</title>\n\
    <script type=\"text/javascript\">\n/* Input: No user input\n * Processing: Determine\
    \ the number of months required to grow an initial\n * investment of $100 to at\
    \ least $103 if it grows at an annual rate of 6%.\n * Output: The number of months.\
    \ */\nfunction testInvest() {\n  var m = determineMonths(100, 0.06, 103);\n  document.getElementById('outputDiv').innerHTML\
    \ = m;\n\n  // Computes and returns the number of months needed for principal\n\
    \  // at a constant annual rate to grow to a target amount.\n  function determineMonths(principal,\
    \ annualRate, target) {\n  var monthlyRate = annualRate / 12;\n  var balance =\
    \ principal;\n  var month = 0;\n\n  // Repeat while the balance of the investment\
    \ is less than the target.\n  while (balance < target) {\n  var interest = Math.round(balance\
    \ * monthlyRate * 100) / 100;\n  balance += interest;\n  month++;\n  }\n  return\
    \ month;\n}\n</script>\n</head>\n```\n\n| principal | annualRate | interest |\
    \ balance | month |\n|---|---|---|---||\n| | | | | |\n| | | | | |\n| | | | | |\n\
