  md: '# Operator Precedence Revisited


    The following table shows the precedence for all the JavaScript arithmetic operators
    shown in this chapter.


    # JavaScript Arithmetic Operator Precedence


    | Operator(s) | Name(s) | Precedence |

    |---|---|---|

    | ( ) | parentheses | Highest (evaluated first) |

    | ++ -- | negation, increment, decrement | |

    | * / % | multiplication, division, modulus | |

    | + | addition, subtraction | |

    | = += -= *= /= /= %== | assignment operators | Lowest (evaluated last) |


    Remember that the pre-increment is always executed before the rest of the arithmetic
    in the same statement, and the post-increment, even though it has a higher precedence,
    is always executed after the rest of the arithmetic in the same statement.'
