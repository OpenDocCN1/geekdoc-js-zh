  md: "# Repetitive Strings\n\nOccasional we need the computer to produce a string\
    \ that has a repeating pattern. We can use a loop to cause the computer to build\
    \ such strings. Consider the string \"0, 2, 4, 6, 8, 10\" with the simple pattern\
    \ of counting by twos. Here is code that builds this string and displays it to\
    \ the user.\n\n# Example 14\n\n```\nvar output = '0';\nvar i = 2;\nwhile (i <=\
    \ 10) {\n  output += ', ' + i;\n  i += 2;\n}\ndocument.getElementById('displayDiv').innerHTML\
    \ = output;\n```\n\nNotice in the above code that the line\n\noutput += ', ' +\
    \ i; performs concatenation and not addition. This is because the starting value\
    \ for the variable output is a string ('0') and because the comma and space (',\
    \ ' ') is also a string. The += operator for string concatenation will append\
    \ new text onto the string each time through the loop so that the value in output\
    \ will grow from '0' to '0, 2' to '0, 2, 4' etc.\n\nDesk Check\n\n| | output |\n\
    |---|---|\n| | |\n| | |\n| | |\n| | |\n| | |"
