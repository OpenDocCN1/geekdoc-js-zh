  md: "# Control Structures\n\nThere are five different categories of **control structures**\
    \ that you can use to control the order in which a computer executes the statements\
    \ in your program. They are called control structures because they control the\
    \ *order in which* the computer executes statements also called the *flow of execution*\n\
    \n+   - **sequence** causes the computer to execute statements in the order they\
    \ are written in a program, from top to bottom. This is the default control structure.\n\
    \n+   - **selection** causes the computer to select one group of statements to\
    \ execute and another group or groups to skip. This is how a computer appears\
    \ to make decisions.\n\n+   - **repetition** causes the computer to repeat a group\
    \ of statements.\n\n+   - **function call** and **return** – causes the computer\
    \ to execute the statements in another function and return a result from the other\
    \ to the call point.\n- **try, catch**, and **throw** – are used to identify an\
    \ error occurred and handle errors.\n\nYou will study, learn, and use the first\
    \ four of these control structures in later chapters of this book. Sequence is\
    \ the default control structure and is covered in all following chapters. Selection\
    \ is taught in chapters 6 and 7. Repetition is taught in chapter 8 and again in\
    \ chapter 10, and function call is taught in chapter 9.\n\n# Chapter Summary\n\
    \n+   - An algorithm is simply a list of steps to accomplish a task.\n- Sometimes\
    \ the order in which the steps are performed is very important.\n- A defining\
    \ table is a simple tool to help a programmer understand a problem before developing\
    \ an algorithm to solve the problem. A defining table has three sections: input,\
