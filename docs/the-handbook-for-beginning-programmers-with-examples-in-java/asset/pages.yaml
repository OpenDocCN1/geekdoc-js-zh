  md: "# Example 9\n\nWrite a statement to store the number 72.6 in an array named\
    \ ranges at location 3.\n\n# Filling an Array\n\nIt is often desirable to have\
    \ the computer initialize all the elements in an array to some value (usually\
    \ zero). We do this by writing a statement that assigns a value to one element\
    \ in the array, and then put that assignment statement inside a loop. If the array\
    \ has n elements in it, then the loop causes the computer to repeat the assignment\
    \ n times, once for each element in the array.\n\nExample 10 contains a function\
    \ that fills an array with some value x. Of course, in order for the code in the\
    \ function to be executed, a programmer must write code to call the function similar\
    \ to this code:\n\n```\nvar list = new Array(80);\nfill(list, 7);\n```\n\nwhich\
    \ creates an array with 80 elements and calls the fill function to store the number\
    \ 7 in each element of the array.\n\n# Example 10\n\n```\n// Fills the specified\
    \ array with the value x.\nfunction fill(list, x) {\n  // For each index in the\
    \ array named list\n  for (var i = 0; i < list.length; i++) {\n    // store the\
    \ value in x in the array\n    list[i] = x;\n  }\n```\n\n| Desk Check list | |\
    \ | | x i |\n|---|---|---|---|---||\n| [0] | [1] | [2] | [3] | 8.3 |"
