  md: '# Multiplicities


    Multiplicities are small numbers and punctuation at one or both ends of a relationship
    that constrain the relationship. A single number multiplicity constrains a relationship
    to exactly that number of objects. Two or more numbers separated by commas constrain
    a relationship to exactly one of those numbers Two numbers separated by two periods
    (.) constrain a relationship to a range of objects. For example, multiplicities
    may be used to show that one egg carton has either 12 or 18 eggs inside it as
    shown in Figure 39.


    | Carton | Egg |

    |---|---|

    | | 1 | 12,18 |


    **Figure 39:** A UML class diagram showing two classes with multiplicities.


    | Multiplicity | Meaning |

    |---|---|

    | 1 | Exactly one |

    | 4,8 | Exactly four or exactly eight |

    | 0,1 | Zero or one, also known as optional |

    | 0..1 | Zero or one, also known as optional |

    | 12..18 | Between 12 and 18 inclusive |

    | 0.* | Zero or more |

    | * | Zero or more |

    | 1.* | One or more, also known as at least one |

    | 3..* | Three or more, also known as at least three |'
