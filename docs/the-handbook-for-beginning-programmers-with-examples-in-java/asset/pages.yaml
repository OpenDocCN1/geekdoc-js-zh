    # ## Volume of a Cylinder


    If we know the radius and length of a cylinder, we can compute the volume of that
    cylinder using the formula: $v = \pi r^2 h$ where $v$ is the volume, $r$ is the
    radius, and $h$ is the length of the cylinder. This formula can be written in
    Java, JavaScript as shown in the next example. Notice the use of the built-in
    JavaScript constant Math.PI.


    ![](img/ef8ee93db95f659f7e069b8fe140b87b_68_0.png)


    # ## Example 23


    ```

    var v = Math.PI * r * r * h;

    ```


    # ## Distance between Two Points


    We can compute the distance between two points $p_1$ and $p_2$ in two-dimensional
    Cartesian space with the formula:


    $d = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$


    where $d$ is the distance between the points, point $p_1$ has the coordinates
    $(x_1, y_1)$, and point $p_2$ has the coordinates $(x_2, y_2)$.


    ![](img/ef8ee93db95f659f7e069b8fe140b87b_68_1.png)


    Example 24 contains a program that reads the $x$ and $y$ values for two points
    from a user and computes the output distance between those two points. Notice
    the code at lines 14–17 combines into a single line the code to read text from
    a text and convert that text into a number.'
