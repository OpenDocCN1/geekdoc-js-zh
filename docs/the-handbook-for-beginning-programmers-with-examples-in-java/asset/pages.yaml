  md: '# # Chapter 3. HTML Basics


    Hyper-text markup language (HTML) is a computer language that is used to write
    documents for the world wide web of information on the internet. There are several
    different versions of the HTML standard, with the most recent being XHTML 1.1
    and HTML 5. This chapter will help you learn enough HTML 5 so that you can begin
    writing JavaScript code in your HTML documents.


    # ## Chapter Outcomes


    By the end of this chapter you will be able to:


    +   - Read and write simple HTML 5 documents.

    - Use the online W3C Markup Validation Service to validate that an HTML 5 document
    is well-formed.

    - Fix an HTML 5 document that does not validate.

    - Use comments to add internal explanations to an HTML document.


    # ## Starting with HTML


    To start writing HTML documents you must have a decent text editor, such as notepad++
    (notepad-plus-plus.org/download), TextWrangler (www.barebones.com/products/textwrangler),
    or Sublime Text (www.sublimetext.com) and a web browser, such as Google Chrome
    (google.com/chrome/browser), installed on your computer. When you use your text
    editor to write an HTML document and then save the document, you must save the
    document with a suffix .html


    # ## Document Type Declaration


    All HTML 5 documents must begin with a document type declaration like this: `<DOCTYPE
    HTML>`. It doesn''t matter whether you write this declaration in upper or lower
    case or a mix of the two. This declaration tells the computer what follows is
    an HTML 5 document. If you forget to put it at the top of an HTML document, your
    browser may recognize the document as an older version of HTML, and the document
    may be drawn incorrectly by your browser.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Comments


    A comment in an HTML document is a note or documentation that a web designer writes
    for himself or other designers that will look at the HTML code. Comments are ignored
    by the computer. A comment in HTML begins with the symbols less than, exclamation
    mark, and two dashes, like this: <!-- - and ends with the symbols two dashes and
    greater than, like this: -->.


    # HTML Tags


    An HTML document is composed of elements. An element is simply a part of an HTML
    document. Figure 7 shows an HTML element and all of its parts. Notice that an
    HTML element is composed of an opening tag, optional text, and a closing tag.
    A single tag begins with an opening tag with the less symbol (<) and ends with
    the greater symbol (>). For example <div class="note" id="high"></div>. An opening
    tag contains a tag name and optionally some attributes. Each attribute is composed
    of a name and a value separated by an equal sign (=), such as id="high". A closing
    tag has the same name as the opening tag, but the name is preceded by a slash
    character (/).


    ![](img/ef8ee93db95f659f7e069b8fe140b87b_29_0.png)


    Figure 7: An HTML element and its parts. An element is composed of an opening
    tag, optional text, and a closing tag. An opening tag is composed of a tag name
    and optional attributes. An attribute is composed of a name and a value.'
