  md: "Occasionally we want to initialize an array to hold constantly decreasing values\
    \ as: 15, 14, 13 ... 0. This is known as a reverse ramp because if you plotted\
    \ the values in the array, you would see a sloping line or ramp, constantly decreasing\
    \ to the right as shown in figure 15. Example code to initialize an array to a\
    \ reverse ramp is shown below.\n\n# Example 12\n\n```\n// Fills the specified\
    \ array with constantly decreasing\n// values from list.length - 1 to 0, inclusive.\n\
    function reverseRamp(list) {\n    var high = list.length - 1;\n    for (var i\
    \ = 0; i < list.length; i++) {\n    list[i] = high - i;\n}\n```\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_159_0.png)\n\
    \n| Desk Check |\n| list | high | i |\n|---|---|---||\n| [0] | [1] | [2] | [3]\
    \ | [4] |\n\n# Reversing an Array\n\nReversing the order of the elements in an\
    \ array is not commonly used in computer programs. However, it is an interesting\
    \ operation and understanding it helps students to understand more commonly used\
    \ array operations. One way is to use two index variables, one starts at the beginning\
