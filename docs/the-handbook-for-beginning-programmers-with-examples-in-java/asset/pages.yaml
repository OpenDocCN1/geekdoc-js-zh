  md: "# Sorting Array\n\nThe best way to sort an array is to use the sort functionality\
    \ provided by the programming language you are using because this built in sorting\
    \ functionality has been optimized and tested. JavaScript includes built in sort\
    \ functionality which is in the Array object. Shown below is JavaScript code to\
    \ sort an array using the built-in functionality.\n\n# Example 20\n\n```\nvar\
    \ vegetables = [ \"Radish\", \"Carrot\", \"Tomato\", \"Pea\" ];\nvegetables.sort();\n\
    ```\n\nIf you wish to sort elements in a different order than the one provided\
    \ by the JavaScript language, then you must write a comparison function and pass\
    \ that as a parameter to the sort function. This next JavaScript example shows\
    \ how to sort text strings in descending order.\n\n# Example 21\n\n```\n/* Compares\
    \ two values, s1 and s2 returns -1\n* if s1 should come before s2, 1 if s1 should\
    \ come\n* after s2, and 0 if the two values are equal. */\nfunction desc(s1, s2)\
    \ {\n  if (s1 > s2)\n    return -1;\n  if (s1 < s2)\n    return 1;\n  return 0;\n\
    }\n\nvar vegetables = [ \"Radish\", \"Carrot\", \"Tomato\", \"Pea\" ];\nvegetables.sort(descend);\n\
    ```\n\nBy default the built in sort function in JavaScript sorts arrays lexicographically\
    \ which essentially means alphabetically. This causes problems if you wish to\
    \ sort an array of numbers.\n\n# Example 22\n\n```\nvar numbers = [ 7, 10, 8,\
    \ 16, 3, 35 ];\n\n// WARNING: this will sort the numbers array\n// alphabetically\
    \ and not numerically.\nnumbers.sort();\n```"
  merge: -1
