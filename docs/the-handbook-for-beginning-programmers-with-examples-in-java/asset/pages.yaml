  md: '# Data Sizes


    Each of the following terms is a measure of the amount of data that a computer
    can store or process.


    +   19. bit – an abbreviation for binary digit. A binary digit is a column in
    a binary number where either 0 or 1 can appear


    +   20. nibble – four bits joined together to form a binary number. The name nibble
    is an inside computing joke because a nibble is half of a byte.


    +   21. byte – eight bits joined together to form a binary number.


    +   22. kilobyte – a true megabyte is 1024 (2¹⁰) bytes and not just 1000 bytes.


    +   23. megabyte – a true megabyte is 1,048,576 (2²⁰) bytes and not just 1,000,000
    bytes.


    +   24. gigabyte – ²³⁰ bytes


    +   25. terabyte – ²⁴⁰ bytes


    +   26. petabyte – ²⁵⁰ bytes


    +   27. exabyte – ²⁶⁰ bytes


    # Clock Speeds


    The clock within a CPU repeatedly produces an electric signal that pulses, meaning
    its voltage rises and falls similar to Figure 6. This electric signal pulses many
    times a second, and a single core on a CPU is designed to complete one instruction
    at the end of each pulse. Clock speed is measured in hertz. A hertz is one cycle
    per second. A cycle is from any point in the pulse to the pulse repeats. In other
    words, a single cycle starts immediately after the electric voltage falls, includes
    the voltage rising, and ends when the voltage falls again. Here are the terms
    used to measure clock speeds:


    ![](img/ef8ee93db95f659f7e069b8fe140b87b_16_0.png)


    > Figure 6: A graph of a pulsing electric signal showing three pulses or cycles.


    +   28. hertz – a unit of frequency equal to one cycle per second


    +   29. megahertz – one million cycles per second


    +   30. gigahertz – one billion cycles per second'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Many modern computers have clock speeds of 2.5 gigahertz or higher which means
    a single core on a CPU is designed to complete 2.5 billion instructions per second.
    Each core performs calculations independently of the other cores. A quad core
    CPU with a clock speed of 2.5 gigahertz is designed to complete 10 billion (4
    * 2.5 gigahertz) instructions per second. This is very fast.


    # Classes of Computers


    Computers can be classified according to their size and primary purpose. Here
    are some common computer classes.


    +   31. micro or personal computer – a computer designed to be used by only one
    person at a time, such as a smartphone, tablet computer, laptop computer, or desktop
    computer.


    +   32. workstation – a powerful computer designed to be used by one person at
    a time and used to perform engineering, scientific, and medical tasks such as
    designing airplane parts or modeling biological processes.


    +   33. mainframe – a very powerful computer designed to be used by many people
    at the same time to perform business or scientific tasks.


    # Categories of Software


    Computer hardware is really just a bunch of metal that electricity can flow through
    well-defined paths. Computer hardware will not do anything without some instructions.
    The instructions are written by a computer programmer and are called software.
    Computer software is simply a list of instructions that the computer hardware
    executes. Computer software can be classified according to its purpose.


    +   34. Application – computer software that someone uses to accomplish a specific
    task, such as write a letter, balance an account, watch a movie, or play a game.
    Examples of applications include Microsoft Word and Excel, Google Chrome, and
    iTunes.


    +   35. Operating system – computer software that manages the hardware and isolates
    the applications from the hardware so that the applications do not have to interact
    directly with the hardware. Examples of computer operating systems include Microsoft
    Windows, Mac OS X, VMS, Linux, HP-UX, and Solaris.'
  merge: -1
  pgno: 17
