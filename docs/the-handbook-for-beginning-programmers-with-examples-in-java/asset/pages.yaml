  md: "# Using De Morgan's Law\n\nYour school desires to help average students improve\
    \ their grades. You have been asked to write a program to print a list of students\
    \ that are *not* on the dean's list for academic excellence. You know that the\
    \ requirements for being on the dean's list are to have a GPA greater than 3.5\
    \ and have at least 23 credits. However, your program is supposed to print a list\
    \ of all the students *not* on the dean's list. How can you write if statement\
    \ to decide to print a student's name or not? Start with the dean's list criteria:\n\
    \n```\nif (gpa > 3.5 && credits >= 32) {\n  document.getElementById('outputDiv').innerHTML\
    \ =\n  name + ' is on the dean's list.';\n}\n```\n\nThe above code will print\
    \ a student's name if the student qualifies for the dean's list. However, your\
    \ program is supposed to print a list of all the students *not* on the dean's\
    \ list. So, you add a (!) to understand or reverse the sense of the boolean expression:\n\
    \n```\nif (!(gpa > 3.5 && credits >= 32)) {\n  document.getElementById('outputDiv').innerHTML\
    \ =\n  name + ' is on the average list.';\n}\n```\n\nThis new statement works\
    \ but is a bit sloppy and not very understandable. You realize that the condition\
    \ looks like the left half of De Morgan's law part b. From De Morgan's law we\
    \ see that Not (a And b) ⇽ you decide to rewrite the condition. Not a Or Not b,\
    \ so you can rewrite the previous expression as:\n\n```\nif (!(gpa > 3.5) || (credits\
    \ >= 32)) {\n  document.getElementById('outputDiv').innerHTML =\n  name + ' is\
    \ on the average list.';\n}\n```\n\nWhich can be simplified as:\n\n```\nif (gpa\
    \ <= 3.5 || credits < 32) {\n  document.getElementById('outputDiv').innerHTML\
    \ =\n  name + ' is on the average list.';\n}\n```\n\nThis final expression is\
    \ simple to understand and correctly determines if a student is not on the dean's\
    \ list."
