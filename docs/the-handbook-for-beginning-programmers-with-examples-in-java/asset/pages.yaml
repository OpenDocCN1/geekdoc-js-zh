    \ = parseInt(document.getElementById('radiusInputBox').value);\n  drawCircle(x,\
    \ y, radius);\n}\n```\n\n# Example 6\n\nWrite code to call a function that has\
    \ this header:\nfunction drawRectangle(x, y, width, height)\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_134_1.png)"
