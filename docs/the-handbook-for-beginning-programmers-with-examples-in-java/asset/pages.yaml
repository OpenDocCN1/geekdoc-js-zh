  md: "# Fahrenheit to Celsius\n\nThe formula for converting a temperature in Fahrenheit\
    \ to Celsius is\n\n$c = \\frac{5}{9}(f - 32)$\n\nIn some programming languages,\
    \ such as Java, C++, and C, this formula must be carefully written because in\
    \ those languages 5 causes the computer to perform **integer division** which\
    \ truncates the result by simply dropping the digits after the decimal point.\
    \ Thus, in such languages 5 * 9 yields 0, and a programmer must write the code\
    \ in a way to force the computer to perform floating, point division instead of\
    \ integer division. However, in JavaScript, the division operator always causes\
    \ the computer to perform floating point division.\n\n# Example 10\n\n```\n<!DOCTYPE\
    \ HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Convert\
    \ Fahrenheit to Celsius</title>\n\n<script type=\"text/javascript\">\n/* Input:\
    \ a temperature in Fahrenheit\n* Processing: convert the temperature from Fahrenheit\
    \ to Celsius\n* Output: the temperature converted to Celsius */\nfunction fahrToCels()\
    \ {\n  // Read a Fahrenheit temperature from the user.\n  var text = document.getElementById('fahrenheitInput').value;\n\
    \  var f = parseFloat(text);\n\n  // Convert the Fahrenheit temperature into Celsius.\n\
    \  var c = 5 / 9 * (f - 32);\n\n  // Display the Celsius temperature to the user.\n\
    \  document.getElementById('elsiusDiv').innerHTML = c;\n}\n</script>\n</head>\n\
