  md: '# The Unified Modeling Language


    Many programmers use diagrams to design and document the classes and objects in
    their programs. The most common language used for these diagrams is the Unified
    Modeling Language (UML). One type of diagram in the UML is the **class diagram**.
    Figure 38 shows a UML class diagram with two classes. Within a class diagram,
    each class is shown as a rectangle usually with three sections. The first section
    contains the name of the class. The second section contains a list of the data
    that all objects created from the class will have. The third section contains
    a list of the behaviors that all objects created from the class will have.


    | Student | Course |

    | --- | --- |

    | -firstName | -number |

    | -lastName | -title |

    | -address | -description |

    | -phone | -location |

    | +changeName() | +open() |

    | +register() | +allowStudent() |

    | +attendClass() | +close() |


    **Figure 38:** A UML class diagram showing two classes.


    # Relationships


    There are several different relationships that can exist between objects or classes.
    Relationships between classes are shown as different types of lines connected
    to the classes.


    # Aggregation


    A relationship between two objects such that one object contains the other object.
    This is sometimes called a *whole* part relationship. In order to use aggregation
    between two objects *whole* and *part*, one of these English phrases must make
    sense: *whole* contains *part* or *whole* has a *part*. The UML symbol for aggregation
    is a solid line with an unfilled diamond connected to the containing class:


    | Whole | Part |

    | --- | --- |


    A relationship between two objects such that one object contains the other object
    and the contained object may not be shared. This is also a whole part relationship
    and a strong form of aggregation. In order to use composition between two objects
    *whole* and *part*, one of these English phrases must make sense: *whole* contains
    *part* or *whole* has a *part*. The UML symbol for aggregation is a solid line
    with a filled diamond connected to the containing class:


    | Whole | Part |

    | --- | --- |'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Inheritance


    A relationship between classes that causes the child class to automatically have
    everything (data, behavior, and relationships) that the parent class has. In order
    to use inheritance between two objects parent and child, one of these English
    phrases must make sense: child is a kind of parent or child is a parent. The UML
    symbol for inheritance is a solid line with an unfilled triangle connected to
    the parent class.


    | Parent | Child |

    |---|---|

    | | |


    # Dependency


    A relationship between two objects such that one object requires or uses the other
    object to accomplish a task. In order to use dependency between two objects x
    and y, one of these English phrases must make sense: x uses y or x requires y
    or x needs y. The UML symbol for dependency is a dashed line with an open arrow
    head connected to the required or needed class.


    | Needed | Needy |

    |---|---|

    | | |


    # Association


    A general relationship between objects. When two objects are related but the relationship
    is not aggregation, composition, inheritance, or dependency, then use association.
    The UML symbol for association is a solid line.


    | A | B |

    |---|---|

    | | |'
