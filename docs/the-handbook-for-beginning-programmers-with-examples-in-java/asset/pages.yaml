  md: "If the key is not present in the array, the return value of the binary search\
    \ function above is -insertPoint - 1. In other words, if the key is not present\
    \ in the array, the index where key should be inserted can be found using this\
    \ code:\n\n```\nvar index = binarySearch(list, key);\nif (index < 0) {\n  var\
    \ insertPoint = -index - 1;\n}\",}\n```\n\nIn the binarySearch code above, the\
    \ statement that computes mid needs some explanation. Here is in the line:\n\n\
    ```\nmid = left + ((right - left) >>> 1);\n```\n\nThe right shift operator (>>>)\
    \ shifts all the bits in an integer to the right which is the same using integer\
    \ division to divide a non-negative integer by a power of two. However, the right\
    \ shift operator executes faster than division. To help us understand the statement,\
    \ we can rewrite it by replacing >>> 1 with / 2.\n\n```\nmid = left + Math.floor((right\
    \ - left) / 2);\n```\n\nNotice that this statement uses the Math.floor function\
    \ to truncate (not round) the result of the division. Also notice that if this\
    \ were an algebraic expression, it could be simplified to\n\n```\nmid = Math.floor((left\
    \ + right) / 2);\n```\n\nwhich is easier to understand. From this simplified formula\
    \ we see that the midpoint is simply the left index plus the right index divided\
    \ in half. However, because of number overflow, if we use the simplified formula\
    \ in the code, it may not work for very large arrays, and so we use the more complex\
    \ formula."
