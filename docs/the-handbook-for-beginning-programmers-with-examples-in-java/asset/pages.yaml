  md: '# Advantages of Functions


    There are multiple advantages to writing statements inside a function instead
    of outside of all functions, including


    +   1. Control of execution – JavaScript statements that are inside an HTML script
    tag but outside of all functions are executed immediately when a document is read
    into memory by a browser. Statements that are inside a function are not executed
    until a function is called which gives the programmer control over when statements
    are executed.

    2. Code reuse – After a function is written it can be reused again and again by
    calling it from multiple locations in a program.

    3. Less code – Because a programmer can reuse code, he does not have to write
    as much code.

    4. Fewer coding mistakes – writing code will naturally lead to fewer mistakes
    because there is simply less code to contain the mistakes.

    5. Better organization

    6. Easier to read and understand

    7. Easier to debug

    8. Faster execution – Because a program with well written functions contains less
    code, that program will very likely load faster and execute faster.

    9. Variable name reuse – Because variables declared inside a function are local
    to that function only, a programmer can reuse variable names in different functions.


    # Summary of Terms


    | module | part of a program; can refer to a very large part of a program, including
    many files and functions, or can refer to a small part of a program such as a
    single function |

    | function | the smallest part of a program that performs actions, sometimes called
    a *method*;; also the JavaScript keyword that begins a function |

    | header | the first line of a function; also known as the *signature*;; includes
    the function name and parameter list |

    | parameter | a piece of data that a function needs in order to complete its task
    or perform its calculations; parameters are listed in a function''s header |

    | body | the part of a function that contains the JavaScript code that is executed
    when a function is called; the code in a function''s body produces the result
    or return value of that function |'
