  md: '# Common Mistakes


    Forgetting the left-hand side of a second comparison


    | Incorrect | Correct |

    |---|---|

    | if (y == 6 || y == 7) { } | if (y == 6 || y == 7) { |

    | if (y == (6 | 7)) { } | |

    | if (y == 6, 7) { } | |

    | if (y == (6, 7)) { } | |


    Forgetting &&


    | Incorrect | Correct |

    |---|---|

    | if (10 < x < 20) { } | if (10 < x && x < 20) { } |


    Mixing up the logical operators


    | Incorrect | Correct |

    |---|---|

    | // This will always be true. Think about it. if (x > 10 || x < 20) { } | //
    Almost certainly you meant to write this: if (10 < x && x < 20) { } |

    | // This will always be false. if (x == 8 && x == 9) { } | // Almost certainly
    you meant to write this: if (x == 8 || x == 9) { } |'
