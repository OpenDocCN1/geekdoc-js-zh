  md: "# Zero-Based Counting Loop\n\nExperienced computer programmers almost always\
    \ write counting loops to begin at zero (0) rather than (1) as we have all been\
    \ taught since before kindergarten. There are probably many reasons programmers\
    \ start loops at zero; one of them is because array elements (see chapter 10)\
    \ are indexed starting with zero in C, C++, Java, and JavaScript. Because zero-based\
    \ counting loops are so common and useful in computer programming, the aspiring\
    \ programmer must learn to write them. Below are two examples of zero-based counting\
    \ loops that execute the statements inside the loops exactly n times.\n\n# Example\
    \ 6\n\n```\nvar n = 3;\nvar i = 0;\nwhile (i < n) {\n  window.alert(\"leaf\");\n\
    \  i++;\n}\n```\n\n| i | n |\n|---|---|\n| | |\n| | |\n| | |\n\n# Example 7\n\n\
    ```\nvar n = 3;\nfor (var i = 0; i < n; i++) {\n  window.alert(\"caterpillar\"\
    );\n}\n```\n\n| i | n |\n|---|---|\n| | |\n| | |\n| | |\n\n# Skipping Loop\n\n\
    Sometimes we want the computer to count by a value other than 1. We can write\
    \ a loop that will cause the computer to skip values.\n\n# Example 8\n\n```\n\
    var skip = 4;\nvar n = 12;\nvar i = 0;\nwhile (i < n) {\n  window.alert(\"stem\"\
    );\n  i += skip;\n}\n```\n\n| i | skip | n |\n|---|---|---|\n| | | |\n| | | |\n\
    | | | |"
