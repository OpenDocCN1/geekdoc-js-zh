  md: "# Finding a Range\n\nSometimes a computer program has a list of numerical ranges\
    \ and must find the range that contains some value. Examples of this type of computing\
    \ problem include:\n\n+   - determining a person's income tax rate from a list\
    \ of income ranges and graduated tax rates\n- determining a customer's discount\
    \ rate from a list of purchase ranges and discount rates\n- determining a salesperson's\
    \ commission from a list of sales ranges and commission rates\n- determining a\
    \ student's letter grade from a list of score ranges and letter grades\n\nFor\
    \ example, a company may offer discounts to its customers where the discount rate\
    \ is based on the amount purchased according to this table:\n\n| If the purchase\
    \ amount is greater than or equal | And the purchase amount is less than | Then\
    \ the discount rate is |\n| --- | --- | --- |\n| 0 | $300 | 0% |\n| $300 | $600\
    \ | 2.0% |\n| $600 | $1000 | 2.5% |\n| $1000 | ∞ | 3.0% |\n\nA beginning programmer\
    \ will often code a JavaScript solution to this problem like this:\n\n# Example\
    \ 16\n\n```\n// Computes and returns a discounted purchase amount.\nfunction getDiscountedAmount(purchase)\
    \ {\n  var rate = 0;\n  if (purchase >= 0 && purchase < 300) {\n    rate = 0;\n\
    \  }\n  if (purchase >= 300 && purchase < 600) {\n    rate = 0.02;\n  }\n  if\
    \ (purchase >= 600 && purchase < 1000) {\n    rate = 0.025;\n  }\n  if (purchase\
    \ >= 1000) {\n    rate = 0.03;\n  }\n  var discount = purchase * rate;\n  return\
    \ purchase - discount;\n}\nDesk Check\npurchase rate discount return\n$708.00\n\
    ```"
  merge: -1
  pgno: 162
