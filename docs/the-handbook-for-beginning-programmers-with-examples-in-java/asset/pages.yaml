    \nIf the elements in an array are sorted, then the computer can use a faster algorithm\
    \ called **binary search** to find an element within that array. The binary search\
    \ algorithm works by comparing the key to the middle most element in the array.\
    \ If the key is greater than the middle most element, the search is repeated in\
    \ the last half of the array. If the key is less than the middle most element,\
    \ the search is repeated in the first half of the array. Of course, if the key\
    \ is equal to the middle most element, the key has been"
