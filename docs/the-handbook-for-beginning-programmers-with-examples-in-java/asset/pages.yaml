  md: '# Chapter 7. Logic


    When writing a condition in an if statement, we often want the computer to evaluate
    more than one comparison. For example, we may want the computer to check if a
    person is male and older than forty. To combine more than one comparison within
    an if statement we use the logical operators.


    # Chapter Outcomes


    By the end of this chapter you will be able to:


    +   - Read and write if statements with multiple comparisons in the condition.

    - Understand the logical operators: Not (!), And (&&), Inclusive Or (||), and
    Exclusive Or (^).

    - Use the logical operators to refine online searches.

    - Write truth tables to help you evaluate and rewrite logical expressions.


    # Logical Operators


    To combine two or more comparisons in the condition of a single if statement,
    we use the logical operators, also called the boolean operators. The following
    table describes the four JavaScript logical operators.


    | Operator | Name | Description |

    |---|---|---|

    | ! | Not | Unary operator that reverses or switches a false value to true and
    a true value to false |

    | && | And | Binary operator that combines two conditions, and the combined condition
    is true; if and only both conditions are true, otherwise the combined condition
    is false |

    | || | Inclusive Or (Or) | Binary operator that combines two conditions, and the
    combined condition is true; if either or both conditions are true, otherwise the
    combined condition is false |

    | ^ | Exclusive Or (Xor) | Binary operator that combines two conditions, and the
    combined condition is true; if and only if one condition is true and the other
    is false; otherwise the combined condition is false |


    Notice that Inclusive Or is often abbreviated as Or, and Exclusive Or is often
    abbreviated as Xor. Notice also that Not (!!) is a unary operator which means
    it operates on only one'
