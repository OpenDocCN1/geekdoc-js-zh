  md: "# do while\n\nThe do-while loop is the only post-test loop in JavaScript. The\
    \ other three loops: while, for, and for-each are pre-test loops.\n\nUse a do-while\
    \ loop when:\n\n+   - You can't use a simple counting loop, so you must use a\
    \ sentinel controlled loop;\n- The statements inside the loop must be executed\
    \ before checking the sentinel.\n\n# Template\n\n```\ndo {\n  statements;\n} while\
    \ (condition);\n```\n\nFigure 28 shows a do-while loop and the order in which\
    \ the computer executes its parts. The statements in the body of a post-test loop\
    \ will be executed at least once because the test to continue the loop is at the\
    \ bottom and is evaluated after the statements in the body are executed. The statements\
    \ in a pre-test loop (while, for, and for-each) may never be executed because\
    \ the test is at the top of those loops and evaluated before the statements in\
    \ the body.\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_112_0.png)\n\n**Figure\
    \ 28:** A do-while loop and the order that the computer executes its parts.\n\n\
    # Example 5\n\n```\nvar alias, response;\ndoo {\n  // Statements to be repeated\
    \ here.\n  alias = window.prompt(\"What is your name?\");\n  response = window.prompt(\"\
    Are you sure \" + \n  alias + \" is your name?\");\n} while (response != \"yes\"\
    );\nwindow.alert(\"Hello \" + alias);\n```\n\n| Desk Check |\n| alias response\
    \ |\n| | |\n| |\n\n8. Repetition\n\n101"
