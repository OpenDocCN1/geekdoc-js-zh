  md: '# Computer Programs


    A computer program is composed of data and instructions. The computer stores the
    data temporarily in its main memory. It also stores data more permanently in files
    on a hard drive, memory stick, or compact disk. The instructions in a computer
    program are like the steps in an algorithm. In a programming language like JavaScript,
    the instructions are called statements. A single statement is equivalent to a
    single step in an algorithm or a single sentence in a paragraph. The statements
    tell the computer what to do with the data.


    # Computer Operations


    A computer has seven basic operations that it can perform, all of which we can
    use when writing algorithms in a computer program. A computer can:


    +   - Receive data (input)

    Input devices: keyboard, mouse, microphone, touch screen, temperature sensor,
    hard drive, flash drive, etc.


    +   - Write out data (output)

    Output devices: monitor, printer, speakers, lights, hard drive, flash drive, etc.


    +   - Assign a value to a variable or memory location


    +   - Perform arithmetic

    Operators: (negation), * (multiplication), / (division), % (modulus), + (addition),
    - (subtraction)


    +   - Compare two values

    Relational operators: < (less than), <= (less than or equal), > (greater than),
    >= (greater than or equal), == (equal), != (not equal)


    +   - Repeat a group of actions


    +   - Call a function and return from that function


    You will study and use each of these basic computer operations in later chapters
    of this text.'
