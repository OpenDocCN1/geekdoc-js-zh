  md: '# # HTML Tags


    # ## Opening and Closing Tags


    | | Purpose |

    |---|---|

    | `<div> </div>` | Marks the start and end of a division within an HTML document.
    The concept of division in HTML is very general and is simply a large, medium,
    or small section of a document. |

    | `<h1> </h1>` | Marks the start and end of a level 1 heading. There are six different
    heading tags numbered from <h6> to <h6> with <h1> being the largest and <h6> being
    the smallest style of heading. |

    | `<h2> </h2>` | Marks the start and end of a level 2 heading. |

    | `<p> </p>` | Marks the limits of a paragraph. |

    | `<br>` | Forces the browser to insert a line break. (No closing tag.) |

    | `<input type="text" id="years">` | Makes a text field (single row) where a user
    can enter data. (No closing tag.) |

    | `<textarea> </textarea>` | Makes a text area (multiple rows) where a user can
    enter data. |

    | `<button type="button" onclick="computeFV()"></button>` | Makes a button that
    a user can click. |


    # ## Case Insensitive


    HTML 5 is not case sensitive. This means <HTML> and <html> and <HMl> have the
    same meaning in HTML 5. However, the standard convention is to use all lower case
    for tags and attributes except for the DOctype declaration which is all uppercase.
    Most developers use lower case letters for two reasons:


    +   1. Lower case letters are easier to read because they vary in size more than
    upper case letters.

    2. If an HTML 5 document is ever converted to XHTML, which requires lower case
    tags and attributes, the conversion will be easier.'
