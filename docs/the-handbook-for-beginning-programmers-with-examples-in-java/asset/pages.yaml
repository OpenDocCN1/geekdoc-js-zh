    # Chapter Summary


    +   * Repetition is the control structure that a programmer uses to cause a computer
    to repeat a group of statements.

    * Loop is the informal term for repetition control structure.

    * In a pre-test loop, the loop continuation condition is written at the top of
    the loop which causes a computer to check the condition before the computer executes
    the statements in the loop.

    * In a post-test loop, the loop continuation condition is written at the bottom
    of the loop which causes a computer to execute the statements in the loop before
    it checks the condition.

    * A counting loop causes a computer to repeat a group of statements until a counting
    variable reaches a desired number.

    * A sentinel controlled loop causes a computer to repeat a group of statements
    until an event (sentinel) occurs.

    * There are four styles of loops in JavaScript: while, for, for-each, and do-while.

    * A while loop is a pre-test loop that is often used as a sentinel controlled
    loop that causes a computer to repeat the statements inside it while a given condition
    is true.

    * A for loop is a pre-test loop that is used for writing simple counting loops.

    * A do-while loop is a post-test loop that is often used as a sentinel controlled
    loop.'
