  md: 'In example 19, line 1 causes the computer to store the number 4 in the variable
    *a*. On line 2, because the increment operator is written as a post-increment,
    the computer first performs the other calculations on line 2 which results in
    14 being stored in *b* and notice in example 19 that incrementing *a* does not
    affect the value of *b* because the increment is a post-increment and the computer
    increments *a* after calculating the value of *b*.


    When a new programmer understands the post-increment operator, the most common
    question she asks is "Why? Why would anyone ever use the post-increment operator
    to change the value of a variable after the other calculations in the same statement?
    The answer is "to prepare the incremented variable (*a* in examples 18 and 19)
