  md: "Pre-test loops are used much more frequently than post-test loops. In fact\
    \ all post-test loops can be rewritten as pre-test loops, so post-test loops are\
    \ not strictly necessary in a programming language, but they are sometimes convenient\
    \ to use.\n\n# Counting and Sentinel Controlled Loops\n\nLoops can also be categorized\
    \ by what is in their condition. A counting loop causes the computer to count\
    \ from a start value to an end value. A counting loop's condition is a simple\
    \ check to see if the counting variable has reached the end value. A sentinel\
    \ controlled loop causes the computer to repeat statements until some event occurs\
    \ or the computer encounters some sentinel value. A sentinel controlled loop's\
    \ condition checks for the occurrence of that event or sentinel value.\n\n# Repetition\
    \ Control Structures\n\nJavaScript has four ways to write a repetition control\
    \ structure to cause a computer to repeat statements. The four ways are: while,\
    \ for, for-each, and do-while. The while, for, and for-each loops are pre-test\
    \ loops. The do-while loop is a post-test loop. The while, for, and do-while loops\
    \ all have a condition and repeat the statements inside of the loop while the\
    \ condition is true. The for-each loop repeats the statements inside the loop\
    \ once for each attribute in an object (see chapter 11).\n\n# while\n\nUse a while\
    \ loop when:\n\n+   - You need a simple counting loop; or\n- You can't use a simple\
    \ counting loop, so you must use a sentinel controlled loop, and the sentinel\
    \ must be checked before executing the statements inside the loop.\n\n```\nwhile\
    \ (condition) {\n  }\n```\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_109_0.png)\n\
    \nFigure 26 shows a while loop and the order in which the computer executes its\
    \ parts.\n\nFigure 26: A while loop and the order that the computer executes its\
    \ parts."
