  md: '# # Chapter 2. Algorithms and Computer Programs


    # ## Chapter Outcomes


    By the end of this chapter you will:


    +   - Read a description of a problem and write a defining table to help you better
    understand the problem.

    - Develop an algorithm for a common task.

    - Understand the basic operations that a computer can perform.

    - Learn the three basic control structures: sequence, selection, and repetition,
    and what they cause a computer to do.


    # ## Defining Table


    An **algorithm** is simply a list of steps to perform some task. A large computer
    program contains many algorithms. Before creating an algorithm to solve a problem,
    you must be sure that you understand the problem. If you don''t, you will probably
    create an algorithm that solves the wrong problem. A **defining table** is a useful
    tool to help you understand a problem before you develop an algorithm to solve
    it. A defining table has three sections: input, processing, and output. To create
    a defining table, simply draw a table with the three sections, and as you read
    and re-read the problem, put the parts of the problem into their correct section
    in the table.


    # ## Example 1


    You work for a large construction company. Your boss has asked you to write a
    computer program that will read a list of window openings for a building and output
    the total cost of all the windows. The window openings are entered in inches with
    the width first and the height second. The cost of a window is computed by multiplying
    the area of the window in square feet by $35.


    # ### Defining Table


    | Input | Processing | Output |

    | --- | --- | --- |

    | A list of window openings For each window | For each window - compute area in
    sq ft - multiply area by $35 - add cost of this window to the total cost | total
    cost of all windows |

    - width in inches | |

    - height in inches | |'
  merge: -1
