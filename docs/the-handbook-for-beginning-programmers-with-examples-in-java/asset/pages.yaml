  md: "```\n// Finds and returns the greatest common\n// divisor of two integers a\
    \ and b.\nfunction gcd(a, b) {\n  // Ensure a and b are not negative.\n  a = Math.abs(a);\n\
    \  b = Math.abs(b);\n\n  // Ensure a is greater than or equal to b.\n  if (a <\
    \ b) {\n    var swap = a;\n    a = b;\n    b = swap;\n  }\n\n  // Loop until the\
    \ greatest\n// common divisor is found.\n  do {\n    var r = a % b;\n    a = b;\n\
    \    b = r;\n  } while (b != 0);\n\n  return a;\n}\n</script>\n</head>\n\n<body>\n\
