  md: '# Array Methods


    JavaScript includes several useful methods that you can use to manipulate the
    contents of arrays.


    | Method | Description |

    | --- | --- |

    | a.concat(item1, item2, ...) | Returns a new array composed of the original array
    and the argument arrays or values. |

    | a.every(func, thisArg) | Returns true if a test returns true for every element
    in an array. |

    | a.filter(func, thisArg) | Returns a new array that contains all elements that
    passed a test function. |

    | a.forEach(func, thisArg) | Calls a function once for each element in an array.
    |

    | a.indexOf(toFind) | Returns the index within the array of the first occurrence
    of the element toFind, or -1 if not found. |

    | a.join(separator) | Joins all elements of an array into a string. |

    | a.lastIndexOf(toFind) | Returns the index within the array of the last occurrence
    of the element toFind, or -1 if not found. |

    | a.map(func, thisArg) | Returns a new array that contains the results of calling
    a function on every element in an array. |

    | a.pop() | Removes and returns the last element from an array. |

    | a.push(item1, item2, ...) | Adds one or more elements to the end of an array.
    |

    | a.reduce(func, thisArg) | Returns an accumulated value produced by calling a
    function on every element in an array. |

    | a.reverse() | Reverses the elements in an array. |

    | a.shift() | Removes and removes the first element from an array. |

    | a.slice(start, end) | Returns a new array that is a copy of elements between
    [start, end]. |

    | a.some(func, thisArg) | Returns true if a test returns true for at least one
    element in an array. |

    | a.sort(compareFunc) | Sorts the elements of an array in place. |

    | a.splice(start, count, item1, item2, ...) | Removes and adds elements to an
    array. |

    | a.unshift(item1, item2, ...) | Adds one or more elements to the beginning of
    an array. |'
