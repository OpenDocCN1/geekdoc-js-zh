    | |\n| |\n| |\n\n# for\n\nThe for loop is a shortened way of writing a counting\
    \ while loop. Use a for loop when:\n\n+   - You need a simple counting loop.\n\
    \n# Template\n\n```\nfor (initialization; condition; update) {\n  statements;\n\
    }\n```\n\nThe parentheses of a for loop must always be three statements separated\
    \ by two semicolons. The three statements are:\n\n+   1. The initialization statement\
    \ which is executed only once at the beginning of the loop.\n2. The condition\
    \ that the computer checks to see if it should continue to execute the statements\
    \ inside the body of the loop. The computer checks this condition after the initialization\
    \ statement and each time at the beginning of the loop.\n3. The update that the\
    \ computer executes each time through the loop as if it were written as the last\
    \ statement in the body.\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_110_0.png)\n\
