  md: '# # Chapter 11. Objects


    When a programmer writes a large program, it is difficult for the programmer to
    keep all the code organized. One way to keep the code in a large program organized
    is to use object oriented programming. Object oriented programming is a way of
    viewing the world and designing and implementing software that matches the world.


    # ## Chapter Outcomes


    By the end of this chapter you will:


    +   - Understand the terms object and class

    - Understand object-oriented relationships aggregation, composition, inheritance,
    dependency, and association

    - Understand multiparticle applied to aggregation, composition, and association

    - Read a UML class diagram

    - Create a JavaScript object from a built-in prototype object

    - Access an attribute from a JavaScript object

    - Call a function from a JavaScript object


    An **object** is anything in the world that has these four things:


    +   - Identity: A unique name or identification number


    +   - Data: These are characteristics of an object and are usually adjectives.
    These are also called attributes, properties, characteristics, fields, instance
    variables, or structure.


    +   - Behavior: These are the things an object does and are usually verbs. These
    are also called functions, operations, methods, or procedures.


    +   - Relationships: These are links or connections between objects.


    A **class** is both a group of similar objects and a pattern for creating objects.
    Since an object has identity, data, behavior, and relationships and since a class
    is a pattern for creating objects, then a class must have those four things as
    well.'
  merge: -1
  pgno: 176
