  md: "# Prime Numbers\n\nA prime number is a positive integer that is evenly divisible\
    \ by only two integers, 1 and itself. The numbers 2, 3, 5, and 7 are prime as\
    \ 91, 97, and 101. Prime numbers are very important in computing, for example\
    \ in hash code algorithms and data encryption. There are many well known algorithms,\
    \ including the sieve of Eratosthenes, for determining if a number is prime. The\
    \ following JavaScript code uses a naive and slow algorithm to determine if a\
    \ number is prime, but it works. The code below increments a divisor from 1 to\
    \ the candidate, inclusive and repeatedly divides the candidate by the divisor.\
    \ Each time the divisor divides the candidate without a remainder, then a factor\
    \ count is incremented. After the divisor loop is finished, if factor count is\
    \ 2 (1 and the candidate itself), the candidate is prime, otherwise it is not\
    \ prime.\n\nExample 12\n\n```\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n\
    <meta charset=\"utf-8\">\n<title>Prime Number</title>\n</head>\n<script type=\"\
    text/javascript\">\n/* Input: an integer determine if the given integer is prime\
    \ or not.\n* Output: __ is prime OR __ is not prime */\nfunction isPrime() {\n\
    \    var candidate = parseInt(document.getElementById('integerBox').value;\n\n\
    \    // Count the number of factors that evenly divide candidate\n    var factorCount\
    \ = 0;\n    for (var divisor = 1; divisor <= candidate; divisor++) {\n       \
    \ var remainder = candidate % divisor;\n        if (remainder == 0) {\n      \
    \      factorCount++;\n        }\n    }\n\n    // Determine the output and show\
    \ it to the user.\n    var output;\n    if (factorCount == 2) {\n        output\
    \ = candidate + ' is prime';\n    } else {\n        output = candidate + ' is\
    \ not prime';\n    }\n    document.getElementById('outputDiv').innerHTML = output;\n\
    }\n</script>\n```"
