    \ | c | s | (s-a) | (s-b) | (s-c) | area |\n|---|---|---|---|---|---|---|---|\n\
    \nDesk Check pa\n\n## How Long to Invest\n\nA common question when saving and\
    \ investing money is “How long will I need to invest a certain amount of money\
    \ in order for money to grow to a certain larger amount of money?” For example,\
    \ how many months will I need to invest $100 at 6% fixed annual rate compounded\
    \ monthly in order for my investment to grow to $103?\n\nExample 15\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>How\
    \ Long to Invest</title>\n<script type=\"text/javascript\">\n/* Input: No user\
    \ input\n * Processing: Determine the number of months to grow an initial\n *\
    \ investment of $100 to at least $103 if it grows at an annual rate of 6%.\n *\
    \ Output: The number of months. */\nfunction testInvest() {\n  var m = determineMonths(100,\
    \ 0.06, 103);\n  document.getElementById('outputDiv').innerHTML = m;\n}\n\n//\
    \ Computes and returns the number of months needed for principal\n// at a constant\
    \ annual rate to grow to target.\nfunction determineMonths(principal, annualRate,\
    \ target) {\n  var monthlyRate = annualRate / 12;\n  var balance = principal;\n\
    \  var month = 0;\n\n  // Repeat while the balance of the investment is less than\
    \ the target.\n  while (balance < target) {\n    var interest = Math.round(balance\
    \ * monthlyRate * 100) / 100;\n    balance += interest;\n    month++;\n  }\n \
    \ return month;\n}\n</script>\n</head>\n<body>\n<button type=\"button\" onclick=\"\
    testInvest()\">Test</button>\n<div id=\"outputDiv\"></div>\n</body>\n</html>\n\
    ```\n\n| principal | annualRate | interest | balance | month |\n|---|---|---|---|---|\n\
    | | | | | |\n| | | | | | |\n\n## Greatest Common Divisor\n\nThe greatest common\
    \ divisor (gcd) of two non-zero integers is the largest positive integer that\
    \ divides both numbers without a remainder. An efficient algorithm to compute\
    \ the gcd was discovered by Euclid and works like this. Given two integers, 102\
    \ and 18,\n\n1. divide 102 by 18 to get a quotient of 5 and a remainder of 12,\n\
    2. divide 18 by 12 to get a quotient of 1 and a remainder of 6,\n3. divide 12\
    \ by 6 to get a quotient of 2 and a remainder of 0\n4. the remainder 0 means the\
    \ greatest common divisor of 102 and 18 is 6.\n\nEuclid's algorithm is written\
    \ on the next page inside a JavaScript function that has this header: function\
    \ gcd(a, b). Notice from its header that the gcd function requires two values\
    \ as parameters. To call this function a programmer must write the name of the\
    \ function, gcd, followed by an argument list with the two parameters, as shown\
    \ in the testGCD function below.\n\n## Example 16\n\n```html\n<!DOCTYPE HTML>\n\
    <html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Greatest Common\
    \ Divisor</title>\n<script type=\"text/javascript\">\n/* Input: User input\n*\
    \ Processing: Determine the greatest common divisor of -24 and 472\n* Output:\
    \ The greatest common divisor */\nfunction testGCD() {\n  var x = -24;\n  var\
    \ y = 472;\n  var divisor = gcd(x, y);\n  document.getElementById('outputDiv').innerHTML\
    \ = divisor;\n}\n```\n\n| x | y | divisor |\n|---|---|---|\n| | | |\n\n```\n//\
    \ Finds and returns the greatest common divisor of two integers a and b.\nfunction\
    \ gcd(a, b) {\n  // Ensure a and b are not negative.\n  a = Math.abs(a);\n  b\
    \ = Math.abs(b);\n\n  // Ensure a is greater than equal to b.\n  if (a < b) {\n\
    \    var swap = a;\n    a = b;\n    b = swap;\n  }\n\n  // Loop until the greatest\
    \ common divisor is found.\n  do {\n    var r = a % b;\n    a = b;\n    b = r;\n\
    \  } while (b != 0);\n\n  return a;\n}\n</script>\n</head>\n\n<body>\n<button\
    \ type=\"button\" onclick=\"testGCD()\">Test</button>\n<div id=\"outputDiv\"></div>\n\
    </body>\n</html>\n```\n\n| r | a | b | swap |\n|---|---|---|---|\n| | | | |\n\
    | | | | |\n| | | | |\n\n## Common Mistakes\n\nPutting a space in a function's\
    \ name\n\n```javascript\nIncorrect\nfunction check Answer() { \n}\n```\n\n```javascript\n\
    Correct\nfunction checkAnswer() {\n}\n```\n\nForgetting the opening or closing\
    \ curly brace\n\n```javascript\nIncorrect\nfunction sum(x, y, z) {\n  var s =\
    \ x + y + z;\nreturn s;\n```\n\n```javascript\nCorrect\nfunction sum(x, y, z)\
    \ {\n  var s = x + y + z;\n  return s;\n}\n```\n\nRe-declaring or re-assigning\
    \ parameters\n\n```javascript\nfunction getDiscountRate(birthday, gpa) {\n// Wrong!\
    \ Don't re-declare nor assign parameters.\nvar birthday = new Date(\"3/17/1995\"\
    );\nvar gpa = window.prompt(\"What is your GPA?\");\n```\n\n```javascript\nvar\
    \ birthday = birthday.getFullYear();\nvar currYear = new Date().getFullYear();\n\
    var age = currYear - birthday;\nvar currRate;\n...\nreturn currRate;\n```\n\n\
    Confusing the concepts of return and output\n\nReturn means to return a value\
    \ to the call point of a function. This is entirely internal to a program, and\
    \ the user will not see anything because of a return statement. To return a result\
    \ from a JavaScript function, use the keyword return.\n\nOutput means to show\
    \ a value to the user. In JavaScript output is done by calling window.alert, document.write,\
    \ or assigning a value to the innerHTML attribute of a div document.getElementById('resultDiv').innerHTML\
    \ = x;\n"
  mdcn: "\n\n## 三角形的面积\n\n如果我们知道三角形的边长如图31 所示，我们可以使用海伦公式计算该三角形的面积，公式如下：\n\n```\n$area\
    \ = \\sqrt{s(s-a)(s-b)(s-c)}$\n```\n\n其中 $a$、$b$ 和 $c$ 是三角形三条边的长度，$s$ 是三角形的半周，定义为：\n\
    \n```\n$s = \\frac{a+b+c}{2}$\n```\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_141_0.png)\n\
    \n## 示例 13\n\n```html\n<!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>Triangle Area</title>\n<script type=\"text/javascript\">\n/*\
    \ 输入：无用户输入\n * 处理：计算边长为 4、2 和 5 的三角形的面积\n * 输出：三角形的面积\n */\nfunction testTriangle()\
    \ {\n  var r = triangleArea(4, 2, 5);\n  document.getElementById('outputDiv').innerHTML\
    \ = r;\n}\n\n// 计算并返回边长为\n// a, b, 和 c 的三角形的面积。\nfunction triangleArea(a, b, c)\
    \ {\n  var s = (a + b + c) / 2;\n  var area = Math.sqrt(s * (s-a) * (s-b) * (s-c));\n\
    \  return area;\n}\n</script>\n</head>\n<body>\n<button type=\"button\" onclick=\"\
    testTriangle()\">Test</button>\n<div id=\"outputDiv\"></div>\n</body>\n</html>\n\
    ```\n\n```人工检核 (Desk Check)\n\n| a | b | c | s | (s-a) | (s-b) | (s-c) | area\
    \ |\n|---|---|---|---|---|---|---|---|\n| | | | | | | | |\n\n## 金字塔的表面积\n\n想象你正在设计一座伟大的金字塔。金字塔内部的石头非常粗糙，基本上只是填充物。外面的石头经过了光滑处理以反射阳光。如果你正在编写设计金字塔的软件，你的软件必须计算金字塔的表面积，这样建造者就知道需要多少处理过的石头来覆盖金字塔的外侧。\n\
    \n图32 显示了一个正金字塔（四个侧的大小相同），其边长为 $e$，高度为 $h_l$，底长为 $b$。由于它是正金字塔，计算表面积时将其乘以4 即可。如果正金字塔三角形面的建造者指定了底长和高度，那么你的软件可以使用此公式从底长和高度计算边长：\n\
    \n```\n$e = \\sqrt{\\frac{b^2}{2} + h^2}$\n```\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_142_0.png)\n\
    \n然后调用上面所示的 `triangleArea` 函数计算其中一个三角形面的面积。\n\n## 示例 14\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Surface\
    \ Area of a Pyramid</title>\n\n<script type=\"text/javascript\">\n/* 输入：无用户输入\n\
    * 处理：计算底边为 8、高度为 7 的正金字塔三角形面的面积。\n* 输出：金字塔的表面积\n */\nfunction pyramidId() {\n\
    \  var pa = pyramidSurfaceArea(8, 7);\n  document.getElementById('outputDiv').innerHTML\
    \ = pa;\n}\n\n// 计算并返回正金字塔\n// 四个三角形面的面积，\n// 使用指定的底长和高度。\nfunction pyramidSurfaceArea(base,\
    \ height) {\n  var edge = Math.sqrt(base/2 + height*height);\n  var triArea =\
    \ triangleArea(base, edge, edge);\n  var pyramidArea = 4 * triArea;\n  return\
    \ pyramidArea;\n}\n\n// 计算并返回边长为\n// a, b, 和 c 的三角形的面积。\nfunction triangleArea(a,\
    \ b, c) {\n  var s = (a + b + c) / 2;\n  var area = Math.sqrt(s * (s-a) * (s-b)\
    \ * (s-c));\n  return area;\n}\n</script>\n</head>\n\n<body>\n<button type=\"\
    button\" onclick=\"testPyramid()\">Test</button>\n<div id=\"outputDiv\"></div>\n\
    </body>\n</html>\n```\n\n| base | height | edge | triArea | pyramidArea |\n|---|---|---|---|---|\n\
    \n| a | b | c | s | (s-a) | (s-b) | (s-c) | area |\n|---|---|---|---|---|---|---|---|\n\
    \n人工检核 (Desk Check) pa\n\n## 需要投资多久\n\n在储蓄和投资资金时，一个常见的问题是：“我需要投资多长时间的资金才能让资金增长到某个更大的金额？”例如，如果以\
    \ 6% 的固定年利率按月复利，投资 $100，需要几个月才能让我的投资增长到 $103？\n\n示例 15\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>How Long to Invest</title>\n\
    <script type=\"text/javascript\">\n/* 输入：无用户输入\n* 处理：确定将 $100 的初始投资\n* 在 6% 的年利率下增长到至少\
    \ $103 需要的月数。\n* 输出：月数。 */\nfunction testInvest() {\n  var m = determineMonths(100,\
    \ 0.06, 103);\n  document.getElementById('outputDiv').innerHTML = m;\n}\n\n//\
    \ 计算并返回在恒定年利率下\n// 增长到 target 需要的月数。\nfunction determineMonths(principal, annualRate,\
    \ target) {\n  var monthlyRate = annualRate / 12;\n  var balance = principal;\n\
