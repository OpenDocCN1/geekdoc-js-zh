    var numStudents;\nvar name;\n```\n\n# String Concatenation\n\nWithin a JavaScript\
    \ program a piece of text is called a string of text. In JavaScript you must surround\
    \ all strings of text with quotes. It doesn't matter if you use single ('') or\
    \ double (\") quotes, but you must be consistent. If you begin a string with a\
    \ single quote then you must end it with a single quote. If you begin with double\
    \ quotes, you must end it with double quotes.\n\nTo create a large string of text\
    \ from smaller strings of text you can use the string concatenation operator which\
    \ is the plus symbol (+). For example:\n\n```\nvar name = \"Samantha\";\nvar message\
    \ = \"Hello, \" + name + \". How are you today?\";\n```\n\n# Popup Windows\n\n\
    A JavaScript program can get user input by opening a popup window where a user\
