    # # Chapter 2. Algorithms and Computer Programs


    # ## Chapter Outcomes


    By the end of this chapter you will:


    +   - Read a description of a problem and write a defining table to help you better
    understand the problem.

    - Develop an algorithm for a common task.

    - Understand the basic operations that a computer can perform.

    - Learn the three basic control structures: sequence, selection, and repetition,
    and what they cause a computer to do.


    # ## Defining Table


    An **algorithm** is simply a list of steps to perform some task. A large computer
    program contains many algorithms. Before creating an algorithm to solve a problem,
    you must be sure that you understand the problem. If you don''t, you will probably
    create an algorithm that solves the wrong problem. A **defining table** is a useful
    tool to help you understand a problem before you develop an algorithm to solve
    it. A defining table has three sections: input, processing, and output. To create
    a defining table, simply draw a table with the three sections, and as you read
    and re-read the problem, put the parts of the problem into their correct section
    in the table.


    # ## Example 1


    You work for a large construction company. Your boss has asked you to write a
    computer program that will read a list of window openings for a building and output
    the total cost of all the windows. The window openings are entered in inches with
    the width first and the height second. The cost of a window is computed by multiplying
    the area of the window in square feet by $35.


    # ### Defining Table


    | Input | Processing | Output |

    | --- | --- | --- |

    | A list of window openings For each window | For each window - compute area in
    sq ft - multiply area by $35 - add cost of this window to the total cost | total
    cost of all windows |

    - width in inches | |

    - height in inches | |'
  - '[PAGE 23]


    # Example 2


    You have been asked to write a program that will read from the keyboard the radius
    of a circle and will output to the monitor the Diameter, circumference, and area
    of the circle.


    # Defining Table


    | Input | Processing | Output |

    | --- | --- | --- |

    | | | |


    # Algorithms


    An algorithm is simply a list of steps to perform some task. A recipe is an example
    of an algorithm because the recipe lists the steps necessary for preparing some
    food. Here is a recipe from allrecipes.com for making chocolate chip cookies.
    Notice the directions which are what make a recipe similar to an algorithm.


    # Ingredients


    +   - 1 cup butter, softened

    - 1 cup white sugar

    - 1 cup packed brown sugar

    - 2 eggs

    - 2 teaspoons vanilla extract

    - 3 cups all-purpose flour

    - 1 teaspoon baking soda

    - 2 teaspoons hot water

    - 1/2 teaspoon salt

    - 2 cups semisweet chocolate chips

    - 1 cup chopped walnuts


    # Directions


    +   - Preheat oven to 350 degrees F (175 degrees C).

    - Cream together the butter, white sugar, and brown sugar until smooth.

    - Beat in the eggs one at a time.

    - Stir in the vanilla.

    - Dissolve baking soda in hot water. Add to batter along with salt.

    - Stir in flour, chocolate chips, and nuts.

    - Drop by large spoonfuls onto ungreased pans.

    - Bake for about 10 minutes in the preheated oven, or until edges are nicely browned.'
- md: "\nHere is a small algorithm for computing the average test score from a list\
    \ of test scores. Notice that it is nothing more than the step-by-step process\
    \ for performing the calculation. A large computer program contains many algorithms.\n\
    \n## Example 3\n\n1. Set *sum* to 0\n2. Get the number of students\n3. For each\
    \ student\n   a. Get the student's test score\n   b. Add the student's score to\
    \ the *sum*\n4. Divide the *sum* by the number of students\n\n## Example 4\n\n\
    Write an algorithm to brush your teeth.\n\nWithin the algorithm that you wrote\
    \ is the order of the order of the steps important? Are there any steps that the\
    \ order does not matter?\n\n## Computer Programs\n\nA computer program is composed\
    \ of data and instructions. The computer stores the data temporarily in its main\
    \ memory. It also stores data more permanently in files on a hard drive, memory\
    \ stick, or compact disk. The instructions in a computer program are like the\
    \ steps in an algorithm. In a programming language like JavaScript, the instructions\
    \ are called statements. A single statement is equivalent to a single step in\
    \ an algorithm or a single sentence in a paragraph. The statements tell the computer\
    \ what to do with the data.\n\n## Computer Operations\n\nA computer has seven\
    \ basic operations that it can perform, all of which we can use when writing algorithms\
    \ in a computer program. A computer can:\n\n- Receive data (input)\n  Input devices:\
    \ keyboard, mouse, microphone, touch screen, temperature sensor, hard drive, flash\
    \ drive, etc.\n\n- Write out data (output)\n  Output devices: monitor, printer,\
    \ speakers, lights, hard drive, flash drive, etc.\n\n- Assign a value to a variable\
    \ or memory location\n\n- Perform arithmetic\n  Operators: (negation), * (multiplication),\
    \ / (division), % (modulus), + (addition), - (subtraction)\n\n- Compare two values\n\
    \  Relational operators: < (less than), <= (less than or equal), > (greater than),\
    \ >= (greater than or equal), == (equal), != (not equal)\n\n- Repeat a group of\
    \ actions\n\n- Call a function and return from that function\n\nYou will study\
    \ and use each of these basic computer operations in later chapters of this text.\n\
    \n## Control Structures\n\nThere are five different categories of **control structures**\
    \ that you can use to control the order in which a computer executes the statements\
    \ in your program. They are called control structures because they control the\
    \ *order in which* the computer executes statements also called the *flow of execution*\n\
    \n- **sequence** causes the computer to execute statements in the order they are\
    \ written in a program, from top to bottom. This is the default control structure.\n\
    \n- **selection** causes the computer to select one group of statements to execute\
    \ and another group or groups to skip. This is how a computer appears to make\
    \ decisions.\n\n- **repetition** causes the computer to repeat a group of statements.\n\
    \n- **function call** and **return** – causes the computer to execute the statements\
    \ in another function and return a result from the other to the call point.\n\
    - **try, catch**, and **throw** – are used to identify an error occurred and handle\
    \ errors.\n\nYou will study, learn, and use the first four of these control structures\
    \ in later chapters of this book. Sequence is the default control structure and\
    \ is covered in all following chapters. Selection is taught in chapters 6 and\
    \ 7. Repetition is taught in chapter 8 and again in chapter 10, and function call\
    \ is taught in chapter 9.\n\n## Chapter Summary\n\n- An algorithm is simply a\
    \ list of steps to accomplish a task.\n- Sometimes the order in which the steps\
    \ are performed is very important.\n- A defining table is a simple tool to help\
    \ a programmer understand a problem before developing an algorithm to solve the\
    \ problem. A defining table has three sections: input, processing, and output.\n\
    - A computer is capable of performing only a few basic operations:\n  - receive\
    \ input\n  - display output\n  - store data\n  - perform arithmetic\n  - compare\
    \ values\n  - repeat operations\n  - call a function\n- All high level tasks that\
    \ a computer can do, such as edit photographs, play music, and search data for\
    \ the basic operations.\n- A computer program contains both data and instructions.\
    \ In JavaScript, the instructions are called statements.\n- The three basic control\
    \ structures that a programmer uses to control the order in which a computer executes\
    \ statements are sequence, selection, and repetition.\n\n## Review Questions\n\
    \nFor each of the following write a defining table. Then write an algorithm with\
    \ numbered steps to solve the problem. Then label each step with the name of the\
    \ basic computer operation that the computer will use during that step.\n\n1.\
    \ Your company needs a program to compute the amount to charge customers for mowing\
    \ their lawns for an entire season. An employee will type in the total area of\
    \ the customer's lawn in square feet. Your company charges 10 cents per square\
    \ foot to mow a lawn one time and will mow each lawn once a week for 15 weeks.\n\
    \n2. You have been asked to write a computer program that will output an employee's\
    \ after tax pay. Your program will read from the keyboard the number of regular\
    \ hours and overtime hours that the employee worked and the employee's regular\
    \ hourly wage. The employee is paid a bonus of 1.5 times regular pay for each\
    \ overtime hour worked. Tax is 15% of the employee's gross pay.\n\n## Chapter\
    \ 3. HTML Basics\n\nHyper-text markup language (HTML) is a computer language that\
    \ is used to write documents for the world wide web of information on the internet.\
    \ There are several different versions of the HTML standard, with the most recent\
    \ being XHTML 1.1 and HTML 5. This chapter will help you learn enough HTML 5 so\
    \ that you can begin writing JavaScript code in your HTML documents.\n\n### Chapter\
    \ Outcomes\n\nBy the end of this chapter you will be able to:\n\n- Read and write\
    \ simple HTML 5 documents.\n- Use the online W3C Markup Validation Service to\
    \ validate that an HTML 5 document is well-formed.\n- Fix an HTML 5 document that\
    \ does not validate.\n- Use comments to add internal explanations to an HTML document.\n\
    \n### Starting with HTML\n\nTo start writing HTML documents you must have a decent\
    \ text editor, such as notepad++ (notepad-plus-plus.org/download), TextWrangler\
    \ (www.barebones.com/products/textwrangler), or Sublime Text (www.sublimetext.com)\
    \ and a web browser, such as Google Chrome (google.com/chrome/browser), installed\
    \ on your computer. When you use your text editor to write an HTML document and\
    \ then save the document, you must save the document with a suffix .html\n\n###\
    \ Document Type Declaration\n\nAll HTML 5 documents must begin with a document\
    \ type declaration like this: `<DOCTYPE HTML>`. It doesn't matter whether you\
    \ write this declaration in upper or lower case or a mix of the two. This declaration\
    \ tells the computer what follows is an HTML 5 document. If you forget to put\
    \ it at the top of an HTML document, your browser may recognize the document as\
    \ an older version of HTML, and the document may be drawn incorrectly by your\
    \ browser.\n\n## Comments\n\nA comment in an HTML document is a note or documentation\
    \ that a web designer writes for himself or other designers that will look at\
    \ the HTML code. Comments are ignored by the computer. A comment in HTML begins\
    \ with the symbols less than, exclamation mark, and two dashes, like this: <!--\
    \ - and ends with the symbols two dashes and greater than, like this: -->.\n\n\
    ## HTML Tags\n\nAn HTML document is composed of elements. An element is simply\
    \ a part of an HTML document. Figure 7 shows an HTML element and all of its parts.\
    \ Notice that an HTML element is composed of an opening tag, optional text, and\
    \ a closing tag. A single tag begins with an opening tag with the less symbol\
    \ (<) and ends with the greater symbol (>). For example <div class=\"note\" id=\"\
    high\"></div>. An opening tag contains a tag name and optionally some attributes.\
    \ Each attribute is composed of a name and a value separated by an equal sign\
    \ (=), such as id=\"high\". A closing tag has the same name as the opening tag,\
    \ but the name is preceded by a slash character (/).\n\nFigure 7: An HTML element\
    \ and its parts. An element is composed of an opening tag, optional text, and\
    \ a closing tag. An opening tag is composed of a tag name and optional attributes.\
    \ An attribute is composed of a name and a value.\n"
  mdcn: "\n\n这是一个用于从测试分数列表中计算平均分的小算法。请注意，它仅仅是执行计算的按部就班的过程。一个大型计算机程序包含许多算法。\n\n## 示例\
    \ 3\n\n1. 将 *sum* 设置为 0\n2. 获取学生人数\n3. 对于每个学生：\n   a. 获取学生的测试分数\n   b. 将学生的分数加到\
    \ *sum* 中\n4. 将 *sum* 除以学生人数\n\n## 示例 4\n\n编写一个刷牙的算法。\n\n在你编写的算法中，步骤的顺序是否重要吗？是否存在某些步骤的顺序并不重要？\n\
    \n## 计算机程序\n\n计算机程序由数据和指令组成。计算机将数据临时存储在它的主内存中。它还会存储在硬盘、优存盘或光盘上的文件中以更持久的方式存储数据。计算机程序中的指令就像算法中的步骤。在\
    \ JavaScript 等编程语言中，指令被称为语句（statements）。单条语句等同于算法中的一个步骤或段落中的一句话。语句告诉计算机如何处理这些数据。\n\
    \n## 计算机操作\n\n计算机可以执行七种基本操作，我们在编写计算机程序中的算法时可以使用所有这些操作。计算机可以：\n\n- 接收数据（输入）\n \
    \ 输入设备：键盘、鼠标、麦克风、触摸屏、温度传感器、硬盘、闪存盘等。\n\n- 输出数据（输出）\n  输出设备：显示器、打印机、扬声器、灯光、硬盘、闪存盘等。\n\
    \n- 给变量或内存位置赋值\n\n- 执行算术运算\n  运算符：（取反）、*（乘法）、/（除法）、%（取模）、+（加法）、-（减法）\n\n- 比较两个值\n\
    \  关系运算符：<（小于）、<=（小于等于）、>（大于）、>=（大于等于）、==（相等）、!=（不等）\n\n- 重复一组操作\n\n- 调用函数并从该函数返回\n\
    \n你将在本书的后续章节中学习并使用这些每一个基本计算机操作。\n\n## 控制结构\n\n有五类不同的**控制结构**，你可以用它们来控制计算机执行程序中语句的顺序。它们被称为控制结构，是因为它们控制了计算机执行语句的*顺序*，这也被称为*执行流*。\n\
    \n- **顺序（sequence）**导致计算机按照语句在程序中编写的顺序（从上到下）执行语句。这是默认的控制结构。\n\n- **选择（selection）**导致计算机选择一组语句执行，并跳过另一组或多组。这就是计算机看起来在做决策的方式。\n\
    \n- **重复（repetition）**导致计算机重复一组语句。\n\n- **函数调用（function call）**和**返回（return）**——导致计算机执行另一个函数中的语句并将结果从那边返回到调用点。\n\
    - **try, catch 和 throw**——用于识别发生的错误并处理错误。\n\n你将在本书的后续章节中学习、掌握并使用前四种控制结构。顺序是默认的控制结构，将涵盖后续所有章节。选择将在第\
    \ 6 和第 7 章教授。重复将在第 8 章和第 10 章再次教授，函数调用将在第 9 章教授。\n\n## 章节总结\n\n- 算法仅仅是完成任务的步骤列表。\n\
