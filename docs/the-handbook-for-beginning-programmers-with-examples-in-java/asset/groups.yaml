    # Preface


    Learning to program a computer is a frustrating task for many students. In my
    teaching experience I have found that much of this frustration comes because students
    are not shown enough programming examples. All of us learn to program a computer
    can be any different? I wrote this book with minimal text filled with computer
    programming examples and many hands on exercises to help beginning students learn
    computer programming more efficiently and thoroughly with less frustration.


    ## How to Use This Book


    You can use this book as a tutorial or a reference. When using it as a tutorial,
    you will find it helpful to step through the code line by line as if you were
    a computer. Doing this is sometimes called a desk check because you are checking
    the code on paper or "at your desk" instead of running it on a computer. To aid
    you in desk checking the example code, I have provided desk check locations throughout
    the book. Each desk check location includes a list of all the variables found
    in the corresponding example code and values for the input variables. To perform
    a desk check, step through the code as if you were the computer and change the
    value of each variable just as the computer would.


    ## Conventions


    With the text of this book the following fonts and font styles are used.


    - **Bold text** is used to highlight an important term.

    - *Italicized text* emphasizes certain words that might be missed by casual reading.

    - [Underlined text](#) indicates a hyperlink to a website.

    - Fixed width font is used to show computer code.

    - Menu font shows the words that appear in a computer menu or on a computer button.


    Chapters 5–12 include JavaScript code templates that use these fonts and symbols.


    - Fixed width font is used for JavaScript keywords that you must type exactly
    as they are shown in the template.

    - *Italicized text* is used for words that you should replace when you write code.

    - Any part of a template that is written in *gray text* is optional.

