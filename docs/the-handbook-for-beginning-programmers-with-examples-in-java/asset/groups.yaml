    \ |\n\n## 8. 重复\n\n# 编程作业\n\n- 1. 编写一个定义表和一个程序，该程序要求用户输入一个整数 $n$，然后输出 1 到 $n$\
    \ 之间的所有整数（包含边界）。\n- 2. 编写一个定义表和一个程序，该程序要求用户输入一个整数 $n$，然后输出 1 到 $n$ 之间所有奇数的之和（包含边界）。\n\
    - 3. 编写一个定义表和一个程序，按以下格式打印 1 到 12 的乘法表：\n  $5 \\times 1 = 5$\n  $5 \\times 2 =\
    \ 10$\n  $\\dots$\n  $5 \\times 12 = 60$\n- 4. 编写一个定义表和一个程序，打印从 $2^0$ 到 $2^{11}$\
    \ 的所有 2 的幂。换句话说，你的程序应该输出这个序列：1, 2, 4, 8, $\\dots$\n- 5. 编写一个定义表和一个程序，输出斐波那契数列中的前\
    \ 25 个数字：0, 1, 2, 3, 5...\n- 6. 重写第 10 题中的数字数字游戏，使其统计用户正确猜出答案所需的尝试次数。\n- 7. 编写一个定义表和一个程序，该程序要求用户输入一个整数\
    \ $n$，然后输出下表：\n\n| $n$ | $2n$ | $3n$ | $n^2$ |\n|---|---|---|---|\n| 1 | 2 | 3\
    \ | 1 |\n| 2 | 4 | 6 | 4 |\n| 3 | 6 | 9 | 9 |\n| ... | ... | ... | 27 |\n| $n$\
    \ | $2n$ | $3n$ | $n^2$ |\n- 8. 编写一个定义表和一个程序，允许用户输入十个数字，然后计算这些数字的平均值。你程序的用户界面应该类似于图\
    \ 29。你的程序必须使用循环来读取这十个数字并计算它们的和。\n- 9. 编写一个定义表和一个程序，打印一个 12x12 的乘法表。\n\n图 29：计算十个数字平均值的\
    \ HTML 文档和 JavaScript 程序。\n\n# 第 9 章 函数\n\n由于大多数实用的计算机程序都很大，计算机程序员会将程序分成不同的部分。程序的一部分被称为模块（module）。在\
    \ JavaScript 中，执行操作的最小模块是函数（function），有时称为方法（method）。JavaScript 程序中的几乎所有语句必须写在函数内部。\n\
    \n“函数”一词源于数学，是一个概念的名称，即一个值（函数的参数）完全决定另一个值（函数的结果）。考虑一个具有一个参数 $x$ 的函数 $f$：$f(x)\
    \ = 2x - 1$。我们可以用任何数字替换参数 $x$，这将完全决定函数 $f$ 的结果。例如，用 5 替换 $x$ 得到函数结果 9：$f(5) =\
    \ 2(5) - 1 = 9$。计算机程序中的函数以类似的方式工作，接收参数并产生结果。\n\n# 章目标\n\n在本章结束时，你能够：\n\n- 编写接受并使用参数的函数。\n\
    - 编写代码从函数返回值到其调用点。\n- 编写调用函数并向该函数传递参数。\n- 编写代码将函数的返回值存储在变量中。\n- 区分参数（parameter）和实（argument）。\n\
    - 区分为用户显示输出和返回供程序使用的值。\n- 理解局部变量的作用域。\n\n# 编写函数\n\n在 JavaScript 中编写函数，只需输入匹配此模板的代码。\n\
    \n# 模板\n\n```javascript\nfunction functionName(param1, param2, ... paramN) {\n\
    \  statements;\n  return value;\n}\n```\n\n函数的第一行被称为头部（header）或签名（signature），它包含了\n\
    \n1. 关键字 function\n2. 函数名\n3. 参数列表\n\n函数名必须以字母、下划线（_）或美元符号（$）开头。其余部分由字母、数字（0-9）、下划线或美元符号组成。函数名不能包含空格。它应该是一个能简洁描述函数功能的意义名称。参数列表包含了函数完成任务所需的变量数据。\n\
    \n函数内部的语句被称为函数体（body）。函数可以包含你想要的任何数量的语句。然而，将函数限制在页（60 行）以内是一个好习惯。为了让程序的其他地方可以使用函数的返回值，只需输入关键字。\n\
    \n# 示例 1\n\n编写一个名为 drawCircle 的函数头部，它接受三个参数：圆心的 x 和 y 值以及半径。\n\n```javascript\n\
    function drawCircle(centerX, centerY, radius)\n```\n\n# 示例 2\n\n编写一个名为 getDiscountRate\
    \ 的函数头部，返回应用于保费的折扣率。该函数需要两个参数：学生的生日和 GPA。换句话说，保险公司有什么规则？\n\n# 示例 3\n\n编写一个函数（头部和体），计算并返回三个数字的平均值。\n\
    \n```javascript\n// 计算并返回三个数字的平均值。\nfunction average(a, b, c) {\n  var sum = a\
    \ + b + c;\n  var avg = sum / 3;\n  return avg;\n}\n```\n\n# 示例 4\n\n编写一个接受两个参数并计算此方程值的函数：$f(a,r)\
    \ = a \\times (1 + r)$。\n\n# 示例 5\n\n编写代码调用具有以下头部的函数：\nfunction drawCircle(centerX,\
    \ centerY, radius)\n\n```javascript\nfunction run() {\n  var x = parseInt(document.getElementById('xInputBox').value);\n\
    \  var y = parseInt(document.getElementById('yInputBox').value);\n  var radius\
    \ = parseInt(document.getElementById('radiusInputBox').value);\n  drawCircle(x,\
    \ y, radius);\n}\n```\n\n# 示例 6\n\n编写代码调用具有以下头部的函数：\nfunction drawRectangle(x,\
    \ y, width, height)\n\n"
