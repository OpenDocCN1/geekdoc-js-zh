    \ - $99,999.99 | $2,500 + 10% (cost – $50,000) |\n| $100,000 - $199,999.99 | $7,500\
    \ + 20% (cost – $100,000) |\n| $200,000 - $299,999 | $27,500 + 25% (cost – $200,000)\
    \ |\nFor example a house that costs $126,000 would have a down payment of $12,880.\
    \ Write a defining table and a program that gets the cost of house from a user\
    \ and calculates and outputs the down payment based on Bank's schedule.\n\n- 4.\
    \ Write a defining table and a program to quiz children on simple arithmetic.\
