    \ means a single core on a CPU is designed to complete 2.5 billion instructions\
    \ per second. Each core performs calculations independently of the other cores.\
    \ A quad core CPU with a clock speed of 2.5 gigahertz is designed to complete\
    \ 10 billion (4 * 2.5 gigahertz) instructions per second. This is very fast.\n\
    \n## Classes of Computers\n\nComputers can be classified according to their size\
    \ and primary purpose. Here are some common computer classes.\n\n- 31. micro or\
    \ personal computer – a computer designed to be used by only one person at a time,\
    \ such as a smartphone, tablet computer, laptop computer, or desktop computer.\n\
    \n- 32. workstation – a powerful computer designed to be used by one person at\
    \ a time and used to perform engineering, scientific, and medical tasks such as\
    \ designing airplane parts or modeling biological processes.\n\n- 33. mainframe\
    \ – a very powerful computer designed to be used by many people at the same time\
    \ to perform business or scientific tasks.\n\n## Categories of Software\n\nComputer\
    \ hardware is really just a bunch of metal that electricity can flow through well-defined\
    \ paths. Computer hardware will not do anything without some instructions. The\
    \ instructions are written by a computer programmer and are called software. Computer\
    \ software is simply a list of instructions that the computer hardware executes.\
    \ Computer software can be classified according to its purpose.\n\n- 34. Application\
    \ – computer software that someone uses to accomplish a specific task, such as\
    \ write a letter, balance an account, watch a movie, or play a game. Examples\
    \ of applications include Microsoft Word and Excel, Google Chrome, and iTunes.\n\
    \n- 35. Operating system – computer software that manages the hardware and isolates\
    \ the applications from the hardware so that the applications do not have to interact\
    \ directly with the hardware. Examples of computer operating systems include Microsoft\
    \ Windows, Mac OS X, VMS, Linux, HP-UX, and Solaris.\n\n## Character Data\n\n\
    Everything in a computer's memory is stored as a number or set of numbers. Pictures,\
    \ songs, text, instructions, everything. Each text symbol is stored in the computer's\
    \ memory as a number.\n\n- 36. ASCII – an acronym for American Standard Code for\
    \ Information Interchange; a coding system (essentially a table) with 128 rows\
    \ that assigns a number to each English letter and common punctuation symbol.\
    \ See asitabable.com\n\n- 37. Unicode – a very large coding system that includes\
    \ ASCII and assigns a number to symbols from many languages, such as English,\
    \ Portuguese, Greek, Hebrew, Arabic, and Tagalog. See unicode.org\n\n## Execution\
    \ Example\n\nTo help you understand how the parts of a computer work together,\
    \ consider what happens when a user double clicks on a Microsoft Word document\
    \ file (a file with a filename suffix of .docx).\n\n- 1. The operating system\
    \ commands the hard drive to copy the Microsoft Word Application (MS Word) into\
    \ main memory.\n2. The hard drive copies MS Word over a bus into main memory.\n\
    3. After MS Word is in main memory, the operating system executes MS Word and\
    \ sends a command to MS Word telling it to open the document that the user clicked\
    \ on.\n4. MS Word requests the operating system to read the document from the\
    \ hard drive and place it in main memory.\n5. The operating system commands the\
    \ hard drive to copy the document file into main memory.\n6. The hard drive copies\
    \ the document file over a bus into main memory.\n7. For each character that is\
    \ in the document\n   a. MS Word reads the character's Unicode number from main\
    \ memory and requests the operating system to draw that character in a window.\n\
    \   b. The operating system, finds the Unicode number and its corresponding symbol\
    \ in a table and draws the symbol.\n\n## Review Questions\n\n- 1. Which of the\
    \ following computer components primarily stores data? (Mark all that apply.)\n\
    a. power supply\nb. keyboard\nc. motherboard\nd. bus\ne. CPU\nf. cache\ng. main\
    \ memory\nh. hard drive\ni. DVD drive\nj. thumb drive\nk. monitor\n\n- 2. Match\
    \ each of the following types of computer memory with the physical quantity that\
    \ each manipulates to store data.\na. cache i. light\nb. main memory ii. magnetization\n\
    c. flash memory iii. electric charge\nd. hard drive\ne. DVD drive\n\n- 3. Computer\
    \ memory that is volatile has electricity in order to store data. When electricity\
    \ is turned off, volatile memory loses its data. Non-volatile memory stores data\
    \ after electricity is turned off. Which of the following computer memory devices\
    \ are volatile? (Mark all that apply.)\na. cache\nb. main memory\nc. flash memory\n\
    d. hard drive\ne. DVD\n\n- 4. Match each term to its corresponding size in bytes.\n\
    a. kilobyte 1,125,899,906,842,624 bytes\nb. megabyte 1024 bytes\nc. gigabyte 1,099,511,627,776\
    \ bytes\nd. terabyte 1,073,741,824 bytes\ne. petabyte 1,048,576 bytes\nf. exabyte\
    \ 1,152,921,504,606,846,976 bytes\n\n- 5. Assume the average movie uses 3 gigabytes\
    \ of space on a hard drive. Which of these is the smallest size that can store\
    \ 200 average size movies?\n   a. 500 megabytes\n   b. 500 gigabytes\n   c. 1\
    \ terabyte\n   d. 1 petabyte\n\n- 6. Consider a quad core CPU with a clock speed\
    \ of 2.8 gigahertz. In theory, how many instructions per second is it able to\
    \ complete?\n   a. 2.8 million\n   b. 2.8 billion\n   c. 11.2 billion\n   d. 20\
    \ billion\n\n- 7. If you wanted to type a letter in Hebrew, which character coding\
    \ system would your computer need to use to store your letter?\n   a. ASCII\n\
    \   b. Unicode\n\n- 8. Which character coding system includes English letters?\
    \ (Mark all that apply.)\n   a. ASCII\n   b. Unicode\n\n## Chapter 2. Algorithms\
    \ and Computer Programs\n\n### Chapter Outcomes\n\nBy the end of this chapter\
    \ you will:\n\n- Read a description of a problem and write a defining table to\
    \ help you better understand the problem.\n- Develop an algorithm for a common\
    \ task.\n- Understand the basic operations that a computer can perform.\n- Learn\
    \ the three basic control structures: sequence, selection, and repetition, and\
    \ what they cause a computer to do.\n\n### Defining Table\n\nAn **algorithm**\
    \ is simply a list of steps to perform some task. A large computer program contains\
    \ many algorithms. Before creating an algorithm to solve a problem, you must be\
    \ sure that you understand the problem. If you don't, you will probably create\
    \ an algorithm that solves the wrong problem. A **defining table** is a useful\
    \ tool to help you understand a problem before you develop an algorithm to solve\
    \ it. A defining table has three sections: input, processing, and output. To create\
    \ a defining table, simply draw a table with the three sections, and as you read\
    \ and re-read the problem, put the parts of the problem into their correct section\
    \ in the table.\n\n### Example 1\n\nYou work for a large construction company.\
    \ Your boss has asked you to write a computer program that will read a list of\
    \ window openings for a building and output the total cost of all the windows.\
    \ The window openings are entered in inches with the width first and the height\
    \ second. The cost of a window is computed by multiplying the area in feet by\
    \ $35.\n\n### Defining Table\n\n| Input | Processing | Output |\n| --- | --- |\
    \ --- |\n| A list of window openings | For each window - compute area in sq ft\
    \ - multiply area by $35 - add cost of this window to the total | total cost of\
    \ all windows |\n- width in inches | | |\n- height in inches | | |\n\n### Example\
    \ 2\n\nYou have been asked to write a program that will read from the keyboard\
    \ the radius of a circle and will output to the monitor the Diameter, circumference,\
    \ and area of the circle.\n\n### Defining Table\n\n| Input | Processing | Output\
    \ |\n| --- | --- | --- |\n| | | |\n\n### Algorithms\n\nAn algorithm is simply\
    \ a list of steps to perform some task. A recipe is an example of an algorithm\
    \ because the recipe lists the steps necessary for preparing some food. Here is\
    \ a recipe from allrecipes.com for making chocolate chip cookies. Notice the directions\
    \ which are what make a recipe similar to an algorithm.\n\n#### Ingredients\n\n\
    - 1 cup butter, softened\n- 1 cup white sugar\n- 1 cup packed brown sugar\n- 2\
    \ eggs\n- 2 teaspoons vanilla extract\n- 3 cups all-purpose flour\n- 1 teaspoon\
    \ baking soda\n- 2 teaspoons hot water\n- 1/2 teaspoon salt\n- 2 cups semisweet\
    \ chocolate chips\n- 1 cup chopped walnuts\n\n#### Directions\n\n- Preheat oven\
    \ to 350 degrees F (175 degrees C).\n- Cream together the butter, white sugar,\
    \ and brown sugar until smooth.\n- Beat in the eggs one at a time.\n- Stir in\
    \ the vanilla.\n- Dissolve baking soda in hot water. Add to batter along with\
    \ salt.\n- Stir in flour, chocolate chips, and nuts.\n- Drop by large spoonfuls\
    \ onto ungreased pans.\n- Bake for about 10 minutes in the preheated oven, or\
    \ until edges are nicely browned.\n"
  mdcn: "\n许多现代计算机的时频达到 2.5 吉赫兹或更高，这意味着 CPU 的单个核心设计为每秒完成 25 亿条指令。每个核心都独立于其他核心执行计算。主频为\
    \ 2.5 吉赫兹的四核 CPU 设计为每秒完成 100 亿条（4 * 2.5 GHz）指令。这非常快。\n\n## 计算机的分类\n\n计算机可以根据尺寸和主要用途进行分类。以下是一些常见的计算机类型。\n\
    \n- 31. 微型计算机或个人电脑 – 一种设计为一次一人使用的计算机，例如智能手机、平板电脑、笔记本电脑或台式电脑。\n\n- 32. 工作站 – 一种强大的计算机，设计供一人使用，用于执行工程、科学和医学任务，例如设计飞机零件或对生物过程建模。\n\
    \n- 33. 主机 – 一种非常强大的计算机，设计供许多人同时使用执行业务或科学任务。\n\n## 软件分类\n\n计算机硬件实际上只是一堆电流可以通过定义路径流过的金属。如果没有某些指令，计算机硬件将什么都不做。这些指令由计算机程序员编写，被称为软件。计算机软件仅仅是计算机硬件执行的指令列表。计算机软件可以根据其用途分类。\n\
    \n- 34. 应用程序 – 用于完成特定任务的计算机软件，例如写信、结算账户、看电影或玩游戏。应用程序示例包括 Microsoft Word 和 Excel、Google\
    \ Chrome 和 iTunes。\n\n- 35. 操作系统 – 管理硬件并将应用程序与硬件隔离的计算机软件，以便应用程序不需要直接与硬件交互。计算机操作系统的示例包括\
    \ Microsoft Windows、Mac OS X、VMS、Linux、HP-UX 和 Solaris。\n\n## 字符数据\n\n计算机内存中的一切内容都存储为一个数字或一组数字。图片、歌曲、文本、指令，一切。每个文本符号都以数字的形式存储在计算机内存中。\n\
    \n- 36. ASCII – 美国信息交换标准代码的缩写；一种具有 128 行的编码系统（本质上是一个表格），为每个英语字母和常用标点符号分配一个数字。参见\
    \ asitabable.com\n\n- 37. Unicode – 一种非常大的编码系统，包含了 ASCII 并为许多语言的符号分配数字，例如英语、葡萄牙语、希腊语、希伯来语、阿拉伯语和菲律宾语。参见\
    \ unicode.org\n\n## 执行示例\n\n为了帮助你理解计算机各个部分是如何工作的，请考虑当用户双击 Microsoft Word 文档（后缀名为\
    \ .docx 的文件）时发生了什么。\n\n- 1. 操作系统命令硬盘将 Microsoft Word 应用程序 (MS Word)拷贝到主内存。\n2.\
    \ 硬盘通过总线将 MS Word 复制到主内存。\n3. MS Word 进入主内存后，操作系统执行 MS Word 并向 MS Word 发送命令，告诉它打开用户点击的文档。\n\
    4. MS Word 请求操作系统从硬盘读取文档并将其放入主内存。\n5. 操作系统命令硬盘将文档文件复制到主内存。\n6. 硬盘通过总线将文档文件复制到主内存。\n\
    7. 对于文档中的每个字符\n   a. MS Word 从主内存读取该字符的 Unicode 编号，并请求操作系统在窗口中绘制该字符。\n   b. 操作系统在表中找到该\
    \ Unicode 编号及其对应的符号，并绘制该符号。\n\n## 复习习题\n\n- 1. 下列哪些计算机组件主要存储数据？（选出所有适用。）\na. 电源\n\
    b. 键盘\nc. 主板\nd. 总线\ne. CPU\nf. 缓存\ng. 主内存\nh. 硬盘\ni. DVD 驱动器\nj. U 盘\nk. 显示器\n\
    \n- 2. 将下列每种计算机内存与其其存储数据时操作的物理量进行匹配。\na. 缓存 i. 光\nb. 主内存 ii. 磁化\nc. 闪存 iii. 电荷\n\
    d. 硬盘\ne. DVD 驱动器\n\n- 3. 易失性内存需要电来存储数据。断电时，易失性内存会丢失数据。非易失性内存在断电后仍存储数据。下列哪些内存设备是易失性的？（选出所有适用。）\n\
    a. 缓存\nb. 主内存\nc. 闪存\nd. 硬盘\ne. DVD\n\n- 4. 将每个术语与其对应的字节（bytes）大小匹配。\na. 千字节 1,125,899,906,842,624\
    \ 字节\nb. 兆字节 1024 字节\nc. 吉字节 1,099,511,627,776 字节\nd. 太字节 1,073,741,824 字节\ne.\
    \ 拍字节 1,048,576 字节\nf. 艾字节 1,152,921,504,606,846,976 字节\n\n- 5. 假设平均部电影在硬盘上占用\
    \ 3 吉字节空间。这些中哪种是存储 200 部平均大小电影的最小尺寸？\n   a. 500 兆字节\n   b. 500 吉字节\n   c. 1 太字节\n\
    \   d. 1 拍字节\n\n- 6. 考虑一个主频为 2.8 吉赫兹的四核 CPU。理论上，它每秒能够完成多少指令？\n   a. 500\n   b.\
    \ 2.8 亿\n   c. 11.2 亿\n   d. 20 亿\n\n- 7. 如果你想输入希伯来语，需要使用哪种编码系统？\n   a. ASCII\n\
    \   b. Unicode\n\n- 8. 下列哪些编码系统包含英语？（选出所有适用。）\n   a. ASCII\n   b. Unicode\n\n\
    ## 第 2 章 算法与程序\n\n### 章节目标\n\n在本章结束时，你将：\n\n- 阅读问题的描述并帮助你理解问题。\n- 开发一个解决任务的算法。\n\
    - 理解计算机执行的基本操作。\n- 学习基本的控制结构：顺序、选择和循环。\n\n### 定义表\n\n**算法**仅仅是执行某些任务的步骤列表。计算机程序包含许多算法。在创建解决问题的算法之前，你必须理解该问题。**定义表**是帮助你理解问题的有用工具。定义表有三个部分：输入、处理和输出。为了创建定义表，只需将问题的部分放入正确的章节中。\n\
    \n### 示例 1\n\n你在一家大型建筑公司工作。你的老板要求你写一个程序，读取窗口列表并输出总成本。窗口开口是以英寸为单位录的，先输入宽度，后输入高度。窗口的成本通过将面积乘以\
    \ 35 美元计算得出。\n\n### 定义表\n\n| 输入 | 处理 | 输出 |\n| --- | --- | --- |\n| 窗口列表 | 对于每个窗口\
    \ - 计算面积 - 乘以 35 - 将成本加到总和中 | 所有窗口的总成本 |\n- 宽度（英寸） | | |\n- 高度（英寸） | | |\n\n###\
    \ 示例 2\n\n你被要求写一个程序，从键盘读取圆的半径，并在显示器上输出直径、周令和面积。\n\n### 定义表\n\n| 输入 | 处理 | 输出 |\n\
    | --- | --- | --- |\n| | | |\n\n### 算法\n\n算法是步骤的列表。食谱是算法的一个示例，因为它列出了准备食物所需的步骤。这里有一份来自\
    \ allrecipes.com 的巧克力奇干食谱。注意这些食谱与算法相似之处。\n\n#### 配料\n\n- 1 杯黄油，软化\n- 1 杯 白糖\n\
    - 1 杯 紧实的红糖\n- 2 个鸡蛋\n- 2 茶匙 香草精\n- 3 杯 通用面粉\n- 1 茶匙 小苏打\n- 2 茶匙 热水\n- 1/2 茶匙盐\n\
    - 2 杯 半甜巧克力块\n- 1 杯 碎核桃\n\n#### 步骤\n\n- 预热烤箱至 350 度华氏（175 度摄氏）。\n- 将黄油、白糖和红糖混合至光滑。\n\
    - 逐个加入鸡蛋。\n- 加入香草精。\n- 将小苏打溶于热水。与盐一同加入糊中。\n- 加入面粉、巧克力块和核桃。\n- 用大勺盛放在未涂油的盘子上。\n\
    - 在预热烤箱中烘烤约 10 分钟，直到边缘呈金黄色即可。\n"
