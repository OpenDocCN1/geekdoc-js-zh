    To run the program in example 1, simply type all the code shown in example 1 (or
    copy and paste the code if you are reading this as an e-book) into a text editor.
    Don''t type or copy the line numbers. Save the file with the suffix of .html,
    load the file in a browser, and click the Message button.


    # Running a Program


    The computer runs or executes JavaScript code when certain events happen. These
    events include when an HTML document is loaded, when a user clicks a button, or
    even when a user moves the mouse. For example, the function in example 1 is executed
    when a user clicks the Message button.


    ![](img/ef8ee93db95f659f7e069b8fe140b87b_42_0.png)


    Example 11: A popup window that was opened by the Firefox browser because a user
    clicked the Message button.


    # Comments


    A comment in a JavaScript program is a note or documentation that a programmer
    writes for himself or other programmers who will look at his code. Comments are
    ignored by the computer. There are two styles of comments in JavaScript: single
    line and inline. A single line comment begins with two forward slashes (//), and
    ends at the end of the line of text. A multi-line comment begins with a forward
    slash and an asterisk (*), and ends with an asterisk and a forward slash (*).
    When writing a multi-line, programmers start each line with an asterisk to make
    the comment stand out from the other code. Both styles of comments are shown in
    example 1, multi-line at lines 7–11 and single line at lines 13–15.


    # Statements


    A JavaScript program is composed of statements. A statement is a complete statement
    within a program. Statements in JavaScript end with a semicolon (;). Notice in
    command that the statement at line 16 ends with a semicolon. When writing a program,
    a programmer will often group statements together in a block by surrounding them
    with curly braces: { }.


