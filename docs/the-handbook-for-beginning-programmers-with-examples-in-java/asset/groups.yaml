  - "[PAGE 144]\n\n# How Long to Invest\n\nA common question when saving and investing\
    \ money is “How long will I need to invest a certain amount of money in order\
    \ for money to grow to a certain larger amount of money?” For example, how many\
    \ months will I need to invest $100 at 6% fixed annual growth rate compounded\
    \ monthly in order for my investment to grow to $103?\n\nExample 15 HTML>\n\n\
    ```\n<!DOCTYPE>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>How\
    \ Long to Invest</title>\n<script type=\"text/javascript\">\n/* Input: No user\
    \ input\n * Processing: Determine the number of months required to grow an initial\n\
    \ * investment of $100 to at least $103 if it grows at an annual rate of 6%.\n\
    \ * Output: The number of months. */\nfunction testInvest() {\n  var m = determineMonths(100,\
    \ 0.06, 103);\n  document.getElementById('outputDiv').innerHTML = m;\n\n  // Computes\
    \ and returns the number of months needed for principal\n  // at a constant annual\
    \ rate to grow to a target amount.\n  function determineMonths(principal, annualRate,\
    \ target) {\n  var monthlyRate = annualRate / 12;\n  var balance = principal;\n\
    \  var month = 0;\n\n  // Repeat while the balance of the investment is less than\
    \ the target.\n  while (balance < target) {\n  var interest = Math.round(balance\
    \ * monthlyRate * 100) / 100;\n  balance += interest;\n  month++;\n  }\n  return\
    \ month;\n}\n</script>\n</head>\n```\n\n| principal | annualRate | interest |\
    \ balance | month |\n|---|---|---|---||\n| | | | | |\n| | | | | |\n| | | | | |\n\
    \n9. Functions\n\n133"
  - "[PAGE 145]\n\n```\n<body>\n<button type=\"button\" onclick=\"testInvest()\">Test</button>\n\
    <div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\n# # Greatest Common Divisor\n\
    \nThe greatest common divisor (gcd) of two non-zero integers is the largest positive\
    \ integer that divides both numbers without a remainder. An efficient algorithm\
    \ to compute the gcd was discovered by Euclid and works like this. Given two integers,\
    \ 102 and 18,\n\n+   1. divide 102 by 18 to get a quotient of 5 and a remainder\
    \ of 12,\n2. divide 18 by 12 to get a quotient of 1 and a remainder of 6,\n3.\
    \ divide 12 by 6 to get a quotient of 2 and a remainder of 0\n4. the remainder\
    \ 0 means the greatest common divisor of 102 and 18 is 6.\n\nEuclid's algorithm\
    \ is written on the next page inside a JavaScript function that has this header:\
    \ function gcd(a, b). Notice from its header that the gcd function requires two\
    \ values as parameters. To call this function a programmer must write the name\
    \ of the function, gcd, followed by an argument list with the two arguments to\
    \ match the two parameters, as shown in the testGCD function below.\n\n# # Example\
    \ 16\n\n```\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>Greatest Common Divisor</title>\n<script type=\"text/javascript\"\
    >\n/* Input: User input\n* Processing: Determine the greatest common divisor of\
    \ -24 and 472\n* Output: The greatest common divisor\n*/\nfunction testGCD() {\n\
    \  var x = -24;\n  var y = 472;\n  var divisor = gcd(x, y);\n  document.getElementById('outputDiv').innerHTML\
    \ = divisor;\n}\n```\n\n| x | y | divisor |\n|---|---|---|"
  - "[PAGE 146]\n\n```\n// Finds and returns the greatest common\n// divisor of two\
    \ integers a and b.\nfunction gcd(a, b) {\n  // Ensure a and b are not negative.\n\
    \  a = Math.abs(a);\n  b = Math.abs(b);\n\n  // Ensure a is greater than or equal\
    \ to b.\n  if (a < b) {\n    var swap = a;\n    a = b;\n    b = swap;\n  }\n\n\
    \  // Loop until the greatest\n// common divisor is found.\n  do {\n    var r\
    \ = a % b;\n    a = b;\n    b = r;\n  } while (b != 0);\n\n  return a;\n}\n</script>\n\
    </head>\n\n<body>\n<button type=\"button\" onclick=\"testGCD()\">Test</button>\n\
    <div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\n| r | a | b | swap |\n\
    |---|---|---|---|\n| | | | |\n| | | | |\n| | | | |"
