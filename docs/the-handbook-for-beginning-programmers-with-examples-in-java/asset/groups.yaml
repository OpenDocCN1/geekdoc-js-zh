- md: "\n## Round to Decimal Places\n\nThe built-in JavaScript Math object has a function\
    \ to round a real number to an integer. However, a programmer will occasionally\
    \ need to write a program that rounds fractional numbers to a fixed number of\
    \ places after the decimal point. For example, U.S. currency amounts are usually\
    \ rounded to two decimal places (pennies). Here is code that uses the built in\
    \ Math.pow and Math.round functions to round the value in a variable dist to two\
    \ decimal places.\n\n## Example 25\n\n```javascript\n<script type=\"text/javascript\"\
    >\n/* Input: x and y for two points: x1, y1, x2, y2\n * Processing:\n * 1. Calculate\
    \ the distance between the two points.\n * 2. Round the distance to two digits\
    \ after the decimal.\n * Output: the rounded distance\n*/\nfunction distance()\
    \ {\n  // Get the coordinates for two points from the user.\n  var x1 = parseFloat(document.getElementById('x1InputBox').value);\n\
    \  var y1 = parseFloat(document.getElementById('x2InputBox').value);\n  var x2\
    \ = parseFloat(document.getElementById('y1InputBox').value);\n  var y2 = parseFloat(document.getElementById('y2InputBox').value);\n\
    \n  // Compute the distance between the two points.\n  var dx = x2 - x1;\n  var\
    \ dy = y2 - y1;\n  var dist = Math.sqrt(dx * dx + dy * dy);\n\n  // Round the\
    \ distance to two digits after the decimal.\n  var digits = 2;\n  var multiplier\
    \ = Math.pow(10, digits);\n  dist = Math.round(dist * multiplier) / multiplier;\n\
    \n  // Display the distance to the user.\n  document.getElementById('outputDiv').innerHTML\
