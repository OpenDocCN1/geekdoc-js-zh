    # Chapter 5. Variables and Arithmetic


    A computer program is composed of data and instructions. The data may be temporarily
    stored in the computer''s memory, or it may be stored more permanently on the
    computer''s hard drive or on a CD or tape. When data is in the computer''s memory,
    it is stored inside variables. A variable has a name, type, value, and scope.
    The term variable comes from the fact that a variable''s value can be changed
    or varied.


    # Chapter Outcomes


    - Declare a variable and assign a value to that variable.

    - Write JavaScript code to copy the value from one variable to another variable.

    - Write code to perform calculations and store the result in a variable.

    - Use the increment and decrement operators in an arithmetic expression.

    - Use the mathematical functions in the Math object.


    # Declaring a Variable


    Before you can use a variable in a computer program, you must declare variable
    which tells the computer to reserve space in main memory for that variable. To
    declare a variable in a JavaScript program, simply write the keyword var and the
    variable''s name. A variable name must start with an uppercase or lowercase letter,
    the underscore (_), or the dollar sign ($). The rest of the name must be made
    of letters, digits (0-9), the underscore, or the dollar sign. A variable name
    cannot include spaces. It should be a meaningful name that clearly describes what
    it stores. A computer programmer uses a variable''s name in a program as a representation
    of the variable''s value. This is similar to how a variable is used in an algebraic
    equation.


    # Template


    ```

    var name, name2, name3;

    ```


    # Example 1


    Declare three variables named x, balance, and interest.


    ```

    var x;

    var balance, interest;

    ```


    # Example 2


    Declare two variables named roomNumber and occupants.


    # Variable Types


    Each variable has a type so that the computer knows what kind of data can be stored
    in the variable and what operations the computer may perform on the variable.
    A variable''s type is determined by the data that is stored in the variable. A
    variable in a JavaScript program may have any one of these types.


    # JavaScript Variable Types


    | Type | Purpose | Example |

    |---|---|---|

    | boolean | stores true or false | true |

    | number | a number with or without a decimal point | 74.3 |

    | string | a string of text | "San Diego" |

    | function | a part of a program created using the keyword function | function
    () { return 27; } |

    | object | an object such as an Array or Date | {name:"Sam", phone:"1788"} |


    # Assigning a Value to a Variable


    A programmer may assign a value to a variable at any point in a JavaScript program
    by using the assignment operator which is simply the equal symbol (=). The assignment
    operator works from right to left, copying the value that is on the right side
    of the equal symbol and storing it into the variable or location that is on the
    left side of the equal symbol.


    # Template


    ```

    name = value;

    ```


    # Example 3


    Declare three variables named price, discRate, and title. Assign 12.95 and 0.25
    to the first two variables and the text “A Poor Wayfaring Man of Grief” to the
    third variable.


    ```

    var price, discRate;

    var title;


    price = 12.95;

    discRate = 0.25;

    title = "A Poor Wayfaring Man of Grief";

    ```


    Note that to store text in a variable, you must put quotes (either double or single)
    around the text, for example:


    ```

    title = "A Poor Wayfaring Man of Grief";

    ```


    In JavaScript the default value for all variables is undefined. If a programmer
    does not use the equal symbol (=) to assign a value to a variable, the value of
    that variable will be undefined, 0 not null, but literally the value undefined.
    Obviously, undefined is not a number and cannot be successfully used as part of
    a calculation. To help ensure that all variables have a value other than undefined,
    the JavaScript language allows a programmer to assign a value to a variable when
    it is declared. This is sometimes called initializing a variable, and many programmers
    like it because it saves the programmer from writing an extra line of code.


    # Template


    ```

    var name = value, name2 = value2, name3 = value3...

    ```


    # Example 4


    Declare a variable named price and assign the number 12.95 to it. Also declare
    a variable named title and assign the text “A Poor Wayfaring Man of Grief” to
    it.


    ```

    var price = 12.95;

    var title = "A Poor Wayfaring Man of Grief";

    ```


    # Example 5


    Declare a variable named occupants and assign the value 3 to it.


    # Desk Checks


    While reading the rest of this book, you will find it helpful to step through
    the example code line by line as if you were a computer. Doing this is sometimes
    called a desk check because you are checking the code on paper or "at your desk"
    instead of running it on a computer. To perform a desk check, draw a table that
    represents part of the computer''s main memory. Step through the given code line
    by line as if you were the computer and change the value of each variable just
    as the computer would. For example if you were given the following code:


    ```

    1 var x = 7;

    2 var y = -3;

    3 var a = x;

    4 y = 4;

    ```


    You would draw a table like this to represent part of the computer''s main memory.


    Notice that the first line of the code changes the value of the variable x to
    7, in the table 7 is written underneath "x". The second line of code changes y
    to 3, so 3 is written underneath "y". The third line of code copies the value
    of x into a, so 7 is underneath "a". Finally, the last line of code changes the
    value of y to 4, so -3 is crossed out and 4 is written below "y".


    Technically, writing one value another as shown in the desk check table for y
    does not accurately model the way a computer stores a value in a variable. When
    a new value is assigned to a variable, the old value is replaced by the new value.
    To accurately model this in a desk check, we would erase the old value and replace
    it with the new value. However, to understand how code works, it is often helpful
    to see a history of the values that a variable has held over time, so when you
    complete the desk checks, you should cross through an old value and write a new
    value below the old one.


    Sometimes example code requires input from the user or somewhere else. This input
    is given in the desk check table. For example, the code:


    ```

    var y = x;

    ```


    requires that the variable x already has a value. This value will be given in
    the desk check table:


    | x | y | a |

    |---|---|---|

    | 15 | -3 | 7 |

    | | 4 | |


    # Swapping Values


    If a program needs to exchange the value of one variable with another variable,
    or in other words swap their values, a common and easy way to do this is to use
    a temporary variable. The example code below uses a temporary variable named *swap*
    to exchange exchange the values of two variables, *a* and *b*. Desk check this
    code. To perform a **desk check**, step through the example code line by line
    if you are a computer and check the value for each variable in the empty boxes.
    A missing box is a hint that means there is no value for you to write in that
    spot.


    # Example 6


    # Desk Check


    ```

    var swap = a;

    a = b;

    b = swap;

    ```


    | a | b | swap |

    |---|---|---|

    | 8 | -3 | |


    # Arithmetic Expressions


    The word computer comes from the ability these machines have to compute values
    or in other words to perform arithmetic. A programmer tells the computer to perform
    arithmetic by writing arithmetic expressions. An **arithmetic expression** is
    composed of **operands** (numbers and variables) and **operators** (addition,
    multiplication, etc.).


    Arithmetic in JavaScript is written differently than it is written in algebra.
    For example in algebra, 3x means to multiply 3 times x. However, typing 3x in
    a JavaScript program will not cause the computer to multiply. Instead it will
    simply cause an error. If you want multiplication in JavaScript, you must use
    the multiplication operator (*) like this:


    3 * x.


    # Arithmetic Operators


    There are five basic arithmetic operations that a computer can perform: multiplication,
    division, modulus, addition, and subtraction. As explained earlier in this chapter,
    a computer can also assign a value to a variable. A programmer makes the computer
    perform these arithmetic operations by writing the corresponding operator (symbol)
    in a program. Here are the arithmetic operators available in JavaScript.


    # JavaScript Arithmetic Operators


    | Operator | Name | Algebraic Expression | JavaScript Expression |

    | --- |---|---|---|

    | * | multiplication | v · y or v × t | v * t |

    | / | division | x ÷ y or x / y | x / y |

    | % | modulus | r mod s | r % s |

    | + | addition | p + q | p + q |

    | - | subtraction | f - 3 | f - 3 |

    | = | assignment | s = t | s = t |


    # Modulus


    The modulus operator is sometimes called the remainder operator because it returns
    the remainder after division. However, its correct name is the modulus operator
    because it returns the signed remainder after division which means the remainder
    can be positive or negative. In JavaScript, the sign of a modulus result depends
    only on the sign of the dividend (operand on the left of the %).


    # Examples


    ```

    7 % 3 = 1

    12 % 3 = 0

    6 % 4 = 2

    6 % -4 = 2

    -6 % -4 = -2

    ```


