    \ is connected using else, the computer evaluates the conditions one at a time\
    \ until they evaluate true. The computer executes the statements inside the first\
    \ if that evaluates true and skips all other statements. If none of the conditions\
    \ evaluates true, the computer executes the statements in the last clause only.\
    \ The last else clause is optional as all the else clauses.\n\n# Example 3\n\n\
    ```\nvar discount;\nif (cost < 100) {\n    discount = 0.10;\n} else if (cost <\
