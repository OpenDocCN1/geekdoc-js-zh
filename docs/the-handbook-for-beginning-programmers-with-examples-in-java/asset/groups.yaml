    | 天气 | 鞋子 |\n|---|---|\n| 热 | 凉鞋 |\n| 雨 | 雨靴 |\n| 雪 | 靴子 |\n\n- 3. 写一个程序，根据用户输入的房价计算贷款。方案如下：\n\
    | 房屋价格 | 首付 |\n|---|---|\n| 0 - 49,999 | 5% |\n| 50,000 - 99,999 | 10% |\n| 100,000\
    \ - 199,999 | 20% |\n| 200,000 - 299,999 | 25% |\n| 300,000 及以上 | 30% |\n\n- 4.\
    \ 写一个程序，根据用户输入的逻辑运算符输出结果。例如：\n| 逻辑运算符 | 结果 |\n|---|---|\n| 且两个为真 | 正确！ |\n| 至少有一个为真\
    \ | 正确！ |\n| 仅有一个为真 | 正确！ |\n\n# 第7章. 逻辑\n\n在编写 if 语句的条件时，我们经常希望计算机评估多个比较。例如，我们可能希望检查一个人是否为男性且大于四十岁。要在\
    \ if 语句中组合多个比较，我们使用逻辑运算符。\n\n# 章节目标\n\n在本节结束时你将能够：\n\n- 编写条件包含多个比较的 if 语句。\n-\
    \ 理解逻辑运算符：非 (!)、与 (&&)、包含或 (||) 和异或 (^)。\n- 使用逻辑运算符优化搜索。\n- 使用真值表帮助评估和重写逻辑表达式。\n\
    \n# 逻辑运算符\n\n要在单个 if 语句的条件中组合两个或多个比较，我们使用逻辑运算符，也称为布尔运算符。下表描述了 JavaScript 的逻辑运算符。\n\
    \n| 运算符 | 名称 | 描述 |\n|---|---|---|\n| ! | 非 | 一元运算符，反转或切换假值为真，将真值为假 |\n| && |\
