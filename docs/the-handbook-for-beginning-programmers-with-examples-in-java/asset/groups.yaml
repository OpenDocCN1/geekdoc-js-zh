- md: "\n## Finding a Value (Linear Search)\n\nVery often a computer program must\
    \ determine if a certain value is stored in an array or not; if stored in the\
    \ array, then return the value's location. The value to be found is called the\
    \ key. If the array is not too large (perhaps less than 100 elements), finding\
    \ the key can be easily done using a linear search. A linear search is done by\
    \ comparing each element in the array with the key until the key is found in the\
    \ array or the end of the array is reached.\n\nThe advantage of a linear search\
    \ is that it is simple and easy to code. The disadvantage is that it is too slow\
    \ if the array has many elements in it; it is probably faster to sort the array\
    \ and keep it sorted and to use a binary search to find the key within the array.\n\
    \nJavaScript code to perform a linear search is shown below. In the example, if\
    \ the key is found in the array, the search function returns the index of the\
    \ location within the array where the key was found. If the key is not found,\
    \ the search function returns 1.\n\n## Example 15\n\nIf key is in list, returns\
    \ the first index where key is located within list; otherwise returns -1.\n\n\
    ```javascript\nfor (var i = 0; i < list.length; i++) {\n  if (list[i] == key)\
    \ {\n    return i;\n  }\n}\nreturn -1;\n```\n\n| list | key | i | return | |\n\
    |---|---|---|---|---|\n| 28.1 | 20 | 23.6 | 0 | 15 | 23.6 |\n| [0] | [1] | [2]\
    \ | [3] | [4] | |\n\n## Finding a Range\n\nSometimes a computer program has a\
    \ list of numerical ranges and must find the range that contains some value. Examples\
    \ of this type of computing problem include:\n\n- determining a person's income\
    \ tax rate from a list of income ranges and graduated tax rates\n- determining\
    \ a customer's discount rate from a list of purchase ranges and discount rates\n\
    - determining a salesperson's commission from a list of sales ranges and commission\
    \ rates\n- determining a student's letter grade from a list of score ranges and\
    \ letter grades\n\nFor example, a company may offer discounts to its customers\
    \ where the discount rate is based on the amount purchased according to this table:\n\
    \n| If the purchase amount is greater than or equal | And the purchase amount\
    \ is less than | Then the discount rate is |\n| --- |---|---|\n| 0 | $300 | 0%\
    \ |\n| $300 | $600 | 2.0% |\n| $600 | $1000 | 2.5% |\n| $1000 | ∞ | 3.0% |\n\n\
    A beginning programmer will often code a JavaScript solution to this problem like\
    \ this:\n\n## Example 16\n\n```javascript\n// Computes and returns a discounted\
    \ purchase amount.\nfunction getDiscountedAmount(purchase) {\n  var rate = 0;\n\
    \  if (purchase >= 0 && purchase < 300) {\n    rate = 0;\n  }\n  if (purchase\
    \ >= 300 && purchase < 600) {\n    rate = 0.02;\n  }\n  if (purchase >= 600 &&\
    \ purchase < 1000) {\n    rate = 0.025;\n  }\n  if (purchase >= 1000) {\n    rate\
    \ = 0.03;\n  }\n  var discount = purchase * rate;\n  return purchase - discount;\n\
    }\n```\n\n### Desk Check\n| purchase | rate | discount | return |\n|---|---|---|---|\n\
    | $708.00 | | | |\n\nWait, the beginning programmer realizes that the separate\
    \ if statements can be connected with else and that the else part of each statement\
    \ will be executed only when the previous if part is false. This means the code\
    \ can be written more succinctly and achieve exactly the same results by removing\
    \ the left half of each statement.\n\n## Example 14\n\n```javascript\n// Computes\
    \ and returns a discounted purchase amount.\nfunction getDiscountedAmount(purchase)\
    \ {\n  var rate;\n  if (purchase < 300) {\n    rate = 0;\n  } else if (purchase\
    \ < 600) {\n    rate = 0.02;\n  } else if (purchase < 1000) {\n    rate = 0.025;\n\
    \  } else {\n    rate = 0.03;\n  }\n  var discount = purchase * rate;\n  return\
    \ purchase - discount;\n}\n```\n\n| purchase | rate | discount | return |\n|---|---|---|---|\n\
    | | | | $708.00 |\n\nThe problem with both these solutions is that if the company\
    \ changes the purchase amount ranges or the discount rates, then a programmer\
    \ must change the corresponding code. An improved solution is to remove the ranges\
    \ and rates from the code and place them in a file or database so that the computer\
    \ can read them into an array when it runs the program. Then the programmer must\
    \ write a simple linear search method to find the correct range and the corresponding\
    \ discount rate as shown in the next example.\n\n## Example 18\n\n```javascript\n\
    // The values in these arrays can be hard coded\n// into your program, or even\
    \ better, they can\n// be read from a file or a database.\nvar limits = [ 300,\
    \ 600, 1000 ];\nvar rates = [ 0, 0.02, 0.025, 0.03 ];\n\n// Computes and returns\
    \ a discounted purchase amount.\nfunction getDiscountedAmount(purchase) {\n  //\
    \ Find the purchase range.\n  for (var i = 0; i < limits.length; i++) {\n    if\
    \ (purchase < limits[i]) {\n      break;\n    }\n  }\n  // Get the discount rate\
    \ that\n  // corresponds to the purchase range.\n  var rate = rates[i];\n  var\
    \ discount = purchase * rate;\n  return purchase - discount;\n}\n```\n\n### Desk\
    \ Check\n| purchase | rate | discount | return |\n|---|---|---|---|\n| $708.00\
    \ | | | |\n\n## Finding a Value (Binary Search)\n\nIf the elements in an array\
    \ are sorted, then the computer can use a faster algorithm called binary search\
    \ to find an element within the array. Binary search works by comparing the key\
    \ to the middle element. If the key is greater than the middle element, the search\
    \ is repeated in the right half. If the key is less than the middle element, the\
    \ search is repeated in the first half. Of course, if the key is equal to the\
    \ middle element, the search is found.\n\n## Example 19\n\n```javascript\n// If\
    \ key is in list, returns the index where key is\n// located within list; otherwise\
    \ returns -1.\n// Assumes list is sorted.\nfunction binarySearch(list, key) {\n\
    \  var left = 0;\n  var right = list.length - 1;\n\n  while (left <= right) {\n\
    \    var mid = left + ((right - left) >>> 1);\n    var cmp = key - list[mid];\n\
    \    if (cmp > 0) {\n      left = mid + 1;\n    } else if (cmp < 0) {\n      right\
    \ = mid - 1;\n    } else {\n      return mid;\n    }\n  }\n  return -1;\n}\n```\n\
    \n### Desk Check\n| list | key | i | return | |\n|---|---|---|---|---|\n| 28.1\
