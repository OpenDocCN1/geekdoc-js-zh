    ## 第1章 计算机硬件


    ## 章目标


    在本章结束时，你将对计算机硬件有一个基本的了解，从而能够编写程序。


    ## 半导体


    计算机的许多部分（包括 CPU 和主内存）是由数百万或数十亿个刻在硅片上的微型半导体组成的。半导体一词意味着这些微型部件部分导电或有时导电。有许多不同类型的半导体，每种类型都实现特定的用途。以下是常见半导体及其用途列表。


    - 1. 电容器 – 一种临时存储电量的半导体。


    - 2. 二极管 – 一种允许电流向一个方向流动的半导体。


    - 3. LED – 发光二极管的缩写；当电流通过时会发光的二极管。


    - 4. 电阻 – 一种抵抗电流流动的半导体。电阻通常用于保护计算机的其他部分免受电涌的影响。


    - 5. 三极管 – 一种有两个输入和一个输出（称为漏极）的半导体。晶体管中心线上的微小电流控制流在两根外侧线上的较大电流。晶体管可以用放大器或自动开关，用微小电流控制较大的输入和输出电流。


    - 6. 集成电路 – 由刻在小块硅片上的许多（可能达数十亿）半导体组成的电路；有时被称为计算机芯片。


    > 图 1：常见半导体的照片：a) 电容器，b) 二极管，c) 发光二极管，d) 电阻和 e) 三极管。


    ## 组成


    现代计算机是由两个主要部分组成的电子机器：硬件和软件。计算机硬件是计算机的物理部分，如键盘、鼠标、CPU、硬盘、内存、显示器和打印机。帮助你记忆硬件是计算机物理部分的简单记忆法是：物理部分是“硬”（hard）的。如果有人朝你扔一块计算机硬件并击中你，你会很疼。当然，计算机的每个部分都有其特定的用途。以下是常见的计算机硬件部分列表。


    - 7. 电源 – 一种将墙壁插座传来的电（通常为 115 伏特、60 赫兹交流电 AC）转换为计算机可以使用电（如 3.3 伏特直流 DC）的电路。


    - 8. 键盘 – 一种允许用户通过按键向计算机输入数据的输入设备。


    - 9. 主板 – 连接计算机其他部分的主电路板。图 2 显示了一个没有连接 CPU、主内存或其他设备的计算机主板。


    - 10. 总线 – 跨越主板上从一个组件传输数据到另一个组件的导线和集成电路。


    - 11. BIOS – 基本输入输出系统的缩写；通常安装在主板上的闪存，其中包含 CPU 在计算机启动时执行的指令。


    - 12. CPU – 中央处理单元的缩写；一种相对较大且昂贵的集成电路，计算机中的大多数计算都在这里完成。


    - 13. 缓存 – 一小部分快速内存，用于临时存储数据和指令，通常位于 CPU 上。缓存包含主内存内容的部分副本，因此当 CPU 需要数据进行计算时，CPU
    可以从缓存获取数据，而无需等待数据从主内存通过总线传输。缓存是易失性的，这意味着当计算机关闭或断电时，缓存的内容将会丢失。


    > Intel Core i7 处理器的顶部和底部。图片由 Intel 提供。


    - 14. 主内存 – 为 CPU 临时存储数据指令的集成电路；有时被称为随机访问内存（RAM）。主内存是易失性的，这意味着当计算机关闭时，主内存的内容将会丢失。


    - 15. 硬盘 – 半永久地存储数据，通常在旋转的盘片上，盘片上的微小点已磁化以存储数据。硬盘是非易失性的，这意味着当计算机关闭时，硬盘的内容会被保留。图
    5 显示了一个去掉了盖子的硬盘，暴露了盘片和在盘片上方移动的头。


    - 16. CD 或 DVD 驱动器 – 使用激光半永久写入数据。光盘（CD）和数字多用光（DVD）是非易失性的。


    - 17. U 盘、优盘或闪存 – 可以通过电读取、写入和擦除的半永久内存。U盘、优盘和闪存是同一种存储设备的不同名称，存储在闪存中。固态硬盘不像在盘片上存储数据，而是存储在闪存中。


    - 18. 显示器 – 一种为用户显示消息、图像等的输出设备。


    ## 数据大小


    以下术语都是计算机存储或处理的数据量。


    - 19. 位（bit） – 二进制数字的缩写。二进制数字是二进制数中的列，可以出现 0 或 1


    -  半字节（nibble） – 四个位组成的二进制数字。这个名字是一个行业内部笑话，因为半字节是一个字节的一半。


    - 21. 字节（byte） – 八个位组成的二进制数字。


    - 22. 千字节（KB） – 真正的千字节是 1024 (2¹⁰) 字节而不是 1000 字节。


    - 23. 兆字节（MB） – 真正的兆字节是 1,048,576 (2²⁰) 字节而不是 1,000,000 字节。


    - 24. 吉字节（GB） – ²³⁰ 字节


    - 25. 太字节（TB） – ²⁴⁰ 字节


    - 26. 拍字节（PB） – ²⁵⁰ 字节


    - 27. 字节（EB） – ²⁶⁰ 字节


    ## 时钟频率


    CPU 内部的时钟反复产生脉冲电信号，这意味着电压上升并下降，如图 6 所示。这种电信号每秒脉冲多次，CPU 的单个核心设计为每个脉冲结束时完成一条指令。时钟频率以赫兹测量。赫兹是每秒一次循环。循环是从脉冲中的任意一点到脉冲重复为止。换句话说，单个周期在电电压下降后立即开始，包括电压上升，并在电压再次下降时结束。以下是测量时钟频率的术语：


    - 28. 赫兹（Hz） – 等于每秒一次循环的频率单位


    - 29. 兆赫兹（MHz） – 每秒百万循环


    - 30. 吉赫兹（GHz） – 每秒十亿循环


