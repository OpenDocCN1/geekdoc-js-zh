    # Arithmetic Expressions


    The word computer comes from the ability these machines have to compute values
    or in other words to perform arithmetic. A programmer tells the computer to perform
    arithmetic by writing arithmetic expressions in a program. An **arithmetic expression**
    is composed of **operands** (numbers and variables) and **operators** (addition,
    multiplication, etc.).


    Arithmetic in JavaScript is written differently than it is written in algebra.
    For example in algebra, 3x means to multiply 3 times x. However, typing 3x in
    a JavaScript program will not cause the computer to multiply anything. Instead
    it will simply cause an error. If you want multiplication in JavaScript, you must
    use the multiplication operator (*) like this:


