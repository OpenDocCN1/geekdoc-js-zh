    \n## 逻辑等价性\n\n逻辑表达式可以用许多不同的方式编写并得到相同的结果。两个产生相同结果的不同逻辑表达式被称为等价，并用双向箭头 (⇔) 表示。两个这样的表达式并不相同，也不相等，但是是等价的。以下是逻辑表达式及其对应的等价表达式的列表。\n\
