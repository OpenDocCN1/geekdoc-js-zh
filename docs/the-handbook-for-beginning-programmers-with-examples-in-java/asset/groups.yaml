- md: "\n## Area of a Triangle\n\nIf we know the side lengths of a triangle as shown\
    \ in Figure 31, we can compute the area of that triangle using Heron's formula\
    \ which is\n\n```\n$area = \\sqrt{s(s-a)(s-b)(s-c)}$\n```\n\nwhere $a$, $b$, and\
    \ $c$ are the lengths of the three sides of the triangle and $s$ is the semi-perimeter\
    \ of the triangle defined by\n\n```\n$s = \\frac{a+b+c}{2}$\n```\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_141_0.png)\n\
    \n## Example 13\n\n```html\n<!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>Triangle Area</title>\n<script type=\"text/javascript\"\
    >\n/* Input: No user input\n * Processing: Compute the area of a triangle with\
    \ side lengths 4, 2, and 5\n * Output: The area of the triangle\n */\nfunction\
    \ testTriangle() {\n  var r = triangleArea(4, 2, 5);\n  document.getElementById('outputDiv').innerHTML\
    \ = r;\n}\n\n// Computes and returns the area of a\n// triangle with side lengths\
    \ a, b, and c.\nfunction triangleArea(a, b, c) {\n  var s = (a + b + c) / 2;\n\
    \  var area = Math.sqrt(s * (s-a) * (s-b) * (s-c));\n  return area;\n}\n</script>\n\
    </head>\n<body>\n<button type=\"button\" onclick=\"testTriangle()\">Test</button>\n\
    <div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\nDesk Check\n\n| a | b |\
    \ c | s | (s-a) | (s-b) | (s-c) | area |\n|---|---|---|---|---|---|---|---|\n\
    | | | | | | | | |\n\n## Surface Area of a Pyramid\n\nImagine designing one of\
    \ the great pyramids. The stones on the inside of the pyramids are very rough\
    \ and are basically just filler. The stones on the outside are finished smooth\
    \ to reflect sunlight. If you were writing the software to design a pyramid, your\
    \ software would have to compute the surface area of a pyramid so the builders\
    \ would know how much finished stone they need to cover the outside of the pyramid.\n\
    \nFigure 32 shows a regular pyramid (all four sides are the same size) with edge\
    \ length $e$, height $h_l$, and base length $b$. Since it is a regular pyramid,\
    \ to compute the surface area multiply that by 4. If the builder of a regular\
    \ pyramid’s triangular faces and specified the base length and the height, then\
    \ your software could use this formula for computing the edge length from the\
    \ base length and height:\n\n```\n$e = \\sqrt{\\frac{b^2}{2} + h^2}$\n```\n\n\
    ![](img/ef8ee93db95f659f7e069b8fe140b87b_142_0.png)\n\nand then call the triangleArea\
    \ function shown above to compute the area of one of the triangular faces.\n\n\
    ## Example 14\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>Surface Area of a Pyramid</title>\n\n<script type=\"\
    text/javascript\">\n/* Input: No user input\n* Processing: Compute the surface\
    \ area of the triangular faces\n* of a regular pyramid that has base 8 and height\
    \ 7.\n* Output: The surface area of the pyramid\n */\nfunction pyramidId() {\n\
    \  var pa = pyramidSurfaceArea(8, 7);\n  document.getElementById('outputDiv').innerHTML\
    \ = pa;\n}\n\n// Computes and returns the surface area of the\n// four triangular\
    \ faces of a regular pyramid\n// with the specified base length and height.\n\
    function pyramidSurfaceArea(base, height) {\n  var edge = Math.sqrt(base/2 + height*height);\n\
    \  var triArea = triangleArea(base, edge, edge);\n  var pyramidArea = 4 * triArea;\n\
    \  return pyramidArea;\n}\n\n// Computes and return the area of a\n// triangle\
    \ with side lengths a, b, and c.\nfunction triangleArea(a, b, c) {\n  var s =\
    \ (a + b + c) / 2;\n  var area = Math.sqrt(s * (s-a) * (s-b) * (s-c));\n  return\
    \ area;\n}\n</script>\n</head>\n\n<body>\n<button type=\"button\" onclick=\"testPyramid()\"\
    >Test</button>\n<div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\n| base\
