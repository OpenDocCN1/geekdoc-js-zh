    \n# Chapter 4. JavaScript Basics\n\nJavaScript was originally developed by Brendan\
    \ Eich at Netscape under the name Mocha, later renamed LiveScript, and finally\
    \ renamed JavaScript. JavaScript is most often used in web pages on the client\
