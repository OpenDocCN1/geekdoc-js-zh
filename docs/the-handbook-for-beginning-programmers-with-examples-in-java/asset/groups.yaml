    # 第 5 章 变量与算术


    计算机程序由数据和指令组成。数据可以临时存储在计算机的内存中，也可以更永久地存储在计算机的硬盘、光盘或磁带上。当数据在计算机内存中时，它们被存储在变量中。变量具有名称、类型、值和作用域。“变量”一词源于变量的值是可以被改变或变化的。


    # 章节目标


    - 声明一个变量并为该变量赋值。

    - 编写 JavaScript 代码，将值从一个变量复制到另一个变量。

    - 编写代码执行计算并将结果存储在变量中。

    - 在算术表达式中使用加、减运算符。

    - 使用 `Math` 对象中的数学函数。


    # 声明变量


    在计算机程序中使用变量之前，你必须声明变量，这告诉计算机在主内存中为该变量留空间。在 JavaScript 程序中声明变量，只需编写关键字 `var` 和变量名即可。变量名必须以大写或小写字母、下划线
    (_ ) 或美元符号 ($) 开头。名称其余部分必须由字母、数字 (0-9)、下划线或美元符号组成。变量名不能包含空格。它应该是一个有意义的名称，清晰地描述它存储的内容。计算机程序员在程序中使用变量名作为变量值的表示。这类似于代数方程中使用变量的方式。


    # 模板


    ```

    var name, name2, name3;

    ```


    # 示例 1


    声明三个名为 x、balance 和 interest 的变量。


    ```

    var x;

    var balance, interest;

    ```


    # 示例 2


    声明两个名为 roomNumber 和 occupants 的变量。


    # 变量类型


    每个变量都有一个类型，以便计算机知道变量中可以存储什么类型的数据，以及计算机可以对变量执行哪些操作。变量的类型由存储在变量中的决定。JavaScript 程序中的变量可以是以下类型中的任意一种。


    # JavaScript 变量类型


    | 类型 | 用途 | 示例 |

    |---|---|---|

    | boolean | 存储 true 或 false | true |

    | number | 带或不带小数点的数字 | 74.3 |

    | string | 文本字符串 | "San Diego" |

    | function | 使用关键字 function 创建的程序部分 | function () { return 27; } |

    | object | 对象，如数组或日期 | {name:"Sam", phone:"1788"} |


    # 为变量赋值


    程序员可以在 JavaScript 程序的任何点使用赋值运算符（简单来说等号 = ）来给变量赋值。赋值运算符从右到左工作，复制等号右侧的值并将其存储在等号左侧的变量或位置中。


    # 模板


    ```

    name = value;

    ```


    # 示例 3


    声明三个名为 price、discRate 和 title 的变量。为前两个变量赋值 12.95 和 0.25，为第三个变量赋值文本“A Poor Wayfaring
    Man of Grief”。


    ```

    var price, discRate;

    var title;


    price = 12.95;

    discRate = 0.25;

    title = "A Poor Wayfaring Man of Grief";

    ```


    注意，要在变量中存储文本，必须给文本加上引号（双引号或单引号），例如：


    ```

    title = "A Poor Wayfaring Man of Grief";

    ```


    在 JavaScript 中，所有变量的默认值是 `undefined`。如果程序员不使用等号 (=) 给变量赋值，则该变量的值将是 `undefined`，不是
    0 也不是 null，而是字面上的值 `undefined`。显然，`undefined` 不是数字，不能成功地作为计算的一部分。为了确保所有变量都有非 `undefined`
    的值，JavaScript 允许在声明变量时为其赋值。这有时被称为初始化变量，许多程序员喜欢这样做，因为可以少写一行代码。


    # 模板


    ```

    var name = value, name2 = value2, name3 = value3

    ```


    # 示例 4


    声明一个名为 price 的变量并为其赋值数字 12.95。也声明一个名为 title 的变量并赋值文本“A Poor Wayfaring Man of Grief”。


    ```

    var price = 12.95;

    var title = "A Poor Wayfaring Man of Grief";

    ```


    # 示例 5


    声明一个名为 occupants 的变量并为其赋值 3。


    # 手工检查 (Desk Checks)


    在阅读的其他部分时，你会发现像计算机一样逐行跟踪示例代码是有帮助的。这样做有时被称为手工检查，因为你是在纸上或在桌面上检查代码，而不是在计算机上运行。为了执行手工检查，画一个代表计算机主内存的表格。像计算机一样逐行跟踪给定的代码，改变每个变量的值。例如，如果给你以下代码：


    ```

    1 var x = 7;

    2 var y = -3;

    3 var a = x;

    4 y = 4;

    ```


    你会画这样一个表格来代表计算机的主内存。注意，第一行代码将变量 x 的值改为 7，在 x 下写 7。第二行代码将 y改为 3，在 y 下写 3。第三行代码将
    x 的值复制到 a，在 a 下写 7。最后，最后一行代码将 y 的值改为 4，-3 被划掉，在 y 下写 4。


    从技术上讲，在手工检查表中为 y 写另一个值准确模拟计算机存储值的方式。当给变量赋值新值时，旧值会被新值替换。然而，为了理解代码如何工作，查看变量随时间所持有的历史是有帮助的，因此当你完成手工检查时，应该划掉旧值并在其下方写新值。


    有时示例代码需要来自用户或其他处的输入。这些输入会在手工检查表中。例如，代码：


    ```

    var y = x;

    ```


    要求变量 x 已经有一个值。这个值会在手工检查表中：


    | x | y | a |

    |---|---|---|

    | 15 | -3 | 7 |

    | | 4 | |


    # 交换值


    如果程序需要交换一个变量与另一个变量的值，或者说交换它们的值，常用且简单的方法是使用临时变量。下面的示例代码使用名为 *swap* 的临时变量来交换两个变量
    *a* 和 *b* 的值。手工检查这段代码。执行手工检查，像计算机一样逐行跟踪示例代码，检查空格中每个变量的值。缺失的格子意味着没有可填写的值。


    # 示例 6


    # 手工检查


    ```

    var swap = a;

    a = b;

    b = swap;

    ```


    | a | b | swap |

    |---|---|---|

    | 8 | -3 | |


    # 算术表达式


    “计算机”一词源于这些机器计算值的能力，或者说执行算术。程序员通过编写算术表达式告诉计算机执行算术。一个**算术表达式**由**操作数**（数字和变量）和**运算符**（加法、乘法等）组成。


    JavaScript 中的算术写法与代数中的写法不同。例如，在代数中，3x 意味着 3 乘以 x。然而，在 JavaScript 程序中输入 3x 不会导致计算机执行乘法。相反，它会导致错误。如果你在
    JavaScript 中需要乘法，必须这样使用乘法运算符 (*)：


    3 * x。


    # 算术运算符


    计算机可以执行五种基本的算术运算：乘法、除法、模、加法减法。正如本节前面提到的，计算机还可以给变量赋值。程序员通过在程序中编写相应的运算符（符号）让计算机执行这些算术运算。以下是
    JavaScript 可用的算术运算符。


    # JavaScript 算术运算符


    | 运算符 | 名称 | 代数表达式 | JavaScript 表达式 |

    | --- |---|---|---|

    | * | 乘法 | v · y or v × t | v * t |

    | / | 除法 | x ÷ y or x / y | x / y |

    | % | 模 | r mod s | r % s |

    | + | 加法 | p + q | p + q |

    | - | 减法 | f - 3 | f - 3 |

    | = | 赋值 | s = t | s = t |


    # 模


    模运算符有时被称为余数运算符，因为它返回除法后的余数。然而，它的正确名称是模运算符，因为它返回除法后的符号余数，这意味着余数可以是正也可以是负。在 JavaScript
    中，模结果的符号仅取决于被除数（% 左侧的操作数）的符号。


    # 示例


    ```

    7 % 3 = 1

    12 % 3 = 0

    6 % 4 = 2

    6 % -4 = 2

    -6 % -4 = -2

    ```


    除了基本的算术运算符外，大多数计算机语言还提供了计算幂、平方根、对数、正弦、余弦等的函数。


