    \ |\n| | |\n| | |\n\n8. Repetition\n\n101\n\n## Zero-Based Counting Loop\n\nExperienced\
    \ computer programmers almost always write counting loops to begin at zero (0)\
    \ rather than (1) as we have all been taught since before kindergarten. There\
    \ are probably many reasons programmers start loops at zero; one of them is because\
    \ array elements (see chapter 10) are indexed starting with zero in C, C++, Java,\
    \ and JavaScript. Because zero-based counting loops are so common and useful in\
    \ computer programming, the aspiring programmer must learn to write them. Below\
    \ are two examples of zero-based counting loops that execute the statements inside\
    \ the loops exactly n times.\n\n## Example 6\n\n```\nvar n = 3;\nvar i = 0;\n\
    while (i < n) {\n  window.alert(\"leaf\");\n  i++;\n}\n```\n\n| i | n |\n|---|---|\n\
    | | |\n| | |\n| | | |\n\n## Example 7\n\n```\nvar n = 3;\nfor (var i = 0; i <\
    \ n; i++) {\n  window.alert(\"caterpillar\");\n}\n```\n\n| i | n |\n|---|---|\n\
    | | |\n| | |\n| | | |\n\n## Skipping Loop\n\nSometimes we want the computer to\
    \ count by a value other than 1. We can write a loop that will cause the computer\
    \ to skip values.\n\n## Example 8\n\n```\nvar skip = 4;\nvar n = 12;\nvar i =\
    \ 0;\nwhile (i < n) {\n  window.alert(\"stem\");\n  i += skip;\n}\n```\n\n| i\
    \ | skip | n |\n|---|---|---|\n| | | |\n| | | |\n| | | | |\n\n## Example 9\n\n\
    ```\nvar skip = 2;\nvar n = 5;\nfor (var i = 0; i < n; i += skip) {\n  window.alert(\"\
    aphid\\n\");\n}\n```\n\n| Desk Check |\n|---|---|---|\n| i | skip | n |\n\n##\
    \ Infinite Loop\n\nWhat does the computer do if a programmer forgets to write\
    \ the update part of a loop?\nFor example:\n\n```\nvar i = 0;\nwhile (i < 5) {\n\
    \  window.alert('Hello');\n}\n```\n\nOr this example:\n\n```\nfor (var i = 0;\
    \ i < 5; ) {\n  window.alert('Hello');\n}\n```\n\nNotice in both examples that\
    \ after the value of the counting variable $i$ is initialized to zero (0), its\
    \ value is never changed. This means that $i$ will start at the value zero, and\
    \ each time the computer evaluates the continuation condition ($i < 5$), $i$ will\
    \ be less than 5. In other cases, the continuation condition will always evaluate\
    \ to true and the computer will keep repeating the statements inside the loop\
    \ forever or the user kills the program. This is called an **infinite loop** and\
    \ is usually, although not always, a mistake. Of course the way to fix both of\
    \ the above infinite loop examples is to add code to change the value of $i$ within\
    \ the body of the loops, for example:\n\n```\nvar i = 0;\nwhile (i < 5) {\n  window.alert('Hello');\n\
    \  i++;\n}\n```\n\n```\nfor (var i = 0; i < 5; i += 2) {\n  window.alert('Hello');\n\
    }\n```\n\n8. Repetition\n\n## Compound Interest\n\nMany bank accounts and other\
    \ investments pay compound interest on the money that is saved in the account.\
    \ This means each time the bank pays interest, the interest is added to the original\
    \ money, which is called the principal. The next time the bank pays interest,\
    \ it pays interest on the principal and the previous interest. The balance of\
    \ such an account and its compound interest can easily be computed using a loop.\n\
    \n## Example 10\n\n```\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>Compound Interest</title>\n<script type=\"text/javascript\"\
    >\n/* Input:\n* An amount to invest: balance\n* The annual rate of growth: annualRate\n\
    * The number of months to invest: numMonths\n* Processing: Use a loop to compute\
    \ the balance of an account after\n* a bank has paid interest for numMonths of\
    \ months.\n* Output: The balance after numMonths have passed.\n*/\nfunction calculate()\
    \ {\n  var balance = parseFloat(document.getElementById('balance').value);\n \
    \ var annualRate = parseFloat(document.getElementById('annualRate').value);\n\
    \  var numMonths = parseInt(document.getElementById('months').value);\n  var monthlyRate\
    \ = annualRate / 12;\n\n  // For each month, compute the interest and add it to\
    \ the balance.\n  for (var month = 1; month <= numMonths; month++) {\n    // Compute\
    \ the interest for a month.\n    var interest = balance * monthlyRate;\n\n   \
    \ // Round the interest to pennies.\n    interest = Math.round(interest * 100)\
    \ / 100;\n\n    // Add the interest to the balance.\n    balance += interest;\n\
    \  }\n  document.getElementById('output').innerHTML = \"Your balance after \"\
    \ + numMonths + \" months will be $\" + balance;\n}\n</script>\n</head>\n<html>\n\
    ```\n\n```\n<body> <input type=\"text\" id=\"balance\" size=\"7\"><br>\nAnnual\
    \ growth rate: <input type=\"text\" id=\"annualRate\" size=\"5\"><br>\nNumber\
    \ of months: <input type=\"text\" id=\"months\" size=\"3\"><br>\n<button type=\"\
    button\" onclick=\"futureValue()\">Future Value</button>\n<div id=\"output\"></div>\n\
    </body>\n</html>\n```\n\n## Desk Check\n\n| annualRate | monthlyRate | numMonths\
    \ | month | interest | balance |\n|---|---|---|---|---|---|\n| 0.06 | | 3 | |\
    \ | 100 |\n| | | | | | |\n| | | | | | |\n| | | | | | |\n| | | | | | |\n\n## break\n\
    \nThe break keyword causes the computer to end a loop prematurely. It is normally\
    \ used inside an if statement that is inside a loop.\n\n## Example 11\n\n```javascript\n\
    // Gets 10 or fewer numbers from the user and adds them together.\nfunction sum10()\
    \ {\n  var sum = 0;\n  for (var i = 0; i < 10; i++) {\n    var n = parseFloat(prompt('Enter\
    \ a number'));\n    if (n == 0) {\n      break;\n    }\n    sum += n;\n  }\n \
    \ window.alert(sum);\n}\n```\n\n| i | n | sum |\n|---|---|---|\n| | 17 | |\n|\
    \ | 3 | |\n| | 6 | |\n| | 0 | |\n\n8. Repetition\n\n105\n\n## Prime Numbers\n\n\
    A prime number is a positive integer that is evenly divisible by only two integers,\
    \ 1 and itself. The numbers 2, 3, 5, and 7 are prime as 91, 97, and 101. Prime\
    \ numbers are very important in computing, for example in hash code algorithms\
    \ and data encryption. There are many well known algorithms, including the sieve\
    \ of Eratosthenes, for determining if a number is prime. The following JavaScript\
    \ code uses a naive and slow algorithm to determine if a number is prime, but\
    \ it works. The code below increments a divisor from 1 to the candidate, inclusive\
    \ and repeatedly divides the candidate by the divisor. Each time the divisor divides\
    \ the candidate without a remainder, then factor count is incremented. After the\
    \ divisor loop is finished, if factor count is 2 (1 and the candidate), the candidate\
    \ is prime, otherwise it is not.\n\n## Example 12\n\n```\n<!DOCTYPE HTML>\n<html\
    \ lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Prime Number</title>\n\
    </head>\n<script type=\"text/javascript\">\n/* Input: an integer determine if\
    \ the given integer is prime or not.\n* Output: __ is prime OR __ is not prime\
    \ */\nfunction isPrime() {\n    var candidate = parseInt(document.getElementById('integerBox').value);\n\
    \n    // Count the number of factors that evenly divide candidate\n    var factorCount\
    \ = 0;\n    for (var divisor = 1; divisor <= candidate; divisor++) {\n       \
    \ var remainder = candidate % divisor;\n        if (remainder == 0) {\n      \
    \      factorCount++;\n        }\n    }\n\n    // Determine the output and show\
    \ it to the user.\n    var output;\n    if (factorCount == 2) {\n        output\
    \ = candidate + ' is prime';\n    } else {\n        output = candidate + ' is\
    \ not prime';\n    }\n    document.getElementById('outputDiv').innerHTML = output;\n\
    }\n</script>\n```\n"
  mdcn: "\n\n## do while\n\ndo-while 循环是 JavaScript 中唯一的后测试循环。另外三个循环：while、`for` 和\
    \ `for-each` 都是前测试循环。\n\n在以下情况下使用 do-while 循环：\n\n-   你无法使用简单的计数循环，因此必须使用由哨兵控制的循环；\n\
    -   循环内部的语句在检查哨兵之前必须执行。\n\n## 模板\n\n```\ndo {\n  statements;\n} while (condition);\n\
    ```\n\n图 28 显示了 do-while 循环以及计算机执行其各个部分的顺序。后测试循环体内的语句将至少执行一次，因为继续循环的测试位于底部，并在执行完体内的语句后进行评估。前测试循环（while、for\
    \ 和 for-each）体内的语句可能永远不会执行，因为测试位于这些循环的顶部，并在执行体内语句之前评估。\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_112_0.png)\n\
    \n**图 28:** 一个 do-while 循环以及计算机执行其各个部分的顺序。\n\n## 示例 5\n\n```\nvar alias, response;\n\
    do {\n  // 这里是需要重复的语句。\n  alias = window.prompt(\"你的名字是什么？\");\n  response = window.prompt(\"\
    你确定 \" + \n  alias + \" 是你的名字吗？\");\n} while (response != \"yes\");\nwindow.alert(\"\
    Hello \" + alias);\n```\n\n| 调试纸检查 |\n| alias response |\n| | |\n| | |\n\n8. 重复\n\
    \n101\n\n## 零基计数循环\n\n经验丰富的计算机程序员几乎总是编写计数循环从零 (0) 开始，而不是 (1)，正如我们从幼儿园以前就被教导的那样。程序员从零开始循环可能有很多原因；其中之一是因为数组元素（见第\
    \ 10 章）在 C、C++、Java 和 JavaScript 中是从零开始索引。由于零基计数循环在计算机编程中非常常见且有用，有行的程序员必须学会编写它们。下面是两个零基计数循环的示例，它们会精确执行循环内部语句\
    \ n 次。\n\n## 示例 6\n\n```\nvar n = 3;\nvar i = 0;\nwhile (i < n) {\n  window.alert(\"\
    leaf\");\n  i++;\n}\n```\n\n| i | n |\n|---|---|\n| | |\n| | |\n| | | |\n\n##\
    \ 示例 7\n\n```\nvar n = 3;\nfor (var i = 0; i < n; i++) {\n  window.alert(\"caterpillar\"\
    );\n}\n```\n\n| i | n |\n|---|---|\n| | |\n| | |\n| | | |\n\n## 跳过循环\n\n有时我们希望计算机按除\
    \ 1 以外的步值进行计数。我们可以编写一个让计算机跳过某些值的循环。\n\n## 示例 8\n\n```\nvar skip = 4;\nvar n =\
    \ 12;\nvar i = 0;\nwhile (i < n) {\n  window.alert(\"stem\");\n  i += skip;\n\
    }\n```\n\n| i | skip | n |\n|---|---|---|\n| | | |\n| | | |\n| | | | |\n\n## 示例\
    \ 9\n\n```\nvar skip = 2;\nvar n = 5;\nfor (var i = 0; i < n; i += skip) {\n \
    \ window.alert(\"aphid\\n\");\n}\n```\n\n| 调试纸检查 |\n|---|---|---|\n| i | skip\
    \ | n |\n\n## 无限循环\n\n如果程序员忘记编写循环的更新部分，计算机会做什么？\n例如：\n\n```\nvar i = 0;\nwhile\
    \ (i < 5) {\n  window.alert('Hello');\n}\n```\n\n或者这个示例：\n\n```\nfor (var i =\
    \ 0; i < 5; ) {\n  window.alert('Hello');\n}\n```\n\n注意在这两个例子中，在计数变量 $i$ 的值初始化为零\
    \ (0) 后，它的值从未被改变过。这意味着 $i$ 将从零值开始，计算机每次评估继续条件（$i < 5$）时，$i$ 都将小于 5。在其他情况下，继续条件将始终评估为真，计算机将无限重复循环内部的语句，直到用户杀死程序。这被称为**无限循环**，通常情况下（尽管并不总是）是一个错误。当然，修复上述两个无限循环示例的方法是在循环体内添加更改\
    \ $i$ 值的代码，例如：\n\n```\nvar i = 0;\nwhile (i < 5) {\n  window.alert('Hello');\n\
    \  i++;\n}\n```\n\n```\nfor (var i = 0; i < 5; i += 2) {\n  window.alert('Hello');\n\
    }\n```\n\n8. 重复\n\n## 复利\n\n许多银行账户和其他投资对账户中保存的资金支付复利。这意味着每当银行支付利息时，利息都会加入原始资金（即本金）中。下次银行支付利息时，它会对本金和之前的利息支付利息。此类账户的余额及其复利可以使用循环轻松计算。\n\
    \n## 示例 10\n\n```\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>复利</title>\n<script type=\"text/javascript\">\n/* 输入：账户中存款的金额\n\
    * 输入：本金\n* 输入：年利率\n* 输入：月份数\n* 输出：多少个月后的余额\n*/\nfunction calculate() {\n  var\
    \ balance = parseFloat(document.getElementById('balance').value);\n  var annualRate\
    \ = parseFloat(document.getElementById('annualRate').value);\n  var numMonths\
    \ = parseInt(document.getElementById('months').value);\n\n  for (var month = 0;\
    \ month < numMonths; month++) {\n    balance += balance * (annualRate / 100);\n\
    \  }\n  document.getElementById('output').innerHTML = \" + numMonths + \" 个月后的余额为\
    \ $\" + balance;\n}\n</script>\n</head>\n<body>\n金额：<input type=\"text\" id=\"\
    balance\"><br>\n年利率：<input type=\"text\" id=\"annualRate\"><br>\n月份：<input type=\"\
    text\" id=\"months\"><br>\n<button type=\"button\" onclick=\"calculate()\">计算</button>\n\
    <div id=\"output\"></div>\n</body>\n</html>\n```\n\n## 调试纸检查\n\n| annualRate |\
    \ monthlyRate | numMonths | interest | balance |\n|---|---|---|---|---|\n| 0 |\
    \ | | | |\n| | | | | |\n| | | | | |\n| | | | | |\n| | | | | |\n| | | | | |\n|\
    \ | | | | |\n\n## break\n\n`break` 关键字会导致循环提前结束。它通常用于 `if` 语句内部。\n\n## 示例 11\n\
    \n```javascript\n// 获取用户的数字并将其相加。\nfunction sum10() {\n  var sum = 0;\n  for (var\
    \ i = 0; i < 10; i++) {\n    var n = parseFloat(prompt('输入一个数字'));\n    if (n\
    \ == 0) {\n      break;\n    }\n    sum += n;\n  }\n  window.alert(sum);\n}\n\
    ```\n\n| i | n | sum |\n|---|---|---|\n| 17 | | |\n| 3 | | |\n| 6 | | |\n\n8.\
    \ 重复\n\n105\n\n质数只能被两个整数（1 和自身）整除的正整数。2、3、5 和 7 是质数，91、97 和 101 也是。质数在计算中非常重要，例如在哈希算法和数据加密中。有许多确定质数的算法，包括埃拉托尼筛法。下面的\
    \ JavaScript 代码使用了一种简单且缓慢的算法来确定一个数是否为质数，但它是有效的。该代码将除数从 1 增加到目标数（包含边界），并反复除以除数。每次无除，计数器就会增加。在除数循环结束后，如果计数器为\
    \ 2（1 和目标数），则该数是质数，否则不是。\n\n## 示例 12\n\n```\n<!DOCTYPE HTML>\n<html lang=\"en-us\"\
    >\n<head>\n<meta charset=\"utf-8\">\n<title>质数</title>\n</head>\n<script type=\"\
    text/javascript\">\n/* 输入：判断给定的整数是否为质数\n* 输出：__ 是质数 或 __ 不是质数 */\nfunction isPrime()\
    \ {\n    var candidate = parseInt(document.getElementById('integerBox').value);\n\
    \n    // 计算能整除 candidate 的因子个数\n    var factorCount = 0;\n    for (var divisor\
    \ = 1; divisor <= candidate; divisor++) {\n        var remainder = candidate %\
    \ divisor;\n        if (remainder == 0) {\n            factorCount++;\n      \
    \  }\n    }\n\n    // 确定输出并显示给用户\n    var output;\n    if (factorCount == 2) {\n\
    \        output = candidate + ' 是质数';\n    } else {\n        output = candidate\
    \ + ' 不是质数';\n    }\n    document.getElementById('outputDiv').innerHTML = output;\n\
    }\n</script>\n<body>\n整数：<input type=\"text\" id=\"integerBox\"><br>\n<button\
    \ type=\"button\" onclick=\"isPrime()\">检查</button>\n<div id=\"outputDiv\"></div>\n\
    </body>\n</html>\n```\n\n"
