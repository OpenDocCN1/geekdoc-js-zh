    \ + 18 / --q; |\n\n# 复习运算符优先级\n\n下表显示了本章所示的所有 JavaScript 算术运算符的优先级。\n\n# JavaScript\
    \ 算术运算符优先级\n\n| 运算符 | 名称 | 优先级 |\n|---|---|---|\n| ( ) | 括号 | 最高（首先评估） |\n| ++\
    \ -- | 否定、增、减 | |\n| * / % | 乘、除、取模 | |\n| + | 加、减 | |\n| = += -= *= /= /= %==\
    \ (此处应为赋值) | 赋值运算符 | 最低（最后评估） |\n\n请记住，前置增始终在同一语句的其余算术操作之前执行，而后置增尽管优先级更高，但始终在同一语句的其余算术操作之后执行。\n\
    \n# Math 对象\n\nMath 对象是 JavaScript 内置的一个对象（见第 11 章），允许程序执行更高级的数学计算。它包含以下数学常数和函数，在程序中使用它们时，所有项必须加上\
