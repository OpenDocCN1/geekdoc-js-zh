    \ $f$ 是华氏度风寒指数，$t$ 是华氏度空气温度，$s$ 是地面上方五英处的每小时英里风速。在一个包含两个文本框（用于输入温度和风速）和一个 `div`（用于输出风寒指数）的\
    \ HTML 和 JavaScript 程序中使用你的函数。\n\n- 创建一个 HTML 文档，其中包含两个文本框、一个按钮和一个 `div`。第一个文本框应标记为“Temperature”（温度），第二个标记为“Relative\
