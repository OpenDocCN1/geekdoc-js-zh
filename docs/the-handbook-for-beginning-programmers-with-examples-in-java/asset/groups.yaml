    \ loops that cause a computer to repeat a group of statements.\n- Know what the\
    \ keyword break inside a loop causes a computer to do.\n\n# Pre-test and Post-test\
    \ Loops\n\nLoops can be categorized according to where the boolean condition is\
    \ located. A pre-test loop has the condition at the top of the loop. It is known\
    \ as a pre-test loop because the condition is evaluated before (pre) the computer\
    \ executes the statements inside the loop. A post-test loop has the condition\
    \ at the bottom of the loop. It is called a post-test loop because the condition\
    \ is evaluated after (post) the statements inside the loop are executed.\n\nWith\
    \ a pre-test loop, the statements inside the loop may never be executed. This\
    \ is because when the computer encounters the loop, the first thing the computer\
    \ will do is to evaluate the loop's condition. If the condition evaluates to false,\
    \ then the statements inside the loop will not be executed.\n\nWith a post-test\
    \ loop, the statements inside the loop will always be executed at least once because\
    \ when the computer encounters the loop, it will first execute the statements\
    \ inside the loop, and then it will evaluate the loop's condition.\n\nPre-test\
    \ loops are used much more frequently than post-test loops. In fact all post-test\
    \ loops can be rewritten as pre-test loops, so post-test loops are not strictly\
    \ necessary in a programming language, but they are sometimes convenient to use.\n\
    \n# Counting and Sentinel Controlled Loops\n\nLoops can also be categorized by\
    \ what is in their condition. A counting loop causes the computer to count from\
    \ a start value to an end value. A counting loop's condition is a simple check\
    \ to see if the counting variable has reached the end value. A sentinel controlled\
    \ loop causes the computer to repeat statements until some event occurs or the\
    \ computer encounters some sentinel value. A sentinel controlled loop's condition\
    \ checks for the occurrence of that event or sentinel value.\n\n# Repetition Control\
    \ Structures\n\nJavaScript has four ways to write a repetition control structure\
    \ to cause a computer to repeat statements. The four ways are: while, for, for-each,\
    \ and do-while. The while, for, and for-each loops are pre-test loops. The do-while\
    \ loop is a post-test loop. The while, for, and do-while loops all have a condition\
    \ and repeat the statements inside of the loop while the condition is true. The\
    \ for-each loop repeats the statements inside the loop once for each attribute\
    \ in an object (see chapter 11).\n\n# while\n\nUse a while loop when:\n\n- You\
    \ need a simple counting loop; or\n- You can't use a simple counting loop, so\
    \ you must use a sentinel controlled loop, and the sentinel must be checked before\
