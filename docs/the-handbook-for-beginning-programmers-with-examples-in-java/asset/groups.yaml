  mdcn: "\n\n## 保留小数位数\n\nJavaScript 内置的 Math 对象有一个函数可以将实数舍入为整数。然而，程序员有时需要编写一个程序，将小数四舍入到小数点后的固定位数。例如，美国货币金额通常四舍入到两位小数（分）。以下代码使用了内置的\
    \ `Math.pow` 和 `Math.round` 函数将变量 `dist` 中的值保留两位小数。\n\n## 示例 25\n\n```javascript\n\
    <script type=\"text/javascript\">\n/* Input: x and y for two points: x1, y1, x2,\
    \ y2\n * Processing:\n * 1. 计算两点之间的距离。\n * 2. 将距离舍入到小数点后两位数字。\n * Output: 舍入后的距离\n\
    */\nfunction distance() {\n  // 从用户处获取两个点的坐标。\n  var x1 = parseFloat(document.getElementById('x1InputBox').value);\n\
    \  var y1 = parseFloat(document.getElementById('x2InputBox').value);\n  var x2\
    \ = parseFloat(document.getElementById('y1InputBox').value);\n  var y2 = parseFloat(document.getElementById('y2InputBox').value);\n\
    \n  // 计算两点之间的距离。\n  var dx = x2 - x1;\n  var dy = y2 - y1;\n  var dist = Math.sqrt(dx\
    \ * dx + dy * dy);\n\n  // 将距离舍入到小数点后两位数字。\n  var digits = 2;\n  var multiplier\
    \ = Math.pow(10, digits);\n  dist = Math.round(dist * multiplier) / multiplier;\n\
    \n  // 将距离显示给用户。\n  document.getElementById('outputDiv').innerHTML = dist;\n}\n\
    </script>\n```\n\n| x1 | y1 | x2 | y2 | dx | dy | dist | digits | multiplier |\n\
    | 7 | 2 | 4 | 6 | | | | | |\n\n## 5. 变量与算术运算\n\n## 常见错误\n\n忘记声明变量\n\n| 错误 | 正确\
