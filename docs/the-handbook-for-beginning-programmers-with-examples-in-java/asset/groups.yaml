    The formula for converting a temperature in Celsius to Fahrenheit is


    Example 9 is a JavaScript program that uses this formula to convert a temperature
    entered by a user in Celsius to a temperature in Fahrenheit. Notice at line 14
    of example 9 the program contains code to read the value that a user typed into
    a text field and to store that value in a variable named. At line 17, the `parseFloat`
    function converts the user typed by a string into a number. Line 17 is necessary
    because a computer always treats values typed by a user as if they were text.
    This is true no matter what the user types. If a user clicks in a text field and
    then presses the 5 key and the 8 key, a human will look at the user input and
    think of it as the number 58, but a computer will treat it as the digit "5" followed
    by the digit "8". In other words, if you are writing a program to get user input
    and to perform calculations with that input, then your program must convert the
    user input from a string of text into a number before performing calculations
    with that number. Converting from text to a number is what the `parseFloat` function
    does as shown on line 17.


    In JavaScript there are two functions to convert a string of text into a number:
    `parseInt` and `parseFloat`. `parseInt` converts a string to an integer. If a
    user enters text with digits after the decimal point, `parseInt` will convert
    only the digits before the decimal point and ignore the digits after the decimal
    point. For example if a user enters "75.814", `parseInt` will convert to the number
    75. `parseFloat` converts a string to a number that may have digits after the
    decimal point. For example `parseFloat` will convert the string "75.814" to the
    number 75.814 or a close approximation to 75.814.'
