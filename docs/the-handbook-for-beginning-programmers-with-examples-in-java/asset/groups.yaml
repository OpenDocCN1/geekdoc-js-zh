    \n在你的程序中，使用以下 JavaScript 代码从你的计算机时钟获取当前的月份、当前日期和星期几：\n\n```\nvar now = new Date();\n\
    var month = now.getMonth();\nvar dayOfMonth = now.getDate();\nvar dayOfWeek =\
    \ now.getDay();\n```\n\n如果你使用上述代码，如果当前月份是1月，变量 `month` 将存储 0；2月则为 1，以此此类推，12月为\
    \ 11。变量 `dayOfMonth` 在每月的第一天存储 1，一直到月的最后一天存储 28、29、30 或 31。变量 `dayOfWeek` 如果今天是星期日将存储\
    \ 0，如果是周一则为 1，以此此类推，如果是周六则为 6。\n\n# 7. 逻辑\n\n# 第8章 重复\n\n计算机程序员可以通过在计算机程序中编写循环来让计算机重复一系列语句。每个循环都包含一个布尔条件。每当计算机需要决定是否应该重复循环内部的语句时，计算机都会评估循环条件。如果条件结果为\
    \ `true`，则计算机重复循环内部的语句。如果条件结果为 `false`，计算机就不重复内部语句，而是从循环循环后的语句开始继续执行程序。\n\n# 本章成果\n\
    \n在本章结束时，你将能够：\n\n- 区分测试前循环（pre-test）和后测试循环（post-test），以及区分计数控制循环和哨兵控制循环。\n- 知道何时使用测试前循环或后测试循环，以及何时使用计数控制循环或哨兵控制循环。\n\
    - 能够读写 `while`、`for` 和 `do-while` 循环，这些循环可以使计算机重复一组语句。\n- 知道循环内部的 `break` 关键字会导致计算机执行什么。\n\
    \n# 测试前循环和后测试循环\n\n循环可以根据布尔条件的位置进行分类。测试前循环的条件位于循环顶部。它被称为测试前循环是因为条件在计算机执行循环内部语句之前（pre）就已经被评估了。后测试循环的条件位于循环的底部。它被称为后测试循环是因为条件在循环内部语句执行之后（post）才被评估。\n\
    \n对于测试前循环，循环内部的语句可能永远不会被执行。这是因为当计算机遇到循环时，计算机的第一件事就是评估循环条件。如果条件结果为 `false`，则循环内部的语句将不会执行。\n\
    \n对于后测试循环，循环内部的语句至少会执行一次。这是因为当计算机遇到循环时，首先会执行循环内部语句，然后评估循环条件。\n\n测试前循环比后测试循环使用得更频繁。事实上，后测试循环可以重写为测试前循环。\n\
    \n# 计数循环和哨兵控制循环\n\n循环还可以根据循环的内容进行分类。计数循环从起始值计数到结束值。哨兵控制循环在某个事件发生之前重复语句，其条件是检查该事件是否发生。\n\
    \n# 重复结构\n\nJavaScript 有四种编写重复结构的方法来让计算机重复语句：`while`、`for`、`for-each` 和 `do-while`。`while`\
    \ 和 `for` 循环是测试前循环。`do-while` 循环是后测试循环。\n\n# while\n\n当 `while` 循环的条件为 `true`\
    \ 时，它会重复循环体内的语句。`while` 循环在执行循环体语句之前检查条件。\n\n```\nwhile (condition) {\n  statements;\n\
    }\n```\n\n# for\n\n`for` 循环是编写计数循环的简化方法。当你需要简单的计数循环时，使用 `for` 循环：\n\n```javascript\n\
    for (initialization; condition; update) {\n  statements;\n}\n```\n\n# for-each\n\
    \n`for-each` 循环是 `for` 循环的一种特殊用例。`for-each` 循环为对象中的每个属性重复一次其内部语句（参见第11章）。\n\n\
    ```javascript\nfor (variable in object) {\n  statements;\n}\n```\n\n"
