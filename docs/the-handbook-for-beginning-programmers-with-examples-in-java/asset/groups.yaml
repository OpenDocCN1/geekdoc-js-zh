    \ equivalent. Here is a list of logical expressions with an equivalent expression\
    \ for each.\n\n+   1. double negation: Not Not a ⇔ a\n2. commutative laws:\n \
    \  a. a Or b ⇔ b Or a\n   b. a And b ⇔ b And a\n3. associative laws:\n   a. (a\
    \ Or b) c ⇔ a Or (b c)\n   b. (a And b) c ⇔ a And (b c)\n4. distributive laws:\n\
    \   a. a Or (b And c) ⇔ (a Or b) And (a Or c)\n   b. a And (b Or c) ⇔ (a And b)\
    \ Or (a And c)\n5. idempotent laws:\n   a. a Or ⇔ a\n   b. a And ⇔ a\n6. identity\
    \ laws:\n   a. Or false ⇔ a\n   b. Or True ⇔ true\n   c. a And ⇔ false\n   d.\
    \ a True ⇔ a\n7. negation laws:\n   a. a Or Not a ⇔ true\n   b. a And Not a ⇔\
    \ false\n8. absorption laws:\n   a. a Or (a And b) ⇔ a\n   b. a And (a Or b) ⇔\
    \ a\n9. De Morgan's laws:\n   a. Not (a Or b) ⇔ Not a And Not b\n   b. Not (a\
