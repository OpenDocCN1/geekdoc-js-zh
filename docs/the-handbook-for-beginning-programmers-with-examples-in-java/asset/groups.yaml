    \nWhy does the getDiscountRate function require two parameters? In other words,\
    \ what rule does the insurance company have that requires getDiscountRate to have\
    \ two parameters?\n\n# Example 3\n\nWrite a function (header and body) that computes\
    \ and returns the average of three numbers.\n\n```\n// Computes and returns the\
    \ average of three numbers.\nfunction average(a, b, c) {\n  var sum = a + b +\
    \ c;\n  var avg = sum / 3;\n  return avg;\n}\n```"
  - "[PAGE 134]\n\n# Example 4\n\nWrite a function that takes two parameters and computes\
    \ and returns the value of this equation: $f(a,r) = a \\times (1 + r)$.\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_134_0.png)\n\
    \n# Calling a Function\n\n**Calling** or **invoking** a function causes the computer\
    \ to execute the code in that function. If you write a function, but never write\
    \ a call to that function, then the code in that function will never be executed.\
    \ To call a function, simply write its name followed by the data, known as **arguments**.\
    \ Which the function will need to perform its task. An argument can be a constant\
    \ such as 23, a string literal such as 'Idaho', or a variable. If you use variables\
    \ as arguments in a function call, the names of the arguments do not have to match\
    \ the names of the parameters. However, the order of the arguments must match\
    \ the order of the parameters.\n\n# Template\n\n```\nfunctionName(arg1, arg2,\
    \ ... argN);\n```\n\n# Example 5\n\nWrite the code to call a function that has\
    \ this header:\nfunction drawCircle(centerX, centerY, radius)\n\n```\nfunction\
    \ run() {\n  var x = parseInt(document.getElementById('xInputBox').value);\n \
    \ var y = parseInt(document.getElementById('yInputBox').value);\n  var radius\
    \ = parseInt(document.getElementById('radiusInputBox').value);\n  drawCircle(x,\
    \ y, radius);\n}\n```\n\n# Example 6\n\nWrite code to call a function that has\
    \ this header:\nfunction drawRectangle(x, y, width, height)\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_134_1.png)"
- md: "\nTo call a function and assign its result to a variable the result can be\
    \ used later, write a line that includes the variable name that will hold the\
    \ result, the assignment operator (=), the function name, and the arguments to\
    \ the function.\n\n## Template\n\n```\nvarName = functionName(arg1, arg2, ...\
    \ argN);\n```\n\n## Example 7\n\nWrite code to call the square root function found\
    \ in the Math object and assign the result returned from it to a variable named\
    \ n. The square root function has this header:\n\n```\nfunction testSqrt() {\n\
    \  var value = 73.1;\n  var rt = Math.sqrt(value);\n  document.getElementById('outputDiv').innerHTML\
    \ = rt;\n}\n```\n\n## Example 8\n\nWrite code to call a function named computeCaloriesBurned\
    \ and store the result returned from the function in a variable named calories.\
    \ The function has this header:\n\n```\nfunction computeCaloriesBurned(distance,\
    \ elevation, weight)\n```\n\n![](img/ef8ee93db95f659f7e069bbfe140b87b_135_0.png)\n\
    \n> **Figure 30:** Demonstration of a function call, showing how the arguments\
    \ are assigned to the parameters and showing that when the computer is finished\
    \ executing the function, the result is returned from the function to the call\
    \ point.\n\n## Variable Scope\n\nThe scope determines how long that variable exists\
    \ and where it can be used. Within a JavaScript program, there are two categories\
    \ of scope: local and global. A local variable is declared inside a function,\
    \ exists for as long as its containing function is executing, and can be used\
    \ within its containing function only. A global variable is declared outside all\
    \ functions, exists for as long as its containing file is loaded in the computer's\
    \ memory, and can be used within all functions in its containing file. Parameters\
    \ are local variables because they are declared within a function, specifically\
    \ within a function's header.\n\n## JavaScript Variable Scope\n\n| | Local | Global\
    \ |\n|---|---|---|\n| Where Declare | Inside a function | Outside all functions\
    \ |\n| Owner | The function where the variable is declared | The JavaScript program,\
    \ or more accurately, the HTML file that contains the script tag where it is declared\
    \ |\n| Lifetime | Only as long as its containing function is executing | As long\
    \ as its containing HTML file is loaded in the memory |\n| Where Usable | Only\
    \ inside the function where it is declared | In all functions in the JavaScript\
    \ program |\n\nBecause local variables are visible only within the function where\
    \ they are declared, you can declare two variables with the same name as long\
    \ as they are declared in different functions. In the example code below there\
    \ are two functions each with a local variable named length and a local variable\
    \ named area. The variables are entirely separate and do not conflict in any way\
    \ the scope of each variables is within the function where it is declared.\n\n\
    ## Example 9\n\n```\nfunction squareArea(length) {\n  var area = length * length;\n\
    \  return area;\n}\n\nfunction rectangleArea(width, length) {\n  var area = width\
    \ * length;\n  return area;\n}\n```\n\n## Advantages of Functions\n\nThere are\
    \ multiple advantages to writing statements inside a function instead of outside\
    \ of all functions, including:\n\n- 1. Control of execution – JavaScript statements\
    \ that are inside an HTML script tag but outside of all functions are executed\
    \ immediately when a document is read into memory by a browser. Statements that\
    \ are inside a function are not executed until a function is called which gives\
    \ the programmer control over when statements are executed.\n- 2. Code reuse –\
    \ After a function is written it can be reused again and again by calling it from\
    \ multiple locations in a program.\n- 3. Less code – Because a programmer can\
    \ reuse code, he does not have to write as much code.\n- 4. Fewer coding mistakes\
    \ – writing code will naturally lead to fewer mistakes because there is simply\
    \ less code to contain the mistakes.\n- 5. Better organization\n- 6. Easier to\
    \ read and understand\n- 7. Easier to debug\n- 8. Faster execution – Because a\
    \ program with well written functions contains less code, that program will very\
    \ likely load faster and execute faster.\n- 9. Variable name reuse – Because variables\
    \ declared inside a function are local to that function only, a programmer can\
    \ reuse variable names in different functions.\n\n## Summary of Terms\n\n| module\
    \ | description |\n|---|---|\n| module | part of a program; can refer to a very\
    \ large part of a program, including many files and functions, or can refer to\
    \ a small part of a program such as a single function |\n| function | the smallest\
    \ part of a program that performs actions, sometimes called a *method*; also the\
    \ JavaScript keyword that begins a function |\n| header | the first line of a\
    \ function; also known as the *signature*; includes the function name and parameter\
    \ list |\n| parameter | a piece of data that a function needs in order to complete\
    \ its task or perform its calculations; parameters are listed in a function's\
    \ header |\n| body | the part of a function that contains the JavaScript code\
    \ that is executed when a function is called; the code in a function's body produces\
    \ the result or return value of that function |\n\n- call point: a location in\
    \ a program where a function is called or invoked\n- argument: the actual value\
    \ that is passed into a function when the function is called; arguments are listed\
    \ at the call point of a function\n- variable scope: the part of a program where\
    \ a variable can be used; also determines how long a variable exists in the computer's\
    \ memory\n- return: the JavaScript keyword that terminates a function and returns\
    \ a value to the call point of the function\n\n## Pseudo Random Integer\n\nThe\
    \ following code example shows how to obtain a pseudo random integer that is in\
    \ the range min inclusive to max exclusive, in other words in the range [min,\
    \ max]. Notice that this code calls both the random and floor functions from the\
    \ Math object.\n\n## Example 10\n\n```javascript\nvar r = min + Math.floor(Math.random()\
    \ * (max - min));\n```\n\nDesk Check\n\n| min | max | Math.random | r |\n|---|---|---|---|\n\
    | 5 | 11 | 0.483 | |\n\n## Code Reuse\n\nThe most reusable functions are ones\
    \ that perform only calculations and do not perform user input and output. Chapter\
    \ 6 contains code to determine if an integer is even or odd. Examples 11 and 12\
    \ below contain the same code split into two functions: doOutput and isEven. The\
    \ first function gets the user input, calls the second function, and displays\
    \ the result to the user. The first function is certainly useful in this program\
    \ but is not reusable in another program because it requires a text field with\
    \ an id of \"number\" and a div with an id of \"output\". The second function\
    \ does only one thing: determine if an integer is even or odd. Because the second\
    \ function does only calculations (it does not get user input nor display results\
    \ to the users), the second function is reusable in other programs. can be used\
    \ in any program that needs to determine if an integer is even or odd regardless\
    \ of where the input comes from.\n\n9. Functions\n\n## Example 11\n\n```html\n\
    <!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>isEven</title>\n\
    <script type=\"text/javascript\">\n/* Input: An integer\n * Processing: Determine\
    \ if the integer is even or not\n * Output: A message stating if the integer is\
    \ even or not\n */\nfunction doOutput() {\n  var number = parseInt(document.getElementById('numberInput').value);\n\
    \  var result = isEven(number);\n  document.getElementById('outputDiv').innerHTML\
    \ = number + ' is even: ' + result;\n}\n\n// Returns true if value is even\n//\
    \ integer; otherwise returns false.\nfunction isEven(value) {\n  if (value % 2\
    \ == 0) {\n    return true;\n  } else {\n    return false;\n  }\n}\n</script>\n\
    </head>\n<body>\nPlease enter an integer: <input type=\"text\" id=\"numberInput\"\
    >\n<button type=\"button\" onclick=\"doOutput()\">Is Even?</button>\n<div id=\"\
    outputDiv\"></div>\n</body>\n</html>\n```\n\nDeck Check\n\n| number | value %\
    \ 2 | return |\n|---|---|---|\n| 8 | | |\n\nBecause the isEven function returns\
    \ a boolean value, we can write it without the if statement. Eliminating the if\
    \ statement makes the function easier to test because the function will contain\
    \ only one path of execution instead of two.\n\n## Example 12\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Is Even</title>\n\
    <script type=\"text/javascript\">\n/* Input: An integer\n * Processing: Determine\
    \ if the integer is even or not\n * Output: A message stating if the integer is\
    \ even or not\n */\nfunction doOutput() {\n  var number = parseInt(document.getElementById('numberInput').value);\n\
    \  var result = isEven(number);\n  document.getElementById('outputDiv').innerHTML\
    \ = number + ' is even: ' + result;\n}\n\n// Returns true if value is an even\n\
    // integer; otherwise returns false.\nfunction isEven(value) {\n  return (value\
    \ % 2) == 0;\n}\n</script>\n</head>\n<body>\nPlease enter an integer: <input type=\"\
    text\" id=\"numberInput\">\n<button type=\"button\" onclick=\"doOutput()\">Is\
    \ Even?</button>\n<div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\nDeck\
    \ Check\n\n| number | result |\n|---|---|\n"
  mdcn: "\n\n要调用函数并将其结果赋值给变量以便以后使用该结果，请编写一行代码，其中包含将存储结果的变量名、赋值运算符 (`=``)函数名以及函数的参数。\n\
    \n## 模板\n\n```\nvarName = functionName(arg1, arg2, ... argN);\n```\n\n## 示例 7\n\
    \n编写代码来调用 `Math` 对象中的平方根函数，并将其返回的结果赋值给名为 `n` 的变量。平方根函数的头定义如下：\n\n```\nfunction\
    \ testSqrt() {\n  var value = 73.1;\n  var rt = Math.sqrt(value);\n  document.getElementById('outputDiv').innerHTML\
    \ = rt;\n}\n```\n\n## 示例 8\n\n编写代码来调用名为 `computeCaloriesBurned` 的函数，并将返回的结果存储在名为\
    \ `calories` 的变量中。该函数的头定义如下：\n\n```\nfunction computeCaloriesBurned(distance,\
    \ elevation, weight)\n```\n\n![](img/ef8ee93db95f659f7e069bbfe140b87b_135_0.png)\n\
    \n> **图 30：** 函数调用演示，展示了参数如何分配给参数，并展示了当计算机执行函数完成后，结果如何从函数返回到调用点。\n\n## 变量作用域\n\
    \n作用域决定了变量存在多久以及可以在何处使用它。在 JavaScript 程序中，作用域分为两类：局部和全局。局部变量声明在函数内部，其生命周期与其包含的函数执行周期相同，且只能在其所属函数中使用。全局变量声明在所有函数外部，其生命周期与其包含的文件加载到计算机内存中的时间一致，并且可以在该文件中的所有函数中使用。参数是局部变量，因为它们是在函数内部声明的，具体是在函数的头部中。\n\
    \n## JavaScript 变量作用域\n\n| | 局部 | 全局 |\n|---|---|---|\n| 声明位置 | 函数内部 | 所有函数外部\
    \ |\n| 所有者 | 声明变量的函数 | JavaScript 程序，或者更准确地说，是包含该声明脚本标签的 HTML 文件 |\n| 生命周期 | 仅限于其所属函数的执行期间\
    \ | 只要其所属的 HTML 文件加载在内存中 |\n| 使用位置 | 仅在声明它的函数内部 | 在 JavaScript 程序中的所有函数中 |\n\n\
    由于局部变量仅在声明它的函数内部可见，只要它们在不同的函数中声明，你就可以声明两个相同的变量。在下面的示例代码中，有两个函数，每个函数都有一个名为 `length`\
    \ 和一个 `area` 的局部变量。这些变量是完全独立的，不会发生任何冲突，每个变量的作用域都在声明它的函数内部。\n\n## 示例 9\n\n```\n\
    function squareArea(length) {\n  var area = length * length;\n  return area;\n\
    }\n\nfunction rectangleArea(width, length) {\n  var area = width * length;\n \
    \ return area;\n}\n```\n\n## 函数的优点\n\n在函数内部编写语句而不是在所有函数外部有多个优点，包括：\n\n- 1. 执行控制\
    \ – 位于 HTML 脚本标签内但在所有函数外的 JavaScript 语句会在浏览器将文档读入内存时立即执行。函数内部的语句在函数被调用之前不会执行，这让程序员可以控制语句执行的时机。\n\
    - 2. 代码复用 – 函数编写后，可以通过从程序中的多个位置调用它来重复复用。\n- 3. 代码更少 – 因为程序员可以复用代码，所以不需要编写那么多代码。\n\
    - 4. 更少的编码错误 – 编写代码自然会导致错误更少，因为包含错误的代码量变小了。\n- 5. 更好的组织结构\n- 6. 更易阅读和理解\n- 7.\
    \ 更容易调试\n- 8. 执行速度更快 – 因为编写良好的函数程序包含的代码较少，该程序很可能加载更快、执行更快。\n- 9. 变量名复用 – 因为在函数内部声明的变量是该函数的局部变量，程序员可以在不同的函数中复用变量名。\n\
    \n## 术语总结\n\n| 模块 | 说明 |\n|---|---|\n| 模块 (module) | 程序的一部分；可以指代程序的很大部分（包括许多文件和函数），也可以指程序的一个小部分，例如单个函数\
    \ |\n| 函数 (function) | 程序中执行操作的最小单元，有时称为*方法* (method)；也是起始函数的 JavaScript 关键字 |\n\
    | 头部 (header) | 函数的第一行；也称为*签名* (signature)；包括函数名和参数列表 |\n| 参数 (parameter) | 函数完成任务或执行计算所需的数据；参数列在函数的头部中列\
    \ |\n| 主体 (body) | 函数中包含在调用函数时执行的 JavaScript 代码的部分；函数体中的代码产生该函数的结果或返回值 |\n\n-\
    \ 调用点 (call point): 程序中调用或触发函数的位置\n- 参数 (argument): 当函数被调用时传入函数的实际值；参数在函数的调用点处列出\n\
    - 变量作用域 (variable scope): 程序中可以使用该变量的部分；也决定了变量在计算机内存中存在多长时间\n- 返回 (return): 用于终止函数并将值返回给函数调用点的\
    \ JavaScript 关键字\n\n## 伪随机整数\n\n下面的代码示例展示了如何获取一个在 min（包含）到 max（不包含）范围内的伪随机整数，换句话说就是在\
    \ [min, max] 范围内。注意这段代码调用了 `Math` 对象中的 `random` 和 `floor` 函数。\n\n## 示例 10\n\n\
    ```javascript\nvar r = min + Math.floor(Math.random() * (max - min));\n```\n\n\
    逻辑检查 (Desk Check)\n\n| min | max | Math.random | r |\n|---|---|---|---|\n| 5 |\
    \ 11 | 0.483 | |\n\n## 代码复用\n\n可复用的函数是那些只执行计算而不执行用户输入输出的函数。第 6 章包含了判断整数是偶数还是奇数的代码。下面的示例\
    \ 11 和 12 包含相同的代码，拆分为两个函数：`doOutput` 和 `isEven`。第一个函数获取用户输入，调用第二个函数，并将结果显示给用户。第一个函数在这个程序中很有用，但在另一个程序中不可复用，因为它需要一个\
    \ id 为 \"number\" 的文本框和一个 id 为 \"output\" 的 `div` 元素。第二个函数只做一件事：判断整数是偶数还是奇数。由于第二个函数只进行计算（它不获取用户输入也不向用户显示结果），因此第二个函数在其他程序中是可以复用的。它可以在任何需要判断整数奇偶性的程序中使用。\n\
    \n9. 函数\n\n## 示例 11\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"utf-8\">\n<title>isEven</title>\n<script type=\"text/javascript\"\
    >\n/* 输入: 一个整数\n * 处理: 判断整数是偶数还是奇数\n * 输出: 关于该整数是偶数还是奇数的消息\n */\nfunction doOutput()\
    \ {\n  var number = parseInt(document.getElementById('numberInput').value);\n\
    \  var result = isEven(number);\n  document.getElementById('outputDiv').innerHTML\
    \ = number + ' is even: ' + result;\n}\n\n// 如果是偶数则返回 true，否则返回 false\nfunction\
    \ isEven(value) {\n  if (value % 2 == 0) {\n    return true;\n  } else {\n   \
    \ return false;\n  }\n}\n</script>\n</head>\n<body>\n输入整数：<input type=\"text\"\
    \ id=\"numberInput\">\n<button type=\"button\" onclick=\"doOutput()\">Is Even?</button>\n\
    <div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\n逻辑检查 (Desk Check)\n\n|\
    \ number | value % 2 | return |\n|---|---|---|\n| 8 | | |\n\n由于 `isEven` 函数返回一个布尔值，我们可以不使用\
    \ `if` 语句来编写它。消除 `if` 语句使函数更容易测试，因为函数只包含一条执行路径而不是两条。\n\n## 示例 12\n\n```html\n\
    <!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Is\
    \ Even</title>\n<script type=\"text/javascript\">\n/* 输入: 一个整数\n * 处理: 判断整数是偶数还是奇数\n\
    \ * 输出: 关于该整数是偶数还是奇数的消息\n */\nfunction doOutput() {\n  var number = parseInt(document.getElementById('numberInput').value);\n\
    \  var result = isEven(number);\n  document.getElementById('outputDiv').innerHTML\
    \ = number + ' is even: ' + result;\n}\n\n// 如果是偶数则返回 true，否则返回 false\nfunction\
    \ isEven(value) {\n  return (value % 2) == 0;\n}\n</script>\n</head>\n<body>\n\
    输入整数：<input type=\"text\" id=\"numberInput\">\n<button type=\"button\" onclick=\"\
    doOutput()\">Is Even?</button>\n<div id=\"outputDiv\"></div>\n</body>\n</html>\n\
    ```\n\n逻辑检查 (Desk Check)\n\n| number | result |\n|---|---|\n\n"
