    \ of the function) completely determines another value (the result of the function).\
    \ Consider the function $f$ with one argument $x$: $f(x) = 2x - 1$. We can substitute\
    \ any number for the argument $x$ which completely determines the result of the\
    \ function $f$. For example, substituting 5 for $x$ produces 9 as the result of\
    \ the function: $f(5) = 2(5) - 1 = 9$. Functions in a computer program work in\
    \ a similar way, taking arguments and producing results.\n\n# Chapter Outcomes\n\
    \nBy the end of this chapter you will:\n\n- Write functions that accept and use\
    \ parameters.\n- Write code to return a value from a function to its call point.\n\
    - Write code to call a function and pass arguments to that function.\n- Write\
    \ code to store the result returned from a function in a variable.\n- Distinguish\
    \ between a parameter and an argument.\n- Distinguish between displaying output\
    \ for the user to see and returning a value to be used by the program.\n- Understand\
    \ local variable scope.\n\n# Writing a Function\n\nTo write a function in JavaScript,\
    \ simply type code that matches this template.\n\n# Template\n\n```javascript\n\
    function functionName(param1, param2, ... paramN) {\n  statements;\n  return value;\n\
    }\n```\n\nThe first line of a function is called the header or signature, and\
    \ it includes\n\n1. the keyword function\n2. the function name\n3. the parameter\
    \ list\n\nThe function name must start with a letter, the underscore (_), or the\
    \ dollar sign ($). The rest of the name must be made of letters, digits (0–9),\
    \ the underscore, or the dollar sign. A function name cannot include spaces. It\
    \ should be a meaningful name that curtly describes what the function does. The\
    \ parameter list contains data stored in variables that the function needs to\
    \ complete its task.\n\nThe statements inside a function are called the body of\
    \ the function. A function may contain as many statements as you wish to write\
    \ inside of it. However, it is a good idea to limit functions to less than a page\
    \ (60 lines) long. To return a result from a function so that the result can be\
    \ used somewhere else in your program, simply type the keyword followed by whatever\
    \ value.\n\n# Example 1\n\nWrite the header for a function named drawCircle that\
    \ takes three parameters: the x and y values for the center of the circle and\
    \ the radius.\n\n```javascript\nfunction drawCircle(centerX, centerY, radius)\n\
