    | Roman | Arabic |\n|---|---|\n| I | 1 |\n| V | 5 |\n| X | 10 |\n| L | 50 |\n\
    | C | 100 |\n| D | 500 |\n| M | 1000 |\n\nThe rules for writing Roman numerals\
    \ are\n\n- a. Thousands, hundreds, tens, and ones are expressed separately.\n\
    - b. The numbers 1 to 9 are I, II, III, IV, V, VI, VII, VIII, IX\n- c. Tens are\
