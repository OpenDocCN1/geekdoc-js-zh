    \n# if ... else ... else ...\n\nUse when:\n\n- - More than two choices exist\n\
    - Each choice is based on different variables or uses an operator other than equals\
    \ (==)\n\n# Template\n\n```\nif (condition) {\n    statements;\n} else if {\n\
