    \ $d = \\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$。\n\n# 示例 24\n\n示例 24 包含一个从用户读取点\
    \ $x$ 和 $y$ 值并计算这些点之间距离的程序。注意将文本转换为数字。\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"\
