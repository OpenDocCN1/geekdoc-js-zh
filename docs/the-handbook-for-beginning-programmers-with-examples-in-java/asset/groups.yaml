    \n# Chapter Outcomes\n\nBy the end of this chapter you will be able to:\n\n- Read\
    \ and write simple JavaScript programs embedded inside HTML documents.\n- Write\
    \ a JavaScript program that the computer runs when a user clicks a button.\n-\
    \ Write a JavaScript program that gets input from a popup window and sends output\
    \ to a popup window.\n- Write a JavaScript program that gets input from a text\
    \ field and sends output to an HTML div.\n\n# Starting with JavaScript\n\nUsing\
    \ your text editor, you can write JavaScript code in an HTML file. However, you\
    \ must place the JavaScript code between opening and closing <script> tags as\
    \ shown in example 1. Although it is possible to place <script> tags in the body\
    \ of an HTML document, you should normally place <script> tags in the head of\
    \ your HTML document. The HTML document from example 1 is shown by the Firefox\
    \ web browser in Figure 10.\n\n# Example 1\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en-us\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>My First JavaScript Program</title>\n\
