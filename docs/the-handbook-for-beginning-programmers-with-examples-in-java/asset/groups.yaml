    # Programming Assignments


    - 1. Write a function named extractGivenName with one parameter named fullName.
    The parameter fullName will always contain a person''s family and given names
    in that order separated by comma, and a single space, for example "Reagan, Ronald"
    (without the quotation marks). The function should extract and return the person''s
    given name, for example "Ronald" (without the quotation marks).


    - 2. Write a function named prefix that returns the common prefix of two strings.
    For example, the common prefix of "disable" and "distasteful" is "dis". This function
    takes two parameters and returns the common prefix.


    - 3. Write a function named suffix that returns the common suffix of two strings.
    For example, the common suffix of "swimming" and "walking" is "ing". This function
    takes two parameters and returns the common suffix.


    - 4. Write a function named switchCase that receives a parameter named s. This
    function must return a new string that contains the same characters as s but with
    the case of every character switched. For example if switchCase were called like
    this: switchCase("Catch 22"); it would return "CATCH 22" (without the quotes).


    - 5. Write a function named titleCase with one parameter named s. This function
    returns a copy of s but with the first letter of each word capitalized.


    # Appendix A. Operator Precedence


    Operator precedence determines the order in which the computer evaluates operators.
    Operators with higher precedence are evaluated first. For example: 7 + 3 * 2 is
    13 because multiplication has a higher precedence than addition, so the computer
    performs the multiplication before the addition.


    ## Associativity


    Operator associativity determines the order in which the computer evaluates operators
    of the same precedence. There are two categories of associativity, left to right
    and right to left. Consider the expression: a OP1 b OP2 c


    ## Left to Right Associativity


    IF OP1 and OP2 have the same precedence and left associativity (left to right)
    then the computer will evaluate the expression as: (a OP1 b) OP2 c. For example,
    the computer evaluates 3 - 5 + 4 as (3 - 5) + 4 which is 2.


    ## Right to Left Associativity


    IF OP1 and OP2 have the same precedence and right associativity (right to left)
    then the computer will evaluate the expression as: a OP1 (b OP2) c. For example,
    the computer evaluates a - b - 5 as a - (b - 5) by first storing 5 in b, then
    storing the value of b in a.


    ## Precedence


    Listed from highest precedence (evaluated first) to lowest precedence


    | Operator(s) | Name(s) | Associativity |

    |---|---|---|

    | () | parentheses | n/a |

    | - | member | left to right |

    | ++ -- | increment, decrement | n/a |

    | +- ~ | unary plus, negation, logical not, bitwise not | right to left |

    | * / % | multiplication, division, modulus | left to right |

    | + | addition, subtraction | left to right |

    | << >>> | bitwise shift | left to right |

    | < == | relational | left to right |

    | == != | equality | left to right |

    | & | bitwise and | left to right |

    | ^ | bitwise exclusive or (xor) | left to right |

    | && | logical and | left to right |

    | || | logical or | left to right |

    | ? | conditional | right to left |

    | = /= % | assignment operators | right to left |

    | <= >= >>> | | |

    | ^= |= | comma | left to right |


    # Appendix B. Robust Code


    There is an old computer joke that goes like this. A consultant went to a large
    company to teach the software engineers in the company. At the beginning of the
    class she said, "If you had written the software that runs the airplane, how many
    of you would be afraid to get off?" Every student except one put his hand up.
    The consultant looked at the one student who didn''t raise his hand and asked,
    "What would you do differently so that you wouldn''t be afraid?" - The student
    answered, "Ha! If I had written the software, it would never get off."


    Below are some programming practices that make your software robust (fewer errors)
    and help you rest easy at night:


    - Turn on compiler warnings and ignore them.

    - Follow generally accepted coding standards, including naming conventions.

    - Write and use assertions. Test primarily.

    - Write and execute unit tests and don''t ignore failures.

    - Whenever possible, write simple, straight code. For example when writing in
    JavaScript, Java, and C++, do not use left shift operator (<<) to multiply by
    a power of two. Instead use multiplication (*) to perform the task.

    - Minimize the number of execution paths through your code.

    - Write each function with only one exit point (return statement).

    - Consider writing a tricky twice, once with a straight forward, once with a sophisticated,
    fast solution. In the debugging version of your program use the results. When
    writing in a language that has exceptions, never return codes from a function.
    Throw exceptions to indicate an error.


