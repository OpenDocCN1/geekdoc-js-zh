    \ 的弹出窗口，如图 11 所示。\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_41_0.png)\n\n图 10：一个在\
    \ Firefox 中绘制的带有单个按钮的简单 HTML 文档。\n\n要运行示例 1 中的程序，只需将示例 1 中显示的所有代码（如果你是在阅读电子书，请复制并粘贴代码）输入到文本编辑器中。不要输入或复制行号。以\
