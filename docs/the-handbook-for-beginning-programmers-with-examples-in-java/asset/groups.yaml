    # # Chapter 11. Objects


    When a programmer writes a large program, it is difficult for the programmer to
    keep all the code organized. One way to keep the code in a large program organized
    is to use object oriented programming. Object oriented programming is a way of
    viewing the world and designing and implementing software that matches the world.


    # ## Chapter Outcomes


    By the end of this chapter you will:


    +   - Understand the terms object and class

    - Understand object-oriented relationships aggregation, composition, inheritance,
    dependency, and association

    - Understand multiparticle applied to aggregation, composition, and association

    - Read a UML class diagram

    - Create a JavaScript object from a built-in prototype object

    - Access an attribute from a JavaScript object

    - Call a function from a JavaScript object


    An **object** is anything in the world that has these four things:


    +   - Identity: A unique name or identification number


    +   - Data: These are characteristics of an object and are usually adjectives.
    These are also called attributes, properties, characteristics, fields, instance
    variables, or structure.


    +   - Behavior: These are the things an object does and are usually verbs. These
    are also called functions, operations, methods, or procedures.


    +   - Relationships: These are links or connections between objects.


    A **class** is both a group of similar objects and a pattern for creating objects.
    Since an object has identity, data, behavior, and relationships and since a class
    is a pattern for creating objects, then a class must have those four things as
    well.'
  - '[PAGE 177]


    # The Unified Modeling Language


    Many programmers use diagrams to design and document the classes and objects in
    their programs. The most common language used for these diagrams is the Unified
    Modeling Language (UML). One type of diagram in the UML is the **class diagram**.
    Figure 38 shows a UML class diagram with two classes. Within a class diagram,
    each class is shown as a rectangle usually with three sections. The first section
    contains the name of the class. The second section contains a list of the data
    that all objects created from the class will have. The third section contains
    a list of the behaviors that all objects created from the class will have.


    | Student | Course |

    | --- | --- |

    | -firstName | -number |

    | -lastName | -title |

    | -address | -description |

    | -phone | -location |

    | +changeName() | +open() |

    | +register() | +allowStudent() |

    | +attendClass() | +close() |


    **Figure 38:** A UML class diagram showing two classes.


    # Relationships


    There are several different relationships that can exist between objects or classes.
    Relationships between classes are shown as different types of lines connected
    to the classes.


    # Aggregation


    A relationship between two objects such that one object contains the other object.
    This is sometimes called a *whole* part relationship. In order to use aggregation
    between two objects *whole* and *part*, one of these English phrases must make
    sense: *whole* contains *part* or *whole* has a *part*. The UML symbol for aggregation
    is a solid line with an unfilled diamond connected to the containing class:


    | Whole | Part |

    | --- | --- |


    A relationship between two objects such that one object contains the other object
    and the contained object may not be shared. This is also a whole part relationship
    and a strong form of aggregation. In order to use composition between two objects
    *whole* and *part*, one of these English phrases must make sense: *whole* contains
    *part* or *whole* has a *part*. The UML symbol for aggregation is a solid line
    with a filled diamond connected to the containing class:


    | Whole | Part |

    | --- | --- |'
  - '[PAGE 178]


    # Inheritance


    A relationship between classes that causes the child class to automatically have
    everything (data, behavior, and relationships) that the parent class has. In order
    to use inheritance between two objects parent and child, one of these English
    phrases must make sense: child is a kind of parent or child is a parent. The UML
    symbol for inheritance is a solid line with an unfilled triangle connected to
    the parent class.


    | Parent | Child |

    |---|---|

    | | |


    # Dependency


    A relationship between two objects such that one object requires or uses the other
    object to accomplish a task. In order to use dependency between two objects x
    and y, one of these English phrases must make sense: x uses y or x requires y
    or x needs y. The UML symbol for dependency is a dashed line with an open arrow
    head connected to the required or needed class.


    | Needed | Needy |

    |---|---|

    | | |


    # Association


    A general relationship between objects. When two objects are related but the relationship
    is not aggregation, composition, inheritance, or dependency, then use association.
    The UML symbol for association is a solid line.


    | A | B |

    |---|---|

    | | |'
- md: "\n## Multiplicities\n\nMultiplicities are small numbers and punctuation at\
    \ one or both ends of a relationship that constrain the relationship. A single\
    \ number multiplicity constrains a relationship to exactly that number of objects.\
    \ Two or more numbers separated by commas constrain a relationship to exactly\
    \ one of those numbers. Two numbers separated by two periods (.) constrain a relationship\
    \ to a range of objects. For example, multiplicities may be used to show that\
    \ one egg carton has either 12 or 18 eggs inside it as shown in Figure 39.\n\n\
    | Carton | Egg |\n|---|---|\n| | 12, 18 |\n\n**Figure 39:** A UML class diagram\
    \ showing two classes with multiplicities.\n\n| Multiplicity | Meaning |\n|---|---|\n\
    | 1 | Exactly one |\n| 4,8 | Exactly four or exactly eight |\n| 0,1 | Zero or\
    \ one, also known as optional | |\n| 0..1 | Zero or one, also known as optional\
    \ |\n| 12..18 | Between 12 and 18 inclusive |\n| 0.* | Zero or more |\n| * | Zero\
    \ or more |\n| 1.* | One or more, also known as at least one |\n| 3..* | Three\
    \ or more, also known as at least three |\n\n## Example 1\n\nLabel the parts of\
