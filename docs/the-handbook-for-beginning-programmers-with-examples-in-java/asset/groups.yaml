    \ 15%。注意。\n\n## 第 6 章 选择\n\n为了使计算机程序有用，计算机必须能够做出决策。计算机通过评估条件来做出决策，如果条件为真，则选择一组语句；如果条件为假，则选择另一组语句。这种决策能力被称为选择，因为计算机正在选择一组语句或另一组语句来执行。选择语句也称为语句，因为它以\
    \ `if` 开头。\n\n## 章节目标\n\n在本章结束时，你将能够读和写：\n\n* 带单个条件的 `if` 语句\n* 嵌套 `if` 语句\n*\
    \ `if...else...else` 语句\n* 可替代 `if...else...else` 语句的 `switch` 语句\n\n## 关系运算符\n\
    \n选择语句始终有一个条件，这是计算机用于选择的测试。条件始终评估为真或假。任何评估为真或假的表达式被称为布尔表达式，以英国数学家乔治·布尔（George\
    \ Boole）命名。JavaScript 关系运算符可以测试两个值之间的关系并产生真或假。\n\n### JavaScript 关系运算符\n\n| 运算符\
