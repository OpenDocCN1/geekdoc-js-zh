- md: "\n# Increment and Decrement Operators\n\nJavaScript includes two more shortcut\
    \ operators called the increment and decrement operators. The increment operator\
    \ (++) simply adds one to the value of a variable. The decrement operator (--)\
    \ subtracts one from the value of a variable.\n\n| Operator | Name | Example |\
    \ Equivalent Expressions |\n|---|---|---|---|\n| ++ | pre-increment | ++x; | x\
    \ = 1; x = x + 1; |\n| | post-increment | x++; | |\n| -- | pre-decrement | --t;\
    \ | t = 1; t = t - 1; |\n| | post-decrement | t--; | |\n\nBoth the increment and\
    \ decrement operators can be written as a pre or post operator. If you write one\
    \ of these before a variable name, such as ++x, then it is a pre-increment, meaning\
    \ the computer will perform the increment before the rest of the arithmetic in\
    \ the same statement. If you write one of the operators after a variable name,\
    \ such as x++, it is a post-increment, meaning the computer will perform the increment\
    \ after the rest of the arithmetic in the same statement. However, if you use\
    \ the increment or decrement operator in a statement all by itself, then it makes\
    \ no difference whether you use the pre or post version. The next two examples\
    \ show how pre and post-increment work when written inside a larger statement.\n\
    \n# Example 18\n\n```\nvar a = 4;\nvar b = ++a * 3 + 2;\n```\n\n| a | b |\n|---|---|\n\
    | 4 | 17 |\n| 5 | |\n\n# Example 19\n\n```\nvar a = 4;\nvar b = a++ * 3 + 2;\n\
    ```\n\n| a | b |\n|---|---|\n| 4 | 14 |\n| 5 | |\n\nNotice in example 18, line\
    \ 1 causes the computer to store the number 4 in a. On line 2, because the increment\
    \ operator is written as a pre-increment, the the computer first adds 1 to the\
    \ value of a and then performs the rest of the calculations on line 2 which results\
    \ in 17 being stored in the variable b.\n\n## 5. Variables and Arithmetic\n\n\
    In example 19, line 1 causes the computer to store the number 4 in the variable\
    \ *a*. On line 2, because the increment operator is written as a post-increment,\
    \ the computer first performs the other calculations on line 2 which results in\
    \ 14 being stored in *b* and notice in example 19 that incrementing *a* does not\
    \ affect the value of *b* because the increment is a post-increment and the computer\
    \ increments *a* after calculating the value of *b*.\n\nWhen a new programmer\
    \ understands the post-increment operator, the most common question she asks is\
    \ \"Why? Why would anyone ever use the post-increment operator to change the value\
    \ of a variable after the other calculations in the same statement? The answer\
    \ is \"to prepare the incremented variable (*a* in examples 18 and 19) to be used\
    \ later in the program.\"\n\nWhen writing the increment or decrement operator,\
    \ remember that it makes no difference whether you write the pre or post version\
    \ of the operators if the operator is in a statement all by itself. For example:\n\
    \n```\na++;\n```\n\nHere are three more examples of using the increment and decrement\
    \ operators.\n\n# Example 20\n\n| Desk Check |\n| x | y |\n|---|---|\n| var x\
    \ = 3; var y = ++x * 2 + 5; |\n\n# Example 21\n\n| Desk Check |\n| x | y |\n|---|---|\n\
    | var x = 3; var y = ++x * 2 + 5; |\n\n# Example 22\n\n| Desk Check |\n| q | s\
    \ |\n|---|---|\n| var q = 7; var s = 2 + 18 / --q; |\n\n# Operator Precedence\
    \ Revisited\n\nThe following table shows the precedence for all the JavaScript\
    \ arithmetic operators shown in this chapter.\n\n# JavaScript Arithmetic Operator\
    \ Precedence\n\n| Operator(s) | Name(s) | Precedence |\n|---|---|---|\n| ( ) |\
    \ parentheses | Highest (evaluated first) |\n| ++ -- | negation, increment, decrement\
    \ | |\n| * / % | multiplication, division, modulus | |\n| + | addition, subtraction\
    \ | |\n| = += -= *= /= /= %== | assignment operators | Lowest (evaluated last)\
    \ |\n\nRemember that the pre-increment is always executed before the rest of the\
    \ arithmetic in the the same statement, and the post-increment, even though it\
    \ has a higher precedence, is always executed after the rest of the arithmetic\
    \ in the same statement.\n\n# Math Object\n\nThe Math object is an object (see\
    \ chapter 11) built into JavaScript that enables a program to perform more advanced\
    \ mathematical computations. It contains the following mathematical constants\
    \ and functions, all of which must be preceded by \"Math.\" when you use them\
