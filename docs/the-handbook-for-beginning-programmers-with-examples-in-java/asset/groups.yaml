  mdcn: "\n\n## 查找值（线性搜索）\n\n计算机程序经常需要确定某个值是否存储在数组中；如果存储在数组，则返回该值的位置。要查找的值被称为“键”（key）。如果数组不是很大（可能少于\
    \ 100 个元素），可以使用线性搜索轻松找到键。线性搜索通过将数组中的每个元素与键进行比较来完成，直到在数组中找到键或到达数组末尾。\n\n线性搜索的优点是简单且易于编码。缺点是如果数组中有许多元素，它的速度太太慢；此时，先对数组进行排序并保持排序，然后使用二分查找在数组中寻找键可能会更快。\n\
    \n下面展示了执行线性搜索的 JavaScript 代码。在示例中，如果在数组中找到了键，搜索函数将返回键在数组中所处的索引位置。如果没有找到键，搜索函数将返回\
    \ 1。\n\n## 示例 15\n\n如果键在列表中，返回键在列表中位置的第一个索引；否则返回 -1。\n\n```javascript\nfor (var\
    \ i = 0; i < list.length; i++) {\n  if (list[i] == key) {\n    return i;\n  }\n\
    }\nreturn -1;\n```\n\n| list | key | i | return | |\n|---|---|---|---|---|\n|\
    \ 28.1 | 20 | 23.6 | 0 | 15 | 23.6 |\n| [0] | [1] | [2] | [3] | [4] | |\n\n##\
    \ 查找范围\n\n有时计算机程序拥有一个数值范围列表，必须找到包含某个值的范围。这类计算问题的示例包括：\n\n- 根据收入范围列表和阶进税率率确定一个人的所得税税率\n\
    - 根据购买范围列表和折扣率确定客户的折扣率\n- 根据销售范围列表和佣金率确定销售人员的佣金\n- 根据分数范围列表和字母等级确定学生的成绩等级\n\n\
    例如，一家公司可能会根据下表向客户提供折扣，折扣率基于购买金额：\n\n| 如果购买金额大于或等于 | 且购买金额小于 | 则折扣率位 |\n| --- |---|---|\n\
    | 0 | $300 | 0% |\n| $300 | $600 | 2.0% |\n| $600 | $1000 | 2.5% |\n| $1000 |\
    \ ∞ | 3.0% |\n\n初级程序员通常会编写如下解决此问题的 JavaScript 解决方案：\n\n## 示例 16\n\n```javascript\n\
    // 计算并返回折后的购买金额。\nfunction getDiscountedAmount(purchase) {\n  var rate = 0;\n\
    \  if (purchase >= 0 && purchase < 300) {\n    rate = 0;\n  }\n  if (purchase\
    \ >= 300 && purchase < 600) {\n    rate = 0.02;\n  }\n  if (purchase >= 600 &&\
    \ purchase < 1000) {\n    rate = 0.025;\n  }\n  if (purchase >= 1000) {\n    rate\
    \ = 0.03;\n  }\n  var discount = purchase * rate;\n  return purchase - discount;\n\
    }\n```\n\n### 模拟检查 (Desk Check)\n| purchase | rate | discount | return |\n|---|---|---|---|\n\
    | $708.00 | | | |\n\n等等，初级程序员意识到独立的 `if` 语句可以用 `else` 连接，并且每个语句的 `else` 部分只有在前面的\
    \ `if` 部分为假时才会执行。这意味着通过移除每个语句的左半部分，可以写出更简洁的代码并获得完全相同的结果。\n\n## 示例 14\n\n```javascript\n\
    // 计算并返回折后的购买金额。\nfunction getDiscountedAmount(purchase) {\n  var rate;\n  if\
    \ (purchase < 300) {\n    rate = 0;\n  } else if (purchase < 600) {\n    rate\
    \ = 0.02;\n  } else if (purchase < 1000) {\n    rate = 0.025;\n  } else {\n  \
    \  rate = 0.03;\n  }\n  var discount = purchase * rate;\n  return purchase - discount;\n\
    }\n```\n\n| purchase | rate | discount | return |\n|---|---|---|---|\n| | | |\
    \ $708.00 |\n\n这两种解决方案的问题在于，如果公司更改了购买金额范围或折扣率，程序员必须更改相应的代码。改进的解决方案是将范围和费率从代码中移除，并将它们放在文件或数据库中，以便计算机在运行程序时可以将它们读入数组。然后，程序员必须编写一个简单的线性搜索方法来找到正确的范围和对应的折扣率，如下例所示。\n\
    \n## 示例 18\n\n```javascript\n// 这些数组中的值可以硬编码\n// 你的程序中，或者更好，可以\n// 从文件或数据库读取。\n\
    var limits = [ 300, 600, 1000 ];\nvar rates = [ 0, 0.02, 0.025, 0.03 ];\n\n//\
    \ 计算并返回折后的购买金额。\nfunction getDiscountedAmount(purchase) {\n  // 查找购买范围。\n  for\
    \ (var i = 0; i < limits.length; i++) {\n    if (purchase < limits[i]) {\n   \
    \   break;\n    }\n  }\n  // 获取对应的折扣率。\n  var rate = rates[i];\n  var discount\
    \ = purchase * rate;\n  return purchase - discount;\n}\n```\n\n### 模拟检查 (Desk\
    \ Check)\n| purchase | rate | discount | return |\n|---|---|---|---|\n| $708.00\
    \ | | | |\n\n## 查找值（二分查找）\n\n如果数组元素是有排序的，那么计算机可以使用更快的二分查找在数组中查找元素。二分查找通过将键与中间元素进行比较完成。如果键大于中间元素，则在右半部分搜索。如果键小于中间元素，则在左半部分搜索。当然，如果键等于中间元素，则找到了键。\n\
    \n## 示例 19\n\n```javascript\n// 如果键在列表中，返回键在列表中位置的索引\n// 否则返回 -1。\n// 假设列表是排序的。\n\
    function binarySearch(list, key) {\n  var left = 0;\n  var right = list.length\
    \ - 1;\n\n  while (left <= right) {\n    var mid = left + ((right - left) >>>\
    \ 1);\n    var cmp = key - list[mid];\n    if (cmp > 0) {\n      left = mid +\
    \ 1;\n    } else if (cmp < 0) {\n      right = mid - 1;\n    } else {\n      return\
    \ mid;\n    }\n  }\n  return -1;\n}\n```\n\n### 模拟检查 (Desk Check)\n| list | key\
    \ | i | return | |\n|---|---|---|---|---|\n| 28.1 | 20 | 23.6 | 0 | 15 | 23.6\
    \ |\n| [0] | [1] | [2] | [3] | [4] | |\n\n"
