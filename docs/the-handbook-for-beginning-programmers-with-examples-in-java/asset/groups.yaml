    ## 不区分大小写


    HTML 5 不区分大小写。这意味着在 HTML 5 中，`<HTML>`、`<html>` 和 `<HTML>` 含义相同。然而，标准做法是除了全大写的
    DOctype 声明外，标签和属性都使用全小写。大多数开发者使用小写字母有两个原因：


    - 1. 小写字母更容易阅读，因为它们的大小比大写字母变化更大。

    - 2. 如果 HTML 5 文档转换为 XHTML（后者要求使用小写标签和属性），转换过程将更加容易。


