    # Chapter 4. JavaScript Basics


    JavaScript was originally developed by Brendan Eich at Netscape under the name
    Mocha, later renamed LiveScript, and finally renamed JavaScript. JavaScript is
    most often used in web pages on the client side (web browser). Despite its name,
    JavaScript has very little in common with the Java programming language. The little
    that they have in common includes the syntax of the C programming language and
    some naming conventions and names, such as Date, Math, and String. You can find
    a good online tutorial for JavaScript w3schools.com and a good online reference
    for JavaScript at developer.mozilla.org


    # Chapter Outcomes


    By the end of this chapter you will be able to:


    +   - Read and write simple JavaScript programs embedded inside HTML documents.

    - Write a JavaScript program that the computer runs when a user clicks a button.

    - Write a JavaScript program that gets input from a popup window and sends output
    to a popup window.

    - Write a JavaScript program that gets input from a text field and sends output
    to an HTML div.


    # Starting with JavaScript


    Using your text editor, you can write JavaScript code in an HTML file. However,
    you must place the JavaScript code between opening and closing <script> tags as
    shown in example 1. Although it is possible to place <script> tags in the body
    of an HTML document, you should normally place <script> tags in the head of your
    HTML document. The HTML document from example 1 is shown by the Firefox web browser
    in Figure 10.'
  - "[PAGE 41]\n\n# Example 1\n\n```\n<!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>My First JavaScript Program</title>\n  <script\
    \ type=\"text/javascript\">\n  /* Defining Table\n  * Input: No user input\n \
    \ * Output: The message \"Water is delicious!\"\n  */\nfunction showMessage()\
    \ {\n  // The next line of code causes the computer\n  // to open a popup window\
    \ that contains the\n  // words \"Water is delicious!\"\n  window.alert(\"Water\
    \ is delicious!\");\n}\n</script>\n</head>\n<body>\n  <button type=\"button\"\
    \ onclick=\"showMessage()\">Message</button>\n</body>\n</html>\n```\n\nNotice\
    \ at line 22 in line 1 there are opening and closing button tags that create the\
    \ button shown in Figure 10. Notice at line 22 that the button has an onclick\
    \ attribute. When a user clicks this button, the computer executes the JavaScript\
    \ code contained in the onclick attribute. The onclick code executes the showMessage\
    \ function which begins at line 12 and ends at line 17. Within this function at\
    \ line 16 is a command which causes the computer to open a popup window containing\
    \ the text \"Water is delicious!\" as shown in Figure 11.\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_41_0.png)\n\
    \nFigure 10: A simple HTML document with a single button drawn in Firefox."
