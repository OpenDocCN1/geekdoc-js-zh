    \ += interest;\n    month++;\n  }\n  return month;\n}\n</script>\n</head>\n<body>\n\
    <button type=\"button\" onclick=\"testInvest()\">Test</button>\n<div id=\"outputDiv\"\
    ></div>\n</body>\n</html>\n```\n\n| principal | annualRate | interest | balance\
    \ | month |\n|---|---|---|---|---|\n| | | | | |\n| | | | |\n\n## 最大公约数\n\n两个非零整数的最大公约数\
    \ (gcd) 是能整除这两个数的最大正整数。欧几里得发现的计算 gcd 的高效算法如下。给定两个整数 102 和 18：\n\n1. 102 除以 18，商\
    \ 5，余数 12，\n2. 18 除以 12，商 1，余数 6，\n3. 12 除以 6，商 2，余数 0\n4. 余数为 0 意味着 102 和 18\
    \ 的最大公约数 6。\n\n欧几里得算法写在下一页的 JavaScript 函数中，头部为 `function gcd(a, b)`。从头部可以看出，gcd\
    \ 函数需要两个值作为参数。调用此函数时必须编写函数名 `gcd`，后面跟着带有两个参数的参数列表，如下所示的 `testGCD` 函数。\n\n## 示例\
    \ 16\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>Greatest Common Divisor</title>\n<script type=\"text/javascript\"\
    >\n/* 输入：用户输入\n* 处理：确定 -24 和 472 的公约数\n* 输出：最大公约数 */\nfunction testGCD() {\n \
    \ var x = -24;\n  var y = 472;\n  var divisor = gcd(x, y);\n  document.getElementById('outputDiv').innerHTML\
    \ = divisor;\n}\n```\n\n| x | y | divisor |\n|---|---|---|\n| | | |\n\n```\n//\
    \ 并返回两个整数 a 和 b 的公约数。\nfunction gcd(a, b) {\n  // 确保 a 和 b 不是负数。\n  a = Math.abs(a);\n\
    \  b = Math.abs(b);\n\n  // 确保 a 大于 b。\n  if (a < b) {\n    var swap = a;\n  \
    \  a = b;\n    b = swap;\n  }\n\n  // 循环直到找到公约数。\n  do {\n    var r = a % b;\n\
    \    a = b;\n    b = r;\n  } while (b != 0);\n\n  return a;\n}\n</script>\n</head>\n\
    \n<body>\n<button type=\"button\" onclick=\"testGCD()\">Test</button>\n<div id=\"\
    outputDiv\"></div>\n</body>\n</html>\n```\n\n| r | a | b | swap |\n|---|---|---|---|\n\
    | | | | |\n| | | | |\n| | | | |\n\n## 常见错误\n\n在函数名中包含空格\n\n```javascript\n错误\n\
    function check Answer() { \n}\n```\n\n```javascript\n正确\nfunction checkAnswer()\
    \ {\n}\n```\n\n忘记左左或右大括号\n\n```javascript\n错误\nfunction sum(x, y, z) {\n  var\
    \ s = x + y + z;\nreturn s;\n```\n\n```javascript\n正确\nfunction sum(x, y, z) {\n\
    \  var s = x + y + z;\n  return s;\n}\n```\n\n重新声明或重新赋值参数\n\n```javascript\nfunction\
    \ getDiscountRate(birthday, gpa) {\n// 错误！不要重新声明或赋值参数。\nvar birthday = new Date(\"\
