  mdcn: "\n\n# 运算符优先级\n\n当算术表达式包含两个或多个不同的运算符时，结果通常是歧义的。例如，7 3 * 2 的结果是什么？是 8 还是 7？答案取决于算术运算执行的顺序。由于这种歧义性，编程语言包含了算术运算符优先级，它决定了哪个运算符先求值，哪个后求值。\n\
    \n| 运算符 | 含义 | 优先级 |\n| --- | --- | --- |\n| () | 括号 | 最高（先执行） |\n| * / % | 乘、除、取模\
    \ | |\n| + - | 加、减 | |\n| = | 赋值 | 最低（后执行） |\n\n当一个表达式包含两个优先级相同的运算符时，计算机从左到右计算它们计算。例如，在算术表达式\
    \ `x / y * c` 中，计算机首先将 `x` 除以 `y`，然后将结果乘以 `c`。在编写算术表达式时，如果你需要让低优先级的运算符在高优先级之前执行，可以使用括号改变计算顺序。无论优先级如何，计算机总是先计算括号内的算术运算。\n\
    \n# 示例 7\n\n将代数方程 $v = i * (1 + a / n)$ 转换为 JavaScript。\n\n```\nvar v = i * (a\
    \ / n);\n```\n\n# 示例 8\n\n将代数方程 $x = 7 / 2(r + b) - bc)$ 转换为 JavaScript。\n\n![](img/efee93db95f65f7e06bfe140.png)\n\
    \n# 摄氏度转华氏度\n\n摄氏度转华氏度的公式为：\n\n$f = \\frac{9}{5}c + 32$\n\n示例 9 是一个 JavaScript\
    \ 程序，使用该公式将用户输入的摄氏度转换为华氏度。注意示例的第 14 行，程序包含了读取用户输入到文本框的值并将其存储在名为 `text` 的变量中。在第\
    \ 17 行，`parseFloat` 函数将用户输入的字符串转换为数字。第 17 行是必要的，因为计算机始终将用户输入视为文本。无论用户输入什么，如果用户点击文本框并按下\
    \ 5 键和 8 键，人类会将其视为数字 58，但计算机会将其视为数字“5”后跟数字“8”。换句话说，如果你正在编写一个获取输入并进行计算的程序，你的程序必须在进行计算之前将用户的输入字符串转换为数字。如第\
    \ 17 行所示，`parseFloat` 函数实现了此类。\n\n在 JavaScript 中有两个将字符串转换为数字的函数：`parseInt` 和 `parseFloat`。`parseInt`\
    \ 将字符串转换为整数。如果用户输入带有小数点的文本，`parseInt` 只转换小数点前的数字并忽略小数点后的数字。例如，如果用户输入“75.814”，`parseInt`\
    \ 将转换为数字 75。`parseFloat` 将字符串转换为可能带有小数点的数字。例如 `parseFloat` 将字符串“75.814”转换为数字 75.814\
    \ 或接近 75.814 的值。\n\n# 示例 9\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n\
    <head>\n<meta charset=\"utf-8\">\n<title>摄氏度转华氏度</title>\n<script type=\"text/javascript\"\
    >\n/* 输入：摄氏度温度\n* 处理：将摄氏度转换为华氏度\n* 输出：转换为华氏度的温度\n*/\nfunction celsToFahr() {\n\
    \  // 从用户处读取摄氏度温度。\n  var text = document.getElementById('celsiusBox').value;\n\
    \  var c = parseFloat(text);\n  // 将用户的输入转换为数字。\n  var f = c * 9 / 5 + 32;\n \
    \ // 将华氏度温度显示给用户。\n  document.getElementById('fahrenheitDiv').innerHTML = f;\n\
    }\n</script>\n</head>\n<body>\n输入摄氏度温度：<input type=\"text\" id=\"celsiusBox\"\
    >\n<button type=\"button\" onclick=\"celsToFahr()\">转换</button>\n<div id=\"fahrenheitDiv\"\
    ></div>\n</body>\n</html>\n```\n\n# 5. 变量与算术\n\n# 华氏度转摄氏度\n\n华氏度转摄氏度的公式为：\n\n\
    $c = \\frac{5}{9}(f - 32)$\n\n在某些编程语言（如 Java、C++ 和 C）中，这个公式必须小心编写，因为在这些语言中，5 会导致计算机执行**整数除**，通过简单丢弃小数点后的数字来截断结果。因此，在这些语言中，5\
    \ * 9 的结果为 0，程序员必须编写代码来强制计算机执行浮点除而不是整数除。然而，在 JavaScript 中，除法运算符始终导致计算机执行浮点除。\n\
    \n# 示例 10\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>华氏度转摄氏度</title>\n\n<script type=\"text/javascript\">\n/* 输入：华氏度温度\n\
    * 处理：将华氏度转换为摄氏度\n* 输出：转换为摄氏度的温度 */\nfunction fahrToCels() {\n  // 从用户处读取华氏度温度。\n\
    \  var text = document.getElementById('fahrenheitInput').value;\n  var f = parseFloat(text);\n\
    \n  // 将华氏度温度转换为摄氏度。\n  var c = 5 / 9 * (f - 32);\n\n  // 将摄氏度温度显示给用户。\n  document.getElementById('fahrenheitDiv').innerHTML\
    \ = f;\n}\n</script>\n</head>\n<body>\n输入华氏度温度：<input type=\"text\" id=\"fahrenheitInput\"\
    >\n<button type=\"button\" onclick=\"fahrToCels()\">转换</button>\n<div id=\"fahrenheitDiv\"\
    ></div>\n</body>\n</html>\n```\n\n# 赋值运算符\n\n| 运算符 | 含义 | 示例 |\n| --- | --- |\
    \ --- |\n| = | 赋值 | x = 5 |\n| += | 加赋值 | x += 5 |\n| -= | 减赋值 | x -= 5 |\n| *=\
    \ | 乘赋值 | x *= 5 |\n| /= | 除赋值 | x /= 5 |\n| %= | 取模赋值 | x %= 5 |\n\n例如，`x +=\
    \ 2` 等同于 `x = x + 2`。赋值运算符是算术运算的结合，并将结果存回变量中。理解这些示例将你更好地理解赋值运算符。\n\n# 示例 11\n\n\
    ```javascript\nx = 0;\nx += 2;\n```\n\n# 示例 12\n\n```javascript\nx = 0;\nx *=\
    \ 2;\n```\n\n# 示例 13\n\n```javascript\nx = 0;\nx -= 2;\n```\n\n# 示例 14\n\n```javascript\n\
    x = 0;\nx /= 2;\n```\n\n# 示例 15\n\n```javascript\nx = 0;\nx %= 2;\n```\n\n"
