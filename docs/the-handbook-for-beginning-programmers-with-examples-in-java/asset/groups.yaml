    \    d. 返回华氏度的热指数\n\n换句话说，第二个函数（heatIndex）不能从用户处获取任何输入，也不能向用户输出任何内容。相反，它必须计算并返回结果，这使得第二个函数在其他项目中非常可重用。\n\
