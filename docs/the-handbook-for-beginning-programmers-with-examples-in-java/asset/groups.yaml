    \ 找到良好的 JavaScript 在线参考。\n\n# 章节目标\n\n在本结束后，你将能够：\n\n- 读取和编写嵌入在 HTML 文档中的简单 JavaScript\
    \ 程序。\n- 编写一个当用户点击按钮时由计算机运行的 JavaScript 程序。\n- 编写一个从弹出窗口获取输入并将输出发送到弹出窗口的 JavaScript\
    \ 程序。\n- 编写一个从文本字段获取输入并将输出发送到 HTML div 的 JavaScript 程序。\n\n# 从 JavaScript 开始\n\
    \n使用你的文本编辑器，你可以在 HTML 文件中编写 JavaScript 代码。然而，你必须将 JavaScript 代码放在起始和结束的 `<script>`\
    \ 标签之间，如示例 1 所示。虽然可以在 HTML 文档的 `body` 中放置 `<script>` 标签，但你通常应该将 `<script>` 标签放置在\
    \ HTML 文档的 `head` 中。图 10 显示了 Firefox 网页浏览器显示的示例 1 中的 HTML 文档。\n\n# 示例 1\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n  <meta charset=\"utf-8\">\n \
    \ <title>My First JavaScript Program</title>\n  <script type=\"text/javascript\"\
