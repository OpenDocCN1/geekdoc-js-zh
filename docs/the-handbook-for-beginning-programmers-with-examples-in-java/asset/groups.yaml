  - "[PAGE 141]\n\n# Area of a Triangle\n\nIf we know the side lengths of a triangle\
    \ as shown in Figure 31, we can compute the area of that triangle using Heron's\
    \ formula which is\n\n```\n$area = \\sqrt{s(s-a)(s-b)(s-c)}$\n```\n\nwhere $a$,\
    \ $b$, and $c$ are the lengths of the three sides of the triangle and $s$ is the\
    \ semi-perimeter of the triangle defined by\n\n```\n$s = \\frac{a+b+c}{2}$\n```\n\
    \n![](img/ef8ee93db95f659f7e069b8fe140b87b_141_0.png)\n\n# Example 13\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Triangle\
    \ Area</title>\n<script type=\"text/javascript\">\n/* Input: No user input\n *\
    \ Processing: Compute the area of a triangle with side lengths 4, 2, and 5\n *\
    \ Output: The area of the triangle\n */\nfunction testTriangle() {\n  var r =\
    \ triangleArea(4, 2, 5);\n  document.getElementById('outputDiv').innerHTML = r;\n\
    }\n\n// Computes and returns the area of a\n// triangle with side lengths a, b,\
    \ and c.\nfunction triangleArea(a, b, c) {\n  var s = (a + b + c) / 2;\n  var\
    \ area = Math.sqrt(s * (s-a) * (s-b) * (s-c));\n  return area;\n}\n</script>\n\
    </head>\n<body>\n<button type=\"button\" onclick=\"testTriangle()\">Test</button>\n\
    <div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\nDesk Check\n\n| a | b |\
    \ c | s | (s-a) | (s-b) | (s-c) | area |\n|---|---|---|---|---|---|---|-|\n| |\
    \ | | | | | | |"
