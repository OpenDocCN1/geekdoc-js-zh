    \  case 'S':\n    registerDate = \"Nov 17\";\n    break;\n  case 'J':\n    registerDate\
    \ = \"Nov 12\";\n    break;\n  case 'N':\n    registerDate = \"Nov 6\";\n    break;\n\
    \  default:\n    registerDate = \"none\";\n    window.alert(\"unknown class standing\"\
    );\n    break;\n}\ndocument.getElementById('outputDiv').innerHTML = registerDate;\n\
    ```\n\n| Desk Check | registerDate |\n| --- | --- |\n| 'F' | \"Nov 23\" |\n| Desk\
    \ Check | registerDate |\n| 'J' | \"Nov 12\" |\n| Desk Check | registerDate |\n\
    | 'Q' | \"none\" |"
- md: "\n## Even Integers\n\nThe easiest way for a computer to determine if an integer\
    \ is even is to divide the number by two, and if the remainder of this division\
    \ is equal to zero, then the integer is even. The modulus operator performs integer\
    \ division and returns the signed remainder of the division. The code example\
    \ below uses the modulus operator to determine if an integer is even.\n\nExample\
    \ 5\n\n```javascript\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"\
    utf-8\">\n<title>Is Even?</title>\n\n<script type=\"text/javascript\">\n/* Input:\
    \ An integer\n * Processing: Determine if the integer is even or odd\n * Output:\
    \ A message that says the integer is even or odd\n */\nfunction isEven() {\n \
    \ // Get the user input from a text field and convert it to a number.\n  var text\
    \ = document.getElementById('integerInputBox').value;\n  var value = parseInt(text);\n\
    \n  // Choose a message.\n  var message;\n  if ((value % 2) == 0) {\n    message\
    \ = value + \" is an even integer\";\n  } else {\n    message = value + \" is\
    \ an odd integer\";\n  }\n\n  // Display the message to the user.\n  document.getElementById('outputDiv').innerHTML\
    \ = message;\n}\n</script>\n</head>\n\n<body>\nPlease enter an integer: <input\
    \ type=\"text\" id=\"integerInputBox\">\n<button type=\"button\" onclick=\"isEven()\"\
    >Is Even?</button>\n<div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\n| text\
    \ | value % 2 | message |\n|---|---|---|\n| 8 | | |\n\n## Odd Integers\n\nBecause\
    \ the result of the modulus operator is signed, when determining if an integer\
    \ is even or odd the result of the modulus operator must always be compared to\
    \ zero. Comparing the result to one will *not* work for negative, odd integers.\
    \ Consider this JavaScript code and two corresponding desk checks.\n\nExample\
    \ 6\n\n```javascript\n// Wrong! Doesn't work for negative odd integers!\nif ((number\
    \ % 2) == 1) {\n  document.getElementById('outputDiv').innerHTML = number + '\
    \ is odd';\n} else {\n  document.getElementById('outputDiv').innerHTML = number\
    \ + ' is even';\n}\n```\n\n| Desk Check number % 2 | output | Desk Check number\
    \ % 2 | output |\n|---|---|---|---|\n| 5 | \"5 is odd\" | -1 | \"-9 is even\"\
    \ |\n\nNote that comparing (value % 2) == 1 works fine for positive integers whether\
    \ they are even or odd. However, as shown in the desk check above, it does *not*\
    \ work for negative, odd integers. If you need to write code that takes action\
    \ only if an integer is odd, the correct way to write the comparison is with the\
    \ not equal relational operator (!=).\n\nExample 7\n\n```javascript\n// Correct\
    \ check for odd integers\nif ((value % 2) != 0) {\n  document.getElementById('outputDiv').innerHTML\
    \ = value + ' is odd';\n}\n```\n\nSometimes a programmer will use the bitwise\
    \ & operator to test if an integer is even as shown below. Such code works but\
    \ is a bad solution for at least two reasons.\n\n- It is not as straightforward\
    \ as using the modulus operator.\n- It depends on the computer using two’s complement,\
    \ binary representation for integers. (Admittedly, computers will continue to\
    \ represent integers using two’s complement for the foreseeable future.)\n\nExample\
    \ 8\n\n```javascript\n// Correct, but poor check for even integers!\nif ((value\
    \ & 1) == 0) {\n    document.getElementById('outputDiv').innerHTML = value + '\
    \ is even';\n}\n```\n\nMany programmers write a test for integers using the bitwise\
    \ And operator because it may execute faster than using the modulus operator.\
    \ However, the disadvantages of such code, almost never justify the very small,\
    \ possible gain in execution speed, especially because most modern compilers will\
    \ automatically optimize the compiled version of the statement using the modulus\
    \ operator: if ((value % 2) == 0) to be the same using the bitwise And operator:\
    \ if ((value & 1) == 0)\n\n## Quadratic Formula\n\nA quadratic equation of the\
    \ form $y = ax^2 + bx + c$ has two solutions, also called roots, that may or not\
    \ be distinct and that may be real or complex. If you graph a quadratic equation,\
    \ the roots are the locations where the equation crosses the x axis. Figure 23\
    \ contains the graph of three different quadratic equations. Notice that the first\
    \ equation (on the left) crosses the x axis twice and therefore has two real roots.\
    \ The second equation crosses or touches the x axis only once and therefore has\
    \ only one distinct root. The third equation does not cross the x axis and so\
    \ its two roots are complex meaning they contain the square root of -1. The square\
    \ root doesn't exist, and mathematicians say it is imaginary.\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_83_0.png)\n\
    \nFigure 23: A graph of three quadratic equations.\n\nThe roots of a quadratic\
    \ equation can be found using the quadratic formula:\n\n```math\n$x = \\frac{-b\
    \ \\pm \\sqrt{b^2 - 4ac}}{2a}$\n```\n\nHere is JavaScript code for finding the\
    \ real solutions of a quadratic equation if they exist.\nNotice the if statement\
    \ that determines if the roots exist (are real) or don't exist (are complex).\n\
    \nExample 9\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>Quadratic Formula</title>\n<script type=\"text/javascript\"\
    >\n/* Input: Three coefficients from quadratic equation.\n * Processing: If they\
    \ exist, compute the root or roots of the equation\n * Output: The root or roots\
    \ of the equation or \"undefined\" if they don't exist.\n */\nfunction quadratic()\
    \ {\n  // Get coefficients a, b, and c from the user.\n  var a = parseFloat(document.getElementById('aInputBox').value);\n\
    \  var b = parseFloat(document.getElementById('bInputBox').value);\n  var c =\
    \ parseFloat(document.getElementById('cInputBox').value);\n\n  // Compute the\
    \ root or roots of the quadratic equation if they exist.\n  var discr = b * b\
    \ - 4 * a * c;\n  var root1, root2 = 0;\n  if (discr >= 0) {\n    var sq = Math.sqrt(discr);\n\
    \    root1 = (-b + sq) / (2 * a);\n    root2 = (-b - sq) / (2 * a);\n  }\n  document.getElementById('outputDiv').innerHTML\
    \ = root1 + ' and ' + root2;\n}\n</script>\n</head>\n<body>\na = <input type=\"\
    text\" id=\"aInputBox\" size=\"3\">\nb = <input type=\"text\" id=\"bInputBox\"\
    \ size=\"3\">\nc = <input type=\"text\" id=\"cInputBox\" size=\"3\">\n<button\
    \ type=\"button\" onclick=\"quadratic()\">Compute Roots</button>\n<div id=\"outputDiv\"\
    ></div>\n</body>\n</html>\n```\n\n| a | b | c | discr | sq | root1 | root2 |\n\
    |---|---|---|---|---|---|---|\n| | 1 | | -4 | | | |\n\n## Nested If Statements\n\
    \nIt is often useful to write one if statement inside another or inside else part\
    \ of an if statement. Consider the problem to write a program that reads from\
    \ the keyboard the total sales for a sales person and then outputs the sales person's\
    \ commission according to this table.\n\n| If the sales amount greater than or\
    \ equal to | the sales amount is less than | Then the commission rate is |\n|---|---|---|\n\
    | 0 | $300 | 0% |\n| $300 | $600 | 2.0% |\n| $600 | $1000 | 2.5% |\n| $1000 |\
    \ | 3.0% |\n\nThis can be easily written using nested if statements as shown in\
    \ the following example. Notice the if statements nested inside else statements.\n\
    \nExample 10\n\n```javascript\nvar sales = parseFloat(document.getElementById('salesInputBox').value);\n\
    var rate;\nif (sales < 300) {\n  rate = 0;\n} else {\n  if (sales < 600) {\n \
    \   rate = 0.02;\n  }\n  else {\n    if (sales < 1000) {\n      rate = 0.025;\n\
    \    }\n    else {\n      rate = 0.03;\n    }\n  }\n}\nvar commission = sales\
    \ * rate;\nvar output = 'The employee earned ' + commission;\ndocument.getElementById('outputDiv').innerHTML\
    \ = output;\n```\n\n| sales | rate | commission | output |\n|---|---|---|---|\n\
    | 850 | | | |\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_85_0.png)\n\nAlthough\
    \ the previous example is correct, it can be written in a slightly shorter way\
    \ by combining the else and if statements like this.\n\nExample 11\n\n```javascript\n\
    var sales = parseFloat(document.getElementById('salesInputBox').value);\nvar rate;\n\
    if (sales < 300) {\n  rate = 0;\n} else if (sales < 600) {\n  rate = 0.02;\n}\
    \ else if (sales < 1000) {\n  rate = 0.025;\n} else {\n  rate = 0.03;\n}\nvar\
    \ commission = sales * rate;\nvar output = 'The employee earned ' + commission;\n\
    document.getElementById('outputDiv').innerHTML = output;\n```\n\nDesk Check\n\n\
    | sales | rate | commission | output |\n|---|---|---|---|\n| 850 | | | |\n\nAs\
    \ another example, consider a sports team that wants to provide discounted tickets\
    \ to students and senior citizens and that wants to reward loyal fans that attend\
    \ multiple games according to this table.\n\n| Age | Games Attended | Ticket Price\
    \ |\n|---|---|---|\n| 0–17 | 0–5 | $8.00 |\n| 0–17 | 6–10 | $6.00 |\n| 0–17 |\
    \ 11 and up | $5.00 |\n| 18–54 | 0–10 | $10.00 |\n| 18–54 | 11 and up | $8.00\
    \ |\n| 55 and older | 0–10 | $8.00 |\n| 55 and older | 11 and up | $6.00 |\n\n\
    This could also be solved using nested if statements as shown in the next example.\n\
    \n6. Selection\n"
  mdcn: "\n\n## 偶数\n\n计算机判断一个整数是否为偶数最简单的方法是将该数字除以 2，如果除法的余数为 0，那么该整数就是偶数。取模运算符（modulus）执行整数除法并返回除法的带符号余数。下面的代码示例使用取模运算符来判断整数是否为偶数。\n\
    \n示例 5\n\n```javascript\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>判断偶数</title>\n\n<script type=\"text/javascript\"\
    >\n/* 输入：一个整数\n * 处理：判断该整数是偶数还是奇数\n * 输出：显示该整数是偶数还是奇数的消息\n */\nfunction isEven()\
    \ {\n  // 从文本框获取用户输入并将其转换为数字。\n  var text = document.getElementById('integerInputBox').value;\n\
    \  var value = parseInt(text);\n\n  // 选择一条消息。\n  var message;\n  if ((value %\
    \ 2) == 0) {\n    message = value + \" is an even integer\";\n  } else {\n   \
    \ message = value + \" is an odd integer\";\n  }\n\n  // 将消息显示给用户。\n  document.getElementById('outputDiv').innerHTML\
    \ = message;\n}\n</script>\n</head>\n\n<body>\n请输入一个整数：<input type=\"text\" id=\"\
    integerInputBox\">\n<button type=\"button\" onclick=\"isEven()\">是偶数吗？</button>\n\
    <div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\n| text | value % 2 | message\
    \ |\n|---|---|---|\n| 8 | | |\n\n## 奇数\n\n由于取模运算符的结果是带符号的，在判断一个整数是偶数还是奇数时，取模运算符的结果必须始终与\
    \ 0 进行比较。将结果与 1 比较对于负奇数来说*不起作用*。考虑这段 JavaScript 代码和两个对应的纸上测试（desk checks）。\n\n\
    示例 6\n\n```javascript\n// 错误！对负奇数无效！\nif ((number % 2) == 1) {\n  document.getElementById('outputDiv').innerHTML\
    \ = number + ' is odd';\n} else {\n  document.getElementById('outputDiv').innerHTML\
    \ = number + ' is even';\n}\n```\n\n| Desk Check number % 2 | output | Desk Check\
    \ number % 2 | output |\n|---|---|---|---|\n| 5 | \"5 is odd\" | -1 | \"-9 is\
    \ even\" |\n\n注意，对于正整数（无论是奇偶），比较 (value % 2) == 1 都能正常工作。然而，正如上面的纸上测试所示，它对于负奇数*不起作用*。如果你需要编写一个仅在整数为奇数时才执行操作的代码，那么正确的比较方法是使用不等于关系运算符\
    \ (!=)。\n\n示例 7\n\n```javascript\n// 正确的奇数检查\nif ((value % 2) != 0) {\n  document.getElementById('outputDiv').innerHTML\
    \ = value + ' is odd';\n}\n```\n\n有时，程序员会使用位运算符 & 运算符来测试整数是否为偶数，如下所示。这种代码可以运行，但从至少两个原因来看，这是一个糟糕的解决方案。\n\
    \n- 它没有使用取模运算符那样直观。\n- 它依赖于计算机使用补码（整数的二进制表示法）。事实上，在可预见的未来，计算机将继续使用补码表示整数。）\n\n\
    示例 8\n\n```javascript\n// 正确，但糟糕的偶数检查！\nif ((value & 1) == 0) {\n    document.getElementById('outputDiv').innerHTML\
    \ = value + ' is even';\n}\n```\n\n许多程序员使用位与运算符来对整数进行测试，因为它的执行速度可能比使用取模运算符更快。然而，这种代码的缺点几乎无法抵消执行速度上的微小可能收益，特别是因为大多数现代编译器会自动将使用取模运算符的编译语句\
    \ `if ((value % 2) == 0)` 优化为与位与运算符相同的语句：`if ((value & 1) == 0)`\n\n## 二次方程\n\n\
    形式为 $y = ax^2 + bx + c$ 的二次方程有两个解，也称为根，这些根可能是不同的，也可能是相同的，可能是实数复数。如果对二次方程绘制图形，根就是方程穿越\
    \ x 轴的位置。图 23 包含了三个不同二次方程的图。注意第一个方程（左侧）与 x 轴交叉两次，因此有两个实根。第二个方程仅与 x 轴交叉或相切一次，因此只有一个不同的根。第三个方程没有与\
    \ x 轴交叉，所以它的两个根是复数，这意味着它们包含 -1 的平方根。该平方根不存在，数学家称之为虚数。\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_83_0.png)\n\
    \n图 23：三个二次方程的图。\n\n二次方程的根可以使用二次公式找到：\n\n```math\n$x = \\frac{-b \\pm \\sqrt{b^2\
    \ - 4ac}}{2a}$\n```\n\n以下是寻找二次方程实解（如果存在）的 JavaScript 代码。注意判断根是否存在（为实数）或不存在（为复数）的\
    \ if 语句。\n\n示例 9\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en-us\">\n<head>\n\
    <meta charset=\"utf-8\">\n<title>二次公式</title>\n<script type=\"text/javascript\"\
    >\n/* 输入：三个系数。\n * 处理：如果根存在，计算方程的根。\n * 输出：如果根不存在，显示 \"undefined\"。\n */\nfunction\
    \ quadratic() {\n  // 获取 a, b, c。\n  var a = parseFloat(document.getElementById('aInputBox').value);\n\
    \  var b = parseFloat(document.getElementById('bInputBox').value);\n  var c =\
    \ parseFloat(document.getElementById('cInputBox').value);\n\n  // 计算判别式。\n  var\
    \ disc = b * b - 4 * a * c;\n\n  if (disc >= 0) {\n    var root1 = (-b + Math.sqrt(disc))\
    \ / (2 * a);\n    var root2 = (-b - Math.sqrt(disc)) / (2 * a);\n    document.getElementById('outputDiv').innerHTML\
    \ = \"Roots are \" + root1 + \" and \" + root2;\n  } else {\n    document.getElementById('outputDiv').innerHTML\
    \ = \"undefined\";\n  }\n}\n</script>\n</head>\n\n<body>\na: <input type=\"text\"\
    \ id=\"aInputBox\">\nb: <input type=\"text\" id=\"bInputBox\">\nc: <input type=\"\
    text\" id=\"cInputBox\">\n<button type=\"button\" onclick=\"quadratic()\">计算根</button>\n\
    <div id=\"outputDiv\"></div>\n</body>\n</html>\n```\n\n## 嵌套 if\n\n有时程序员会将一个 if\
    \ 语句放在另一个 if 语句内部。考虑根据下表编写一个程序来判断整数是偶数还是奇数：\n\n| 整数大于 0 | 整数小于或等于 0 |\n|---|---|\n\
    | 偶数 | 偶数 |\n| 奇数 | 奇数 |\n\n```javascript\nif (value > 0) {\n  if ((value % 2)\
    \ == 0) {\n    message = value + \" is positive and even\";\n  } else {\n    message\
    \ = value + \" is positive odd\";\n  }\n} else {\n  if ((value % 2) == 0) {\n\
    \    message = value + \" is negative and even\";\n  } else {\n    message = value\
    \ + \" is negative and odd\";\n  }\n}\n```\n\n这可以使用嵌套 if 语句轻松解决，如下所示。\n\n示例 10\n\
    \n```javascript\nvar value = parseInt(document.getElementById('integerInputBox').value);\n\
    var message;\n\nif (value > 0) {\n  if ((value % 2) == 0) {\n    message = value\
    \ + \" is positive and even\";\n  } else {\n    message = value + \" is positive\
    \ odd\";\n  }\n} else {\n  if ((value % 2) == 0) {\n    message = value + \" is\
    \ negative and even\";\n  } else {\n    message = value + \" is negative and odd\"\
    ;\n  }\n}\n\ndocument.getElementById('outputDiv').innerHTML = message;\n```\n\n\
    纸上测试\n\n| value | value % 2 | message |\n|---|---|---|\n| 8 | 0 | 8 is positive\
    \ and even |\n| 7 | 1 | 7 is positive odd |\n| -8 | 0 | -8 is negative and even\
    \ |\n| -7 | -1 | -7 is negative and odd |\n\n```\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_85_0.png)\n\
    \n虽然之前的示例是正确的，但通过像这样合并 else 和 if 语句，可以用稍微更短的方式编写。\n\n示例 11\n\n```javascript\n\
    var value = parseInt(document.getElementById('integerInputBox').value);\nvar message;\n\
    \nif (value > 0) {\n  if ((value % 2) == 0) {\n    message = value + \" is positive\
    \ and even\";\n  } else {\n    message = value + \" is positive odd\";\n  }\n\
    } else if ((value % 2) == 0) {\n  message = value + \" is negative and even\"\
    ;\n} else {\n  message = value + \" is negative and odd\";\n}\n\ndocument.getElementById('outputDiv').innerHTML\
    \ = message;\n```\n\n纸上测试\n\n| value | value % 2 | message |\n|---|---|---|\n\
    | 8 | 0 | 8 is positive and even |\n| 7 | 1 | 7 is positive odd |\n| -8 | 0 |\
    \ -8 is negative and even |\n| -7 | -1 | -7 is negative and odd |\n\n作为另一个例子，考虑一个体育队，它想为学生和老年人提供折扣票，并根据根据下表奖励多次参加比赛的忠实粉丝。\n\
    \n| 年龄 | 参加次数 | 票价 |\n|---|---|---|\n| 0–17 | 0–5 | $8.00 |\n| 0–17 | 6–10 | $6.00\
    \ |\n| 0–17 | 11 次以上 | $5.00 |\n| 18–54 | 0–10 | $10.00 |\n| 18–54 | 11 次以上 |\
    \ $8.00 |\n| 55 岁 | 0–10 | $8.00 |\n| 55 以上 | 11 次以上 | $6.00 |\n\n这也可以使用嵌套 if\
    \ 语句解决，如下一个示例所示。\n\n6. 选择\n\n"
