    # Operator Precedence


    When an arithmetic expression includes two or more different operators, the result
    is often ambiguous. For example, what is the result of 7 3 * 2? Is it 8 or 7?
    The answer depends on the order in which the arithmetic operations are done. Because
    of this ambiguity, programming languages include arithmetic operator precedence
    which determines which operator is evaluated first and which is evaluated last.


    | Operator(s) | Name(s) | Precedence |

    | --- | --- | --- |

    | () | parentheses | Highest (evaluated first) |

    | * / % | negation | multiplication, division, modulus |

    | + | addition, subtraction |

    | = | assignment | Lowest (evaluated last) |


    When an expression includes two operators with the same precedence, the computer
    evaluates them from left to right. For example, in the arithmetic expression x
    / y * c, the computer will first divide x by y then multiply that result by c.
    When writing an arithmetic expression, if you need a lower precedence operator
    evaluated before a higher precedence one, you can add parentheses to change the
    evaluation order. The computer will always evaluate arithmetic that is inside
    parentheses first regardless of the operator precedence.


    # Example 7


    Translate the algebraic equation $v = i(1 + \frac{a}{n})^{n}$ into JavaScript.


    ```

    var v = i * (1 + a / n) * (y / n);

    ```


    # Example 8


    Translate the algebraic equation $x = \frac{7}{2(r + 13)} - 3(a + bc)$ into JavaScript.


