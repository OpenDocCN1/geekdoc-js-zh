    # Chapter Summary


    +   * Hyper-text markup language (HTML) is a computer language that is used to
    write documents.

    * HTML 5 is the most recent version of HTML.

    * An HTML 5 document must begin with a document type declaration and must contain
    a head and a body.

    * HTML is composed of many tags. Each tag begins with a less than symbol (<) and
    ends with a greater than symbol (>).

    * HTML tags usually come in pairs, an opening tag and a closing tag.

    * Opening tags may contain attributes which are key/value pairs separated by the
    equal symbol (=).

    * Opening tags that do not require a matching closing tag are called void tags.

    * HTML tags should be properly nested.

    * HTML is not case sensitive, so tags and attribute keys may be written in upper
    lower case or any combination of upper and lower case.'
