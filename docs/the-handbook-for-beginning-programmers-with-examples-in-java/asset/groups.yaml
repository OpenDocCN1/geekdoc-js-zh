    \ languages, such as Java, C++, and C, this formula must be carefully written\
    \ because in those languages 5 causes the computer to perform **integer division**\
    \ which truncates the result by simply dropping the digits after the decimal point.\
    \ Thus, in such languages 5 * 9 yields 0, and a programmer must write the code\
    \ in a way to force the computer to perform floating, point division instead of\
    \ integer division. However, in JavaScript, the division operator always causes\
    \ the computer to perform floating point division.\n\n# Example 10\n\n```\n<!DOCTYPE\
    \ HTML>\n<html lang=\"en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Convert\
