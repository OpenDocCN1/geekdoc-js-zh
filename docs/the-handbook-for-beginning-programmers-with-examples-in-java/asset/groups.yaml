  mdcn: "\n\n# 递增递减运算符\n\nJavaScript 包含了另外两个快捷运算符，称为递增递减运算符。递增运算符（++）简单地在变量的值上加 1。递减运算符（--）从变量的值上减去\
    \ 1。\n\n| 运算符 | 名称 | 示例 | 等效表达式 |\n|---|---|---|---|\n| ++ | 前置增 | ++x; | x =\
    \ 1; x = x + 1; |\n| | 后置增 | x++; | |\n| -- | 前置减 | --t; | t = 1; t = t - 1; |\n\
    | | 后置减 | t--; | |\n\n递增和递减运算符都可以写为前置或后置运算符。如果你在变量名之前编写这些运算符之一，例如 `++x`，那么它就是前置增，意味着计算机将在执行同一语句中其余算术操作之前执行增。如果你在变量名之后编写这些运算符之一，例如\
    \ `x++`，它就是后置增，意味着计算机将在执行同一语句中其余算术操作之后执行增。然而，如果你在单独的语句中使用增或减运算符，那么使用前置还是后置版本没有区别。接下来的两个示例展示了在较大的语句内部时，前置和后置增是如何工作的。\n\
    \n# 示例 18\n\n```\nvar a = 4;\nvar b = ++a * 3 + 2;\n```\n\n| a | b |\n|---|---|\n\
    | 4 | 17 |\n| 5 | |\n\n# 示例 19\n\n```\nvar a = 4;\nvar b = a++ * 3 + 2;\n```\n\
    \n| a | b |\n|---|---|\n| 4 | 14 |\n| 5 | |\n\n注意示例 18，第 1 行导致计算机将数字 4 存储在 `a`\
    \ 中。在第 2 行，由于增运算符被写为前置增，计算机首先对 `a` 的值加 1，然后执行第 2 行的其余计算，结果将 17 存储在变量 `b` 中。\n\n\
    ## 5. 变量与算术\n\n在示例 19 中，第 1 行导致计算机将数字 4 存储在变量 *a* 中。在第 2 行，由于增运算符被写为后置增，计算机首先执行第\
    \ 2 行的其他计算，结果将 14 存储在 *b* 中；注意示例 19 中增 *a* 不会影响 *b* 的值，因为该增是后置增，计算机在计算 *b* 的值之后才增\
    \ *a*。\n\n当一个新程序员理解了后置增运算符后，她问的最常见问题是：“为什么？为什么有人用后置增运算符在同一语句的其他算术操作之后改变变量的值呢？”答案是：“为了让递增后的变量（示例\
