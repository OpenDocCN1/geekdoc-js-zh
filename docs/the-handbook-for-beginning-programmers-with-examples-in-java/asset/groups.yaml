    \ = x;"
- md: "\n## Chapter Summary\n\n- A function is a reusable part of a program that performs\
    \ one task such as calculating the average of a list of numbers or the area of\
    \ a triangle.\n- A function has a header, also called the signature, and a body.\n\
    - The header of a function includes the function's parameters. Each parameter\
    \ is a variable. The values for a function's parameters come from the point in\
    \ the program where a function is called.\n- The body of a function includes all\
    \ the statements to perform a task such as a calculation and a return statement\
    \ to return a calculated value to the call point.\n- To call a function, write\
    \ the function's name followed by the arguments that the function will need to\
    \ perform its task.\n- To store the value returned from a function write a variable\
    \ name and the assignment operator (=) at the call point of the function.\n\n\
    ## Review Questions\n\n- 1. Write the header for a function named coneVolume which\
    \ takes as parameters a radius and a height.\n- 2. Write the header for a function\
    \ named computeFutureValue which takes as parameters three numbers named principal,\
    \ annualRate, and years.\n- 3. Write code to call a function that has this header:\n\
    \n```\nfunction addOrder(name, amount)\n```\n\n- 4. Write code to call a function\
    \ that has the following header. Also, assign the result returned from the function\
    \ to a variable named p\n\n```\nfunction isPrime(value)\n```\n\n## Programming\
    \ Assignments\n\n- 1. Rewrite the number guessing game code found in review question\
    \ 10 of chapter 8 so that it\n    a. is inside a function with this header: function\
    \ numberGuessGame()\n    which is called when a user clicks a Play button\n  \
    \  b. chooses a different pseudo-random number between 1 and 100 each time it\
    \ runs\n    c. counts the number of guesses the user takes to correctly guess\
    \ the answer\n\n- 2. Create an HTML document which contains a text field, a button,\
    \ and a div. The first text field should be labeled \"Fahrenheit\" and the button\
    \ should have the text \"Celsius\" written on it. Write two functions with these\
    \ headers:\n\n```\nfunction newInputOutput()\nfunction fahrToCelsius(fahr)\n```\n\
    \n- The first function (doInputOutput) must be called from the onclick attribute\
    \ of the button and must do the following:\n    a. get a temperature in Fahrenheit\
    \ from the text field\n    b. call the second function (fahrToCelsius)\n    c.\
    \ store the value returned by fahrToCelsius in a variable\n    d. output the value\
    \ returned by fahrToCelsius to the div for the user to see\n\n- The second function\
    \ (fahrToCelsius) must:\n    a. take a temperature in Fahrenheit as a parameter\n\
    \    b. calculate the corresponding Celsius temperature\n    c. return the Celsius\
    \ temperature\n\nIn other words, the second function (fahrToCelsius) must not\
    \ gather any input from a user and must not output anything for a user to see.\
    \ Instead it must calculate and return the result which makes this second function\
    \ very reusable in other projects.\n\n- 3. Create an HTML document which contains\
    \ two text fields, a button, and a div. The first text field should be labeled\
    \ “Temperature”, and the second should be labeled “Wind Speed”. The button should\
    \ have the text “Wind Chill” written on it. Write two functions with these headers:\n\
    \n```\nfunction doInputOutput()\nfunction windChill(tempF, speed)\n```\n\nThe\
    \ first function (doInputOutput) must be called from the onclick attribute of\
    \ the button and must do the following:\n    a. get a temperature from the first\
    \ text field\n    b. get a wind speed from the second text field\n    c. call\
    \ the second function (windChill)\n    d. store the value returned by windChill\
    \ in a variable\n    d. output the value returned by windChill to the div to see\n\
    \nThe second function (windChill) must:\n    a. take a temperature in Fahrenheit\
    \ as a parameter\n    b. take a wind speed in miles per hour as a parameter\n\
    \    c. calculate the wind chill factor as a temperature in Fahrenheit\n    d.\
    \ return the wind chill factor in Fahrenheit\n\nIn other words, the second function\
    \ (windChill) must not gather any input from a user and must not output anything\
    \ for a user to see. Instead it must calculate and return the result which makes\
    \ this second function very reusable in other projects.\n\nThe formula for computing\
    \ the wind chill factor is:\n\n$f = 35.74 + 0.6215t - 35.75s^{0.16} + 0.4275ts^{0.16}$\n\
    \nwhere $f$ is the wind chill factor in Fahrenheit, $t$ is the air temperature\
    \ in Fahrenheit, and $s$ is the wind speed in miles per hour at five feet above\
    \ the ground. Use your function in an HTML and JavaScript program that includes\
    \ two text fields to input the air temperature and wind speed and a div to output\
    \ the wind chill factor.\n\n- Create an HTML document which contains two text\
    \ fields, a button, and a div. The first text field should be labeled “Temperature”,\
    \ and the second should be labeled “Relative Humidity”. The button should have\
    \ the text “Heat Index” written on it. Write two functions with these headers:\n\
    \n```\nfunction doInputOutput(tempF)\nfunction heatIndex(tempF, humid)\n```\n\n\
    The first function (doInputOutput) must be called from the onclick attribute of\
    \ the button and must do the following:\n    a. get a temperature from the first\
    \ text field\n    b. get a relative humidity from the second text field\n    c.\
    \ call the second function (heatIndex)\n    d. store the value returned by heatIndex\
    \ in a variable\n    d. output the value returned by heatIndex to the div for\
    \ the user to see\n\n- The second function (heatIndex) must:\n    a. take a temperature\
    \ in Fahrenheit as a parameter\n    b. take a relative humidity between 0 and\
    \ 100 as a parameter\n    c. calculate the heat index as a temperature in Fahrenheit\n\
    \    d. return the heat index in Fahrenheit\n\nIn other words, the second function\
    \ (heatIndex) must not gather any input from a user and must not output anything\
    \ for a user to see. Instead it must calculate and return the result which makes\
    \ this second function very reusable in other projects.\n\nThe formula for computing\
    \ the heat index is:\n\n$i = 35.74 + 0.6215t - 35.75r^{0.16} + 0.4275tr^{0.16}$\n\
    \nwhere $i$ is the heat index in Fahrenheit, $t$ is the air temperature in Fahrenheit,\
    \ and $r$ is the relative humidity.\n\n- 5. Create an HTML document which contains\
    \ two text fields, a button, and a div. (Wait, context suggests continuing flow)\
    \ Write two functions with these headers:\n\n```\nfunction doFV()\nfunction computeFutureValue(principal,\
    \ years)\n```\n\nThe first function (doFV) must:\n    a. take no parameters\n\
    \    b. be called from the onclick attribute of the button\n    c. get input from\
    \ the user\n    d. call the computeFutureValue function\n    d. display the result\
    \ to the user\n\nThe second function (computeFutureValue) must:\n    a. take principal\
    \ as a parameter\n    b. take the number of years as a parameter\n    c. calculate\
    \ the future value\n    d. return the future value\n\nThe formula for computing\
    \ the future value is:\n\n$f = a(1 + r)^n$\n\nwhere $f$ is the future value, $a$\
    \ is the principal, $r$ is the interest rate per period, and $n$ is the number\
    \ of periods.\n\n- 6. Create an HTML document that looks similar to Figure 34.\
    \ Write four functions with these headers:\n\n```\nfunction doPayment()\nfunction\
    \ doBalance()\nfunction computePayment(principal, annualRate, years, periodsPerYear)\n\
    function computeBalance(principal, annualRate, years, periodsPerYear, numberOfPaidToDate)\n\
    ```\n\nThe first two functions (doPayment and doBalance):\n    a. take no parameters\n\
    \    b. are called from an onclick attribute\n    c. get input from the user\n\
    \    d. call the computePayment or the computeBalance function\n    d. display\
    \ a result to the user\n"
  mdcn: "\n\n## 章节总结\n\n- 函数是程序中可重用的部分，用于执行特定任务，例如计算数字列表的平均值或三角形的面积。\n- 函数包含一个头部（也称为签名）和一个函数体。\n\
    - 函数头部包含了函数的参数。每个参数都是一个变量。函数参数的值来自于程序中调用函数的地方。\n- 函数体包含了所有执行任务的语句，例如计算语句以及一个将计算结果结果返回给调用点的\
    \ `return` 语句。\n- 要调用函数，请编写函数名并在其跟上函数执行任务所需的参数。\n- 若要存储函数返回的值，请在函数的调用处编写一个变量名和赋值运算符\
    \ (`=`)。\n\n## 复习题\n\n- 1. 为名为 `coneVolume` 的函数编写头部，该函数接受半径和高度作为参数。\n- 2. 为名为\
    \ `computeFutureValue` 的函数编写头部，该函数接受三个名为 `principal`、`annualRate` 和 `years` 的数字作为参数。\n\
    - 3. 编写代码调用具有以下头部的函数：\n\n```\nfunction addOrder(name, amount)\n```\n\n- 4. 编写代码调用具有以下头部的函数。同时，将函数返回的结果赋值给名为\
    \ `p` 的变量。\n\n```\nfunction isPrime(value)\n```\n\n## 编程作业\n\n- 1. 重写第 8 章复习题第\
    \ 10 中的猜数字游戏代码，使其：\n    a. 位于一个具有如下头部的函数内部：`function numberGuessGame()`，且在用户点击“Play”按钮时被调用\n\
    \    b. 每次运行时都在 1 到 100 之间选择一个不同的伪随机数\n    c. 统计用户正确猜出答案所需的猜测次数\n\n- 2. 创建一个 HTML\
    \ 文档，其中包含一个文本框、一个按钮和一个 `div`。第一个文本框应标记为“Fahrenheit”（华氏度），按钮上的文字为“Celsius”（摄氏度）。编写两个具有以下头部的函数：\n\
    \n```\nfunction newInputOutput()\nfunction fahrToCelsius(fahr)\n```\n\n- 第一个函数（doInputOutput）必须从按钮的\
    \ `onclick` 属性调用，并执行以下操作：\n    a. 从文本框中获取华氏度温度\n    b. 调用第二个函数（fahrToCelsius)\n\
    \    c. 将 `fahrToCelsius` 返回的值存储在变量中\n    d. 将 `fahrToCelsius` 返回的值输出到 `div` 中供用户查看\n\
    \n- 第二个函数（fahrToCelsius）必须：\n    a. 华氏氏温度作为参数\n    b. 计算对应的摄氏度温度\n    c. 返回摄氏度温度\n\
    \n换句话说，第二个函数（fahrToCelsius）不能从用户处获取任何输入，也不能向用户输出任何内容。相反，它必须计算并返回结果，这使得第二个函数在其他项目中非常可重用。\n\
    \n- 3. 创建一个 HTML 文档，其中包含两个文本框、一个按钮和一个 `div`。第一个文本框应标记为“Temperature”（温度），第二个标记为“Wind\
    \ Speed”（风速）。按钮上的文字为“Wind Chill”（风寒指数）。编写两个具有以下头部的函数：\n\n```\nfunction doInputOutput()\n\
    function windChill(tempF, speed)\n```\n\n第一个函数（doInputOutput）必须从按钮的 `onclick`\
    \ 属性调用，并执行以下操作：\n    a. 从第一个文本框获取温度\n    b. 从第二个文本框获取风速\n    c. 调用第二个函数（windChill)\n\
    \    d. 将 `windChill` 返回的值存储在变量中\n    d. 将 `windChill` 返回的值输出到 `div` 中查看\n\n第二个函数（windChill）必须：\n\
    \    a. 华氏度温度作为参数\n    b. 每小时英里的风速作为参数\n    c. 计算以华氏表示的风寒指数\n    d. 返回华氏度的风寒指数\n\
    \n换句话说，第二个函数（windChill）不能从用户处获取任何输入，也不能向用户输出任何内容。相反，它必须计算并返回结果，这使得第二个函数在其他项目中非常可重用。\n\
