    # HTML Tags


    | Opening and Closing Tags | Purpose |

    | --- | --- |

    | <!DOCTYPE HTML> | The document type declaration that must appear at the top
    of all HTML 5 documents. Technically, this declaration is not a tag, so it has
    no closing tag. |

    | <!-- a comment here --> | A comment or notes seen only by the developers and
    not the users of a page. A comment is not a true tag, so it has no closing tag.
    |

    | <html lang="en-us"></html> | Begins and ends an HTML document; the first and
    last tags of an HTML document. |

    | <head>...</head> | Marks the start and end of the HTML document head. Every
    HTML document must have one head. The head contains information such as the title
    and author of the document and most JavaScript code. |

    | <meta> | Provides information about a document, such as the author, descriptions,
    keywords, and the character encoding. (No closing tag.) |

    | <title>...</title> | Marks the title of a document. This tag should appear in
    the document head. |

    | <script type="javascript">...</script> | Marks the start and end of JavaScript
    code. You can place a <script> tag in the head or body of an HTML document, but
    they are normally placed in the head. |

    | <body>...</body>body> | Marks the start and end of the document body. Every
    HTML document must have one body. The body contains the main information of a
    document that the user will see. |


    ## Opening and Closing Tags


    | | Purpose |

    |---|---|

    | `<div> </</div>>` | Marks the start and end of a division within an HTML document.
    The concept of division in HTML is very general and is simply a large, medium,
    or small section of a document. |

    | `<h1> </h1>` | Marks the start and end of a level 1 heading. There are six different
    heading tags numbered from `<h6>` to `<h6>` with `<h1>` being the largest and
    `<h6>` being the smallest style of heading. |

    | `<h2> </h2>` | Marks the start and end of a level 2 heading. |

    | `<p> </p>` | Marks the limits of a paragraph. |

    | `<br>` | Forces the browser to insert a line break. (No closing tag.) |

    | `<input type="text" id="years">` | Makes a text field (single row) where a user
    can enter data. (No closing tag.) |

    | `<textarea> </textarea>` | Makes a text area (multiple rows) where a user can
    enter data. |

    | `<button type="button" onclick="computeFV()"></button>` | Makes a button that
    a user can click. |


    ## Case Insensitive


    HTML 5 is not case sensitive. This means `<HTML>` and `<html>` and `<HTML>` have
    the same meaning in HTML 5. However, the standard convention is to use all lower
    case for tags and attributes except for the DOctype declaration which is all uppercase.
    Most developers use lower case letters for two reasons:


    - 1. Lower case letters are easier to read because they vary in size more than
    upper case letters.

    - 2. If an HTML 5 document is ever converted to XHTML, which requires lower case
    tags and attributes, the conversion will be easier.


    # Well Formed HTML


    An HTML document should be well formed which means:


    - 1. The document contains only the standard tags and attributes.

    - 2. Most opening tags have a matching closing tag. The opening tags that don''t
    require a closing tag are called **void tags** and include `<meta>` `<br>` and
    `<input>`.

    - 3. Nested tags are ended before their enclosing tags are ended, for example:

    ```html

    <body>

    <p>Oregano is an important <i>culinary</i> herb. It is used in Greek and Italian
    dishes especially tomato based sauces, fried vegetables, and grilled meats.</p>

    </body>

    ```


    You can check an HTML document to ensure that it is well formed by uploading it
    to the online validator at validator.w3.org


    # Required Tags


    Every HTML 5 document must start with a `<DOCTYPE>` declaration and an opening
    `<html>` tag. Every HTML 5 document must have a head section and a body section,
    and the head section should have a `<title>` tag and a `<meta>` tag that states
    the document''s character encoding. In other words the skeleton of every HTML
    5 document should look similar to this:


    ```html

    <!DOCTYPE html>

    <html lang="en-us">

    <head>

    <meta charset="utf-8">

    <title>Title</title>

    </head>

    <body>

    </body>

    </html>

    ```


    # Example HTML Document


    Below is a well formed HTML 5 document that includes one comment and all the tags
    and text necessary for a web browser to draw the document. The document is shown
    drawn by the Firefox web browser in Figure 8.


    # Example 1


    ```html

    <!DOCTYPE HTML>

    <html lang="en-us">

    <head>

    <!-- The following meta tag tells the browser that this document

    uses the 8-bit Unicode Transformation Format encoding. -->

    <meta charset="utf-8">


    <meta name="author" content="Rex Barzee">

    <title>Horse Rentals</title>

    </head>


    <body>

    <h1>Horse Rentals</h1>

    <p>we rent horsies, big horsies, medium sized horsies, and little horsies

    (big dogs really). Of course, this costs a great deal of money, and in order

    for us to allow you to take the horsies anywhere, as if you were buying a house
    or being

    admitted to a hospital (which might happen if you fall off one of our

    horsies).</p>


    <p>

    we also rent horsy saddles and other leather and metal stuff. Just ask for

    what you want, and we probably have it. These are mostly used to control the

    horsies which they don''t like. If you don''t take great care when putting

    these on the horsies, you might be admitted to the hospital as mentioned in

    the above paragraph.</p>


    <p>we also rent horsy trailers. These trailers require a truck the size of

    Texas that drinks diesel in order to actually pull them. Of course, if

    don''t have a truck that fits this description, we''ll rent you one. See the

    first paragraph again for our rental terms (big money).</p>

    </body>

    </html>

    ```


    # Horse Rentals


    We rent horsesies, big horsesies, medium sized horsies, and little horsies (big
    dogs really). Of course, this costs a great deal of money, and in order for us
    to allow you to take the horsesies anywhere, you must sign a lot of paper work;
    about the same amount as if you were buying a house or being admitted to a hospital
    (which might happen if you fall off one of our horsesies).


