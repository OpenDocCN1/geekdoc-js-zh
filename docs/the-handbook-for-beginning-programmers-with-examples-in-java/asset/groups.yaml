    \ onclick=\"showMessage()\">Message</button>\n</body>\n</html>\n```\n\nNotice\
    \ at line 22 in line 1 there are opening and closing button tags that create the\
    \ button shown in Figure 10. Notice at line 22 that the button has an onclick\
    \ attribute. When a user clicks this button, the computer executes the JavaScript\
    \ code contained in the onclick attribute. The onclick code executes the showMessage\
    \ function which begins at line 12 and ends at line 17. Within this function at\
    \ line 16 is a command which causes the computer to open a popup window containing\
    \ the text \"Water is delicious!\" as shown in Figure 11.\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_41_0.png)\n\
    \nFigure 10: A simple HTML document with a single button drawn in Firefox.\n\n\
    To run the program in example 1, simply type all the code shown in example 1 (or\
    \ copy and paste the code if you are reading this as an e-book) into a text editor.\
    \ Don't type or copy the line numbers. Save the file with the suffix of .html,\
    \ load the file in a browser, and click the Message button.\n\n# Running a Program\n\
    \nThe computer runs or executes JavaScript code when certain events happen. These\
    \ events include when an HTML document is loaded, when a user clicks a button,\
    \ or even when a user moves the mouse. For example, the function in example 1\
    \ is executed when a user clicks the Message button.\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_42_0.png)\n\
    \nExample 11: A popup window that was opened by the Firefox browser because a\
    \ user clicked the Message button.\n\n# Comments\n\nA comment in a JavaScript\
    \ program is a note or documentation that a programmer writes for himself or other\
    \ programmers who will look at his code. Comments are ignored by the computer.\
    \ There are two styles of comments in JavaScript: single line and inline. A single\
    \ line comment begins with two forward slashes (//), and ends at the end of the\
    \ line of text. A multi-line comment begins with a forward slash and an asterisk\
    \ (*), and ends with an asterisk and a forward slash (*). When writing a multi-line,\
    \ programmers start each line with an asterisk to make the comment stand out from\
    \ the other code. Both styles of comments are shown in example 1, multi-line at\
    \ lines 7–11 and single line at lines 13–15.\n\n# Statements\n\nA JavaScript program\
    \ is composed of statements. A statement is a complete statement within a program.\
    \ Statements in JavaScript end with a semicolon (;). Notice in command that the\
    \ statement at line 16 ends with a semicolon. When writing a program, a programmer\
    \ will often group statements together in a block by surrounding them with curly\
    \ braces: { }.\n\nJavaScript Basics\n\n# Case Sensitive\n\nJavaScript is case\
    \ sensitive, so if you want your JavaScript program to work, you must be careful\
    \ to always type characters with the correct case. For example, to cause the computer\
    \ to open a popup window, you must type window.alert not Window.Alert.\n\n# Declaring\
    \ Variables\n\nA variable is a location within the computer's memory to store\
