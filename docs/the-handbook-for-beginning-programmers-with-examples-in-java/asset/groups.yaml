    \nAs an example, 1987 is MCMLXXXVII (1000 = M, 900 = CM, 80 = LXXX, 7 = VII).\n\
    \n# Chapter 7. Logic\n\nWhen writing a condition in an if statement, we often\
    \ want the computer to evaluate more one comparison. For example, we may want\
    \ the computer to check if a person is male and older than forty. To combine more\
    \ than one comparison within an if statement we use the logical operators.\n\n\
    # Chapter Outcomes\n\nBy the end of this chapter you will be able to:\n\n- Read\
    \ and write if statements with multiple comparisons in the condition.\n- Understand\
    \ the logical operators: Not (!), And (&&), Inclusive Or (||), and Exclusive Or\
    \ (^).\n- Use the logical operators to refine searches.\n- Write truth tables\
    \ to help you evaluate and rewrite logical expressions.\n\n# Logical Operators\n\
    \nTo combine two or more comparisons in the condition of a single if statement,\
    \ we use the logical operators, also called the boolean operators. The following\
    \ table describes the four JavaScript logical operators.\n\n| Operator | Name\
    \ | Description |\n|---|---|---|\n| ! | Not | Unary operator that reverses or\
    \ switches a false value to true and a true value to false |\n| && | And | Binary\
    \ operator that combines two conditions, and the combined condition is true; if\
    \ and only both conditions are true, otherwise the combined condition is false\
    \ |\n| || | Inclusive Or (Or) | Binary operator that combines two conditions,\
    \ and the combined condition is true; if either or both conditions are true, otherwise\
