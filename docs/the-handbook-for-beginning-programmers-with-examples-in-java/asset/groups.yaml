    在程序中，我们经常希望计算机将数组中的所有元素初始化为某个值（通常是 0）。我们通过编写一条给数组中的一个元素赋值的语句来实现，然后将该赋值放在循环内部。如果数组有\
    \ n 个元素，程序员必须编写一个循环执行 n 次，为数组中的每个元素进行赋值。如下所示：\n\n![](img/ef8ee93db95f659f7e069b8fe140b87b_159_0.png)\n\
    \n# 示例 12\n\n```javascript\n// 递减的值\nfunction reverseRamp(list) {\n    var high\
    \ = list.length - 1;\n    for (var i = 0; i < list.length; i++) {\n        list[i]\
    \ = high - i;\n    }\n}\n```\n\n| 元素 | | | |\n|---|---|---|---|\n| 索引 | [0] |\
    \ [1] | [2] |\n\n# 反转数组\n\n反转数组中元素的顺序在程序中并不常用。然而，这是一个有趣的操作，有助于学生理解常用的数组操作。一种方法是使用两个索引变量，一个从数组开始，另一个从数组结束。然后编写一个执行\
    \ n/2 次的循环，其中 n 是元素的数量。每循环一次，计算机会将数组左半的一个元素与右半的一个元素进行交换。\n\n```javascript\n//\
    \ 反转数组的内容\nfunction reverse(list) {\n    var left = 0;\n    var right = list.length\
    \ - 1;\n\n    while (left < right) {\n        // 交换两个元素\n        var swap = list[left];\n\
    \        list[left] = list[right];\n        list[right] = swap;\n\n        //\
    \ 向中心移动索引\n        left++;\n        right--;\n    }\n}\n```\n\n| 元素 | left | right\
    \ | swap | | |\n|---|---|---|---|---|\n| 3.4 | -2 | 5 | 7 | 12 |\n| [0] | [1]\
    \ | [2] | [3] | [4] |\n\n"
