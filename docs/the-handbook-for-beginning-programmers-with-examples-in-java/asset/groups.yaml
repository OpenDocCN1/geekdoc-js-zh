    /* Compares two values, s1 and s2 returns -1\n* if s1 should come before s2, 1\
    \ if s1 should come\n* after s2, and 0 if the two values are equal. */\nfunction\
    \ desc(s1, s2) {\n  if (s1 > s2)\n    return -1;\n  if (s1 < s2)\n    return 1;\n\
    \  return 0;\n}\n\nvar vegetables = [ \"Radish\", \"Carrot\", \"Tomato\", \"Pea\"\
    \ ];\nvegetables.sort(desc);\n```\n\nBy default the built in sort function in\
    \ JavaScript sorts arrays lexicographically which essentially means alphabetically.\
    \ This causes problems if you wish to sort an array of numbers.\n\n# Example 22\n\
    \n```javascript\nvar numbers = [ 7, 10, 8, 16, 3, 35 ];\n\n// WARNING: this will\
    \ sort the numbers array\n// alphabetically and not numerically.\nnumbers.sort();\n\
    ```\n\nIn the previous code, after the computer calls the sort function, the values\
    \ in the numbers array will be [10, 16, 3, 35, 7, 8]. By default the built in\
    \ JavaScript sort function places 10 and 16 before 3, 7, and 8 because 10 and\
    \ 16 begin with 1 and alphabetically 1 comes before 3, 7, and 8. To force JavaScript\
    \ to sort an array to its numeric values, we have to pass a comparison function\
    \ into the sort function.\n\n# Example 23\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"\
    en-us\">\n<head>\n<meta charset=\"utf-8\">\n<title>Compound Interest</title>\n\
    <script type=\"text/javascript\">\n/* Input: No user input\n* Processing: Test\
    \ the built-in JavaScript sort function\n* Output: The contents of an array before\
    \ it is\n* sorted, and the contents after it is sorted.*/\nfunction testSort()\
    \ {\n  var numbers = [ 7, 10, 8, 16, 3, 35 ];\n  document.getElementById('output').innerHTML\
    \ = numbers + '<br>';\n  numbers.sort(compareNumbers);\n  document.getElementById('output').innerHTML\
    \ += numbers;\n}\n\n/* Compares two numbers by subtracting the second from the\n\
    * first which will return a negative number if the first\n* number should be placed\
    \ before the second, a zero if the first\n* two numbers are equal, and a positive\
    \ number if the first\n* number should be placed after the second. */\nfunction\
    \ compareNumbers(x, y) {\n  return x - y;\n}\n</script>\n</head>\n<body>\n<button\
    \ onclick=\"testSort()\">Sort Array</button>\n<div id=\"output\"></div>\n</body>\n\
    </html>\n```\n\nYou might be wondering how a sort works. There are many different,\
    \ well known algorithms (selection, heap, quick). They all work by repeatedly\
    \ comparing elements within arrays. Shown below is JavaScript code to sort an\
    \ array using insertion sort.\n\n# Example 24\n\n```javascript\nfunction sort(list)\
    \ {\n  var last = list.length - 1;\n  for (var i = 1; i <= last; i++) {\n    var\
    \ swap = list[i];\n    for (var j = i; j > 0; j--) {\n      if (swap < list[j\
    \ - 1]) {\n        list[j] = list[j - 1];\n      } else {\n        break;\n  \
    \    }\n    }\n    list[j - 1] = swap;\n  }\n}\n```\n\n# Common Mistakes\n\nForgetting\
    \ that the first index in an array is always 0\n\nIncorrect\n```javascript\nfor\
    \ (var i = 1; i < a.length; i++) {\n  a[i] = 0;\n}\n```\n\nCorrect\n```javascript\n\
    for (var i = 0; i < a.length; i++) {\n  a[i] = 0;\n}\n```\n\nGoing beyond the\
    \ end of the array\n\nIncorrect\n```javascript\nfor (var i = 0; i <= a.length;\
    \ i++) {\n  a[i] = 0;\n}\n```\n\nCorrect\n```javascript\nfor (var i = 0; i < a.length;\
    \ i++) {\n  a[i] = 0;\n}\n```\n\n# Chapter Summary\n\n- An array is a collection\
    \ of variables. Each variable in an array is called an element and has a unique\
    \ index which denotes that element's location within the array.\n- To declare\
    \ an array, use the keyword var.\n- To create an array which will reserve space\
    \ in memory for the elements of the array, write code uses the keywords new and\
    \ Array, like this:\n  `arrayName = new Array(size);`\n- To create and populate\
    \ an array with known values write code square brackets ([ and ]) like this:\n\
    \  `arrayName = [ value0, value1, ... valueN ];`\n- All arrays in JavaScript automatically\
    \ have an attribute length which is the number of elements contained in the array.\n\
    - To access a single element within an array either to read or write the element's\
    \ value, use bracket notation:\n  `arrayName[index]`\n- To process all the elements\
    \ in an array, a programmer will usually write a loop that counts from zero to\
    \ the length of the array similar to this:\n```javascript\nfor (var i = 0; i <\
    \ array.length; i++) {\n  // Process each element of array using i as the index.\n\
    }\n```\n- JavaScript includes many built-in methods that process arrays, including:\
    \ concat, indexOf, lastIndexOf, pop, push, reverse, and sort.\n\n# Review Questions\n\
    \n1. Write JavaScript code to declare and create an array named data that has\
    \ 75 elements.\n2. Write JavaScript code to call the fill function as given in\
    \ example 10 of this chapter and pass the array created in the previous question\
    \ to the fill function.\n3. Write JavaScript code to declare and create an array\
    \ named samples that holds values: 72, -3, 59, 0, 16.\n4. Write code to output\
    \ (display to the user) the value stored at index 1 in the samples array.\n"
