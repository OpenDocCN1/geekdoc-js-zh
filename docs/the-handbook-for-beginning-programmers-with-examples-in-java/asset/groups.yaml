    \ assignment | x *= 5; | x = x * 5; |\n| /= | division assignment | s /= t; |\
    \ s = s / t; |\n| %= | modulus assignment | w %= z; | w = w % z; |\n| += | addition\
    \ assignment | x += y; | x = x + y; |\n| -= | subtraction assignment | r -= t;\
    \ | r = r - t; |\n\nFor example, x += 2 is equivalent to x = x + 2. In other words\
    \ the += operator is a combination of addition and assignment and is shortcut\
