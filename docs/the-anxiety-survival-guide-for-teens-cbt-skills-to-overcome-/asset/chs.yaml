  \ FDA 状态。\n\n“获得额外帮助：治疗与药物”改编自詹妮弗·香农的《青少年害羞与社交焦虑工作手册》。经 New Harbinger Publications,\
  \ Inc. 许可使用。\n\nRaincoast Books 在加拿大分销。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n除了基因组成外，你的焦虑水平还会受到创伤性经历或父母焦虑行为的影响。因此，为自己的焦虑感到自责，就像自怪自己的眼睛颜色、发生在你身上的事情或你出生家庭一样毫无意义。你无法改变你的基因、生活经历或你的父母。这些是你被分到的牌牌。但你是否必须与焦虑共度余生，错过你想做的事情呢？数百万焦虑的青少年注定会成为焦虑的成年人吗？绝对不是！你*可以*学习如何管理焦虑，从而去做对你来说重要的事情。这本书将告诉你如何做。\n\
  以下是本书涉及的不同焦虑类型的简要概述。你还可以在 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)\
  \ 下载一份简短测试，帮助你识别自己患有哪种类型的焦虑。（有关下载的更多信息，请参阅本书最后最后。）如果不止一种，请不要惊讶；这非常常见。本书的后续章节将更详细地关注如何应对你特定的焦虑类型。\n\
  \n\n\n## 接纳\n\n想象一分钟，你被扔进一片广阔的海。你挥动手脚踢水以防止沉没，起初似乎有效，但随着精力竭，效果恰恰相反。为了浮起来，你必须尽可能张开四肢并充满空气。当你面对第一个挑战时，你会开始感到不适或与恐慌相关的感受。你的本能会是紧绷身体、收缩胃、紧张肌肉并动起来。记住，不要对抗这些感受。对抗这些感受正是让你陷入困境的原因。你越抵抗，它持续越久。\n\
  \n通过抵抗不适的感受，你在同意你的猴子认为这些感受是危险的。要掌握恐慌，要反过来，接纳你的不适的感受。\n\n## 迎接呼吸\n\n正如你所学的，当我们感到焦虑时，呼吸变得浅而快。这种呼吸方式会产生各种生理变化，并产生增强感受的效果，导致你更加回避它们，呼吸变得更快、更浅。这种呼吸方式告诉你的身体你同意猴子的观点：*出错了！*\n\
  \n为了迎接焦虑感受而不是回避它们，用相反的方式呼吸：\n\n1.  深呼吸，充盈肺部，让腹部变软并扩张。\n2.  完全呼气，让腹部收缩。\n3.  缓慢而有目的地重复。\n\
  \n通过有意识地选择缓慢平稳地呼吸，你是在告诉身体：*我可以应对。*这种呼吸方式将帮助你度过剧烈和不适的感受波动。它还有一个额外的好处，即可以训练你的猴子——当你迎接它警告过的过的焦虑时，它拿不到香蕉了。\n\
  \n\n\n\n\n请记住，你并不是在试图放松。放松技巧（例如想象自己处于一个宁静的海滩上）是基于这样观点：你的不适感是糟糕的且必须被停止。如果你曾经尝试过那种技巧，你就知道它不起作用。\n\
  \n当你用呼吸迎接恐慌感时，无论你是发现自己焦虑减轻了还是加剧了并不重要。重点在于你接受了这些感受。你正在向自己证明，感觉糟糕并不危险。它仅仅是生活的一部分——是你当它出现时，你愿意去体验的一部分。这就是你掌控“猴子”并主恐慌的方法。\n\
  \nKim 在爬阶梯上付出了巨大的努力。在十二周内，她对恐慌发作的恐惧减少了很多。当恐慌感波动袭来时，她能够识别出它们是无害的。这并不意味着她喜欢它们，但它们不再像以前那样恐吓她。因此，她的恐慌发作次数少得多。事实上，它们已经不再那么像恐慌发作了。它们变得温和、频率更低，间隔也更长。\n\
  \nKim 的努力改变了她与焦虑以及她的“猴子”之间的关系。当她感到焦虑时，她会立刻进入她的迎接呼吸状态。通过学会接受恐慌，她掌握了它，她的世界也随之敞开了。\n\
  \n拥有了知识和工具，你可以去任何你想去的地方。*你*想去哪里？你在等什么？\n\n## 广场恐惧症\n\n`agoraphobia`（广场恐惧症）听起来有点可怕，而且经常被误解。大多数人将广场恐惧症理解为害怕离开房子。这种特定的恐惧可能是其中的一部分，但它并不是广场恐惧症的定义。\n\
  \n广场恐惧症是指害怕在难以逃脱或令人尴尬的地方或场合，或者在可能无法立即获得帮助的情况下，发生某种袭击的恐惧。这可能是恐慌发作、大便或膀胱控制失控、头晕、昏厥、呕吐、哮喘发作、头痛或其他剧痛。换句话说，广场恐惧症是对害怕发作并被困住的恐惧。\n\
  \n触发“被困住”恐惧的常见情况包括在飞机上、汽车里、桥上，或者在远离出口的电影院或教室里。这并不是害怕飞机坠毁或害怕桥的高度——那些属于特定的恐惧症。相反，一个患有广场恐惧症的青少年会害怕在飞机或桥上发作并被困住。\n\
  \n一些患有广场恐惧症的人对吃药产生恐惧——再次，不是因为他们害怕窒息（这是一种特定的恐惧症），而是因为他们觉得药物一旦进入身体，他们就会困住，必须等待任何可能的副作用消失。广场恐惧症患者也经常担心自己离家、医院或洗手间有一定距离。他们也可能担心独自一人。在三个患有恐慌发作问题的人中，约有一个会发展为广场恐惧症。\n\
  \n要让自己从广场恐惧症中解出来，你将使用与恐慌发作相同的步骤。不，等等，逻辑/上下文检查：要让自己从广场恐惧症中解出来，你将使用与恐慌发作相同的步骤。你可以从书末附录列出的其他资源了解更多关于广场恐惧症的信息。\n\
  \n![Image](img/8-1.jpg)\n\n# 第 8 章\n\n# 特定恐惧症\n\n昆虫、呕吐和针头——救命！\n\n回到四年级，Anton 十岁时，他的同学在野外旅行的巴士地板上呕吐了。从那时，Anton\
  \ 就对患胃肠炎感到极度恐惧。他避免乘坐校车，除非是往返学校，而那路程很短。他拒绝乘坐巴士参加野外旅行，所以要么是他父母开车送他，要么是他根本不去。如果学校里有人抱怨感到不舒服，Anton\
  \ 就会开始恐慌，并尽可能避开那个人。他不断检查自己的身体是否有恶心的迹象，每当他感到饥饿或太饱时，他都会担心这种不适可能是他生病的征兆。Anton 还担心吃可能让他生病的食物，所以他总是检查有效期，并想知道食物在\
  \ particular 吃之前在外面放了多久。他随身带着抗酸药来镇胃。最糟糕的是，Anton 晚上经常难以入睡，因为他担心自己会在半夜醒来呕吐。\n\nAnton\
  \ 有一种特定恐惧症，这意味着他对特定的事物或情境有极度的恐惧。你在第 2 章见过的 Justin 对狗有特定恐惧症。Anton 的恐惧症集中在呕吐上。\n\n\
  恐惧症非常常见。事实上，大多数人都有某种程度的恐惧症。被某些事物惊到是人性的一部分。但当你的恐惧症阻止了你做你想做的或去你想去的地方时，这就是一个真正的问题。\n\
  \n这就是 Anton 正在经历的情况。他不能去他朋友喜欢的某些餐厅吃饭，因为担心食物会让他生病。他不能进行长途汽车旅行，因为他担心自己会晕车。如果他的任何朋友或他们家中的任何人最近生病了，他就不会靠近那些朋友。他的恐惧症阻碍了他按照自己想要的方式生活。\n\
  \n特定恐惧症可能关于几乎任何事物，但这里是一些最常见的类型：\n\n*   动物：狗、猫、老鼠、大鼠、鸟、蛇、昆虫\n*   自然环境中发生的事物：高度、水、雷雨或闪电\n\
  *   情境和地点：乘汽车旅行、飞机、火车或船只；密闭空间如衣柜和隧道\n*   医疗问题：受伤、针头、医院\n*   疾病和身体功能：呕吐、胃肠炎、食物中毒、药物或食物窒息、喉干、无法呼吸\n\
  \n就像所有的焦虑一样，特定恐惧症根源于我们对生存的基本需求。有很多动物——甚至是昆虫——可以杀死你。人们*确实会*溺水、坠落死亡或被闪电击中。事故*确实会*发生在乘坐汽车和飞机的人身上。如果你被困在狭窄空间，你*可能会*死亡。\n\
  \n但尽管恐惧症源于潜在威胁，但它们是不现实且夸张的。对于焦虑的青少年来说，大脑中决定什么是危险的部分（我们称之为“猴子大脑”）是过度活跃的且对威胁过度敏感。它犯了一个经典的计算错误：1)\
  \ 高估了威胁，2) 低估了你处理的能力。这种对危险的评估无异于一次疯狂的猜测。\n\n所以，为什么你的“猴子大脑”会对你的特定恐惧症做出疯狂猜测呢？你无法真正知道。你天生的基因以及父母或照顾者对你榜样的行为可能产生了影响。可能还有某次糟糕的经历触发了你的恐惧症。\n\
  \n第 2 章的 Justin 在被狗攻击后产生了对狗的恐惧。如果你看到或读到过惨痛的飞机坠毁或有人被闪电击中，你可能会对同样的事情发生在自己身上产生恐惧。或者你可能被训练得对某事要格外小心。从小起，甚至在他产生对呕吐的恐惧之前，Anton\
  \ 的妈妈就告诉他，每当周围有病人的人时要用鼻子呼吸。\n\n无论你的恐惧症是如何起源的，问题都是一样的。当你面对你的恐惧症时，你的猴子大脑会触发你的焦虑警报，你发现自己处于战斗或逃跑模式。你觉得威胁是真实的，并会竭尽办法规避它。然后，当并没有发生坏事时，你的猴子会归功于保护了你的安全，强化了它最初对危险的疯狂猜测，从而再次开始整个过程。这就是让所有焦虑持续的*回避循环*。\n\
  \n\n\n\n\n如果安东（Anton）远离患了流感的好朋友，然后自己也没有生病，那么他的“猴子脑”就会决定：*因为你避开了你的朋友，你才没有生病和呕吐！*\n\
  \n以下是关于不同恐惧症的“猴子逻辑”的几个典型例子：\n\n*   **猴子想法：** *如果一只蜘蛛在晚上掉到你身上并在你睡觉时咬了你怎么办？*\n*  \
  \ **回避行为：** 环顾床边和房间角落，确保没有蜘蛛。\n*   **猴子逻辑：** *因为你确保了没有蜘蛛，所以你才没有被咬。*\n\n*   **猴子想法：**\
  \ *如果你打针，会非常非常、非常疼，你将无法忍受的！*\n*   **回避行为：** 不要去看医生或看牙医。\n*   **猴子逻辑：** *因为你没有打针，所以你不需要承受可怕的痛苦。*\n\
  \n*   **猴子想法：** *万一被雷劈了怎么办？*\n*   **回避行为：** 如果下雨或阴天，就不要出门。\n*   **猴子逻辑：** *因为你没有出门，所以你没有被雷劈。*\n\
  \n*   **猴子想法：** *万一有一粒爆米花卡在喉子里让你无法呼吸怎么办？*\n*   **回避行为：** 避免吃爆米花，或者吃爆米花时随时准备好饮料，以防卡住喉咙。\n\
  *   **猴子逻辑：** *因为你没有吃爆米花，或者身边有水，所以你没有窒息死亡。*\n\n*   **猴子想法：** *如果你坐电梯，它可能会卡住，你永远无法得出来。*\n\
  *   **回避行为：** 改走楼梯。\n*   **猴子逻辑：** *因为你走了楼梯，所以你没有被困在电梯里。*\n\n## 驯服恐惧猴的工具\n\n一旦你的猴子脑决定某事是危险的——无论是蜘蛛、高度还是你自己的衣柜——它它就会拉响警报，让你进入战斗或逃跑模式。当你的身体被恐惧淹时，即使是猴子脑的荒野猜想也可能看起来是真的。那么，你如何知道你所害怕的事物是否真的危险呢？\n\
  \n### 猴子的计算错误\n\n你总是可以通过猴子的计算错误来判断一个“猴子想法”。猴子其实并不擅长评估风险。除了经典的高估或低估计算错误外，针对特定的恐惧症，通常会发现以下三种计算错误：\n\
  \n1.  **灾难化：** 猴子脑想象可能发生的最坏情况。\n    *   *如果你在徒步时被响环蛇咬了怎么办？*\n    *   *正在暴雨；万一你被雷劈了怎么办？*\n\
  \    *   *当你开车通过桥梁时，桥塌了怎么办？*\n    *   *万一药片卡在喉咙导致你窒息而怎么办？*\n\n2.  **忽略正面因素：** 你的猴子忘记了所有你处于恐惧情境但没有发生任何事的情况。你有多少次路过蜜蜂没有被蜇，或者感到恶心但没有呕吐，或者坐过没有卡住的电梯？多到数不完。但你的猴子脑不会考虑良好的结果。它的工作是探测威胁，无论可能性有多小——这把我们带来了最后一种猴子计算错误。\n\
  \n3.  **对不确定性的不忍：** 即使只有 `.01` 百分的概率可能发生可怕的事情，你的猴子也不会休息。一个极好的例子是恐高。飞机是目前为止是最安全的旅行方式，你的概率极低。\n\
  \n### 识别想法\n\n一旦你的猴子脑决定某事是危险的——无论是蜘蛛、高度还是你自己的衣柜——它就会拉响警报，让你进入战斗或逃跑模式。当你的身体被恐惧淹时，即使是猴子脑的荒野猜想也可能看起来是真的。那么，你如何知道你所害怕的事物是否真的危险呢？\n\
  \n（注：用户提供的文本包含重复章节和碎片句子。我根据指令对核心流程进行了结构处理。）\n\n\n\n\n\n如果你继续按照猴子的规则行事，那么你在识别“猴子思维”上所做的一切都是徒劳的。每当你通过逃避所谓的威胁来回应猴子的警报时，你实际上是在给它一根香蕉。要统治你的猴子，你必须忽视它的虚假警报，并真正走向你恐惧的事物。这并不容易。事实上，这可能是你做过最困难的事情。\n\
  \n# 人生指南\n\n也许现在是时候问自己，克服恐惧症对你来说是否重要到值得你忍受过程中产生的焦虑。你的逃避让你付出了什么代价？你错过了什么？这些事情值得战斗吗？\n\
  \nTrish 害怕蜘蛛，她列出了以下她的恐惧让她付出的代价清单：\n\n![Image](img/8-5.jpg)\n\nTrish 决定开始面对对蜘蛛的恐惧是值得的。不能和朋友去露营是致命的。\n\
  \nDan 害怕电梯。他的清单看起来如下：\n\n![Image](img/8-6.jpg)\n\n他决定面对自己的恐惧并不真的值得。他能很轻松地避开电梯，虽然他的恐惧很尴尬，但朋友们依然喜欢他。\n\
  \n这里是 Anton 的清单：\n\n![Image](img/8-7.jpg)\n\n对于 Anton 来说，决定显而易见。他的恐惧症每天都在影响他，无论他去哪里。为了能够和朋友一起玩、在餐厅吃饭以及进行长途自驾，面对焦虑是值得的。Anton\
  \ 准备好开始统治他的猴子了。\n\n为了帮助你决定面对恐惧症是否值得，你可以从 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)\
  \ 下载“人生指南”工作表。\n\n## 挑战梯子\n\n如果你恐高，你不会直接去大峡谷站在边缘。如果你害怕蜜蜂，你不会从访问蜜蜂场开始。统治猴子最好的方法是朝着你恐惧的方向迈出小的、可控的步骤——就像爬梯子一样。\n\
  \n![Image](img/8-8.jpg)\n\n你梯子上的每一步将是一个你可以应对而不会感到不知所措的挑战。当你应对每一项挑战时，你将学会忽视猴子的嚎叫，并对自己对危险的评估充满信心。\n\
  \nAnton 对呕吐的恐惧是如此不知所措，以至于即使听到或说这个词都会让他焦虑。这听起来像是他梯子第一阶的一个很好的挑战。\n\n以下是针对其他类型恐惧症的挑战梯子建议：\n\
  \n### 恐惧动物\n*   看你害怕的动物的图片、卡通或彩色照片\n*   听动物的录音——例如狗的低吼或吠叫声、蛇的嘶嘶声或鸟的鸣叫声\n*   观看动物的视频\n\
  *   去宠物店\n*   在动物被某种方式限制起来时观察它（例如牵着绳绳的狗，或者宠物店玻璃容器里的蛇或啮类动物）\n*   触摸动物\n\n### 恐高\n\
  *   站在椅子上\n*   爬梯子\n*   爬树\n*   一层一层地上建筑的楼层\n*   从高层建筑的窗户向下看，然后从打开的窗户向下，最后从阳台向下\n\
  *   乘坐摩天轮\n\n### 恐惧风暴\n*   看风暴和闪电的照片\n*   听雨声、雷声和闪电声\n*   看雨、雷、闪电的视频\n*   在外面下雨或暴雨时站在打开的窗户旁\n\
  *   在多云时出去，然后在下雨时出去，最后在雷暴期间出去\n\n### 幽闭恐惧症，或害怕被困住\n*   进入开着门的衣柜\n*   进入关着门的衣柜\n\
  *   用毯子紧紧地裹住自己\n*   在头上盖一条厚毯子\n*   在电梯门关着的电梯里站很长时间\n*   坐在只有两扇门的汽车后座\n*   进入阁楼或狭小的爬行空间\n\
  \n### 恐惧医生、血液或针头\n*   阅读或听“血液”、“受伤”、“注射”、“针头”、“注射器”、“牙医”、“钻孔”、“医生”和“手术”等词\n*   看卡通图片，然后看血液或针头的真实彩色照片\n\
  *   去牙医或医生的候诊室，或访问医院\n*   制作假血，将其涂在自己或他人的身上并观察它\n*   去献血站观看采血过程\n*   观察并处理注射器或牙科工具\n\
  *   阅读有关医疗程序的内容，或观看关于这些内容的电视节目或电影\n*   观看别人采血、自己采血或接受注射\n*   坐在牙医椅上，洗牙齿或补牙\n\n你可以从\
  \ [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431) 下载“挑战梯子”工作表。\n\
  \n## 应用紧张法\n\n如果你曾经在看到针头或血液时昏厥、感到头晕或眩晕，那么你很可能经历了血压突然下降。去看医生以确保没有其他问题是一个好主意。通过使用\
  \ `applied tension`（应用紧张法），你可以让自己在看到针头或血液时不易昏倒。\n\n### 应用紧张法说明\n*   坐在椅子上，绷紧你的手臂、腿部和腹部。通过握拳并弯曲手臂来绷紧。你可以向前伸腿来绷紧。对于腹部，想象有人向你扔了一个球，然后收紧肌肉。同时进行这些动作，保持十到十五秒，然后放松三十秒。重复五次。这样做时你可能会感到头部压力。这没关系——这说明练习有效。\n\
  *   当你练习这种方法一周后，你可以开始你的挑战梯子，同时练习 `applied tension`，之后你可以停止这样做。\n\n像 Anton 一样，你被猴子思维统治了长期，也许多年。学会忍受停止回避后产生的焦虑需要练习，所以对自己要有耐心。\n\
  \n## 接纳\n\n当你面对每一项挑战时，你可能会产生“硬撑”的冲动——屏住呼吸、咬紧牙关、抓住扶手，希望尽快过去。当你硬撑通过一项挑战时，你的猴子仍然在主。你仍然在回避可能发生的情况，并抵抗过度焦虑。\n\
  \n![Image](img/8-9.jpg)\n\n你在每次挑战中的目标是完全接纳所产生的任何感觉。这与你到目前为止所做的完全相反。你一直都在逃避恐惧症；你现在的挑战是面对你的恐惧症。这意味着故意产生焦虑——并且当你感到焦虑时，允许焦虑存在那里，而不采取任何消除它的行动。这就是我们所说的接纳——无条件的屈服。\n\
  \n如果你在进入挑战时说：“我准备好面对这种恐惧了，我想尽可能地焦虑！”你的挑战效果会好得多。这会让你的猴子非常困惑。你过去一直在奖励它保护你免受焦虑。每当它预测灾难并拉警报时，你都在给它一根香蕉。当你忽视警报并迎接焦虑时，你是在按照*你*的规则行事，而不是猴子的规则！\n\
  \n\n\n\n为了控制和避免焦虑，人们会通过憋气或呼吸过快来变得紧张。或者，他们会利用呼吸来尝试放松。通过紧张或尝试放松，你并没有让焦虑顺其自然。你实际上是在认同你的“猴子”的想法，认为焦虑是一个需要你采取行动的危险信号。当你通过紧张或尝试放松来面对挑战时，你并没有真正在应对挑战。\n\
  \n### 迎接焦虑\n\n要接纳焦虑，你必须学会向它的*内部*呼吸——这与你一直所做的完全相反。为了让你明白我的意思，请详细地想象你恐惧的事物，直到让你的焦虑程度在\
  \ 1 到 10 的`scale` 上至少达到 5。在达到这一点之前，不要继续往下看。\n\n感到不舒服吗？很好！现在执行以下操作：\n\n1. 深吸气，充满肺部，直到你的腹部扩张。\n\
  2. 完全呼气。\n3. 缓慢而有目的地地重复。\n\n通过向焦虑内部呼吸，你是在告诉你的猴子，焦虑没有什么好怕的。你打开自己的身体，给焦虑留出发挥的空间。这是你从未做过的事情，所以它听起来可能很可怕。但不允许自己真正感受到焦虑，正是你的焦虑依然困扰着你的原因。你越抗拒，它就越持久。\n\
  \n![Image](img/8-a.jpg)\n\n当你持续迎接并持续呼吸时，你会发现你的焦虑感受会自己发生变化。起初，你的恐惧可能感觉更强烈了，仿佛会淹没并摧毁你。无论如何你的猴子大脑都是这么对你说的！但感受恐惧并不会伤害你。你的设计初衷就是为了感受，而且没有任何情绪能在生理上伤害你。\n\
  \nAnton 开始他的挑战时，只是说出“呕吐”、“吐”、“吐出来”等词汇。他记录了这些词让他感到多么焦虑，在只进行了三次练习后，重复说这些词仅让他的焦虑在 1\
  \ 到 10 的焦虑 `scale` 上达到了 1。但当他开始看人们呕吐的动画片时，他的焦虑上升到了 7。他每天看这些动画片，到周末时，他仍然对这些图片感到有些厌恶。但他的焦虑降到了\
  \ 2。\n\n人们呕吐的图片将 Anton 的焦虑推到了 9。有些图片真的很糟糕，所以他让父亲帮他挑选了一些不那么恶恶的图片作为开始。几天后，他能够看其中最糟糕的图片而焦虑没有超过\
  \ 3。\n\n当挑战让 Anton 感到胃部不适时，他注意到焦虑增加了。他的猴子大脑在嗡嗡作响，告诉他快要吐了。当然，Anton 知道这种情况发生的概率微乎其微！他一生中只吐过两次！他坚持挑战的时间越长且没有吐出来，他的焦虑就越低。\n\
  \nAnton 决定他已经准备好去听人们呕吐的声音。他让他父亲选了一些 YouTube 上人们呕吐的视频。他遮住电脑屏幕，让自己看不到图像，并将视频设置为循环播放。当他的焦虑下降到\
  \ 2 时，他开始一边看图像一边听声音。他适应这一切的时间比他想象的要短。他的厌恶感从未真正消失，但他变得没那么焦虑。\n\n所有这些阶梯式的练习在整天中都在帮助\
  \ Anton。每当朋友表现出任何生舒服的迹象时，他仍然感到焦虑，但逃跑的冲动比以前小得多，他发现自己可以通过呼吸来度过去。这些挑战带给他信心和信念，即感到恶心并不等同于呕吐。\n\
  \n一天，朋友邀请他参加一个在两小时车程外的音乐会。尽管这意味着要在那里一直待在车里并在奇怪的地方吃饭，令 Anton 自己都惊讶的是，他答应了。尽管这意味着一直待在车里并在奇怪的地方吃饭，这种想法不再让他那么害怕。这种想法很好！\n\
  \n许多人们通过合理化来回避那些可能发生的事情，但他们内心却在担心。你不需要这种方式来征服你的猴子。焦虑*可以*是一个信号，毕竟，如果你对某件事有坏感觉，难道不应该关注它吗？记住，你并不孤单，不要自责。你可以对自己保持怜悯并要有勇气。\n\
  \n![Image](img/9-1.jpg)\n\n## 第 9 章\n\n# 泛化焦虑\n\n### 担心狂\n\nTess 从从小就被认为是一个“担心狂”。她几乎会担心任何事情，从蚊子叮咬会导致疾病到考试会毁掉上大学的机会。她几乎所有时间都感到压力，并且经常头痛和胃痛。晚上时情况糟糕，她经常入睡困难。她的想法就像轮子上的老鼠，不停地转动。她感到焦虑不安，每当她真的开始担心时就是如此。\n\
  \nTess 患有泛化焦虑。比起某些具体的恐惧——比如蜘蛛、被评判或恐恐发作——她有更广泛的恐惧。泛化焦虑的青少年担心学校、工作、家庭、健康以及世界上发生的事情。\n\
  \n这些担心是关于可能发生的事情，这会让人感到困惑。毕竟，如果你对某事的发生有坏感觉，难道不应该为了它去注意吗？但就像那个认为地面上的每一个足迹都是剑齿虎足迹的猎人，如果你患有泛化焦虑，你会得到太多的危险信号，以至于花费无数小时去解决已经解决或无法控制的问题。慢性担心没有用，是任何人都不想要的。患有这种焦虑的青少年说同样的话：“请帮我停止担心！”\n\
  \n当你患有泛化焦虑时，你的猴子大脑正在通过望远镜观察世界。小事被放大了，你会跳向最坏的情况。由此经历的担心让你精疲力竭，并且实际上干扰了你的注意力。这种担心对你的安全没有帮助。\n\
  \n![Image](img/9-2.jpg)\n\n和所有的焦虑一样，泛化焦虑是通过回避来维持的。你可能会列出无尽的列表以避免忘记任何事情。你可能会向朋友、父母或医生寻求保证，确认你没有问题。你可能会推迟决定以避免做出错误的决定。也许你通过过度学习来回避得低分的可能性。\n\
  \n有时候你所做的仅仅是担心。这怎么算回避呢？泛化焦虑的人相信，担心可以帮助他们在情况变糟时做好充分准备，或者只要他们担心得足够久，最终就能想出一个保护自己的解决方案。比起面对不知道会发生什么的不适，担心感觉更好受。担心是试图消除风险从而减少焦虑。\n\
  \n让我们来看看 Tess 的焦虑想法：*如果刚才咬我的那只蚊子带有西尼河病毒怎么办？* 这是一个可怕的想法。但这是 Tess 无法改变的事实，而且当她开始担心这种可能性时，她在给予该想法超出其应有的关注。她正在给她的猴子喂一根香蕉，告诉它这个想法很重要。只要她继续担心蚊子叮咬的最坏结果，并寻求它不会发生的保证，Tess\
  \ 就在助长她的回避循环。\n\n\n\n\n\n更糟糕的是，当你恐惧的结果并没有发生时（因为泛化焦虑患者所担心的大多数事情极都不可能发生），你的“猴子”会抢走所有的功劳。猴子的逻辑是：`因为你担心了西尼尔病毒，所以你没有染上它。`\n\
  \n让我们来看看这种“猴子大脑”在其他泛化性担忧例子中的作用。\n\n*   **猴子思维：** `如果你的头痛是由脑肿瘤引起的怎么办？`\n*   **回避行为：**\
  \ 担心。要求看医生。在互联网上查询脑肿瘤的其他症状。\n*   **猴子逻辑：** `因为你时刻留心观察状况，你死于脑肿瘤的可能性就更小了。`\n*   **猴子思维：**\
  \ `万一你父母离婚了怎么办？你的生活就毁了！`\n*   **回避行为：** 担心。询问父母一切是否都好。\n*   **猴子逻辑：** `因为你正在担心并向父母询问情况，万一发生了坏事，你也会做好准备。`\n\
  *   **猴子思维：** `如果你忘了某些重要的事情怎么办？那会毁掉一切！`\n*   **回避行为：** 担心。在脑海中回顾需要记住的事情。列很多清单。\n\
  *   **猴子逻辑：** `因为你列了清单没有忘记任何事，所以糟糕的事情没有发生。你拯救了大局！`\n*   **猴子思维：** `你可能会死于车祸！`\n\
  *   **回避行为：** 担心。告诉开车的人慢一点。观察路上的其他司机是否可能醉酒。\n*   **猴子逻辑：** `因为你担心并警惕了危险，你没有发生车祸。你躲过了一场灾难！`\n\
  \n当你对那些已经采取步骤准备的事情，或者你无法控制的事情感到担忧时，你是在奖励猴子逻辑。你正在给你的猴子一根香蕉。而且没有更好的方法能保证你的猴子会针对另一个可怕的结果产生另一个焦虑的想法了！这种回避的循环让你的担忧持续增强。\n\
  \n![Image](img/9-3.jpg)\n\n噢，顺便说一下，如果你担心的事情*真的*发生了，猴子大脑仍然会得到一根香蕉。无论这种担心是否有帮助，猴子逻辑都会说：`看，我早就告诉你了！幸好通过担心做好了准备！`\n\
  \n是的，我们确实需要为威胁做好准备并防止坏事的发生。焦虑可以是一个很好的警示，提醒你需要对问题的情况采取行动。但一旦你做了这些，反复重复这个过程——即担忧——是没用的。它所做的只是喂养猴子大脑并产生更多的焦虑。\n\
  \n## 驯服泛化焦虑猴子的工具\n\n担忧的挑战在于如何区分哪些是需要解决的问题的重要信号（焦虑想法），哪些是“猴子胡言”（的焦虑想法）。认为蚊子叮咬会导致西尼尔病毒是猴子的胡言。即使这是事实，在当下一刻你对它也无为力。\n\
  \n以下是一份情况列表。其中一些是行动号召的例子——为了防止或应对糟糕的状况。另一些是猴子胡言的例子——意味着事情可能会出错，但 1) 没有办法解决问题或 2)\
  \ 你已经解决了它但仍在担心。阅读每种情况并判断它是可以解决的问题还是猴子胡言。（答案将在最后提供。）\n\n*   a. 你担心因为没有复习，明天的历史考试可能考不好。\n\
  *   b. 你担心你的父母可能会离婚。\n*   c. 你已经学习到午夜，但你仍然担心明天的考试会考不好。\n*   d. 你担心自己可能会上胃流感，导致周末计划被泡汤。\n\
  *   e. 你担心自己面试表现得不好，可能得不到你真正想要的工作。\n*   f. 你已经提交了大学申请，但你担心自己进不了心仪的大学。\n*   g. 你想起你忘了朋友的生日，可能伤害了她的感情。\n\
  *   h. 现在已经是深夜了，你正在担心男朋友或女朋友可能会和你分手分手。\n*   i. 你妹妹刚拿到驾照，你担心她可能会发生车祸。\n*   j. 你的朋友边开车一边发短信，你担心他可能会发生车祸。\n\
  \n### 答案：\n\n*   a. 可以解决的问题。如果你没有复习，在第二天考试之前你还有些可以做的事。\n*   b. 胡言。无论这是否属实，你对它无能为力。\n\
  *   c. 胡言。你已经学习过了，虽然你可能并非无所不知，但担心这些并没有帮助。\n*   d. 胡言。担心这些有什么帮助？你要么会生病，要么不会。你对它无能为力。\n\
  *   e. 胡言。你已经面试完了了。在现阶段你什么也做不了。他们是否录用你取决于他们的决定。\n*   f. 胡言。你已经提交了申请。在现阶段你什么也做不了。\n\
  *   g. 可以解决的问题。你随时可以给朋友打电话祝她迟到的生日快乐。如果你这样做了仍然担心，那么它就变成了胡言，因为你已经做了尽力而为的事，而且你无法控制别人的感受。\n\
  *   h. 胡言。已经是深夜了——你对此能做些什么？\n*   i. 胡言。虽然新驾照员风险确实更高，但你对这无能为力。\n*   j. 可以解决的问题。开车时短信是危险的，而你有完全的权利这样做。\n\
  \n你自己的担忧情况可能不在这个列表中，而且它们可能让你觉得与众不同。幸运的是，你可以使用强大的工具来识别这些胡言并驯服猴子。\n\n### 识别想法\n\n\
  有三个基本问题可以问自己：\n\n1.  `我害怕什么？`\n2.  `如果这是真的，最坏的情况会是什么？` \n3.  `这对我、我的生活或我的未来意味着什么？`\n\
  \n这里是 Tess 的答案：\n\n![Image](img/9-4.jpg)\n\n在继续之前，请花一点时间识别一个你自己的想法。你可以在以下网址下载针对泛化焦虑的“识别想法”工作表：`http://www.newharinger.com/32431`\
  \ (`http://www.newharinger.com/32431`)。\n\n### 猴子的计算错误\n\n当你观察人们担心的事情时，通常有足够的证据表明这种经典的猴子计算错误：高估/低估。你可以在本章前面的猴子逻辑示例中看到这一点。\n\
  \n死于车祸极不可能，因为一次考试考砸就进不了大学也不太可能。担心这些结果是高估了它们发生的概率。\n\n那么父母离婚的可能性，或者你忘记作业的可能呢？这些不仅是对危险的过度估计，也是对你如果这些真的发生时应对能力的低估。无论你的猴子是在高估风险还是低估你的应对能力——或者两者都有——结果都是一样的。你的猴子告诉你：`担心！多担心！这是你做好准备或防止坏事发生的唯一机会！`\n\
  \n![Image](img/9-5.jpg)\n\n#### 灾难化\n\n任何情况都有很多可能的结果，但猴子大脑总是假设最坏的情况。自然，这让你在大部分时间里都感到紧张。这些灾难化的猴子想法听起来熟悉吗？\n\
  \n\n\n\n\n*   你肚子疼。这可能是沙门氏菌中毒！\n*   如果你旅行时忘掉了某样东西，计划就会泡汤！\n*   你妈妈最近很累。万一她得了癌症怎么办？\n\
  *   如果你曾经被留过校，那太糟糕了！\n\n### 对不确定性的不容忍\n\n无论积极结果的概率有多大，只要有一丝可能出现差错，你的“猴子大脑”就无法停歇。猴子大脑不会在没有明显危险信号的情况下假设你是安全的；相反，除非有\
  \ 100%的安全，否则它就会假设危险。由于 100%的安全是不可能的，你将无休止地担忧，追求无法实现的目标。\n\n### 替代想法\n\n在你再次花一分钟去担心某事之前，为什么不批判性地审视一下引发这种担忧的想法呢？如果你能同时观察支持该想法真实的证据，以及反对该想法真实的证据，你就能更好地判断你正在面对的是真正的威胁，还是仅仅另一个猴子的念头。\n\
  \n这里是特斯（Tess）关于“正反证据”的练习，针对的是她担心考试得 B 级意味着她无法上好大学并可能流落街头的威胁。如你所见，这让她对得 B 产生了一个更平衡的替代想法，让她减少了许多担忧。\n\
  \n![Image](img/9-6.jpg)\n\n*   **正方证据：** 我考试确实得了一个 B。考试成绩会影响课程的最终成绩，而最终成绩会影响平均绩点（GPA）。大学会看平均绩点。\n\
  *   **反方证据：** 这次考试仅占我课程总分的 20%。到目前为止我的课程平均分是 A，所以除非下次考试我得 B 或更低，否则这个 B 不会影响我的最终成绩。即使我的最终成绩是\
  \ B，我仍然会有不错的 GPA，并可以上很多好大学。\n*   **替代想法：** 虽然考试成绩确实会影响最终成绩，但我必须从现在起表现得很糟糕，才会在课程中得到一个坏分。即使我真的得了坏分，我仍然可以上好大学。\n\
  \n当你使用这个工具时，务必坚持基于事实。特斯在收集正反证据时，她可以说：“我以后可能会得很低分。”这并不是事实，只是未来可能发生的事。事实是：她到目前为止的平均分是\
  \ A，而这次考试占她最终成绩的 20%。坚持事实有时意味着你需要获取更多信息。例如，如果特斯不确定她感兴趣的大学对 GPA 的要求是什么，她可能需要查询一下。\n\
  \n你可以从这里下载此工作表——针对广泛性焦虑的“正反证据”表：[`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)。\n\
  \n### 专注注意力\n\n你的猴子大脑习惯了占据你所有的注意力。不断的杂语流是如此具有吸引力，除非你将注意力集中别处，否则你将一直受它的魔咒控制。\n\n\
  想象自己正坐在一股猴子的杂语声旁。你可以很容易完全沉浸在眼前浮现的所有焦虑想法中，但相反，你闭上眼睛，将注意力向内专注于你的呼吸。吸气时，注意空气流入的感觉和温度。呼气时，也注意这一点。呼吸本身并不重要，重要的是你正在将注意力从猴子的焦虑想法中引开。\n\
  \n你可以随时随地这样做，无论你此时是否在担心。事实上，在不担心时练习如何`focus attention`，是为担心时做最好的准备。\n\n将注意力从猴子身上移开是非常强大的，因为它让你置于`present\
  \ moment`，而你的猴子实际上无法到达那里。猴子所有时间都在回顾过去，寻找你犯过的错误，并想象未来，寻找威胁。无论你被焦虑的猴子杂语分散了多少次，只需继续将注意力带回到当下即可。这将帮助你从担忧中获得平静，并驯服你的猴子。\n\
  \n*在用了一段时间驯服工具后，特斯开始以不同的眼光看待她的担忧。她知道，得不到分不会直接导致“流落街头、孤苦伶”。情况正在好转！*\n\n## 统治广泛性焦虑猴子的工具\n\
  \n识别猴子的杂语并提出你自己的替代想法是掌握广泛性焦虑的关键。但只要你仍然使用回避性行为，如寻求保证、列过多的清单、过度努力学习或纯粹地担心，你就在按照你猴子的规则玩。\n\
  \n当你通过担心来回应猴子的杂语时，你是在说：“你说得对，猴子。这是我需要担心的事情。”你正在给你的猴子一根香蕉——训练它将想象的威胁视为真实的威胁，并允许它继续掌控你的生活。\n\
  \n![Image](img/9-7.jpg)\n\n要统治猴子大脑，你必须停止回避循环。这里有一个强大的工具可以帮助你前进。\n\n### 担忧时间\n\n\
  你目前为止的担忧经历都是由猴子驱动的。也就是说，每当你的猴子乱叫，你就担心。你可能不想停止当下正在做的事情并开始担心，但你别选择。有一只狂野的小猴子在负责。\n\
  \n在`worry time`期间，是你做主——而不是你的猴子。你决定什么时候担心，担心多久。没错——你将会去担心。\n\n担忧时间应该提前计划，所以你需要在期待的事情之前查看时间——比如给朋友打电话、用电脑或看电影。当预定的担忧时间到达，找一个不会被打扰的安静地方，设定定时器，拿出你最担心的事，让它们尽情爆发。在闹钟响不要停止。\n\
  \n以下是特斯担忧时间的脚本：\n\n```\n我考试得了一个 B。噢，这太糟糕了！这个 B 会毁了我的生活！可能会影响我的总 GPA，那将是一场灾难。我可能因此上不了任何好大学。我也为得了一个\
  \ B 感到羞耻。如果我的朋友开始觉得我不聪明怎么办？那太糟糕了。但这件事最真正糟糕的是，如果我不能上好大学，我的一生都会很糟。我可能找不到好工作。如果我找不到好工作，我的生活就毁了。我可能永远无法自立！\n\
  ```\n\n在`worry time`期间，你可能会变得非常焦虑，这没关系。那是这种情绪的时间。想象自己在担忧时间铺上一块欢迎垫，迎接所有的焦虑想法和尽可能多的焦虑，而不进行任何抵抗。\n\
  \n如果你开始感到被恐惧淹没，将注意力从担忧中移开，关注担忧引起的身体感觉。对着那种感觉呼吸，放松你的腹部。记住，当你需要时，呼吸总是在那里。（更多关于呼吸缓解焦虑的内容，请回到第\
  \ 5 章。）\n\n\n\n定期进行这项练习最好的处在于，每当你的“猴子脑”在整天开始大吵喧闹时，你可以坚定地告诉它，你会给予它全部注意力，但仅限于“担心时间”。尽力继续做你当时正在做的事情，除了担心以外的。你甚至可以将担心的念头写下来，这样在担心时间时就不会忘记要担心什么。\n\
  \n![Image](img/9-8.jpg)\n\n记住，担心时间像所有的努力一样，需要需要律的。你需要承诺每天抽出固定时间并付诸行动。在观察到变化之前，你可能需要多次练习。但通过练习，你会发现自己掌控能力越来越强，而那只小猴子也会变得更容易被忽视。通过控制担心的何时以及如何担心，你剥夺了小猴子通常能获得的奖励。*今天没有香蕉，抱歉！*\
  \ 这你驯服那只小动物的方法。\n\n你可以从 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)\
  \ 下载“担心时间”工作表。\n\n# 放松反应\n\n泛性焦虑会给身体带来巨大的压力。每当你把猴子的喋叫视为真实危险的信号时，你就会触发“战斗或逃跑反应”。\n\
  \n当战斗或逃跑反应被激活时，你的心跳会加快，肌肉紧张，胃部停止消化，以便让更多能量流向大肌肉。如果你真的是在用身体逃避剑齿虎或保护自己免受欺凌者的伤害，那是好的。但患有泛性焦虑的青少年所担心的事情并不会让他们陷入紧迫危险。你不会用大肌肉去战斗或逃避这些事情，因此你无法获得任何释放。\n\
  \n持续的担心和战斗或逃跑反应会产生大量的肌肉紧张，导致头痛和身体酸痛。你的胃可能会打结，引起腹痛或腹泻。心跳过快以及身体一直处于高度警觉状态会导致神经衰竭。你可能一直感到疲劳，并且入睡困难。\n\
  \n你观察过猫看到狗时的样子吗？猫会弓起背，毛发竖起来，发出嘶嘶声。一旦狗消失在视线，猫就会躺回阳光下，伸展四肢，打呼噜噜。\n\n![Image](img/9-9.jpg)\n\
  \n猫所自然而自动完成的行为，是在威胁过去后让自己恢复正常。当狗出现时，战斗或逃跑反应被激活了。当狗消失后，另一种反应被激活了。这被称为*放松反应*。它和战斗或逃跑反应一样强大，且同样必要。\n\
  \n如果猫也会患泛性焦虑，它在狗离开后就不会再次伸展身体打呼噜。相反，它会不断预测可能出现的下一只狗。它会像你一样，一直处于担心和紧张的状态，并且无法放松。\n\
  \n![Image](img/9-b.jpg)\n\n幸运的是，你也有放松反应。它没有像应该发生的那样被激活，因为你的担心总是在触发战斗或逃跑反应。但你可以训练你的身体来激活这种反应，并学会真正的放松。\n\
  \n![Image](img/9-a.jpg)\n\n# 金球\n\n要做到这一点，请坐在舒服的地方并闭上眼睛。深呼吸几次。想象你面前有一个金色的光球。这个球代表了你的和平与冷静。当你吸气时，想象光进入你的身体，让你充满温暖。当你呼气时，想象任何紧张或担心离开你的身体并进入金球。\n\
  \n重复这个过程几分钟，直到你感到放松为止。如果你的思想游离了，请轻轻地将注意力回到金球和你的呼吸上。\n\n\n\n在大约九个月大，如果照顾者离开房间或陌生人试图抱起孩子，孩子可能会哭闹或尖叫。这种对照顾者的依赖是适应性的。它能防止幼儿离开那个他们赖其提供食物并保护其安全的父母。到两岁时，当孩子们会走路并准备好变得更加独立时，他们明白父母会回来。\n\
  \n![Image](img/10-2.jpg)\n\n那么玛丽亚对她男友的依赖又是怎样的？你和我，甚至玛丽亚都能看出，她的焦虑并非源于现实。玛亚并不依赖 `Roberto`\
  \ 来获取食物和照顾。玛亚的“猴子脑”正在产生错误的计算，导致她采取了不符合其自身利益的行为。她并没有与她喜爱的男孩变得亲近，反而将他推开了。\n\n玛亚的猴子在一个实际上并不危险的情况下拉响了全方位警报。它正在犯一个在所有类型的焦虑中都会犯的经典错误：高估或低估。它高估了\
  \ `Roberto` 的告别是永远的概率——即她再也见不到他——而且它低估了她独处的能力。\n\n玛亚的猴子脑让她确信，她必须通过避免独处来应对她的焦虑感受。当她检查以确保\
  \ `Roberto` 还活着且没有离开她时，玛丽亚是在逃避那种“未知”的感觉。对玛丽亚来说，是一种非常可怕的感觉。当 `Roberto` 不在她身边时，玛丽亚开始觉得自己像一个父母离开了房间的婴儿。\n\
  \n当然，`Roberto` 还活着。而且他并没有因为她不断的检查而疯狂到要和她分手，所以早晚他都会回到她身边。猜猜这归功于谁的？\n\n*   **猴子想法：**\
  \ `Roberto 没有回你的短信。也许他想和你分手！` \n*   **回避行为：** 给 `Roberto` 发短信或打电话检查他的情况。问他是否想和你分手。\n\
  *   **猴子逻辑：** `因为你检查了他，Roberto 才会留在了你身边。`\n*   **猴子想法：** `Roberto 正在飞往亚利桑那探望祖父母。他可能在飞机上出，你再也见不到他了！`\n\
  *   **回避行为：** 试图说服他不要去，或者开车而不是坐飞机，或者让他带你一起去。\n*   **猴子逻辑：** `因为他开车没坐飞机，或者因为你和他在一起，他没有死。`\n\
  *   **猴子想法：** `如果你一个人呆着你会感到恐慌，你无法忍受那种感觉！`\n*   **回避行为：** 在 `Facebook` 上和朋友聊天或短信。找个人和你聚聚。\n\
  *   **猴子逻辑：** `因为你和其他其他人联系在一起，你没有恐慌也没有完全失去控制。`\n\n玛丽亚不喜欢她猴子的喋吵，希望它安静下来，但她知道唯一让猴子闭嘴的方法就是遵循它的指令：`避免独处。现在给\
  \ Roberto 打电话或发短信！` 虽然这缓解了她的焦虑并让猴子安静了一会儿，但从长期来看，这让她的猴子叫得更大，分离焦虑也更严重。\n\n每当玛丽亚通过给\
  \ `Roberto` 发短信或打电话回避孤独，然后 `Roberto` 回到她身边时，玛丽亚的猴子就得到了一根香蕉。为什么？她在奖励猴子的逻辑，即避免独处救了她。可怕的喋吵变得越来越大，似乎越来越紧迫，玛丽亚的世界变得越来越小。\n\
  \n为了保持你的猴子脑安静，你正在回避什么？以下是患有分离焦虑的青少年常见的回避行为：\n\n*   避免离开家或你所依恋的人。这可能意味着避免与家人或朋友旅行，或避免参加学校的夜宿营。\n\
  *   与你所依恋的人一起做事情，不是因为你想做这些事，而是因为你在回避分开。\n*   避免任何时候独处。你可能会根据什么能让你身边有人来安排日程，而不是根据你真正想如何度过时间。\n\
  *   避免和朋友一起做事情，因为当你离开所依恋的人时你会非常担心。\n\n## 驯服分离焦虑猴子的工具\n\n如果你有分离焦虑，那么驱动你行为的焦虑想法可能是潜意识的。你根据这些想法行动了这么久以以它们已经成了自动反应。你不质疑它们，也不探寻它们的起源。只要这些想法仍然处于黑暗中，你就会继续受其支配。减少焦虑对你控制的第一步，是使用你的驯服工具为这些焦虑的想法投射一些光。\n\
  \n### 识别想法 (Spot the Thought)\n\n回想一个最近让你焦虑的场景。问自己以下两个问题：\n\n1.  `我害怕什么？`\n2.  `如果这是真的，可能的最坏情况是什么？`\n\
  \n这些就是在那种情况下驱动你行为的想法。要理解，猴子的想法对你来说可能非常可怕且深信不疑，但它们并不是对风险的现实评估。事实上，这正是你识别它们的方式——通过它们的错误计算！猴子无法计算某事发生的实际概率。猴子的想法充其量是一个荒率的猜测，总是倾向于感知危险并让你保持安全。\n\
  \n你可以在 `http://www.newharbinger.com/32431` 下载“Spot the Thought”工作表。\n\n### 猴子的错误计算\
  \ (Monkey Miscalculations)\n\n除了高估/低估错误外，分离焦虑中发生的两种最常见的猴子错误计算是灾难化（catastrophizing）和对不确定性的不耐受（intolerance\
  \ of uncertainty）。以下是它们的具体表现。\n\n#### 灾难化\n\n对于猴子脑来说，告别就是永远的。离开爱的人可能永远不会回来。而独处是世界上最糟糕的事情——导致恐慌和失去控制。\n\
  \n当然，独处一会儿并不是灾难。你曾在没有那个人的情况下也生存了下来。即使最坏的情况发生了，你再也见不到那个人，你也会学会独立生活。但当你的猴子让你确信处于灾难性的紧急情况下时，你会忘记这一切。\n\
  \n以下是这种错误计算的例子：\n\n*   `如果那个人很远，她更容易死去。`\n*   `如果你过去几分钟或几小时没有收到她的消息，她可能受伤或去世。`\n\
  *   `如果她迟到了，她可能去世了。`\n*   `如果她在别人身边，她可能会离开你爱上别人。`\n*   `如果你听到警报声，可能是为了她。`\n\n如果你怀疑猴子正在进行灾难化，问自己：`什么是更可能的解释？`\n\
  \n#### 对不确定性的不耐受\n\n猴子脑无法忍受不知道任何情况的结果。它必须百分之百确定你是安全的，且一切都会好。事实是，我们永远无法知道一切都会好。当你认真对待这种猴子错误计算时，你是在尝试完成不可能。\n\
  \n问自己：`为了消除关系中的所有风险，我付出了什么代价？`\n\n### 替代想法 (Alternative Thoughts)\n\n在所有的焦虑问题中，都是猴子脑在进行思考，从它所有的错误计算来看，显而思考并不是猴子脑擅长的。你猴子的特长是寻找和应对可能伤害你的威胁。如果你有分离焦虑，你的猴子脑过度活跃，跳来跳去，一个接一个地叫着“如果……”：`如果这个怎么办？！如果那个怎么办？！`\n\
  \n为了停止维持分离焦虑的回避循环，你需要开始问还有什么？什么更可能是真实的？你可以看到猴子无法看到的替代方案。\n\n以下是玛丽亚提出的替代想法：\n\n![Image](img/10-3.jpg)\n\
  \n*   **情况：** `Roberto` 说他会在九点给我打电话。当他没打时，我发了短信但他没有回复。\n*   **猴子的“如果”想法：** `如果他遇到了别人，他正想和我分手呢？`\n\
  \n\n\n\n\n- **猴子的错误判断：** 灾难化\n- **替代性思维：** *更有可能他不回我的信息是因为这些信息让他很烦，而不是因为他要和我分手。*\n\
  - **情况：** 罗伯托（Roberto）正飞往亚利桑那州。\n- **猴子的“万一”想法：** *如果飞机坠毁了他死了怎么办？*\n- **猴子的错误判断：**\
  \ 对不确定性的不忍\n- **替代性思维：** *我可以承担这个风险。我不需要因为害怕就随他去或者要求他不去。*\n\n一旦玛丽亚（Maria）想出一些替代性思维，她的情绪并没有消失，但不再那么无所措了。替代性思维帮助她与自己的猴子大脑拉开了一距离，这是一个非常重要的第一步。现在花点时间为你自己的猴子杂语想一些替代性思维。改变思维是为接下来最好的准备方式：改变行为。你可以在\
  \ `http://www.newharbinger.com/32431` 下载一份替代性思维工作表。\n\n## 掌控分离焦虑猴子的工具\n\n你准备好停止遵循你猴子的规则，开始遵循你自己的规则了吗？说起来容易做起来难。你需要放弃一直以来用来回避行为，以避免面对你所恐惧的分离。这在短期内会让你感到焦虑得多。掌控你的猴子需要巨大的勇气和投入。这对你来说值吗？\n\
  \n### 人生指南针\n\n为了回答这个问题，请尝试另一个纸笔练习。写下你的猴子为了让你管理分离焦虑而让你所做的做的行为。这些行为对你有效吗？\n\n接下来，写下所有你想能够做的事情。其中是否有什么是值得为之奋斗的？\n\
  \n以下是玛丽亚想出的内容：\n\n写下这些事情就像拿着一个人生指南针。它告诉玛丽亚需要走向哪个方向，她的真北。她跟着她的猴子向南走了太久了。在她的心里，她觉得自己有勇气去遵循自己的人生指南针。\n\
  \n你有足够重要且值得奋斗的目标吗？如果有，请继续阅读。面对恐惧并改变行为是夺回生活的极有力的方式。但就像大多数值得为之奋斗的事情一样，这是一项辛苦的工作。\n\
  \n你可以在 `http://www.newharbinger.com/32431` 下载一份人生指南针工作表。\n\n### 最坏情况假设\n\n卷起袖子，准备迎接第一项辛苦的工作：想象最坏的情况。没错，你的任务是闭上眼睛，想象关于你所依恋的人或某些人，可能发生的最糟糕的事情。\n\
  \n你可能在想，*这绝对没有帮助！我总是想象最坏的。这就是为什么我不断给他发信息或给她打电话，为了确保最坏的情况没有发生！*\n\n![Image](img/10-4.jpg)\n\
  \n事实是，每当你根据一个焦虑的猴子想法而行动以确保最坏的情况没有发生时，你的猴子就赢了。实际上，你是在说那个想法很重要，必须采取行动。你认同了你猴子的灾难化思维。你在说你无法忍受不确定性。你在说：“你说完全对，猴子！”，并给了它一根香蕉。\n\
  \n要停止回避循环，你需要想象最坏的情况——你的男朋友受伤或去世，你的女朋友恨了你，任何对你听起来最糟糕的事情——并接受它。不要据此行动。不要去。只是与一个令你恐惧的想法待在一起。\n\
  \n在这次练习中，你不会遵循你猴子的剧本。你是导演，而不是你的猴子。你将写出一个你最恐惧的虚构情景，一部真实的恐怖电影。你会在剧本中想要大量血腥的细节，因为重点在于尽可能地感到焦虑。为了让它听起来真实，请用现在时书写。例如，你可以这样开头：*我正在等妈妈来学校接我，我听到远处传来警报声……*\n\
  \n当然，这只是开始。问问自己，如果妈妈来接你迟了，最坏意味着什么。这能帮助你触及恐惧的核心——例如，她忘记了你，你会站在学校门口直到深夜；或者她发生了车祸，正在医院或已经去世了。这就是你需要的那种最坏情况假设。\n\
  \n以下是玛丽亚设想的情景：\n\n*罗伯托没有回我的信息！我的心跳得很快，手心出汗。我感觉到有些不对劲。我给他发信息说我很担心，请请务必告诉我他无事，但他还是没有回我。流过的每一分钟都像一个小时。他没有回信息！我知道他正和朋友在一起，他们开车得太快了，他们发生了车祸。他现在躺在街上，血流不止，身体破碎，无人帮助。他的手机就躺在他身边，上面有我所有的信息，但他太疼了无法拿起来。想到这些，泪水夺眶而出。他要死了，我无能为力。我再也见不到他了！我的生活被毁了！我永远永远无法忘记这次痛苦！*\n\
  \n玛丽亚做得很好，不是吗？很多人很难想象灾难性的情况，尤其是当这些情况涉及爱人的伤害时。你一直从爱人那里寻求安慰的完全就是为了避免思考这类想法。\n\n请放心，为了面对恐惧而想象可怕场景并不等同于让它们发生。\n\
  \n\n\n\n如果你在反复观看某件事时一直闭上一部分眼睛，你是无法习惯它的。要习惯某事物，你必须睁开眼睛，让自己看到全部。你那些焦虑的猴子思维也是如此。如果你刻意去想这些想法，它们就会失去力量。你越少尝试控制这些想法，越是欢迎它们，它们带给焦虑就越少。\n\
  \n当你面对并不真正危险的事情时（无论是电影场景还是你自己的焦虑想法和感受），你都会习惯它并知道你完全不需要对此采取行动。\n\n“最坏情况练习”是接下来的步骤的重要练习，所以不要轻视它。当你反复阅读你的脚本直到它看起来几乎很傻时，你就知道自己掌握了主动权。你准备好改变自己的行为了。\n\
  \n## 挑战梯子\n\n回避行为——比如从不让自己独处、为了靠近某人而去不想去的地方、以及检查那个人是否还活着——这些行为一直在喂养你的“猴子”，让你的分离焦虑越来越严重。你将一个一个地改变这些行为，从最不害怕的情况开始，慢慢向上，就像爬梯子一样。（请在\
  \ `http://www.newharbinger.com/32431` 下载挑战梯子工作表。）\n\n你可以通过改变与你依赖的人保持距离和断联系的时间，在梯子上建立不同的阶梯。以下是玛丽亚的梯子的样子：\n\
  \n![Image](img/10-6.jpg)\n\n玛丽亚意识到，通过不不断检查罗伯托，她会有额外的个人时间来填充。为了帮助她在爬梯子阶梯时专注于罗伯托以外的事情，她列了一份她过去常做的事情的小清单。这些包括学习、听音乐、和朋友聊天或一起做事情，以及去滑冰场。\n\
  \n当玛丽亚开始爬第一阶时，前十五分钟过得相当容易，但没多久她就开始感到无聊和焦躁。她冲动想拿起手机看看罗伯托是否给她打了电话，就像她过去很多次做的那样。她的猴子已经让她习惯了每几分钟检查一次手机，不这样做让她感到很奇怪。\n\
  \n这是玛丽亚处于正确轨道上的良好信号。感到奇怪是好的。如果这项练习让你感到舒服，要么是你没做对，要么是你选了一个对你来说太容易的东西——在这种情况下，你应该走向梯子上的下一个阶梯。\n\
  \n当第一个半小时结束时，玛丽亚等不及要给罗伯托打电话告诉他她刚刚做了什么。他看起来并不很惊讶，并建议她尝试更长时间不拨打。玛丽亚知道她还没准备好。在接下来的几天里，她每天重复几次半小时的练习，到第五次时，她注意到这很容易。她的猴子脑仍在嗡嗡响，叫她给罗伯托打电话，但不知为什么这似乎不再那么有吸引力了。她真的发现一些英语作业很有趣。她发现自己自己在想：*我可以做到的！*\
  \ 是时候再向上爬一个阶梯了。\n\n在几周内，玛丽亚可以整个上午不给罗伯托打电话或发短信。她不带手机在社区周围散散步，可以连续学习一小时而不会被“猴子报警”太分心。在不检查男朋友的情况下度过一夜的想法对她来说仍然太难了，所以她继续在下面一一阶练习，积累勇气。当他和祖父母出去旅行时，她给他的电话次数比计划的多，但比以前少。\n\
  \n随着时间的推移，玛丽亚长时间不检查罗伯托变得越来越容易。尽管她的猴子脑不断产生出男朋友受伤了、死了，或者离开了她，让她再也见不到他的想法，但她认为他是安全的、仍然爱她的替代性想法感觉更真实。现在她的生活中除了罗伯托之外，有更多时间可以做其他事情。然后发生了另一件真的让她很惊讶的事。过去罗伯托几乎从不给她打电话或发短信，而且无视了她大部分的检查。现在他给他打电话和发短信的频率和她的一样多！她意识到，遵循猴子的规则起到了推开罗伯托的效果。现在她掌握了主动权，不仅自己变得更加独立，而且和罗伯托也变得更加亲密了。\n\
  \n你准备好统治你的分离焦虑猴子了吗？除了你自己焦虑的想法和感受，没有什么能阻碍你变得独立。健康的关系取决于你能够习惯独处，能够自立。。要有勇气——你可以的！\n\
  \n![Image](img/11-1.jpg)\n\n# 第 11 章\n\n# 强迫症\n\n### 不要踩那道缝！\n\n乔对成为一名新手驾驶员感到超级兴奋。在独立一周后，他的镇上发生了一场悲剧性事故，另一名青少年撞并杀死了一名过马路的行人。下次当乔开车时，他感到路面轻微的颠簸。一个念头跳入脑：也许他刚刚撞到了人。他知道这很荒谬，但他无法将这种恐惧从脑海中赶出去。尽管他在检查后视镜时什么都没看到，但他仍然感到焦虑。直到他绕回到他感到颠簸的地方，发现那里什么也没有，他的焦虑才减轻了。\n\
  \n自从七年级健康教育课讨论同性恋起，丹就注意到*如果我是同性恋者怎么办？*这个想法跳入他的脑海。他被女孩吸引，对同性恋者并没有偏见。（事实上，他的好朋友有两个妈妈。）但这种怀疑带给了他相当的焦虑。各种事情开始触发这个想法。看到杂志上的男模特、任何关于同性恋的词汇，甚至待在女孩身边都会触发这个想法。他开始在脑子里用证据来安慰自己不是同性恋者。他在男性周围时会密切监控自己的身体是否有任何兴奋的迹象。这样做让他在短时间内感觉好了一点，但怀疑就是挥之不去。\n\
  \n谢尼莎第一次在任何生人生周围就开始洗手。她认为这是合理的，因为她虚弱的奶奶和她住在一起，家里每个人都采取预防措施防止奶奶生病。然后谢尼莎想到她的衣服可能接触了来自学校课桌或任何公共场所的细菌。她一回家就开始换衣服。这起初有助于减轻她的焦虑，但她觉得需要换衣服并洗澡，在那之后不要接触任何在学校可能被污染的东西——包括她的手机、背包或书本。她知道这做得过头了，但那种感觉太强烈了，她无法控制自己。\n\
  \n\n\n\n露西娅在家里以完美主义者而闻名。她的房间总是整整齐洁，书本和文件摆放得齐，衣柜里的衣服按颜色分类。她喜欢这种状态，而且这并没有带来过麻烦。但毫无无故，事情开始变得失控。在进行指定的阅读任务时，她开始怀疑自己是否完全理解了刚读的内容，于是开始重新阅读一切。她开始擦掉并重写报告中那些她觉得不太对劲的部分。她担心自己可能在教室、储物柜或汽车里遗留了重要的作业，于是她回去一遍又一遍地检查。她反复检查书包，确保里面每样东西都在。这种检查开始占据大量时间，让她感到既沮丧又压力巨大，但露西娅无法抵制这种冲动。\n\
  \n这四位青少年都患有强迫症，又简称 OCD。与书中提到的其他类型的焦虑不同，OCD 行为在不同青少年之间会有很大差异，这可能会让情况变得有些令人困惑。但一旦我们定义了\
  \ OCD 的“强迫念”和“强迫行为”，你就会发现它们都是同一个问题。\n\n## 强迫念 (Obsessions)\n\n我们经常说痴迷于某首歌、一支运动队或某个人。虽然我们可能无法从这些事情中抽身，但思考它们是有有趣的。对于\
  \ OCD 强迫念来说，情况完全如此。\n\nOCD 强迫念是你不想要的、侵入性的想法、影像或冲动，它们会让你感到焦虑和痛苦。尽管这些想法源于你自己的脑海，但它们并没有太大的理性意义。强迫念产生在大脑中完全致力于检测威胁的部分——即“猴子脑”（monkey\
  \ mind），在那里，进行胡乱猜测是标准操作程序。\n\nOCD 强迫念在内容上也与其他类忧虑不同。一般的忧虑（如在广泛性焦虑章节中讨论的）是关于日常生活中的各种事，如成绩、金钱和他人。OCD\
  \ 强迫念往往带有些奇怪——例如怀疑自己是否撞了人、担心会伤害自己或他人、担心衣服上有细菌、需要将某物安排得恰好到位，或者怀疑自己的性取向。如果你有这类强迫念，你知道它们很怪异，你可能因为太害羞而无法和朋友谈论它们。\n\
  \n大多数强迫念属于以下四类之一：\n\n- **污染 (Contamination)：** 认为自己会“染上什么”或因接触表面或物体而中毒（或者较少见的情况，担心被残障人士或具有不良特征的人污染，仿佛与他们待在一起甚至一想到他们就会让你变得像他们）\n\
  \    - 担心细菌和疾病，例如性传播感染、胃肠流感或癌症\n    - 害怕接触体液，如尿液或粪便\n    - 担心可能因常见的家用清洁剂（如漂白剂和农药）或环境中的物品（如辐射或有毒植物）而导致中毒\n\
  - **伤害或攻击 (Harm or aggression)：** 认为自己已经造成或将要给他人或自己造成身体或情感伤害\n    - 担心由于做了某事——或忘记做某事——会引发火灾、洪水、入室窃或类似的灾难\n\
  \    - 担心自己可能会做诸如刺某人、撞人、绊倒老人或说出随机且伤人的话\n    - 担心自己不够小心，因滑倒或踩到某物而受伤，或摄入坏东西——如遗留的药片或变质食物\n\
  - **禁忌的性或宗教想法 (Forbidden sexual or religious thoughts)：** 破坏你的身份认同或作为一个善良/正直的人的感觉的想法\n\
  \    - 对自己性取向的怀疑\n    - 关于成为猥童儿童或犯乱伦的想法\n    - 关于与禁忌对象（如老师）发生性的想法\n    - 关于侵略性性行为的想法，如强奸\n\
  \    - 关于说违背神的话的想法\n    - 对对与错或道德与不道德的过度关注\n- **对称或精确性 (Symmetry or exactness)：**\
  \ 除非事情“恰到好处”或以某种方式完成——或者如果某事看起来未完成，否则就会产生通性的不适感\n    - 需要事物保持对齐、精确或完美平衡\n    - 担心忘记或丢失重要物品\n\
  \    - 需要知道或记住某些事\n    - 在做决定或丢弃东西时感到有困难\n\n如果你的强迫念并不完全符合这四类之一，这并不意味着你没有 OCD。OCD\
  \ 的定义特征是引起焦虑的侵入性想法。这正是 OCD 的另一半部分——强迫行为（compulsions）出现场的地方。\n\n## 强迫行为 (Compulsions)\n\
  \nOCD 强迫行为是具有严格规则的行为，你觉得必须遵循这些规则，以防止你正强迫性想的事情真的发生。由于 OCD 患者对执行这些行为有强烈的冲动，这些行为被认为是强迫性的。它们与日常习惯的区别在于，它们占据的时间比你预想的要多。以下是一些常见的强迫行为：\n\
  \n### 检查 (Checking)\n- 检查以确保自己没有犯错\n- 检查自己没有忘记某事或遗留某物\n- 检查自己没有或将不会造成伤害\n- 检查是否拔掉了电器插头或关闭了它们\n\
  - 检查以确保没有掉掉东西\n- 检查开车时没有撞到人\n- 向他人寻求保证，自己没有做坏事或伤害他人，或者他们没有生病，或者某物是干净的\n\n### 清洁与清洗\
  \ (Cleaning and washing)\n- 以特定的方式、时长或次数洗手或洗澡\n- 过度洗衣服或其他财物\n- 在上完厕所后比通常需要的多洗身体\n\
  - 做其他事情——如擦手或使用手部消毒液——来清除污染物\n\n### 心理强迫行为 (Mental compulsions)\n- 在心里列清单，或在脑中回顾某些事情\n\
  - 使用特殊的词、影像或数字（有时是为了回应某个“坏”想法或影像）\n- 以固定的方式祈祷以防止坏事的发生\n- 在做某件“正确”、“安全”或“良好”次数的事时在脑子里数数\n\
  \n### 重复 (Repeating)\n- 以特定的方式或次数触摸、轻击或揉搓某物，或反复开关电源\n- 重复做某事——如进出门口、坐下和站起或进出汽车\n\
  - 重复身体动作，如眨眼\n- 重新阅读、擦掉和重写；在脑中回顾你可能说过或做过的事情\n\n### 排序或安排 (Ordering or arranging)\n\
  - 排列物品或排序、安排你的物品，使它们看起来恰好到位（例如，衣服按颜色分类、物品直角对齐或以某种方式安排书桌）\n\n再次，如果你有的强迫行为不符合这些描述之一，这并不意味着你没有\
  \ OCD。你的强迫念和强迫行为虽然看起来很奇怪，但它们源于所有焦虑问题共同的源头——保护自己的愿望。你的猴子脑只是在尽它让你生存的工作。它在做它最擅长的：感知危险，即使在没有危险的地方，并拉响警报告诉你*害怕——非常害怕！*\n\
  \n## 怎么了？ (What’s Going On?)\n\n尽管你强迫念的内容对他人来说可能并不关乎生死，甚至对你自己也是如此——*如果我不第三次检查熨斗是否关了，真的会烧掉房子吗？*——你的身体仍然处于战斗或逃跑模式。微小的想法是如何引发如此巨大的恐惧的？\n\
  \n\n\n\n\n每个人都有可怕的、侵入性的想法——而不只是强迫症（OCD）患者是如此。大脑就像一台爆米花机，不断产出各种想法，一些神经科学家估计，每天产生多达五万个。在这些不断弹出的想法中，有一些非常诡异且可怕的想法。事实上，每天产生的想法中，大约有一半属于不愉悦的类别，与某事可能出错有关。\n\
  \n如果你的“猴子大脑”天生就对威胁格外敏感，它就会将这些想法视为出了问题且你正处于危险之中的证据。突然，一片随机的爆米花变成了致命的内核，你的猴子拉响了警报。\n\
  \n![Image](img/11-2.jpg)\n\n## 猴子的误判\n\n无论你的强迫性想法有多恐怖、疯狂、尴尬或羞耻，想法本身并不是问题。你对想法的解释赋予了它力量。对你的猴子来说，你产生那个想法意味着你出了问题，你可能会采取那个想法的，或者你必须做某些事情防止那个想法变成现实。它产生了经典的“高估/低估”猴子误判。\n\
  \n1. 它高估了可怕事情发生在你或你爱的人身上的概率，或者高估了你真的会执行某个破坏性想法的概率。\n2. 它低估了你在不执行强迫行为时忍受焦虑或不适的能力，也低估了万一坏事真的发生时你的应对能力。\n\
  \n与强迫症相关的另一个重要的猴子误判是`对不确定性的不耐受`。即使只有 1%的概率可能出错，你也应该试图防止它的发生。当你为了确保安全而进行强迫行为时，怀疑就会溜入。无论你多多努力让事情变得绝对\
  \ 100%安全，猴子大脑都会怀疑你做得够不够。对于猴子大脑来说，没有任何一种程度的风险是可以接受的。在强迫症中，你永远无法确定自己是安全的。\n\n*   你洗了手，但又碰到了水龙头。你的猴子说：`手脏的人碰过那个水龙头！你应该再次洗手。`\n\
  *   你拔掉了卷发器插头。你的猴子说：`但万一你拔掉了别的东西呢？你应该回去检查一下。`\n*   你知道自己对异性有吸引力，但你恰好产生了自己可能是同性恋的想法。你的猴子说：`你需要思考一下来弄清楚这件事。`\n\
  *   你对父母说了晚安，但被中断了。猴子大脑说：`如果你没说对，他们可能会发生坏事。再说一遍。`\n\n一旦你识别了你的强迫症猴子和它的误判，我不会鼓励你像对待其他类型的焦虑那样去构思替代性想法。之所以这样做，是因为无论替代性想法有多准确，你的猴子大脑都会对其产生怀疑。在强迫症中，你的猴子对不确定性的不耐受如此高，以至于它也会对你的替代想法产生怀疑。\n\
  \n## 强迫症回避循环\n\n随机的焦虑想法只有在猴子大脑将其解释为重要时，才会变成强迫性想法。当它拉响警报你被焦虑淹没时，你会这样做——每个焦虑的人都会尝试做的事——回避它。\n\
  \n这就是你强迫行为上场的地方。为了缓解焦虑，你执行一些小仪式，这些仪式要么让你从可怕的想法中转移注意力，要么让你产生你正在阻止它变成现实的幻觉。如果你的强迫症与对细菌的恐惧有关，洗手就能缓解焦虑。强迫症失去了对你的控制，你就可以放松。如果事情就此结束，那生活就简单了。\n\
  \n问题在于，回避焦虑充其量只是一种短期解决方案。虽然你获得了几分钟的缓解，但你只是在推迟痛苦，并最终使其变得更糟。为什么？因为猴子逻辑。\n\n当你的猴子看到你洗手时，它会说：`我是对的；我警告你的那些细菌很危险。`当猴子看到你洗手后的放松感时，它会说：`你洗了手感到放松。因此，未来洗手会让你保持放松。`当猴子看到你没有生病时，它会说：`因为你洗了手，所以你没有生病。`\n\
  \n![Image](img/11-3.jpg)\n\n这里更多猴子逻辑作用于强迫症的例子：\n\n*   **强迫想法：** `万一我开车撞死人怎么办？`\n\
  *   **强迫行为或回避：** 避开繁忙的交叉路口，不要开音乐开车。检查后视镜或重溯路线，看路路上是否有尸体。\n*   **猴子逻辑：** `因为你格外小心并检查了镜子和路线，你没有撞到任何人。`\n\
  *   **强迫想法：** `万一我是同性恋却不知道，我的一生都是个谎言怎么办？`\n*   **强迫行为或回避：** 宽慰自己一直对异性有吸引力。避免看同性中的帅哥或与他们有任何身体接触。检查身体在他们周围是否有兴奋的迹象。\n\
  *   **猴子逻辑：** `因为你在大脑中回顾了你不是同性恋的证据，你可以确定自己还是异性恋的。`\n*   **强迫想法：** `万一我带回了可能让我或我的家人人生病的细菌怎么办？`\n\
  *   **强迫行为或回避：** 避免触碰别人碰过的东西。在公共场所碰过东西后，清洗身体、衣服和个人物品。\n*   **猴子逻辑：** `因为你对洗涤仪式如此小心，你家里没有人得过重病。`\n\
  *   **强迫想法：** `万一我忘了某些重要的事，导致我错过了作业并得了低分怎么办？如果万事不对，我可能会永远这样焦虑。`\n*   **强迫行为或回避：**\
  \ 反复检查你的书包以确保没有漏掉什么东西。保持房间整洁，这样你就可以放松。\n*   **猴子逻辑：** `因为你反复检查书包并保持房间整洁，你没有漏掉任何东西是安全的。`\n\
  \n\n\n\n\n如你所知，你无法通过咬牙切齿并意志让焦虑的想法消失。你越是努力，它们就变得越顽固。这是因为它们的力量源于你对它们的反抗。你越反抗它们，你的“猴子脑”就越坚信这些想法是危险的，每当你想到它们时，它就会触发更多的报警。你准备好尝试接纳法了吗？\n\
  \n![Image](img/11-4.jpg)\n\n通过接纳和欢迎强迫念，你向自己证明了一个想法仅仅只是一个想法，无论它是多么可怕。接受强迫念意味着不通过强迫行为让它消失。\n\
  \n那么这引发的焦虑呢？也接受它。感受它。一直直到最后。\n\n没错，`直到最后`。每种情绪（包括焦虑）都有开始、经过和结束。你只是从未越过起始阶段，在那个阶段，你正竭尽全力地想要压制它。\n\
  \n这听起来可怕吗？确实如此。它也极其强大。刻意触发你的强迫念，并在不执行强迫行为的情况下感受随之而来的焦虑，是目前治疗强迫症（OCD）最有效的长期方法。它将你的猴子完全从过程中排除出去，并让你夺回主权。如果你不统治你的强迫症猴子，它就会继续统治你！\n\
  \n### 生命指南针\n\n每当强迫念激活你的“战斗或逃跑”反应时，你总是选择逃跑。这效果一直并不好，但似乎总是比其他选择好。现在是时候问问自己，你愿意为了什么而战斗了。你渴望回到生活的哪一部分，以至于愿意面对最极的恐惧？\n\
  \n写下强迫症夺走了你什么，以及这些事物对你有多重要，会有帮助。以下是 Shaneesha 的想法：\n\n![Image](img/11-5.jpg)\n\n\
  为了帮助你识别自己因为强迫症而一直在回避的内容，请在 `[`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)`\
  \ 下载“生命指南针”工作表。\n\n对于 Shaneesha 来说，这毫无悬疑。她的指南针直接指向她深爱的祖母。那种可以享受与奶奶相处，而不必担心细菌并让她生病的想法，听起来既甜蜜又可怕。在她的内心深处，Shaneesha\
  \ 知道，如果有什么东西能带给她尝试战胜强迫症所需的勇气，那一定是她的祖母。\n\n如果你已经使用了指南针并明确了自己的方向，你就知道过去的做法并不能带你到达那里。回避强迫念是没用的。它们仍然会出现，而当它们出现时，通过执行强迫行为来回避其带来的焦虑也无法维持多久。\n\
  \n强迫念的力量取决于你通过反抗赋予了它们多大的力量。你准备好改为接纳并欢迎它们了吗？\n\n### 核心恐惧场景\n\n从表面上看，强迫症的执念看起来可能很滑稽，甚至对受影响的人也是如此。但如果你稍微挖掘一下，就会发现它们下方隐藏着更深层的核心恐惧。除非理解核心恐惧，否则你永远无法克服表面上可怕的想法。为了帮助你揭示核心恐惧，这里有三个很好的问题可以：\n\
  \n1. `如果我不回避触发因素且不进行任何强迫行为，我会担心发生什么？`\n2. `可能发生的最坏的情况是什么？`\n3. `这对我、我的生活或我的未来意味着什么？`\n\
  \n举例来说，这里是 Shaneesha 对这些问题的回答。\n\n![Image](img/11-6.jpg)\n\n一旦你确定了自己的核心恐惧，请拿好笔和纸，因为你现在有一个发挥创意的机会。你要写下你的`核心恐惧场景`。这是一段像电影场景一样的描述，生动地描绘出如果你的核心恐惧变成\
  \ true 时的样子。它应该越可怕越好——就像一部为了让你（观众）感到毛骨悚然的恐怖片。在 `[`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)`\
  \ 下载“核心恐惧场景”工作表。\n\n你起初可能会对此望而却畏。大多数强迫症患者很难让自己暴露在执念面前，尤其是那些涉及伤害亲人的想法——在 Shaneesha\
  \ 的情况下，是关于祖母去世的想法。我们被教导思想是有力量的，可以影响结果。但对于强迫症来说，完全不是如此。\n\n你的执念是疾病的结果，你必须像那样对待它们。记住，让自己暴露在执念面前是为了让这些想法失去一些力量。这就像你决定反复看一部恐怖片一样。起初会非常可怕，但在看了五十次之后它就会变得无聊。你需要学习停止把你的想法视为危险的并停止回避它们，因为那只会加剧疾病。\n\
  \n以下是 Shaneesha 的核心恐惧场景：\n\n```\n因为我决定面对我的强迫症，我摸了我的背包。我知道我的背包在学校和其他地方接触过成百上千种表面，这些地方既脏又充满了细菌。现在我的手上带着这些脏脏细菌。我的心跳加快了，我很想洗手，但我没有洗。相反，我走进家里开始触碰东西。我摸了门把手、冰箱把手、台面和餐厅餐桌。现在我的心真的跳得很快，我感到发热并出汗。然后我知道祖母会接触到这些表面。她会用手摸眼睛。我看到这一幕想大喊：“停下！别碰你的眼睛！”但我没有。。第二天早上，我的祖母来吃早餐，她在咳嗽。这可能是因为我把细菌传染给了她。到那天结束时，她真的病了，发着高烧，所以我父母带她去看医生。由于她病得太严重，他们最终让她她住院了。我没法去看她，因为这可能全是我的错。我的祖母去世了。\n\
  ```\n\n写完你的核心恐惧场景后，留出至少半小时（越长越好）反复阅读它。你也可以将场景录制在手机或电脑上并播放给自己听。在第一次读或听之后，用 1 到 10\
  \ 的数字记录下它让你有多焦虑（10 为最焦虑）。然后继续读或听，直到你的焦虑下降 50%，或者你当天的时间结束。这对于接纳执念的另一部分是极佳的准备：不执行随之而来的强迫行为！\n\
  \n\n\n\n听起来很容易对吧？对谢尼莎（Shaneesha）来说，做这件事非常可怕，但并非不可能。重要的是从一个只要有一点勇气和充分准备就能应对的挑战开始。可以从\
  \ [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431) 下载“挑战阶梯”工作表。\n\
  \n当谢尼莎触碰到书包的那一刻，她就能感受到恐惧的阵痛。她非常想洗手，但在几次深呼吸和“谢谢你，猴子”的帮助下，她走过浴室，走向奶奶的卧室。谢尼莎脑里的猴子拼命地叫着，脑海中浮现出奶奶生病、临终、甚至参加葬礼的画面。她的只猴子提醒她，这一切都是她的错，她的全家人都会责怪她，她的生活将会毁掉。\n\
  \n谢尼莎深吸了一气，摸了碰奶奶的门把手。恐惧感就像腹部被挨了一拳，她的心脏剧烈跳动着。为了忍住不跑回去找洗手液，她竭尽全力。但她一直专注于自己的呼吸，提醒自己她愿意承担这个风险。她知道，如果不这样做，她的强迫症（OCD）猴子将继续统治她的生活。\n\
  \n在接触了各种表面一个非常不舒服的半小时后，谢尼莎发现她的焦虑减轻了大约一半，而且她没有诉诸通常的强迫行为！这似乎是不可能的，但却是事实——她的焦虑正在自行缓解。在一个周的时间里，她每天都重复这个实验，并且变得越来越容易。她不仅感到焦虑减轻了，而且她的执念对她来说也变得越来越荒唐。没有任何可怕的事情发生。\n\
  \n这段经历给了谢尼莎信心继续向上爬阶梯，直到她终于到达了顶端的一级：去医院候诊室。她坐在椅子上，读着杂志，像普通人一样触碰东西。回到家后，她确实快速洗了一次手，但那看起来像是没有强迫症的人会做的事，而且剩下的时间里她都没有换衣服。她又去了候诊室六次，在练习结束时，她感觉极极了！她的手不再因为频繁洗手而红肿干裂。她不再在强迫行为上浪费时间和精。。真实的谢尼莎回来了！\n\
  \n每当她旧的执念想法冒现时——它们总是会出现——谢尼莎都会感谢她的猴子，并提醒自己不要屈服于洗手的冲动。她知道这是大多数人一直在承担的风险。\n\n我希望你能找到勇气停止回避，去迎接你的执念想法以及随之而来的焦虑。如果你觉得无法独自应对核心恐惧或挑战阶梯，不要害怕寻求帮助。（关于你可能获得的帮助类型，请参见附录。）你已经知道进行强迫行为会导致什么——导致更多的执念。当你停止回避循环时，你面对将仅仅是感觉——你*可以*忍受的感觉。\n\
  \n当你接纳焦虑并允许自己感受它时，你猴子的逻辑就会发生变化。它听起来会更像：“你接受了那个想法，你是安全的。”那个想法终究没有那么危险。那是被驯服的猴子的喋喋，一种你可以与它共处而无需放弃梦想的状态。\n\
  \n当然，总会有那么极小的概率，一个可怕的想法会成真。生活中总有风险。但我知道你会发现，带着一点不确定性生活，比伴着强迫症生活要好得多！\n\n# 第 12 章\n\
  \n## 其他问题\n\n### 失眠与抑郁\n\n夜晚对于焦虑的青少年来说可能是一个充满挑战的时刻。那是一天中没有干扰的时候。没事可做，没什么可以看，没什么可以听。那是你身体放松和关闭功能的时间。但你身上有一小部分仍在工作。这部分从不睡觉。它在挑灯夜战，`24/7`\
  \ 上班，以确保你免受伤害。是的，那是你的猴心！\n\n从历史角度看，你的猴心在晚上保持警惕有充分的理由。从古以来，人类在天黑后最脆弱。当一个原住民睡着时，如果被捕食者或敌对部落袭击，他并没有准备好战斗或逃跑。在黑暗中倾听奇怪的声音和观察活动的移动对于我们祖先的生存是必要的。\n\
  \n几千年后的今天，黑暗中已经没有剑齿虎在徘徊，我们有坚固的墙壁和锁好的门保护着我们。夜晚的过度警觉不再那么重要。但如果你有一只过度活跃、对危险格外敏感的猴子，它会找到足够的威胁来让你担心。`现在是凌晨\
  \ 1 点，你还没睡。你永远睡不着了！你明天的考试会不及格的！` 听起来熟悉吗？\n\n深夜独自坐在黑暗中，猴子的想法听起来可能很有说服力，但重要的是记住，大脑中猴心的部分设计仅是为了发现潜在威胁，而不是为了评估它们。你的猴子关于时间是正确的，关于你无法获得像预期的那样的睡眠也是正确的，但它只能猜测你何时或是否会入睡，以及你明天考试的结果。猴子的想法充满了误判——其中最常见的是高估或低估。\n\
  \n你的猴子在担心你是否获得足够睡眠时，总是高估了你维持功能需要多少睡眠，以及你睡得有多糟糕。它还低估了你实际获得了多少睡眠，以及你对较少睡眠的应对能力如何。\n\
  \n这里还有其他误判暴露了它是猴子的想法。预测你永远睡不着是在假设最坏的情况，即*灾难化思维*，就像预测你会考试不及格一样。忽视你实际获得的睡眠则是*否定了正面因素*。你可以在第\
  \ 3 章回顾这些和其他误判。\n\n这里有另一个你可能熟悉的猴子想法：`你精疲力竭了。你最好睡个懒`。但那是猴子的想法吗？如果你整周都在为睡眠不足而挣扎，这听起来完全合理。如果你遵循了这个建议，你会获得短期的缓解。但从长远来看，这种方式“补”睡眠实际上会让问题变得糟糕。\n\
  \n周末晚睡会扰乱你身体的生物钟。这就像是每周都从加州飞往纽约。晚起三小时意味着睡觉时间会比你准备好的要早三小时。这就像是时差一样。\n\n在经历了一周辗转反侧的夜晚后，在周六早上固定时间起床既违背直觉又困难。但无论你昨晚睡得如何，你都需要下床。你的一天可能会很挣扎，但它是值得的，因为你正在为那个晚上积累睡眠需求，从而让你更有可能获得良好的睡眠。\n\
  \n\n\n\n周六早晨，或者任何你想要赖赖床的早晨，都是你停止这种循环的时候。要做到这一点，你需要忽略你的“大脑猴子”。除了时差现象外，这里还有其他一些猴子思维的例子，以及可以帮助你建立自己的替代思维的事实。\n\
  \n*   **猴子思维：** `你才睡了五小时！你永远赢不了那场越野赛的！`\n*   **事实：** 当你睡眠八到九小时时状态可能是最好的。你会感到精力充沛，能够正常集中注意力。我们称之为`optimal\
  \ sleep`理想睡眠。另一个标准是`core sleep`核心睡眠，大约是六小时。如果你能获得六小时的`core sleep`，第二天可能感觉没那么好，可能比比常常更容易情绪化或健忘，但在运动、作业和考试等高要求任务中，你的表现依然良好。\n\
  *   **替代思维：** `我可能不会感觉很棒，但只要我获得了`core sleep`，我在比赛中的表现就会和获得`optimal sleep`一样好。`\n\
  *   **猴子思维：** `你一直翻来覆去的。你是一点都没睡着！`\n*   **事实：** 你睡眠的时间比你想象要要。青少年往往会低估 20%的睡眠时间。这意味着如果你认为自己只睡了五小时，实际上你可能睡了大约六半小时。为什么呢？\n\
  *   睡眠实际上有五个独立的阶段。阶段 `1` 和 `2` 是非常浅睡眠；你对周围发生的事情仍有一定的感知力。受试者会报告在这些阶段是清醒的，但测量他们脑波的机器显示他们绝对处于睡眠状态。`Stage\
  \ 1` 和 `stage 2` 睡眠非常重要，占了你总睡眠时间的近 50%。\n*   **替代思维：** `尽管我能听到声音并不断在思考，但我可能处于第 1\
  \ 或 2 阶段。我获得的睡眠比感觉的要多。`\n*   **猴子思维：** `你昨晚连五小时觉都没睡。你完蛋了！`\n*   **事实：** 如果你连续几天没有获得`core\
  \ sleep`，你的身体会自动比平时花费更多时间处于`stage 3` 睡眠中，这种睡眠有助于你第二天维持功能。\n*   **替代思维：** `如果我确实没有获得`core\
  \ sleep`，我可以信任我的身体，它会在它最需要的阶段花费更多时间。`\n*   **猴子思维：** `你昨晚没睡够觉。你最好错过第一节课睡个懒！`\n*\
  \   **事实：** 每天在同一时间起床从长远来看会有助于你睡得更好。你清醒并接触阳光的时间越长，对睡眠的需求就越大，这有助于确保第二天晚上获得更好的睡眠休息。\n\
  *   **替代思维：** `睡懒只会导致以后产生更多问题。在同一时间起床对于打破我所处的失眠循环至关重要。`\n\n如果你能坚持一周的时间表，你的身体将开始进入健康的睡眠模式。最终，你将对自己的睡眠能力充满足够的信心，从而能够更灵活地安排睡眠。同样重要的是，你将统治猴子，而不是由它统治你！\n\
  \n## 焦虑与抑郁\n\n焦虑和抑郁是最常见的心理健康问题，青少年经常同时经历。这是因为两者之间存在因果关系。\n\n正如你从书中读到的，当你感到焦虑时，你的大脑猴子会想出很多理由说明你不应该做某些事情。当你避开许多你内心真正想做的事情时，久而久之，你会失去对自己能力这些事的相信。你会感到无助和绝望。缺乏动力是抑郁的定义特征。\n\
  \n例如，如果你因为社交焦虑而避免参加派对或其他社交活动，你可能会产生想法：`我永远无法交到朋友或找不到男朋友/女朋友。`如果你因为焦虑或广场恐惧症而避开旅行或人群聚集的活动，你可能会想：`我必须永远和父母住在一起，干着一份糟糕的工作。`\n\
  \n如果你感到过度焦虑、疲劳或缺乏动力，你就错过了那些能让你感觉好些的事情。这会让你更加焦虑、疲劳和缺乏动力。你可能会陷入一个恶性循环：不做那些可能让你感觉好些的事，然后变得更加抑郁，并感到更加缺乏动力。\n\
  \n这本书完全关于如何面对恐惧并夺回你的生活。如果你通过书中的练习来应对焦虑，你的抑郁可能会消失。事实上，治疗抑郁的一种方法是让抑郁症患者去做那些在由于缺乏动力而停止之前，曾经带给她快乐的事物。\n\
  \n每个人都知道动力导致行动的原理。如果你处于抑郁状态，情况则是反过来的：行动导致动力（进而导致更多行动）。换句话说，行动和动力就像进食和饥饿一样共同作用。你饿了，所以你吃。食物滋养你，让你生存，并最终再次感到饥饿。生病且没有胃欲的人通常被鼓励即使他们不想吃也要吃，因为营养物质将帮助他们找回体力。如果你想感到有动力，你需要在感觉不想做时通过采取行动来启动这个循环。\n\
  \n### 五分钟行动练习\n\n选择一项你过去喜欢的活动，或者一件你想完成的事情——一件你觉得没动力去做的事。它可以是一项身体活动，如跑步、骑自行车、跳舞或绘画。也可以是一项任务，如做作业或整理房间。无论是什么，采取行动做五分钟，无论你感到多么疲倦或没动力。如果五分钟后你想停止，那就停。但你可能会发现，一旦你开始做五分钟，你更有动力继续下去。活动是抗抑郁药。\n\
  \n### 附录：获取额外帮助\n\n#### \n\n这是一本自助书。它解释了什么是焦虑以及如何掌握它，使其不再阻碍你去做生活中想做的事。但有时，自助是不够的。如果你在执行书中的练习和挑战时遇到困难，或者你正在做练习但似乎没有进展，寻找一位治疗师一起合作可能正是你需要的。\n\
  \n\n\n\n\n掌握焦虑就像学习一项运动。你可能会读到关于游戏规则以及你为了精通它需要练习什么，但你仍然需要一位教练。治疗师就像教练。他们与你一起努力，培养你所需的技能，并鼓励你去练习和应对那些特别困难的挑战。\n\
  \n本书基于认知行为疗法（`CBT`）、接纳与承诺疗法（`ACT`）以及正念。`CBT` 关注思想、情感和行为之间的关系。`CBT` 治疗师会帮助你识别并挑战那些让你更加焦虑的“猴子思维”，并改变那些让问题恶化的行为。`ACT`\
  \ 是 `CBT` 的一种类型，它更多关注改变行为，较少关注改变思想。`ACT` 的目标是识别你的价值观和目标，并致力于采取引导你走向更丰富、更有意义生活的行动。“正念”是一个广术语，指的是用于自我发现和促进健康的古代工具，这些工具在今天变得越来越重要。\n\
  \n`CBT` 和 `ACT` 对所有的焦虑问题都非常有效。如果你决定去看治疗师，请寻找接受过 `CBT` 或 `ACT` 培训的人员，这样他或她就可以指导你使用在本书中学到的技能。\n\
  \n## 如何向治疗师提问\n\n你会希望和你见到的治疗师感到自在。你有权可以提问，以确保你选择的治疗师与你契合，并且在治疗你想要解决的问题方面有经验。\n\n\
  以下是一些很好的问题，可以帮你找到能够帮助你的治疗师：\n\n*   你在认知行为疗法方面的培训是什么？（治疗师理想情况下能够谈论他们参加过的研讨会、受过其指导的临床医生、所属的组织以及持有的\
  \ `CBT` 证书。）\n*   你在治疗焦虑方面的培训和背景是什么？（请确保询问你所患的特定焦虑类型。有时治疗师对某一种焦虑（如 `OCD`）更有经验，但对另一种（如恐恐发作）没那么经验。）\n\
  *   你目前的执业有多少比例涉及治疗焦虑？（再次询问你的具体类型。）\n*   你认为你在治疗焦虑方面效果有效吗？\n*   你使用哪些技术来治疗焦虑？（这些技术是否帮助你识别无益的想法，并采取帮助你面对恐惧的步骤？）\n\
  *   如有必要，你是否愿意离开办公室帮助我面对我的恐惧？（你的一些挑战可能需要你和治疗师进入特定的、引发焦虑的处境。）\n\n## 关于药物\n\n如果你经历着极度焦虑并影响了你的正常功能——例如无法出门上学或无法完成书中的练习——你可能想与医生讨论药物。开具焦虑药物的医生通常是家庭医生、全科医生或精神科医生（专攻心理健康的医生）。\n\
  \n在尝试药物的人中，将药物与 `CBT` 结合的人获得的效果最好。这是很有道理的。药物可以帮助降低你的整体焦虑，而治疗法教你在现在和长期范围内掌握焦虑的技能。这样，当你停止服药时，焦虑复发的的概率会大大降低。如果你只依赖药物，当你停药时，焦虑很可能会再次回来。\n\
  \n治疗焦虑的药物基本上有两种类型：抗抑郁药和苯二唑类药物。\n\n### 抗抑郁药\n\n你可能奇怪为什么给焦虑开具抗抑郁药。原因是这种药物在脑中减轻抑郁的作用机制同样也能减轻焦虑。此外，正如我之前提到的，焦虑症患者同时患有抑郁症并不罕见。这些药物可以帮助解决这两个问题。\n\
  \n最常见的抗抑郁药类型被称为选择性血清素再摄取抑制剂，或 `SSRIs`。血清素是一种影响情绪大脑化学物质，这些药物通过增加血清素水平起作用。它们还作用于大脑中影响情绪的其他化学物质。常见的\
  \ `SSRIs` 包括 `Prozac`、`Paxil`、`Celexa`、`Zoloft`、`Lexapro` 和 `Luvox`。有时使用的其他抗抑郁药还有\
  \ `Effexor`、`Cymbalta`、`Serzone` 和 `Remeron`。\n\n`SSRIs` 有优缺点。\n\n**优点：**\n*   大多数人发现吃药很容易。\n\
  *   这些药物没有成瘾性。\n*   因为你是每天服用这些药物，而不是只在感到焦虑时，所以它们被用来回避的可能性较低。\n\n**缺点：**\n*   可能会有副作用。最常见的包括恶心、腹泻、便秘、嗜睡、紧张、口干、头痛、颤抖以及性影响（如性欲降低或难以高潮）。其中许多副作用会随着时间的推移而减轻。\n\
  *   这些药物可能需要四到八周才能产生明显的效果。\n*   停药可能会导致不适症状，如头晕、恶心、睡眠困难或流感症状。如果你在停止这些药物时在医生的指导下慢慢减剂量，这些效应会减轻一些。\n\
  *   当你停止服用这些药物时，焦虑症状通常会回来。\n\n### 苯二唑类药物\n\n苯二唑类药物是在身体和大脑中作用非常快的松弛剂。人们通常在感到焦虑或恐慌，或者在进入令他们焦虑的环境时服用它们。\n\
  \n常见的苯二唑类药物包括 `Xanax`、`Valium`、`Ativan` 和 `Klonopin`。\n\n服用苯二唑类药物也有优缺点。\n\n**优点：**\n\
  *   见效快。\n*   可以根据需要服用。\n*   它们不很贵。\n*   大多数人发现吃药很容易。\n\n**缺点：**\n*   可能会有副作用，如嗜睡、头晕、混乱和抑郁。\n\
  *   如果与酒精混合使用可能是致命的。\n*   它们可能会产生生理成瘾。\n*   你可能会产生依赖，并将其作为回避焦虑的方式。它们可能会阻碍你面对恐惧并获得自信。\n\
  \n**Jennifer Shannon, LMFT** 是《青少年害羞与社交焦虑手册》（*The Shyness and Social Anxiety Workbook\
  \ for Teens*）的作者，加利福尼亚州圣塔罗莎认知行为疗法中心的联合创始人。她是认知治疗学院的成员。\n\n插画家 **Doug Shannon** 是一名自由漫画家。\n\
