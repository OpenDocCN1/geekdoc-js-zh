- "# 青少年焦虑生存指南：克服恐惧、担忧与恐慌的 CBT 技能（即时帮助解决方案系列）\n\n\n\n\n“我们知道如何战胜恐惧的担忧。这些技巧需要努力，但它们异常地简单。现在，詹妮弗·香农（Jennifer\
  \ Shannon）将这些工具直接交到你手中。如果你遵循她的聪明指导，你不仅可以生存，还能茁成长。”\n\n—**里德·威尔逊博士（Reid Wilson, PhD）**，《焦虑的孩子，焦虑的父母》和《与焦虑共处：青少年和儿童指南》合著者\n\
  \n“《青少年焦虑与生存指南》以清晰且风趣的方式，为青少年提供了有效的认知行为策略，帮助他们克服恐惧、担忧和恐慌。这本书不仅能帮助青少年度过焦虑，还将引导他们走出限制生活的恐惧与担忧。我极力推荐。”\n\
  \n—**迈克尔·A·汤普斯博士（Michael A. Tompkins, PhD）**，《我的焦虑大脑：青少年管理焦虑和恐慌指南》作者，旧金山湾区认知疗法中心副主任。\n\
  \n“这是一本非常棒的青少年书籍，它用引人入胜、有趣且易于理解的语言解释了认知行为疗法（CBT）、接纳承诺疗法（ACT）和正念所提供的所有精华。青少年可以轻松地在书中找到自己的影子，并获得克服焦虑的力量。”\n\
  \n—**凯琳·林恩·卡西迪德博士（Karen Lynn Cassiday, PhD）**，芝加哥大地区焦虑治疗中心院长，罗莎琳·富兰克林医学与科学大学临床助理教授。\n\
  \n“詹妮弗·香农所写的《青少年焦虑生存指南》是一本清晰、简洁、实用的指南，包含了帮助你克服焦虑的所有关键工具。既然现在就可以使用这些工具，为什么还要忍受一天的焦虑痛苦呢？每一章都为你提供了强大且易于理解的自助工具，以克服青少年将面临的许多困难。我会把这本书推荐给我的同事和客户。”\n\
  \n—**罗伯特·L·莱希博士（Robert L. Leahy, PhD）**，纽约纽约州美国认知疗法学院院长，《担忧痊愈：停止担忧阻碍你生活的七个步骤》作者。\n\
  \n“所有父母都想减轻青少年肩上的压力负担，但许多青少年不想谈论它。然而，他们确实渴望感觉好起来。詹妮弗·香农的《青少年焦虑生存指南》以一种完全清晰、易懂且吸引人的方式，告诉青少年他们确切需要做什么来帮助自己这一点。书中的简单练习教会青少年如何从焦虑中解放出来，并以全新的视角看待自己和自己的生活——一个更现实的视角。每个青少年都能从香农女士提供的策略中受益。我极力推荐这本精彩的书！”\n\
  \n—**塔玛尔·钱斯基博士（Tamar Chansky, PhD）**，《让你的孩子从焦虑中解放》和《让你从焦虑中解放：克服担忧并创造你想要生活的 4 个简单步骤》作者。\n\
  \n“焦虑青少年的缓解之日到来。《青少年焦虑生存指南》教授了经过证明的步骤，以揭示原因并学习如何管理焦虑。与许多类似的书籍不同，本指南通过图画和关于青少年及年轻人面临常见情况的有用故事，应对了所有类型的焦虑。无论是轻微焦虑还是极度焦虑，请完成书中的练习来掌控你的焦虑。”\n\
  \n—**克里斯汀娜·A·帕德斯基博士（Christine A. Padesky, PhD）**，心理学家，《心情胜情绪》合著者。\n\n\n\n# 出版者注\n\
