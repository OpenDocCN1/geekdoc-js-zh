  trans: "\n在大约九个月大，如果照顾者离开房间或陌生人试图抱起孩子，孩子可能会哭闹或尖叫。这种对照顾者的依赖是适应性的。它能防止幼儿离开那个他们赖其提供食物并保护其安全的父母。到两岁时，当孩子们会走路并准备好变得更加独立时，他们明白父母会回来。\n\
    \n![Image](img/10-2.jpg)\n\n那么玛丽亚对她男友的依赖又是怎样的？你和我，甚至玛丽亚都能看出，她的焦虑并非源于现实。玛亚并不依赖\
    \ `Roberto` 来获取食物和照顾。玛亚的“猴子脑”正在产生错误的计算，导致她采取了不符合其自身利益的行为。她并没有与她喜爱的男孩变得亲近，反而将他推开了。\n\
    \n玛亚的猴子在一个实际上并不危险的情况下拉响了全方位警报。它正在犯一个在所有类型的焦虑中都会犯的经典错误：高估或低估。它高估了 `Roberto` 的告别是永远的概率——即她再也见不到他——而且它低估了她独处的能力。\n\
    \n玛亚的猴子脑让她确信，她必须通过避免独处来应对她的焦虑感受。当她检查以确保 `Roberto` 还活着且没有离开她时，玛丽亚是在逃避那种“未知”的感觉。对玛丽亚来说，是一种非常可怕的感觉。当\
    \ `Roberto` 不在她身边时，玛丽亚开始觉得自己像一个父母离开了房间的婴儿。\n\n当然，`Roberto` 还活着。而且他并没有因为她不断的检查而疯狂到要和她分手，所以早晚他都会回到她身边。猜猜这归功于谁的？\n\
    \n*   **猴子想法：** `Roberto 没有回你的短信。也许他想和你分手！` \n*   **回避行为：** 给 `Roberto` 发短信或打电话检查他的情况。问他是否想和你分手。\n\
    *   **猴子逻辑：** `因为你检查了他，Roberto 才会留在了你身边。`\n*   **猴子想法：** `Roberto 正在飞往亚利桑那探望祖父母。他可能在飞机上出，你再也见不到他了！`\n\
    *   **回避行为：** 试图说服他不要去，或者开车而不是坐飞机，或者让他带你一起去。\n*   **猴子逻辑：** `因为他开车没坐飞机，或者因为你和他在一起，他没有死。`\n\
    *   **猴子想法：** `如果你一个人呆着你会感到恐慌，你无法忍受那种感觉！`\n*   **回避行为：** 在 `Facebook` 上和朋友聊天或短信。找个人和你聚聚。\n\
    *   **猴子逻辑：** `因为你和其他其他人联系在一起，你没有恐慌也没有完全失去控制。`\n\n玛丽亚不喜欢她猴子的喋吵，希望它安静下来，但她知道唯一让猴子闭嘴的方法就是遵循它的指令：`避免独处。现在给\
    \ Roberto 打电话或发短信！` 虽然这缓解了她的焦虑并让猴子安静了一会儿，但从长期来看，这让她的猴子叫得更大，分离焦虑也更严重。\n\n每当玛丽亚通过给\
    \ `Roberto` 发短信或打电话回避孤独，然后 `Roberto` 回到她身边时，玛丽亚的猴子就得到了一根香蕉。为什么？她在奖励猴子的逻辑，即避免独处救了她。可怕的喋吵变得越来越大，似乎越来越紧迫，玛丽亚的世界变得越来越小。\n\
    \n为了保持你的猴子脑安静，你正在回避什么？以下是患有分离焦虑的青少年常见的回避行为：\n\n*   避免离开家或你所依恋的人。这可能意味着避免与家人或朋友旅行，或避免参加学校的夜宿营。\n\
    *   与你所依恋的人一起做事情，不是因为你想做这些事，而是因为你在回避分开。\n*   避免任何时候独处。你可能会根据什么能让你身边有人来安排日程，而不是根据你真正想如何度过时间。\n\
    *   避免和朋友一起做事情，因为当你离开所依恋的人时你会非常担心。\n\n## 驯服分离焦虑猴子的工具\n\n如果你有分离焦虑，那么驱动你行为的焦虑想法可能是潜意识的。你根据这些想法行动了这么久以以它们已经成了自动反应。你不质疑它们，也不探寻它们的起源。只要这些想法仍然处于黑暗中，你就会继续受其支配。减少焦虑对你控制的第一步，是使用你的驯服工具为这些焦虑的想法投射一些光。\n\
    \n### 识别想法 (Spot the Thought)\n\n回想一个最近让你焦虑的场景。问自己以下两个问题：\n\n1.  `我害怕什么？`\n2.\
    \  `如果这是真的，可能的最坏情况是什么？`\n\n这些就是在那种情况下驱动你行为的想法。要理解，猴子的想法对你来说可能非常可怕且深信不疑，但它们并不是对风险的现实评估。事实上，这正是你识别它们的方式——通过它们的错误计算！猴子无法计算某事发生的实际概率。猴子的想法充其量是一个荒率的猜测，总是倾向于感知危险并让你保持安全。\n\
    \n你可以在 `http://www.newharbinger.com/32431` 下载“Spot the Thought”工作表。\n\n### 猴子的错误计算\
    \ (Monkey Miscalculations)\n\n除了高估/低估错误外，分离焦虑中发生的两种最常见的猴子错误计算是灾难化（catastrophizing）和对不确定性的不耐受（intolerance\
    \ of uncertainty）。以下是它们的具体表现。\n\n#### 灾难化\n\n对于猴子脑来说，告别就是永远的。离开爱的人可能永远不会回来。而独处是世界上最糟糕的事情——导致恐慌和失去控制。\n\
    \n当然，独处一会儿并不是灾难。你曾在没有那个人的情况下也生存了下来。即使最坏的情况发生了，你再也见不到那个人，你也会学会独立生活。但当你的猴子让你确信处于灾难性的紧急情况下时，你会忘记这一切。\n\
    \n以下是这种错误计算的例子：\n\n*   `如果那个人很远，她更容易死去。`\n*   `如果你过去几分钟或几小时没有收到她的消息，她可能受伤或去世。`\n\
    *   `如果她迟到了，她可能去世了。`\n*   `如果她在别人身边，她可能会离开你爱上别人。`\n*   `如果你听到警报声，可能是为了她。`\n\n\
    如果你怀疑猴子正在进行灾难化，问自己：`什么是更可能的解释？`\n\n#### 对不确定性的不耐受\n\n猴子脑无法忍受不知道任何情况的结果。它必须百分之百确定你是安全的，且一切都会好。事实是，我们永远无法知道一切都会好。当你认真对待这种猴子错误计算时，你是在尝试完成不可能。\n\
    \n问自己：`为了消除关系中的所有风险，我付出了什么代价？`\n\n### 替代想法 (Alternative Thoughts)\n\n在所有的焦虑问题中，都是猴子脑在进行思考，从它所有的错误计算来看，显而思考并不是猴子脑擅长的。你猴子的特长是寻找和应对可能伤害你的威胁。如果你有分离焦虑，你的猴子脑过度活跃，跳来跳去，一个接一个地叫着“如果……”：`如果这个怎么办？！如果那个怎么办？！`\n\
    \n为了停止维持分离焦虑的回避循环，你需要开始问还有什么？什么更可能是真实的？你可以看到猴子无法看到的替代方案。\n\n以下是玛丽亚提出的替代想法：\n\n\
    ![Image](img/10-3.jpg)\n\n*   **情况：** `Roberto` 说他会在九点给我打电话。当他没打时，我发了短信但他没有回复。\n\
    *   **猴子的“如果”想法：** `如果他遇到了别人，他正想和我分手呢？`\n\n"
