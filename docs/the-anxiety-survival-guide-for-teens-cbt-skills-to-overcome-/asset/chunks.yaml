  trans: '


    如你所知，你无法通过咬牙切齿并意志让焦虑的想法消失。你越是努力，它们就变得越顽固。这是因为它们的力量源于你对它们的反抗。你越反抗它们，你的“猴子脑”就越坚信这些想法是危险的，每当你想到它们时，它就会触发更多的报警。你准备好尝试接纳法了吗？


    ![Image](img/11-4.jpg)


    通过接纳和欢迎强迫念，你向自己证明了一个想法仅仅只是一个想法，无论它是多么可怕。接受强迫念意味着不通过强迫行为让它消失。


    那么这引发的焦虑呢？也接受它。感受它。一直直到最后。


    没错，`直到最后`。每种情绪（包括焦虑）都有开始、经过和结束。你只是从未越过起始阶段，在那个阶段，你正竭尽全力地想要压制它。


    这听起来可怕吗？确实如此。它也极其强大。刻意触发你的强迫念，并在不执行强迫行为的情况下感受随之而来的焦虑，是目前治疗强迫症（OCD）最有效的长期方法。它将你的猴子完全从过程中排除出去，并让你夺回主权。如果你不统治你的强迫症猴子，它就会继续统治你！


    ### 生命指南针


    每当强迫念激活你的“战斗或逃跑”反应时，你总是选择逃跑。这效果一直并不好，但似乎总是比其他选择好。现在是时候问问自己，你愿意为了什么而战斗了。你渴望回到生活的哪一部分，以至于愿意面对最极的恐惧？


    写下强迫症夺走了你什么，以及这些事物对你有多重要，会有帮助。以下是 Shaneesha 的想法：


    ![Image](img/11-5.jpg)


    为了帮助你识别自己因为强迫症而一直在回避的内容，请在 `[`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)`
    下载“生命指南针”工作表。


    对于 Shaneesha 来说，这毫无悬疑。她的指南针直接指向她深爱的祖母。那种可以享受与奶奶相处，而不必担心细菌并让她生病的想法，听起来既甜蜜又可怕。在她的内心深处，Shaneesha
    知道，如果有什么东西能带给她尝试战胜强迫症所需的勇气，那一定是她的祖母。


    如果你已经使用了指南针并明确了自己的方向，你就知道过去的做法并不能带你到达那里。回避强迫念是没用的。它们仍然会出现，而当它们出现时，通过执行强迫行为来回避其带来的焦虑也无法维持多久。


    强迫念的力量取决于你通过反抗赋予了它们多大的力量。你准备好改为接纳并欢迎它们了吗？


    ### 核心恐惧场景


    从表面上看，强迫症的执念看起来可能很滑稽，甚至对受影响的人也是如此。但如果你稍微挖掘一下，就会发现它们下方隐藏着更深层的核心恐惧。除非理解核心恐惧，否则你永远无法克服表面上可怕的想法。为了帮助你揭示核心恐惧，这里有三个很好的问题可以：


    1. `如果我不回避触发因素且不进行任何强迫行为，我会担心发生什么？`

    2. `可能发生的最坏的情况是什么？`

    3. `这对我、我的生活或我的未来意味着什么？`


    举例来说，这里是 Shaneesha 对这些问题的回答。


    ![Image](img/11-6.jpg)


    一旦你确定了自己的核心恐惧，请拿好笔和纸，因为你现在有一个发挥创意的机会。你要写下你的`核心恐惧场景`。这是一段像电影场景一样的描述，生动地描绘出如果你的核心恐惧变成
    true 时的样子。它应该越可怕越好——就像一部为了让你（观众）感到毛骨悚然的恐怖片。在 `[`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)`
    下载“核心恐惧场景”工作表。


    你起初可能会对此望而却畏。大多数强迫症患者很难让自己暴露在执念面前，尤其是那些涉及伤害亲人的想法——在 Shaneesha 的情况下，是关于祖母去世的想法。我们被教导思想是有力量的，可以影响结果。但对于强迫症来说，完全不是如此。


    你的执念是疾病的结果，你必须像那样对待它们。记住，让自己暴露在执念面前是为了让这些想法失去一些力量。这就像你决定反复看一部恐怖片一样。起初会非常可怕，但在看了五十次之后它就会变得无聊。你需要学习停止把你的想法视为危险的并停止回避它们，因为那只会加剧疾病。


    以下是 Shaneesha 的核心恐惧场景：


    ```

    因为我决定面对我的强迫症，我摸了我的背包。我知道我的背包在学校和其他地方接触过成百上千种表面，这些地方既脏又充满了细菌。现在我的手上带着这些脏脏细菌。我的心跳加快了，我很想洗手，但我没有洗。相反，我走进家里开始触碰东西。我摸了门把手、冰箱把手、台面和餐厅餐桌。现在我的心真的跳得很快，我感到发热并出汗。然后我知道祖母会接触到这些表面。她会用手摸眼睛。我看到这一幕想大喊：“停下！别碰你的眼睛！”但我没有。。第二天早上，我的祖母来吃早餐，她在咳嗽。这可能是因为我把细菌传染给了她。到那天结束时，她真的病了，发着高烧，所以我父母带她去看医生。由于她病得太严重，他们最终让她她住院了。我没法去看她，因为这可能全是我的错。我的祖母去世了。

    ```


    写完你的核心恐惧场景后，留出至少半小时（越长越好）反复阅读它。你也可以将场景录制在手机或电脑上并播放给自己听。在第一次读或听之后，用 1 到 10 的数字记录下它让你有多焦虑（10
    为最焦虑）。然后继续读或听，直到你的焦虑下降 50%，或者你当天的时间结束。这对于接纳执念的另一部分是极佳的准备：不执行随之而来的强迫行为！


