    scarier challenges for the next rungs—like petting Charlie, or taking him off
    his leash. As he added more anxiety-provoking variables to each challenge, he
    found he was getting closer to his ultimate goal—on paper, at least. When he was
    finished, his ladder looked like this:*


    ![Image](Images/4-6.jpg)


    Each rung had a challenge that would cause him a little more anxiety—and give
    him a little more independence—than the rung below it. Completing each challenge
    would help Justin gain a little more distance from his monkey’s chatter and a
    little more confidence in his own alternative thought: *The possibility of a dog
    getting off its leash and attacking me is very unlikely*.


