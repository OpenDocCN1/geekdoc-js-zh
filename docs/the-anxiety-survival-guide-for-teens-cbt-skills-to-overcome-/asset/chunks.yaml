    ### **实际原因和目的：** 血液和氧气正离开你的手、脚和脸部，流向腿部和手臂的大肌肉。这会导致麻木和刺痛感。如果你真的遭到了攻击并在防御时受伤，这种血液循环的变化将帮助防止流失过多的血液。


    - **感觉：** 恶心、神经性胃、肠道痉挛或腹泻、口干或呕吐反射

    - **猴子思维：** *万一你吐了，或者没及时赶上厕所怎么办？*


    ### **实际原因和目的：** 消化过程停止，以便更多能量流向心脏、肺部和腿部。这会导致恶心和腹泻。如果你正被捕食者袭击，你不会吃一包薯片。通过停止胃部，你有更多的能量来逃跑。


    - **感觉：** 视觉变化

    - **猴子思维：** *万一你疯了，或者事情看起来很奇怪或不真实怎么办？*


    ### **实际原因和目的：** 当你恐惧时，你的眼睛睁大，瞳孔放大，这样你就能更好地看到危险，即使在黑暗中也是如此。这会导致视觉变化。


    - **感觉：** 感到热和流汗

    - **猴子思维：** *哦不——可能出事了。你可能会恐恐慌发作并失去控制！*


    ### **实际原因和目的：** 出汗有助于冷却身体，使你自己在奔跑或对抗威胁时不至于过热。此外，如果你满身汗水，对捕食者来说更滑溜，这样你更容易逃脱。


    - **感觉：** 感到冷和潮湿

    - **猴子思维：** *哦不——可能出事了。你可能会恐恐慌发作并失去控制！*


    ### **实际原因和目的：** 血液和氧气正离开你的手、脚和脸部，流向腿部和手臂的大肌肉。随着血液离开手部，如果你真的遭到了攻击，在防御时受伤，你就不可能流失过多的血液。


    正如你从这个列表看到的，你所有的恐慌感觉都有充分的理由。毕竟，焦虑是适应性的。如果我们感觉不到焦虑，我们的身体就不知道如何应对危险，人类在几千年前就被灭绝了。但在没有实际危险证据的情况下，你的身体为什么要进入战斗或逃跑模式呢？


    我们并不真正清楚。思考恐慌发作的一种方式是将它们想象成学校火演——对你的战斗或逃跑反应进行测试，以确保它运行正常。就像火警报一样，你身体的报警最终会静下来。在最多几分钟到半小时内，一切都恢复了正常。你感到非常松口气，但当然，你也会感到很震惊。与火演不同，你以为那是真的。你以为你真的要死了、疯了或失去控制了。你非常想彻底忘记这段经历。


    ## 驯服恐慌猴的工具


    为了征服恐慌，你需要学习如何驯服那只恐慌猴。幸运的是，有很多工具有你可以可以使用，通过练习，这些工具会变得越来越好用。


    ### 识别想法


    由于恐慌发作的驱动力不是情境或感觉，而是你对感觉的`理解解释`，因此掌握恐慌的第一步是识别触发你恐慌的猴子思维解释（或焦虑想法）。焦虑想法并不总是容易记住，但你通过首先回想那些往往难以忘记的恐慌感觉来发现它们。列出你在最糟糕的一次恐慌发作期间所产生的所有感觉。（你也可以使用一个表格，可以在
    `http://www.newharbinger.com/32431` 下载）。


    接下来，针对你列出的每种感觉，写下你害怕会发生什么。可以提问的好问题有：


    - *当我产生那种感觉时，我的脑海里跳出过什么？*

    - *我害怕什么？*

    - *最坏的情况会发生什么？*


    ### 猴子的计算错误


    列出你的猴子思维解释。在每个解释旁边，识别出你在第 3 章中提到的你的猴子正在犯的计算错误。除了已经提到的高估/低估，恐慌发作背后最常见的猴子计算错误是灾难化，或者跳跃到最坏的结论。就像在看恐怖电影一样，猴子思维总是在想象最坏的结果。


    #### 灾难化


    - 我正在心脏发作。

    - 我会失去控制并晕倒。

    - 我无法呼吸；我可能会窒息而死。

    - 如果我在开车时恐慌发作，我可能会出车祸。

    - 我感觉很奇怪；也许我要疯了。万一这是精神分裂症或其他严重的精神疾病呢？


    ### 替代性想法


    最后但同样重要的是，根据每种感觉的实际原因和目的，写下另一种解释。以下是 Kim 提出的想法：


    - **感觉：** 胸部紧绷

    - **猴子思维：** *你喘不上气了；你可能会窒息而死。*

    - **猴子计算错误：** 灾难化

    - **替代想法：** *当我焦虑时，我的呼吸会变化，我的肌肉紧张以准备战斗或逃跑。这导致我感到胸部紧绷。*


    - **感觉：** 心跳加速

    - **猴子思维：** *出问题了；万一你正在心脏心脏发作怎么办？*

    - **猴子计算错误：** 灾难化

    - **替代想法：** *我的心跳加速是为了向肌肉泵送血液和氧气。这是战斗或逃跑反应的一部分。*


    - **感觉：** 头晕和眩晕

    - **猴子思维：** *万一你晕倒了怎么办？*

    - **猴子计算错误：** 灾难化

    - **替代想法：** *当我焦虑时，我的呼吸会改变。我的身体充氧并释放二氧化碳，导致头晕。因为在恐慌期间我的血压是上升而不是下降，所以我不会晕倒。*


    通过接受对感觉的灾难化解释，Kim 一直在让她的猴子思维对她的感受和她的反应做出决定。现在，有了 Kim 的替代想法，她在应对恐慌时有了两种选择：一种基于恐惧，另一种基于事实。


    Kim 有了一个良好的开始，如果你也花时间识别自己的想法，你也是。一旦你能看到猴子思维在运作，并学会区分无害的恐慌感觉和对健康的真正威胁，你可能会发现整体焦虑减轻减轻。（你可以在
    `http://www.newharbinger.com/32431` 下载替代想法工作表）。


    ![图像](img/7-5.jpg)


    更重要的是，你现在有了替代猴子想法的方法。你大脑中有一个更大、更理性的部分，它知道你真实是谁以及你的梦想和目标是什么。你可以做出不基于恐惧的决定。有了另一种思考方式，你已经准备好迎接下一步，这需要你所有的勇气和头脑冷静。


