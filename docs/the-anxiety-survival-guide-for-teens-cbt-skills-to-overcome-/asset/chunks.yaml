    To control and avoid anxiety, people tense up by either holding their breath or
    breathing too quickly. Or they use their breath to try to relax. By tensing up
    or trying to relax, you are not letting your anxiety run its course. You are actually
    agreeing with your monkey that anxiety is a danger signal that you need to do
    something about. When you are meeting a challenge by tensing up or trying to relax
    you are not really meeting your challenge.


    ## Welcoming Anxiety


    To welcome anxiety you must learn to breathe *into* it—the very opposite of what
    you’ve been doing. To see what I mean, imagine the thing you are afraid of in
    detail, enough to get your anxiety to at least a 5 on a 1-to-10` scale. Don’t
    read any further until you are there.


    Feeling uncomfortable? Good! Now do the following:


    1. Breathe in deeply, filling your lungs so that your belly expands.

    2. Breathe out completely.

    3. Repeat slowly and deliberately.


    By breathing into your anxiety, you are telling your monkey that anxiety is nothing
    to be afraid of. You are opening up your body to give the anxiety room to play
    itself out. This is something you’ve never done before, so it probably sounds
    scary. But not allowing yourself to actually feel anxiety is why your anxiety
    is still haunting you. What you resist, persists.


    ![Image](Images/8-a.jpg)


    What you will find when you keep welcoming and keep breathing is that your anxious
    feelings will begin to change on their own. At first, your fear may feel stronger,
    as if it will overwhelm and destroy you. That’s what your monkey mind will be
    telling you, anyway! But feeling fear cannot hurt you. Your body is designed to
    feel things, and there is no emotion that can physically hurt you.


    Anton began his challenges by simply saying the words “vomit,” “puke,” “throw
    up,” and so on. He kept track of how anxious that made him feel, and after only
    three sessions saying those words repeatedly only got him to 1 on a 1-to-10 anxiety
    `scale`. But when he began looking at cartoons of people throwing up, his anxiety
    went up to a 7. He looked at the cartoons every day, and by the end of the week
    he still felt somewhat disgusted by the pictures. But his anxiety was down to
    a 2.


    Photographic images of people throwing up pushed Anton’s anxiety up to a 9. Some
    of the pictures were really bad, so he had his dad help him pick out pictures
    that were less disgusting to start with. After a few days he was able to look
    at the worst of them without his anxiety going beyond a 3.


    When the challenges made Anton feel sick to his stomach he noticed that his anxiety
    increased. His monkey mind was chattering away, telling him he was about to throw
    up. Of course, Anton knew the odds of that happening were slim. He’d only thrown
    up twice in his entire life! The longer he did the challenge and did not throw
    up, the more his anxiety went down.


    Anton decided he was ready to move on to listening to sounds of people throwing
    up. He got his dad to pick out YouTube videos of people throwing up. He covered
    the screen of his computer so that he did not see the images, and set the videos
    to replay over and over. When his anxiety went down to a 2 he began watching the
    images along with the sound. It did not take him as long to get used to this as
    he had thought it would. His disgust never really went away, but he was much less
    anxious.


    All of this ladder practice was helping Anton throughout the day. Whenever a friend
    showed any sign of being sick, he still got anxious, but the urge to run was much
    less strong than before, and he found that he could breathe his way through it.
    The challenges were giving him confidence and conviction that feeling nauseous
    was not the same as throwing up.


    One day some friends invited him to a concert that was a two-hour drive away.
    Even though it meant being in a car all that time and eating at strange places,
    to Anton’s own surprise he said yes. It just didn’t feel that scary anymore. Life
    is looking good for Anton!


    Many people go their whole lives carefully avoiding something that, on its own,
    holds no actual threat. They may rationalize it by saying that it really doesn’t
    inconvenience them that much, but in their hearts they know they long for the
    freedom of choosing their own paths without being detoured by fear.


    You don’t have to resign yourself this way. You have the tools to rule your monkey.
    Remember that you are not alone and not to blame. Have compassion for yourself
    and take courage. You can live the life you want to live!


    ![Image](Images/9-1.jpg)


    ## Chapter 9


    # Generalized Anxiety


    ### Worrywarts


    Tess was known as a “worrywart” from the time she was little. She worried about
    almost anything, from a mosquito bite causing West Nile disease to a B on a test
    ruining her chances of getting into college. She felt stressed out nearly all
    the time, and she frequently had headaches and stomachaches. Things were really
    bad at night, when there was nothing to distract her from worrying. Her thoughts
    were like a mouse on a wheel, going around and around. She often had trouble falling
    asleep, and when she finally did she would feel restless throughout the night,
    waking up tired and irritable.


    Tess has generalized anxiety. Instead of having fears about something specific—like
    spiders, or being judged, or having a panic attack—she has fears that are more
    general. Teens with general anxiety worry about school, work, family, health,
    and things going on in the world.


    These kinds of worries are about things that really could happen, which can make
    things confusing. After all, if you have a bad feeling about something happening,
    shouldn’t you attention to it?


    Anxiety *can* be a signal to pay attention to a problem so you can solve it and
    prevent something from happening. But like the hunter who thought every track
    on the ground was a saber-toothed tiger track, if you suffer from generalized
    anxiety you get so many danger signals that you spend countless hours trying to
    solve problems you’ve already solved or are beyond your control. Chronic worry
    is not useful and is something nobody wants. Teens with this type of anxiety say
    the same thing: “Please help me stop worrying!”


    When you have generalized anxiety, your monkey mind is looking out at the world
    through binoculars. Small things get blown out of proportion and your jumps to
    the worst-case scenario. The resulting worry you experience is exhausting and
    actually interferes with your ability to concentrate. This is worry that does
    not help you safe.


    ![Image](Images/9-2.jpg)


    Like all anxiety, generalized anxiety is maintained by avoidance. You may make
    endless lists to avoid forgetting anything. You may ask for reassurance from friends,
    parents, or doctors that there is nothing wrong with you. You may put off decisions
    in order to avoid making the wrong one. Perhaps you avoid the possibility of getting
    a bad grade by over-studying.


    Sometimes the only thing you are doing is worrying. How is that avoidance? People
    with generalized anxiety believe that worrying will help them be more prepared
    if things turn out badly, or that if they worry long enough they will eventually
    come up with a solution that will keep them safe. It feels better to worry than
    to feel the discomfort of not knowing what will happen. Worry is an attempt to
    eliminate risk and thus reduce anxiety.


    Let’s take Tess’s anxious thought: *What if that mosquito that just bit me is
    carrying West Nile virus?* This is a scary thought. But it is something Tess can’t
    do anything about, and when she begins to worry about that possibility she is
    giving the thought more attention than it deserves. She is feeding her monkey
    a banana, telling it that the thought is important. As long as she keeps worrying
    about the worst possible outcome of her mosquito bite, and looking for reassurance
    that it will not happen, Tess is fueling her cycle of avoidance.

