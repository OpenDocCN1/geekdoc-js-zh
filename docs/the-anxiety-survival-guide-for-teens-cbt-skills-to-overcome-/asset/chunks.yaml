  trans: "\n\n更糟糕的是，当你恐惧的结果并没有发生时（因为泛化焦虑患者所担心的大多数事情极都不可能发生），你的“猴子”会抢走所有的功劳。猴子的逻辑是：`因为你担心了西尼尔病毒，所以你没有染上它。`\n\
    \n让我们来看看这种“猴子大脑”在其他泛化性担忧例子中的作用。\n\n*   **猴子思维：** `如果你的头痛是由脑肿瘤引起的怎么办？`\n*   **回避行为：**\
    \ 担心。要求看医生。在互联网上查询脑肿瘤的其他症状。\n*   **猴子逻辑：** `因为你时刻留心观察状况，你死于脑肿瘤的可能性就更小了。`\n*  \
    \ **猴子思维：** `万一你父母离婚了怎么办？你的生活就毁了！`\n*   **回避行为：** 担心。询问父母一切是否都好。\n*   **猴子逻辑：**\
    \ `因为你正在担心并向父母询问情况，万一发生了坏事，你也会做好准备。`\n*   **猴子思维：** `如果你忘了某些重要的事情怎么办？那会毁掉一切！`\n\
    *   **回避行为：** 担心。在脑海中回顾需要记住的事情。列很多清单。\n*   **猴子逻辑：** `因为你列了清单没有忘记任何事，所以糟糕的事情没有发生。你拯救了大局！`\n\
    *   **猴子思维：** `你可能会死于车祸！`\n*   **回避行为：** 担心。告诉开车的人慢一点。观察路上的其他司机是否可能醉酒。\n*   **猴子逻辑：**\
    \ `因为你担心并警惕了危险，你没有发生车祸。你躲过了一场灾难！`\n\n当你对那些已经采取步骤准备的事情，或者你无法控制的事情感到担忧时，你是在奖励猴子逻辑。你正在给你的猴子一根香蕉。而且没有更好的方法能保证你的猴子会针对另一个可怕的结果产生另一个焦虑的想法了！这种回避的循环让你的担忧持续增强。\n\
    \n![Image](img/9-3.jpg)\n\n噢，顺便说一下，如果你担心的事情*真的*发生了，猴子大脑仍然会得到一根香蕉。无论这种担心是否有帮助，猴子逻辑都会说：`看，我早就告诉你了！幸好通过担心做好了准备！`\n\
    \n是的，我们确实需要为威胁做好准备并防止坏事的发生。焦虑可以是一个很好的警示，提醒你需要对问题的情况采取行动。但一旦你做了这些，反复重复这个过程——即担忧——是没用的。它所做的只是喂养猴子大脑并产生更多的焦虑。\n\
    \n## 驯服泛化焦虑猴子的工具\n\n担忧的挑战在于如何区分哪些是需要解决的问题的重要信号（焦虑想法），哪些是“猴子胡言”（的焦虑想法）。认为蚊子叮咬会导致西尼尔病毒是猴子的胡言。即使这是事实，在当下一刻你对它也无为力。\n\
    \n以下是一份情况列表。其中一些是行动号召的例子——为了防止或应对糟糕的状况。另一些是猴子胡言的例子——意味着事情可能会出错，但 1) 没有办法解决问题或\
    \ 2) 你已经解决了它但仍在担心。阅读每种情况并判断它是可以解决的问题还是猴子胡言。（答案将在最后提供。）\n\n*   a. 你担心因为没有复习，明天的历史考试可能考不好。\n\
    *   b. 你担心你的父母可能会离婚。\n*   c. 你已经学习到午夜，但你仍然担心明天的考试会考不好。\n*   d. 你担心自己可能会上胃流感，导致周末计划被泡汤。\n\
    *   e. 你担心自己面试表现得不好，可能得不到你真正想要的工作。\n*   f. 你已经提交了大学申请，但你担心自己进不了心仪的大学。\n*   g.\
    \ 你想起你忘了朋友的生日，可能伤害了她的感情。\n*   h. 现在已经是深夜了，你正在担心男朋友或女朋友可能会和你分手分手。\n*   i. 你妹妹刚拿到驾照，你担心她可能会发生车祸。\n\
    *   j. 你的朋友边开车一边发短信，你担心他可能会发生车祸。\n\n### 答案：\n\n*   a. 可以解决的问题。如果你没有复习，在第二天考试之前你还有些可以做的事。\n\
    *   b. 胡言。无论这是否属实，你对它无能为力。\n*   c. 胡言。你已经学习过了，虽然你可能并非无所不知，但担心这些并没有帮助。\n*   d.\
    \ 胡言。担心这些有什么帮助？你要么会生病，要么不会。你对它无能为力。\n*   e. 胡言。你已经面试完了了。在现阶段你什么也做不了。他们是否录用你取决于他们的决定。\n\
    *   f. 胡言。你已经提交了申请。在现阶段你什么也做不了。\n*   g. 可以解决的问题。你随时可以给朋友打电话祝她迟到的生日快乐。如果你这样做了仍然担心，那么它就变成了胡言，因为你已经做了尽力而为的事，而且你无法控制别人的感受。\n\
    *   h. 胡言。已经是深夜了——你对此能做些什么？\n*   i. 胡言。虽然新驾照员风险确实更高，但你对这无能为力。\n*   j. 可以解决的问题。开车时短信是危险的，而你有完全的权利这样做。\n\
    \n你自己的担忧情况可能不在这个列表中，而且它们可能让你觉得与众不同。幸运的是，你可以使用强大的工具来识别这些胡言并驯服猴子。\n\n## 识别想法\n\n\
    有三个基本问题可以问自己：\n\n1.  `我害怕什么？`\n2.  `如果这是真的，最坏的情况会是什么？` \n3.  `这对我、我的生活或我的未来意味着什么？`\n\
    \n这里是 Tess 的答案：\n\n![Image](img/9-4.jpg)\n\n在继续之前，请花一点时间识别一个你自己的想法。你可以在以下网址下载针对泛化焦虑的“识别想法”工作表：`http://www.newharinger.com/32431`\
    \ (`http://www.newharinger.com/32431`)。\n\n## 猴子的计算错误\n\n当你观察人们担心的事情时，通常有足够的证据表明这种经典的猴子计算错误：高估/低估。你可以在本章前面的猴子逻辑示例中看到这一点。\n\
    \n死于车祸极不可能，因为一次考试考砸就进不了大学也不太可能。担心这些结果是高估了它们发生的概率。\n\n那么父母离婚的可能性，或者你忘记作业的可能呢？这些不仅是对危险的过度估计，也是对你如果这些真的发生时应对能力的低估。无论你的猴子是在高估风险还是低估你的应对能力——或者两者都有——结果都是一样的。你的猴子告诉你：`担心！多担心！这是你做好准备或防止坏事发生的唯一机会！`\n\
    \n![Image](img/9-5.jpg)\n\n### 灾难化\n\n任何情况都有很多可能的结果，但猴子大脑总是假设最坏的情况。自然，这让你在大部分时间里都感到紧张。这些灾难化的猴子想法听起来熟悉吗？\n\
    \n"
