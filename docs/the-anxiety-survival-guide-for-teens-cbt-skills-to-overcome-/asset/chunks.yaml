    the challenge and he wasn’t avoiding anymore!*


    *Over the next six months Jarod slowly worked his way up the rungs of his ladder,
    all the way to the top. His final challenge was a great success, even though the
    girl declined to go out with him. It might have been because she was going with
    someone else, or that he wasn’t her type—Jarod didn’t ask. He took a breath and
    rolled with it, and they wound up talking for about twenty minutes about their
    favorite bands. They are friends now, and Jarod is working on a new ladder. He’s
    got big plans for the future.*'
