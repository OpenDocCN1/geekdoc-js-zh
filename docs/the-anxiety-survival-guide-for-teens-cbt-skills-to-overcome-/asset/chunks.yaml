  trans: '


    事实是，如果你是一个社交焦虑的青少年，你是一个聪 way、敏感且负责任的人。你最严厉的批评者在你体内，而不是在外面。你值得掌控。对你的“猴子”表示感谢，但它又算错了。你并没有处于任何巨大的危险中，无论发生什么，你都能应对！


    ![Image](img/6-9.jpg)


    ![Image](img/7-1.jpg)


    # 第 7 章：恐慌与广场恐惧症


    ## 我是要死了吗还是疯了？


    Kim 坐在男朋友足球赛的看台上时，突然感到胸口一阵紧缩，好像有人在用力挤压她。她感到呼吸困难，心脏似乎要跳出胸膛，并感到头晕目眩。她给父母打了电话，父母赶来接走了她并带她去了急诊室。医生告诉她她正在经历恐慌发作，除了这个，她的身体没有任何问题。


    如果你经历过恐慌发作，你就知道相信自己身体没问题是有多么困难。突然之间，毫无征兆地，你感觉自己要窒息、心脏病发作或要疯了——甚至可能这些同时发生。然而，身体真的没问题吗？


    嗯，确实出了问题，但问题不在你的身体上。那是你的“猴子大脑”在作怪，在没有物理危险时触发了警报。当 Kim 的胸口收紧、心率增加时——这对她来说是非常不舒服的感觉——她的猴子就认为出事了。这就是恐慌发作的运作方式，慢动作版：


    ![Image](img/7-2.jpg)


    Kim 被告知身体没问题后松了一口气，等她离开急诊室时，她感觉几乎恢复了正常。一切都好直到大约三周后，她在生物课上又一次恐恐慌发作。她记得急诊室医生的话，但遗憾的是，知道“生理上”没问题并没有帮助她减轻焦虑。她感到非常头晕，担心会晕倒或以某种方式失去控制。她设法站起来离开教室，告诉老师她不舒服。然后她妈妈妈妈立刻来接她。第二天，她妈妈预约了
    Kim 的医生，看看是否能做什么处理。医生给 Kim 开了药，以便在她再次发生恐慌发作时服用。


    第二次恐慌发作后，Kim 开始担心自己还会发作。她总是随身带着药物，以及手机，以防她需要给父母打电话。她开始留意恐慌的迹象。每当她感到心率增加时，她就会担心会再次发作，有时她确实发作了。Kim
    在感觉到感觉袭来时会立即服药，这通常能阻止她演变成完全的恐慌发作。


    无论你多么想相信恐慌发作是没有危险的，它们的感觉是如此剧烈、如此可怕，以至于再次发作的念头就会让你感到巨大的焦虑。猴子大脑并不会通过阅读事实或听取急诊室医生的建议来学习。


    第二次发作后，Kim 的猴子得出结论：因为她那些“危险”的生理症状在她妈妈到达后不久就消失了，离开教室和给妈妈停止了发作。当 Kim 服药来缓解恐慌、症状之减轻时，她的猴子就会说：“药真好！”，并且如果她在没带处方药瓶的情况下去哪里都会拉响警报。就像所有的焦虑一样，Kim
    困境的核心特征是她的`回避`。


    ![Image](img/7-3.jpg)


    当然，回避确实起作用。它变成了 Kim 的默认行为，因为它给了她一种控制感。以下是患有恐慌症的青少年常用的某些回避策略：


    *   避免让你感到闷热、出汗或心跳加速的运动。

    *   避免咖啡因，它可能会让你的心跳加速，或让你感到紧张、躁动。

    *   避免任何可能让你感觉异常的物质。这包括非处方药、处方药、非法药物或酒精。

    *   避免汽车和教室等闷热不风的地方，因为它们会让你感到闷热出汗。

    *   避免去任何以前经历过恐慌发作的地方。

    *   避免在没有医生处方药物的情况下去任何地方。

    *   避免在不带手机的情况下出门，以防你感到恐慌袭来并觉得需要打救援电话。

    *   避免在没有让你感到安全的人的情况下去哪里。

    *   避免离家或医院太远。


    所有这些回避策略的问题在于，它们是由焦虑的想法主宰的。当决定基于恐惧时，你的猴子大脑处于主导地位。生活的乐趣被挤到一边，因为你的猴子唯一关心的是让你保持安全。虽然你可能体验到某种控制感，短期内减轻了你的焦虑，但从长期来看，你正在让焦虑变得更糟。


    每一次回避，你都在强化你猴子的逻辑，即你的回避救了你。所以，你猴子那些可怕的喋喋会变得更大，看起来更紧迫。你猴子的假警报、你的焦虑感受和你的回避行为之间的关系得到了加强。随着被回避的情况和活动越来越多，你离目标变得越来越远。


    ![Image](img/7-4.jpg)


    ## 识别恐慌猴子


    当 Kim 的猴子观察到她胸口紧缩、心跳加速时，它拉响了警报：“呜呜呜！快求救！非常害怕！”它只是在试图完成保护 Kim 安全的工作，但正如我们所，猴子并不擅长评估风险。Kim
    的猴子高估了恐慌感觉的物理危险，并低估了 Kim 的应对能力。


    那么恐慌感觉在生理上有多危险呢？事实是它们完全没有危险。它们仅仅是战斗或逃跑反应，是健康的证据而非任何问题。以下是一些常见的恐慌发作症状，每种症状都有经典的误读以及真实情况的解释：


    *   **感觉**：头晕、头部发轻

    *   **猴子的想法**：“我会晕倒吗？”

    *   **真实原因和目的**：焦虑会导致呼吸变化，让你摄入更多氧气并呼出更多二氧化碳。这种混合物为大肌肉提供能量，以便你逃避威胁。它也会让你头晕——但不会让你晕倒！要真正晕倒，你需要血压突然下降。在恐慌发作期间，情况恰相反：你的心率和血压会上升。所以尽管这是一个常见的恐惧，但晕倒概率非常小。


    *   **感觉**：心率增加、心悸、胸闷

    *   **猴子的想法**：“我是心脏病发作了吗？”

    *   **真实原因和目的**：你的心率增加是为了让心脏向大肌肉输送更多含氧血液，让你逃避或战斗威胁。你的心脏是一个执行工作的强大肌肉。


    *   **感觉**：呼吸困难

    *   **猴子的想法**：“我会窒息而死吗？”

    *   **真实原因和目的**：你的呼吸变得更快速，以便为大肌肉提供所需的氧气。这会导致胸口紧缩感或无法呼吸的感觉。此外，你的肌肉在紧张以准备战斗或逃跑。你胸部的肌肉在收缩，你可能会将其误认为无法呼吸。


    *   **感觉**：脸部、手和脚的刺痛或麻木感

    *   **猴子的想法**：“我会瘫痪并失去控制吗？”


