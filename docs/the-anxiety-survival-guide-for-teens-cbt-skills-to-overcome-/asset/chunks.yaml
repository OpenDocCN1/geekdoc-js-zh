  trans: "\n周六早晨，或者任何你想要赖赖床的早晨，都是你停止这种循环的时候。要做到这一点，你需要忽略你的“大脑猴子”。除了时差现象外，这里还有其他一些猴子思维的例子，以及可以帮助你建立自己的替代思维的事实。\n\
    \n*   **猴子思维：** `你才睡了五小时！你永远赢不了那场越野赛的！`\n*   **事实：** 当你睡眠八到九小时时状态可能是最好的。你会感到精力充沛，能够正常集中注意力。我们称之为`optimal\
    \ sleep`理想睡眠。另一个标准是`core sleep`核心睡眠，大约是六小时。如果你能获得六小时的`core sleep`，第二天可能感觉没那么好，可能比比常常更容易情绪化或健忘，但在运动、作业和考试等高要求任务中，你的表现依然良好。\n\
    *   **替代思维：** `我可能不会感觉很棒，但只要我获得了`core sleep`，我在比赛中的表现就会和获得`optimal sleep`一样好。`\n\
    *   **猴子思维：** `你一直翻来覆去的。你是一点都没睡着！`\n*   **事实：** 你睡眠的时间比你想象要要。青少年往往会低估 20%的睡眠时间。这意味着如果你认为自己只睡了五小时，实际上你可能睡了大约六半小时。为什么呢？\n\
    *   睡眠实际上有五个独立的阶段。阶段 `1` 和 `2` 是非常浅睡眠；你对周围发生的事情仍有一定的感知力。受试者会报告在这些阶段是清醒的，但测量他们脑波的机器显示他们绝对处于睡眠状态。`Stage\
    \ 1` 和 `stage 2` 睡眠非常重要，占了你总睡眠时间的近 50%。\n*   **替代思维：** `尽管我能听到声音并不断在思考，但我可能处于第\
    \ 1 或 2 阶段。我获得的睡眠比感觉的要多。`\n*   **猴子思维：** `你昨晚连五小时觉都没睡。你完蛋了！`\n*   **事实：** 如果你连续几天没有获得`core\
    \ sleep`，你的身体会自动比平时花费更多时间处于`stage 3` 睡眠中，这种睡眠有助于你第二天维持功能。\n*   **替代思维：** `如果我确实没有获得`core\
    \ sleep`，我可以信任我的身体，它会在它最需要的阶段花费更多时间。`\n*   **猴子思维：** `你昨晚没睡够觉。你最好错过第一节课睡个懒！`\n\
    *   **事实：** 每天在同一时间起床从长远来看会有助于你睡得更好。你清醒并接触阳光的时间越长，对睡眠的需求就越大，这有助于确保第二天晚上获得更好的睡眠休息。\n\
    *   **替代思维：** `睡懒只会导致以后产生更多问题。在同一时间起床对于打破我所处的失眠循环至关重要。`\n\n如果你能坚持一周的时间表，你的身体将开始进入健康的睡眠模式。最终，你将对自己的睡眠能力充满足够的信心，从而能够更灵活地安排睡眠。同样重要的是，你将统治猴子，而不是由它统治你！\n\
    \n## 焦虑与抑郁\n\n焦虑和抑郁是最常见的心理健康问题，青少年经常同时经历。这是因为两者之间存在因果关系。\n\n正如你从书中读到的，当你感到焦虑时，你的大脑猴子会想出很多理由说明你不应该做某些事情。当你避开许多你内心真正想做的事情时，久而久之，你会失去对自己能力这些事的相信。你会感到无助和绝望。缺乏动力是抑郁的定义特征。\n\
    \n例如，如果你因为社交焦虑而避免参加派对或其他社交活动，你可能会产生想法：`我永远无法交到朋友或找不到男朋友/女朋友。`如果你因为焦虑或广场恐惧症而避开旅行或人群聚集的活动，你可能会想：`我必须永远和父母住在一起，干着一份糟糕的工作。`\n\
    \n如果你感到过度焦虑、疲劳或缺乏动力，你就错过了那些能让你感觉好些的事情。这会让你更加焦虑、疲劳和缺乏动力。你可能会陷入一个恶性循环：不做那些可能让你感觉好些的事，然后变得更加抑郁，并感到更加缺乏动力。\n\
    \n这本书完全关于如何面对恐惧并夺回你的生活。如果你通过书中的练习来应对焦虑，你的抑郁可能会消失。事实上，治疗抑郁的一种方法是让抑郁症患者去做那些在由于缺乏动力而停止之前，曾经带给她快乐的事物。\n\
    \n每个人都知道动力导致行动的原理。如果你处于抑郁状态，情况则是反过来的：行动导致动力（进而导致更多行动）。换句话说，行动和动力就像进食和饥饿一样共同作用。你饿了，所以你吃。食物滋养你，让你生存，并最终再次感到饥饿。生病且没有胃欲的人通常被鼓励即使他们不想吃也要吃，因为营养物质将帮助他们找回体力。如果你想感到有动力，你需要在感觉不想做时通过采取行动来启动这个循环。\n\
    \n### 五分钟行动练习\n\n选择一项你过去喜欢的活动，或者一件你想完成的事情——一件你觉得没动力去做的事。它可以是一项身体活动，如跑步、骑自行车、跳舞或绘画。也可以是一项任务，如做作业或整理房间。无论是什么，采取行动做五分钟，无论你感到多么疲倦或没动力。如果五分钟后你想停止，那就停。但你可能会发现，一旦你开始做五分钟，你更有动力继续下去。活动是抗抑郁药。\n\
    \n### 附录：获取额外帮助\n\n#### \n\n这是一本自助书。它解释了什么是焦虑以及如何掌握它，使其不再阻碍你去做生活中想做的事。但有时，自助是不够的。如果你在执行书中的练习和挑战时遇到困难，或者你正在做练习但似乎没有进展，寻找一位治疗师一起合作可能正是你需要的。\n\
    \n"
