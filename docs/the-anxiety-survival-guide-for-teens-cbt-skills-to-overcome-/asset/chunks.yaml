  trans: '

    你可以关注任何事情——一张照片、一朵花，或者墙上的一个斑点。重要的是，你没有给予那只“猴子”它习惯的那种关注。许多人发现，将注意力放在自己的呼吸上是最好的。你的肺一直都在那里，当你意识到自己的呼吸时，你就意识到了自己的身体。


    专注于呼吸最好的方式是坐在一个安静的地方，那里没有明显的干扰。注意空气进入和呼出你鼻腔的过程，或者注意你的腹部在吸气时膨起、在呼气时收缩。每当你的这种“猴子心”带你去思考呼吸以外的事情时，对它说：`谢谢你，猴子`。然后轻轻地将你的注意力带回到呼吸上。


    你很可能会一次又一次地分心。不要为此感到沮馁。事实上，你发现自己被“猴子心”分心的次数越高，就越好。这项练习的意义在于注意到这些分心，并选择将注意力带回到呼吸上。


    ### 当下


    猴子心会不断地回顾过去，寻找你可能犯的错误。当它不在做这些时，它就在扫描未来，寻找危险的信号。这无疑会产生焦虑。通过关注`当下`，我们可以与所有的喧嚣保持距离，并真正获得缓解。它还让我们生活得更充实，并意识到万物都处于不断变化的状态。


    现在你正在读这句话。你可能也在想这个章节快要结束了，并纠结是该休息一下还是继续读。现在请花一点时间感受一下手中书的感觉。注意你正坐着还是躺着。察觉现在房间里的声音，或是寂静。这种注意到并关注你周围环境的简单行为能让你置身于当下。过去和未来是猴子心的领地。现在属于你，只属于你。


    你可以在任何时候练习专注——刷牙时、洗澡时或往嘴里送一勺谷物时。如果你正走在街上，试着认真观察你周围的树木、建筑和人。如果你坐在某地方，闭上眼睛听听。你会对自己听到的声音感到惊讶。更重要的是，你会注意到那些跳出来的想法，它们是多么随机，以及从你所处的刻起它们产生了多大的分心。你不需要与那些想法战斗；那只是你的猴子工作得太卖力了。只需注意到它们并让它们离开。


    当你开始在全天保持专注时，你会惊讶地发现所有让你分心的“猴子杂语”。不要气馁。感谢你的猴子，并将自己带回此时、此刻、此地。


    ### 接纳


    当你变得更擅长发现猴子的杂语时，你会发现在那些可怕的危险警告之外还有另一个主题。你会注意到评判，既有针对自己的，也有针对别人的。你的猴子可能在告诉你你应该或不应该做什么，或者说你懒惰、软弱，或者对别人说类似的话。这有什么帮助呢？一点用也没有！产生关于你`应该`是什么样子的想法只会让你感到沮丧。我在书中提出的第一点是，没有所谓的“正常”，也没有人完美。每个人都拥有一只猴子，每个人都有不同程度的焦虑，每个人也都会犯错。只有通过接纳`原本的自己`，你才能向前迈。


    接受焦虑是正常的，并且你不需要为此负责，这将让你能够对自己产生慈悲。在堆积评判和责备之前，你已经受了足够的苦。当你对一个低落的朋友充满慈悲时，会发生什么？朋友会受到鼓励。对你也是同样的道理。当你接受自己的焦虑并原谅自己拥有它时，你就开启了最强大的工具：勇气。当你能把勇气释放到问题上时，一切皆有可能！


    知道他对狗的恐惧是基于误判，给贾斯汀（Justin）带来了一些希望。也许他并不那么害怕狗了。

