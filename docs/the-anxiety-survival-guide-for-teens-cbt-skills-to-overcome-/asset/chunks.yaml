    *   **Monkey thought:** *What if your parents get divorced? Your life Your life
    will be ruined!*


    *   **Avoidant behavior:** Worry. Ask parents if everything is okay.


    *   **Monkey logic:** *Because you are worrying and checking in with your parents,
    you will be prepared if anything bad happens.*


    *   **Monkey thought:** *What if you forget something important? That will ruin
    everything!*


    *   **Avoidant behavior:** Worry. Mentally review things that you need to remember.
    Make lots of lists.


    *   **Monkey logic:** *Because you made lists and did not forget anything, nothing
    terrible happened. You saved the day!*


    *   **Monkey thought:** *You might die in a car accident!*


    *   **Avoidant behavior:** Worry. Tell whoever is driving the car to slow down.
    Look to see if other drivers on the road might be drunk.


    *   **Monkey logic:** *Because you worried and watched out for danger, you did
    not get in a car accident. You avoided catastrophe!*


    When you worry over things you’ve already taken steps to prepare for, or things
    that are beyond your control, you reward monkey logic. You are giving your monkey
    a banana. And there’s no better way to guarantee your monkey will come up with
    another anxious thought about another scary outcome! It’s the cycle of avoidance
    that keeps your worry going strong.


    ![Image](Images/9-3.jpg)


    Oh, and by the way, if the thing you are worrying about *should* actually happen,
    the monkey mind will still get a banana. Regardless of whether the worrying was
    helpful, monkey logic says, *See, I told you! Good thing you prepared yourself
    by worrying!*


    Yes, it is true that we need to prepare ourselves for threats and prevent bad
    things from happening. Anxiety can be a great heads-up that you need to do something
    about a problematic situation. But once you have done that, repeating the process
    over and over—otherwise known as worrying—is useless. All it does is feed the
    monkey mind and create more anxiety.


    ## Tools to Tame the Generalized Anxiety Monkey


    The challenge with worry is to tell the difference between anxious thoughts that
    are an important signal of a problem needing to be solved, and anxious thoughts
    that are monkey chatter. Thinking that a mosquito bite will result in West Nile
    disease is monkey chatter. Even if it were true, there is nothing that you could
    do about it in the moment.


    Here is a list of situations. Some are examples of a call to action—to either
    prevent or cope with a bad situation. Others are examples of monkey chatter—meaning
    something could go wrong but either 1) there is no way to solve the problem or
    2) you have already solved it but are still worrying about it. Read each situation
    and determine whether it is a solvable problem or monkey chatter. (The answers
    will be provided at the end.)


    *   a. You are worried that because you have not studied you may not do well on
    your history exam tomorrow.


    *   b. You worry that your parents might get a divorce.


    *   c. You have studied until midnight but you still are worried that you won’t
    do well on your test tomorrow.


    *   d. You worry that you might get the stomach flu and your weekend plans will
    be ruined.


    *   e. You worry that you did not do well in the job interview and you may not
    get the job you really wanted.


    *   f. You have sent in your college applications but you are worried that you
    won’t get into the colleges you want to.


    *   g. You remembered that you forgot your friend’s birthday and may have hurt
    her feelings.


    *   h. It is late at night and you’re worrying about the possibility that your
    boyfriend or girlfriend will break up with you.


    *   i. Your sister just got her driver’s license and you worry she might get in
    a car accident.


    *   j. Your friend is texting while driving and you worry that he might get in
    a car accident.


    Answers:


    *   a. Solvable problem. If you have not studied there is something you could
    do about that before your test the next day.


    *   b. Chatter. Whether or not this is true there is nothing you can do about
    it.


    *   c. Chatter. You have already studied, and while it may be true that you don’t
    know everything, worrying about that is not going to help.


    *   d. Chatter. How is worrying about this going to help? You either will or won’t
    get sick. There is nothing you can do about it.


    *   e. Chatter. You already had the interview. There is nothing you can do at
    this point. It is up to them to decide if they will hire you or not.


    *   f. Chatter. You already sent off your applications. There is nothing you can
    do at this point.


    *   g. Solvable problem. You could always call your friend to wish her a late
    happy birthday. If you do this but still worry about it, then it becomes chatter,
    because you did what you could and you can’t control how your friend feels.


    *   h. Chatter. It is late at night—what can you do about this now? If there is
    something going on in the relationship that needs attention you can talk with
    that person the next day.


    *   i. Chatter. While it is true that newly licensed drivers are more at risk,
    there is nothing you can do about this. Remember, everyone starts out as a newly
    licensed driver!


    *   j. Solvable problem. It is dangerous to text and drive, and you have every
    right to ask your friend to stop.


    Your own worrisome situations may not be on this list, and they may feel unique
    to you. Fortunately there are powerful tools you can use to recognize the chatter
    and tame the monkey.


    Spot the Thought


    There are three basic questions to ask yourself:


    1.  What am I afraid of?


    2.  What is the worst that could happen if this were true?


    3.  What would this mean about me, my life, or my future?


    Here are Tess’s answers:


    ![Image](Images/9-4.jpg)


    Before you go any further, take a moment to spot a thought of your own. You can
    download a “Spot the Thought” worksheet for generalized anxiety at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    Monkey Miscalculations


    When you look at things people worry about, there is usually plenty of evidence
    of that classic monkey miscalculation: over/underestimating. You can see it in
    the worries shown in the monkey logic examples earlier in this chapter.


    Being killed in a car accident is very unlikely, and not getting into college
    just because you did poorly on a test is not very likely either. To worry about
    these outcomes is to overestimate the risk of them happening.


    What about the chances of your parents getting a divorce, or that you forget an
    assignment? These are not only overestimations of danger but underestimations
    of your ability to handle it if those things did happen. Whether your monkey is
    overestimating risk or underestimating your ability to cope—or both—the result
    is the same. Your monkey tells you to *Worry! Worry a lot! It’s your only chance
    to be prepared or to prevent something bad from happening!*


    ![Image](Images/9-5.jpg)


    Here are two other monkey miscalculations commonly found with generalized worry.


    Catastrophizing


    There are lots of possible outcomes to any situation, but the monkey mind always
    assumes the worst. Naturally, this makes you feel on edge much of the time, and
    you’ll work overtime to prepare for and prevent anything bad from happening.


    Do any of these catastrophic monkey thoughts sound familiar?'
