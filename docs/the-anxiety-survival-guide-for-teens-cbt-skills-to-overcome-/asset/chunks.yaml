- fmt: '

    Nearly every experience we have has good aspects and bad aspects, but the monkey
    mind, being obsessed with looking for threats and danger, completely ignores what
    is going well and focuses only on what is going poorly. We call this `discounting
    the positive`. Examples:


    *   While giving an oral presentation, you don’t notice that most of the class
    is listening attentively. All you see is Janelle in the back, who is looking at
    her cell phone. `You are boring everyone!`

    *   You get an English paper back with an A-minus grade and several positive comments.
    Your eyes immediately go to the one suggestion for improvement. `You are hopeless
    at writing!`

    *   You invite a friend to the movies. He has other plans but he thanks you for
    the invitation. `He rejected you. You should never have dared to invite him!`

    *   You hear of a party you were not invited to. You don’t know the host very
    well and you get invited to plenty of other parties, but your monkey says, `You’re
    so unpopular!`


    Ask your monkey, `What did I do that was okay?`


    ## Labeling


    ![Image](Images/3-7.jpg)


    Also known as part-whole thinking, labeling is applying a part of yourself to
    the whole of yourself. You may label yourself with harsh judgments you would never
    dare say to a friend but freely tell yourself. For example:


    *   You get a `C` on a quiz that you expected to do better on. `You’re so stupid.`

    *   You miss a shot in a basketball game. `What an idiot! You should never shoot
    from this range.`

    *   You tell a joke that offends someone. `You are such a fool! You should keep
    your mouth shut!`

    *   You get beaten in a class election by a dozen votes. `You are such a loser!`


    Ask yourself, `Does this label apply to me all the time in all situations?`


    ## Mind Reading


    ![Image](Images/3-8.jpg)


    The monkey mind is so sensitive to criticism that it imagines other people are
    thinking critical thoughts about you!


    *   You’re walking down the hallway with a new hairdo. `Everybody is staring at
    your hair in horror!`

    *   You’re eating alone at a sandwich shop. `It looks like you have no friends.
    The guys behind the counter think you’re a loser!`

    *   A friend is checking her texts during your conversation. `She thinks you’re
    boring!`


    If you think your monkey is reading minds, ask yourself, `What evidence do I have
    that this is what people are actually thinking?`


    ## Perfectionism


    ![Image](Images/3-9.jpg)


    You must perform flawlessly, every time, all the time. Anything less isn’t good
    enough and will leave you vulnerable to criticism and other danger. So says the
    monkey mind.


    *   You’re looking at a supermodel in a magazine. `You need to lose five pounds
    so you can look like that.`

    *   After a ten-mile run, you realize you are fifteen seconds off yesterday’s
    time. `You better do another mile. You don’t deserve to rest.`

    *   You got an `A` in `Biology`, but your friend got an `A-plus`. `You should
    have gotten up early this morning to study!`

    *   During a presentation in English your voice shakes and you stumble on your
    words a few times. `That was unacceptable! And the whole class could see that
    you were anxious!`

    *   You just spent three hours on a take-home essay after the teacher said it
    shouldn’t take longer than an hour. Even so, you don’t feel like it is as good
    as it could or should be. And you still have your math and Spanish homework to
    do! `You need to take off school tomorrow so you can spend all day catching up.`


    Not sure if you are a perfectionist? Ask yourself, `Am I expecting more of myself
    than I would expect of someone else?`


    ## Intolerance of Uncertainty


    ![Image](Images/3-a.jpg)


    No matter how the odds favor a positive result, if there is even a 1 percent chance
    that things could go wrong, the monkey mind cannot rest.


    *   You hear a siren. `What if that’s an ambulance taking your mom to the hospital?`

    *   You need to use a public toilet. `What if you can catch AIDS from a toilet
    seat?`

    *   You have a pain in your gut. This could be stomach cancer.`

    *   Your friend just picked you up at your house. `What if you left the curling
    iron on and the house burns down?`


    Ask yourself, `What is the cost I am paying to eliminate all risk from my life?`


    Now let’s take another look at Justin’s anxious thoughts, this time looking for
    monkey miscalculations.


    *   `What if the dog gets off the leash?`

    *   `That dog might attack me.`

    *   `I am such a wimp, needing my parents to drive me!`


    Justin was `catastrophizing` by jumping to the conclusion that this dog might
    get off its leash and attack him. He was also `discounting the positive`. He did
    not consider that this was a dog he had skated by many times before and it had
    not shown any signs of aggression. Justin was `labeling` by calling himself a
    wimp. He took plenty of risks—in fact, he was one of the more daring of his friends
    when it came to skateboarding. Justin was probably `not tolerating uncertainty`
    either. He was unwilling to take the chance that other dogs would attack him.


    Identifying the monkey miscalculations in your anxious thoughts helps you think
    more objectively. If the thought is inaccurate and there is no actual danger,
    then the anxiety that thought triggers is a false alarm.


    ## Alternative Thoughts


    This tool is really the second half of the “Spot the Thought” exercise. Here you’ll
    respond to the anxious thoughts you now know are monkey chatter with some new
    ideas. These alternative thoughts will lay the groundwork for a new way to live.


    Here are some of Justin’s alternative thoughts:


    ![Image](Images/3-b.jpg)


    Now Justin had a choice. He had two ways to think about the problem, and one offered
    lot more hope than the other.


    If you haven’t already, try the Spot the Thought and Alternative Thoughts exercises
    for yourself. Think back to some situations that made you anxious this week. Download
    the worksheets available at `http://www.newharinger.com/32431`www.newharinger.com/32431`,
    or just grab a paper and pencil and get to work.


    At this point your monkey mind is probably screeching in protest over this close
    examination. It doesn’t like you second-guessing its warnings (even though they
    are wild guesses to begin with). It will be a struggle at first, but things will
    get better. After using these tools a few times on paper, you will be able to
    ask and answer these questions in your head whenever the need arises.


    What we have learned so far about the monkey mind is that it is always chattering,
    and if we are not careful, it will automatically drive our feelings and behavior.
    When you pay attention to the chatter, you are rewarding the monkey. It loves
    attention. For the monkey, attention is as good as a banana. The problem is, the
    more you feed the monkey the more it will chatter.


    ## Mindfulness Tools


    ![Image](Images/3-c.jpg)


    Mindfulness practice is designed to help you take your attention away from your
    monkey mind. Mindfulness has been around for at least twenty-five hundred years
    and is used more and more in our modern world with great benefit. There are three
    basic parts to it, each of which can be helpful in spotting your monkey.


    ![Image](Images/3-d.jpg)


    ### Focused Attention


    As I’ve pointed out, it takes no effort to focus on the monkey mind’s chatter.
    The chatter is so distracting and automatic that we don’t even know we are being
    hijacked by our monkey mind. You can reduce the chatter and the effect it has
    on you by choosing where to place your attention.

