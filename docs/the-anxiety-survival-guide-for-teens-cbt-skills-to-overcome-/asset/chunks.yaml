    unlikely), your monkey takes full credit. Monkey logic says, *Because you worried
    about West Nile disease, you didn’t get West Nile disease*.


    Let’s take a look at the role of the monkey mind in other examples of generalized
    worry.


    *   **Monkey thought:** *What if your headaches are caused by a brain tumor?*


    *   **Avoidant behavior:** Worry. Ask to see a doctor. Look up other symptoms
    of brain tumors on the Internet.


    *   **Monkey logic:** *Because you are keeping an eye on things, you are less
