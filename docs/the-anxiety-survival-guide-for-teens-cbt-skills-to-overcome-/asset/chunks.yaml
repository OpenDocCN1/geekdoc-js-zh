  trans: '


    我们几乎每一种经历都有好面和坏面，但“猴子大脑”执迷于寻找威胁和危险，它完全忽略了进展顺利的地方，只关注不顺利的地方。我们将此称为`贬低积极因素`。例如：


    *   在进行口头报告时，你没有注意到班上大部分同学都在认真听。你看到的只有后排的 Janelle，她正在看手机。`你让大家都很无聊！`

    *   你收回了一份英语卷，得到了 A- 的级分和几条正面评语。你的目光立刻落在了那一条改进建议上。`你写作简直没救了！`

    *   你邀请朋友去看电影。他有其他安排，但他感谢你的邀请。`他拒绝了你。你根本不该敢邀请他！`

    *   你听到一个你没受邀请的派对。你并不熟悉主人，而且你受过很多其他派对，但你的猴子说：`你太不受欢迎了！`


    问问你的猴子：`我做了哪些还不错的事？`


    ## 标签化 (Labeling)


    ![Image](img/3-7.jpg)


    也被称为“局部整体思维”，标签化是将自我的部分应用于自我的整体。你可能会给自己贴上严厉的评判，这些评判是你永远不敢对朋友说的，但会毫无地对自己说。例如：


    *   你在一场本以为能表现更好的测验中得了一个 `C`。`你真愚蠢。`

    *   你在篮球赛中投丢了一个篮球。`真像个白痴！你永远不该从这个距离投篮。`

    *   你讲了一个冒犯某人的笑话。`你真是个大傻瓜！你应该闭嘴！`

    *   你在班级选举中以十票之差落选了。`你真是个失败者！`


    问问自己：`这个标签在所有情况下、一直都适用于我吗？`


    ## 读心术 (Mind Reading)


    ![Image](img/3-8.jpg)


    猴子大脑对批评如此敏感，以至于它会想象别人在对你进行批判性的思考！


    *   你留着新发型走在走廊上。`大家都在惊恐地盯着你的头发！`

    *   你独自在三明治店吃东西。`看起来你没有朋友。柜台后的那些男的觉得你是个失败者！`

    *   和你聊天时，一个朋友在看短信。`她觉得你很无聊！`


    如果你认为你的猴子在读心，问问自己：`我有什么证据能证明这真的是人们在想的？`


    ## 完美主义 (Perfectionism)


    ![Image](img/3-9.jpg)


    你必须表现得完美无缺，每一次，任何时候。任何低于此的标准都不够好，会让你暴露在批评和其他危险之中。猴子大脑是这么说的。


    *   你正看着杂志上的一个超模。`你需要减掉五磅才能像她那样漂亮。`

    *   在跑了十英里后，你发现自己比昨天慢了 15 秒。`你最好再跑一英里。你不配休息。`

    *   你在`生物`课上得了 `A`，但你的朋友得了 `A-plus`。`你今天早上本应该早起复学习的！`

    *   在一次英语演讲期间，你的声音在颤抖，并且几次结巴。`这不可接受！全班都能看出你很焦虑！`

    *   你刚刚花了三小时写了一篇带回家的论文，而老师说这不应该超过一小时。尽管如此，你仍然觉得它没有达到可能或应该达到的水平。你还有数学和西班牙语作业要做！`你明天需要请假，这样你可以花一整天赶进度。`


    不确定自己是否是完美主义者？问问自己：`我对自己要求的期望是否超过了我对他人的期望？`


    ## 对不确定性的不耐 (Intolerance of Uncertainty)


    ![Image](img/3-a.jpg)


    无论机会有多倾向于积极结果，只要有 1% 的概率可能出问题，猴子大脑就无法平静。


    *   你听到警报声。`万一那是救护车送你妈妈去医院怎么办？`

    *   你需要使用公共厕所。`万一从马桶圈上得艾滋怎么办？`

    *   你肚子疼。`这可能是胃癌。`

    *   你的朋友刚来家里接你。`万一我忘了关卷发导致房子烧了怎么办？`


    问问自己：`为了消除生活中所有的风险，我付出的代价是什么？`


    现在让我们再次看看 Justin 的焦虑想法，这次我们寻找猴子的计算失误。


    *   `万一狗跑了绳子怎么办？`

    *   `那只狗可能会攻击我。`

    *   `我真是一个胆小鬼，竟然需要父母开车送我！`


    Justin 通过跳跃到这只狗可能会脱绳并攻击他的结论，是在进行`灾难化`。他比在`贬低积极因素`。他没有考虑到这是一只他以前见过很多次的狗，而且它没有表现出任何攻击性。Justin
    通过叫自己胆小鬼在进行`标签化`。他承担了许多风险——事实上，在滑板方面，他是朋友中最大胆的之一。Justin 可能也`无法忍受不确定`。他不愿意承担其他狗攻击他的机会。


    识别你焦虑想法中的猴子计算失误有助于你更客观地思考。如果想法是不准确的且没有实际危险，那么该想法引发的焦虑就是错误的警报。


    ## 替代想法 (Alternative Thoughts)


    这个工具实际上是“识别想法”的后半部分。在这里，你将用新的想法来回应那些你现在知道是焦虑的想法。这些替代想法将为新的生活方式奠定基础。


    这是 Justin 的一些替代想法：


    ![Image](img/3-b.jpg)


    现在 Justin 有了选择。对于这个问题有两种思考方式，一种比另一种提供了更多的希望。


    如果你还没有尝试，请为你尝试“识别想法”和“替代想法”练习。回想本周让你感到焦虑的情况。在 `http://www.newaringer.com/32431`www.newaringer.com/32431
    下载工作表，或者直接拿张纸笔开始工作。


    到此时，你的猴子大脑可能会对这种严密的检查产生抗议。它不喜欢你质疑它的警告（尽管它们最初只是猜想）。起初会很挣，但情况会好起来的。在纸上使用这些工具几次后，你可以在需要在大脑中提问并回答这些问题。


    我们到目前为止关于猴子大脑学到的是它一直在乱叫，如果我们不小心，它会自动驱动我们的情感和行为。当你关注这些噪音时，你是在奖励猴子。它喜欢注意力。对于猴子来说，注意力就像香蕉一样。问题是，你越给猴子提供注意力，它叫得越欢。


    ## 正念工具 (Mindfulness Tools)


    ![Image](img/3-c.jpg)


    正念练习旨在帮助你将注意力从猴子大脑移开。正念已经存在了至少两千年，并在我们的现代世界中得到了广泛的应用并获益巨大。它有三个基本部分，每个部分对发现你的猴子都有帮助。


    ![Image](img/3-d.jpg)


    ### 专注注意力 (Focused Attention)


    正如我指出的，关注猴子大脑的噪音是不费吹力的。这种噪音是如此分散和自动，以至于我们甚至不知道自己被猴子大脑劫持了。通过选择放置注意力的地方，你可以减少噪音及其对你的影响。


