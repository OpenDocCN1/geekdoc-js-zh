    There are anxious teens all around you. Studies show that anxiety is the most
    common mental health problem in America, affecting nearly one in five people.
    If you are sitting in a classroom of thirty students, chances are that at least
    a row of you are suffering from one of the seven most common varieties of anxiety:
    social anxiety, generalized anxiety, separation anxiety, obsessive-compulsive
    disorder, specific phobias, panic, and agoraphobia. The reason you are unaware
    of your anxious peers is that they are just as good at hiding their anxiety as
    you are.


    You are not alone, and you are also not to blame. Scientists who study DNA have
    isolated a number of genes associated with heightened or lowered sensitivity to
    danger, including genes that have been nicknamed the “warrior/worrier gene” and
    the “risk-taking gene.” Your present level of anxiety is partially inherited.
    In fact, if you have a parent or sibling with an anxiety disorder you are four
    times as likely to suffer from anxiety yourself.


    In addition to your genetic makeup, your level of anxiety can be influenced by
    a traumatic life experience or your parents’ anxious behavior. So blaming yourself
    for your anxiety makes about as much sense as blaming yourself for the color of
    your eyes, things that have happened to you, or the family you were born into.
    You can’t change your genetics, your life experience, or your parents. These are
    the cards you were dealt. But will you have to suffer with anxiety for the rest
    of your life, missing out on things you want to do? Are millions of anxious teens
    predestined to become anxious adults? Absolutely not! You *can* learn how to manage
    your anxiety, so that you can do the things that are important to you. This book
    will show you how.


    Here is a brief overview of the different types of anxiety this book addresses.
    You can also download a brief quiz that will help you identify which types of
    anxiety you suffer from at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).
    (See the very back of this book for more information about downloads.) Don’t be
    surprised if there is more than one; that’s very common. Later chapters in this
    book will focus in more detail on how to deal with your specific types of anxiety.


    ## Generalized Anxiety


    - Frequent worry about school, your health or the health of your loved ones, or
    bad things happening in the world

    - Feeling tense or restless, having difficulty concentrating, or having trouble
    falling asleep at night due to worry

    - Frequent stomachaches, headaches, or muscle tension


    ## Phobias


    - Fear and avoidance of elevators, heights, storms, or water

    - Fear of certain animals or insects

    - Unreasonable fear of needles, blood, choking, or vomiting


    ## Social Anxiety


    - Uncomfortable shyness or fear of doing or saying something embarrassing

    - Panic when having to give an oral presentation or be the center of attention

    - Difficulty starting or joining in conversations with others


    ## Panic Attacks


    - Feeling frightened suddenly or for no apparent reason

    - Racing heart, trouble breathing, or dizziness

    - Strange, detached feeling, as if things are not real


    ## Agoraphobia


    - Avoidance or fear of going into situations in which you have panicked before

    - Fear of being trapped in places like cars and planes, or fear of going into
    tunnels or over bridges

    - Fear of suddenly having to go to the bathroom but being trapped or far away


    ## Obsessive-Compulsive Disorder


    - Frequent intrusive thoughts

    - Fear of harming others

    - Repetitive behaviors


    ## Separation Anxiety


    - Fear of- being away from home

    - Worry about something bad happening to loved ones

    - Difficulty leaving home


    ## Part 1


    ![Image](Images/1-1)


    # The Monkey Mind


    ## Staying Alive


    One summer day thousand years ago, three hungry hunters were following reindeer
    tracks across a rocky. They weren’t following the trail very long, however, before
    they spotted several tiger prints. The first hunter grunted and kept going, apparently
    unconcerned. The second hunter spun around and ran back to camp. The third hunter
    wiped his brow and took a few deep breaths. He was anxious, but he was also hungry.
    After studying the direction of the tracks, he headed off in the opposite direction.
    Shortly afterward, he speared a deer. He was the hero in the tales of the day’s
    hunt told by the fire that night.


