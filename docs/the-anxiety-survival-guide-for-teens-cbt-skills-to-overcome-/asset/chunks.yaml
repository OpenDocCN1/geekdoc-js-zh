    saber-othed tiger on a prehistoric plain or a car running a red light, the human
    reaction is instantaneous. Our brains are hardwired for survival. Your brain’s
    number one job is staying alive.


    Your brain tells your body when to relax and when to respond. When there is danger
    your nervous system acts in an instant, before you have time to form thoughts.
    It’s called the *fight-or-flight response*, and we share it not only with deer
    but with all creatures that have a brain.


