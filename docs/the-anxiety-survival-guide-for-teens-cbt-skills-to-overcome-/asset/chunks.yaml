    Mastering anxiety is like learning a sport. You might read about how the game
    is played and what you need to practice to get good at it, and yet still need
    a coach. Therapists are like coaches. They work with you to develop the skills
    you need and give you encouragement to practice and follow through with challenges
    that are especially difficult.


    This book is based on cognitive behavioral therapy (`CBT`), acceptance and commitment
    therapy (`ACT`), and mindfulness. `CBT` focuses on the relationship between thoughts,
    feelings, and actions. A `CBT` therapist will help you identify and challenge
    the monkey thoughts that are making you more anxious and change the behaviors
    that are making the problem worse. `ACT` is a type of `CBT` that focuses more
    on changing behavior and less on changing thoughts. The objective in `ACT` is
    to identify your values and goals and commit to actions that will lead you to
    a more rich and meaningful life. “Mindfulness” is a broad term for ancient tools
    for self-discovery and well-being that are becoming increasingly relevant today.


    `CBT` and `ACT` are very effective for all anxiety problems. If you decide to
    see a therapist, look for one who is trained in `CBT` or `ACT`, so that she or
    he can coach you to use the skills you have learned in this book.


    ## What to Ask a Therapist


    You will want to feel comfortable with the therapist you see. You have every right
    to ask questions to make sure the therapist you choose will be a good fit with
    you and has experience in treating the issues you want to work on.


    Here is a list of questions that are good to ask in order to find a therapist
    who can help you:


    *   What is your training in cognitive behavioral therapy? (Therapists will ideally
    be able to talk about workshops they have taken, experienced clinicians they have
    trained with, organizations they belong to, and certificates they hold in `CBT`.)

    *   What is your training and background in treating anxiety? (Make sure to ask
    about the specific type of anxiety you have. Sometimes therapists have more experience
    with one kind of anxiety, such as `OCD`, but not as much with another, like panic.)

    *   How much of your current practice involves treating anxiety? (Once again,
    ask about your specific type.)

    *   Do you feel you have been effective in treating anxiety?

    *   What techniques do you use to treat anxiety? (Do these techniques help you
    identify unhelpful thoughts and steps to take to help you face your fears?)

    *   If necessary, are you willing to leave your office to help me face my fears?
    (Some of your challenges may require you and your therapist to enter into specific,
    anxiety-provoking situations.)


    ## About Medication


    If you are experiencing extreme anxiety that is getting in the way of your functioning—such
    as getting out of the house and going to school—or doing the exercises in this
    book, you may want to talk to your doctor about medications. Those who prescribe
    medication for anxiety are usually family doctors, general practitioners, or psychiatrists
    (medical doctors who specialize in mental health).


    Of those who try medication, people who combine medication with `CBT` obtain the
    best results. This makes sense. The medication can help lower your overall anxiety,
    while the therapy teaches you skills to master the anxiety now and in the long
    run. That way, when you stop taking medication, you will be much less likely to
    experience a return of your anxiety. If you rely just on medication, when you
    stop taking it it’s very likely your anxiety will come back.


    There are basically two types of medication for treating anxiety: antidepressants
    and benzodiazepines.


    ### Antidepressants


    You may be wondering why antidepressants are prescribed for anxiety. The reason
    is that the way the drug works in your brain to decrease depression works to decrease
    anxiety as well. Also, as I mentioned before, it is not uncommon for people who
    have anxiety to have depression too. These medications can help with both problems.


    The most common type of antidepressants is called selective serotonin reuptake
    inhibitors, or `SSRIs`. Serotonin is a brain chemical that influences mood, and
    these drugs work by increasing serotonin levels. They also work on other chemicals
    in the brain that affect mood. Common `SSRIs` include `Prozac`, `Paxil`, `Celexa`,
    `Zoloft`, `Lexapro`, and `Luvox`. Other antidepressants that are sometimes used
    are `Effexor`, `Cymbalta`, `Serzone`, and `Remeron`.


    `SSRIs` have pros and cons.


    **Pros:**

    *   Most people find it easy to take pills.

    *   These medications are not addictive.

    *   Because you take these medications every day, as opposed to just when you
    feel anxious, they are less likely to be used as a way to avoid anxiety.


    **Cons:**

    *   There can be side effects. The most common are nausea, diarrhea, constipation,
    drowsiness, jitteriness, dry mouth, headaches, shakiness, and sexual effects such
    as decreased sex drive or difficulty having an orgasm. Many of these side effects
    decrease over time.

    *   These medications can take from four to eight weeks to have a noticeable effect.

    *   Going off the medication can cause uncomfortable symptoms, such as dizziness,
    nausea, difficulty sleeping, or flu-like symptoms. If you decrease the dose slowly
    under a doctor’s direction when going off these medications, these effects will
    be less intense.

    *   When you stop taking these medications, anxiety symptoms usually come back.


    ### Benzodiazepines


    Benzodiazepines are relaxants that work very quickly in the body and brain. People
    usually take them when they become anxious or panicky, or when they are going
    into situations that make them anxious.


    Common benzodiazepines include `Xanax`, `Valium`, `Ativan`, and `Klonopin`.


    There are pros and cons to taking benzodiazepines.


    **Pros:**

    *   They are quick-acting.

    *   They can be taken as needed.

    *   They are not very expensive.

    *   Most people find it easy to take a pill.


    **Cons:**

    *   There can be side effects, such as drowsiness, light-headedness, confusion,
    and depression.

    *   They can be deadly if you mix them with alcohol.

    *   They can be physically addicting.

    *   You can become dependent on them and use them as a way to avoid your anxiety.
    They can get in the way of facing your fears and gaining confidence in yourself.


    **Jennifer Shannon, LMFT**, is author of *The Shyness and Social Anxiety Workbook
    for Teens* and cofounder of the Santa Rosa Center for Cognitive-Behavioral Therapy
    in Santa Rosa, CA. She is a diplomate of the Academy of Cognitive Therapy.


    Illustrator **Doug Shannon** is a freelance cartoonist.

