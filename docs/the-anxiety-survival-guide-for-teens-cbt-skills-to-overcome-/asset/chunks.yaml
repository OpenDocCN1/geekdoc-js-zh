    * They think you’re a loser.

    * She thinks you were showing off.

    * They notice you are nervous and they think you are weird and weak.


    If your monkey is mind reading, ask yourself, “What evidence do I have that this
    is what people are thinking about me?” Asking and answering this question can
    help you disengage from the monkey’s chatter and get a better perspective.


    ## Catastrophizing


    Rather than considering all possible outcomes, your monkey takes a giant leap
    to the worst thing that could possibly happen. For example:


    * If people notice you are nervous they will tell others and everyone will think
    you’re weird.

    * People will point at you or laugh at you.

    * You’ll freeze up and not be able to think of something to say in a conversation.

    * If you have to give an oral presentation you may faint or pass out.


    Ask yourself, “What is most likely to happen? How could I cope with that?”


    ## Perfectionism


    You must perform flawlessly, every time, all the time. Anything less isn’t good
    enough and will leave you vulnerable to criticism and serious rejection. For example:


    * You must avoid stumbling over a word or else people will think you are nervous.

    * You should never answer a question wrong in class or else people will think
    you are stupid.

    * You need to always know what to say or else people will think you are awkward.

    * You should always remember people’s names or else people will think you are
    insensitive or don’t care about them.

    * You must look calm, confident, and relaxed, or else people will think you are
    weird.

    * You should always be interesting or else people will think you are boring.


    Ask yourself, “Am I expecting more of myself than I would of others?”


    ## Labeling


    Your monkey looks at one part of what you might say or do and decides that it
    defines you as a person. Labels can be harsh judgments you freely use on yourself
    but would never dream of saying to a friend. For example:


    * You asked a dumb question. You are such an idiot!

    * You forgot someone’s name. You are such a dope!

    * You sweated right through your shirt. You are so disgusting!

    * You could not think of what to say. You are so dumb!

    * That was awkward. You are so weird!


    If you think your monkey is labeling, ask yourself, “Does this word apply to me
    all the time, in every situation?”


    ## Intolerance of Uncertainty


    Since you never really know what others are thinking, there is always lots of
    room for uncertainty. But if there is even a 1 percent chance that someone might
    judge you, your monkey concludes “It’s not worth it”.


    * What if you say something offensive?

    * What if someone laughs at you?

    * What if someone notices you are sweaty and thinks you are gross?


    If your monkey mind is making this miscalculation you can ask yourself, “Is it
    always better to be safe than sorry?” By never taking any chances you are guaranteeing
    that you will never get what you want.


    ## Alternative Thoughts


    Identifying the miscalculations in these thoughts helps you see the difference
    between you and your monkey mind. Assessing risk is too important a job to leave
    to that primitive part of your brain. Stepping back from your monkey chatter opens
    up space for new ways of thinking.


    Jarod had been listening to his monkey mind since junior high, and it was hard
    for him to believe there was any other way to think. But once he began questioning
    it, he was able to come up with his own alternative thoughts.


    * **Monkey thought:** If you pause in the conversation or stumble on a word she
    will think you are stupid.

    * **Jarod’s alternative thought:** That’s mind reading! I have no way of knowing
    what she will think.

    * **Monkey thought:** She will tell all her friends how weird you are.

    * **Jarod’s alternative thought:** That’s catastrophizing. I would have to say
    something really strange for it to be worthy of gossip, and that’s unlikely.

    * **Monkey thought:** To initiate a conversation, you’d have to say something
    interesting.

    * **Jarod’s alternative thought:** I don’t have to be perfect. If someone started
    a conversation with me, I would like that and would not be concerned about whether
    the person sounded interesting or not.

    * **Monkey thought:** You may say something offensive; it’s not worth the risk.

    * **Jarod’s alternative thought:** If I don’t say anything at all I have no chance
    of getting to know her, so it is worth the risk.


    Alternative thoughts give you something else to focus on besides your monkey’s
    chatter. When you focus on your alternative thoughts you deny your monkey the
    attention it is used to. This is the first step toward taming your monkey.


    You can download an Alternative Thoughts worksheet at `http://www.newharbinger.com/32431`.


    ## Tools to Rule the Social Anxiety Monkey


    Jarod felt very encouraged by his alternative thoughts. When he thought about
    being spontaneous with other people—saying what he was thinking without planning
    every word—he felt that he could do it. He decided to test his new attitude the
    next day at school and see what happened.


    Spotting your monkey and having alternative thoughts to replace your anxious ones
    can give you courage to approach situations that you have been avoiding. But once
    you are in those situations you make anxious, you have to feel it.


    ### Life Compass


    Facing situations that you have been avoiding will take courage. To unleash your
    full power you will need an inspiring goal, one important to you. Your goal could
    be mastering a specific situation like going to prom; or it could be a human value,
    like being authentic in interactions. That is up to you.


    Jarod made a list of things that were important to him he was missing out on.


    ![Image](6-4.jpg)


    These things were Jarod’s true north on his compass, and he was determined not
    to let his monkey point south.


    You can download a Life Compass worksheet at `http://www.newharbinger.com/32431`.


    ### The Challenge Ladder


    Whatever your goal is, you can reach it if you approach it one step at a time.
    Picture your goal at the top of a ladder. Each rung of the ladder will be a specific
    challenge designed by you to bring you closer to your goal.


    When Jarod asked himself what he wanted at the top of his ladder, the answer was
    clear: he wanted to be spontaneous with people, to be able to say what he was
    thinking and feeling. There were two specific situations he’d been avoiding because
    he’d been afraid to do that, and they were important enough to him that he was
    ready to fight for them.


    *Jarod thought he would begin working on starting or joining conversations because
    he figured if he could do this, it would also help him move up to asking someone
    on a date. He decided that his first ladder would be totally devoted to starting
    or joining conversations.*


    Making a ladder for yourself can be tricky because there are so many variables.
    For social anxiety you can reduce them to three W’s: who, what, and where.


    Start with the following question: Who are the people you’ve been avoiding? Rate
    each one for scariness. Then, come up with a few options for what you might do
    with the people you’ve listed, and where. Rate the scariness of these options
    too. The “Who, What, Where” list Jarod made looked like this:


    ![Image](6-5.jpg)

