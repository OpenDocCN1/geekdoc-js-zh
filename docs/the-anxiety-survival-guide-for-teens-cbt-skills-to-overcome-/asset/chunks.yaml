    定期进行这项练习最好的处在于，每当你的“猴子脑”在整天开始大吵喧闹时，你可以坚定地告诉它，你会给予它全部注意力，但仅限于“担心时间”。尽力继续做你当时正在做的事情，除了担心以外的。你甚至可以将担心的念头写下来，这样在担心时间时就不会忘记要担心什么。


    ![Image](img/9-8.jpg)


    记住，担心时间像所有的努力一样，需要需要律的。你需要承诺每天抽出固定时间并付诸行动。在观察到变化之前，你可能需要多次练习。但通过练习，你会发现自己掌控能力越来越强，而那只小猴子也会变得更容易被忽视。通过控制担心的何时以及如何担心，你剥夺了小猴子通常能获得的奖励。*今天没有香蕉，抱歉！*
    这你驯服那只小动物的方法。


    你可以从 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431) 下载“担心时间”工作表。


    # 放松反应


    泛性焦虑会给身体带来巨大的压力。每当你把猴子的喋叫视为真实危险的信号时，你就会触发“战斗或逃跑反应”。


    当战斗或逃跑反应被激活时，你的心跳会加快，肌肉紧张，胃部停止消化，以便让更多能量流向大肌肉。如果你真的是在用身体逃避剑齿虎或保护自己免受欺凌者的伤害，那是好的。但患有泛性焦虑的青少年所担心的事情并不会让他们陷入紧迫危险。你不会用大肌肉去战斗或逃避这些事情，因此你无法获得任何释放。


    持续的担心和战斗或逃跑反应会产生大量的肌肉紧张，导致头痛和身体酸痛。你的胃可能会打结，引起腹痛或腹泻。心跳过快以及身体一直处于高度警觉状态会导致神经衰竭。你可能一直感到疲劳，并且入睡困难。


    你观察过猫看到狗时的样子吗？猫会弓起背，毛发竖起来，发出嘶嘶声。一旦狗消失在视线，猫就会躺回阳光下，伸展四肢，打呼噜噜。


    ![Image](img/9-9.jpg)


    猫所自然而自动完成的行为，是在威胁过去后让自己恢复正常。当狗出现时，战斗或逃跑反应被激活了。当狗消失后，另一种反应被激活了。这被称为*放松反应*。它和战斗或逃跑反应一样强大，且同样必要。


    如果猫也会患泛性焦虑，它在狗离开后就不会再次伸展身体打呼噜。相反，它会不断预测可能出现的下一只狗。它会像你一样，一直处于担心和紧张的状态，并且无法放松。


    ![Image](img/9-b.jpg)


    幸运的是，你也有放松反应。它没有像应该发生的那样被激活，因为你的担心总是在触发战斗或逃跑反应。但你可以训练你的身体来激活这种反应，并学会真正的放松。


    ![Image](img/9-a.jpg)


    # 金球


    要做到这一点，请坐在舒服的地方并闭上眼睛。深呼吸几次。想象你面前有一个金色的光球。这个球代表了你的和平与冷静。当你吸气时，想象光进入你的身体，让你充满温暖。当你呼气时，想象任何紧张或担心离开你的身体并进入金球。


    重复这个过程几分钟，直到你感到放松为止。如果你的思想游离了，请轻轻地将注意力回到金球和你的呼吸上。

