    `Jarod had always been confident and outgoing until ninth grade, when he started
    to feel self-conscious and shy. One day he was telling a joke to a group of friends
    and one of them took offense, saying the joke was racist. Jarod felt humiliated
    and ashamed. After that he started giving more thought to what he was going to
    say before he said it. He wanted to make certain he would not offend anyone in
    normal conversations. Because he needed to plan every word he spoke he fell behind
    in conversations, becoming more and more quiet. By the time he was in high school
    the only way he felt he could be himself was if he drank alcohol at parties. But
    even then he often woke up the next day thinking about things he had said or how
    he had acted the night before, always with the same sense of shame.`


    Jarod has social anxiety—the fear of doing or saying something that would cause
    others to ridicule or reject him, resulting in feelings of embarrassment, humiliation,
    and shame. Social anxiety is the most common type of anxiety, affecting one in
    twenty teens and adults. Many teens with social anxiety have been shy their whole
    lives; others, like `Jarod`, were outgoing as children but became shy or socially
    anxious during middle school or high school.


    Here is a list of common situations that make many teens particularly anxious.
    Can you relate to any of them?


    *   Starting or maintaining conversations

    *   Answering questions in class

    *   Asking someone on a date

    *   Asking a teacher a question or for help

    *   Attending parties, dances, or other social activities

    *   Blushing, shaking, sweating, or showing other signs of anxiety

