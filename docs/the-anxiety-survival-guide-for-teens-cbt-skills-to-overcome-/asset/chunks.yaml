  trans: '

    这里有几个工具可以帮助你面对焦虑并掌控你的生活。使用其中一个或两者都行，让你那只讨讨厌的猴子知道谁才是老大。


    ## 生活指南针


    ![Image](img/4-3.jpg)


    因为焦虑，你错过了什么？约会？旅行？社交活动？你是否花费了大量时间在担心、反复检查某事或进行其他的仪式活动上？拿出你的生活指南针，问问你自己你想去哪里。如果由你的猴子主导，你总是会向南走，走向安全区。试着寻找你真正的“真北”。


    帮助自己找到真北的一个极佳方法是写下所有你因为回避引起焦虑的事而错过的事情。以下是贾汀（Justin）想出的：


    ![Image](img/4-4.jpg)


    贾汀写下了所有他因为害怕狗而错过的事情。包括滑滑板时的那种快感，以及和朋友在滑板公园聚会的乐趣。他还错过了体育锻炼。但有一件错过的事情让他尤为突出：贾汀非常讨厌依赖父母开车接他。他希望能再次感到自由，能够在他自己选择的任何时间、任何地方通行。放弃独立性对贾汀来说是底线；他根本无法想象自己继续那样生活。独立是他非常看重的东西，以至于他决定为了拥有它而面对一些不适。


    明智的决定。即使恐惧也面对挑战并度过这段经历，这才是真正远离你的“猴子大脑”并获得掌控权的方法。贾汀将向自己证明，他的焦虑想法确实是误判，他的焦虑是基于虚假的警报，而且在面对焦虑时他是可以应对的。他将感受到掌控自己命运的力量。


    你呢？你想要什么却被焦虑阻碍了？拿上铅笔和纸，列一份你自己的清单。或者使用 `http://www.newharbinger.com/32431` 上的生活指南针表格。


    对于我们大多数人来说，允许自己感受追求目标时随之而来的焦虑是一个新观念。我们回避焦虑已经太久了，以至于接受焦虑的想法本身听起来就像疯了一样，而实际感受它听起来又让人无从下手。诚然，这并不容易。就像任何值得做的事情一样，这需要练习。但就像任何困难的事情一样，你可以通过小步骤来完成。


    ## 挑战阶梯


    想象有一个梯子，顶端是你想要的生活。这将会是你的梯子，且只属于你。无论你的目标是离开家上大学，还是仅仅是出门时不反复检查六次背包，都没有区别。重点是朝着你的方向走，而不是你猴子的方向。


    ![Image](img/4-5.jpg)


    在每一级台阶上，你都会为自己设置一个挑战，每一个都比下面一个稍微大一点、更可怕一点。当你应对每一个挑战时，你将变得更加强大，并更擅长将焦虑仅仅视为一种感觉，而不是一种应该阻碍你走向你想去的地方的东西。


    让我们来看看贾汀是如何构建他的挑战阶梯的。重要的是，他的第一级要有足够的挑战性来触发他的猴子警报，但又不至于挑战性大到不愿意去做。


    贾汀有一个朋友有一只叫查理（Charlie）的狗。查理是一只小狗，贾汀猜如果它系着牵绳，他可以应付和它在一起呆五分钟。这听起来很容易，但贾汀从想到这件事时感到的焦虑中看出，这可能比听起来要困难得多。无论如何，重点不是进行戏剧性的飞跃，而是迈出第一步。我们从小小的挑战中学习，而且它们与更高阶梯上的大挑战同样重要，因为它们为后者的挑战做了准备。


    一旦贾汀有了那个起点，想象后续几级稍微可怕一点的挑战就不太难了——比如摸摸查理，或者解开它的牵绳。随着他在每个挑战中加入更多引发焦虑的变量，他发现自己正越来越接近最终目标——至少在纸面上是这样。当他完成后，他的梯子看起来像这样：


    ![Image](img/4-6.jpg)


    每一级台阶都有一个挑战，会比下面的一级引起多一点焦虑——并带给他多一点独立性。完成每一个挑战将帮助贾汀离他的猴子的喋杂更远一点，并对他自己的替代性想法产生多一点信心：`狗挣牵绳并攻击我的可能性非常小`。


    每种类型的焦虑都有其特定的挑战，所以在在你读完与你最相关的章节之前，先急着建立自己的阶梯。（例如在第 6 章中，我将更详细介绍像贾汀那样的特定恐惧症。）现在，让我们跟随贾汀迈出他尝试性的一步。


    毫不意外的是，贾汀的猴子不喜欢这个挑战阶梯，并对此直言不讳。“你疯了吗？呜！小狗也会咬人的！”当贾汀靠近朋友家时，他能听到查理在里面叫。`它可能是在对着我叫`，贾汀心想，冒了一身冷汗。


    等等！这一切在纸面上看起来很完美，但贾汀实际上如何应对这些挑战呢？我们难道忘记他对狗极度恐惧了吗？


    ![Image](img/5-1.jpg)


    ## 第 5 章：谢谢，猴子！


    ### 接纳如何让你获得自由


    你爬过山吗？在陡峭的山径上，你会很快感到累。没多久你就会满头大汗、精疲力竭。山径蜿蜒，在每个急转弯都会出现新的地形……树木遮挡了视线，你怀疑自己是否能到达。回头是如此具有诱惑力。你的疲劳变得越来越糟糕，直到你几乎无法迈步，然后……


    你到达了顶点！就像那条山径一样，你的疲劳感平稳了。你的腿在发抖，身体感到精疲力竭，但你也感到非常好。你征服了那座山。


    焦虑就像疲劳。正如选择爬山一样，如果你选择面对恐惧，它会在好转之前变得更糟。但记住，你爬山时不会说：`我不应该累！累了是不可接受的!`。如果你那样想，你肯定会转头回到山脚。你知道在陡峭的山径上感到疲劳是正常的，所以你接受了它。你知道并信任你的疲劳不会杀死你，而且如果你在每个弯道休息并呼吸，你就会找到到达目标的力量。


    就像疲劳一样，如果你接受焦虑是生活正常的一部分，它就会容易忍得多。你挑战阶梯的每一级就像是那条上山路上的一个转折。当你面对新的地形时，你的成功取决于你欢迎它所提供的一切的能力。在山径上，这包括身体的疲惫。在你的阶梯上，这包括你会感受到的焦虑。当那种焦虑来临时，你将接纳它。你会说：“谢谢你，猴子！还能再来一点吗？”


    ![Image](img/5-2.jpg)


    ### 接纳呼吸


    仅仅决定接纳焦虑是不够的。你必须用全身去接纳它，在你感到焦虑的部位。过去，当你感到焦虑时，你的呼吸急促而浅，这是一种“战斗或逃跑”反应。当你接纳焦虑时，你采取相反的操作：


    1.  深吸气，充满肺部，直到腹部扩张。

    2.  完全呼气。

    3.  缓慢而从地重复。

