    You can download a Worry Time worksheet at [http://www.newharbinger.com/32431](http://%20http://www.newharbinger.com/32431).


    The Relaxation Response


    Generalized worry can cause a lot of stress in the body. Every time you treat
    monkey chatter as a signal of real danger, you trigger a fight-or-flight response.


