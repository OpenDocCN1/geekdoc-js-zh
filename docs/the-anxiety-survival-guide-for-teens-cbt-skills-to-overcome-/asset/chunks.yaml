  trans: '


    每个人都有可怕的、侵入性的想法——而不只是强迫症（OCD）患者是如此。大脑就像一台爆米花机，不断产出各种想法，一些神经科学家估计，每天产生多达五万个。在这些不断弹出的想法中，有一些非常诡异且可怕的想法。事实上，每天产生的想法中，大约有一半属于不愉悦的类别，与某事可能出错有关。


    如果你的“猴子大脑”天生就对威胁格外敏感，它就会将这些想法视为出了问题且你正处于危险之中的证据。突然，一片随机的爆米花变成了致命的内核，你的猴子拉响了警报。


    ![Image](img/11-2.jpg)


    ## 猴子的误判


    无论你的强迫性想法有多恐怖、疯狂、尴尬或羞耻，想法本身并不是问题。你对想法的解释赋予了它力量。对你的猴子来说，你产生那个想法意味着你出了问题，你可能会采取那个想法的，或者你必须做某些事情防止那个想法变成现实。它产生了经典的“高估/低估”猴子误判。


    1. 它高估了可怕事情发生在你或你爱的人身上的概率，或者高估了你真的会执行某个破坏性想法的概率。

    2. 它低估了你在不执行强迫行为时忍受焦虑或不适的能力，也低估了万一坏事真的发生时你的应对能力。


    与强迫症相关的另一个重要的猴子误判是`对不确定性的不耐受`。即使只有 1%的概率可能出错，你也应该试图防止它的发生。当你为了确保安全而进行强迫行为时，怀疑就会溜入。无论你多多努力让事情变得绝对
    100%安全，猴子大脑都会怀疑你做得够不够。对于猴子大脑来说，没有任何一种程度的风险是可以接受的。在强迫症中，你永远无法确定自己是安全的。


    *   你洗了手，但又碰到了水龙头。你的猴子说：`手脏的人碰过那个水龙头！你应该再次洗手。`

    *   你拔掉了卷发器插头。你的猴子说：`但万一你拔掉了别的东西呢？你应该回去检查一下。`

    *   你知道自己对异性有吸引力，但你恰好产生了自己可能是同性恋的想法。你的猴子说：`你需要思考一下来弄清楚这件事。`

    *   你对父母说了晚安，但被中断了。猴子大脑说：`如果你没说对，他们可能会发生坏事。再说一遍。`


    一旦你识别了你的强迫症猴子和它的误判，我不会鼓励你像对待其他类型的焦虑那样去构思替代性想法。之所以这样做，是因为无论替代性想法有多准确，你的猴子大脑都会对其产生怀疑。在强迫症中，你的猴子对不确定性的不耐受如此高，以至于它也会对你的替代想法产生怀疑。


    ## 强迫症回避循环


    随机的焦虑想法只有在猴子大脑将其解释为重要时，才会变成强迫性想法。当它拉响警报你被焦虑淹没时，你会这样做——每个焦虑的人都会尝试做的事——回避它。


    这就是你强迫行为上场的地方。为了缓解焦虑，你执行一些小仪式，这些仪式要么让你从可怕的想法中转移注意力，要么让你产生你正在阻止它变成现实的幻觉。如果你的强迫症与对细菌的恐惧有关，洗手就能缓解焦虑。强迫症失去了对你的控制，你就可以放松。如果事情就此结束，那生活就简单了。


    问题在于，回避焦虑充其量只是一种短期解决方案。虽然你获得了几分钟的缓解，但你只是在推迟痛苦，并最终使其变得更糟。为什么？因为猴子逻辑。


    当你的猴子看到你洗手时，它会说：`我是对的；我警告你的那些细菌很危险。`当猴子看到你洗手后的放松感时，它会说：`你洗了手感到放松。因此，未来洗手会让你保持放松。`当猴子看到你没有生病时，它会说：`因为你洗了手，所以你没有生病。`


    ![Image](img/11-3.jpg)


    这里更多猴子逻辑作用于强迫症的例子：


    *   **强迫想法：** `万一我开车撞死人怎么办？`

    *   **强迫行为或回避：** 避开繁忙的交叉路口，不要开音乐开车。检查后视镜或重溯路线，看路路上是否有尸体。

    *   **猴子逻辑：** `因为你格外小心并检查了镜子和路线，你没有撞到任何人。`

    *   **强迫想法：** `万一我是同性恋却不知道，我的一生都是个谎言怎么办？`

    *   **强迫行为或回避：** 宽慰自己一直对异性有吸引力。避免看同性中的帅哥或与他们有任何身体接触。检查身体在他们周围是否有兴奋的迹象。

    *   **猴子逻辑：** `因为你在大脑中回顾了你不是同性恋的证据，你可以确定自己还是异性恋的。`

    *   **强迫想法：** `万一我带回了可能让我或我的家人人生病的细菌怎么办？`

    *   **强迫行为或回避：** 避免触碰别人碰过的东西。在公共场所碰过东西后，清洗身体、衣服和个人物品。

    *   **猴子逻辑：** `因为你对洗涤仪式如此小心，你家里没有人得过重病。`

    *   **强迫想法：** `万一我忘了某些重要的事，导致我错过了作业并得了低分怎么办？如果万事不对，我可能会永远这样焦虑。`

    *   **强迫行为或回避：** 反复检查你的书包以确保没有漏掉什么东西。保持房间整洁，这样你就可以放松。

    *   **猴子逻辑：** `因为你反复检查书包并保持房间整洁，你没有漏掉任何东西是安全的。`


