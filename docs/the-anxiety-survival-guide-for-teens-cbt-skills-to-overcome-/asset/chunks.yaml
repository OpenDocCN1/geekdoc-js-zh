    你周围到处都是焦虑的青少年。研究显示，焦虑是美国最常见的心理健康问题，影响着近五分之一的人。如果你正坐在一间有 30 名学生的教室里，很有可能至少有一排同学正遭受着七种常见焦虑类型之一的痛苦：社交焦虑、广泛性焦虑、分离焦虑、强迫症、特定恐惧症、恐慌发作和场所恐惧症。你之所以没有察觉到焦虑同伴，是因为他们隐藏焦虑的技巧和你一样擅长。


    你并不孤单，你也没有过错。研究 DNA 的科学家已经分离出许多与对危险敏感性升高或降低相关的基因，其中包括一些被称为“战士基因/忧虑者基因”和“冒险基因”的基因。你现在的焦虑水平部分是遗传的。事实上，如果你父母或兄弟姐妹患有焦虑症，你自己患焦虑症的概率是别人的四倍。


    除了基因组成外，你的焦虑水平还会受到创伤性经历或父母焦虑行为的影响。因此，为自己的焦虑感到自责，就像自怪自己的眼睛颜色、发生在你身上的事情或你出生家庭一样毫无意义。你无法改变你的基因、生活经历或你的父母。这些是你被分到的牌牌。但你是否必须与焦虑共度余生，错过你想做的事情呢？数百万焦虑的青少年注定会成为焦虑的成年人吗？绝对不是！你*可以*学习如何管理焦虑，从而去做对你来说重要的事情。这本书将告诉你如何做。


    以下是本书涉及的不同焦虑类型的简要概述。你还可以在 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)
    下载一份简短测试，帮助你识别自己患有哪种类型的焦虑。（有关下载的更多信息，请参阅本书最后最后。）如果不止一种，请不要惊讶；这非常常见。本书的后续章节将更详细地关注如何应对你特定的焦虑类型。


    ## 广泛性焦虑


    - 经常担心学校、你的健康或亲人的健康，或者世界上发生的坏事

    - 感到紧张或坐不安、难以集中注意力，或因担心而在晚上难以入睡

    - 频繁出现胃痛、头痛或肌肉紧张


    ## 恐惧症


    - 恐惧并避开电梯、高度、风暴或水

    - 恐惧某些动物或昆虫

    - 对针头、血、窒息或呕吐产生不合理的恐惧


    ## 社交焦虑


    - 感到不适的害羞或害怕做或说尴尬的事

    - 必须进行口头报告或成为关注焦点时感到恐慌

    - 难以与其他开始或加入对话


    ## 恐慌发作


    - 突然或无缘故地感到恐惧

    - 心跳加速、呼吸困难或头晕

    - 奇怪、抽离感，仿佛一切都是不真实的


    ## 场所恐惧症


    - 避开或恐惧进入曾让你陷入恐慌的情况

    - 恐惧被困在汽车和飞机等场所，或恐惧进入隧道或穿过桥梁

    - 害怕突然需要上厕所却被困或距离太远


    ## 强迫症


    - 频繁的侵入性念

    - 害怕伤害他人

    - 重复性行为


    ## 分离焦虑


    - 恐惧离开家

    - 担心亲人发生坏事

    - 难以离开家


    ## 第一部分


    ![Image](img/1-1)


    # 猴子心


    ## 存活


    千年前的一个夏天，三个饥饿的猎人在穿越岩石地带追踪驯鹿的足迹。然而，他们追踪足迹没多久，就发现了几只老虎脚印。第一个猎人哼了一声继续往前走，似乎完全不在意。第二个猎人转转身回了营地。第三个猎人擦了擦额头，深吸了几口气。他很焦虑，但也饿。在研究了足迹的方向后，他向相反的方向出发。不久后，他矛杀了一只鹿。那天晚上围坐在火旁讲述的狩猎故事中，他是英雄。


    至少有一点在千年来没有改变。无论是史前平原上冲而来的剑齿虎，还是闯红灯的汽车，人类的反应是瞬时的。我们大脑是为了生存而硬化的。你大脑的首要任务是存活。


    你的大脑告诉你的身体何时放松，何时反应。当危险来临时，你的神经系统会在瞬间行动，在你来得及思考之前。这被称为*战斗或逃跑反应*，我们不仅与鹿共有，还与所有拥有大脑的大生物共有。


    第二天，三个饥饿的猎人再次出发寻找猎物，再次发现了驯鹿的足迹。然而，他们追踪足迹没多久，就发现了老虎脚印。他们蹲下，紧握长矛以待。当他们转过头时，看到一只老虎正朝他们冲来。惊恐的猎人逃跑了，鹿也是如此。所有的猎人都回了营地。那只鹿就不那么幸运了。


    ![Image](img/1-2)


    即使在没有直接威胁的情况下，你的大脑仍在寻找危险。尽管你通常没有察觉，但你大脑的一个原始部分一直在扫描周围环境，记忆过去的事件并展望未来，决定什么对你来说是安全的，什么不是。尽管神经科学家不断学习关于大脑该部分如何工作的新知识，但我们究竟如何决定承担哪些风险，以及为什么我们的决定人与人差异巨大，仍然是一个谜。


    那个忽视足迹的“无畏”猎人继续沿着小路走，结果被老虎杀了。那个被足迹引起焦虑并据此改变计划的猎人活了下来并过得很好。即使在没有即时威胁的情况下，感到一些焦虑也能帮助你做出正确的决定并生存下去。


