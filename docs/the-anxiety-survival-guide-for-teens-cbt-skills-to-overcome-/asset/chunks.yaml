    go to college or simply to leave the house without rechecking your backpack a
    half-dozen times. The point is to go in *your* direction, not your monkey’s.


    ![Image](Images/4-5.jpg)


    On each rung you will place a challenge for yourself, each one slightly bigger
    and scarier than the one below it. As you meet each challenge you will become
    more powerful and more skilled at accepting anxiety as just a feeling, rather
