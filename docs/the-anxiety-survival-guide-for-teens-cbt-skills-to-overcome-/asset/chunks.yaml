    对 Jarod 来说，更现实的目标是微笑并说“你好”——*此为止*。如果另一个男孩回应并开始了对话，那太好了！如果没有回，或者 Jarod 脸红、出汗或说话结巴，那没关系。


    Jarod 完成了他的第一级挑战，但之后他开始担心自己听起来怎么样。他也注意到自己感到很热，并纳奇那个男孩是否看到了。


