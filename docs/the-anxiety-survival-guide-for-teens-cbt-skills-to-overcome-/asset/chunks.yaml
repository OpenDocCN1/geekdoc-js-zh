    ### **Actual cause and purpose:** Blood and oxygen are being directed away from
    your hands, feet, and face and toward the large muscles in your legs and arms.
    This causes numbness and tingling. If you were actually being attacked and were
    injured while defending yourself, this change in circulation would help prevent
    you from losing too much blood.


    - **Sensation:** Nausea, nervous stomach, intestinal cramping or diarrhea, dry
    mouth or gag reflex

    - **Monkey thought:** *What if you throw up or don’t make it to the bathroom in
    time?*


    ### **Actual cause and purpose:** The digestion process shuts down so that more
    energy can go to your heart, lungs, and legs. This can cause nausea and diarrhea.
    If you were being attacked by a predator, you would not be eating a bag of chips.
    By shutting down your stomach you have more energy to run away.


    - **Sensation:** Vision changes

    - **Monkey thought:** *What if you go crazy, or things seem weird or unreal?*


    ### **Actual cause and purpose:** When you are afraid, your eyes widen and your
    pupils dilate so that you are better able to see danger, even in darkness. This
    causes vision changes.


    - **Sensation:** Feeling hot and sweaty

    - **Monkey thought:** *Uh-oh—something might be wrong. You might have a panic
    attack and lose control!*


    ### **Actual cause and purpose:** Sweat helps cool the body so that it does not
    overheat when you’re running or fighting a threat. Also, if you’re sweaty, you’re
    more slippery to a predator, so you can get away more easily.


    - **Sensation:** Feeling cold and clammy

    - **Monkey thought:** *Uh-oh—something might be wrong. You might have a panic
    attack and lose control!*


    ### **Actual cause and purpose:** Blood and oxygen is being directed away from
    your hands, feet, and face and toward the large muscles in your legs and arms.
    With blood moving away from your hands, if you were actually being attacked, you
    would be less likely to lose too much blood if injured while defending yourself.


    As you can see by this list, there are good reasons for all of your panic sensations.
    After all, anxiety is adaptive. If we didn’t feel any anxiety, our bodies wouldn’t
    know how to respond to danger, and humankind would have been wiped out several
    thousand years ago. But why would your body go into fight-or-flight mode when
    there is no actual evidence of danger?


    We don’t really know. One way to think about panic attacks is that they are like
    a fire drill at school—a test of your fight-or-flight response to make sure it
    is all in working order. And like the fire alarm bell, your own body’s alarms
    eventually go silent. Within a few minutes to a half hour at most, everything
    is back to normal. You feel very relieved, but of course, you also feel shaken.
    Unlike a fire drill, you thought it was the real deal. You thought you were really
    dying, going crazy, or losing control. You want very badly to leave the whole
    episode behind you.


    ## Tools to Tame the Panic Monkey


    In order to conquer panic, you’ll need to learn how to tame the panic monkey.
    Fortunately, there are many tools you can reach for, and with practice, these
    tools will become easier and easier to use.


    ### Spot the Thought


    Since panic attacks are driven not by the situation or the sensations, but rather
    by your `interpretation of the sensations`, the first step to mastering panic
    is to identify the monkey mind interpretations, or anxious thoughts, that have
    been triggering your panic. Anxious thoughts are not always easy to remember,
    but you will uncover them by first recalling the panic sensations, which tend
    to be unforgettable. Make a list of all the sensations you had during your worst
    panic attack. (There’s also a form you can use, available for download at `http://www.newharbinger.com/32431`).


    Next, write down what you were afraid would happen, corresponding to each sensation
    you listed. Good questions to ask are:


    - *What popped into my mind while I was having that sensation?*

    - *What am I afraid of?*

    - *What is the worst that could happen?*


    ### Monkey Miscalculations


    List your monkey mind interpretations. Next to each interpretation identify the
    miscalculations from chapter 3 that your monkey is making. Besides the over/underestimating
    already mentioned, the most common monkey miscalculation behind panic attacks
    is catastrophizing, or leaping to the worst possible conclusion. As if watching
    a horror movie, the monkey mind is always imagining the worst possible outcome.


    #### Catastrophizing


    - I am having a heart attack.

    - I will lose control and faint.

    - I can’t breathe; I may suffocate and die.

    - If I have a panic attack while driving I might crash the car.

    - I feel weird; maybe I’m going crazy. What if this is schizophrenia or some other
    serious mental illness?


    ### Alternative Thoughts


    Last but certainly not least, write down an alternate interpretation that is based
    on the actual cause and purpose of each sensation. Here is what Kim came up with:


    - **Sensation:** Tightness in chest

    - **Monkey thought:** *You can’t catch your breath; you might suffocate and die.*

    - **Monkey miscalculation:** Catastrophizing

    - **Alternative thought:** *My breathing changes when I am anxious, and my muscles
    tense up to prepare for fight or flight. This causes my chest to feel tight.*


    - **Sensation:** Heart beating fast

    - **Monkey thought:** *Something is wrong; what if you are having a heart attack?*

    - **Monkey miscalculation:** Catastrophizing

    - **Alternative thought:** *My heart beats fast to pump blood and oxygen into
    my muscles. This is part of fight-or-flight response.*


    - **Sensation:** Light-headedness and dizziness

    - **Monkey thought:** *What if you faint?*

    - **Monkey miscalculation:** Catastrophizing

    - **Alternative thought:** *My breathing changes when I’m anxious. My body is
    flooded with oxygen and releases carbon dioxide, causing light-headedness. Because
    my blood pressure goes up, not down, during panic, I won’t faint.*


    By accepting the catastrophic interpretation of her sensations, Kim had been letting
    her monkey mind make decisions about how she was feeling and what she did in response.
    Now with Kim’s alternative thoughts, she had two choices of how to respond to
    panic—one based on fear and one based on facts.


    Kim was off to a good start, and if you take the time to spot your thoughts you
    will be too. Once you can see the monkey mind at work, and learn to distinguish
    between a harmless panic feeling and a genuine threat to your health, you may
    find that your overall anxiety decreases a bit. (You can download an Alternative
    Thoughts worksheet at `http://www.newharbinger.com/32431`).


    ![Image](Images/7-5.jpg)


    More important, you have an alternative to your monkey thoughts now. There is
    a bigger and more rational part of your brain that knows who you really are and
    what your dreams and goals are. You can make decisions that are not based on fear.
    With an alternative way of thinking, you are ready for the next step, which will
    require all of your courage and presence of mind.

