- fmt: '

    Not very complicated, is it? It may be simple, but it is also simply powerful.
    With each inhalation, imagine you are pulling strength from the ground like the
    roots of a tree. With each exhalation you are letting go of controlling the situation,
    bending like a tree in the wind, accepting whatever happens—including the anxiety
    it may bring.


    Breathing into fear counters and softens your body’s fight-or-flight sensations.
    Your monkey’s howls of alarm tell your body to breathe shallowly and rapidly,
    but with your deep, slow breaths you override that command. With each breath you
    are saying, `I can handle this!*


    A word of caution here: Don’t try to relax. Don’t picture yourself on a peaceful
    beach or a similar restful spot until your anxiety goes away. That’s avoiding
    the situation. When you try to relax you are, in effect, giving your monkey a
    banana, rewarding its miscalculation, because you are agreeing with it that you
    couldn’t handle feeling the anxiety. For your challenges to be successful and
    help you reach your goal, you will have to be fully present in the situation,
    just like in the mindfulness practice, feeling every moment completely.


    As you accept your anxious feelings with your breath, if you happen to become
    relaxed, that is fine—just as fine as if you become more anxious. As long as you
    are welcoming your anxiety, breathing into your fear, you are meeting the challenge
    and climbing the ladder.


    ## The End of Anxiety


    This is a difficult idea to trust. Chances are you’ve never actually felt your
    anxiety all the way through. But the fact is, like everything in the natural world,
    anxiety has a beginning, a middle, and an end.


    Try an experiment right now: Picture a situation, image, or thought that makes
    you anxious. Once you have that feeling in your body, breathe into it, allowing
    it to be exactly as it is, not trying to change anything. If you feel any tension
    in your body, breathe into that area. Continue to do this for five minutes, paying
    close attention to the sensations in your body.


    You will notice the anxious feeling changing. It may grow more intense or less
    intense. It may move around your body. All of this is fine. By breathing into
    your anxiety you are decreasing your resistance to it and allowing it to run its
    natural course. What may surprise you is how well your body can process a bad
    feeling. You won’t fall apart or faint or have a heart attack. You are much stronger
    than your monkey thinks you are!


    Of course it won’t be easy. Your monkey mind will be chattering away like always.
    Its false alarms will rise in volume until they drown out everything else. To
    tame your monkey you must move forward with a sense of purpose and authority,
    dragging the howling little critter along behind you.


    Remember, you cannot reason, argue, or make deals with a monkey! All that does
    is give your monkey a chance to repeat all its danger warnings, cast doubt, and
    remind you how terrible it would be if you were wrong. Giving your monkey any
    attention at all is giving it opportunities to distract you from your commitment
    to yourself, which is to be in the situation and welcome anxiety. Just say, `Thankyou,
    monkey!* and move forward.


    *As Justin approached his first challenge with Charlie, he felt all the feelings
    he knew he would. Lots of anxious thoughts about being bitten ran through his
    head and he felt a powerful urge to run. But by breathing slowly and deeply, and
    reminding himself about his ultimate goal of independence, he was able to open
    the gate, walk up the stairs, and ring the doorbell. A few seconds later he was
    standing in place next to a dog!*


    *Though his anxiety was very high at first, within a few minutes—to his surprise—it
    began to inch down a little. The longer he was near Charlie, and Charlie was not
    attacking him, the more he calmed down. He forgot about his fear of getting bitten,
    and all his monkey chatter faded into the background. Justin felt so relaxed that
    when Charlie put his paws up on his knee, he reached down instinctively to scratch
    Charlie’s head.*


    One small step for Justin, one large step toward Justin’s independence! The whole
    way home he felt like he was walking on a cloud. In fact, a little part of Justin
    actually started looking forward to the next challenge. What was happening here?


    ![Image](Images/5-3.jpg)


    As I pointed out in chapter 4, every time you avoid a situation you train your
    monkey to believe that its wild guesses about the dangers of that situation are
    correct. After years of avoidance you’ll have a gorilla-size problem that seems
    beyond control. But the good news is that no matter how entrenched you are in
    a cycle of avoidance, you can turn things around. With acceptance and courage
    you will become strong enough to see the beast for what it is: a scared little
    monkey.


    ![Image](Images/5-4.jpg)


    Why do I sound so confident? Because the same dynamic that grew the monkey will
    shrink it. When you survive a situation you’ve previously avoided, your monkey
    mind cannot claim credit. It gets no banana! You survived because the situation
    turned out to be manageable after all. Although it was scary, you survived, and
    this is how you gain confidence in your ability to tolerate anxiety and do what
    you want and need to do.


    As you learn to accept anxiety as just a feeling, and not necessarily a sign that
    something is wrong, the chatter of your monkey mind will seem less compelling.
    Thoughts that once filled your head, like `I feel anxious; I’d better get out
    of here,* will be replaced by `I can be in this situation even though I am anxious.*
    Imagine all the things you will do, the places you will go, by patiently climbing
    your ladder one step at a time. I promise you that your life will improve once
    you calm the little critter down and learn not to take it so seriously!


    *Justin worked hard at climbing his ladder one rung at a time. With each challenge
    he felt another wave of anxiety, but he rode it out, letting his monkey howl away
    in the background. After a few rungs his alternative thought that dogs don’t attack
    very often became stronger and more believable to him. Climbing his challenge
    ladder and practicing mindfulness made it easier and easier to ignore his monkey.*


    *Soon he was back to skating to friends’ houses and going to the skate park, almost
    as comfortably as he had before, and not needing to depend on his parents to get
    around. If he saw a large dog, he’d notice his heart beating faster, and his monkey
    mind would send out a warning thought like `Uh-oh, that dog looks dangerous! *
    But he was able to say `Thank you, monkey! * and feel the anxiety without going
    back to avoidance. It wasn’t long before Justin was taking his independence for
    granted.*


    *One day at the skate park another skater said, “Hey, you were gone for a while.
    You hurt yourself or something?”*


    *“No,” Justin answered. “I just took a break.” Then, to himself, he added,* —to
    tame a monkey! *He laughed and launched himself into the bowl.*


    ![Image](Images/5-5.jpg)


    I hope that reading Justin’s story will help you see your own anxiety in a different
    light. Are you ready to take back your life? The next six chapters, one or more
    of which will feel specially written for you, will zero in on specific types of
    anxiety. Have courage and know that you are not alone. Thousands of other teens
    have changed their lives this way. You can master your anxiety!


    Part 2


    ![Image](Images/6-1.jpg)


    Chapter 6


    # Shyness and Social Anxiety


    ## Why Is Everyone Looking at Me?

