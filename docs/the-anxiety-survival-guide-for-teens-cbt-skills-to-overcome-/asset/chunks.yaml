    听起来很容易对吧？对谢尼莎（Shaneesha）来说，做这件事非常可怕，但并非不可能。重要的是从一个只要有一点勇气和充分准备就能应对的挑战开始。可以从 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)
    下载“挑战阶梯”工作表。


    当谢尼莎触碰到书包的那一刻，她就能感受到恐惧的阵痛。她非常想洗手，但在几次深呼吸和“谢谢你，猴子”的帮助下，她走过浴室，走向奶奶的卧室。谢尼莎脑里的猴子拼命地叫着，脑海中浮现出奶奶生病、临终、甚至参加葬礼的画面。她的只猴子提醒她，这一切都是她的错，她的全家人都会责怪她，她的生活将会毁掉。


    谢尼莎深吸了一气，摸了碰奶奶的门把手。恐惧感就像腹部被挨了一拳，她的心脏剧烈跳动着。为了忍住不跑回去找洗手液，她竭尽全力。但她一直专注于自己的呼吸，提醒自己她愿意承担这个风险。她知道，如果不这样做，她的强迫症（OCD）猴子将继续统治她的生活。


    在接触了各种表面一个非常不舒服的半小时后，谢尼莎发现她的焦虑减轻了大约一半，而且她没有诉诸通常的强迫行为！这似乎是不可能的，但却是事实——她的焦虑正在自行缓解。在一个周的时间里，她每天都重复这个实验，并且变得越来越容易。她不仅感到焦虑减轻了，而且她的执念对她来说也变得越来越荒唐。没有任何可怕的事情发生。


    这段经历给了谢尼莎信心继续向上爬阶梯，直到她终于到达了顶端的一级：去医院候诊室。她坐在椅子上，读着杂志，像普通人一样触碰东西。回到家后，她确实快速洗了一次手，但那看起来像是没有强迫症的人会做的事，而且剩下的时间里她都没有换衣服。她又去了候诊室六次，在练习结束时，她感觉极极了！她的手不再因为频繁洗手而红肿干裂。她不再在强迫行为上浪费时间和精。。真实的谢尼莎回来了！


    每当她旧的执念想法冒现时——它们总是会出现——谢尼莎都会感谢她的猴子，并提醒自己不要屈服于洗手的冲动。她知道这是大多数人一直在承担的风险。


    我希望你能找到勇气停止回避，去迎接你的执念想法以及随之而来的焦虑。如果你觉得无法独自应对核心恐惧或挑战阶梯，不要害怕寻求帮助。（关于你可能获得的帮助类型，请参见附录。）你已经知道进行强迫行为会导致什么——导致更多的执念。当你停止回避循环时，你面对将仅仅是感觉——你*可以*忍受的感觉。


    当你接纳焦虑并允许自己感受它时，你猴子的逻辑就会发生变化。它听起来会更像：“你接受了那个想法，你是安全的。”那个想法终究没有那么危险。那是被驯服的猴子的喋喋，一种你可以与它共处而无需放弃梦想的状态。


    当然，总会有那么极小的概率，一个可怕的想法会成真。生活中总有风险。但我知道你会发现，带着一点不确定性生活，比伴着强迫症生活要好得多！


    # 第 12 章


    ## 其他问题


    ### 失眠与抑郁


    夜晚对于焦虑的青少年来说可能是一个充满挑战的时刻。那是一天中没有干扰的时候。没事可做，没什么可以看，没什么可以听。那是你身体放松和关闭功能的时间。但你身上有一小部分仍在工作。这部分从不睡觉。它在挑灯夜战，`24/7`
    上班，以确保你免受伤害。是的，那是你的猴心！


    从历史角度看，你的猴心在晚上保持警惕有充分的理由。从古以来，人类在天黑后最脆弱。当一个原住民睡着时，如果被捕食者或敌对部落袭击，他并没有准备好战斗或逃跑。在黑暗中倾听奇怪的声音和观察活动的移动对于我们祖先的生存是必要的。


    几千年后的今天，黑暗中已经没有剑齿虎在徘徊，我们有坚固的墙壁和锁好的门保护着我们。夜晚的过度警觉不再那么重要。但如果你有一只过度活跃、对危险格外敏感的猴子，它会找到足够的威胁来让你担心。`现在是凌晨
    1 点，你还没睡。你永远睡不着了！你明天的考试会不及格的！` 听起来熟悉吗？


    深夜独自坐在黑暗中，猴子的想法听起来可能很有说服力，但重要的是记住，大脑中猴心的部分设计仅是为了发现潜在威胁，而不是为了评估它们。你的猴子关于时间是正确的，关于你无法获得像预期的那样的睡眠也是正确的，但它只能猜测你何时或是否会入睡，以及你明天考试的结果。猴子的想法充满了误判——其中最常见的是高估或低估。


    你的猴子在担心你是否获得足够睡眠时，总是高估了你维持功能需要多少睡眠，以及你睡得有多糟糕。它还低估了你实际获得了多少睡眠，以及你对较少睡眠的应对能力如何。


    这里还有其他误判暴露了它是猴子的想法。预测你永远睡不着是在假设最坏的情况，即*灾难化思维*，就像预测你会考试不及格一样。忽视你实际获得的睡眠则是*否定了正面因素*。你可以在第
    3 章回顾这些和其他误判。


    这里有另一个你可能熟悉的猴子想法：`你精疲力竭了。你最好睡个懒`。但那是猴子的想法吗？如果你整周都在为睡眠不足而挣扎，这听起来完全合理。如果你遵循了这个建议，你会获得短期的缓解。但从长远来看，这种方式“补”睡眠实际上会让问题变得糟糕。


    周末晚睡会扰乱你身体的生物钟。这就像是每周都从加州飞往纽约。晚起三小时意味着睡觉时间会比你准备好的要早三小时。这就像是时差一样。


    在经历了一周辗转反侧的夜晚后，在周六早上固定时间起床既违背直觉又困难。但无论你昨晚睡得如何，你都需要下床。你的一天可能会很挣扎，但它是值得的，因为你正在为那个晚上积累睡眠需求，从而让你更有可能获得良好的睡眠。


