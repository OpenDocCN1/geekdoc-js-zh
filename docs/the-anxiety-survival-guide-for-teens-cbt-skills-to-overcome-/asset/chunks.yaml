  raw: '*Jarod had always been confident and outgoing until ninth grade, when he started
    to feel self-conscious and shy. One day he was telling a joke to a group of friends
    and one of them took offense, saying the joke was racist. Jarod felt humiliated
    and ashamed. After that he started giving more thought to what he was going to
    say before he said it. He wanted to make certain he would not offend anyone in
    normal conversations. Because he needed to plan every word he spoke he fell behind
    in conversations, becoming more and more quiet. By the time he was in high school
    the only way he felt he could be himself was if he drank alcohol at parties. But
    even then he often woke up the next day thinking about things he had said or how
    he had acted the night before, always with the same sense of shame.*


    Jarod has social anxiety—the fear of doing or saying something that would cause
    others to ridicule or reject him, resulting in feelings of embarrassment, humiliation,
    and shame. Social anxiety is the most common type of anxiety, affecting one in
    twenty teens and adults. Many teens with social anxiety have been shy their whole
    lives; others, like Jarod, were outgoing as children but became shy or socially
    anxious during middle school or high school.


    Here is a list of common situations that make many teens particularly anxious.
    Can you relate to any of them?


    *   Starting or maintaining conversations


    *   Answering questions in class


    *   Asking someone on a date


    *   Asking a teacher a question or for help


    *   Attending parties, dances, or other social activities


    *   Blushing, shaking, sweating, or showing other signs of anxiety


    *   Eating or writing in front of others


    *   Participating in P. E.


    *   Inviting a friend to get together


    *   Giving a report or reading in front of the class


    *   Performing in front of others


    *   Using school or public bathrooms


    ## The Need to Belong


    All throughout history, humans have been pack animals. We hunted in hunting parties,
    gathered nuts and berries in groups, and traveled in tribes or families. We had
    a much better chance of having something to eat and staying warm and safe when
    in a pack. In fact, an individual could not survive long alone in the wild. Naturally
    our ancestors learned to behave in ways that would not get them kicked out of
    their pack.


    Modern-day teens want to fit in also. If you’re rejected by your peers, you won’t
    be eaten by wolves, starve, or freeze to death, but there will still be a cost
    to pay. Community and personal connections are essential to happiness and well-being.
    So a little anxiety is adaptive. You are more likely to thrive if you feel some
    concern when you mess up socially—enough to learn from, anyway.


    But what if, like Jarod, you are afraid of “messing up” *all the time*? What if
    you feel as though every move you make is being judged, every word you utter is
    being ridiculed—as if everywhere you go you are on stage, in a spotlight performing
    for a highly critical audience? Social anxiety can cripple you at school, at your
    job, and in your social life.


    The anxiety you feel is a normal fight-or-flight response. Your nervous system
    is doing exactly what it was designed to do, what it does for all threats to your
    safety. Except for one thing: you aren’t in any danger. There is a monkey sounding
    the alarm.


    It is your monkey mind’s job to keep you safe, and from the monkey point of view,
    it would be dangerous for you if your peers disapproved of you. If you are reading
    this chapter and you identify with Jarod, chances are you have a monkey mind that
    is working overtime. When you are in a conversation your monkey is carefully monitoring
    everything you say, listening for anything that might sound weird to others. It
    is constantly scanning people’s faces for signs of boredom or disapproval. Anything
    less than total approval is interpreted as a threat. In the monkey mind, if one
    person is bored by one thing you say, that could mean everyone will be bored by
    everything you say.


    As we have learned, monkeys are not good at assessing risk. Monkey mind predictions
    are more like wild guesses than anything else. In your case, your monkey is making
    the universal over/under miscalculation:


    1.  It overestimates the threat that people will judge you to the extent that
    you become an outcast.


    2.  It underestimates your ability to cope if someone did negatively judge you.


    With every monkey mind miscalculation another anxious thought pops into your head.
    These are the thoughts that prompt the behavior that all anxiety disorders share:
    avoidance. It is only natural to avoid situations that make you anxious, but when
    you do so you train your monkey mind to believe that its wild guesses about imaginary
    threats are correct, and you encourage it to make more of them. Your avoidant
    behavior is like feeding your monkey a banana. You just make it bigger and stronger
    and its false alarms harder to ignore.


    ![Image](Images/6-2.jpg)


    Let’s take a look at how Jarod’s avoidance fed his monkey mind. Jarod’s most anxious
    thought was *What if I say something offensive or stupid?* and his behavior was
    designed to avoid doing so at all costs. In conversations with his peers he kept
    quiet, avoiding his friends’ possible judgments. If he really felt like he had
    something he needed to say, he avoided making any mistakes by rehearsing word-for-word
    first. Avoiding spontaneity kept Jarod out of trouble, and his monkey mind claimed
    credit. Jarod’s monkey logic went like this: *Because you didn’t say anything,
    or you thought hard about exactly what to say first, you did not insult anyone
    or say something that would have made people dislike you*.


    At parties Jarod was able to loosen up and ignore his monkey more easily by drinking
    alcohol. But this caused problems, too. And the next day his monkey was right
    back at it, fretting over things he said or did while drunk. And he felt even
    more uncomfortable around people that he had met at the party because he was back
    to being quiet and withdrawn. He worried they would expect him to be more fun
    and outgoing, like he was when he had been drinking.


    Jarod was trapped in a cycle of avoidance. The more he avoided speaking spontaneously
    the more he encouraged his monkey to set off alarms about the dangers of social
    situations in which he might have to speak. By using alcohol to cover up his anxiety
    he avoided gaining confidence in speaking more spontaneously without it. Jarod’s
    world was getting smaller and smaller, and he wasn’t happy about it.


    ## Tools to Tame the Social Anxiety Monkey


    As you know, you cannot simply get rid of your anxious thoughts. Your monkey mind
    is a built-in safety feature and it is here to stay. But that doesn’t mean you
    have to accept your monkey’s judgment of everything going on around you. You can
