  trans: '

    并不复杂，对吧？它可能看起来简单，但同时也极其强大。每一次吸气，想象你正像树根一样从地面中汲取力量。每一次呼气，你都放下了对局势的控制，像风中的树一样弯曲，接受发生的一切——包括它可能带来的焦虑。


    向着恐惧呼吸可以对抗并缓解你身体的“战斗或逃跑”反应。你大脑中的猴子发出的警报会让你的呼吸变得浅浅而快速，但通过深长而缓慢的呼吸，你覆盖了这一指令。每一次呼吸，你都在说：`我可以处理好这种情况！`


    这里有一个警告：不要试图去放松。在焦虑消失之前，不要想象自己正处在宁静的海滩或类似的休息场所。那是在逃避情境。当你试图放松时，实际上实际上是在给你的猴子一根香蕉，奖励了它的误判，因为你认同了自己无法处理焦虑的感觉。为了让你的挑战成功并帮助你实现目标，你必须完全处于情境之中，就像正念练习一样，完全感受每一个时刻。


    当你通过呼吸接受焦虑情绪时，如果你恰好变得放松了，那没关系——和你变得更加焦虑一样没关系。只要你欢迎你的焦虑，向着恐惧呼吸，你就在迎接挑战并攀爬梯子。


    ## 焦虑的终结


    这是一个很难信任的想法。可能你从未真正完整地感受过你的焦虑。但事实是，像自然界的一切事物一样，焦虑也有开始、过程和结束。


    现在就尝试做一个实验：脑海中想象一个让你焦虑的情境、图像或想法。当这种感觉进入你的身体时，向它呼吸，让它保持原有的样子，不要试图改变任何事情。如果你感到身体某个部位紧张，就向那个区域呼吸。持续这样做五分钟，密切注意你身体的感受。


    你会注意到焦虑感正在变化。它可能会变得更剧烈，也可能减轻。它可能会在你身体里移动。这一切都是正常的。通过向你的焦虑呼吸，你减少了对它的阻力，让它顺其自然。令你惊讶的是，你的身体处理糟糕感觉的能力是多么强大。你不会崩溃、晕倒或心脏发作。你比你的猴子认为的要强大得多！


    当然，这并不容易。你的猴子大脑会像往常一样喋个不停。它的虚假警报会越来越大，直到淹没其他所有声音。要驯服你的猴子，你必须带着目标感和权威感前进，拖着那只嚎叫的小家伙在你身后。


    记住，你不能和猴子讲理、争论或做交易！这样做只会给你的猴子一个机会去重复它所有的危险警告，播下怀疑，并提醒你如果搞错了会有多糟糕。只要给你的猴子任何关注，都是在给它机会分散你对自我的承诺——即身处情境之中并迎接焦虑。只需说：`谢谢你，猴子！`然后向前走。


    *当贾斯汀面对与查理的第一个挑战时，他感受到了他预知会产生的所有情绪。脑海中充满了许多关于被咬的焦虑念绪，他感到一种强烈的逃跑冲动。但通过缓慢深深呼吸，并提醒自己独立的终极目标，他能够打开门，走上楼梯并按响门铃。几秒钟后，他站在了一只狗旁边！*


    *尽管起初他的焦虑非常强烈，但在几分钟内——令他惊讶的是——焦虑开始稍微下降。他靠近查理的时间越长，查理又没有攻击他，他就越发冷静。他忘记了对被咬的恐惧，所有的猴子杂语都消失在背景中。贾斯汀感到如此放松，以至于查理把爪子放在膝盖上时，他本能地伸手去揉查理的头。*


    *这是贾斯汀的一小步，却是他迈向独立的一大步！在回家的路上，他感觉自己像在云端上行走。事实上，贾斯汀内心的一部分已经开始期待下一次挑战了。这里发生了什么？*


    ![Image](img/5-3.jpg)


    正如我在第四章中指出的，每当你回避一个情境，你就在训练你的猴子相信它对该情境危险性的随机猜测是正确的。经过多年的逃避，你将面临一个似乎无法控制的大猩级问题。但好消息是，无论你深陷逃避循环多久，都可以扭转局面。通过接受和勇气，你将变得足够强大，看清野兽的本质：一只受惊的小猴子。


    ![Image](img/5-4.jpg)


    为什么我听起来如此自信？因为让猴子长大的同样的动力也会缩小它。当你度过了一个之前逃避的情境时，你的猴子大脑无法抢功。它没有得到香蕉！你之所以能生存下来，是因为情况最终证明是可控的。尽管很可怕，但你幸存了，这就是你获得忍受焦虑并完成你想做和需要做的事之能力的方式。


    当你学会将焦虑仅仅视为一种感觉，而不一定意味着某些出了问题时，你猴子大脑的杂语将显得不那么有吸引力。曾经充斥脑海的想法，如`我感到焦虑；我最好离开这里`，将被`即使我很焦虑，我也可以处于这种状态中`所取代。想象一下，通过耐心地逐级攀爬梯子，你将做的一切、去的地方。我向你保证，一旦你平复那只小家伙并学会不再那么地对待它，你的生活将会改善！


    *贾斯汀努力一一级一级地攀爬他的梯子。面对每一次挑战，他都感到又一波焦虑，但他度过了它，让他的猴子在背景中嚎叫。在爬了几几级后，他的另一种想法——即狗并不经常攻击——对他来说变得更强大、更可信了。攀爬挑战梯子并练习正念让他忽视他的猴子变得越来越容易。*


    *很快，他又恢复了骑滑板去朋友家和去滑板公园，几乎像以前一样自在，不再需要依靠父母出行。如果他看到大大狗，他会注意到心跳加速，他的猴子大脑会发出这样的警告念头，如`噢，那只狗看起来很危险！`但他能够说：`谢谢你，猴子！`并感受焦虑而不回到逃避中。没多久，贾斯汀就把他的独立视为理所当然了。*


    *有一天在滑板公园，另一位滑板爱好者说：“嘿，你离开了一会儿。你受伤了吗？”*


    *“没有，”贾斯汀回答道，“我只是休息了一下。”然后，他对自己补充道，——为了驯服一只猴子！他大笑着跃入 U 形滑池中。*


    ![Image](img/5-5.jpg)

