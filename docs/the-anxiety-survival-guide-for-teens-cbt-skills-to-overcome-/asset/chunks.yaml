    *   Your stomach hurts. It might be salmonella poisoning!

    *   If you forget something for your trip, it will be ruined!

    *   Your mom has been tired lately. What if she has cancer?

    *   If you ever got detention it would be terrible!


    ## Intolerance of Uncertainty


    No matter how the odds favor a positive result, if there is even the thinnest
    sliver of a chance that something could go wrong, the monkey mind cannot rest.
    Instead of assuming that you are safe unless there are clear signs of danger,
    the monkey mind will assume danger unless there is 100 percent safety. Since it
    is impossible to be 100 percent safe, you will worry endlessly, striving for the
    impossible.


    ## Alternative Thoughts


    Before you spend another minute worrying about something, why not take a critical
    look at the thought that is triggering that worry? If you look at the evidence
    `for` the thought being true, as well as the evidence `against` it being true,
    you’ll have a better idea whether what you are dealing with is a genuine threat
    or just another monkey thought.


    Here’s Tess’s “Evidence For and Against” exercise about the threat that getting
    a B on a test will mean she won’t get into a good college and may end up homeless.
    As you can see, it led her to a more balanced alternative thought about getting
    a B that gave her a lot less cause to worry.


    ![Image](Images/9-6.jpg)


    *   **Evidence For:** It is true I got a B on the test. Grades on tests affect
    final grades in the class, and final grades affect grade point averages. Colleges
    look at grade point averages.

    *   **Evidence Against:** This test was only 20 percent of my overall grade in
    the class. I have an A average in the class so far, so this B won’t affect my
    final grade unless I get a B or lower on the next test. Even if my final grade
    is a B, I will still have a good GPA and could get into many good colleges.

    *   **Alternative Thought:** While it is true that test grades can affect final
    grades, I would have to do poorly from now on to get a bad grade in the class.
    Even if I did get a bad grade, I could still get into good colleges.


    When you use this tool, make sure that you stick to the facts. When Tess was gathering
    evidence for and against, she could have said, `I might get bad grades from now
    on.` This is not a fact, only something that could happen in the future. The facts
    were: she had an A average so far, and this test accounted for 20 percent of her
    final grade. Sticking with facts sometimes means you will need to get more information.
    For example, if Tess weren’t sure what the GPA requirements were for the colleges
    she was interested in, she might need to look that up.


    You can download a worksheet for this— Evidence For and Against, for Generalized
    Anxiety at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    ## Focused Attention


    Your monkey mind is used to getting all your attention. The constant stream of
    chatter is so compelling that unless you focus your attention elsewhere you will
    be continually under its spell.


    Imagine yourself sitting by a stream of monkey chatter. You could easily be totally
    absorbed in all the anxious thoughts bubbling up in front of you, but instead
    you close your eyes and focus inward on your breath. As you breathe in, notice
    the sensation and temperature of the air flowing in. As you breathe out, notice
    that. The breath itself is not what is important. What matters is that you are
    directing your attention away from your monkey’s anxious thoughts.


    You can do this anytime, whether you are worrying or not. In fact, training yourself
    how to `focus attention` when you are not worried is the best way to prepare for
    when you are.


    Focusing your attention away from your monkey is powerful because it places you
    in the `present moment`, where your monkey cannot actually go. The monkey spends
    all its time reviewing the past, looking for mistakes you made, and imagining
    the future, looking for threats. No matter how many times you are distracted by
    anxious monkey chatter, just continue to bring your attention back to the present
    moment. This will help you find peace from worry and tame your monkey.


    *After using her taming tools for a while, Tess started to see her worries in
    a different light. She knew that getting less than a perfect grade would not lead
    directly to being “homeless and alone.” Things were looking up!*


    ## Tools to Rule the Generalized Anxiety Monkey


    Spotting monkey chatter and coming up with your own alternative thoughts is essential
    to mastering generalized anxiety. But as long as you are still using avoidant
    behaviors like seeking reassurance, making too many lists, studying too hard,
    or just plain worrying, you are playing by your monkey’s rules.


    When you respond to monkey chatter by worrying, you are saying, `You are right,
    monkey. This is something I need to worry about.` You are giving your monkey a
    banana—training it to view the imagined threat as a real one and allowing it to
    continue to run your life.


    ![Image](Images/9-7.jpg)


    To rule the monkey mind, you have to stop the avoidance cycle. Here’s a powerful
    tool to help you on your way.


    ### Worry Time


    Your experience with worrying up until now has been monkey driven. That is, whenever
    your monkey chatters, you worry. You may not want to stop whatever you are doing
    at that moment and begin to worry, but you have no choice. There is a wild little
    monkey in charge.


    During `worry time`, you are in charge—not your monkey. You decide when to worry
    and for how long. That’s right—you are going to worry.


    Worry time should be planned in advance, so you will need to look before something
    you look forward to—such as calling a friend, going on your computer, or watching
    a movie. When your scheduled worry time arrives, find a quiet place where you
    won’t be disturbed, set a timer, take your top worries, and let them rip. Don’t
    stop until the timer goes off.


    Here is a script of Tess’s worry time:


    ```

    I got a B on the test. Oh, this is terrible! This B could ruin my life! It might
    affect my overall GPA, and that would be a disaster. I may not get into any good
    colleges because of this. I am also embarrassed I got a B. What if my friends
    start thinking that I’m not smart? That would be terrible. But what is really
    awful about this is that if I can’t get into a good college my whole life will
    be bad. I may not be able to get a good job. My life will be ruined if I can’t
    get a good job. I may never be able to support myself!

    ```


    During `worry time`, you might become very anxious, which is just fine. This is
    the time for it. Imagine yourself putting out a welcome mat during worry time,
    welcoming in all the anxious thoughts and as much anxiety as possible, without
    putting up any resistance.


    If you begin to feel overwhelmed by fear, shift your attention away from the worry
    and focus on the bodily sensation that the worry causes. Breathe into that sensation,
    relaxing your belly. Remember that your breath is always there when you need it.
    (For more on breathing into anxiety, go back and revisit chapter 5.)

