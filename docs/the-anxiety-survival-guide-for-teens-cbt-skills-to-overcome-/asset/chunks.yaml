    为了控制和避免焦虑，人们会通过憋气或呼吸过快来变得紧张。或者，他们会利用呼吸来尝试放松。通过紧张或尝试放松，你并没有让焦虑顺其自然。你实际上是在认同你的“猴子”的想法，认为焦虑是一个需要你采取行动的危险信号。当你通过紧张或尝试放松来面对挑战时，你并没有真正在应对挑战。


    ## 迎接焦虑


    要接纳焦虑，你必须学会向它的*内部*呼吸——这与你一直所做的完全相反。为了让你明白我的意思，请详细地想象你恐惧的事物，直到让你的焦虑程度在 1 到 10 的`scale`
    上至少达到 5。在达到这一点之前，不要继续往下看。


    感到不舒服吗？很好！现在执行以下操作：


    1. 深吸气，充满肺部，直到你的腹部扩张。

    2. 完全呼气。

    3. 缓慢而有目的地地重复。


    通过向焦虑内部呼吸，你是在告诉你的猴子，焦虑没有什么好怕的。你打开自己的身体，给焦虑留出发挥的空间。这是你从未做过的事情，所以它听起来可能很可怕。但不允许自己真正感受到焦虑，正是你的焦虑依然困扰着你的原因。你越抗拒，它就越持久。


    ![Image](img/8-a.jpg)


    当你持续迎接并持续呼吸时，你会发现你的焦虑感受会自己发生变化。起初，你的恐惧可能感觉更强烈了，仿佛会淹没并摧毁你。无论如何你的猴子大脑都是这么对你说的！但感受恐惧并不会伤害你。你的设计初衷就是为了感受，而且没有任何情绪能在生理上伤害你。


    Anton 开始他的挑战时，只是说出“呕吐”、“吐”、“吐出来”等词汇。他记录了这些词让他感到多么焦虑，在只进行了三次练习后，重复说这些词仅让他的焦虑在 1
    到 10 的焦虑 `scale` 上达到了 1。但当他开始看人们呕吐的动画片时，他的焦虑上升到了 7。他每天看这些动画片，到周末时，他仍然对这些图片感到有些厌恶。但他的焦虑降到了
    2。


    人们呕吐的图片将 Anton 的焦虑推到了 9。有些图片真的很糟糕，所以他让父亲帮他挑选了一些不那么恶恶的图片作为开始。几天后，他能够看其中最糟糕的图片而焦虑没有超过
    3。


    当挑战让 Anton 感到胃部不适时，他注意到焦虑增加了。他的猴子大脑在嗡嗡作响，告诉他快要吐了。当然，Anton 知道这种情况发生的概率微乎其微！他一生中只吐过两次！他坚持挑战的时间越长且没有吐出来，他的焦虑就越低。


    Anton 决定他已经准备好去听人们呕吐的声音。他让他父亲选了一些 YouTube 上人们呕吐的视频。他遮住电脑屏幕，让自己看不到图像，并将视频设置为循环播放。当他的焦虑下降到
    2 时，他开始一边看图像一边听声音。他适应这一切的时间比他想象的要短。他的厌恶感从未真正消失，但他变得没那么焦虑。


    所有这些阶梯式的练习在整天中都在帮助 Anton。每当朋友表现出任何生舒服的迹象时，他仍然感到焦虑，但逃跑的冲动比以前小得多，他发现自己可以通过呼吸来度过去。这些挑战带给他信心和信念，即感到恶心并不等同于呕吐。


    一天，朋友邀请他参加一个在两小时车程外的音乐会。尽管这意味着要在那里一直待在车里并在奇怪的地方吃饭，令 Anton 自己都惊讶的是，他答应了。尽管这意味着一直待在车里并在奇怪的地方吃饭，这种想法不再让他那么害怕。这种想法很好！


    许多人们通过合理化来回避那些可能发生的事情，但他们内心却在担心。你不需要这种方式来征服你的猴子。焦虑*可以*是一个信号，毕竟，如果你对某件事有坏感觉，难道不应该关注它吗？记住，你并不孤单，不要自责。你可以对自己保持怜悯并要有勇气。


    ![Image](img/9-1.jpg)


    ## 第 9 章


    # 泛化焦虑


    ### 担心狂


    Tess 从从小就被认为是一个“担心狂”。她几乎会担心任何事情，从蚊子叮咬会导致疾病到考试会毁掉上大学的机会。她几乎所有时间都感到压力，并且经常头痛和胃痛。晚上时情况糟糕，她经常入睡困难。她的想法就像轮子上的老鼠，不停地转动。她感到焦虑不安，每当她真的开始担心时就是如此。


    Tess 患有泛化焦虑。比起某些具体的恐惧——比如蜘蛛、被评判或恐恐发作——她有更广泛的恐惧。泛化焦虑的青少年担心学校、工作、家庭、健康以及世界上发生的事情。


    这些担心是关于可能发生的事情，这会让人感到困惑。毕竟，如果你对某事的发生有坏感觉，难道不应该为了它去注意吗？但就像那个认为地面上的每一个足迹都是剑齿虎足迹的猎人，如果你患有泛化焦虑，你会得到太多的危险信号，以至于花费无数小时去解决已经解决或无法控制的问题。慢性担心没有用，是任何人都不想要的。患有这种焦虑的青少年说同样的话：“请帮我停止担心！”


    当你患有泛化焦虑时，你的猴子大脑正在通过望远镜观察世界。小事被放大了，你会跳向最坏的情况。由此经历的担心让你精疲力竭，并且实际上干扰了你的注意力。这种担心对你的安全没有帮助。


    ![Image](img/9-2.jpg)


    和所有的焦虑一样，泛化焦虑是通过回避来维持的。你可能会列出无尽的列表以避免忘记任何事情。你可能会向朋友、父母或医生寻求保证，确认你没有问题。你可能会推迟决定以避免做出错误的决定。也许你通过过度学习来回避得低分的可能性。


    有时候你所做的仅仅是担心。这怎么算回避呢？泛化焦虑的人相信，担心可以帮助他们在情况变糟时做好充分准备，或者只要他们担心得足够久，最终就能想出一个保护自己的解决方案。比起面对不知道会发生什么的不适，担心感觉更好受。担心是试图消除风险从而减少焦虑。


    让我们来看看 Tess 的焦虑想法：*如果刚才咬我的那只蚊子带有西尼河病毒怎么办？* 这是一个可怕的想法。但这是 Tess 无法改变的事实，而且当她开始担心这种可能性时，她在给予该想法超出其应有的关注。她正在给她的猴子喂一根香蕉，告诉它这个想法很重要。只要她继续担心蚊子叮咬的最坏结果，并寻求它不会发生的保证，Tess
    就在助长她的回避循环。


