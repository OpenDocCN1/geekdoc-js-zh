  trans: "\n\n露西娅在家里以完美主义者而闻名。她的房间总是整整齐洁，书本和文件摆放得齐，衣柜里的衣服按颜色分类。她喜欢这种状态，而且这并没有带来过麻烦。但毫无无故，事情开始变得失控。在进行指定的阅读任务时，她开始怀疑自己是否完全理解了刚读的内容，于是开始重新阅读一切。她开始擦掉并重写报告中那些她觉得不太对劲的部分。她担心自己可能在教室、储物柜或汽车里遗留了重要的作业，于是她回去一遍又一遍地检查。她反复检查书包，确保里面每样东西都在。这种检查开始占据大量时间，让她感到既沮丧又压力巨大，但露西娅无法抵制这种冲动。\n\
    \n这四位青少年都患有强迫症，又简称 OCD。与书中提到的其他类型的焦虑不同，OCD 行为在不同青少年之间会有很大差异，这可能会让情况变得有些令人困惑。但一旦我们定义了\
    \ OCD 的“强迫念”和“强迫行为”，你就会发现它们都是同一个问题。\n\n## 强迫念 (Obsessions)\n\n我们经常说痴迷于某首歌、一支运动队或某个人。虽然我们可能无法从这些事情中抽身，但思考它们是有有趣的。对于\
    \ OCD 强迫念来说，情况完全如此。\n\nOCD 强迫念是你不想要的、侵入性的想法、影像或冲动，它们会让你感到焦虑和痛苦。尽管这些想法源于你自己的脑海，但它们并没有太大的理性意义。强迫念产生在大脑中完全致力于检测威胁的部分——即“猴子脑”（monkey\
    \ mind），在那里，进行胡乱猜测是标准操作程序。\n\nOCD 强迫念在内容上也与其他类忧虑不同。一般的忧虑（如在广泛性焦虑章节中讨论的）是关于日常生活中的各种事，如成绩、金钱和他人。OCD\
    \ 强迫念往往带有些奇怪——例如怀疑自己是否撞了人、担心会伤害自己或他人、担心衣服上有细菌、需要将某物安排得恰好到位，或者怀疑自己的性取向。如果你有这类强迫念，你知道它们很怪异，你可能因为太害羞而无法和朋友谈论它们。\n\
    \n大多数强迫念属于以下四类之一：\n\n- **污染 (Contamination)：** 认为自己会“染上什么”或因接触表面或物体而中毒（或者较少见的情况，担心被残障人士或具有不良特征的人污染，仿佛与他们待在一起甚至一想到他们就会让你变得像他们）\n\
    \    - 担心细菌和疾病，例如性传播感染、胃肠流感或癌症\n    - 害怕接触体液，如尿液或粪便\n    - 担心可能因常见的家用清洁剂（如漂白剂和农药）或环境中的物品（如辐射或有毒植物）而导致中毒\n\
    - **伤害或攻击 (Harm or aggression)：** 认为自己已经造成或将要给他人或自己造成身体或情感伤害\n    - 担心由于做了某事——或忘记做某事——会引发火灾、洪水、入室窃或类似的灾难\n\
    \    - 担心自己可能会做诸如刺某人、撞人、绊倒老人或说出随机且伤人的话\n    - 担心自己不够小心，因滑倒或踩到某物而受伤，或摄入坏东西——如遗留的药片或变质食物\n\
    - **禁忌的性或宗教想法 (Forbidden sexual or religious thoughts)：** 破坏你的身份认同或作为一个善良/正直的人的感觉的想法\n\
    \    - 对自己性取向的怀疑\n    - 关于成为猥童儿童或犯乱伦的想法\n    - 关于与禁忌对象（如老师）发生性的想法\n    - 关于侵略性性行为的想法，如强奸\n\
    \    - 关于说违背神的话的想法\n    - 对对与错或道德与不道德的过度关注\n- **对称或精确性 (Symmetry or exactness)：**\
    \ 除非事情“恰到好处”或以某种方式完成——或者如果某事看起来未完成，否则就会产生通性的不适感\n    - 需要事物保持对齐、精确或完美平衡\n    -\
    \ 担心忘记或丢失重要物品\n    - 需要知道或记住某些事\n    - 在做决定或丢弃东西时感到有困难\n\n如果你的强迫念并不完全符合这四类之一，这并不意味着你没有\
    \ OCD。OCD 的定义特征是引起焦虑的侵入性想法。这正是 OCD 的另一半部分——强迫行为（compulsions）出现场的地方。\n\n## 强迫行为\
    \ (Compulsions)\n\nOCD 强迫行为是具有严格规则的行为，你觉得必须遵循这些规则，以防止你正强迫性想的事情真的发生。由于 OCD 患者对执行这些行为有强烈的冲动，这些行为被认为是强迫性的。它们与日常习惯的区别在于，它们占据的时间比你预想的要多。以下是一些常见的强迫行为：\n\
    \n### 检查 (Checking)\n- 检查以确保自己没有犯错\n- 检查自己没有忘记某事或遗留某物\n- 检查自己没有或将不会造成伤害\n- 检查是否拔掉了电器插头或关闭了它们\n\
    - 检查以确保没有掉掉东西\n- 检查开车时没有撞到人\n- 向他人寻求保证，自己没有做坏事或伤害他人，或者他们没有生病，或者某物是干净的\n\n### 清洁与清洗\
    \ (Cleaning and washing)\n- 以特定的方式、时长或次数洗手或洗澡\n- 过度洗衣服或其他财物\n- 在上完厕所后比通常需要的多洗身体\n\
    - 做其他事情——如擦手或使用手部消毒液——来清除污染物\n\n### 心理强迫行为 (Mental compulsions)\n- 在心里列清单，或在脑中回顾某些事情\n\
    - 使用特殊的词、影像或数字（有时是为了回应某个“坏”想法或影像）\n- 以固定的方式祈祷以防止坏事的发生\n- 在做某件“正确”、“安全”或“良好”次数的事时在脑子里数数\n\
    \n### 重复 (Repeating)\n- 以特定的方式或次数触摸、轻击或揉搓某物，或反复开关电源\n- 重复做某事——如进出门口、坐下和站起或进出汽车\n\
    - 重复身体动作，如眨眼\n- 重新阅读、擦掉和重写；在脑中回顾你可能说过或做过的事情\n\n### 排序或安排 (Ordering or arranging)\n\
    - 排列物品或排序、安排你的物品，使它们看起来恰好到位（例如，衣服按颜色分类、物品直角对齐或以某种方式安排书桌）\n\n再次，如果你有的强迫行为不符合这些描述之一，这并不意味着你没有\
    \ OCD。你的强迫念和强迫行为虽然看起来很奇怪，但它们源于所有焦虑问题共同的源头——保护自己的愿望。你的猴子脑只是在尽它让你生存的工作。它在做它最擅长的：感知危险，即使在没有危险的地方，并拉响警报告诉你*害怕——非常害怕！*\n\
    \n## 怎么了？ (What’s Going On?)\n\n尽管你强迫念的内容对他人来说可能并不关乎生死，甚至对你自己也是如此——*如果我不第三次检查熨斗是否关了，真的会烧掉房子吗？*——你的身体仍然处于战斗或逃跑模式。微小的想法是如何引发如此巨大的恐惧的？\n\
    \n"
- fmt: '

    Everyone has scary, intrusive thoughts—not just people with OCD. The brain is
    like a popcorn machine, churning out all sorts of thoughts, estimated by some
    neuroscientists to be as many as fifty thousand a day. Among all this popping
    there are some pretty weird and scary thoughts. In fact, probably about half of
    the thoughts that get popped on a daily basis are in the unpleasant category,
    having to do with how something could go wrong.


    If your monkey mind is hardwired to be extra sensitive to threat, it will view
    these thoughts as evidence that there is something wrong and you are in danger.
    Suddenly, what was a random piece of popcorn becomes a killer kernel and your
    monkey sounds the alarm.


    ![Image](Images/11-2.jpg)


    ## Monkey Miscalculations


    No matter how horrific, how crazy, how embarrassing and shameful your obsessive
    thought may be, the thought is not the problem. Your interpretation of the thought
    is what gives it power. To your monkey, your having that thought means that something
    is wrong with you, that you might act on that thought, or that you must do something
    to prevent that thought from coming true. It makes the classic over/under monkey
    miscalculation.


    1. It overestimates the threat that something terrible will happen to you or someone
    you love, or that you will actually act on a destructive thought that you have.

    2. It underestimates your ability to tolerate the anxiety or discomfort that you
    will feel if you do not do your compulsions, as well as your ability to cope if
    something bad actually does happen.


    The other monkey miscalculation that matters with OCD is `intolerance of uncertainty`.
    Even if there is a 1 percent chance that something could go wrong, you should
    try to prevent it. When you do a compulsion to make things safe, doubt creeps
    in. No matter how far you go to make things absolutely 100 percent safe, the monkey
    mind will doubt whether you have done enough. There is simply no amount of risk
    that is acceptable to the monkey mind. With OCD you can never know you are safe.


    *   You washed your hands, but then you touched the faucet. Your monkey says,
    `Others with dirty hands have touched that faucet! You should wash your hands
    again`.

    *   You unplugged the curling iron. Your monkey says, `But what if you unplugged
    something else instead? You should go back and check`.

    *   You know you are attracted to the opposite sex, but you happened to have the
    thought that you might be gay. Your monkey says, `You need to think about this
    to figure it out`.

    *   You said goodnight to your parents, but you got interrupted. The monkey mind
    says, `If you don’t get it right, something bad could happen to them. Say it again`.


    Once you’ve spotted your OCD monkey and its miscalculations, I’m not going to
    encourage you to come up with alternative thoughts as we do with other types of
    anxiety. The reason for this is that no matter how accurate an alternative thought
    might be, your monkey mind will cast doubt on it. With OCD your monkey’s intolerance
    of uncertainty is so high that it will cast doubt on your alternative thoughts
    too.


    ## The OCD Avoidance Cycle


    Random anxious thoughts become obsessive thoughts only when the monkey mind interprets
    them as important. When it sounds the alarm and you are flooded with anxiety,
    you do what everyone with anxiety tries to do—avoid it.


    That’s where your compulsions come in. To get some relief from the anxiety, you
    perform little rituals that either distract you from the terrible thought or give
    you the illusion that you are preventing it from coming true. If your obsession
    is around a fear of germs, washing your hands eases the anxiety. The obsession
    loses its hold on you and you can relax. If that were the end of it, life would
    be easy.


    The problem is that avoiding anxiety is always, at best, a short-term solution.
    While you get a few minutes of relief, you are only postponing the pain and ultimately
    making it worse. Why? Because of monkey logic.


    When your monkey sees you washing your hands it says, `I was right; those germs
    I warned you about are dangerous`. When your monkey sees your relief after you
    wash your hands it says, `You washed your hands and you are relieved. Therefore
    washing your hands in the future will keep you relieved`. When your monkey sees
    you didn’t get sick it says, `Because you washed your hands you didn’t get sick`.


    ![Image](Images/11-3.jpg)


    Here are some more examples of monkey logic at work with OCD:


    *   **Obsession:** `What if I run over and kill someone?`

    *   **Compulsion or avoidance:** Avoid busy intersections, and don’t drive with
    music on. Check your rearview mirror or retrace your route to see if there are
    any bodies in the road.

    *   **Monkey logic:** `Because you are extra careful and check your mirrors and
    routes, you have not hit anyone.`

    *   **Obsession:** `What if I am gay and don’t know it, and my whole life is a
    lie?`

    *   **Compulsion or avoidance:** Reassure yourself that you have always been attracted
    to the opposite sex. Avoid looking at attractive people of the same sex or having
    any physical contact with them. Check your body for signs of arousal around them.

    *   **Monkey logic:** `Because you mentally review the evidence that you’re not
    gay, you can be certain that you’re still straight.`

    *   **Obsession:** `What if I bring home germs that could make me or people in
    my family sick?`

    *   **Compulsion or avoidance:** Avoid touching things that other people have
    touched. When you have touched things in public places, wash your body, clothes,
    and belongings.

    *   **Monkey logic:** `Because you are so careful with your washing rituals, no
    one in your family has gotten seriously ill.`

    *   **Obsession:** `What if I were to forget something important and because it
    I missed an assignment and got a bad grade? If things are not right, I might feel
    forever.`

    *   **Compulsion or avoidance:** Check your backpack repeatedly to make sure you
    haven’t forgotten something or left something behind. Keep your room organized
    so that you can relax.

    *   **Monkey logic:** `Because you check and recheck your backpack and keep your
    room organized, you don’t forget anything and are safe.`


    You cannot reason with the logic of the OCD monkey. It always says the same thing:
    `You are safe because you avoided thinking thoughts, and if you did them, you
    did your compulsion to keep them from coming true.`


    Every time you try not to think an obsessive thought you train your monkey that
    the thought is dangerous. You are telling it, `You are right to sound the alarm.
    I should not think terrible thoughts like that!` You are giving your monkey a
    banana.


    Every time you perform a compulsion to keep an obsessive thought from coming true
    you are telling it, `Thanks for saving me from certain disaster, monkey!` Once
    again, you are giving it a banana.


    This is why your obsessions get more powerful over time and your compulsions get
    increasingly complicated and time-consuming the more you use them. The only way
    to stop OCD from taking over your life is to start treating your obsessive thoughts
    as what they are—unimportant—and your compulsive rituals as what they are:unnecessary.


    ## Tools to Rule the OCD Monkey


    That’s worth repeating. The only way to stop OCD from taking over your life is
    to start treating your obsessive thoughts as what they are—unimportant—and your
    compulsive rituals as what they are—unnecessary.


    How can you treat your obsessive thoughts as unimportant? Simply by not avoiding
    them anymore, by exposing yourself to them.


    You may say to yourself, `But I’m exposed to obsessive thoughts all the time.
    That’s the problem!` This is not true. Since you’ve had no control of the thoughts
    themselves, you’ve been trying to avoid anything or any situation that might trigger
    the thoughts. And when that is not possible you have tried to get rid of the anxiety
    the thought caused by doing compulsions.

