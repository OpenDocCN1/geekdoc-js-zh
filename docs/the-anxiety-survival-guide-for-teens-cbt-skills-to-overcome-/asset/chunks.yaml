    `Jarod` 直到九年级一直都很自信外向，直到那时他开始感到局促和害羞。有一天，他向一群朋友讲了一个笑话，其中一个人感到被冒犯了，说这个笑话带有种族歧视。Jarod
    感到被羞辱和羞愧。从以后，他开始在说话之前仔细考虑自己要说的话。他想确保自己在日常对话中不会冒犯到任何人。因为他需要计划自己说的每一个字，他在对话中变得落后，也变得越来越沉默。到上高中时，他觉得只有在派对上喝酒时才能做回自己。但即便如此，他第二天醒来时也经常会想自己晚晚上说的话或做过的行为，总是伴随着同样的羞愧感。


    Jarod 患有社交焦虑——害怕做或说某些会导致他人嘲笑或拒绝自己的事情，从而导致尴尬、羞辱和羞愧感。社交焦虑是最常见的焦虑类型，影响着每二十名青少年和成人中的一个。许多患有社交焦虑的青少年一生都很害羞；另一些像
    `Jarod` 这样的人，童时期很外向，但在初中或高中期间变得害羞或患有社交焦虑。


    以下是一些让许多青少年感到格外焦虑的常见情况。你能对其中任何产生共鸣吗？


    *   开始或维持对话

    *   在课堂上回答问题

    *   约人约

    *   向老师提问或寻求帮助

    *   参加派对、舞会或其他社交活动

    *   脸红、发抖、出汗或其他焦虑迹象

    *   在他人面前吃饭或写作

    *   参加体育课

    *   邀请朋友聚会

    *   在课堂上报告或朗读

    *   在他人面前表演

    *   使用学校或公共浴室


    ## 归属感


    在整个历史上，人类都是群居动物。我们结群狩猎，成群地采集坚果和浆果，以部落或家庭的形式旅行。在群体中，我们有更大的机会获得食物并保持温暖和安全。事实上，个体在荒野中独自生存无法维持多久。自然地，我们的祖先学会了不会让自己被踢出群体的行为。


    现代青少年也想要融入集体。如果你被同伴拒绝，你不会被狼吃掉、被饿死或冻死，但仍需付出代价。社区和个人联系对于幸福和健康至关重要。因此，一点点焦虑是适应性的。如果你在社交失误时感到有些担心——至少足以让你从中学习——那么你更有可能蓬勃发展。


    但如果你像 `Jarod` 一样，`all time` 都在害怕“搞砸”了呢？如果你觉得你出的每一个动作都在被审判，你说的每一句话都在被嘲笑——仿佛你去哪里都像在舞台上，在聚光灯下为一群极具批判性的观众表演？社交焦虑可能会让你在学业、工作和社交生活中陷入瘫痪。


    你感受到的焦虑是正常的“战斗或逃跑”反应。你的神经系统正在执行它被设计的功能，即它对所有威胁你安全的因素所所做的。除了一点：你并没有处于危险之中。是一只猴子在拉警报。


    你的猴子脑的任务是确保你的安全，从猴子的角度来看，如果同伴不认可你，对来说是非常危险的。如果你正在阅读这一章并发现自己像 `Jarod`，那么很有可能有一只加班工作的猴子脑。


    ## 驯服社交焦虑的工具


    正如你所知，你无法简单地丢掉焦虑的想法。你的猴子脑是一项内置的安全功能，它会一直存在。但这并不意味着你必须接受猴子对你周围一切的判断。你可以质疑猴子的想法，并开始打破你的回避循环。要质疑那些想法，你必须先知道它们是什么。你必须识别出你的猴子。


    ### 识别想法


    在“识别猴子”时，可以问自己的几个好问题有：`我害怕什么？这说明我是怎样的人？别人会怎么看我？如果这是真的，最坏的情况是什么？`


    `Jarod` 选了一个让许多青少年焦虑的情况——想和教室里坐在旁边的女孩聊天。以下是他对那三个问题的回答：


    ![Image](img/6.jpg)


    为了帮助你识别自己的想法，请从 `http://www.newharbinger.com/32431` 下载“社交焦虑识别想法”工作表。


    ### 猴子的误判


    尽管猴子的喋喋可能听起来真实且准确，但它包含的野性猜测多于事实。社交焦虑中常见的误判类型有以下几种：


    #### 读心术


    猴子脑对批评如此敏感，以至于它想象别人正在对你进行批判性的！例如：


    *   *他觉得你很无聊。*

    *   *她觉得你听起来像个骗子。*


