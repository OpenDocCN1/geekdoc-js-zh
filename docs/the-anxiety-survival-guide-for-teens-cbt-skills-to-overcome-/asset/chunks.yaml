  trans: '


    - **猴子的错误判断：** 灾难化

    - **替代性思维：** *更有可能他不回我的信息是因为这些信息让他很烦，而不是因为他要和我分手。*

    - **情况：** 罗伯托（Roberto）正飞往亚利桑那州。

    - **猴子的“万一”想法：** *如果飞机坠毁了他死了怎么办？*

    - **猴子的错误判断：** 对不确定性的不忍

    - **替代性思维：** *我可以承担这个风险。我不需要因为害怕就随他去或者要求他不去。*


    一旦玛丽亚（Maria）想出一些替代性思维，她的情绪并没有消失，但不再那么无所措了。替代性思维帮助她与自己的猴子大脑拉开了一距离，这是一个非常重要的第一步。现在花点时间为你自己的猴子杂语想一些替代性思维。改变思维是为接下来最好的准备方式：改变行为。你可以在
    `http://www.newharbinger.com/32431` 下载一份替代性思维工作表。


    ## 掌控分离焦虑猴子的工具


    你准备好停止遵循你猴子的规则，开始遵循你自己的规则了吗？说起来容易做起来难。你需要放弃一直以来用来回避行为，以避免面对你所恐惧的分离。这在短期内会让你感到焦虑得多。掌控你的猴子需要巨大的勇气和投入。这对你来说值吗？


    ### 人生指南针


    为了回答这个问题，请尝试另一个纸笔练习。写下你的猴子为了让你管理分离焦虑而让你所做的做的行为。这些行为对你有效吗？


    接下来，写下所有你想能够做的事情。其中是否有什么是值得为之奋斗的？


    以下是玛丽亚想出的内容：


    写下这些事情就像拿着一个人生指南针。它告诉玛丽亚需要走向哪个方向，她的真北。她跟着她的猴子向南走了太久了。在她的心里，她觉得自己有勇气去遵循自己的人生指南针。


    你有足够重要且值得奋斗的目标吗？如果有，请继续阅读。面对恐惧并改变行为是夺回生活的极有力的方式。但就像大多数值得为之奋斗的事情一样，这是一项辛苦的工作。


    你可以在 `http://www.newharbinger.com/32431` 下载一份人生指南针工作表。


    ### 最坏情况假设


    卷起袖子，准备迎接第一项辛苦的工作：想象最坏的情况。没错，你的任务是闭上眼睛，想象关于你所依恋的人或某些人，可能发生的最糟糕的事情。


    你可能在想，*这绝对没有帮助！我总是想象最坏的。这就是为什么我不断给他发信息或给她打电话，为了确保最坏的情况没有发生！*


    ![Image](img/10-4.jpg)


    事实是，每当你根据一个焦虑的猴子想法而行动以确保最坏的情况没有发生时，你的猴子就赢了。实际上，你是在说那个想法很重要，必须采取行动。你认同了你猴子的灾难化思维。你在说你无法忍受不确定性。你在说：“你说完全对，猴子！”，并给了它一根香蕉。


    要停止回避循环，你需要想象最坏的情况——你的男朋友受伤或去世，你的女朋友恨了你，任何对你听起来最糟糕的事情——并接受它。不要据此行动。不要去。只是与一个令你恐惧的想法待在一起。


    在这次练习中，你不会遵循你猴子的剧本。你是导演，而不是你的猴子。你将写出一个你最恐惧的虚构情景，一部真实的恐怖电影。你会在剧本中想要大量血腥的细节，因为重点在于尽可能地感到焦虑。为了让它听起来真实，请用现在时书写。例如，你可以这样开头：*我正在等妈妈来学校接我，我听到远处传来警报声……*


    当然，这只是开始。问问自己，如果妈妈来接你迟了，最坏意味着什么。这能帮助你触及恐惧的核心——例如，她忘记了你，你会站在学校门口直到深夜；或者她发生了车祸，正在医院或已经去世了。这就是你需要的那种最坏情况假设。


    以下是玛丽亚设想的情景：


    *罗伯托没有回我的信息！我的心跳得很快，手心出汗。我感觉到有些不对劲。我给他发信息说我很担心，请请务必告诉我他无事，但他还是没有回我。流过的每一分钟都像一个小时。他没有回信息！我知道他正和朋友在一起，他们开车得太快了，他们发生了车祸。他现在躺在街上，血流不止，身体破碎，无人帮助。他的手机就躺在他身边，上面有我所有的信息，但他太疼了无法拿起来。想到这些，泪水夺眶而出。他要死了，我无能为力。我再也见不到他了！我的生活被毁了！我永远永远无法忘记这次痛苦！*


    玛丽亚做得很好，不是吗？很多人很难想象灾难性的情况，尤其是当这些情况涉及爱人的伤害时。你一直从爱人那里寻求安慰的完全就是为了避免思考这类想法。


    请放心，为了面对恐惧而想象可怕场景并不等同于让它们发生。


