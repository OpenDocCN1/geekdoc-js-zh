- fmt: '

    Saturday morning, or any morning you are tempted to sleep late, is where you stop
    the cycle. To succeed at this you will need to ignore your monkey. Besides the
    jet-lag phenomenon, here are some other examples of monkey thoughts, along with
    facts that will help you develop your own alternative thoughts.


    * **Monkey thought:** `You only slept five hours! You’ll never win that cross-country
    race!`

    * **Fact:** You may do best when you get eight to nine hours of sleep. You feel
    well rested and you are able to concentrate normally. We call this `optimal sleep`.
    The other measure is `core sleep`, which is more like six hours. If you are able
    to get six hours of `core sleep`, you may not feel as good the next day, and you
    might be more moody or forgetful than usual, but you will perform as well on demanding
    tasks like sports, homework, and tests.

    * **Alternative thought:** `I won’t feel great, but as long as I got my `core
    sleep` I will do just as well in my race as I would if I had gotten `optimal sleep.`

    * **Monkey thought:** `You keep tossing and turning. You haven’t slept a wink!`

    * **Fact:** You are getting more sleep than you think. Teens tend to underestimate
    how much sleep they are getting by 20 percent. That means if you think you slept
    only five hours, you probably actually slept around six and a half hours. Why?

    * There are actually five separate stages of sleep. Stages `1` and `2` are very
    light; you are still somewhat aware of what is going on around you. Test subjects
    will report being awake during these stages, but the machines measuring their
    brain waves showed them as definitely asleep. `Stage 1` and `stage 2` sleep are
    very important and make up almost 50 percent of your total time asleep.

    * **Alternative thought:** `Even though I can hear things and I keep having thoughts,
    I am probably in stage 1 or 2. I am getting more sleep than it feels like.`

    * **Monkey thought:** `You did not get even five hours of sleep last night. You’re
    screwed!`

    * **Fact:** If you haven’t gotten your `core sleep` for a couple of nights, your
    body will automatically spend more time than usual in `stage 3` sleep, which is
    the sleep that helps you function the next day.

    * **Alternative thought:** `If it’s true that I haven’t been getting `core sleep`,
    I can trust my body to spend more time in the stage it needs most.`

    * **Monkey thought:** `You did not get enough sleep last night. You had better
    miss first period and sleep in!`

    * **Fact:** Getting up at the same time every day will help you sleep better in
    the long run. The more time you are awake and exposed to daylight, the more your
    demand for sleep will build, helping ensure a better night’s rest the next night.

    * **Alternative thought:** `Sleeping in will only cause more problems later on.
    It is important to get up at the same time to break the cycle of insomnia that
    I am in.`


    If you stick to your schedule for a week, your body will begin to fall into a
    healthy sleep pattern. Eventually you will gain enough confidence in your ability
    to sleep that you’ll be able to indulge in a more flexible sleep schedule. And
    just as important, you’ll be ruling the monkey instead of it ruling you!


    ## Anxiety and Depression


    Anxiety and depression are the most common mental health problems, and teens often
    experience both. This is because there is a cause-and-effect relationship between
    the two.


    As you know from reading this book, when you’re feeling anxious your monkey mind
    is coming up with a lot of reasons why you shouldn’t do certain things. When you
    avoid doing lots of things that, in your heart, you really want to do, over time
    you lose your belief in your ability to do them. You feel helpless and hopeless.
    Lack of motivation is the defining feature of depression.


    For example, if you avoid going to parties or other social events due to your
    social anxiety, you may begin to have thoughts like `I’ll never make friends or
    have a boyfriend or girlfriend.` If you avoid going on trips or to events where
    there are crowds of people because of your anxiety or agoraphobia, you may think,
    `I’ll have to live here with my parents and work a crummy job forever.`


    If you feel too anxious, tired, or unmotivated, you are missing out on doing the
    things that would help you feel better. This makes you even more anxious, tired,
    and unmotivated. You can get trapped in a vicious cycle of not doing things that
    might make you feel better, and then getting more depressed and feeling even more
    unmotivated.


    This book is all about facing your fears and gaining back your life. If you do
    the exercises in this book to cope with your anxiety, your depression may go away.
    In fact, one treatment for depression is to get the depressed person to do the
    things that used to give her enjoyment before she stopped doing them due to lack
    of motivation.


    Everybody knows the principle that motivation leads to action. If you are depressed
    it works the other way around: action leads to motivation (which leads to more
    action). Put another way, action and motivation work together like eating and
    hunger. You are hungry, so you eat. Eating nourishes you so that you stay alive
    and eventually get hungry again. People who are sick and don’t have an appetite
    are often encouraged to eat even if they don’t feel like it, because the nourishment
    will help bring their strength back. If you want to feel motivated you will need
    to jump-start the cycle by taking action even when you don’t feel like it.


    ### The Five-Minute Action Exercise


    Pick an activity that you have enjoyed in the past, or something that you would
    like to get done—something you don’t feel motivated to. It could be a physical
    activity like running, riding your bike, dancing, or drawing. It could also be
    a task like doing homework or cleaning your room. Whatever it is, take action
    and do it for just five minutes, no matter how tired or unmotivated you feel.
    If after five minutes you want to stop, then stop. But you may find that once
    you commit to doing something for five minutes you feel just a bit more motivated
    to continue. Activity is an antidepressant.


    In extreme cases of depression, some teens have thoughts about killing themselves,
    or even make plans to do so. If you are suicidal you need to get help. Suicide
    is a permanent solution to a temporary problem. No matter how miserable you feel
    now, things *will get better*. Don’t keep these thoughts and feelings to yourself!
    Tell a parent or friend, see your school counselor, or call a crisis line.


    This goes for all teens suffering from depression. It’s always a good idea to
    get help. Counseling and medication are effective in treating depression. See
    the appendix for more on how to get help.


    Most adults recall their teen years as a tough time, with bodily changes, peer
    and school pressure, and the expectations of adulthood approaching. As an anxious
    teen you may be having an especially difficult time. Remember that you are not
    alone, and that your life is important and worth fighting for. Like anxiety, depression
    can be overcome.


    Believe it or not, there is a bonus prize when you learn how to overcome anxiety
    and depression. Knowing how to jump-start your motivation by taking action will
    be very useful throughout your life, because no life is without setbacks and disappointments.
    All the tools you learn in this book are tools that you can use your whole life
    to get what you want and go where you want to go.


    So what are you waiting for? It’s time to take action!


    ## Appendix: Getting Extra Help


    ### Therapy


    This book is a self-help book. It explains what anxiety is and how to master it
    so that it doesn’t get in the way of doing what you want in life. But sometimes
    self-help is not enough. If you are having trouble following through with the
    exercises and challenges in this book, or if you are doing the exercises but don’t
    seem to be moving ahead, finding a therapist to work with may be what you need.

