    Kim 站在人生的十字路口。她以前是一个无忧无虑的人，喜欢和男朋友、朋友以及家人一起计划活动。现在，她最想的事情是再次发生恐慌发作，而她所有的计划都是基于如何避免它的发生。她讨厌在恐慌发作时要依赖父母来接她，也对如此依赖药物感到不适。以前，她喜欢独自做一些事情，但现在她只想待在让她认为安全的人身边。


    Kim 还经常经历许多类似恐慌的感觉，这些感觉让她感到越来越不适和精疲力竭。她一直处于紧张状态。生活失去了乐趣，她的世界也变得越来越小。仅仅知道恐慌感在生理上并不危险是不够的。Kim
    需要做些什么。但做什么呢？


    Kim 的问题在于，她对恐慌感受的新解释在缺乏新经验支持的情况下，仅仅是想法。除非她真正掌握了一次恐慌发作，否则她永远不会真正相信自己可以掌控恐慌。她必须停止回避循环，面对她最恐惧的那些感受。


    ## 掌控恐慌猴的工具


    世界上所有的工具都无法改变“面对恐慌是可怕的”这一事实。我们的第一个工具解决了一个大问题：*我因为回避恐慌而错失的东西，值得为之战斗吗？*


    ### 生命指南针


    Kim 失去了人生的方向感。顺从她的“猴子”并回避恐慌每次都让她走得南辕北辙。为了帮助她重新找到真正的北极，Kim 列出了一份她曾经拥有但因恐慌而失去的物品清单。


    ![Image](img/7-6.jpg)


    当她看着所有错失的东西时，Kim 觉得它们是值得为之战斗的，即使她感到害怕。你愿意为你所错失的东西战斗吗？这意味着你必须面对你最大的恐惧——你自己的生理感受。你不会只是坐在这里等待它们的发生，也许希望它们不要发生。你会有意识地去面对它们。是的，为了掌握恐慌，你必须有意识地引发这些感受。你将不得不刻意感受那些与恐慌相关的感受。


    你能听到你那只小猴子开始嚎叫了吗？它可能在告诉你，这是自原子弹以来最糟糕的主意，纯粹是愚蠢。你可以通过感谢你的猴子试图保护你的安全来承认它，同时意识到按照猴子思维行事的代价太高了——是时候夺回你生活的控制权了。记住，你并不是要跳进恐慌之池，而是通过细小的、可控的步骤涉其中。


    你可以在 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431) 下载生命指南针工作表。


    ### 挑战阶梯


    正如你在第 4 章中学到的，面对恐惧最好的方式是使用一把通向你想要生活的梯子。Kim 的目标都直指一个大思想：重新获得对药物的独立，并享受她一直喜欢做的事情。为了确定哪些挑战阶梯可以帮助她实现这些目标，她需要问的问题：*我一直在回避什么？*


    你实际上通过恐慌发作真正回避的是你自己的生理感受。Kim 识别了她的每种恐慌感受，并按照恐惧程度对其进行排序，10 分最可怕，1 分最不。以下是她的结果：


    *   胸部紧绷：10

    *   心跳加速：8

    *   头晕和眩晕：7

    *   发热和出汗：5


    为了让 Kim 能以有目的的方式、在她选择的时间和地点面对这些感受，她必须有意识地引发它们。以下是一些具体的练习以及它们可能引发的恐慌感受：


    *   **练习：** 过度呼吸。快速吸气和呼气持续十五秒到一分钟不等，期间简短休息。

    *   **效果：** 头晕；心率增加；心悸；胸部紧绷；感到发热出汗；感到寒冷潮湿；脸部、手和脚刺痛感；呼吸困难。

    *   **练习：** 进行任何剧烈运动，如开合跳或上下楼，持续二到五分钟。

    *   **效果：** 心率增加、胸部紧绷、感到发热出汗以及呼吸困难。

    *   **练习：** 将头放在膝盖之间来回摇动三十秒，然后迅速抬头。或者旋转（无论是坐在旋转椅上还是站立）三十秒到一分钟。

    *   **效果：** 眩晕、头晕、视觉变化。

    *   **练习：** 盯着镜子里的自己的嘴，一边反复重复一首童谣一到五分钟。或者盯着墙上的同一个点，眼睛不移开一到五分钟。

    *   **效果：** 视觉变化或一种疏离感或不现实感。


    在她的阶梯最低的一级，Kim 选择了最让她不焦虑的感受：“发热和出汗”。


    Kim 知道在有父母在边的家里面对恐慌会没那么难以应对，所以她从那里开始。以下是她完成后挑战阶梯的模样：


    ![Image](img/7-7.jpg)


    这是一个非常棒的第一个阶梯。一旦 Kim 能够到达顶端，她就可以为她一直在回避的其他感受制作一个类似的阶梯：眩晕和头晕。为了面对这些感受，她可以将头放在膝盖之间，摇动，然后迅速抬头。接下来，她可以转向过度呼吸。


    当然，这在计划中会比在执行中容易得多。但 Kim 下了决心，而且她有一个秘密武器可以尝试——迎接这些感受和焦虑。


    你可以在 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431) 下载恐慌挑战阶梯工作表。


    ### 接纳


    想象一分钟，你被扔进一片广阔的海。你挥动手脚踢水以防止沉没，起初似乎有效，但随着精力竭，效果恰恰相反。为了浮起来，你必须尽可能张开四肢并充满空气。当你面对第一个挑战时，你会开始感到不适或与恐慌相关的感受。你的本能会是紧绷身体、收缩胃、紧张肌肉并动起来。记住，不要对抗这些感受。对抗这些感受正是让你陷入困境的原因。你越抵抗，它持续越久。


    通过抵抗不适的感受，你在同意你的猴子认为这些感受是危险的。要掌握恐慌，要反过来，接纳你的不适的感受。


    ### 迎接呼吸


    正如你所学的，当我们感到焦虑时，呼吸变得浅而快。这种呼吸方式会产生各种生理变化，并产生增强感受的效果，导致你更加回避它们，呼吸变得更快、更浅。这种呼吸方式告诉你的身体你同意猴子的观点：*出错了！*


    为了迎接焦虑感受而不是回避它们，用相反的方式呼吸：


    1.  深呼吸，充盈肺部，让腹部变软并扩张。

    2.  完全呼气，让腹部收缩。

    3.  缓慢而有目的地重复。


    通过有意识地选择缓慢平稳地呼吸，你是在告诉身体：*我可以应对。*这种呼吸方式将帮助你度过剧烈和不适的感受波动。它还有一个额外的好处，即可以训练你的猴子——当你迎接它警告过的过的焦虑时，它拿不到香蕉了。


