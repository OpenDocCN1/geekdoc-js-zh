    Sound easy? To Shaneesha, doing this was very scary, but not impossible. It’s
    important to begin with a challenge that is, with a little courage and good preparation,
    manageable. Download a Challenge Ladder worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    The moment Shaneesha touched her backpack she could feel the pangs of fear. She
    wanted to wash her hands so badly, but with the help of some deep breaths and
    some “Thank you, monkey”s she walked past the bathroom toward her grandmother’s
    bedroom. Shaneesha’s monkey howled its little head off, conjuring up images of
    her grandmother getting sick, on her deathbed, even at her funeral. Her monkey
    reminded her it would be all her fault and her whole family would blame her and
    her life would be ruined.


    Shaneesha took a deep breath and touched her grandmother’s doorknob. The fear
    felt like a punch in the stomach and her heart was beating wildly. It was all
    she could do to keep herself from running back to find her hand sanitizer. But
    she kept focusing on her breath and reminding herself that she was willing to
    take this risk. She knew that if she did not, her OCD monkey would continue to
    rule her life.


    After a very uncomfortable half hour of touching various surfaces, Shaneesha noticed
    that her anxiety had decreased by about half, without her resorting to her usual
    compulsions! It seemed impossible, but it was true—her anxiety was coming down
    on its own. Every day for a week she repeated her experiment, and it became easier
    and easier. Not only was she feeling less anxious, but her obsessions became more
    and more ridiculous to her. Nothing terrible happened.


    This experience gave Shaneesha confidence to continue up her ladder, until finally
    she got to the top rung: a trip to a hospital waiting room. She sat in a chair,
    read magazines, and touched things just as anyone would do. When she got home,
    she did wash her hands once quickly, but that seemed like what someone without
    OCD would do, and she did not change her clothing the whole rest of the day. She
    went to the waiting room six more times, and by the end of her practice she felt
    terrific! Her hands were no longer raw and chapped from constant washing. She
    was no longer wasting time and energy on her compulsions. The real Shaneesha was
    back!


    Whenever her old obsessive thoughts popped up—and they always do—Shaneesha thanked
    her monkey and reminded herself not to give in to the urge to wash. She knew that
    this was a risk that most people take all the time.


    I hope you will find the courage to stop avoiding, and to welcome your obsessive
    thoughts and the anxiety that comes with them. If you don’t feel you can tackle
    your core fears or challenge ladder alone, don’t be afraid to ask for help. (For
    more on the kinds of help you might get, see the appendix.) You already know where
    doing compulsions leads—to more obsessions. When you stop the avoidance cycle,
    you will be faced with nothing more than feelings—feelings that you *can* tolerate.


    When you welcome your anxiety and allow yourself to feel it, your monkey’s logic
    is going to change. It will sound more like You accepted the thought and you are
    safe. The thought must not be so dangerous after all. That’s the chatter of a
    tame monkey, the kind you can live with without giving up your dreams.


    Of course, there will always be that tiny sliver of a chance that a scary thought
    will come true. There will always be risk in life. But I know you’ll find that
    living with a little uncertainty is better than living with OCD!


    # Chapter 12


    ## Other Issues


    ### Insomnia and Depression


    Nighttime can be a challenging time for anxious teens. It’s the time of day when
    there are no distractions. There’s nothing to do, nothing to look at, nothing
    to listen to. It’s a time for your body to relax and shut down. But there’s one
    little part of you that is still working. This part never sleeps. It’s burning
    the midnight oil, on the job `24/7` to keep you safe from harm. Yes, it’s your
    monkey mind!


    Historically there’s a good reason for your monkey mind to be on the alert at
    night. From the dawn of time humans have been most vulnerable after dark. When
    an aborigine fell asleep, he was not prepared to fight or flee if attacked by
    a predator or hostile tribe. Listening for strange sounds and watching for movements
    in the dark was necessary for our ancestors’ survival.


    Here we are thousands of years later, and there are no saber-toothed tigers prowling
    in the dark, and we have sturdy walls and locked doors protecting us. Hypervigilance
    at night is no longer so important. But if you have a hyperactive monkey, who’s
    extra sensitive to danger, it will find plenty of threatening things for you to
    worry about. `It’s 1:00 a.m. and you’re still awake. You’ll never get to sleep!
    You are going to flunk your test tomorrow!` Sound familiar?


    Monkey thoughts may sound compelling when you are alone in the dark in the middle
    of the night, but it is important to remember that the monkey mind part of your
    brain is designed only for spotting potential threats, not for evaluating them.
    Your monkey is correct about the time, and that you will not be getting as much
    sleep as you might want, but it can only guess about when or if you will fall
    asleep and about the results of your test tomorrow. Monkey thoughts are full of
    miscalculations—the most common of which is over/underestimating.


    Your monkey, in its concern about your getting enough sleep, always overestimates
    how much sleep you need to function and how poorly you are sleeping. It also underestimates
    how much sleep you are getting and how well you will cope with less sleep the
    next day.


    There are other miscalculations here that give it away as a monkey thought. Predicting
    that you will never get to sleep is assuming the worst possible scenario, or *catastrophizing,*
    as is predicting you will flunk the test. Ignoring the sleep you actually get
    is *discounting the positive*. You can review these and other miscalculations
    in chapter 3.


    Here’s another monkey thought you’re probably familiar with: `You’re exhausted.
    You’d better sleep in this`. But is that a monkey thought? If you’ve been struggling
    all week, not enough sleep, it sounds utterly sensible. If you follow that advice
    you’ll get short-term relief for. But in the long run, “catching up” on sleep
    this way actually makes the problem worse.


    Sleeping late on weekends upsets your body’s internal clock. It is like flying
    from California to New York for days every week. Getting up three hours later
    means it will be time to go to bed three hours sooner than you’re ready. It’s
    just like having jet lag.


    After a week of nights spent tossing and turning, getting up at a set hour on
    Saturday morning is both counterintuitive and difficult. But you need to get up
    out of bed, regardless of how well you slept the night before. Your day may be
    a struggle but it will be worth it, because you’ll be building up a sleep demand
    for that night, making it more likely that you’ll get a good night’s rest.


    By urging you to roll away from the morning sun and pull the covers over your
    head, your monkey mind is miscalculating the threat, overestimating how exhausted
    you really are and underestimating your ability to get through the day without
    more sleep. It’s so easy to go along with that miscalculation. After all, who
    wants the anxiety of facing another day not being at your best?


    The problem is, if you give in to your monkey mind and sleep in, your monkey will
    take credit for your survival that week. It won’t notice that, because of your
    Saturday and Sunday sleep-ins, you trouble getting to sleep on Sunday night; and
    it won’t notice how the whole sleepless-week, sleep-in-weekend cycle starts over
    again.

