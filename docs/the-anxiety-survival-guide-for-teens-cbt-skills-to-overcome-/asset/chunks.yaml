  trans: '


    掌握焦虑就像学习一项运动。你可能会读到关于游戏规则以及你为了精通它需要练习什么，但你仍然需要一位教练。治疗师就像教练。他们与你一起努力，培养你所需的技能，并鼓励你去练习和应对那些特别困难的挑战。


    本书基于认知行为疗法（`CBT`）、接纳与承诺疗法（`ACT`）以及正念。`CBT` 关注思想、情感和行为之间的关系。`CBT` 治疗师会帮助你识别并挑战那些让你更加焦虑的“猴子思维”，并改变那些让问题恶化的行为。`ACT`
    是 `CBT` 的一种类型，它更多关注改变行为，较少关注改变思想。`ACT` 的目标是识别你的价值观和目标，并致力于采取引导你走向更丰富、更有意义生活的行动。“正念”是一个广术语，指的是用于自我发现和促进健康的古代工具，这些工具在今天变得越来越重要。


    `CBT` 和 `ACT` 对所有的焦虑问题都非常有效。如果你决定去看治疗师，请寻找接受过 `CBT` 或 `ACT` 培训的人员，这样他或她就可以指导你使用在本书中学到的技能。


    ## 如何向治疗师提问


    你会希望和你见到的治疗师感到自在。你有权可以提问，以确保你选择的治疗师与你契合，并且在治疗你想要解决的问题方面有经验。


    以下是一些很好的问题，可以帮你找到能够帮助你的治疗师：


    *   你在认知行为疗法方面的培训是什么？（治疗师理想情况下能够谈论他们参加过的研讨会、受过其指导的临床医生、所属的组织以及持有的 `CBT` 证书。）

    *   你在治疗焦虑方面的培训和背景是什么？（请确保询问你所患的特定焦虑类型。有时治疗师对某一种焦虑（如 `OCD`）更有经验，但对另一种（如恐恐发作）没那么经验。）

    *   你目前的执业有多少比例涉及治疗焦虑？（再次询问你的具体类型。）

    *   你认为你在治疗焦虑方面效果有效吗？

    *   你使用哪些技术来治疗焦虑？（这些技术是否帮助你识别无益的想法，并采取帮助你面对恐惧的步骤？）

    *   如有必要，你是否愿意离开办公室帮助我面对我的恐惧？（你的一些挑战可能需要你和治疗师进入特定的、引发焦虑的处境。）


    ## 关于药物


    如果你经历着极度焦虑并影响了你的正常功能——例如无法出门上学或无法完成书中的练习——你可能想与医生讨论药物。开具焦虑药物的医生通常是家庭医生、全科医生或精神科医生（专攻心理健康的医生）。


    在尝试药物的人中，将药物与 `CBT` 结合的人获得的效果最好。这是很有道理的。药物可以帮助降低你的整体焦虑，而治疗法教你在现在和长期范围内掌握焦虑的技能。这样，当你停止服药时，焦虑复发的的概率会大大降低。如果你只依赖药物，当你停药时，焦虑很可能会再次回来。


    治疗焦虑的药物基本上有两种类型：抗抑郁药和苯二唑类药物。


    ### 抗抑郁药


    你可能奇怪为什么给焦虑开具抗抑郁药。原因是这种药物在脑中减轻抑郁的作用机制同样也能减轻焦虑。此外，正如我之前提到的，焦虑症患者同时患有抑郁症并不罕见。这些药物可以帮助解决这两个问题。


    最常见的抗抑郁药类型被称为选择性血清素再摄取抑制剂，或 `SSRIs`。血清素是一种影响情绪大脑化学物质，这些药物通过增加血清素水平起作用。它们还作用于大脑中影响情绪的其他化学物质。常见的
    `SSRIs` 包括 `Prozac`、`Paxil`、`Celexa`、`Zoloft`、`Lexapro` 和 `Luvox`。有时使用的其他抗抑郁药还有
    `Effexor`、`Cymbalta`、`Serzone` 和 `Remeron`。


    `SSRIs` 有优缺点。


    **优点：**

    *   大多数人发现吃药很容易。

    *   这些药物没有成瘾性。

    *   因为你是每天服用这些药物，而不是只在感到焦虑时，所以它们被用来回避的可能性较低。


    **缺点：**

    *   可能会有副作用。最常见的包括恶心、腹泻、便秘、嗜睡、紧张、口干、头痛、颤抖以及性影响（如性欲降低或难以高潮）。其中许多副作用会随着时间的推移而减轻。

    *   这些药物可能需要四到八周才能产生明显的效果。

    *   停药可能会导致不适症状，如头晕、恶心、睡眠困难或流感症状。如果你在停止这些药物时在医生的指导下慢慢减剂量，这些效应会减轻一些。

    *   当你停止服用这些药物时，焦虑症状通常会回来。


    ### 苯二唑类药物


    苯二唑类药物是在身体和大脑中作用非常快的松弛剂。人们通常在感到焦虑或恐慌，或者在进入令他们焦虑的环境时服用它们。


    常见的苯二唑类药物包括 `Xanax`、`Valium`、`Ativan` 和 `Klonopin`。


    服用苯二唑类药物也有优缺点。


    **优点：**

    *   见效快。

    *   可以根据需要服用。

    *   它们不很贵。

    *   大多数人发现吃药很容易。


    **缺点：**

    *   可能会有副作用，如嗜睡、头晕、混乱和抑郁。

    *   如果与酒精混合使用可能是致命的。

    *   它们可能会产生生理成瘾。

    *   你可能会产生依赖，并将其作为回避焦虑的方式。它们可能会阻碍你面对恐惧并获得自信。


    **Jennifer Shannon, LMFT** 是《青少年害羞与社交焦虑手册》（*The Shyness and Social Anxiety Workbook
    for Teens*）的作者，加利福尼亚州圣塔罗莎认知行为疗法中心的联合创始人。她是认知治疗学院的成员。


    插画家 **Doug Shannon** 是一名自由漫画家。


