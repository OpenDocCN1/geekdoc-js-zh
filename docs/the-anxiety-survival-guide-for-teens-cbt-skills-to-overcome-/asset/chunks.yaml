    Introduction


    # You Are Not Alone and You Are Not to Blame


    Teens who suffer from anxiety often think of themselves as weak, stupid, or any
    of many other negative labels. You may think you are the only one who feels things
    this way and that everyone else is normal.


    The thing is, normal doesn’t exist. Everyone feels anxiety, and in a surprising
    variety of situations. Some feel it in a crowded cafeteria, others in an empty
    hall. Many people panic giving an oral report while others feel panic at random
    times for no apparent reason. The star quarterback who shouts audibles loud enough
    to be heard above the roaring crowd may get so anxious around the girl he’s attracted
    to that he is unable to string two words together. Depending on the situation,
    almost everyone can feel overwhelmed with anxiety.'
