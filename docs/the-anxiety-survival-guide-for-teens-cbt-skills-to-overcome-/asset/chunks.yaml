    All the work you do identifying your monkey thoughts won’t help if you continue
    to play by your monkey’s rules. Every time you respond to a monkey alarm by avoiding
    the supposed threat, you are in effect giving it a banana. To rule your monkey
    you must ignore its false alarms and actually move toward what you are afraid
    of. This will not be easy. In fact, it may be the hardest thing you’ve ever done.


    # Life Compass


    Perhaps this is a good time to ask yourself whether overcoming your phobia is
    important enough for you to tolerate the anxiety that will come up in the process.
    What is your avoidance costing you? What are you missing out on? Are these things
    worth fighting for?


    Trish was afraid of spiders, and she came up with the following list of things
    her fear cost her:


    ![Image](Images/8-5.jpg)


    Trish decided it was worth it to begin to face her fear of spiders. Not being
    able to go camping with friends was the deal-breaker.


    Dan was afraid of elevators. His list looked like this:


    ![Image](Images/8-6.jpg)


    He decided it was not really worth it to face his fear. He was able to avoid elevators
    pretty easily, and although his fear was embarrassing, his friends still liked
    him.


    Here’s Anton’s list:


    ![Image](Images/8-7.jpg)


    For Anton, the decision was clear. His phobia affected him every day, everywhere
    he went. It would be worth facing his anxiety to be able to hang out with his
    friends, eat at restaurants, and go on long car trips. Anton was ready to start
    ruling his monkey.


    To help you decide whether it’s worth it to face your phobia, you can download
    a Life Compass worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    # The Challenge Ladder


    If you have a fear of heights you won’t go straight to the Grand Canyon and stand
    on the edge. If you’re afraid of bees you won’t start out by visiting a bee farm.
    Ruling your monkey is best accomplished by taking small, manageable steps toward
    what you are afraid of—like climbing a ladder.


    ![Image](Images/8-8.jpg)


    Each step on your ladder will be a challenge that you can meet without being overwhelmed.
    As you meet each challenge you will learn to ignore the howls of your monkey and
    gain confidence in your own assessment of the danger.


    Anton’s fear of vomiting was so overwhelming that even hearing or saying the word
    made him anxious. That sounded like a good challenge for the first rung of his
    ladder.


    Here are some ideas for challenge ladders for other types of phobias:


    ## Fear of Animals

    *   Looking at pictures, cartoons, or color photos of an animal you’re afraid
    of

    *   Listening to recorded sounds of the animal—such as a dog growling or barking,
    a snake hissing, or birds chirping

    *   Watching videos of the animal

    *   Going to a pet store

    *   Looking at the animal when it’s contained in some way (such as a dog on a
    leash or a snake or rodent in a glass container at a pet store)

    *   Touching the animal


    ## Fear of Heights

    *   Standing on a chair

    *   Climbing a ladder

    *   Climbing a tree

    *   Going up the floors of a building, one at a time

    *   Looking down from a high building through a window, then from an open window,
    then from a balcony

    *   Going on a Ferris wheel


    ## Fear of Storms

    *   Looking at pictures of storms and lightning

    *   Listening to sounds of rain, thunder, and lightning

    *   Looking at videos of rain, thunder, and lightning

    *   Standing by an open window while it is raining or storming outside

    *   Going outside when it’s cloudy, then when it’s raining, then during a thunderstorm


    ## Claustrophobia, or Fear of Being Trapped

    *   Going into a closet with the door open

    *   Going into a closet with the door closed

    *   Wrapping a blanket tightly around yourself

    *   Putting a heavy blanket over your head

    *   Standing in an elevator with the doors closed for a long period of time

    *   Sitting in the back seat of a car with only two doors

    *   Going into an attic or crawl space


    ## Fear of Doctors, Blood, or Needles

    *   Reading or listening to words like “blood,” “injury,” “shot,” “needle,” “syringe,”
    “dentist,” “drilling,” “doctor,” and “surgery”

    *   Looking at cartoon pictures then actual color photos of blood or needles

    *   Going to dentists’ or doctors’ waiting rooms, or visiting a hospital

    *   Making fake blood, putting it on your body or someone else’s body, and looking
    at it

    *   Going to a blood drive and watching blood getting drawn

    *   Looking at and handling syringes or dentist’s tools

    *   Reading about medical procedures, or watching TV shows or movies about them

    *   Watching someone get blood drawn, getting your blood drawn, or getting a shot

    *   Sitting in a dentist chair, getting your teeth cleaned, or getting a cavity
    filled


    You can download a Challenge Ladder worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    # Applied Tension


    If you have ever fainted or felt light-headed or dizzy at the sight of needles
    or blood, it is very likely that you experienced a sudden drop in blood pressure.
    It would be a good idea to see a doctor to make sure there is nothing else going
    on. You can make yourself less susceptible to passing out at the sight of needles
    or blood by using `applied tension`.


    ### Applied Tension Instructions

    *   Sit in a chair and tense your arms, legs, and stomach. You can tense your
    arms by making fists and holding your arms bent at your sides. And you can tense
    your legs by sticking them out in front of you. For your stomach, imagine that
    someone just threw a ball at you and hold your muscles tight. Do these all at
    once and hold for ten to fifteen seconds, then relax for thirty seconds. Repeat
    this five times. You may feel pressure in your head when you do this. That is
    fine—it lets you know the exercise is working.

    *   Once you have done this for one week, you can start your challenge ladder,
    while at the same time practicing `applied tension`, you may discontinue doing
    it.


    Like Anton, you’ve been ruled by monkey thoughts for a long time, perhaps years.
    Learning how to tolerate the anxiety that comes when you stop avoiding will take
    practice, so be patient with yourself.


    # Acceptance


    As you approach each challenge, you will likely feel the urge to “white-knuckle”
    it—holding your breath, gritting your teeth, and hanging on to the handrail, hoping
    to get through it as fast as possible. When you white-knuckle your way through
    a challenge, your monkey is still in charge. You are still avoiding what might
    happen and resisting getting too anxious.


    ![Image](Images/8-9.jpg)


    Your goal during each challenge is to completely accept whatever feelings come
    up. This is the exact opposite of everything you have been doing up until now.
    You’ve always avoided your phobia; your challenge now is to face your phobia instead.
    This means getting anxious on purpose—and when you do get anxious, to allow the
    anxiety to be there without doing anything to get rid of it. This is what we mean
    by acceptance—unconditional surrender.


    Your challenges will work much better if you go into them saying, I am ready to
    face this fear and I want to get as anxious as possible! This is very confusing
    for your monkey. You’ve been rewarding it for saving you from anxiety. Every time
    it predicts disaster and sounds the alarm, you’ve been giving it a banana. When
    you ignore the alarm and welcome anxiety you are playing by *your* rules, not
    your monkey’s!

