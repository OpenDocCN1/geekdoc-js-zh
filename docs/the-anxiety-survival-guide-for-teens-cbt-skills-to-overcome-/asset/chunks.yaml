    ## Jarod 的梯子


    ![Image](img/6-6.jpg)


    你可能在想，为什么 Jarod 要费尽这些精力去计划这些场景。难道这些机会不会很快自然出现吗？是的，而且当它们真的出现时，Jarod 的“猴子”就会拉响警报，在
    Jarod 有机会正确解读情况之前，就让他进入了战斗或逃跑模式。


    与其让猴子带给你惊喜，不如你给它一个惊喜。不要等待挑战到来。要主动寻找并迎接它！


    你可以在 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431) 下载一份“挑战梯子”工作表。


    ## 专注注意力


    当你处于一个让你感到焦虑的情境时，猴子的嘈杂会占据你大量的注意力。你对身体的感受也会变得异常敏感，比如心跳、出汗、脸红或感到恶心。如果你把所有的注意力都放在这些事情上，会放大它们的影响。


    ![Image](img/6-7.jpg)


    `Focused attention`（专注注意力）是一种正念练习，可以帮助即使在最可怕的情况下也能保持冷静和专注。通过选择关注身体之外的事物，你可以减少内在感受到的焦虑感。通过选择关注他人，你可以把光焦点从自己身上移开。


    ![Image](img/6-8.jpg)


    *当 Jarod 在和一个女孩聊天时，他没有关注他的猴子告诉了他什么以及他感到多么焦虑，而是关注了她。他格外仔细地听她说的话。他特别注意了她的头发颜色、眼睛以及她穿的衣服。他惊讶地发现，当他关注她时，对话变得轻松了许多，而且在他看来，她也很欣赏这种关注。*


    想要练好将注意力从你的猴子大脑中移开，每天的练习至关重要。在你学习这项技能时，最好从你不不焦虑时开始练习。随着你变得越来越熟练，可以在对话和口头报告等场合使用它——即你梯子上的任何挑战。


    ## 完美主义的问题


    你的猴子还会试图欺骗你，让你对挑战的结果产生完美的预期，并据此做出判断。记住，你设定的目标是可以完成的，但它们具有挑战性，是因为它们会让你焦虑。这意味着事情不会进展得完美。


    如果 Jarod 的预期是听起来冷静自信且没有任何尴尬的沉默，那么他会如何评价自己在梯子第一级的表现——说“你好”并看看那个通过小组作业认识的男生会发生什么？如果他持有完美主义的预期，他几乎肯定会失败，并最终对自己感到非常糟糕。


    ### 设定现实的目标


    对 Jarod 来说，更现实的目标是微笑并说“你好”——*此为止*。如果另一个男孩回应并开始了对话，那太好了！如果没有回，或者 Jarod 脸红、出汗或说话结巴，那也没关系。


