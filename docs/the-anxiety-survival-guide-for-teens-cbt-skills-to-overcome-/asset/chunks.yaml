    请记住，你并不是在试图放松。放松技巧（例如想象自己处于一个宁静的海滩上）是基于这样观点：你的不适感是糟糕的且必须被停止。如果你曾经尝试过那种技巧，你就知道它不起作用。


    当你用呼吸迎接恐慌感时，无论你是发现自己焦虑减轻了还是加剧了并不重要。重点在于你接受了这些感受。你正在向自己证明，感觉糟糕并不危险。它仅仅是生活的一部分——是你当它出现时，你愿意去体验的一部分。这就是你掌控“猴子”并主恐慌的方法。


    Kim 在爬阶梯上付出了巨大的努力。在十二周内，她对恐慌发作的恐惧减少了很多。当恐慌感波动袭来时，她能够识别出它们是无害的。这并不意味着她喜欢它们，但它们不再像以前那样恐吓她。因此，她的恐慌发作次数少得多。事实上，它们已经不再那么像恐慌发作了。它们变得温和、频率更低，间隔也更长。


    Kim 的努力改变了她与焦虑以及她的“猴子”之间的关系。当她感到焦虑时，她会立刻进入她的迎接呼吸状态。通过学会接受恐慌，她掌握了它，她的世界也随之敞开了。


    拥有了知识和工具，你可以去任何你想去的地方。*你*想去哪里？你在等什么？


    ## 广场恐惧症


    `agoraphobia`（广场恐惧症）听起来有点可怕，而且经常被误解。大多数人将广场恐惧症理解为害怕离开房子。这种特定的恐惧可能是其中的一部分，但它并不是广场恐惧症的定义。


    广场恐惧症是指害怕在难以逃脱或令人尴尬的地方或场合，或者在可能无法立即获得帮助的情况下，发生某种袭击的恐惧。这可能是恐慌发作、大便或膀胱控制失控、头晕、昏厥、呕吐、哮喘发作、头痛或其他剧痛。换句话说，广场恐惧症是对害怕发作并被困住的恐惧。


    触发“被困住”恐惧的常见情况包括在飞机上、汽车里、桥上，或者在远离出口的电影院或教室里。这并不是害怕飞机坠毁或害怕桥的高度——那些属于特定的恐惧症。相反，一个患有广场恐惧症的青少年会害怕在飞机或桥上发作并被困住。


    一些患有广场恐惧症的人对吃药产生恐惧——再次，不是因为他们害怕窒息（这是一种特定的恐惧症），而是因为他们觉得药物一旦进入身体，他们就会困住，必须等待任何可能的副作用消失。广场恐惧症患者也经常担心自己离家、医院或洗手间有一定距离。他们也可能担心独自一人。在三个患有恐慌发作问题的人中，约有一个会发展为广场恐惧症。


    要让自己从广场恐惧症中解出来，你将使用与恐慌发作相同的步骤。不，等等，逻辑/上下文检查：要让自己从广场恐惧症中解出来，你将使用与恐慌发作相同的步骤。你可以从书末附录列出的其他资源了解更多关于广场恐惧症的信息。


