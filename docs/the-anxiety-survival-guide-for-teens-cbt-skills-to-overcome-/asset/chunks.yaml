    如果你继续按照猴子的规则行事，那么你在识别“猴子思维”上所做的一切都是徒劳的。每当你通过逃避所谓的威胁来回应猴子的警报时，你实际上是在给它一根香蕉。要统治你的猴子，你必须忽视它的虚假警报，并真正走向你恐惧的事物。这并不容易。事实上，这可能是你做过最困难的事情。


    # 人生指南


    也许现在是时候问自己，克服恐惧症对你来说是否重要到值得你忍受过程中产生的焦虑。你的逃避让你付出了什么代价？你错过了什么？这些事情值得战斗吗？


    Trish 害怕蜘蛛，她列出了以下她的恐惧让她付出的代价清单：


    ![Image](img/8-5.jpg)


    Trish 决定开始面对对蜘蛛的恐惧是值得的。不能和朋友去露营是致命的。


    Dan 害怕电梯。他的清单看起来如下：


    ![Image](img/8-6.jpg)


    他决定面对自己的恐惧并不真的值得。他能很轻松地避开电梯，虽然他的恐惧很尴尬，但朋友们依然喜欢他。


    这里是 Anton 的清单：


    ![Image](img/8-7.jpg)


    对于 Anton 来说，决定显而易见。他的恐惧症每天都在影响他，无论他去哪里。为了能够和朋友一起玩、在餐厅吃饭以及进行长途自驾，面对焦虑是值得的。Anton
    准备好开始统治他的猴子了。


    为了帮助你决定面对恐惧症是否值得，你可以从 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)
    下载“人生指南”工作表。


    # 挑战梯子


    如果你恐高，你不会直接去大峡谷站在边缘。如果你害怕蜜蜂，你不会从访问蜜蜂场开始。统治猴子最好的方法是朝着你恐惧的方向迈出小的、可控的步骤——就像爬梯子一样。


    ![Image](img/8-8.jpg)


    你梯子上的每一步将是一个你可以应对而不会感到不知所措的挑战。当你应对每一项挑战时，你将学会忽视猴子的嚎叫，并对自己对危险的评估充满信心。


    Anton 对呕吐的恐惧是如此不知所措，以至于即使听到或说这个词都会让他焦虑。这听起来像是他梯子第一阶的一个很好的挑战。


    以下是针对其他类型恐惧症的挑战梯子建议：


    ## 恐惧动物

    *   看你害怕的动物的图片、卡通或彩色照片

    *   听动物的录音——例如狗的低吼或吠叫声、蛇的嘶嘶声或鸟的鸣叫声

    *   观看动物的视频

    *   去宠物店

    *   在动物被某种方式限制起来时观察它（例如牵着绳绳的狗，或者宠物店玻璃容器里的蛇或啮类动物）

    *   触摸动物


    ## 恐高

    *   站在椅子上

    *   爬梯子

    *   爬树

    *   一层一层地上建筑的楼层

    *   从高层建筑的窗户向下看，然后从打开的窗户向下，最后从阳台向下

    *   乘坐摩天轮


    ## 恐惧风暴

    *   看风暴和闪电的照片

    *   听雨声、雷声和闪电声

    *   看雨、雷、闪电的视频

    *   在外面下雨或暴雨时站在打开的窗户旁

    *   在多云时出去，然后在下雨时出去，最后在雷暴期间出去


    ## 幽闭恐惧症，或害怕被困住

    *   进入开着门的衣柜

    *   进入关着门的衣柜

    *   用毯子紧紧地裹住自己

    *   在头上盖一条厚毯子

    *   在电梯门关着的电梯里站很长时间

    *   坐在只有两扇门的汽车后座

    *   进入阁楼或狭小的爬行空间


    ## 恐惧医生、血液或针头

    *   阅读或听“血液”、“受伤”、“注射”、“针头”、“注射器”、“牙医”、“钻孔”、“医生”和“手术”等词

    *   看卡通图片，然后看血液或针头的真实彩色照片

    *   去牙医或医生的候诊室，或访问医院

    *   制作假血，将其涂在自己或他人的身上并观察它

    *   去献血站观看采血过程

    *   观察并处理注射器或牙科工具

    *   阅读有关医疗程序的内容，或观看关于这些内容的电视节目或电影

    *   观看别人采血、自己采血或接受注射

    *   坐在牙医椅上，洗牙齿或补牙


    你可以从 [`www.newharbinger.com/32431`](http://www.newharbinger.com/32431) 下载“挑战梯子”工作表。


    # 应用紧张法


    如果你曾经在看到针头或血液时昏厥、感到头晕或眩晕，那么你很可能经历了血压突然下降。去看医生以确保没有其他问题是一个好主意。通过使用 `applied tension`（应用紧张法），你可以让自己在看到针头或血液时不易昏倒。


    ### 应用紧张法说明

    *   坐在椅子上，绷紧你的手臂、腿部和腹部。通过握拳并弯曲手臂来绷紧。你可以向前伸腿来绷紧。对于腹部，想象有人向你扔了一个球，然后收紧肌肉。同时进行这些动作，保持十到十五秒，然后放松三十秒。重复五次。这样做时你可能会感到头部压力。这没关系——这说明练习有效。

    *   当你练习这种方法一周后，你可以开始你的挑战梯子，同时练习 `applied tension`，之后你可以停止这样做。


    像 Anton 一样，你被猴子思维统治了长期，也许多年。学会忍受停止回避后产生的焦虑需要练习，所以对自己要有耐心。


    # 接纳


    当你面对每一项挑战时，你可能会产生“硬撑”的冲动——屏住呼吸、咬紧牙关、抓住扶手，希望尽快过去。当你硬撑通过一项挑战时，你的猴子仍然在主。你仍然在回避可能发生的情况，并抵抗过度焦虑。


    ![Image](img/8-9.jpg)


    你在每次挑战中的目标是完全接纳所产生的任何感觉。这与你到目前为止所做的完全相反。你一直都在逃避恐惧症；你现在的挑战是面对你的恐惧症。这意味着故意产生焦虑——并且当你感到焦虑时，允许焦虑存在那里，而不采取任何消除它的行动。这就是我们所说的接纳——无条件的屈服。


    如果你在进入挑战时说：“我准备好面对这种恐惧了，我想尽可能地焦虑！”你的挑战效果会好得多。这会让你的猴子非常困惑。你过去一直在奖励它保护你免受焦虑。每当它预测灾难并拉警报时，你都在给它一根香蕉。当你忽视警报并迎接焦虑时，你是在按照*你*的规则行事，而不是猴子的规则！


