    *   他们认为你是个失败者。

    *   她认为你在显摆。

    *   他们注意到你很紧张，并觉得你很怪异又软弱。


    如果你的“猴子大脑”在读心术，请问问自己：“我有什么证据证明人们真的是这样想我的？”提问并回答这个问题可以帮助你从猴子的喋喋中抽离出来，获得更好的视角。


    ## 灾难化思维


    你的猴子大脑并没有考虑所有可能的结果，而是直接大步跳跃到可能发生的最糟糕的情况。例如：


    *   如果人们注意到你很紧张，他们会告诉别人，每个人都会觉得你很怪异。

    *   人们会指点你或嘲笑你。

    *   你会大脑一片空白，在对话中想不出该说什么。

    *   如果你必须进行口头报告，你可能会晕倒或昏过去。


    问问自己：“最可能发生的情况是什么？我该如何应对？”


    ## 完美主义


    你必须每一次、每一刻都表现得无可击。任何低于此的标准都是不够的，会让你容易受到批评和严重的拒绝。例如：


    *   你必须避免在某个词上磕壳，否则人们会认为你很紧张。

    *   你永远不能在课堂上回答错问题，否则人们会认为你很蠢。

    *   你需要始终知道该说什么，否则人们会认为你很尴尬。

    *   你应该总是记住别人的名字，否则人们会认为你缺乏同理心或不在乎他们。

    *   你必须看起来冷静、自信且放松，否则人们会认为你很怪异。

    *   你应该总是很有趣，否则人们会认为你很无聊。


    问问自己：“我对自己要求的，是否超过了对别人的要求？”


    ## 标签化


    你的猴子大脑盯着你可能说的话或做出的某件事，就认定这定义了你整个人。标签可能是是你随口对自己加的严厉评判，但你做梦都不敢对朋友说出口。例如：


    *   你问了一个愚蠢的问题。你真是个白痴！

    *   你忘了某人的名字。你真是个呆瓜！

    *   你的汗水浸透了衬衫。你真恶心！

    *   你想不出该说什么。你太笨了！

    *   那太尴尬了。你真怪异！


    如果你认为你的猴子大脑在进行标签化，请问问自己：“这个词是否在任何情况下、一直都适用于我？”


    ## 对不确定性的不容忍


    由于你永远无法真正知道别人在想什么，总会有很大的不确定性空间。但只要有 1% 的概率有人可能评判你，你的猴子大脑就会得出结论：“这不值得”。


    *   如果我说了句冒犯的话怎么办？

    *   如果有人嘲笑我怎么办？

    *   如果有人注意到你在流汗，并觉得你很恶心怎么办？


    如果你的猴子大脑在进行这种误判，你可以问问自己：“稳妥起见总比事后悔好吗？”通过从不冒险，你保证了自己永远无法得到想要的东西。


    ## 替代性思维


    识别这些想法中的误判，有助于你看清自己与猴子大脑之间的区别。评估风险是一项极其重要的工作，不能交给大脑中那个原始的部分。从猴子的喋喋中退后一步，可以为新的思维方式辟出空间。


    Jarod 从初中开始就开始听他的猴子大脑说话，他很难相信还有其他的思考方式。但一旦他开始质疑它，他就能想出自己的替代性思维。


    *   **猴子想法：** 如果你在对话中停顿或在某个词上磕壳，她会认为你很蠢。

    *   **Jarod 的替代性思维：** 这是读心术！我没法知道她怎么想。

    *   **猴子想法：** 她会告诉她所有的朋友你有多怪异。

    *   **Jarod 的替代性思维：** 这是灾难化思维。我必须说一些非常奇怪的话才值得成为八卦的，而这不太可能。

    *   **猴子想法：** 为了开启对话，你必须说些有趣的话。

    *   **Jarod 的替代性思维：** 我不需要完美。如果有人主动找我说话，我会喜欢那样，并且不会担心那个人听起来是否有趣。

    *   **猴子想法：** 你可能会说出冒犯的话；这不值得冒风险。

    *   **Jarod 的替代性思维：** 如果我什么都不说，我就没有机会了解她，所以这个风险值得冒。


    替代性思维让你除了猴子的喋喋之外，还有其他可以关注的事物。当你专注于你的替代性思维时，你就剥夺了猴子习惯已的关注。这是驯服你猴子的第一步。


    你可以在 `http://www.newharbinger.com/32431` 下载替代性思维工作表。


    ## 主宰社交焦虑猴子的工具


    Jarod 对他的替代性思维感到非常鼓舞。当他考虑到与他人随性相处——不计划每一个字就说出自己的想法时——他觉得自己可以做到。他决定第二天在学校测试他的新态度，看看会发生什么。


    发现你的猴子大脑并用替代性思维取代焦虑的想法，可以给你勇气去面对你一直逃避的情况。但一旦你进入了那些让你焦虑的环境，你就必须感受它。


    ## 生活指南针


    面对你一直回避的情况需要勇气。要释放你的全部力量，你需要一个鼓舞的目标，一个对你重要的目标。你的目标可以是掌握某个特定场合，比如参加舞会；也可以是一个价值观，比如在互动中保持真实。这取决于你。


    Jarod 列了一份对他来说重要但他正在错过的清单。


    ![Image](img/6-4.jpg)


    这些事情是 Jarod 罗盘上的真北，他决心不让他的猴子指向南方。


    你可以在 `http://www.newharbinger.com/32431` 下载生活指南针工作表。


    ## 挑战梯子


    无论你的目标是什么，只要一步步来，就能实现。想象你的目标在梯子的顶端。梯子的每一级都是你为设计的特定挑战，带你接近目标。


    当 Jarod 问自己梯子顶端想要什么时，答案显而易见：他想与人随性相处，能够说出自己的想法和感受。有两个他因为害怕而一直在回避的具体情况，它们对他来说足够重要，他准备好为它们战斗了。


    *Jarod 认为他将从开启或加入对话开始做，因为他觉得如果能这样做，也会帮助他迈向约会的阶段。他决定他的第一把梯子将完全致力于开启或加入对话。*


    为自己制作梯子可能困难，因为有很多变量。对于社交焦虑，你可以将它们简化为三个 W：谁（who）、什么（what）以及在哪里（where）。


    从以下问题开始：你一直在回避的人是谁？对每个人进行恐惧程度评分。然后，为你列出的这些人想出几个你可以和做的选项，以及在哪里。对这些选项也进行恐惧评分。Jarod
    做的“谁、什么、在哪里”清单如下：


    ![Image](img/6-5.jpg)


