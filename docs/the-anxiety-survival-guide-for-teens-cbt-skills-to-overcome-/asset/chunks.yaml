    *   你肚子疼。这可能是沙门氏菌中毒！

    *   如果你旅行时忘掉了某样东西，计划就会泡汤！

    *   你妈妈最近很累。万一她得了癌症怎么办？

    *   如果你曾经被留过校，那太糟糕了！


    ## 对不确定性的不容忍


    无论积极结果的概率有多大，只要有一丝可能出现差错，你的“猴子大脑”就无法停歇。猴子大脑不会在没有明显危险信号的情况下假设你是安全的；相反，除非有 100%的安全，否则它就会假设危险。由于
    100%的安全是不可能的，你将无休止地担忧，追求无法实现的目标。


    ## 替代想法


    在你再次花一分钟去担心某事之前，为什么不批判性地审视一下引发这种担忧的想法呢？如果你能同时观察支持该想法真实的证据，以及反对该想法真实的证据，你就能更好地判断你正在面对的是真正的威胁，还是仅仅另一个猴子的念头。


    这里是特斯（Tess）关于“正反证据”的练习，针对的是她担心考试得 B 级意味着她无法上好大学并可能流落街头的威胁。如你所见，这让她对得 B 产生了一个更平衡的替代想法，让她减少了许多担忧。


    ![Image](img/9-6.jpg)


    *   **正方证据：** 我考试确实得了一个 B。考试成绩会影响课程的最终成绩，而最终成绩会影响平均绩点（GPA）。大学会看平均绩点。

    *   **反方证据：** 这次考试仅占我课程总分的 20%。到目前为止我的课程平均分是 A，所以除非下次考试我得 B 或更低，否则这个 B 不会影响我的最终成绩。即使我的最终成绩是
    B，我仍然会有不错的 GPA，并可以上很多好大学。

    *   **替代想法：** 虽然考试成绩确实会影响最终成绩，但我必须从现在起表现得很糟糕，才会在课程中得到一个坏分。即使我真的得了坏分，我仍然可以上好大学。


    当你使用这个工具时，务必坚持基于事实。特斯在收集正反证据时，她可以说：“我以后可能会得很低分。”这并不是事实，只是未来可能发生的事。事实是：她到目前为止的平均分是
    A，而这次考试占她最终成绩的 20%。坚持事实有时意味着你需要获取更多信息。例如，如果特斯不确定她感兴趣的大学对 GPA 的要求是什么，她可能需要查询一下。


    你可以从这里下载此工作表——针对广泛性焦虑的“正反证据”表：[`www.newharbinger.com/32431`](http://www.newharbinger.com/32431)。


    ## 专注注意力


    你的猴子大脑习惯了占据你所有的注意力。不断的杂语流是如此具有吸引力，除非你将注意力集中别处，否则你将一直受它的魔咒控制。


    想象自己正坐在一股猴子的杂语声旁。你可以很容易完全沉浸在眼前浮现的所有焦虑想法中，但相反，你闭上眼睛，将注意力向内专注于你的呼吸。吸气时，注意空气流入的感觉和温度。呼气时，也注意这一点。呼吸本身并不重要，重要的是你正在将注意力从猴子的焦虑想法中引开。


    你可以随时随地这样做，无论你此时是否在担心。事实上，在不担心时练习如何`focus attention`，是为担心时做最好的准备。


    将注意力从猴子身上移开是非常强大的，因为它让你置于`present moment`，而你的猴子实际上无法到达那里。猴子所有时间都在回顾过去，寻找你犯过的错误，并想象未来，寻找威胁。无论你被焦虑的猴子杂语分散了多少次，只需继续将注意力带回到当下即可。这将帮助你从担忧中获得平静，并驯服你的猴子。


    *在用了一段时间驯服工具后，特斯开始以不同的眼光看待她的担忧。她知道，得不到分不会直接导致“流落街头、孤苦伶”。情况正在好转！*


    ## 统治广泛性焦虑猴子的工具


    识别猴子的杂语并提出你自己的替代想法是掌握广泛性焦虑的关键。但只要你仍然使用回避性行为，如寻求保证、列过多的清单、过度努力学习或纯粹地担心，你就在按照你猴子的规则玩。


    当你通过担心来回应猴子的杂语时，你是在说：“你说得对，猴子。这是我需要担心的事情。”你正在给你的猴子一根香蕉——训练它将想象的威胁视为真实的威胁，并允许它继续掌控你的生活。


    ![Image](img/9-7.jpg)


    要统治猴子大脑，你必须停止回避循环。这里有一个强大的工具可以帮助你前进。


    ### 担忧时间


    你目前为止的担忧经历都是由猴子驱动的。也就是说，每当你的猴子乱叫，你就担心。你可能不想停止当下正在做的事情并开始担心，但你别选择。有一只狂野的小猴子在负责。


    在`worry time`期间，是你做主——而不是你的猴子。你决定什么时候担心，担心多久。没错——你将会去担心。


    担忧时间应该提前计划，所以你需要在期待的事情之前查看时间——比如给朋友打电话、用电脑或看电影。当预定的担忧时间到达，找一个不会被打扰的安静地方，设定定时器，拿出你最担心的事，让它们尽情爆发。在闹钟响不要停止。


    以下是特斯担忧时间的脚本：


    ```

    我考试得了一个 B。噢，这太糟糕了！这个 B 会毁了我的生活！可能会影响我的总 GPA，那将是一场灾难。我可能因此上不了任何好大学。我也为得了一个 B 感到羞耻。如果我的朋友开始觉得我不聪明怎么办？那太糟糕了。但这件事最真正糟糕的是，如果我不能上好大学，我的一生都会很糟。我可能找不到好工作。如果我找不到好工作，我的生活就毁了。我可能永远无法自立！

    ```


    在`worry time`期间，你可能会变得非常焦虑，这没关系。那是这种情绪的时间。想象自己在担忧时间铺上一块欢迎垫，迎接所有的焦虑想法和尽可能多的焦虑，而不进行任何抵抗。


    如果你开始感到被恐惧淹没，将注意力从担忧中移开，关注担忧引起的身体感觉。对着那种感觉呼吸，放松你的腹部。记住，当你需要时，呼吸总是在那里。（更多关于呼吸缓解焦虑的内容，请回到第
    5 章。）

