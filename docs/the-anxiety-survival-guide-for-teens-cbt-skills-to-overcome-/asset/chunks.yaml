    to worry good and hard, doing nothing else but worrying, for the ten- to twenty-minute
    duration of this exercise.


    Your worry time should be planned in advance, so you will need to look at your
    day and decide on a time. It can be helpful to schedule it soon before something
    that you look forward to—such as calling a friend, going on your computer, or
    watching a movie. The reason for this is that you will never *feel* like spending
    time worrying. Worry time won’t be fun, but it will change your relationship to
    worry in a good way!


