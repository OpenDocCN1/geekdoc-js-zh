- fmt: '

    You can focus on anything at all—a photo, a flower, a spot on the wall. What matters
    is that you are not giving the monkey the attention that it is used to. Many people
    find that the best place to focus their attention is on their own breath. Your
    lungs will always be there, and when you become aware of your breath you become
    aware of your body.


    Focused attention on the breath is best done when sitting in a quiet place where
    there are no obvious distractions. Notice the air as it moves in and out of your
    nostrils, or notice your belly as it expands on the in-breath and deflates on
    the out-breath. Every time your monkey mind gets you thinking about something
    other than your breath, say, `Thank you, monkey`. Then gently bring your attention
    back to your breathing.


    You will in all likelihood be distracted over and over again. Don’t be discouraged
    by this. In fact, the more often you catch yourself being distracted by the monkey
    mind the better. The whole point of this practice is to notice these distractions
    and to choose to bring your attention back to your breath.


    ### Present Moment


    The monkey mind is constantly reviewing the past for mistakes you may have made.
    When it is not doing that, it is scanning the future for signs of danger. This
    of course creates anxiety. By focusing on the `present moment` we can get distance
    from all this chatter and actually experience relief. It also allows us to live
    more fully and realize that everything is in a constant state of change.


    Right now you are reading this sentence. You may also be thinking that you’re
    almost at the end of the chapter and wondering whether you should take a break
    or keep reading. Take a moment right now to just notice the feeling of the book
    in your hand. Notice where you are sitting or lying down. Become aware of the
    sounds in the room right now, or the silence. The simple act of noticing and paying
    attention to your immediate surroundings puts you in the present moment. The past
    and the future are the territory of the monkey mind. The present is yours and
    yours alone.


    You can practice paying attention at any time—while brushing your teeth, taking
    a shower, or putting a spoonful of cereal in your mouth. If you are walking down
    the street, try really looking at the trees and buildings and people around you.
    If you are sitting somewhere, close your eyes and just listen. You’ll be amazed
    at what you hear. More importantly, you will notice the thoughts that pop up,
    how random they are, and what distraction they are from the moment you are in.
    You don’t have to fight those thoughts; it’s only your monkey doing its job a
    little too well. Just notice them and let them go.


    When you begin to pay attention throughout your day, you will be amazed to discover
    all the monkey chatter that distracts you. Don’t be discouraged. Thank your monkey
    and bring yourself back to being right here, right now.


    ### Acceptance


    As you get better at spotting monkey chatter, you’ll recognize another theme besides
    the scary warnings of danger. You will notice judgments, both about yourself and
    about others. Your monkey may be telling you what you should or should not have
    done, that you are lazy or weak, or similar things about others. How helpful is
    this? Not helpful at all! Having ideas about how you `should` be will only make
    you discouraged. The first point I made in this book is that there is no normal
    and nobody is perfect. Everyone has a monkey, everyone has anxiety of some kind,
    and everyone certainly makes mistakes. You will be able to move forward only by
    accepting yourself `as you are`.


    Accepting that anxiety is normal and that you are not to blame for it will enable
    you to have compassion for yourself. You’ve suffered enough without piling on
    judgments and blame. When you are compassionate with a friend who is down, what
    happens? The friend is encouraged. It works the same way on you. When you accept
    your anxiety and forgive yourself for having it, you unlock the most powerful
    tool of all: courage. When you can unleash your own courage on a problem, everything
    is possible!


    Knowing that his fears about dogs were based on miscalculations gave Justin some
    hope. Maybe he didn’t have to be so afraid of dogs. He also began practicing mindfulness
    throughout his day. When he noticed his mind wandering to thoughts about dogs,
    or anything else that seemed like the work of his monkey, he brought his attention
    back to the present moment. And he made real progress with some of the judgments
    he’d been making about himself—about being a wimp, for example. He was beginning
    to feel more confident about his future.


    One Saturday afternoon he grabbed his skateboard out of the closet and took off
    for the skate park. It felt amazing to be back out in the world, free and on his
    own. All his work was paying off. Everything was going great until a pickup truck
    passed him with a dog barking in the back.


    Immediately Justin was hit with a wave of fear. He jumped off his skateboard and
    turned around for home. He just couldn’t go any farther. As he trudged back he
    reviewed his alternative thoughts. The dog in the truck had been tied. He wasn’t
    even sure it was barking at him. He knew in his head that there hadn’t been any
    real danger, but in his body he felt really vulnerable. `I need to get rid of
    this feeling`, he thought. `What else do I have to do to get over this stupid
    fear of dogs?`


    ![Image](Images/4-1.jpg)


    # Chapter 4 Rule the Monkey


    ## Take Back Control of Your Life


    If you’ve read this far and done the exercises, you are in a much better place
    than you were before. You can recognize your monkey chatter and how it triggers
    your anxiety. You have come up with some alternative thoughts, without all those
    monkey miscalculations in them, and that has probably helped reduce your anxiety
    a bit. You may even be beginning to tell the difference between real threats and
    false alarms. Congratulations!


    At the same time, if you are still responding to monkey chatter by avoiding situations
    that make you anxious, then you are still feeding your monkey bananas and continuing
    the cycle of avoidance. To live the kind of life you want, to go where you need
    to go to accomplish your goals, you will have to begin to face situations and
    take actions that make you anxious.


    If you are like most anxious teens, you’ve always thought, `Isn’t my anxiety something
    I have to get rid of before I can do things?`


    Even if you have already wised up to your monkey’s miscalculations and developed
    alternative thoughts, for you to actually believe these situations are manageable
    you will have to experience them. You won’t be able to do this if you continue
    to act as if anxiety is to be avoided.


    In the past, you’ve allowed your monkey to run your life with its wild guesses
    and false alarms. Your monkey isn’t to blame; it’s just trying to do its job.
    But it has way too much power over you. You can’t keep playing by your monkey’s
    rules. You need to rule the monkey.


    To take back control of your life you’ll have to change your behavior as well
    as your thinking. Instead of avoiding the things that your monkey tells you are
    dangerous, you’ll have to move `toward` them and be willing to feel the anxiety
    that goes with that. When you move toward your anxiety you reverse the cycle.
    Your monkey has no power over you. `Sorry little one—no banana!`


    ![Image](Images/4-2.jpg)


    Right now there is probably a voice somewhere in the background sounding like,
    `Woo-woo-woo! Be very afraid!` It is true—to live the life you want you will have
    to start feeling the anxiety you’ve been avoiding. Is the life you want to live
    worth facing your fears?


    Well, this is a question for you, not your monkey. It’s too important a decision
    to base on a miscalculation. The answer to this question lies in your heart.

