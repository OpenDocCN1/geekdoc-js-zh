    By looking at all three variables, Jarod was able to construct a ladder that started
    off with something a little bit scary and built toward something that would be
    really scary—and rewarding! The bottom rung was simply “`(what)` Saying ‘hi’ to
    `(who)` a guy I know from a group project `(where)` before class.”


    Each challenge he set for himself on the rungs above it was a little scarier than
    the one just below it, but would bring him closer to his goal. The top rung was
    “`(what)` Asking a question of `(who)` a cute girl `(where)` at a party while
    sober.”


    You can download a Who, What, Where worksheet of your own at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    ## Jarod’s Ladder


    ![Image](Images/6-6.jpg)


    You may be wondering why Jarod went to all this trouble planning these situations.
    Wouldn’t opportunities like these come up on their own soon enough? Yes, and when
    they did Jarod’s monkey would sound the alarm and put him in fight-or-flight mode
    before Jarod had a chance to interpret the situation correctly.


    You are better off surprising your monkey than letting it surprise you. Don’t
    wait for the challenge. Seek it out and welcome it!


    You can download a Challenge Ladder worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    ## Focused Attention


    When you are in a situation that makes you feel anxious, monkey chatter grabs
    a lot of your attention. You are also hyperaware of the sensations in your body,
    like your heartbeat, sweating or blushing, or queasiness. If you put all of your
    attention on these things it amplifies their effect.


    ![Image](Images/6-7.jpg)


    `Focused attention` is a mindfulness practice that can help you stay centered
    and grounded in even the scariest situations. By choosing to focus on things outside
    your body you can reduce the anxious sensations you are feeling inside it. By
    choosing to focus on other people you take the spotlight off yourself.


    ![Image](Images/6-8.jpg)


    *When Jarod was having a conversation with a girl, instead of focusing on what
    his monkey was telling him and how anxious he felt, he focused on her. He listened
    extra carefully to what she was saying. He paid special notice to the color of
    her hair and her eyes and to what she was wearing. He was surprised at how much
    more relaxed the conversation was when he focused on her, and it seemed to him
    that she appreciated the attention, too.*


    To get good at focusing your attention away from your monkey mind, daily practice
    is important. When you’re learning this skill, it is best to start by practicing
    when you are not anxious. As you get better at it, you can use it in situations
    like conversations and oral presentations—any challenge you have on your ladder.


    ## The Problem with Perfect


    Your monkey will also try to trick you into expecting perfect outcomes to your
    challenges and judging them accordingly. Remember that you are setting goals that
    you can accomplish, but they’re challenging because they make you anxious. That
    means things will not go perfectly.


    How would Jarod judge his performance on the first rung of his ladder—saying “Hi”
    and seeing what happens with the guy he knew from a group project—if his expectations
    were to sound calm and confident and have no awkward silences? If he has perfectionistic
    expectations he will almost certainly fail and wind up feeling pretty bad about
    himself.


    ### Set a Realistic Goal


    A more realistic goal for Jarod would be to smile and say “Hi”—*period*. If the
    other boy responded and a conversation started, great! If not, or if Jarod blushed,
    sweated, or stumbled over his words, it wouldn’t matter.


    Jarod met his first-rung challenge, but afterward he started to worry about how
    he had sounded. He also noticed feeling hot and wondered if the other boy had
    seen that he was nervous. Then he realized that this was his monkey chattering
    away at him. Once he spotted his monkey he was able to remind himself that he
    had accomplished his realistic goal, and he felt really good about himself. Learning
    to praise yourself for what you are doing right and being realistic about what
    to expect of yourself are both essential for overcoming social anxiety.


    As long as you meet your original challenge, you win. You’ve interrupted the cycle
    of avoidance. Your monkey gets no banana and it’s a little tamer than before.
    And most important, you are playing by *your* rules, not your monkey’s.


    You can download a Realistic Goal worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    ## Rolling with It


    Remember the other half of the over/under monkey miscalculation? It underestimates
    your ability to cope if something bad happens. Well, it is important to remember
    that not everyone is going to respond positively to you. Sometimes you will be
    ignored or even criticized. This is what triggered Jarod’s social anxiety in the
    first place—his friend telling him his joke was racist.


    You know what skateboarders say: “If you’re not falling, you’re not skating.”
    Even the best basketball players miss their shots more than half the time. Sometimes
    they miss ten shots in a row. Whether you are skateboarding, shooting hoops, or
    hanging out with friends, you are going to have awkward moments in which you look
    less than perfect.


    ### Acceptance


    The fact is, everybody makes mistakes. If you put yourself in a challenging situation
    and somebody reacts negatively to you, your monkey mind is going to sound a full-scale
    alarm, hit you with a deluge of anxious thoughts, and shower you with shame. This
    is the time to take care of yourself, not punish yourself. How do we take care
    of ourselves? With a very simple three-step process:


    1. Take a breath deep into your belly.

    2. Slowly exhale.

    3. Repeat.


    Remember that when others are judgmental or harsh with you, it says more about
    them than you. You know for a fact that you are a decent person and that your
    intentions are good. If they have a problem respecting you, it is their problem,
    not yours.* Whatever the outcome of your challenge, you can take care of yourself.


    If Jarod had been able to do this when he told that joke, he might have avoided
    a boatload of pain. He might have had an alternative thought like, *Oops, I goof.
    I did not mean to be racist, but I can see how that joke could be taken that way,
    and then said to his friend that he was sorry.* This would have allowed him to
    move on. But he couldn’t do that because he was ruled by his monkey mind, which
    was operating under the assumption that mistakes meant getting kicked out of the
    tribe. Not anymore!


    *Jarod spotted his monkey and he knew now where it would lead him. He was determined
    to achieve his goal of being spontaneous and speaking his mind, and he was willing
    to accept the risk that he might embarrass himself in the process. As he met each
    challenge on his ladder he was delighted to discover that people mostly responded
    well to him. When they didn’t, he took some breaths and gave himself a pat on
    the back—although he didn’t get the response he would have liked, he did meet
    the challenge and he wasn’t avoiding anymore!


    *Over the next six months Jarod slowly worked his way up the rungs of his ladder,
    all the way to the top. His final challenge was a great success, even though the
    girl declined to go out with him. It might have been because she was going with
    someone else, or that he wasn’t her type—Jarod didn’t ask. He took a breath and
    rolled with it, and they wound up talking for about twenty minutes about their
    favorite bands. They are friends now, and Jarod is working on a new ladder. He’s
    got big plans for the future.*

