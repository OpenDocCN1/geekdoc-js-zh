  raw: 'There are anxious teens all around you. Studies show that anxiety is the most
    common mental health problem in America, affecting nearly one in five people.
    If you are sitting in a classroom of thirty students, chances are that at least
    a row of you are suffering from one of the seven most common varieties of anxiety:
    social anxiety, generalized anxiety, separation anxiety, obsessive-compulsive
    disorder, specific phobias, panic, and agoraphobia. The reason you are unaware
    of your anxious peers is that they are just as good at hiding their anxiety as
    you are.


    You are not alone, and you are also not to blame. Scientists who study DNA have
    isolated a number of genes associated with heightened or lowered sensitivity to
    danger, including genes that have been nicknamed the “warrior/worrier gene” and
    the “risk-taking gene.” Your present level of anxiety is partially inherited.
    In fact, if you have a parent or sibling with an anxiety disorder you are four
    times as likely to suffer from anxiety yourself.


    In addition to your genetic makeup, your level of anxiety can be influenced by
    a traumatic life experience or your parents’ anxious behavior. So blaming yourself
    for your anxiety makes about as much sense as blaming yourself for the color of
    your eyes, things that have happened to you, or the family you were born into.
    You can’t change your genetics, your life experience, or your parents. These are
    the cards you were dealt. But will you have to suffer with anxiety for the rest
    of your life, missing out on things you want to do? Are millions of anxious teens
    predestined to become anxious adults? Absolutely not! You *can* learn how to manage
    your anxiety, so that you can do the things that are important to you. This book
    will show you how.


    Here is a brief overview of the different types of anxiety this book addresses.
    You can also download a brief quiz that will help you identify which types of
    anxiety you suffer from at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).
    (See the very back of this book for more information about downloads.) Don’t be
    surprised if there is more than one; that’s very common. Later chapters in this
    book will focus in more detail on how to deal with your specific types of anxiety.


    Generalized Anxiety


    *   Frequent worry about school, your health or the health of your loved ones,
    or bad things happening in the world


    *   Feeling tense or restless, having difficulty concentrating, or having trouble
    falling asleep at night due to worry


    *   Frequent stomachaches, headaches, or muscle tension


    Phobias


    *   Fear and avoidance of elevators, heights, storms, or water


    *   Fear of certain animals or insects


    *   Unreasonable fear of needles, blood, choking, or vomiting


    Social Anxiety


    *   Uncomfortable shyness or fear of doing or saying something embarrassing


    *   Panic when having to give an oral presentation or be the center of attention


    *   Difficulty starting or joining in conversations with others


    Panic Attacks


    *   Feeling frightened suddenly or for no apparent reason


    *   Racing heart, trouble breathing, or dizziness


    *   Strange, detached feeling, as if things are not real


    Agoraphobia


    *   Avoidance or fear of going into situations in which you have panicked before


    *   Fear of being trapped in places like cars and planes, or fear of going into
    tunnels or over bridges


    *   Fear of suddenly having to go to the bathroom but being trapped or far away,
    so that you cannot get there in time


    Obsessive-Compulsive Disorder


    *   Frequent intrusive or unpleasant thoughts


    *   Fear and doubt about illness, germs, harming yourself or others, offending
    God, your sexual identity, or losing or forgetting things


    *   Need to know, or for things to be just right


    Separation Anxiety


    *   Avoiding being away from home or people who are important to you


    *   Worry that something terrible might happen to people who are important to
    you when you are away from them


    *   Frequent calling or texting to make sure people you care about are okay


    Now you have a better idea of the different types of anxiety. I hope you don’t
    feel overwhelmed by this list. Sometimes names and labels can feel scary, especially
    if you are anxious to begin with. You may be thinking that this means there is
    something really wrong with you.


    There is nothing wrong with you that you can’t fix. The purpose of naming the
    types of anxiety you may suffer from is to give you specific and powerful tools
    that will help you manage your anxiety and gain confidence to live the life you
    want. But before you jump to the chapters that focus on your type—or types—of
    anxiety, let’s look at what all anxious teens have in common.


    Part 1


    ![Image](Images/1-1.jpg)


    Chapter 1


    # The Monkey Mind


    Staying Alive


    *One summer day about thirty thousand years ago, three young Cro-Magnon hunters
    were following reindeer tracks across a rocky plateau when they spotted their
    prey grazing on a patch of grass near a lone tree. They crouched down low and
    crept forward, gripping their spears in anticipation. Just as the hunters were
    closing in, they heard a faint rustle behind them. When they turned their heads
    they saw a saber-toothed tiger bearing down upon them. The terrified hunters bolted,
    and so did the deer. All three hunters made it back to camp. The deer wasn’t so
    lucky.*


    One thing, at least, has not changed in thirty thousand years. Whether it is a
    charging saber-toothed tiger on a prehistoric plain or a car running a red light
    when you are crossing an intersection, the human reaction is instantaneous. Our
    brains are hardwired for survival. Your brain’s number one job is staying alive.


    Your brain tells your body when to relax and when to respond to danger. When there
    is danger your nervous system acts in an instant, before you have time to form
    thoughts or make plans—like a smoke detector in your house that sounds the alarm
    before you can smell the smoke. It’s called the *fight-or-flight response*, and
    we share it not only with deer but with all creatures that have a brain.


    *The next day the three hungry hunters set out again in search of prey and again
    they found some reindeer tracks. They weren’t following the trail very long, however,
    before they spotted several tiger prints. The first hunter grunted and kept going,
    apparently unconcerned. The second hunter spun around and ran back to camp. The
    third hunter wiped his brow and took a few deep breaths. He was anxious, but he
    was also hungry. After studying the direction of the tracks, he headed off in
    the opposite direction. Shortly afterward, he speared a deer. He was the hero
    in the tales of the day’s hunt told by the fire that night.*


    Even when there is no imminent threat, your brain is still looking for danger.
    Although you are usually unaware of it, a primitive part of your brain is constantly
    scanning your surroundings, remembering past events and looking into the future,
    deciding what is safe for you to do and what is not. Although neuroscientists
    are learning new things all the time about how that part of the brain works, it
    is still a mystery exactly how we decide which risks to take, and why our decisions
    vary so much from person to person.


    The “fearless” hunter who ignored the tracks continued on the trail and wound
    up being killed by the tiger. The hunter who was made anxious by the tracks, and
    changed his plans accordingly, survived and thrived. Being able to feel some anxiety,
    even when there is no immediate threat, can help you make good decisions and stay
    alive. But what about the hunter who turned and ran even though there was no tiger
    present and thus no imminent danger?


