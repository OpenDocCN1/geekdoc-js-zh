    - **回避行为：** 匆忙准备上学，并提前十五分钟出发。

    - **猴子逻辑：** *因为你早到了，所以你没有被留下来。*

    - **猴子思维：** *万一我得了胃流感病毒怎么办？没有什么比呕吐更糟糕了。你无法应付。*

    - **回避行为：** 避开可能生病的人。

    - **猴子逻辑：** *因为你避开了病人，所以你没有呕吐。*

    - **猴子思维：** *万一别人觉得你很无聊怎么办？他们会嘲笑你或议论你，你会留下坏坏印象。*

    - **回避行为：** 避免主动发起对话。

    - **猴子逻辑：** *因为你保持沉默，没有人发现你很无聊。*

    - **猴子思维：** *万一我发了恐恐发作怎么办？如果我发了恐恐发作，可能永远不会停止，或者我会死。*

    - **回避行为：** 避开曾经发生过恐恐发作的情况。

    - **猴子逻辑：** *因为你避开了这些情况，所以你没有恐慌、失控或死亡。*

    - **猴子思维：** *万一你爱的人发生了什么可怕的事怎么办？*

    - **回避行为：** 反复说某些短语，以确保坏事不会发生。

    - **猴子逻辑：** *因为你说了那些短语，你爱的人没有发生坏事。*

    - **猴子思维：** *万一你女朋友发生车祸，这就是她迟到的原因怎么办？*

    - **回避行为：** 打电话给她确认她无事。

    - **猴子逻辑：** *因为你给她打了电话，她是无事的。*


    这就是为什么回避虽然快速减轻焦虑的简单方法，但却是糟糕的长期解决方案。你每回避一种情况，都是在给你的猴子一根香蕉，喂养猴子逻辑，鼓励你的猴子在未来再次使用这种焦虑的想法和其他类似的想法。在你还没反应过来时，你已经陷入了一个不断加强的回避循环。


    ![Image](img/2-4.jpg)


    第二天贾斯汀去滑板公园时，他第一次注意到附近狗公园里的狗是没有系牵绳的。一个念头跳入他的脑海：有人可能会打开门，其中一只没系牵绳的狗可能会逃出来并攻击他。他试图继续滑滑，但他被这个新念头以及它带来的焦虑感分散了注意力，以至于摔倒了两次，最后他打电话让爸爸接他。


    越回避，意味着错过越多对你重要的事情。贾斯汀错过了独自滑滑板穿遍小镇的独立感。依靠父母开车送他去各地是不靠谱的，因为他们有时太忙。更糟糕的是，当他必须依赖他们时感到的沮丧，而他想要的却是少地依赖他们。现在，他不能在滑板公园和朋友待在一起了。贾斯汀的世界正在变得越来越小。


    ![Image](img/2-5.jpg)


    你的世界正在变得越来越小吗？你是因为焦虑而不恋爱吗？在逃避学校吗？也许你无法去露营或去任何远离家的地方旅行。看医生和牙医是你避开的事情吗？也许你认为担心可以防止坏事的发生。你可能会过度计划、列出太多清单、学习过度，或者拖延。也许你通过反复洗手或检查，或者以特定的方式说话行事来管理焦虑。也许你使用药物或酒精来避免焦虑的感觉。


    正是这种*对焦虑的回避*占据了你大量的时间和精力，以至于你没有精力留给真正重要的事情。只要你继续喂养你的猴子，这种回避循环只会变得糟糕。不要错：为了夺回你的生活，你需要从源头上停止回避循环！


    ![Image](img/3-1.jpg)


    # 第三章


    # 发现猴子


    ## 识别焦虑想法


    到这本书为止，你一直在使用大脑中与“猴子心”完全不同的部分。你一直在使用大脑的其他部分，它能看到大局并考虑到所有因素，而不只是潜在的威胁。你还在倾听内心的声音。在你的内心，你知道生活不仅仅是生存。在你的内心，你怀着对未来的梦想，以及你想要如何生活。


    这整本书基于一个核心观点：你不是你的猴子。你越擅长看清真实的你和那个恐惧的小生物之间的区别，你夺回生活控制权的机会就越大。你——我指的是那个更强大、更聪明的你——将学会“发现猴子”：识别猴子的唠叨，并意识到它是如何引发你的焦虑情绪和回避行为的。


    ## 驯服猴心的工具


    这里是一些发现和驯服那只可爱小兽的棒工具。它们值得你花在它们身上的每一分钟。


    ### 生活指南针


    问问自己，你是否正在*走向*你想做且对你重要的事情和处境？或者，你正在*远离*它们？如果你发现自己在回避一个你真的不想回避的情况，尽管没有即时危险，很可能是你的猴子在作怪。


    ![Image](img/3-2.jpg)


    贾斯汀喜欢滑滑板以及它带给他的独立感，但猴子的唠叨却让他坐在了父母的车里。你的猴子没有考虑到你想要如何生活。你的猴子心唯一关注的是让你活。


    ### 发现想法


    想一个让你感到焦虑的情况。然后问问自己三个问题：


    1. *我害怕什么？*

    2. *如果这真的发生了，最坏的情况会是什么？*

    3. *这对我、我的生活或我的未来意味着什么？*


    这些是驱动你在那种情况下行为的想法。这些想法可能是合理的且真实的——信号该情况是有危险的。或者它们可能是误报，猴子心的产物。


    让我们跟随贾斯汀看看他是如何发现想法的。


    ![Image](img/3-3.jpg)


    ## 猴子的误判


    相比你，猴子并不聪明，猴子心也是如此。在判断风险时，猴子心总是犯两个错误：它*高估*了坏事发生的威胁，并*低估*了如果坏事发生你的应对能力。


    ![Image](img/3-4.jpg)


    这种双重误判将安全的情况归为危险，触发误报并让你的身体进入战斗逃跑模式。高估或低估只是猴子心持续误判威胁的方式。让我们看看其他类型的猴子误判。


    ![Image](img/3-5.jpg)


    ### 灾难化


    跳到最糟糕的结论，“灾难化”也许是最常见的猴子误判。就像恐怖片一样，猴子心总是在想象最坏的结果。是一些灾难化想法的例子：


    - 你考虑在课堂上举手回答问题。*如果错了，学校会有关于你很傻的流言。*

    - 你的男朋友没有回信息。*他没回我的信息，他一定是要跟我分手了。*

    - 开车时，你感到撞了一下。*你撞到人了吗？*

    - 你看到墙上有一只蜘蛛。*它可能是毒的。万一它跳到你身上咬了你怎么办？*

    - 你的胸部感到闷。*我有心脏病发作了吗？*

    - 考试遇到困难。*如果我挂了这次科，它会显示在成绩单上，让你上不了大学。*


    如果你认为你的猴子心正在灾难化，问问它：“真正可能发生什么？”


    ![Image](img/3-6.jpg)


    ### 否定积极面评价


