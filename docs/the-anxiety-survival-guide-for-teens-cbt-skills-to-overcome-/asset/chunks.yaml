    Remember that you are not trying to relax. Relaxation techniques, like imagining
    yourself on a peaceful beach, are based on the idea that your uncomfortable sensations
    are bad and must be stopped. If you’ve ever tried that technique, you know it
    doesn’t work.


    As you welcome panic sensations with your breath, whether you find yourself feeling
    less anxious or find yourself feeling more anxious doesn’t matter. The point is
    that you are accepting the feelings. You are showing yourself that feeling bad
    isn’t dangerous. It is simply part of life—a part you are willing to experience
    when it comes up. This is how you rule the monkey and master panic.


    Kim worked hard at climbing her ladder. Within twelve weeks she was much less
    afraid of having a panic attack. When she would get waves of panic sensations
    she was able to recognize them as harmless. This did not mean that she liked them,
    but they did not scare her like they had before. Consequently, she was having
    way fewer panic attacks. In fact, they didn’t feel much like panic attacks anymore.
    They were milder, and fewer and farther between.


    Kim’s hard work changed her relationship with anxiety and with her monkey. When
    she did get a feeling of anxiety she immediately went to her welcoming breath.
    By learning to accept panic, she mastered it and her world opened up.


    With this knowledge and these tools, you can go anywhere you want to go. Where
    do *you* want to go? What are you waiting for?


    ## Agoraphobia


    The word `agoraphobia` sounds kind of scary and it is often misunderstood. Most
    people think of agoraphobia as a fear of leaving your house. This specific fear
    can be part of it, but it is not the definition of agoraphobia.


    Agoraphobia is the fear of having some kind of an attack in a place or situation
    where escape would be difficult or embarrassing, or when help might not be immediately
    available. It could be a panic attack, loss of bowel or bladder control, dizziness,
    fainting, throwing up, an asthma attack, a headache, or some other extreme pain.
    In other words, agoraphobia is the fear of having an attack and being trapped.


    Common situations that trigger the fear of being trapped are being on a plane,
    in a car, on a bridge, or in a movie theater or classroom far away from an exit.
    It is not a fear of the plane crashing or of the height of the bridge—those would
    be specific phobias. Rather, an agoraphobic teen would be afraid of having an
    attack and being trapped on a plane or bridge.


    Some people with agoraphobia have a fear of taking medicine—again, not because
    they are afraid of choking, which is a specific phobia, but because they feel
    that once the medicine is in their body they will be trapped and have to wait
    for any possible side effects from it to go away. It is also common for people
    with agoraphobia to worry if they are a certain distance from their home, a hospital,
    or a bathroom. They may also worry about being alone. About one out of three people
    who have a problem with panic attacks will develop agoraphobia.


    To free yourself from agoraphobia you would use the same steps as for panic attacks.No,
