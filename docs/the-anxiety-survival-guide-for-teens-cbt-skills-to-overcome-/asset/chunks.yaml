    Chapter 5


    # Thank You, Monkey!


    How Acceptance Sets You Free


    Have you ever hiked up the side of a mountain? On a steep trail you get tired
    very quickly. It isn’t long before you are sweaty and exhausted. The trail zigzags,
    and at each sharp turn a new stretch of challenging terrain appears. The trees
    keep you from seeing what lies ahead, and you wonder whether you will ever make
    it to the top. Turning back is so tempting. Your fatigue gets worse and worse
    until you can barely put one foot in front of the other, and then…


    You reach the top! And like the trail, your fatigue levels off. Your legs are
    shaky and your body feels spent, but you also feel really good. You conquered
    the mountain.


    Anxiety is like fatigue. As with choosing to climb a mountain, if you choose to
    face your fear it will get worse before it gets better. But remember, you don’t
    hike up the mountain saying, *I shouldn’t be tired! Being tired is unacceptable!*
    If you thought that, you would certainly turn around and head back to the bottom.
    You know that feeling tired is normal when climbing a steep trail, so you accept
    it. You know and trust that your fatigue will not kill you, and that if you rest
    at each bend and catch your breath, you will find the strength to reach your goal.
    Like fatigue, anxiety is much more tolerable if you accept it as a normal part
    of life.


    Each rung of your challenge ladder is like a zigzag on that trail up the mountain.
    As you look at the new terrain, your success depends on your ability to welcome
    what it has to offer. On the trail, that includes the exhaustion in your body.
    On your ladder, it includes the anxiety you’ll feel. When that anxiety comes,
    you will welcome it. You’ll say, *Thank you, monkey! Can I have some more?*


    ![Image](Images/5-2.jpg)


    ## The Welcoming Breath


    Deciding to welcome anxiety won’t be enough. You’ll have to welcome it with your
    whole body, in the places where you feel the anxiety. In the past, when you’ve
    felt anxious you’ve breathed rapidly and shallowly, which is a fight-or-flight
    response. When you are welcoming anxiety you do the opposite:


    1.  Breathe in deeply, filling your lungs so that your belly expands.


    2.  Breathe out completely.


    3.  Repeat slowly and deliberately.'
