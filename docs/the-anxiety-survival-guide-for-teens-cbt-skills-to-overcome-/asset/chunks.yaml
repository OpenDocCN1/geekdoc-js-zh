- fmt: '

    Kim was at a crossroads. She had previously been a carefree person who enjoyed
    planning activities with her boyfriend, friends, and family. Now the thing she
    thought about the most was having another panic attack, and all her planning was
    based on how to avoid it. She hated being dependent on her parents to pick her
    up when panic struck, and she felt uncomfortable depending on her pills so much.
    Before, she had enjoyed doing some things alone, but now she wanted to be around
    people she considered safe.


    Kim was also having a lot of panic-like sensations, which were increasingly uncomfortable
    and exhausting. She felt on edge all the time. The fun was gone from her life
    and her world was getting smaller. Knowing that panic sensations aren’t physically
    dangerous wasn’t enough. Kim needed to do something. But what?


    Kim’s problem was that her new interpretations of panic sensations, without new
    experience to support them, remained just thoughts. She was never going to actually
    believe she could master a panic attack unless she actually mastered one. She
    was going to have to stop her avoidance cycle and face the very feelings she was
    most afraid of.


    ## Tools to Rule the Panic Monkey


    All the tools in the world won’t change the fact that facing panic is scary. Our
    first tool addresses the big question, *Are the things I am missing out on by
    avoiding panic worth fighting for?*


    ### Life Compass


    Kim had lost her sense of direction in life. Following her monkey and avoiding
    her panic was sending her south every time. To help her find her true north again,
    Kim made a list of the things she used to have that she’d lost due to panic.


    ![Image](Images/7-6.jpg)


    When she looked at all the things she was missing, Kim felt they were worth fighting
    for, even if she was scared.


    Are you willing to fight for what you are missing out on? It will mean facing
    your biggest fear—your own physical sensations. And you won’t just wait around
    for them to happen, maybe hoping they won’t. You will face them intentionally.
    Yes, in order to master panic, you must bring these sensations on intentionally.
    You will have to feel the sensations you associate with panic on purpose.


    Can you hear your little monkey beginning to howl? It is probably telling you
    this is the worst idea since the atomic bomb, that it’s just plain dumb. You can
    acknowledge your monkey by thanking it for trying to keep you safe, and at the
    same time recognize that the cost of doing things the monkey mind way is just
    too high—it is time to take back control of your life. Remember, you will not
    be diving into a pool of panic, but rather wading in with small, manageable steps.


    You can download a Life Compass worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    ### The Challenge Ladder


    As you learned in chapter 4, the best way to think about facing your fears is
    with a ladder that reaches toward the life you want to live. Kim’s goals all pointed
    toward one big idea: to gain back her independence from medication and enjoy doing
    the things she had always liked to do. To determine what challenge rungs would
    help her meet these goals, the question she needs to ask is, *What have I been
    avoiding?*


    What you are actually avoiding with panic attacks are your own sensations. Kim
    identified each of her panic sensations and ranked them in order of scariness,
    with 10 being the most scary and 1 being the least. Here’s what she got:


    *   Tightness in chest: 10

    *   Heart beating fast: 8

    *   Light-headed and dizzy: 7

    *   Hot and sweaty: 5


    In order for Kim to face these sensations in a purposeful way, and in a time and
    place of her choosing, she would have to bring them on intentionally. Here are
    some specific exercises and the panic sensations they can cause:


    *   **Exercise:** Hyperventilate. Breathe in and out quickly for anywhere from
    fifteen seconds to one minute, taking short breaks.

    *   **Effect:** Light-headedness; increased heart rate; heart palpitations; tightness
    in chest; feeling hot and sweaty; feeling cold and clammy; tingly sensation in
    your face, hands, and feet; and difficulty breathing.

    *   **Exercise:** Do any brisk exercise, such as jumping jacks or going up and
    down stairs, for two to five minutes.

    *   **Effect:** Increased heart rate, tightness in chest, feeling hot and sweaty,
    and difficulty breathing.

    *   **Exercise:** Put your head between your knees and shake it back and forth
    for thirty seconds, then bring your head up quickly. Or spin around, either sitting
    in a spinning chair or standing up, for thirty seconds to one minute.

    *   **Effect:** Dizziness, light-headedness, vision changes.

    *   **Exercise:** Stare at your mouth in the mirror while repeating a nursery
    rhyme over and over again for one to five minutes. Or stare at the same spot on
    the wall without moving your eyes away for one to five minutes. even*   **Effect:**
    Vision changes or a feeling of detachment or unreality.


    For the lowest rung on her ladder Kim chose the sensation that made her the least
    anxious: “hot and sweaty.”


    Kim knew that facing her panic would be less overwhelming at home, with her parents
    nearby, so she started off there. Here’s what her challenge ladder looked like
    when she was done:


    ![Image](Images/7-7.jpg)


    This is a great first ladder. Once Kim was able to reach the top, she could make
    a similar ladder for the next sensations that she had been avoiding: dizziness
    and light-headedness. To face these sensations she could put her head between
    her knees, shake it, and then bring it up quickly. Next, she could move on to
    hyperating.


    Of course, this would be easier in the planning than in the doing. But Kim was
    determined, and she had a secret weapon to try—welcoming the sensations and the
    anxiety.


    You can download a Challenge Ladder for Panic worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    ### Acceptance


    Imagine for a minute that you are thrown into the middle of a vast sea. You flail
    your arms and kick your legs to keep from sinking, and at first it seems to work,
    but as you begin to tire the effect is just the opposite. To stay afloat you must
    spread your arms and legs as far apart you can and fill your lungs. By accepting
    and welcoming the water, rather than resisting it, you can stay afloat indefinitely.


    As you meet your first challenge you will start to feel sensations that are uncomfortable
    or that you associate with panic. Your first instinct will be to tighten up, clench
    your stomach, tense your muscles, and get up and move around. Remember that you
    are not to fight these sensations. Fighting these sensations is what got you into
    trouble in the first place. What you resist, persists.


    By resisting uncomfortable sensations you are agreeing with your monkey that these
    sensations are dangerous. To master your panic, do the opposite of your instincts
    and accept your uncomfortable sensations.


    ### Welcoming Breath


    As you have learned, when we get anxious, our breathing becomes shallow and fast.
    This type of breathing creates all sorts of physiological changes and has the
    effect of intensifying physical sensations, so that you end up resisting them
    even more, and breathing more quickly and shallowly. Breathing this way tells
    your body that you agree with your monkey: *Something is wrong!*


    To welcome anxious sensations rather than resisting them, breathe in the opposite
    way:


    1.  Breathe in deeply, filling your lungs so that your belly softens and expands.

    2.  Breathe out completely so that your belly contracts.

    3.  Repeat slowly and deliberately.


    By consciously choosing to breathe slowly and steadily you are telling your body,
    *I can handle this.* Breathing this way will help you ride out the intense and
    uncomfortable waves of sensation. And it has the additional benefit of training
    your monkey, which gets no banana when you welcome the anxiety it warned you about.

