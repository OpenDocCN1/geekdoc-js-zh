    ## 第 8 章


    # 特定恐惧症


    昆虫、呕吐和针头——救命！


    回到四年级，Anton 十岁时，他的同学在野外旅行的巴士地板上呕吐了。从那时，Anton 就对患胃肠炎感到极度恐惧。他避免乘坐校车，除非是往返学校，而那路程很短。他拒绝乘坐巴士参加野外旅行，所以要么是他父母开车送他，要么是他根本不去。如果学校里有人抱怨感到不舒服，Anton
    就会开始恐慌，并尽可能避开那个人。他不断检查自己的身体是否有恶心的迹象，每当他感到饥饿或太饱时，他都会担心这种不适可能是他生病的征兆。Anton 还担心吃可能让他生病的食物，所以他总是检查有效期，并想知道食物在
    particular 吃之前在外面放了多久。他随身带着抗酸药来镇胃。最糟糕的是，Anton 晚上经常难以入睡，因为他担心自己会在半夜醒来呕吐。


    Anton 有一种特定恐惧症，这意味着他对特定的事物或情境有极度的恐惧。你在第 2 章见过的 Justin 对狗有特定恐惧症。Anton 的恐惧症集中在呕吐上。


    恐惧症非常常见。事实上，大多数人都有某种程度的恐惧症。被某些事物惊到是人性的一部分。但当你的恐惧症阻止了你做你想做的或去你想去的地方时，这就是一个真正的问题。


    这就是 Anton 正在经历的情况。他不能去他朋友喜欢的某些餐厅吃饭，因为担心食物会让他生病。他不能进行长途汽车旅行，因为他担心自己会晕车。如果他的任何朋友或他们家中的任何人最近生病了，他就不会靠近那些朋友。他的恐惧症阻碍了他按照自己想要的方式生活。


    特定恐惧症可能关于几乎任何事物，但这里是一些最常见的类型：


    *   动物：狗、猫、老鼠、大鼠、鸟、蛇、昆虫

    *   自然环境中发生的事物：高度、水、雷雨或闪电

    *   情境和地点：乘汽车旅行、飞机、火车或船只；密闭空间如衣柜和隧道

    *   医疗问题：受伤、针头、医院

    *   疾病和身体功能：呕吐、胃肠炎、食物中毒、药物或食物窒息、喉干、无法呼吸


    就像所有的焦虑一样，特定恐惧症根源于我们对生存的基本需求。有很多动物——甚至是昆虫——可以杀死你。人们*确实会*溺水、坠落死亡或被闪电击中。事故*确实会*发生在乘坐汽车和飞机的人身上。如果你被困在狭窄空间，你*可能会*死亡。


    但尽管恐惧症源于潜在威胁，但它们是不现实且夸张的。对于焦虑的青少年来说，大脑中决定什么是危险的部分（我们称之为“猴子大脑”）是过度活跃的且对威胁过度敏感。它犯了一个经典的计算错误：1)
    高估了威胁，2) 低估了你处理的能力。这种对危险的评估无异于一次疯狂的猜测。


    所以，为什么你的“猴子大脑”会对你的特定恐惧症做出疯狂猜测呢？你无法真正知道。你天生的基因以及父母或照顾者对你榜样的行为可能产生了影响。可能还有某次糟糕的经历触发了你的恐惧症。


    第 2 章的 Justin 在被狗攻击后产生了对狗的恐惧。如果你看到或读到过惨痛的飞机坠毁或有人被闪电击中，你可能会对同样的事情发生在自己身上产生恐惧。或者你可能被训练得对某事要格外小心。从小起，甚至在他产生对呕吐的恐惧之前，Anton
    的妈妈就告诉他，每当周围有病人的人时要用鼻子呼吸。


    无论你的恐惧症是如何起源的，问题都是一样的。当你面对你的恐惧症时，你的猴子大脑会触发你的焦虑警报，你发现自己处于战斗或逃跑模式。你觉得威胁是真实的，并会竭尽办法规避它。然后，当并没有发生坏事时，你的猴子会归功于保护了你的安全，强化了它最初对危险的疯狂猜测，从而再次开始整个过程。这就是让所有焦虑持续的*回避循环*。


