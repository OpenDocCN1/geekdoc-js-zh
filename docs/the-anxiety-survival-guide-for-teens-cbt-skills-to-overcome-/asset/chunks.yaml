- fmt: "\nIf Anton stays away from his best friend who is sick with the flu, and then\
    \ does not himself get sick, his monkey mind decides, *Because you avoided your\
    \ friend, you didn’t get sick and throw up!*\n\nHere are some typical examples\
    \ of monkey logic about different phobias:\n\n* **Monkey thought:** *What if a\
    \ spider jumps down on you at night and bites you in your sleep?*\n* **Avoidant\
    \ behavior:** Look around the bed and corners of the room to make sure there are\
    \ no spiders.\n* **Monkey logic:** *Because you made sure there were no spiders\
    \ you did not get bitten.*\n\n* **Monkey thought:** *If you get a shot it will\
    \ hurt really, really bad and you won’t be able to stand it!*\n* **Avoidant behavior:**\
    \ Don’t go to the doctor or dentist.\n* **Monkey logic:** *Because you didn’t\
    \ get a shot, you didn’t have to endure horrible pain.*\n\n* **Monkey thought:**\
    \ *What if you get struck by lightning?*\n* **Avoidant behavior:** Don’t go outside\
    \ if it’s raining or cloudy.\n* **Monkey logic:** *Because you didn’t go out,\
    \ you did not get struck by lightning.*\n\n* **Monkey thought:** *What if a piece\
    \ of popcorn gets stuck in your throat and you can’t breathe?*\n* **Avoidant behavior:**\
    \ Avoid eating popcorn, or eat popcorn but always have a drink ready in case it\
    \ gets stuck in your throat.\n* **Monkey logic:** *Because you didn’t eat popcorn\
    \ or had water nearby, you didn’t choke and die.*\n\n* **Monkey thought:** *If\
    \ you go on an elevator it might get stuck and you’ll never get out.**\n* **Avoidant\
    \ behavior:** Take the stairs instead.\n* **Monkey logic:** *Because you took\
    \ the stairs, you didn’t get trapped in the elevator.*\n\n## Tools to Tame the\
    \ Phobia Monkey\n\nOnce your monkey mind decides something is dangerous—spiders\
    \ or heights or your own closet, it doesn’t matter—it sounds the alarm, putting\
    \ you in fight-or-flight mode. When your body is flooded with fear, even the wild\
    \ guesses of your monkey mind can actually feel true. So how do you know if the\
    \ thing you’re afraid of is actually dangerous or not?\n\n### Monkey Miscalculations\n\
    \nYou can always tell a monkey thought by its miscalculations. Monkeys just aren’t\
    \ very good at assessing risk. In addition to the classic over/underestimating\
    \ miscalculation, with specific phobias the following three miscalculations are\
    \ usually found:\n\n1. **Catastrophizing:** The monkey mind imagines the worst\
    \ that could happen.\n   * *What if you get bitten by a rattlesnake while hiking?*\n\
    \   * *It is storming; what if you get struck by lightning?*\n   * *What if the\
    \ bridge collapses while you are driving across it?*\n   * *What if a pill gets\
    \ stuck in your throat and you choke to death?*\n\n2. **Discounting the positive:**\
    \ Your monkey forgets all the times you have been in your feared situation and\
    \ nothing bad happened. How many times have you walked past bees and not been\
    \ stung, or felt nauseous and not thrown up, or been in an elevator that did not\
    \ get stuck? Too many to count. But your monkey mind will not take good outcomes\
    \ into consideration. Its job is to detect threat, no matter how unlikely—which\
    \ takes us to the last monkey miscalculation.\n\n3. **Intolerance of uncertainty:**\
    \ If there is even a `.01` percent chance that something terrible could happen,\
    \ your monkey will not rest. A great example is the fear of flying. Airplanes\
    \ are by far the safest way to travel, with the odds of you dying.\n\n### Spot\
    \ the Thought\n\nOnce your monkey mind decides something is dangerous—spiders\
    \ or heights or your own closet, it doesn’t matter—it sounds the alarm, putting\
    \ you in fight-or-flight mode. When your body is flooded with fear, even the wild\
    \ guesses of your monkey mind can actually feel true. So how do you know if the\
    \ thing you’re afraid of is actually dangerous or not?\n\n(Note: The text provided\
    \ by the user contained repetitive sections and fragmented sentences. I have structured\
    \ the core flow based on the instructions instructions.)\n"
