    第二天，那个最焦虑的猎人因为前天的逃跑而感到尴尬，他加入了一次狩猎队，决心好好表现自己。但每一片叶子的沙沙声在他听来都像老虎在；地面上的每一个脚印看起来都像老虎的爪印。仅仅是想到老虎就让猎人心跳加速、胃部翻腾，仿佛老虎就在他面前。他严重拖慢了狩猎队的速度，以至于被落在了后面。在那个晚上围火讲述的狩猎故事中，并没有提到他的名字。


    焦虑超过实际情况所需的程度，显然是不适应环境的。它会阻止你去做你想做和需要做的事情——对于我们这位焦虑的猎人来说，那就是为家庭和部落带回肉类。


    焦虑猎人的问题，以及你们的问题，在于：无论是否存在真实的危险，“战斗或逃跑”反应在感官上都是真实的。如果你的大脑认为某个情况是危险的——即使事实如此——你的神经系统也会做出相应的反应，让你的心跳如鼓、满头大汗、手指发麻、胃部恶心、喉咙收紧、头晕眼眩。这个系统正在发出虚假警报，就像你每次烤吐片就会响起的烟雾报警器一样。


    无论你正在做什么，这个系统一直在背景中嗡嗡运行。如果你在基因上——或者出于某种原因——对威胁格外敏感，你可能会收到大量的警报，警告你有坏事即将发生。我喜欢把大脑的这个部分称为`猴子心`（monkey
    mind）。它那源源不断的恐惧思绪就像一只受惊的猴子的嘈叫。


    ![Image](img/1-3.jpg)


    三个猎人的故事说明了关于焦虑的重要的一点：触发我们感受和行为的并非情况本身，而是我们对情况的`想法`。当一个带着响亮警报器、极度敏感威胁的猴子在思考时，它可怕的嘈叫会不断触发虚假警报，让你充斥着焦虑，阻止你走向你想去的地方，阻止你成为你想成为的人。


    这本书将告诉你如何停止让你的猴子心主宰你的生活——如何做出不受恐惧支配的选择。你将学会识别猴子的嘈叫，忽略虚假警报，并夺回对生活的生活的控制权。毕竟，生活的意义不仅仅是生存。你可以过上你想要的生活！


    ![Image](img/2-1.jpg)


    ## 第二章


    # 猴子逻辑


    ### 理解回避循环


    贾斯汀（Justin）是一个十五岁的少年，喜欢滑板。他骑着滑板去学校和去朋友家里，并尽可能在滑板公园待得久一点。一天，在和朋友滑完板回家的路上，公园里一只没牵绳的狗开始追他。贾斯汀正戴着耳机听音乐，没听到狗在靠近。当狗追上他时，将他撞下了滑板。那只狗的主人很快出现并拉开了狗，不断道歉。贾斯汀没有被咬到，但他觉得自己可能被咬了。他告诉狗的主人他没事，但带着满身淤青和魂不未定走回家。


    第二天，贾斯汀滑板去学校的路上，看到一个邻居正牵着她的大狗直接朝他走来。他感到心跳开始加速，意识到自己在恐慌，这和前一天的感觉很像。贾斯汀停下板拿起板。他离家只有一个街之遥，所以决定走回去，让父母其中一个开车送他去学校。当大门关上，他回到家里时，他感到平静多了。


    那天早晨的情况是贾斯汀以前遇到过的很多次：滑板去学校，途中路过一个遛狗的妇女。那只狗过去一直表现得很乖。是什么触发了他突然的“战斗或逃跑”反应呢？


    如果你问贾斯汀，他可能会回答：“我不知道。那只狗只是让我很紧张。”贾斯汀意识到的只有在看到狗时感到焦虑，而在转身回去时感到平静一些。但无论他是否意识到了，他的猴子心都以一种新的转折解释了那天早晨的情况。


    因为前一天和另一只狗相处的经历，加上贾斯汀恰好有一个对威胁过度敏感的神经系统，贾斯汀的猴子对这只牵绳的狗产生了一个新想法，这个想法引发了一阵焦虑：`如果那只狗脱了绳并攻击你怎么办？`


    如果贾斯汀深呼吸几次气，提醒自己狗是牵绳的，而且它以前从未攻击性，然后继续滑滑，那么故事可能就此结束。但贾斯汀的焦虑给了他沉重打击。这感觉像是一个真实的威胁。他做了所有焦虑的青人在被焦虑情绪淹没时会做：他回避了它。


    当猴子心对情况的解释被视为事实时，它总是会导致回避。


    ![Image](img/2-2.jpg)


    贾斯汀让父母开车送他上学的决定在我们看来似乎是反应过度。毕竟，狗是牵绳的，并不危险。但从贾斯汀的角度来看，这完全合逻辑。他的猴子心将狗解释为威胁引发了他的焦虑，而没有人想要感到焦虑。回避是书中讨论的所有类型焦虑的首选行为，即使是那些看起来与回避某事无关的焦虑。回避之所以成为首选行为，是因为它可以迅速降低你的焦虑。


    第二天当贾斯汀去拿滑板时，他感到了一小波焦虑。他心想自己是否会再次遇到那只狗。所以，为了安全起见，他又让父母开车送他去学校。


    回避的效果是如此快速且有效，你会想要再次使用它。问题在于，随着反复使用，回避产生产生的影响：`你越回避某种情况，那种情况就变得越可怕。`


    回避狗让贾斯汀保持了冷静，但并没有减轻他对狗的焦虑。他只要想到滑板就会感到焦虑。回避让他的焦虑变得更糟，并阻止了他去做他热爱的事。


    你的焦虑加剧的原因是，你的猴子心总是假设你刚刚采取的行动防止了事的发生。当贾斯汀的猴子看到他在家里且没有被狗咬时，它得出结论：`贾斯汀没有被狗攻击是因为他进了家里`。


    你可能会问，为什么猴子心在错误的情况下仍然重复同样的嘈叫。它在触发警报之前，难道从不质疑任何或重新审视情况吗？不。猴子心只有一个使命：确保你的安全。如果你是一个焦虑的人，你就拥有一只过度活跃且对危险过度敏感的猴子。它无法区分想象中的威胁和真实的威胁。它的焦虑想法并非经过深思熟虑，而只是疯狂的猜想。


    ![Image](img/2-3.jpg)


    你可能不认为你所做的是在回避什么。例如，担心也是回避吗？是的！当你在思考一个问题，在脑海中反复演练时，你是在寻找一种让自己`不感到焦虑`的解决方案。你是在回避实际上`感受`那个问题带来的焦虑。

