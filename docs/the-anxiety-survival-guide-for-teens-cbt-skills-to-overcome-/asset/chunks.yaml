    Identifying Anxious Thoughts


    Reading this book thus far, you have been using a part of your brain that’s totally
    different from the monkey mind. You’ve been using the rest of your brain, which
    sees the big picture and can take everything into account, not just potential
    threats. You are also listening to your heart. In your heart you know that there
    is more to your life than just staying alive. In your heart you hold your dreams
    of the future, how you want to live your life.


    This whole book is based on the central idea that you are not your monkey. The
    better you get at seeing the difference between the real you and that frightened
    little critter, the better chance you have of taking back control of your life.
    You—and by that I mean the bigger, smarter you—will learn to “spot the monkey”:
    to recognize monkey chatter and become aware of how it triggers your anxious feelings
    and avoidance.


    ## Tools to Tame the Monkey Mind


    Here are some great tools for spotting and taming that cute little beast. They
    will be worth every minute you spend on them.


    Life Compass


    Ask yourself whether you are moving *toward* things and situations you want to
    do and that are important to you. Or are you moving *away* from them? If you find
    yourself avoiding a situation that you really don’t want to avoid, even though
    there is no immediate danger, it’s likely your monkey had a hand in it.


    ![Image](Images/3-2.jpg)


    Justin loved skateboarding and the independence it gave him, yet monkey chatter
    put him in his parents’ car instead. Your monkey doesn’t take into account how
    you want to live your life. Your monkey mind’s only concern is keeping you alive.


    Spot the Thought


    Think of a situation that makes you anxious. Then ask yourself these three questions:


    1.  *What am I afraid of?*


    2.  *What’s the worst that could happen if this comes true?*


    3.  *What would this mean about me, my life, or my future?*


    These are the thoughts that drove your behavior in that situation. These thoughts
    might be reasonable and true—signals that this situation is somehow dangerous
    for you. Or they could be false alarms, a product of the monkey mind.


    Let’s follow along with Justin as he spots his thoughts.


    ![Image](Images/3-3.jpg)


    Monkey Miscalculations


    Compared to you, monkeys aren’t very bright, and neither is the monkey mind. When
    determining risk, the monkey mind consistently makes two mistakes: it *over*estimates
    the threat of something bad happening, and it *under*estimates your ability to
    cope if something bad *were* to happen.


    ![Image](Images/3-4.jpg)


    This double monkey miscalculation classifies safe situations as dangerous, setting
    off false alarms and putting your body into fight-or-flight mode. Overestimating
    or underestimating is just one way the monkey mind consistently miscalculates
    threats. Let’s look at some of the other kinds of monkey miscalculations.


    ![Image](Images/3-5.jpg)


    Catastrophizing


    Leaping to the worst possible conclusion, or *catastrophizing*, is perhaps the
    most common monkey miscalculation. Like a scary movie, the monkey mind is always
    imagining the worst possible outcome. Here are some examples of catastrophizing
    thoughts:


    *   You’re considering raising your hand to answer a question in class. *If you
    get this wrong, a rumor will start around school that you’re stupid.*


    *   Your boyfriend hasn’t returned a text. *He isn’t answering your text; he must
    be breaking up with you.*


    *   While driving, you feel a bump. *Did you run somebody over?*


    *   You see a spider on the wall. *It could be poisonous. What if it jumps onto
    you and bites you?*


    *   Your chest feels tight. *Are you having a heart attack?*


    *   You are having difficulty on a test. *If you flunk this it will show up on
    your transcript and you won’t get into college.*


    If you think your monkey mind is catastrophizing, ask it, “What’s really likely
    to happen?”


    ![Image](Images/3-6.jpg)


