    \n遭受焦虑困扰的青少年往往认为自己软弱、愚蠢或带有许多负面标签。你可能认为只有你有这种感觉，而其他人都是正常的。\n\n事实是，并没有所谓的“正常”。每个人都会感到焦虑，而且出现在各种令人惊讶的情况下。有些人在拥挤的食堂里感到焦虑，另一些人在空旷的大厅里。许多人在做口头报告时会恐慌，而另一些人在毫无明显的情况下随机感到恐慌。那个在欢呼声中大声呼喊战术的明星四卫，在心仪的女孩面前可能紧张得连话都说不。根据情况的不同，几乎每个人都可能被焦虑所淹没。\n\
