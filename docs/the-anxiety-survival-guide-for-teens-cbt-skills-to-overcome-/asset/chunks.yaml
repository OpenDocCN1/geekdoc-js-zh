- fmt: '

    The truth is, if you are a socially anxious teen, you are an intelligent, sensitive,
    and responsible person. Your biggest critic is inside you, not outside. You deserve
    to rule. Tell your monkey thank you, but it’s miscalculated again. You aren’t
    in any great danger, and whatever happens, you can cope!


    ![Image](Images/6-9.jpg)


    ![Image](Images/7-1.jpg)


    # Chapter 7: Panic and Agoraphobia


    ## Am I Dying or Going Crazy?


    Kim was sitting in the stands at her boyfriend’s football game when she suddenly
    had a tight feeling in her chest, as if someone were squeezing her really hard.
    She had trouble catching her breath, her heart seemed like it was beating out
    of her chest, and she felt light-headed and dizzy. She called her parents, who
    came and picked her up and took her to the emergency room. The doctor told her
    that she was having a panic attack and that, other than that, there was nothing
    wrong with her.


    If you’ve ever had a panic attack, you know how difficult it is to believe that
    there is nothing wrong with you. Suddenly, out of the blue and without warning,
    you feel like you are suffocating, or having a heart attack, or going crazy—or
    even all of those at the same time. Yet nothing is wrong?


    Well, something is wrong, but it’s not with your body. It’s your monkey mind at
    work, setting off alarms when there is no physical danger. When Kim’s chest tightened
    up and her heart rate increased—uncomfortable sensations for her—her monkey decided
    something was wrong. This is how a panic attack works, in slow motion:


    ![Image](Images/7-2.jpg)


    Kim was relieved to be told that nothing was wrong with her, and by the time she
    left the ER she felt almost normal. Things were fine until about three weeks later,
    when she had another panic attack while sitting in her biology class. She remembered
    what the ER doctor had said, but unfortunately, knowing that nothing was wrong
    “physically” did not help her feel less anxious. She was so light-headed that
    she was afraid she would faint or lose control in some way. She managed to stand
    up and leave the classroom, telling her teacher she felt ill. Then she called
    her mother to come pick her up right away. Her mother made an appointment with
    Kim’s doctor the next day to see if there was anything they could do. The doctor
    prescribed medication for Kim to take if she had another panic attack.


    After the second panic attack Kim began to worry that she would have another one.
    She carried her pills with her at all times, as well as her cell phone, in case
    she needed to call her parents. She began to watch for signs of panic. Whenever
    she felt an increase in her heart rate she worried that she would have another
    attack, and sometimes she did. Kim took a pill as soon as she felt the sensations
    coming on, and this usually kept her from having a full-blown panic attack.


    No matter how much you want to believe that panic attacks are not dangerous, they
    are so intense, so scary, that the thought of having another one causes you great
    anxiety. The monkey mind doesn’t learn from reading facts or listening to emergency
    room doctors.


    After the second attack, Kim’s monkey concluded that because her “dangerous” physical
    symptoms went away shortly after her mother arrived, leaving the classroom and
    calling her mother stopped the attack. When Kim takes medicine to dull her panic,
    and it reduces her symptoms, her monkey says, `Medicine is good!` and sounds the
    alarm if she goes anywhere without her prescription bottle. As with all anxiety,
    the central characteristic of Kim’s dilemma was her `avoidance`.


    ![Image](Images/7-3.jpg)


    And of course, avoidance does work. It became Kim’s default behavior because it
    gave her a sense of control. Here are some common avoidance strategies used by
    teens who have panic disorder:


    *   Avoid exercise that makes you feel hot and sweaty or makes your heart beat
    fast.

    *   Avoid caffeine, which might make your heart beat fast or make you feel tense
    or jittery.

    *   Avoid any substance that might make you feel different. This could be over-the-counter
    medications, prescription medications, illegal drugs, or alcohol.

    *   Avoid hot and stuffy places like cars and classrooms because they make you
    feel hot and sweaty.

    *   Avoid any place where you have had a panic attack before.

    *   Avoid going anywhere without the medication that has been prescribed to you.

    *   Avoid going places without your cell phone, in case you feel panic coming
    on and feel you need to make an emergency call.

    *   Avoid going places without people who make you feel safe.

    *   Avoid going too far from home or hospitals.


    The problem with all of these avoidance strategies is that they are dictated by
    anxious thoughts. When decisions are based on fear, your monkey mind is in control.
    The joy in life gets shoved aside because your monkey’s only concern is keeping
    you safe. And while you may experience some sense of control, which decreases
    your anxiety in the short run, in the long run you are making your anxiety worse.


    With every avoidance you strengthen your monkey’s logic that your avoidance is
    what saved you. So your monkey’s scary chatter gets louder and it seems more urgent.
    The relationship between your monkey’s false alarms, your anxious feelings, and
    your avoidant behavior is reinforced. As more and more situations and activities
    are avoided, you wander farther from your goal.


    ![Image](Images/7-4.jpg)


    ## Spotting the Panic Monkey


    When Kim’s monkey observed her her tight chest and racing heart, it sounded the
    alarm to `Woo-woo-woo! Get help! Be very afraid!`. It was only trying to do its
    job of keeping Kim safe, but as we know, monkeys are not good at assessing risks.
    Kim’s monkey overestimated the physical danger of panic sensations, and it underestimated
    Kim’s ability to cope.


    So how physically dangerous are panic sensations? The fact is they are not dangerous
    at all. They are simply fight-or-flight reactions, evidence of your body’s health
    than anything. Here is a list of common panic attack symptoms, each with a classic
    misinterpretation as well as an explanation of what is really going:


    *   **Sensation**: Dizziness, light-headedness

    *   **Monkey thought**: `What if you faint?`

    *   **Actual cause and purpose**: Anxiety causes changes in your breathing so
    that you take in more oxygen and breathe out more carbon dioxide. This mix helps
    fuel the large muscles so that you can outrun a threat. It also makes you dizzy
    and light-headed—but it doesn’t make you faint! In order to actually faint, you
    need a sudden drop in your blood pressure. During a panic attack the opposite
    happens: your heart rate and blood pressure go up. So although this is a common
    fear, fainting is very unlikely to occur.


    *   **Sensation**: Increased heart rate, heart palpitations, tightness in chest

    *   **Monkey thought**: `What if you are having a heart attack?`

    *   **Actual cause and purpose**: Your heart rate increases so that your heart
    can pump more oxygenated blood to your large muscles, letting you outrun or fight
    a threat. Your heart is a powerful muscle doing its job.


    *   **Sensation**: Difficulty breathing

    *   **Monkey thought**: `What if you suffocate and die?`

    *   **Actual cause and purpose**: Your breathing becomes more rapid so that you
    can fuel your large muscles with needed oxygen. This can cause a tight feeling
    in your chest or a sensation of not being able to catch your breath. In addition,
    your muscles tense to prepare to fight or flee. The muscles in your chest tighten,
    and you may misinterpret that as not being able to breathe.


    *   **Sensation**: Tingling or numb sensation in your face, hands, and feet

    *   **Monkey thought**: `What if you become paralyzed and lose control?`

