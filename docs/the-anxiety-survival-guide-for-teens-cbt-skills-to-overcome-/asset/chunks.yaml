  raw: '*Lucia was known in her family as a perfectionist. Her room was always neat,
    her books and papers organized, her clothes color-coded in her closet. She liked
    it this way and it did not cause a problem. But for no apparent reason, things
    started to get out of control. While doing assigned reading, she started to doubt
    that she fully understood what she had just read, so she began to reread everything.
    She started erasing and rewriting portions of her reports that didn’t look just
    right to her. She worried she may have left an important assignment behind in
    her classroom, locker, or car, so she went back and checked over and over again.
    She checked her backpack repeatedly to make sure she had everything in it. This
    checking began to take up a lot of time and was frustrating and stressful to her,
    but Lucia had trouble resisting the urge.*


    These four teens all suffer from obsessive-compulsive disorder, or OCD. Unlike
    the other types of anxiety in this book, OCD behavior can vary a great deal from
    teen to teen, which can make things a little confusing. But once we define OCD
    “obsessions” and “compulsions” you will see how they are all the same problem.


    ## Obsessions


    We often speak of being obsessed with a song, a sports team, or another person.
    Though we may not be able to get our minds off of those things, they are fun to
    think about. This is never the case with OCD obsessions.


    OCD obsessions are intrusive thoughts, images, or urges that you do not want and
    that cause you anxiety and distress. Even though these thoughts originate in your
    own head, they make little rational sense. Obsessive thoughts are generated in
    the part of your brain that is totally devoted to detecting threats—the monkey
    mind, where making wild guesses is standard operating procedure.


    OCD obsessions are also different from other kinds of worries because of their
    content. General worries, such as those discussed in the chapter on generalized
    anxiety, are about everyday types of things, like grades, money, and other people.
    OCD obsessions tend to be a little strange—like wondering if you ran someone over,
    thinking about hurting yourself or others, being concerned about germs on your
    clothes, needing things arranged just right, or doubting your own sexual orientation.
    If you have these kinds of obsessions, you know they are odd and you may be too
    embarrassed to talk about them with your friends.


    Most obsessions fall into one of four categories:


    **Contamination:** thinking you will “catch something” or be poisoned by touching
    a surface or object (or less commonly, fears of being contaminated by people with
    disabilities or unlikable characteristics, as if being around them or even thinking
    about them can make you become like them)


    *   Concern about germs and diseases, such as sexually transmitted infections,
    stomach flu, or cancer


    *   Fear of coming into contact with bodily fluids, like urine or feces


    *   Worrying about possible poisoning from common household cleaners like bleach
    and pesticides, or things in the environment, like radiation or poisonous plants


    **Harm or aggression:** thinking that you caused, or will cause, physical or emotional
    harm to someone else or to yourself


    *   Worrying that by doing something—or forgetting to do something—you will cause
    a fire, flood, burglary, or similar disaster


    *   Fear that you might do something like stab someone, run someone over, trip
    an old person, or say a random and hurtful thing


    *   Fear of not being careful enough and causing an injury by slipping or stepping
    on something, or ingesting something bad—like pills left out or spoiled food


    **Forbidden sexual or religious thoughts:** thoughts that undermine your identity
    or your sense of being a good or decent person


    *   Doubts about your sexual orientation


    *   Thoughts about being a child molester or committing incest


    *   Thoughts about sex with someone forbidden, like a teacher


    *   Thoughts about aggressive sexual acts, such as rape


    *   Thoughts about saying something against God


    *   Excessive concern with what is right and wrong or moral and immoral


    **Symmetry or exactness:** having a general sense of discomfort unless things
    are “just so,” or done in a certain way—or if something seems unfinished


    *   Needing things to be even, exact, or perfectly balanced


    *   Worrying about forgetting or losing something important


    *   Needing to know or remember things


    *   Having difficulty making decisions or throwing things away


    If your obsessive thoughts don’t quite fit into one of these four categories,
    that doesn’t mean you don’t have OCD. The defining feature of OCD is intrusive
    thoughts that cause anxiety. That’s where the other half of OCD—the compulsions—comes
    in.


    ## Compulsions


    OCD compulsions are behaviors with strict rules that you feel you must follow
    in order to prevent the things you’re obsessively thinking about from actually
    happening. These behaviors are considered compulsive due to the strong urge the
    OCD sufferer feels to do them. They are different from a normal routine in that
    they take up more time than you would like them to. Here are some common compulsions:


    **Checking**


    *   Checking to make sure you didn’t make a mistake


    *   Checking that you didn’t forget something or leave something behind


    *   Checking that you did not or will not cause harm


    *   Checking that you unplugged appliances or turned them off


    *   Checking to make sure you didn’t drop something


    *   Checking that you didn’t run someone over while driving


    *   Seeking reassurance from others that you didn’t do something bad or hurt someone,
    or that they are not sick, or that something is clean


    **Cleaning and washing**


    *   Hand washing or showering a certain way, length of time, or number of times


    *   Excessively washing your clothes or other belongings


    *   Washing yourself more than ordinarily necessary after going to the bathroom


    *   Doing other things—like wiping your hands or using hand sanitizer—to get rid
    of possible contaminants


    **Mental compulsions**


    *   Making mental lists, or reviewing things in your mind


    *   Using special words, images, or numbers (sometimes in response to a “bad”
    thought or image)


    *   Saying prayers in a set way to prevent something bad from happening


    *   Counting in your head while doing something a “right” or “safe” or “good”
    number of times


    **Repeating**


    *   Touching, tapping, or rubbing things in a certain way or a certain number
    of times, or turning things on and off again


    *   Doing things over again—like going in and out of doorways, getting up and
    down in chairs, or getting in and out of cars


    *   Repeating body movements like blinking


    *   Rereading, erasing, and rewriting; reviewing things in your mind that you
    may have said or done


    **Ordering or arranging**


    *   Lining things up or ordering and arranging your belongings so that things
    seem just right (for example, having your clothes color-coded, things lined up
    at right angles, or your desk arranged in a certain way)


    Once again, if you have a compulsion that doesn’t quite fit one of these descriptions,
    it does not mean you don’t have OCD. Your obsessions and compulsions, while seeming
    pretty strange, do stem from the same thing all anxiety problems stem from—the
    desire to keep yourself safe. Your monkey mind is just trying to do its job of
    keeping you alive. It’s doing what it does best: sensing danger, even where there
    is none, and sounding the alarm to tell you *Be afraid—very afraid!*


    But what are you actually afraid of? Why are OCD obsessions so powerful—powerful
    enough to make you act out compulsions over and over throughout your day?


    ## What’s Going On?


    Although the content of your obsession may not sound like life or death to others,
    or even to yourself—*Will I really burn down the house if I don’t check for the
    third time that the iron is turned off?—*your body is nevertheless in fight-or-flight
    mode. How do little ideas trigger such big fears?'
