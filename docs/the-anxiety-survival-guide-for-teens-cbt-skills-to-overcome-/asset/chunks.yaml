    \ behavior:** Don’t go to the doctor or dentist.\n\n*   **Monkey logic:** *Because\
    \ you didn’t get a shot, you didn’t have to endure horrible pain.*\n\n*   **Monkey\
    \ thought:** *What if you get struck by lightning?*\n\n*   **Avoidant behavior:**\
    \ Don’t go outside if it’s raining or cloudy.\n\n*   **Monkey logic:** *Because\
    \ you didn’t go out, you did not get struck by lightning.*\n\n*   **Monkey thought:**\
    \ *What if a piece of popcorn gets stuck in your throat and you can’t breathe?*\n\
    \n*   **Avoidant behavior:** Avoid eating popcorn, or eat popcorn but always have\
    \ a drink ready in case it gets stuck in your throat.\n\n*   **Monkey logic:**\
    \ *Because you didn’t eat popcorn or had water nearby, you didn’t choke and die.*\n\
    \n*   **Monkey thought:** *If you go on an elevator it might get stuck and you’ll\
    \ never get out.*\n\n*   **Avoidant behavior:** Take the stairs instead.\n\n*\
    \   **Monkey logic:** *Because you took the stairs, you didn’t get trapped in\
    \ the elevator.*\n\n## Tools to Tame the Phobia Monkey\n\nOnce your monkey mind\
    \ decides something is dangerous—spiders or heights or your own closet, it doesn’t\
    \ matter—it sounds the alarm, putting you in fight-or-flight mode. When your body\
    \ is flooded with fear, even the wild guesses of your monkey mind can actually\
    \ feel true. So how do you know if the thing you’re afraid of is actually dangerous\
    \ or not?\n\nMonkey Miscalculations\n\nYou can always tell a monkey thought by\
    \ its miscalculations. Monkeys just aren’t very good at assessing risk. In addition\
    \ to the classic over/underestimating miscalculation, with specific phobias the\
    \ following three miscalculations are usually found:\n\n1.  **Catastrophizing:**\
    \ The monkey mind imagines the worst that could happen.\n\n    *   *What if you\
    \ get bitten by a rattlesnake while hiking?*\n\n    *   *It is storming; what\
    \ if you get struck by lightning?*\n\n    *   *What if the bridge collapses while\
    \ you are driving across it?*\n\n    *   *What if a pill gets stuck in your throat\
    \ and you choke to death?*\n\n2.  **Discounting the positive:** Your monkey forgets\
    \ all the times you have been in your feared situation and nothing bad happened.\
    \ How many times have you walked past bees and not been stung, or felt nauseous\
    \ and not thrown up, or been in an elevator that did not get stuck? Too many to\
    \ count. But your monkey mind will not take good outcomes into consideration.\
    \ Its job is to detect threat, no matter how unlikely—which takes us to the last\
    \ monkey miscalculation.\n\n3.  **Intolerance of uncertainty:** If there is even\
    \ a .01 percent chance that something terrible could happen, your monkey will\
    \ not rest. A great example is the fear of flying. Airplanes are by far the safest\
    \ way to travel, with the odds of you dying in a plane crash at one in 11 million.\
    \ Yet fear of flying is quite common.\n\nSpot the Thought\n\nMonkey miscalculations,\
    \ like all thoughts, happen pretty quickly. If you have any difficulty figuring\
    \ out exactly what the thought is that triggers your phobia, try this exercise.\
    \ Ask yourself these two questions: *What am I afraid of?* and *What’s the worst\
    \ that could happen if this were true?*\n\nHere’s how Anton answered:\n\n![Image](Images/8-2.jpg)\n\
    \nOnce Anton had his thoughts spelled out in front of him, he realized he was\
    \ making all of these specific phobia monkey miscalculations. Assuming that Ashley\
    \ had the flu and that he would get it too was overestimating the threat. By assuming\
    \ that throwing up would be unbearable for him, he was catastrophizing and underestimating\
    \ his ability to cope. By forgetting all the times that others felt sick and he\
    \ did not throw up, he was discounting the positive. And when Ashley said she\
    \ felt sick, he jumped to conclusions instead of tolerating the uncertainty of\
    \ whether or not he would catch it and throw up.\n\nRecognizing these miscalculations\
    \ made Anton feel a little bit better. Though he wasn’t certain it would help\
    \ him feel any different the next time a similar situation came up, it did allow\
    \ him to distance himself from his monkey mind. He would have to gauge the actual\
    \ risk that was presented by Ashley’s feeling sick.\n\nYou can download a Spot\
    \ the Thought worksheet for phobias at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).\n\
    \nCollect the Data\n\nAs any scientist will tell you, to make accurate predictions\
    \ about the future you must look at past results. Scientists collect and analyze\
    \ lots of data before they come up with a theory. Monkeys are not scientists;\
    \ they can only make what are, at best, wild guesses and then push the alarm button.\
    \ You, however, are capable of collecting and evaluating data. You can determine\
    \ how likely you are to be hurt by the thing you are afraid of, rather than relying\
    \ on the wild guesses of a monkey.\n\n![Image](Images/8-3.jpg)\n\nFor the next\
    \ week Anton kept a list of the times he felt nauseous—what he was thinking at\
    \ the time and what actually happened. At the end of the week he reviewed his\
    \ data.\n\nHe had an incidence of feeling nauseous at least once a day—after eating\
    \ cafeteria pizza, after missing a meal, while smelling something cooking, or\
    \ while just lying in bed. He noticed that in each incidence his monkey mind told\
    \ him some variation of the same prediction: *You might be sick. You’re going\
    \ to throw up!*\n\nBut Anton didn’t throw up that week. He realized that his monkey\
    \ had predicted he would throw up at least once a day for years, ever since that\
    \ field trip when he was ten. In fact, in his entire life Anton could remember\
    \ only two times he had actually thrown up. Based on past performance, his monkey’s\
    \ chance of making a correct prediction was about one in a thousand!\n\nHave you\
    \ looked at the data for your specific phobia? For example, if you have a phobia\
    \ of bees, can you calculate how many times you have come into contact with a\
    \ bee and how many times you were actually stung? No matter what your specific\
    \ phobia, when you collect and compare the data you’ll see that your monkey’s\
    \ predictions almost never match the results.\n\nYou can download a Collect the\
    \ Data on Your Phobia worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).\n\
    \nEducate Yourself\n\nAnother great way to tame your monkey is to educate yourself\
    \ about whatever it is you’re afraid of. If you are afraid of flying, for example,\
    \ google “airplane safety.” If you are worried about poisonous snakes, find out\
    \ what types of snakes actually can be found in your area and what the death rate\
    \ is for bites.\n\nThe more you spot your thoughts, identify monkey miscalculations,\
    \ collect data, and educate yourself, the less reliable your monkey mind will\
    \ seem and the less compelling its alarms for your safety. Most likely, you will\
    \ then feel less anxious. You may even stop avoiding the thing you’ve been afraid\
    \ of.\n\nIf your anxiety is still so intense that you are avoiding, read on for\
    \ tools that will help you further tame the little critter.\n\n![Image](Images/8-4.jpg)\n\
    \n## Tools to Rule the Phobia Monkey"
