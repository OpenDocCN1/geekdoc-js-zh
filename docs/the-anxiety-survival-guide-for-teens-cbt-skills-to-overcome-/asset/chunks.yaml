    immediate danger. You don’t use your large muscles to fight or run from these
    things, so you don’t get any release.


    Constant worrying and the fight-or-flight response create a lot of muscle tension
    that can cause headaches and body aches. Your stomach may be in knots, causing
    stomachaches or diarrhea. Your heart beating faster than it needs to and your
    body being on high alert create nervous exhaustion. You may feel tired all the
    time and also have difficulty falling asleep.


    Have you ever watched a cat when it catches sight of a dog? The cat arches its
    back, its fur stands on end, and it hisses. As soon as the dog is out of sight,
    the cat lies back down in the sun, stretching out its arms and legs, and purrs.


    ![Image](Images/9-9.jpg)


    What the cat has done, naturally and automatically, is normalized itself after
    a threat has passed. When the dog appeared, the fight-or-flight response was activated.
    The dog disappeared and something else was activated. It’s called the *relaxation
    response.* It is as powerful as the fight-or-flight response, and as necessary.


    If it were possible for a cat to have generalized anxiety, it would not stretch
    back out and purr after the dog left. Instead it would be constantly anticipating
    the next dog that might come along. It would be like you, always in a state of
    worry and tension, and it would not be able to relax.


    ![Image](Images/9-b.jpg)


    Fortunately, you have the relaxation response too. It doesn’t get activated like
    it should, because your worries are always triggering the fight-or-flight response.
    But you can train your body to activate this response and learn to truly relax.


    ![Image](Images/9-a.jpg)


    The Golden Ball


    To do this exercise, you need to sit or lie down for ten minutes with no distractions.
    So find a private place and turn your phone off.


    Begin by closing your eyes and breathing slowly through your nose. Inhale deep
    down into your belly, and when you exhale say the word *relax*, or some other
    word or phrase that represents relaxation to you—such as *peace* or *let go* or
    *it’s okay*. Do this ten times.


    Now imagine that there is a golden ball of light over your head. This ball opens
    up and slowly pours its shimmering golden contents down over you, bathing your
    forehead, your eyes, and your jaw. It’s like warm honey that melts the tension
    in your neck, shoulders, and chest.


    As you inhale, slowly draw the golden light down deep into your belly. As you
    exhale, keep repeating your relaxation word or phrase. Let the warm, golden light
    radiate down into your hips, your thighs, your knees, your calves—all the way
    to your toes.


    It is very likely that while you are doing this exercise your monkey mind will
    continue to do its job, bringing up worries that draw your attention. This is
    perfectly all right. When you notice an anxious thought has distracted you, say,
    *Thank you, monkey*, then bring your attention back to your breath and to whatever
    part of your body the warm golden light was on.


    You may find it helpful to listen to music during this exercise. You can download
    an audio track with guided instructions at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    To get noticeable benefit from this relaxation technique, you will need to do
    it a minimum of once a day for six weeks. You will get even better results if
    you do it twice a day. This may seem like a lot of time, but if you compare the
    few minutes a day these exercises would take to all the time you spend worrying,
    it won’t seem so bad.


    *Tess got a B on her test, which wasn’t as good as she had hoped. She was disappointed,
    but because she’d been using her taming tools regularly, she did not go back to
    worrying about getting into a good college. She was able to put her attention
    into learning the new material she was getting in the class. She knew that, besides
    being prepared by studying, there was nothing else she could do. Her grades were
    up to her teacher, and beyond her control.*


    When you welcome the anxiety of not knowing how everything will turn out, you
    stop the avoidance cycle. Monkey miscalculations have turned your life into a
    minefield, where everything you want to do has to be agonized over. You deserve
    much more. You deserve to live the life you envision for yourself, free of senseless
    worry. What are you waiting for?


    ![Image](Images/10-1.jpg)


    Chapter 10


    # Separation Anxiety


    Stand by Me


    *Maria hated to be alone. It was worse at night, but she did not like to be alone
    during the day either. She had been dating her boyfriend, Roberto, for six months
    and was in almost constant contact with him, texting and calling him at all hours.
    If he did not respond immediately she began to panic, worrying that something
    had happened to him.* What if he was in an accident? *Maria wondered.* Or what
    if he’s no longer interested in me? *So she texted and called Roberto repeatedly
    until he responded. When he told her that he felt suffocated by her, Maria felt
    even more anxious and began checking on Roberto even more frequently, even though
    she knew it was pushing him away.*


    Maria has *separation anxiety*, the fear of being away from a person one feels
    particularly attached to. If you have separation anxiety, you may feel closely
    attached to a parent, a close friend, or someone you are dating. When you’re separated
    from this person, even for a few hours, you begin to feel anxious or on edge.
    You feel as if you will be alone forever, the person may die or leave for good,
    and you will fall apart.


    As you have learned in this book, anxiety is triggered by anxious thoughts. These
    anxious thoughts are generated by the part of our brain most devoted to keeping
    us safe—the part we call the monkey mind. Your monkey takes its job very seriously.
    When you look at the experience of being separated from a parent or a loved one
    through the eyes of a hypervigilant monkey, whose total focus is keeping you protected
    and safe, you can see where those anxious thoughts come from.


    We are all born dependent on our parents or caregivers. As babies we cannot care
    for ourselves. If no one responded to our cries, we would die. As infants, we
    will respond to anyone who will care for us, but we learn to recognize our parents
    or caregivers very early on and grow attached to them, just as the parents grow
    attached to the infant.'
