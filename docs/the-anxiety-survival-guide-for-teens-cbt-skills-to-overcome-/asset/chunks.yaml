    You would not get used to it if you were to keep your eyes closed partway while
    watching it over and over again. In order to get used to something, you have to
    open your eyes and let yourself see it all. It is the same with your anxious monkey
    thoughts. If you keep thinking them on purpose, they lose their power. The less
    you do to try to control the thought, and the more you welcome it, the less anxiety
    it will bring.


    When you face something that is not truly dangerous, whether it is a movie scene
    or your own anxious thoughts and feelings, you will get used to it and know that
    you do not need to act on it at all.


    The worst-case scenario exercise is important practice for what comes next, so
    don’t take it lightly. When you’ve reread your script so many times that it seems
    almost silly, you’ll know you are in charge. You’ll be ready to change your behavior.


    ## The Challenge Ladder


    Avoidant behaviors—like never allowing yourself to be alone, going places you
    don’t want to go to just to be near someone, and checking to make sure that that
    person is alive—are what have been feeding your monkey, making your separation
    anxiety stronger and stronger. You will change these behaviors one at a time,
    starting with the least scary situations and moving up slowly, like climbing rungs
    on a ladder. (Download the Challenge Ladder worksheet at `http://www.newharbinger.com/32431`.)


    You can make different rungs on your ladder by varying the distance and time out
    of contact with the person you are dependent on. Here is what Maria’s ladder looked
    like:


    ![Image](Images/10-6.jpg)


    By not checking up on Roberto constantly, Maria realized, she would have extra
    time to herself to fill. To help her focus on other things besides Roberto while
    she worked up the rungs of her ladder, she made a short list of things she used
    to do. They included studying, listening to music, talking with or doing things
    with friends, and going to the ice skating rink.


    When Maria started on the first rung, the first fifteen minutes went by pretty
    easily, but it wasn’t long before she began to feel bored and agitated. She felt
    the urge to pick up her phone to see if Roberto had called her, just as she had
    done so many times in the past. Her monkey had gotten her in a habit of checking
    her phone every few minutes, and not doing so felt strange.


    This was a good sign that Maria was on the right track. Feeling strange is good.
    If the exercise is comfortable for you, either you are not doing it right, or
    you picked something that is too easy for you—in which case you should go to the
    next rung on your ladder.


    By the time her first half hour was up, Maria couldn’t wait to call Roberto and
    tell him what she had just done. He didn’t seem very impressed, and he suggested
    she try not calling for a longer period. Maria knew she wasn’t ready for that.
    For the next few days she repeated her half-hour exercise several times a day,
    and by the fifth time she noticed it was easy. Her monkey mind was still chattering
    away, telling her to call Roberto, but somehow it didn’t seem that compelling.
    And she was actually finding some of her English assignments interesting. She
    found herself thinking, *I can do this!* It was time to move up another rung.


    Within a few weeks, Maria could go all morning without calling or texting Roberto.
    She took regular walks around her neighborhood without her cell phone, and she
    could study for an hour at a stretch without being too distracted by monkey alarms.
    The thought of doing an overnight without checking on her boyfriend still sounded
    like too much for her, so she kept working the rung below it, building up courage.
    When he went away with his grandparents, she called him more than she had planned,
    but less than she used to.


    Over time, it became easier and easier for Maria to go longer periods without
    checking on Roberto. Although her monkey mind kept coming up with thoughts that
    her boyfriend was injured or dead, or had left her, and that she would never see
    him again, her alternative thoughts that he was safe and still loved her felt
    more true. She had so much more time in her life now for other things in addition
    to Roberto. And then something else happened that really surprised her. In the
    past Roberto almost never called her or texted her, and he ignored most of her
    checks on him. Now he was calling and texting her as much as she was calling and
    texting him! She realized that following her monkey’s rules had been having the
    effect of pushing Roberto away. Now that she was in charge, not only was she was
    becoming more independent but she and Roberto were growing closer together.


    Are you ready to rule your separation anxiety monkey? There is nothing holding
    you back from being truly independent except your own anxious thoughts and feelings.
    Healthy relationships depend on you being comfortable being alone, able to stand
    on your own two feet. Have courage—you can do it!


    ![Image](Images/11-1.jpg)


    ## Chapter 11


    # Obsessive-Compulsive Disorder


    ### Don’t Step on That Crack!


    Jon was super excited to be a newly licensed driver. A week into his independence
    there was a tragic accident in his town, in which another teenager hit and killed
    a pedestrian crossing the street. The next time Jon was driving he felt a slight
    bump in the road. The thought popped into his head that maybe he had just run
    over somebody. He knew this was ridiculous, but he could not get this fear out
    of his head. Even though he didn’t see anything when he checked his rearview mirror,
    he still felt anxious. It was not until he circled back around to the spot where
    he’d felt the bump and saw that there was nothing there that his anxiety decreased.


    Ever since seventh-grade health education class, when homosexuality was discussed,
    Dan noticed the thought *What if I am gay?* popping into his head. He was attracted
    to girls, and had nothing against gay people. (In fact, his best friend had two
    moms.) But this doubt caused him considerable anxiety. All sorts of things started
    to trigger the thought. Seeing male models in magazines, any words for homosexuality,
    even being around girls would trigger the thought. He began to mentally reassure
    himself with evidence that he was not gay. He monitored his body closely for any
    signs of arousal when around males. Doing so made him feel a little better for
    a short while, but the doubt just wouldn’t go away.


    Shaneesha first started washing her hands when she was around anyone who was sick.
    She had thought this was reasonable because her frail grandmother lived with her
    and everyone in the family took precautions to prevent her from getting sick.
    Then Shaneesha had the thought that her clothes may have come into contact with
    germs that were on school desks or any public place. She began to change her clothes
    as soon as she got home. This helped reduce her anxiety at first, but then she
    felt she needed to change her clothes and take a shower, and after that not come
    into contact with anything that could have gotten contaminated at school—including
    her phone, backpack, or books. She knew this had gone too far, but the feelings
    were so strong she couldn’t stop herself.

