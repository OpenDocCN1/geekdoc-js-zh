  trans: "\n\n如果安东（Anton）远离患了流感的好朋友，然后自己也没有生病，那么他的“猴子脑”就会决定：*因为你避开了你的朋友，你才没有生病和呕吐！*\n\
    \n以下是关于不同恐惧症的“猴子逻辑”的几个典型例子：\n\n*   **猴子想法：** *如果一只蜘蛛在晚上掉到你身上并在你睡觉时咬了你怎么办？*\n*\
    \   **回避行为：** 环顾床边和房间角落，确保没有蜘蛛。\n*   **猴子逻辑：** *因为你确保了没有蜘蛛，所以你才没有被咬。*\n\n*   **猴子想法：**\
    \ *如果你打针，会非常非常、非常疼，你将无法忍受的！*\n*   **回避行为：** 不要去看医生或看牙医。\n*   **猴子逻辑：** *因为你没有打针，所以你不需要承受可怕的痛苦。*\n\
    \n*   **猴子想法：** *万一被雷劈了怎么办？*\n*   **回避行为：** 如果下雨或阴天，就不要出门。\n*   **猴子逻辑：** *因为你没有出门，所以你没有被雷劈。*\n\
    \n*   **猴子想法：** *万一有一粒爆米花卡在喉子里让你无法呼吸怎么办？*\n*   **回避行为：** 避免吃爆米花，或者吃爆米花时随时准备好饮料，以防卡住喉咙。\n\
    *   **猴子逻辑：** *因为你没有吃爆米花，或者身边有水，所以你没有窒息死亡。*\n\n*   **猴子想法：** *如果你坐电梯，它可能会卡住，你永远无法得出来。*\n\
    *   **回避行为：** 改走楼梯。\n*   **猴子逻辑：** *因为你走了楼梯，所以你没有被困在电梯里。*\n\n## 驯服恐惧猴的工具\n\n一旦你的猴子脑决定某事是危险的——无论是蜘蛛、高度还是你自己的衣柜——它它就会拉响警报，让你进入战斗或逃跑模式。当你的身体被恐惧淹时，即使是猴子脑的荒野猜想也可能看起来是真的。那么，你如何知道你所害怕的事物是否真的危险呢？\n\
    \n### 猴子的计算错误\n\n你总是可以通过猴子的计算错误来判断一个“猴子想法”。猴子其实并不擅长评估风险。除了经典的高估或低估计算错误外，针对特定的恐惧症，通常会发现以下三种计算错误：\n\
    \n1.  **灾难化：** 猴子脑想象可能发生的最坏情况。\n    *   *如果你在徒步时被响环蛇咬了怎么办？*\n    *   *正在暴雨；万一你被雷劈了怎么办？*\n\
    \    *   *当你开车通过桥梁时，桥塌了怎么办？*\n    *   *万一药片卡在喉咙导致你窒息而怎么办？*\n\n2.  **忽略正面因素：**\
    \ 你的猴子忘记了所有你处于恐惧情境但没有发生任何事的情况。你有多少次路过蜜蜂没有被蜇，或者感到恶心但没有呕吐，或者坐过没有卡住的电梯？多到数不完。但你的猴子脑不会考虑良好的结果。它的工作是探测威胁，无论可能性有多小——这把我们带来了最后一种猴子计算错误。\n\
    \n3.  **对不确定性的不忍：** 即使只有 `.01` 百分的概率可能发生可怕的事情，你的猴子也不会休息。一个极好的例子是恐高。飞机是目前为止是最安全的旅行方式，你的概率极低。\n\
    \n### 识别想法\n\n一旦你的猴子脑决定某事是危险的——无论是蜘蛛、高度还是你自己的衣柜——它就会拉响警报，让你进入战斗或逃跑模式。当你的身体被恐惧淹时，即使是猴子脑的荒野猜想也可能看起来是真的。那么，你如何知道你所害怕的事物是否真的危险呢？\n\
    \n（注：用户提供的文本包含重复章节和碎片句子。我根据指令对核心流程进行了结构处理。）\n\n"
