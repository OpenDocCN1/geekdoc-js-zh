  trans: '

    如果你在反复观看某件事时一直闭上一部分眼睛，你是无法习惯它的。要习惯某事物，你必须睁开眼睛，让自己看到全部。你那些焦虑的猴子思维也是如此。如果你刻意去想这些想法，它们就会失去力量。你越少尝试控制这些想法，越是欢迎它们，它们带给焦虑就越少。


    当你面对并不真正危险的事情时（无论是电影场景还是你自己的焦虑想法和感受），你都会习惯它并知道你完全不需要对此采取行动。


    “最坏情况练习”是接下来的步骤的重要练习，所以不要轻视它。当你反复阅读你的脚本直到它看起来几乎很傻时，你就知道自己掌握了主动权。你准备好改变自己的行为了。


    ## 挑战梯子


    回避行为——比如从不让自己独处、为了靠近某人而去不想去的地方、以及检查那个人是否还活着——这些行为一直在喂养你的“猴子”，让你的分离焦虑越来越严重。你将一个一个地改变这些行为，从最不害怕的情况开始，慢慢向上，就像爬梯子一样。（请在
    `http://www.newharbinger.com/32431` 下载挑战梯子工作表。）


    你可以通过改变与你依赖的人保持距离和断联系的时间，在梯子上建立不同的阶梯。以下是玛丽亚的梯子的样子：


    ![Image](img/10-6.jpg)


    玛丽亚意识到，通过不不断检查罗伯托，她会有额外的个人时间来填充。为了帮助她在爬梯子阶梯时专注于罗伯托以外的事情，她列了一份她过去常做的事情的小清单。这些包括学习、听音乐、和朋友聊天或一起做事情，以及去滑冰场。


    当玛丽亚开始爬第一阶时，前十五分钟过得相当容易，但没多久她就开始感到无聊和焦躁。她冲动想拿起手机看看罗伯托是否给她打了电话，就像她过去很多次做的那样。她的猴子已经让她习惯了每几分钟检查一次手机，不这样做让她感到很奇怪。


    这是玛丽亚处于正确轨道上的良好信号。感到奇怪是好的。如果这项练习让你感到舒服，要么是你没做对，要么是你选了一个对你来说太容易的东西——在这种情况下，你应该走向梯子上的下一个阶梯。


    当第一个半小时结束时，玛丽亚等不及要给罗伯托打电话告诉他她刚刚做了什么。他看起来并不很惊讶，并建议她尝试更长时间不拨打。玛丽亚知道她还没准备好。在接下来的几天里，她每天重复几次半小时的练习，到第五次时，她注意到这很容易。她的猴子脑仍在嗡嗡响，叫她给罗伯托打电话，但不知为什么这似乎不再那么有吸引力了。她真的发现一些英语作业很有趣。她发现自己自己在想：*我可以做到的！*
    是时候再向上爬一个阶梯了。


    在几周内，玛丽亚可以整个上午不给罗伯托打电话或发短信。她不带手机在社区周围散散步，可以连续学习一小时而不会被“猴子报警”太分心。在不检查男朋友的情况下度过一夜的想法对她来说仍然太难了，所以她继续在下面一一阶练习，积累勇气。当他和祖父母出去旅行时，她给他的电话次数比计划的多，但比以前少。


    随着时间的推移，玛丽亚长时间不检查罗伯托变得越来越容易。尽管她的猴子脑不断产生出男朋友受伤了、死了，或者离开了她，让她再也见不到他的想法，但她认为他是安全的、仍然爱她的替代性想法感觉更真实。现在她的生活中除了罗伯托之外，有更多时间可以做其他事情。然后发生了另一件真的让她很惊讶的事。过去罗伯托几乎从不给她打电话或发短信，而且无视了她大部分的检查。现在他给他打电话和发短信的频率和她的一样多！她意识到，遵循猴子的规则起到了推开罗伯托的效果。现在她掌握了主动权，不仅自己变得更加独立，而且和罗伯托也变得更加亲密了。


    你准备好统治你的分离焦虑猴子了吗？除了你自己焦虑的想法和感受，没有什么能阻碍你变得独立。健康的关系取决于你能够习惯独处，能够自立。。要有勇气——你可以的！


    ![Image](img/11-1.jpg)


    ## 第 11 章


    # 强迫症


    ### 不要踩那道缝！


    乔对成为一名新手驾驶员感到超级兴奋。在独立一周后，他的镇上发生了一场悲剧性事故，另一名青少年撞并杀死了一名过马路的行人。下次当乔开车时，他感到路面轻微的颠簸。一个念头跳入脑：也许他刚刚撞到了人。他知道这很荒谬，但他无法将这种恐惧从脑海中赶出去。尽管他在检查后视镜时什么都没看到，但他仍然感到焦虑。直到他绕回到他感到颠簸的地方，发现那里什么也没有，他的焦虑才减轻了。


    自从七年级健康教育课讨论同性恋起，丹就注意到*如果我是同性恋者怎么办？*这个想法跳入他的脑海。他被女孩吸引，对同性恋者并没有偏见。（事实上，他的好朋友有两个妈妈。）但这种怀疑带给了他相当的焦虑。各种事情开始触发这个想法。看到杂志上的男模特、任何关于同性恋的词汇，甚至待在女孩身边都会触发这个想法。他开始在脑子里用证据来安慰自己不是同性恋者。他在男性周围时会密切监控自己的身体是否有任何兴奋的迹象。这样做让他在短时间内感觉好了一点，但怀疑就是挥之不去。


    谢尼莎第一次在任何生人生周围就开始洗手。她认为这是合理的，因为她虚弱的奶奶和她住在一起，家里每个人都采取预防措施防止奶奶生病。然后谢尼莎想到她的衣服可能接触了来自学校课桌或任何公共场所的细菌。她一回家就开始换衣服。这起初有助于减轻她的焦虑，但她觉得需要换衣服并洗澡，在那之后不要接触任何在学校可能被污染的东西——包括她的手机、背包或书本。她知道这做得过头了，但那种感觉太强烈了，她无法控制自己。

