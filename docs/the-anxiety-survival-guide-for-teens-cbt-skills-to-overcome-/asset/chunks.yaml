- fmt: '

    The best thing about doing this exercise regularly is that whenever your monkey
    mind starts to chatter noisily throughout the day, you can tell it firmly that
    you will give it your full attention, but only during worry time. Do your best
    to continue to do whatever you are doing in that moment, other than worrying.
    You can even write the worry thought down so that you don’t forget what to worry
    about during your worry time.


    ![Image](Images/9-8.jpg)


    Remember that worry time, like all endeavors, takes discipline. You will need
    to commit to a time every day and follow through. And you may need many sessions
    before you notice a change. But with practice you will find yourself more and
    more in charge, and your monkey will become easier to ignore. By taking control
    of when and how to worry, you are depriving your monkey of its usual reward. *No
    banana today, sorry!* This is how you tame the little critter.


    You can download a Worry Time worksheet at [http://www.newharbinger.com/32431](http://%20http://www.newharbinger.com/32431).


    # The Relaxation Response


    Generalized worry can cause a lot of stress in the body. Every time you treat
    monkey chatter as a signal of real danger, you trigger a fight-or-flight response.


    When the fight-or-flight response is activated your heart beats faster, your muscles
    tense up, and your stomach stops digesting so that more energy can go to your
    large muscles. This would be fine if you were actually using your body to outrun
    a saber-toothed tiger or protect yourself against a bully. But the things that
    teens with generalized anxiety worry about are not things that will put them in
    immediate danger. You don’t use your large muscles to fight or run from these
    things, so you don’t get any release.


    Constant worrying and the fight-or-flight response create a lot of muscle tension
    that can cause headaches and body aches. Your stomach may be in knots, causing
    stomachaches or diarrhea. Your heart beating faster than it needs to and your
    body being on high alert create nervous exhaustion. You may feel tired all the
    time and also have difficulty falling asleep.


    Have you ever watched a cat when it catches sight of a dog? The cat arches its
    back, its fur stands on end, and it hisses. As soon as the dog is out of sight,
    the cat lies back down in the sun, stretching out its arms and legs, and purrs.


    ![Image](Images/9-9.jpg)


    What the cat has done, naturally and automatically, is normalized itself after
    a threat has passed. When the dog appeared, the fight-or-flight response was activated.
    The dog disappeared and something else was activated. It’s called the *relaxation
    response.* It is as powerful as the fight-or-flight response, and as necessary.


    If it were possible for a cat to have generalized anxiety, it would not stretch
    back out and purr after the dog left. Instead it would be constantly anticipating
    the next dog that might come along. It would be like you, always in a state of
    worry and tension, and it would not be able to relax.


    ![Image](Images/9-b.jpg)


    Fortunately, you have the relaxation response too. It doesn’t get activated like
    it should, because your worries are always triggering the fight-or-flight response.
    But you can train your body to activate this response and learn to truly relax.


    ![Image](Images/9-a.jpg)


    # The Golden Ball


    To do this, sit in a comfortable place and close your eyes. Take a few deep breaths.
    Imagine a golden ball of light in front of you. This ball represents your peace
    and calm. As you inhale, imagine the light entering your body, filling you with
    warmth. As you exhale, imagine any tension or worry leaving your body and entering
    the golden ball.


    Repeat this process for several minutes, or until you feel relaxed. If your mind
    wanders, gently bring your attention back to the golden ball and your breath.

