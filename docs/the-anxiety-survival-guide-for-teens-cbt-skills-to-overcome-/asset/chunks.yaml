- fmt: "\nAt around nine months of age, a child may cry or scream if her caretaker\
    \ leaves the room or if a stranger tries to pick her up. This dependence on the\
    \ caregiver is adaptive. It keeps the toddler from going too far away from the\
    \ parent she depends on to feed her and keep her safe. By the age of two, when\
    \ children are walking and ready for more independence, they understand that the\
    \ parent will return.\n\n![Image](Images/10-2.jpg)\n\nSo what about Maria’s dependence\
    \ on her boyfriend? You and I, and even Maria, can see that her anxiety is not\
    \ rooted in reality. Maria is not dependent on `Roberto` for food and care. Maria’s\
    \ monkey mind is making miscalculations that are triggering her to act in a way\
    \ that is not in her best interest. Instead of growing closer to the boy she loves,\
    \ she’s pushing him away.\n\nMaria’s monkey is sounding a full-scale alarm in\
    \ a situation that is not actually dangerous. It is making the classic mistake\
    \ it makes in all types of anxiety: over/underestimating. It is overestimating\
    \ the chance that `Roberto`’s goodbye is forever—that she will never see him again—and\
    \ it is underestimating her ability to be alone.\n\nMaria’s monkey mind has convinced\
    \ her that she must act on her anxious feelings by avoiding being alone. When\
    \ she checks to make sure `Roberto` is still alive and hasn’t left her, Maria\
    \ is avoiding what it feels like to `not know`. That, for Maria, is a very scary\
    \ feeling. When `Roberto` is not with her, Maria begins to feel like a baby whose\
    \ parent has left the room.\n\nOf course, `Roberto` is still alive. And he hasn’t\
    \ been driven so crazy by her constant checking up on him that he has broken up\
    \ with her, so sooner or later he does return to her. And guess who gets the credit\
    \ for that?\n\n*   **Monkey thought:** `Roberto has not responded to your text.\
    \ Maybe he wants to break up with you!` \n*   **Avoidant behavior:** Text or call\
    \ `Roberto` to check on him. Ask him if he wants to break up with you.\n*   **Monkey\
    \ logic:** `Because you checked up on him, Roberto is staying with you.`\n*  \
    \ **Monkey thought:** `Roberto is flying to visit his grandparents in Arizona.\
    \ He may die on the plane and you will never see him again!`\n*   **Avoidant behavior:**\
    \ Try to convince him not to go, or to drive instead of fly, or to let you go\
    \ with him.\n*   **Monkey logic:** `Because he drove instead of flying, or because\
    \ you were with him, he didn’t die.`\n*   **Monkey thought:** `If you are alone\
    \ you will feel panicky, and you can’t stand that feeling!`\n*   **Avoidant behavior:**\
    \ Talk with friends on `Facebook` or by text. Get someone to hang out with you.\n\
    *   **Monkey logic:** `Because you were connected with other people, you did not\
    \ panic or completely lose control.`\n\nMaria doesn’t like her monkey’s chatter\
    \ and would like it to quiet down, but the only way she knows to shut her monkey\
    \ up is to follow its instructions: `Avoid being alone. Phone or text Roberto\
    \ now!`. While this relieves her anxiety and quiets her monkey for a little while,\
    \ in the long run it makes her monkey louder and her separation anxiety worse.\n\
    \nEvery time Maria avoids her aloneness by texting or phoning `Roberto`, and then\
    \ `Roberto` returns to her, Maria’s monkey gets a banana. Why? She is rewarding\
    \ her monkey’s logic that avoiding being alone is what saved her. The scary chatter\
    \ gets louder and it seems more urgent, and Maria’s world gets smaller and smaller.\n\
    \nWhat are you avoiding to keep your monkey mind quiet? Here are some common avoidant\
    \ behaviors of teens with separation anxiety:\n\n*   Avoiding going far away from\
    \ home or the person you are attached to. This may mean avoiding trips with family\
    \ or friends, or avoiding overnight school field trips.\n*   Doing things with\
    \ the person you are attached to, not because you want to do those things but\
    \ because you are avoiding being apart.\n*   Avoiding ever being alone. You may\
    \ plan your days according to what will keep you around people, as opposed to\
    \ how you really want to spend time.\n*   Avoiding doing things with friends,\
    \ because you are so worried when you are away from the person you are attached\
    \ to.\n\n## Tools to Tame the Separation Anxiety Monkey\n\nIf you have separation\
    \ anxiety, chances are that the anxious thoughts driving your behavior are unconscious.\
    \ You have been acting on them so long that they are automatic. You don’t question\
    \ them or look at their origin. As long as these thoughts remain in the dark,\
    \ you will keep acting on them. The first step to reducing anxiety’s hold on you\
    \ is to use your taming tools to shine some light on these anxious thoughts.\n\
    \n### Spot the Thought\n\nThink of a recent situation that made you anxious. Ask\
    \ yourself these two questions:\n\n1.  `What am I afraid of?`\n2.  `What is the\
    \ worst thing that could happen if this were true?`\n\nThese are the thoughts\
    \ that drove your behavior in that situation. Understand that monkey thoughts\
    \ may be very scary and believable to you, but they are not realistic assessments\
    \ of risk. In fact, that’s how you will recognize them—by their miscalculations!\
    \ Monkeys can’t calculate the actual odds of something happening. A monkey thought\
    \ is at best a wild guess, always slanted toward perceiving danger and keeping\
    \ you safe.\n\nYou can download a Spot the Thought worksheet at `http://www.newharbinger.com/32431`.\n\
    \n### Monkey Miscalculations\n\nBesides the over/underestimating mistake, the\
    \ two most common monkey miscalculations that occur with separation anxiety are\
    \ catastrophizing and intolerance of uncertainty. Here’s what they look like.\n\
    \n#### Catastrophizing\n\nTo the monkey mind, goodbyes are forever. A loved one\
    \ who leaves may never return. And being alone is the worst thing in the world—causing\
    \ panic and loss of control.\n\nOf course, being alone for a while is not a catastrophe.\
    \ You’ve survived without this person in the past. And even if the worst happened,\
    \ and you did not ever see the person again, you would learn to live without that\
    \ person. But when your monkey has you convinced you are in a catastrophic emergency\
    \ situation, you forget all that.\n\nHere are some examples of this monkey miscalculation:\n\
    \n*   `If the person is far away, she is much more likely to die.` \n*   `If you\
    \ have not heard from her in the past few minutes or hours, she may be hurt or\
    \ dead.`\n*   `If she is late meeting you, she may be dead or injured.`\n*   `If\
    \ she is around other people, she may fall out of love with you and in love with\
    \ someone else.`\n*   `If you hear a siren, it might be for her.`\n\nIf you suspect\
    \ your monkey is catastrophizing, ask yourself, `What is a more likely explanation?`\n\
    \n#### Intolerance of Uncertainty\n\nThe monkey mind cannot stand not knowing\
    \ what the outcome will be in any situation. It must be absolutely 100 percent\
    \ certain that you will be safe and everything will be okay. The truth is that\
    \ we can never know that everything will be okay. When you take this monkey miscalculation\
    \ seriously, you are attempting to achieve the impossible.\n\nAsk yourself, `What\
    \ cost am I paying by trying to eliminate all risk from my relationship?`\n\n\
    ### Alternative Thoughts\n\nWith all anxiety problems, the monkey mind is doing\
    \ all of the thinking, and with all of its miscalculations it is obvious that\
    \ thinking is not what the monkey mind is good at. Your monkey’s great skill is\
    \ looking for and reacting to threats that could hurt you. If you have separation\
    \ anxiety your monkey mind is hyperactive, jumping up and down, yelling one “what\
    \ if” after the other: `What if this happens?! What if that?!`\n\nIn order to\
    \ stop the avoidance cycle that keeps your separation anxiety going, you’ll need\
    \ to begin asking What else? What else is more likely to be true? You can see\
    \ alternatives that your monkey cannot.\n\nHere are of the alternative thoughts\
    \ Maria came up with:\n\n![Image](Images/10-3.jpg)\n\n*   **Situation:** `Roberto`\
    \ said he would call me at nine. When he didn’t call, I texted him but he didn’t\
    \ respond.\n*   **Monkey “what if?” thought:** `What if he met someone else and\
    \ he’s breaking up with me?`\n"
  raw: 'At around nine months of age, a child may cry or scream if her caretaker leaves
    the room or if a stranger tries to pick her up. This dependence on the caregiver
    is adaptive. It keeps the toddler from going too far away from the parent she
    depends on to feed her and keep her safe. By the age of two, when children are
    walking and ready for more independence, they understand that the parent will
    return.


    ![Image](Images/10-2.jpg)


    So what about Maria’s dependence on her boyfriend? You and I, and even Maria,
    can see that her anxiety is not rooted in reality. Maria is not dependent on Roberto
    for food and care. Maria’s monkey mind is making miscalculations that are triggering
    her to act in a way that is not in her best interest. Instead of growing closer
    to the boy she loves, she’s pushing him away.


    Maria’s monkey is sounding a full-scale alarm in a situation that is not actually
    dangerous. It is making the classic mistake it makes in all types of anxiety:
    over/underestimating. It is overestimating the chance that Roberto’s goodbye is
    forever—that she will never see him again—and it is underestimating her ability
    to be alone.


    Maria’s monkey mind has convinced her that she must act on her anxious feelings
    by avoiding being alone. When she checks to make sure Roberto is still alive and
    hasn’t left her, Maria is avoiding what it feels like to *not know*. That, for
    Maria, is a very scary feeling. When Roberto is not with her, Maria begins to
    feel like a baby whose parent has left the room.


    Of course, Roberto is still alive. And he hasn’t been driven so crazy by her constant
    checking up on him that he has broken up with her, so sooner or later he does
    return to her. And guess who gets the credit for that?


    *   **Monkey thought:** *Roberto has not responded to your text. Maybe he wants
    to break up with you!*


    *   **Avoidant behavior:** Text or call Roberto to check on him. Ask him if he
    wants to break up with you.


    *   **Monkey logic:** *Because you checked up on him, Roberto is staying with
    you.*


    *   **Monkey thought:** *Roberto is flying to visit his grandparents in Arizona.
    He may die on the plane and you will never see him again!*


    *   **Avoidant behavior:** Try to convince him not to go, or to drive instead
    of fly, or to let you go with him.


    *   **Monkey logic:** *Because he drove instead of flying, or because you were
    with him, he didn’t die.*


    *   **Monkey thought:** *If you are alone you will feel panicky, and you can’t
    stand that feeling!*


    *   **Avoidant behavior:** Talk with friends on Facebook or by text. Get someone
    to hang out with you.


    *   **Monkey logic:** *Because you were connected with other people, you did not
    panic or completely lose control.*


    Maria doesn’t like her monkey’s chatter and would like it to quiet down, but the
    only way she knows to shut her monkey up is to follow its instructions: *Avoid
    being alone. Phone or text Roberto now!* While this relieves her anxiety and quiets
    her monkey for a little while, in the long run it makes her monkey louder and
    her separation anxiety worse.


    Every time Maria avoids her aloneness by texting or phoning Roberto, and then
    Roberto returns to her, Maria’s monkey gets a banana. Why? She is rewarding her
    monkey’s logic that avoiding being alone is what saved her. The scary chatter
    gets louder and it seems more urgent, and Maria’s world gets smaller and smaller.


    What are you avoiding to keep your monkey mind quiet? Here are some common avoidant
    behaviors of teens with separation anxiety.


    *   Avoiding going far away from home or the person you are attached to. This
    may mean avoiding trips with family or friends, or avoiding overnight school field
    trips.


    *   Doing things with the person you are attached to, not because you want to
    do those things but because you are avoiding being apart.


    *   Avoiding ever being alone. You may plan your days according to what will keep
    you around people, as opposed to how you really want to spend time.


    *   Avoiding doing things with friends, because you are so worried when you are
    away from the person you are attached to.


    ## Tools to Tame the Separation Anxiety Monkey


    If you have separation anxiety, chances are that the anxious thoughts driving
    your behavior are unconscious. You have been acting on them so long that they
    are automatic. You don’t question them or look at their origin. As long as these
    thoughts remain in the dark, you will keep acting on them. The first step to reducing
    anxiety’s hold on you is to use your taming tools to shine some light on these
    anxious thoughts.


    Spot the Thought


    Think of a recent situation that made you anxious. Ask yourself these two questions:


    1.  *What am I afraid of?*


    2.  *What is the worst thing that could happen if this were true?*


    These are the thoughts that drove your behavior in that situation. Understand
    that monkey thoughts may be very scary and believable to you, but they are not
    realistic assessments of risk. In fact, that’s how you will recognize them—by
    their miscalculations! Monkeys can’t calculate the actual odds of something happening.
    A monkey thought is at best a wild guess, always slanted toward perceiving danger
    and keeping you safe.


    You can download a Spot the Thought worksheet at http://www.newharbinger.com/32431.


    Monkey Miscalculations


    Besides the over/underestimating mistake, the two most common monkey miscalculations
    that occur with separation anxiety are catastrophizing and intolerance of uncertainty.
    Here’s what they look like.


    Catastrophizing


    To the monkey mind, goodbyes are forever. A loved one who leaves may never return.
    And being alone is the worst thing in the world—causing panic and loss of control.


    Of course, being alone for a while is not a catastrophe. You’ve survived without
    this person in the past. And even if the worst happened, and you did not ever
    see the person again, you would learn to live without that person. But when your
    monkey has you convinced you are in a catastrophic emergency situation, you forget
    all that.


    Here are some examples of this monkey miscalculation:


    *   *If the person is far away, she is much more likely to die.*


    *   *If you have not heard from her in the past few minutes or hours, she may
    be hurt or dead.*


    *   *If she is late meeting you, she may be dead or injured.*


    *   *If she is around other people, she may fall out of love with you and in love
    with someone else.*


    *   *If you hear a siren, it might be for her.*


    If you suspect your monkey is catastrophizing, ask yourself, *What is a more likely
    explanation?*


    Intolerance of Uncertainty


    The monkey mind cannot stand not knowing what the outcome will be in any situation.
    It must be absolutely 100 percent certain that you will be safe and everything
    will be okay. The truth is that we can never know that everything will be okay.
    When you take this monkey miscalculation seriously, you are attempting to achieve
    the impossible.


    Ask yourself, *What cost am I paying by trying to eliminate all risk from my relationship?*


    Alternative Thoughts


    With all anxiety problems, the monkey mind is doing all of the thinking, and with
    all of its miscalculations it is obvious that thinking is not what the monkey
    mind is good at. Your monkey’s great skill is looking for and reacting to threats
    that could hurt you. If you have separation anxiety your monkey mind is hyperactive,
    jumping up and down, yelling one “what if” after the other: *What if this happens?!
    What if that?!*


    In order to stop the avoidance cycle that keeps your separation anxiety going,
    you’ll need to begin asking *What else? What else is more likely to be true?*
    You can see alternatives that your monkey cannot.


    Here are some of the alternative thoughts Maria came up with:


    ![Image](Images/10-3.jpg)


    *   **Situation:** Roberto said he would call me at nine. When he didn’t call,
    I texted him but he didn’t respond.


    *   **Monkey “what if?” thought:** *What if he met someone else and he’s breaking
    up with me?*'
