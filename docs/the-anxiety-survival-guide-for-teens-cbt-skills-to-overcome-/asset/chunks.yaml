    - **Monkey miscalculation:** Catastrophizing

    - **Alternative thought:** *It is more likely that he is not responding to my
    texts because they annoy him, not because he is breaking up with me.*

    - **Situation:** Roberto is flying to Arizona.

    - **Monkey “what if?” thought:** *What if the plane crashes and he dies?*

    - **Monkey miscalculation:** Intolerance of uncertainty

    - **Alternative thought:** *I can take this chance. I don’t need to go with him
    or ask him not to go just because I am afraid.*


    Once Maria came up with some alternative thoughts, her feelings did not go away
    but they weren’t quite as overwhelming. Having alternative thoughts helped her
    gain some distance from her monkey mind, and this is a very important first step.
    Take the time right now to come up with some alternative thoughts to your own
    monkey chatter. Changing your thinking is the best way to prepare yourself for
    what comes next: changing your behavior. Download an Alternative Thoughts worksheet
    at `http://www.newharbinger.com/32431`.


    ## Tools to Rule the Separation Anxiety Monkey


    Are you ready to stop following your monkey’s rules and start following your own?
    It’s easier to say than to do. You will need to give up the avoidant behaviors
    you’ve been using to keep from facing the separation you fear. This is going to
    make you feel a lot more anxious in the short run. Ruling your monkey takes tremendous
    courage and commitment. Is it worth it to you?


    ### Life Compass


    To answer this question, try another paper and pencil exercise. Write down the
    behaviors your monkey has gotten you to do in order to manage your separation
    anxiety. Are these behaviors working for you?


    Next, write down all the things that you would like to be able to do. Are any
    of these things worth fighting for?


    Here is what Maria came up with:


    Writing these things down was like holding a life compass. It told Maria which
    direction she needed to go, her true north. She’d been going south with her monkey
    long enough. In her heart she felt she had the courage to follow her life compass
    instead.


    Do you have goals that are important enough to fight for? If you do, keep reading.
    Facing your fears and changing your behaviors are extremely powerful ways to get
    your life back. But like most things worth fighting for, it is hard work.


    You can download a Life Compass worksheet at `http://www.newharbinger.com/32431`.


    ### Worst-Case Scenario


    Roll up your sleeves and ready yourself for the first piece of hard work: imagining
    the worst. That’s right, your task is to close your eyes and imagine the very
    worst thing that could happen in regard to the person or people you are attached
    to.


    You may be thinking, *That certainly is not going to help! I imagine the worst
    all the time. That’s why I keep texting him or calling her, to make certain the
    worst has not happened!*


    ![Image](Images/10-4.jpg)


    The thing is, every time you act on an anxious monkey thought by making certain
    the worst has not happened, your monkey wins. You are, in effect, saying that
    the thought is important, and something must be done. You are agreeing with your
    monkey’s catastrophizing. You are saying you cannot tolerate uncertainty. You’re
    saying, *You’re absolutely right, monkey!* and giving it a banana.


    To stop the avoidance cycle you need to imagine the worst—your boyfriend is injured
    or dead, your girlfriend hates you, whatever sounds the most terrible to you—and
    accept it. Don’t act on it. Don’t check. Simply be alone with an idea that terrifies
    you.


    In this exercise you won’t be following your monkey’s script. You will be the
    director, not your monkey. You are going to write out an imaginary scenario of
    what you are most afraid of, a real horror movie. You’ll want lots of gory details
    in this script because the whole point is to get as anxious as possible. To make
    it sound real, write it in the present tense. For example, you could begin with,
    *I am waiting for my mother to pick me up at school and I hear a siren in the
    distance…*


    Of course this is just the beginning. Ask yourself what is the worst it could
    mean if your mother is late picking you up. This helps you get to the core fear—for
    example, that she has forgotten you and you will be standing in front of your
    school until nighttime, or that she has gotten in a car accident and is in the
    hospital or is dead. That’s the sort of worst-case scenario you need.


    Here is what Maria’s scenario looked like:


    *Roberto has not responded to my texts! My heart is beating fast and my hands
    are feeling sweaty. I can feel that something is not right. I text him that I
    am really worried and to please let me know he is okay, but he still doesn’t text
    me back. Each minute that goes by feels like an hour. He is not responding! I
    know he was riding with friends and they were driving too fast and they were in
    a car accident. He’s lying in the street right now, bleeding and broken with nobody
    there to help. His cell phone is lying right next to him with all my texts, but
    he is in too much pain to pick it up. Tears are coming to my eyes thinking about
    this. He’s going to die and there is nothing that I can do. I’ll never see him
    again! My life will be ruined! I will never, ever get over this loss!*


    Maria did a great job, didn’t she? Many people have difficulty thinking about
    disastrous situations, especially when they involve harm to loved ones. The whole
    reason you’ve been seeking reassurance from your loved ones is to avoid thinking
    those kinds of thoughts.


    Be assured that imagining terrible scenes for the purpose of confronting your
    fears is in no way the same thing as wanting it to happen. We are taught that
    imagining things—in the form of positive affirmations and prayer, for example—can
    make them come true. But there is no way that picturing things you feel could
    happen—whether you want them to or not—can make them come true.


    What you are going to do with your own worst-case scenario is write it out—perhaps
    with the worksheet available at `http://www.newharbinger.com/32431`and read it
    to yourself, over and over. You can even record it on your cell phone or computer
    so you can play it to yourself too. You are going to treat this scenario as if
    were medicine you had to take regularly to stay alive. Carve out twenty minutes
    a day, every day, to read it or listen to it over and over.


    It is important that you do this with the right attitude. You are to accept whatever
    feelings come up in and welcome them with your breath. (Reread the section on
    the “welcoming breath” in chapter 5.)


    The idea is to focus your attention on breathing into wherever the sensation is
    the strongest. If your stomach is clenching, your shoulders are tense, or your
    hands are shaking or sweating, imagine that as you inhale, you are breathing into
    that part of your body, making room for the anxious sensations.


    The point is not to relax while you do this—quite the opposite. You are allowing
    yourself to feel the anxiety, and you are surrendering to it. By welcoming the
    feelings, you are teaching your mind and body that these monkey thoughts are something
    that you are willing to face, and by doing this you will be taking back control.
    You are no longer playing by your monkey’s rules. You are playing by your own.


    In a horror movie, when you come to the part where the bad guy is about to kill
    bunch of unsuspecting teens in a cabin, you may feel really, really scared, to
    the point that you want to scream. But you don’t get up and call 911, because
    you know it is a movie—it is not really happening. If you were to keep watching
    that horrible part of the movie over and over again, by the fiftieth viewing (or
    probably much sooner) you would not feel scared at all.


