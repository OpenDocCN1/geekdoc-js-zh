    \ I know my backpack has been on hundreds of different surfaces at school and\
    \ in other places that are dirty and covered with germs. Now I have these dirty\
    \ germs on my hands. My heart is already beating faster and I really want to wash\
    \ my hands, but I don’t. Instead I walk into my house and I begin touching things.\
    \ I touch the door handle, the fridge handle, the countertops, and the dining\
    \ room.\n```\n*(Actually, I will provide the full block as per the input text)*\n\
    ```\nBecause I have decided to face my OCD, I touch my backpack. I know my backpack\
    \ has been on hundreds of different surfaces at school and in other places that\
    \ are dirty and covered with germs. Now I have these dirty germs on my hands.\
    \ My heart is already beating faster and I really want to wash my hands, but I\
    \ don’t. Instead I walk into my house and I begin touching things. I touch the\
    \ door handle, the fridge handle, the countertops, and the dining room table.\
    \ Now my heart is really beating and I feel hot and sweaty. Then I know my grandmother\
    \ will come into contact with surfaces. She will put her hands to her eyes. I\
    \ see this and I want to yell, “Stop! Don’t touch your eyes!” But I don’t. The\
    \ next morning my grandmother comes to breakfast and she is coughing. This might\
    \ be because I spread germs to her. By the end of the day she is really sick and\
    \ has a fever, so my parents take her to the doctor. They end up hospitalizing\
    \ her because she is so sick. I can’t bring myself to visit her because this is\
    \ probably all my fault. My grandmother has died. \n```\n\nOnce you have written\
    \ your core fear scenario, set aside at least a half hour (the longer the better)\
    \ to read it to yourself repeatedly. You can also record the scenario on your\
    \ phone or computer and play it back to yourself. After the first time you read\
    \ or listen to it, write down how anxious it makes you using a number from 1 to\
    \ 10, with 10 being the most anxious. Then keep reading or listening until your\
    \ anxiety comes down by 50 percent, or your time is up for that day. This is a\
    \ terrific preparation for the other half of welcoming your obsessions: not doing\
    \ the compulsions that come along with them!\n\n### Challenge Ladder\n\n![Image](Images/11-7.jpg)\n\
    \nYou’ll be happy to know that I’m not going to ask you to confront every obsession\
    \ and compulsion you have at once. Just as Justin did in chapter 4, it is best\
    \ to make a ladder, welcoming one OCD situation at a time, beginning with the\
    \ least scary. By way of example, let’s look at how Shaneesha faced her fears,\
    \ one rung at a time.\n\n*At the top of her ladder, Shaneesha put the thing in\
    \ her life she was missing out on most due to her OCD: being around her grandmother.\
    \ She’d been protecting her grandmother from germs by compulsive washing, so she\
    \ decided that the first rung on her ladder would be to touch her backpack and\
    \ not wash her hands or use hand sanitizer. She would then touch surfaces in her\
    \ home—doorknobs, tables, chairs, dishes, and pillows—that her monkey mind had\
    \ previously designated as clean, and safe for grandmother to come into contact\
    \ with.*\n"
  raw: 'As you know, you cannot grit your teeth and will your anxious thoughts to
    go away. The harder you’ve tried, the more persistent they’ve become. That’s because
    their power is fueled by your resistance to them. The more you resist them, the
    more convinced the monkey mind becomes that they are dangerous, and the more it
    will trigger alarms when you think them. Are you ready to try acceptance instead?


    ![Image](Images/11-4.jpg)


    By accepting and welcoming obsessive thoughts, you prove to yourself that a thought
    is just a thought, no matter how horrifying it is. Accepting the obsessive thought
    means not performing compulsions to make it go away.


    And what about the anxiety this will cause? Accept that too. Feel it. All the
    way to the end.


    That’s right, *to the end*. There is a beginning, a middle, and an end to every
    emotion, including anxiety. You’ve just never gotten past the beginning stage,
    in which you are doing everything you can to quash it.


    Does that sound scary? It is. It is also incredibly powerful. Triggering your
    obsessive thoughts on purpose, and feeling the anxiety that comes when you don’t
    act on your compulsion, is the most effective long-term treatment for OCD there
    is. It takes your monkey out of the process completely and puts you in charge.
    And if you don’t rule your OCD monkey, it will continue to rule you!


    Life Compass


    Whenever your fight-or-flight response has been activated by obsessive thoughts,
    you’ve always taken flight. It’s never worked very well, but it always seemed
    better than the alternative. This is the time to ask yourself what you are willing
    to fight for. What part of your life do you want back badly enough to face your
    worst fears?


    It can be helpful to write down what OCD has taken away from you and how important
    these things are for you. Here is what Shaneesha came up with:


    ![Image](Images/11-5.jpg)


    To help you identify what you have been avoiding because of your OCD, download
    the Life Compass worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    For Shaneesha it was no contest. Her compass pointed directly to her grandmother,
    whom she loved deeply. The idea that she could enjoy her grandmother’s company
    without obsessing about germs and getting her sick sounded so sweet and so scary
    at the same time. In her heart, Shaneesha knew that if there were anything that
    could give her the courage she needed to try to beat her OCD, it would be her
    grandmother.


    If you’ve used your compass and you know what your direction is, you know that
    what you’ve been doing in the past won’t get you there. Avoiding obsessive thoughts
    doesn’t work. They still pop up, and when they do pop up, avoiding the anxiety
    they bring by doing compulsions doesn’t work for very long either.


    Obsessive thoughts are only as powerful as you make them by resisting them. Are
    you ready to accept and welcome them instead?


    Core Fear Scenario


    On the surface, OCD obsessions can look deceptively silly, even to those suffering
    from them. But if you dig around a bit you’ll find that underneath them lie deeper
    core fears. Unless you understand the core fear you’ll never quite get over the
    scary thoughts on the surface. To help you uncover your core fear, here are three
    good questions to ask:


    1.  *What am I afraid will happen if I don’t avoid my trigger and don’t do any
    compulsions?*


    2.  *What is the worst thing that could happen?*


    3.  *What would this mean about me, my life, or my future?*


    By way of example, here are Shaneesha’s responses to them.


    ![Image](Images/11-6.jpg)


    Once you have identified your core fear, grab a pen and paper because here you
    get a chance to get creative. You are going to write your *core fear scenario*.
    It’s a description, written like a movie scene, that depicts in vivid detail what
    it would look like if your core fear came true. It should be as scary as possible—like
    a horror movie designed to make you, the audience, cringe. Download the Core Fear
    Scenario worksheet at [http://www.newharbinger.com/32431](http://www.newharbinger.com/32431).


    You may balk at this at first. Most people with OCD have a very hard time exposing
    themselves to their obsessions, especially those that involve harm to loved ones—in
    Shaneesha’s case, the idea of her grandmother dying. We have been taught that
    our thoughts are powerful and can influence outcomes. This is absolutely not the
    case with OCD.


    Your obsessions are the result of a disorder, and you must treat them as such.
    Remember, the point of exposing yourself to your obsessions is so that these thoughts
    will lose some of their power. It is the same as if you decided to watch a horror
    movie over and over again. At first it would be really scary, but after the fiftieth
    time it would start to get boring. You need to learn to stop treating your thoughts
    as dangerous and avoiding them, because that will only fuel the disorder.


    Here is Shaneesha’s core fear scenario:


    *Because I have decided to face my OCD, I touch my backpack. I know my backpack
    has been on hundreds of different surfaces at school and in other places that
    are dirty and covered with germs. Now I have these dirty germs on my hands. My
    heart is already beating faster and I really want to wash my hands, but I don’t.
    Instead I walk into my house and I begin touching things. I touch the door handle,
    the fridge handle, the countertops, and the dining room table. Now my heart is
    really beating and I feel hot and sweaty. I know my grandmother will come into
    contact with these surfaces. Then she will put her hands to her eyes, and the
    germs that I brought into the house will be in her body. I see her do this and
    I want to yell, “Stop! Don’t touch your eyes!” But I don’t. The next morning my
    grandmother comes to breakfast and she is coughing. This might be because I spread
    germs to her. By the end of the day she is really sick and has a fever, so my
    parents take her to the doctor. They end up hospitalizing her because she is so
    sick. I can’t bring myself to visit her because this is probably all my fault.
    The next day my mother comes back and she is crying. She tells me that my grandmother
    has died. My heart sinks in my chest. I feel shame and sadness. My grandmother
    has died and it was my fault! My life will never be the same. I will never get
    over this!*


    Once you have written your core fear scenario, set aside at least a half hour
    (the longer the better) to read it to yourself repeatedly. You can also record
    the scenario on your phone or computer and play it back to yourself. After the
    first time you read or listen to it, write down how anxious it makes you feel
    using a number from 1 to 10, with 10 being the most anxious. Then keep reading
    or listening until either your anxiety comes down by 50 percent, or your time
    is up for that day.


    Do this again the next day and every day thereafter, until the core fear scenario
    rates a one. This is a terrific preparation for the other half of welcoming your
    obsessions: not doing the compulsions that come along with them!


    The Challenge Ladder


    ![Image](Images/11-7.jpg)


    You’ll be happy to know that I’m not going to ask you to confront every obsession
    and compulsion you have at once. Just as Justin did in chapter 4, it is best to
    make a ladder, welcoming one OCD situation at a time, beginning with the least
    scary. By way of example, let’s look at how Shaneesha faced her fears, one rung
    at a time.


    *At the top of her ladder, Shaneesha put the thing in her life she was missing
    out on the most due to her OCD: being around her grandmother. She’d been protecting
    her grandmother from germs by compulsive washing, so she decided that the first
    rung on her ladder would be to touch her backpack and* not *wash her hands or
    use hand sanitizer. She would then touch surfaces in her home—doorknobs, tables,
    chairs, dishes, and pillows—that her monkey mind had previously designated as
    clean, and safe for grandmother to come into contact with.*'
