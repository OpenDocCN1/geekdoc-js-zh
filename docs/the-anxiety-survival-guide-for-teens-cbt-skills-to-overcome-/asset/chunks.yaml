    The following day the most anxious hunter, embarrassed because he had run away
    the previous day, joined a hunting party, determined to make good of himself.
    But every rustling of a leaf sounded like a tiger; every footprint on the ground
    looked like a tiger track. Just thinking about the tiger made the hunter’s heart
    beat fast and his stomach turn, almost as if a tiger was right there in front
    of him. He slowed down the hunting party so much that he was left behind. In the
    tales of the hunt by the fire that night his name wasn’t mentioned.


    Feeling more anxiety than a situation calls for is certainly not adaptive. It
    stops you from doing what you want and need to do—which, in our anxious hunter’s
    case, was bringing home meat for his family and tribe.


    The anxious hunter’s problem, and yours, is that fight-or-flight responses feel
    real whether there is real danger or not. If your brain reacts to a situation
    as dangerous—even if it’s not—your nervous system will act accordingly, making
    your heart beat like a drum, your skin break out in sweat, your fingers tingle,
    your stomach nauseous, your throat constricted, and your head spin. The system
    is sounding false alarms, like a smoke detector that goes off every time you make
    a piece of toast.


    Regardless of what else you are doing, this system keeps humming away in the background.
    If you are genetically—or for whatever reason—extra sensitive to threats, you
    are likely getting lots of alerts warning you about bad things about to happen.
    I like to think of this part of the brain as the `monkey mind`. Its relentless
    stream of scary thoughts is like a frightened monkey’s chatter.


    ![Image](Images/1-3.jpg)


    The story of the three hunters illustrates an important point about anxiety: it
    is not the situation that triggers how we feel and what we do, but rather `what
    we think` about the situation. When a wildly threat–sensitive monkey with a loud
    alarm is doing the thinking, its scary chatter keeps setting off false alarms,
    filling you with anxiety that stops you from going where you want to go and being
    who you want to be.


    This book will show you how to stop your monkey mind from ruling your life—how
    to make choices that are not dictated by fear. You will learn to identify monkey
    chatter, ignore false alarms, and take back control of your life. After all, there
    is more to living than just staying alive. You can live the life you want to live!


    ![Image](Images/2-1.jpg)


    ## Chapter 2


    # Monkey Logic


    ### Understanding the Avoidance Cycle


    Justin was a fifteen-year-old who loved skateboarding. He rode his skateboard
    to school and to his friends’ houses, and he spent as much time as he could at
    the skate park. One day he was on his way home from skating with his friends when
    an off-leash dog in a park began to chase him. Justin was listening to music on
    his headphones and he didn’t hear the dog approaching. When the dog caught up
    to him it knocked him off his skateboard. The dog’s owner quickly appeared and
    pulled the dog away, apologizing repeatedly. Justin wasn’t bitten, but he felt
    like he could have been. He told the dog’s owner he was okay, but he walked home
    bruised and shaken.


    The next day, Justin was skateboarding to school when he spotted a neighbor walking
    her large dog, coming directly toward him. He felt his heart begin to beat fast
    and was aware of feeling panic, similar to how he felt the day before. Justin
    stopped skating and picked up his board. He was only a block from home, so he
    decided to walk back and catch a ride to school from one of his parents. As soon
    as the front door shut and he was back in his house he felt much calmer.


    The situation that morning was the same one Justin had encountered many times
    before, skateboarding to school past a woman walking her dog. The dog had always
    been well-behaved in the past. What triggered his sudden fight-or-flight response?


    If you asked Justin, he might have answered, “I don’t know. The dog just made
    me nervous.” All Justin was aware of was feeling anxious at the sight of the dog
    and feeling calmer when he turned back. But whether he was aware of it or not,
    his monkey mind interpreted the situation that morning with a new twist.


    Because of his experience with the other dog the day before, and because Justin
    happens to have an oversensitive-to-threat nervous system, Justin’s monkey had
    a new thought about this dog on a leash, a thought that triggered a wave of anxiety:
    `What if that dog gets off its leash and attacks you?`


    If Justin had taken a few deep breaths, reminded himself that the dog was on a
    leash and that it had never been aggressive before, and kept on skating, that
    would probably have been the end of the story. But Justin’s anxiety hit him hard.
    It felt like a real threat. He did what all anxious teens do when they feel overwhelmed
    by anxious feelings in a situation: he avoided it.


    When the monkey mind’s interpretation of a situation is accepted as true, it always
    leads to avoidance.


    ![Image](Images/2-2.jpg)


    Justin’s decision to let his parents drive him to school may seem like an overreaction
    to us. After all, the dog was on a leash and not dangerous. But from Justin’s
    point of view it made perfect sense. His monkey mind’s interpretation of the dog
    as a threat triggered anxiety for him, and nobody wants to feel anxious. Avoidance
    is the behavior of choice for all the types of anxiety that we talk about in this
    book, even the ones that don’t appear to have anything to do with avoiding things.
    Avoidance is the behavior of choice because it lowers your anxiety quickly.


    The next day when Justin reached for his skateboard, he felt a little wave of
    anxiety. He wondered whether he might run into that dog again. So, just to be
    safe, he had his parents drive him to school again.


    Avoidance works so fast and so well, you’ll want to use it again. The problem
    is that with repeated use, avoidance has a nasty effect: `The more you avoid a
    situation, the scarier that situation becomes.`


    Avoiding dogs was keeping Justin calm, but it wasn’t reducing his anxiety about
    dogs. All he had to do was think about skateboarding and he felt anxious. Avoidance
    was making his anxiety worse and keeping him from doing he loved.


    The reason your anxiety gets worse is that your monkey mind always assumes that
    it was the action you just did prevented something from happening. When Justin’s
    monkey saw that he was in the house and that he was not bitten by the dog, it
    concluded that `Justin was not attacked by the dog because he went into the house`.


    You might be asking why the monkey mind would keep on with the same chatter, even
    when it is wrong. Doesn’t it ever question anything or take a second look at a
    situation before setting off your alarms? No. The monkey mind has only one mission:
    keeping you safe. And if you are an anxious person, you have a monkey that is
    hyperactive and hypersensitive to danger. It cannot tell the difference between
    imagined and realistic threats. Its anxious thoughts are not carefully considered;
    they are only wild guesses.


    When you avoid a situation because of anxiety, you are, in effect, agreeing with
    the monkey logic that the situation was dangerous. You are training your monkey
    mind to make the same interpretation next time, make the same chatter, and sound
    the alarm.


    ![Image](Images/2-3.jpg)


    You may not think what you are doing is avoiding anything. Is worrying, for example,
    avoiding? Yes! When you are thinking about a problem, running it over and over
    in your mind, you are looking for a solution that will enable you to `not feel
    anxious`. You are avoiding actually `feeling` the anxiety that problem brings
    up.


    Let’s look at how monkey logic and avoiding anxiety works with anxiety types other
    than Justin’s.


    *   **Monkey thought:** `What if you are late to class? Being late would be a
    disaster. You would get detention.`

