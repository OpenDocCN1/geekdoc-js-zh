- fmt: "\nHere are a couple of tools to help you face your anxiety and take control\
    \ of your life. Use either one, or both, to show that pesky monkey who’s boss.\n\
    \n## Life Compass\n\n![Image](Images/4-3.jpg)\n\nWhat are you missing out on because\
    \ of anxiety? Dating? Travel? Social events? Are you spending big chunks of time\
    \ worrying, rechecking things, or performing other rituals? Get out your life\
    \ compass and ask yourself which direction you want to go. With your monkey in\
    \ charge, you’ll always be headed south, toward safety. Try finding your true\
    \ north instead.\n\nA great way to help yourself find your own true north is to\
    \ write out all the things that you are missing out on by avoiding what makes\
    \ you anxious. Here’s what Justin came up with:\n\n![Image](Images/4-4.jpg)\n\n\
    Justin wrote down all the things he was missing out on because of his fear of\
    \ dogs. There was the rush he felt riding his skateboard, and the fun of hanging\
    \ out at the skate park with his friends. He also missed the physical exercise.\
    \ But there was one thing he missed that really stood out. Justin really hated\
    \ depending on his parents to drive him around. He wanted to feel free again,\
    \ able to go anywhere, anytime he chose. Giving up his independence was a deal-breaker\
    \ for Justin; he just couldn’t see himself continuing to live that way. Independence\
    \ was something he valued enough that he decided he would be willing to face some\
    \ discomfort to have it.\n\nGood decision. Meeting a challenge even though you\
    \ are afraid—and surviving the experience—is how you really gain distance from,\
    \ and power over, your monkey mind. Justin will prove to himself that his anxious\
    \ thoughts are indeed miscalculations, that his anxiety is based on a false alarm,\
    \ and that when faced with anxiety he can cope. He will feel the power of being\
    \ in control of his own destiny.\n\nHow about you? What do you want that your\
    \ anxiety is holding you back from? Grab a pencil and paper and make your own\
    \ list. Or use the Life Compass form at `http://www.newharbinger.com/32431`.\n\
    \nAllowing ourselves to feel the anxiety that comes with going after what we want\
    \ is a new idea for most of us. We’ve avoided feeling anxious so long that the\
    \ very idea of accepting anxiety seems crazy, and the idea of actually feeling\
    \ it sounds overwhelming. True, it won’t be easy. Like anything worth doing, it\
    \ will take practice. But like anything that’s difficult, you can do it in small\
    \ steps.\n\n## The Challenge Ladder\n\nPicture a ladder with the life you want\
    \ to live at the top. It will be your ladder and yours alone. It makes no difference\
    \ whether your goal is to leave home and go to college or simply to leave the\
    \ house without rechecking your backpack a half-dozen times. The point is to go\
    \ in your direction, not your monkey’s.\n\n![Image](Images/4-5.jpg)\n\nOn each\
    \ rung you will place a challenge for yourself, each one slightly bigger and scarier\
    \ than the one below it. As you meet each challenge you will become more powerful\
    \ and more skilled at accepting anxiety as just a feeling, rather than something\
    \ that should hold you back from going where you want to go. \n\nLet’s look at\
    \ how Justin constructed his challenge ladder. It was important that his first\
    \ rung be challenging enough to set off his monkey alarms, but not so challenging\
    \ that he wouldn’t be willing to do it.\n\nJustin had a friend who had a dog named\
    \ Charlie. Charlie was a small dog, and Justin guessed that if he were on a leash,\
    \ he could handle hanging out with him for five minutes. It sounded easy, but\
    \ Justin could tell from the anxiety he felt thinking about it that it would probably\
    \ be more difficult than it sounded. And anyway, the point was not to make a dramatic\
    \ leap but rather take a first step. Small challenges are what we learn from and\
    \ are just as important as the bigger challenges on the higher rungs, because\
    \ they prepare us for them.\n\nOnce Justin had that starting point, it wasn’t\
    \ too difficult to imagine slightly scarier challenges for the next rungs—like\
    \ petting Charlie, or taking him off his leash. As he added more anxiety-provoking\
    \ variables to each challenge, he found he was getting closer to his ultimate\
    \ goal—on paper, at least. When he was finished, his ladder looked like this:\n\
    \n![Image](Images/4-6.jpg)\n\nEach rung had a challenge that would cause him a\
    \ little more anxiety—and give him a little more independence—than the rung below\
    \ it. Completing each challenge would help Justin gain a little more distance\
    \ from his monkey’s chatter and a little more confidence in his own alternative\
    \ thought: `The possibility of a dog getting off its leash and attacking me is\
    \ very unlikely`.\n\nEvery anxiety type has its own kinds of challenges, so hold\
    \ off on making a ladder of your own until you’ve read the chapters that relate\
    \ most to you. (In chapter 6, for example, I will go into more detail about specific\
    \ phobias like Justin’s.) For now, let’s follow along with Justin as he takes\
    \ his first tentative step.\n\nIt will come as no surprise that Justin’s monkey\
    \ didn’t like the challenge ladder and was quite vocal about it. Are you crazy?\
    \ Woo-woo! Small dogs bite, too! As Justin approached his friend’s house he could\
    \ hear Charlie barking inside. `He’s probably barking at me`, Justin thought,\
    \ breaking into a cold sweat.\n\nWait a minute! It all looks great on paper, but\
    \ how will Justin actually meet the challenges? Are we forgetting that he’s absolutely\
    \ terrified of dogs?\n\n![Image](Images/5-1.jpg)\n\n## Chapter 5: Thank You, Monkey!\n\
    \n### How Acceptance Sets You Free\n\nHave you ever hiked up the side of a mountain?\
    \ On a steep trail you get tired quickly. It isn’t long before you are sweaty\
    \ and exhausted. The trail zigags, and at each sharp turn new terrain appears..\
    \ trees keep you from seeing what lies ahead, and you wonder whether you will\
    \ ever make it. Turning back is so tempting. Your fatigue gets worse and worse\
    \ until you can barely put one foot in front of the other, and then…\n\nYou reach\
    \ the top! And like the trail, your fatigue levels off. Your legs are shaky and\
    \ your body feels spent, but you also feel really good. You conquered the mountain.\n\
    \nAnxiety is like fatigue. As with choosing to climb a mountain, if you choose\
    \ to face your fear it gets worse before it gets better. But remember, you don’t\
    \ hike the mountain saying, `I shouldn’t be tired! Being tired is unacceptable!`\
    \ If you thought that, you would certainly turn around and head back to the bottom.\
    \ You know that feeling tired is normal when climbing a steep trail, so you accept\
    \ it. You know and trust that your fatigue will not kill you, and that if you\
    \ rest at each bend and catch your breath, you will find the strength to reach\
    \ your goal.\n\nLike fatigue, anxiety is much more tolerable if you accept it\
    \ as a normal part of life. Each rung of your challenge ladder is like a zigzag\
    \ on that trail up the mountain. As you look at the new terrain, your success\
    \ depends on your ability to welcome what it has to offer. On the trail, that\
    \ includes the exhaustion in your body. On your ladder, it includes the anxiety\
    \ you’ll feel. When that anxiety comes, you will welcome it. You’ll say, `Thank\
    \ you, monkey! Can I have some more?`\n\n![Image](Images/5-2.jpg)\n\n### The Welcoming\
    \ Breath\n\nDeciding to welcome anxiety won’t be enough. You’ll have to welcome\
    \ it with your whole body, in the places where you feel the anxiety. In the past,\
    \ when you’ve felt anxious you’ve breathed rapidly and shallowly, which is a fight-or-flight\
    \ response. When you are welcoming anxiety you do the opposite:\n\n1.  Breathe\
    \ in deeply, filling your lungs so that your belly expands.\n2.  Breathe out completely.\n\
    3.  Repeat slowly and deliberately.\n"
