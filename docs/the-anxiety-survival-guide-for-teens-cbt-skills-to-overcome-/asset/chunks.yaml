    ## Chapter 8


    # Specific Phobias


    Insects, Vomit, and Needles—Yikes!


    Back in fourth grade, when Anton was ten, one of his classmates threw up on the
    floor of the bus on a field trip. Ever since then Anton was petrified of getting
    the stomach flu. He avoided riding on the school bus except when going to and
    from school, which was only a short distance. He refused to ride the bus for field
    trips, so either his parents drove him or he wouldn’t go at all. If someone at
    school complained of feeling sick, Anton would begin to panic and would avoid
    that person as much as possible. He constantly checked his own body for signs
    of nausea, and whenever he felt hungry or too full he worried the discomfort might
    be a sign he was getting sick. Anton also worried about eating food that might
    make him sick, so he always checked expiration dates and wanted to know how long
    food had been sitting out before he ate it. He carried antacids with him to settle
    his stomach. Worst of all, Anton often had trouble going to sleep at night because
    he was worried he might wake up in the middle of the night vomiting.


    Anton has a specific phobia, which means that he has an extreme fear of a specific
    thing or situation. Justin, whom you met in chapter 2, had a specific phobia of
    dogs. Anton’s phobia is centered around vomit.


    Phobias are very common. In fact, most people have some type of phobia. Being
    frightened by things is part of being human. But when your phobia stops you from
    doing what you want to do or going where you want to go, it’s a real problem.


    This is what was happening for Anton. He couldn’t eat at certain restaurants that
    were popular with his friends for fear he might get sick from the food. He couldn’t
    go on long car trips because he was worried he might get carsick. He wouldn’t
    go near any of his friends if they or anyone in their family had been sick recently.
    His phobia was keeping him from living life the way he wanted to live it.


    Specific phobias can be about almost anything, but here are some of the most common
    types:


    *   Animals: dogs, cats, mice, rats, birds, snakes, insects

    *   Things that occur in the natural environment: heights, water, thunderstorms,
    or lightning

    *   Situations and places: traveling in a car, plane, bus, train, or boat; closed-in
    spaces such as closets and tunnels

    *   Medical issues: injuries, blood, needles, dentists, doctors, hospitals

    *   Illness and bodily functions: vomiting, stomach flu, food poisoning, choking
    on pills or food, having a dry or closed throat, not being able to breathe


    Like all anxiety, specific phobias are rooted in our fundamental need to survive.
    There are plenty of animals—even insects—that can kill you. People *do* drown,
    die from falling, and get struck by lightning. Accidents *do* happen to people
    traveling in cars and planes. If you were trapped in a tight space, you *could*
    die. Blood, injuries, needles, hospitals, vomiting, and choking are all associated
    with death. And staying alive, as we know, is the brain’s number one job.


    But although phobias originate from potential threats, they are unrealistic and
    exaggerated. For the anxious teen, the part of the brain that decides what is
    dangerous—what we call the monkey mind—is hyperactive and overly threat-sensitive.
    It makes a classic miscalculation. It 1) overestimates the threat and 2) underestimates
    your ability to deal with it. This assessment of the danger amounts to little
    more than a wild guess.


    So why is your monkey mind making wild guesses about your specific phobia? You
    can’t really know. The genetics you were born with and the behavior your parents
    or caretaker modeled for you may have had an influence. There also may have been
    a bad experience that triggered your phobia.


    Justin, from chapter 2, developed a fear of dogs after being attacked by one.
    If you saw or read about a terrible plane crash or someone getting struck by lightning,
    you may have developed a fear of the same happening to you. Or you may have been
    trained to be extra cautious about something. From an early age, even before he
    developed his fear of vomiting, Anton’s mother told him to breathe through his
    nose whenever he was around people who were sick.


    Regardless of how your phobia originated, the problem is the same. When you are
    confronted with your phobia your monkey mind sets off your anxiety alarm and you
    find yourself in fight-or-flight mode. You feel the threat is real, and you do
    whatever it takes to avoid it. Then, when nothing bad happens, your monkey takes
    credit for keeping you safe, reinforcing the wild guess it made about the danger
    in the first place, which starts the whole process again. This is the *cycle of
    avoidance* that keeps all anxiety going.

