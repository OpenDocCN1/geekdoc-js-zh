    in a single octave of a piano keyboard. Each file is named after the note it contains.
    Your HTML document will need to include these sounds using the <EMBED> tag.


    Normally, when you embed a sound, it plays as soon as the page loads. You don''t
    want all 13 notes to play at once (and that wouldn''t work anyway), so use the
    AUTOSTART=false parameter to prevent the sounds from playing.'
