- img_proc: true
  md: '# Basic Differences Between Browsers


    With the release of Internet Explorer 4.0, Microsoft added support for JavaScript
    1.1 and much of JavaScript 1.2. In most cases, scripts written to the JavaScript
    1.2 standard will work in both browsers. For the most part, IE4 does not support
    the new JavaScript 1.3 features.


    ![](img/de79f8d3157260923142f6327cdaf49c_267_0.png)


    > This hour focuses on the differences between the 4.0 versions of IE and Netscape
    Navigator. Earlier versions of the two have a greater number of differences, as
    do the upcoming (5.0) versions.


    The greatest differences between the browsers is in their object models. The document
    object model (DOM) is the hierarchy that organizes browser objects. The basics
    of the Netscape object model (most of which are also supported by IE4) are described
    in Hour 10, "Working with Browser Objects." The following sections describe some
    of the major differences between the Netscape and Microsoft object models.


    ![](img/de79f8d3157260923142f6327cdaf49c_267_1.png)


    > Netscape''s object model is described in Hour 10.


    # Windows and Documents


    The basic features of the window object are similar in both browsers. Here are
    a few of the differences:


    +   - IE includes a window.navigate method that loads a new URL. Netscape does
    not support this method, but you can assign the URL to the window.location object,
    which works in both browsers.

    - Netscape includes window.back and window.forward methods, which are similar
    to the browser''s Back and Forward buttons. These are not supported by IE. In
    most cases, you can use history.back and history.forward to achieve the same effect.

    - The classes, ids, and tags properties of the document object, introduced in
    Hour 18, are exclusive to Netscape. IE4 stores these items under the document.all
    array instead, as explained later in this hour.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Forms


    Form objects and the various form element objects are supported in nearly the
    same way

    on both browsers. The only possible incompatibility is with the method, target,
    and

    action properties of the form object. These cannot be changed in IE 3.0; IE 4.0
    corrects

    this problem.


    # Events


    The available event handlers for various objects also differ between IE4 and Netscape.

    Here are some of the major differences:


    +   - Netscape includes onclick and onDrag events for the window object. These
    are

    not supported by IE.


    +   - The event object, which stores information about an event that has occurred,

    supported by both browsers. However, its properties are completely different in

    different browsers.


    # Techniques for Cross-Browser Scripting


    Although it''s beyond the scope of this hour to provide a detailed list of all
    of the differ-

    ences between IE4 and Netscape 4.0, you will undoubtedly run into many differences
    if

    y test your scripts on both browsers.


    Why script for both? The answer is simple. Although you may be a fan of one browser
    or

    the other, each one has close to 50% of the browser market. This figure varies

    with each release, but could you be losing as much as half of your audience by

    scripting for only one browser.


    Once you know the differences between browsers that will affect your script, there
    are

    different ways of compensating for them. Several techniques for creating cross-browser

    scripts are described in the following sections.


    # Detecting Browser Versions


    First of all, your script will need to figure out which browser is being used.
    As you

    learned in Hour 16, “Creating Browser-Specific Scripts,” you can do this with
    the

    navigator object.


    Because your script will probably do several things that need to be done differently
    in

    different browsers, a good strategy is to detect the browser at the beginning
    of the script

    and set a variable that can be checked by later script commands.


    ![](img/de79f8d3157260923142f6327cdaf49c_268_0.png)'
  merge: -1
  pgno: 268
