  md: '# HOUR 2


    # Creating a Simple Script


    As you learned in Hour 1, "Understanding JavaScript," JavaScript is a scripting
    language for Web documents. You can include JavaScript commands directly in the
    HTML document, and the script is executed when the page is viewed in a browser.


    During this hour, you will create a simple script, edit it, and test it using
    a Web browser. Along the way you will learn the basic tasks involved in creating
    and using scripts. We will cover the following topics:


    +   * The software tools you will need to create and test scripts

    * Beginning and ending scripts

    * Formatting JavaScript statements

    * How a script can display a result

    * Including a script within a Web document

    * Testing a script using Netscape

    * Modifying a script'
