  md: '# Making a Multiple-Browser Page


    The third alternative is to make a single page that supports more than one type
    of browser. You can use a script in the page to detect the browser, and then use
    script commands to include different HTML codes in the document, depending on
    the browser.


    This method uses only one document, but you might find that it transforms a long,
    complicated page into a long, *impossibly* complicated page. A short example of
    a page that does this is included in the "Workshop: Scripting for Multiple Browsers"
    section of this hour.


    ![](img/de79f8d3157260923142f6327cdaf49c_233_0.png)


    > Some more sophisticated techniques for dealing with multiple browsers are presented
    in Hour 19, "Creating Cross-Browser Scripts."


    # Supporting Non-JavaScript Browsers


    What about browsers that don''t support JavaScript at all? You can''t detect them
    with a script because they won''t even *run* the script. However, there are ways
    of dealing with these browsers.


    99% of Web users using a recent copy of Netscape or IE, where are the non-JavaScript
    browsers? First, there are still older browsers out there, and text browsers such
    as Lynx dont support scripting. Second, and more importantly, many Netscape and
    IE have JavaScript support turned off, either due to security concerns or to avoid
    watching scrolling messages in the status line.


    In the last year or two, a wide variety of new browsers has emerged. Palmtop computers,
    such as 3Com''s PalmPilot and the Windows CE platform, support Web browsing, as
    do cellular phones and other appliances. Since none of these support JavaScript,
    it''s even more important to provide an alternative when needed.


    One way to be friendly to non-JavaScript browsers is to use the `<NOSCRIPT>` tag.
    Supported in Netscape 3.0 and later, this tag displays a message to non-JavaScript
    browsers. Browsers that support JavaScript ignore the text between the `<NOSCRIPT>`
    tags, while others display it. Here is a simple example:


    ```

    <NOSCRIPT>

    This page requires JavaScript. You can either download a copy of Netscape from
    <A HREF="http://www.netscape.com/"></a> their page, or switch to the <A HREF="nojs.html">Non-JavaScript</></a>
    version of this page.

    </NOSCRIPT>

    ```'
  merge: -1
  pgno: 233
- img_proc: true
  md: "The main problem with using <NOSCRIPT> is that Netscape 2.0 will display the\
    \ text between the tags, even though it does support JavaScript. There's a way\
    \ to solve this problem, it's a bit tricky. Listing 16.4 shows a script that can\
    \ detect non-JavaScript browsers and display a message.\n\n# Listing 16.4  DETECTING\
    \ NON-JAVASCRIPT BROWSERS.\n\n```\n<SCRIPT LANGUAGE='JavaScript'>\n  <!--hide\
    \ from old browsers\n  ...script commands go here...\n  /* (start JavaScript comment,\
    \ end HTML comment)\n  You're using a non-JavaScript browser! Shame on you.\n\
    \  <!-- // -->\n</SCRIPT>\n```\n\nThis uses HTML comment tags <!--! -- --> to\
    \ hide the script commands from old browsers. It uses JavaScript comment tags\
    \ (/* and */) to enclose the message for non-JavaScript browsers, so it will be\
    \ disregarded by browsers that support JavaScript.\n\nAn easier alternative is\
    \ to send users with JavaScript support to another page. This can be accomplished\
    \ with a single JavaScript statement:\n\n```\n<SCRIPT LANGUAGE=\"JavaScript\"\
    >\nnwindow.location=\"JavaScript.html\";\n</SCRIPT>\n```\n\nThis simply sends\
    \ the user to a different page. If the browser doesn't support JavaScript, of\
    \ course, the script won't be executed.\n\nThe final alternative is to make your\
    \ scripts unobtrusive. Use comments to hide them from other browsers, as described\
    \ in Hour 4, \"How JavaScript Programs Work,\" and be sure that they are not essential\
    \ to navigate or read the page.\n\n# Workshop: Scripting for Multiple Browsers\n\
    \nAs an example of the techniques you learned in this chapter, you can create\
    \ a script that works on multiple browsers. Suppose you have a MIDI music file\
    \ that you want to play in the background while users look at your page."
