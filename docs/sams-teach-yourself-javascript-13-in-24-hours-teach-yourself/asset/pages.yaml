- img_proc: true
  md: '# How JavaScript Programs Work


    Objects can also include methods. These are functions that work with the object''s
    data. For example, our person object for the address book might include a display()
    method to display the person''s information. In JavaScript terminology, the statement
    Bob.display() would display Bob''s details.


    Don''t worry this seems confusing—you''ll be exploring objects in much more detail
    later in this book. For now, you just need to know the basics. JavaScript supports
    three kinds of objects:


    +   - Built-in objects are built into the JavaScript language. You''ve already
    encountered two of these, Date and Math, in Hour 2. Other built-in objects include
    Array and String, which you''ll explore in Hour 6, "Using Strings and Arrays."


    +   - Browser objects are objects that represent various components of the browser
    and the current HTML document. For example, the alert() function you used earlier
    in this chapter is actually a method of the window object. You''ll explore these
    in more detail in Hour 10, "Working with Browser Objects."


    +   - Custom objects are objects you create yourself. For example, you could create
    a person object, as in the examples in this section. You''ll learn to use these
    in Hour 11, "Creating Custom Objects."


    # Handling Events


    As mentioned in Chapter 1, not all scripts are located within <SCRIPT> tags. You
    can also use scripts as event handlers. While this might sound like a complex
    programming term, it actually means what it says: Event handlers are scripts that
    handle events.


    In real life, event is something that happens to you. For example, the things
    you write on your calendar are events: "Dentist appointment" or "Fred''s Birthday."
    You also encounter unscheduled events in your life, such as a traffic ticket,
    an IRS audit, or an unexpected visit from relatives.


    Whether events are scheduled or unscheduled, you probably have normal ways of
    handling them. Event handlers might include things like When Fred''s birthday
    arrives, send him a present or When relatives visit unexpectedly, turn out the
    lights and pretend nobody''s home.


    Event handlers in JavaScript are similar: They tell the browser what to do when
    a certain event occurs. The events deal with aren''t as exciting as When the mouse
    button clicks and When this page is finished loading. Nevertheless, they''re a
    very useful part of JavaScript.


    ![](img/de79f8d3157260923142f6327cdaf49c_72_0.png)'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'Many JavaScript events (such as mouse clicks) are caused by the user. Rather
    than doing things in a set order, your script can respond to the user''s actions.
    Needless to say, this is essential for just about every practical use of JavaScript.


    Event handlers are associated with particular browser objects, and you specify
    the event handler in the tag that defines the object. For example, images and
    links have one, onMouseEnter, that happens when the mouse pointer moves over the
    object. Here is a typical HTML image with an event handler:


    ```

    <IMG SRC="button.gif" onmouseover="highlight()">

    ```


    You specify the event handler as an attribute to the HTML tag and include the
    JavaScript script to handle the event within the quotation marks. This is an ideal
    for functions, since function names are short and to the point and can refer to
    a whole series of statements.


    > You''ll learn more about event handlers in Hour 12, "Responding to Events."


    # Hiding Scripts from Older Browsers


    Many users are still using browsers that don''t support JavaScript. More importantly,
    many people have JavaScript support turned off in their browsers, either due to
    security concerns or to scrolling messages.


    > Most of the security concerns people have about JavaScript are unfounded; there
    is really no way to damage a user''s files with JavaScript, and scripts do not
    have access to the contents of hard drives by default. Some small security holes
    have been found in earlier versions of JavaScript, none that allows serious damage.


    To add to JavaScript''s capabilities, Netscape included features to access files
    on hard drives, change browser settings, signed scripts, and other functions in
    version 1.3; however, these functions require signed scripts, which must be authorized
    by the user before they can perform these functions.


    Since older browsers don''t understand the <SCRIPT> tag, they will not behave
    very well when they encounter a script in a Web page. In most cases, they will
    display the script in the middle of the page—probably not the effect you were
    looking for.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# How JavaScript Programs Work


    To avoid this, you can enclose the script within HTML comment tags. This tells
    older browsers to ignore the script completely. Newer browsers are smart enough
    to know that your script isn''t really a comment.


    HTML comments begin with the tag <!-- and end with the --> tag. Listing 4.6 shows
    a simple example of a script with comments.


    # LISTING 4.6 Hiding script FROM OLDER BROWSERS.


    ```

    1: <SCRIPT LANGUAGE="JavaScript">

    2: <!--

    3:   document.write("Your browser supports JavaScript.");

    4: // -->

    5: </SCRIPT>

    ```


    This script includes the beginning and ending HTML comment tags. The // in the
    last line is a JavaScript comment; this prevents the HTML comment from being detected
    as a JavaScript error.


    ![](img/de79f8d3157260923142f6327cdaf49c_74_0.png)


    ![](img/de79f8d3157260923142f6327cdaf49c_74_1.png)


    > This process of hiding scripts is not perfect. Certain characters within your
    script (particularly the greater-than sign, >) may end the comment prematurely.


    # Supporting Non-JavaScript Browsers


    You can now hide your script from older browsers so they won''t display the script
    itself. But you may need to support these browsers (for example, displaying a
    notice that the page requires JavaScript). The <SCRIPT> tag, supported in JavaScript
    1.1 and later, provides a convenient solution. This tag tells JavaScript-compatible
    browsers to ignore everything between the beginning and ending <NOSCRIPT> tags;
    you can then include HTML content for the non-JavaScript browser within the tags.


    ![](img/de79f8d3157260923142f6327cdaf49c_74_2.png)


    > Old browsers that don''t support JavaScript don''t support the <NOSCRIPT> tag
    either. However, this technique still works, according to the HTML standard, browsers
    should ignore unknown tags. Modern browsers support the <NOSCRIPT> tag when JavaScript
    support is turned off.'
  merge: -1
