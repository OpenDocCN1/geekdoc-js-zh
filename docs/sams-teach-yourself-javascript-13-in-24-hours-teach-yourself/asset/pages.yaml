    ```

    1: if ((navigator.appVersion.charAt(0) == "4"

    2:   (navigator.appVersion.charAt(0) == "5

    ```


    As an alternate approach, you can check for the existence of the document.layers
    object

    for Netscape 4.0 or later, and the document.all object for IE 4.0 or later. The
    examples

    in Hour 18 use this technique.


    This example first checks for a version 4.0 or 5.0 browser. Next, it checks the

    navigator.appName property to assign either "netscape" or "ie" to the browser

    variable. You can then check this variable later in the script.


    ![](img/de79f8d3157260923142f6327cdaf49c_269_0.png)


    > If the browser is 3.0 or earlier, or if is neither Netscape nor Internet

    Explorer, this example does not assign a value to the browser variable. You

    might to take this into account in your scripts.


    # Using Separate Script Commands


    Once you know which browser is in use, a simple strategy is to use a separate
    block

    commands for each browser. Here is a basic structure you can use:


    ```

    if (browser == "ie") {

    // place IE-specific statements here

    }

    if (browser == "netscape") {

    // place Netscape-specific statements here

    }

    ```


    # Creating Pointers to Objects


    A concise strategy is to set a variable as a pointer to an object. If the browsers

    different objects, you can use this pointer as a universal substitute.


    For example, playing an embedded sound sound1 uses the document.

    document.sound1.play() method in Netscape and the document.sound1.run() method

    in Explorer. You can set a pointer that will work with either browser:


    ```

    if (browser == "ie") {

    noise = document.sound1.run;

    ```'
