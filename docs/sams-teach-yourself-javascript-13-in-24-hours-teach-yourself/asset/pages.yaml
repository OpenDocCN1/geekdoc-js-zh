    # Using Numeric Arrays


    An array is a numbered group of data items that you can treat as a single unit.
    For exam-

    ple, you might use an array called scores to store several scores for a game.
    Arrays can

    contain strings, numbers, objects, or other types of data.


    # Creating a Numeric Array


    Unlike most other types of JavaScript variables, you must declare an array before
    you

    use it. The following example creates an array with 30 elements:


    ```

    scores = new Array(30);

    ```


    To assign values to the array, use brackets and an index. Indices begin with 0,
    so the ele-

    ments of the array in this example would be numbered 0 to 29. These statements
    assign

    values to the first four elements of the array:


    ```

    scores[0] = 39;

    scores[1] = 40;

    scores[2] = 100;

    scores[3] = 49;

    ```'
