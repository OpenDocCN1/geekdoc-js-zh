  md: '# Exploring JavaScript''s Capabilities


    If JavaScript can work with forms faster than CGI and without communicating with
    the server, you may be wondering, why use CGI? The answer is that CGI can do things
    a client-side scripting language can''t, such as writing data to a file on the
    server or working with a database. (A server-side version of JavaScript is available
    and can also perform these functions.)


    # Detecting Browser Versions


    The HTML standard was designed to be cross-platform. In other words, if you follow
    the HTML standards, your page should look about the same in any browser on any
    computer platform.


    If you''ve done much work designing HTML Web pages, you probably noticed that
    this isn''t always the case. While the newest browsers from Microsoft and Netscape
    have moved closer to a common standard, there are still differences in the way
    they treat HTML code. On top of that, each browser has a number of different versions
    with different features.


    While it''s possible to carefully construct a simple HTML document so that it
    will display properly in both browsers, new features such as Dynamic HTML aren''t
    supported in the same way. One solution is to have browser-specific pages for
    each browser, or perhaps a specific page for one browser and a generic one for
    others.


    Some sites have just that and ask you to click on the link for the appropriate
    browser version. With JavaScript, you can automate this process: Your page can
    detect the user''s browser type and version and send him to the appropriate customized
    page or use JavaScript to customize the output from a single page.


    Because of the differences in the ways browsers handle HTML, you should test the
    page in different browsers. If you plan to use JavaScript to detect browsers,
    you will want to keep a few browsers (or at least the latest Microsoft and Netscape
    offerings) for testing.


    One major difference between Microsoft''s and Netscape''s browsers—and even between
    different versions of each—is the way they handle JavaScript. It is possible to
    detect the browser version using a simple, universal script, and then to use separate
    JavaScript commands for different browsers. You''ll learn more about these issues
    in Hour 16, “Creating Browser-Specific Scripts.”'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'While detecting browser versions is usually something you would do to allow
    more users to comfortably access your site, it''s also possible to make it difficult—or
    in some cases impossible—to access the site without using a particular browser.
    While I certainly don''t recommend this, you''ll probably run into a site or two
    using this technique.


    # Working with Plug-ins


    Plug-ins are browser add-ons that allow different types of content to be used
    within a Web page. Plug-ins are available for everything from audio to video to
    virtual reality, and much more. Here are some of the most common plug-ins:


    +   * RealAudio, for streaming audio support

    * QuickTime, for embedded video clips

    * Adobe Acrobat, for precisely formatted documents

    * ShockWave, for animations and interactive applications


    While you can use plug-in content to add just anything to your Web page, there
    is one major problem: Aside from a few default plug-ins that are included with
    browsers, you can''t really count on the entire audience for your page to have
    the plug-in installed.


    This makes plug-ins an issue similar to browser versions: Either you have to choose
    one particular plug-in to support and expect the users to install it, or you must
    create alternative pages (typically using one plug-in and one without them).


    Once again, JavaScript can make the situation a bit more controllable. You can
    use JavaScript to detect whether the browser has a particular plug-in installed
    and modify the HTML page appropriately. If the plug-in is not available, your
    script can send the user to a different page, or even send him to the download
    page for the plug-in.


    Along with detecting installed plug-ins, you can use JavaScript to work with plug-in
    content. Netscape calls this feature LiveConnect. Using this system, you can control
    a plugin with JavaScript.


    > Incidentally, the LiveConnect specification also allows JavaScript programs
    to communicate with Java applets, and it allows Java applets to access JavaScript
    variables and commands.'
