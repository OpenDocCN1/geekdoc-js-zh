  md: '# Using Multiple Conditions with switch


    Often, you''ll use several statements in a row to test for different conditions.
    Listing 7.3 shows one example of this technique.


    # Listing 7.3 USING MULTIPLE IF STATEMENTS.


    ```

    1: if (button=="next") window.location=next.html;

    2: if (button=="previous") window.location=prev.html;

    3: if (button=="home") window.location=home.html;

    4: if (button=="back") window.location=menu.html;

    ```


    Although this is a pretty compact way of doing things, this method can get messy
    if each statement has its own block of code with several statements. As an alternative,
    JavaScript includes the switch statement, which allows you to combine several
    tests of the same variable or expression into a single block of statements. Listing
    7.4 shows the same example converted to use switch.


    ![](img/de79f8d3157260923142f6327cdaf49c_111_0.png)


    > The switch statement is included in JavaScript 1.2 (Netscape 4.0) and later.
    Be sure your browser supports this version before you try the examples. To ensure
    that scripts won''t cause errors, specify the LANGUAGE="JavaScript1.2" in the
    <SCRIPT> tag.


    # Listing 7.4 TESTING MULTIPLE CONDITIONS WITH SWITCH.


    ```

    1: switch(button) {

    2:   case "next":

    3:     window.location=next.html;

    4:     break;

    5:   case "previous":

    6:     window.location=prev.html;

    7:     break;

    8:   case "home":

    9:     window.location=home.html;

    10:    break;

    11:  case "back":

    12:    window.location=menu.html;

    13:    break;

    14:  default:

    15:    window.alert("Wrong button.");

    16: }

    ```'
