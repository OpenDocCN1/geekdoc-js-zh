- img_proc: true
  md: 'For a more versatile display than an alert message, you can use JavaScript
    to create an entirely new browser window. You can choose how the window will be
    displayed—for example, its size and whether it has a toolbar and location bar.


    Once you''ve created a new browser window, you can load a URL into it, or even
    create its content directly using JavaScript. You can also clear the contents
    of the normal browser window and display a new document in it. JavaScript can
    also work with frames, which allow you to divide a browser window into sections.


    ![](img/de79f8d3157260923142f6327cdaf49c_55_0.png)


    Hour 10, "Working with Browser Objects," explains how to use pop-up alerts. In
    Hour 13, "Using Windows and Frames," you will use JavaScript to create custom
    browser windows and to work with frames.


    The newest versions of Netscape and Internet Explorer support a feature called
    Dynamic HTML. One of the uses of Dynamic HTML is to create layers (also known
    as absolute elements) within a page. These are similar to frames, but they can
    overlap (similar to the windows on your computer''s desktop) and can be moved
    around the main browser window. JavaScript can work with layers to create some
    truly amazing effects.


    ![](img/de79f8d3157260923142f6327cdaf49c_55_1.png)


    > You''ll learn about layers and Dynamic HTML in Hour 18, "Creating Pages with
    Layers."


    # # Graphics and Animation


    One thing that separates an exciting, well-designed Web page from a boring one
    is the use of graphics. While you won''t learn how to create graphics in this
    book, you will learn how JavaScript can work with graphics.


    When a browser loads a normal HTML page, it displays the graphics along with the
    text, and the graphics don''t change until you move to a different HTML page.
    Using JavaScript, you can change the rules. JavaScript 1.1 and later include a
    feature called dynamic images, which allows you to replace one image on a page
    with another image without reloading the page.


    One of the most common uses of this JavaScript feature is to create images that
    change when the mouse moves over them. This is usually used to highlight an image
    used as a link as the user moves the mouse pointer across it.'
