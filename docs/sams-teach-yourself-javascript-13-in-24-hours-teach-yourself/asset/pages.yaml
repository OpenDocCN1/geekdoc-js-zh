    # Returning a Value


    While the function you created displays a message to the user, functions can also
    return a value to a script that called them. This allows you to use functions
    to calculate values. As an example, you can create a function that averages four
    numbers.


    Your function should begin with the function keyword, the function''s name, and
    the parameters it accepts. We will use the variable names a, b, c, and d for the
    four numbers to average. Here is the first line of the function:


    ```

    function Average(a,b,c,d) {

    ```


    > I''ve included the first brace {} on the first line of the function. This is
    a common style, but you can also place the brace on the next line, or on a line
    by itself.


    ![](img/de79f8d3157260923142f6327cdaf49c_70_2.png)


    Next, the function needs to calculate the average of the four numbers. You can
    calculate this by adding the numbers, dividing by the number of numbers (in this
    case, 4). Thus, here is the next line of the function:


    ```

    result = (a + b + c + d) / 4;

    ```'
