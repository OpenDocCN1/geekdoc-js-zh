  md: 'Obviously, with keyword only saves a bit of typing in situations like this.
    However, you will find it very useful when you''re dealing with an object throughout
    a large procedure, or when you are using a built-in object, such as the Math object.


    # # The Math Object


    The Math object is a built-in JavaScript object that includes Math constants and
    functions. You don''t need to create a Math object, because it exists automatically
    in any JavaScript program. The Math object''s properties represent mathematical
    constants, and its methods are mathematical functions.


    > Because you may use the Math object''s properties and methods throughout an
    entire group of statements, you might find it useful to use the with keyword,
    introduced earlier in this hour, to specify the Math object for those statements.


    # # Rounding and Truncating


    Three of the most useful methods of the Math object allow you to round decimal
    values up and down:


    +   - Math.ceil() rounds a number up to the next integer.

    - Math.floor() rounds a number down to the next integer.

    - Math.round() rounds a number to the nearest integer.


    All of these take the number to be rounded as their single parameter. You might
    notice one thing missing: the capability to round to a decimal place, such as
    for dollar amounts. You can easily simulate this, though. Listing 9.1 shows a
    function that rounds numbers to two decimal places.


    # ### Listing 9.1 A FUNCTION THAT ROUNDS NUMBERS TO TWO DECIMAL PLACES.


    ```

    1: function round(num) {

    2: return Math.round(num * 100) / 100;

    3: }

    ```


    This function multiplies the value by 100 to move the decimal, and then rounds
    the number to the nearest integer. Finally, the value is divided by 100 to restore
    the decimal.'
