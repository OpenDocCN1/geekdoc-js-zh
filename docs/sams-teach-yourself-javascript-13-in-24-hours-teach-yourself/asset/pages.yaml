    numbers. Although you can do quite a bit with numbers, some of the most useful
    applications of JavaScript involve the use of strings (text) and arrays (groups
    of numbers, strings, or objects).


    In Hour 6, you will learn to use strings and arrays in JavaScript. You will cover
    the following topics:


    +   - How strings are stored in String objects

    - Creating and using String objects

