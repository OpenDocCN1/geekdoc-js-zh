- img_proc: true
  md: '# How Layers Work


    Using layers is a new way to make Web pages dynamic. A layer is a section of a
    Web page that can be treated as a separate entity—it can be updated, repositioned
    on the screen, and made to appear and disappear easily. Multiple layers can appear
    at once and can even overlap, with background layers showing through transparent
    foreground layers.


    Layers are similar to frames, but more dynamic—they aren''t restricted to the
    same area of the page, and they don''t necessarily have to be displayed at all.
    Each layer has its own properties, such as background color and images, to make
    its appearance unique.


    Layers are also known as positional elements and are part of the Cascading Style
    Sheets (CSS) specification. This feature is currently supported by Netscape Navigator
    and Microsoft Internet Explorer, although there are differences in implementation
    between the two.


    > Other aspects of the CSS standard were described in Hour 17, "Working with Style
    Sheets."


    In the remainder of this hour, you''ll learn the syntax to create layers and use
    JavaScript to control the layers you''ve created.


    # The Two Layer Standards


    When layers were introduced, they were supported by a Netscape-only tag called
    <LAYER>. You enclosed the content of a layer between <LAYER> and </LAYER> tags.


    Although this method still works in Netscape Navigator, it is no longer the best
    way to create layers—a new standard has emerged. The positioning feature of CSS
    provides the same functionality as the <LAYER> tag, and it''s supported by both
    Netscape (4.0 and later) and Internet Explorer (4.0 and later).


    Except in rare cases, CSS positioning is the best way to implement layers. You
    can make your document work in both browsers with this method. Additionally, because
    it''s a standard, it should remain supported in future browsers.


    > Although CSS positioning is supported by both Netscape and Internet Explorer,
    there are differences in implementation between the two, especially where scripting
    is concerned. Hour 19, "Creating Cross-Browser Scripts," explores these differences.'
  merge: -1
  pgno: 255
- img_proc: true
  md: "# Creating Dynamic Pages with Layers\n\n# Creating CSS Layers\n\nCSS layers\
    \ use style-sheet attributes to define layers, similar to the attributes introduced\
    \ in Hour 17. You can define layers in a number of ways, but the most popular\
    \ is to use the <div> tag.\n\n> The <div> tag is part of the HTML 3.0 standard.\
    \ It defines an arbitrary section of the HTML document, and by itself does not\
    \ specify any formatting for the text it contains. This makes it the ideal choice\
    \ for implementing styles and layers.\n\nTo create a layer with <div>, enclose\
    \ the content between the two division tags and specify the layer properties in\
    \ the STYLE attribute of the <div> tag. Here's a simple example:\n\n```\n<div\
    \ ID=\"layer1\" STYLE=\"position:absolute; left:100; top:100\">\nThis is the content\
    \ of the layer.\n</div>\n```\n\nThis code defines a name with layer1. This is\
    \ a movable layer that's 100 pixels down and 100 pixels to the right of the upper-left\
    \ corner of the browser window. You'll learn more details about the layer properties\
    \ in the next section.\n\n# Setting Layer Properties\n\nYou can use various properties\
    \ in the STYLE attribute of the <div> tag when you define a layer to set its position,\
    \ visibility, and other features. The following properties are listed:\n\n+  \
    \ position is the main positioning attribute and can affect the properties listed\
    \ below. The position property can have one of three values:\n  - static defines\
    \ items that are laid out in normal HTML fashion and cannot be moved. This is\
    \ the default.\n  - absolute specifies that an item will be positioned using coordinates\
    \ you specify.\n  - relative defines an item that is offset a certain amount from\
    \ the static position, where the element would normally been laid out within the\
    \ HTML page.\n  - left and top offsets for the position of the item. For absolute\
    \ positioning, this is relative to the main browser window or a containing item.\
    \ For relative positioning, it's relative to the usual static position.\n  - width\
    \ and height are similar to the standard HTML WIDTH and HEIGHT attributes and\
    \ specify a width and height for the item.\n\n![](img/de79f8d3157260923142f6327cdaf49c_256_0.png)"
  merge: -1
