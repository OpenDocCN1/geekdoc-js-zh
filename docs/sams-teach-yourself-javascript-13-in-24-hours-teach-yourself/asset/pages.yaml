  md: '# # Shuffling the Deck


    The Deal function deals five cards into the five spaces in your HTML document.
    To begin, you first need a shuffled deck of cards. Listing 24.4 shows the first
    half of the Deal function, which fills the deck array with cards and then shuffles
    them.


    # Listing 24.4 THE SCRIPT TO SHUFFLE THE DECK OF CARDS.


    ```

    1: function Deck() {

    2:   // fill the deck (in order, for now)

    3:   for (i=1; i<14; i++) {

    4:     deck[i] = new Card(i,"c\n5:     deck[i+13] = new Card(i,"h\n6:     deck[i+26]
    = new Card(i,"s\n7:     deck[i+39] = new Card(i,"d\n8:   }

    9:   // shuffle the deck

    10:  var n = Math.floor(400 * Math.random() + 500);

    11:  for (i=1; i<n; i++) {

    12:    card1 = Math.floor(52*Math.random() + 1);

    13:    card2 = Math.floor(52*Math.random() + 1);

    14:    temp = deck[card2];

    15:    deck[card2] = deck[card1];

    16:    deck[card1] = temp;

    17:  }

    }

    ```


    Here''s a breakdown of the actions performed by this function:


    +   - Lines 3–8 fill the deck with cards. To begin with, the cards are in order
    by number and then by suit.

    - Lines 9–17 shuffle the deck. This is accomplished by picking a random number
    (line 10) and starting a loop based on that number. In each loop iteration, two
    random cards are chosen (lines 12 and 13) and swapped (lines 14–16).


    # # Dealing the Cards


    The second half of the Deal function will actually deal the cards. Listing 24.5
    shows the remainder of this function.


    # Listing 24.5 THE SCRIPT TO DEAL THE CARDS.


