  md: '# Calculating the String’s Length


    The plus sign (+) is also used to add numbers in JavaScript. The browser knows
    whether to use addition or concatenation based on the types of data you use with
    the plus sign. If you use it between a number and a string, the number is converted
    to a string and concatenated.


    From time to time, you may find it useful to know how many characters a string
    variable contains. You can do this with the length property of String objects,
    which you can use with any string. To use this property, type the string''s name
    followed by .length.


    For example, test.length refers to the length of the test string. Here is an example
    of this property:


    ```

    test = "This is a test."

    document.write(test.length);

    ```


    The first statement assigns the string This is a test to the test variable. The
    second statement displays the length of the string—in this case, 15 characters.


    > Remember that although test refers to a string variable, the value of test.length
    is a number and can be used in any numeric expression.


    # Converting the String’s Case


    Two methods of the String object allow you to convert the contents of a string
    to all uppercase or lowercase:


    +   - toUpperCase() converts all characters in the string to uppercase.

    - toLowerCase() converts all characters in the string to lowercase.


    For example, the following statement displays the value of the test string variable
    in lowercase:


    ```

    document.write(test.toLowerCase());

    ```


    Assuming that this variable contained the This Is A Test, the result would be
    the following string:


    this is a test'
