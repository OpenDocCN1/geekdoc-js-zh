  md: '# HOUR 18


    # Creating Dynamic Pages with Layers


    In Hour 13, “Using Windows and Frames,” you learned that JavaScript can support
    separate browser windows and frames dividing a single window.


    The CSS specification includes a proposed way of creating positional blocks or
    *layers*, which provide a more sophisticated way to deal with multiple windows.
    Additionally, they can be moved, displayed, and hidden using JavaScript.


    During the next hour, you’ll learn to use layers with JavaScript. Hour 18 covers
    the following topics:


    +   - The two methods of defining layers

    - Creating layers with the <DIV> tag

    - Dealing with browsers that don’t support layers

    - Creating a simple layered document

    - Using JavaScript to show, hide, and move layers

    - Using layers for animation


    ![](img/de79f8d3157260923142f6327cdaf49c_254_0.png)'
