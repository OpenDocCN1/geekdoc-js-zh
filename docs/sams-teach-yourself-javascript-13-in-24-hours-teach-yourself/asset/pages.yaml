  md: '# LISTING 2.3 DESCRIPTIVE BREAKDOWN OF THE YEAR 2000 SCRIPT.


    +   1: The script begins here:

    2: Store the current date and time in the now variable

    3: Store January 1st, 2000 in the variable y2k

    4: Subtract from now y2k, divide by 1000, and store in seconds

    5: Display the value of seconds within the Web page

    6: The script ends here.


    In order to use your script, you''ll need to add it to an HTML document. At its
    most basic, the HTML document should include the <HEAD> tags and the <BODY> tags.


    If you add these tags to the document containing your script along with a descriptive
    heading, you should end up with something like Listing 2.4.


    # LISTING 2.4 THE YEAR 2000 SCRIPT INCLUDED IN AN HTML DOCUMENT.


    ```

    1: <HTML>

    2: <HEAD><TITLE>The Year 2000</TITLE></HEAD>

    3: <BODY>

    4: <h1>Countdown to the Year 2000</h1>

    5: <HR>

    6: <SCRIPT LANGUAGE="JavaScript1.1*>

    7: now = new Date();

    8: y2k = new Date(''Jan 01 2000 00:00:00'');

    9: seconds = (y2k - now) / 1000;

    10: document.write("Seconds until the year 2000: " + seconds);

    11: </SCRIPT>

    12: </BODY>

    13: </HTML>

    ```


    Now that you have a complete HTML document, save it with the .htm or .html extension.

    (If you''re using Windows 3.1, you''ll need to use .htm; otherwise, either one
