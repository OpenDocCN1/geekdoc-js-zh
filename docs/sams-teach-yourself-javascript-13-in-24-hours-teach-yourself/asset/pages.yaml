    This sets the noise variable to the appropriate method. After these statements,
    the simple command noise() will play the sound regardless of the browser.


    > You''ll learn more about embedded sounds in Hour 20, "Working with Multimedia
    and Plug-Ins."


    # Avoiding Problems


    Of course, one way to deal with multiple-browser issues is to avoid using any
    browser-specific features. This is a simple approach and will still allow you
    to use most JavaScript 1.1 commands. Of course, using this approach rules out
    Dynamic HTML, sounds, and a host of other relatively new features.


    Often, a cross-browser function is equivalent to a browser-specific one. For example,
    the window.location object can be used to send each browser to a different URL.
    Using this rather than the IE4-specific window.navigate method lets you support
    both browsers without any special effort.


    # Testing and Debugging Scripts


    If you''re trying to write cross-browser scripts (and you should), it''s important
    that you test the scripts in both browsers. Although it may eat up disk space,
    you should have the latest versions of both browsers installed on your development
    system.


    > You may also want to keep some older versions of browsers installed, or use
    them on a separate machine. IE 3.0 and Netscape 3.0 are still widely used.


    # Creating Dynamic HTML for Both Browsers


    Dynamic HTML is a relatively new feature, and as is supported in wildly ways by
    Netscape 4.0 and IE4. You can use the browser-detection methods described earlier
    in this hour to create cross-platform Dynamic HTML.


    Because Dynamic HTML is not supported by anything earlier than the 4.0 browsers,
    you don''t need to worry about supporting early browsers (except, of course, providing
    a non-Dynamic HTML alternative for them).'
