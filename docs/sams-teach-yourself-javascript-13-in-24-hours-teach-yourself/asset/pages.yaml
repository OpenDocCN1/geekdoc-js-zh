    This function lists the items in a table in the shopping cart frame, with one
    added feature: It displays the quantity for each item in a text field so that
    it can be changed. This allows the user to order more than one of a product or
    change a quantity to 0 to cancel an item. Here''s a breakdown of how the displaycart
    function works:


    +   - Line 3 uses the statement to make parent.cart.document the current object.
    This eliminates the need to use this object name in nearly every line of the function.

    - Lines 4-6 open a document in the shopping cart frame and display an HTML header.

    - Lines 7–11 check the number of items. If it is 0 (as it will be when the page
    is loaded), the function returns, displaying only the header and a brief message.

    - Lines 12–22 use a loop to display the quantity, description, price, and total
    price for each item in an HTML table.

    - Lines 23–26 add a total cost and end the table.

    - Lines 27–30 create two buttons: one to update the shopping cart and another
    to complete the order. Both call functions in the (product list) frame.

    - Lines 31–32 write some closing HTML tags and close the document.


    # Updating the Cart Contents


    The shopping cart display uses text fields for the quantities for the ordered
    items. This allows the user to modify the quantity for an item or change it to
    zero to cancel an item. The next function, updatecart, is called when the user
    clicks the Update button displayed at the end of the cart listing. Listing 23.5
    shows this function.


    ![](img/de79f8d3157260923142f6327cdaf49c_322_0.png)'
