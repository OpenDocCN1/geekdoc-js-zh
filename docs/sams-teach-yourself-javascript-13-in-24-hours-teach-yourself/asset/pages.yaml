  md: '# HOUR 13


    # Using Windows and Frames


    Welcome to Part IV! You should now have a good foundation of knowledge about JavaScript
    programming. In the next four hours, you''ll learn some more specific techniques
    for making JavaScript work with various parts of Web pages and browsers.


    In Hour 13, you''ll begin by learning more about browser windows and frames and
    how JavaScript can work with them. This hour covers the following topics:


    +   * The window object hierarchy

    * Creating new windows with JavaScript

    * Delaying your script''s actions with timeouts

    * Displaying alerts, confirmations, and prompts

    * Using JavaScript to work with frames

    * Creating a JavaScript-based navigation frame


    ![](img/de79f8d3157260923142f6327cdaf49c_180_0.png)'
