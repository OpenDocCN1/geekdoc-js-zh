    Click Here</A>


    This example uses the return statement to enclose the event handler. This ensures
    that the false value that is returned when the user clicks Cancel is returned
    from the event handler, which prevents the link from being followed.


    The onDbClick event handler is similar, is used only if the user double-clicks
    on an object. Because links usually require only a single click, you could use
    this to make a link to do different things, depending on the number of clicks.
    (Needless to say, this could be confusing.) You can also detect double-clicks
    on images and other objects.


    To give you more control of what happens when the mouse button is pressed, two
    more events are introduced:


    +   - onDown is used when the user presses the mouse button.

    - mouseUp is used when the user releases the mouse button.


    These two events are the halves of a mouse click. If you want to detect an entire
    click, use mouseUp and onMouseDown to detect just one or the other.


    To detect which mouse button is pressed, you can use the property of the event
    object. This property is assigned the value 1 for the left button or 3 for the
    right button. This property is assigned for onclick, onDbClick, mouseUp, and onMouseDown
    events.


    For example, this script creates an onMouseDown event handler that displays an
    alert indicating button was pressed.


    ```

    function mousealert(e) {

    whichone = (e == 1) ? "Left" : "Right";

    message = "You clicked the " + whichone + " button.";

    alert(message);

    document.onmousedown = mousealert;

    }

    ```


    # Using Keyboard Events


    Prior to the release of Netscape 4.0, JavaScript programs couldn''t detect keyboard
    actions—just mouse actions. This made it difficult to create some types of programs
    in JavaScript. For example, games were difficult to play Go Left and Right buttons.


    Thankfully, JavaScript 1.2 and 1.3 can detect keyboard actions. The main event
    handler for this purpose is onKeyPress, which occurs when a key is pressed and
    released, or held down. With mouse buttons, you can detect the down and up parts
    of the keypress with the onKeyDown and onKeyUp event handlers.'
