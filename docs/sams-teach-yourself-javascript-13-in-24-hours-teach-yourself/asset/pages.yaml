- img_proc: true
  md: 'As you can see from the alert message, it''s no wonder you didn''t win: The
    random number the computer picked includes more than 10 decimal places, and you''ve
    been guessing integers. There''s nothing stopping you from guessing decimal numbers,
    but you''ll need a whole lot more than 10 guesses. The game starts to lose its
    simplicity and charm.


    To fix this problem, look at the statement that generates the random number:


    ```

    5: var num = Math.random() * 100 + 1;

    ```


    This uses the Math.random method, which results in a random number between 0 and
    1. The number is then multiplied and incremented to produce a number between 1
    and 100.


    This statement does indeed produce a number between 1 and 100, but not an integer.
    To fix the problem, you can add the Math.floor method to chop off the decimal
    portion of the number. Here''s a corrected statement:


    ```

    var num = Math.floor(Math.random() * 100) + 1;

    ```


    To fix the script, make this change and test it again. If you play a game or two,
    you''ll find that it works just fine. Listing 20.2 shows the complete, debugged
    script.


    # Listing 21.2 THE COMPLETE, DEGED NUMBER GUESSER SCRIPT.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE>Guess a Number</TITLE>

    4: <SCRIPT LANGUAGE="JavaScript">

    5: var num = Math.floor(Math.random() * 100) + 1;

    6: var tries = 0;

    7: function guess() {

    8: var guess = document.form1.guess.value;

    9: tries++;

    10: status = "Tries: " + tries;

    11: if (guess < num)

    12: document.form1.hint.value = "No, guess higher.";

    13: if (guess > num)

    14: document.form1.hint.value = "No, guess lower.";

    15: if (guess == num) {

    16: window.alert(''Correct! You guessed in '' + tries + '' * '' + tries + '');

    17: location.reload();

    18: }

    19: if (tries == 10) {

    20: window.alert(''Sorry, time''s up. The number was: '' + num);

    21: location.reload();

    22: }

    23: }

    ```'
