    # Using the layer Object


    JavaScript includes a layer object that allows you to work with layers. This is
    part of the browser object hierarchy described in Hour 10. "Working with Browser
    Objects."


    Each layer in the document is represented by a layer object, which is a child
    of the main document object. The layer object is similar to the window object
    and can contain a document object to display HTML content.


    ![](img/de79f8d3157260923142f6327cdaf49c_259_0.png)


    The layer objects are all part of the layers array, which contains one entry for
    each layer in the window. As with the frames and forms arrays, you can use layers.length
    to find the number of layers on the page.


    You can access layers by JavaScript by either using an index in the layers array
    or using their names, which you define with the ID attribute of the <div> tag.
    For example, if a page contains exactly one positional layer called mainlayer,
    you could refer to it with either of these objects:


    ```

    document.layers[@]

    document.mainlayer

    ```


