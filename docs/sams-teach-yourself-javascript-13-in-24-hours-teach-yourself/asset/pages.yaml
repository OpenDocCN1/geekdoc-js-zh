  md: '```

    birthday = new Date(6, 20, 1999);

    birthday = new Date(6, 20, 1999, 8, 0, 0);

    ```


    You can choose any of these formats, depending on which values you want to set.
    If you use no parameters, in the first example, the current date is stored in
    the object. You can then set the values using the set methods, described in the
    next section.


    # Setting Date Values


    A variety of set methods enable you to set components of a Date object to values:


    +   - setDate() sets the day of the month.

    - setMonth() sets the month. JavaScript numbers the months from 0 to 11, starting
    with January (0).

    - setFullYear() sets the year.

    - setTime() sets the time (and the date) by specifying the number of milliseconds
    since January 1, 1970.

    - setHours(), setMinutes(), and setSeconds() set the time.


    As an example, the following statement sets the year of a Date object called holiday
    to 99:


    ```

    holiday.setYear(99);

    ```


    # Getting Date Values


    You can use the methods to get values from a Date object. This is the only way
    to obtain these values, because they are not available as properties. Here are
    the available methods for dates:


    +   - getDate() gets the day of the month.

    - getMonth() gets the month.

    - getFullYear() gets the year.

    - getTime() gets the time (and the date) as the number of milliseconds since January
    1, 1970.

    - getHours(), getMinutes(), and getSeconds() get the time.


    > Along with setFullYear and getYear, which require 4-digit years, JavaScript
    includes setYear and getYear methods, which use two-digit dates. You should always
    use the four-digit version to avoid Year 2000 issues.


    ![](img/de79f8d3157260923142f6327cdaf49c_135_0.png)'
