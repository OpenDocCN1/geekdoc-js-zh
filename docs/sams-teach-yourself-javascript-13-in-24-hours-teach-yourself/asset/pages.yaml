  md: '# Workshop: Creating Dynamic Styles


    Using the JavaScript style sheet objects, you can create a page that allows you
    to control the colors used in displaying a frame. You will create a document with
    two frames: a top frame with a form to control the colors, and a bottom frame
    with the text that will be displayed in the selected colors.


    To begin, you''ll need a document to define the frames. Listing 17.3 shows a basic
    frame definition.


    Listing 17.3 THE FRAMES DOCUMENT FOR THE DYNAMIC STYLES EXAMPLE.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE>Dynamic Styles</TITLE>

    4: </HEAD>

    5: <FRAMES ROWS="*,*">

    6: <FRAME NAME="topframe" SRC="top.html">

    7: <FRAME NAME="bottomframe" SRC="bottom.html">

    8: </FRAMES>

    9: </HTML>

    ```


    > This example is also a good example of communicating between frames in scripts.
    See Hour 13, "Using Windows and Frames," for details about frame objects.


    ![](img/de79f8d3157260923142f6327cdaf49c_249_0.png)


    Next, Listing 17.4 shows the HTML document for the upper frame. You should save
    this document as top.html so that the preceding frameset document can refer to
    it.


    Listing 17.4 THE TOP FRAME OF THE DYNAMIC STYLES EXAMPLE.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE>Controlling Styles with JavaScript</TITLE>

    4: </HEAD>

    5: <BODY>

    6: <h1>Controlling Styles with JavaScript</h1>

    7: <HR>

    8: Select the color for paragraphs and headings, then press the Reload button.

    9: The colors you specified will be used in the document displayed below.

    10: <FORM NAME="form1">

    11: <body>Body text color: </body>

    ```'
