  md: 'This statement creates a variable called result and calculates the result by
    adding the four numbers, dividing by 4. (The parentheses are necessary to tell
    JavaScript to perform the addition before the division.)


    To send this result back to the script that called the function, you use the return
    keyword. Here is the last part of the function:


    ```

    return result;

    }

    ```


    Listing 4.5 shows the complete Average function.


    # LISTING 4.5 A FUNCTION TO AVERAGE FOUR NUMBERS.


    ```

    1: <SCRIPT LANGUAGE="JavaScript">

    2: function Average(a,b,c,d) {

    3:   result = (a + b + c + d) / 4;

    4:   return result;

    5: }

    6: </SCRIPT>

    ```


    To use this function in a script, you can use a variable with the function call.
    For example, this statement averages the numbers 3, 4, 5, and 6 and stores the
    result in a variable score:


    score = Average(3,4,5,6);


    ![](img/de79f8d3157260923142f6327cdaf49c_71_0.png)


    > You can also use the function directly in an expression. For example, you can
    use the alert statement to display the result of the function: alert(Average(1,2,3,4)).


    # Understanding Objects


    In Chapter 2, you learned that variables are containers that can store a number,
    a string of text, or another. JavaScript also supports objects. Like variables,
    objects can store data—but they can store two or pieces of data at once.


    The items of data stored in an object are called the properties of the object.
    For example, you could use objects to store information about people, as in an
    address book. The properties of each person object might include a name, an address,
    and other information.


    JavaScript uses periods to separate object names and property names. For example,
    for a person object called Bob, the properties might include Bob.address and Bob.phone.'
