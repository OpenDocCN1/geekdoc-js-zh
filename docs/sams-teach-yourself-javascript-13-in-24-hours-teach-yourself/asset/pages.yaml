  md: '#  Workshop: Storing User Data in Variables


    One common use of variables is to store information that comes from the user.
    As an example, you will now create a script that prompts the user for information
    and creates an HTML document containing that information.


    In this script, we''ll create a customized home page for the user. (It won''t
    be a good one, but it will be customized.) You will use the prompt function to
    prompt for each piece of information. This function is similar to alert, but prompts
    the user for an entry.


    To begin the script, you will prompt for a first name, a last name, and a title
    for the page. These statements prompt for three variables:


    ```

    first = prompt("Enter your first name.");

    last = prompt("Enter your last name.");

    title = prompt("Enter a page title.");

    ```


    You can now use the contents of the variables to customize the HTML document.
    Begin with the title used by the user:


    ```

    document.write("<h1>" + title + "</H1>");");

    ```


    This statement adds the title to the page, enclosed in <h1> (heading 1) tags.
    Next, we''ll make use of the first and last name to give the user credit:


    ```

    document.write("<h2>" * first + " * " + last + "</H2>");");

    ```


    This begins with an <h2> tag, followed by the word "By", the first name, a space,
    and the closing </h2> tag.


    To complete this script, add the usual <SCRIPT> tags and an HTML framework. Listing
    5.2 shows the final HTML document.


    # LISTING 5.2 A SCRIPT TO CREATE A CUSTOMIZED HTML DOCUMENT.


    +   1: <HTML>

    2: <HEAD>

    3: <TITLE>Customized home page</TITLE>

    4: </HEAD>

    5: <body>

    6: <SCRIPT LANGUAGE="JavaScript">


    > These functions look for a number of appropriate type at the beginning of the
    string. If a valid number is not found, the function returns the string "NaN",
    meaning not a number.


    ![](img/de79f8d3157260923142f6327cdaf49c_87_0.png)'
