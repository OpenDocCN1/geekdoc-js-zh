  md: '# # The Sams Teach Yourself in 24 Hours Series


    Sams Teach Yourself provide quick and easy answers in a proven step-by-step approach
    that works for you. In just 24 sessions of one hour or less, you will tackle every
    task you need to get the results you want. Let our experienced authors present
    the most accurate information to get you reliable answers—fast!


    # ## Used Throughout the Book


    +   * ActiveX A technology developed by Microsoft to allow components to be created,
    primarily for Windows computers. ActiveX components, or controls, can be embedded
    in Web pages.


    +   * applet A Java program that is designed to be embedded in a Web page.


    +   * argument A parameter that is passed to a function when it is called. Arguments
    are specified within parentheses in the function call.


    +   * array A set of variables that can be referred to with the same name and
    a number, called an index.


    +   * Boolean A type of variable that can store only two values: true and false.


    +   * concatenate A act of combining two strings into a single, longer string.


    +   * conditional A JavaScript statement that performs an action if a particular
    condition is true, usually using the if statement.


    +   * decrement To decrease the value of a variable by one. In JavaScript, this
    can be done with the decrement operator, ...


    +   * debug Finding and removing errors, or bugs, in a program or script.


    +   * element A single member of an array, referred to with an index.


    +   * event A condition, often the result of a user''s action, that can be detected
    by a script.


    +   * expression A combination of variables, constants, and operators that can
    be evaluated to a single value.


    +   * function A group of JavaScript statements that can be referred to using
    a function name and arguments.


    +   * Hypertext Markup Language (HTML) The language used in Web documents. JavaScript
    statements are not HTML, but can be included within an HTML document.


    +   * increment To increase the value of a variable by one. In JavaScript, this
    is done with the increment operator, ++.


    +   * interpreter The browser component that interprets JavaScript statements
    and acts on them.


    +   * Java An object-oriented language developed by Sun Microsystems. Java applets
    can be embedded within a Web page. JavaScript has similar syntax, but is not the
    same as Java.


    ![](img/de79f8d3157260923142f6327cdaf49c_2_0.png)'
