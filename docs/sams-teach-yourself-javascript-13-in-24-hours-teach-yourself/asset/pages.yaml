    # Workshop: Adding Link Descriptions to a Web Page


    One of the most common uses for an event handler is to display a message on the
    status line when the user moves the mouse over a link. For example, moving the
    mouse over the Order Form link might display a message like "Order a product or
    check an order''s status" on the status line.


    Status line descriptions like these are typically displayed with the: event handler.
    You will now create a script that displays messages in this manner and clears
    the message using the mouseOut event handler. You''ll use functions to simplify
    the process.


    ![](img/de79f8d3157260923142f6327cdaf49c_173_0.png)


    > When you use this technique, your status line message will replace the URL that
    is usually displayed there. Make sure your description is at least as useful as
    the URL. All too often, Web designers use this technique to display a redundant
    message: For example, a link labeled "Order Form" displays the description "Goes
    to the Order Form."


    To begin the script, you will define a function to display a message on the status
    line. Although you don''t need to use a function, it makes your job a bit easier.
    For example, a link with an event handler that displays a message on the status
    line might look like this:


    ```

    <A href="order.html"

    onmouseover="window.status=''Order a product''; return false;">

