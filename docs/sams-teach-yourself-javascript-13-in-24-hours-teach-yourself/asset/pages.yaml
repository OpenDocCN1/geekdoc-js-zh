  md: '# 10 HOUR


    # Working with Browser Objects


    In Hour 9. “Using Built-In Objects,” you learned about JavaScript’s support for
    objects, which allow you to store data in all sorts of interesting ways. However,
    the way you’ll use objects the most is in accessing the browser objects, which
    let your scripts manipulate Web pages, windows, and documents.


    In this hour, you will explore the hierarchy of browser objects. Hour 10 covers
    the following topics:


    +   - How to access the various browser objects

    - Working with windows using the window object

    - Working with Web documents with the document object

    - Using objects for links and anchors

    - Using the location object to work with URLs

    - Getting information about the browser with the navigator object

    - Creating JavaScript-based Back and Forward buttons'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# Understanding Browser Objects


    One advantage that JavaScript has—even over more sophisticated languages like
    Java—is that scripts can manipulate the Web browser. Your script can load a new
    page into the browser, work with parts of the browser window and document, and
    even open new windows.


    In order to work with the browser and documents, JavaScript uses a variety of
    browser objects. Each object represents part of a Web page—for example, a window,
    a document, or an image. Browser objects have properties, which describe the Web
    page or document, and methods, which allow you to work with parts of the Web page.


    The browser objects are arranged into a hierarchy of parent and child objects.
    When you refer to an object, you use the parent object name followed by the child
    object name or names, separated by periods. For example, JavaScript stores objects
    to represent images in a document as children of the document object. The following
    refers to the image9 window.document.image9, a child of the document object, which
    is a child of the window object:


    ```

    window.document.image9

    ```


    The window object is at the top of the browser object hierarchy. Figure 10.1 shows
    the object hierarchy and a variety of its objects.


    ![](img/de79f8d3157260923142f6327cdaf49c_143_0.png)'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Working with Browser Objects


    > This diagram includes only the basic browser objects that will be covered in
    this hour. A variety of other objects also fit into the hierarchy, and they will
    be discussed in later hours of this book.


    ![](img/de79f8d3157260923142f6327cdaf49c_144_0.png)


    # Using window Objects


    At the top of the browser object hierarchy is the window object, which represents
    a browser window. You''ve already used a few methods and properties of the window
    object:


    +   - You used the window.status property to change the contents of the browser''s
    status line.

    - The window.alert, window.confirm, and window.prompt methods display message
    dialogs to the user.


    There can be several window objects at a time, each representing an open browser
    window. Frames are also represented by window objects. You''ll learn more about
    windows and frames in Hour 13, "Using Windows and Frames."


    ![](img/de79f8d3157260923142f6327cdaf49c_144_1.png)


    > Layers, which allow you to change the content of a Web document dynamically,
    are also similar to window objects. These are explained in Hour 18, "Creating
    Dynamic Pages with Layers."


    ![](img/de79f8d3157260923142f6327cdaf49c_144_2.png)


    # Working with Web Documents


    The document object represents a Web document, or page. Web documents are displayed
    within browser windows, so it shouldn''t surprise you to learn that the document
    object is a child of the window object.


    Because the window object always represents the current window (the one containing
    the script), you can use window.document to refer to the current document. You
    can also simply refer to document, which automatically refers to the current window:


    > You''ve already used the document.write to display text within a Web document.
    The examples in earlier hours used only a single window and document, so it was
    unnecessary to use window.document.write—but this longer syntax would have worked
    equally well.


    ![](img/de79f8d3157260923142f6327cdaf49c_144_3.png)'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'If multiple windows or frames are in use, there might be several window objects,
    each with its own document object. To use one of these document objects, you use
    the name of the window and the name of the document.


    In the following sections, you will look at some of the properties and methods
    of the document object that will be useful in your scripting.


    # Getting Information About the Document


    Several properties of the document object include information about the current
    document in general:


    +   * The URL property specifies the document''s URL. This is a simple text field.
    You cant change this property. If you need to send the user to a different location,
    use the window.location object, described later in this hour.

    * The title property object lists the title of the current page, defined by the
    HTML <TITLE> tag.

    * The referrer property is the URL of the page the user was viewing prior to the
    current page—usually, with a link to the current page.

    * The lastModified property is the date the document was last modified. This date
    is sent from the server along with the page.


    As an example, Listing 10.1 shows a short HTML document that displays its last
    modified date.


    Listing 10.1 DISPLAYING THE LAST MODIFIED DATE.


    ```

    1: <HTML><HEAD><TITLE>Test Document</TITLE></HEAD>

    2: <BODY>

    3: This page was last modified on:

    4: <SCRIPT>

    5: document.write(document.lastModified);

    6: </SCRIPT>

    7: <BR>

    8: </HTML>

    ```


    This can tell the user when the page was last changed. If you use JavaScript,
    you don''t have to remember to update the date each time you modify the page.
    (You could also use the script to always print the current date, but that would
    be cheating.)'
  merge: -1
  pgno: 145
- img_proc: true
  md: '> You might find that the document.lastModified property doesn''t work on your
    Web pages. The date is received from the Web server, and some servers do not maintain
    modification dates correctly.


    # Writing Text in a Document


    The simplest document object methods are also the ones you will use most often.
    In fact, you''ve used one of them already. document.write method prints text as
    part of the HTML page in a document window. This statement is executed whenever
    you need to include output in a Web page.


    An alternative, document.writ prints text, but it also includes a newline (\n)
    character at the end. This is handy when you want your text to be the last thing
    on the line.


    > Bear in mind that the newline character is ignored by HTML, except inside the
    <PRE> container. You will need to use the <BR> tag if you want an actual line
    break.


    You can use these methods only within the body of the Web page, so they will be
    executed when the page loads. You can''t add to a page that has already loaded
    without reloading it. You can write new content for a document, however, as the
    next section explains.


    > The document.write method can be used only within a <SCRIPT> tag in the body
    of an HTML document. You can also use it in a function, provided you include a
    call to the function within the body of the document.


    # Clearing and Rewriting Documents


    The document object includes open and close methods. Unlike the window object
    methods of the same name, these methods don''t actually open and close new documents
    or windows. Instead, the open method opens a stream, which clears the document
    and allows you to create a new one with the write or writeln method.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'When you use the document.open method, the current document is cleared. Any
    data already displayed in the document is erased, and you can begin writing new
    content to the document.


    The data you write after document.open isn''t actually displayed until you close
    the stream with the document.close method. You can use this to ensure that blocks
    of write commands execute at the same time.


    ![](img/de79f8d3157260923142f6327cdaf49c_147_0.png)


    +   If you use the document.open method on the current window, your script—part
    of the current document—will be cleared and will stop executing. For this reason,
    these methods are best used with separate windows and frames. You''ll learn about
    this in Hour 13.


    You can optionally specify a MIME document type in the document.open command.
    This enables you to create a document of any type, including images and documents
    used by plug-in applications. You''ll learn about plug-ins in detail in Hour 20,
    "Working with Multimedia and Plug-Ins."


    ![](img/de79f8d3157260923142f6327cdaf49c_147_1.png)


    > MIME stands for multipurpose Internet mail extensions. It''s an Internet standard
    for document types. Web servers send a MIME type to the browser with documents
    to tell the browser how to display them. Typical browser documents are HTML (MIME
    type text/html) and text (MIME type text/plain).


    # # Using Links and Anchors


    Another child of the document object is the link object. Actually, there can be
    multiple link objects in a document. Each one includes information about a link
    to another location or anchor.


    ![](img/de79f8d3157260923142f6327cdaf49c_147_2.png)


    > Anchors are named places in an HTML document that can be jumped to directly.
    You define them with a tag like this: <A NAME="part2>. You can then link to them:
    <A HREF="#part2">'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Working with Browser Objects


    You can access link objects with the links array. Each member of the array is
    one of the link objects in the current page. A property of the array, document.links.length,
    indicates the number of links in the page.


    Each link object (or member of the links array) has a list of properties defining
    the URL. These are the same properties as the location object, defined earlier
    in this chapter. You can refer to a property by indicating the link number and
    property name. For example, the following statement assigns the entry URL of the
    first link to the variable link:


    ```

    link1 = links[].href;

    ```


    The anchor objects are also children of the document object. Each anchor object
    represents an anchor in the current document—a particular location that can be
    jumped to directly.


    Like links, you can access anchors with an array: anchors. Each element of this
    array is an anchor object. The document.anchors.length property gives you the
    number of elements in the anchors array.


    # Accessing Browser History


    The history object is another child (property) of the window object. This object
    holds information about the URLs that have been visited before and after the current
    one, and it includes methods to go to previous or next locations.


    The history object has three properties:


    +   - history.length keeps track of the length of the history list—in other words,
    the number of different locations that the user has visited.

    - history.current contains the value of the current history entry—the URL of the
    page that the user is currently staring at.

    - history.next is the value of the next entry in the history list—the URL that
    will be sent to if he presses the browser''s Forward button. Because the Forward
    button only works when you''ve already used the Back button, there may not always
    be a value for the history.next.

    - history.previous is the previous history entry—the URL the user will be sent
    to if he uses the browser''s Back button.


    ![](img/de79f8d3157260923142f6327cdaf49c_148_0.png)'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'You can also treat the history object as an array. Each entry contains one
    of the URLs in the history list, with history(0) being the current entry. Last
    but not least, the history object has three methods:


    +   - history.go opens a URL from the history list. To use this method, specify
    a positive or negative number in parentheses. For example, history.go(-2) is equivalent
    to pressing the Back button twice.

    - history.back loads the previous URL in the history list—equivalent to pressing
    the Back button.

    - history.forward loads the next URL in the history list, if available. This is
    equivalent to pressing the Forward button.


    You''ll use these methods in the Workshop at the end of this hour.


    > The history.back and history.forward methods don''t work correctly in some versions
    of Netscape Navigator. For this reason, it''s best to use history.go(-1) and history.go(1).


    ![](img/de79f8d3157260923142f6327cdaf49c_149_0.png)


    # Working with the location Object


    A third child of the window object is the location object. This object stores
    information about the current URL stored in the window. For example, the following
    statement loads a URL into the current window:


    ```

    window.location.href="http://www.starlingtech.com";

    ```


    The href property used in this statement contains the entire URL of the window''s
    current location. You can also access portions of the URL with various properties
    of the location object—for example, location.protocol is the protocol part of
    the URL (typically http):


    ![](img/de79f8d3157260923142f6327cdaf49c_149_1.png)


    > Although the location.href property usually contains the same URL as the document.URL
    property described earlier in this chapter, you can''t change the document.URL
    property. Always use location.href to load a new page.'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'The location object has two methods:


    +   - location.reload reloads the current document. This is the same as the Reload
    button on Netscape''s toolbar.

    - location.replace replaces the current location with a new one. This is similar
    to setting the location object''s properties yourself. The difference is that
    the replace method does not affect the browser''s History. In other words, the
    Back button can''t be used to go to the previous location.


    # # Reading Information About the Browser


    The navigator object is isnt part of the browser object hierarchy, but it contains
    information about the browser version. You can use this object to find out which
    browser and computer platform the user is running, and your script can change
    its behavior to match that browser.


    ![](img/de79f8d3157260923142f6327cdaf49c_150_0.png)


    > The navigator object is named after Netscape Navigator, which was the only browser
    that supported JavaScript when the language first appeared in Navigator 2.0. Despite
    its Netscape-specific name, this object is now supported in Microsoft Internet
    Explorer.


    Browser-specific scripting can be complicated, and you''ll learn more about the
    navigator object in Hour 16, "Creating Browser-Specific Scripts."


    # # Workshop: Creating Back and Forward Buttons


    One common use for the back and forward methods of the history object is to add
    your own Back and Forward buttons to a Web document. This can improve the user
    interface of your pages.


    As an example of the use of the history object, you will now create a script that
    displays Back and Forward buttons and uses these methods to navigate the browser.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'You will use graphic images for the Back and Forward buttons. You can use the
    images included in this book''s CD-ROM or make your own images to match the other
    graphics on your page.


    Here''s the part of the script that will handle the Back button:


    ```

    <A HREF="javascript:history.go(-1);">

    <IMG ORDER = 0 SRC="left.gif">

    </A>

    ```


    This uses a javascript: URL to execute a command when the user clicks on a link.
    In this case, the link is the left-arrow image. The script for the Forward button
    is nearly identical:


    ```

    <A HREF="javascript:history.go(1);">

    <IMG ORDER = 0 SRC="right.gif">

    </A>

    ```


    With these out of the way, you just need to build the rest of an HTML document.
    Listing 10.2 shows the complete HTML document, and Figure 10.2 shows Netscape''s
    display of the document. After you load this document into a browser, visit other
    URLs and make sure the Back and Forward buttons work.


    # LISTING 10.2 A WEB PAGE THAT USES JASCRIPT TO INCLUDE BACK AND FORWARD BUTTONS.


    +   1: <HTML>

    2: <HEAD><TITLE>Graphic Back and Forward Buttons</TITLE>

    3: </HEAD>

    4: <BODY>

    5: <h1>Graphical Back and Forward Buttons</h1>

    6: <HR>

    7: This page allows you to go back or forward to pages in the history

    8: list. These should be equivalent to the back and forward arrow buttons

    9: in the browser''s toolbar.

    10: <HR>

    11: <A HREF="javascript:history.go(-1);">

    12: <IMG ORDER = 0 SRC="left.gif">

    13: </A>

    14: <A HREF="javascript:history.go(1);">

    15: <IMG ORDER = 0 SRC="right.gif">

    16: </A>

    17: <HR>

    18: </BODY>

    19: </HTML>'
