  md: '# # What Is an Object?


    As you should know from earlier hours of this book, objects allow you to combine
    several kinds of data (properties) and functions to act on the data (methods)
    into a single, convenient package. In this hour, you''ll learn more about the
    built-in Math and Date objects—but first, here''s a quick overview of the ways
    objects work in JavaScript.


    # ## Creating Objects


    Each object has a special function, called *constructor*, that''s used to create
    objects. For example, JavaScript includes a built-in function String to create
    String objects. That''s why you can create a string variable like this:


    ```

    myname=new String("Figby");

    ```


    The *new* keyword tells JavaScript to create a new object—or in technical terms,
    an *instance* of the object. This particular instance will have the value Figby
    and will be stored in the variable name.


    You can use the same basic syntax to create String objects, Date objects, Array
    objects, and even your own custom objects (The Math object is an exception, which
    you''ll learn about later in this hour).


    ![](img/de79f8d3157260923142f6327cdaf49c_131_0.png)


    > If you''re dying to cote some custom objects away, you should probably get some
    sleep. If you''re serious, you can skip to Hour 11, "Creating Custom Objects."


    # ## Object Properties and Values


    Each object can have one or more *properties*, or attributes. Each property is
    basically in itself, and is contained within the object. Each property can be
    assigned a value. You can use properties to store any type of data a variable
    can store.


    You''ve already used a few object properties, such as the length property of strings
    and arrays. To refer to a property, you use the object''s name, a period, and
    the property''s name. For example, the length of the names array is referred to
    with this property:


    ```

    names.length

    ```'
