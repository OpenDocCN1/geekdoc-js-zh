  md: '# Summary


    During this hour, you''ve learned what Web scripting is and what JavaScript is.
    You''ve also learned how to insert a script into an HTML document, and how JavaScript
    differs from other Web languages.


    If you''re waiting for some real JavaScript code, look no further. The next hour,
    "Creating a Simple Script," guides you through the process of creating a working
    JavaScript application.


    # Q&A


    +   Q If I plan to learn Java anyway, will I have any use for JavaScript?


    +   A Certainly. JavaScript is the ideal tool for many applications, such as form
    validation. JavaScript is also faster than Java for simple tasks because there
    is usually a delay of 10 seconds or longer to start a Java applet.


    +   Can a Web page include more than one set of <SCRIPT> tags?


    +   A Yes. In fact, the larger scripts in this book will often include two or
    more script sections.


    +   Can I make scripts that work on Netscape and Internet Explorer?


    +   A Yes, but it isn''t always easy. Some JavaScript commands are supported by
    both browsers, and if you carefully test a simple script on both browsers, you
    can make it work. For more complex scripts, you may need to use different sections
    of each browser. JavaScript can detect the browser and then run the code for the
    appropriate browser.


    +   Q What about supporting different versions of Netscape?


    +   A If you don''t specify a version number in the <SCRIPT> tag, you can write
    simple scripts that will run in Netscape 2.0 and later versions. In that case
    you will need to stick to the features of JavaScript 1.0.


    +   Q What happens if a user''s browser doesn''t support JavaScript at all?


    +   A You can use HTML comments to prevent older browsers from displaying JavaScript
    code. This is explained in Hour 4.'
  merge: -1
