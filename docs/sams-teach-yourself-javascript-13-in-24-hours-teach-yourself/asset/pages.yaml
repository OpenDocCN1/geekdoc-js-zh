    # Using Timeouts


    Sometimes the hardest thing to get a script to do is do nothing at all—for a specific
    amount of time. Fortunately, JavaScript includes a built-in function to do this.
    The'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'window.setTimeout method allows you to specify a time delay and a command that
    will execute after the delay passes.


    > Timeouts don''t actually make the browser stop what it''s doing. Although the
    statement you specify in the setTimeout method won''t be executed until the delay
    passes, the browser will continue to do other things while it waits (for example,
    acting on event handlers).


    Begin a timeout with a call to the setTimeout() method, which has two parameters.
    The first is a JavaScript statement, or group of statements, enclosed in quotes.
    The second parameter is the time to wait in milliseconds (thousandths of a second).
    For example, the following statement displays an alert dialog after 10 seconds:


    ```

    ident=window.setTimeout(\alert(''Time''s up!''),10000);

    ```


    > Like event handlers, timeouts use a JavaScript statement within quotation marks.
    Make sure you use a single quote (apostrophe) on each side of each string within
    the statement, as shown in the preceding example.


    A variable (ident in this example) stores an identifier for the timeout. This
    enables you to set multiple timeouts, each with its own identifier. Before a timeout
    has elapsed, you can stop it with the clearTimeout() method, specifying the identifier
    of the timeout to stop:


    ```

    window.clearTimeout(ident);

    ```


    # Updating a Page with Timeouts


    Normally, a timeout only happens once because the statement you specify in the
    setTimeout statement is executed only once. But often, you''ll want your statement
    to execute over and over. For example, your script may be updating a clock or
    countdown and need to execute once per second.


    You can make a timeout repeat by issuing the setTimeout() method call again in
    the function called by the timeout. Listing 13.2 shows an HTML document that demonstrates
    a repeating timeout.'
  merge: -1
  pgno: 184
