  md: '# Creating a Simple Script


    To add this feature to your script, open the HTML file in your editor. Insert
    a line before the document.write statement and type this line:


    ```

    seconds = Math.round(seconds);

    ```


    This statement tells the browser to plug the value of the seconds variable into
    the Math.round function and store the resulting number back into seconds.


    Now that you have modified your script, save the HTML file and open the modified
    file using Netscape running. If you left Netscape running, you can simply use
    the Reload button to load the new version of the script. Try it and verify that
    a rounded number is displayed. If you repeatedly press the Reload button, you
    can watch the seconds count down before your eyes.


    # Causing an Error


    You have now created a slightly useful script using the JavaScript language and
    modified it to make it slightly more useful. Next, you will modify the script
    to cause an error.


    You''re probably wondering why you would want to deliberately cause an error.
    The reason is simple: You''re going to run into an error sooner or later, and
    this will give you a demonstration of how Netscape behaves when it runs into a
    JavaScript error.


    To cause an error, modify the statement you added in the previous section. We''ll
    use a common error: omitting one of the parentheses. Change the Math.round statement
    to read:


    ```

    seconds = Math.round(seconds);

    ```


    Save your HTML document again and load the document into the browser. Depending
    on the browser version you''re using, one of two things will happen:


    +   - With Netscape 4.5 and earlier, an error message will be displayed.

    - With Netscape 4.5 and later, no error message is displayed, but you will notice
    that your script stops executing (the number of seconds is not displayed).


    A new feature of Netscape 1.3 (Netscape 4.5 and later) is the JavaScript Console,
    which replaces the error messages in earlier versions. The console displays the
    last few JavaScript errors that have occurred (in some cases), your script may
    cause more than one error.


    To display the console, type javascript: into the browser''s Location field. The
    console is shown in Figure 2.2, displaying the same error message you probably
    see on your computer.'
