  md: '# Splitting a String


    JavaScript includes a string method called split, which splits a string into its
    component parts. To use this method, specify the string to split and a character
    to divide the parts:


    ```

    test = "John Q. Public";

    parts = test.split(" ");

    ```


    In this example, the test string contains the name John Q. Public. The split method
    in the second statement splits the name at each space, resulting in three strings.
    These are stored in a string array called parts. After the example statements
    execute, the elements of parts contain the following:


    +   - parts[0] = "John"

    - parts[1] = "Q."

    - parts[2] = "Public"


    JavaScript also includes an array method, join, which performs the opposite function.
    This statement reassembles the parts into a string:


    ```

    fullname = parts.join(" ");

    ```


    The value in the parentheses specifies a character to separate the parts of the
    array. In this case, a space is used, resulting in the final string John Q. Public.
    If you do not specify a character, commas are used.


    # Sorting an Array


    JavaScript also includes a sort method for arrays, which returns a sorted version
    of the array (alphabetically or numerically). For example, the following statements
    initialize an array of four names and sort it:


    ```

    names[0] = "Public, John Q.";

    names[1] = "Tillman, Henry J.";

    names[2] = "Clinton, Bill";

    names[3] = "Mouse, Mickey";

    sortednames = names.sort();

    ```


    The last statement assigns the sortednames array to the sorted version of names
    using the join method.


