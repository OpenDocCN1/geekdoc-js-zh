  md: '# Introducing Dynamic HTML


    Dynamic HTML, or DHTML, is a standard, supported to some extent by Netscape and
    Microsoft browsers, for several cutting-edge Web features. These include the following:


    +   * Style sheets allow you to control the appearance of a Web page and its elements.

    * Layers allow you to position portions of pages.

    * Dynamic fonts allow you to define a downloadable font to be used to display
    a page. While the font is used to display the document, it is not copied to the
    user''s computer.


    In this hour, you''ll learn how to define and use style sheets, and how to use
    JavaScript to work with styles. In Hour 18, “Creating Dynamic Pages with Layers,”
    you''ll learn about layers.


    # Style and Substance


    If you''ve ever tried to make a really good-looking Web page, you''ve probably
    encountered some problems. First of all, HTML doesn''t give you much control over
    a page''s appearance. For example, you can''t change the amount of space between
    words—in fact, you can''t use two spaces between words because they''ll be converted
    to a single space.


    Second, when you do your best to make a perfect-looking document using HTML, you
    will find that it doesn''t necessarily display the the same way on all browsers—or
    even on different computers running the same browser.


    The reason for these problems is simple: HTML was never meant to handle such things
    as layout, justification, and spacing. HTML deals with the document''s structure—in
    other words, how the document is divided into paragraphs, headings, lists, and
    other elements.


    This isn''t a bad thing. it''s one of the most powerful features of HTML. You
    only define the structure of the document, so it can be displayed in all sorts
    of different ways without changing its meaning. For example, a well-written HTML
    document can be displayed in Netscape or Internet Explorer, which generally treat
    the elements the same way—there is a space between paragraphs, headings are in
    bold, text, and so on.


    Because HTML only defines the structure, the same document can be displayed in
    a text-based browser, such as Lynx. In this case, the different elements will
    be displayed differently, but you can still tell which text is a heading, which
    is a list, and so on.'
  merge: -1
  pgno: 241
