    # Summary


    In this hour, you''ve created a complete—and hopefully fun—JavaScript application.
    You''ve seen how graphics, HTML, and JavaScript can be fitted together to create
    a complete application.


    You''ve reached the end of this book. I hope you''ve enjoyed spending 24 hours
    learning JavaScript and that you''ll continue to learn more about it on your own.
    See this book''s Web site at http://www.jsworkshop.com/ and Appendix A, "Other
    JavaScript Resources," for some starting points to further your learning.


    # Q&A


    +   - Q Is this about as complex as a JavaScript program can get?


    +   - A Not by any means. You can write much more complicated scripts that can
    encompass several different HTML files.'
