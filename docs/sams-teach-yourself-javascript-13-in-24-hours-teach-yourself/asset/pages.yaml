  md: '# Improving a Web Page with JavaScript


    Listing 22.2 THE HTML TO DEFINE THE TABLE OF CONTENTS.


    ```

    1: <FORM name="navform">

    2:   <SELECT name="program">

    3:     <OPTION VALUE="x" SELECTED>Select a Product

    4:     <OPTION VALUE="w">Fictional Word Processor

    5:     <OPTION VALUE="s">Fictional Spreadsheet

    6:     <OPTION VALUE="d">Fictional Database

    7:   </SELECT>

    8:   <SELECT name="category">

    9:     <OPTION VALUE="x" SELECTED>Select a Category

    10:    <OPTION VALUE="tech">Technical Support

    11:    <OPTION VALUE="sales">Sales and Availability

    12:    <OPTION VALUE="feat">List of Features

    13:    <OPTION VALUE="price">Pricing Information

    14:    <OPTION VALUE="tips">Tips and Techniques

    15:  </SELECT>

    16:  <INPUT TYPE="button" NAME="go" VALUE="Go to Page"

    17:       onclick="Navigate()"

    18: </FORM>

    ```


    In addition to the categories discussed, there''s an additional option x in each
    selection list. These are the default and display instructions until another selection
    is made. Selecting the Go button when one of these is selected does nothing.


    # Creating the Function for the Navigation Bar


    You defined an onclick event handler for the Go button, which calls the Navigate()
    function. Next, you need to create this function. It will read the current value
    of selection lists, construct a filename, and load that file into the browser.


    Listing 22.3 shows the Navigate() function. Next you will look at the features
    of this function in detail.


    Listing 22.3 THE FUNCTION FOR NAVIGATION BASED ON THE SELECTION LISTS.


    ```

    1: function Navigate() {

    2:   prod = document.navform.program.selectedIndex;

    3:   cat = document.navform.category.selectedIndex;

    4:   prodval = document.navform.program.options[prod].value;

    5:   catval = document.navform.category.options[cat].value;

    6:   if (prodval == "x" || catval == "x") return;

    7:   window.location = prodval + "_" + catval + ".html";

    8: }

    ```'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'To begin, this function sets two variables, prod and cat, to hold the currently
    selected index for each selection list. Next, prodval and catval are assigned
    to the corresponding value properties.


    The if statement checks both lists for the x value, meaning the user hasn''t yet
    selected an item. If no value has been selected in either list, it returns without
    doing anything.


    Finally, the new document filename is constructed by concatenating the two codes,
    the underscore (_), and the html suffix. This value is assigned to the window.location
    property, which causes the new page to be loaded.


    > Because the location property loads the new document, you can''t do anything
    more in the current JavaScript program. In fact, the Navigate() function never
    returns. However, you could include JavaScript functions on the next page.


    ![](img/de79f8d3157260923142f6327cdaf49c_309_0.png)


    # Adding Link Descriptions


    Some users will undoubtedly prefer traditional hyperlinks to the navigation bar.
    To make these links more friendly, you can display descriptions of them on the
    status line when the user moves the mouse pointer over them.


    You can accomplish this easily with on event handlers. When the user moves the
    mouse over a link, this event will call a function to display the appropriate
    message on the status line. For example, the following HTML defines a link with
    a friendly status line:


    ```

    <A href="order.html"

    onmouseover="window.status=''Allows you to order products'';return true;"

    onmouseout="window.status='''';


    Order form=</a>

    ```


    This sets the value of window.status to display the message. In addition the true
    value is returned; this is necessary to override the normal action (displaying
    the URL) for the status line. The onmouseout event handler can be used to clear
    the status line when the mouse pointer moves off the link.'
  merge: -1
  pgno: 309
