- img_proc: true
  md: '> Radio buttons are named for their similarity to the buttons on old pushbutton-ton
    radios. Those buttons used a mechanical arrangement so that when you pushed one
    button in, the others popped out.


    As scripting, radio buttons are similar to check boxes, except that an entire
    group of them shares a single name and a single object. You can refer to the following
    properties of the radio object:


    +   * name is the name common to the radio buttons.

    * length is the number of radio buttons in the group.


    To access the individual buttons, you treat the radio object as an array. The
    buttons are indexed, starting with 0. Each individual button has the following
    properties:


    +   * value is the value assigned to the button.

    * defaultChecked indicates the value of the CHECKED attribute and the default
    state of the button.

    * checked is the current state.


    For example, you can check the first radio button in the radio1 group on the form1
    with this statement:


    document.form1.radio[0].checked = true;


    However, if you do this, you set the other values to false as needed. This is
    not done automatically. You can use the click method to do both of these in one
    step.


    Like a check box, radio buttons have a click() method and an onClick event handler.
    Each radio button can have a separate statement for this event.


    # Drop-Down Lists


    A final element is also useful for multiple-choice selections. The <SELECT> HTML
    tag is used to define a select list, or a drop-down list of text items. The following
    is an example of a select list:


    ```

    <SELECT NAME="select1" SIZE=40>

    <OPTION VALUE="choice1" SELECTED>This is the first choice.

    <OPTION VALUE="choice2">This is the second choice.

    <OPTION VALUE="choice3">This is the third choice.

    </SELECT>

    ```


    Each of the OPTION tag defines one of the possible choices. The VALUE attribute
    is the name that is returned to the program, and the text outside the OPTION tag
    is displayed as the text of the option.'
