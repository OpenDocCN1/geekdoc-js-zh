  md: "Hour 16 covers the following topics:\n\n+   - Using JavaScript to get browser\
    \ information\n- Displaying browser details with JavaScript\n- Making a page browser\
    \ specific\n- Dealing with browsers without JavaScript support\n- Creating a script\
    \ for multiple browser support\n\n# # Reading Browser Information\n\nIn Hour 10,\
    \ \"Working with Browser Objects,\" you learned about the various objects (such\
    \ as window and document) that represent portions of the browser window and the\
    \ current Web document. JavaScript also includes an object called navigator that\
    \ you can use to read information about the user's browser.\n\nThe navigator object\
    \ isn't part of Netscape's object hierarchy, so you can refer to it directly.\
    \ It includes a number of properties, each of which tells you something about\
    \ the browser. These include the:\n\n+   - navigator.keyCode is the browser's\
    \ internal code name, usually \"Mozilla\"\n- navigator.appName is the browser's\
    \ name, usually \"Netscape\" or \"Microsoft Internet Explorer\"\n- navigator.version\
    \ is the version of Netscape being used—for example \"4.0(Win95)\"\n- navigator.userAgent\
    \ is the user-agent header, a string that the browser sends to the Web server\
    \ when requesting a page. for example \"Mozilla/4.0(Win95)\"\n- navigator.language\
    \ is the language (such as English or Spanish) of the browser. This is stored\
    \ as a two-letter code, such as \"en\" for English. If you create pages in multiple\
    \ languages, you can use this property to display the correct page for the user's\
    \ language\n- navigator.platform is the computer platform of the current browser.\
    \ This is a short string, such as \"Win\", \"Win32\", or \"MacPC\". You can use\
    \ this to enable any platform-specific features (for example, ActiveX components)\n\
    \nYou will use these properties in an if statement. For example, the following\
    \ statement sends the user to a different URL if he is not using Netscape 4.x:\n\
    \n```\nif (navigator.userAgent.indexOf(\"Mozilla/4\") == -1)\n  window.location=\"\
    non_netscape.html\";\n```"
