  md: '# Creating Graphics


    Because this is a card game, you will need graphics for each of the 52 cards in
    the deck. In case you''re not an artist, I''ve made a set of cards available on
    this book''s Web site at http://www.jsworkshop.com/. (When you look at them, you
    will see that I''m not an artist either.)


    Five cards will be displayed on the screen at the same time, so I used graphics
    files with a width of 106 and height of 136. This will allow the game to be played
    on a 640x480 monitor and also look good at other resolutions.


    One of the main considerations in a program like this is the naming of the graphics
    files. Although names like Ten of Spades.gif are friendly to users, they would
    be difficult for the JavaScript interpreter to work with.


    To make easy for the script, I''ve named the files with the numbers 1-13 (Ace
    is 1; Jack, Queen, and King are 11, 12, and 13). The file names are simply this
    number plus a letter representing the suit (c, h, s, or d). As example, the Jack
    of Clubs would be 11c.gif.


    I''ve also created a title, a Hold button to be displayed under each dealt card,
    and Deal buttons to control the gameplay.


    # Choosing Variables


    The next step in planning the script is to choose the variables that will be used.
    You can add variables later, but choosing them beforehand you plan the way the
    script will store data.


    Listing 24.1 shows the global variable definitions for the poker game code. The
    variables include the following:


    +   - score—An integer representing the player''s current score. This starts at
    100. One point will be each time the cards are dealt, and the score will increase
    based on the poker hand''s score.

    - deal—A flag that you''ll use to indicate that the cards have been dealt, and
    the player can now hold or draw cards.

    - hand—An array that stores the values of five cards in the current hand.

    - held—An array of flags that indicate whether each card should be held or discarded.

    - deck—An array that stores the deck of 52 cards that will be shuffled and dealt
    from.'
