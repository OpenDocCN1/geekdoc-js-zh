    # Summary


    In this hour, you''ve learned about JavaScript''s hierarchy of browser objects.
    You''ve learned how you can use the document object to work with documents and
    used the history and location objects to control the current URL displayed in
    the browser.


    You should now be comfortable working with a variety of objects in JavaScript.
    In the next hour, you''ll learn how to create your own objects to store and work
    with data.'
