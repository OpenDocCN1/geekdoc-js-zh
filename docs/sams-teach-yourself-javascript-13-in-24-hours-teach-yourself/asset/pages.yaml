    # Quiz


    +   1. What''s the correct syntax for a script in a frame to refer to a variable
    in another frame?


    +   a. document.frames.frame2.varname

    b. parent.frame2.varname

    c. parent.frame2.document.varname


    +   2. Which statement clears the cart frame and enables a new document to be
    written to it?


    +   a. parent.cart.document.open()

    b. parent.cart.open()

    c. parent.cart.document.clear()


    +   3. What happens if you use several elements with the same name in an HTML
    form? The form does not display correctly.


    +   a. The browser will suffer an identity crisis.

    c. JavaScript treats them as an array.


    # Answers


