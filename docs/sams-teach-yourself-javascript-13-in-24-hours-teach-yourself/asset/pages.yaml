  md: '# # Exercises


    If you want to gain more experience with the techniques you learned in this chapter,
    try these exercises:


    +   - Modify the draw poker game to allow the player to bet a variable amount
    instead of one point for each turn, and adjust the scoring accordingly.

    - Add text fields to the draw poker display to keep track of the number of wins
    (hands that returned a score) and losses (hands with no score) and modify the
    script to update these fields.

    - Use the <EMBED> tag and the play method, described in Hour 20, “Working with
    Multimedia and Plug-Ins,” to add sounds to the game.'
