  md: "# Creating Browser-Specific Scripts\n\nIf you must make a page browser specific,\
    \ be sure you have a good reason to do so. If other browsers can display the page's\
    \ content—even if your cute buttons or animations don't work—you should support\
    \ them. Few users are willing to download a new browser just for your page, so\
    \ you'll be losing a good part of your audience.\n\n![](img/de79f8d3157260923142f6327cdaf49c_232_0.png)\n\
    \n# Branching to Separate Pages\n\nIn most cases, it's not hard to support more\
    \ than one browser. If you want to fine-tune your pages to display perfectly on\
    \ both Netscape and Internet Explorer, one convenient way is to create a separate\
    \ version of the page for each browser. You can then use JavaScript to send the\
    \ user to the appropriate page.\nListing 16.3 shows a script that could be placed\
    \ on the introductory page of a site. After detecting the browser version, it\
    \ sends the user to the appropriate page.\n\nListing 16.3 SENDING BROWSERS TO\
    \ SPECIFIC PAGES.\n\n```\n1  <script>\n2    if (navigator.appname.indexOf(\"Netscape\"\
    ) > -1)\n       && (navigator.appVersion.indexOf(\"4\") > -1)\n       window.location\
    \ = \"netscape.html\";n3    if (navigator.appname.indexOf(\"Microsoft\") > -1)\n\
    \       && (navigator.appVersion.indexOf(\"4\") > -1)\n       window.location\
    \ = \"ie.html\";\n4    window.location = \"default.html\";\n5  </script>\n```\n\
    \nThis script sends the user to one of three pages: netscape.html for Netscape\
    \ 4.x, ie.html for Internet Explorer 4.x, or default.html for any other browser.\n\
    \n> You might have noticed that there is no third if statement in Listing 16.3.\
    \ The statement to send the user to default.html is unconditional. This works\
    \ because either of the if statements were true, the browser would have been sent\
    \ to a different page, immediately aborting the current script. The only browsers\
    \ that make it to the last line are those that aren't detected specifically.\n\
    \n![](img/de79f8d3157260923142f6327cdaf49c_232_1.png)"
  merge: -1
  pgno: 232
