  md: 'The average you''ve used here is called an arithmetic mean. This type of average
    isn''t a perfect way to test randomness. Actually, all it tests is the distribution
    of the numbers above and below .5. For example, if the numbers turned out to be
    2,500 .4s and 2,500 .6s, the average would be a perfect .5—but they wouldn''t
    be very random numbers. (Thankfully, JavaScript''s random numbers don''t have
    this problem.)


    # # Summary


    In this hour, you learned the fundamentals of JavaScript objects, which you''ll
    use throughout Part III as you learn more about objects. You also learned some
    specifics about the Math and Date objects and learned more than you ever wanted
    to know about random numbers.


    In Hour 10, "Working with Browser Objects," you''ll learn all the most useful
    objects in JavaScript: the browser objects, which refer to various parts of the
    browser window and HTML document.


    # # Q&A


    +   - Can one of an object''s properties be another object?


    +   - Absolutely. In this case, the second object is called a child object. You''ll
