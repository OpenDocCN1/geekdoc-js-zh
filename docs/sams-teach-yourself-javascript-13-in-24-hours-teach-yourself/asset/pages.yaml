  md: '# HOUR 11


    # Creating Custom Objects


    In the last two hours, you''ve learned to use JavaScript''s built-in objects,
    such as Date. You''ve also learned about the browser objects, which allow you
    to manipulate Web documents. These are the most commonly used JavaScript objects,
    but you can also create custom objects.


    In this hour, you''ll learn how to create your own custom objects with JavaScript,
    and in the process learn a bit more about how JavaScript handles all kinds of
    objects. Hour 11 covers the following topics:


    +   - How objects can simplify scripts

    - Defining an object

    - Adding methods to an object

    - Creating instances of an object

    - Using objects to store and manage data


    # Using Objects to Simplify Scripting


    Although JavaScript''s variables and arrays are versatile ways to store data,
    sometimes you need a more complicated structure. For example, suppose


    ![](img/de79f8d3157260923142f6327cdaf49c_156_0.png)'
