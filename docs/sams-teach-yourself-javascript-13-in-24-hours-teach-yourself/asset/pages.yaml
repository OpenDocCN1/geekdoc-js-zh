  md: '# Summary


    In this hour, you learned various ways to use JavaScript to read information about
    the user''s browser and to accommodate multiple browsers.


    You''ve reached the end of Part IV and are well on your way to becoming a JavaScript
    expert. In the next four hours, you''ll learn some of the the cutting-edge browser
    features that can be used with JavaScript—style sheets, layers, channels, and
    plug-ins.


    # Q&A


    +   Q What if my page requires a particular plug-in? Is there a way to detect
    that with JavaScript?

    A Yes the navigator object includes properties for detecting plug-ins. These are
    described in Hour 20, "Working with Multimedia and Plug-Ins." However, this method
    doesn''t work in Internet Explorer.

    Q Can I detect the user''s email address using the navigator object or another
    technique?

    A No there is no reliable way to detect users'' email addresses using a non-signed
    script. (If there was, you would get hundreds of advertisements in your mailbox
    every day from companies that detected your address as you browsed their pages.)
    You can use a signed script to obtain the user''s email address, but this requires
    the user''s permission.

    Q Do I need to worry about browsers besides Netscape and Internet Explorer, since
    they don''t support JavaScript anyway?

    A Actually, there is a Windows browser called Opera that supports JavaScript,
    and you never know when a new browser may come out. It''s always best to support
    all of them if you can.


    # Quiz


    +   1. Which of the following navigator object properties is the same in both
    Netscape and IE?


    +   a. navigator.appName

    b. navigator.appCode

    c. navigator.appVersion'
