  md: '# Creating Browser-Specific Scripts


    As you might have guessed, the navigator object is named after Netscape Navigator,
    the browser that originally supported JavaScript. Fortunately, this object is
    also supported by Internet Explorer.


    # Displaying Browser Information


    As an example of how to read the navigator object''s properties, Listing 16.1
    shows a script that displays a list of the properties and their values for the
    current browser.


    LISTING 16.1 A SCRIPT TO DISPLAY INFORMATION ABOUT THE BROWSER.


    ```

    <HTML>

    <head>

    <title>Browser Information</title>

    </head>

    <body>

    <h1>Browser Information</h1>

    <hr>

    <p>

    The <b>navigator/</b> object contains the following information about the browser
    you are using.</p>

    <ul>

    <script language="JavaScript">

    document.write("<li><B>Code Name:</B> " + navigator.appCode);

    document.write("<li><B>App Name:</B> " + navigator.appName);

    document.write("<li><B>App Version:</B> " + navigator.appVersion);

    document.write("<li><B>User Agent:</B> " + navigator.userAgent);

    document.write("<li><B>Language:</B> " + navigator.language);

    document.write("<li><B>Platform:</B> " + navigator.platform);

    </script>

    </ul>

    <hr>

    </body>

    </HTML>

    ```


    This script loads a basic HTML document. A script is used within the body of the
    document (lines 13 to 20) to display each of the properties of the navigator object
    using the document.write statement.


    To try this script, load it into the browser of your choice. If you have more
    than one browser or browser version handy, try it in each one. Netscape''s display
    of the script is shown in Figure 16.1.'
  merge: -1
