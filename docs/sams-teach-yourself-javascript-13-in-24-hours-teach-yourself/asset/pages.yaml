  md: '# HOUR 19


    # Creating Cross-Browser Scripts


    In Hour 18, "Creating Dynamic Pages with Layers," you learned how to use positional
    layers, a function of Dynamic HTML, to show, hide. and move areas within a Web
    page. You might have noticed that the scripts in that hour had to use extra code
    to ensure that they worked in both Netscape Navigator and Internet Explorer (IE).


    This is just one of the many areas where differences in the object models of IE
    and Netscape can cause problems with your scripts. In this hour, you''ll learn
    some of the major differences between the latest Netscape and Microsoft browsers,
    and how to compensate for them.


    Hour 19 covers the following topics:


    +   - How IE4 and Netscape object models differ

    - Creating scripts for multiple browsers

    - How Dynamic HTML works in different browsers

    - Converting Dynamic HTML scripts for cross-browser use


    ![](img/de79f8d3157260923142f6327cdaf49c_266_0.png)'
  merge: -1
