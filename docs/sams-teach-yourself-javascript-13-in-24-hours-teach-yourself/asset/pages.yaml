    - Creating complex applications with JavaScript

    - How to copy a script to your own Web page


    Have you ever been bored by a Web site? (If you haven''t, you need to get out
    more.) One of the most popular uses for JavaScript is to add a bit of excitement
    to a Web page. This includes eye candy features like scrolling messages and animation,
    as well as useful navigational aids and new ways of presenting information.


    # Using the Status Line


    The status line is the gray strip at the bottom of the browser window that is
    found in today’s fashionable browsers. It usually serves two main purposes:


    +   - Displaying descriptions of menu and toolbar items

    - Displaying the URL of links as the mouse pointer moves over them


    Using JavaScript, you can take control of the status line line yourself. You’ve
    probably noticed scrolling messages in the status line of some pages. While this
    can be annoying in some cases (or am I the only one who thinks so?), it’s one
    of the most popular uses of JavaScript.


    > You’ll learn how to create a script for scrolling status line messages in Hour
    6," Strings and Arrays." If you can’t wait three more hours, see the Workshop
    section at the end of this hour.


    ![](img/de79f8d3157260923142f6327cdaf49c_53_0.png)


    Along with scrolling messages, you can take advantage of the status line in other
    ways. One common example uses JavaScript to replace the URL display in the status
    line with a description of the link the mouse pointer is over.


    # Navigational Aids


    You can also use JavaScript to make your site easier to navigate. You’ve probably
    seen drop-down lists on Web pages for navigation between a number of pages. You
    can select a page’s title from the list, then press a button to load that page.
    In some cases, the page is loaded as soon as you select it.'
