  md: '# HOUR 9


    # Using Built-In Objects


    You''ve arrived at Part III of this book. (If you''ve been reading nonstop, it''s
    been eight hours, so you might want to get some sleep before you continue.) In
    this part, you''ll learn all about two advanced features of JavaScript: objects
    and event handlers.


    In Hour 9, you''ll learn the basics of objects in JavaScript and the details of
    using the Math and Date objects. This hour covers the following topics:


    +   * What JavaScript objects are and how to use them

    * How to access an object''s properties

    * Using an object''s methods

    * Using with to work with objects

    * Using the Math object''s methods

    * Using the Date object to work with dates

    * Creating an application using JavaScript math functions'
