  md: '# LISTING 5.1 A SCRIPT USING BOTH LOCAL AND GLOBAL VARIABLES.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE></TITLE>

    4: <SCRIPT LANGUAGE="JavaScript">

    5: var name1 = "Fred";

    6: var name2 = "Ethel";

    7: function Greet(who) {

    8: alert("Greetings, " + who);

    9: var name2 = "Barney";

    10: }

    11: </SCRIPT>

    12: </HEAD>

    13: <body>

    14: <h1>Function Example: the Sequel</h1>

    15: <p>Prepare to be greeted twice.</p>

    16: <SCRIPT LANGUAGE="JavaScript">

    17: Greet(name1);

    18: Greet(name2);

    19: </SCRIPT>

    20: </body>

    21: </html>

    ```


    The script in Listing 5.1 uses the following variables:


    +   * name1 and name2 are global variables defined in the header.

    * who is a local variable created in the Greet() parameter list.

    * Here''s the trick: The Greet() function creates a local variable called name2.
    Since the var keyword is used, this does not affect the global variable name2.
    (If it did, the name2 in the second greeting would change).


    > If you think having two variables with the same name is confusing, you''re right.
    To avoid this, it''s best to use unique names for all variables.


    Notice that the global variables are declared within the header of the HTML document.
    You can actually declare variables in any script the document, but the header
    is a good place for global variables because it is executed first. If you attempt
    to use a variable before it is declared (or assigned a value), it will contain
    the null value.


    You should now understand the difference between local and global variables. If
    you''re still a bit confused, don''t worry—if you use the var keyword every time,
    you''ll almost end up with the right type of variable.'
