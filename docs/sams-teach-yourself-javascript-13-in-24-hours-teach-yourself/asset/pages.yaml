  md: '# HOUR 14


    # Getting Data with Forms


    In this hour you''ll explore one of the most powerful uses for JavaScript: working
    with HTML forms. You can use JavaScript to make a form more interactive, validate
    the user entries, and enter data based on other data.


    This hour covers the following topics:


    +   - Understanding HTML forms

    - Creating a form

    - Using the form object to work with forms

    - How form elements are represented by JavaScript

    - Getting data from a form

    - Sending form results by email

    - How JavaScript can work with CGI forms

    - Validating a form with JavaScript'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# The Basics of HTML Forms


    Forms are among the most useful features of the HTML language. As you''ll learn
    during this hour, adding JavaScript to forms can make them more interactive and
    provide a number of useful features. The first step in creating an interactive
    form is to create the HTML form itself.


    # Defining a Form


    An HTML form begins with the <FORM> tag. This tag indicates that a form is beginning,
    and it enables form elements to be used. The <FORM> tag includes three parameters:


    +   - NAME is simply a name for the form. You can use forms without giving them
    names, but you''ll need to assign a name to a form in order to easily use it with
    JavaScript.

    - METHOD is either GET or POST; these are the two ways the data can be sent to
    the server.

    - ACTION is the CGI script that the form data will be sent to when submitted.
    You can also use the mailto action to send the form''s results to an email address,
    as described later in this hour.


    For example, here is a <FORM> tag for a form named "Order". This form uses the
    GET method and sends its data to a CGI script called order.cgi in the same directory
    as the Web page itself:


    ```

    <FORM NAME="Order" METHOD="GET" ACTION="order.cgi>

    ```


    For a form that will be processed entirely by JavaScript (such as a calculator
    or interactive game), the METHOD and ACTION attributes are not needed. You can
    use a simple <FORM> tag that names the form:


    ```

    <FORM NAME="calcform">

    ```


    The <FORM> tag is followed by one or more form elements. These are the data fields
    in the form, such as text fields, buttons, and check boxes. In the next section,
    you''ll learn how JavaScript assigns objects to each of the form elements.


    # Using the form Object with JavaScript


    Each form in your HTML page is represented in JavaScript by a form object, which
    has the same name as the NAME attribute in the <FORM> tag you used to define it.'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'Alternately, you can use the forms array to refer to forms. This array includes
    an item for each form element, indexed starting with 0. For example, if the first
    form in a document has the name form1, you can refer to it in one of two ways:


    ```

    document.forms[0]

    ```


    # The form Object''s Properties


    Along with the elements, each form object also has a list of properties, most
    of which are defined by the corresponding <FORM> tag. You can also set these within
    JavaScript. They include the following:


    +   - action is the form''s ACTION attribute, or the program to which the form
    data will be submitted.

    - encoding is the MIME type of the form, specified with the ENCTYPE attribute.
    In most cases, this is not needed.

    - length is the number of elements in the form. You cannot change this property.

    - method is the method used to submit the form, either GET or POST.

    - target specifies the window in which the result of the form (from CGI script)
    will be displayed. Normally, this is done in the main window, replacing the form
    itself.


    # Submitting and Resetting Forms


    The form object has two methods: submit and reset. You can use these methods to
    submit the data or reset the form yourself, without requiring the user to press
    a button. One reason for this is to submit the form when the user clicks an image
    or performs another action that would not usually submit the form.


    > If you use the submit method to send data to a server or by email, Netscape
    will prompt the user to verify that she wants to submit the information. There''s
    no way to do this behind the user''s back.


    ![](img/de79f8d3157260923142f6327cdaf49c_198_0.png)


    # Detecting Form Events


    The form object has two event handlers, onSubmit and onReset. You can specify
    a group of JavaScript statements or a function call for these events within the
    <FORM> tag that defines the form.


    ![](img/de79f8d3157260923142f6327cdaf49c_198_1.png)'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'If you specify a statement or function for the onSubmit event, the statement
    is called before it is submitted to the CGI script. You can prevent the submission
    of happening by returning a value of false from the onSubmit event handler. If
    the statement returns true, the data will be submitted. In the same fashion, you
    can prevent a Reset button from working with an Reset event handler.


    # # Scripting Form Elements


    The most important property of the form object is the elements array, which contains
    an object for each of the form elements. You can refer to an element by its own
    name or by its index in the array. For example, the following two expressions
    both refer to the first element in the order form, the name1 text field:


    ```

    document.order.elements[0]",

    ```


    ```

    document.order.name1

    ```


    ![](img/de79f8d3157260923142f6327cdaf49c_199_0.png)


    > Both forms and elements can be referred to by their own names or as indices
    in the forms and elements arrays. For clarity, the examples in this hour you use
    individual form and element names rather than array references. You''ll also find
    it easier to use names in your scripts.


    If you do refer to forms and elements as arrays, you can use the length property
    to determine the number of objects in the array: document.forms.length is the
    number of forms in a document, and document.form1.elements.length is the number
    of elements in the form1.


    # # Text Fields


    The most commonly used form elements are text fields. You can use them to prompt
    for a name, address, or any information. With JavaScript, you can display text
    in the field automatically. The following is an example of a simple text field:


    ```

    <INPUT TYPE="TEXT" NAME="text1" VALUE="hello" SIZE="30">

    ```


    This defines a text field called text1. The field is given a default value of
    ''hello'' and allows up to 30 characters to be entered. JavaScript treats this
    field as a text object with the name text1.


    Text fields are the simplest to work with in JavaScript. Each text object has
    the following properties:'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Getting Data with Forms


    +   - name is the name given to the field. This is also used as the object name.

    - defaultValue is the default value and corresponds to the VALUE attribute. This
    is a read-only property.

    - value is the current value. This starts out as same as the default value, but
    can be changed, either by the user or by JavaScript functions.


    When you work with text fields, most of the time you will use the value attribute
    to read the value the user has entered or to change the value. For example, the
    following statement changes the value of a text field called username in the order
    form to "John Q. User:


    ```

    document.order.username.value = "John Q. User"

    ```


    # Text Areas


    Text areas are defined with their own tag. <TEXTAREA>, and are represented by
    the textarea object. There is one major difference between a text area and a text
    field: Text areas allow the user to enter more than one line of information. Here
    is an example of a text area definition:


    ```

    <TEXTAREA NAME="text1" ROWS="2" COLS="70">

    This is the content of the TEXTAREA tag.

    </TEXTAREA>

    ```


    This HTML defines a text area called text1, with 2 rows and 70 columns available
    for text. In JavaScript, this would be represented by a text area object text1
    under the form object.


    The text between the opening and closing <TEXTAREA> tags is used as the initial
    value for the text area. You can include line breaks within the default value.


    # Working with Text in Forms


    The text and textarea objects also have a few methods you can use:


    +   - focus() sets the focus to the field. This positions the cursor in the field
    and makes it the current field.

    - blur() is the opposite; it removes the focus from the field.

    - select() selects the text in the field, just as a user can do with the mouse.
    All of the text is selected; there is no way to select part of the text.


    You can use event handlers to detect when the value of a text field changes. The
    text and textarea objects support the following event handlers:


    ![](img/de79f8d3157260923142f6327cdaf49c_200_0.png)'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Hour 14


    +   - The onFocus event happens when the text field gains focus.

    - The onBlur event happens when the text field loses focus.

    - The onChange event happens when the user changes the text in the field and then
    moves out of it.

    - The onSelect event happens when the user selects some or all of the text in
    the field. Unfortunately, there is no way to tell exactly which part of the text
    was selected. (If the text is selected with the select() method described above,
    this event is not triggered.


    If used, these event handlers should be included in the <INPUT> tag declaration.
    For example, the following is a text field including an onChange event that displays
    an alert:

    <INPUT TYPE="TEXT" NAME="text1" onChange="window.alert(''Changed.'');">


    # Buttons


    The final type of form element is a button. Buttons use the <INPUT> tag and can
    use one of three different types:


    +   - type=SUBMIT is a Submit button. This button causes the data in the form
    fields to be sent to CGI script.

    - type=RESET is a Reset button. This button sets all the form fields back to their
    default value, or blank.

    - type=BUTTON is a generic button. This button performs no action on its own,
    but you can assign it using a JavaScript event handler.


    All three types of buttons include a NAME attribute to identify the button and
    a VALUE that indicates the text on the button''s face. A few buttons were used
    in the examples in Hour 13, "Using Windows and Frames." As another example, the
    following defines a Submit button with the name sub1 and the value "Click Here":

    <INPUT TYPE="SUBMIT" NAME="sub1" VALUE="Click Here">


    If the user presses a Submit or Reset button, you can detect it with the onSubmit
    or onReset handlers, described earlier in this hour. For generic buttons, you
    can use an onClick event handler.


    # Check Boxes


    A check box is a form element that looks like a small box. Clicking on the check
    box switches between the checked and unchecked states, which is useful for indicating
    Yes or No in your forms. You can use the <INPUT> tag to define a check box. Here
    is a simple example:'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Getting Data with Forms


    <INPUT TYPE="CHECKBOX" NAME="check1" VALUE="Yes" CHECKED>


    Again, this gives a name to the form element. The VALUE attribute assigns a meaning
    to the check box; this is a value that is returned if the box is checked. The
    default value is "on." The CHECKED attribute can be included to make the box checked
    by default.


    A check box is simple: It has only two states. Nevertheless, the checkbox object
    in JavaScript has four properties:


    +   - name is the name of the check box and the object name

    - value is the "true" value for the check box—usually on. This value is used by
    the server to indicate that the check box was checked. In JavaScript, you should
    use the checked property inside

    - checked is the default status of the check box, assigned by the CHECKED attribute

    - checked is the current value. This is a Boolean value: true for checked and
    false for unchecked.


    To manipulate the check box or its value, you use the checked attribute. For example,
    this statement turns on a check box called same in the order form:


    ```

    document.order.same.checked = true;

    ```


    The check box has a single method, click(). This method simulates a click on the
    box. It also has a single event, onClick, which occurs whenever the check box
    is clicked. This happens whether the box was turned on or off, so you''ll need
    to examine the check property to see what happened.


    # Radio Buttons


    Another example for decisions is the radio button, using the <INPUT> tag''s RADIO
    type. Radio buttons are similar to check boxes, but they exist and only one button
    can be checked in each group. They are used for multiple-choice or "one of many"
    input. Here''s an example of a group of radio buttons:


    ```

    <INPUT TYPE="RADIO" NAME="radio1" VALUE="Option1" CHECKED> Option 1

    <INPUT TYPE="RADIO" NAME="radio1" VALUE="Option2"> Option 2

    <INPUT TYPE="RADIO" NAME="radio1" VALUE="Option3"> Option 3

    ```


    These statements define a group of three radio buttons. The NAME attribute is
    the same for all three (which is what makes them a group). The VALUE attribute
    is the value passed to a script or CGI program to indicate which check box is
    selected—be sure you assign a different value to each button.


    ![](img/de79f8d3157260923142f6327cdaf49c_202_0.png)'
