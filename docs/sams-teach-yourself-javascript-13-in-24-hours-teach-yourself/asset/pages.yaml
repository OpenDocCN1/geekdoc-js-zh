    > Notepad, and some other text editors, may try to be helpful and add the .txt
    extension to your script. Be sure your saved file has the correct extension.


    # Testing the Script


    To test your script, you simply need to load the HTML document you created in
    a Web browser. Start Netscape and select Open Page from the File menu. Press the
    Choose File'
