  md: '# APPENDIX B


    # Tools for JavaScript Developers


    One of the best things intended for JavaScript is that it requires no specialized
    tools—all you need to start scripting is a Web browser and a simple text editor.
    Nonetheless, tools are available that will make scripting easier. Some of these
    are described in this appendix.


    # HTML and Text Editors


    While they aren''t specifically intended for scripting, a wide variety of HTML
    editors are available. These allow you to easily create Web documents, either
    by automating the process of entering tags or by presenting you with an environment
    for directly creating styled text.


    # HomeSite


    HomeSite, from Allaire, is a full-featured HTML editor. It is similar to a text
    editor, but includes features to automatically add HTML tags and to easily create
    complicated HTML elements such as tables.'
