  md: '# 214


    # Hour 16


    MIDI stands stands for Musical Instrument Digital Interface, and is a standard
    that lets computers talk to musical instruments, such as synthesizers. It''s also
    a common format for music files that can be played by computers.


    Internet Explorer 3.0 supports the <BGSOUND> HTML tag, which you can use to play
    a MIDI file in the background. Netscape doesn''t support this tag, but browsers
    with the proper plug-in installed can play a MIDI file using the <EMBED> tag.
    Internet Explorer 4.0 also supports <EMBED>.


    Using JavaScript, you can make a document that automatically includes the appropriate
    tag for the browser. Listing 16.5 shows the multiple-browser document.


    # Listing 16.5 USING BACKGROUND MUSIC ON MULTIPLE BROWSERS.


    ```

    1 <HTML>

    2 <HEAD>

    3 <TITLE>Background Music for Multiple Browsers</TITLE>

    4 </HEAD>

    5 <BODY>

    6 <h1>Background Music</h1>

    7 <P>This document includes a background music file. It will play on

    8 Internet Explorer 3.0, or on Netscape or IE4 with the appropriate

    9 plug-in.</P>

    10 <SCRIPT LANGUAGE="Microsoft"> > -1

    11 if (navigator.appVersion.indexOf("3") > -1)

    12 && (document.write("<BGSOUND SRC="polka.mid id");\n13 if (navigator.appVersion.indexOf("4")
    > -1)

    14 document.write("<EMBED SRC="polka.mid id");

    15 </SCRIPT>

    16 </BODY>

    17 </HTML>

    ```


    The script begins on line 9. Lines 10 and 11 check for Internet Explorer 3.0 and
    use document.write to include the <BGSOUND> tag in the document. Lines 12 and
    13 check for a 4.0 browser and include the <EMBED> tag instead. For browsers that
    don''t match either statement, no extra tag is included.'
