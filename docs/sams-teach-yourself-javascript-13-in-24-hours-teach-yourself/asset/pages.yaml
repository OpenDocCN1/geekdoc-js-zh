  md: '# Using Strings and Arrays


    Note that the statement doesn''t change the value of the text variable. These
    methods return the upper- or lowercase version of the string, but they don''t
    change the string itself. If you want to change the string''s value, you can use
    a statement like this:


    ```

    test = test.toLowerCase();

    ```


    ![](img/de79f8d3157260923142f6327cdaf49c_96_0.png)


    > Note that the syntax for these methods is similar to the length property introduced
    earlier. The difference is that methods always use parentheses, while properties
    don''t. The toUpperCase and toLowerCase methods do not take any parameters, but
    you still need to use the parentheses.


    # Working with Substrings


    So far, you''ve worked with entire strings. JavaScript also allows you to work
    with substrings, or portions of a string. You can use the substring method to
    retrieve a portion of a string, or the charAt method to get a single character.
    These are explained in the sections below.


    # Using Part of a String


    The substring() method returns a string consisting of a portion of the original
    string between two indices, which you must specify in parentheses. For example,
    the following statement displays the fourth through sixth characters of the text
    string: document.write(text.substring(3,6));


    At this point, you''re probably wondering where the 3 and the 6 come from. There
    are three things you need to understand about the index parameters:


    +   - Index starts with 0 for the first character of the string, so the fourth
    character is actually index 3.

    - The second index is noninclusive. The index of 6 includes up to index 5 (the
    sixth character).

    - You can specify the two indices in either order. The smaller one will be assumed
    to be the first index. In the previous example, (6,3) would have produced the
    same result. Of course, there is rarely a reason to use the reverse order.


    As another example, suppose you defined a string called alpha to hold the alphabet:


    ```

    alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    ```


    ![](img/de79f8d3157260923142f6327cdaf49c_96_1.png)'
