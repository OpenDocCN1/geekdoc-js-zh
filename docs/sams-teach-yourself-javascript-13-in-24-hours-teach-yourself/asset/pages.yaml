  md: '# Generating Random Numbers


    One of the most commonly used methods of the Math object is the Math.random()
    method, which generates a random number. This method doesn''t require any parameters.
    The number it returns is a random decimal number between 0 and 1.


    You''ll usually want a random number between 1 and a value. You can do this with
    a general-purpose random number function. Listing 9.2 shows a function that generates
    random numbers between 1 and the parameter you send it.


    # Listing 9.2 A GENERAL-PURPOSE RANDOM NUMBER FUNCTION.


    ```

    1: function rand(num) {

    2:   return Math.floor(Math.random() * num + 1);

    3: }

    ```


    This function multiplies a random number by the value you send it and then converts
    it to an integer between 1 and the number using the Math.floor() method.


    # Working with Dates


    The Date object is a built-in JavaScript object that enables you to work conveniently
    with dates and times. You can create a Date object any time you need to store
    a date and use the Date object''s methods to work with the date.


    You encountered one example of a Date object in Hour 2, “Creating a Simple Script,”
    with the Year 2000 script. The Date object has no properties. To set or obtain
    values from a Date object, you must use the methods described in the next section.


    > JavaScript dates are stored as the number of milliseconds since midnight, January
    1, 1970. This date is called the epoch. Dates before 1970 aren''t allowed. This
    means I can''t store my birthday in a Date object, and there''s a good chance
    you can''t either. Fortunately, your scripts will usually be more concerned with
    the present than the past.


    # Creating a Date Object


    You can create a Date object using the new keyword. You can also optionally specify
    the date to store in the object when you create it. You can use any of the following
    formats:


    ```

    birthday = new Date();

    birthday = new Date("June 20, 1999 08:00:00");

    ```


    ![](img/de79f8d3157260923142f6327cdaf49c_134_0.png)'
