  md: "# Assigning Values to Variables\n\nAs you learned in Hour 2, “Creating a Simple\
    \ Script,” you can use the equal sign to assign a value to a variable. For example,\
    \ this statement assigns the value 40 to the variable:\n\n```\nlines = 40;\n```\n\
    \nYou can use any expression to the right of the equal sign, including other variables.\
    \ You have used this syntax earlier to add one to a variable:\n\n```\nlines =\
    \ lines + 1;\n```\n\nSince incrementing or decrementing variables is quite common,\
    \ JavaScript includes two types of shorthand for this syntax. The first uses the\
    \ += operator:\n\n```\nlines += 1;\n```\n\nSimilarly, you can subtract a number\
    \ from a variable using the -= operator:\n\n```\nlines -= 1;\n```\n\nIf you still\
    \ think that's too much to type, JavaScript also includes the increment and decrement\
    \ operators, ++ and --. This statement adds one to the value of lines:\n\n```\n\
    lines++;\n```\n\nSimilarly, this statement subtracts one from the value of lines:\n\
    \n```\nlines--;\n```\n\nYou can also use the ++ or -- operator before a variable\
    \ name, as in ++lines. However, these are not identical. The difference is when\
    \ the increment or decrement happens: \n\n+   - If the operator is after the variable\
    \ name, the increment or decrement happens after the current expression is evaluated.\n\
    - If the operator is before the variable name, the increment or decrement happens\
    \ before the current expression is evaluated.\n\nThis difference is only an issue\
    \ when you use the variable in an expression and increment or decrement it in\
    \ the same statement. As an example, suppose you have assigned the lines the value\
    \ 40. The following two statements have different effects:\n\n```\nalert(lines++);\n\
    ```\n\n```\nalert(++lines);\n```\n\nThe first statement displays an alert with\
    \ the value 40, and then it increments lines to 41. The second statement first\
    \ increments lines to 41, then displays an alert with the value 41.\n\n![](img/de79f8d3157260923142f6327cdaf49c_84_0.png)"
