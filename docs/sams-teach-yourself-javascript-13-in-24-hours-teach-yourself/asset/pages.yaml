    ![](img/de79f8d3157260923142f6327cdaf49c_215_0.png)


    # Using Dynamic Images in JavaScript


    One of the most useful features of JavaScript is the capability to dynamically
    change images. This means you can create images that “magically” change, which
    could be used for clocks, image rollovers (images that change when you move the
    mouse over them), or simple event animations.


    The images in a Web page are reflected in an array, like form elements. By modifying
    the properties of the array items, you can replace the image with a different
    one. This enables you to dynamically changing content on the page without using
    frames or layers.


    This technique isn''t perfect for all applications. Before you get started, note
    the following-limitations:


    +   - You can only change existing images in the page—you can''t add new ones
    or remove an image entirely.

    - You can replace an image with a larger or smaller image, but this may not look
    good because the text won''t be reformatted to match.

    - Any image you use will have to be loaded from the server. This makes this technique
    impractical for complicated animations or large images.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Working with the images Array


    You can change images dynamically by using the images array. This array contains
    an item for each of the images defined on the page. Each image can also have a
    name. In the object hierarchy, each image is a child of the document object.


    Each image object has the following properties:


    +   - border represents the B attribute of the <IMG> tag. This defines whether
    a border is drawn around a linked image.

    - complete is a flag that tells you the image has been completely loaded. This
    is a Boolean value (true or false).

    - height and width reflect the corresponding image attributes. This is for information
    only: you can''t change an image''s size dynamically.

    - hspace and vspace represent the corresponding image attributes, which define
    the image''s placement on the page. Again, this is a read-only attribute.

    - name is the image''s name. You can define this with the NAME attribute in the
    image definition.

    - lowsrc is the value of the LOWSRC attribute. This is a Netscape-specific attribute
    that enables you to specify a low-resolution image to be loaded before the “real”
    image.

    - src is the image''s source, or URL. You can change this value to change images
    dynamically.


    For most purposes, the src attribute is the only one you''ll use. However, you
    can also change the lowsrc attribute. This defines a low-resolution image to load
    first and will be used only when you change the src attribute.


    The image object has no methods. It has three event handlers you can use:


    +   - The onload event occurs when the image finishes loading. Since the onload
    event for the entire document is triggered when all images have finished loading,
    it''s usually a better choice.

    - The onAbort event occurs if the user aborts the page before the image is loaded.

    - The onError event occurs if the image file is not found or corrupt.'
  merge: -1
  pgno: 216
- img_proc: true
  md: "# Preloading Images\n\nAlthough you can't add an image to the page dynamically,\
    \ you can create an independent image object. This enables you to specify an image\
    \ that will be loaded and placed in the cache, but will not be displayed on the\
    \ page.\n\nThis may sound useless, but it's a great way to work with modem-speed\
    \ connections. Once you've preloaded an image, you can replace any of the images\
    \ on the page with that image—and because it's already cached, the change happens\
    \ instantly.\n\nYou can cache an image by creating a new image object, using the\
    \ new keyword. Here's an example:\n\n```\nImage2 = new Image();\nImage2.src =\
    \ \"arrow1.gif\";\n```\n\n> You learned about the new keyword and its other uses\
    \ for object-oriented programming in Hour 11, \"Creating Custom Objects.\"\n\n\
    ![](img/de79f8d3157260923142f6327cdaf49c_217_0.png)\n\n# Creating Rollovers\n\n\
    The most common use of JavaScript's dynamic image feature is to create rollovers,\
    \ which are images that change when you move the mouse pointer over them.\n\n\
    Rollovers are usually used for images that are links. Using this feature, you\
    \ can highlight the current link with a different color or a border, or even by\
    \ changing the image entirely.\n\nYou can turn an image into a rollover by adding\
    \ an mouseOver event handler that replaces the image with a highlighted version\
    \ and an mouseOut handler that returns the original image. Listing 15.2 shows\
    \ an example that uses four images as rollovers.\n\n# LISTING 15.2 AN EXAMPLE\
    \ OF ROLLOVERS.\n\n```\n1 <HTML>\n2 <HEAD>\n3 <TITLE>Roll Over, Spot. Good Dog.</TITLE>\n\
    4 </HEAD>\n5 <body>\n6 <h1>An Example of Rollovers</h1>\n7 \n8 \n9 <P>\n10 <A\
    \ HREF=\"home.html\"\n11 onmouseover=\"document.images[0].src='home1.gif\";\n\
    12 onmouseOut=\"document.images[0].src='home.gif\";\n13 <IMG src=\"home.gif\"\
    \ width=192 height=44 alt=\"border=\"0\"> *\n```"
