    # Using Objects in Plug-Ins


    You now know how to use the navigator''s properties to detect plug-ins. Thanks

    to LiveConnect, you can also use objects to manipulate plug-ins themselves.


    Each embedded object in a document is represented by an element in the embeds
    array,

    which is a child of the document array. For example, if a document contains a
    single

    embedded object, it is represented by document.embed(0);


    The properties and methods of the embed object depend on the plug-in in use. For
    exam-

    ple, the LiveAudio plug-in includes play and stop methods for controlling audio
    output.

    Some plug-ins may not be scriptable at all.


