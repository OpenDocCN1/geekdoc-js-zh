    # Summary


    In this hour, you''ve used various JavaScript techniques you learned throughout
    this book to improve a Web page''s appearance and user-friendliness.


    In the next hour, you''ll move on to a more complex JavaScript application: a
    shopping cart script that tracks orders from a Web page.


    # Q&A


    +   Q Is there any way to use some kind of “floating hints” or “balloon help”
    with links instead of using the status bar?

    A Not with JavaScript alone. However, you can use Dynamic HTML to achieve this
    effect.

    Q Can the navigation bar in this hour be used with browsers that don''t support
    JavaScript?

    A Yes. You could easily modify it to send the selections to a CGI script, which
    could send the user to the correct page.  This would be slower, but would still
    work.'
