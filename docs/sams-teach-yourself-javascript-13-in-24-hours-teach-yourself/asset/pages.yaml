    if (browser==ie\")\n  document.stylesheets[\\iestyle\"].addRule('H1\",\"color:blue\"\
    );\nif (browser==netscape\")\n  document.tags.h1.color = blue;\n```\n\n# Positionable\
    \ Layers\n\nNetscape and IE also handle positionable elements (layers) differently.\
    \ Netscape stores layer objects under the document object and their style properties\
    \ directly under the layer.\n\nIn IE4, you can refer to layer objects using the\
    \ all object, as in document.all.layer1. You can also refer to them directly within\
    \ the HTML document, as in layer1. The style properties are stored under a style\
    \ object for the layer. For example, this statement makes a layer visible in Netscape:\n\
    \n```\ndocument.layer1.visibility=\"visible\";\n```\n\nIn IE4, this statement\
    \ performs the same function:\n\n```\ndocument.all.layer1.styles.visibility=\"\
    visible\";\n```\n\n# Workshop: Adding Cross-Browser Support\n\nAs an example of\
    \ the techniques you’ve learned in this hour, you can modify the style sheet example\
