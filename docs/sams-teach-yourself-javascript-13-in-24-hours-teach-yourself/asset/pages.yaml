  md: '# HOUR 15


    # Using Graphics and Animation


    One of the most challenging—and rewarding—uses of a programming language is creating
    graphic applications and games. In this hour, you''ll look at some techniques
    you can use for graphic pages—or to add excitement to any Web page.


    Of course, JavaScript is a relatively simple language and this is a relatively
    simple book, so you won''t be learning how to write your own version of Quake
    in JavaScript. Nevertheless, JavaScript can perform some useful features with
    graphics and can even do simple animations.


    In this hour, you''ll learn how to use graphics and animation in JavaScript. You
    will cover the following topics:


    +   * Using image maps with JavaScript

    * How JavaScript uses objects to represent images

    * Creating rollover images

    * Loading images into the cache

    * Creating a simple JavaScript animation


    ![](img/de79f8d3157260923142f6327cdaf49c_212_0.png)'
  merge: -1
  pgno: 212
- img_proc: true
  md: "# Using Image maps with JavaScript\n\nImage maps are a popular way to provide\
    \ navigation for a site. They’re images that are divided into a number of \"hot\
    \ spots,\" or areas that act as links. Using JavaScript, you can perform script\
    \ commands when an area of the image is clicked.\n\n![](img/de79f8d3157260923142f6327cdaf49c_213_0.png)\n\
    \nThere are two types of image maps: client-side and server-side. Client-side\
    \ maps define the linked areas of the image within the HTML document, and thus\
    \ can be used with JavaScript. Server-side maps require a separate map definition\
    \ file and are handled by Web servers.\n\nAs an example of using a client-side\
    \ image map with JavaScript, let’s create a simple image map menu for a fictional\
    \ company. (The company’s name isn’t important, but it’s obviously not a graphic\
    \ design.)\n\nTo create a client-side map, you need to do three things:\n\n+ \
    \  * Use your favorite graphics application to create the actual graphic as a\
    \ GIF or JPEG image. (The sample image used in this example is available at this\
    \ book’s Web site, www.jsworkshop.com.)\n* Create a MAP definition that describes\
    \ the areas in the image.\n* Include the image map in the document, using the\
    \ USEMAP attribute to point to the map definition.\n\nListing 15.1 shows the example\
    \ client-side image map definition.\n\n# LISTING 15.1 USING A CLIENTSIDE IMAGE\
    \ MAP WITH JAVASCRIPT.\n\n```\n<HTML>\n<HEAD>\n<TITLE>Image Map Example</TITLE>\n\
    <SCRIPT LANGUAGE=\"JavaScript\">\nfunction update(text) {\n  document.form1.text1.value\
    \ = text;\n}\n</SCRIPT>\n</HEAD>\n<body>\n<MAP name=\"map1\">\n<AREA SHAPE=RECT\
    \ COORDS=\"14,15,151,87\"\nHREF=\"javascript:update('service');\"\nonMouse=\"\
    window.status='Service Department'; return true;\"\n<AREA SHAPE=RECT COORDS=\"\
    162,16,283,85\"\nHREF=\"javascript:update('sales');\">\n```"
