  md: 'At this point, all five of the images on the page are displaying the mouse.gif
    image and because these are the first five images on the page, the script will
    be able to access them as images[0] through images[4].


    # Defining the Variables


    To begin the actual script, define some global variables. Here is the beginning
    of the script:


    ```

    var cbox=0;

    var nbox=1;

    var cimage=0;

    var nimage=0;

    ```


    The cbox variable will store a value from 0 to 4, indicating which of the five
    images the mouse is currently running. Part of the mouse may protrude into the
    next image, so use the nbox variable to store the position of the right half of
    the mouse, if required.


    The cimage variable will store the value of the image (from 1 to 8) in the current
    box. Similarly, nimage will store the value of the image for the part of the mouse
    that protrudes into the next box, if needed.


    # Stepping Through the Animation


    Next, create the actual animation. You''ll use a function called next to move
    the mouse to its next position and use the setTimeout method to call this function
    regularly.


    The first step in the next function is to increment the image in the current box.
    Here is the function definition and the increment statement:


    ```

    function next() {

    cimage += 1;

    }

    ```


    After incrementing the value of cimage, the script needs to make sure it hasn''t
    gone past 8, because the next part of the script checks for values greater than
    8:


    ```

    if (cimage > 8) {

    cimage = 4;

    document.images[cbox].src = "mouse.gif";

    cbox = (cbox + 1) % 5;

    nbox = (cbox + 1) % 5;

    }

    ```


    If the current image has a value over 8, this code increments the value of cbox
    and assigns nbox to the next value. Both of these statements use the modulo (%)
    operator, which prevents the position from reaching a value greater than 4. Instead,
    the mouse will start over at the left side of the page.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Using Graphics and Animation


    The preceding script also resets cmake to 4. (Because the current box was previously
    the next box, it''s already moved through images 1, 2, and 3.)


    Next, the script needs to calculate the image for the next box, if any:


    ```

    nimage = cimage - 5;

    if (nimage < 0) nimage = 0;

    ```


    The first statement here assigns to five less than cimage. If you look at the
    images in Figure 15.3, you will notice that 6, 7, and 8 match with images 1, 2,
    and 3, respectively, to form a complete mouse. If the subtraction results in a
    negative value, there shouldn''t be a negative value, so assign 0 to nimage.


    Finally, the end of the next function assigns the images indicated by cimage and
    nimage to the locations indicated by cbox and nbox:


    ```

    document.images[cbox].src = "mouse" + cimage + ".gif"

    document.images[nbox].src = "mouse" + nimage + ".gif"

    window.setTimeout(next(), 100);

    ```


    The final statement sets a timeout so that the next function will be called again
    in a tenth of a second. (You can increase or decrease this value to change the
    mouse''s speed.)


    # Putting It All Together


    You have all the components of a working animation script. Listing 15.3 shows
    the complete HTML document and script. The <body> includes an OnLoad event handler
    that calls the next function after a timeout to get the animation started.


    # LISTING 15.3 THE COMPLETE ANIMATION EXAMPLE.


    ```

    <HTML>

    <HEAD>

    <TITLE>Primitive Animation in JavaScript</TITLE>

    <SCRIPT LANGUAGE="JavaScript">

    var cbox=0;

    var nbox=1;

    var cimage=0;

    var nimage=0;


    function next() {

    cimage += 1;

    if (cimage > 8) {

    cimage = 4;

    document.images[cbox].src = "mouse0.gif";

    cbox = (cbox + 1) % 5;

    nbox = (cbox + 1) % 5;

    }

    ```


