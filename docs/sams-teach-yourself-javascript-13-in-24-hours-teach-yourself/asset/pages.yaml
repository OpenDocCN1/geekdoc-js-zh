  md: '# Debugging JavaScript Applications


    Although this looks correct at first glance, there''s a problem here: The function
    and the variable definition use the same name, guess. As a result, the variable
    definition overwrites the function. Thus, when the event handler tries to call
    the function, it finds a variable called guess instead. Sure enough, as the error
    message reported, guess is not a function.


    This is easy to fix. Simply change the name of the function from guess to a unique
    name, guess2! Make the same change in both the function definition (line 7) and
    the event handler (line 36).


    # Testing the Script Again


    Now that you''ve fixed the error, try it again. This time it loads without an
    error, and you can enter a guess without an error. The hints about guessing higher
    or lower are even displayed correctly.


    However, to truly test the script, you''ll need to play the game all the way through.
    When you do, you''ll discover that there''s still another problem in the script:
    You can''t win, no matter how hard you try.


    After your 10 guesses are, an alert message informs you that you''ve lost the
    game. Coincidentally, this alert also tells you what''s wrong with the script.
    Figure 21.3 shows how the browser window looks after a complete game, complete
    with this dialog.


    FIGURE 21.3

    The number guesser script''s display after a game is finished.


    ![](img/de79f8d3157260923142f6327cdaf49c_300_0.png)'
