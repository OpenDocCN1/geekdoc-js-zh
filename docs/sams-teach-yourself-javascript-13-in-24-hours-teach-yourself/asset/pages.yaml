  md: "# Style Sheets\n\nAs you learned in Hour 17. “Working with Style Sheets,” you\
    \ can use JavaScript to dynamically change style sheet properties. Hour 17 used\
    \ the Netscape method: IE uses an entirely different model for style sheet objects.\n\
    \nRather than tags, ids, and classes objects supported by Netscape Navigator,\
    \ IE4 supports the document.all object, which stores all of the tags in the array.\
    \ IE4 also supports the document.stylesheets object, which stores defined styles.\n\
    \nHere is a simple cross-browser example that changes the color of all H1 tags,\
    \ using the browser variable (as defined earlier in this hour) to decide which\
