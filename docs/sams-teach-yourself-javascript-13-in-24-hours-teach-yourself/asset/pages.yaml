  md: '# Creating Custom Objects


    Notice this keyword. You''ll use it any time you create an object definition.
    Use this to refer to the current object—the one that is being created by the function.


    # Defining an Object Method


    Next, you will create a method to work with the Card object. Because all Card
    objects will have the same properties, it might be handy to have a function that
    prints out the properties in a neat format. Let''s call this function PrintCard.


    Your PrintCard function will be used as a method for Card objects, so you don''t
    need to ask for parameters. Instead, you can use this keyword again to refer to
    the current object''s properties. Here is a function definition for the PrintCard()


    ```

    function PrintCard() {

    line1 = "Name: " + this.name + "<BR>\n";nline2 = "Address: " + this.address +
    "<BR>\n";nline3 = "Work Phone: " + this.workphone + "<BR>\n";nline4 = "Home Phone:
    " + this.homephone + "<BR>\n";ndocument.write(line1, line2, line3, line4);

    }

    ```


    This function simply reads the properties from the current object (this), prints
    each one with a caption, and skips to a new line.


    You now have a function that prints a card, but it isn''t officially a method
    of the Card object. The last thing you need to do is make PrintCard part of the
    function definition for Card objects. Here is the modified function definition:


    ```

    function Card(name,address,work,home) {

    this.name = name;

    this.address = address;

    this.workphone = work;

    this.homephone = home;

    this.PrintCard = PrintCard;

    }

