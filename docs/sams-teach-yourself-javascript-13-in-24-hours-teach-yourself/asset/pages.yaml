- img_proc: true
  md: '# Exploring JavaScript''s Capabilities


    Graphics that change when the mouse pointer passes over them are variously known
    as rollovers, mouselovers, or simply "those cool graphics that change when the
    mouse pointer passes over them." Whatever they are, you''ll learn to create them
    in Hour 15, "Using Graphics and Animation."


    JavaScript can also be used to replace images in a sequence, creating a full-scale
    animation. While there are limitations to this approach (you can''t use it to
    create a video game that competes with Quake, for example), it can be an attention-grabbing
    feature.


    For automations, there are more powerful tools than JavaScript. The Java language
    can be used to create faster animations (although not nearly as easily). You can
    also create simple animations as animated GIFs using a graphics program. For more
    complex animations and video clips, you can use plug-ins such as ShockWave and
    QuickTime.


    # Validating Forms


    One of the most powerful features of the Web is the use of interactive forms.
    These forms allow the user to enter information and interact with the site, instead
    of simply looking at the page. This makes everything from order forms to questionnaires
    to entirely customizable pages possible.


    Traditionally, forms are handled by a CGI (Common Gateway Interface) script. This
    script runs on the Web server. When the user enters information on a form and
    presses the Submit button, it is sent to the CGI script for processing. The script
    then sends back a result in the form of another Web page.


    > CGI is not a language, but a standard that allows programs in any language to
    work within a Web server. CGI programs are often written in Perl, or in more traditional
    languages such as C and Visual Basic.


    While CGI is a powerful system, it has disadvantages for some uses of forms. The
    main disadvantage is that submitting the data requires communication with the
    Web server and may take anywhere from a few seconds to a few minutes.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'Often, the CGI script is responsible for validating the form, or making sure
    the appropriate data has been entered. For example, if the user enters only four
    digits in a phone number field or leaves a required field blank, the script could
    alert him and prompt for the missing information.


    While this method of form validation rules, the slow speed can be inconvenient—the
    user may be frustrated when, after waiting ten minutes for a reply from the server,
    he receives a response indicating that he needs to supply missing information
    and start over.


    As you''ve probably guessed by now, JavaScript provides a convenient solution
    to this problem. A JavaScript program can read the data in the form instantly
    (without any communication with the server) and display an error message in an
    alert box. Your script can even move the cursor to the field that contains the
    error.


    ![](img/de79f8d3157260923142f6327cdaf49c_57_0.png)


    In some cases, JavaScript can be used to handle the form submission entirely,
    sending the results via email. The script can also pass the data to a CGI script
    after validating it.


    You can also use JavaScript to automate forms in ways CGI can''t. For example,
    Figure 3.3 shows an order form that uses JavaScript to fill in the subtotals and
    keep a running total as the user enters quantities.


