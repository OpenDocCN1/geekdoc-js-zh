    # Summary


    In this hour, you learned how to debug JavaScript programs. You got some tips
    for producing scripts with a minimum of bugs and learned about some tools that
    will help you find bugs in scripts. Finally, you tried your hand at debugging
    a script.


    Congratulations—you''re nearing the final hours of your JavaScript education.
    In the last three hours, you will use the scripting commands and techniques you''ve
    learned to create some complete applications.


    # Q&A


    +   Can I debug a script using Internet Explorer instead of Netscape?


    +   Yes. In fact, you should test your script in both browsers if possible. Internet
    Explorer displays its error messages immediately when an error happens, and it
    does not include a JavaScript Console or debugger.


    +   Why are some errors displayed after the script runs for a time, while others
    are displayed when the script loads?


    +   The JavaScript interpreter looks at scripts in the body or heading of the
    document, such as function definitions, whereas Event handlers aren''t checked
    until the event happens. Additionally, a statement might look fine when the page
    loads, but will cause an error because of the value of a variable it uses later.


    ![](img/de79f8d3157260923142f6327cdaf49c_302_0.png)'
