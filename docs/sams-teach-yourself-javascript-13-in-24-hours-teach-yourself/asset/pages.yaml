    # Summary


    In this hour, you learned how to use JavaScript to with graphics. JavaScript can
    work with image maps and can be used to create image rollovers and simple animations.


    In the final hour of Part IV, you''ll learn more techniques that are easier in
    creating scripts for the Web: detecting browser versions and creating scripts
    that work on multiple browsers.


    # Q&A


    +   I created an onMouse event handler for rollovers, and it works in Internet
    Explorer but not Netscape. What''s wrong?


    +   This is probably because you used the onun handler in the <IMG> tag. It is
    supported only by Internet Explorer. For Netscape, you need to make the image
    link and use event handlers in the <a> tag. (This will also work in Internet Explorer.)


    +   Can I use rollovers in an image map?


    +   No, you''ll need to replace the entire image map to do this. Usually, it''s
    easier and faster to divide the image map into a number of sections and use those
    as the rollovers.


    +   I need to eliminate an image entirely, rather than changing its source. Is
    there a way to do this?


    +   Not officially; you can''t remove an image. However, you can replace it with
    a blank image of the same size, which should produce the same effect—and a one-color
    GIF is a very small file. Remember, you can''t do anything that would change the
    layout of the text.


    +   I created a JavaScript program on a page with images, and my event handlers
    don''t seem to be working. What''s wrong?


    +   JavaScript requires you to use HEIGHT and WIDTH attributes on all <IMG> tags.
    Adding them will most likely make the event handlers work properly. See Hour 21,
    “Debugging JavaScript Applications,” for other debugging techniques.'
