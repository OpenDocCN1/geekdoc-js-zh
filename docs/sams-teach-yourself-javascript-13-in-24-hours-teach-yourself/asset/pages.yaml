  md: '# Quiz


    +   1. Which two event handlers are used for a rollover?

    a. onMouseOver and onClick

    b. onMouseOver and mouseUnder

    c. onMouseOver and mouseOut


    +   2. Which types of image maps can be used with JavaScript?

    a. Server-side image maps.

    b. Client-side image maps.

    c. Both types.


    +   3. What is the JavaScript object for the second image on a page?

    a. image[2]

    b. images[2]

    c. images[1]


    # Answers


    +   1. You create rollovers with the onMouseOver and mouseOut event handlers.

    2. Client-side image maps can be used with JavaScript.

    3. The second image on a page is represented by images[1].


    # Exercises


    If you want to study JavaScript graphics further, perform these exercises:


