  md: '# Working with Browser Objects


    FIGURE 10.2

    The Back and Forward buttons in Netscape.


    ![](img/de79f8d3157260923142f6327cdaf49c_152_0.png)


    This page allows you to go back/ forward to pages in the history list. These should
    be equivalent to the back and forward arrow buttons in the browser''s toolbar.


    This script is an example of how much JavaScript can do with very little scripting.
    In fact, Listing 10.2 doesn''t use any <SCRIPT> tags at all, and only two JavaScript
