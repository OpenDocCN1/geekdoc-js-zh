    the user''s status.


    # Drawing New Cards


    Next is the Draw function, which is called when the Draw button is clicked. It
    draws more cards from the deck to replace the cards that the user wants to discard
    (those that aren''t set to Hold). Listing 24.7 shows the Draw function.


    # Listing 24.7 THE SCRIPT TO DRAW NEW CARDS.


    ```

    1: //Draw new cards

    2: function Draw() {

    3:   var curcard = 6;

    4:   for (i=1; i<6; i++) {

    5:     if (!held[i]) {

    6:       hand[i] = deck[curcard++];

    7:       document.images[i].src = hand[i].fname;

    8:     }

    9:   }

    10:  dealt = false;

    11:  document.images[11].src="deal.gif";

    12:  score += Addscore();

    13:  document.form.total.value = score;

    14: )

    ```


    Here''s how the Draw function works:


    +   * Line 3 sets a local variable called curcard to indicate the next card to
    be drawn from the deck. Because five cards have already been drawn, it starts
    at number 6.

    * Lines 4–9 are a loop that checks each card''s status in the held array. If the
    card is not held, it is replaced with the next card from the deck and the image
    on the page is updated.

    * Because this is finished, lines 10 and 11 prepare for the next deal. The deal
    variable is set back to false, and the Deal button replaces the Draw button.

    * Lines 12 and 13 call the Addscore function to calculate the score. Unlike the
    Deal function, this time the score is added to the total score and redisplayed.


    # Calculating the Score


    Last not least, the Addscore function calculates the score for the current poker
    hand. The score is one of the following values, loosely based on the odds of different
    hands:'
