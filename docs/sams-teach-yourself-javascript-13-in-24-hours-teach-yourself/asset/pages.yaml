  md: '# Creating an Infinite Loop


    The for and while loops give you quite a bit of control over the loop. In some
    cases, this can cause problems if you''re not careful. For example, look at the
    loop in Listing 8.4.


    Listing 8.4 AN EXAMPLE OF AN INFINITE LOOP


    ```

    1: while (j < 10) {

    2: n++;

    3: values[n] = 0;

    4: }

    ```


    There''s a mistake in this example. The condition of the while loop refers to
    the j variable, but that variable doesn''t actually change during the loop. This
    creates an infinite loop. The loop will continue executing until it is stopped
    by the user, or until it generates an error of some kind.


    Infinite loops can''t always be stopped by the user, except by quitting the browser—and
    some loops won''t prevent the browser from quitting or a crash.


    Obviously, infinite loops are something to avoid. They can also be difficult to
    spot, because JavaScript will give you an error that actually tells you there
    is an infinite loop. Thus, each time you create a loop in a script, you should
    be careful to make sure there''s a way out.


    ![](img/de79f8d3157260923142f6327cdaf49c_120_0.png)


    > Depending on the browser version in use, an infinite loop may even make the
    browser stop responding to the user. Be sure you provide an escape route from
    infinite loops, and save your script before you test it in case.


    Occasionally, you may want to create an infinite loop deliberately. This might
    include situations when you want your program to execute until the user stops
    it, or if you are providing an escape route with the break statement, which is
    introduced in the next section. Here''s an easy way to create an infinite loop:


    ```

    while (true) {

    ```


    Because the value true is the conditional, this loop will always find its condition
    to be true.'
