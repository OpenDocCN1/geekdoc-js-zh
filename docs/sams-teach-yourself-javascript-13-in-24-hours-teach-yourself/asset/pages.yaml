  md: '# Adding Graphic Links


    As an alternative to the drop-down navigation bar, you can use graphics in a navigation
    bar at the top of the page. You''ll use rollovers to change the graphics when
    the mouse moves over them, as described in Hour 15. "Using Graphics and Animation."


    # Creating the Graphics


    To begin creating the rollovers, you will need to create graphics for the links.
    For each one, you''ll need a highlighted and an unhighlighted version. The highlighting
    can be a different color, an added line or circle, or anything you want.


    For this example, I''ve created graphics for the major links: Spreadsheet. Word
    Processor. Database. The highlighted versions of the normal graphics. For simplicity,
    call the standard graphics spread.gif, word.gif, data.gif, and order.gif. The
    highlighted versions will have an added numeral 2, as in order2.gif.


    ![](img/de79f8d3157260923142f6327cdaf49c_311_0.png)


    > When you''re creating graphics for rollovers, remember that the highlighted
    and unhighlighted versions of an image must be the same. Otherwise, the images
    may be distorted or not be replaced correctly.


    # Creating Event Handlers


    Once you''ve created the graphics, you simply need to add the graphic links with
    onMouse and mouseOut event handlers. Listing 22.5 shows the HTML for the graphics,
    including the event handlers.


    # LISTING 22.5 THE ROLLOVER EVENT HANDLERS


    ```

    1: <A HREF="spread.html">

    2: onmouseover="document.images[1].src=''spread2.gif";

    3: onMouseOut="document.images[1].src=''spread.gif";

    4: <IMG BORDER=0 SRC=''spread.gif'' height=28 width=173 />

    5: <A HREF="word.html">

    6: onmouseover="document.images[2].src=''word2.gif";

    7: onMouseOut="document.images[2].src=''word.gif";

