  md: '# Creating a Simple Script


    To modify the script, load the file into your editor again. Since you have already
    calculated the number of seconds, you can use the result, stored in the seconds
    variable to calculate the number of minutes. Add the following lines before the
    final </SCRIPT> tag:


    minutes = seconds / 60;

    minutes = Math.round(minutes);

    document.write("<P>minutes until the year 2000: " + minutes);


    The first statement divides the value by 60 and stores the result in a variable
    called minutes. Next, we use the Math.round function to find the number of minutes.


    The final line uses the document.write statement to display the number of minutes
    left before the year 2000. Since the number of seconds has already been displayed,
    you can use the <P> (paragraph) HTML tag to ensure that your second result is
    displayed on a new line.


    After adding the minutes feature, your script should resemble Listing 2.5. (Be
    sure you fix the error you created in the previous section!) Save the HTML document
    again and reload it in the browser. Figure 2.3 shows Netscape''s display of the
    new and improved script.


    # LISTING 2.5 THE YEAR 2000 SCRIPT WITH THE MINUTES CALCULATION ADDED.


    ```

    1: <HTML>

    2: <HEAD><TITLE>The Year 2000</TITLE></HEAD>

    3: <BODY>

    4: <h1>Countdown to the Year 2000</h1>

    5: <HR>

    6: <SCRIPT LANGUAGE="JavaScript1.1">

    7: now = new Date();

    8: y2k = new Date("Jan 01 2000 00:00:00");

    9: seconds = (y2k - now) / 1000;

    10: seconds = Math.round(seconds);

    11: document.write("Seconds until the year 2000: " + seconds);

    12: minutes = seconds / 60;

    13: minutes = Math.round(minutes);

    14: document.write("<P>Minutes until the year 2000: " + minutes);

