  md: '• clip specifies the clipping rectangle for an item. Only the portion of the
    item inside this rectangle is displayed.


    • overflow indicates whether the clipping rectangle cuts off the item or a scrollbar
    allows viewing the rest of the item. Values include none, clip, and scroll.


    • z-index specifies how items overlap. Normally indexes start with 1 and go up
    each layer added "on top" of the page. By changing this value, you can specify
    which item is on top. You can manipulate this value with JavaScript to provide
    a feature similar to Netscape''s layers.


    • visibility specifies whether an item is visible. Values include visible (default),
    hidden, and inherit. A value of inherit inherits the visibility of any item it
    appears within (such as a table or paragraph).


    • background-color specifies the color for the background of any text in the layer.


    • layer-background-color specifies the background color for the entire layer (whether
    it contains text or not).


    • background-image specifies a background image for any text in the layer.


    • layer-image specifies the background image for the entire layer (whether it
    contains text or not).


    # # Supporting Older Browsers


    As with frames and JavaScript, it''s best to support users of older browsers when
    you can. Netscape includes a <NOLAYER> tag for this purpose. This tag encloses
    a block of HTML tags and will be ignored by layer-capable browsers.


    As a simple example, this HTML code displays a message to users without layer-capable
    browsers:


    ```

    <NOLAYER>

    This page uses layers, which require Netscape 4.0 or IE 4.0.

    Please switch browsers, or link to the <A href="nolayer.html">

    Non-layer version</A> of the page.

    </NOLAYER>

    ```


