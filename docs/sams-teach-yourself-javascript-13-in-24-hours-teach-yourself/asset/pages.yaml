- img_proc: true
  md: '# 48


    # Hour 4


    Functions can have more than one parameter. To define a function with multiple
    parameters, list a variable name for each parameter, separated by commas. To call
    the function, specify values for each parameter, separated by commas.


    Listing 4.4 shows a complete HTML document that includes the function definition
    and a second script in the body of the page that actually calls the function.
    To demonstrate the usefulness of functions, we will call it to greet two different
    people.


    # Listing 4.4 THE COMPLETE FUNCTION EXAMPLE.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE></TITLE>

    4: <SCRIPT LANGUAGE="JavaScript">

    5: function greet(who) {

    6: alert("Greetings, " + who);

    7: }

    8: </SCRIPT>

    9: <HEAD>

    10: <body>

    11: <h1>Function Example</h1>

    12: <P>Prepare to be greeted twice.</P>

    13: <SCRIPT LANGUAGE="JavaScript">

    14: greet(''Fred'');

    15: greet(''Ethel'');

    16: </SCRIPT>

    17: </body>

    18: </html>

    ```


    This listing includes a second set of <SCRIPT> tags in the body of the page. The
    second script includes two function calls to the Greet function, each with a different
