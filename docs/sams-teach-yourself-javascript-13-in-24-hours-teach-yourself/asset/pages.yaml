    # # Workshop: Using Comments


    You have now used HTML comments to hide your script from browsers. JavaScript
    also

    includes its own type of comments. While these will not hide JavaScript from browsers,

    they are useful for their intended purpose: including comments in your script.


    Comments allow you to include documentation within your script. This will be useful
    if

    some else tries to understand the script, or even if you try to understand it
    after a long

    break. To include comments in a JavaScript program, begin a line with two slashes,
    as in

    this example:


    ```

    //this is a comment.

    ```


    You can also begin a comment in the middle of a line, which is useful for documenting
    a

    script. For example:


    ```

    a = a + 1; // add one to the value of a

    ```


    JavaScript also supports C-style comments, which begin with /* and end with */.
    These

    comments can extend across more than one line, as the following example demonstrates.


    ```

    /*This script includes a variety

    of features, including this comment. */

    ```


    ![](img/de79f8d3157260923142f6327cdaf49c_75_0.png)


    | Since these comments are part of JavaScript syntax, they are only valid inside

    <SCRIPT> tags |'
