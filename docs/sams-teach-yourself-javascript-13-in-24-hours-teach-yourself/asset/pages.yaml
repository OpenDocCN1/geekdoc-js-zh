  md: '# 1


    # # Understanding JavaScript


    The World Wide Web (WWW) began as a text-only medium—the first version of the
    HTML specification didn''t even have the capability to include graphics on a page.
    Although it''s still not quite ready to give television a run for its money, the
    Web has come a long way.


    Today''s Web sites can include a wealth of features: graphics, sounds, animation,
    and sometimes even useful content. Web scripting languages, such as JavaScript,
    are one of the easiest ways to spice up a Web page and to interact with users
    in new ways.


    The first hour of this book introduces the concept of Web scripting and the JavaScript
    language. It also describes how JavaScript, Java, and other Web languages fit
    into the scheme of things. The following topics will be covered in this hour:


    +   - Web scripting is, and what it''s good for

    - How scripting and programming are different (and similar)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Learning Web Scripting Basics


    +   * What JavaScript is

    * The differences between JavaScript and Java

    * How to include JavaScript commands in a Web page

    * How different Web browsers handle JavaScript

    * Choosing between JavaScript and alternative languages


    In the world of science fiction movies (and many other movies that have no excuse),
    computers are often obeying commands in English. While this may indeed happen
    in the near future, computers currently find it easier to understand languages
    like BASIC, C, and Java.


    If you know how to use HTML to create a Web document, you have already worked
    with one computer language. You use HTML tags to describe how you want your document
    formatted, and the browser obeys your commands and shows the formatted document
    to the user.


    Since HTML is a simple markup language, it can’t respond to the user, make decisions,
    or automate repetitive tasks. Interactive tasks like these require a more complex
    language: a programming language, or a scripting language.


    While many programming languages are complex, scripting languages are generally
    simple. They have a simple syntax, perform tasks with a minimum of commands, and
    are easy to learn. Web scripting languages allow you to combine scripting with
    HTML to create interactive web pages.


    # Scripts and Programs


    A movie or play follows a script—a list of actions (or lines) for the actors to
    perform. A Web script provides the same type of instructions for the browser.
    A script in JavaScript can range from a single line to a full-scale application.
    In either case, JavaScript programs always run within a browser or other JavaScript-enabled
    applications.


    Some programming languages must be compiled, or translated into machine code,
    before they can be executed. JavaScript, on the other hand, is an interpreted
    language: the browser executes each line of script as it comes to it.


    There is one main advantage to interpreted languages: Writing and changing a script
    is very simple. Changing a JavaScript script is as easy as changing a typical
    HTML document, and the change is enacted as soon as you reload the document in
    the browser.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Understanding JavaScript


    So what''s the difference between scripting and programming? It depends on who
    you ask. We''ll refer to scripting throughout this book, but feel free to include
    JavaScript Programming on your resume after-you''ve finished this book.


    # Introducing JavaScript


    JavaScript was developed by Netscape Communications Corporation, the makers of
    the popular Netscape Navigator Web browser. JavaScript was the first Web scripting
    language to be introduced, and it is by far the most popular.


    JavaScript was originally called LiveScript and was first introduced in Netscape
    Navigator 2.0 in 1995. It was later renamed JavaScript to indicate its relationship
    with Java.


    JavaScript is almost as easy as HTML., and it can be included directly in HTML
    documents. Here are a few of the things you can do with JavaScript:


    +   - Add scrolling or changing messages to the browser''s status line.

    - Validate the contents of a form and make calculations. (For example, an order
    form can automatically display a running total as you enter item quantities.)

    - Display messages to the user, either as part of a Web page or in alert boxes.

    - Animate images or create images that change when you move the mouse over them.

    - Detect the browser in use and display different content for different browsers.

    - Detect installed plug-ins and notify the user if a plug-in is required.


    This is just a quick sample of what JavaScript can do. You can do much more with
    JavaScript, including creating entire applications. We''ll explore the uses of
    JavaScript throughout this book.


    # JavaScript vs. Java


    Before we delve into JavaScript, let''s take a quick look at its namesake, Java.
    Java is a programming language developed by Sun Microsystems that can be used
    to create applets, or programs that execute within a Web page.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Java is also a densely populated island in Indonesia and a slang term for coffee.
    This has resulted in a widespread invasion of coffee-related terms in computer
    literature, such as the title of this note.


    Java is a compiled language, but the compiler produces code for a virtual machine
    rather than a real computer. The virtual machine code is then interpreted by a
    Web browser. This allows the same Java applet to execute the same way on PCs,
    Macintoshes, and UNIX machines, and on different browsers—at least in theory.


    At this point, we need to make one thing clear: Java is a fine language, but you
    won''t be learning it in this book. Although their names and some of their commands
    are similar, JavaScript and Java are entirely different languages. Here are a
    few of the most glaring differences:


    +   - Java applets are compiled into class files to be used on a Web page; JavaScript
    uses simple text commands, which can be included in the HTML document itself.

    - Java applets are generally displayed in a box within the Web document; JavaScript
    scripts can affect any part of the Web document itself.

    - While JavaScript is best suited to simple applications and adding interactive
    features to Web pages, Java can be used for incredibly complex applications. For
    example, Core''s WordPerfect word processing suite is available in a Java version:
    a project JavaScript couldn''t handle.


    There are many other differences (and a similarity or two), but the important
    thing to remember is that JavaScript and Java are separate languages. They''re
    both useful for different things; in fact, they can be used together to combine
    their advantages.


    # # How JavaScript Fits into a Web Page


    As you hopefully already know, HTML (Hypertext Markup Language) is the language
    you use to create documents. To refresh your memory, Listing 1.1 shows a short
    but sadly typical web document.


    Listing 1.1 A SIMPLE HTML DOCUMENT.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE>Our Home Page</TITLE>

    4: </HEAD>

    5: <body>

    ```'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Understanding JavaScript


    ```

    6: <h1>The American Eggplant Society</h1>

    7: <p>Welcome to our Web page. Unfortunately,

    8: it''s still under construction.</p>

    9: </body>

    10: </HTML>

    ```


    This document consists of a header within the <HEAD> tags and the body of the
    page within the <BODY> tags. To add JavaScript to a page, you''ll use a similar
    tag: <SCRIPT>.


    The <SCRIPT> tag tells the browser to start treating the text as a script, and
    the </SCRIPT> tag returns to the regularly scheduled HTML. In most cases, you
    can''t use JavaScript statements except within <SCRIPT> tags. The exception is
    event handlers, described in this chapter.


    Using the <SCRIPT> tag, we can add a short script (in this case, just one line)
    to the Web document, as shown in Listing 1.2. If you try this or other examples
    in this book yourself, don''t type the line numbers—they''re for your convenience
    in referring to the script.


    > If you want to try this example in a browser but don''t want to type it, the
    HTML document is available on this book''s Web site, http://www.javascriptshop.com/
    (as all of the other listings).


    # Listing 1.2 A SIMPLE HTML DOCUMENT WITH A SIMPLE SCRIPT.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE>Our Home Page</TITLE>

    4: </HEAD>

    5: <BODY>

    6: <h1>The American Eggplant Society</h1>

    7: <p>Welcome to our Web page. Unfortunately,

    8: it''s still under construction.

    9: We last worked on it this date:</p>

    10: <SCRIPT LANGUAGE="JavaScript">

    11: document.write(document.lastModified);

    12: </SCRIPT>

    13: </BODY>

    14: </HTML>

    ```


    The document.write statement, which you''ll learn more about later, sends out
    as part of the Web document. In this case, it displays the modification date of
    the document.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '> Notice that the <SCRIPT> tag in Listing 1.2 includes a parameter: Language="JavaScript".
    This specifies the scripting language to the browser. You can also specify a JavaScript
    version, as you''ll learn later in the hour.


    In this example, we placed the script within the body of the HTML document. There
    are actually four different places where you might use scripts:


    +   - In the body of the page. In this case, the output of the script is displayed
    as part of the HTML document when the browser loads the page.

    - In the header of the page, between the <HEAD> tag. Scripts in the header aren''t
    executed immediately, but can be referred to by other scripts. The header is often
    used for functions—groups of JavaScript statements that can be used as a group.

    - Within an HTML tag. This is called an event handler and allows the script to
    work with HTML elements. Event handlers are the one type of script you don''t
    need to use the <SCRIPT> tag. You''ll learn more about event handlers in Hour
    4. supports supports use of files with the .js extension containing scripts; these
    can be included by specifying a file in the <SCRIPT> tag. This feature works only
    in Netscape Navigator 3.0 or later and Internet Explorer 4.0 or later.


    # # Browsers and JavaScript


    Like HTML, JavaScript requires a browser to be displayed, and different browsers
    may display it differently. Unlike HTML, the results of browser incompatibility
    with JavaScript are more drastic: Rather than simply displaying your text incorrectly,
    the script may not execute at all, may display an error message, or may even crash
    the browser.


    We''ll take a quick look at the different browsers (and different versions of
    the same browser) treat JavaScript in the following sections.


    # # Netscape and Internet Explorer


    Today''s Web is dominated by two popular Web browsers: Netscape Navigator and
    Microsoft Internet Explorer. Netscape has traditionally been the more popular
    of the two, but Internet Explorer has has quickly caught up, particularly with
    its inclusion in Microsoft Windows 98.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Understanding JavaScript


    Both of these browsers include some support for JavaScript. However, since the
    JavaScript language was developed by Netscape, the newest features of the language
    are supported only under Netscape Navigator. Internet Explorer does support the
    basic JavaScript commands, and newer versions may implement all of the new features.


    > Since this book is about JavaScript 1.3, the latest and greatest version, you
    should definitely have a copy of the latest version of Netscape (version 4.5 or
    later) to try the examples. However, most of the scripts in this book will work
    with Netscape 4.0 and with Internet Explorer 4.0 or later.


    # Versions of JavaScript


    The JavaScript language has evolved since its original release in Netscape 2.0.
    There have been four versions of JavaScript:


    +   - JavaScript 1.0, the original version, is supported by Netscape 2.0 and Internet
    Explorer 3.0.

    - JavaScript 1.1 is supported by Netscape 3.0 and mostly supported by Internet
    Explorer 4.0.

    - JavaScript 1.2 is supported by Netscape 4.0, and partially supported by Internet
    Explorer 4.0.

    - JavaScript 1.3 is supported by Netscape 4.5.


    Each of these versions is an improvement over the previous version and includes
    a number of new features. Browsers that support the new version also support scripts
    written for earlier versions.


    As mentioned earlier in this hour, the <SCRIPT> tag can specify a JavaScript version.
    One use for this feature is to prevent older browsers from accessing the script.
    If you specifically refer to JavaScript 1.3. Netscape 4.0 and earlier and IE4
    and earlier will ignore the script.


    The JavaScript language has been submitted to the ECMA, a European standards committee.
    This committee has finalized the ECMA-262 specification, a standard for the language.
    The standardized version of the language is sometimes referred to as ECMAScript,
    JavaScript 1.3 follows the ECMA-262 standard.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Alternatives to JavaScript


    JavaScript is not the only language used on the Web, and in some cases, it may
    not be the right tool for the job. Java, described earlier in this hour, can do
    some things better than JavaScript. In the following sections, we''ll look at
    a few other commonly Web languages and their advantages.


    # VBScript


    VBScript, sometimes known as Visual Basic Scripting Edition, is Microsoft''s answer
    to JavaScript. Just as JavaScript''s syntax is loosely based on Java, VBScript''s
    syntax is loosely based on Microsoft Visual Basic, a popular programming language
    for Windows machines.


    Like JavaScript, VBScript is a simple scripting language, and you can include
    VBScript statements within an HTML document. To begin a VBScript script, you use
    the <SCRIPT LANGUAGE="VBScript"> tag.


    VBScript can do many of the same things as JavaScript, and it even looks similar
    in some cases. It has two main advantages:


    +   - For those who already know Visual Basic, it may be easier to learn than
    JavaScript.

    - It is closely integrated with ActiveX, Microsoft''s standard for Web-embedded
    applications.


    VBScript''s main disadvantage is that it is supported only by Microsoft Internet
    Explorer. JavaScript, on the other hand, is supported by both Netscape and Internet
    Explorer to some degree. JavaScript is also also a much more popular language,
    and you can see it in use all over the Web.


    # CGI


    CGI (Common Gateway Interface) is not really a language, but a specification that
    allows programs to run on Web servers. CGI programs can be written in a number
    of languages, including Perl, C, and Visual Basic.


    > Another language you may hear of is JavaScript. This is how Microsoft refers
    to its implementation of JavaScript, which is partially compatible with the Netscape
    version.


    ![](img/de79f8d3157260923142f6327cdaf49c_33_0.png)'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Understanding JavaScript


    CGI programs are heavily used on the Web. If you''ve ever typed information into
    a form and pressed a button to send it to a Web site, chances the data was sent
    to a CGI application.


    The main difference between CGI and JavaScript is that CGI executes on the server,
    while JavaScript applications execute on the client (the Web browser). The main
    disadvantage of CGI is, since the data must be sent to the Web server and back,
    response time may be slow.


    On the other hand, CGI can do things JavaScript can''t. It can read and write
    files on the server. While a client-side JavaScript program can read information
    from a form and manipulate it, it can''t store the data in any permanent format.
    However, a server-side version of JavaScript is available and does not have this
    limitation.


    # ActiveX


    ActiveX is a specification developed by Microsoft that allows ordinary Windows
    programs to be run within a Web page. ActiveX programs can be written in languages
    such as Visual C++ and Visual Basic, and they are compiled before being placed
    on the Web server.


    ActiveX applications, like controls, are downloaded and executed by the Web browser.
    Like Java applets. Unlike Java applets, controls can be installed permanently
    when they are downloaded, eliminating the need to download them again.


    ActiveX''s main advantage is that it can do just about anything. This can also
    be a disadvantage: Several enterprising programmers have already used ActiveX
    to bring new capabilities to Web pages, such as "the Web page that turns off your
    computer" and "the Web page that forms your disk drive."


    Fortunately, ActiveX includes a signature feature that identifies the source of
    the control and prevents controls from being modified. While this won''t prevent
    a control from damaging your system, you can specify which sources of controls
    you trust.


    ActiveX has two disadvantages. First, it isn''t as easy to program as a scripting
    language or Java. Second, ActiveX is proprietary: It works only in Microsoft Internet
    Explorer, and only under Windows platforms.


    ![](img/de79f8d3157260923142f6327cdaf49c_34_0.png)


    Along with VBScript, JavaScript applications can be used to work with ActiveX
