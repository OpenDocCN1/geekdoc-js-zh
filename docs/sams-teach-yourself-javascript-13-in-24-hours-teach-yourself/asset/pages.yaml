  md: '# Tools for Scripting


    Unlike many programming languages, you won''t need any special software to create
    JavaScript scripts. In fact, you probably already have everything you need.


    The first thing you''ll need to work with JavaScript is an editor, JavaScript
    scripts are stored in simple text files, usually as part of HTML documents. Any
    editor that can store ASCII text files will work.


    You can choose from a wide range of editors, from simple text editors to word
    processors. If you don''t have a favorite editor already, a simple editor is most
    likely included with your computer. For Windows computers, the Notepad accessory
    will work just fine.


    ![](img/de79f8d3157260923142f6327cdaf49c_39_0.png)


    > If you use a word processor to create JavaScript programs, be sure you save
    the files as ASCII text rather than as word processing documents.


    A variety of dedicated HTML editors are also available and will work with JavaScript.
    In fact, many include features specifically for JavaScript—for example, coloring
    the various JavaScript statements to indicate their purposes, or even creating
    simple scripts automatically.


    For Windows computers, here are a few recommended editors:


    +   - **Homesite**—An excellent HTML editor that includes JavaScript support.

    - **Microsoft FrontPage 2000**—Microsoft''s visual HTML editor. The Script Builder
    component allows you to easily create simple scripts.

    - **NetObjectsBuilder**—A script-oriented editor that simplifies the process of
    writing scripts.

    - **EditPad**—A simple text editor that includes a number of features missing
    from Notepad.


    For the Macintosh, BBEdit, BBEdit Lite, and Alpha are good HTML editors that you
    can use to create Web pages and scripts.


    ![](img/de79f8d3157260923142f6327cdaf49c_39_1.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Creating a Simple Script


    You''ll need two other things to work with JavaScript: a Web browser and a computer
    to run it on. Since this book deals with JavaScript 1.3, I recommend that you
    use the latest version of Netscape Navigator. Netscape is available for Windows,
    Macintosh, and UNIX platforms. See Netscape''s Web page to download a copy:


    ```

    http://www.netscape.com/

    ```


    ![](img/de79f8d3157260923142f6327cdaf49c_40_0.png)


    > If you plan on making your script available over the Internet, you''ll also
    need a Web server, or access to one. However, you can use all of the JavaScript
    examples in this book directly from your computer''s hard disk.


    # Counting Down to the Year 2000


    If you''ve watched the news recently, chances you''ve heard something about the
    year 2000 and the problems it presents for computer systems: Since many system
    designers and programmers weren''t thinking far enough ahead, they used only two
    digits to store dates.


    The result of this is that on the first day of the year 2000, any software that
    is still using two-digit dates will wake up convinced that the current year is
    1900. Depending on who you ask, this could cause problems ranging from minor billing
    errors to the decline of modern civilization.


    How close is the year 2000? Whether you''re expecting the end of the world or
    just expecting to work lots of overtime, you''re probably curious as to how long
    we have until the big day.


    As a simple example of scripting, you can create a JavaScript program that calculates
    the time remaining until the year 2000. Since computers are known for their precision,
    you''ll start by calculating the time in seconds.


    # Beginning the Script


    Your script, like most JavaScript programs, begins with the HTML <SCRIPT> tag.
    As you learned in Hour 1, you use the <SCRIPT> and </SCRIPT> tags to enclose a
    script within the HTML document.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Remember not to include anything valid JavaScript statements between the starting
    and ending <SCRIPT> tags. If the browser finds any HTML tags that aren''t explicitly
    part of the script within the <SCRIPT> tags, it will display a JavaScript error
    message.


    To begin creating the script, open your favorite text editor and type the beginning
    and ending <SCRIPT> tags, as shown in Listing 2.1. (This listing and others in
    this book include lines for reference; be sure to type the script without the
    line numbers.)


    # Listing 2.1 THE FRAMEWORK FOR A JAVASCRIPT SCRIPT.


    ```

    1: <SCRIPT LANGUAGE="JavaScript1.1">

    2: </SCRIPT>

    ```


    Since the script is going to use some features that were not available in JavaScript
    1.0, we specify JavaScript 1.1 in the <SCRIPT> tag. This script will work in Netscape
    3.0 and later.


    # Adding JavaScript Statements


    If you were asked to calculate on your own the number of seconds left until the
    year 2000, you''d probably start by determining the number of days and hours left,
    then then do some math to convert your result to the number of seconds.


    For your first JavaScript program, you will be working in the opposite direction.
    JavaScript stores dates in milliseconds (thousands of a second), so you''ll start
    with the number of milliseconds, then convert it to seconds.


    Actually, JavaScript stores dates as the number of milliseconds since January
    1, 1970. This means that if you travel back in time, you may not be able to use
    the script you''re writing here. (This will probably be the least of your worries.)


    # Storing Data in Variables


    To begin the script, you will use a variable to store the current date and another
    one to represent the beginning of the year 2000. You will learn more about variables
    in Hour 5, "Using and Storing Values." For now, think of them as containers that
    can hold some information (a number, or in this case, a date).'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Creating a Simple Script


    To start writing the script, add the following lines after the first <SCRIPT>
    tag. Be sure to use the same combination of capital and lowercase letters in your
    version, since JavaScript is case sensitive in some instances.


    ```

    now = new Date();

    y2k = new Date("Jan 01 2000 00:00:00");

    ```


    Each of these statements assigns a value (a date) to a variable. The first statement
    creates a variable called now and stores the current date in time. The second
    statement creates a variable called y2k and stores the first moment of the year
    2000 in it.


    Both of these statements use JavaScript''s built-in Date object, which allows
    you to conveniently handle dates. You''ll learn more about working with dates
    in Hour 9: "Using Built-In Objects."


    ![](img/de79f8d3157260923142f6327cdaf49c_42_0.png)


    > Notice the semicolons at the end of each of the above statements. These tell
    the browser that it has reached the end of a statement. You can actually omit
    the semicolons, but we will use them throughout this book for clarity.


    # Calculating the Result


    As I mentioned earlier, JavaScript stores dates in milliseconds; therefore, we
    now have two variables containing number of milliseconds. To calculate the time
    remaining until the year 2000, you can simply subtract today''s date from the
    future date:


    ```

    y2k - now

    ```


    Of course, this would tell you the number of milliseconds until the year 2000.
    To work in more human terms, your script can convert the value to seconds. Insert
    a line in your editor before the </SCRIPT> tag and add this statement:


    ```

    seconds = (y2k - now) / 1000;

    ```


    This statement tells the computer to create a third variable called seconds. To
    calculate this number, divide the number of milliseconds by 1000.


    > Notice the parentheses in the last statement. These ensure that the subtraction
    happens before the division. JavaScript has certain rules about which math operations
    are performed first, and in this case the division would be first without the
    parentheses. These rules are called operator precedence. Hour 5 takes a closer
    look at these rules.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Creating Output


    You now have a variable, seconds, that contains the number of seconds until the
    year 2000. Of course, this variable doesn''t do us much good unless we can read
    it. JavaScript includes a number of ways of displaying information, and one of
    the simplest is the document.write statement.


    The document.write statement displays text, a number, or anything else you throw
    at it. Since your JavaScript program will be used within a Web page, the output
    will be displayed as part of the page. To display the result, add this statement
    before the final </SCRIPT> tag:


    ```

    document.write("Seconds until the year 2000: " + seconds);

    ```


    This statement tells the browser to add some text to the Web page containing your
    script. The output will include a bit of text explaining the result, by the contents
    of the seconds variable.


    > Notice the plus (+) between the text message and the seconds variable. In this
    case, it tells the browser to combine the two values into one string of text.
    If you use the plus sign between two numbers, they are added together.


    ![](img/de79f8d3157260923142f6327cdaf49c_43_0.png)


    # Adding the Script to a Web Page


    You should now have a complete script that calculates a result and displays it.
    Your listing should match Listing 2.2. In case you''re still a bit confused, Listing
    2.3 is a line-by-line breakdown of the script with an explanation for each statement.


    LISTING 2.2 THE YEAR 2000 SCRIPT.


    ```

    1: <SCRIPT LANGUAGE="JavaScript.1">

    2: now = new Date();

    3: y2k = new Date("Jan 01 2000 00:00:00");

    4: seconds = (y2k - now) / 1000;

    5: document.write("Seconds until the year 2000: " + seconds);

    6: </SCRIPT>

    ```'
  merge: -1
