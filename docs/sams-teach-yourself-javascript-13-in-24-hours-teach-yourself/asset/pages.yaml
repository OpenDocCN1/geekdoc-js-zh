  md: '# HOUR 12


    # Responding to Events


    You''ve nearly reached the halfway point in your 24-hour study of JavaScript.
    So far, most of the scripts you''ve written have executed in a calm, orderly,
    fashion, moving from the first statement to the last.


    In this hour, you''ll learn to use the wide variety of event handlers supported
    by JavaScript. Rather than executing in order, scripts using event handlers can
    interact directly with the user. You''ll use event handlers in just about every
    script you write in the last 12 hours of this book.


    Hour 12 covers the following topics:


    +   * How event handlers work

    * How event handlers relate to objects

    * Creating an event handler

    * Testing an event handler

    * Detecting mouse actions

    * Detecting keyboard actions

    * Intercepting events with a special handler

    * Adding friendly link descriptions to a Web page


    ![](img/de79f8d3157260923142f6327cdaf49c_166_0.png)'
