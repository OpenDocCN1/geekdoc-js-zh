  md: '# HOUR 23


    # Creating a Shopping Cart Script


    In Hour 22, “Improving a Web Page with JavaScript,” you used simple JavaScript
    techniques to add features to a Web page. In the last two hours of this book,
    you''ll create some more complex applications with JavaScript.


    In this hour, you will create a shopping cart and order form using JavaScript.


    Hour 23 covers the following topics:


    +   - Planning the shopping cart script

    - Creating a frameset

    - Choosing variables for data storage

    - Writing the script functions

    - Submitting the order


    ![](img/de79f8d3157260923142f6327cdaf49c_318_0.png)'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Planning the Script


    In the last year or so. Internet shopping has gone from something done only by
    computer junkies to a popular pastime. Web sites that offer products for sale
    typically use a shopping cart, which keeps track of the items ordered and offers
    a way to finalize the order.


    Many shopping carts are created with CGI or Java programs, but you can create
    a perfectly good one using JavaScript. First, you will need to plan the layout
    of the Web page and the variables and objects that the shopping cart will use
    to store data.


    ![](img/de79f8d3157260923142f6327cdaf49c_319_0.png)


    | Security is an important consideration in any online ordering system. The shopping
    cart you will create in this hour is not secure, although it could be used with
    a secure server to ensure that all orders are valid. |


    # Creating the Frameset Document


    One popular way to implement a shopping cart uses frames. You will divide your
    Web page into two columns: a small shopping cart frame on the left and a frame
    with a list of products that can be ordered on the right. Listing 23.1 shows the
    frameset document to implement this.


    LISTING 23.1 THE FRAMESET FOR THE SHOPPING CART.


    ```

    1: <HTML>

    2: <FRAME COLS="20%,80%">

    3: <FRAME NAME="cart" SRC="about:blank">

    4: <FRAME NAME="products" SRC="products.html">

    5: </FRAMESET>

    6: </HTML>

    ```


    Notice that there is no HTML document for the shopping cart frame (line 3). This
    is because you will create that frame''s document dynamically with a script, which
    will enable the frame to display an updated list of products in the cart.


    The products.html document will be the focus of most of this hour. This document
    will include the scripts for displaying and managing the shopping cart. The body
    of the document will include product descriptions and links for ordering products.
    Here is a typical


    ```

    <A HREF="javascript:additem(''WP 97, 399.95,1);">

    <B>ORDER NOW</B></A>

    ```'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Creating a Shopping Cart Script


    This link calls a JavaScript function called additem and sends a product description,
    price, and quantity. You will create the additem script later in this hour.


    I''ve included sample product descriptions and links in the HTML document (presented
    this hour) for products offered by FSC, the ill-fated software company introduced
    in Hour 22. However, this script could easily be used for any products you want
    to sell.


    # Choosing Variables


    Next, you should plan how the shopping cart will store data. Because you will
    be dealing with ordered items, each with its own price, description, and quantity,
    an object will be helpful.

    The script will use a simple object called Item that stores the description, quantity,
    and price as properties of the object. You will use an array, items, to store
    an Item object for each item in the shopping cart.


    Listing 23.2 shows the object definition function for the Item object, as well
    as variable declarations for the array and counter, numitems, to track the number
    of items in the cart.


    LISTING 23.2 VARIABLE DEFINITIONS FOR THE SHOPPING CART.


    ```

    1: var items = new Array(10);

    2: var numitems = 0;

    3: function Item(d,c,q) {

    4: this.desc = d;

    5: this.price = c;

    6: this.quantity = q;

    7: }

    ```


    # Creating Script Functions


    Now that you''ve laid out the frames, HTML documents, and variables, you can begin
    scripting in earnest. The shopping cart will be managed by several JavaScript
    functions:


    +   * A function to add an item to the cart

    * A function to display the list of items in the shopping cart frame

    * A function to update the cart list if an item''s quantity is changed

    * A function to complete the order'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# # Adding Items to the Cart


    The additem function adds a single item to the cart. This is the script that will
    be referred to by the links on the product description page. Listing 23.3 shows
    the additem function.


    LISTING 23.3 THE FUNCTION TO ADD AN ITEM TO THE CART.


    ```

    1: function additem(desc,price,quantity) {

    2:   items[++numitems] = new Item(desc,price,quantity);

    3:   displaycart();

    4: }

    ```


    This function accepts the description, price, and quantity as parameters from
    the link.

    Line 2 creates a new Item object, assigns it to the next element of the items
    array, and increments the numitems counter. As its last action, this script calls
    the displaycart function.


    # # Listing the Items


    The next script you''ll need is displaycart, which displays the list of items
    in the shopping cart frame. This function is called by the additem function. Additionally,
    it will be used when the page is first loaded and when the user changes an item''s
    quantity.


    LISTING 23.4 THE SCRIPT TO DISPLAY THE CART''S CONTENTS.


    ```

    1: function displaycart() {

    2:   var totalcost=;

    3:   with (parent.cart.document) {

    4:     open();

    5:     write("<HTML><body>");

    6:     write("<h1>Shopping Cart</H1><HR>");

    7:     if (numitems==0) {

    8:       write("No items ordered.");

    9:       close();

    10:      return;

    11:    }


    12:     write("<TABLE BORDER=1 FORM NAME=''1''>");

    13:     for(i=1;i<numitems;i++) {

    14:       write("<TR><td>");

    15:       write("<INPUT NAME=''qty'' TYPE=''TEXT'' SIZE=2 VALUE=");

    16:       write(items[i].quantity + ">");

    17:       write("<td>" + items[i].desc + "</td>");

    18:       write("<td>" + items[i].price + "</td>");

    19:       write("<td>" + [items[i].price * items[i].quantity] + "</td>");

    ```'
