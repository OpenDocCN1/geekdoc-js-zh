  md: '# Using External Style Sheets


    The preceding example only changes a few aspects of the HTML document''s appearance,
    but it adds about 10 lines to its length. If you were trying to make a very stylish
    page and had defined new styles for all of the attributes, you would end up with
    a very long and complicated document.


    For this reason, you can use a CSS style sheet from a separate file in your document.
    This makes your document short and to the point. More importantly, it allows you
    to define a single style sheet and use it to control the appearance of all of
    the pages on your site.


    To define an external style sheet, place the commands you would normally use between
    the <STYLE> tags in a separate file. You can then refer to it using the <LINK>
    tag in the header of one or more documents:


    ```

    <LINK REL="STYLESHEET TYPE="text/css" HREF="style.css">

    ```


    This tag refers to an external CSS-type style sheet stored in the style.css.


    # Using JavaScript Style Sheets


    Netscape also supports an alternate type of style syntax called JavaScript style
    sheets, or JSS. For the most part, JSS style sheets can use the same CSS style
    sheets, but they use a JavaScript-based syntax. This type of style sheet is not
    supported by Internet Explorer.


    To begin a JSS style sheet, use this tag:


    ```

    <STYLE TYPE="text/javascript">

    ```


    Within the <STYLE> tags, you specify each element as an object. Netscape supports
    three basic objects: tags, which includes all of the HTML tags, classes, which
    includes you define, and ids, which includes ID codes for individual elements.
    All of these are children of the document object.


    To change the style for an HTML tag using JavaScript syntax, you specify the tag
    as an object. For example, the following statement changes the color of H1 headings
    to blue:


    ```

    document.tags.H1.color = "blue";

    ```'
