  md: '# Summary


    In this hour, you''ve learned to use events to detect mouse actions, keyboard
    actions, and other events, such as the loading of the page. You can use event
    handlers to perform a simple JavaScript statement when an event occurs, or to
    call a more complicated function.


    Congratulations! You''re halfway through your 24-hour tour of JavaScript. In the
    next few chapters, you''ll move on to some more advanced methods of working with
    Web pages—for example, you''ll learn how to use frames, forms, and how to make
    scripts that detect the user''s browser.


    # Q&A


    +   I noticed that the <IMG> tag in HTML can''t have onMouseEnter or onClick event
    handlers. How can my scripts respond when the mouse moves over an image?


    +   The easiest way to do this is to make the image a link by surrounding it with
    an `<a>` tag. You can include the BORDER=0 attribute to prevent the blue link
    border from being displayed around the image. You''ll see an example of this in
    Hour 15.


    +   What happens if onKeyDown and onKeyPress event handlers? Will they both be
    called when a key is pressed?


    +   The onKeyDown event handler is called first. If it returns true, the onKeyPress
    event is called. Otherwise, no keypress event is generated.


    +   Is there any way at to detect keypresses in a script and support browsers
    older than Netscape 4.0?


    +   In general, no. However, you can detect keys pressed in certain circumstances,
    such as when text is entered into a text field of a form. This is explained in
    Hour 14.


    +   When I use the onload event, my event handler sometimes executes before the
    page is done loading, or before some of the graphics. Is there a better way?


    +   This is a bug in some older versions of JavaScript. One solution is to add
    a slight delay to your script using the setTimeout method. You''ll learn how to
    use this method in Hour 13, "Using Windows and Frames."


    ![](img/de79f8d3157260923142f6327cdaf49c_176_0.png)'
