  md: '# Data Types in JavaScript


    In some computer languages, you have to specify the data type of a variable will
    store: for example, a number or a string. In JavaScript, you don''t need to specify
    a data type except in rare cases. However, you should know the types of data JavaScript
    can deal with.


    These are the basic JavaScript data types:


    +   * Numbers, such as 3, 25, or 1.1412138. JavaScript supports both integers
    and floating-point numbers.

    * Boolean, or logical values. These can have one of two values: true or false.
    These are useful for indicating whether a certain condition is true.


    > You''ll learn more about Boolean values and about using conditions in JavaScript
    in Hour 7, "Testing and Comparing Values."


    +   * Strings, such as "I am a jelly doughnut". These consist of one or more characters
    of text. (Strictly speaking, these are string objects, which you''ll learn about
    in Hour 6.)

    * The null value, represented by the keyword null. This is the value of an undefined
    variable. For example, the statement document.write(fig) will result in this value
    if the variable fig has not previously used or defined.


    Although JavaScript keeps track of the data type currently stored in each variable,
    it doesn''t restrict you from changing types midstream. For example, suppose you
    declared a variable by assigning it a value:


    ```

    total = 31;

    ```


    This statement declares a variable total and assigns it the value of 31. This
    is a numeric variable. Now suppose you changed the value of total:


    ```

    total = "albatross";

    ```


    This assigns a string to total. JavaScript will not display an error when this
    statement executes; it''s perfectly valid, although it''s probably not a very
    useful total.'
