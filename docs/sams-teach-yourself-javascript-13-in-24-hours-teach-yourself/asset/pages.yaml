  md: '# HOUR 17


    # Working with Style Sheets


    Welcome to Part 5! In the next four hours, you''ll learn how to use some of the
    more recent additions to to the Web developer''s arsenal and how to use JavaScript
    to control these features.


    Hour 17 begins with an introduction to style sheets, which you can use to take
    more control over how the browser displays your document. You can also use JavaScript
    with style sheets to change the display dynamically.


    Hour 17 covers the following topics:


    +   - The components of Dynamic HTML

    - Why style sheets are needed

    - How to define Cascading Style Sheets (CSS)

    - How to use a style sheet in a document

    - Using an external style sheet file

    - Defining style sheets with JavaScript

    - Using JavaScript to change styles'
