    # Ups and Downs


    You can also use events to detect when the mouse button is clicked. The basic
    event handler for this is onClick. This event handler is called when the mouse
    button is clicked while positioned over the appropriate attribute.


    > The object in this case can be a link. It can also be a form element. You’ll
    learn more about forms in Hour 14, “Getting Data with Forms."


    For example, you can use the following event handler to display an alert when
    a link is clicked:


    ```

    <A HREF="http://www.jworkshop.com/" onClick="alert(''You are about to leave this
    site.'');">Click Here</A>

    ```


    In this case, the onClick event handler runs before the linked page is loaded
    into the browser. This is useful for making links conditional or displaying a
    disclaimer before launching the linked page.


    If your onClick event handler returns the false value, the link will not be followed.
    For example, the following is a link that displays a confirmation dialog. If you
    click Cancel, the link is not followed; if you click OK, the new page is loaded:'
