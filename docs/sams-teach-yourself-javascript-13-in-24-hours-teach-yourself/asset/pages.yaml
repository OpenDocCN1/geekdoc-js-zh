- img_proc: true
  md: '# LISTING 23.5 THE SCRIPT TO UPDATE THE CART.


    ```

    1: function updatecart() {

    2:   for (i=1; i<=numitems;i++) {

    3:     if (numitems == 1)

    4:       items[i].quantity = parent.cart.document.form1.qty.value;

    5:     else

    6:       items[i].quantity = parent.cart.document.form1.qty[i-1].value;

    7:   }

    8:   displaycart();

    9: )

    ```


    This function reads the quantities from the text fields in the shopping cart document
    and updates the quantities in the items array. Finally, the displaycart function
    is called to update the display.


    ![](img/de79f8d3157260923142f6327cdaf49c_323_0.png)


    > If you use the same name for several form elements, JavaScript treats them as
    an array with that name. This is how line 5 reads the quantity. However, if only
    one item was ordered, there is no array. In this case, lines 3 and 4 read the
    value as a simple property.


    # Completing the Order


    The simplest function in the script is the complete function, which completes
    the order. This opens a new window, which loads the complete.html file. You will
    create this file later in this hour. Listing 23.6 shows the complete function.


    # LISTING 23.6 THE SCRIPT TO OPEN THE ORDER WINDOW.


    ```

    1: function complete() {

    2:   OrdWin=window.open(''complete.html'',''OrdWin'');

    3: )

    ```


    # Putting It All Together


    You now have all of the components of a basic shopping cart. To put them all together,
    Listing 23.7 shows the complete products.html document with all of its script
    functions.'
