  md: 'Of course, you may find it useful to know which the user pressed. You can find
    this with the event object, which is sent to your event handler when the event
    occurs. The event.which property stores the ASCII character code for the key that
    was pressed.


    ASCII (American Standard Code for Information Interchange) is the standard numeric
    code used by most computers to represent characters. It assigns the numbers 0-128
    to various characters—for example, the letters A through Z are ASCII values 65
    to 90.


    ![](img/de79f8d3157260923142f6327cdaf49c_172_0.png)


    If you''d real deal with actual characters, you can use the charCode string method
    to convert it. This method converts a numeric ASCII code to its corresponding
    string character. For example, the following <BODY> tag includes an event handler
    that displays the character for the key that was pressed in an alert message:


    ```

    <BODY onkeypress="window.alert(''You pressed: '' + \nString.fromCharCode(event.which));">

    ```


    This statement uses the String.fromCharCode method to convert the event.which
    property to a string and then displays the string as part of an alert dialog.


    # Using the onLoad Event


    Another event you''ll use frequently is onload. This event occurs when the current
    page (including all of its images) finishes loading from the server.


    The onload event is related to the document object, and to define it you use an
    event handler in the <BODY> tag. For example, the following is a <BODY> tag that
    uses a simple event handler to display an alert when the page finishes loading:


    ```

    <BODY onload="alert(''Loading complete.'');">

    ```


    Since the onload event occurs after the HTML document has finished loading and
    displaying, you cannot use the document.write or document.open statement within
    an onload event handler. This would overwrite the current document.


    ![](img/de79f8d3157260923142f6327cdaf49c_172_1.png)'
