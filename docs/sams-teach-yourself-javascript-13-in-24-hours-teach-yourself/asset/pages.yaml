    # # Changing Colors and Background Images


    You can also use style sheets to gain more control over the colors and background
    images used on your Web page. CSS includes the following properties for this purpose:


    +   color—Specifies the text color of an element. This is useful for emphasizing
    text or for using a specific color for the document.


    +   background-color—Specifies the background color of an element. By setting
    this value, you can make paragraphs, table cells, and other elements with unique
    background colors.


    +   background-image—Specifies a GIF format image to be used as the background
    image for the element.


    +   background-repeat—Specifies whether the background image is repeated (tiled).
    The image can be repeated horizontally, vertically, or both. (Internet Explorer
    4)


    +   background-attachment—Controls whether the background image scrolls when you
    scroll through the document. fixed means that the background image stays still
    while the document scrolls; scroll means the image scrolls with the document (like
    background images on normal Web documents). Currently, this feature is supported
    only by Internet Explorer 4.


    +   background-position—Allows you to offset the position of the background image.
    (Internet Explorer 4)


    +   This provides a quick way to set all of the background elements in this list.
    You can specify all of the attributes in a single background rule.


    # # Working with Fonts


    Style sheets allow you to control the fonts used on the Web document and how they
    are displayed. You can use the following properties to control fonts:


    +   font-family—Specifies the name of a font, such as arial or helvetica, to use
    with the element. Because not all users have the same fonts installed, you can
    list several fonts. The CSS specification also supports several generic font families
    that are guaranteed to be available: serif, sans-serif, cursive, fantasy, and
    space.


