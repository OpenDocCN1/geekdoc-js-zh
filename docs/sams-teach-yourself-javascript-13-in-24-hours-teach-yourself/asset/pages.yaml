  md: "# Working with Style Sheets\n\nText-based browsers aren't the alternate way\
    \ of displaying HTML.\nBrowsers designed for the blind can read a Web page using\
    \ a speech synthesizer, with different voices or sounds that indicate the different\
    \ elements. \n\nAs you should understand, HTML is very good at its job—defining\
    \ a document's structure. Surprisingly, using this language to control the document's\
    \ presentation will only drive you crazy.\n\nFortunately, the World Wide Web Consortium\
    \ (W3C) realized that Web authors need to control the layout and presentation\
    \ of documents. This resulted in the Cascading Style Sheets (CSS) recommendation.\n\
    \nCSS adds a number of features to standard HTML to control style. More importantly,\
    \ it does without affecting HTML's ability to describe document structure. While\
    \ style sheets won't make your document look 100% identical on all browsers and\
    \ platforms, it is certainly a step in the right direction.\n\nLet's look at a\
    \ real-world example: If you're browsing the Web with a CSS-supported browser\
    \ and come across a page that uses CSS, you'll see the document exactly as you\
    \ intended. You can also turn off your browser's support for style sheets if you'd\
    \ rather view all of the pages in the same consistent way.\n\n# Defining and Using\
    \ CSS Styles\n\nTo use styles on a page, you first need to define the styles,\
    \ using the <style> tag, and indicate the styles that should be used with various\
    \ HTML elements.\n\nThe main HTML tag you'll use to define style sheets is the\
    \ <style> tag, which starts a listing of styles. The initial <style> tag specifies\
    \ the type of style sheet, and the </style> tag ends the style definitions. for\
    \ the following starts a style definition using CSS:\n\n```\n<STYLE TYPE=\"text/css\"\
    >\n```\n\nRather than using a style sheet defined in the document header, you\
    \ can specify a style for an individual element. For example, the HTML tag represents\
    \ a level 1 header colored blue:\n\n```\n<H1 STYLE=\"color: blue\">This is a blue\
    \ header.</H1>\n```\n\nYou should place the <style> tags in the <head> section\
    \ of the HTML document. In the following sections, you'll learn how to create\
    \ style rules and about the various parameters you can set using CSS."
  merge: -1
  pgno: 242
- img_proc: true
  md: "# Creating Rules\n\nEach line within the <STYLE> tags is called a rule. To\
    \ create a rule, you specify the HTML elements that it will affect, as well as\
    \ a list of properties and values that control the appearance of those elements.\
    \ We'll look at the properties later in this section.\n\nAs a simple example,\
    \ the following style sheet contains a single rule—all level 1 headings are blue:\n\
    \n```\n<STYLE TYPE=\"text/css\">\nH1 {color: blue}\n</STYLE>\n```\n\nYou can also\
    \ specify multiple HTML tags to affect, as for example, the following style sheet\
    \ specifies that all headers are blue, italic, and centered:\n\n```\n<STYLE TYPE=\"\
    text/css\">\nH1,H2,H3,H4,H5,H6 {color: blue;\n  font-style: italic;\n  text-align:\
    \ center;}\n</STYLE>\n```\n\nYou can specify any HTML element in a rule, and you\
    \ can even affect large portions of the page with a single rule. If you make a\
    \ rule that sets the style of the <body> tag, it will affect the entire document.\
    \ This becomes the default rule for the document; you can override it with the\
    \ styles of elements within the body of the page.\n\n# Aligning Text\n\nOne of\
    \ the most useful features of style sheets is the capability to change the spacing\
    \ and alignment of text. Most of these features aren't available using standard\
    \ HTML. You can use the following properties to change the alignment and spacing\
    \ of text:\n\n+   - letter-spacing—Specifies the spacing between letters. (Internet\
    \ Explorer 4 only)\n- text-decoration—Allows you to create lines over, under,\
