  md: '# Working with Time Zones


    Finally, a few functions are available to help your Date objects work with local
    time values and time zones:


    +   - getTimeOffset() gives you the local time zone''s offset from GMT (Greenwich
    Mean Time, also known as UTC). In this course, this only works if the user has
    set his system clock accurately).

    - toGMTString() converts the date object''s time value to text, using GMT.

    - toLocalString() converts the date object''s time value to text, using local
    time.


    # Converting Between Date Formats


    Two special methods of the Date object allow you to convert between date formats.
    Instead of using these methods with a Date object you created, use them with the
    built-in object Date itself. These include the following:


    +   - Date.parse() converts a date string, such as June 20, 1996, to a Date object
    (number of milliseconds since 1/1970).

    - Date.UTC() does the opposite. It converts a Date object value (number of milliseconds)
    to a UTC (GMT) time.


    # Workshop: Working with the Math Object


    The Math.random method, discussed earlier in this hour, generates a random number
    between 0 and 1. However, it''s very difficult for a computer to generate a truly
    random number. (It''s also hard for a human to do well so—that''s why dice were
    invented.)


    Today''s computers can reasonably well at generating random numbers, but just
    how good is JavaScript''s Math.random function? One way to test it is to generate
    many random numbers and calculate the average of all of them.


    In theory, the average should be somewhere near .5, halfway between 0 and 1. The
    more random values you generate, the closer the average should get to this middle
    ground.


    As an example of the use of the Math object, you can create a script that tests
    JavaScript''s random number function. To do this, you''ll generate 5,000 random
    numbers and calculate their average.


    In case you skipped Hour 8, "Repeating Yourself: Using Loops," and are getting
    out your calculator, don''t worry—you''ll use a loop to generate the random numbers.
    (You''ll be surprised how fast JavaScript can do this.)


    ![](img/de79f8d3157260923142f6327cdaf49c_136_0.png)'
