    directly to the browser for media types such as formatted text, video, and audio,
    Netscape created a modular architecture that allows programmers to write their
    own browser add-ons for these features.


    There are now hundreds of plug-ins available. Here are a few of the most popular:


    +   - Macromedia''s ShockWave and Flash plug-ins support animation and video.

    - Adobe''s Acrobat plug-ins supports precisely formatted, cross-platform text.

    - RealPlayer supports streaming audio and video.

    - Headspace''s Beatnik plug-in supports streaming music in Web pages.


    You can download these plug-ins from their manufacturers. The Navigator browser
    installation includes several basic plug-ins:


    +   - The QuickTime plug-in for inline movies

    - The LiveAudio plug-in for audio and MIDI (music) files

    - Bundled versions of the RealPlayer, ShockWave, and Beatnik plug-ins


    Because these are included with Navigator, you can assume that at least half of
    your Web page''s audience will have them. The Workshop section of this hour will
    use the LiveAudio plug-in to play sounds.


    ![](img/de79f8d3157260923142f6327cdaf49c_277_0.png)


    > Microsoft Internet Explorer also supports plug-ins, but usually requires a different
    version of a plug-in. Additionally, some plug-ins are available for only one platform,
    such as Windows or Macintosh. All of the examples in this hour use plug-ins that
    are available for all platforms, but they require Netscape Navigator 3.0 or later.


    You can include a file that uses a plug-in in a Web document with the <EM> tag.
    This tag specifies the filename for the content and any parameters required by
    the plug-in.


    # Understanding MIME Types


    Multipurpose Internet Mail Extensions (MIME) is a standard for classifying different
    types of files and transmitting them over the Internet. The different types of
    files are known as MIME types.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Working with Multimedia and Plug-Ins


    You''ve already worked with a few MIME types: HTML (MIME type text/html), text
    (MIME type text/plain), and GIF images (MIME type image/gif). Although Web browsers
    don''t normally support many more than these types, external applications and
    plug-ins can support for additional types.


    When a Web server sends a document to a browser, it includes that document''s
    MIME type in the heading. If the browser supports MIME type, it displays the file.
    If not, you''re asked what to do with the file (such as when you click on a .zip
    or .exe file to download it).


    # How LiveConnect Works


    So far, you''ve learned how useful plug-ins can be to a browser, but you haven''t
    seen how they work with JavaScript. That''s where LiveConnect comes in. LiveConnect
    is a Netscape standard that allows JavaScript, Java, and plug-ins to communicate.


    LiveConnect allows plug-ins to make parameters available as objects. These objects
    are stored as part of the browser object hierarchy and are available to JavaScript
    and Java programs.


    > You can also use LiveConnect to use Java commands from within a JavaScript program,
    or to communicate between Java and JavaScript programs. See Netscape''s Web site
    for more detail:\http://developer.netscape.com/docs/manuals/liveconnect.html


    ![](img/de79f8d3157260923142f6327cdaf49c_278_0.png)


    # Working with Plug-In Objects


    The JavaScript navigator object, which you learned about in Hour 10, "Working
    with Browser Objects," includes a child object called plugins. This object is
    an array, with one entry for each plug-in installed on the browser.


    Each plug-in has an entry in the array. Each entry has the following properties:


    +   - name is the name of the plug-in.

    - filename is the executable file that was loaded to install the plug-in.

    - description is a description of the plug-in, supplied by the developer.

    - mimeTypes is an array with one entry for each MIME type supported by the plug-in.


    You can use these properties in a script to find out about the installed plug-ins,
    as you''ll see in the next section.


    ![](img/de79f8d3157260923142f6327cdaf49c_278_1.png)'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Checking for Plug-Ins


    If you want to use a hot new plug-in on your pages, but you know that not every-one
    has the plug-in installed? One of the handiest uses for JavaScript to detect a
    plug-in before loading the page that contains that plug-in''s content.


    For example, Listing 20.1 shows a simple script that checks for the QuickTime
    plug-in (or any other that handles QuickTime movies). If a plug-in is found, the
    script writes the `&lt;EMBED&gt;` tag to include a movie in the document. If not,
    it displays a still image.


    # Listing 20.1 CHECKING FOR THE QUICKTIME PLUG-IN.


    ```

    1: test=navigator.mimeTypes[''video/quicktime''];

    2: if (test)

    3: document.writ(\&lt;EMBED SRC=''quick.mov'' HEIGHT=\=100 WIDTH=\=100&gt;);

    4: else

    5: document.writ(\&lt;IMG SRC=''quick.gif'' HEIGHT=\=100 WIDTH=\=100&gt;);

    ```


    If your script does not detect the appropriate plug-in, you can provide a link
    to the download location for the plug-in or to a non-plug-in version of the page.


    # Listing Plug-Ins


    As another example of the plugins array, you can use JavaScript to list the plug-ins
    sup-ported by your browser. Listing 20.2 shows a script that lists the plug-ins
    in a table, with filenames and descriptions.


    # Listing 20.2 LISTING PLUG-INS WITH JAVASCRIPT.


    ```

    1: &lt;HTML&gt;

    2: &lt;HEAD&gt;

    3: &lt;TITLE&gt;List of Plug-Ins&lt;/TITLE&gt;

    4: &lt;/HEAD&gt;

    5: &lt;BODY&gt;

    6: &lt;H1&gt;List of Plug-Ins&lt;/H1&gt;

    ```


    ![](img/de79f8d3157260923142f6327cdaf49c_279_0.png)


    The navigator object also has a child object called mimeTypes, which includes
    an array element for each MIME type supported by the browser or one of its plug-ins.'
