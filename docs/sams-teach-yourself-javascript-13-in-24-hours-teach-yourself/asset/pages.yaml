    # Workshop: Copying a Script


    You should now have an idea of the many things you can do with JavaScript. In
    the remaining hours of this book, you''ll learn the specifics of these and other
    uses for JavaScript.


    Of course, you might want to make some improvements to your site right away. While
    you''ll eventually learn to create useful and complicated scripts from scratch,
    sometimes it''s nice to be able to use a feature without entirely understanding
    it.


    For example, suppose you want to use a scrolling status-line message on your page.
    Rather than create a program to do this from scratch, you can copy a working script
