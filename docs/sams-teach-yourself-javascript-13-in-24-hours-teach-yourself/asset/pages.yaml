  md: '# HOUR 16


    # Creating Browser-

    Specific Scripts


    Welcome to the fourth hour of Part IV. Up until now, most of the scripts you''ve
    written will work in the latest versions of either of today''s most popular browsers:
    Netscape Navigator and Internet Explorer (IE). Between two, your scripts will
    work for a vast majority of the Web audience.


    As you move to Part V, however, you''ll start working with topics that aren''t
    so compatible. The latest features, such as channels and layers, tend to work
    differently on different browsers, and some features are specific to one or the
    other.


    Although you may be tempted to take the easy way out and make your pages require
    Netscape, there is another solution. Using JavaScript, you can differentiate between
    browsers, allowing you to support of all of them—either in the same or separate
    pages.


    ![](img/de79f8d3157260923142f6327cdaf49c_226_0.png)'
