  md: 'Either side of the conditional expression can be a variable, a constant, or
    an expression. You can compare a variable and a value or compare two variables.
    (You can compare two constants, but there''s usually no reason to.)


    Between the two values to be compared is a conditional operator. This operator
    tells JavaScript how to compare the two values, the == operator is used to test
    whether the two values are equal. A variety of conditional operators are available:


    +   - == (is equal to)

    - != (is not equal to)

    - < (is less than)

    - > (is greater than)

    - <= (is less than or equal to)

    - >= (is greater than or equal to)


    Be not to confuse the equality operator (==) with the assignment operator (=),
    even though both might be read as "equals." Remember to use = when assigning a
    variable and == when comparing values. Confusing these two is one of the most
    common mistakes in JavaScript programming.


    # Combining Conditions with Logical Operators


    Often, you''ll want to check a variable for more than one possible value or check
    more one variable at once. JavaScript includes logical operators, also known as
    Boolean operators, for this purpose. For example, the following two statements
    check different conditions and use the same action:


    ```

    if (phone == "") window.alert("error!");

    if (email == "") window.alert("error!");

    ```


    Using a logical operator, you can combine them into a single statement:


    ```

    if (phone == "" || email == "") window.alert("error!");

    ```


    This statement uses the logical OR operator (!!) to combine the conditions. Translated
    to English, this would be "If the phone number or the email address is blank,
    display an error message."


    An additional logical operator is the And operator, &&. Consider this statement:


    ```

    if (phone == "" && email == "") window.alert("error!");

    ```'
