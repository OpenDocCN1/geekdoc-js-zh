  md: '# Working with Frames


    Some browsers (including the latest Netscape and Microsoft browsers) support frames
    or framesets, which enable you to divide the browser window into multiple panes.
    Each frame can contain a separate URL or the output of a script.


    # Using JavaScript Objects for Frames


    When a window contains multiple frames, each frame is represented in JavaScript
    by a frame object. This object is equivalent to a window object, but it is used
    for dealing with that frame. The frame''s name is the same as the NAME attribute
    you give it in the <FRAME> tag.


    Remember the window and self keywords, which refer to the current window? When
    you are using frames, these keywords refer to the current frame instead. Another
    keyword, parent, enables you to refer to the main window.


    Each frame object in a window is a child of the parent window object. Suppose
    you define a set of frames using the HTML in Listing 13.4.


    +   LISTING 13.4 A FRAMED DOCUMENT THAT DIVIDES THE PAGE INTO QUARTERS


    ```

    1 <FRAMET ROWS="*,*" COLS="*,*">

    2 <FRAME NAME="topleft" SRC="topleft.htm">

    3 <FRAME NAME="topright" SRC="topright.htm">

    4 <FRAME NAME="bottomleft" SRC="bottomleft.htm">

    5 <FRAME NAME="bottomright" SRC="bottomright.htm">

    6 </FRAMET>

    ```


    This simply divides the window into quarters. If you have a JavaScript program
    in the topleft.htm file, it will refer to the other windows as parent.topright.parent.bottomleft,
    and so on. The keywords window and self would refer to the topleft frame.


    ![](img/de79f8d3157260923142f6327cdaf49c_189_0.png)


    If you use nested framesets, things are a bit more complicated. window still represents
    the current frame, parent represents the frameset containing the current frame,
    and top represents the main frameset that contains all the others.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# The frames Array


    Rather than referring to frames in a document by name, you can use the frames
    array. This array stores information about each of the frames in the document.
    The frames are indexed starting with zero and beginning with the first <FRAME>
    tag in the frameset document.


    For example, you could refer to the frames defined in Listing 13.4 using array
    references:


    +   * parent.frames[0] is equivalent to the toleft frame.

    * parent.frames[1] is equivalent to the topright frame.

    * parent.frames[2] is equivalent to the bottomleft frame.

    * parent.frames[3] is equivalent to the bottomright frame.


    You can refer to a frame using either method interchangeably, and depending on
    your application, you should use the most convenient method. For example, a document
    with 10 frames would probably be easier to use by number, but a simple two-frame
    document is easier to use if the frames have meaningful names.


    # Workshop: Creating a Navigation Frame


    A common use for frames is to display a navigation frame along the side or top
    of a page. Using frame objects, you can create a navigation frame that controls
    the document in another frame.


    To begin, you''ll need a document to define the frameset. This is the simple part.
    Listing 13.5 defines a frameset with frames on the left and right.


    Listing 13.5 AN HTML DOCUMENT TO DIVIDE THE WINDOW INTO TWO FRAMES.


    ```

    1 <HTML>

    2 <HEAD>

    3 <TITLE>Frame Navigation Example</TITLE>

    4 </HEAD>

    5 <FRAMSET COLS="left" SRC="left.html">

    6 <FRAME NAME="right" SRC="about:blank">

    7 </FRAMSET>

    8 </HTML>

    ```


    Next, you will need the document for the left-hand frame, which will act as the
    navigation frame. Listing 13.6 shows the HTML document for this frame.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# LISTING 13.6 THE HTML DOCUMENT FOR THE NAVIGATION FRAME.


    ```

    1 <HTML>

    2 <HEAD>

    3 <TITLE>Navigation Frame</TITLE>

    4 <body>

    5 <P>

    6 Follow one of these links

    7 to load a page into the right-hand

    8 frame:

    9 </P>

    10 <UL>

    11 <LI><A href="parent.right.location=''order.html'';

    12 window.location=''ordernav.html'';">

    13 Order form</A>

    14 <LI><A href="

    15 onclick="parent.right.location=''email.html'';

    16 window.location=''emailnav.html'';">

    17 Email</A>

    18 <LI><A href="

    19 onclick="parent.right.location=''sales.html'';

    20 window.location=''salesnav.html'';">

    21 Sales Dept.

    22 <LI><A href="

    23 onclick="parent.right.location=''link.html'';

    24 Other Links</A>

    25 </UL>

    26 </body>

    27 </HTML>

    ```


    This listing looks complicated, but it actually uses two simple JavaScript statements
    to do its job. The statements are repeated for each of the links, with a slight
    variation.

    Here''s one example:


    ```

    onclick="parent.right.location=''email.html'';

    window.location=''emailnav.html'';

    ```


    These statements are event handler that loads a document into the right-hand frame
    and also loads a new document into the navigation frame. Because the current script
    is itself in a frame, you need to use the parent keyword before the name of the
    other frame''s object.


    ![](img/de79f8d3157260923142f6327cdaf49c_191_0.png)


    If you''re only loading one document when the user clicks on a link, you can use
    the TARGET attribute of the <A> tag and avoid JavaScript. However, using JavaScript
    allows you to update two frames at once, as seen in this example.'
