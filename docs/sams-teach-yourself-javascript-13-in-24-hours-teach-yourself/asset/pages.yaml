    In this example, the return false statement is necessary to prevent the status
    message from being overwritten immediately by the URL. As you can see, this makes
    the <A> tag complicated—and there isn''t even a way to clear the message.


    Using a function simplifies the link tags slightly. More importantly, it will
    make it easy to add other features (such as graphics) at a later time. You will
    call the function to display a describe message. Listing 12.1 shows its function
