  md: '# Creating Browser-Specific Scripts


    There are two unexpected things about this display. First of all, the navigator.language
    property is listed as undefined. This isn''t much of a surprise because this property
    isn''t yet supported by Internet Explorer.


    More importantly, you''ll notice that the word Mozilla appears in the code name
    and user agent fields.


    Mozilla/4.0 (compatible; MSIE 4.01; Windows 98)


    What is this? Some sort of secret endorsement of Netscape by Microsoft? Some sort
    of government conspiracy? Is Netscape''s mythical monster, Mozilla, hiding somewhere
    under Microsoft''s Redmond campus?


    As it turns out, Mozilla did have a good reason for this. At the height of the
    browser wars, about the time Netscape 3.0 and IE 3.0 came out, it was becoming
    common to see "Netscape only" pages. Webmasters who used features as frames and
    JavaScript set their servers to turn away browsers without Mozilla in their user
    agent string. The problem with this was that most of these features were also
    supported by Internet Explorer.


    Mozilla solved this problem by making IE''s user agent read Mozilla, with the
    word compatible in parentheses. This allows IE users to view those pages, but
    still includes details to tell Web servers which browser is.


    ![](img/de79f8d3157260923142f6327cdaf49c_230_0.png)


    > Many Web servers keep statistics about which browsers use to access them. When
    Microsoft changed IE''s user agent string, many of the statistics programs were
    not aware of the change. As a result, they counted a visit by IE as a visit by
    Netscape. Ironically, Microsoft''s move to make their browser more compatible
    caused Netscape''s market share to improve, at least for a while.


    Although this is an interesting episode in the annals of the browser wars, what
    does it mean to you? You''ll need to be careful when your scripts are trying to
    differentiate between IE and Netscape. For example, the following statement was
    presented earlier in this hour as example of the navigator properties:


    ```

    if (navigator.userAgent.indexOf("Mozilla/4") == -1)

    window.location="_netscape.html";

    ```


    As it turns out, this statement check for the string Mozilla/4—which will actually
    allow either Netscape 4.x or Internet Explorer 4.x. This isn''t necessarily a
    bad thing, but what if your page definitely requires Netscape 4.0? In that case,
    you can be more specific:'
  merge: -1
