    # Workshop: Using Layers for Animation


    One of the most common uses for positioning is to create animation. In Hour 15,
    "Using Graphics and Animation," used JavaScript to create a simple animation.
    Using a layer, you can animate the mouse from Hour 15 using a simpler approach.


    Just to make things more fun (and because mice are the only thing I can draw),
    you will animate three mice at a time using Dynamic HTML. Using layers to accomplish
    the animation provides smoother animation and is easier to program. Listing 18.3
    shows the Dynamic HTML animation script.


    Listing 18.3 THE DYNAMIC HTML ANIMATION SCRIPT.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE>Animation with Dynamic HTML</TITLE>

    4: <SCRIPT LANGUAGE="JavaScript">

    5: var pos1=-5;

    6: var pos2=-5;

    7: var pos3=-5;

    8: var speed1=Math.floor(Math.random()*10)+2;

    9: var speed2=Math.floor(Math.random()*10)+2;

    10: var speed3=Math.floor(Math.random()*10)+2;

    11: function next() {

    12: pos1 += speed1;

    13: pos2 += speed2;

    14: pos3 += speed3;

    15: if (pos1 > 795) pos1 = -95;

    16: if (pos2 > 795) pos2 = -95;

    17: if (pos3 > 795) pos3 = -95;

    18: document.layers[0].left = pos1;

    19: document.layers[1].left = pos2;

    20: document.layers[2].left = pos3;

    21: }

    22: else

    23: mouse1.style.left = pos1;

    24: mouse2.style.left = pos2;

    ```


