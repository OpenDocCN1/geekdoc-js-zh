  md: '# APPENDIX C


    # Glossary


    +   **Active** A technology developed by Microsoft to allow components to be created,
    primarily for Windows computers. ActiveX components, or controls, can be embedded
    in Web pages.


    +   **applet** A Java program that is designed to be embedded in a Web page.


    +   **argument** A parameter that is passed to a function when it is called. Arguments
    are specified within parentheses in the function call.


    +   **array** A set of variables that can be referred to with the same name and
    a number, called an index.


    +   **Boolean** A type of variable that can store only two values: true and false.


    +   **concatenate** The act of combining two strings into a single, longer string.


    +   **conditional** A JavaScript statement that performs an action if a particular
    condition is true, usually using the if statement.


    +   **decrement** To decrease the value of a variable by one. In JavaScript, this
    can be done with the decrement operator, ++.


    +   **debug** The act of finding errors, or bugs, in a program or script.


    ![](img/de79f8d3157260923142f6327cdaf49c_356_0.png)'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'element A single member of an array, referred to with an index.


    event A condition, often the result of a user''s action, that can be detected
    by a script.


    expression A combination of variables, constants, and operators that can be evaluated
    to a single value.


    function A group of JavaScript statements that can be referred using a function
    name and arguments.


    Hypertext Markup Language (HTML) The language used in Web documents. JavaScript
    statements are not HTML, but can be included within an HTML document.


    increment To increase the value of a variable by one. In JavaScript, this is done
    with the increment operator, --.


    interpreter The browser component that interprets JavaScript statements and acts
    on them.


    Java An object-oriented language developed by Sun Microsystems. Java applets can
    be embedded within a Web page. JavaScript has similar syntax, but is not the same
    as Java.


    JavaScript A scripting language for Web documents, loosely based on Java''s syntax,
    developed by Netscape. JavaScript is now supported by the most popular browsers.


    loop A set of JavaScript statements that is executed a number of times or until
    a certain condition is met.


    method A specialized type of function that can be stored in an object and acts
    on the object''s properties.


    Navigator A browser developed by Netscape, and the first to support JavaScript.


    object A type of variable that can store multiple values, called properties, and
    functions, called methods.


    operator A character used to divide variables or constants used in an expression.


    parameter A variable sent to a function when it is called; also known as an argument.


    property A variable that is stored as part of an object. Each object can have
    any number of properties.


    scope The part of a JavaScript program that a variable was declared in and is
    available to.


    statement A single line of a script or program.


    string A group of text characters that can be stored in a variable.'
