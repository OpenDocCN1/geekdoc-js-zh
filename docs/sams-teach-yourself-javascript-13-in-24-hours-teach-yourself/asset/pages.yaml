  md: '# Using Functions


    The scripts you''ve seen so far, such as the Year 2000 script in Hour 2, “Creating
    a Simple Script,” are simple lists of instructions. The browser begins with the
    first statement after the <SCRIPT> tag and follows each instruction in order until
    it reaches the closing </SCRIPT> tag (or encounters an error).


    While this is a straightforward approach for short scripts, it can be confusing
    to read a huge script written in this fashion. To make it easier for you to organize
    your scripts, JavaScript supports functions.


    # Defining a Function


    Functions are groups of JavaScript statements that can be treated as a single
    unit. In order to use a function, you must first define it. Listing 4.1 shows
    a simple example of a function definition.


    LISTING 4.1 A SIMPLE FUNCTION DEFINITION.


    ```

    1: function Greet() {

    2:   alert("Greetings.");

    3: }

    ```


    Listing 4.1 defines a function that displays an alert message to the user. This
    begins with the function keyword. The function''s name is Greet. Notice the parentheses
    after the function''s name. As you will learn next, the space between them is
    not always empty.


    The first and last lines of the function definition include braces ({ }). You
    use these to enclose all of the statements in the function. The browser uses the
    braces to determine where the function begins and ends.


    Between the braces, this particular function contains a single line. This uses
    the built-in alert function, which displays an alert message. The message will
    contain the text "Greetings".


    Now, about these parentheses. The current Greet function always does the same
    thing: each time you use it, it displays the same message. While this avoids a
    bit of typing, it doesn''t really provide much of an advantage.


    To make your function more flexible, you can add parameters, also known as arguments.
    These are variables that are received by the function each time it is called.
    For example, you can add a parameter called name that tells the function name
    of the person to greet. Listing 4.2 shows the modified function.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# LISTING 4.2 A FUNCTION THAT ACCEPTS A PARAMETER.


    ```

    1: function Greet(who) {

    2: alert("Greetings," + who);

    3: }

    ```


    Of course, to use this function you should include it in an HTML document.

    Traditionally, the best place for a function definition is within the <HEAD> section
    of the document. As the statements in the <HEAD> section are executed first, this
    ensures that the function is defined before it is used.


    Listing 4.3 shows the Greet function embedded in the header section of an HTML
    document.


    # LISTING 4.3 THE GREET FUNCTION EMBEDDED IN THE HEADER SECTION OF AN HTML DOCUMENT.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE><SCRIPT LANGUAGE="JavaScript">\4: <SCRIPT LANGUAGE="JavaScript">

    5: function Greet(who) {

    6: alert("Greetings," + who);

    7: }

    8: </SCRIPT>

    9: </HEAD>

    10: <BODY>

    11: This is the body of the page.

    12: </BODY>

    13: </HTML>

    ```


    # Calling the Function


    You have defined a function and placed it in an HTML document. However, if you
    load Listing 4.3 into a browser, you''ll notice that it does absolutely nothing.
    This is because the function is defined—ready to be used—but we haven''t used
    it yet.


    Making use of a function is referred to as calling the function. To call a function,
    use the function''s name as a statement in a script. You will need to include
    the parentheses and the values for the function''s parameters. For example, here''s
    a statement that calls the Greet function:


    Greet("Fred")


    This tells the JavaScript interpreter to transfer control to the first statement
    in the Greet function. It also passes the parameter "Fred" to the function. This
    value will be assigned to the who variable inside the function.'
