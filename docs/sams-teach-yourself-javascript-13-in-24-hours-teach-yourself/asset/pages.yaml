  md: '# HOUR 22


    # Improving a Web Page with JavaScript


    You should now know quite a bit about JavaScript''s features and how to write
    and debug JavaScript programs. In the last three hours of this book, you will
    be applying this knowledge by creating some complete applications.


    You will start with a simple application: an ordinary Web page with a few JavaScript
    features to make it friendlier and easier to navigate. Hour 22 covers the following
    topics:


    +   * Creating a basic HTML document

    * Adding a drop-down navigation bar

    * Adding status-line descriptions for links

    * Adding graphic links and rollovers

    * Combining these features into a complete Web page'
  merge: -1
