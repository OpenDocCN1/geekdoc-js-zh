- img_proc: true
  md: '# Exploring JavaScript Capabilities


    This feature is usually accomplished with JavaScript, and you''ll find out how
    to create your own version in Hour 14, "Getting Data from Forms." You can also
    use JavaScript for more complicated variations of this technique. For example,
    Netscape''s Netcenter site, shown in Figure 3.1, uses a drop-down list for a search
    function.


    Figure 3.1

    Netscape''s Netcenter site uses JavaScript to select a search engine.


    ![](img/de79f8d3157260923142f6327cdaf49c_54_0.png)


    The search box at top of the Netcenter site allows you to enter a search string
    and then select a engine from the drop-down list. When you use the Search button,
    a script reads your data from the form and sends the search string to the appropriate
    search engine.


    # Pop-up Windows and Other Features


    JavaScript has a number of other features that allow you to communicate with the
    user in more exciting ways than HTML. For example, you can easily create pop-up
    alert, confirmation, or prompt messages with JavaScript. A simple example of an
    alert message is shown in Figure 3.2. These can alert the user to an error, present
    a warning or disclaimer, or prompt for information.


    Figure 3.2

    A pop-up alert message created with JavaScript.


