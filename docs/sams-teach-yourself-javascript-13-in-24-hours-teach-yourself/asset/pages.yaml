  md: "Q I thought the images in the images array were indexed starting with 0, but\
    \ the game uses the indices 1-5 to display the cards. How does this work?\n\n\
    A The game includes a title graphic at the top, which uses the images[0] space.\n\
    \nQ Why use an object to store cards when the filename (such as 10h.gif) already\
    \ stores a card's information?\n\nA Just for convenience. By using an object,\
    \ you can individually access the card's value and its suit, which are heavily\
    \ used by the scoring routine.\n\n# Quiz\n\n+   1. Which array can you use to\
    \ change images in a Web page?\n   a. this\n   b. document.src\n   c. document.images\n\
    \n+   2. Which of the following is the correct expression for a random integer\
    \ between 1 and 52?\n   a. Math.random(52)\n   b. Math.floor(52*Math.random())\
    \ + 1\n   c. Math.floor(52*Math.random())\n\n+   3. What are the odds of being\
    \ dealt a royal flush while playing this game?\n   a. 1 in 5,000\n   b. 1 in 50,000\n\
    \   c. 1 in 500,000\n\n# Answers\n\n+   1. The document.images array can be used\
    \ to change images on a page.\n2. Because the Math.random method returns a number\
    \ between 0 and 1, the correct expression is Math.floor(52*Math.random() + 1).\n\
    3. The odds are about one in half a million, but I didn't really expect you to\
    \ know that offhand.\n\n![](img/de79f8d3157260923142f6327cdaf49c_348_0.png)"
