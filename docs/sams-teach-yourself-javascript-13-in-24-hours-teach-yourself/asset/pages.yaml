  md: '# Using Variables


    Unless you skipped the first four hours of this book, you''ve already used a few
    variables. You probably can also figure out how to use a few more without any
    help. Nevertheless, there are some aspects of variables you haven''t learned yet.


    # Choosing Variable Names


    Variables are named containers that can store data (for example, a number, a text
    string, or an object). As you learned earlier in this book, each variable has
    a name. There are specific rules you must follow when choosing a variable:


    +   * Variable names can include letters of the alphabet, upper- and lowercase.
    They can also include the digits 0-9 and the underscore (_) character.

    * Variable names cannot include spaces or any other punctuation characters.

    * The first character of the variable name must be either a letter or an underscore.

    * Variable names are case sensitive—totalnum, Totalnum, and TotalNum are separate
    variable names.

    * There is no official limit on the length of variable names, but they must fit
    within one line. (And you must be able to use the same name twice to make use
    of the variable.)


    Using these rules, the following are examples of valid variable names:


    total_number_of_fish

    LastInvoiceNumber

    temp1

    a

    _var39


    > You can choose to use either friendly, easy-to-read names or completely cryptic
    ones. Do yourself a favor: use longer, friendly names whenever possible. While
    you might remember the difference between a, b, x, and x1 right now, you might
    not after a good night''s sleep.


    ![](img/de79f8d3157260923142f6327cdaf49c_81_0.png)


    # Using Local and Global Variables


    Some computer languages require you to declare a variable before you use it. JavaScript
    includes the var keyword, which can be used to declare a variable. You can omit
    var in many cases; the variable is still declared the first time you assign a
    value to.'
  merge: -1
