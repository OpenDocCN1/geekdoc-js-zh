  md: '# Creating a JavaScript Game


    This function includes some complex calculations, but it isn''t too difficult
    to understand.

    Here''s a breakdown of how it works:


    +   - Lines 3–7 initialize variables, including flags for the various types of
    poker hands.

    - Lines 8–13 create the nums array, which stores a sorted version of the list
    of card values in the hand. This makes it easier to detect some hands (such as
    straights).

    - Lines 14–18 detect a flush (all cards have the same suit).

    - Lines 19–27 detect a straight (all cards in a sequence). Because Aces can represent
    either I or 13, strains ending in Ace are checked separately.

    - Lines 28–32 detect a royal flush (10, J, Q, K, A) and return the score.

    - Lines 33–44 return the scores for straight flush, straight, and flush hands.

    - Lines 45–51 create an array called tally. This is used to count the number of
    cards of each value in the hand.

    - Lines 52–71 use the tally array to detect four of a kind, full house, two pair,
    three of a kind, and pair hands.

    - If the previous code detected a pair of cards, lines 72–78 check whether it''s
    a pair of Jacks or better and return the appropriate score.

    - If no scoring hand was detected, lines 79 and 80 return from the Addscore function
    with no score.


    ![](img/de79f8d3157260923142f6327cdaf49c_342_0.png)


    # Workshop: Putting It All Together


    Listing 24.9 shows the complete draw poker game. In case you don''t want to type
    this yourself, you can download the complete script from this book''s Web site
    at http://www.jsworkshop.com/


    # Listing 24.9 THE COMPLETE DRAW POKER GAME.


    ```

    1: <HTML>

    2: <HEAD>

    3: <TITLE>Draw Poker</TITLE>

    4: <SCRIPT LANGUAGE="JavaScript1.1">

    5: var score = 100;

    6: var dealt = false;

    7: var hand = new Array(6);

    8: var held = new Array(6);

