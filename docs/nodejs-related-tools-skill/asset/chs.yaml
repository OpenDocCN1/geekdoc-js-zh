  ![](img/index-69_335.png)\n![](img/index-69_336.png)\n\n```javascript\n// 配置数据库主机、用户、密码的连接，SQLite\
  \ 不需要这些\nconst sequelize = new Sequelize(null, null, null, {\n  dialect: 'sqlite',\n\
  \  storage: path.join('tmp', 'db.sqlite') // SQLite 将数据直接持久化到文件\n})\n\n// 在这里我们定义\
  \ Article 模型，包含一个字符串类型的 title 属性和一个文本类型的 body 属性。默认情况下，所有表都会 id、createdAt 和 updatedAt\
  \ 列。\n\nconst Article = sequelize.define('article', {\n  title: Sequelize.STRING,\n\
  \  body: Sequelize.TEXT\n})\n\n// 创建表\nArticle.sync()\n\nmodule.exports = {\n  Article\n\
  }\n```\n\n让我们通过导入新模型并将路由处理程序替换为以下内容来测试它：\n\n```javascript\n// server.js\nconst {\
  \ Article } = require('./models')\n\nserver.route({\n  method: 'GET',\n  path: '/',\n\
  \  handler: () => {\n    // 尝试逐行注释掉这些代码\n    return Article.findAll()\n\n    return\
  \ Article.create({ title: '欢迎来到我的博客', body: '地球上的乐园' }) return Article.findById(1)\n\
  \n    return Article.update({ title: '学习 Hapi', body: `JSON API 轻而易举.` }, { where:\
  \ { id: 1 } }) return Article.findAll()\n\n    return Article.destroy({ where: {\
  \ id: 1 } })\n\n    return Article.findAll()\n  }\n})\n```\n\n如果你熟悉 SQL 或其他 ORM，`Sequelize`\
  \ 的 API 应该是自而易懂的，它是基于 Promise 构建的，因此与 Hapi 的异步处理程序完美契合。\n\n\n\n\n\n注意：在本文演示的场景下，使用\
  \ `Article.sync()` 创建表或使用 `Article.sync({ force: true })` 丢并创建表都是可以的。如果你想在生产环境中使用它，应该检查\
  \ `sequelizecli` 并为任何架构更改编写 `Migrations`（迁移）。\n\n## 我们的 RESTful 动作\n\n让我们构建以下路由：\n\
  \n- `GET /articles` 获取所有文章\n- `GET /articles/:id` 根据 ID 获取文章\n- `POST /articles`\
  \ 使用 `{ title, body }` 参数创建文章\n- `PUT /articles/:id` 使用 `{ title, body }` 参数更新文章\n\
  - `DELETE /articles/:id` 根据 ID 删除文章\n\n添加一个新文件 `routes.js`，将服务器配置与应用逻辑分离：\n\n```javascript\n\
  // routes.js\n\nconst { Article } = require('./models')\n\nexports.configureRoutes\
  \ = (server) => {\n  // server.route 接受一个对象或一个数组\n  return server.route([{\n   \
  \ method: 'GET',\n    path: '/articles',\n    handler: () => {\n      return Article.findAll()\n\
  \    }\n  }, {\n    method: 'GET',\n    // 大括号是我们定义参数（URL 中的可变路径段）的方式\n    path:\
  \ '/articles/{id}',\n    handler: (request) => {\n      return Article.findById(request.params.id)\n\
  \    }\n  }, {\n    method: 'POST',\n    path: '/articles',\n    handler: (request)\
  \ => {\n      const article = Article.build(request.payload.article)\n      return\
  \ article.save()\n    }\n  }, {\n    // method 可以是一个数组\n    method: ['PUT', 'PATCH'],\n\
  \    path: '/articles/{id}',\n    handler: async (request) => {\n      const article\
  \ = await Article.findById(request.params.id)\n      article.update(request.payload.article)\n\
  \      return article.save()\n    }\n  }])\n}\n```\n\n![](img/index-71_1.png)\n\
