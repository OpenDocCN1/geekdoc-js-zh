- "# Node.js 相关工具与技能\n\n\n\n![](img/cover.jpeg)\n![](img/index-1_1.jpg)\n![](img/index-2_1.png)\n\
  \n\n\n\n\n\n\n## 关于 SitePoint\n`SitePoint` 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问 `http://www.sitepoint.com/`\
  \ 获取我们的博客、书籍、时通讯、文章和社区论坛。你将在那里找到关于 JavaScript、PHP、设计等大量信息。\n\n## 引言\n尽管已经有很多尝试让\
  \ JavaScript 作为服务器端语言，但 Node.js（通常直接称为 Node）是第一个获得关注的环境。它现在被 Netflix、Uber 和 Paypal\
  \ 等公司用于支持其 Web 应用程序。`Node` 允许极快的性能；得益于它的事件循环，网络连接和数据库 I/O 等常见任务执行速度确实非常快。\n\n##\
  \ 亮点\n从初者的角度来看，`Node` 的明显优势之一是它使用了 JavaScript，这是一种许多开发者都熟悉的通用的语言。如果你能为客户端编写 JavaScript，那么用\
  \ `Node` 编写服务端应用程序对你来说也并不难。\n\n在书中，我们将介绍一些相关的工具和技能，它们将让你成为一名更高效的 `Node` 开发者。\n\n\
  ## 谁应该读这本书？\n本书适用于任何想要学习使用 `Node.js` 进行服务端开发的人。我们假设读者熟悉 `JavaScript`，但并不假设你有任何先前的后端开发经验。\n\
  \n## 使用的规范\n### 代码示例\n书中的代码使用等宽字体显示，如下所示：\n\n```html\n<h1>一个完美的夏日</h1>\n<p>那是一个适合在公园里散步的美好日子。鸟儿在歌唱，孩子们都回上学了。</p>\n\
  ```\n\n当需要现有代码作为上下文，而不是重复所有代码时，将显示 `⋮`：\n\n```javascript\nfunction animate() {\n\
  \  ⋮\n  new_variable = \"Hello\";\n}\n```\n\n某些行代码应该写在一行内输入，但由于页面限制，我们对它们进行了换行。`➥`\
  \ 表示仅出于格式目的而存在的换行，应该被忽略：\n\n```javascript\nURL.open(\"http://www.sitepoint.com/responsiveweb➥designrealusertesting/?responsive1\"\
  );\n```\n\n你会注意到，我们在整书中使用了某些布局样式来表示不同类型的信息。请关注以下项目。\n\n### 提示、注释与警告\n- **Hey, You!**：提示提供了有用的小建议。\n\
  - **Ahem, Excuse Me ...**：注释是与当前主题相关但并非至关重要的旁注。你可以将它们看作额外的信息片段。\n- **Make Sure You\
  \ Always ...**：……始终注意这些重要点。\n- **Watch Out!**：警告强调了在过程中可能让你出错的陷阱。\n\n# 第 1 章：使用\
  \ Mocha 和 Chai 对你的 JavaScript 进行单元测试\n\n## 亮点\n你是否曾经对代码做了一些更改，后来发现它导致了其他地方的崩溃？\n\
  \n我相信我们大多数人都有过这种情况。这几乎是不可避免的，尤其是当你有大量的代码时。一个东西依赖于另一个，然后更改它就会导致另一个东西坏掉。\n\n但如果这种情况没有发生呢？如果你有一种方法知道东西是否由于某些更改而发生了故障，那将太棒了。你可以修改代码而不必担心弄坏任何东西，你的\
  \ Bug 会更少，调试时间也会更短。\n\n这正是单元测试大放异彩的地方。它们会自动为你检测代码中的任何问题。做出更改，运行测试，如果任何部分崩溃，你将立即知道发生了什么、问题在哪里以及正确的行为应该是什么。这完全消除了任何猜测！\n\
  \n在本文中我将向你展示如何开始对 JavaScript 进行单元测试。本文所示的示例和技术同时适用于基于浏览器和 Node.js 代码。\n\n## 什么是单元测试\n\
  单元测试的核心思想是测试函数在接收到特定输入时的行为。你带有特定的参数调用函数，并检查你是否得到了正确的结果。\n\n```javascript\n// 给出\
  \ 1 和 10 作为输入...\nvar result = Math.max(1, 10);\n\n// ...我们应该收到 10 作为输出\nif(result\
  \ !== 10) {\n  throw new Error('Failed');\n}\n```\n\n## 工具准备工作\n对于本文，我们将使用 `Mocha`。它很容易上手，既可用于浏览器和\
  \ Node.js 测试，并且与其他测试工具良好协作。\n\n安装 `Mocha` 最简单的方法是通过 `npm`（为此我们需要先安装 Node.js）。如果你不确定如何在系统中安装\
  \ `npm` 或 Node，请参阅我们的教程：npm 初学者指南 —— Node 包管理器。安装好 Node 后，在项目目录中打开终端或命令行。\n\n如果你想在浏览器中测试代码，运行\
  \ `npm install mocha chai dev`。如果你想测试 Node.js 代码，除了上述操作再运行 `npm install mocha chai`。\n\
  \n这会安装 `mocha` 和 `chai` 包。`Mocha` 是允许我们运行测试的库，而 `Chai` 包含了我们用于验证测试结果的一些有用函数。\n\n\
  ### 在 Node.js 上测试 vs 在浏览器中测试\n后续示例旨在在浏览器中运行测试。如果你想测试 Node.js 应用程序，请按照以下步骤操作：\n\n\
  - 对于 Node，你不需要测试运行文件。\n- 要包含 `Chai`，在文件顶部添加 `var chai = require('chai');`。\n- 使用\
  \ `mocha` 命令运行测试，而不是打开浏览器。\n\n### 设置目录结构\n你应该将测试与主代码文件放在不同的目录中。这使得结构更加清晰，例如如果你将来想添加其他类型的测试（如集成测试或功能测试）。\n\
  \n\n\n\nJavaScript 代码最常用的做法是在项目的根目录下创建一个名为 `test/` 的目录。然后，将每个测试文件放置在 `test/someModuleTest.js`\
  \ 之下。可选的是，你也可以在 `test/` 内部使用目录，但我建议保持简单 —— 如果需要，你以后随时更改。\n\n### 设置测试运行器\n\n为了在浏览器中运行测试，我们需要设置一个简单的\
  \ HTML 页面作为我们的测试运行器页面。该页面会加载 `Mocha`、测试库以及我们的实际测试文件。\n\n要运行测试，我们只需在浏览器中打开该运行器即可。\n\
  \n如果你使用的是 Node.js，可以跳过此步。假设你遵循了推荐的目录结构，可以使用命令 `mocha` 运行 Node.js 单元测试。\n\n下面我们将用于测试运行器的代码。我将把此文件保存为\
  \ `testrunner.html`。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Mocha Tests</title>\n\
  <link rel=\"stylesheet\" href=\"node_modules/mocha/mocha.css\">\n</head>\n<body>\n\
  <div id=\"mocha\"></div>\n<script src=\"node_modules/mocha/mocha.js\"></script>\n\
  <script src=\"node_modules/chai/chai.js\"></script>\n<script>mocha.setup('bdd')</script>\n\
  <! 在此处加载你想测试的代码 >\n<! 在此处加载你的测试文件 >\n<script>\nmocha.run()\n</script>\n</body>\n\
  </html>\n```\n\n测试运行器中重要的部分是：\n\n- 我们加载了 `Mocha` 的 CSS 样式，为我们的测试结果提供良好的格式化。\n- 我们创建了一个\
  \ ID 为 `mocha` 的 `div`。这是插入测试结果的地方。\n- 我们加载了 `Mocha` 和 `Chai`。由于我们是通过 `npm` 安装它们的，它们位于\
  \ `node_modules` 文件夹的子目录下。\n- 通过调用 `mocha.setup`，我们使 `Mocha` 的测试辅助可用。\n- 然后，我们加载想要测试的代码和测试文件。目前这里还没有任何内容。\n\
  - 最后，我们调用 `mocha.run` 来运行测试。确保在加载源文件和测试文件之后*调用此方法。\n\n### 基础测试构建块\n\n现在我们可以运行测试了，让我们开始编写一些测试吧。\n\
  \n我们将首先创建一个新文件 `test/arrayTest.js`。像这样的单个测试文件被称为测试用例。我将其命名为 `arrayTest.js`，是因为在这个例子中，我们将测试一些基础数组功能。\n\
  \n每个测试用例文件都遵循相同的基本模式。首先，你有一个 `describe` 块：\n\n```javascript\ndescribe('Array', function()\
  \ {\n  // 额外的测试代码放在这里\n})\n```\n\n`describe` 用于对单个测试分组。第一个参数应该指示我们正在测试什么 —— 在此情况下，由于我们要测试数组函数，所以我传入了字符串\
  \ `'Array'`。\n\n其次，在 `describe` 内部，我们将有 `it` 块：\n\n```javascript\ndescribe('Array',\
  \ function() {\n  it('should start empty', function() {\n    // 测试实现写在这里\n  })\n\
  \  // 我们可以在这里有更多的 its\n})\n```\n\n`it` 用于创建实际的测试。`it` 的第一个参数应该提供对测试的人类可读描述。例如，我们可以将上面的内容读为“它应该从空开始”，这是对数组应该行为的良好描述。实现测试的代码随后写在传递给\
  \ `it` 的函数内部。\n\n所有 `Mocha` 测试都是由这些相同的构建块构建的，并遵循这种相同的基本模式。\n\n1. 首先，我们使用 `describe`\
  \ 说明我们正在测试什么，例如`\"describe how array should work\"`。\n2. 然后，我们使用多个 `it` 函数来创建单个测试，每个\
  \ `it` 应该解释一个特定的行为，例如我们上面数组用例中的 `\"it should start empty\"`。\n\n### 编写测试代码\n\n现在我们已经知道如何构造测试用例，让我们进入有趣的部分\
  \ —— 实现测试。\n\n由于我们正在测试数组是否应该从空开始，我们需要创建一个数组，然后确保它是空的。这个测试的实现非常简单：\n\n```javascript\n\
  var assert = chai.assert;\n\ndescribe('Array', function() {\n  it('should start\
  \ empty', function() {\n    var arr = []\n    assert.equal(arr.length, 0)\n  })\n\
  })\n```\n\n注意第一行，我们设置了 `assert` 变量。这只是为了让我们不需要在到处都重复输入 `chai.assert`。\n\n在 `it`\
  \ 函数中，我们创建一个数组并检查它的长度。虽然简单，但这是测试如何运作的一个良好示例。\n\n- 首先，你有一个正在测试的东西 —— 这被称为被测系统或 `SUT`。\n\
  - 然后，如果需要，你对 `SUT` 执行某些操作。在这个测试中，我们什么都没做，因为我们正在检查数组是否是从空开始的。\n- 测试中的最后一项应该是验证 ——\
  \ 一个检查结果的*断言*（assertion*）。\n\n在这里，我们正在使用 `assert.equal` 来做到这一点。大多数断言函数接收参数的顺序相同：首先是“实际”值，然后是“预期”值。\n\
  \n*实际*值是你的测试代码的结果，因此在此例中为 `arr.length`。*预期*值是结果*应该*是什么。由于数组应该从空开始，此测试中的预期值是 `0`。\n\
  \n`Chai` 还提供了两种不同的断言编写风格，但目前我们使用 `assert` 来保持简单。当你对编写测试变得更有经验时，你可能想改用 `expect` 断言，因为它们提供了更大的灵活性。\n\
  \n### 运行测试\n\n为了运行此测试，我们需要将它添加到我们创建的运行器文件中。如果你使用的是 Node.js，可以跳过此步并使用命令 `mocha` 运行测试。\n\
  \n否则，要将此测试添加到运行器中，只需添加：\n\n```html\n<script src=\"test/arrayTest.js\"></script>\n\
  ```\n\n### 测试结果\n\n当你运行测试时，测试结果看起来会像这样（index-13_1.png-13_2.png）\n\n注意，我们在 `describe`\
  \ 和 `it` 函数中输入的内容会显示在输出中。注意，也可以嵌套 `describe` 块来创建进一步的分组。让我们看看失败的测试是什么样的：\n\n```javascript\n\
  assert.equal(arr.length, 0)\n```\n\n将数字 `0` 替换为 `1`。这会导致测试失败，因为数组长度不再匹配预期值。再次运行测试，你会看到红色的失败测试，以及对错误的描述。测试的好处之一是它们能帮你更快发现\
  \ Bug，但这个错误在这方面并没有帮助。\n\n大多数断言函数还可以接收一个可选的 `message` 参数。这是当断言失败时显示的消息。使用这个参数让错误消息更易理解是一个好主意。我们可以这样为断言添加消息：\n\
  \n```javascript\nassert.equal(arr.length, 1, 'Array length was not 0')\n```\n\n\
  如果你重新运行测试，自定义消息将取代默认消息。\n\n### 整合在一起\n\n到目前为止，我们看了一些相当简单的例子。让我们把所学的知识付诸实践，看看如何测试一段更贴真实的代码。\n\
  \n这里有一个向元素添加 CSS 类的函数。它应该放在新文件 `js/className.js` 中。\n\n```javascript\nfunction addClass(el,\
  \ newClass) {\n  if(el.className.indexOf(newClass) === 1) {\n    el.className +=\
  \ newClass\n  }\n}\n```\n\n为了让它更有趣，我让它仅当该类不在元素的 `className` 属性中时添加新类 —— 毕竟谁想看到 `<div\
  \ class=\"hello hello hello\">` 呢？\n\n在理想情况下，我们在编写代码之前会为这个函数编写测试。但测试驱动开发是一个复杂的主题，目前我们只想关注编写测试。\n\
  \n为了开始，让我们回顾一下单元测试的基本思想：我们给函数某些输入，然后验证函数的行为是否符合预期。那么，这个函数的输入和行为是什么？\n\n给定一个元素和一个类名：\n\
  \n\n\n\n\n如果元素的 `className` 属性不包含该类名，则应该将其添加。\n\n如果元素的 `className` 属性已经包含该类名，则不应该将其添加。\n\
  \n让我们这些情况转换为两个测试。在测试目录中，创建一个新文件 `classNameTest.js` 并添加以下内容：\n\n```javascript\ndescribe('addClass',\
  \ function() {\n  it('should add class to element');\n  it('should not add a class\
  \ which already exists');\n})\n```\n\n我们对措辞进行了微调，使用了测试中常用的 \"it should do X\"（它应该执行\
  \ X）形式。这意味着它读起来更顺畅一些，但本质上与我们上面列出的可读性形式相同。从想法到测试通常并不比这困难得多。\n\n但等一下，测试函数在哪里呢？嗯，当我们省略\
  \ `it` 的第二个参数时，Mocha 会在测试结果中将这些测试标记为 `pending`（待定）。这是一种设置多个测试的方便方法——就像是你打算编写内容的待办事项列表一样。\n\
  \n让我们继续实现第一个测试。\n\n```javascript\ndescribe('addClass', function() {\n  it('should\
  \ add class to element', function() {\n    var element = { className: '' };\n  \
  \  addClass(element, 'testclass');\n    assert.equal(element.className, 'testclass');\n\
  \  });\n\n  it('should not add a class which already exists');\n})\n```\n\n在这个测试中，我们创建了一个\
  \ `element` 变量并将其作为参数传递给 `addClass` 函数，同时带有字符串 `testclass`（要添加的新类名）。然后，我们使用断言检查该类是否包含在值中。\n\
  \n再次，我们从最初的想法——给定一个元素和一个类名，它应该被添加到类列表中——并以相当直接的方式将其转换为代码。\n\n尽管此函数设计为与 DOM 元素工作，但我们在这里使用了一个普通的\
  \ JS 对象。有时我们可以利用 JavaScript 的这种动态特性来简化测试。如果我们不这样做，就需要创建一个真实的元素，这会增加测试代码的复杂性。作为一个额外的好处，由于我们没有使用\
  \ DOM，如果如果我们愿意，也可以在 Node.js 中运行此测试。\n\n### 在浏览器中运行测试\n\n要在浏览器中运行测试，你需要将 `className.js`\
  \ 和 `classNameTest.js` 添加到运行器中：\n\n```html\n<! 在此处加载你想要测试的代码 >\n<script src=\"js/className.js\"\
  ></script>\n<! 在此处加载你的测试文件 >\n<script src=\"test/classNameTest.js\"></script>\n\
  ```\n\n你现在应该看到一个测试通过了，另一个测试显示为待定，如下面的 CodePen 所示。注意，代码与示例略有不同，以便代码在 CodePen 环境中正常运行。\n\
  \n实时代码！\n查看 Pen Unit Testing with Mocha (1),\n\n接下来，让我们实现第二个测试……\n\n```javascript\n\
  it('should not add a class which already exists', function() {\n  var element =\
  \ { className: 'exists' };\n  addClass(element, 'exists');\n  var numClasses = element.className.split('\
  \ ').length;\n  assert.equal(numClasses, 1);\n})\n```\n\n经常运行测试是一个好习惯，所以让我们检查一下现在运行测试会发生什么。正如预期的，它们应该会通过。\n\
  \n这是另一个实现了第二个测试的 CodePen。\n\n实时代码！\n查看 Pen Unit Testing with Mocha (2),\n\n等一下！我其实稍微耍了一下你们。这个函数还有第三种我们还没有考虑的行为。函数中还有一个\
  \ bug——一个相当严重的 bug。\n\n它只是一个三行的函数，但你注意到了吗？\n\n让我们为第三种行为再写一个测试，顺便暴露这个 bug。\n\n```javascript\n\
  it('should append new class after existing one', function() {\n  var element = {\
  \ className: 'exists' };\n  addClass(element, 'newclass');\n  var classes = element.className.split('\
  \ ');\n  assert.equal(classes[1], 'newclass');\n})\n```\n\n这次测试失败了。你可以在下面的 CodePen\
  \ 中看到它的运行情况。这里的问题很简单：元素中的 CSS 类名应该用空格隔开。然而，我们目前对 `addClass` 的实现并没有空格！\n\n实时代码！\n\
  查看 Pen Unit Testing with Mocha (3)。\n\n让我们修复函数并让测试通过。\n\n```javascript\nfunction\
  \ addClass(el, newClass) {\n  if(el.className.indexOf(newClass) !== 1) {\n    return;\n\
  \  }\n  if(el.className !== '') {\n    //确保类名用空格隔开\n    newClass = ' ' + newClass;\n\
  \  }\n  el.className += newClass;\n}\n```\n\n这是一个带有修复后的函数和通过测试的最后一个 CodePen。\n\n\
  实时代码！\n查看 Pen Unit Testing with Mocha (4)。\n\n### 在 Node 上运行测试\n\n在 Node 中，事物只对同一个文件中的其他事物可见。由于\
  \ `className.js` 和 `classNameTest.js` 在不同的文件中，我们需要找到一种让它们相互可见的方法。实现此点的标准方法是使用 `module.exports`。如果你需要复习，可以在这里阅读相关内容：Understanding\
  \ module.exports and exports in Node.js\n\n代码基本上保持不变，但结构略有不同：\n\n```javascript\n\
  // className.js\nmodule.exports = {\n  addClass: function(el, newClass) {\n    if(el.className.indexOf(newClass)\
  \ !== 1) {\n      return;\n    }\n    if(el.className !== '') {\n      //确保类名用空格隔开\n\
  \      newClass = ' ' + newClass;\n    }\n    el.className += newClass;\n  }\n};\n\
  ```\n\n\n\n\n当开发者们努力让 JavaScript 的灵活性与浏览器文档对象模型（DOM）的复杂性相匹配时，现实世界中的实际 JavaScript\
  \ 代码通常看起来像这样：\n\n```javascript\nvar result;\n\nfunction getText() {\n  var someText\
  \ = prompt(\"Give me something to capitalize\");\n  capWords(someText);\n  alert(result.join(\"\
  \ \"));\n}\n\nfunction capWords(input) {\n  var counter;\n  var inputArray = input.split(\"\
  \ \");\n  var transformed = \"\";\n  result = [];\n  for (counter = 0; counter <\
  \ inputArray.length; counter++) {\n    transformed = [\n      inputArray[counter].charAt(0).toUpperCase(),\n\
  \      inputArray[counter].substring(1)\n    ].join(\"\");\n    result.push(transformed);\n\
  \  }\n}\n\ndocument.getElementById(\"main_button\").onclick = getText\n```\n\n这段短小的代码片段发生了发生了事情。变量在全局作用域被定义。值在函数之间传递并修改。DOM\
  \ 方法与原生 JavaScript 混合在一起。函数名没有很好的描述性，这部分程度上是因为整个东西依赖于一个可能存在也可能不存在的上下文。但如果你恰好在定义了\
  \ `<button id=\"main_button\">` 的 HTML 文档浏览器中运行这段代码，你可能会被输入某些文本进行处理，然后看到一个弹窗，其中该文本中每个单词的首字母已大写。\n\
  \n这种命令式代码的设计是为了从上到下读取和执行的（忽略少量的变量提升）。但我们可以利用 JavaScript 的面向对象特性进行一些改进，以清理这些代码并使其更具可读性。\n\
  \n# 面对象的 JavaScript\n\n几年后，开发者们开始注意到在浏览器等共享环境中使用命令式编码的问题。来自一个 JavaScript 代码段的全局变量会覆盖另一个代码段设置的全局变量。代码调用的顺序会以不可预测的方式影响结果，特别是考虑到网络连接和渲染时间带来的延迟。\n\
