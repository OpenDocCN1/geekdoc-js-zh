  ![](img/index-92_170.png)\n![](img/index-92_171.png)\n![](img/index-92_172.png)\n\
  ![](img/index-92_173.png)\n![](img/index-92_174.png)\n\n要检索所有用户文档，你可以这样操作：\n\n```\n\
  db.users.find().pretty()\n```\n\n{\n  \"_id\" : ObjectId(\"5a52cb2451dd8b08d5a22cf5\"\
  ),\n  \"name\" : \"Tom\",\n  \"age\" : 33,\n  \"email\" : \"tom@example.com\"\n\
  }\n\n{\n  \"_id\" : ObjectId(\"5a52cb2451dd8b08d5a22cf6\"),\n  \"name\" : \"Bob\"\
  ,\n  \"age\" : 35,\n  \"email\" : \"bob@example.com\"\n}\n\n{\n  \"_id\" : ObjectId(\"\
  5a52cb2451dd8b08d5a22cf7\"),\n  \"name\" : \"Kate\",\n  \"age\" : 27,\n  \"email\"\
  \ : \"kate@example.com\"\n}\n\n{\n  \"_id\" : ObjectId(\"5a52cb2451dd8b08d5a22cf8\"\
  ),\n  \"name\" : \"Watson\",\n  \"age\" : 15,\n  \"email\" : \"watson@example.com\"\
  \n}\n\n这对应于 SQL 数据库中的 `SELECT * FROM USERS` 查询。\n\n`pretty` 方法是一个游标方法，还有许多其他方法。你可以链用这些方法来修改你的查询以及查询返回的文档。\n\
  \n如果你需要过滤查询并返回集合的子集怎么办？例如，查找所有年龄小于 30 岁的用户。你可以这样修改查询：\n\n```\ndb.users.find({ \"\
  age\": { $lt: 30 } })\n```\n\n{ \"_id\" : ObjectId(\"5a52cb2451dd8b08d5a22cf7\"\
  ), \"name\" : \"Kate\", \"age\" : 27, \"email\" : \"kate@example.com\" }\n{ \"_id\"\
  \ : ObjectId(\"5a52cb2451dd8b08d5a22cf8\"), \"name\" : \"Watson\", \"age\" : 15,\
  \ \"email\" : \"watson@example.com\" }\n\n`$lt` 是一个查询过滤器运算符，用于选择 `age` 字段值小于 30\
  \ 的文档。有很多比较和逻辑查询过滤器可用，你可以在查询选择器（Query Selector）文档中查看完整列表。\n\n## 更新操作\n\n更新操作修改集合中的文档。与创建操作类似，MongoDB\
  \ 提供了两种更新文档的方法。它们是：\n1. `db.collection.updateMany(filter, update, options)`\n2.\
  \ `db.collection.updateMany(filter, update, options)`。\n\n如果你需要向集合中的文档添加一个额外的字段，例如\
  \ `registration`，你可以：\n\n```javascript\ndb.collection.updateMany({ \"age\": { $lt:\
  \ 30 } }, { $set: { \"registration\": \"active\" } })\n```\n\n## 删除操作\n\n删除操作从集合中移除文档。与更新操作类似，MongoDB\
  \ 提供了两种删除文档的方法。它们是：\n1. `db.collection.deleteOne(filter)`\n2. `db.collection.deleteMany(filter)`。\n\
  \n如果你需要删除匹配条件的单个文档，你可以使用：\n\n```\ndeleteOne({ \"name\": \"Tom\" })\n```\n\n如果你需要删除匹配条件的所有文档，你可以使用：\n\
  \n```\ndeleteMany({ $lt: 30 })\n```\n\n## 驱动概览\n\n为了让应用程序与服务器通信，你需要使用驱动。MongoDB\
  \ 有官方和第三方驱动可以与数据库交互。\n\n### Node JS 驱动\n\n这是 Node.js 的官方驱动。该驱动可以使用 Promise 或回调与数据库交互。下面的示例演示了连接服务器：\n\
  \n```javascript\nconst MongoClient = require('mongodb');\nconst assert = require('assert');\n\
  \n// 连接 URL\nconst url = 'mongodb://localhost:27017/exampledb';\n// 数据库名称\nconst\
  \ dbName = 'exampledb';\n\n(async function() {\n  let client;\n  try {\n    // 尝试连接服务器\n\
  \    client = await MongoClient.connect(url);\n    console.log(\"成功连接到服务器.\");\n\
  \    const db = client.db(dbName);\n  } catch (err) {\n    // 将错误打印到控制台\n    console.log(err.stack);\n\
  \  }\n\n  if (client) {\n    client.close();\n  }\n})();\n```\n\n### Mongoose 驱动\n\
  \n另一个流行的 MongoDB 驱动是 Mongoose。它是构建在官方驱动之上的。当 Mongoose 发布时，它拥有许多原生驱动不具备的功能。一个显著的功能是可以定义映射到数据库集合的模式（schema）。\n\
  \n然而，MongoDB 的最新版本已以 JSON schema 和模式验证的形式吸收了这些功能。\n\n除了模式之外，Mongoose 的其他功能还包括模型、验证器和中间件、populate\
  \ 方法、插件等。你可以在 Mongoose 文档中了解更多这些内容。这里有一个使用 mongoose.connect() 连接数据库的示例：\n\n```javascript\n\
  var mongoose = require('mongoose');\n\n// 连接 URL\nconst url = 'mongodb://localhost:27017/exampledb';\n\
  \nmongoose.connect(url);\n\nvar db = mongoose.connection;\n\ndb.on('error', console.error.bind(console,\
  \ 'connection error:'));\n\ndb.once('open', function() {\n  // 我们已经连接上了！\n});\n\
  ```\n\n## 结论\n\nMongoDB 是一种流行的 NoSQL 数据库解决方案，适用于现代开发需求。在本教程中，我们涵盖了 MongoDB 的基础知识、Mongo\
  \ Shell 以及一些流行的驱动。我们还探索了 Mongo Shell 中常见的数据库操作和 CRUD 操作。现在是你去尝试这里涵盖的内容以及更多内容的时候了。如果你想学习更多，我建议使用\
  \ MongoDB 和 Node 创建一个 REST API，以熟悉常见的数据库操作和方法。\n\n\n\n\n\n# 第一章\n# 第二章\n# 第三章\n\
