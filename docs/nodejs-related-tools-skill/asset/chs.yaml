  除了通过 `for` 循环来增加进度外，这些方法产生了修改自身之外变量的副作用。\n\n这一切使得代码变得脆弱、不易移植，并且更难在狭窄的上下文中测试这些方法。\n\
  \n### 函数式 JavaScript\n\n面向对象的方法比我们开始的命令式方法更清晰、模块化，但让我们看看如何通过解决我们讨论过的缺点来改进它。如果我们能找到利用\
  \ JavaScript 将函数视为一等对象的方法，我们的代码将会变得更简洁、稳定且更容易复用。\n\n```javascript\n(function() {\n\
  \  \"use strict\"\n  var capify = function(str) {\n    return [str.charAt(0).toUpperCase(),\
  \ str.substring(1)].join(\"\")\n  }\n  var processWords = function(fn, str) {\n\
  \    return str.split(\" \").map(fn).join(\" \")\n  }\n  document.getElementById(\"\
  main_button\").addEventListener(\"click\", function(e) {\n    var something = prompt(\"\
  给我一些需要大写的字符\")\n    alert(processWords(capify, something))\n  })\n}())\n```\n\n\
  你注意到这个版本短了很多吗？我们只定义了两个函数：`capify` 和 `processWords`。这两个函数都是纯的，意味着它们不依赖调用它们的代码状态。它们不会产生修改自身之外变量的副作用。对于任何给定的参数集，函数有且只有一个结果。由于这些改进，新函数非常容易测试，并且可以从这段代码中剪切出来并在其他地方使用。\n\
  \n这里可能有一个你除非看过一些函数式代码否则不会认识的关键词。我们利用 `Array` 的新 `map` 方法将函数应用到分割字符串时产生的临时数组的每个元素上。`Map`\
  \ 只是现代浏览器和服务器端 JavaScript 解释器实现 `ECMAscript 5` 标准时提供的少量便利方法之一。\n\n\n\n\n# 任务运行器与构建流程\n\
  \n现代 Web 开发涉及：\n- 支持从脚本中移除 `console` 和 `debugger` 语句。\n- 将 ES6 编译为跨浏览器兼容的 ES5 代码。\n\
  - 代码检查和验证。\n- CSS 和 JavaScript 文件的合并与压缩。\n- 将文件部署到开发、测试和生产环境的服务器。\n\n每当你做出更改时，都必须重复这些任务。你可能初衷良好，但即使是最严谨的开发者也会忘记压缩一两个图片。随着时间的推移，生产前的任务会变得越来越繁琐且耗时；你将对那些不可避免的内容和模板更改感到恐惧。这是一项枯燥、重复的工作。把时间花在更有价值的事情上不是更好吗？\n\
  \n如果是这样，你需要一个*任务运行器*或*构建流程*。\n\n## 这听起来复杂得可怕！\n\n创建一个构建流程需要时间。它虽然比手动执行每个任务要复杂，但从长远来看，你将节省数小时的努力，减少人为错误并保持理智。请采取务实的方法：\n\
  \n1. **首先自动化最令人沮丧的任务。**\n2. **尽量不要让你的构建流程过于复杂。** 初始设置花费一两个小时完全足够。\n3. **选择一个任务运行器软件并坚持一段时间。**\
  \ 不要一时心血就切换到另一个选项。\n\n某些工具和概念对你来说可能是新的，但请深呼吸，一次专注于一件事。\n\n## 任务运行器：各种选择\n\n像 `GNU\
  \ Make` 这样的构建工具已经存在十年，但针对 Web 的任务运行器是一个相对新的现象。第一个达到临界点的是 `Grunt` —— 这是一个 Node.js\
  \ 任务运行器，它使用（最初）由 `JSON` 配置控制的插件。`Grunt` 取得了巨大成功，但也存在许多问题：\n\n1. `Grunt` 需要插件来实现文件监听等基础功能。\n\
  2. `Grunt` 插件通常执行多个任务，这使得自定义变得更加笨拙。\n3. 对于最基础任务之外的任务，`JSON` 配置可能会变得难以管理。\n4. 任务运行速度较慢，因为\
  \ `Grunt` 在每个处理步骤之间都会保存文件。\n\n许多问题在后后的版本中得到了解决，但 `Gulp` 已经到来并提供了许多改进：\n\n1. 内置了诸如文件监听等功能。\n\
  2. `Gulp` 插件（大多）设计为只做单项工作。\n3. `Gulp` 使用 `JavaScript` 配置代码，更简洁、更易读、更易于修改，并提供了更好的灵活性。\n\
  4. `Gulp` 速度更快，因为它使用 `Node.js` 流来通过一系列管道式插件传递数据。文件只在任务结束时才写入。\n\n当然，`Gulp` 本身并不完美，新的任务运行器如\
  \ `Broccoli.js`、`Brunch` 和 `webpack` 也在竞争开发者的关注。最近，`npm` 本身也被推崇为一种更简单的选择。它们都有自己的优缺点，但\
  \ `Gulp` 仍然是首选，目前有超过 40% 的 Web 开发者在使用。`Gulp` 需要 `Node.js`，虽然具备一些 `JavaScript` 知识会有帮助，但所有\
  \ Web 编程背景的开发者都会发现它很有用。\n\n## Gulp 4 如何？\n\n本教程描述了如何使用 `Gulp 3` —— 时的最新发布版本。`Gulp\
  \ 4` 已开发了一段时间，但仍然是一个测试产品。你可以使用或切换到 `Gulp 4`，但我建议在最终发布之前坚持使用版本 3。\n\n## 第 1 步：安装\
  \ Node.js\n\n可以在 `nodejs.org/download/` 下载适用于 Windows、macOS 和 Linux 的 `Node.js`。从二进制文件、包管理器和\
  \ Docker 镜像安装有多种选择，并提供了完整的说明。\n\n### 针对 Windows 用户\n\n`Node.js` 和 `Gulp` 可以在 Windows\
  \ 上运行，但如果某些插件依赖于原生 Linux 库（如图像压缩），则它们可能无法运行。Windows 的一种方案是使用新的 bash 命令行，它解决了许多问题。安装后，打开命令提示符并输入：\n\
  \n```\nnode -v\n```\n这会显示版本号。你将要大量使用 `npm` —— 用于安装模块的 `Node.js` 包管理器。\n\n### 针对\
  \ Linux 用户\n\n`Node.js` 模块可以全局安装到整个系统中。然而，大多数用户没有权限写入全局目录。\n\n\n\n\n\n![](img/index-28_170.png)\n\
  ![](img/index-28_171.png)\n![](img/index-28_172.png)\n![](img/index-28_173.png)\n\
  ![](img/index-28_174.png)\n![](img/index-28_175.png)\n![](img/index-28_176.png)\n\
  ![](img/index-28_177.png)\n![](img/index-28_178.png)\n![](img/index-28_179.png)\n\
  ![](img/index-28_180.png)\n\n除非在 `npm` 命令前加了 `sudo`，否则会访问全局目录。有许多方法可以修复 `npm` 权限，像\
  \ `nvm` 等工具可以提供帮助，但我经常更改默认目录。例如，在 Ubuntu/Debian 平台平台上：\n\n```bash\ncd ~\nmkdir .node_modules_global\n\
  npm config set prefix=$HOME/.node_modules_global\nnpm install npm -g\n```\n\n然后，将以下行添加到\
  \ `~/.bashrc` 的末尾：\n\n```bash\nexport PATH=\"$HOME/.node_modules_global/bin:$PATH\"\
  \n```\n\n最后，使用此命令更新：\n\n```bash\nsource ~/.bashrc\n```\n\n## 第 2 ：全局安装 Gulp\n\n\
  全局安装 Gulp 命令行界面，以便可以在任何项目文件夹中运行 `gulp` 命令：\n\n```bash\nnpm install gulp-cli -g\n\
  ```\n\n使用此命令验证 Gulp 是否已安装：\n\n```bash\ngulp v\n```\n\n## 第 3 ：配置你的项目\n\n### 针对 Node.js\
  \ 项目\n\n如果你已经有了 `package.json` 配置文件，可以跳过此步骤。\n\nNode.js 项目注意：如果你已经有了 `package.json`\
  \ 配置文件，可以跳过此步骤。\n\n假设你在 `project1` 文件夹中有一个新项目或现有的项目。进入该文件夹并使用 `npm` 初始化它：\n\n```bash\n\
  cd project1\nnpm init\n```\n\n你将被问一系列问题。输入值或按回车键接受默认值。完成后，将创建一个 `package.json` 文件，其中存储了你的\
  \ `npm` 配置设置。\n\n### Git 用户\n\nNode.js 将模块安装到 `node_modules` 文件夹中。你应该将其添加到 `.gitignore`\
  \ 文件中，以确保它们不会被提交到存储库。\n\n当将项目部署到另一台电脑时，你可以运行 `npm install` 来恢复它们。\n\n在本文的剩余部分，我们假设你的项目文件夹包含以下子文件夹：\n\
  \n- `src` 文件夹：预处理源文件（包含更多子文件夹：）\n    - `html`:HTML 源文件和模板\n    - `images`:原始未压缩的图像\n\
  \    - `js`:多个预处理过的脚本文件\n    - `scss`:多个预处理过的 Sass `.scss` 文件\n\n![](img/index-30_1.png)\n\
