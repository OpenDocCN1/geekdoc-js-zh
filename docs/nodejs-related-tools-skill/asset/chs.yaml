  ![](img/index-22_179.png)\n\n最终，出现了一些更好的实践来帮助封装 JavaScript 并使其更好地与 DOM 交互。上述代码的更新版本，按照面向对象的标准编写，可能如下：\n\
  \n```javascript\n(function() {\n  \"use strict\";\n\n  var SomeText = function(text)\
  \ {\n    this.text = text;\n  }\n\n  SomeText.prototype.capify = function(str) {\n\
  \    var firstLetter = str.charAt(0);\n    var remainder = str.substring(1);\n \
  \   return [firstLetter.toUpperCase(), remainder].join(\"\");\n  }\n\n  SomeText.prototype.capifyWords\
  \ = function() {\n    var result = [];\n    var textArray = this.text.split(\" \"\
  );\n    for (var counter = 0; counter < textArray.length; counter++) {\n      result.push(this.capify(textArray[counter]));\n\
  \    }\n    return result.join(\" \");\n  }\n\n  document.getElementById(\"main_button\"\
  ).addEventListener(\"click\", function(e) {\n    var something = prompt(\"Give me\
  \ something to capitalize\");\n    var newText = new SomeText(something);\n    alert(newText.capifyWords());\n\
  \  });\n}());\n```\n\n在这个面向对象的版本中，构造函数模拟了类来建模我们想要的对象。方法位于新对象的原型上以保持低内存占用。所有的代码都隔离在一个匿名的立即执行表达式中，这样它们就不会污染全局作用域。这里甚至有一个\
  \ `use strict` 指令来利用最新的 JavaScript 引擎，而且旧式的 `onclick` 方法被全新的 `addEventListener`\
  \ 取代了，因为谁还会用 IE8 或更早的版本呢？这样的脚本可能会被插入到 HTML 文档 `<body>` 元素的结尾，以确保在处理之前所有 DOM 都已加载，这样它依赖的\
  \ `<button>` 就是可用的。\n\n\n\n\n尽管经过了所有重构，但仍然存在许多导致我们陷入这种境地的命令式风格遗迹。构造函数中的方法依赖于作用域在父对象的变量。有一个循环结构用于遍历字符串数组中的所有成员。有一个没有任何用处的计数器变量。\n\
