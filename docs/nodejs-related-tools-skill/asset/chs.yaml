  \  },\n  config: { auth: false }\n}\n```\n\n\n\n\n# Express.js\n\nExpress.js 是一个\
  \ Node.js 框架，因其简单性而赢得了巨大的人气。它提供了路由和对视图引擎的支持，远优于基础 Node 服务器。\n\n## 亮点\n\n然而，启动一个\
  \ Express 应用需要一些模板代码：启动服务器实例、配置视图引擎以及设置错误处理。\n\n## 支持\n\n虽然有各种启动项目和模板，但 Express\
  \ 有一个自己的命令行工具用于启动应用，名为 `expressgenerator`。\n\n## 什么是 Express?\n\nExpress 内置许多功能，还可以与其他包无缝集成获取更多功能，但它原生提供了三个核心功能：\n\
  \n1. **路由**：这是通过 `/home`、`/blog` 和 `/about` 提供不同页面的方式。Express 允许将不同的路由放在不同的文件中，实现模块化。\n\
  2. **中间件**：如果你对这个术语陌生，中间件基本上是“软件胶水”。它在路由获取请求之前访问请求，处理 Cookie 解析、文件上传、错误等问题。\n3.\
  \ **视图**：这是渲染自定义 HTML 页的方式。传递要渲染的数据，Express 将使用你提供的视图引擎进行渲染。\n\n## 如何开始\n\n使用 Express\
  \ 生成器启动新项目只需运行几条命令：\n\n```bash\nnpm install expressgenerator -g\nexpress myapp\n\
  cd myapp\nnpm install\n```\n\nexpressgenerator 包含了几个 Express 服务器常用的依赖项。如果前端和 API\
  \ 不在同一域名下，你需要开启 CORS：\n\n```javascript\nconst express = require('express')\nconst\
  \ server = express({\n  host: 'localhost',\n  port: 3000,\n  cors: {\n    origin:\
  \ true\n  }\n})\n```\n\n如果前端和 API 在同一域名下，你就不需要考虑 CORS：\n\n```javascript\nconst server\
  \ = express({\n  host: 'localhost',\n  port: 3000\n})\n```\n\n\n\n\n`c less|stylus|compass|sass`。默认情况下，生成器会为你创建一个基础的\
  \ CSS 文件，但选择 CSS 引擎将为你的新应用配置中间件，以编译上述任何选项。\n\n现在我们已经设置好了项目并安装了依赖，可以通过运行以下命令来启动新服务器：\n\
  \n```bash\nnpm start\n```\n\n然后，在浏览器中访问 `http://localhost:3000`。\n\n# 应用结构\n\n生成的\
  \ Express 应用最初包含四个文件夹。\n\n## BIN\n`bin` 文件夹包含启动应用程序的可执行文件。它会启动服务器（如果没有提供备选端口，则在\
  \ `3000` 端口启动）并设置一些基本的错误处理。你不需要真正担心这个文件，因为 `npm start` 会为你运行它。\n\n## PUBLIC\n`public`\
  \ 文件夹是重要的文件夹之一：\n\n* 此文件夹中的所有内容都都可以被连接到你应用程序的人访问。在这个文件夹中，你将放置用户访问你的网站时所需的 JavaScript、CSS、图像和其他资产。\n\
  \n## ROUTES\n`routes` 文件夹是你存放路由文件的地方。生成器创建了两个文件 `index.js` 和 `users.js`，它们作为如何分离应用程序路由配置的示例。\n\
  \n通常，这里会为你网站上的每个主要路由准备不同的文件。因此，你可能在这个文件夹中拥有名为 `blog.js`、`home.js` 和/或 `about.js`\
  \ 的文件。\n\n## VIEWS\n`views` 文件夹存放模板引擎使用的文件的地方。生成器会配置 Express，以便在你调用 `render` 方法时在此处查找匹配的视图。\n\
  \n在这些文件夹之外，有一个文件你应该非常熟悉。\n\n### app.js\n`app.js` 文件非常特殊，因为它设置了你的 Express 应用程序并将所有不同部分胶合在一起。让我们来看一下它的功能。以下是文件的开头部分：\n\
  \n```javascript\nvar express = require('express')\nvar path = require('path')\n\
  var favicon = require('servefavicon')\nvar logger = require('morgan')\nvar cookieParser\
  \ = require('cookieparser')\nvar bodyParser = require('bodyparser')\n```\n\n该文件的前六行是引入（requires）。如果你是\
  \ Node 的初学者，请务必阅读《理解 Node.js 中的 `module.exports` 和 `exports`》。\n\n```javascript\n\
  var routes = require('./routes/index')\nvar users = require('./routes/users')\n\
  ```\n\n接下来的两行代码引入了 Express 生成器默认设置的不同路由文件：`routes` 和 `users`。\n\n```javascript\n\
  var app = express()\n```\n\n之后，我们通过调用 `express()` 创建一个新的应用。`app` 变量包含了应用程序的所有设置和路由。这个对象将你的应用程序胶合在一起。\n\
  \n```javascript\napp.set('views', path.join(__dirname, 'views'))\napp.set('view\
  \ engine', 'jade')\n```\n\n一旦创建了 `app` 实例，就会设置用于渲染视图的模板引擎。如果你想更改视图文件的路径，可以在这里修改。\n\
  \n之后，你会看到 Express 正在配置使用中间件。生成器安装了几个你可能在 Web 应用中常用的常用中间件。\n\n```javascript\napp.use(favicon(path.join(__dirname,\
  \ 'public', 'favicon.ico')))\napp.use(logger('dev'))\napp.use(bodyParser.json())\n\
  app.use(bodyParser.urlencoded({ extended: false }))\napp.use(cookieParser())\napp.use(express.static(path.join(__dirname,\
  \ 'public')))\n```\n\n- `favicon`。这个非常不而自明：它只是从你的 `public` 目录中提供 `favicon.ico`。\n\
  - `logger`。当你运行应用时，你可能会注意到所有请求的路由都记录在控制台中。如果你想禁用此，可以直接注释掉这个中间件。\n- `bodyParser`。你可能会注意到有两行用于解析传入的\
  \ HTTP 请求体。第一行处理通过 `POST` 请求发送的 JSON，并将这些数据放入 `request.body`。第二行解析 URL 中的查询字符串数据（例如\
  \ `/profile?id=5`）并将其放入 `request.query`。\n- `cookieParser`。它获取客户端发送的所有 cookie 并将其放入\
  \ `request.cookies` 中。它还允许你在将其发送回客户端之前通过更改 `response.cookies` 来修改它们。\n- `express.static`。此中间件从你的\
  \ `public` 文件夹中提供静态资产。如果你想重命名或移动 `public` 文件夹，可以在这里更改路径。\n\n接下来是路由：\n\n```javascript\n\
  app.use('/', routes)\napp.use('/users', users)\n```\n\n在这里，引入的示例路由文件被挂载到我们的 `app`\
  \ 上。如果你需要添加额外的路由，请在此处进行。\n\n此后的所有代码都用于错误处理。除非你想更改 Express 处理错误的方式，否则你通常不需要修改这些代码。默认情况下，它被设置为在开发模式下显示路由中发生的错误。\n\
  \n# 一个实用的工具\n\n希望你现在已经清楚了 `expressgenerator` 工具在启动新的基于 Express 的项目时，如何节省你编写重复样板代码的时间。通过提供合理的默认文件结构，并安装和连接通常所需的中间件，生成器只需几条命令就能为新应用奠定坚实的基础。\n\
  \n# MongoDB 简介\n\n作者：MANJUNATH M\n\nMongoDB 是一个开源、面向文档的 NoSQL 数据库。如果你接触过传统的关系型数据库，面向文档的\
  \ NoSQL 数据库的想法听起来确实很奇怪。“数据库怎么没有表？”，你可能会这样想。\n\n以下是官方文档对 MongoDB 的描述：MongoDB 是由 MongoDB\
  \ Inc 开发的可扩展灵活数据库，以 JSON 类文档存储数据。\n\nNoSQL 数据库中的文档对应 SQL 数据库中的行。一组文档被称为集合，它大致同于关系型数据库中的表。关于\
  \ NoSQL 和 SQL 数据库及其差异的深度概述，我们已经在 SQL vs NoSQL 教程中涵盖了。\n\n除了是一个 NoSQL 数据库，MongoDB\
  \ 还有一些自身的特性。我在下面列出了一些关键特性：\n\n- 它易于安装和设置\n- 它使用 BSON（一种 JSON 类格式）存储数据，便于将文档对象映射到你的应用程序代码\n\
  - 它声具有高度的可扩展性和可用性，并内置了复制支持\n- 它支持 MapReduce 操作，将海量数据压缩为有聚合结果\n- 它是免费且开源的。\n\n\n\n\
  \nMongoDB 支持所有主流平台和发行版，如果你有疑问，可以查看它们的官方文档。\n\n我在下方涵盖了在 macOS 上安装 MongoDB 的说明。对于\
  \ Linux，MongoDB 建议使用你发行版的包管理器来帮助安装该软件。如果你使用的是 Windows，只需从 MongoDB 网站下载最新发布版本并运行交互式安装程序程序简单。\n\
  \n# 使用 Homebrew 在 macOS 上安装 MongoDB\n\nHomebrew 是适用于 macOS 的包管理器，本教程假设你已经在机器上安装了\
  \ Homebrew。\n\n1. 打开终端应用程序（terminal）并运行\n```bash\nbrew update\n```\n2. 一旦 `brew`\
  \ 更新，按照以下步骤安装 `mongodb` 包：\n```bash\nbrew install mongodb\n```\n3. 创建数据目录，以便 `mongod`\
  \ 进程能够写入数据。默认情况下，该目录为 `/data/db`：\n```bash\nmkdir -p /data/db\n```\n4. 确保你的用户账户有权限向该目录读写数据：\n\
  ```bash\nsudo chown -R $id /data/db\n```\n# 输入你的密码\n5. 启动 mongo 服务。运行 `mongod` 命令启动服务器。\n\
  6. 启动 Mongo shell。打开另一个终端窗口并运行 `mongo`。mongo shell 将尝试连接到我们之前启动的 mongo 守护进程。\n\n\
  一旦成功连接，你就可以使用 shell 作为练习场安全地运行所有命令。\n7. 运行 `quit()` 退出 Mongo shell，按 `control +\
  \ C` 停止 mongo 守护进程。\n\n现在我们已经运行了 mongo 守护进程，让我们熟悉一下 MongoDB 的基础。\n\n# 基础数据库操作\n\n\
  如果你还没有进入，请进入 Mongo shell：\n\n```bash\n[mj@localhost ~]$ mongo\nMongoDB shell version\
  \ v3.6.1\nconnecting to: mongodb://127.0.0.1:27017\nMongoDB server version: 3.6.1\n\
  connecting to: test\n```\n登录时，你可以看到我的 MongoDB shell 版本。默认情况下，你连接到 `test` 数据库。你可以通过运行\
  \ `db` 来验证当前数据库名称：\n```bash\ndb\ntest\n```\n这太棒了，但如果我们想要一个新数据库呢？要创建一个数据库，MongoDB\
  \ 有一个 `use DATABASE_NAME` 命令：\n```bash\nuse exampledb\nswitched to db exampledb\n\
  ```\n要显示所有现有数据库，尝试 `show dbs`：\n```bash\nshow dbs\nlocal 0.078GB\nprototype 0.078GB\n\
  test 0.078GB\n```\n`exampledb` 不在列表中，是因为我们需要向数据库中插入至少一个文档。要插入文档，你可以执行 `db.COLLECTION_NAME.insertOne({\"\
  key\":\"value\"})`。这里有一个示例：\n```javascript\ndb.users.insertOne({'name':'Bob'})\n\
  {\n  \"acknowledged\" : true,\n  \"insertedId\" : ObjectId(\"5a52c53b223039ee9c2daaec\"\
  )\n}\n```\nMongoDB 会自动创建一个新的 users 集合并插入一个带有键值对 `'name':'Bob'` 的文档。返回的 `ObjectId`\
  \ 是所插入文档的 id。MongoDB 在创建每个文档时都会创建一个唯一的 `ObjectId`，并成为 `_id` 字段的默认值：\n```bash\nshow\
  \ dbs\nexampledb 0.078GB\nlocal 0.078GB\nprototype 0.078GB\ntest 0.078GB\n```\n\
  同样，你可以使用 `show collections` 命令确认集合是否已创建：\n```bash\nshow collections\nusers\n```\n\
  我们已经创建了一个数据库，添加了一个名为 users 的集合并向其中插入了一个文档。现在让我们尝试删除它。要删除现有数据库，请使用如下所示的 `dropDatabase()`\
  \ 命令：\n```javascript\ndb.dropDatabase()\n{ \"ok\" : 1 }\n```\n`show dbs` 确认数据库确实已被删除：\n\
  ```bash\nshow dbs\nlocal 0.078GB\nprototype 0.078GB\ntest 0.078GB\n```\n有关更多数据库操作，请参阅\
  \ MongoDB 关于数据库命令（Database Commands）的参考页面。\n\n# MongoDB CRUD 操作\n\n你可能已经知道，CRUD\
  \ 缩写代表创建（Create）、读取（Read）、更新（Update）和删除（Delete）。这些是在构建应用程序时无法避免的四个基本数据库操作。例如，任何现代应用程序都将创建新用户、读取用户数据、更新用户信息并在必要时删除用户账户的能力。让我们使用\
  \ MongoDB 在数据库级别完成这些操作。\n\n## 创建操作 (CREATE OPERATION)\n\n创建等同于向集合中插入文档。在上一节中，我们使用\
  \ `db.collection.insertOne()` 语法插入了单个文档。还有另一种方法 `db.collection.insertMany()` 方法，它可以让你一次性插入多个文档。语法如下：\n\
  ```javascript\ndb.COLLECTION_NAME.insertMany(\n  [ <document 1>, <document 2>, ...\
  \ ]\n)\n```\n让我们创建一个 users 集合并填充一些实际用户：\n```javascript\ndb.users.insertMany([\n\
  \  { \"name\": \"Tom\",\"age\":33, \"email\": \"tom@example.com\" },\n  { \"name\"\
  :\"Bob\", \"age\":35, \"email\":\"bob@example.com\" },\n  { \"name\":\"Kate\", \"\
  age\": 27, \"email\": \"kate@example.com\" },\n  { \"name\":\"Watson\", \"age\"\
  :15, \"email\": \"watson@example.com\"}\n])\n{\n  \"acknowledged\" : true,\n  \"\
  insertedIds\" : [\n    ObjectId(\"5a52c53b223039ee9c2da5\"),\n    ObjectId(\"5a52c53b223039ee9c2da6\"\
  ),\n    ObjectId(\"5a52c53b223039ee9c2da7\")\n  ]\n}\n```\n`insertMany` 方法接受一个对象数组，返回的是一个\
  \ `ObjectId` 数组。\n\n## 读取操作 (READ OPERATION)\n\n读取操作用于从集合中检索一个或多个文档。读取操作的语法如下：\n\
  ```javascript\ndb.collection.find(query, projection)\n```\n\n\n\n\n![](img/index-92_127.png)\n\
  ![](img/index-92_128.png)\n![](img/index-92_129.png)\n![](img/index-92_130.png)\n\
