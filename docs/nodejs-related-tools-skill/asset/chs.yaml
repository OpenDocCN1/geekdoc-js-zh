  设置页面。\n\n# SAILS.JS 控制器 (CONTROLLERS)\n\n控制器持有应用程序的业务逻辑。它们位于 `api/controllers` 中，并提供了一个胶接应用程序模型和视图的层。控制器包含绑定到路由并响应来自\
  \ Web/移动客户端 HTTP 请求的操作。\n\n控制器是一个 JavaScript 对象，包含名为“控制器操作”（controller actions）的方法，这些方法接收两个参数：`request`\
  \ 和 `response`。\n\n你可以在 Sails.js 控制器页面找到更多关于控制器的信息。\n\n你可以使用 Sails.js CLI 生成控制器：`sails\
  \ generate controller product`\n\n此命令将生成一个名为 `api/controllers/ProductController.js`\
  \ 的控制器，内容如下：\n\n```javascript\n/**\n* ProductController\n*\n* @description :: 管理产品的服务器端逻辑\n\
  * @help :: http://sailsjs.org/#!/documentation/concepts/Controllers\n*/\nmodule.exports\
  \ = {\n\n}\n```\n\n代码导出一个空的 JavaScript 对象，你可以在其中添加新操作或覆盖默认（自动添加的的控制器操作。\n\n此时，你实际上可以在不添加任何代码的情况下对你的服务器执行\
  \ CRUD 操作。由于 Sails.js 遵循“约定优于配置”的原则，它会将你的控制器连接到相应的路由，并为处理常见的 POST、GET、PUT 和 DELETE\
  \ 请求提供默认操作。\n\n# 使用 POSTMAN 进行测试\n\n使用 Postman，你可以发送 POST、GET 等请求来测试你的 API，所以请\n\
  \n![](img/index-60_1.png) ![](img/index-60_2.png)\n\n获取适用于你操作系统的 Postman 版本。接下来，输入端点\
  \ URL `http://localhost:1337/product`。然后选择要发送的 HTTP 方法——在这里是 POST，因为我们要创建一个产品。接下来你需要提供数据，因此点击\
  \ *Body* 标签，选择 *Raw* 选项，然后输入以下：\n\n```json\n{\n  \"name\": \"Product 1\",\n  \"\
  description\": \"This is product 1\",\n  \"quantity\": 100\n}\n```\n\n然后点击 Send。你应该注意返回的状态码：200\
  \ OK 表示产品创建成功。\n\n你可以通过发送 GET 请求来验证产品是否创建：\n\n![](img/index-61_1.png)\n\n你还可以通过发送\
  \ PUT 请求根据 ID 更新产品：最后，你可以通过发送 DELETE 请求根据 ID 删除产品：\n\n![](img/index-62_1.png)\n\n\
  对于自定义逻辑，也可以覆盖这些操作并实现自己的逻辑。\n\n当你创建一个 API（即控制器和模型）时，Sails.js 会自动添加八个默认操作，如下：\n\n\
  - add to\n- create\n- destroy\n- find one\n- find where\n- populate where\n- remove\
  \ from\n- update\n\nfind where 和 find one，create、update 和 destroy 都是标准的 CRUD 操作\n\
  \n\n\n大多数 API 中都需要存在的操作。其他的与外键记录有关：`add to:`：用于将外键记录添加到另一个记录集中（例如将一个产品添加到用户的产品列表中）。\n\
  \n`populate where:`：用于为另一个记录的关联填充并返回外键记录。在此处查看更多信息。\n\n`remove from:`：用于从相关的记录集合关联（例如用户的产品列表）中移除外键记录（例如某个产品）。在此处查看更多信息和示例。\n\
  \n若要自定义默认操作的行为，你可以采取以下任一方法：\n\n1. 在指定的控制器中覆盖（Override）操作。也就是说，创建一个与这些操作之一同名的操作：`find`、`findOne`、`create`、`update`、`destroy`、`populate`、`add`\
  \ 或 `remove`。\n2. 覆盖所有控制器的默认操作。你可以通过创建一个 `api/blueprints` 文件夹来实现，你需要在其中添加以默认操作小写命名的文件（例如\
  \ `find.js`、`findone.js`、`create.js` 等）。你可以通过检查 Sails.js Blueprint API 文档找到更多关于蓝图的信息。\n\
  \n# SAILS.JS 中的路由\n\n路由（Routes）允许你将 URL 映射到控制器或视图。与默认操作一样，Sails.js 会自动为默认操作添加默认路由，让你只需创建模型和控制器即可拥有自动\
  \ API。\n\n你也可以为自定义操作或视图添加自定义路由。要添加路由，请打开 `config/routes.js` 文件并添加以下内容：\n\n```javascript\n\
  module.exports.routes = {\n  '/products': {\n    view: 'products'\n  }\n}\n```\n\
  \n这将 `/products` 映射到 `views` 文件夹中名为 `products` 的模板。\n\n你可以选择性在 URL 中添加 HTTP 动词。例如：\n\
  \n```javascript\nmodule.exports.routes = {\n  'get /': {\n    view: 'homepage'\n\
  \  }\n}\n```\n\n你还可以为路由指定控制器操作。例如：\n\n```javascript\nmodule.exports.routes = {\n\
  \  'post /product': 'ProductController.create',\n}\n```\n\n这告诉 Sails.js 当客户端向 `/product`\
  \ 端点发送 POST 请求时，调用 `ProductController` 控制器的 `create` 操作。\n\n## 结论\n\n在本章中，你接触了 Sails.js。我们学习了\
  \ Sails.js 的基本概念、如何生成一个新的 Sails.js 项目，然后通过仅生成模型、添加一些属性并生成控制器创建了一个 API。Sails.js 还有其他高级概念，如服务（services）、策略（policies）、蓝图（blueprints）和钩子（hooks）。一旦掌握并熟悉了本介绍中的基本概念，你就可以进一步发现它们。\n\
