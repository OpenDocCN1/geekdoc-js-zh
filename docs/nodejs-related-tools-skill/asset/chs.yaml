  ![](img/index-37_167.png)\n![](img/index-37_168.png)\n\n首先，安装所有模块：\n\n`npm install\
  \ gulpsass gulppostcss postcssassets autoprefixer cssmqpacker cssnano savedev` 在\
  \ `gulpfile.js` 的顶部引用它们：\n\n```javascript\nvar\n\n...\n\nsass = require('gulpsass'),\n\
  postcss = require('gulppostcss'),\nassets = require('postcssassets'),\nautoprefixer\
  \ = require('autoprefixer'),\nmqpacker = require('cssmqpacker'),\ncssnano = require('cssnano'),\n\
  ```\n\n我们现在可以在 `gulpfile.js` 的结尾创建一个新的 css 任务。注意 `images` 任务被设置为依赖，因为 `postcssassets`\
  \ 插件在构建过程中可以引用图像。此外，大多数插件都可以传递参数（请阅其文档获取更多信息）：\n\n```javascript\n// CSS processing\n\
  \ngulp.task('css', ['images'], function() {\n  var postCssOpts = [\n\n    assets({\
  \ loadPaths: ['images/'] }),\n```\n\n\n\n\n```javascript\nautoprefixer({ browsers:\
  \ ['last 2 versions', '> 2%'] }), mqpacker\n\nif (!devBuild) {\n  postCssOpts.push(cssnano)\n\
  }\n\nreturn gulp.src(folder.src + 'scss/main.scss')\n  .pipe(sass({\n    outputStyle:\
  \ 'nested',\n    imagePath: 'images/',\n    precision: 3,\n    errLogToConsole:\
  \ true\n  }))\n  .pipe(postcss(postCssOpts))\n  .pipe(gulp.dest(folder.build + 'css/'));\n\
  })\n```\n\n保存文件并在命令行运行任务：`gulp css`\n\n## 第 6 步：自动化任务\n\n我们之前是一次运行一个任务。我们可以通过向 `gulpfile.js`\
  \ 中添加一个新的运行任务，在一个命令中运行所有任务：\n\n```javascript\n// 运行所有任务\ngulp.task('run', ['html',\
  \ 'css', 'js'])\n```\n\n保存并在命令行输入 `gulp run` 来执行所有任务。请注意，我省略了 `images` 任务，因为它已经被设置为\
  \ `html` 和 `css` 任务的依赖项。\n\n这仍然太费力了吗？Gulp 提供了另一种方法 —— `gulp.watch` ——它可以监控监控源文件并在文件发生更改时运行相应的任务。\n\
  \n该方法接收一个文件夹和一个在发生更改时要执行的任务列表。让我们在 `gulpfile.js` 的末尾创建一个新的监听任务：\n\n```javascript\n\
  // 监听变化\ngulp.task('watch', function() {\n  // 变化变化\n  gulp.watch(folder.src + 'images/**/*',\
  \ ['images'])\n  // html 变化\n  gulp.watch(folder.src + 'html/**/*', ['html'])\n\
  \  // javascript 变化\n  gulp.watch(folder.src + 'js/**/*', ['js'])\n  // css 变化\n\
  \  gulp.watch(folder.src + 'scss/**/*', ['css'])\n})\n```\n\n与其立即运行 `gulp watch`，让我们添加一个默认任务：\n\
  \n```javascript\n// 默认任务\ngulp.task('default', ['run', 'watch'])\n```\n\n保存 `gulpfile.js`\
  \ 并在命令行输入 `gulp`。你的图片、HTML、CSS 和 JavaScript 都将进行处理，然后 Gulp 将保持激活状态，等待更新并在需要时重新运行任务。按下\
  \ `Ctrl/Cmd + C` 终止监控并返回命令行。\n\n## 第 7 步：大获丰收！\n\n其他你可能发现的插件：\n\n- `gulploadplugins`\
  \ ± 无需 require 声明即可加载所有 Gulp 插件模块\n- `gulppreprocess` — 一个简单的 HTML 和 JavaScript\
  \ 预处理器\n- `gulpless` — Less CSS 预处理器插件\n- `gulpstylus` — Stylus CSS 预处理器插件\n- `gulpsequence`\
  \ — 按特定顺序运行一系列 gulp 任务\n- `gulpplumber` — 错误处理，防止 Gulp 在失败时停止\n- `gulpsize` — 显示文件大小和节省的体积\n\
  \n`gulpnodemon` — 使用 nodemon 在发生更改时自动重启 Node.js 。\n\n`gulputil` — 工具函数，包括日志记录和颜色编码。\n\
  \n`gulputil` 中一个有用的方法是 `.noop()`，它直接传递数据而不执行任何操作。这可以用于更整洁的开发/生产处理代码。例如：\n\n```javascript\n\
  var gutil = require('gulputil')\n\n// HTML 处理\ngulp.task('html', ['images'], function()\
  \ {\n  var out = folder.src + 'html/**/*'\n  return gulp.src(folder.src + 'html/**/*')\n\
  \    .pipe(newer(out))\n    .pipe(devBuild ? gutil.noop() : htmlclean())\n    .pipe(gulp.dest(out))\n\
  })\n```\n\nGulp 还可以调用其他 Node.js 模块，它们并不一定是插件。\n\n例如：\n\n- `browsersync` — 当发生更改时自动重新加载资源或刷新浏览器\n\
  - `del` — 删除文件和文件夹（也许可以在每次运行时清理你的构建 文件夹）。\n\n投入一点时间，Gulp 就能节省许多小时的开发沮丧。优势是：\n\n\
  - 插件非常丰富\n- 使用 pipes 进行配置易读且易于遵循\n- `gulpfile.js` 可以在其他项目中适配和复用\n- 你可以减少页面的总重量以提高性能\n\
  - 你可以简化部署。\n\n有用的链接：\n\n- Gulp 主页\n- Gulp 插件\n- npm 主页\n\n将上述过程应用于一个简单的网站，总重量减少了\
  \ 50% 以上。你可以使用页面重量分析工具或像 New Relic 服务（它提供了一系列复杂的应用程序性能监控工具）来测试你自己的结果。\n\nGulp 可以彻底改变你的工作流。希望你发现这个教程有用，并考虑在你的生产流程中使用\
  \ Gulp。\n\n***\n\n# Express, Koa 和 Hapi.js 的对比对比\n\n如果你是一个 Node.js 开发者，很有可能在某个时候用过\
  \ Express.js 来创建你的应用程序或 API。Express.js 是一个非常流行的 Node.js 框架，甚至还有其他构建在其之上的框架，如 Sails.js、kraken.js、KeystoneJS\
  \ 等许多其他。然而，在这种流行之下，其他框架在 JavaScript 世界中也受到了关注，例如 Koa 和 hapi。\n\n在这篇文章中，我们将检查 Express.js、Koa\
  \ 和 hapi.js —— 它们的相似之处、差异以及用例。\n\n## 背景\n\n让我们首先分别介绍这些框架。\n\n## EXPRESS.JS\n\nExpress.js\
  \ 被描述为 Node.js 的标准服务器框架。它由 TJ Holowchuk 创建，并在 2014 年被 StrongLoop 收购，目前由 Node.js\
  \ 孵化器维护。\n\n## KOA\n\nKoa 是 2013 年由 Express 的同事们开发的。它也被认为是更现代。\n\n## HAPI.JS\n\n\
  Hapi.js 是 Walmart 团队（由 Eran Hammer 领导）在尝试 Express 并发现其无效后开发的。随着时间的推移，它变成了一个完整的框架。*冷知识：hapi\
  \ 是 HTTP API 的缩写。*\n\n## 哲学\n\n现在有了框架的背景，让我们根据哲学、路由等重要概念对它们进行比较。\n\n## EXPRESS.JS\n\
  \nExpress 的设计目标是一个简单、无偏见的 框架。Express 的哲学是提供小型、健壮的 HTTP 工具，使其成为单页应用程序、网站、混合体或公共 API\
  \ 的绝佳解决方案。Express.js 非常开箱没有提供许多功能。它不强制文件结构、ORM 或模板引擎。\n\n## KOA\n\n虽然 Express.js\
  \ 很小，但 Koa 可以拥有更简洁的代码。它的目标是让开发者更有表现力。像 Express.js 一样，它可以使用现有的或自定义的插件和中间件进行扩展。它的方法更具未来感，因为它严重依赖较新的\
  \ JavaScript 特性，如生成器和 async/await。\n\n## HAPI.JS\n\nHapi.js 更关注配置，并开箱即提供了比 Koa 和\
  \ Express.js 更多的功能。\n\n## 启动服务器\n\n启动服务器是我们在项目中需要做的基础操作之一。让我们看看在不同的框架中如何实现。我们将在每个示例中启动服务器并监听端口\
  \ 3000。\n\n## EXPRESS.JS\n\n```javascript\nconst express = require('express')\n\
  const app = express()\n\napp.listen(3000, () => console.log('App is listening on\
  \ port 3000!'))\n```\n\n在 Express.js 中启动服务器非常简单，引入 express 包，初始化 express 应用到 app\
  \ 变量并调用 `app.listen()` 方法，该方法只是原生 Node.js `http.createServer()` 方法的封装。\n\n## KOA\n\
  \n```javascript\nconst Koa = require('koa')\nconst app = new Koa()\n```\n\n在 Koa\
  \ 中启动服务器与 Express.js 非常相似。\n\n\n\n\n\n```javascript\napp.listen(3000, () => console.log('App\
  \ is listening on port 3000!'))\n```\n\nKoa 中的 `app.listen()` 方法也是对 `http.createServer()`\
  \ 方法的封装。\n\n## HAPI.JS\n\n在 hapi.js 中启动服务器与我们许多人可能在 Express 中习惯的用法有很大不同：\n\n```javascript\n\
  const Hapi = require('hapi')\n\nconst server = Hapi.server({\n  host: 'localhost',\n\
  \  port: 3000\n})\n\nasync function start() {\n  try {\n    await server.start()\n\
  \  }\n  catch (err) {\n    console.log(err)\n    process.exit(1)\n  }\n  console.log('Server\
  \ running at:', server.info.uri)\n}\n\nstart()\n```\n\n在上面的代码块中，我们首先引入了 `hapi` 包，然后使用\
  \ `Hapi.server()` 实例化了一个服务器，该方法接受一个单一的配置对象作为参数，该对象包含了 `host` 和 `port` 参数。然后我们使用异步函数\
  \ `server.start()` 启动服务器。\n\n与 Express.js 和 Koa 不同，hapi 中的 `server.start()` 函数并不是原生\
  \ `http.createServer()` 方法的封装。相反，它实现了自己的自定义逻辑。\n\n上面的代码示例来自 hapi.js 官网，展示了 hapi.js\
  \ 创造者对配置和错误处理的重视。\n\n# 路由\n\n路由是现代 Web 应用另一个关键方面。让我们在每个框架中为简单的 Hello World 应用定义一个\
  \ `/hello` 路由，以感受路由在它们中是如何工作的。\n\n## EXPRESS.JS\n\n```javascript\napp.get('/hello',\
  \ (req, res) => res.send('Hello World!'))\n```\n\n在 Express 中创建路由就像调用带有所需 HTTP 方法的\
  \ `app` 对象一样。语法为 `app.METHOD(PATH, HANDLER)`，其中 `PATH` 是服务器上的路径，`HANDLER` 是在路径匹配时被调用的函数。\n\
  \n## KOA\n\nKoa 本身没有内置路由器，因此我们必须使用路由中间件来处理 Koa 应用中的路由。两种常见的路由选项是 `koaroute` 和 `koarouter`。这里是使用\
  \ `koaroute` 的示例：\n\n```javascript\nconst route = require('koaroute')\n\napp.use(route.get('/hello',\
  \ ctx => {\n  ctx.body = 'Hello World!'\n}))\n```\n\n我们可以立即看到，Koa 需要将每个路由定义为 `app`\
  \ 上的中间件。`ctx` 是一个包含 Node 请求和响应对象的上下文对象。`ctx.body` 是响应对象中的一个方法，可用于将响应体设置为字符串、Buffer、Stream、Object\
  \ 或 `null`。`route` 方法的第二个参数可以是异步函数或生成器函数，因此减少了回调函数的使用。\n\n## HAPI.JS\n\n```javascript\n\
  server.route({\n  method: 'GET',\n  path:'/hello',\n  handler: function (request,\
  \ h) {\n    return 'Hello world!'\n  }\n})\n```\n\nhapi 中的 `server.route()` 方法接受一个带有以下参数的单一配置对象：`method`、`path`\
  \ 和 `handler`。你可以在这里查看 hapi 路由的文档。\n\n处理器函数中的 `request` 参数是一个包含用户请求详情的对象，而 `h` 参数被描述为响应工具包（response\
  \ toolkit）。\n\n# 中间件\n\nNode 开发者习惯的主要概念之一是处理中间件。\n\n中间件函数是位于请求和响应之间的的函数。\n\n它们可以访问请求和响应对象，并在处理完后运行下一个中间件。让我们通过实现一个简单的函数，记录请求发送到服务器的时间，来看看它们在不同框架中是如何定义的。\n\
  \n## EXPRESS.JS\n\n```javascript\napp.use((req, res, next) => {\n  console.log(`Time:\
  \ ${Date.now()}`)\n  next()\n})\n```\n\n在 Express.js 中注册中间件与使用 `app.use()` 函数将中间件绑定到\
  \ `app` 对象上一样简单。你可以在这里阅读更多关于 Express.js 中间件的内容。\n\n## Koa\n\n```javascript\napp.use(async\
  \ (ctx, next) => {\n  console.log(`Time: ${Date.now()}`)\n  await next()\n})\n```\n\
  \nKoa 的中间件注册与 Express.js 类似。主要区别在于上下文对象（`ctx`）代替了 Express.js 中的请求和响应对象，并且 Koa 拥抱现代的\
  \ async/await 范式来定义中间件函数。\n\n## HAPI.JS\n\n```javascript\nserver.ext('onRequest',\
  \ (request, h) => {\n  console.log(`Time: ${Date.now()}`)\n  return h.continue\n\
  })\n```\n\n在 hapi.js 中，请求生命周期中有某些扩展点。`server.ext()` 方法注册一个扩展函数，并在请求生命周期的特定点进行调用。你可以在这里阅读更多相关信息。在上面的示例中，我们利用\
  \ `onRequest` 扩展点来注册一个中间件（或扩展）函数。\n\n# 使用\n\n从我们看到的比较和代码示例可以看出，显然 Express 和 Koa\
  \ 最相似，而 hapi.js 是偏离了 Node.js 开发者习惯的规范的框架。因此，在尝试构建快速易用的应用时，hapi.js 可能不是最佳选择。在我看来，在构建中小型应用时，Express\
  \ 仍然是一个很棒的选择。对于大型应用，它可能会变得有点复杂，因为它缺乏 hapi.js 内置的模块化支持。\n\n总之，这三个框架在启动新项目时都是很棒的选择，但你的选择将取决于项目需求、团队成员以及你所寻求的灵活性。\n\
  \n\n\n\nSails.js 是一个 Rails Web 框架，允许你快速构建 REST API、单页应用以及实时（基于 WebSockets）应用。它高层地使用了代码生成器，使你能够编写更少代码来构建应用程序——特别是那些可以通过脚架生成（scaffold）的常见代码。\n\
  \nSupport 框架构建在 `Express.js`（最流行的 Node.js 库之一）和 `Socket.io` 之上（一个为应用程序添加实时、双向、基于事件通信的\
  \ JavaScript 库/引擎）。在写作期间，Sails.js 的官方稳定版本为 `0.12.14`，可以通过 `npm` 获取。Sails.js `1.0`\
  \ 版本尚未正式发布，但根据 Sails.js 创造者的说法，1.0 版本已用于某些生产应用中，他们甚至建议在启动新项目时使用它。\n\n# 核心特性\n\n\
  Sails.js 拥有许多出色的特性：\n\n- 它基于 `Express.js` 构建\n- 它支持通过 `WebSockets` 进行实时通信\n- 它采取了“约定优于配置”的方法\n\
  - 得益于 `Blueprints`，它拥有强大的代码生成能力\n- 得益于其强大的 `Waterline` ORM/ODM，它是数据库无关的\n- 它在同一个项目中支持多个数据存储器\n\
  - 它拥有良好的文档。\n\n目前存在一些重要的缺点，例如：\n\n- `Waterline` 不支持 `JOIN` 查询\n- 直到 Sails `v1.0`（写作期间处于测试阶段）之前，尚不支持\
  \ `SQL` 事务\n- 在版本 1.0 之前，它仍然使用 `Express.js v3`，该版本已停止维护（EOL）——开发速度非常缓慢。\n\n# Sails.js\
  \ 对比 Express.js\n\n软件开发的核心在于构建抽象。Sails.js 是 `Express.js` 之上的一个高层抽象层（`Express.js`\
  \ 本身是对 Node `HTTP` 模块的抽象），它提供了路由、中间件、文件服务等功能。它还添加了强大的 ORM/ODM、MVC 架构模式以及强大的生成器 CLI（以及其他特性）。\n\
  \n你可以使用 Node 的低级 `HTTP` 服务和其他实用程序模块（如 `filesystem` 模块）构建 Web 应用程序，但除非是为了学习 Node.js\
  \ 平台，否则不建议这样做。你也可以更进一步使用 `Express.js`，这是一个用于构建 Web 应用的流行且轻量级的框架。\n\n你将拥有 Web 应用所需的路由和其他有用构建结构，但你需要处理从配置、文件结构、代码组织到数据库操作的几乎所有事务。\n\
  \n`Express` 没有提供任何帮助你访问数据库的内置工具，因此你将整合所需的技术来构建一个完整的 Web 应用程序。这就是所谓的栈（stack）。使用 JavaScript\
  \ 的 Web 开发者大多使用流行的 `MEAN` 栈，代表 `MongoDB`、`ExpressJS`、`AngularJS` 和 `Node.js`。\n\n\
  `MongoDB` 是 Node/Express 开发者首选的数据库系统，但你可以使用任何需要的数据库。这里最重要的一点是，在数据库方面，`Express` 不提供任何内置\
  \ API。\n\n# Waterline ORM/ODM\n\nSails.js 的一个关键特性是 `Waterline`，这是一个针对基于 `SQL` 的数据库的强大\
  \ ORM（对象关系映射）以及针对 `NoSQL` 文档数据库的 ODM（对象文档映射）。`Waterline` 抽象了处理数据库时所有的复杂性，最重要的是，通过\
  \ `Waterline`，你不需要在开始开发时就做出选择数据库系统的决策。当你的客户尚未决定使用的数据库技术时，它也不会让你感到无所措。\n\n你可以无需编写单行配置即可构建你的应用程序。事实上，最初完全不需要安装数据库系统。得益于内置的基于\
  \ `NeDB` 的 `sailsdisk` 文件数据库，你可以透明地使用文件系统存储和检索数据，以测试你的应用程序功能。\n\n一旦你准备就绪并决定了项目使用的便捷数据库系统，你只需通过安装对应数据库系统的相关适配器（adapter）即可切换数据库。`Waterline`\
  \ 为流行的关系型数据库系统（如 `MySQL` 和 `PostgreSQL`）以及 `NoSQL` 数据库（如 `MongoDB` 和 `Redis`）提供了官方适配器，社区还为其他流行的数据库系统（如\
  \ `Oracle`、`MSSQL`、`DB2`、`SQLite`、`CouchDB` 和 `neo4j`）构建了大量适配器。如果找不到所需的适配器，你可以开发自定义的适配器。\n\
  \n`Waterline` 抽象了不同数据库系统之间的差异，允许应用程序通过标准化的接口与任何支持的数据库系统进行通信。你不需要处理 `SQL` 或任何低级 API（针对\
  \ `NoSQL` 数据库），但这并不意味着你不能这样做（至少对于基于 `SQL` 的数据库和 `MongoDB`）。\n\n在某些情况下你需要编写自定义 `SQL`，例如出于性能考虑、处理复杂的数据库需求或访问特定的数据库功能。在这种情况下，可以使用仅适用于配置为使用\
  \ `SQL` 系统的 Waterline 模型的 `.query()` 方法（你可以在文档中找到更多关于 `query()` 的信息）。\n\n由于不同的数据库系统具有通用特性和特定特性，`Waterline`\
  \ ORM/ODM 只有在你仅限制于使用通用特性时才对你有益处。此外，如果你使用原始 `SQL` 或原生 `MongoDB` API，你将失去许多 `Waterline`\
  \ 的特性。\n\n# 开始使用 Sails.js\n\n现在我们已经涵盖了 Sails.js 的基本概念和特性，让我们如何使用 Sails.js 快速上手。\n\
  \n## 先决条件\n\n![](img/index-52.jpg)## 先决条件\n\n在使用 Sails.js 之前，你需要一个安装了 `Node.js`（以及\
  \ `npm`）的开发环境。你可以访问 Node.js 网站并下载安装程序来安装它们。\n\n同时，确保安装了你想配合 Sails.js 使用的数据库管理系统（无论是关系型还是\
  \ `NoSQL` 数据库）。如果你现在不想使用完整的数据库系统，由于 `sailsdisk` 的存在，你仍然可以工作。\n\n## 安装 Sails.js CLI\n\
  \n满足开发要求后，进入终端（Linux 和 macOS）或命令提示符（Windows），通过 `npm` 全局安装 Sails.js 命令行工具：\n\n```\n\
  sudo npm install sails g\n```\n\n如果你想安装最新的 *1.0* 版本来尝试新功能，需要使用 beta 版本：\n\n```bash\n\
  npm install sails@beta g\n```\n\n根据你的 npm 配置，全局安装包可能需要 `sudo`。\n\n## 脚生成 Sails.js\
  \ 项目\n\n完成后，你可以通过一个命令脚生成新项目：\n\n```bash\nsails new sailsdemo\n```\n\n这将在当前目录下创建一个名为\
  \ `sailsdemo` 的项目文件夹。你也可以在现有文件夹内脚生成项目文件：\n\n```bash\nsails new .\n```\n\n你可以通过以下命令生成一个没有前端的\
  \ Sails.js 项目：\n\n```bash\nsails new sailsdemo nofrontend\n```\n\n从文档中可以更多关于 CLI\
  \ 特性的信息。\n\n# Sails.js 项目结构\n\n这是使用 Sails.js CLI 生成的项目截图：\n\n![](img/index-54.png)\n\
  \n一个 Sails.js 项目是一个 Node.js 模块，包含 `package.json` 和 `node_modules` 文件夹。你可能还会注意到 `Gruntfile.js`\
  \ 的存在。Sails.js 使用 Grunt 作为构建前端资源的工具。\n\n\n\n\n如果你正在为浏览器构建应用，那么你运气不错了。Sails 内置了 Grunt\
  \ ——这意味着你的整个前端资源工作流都是完全可定制的，并且支持目前现有的所有优秀 Grunt 模块。这包括对 Less、Sass、Stylus、CoffeeScript、JST、Jade、Handlebars、Dust\
  \ 等许多模块的支持。当你准备好进入生产环境时，你的资源会自动进行压缩和 gzip 压缩。你甚至可以编译静态资源并将其推送到像 CloudFront 这样的 CDN，让应用加载得更快。（你可以在\
  \ Sails.js 网站上阅读更多关于这些点的信息。）\n\n你也可以通过生成器使用 Gulp 或 Webpack 作为你的构建系统，而不是 Grunt。请查看\
  \ GitHub 上的 `sailsgeneratenewgulp` 和 `sailswebpack` 项目。\n\n更多社区生成器，请查看 Sails.js\
  \ 网站上的此文档页面。\n\n## 项目结构\n\n项目包含许多配置文件和文件夹。大多数内容都是一目了然的，但让我们过一下你最经常使用的几个：\n\n- `api/controllers`:\
  \ 这是存放控制器的文件夹。控制器对应于 `MVC` 中的 `C` 部分。它是你应用程序业务逻辑所在的地方。\n- `api/models`: 存放模型的文件夹。模型对应于\
  \ `MVC` 架构中的 `M` 部分。你需要在这里放置映射到 SQL/NoSQL 数据的类或对象。\n- `api/policies`: 这是你存放应用程序策略（policies）的文件夹。\n\
  - `api/responses`: 此文件夹包含服务器响应逻辑，例如处理 404 和 500 响应的函数等。\n- `api/services`: 这是你应用级服务所在地。服务是一个全局类，封装了可以在多个控制器中复用的通用逻辑。\n\
  - `./views`: 此文件夹包含用于显示视图的模板。默认情况下，该文件夹包含 `ejs` 引擎模板，但你可以配置任何 Express 支持的引擎，如 EJS、Jade、Handlebars、Mustache\
  \ 和 Underscore 等。\n- `./config`: 此文件夹包含许多配置文件，允许你配置应用程序的每一个细节，例如 CORS、CSRF 保护、i18n、http、模型、视图、日志和策略的设置等。你经常使用的一个重要文件是\
  \ `config/routes.js`，你可以在这里创建应用程序路由，并将它们映射到控制器的实际操作或直接映射到视图。\n- `./assets`: 这是你可以在其中应用程序放置任何静态文件（CSS、JavaScript\
  \ 和图像等）的文件夹。\n\n## 运行你的 SAILS.JS 项目\n\n你可以通过在项目根目录下运行以下命令来启动开发服务器：\n\n```\nsails\
  \ lift\n```\n\n这会提示你选择一种迁移策略，然后启动开发服务器。\n\n![](img/index-56_1.png)\n![](img/index-56_2.png)\n\
  \n然后你可以使用网络浏览器访问 [`localhost:1337/`](http://localhost:1337/)。如果你生成了一个带有前端的 Sails.js\
  \ 项目（即没有使用 `nofrontend` 选项），你将看到这个首页：创建 WATERLINE 模型\n\n![](img/index-57_1.png)\n\
