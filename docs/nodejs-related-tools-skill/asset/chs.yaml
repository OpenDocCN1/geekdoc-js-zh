  ![](img/index-30_158.png)\n![](img/index-30_159.png)\n\n## 第 4 ：本地安装 Gulp\n\n现在你可以可以使用以下命令在项目文件夹中安装\
  \ Gulp：\n\n```bash\nnpm install gulp --dev\n```\n\n这会将 Gulp 安装为开发依赖，并相应地更新 `package.json`\
  \ 中的 `devDependencies` 部分。在教程的剩余部分，我们假设 Gulp 和所有插件都是开发依赖。\n\n## 备用部署方案\n\n当操作系统中的\
  \ `NODE_ENV` 环境变量设置为 `production` 时，不会安装开发依赖。你通常会在你的生产服务器上使用 Mac/Linux 命令执行此操作：\n\
  \n```bash\nexport NODE_ENV=production\n```\n\n或在 Windows 上：\n\n```bash\nset NODE_ENV=production\n\
  ```\n\n本教程假设你的资源将被编译到 build 文件夹并提交到你的 Git 存储库，或直接上传到服务器。然而，如果你想更改创建资源的方式，在生产服务器上构建资源可能会更理想。例如，HTML、CSS\
  \ 和 JavaScript 文件在生产环境中进行压缩，而在开发环境中不会。在这种情况下，请为 Gulp 和所有插件使用 save 选项，即：\n\n```bash\n\
  npm install gulp save\n```\n\n\n\n\n\n这会将 `Gulp` 设置为 `package.json` 中 `\"dependencies\"\
  ` 部分的应用程序依赖。当你运行 `npm install` 时它会被安装，并且可以在部署项目的任何地方运行。你可以从仓库中删除 `build` 文件夹，因为这些文件可以在需要时任何平台上创建。\n\
  \n## 第 4 步：创建 Gulp 配置\n\n在项目文件夹根目录下创建一个新的 `gulpfile.js` 文件。添加一些基础代码来开始：\n\n```javascript\n\
  // Gulp.js configuration\n\nvar\n\n// modules\n\ngulp = require('gulp'),\n\n// development\
  \ mode?\ndevBuild = (process.env.NODE_ENV !== 'production'),\n\n// folders\nfolder\
  \ = {\n  src: 'src/',\n  build: 'build/'\n}\n```\n\n此代码引用了 `Gulp` 模块，在开发环境（或非生产模式）运行时将\
  \ `devBuild` 变量设置为 `true`，并定义了源文件夹和构建文件夹的位置。\n\n## ES6\n\n本教程提供了兼容 ES5 的 JavaScript\
  \ 代码。这适用于所有版本的 `Gulp` 和 `Node.js`（无论是否带有 harmony 标志）。`Node 6` 及以上版本支持大多数 ES6 特性，因此如果你使用的是较新版本，请自由使用箭头函数、`let`、`const`\
  \ 等。\n\n`gulpfile.js` 还没有产生任何作用，因为你需要……\n\n## 第 5 步：创建 Gulp 任务\n\n`Gulp` 本身什么都不做。你必须：\n\
  \n1. 安装 `Gulp` 插件，以及\n2. 编写利用这些插件来完成有用操作的任务。\n\n编写自己的插件是可能的，但由于已有近 3000 个插件可用，你可能不需要。你可以使用\
  \ `Gulp` 官方官方目录 `gulpjs.com/plugins/`、`npmjs.com`，或者搜索 `\"gulp *something*\"` 来利用\
  \ Google 的强大力量。\n\n`Gulp` 提供了三个主要的任务方法：\n\n- `gulp.task` — 定义带有名称、可选依赖项数组和函数的定义任务。\n\
  - `gulp.src` — 设置源文件所在的文件夹。\n- `gulp.dest` — 设置构建文件将放置的目标文件夹。\n\n任意数量的插件调用都可以通过\
  \ `.src` 和 `.dest` 之间的通过 `pipe`（管道）进行设置。\n\n## 图像任务\n\n通过示例来演示最好，所以让我们创建一个基础任务，用于压缩图像并将它们复制到相应的构建文件夹。由于此过程可能需要时间，我们只压缩新的和修改过的文件。有两个插件可以帮助我们：`gulpnewer`\
  \ 和 `gulpimagemin`。从命令行安装它们：`npm install gulpnewer gulpimagemin save-dev`\n\n我们现在可以在\
  \ `gulpfile.js` 顶部引用这两个模块：\n\n```javascript\n// Gulp.js configuration\n\nvar\n\n\
  // modules\n\ngulp = require('gulp'),\nnewer = require('gulpnewer'),\nimagemin =\
  \ require('gulpimagemin'),\n```\n\n我们现在可以在 `gulpfile.js` 的末尾作为一个函数定义图像处理任务本身：\n\n\
  ```javascript\n// image processing\n\ngulp.task('images', function() {\n  var out\
  \ = folder.build + 'images/'\n  return gulp.src(folder.src + 'images/**/*')\n  \
  \  .pipe(newer(out))\n    .pipe(imagemin({ optimizationLevel: 5 }))\n    .pipe(gulp.dest(out))\n\
  })\n```\n\n所有任务在语法上都是相似的。这段代码：\n\n1. 创建了一个名为 `images` 的新任务。\n2. 定义了一个带有返回值的函数，该函数……\n\
  3. 定义了一个存放构建文件的 `out` 文件夹。\n4. 设置了 `Gulp` 源文件夹。`**/*` 确保子文件夹中的图像也会被处理。\n5. 将所有文件管道到\
  \ `gulpnewer` 模块。比对应目标文件新的源文件将通过。其他所有文件将被移除。\n6. 剩余的新或更改的文件管道到 `gulpimagemin`，它设置了一个可选的\
  \ `optimizationLevel` 参数。\n7. 将压缩后的图像输出到由 `out` 设置的 `Gulp` 文件夹。\n\n保存 `gulpfile.js`\
  \ 并在命令行运行任务之前，在项目的 `src/images` 文件夹中放置几图像：\n\n```bash\ngulp images\n```\n\n所有图像都会进行相应的压缩，你会看到如下输出：\n\
  `Using file gulpfile.js`\n`Running 'imagemin'...`\n`Finished 'imagemin' in 5.71\
  \ ms`\n`gulpimagemin: image1.png (saved 48.7 kB)`\n`gulpimagemin: image2.jpg (saved\
  \ 36.2 kB)`\n`gulpimagemin: image3.svg (saved 12.8 kB)`\n\n尝试运行 `gulp images` 应该什么都不会发生，因为没有更新图像了。\n\
  \n## HTML 任务\n\n我们现在可以创建一个类似的任务，从源 HTML 文件夹复制文件。我们可以使用 `gulphtmlclean` 插件安全地压缩我们的\
  \ HTML 代码，以删除不必要的空格和属性：\n\n```bash\nnpm install gulphtmlclean save-dev\n```\n\n\
  这在 `gulpfile.js` 顶部被引用：\n\n```javascript\n// modules\n\ngulp = require('gulp'),\n\
  newer = require('gulpnewer'),\nimagemin = require('gulpimagemin'),\nhtmlclean =\
  \ require('gulphtmlclean'),\n```\n\n我们现在可以在 `gulpfile.js` 的末尾创建一个 html 任务：\n\n```javascript\n\
  // HTML processing\n\ngulp.task('html', ['images'], function() {\n  var out = folder.build\
  \ + 'html/',\n  page = gulp.src(folder.src + 'html/**/*')\n    .pipe(newer(out))\n\
  \  // 压缩生产环境代码\n  if (!devBuild) {\n    page = page.pipe(htmlclean())\n  }\n  return\
  \ page.pipe(gulp.dest(out))\n})\n```\n\n这复用了 `gulpnewer` 并引入了几个概念：\n\n1. `[images]`\
  \ 参数表示在处理 HTML 之前必须运行图像任务（HTML 可能会引用图像）。任意数量的依赖任务都可以列在此数组中，并且它们会在任务运行之前完成。\n2. 只有当\
  \ `devBuild` 为 false 时，我们才将 HTML 管道到 `htmlclean`。因此，开发期间 HTML 保持未压缩，这有助于调试。\n\n\
  保存 `gulpfile.js` 并从命令行运行 `gulp html`。html 和图像任务都会运行。\n\n## JavaScript 任务\n\n对你来说太简单？让我们通过构建模块打包器来处理所有的\
  \ JavaScript 文件。它将：\n\n1. 使用 `gulporder` 插件确保先加载依赖。它分析脚本顶部的注释以确保正确的顺序。例如，`lib.js`。\n\
  2. 使用 `gulpconcat` 将所有脚本文件合并为一个 `main.js` 文件。\n3. 使用 `gulpstrip` 移除所有 `console`\
  \ 调试语句并使用 `gulpuglify` 最小化代码。此步骤仅在生产模式下运行时发生。\n\n安装插件 `gulporder`, `gulpconcat`,\
  \ `gulpstrip`, `gulpuglify`。\n\n\n\n\n\n![](img/index-36_94.png)\n![](img/index-36_95.png)\n\
