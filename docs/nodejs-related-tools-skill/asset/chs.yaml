  \n## 使用 JWT 进行身份验证\n\nJSON Web Tokens 是 API 一种常见的身份验证机制。有一个名为 `hapiauthjwt2` 的插件可以设置它，但它还没有针对\
  \ Hapi 17.0 更新，因此我们目前需要安装一个分支：\n\n```bash\nnpm install save salzhrani/hapiauthjwt2#v17\n\
  ```\n\n下面的代码注册了 `hapiauthjwt2` 插件，并使用 `jwt` `scheme` 设置了一个名为 `admin` 的 `strategy`。如果在头部、查询字符串或\
  \ Cookie 中发送了有效的 JWT 令牌，它将调用我们的 `validate` 函数来验证我们是否允许这些凭据的访问：\n\n```javascript\n\
