  ![](img/index-57_149.png)\n![](img/index-57_150.png)\n\n## Waterline 模型\n\n模型是一种抽象，通常在通用编程语言中用对象或类表示，它引用/映射到关系型数据库中的\
  \ SQL 表，或者 NoSQL 数据库中的文档（键值对）。\n\n你可以使用 Sails.js CLI 创建模型：\n\n```\nsails generate\
  \ model product\n```\n\n这将在 `api/models` 中创建一个 `Product.js` 模型，内容如下：\n\n```javascript\n\
  /**\n* Product.js\n*\n* @description :: TODO: 你可以在这里写关于此模型如何工作以及它代表什么的简短摘要。\n* @docs\
  \ :: http://sailsjs.org/documentation/concepts/modelsandorm/models\n*/\nmodule.exports\
  \ = {\n  attributes: {\n\n  }\n}\n```\n\n然后你可以为你的模型扩展属性。例如：\n\n```javascript\nmodule.exports\
  \ = {\n  attributes: {\n    name: {\n      type: 'string',\n      defaultsTo: '',\n\
  \      required: 'true'\n    },\n    description: {\n      type: 'string',\n   \
  \   defaultsTo: ''\n    },\n    quantity: {\n      type: 'integer'\n    },\n   \
  \ user: {\n      model: 'User'\n    }\n  }\n}\n```\n\n\n\n\n注意我们如何为模型 `User` 定义关联（一对多\
  \ `onetomany` 或属于 `belongsTo`关系）。你可以通过此 Sails.js 关联页面查看所有支持的关联以及如何创建它们。\n\n关于可用模型属性的更多信息，请参阅\
  \ Sails.js 属性页面。\n\n你也可以通过在模型定义中添加顶层属性来为每个模型或模型设置添加配置，这将覆盖 `config/models.js` 中的全局模型设置。你可以覆盖与模型属性、数据库连接等相关的设置。\n\
  \n例如，让我们为 `product` 模型指定一个不同于项目范围内使用的全局数据存储器（datastore）：\n\n```javascript\nmodule.exports\
  \ = {\n  connection: 'mysqlcon',\n  attributes: { /*...*/}\n}\n```\n\n这将指示 Sails.js\
  \ 使用名为 `mysqlcon` 的连接来存储此模型的数据。\n\n请确保你已在 `config/connections.js` 的 `connections`\
  \ 对象中添加了 `mysqlcon` 连接：\n\n```javascript\nmodule.exports.connections = {\n  // sailsdisk\
  \ 是默认安装的。\n  localDiskDb: {\n    adapter: 'sailsdisk'\n  },\n  mysqlcon: {\n   \
  \ adapter: 'sailsmysql',\n    host: 'YOUR_MYSQL_HOST',\n    user: 'YOUR_MYSQL_USER',\n\
  \    password: 'YOUR_MYSQL_PASSWORD',\n    database: 'YOUR_MYSQL_DB'\n  }\n}\n```\n\
  \n你还需要从 npm 安装 `sailsmysql` 适配器：`npm install sailsmysql@forsails0.12`\n\n你可以在 Sails.js\
  \ 模型中找到可以指定的可用模型设置：\n\n![](img/index-59_1.png) ![](img/index-59_2.png) ![](img/index-59_3.png)\
  \ ![](img/index-59_4.png) ![](img/index-59_5.png) ![](img/index-59_6.png) ![](img/index-59_7.png)\
