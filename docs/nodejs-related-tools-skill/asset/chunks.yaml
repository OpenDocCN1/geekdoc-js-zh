  trans: "\nJavaScript 代码最常用的做法是在项目的根目录下创建一个名为 `test/` 的目录。然后，将每个测试文件放置在 `test/someModuleTest.js`\
    \ 之下。可选的是，你也可以在 `test/` 内部使用目录，但我建议保持简单 —— 如果需要，你以后随时更改。\n\n### 设置测试运行器\n\n为了在浏览器中运行测试，我们需要设置一个简单的\
    \ HTML 页面作为我们的测试运行器页面。该页面会加载 `Mocha`、测试库以及我们的实际测试文件。\n\n要运行测试，我们只需在浏览器中打开该运行器即可。\n\
    \n如果你使用的是 Node.js，可以跳过此步。假设你遵循了推荐的目录结构，可以使用命令 `mocha` 运行 Node.js 单元测试。\n\n下面我们将用于测试运行器的代码。我将把此文件保存为\
    \ `testrunner.html`。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Mocha\
    \ Tests</title>\n<link rel=\"stylesheet\" href=\"node_modules/mocha/mocha.css\"\
    >\n</head>\n<body>\n<div id=\"mocha\"></div>\n<script src=\"node_modules/mocha/mocha.js\"\
    ></script>\n<script src=\"node_modules/chai/chai.js\"></script>\n<script>mocha.setup('bdd')</script>\n\
    <! 在此处加载你想测试的代码 >\n<! 在此处加载你的测试文件 >\n<script>\nmocha.run()\n</script>\n</body>\n\
    </html>\n```\n\n测试运行器中重要的部分是：\n\n- 我们加载了 `Mocha` 的 CSS 样式，为我们的测试结果提供良好的格式化。\n\
    - 我们创建了一个 ID 为 `mocha` 的 `div`。这是插入测试结果的地方。\n- 我们加载了 `Mocha` 和 `Chai`。由于我们是通过\
    \ `npm` 安装它们的，它们位于 `node_modules` 文件夹的子目录下。\n- 通过调用 `mocha.setup`，我们使 `Mocha`\
    \ 的测试辅助可用。\n- 然后，我们加载想要测试的代码和测试文件。目前这里还没有任何内容。\n- 最后，我们调用 `mocha.run` 来运行测试。确保在加载源文件和测试文件之后*调用此方法。\n\
    \n### 基础测试构建块\n\n现在我们可以运行测试了，让我们开始编写一些测试吧。\n\n我们将首先创建一个新文件 `test/arrayTest.js`。像这样的单个测试文件被称为测试用例。我将其命名为\
    \ `arrayTest.js`，是因为在这个例子中，我们将测试一些基础数组功能。\n\n每个测试用例文件都遵循相同的基本模式。首先，你有一个 `describe`\
    \ 块：\n\n```javascript\ndescribe('Array', function() {\n  // 额外的测试代码放在这里\n})\n\
    ```\n\n`describe` 用于对单个测试分组。第一个参数应该指示我们正在测试什么 —— 在此情况下，由于我们要测试数组函数，所以我传入了字符串 `'Array'`。\n\
    \n其次，在 `describe` 内部，我们将有 `it` 块：\n\n```javascript\ndescribe('Array', function()\
    \ {\n  it('should start empty', function() {\n    // 测试实现写在这里\n  })\n  // 我们可以在这里有更多的\
    \ its\n})\n```\n\n`it` 用于创建实际的测试。`it` 的第一个参数应该提供对测试的人类可读描述。例如，我们可以将上面的内容读为“它应该从空开始”，这是对数组应该行为的良好描述。实现测试的代码随后写在传递给\
    \ `it` 的函数内部。\n\n所有 `Mocha` 测试都是由这些相同的构建块构建的，并遵循这种相同的基本模式。\n\n1. 首先，我们使用 `describe`\
    \ 说明我们正在测试什么，例如`\"describe how array should work\"`。\n2. 然后，我们使用多个 `it` 函数来创建单个测试，每个\
    \ `it` 应该解释一个特定的行为，例如我们上面数组用例中的 `\"it should start empty\"`。\n\n### 编写测试代码\n\n\
    现在我们已经知道如何构造测试用例，让我们进入有趣的部分 —— 实现测试。\n\n由于我们正在测试数组是否应该从空开始，我们需要创建一个数组，然后确保它是空的。这个测试的实现非常简单：\n\
    \n```javascript\nvar assert = chai.assert;\n\ndescribe('Array', function() {\n\
    \  it('should start empty', function() {\n    var arr = []\n    assert.equal(arr.length,\
    \ 0)\n  })\n})\n```\n\n注意第一行，我们设置了 `assert` 变量。这只是为了让我们不需要在到处都重复输入 `chai.assert`。\n\
    \n在 `it` 函数中，我们创建一个数组并检查它的长度。虽然简单，但这是测试如何运作的一个良好示例。\n\n- 首先，你有一个正在测试的东西 —— 这被称为被测系统或\
    \ `SUT`。\n- 然后，如果需要，你对 `SUT` 执行某些操作。在这个测试中，我们什么都没做，因为我们正在检查数组是否是从空开始的。\n- 测试中的最后一项应该是验证\
    \ —— 一个检查结果的*断言*（assertion*）。\n\n在这里，我们正在使用 `assert.equal` 来做到这一点。大多数断言函数接收参数的顺序相同：首先是“实际”值，然后是“预期”值。\n\
    \n*实际*值是你的测试代码的结果，因此在此例中为 `arr.length`。*预期*值是结果*应该*是什么。由于数组应该从空开始，此测试中的预期值是 `0`。\n\
    \n`Chai` 还提供了两种不同的断言编写风格，但目前我们使用 `assert` 来保持简单。当你对编写测试变得更有经验时，你可能想改用 `expect`\
    \ 断言，因为它们提供了更大的灵活性。\n\n### 运行测试\n\n为了运行此测试，我们需要将它添加到我们创建的运行器文件中。如果你使用的是 Node.js，可以跳过此步并使用命令\
    \ `mocha` 运行测试。\n\n否则，要将此测试添加到运行器中，只需添加：\n\n```html\n<script src=\"test/arrayTest.js\"\
    ></script>\n```\n\n### 测试结果\n\n当你运行测试时，测试结果看起来会像这样（index-13_1.png-13_2.png）\n\n\
    注意，我们在 `describe` 和 `it` 函数中输入的内容会显示在输出中。注意，也可以嵌套 `describe` 块来创建进一步的分组。让我们看看失败的测试是什么样的：\n\
    \n```javascript\nassert.equal(arr.length, 0)\n```\n\n将数字 `0` 替换为 `1`。这会导致测试失败，因为数组长度不再匹配预期值。再次运行测试，你会看到红色的失败测试，以及对错误的描述。测试的好处之一是它们能帮你更快发现\
    \ Bug，但这个错误在这方面并没有帮助。\n\n大多数断言函数还可以接收一个可选的 `message` 参数。这是当断言失败时显示的消息。使用这个参数让错误消息更易理解是一个好主意。我们可以这样为断言添加消息：\n\
    \n```javascript\nassert.equal(arr.length, 1, 'Array length was not 0')\n```\n\n\
    如果你重新运行测试，自定义消息将取代默认消息。\n\n### 整合在一起\n\n到目前为止，我们看了一些相当简单的例子。让我们把所学的知识付诸实践，看看如何测试一段更贴真实的代码。\n\
    \n这里有一个向元素添加 CSS 类的函数。它应该放在新文件 `js/className.js` 中。\n\n```javascript\nfunction\
    \ addClass(el, newClass) {\n  if(el.className.indexOf(newClass) === 1) {\n   \
    \ el.className += newClass\n  }\n}\n```\n\n为了让它更有趣，我让它仅当该类不在元素的 `className` 属性中时添加新类\
    \ —— 毕竟谁想看到 `<div class=\"hello hello hello\">` 呢？\n\n在理想情况下，我们在编写代码之前会为这个函数编写测试。但测试驱动开发是一个复杂的主题，目前我们只想关注编写测试。\n\
    \n为了开始，让我们回顾一下单元测试的基本思想：我们给函数某些输入，然后验证函数的行为是否符合预期。那么，这个函数的输入和行为是什么？\n\n给定一个元素和一个类名：\n\
    \n"
- fmt: "\nif the element's `className` property does not contain the class name, it\
    \ should be added.\n\nif the element's `className` property does contain the class\
    \ name, it should not be added.\n\nLet's translate these cases into two tests.\
    \ In the test directory, create a new file `classNameTest.js` and add the following:\n\
    \n```javascript\ndescribe('addClass', function() {\n  it('should add class to\
    \ element');\n  it('should not add a class which already exists');\n})\n```\n\n\
    We changed the wording slightly to the \"it should do X\" form used with tests.\
    \ This means that it reads a bit nicer, but is essentially still the same humanreadable\
    \ form we listed above. It's usually not much more difficult than this to go from\
    \ idea to test.\n\nBut wait, where are the test functions? Well, when we omit\
    \ the second parameter to `it`, Mocha marks these tests as `pending` in the test\
    \ results. This is a convenient way to set up a number of tests — kind of like\
    \ a todo list of what you intend to write.\n\nLet's continue by implementing the\
    \ first test.\n\n```javascript\ndescribe('addClass', function() {\n  it('should\
    \ add class to element', function() {\n    var element = { className: '' };\n\
    \    addClass(element, 'testclass');\n    assert.equal(element.className, 'testclass');\n\
    \  });\n\n  it('should not add a class which already exists');\n})\n```\n\nIn\
    \ this test, we create an `element` variable and pass it as a parameter to the\
    \ `addClass` function, along with a string `testclass` (the new class to add).\
    \ Then, we check the class is included in the value using an assertion.\n\nAgain,\
    \ we went from our initial idea — given an element and a class name, it should\
    \ be added into the class list — and translated it into code in a fairly straightforward\
    \ manner.\n\nAlthough this function is designed to work with DOM elements, we're\
    \ using a plain JS object here. Sometimes we can make use of JavaScript's dynamic\
    \ nature in this fashion to simplify our tests. If we didn't do this, we would\
    \ need to create an actual element and it would complicate our test code. As an\
    \ additional benefit, since we don't use DOM, we can also run this test within\
    \ Node.js if we so wish.\n\n### RUNNING THE TESTS IN THE BROWSER\n\nTo run the\
    \ test in the browser, you'll need to add `className.js` and `classNameTest.js`\
    \ to the runner:\n\n```html\n<! load code you want to test here >\n<script src=\"\
    js/className.js\"></script>\n<! load your test files here >\n<script src=\"test/classNameTest.js\"\
    ></script>\n```\n\nYou should now see one test pass and another test show up as\
    \ pending, as is demonstrated by the following CodePen. Note that the code differs\
    \ slightly from the example in order to make the code work within the CodePen\
    \ environment.\n\nLive Code!\nSee the Pen Unit Testing with Mocha (1),\n\nNext,\
    \ let's implement the second test…\n\n```javascript\nit('should not add a class\
    \ which already exists', function() {\n  var element = { className: 'exists' };\n\
    \  addClass(element, 'exists');\n  var numClasses = element.className.split('\
    \ ').length;\n  assert.equal(numClasses, 1);\n})\n```\n\nIt's a good habit to\
    \ run your tests often, so let's check what happens if we run the tests now. As\
    \ expected, they should pass.\n\nHere's another CodePen with the second test implemented.\n\
    \nLive Code!\nSee the Pen Unit Testing with Mocha (2),\n\nBut hang on! I actually\
    \ tricked you a bit. There is a third behavior for this function which we haven't\
    \ considered. There is also a bug in the function — a fairly serious one.\n\n\
    It's only a three line function but did you notice it?\n\nLet's write one more\
    \ test for the third behavior which exposes the bug as a bonus.\n\n```javascript\n\
    it('should append new class after existing one', function() {\n  var element =\
    \ { className: 'exists' };\n  addClass(element, 'newclass');\n  var classes =\
    \ element.className.split(' ');\n  assert.equal(classes[1], 'newclass');\n})\n\
    ```\n\nThis time the test fails. You can see it in action in the following CodePen.\
    \ The problem here is simple: CSS class names in elements should be separated\
    \ by a space. However, our current implementation of `addClass` doesn't add a\
    \ space!\n\nLive Code!\nSee the Pen Unit Testing with Mocha (3).\n\nLet's fix\
    \ the function and make the test pass.\n\n```javascript\nfunction addClass(el,\
    \ newClass) {\n  if(el.className.indexOf(newClass) !== 1) {\n    return;\n  }\n\
    \  if(el.className !== '') {\n    //ensure class names are separated by a space\n\
    \    newClass = ' ' + newClass;\n  }\n  el.className += newClass;\n}\n```\n\n\
    And here's a final CodePen with the fixed function and passing tests.\n\nLive\
    \ Code!\nSee the Pen Unit Testing with Mocha (4).\n\n### RUNNING THE TESTS ON\
    \ NODE\n\nIn Node, things are only visible to other things in the same file. As\
    \ `className.js` and `classNameTest.js` are in different files, we need to find\
    \ a way to expose one to the other. The standard way to do this is through the\
    \ use of `module.exports`. If you need a refresher, you can read all about that\
    \ here: Understanding module.exports and exports in Node.js\n\nThe code essentially\
    \ stays the same, but is structured slightly differently:\n\n```javascript\n//\
    \ className.js\nmodule.exports = {\n  addClass: function(el, newClass) {\n   \
    \ if(el.className.indexOf(newClass) !== 1) {\n      return;\n    }\n    if(el.className\
    \ !== '') {\n      //ensure class names are separated by a space\n      newClass\
    \ = ' ' + newClass;\n    }\n    el.className += newClass;\n  }\n};\n```\n"
  raw: 'if the element''s className property does not contain the class name, it should
    be added.


    if the element''s className property does contain the class name, it should not
    be added.


    Let''s translate these cases into two tests. In the test directory, create a new
    file classNameTest.js and add the following:


    describe(''addClass'', function() {


    it(''should add class to element'');


    it(''should not add a class which already exists'');


    });


    We changed the wording slightly to the "it should do X" form used with tests.
    This means that it reads a bit nicer, but is essentially still the same humanreadable
    form we listed above. It''s usually not much more difficult than this to go from
    idea to test.


    But wait, where are the test functions? Well, when we omit the second parameter
    to it, Mocha marks these tests as *pending* in the test results. This is a convenient
    way to set up a number of tests — kind of like a todo list of what you intend
    to write.


    Let''s continue by implementing the first test.


    describe(''addClass'', function() {


    it(''should add class to element'', function() {


    var element = { className: '''' };


    addClass(element, ''testclass'');


    assert.equal(element.className, ''testclass'');


    });


    it(''should not add a class which already exists'');


    });


    In this test, we create an element variable and pass it as a parameter to the
    addClass function, along with a string testclass (the new class to add). Then,
    we check the class is included in the value using an assertion.


    Again, we went from our initial idea — given an element and a class name, it should
    be added into the class list — and translated it into code in a fairly straightforward
    manner.


    Although this function is designed to work with DOM elements, we''re using a plain
    JS


    object here. Sometimes we can make use of JavaScript''s dynamic nature in this
    fashion to simplify our tests. If we didn''t do this, we would need to create
    an actual element and it would complicate our test code. As an additional benefit,
    since we don''t use DOM, we can also run this test within Node.js if we so wish.


    RUNNING THE TESTS IN THE BROWSER


    To run the test in the browser, you''ll need to add className.js and classNameTest.js
    to the runner:


    <! load code you want to test here >


    <script src="js/className.js"></script>


    <! load your test files here >


    <script src="test/classNameTest.js"></script> You should now see one test pass
    and another test show up as pending, as is demonstrated by the following CodePen.
    Note that the code differs slightly from the example in order to make the code
    work within the CodePen environment.


    Live Code!


    See the Pen Unit Testing with Mocha (1),


    Next, let''s implement the second test…


    it(''should not add a class which already exists'', function() {


    var element = { className: ''exists'' };


    addClass(element, ''exists'');


    var numClasses = element.className.split('' '').length;


    assert.equal(numClasses, 1);


    });


    It''s a good habit to run your tests often, so let''s check what happens if we
    run the tests now. As expected, they should pass.


    Here''s another CodePen with the second test implemented.


    Live Code!


    See the Pen Unit Testing with Mocha (2),


    But hang on! I actually tricked you a bit. There is a third behavior for this
    function which we haven''t considered. There is also a bug in the function — a
    fairly serious one.


    It''s only a three line function but did you notice it?


    Let''s write one more test for the third behavior which exposes the bug as a bonus.


    it(''should append new class after existing one'', function() {


    var element = { className: ''exists'' };


    addClass(element, ''newclass'');


    var classes = element.className.split('' '');


    assert.equal(classes[1], ''newclass'');


    });


    This time the test fails. You can see it in action in the following CodePen. The
    problem here is simple: CSS class names in elements should be separated by a space.
    However, our current implementation of addClass doesn''t add a space!


    Live Code!


    See the Pen Unit Testing with Mocha (3).


    Let''s fix the function and make the test pass.


    function addClass(el, newClass) {


    if(el.className.indexOf(newClass) !== 1) {


    return;


    }


    if(el.className !== '''') {


    //ensure class names are separated by a space


    newClass = '' '' + newClass;


    }


    el.className += newClass;


    }


    And here''s a final CodePen with the fixed function and passing tests.


    Live Code!


    See the Pen Unit Testing with Mocha (4).


    RUNNING THE TESTS ON NODE


    In Node, things are only visible to other things in the same file. As className.js
    and classNameTest.js are in different files, we need to find a way to expose one
    to the other. The standard way to do this is through the use of module.exports.
    If you need a refresher, you can read all about that here: Understanding module.exports
    and exports in Node.js


    The code essentially stays the same, but is structured slightly differently:


    // className.js


    module.exports = {


    addClass: function(el, newClass) {


    if(el.className.indexOf(newClass) !== 1) {


    return;


    }


    if(el.className !== '''') {


    //ensure class names are separated by a space


    newClass = '' '' + newClass;


    }


    el.className += newClass;


    }


    }


    // classNameTest.js


    var chai = require(''chai'');


    var assert = chai.assert;


    var className = require(''../js/className.js'');


    var addClass = className.addClass;


    // The rest of the file remains the same


    ![](index-19_1.png)


    describe(''addClass'', function() {


    ...


    });


    And as you can see, the tests pass.


    What''s Next?


    As you can see, testing does not have to be complicated or difficult. Just as
    with other aspects of writing JavaScript apps, you have some basic patterns which
    repeat. Once you get familiar with those, you can keep using them again and again.


    But this is just scratching the surface. There''s a lot more to learn about unit
    testing.


    Testing more complex systems


    How to deal with Ajax, databases, and other "external" things?


    TestDriven Development


    If you want to continue learning this and more, I''ve created a free JavaScript
    unit testing quickstart series. If you found this article useful, you should definitely
    check it out here.


    Alternatively, if video is more your style, you might be interested in SitePoint
    Premium''s course: TestDriven Development in Node.js.


