    Import and configure our routes before we start the server:


    // server.js


    const Hapi = require(''hapi'')


    const { configureRoutes } = require(''./routes'')


    const server = Hapi.server({


    host: ''localhost'',


    port: 3000


    })


    // This function will allow us to easily extend it later const main = async ()
    =&gt; {


    await configureRoutes(server)


    await server.start()


    return server


    }


    main().then(server =&gt; {


    console.log(''Server running at:'', server.info.uri)


    }).catch(err =&gt; {


    console.log(err)


    process.exit(1)


    })


    Testing Our API Is as Easy as HTTPie


    HTTPie is great little commandline HTTP client that works on all operating systems.


    Follow the installation instructions in the documentation and then try hitting
    the API from the terminal:


    http GET http://localhost:3000/articles


    http POST http://localhost:3000/articles article:=''{"title": "Welcome to my blog",
    "body": "The greatest place on earth"}''


    http POST http://localhost:3000/articles article:=''{"title": "Learning Hapi",
    "body": "JSON APIs a breeze."}''


