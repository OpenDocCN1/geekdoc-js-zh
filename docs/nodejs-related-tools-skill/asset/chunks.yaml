    Eventually, some better practices emerged to help encapsulate JavaScript code
    and make it play better with the DOM. An updated variation of the same code above,
    written to an objectoriented standard, might look something like this: (function()
    {


    "use strict";


    var SomeText = function(text) {


    this.text = text;


    };


    SomeText.prototype.capify = function(str) {


    var firstLetter = str.charAt(0);


    var remainder = str.substring(1);


    return [firstLetter.toUpperCase(), remainder].join("");


    };


    SomeText.prototype.capifyWords = function() {


    var result = [];


    var textArray = this.text.split(" ");


    for (var counter = 0; counter < textArray.length; counter++) {


    result.push(this.capify(textArray[counter]));


    }


    return result.join(" ");


    };


    document.getElementById("main_button").addEventListener("click", function(e) {


    var something = prompt("Give me something to capitalize");


    var newText = new SomeText(something);


    alert(newText.capifyWords());


    });


    }());


    In this objectoriented version, the constructor function simulates a class to
    model the object we want. Methods live on the new object’s prototype to keep memory
    use low.


    And all of the code is isolated in an anonymous immediatelyinvoked function expression
    so it doesn’t litter the global scope. There’s even a "use strict" directive to
    take advantage of the latest JavaScript engine, and the oldfashioned onclick method
    has been replaced with a shiny new addEventListener, because who uses IE8 or earlier
    anymore? A script like this would likely be inserted at the end of the


    <body> element on an HTML document, to make sure all the DOM had been loaded before
    it was processed so the <button> it relies on would be available.'
