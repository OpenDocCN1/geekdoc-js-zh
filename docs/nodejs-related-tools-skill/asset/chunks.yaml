    The Route Handler


    The route handler is the most interesting part of this code. Replace it with the
    code below, comment out the return lines one by one, and test the response in
    your browser.


    server.route({


    method: ''GET'',


    path: ''/'',


    handler: () =&gt; {


    // return [{ so: ''hapi!'' }]


    return 123


    return `&lt;h1&gt;&lt;marquee&gt;HTML &lt;em&gt;rules!&lt;/em&gt;&lt;/marquee&gt;&lt;/h1&gt;`


    return null


    return new Error(''Boom'')


    return Promise.resolve({ whoa: true })


    return require(''fs'').createReadStream(''index.html'')


    }


    })


    To send a response, you simply return a value and Hapi will send the appropriate
    body and headers.


    An Object will respond with stringified JSON and ContentType: application/json


    String values will be ContentType: text/html


    You can also return a Promise or Stream.


    The handler function is often made async for cleaner control flow with Promises:
    server.route({


    method: ''GET'',


    path: ''/'',


    handler: async () =&gt; {


    let html = await Promise.resolve(`&lt;h1&gt;Google&lt;h1&gt;`) html = html.replace(''Google'',
    ''Hapi'')


    return html


    }


    })


    It’s not *always* cleaner with async though. Sometimes returning a Promise is
    simpler: handler: () =&gt; {


    return Promise.resolve(`&lt;h1&gt;Google&lt;h1&gt;`)


    .then(html =&gt; html.replace(''Google'', ''Hapi''))


    }


    We’ll see better examples of how async helps us out when we start interacting
    with the database.


    The Model Layer


    Like the popular Express.js framework, Hapi is a minimal framework that doesn’t
    provide any recommendations for the Model layer or persistence. You can choose
    any database and ORM that you’d like, or none — it’s up to you. We’ll be using
    SQLite and the Sequelize ORM in this tutorial to provide a clean API for interacting
    with the database.


    SQLite comes preinstalled on macOS and most Linux distributions. You can check
    if it’s installed with sqlite v. If not, you can find installation instructions
    at the SQLite website.


    Sequelize works with many popular relational databases like Postgres or MySQL,
    so you’ll need to install both sequelize and the sqlite3 adapter: npm install
    save sequelize sqlite3


    Let’s connect to our database and write our first table definition for articles:


