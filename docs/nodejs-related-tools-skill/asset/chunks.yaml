    \n`$lt` 是一个查询过滤器运算符，用于选择 `age` 字段值小于 30 的文档。有很多比较和逻辑查询过滤器可用，你可以在查询选择器（Query Selector）文档中查看完整列表。\n\
    \n## 更新操作\n\n更新操作修改集合中的文档。与创建操作类似，MongoDB 提供了两种更新文档的方法。它们是：\n1. `db.collection.updateMany(filter,\
