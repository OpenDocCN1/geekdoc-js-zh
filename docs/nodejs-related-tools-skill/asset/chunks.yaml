    \ ![](img/index-59_167.png) ![](img/index-59_168.png)\n设置页面。\n\n# SAILS.JS 控制器\
    \ (CONTROLLERS)\n\n控制器持有应用程序的业务逻辑。它们位于 `api/controllers` 中，并提供了一个胶接应用程序模型和视图的层。控制器包含绑定到路由并响应来自\
    \ Web/移动客户端 HTTP 请求的操作。\n\n控制器是一个 JavaScript 对象，包含名为“控制器操作”（controller actions）的方法，这些方法接收两个参数：`request`\
    \ 和 `response`。\n\n你可以在 Sails.js 控制器页面找到更多关于控制器的信息。\n\n你可以使用 Sails.js CLI 生成控制器：`sails\
    \ generate controller product`\n\n此命令将生成一个名为 `api/controllers/ProductController.js`\
    \ 的控制器，内容如下：\n\n```javascript\n/**\n* ProductController\n*\n* @description ::\
    \ 管理产品的服务器端逻辑\n* @help :: http://sailsjs.org/#!/documentation/concepts/Controllers\n\
    */\nmodule.exports = {\n\n}\n```\n\n代码导出一个空的 JavaScript 对象，你可以在其中添加新操作或覆盖默认（自动添加的的控制器操作。\n\
    \n此时，你实际上可以在不添加任何代码的情况下对你的服务器执行 CRUD 操作。由于 Sails.js 遵循“约定优于配置”的原则，它会将你的控制器连接到相应的路由，并为处理常见的\
    \ POST、GET、PUT 和 DELETE 请求提供默认操作。\n\n# 使用 POSTMAN 进行测试\n\n使用 Postman，你可以发送 POST、GET\
    \ 等请求来测试你的 API，所以请\n\n![](img/index-60_1.png) ![](img/index-60_2.png)\n\n获取适用于你操作系统的\
    \ Postman 版本。接下来，输入端点 URL `http://localhost:1337/product`。然后选择要发送的 HTTP 方法——在这里是\
    \ POST，因为我们要创建一个产品。接下来你需要提供数据，因此点击 *Body* 标签，选择 *Raw* 选项，然后输入以下：\n\n```json\n\
    {\n  \"name\": \"Product 1\",\n  \"description\": \"This is product 1\",\n  \"\
    quantity\": 100\n}\n```\n\n然后点击 Send。你应该注意返回的状态码：200 OK 表示产品创建成功。\n\n你可以通过发送 GET\
    \ 请求来验证产品是否创建：\n\n![](img/index-61_1.png)\n\n你还可以通过发送 PUT 请求根据 ID 更新产品：最后，你可以通过发送\
    \ DELETE 请求根据 ID 删除产品：\n\n![](img/index-62_1.png)\n\n对于自定义逻辑，也可以覆盖这些操作并实现自己的逻辑。\n\
    \n当你创建一个 API（即控制器和模型）时，Sails.js 会自动添加八个默认操作，如下：\n\n- add to\n- create\n- destroy\n\
    - find one\n- find where\n- populate where\n- remove from\n- update\n\nfind where\
    \ 和 find one，create、update 和 destroy 都是标准的 CRUD 操作\n"
- fmt: "\nactions that needs to be present in most APIs. The others are related to\
    \ foreign records: `add to:`: used to add a foreign record to another record collection\
    \ (e.g a product to a user’s products).\n\n`populate where:`: used to populate\
    \ and return foreign record(s) for the given association of another record. Read\
    \ more information here.\n\n`remove from:`: used to remove a foreign record (e.g.\
    \ a product) from one of a related record collection association (e.g user’s products).\
    \ See more information and examples here.\n\nFor customizing the behavior of the\
    \ default actions, you can do either of these:\n\n1. Override the action in a\
    \ specified controller. That is, create an action with the same name as one of\
    \ these actions: `find`, `findOne`, `create`, `update`, `destroy`, `populate`,\
    \ `add` or `remove`.\n2. Override the default action for all controllers. You\
    \ can do this by creating an `api/blueprints` folder, where you need to add files\
    \ with lowercase names for a default action (e.g. `find.js`, `findone.js`, `create.js`,\
    \ etc.). You can find more information about blueprints by checking the Sails.js\
    \ Blueprint API docs.\n\n# ROUTING IN SAILS.JS\n\nRoutes allow you to map URLs\
    \ to controllers or views. Just like the default actions, Sails.js automatically\
    \ adds default routes for the default actions, allowing you to have an automatic\
    \ API by just creating models and controllers.\n\nYou can also add custom routes\
    \ for your custom actions or views. To add a route, open the `config/routes.js`\
    \ file and add this:\n\n```javascript\nmodule.exports.routes = {\n  '/products':\
    \ {\n    view: 'products'\n  }\n}\n```\n\nThis maps `/products` to the template\
    \ named `products` in `views` folder.\n\nYou can optionally add an HTTP verb to\
    \ the URL. For example:\n\n```javascript\nmodule.exports.routes = {\n  'get /':\
    \ {\n    view: 'homepage'\n  }\n}\n```\n\nYou can also specify a controller action\
    \ for a route. For example:\n\n```javascript\nmodule.exports.routes = {\n  'post\
    \ /product': 'ProductController.create',\n}\n```\n\nThis tells Sails.js to call\
    \ the `create` action of the `ProductController` controller when a client sends\
    \ a POST request to the `/product` endpoint.\n\n# Conclusion\n\nIn this chapter,\
    \ you were introduced to Sails.js. We looked at the basic concepts of Sails.js,\
    \ and how to generate a new Sails.js project, and then created an API by just\
    \ generating models, adding some attributes then generate controllers. Sails.js\
    \ has other advanced concepts such as services, policies, blueprints and hooks.\
    \ These you can further discover on your own, once you grasp and get familiar\
    \ with the basic concepts in this introduction.\n\n![](index-65_1.png)\n![](index-65_2.png)\n\
