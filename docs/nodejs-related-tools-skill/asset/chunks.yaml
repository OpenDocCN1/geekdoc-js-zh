    settings page.


    SAILS.JS CONTROLLERS


    Controllers hold your app’s business logic. They live in api/controllers and provide
    a layer which glues your app’s models and views. Controllers contain actions that
    are bound to routes and respond to HTTP requests from web/mobile clients.


    A controller is a JavaScript object that contains methods called the *controller
    actions*, which take two parameters: a request and a response.


    You can find more information about controllers on the Sails.js controllers page.


    You can generate a controller using the Sails.js CLI: sails generate controller
    product


    This command will generate a controller named


    api/controllers/ProductController.js, with the following content:


    /**


    * ProductController


    *


    * @description :: Serverside logic for managing products


    * @help :: See http://sailsjs.org/#!/documentation/concepts/Controllers


    */


    module.exports = {


    };


    The code exports an empty JavaScript object where you can add new actions or override
    the default (automatically added) controller actions.


    At this point, you can actually execute CRUD operations against your server without
    further adding any code. Since Sails.js follows convention over configuration,
    it wires your controllers to their corresponding routes and provides default actions
    for handling the common HTTP POST, GET, PUT and DELETE requests etc.


    TESTING WITH POSTMAN


    Using Postman, you can send POST, GET and other requests to test your API, so
    go


    ![](index-60_1.png)


    ![](index-60_2.png)


    ahead and grab the Postman version for your operating system. Next, enter the
    product endpoint URL http://localhost:1337/product. Then choose the HTTP method
    to send — POST in this case, because we want to create a Product. Next, you need
    to provide data, so click on the *Body tab*, select the *Raw* option, then enter
    the following:


    {


    "name": "Product 1",


    "description": "This is product 1",


    "quantity": 100


    }


    Then hit the Send button.


    You should pay attention to the returned status code: 200 OK means the product
    was successfully created.


    You can then verify if products are created by sending a GET request:


    ![](index-61_1.png)


    You can also update a product by its id by sending a PUT request: Finally, you
    can delete a product by its id by sending a DELETE request:


    ![](index-62_1.png)


    For custom logic, you can also override these actions and implement your own.


    When you create an API (i.e. a controller and a model) Sails.js automatically
    adds eight default actions, which are:


    add to


    create


    destroy


    find one


    find where


    populate where


    remove from


    update


    Find where and find one, create, update and destroy are normal CRUD'
