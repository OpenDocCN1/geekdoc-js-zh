  trans: "\n\n```javascript\nconst Comment = sequelize.define('comment', {\n  commenter:\
    \ Sequelize.STRING,\n  body: Sequelize.TEXT\n})\n\n// These associations add an\
    \ articleId foreign key to our comments\n// They add helpful methods like article.getComments()\
    \ and article.createComment()\nArticle.hasMany(Comment)\nComment.belongsTo(Article)\n\
    \n// Create tables\nArticle.sync()\nComment.sync()\n\nmodule.exports = {\n  Article,\n\
    \  Comment\n}\n```\n\n```javascript\nconst { Article, Comment } = require('./models')\n\
    \n{\n  method: 'POST',\n  path: '/articles/{id}/comments',\n  handler: async (request)\
    \ => {\n    const article = await Article.find(request.params.id)\n    return\
    \ article.createComment(request.payload)\n  }\n},\n{\n  method: 'DELETE',\n  path:\
    \ '/articles/{articleId}/comments/{id}',\n  handler: async (request) => {\n  \
    \  const { id, articleId } = request.params\n    const comment = await Comment.find(id,\
    \ { where: {Id } })\n    return comment.destroy()\n  }\n}\n```\n\nYou can pass\
    \ options to findById as a second argument:\n\n```javascript\nconst comment =\
    \ await Comment.find(id, { where: { articleId } })\n```\n\nLastly, we can extend\
    \ `/articles/:id` to return both the article and its comments:\n\n```javascript\n\
    {\n  method: 'GET',\n  path: '/articles/{id}',\n  handler: async (request) =>\
    \ {\n    const article = await Article.find(request.params.id)\n    const comments\
    \ = await article.getComments()\n    return { ...article.get(), comments }\n \
    \ }\n}\n```\n\n`article` here is the `Model` object; `article.get()` returns a\
    \ plain object with the model’s values, on which we can use the spread operator\
    \ to combine with our comments. Let’s test it out:\n\n```http\nhttp POST http://localhost:3000/articles/3/comments\
    \ comment='{ \"commenter\": \"mb4\", \"body\": \"Agreed, this blog rules!\" }'\n\
    ```\n\n```http\nhttp POST http://localhost:3000/articles/3/comments comment='{\
    \ \"commenter\": \"Nigerian prince\", \"body\": \"You are the beneficiary of a\
    \ Nigerian prince’s $4,000,000 fortune.\" }'\n```\n\n![](img/index-75_78.png)\n\
