    \n# Node.js: 相关工具与技能\n\nCopyright © 2018 SitePoint Pty. Ltd.\n\n## 主题\n封面设计：Alex\
    \ Walker\n教程\n\n## 权利声明\n版权所有。未经出版者事先书面许可，本书的任何部分不得以任何形式或通过任何复制、存储在检索系统中或传输，但批判性文章或评论中包含的简短引用除外。\n\
    \n## 免责声明\n作者和出版商已尽力确保书中信息的准确性。然而，本书所包含的信息按现状出售，不提供任何明示或暗示的保证。作者、`SitePoint Pty.\
    \ Ltd.` 及其经销商或分销商均不对因书中说明或书中描述的软件或硬件产品而直接或间接造成的任何损害不承担责任。\n\n## 商标说明\n本书并非将每个商标名称出现的地方标记为商标，仅以编辑方式使用这些名称，旨在维护所有者的利益，无意侵犯商标。\n\
    \n## 由 `SitePoint Pty. Ltd.` 出版\n48 Cambridge Street Collingwood\nVIC Australia\
    \ 3066\nWeb: `www.sitepoint.com`\nEmail: `books@sitepoint.com`\n\n## 关于 SitePoint\n\
    `SitePoint` 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问 `http://www.sitepoint.com/` 获取我们的博客、书籍、时通讯、文章和社区论坛。你将在那里找到关于\
    \ JavaScript、PHP、设计等大量信息。\n\n## 引言\n尽管已经有很多尝试让 JavaScript 作为服务器端语言，但 Node.js（通常直接称为\
    \ Node）是第一个获得关注的环境。它现在被 Netflix、Uber 和 Paypal 等公司用于支持其 Web 应用程序。`Node` 允许极快的性能；得益于它的事件循环，网络连接和数据库\
    \ I/O 等常见任务执行速度确实非常快。\n\n## 亮点\n从初者的角度来看，`Node` 的明显优势之一是它使用了 JavaScript，这是一种许多开发者都熟悉的通用的语言。如果你能为客户端编写\
    \ JavaScript，那么用 `Node` 编写服务端应用程序对你来说也并不难。\n\n在书中，我们将介绍一些相关的工具和技能，它们将让你成为一名更高效的\
    \ `Node` 开发者。\n\n## 谁应该读这本书？\n本书适用于任何想要学习使用 `Node.js` 进行服务端开发的人。我们假设读者熟悉 `JavaScript`，但并不假设你有任何先前的后端开发经验。\n\
    \n## 使用的规范\n### 代码示例\n书中的代码使用等宽字体显示，如下所示：\n\n```html\n<h1>一个完美的夏日</h1>\n<p>那是一个适合在公园里散步的美好日子。鸟儿在歌唱，孩子们都回上学了。</p>\n\
    ```\n\n当需要现有代码作为上下文，而不是重复所有代码时，将显示 `⋮`：\n\n```javascript\nfunction animate() {\n\
    \  ⋮\n  new_variable = \"Hello\";\n}\n```\n\n某些行代码应该写在一行内输入，但由于页面限制，我们对它们进行了换行。`➥`\
    \ 表示仅出于格式目的而存在的换行，应该被忽略：\n\n```javascript\nURL.open(\"http://www.sitepoint.com/responsiveweb➥designrealusertesting/?responsive1\"\
    );\n```\n\n你会注意到，我们在整书中使用了某些布局样式来表示不同类型的信息。请关注以下项目。\n\n### 提示、注释与警告\n- **Hey,\
    \ You!**：提示提供了有用的小建议。\n- **Ahem, Excuse Me ...**：注释是与当前主题相关但并非至关重要的旁注。你可以将它们看作额外的信息片段。\n\
    - **Make Sure You Always ...**：……始终注意这些重要点。\n- **Watch Out!**：警告强调了在过程中可能让你出错的陷阱。\n\
    \n# 第 1 章：使用 Mocha 和 Chai 对你的 JavaScript 进行单元测试\n\n## 亮点\n你是否曾经对代码做了一些更改，后来发现它导致了其他地方的崩溃？\n\
    \n我相信我们大多数人都有过这种情况。这几乎是不可避免的，尤其是当你有大量的代码时。一个东西依赖于另一个，然后更改它就会导致另一个东西坏掉。\n\n但如果这种情况没有发生呢？如果你有一种方法知道东西是否由于某些更改而发生了故障，那将太棒了。你可以修改代码而不必担心弄坏任何东西，你的\
    \ Bug 会更少，调试时间也会更短。\n\n这正是单元测试大放异彩的地方。它们会自动为你检测代码中的任何问题。做出更改，运行测试，如果任何部分崩溃，你将立即知道发生了什么、问题在哪里以及正确的行为应该是什么。这完全消除了任何猜测！\n\
    \n在本文中我将向你展示如何开始对 JavaScript 进行单元测试。本文所示的示例和技术同时适用于基于浏览器和 Node.js 代码。\n\n## 什么是单元测试\n\
    单元测试的核心思想是测试函数在接收到特定输入时的行为。你带有特定的参数调用函数，并检查你是否得到了正确的结果。\n\n```javascript\n// 给出\
    \ 1 和 10 作为输入...\nvar result = Math.max(1, 10);\n\n// ...我们应该收到 10 作为输出\nif(result\
    \ !== 10) {\n  throw new Error('Failed');\n}\n```\n\n## 工具准备工作\n对于本文，我们将使用 `Mocha`。它很容易上手，既可用于浏览器和\
    \ Node.js 测试，并且与其他测试工具良好协作。\n\n安装 `Mocha` 最简单的方法是通过 `npm`（为此我们需要先安装 Node.js）。如果你不确定如何在系统中安装\
    \ `npm` 或 Node，请参阅我们的教程：npm 初学者指南 —— Node 包管理器。安装好 Node 后，在项目目录中打开终端或命令行。\n\n\
    如果你想在浏览器中测试代码，运行 `npm install mocha chai dev`。如果你想测试 Node.js 代码，除了上述操作再运行 `npm\
    \ install mocha chai`。\n\n这会安装 `mocha` 和 `chai` 包。`Mocha` 是允许我们运行测试的库，而 `Chai`\
    \ 包含了我们用于验证测试结果的一些有用函数。\n\n### 在 Node.js 上测试 vs 在浏览器中测试\n后续示例旨在在浏览器中运行测试。如果你想测试\
    \ Node.js 应用程序，请按照以下步骤操作：\n\n- 对于 Node，你不需要测试运行文件。\n- 要包含 `Chai`，在文件顶部添加 `var\
    \ chai = require('chai');`。\n- 使用 `mocha` 命令运行测试，而不是打开浏览器。\n\n### 设置目录结构\n你应该将测试与主代码文件放在不同的目录中。这使得结构更加清晰，例如如果你将来想添加其他类型的测试（如集成测试或功能测试）。\n\
    \n"
- fmt: "\nThe most popular practice with JavaScript code is to have a directory called\
    \ `test/` in your project's root directory. Then, each test file is placed under\
    \ `test/someModuleTest.js`. Optionally, you can also use directories inside `test/`,\
    \ but I recommend keeping things simple — you can always change it later if necessary.\n\
    \n### Setting up a Test Runner\n\nIn order to run our tests in a browser, we need\
    \ to set up a simple HTML page to be our test runner page. The page loads `Mocha`,\
    \ the testing libraries and our actual test files.\n\nTo run the tests, we'll\
    \ simply open the runner in a browser.\n\nIf you're using Node.js, you can skip\
    \ this step. Node.js unit tests can be run using the command `mocha`, assuming\
    \ you've followed the recommended directory structure.\n\nBelow is the code we'll\
    \ use for the test runner. I'll save this file as `testrunner.html`.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Mocha Tests</title>\n<link rel=\"stylesheet\"\
    \ href=\"node_modules/mocha/mocha.css\">\n</head>\n<body>\n<div id=\"mocha\"></div>\n\
    <script src=\"node_modules/mocha/mocha.js\"></script>\n<script src=\"node_modules/chai/chai.js\"\
    ></script>\n<script>mocha.setup('bdd')</script>\n<! load code you want to test\
    \ here >\n<! load your test files here >\n<script>\nmocha.run()\n</script>\n</body>\n\
    </html>\n```\n\nThe important bits in the test runner are:\n\n- We load `Mocha`'s\
    \ CSS styles to give our test results nice formatting.\n- We create a `div` with\
    \ the ID `mocha`. This is where the test results are inserted.\n- We load `Mocha`\
    \ and `Chai`. They are located in subfolders of the `node_modules` folder since\
    \ we installed them via `npm`.\n- By calling `mocha.setup`, we make `Mocha`'s\
    \ testing helpers available.\n- Then, we load the code we want to test and the\
    \ test files. We don't have anything here just yet.\n- Last, we call `mocha.run`\
    \ to run the tests. Make sure you call this *after* loading the source and test\
    \ files.\n\n### The Basic Test Building Blocks\n\nNow that we can run tests, let's\
    \ start writing some.\n\nWe'll begin by creating a new file `test/arrayTest.js`.\
    \ An individual test file such as this one is known as a test case. I'm calling\
    \ it `arrayTest.js` because for this example, we'll be testing some basic array\
    \ functionality.\n\nEvery test case file follows the same basic pattern. First,\
    \ you have a `describe` block:\n\n```javascript\ndescribe('Array', function()\
    \ {\n  // Further code for tests goes here\n})\n```\n\n`describe` is used to group\
    \ individual tests. The first parameter should indicate what we're testing — in\
    \ this case, since we're going to test array functions, I've passed in the string\
    \ `'Array'`.\n\nSecondly, inside the `describe`, we'll have `it` blocks:\n\n```javascript\n\
    describe('Array', function() {\n  it('should start empty', function() {\n    //\
    \ Test implementation goes here\n  })\n  // We can have more its here\n})\n```\n\
    \n`it` is used to create the actual tests. The first parameter to `it` should\
    \ provide a human-readable description of the test. For example, we can read the\
    \ above as \"it should start empty\", which is a good description of how arrays\
    \ should behave. The code to implement the test is then written inside the function\
    \ passed to `it`.\n\nAll `Mocha` tests are built from these same building blocks,\
    \ and they follow this same basic pattern.\n\n1. First, we use `describe` to say\
    \ what we're testing for example, `\"describe how array should work\"`.\n2. Then,\
    \ we use a number of `it` functions to create the individual tests each `it` should\
    \ explain one specific behavior, such as `\"it should start empty\"` for our array\
    \ case above.\n\n### Writing the Test Code\n\nNow that we know how to structure\
    \ the test case, let's jump into the fun part — implementing the test.\n\nSince\
    \ we are testing that an array should start empty, we need to create an array\
    \ and then ensure it's empty. The implementation for this test is quite simple:\n\
    \n```javascript\nvar assert = chai.assert;\n\ndescribe('Array', function() {\n\
    \  it('should start empty', function() {\n    var arr = []\n    assert.equal(arr.length,\
    \ 0)\n  })\n})\n```\n\nNote on the first line, we set up the `assert` variable.\
    \ This is just so we don't need to keep typing `chai.assert` everywhere.\n\nIn\
    \ the `it` function, we create an array and check its length. Although simple,\
    \ this is a good example of how tests work.\n\n- First, you have something you're\
    \ testing — this is called the System Under Test or `SUT`.\n- Then, if necessary,\
    \ you do something with the `SUT`. In this test, we're not doing anything, since\
    \ we're checking the array starts as empty.\n- The last thing in a test should\
    \ be the validation — an *assertion* which checks the result.\n\nHere, we are\
    \ using `assert.equal` to do this. Most assertion functions take parameters in\
    \ the same order: First the \"actual\" value, and then the \"expected\" value.\n\
    \nThe *actual* value is the result from your test code, so in this case `arr.length`.\
    \ The *expected* value is what the result *should* be. Since an array should begin\
    \ empty, the expected value in this test is `0`.\n\n`Chai` also offers two different\
    \ styles of writing assertions, but we're using `assert` to keep things simple\
    \ for now. When you become more experienced with writing tests, you might want\
    \ to use the `expect` assertions instead, as they provide some more flexibility.\n\
    \n### Running the Test\n\nIn order to run this test, we need to add it to the\
    \ runner file we created. If you're using Node.js, you can skip this and use the\
    \ command `mocha` to run the test.\n\nOtherwise, to add this test to the runner,\
    \ simply add:\n\n```html\n<script src=\"test/arrayTest.js\"></script>\n```\n\n\
    ### The Test Results\n\nWhen you run tests, the test results will look something\
    \ like this (index-13_1.png-13_2.png)\n\nNote that what we entered into `describe`\
    \ and `it` functions show up in the output Note that it's also possible to nest\
    \ `describe` blocks to create further subgroupings. Let's take a look at what\
    \ a failing test looks like:\n\n```javascript\nassert.equal(arr.length, 0)\n```\n\
    \nReplace the number `0` with `1`. This makes the test fail, as the array's length\
    \ no longer matches the expected value. If you run the tests again, you'll see\
    \ the failing test in red with a description of what went wrong. One of the benefits\
    \ of tests is that they help you find bugs quicker, however this error is not\
    \ very helpful in that respect.\n\nMost of the assertion functions can also take\
    \ an optional `message` parameter. This is the message that is displayed when\
    \ the assertion fails. It's a good idea to use this parameter to make the error\
    \ message easier to understand. We can add a message to our assertion like so:\n\
    \n```javascript\nassert.equal(arr.length, 1, 'Array length was not 0')\n```\n\n\
    If you rerun tests, the custom message will appear instead of the default.\n\n\
    ### Putting It Together\n\nSo far we've looked at fairly simple examples. Let's\
    \ put what we've learned into practice and see how we would test a more realistic\
    \ piece of code.\n\nHere's a function which adds a CSS class to an element. This\
    \ should go in a new file `js/className.js`.\n\n```javascript\nfunction addClass(el,\
    \ newClass) {\n  if(el.className.indexOf(newClass) === 1) {\n    el.className\
    \ += newClass\n  }\n}\n```\n\nTo make it a bit more interesting, I made it add\
