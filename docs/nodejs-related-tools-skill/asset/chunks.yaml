    Step 5: Create Gulp Tasks


    On its own, Gulp does nothing. You must:


    1\. install Gulp plugins, and


    2\. write tasks which utilize those plugins to do something useful.


    It''s possible to write your own plugins but, since almost 3,000 are available,
    it''s unlikely you''ll ever need to. You can search using Gulp''s own directory
    at gulpjs.com/plugins/, on npmjs.com, or search "gulp *something*" to harness
    the mighty power of Google.


    Gulp provides three primary task methods:


    gulp.task — defines a new task with a name, optional array of dependencies and
    a function.


    gulp.src — sets the folder where source files are located.


    gulp.dest — sets the destination folder where build files will be placed.


    Any number of plugin calls are set with pipe between the .src and .dest.


    IMAGE TASK


    This is best demonstrated with an example, so let''s create a basic task which
    compresses images and copies them to the appropriate build folder. Since this
    process could take time, we''ll only compress new and modified files. Two plugins
    can help us: gulpnewer and gulpimagemin. Install them from the commandline: npm
    install gulpnewer gulpimagemin savedev


    We can now reference both modules the top of gulpfile.js:


    // Gulp.js configuration


    var


    // modules


    gulp = require(''gulp''),


    newer = require(''gulpnewer''),


    imagemin = require(''gulpimagemin''),


    We can now define the image processing task itself as a function at the end of
    gulpfile.js:


    // image processing


    gulp.task(''images'', function() {


    var out = folder.build + ''images/'';


    return gulp.src(folder.src + ''images/**/*'')


    .pipe(newer(out))


    .pipe(imagemin({ optimizationLevel: 5 }))


    .pipe(gulp.dest(out));


    });


    All tasks are syntactically similar. This code:


    1\. Creates a new task named images.


    2\. Defines a function with a return value which …


    3\. Defines an out folder where build files will be located.


    4\. Sets the Gulp src source folder. The /**/* ensures that images in subfolders
    are also processed.


    5\. Pipes all files to the gulpnewer module. Source files that are newer than
    corresponding destination files are passed through. Everything else is removed.


    6\. The remaining new or changed files are piped through gulpimagemin which sets
    an optional optimizationLevel argument.


    7\. The compressed images are output to the Gulp dest folder set by out.


    Save gulpfile.js and place a few images in your project''s src/images folder before
    running the task from the command line:


    gulp images


    All images are compressed accordingly and you’ll see output such as: Using file
    gulpfile.js


    Running ''imagemin''...


    Finished ''imagemin'' in 5.71 ms


    gulpimagemin: image1.png (saved 48.7 kB)


    gulpimagemin: image2.jpg (saved 36.2 kB)


    gulpimagemin: image3.svg (saved 12.8 kB)


    Try running gulp images again and nothing should happen because no newer images
    exist.


    HTML TASK


    We can now create a similar task which copies files from the source HTML folder.
    We can safely minify our HTML code to remove unnecessary whitespace and attributes
    using the gulphtmlclean plugin:


    npm install gulphtmlclean savedev


    This is then referenced at the top of gulpfile.js: var


    // modules


    gulp = require(''gulp''),


    newer = require(''gulpnewer''),


    imagemin = require(''gulpimagemin''),


    htmlclean = require(''gulphtmlclean''),


    We can now create an html task at the end of gulpfile.js:


    // HTML processing


    gulp.task(''html'', [''images''], function() {


    var


    out = folder.build + ''html/'',


    page = gulp.src(folder.src + ''html/**/*'')


    .pipe(newer(out));


    // minify production code


    if (!devBuild) {


    page = page.pipe(htmlclean());


    }


    return page.pipe(gulp.dest(out));


    });


    This reuses gulpnewer and introduces a couple of concepts: 1\. The [images] argument
    states that our images task must be run before processing the HTML (the HTML is
    likely to reference images). Any number of dependent tasks can be listed in this
    array and all will complete before the task function runs.


    2\. We only pipe the HTML through gulphtmlclean if NODE_ENV is set to production.
    Therefore, the HTML remains uncompressed during development which may be useful
    for debugging.


    Save gulpfile.js and run gulp html from the command line. Both the html and images
    tasks will run.


    JAVASCRIPT TASK


    Too easy for you? Let''s process all our JavaScript files by building a basic
    module bundler. It will:


    1\. Ensure dependencies are loaded first using the gulpdeporder plugin. This analyses
    comments at the top of each script to ensure correct ordering. For example, //


    requires: defaults.js lib.js.


    2\. Concatenate all script files into a single main.js file using gulpconcat.


    3\. Remove all console and debugging statements with gulpstripdebug and minimize
    code with gulpuglify. This step will only occur when running in production mode.


