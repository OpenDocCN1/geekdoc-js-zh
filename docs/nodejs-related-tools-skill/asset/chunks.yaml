    A model is an abstraction, usually represented by an object or a class in a generalpurpose
    programming language, and it refers/maps either to an SQL table in a relational
    database or a document (or keyvalue pairs) in a NoSQL database.


    You can create models using the Sails.js CLI:


    sails generate model product


    This will create a Product.js model in api/models with the following content:


    /**


