    This corresponds to the SELECT * FROM USERS query from an SQL database.


    The pretty method is a cursor method, and there are many others too. You can chain
    these methods to modify your query and the documents that are returned by the
    query.


    What if you need to filter queries and return a subset of the collection? Say,
    find all users who are below 30\. You can modify the query like this:


    &gt; db.users.find({ "age": { $lt: 30 } })


    { "_id" : ObjectId("5a52cb2451dd8b08d5a22cf7"), "name" : "Kate", "age" : 27, "email"
