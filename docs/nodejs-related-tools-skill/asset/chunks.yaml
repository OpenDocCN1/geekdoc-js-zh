    ![](index-23_179.png)\n![](index-23_180.png)\nother than to increment the progress\
    \ through the `for` loop. And there are methods that produce the side effect of\
    \ modifying variables that exist outside of their own definitions.\n\nAll of this\
    \ makes the code more brittle, less portable, and makes it harder to test the\
    \ methods outside of this narrow context.\n\n### Functional JavaScript\n\nThe\
    \ objectoriented approach is much cleaner and more modular than the imperative\
    \ approach we started with, but let’s see if we can improve it by addressing some\
    \ of the drawbacks we discussed. It would be great if we could find ways to take\
    \ advantage of JavaScript’s builtin ability to treat functions as firstclass objects\
    \ so that our code could be cleaner, more stable, and easier to repurpose.\n\n\
    ```javascript\n(function() {\n  \"use strict\"\n  var capify = function(str) {\n\
    \    return [str.charAt(0).toUpperCase(), str.substring(1)].join(\"\")\n  }\n\
    \  var processWords = function(fn, str) {\n    return str.split(\" \").map(fn).join(\"\
    \ \")\n  }\n  document.getElementById(\"main_button\").addEventListener(\"click\"\
    , function(e) {\n    var something = prompt(\"Give me something to capitalize\"\
    )\n    alert(processWords(capify, something))\n  })\n}())\n```\n\nDid you notice\
    \ how much shorter this version is? We’re only defining two functions: `capify`\
    \ and `processWords`. Each of these functions is pure, meaning they don’t rely\
    \ on the state of the code they’re called from. They don’t create side effects\
    \ that alter variables outside of themselves. There is one and only one result\
    \ a function returns for any given set of arguments. Because of these improvements,\
    \ the new functions are very easy to test, and could be snipped right out of this\
    \ code and used elsewhere.\n\nThere might have been one keyword in there that\
    \ you wouldn’t recognize unless you’ve peeked at some functional code before.\
    \ We took advantage of the new `map` method on `Array` to apply a function to\
    \ each element of the temporary array we created when we split our string. `Map`\
    \ is just one of a handful of convenience methods we were given when modern browsers\
    \ and serverside JavaScript interpreters implemented `ECMAscript 5` standards.\n"
