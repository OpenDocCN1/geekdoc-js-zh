  raw: 'actions that needs to be present in most APIs. The others are related to foreign
    records: add to: used to add a foreign record to another record collection (e.g
    a product to a user’s products).


    populate where: used to populate and return foreign record(s) for the given association
    of another record. Read more information here.


    remove from: used to remove a foreign record (e.g. a product) from one of a related
    record collection association (e.g. user’s products). See more information and
    examples here.


    For customizing the behavior of the default actions, you can do either of these:
    Override the action in a specified controller. That is, create an action with
    the same name as one of these actions: find, findOne, create, update, destroy,
    populate, add or remove.


    Override the default action for all controllers. You can do this by creating an
    api/blueprints folder, where you need to add files with lowercase names for a
    default action (e.g. find.js, findone.js, create.js, etc.). You can find more
    information about blueprints by checking the Sails.js Blueprint API docs.


    ROUTING IN SAILS.JS


    Routes allow you to map URLs to controllers or views. Just like the default actions,
    Sails.js automatically adds default routes for the default actions, allowing you
    to have an automatic API by just creating models and controllers.


    You can also add custom routes for your custom actions or views. To add a route,
    open the config/routes.js file and add this:


    module.exports.routes = {


    ''/products'': {


    view: ''products''


    }


    };


    This maps /products to the template named *products* in views folder.


    You can optionally add an HTTP verb to the URL. For example:


    module.exports.routes = {


    ''get /'': {


    view: ''homepage''


    }


    };


    You can also specify a controller action for a route. For example: module.exports.routes
    = {


    ''post /product'': ''ProductController.create'',


    };


    This tells Sails.js to call the *create* action of the *ProductController* controller
    when a client sends a POST request to the /product endpoint.


    Conclusion


    In this chapter, you were introduced to Sails.js. We looked at the basic concepts
    of Sails.js, and how to generate a new Sails.js project, and then created an API
    by just generating models, adding some attributes then generate controllers. Sails.js
    has other advanced concepts such as services, policies, blueprints and hooks.
    These you can further discover on your own, once you grasp and get familiar with
    the basic concepts in this introduction.


