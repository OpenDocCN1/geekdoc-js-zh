    ![](img/index-69_336.png)\n\n```javascript\n// 配置数据库主机、用户、密码的连接，SQLite 不需要这些\n\
    const sequelize = new Sequelize(null, null, null, {\n  dialect: 'sqlite',\n  storage:\
    \ path.join('tmp', 'db.sqlite') // SQLite 将数据直接持久化到文件\n})\n\n// 在这里我们定义 Article\
    \ 模型，包含一个字符串类型的 title 属性和一个文本类型的 body 属性。默认情况下，所有表都会 id、createdAt 和 updatedAt\
    \ 列。\n\nconst Article = sequelize.define('article', {\n  title: Sequelize.STRING,\n\
    \  body: Sequelize.TEXT\n})\n\n// 创建表\nArticle.sync()\n\nmodule.exports = {\n\
    \  Article\n}\n```\n\n让我们通过导入新模型并将路由处理程序替换为以下内容来测试它：\n\n```javascript\n// server.js\n\
    const { Article } = require('./models')\n\nserver.route({\n  method: 'GET',\n\
    \  path: '/',\n  handler: () => {\n    // 尝试逐行注释掉这些代码\n    return Article.findAll()\n\
    \n    return Article.create({ title: '欢迎来到我的博客', body: '地球上的乐园' }) return Article.findById(1)\n\
    \n    return Article.update({ title: '学习 Hapi', body: `JSON API 轻而易举.` }, { where:\
    \ { id: 1 } }) return Article.findAll()\n\n    return Article.destroy({ where:\
    \ { id: 1 } })\n\n    return Article.findAll()\n  }\n})\n```\n\n如果你熟悉 SQL 或其他\
    \ ORM，`Sequelize` 的 API 应该是自而易懂的，它是基于 Promise 构建的，因此与 Hapi 的异步处理程序完美契合。\n\n"
- fmt: "\nNote: using `Article.sync()` to create the tables or `Article.sync({ force:\
    \ true })` to drop and create are fine for the purposes of this demo. If you’re\
    \ wanting to use this in production you should check out `sequelizecli` and write\
    \ `Migrations` for any schema changes.\n\n## Our RESTful Actions\n\nLet’s build\
    \ the following routes:\n\n- `GET /articles` fetch all articles\n- `GET /articles/:id`\
    \ fetch article by id\n- `POST /articles` create article with `{ title, body }`\
    \ params\n- `PUT /articles/:id` update article with `{ title, body }` params\n\
    - `DELETE /articles/:id` delete article by id\n\nAdd a new file, `routes.js`,\
    \ to separate the server config from the application logic:\n\n```javascript\n\
    // routes.js\n\nconst { Article } = require('./models')\n\nexports.configureRoutes\
    \ = (server) => {\n  // server.route accepts an object or an array\n  return server.route([{\n\
    \    method: 'GET',\n    path: '/articles',\n    handler: () => {\n      return\
    \ Article.findAll()\n    }\n  }, {\n    method: 'GET',\n    // The curly braces\
    \ are how we define params (variable path segments in the URL)\n    path: '/articles/{id}',\n\
    \    handler: (request) => {\n      return Article.findById(request.params.id)\n\
    \    }\n  }, {\n    method: 'POST',\n    path: '/articles',\n    handler: (request)\
    \ => {\n      const article = Article.build(request.payload.article)\n      return\
    \ article.save()\n    }\n  }, {\n    // method can be an array\n    method: ['PUT',\
    \ 'PATCH'],\n    path: '/articles/{id}',\n    handler: async (request) => {\n\
    \      const article = await Article.findById(request.params.id)\n      article.update(request.payload.article)\n\
    \      return article.save()\n    }\n  }])\n}\n```\n\n![](index-71_1.png)\n![](index-71_2.png)\n\
