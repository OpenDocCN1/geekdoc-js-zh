    \n}\n\n{\n  \"_id\" : ObjectId(\"5a52cb2451dd8b08d5a22cf8\"),\n  \"name\" : \"\
    Watson\",\n  \"age\" : 15,\n  \"email\" : \"watson@example.com\"\n}\n\nThis corresponds\
    \ to the `SELECT * FROM USERS` query from an SQL database.\n\nThe `pretty` method\
    \ is a cursor method, and there are many others too. You can chain these methods\
    \ to modify your query and the documents that are returned by the query.\n\nWhat\
    \ if you need to filter queries and return a subset of the collection? Say, find\
    \ all users who are below 30. You can modify the query like this:\n\n```\ndb.users.find({\
    \ \"age\": { $lt: 30 } })\n```\n\n{ \"_id\" : ObjectId(\"5a52cb2451dd8b08d5a22cf7\"\
    ), \"name\" : \"Kate\", \"age\" : 27, \"email\" : \"kate@example.com\" }\n{ \"\
    _id\" : ObjectId(\"5a52cb2451dd8b08d5a22cf8\"), \"name\" : \"Watson\", \"age\"\
    \ : 15, \"email\" : \"watson@example.com\" }\n\n`$lt` is a query filter operator\
    \ that selects documents whose `age` field value is less than 30. There are many\
    \ comparison and logical query filters available, and you see the entire list\
    \ in the Query Selector documentation.\n\n## UPDATE OPERATION\n\nThe update operation\
    \ modifies the document in a collection. Similar to the create operation, MongoDB\
    \ offers two methods for updating a document. They are:\n1. `db.collection.updateMany(filter,\
    \ update, options)`\n2. `db.collection.updateMany(filter, update, options)`.\n\
    \nIf you need to add an extra field, say `registration`, to all the existing documents\
    \ in a collection, you can:\n\n```javascript\ndb.collection.updateMany({ \"age\"\
    : { $lt: 30 } }, { $set: { \"registration\": \"active\" } })\n```\n\n## DELETE\
    \ OPERATION\n\nThe delete operation removes a document from a collection. Similar\
    \ to the update operation, MongoDB offers two methods for deleting a document.\
    \ They are:\n1. `db.collection.deleteOne(filter)`\n2. `db.collection.deleteMany(filter)`.\n\
    \nIf you need to delete a single document that matches a criteria, you can use:\n\
    \n```\ndb.collection.deleteOne({ \"name\": \"Tom\" })\n```\n\nIf you need to delete\
    \ all documents that match a criteria, you can use:\n\n```\ndb.collection.deleteMany({\
    \ \"age\": { $lt: 30 } })\n```\n\n## Overview of Drivers\n\nFor an application\
    \ to communicate with the server, you have to use a driver. MongoDB has official\
    \ and thirdparty drivers that interact with the database.\n\n### MODB NODE.JS\
    \ DRIVER\n\nThis is the official driver for Node.js. The driver can interact with\
    \ the database using promises or callbacks. The example below demonstrates connecting\
    \ the server:\n\n```javascript\nconst MongoClient = require('mongodb');\nconst\
    \ assert = require('assert');\n\n// Connection URL\nconst url = 'mongodb://localhost:27017/exampledb';\n\
    // Database Name\nconst dbName = 'exampledb';\n\n(async function() {\n  let client;\n\
    \  try {\n    // Attempts to connect to the server\n    client = await MongoClient.connect(url);\n\
    \    console.log(\"Successfully connected to the server.\");\n    const db = client.db(dbName);\n\
    \  } catch (err) {\n    //Log errors to console\n    console.log(err.stack);\n\
    \  }\n\n  if (client) {\n    client.close();\n  }\n})();\n```\n\n### MONGOOSE\
    \ DRIVER\n\nAnother popular Node.js driver for MongoDB is Mongoose. Mongoose is\
    \ built on top of the official MongoDB driver. Back when Mongoose was released,\
    \ it had tons of features that the native MongoDB driver didn’t. One prominent\
    \ feature was the ability to define a schema structure that would get mapped onto\
    \ the database’s collection.\n\nHowever, the latest versions of MongoDB have adopted\
    \ some of these features in the form of JSON schema and schema validation.\n\n\
    Apart from schema, other fancy features of Mongoose include Models, Validators\
    \ and middlewares, the populate method, plugins and so on. You can read more about\
    \ these in the Mongoose docs. Here’s an example to demonstrate mongoose.connect()\
    \ for connecting to the database:\n\n```javascript\nvar mongoose = require('mongoose');\n\
    \n// Connection URL\nconst url = 'mongodb://localhost:27017/exampledb';\n\nmongoose.connect(url);\n\
    \nvar db = mongoose.connection;\n\ndb.on('error', console.error.bind(console,\
    \ 'connection error:'));\n\ndb.once('open', function() {\n  // we're connected!\n\
    });\n```\n\n## Conclusion\n\nMongoDB is a popular NoSQL database solution that\
    \ suits modern development requirements. In this tutorial, we’ve covered the basics\
    \ of MongoDB, the Mongo shell and some of the popular drivers available. We’ve\
    \ also explored the common database operations and CRUD actions within the Mongo\
    \ shell. Now it’s time for you to head out and try what we’ve covered here and\
    \ more. If you want to learn more, I recommend creating a REST API with MongoDB\
    \ and Node to acquaint yourself with the common database operations and methods.\n"
