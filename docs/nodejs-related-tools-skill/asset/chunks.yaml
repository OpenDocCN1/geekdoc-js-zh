    ![](index-69_336.png)\n\n```javascript\n// configure connection to db host, user,\
    \ pass not required for SQLite\nconst sequelize = new Sequelize(null, null, null,\
    \ {\n  dialect: 'sqlite',\n  storage: path.join('tmp', 'db.sqlite') // SQLite\
    \ persists its data directly to file\n})\n\n// Here we define our Article model\
    \ with a title attribute of type string, and a body attribute of type text. By\
    \ default, all tables get columns for id, createdAt, updatedAt as well.\n\nconst\
    \ Article = sequelize.define('article', {\n  title: Sequelize.STRING,\n  body:\
    \ Sequelize.TEXT\n})\n\n// Create table\nArticle.sync()\n\nmodule.exports = {\n\
    \  Article\n}\n```\n\nLet’s test out our new model by importing it and replacing\
    \ our route handler with the following:\n\n```javascript\n// server.js\nconst\
    \ { Article } = require('./models')\n\nserver.route({\n  method: 'GET',\n  path:\
    \ '/',\n  handler: () => {\n    // try commenting these lines out one at a time\n\
    \    return Article.findAll()\n\n    return Article.create({ title: 'Welcome to\
    \ my blog', body: 'The happiest place on earth' }) return Article.findById(1)\n\
    \n    return Article.update({ title: 'Learning Hapi', body: `JSON API's a breeze.`\
    \ }, { where: { id: 1 } }) return Article.findAll()\n\n    return Article.destroy({\
    \ where: { id: 1 } })\n\n    return Article.findAll()\n  }\n})\n```\n\nIf you’re\
    \ familiar with SQL or other ORM’s, the `Sequelize` API should be self explanatory,\
    \ It’s built with Promises so it works great with Hapi’s async handlers too.\n"
