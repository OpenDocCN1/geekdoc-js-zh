    http GET http://localhost:3000/articles


    http GET http://localhost:3000/articles/2


    http PUT http://localhost:3000/articles/2 article:=''{"title": "True happiness,
    is an inner quality"}''


    http GET http://localhost:3000/articles/2


    http DELETE http://localhost:3000/articles/2


    http GET http://localhost:3000/articles


    Okay, everything seems to be working well. Let’s try a few more: http GET http://localhost:3000/articles/12345


    http DELETE http://localhost:3000/articles/12345


    *Yikes*! When we try to fetch an article that doesn’t exist, we get a 200 with
    an empty body and our destroy handler throws an Error which results in a 500\.
    This is happening because findById returns null by default when it can’t find
    a record. We want our API to respond with a 404 in both of these cases. There’s
    a few ways we can achieve this.


    DEFENSIVELY CHECK FOR NULL VALUES AND RETURN AN ERROR


    There’s a package called boom which helps create standard error response objects:
    npm install save boom


    Import it and modify GET /articles/:id route:


    // routes.js


    const Boom = require(''boom'')


    {


    method: ''GET'',


    path: ''/articles/{id}'',


    handler: async (request) =&gt; {


    const article = await Article.findById(request.params.id) if (article === null)
    return Boom.notFound()


    return article


    }


    }


    EXTEND SEQUELIZE.MODEL TO THROW AN ERROR


    Sequelize.Model is a reference to the prototype that all of our Models inherit
    from,


    so we can easily add a new method find to findById and throw an error if it returns
    null:


    // models.js


    const Boom = require(''boom'')


    Sequelize.Model.find = async function (...args) {


    const obj = await this.findById(...args)


    if (obj === null) throw Boom.notFound()


    return obj


    }


    We can then revert the handler to its former glory and replace occurrences of
    findById with find:


    {


    method: ''GET'',


    path: ''/articles/{id}'',


    handler: (request) =&gt; {


    return Article.find(request.params.id)


    }


    }


    http GET http://localhost:3000/articles/12345


    http DELETE http://localhost:3000/articles/12345


    *Boom*. We now get a 404 *Not Found* error whenever we try to fetch something
    from the database that doesn’t exist. We’ve replaced our custom error checks with
    an easytounderstand convention that keeps our code clean.


    *Note: another popular tool for making requests to REST APIs is Postman. If you*
    *prefer a UI and ability to save common requests, this is a great option.*


    Path Parameters


    The routing in Hapi is a little different from other frameworks. The route is
    selected on the *specificity* of the path, so the order you define them in doesn’t
    matter.


    /hello/{name} matches /hello/bob and passes ''bob'' as the *name* param


    /hello/{name?} — the ? makes name optional and matches both /hello and


    /hello/bob


    /hello/{name*2} — the * denotes multiple segments, matching


    /hello/bob/marley by passing ''bob/marley'' as the *name* param


    /{args*} matches /any/route/imaginable and has the lowest specificity.


    The Request Object


    The request object that’s passed to the route handler has the following useful
    properties:


    request.params — path params


    request.query — query string params


    request.payload — request body for JSON or form params request.state — cookies


    request.headers


    request.url


    Adding a Second Model


    Our second model will handle comments on articles. Here’s the complete file:


    // models.js


    const path = require(''path'')


    const Sequelize = require(''sequelize'')


    const Boom = require(''boom'')


    Sequelize.Model.find = async function (...args) {


    const obj = await this.findById(...args)


    if (obj === null) throw Boom.notFound()


    return obj


    }


    const sequelize = new Sequelize(null, null, null, {


    dialect: ''sqlite'',


    storage: path.join(''tmp'', ''db.sqlite'')


    })


    const Article = sequelize.define(''article'', {


    title: Sequelize.STRING,


    body: Sequelize.TEXT


    })


