- fmt: "\nMongoDB is supported by all major platforms and distributions, and you can\
    \ check out their documentation if you’re in doubt.\n\nI’ve covered the instructions\
    \ for installing MongoDB on macOS below. For Linux, MongoDB recommends installing\
    \ the software with the help of your distribution’s package manager. If you’re\
    \ on Windows, it’s as easy as downloading the latest release from from the MongoDB\
    \ website and running the interactive installer.\n\n# Installing MongoDB on macOS\
    \ using Homebrew\n\nHomebrew is a package manager for macOS, and this tutorial\
    \ assumes you’ve already installed Homebrew on your machine.\n\n1. Open the terminal\
    \ application and run\n```bash\nbrew update\n```\n2. Once `brew` is updated, install\
    \ the `mongodb` package as follows\n```bash\nbrew install mongodb\n```\n3. Create\
    \ a data directory so that the `mongod` process will be able to write data. By\
    \ default, the directory is `/data/db`:\n```bash\nmkdir -p /data/db\n```\n4. Make\
    \ sure your user account has permission to read and write data into that directory:\n\
    ```bash\nsudo chown -R $id /data/db\n```\n# Enter your password\n5. Initiate the\
    \ mongo server. Run the `mongod` command to start the server.\n6. Start the Mongo\
    \ shell. Open up another terminal window and run `mongo`. The mongo shell will\
    \ attempt to connect to the mongo daemon that we initiated earlier.\n\nOnce you’re\
    \ successfully connected, you can use the shell as a playground to safely run\
    \ all your commands.\n7. Exit the Mongo shell by running `quit()` and the mongo\
    \ daemon by pressing `control + C`.\n\nNow that we have the mongo daemon up and\
    \ running, let’s get acquainted with the MongoDB basics.\n\n# Basic Database Operations\n\
    \nEnter the Mongo shell if you haven’t already:\n\n```bash\n[mj@localhost ~]$\
    \ mongo\nMongoDB shell version v3.6.1\nconnecting to: mongodb://127.0.0.1:27017\n\
    MongoDB server version: 3.6.1\nconnecting to: test\n```\nYou can see my version\
    \ of MongoDB shell when you log in. By default, you’re connected to a test database.\
    \ You can verify the name of the current database by running `db`:\n```bash\n\
    db\ntest\n```\nThat’s awesome, but what if we want a new database? To create a\
    \ database, MongoDB has a `use DATABASE_NAME` command:\n```bash\nuse exampledb\n\
    switched to db exampledb\n```\nTo display all the existing databases, try `show\
    \ dbs`:\n```bash\nshow dbs\nlocal 0.078GB\nprototype 0.078GB\ntest 0.078GB\n```\n\
    The exampledb isn’t in the list because we need to insert at least one document\
    \ into the database. To insert a document, you can do `db.COLLECTION_NAME.insertOne({\"\
    key\":\"value\"})`. Here’s an example:\n```javascript\ndb.users.insertOne({'name':'Bob'})\n\
    {\n  \"acknowledged\" : true,\n  \"insertedId\" : ObjectId(\"5a52c53b223039ee9c2daaec\"\
    )\n}\n```\nMongoDB automatically creates a new users collection and inserts a\
    \ document with the keyvalue pair `'name':'Bob'`. The `ObjectId` returned is the\
    \ id of document inserted. MongoDB creates a unique `ObjectId` for each document\
    \ on creation and it becomes the default value of the `_id` field:\n```bash\n\
    show dbs\nexampledb 0.078GB\nlocal 0.078GB\nprototype 0.078GB\ntest 0.078GB\n\
    ```\nSimilarly, you can confirm that the collection was created using the `show\
    \ collections` command:\n```bash\nshow collections\nusers\n```\nWe’ve created\
    \ a database, added a collection named users and inserted a document into it.\
    \ Now let’s try dropping it. To drop an existing database, use the `dropDatabase()`\
    \ command as exemplified below:\n```javascript\ndb.dropDatabase()\n{ \"ok\" :\
    \ 1 }\n```\n`show dbs` confirms that the database was indeed dropped:\n```bash\n\
    show dbs\nlocal 0.078GB\nprototype 0.078GB\ntest 0.078GB\n```\nFor more database\
    \ operations, see MongoDB reference page on Database Commands.\n\n# MongoDB CRUD\
    \ Operations\n\nAs you might already know, the CRUD acronym stands for Create,\
    \ Read, Update, and Delete. These are the four basic database operations that\
    \ you can’t avoid while building an application. For instance, any modern application\
    \ will have the ability to create a new user, read the user data, update the user\
    \ information and, if needed, delete the user account. Let’s accomplish this at\
    \ the database level using MongoDB.\n\n## CREATE OPERATION\n\nCreation is the\
    \ same as inserting a document into a collection. In the previous section, we\
    \ had inserted a single document using the `db.collection.insertOne()` syntax.\
    \ There’s another method called `db.collection.insertMany()` that lets you insert\
    \ multiple documents at once. Here’s the syntax:\n```javascript\ndb.COLLECTION_NAME.insertMany(\n\
    \  [ <document 1>, <document 2>, ... ]\n)\n```\nLet’s create a users collection\
    \ and populate it with some actual users:\n```javascript\ndb.users.insertMany([\n\
    \  { \"name\": \"Tom\",\"age\":33, \"email\": \"tom@example.com\" },\n  { \"name\"\
    :\"Bob\", \"age\":35, \"email\":\"bob@example.com\" },\n  { \"name\":\"Kate\"\
    , \"age\": 27, \"email\": \"kate@example.com\" },\n  { \"name\":\"Watson\", \"\
    age\":15, \"email\": \"watson@example.com\"}\n])\n{\n  \"acknowledged\" : true,\n\
    \  \"insertedIds\" : [\n    ObjectId(\"5a52c53b223039ee9c2da5\"),\n    ObjectId(\"\
    5a52c53b223039ee9c2da6\"),\n    ObjectId(\"5a52c53b223039ee9c2da7\")\n  ]\n}\n\
    ```\nThe `insertMany` method accepts an array of objects, in return we get an\
    \ array of `ObjectIds`.\n\n## READ OPERATION\n\nRead operation is used to retrieve\
    \ a document or multiple documents from a collection. The syntax for the read\
    \ operation is as follows:\n```javascript\ndb.collection.find(query, projection)\n\
    ```\n*(Note: The repetitive list of image placeholders in the original text has\
    \ been omitted for clarity as per document structure optimization).*\n"
  raw: 'MongoDB is supported by all major platforms and distributions, and you can
    check out their documentation if you’re in doubt.


    I’ve covered the instructions for installing MongoDB on macOS below. For Linux,
    MongoDB recommends installing the software with the help of your distribution’s


    package manager. If you’re on Windows, it’s as easy as downloading the latest
    release from from the MongoDB website and running the interactive installer.


    Installing MongoDB on macOS using Homebrew


    Homebrew is a package manager for macOS, and this tutorial assumes you’ve already
    installed Homebrew on your machine.


    1\. Open the terminal application and run


    $ brew update


    1\. Once brew is updated, install the mongodb package as follows $ brew install
    mongodb


    1\. Create a data directory so that the mongod process will be able to write data.
    By default, the directory is /data/db:


    $ mkdir p /data/db


    2\. Make sure your user account has permission to read and write data into that
    directory:


    $ sudo chown R ìd un` /data/db


    &gt; # Enter your password


    3\. Initiate the mongo server. Run the mongod command to start the server.


    4\. Start the Mongo shell. Open up another terminal window and run mongo. The
    mongo shell will attempt to connect to the mongo daemon that we initiated earlier.


    Once you’re successfully connected, you can use the shell as a playground to safely
    run all your commands.


    5\. Exit the Mongo shell by running quit() and the mongo daemon by pressing control
    + C.


    Now that we have the mongo daemon up and running, let’s get acquainted with the
    MongoDB basics.


    Basic Database Operations


    Enter the Mongo shell if you haven’t already:


    [mj@localhost ~]$ mongo


    MongoDB shell version v3.6.1


    connecting to: mongodb://127.0.0.1:27017


    MongoDB server version: 3.6.1


    connecting to: test


    You can see my version of MongoDB shell when you log in. By default, you’re connected
    to a test database. You can verify the name of the current database by running
    db:


    &gt; db


    test


    That’s awesome, but what if we want a new database? To create a database, MongoDB


    has a use DATABASE_NAME command:


    &gt;use exampledb


    switched to db exampledb


    To display all the existing databases, try show dbs:


    &gt; show dbs


    local 0.078GB


    prototype 0.078GB


    test 0.078GB


    The exampledb isn’t in the list because we need to insert at least one document
    into the database. To insert a document, you can do


    db.COLLECTION_NAME.insertOne({"key":"value"}). Here’s an example:


    &gt; db.users.insertOne({''name'':''Bob''})


    {


    "acknowledged" : true,


    "insertedId" : ObjectId("5a52c53b223039ee9c2daaec")


    }


    MongoDB automatically creates a new users collection and inserts a document with
    the keyvalue pair ''name'':''Bob''. The ObjectId returned is the id of document
    inserted. MongoDB creates a unique ObjectId for each document on creation and
    it becomes the default value of the _id field:


    &gt;show dbs


    exampledb 0.078GB


    local 0.078GB


    prototype 0.078GB


    test 0.078GB


    Similarly, you can confirm that the collection was created using the show collections
    command:


    &gt; show collections


    users


    We’ve created a database, added a collection named users and inserted a document
    into it. Now let’s try dropping it. To drop an existing database, use the dropDatabase()
    command as exemplified below:


    &gt;db.dropDatabase()


    { "ok" : 1 }


    show dbs confirms that the database was indeed dropped.


    > show dbs


    local 0.078GB


    prototype 0.078GB


    test 0.078GB


    For more database operations, see MongoDB reference page on Database Commands.


    MongoDB CRUD Operations


    As you might already know, the CRUD acronym stands for Create, Read, Update, and
    Delete. These are the four basic database operations that you can’t avoid while
    building


    an application. For instance, any modern application will have the ability to
    create a new user, read the user data, update the user information and, if needed,
    delete the user account. Let’s accomplish this at the database level using MongoDB.


    CREATE OPERATION


    Creation is the same as inserting a document into a collection. In the previous
    section, we had inserted a single document using the db.collection.insertOne()
    syntax.


    There’s another method called db.collection.insertMany() that lets you insert
    multiple documents at once. Here’s the syntax:


    &gt; db.COLLECTION_NAME.insertMany(


    [ &lt;document 1&gt; , &lt;document 2&gt;, ... ]


    )


    Let’s create a users collection and populate it with some actual users:


    &gt; db.users.insertMany([


    { "name": "Tom","age":33, "email": "tom@example.com" },


    { "name":"Bob", "age":35, "email":"bob@example.com" },


    { "name": "Kate", "age": 27, "email": "kate@example.com" },


    { "name": "Watson", "age":15, "email":"watson@example.com"}


    ])


    {


    "acknowledged" : true,


    "insertedIds" : [


    ObjectId("5a52cb2451dd8b08d5a22cf5"),


    ObjectId("5a52cb2451dd8b08d5a22cf6"),


    ObjectId("5a52cb2451dd8b08d5a22cf7"),


    ObjectId("5a52cb2451dd8b08d5a22cf8")


    ]


    }


    The insertMany method accepts an array of objects and, in return, we get an array
    of ObjectIds.


    READ OPERATION


    Read operation is used to retrieve a document or multiple documents from a collection.


    The syntax for the read operation is as follows:


    &gt; db.collection.find(query, projection)


