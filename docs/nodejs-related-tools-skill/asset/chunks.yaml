    ![](img/index-30_158.png)\n![](img/index-30_159.png)\n\n## 第 4 ：本地安装 Gulp\n\n\
    现在你可以可以使用以下命令在项目文件夹中安装 Gulp：\n\n```bash\nnpm install gulp --dev\n```\n\n这会将 Gulp\
    \ 安装为开发依赖，并相应地更新 `package.json` 中的 `devDependencies` 部分。在教程的剩余部分，我们假设 Gulp 和所有插件都是开发依赖。\n\
    \n## 备用部署方案\n\n当操作系统中的 `NODE_ENV` 环境变量设置为 `production` 时，不会安装开发依赖。你通常会在你的生产服务器上使用\
    \ Mac/Linux 命令执行此操作：\n\n```bash\nexport NODE_ENV=production\n```\n\n或在 Windows\
    \ 上：\n\n```bash\nset NODE_ENV=production\n```\n\n本教程假设你的资源将被编译到 build 文件夹并提交到你的\
    \ Git 存储库，或直接上传到服务器。然而，如果你想更改创建资源的方式，在生产服务器上构建资源可能会更理想。例如，HTML、CSS 和 JavaScript\
    \ 文件在生产环境中进行压缩，而在开发环境中不会。在这种情况下，请为 Gulp 和所有插件使用 save 选项，即：\n\n```bash\nnpm install\
    \ gulp save\n```\n\n"
- fmt: "\nThis sets `Gulp` as an application dependency in the `\"dependencies\"`\
    \ section of `package.json`. It will be installed when you enter `npm install`\
    \ and can be run wherever the project is deployed. You can remove the build folder\
    \ from your repository since the files can be created on any platform when required.\n\
    \n## Step 4: Create a Gulp Configuration File\n\nCreate a new `gulpfile.js` configuration\
    \ file in the root of your project folder. Add some basic code to get started:\n\
    \n```javascript\n// Gulp.js configuration\n\nvar\n\n// modules\n\ngulp = require('gulp'),\n\
    \n// development mode?\ndevBuild = (process.env.NODE_ENV !== 'production'),\n\n\
    // folders\nfolder = {\n  src: 'src/',\n  build: 'build/'\n}\n```\n\nThis references\
    \ the `Gulp` module, sets a `devBuild` variable to true when running in development\
    \ (or nonproduction mode) and defines the source and build folder locations.\n\
    \n## ES6\n\nES5compatible JavaScript code is provided in this tutorial. This wil\
    \ work for al versions of `Gulp` and `Node.js` with or without the harmony flag.\
    \ Most ES6 features are supported in `Node 6` and above so feel free to use arrow\
    \ functions, `let`, `const`, etc. if you're using a recent version.\n\n`gulpfile.js`\
    \ won't do anything yet because you need to …\n\n## Step 5: Create Gulp Tasks\n\
    \nOn its own, `Gulp` does nothing. You must:\n\n1. install `Gulp` plugins, and\n\
    2. write tasks which utilize those plugins to do something useful.\n\nIt's possible\
    \ to write your own plugins but, since almost 3,000 are available, it's unlikely\
    \ you'll ever need to. You can search using `Gulp`'s own directory at `gulpjs.com/plugins/`,\
    \ on `npmjs.com`, or search `\"gulp *something*\"` to harness the mighty power\
    \ of Google.\n\n`Gulp` provides three primary task methods:\n\n- `gulp.task` —\
    \ defines a new task with a name, optional array of dependencies and a function.\n\
    - `gulp.src` — sets the folder where source files are located.\n- `gulp.dest`\
    \ — sets the destination folder where build files will be placed.\n\nAny number\
    \ of plugin calls are set with pipe between the `.src` and `.dest`.\n\n## IMAGE\
    \ TASK\n\nThis is best demonstrated with an example, so let's create a basic task\
    \ which compresses images and copies them to the appropriate build folder. Since\
    \ this process could take time, we'll only compress new and modified files. Two\
    \ plugins can help us: `gulpnewer` and `gulpimagemin`. Install them from the commandline:\
    \ `npm install gulpnewer gulpimagemin savedev`\n\nWe can now reference both modules\
    \ the top of `gulpfile.js`:\n\n```javascript\n// Gulp.js configuration\n\nvar\n\
    \n// modules\n\ngulp = require('gulp'),\nnewer = require('gulpnewer'),\nimagemin\
    \ = require('gulpimagemin'),\n```\n\nWe can now define the image processing task\
    \ itself as a function at the end of `gulpfile.js`:\n\n```javascript\n// image\
    \ processing\n\ngulp.task('images', function() {\n  var out = folder.build + 'images/'\n\
    \  return gulp.src(folder.src + 'images/**/*')\n    .pipe(newer(out))\n    .pipe(imagemin({\
    \ optimizationLevel: 5 }))\n    .pipe(gulp.dest(out))\n})\n```\n\nAll tasks are\
    \ syntactically similar. This code:\n\n1. Creates a new task named `images`.\n\
    2. Defines a function with a return value which …\n3. Defines an `out` folder\
    \ where build files will be located.\n4. Sets the `Gulp` src source folder. The\
    \ `**/*` ensures that images in subfolders are also processed.\n5. Pipes all files\
    \ to the `gulpnewer` module. Source files that are newer than corresponding destination\
    \ files are passed through. Everything else is removed.\n6. The remaining new\
    \ or changed files are piped through `gulpimagemin` which sets an optional `optimizationLevel`\
    \ argument.\n7. The compressed images are output to the `Gulp` dest folder set\
    \ by `out`.\n\nSave `gulpfile.js` and place a few images in your project's `src/images`\
    \ folder before running the task from the command line:\n\n```bash\ngulp images\n\
    ```\n\nAll images are compressed accordingly and you’ll see output such as:\n\
    `Using file gulpfile.js`\n`Running 'imagemin'...`\n`Finished 'imagemin' in 5.71\
    \ ms`\n`gulpimagemin: image1.png (saved 48.7 kB)`\n`gulpimagemin: image2.jpg (saved\
    \ 36.2 kB)`\n`gulpimagemin: image3.svg (saved 12.8 kB)`\n\nTry running `gulp images`\
    \ again and nothing should happen because no newer images exist.\n\n## HTML TASK\n\
    \nWe can now create a similar task which copies files from the source HTML folder.\
    \ We can safely minify our HTML code to remove unnecessary whitespace and attributes\
    \ using the `gulphtmlclean` plugin:\n\n```bash\nnpm install gulphtmlclean savedev\n\
    ```\n\nThis is then referenced at the top of `gulpfile.js`:\n\n```javascript\n\
    // modules\n\ngulp = require('gulp'),\nnewer = require('gulpnewer'),\nimagemin\
    \ = require('gulpimagemin'),\nhtmlclean = require('gulphtmlclean'),\n```\n\nWe\
    \ can now create an html task at the end of `gulpfile.js`:\n\n```javascript\n\
    // HTML processing\n\ngulp.task('html', ['images'], function() {\n  var out =\
    \ folder.build + 'html/',\n  page = gulp.src(folder.src + 'html/**/*')\n    .pipe(newer(out))\n\
    \  // minify production code\n  if (!devBuild) {\n    page = page.pipe(htmlclean())\n\
    \  }\n  return page.pipe(gulp.dest(out))\n})\n```\n\nThis reuses `gulpnewer` and\
    \ introduces a couple of concepts:\n\n1. The `[images]` argument states that our\
    \ images task must be run before processing the HTML (the HTML is likely to reference\
    \ images). Any number of dependent tasks can be listed in this array and all will\
    \ complete before the task runs.\n2. We only pipe the HTML through `htmlclean`\
    \ if `NODE_ENV` is set to production. Therefore, the HTML remains uncompressed\
    \ during development which may be useful for debugging.\n\nSave `gulpfile.js`\
    \ and run `gulp html` from the command line. Both the html and images tasks will\
    \ run.\n\n## JAVASCRIPT TASK\n\nToo easy for you? Let's process all our JavaScript\
    \ files by building a module bundler. It will:\n\n1. Ensure dependencies are loaded\
    \ first using the `gulporder` plugin. This analyses comments at the top of each\
    \ script to ensure correct ordering. For example, `lib.js`.\n2. Concatenate all\
    \ script files into a single `main.js` file using `gulpconcat`.\n3. Remove all\
    \ `console` debugging statements with `gulpstrip` and minimize code with `gulpuglify`.\
    \ This step will only occur when running in production mode.\n\nInstall the plugins\
    \ `gulporder`, `gulpconcat`, `gulpstrip`, `gulpuglify`.\n"
