    supporting functional programming. But what is functional programming? And for
    that matter, if you’re going to start comparing programming paradigms in general,
    how is a Highlights


    functional approach different from the JavaScript that you’ve always written?


    Settings


    Well, the good news is that JavaScript isn’t picky when it comes to paradigms.
    You can mix your imperative, objectoriented, prototypal, and functional code as
    you see fit, and Support


    still get the job done. But the bad news is what that means for your code. JavaScript
    can Sig s


