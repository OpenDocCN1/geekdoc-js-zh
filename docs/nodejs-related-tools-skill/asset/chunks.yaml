    ![](img/index-28_179.png)\n![](img/index-28_180.png)\n\n除非在 `npm` 命令前加了 `sudo`，否则会访问全局目录。有许多方法可以修复\
    \ `npm` 权限，像 `nvm` 等工具可以提供帮助，但我经常更改默认目录。例如，在 Ubuntu/Debian 平台平台上：\n\n```bash\n\
    cd ~\nmkdir .node_modules_global\nnpm config set prefix=$HOME/.node_modules_global\n\
    npm install npm -g\n```\n\n然后，将以下行添加到 `~/.bashrc` 的末尾：\n\n```bash\nexport PATH=\"\
    $HOME/.node_modules_global/bin:$PATH\"\n```\n\n最后，使用此命令更新：\n\n```bash\nsource\
    \ ~/.bashrc\n```\n\n## 第 2 ：全局安装 Gulp\n\n全局安装 Gulp 命令行界面，以便可以在任何项目文件夹中运行 `gulp`\
    \ 命令：\n\n```bash\nnpm install gulp-cli -g\n```\n\n使用此命令验证 Gulp 是否已安装：\n\n```bash\n\
    gulp v\n```\n\n## 第 3 ：配置你的项目\n\n### 针对 Node.js 项目\n\n如果你已经有了 `package.json` 配置文件，可以跳过此步骤。\n\
    \nNode.js 项目注意：如果你已经有了 `package.json` 配置文件，可以跳过此步骤。\n\n假设你在 `project1` 文件夹中有一个新项目或现有的项目。进入该文件夹并使用\
    \ `npm` 初始化它：\n\n```bash\ncd project1\nnpm init\n```\n\n你将被问一系列问题。输入值或按回车键接受默认值。完成后，将创建一个\
    \ `package.json` 文件，其中存储了你的 `npm` 配置设置。\n\n### Git 用户\n\nNode.js 将模块安装到 `node_modules`\
    \ 文件夹中。你应该将其添加到 `.gitignore` 文件中，以确保它们不会被提交到存储库。\n\n当将项目部署到另一台电脑时，你可以运行 `npm install`\
    \ 来恢复它们。\n\n在本文的剩余部分，我们假设你的项目文件夹包含以下子文件夹：\n\n- `src` 文件夹：预处理源文件（包含更多子文件夹：）\n \
    \   - `html`:HTML 源文件和模板\n    - `images`:原始未压缩的图像\n    - `js`:多个预处理过的脚本文件\n  \
    \  - `scss`:多个预处理过的 Sass `.scss` 文件\n\n![](img/index-30_1.png)\n![](img/index-30_2.png)\n\
