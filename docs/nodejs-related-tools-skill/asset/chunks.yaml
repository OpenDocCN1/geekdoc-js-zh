    What’s MongoDB?


    Sign Out


    Here’s what the official documentation has to say about MongoDB.


    MongoDB is an opensource database developed by MongoDB Inc. that’s scalable and
    flexible. MongoDB stores data in JSONlike documents that can vary in structure.


    Obviously, MongoDB is a database system. But why do we need another database option
    when the existing solutions are inexpensive and successful? A relational database
    system like MySQL or Oracle has tables, and each table has a number of rows and
    columns. MongoDB, being a documentoriented database system, doesn’t have them.
    Instead, it has a JSONlike document structure that is flexible and easy to work
    with. Here’s an example of what a MongoDB document looks like:


    {


    "_id": ObjectId(3da252d3902a),


    "type": "Article",


    "title": "MongoDB Tutorial Part One",


    "description": "First document",


