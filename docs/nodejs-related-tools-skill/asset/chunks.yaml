    "type": "Article",


    "title": "MongoDB Tutorial Part Two",


    "description": "Second document",


    "author": "Manjunath",


    "content": "In the second..."


    }


    A document in a NoSQL database corresponds to a row in an SQL database. A group
    of documents together is known as a collection, which is roughly synonymous with
    a table in a relational database. For an indepth overview of both NoSQL and SQL


    databases and their differences, we have that covered in the SQL vs NoSQL tutorial.


    Apart from being a NoSQL database, MongoDB has a few qualities of its own. I’ve
    listed some of its key features below:


    it’s easy to install and set up


    it uses a BSON (a JSONlike format) to store data it’s easy to map the document
    objects to your application code it claims to be highly scalable and available,
    and includes support for outofthebox replication


    it supports MapReduce operations for condensing a large volume of data into useful
    aggregated results


    it’s free and open source.


    MongoDB appears to overcome the limitations of the ageold relational databases
    and NoSQL databases. If you aren’t yet convinced about why it’s useful, check
    out our article on Choosing Between NoSQL and SQL.


    Let’s go ahead and install MongoDB.


    Installing MongoDB


    Installing MongoDB is easy and it doesn’t require much configuration or setup.'
