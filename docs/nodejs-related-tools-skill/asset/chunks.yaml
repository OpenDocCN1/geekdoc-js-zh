    \nExpress 的设计目标是一个简单、无偏见的 框架。Express 的哲学是提供小型、健壮的 HTTP 工具，使其成为单页应用程序、网站、混合体或公共\
    \ API 的绝佳解决方案。Express.js 非常开箱没有提供许多功能。它不强制文件结构、ORM 或模板引擎。\n\n### KOA\n\n虽然 Express.js\
