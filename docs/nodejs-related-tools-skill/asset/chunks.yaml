  trans: "\n\n如果你正在为浏览器构建应用，那么你运气不错了。Sails 内置了 Grunt ——这意味着你的整个前端资源工作流都是完全可定制的，并且支持目前现有的所有优秀\
    \ Grunt 模块。这包括对 Less、Sass、Stylus、CoffeeScript、JST、Jade、Handlebars、Dust 等许多模块的支持。当你准备好进入生产环境时，你的资源会自动进行压缩和\
    \ gzip 压缩。你甚至可以编译静态资源并将其推送到像 CloudFront 这样的 CDN，让应用加载得更快。（你可以在 Sails.js 网站上阅读更多关于这些点的信息。）\n\
    \n你也可以通过生成器使用 Gulp 或 Webpack 作为你的构建系统，而不是 Grunt。请查看 GitHub 上的 `sailsgeneratenewgulp`\
    \ 和 `sailswebpack` 项目。\n\n更多社区生成器，请查看 Sails.js 网站上的此文档页面。\n\n## 项目结构\n\n项目包含许多配置文件和文件夹。大多数内容都是一目了然的，但让我们过一下你最经常使用的几个：\n\
    \n- `api/controllers`: 这是存放控制器的文件夹。控制器对应于 `MVC` 中的 `C` 部分。它是你应用程序业务逻辑所在的地方。\n\
    - `api/models`: 存放模型的文件夹。模型对应于 `MVC` 架构中的 `M` 部分。你需要在这里放置映射到 SQL/NoSQL 数据的类或对象。\n\
    - `api/policies`: 这是你存放应用程序策略（policies）的文件夹。\n- `api/responses`: 此文件夹包含服务器响应逻辑，例如处理\
    \ 404 和 500 响应的函数等。\n- `api/services`: 这是你应用级服务所在地。服务是一个全局类，封装了可以在多个控制器中复用的通用逻辑。\n\
    - `./views`: 此文件夹包含用于显示视图的模板。默认情况下，该文件夹包含 `ejs` 引擎模板，但你可以配置任何 Express 支持的引擎，如\
    \ EJS、Jade、Handlebars、Mustache 和 Underscore 等。\n- `./config`: 此文件夹包含许多配置文件，允许你配置应用程序的每一个细节，例如\
    \ CORS、CSRF 保护、i18n、http、模型、视图、日志和策略的设置等。你经常使用的一个重要文件是 `config/routes.js`，你可以在这里创建应用程序路由，并将它们映射到控制器的实际操作或直接映射到视图。\n\
    - `./assets`: 这是你可以在其中应用程序放置任何静态文件（CSS、JavaScript 和图像等）的文件夹。\n\n## 运行你的 SAILS.JS\
    \ 项目\n\n你可以通过在项目根目录下运行以下命令来启动开发服务器：\n\n```\nsails lift\n```\n\n这会提示你选择一种迁移策略，然后启动开发服务器。\n\
    \n![](img/index-56_1.png)\n![](img/index-56_2.png)\n\n然后你可以使用网络浏览器访问 [`localhost:1337/`](http://localhost:1337/)。如果你生成了一个带有前端的\
    \ Sails.js 项目（即没有使用 `nofrontend` 选项），你将看到这个首页：创建 WATERLINE 模型\n\n![](img/index-57_1.png)\n\
