  raw: 'As developers struggled to match the flexibility of JavaScript against the
    intricacy of the browser document object model (DOM), actual JavaScript code often
    looked something like this in the real world:


    var result;


    function getText() {


    var someText = prompt("Give me something to capitalize");


    capWords(someText);


    alert(result.join(" "));


    };


    function capWords(input) {


    var counter;


    var inputArray = input.split(" ");


    var transformed = "";


    result = [];


    for (counter = 0; counter < inputArray.length; counter++) {


    transformed = [


    inputArray[counter].charAt(0).toUpperCase(),


    inputArray[counter].substring(1)


    ].join("");


    result.push(transformed);


    }


    };


    document.getElementById("main_button").onclick = getText;


    So many things are going on in this little snippet of code. Variables are being
    defined on the global scope. Values are being passed around and modified by functions.
    DOM


    methods are being mixed with native JavaScript. The function names are not very
    descriptive, and that’s due in part to the fact that the whole thing relies on
    a context that may or may not exist. But if you happened to run this in a browser
    inside an HTML


    document that defined a <button id="main_button">, you might get prompted for
    some text to work with, and then see the an alert with first letter of each of
    the words in that text capitalized.


    Imperative code like this is written to be read and executed from top to bottom
    (give or take a little variable hoisting). But there are some improvements we
    could make to clean it up and make it more readable by taking advantage of JavaScript’s
    objectoriented nature.


    Object-Oriented JavaScript


    After a few years, developers started to notice the problems with imperative coding
    in a shared environment like the browser. Global variables from one snippet of
    JavaScript clobbered global variables set by another. The order in which the code
    was called affected the results in ways that could be unpredictable, especially
    given the delays introduced by network connections and rendering times.


