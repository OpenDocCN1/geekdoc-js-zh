    ![](index-72_166.png)\n![](index-72_167.png)\n![](index-72_168.png)\nhttp GET\
    \ http://localhost:3000/articles\nhttp GET http://localhost:3000/articles/2\n\
    http PUT http://localhost:3000/articles/2 article:='{\"title\": \"True happiness,\
    \ is an inner quality\"}'\nhttp GET http://localhost:3000/articles/2\nhttp DELETE\
    \ http://localhost:3000/articles/2\nhttp GET http://localhost:3000/articles\n\
    Okay, everything seems to be working. let’s try few more: http GET http://localhost:3000/articles/12345\n\
    http DELETE http://localhost:3000/articles/12345\nYikes! When we try to fetch\
    \ an article that’t exist, we get 200 with an empty body and our handler throws\
    \ in 500. This is happening because `findById` returns null by default. We want\
    \ our API to respond with 404 in both these cases. There’s a few ways we can achieve\
    \ this.\nDEFENSIVELY CHECK FOR NULL VALUES AND RETURN AN ERROR\nThere’s a package\
    \ called `boom` which helps create standard response objects: `npm install boom`\n\
    Import it and modify `/articles/:id` route:\n```javascript\n// routes.js\nconst\
    \ Boom = require('boom')\n{\n  method: 'GET',\n  path: '/articles/{id}',\n  handler:\
    \ async (request) {\n    const article = await Article.findById(request.params.id)\n\
    \    if (article === null) return Boom.notFound()\n    return article\n  }\n}\n\
    ```\nEXTEND SEQUELIZE.MODEL TO THROW AN ERROR\n`Sequelize.Model` is a reference\
    \ to the prototype that all our Models inherit from, so we can easily add a new\
    \ method `find` to `findById` and throw an error if it returns null:\n```javascript\n\
    // models.js\nconst Boom = require('boom')\nSequelize.Model.find = async function\
    \ (...args) {\n  const obj = await this.findById(...args)\n  if (obj === null)\
    \ throw Boom.notFound()\n  return obj\n}\n```\nWe can then revert the handler\
    \ to its former glory and replace occurrences of `findById` with `find`:\n```javascript\n\
    {\n  method: 'GET',\n  path: '/articles/{id}',\n  handler: (request) {\n    return\
    \ Article.find(request.params.id)\n  }\n}\n```\nhttp GET http://localhost:3000/articles/12345\n\
    http DELETE http://localhost:3000/articles/12345\n`Boom`. We now get a 404 Not\
    \ Found error whenever we try to fetch something from the database that doesn’t\
    \ exist. We’ve replaced our custom error checks with an easy understand convention\
    \ that keeps our code clean.\nNote: another popular tool for making requests to\
    \ REST APIs is Postman. If you prefer a UI and ability to save common requests,\
    \ this is a great option.\nPath Parameters\nThe routing in Hapi is a little different\
    \ from other frameworks. The route is selected on the specificity of the path,\
    \ so the order you define them doesn’t matter.\n`/hello/{name}` matches `/hello/bob`\
