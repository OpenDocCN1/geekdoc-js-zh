  trans: "\n# Express.js\n\nExpress.js 是一个 Node.js 框架，因其简单性而赢得了巨大的人气。它提供了路由和对视图引擎的支持，远优于基础\
    \ Node 服务器。\n\n## 亮点\n\n然而，启动一个 Express 应用需要一些模板代码：启动服务器实例、配置视图引擎以及设置错误处理。\n\n\
    ## 支持\n\n虽然有各种启动项目和模板，但 Express 有一个自己的命令行工具用于启动应用，名为 `expressgenerator`。\n\n##\
    \ 什么是 Express?\n\nExpress 内置许多功能，还可以与其他包无缝集成获取更多功能，但它原生提供了三个核心功能：\n\n1. **路由**：这是通过\
    \ `/home`、`/blog` 和 `/about` 提供不同页面的方式。Express 允许将不同的路由放在不同的文件中，实现模块化。\n2. **中间件**：如果你对这个术语陌生，中间件基本上是“软件胶水”。它在路由获取请求之前访问请求，处理\
    \ Cookie 解析、文件上传、错误等问题。\n3. **视图**：这是渲染自定义 HTML 页的方式。传递要渲染的数据，Express 将使用你提供的视图引擎进行渲染。\n\
    \n## 如何开始\n\n使用 Express 生成器启动新项目只需运行几条命令：\n\n```bash\nnpm install expressgenerator\
    \ -g\nexpress myapp\ncd myapp\nnpm install\n```\n\nexpressgenerator 包含了几个 Express\
    \ 服务器常用的依赖项。如果前端和 API 不在同一域名下，你需要开启 CORS：\n\n```javascript\nconst express = require('express')\n\
    const server = express({\n  host: 'localhost',\n  port: 3000,\n  cors: {\n   \
    \ origin: true\n  }\n})\n```\n\n如果前端和 API 在同一域名下，你就不需要考虑 CORS：\n\n```javascript\n\
    const server = express({\n  host: 'localhost',\n  port: 3000\n})\n```\n"
