  trans: "\n当开发者们努力让 JavaScript 的灵活性与浏览器文档对象模型（DOM）的复杂性相匹配时，现实世界中的实际 JavaScript 代码通常看起来像这样：\n\
    \n```javascript\nvar result;\n\nfunction getText() {\n  var someText = prompt(\"\
    Give me something to capitalize\");\n  capWords(someText);\n  alert(result.join(\"\
    \ \"));\n}\n\nfunction capWords(input) {\n  var counter;\n  var inputArray = input.split(\"\
    \ \");\n  var transformed = \"\";\n  result = [];\n  for (counter = 0; counter\
    \ < inputArray.length; counter++) {\n    transformed = [\n      inputArray[counter].charAt(0).toUpperCase(),\n\
    \      inputArray[counter].substring(1)\n    ].join(\"\");\n    result.push(transformed);\n\
    \  }\n}\n\ndocument.getElementById(\"main_button\").onclick = getText\n```\n\n\
    这段短小的代码片段发生了发生了事情。变量在全局作用域被定义。值在函数之间传递并修改。DOM 方法与原生 JavaScript 混合在一起。函数名没有很好的描述性，这部分程度上是因为整个东西依赖于一个可能存在也可能不存在的上下文。但如果你恰好在定义了\
    \ `<button id=\"main_button\">` 的 HTML 文档浏览器中运行这段代码，你可能会被输入某些文本进行处理，然后看到一个弹窗，其中该文本中每个单词的首字母已大写。\n\
    \n这种命令式代码的设计是为了从上到下读取和执行的（忽略少量的变量提升）。但我们可以利用 JavaScript 的面向对象特性进行一些改进，以清理这些代码并使其更具可读性。\n\
    \n# 面对象的 JavaScript\n\n几年后，开发者们开始注意到在浏览器等共享环境中使用命令式编码的问题。来自一个 JavaScript 代码段的全局变量会覆盖另一个代码段设置的全局变量。代码调用的顺序会以不可预测的方式影响结果，特别是考虑到网络连接和渲染时间带来的延迟。\n\
