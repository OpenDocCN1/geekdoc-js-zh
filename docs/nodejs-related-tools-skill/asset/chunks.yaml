  trans: "\n\n注意：在本文演示的场景下，使用 `Article.sync()` 创建表或使用 `Article.sync({ force: true\
    \ })` 丢并创建表都是可以的。如果你想在生产环境中使用它，应该检查 `sequelizecli` 并为任何架构更改编写 `Migrations`（迁移）。\n\
    \n## 我们的 RESTful 动作\n\n让我们构建以下路由：\n\n- `GET /articles` 获取所有文章\n- `GET /articles/:id`\
    \ 根据 ID 获取文章\n- `POST /articles` 使用 `{ title, body }` 参数创建文章\n- `PUT /articles/:id`\
    \ 使用 `{ title, body }` 参数更新文章\n- `DELETE /articles/:id` 根据 ID 删除文章\n\n添加一个新文件\
    \ `routes.js`，将服务器配置与应用逻辑分离：\n\n```javascript\n// routes.js\n\nconst { Article\
    \ } = require('./models')\n\nexports.configureRoutes = (server) => {\n  // server.route\
    \ 接受一个对象或一个数组\n  return server.route([{\n    method: 'GET',\n    path: '/articles',\n\
    \    handler: () => {\n      return Article.findAll()\n    }\n  }, {\n    method:\
    \ 'GET',\n    // 大括号是我们定义参数（URL 中的可变路径段）的方式\n    path: '/articles/{id}',\n   \
    \ handler: (request) => {\n      return Article.findById(request.params.id)\n\
    \    }\n  }, {\n    method: 'POST',\n    path: '/articles',\n    handler: (request)\
    \ => {\n      const article = Article.build(request.payload.article)\n      return\
    \ article.save()\n    }\n  }, {\n    // method 可以是一个数组\n    method: ['PUT', 'PATCH'],\n\
    \    path: '/articles/{id}',\n    handler: async (request) => {\n      const article\
    \ = await Article.findById(request.params.id)\n      article.update(request.payload.article)\n\
    \      return article.save()\n    }\n  }])\n}\n```\n\n![](img/index-71_1.png)\n\
