  trans: "\n\n如果元素的 `className` 属性不包含该类名，则应该将其添加。\n\n如果元素的 `className` 属性已经包含该类名，则不应该将其添加。\n\
    \n让我们这些情况转换为两个测试。在测试目录中，创建一个新文件 `classNameTest.js` 并添加以下内容：\n\n```javascript\n\
    describe('addClass', function() {\n  it('should add class to element');\n  it('should\
    \ not add a class which already exists');\n})\n```\n\n我们对措辞进行了微调，使用了测试中常用的 \"\
    it should do X\"（它应该执行 X）形式。这意味着它读起来更顺畅一些，但本质上与我们上面列出的可读性形式相同。从想法到测试通常并不比这困难得多。\n\
    \n但等一下，测试函数在哪里呢？嗯，当我们省略 `it` 的第二个参数时，Mocha 会在测试结果中将这些测试标记为 `pending`（待定）。这是一种设置多个测试的方便方法——就像是你打算编写内容的待办事项列表一样。\n\
    \n让我们继续实现第一个测试。\n\n```javascript\ndescribe('addClass', function() {\n  it('should\
    \ add class to element', function() {\n    var element = { className: '' };\n\
    \    addClass(element, 'testclass');\n    assert.equal(element.className, 'testclass');\n\
    \  });\n\n  it('should not add a class which already exists');\n})\n```\n\n在这个测试中，我们创建了一个\
    \ `element` 变量并将其作为参数传递给 `addClass` 函数，同时带有字符串 `testclass`（要添加的新类名）。然后，我们使用断言检查该类是否包含在值中。\n\
    \n再次，我们从最初的想法——给定一个元素和一个类名，它应该被添加到类列表中——并以相当直接的方式将其转换为代码。\n\n尽管此函数设计为与 DOM 元素工作，但我们在这里使用了一个普通的\
    \ JS 对象。有时我们可以利用 JavaScript 的这种动态特性来简化测试。如果我们不这样做，就需要创建一个真实的元素，这会增加测试代码的复杂性。作为一个额外的好处，由于我们没有使用\
    \ DOM，如果如果我们愿意，也可以在 Node.js 中运行此测试。\n\n### 在浏览器中运行测试\n\n要在浏览器中运行测试，你需要将 `className.js`\
    \ 和 `classNameTest.js` 添加到运行器中：\n\n```html\n<! 在此处加载你想要测试的代码 >\n<script src=\"\
    js/className.js\"></script>\n<! 在此处加载你的测试文件 >\n<script src=\"test/classNameTest.js\"\
    ></script>\n```\n\n你现在应该看到一个测试通过了，另一个测试显示为待定，如下面的 CodePen 所示。注意，代码与示例略有不同，以便代码在\
    \ CodePen 环境中正常运行。\n\n实时代码！\n查看 Pen Unit Testing with Mocha (1),\n\n接下来，让我们实现第二个测试……\n\
    \n```javascript\nit('should not add a class which already exists', function()\
    \ {\n  var element = { className: 'exists' };\n  addClass(element, 'exists');\n\
    \  var numClasses = element.className.split(' ').length;\n  assert.equal(numClasses,\
    \ 1);\n})\n```\n\n经常运行测试是一个好习惯，所以让我们检查一下现在运行测试会发生什么。正如预期的，它们应该会通过。\n\n这是另一个实现了第二个测试的\
    \ CodePen。\n\n实时代码！\n查看 Pen Unit Testing with Mocha (2),\n\n等一下！我其实稍微耍了一下你们。这个函数还有第三种我们还没有考虑的行为。函数中还有一个\
    \ bug——一个相当严重的 bug。\n\n它只是一个三行的函数，但你注意到了吗？\n\n让我们为第三种行为再写一个测试，顺便暴露这个 bug。\n\n\
    ```javascript\nit('should append new class after existing one', function() {\n\
    \  var element = { className: 'exists' };\n  addClass(element, 'newclass');\n\
    \  var classes = element.className.split(' ');\n  assert.equal(classes[1], 'newclass');\n\
    })\n```\n\n这次测试失败了。你可以在下面的 CodePen 中看到它的运行情况。这里的问题很简单：元素中的 CSS 类名应该用空格隔开。然而，我们目前对\
    \ `addClass` 的实现并没有空格！\n\n实时代码！\n查看 Pen Unit Testing with Mocha (3)。\n\n让我们修复函数并让测试通过。\n\
    \n```javascript\nfunction addClass(el, newClass) {\n  if(el.className.indexOf(newClass)\
    \ !== 1) {\n    return;\n  }\n  if(el.className !== '') {\n    //确保类名用空格隔开\n \
    \   newClass = ' ' + newClass;\n  }\n  el.className += newClass;\n}\n```\n\n这是一个带有修复后的函数和通过测试的最后一个\
    \ CodePen。\n\n实时代码！\n查看 Pen Unit Testing with Mocha (4)。\n\n### 在 Node 上运行测试\n\
    \n在 Node 中，事物只对同一个文件中的其他事物可见。由于 `className.js` 和 `classNameTest.js` 在不同的文件中，我们需要找到一种让它们相互可见的方法。实现此点的标准方法是使用\
    \ `module.exports`。如果你需要复习，可以在这里阅读相关内容：Understanding module.exports and exports\
    \ in Node.js\n\n代码基本上保持不变，但结构略有不同：\n\n```javascript\n// className.js\nmodule.exports\
    \ = {\n  addClass: function(el, newClass) {\n    if(el.className.indexOf(newClass)\
    \ !== 1) {\n      return;\n    }\n    if(el.className !== '') {\n      //确保类名用空格隔开\n\
    \      newClass = ' ' + newClass;\n    }\n    el.className += newClass;\n  }\n\
    };\n```\n\n"
- fmt: "\nAs developers struggled to match the flexibility of JavaScript against the\
    \ intricacy of the browser document object model (DOM), actual JavaScript code\
    \ often looked something like this in the real world:\n\n```javascript\nvar result;\n\
    \nfunction getText() {\n  var someText = prompt(\"Give me something to capitalize\"\
    );\n  capWords(someText);\n  alert(result.join(\" \"));\n}\n\nfunction capWords(input)\
    \ {\n  var counter;\n  var inputArray = input.split(\" \");\n  var transformed\
    \ = \"\";\n  result = [];\n  for (counter = 0; counter < inputArray.length; counter++)\
    \ {\n    transformed = [\n      inputArray[counter].charAt(0).toUpperCase(),\n\
    \      inputArray[counter].substring(1)\n    ].join(\"\");\n    result.push(transformed);\n\
    \  }\n}\n\ndocument.getElementById(\"main_button\").onclick = getText\n```\n\n\
    So many things are going on in this little snippet of code. Variables are being\
    \ defined on the global scope. Values are being passed around and modified by\
    \ functions. DOM methods are being mixed with native JavaScript. The function\
    \ names are not very descriptive, and that’s due in part to the fact that the\
    \ whole thing relies on a context that may or may not exist. But if you happened\
    \ to run this in a browser inside an HTML document that defined a `<button id=\"\
    main_button\">`, you might get prompted for some text to work with, and then see\
    \ the an alert with first letter of each of the words in that text capitalized.\n\
    \nImperative code like this is written to be read and executed from top to bottom\
    \ (give or take a little variable hoisting). But there are some improvements we\
    \ could make to clean it up and make it more readable by taking advantage of JavaScript’s\
    \ oriented nature.\n\n# Object-Oriented JavaScript\n\nAfter a few years, developers\
    \ started to notice the problems with imperative coding in a shared environment\
    \ like the browser. Global variables from one snippet of JavaScript clobbered\
    \ global variables set by another. The order in which the code was called affected\
    \ the results in ways that could be unpredictable, especially given the delays\
    \ introduced by network connections and rendering times.\n\n![](index-22_1.png)\n\
