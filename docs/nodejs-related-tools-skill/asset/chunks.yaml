    Try using the returned token in your requests to the secure routes!


    Validation with joi


    You can validate request params by adding config to the route object. The code
    below ensures that the submitted article has a body and title between three and
    ten characters in length. If a validation fails, Hapi will respond with a 400
    error: const Joi = require(''joi'')


    {


    method: ''POST'',


    path: ''/articles'',


    handler: (request) =&gt; {


    const article = Article.build(request.payload.article) return article.save()


    },


    config: {


    validate: {


    payload: {


    article: {


    title: Joi.string().min(3).max(10),


    body: Joi.string().required()


    }


    }


    }


    }


    }


    }


    In addition to payload, you can also add validations to path, query and headers.


    Learn more about validation in the docs.


    Who Is Consuming this API?


    We could serve a singlepage app from /. We’ve already seen — at the start of the
    tutorial — one example of how to serve an HTML file with streams. There are much


    better ways of working with Views and Layouts in Hapi, though. See Serving Static
    Content and Views and Layouts for more on how to render dynamic views:


    {


    method: ''GET'',


    path: ''/'',


    handler: () =&gt; {


    return require(''fs'').createReadStream(''index.html'')


    },


    config: { auth: false }


    }


    If the front end and API are on the same domain, you’ll have no problems making
    requests: client > hapiapi.


    If you’re serving the front end from a *different* domain and want to make requests
    to the API directly from the client, you’ll need to enable CORS. This is super
    easy in Hapi: const server = Hapi.server({


    host: ''localhost'',


    port: 3000,


    routes: {


    cors: {


    credentials: true


    // See options at https://hapijs.com/api/17.0.0#routeoptionscors


    }


    }


    })


    You could also create a *new* application in between the two. If you go down this
    route, you won’t need to bother with CORS, as the client will only be making requests
    to the frontend app, and it can then make requests to the API on the server without
    any crossdomain restrictions: client > hapifrontend > hapiapi.


    Whether that front end is another Hapi application, or Next, or Nuxt … I’ll leave
    that for you to decide!


