    — and verify it behaves correctly in a specific situation. Unit testing is a structured
    and automated way of doing this. As a result, the more tests you write, the bigger
    the benefit


    you receive. You will also have a greater level of confidence in your codebase
    as you continue to develop it.


    The core idea with unit testing is to test a function''s behavior when giving
    it a certain set of inputs. You call a function with certain parameters, and check
