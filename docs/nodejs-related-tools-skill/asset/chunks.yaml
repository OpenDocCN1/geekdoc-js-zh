    // Here we define our Article model with a title attribute of type string, and
    a body attribute of type text. By default, all tables get columns for id, createdAt,
    updatedAt as well.


    const Article = sequelize.define(''article'', {


    title: Sequelize.STRING,


    body: Sequelize.TEXT


    })


    // Create table


    Article.sync()


    module.exports = {


    Article


    }


    Let’s test out our new model by importing it and replacing our route handler with
    the following:


    // server.js


    const { Article } = require(''./models'')


    server.route({


    method: ''GET'',


    path: ''/'',


    handler: () =&gt; {


    // try commenting these lines out one at a time


    return Article.findAll()


    return Article.create({ title: ''Welcome to my blog'', body: ''The happiest place
    on earth'' }) return Article.findById(1)


    return Article.update({ title: ''Learning Hapi'', body: `JSON API''s a breeze.`
    }, { where: { id: 1 } }) return Article.findAll()


    return Article.destroy({ where: { id: 1 } })


    return Article.findAll()


    }


    })


    If you’re familiar with SQL or other ORM’s, the Sequelize API should be self explanatory,
    It’s built with Promises so it works great with Hapi’s async handlers too.'
