    \ 3000!'))\n```\n\nThe `app.listen()` method in Koa is also a wrapper around the\
    \ `http.createServer()` method.\n\n# HAPI.JS\n\nStarting a server in hapi.js is\
    \ quite a departure from what many of us may be used to from Express:\n\n```javascript\n\
    const Hapi = require('hapi')\n\nconst server = Hapi.server({\n  host: 'localhost',\n\
    \  port: 3000\n})\n\nasync function start() {\n  try {\n    await server.start()\n\
    \  }\n  catch (err) {\n    console.log(err)\n    process.exit(1)\n  }\n  console.log('Server\
    \ running at:', server.info.uri)\n}\n\nstart()\n```\n\nIn the code block above,\
    \ first we require the `hapi` package, then instantiate a server with `Hapi.server()`,\
    \ which has a single config object argument containing the `host` and `port` parameters.\
    \ Then we start the server with the asynchronous `server.start()` function.\n\n\
    Unlike in Express.js and Koa, the `server.start()` function in hapi is not a wrapper\
    \ around the native `http.createServer()` method. It instead implements its own\
    \ custom logic.\n\nThe above code example is from the hapi.js website, and shows\
    \ the importance the creators of hapi.js place on configuration and error handling.\n\
    \n# Routing\n\nRouting is another key aspect of modern web applications. Let’s\
    \ define a `/hello` route for a simple Hello World app in each framework to have\
    \ a feel of how routing works for them.\n\n## EXPRESS.JS\n\n```javascript\napp.get('/hello',\
    \ (req, res) => res.send('Hello World!'))\n```\n\nCreating routes in Express is\
    \ as simple as calling the `app` object with the required HTTP method. The syntax\
    \ is `app.METHOD(PATH, HANDLER)`, where `PATH` is the path on the server and `HANDLER`\
    \ is function which is called when the path is matched.\n\n## KOA\n\nKoa doesn’t\
    \ have its own router bundled with it, so we’ll have to use a router middleware\
    \ to handle routing on Koa apps. Two common routing options are `koaroute` and\
    \ `koarouter`. Here’s an example using `koaroute`:\n\n```javascript\nconst route\
    \ = require('koaroute')\n\napp.use(route.get('/hello', ctx => {\n  ctx.body =\
    \ 'Hello World!'\n}))\n```\n\nWe can see immediately that Koa needs each route\
    \ to be defined as a middleware on the `app`. The `ctx` is a context object that\
    \ contains Node’s request and response objects. `ctx.body` is a method in the\
    \ response object and can be used to set the response body to either a string,\
    \ Buffer, Stream, Object or `null`. The second parameter for the `route` method\
    \ can be an async or generator function, so the use of callbacks in reduced.\n\
    \n## HAPI.JS\n\n```javascript\nserver.route({\n  method: 'GET',\n  path:'/hello',\n\
    \  handler: function (request, h) {\n    return 'Hello world!'\n  }\n})\n```\n\
    \nThe `server.route()` method in hapi takes a single config object with the following\
    \ parameters: `method`, `path` and `handler`. You can see the documentation on\
    \ routing in hapi here.\n\nThe `request` parameter in the handler function is\
    \ an object which contains the user’s request details, while the `h` parameter\
    \ is described as a response toolkit.\n\n# Middleware\n\nOne of the major concepts\
    \ Node developers are used to is working with middleware.\n\nMiddleware functions\
    \ are functions that sit in between requests and responses.\n\nThey have access\
    \ to the request and response objects and can run the next middleware after they’re\
    \ processed. Let’s take a look at how they’re defined in the different frameworks\
    \ by implementing a simple function that logs the time a request is made to the\
    \ server.\n\n## EXPRESS.JS\n\n```javascript\napp.use((req, res, next) => {\n \
    \ console.log(`Time: ${Date.now()}`)\n  next()\n})\n```\n\nRegistering middleware\
    \ in Express.js is as simple as binding the middleware to the `app` object by\
    \ using the `app.use()` function. You can read more on middleware in Express.js\
    \ here.\n\n## Koa\n\n```javascript\napp.use(async (ctx, next) => {\n  console.log(`Time:\
    \ ${Date.now()}`)\n  await next()\n})\n```\n\nMiddleware registration in Koa is\
    \ similar to Express.js. The major differences are that the context object (`ctx`)\
    \ is used in place of the request and response objects in Express.js and Koa embraces\
    \ the modern async/await paradigm for defining the middleware function.\n\n##\
    \ HAPI.JS\n\n```javascript\nserver.ext('onRequest', (request, h) => {\n  console.log(`Time:\
    \ ${Date.now()}`)\n  return h.continue\n})\n```\n\nIn hapi.js there are certain\
    \ extension points in the request lifecyle. The `server.ext()` method registers\
    \ an extension function to be called at a certain point in the request life cycle.\
    \ You can read more about it here. We make use of the `onRequest` extension point\
    \ in the example above to register a middleware (or extension) function.\n\n#\
    \ Usage\n\nFrom the comparisons and code examples we’ve seen above, it’s clear\
    \ that Express and Koa are the most similar, with hapi.js being the framework\
    \ to deviate from the norm that Node.js devs are used to. Hence hapi.js may not\
    \ be the best choice when trying to build a quick and easy app, as it will take\
    \ a bit of time to get used to.\n\nIn my opinion, Express is still a great choice\
    \ when building small to mediumsized applications. It can become a bit complicated\
    \ to manage for very large applications, as it doesn’t possess the modularity\
    \ hapi.js has built into it, with support for custom plugins and its unique routing\
    \ method. However, there’s been some speculation in recent times regarding the\
    \ future of Express.js as TJ announced he’s no longer working on it and the reduced\
    \ rate at which updates are shipped. Bit it’s pretty stable and won’t be going\
    \ away soon. It also has a large community of developers various extensions for\
    \ it.\n\nLike Express.js, Koa is well suited for many simple Node.js projects.\
    \ It only consists of the bare minimum (it has zero inbuilt middleware) and encourages\
    \ developers to add what they need by building or making use of external middleware.\
    \ It makes use of modern JavaScript generator functions and async/await heavily,\
    \ which makes it sort of futuristic in its approach. Its middleware cascading\
    \ pattern is also great, as it makes implementing and understanding the flow of\
    \ middleware in your applications very easy. Koa probably won’t be a great choice\
    \ for you if you aren’t ready to embrace new shiny things like generator functions,\
    \ or if you’re not willing to spend some time building out all the middleware\
    \ you need. The community support for Koa is rapidly growing, as it has a good\
    \ amount of external middleware already built for it (some by the core Koa team)\
    \ for common tasks such as routing, logging and so on.\n\nHapi.js is the definite\
    \ choice if you and your team prefer to spend more time configuring than actually\
    \ coding out features. It was built to be modular and for large applications with\
    \ large teams. It encourages the microservice architecture, as various parts of\
    \ your app can be built as plugins and registered in your server before starting\
    \ it up. Hapi.js is backed by large companies such as Auth0 and Lob, so it has\
    \ a pretty good future ahead of it and won’t be going away anytime soon. It’s\
    \ also trusted by some big names, as seen on their community page.\n\nHapi.js\
    \ has a whole lot more features out of the box than Koa and Express.js, such as\
    \ support for authentication, caching, logging, validation and so on, which makes\
    \ it feel more like a fullframework. You can check out their tutorials page to\
    \ get a good feel of the features they provide. There aren’t yet very many opensource\
    \ projects and plugins built on and for hapi.js, so a lot of work might need to\
    \ be done by developers using it if they plan to extend its core functionality.\n\
    \n# Conclusion\n\nAll three frameworks are great choices when starting up new\
    \ projects, but ultimately your choice will be based on the project requirements,\
    \ your team members and the level of flexibility you’re looking for.\n\n**https://avxhm.se/blogs/hill0**\n\
