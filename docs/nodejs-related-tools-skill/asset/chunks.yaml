    Sails.js 是一个 Rails Web 框架，允许你快速构建 REST API、单页应用以及实时（基于 WebSockets）应用。它高层地使用了代码生成器，使你能够编写更少代码来构建应用程序——特别是那些可以通过脚架生成（scaffold）的常见代码。


    Support 框架构建在 `Express.js`（最流行的 Node.js 库之一）和 `Socket.io` 之上（一个为应用程序添加实时、双向、基于事件通信的
    JavaScript 库/引擎）。在写作期间，Sails.js 的官方稳定版本为 `0.12.14`，可以通过 `npm` 获取。Sails.js `1.0`
    版本尚未正式发布，但根据 Sails.js 创造者的说法，1.0 版本已用于某些生产应用中，他们甚至建议在启动新项目时使用它。


    # 核心特性


    Sails.js 拥有许多出色的特性：


    - 它基于 `Express.js` 构建

    - 它支持通过 `WebSockets` 进行实时通信

    - 它采取了“约定优于配置”的方法

    - 得益于 `Blueprints`，它拥有强大的代码生成能力

    - 得益于其强大的 `Waterline` ORM/ODM，它是数据库无关的

    - 它在同一个项目中支持多个数据存储器

    - 它拥有良好的文档。


    目前存在一些重要的缺点，例如：


    - `Waterline` 不支持 `JOIN` 查询

    - 直到 Sails `v1.0`（写作期间处于测试阶段）之前，尚不支持 `SQL` 事务

    - 在版本 1.0 之前，它仍然使用 `Express.js v3`，该版本已停止维护（EOL）——开发速度非常缓慢。


    # Sails.js 对比 Express.js


    软件开发的核心在于构建抽象。Sails.js 是 `Express.js` 之上的一个高层抽象层（`Express.js` 本身是对 Node `HTTP`
    模块的抽象），它提供了路由、中间件、文件服务等功能。它还添加了强大的 ORM/ODM、MVC 架构模式以及强大的生成器 CLI（以及其他特性）。


    你可以使用 Node 的低级 `HTTP` 服务和其他实用程序模块（如 `filesystem` 模块）构建 Web 应用程序，但除非是为了学习 Node.js
    平台，否则不建议这样做。你也可以更进一步使用 `Express.js`，这是一个用于构建 Web 应用的流行且轻量级的框架。


    你将拥有 Web 应用所需的路由和其他有用构建结构，但你需要处理从配置、文件结构、代码组织到数据库操作的几乎所有事务。


    `Express` 没有提供任何帮助你访问数据库的内置工具，因此你将整合所需的技术来构建一个完整的 Web 应用程序。这就是所谓的栈（stack）。使用 JavaScript
    的 Web 开发者大多使用流行的 `MEAN` 栈，代表 `MongoDB`、`ExpressJS`、`AngularJS` 和 `Node.js`。


    `MongoDB` 是 Node/Express 开发者首选的数据库系统，但你可以使用任何需要的数据库。这里最重要的一点是，在数据库方面，`Express`
    不提供任何内置 API。


    # Waterline ORM/ODM


    Sails.js 的一个关键特性是 `Waterline`，这是一个针对基于 `SQL` 的数据库的强大 ORM（对象关系映射）以及针对 `NoSQL` 文档数据库的
    ODM（对象文档映射）。`Waterline` 抽象了处理数据库时所有的复杂性，最重要的是，通过 `Waterline`，你不需要在开始开发时就做出选择数据库系统的决策。当你的客户尚未决定使用的数据库技术时，它也不会让你感到无所措。


    你可以无需编写单行配置即可构建你的应用程序。事实上，最初完全不需要安装数据库系统。得益于内置的基于 `NeDB` 的 `sailsdisk` 文件数据库，你可以透明地使用文件系统存储和检索数据，以测试你的应用程序功能。


    一旦你准备就绪并决定了项目使用的便捷数据库系统，你只需通过安装对应数据库系统的相关适配器（adapter）即可切换数据库。`Waterline` 为流行的关系型数据库系统（如
    `MySQL` 和 `PostgreSQL`）以及 `NoSQL` 数据库（如 `MongoDB` 和 `Redis`）提供了官方适配器，社区还为其他流行的数据库系统（如
    `Oracle`、`MSSQL`、`DB2`、`SQLite`、`CouchDB` 和 `neo4j`）构建了大量适配器。如果找不到所需的适配器，你可以开发自定义的适配器。


    `Waterline` 抽象了不同数据库系统之间的差异，允许应用程序通过标准化的接口与任何支持的数据库系统进行通信。你不需要处理 `SQL` 或任何低级 API（针对
    `NoSQL` 数据库），但这并不意味着你不能这样做（至少对于基于 `SQL` 的数据库和 `MongoDB`）。


    在某些情况下你需要编写自定义 `SQL`，例如出于性能考虑、处理复杂的数据库需求或访问特定的数据库功能。在这种情况下，可以使用仅适用于配置为使用 `SQL`
    系统的 Waterline 模型的 `.query()` 方法（你可以在文档中找到更多关于 `query()` 的信息）。


    由于不同的数据库系统具有通用特性和特定特性，`Waterline` ORM/ODM 只有在你仅限制于使用通用特性时才对你有益处。此外，如果你使用原始 `SQL`
    或原生 `MongoDB` API，你将失去许多 `Waterline` 的特性。


    # 开始使用 Sails.js


    现在我们已经涵盖了 Sails.js 的基本概念和特性，让我们如何使用 Sails.js 快速上手。


    ## 先决条件


    ![](img/index-52.jpg)## 先决条件


    在使用 Sails.js 之前，你需要一个安装了 `Node.js`（以及 `npm`）的开发环境。你可以访问 Node.js 网站并下载安装程序来安装它们。


    同时，确保安装了你想配合 Sails.js 使用的数据库管理系统（无论是关系型还是 `NoSQL` 数据库）。如果你现在不想使用完整的数据库系统，由于 `sailsdisk`
    的存在，你仍然可以工作。


    ## 安装 Sails.js CLI


    满足开发要求后，进入终端（Linux 和 macOS）或命令提示符（Windows），通过 `npm` 全局安装 Sails.js 命令行工具：


    ```

    sudo npm install sails g

    ```


    如果你想安装最新的 *1.0* 版本来尝试新功能，需要使用 beta 版本：


    ```bash

    npm install sails@beta g

    ```


    根据你的 npm 配置，全局安装包可能需要 `sudo`。


    ## 脚生成 Sails.js 项目


    完成后，你可以通过一个命令脚生成新项目：


    ```bash

    sails new sailsdemo

    ```


    这将在当前目录下创建一个名为 `sailsdemo` 的项目文件夹。你也可以在现有文件夹内脚生成项目文件：


    ```bash

    sails new .

    ```


    你可以通过以下命令生成一个没有前端的 Sails.js 项目：


    ```bash

    sails new sailsdemo nofrontend

    ```


    从文档中可以更多关于 CLI 特性的信息。


    # Sails.js 项目结构


    这是使用 Sails.js CLI 生成的项目截图：


    ![](img/index-54.png)


    一个 Sails.js 项目是一个 Node.js 模块，包含 `package.json` 和 `node_modules` 文件夹。你可能还会注意到 `Gruntfile.js`
    的存在。Sails.js 使用 Grunt 作为构建前端资源的工具。

