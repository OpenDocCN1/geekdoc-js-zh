    我们的博客 API 几乎准备好上线生产了，只需要进行最后的完善。


    ## 使用 JWT 进行身份验证


    JSON Web Tokens 是 API 一种常见的身份验证机制。有一个名为 `hapiauthjwt2` 的插件可以设置它，但它还没有针对 Hapi 17.0
    更新，因此我们目前需要安装一个分支：


    ```bash

    npm install save salzhrani/hapiauthjwt2#v17

    ```


    下面的代码注册了 `hapiauthjwt2` 插件，并使用 `jwt` `scheme` 设置了一个名为 `admin` 的 `strategy`。如果在头部、查询字符串或
    Cookie 中发送了有效的 JWT 令牌，它将调用我们的 `validate` 函数来验证我们是否允许这些凭据的访问：


    ```javascript

    // auth.js


    const jwtPlugin = require(''hapiauthjwt2'').plugin


    // 这在生产环境中应该是一个环境变量 const JWT_KEY = ''NeverShareYourSecret''


    var validate = function (credentials) {


    // 在此处运行任何检查以确认我们是否想要授予这些凭据访问

    ```


