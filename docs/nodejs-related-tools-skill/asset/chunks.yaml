    \ the task from the command line: `gulp css`\n\n## Step 6: Automate Tasks\n\n\
    We've been running one task at a time. We can run them all in one command by adding\
    \ a new run task to `gulpfile.js`:\n\n```javascript\n// run all tasks\ngulp.task('run',\
    \ ['html', 'css', 'js'])\n```\n\nSave and enter `gulp run` at the command line\
    \ to execute all tasks. Note that I omitted the `images` task because it's already\
    \ set as a dependency for the `html` and `css` tasks.\n\nIs this still too much\
    \ hard work? Gulp offers another method — `gulp.watch` — which can monitor your\
    \ source files and run an appropriate task whenever a file is changed.\n\nThe\
    \ method is passed a folder and a list of tasks to execute when a change occurs.\
    \ Let's create a new watch task at the end of `gulpfile.js`:\n\n```javascript\n\
    // watch for changes\ngulp.task('watch', function() {\n  // image changes\n  gulp.watch(folder.src\
    \ + 'images/**/*', ['images'])\n  // html changes\n  gulp.watch(folder.src + 'html/**/*',\
    \ ['html'])\n  // javascript changes\n  gulp.watch(folder.src + 'js/**/*', ['js'])\n\
    \  // css changes\n  gulp.watch(folder.src + 'scss/**/*', ['css'])\n})\n```\n\n\
    Rather than running `gulp watch` immediately, let's add a default task:\n\n```javascript\n\
    // default task\ngulp.task('default', ['run', 'watch'])\n```\n\nSave `gulpfile.js`\
    \ and enter `gulp` at the command line. Your images, HTML, CSS and JavaScript\
    \ will all be processed, then Gulp will remain active watching for updates and\
    \ rerunning tasks as necessary. Hit `Ctrl/Cmd + C` to abort monitoring and return\
    \ to the command line.\n\n## Step 7: Profit!\n\nOther plugins you may find useful:\n\
    \n- `gulploadplugins` ± load all Gulp plugin modules without require declarations\n\
    - `gulppreprocess` — a simple HTML and JavaScript preprocessor\n- `gulpless` —\
    \ the Less CSS preprocessor plugin\n- `gulpstylus` — the Stylus CSS preprocessor\
    \ plugin\n- `gulpsequence` — run a series of gulp tasks in a specific order\n\
    - `gulpplumber` — error handling which prevents Gulp stopping on failures\n- `gulpsize`\
    \ — displays file sizes and savings\n\n`gulpnodemon` — uses nodemon to automatically\
    \ restart Node.js applications when changes occur.\n\n`gulputil` — utility functions\
    \ including logging and color coding.\n\nOne useful method in `gulputil` is `.noop()`\
    \ which passes data straight through without performing any action. This could\
    \ be used for cleaner development/production processing code. For example:\n\n\
    ```javascript\nvar gutil = require('gulputil')\n\n// HTML processing\ngulp.task('html',\
    \ ['images'], function() {\n  var out = folder.src + 'html/**/*'\n  return gulp.src(folder.src\
    \ + 'html/**/*')\n    .pipe(newer(out))\n    .pipe(devBuild ? gutil.noop() : htmlclean())\n\
    \    .pipe(gulp.dest(out))\n})\n```\n\nGulp can also call other Node.js modules,\
    \ and they don't necessarily need to be plugins.\n\nFor example:\n\n- `browsersync`\
    \ — automatically reload assets or refresh your browser when changes occur\n-\
    \ `del` — delete files and folders (perhaps clean your build folder at the start\
    \ of every run).\n\nInvest a little time and Gulp could save many hours of development\
    \ frustration. The advantages:\n\n- plugins are plentiful\n- configuration using\
    \ pipes is readable and easy to follow\n- `gulpfile.js` can be adapted and reused\
    \ in other projects\n- your total page weight can be reduced to improve performance\n\
    - you can simplify your deployment.\n\nUseful links:\n\n- Gulp home page\n- Gulp\
    \ plugins\n- npm home page\n\nApplying the processes above to a simple website\
    \ reduced the total weight by more than 50%. You can test your own results using\
    \ page weight analysis tools or a service such as New Relic, which provides a\
    \ range of sophisticated application performance monitoring tools.\n\nGulp can\
    \ revolutionize your workflow. I hope you found this tutorial useful and consider\
    \ Gulp for your production process.\n\n***\n\n# A Side-by-side Comparison of Express,\
    \ Koa and Hapi.js\n\nIf you’re a Node.js developer, chances are you you have,\
    \ at some point, used Express.js to create your applications or APIs. Express.js\
    \ is a very popular Node.js framework, and even has some other frameworks built\
    \ on top of it such as Sails.js, kraken.js, KeystoneJS and many others. However,\
    \ amidst this popularity, a bunch of other frameworks have been gaining attention\
    \ in the JavaScript world, such as Koa and hapi.\n\nIn this article, we’ll examine\
    \ Express.js, Koa and hapi.js — their similarities, differences and use cases.\n\
    \n## Background\n\nLet’s firstly introduce each of these frameworks separately.\n\
    \n### EXPRESS.JS\n\nExpress.js is described as the standard server framework for\
    \ Node.js. It was created by TJ Holowaychuk, acquired by StrongLoop in 2014, and\
    \ is currently maintained by the Node.js Foundation incubator. With about 170\
    \ million downloads in the last year, it’s currently beyond doubt that it’s the\
    \ most popular Node.js framework.\n\n### KOA\n\nDevelopment began on Koa in 2013\
    \ by the same guys at Express. It’s also referred to as a more modern.\n\n###\
    \ HAPI.JS\n\nHapi.js was developed by the team at Walmart (led by Eran Hammer)\
    \ after they tried Express and discovered it didn’t work. It was originally developed\
    \ on top of Express, but as time went by, it grew into a full framework. *Fun\
    \ Fact: hapi is short for Http API server.*\n\n## Philosophy\n\nNow that we have\
    \ some background on the frameworks and how they were created, let’s compare each\
    \ of them based on important concepts, such as their philosophy, routing, and\
    \ so on.\n\n### EXPRESS.JS\n\nExpress was built to be a simple, unopinionated\
    \ web framework. The Express philosophy is to provide small, robust tooling for\
    \ HTTP servers, making it a great solution for single page applications, web sites,\
    \ hybrids, or public APIs. Express.js is minimal and doesn’t possess many features\
    \ out of the box. It doesn’t force things like file structure, ORM or templating\
    \ engine.\n\n### KOA\n\nWhile Express.js is minimal, Koa can boast a much more\
    \ minimalistic code footprint. Its aim is to allow developers be even more expressive.\
    \ Like Express.js, it can be easily extended by using existing or custom plugins\
    \ and middleware. It’s more futuristic in its approach, in that it relies heavily\
    \ on the relatively new JavaScript features like generators and async/await.\n\
    \n### HAPI.JS\n\nHapi.js focuses more on configuration and provides a lot more\
    \ features out of the box than Koa and Express.js.\n\n## Starting a Server\n\n\
    Starting a server is one of the basic things we’d need to do in our projects.\
    \ Let’s examine how it can be done in the different frameworks. We’ll start a\
    \ server and listen on port 3000 in each example.\n\n### EXPRESS.JS\n\n```javascript\n\
    const express = require('express')\nconst app = express()\n\napp.listen(3000,\
    \ () => console.log('App is listening on port 3000!'))\n```\n\nStarting a server\
    \ in Express.js is as simple as requiring the express package, initializing the\
    \ express app to the app variable and calling the `app.listen()` method, which\
    \ is just a wrapper around the native Node.js `http.createServer()` method.\n\n\
    ### KOA\n\n```javascript\nconst Koa = require('koa')\nconst app = new Koa()\n\
    ```\n\nStarting a server in Koa is quite similar to Express.js.\n"
