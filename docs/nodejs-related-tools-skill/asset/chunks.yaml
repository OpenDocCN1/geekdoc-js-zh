    \ ![](index-59_167.png) ![](index-59_168.png)\nsettings page.\n\n# SAILS.JS CONTROLLERS\n\
    \nControllers hold your app’s business logic. They live in `api/controllers` and\
    \ provide a layer which glues your app’s models and views. Controllers contain\
    \ actions that are bound to routes and respond to HTTP requests from web/mobile\
    \ clients.\n\nA controller is a JavaScript object that contains methods called\
    \ the `controller actions`, which take two parameters: a `request` and a `response`.\n\
    \nYou can find more information about controllers on the Sails.js controllers\
    \ page.\n\nYou can generate a controller using the Sails.js CLI: `sails generate\
    \ controller product`\n\nThis command will generate a controller named `api/controllers/ProductController.js`,\
    \ with the following content:\n\n```javascript\n/**\n* ProductController\n*\n\
    * @description :: Serverside logic for managing products\n* @help :: http://sailsjs.org/#!/documentation/concepts/Controllers\n\
    */\nmodule.exports = {\n\n}\n```\n\nThe code exports an empty JavaScript object\
    \ where you can add new actions or override the default (automatically added)\
    \ controller actions.\n\nAt this point, you can actually execute CRUD operations\
    \ against your server without adding any code. Since Sails.js follows convention\
    \ over configuration, it wires your controllers to their corresponding routes\
    \ and provides default actions for handling the common POST, GET, PUT and DELETE\
    \ requests.\n\n# TESTING WITH POSTMAN\n\nUsing Postman, you can send POST, GET\
    \ and other requests to test your API, so go\n\n![](index-60_1.png) ![](index-60_2.png)\n\
    \nahead and grab the Postman version for your operating system. Next, enter the\
    \ product endpoint URL `http://localhost:1337/product`. Then choose the HTTP method\
    \ to send — POST in this case, because we want to create a Product. Next, you\
    \ need to provide data, so click on the *Body tab*, select the *Raw* option, then\
    \ enter the following:\n\n```json\n{\n  \"name\": \"Product 1\",\n  \"description\"\
    : \"This is product 1\",\n  \"quantity\": 100\n}\n```\n\nThen hit the Send button.\
    \ You should pay attention to the returned status code: 200 OK means the product\
    \ was successfully created.\n\nYou can then verify if products are created by\
    \ sending a GET request:\n\n![](index-61_1.png)\n\nYou can also update a product\
    \ by its id by sending a PUT request: Finally, you can delete a product by its\
    \ id by sending a DELETE request:\n\n![](index-62_1.png)\n\nFor custom logic,\
    \ you can also override these actions and implement your own.\n\nWhen you create\
    \ an API (i.e. a controller and a model) Sails.js automatically adds eight default\
    \ actions, which are:\n\n- add to\n- create\n- destroy\n- find one\n- find where\n\
    - populate where\n- remove from\n- update\n\nFind where and find one, create,\
    \ update and destroy are normal CRUD\n"
