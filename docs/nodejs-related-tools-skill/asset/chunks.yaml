    .index-79_370.png)\n. (Wait, the text provided is mostly images. I will format\
    \ the text content provided.)\n\n# Express.js\n\nExpress.js is a Node.js web framework\
    \ that has gained immense popularity due to its simplicity. It has routing and\
    \ simple support for view engines, putting it far ahead of the basic Node server.\n\
    \n## Highlights\n\nHowever, starting a new Express application requires a certain\
    \ amount of boilerplate: starting a server instance, configuring a view engine,\
    \ setting up error handling.\n\n## Support\n\nAlthough there are various starter\
    \ projects and boilerplates available, Express has its own command line tool that\
    \ makes it easy to start apps, called `expressgenerator`.\n\n## What is Express?\n\
    \nExpress has a lot of features built in, and a lot more features you can get\
    \ from other packages that integrate seamlessly, but there are three main things\
    \ it does out of the box:\n\n1. **Routing**: This is how `/home`, `/blog` and\
    \ `/about` give you different pages. Express makes it easy for you to modularize\
    \ this code by allowing you to put different routes in different files.\n2. **Middleware**:\
    \ If you’re new to the term, basically middleware is “software glue”. It accesses\
    \ requests before your routes get them, allowing them to handle hard stuff like\
    \ cookie parsing, file uploads, errors, and more.\n3. **Views**: Views are how\
    \ HTML pages are rendered with custom content. You pass in the data you want to\
    \ be rendered and Express will render it with your given view engine.\n\n## Getting\
    \ Started\n\nStarting a new project with the Express generator is as simple as\
    \ running a few commands:\n\n```bash\nnpm install expressgenerator -g\nexpress\
    \ myapp\ncd myapp\nnpm install\n```\n\nThe expressgenerator includes several dependencies\
    \ that are commonly used with an Express server. If the front end and API are\
    \ on the same domain, you’ll need to enable CORS:\n\n```javascript\nconst express\
    \ = require('express')\nconst server = express({\n  host: 'localhost',\n  port:\
    \ 3000,\n  cors: {\n    origin: true\n  }\n})\n```\n\nIf the front end and API\
    \ are on the same domain, you won’t need to bother with CORS:\n\n```javascript\n\
    const server = express({\n  host: 'localhost',\n  port: 3000\n})\n```\n"
