    Middleware registration in Koa is similar to Express.js. The major differences
    are that the context object (ctx) is used in place of the request and response
    objects in Express.js and Koa embraces the modern async/await paradigm for defining
    the middleware function.


    HAPI.JS


    server.ext(''onRequest'', (request, h) => {


    console.log(`Time: ${Date.now()}`);


    return h.continue;


    });


    In hapi.js there are certain extension points in the request lifecyle. The server.ext()
    method registers an extension function to be called at a certain point in the
    request life cycle. You can read more about it here. We make use of the onRequest
    extension point in the example above to register a middleware (or extension) function.


    Usage


    From the comparisons and code examples we’ve seen above, it’s clear that Express
    and Koa are the most similar, with hapi.js being the framework to deviate from
    the norm


    that Node.js devs are used to. Hence hapi.js may not be the best choice when trying
    to build a quick and easy app, as it will take a bit of time to get used to.


    In my opinion, Express is still a great choice when building small to mediumsized
    applications. It can become a bit complicated to manage for very large applications,
    as it doesn’t possess the modularity hapi.js has built into it, with support for
    custom plugins and its unique routing method. However, there’s been some speculation
    in recent times regarding the future of Express.js as TJ announced he’s no longer
    working on it and the reduced rate at which updates are shipped. Bit it’s pretty
    stable and willn’t be going away any time soon. It also has a large community
    of developers building various extensions and plugins for it.


    Like Express.js, Koa is well suited for many simple Node.js projects. It only
    consists of the bare minimum (it has zero inbuilt middleware) and encourages developers
    to add what they need to it by building or making use of available external middleware.
    It makes use of modern JavaScript generator functions and async/await heavily,
    which makes it sort of futuristic in its approach. Its middleware cascading pattern
    is also great, as it makes implementing and understanding the flow of middleware
    in your applications very easy. Koa probably won’t be a great choice for you if
    you aren’t yet ready to embrace new shiny things like generator functions, or
    if you’re not willing to spend some time building out all the middleware you need.
    The community support for Koa is rapidly growing, as it has a good amount of external
    middleware already built for it (some by the core Koa team) for common tasks such
    as routing, logging and so on.


    Hapi.js is the definite choice if you and your team prefer to spend more time
    configuring than actually coding out features. It was built to be modular and
    for large applications with large teams. It encourgages the microservice architecture,
    as various parts of your app can be built as plugins and registered in your server
    before starting it up. Hapi.js is backed by large companies such as Auth0 and
    Lob, so it has a pretty good future ahead of it and won’t be going away anytime
    soon. It’s also trusted by some big names, as seen on their community page.


    Hapi.js has a whole lot more features out of the box than Koa and Express.js,
    such as support for authentication, caching, logging, validation and so on, which
    makes it feel more like a fullfledged framework. You can check out their tutorials
    page to get a good feel of the features they provide. There aren’t yet very many
    opensource projects and plugins built on and for hapi.js, so a lot of work might
    need to be done by developers using it if they plan to extend its core functionality.


    Conclusion


    Conclusion


    All three frameworks are great choices when starting up new projects, but ultimately
    your choice will be based on the project requirements, your team members and the
    level of flexibility you’re looking for.


