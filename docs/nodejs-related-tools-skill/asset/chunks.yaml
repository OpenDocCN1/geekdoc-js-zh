    ![](index-75_174.png)\n\n```javascript\nconst Comment = sequelize.define('comment',\
    \ {\n  commenter: Sequelize.STRING,\n  body: Sequelize.TEXT\n})\n\n// These associations\
    \ add an articleId foreign key to our comments table\n// They add helpful methods\
    \ like article.getComments() and article.createComment()\nArticle.hasMany(Comment)\n\
    Comment.belongsTo(Article)\n\n// Create tables\nArticle.sync()\nComment.sync()\n\
    \nmodule.exports = {\n  Article,\n  Comment\n}\n```\n\nFor creating and deleting\
    \ comments we can add nested under the article’s path: `routes.js`\n\n```javascript\n\
    const { Article, Comment } = require('./models')\n\n{\n  method: 'POST',\n  path:\
    \ '/articles/{id}/comments',\n  handler: async (request) => {\n    const article\
    \ = await Article.find(request.params.id)\n    return article.createComment(request.payload)\n\
    \  }\n},\n{\n  method: 'DELETE',\n  path: '/articles/{articleId}/comments/{id}',\n\
    \  handler: async (request) => {\n    const { id, articleId } = request.params\n\
    \    const comment = await Comment.find(id, { where: { articleId } })\n    return\
    \ comment.destroy()\n  }\n}\n```\n\nYou, can pass options to findById as a second\
    \ argument:\n\n```javascript\nconst comment = await Comment.find(id, { where:\
    \ { articleId } })\n```\n\nLastly, we can extend `/articles/:id` to return both\
    \ the article and its comments:\n\n![](index-76_1.png)\n![](index-76_2.png)\n\
    ![](index-76_3.png)\n![](index-76_4.png)\n![](index-76_5.png)\n![](index-76_6.png)\n\
    ![](index-76_7.png)\n![](index-76_8.png)\n![](index-76_9.png)\n![](index-76_10.png)\n\
    ![](index-76_11.png)\n![](index-76_12.png)\n![](index-76_13.png)\n![](index-76_14.png)\n\
    ![](index-76_15.png)\n\n```javascript\n{\n  method: 'GET',\n  path: '/articles/{id}',\n\
    \  handler: async (request) => {\n    const article = await Article.find(request.params.id)\n\
    \    const comments = await article.getComments()\n    return { ...article.get(),\
    \ comments }\n  }\n}\n```\n\n`article` here is the `Model` object; `article.get()`\
    \ returns a plain object with the model’s values, on which we can use the spread\
    \ operator to combine with our comments. Let’s test it out:\n\n```http\nhttp POST\
    \ http://localhost:3000/articles/3/comments comment='{ \"commenter\": \"mb4\"\
    , \"body\": \"Agreed, this blog rules!\" }'\n```\n\n```http\nhttp POST http://localhost:3000/articles/3/comments\
    \ comment='{ \"commenter\": \"Nigerian prince\", \"body\": \"You are the beneficiary\
    \ of a Nigerian prince’s $4,000,000 fortune.\" }'\n```\n"
