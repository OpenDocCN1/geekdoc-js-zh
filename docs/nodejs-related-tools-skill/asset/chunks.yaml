    \n## Waterline 模型\n\n模型是一种抽象，通常在通用编程语言中用对象或类表示，它引用/映射到关系型数据库中的 SQL 表，或者 NoSQL\
    \ 数据库中的文档（键值对）。\n\n你可以使用 Sails.js CLI 创建模型：\n\n```\nsails generate model product\n\
    ```\n\n这将在 `api/models` 中创建一个 `Product.js` 模型，内容如下：\n\n```javascript\n/**\n* Product.js\n\
    *\n* @description :: TODO: 你可以在这里写关于此模型如何工作以及它代表什么的简短摘要。\n* @docs :: http://sailsjs.org/documentation/concepts/modelsandorm/models\n\
    */\nmodule.exports = {\n  attributes: {\n\n  }\n}\n```\n\n然后你可以为你的模型扩展属性。例如：\n\
    \n```javascript\nmodule.exports = {\n  attributes: {\n    name: {\n      type:\
    \ 'string',\n      defaultsTo: '',\n      required: 'true'\n    },\n    description:\
    \ {\n      type: 'string',\n      defaultsTo: ''\n    },\n    quantity: {\n  \
    \    type: 'integer'\n    },\n    user: {\n      model: 'User'\n    }\n  }\n}\n\
    ```\n\n"
- fmt: "\nNotice how we can define the association (onetomany or belongsTo relationship)\
    \ with the model `User`. You can see all supported associations and how to create\
    \ them via this Sails.js associations page.\n\nFor more information about the\
    \ available model attributes, see the Sails.js attributes page.\n\nYou can also\
    \ add configurations per model or model settings by adding toplevel properties\
    \ in the model definition, which will override the global models settings in `config/models.js`.\
    \ You can override settings related to the model’s attributes, database connections\
    \ etc.\n\nFor example, let’s specify a different datastore for the `product` model\
    \ other than the global one used throughout the project:\n\n```javascript\nmodule.exports\
    \ = {\n  connection: 'mysqlcon',\n  attributes: { /*...*/}\n}\n```\n\nThis will\
    \ instruct Sails.js to use a connection named `mysqlcon` to store this model data.\n\
    \nMake sure you add the `mysqlcon` connection to the `connections` object in `config/connections.js`:\n\
    \n```javascript\nmodule.exports.connections = {\n  // sailsdisk is installed by\
    \ default.\n  localDiskDb: {\n    adapter: 'sailsdisk'\n  },\n  mysqlcon: {\n\
    \    adapter: 'sailsmysql',\n    host: 'YOUR_MYSQL_HOST',\n    user: 'YOUR_MYSQL_USER',\n\
    \    password: 'YOUR_MYSQL_PASSWORD',\n    database: 'YOUR_MYSQL_DB'\n  }\n}\n\
    ```\n\nYou also need to install the `sailsmysql` adapter from npm: `npm install\
    \ sailsmysql@forsails0.12`\n\nYou can find the available model settings that you\
    \ can specify from the Sails.js model\n\n![](index-59_1.png) ![](index-59_2.png)\
