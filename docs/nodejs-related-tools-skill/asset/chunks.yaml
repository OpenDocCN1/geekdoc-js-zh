    # Task Runners and Build Processes


    Modern web development involves:

    - Support removing console and debugger statements from scripts.

    - Transpiling ES6 to cross-browser–compatible ES5 code.

    - Code linting and validation.

    - Concatenating and minifying CSS and JavaScript files.

    - Deploying files to development, staging, and production servers.


    Tasks must be repeated every time you make a change. You may start with good intentions,
    but the most infallible developer will forget to compress an image or two. Over
    time, preproduction tasks become increasingly arduous and time-consuming; you''ll
    dread the inevitable content and template changes. It''s mindnumbing, repetitive
    work. Wouldn’t it be better to spend your time on more profitable jobs?


    If so, you need a *task runner* or *build process*.


    ## That Sounds Scarily Complicated!


    Creating a build process will take time. It''s more complex than performing each
    task manually, but over the long term, you’ll save hours of effort, reduce human
    error and save your sanity. Adopt a pragmatic approach:


    1. **Automate the most frustrating tasks first.**

    2. **Try not to overcomplicate your build process.** An hour or two is more than
    enough for the initial setup.

    3. **Choose task runner software and stick with it for a while.** Don''t switch
    to another option on a whim.


    Some of the tools and concepts may be new to you, but take a deep breath and concentrate
    on one thing at a time.


    ## Task Runners: the Options


    Build tools such as `GNU Make` have been available for decades, but web-specific
    task runners are a relatively new phenomenon. The first to achieve critical mass
    was `Grunt` — a Node.js task runner which used plugins controlled (originally)
    by a `JSON` configuration file. `Grunt` was hugely successful, but there were
    a number of issues:


    1. `Grunt` required plugins for basic functionality such as file watching.

    2. `Grunt` plugins often performed multiple tasks, which made customisation more
    awkward.

    3. `JSON` configuration could become unwieldy for all but the most basic tasks.

    4. Tasks could run slowly because `Grunt` saved files between every processing
    step.


    Many issues were addressed in later editions, but `Gulp` had already arrived and
    offered a number of improvements:


    1. Features such as file watching were built in.

    2. `Gulp` plugins were (mostly) designed to do a single job.

    3. `Gulp` used `JavaScript` configuration code that was less verbose, easier to
    read, simpler to modify, and provided better flexibility.

    4. `Gulp` was faster because it uses `Node.js` streams to pass data through a
    series of piped plugins. Files were only written at the end of the task.


    Of course, `Gulp` itself isn''t perfect, and new task runners such as `Broccoli.js`,
    `Brunch` and `webpack` have also been competing for developer attention. More
    recently, `npm` itself has been touted as a simpler option. All have their pros
    and cons, but `Gulp` remains the favorite and is currently used by more than 40%
    of web developers. `Gulp` requires `Node.js`, but while some `JavaScript` knowledge
    is beneficial, developers from all web programming faiths will find it useful.


    ## What About Gulp 4?


    This tutorial describes how to use `Gulp 3 — the most recent release version at
    the time of writing. `Gulp 4` has been in development for some time but remains
    a beta product. It''s possible to use or switch to `Gulp 4`, but I recommend sticking
    with version 3 until the final release.


    ## Step 1: Install Node.js


    `Node.js` can be downloaded for Windows, macOS and Linux from `nodejs.org/download/`.
    There are various options for installing from binaries, package managers and docker
    images, and full instructions are available.


    ### For Windows Users


    `Node.js` and `Gulp` run on Windows, but some plugins may not run if they depend
    on native Linux libraries such as image compression. One option for Windows is
    the new bash command line, which solves many issues. Once installed, open a command
    prompt and enter:


    ```

    node -v

    ```

    This reveals the version number. You''re about to make heavy use of `npm` — the
    `Node.js` package manager which is used to install modules.


    ### For Linux Users


    `Node.js` modules can be installed globally throughout your system. However, most
    users will not have permission to write to the global directory.

