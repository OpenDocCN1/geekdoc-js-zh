    so it’s up to you to make the right choices for maintainability, readability,
    and performance.


    Functional JavaScript doesn’t have to take over an entire project in order to
    add value.


    Learning a little about the functional approach can help guide some of the decisions
    you make as you build your projects, regardless of the way you prefer to structure
    your code. Learning some functional patterns and techniques can put you well on
    your way to writing cleaner and more elegant JavaScript regardless of your preferred
    approach.


    Imperative JavaScript


    JavaScript first gained popularity as an inbrowser language, used primarily for
    adding simple hover and click effects to elements on a web page. For years, that’s
    most of what people knew about it, and that contributed to the bad reputation
    JavaScript earned early on.'
