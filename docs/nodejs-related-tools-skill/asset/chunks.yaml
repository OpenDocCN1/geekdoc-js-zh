    );\n    const db = client.db(dbName);\n  } catch (err) {\n    // 将错误打印到控制台\n \
    \   console.log(err.stack);\n  }\n\n  if (client) {\n    client.close();\n  }\n\
    })();\n```\n\n### Mongoose 驱动\n\n另一个流行的 MongoDB 驱动是 Mongoose。它是构建在官方驱动之上的。当 Mongoose\
