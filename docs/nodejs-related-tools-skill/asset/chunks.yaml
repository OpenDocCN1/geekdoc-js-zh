    $lt is a query filter operator that selects documents whose age field value is
    less than 30\. There are many comparison and logical query filters available,
    and you see the entire list in the Query Selector documentation.


    UPDATE OPERATION


    The update operation modifies the document in a collection. Similar to the create
    operation, MongoDB offers two methods for updating a document. They are: 1. db.collection.updateMany(filter,
    update, options) 2. db.collection.updateMany(filter, update, options).


    If you need to add an extra field, say registration, to all the existing documents
    in a collection, you can do something like this:


    &gt; db.users.updateMany({}, {$set: { ''registration'': ''incomplete''}})


    { "acknowledged" : true, "matchedCount" : 4, "modifiedCount" : 4 }


    The first argument is an empty object because we want to update all documents
    in the collection. The $set is an update operator that sets the value of a field
    with the specified value. You can verify that the extra field was added using
    db.users.find().


    To update the value of documents that match certain criteria, updateMany() accepts
    a filter object as the first argument. For instance, you might want to overwrite
    the value of registration to complete for all users who are aged 18+. Here is
    what you can do:


    &gt; db.users.updateMany(


    {''age'':{ $gt: 18} },


    {$set: { ''registration'': ''complete''}


    })


    { "acknowledged" : true, "matchedCount" : 3, "modifiedCount" : 3 }


    To update the registration details of a single user, you can do this:


    &gt; db.users.updateOne(


    {''email'': ''watson@example.com'' },


    {$set: { ''registration'': ''complete''}


    })


    { "acknowledged" : true, "matchedCount" : 1, "modifiedCount" : 1 }


    DELETE OPERATION


    Delete operation removes a document from the collection. To delete a document,
    you can use the db.collection.deleteOne(filter, options) method, and to


    delete multiple documents, you can use the db.collection.deleteMany(filter, options)
    method.


    To delete documents based on certain criteria, you can use the filter operators
    that we used for the read and update operation:


    db.users.deleteMany( { status: { $in: [ "dormant", "inactive" ] } } )


    { "acknowledged" : true, "deletedCount" : 1 }


    This deletes all documents with a status of “dormant” or “inactive”.


    That’s it.


    An Overview of MongoDB Drivers


    For an application to communicate with the mongodbserver, you have to use a clientside
    library called a driver. The driver sits on top of the database server and lets
    you interact with the database using the driver API. MongoDB has official and
    thirdparty drivers for all popular languages and environments.


    In this tutorial, we’re going to look at our options for drivers for Node.js.
    Some drivers add lots of good features, like like schema support and validation
    of business logic, and you can choose the one that matches your style. The popular
    drivers for Node.js include the native MongoDB driver and Mongoose. I’ll briefly
    discuss their features here.


    MONGODB NODE.JS DRIVER


    This is the official MongoDB driver for Node.js. The driver can interact with
    the database using either promises or callbacks, and also supports the ES6 async/await
    functions. The example below demonstrates connecting the driver to the server:
    const MongoClient = require(''mongodb'').MongoClient;


    const assert = require(''assert'');


    // Connection URL


    const url = ''mongodb://localhost:27017/exampledb'';


    // Database Name


    const dbName = ''exampledb'';


    (async function() {


    let client;


    try {


    // Attempts to connect to the server


    client = await MongoClient.connect(url);


    console.log("Successfully connected to the server.");


    const db = client.db(dbName);


    } catch (err) {


    //Log errors to console


    console.log(err.stack);


    }


    if (client) {


    client.close();


    }


    })();


    The MongoClient.connect returns a promise, and any error is caught by the try
    …


    catch block. You’ll be implementing the CRUD actions inside the try … catch block,
    and the API for that is similar to what we’ve covered in this tutorial. You can
    read more about it in the official documentation page.


    MONGOOSE DRIVER


    Another popular Node.js driver for MongoDB is Mongoose. Mongoose is built on top
    of the official MongoDB driver. Back when Mongoose was released, it had tons of
    features that the native MongoDB driver didn’t have. One prominent feature was
    the ability to define a schema structure that would get mapped onto the database’s
    collection.


    However, the latest versions of MongoDB have adopted some of these features in
    the form of JSON schema and schema validation.


    Apart from schema, other fancy features of Mongoose include Models, Validators
    and middlewares, the populate method, plugins and so on. You can read more about
    these in the Mongoose docs. Here’s an example to demonstrate mongoose.connect()
    for connecting to the database:


    var mongoose = require(''mongoose'');


    // Connection URL


    const url = ''mongodb://localhost:27017/exampledb'';


    mongoose.connect(url);


    var db = mongoose.connection;


    db.on(''error'',


    console.error.bind(console, ''connection error:''));


    db.once(''open'', function() {


    // we''re connected!


    });


    Conclusion


    MongoDB is a popular NoSQL database solution that suits modern development requirements.
    In this tutorial, we’ve covered the basics of MongoDB, the Mongo shell and some
    of the popular drivers available. We’ve also explored the common database operations
    and CRUD actions within the Mongo shell. Now it’s time for you to head out and
    try what we’ve covered here and more. If you want to learn more, I recommend creating
    a REST API with MongoDB and Node to acquaint yourself with the common database
    operations and methods.


