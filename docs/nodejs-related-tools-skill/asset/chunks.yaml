    `c less|stylus|compass|sass`. By default, the generator creates a very basic CSS
    file for you, but selecting a CSS engine will configure your new app with middleware
    to compile any of the above options.


    Now that we’ve got our project set up and dependencies installed, we can start
    the new server by running the following:


    ```bash

    npm start

    ```


    Then browse to `http://localhost:3000` in your browser.


    # Application Structure


    The generated Express application starts off with four folders.


    ## BIN

    The `bin` folder contains the executable file that starts your app. It starts
    the server (on port `3000`, if no alternative is supplied) and sets up some basic
    error handling. You don’t really need to worry about this file because `npm start`
    will run it for you.


    ## PUBLIC

    The `public` folder is one of the important ones:


    * `everything` in this folder is accessible to people connecting to your application.
    In this folder, you’ll put JavaScript, CSS, images, and other assets that people
    need when they connect to your website.


    ## ROUTES

    The `routes` folder is where you''ll put your router files. The generator creates
    two files, `index.js` and `users.js`, which serve as examples of how to separate
    out your application''s route configuration.


    Usually, here you’ll have a different file for each major route on your website.
    So you might have files called `blog.js`, `home.js`, and/or `about.js` in this
    folder.


    ## VIEWS

    The `views` folder is where you have the files used by your templating engine.
    The generator will configure Express to look in here for a matching view when
    you call the `render` method.


    Outside of these folders, there’s one file that you should know well.


    ### app.js

    The `app.js` file is special because it sets up your Express application and glues
    all of the different parts together. Let’s walk through what it does. Here’s how
    the file starts:


    ```javascript

    var express = require(''express'')

    var path = require(''path'')

    var favicon = require(''servefavicon'')

    var logger = require(''morgan'')

    var cookieParser = require(''cookieparser'')

    var bodyParser = require(''bodyparser'')

    ```


    These first six lines of the file are requires. If you’re new to Node, be sure
    to read Understanding `module.exports` and `exports` in Node.js.


    ```javascript

    var routes = require(''./routes/index'')

    var users = require(''./routes/users'')

    ```


    The next two lines of code are requiring the different route files that the Express
    generator sets up by default: `routes` and `users`.


    ```javascript

    var app = express()

    ```


    After that, we create a new app by calling `express()`. The `app` variable contains
    all of the settings and routes for your application. This object glues together
    your application.


    ```javascript

    app.set(''views'', path.join(__dirname, ''views''))

    app.set(''view engine'', ''jade'')

    ```


    Once the `app` instance is created, the templating engine is set up for rendering
    views. This is where you’d change the path to your view files if you wanted to.


    After this, you’ll see Express being configured to use middleware. The generator
    installs several common pieces of middleware that you''re likely to use in a web
    application.


    ```javascript

    app.use(favicon(path.join(__dirname, ''public'', ''favicon.ico'')))

    app.use(logger(''dev''))

    app.use(bodyParser.json())

    app.use(bodyParser.urlencoded({ extended: false }))

    app.use(cookieParser())

    app.use(express.static(path.join(__dirname, ''public'')))

    ```


    - `favicon`. This one is pretty self-explanatory: it just serves your `favicon.ico`
    out of your `public` directory.

    - `logger`. When you run your app, you might notice that all the routes that are
    requested are logged to console. If you want to disable this, you can just comment
    out this middleware.

    - `bodyParser`. You might notice that there are two lines for parsing the body
    of incoming HTTP requests. The first line handles when JSON is sent via `POST`
    request and it puts this data in `request.body`. The second line parses query
    string data in the URL (e.g. `/profile?id=5`) and puts this in `request.query`.

    - `cookieParser`. This takes all the cookies the client sends and puts them in
    `request.cookies`. It also allows you to modify them before sending them back
    to the client, by changing `response.cookies`.

    - `express.static`. This middleware serves static assets from your `public` folder.
    If you wanted to rename or move the `public` folder, you can change the path here.


    Next up is the routing:


    ```javascript

    app.use(''/'', routes)

    app.use(''/users'', users)

    ```


    Here the example route files that were required are attached to our `app`. If
    you need to add additional routes, you’d do it here.


    All the code after this is used for error handling. You usually won’t have to
    modify this code unless you want to change the way Express handles errors. By
    default, it’s set up to show the error that occurred in the route when you’re
    in development mode.


    # A Useful Tool


    Hopefully you now have a clear idea of how the `expressgenerator` tool can save
    you time writing repetitive boilerplate when starting new Express-based projects.
    By providing a sensible default file structure, and installing and wiring up commonly
    needed middleware, the generator creates a solid foundation for new applications
    with just a couple of commands.


    # Introduction to MongoDB


    Topics BY MANJUNATH M


    MongoDB is an opensource, document-oriented, NoSQL database program. If you’ve
    been involved with the traditional, relational databases, the idea of a document-oriented
    NoSQL database might indeed sound peculiar. “How can a database not have tables?”,
    you might wonder.


    Here’s what the official documentation has to say about MongoDB: MongoDB is an
    opensource database developed by MongoDB Inc. that’s scalable and flexible. It
    stores data in JSONlike documents.


    A document in a NoSQL database corresponds to a row in an SQL database. A group
    of documents together is known as a collection, which is roughly synonymous with
    a table in a relational database. For an indepth overview of both NoSQL and SQL
    databases and their differences, we have that covered in the SQL vs NoSQL tutorial.


    Apart from being a NoSQL database, MongoDB has a few qualities of its own. I’ve
    listed some of its key features below:


    - it’s easy to install and set up

    - it uses a BSON (a JSONlike format) to store data it’s easy to map the document
    objects to your application code

    - it claims to be highly scalable and available, and includes support for out-of-the-box
    replication

    - it supports MapReduce operations for condensing a large volume of data into
    useful aggregated results

    - it’s free and open source.

