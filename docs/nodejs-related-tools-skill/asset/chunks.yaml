  raw: 'If you’re building an app for the browser, you’re in luck. Sails ships with
    Grunt — which means your entire frontend asset workflow is completely customizable,
    and comes with support for all of the great Grunt modules which are already out
    there. That includes support for Less, Sass, Stylus, CoffeeScript, JST, Jade,
    Handlebars, Dust, and many more. When you’re ready to go into production, your
    assets are minified and gzipped automatically. You can even compile your static
    assets and push them out to a CDN like CloudFront to make your app load even faster.
    (You can read more about these points on the Sails.js website.)


    You can also use Gulp or Webpack as your build system instead of Grunt, with custom
    generators. See the sailsgeneratenewgulp and sailswebpack projects on GitHub.


    For more community generators, see this documentation page on the Sails.js site.


    The project contains many configuration files and folders. Most of them are self
    explanatory, but let’s go over the ones you’ll be working with most of the time:


    api/controllers: this is the folder where controllers live. Controllers correspond
    to the *C* part in *MVC*. It’s where the business logic for your application exists.


    api/models: the folder where models exist. Models correspond to the *M* part of
    *MVC* architecture. This is where you need to put classes or objects that map
    to your SQL/NoSQL data.


    api/policies: this is the folder where you need to put policies for your application


    api/responses: this folder contains server response logic such as functions to
    handle the 404 and 500 responses, etc.


    api/services: this where your appwide services live. A service is a global class
    encapsulating common logic that can be used throughout many controllers.


    ./views: this folder contains templates used for displaying views. By default,
    this folder contains the *ejs* engine templates, but you can configure any Expresssupported
    engine such as EJS, Jade, Handlebars, Mustache and Underscore etc.


    ./config: this folder contains many configuration files that enable you to configure
    every detail of your application, such as CORS, CSRF protection, i18n, http, settings
    for models, views, logging and policies etc. One important file that you’ll frequently
    use is config/routes.js, where you can create your application routes and map
    them to actual actions in the controllers or to views directly.


    ./assets: this is the folder where you can place any static files (CSS, JavaScript
    and images etc.) for your application.


