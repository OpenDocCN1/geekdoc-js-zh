  md: '![](img/ce4ca26587e04437774a2c81d16dfb4a_405_0.png)


    # # Building a Three-Tiered Data Application


    T his book begins by looking at HTML pages, which are essentially static documents.
    It then reveals how to generate dynamic pages with powerful PHP language. The
    last few chapters show how to use a database management system such as MySQL to
    build powerful data structures. This chapter ties together the PHP programming
    and data programming aspects to build a full-blown data-management system for
    the spy database. The system you learn can easily be expanded to any kind of data
    project you can think of, including e-commerce applications. Specifically, you
    learn how to:


    +   - Design a moderate-to-large data application

    - Build a library of reusable data functions

    - Optimize functions for use across data sets

    - Include library files in your programs


    There isn''t much new PHP or MySQL code to learn in this chapter. The focus is
    on building a larger project with minimum effort.'
