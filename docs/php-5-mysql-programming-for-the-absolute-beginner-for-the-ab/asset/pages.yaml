- img_proc: true
  md: 'remote Web server you are maintaining, for example. However, many remote Web
    servers are not configured to accept this kind of access, so you should know how
    to work with the plain MySQL console.


    > > TRICK The first time you run phpMyAdmin, it will probably ask for some login
    information. This data is stored so you don''t have to remember it every time.
    However, if you want to change your login or experiment with other phpMyAdmin
    features, edit the config.inc.php file installed in the main phpMyAdmin folder.


    # # Creating and Modifying a Table


