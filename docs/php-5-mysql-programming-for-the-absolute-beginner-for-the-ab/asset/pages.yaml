    # # Using MySQL to Create Databases


    When you begin programming in PHP, you start with very simple variables. Soon
    you learned how to do more interesting things with arrays and associative arrays.
    You added the power of files to gain tremendous skills. Now you learn how relational
    databases can be used to manage data. In this chapter you discover how to build
    a basic database and how to hook it up to your PHP programs. Specifically, you
    learn:


    +   * How to start the MySQL executable

    * How to build basic databases

    * The essential data definition SQL statements

    * How to return a basic SQL query

    * How to use phpMyAdmin to manage your databases

    * How to incorporate databases into PHP programs'
