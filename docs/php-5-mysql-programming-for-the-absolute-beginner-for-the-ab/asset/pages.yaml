  md: "To make sure things are going well, I add a check to the end of the page that\
    \ prints the master file's actual contents. This program's output lets the administrator\
    \ see that the test is working correctly. The administrator can take the test\
    \ and submit it to the grading program from this page. If there is a problem,\
    \ it's convenient to have the actual contents of the .mas file visible on the\
    \ page. Of course, the final HTML page does not contain this data, because it\
    \ holds the answers.\n\n# Chapter 6 Working with Files\n\n# Building the Master\
    \ File\n\nThe master file routine is very straightforward:\n\n```\nfunction buildMas(){\n\
    \  //builds the master file\n  global quizName, quizEmail, quizPwd, quizData;\n\
    \  $msData = $quizName . \"\\n\";\n  $msData .= $quizEmail . \"\\n\";\n  $msData\
    \ .= $quizPwd . \"\\n\";\n  $msData .= $quizData;\n  return $msData;\n} // end\
    \ buildMas\n```\n\nThe critical part is remembering the file structure rules,\
    \ so any program that reads this file doesn't get confused. The elements are in\
    \ this order:\n\n+   * Quiz name\n* A newline character\n* The $quizEmail variable\n\
    * The $quizPwd variable\n* All $quizData (usually several lines)\n\nNote that\
    \ the function doesn't actually store the data to the file, but returns it to\
    \ the main program. This allows me to write the data to both the file and to the\
    \ page.\n\n# Building the HTML File\n\nThe function that creates the HTML is a\
    \ little more involved, but is manageable. The basic strategy is: Build an HTML\
    \ form containing all the questions. For each line of the master file, build a\
    \ radio group. Place the question and all the possible answers in a set of nested\
    \ <ol> elements. At the end of the page, there should be one submit button. When\
    \ the user clicks the submit button, the system calls gradeQuiz.php page, which\
    \ evaluates the user's responses."
