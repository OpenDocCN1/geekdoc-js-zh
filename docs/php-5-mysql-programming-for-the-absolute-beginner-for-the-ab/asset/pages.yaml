  md: '# IN THE REAL WORLD


    # Chapter 10 Connecting to Databases within PHP


    Database security is an important and challenging issue. You can do a few things
    to protect your data from hackers. The first thing is to obscure your username
    and password information whenever you publish your code. I removed my username
    and password from the code here. In a practice environment you can leave these
    values blank, but ensure you don''t have wide-open code that allows access to
    your data. If you need to post your code (for example, in a class situation),
    be sure to change the password to something besides your real password.


    # Choosing a Database


    A connection can have a number of databases connected to it. The mysql_set_db()
    function lets you choose a database. The mysql_set_db() function works just like
    the USE command in SQL The mysql_set_db() function requires the database name
    and a data connection. This function returns the value FALSE if it is unable to
    connect to the specified database.


    # Creating a Query


    Creating a query is very easy. The relevant code from showHero.php is reproduced
    here:


    ```

    //create a query

    $sql = "SELECT * FROM hero";n$result = mysql_query($sql, $conn);

    ```


    Begin by placing SQL code inside variable.


    > SQL commands entered into the SQL console or SQLyog require a semicolon. When
    your PHP program sends a command to the DBMS, the semicolon is added automatically,
    so you should not end your SQL commands with semicolons. Of course, assign these
    commands within a line of PHP code, which has its own semicolon. (Sheesh!)


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_361_0.png)


    The mysql_query() function allows you to pass an SQL command through a connection
    to a database. You can send any SQL command to the database with mysql_query(),
    including table creation statements, updates, and queries. The database returns
    a special element called a result set. If the SQL command was a query, the result
    variable holds a pointer to the data, which is taken apart in the'
  merge: -1
