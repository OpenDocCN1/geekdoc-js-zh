- img_proc: true
  md: '# Introducing the SpyMaster Program


    The SpyMaster program is a suite of PHP programs that allows access to the spy
    database created in chapter 11, "Data Normalization." While the database created
    in that chapter is flexible and powerful, it is not easy to use unless you know
    SQL. If your users understand SQL, you don''t want them to have direct control
    of a database, because too many things can go wrong.


    You need to build some sort of front-end application to the database. In essence,
    this system has three levels.


    +   - The client computer handles communication with the user.

    - The database server (MySQL) manages the data.

    - The PHP program acts as interpreter between the client and database. PHP provides
    the bridge between the client''s HTML language and the database''s SQL language.


    This kind of arrangement is frequently called a three-tier architecture. As you
    examine the SpyMaster program throughout this chapter, you learn some of the advantages
    of this particular approach.


    # Viewing the Main Screen


    Start by looking at the program from the user''s point of view as shown in Figure
    12.1.


    The main page has two sections. The first is a series of data requests. Each of
    these requests maps to a query.


    # Viewing the Results of a Query


    When the user selects a query and presses the Submit button, a screen like the
    one in Figure 12.2 appears.'
