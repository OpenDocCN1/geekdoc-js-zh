    # IN THE REAL WORLD

    You might wonder why the sentry variable is called $i$. Like most variables, it''s
    best if sentry variables have a name that suits their purpose. Sometimes, however
    a for loop sentry is simply an integer and doesn''t have any other meaning. In
    those situations, an old programming tradition is often called into play.

    In the Fortran language (one of the earliest common programming languages), all
    integer variables had to begin with the letters $i$, and a few other characters.
    Fortran programmers would commonly use $i$ as the name of generic variables. Even
    though most modern programmers have never written a line of Fortran code, the
    tradition remains. It''s amazing how much folklore exists in such a relatively
    new activity as computer programming.


    Computer programs frequently beginning with zero, so I initialized $i$ to 0 as
    well.


    > Although the $i = 0$; segment looks like (and is) a complete line of code, it
    is usually placed on the same line as the other parts of the for loop.


    # Setting a Condition to Finish the Loop


    Getting a computer to repeat behavior is the easy part. The harder task comes
    when trying to get the computer to stop correctly. The second part of the for
    loop construct is a condition. When this condition is evaluated as TRUE, the loop
    should continue. The loop should exit as soon as the condition is evaluated to
    FALSE. In this case, I set the condition as $i < 10$. This means that as long
    as $i$ has a value less than 10, the loop continues. As the program detects that
    $i$ has a value equal to or larger than 10, the loop exits. Usually a for loop''s
    condition checks the sentry variable against some terminal or ending value.


    # Changing the Sentry Variable


    The final critical element of a for loop is some mechanism for changing the value
    of the sentry variable. At some point the value of $i$ must become 10 or'
  merge: -1
