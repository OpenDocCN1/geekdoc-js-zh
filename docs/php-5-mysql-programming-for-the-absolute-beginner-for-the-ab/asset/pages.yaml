  md: '# Assigning a Value to a Variable


    The equals sign (=) is special in PHP. It does not mean equals (at least in the
    sense context). The equals sign is used for assignment. If you read the equals
    as the word gets, you are closer to the meaning PHP uses for this symbol. For
    example, look at this line of code:


    ```

    $userName = "Jacob";

    ```


    It should be read as The variable $userName gets the value Jacob.

    When you create a variable in PHP, you also assign some value to it. Assignment
    flows from right to left.


    $userName variable has been assigned the value Jacob. Computers are picky about
    what type of information goes into a variable, but PHP automates this process
    for you by determining the data type of a variable based on its context. Still,
    it''s important to recognize that Jacob is a text value, because text is stored
    and processed a little bit differently in memory than numeric data.


    > > Computer programmers almost never refer to text as Instead, they prefer the
    more esoteric term string. The word string actually has a somewhat poetic origin,
    because the underlying mechanism for storing text in a computer''s memory reminded
    early programmers of making a chain of beads on a string.


    # Printing a Variable''s Value


    The next line of code prints a message to the screen. You can print any text to
    the screen you wish. Text (also called string data) is usually encased in quotation
    marks. If you wish to print the value of a variable, simply place the variable
    name in the text you wanted. Examine the following line:


    ```

    print "Hi, $userName";

    ```


    It actually produces this output:


    ```

    Hi, Jacob

    ```


    It produces this when the server server encounters the variable $userName, it''s
    replaced with that variable''s value, which is Jacob. The PHP program output is
    sent directly to the Web browser, so you can even include HTML tags in your output,
    simply by including them inside the quotation marks.


    > The ability to print the value of any other text is also called string interpolation.
    That''s not critical to know, but it could be useful information on a trivia or
    something.'
