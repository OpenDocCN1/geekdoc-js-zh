  md: '# 278


    PHP 5 MySQL for the Absolute Beginner


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_300_0.png)


    # FIGURE 8.6


    This is the standard look of block.html in the Odyssey theme.


    > Your code might vary from what you see here, because each theme has a code fragment
    for each type of element. The actual details don''t matter as much as the general
    concept.


    The notable thing about the code fragment is the lack of any actual content. This
    is the CMS system hallmark. Rather than displaying any actual values, the code
    fragments in a theme describe how to display a certain type of text. Notice the
    placeholders $title and $content. These are, of course, PHP variables that the
    actual title and content elements will replace.


    You can modify any of the HTML theme pages as long as you don''t change the name
    of any of those pages. Likewise, you can replace any of the graphics with your
    own, but don''t use different names, because the system cannot find them otherwise.
    Begin with simple changes like color changes and new graphics; get more sophisticated
    as you begin to understand the file structure.


    # Introducing simpleCMS


    PHP-Nuke is incredibly powerful, but it''s overkill for many personal Web sites.
    It was originally designed to be used as a news site, it''s heavily oriented toward
    news delivery and online forums. The incredible power of the PHP-Nuke system (and
    others like it) can also make them very intimidating for new programmers. (Also,
    I don''t love the coding style to present the resulting pages. PHP-Nuke relies
    heavily on HTML tables as a formatting tool rather than the position CSS elements
    I prefer.)'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'I wanted to create a lightweight content management system that provided many
    of the core features a more complex system provides, but is easier to build and
    maintain. I actually created two related CMSs, which I describe in the rest of
    this chapter.


    The simpleCMS system is easy to use and adds tremendous flexibility to your Web
    system. You don''t need to learn a single new command in PHP or HTML, but you
    do need to rethink what a Web page is.


    # Viewing Pages from a User''s Perspective


    A CMS system is designed to be changed, so although I can show an example of a
    site using the system, the actual possibilities are much larger than a particular
    figure will show. Still, 8.7 illustrates how my Web pages looks using simpleCMS.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_301_0.png)


    FIGURE 8.7


    My main page, simpleCMS-style.


    This page has a couple of interesting features. It follows a fairly standard design,
    with three primary segments of the page. A standard banner goes across the top
    of the page. This banner remains the same when other parts of the page change.
    A list of lists, which acts as a menu, occupies the left side. You can use multiple
    menus to support a complex Web hierarchy. The page''s main section contains dynamic
    content. This part of the page will change frequently. When it changes, the other
    parts of the page will not. The HTML code for the page is combined from three
    different HTML pages and one CSS style. One (surprisingly simple) PHP script controls
    all the action.'
  merge: -1
  pgno: 301
- img_proc: true
  md: "# COULDN’T I GET THE SAME EFFECT WITH FRAMES?\n\nHTML frames were originally\
    \ designed to allow the same sort of functionality, but frames have proven to\
    \ be extremely frustrating both for users and developers. It is reasonably easy\
    \ to create a frame-based Web site, but much harder to build a site that behaves\
    \ well. If you've traversed the Web for any time, you've bumped into these frames\
    \ within frames that eat your entire screen away. The Back button acts unpredictably\
    \ inside a frame context, and it is difficult to maintain a consistent style across\
    \ multiple frames. While simpleCMS looks like a frameset, it's actually all one\
    \ HTML file generated from a number of smaller files.\n\n# Examining the PHP Page\
    \ Code\n\nLook at the source code for simpleCMS, which is extraordinarily simple:\n\
    \n```\n<!DOCTYPE HTML PUBLIC \"//W3C//DTD HTML 3.2 Final//EN\">\n?>\n//Simple\
    \ CMS\n//Extremely Simple CMS system\n//Andy Harris for PHP/MySQL Adv. Beg 2nd\
    \ Ed.\n\nif (empty($menu)) {\n  $menu = \"menu.html\";\n} // end if\n\nif (empty($content))\
    \ {\n  $content = \"default.html\";\n} // end if\n\ninclude(\"menuLeft.css\");\n\
    include(\"top.html\");\n\nprint \"<span class = \\\"menuPanel\\\"> \\n\";\ninclude($menu);\n\
    print \"<//span> \\n\";\n\nprint \"<span class = \\\"item\\\"> \\n\";\ninclude($content);\n\
    ```"
  merge: -1
  pgno: 302
