  md: '# Previewing the Quiz Machine


    This chapter''s main program is a fun and powerful tool that you can use in many
    different ways. It is not simply one program, but a system of programs that work
    together to let you create, administer, and grade multiple-choice quizzes.


    # IN THE REAL WORLD


    It is reasonably easy to build an HTML page that presents a quiz and a PHP program
    to edit that quiz. However, if you want several quizzes, it might be worth the
    investment in time and energy to build a system that can automate the creation
    and administration of quizzes. The real power of programming comes into play not
    just when you solve one immediate problem, but when you can produce a solution
    that can be applied to an entire range of related problems. The quiz machine is
    an example of exactly such a system. It takes a little effort to build, but the
    effort really pays off when you have a system to reuse.


    # Entering the Quiz Machine System


    Figure 6.1 shows the system''s main page. The user needs a password to take a
    test and an administrator password to edit a test. In this case, I entered the
    administrative password (it''s absolute—like in *Absolute Beginner''s Guide*)
    into the appropriate password box, and I''m going to edit the Monty Python quiz.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_204_0.png)


    > I refer to the quiz machine as a system rather than a program because it uses
    a number of programs intended to work together.


    # Editing a Quiz


    The screen shown in Figure 6.2 appears when the user has the correct password.
    You can see the requested quiz in a special format on the screen.


    The quiz administrator can edit the quiz. Each quiz has a name, instructor e-mail
    address, and password. Each question is stored in a single line with the question,
    four possible answers, and the correct answer separated by colon:) characters.'
