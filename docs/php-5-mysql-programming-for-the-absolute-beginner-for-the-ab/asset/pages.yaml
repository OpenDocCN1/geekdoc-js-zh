    Once you''ve defined a class, you want to have an instance or two of that. One
    of the great things about objects is how easily you can make multiple instances
    of some class. However, for this example you just make one instance. The code
    that creates an instance looks like this:


    ```

    $theCritter = new Critter();

    ```'
