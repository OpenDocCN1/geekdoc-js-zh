- img_proc: true
  md: "# Here's the basic CSS I used:\n\n```\n<!--\n  this style places a menu on\
    \ the left and an item section in\n  the center. Intended for use with CMS demos\
    \ for\n  PHP/MySQL for the Abs. Beg, Andy Harris\n-->\n```\n\n```\n<style type\
    \ = \"text/css\">\nbody (\n  background-image: url(\"binaryBG.gif\")\n)\n\nh1\
    \ {\n  color: #0000FF;\n  font-family: \"Comic Sans MS\";\n  text-align: center;\n\
    }\n\nspan.menuPanel {\n  position: absolute;\n  left: 1%;\n  width: 15%;\n  background-color:\
    \ #CCCC\n}\n\nspan.item {\n  position: absolute;\n  left: 17%;\n  width: 80%;\n\
    \  background-color: #CCCC\n}\n```\n\nI defined the background style for all pages\
    \ created by this system. I also built two span tag subclasses. You may recall\
    \ that span is useful for CSS because it doesn't carry any formatting baggage.\
    \ The span.menuPanel class is defined as a position-element near the left border\
    \ that stretches 15 percent of the border width. The element's top and height\
    \ are not defined. This means the element is placed immediately below whatever\
    \ HTML tag was previously displayed, but all span contents are formatted to fit\
    \ within the 15-percent limit. I intend for this section of the Web page to be\
    \ filled with a list of links to serve as a menu."
  merge: -1
