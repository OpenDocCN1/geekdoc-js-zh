    Later on you edit this file to configure Apache, but you need to install PHP first.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_33_0.png)


    The install.txt document suggests the php.ini file goes in C:\winnt.

    found that worked fine with PHP version 4, but version 5 requires the file to
    be in C:\windows (at least, that was the case on my machine). If your configurations
    are not taking hold, check this file location. You should also be able to put
    the file in your Apache directory—but if you do, that is the only version you
    have. If you get strange behavior, check to see that you don''t have an extra
    copy of php.ini floating around somewhere.


    Later in this chapter, I show you how to change this file so the programs contained
    in this book run without problems. For now, though, be sure that PHP is running.


    # Telling Apache about PHP


    +   1. Open the Apache configuration file in your text editor.


    Remember, this file is called http.conf and it''s probably in the conf directory
    of your Apache installation.


    +   2. Find a section containing a series of loadmodule directives.


    If you''re using PHP version 5, you must specifically tell Apache where to find
    it.


    +   3. After the other loadmodule commands, add the following code:


    ```

    LoadModule php5_module c:/apache/php5apache.dll

    ```


    +   4. Modify the code so it points to wherever the php5apache.dll file was installed
    in your system.


    +   5. Scroll down until you see a series of AddModule commands.


    +   6. Add the following code to http.conf to add the module:


    ```

    AddModule mod_php5.c

    ```


    +   7. Add the following line to the end of the file:


    ```

    AddType application/x-httpd-php .php

    ```


    +   8. Save httpd.conf and restart Apache to ensure the changes are permanent.


    Exploring the PHP Environment'
