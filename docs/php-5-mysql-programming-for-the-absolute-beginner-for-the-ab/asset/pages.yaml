    # Summary


    Content management systems can help automate your Web site''s creation. CMS tools
    allow you to build multipart Web documents, combining pages with a single style
    and layout. You learned how to install and customize the popular PHP-Nuke CMS.
    You also learned how to build a very basic CMS of your own using GET parameters
    to customize your page. You learned about XML and how to use the simpleXML tools
    to parse XML files you encounter. Finally, you learned how to combine your newfound
    XML skills with CMS to build an XML-aware CMS.


    # CHALLENGES


    +   1. Install and configure PHP-Nuke or another CMS on your system.

    2. Create a custom theme by analyzing and modifying the existing theme.

    3. Modify simpleCMS with your own layout, images, and banner files.

    4. Create an editor that allows the user to build XML pages for XCMS.

    5. Write an XCMS module that allows authorized users to add new content (a news
