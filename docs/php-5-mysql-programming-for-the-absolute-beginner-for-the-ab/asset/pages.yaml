    ![](img/ce4ca26587e04437774a2c81d16dfb4a_440_0.png)


    # FIGURE 12.13


    The smarter function prevents the user from editing the primary key and provides
    a drop-down list for all foreign key references.


    # Determining the Field Type


    As far as this function is concerned, three field types in a record need to be
    handled differently.


    +   * Primary key. If a field is the primary key, its value needs to be passed
    on to the next program, but the user should not be able to edit it.

    * Foreign key. If a field is a foreign key reference to another table, the user
    should only be able to indirectly edit the value. The best approach is to have
    a drop-down list box that shows values the user will recognize. Each of these
    values corresponds to a key in that secondary record. For example, in Figure 12.13
    there is a list box for the operationID field. The operationID field is a foreign
    key reference in the agent table. The ordinary rToEdit()'
