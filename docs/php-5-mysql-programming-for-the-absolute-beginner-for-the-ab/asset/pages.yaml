  md: 'When you include a file, it is interpreted as HTML, not PHP. This means you
    can place any HTML code in an include file and it is automatically inserted in
    your output wherever the include function occurred. I took advantage of this fact
    to include a CSS block in the library. If you want PHP code in your library file,
    surround your code with PHP tags (<?php ?>) in the library file.


    # Chapter 12 Building a Three-Tiered Data Application


    # Setting Systemwide Variables


    Another huge advantage of a library is the ability to set and use variables that
    have meaning throughout the entire system. Since each PHP program in the system
    includes the library, all have access to any variables declared in the library''s
    main section. Of course, you need to use the global keyword to access a global
    variable from within a function.


    ```

    //spyLib.php

    //holds utilities for spy database


    //variables

    $userName = "";

    $password = "";

    $serverName = "localhost";n$dbName = "chapter12";n$dbConn = "";

    $adminPassword = "absolute";n$mainProgram = "spyMaster.php";

    ```


    I stored a few key data points in the systemwide variables. The $userName, $password,
    and $serverName set up the data connection. I did this because I expect people
    to reuse my library for their own databases. They definitely need to change this
    information to connect to their own copy of MySQL. It''s much safer for them to
    change this data in variables than actual program code. If you''re writing code
    for reuse, considering anything the code adopter might change into variables.


    The $adminPassword variable holds the password used to edit data in the system.
    Again, I want anybody using this library (including me) to change this value without
    having to dig through the code.


    The $mainProgram variable holds the URL of the “control pad” program of the system.
    In the spy system, I want to provide access to spyMaster.php in every screen.'
