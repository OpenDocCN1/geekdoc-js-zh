- img_proc: true
  md: '(Of course, the menu can be much more sophisticated, but it''s good to start
    slowly. In the next section you look at the sneaky (but not difficult) way the
    menu HTML is coded.)


    I kept the code very simple, but of course you can (and should) improve it however
    you wish. Add background graphics, borders, or improved text. Put the menu across
    the right or top.


    # TRICK


    It''s important that I used percentage measurements in this element, because I
    don''t know the user''s screen resolution. By indicating position and width in
    percentages, I have a style that works well regardless of the browser size.


    # IN THE REAL WORLD


    What about browsers that don''t support CSS? Some would argue that table-based
    approach to layout (as PHP-Node and many other CMS tools use) work across more
    browsers than a CSS-centric approach. While it''s true some older browsers support
    tables but not CSS, they have their own problems as page layouts.


    Tables were never really designed for that purpose, to get a layout exactly like
    you want, often have to build a Byzantine complex of nested within tables, with
    all sorts of colspan tricks and invisible borders.


    The possible CSS elements were invented to provide a simpler, more uniform solution
    to page layout headers. The browsers that don''t support CSS still display everything
    encoded in a CSS-augmented page. The CSS won''t take effect, but all the other
    HTML code will work and the user can use the page.


    The item class the other important CSS element in this code sample. It''s another
    specialized span dedicated to placing the Web page''s main content. The item class
    works well with the menuItem class. It is placed a little to the right of the
    menu panel and takes up most of the remaining screen space. Once again, the actual
    style is quite simplistic and you probably want to spruce it up.


    # Inspecting the Menu System


    The real key to the simpleCMS is the way it''s used. Each page that the user sees
    is a combination of three different HTML pages: a banner, menu, and content page.
    The simpleCMS.php program puts these three elements together according to'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'specific style sheet. For this example, presume that the CSS style and banner
    remain the same for every system-displayed page. (This is usually the behavior
    you want.)


    You never directly link to any of the pages in your system. Instead, you link
    to the simpleCMS.php program and pass the content file (and menu file, if you
    wish) you wanted. Recall that simpleCMS requires two parameters. Most PHP programs
    get their parameters from HTML forms, but you may remember from chapter 2, "Using
    Variables and Input," that parameters can be sent via the URL protocol. You can
    make any page display as an element of your CMS by calling it as a parameter.


    To clarify, take a look at the menu.html code:


    ```

    <h3>Main Menu</h3>

    <ul>

    <li><a href="simpleCMS.php?content=default.html">main</a></li>

    <li><a href="simpleCMS.php?content=classes.html">classes</a></li>

    <li><a href="simpleCMS.php?content=links.html">links</a></li>

    <li><a href="simpleCMS.php?content=software.html">software</a></li>

    <li><a href="simpleCMS.php?content=wallyindex.html">media</a></li>

    </ul>

    ```


    The trick? The first link refers to a page called default.html. Rather than directly
    linking to default.html, I linked to simpleCMS and passed the value default.html
    as the content parameter. When simpleCMS runs, it places the default banner (top.html)
    and the default menu (menu.html), but places the contents of default.html in the
    new page''s item area. I didn''t send a menu parameter, but I could have, and
    it would have placed some other page in the menu area.


    In short, you can place any page in the menu area by assigning its value to the
    menu parameter; you can assign any page to the item area by assigning its value
    to the content parameter. Any page you want displayed using the CMS must be'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'called through a link to the CMS program, which pastes together all the other
    pages. You can place any HTML into any of the segments, but your menu usually
    goes in the menu area and is usually written only with links running back through
    the CMS.


    You can create a reasonably sophisticated multilevel CMS with only this basic
    program by experimenting with different menus, CSS styles, and banners.


    > TRICK

    You might wonder why I didn''t show you the source code for the CMS top content
    areas. There''s nothing at all unusual about these pages, so I didn''t think it
    was necessary. Generally, you write the page to be banner-like (very simple, to
    cover the entire width of the page, but just a short height). The pages you want
    to display in a CMS don''t need header areas, titles, or page-level CSS definitions,
    because many are ignored in this multipage document. The CMS dictates these meanings
    for the entire composite page.


    # Improving the CMS with XML


    Although the simpleCMS presented earlier is extremely powerful, it is limited
    to two parameters. It would be great if you could control even information on
    every pass through the CMS. It would also be nice to determine the page title,
    CSS style, top area menu, and body on every pass through the system. However,
    the GET method approach used in simpleCMS quickly becomes cumbersome when you''re
    sending more than one or two parameters.


    The GET method allowed limited amounts of data to be passed. The URLs get tedious
    when you have that much information to send. Most CMSs use an alternative method
    of storing the information about intended page values. A lot of CMSs (like PHP-Node)
    use the full power of relational databases. There is a wonderful way to go, but
    it could be somewhat overkill for a basic demonstration. There is a more-powerful
    alternative than basic parameter passing, although it''s not quite intimidating
    as a relational data structure.


    # Introducing XML


    eensible Markup Language, or XML, has become a major topic of conversation in
    the software industry in the last few years. It''s not just a language, but a
    flexible and sensible alternative for manipulating data. It''s really a language
    for describing languages.


    XML feels a like HTML (because they''re related) and it''s quite a bit more flexible.
    In a nutshell, XML allows you to use HTML-style syntax to describe anything.'
  merge: -1
  pgno: 307
- img_proc: true
  md: "For example, if you want to talk about pets, you could use the following code:\n\
    \n```\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<pets>\n  <cat>\n    <name>Lucy</name>\n\
    \    <color>tabby</color>\n    <breed>shorthair</breed>\n  </cat>\n\n  <dog name\
    \ = \"Muchacha\"\n    color = \"brown\"\n    breed = \"mutt\" />\n</pets>\n```\n\
    \nAs you look at this figure of (entirely fictional) XML code, you see an unmistakable\
    \ resemblance to HTML. XML uses many conventions that are familiar to HTML developers,\
    \ including nested and closing tags and attributes. The most significant difference\
    \ is the tags themselves. HTML tags are specifically about page markup, but XML\
    \ tags can describe anything. As long as you have (or write) a program to interpret\
    \ the XML code, you can use HTML-like code to describe the information.\n\n# Working\
    \ with XML\n\nXML has a number of data-management tool advantages. XML files can\
    \ be stored and manipulated as string data and ordinary text files. This makes\
    \ it easy to duplicate data and move it around the Internet. XML data is somewhat\
    \ self-documenting. You can look at XML data in a text editor and have a good\
    \ idea what it means. This would be impossible if the data were stored in a database\
    \ table or proprietary format. Most languages have features that allow you to\
    \ easily extract data an XML document even if you don't know exactly how the document\
    \ is formatted.\n\n# Understanding XML Rules\n\nXML is very similar to HTML, but\
    \ it is not quite as forgiving on syntax. Remember these rules when creating an\
    \ XML document:\n\n+   - **XML is case sensitive.** Most tags use lowercase or\
    \ camelCase (just like PHP). `<pet>` and `<PET>` are two different tags."
  merge: -1
  pgno: 308
- img_proc: true
  md: "+   All attributes must be encased in quotation marks. In HTML, quotation marks\
    \ are always optional. In XML, almost all attribute values should be quoted. For\
    \ example, <dog name = muchacha> is not legal in XML. The appropriate expression\
    \ is <dog name = \"muchacha\">.\n\n+   All tags require an ending tag. HTML is\
    \ pretty forgiving about whether you include tags. XML is much stricter. Every\
    \ tag must have an ending tag or indicate with a trailing slash that it doesn't\
    \ have. In the earlier example, <cat> has an ending </cat> tag. I defined dog\
    \ to encase all its data in attributes rather than tags, so it doesn't have an\
    \ explicit ending tag. Notice how the dog ends with a slash (/) to indicate it\
    \ has no end tag.\n\n# # Examining main.xml\n\nThe second CMS system in this chapter\
    \ could be useful, we take a look at the XML file that describes my main page\
    \ in the XML-based content management system (XCMS):\n\n```\n<?xml version=\"\
    1.0\" encoding=\"utf-8\"?>\n<cpage>\n  <title>Andy's Main Page</title>\n  <css>menuLeft.css</css>\n\
    \  <top>top.html</top>\n  <menu>menuX.html</menu>\n  <content>http://www.ciupui.edu/~aharris/default</content>\n\
    </cpage>\n```\n\nThe entire document is stored in a <cpage></cpage> element. cpage\
    \ represents a CMS page. The page has five parameters. Each page has a title as\
    \ well as URLs to a CSS style, top page, menu page, and content page. The XML\
    \ succinctly describes all the data necessary to build a page in my CMS. I build\
    \ such an XML page for every page I displayed in my system. It is actually pretty\
    \ easy because most of the pages are the same except for the content.\n\n> TRICK\n\
    It would be even easier in a real-world application, because I would probably\
    \ build an editor to create the XML pages automatically. That way the user would\
    \ never have to know he was building XML Sounds like another great end-of-chapter\
    \ project!"
  merge: -1
  pgno: 309
- img_proc: true
  md: "# Simplifying the Menu Pages\n\nThe menu page isn't as complicated when all\
    \ the data is stored in the XML pages. Each call to the system requires only one\
    \ parameter: the name of the XML file containing the layout instructions. Here's\
    \ the menu page after changing it to work with the XML files:\n\n```\n<h3>Main\
    \ Menu</h3>\n<!-- menu page modified for XML version of CMS -->\n\n<ul>\n  <li><a\
    \ href=\"XCMS.php?theXML=main.xml\">main</a></li>\n  <li><a href=\"XCMS.php?theXML=classes.xml\"\
    >classes</a></li>\n  <li><a href=\"XCMS.php?theXML=links.xml\">links</a></li>\n\
    \  <li><a href=\"XCMS.php?theXML=software.xml\">software</a></li>\n  <li><a href=\"\
    XCMS.php?theXML=media.xml\">media</a></li>\n</ul>\n```\n\nThis menu calls the\
    \ XML version of the CMS code (XCMS.php) and sends it to the XML filename that\
    \ describes each page to be created. Of course, you examine how the XML data is\
    \ manipulated in that program. Start, though, with a simpler program that looks\
    \ at XML data.\n\n# Introducing XML Parsers\n\nA program that reads and interprets\
    \ XML data is usually called an XML parser. PHP 5 officially has three different\
    \ XML parsers. I focus on the one that's easiest to use. It's called the simpleXML\
    \ API and comes standard with PHP 5. An API is an application programming interface—an\
    \ extension that adds functionality to a language."
  merge: -1
  pgno: 310
- img_proc: true
  md: 'If you''re using another version of PHP, you can try loading the simpleXML
    API as an add-on or work with another XML parser. The DOM (Document Object Model)
    parser, if it''s enabled, works much like simpleXML Older versions of PHP include
    a parser based on SAX (Simple API for XML). This is also relatively easy to use,
    but uses a completely different model for file manipulation. With careful reading
    of the online help, you can figure it out: The concepts remain the same. If you
    use simpleXML, it''s a great place to start, because it''s a very easy entry into
    the world of XML programming.


    # Working with Simple XML


    The simpleXML model is well named, because it''s remarkably simple to use once
    you understand how it sees. XML data can be thought of as a hierarchy tree (like
    the directory structure on your hard drive). Each element (except the root) has
    exactly one parent, and each element has the capacity to have a number of children.
    The simpleXML model treats the entire XML document as a special object called
    an XML node. Table 8.1 illustrates the main methods of the simplexml_element object.


    | Method | Returns |

    | --- | --- |

    | ->asXML() | An XML string containing the contents of the node |

    | ->attributes() | An associative array of the node''s attributes |

