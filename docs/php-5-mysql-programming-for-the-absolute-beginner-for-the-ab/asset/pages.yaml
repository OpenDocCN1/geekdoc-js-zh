    # Understanding OOP


    The SuperHTML project uses many OOP features to do its work. Before digging into
    the innards of SuperHTML itself, it makes sense to think more about what objects
    are and how to create them in PHP.


    # Objects Overview


    As you''ve seen, objects have properties, which are characteristics of the object,
    and methods, which are things the object can do.


    In addition to supporting properties and methods, a properly designed object should
    reflect certain values of the object-oriented paradigm.'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'Many discussions of OOP indicate that objects also have events. An event is
    sort of stimulus the object can respond to. Events are indeed important in OOP,
    but they are not used in PHP programming, because events are meant to capture
    things that happen in real time. PHP programs involve real-time interaction with
    the user, so events are not critical in PHP objects as they are in other languages.


    # Encapsulation


    An object can be seen as some data (the properties) and some code (the methods)
    for working with that data. Alternatively, you could see an object as a series
    of methods and the data that supports these methods. Regardless, you can use an
    object without knowing exactly how it is constructed. This principle of encapsulation
    is well supported by PHP. You take advantage of encapsulation when you build ordinary
    functions. Objects take the notion of encapsulation one step further by grouping
    code and data.


    # Inheritance


    Inheritance is the idea that an object can be inherited from another object. Imagine
    if you had to build a police car. You could build a factory that begins with sheet
    metal and other raw materials, or you could start with a more typical car and
    simply add the features that make it a police car. Inheritance involves taking
    an existing type of object and adding new features to create a new object type.
    PHP supports at least one kind of inheritance, as you see later in this chapter.


    # Polymorphism


    You''ve encountered polymorphism in the SuperHTML description. Polymorphism involves
    an object''s ability to act somewhat differently under different circumstances.
    Specifically, it is often used to handle unexpected or missing data. PHP supports
    some types of polymorphism, but to be honest this is a more factor of the permissive
    and loose variable typing of PHP than any particular object-oriented design consideration.


