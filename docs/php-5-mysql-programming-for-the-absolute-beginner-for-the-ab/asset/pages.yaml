    # Using Parameters and Function Values


    Functions are to be self-contained. This is good because the entire program can
    be too complex to understand. If you break the complex program into smaller functions,
    each function can be set up independently. When you work inside a function, you
    don''t have to worry about anything outside the function. When you create a variable
    inside a function, variable dies as soon as you leave the function. This prevents
    many errors that can otherwise creep into your code.


    The bad side of being so self-contained is evident when you want them to work
    with data from the outside. You can accomplish this a couple of ways.


    +   - Send a parameter to a function, which allows you to determine one or more
    values sent to the function as it starts.

    - Give a function return value.


