  pgno: 344
- img_proc: true
  md: 'You might want to get a listing of all heroes in your database whose last name
    begins with an E, or perhaps somebody parked a Yak Dirigible in your parking space
    and need to know who the driver is. You may also want your list sorted by special
    power or list only vehicles. All these (admittedly contrived) involve grabbing
    a subset of the original data. The SELECT statement is the SQL workhorse.


    +   1. Click the SQL tab to get a query screen in phpMyAdmin.

    2. Type in a query.

    3. Click the Go button to see the query results.


    You''ve seen the simplest form of this command getting all the data in a table,
    like this:


    ```

    SELECT * FROM hero;

    ```


    Figure 9.19 shows this form of the SELECT statement operating on the hero table.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_345_0.png)


    The SELECT query is in the top section and the results are shown underneath.


    phpMyAdmin is a wonderful tool for experimenting with SELECT statements because
    you can write the SQL by hand and see immediate results in a very clean format.
    If you don''t want to (or cannot) use phpMyAdmin, do experiments directly in MySQL.
    It will work, but the results are formatted as text and not always easy to see.'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'The SELECT statement is extremely powerful because it can grab a subset of
    data that can return only the requested fields and records. This process of asking
    questions of the database is commonly called a query. Note that phpMyAdmin sometimes
    adds elements to the query (notably the limit information). This increases the
    query''s efficiency, but doesn''t substantially change the query.


    # Limiting Columns


    You might not want all of the fields in a table. For example, you might just want
    a list of the name and weapon of everyone on your list. You can specify this by
    using the SELECT statement, which is illustrated in Figure 9.20.


    ```

    SELECT name, weapon

    FROM hero;

    ```


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_346_0.png)


    This query returns only the names and weapons.


    This may seem like silly capability for such simple database as the hero list.
    However, you often run into extremely complicated tables with many fields and
    need to filter only a few fields. For example, I use a database to track student
    advisees. Each student''s information contains lots of data, but I might just
    want a list of names and e-mail addresses. The ability to isolate the fields I
    need is to get useful information from a database.


    The results of a query look lot like a new table. You can think of a query result
    as a temporary table.'
  merge: -1
