  md: '# Creating a Basic Table


    Early in this chapter I mentioned that PHP arrays and HTML lists are natural companions.
    Each row of an HTML table can be seen as a PHP array, and a table can be seen
    as an array of rows. An array of arrays is a two-dimension array. It shouldn''t
    surprise you that building a table from a two-dimension array is easy. After I
    created an array called $myTransform, turning it into a table with one line of
    code was trivial:


    ```

    $->buildTable($myArray);

    ```


    # Creating a More-Complex Table


    The buildTable() method is easily easy, but it isn''t flexible enough for all
    needs. Frequently (especially in database applications) I want to build the top
    of the table, a header row, a series of rows in a loop, and then off the table.
    I decided to add a more powerful suite of table-creation methods. These make it
    possible to make more-sophisticated tables, like the one on Table.php.


    The following code builds a table line-by-line:


    ```

    $->startTable(3);

    $->addRow(array("English", "Greek", "th"));

    $->addRow(array("a", "alpha"));

    $->addRow(array("b", "beta"));

    $->endTable();

    ```


    The startTable() method creates the code that begins the table definition. The
    parameter indicates the table''s border width. If you don''t indicate a border
    width, it defaults to 1. (Gosh, polymorphism is wonderful!) It won''t surprise
    you that the end of the table is indicated by the单独() method.


    The cool part of this approach is the addRow() method, which makes up the table
    body. This method can accept one or two parameters. The first parameter is an
    array of values that populates the row. Of course this can be an array variable
    or created-on-fly (as in this example). The second addRow() parameter is cell
    type. The default type is td, but you can specify th if you want a header row.
    (I explain in the form.php coming up next how to make a column of headers.) Call
    the addRow() method once for each table row. In an actual program, this frequently
    happens inside some sort of loop.


