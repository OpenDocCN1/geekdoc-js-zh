    As you see when you look at the SuperHTML code itself, this approach can cause
    some problems. It''s generally better to use special methods to get information
    from and properties. Take a look at the following code for Property.php and you''ll
    see a better way to change a property value.


    ```

    <<?ninclude "SuperHTMLDef.php";

    $s = new SuperHTML("Basic Super Page");

    $s->setTitle("I changed this");

    $s->buildTop();

    print "The title is now " . $s->getTitle();

    $s->buildBottom();

    print $s->getPage();

    ?>

    ```


    The $s->setTitle() method allows me to add a new value to a property. The $s->getTitle()
    method gets a value from a property. These special methods are usually called
    access methods because they allow access to properties. I''ll explain more about
    access methods later in this chapter when you start building your own object.'
