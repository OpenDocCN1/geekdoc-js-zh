    shows the results of the badSpy database after I started entering information
    about some of my field agents.


    # ## Inconsistent Data Problems


    Gold Elbow record indicates that Operation Dancing Elephant is infiltrating a
    suspicious zoo. Falcon''s record indicates that the same operation is about infiltrating
    a suspicious circus. For the purpose of this example, I''m expecting that an assignment
    has only one description, so one of these descriptions is wrong. There is no way
    to know whether it''s a zoo or a circus by looking at the data in the table, so
    both records are suspect. Likewise, it''s hard to tell if Operation Angst takes
    place in Lower Volta or Lower Lotla, because the two records that describe this
    mission have different spellings.


    The circus/zoo inconsistency and the Volta/Volta problem share a common cause.
    In both cases the data-entry person (probably a low-ranking civil servant, because'
