    # Summary


    The details of the SpyMaster system can be dizzying, the overall effect is a flexible
    design that you can easily update and modify. This system can accept modifications
    to the underlying database and can be adapted to an entirely different data set
    with relatively little effort.


    Although you didn''t learn any new PHP syntax in this chapter, you saw an example
    of coding for reuse and flexibility. You learned how to include files to simplify
    complex systems and how to build a library file with utility routines. You learned
    how to write code that can be adapted to multiple data sets and code that prevents
    certain kinds of user errors. You learned to build programs that help tie together
    relational data structures. The things you have learned in this chapter form the
    foundation of all data-enabled Web programming, which in turn form the backbone
    of e-commerce and content-management systems.'
