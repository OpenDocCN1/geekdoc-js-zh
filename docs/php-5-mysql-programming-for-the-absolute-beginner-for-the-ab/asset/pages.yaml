- img_proc: true
  md: 'I began the process by thinking about everything that a data-management system
    should be able to do. Each major idea is broken into a module. A module often
    represents a single screen. A PHP program often (although not always) supports
    each model.


    # The View Query Module


    Obviously, users should be able to get queries from the database. This is one
    of the most common tasks of the system. I decided that the View Query module should
    be able to view any query sent to it and display an appropriate result.


    # The Edit Table Module


    The other primary task in a data system is data definition, which includes adding
    new records, deleting records, and updating information. This activity can be
    destructive, so it should be controlled using some kind of access system. All
    data definition is based on the database''s underlying table structure, so it
    is important to allow the three main kinds of data definition (editing, deletion,
    and updating) on each table.


    The Edit Table module provides the interface to these behaviors. It shows all
    the current records in a table and lets the user edit or delete any particular
    record. It also has a button that allows the user to add a new record to this
    table. It''s important to see that Edit Table doesn''t actually cause anything
    to change in the database. Instead, it serves as a gateway to several other editing
    modules.


    # The Edit Record and Update Record Modules


    If you look back at the state diagram, you see the Edit Table module leading to
    three other modules. The Edit Record module shows one record and allows the user
    to edit the data in the record. However, the database isn''t actually updated
    until the user submits changes, so editing a record is a two-step process. After
    the user determines the changes in the Edit Record module, program control moves
    on to the Update Record module, which actually processes the request and makes
    the change to the database.


    # The Add Record and Process Add Modules


    Adding a record is similar to editing, as it requires two passes. The first module
    (Add Record) generates a form that allows the user to input the new record details.
    Once the user has determined the record data, the Process Add module creates and
    implements the SQL necessary to incorporate the new record in the table.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# The Delete Record Module


    Deleting a record is a simple process. There''s no need for any other user input,
    so it requires only one module to process a deletion request.


    # Designing the System


    The state diagram is very helpful, because it allows you to see an overview of
    the entire process. More planning is still necessary, however, because the basic
    state diagram leaves a lot of questions unanswered. For example:


    +   * Will the Edit Table module have to be repeated for each table?

    * If so, I will also need copies of all other editing modules?

    * Can I automate the process?

    * What if the underlying data structure is changed?

    * What if I want to apply a similar structure to another database?

    * How can I allow queries to be added to the system?


    It is tempting to write a system specifically to manage the spy database. The
    advantage of such a system is that it will know exactly how to handle issues relevant
    to the spy system. For example, operationID is a foreign key in the agent table,
    so it should be selected by a drop-down list whenever. If you build a specific
    module to handle editing the agent table, you can make this happen.


    However, this process quickly becomes unwieldy if you have several tables. It
    is better to have a smart procedure that can build an edit screen for any table
    in the database. It would be even better if your program could automatically detect
    foreign key fields and provide the appropriate user-interface element (an HTML
    SELECT clause) when needed. In fact, you could build an library of generic routines
    that could work with any database. That''s the approach I chose.


    # Building a Library of Functions


    Although the SpyMaster is the largest example in this book, most of it is surprisingly
    simple. The system''s centerpiece is a file called spyLib.php. This file is not
    meant to run in the user''s browser at all. Instead, it contains a library of
    functions that simplify coding of any database. It is stored as much of the PHP
    code as I could in this library. All the other PHP programs in the system make
    use of the various functions in the library. This approach has a number of advantages:


    +   * The overall code size is smaller since code does not need to be repeated.'
  merge: -1
  pgno: 414
- img_proc: true
  md: '- If I want to improve a module, I do it once in the library rather than in
    several places.


    - It is extremely simple to modify the code library so it works with another database.


    - The details of each particular module are hidden in a separate library so I
    can focus on the bigger picture when writing each PHP page.


    - The routines can be reused to work with any table in the database.


    - The routines can automatically adjust to changes in the data structure.


    - The library can be readily reused for another project.


    Figure 12.11 shows a more detailed state diagram.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_415_0.png)


    FIGURE 12.11


    This state diagram illustrates the relationship between PHP programs and functions
    in the spyLib library.


    When you begin looking at actual code, you''ll see most of the PHP programs are
    extremely simple. They usually just collect data for a library function, send
    program control off to that function, and then print any output produced by the
    function.


    # Writing the Non-Library Code


    I begin here by describing all the parts of this project except the library. The
    library module is driven by the needs of the other PHP programs, so it makes sense
    to look at the other programs first.'
