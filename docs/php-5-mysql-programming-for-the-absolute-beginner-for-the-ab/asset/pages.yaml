    data in a named field q (for query, I suppose). I took a gamble that all the other
    fields would have default values, and wrote a hyperlink that incorporates a query.
    My link looked like this:


    ```

    <li><a href="http://www.google.com/search?q=php">Google search for "php"</a></li>

    ```


    Whenever the user clicks this link, it sets up a method query to Google''s search
    program. The result is a nifty Google search. One thing you might want to figure
    out how to set up canned versions of your most common queries in search engines,
    so you can get updates with one click. Figure 2.11 illustrates what happens when
