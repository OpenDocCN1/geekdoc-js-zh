  md: 'You can use MySQL a number of ways, but the basic procedure involves connecting
    to a MySQL server, choosing a database, and then using the SQL language to control
    the database by creating tables, viewing data, and so on.


    The MySQL exe console shipped with MySQL is the best way to work with the MySQL
    database. Although it won''t win any user interface awards, the program offers
    low-level access to the database. This interface is important to learn, however
    because it is very much like the way your programs will interface with the database
    system.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_327_0.png)


    If you''re running your Web server, you must run the MySQL server before you can
    run the client. Under Windows, run the WinMySQLAdmin tool to start the MySQL server.
    This automatically starts the MySQL server and sets up your system so that MySQL
    is run as a service when your computer is booted (much like Apache). Turn off
    the MySQL server in the Control Panel''s Services section or with the MySQL tool
    menu that appears in the system tray.


    # # Creating a Database


    Databases are described by a very specific organization scheme. To illustrate
    data-concepts, I create and view a simple phone list. The phone list''s basic
    structure is in Table 9.1.


    | Table 9.1 PHONE LIST SUMMARY |

    | id | firstName | lastName | e-mail | phone |

    |---|---|---|---|---|n| 0 | Andy | Harris | aharris@cs.iupui.edu |

    | 1 | Joe | Slow | jslow@myPlace.net | 987-6543 |


    The phone list shows a very typical data table. Database people to give special
    names to the parts of the database.


    +   * Each row of the table is called a *record*. Records describe discrete (individually
    defined) entities.


    Every record in the table has the same field definitions, but records can have
    different values in the fields. The fields in a table are defined in specific
    ways.'
