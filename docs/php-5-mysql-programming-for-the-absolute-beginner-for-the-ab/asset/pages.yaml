  md: '# # Using a Join to Connect Tables


    The only downside to disconnecting the data tables is the necessity to rejoin
    the data when needed. The user doesn''t care that the operation and the agent
    are in different tables, but he will want the data to look as if they were on
    the same table. The secret to reattaching tables is a tool called the inner join.
    Take a look at the following SELECT statement in SQL:


    ```

    SELECT agent.name AS agent, operation.name AS operation

    FROM agent, operation

    WHERE agent.operationID = operation.operationID

    ORDER BY agent.name;

    ```


    At first glance this looks like an ordinary query, but it is a little different.
    It joins data from two different tables. Table 11.5 illustrates the results of
    this query.


    | Agent | Operation |

    | --- | --- |

    | Blackford | Enduring Angst |

    | Bond | Dancing Elephant |

    | Cardinal | Enduring Angst |

    | Falcon | Dancing Elephant |

    | Rahab | Furious Dandelion |


    # ## Creating Useful Joins


    An SQL query can pull data from more than one table. To do this, follow a few
    basic rules.


    +   - Specify the field names formally if necessary. Notice that the SELECT statement
    specifies agent name rather than simply name. This is necessary because both tables
    contain a field called name. Using the table.field syntax is much like using a
    person''s first and last name. It''s not necessary if there''s no chance of confusion,
    but in a larger environment the more complete naming scheme can avoid confusion.

    - Use the AS clause to clarify your output. This provides an alias for the column
    and provides a nicer output.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '+   • Modify the FROM clause so it indicates both of the tables you''re pulling

    data from. The FROM clause up to now has only specified one table.

    In this example, it''s necessary to specify that data will be coming from

    two different tables.

    • Indicate how the tables will be connected using a modification of the

    WHERE clause.


    # Examining a Join without a WHERE Clause


    The WHERE clause helps clarify the relationship between two tables. As an expla-nation,
    consider the following query:


    ```

    SELECT

    agent.name AS ''agent'',

    agent.operationID AS ''agentID'',

    operation.operationID AS ''op opID''

    operation.name AS ''operation''

    FROM agent, operation

    ORDER BY agent.name;

    ```


    This query is much like the earlier query, except it includes the operationID
    field

    from each table and omits the WHERE clause. You might be surprised by the

    results, which are shown in Table 11.6.


    The results of this query are a Cartesian join, which shows all possible

    combinations of agent and operation. Of course, you don''t want all the

    combinations—only those combinations where the two tables indicate the

    operation ID.


    # Adding a WHERE Clause to Make a Proper Join


    Without a WHERE clause, all possible combinations are returned. The only concern-worthy
    records are those where the operationID fields in the agent and operation

    tables have the same value. The WHERE clause returns only these values joined
    by

    a common operation ID.


    The secret to making this work is the operationID fields in the two tables. You''ve

    already learned that each table should have a primary key. The primary key field

    is used to uniquely identify each database record. In the agents table, agentID
    is

    the primary key. In operations, operationID is the primary key. (You might note

    my unimaginative but very useful naming convention here.)'
