  md: '# Building the QuizMachine.php Control Page


    The heart of the quiz system is the QuizMachine.php page. The user directly enters
    this page only. All other parts are called from this page or from one of the pages
    it calls. This page acts as a control panel. It consists of three parts, which
    correspond to the three primary jobs this system can do: writing or editing


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_226_0.png)


    The QuizMachine.php program is the entry point to the system for both the test
    administrator and the quiz taker. The program essentially consists of three forms
    that allow access to the other parts of the program. To ensure a minimal level
    of security, all other programs in the system require password access.


    The QuizMachine.php program primarily serves as a gateway to the other parts of
    the system. If the user has administrative access (determined by a password),
    he can select an exam and call the editQuiz.php page. This page loads the quiz''s
    actual master file (if it already exists) or sets up a prototype quiz and places
    the quiz data in a Web page as a simple editor. The editQuiz program calls the
    writeQuiz.php program, which takes the results of the editQuiz and writes it to
    a master test file and an HTML page.


    If the user wants to take a quiz, the system moves to the takeQuiz.php page, which
    checks the user''s password and presents the quiz if authorized. When the user
    indicates he is finished, the gradeQuiz.php program grades the quiz and stores
    the result in a text file.


    Finally, the administrator can examine the log files resulting from any of the
    quizzes by indicating a quiz from the quizMachine. page. The showLog.php program
    displays the appropriate log file.'
