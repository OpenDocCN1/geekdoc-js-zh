  md: '# Introducing the spy Database


    In this chapter you build a database to manage your international spy ring. (You
    do have an international spy ring, don''t you?) Saving the world is a complicated
    task, so you''ll need a database to keep track of all your agents. Secret agents
    are assigned to various operations around the globe, and certain agents have certain
    skills. The examples in this chapter will take you through the construction of
    such a database in MySQL. In chapter 12, “Building a Three-Tiered Data Application”
    you use this database to make a really powerful spymaster application in PHP.


    The spy database reflects a few facts about my spy organization (called the Pan-theon
    of Humanitarian Performance, or PHP).


    +   * Each agent has a code name.

    * Each agent can have any number of skills.

    * More than one agent can have the same skill.

    * Each agent is assigned to one operation at a time.

    * More than one agent can be assigned to one operation.

    * A spy''s location is determined by the operation.

    * Each operation has only one location.


    This list of rules helps explain some characteristics of the data. In database
    parlance, they are called business rules. I need to design the database so these
    these rules are enforced.


    | IN THE REAL WORLD |

    | I set up this particular set of rules in a somewhat arbitrary because they help
    me make my database as simple as possible while still illustrating most of the
    main problems encountered in data design. Usually you don''t get to make up business
    rules. Instead, you learn them by talking to those who use the data every day.
    |'
