    \ that prints \"That's an ace!!!!\" doesn't happen every time the program is run.\
    \ It only happens if a certain condition is true. The if statement sets up a condition\
    \ for evaluation. In this case, the condition is read $roll is equal to 1. If\
    \ that condition is true, all the code between the left brace (() and the right\
    \ brace (}) evaluates. If the condition is not true, the code between the braces\
    \ is skipped altogether.\n\nA condition can be thought of as an expression that\
    \ can be evaluated as true or false. Any expression that return a true or false\
    \ value can be used as a condition. Most conditions look much like the one in\
    \ the Ace program. This condition checks the variable $roll to see if it is equal\
    \ to the value 1.\n\nNote that equality is indicated by two equals signs (=).\n\
    \nThis is important, because computer programs are not as flexible as humans.\
    \ We often use the same symbol for different purposes. While computer languages\
    \ can do this, it often leads to problems. The single equals sign is reserved\
    \ for assignment. Read this line as $x gets five, indicating that the value 5\
    \ is being assigned to the variable $x:\n\n```\n$x = 5;\n```\n\nThis code fragment\
    \ should be read as $x is equal to five, as it is testing equality.\n\n```\n$x\
    \ == 5;\n```\n\nIt is essentially asking whether x is equal to 5. A condition\
    \ such as $x == 5 does not stand on its own. Instead, it is used inside some sort\
    \ of other structure, such as an if statement.\n\n# Chapter 3\nnControlling Your\
