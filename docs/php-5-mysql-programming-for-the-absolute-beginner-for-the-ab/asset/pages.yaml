  md: '# Building the Form


    This program uses a PHP page to create an input form and to respond directly to
    the input. It begins by looking for the existence of the $input variable. The
    variable does not exist the first time the user gets to pages. In this situation,
    the program builds the appropriate HTML page and awaits user input. The program
    runs again after the user hits the submit button, but this time the $inputStream
    has a value. The rest of the program uses string manipulation functions to create
    a pig Latin version of the input string.


    # Using the split() Function to Break a String into an Array


    One of the first tasks for pigify is to break the entire string that comes from
    the user into individual words. PHP provides a couple of interesting functions
    for this purpose. The split() function takes a string and breaks it into an array
    based on some sort of delimiter, or separator character. The split() function
    takes two arguments. The first argument is a delimiter and the second is a string
    to break.


    I want each word to be a different element in the array, so I use space (" ")
    as a delimiter. The following line takes the $inputStream variable and breaks
    it into an array called $word. Each word is a new array.


    ```

    $word = split(" ", $inputString);

    ```


    Once the $word array is constructed, it is stepped through it with a foreach loop.
    It stored each word temporarily inside the array.


    # Trimming a String with rtrim()


    Sometimes when you split a string into an array, each array element still has
    the split character at the end. In the pig Latin game, there is a space at the
    end of each word, which PHP provides a function called rtrim() which automatically
    removes spaces, tabs, newlines, and other whitespace from the end of a string.
    I used the rtrim() function to clean off any trailing spaces from the split()
    operation and returned the results to $word.


    ```

    $word = rtrim($word);

    ```


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_179_0.png)


    In addition to rtrim(), PHP has ltrim(), which trims excessive whitespace from
    the beginning of a string and trim(), which cleans up both ends of a string. there''s
    a variation of the trim commands that allows you to specify exactly which characters
    are removed.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Finding a Substring with substr()


    The algorithm''s behavior depends on the first character of each word. I need
    to know all the rest of the word without the first character. The substr() function
    is useful for getting a part of string. It requires three parameters.


    +   - The string you want to get a piece from

    - Which character you want to begin with (starting with 0 as usual)

    - How many characters you want to extract


    I got the first letter of the word with this line:


    ```

    $firstLetter = substr($theWord, 0, 1);

    ```


    It comes one letter from $theWord starting at the beginning of the word (position
    0). I stored that value in the $firstLetter variable.


    It''s not much complicated to get the rest of the word:


    ```

    $restOfWord = substr($theWord, 1, strlen($theWord) - 1);

    ```


    Again, I need to extract values from $theWord. This time I begin at character
    1 (which humans would refer to the second character). I don''t know directly how
    many characters to get, but I can calculate it. I should grab less character than
    the total number of characters in the word. The strlen() function is perfect for
    this operation, because it returns the number of characters in any string. I can
    calculate the number of letters I need with strlen($theWord) - 1. This new decapitated
    word is stored in the $restOfWord variable.


    # Using str() to Search for One String Inside Another


    The next task is to determine if the first character of the word is a vowel. You
    can take a number of approaches to this problem, but perhaps the easiest is a
    search-function. I created a string with all the vowels (aeiouAEIOU) and then
    I searched for the existence of the $firstLetter variable in the vowel string.


    The str() function is perfect for this task. It takes two parameters: the string
    you are looking for (given the adorable name haystack in the online documentation)
    and the string you are searching in (the needle).


    To search for the value of the $firstLetter variable in the string constant "aeiouAEIOU",
    I used the following line:


    ```

    if (strstr("aeiouAEIOU", $firstLetter))

    ```'
