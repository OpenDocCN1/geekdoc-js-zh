- img_proc: true
  md: 'Earlier versions of PHP had built-in MySQL support. The beta version of PHP
    5 that I used for this book requires some minor configuration before it will use
    the MySQL functions. Run the phpinfo() command you learned in chapter 1, "Exploring
    the PHP Environment," to see how your server is configured. phpinfo() does not
    indicate support for MySQL, modify your PHP.INI file. Add or uncomment the following
    line in Dynamic Extensions section of PHP.INI to enable MySQL support if it is
    not currently turned on:


    ```

    extension=php_mysql.dll

    ```


    If you cannot get MySQL running on your server, the new SQL extensions built into
    PHP 5, Appendix B (on this book''s CD) describes how to use SQLite, which is another
    database program installed as the default. The two have some differences, but
    the main ideas remain the same. If you end up using SQLite, read this chapter
    to get the main ideas and read Appendix B to see how SQLite is different from
    MySQL. I included SQLite versions of every database in the book for your reference.


    # The MySQL Executable


    MySQL is actually a number of programs. It has a server component that is always
    running, as well as a number of utility programs. The MySQL command line console-shown
    in Figure 9.5 is a basic program run from the command line. It isn''t a very pretty
    program, but it provides powerful access to the database engine.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_326_0.png)


