  md: "Because of the way database tables are stored in files, the computer must always\
    \ know how much room to allocate for each field. Therefore, each field's size\
    \ and type is important. This particular database is defined with five fields.\
    \ The id field is an integer. All the other fields contain string (text) data.\n\
    \n# Creating a Table\n\nOf course, to use a database system, you need to learn\
    \ how to build a table.\n\nRDBMS programs use a language called SQL to create\
    \ and manipulate databases. SQL is pretty easy to understand, compared to full-blown\
    \ programming languages. You can usually guess what's going on without a lot of\
    \ knowledge. As an example, look at the following SQL code:\n\n```\nUSE chapter9;\n\
    \nCREATE TABLE phoneList (\n  id INT PRIMARY KEY,\n  firstName VARCHAR(15),\n\
    \  lastName VARCHAR (15),\n  email VARCHAR(20),\n  phone VARCHAR(15)\n);\n```\n\
    \nDESCRIBE phoneList;\n\nThis code is an SQL script. It's like a PHP program in\
    \ that it is a set of instructions for the computer. However, the PHP interpreter\
    \ doesn't directly interact with the SQL language. Instead, these commands are\
    \ sent to another program. As a PHP programmer, you will write code that sends\
    \ commands to a database language. Just as your PHP code often writes code in\
    \ HTML format for the browser to interpret, you'll write SQL code for the MySQL\
    \ interpreter to use.\n\nWhen this code is sent to an SQL-compliant database program\
    \ (such as MySQL), it creates the database structure in Table 9.1.\n\n# Using\
    \ a Database\n\nYou may have several database projects working in the same relational\
    \ database system. In my case, each chapter has its own database. Sometimes your\
    \ system administrator will assign a database to you. In any case, you will probably\
    \ need to invoke that database with the USE command."
