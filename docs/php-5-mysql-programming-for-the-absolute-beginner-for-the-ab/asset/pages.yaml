  md: '# Keeping Persistent Data


    Most traditional kinds of programming presume that the user and the program are
    engaging in a continual dialog. A program begins running, might ask the user some
    questions, responses to these inputs, and continues interacting with the user
    until he indicates an interest in leaving the program.


    Programs written on a Web server are different. The PHP programs you are writing
    an incredibly short life span. When the user makes a request to your PHP program
    through a Web browser, the server runs the PHP interpreter (the program that converts
    your PHP code into the underlying machine language your server understands). The
    result of the program is a Page that is sent back to the user''s browser. Once
    your program sends a page to the user, the PHP program shuts down because its
    work is done. Web servers do not maintain contact with the browser after sending
    a page. Each request from the user is seen as an entirely new transaction.


    The Poker program at the beginning of this chapter appears to interact with the
    user indefinitely. Actually, the same program is called repeatedly. The program
    acts differently in different circumstances. Somehow it needs to keep track of
    what state''s currently in.


    The underlying Web protocol (HTTP) that Web servers do not keep connections longer
    than necessary. This behavior is referred to as being a stateless protocol. Imagine
    if your program were kept running as long as anybody anywhere on the Web were
    looking at what. If a person fired up your program and went to bed? Your Web server
    would have to maintain a connection to that person. Also remember that your program
    might be called by thousands of people all at the same time.


    It can be very hard on your server to have all these concurrent connections open.
    Having stateless behavior improves your Web server''s performance, but that performance
    comes at a cost. Essentially, your programs have complete amnesia every time they
    run. You need a mechanism for determining the current state.


    # Counting with Form Fields


    You can store information a couple of ways, including files, XML, and databases.
    The second half of this book details these important ideas. The easiest approach
    to achieving data permanence is to hide the data in the user''s page. To illustrate,
    take a look at Figures 4.9 and 4.10.'
  merge: -1
  pgno: 136
