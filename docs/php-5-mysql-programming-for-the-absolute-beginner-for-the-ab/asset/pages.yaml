- img_proc: true
  md: "```\nCREATE TABLE phoneList (\n  id INT PRIMARY KEY,\n  firstName VARCHAR(15),\n\
    \  lastName VARCHAR (15),\n  email VARCHAR(20),\n  phone VARCHAR(15)\n);\n```\n\
    \nYou can think of fields as being much like variables, but while PHP is easygoing\
    \ about what type of data is in a variable, SQL is very picky about the type of\
    \ data in fields. In order create an efficient database, MySQL needs to know exactly\
    \ how many bytes of memory to set aside for every single field in the database.\
    \ It does this primarily by requiring the database designer to specify the type\
    \ and size of every field in each table. Table 9.2 lists a few of the primary\
    \ data types supported by MySQL.\n\n# Table 9.2 COMMON DATA TYPES IN MySQL\n\n\
    | Data Type | Description |\n|---|---|n| INT | Standard integer +/- 2 billion\
    \ (roughly) |\n| BIGINT | Big integer +/- 9 x 10^18 |\n| FLOAT | Floating-point\
    \ decimal number 38 digits |\n| DOUBLE | Double-precision floating-point 308 digits\
    \ |\n| CHAR(n) | Text with n digits; if actual value is less than n, field is\
    \ padded with spaces |\n| VARCHAR(n) | Text with n digits; trailing spaces are\
    \ automatically culled off |\n| DATE | Date in YYYY-MM-DD format |\n| TIME | Time\
    \ in HH:MM:SS format |\n| YEAR | Year in YYYY format |\n\n> While the data types\
    \ listed in Table 9.2 are by the most commonly used, MySQL supports many others.\
    \ Look in the online Help that helps with MySQL if you need a more specific data\
    \ type. Other databases have a very similar list of data types.\n\nYou might notice\
    \ that it is unnecessary to specify the length of numeric types (although you\
    \ can determine a maximum size for numeric types as well as the number of digits\
    \ you want stored in float and double fields). The storage requirements for numeric\
    \ types are based on the field type itself."
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Working with String Data in MySQL


    Text values are usually stored in VARCHAR fields. These fields must include the
    number of characters allocated for the field. Both CHAR and VARCHAR fields have
    fixed lengths. The primary difference between them is what happens when the field
    contains a value shorter than the specified length.


    Assume you declared a CHAR field to have a length of 10 with the following SQL
    segment:


    ```

    firstName VARCHAR(10);

    ```


    Later you store the value ''Andy'' into the field. The field actually contains
    ''Andy ''. (That is, Andy followed by six spaces.) CHAR pads any remaining characters
    with spaces. The VARCHAR field type removes any padded spaces. The VARCHAR field
    type is the one you use often to store string data.


    # DETERMINING THE LENGTH OF A VARCHAR FIELD


    Data design is both a science and an art. Determining the appropriate length for
    your text fields is one of the oldest problems in data


    If you do not allocate enough room for your text data, you can cause a lot of
    problems for your users. I taught a course called CLT SD WEB PRG database that
    the course name doesn''t have enough room for the actual course name (Client-Side
    Web Programming). My students renamed it the Buy Vowel course.


    However, you can''t make every field a thousand characters long, either, because
    it would waste system resources. If you have a field that will contain only five
    characters and you allocate one hundred characters, the drive still requires room
    for the extra 95 characters. If your database has thousands of entries, this can
    be a substantial cost in drive space. In a distributed environment, you have to
    wait for those unnecessary spaces to come across bandwidth.


    It takes experimentation and practice to determine the appropriate width for your
    string fields. Test your application with real users so you can be sure youve
    made the right decision.


    # Creating the CREATE TABLE Statement


    Once you understand field data types, the CREATE TABLE syntax makes a lot of sense.
    Only a few more details to understand:


    +   Use a pair of parentheses to indicate the field list once you specify CREATE
    TABLE.'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'Name each field and follow it with its type (and length, if it''s a CHAR or
    VARCHAR).


    Separate the fields with commas.


    Put each field on its own line and indent the field definitions. You don''t have
    to, but I prefer to, because these practices make the code much easier to read
    and debug.


    # Creating a Primary Key


    You might be curious about the very first field in the phone list database. Just
    to refresh your memory, the line that defines that field looks like this:


    ```

    INT PRIMARY KEY,

    ```


    Most database tables have some sort of field that holds a numeric value. This
    special field is called the primary key.


    You can enter the code presented so far directly into the MySQL program. You can
    see the code and its results in Figure 9.6.


    # IN THE REAL WORLD


    A simple database could theoretically go without a primary key, but such fields
    are important to more sophisticated databases that you might well start putting
    them in. It''s traditional to put a primary key in every table.


    In chapter 11, "Data Normalization," you learn more about the relational data
    model. In that discussion you learn how keys build powerful databases and more
    about creating primary keys. In fact, the adventure program you''ve already seen
    relies heavily on a key field even though there''s only one table in the database.


    # Using the DESCRIBE Command to Check a Table''s Structure


    Checking the structure of a table can be helpful, especially if somebody created
    it or you don''t remember exactly its field types or sizes. The DESCRIBE command
    lets you view a table structure.'
