    the program what the correct answer was.


    # CAN''T THE PROGRAM REMEMBER THE RIGHT ANSWER?


    Since the program generated the correct answer in the first place, you will be
    surprised to learn that the right answer must be hidden in the Web page and retrieved
    by the same program that generated it. Each contact between the client and the
    server is completely new.


