  md: '# Using the Semicolon to End a Line


    PHP is a more formal language than HTML and, like most programming languages,
    has some strict rules about the syntax used when writing. Each unique instruction
    is expected to end with a semicolon. If you look at the complete code for helloJacob
    program, you see that each line of PHP code ends with said semicolon. If you forget
    to do this, you get an error that looks like the one in Figure 2.4.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_49_0.png)


    An instruction sometimes is longer than a single line on the editor. The semicolon
    goes at the end of the instruction, which often (but not always) corresponds with
    the end of the line. You''ll see an example of this shortly as you build long
    string variables. In general, though, you end with a semicolon.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_49_1.png)


    FIGURE 2.4


    This error occurs if you go sans semicolon to the end of every line.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_49_2.png)


    Don''t panic if you get an error message or two. Errors are a completely normal
    part of programming. Even experienced programmers expect to see many error messages
    while building and testing programs.


    Usually the resulting error code gives you important clues about what went wrong.
    Make sure you look carefully at whatever line of code is reported. Although the
    error isn''t always on that line, you can often get a hint. In many cases (particularly
    a missing semicolon), a syntax error indicates an error on the line that actually
    follows the real problem. If you get a syntax error on line 14, and the problem
    is a missing semicolon, the problem line is actually line 13.'
  merge: -1
