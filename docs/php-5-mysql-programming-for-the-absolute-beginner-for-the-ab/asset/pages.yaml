    # Adding Text and Tags with SuperHTML


    The SuperHTML object makes it easy to build a basic framework, but you always
    need other kinds of tags. SuperHTML has some general methods for adding various
    kinds of tags and text to a document. Figure 7.3 illustrates a page using these
    features.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_257_0.png)


    FIGURE 7.3


    This page includes some text and HTML tags.


    One of the primary features of SuperHTML is the way it separates the creation
    of a Web page from its display. When you want to be able to easily generate a
    page and then display it onscreen, write it to a file, or whatever else you want
    it. For reason, you won''t simply print things out. Instead, you''ll keep adding
    stuff to the SuperHTML object and then print the whole thing out you''re done.


    That means you need some mechanism for adding things to the page. The SuperHTML
    object contains more than 25 methods for adding various kinds of objects to the
    document. (Don''t panic. Most of them are really very simple). Two methods in
    particular are extremely useful. Look at the code for AddText.php and see what
    I mean.'
