  md: '# SQL ADVANTAGES


    Databases have been an important part of programming since the beginning, but
    the process of working with data has evolved. The advent of a common language
    that can be used in many applications was a very important step. SQL is a fourth-generation
    language. In general, these languages are designed to solve a particular type
    of problem. Some fourth-generation languages (like SQL) are full-blown programming
    languages, because they do not support structures like branches and loops.


    Still, these languages can serve a purpose. SQL is handy because it''s widely
    supported. The SQL commands you learn in this chapter apply to most modern database
    programs with little to no modification. You can take the script in MySQL and
    send the same code to an Oracle or MS SQL Server (two other common choices), and
    all three programs build the same database. If you upgrade to a more powerful
    data package, you can use your existing scripts to manipulate the data. If you''re
    working with SQLite, your SQL commands will be almost identical to the commands
    used in MySQL.


    Programming in traditional languages is perhaps the most powerful reason to have
    a scripting language with to control databases. You can write a program in any
    language (like PHP, for example) that generates SQL code. You can then use that
    code to manipulate the data. This allows you to have complete flexibility, and
    lets your program act as the database interface.


    > SQL syntax is not exactly like that of PHP. SQL has a different culture, and
    it makes sense to respect the way SQL code has historically been written. SQL
    is generally not case-sensitive, but most SQL coders put SQL commands in uppercase
    letters. You usually end each line with a semicolon when a bunch of SQL commands
    are placed in a file (as this code is).


    > If you don''t already have a database to USE, you can make one with the CREATE
    command. For example, use these commands to create a database called myStuff:


    ```

    CREATE DATABASE myStuff;

    USE myStuff;

    ```


    # Creating a Table


    To create a table, you must indicate the table name as well as each field. For
    each field, list what type of data is held in the field, and (for text data) the
    field''s characters length. As an example, the following code creates the phoneList
    table:'
  merge: -1
