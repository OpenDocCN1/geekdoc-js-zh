  md: '# Introducing the Tip of the Day Program


    Your first program probably won''t win any Web awards, but it takes you beyond
    what you can do with regular HTML. Figure 1.1 illustrates the Tip of the Day page,
    which offers friendly, helpful advice.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_24_0.png)


    # FIGURE 1.1


    The tip of the day might look simple, but it is a technological marvel. It features
    HTML, cascading style sheets, and PHP code.


    You wrote this kind of page without using a technology like PHP, but the program
    is a little more sophisticated than it might look on the surface. The tip isn''t
    actually embedded in the Web page at all, but it is stored in a completely separate
    file. The program integrates this separate file into the HTML page. The page owner
    can change the tip of the day very easily by editing the file that contains the
    tips.


    # IN THE REAL WORLD


    The Tip of the Day page illustrates one of the hottest concepts in Web programming
    today: this kind of structure allows programmers to design a Web site''s general
    layout, but isolates the contents from the page design. The page owners (who might
    not know how to modify a Web page directly) can easily change a text file without
    exposing the code that holds the site together. You''ll learn how to build a full-blown
    content management system in chapter 8, “XML and Content Management Systems.”'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'You should begin by reviewing your HTML skills. Soon enough, you''re going
    to be writing programs that write Web pages, so you need to be very secure with
    your HTML coding. If you usually write all your Web pages with a plain text editor,
    you would be fine. If you tend to rely on higher-end tools like Microsoft FrontPage
    or Macromedia Dreamweaver, you should put those tools aside for a while and make
    sure you can write HTML by hand. To build Web pages using modern standards (HTML
    4.0 or XHTML), including form elements and cascading style sheets (CSS). If you
    need a refresh, please see Appendix A, which is stored on the CD that accompanies
    this book.


    # # Programming on the Web Server


    The Internet is all about various computers communicating with each other. The
    prevailing model of the Internet is the notion of clients and servers. You can
    understand this by imagining a drive-through restaurant. As you drive to the little
    speaker, a barely intelligible voice asks for your order. You ask for cholesterol
    supreme and the teenager packages your food. You drive up, exchange money for
    the meal, and drive away. Meanwhile, the teenager waits for another customer to
    appear. The Internet works much like this model. Large permanent computers call
    Web servers host Web pages and other information. They are much like the drive-through
    restaurant. Users drive up to the Web server using a Web browser. The data is
    exchanged and the user can read the information on the Web browser.


    What''s interesting about this model is the interaction doesn''t have to stop
    there. Since the client (user''s) machine is a computer, it can be given instructions.
    Commonly, the JavaScript language stores special instructions in a Web page. These
    instructions (like the HTML code itself) don''t mean anything on the server. The
    page gets to the client machine, the browser interprets the HTML code and any
    other JavaScript instructions.


    While much of the work is passed to the client, there are some disadvantages to
    this client-side approach. Programs designed to work inside a Web browser are
    usually greatly restricted in the kinds of things they can do. A client-side Web
    program usually cannot access the user''s printer or disk drives. This limitation
    alone prevents such programs from doing much of the most useful work of the Internet,
    such as database connectivity and user tracking.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'The server is also a computer; it''s possible to write programs designed to
    operate on the server rather than the client. This arrangement has a number of
    advantages:


    +   - Server-side programs run on powerful Web server computers.

    - The server can freely work with files and databases.

    - The code returned to the user is plain HTML, which can be displayed on any Web
    browser.


    # Installing PHP and Apache


    PHP is only interesting when it runs on a computer configured as a Web server.
    One way or another, you need access to a computer with at least three components
    on it: PHP, a Web server (such as Apache or Microsoft IIS), and some sort of database
    management system (usually MySQL).


    # Using an Existing Server


    If you''re lucky, you already have access to a Web server that has PHP and some
    other useful programs installed. Once you start building professional Websites,
    investigate using a commercial Web server so you don''t have to deal with the
    headaches of server administration and security yourself (unless, of course, you
    really like that kind of thing). The advantage of using a prebuilt server is primarily
    avoiding the messy process of setting up your own server. The disadvantage is
    you''re stuck with the configuration that your server administrator decides upon.


    Ultimately, you need access to some sort of Web server so people can see your
    programs. It might make sense to do all your programming directly on the server
    you''ll use to disseminate your work. If you already have a Web site stored on
    a server, check to see if your servers offer PHP support. A surprising number
    of services offer PHP/MySQL support for little or no extra cost.


    There are some free PHP servers around, but they don''t stay up for long and they
    usually have some sort of advertisements or other strings attached. Still, it''s
    possible to find a free host that will support PHP. To find a suitable hosting
    service, do a Google search on free PHP hosting. You have many choices if you''re
    willing to pay a monthly fee for service. With a little digging, you can easily
    find full-featured services for less than $10 a month. If you want to be able
    to do all the projects in this book, look for a server that supports PHP 5.0 and
    MySQL. It is also useful if the service supports phpMyAdmin, a database management
    system described in chapter 9, “Using MySQL to Create Databases.”'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# # Installing Your Own Development Environment


    Even if you have access to an online Web server, you may want to build a practice
    server for development. This approach has many advantages:


    +   * You can control exactly how the server you install is configured. You can
    tune it so all the options you want are turned on, and things you don''t need
    are disabled. (I describe how to do this later in this chapter in the section
    called "Telling Apache about PHP")

    * You can test your programs without exposing them to the entire world. When you
    install a local server, you usually do not expose it to anyone but yourself. That
    people won''t snoop around your work until you''re ready to expose it.

    * It''s easier to configure development environments with local servers to work
    with remote ones.

    * You don''t have to be connected to the Web while you work. This is especially
    important if you don''t have a high-speed connection.


    However, installing a Web server (and its related programs) is not as simple as
    installing commercial applications. There are a lot of varieties and things that
    can go wrong. However, with patience, you should be able to do it.


    You need several components to build your own PHP development system. PHP development
    is often done with either a system called LAMP (Linux, Apache, MySQL, and PHP)
    or WAMP (Windows, Apache, MySQL, and PHP).


    > > TRICK If you''re running Linux, there''s a good chance everything is already
    installed in your system and you need only configure and turn things on. For that
    reason, I''m presuming you''re working on a Windows XP system. Please look at
    the various Help documents that come with the software components for assistance
    installing with other operating systems.


    You need your system up and running, you need the following components:


    # A Web Server


    The Web server is software that allows a computer to host Web pages. The most
    popular Web server as of this writing is Apache, an open-source offering which
    runs on Windows, Linux, and just about every other operating system. The Web server
    lets you write and test programs running from your local computer exactly the
    same way they will be on the Internet.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# The PHP Environment


    The PHP environment is a series of programs and library files. These programs
    are unusual because the user never runs them directly. Instead, a user requests
    a PHP program from a Web server and the server calls upon PHP to process the instructions
    in the file. PHP then returns HTML code, which the user sees in the browser. This
    book was written using PHP 5.0, although most of the code works well on earlier
    versions of PHP.


    # A Database Environment


    Interacting with databases is one of PHP''s most powerful uses. For that reason,
    you need at least one database engine installed with your system. For this book,
    you use MySQL and SQLite. I cover the installation and use of these packages more
    fully in chapter 9, because you won''t need them until then.


    # An Editor


    Have some sort of editor to manipulate your code. You can use Notepad, but you
    probably want something substantial. A number of freeware and commercial PHP editors
    are available. For this book, I used emacs (a powerful UNIX-based text editor
    that can be somewhat mystifying for beginners) and Maguma Studio. The latter is
    a commercial editor with a very impressive free.


    # Installing Apache


    According to the industry-standard Netcraft (www.netcraft.com) survey, 67 percent
    of the world''s servers are running Apache as of March 2004. You might already
    have Microsoft''s Information Server (IIS) installed on your machine. If so, you
    can use it, but you have to read the documentation to see how to make IIS communicates
    with PHP. (The installation notes come with PHP explain how to run PHP on an IIS
    server).


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_28_0.png)


    > I know of several people who had good luck running PHP on the IIS server, but
    I''ve had problems. Things got especially messy when I tried to run both IIS and
    Apache on the same system. IIS tends to shut down Apache with little warning.
    If there''s not an urgent need to run IIS, I would stick with Apache on my PHP
    server. In my office, we actually run PHP on a Linux server and run IIS on Windows-based
    server.


    The Apache Web server is extremely stable and relatively easy to use once it''s
    installed. The code for this book was tested on Apache 1.3.23, 1.3.29, and 2.0.'
  merge: -1
  pgno: 28
