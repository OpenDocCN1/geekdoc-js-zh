    # Getting Data from the $distance Array


    Once data is stored in a two-dimensional array, it is reasonably easy to retrieve.
    To look up information in a table, you need to know the row and column. A two-dimensional
    array requires two indices—one for the row and one for the column.


    To find the distance from Tokyo (city number 2) to New York (city number 1), simply
    refer to $distance[2][1]. The code for the program gets the index values from
    the form:


    ```

    $result = $distance[$cityA][$cityB];

    ```


    This value is stored in the variable $result and then sent to the user.'
