    # Understanding Content Management Systems


    When the Web began, it was conceived as a web of interconnected documents. The
    ability to link any document to any other was powerful. However, as developers
    utilizing the Web, the freeform nature of the Internet caused headaches. In particular,
    it became somewhat challenging to manage a large system of related pages, to customize
    content for individual users, and to maintain consistency in a Web site that might
    contain hundreds or thousands of documents. Also, the nature of the Web began
    to change. Instead of simply being a repository of documents, the Web has become
    a series of interconnected applications. Much of the Web''s content is no longer
    stored in HTML pages, but is created dynamically by programs such as PHP.


    CMS has become a popular solution for creating a dynamic site that connects many
    HTML pages and serves them in a flexible, efficient manner.(Flexibility in this
    context means the site owner has a lot of options for determining the layout and
    content of the page.) A number of very free and commercial CMSs are based on PHP.
    CMSs frequently include such features like these:


    +   - User management. Users can log into the system. A CMS often has multiple
    user-access levels so some can add content and others can view content.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '+   Separation of content into blocks. Content can be grouped into semantic
    blocks based on its meaning. For example, rather than having arbitrary Web pages
    as the basic unit, you can organize news stories, Web links, and other elements
    into HTML pages.


    +   Isolation of layout from content. A CMS usually separates the system content
    from the layout. This is done for a number of reasons:


    +   The appearance of the entire site should be uniform, even if many people contribute
    content.


    +   Content developers shouldn''t have to worry about formatting or how to write
    HTML code.


    +   The layout should be adaptable to handle new designs or technologies.


    +   User-contributed content. Many CMS include the ability to support online forums
    and message boards. In addition, you can often grant write access so users add
    content to your site. For example, if you''re running a site for a church, you
    might allow the children''s pastor to directly add content to appropriate parts.
    You could control access, so people cannot access parts they should not change.
    You can even allow public access through message forums or automated content management
    based on individual preferences.


    # Working with PHP-Nuke


    PHP-Nuke is one of the most popular open-source CMSs. It uses PHP and MySQL to
    dynamically generate a Web portal (portal is another term for a customized system
    to be run as the starting place of a Web site). When you get to PHP-Nuke you notice
    how many sites run this system or what variant of it. Figure 8.3 illustrates a
    version of my Web site using PHP-Nuke.


    PHP-Nuke is an extremely capable CMS system. It supports all the features listed
    earlier, plus many more. If I log in as the administrator, I get a different display,
    giving me the opportunity to modify all kinds of options in the site, as shown
    in Figure 8.4.


    Any user with appropriate access (determined by the administrator) can alter content
    by adding new items, surveys, links, and other elements. Additionally, authorized
    users can change the site''s overall appearance by choosing a new theme, which
    could include new colors, fonts, icons, and layout. Figure 8.5 demonstrates the
    main page using a different theme.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# FIGURE 8.3


