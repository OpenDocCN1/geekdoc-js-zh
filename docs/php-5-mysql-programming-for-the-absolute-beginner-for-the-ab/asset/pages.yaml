- img_proc: true
  md: 'larger or the loop continues forever. In the basicLoop program, the part of
    the structure that makes this happen looks like $i++. The notation $i++ is just
    like adding one to $i or $i = $i + 1. The ++ symbol is called an increment operator
    because it provides an easy way to increment (add 1) to a variable.


    # Building the Loop


    Once you''ve set up the parts of the for statement, the loop itself is easy to
    use. Place braces (()) around your code and indent all code inside the loop. You
    can have as many lines of code as you wish inside a loop, including branching
    statements and other loops.


    The sentry variable has special behavior inside the loop. It begins with the initial
    value. Each time the loop repeats, it is changed as in the for structure, and
    the interpreter checks the condition to ensure it''s still true. If so, the code
    in the loop occurs again.


    In the case of the bookArray program, $i begins as 0. The first time the print
    statement occurs, it prints 0 because the current value of $i. When the interpreter
    reaches the right branch that ends the loop, it increments $i by 1 (following
    the $i++ directive in the for structure) and checks the condition ($i < 10).


    Because 0 is less than 10, the condition is true and the code inside the loop
    occurs again. Eventually, the value of $i becomes 10, so the condition ($i < 10)
    is no longer true. Program control then reverts to the next line of code after
    the end of the loop, which ends the program.


