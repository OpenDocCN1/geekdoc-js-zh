    but many file systems choke at spaces within filenames. I use the str_replace()
    function to replace all spaces in $quizName to underscore characters (_). Then
    I create a filename ending in .mas for the master file and another filename ending
    in .html for the actual quiz.


    To create the HTML file, I open it for write output. Then I use the buildHTML()
    function (described shortly) to build the HTML code, write that to the HTML file,
    and close the file. The master file is built pretty much the same way, except
    it calls the buildMas() function to create the appropriate text for the file.


    ```

