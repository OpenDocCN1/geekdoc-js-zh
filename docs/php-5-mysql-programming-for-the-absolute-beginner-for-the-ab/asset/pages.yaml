    Here''s the twist: Although the methods used inside the array look familiar, every
    single one is new! Recall that all the methods for building a page in SuperHTML
    work by adding content directly to some variable in memory. This is done to make
    the program more flexible, so it can be used to produce a result and save it to
    a file.


    When I''m building the array, I don''t want to actually add anything to the HTML
    document. Instead, I want to receive the results of the function so I can add
