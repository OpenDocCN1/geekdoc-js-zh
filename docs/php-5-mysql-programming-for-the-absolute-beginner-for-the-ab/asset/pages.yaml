  md: '# 234


    PHP 5 / MySQL Programming for the Absolute Beginner


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_256_0.png)


    # FIGURE 7.2


    I created this page with one title and then changed the title.


    When I created the SuperHTML object, the title property was automatically set
    to Basic Super Page. It''s possible to directly change the title, like this:


    ```

    $s->title = "new title";

