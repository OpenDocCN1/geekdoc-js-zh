- img_proc: true
  md: '# Reading Radio Groups


    CSS allows the developer to indicate sizes with a variety of measurements. This
    is an ideal place for a group of radio buttons because only one unit of measure
    is appropriate at a time. Even though there are four radio buttons on the borderDemo.html
    page with the name size, the PHP program will only see one $size variable. The
    value associated with whichever is selected becomes the value of $size variable.
    Note like option elements, it is possible for the value of a radio button to be
    different than the text displayed beside it.


    # DECIDING ON A FORM ELEMENT


    You might wonder if all these form elements are necessary, since they all boil
    down to a name and the value they make to the PHP interpreter. Various kinds of
    user interface elements make a difference in this way:


    +   - It''s easier (for many users) to use a mouse than to type. Whenever possible,
    it is nice to add lists, checks, and options so the user can navigate your forms
    more quickly. Typing is often slower than the kinds of input afforded by the other
    elements.

    - Interface elements (especially the drop-down list box) are extremely efficient
    in terms of screen space. You can pack a lot of choices on a small screen using
    drop-downs effectively. While you might not think space is an issue, take a look
    at how many people are surfing the Web with PDAs and cell phones.

    - Your life as a programmer is much easier if you can predict what it will send.
    When users type things, they make spelling and grammar mistakes, use odd abbreviations,
    and are just unpredictable. If you limit choices whenever possible, you are less
    likely to frustrate users.


    # Returning to the Story Program


    The Story program introduced at the beginning of this chapter is an opportunity
    to bring together all the new elements you learned. The program doesn''t introduce
    anything new, but it helps you see a larger context.


    # Designing the Story


    Even though this is not an especially difficult program to write, you run into
    problems if you simply open your text editor and start blasting away. It really
    pays to plan ahead. The most important thinking happens before you write a single
    line of code.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'In this situation, start by thinking about your story. You can write your own
    story or modify some existing text for humorous effect. I raided a nursery rhyme
    book for my story. Regardless of how you come up with it, have it in place before
    you start writing code. I wrote the original unmodified version of “Little Boy
    Blue” in my text editor first so I could admire its artistic genius—and mangle
    it beyond recognition.


    As you look over the original process, look for key words you can take out, and
    to find a description that hints at the original word without giving anything
    away. For example, I printed my story, circled the word blue in the original poem,
    and wrote color on another piece of paper. Keep doing until you''ve found several
    words you can take out of the original story. You should have a document with
    a bunch of holes in it, and a list of hints. Mine looked like Figure 2.15.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_69_0.png)


    Figure 2.15


    I thought through the story and the word list before writing any code.


    # IN THE REAL WORLD


    Figure 2.15 shows the plan written as a Word document. Although things sometimes
    do this way—especially in a professional programming environment), I wrote the
    plan on paper. I reproduced it in a cleaner format because you do not deserve
    to be subjected to my handwriting.


    I usually plan my programs on paper, chalkboard, or dry erase. I avoid planning
    programs on the computer, because it''s tempting to start programming immediately.
    It''s important to make your plan describe what you wish to do in English before
    you worry about how you''ll implement the plan. Most beginners (and a lot of pros)
    start programming too early, and get stuck as a result. You see, throughout the
    rest of this chapter, how this plan evolves into a working program.'
