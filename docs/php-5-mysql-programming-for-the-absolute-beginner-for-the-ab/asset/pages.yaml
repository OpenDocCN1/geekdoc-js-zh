    # Creating Multi-Line Strings


    You find yourself wanting to print several lines of HTML code at once. It can
    be very tedious to use quotation marks to indicate such strings (especially because
    HTML often uses the quotation mark symbol). PHP provides a special quoting mechanism,
    which is perfect for this type of situation. The following line begins asigning
    a value to the $verse variable:


    $verse = <<<HERE


    The <<<HERE indicates this is a special multi-line string that ends with the symbol
    HERE. You can use any phrase which, but I will use the word HERE because I think
    of the three less-symbols as up to. In other words, you can think of the following
    as meaning verse gets everything up to HERE.


    $verse = <<<HERE


    You can also think of <<<HERE as a special quote sign, which is ended with the
    value HERE.


    You can write any amount of text between <<<HERE and HERE. You can put variables
    inside the special text and PHP replaces the variable with its value, just like
    in ordinary (quoted) strings. The ending phrase (HERE) must be on a line by itself,
    and there must be no leading spaces in front of it.'
