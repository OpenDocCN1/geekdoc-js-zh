  md: '# Opening a File with fopen()


    The `fopen()` command opens a file. Note that you can create files on the Web
    server only—you cannot directly create a file on the client machine, because you
    do not have access to that machine''s file system. (If you did, any server-side
    program would be able to create viruses with ease.) However, as a server-side
    programmer, you already have the ability to create files on the server. The programs
    you are writing are files. Your programs can be free as if they are.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_209_0.png)


    The ownership of files created by your PHP programs can be a little complicated,
    depending on your operating system, server, and PHP configurations. Generally,
    any file you create is owned by a special user called PHP or by the account you
    were in when you wrote the program. This makes a difference in an operating system
    like UNIX, where ownership is a major part of the security mechanism. The best
    way to discover how this works is to write a program that creates a file and then
    look at its properties.


    The filename is the first parameter of the `fopen()` function. This filename can
    include directory information or it can be a relative reference starting from
    the current file''s location.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_209_1.png)


    Always test your programs, especially if they use a relative reference for a filename.
    It''s possible that your current directory is not the default directory. Also,
    the filename is based on the actual file server system, rather than the file''s
    URL.


    You can create a file on the server to which you have access. Your files can be
    in the parts of your directory open to the Web server (usually subdirectories
    of `public_html` or `htdocs`). Sometimes, though, you might not want your files
    to be directly accessible by typing a URL. You can control access to these files
    as:


    +   - Place outside the public HTML space.

    - Set permissions so that they can be read by you (and programs you create) but
    not by anyone else.


    # Creating a File Handle


    When you create a file with the `fopen()` command, the function returns an integer
    called a `file handle` (sometimes also called a `file pointer`). This special
    number refers to the file in subsequent commands. You aren''t usually concerned
    about this handle''s actual value, but need to store it in a variable (I will
    use `$fp`) so your other file-access commands know which file to work with.'
