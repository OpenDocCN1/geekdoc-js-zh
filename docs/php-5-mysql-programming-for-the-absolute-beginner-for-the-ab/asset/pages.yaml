    being in Lower Volta.) If you look closely, notice that I missed “sabotage.” It
    will be very difficult to find everywhere this word is misspelled and fix them
    all.


    # Problem with the Operation Information


    There''s another problem with this database. If for some reason Agent Rehab was
    dropped from the database (maybe she was a double agent all along), the information
    regarding Operation Raging Dandelion would be deleted along with her record, because
    the only place it is stored is a part of her record. The operation''s data somehow
    needs to be stored separately from the agent data.


    # Problems with Listed Fields


    The specialty field brings its own troubles to the database. This field can contain
    more than one entity, because spies should be able to do more than one thing.'
