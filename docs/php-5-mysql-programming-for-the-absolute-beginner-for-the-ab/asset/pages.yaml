  md: "next step. If it's a data definition command (the commands used to create and\
    \ modify tables) the result object usually contains the string related to the\
    \ operation's success or failure.\n\n# Getting Field Names\n\nI am printing the\
    \ data in an HTML table. I could create the table headings by hand, because I\
    \ know what all the fields are, but it's better to get the field information directly\
    \ from the query. You won't know which fields are being returned by a particular\
    \ query. The next chunk of code manages this task:\n\n```\nprint \"<table border\
    \ = 1\\n\"\n\n// get field names\nprint \"<tr>\\n\"\nwhile ($field = mysql_fetch_field($result))\
    \ {\n    print \"<td>{$field->name}</td>\\n\"\n} // end while\nprint \"</tr>\\\
    n\"\n```\n\nThe mysql_fetch_field() function executes a query result as one parameter.\
    \ It then fetches the next field and stores it in the $field variable. If no fields\
    \ are left in the result, the function returns the value FALSE. This allows the\
    \ field function to also be used as a conditional statement.\n\nThe $field variable\
    \ is actually an object. You built a custom object in chapter 7, \"Writing Programs\
    \ with Objects.\" The $field object in this case is much like an associative array.\
    \ It has a number properties (which can be thought of as field attributes). The\
    \ field object has a number of attributes, listed in Table 10.1.\n\n| Table 10.1\
    \ COMMONLY USED FIELD OBJECT PROPERTIES |\n| Property | Attribute |\n|---|-|\n\
    | max_length | Field length; especially important in VARCHAR fields |\n| Name\
    \ | The field name |\n| primary_key | TRUE if the field is a primary key |\n|\
    \ Table | Name of this field belongs to |\n| Type | This field's datatype |"
