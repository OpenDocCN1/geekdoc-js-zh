  md: '# 30


    # TRAP


    You might wonder why the $verse = <<<HERE line doesn''t have a semicolon after
    it. Although this is one line in the editor, it begins a multi-line structure.
    Technically, everything from that line to the end of the HERE; line is part of
    the same line, even though the code takes up several lines in the editor. Everything
    between<<<HERE and HERE is a string value.


    The semicolon doesn''t have any special meaning inside a string. At a minimum,
    you should know that a line beginning a multi-line quote doesn''t need a semi-colon,
    but the line at the end of quote quotes.


