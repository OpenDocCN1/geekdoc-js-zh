- img_proc: true
  md: 'The badWhile.php program shows what happens when you have an endless loop in
    your code. If you run this program, it may temporarily slow down your Web server.
    Be sure your server is configured to stop a PHP process when the user presses
    the stop button on the browser. (This is a default on most PHP instances.)


    The badWhile.php program has a subtle but deadly error. Look carefully at the
    source code and you will spot it. The code is just like the first while program,
    except instead of incrementing $i, I incremented $j. The variable $j has nothing
    to do with $i and $i never changes. The loop keeps going on forever, because it
    never decrements until $j is greater than or equal to 10, which never happens.
    This program is an example of the classic endless loop. Every programmer has alive
    with them accidentally, and you will too.


    Usually the culprit of an endless loop is a sloppy variable name, spelling, or
    capitalization. If you use a variable like $myCounter as the sentry variable but
    then increment $myCounter, PHP tracks two entirely different variables. Your program
    wont work correctly. This is another reason to be consistent with your naming
    and capitalization conventions.


    # Building a Well-Behaved Loop


    Fortunately, you have guidelines for building a loop that behaves as you wish.
    Even better, you''ve already learned most of the important ideas, because these
    fundamental concepts are built into the for your loop''s structure. When you write
    a loop, you are responsible for these three things:


    +   * Creating a sentry variable


    +   * Building a condition


    +   * Ensuring the loop can exit


    I discuss each of these ideas in the following sections.


    # Creating and Initializing a Sentry Variable


    If your loop is based on a variable''s value (there are alternatives), make sure
    you do these three things:


    +   * Identify that variable.


    +   * Ensure that variable has appropriate scope.


    +   * Make sure that variable has a reasonable starting value.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'You might also check value to ensure the loop runs at least one time (at least
    if that''s your intent). Creating a variable is much like the initialization stage
    of a for construct.


    # Building a Condition to Continue the Loop


    Your condition usually compares a variable and a value. Make sure you have a condition
    that can be met and be broken. The hard part is ensuring that the program gets
    out of the loop at the correct time. This condition is much like the condition
    in your loop.


    # Ensuring the Loop Can Exit


    There must be some trigger that changes the sentry variable so the loop can exit.
    This code must exist inside the code body. Be sure it is possible for the sentry
    variable to achieve the value necessary to exit the loop by the condition false.


    # Working with Basic Arrays


    Programming is about the combination of control structures (like loops) and data
    structures (like variables). You know the powerful looping structures. Now it''s
    time to look at a data structure that works naturally with loops.


    Arrays are special variables to hold lists of information. PHP makes it easy to
    work with arrays. Look at Figure 4.7, whose basic.php program demonstrates two
    arrays.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_129_0.png)


    FIGURE 4.7


    The information displayed on this page is stored in two array variables.'
