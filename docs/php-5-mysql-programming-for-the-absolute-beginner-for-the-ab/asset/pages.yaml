- img_proc: true
  md: 'This variable contains an object. Objects are complex variable types that can
    contain both variables and code. The SuperHTML object is a custom object I invented
    that describes a fancy kind of Web page. Since it''s an object, it has certain
    characteristics, properties and it has behaviors, called methods. By invoking
    its methods, you can do real things without a lot of work. Most of the objects
    are hidden in this particular example, but they''re still there. Notice that I
    created $s, I indicated a name for the page: Basic Super Page. That name will
    be used to form the title of the page as well as a caption.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_254_0.png)


    No doubt you recall my advice to use descriptive names for things. You might be
    composing an angry-e mail to me now about the variable $s: That''s not a descriptive
    name. However, I''m following a convention that''s reasonably common among object-oriented
    programmers. When I have one particular object I''m going to use a lot, I give
    it one-character name to keep the typing simple. If that bothers you, the global
    search and replace feature of your favorite text editor is a reasonable option.


    # Building the Web Page


    The Web page shown in Figure 7.1 has all the normal accrements, like <head> and
    <body> tags, <title>, and even a headline in <h1> format. However, you can see
    that the code doesn''t directly include any of these elements. Instead, it has
    two lines of PHP that both invoke the $s object.


    ```

    $->buildTop();

    $->buildBottom();

    ```


    Both buildTop() and buildBottom() are considered methods, which are simply functions
    associated with a particular object type. In effect, because $s is a SuperHTML
    object, it knows how to build the top and bottom of the Web page. The buildTop()
    generates the following HTML code automatically:


    ```

    <!doctype html "//W3C//DTD HTML 4.0 //EN">

    <html>

    <head>

    <title>Basic Super Page</title>

    </head>

    <body>

    <center>

    <h1>Basic Super Page</h1>

    </center>

    </html>

    ```'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'It''s not that amazing the function can generate all that HTML code; the code

    is fairly predictable. What''s neat is the way the SuperHTML object knew what
    its

    title and headline should be. The phrase Basic Super Page is the string that

    inicializes the SuperHTML object. The buildBottom() method is even easier than

    buildTop(), it simply adds some boilerplate page-ending:


    ```

    </body>

    </html>

    ```


    # Writing Out the Page


    The buildTop() and buildBottom() directives feel a lot like function calls, because

    they are very similar to the functions you''ve already created and used many

    times. However, these functions are designed to work within the context of a

    particular object. A function attached to an object is referred to as a method
    of the

    A. cow object might have moo() and giveMilk() methods.


    The syntax for referring to methods in PHP is with the arrow syntax (->). There
    isn''t

    one to indicate this operator. It is the combination of the dash and the greater-

    symbol.


    That neither buildTop() nor buildBottom() actually write any code to the

    screen. Instead, they prepare the page as a long string property inside the object.

    SuperHTML has a method called getPage() that returns the actual HTML code for
    the

    page. The programmer can then save the code to a file, print it out, or what-

    ever in this case, the following line simply prints out the results of the getPage()

    method:


    ```

    print $s->getPage();

    ```


    # Working with the Title Property


    It''s possible to designate a title when you create a SuperHTML object, but what

    you want to change the title later? Objects can store code in methods, and they

    can also store data in properties. A property is a variable attached to a par-

    ticular object. The SuperHTML object has a title property. The cow object might
    have

    b breed property and an age property. The Properties.php featured in Figure

    7.2 illustrates this feature.


    The Property.php program begins exactly like the Basic Super page you saw ear-

    lier. I even created the $s variable with the same initial value (Basic Super
    Page).


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_255_0.png)'
