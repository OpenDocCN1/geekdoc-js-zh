    # Summary


    You are rounding out your basic training as a programmer, adding rudimentary looping
    behavior to your bag of tricks. Your programs can repeat based on conditions you
    establish. You know how to build loops that work forwards, backwards, and by skipping
    values. You also know how to create while loops. You know the guidelines for creating
    a well-behaved loop and how to form arrays manually and with the array() directive.
    Stepping through all elements of an array using a loop is possible, and your program
    can keep track of persistent variables by storing them in fields in your output
    pages. You put all these skills together to build an interesting game. In chapter
    5 you extend your ability to work with arrays and loops by building more powerful
    arrays and using specialized looping structures.'
