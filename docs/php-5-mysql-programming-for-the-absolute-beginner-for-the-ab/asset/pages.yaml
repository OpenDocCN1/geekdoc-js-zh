  md: '# Exploring Comparison Operators


    Equality (==) is not the only type of comparison PHP allows. You can compare a
    variable and a value or two variables using a number of comparison operators.
    Table 3.1 describes comparison operators.


    Table 3.1 Comparison Operators

    | Operator | Description |

    | -- | equal to |

    | < | less than |

    | > | greater than |

    | <= | less than or equal to |

    | >= | greater than or equal to |

    | != | not equal to |


    This comparison operators work on any type of data, although the results might
    be a little strange when you use these mathematical operators on non-numeric data.
    For example, if you have a condition like the following, you get the result true:


    "a" < "b"


    You get that result because alphabetically, the letter a is earlier than b, so
    it has a "smaller" value.


    # Creating an if Statement


    An if statement begins with the keyword if followed by a condition inside parentheses.
    After the parenthesis is a left brace: {. You can put many lines of code between
    the left brace and right brace as wish. Any code between the braces is executed
    only if the condition is true. If the condition is false, program control flows
    to the next line after the right brace.


    It is not necessary to put a semicolon on a line ending with a brace. It is customary
    to indent all the code between the left and right braces.'
  merge: -1
  pgno: 84
- img_proc: true
  md: "# CODE STYLE\n\nThe PHP processor ignores the spaces and carriage returns in\
    \ your PHP code, you might wonder if it matters to pay such attention to how code\
    \ is indented, where the braces go, and so on. While the PHP processor does not\
    \ care how you format your code, human readers do not. Programmers have passionate\
    \ arguments about how you should format your code.\n\nIf writing code with a group\
    \ (for instance, in a large project or for a class), you are usually given a style\
    \ guide you are expected to follow. When working on your own, the specific style\
    \ you adopt is not as important as being consistent in your code. The particular\
    \ stylistic conventions I adopted for this book are reasonably common, relatively\
    \ readable, and easily adapted to a number of languages.\n\nIf you don't have\
    \ your own programming style, the one in this book is a good starting place. However,\
    \ if your team leader or teacher requires another style, adapt to it. Regardless\
    \ of the style guidelines you use, it makes sense to indent your code, place comments\
    \ liberally throughout your program, and use whitespace to make your programs\
    \ easier to read and debug.\n\n![](img/ce4ca26587e04437774a2c81d16dfb4a_85_0.png)\n\
    \nTRAP Do not put a semicolon at the end of the if line. The following code prints\
    \ \"we must be near a black hole.\"\nif (\"*day\") == \"night\") { \n print \"\
    we must be near a black hole\";\n // end if\n\nWhen the processor sees the semicolon\
    \ following \"*day\" == \"night\", it thinks there is no code to evaluate if the\
    \ condition is true. The condition is effectively ignored. Essentially, the braces\
    \ indicate that an entire group of lines are to be treated as one structure, and\
    \ that structure is part of the current logic line.\n\n# Working with Negative\
    \ Results\n\nThe Ace program shows how to write code that handles a condition.\
    \ Much of the time, you want the program to do one thing if the condition is true,\
    \ and something else if it's false. Most languages include a special variant of\
    \ the statement to handle exactly this type of contingency."
  merge: -1
