  md: "By far the most common use of the field object is determining the name of all\
    \ the fields in a query. The other attributes can be useful in certain situations.\
    \ You can see the complete list of attributes in MySQL Help that shipped with\
    \ your copy of MySQL or online at http://www.mysql.com.\n\nYou use object-oriented\
    \ syntax to refer to an object's properties. Notice that I printed $field->name\
    \ to the HTML table. This syntax simply refers to the property of the field object.\
    \ Now it's reasonably accurate to think of it as a fancy associative array.\n\n\
    # Parsing the Result Set\n\nThe rest of the code examines the result set. Refresh\
    \ your memory:\n\n```\n// row data as an associative array\nwhile ($row = mysql_fetch_assoc($result))\
    \ {\n    print \"<tr>\\n\";\n    // look at each field\n    foreach ($row as $col=$val)\
    \ {\n        print \"<td>$val</td>\\n\";\n    } // end foreach\n    print \"</tr>\\\
    n\";\n} // end while\n```\n\nThe mysql_fetch_assoc() function fetches the next\
    \ row from a result set. It requires a pointer as its parameter, and it returns\
    \ an associative array.\n\n> A number of related functions are available for pulling\
    \ a row from a result. mysql_fetch_object() stores a row as an object, much like\
    \ the mysql_fetch_fields() function does. The mysql_fetch_array() function fetches\
    \ an array that can be treated as a normal array, or both. I tend to use mysql_fetch_assoc()\
    \ because it's the most straight-forward approach for those unfamiliar with object-oriented\
    \ syntax. Of course, you should feel free to investigate these other functions\
    \ and use them if they make more sense to you.\n\nIf no rows are left in the result\
    \ set, mysql_fetch_assoc() returns the value FALSE. The mysql_fetch_assoc() function\
    \ call is often used as a condition in a while loop (as I did to fetch each row\
    \ in a result set). Each row represents a row of the eventual HTML table, so I\
    \ print the HTML code to start a new row inside the while loop."
