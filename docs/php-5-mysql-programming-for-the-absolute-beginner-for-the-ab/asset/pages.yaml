    # Sending Data without a Form


    It can be very hard to send data to a server-side program without using a form.
    This little-known trick can enhance your Web pages without requiring a lift of
    PHP programming. The Link Demo page (linkDemo.html) shown in Figures 2.9 and 2.10
    illustrate this phenomenon.


    # Understanding the get Method


    All the links in the linkDemo.html page use a similar trick. As you recall from
    earlier in the chapter, form data can be sent to a program through two different
    methods. The post method is the technique usually in your forms, but you''ve been
    using the get method all along, because normal HTML requests are actually get
    requests. The interesting thing is that you can send data to any program that
    knows how to read get requests by embedding the request in your URL.'
