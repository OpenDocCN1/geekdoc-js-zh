  md: '# Introduction


    Computer programming has often been seen as a difficult and arcane skill. Programming
    languages are difficult and complicated, out of the typical person''s reach. However,
    the advent of the World Wide Web has changed that to some extent. It''s reasonably
    easy to build and post a Web page for the entire world to see. The language of
    the Web is reasonably simple, and numerous applications are available to assist
    in the preparation of static pages. At some point, every Web author begins to
    dream of pages that actually do something useful. The simple HTML language that
    builds a page offers the tantalizing ability to build forms, but no way to work
    with the information that users type into these forms.


    Often, a developer has a database or some other dynamic information they wish
    to somehow attach to a Web page. Even languages such as JavaScript are not satisfying
    in these cases. The CGI interface was designed as an early solution to this problem,
    CGI itself can be confusing and the languages used with CGI (especially Perl)
    are very powerful, but confusing to beginners.


    PHP is an amazing language. It is meant to work with Web servers, where it can
    do the critical work of file management and database access. It is reasonably
    easy to learn and understand, and can be embedded into Web pages. It is as powerful
    as more-difficult languages, with a number of impressive extensions that add new
    features to the language.


    In this book, I teach you to write computer programs. I do not expect you to have
    any previous programming experience. You learn to program using the PHP language.
    Although PHP itself is a very specialized language (designed to enhance Web pages),
    the concepts you learn this language can be extended to a number of other programming
    environments.


    Whenever possible, I use games as example programs. Each chapter begins by demonstrating
    a simple game or diversion. I show you all the skills you need to write that game
    through a series of simple example programs. At the end of the chapter I show
    the game again, this by looking at the code, which at that point you will understand.
    Games are motivating and often present special challenges to the programmer. The
    concepts presented are just as applicable in real-world applications.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'This second edition adds new features and includes updates from the previous
    edition of the book. Specifically, it includes new chapters on object-oriented
    programming (OOP) and XML, as well as examples on using PHP to create content
    management systems. I''ve updated the code to reflect improvements in PHP 5.0,
    including the improved object model and XML tools, and the new SQLite data access
    tools.


    Programming is not a skill you can learn simply by reading about it. You have
    to write code to really understand what''s going on. I encourage you to play along
    at home. Look at the code on the accompanying CD. Run the programs yourself. Try
    to modify the code and see how it works. Make new variations of the programs to
    suit your own needs.'
  merge: -1
  pgno: 22
