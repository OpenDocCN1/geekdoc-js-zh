    # Using the switch Structure


    The switch structure is optimal when you have one variable to compare against
    a number of possible values. Use the switch keyword followed, by parentheses,
    by the name of the variable you wish to evaluate. A set of braces indicates that
    the next block of code focuses on evaluating this variable''s possible values.


    For each possible value, use the case statement, followed by the value, followed
    by a colon. End each case with a break statement, which indicates the program
    should stop thinking about this particular case and get ready for the next one.


    > The use of the break statement is probably the trickiest part of the switch
    statement—especially if you are familiar with a language like Visual Basic, which
    does not require such a construct. It''s important to add the break statement
    to the end of each case, or the program simply "falls through" to the next possible
    value, even if that value would not otherwise evaluate to true. As a beginner,
    you should always place the break statement at the end of each case.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_93_0.png)


    The last case, which works just like the else case of the multi-value if statement,
    is called default. It defines code to execute if none of the other cases is active;
    it''s smart to test for a default case even if you think it is impossible for
    the computer to get to this default option. Crazy things happen. It''s good to
    be prepared for them.


    # Combining a Form and Its Results


    Most of your PHP programs up to now have two distinct files. An HTML file has
    a form, which calls a PHP program. It can be tedious to keep track of two separate
    files. Use the if statement to combine functions into one


    The User program shown in Figures 3.10 and 3.11 looks much like its counterpart
    in chapter 2, "Using Variables and Input," but it has an important difference.
    Rather than being an HTML page and a separate PHP program, the entire program
    resides in one file on the server.'
