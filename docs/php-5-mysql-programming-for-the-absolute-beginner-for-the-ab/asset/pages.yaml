- img_proc: true
  md: 'Once viewQuery.php connects to the library, it uses functions in the library
    to connect to the database and print desired results. The qToTable() function
    does most of the actual work, taking whatever query is passed to it and generating
    a table with add, delete, and edit buttons.


    # WHY STORE QUERIES IN THE DATABASE?


    You might wonder why I chose to store queries in the database. After all, I could
    have let the user type in a query directly or provided some form that allows the
    user to search for values. Each of these approaches has advantages, but they also
    pose some risks. It''s very dangerous to allow direct access to your data from
    a Web form. Malicious users can introduce Trojan horse commands that snnoop on
    your data, change data, or even delete information from the database.


    I sometimes build a form that has enough information to create an SQL query and
    then build query in a client-side form (Sounds like a good end-of-chapter exercise,
    right?). In this case, I stored queries in another table. People with administrative
    access can add new queries to the database, but ordinary users do not preload
    the storedQuery database with a number of useful queries, then added the capacity
    to add new queries whenever the situation demands it. Drawbacks remain (primarily
    that ordinary users cannot build custom queries), but it is more secure than a
    system that builds query based on user input.


    The str_replace() function is necessary because SQL queries contain single quotation
    ('''') characters. When I store a query as a VARCHAR entity, the single quotation
    marks embedded in the query problem. The normal solution to this problem is to
    use a backslash, which indicates that the mark should not be immediately interpreted,
    but should be considered part of the data. The problem with this backslash is
    still in the string when I try to execute the query. The str_replace() function
    replaces all instances of \ with a simple quote ('''').


    Note that the qToTable() function doesn''t actually print anything to the screen.
    All it does is build a complex string of HTML code. The viewQuery.php program
    prints the code to the screen.


    If you are using a library, it''s best if the library code doesn''t print anything
    directly to the screen. Instead, it should return a value to whatever query called
    it. This allows multiple uses for the data. For example, if the qToTable() function
    printed directly to the screen, you could not use it to generate a file. Since
    the library code returns a value but doesn''t actually do anything with that,
    the function has the freedom to use the results in multiple ways.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_422_0.png)'
