- img_proc: true
  md: '# Customizing PHP-Nuke


    PHP-Nuke installs with a large number of themes and a huge number of options.
    Play around with your site quite a bit to get everything working the way you want.
    You''ll still probably make a few changes. As a minimum, you might want to replace
    some item icons or buttons with custom images. The easiest way to do this is to
    modify an existing theme:


    +   1. Log in as the administrator by going to the admin.php page in your system.

    2. Find the preferences option on this site.

    3. Browse through the themes until you find one you want to use as your starting
    point.

    4. Go to your file manager and find the appropriate theme''s folder.

    5. In the default installation, look at your PHP-Nuke subdirectory; find the themes
    under html/themes/.

    Each theme has its own subdirectory.

    6. Duplicate the directory of the theme you want to work with and rename the folder
    to make the new theme.

    7. Go to the theme folder and open theme.php.

    8. Search and replace any references to the old theme name with your new theme.


    Now you can edit any of the HTML files or images in the theme directory to customize
    your theme. For example, the blocks.html page controls how a section of the menu
    on the left side of the screen looks. If you load blocks.html by itself, it might
    look like Figure 8.6.


    If you look at code block.html, it might look like this:

    color="#FFFF00"


    ```

    <table border="0" cellpadding="0" cellspacing="0" bgcolor="#FFFF00"

    width="100%"><tr><td align="left">

    <font class="block-title"><b>$title</b>/b></font>

    <td></td></tr></table>

    <table border="0" cellpadding="0" cellspacing="0" bgcolor="#ffffff"

    width="140">

    <tr valign="top"><td bgcolor="#ffffff">

    $content

    </td>\</tr>

    </table>

    <br>

    ```'
