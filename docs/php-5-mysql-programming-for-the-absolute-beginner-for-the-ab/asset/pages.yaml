    WHERE transportation LIKE ''%B%%''

    AND power LIKE ''%super%%'';

    ```


    Creating compound expressions is very useful as you build more-complex data-bases
    with multiple tables.


    # Sorting Results with the ORDER BY Clause


    One more might SELECT statement feature is the ability to sort results by any
    field. Figures 9.22 and 9.23 illustrate how the ORDER BY clause can determine
    how tables are sorted.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_349_0.png)


    Figure 9.22


    This query shows the entire database sorted by the weapon name. in descending
    order.


    The ORDER BY clause allows you to determine how the data is sorted. You can specify
    any field you wish as the sorting field. As you can see in Figure 9.23, the DESC
    clause specifies data that should be sorted in descending order.


    # Changing Data with the UPDATE Statement


    You can use SQL to modify the data in a database. The key to this behavior is
    the UPDATE statement. An example helps it make sense:


    ```

    UPDATE hero

    SET power = ''Super Electric Toe''

    WHERE name = ''Lightning Guardian'';",

    ```'
