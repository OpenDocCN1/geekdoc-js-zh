    $s->buildList($myArray, "ol");

    ```


    The SuperHTML object responds by adding the following code to its internal representation
    of the page:


    ```

    <ol>

    <li>alpha</li>

    <li>beta</li>

    <li>gamma</li>

    <li>delta</li>

    </ol>

    ```


    As you can see, each array item is enclosed in <li></li> tags, and the entire
