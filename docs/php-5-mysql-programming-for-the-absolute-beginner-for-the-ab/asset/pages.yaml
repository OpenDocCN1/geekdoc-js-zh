  md: '# Inserting Values


    Once you''ve created a table, you can begin adding data to it. The INSERT command
    is the primary tool for adding records.


    INSERT INTO phoneList

    VALUES (

    0, ''Andy'', ''Harris'', ''aharris@cs.iupui.edu'', ''123-4567''

    );


    The INSERT statement allows you to add a record into a database. The values must
    be listed in exactly the same order the fields were defined. Each value is separated
    by a comma, and VARCHAR and CHAR values must be enclosed in single quotes.


    If you have a large amount of data to load, you can use the LOAD DATA command.
    This command accepts a tab-delimited text file with one record per record and
    fields separated by tabs. It loads that entire file into the database. This is
    often the fastest way to load a database with test data. The following line data
    from a file called addresses.txt into the phoneList table:


    ```

    LOAD DATA LOCAL INFILE "addresses.txt" INTO TABLE phoneList;

    ```


    Figure 9.7 shows the MySQL tool after I have added one record to the table.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_333_0.png)


    Figure 9.6

    This is the command-line tool after I created the phoneList table.'
