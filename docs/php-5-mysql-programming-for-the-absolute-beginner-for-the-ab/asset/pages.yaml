  md: "# Introducing the foreach.php Program\n\nThe program shown in Figure 5.4 illustrates\
    \ how the foreach loop works.\n\n![](img/ce4ca26587e04437774a2c81d16dfb4a_158_0.png)\n\
    \nFIGURE 5.4\n\nAlthough it looks just like normal HTML, this page was created\
