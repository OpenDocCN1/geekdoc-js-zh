  md: "# Building a Getter Method to Retrieve Property Values\n\nIt's also good to\
    \ have methods that return property values. These methods are all called getter\
    \ methods, and they are usually very straightforward, such as this one:\n\n```\n\
    function getName() {\n    return $this->name;\n} // getName()\n```\n\nThe getName()\
    \ method simply returns the value of the appropriate property. This is useful\
    \ because you might have different ways of returning the same value. Sometimes\
    \ you might have a getter for a property that doesn't actually exist! For example,\
    \ if you were creating a circle, it might have setRadius(), getArea(), and getCircumference()\
    \ methods. The user should be able to read and write the circle's radius and area.\
    \ These values aren't actually stored in the class, because they are derived from\
    \ the radius. The programmer doesn't have to know or care about this, but simply\
    \ knows that some properties are read/write and some are read only.\n\n# Using\
    \ Access Methods to Manipulate Properties\n\nWith getter and setter methods in\
    \ place, it's easy to manipulate an object's properties.\n\n```\n//make an instance\
    \ of the critter\n$theCritter = new Critter();\n```\n\n```\n// print original\
    \ name\nprint \"Initial name: \" . $theCritter->getName() . \"<br>\\n\";\n\n//\
    \ print changing name...<br>\\n\n$theCritter->setName(\"Melville\");\nprint \"\
    New name: \" . $theCritter->getName() . \"<br>\\n\";\n```\n\nAnytime I want to\
    \ change the name, I invoke the setName() method. To retrieve the name, I use\
    \ the getName() method.\n\n> TRICKnNote that the terms get and set make sense\
    \ in the context of the programmer using the class, not the programmer designing\
    \ the class. The target audience for objects is programmers rather than the general\
    \ public. You're writing code to make a programmer's job easier.\n\n![](img/ce4ca26587e04437774a2c81d16dfb4a_278_0.png)"
  merge: -1
