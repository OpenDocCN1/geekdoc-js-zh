    # Installing PHP-Nuke


    A copy of PHP-Nuke is included on the CD that accompanies this book. You might
    also go directly to the PHP-Nuke Web page (http://phppnuke.org) and ensure you
    have the latest version of the software. PHP-Nuke is written entirely in PHP and
    MySQL, so it doesn''t matter which operating system you use.


    > TRAP

    Be sure to install the files in a subdirectory of your Web server''s root directory
    (usually hdocs).


    PHP-Nuke relies heavily on a series of MySQL tables. (My installation has 92 tables
    devoted to PHP-Nuke.) Fortunately, you don''t have to install these tables by
    hand. All the necessary code is in an MySQL script called nuke.sql and is included
    with PHP-Nuke. Use the MySQL console or phpMyAdmin to run the script. You learn
    more about how to use these tools in chapter 9, "Using MySQL to Create Databases."
    For now, you can simply follow the instructions in the readme file that accompanies
    PHP-Nuke.


    > TRAP

    You might have to edit the SQL script to change the username, add your password,
    or create data tables according to some other scheme. As usual, work with a copy
    just in case something goes wrong.


    The installation instructions that come with PHP-Nuke; they explain how to set
    up and test your system.'
