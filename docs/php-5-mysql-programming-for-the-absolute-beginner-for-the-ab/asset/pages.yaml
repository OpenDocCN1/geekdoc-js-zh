- img_proc: true
  md: "The values in the list are created in the $list variable using the array function.\n\
    The foreach loop works a lot like a for loop, except it is a bit simpler. The\
    \ first parameter of the foreach construct is an array—in this case, $list. The\
    \ keyword indicates the name of a variable that holds each value in turn. In this\
    \ case, the foreach loop steps through the $list array as many times as necessary.\
    \ Each time through the loop, the function populates the $value variable with\
    \ the current member of the $list array. In essence, this foreach loop works just\
    \ like the following traditional for loop:\n\n```\nforeach($list as $value) {\n\
    \    print \"<li>$value</li>\\n\";\n} // end foreach\n```\n\nHere's your traditional\
    \ for loop:\n($i = 0; $i < length($list); $i++) {\n    $value = $list[$i];\n \
    \   print \"<li>$value</li>\\n\";\n} // end loop\n\n> The main difference between\
    \ a foreach loop and a for loop is the presence of the index variable ($i in this\
    \ example). If you're using a foreach loop and need to know the current element's\
    \ index, use the key() function.\n\nThe foreach loop can be an extremely handy\
    \ shortcut for stepping through each value of an array. Since this is a common\
    \ task, knowing how to use the foreach loop is an important skill. As you learn\
    \ some other kinds of arrays, you see how to modify the foreach loop to handle\
    \ these other array styles.\n\n# Creating an Associative Array\n\nPHP is known\
    \ for its extremely flexible arrays. You can easily generate a number of interesting\
    \ and useful array types in addition to the ordinary arrays you've already made.\
    \ One of the handiest types is called an associative array.\n\nWhile it sounds\
    \ complicated, an associative array is much like a normal array. While regular\
    \ arrays rely on numeric indices, an associative array has a string index. Figure\
    \ 5.5 shows a page created with two associative arrays.\n\n![](img/ce4ca26587e04437774a2c81d16dfb4a_159_0.png)"
