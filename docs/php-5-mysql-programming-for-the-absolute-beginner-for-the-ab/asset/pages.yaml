    # More-Powerful Queries


    So far the tables you''ve created haven''t been as powerful than HTML tables and
    they''re a lot more trouble. The excitement of databases comes when you use the
    information to solve problems. Ironically, the most important part of database
    work isn''t getting the data, but filtering the data in order to solve some sort
    of problem.'
