  md: 'All the fields sent to your program are automatically stored in a special associative
    array called $_REQUEST. Each field name on the original form becomes a key, and
    the value of that field becomes the value associated with that key. If you have
    a form with a field called userName, you can get the value of the field by calling
    $_REQUEST["userName\].


    The $_REQUEST array is also useful because you can use a foreach loop to quickly
    determine the names and values of all form elements known to the program. The
    formReader.php program source illustrates how this is done:


    ```

    <!doctype html public "-//W3C//DTD HTML 4.0 //EN">

    <html>

    <head>

    <title>Form Reader</title>

    </head>

    <body>

    <h1>Form Reader/</h1>

    <h3>Here are the fields I found on the form/</h3>

    <?

    print <<<HERE

    <table border = 1>

    <tr>

    <th>Field</th>

    <th>Value</th>

    </tr>

    HERE;


    foreach ($_REQUEST as $field => $value) {

    print <<<HERE

    <tr>

    <td>$field</td>

    <td>$value</td>

    </tr>

    HERE;

    } // end foreach

    print "</table>\n";

    ?>

    </body>

    </html></html>

    ```


    # Chapter 5

    Better Arrays and String Handling'
