- img_proc: true
  md: '# Limiting Rows with the WHERE Clause


    In addition to limiting the columns returned in a query, you may be interested
    in limiting the number of rows. For example, you might run across an evil villain
    who can only be defeated by a laser pointer. The query shown in 9.21 illustrates
    a query that solves exactly this dilemma.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_347_0.png)


    If you know how to set up the query, you can get very specific results. In this
    case, the query selects only those heroes with a laser pointer.


    This code returns only the rows matching a specific condition:


    ```

    SELECT *

    FROM hero

    WHERE weapon = ''Laser Pointer'';

    ```


    # Adding a Condition with a WHERE Clause


    A WHERE statement in a query specifies which row(s) you want to see. This clause
    allows you to specify a condition. The database manager checks every record in
    the table. If the condition is TRUE for that record, it is included in the result
    set. The conditions in a WHERE clause are similar to those in PHP code, but they
    are not exactly the same. Use these symbols in SQL:


    +   * Equality using the single sign (=).

    * Enclose text elements in single quotation marks ('''').

    * Use <, >, <= or >= and != conditions to limit your search.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# 326


    Comparison operators are easy to understand for numeric data, such as integers
    and real numbers. It''s not quite obvious how a language will treat text comparisons.
    SQL has developed some standard rules, but each implementation might be somewhat
    different. SQL generally works in a case-insensitive way, so Yak-Bot would match
    yak-bot or yAK-BOT. Also, the < and > operators refer to alphabetic order, the
    following selects all the records where the hero''s name starts with A, B, or
    C.


    ```

    SELECT *

    FROM hero

    WHERE name < ''D'';

    ```


    # ## Using the LIKE Clause for Partial Matches


    Often you do not know the exact value of a field you are trying to match. The
    LIKE clause allows you to specify partial matches. For example, which heroes have
    some sort of super power? This query returns each hero whose power begins with
    the value Super:


    ```

    SELECT *

    FROM hero

    WHERE power LIKE ''Super%'';

    ```


    The percent sign (%) can be a wild card, which indicates any character, any number
    of times. You can use a variation of the LIKE clause to find information about
    all heroes with a transportation scheme that starts with the letter B:


    ```

    SELECT name, transportation

    FROM hero

    WHERE transportation LIKE ''B%'';

    ```


    You can also use the underscore (_) to specify one character.


    > The simple wildcard support in SQL is sufficient for many purposes. If you like
    expressions, use the REGEXP clause to specify whether a field matches a regular
    expression. This is a very powerful tool, but it is an extension to the SQL standard.
    It works fine in MySQL, but it is not supported in all SQL databases.


    # ## Generating Multiple Conditions


    You can combine conditions with AND, OR, and NOT keywords for more-complex expressions.
    For example, the following code selects heroes whose transportation starts with
    B and who have a power with super in its name.'
