  md: '# Writing to a File


    The saveSonnet program opens the sonnet76.txt file for write access. If there
    were already a file in the current directory, it is destroyed. The $fp variable
    stores the file pointer for the text file. Once this is done, you can use the
    fputs() function to actually write data to the file.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_211_0.png)


    You might be noticing a trend here. Most of the access functions begin with the
    letter f: fopen(), fclose(), fputs(), gets(), feof(). This convention is inherited
    from the C language. It can help you remember that a particular function works
    with f. Of course, every statement in PHP with f isn''t necessarily a file function
    (foreach is a good example), but most function names in PHP that begin with f
    are file-handling commands.


    The fputs() function requires two parameters. The first is a file pointer, which
    tells PHP where to write the data. The second parameter is the text to write out
    to the file.


    # Closing a File


    The fclose() function tells the system that your program is done working with
    the file and should close it.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_211_1.png)


    > Drive systems are much slower than computer memory and take a long time to spool
    up to speed. For that reason, when a program encounters an fputs() command, it
    doesn''t always immediately save the data to a file on the disk. Instead, it adds
    the data to a special buffer and writes the data only when a sufficient amount
    is on the buffer or the program encounters an fclose() statement. This is why
    it''s important to close your files. If the program ends without encountering
    an fclose() statement, PHP is supposed to automatically close the file for you,
    but what''s supposed to happen and what actually happens are often two very different
    things.


    # Loading a File from the Drive System


    You can retrieve information from the file system. If you open a file with the
    "r" access modifier, you can read information from the file.


    # Introducing the loadSonnet.php Program


    The loadSonnet.php program, shown in Figure 6.6 loads the sonnet saved by saveSonnet.php
    and displays it as it fits the work of the Bard.'
