  md: "The method uses a foreach() loop to step through each element in the array\
    \ and then adds an <li></li> pair around the element. As usual, the function's\
    \ g version returns this value to the programmer, and the other version adds it\
    \ to $Page.\n\n```\nfunction buildList($array, $type = \"ul\") {\n    //given\
    \ an array of values, builds a list based on that array\n    $temp = \"$type \\\
    n\";n    foreach ($array as $value) {\n        $temp .= \" <li>$value</li> \\\
    n\";\n    } // endforeach\n    $temp .= \"</$type> \\n\";\n    return $temp;\n\
    } // end buildList\n```\n\n```\nfunction buildList($array, $type = \"ul\") {\n\
    \    $temp = $this->buildList($array, $type);\n    $this->addText($temp);\n} //\
    \ end buildList\n```\n\n# Creating Tables from 2-Dimension Arrays\n\nThe buildTable()\
    \ methods work much like the buildList() methods. The gbuildTable() code begins\
    \ by printing the table header. It creates a foreach loop to handle the rows.\
    \ Inside the loop it adds the <tr> tag and opens a second loop to handle the data\
    \ array representing each of the row's cells. Data is encoded in <td><td></td>\
    \ tags and added to the temporary variable. At the end of the cell loop it is\
    \ the end of a row, so the </tr> tag is added to the temporary variable. By the\
    \ time both loops are finished, the function provided an HTML table with decent\
    \ formatting.\n\n```\nfunction buildTable($array) {\n    //given a 2D array, builds\
    \ an HTML table based on that array\n    $table = \"<table> \\n\";\n    foreach\
