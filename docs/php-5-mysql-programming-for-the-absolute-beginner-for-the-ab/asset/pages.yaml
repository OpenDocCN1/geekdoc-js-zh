  md: "The game board is re-created several times during one program execution.\n\
    I needed a function that could initialize the game board or reset it easily.\n\
    Theame board is stored in a two-dimensional array called board. When the board\
    \ is \"empty\", each cell contains the period (.) character. I chose this vention\
    \ because it gives me something visible in each cell and provides a character\
    \ that represents an empty cell. The clearBoard() function sets or resets the\
    \ board array so that every cell contains a period.\n\n```\nfunction clearBoard(){\n\
    \  //initialize board with a . in each cell\n  global board, boardData;\n\n  for\
    \ (row = 0; row < boardData[\"height\"]; row++){\n    for (col = 0; col < boardData[\"\
    width\"]; col++) {\n      board[row][col] = \".\";\n    }\n    } // end col loop\n\
    \  } // end row for loop\n} // end clearBoard\n```\n\nThis code is the classic\
    \ nested for loop common to two-dimensional arrays. Note that I used for loops\
    \ rather than foreach loops because I was interested in the loop indices. The\
    \ other for loop steps through the rows. Inside each row loop, another loop steps\
    \ through each column. I assigned the value \".\" to the board array at the current\
    \ $row and $col locations. Eventually, \".* is in every cell in the array.\n\n\
    > I determined the size of the loops by referring to the boardData associative\
    \ array. Although I could have done this in many ways, I chose the associative\
    \ array for several reasons. The most important is clarity. It is easy for me\
    \ to see by this structure that I'm working with the height and width related\
    \ to board. Another advantage in this context is convenience. Since the height,\
    \ width, and board name are stored in the boardData array, I could make a global\
    \ reference to the boardData variable and all its values would come along. It's\
    \ like having three variables for the price of one.\n\n# Filling the Board\n\n\
    Of course, the purpose of clearing the board is to fill it in with the words from\
    \ the word list. This happens in two stages: filling the board, and adding the\
    \ words. The fillBoard() function controls the entire process of filling up the\
    \ whole board, but the details of adding each word to the board are delegated\
    \ to the addUser() function (which you see next)."
