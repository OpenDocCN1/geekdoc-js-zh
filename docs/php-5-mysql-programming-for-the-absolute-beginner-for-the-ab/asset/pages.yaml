  md: '# CHAPTER


    # # Writing Programs with Objects


    Object-oriented programming (sometimes abbreviated as OOP) is an important development
    in programming languages. Some languages such as Java are entirely object oriented
    and require an intimate understanding of the object-oriented paradigm. PHP, in
    keeping with its easygoing nature, supports a form of object-oriented programming,
    but does not require it. In this chapter you learn what objects are and how to
    build them in PHP. Specifically, you learn how to:


    +   - Use a custom class to enhanced Web pages

    - Design a basic class of your own

    - Build an instance of a class

    - Leverage inheritance, encapsulation, and polymorphism

    - Create properties and methods in your classes'
  merge: -1
  pgno: 251
- img_proc: true
  md: "# Introducing the SuperHTML Object\n\nBack when I used to program in Perl (before\
    \ PHP existed), I really liked a feature cgi.pm. This was a module that simplified\
    \ server-based programming. One of my favorite things about the module was the\
    \ way it allowed you to quickly build Web pages with function calls. Once I understood\
    \ how to use cgi.pm, I was creating Web pages with unbelievable speed and ease.\
    \ PHP doesn't have this feature built in, so I decided to make a similar object\
    \ myself using the object-oriented paradigm. Throughout this chapter you see the\
    \ object being used, then you'll learn how to build and modify it for your purposes.\n\
    \nAs you look at the SuperHTML object, you should think of it as having two levels:\n\
    \n+   - First, ignore the inner workings of the object and learn how to use it.\n\
    \  There's a lot to this class, and it has a lot of potential to improve your\
    \ PHP programming.\n- Second, examine how it was built. This comes after you've\
    \ played with the object for a while. There's no doubt you'll have some ideas\
    \ on how to improve it. Once you understand how objects work in PHP, you'll be\
    \ able to build even morepowerful objects on your own.\n\n# Building a Simple\
    \ Document with SuperHTML\n\nThe SuperHTML object is a special type of entity\
    \ that allows you to automatically create and modify a Web page. It can be tricky\
    \ to understand what an object is, so I'll start by showing you how it works.\
    \ Take a look at Figure 7.1 to see a simple HTML page.\n\nWhat makes this document\
    \ interesting is the way it was built. The source code for BasicSuper.php is different\
    \ from any other code you've seen so far.\n\n```\n<?\ninclude \"SuperHTMLDef.php\"\
    ;\n$s = new SuperHTML(\"Basic Super Page\");\n$s->buildTop();\n$s->buildBottom();\n\
    print $s->getPage();\n?>\n```"
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Chapter 7 Writing Programs with Objects


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_253_0.png)


    FIGURE 7.1


    The basic SuperHTML page looks like a normal HTML page to the user.


    # Including a File


    The first thing this code does is import another file. The include statement retrieves
    data from another file and interprets it as HTML code. In this case, I''m including
    a file called SuperHTMLDef.php. That file contains the definition for the SuperHTML
    object.


    One of the joys of OOP is using an object without understanding exactly how it
    works. Rest assured you''ll see the code in the file soon enough. For now you
    understand how to access code in another program.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_253_1.png)


    > If you are having trouble with the include command, check the value of open_basedir
    in php.ini. The easiest way to do this is to run a program with the phpinfo()
    command in it. The open_basedir variable is set to null by default, which means
    PHP can load files from anywhere in the server''s file system, but your administrator
    may have this access limited. You may need to reset this value on the server or
    bribe your server administrator to get this value changed. The administrators,
    not servers) generally respond well to Twinkies.


    # Creating an Instance of the SuperHTML Object


    The next line creates a new variable called $:


    ```

    $s = new SuperHTML("Basic Super Page");

    ```'
