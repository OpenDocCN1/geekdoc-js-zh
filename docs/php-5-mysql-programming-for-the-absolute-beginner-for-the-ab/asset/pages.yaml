  md: '# Adding PHP to Your Pages


    Now that you''ve got PHP installed, it''s time to add some code.


    See that PHP is installed and run a quick diagnostic check to see how it is configured.
    You should do this whether you''re installing your own Web server or using an
    existing server for your programs.


    The easiest way to determine if PHP exists on your server is this: Write a simple
    PHP program and see if it works. Here''s a very simple PHP program that like greets
    the user and displays all kinds of useful information about the development turns.


    # Adding PHP Commands to an HTML Page


    ```

    <html>

    <head>

    <title>Hello in PHP</title>

    </head>

    <body>

    <h1>Hello in PHP</h1>


    <?

    print "Hello, world!";

    phpinfo();

    ?>

    </body>

    </html>

    ```


    Since this is the first PHP code you''ve seen in this book, I need to go over
    some basic concepts.


    A page written in PHP begins much like an ordinary HTML page. Both are written
    with a plain text editor and stored on a Web server. What makes a PHP program
    different is the embedded <script> elements. When the user requests a PHP page,
    the server parses and executes any script elements before sending the result to
    the user.


    > The <? sequence is the easiest way to indicate PHP code, but it isn''t always
    the best. You can also indicate PHP code with a longer version, like this: <?php
    ?. This version works better when your code is interpreted as XML. You can also
    specify your code with normal HTML tags like <script language="php\></script>.Some
    PHP servers are configured to prefer one type of script tag over another you may
    need to be flexible. However, all these variations work in exactly the same way.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'A PHP program looks like a typical HTML page. The difference is the special
    <??> tag, which specifies the existence of PHP code. Any code inside the tag is
    read by the PHP interpreter and converted into HTML code. The code written between
    the < and > symbols is PHP code. I added two commands to the page. Look at the
    output of the program shown in Figure 1.4. You might be surprised.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_35_0.png)


    Figure 1.4


    The page mixes HTML with some other things.


    # Examining the Results


    This page has three distinct types of text.


    +   - Hello in PHP is ordinary HTML. I wrote it just like a regular HTML page,
    and it was displayed just like regular HTML.

    - Hello, world! was written by the PHP program embedded in the page.

    - The rest of the page is a bit mysterious. It contains a lot of information about
    the particular PHP engine being used. It actually stretches on several pages.
    The phpinfo() command generated all that code. This command displays information
    about the PHP installation.


    It’s not important to understand all the information displayed by the phpInfo()
    command. It’s much more critical to appreciate when the user requests the hello.html
    Web page, the text is first run through the PHP interpreter. This program scans
    for all PHP commands, executes them, and prints HTML code in place of the original
    commands. All the PHP code is gone by the time a page gets to the user.'
