  md: 'read easily by any browser. These two features are important benefits of server-side
    programming in general, and of PHP programming in particular.


    As you progress through this book, you learn about many commands for producing
    interesting HTML, but the basic concept is always the same. Your PHP program is
    simply an HTML page that contains special PHP markup. The PHP code is examined
    by a special program on the server. The results are embedded into the Web page
    before it is sent to the user.


    # Configuring Your Version of PHP


    If you''re running your own server, you probably want to tweak your version of
    PHP so it works cleanly. I have a number of suggestions for configuration that
    provide a relatively friendly environment for beginning programs. In particular,
    think about the following elements.


    # Safe Mode


    This mode is a master setting that allows you to choose between ease of programming
    and server safety. For beginners, I recommend setting safe-mode OFF while working
    on your own Web server. As you move to a production server, you will usually have
    safe mode set to ON, which requires you to be a little more careful about some
    elements. (However, most of these are advanced settings you won''t need to worry
    about yet. The most important reason to have safe mode off now is to allow access
    to the `register_globals` directive that is described next.)


    # Register Globals


    The `register_globals` parameter determines whether PHP automatically transfers
    information from web forms to your program. (It''s okay if that doesn''t mean
    much to you.) This feature is useful for beginning programmers, but can be a security
    risk.


    As you get more comfortable (after chapter 5, I will show you some alternatives
    to `register_globals`) you can turn off this variable to protect your code from
    some potential problems. To change this variable''s value, simply type `on` or
    `off` the value for `register_globals`. As with any change to `php.ini`, restart
    your Web server to ensure the changes have taken hold.


    Search in `php.ini` for a line that looks like:


    ```

    register_globals = On

    ```'
