  md: '# Editing Table Data


    Check this site out sometime when you''re bored: http://home.hiwaay.net/~lkseitz/comics/herogen/.
    Special thanks to Lee Seitz and his hysterical Super-Hero generator.


    You can use phpMyAdmin to browse your table in a format much like a spreadsheet.
    Figure 9.12 illustrates this capability.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_340_0.png)


    | id | name | power | weapon | transportation |

    |---|---|---|---|--|

    | 0 | Professor One | Earthquake generation | Laser Pointer | Binary Cow |

    | 1 | Bat Worm | Super Speed | Panther Belt | Bat taxi |

