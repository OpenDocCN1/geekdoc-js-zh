    # Taking a Quiz


    The point of all this work is to have a set of quizzes your users can take, so
    it''s good to have a program to run the quizzes. Actually, the quizzes are saved
    as HTML pages, you could simply provide a link to a quiz and be done with it,
    I wanted a little more security. I wanted the ability to store my quiz files outside
    the normal public_html file space and to have basic password protection so people
    don''t take a quiz until I know it''s ready. (I don''t release the password until
    I''m ready for people to take the quiz.) Also, I can easily turn "off" a quiz
