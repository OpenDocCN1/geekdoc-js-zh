  md: '# Introducing XCMS


    You examine three different forms of CMS here. First, you look at a powerful CMS
    system called PHPNuke. Then you build a basic CMS using ordinary PHP. Finally
    you learn how to incorporate the power of XML to build the foundation of a powerful
    and flexible CMS engine.


    You begin by installing and modifying an existing system to create a custom, high-end
    Web site like the one featured in Figure 8.1.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_294_0.png)


    You can develop this fancy page with a minimum of PHP programming.


    Because PHP-Nuke requires a functioning MySQL server, I did not include this particular
    example on the CD. PHP-Nuke is on this book''s CD, however, use it to build sites
    just like this.


    A CMS site can be extremely powerful, but you may not want all of the features
    of a high-end package like PHP-Nuke. On the other hand, you may wish to "roll
    your own" CMS. This type of program is very easy to build without understanding
    the basic concepts. By the end of the chapter you can build a site much like the
    one displayed in Figure 8.2.'
