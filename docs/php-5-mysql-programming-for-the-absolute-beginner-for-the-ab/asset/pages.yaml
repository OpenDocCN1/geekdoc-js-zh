  md: '# CHAPTER


    # Exploring the PHP Environment


    Web pages are interesting, but on their own they are simply documents. You can
    use PHP to add code to your Web pages so they can do more. A scripting language
    like PHP can convert your Web site from static document to an interactive application.
    In this chapter you learn how to add basic PHP functionality to your Web pages.
    You also learn how to do these things:


    +   - Download and install Apache


    +   - Download and install PHP


    +   - Configure Apache to recognize PHP 5.0


    +   - Configure PHP to run extensions used in this book (including MySQL and XML)


    +   - Ensure PHP is on your system


    +   - Run a basic diagnostic check of your PHP installation


    +   - Add PHP code to a Web page'
  merge: -1
