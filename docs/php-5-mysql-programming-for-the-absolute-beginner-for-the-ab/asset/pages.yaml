  md: '# Examining the Petals Around the Rose Game


    The Petals Around the Rose game, featured in Figure 3.1, illustrates all the new
    skills you learn in this chapter.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_78_0.png)


    FIGURE 3.1


    This is a new twist on an old dice puzzle.


    The premise of the Petals game is very simple. The computer rolls a set of five
    dice and asks the user to guess the number of petals around the rose. The user
    enters a number and presses the button. The computer indicates whether this value
    is correct, and provides a new set of dice. The user understands the secret, it''s
    a very easy game, but it can take a long time to figure out how it works. Try
    the game before you know how it''s.


    # Creating a Random Number


    The dice game, like many other games, relies on random number generation to make
    things interesting. Most programming languages have at least one way to create
    random numbers. PHP''s rand function makes it easy to create random numbers.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Viewing the Roll Em Program


    The Roll Em program shown in Figure 3.2 demonstrates how the rand function generate
    virtual dice.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_79_0.png)


    FIGURE 3.2


    The die roll is randomly generated by PHP


    The code for the Roll Em program shows how easy random number generation is:


    ```

    <html>

    <head>

    <title>Roll Em!</title>

    </head>

    <body>

    <h1>Roll Em!</h1>

    <h3>Demonstrates rolling a die</h3>


    <?

    $roll = rand(1,6);

    print "You rolled a $roll";

    print "<br>";

    print "<img src = die$roll.jpg>";

    ?>

    <br>

    Refresh this page in the browser to roll another die.


    </body>

    </html>

    ```'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'The rand function generates a random number between 1 and 6 (inclusive) and
    stores the resulting value in the $roll variable. The rand function expects two
    parameters: The first value is the lowest number and the second value represents
    the highest number.


    Since I want to replicate an ordinary six-sided die, I told the rand function
    to return a value between 1 and 6. Since I knew rand would return a value, I assigned
    that value to the variable $roll. By the time the following line has finished
    executing, the $roll variable has a random value in it:


    ```

    $roll = rand(1,6);

    ```


    The lowest possible value is 1, the highest possible value is 6, and the value
    will not have a decimal part. (In other words, it will never be 1.5.)


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_80_0.png)


    If you''re coming from another programming language, you might be surprised at
    the random numbers are generated in PHP. Most languages allow you to create a
    random floating-point value between 0 and 1, and then requires you to transform
    that value to whatever range you wish. PHP allows—in fact,requires you to create
    random integers within a range, which is usually what you want. If you really
    want a value between 0 and 1, you can generate a random number between 0 and 1000
    and then divide that value by 1000.


    # Printing a Corresponding Image


    Notice the sneaky way I used variable interpolation in the preceding code. Carefully
    named my first image die1.jpg, the second die2.jpg, and so on. When I was ready
    to print an image to the screen, I used an ordinary HTML image tag with the source
    set to die$roll.jpg. If $roll is 3, the image shows die3.jpg.


    Variable interpolation can be a wonderful trick if you know how the filenames
    are structured. You might recall from chapter 2, “Using Variables and Input,”
    interpolation is the technique that allows you to embed a variable in a quoted
    string by simply using its name.


    # Using the if Statement to Control Program Flow


    One of the most interesting things computers do appear to make decisions. The
    decision-making ability is an illusion. The programmer stores very specific instructions
    inside a computer, and it acts on those instructions. The simplest form of this
    behavior is a structure called the if statement.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# IN THE REAL WORLD


    The dice games in this chapter demonstrate the power of graphical images to make
    your programs more interesting and fun. You can get graphics for your programs
    of many ways. The easiest is to find an existing image on the Web. Although this
    is technically very simple, many of the images on the Web are owned by somebody.
    Respect the intellectual property rights of the original owners. Get permission
    for any images you use.


    Another alternative is to create the graphics yourself. Even if you don''t have
    any artistic talent at all, modern software and technology make it quite easy
    to generate passable graphics. You can do a lot with a digital camera and a free-ware
    graphics editor. Even if you hire a professional artist to do graphics for your
    program, you might still need be able to sketch what you are looking for. This
    book''s CD has a couple of very powerful freeware image-editing programs.


