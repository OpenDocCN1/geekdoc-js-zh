    # Defining the SimpleCritter Class


    The SimpleCritter program works in classic object-oriented style. First it defines
    what a critter is and then it creates an instance of that design. Consider this
    part of the code:


    ```

    //define the critter class

    class Critter{

    var $name;

    } // end Critter class

    ```


    The keyword indicates that I am defining a class. A class is a design or template
    for something. A recipe is a good example of a class. You wouldn''t actually eat
    the ice card with the cookie recipe on it, but you use that recipe to create cookies,
    which you can eat. The recipe is the class and cookies are instances of that class.(Great.
    Now I''m hungry).


    When I defined the Critter class, I was defining what a critter would be like
    (the recipe), but I haven''t made one yet (the cookie). My Critter class is extremely
    simple. Right now it has only one property, which is the variable $name. Class
    definitions get a lot more complicated, but this is a good start.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_273_0.png)


    > Note of the var keyword to specify an instance variable. You don''t have to
    use the var keyword when you create ordinary variables in PHP (and almost nobody).
    The var keyword is necessary in a class definition, or the variable will not be
    interpreted correctly.


