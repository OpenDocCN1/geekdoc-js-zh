    \ best to back away from the computer and think carefully how\ndata is used before\
    \ you write a single line of code.\n\n# # Defining Rules for a Good Data Design\n\
    \nData developers have come up with a list of rules for creating well-behaved\n\
    databases:\n\n+   - Break your data into multiple tables.\n- Make no field with\
    \ a list of entries.\n- Do not duplicate data.\n- Make each table describe only\
    \ one entity.\n- Create a single primary key for each table.\n\nA database that\
    \ follows all these rules will avoid most of the problems evident in\nthe badSpy\
    \ database. Fortunately, there are some well-known procedures for\nimproving a\
    \ database so it can follow all these rules.\n\n# # Normalizing Your Data\n\n\
    Data programmers try to prevent the problems evident in the badSpy database\n\
    through a process called data normalization. The basic concept of normalization"
  merge: -1
  pgno: 385
- img_proc: true
  md: 'is to break down a database into a series of tables. If each of these tables
    is designed correctly, the database is less likely to have the sorts of problems
    described so far. Entire books have been written about data normalization, but
    the process breaks down into three major steps, called normal forms.


    # First Normal Form: Eliminate Listed Fields


    The goal of the first normal form (sometimes abbreviated 1NF) is to eliminate
    repetition in the database. The primary culprit in the badSpy database is the
    specialty field. Having two different tables, one for agents and for specialties,
    is one solution.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_386_0.png)


    The two tables would look something like those shown in Tables 11.1 and 11.2.


    | TABLE 11.1 AGENT TABLE IN 1NF |

    | Agent ID | Name | Assignment | Description | Location |

    | 1 | Rahab | Raging Dandelion | Plant Crabgrass | Sudan |

    | 2 | Gold Elbow | Dancing Elephant | Infiltrate suspicious zoo | London |

    | 3 | Falcon | Dancing Elephant | Infiltrate suspicious circus | London |


    | TABLE 11.2 SPECIALTY TABLE IN 1NF |

    | Specialty ID | Name |

    | 1 | electronics |

    | 2 | counterintelligence |

    | 3 | sabotage |


    Note that I did not include all data in these example tables, but just to give
    you a sense of how these tables would be organized. Also, you learn later in this
    chapter a good way to reconnect these tables.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# Second Normal Form: Eliminate Redundancies


    Once all your tables are in the first normal form, the next step is to deal with
    all the potential redundancy issues. These mainly occur because data is entered
    more than one time. To fix this, you need to (you guessed it) build new tables.
    The agent table could be further improved by moving all data operations to another
    table. Figure 11.3 shows a special diagram called Entity Relationship diagram,
    which illustrates the relationships between these tables.


    | agent | operation |

    | :--- | :--- |

    | agentID | operationID |

    | name | name |

    | operationID | description location |


    | specialty |

    | :--- |

    | specialtyID |

    | specialtyName |


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_387_0.png)


    An Entity Relationship diagram (ER diagram) reveals the relationships between
    data elements. In this situation, I thought carefully about the data in the spy
    database. As I thought about the data, three distinct entities emerged. By separating
    the operation data from the agent data, I have removed redundancy: The user enters
    operational data only one time. This eliminates several of the problems in the
    original database. It also fixes the situation where an operation''s data was
    lost because a spy turned out to be a double agent. (I''m still bitter about that
    deception.)


    # Third Normal Form: Ensure Functional Dependency


    The third normal form concentrates on the entities associated with each entity.
    For a table to be in the third normal form, table must have a single primary key
    and every field in the table must relate only to that key. For example, the description
    field is a description of the operation, not the agent, so it belongs in the operation
    table.


    In the third phase of normalization you look through each piece of data and ensure
    the table in which it''s placed. If not, either move it to a more appropriate
    table or build a new table for it.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# IN THE REAL WORLD


    You might notice that my database fell into third normal form automatically when
    I put it in second normal form. This is not unusual for very small databases,
    but rare with the large complex databases to describe real-world enterprises.
    Even if your database seems to be in the third normal form already, go through
    each field to see if it relates directly to its table.


    # Defining Relationship Types


    The easiest way to normalize your databases is with a stylized view of them such
    as the ER diagram. ER diagrams are commonly used as a design-tool use. Take another
    look at the ER diagram for the spy database in Figure 11.4.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_388_0.png)


    This diagram illustrates the three entities in the spy database (at least up to
    now) and the relationships between them. Each entity is enclosed in a rectangle,
    and the lines between each represent the relationships between the entities. Take
    a careful look at the relationship lines. They have crow''s feet on them to indicate
    some special relationship characteristics. There are essentially three kinds of
    relationships (at least in this overview of data modeling).


    # Recognizing One-to-One Relationships


    One-to-one relationships happen when each instance of entity A has exactly one
    instance of entity B. A one-to-one entity is described as a simple line between
    two entities with no special symbols on either end.'
  merge: -1
  pgno: 388
- img_proc: true
  md: 'One-to-one relationships are rare, because if the two entities are closely
    related, usually they can be combined into one table without any penalty. The
    spy ER diagram in Figure 11.4 has no one-to-one relationships.


    # Describing Many-to-One Relationships


    One-to-many (and many-to-one) relationships happen when one entity can contain
    more than one instance of the other. For example, each operation can have many
    spies, but in this example each agent can only be assigned to one mission at a
    time. Thus the agent-to-operation relationship is considered a many-to-one relationship,
    because a spy can have only one operation, but one operation can relate to many
    agents. In this version of ER notation, I''m using crow''s feet to identify the
    many sides of the relationship.


    There are actually several different kinds of many-to-one relationships, each
    with a different use and symbol. For this overview I treat them all the same and
    use the generic crow''s feet symbol. When you start writing-involved databases,
    investigate data diagramming more closely by looking into books on data normalization
    and software engineering. Likewise, data normalization is a far involved topic
    than the brief discussion in this introductory book.


    # Recognizing Many-to-Many Relationships


    The final type of relationship shown in the spy ER diagram is a many-to-many relationship.
    This type of relationship occurs when each entity can have many instances of the
    other. Agents and skills have this type of relationship, because one agent can
    have any number of skills, and each skill can be used by any number of agents.
    A many-to-many relationship is usually shown by crow''s feet on each end of the
    connecting line.


    It''s important to generate an ER diagram of your data including the relationship
    types, because different strategies for each type of relationship creation exist.
    These strategies emerge as I build the SQL for the improved spy database.


    # Building Your Data Tables


    After designing the data according to the rules of normalization, you are ready
    to build sample data tables in SQL. It pays to build your tables carefully to
    avoid problems. I prefer to build all my tables in an SQL script so I can easily
    rebuild my database if (okay, when) my programs mess up the data structure. Besides,
    enemy agents are always lurking about preparing to sabotage my operations.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# IN THE REAL WORLD


    Professional programmers often use expensive software tools to build data diagrams,
    but you don''t need anything more than paper and pencil to draw ER figures. I
    do my best design with a partner drawing on a white board. I like to talk through
    designs loud and look at them in a large format. Once I''ve got a sense of the
    design, I usually use a vector-based drawing program to produce a formal version
    of the diagram.


    This type of drawing tool is useful because it allows you to connect elements
    around, already has the crow''s feet lines alike, and allows you to move elements
    without disrupting the lines between them. Dia is an excellent open-source program
    for drawing all kinds of diagrams. I used it to produce all the ER figures in
    this chapter. A copy of Dia is on the CD that accompanies this book.


    I also add plenty of sample data in the script. You don''t want to work with actual
    data early on, because you are guaranteed to mess up during the process. However,
    it is a good idea to work with sample data that is a copied subset of the actual
    data. Your sample data should anticipate any of the anomalies that might occur
    in actual data. (For example, if a person doesn''t have a name?)


    My entire script for the spy database is available on the book''s CD as buildSpy.sql.
    All code fragments shown in the rest of this chapter come from that file and use
    the MySQL syntax. If you can''t use MySQL or want to try an alternative, check
    out appendix B for information on SQLite, an intriguing alternative to MySQL.
    SQLite scripts and database files for all the database examples in the book are
    packaged on the CD that accompanies this book.


