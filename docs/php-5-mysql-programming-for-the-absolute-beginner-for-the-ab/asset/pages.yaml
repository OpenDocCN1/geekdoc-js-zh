    Handling.\ I use the split() function inside a foreach loop to break each line
    into its constituent values.


    However, I don’t want an array in this situation. Instead, I want the first value
    on the line to be read into the $name variable, and the second value in $email.
    The list() function allows you to take an array and distribute its contents into
    scalar (non-array) variables. In this particular situation, I never stored the
    results of the split() function in an array at all, but immediately listed the
    contents into the appropriate scalar variables. Once the data is in the variables,
    you can easily interpolate it into a mail-merge message.


    > TRAP The next obvious step for this program is to automatically send each message
    as an e-mail. PHP provides a function called mail(), which makes it quite easy
    to add this functionality. However, the function depends on how the server is
    set up and does not work with equal reliability on every server.

    Also, there are good and not-so-good reasons to send e-mail through a program.
    It’s completely legitimate to send e-mails to people when they request it or to
    have a program send you e-mails when certain things happen. For example, my own
    secure version of the tester program sends an e-mail when conditions indicate
    potential cheating. A program that sends unsolicited e-mail to people is rude
    and causes bad feelings about your site.


