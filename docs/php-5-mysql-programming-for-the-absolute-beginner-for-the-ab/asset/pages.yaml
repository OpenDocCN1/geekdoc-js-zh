  md: 'There is only one element of this page that may not be familiar to you. Take
    a careful look at the form tag. It contains two new attributes. action is one
    of those attributes. The other, method, indicates how the data is sent to the
    browser. get and post are the two primary methods. post is the most powerful and
    flexible, so it is the one I use most often in this book. However, you see some
    interesting ways to use get later in this chapter in "Sending Data without a Form."


    # Setting the Action Attribute to a Script File


    The other attribute of the form tag is the action attribute. It determines the
    URL of a program, designed to read the page and respond with another page. The
    URL can be an absolute reference (which begins with http:// and contains the entire
    domain name of the response program), or a relative reference (meaning the program
    is in the same directory as the original Web page).

    The whatsName.html contains a form with its action attribute to handler.php. Whenever
    the user clicks the submit button, the values of all fields (only one in this
    case) are packed up and sent to a program called handler.php, which is expected
    to be in the same directory as the original whatsName.html.


    # Writing a Script to Retrieve the Data


    The code for handler.php is specially built. The form that called handler.php
    code is expected to have an element called userName. Take a look at the code for
    handler.php and see what I mean.


    IN THE REAL WORLD

    Some PHP servers have turned off the ability to automatically create variable
    from a form. You might be able to convince your server administrator to turn on
    register_globals in the PHP.INI file. If not, there''s a workaround: If your form
    has a field called userName, add this code to the beginning of the program that
    needs the value of that field:

    $userName = $_REQUEST[''userName''];

    Repeat this code for every variable you wish to pull from the original form.

    For a complete explanation of this code, skip to chapter 5, "Better Arrays and
    String Handling.". In that chapter you will also find a routine for automatically
    extracting a form''s fields, even if you don''t know the field names.'
