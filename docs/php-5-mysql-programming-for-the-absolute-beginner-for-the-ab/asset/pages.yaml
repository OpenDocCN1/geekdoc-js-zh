    # Viewing Form Results


    Usually when I build a PHP page that responds to a form, I begin by retrieving
    the names and values of all the fields that come from this form. This is useful
    because often I make mistakes in my field names or forget exactly what I''m expecting
    the form to send. It would be nice to have a really way to do this. SuperHTML
    has this feature built in. If you fill in the elements in Forms.php and click
    the submit button, you get another version of Forms.php, but this one also includes
    form data, as seen in Figure 7.7.


