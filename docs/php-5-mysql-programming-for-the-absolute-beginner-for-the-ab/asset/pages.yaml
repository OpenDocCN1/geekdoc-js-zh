  md: 'The first thing I did was use the strtoupper() function to convert the entire
    word list into uppercase letters. Word search puzzles always seem to use capital
    letters, so I decided to convert everything to that format.


    The long string of characters with newlines is not a useful format here, so I
    converted the long string into an array called sword. The split() function works
    perfectly for this task. I split on the string "\n". This is the newline character,
    so I should convert each line of the text area into an element of the new sword
    array.


    The next task was to analyze each word in the array with a foreach loop. I tested
    this part of the program, because became clear that sometimes the trailing newline
    character was still there, so I used the trim() function to trim off any unnecessary
    trailing whitespace.


    It is impossible to create the puzzle if the user enters a word larger than the
    height or width of the puzzle board, so I check for this situation by comparing
    the length of each word to the board''s height and width. Note that if the word
    is too long, I simply set the value of $itWorked to FALSE.


    Earlier in this function, I initialized the value of $itWorked to TRUE. By the
    time the function is finished, $itWorked still contains the value TRUE if all
    the words were small enough to fit in the puzzle. If any of the words were too
    large, the value of $itWorked is FALSE and the program stops.


    # Clearing the Board


    Word Search uses a crude but effective technique to generate legal game boards
    (boards which contain all the words in the list). It creates random boards until
    it finds one that is legal. While this may seem like a wasteful approach, it is
    much easier to program than many more sophisticated methods and produces remarkably
    good results for simple problems.


    | IN THE REAL WORLD |

    |---|

    | Although this program uses a brute force approach to find a good solution, you
    see a number of ways the code is optimized to make a good solution more likely.
    One example of this is the way the program stops if one of the words is too long
    to fit in the puzzle. This prevents long processing time while the program tries
    to fit a word in the puzzle when it cannot be done. A number of other places in
    the code do some work to steer the algorithm toward good solutions and away from
    pitfalls. Because of these efforts, you find that the program is actually pretty
    good at finding search puzzles unless there are too many words or the game board
    is too small. |'
