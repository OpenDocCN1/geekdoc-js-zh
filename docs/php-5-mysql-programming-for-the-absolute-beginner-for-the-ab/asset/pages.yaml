  md: "# Building a List Box from a Field\n\nBoth smartRToEdit() and tToAdd() need\
    \ drop-down HTML lists following a specific pattern. In both cases, I needed to\
    \ build a list that allows the user to select a key value based on some other\
    \ field in the record. This list should be set so any value in the list can be\
    \ indicated as the currently selected value. The fieldToList() function takes\
    \ four parameters and uses them to build exactly such a list.\n\n```\nfunction\
    \ fieldToList($tableName, $keyName, $keyVal, $fieldName) {\n  //given table and\
    \ field, generates an HTML select structure\n  //named $keyName. values will be\
    \ key field of table, but\n  //text will come from the $fieldName value.\n  //keyVal\
    \ indicates which element is currently selected\n\nglobal $dbConn;\n$query = \"\
    SELECT $keyName, $fieldName FROM $tableName\";\n$result = mysql_query($query,\
    \ $dbConn);\n$output .= \"<select name = $keyName>\";\n$recNum = 1;\nwhile ($row\
    \ = mysql_fetch_assoc($result)) {\n  $theIndex = $row['$keyName'];\n  $theValue\
    \ = $row['$fieldName'];\n  $output .= <<HERE\n  right now, $theIndex is $theIndex\
    \ and keyVal is $keyVal\n  <option value = \"$theIndex\">\nHERE:\n  //make it\
    \ currently selected item\n  if ($theIndex == $keyVal) {\n    $output .= \" selected\"\
    ;\n  } // end if\n  $output .= \" >$theValue</option>\"\n  $recNum++;\n  } //\
    \ end while\n}\n$output .= \"</select>\";\n  return $output;\n}\n```\n\nThe fieldToList\
    \ function begins by generating a query that returns all records in the field\
    \ table. I build an HTML SELECT object based on the results of this query. As\
    \ I step through all records, I see if the current record corresponds to the $keyVal\
    \ parameter. If so, element is selected in the HTML."
  merge: -1
