  pgno: 180
- img_proc: true
  md: 'The strstr() function returns the value FALSE if the needle was not found in
    the haystack. If the needle was found, it returns the position of the needle in
    the haystack parameter. In this case, I''m really concerned only whether $firstLetter
    is found in the list of variables. If so, it''s a vowel, which changes the way
    I modify the word.


    # Using the Concatenation Operator


    Most of the time in PHP you can use string interpolation to combine string values.
    However, sometimes you need a formal operation to combine strings. The process
    of combining two strings is called concatenation. (I love it when simple ideas
    have complicated comics) The period (.) is PHP''s concatenation operator.


    If a word in Latin begins with a vowel, it should end with the string "way". I
    used string concatenation to make this work:


    ```

    $newWord = $word . "way";

    ```


    When the word begins with a consonant, the formula for creating the new word is
    slightly more complicated, but is still performed with string concatenation:


    $newWord = $restOfWord . $firstLetter . "way";


    > Recent testing has shown that the concatenation method of building strings is
    dramatically faster than interpolation. If speed is an issue, you might want to
    use string concatenation rather than string interpolation.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_181_0.png)


    # Finishing the Pig Latin Program


    Once I created the new word, I added it and a trailing space to the $newPhrase
    variable. Where the foreach loop has finished executing, $newPhrase contains the
    pig Latin translation of the original phrase.


    # Translating Between Characters and ASCII Values


    Although it isn''t necessary in the pig Latin program, the Word Search program
    requires the ability to randomly generate a character. I do this by randomly generating
    an ASCII value and translating that number to the appropriate character. (ASCII
    is the code used to store characters as binary numbers in the computer''s memory.)
    The ord() function is useful in this situation. The uppercase letters are represented
    in ASCII by numbers between 65 and 90.'
