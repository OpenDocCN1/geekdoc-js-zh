  md: '![](img/ce4ca26587e04437774a2c81d16dfb4a_412_0.png)


    The user has successfully added an agent.


    # Creating a State Diagram


    Complex programming problems have many approaches. For this particular problem
    I decided to concentrate on the flow of data through a series of modules. Figure
    12.10 shows my overall strategy.


    | Spy Master |

    | --- |

    | View Query | Edit Table |

    | Edit Record | Delete Record | Add Record |

    | Update Record | Process Add |


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_412_1.png)


    A state diagram of the SpyMaster system.


    The illustration in Figure 12.10 is sometimes called a state diagram. This kind
    of illustration identifies what particular problems need to be solved and indicates
    modules that might be able to solve these problems.'
