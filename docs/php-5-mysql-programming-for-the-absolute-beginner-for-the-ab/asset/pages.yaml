    # Building the Two-Dimensional Associative Array


    The basic approach or uses building a two-dimensional array is the same whether
    it''s a normal array or uses associative indexing. Essentially, you create each
    row as an array and then build an array of the existing arrays. In the traditional
    array, the indices were automatically created. The development of an associative
    array is a little more complex, because you need to specify the key for each value.
    As an example, look at the code used to generate the $indy array:


    ```

    $indy = array (

    "Indianapolis" => 0,

    "New York" => 648,

    "Tokyo" => 6476,

    "London" => 4000

    );

    ```


    Inside the array, I used city names as indices. The value for each index refers
    to the distance from the current city (Indianapolis) to the particular destination.
    The distance from Indianapolis to Indianapolis is 0, and the distance from Indy
    to New York is 648, and so on.


    I created an associative array for each city and put those associative arrays
    together in a kind of mega-associative array:


    ```

    //set master array

    $distance = array (

    "Indianapolis" => $indy,

    "New York" => $ny,

    "Tokyo" => $tokyo,

    "London" => $london

    );

    ```


    This new array is also an associative array, but each of its indices refers to
    an array of distances.'
