    |

    | 3 | Lightning Guardian | Electric Toe | Guardian | | Guardian Moped |

    | 4 | Yak-Bot | Super Yurt | Yakbutter flamethrower | Yak Dirible |


    Use the Browse tab to view table data.


    Follow these steps to edit a table in phpMyAdmin:


    +   1. Select the table from the table list on the left side of the SQL screen.
    The table appears in a spreadsheet-like format in the main part of the screen.
    You can edit the contents of the table in this window.

    2. Edit or delete a record by clicking the appropriate icon displayed near the
    record.

    3. Add a row by clicking the corresponding link near the bottom of the table.

    4. Leave the cell you edited or press the Enter key. Any changes you make to the
    table data are automatically converted into the appropriate SQL code.'
