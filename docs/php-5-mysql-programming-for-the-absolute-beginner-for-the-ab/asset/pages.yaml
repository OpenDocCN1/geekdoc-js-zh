  md: "# In DIZZ-ARRAY\n\nIf this associative array talk is making you dizzy, don't\
    \ panic. It's just a new name for something you're very familiar with. Think about\
    \ the way HTML works. Each tag has a number of attributes that you can use in\
    \ any order. For example, a standard button might look like this:\n\n```\n<input\
    \ type=\"button\"\n      value=\"Save the world.\">\n```\n\nThis button has two\
    \ attributes. Each attribute is made up of a name/value pair. The keywords type\
    \ and value are names (or indices, keys, depending on how you want to think of\
    \ it) and the terms button and Save the world are values associated with those\
    \ names. Cascading style sheets (CSS) use a different syntax for exactly the same\
    \ idea. The CSS element indicates a series of modifications to the paragraph tag:\n\
    \n```\np(background-color:red;\n      color:yellow;\n      font-size:14pt)\n```\n\
    \nWhile the syntax is different, the same pattern applies. The critical part of\
    \ a CSS definition is a list of name/value pairs.\n\nAssociative arrays naturally\
    \ pop up in one place. As information comes into your program from an HTML form,\
    \ it comes in an associative array. The name of each element becomes an index,\
    \ and the value of that element is translated to the value of the array element.\
    \ Later in this chapter you see how to take advantage of.\n\nAn associative array\
    \ is simply a data structure used when the name/value relationship is the easiest\
    \ way to work with some kind of data.\n\nOnce again, the array's index is a quoted\
    \ string. The associative form is terrific for data like this. In essence, it\
    \ lets you “look up” the capital city if you know the state name.\n\n# Building\
    \ an Associative Array\nwith the array() Function\n\nIf you know the values you\
    \ want in your array, you can use the array() function to build an associative\
    \ array. However, building associative arrays requires a slightly different syntax\
    \ than the garden variety arrays encountered in Chapter 4."
