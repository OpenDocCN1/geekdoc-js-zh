  md: '# Test Page for Apache Installation - Mozilla


    If you can see this, it means that the Apache web server on this system was successful.
    You may now add your content to this directory and replace this page.


    # Seeing this instead of the website you expected?


    This is because the site administrator has changed the configuration of this web
    server. Please contact the person responsible for maintaining this server with
    questions. The Apache Software Foundation, which wrote the web server this site
    administrator is using, has nothing to do with maintaining this site and cannot
    help resolve configuration issues.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_30_0.png)


    The default page for Apache proves a local server is running.


    The Apache documentation has been included with this. You are free to use the
    image below on an Apache-powered web server. Thanks for using Apache!


    While you''re getting started, I recommend not allowing external access.


    To make a new home page for your computer, look for a directory called htdocs
    under your Apache installation.


    Apache is configured to automatically display a file called index.html if the
    file exists. On live I usually have an index.html page so the user gets a HTML
    page when she goes to a particular directory. However, for my own development
    server, I usually take out the index page so I can see a directory listing and
    navigate the htdocs directory through the server.


    # Starting Apache as a Service


    You can run Apache as an executable program, but it''s preferable to start it
    as a service. Services are background processes that automatically restart whenever
    the computer is restarted. Services don''t usually have a graphic interface, but
    they sometimes have icons in the task bar.


    To run Apache as a service, activate services from the control panel (on your
    machine the path is Control Panel/Administrative Tools/Services). Figure 1.3'
  merge: -1
