    # Using Built-In Associative Arrays


    Associative arrays are extremely handy because they reflect a kind of information
    storage very frequently used. In fact, you''ve been using associative arrays in
    disguise ever since chapter 2, “Using Variables and Input.” When PHP program receives
    data from a form, that data is stored in a number of associative arrays for you.
    A variable was automatically created for you by PHP for each element.


    However, you can''t always rely on that particular bit of magic. Increasingly,
    server administrators are turning off this automatic variable creation for security
    reasons. In fact, the default setup for PHP is now to have this behavior (with
    the odd name render_globals) turned off.


    It''s handy to know how PHP gets data from the form as a good example of associative
    arrays. It''s also useful because you may need to know how to get data without
    the variables created explicitly for you.


