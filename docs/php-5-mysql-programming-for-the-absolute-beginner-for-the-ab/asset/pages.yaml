    \ to the right. I could have chosen any random cell and checked to see if the\
    \ code got outside the board range, but this would have involved some complicated\
    \ and clunky code.\n\nA more elegant solution is to carefully determine what the\
    \ range of appropriate starting cells are within that range. For example, if I'm\
    \ placing the word elephant (with eight letters) from left to right in a puzzle\
    \ with a width of 10, and zero are the only legal columns. (Remember, computers\
    \ usually starting at zero.) If I place elephant in the same puzzle from right\
    \ to left, the last two columns (eight and nine) are the only legal options. I\
