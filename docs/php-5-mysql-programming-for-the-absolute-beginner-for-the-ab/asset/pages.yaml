    # Recognizing Endless Loops


    The flexibility of the while construct gives it power, but with that power comes
    potential for problems. loops are easy to build, but a loop that works improperly
    can cause a lot of trouble. It is possible that the code in the loop will never
    execute at all. Even worse, you might have some sort of logical error that causes
    the loop to continue indefinitely. As an example, look at the badWhile.php code:


    ```

    <html>

    <head>

    <title>

    A bad While Loop

    </title>

    </head>

    <body>

    <h1>A bad while loop</h1>

    <?

    $i = 1;

    while ($i <= 10) {

    print "<br>\n";

    $j++;

    } // end while

    ?>

    </body>

    </html>

    ```'
