  md: "# Installing Apache Files\n\nApache is available on the CD that accompanies\
    \ this book. You can also go directly to the Apache Web site to load a more recent\
    \ version or get installation help.\n\nInstall Apache to your system as the first\
    \ step of building the WAMP environment. If you have any trouble, read the excellent\
    \ documentation at http://httpd.apache.org/docs/windows.html.\n\n![](img/ce4ca26587e04437774a2c81d16dfb4a_29_0.png)\n\
    \nWhen prompted for a domain name, use localhost for a local installation. This\
    \ allows access to this practice server from your local machine only. Once you\
    \ know things are working well, you can enter a different domain name.\n\n# Testing\
    \ Your Server\n\nNow see if Apache is installed correctly.\n\n+   1. Use a file\
    \ manager to look for the Apache directory.\n2. Find a program called apache.exe.\n\
    3. If you don't find it, look in the bin directory.\n   Run apache.exe.\n   A\
    \ DOS window starts.\n\n> While configuring your system, do not close this DOS\
    \ window! If you, Apache will close down and work incorrectly. After testing this\
    \ console version of Apache, you run it as a service, which runs in the background.\
    \ (I'll explain later) If you've installed Apache 2.0, it automatically installs\
    \ as a service.\n\n![](img/ce4ca26587e04437774a2c81d16dfb4a_29_1.png)\n\n+   4.\
    \ Fire up your Web browser and type in one of the following URLs:\n   http://localhost/\
    \ or http://127.0.0.1/\nApache doesn't show much when it's running, but it adds\
    \ a powerful new capacity to your computer. The 127.0.0.1 address actually works\
    \ better for me, because IE sometimes \"helpful\" takes me to a search engine\
    \ when I type in localhost. Either address indicates the main page of the machine\
    \ you're currently on. If you've turned Apache on correctly, you should see a\
    \ page that looks something like Figure 1.2.\n\nWhen Apache is up and running,\
    \ you can reach it through the localhost address. Of course, if your computer\
    \ has a domain name registered and you've turned off any firewalls, others can\
    \ reach it as well."
