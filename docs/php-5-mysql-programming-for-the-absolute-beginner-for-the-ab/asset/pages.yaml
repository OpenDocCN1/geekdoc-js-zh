  md: '# XML and Content Management Systems


    The Web has been changing since its inception. Two particular advances are especially
    important for PHP programmers to understand. The first is the concept of a content
    management system (CMS). This is a type of application that simplifies the creation
    and manipulation of complex Web sites. XML is a data management technique often
    used in CMS applications as well as other kinds of programming. PHP is an ideal
    language for implementing XML and CMS solutions. In this chapter you explore these
    exciting topics. You also do these things:


    +   - Explore some common CMSs in popular use

    - Build a basic CMS system using only one PHP program

    - Examine XML as a data storage scheme

    - Implement the simpleXML Application Programming Interface (API) for working
    with XML

    - Create a more sophisticated CMS using XML'
