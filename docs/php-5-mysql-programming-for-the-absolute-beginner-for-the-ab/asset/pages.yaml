  md: '```

    print "</span> \n";

    ?>

    </body>

    </html>

    ```


    The code excites two parameters. These parameters are both URLs for HTML files
    that are displayed by the system. A default value is supplied if either parameter
    is blank. The core of the program is a series of include statements, which loads
    and displays a file.


    > TRICK The simpleCMS system relies heavily on CSS features including sizeable
    elements and style classes. If you''re rusty on these techniques, look through
    appendix A, "Reviewing HTML and Cascading Style Sheets."


    +   - The first include loads a CSS style sheet.

    - The next include loads a page called Top.html. This page (if it exists) appears
    as a banner across the top of the screen. It is shown for every page in the system.

    - The other include statements load and display the requested files inside CSS
    span elements. If the CSS defines a span class called menuItem, the $menu page
    contents are shown according to that style.

    - Likewise, the $content variable displays according to an item style, if one
    is defined.


    By creating these elements as positional style sheet elements, it''s possible
    to control where you place objects in addition to any other display specifications.


    > TRAP Recall the div and span tags are special HTML tags that are extremely useful
    for CSS applications. If you need a refresher on these tags or on CSS, refer to
    appendix A.


    # Viewing the CSS


    In a CMS, it''s critical that content and layout remain separate. I''m using CSS
    as my primary layout management tool. At a minimum, I need to define styles for
    the menu and content area, because the PHP code is placing text in these elements.
    You can add any other CSS elements you want.'
  merge: -1
