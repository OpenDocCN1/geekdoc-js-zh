    of the spy database is available on the CD buildspy.sql.


    Note I have modified the database slightly from chapter 11, because the new version
    includes several queries as part of the data! In order to make the program reasonably
    secure, I don''t want typical users to be able to make queries. I also don''t
    want users to be limited to the few queries I thought of when building this system.
    One solution is to store a set of queries in the database and let appropriate
    users modify them to be manipulated in the system just like the other tables,
    so a user with password access can add, edit, and delete queries. Here is the
    additional code used to build the storedQuery table:


    ```

    ###########################################

