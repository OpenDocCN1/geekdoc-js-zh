  md: 'users. Each segment encapsulates an HTML form that sends a request to a particular
    PHP program. The first segment has a small amount of PHP code that sets up the
    query list box.


    Proper SQL syntax is extremely important when you store SQL syntax inside a SQL
    database as I''m doing here. It''s especially important to keep track of and double
    quotation marks. To include the single quotation marks that some queries require,
    precede the mark with a backslash. For example, I want to store the following
    query:


    ```

    SELECT * FROM agent WHERE agent.name = ''Bond''

    ```


    I would actually store this text instead:


    ```

    SELECT * FROM agent WHERE agent.name = ''\Bond\''

    ```


    This is necessary for storing the single quotation mark characters. Otherwise
    they are interpreted incorrectly.


    In SQLite, the syntax is two quotation marks together. The SQLite version of the
    query text reads like this:


    ```

    SELECT * FROM agent WHERE agent.name = ''''Bond''''

    ```


