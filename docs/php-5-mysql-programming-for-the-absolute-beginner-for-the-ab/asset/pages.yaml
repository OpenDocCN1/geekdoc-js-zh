    # Reading Select Elements


    Recall that both drop-down lists and list boxes are created with the select object.
    That object has a name attribute. Each of the possible choices in the list box
    is an option object. Each option object has a value attribute.


    The name of the select object becomes the variable name. For example, border.html
    has select objects: borderSize and border. The PHP program can expect to find
    two corresponding variables: $borderSize and $border. Because the user has to
    put a value into a select object, the value can return into the encoded structure
    of the form itself. The value of whichever option the user selected is sent to
    the PHP program as the value of the corresponding variable. For example, if the
    user chose over the border style, the $borderStyle variable has the value groove
    in it.


    # IN THE REAL WORLD


    The options'' value doesn''t necessarily have to be the value the user sees on
    the form. This "hidden value" is handy if you want to show the user to the server.
    For example, you might want to let the user choose from several colors. In this
    case, the value property shows the value corresponding to each of the option objects
    might have the actual hexadecimal values. Similar tricks are used in online shopping
    environments, where you might let the user choose an item by its name, but the
    value associated with that item might be easier to work with in a database environment.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_67_0.png)


    You can have multiple selections enabled in a list box. In that case, the variable
    contains a list of responses. While managing this list is not difficult, it is
    a topic for another chapter (chapter 4, "Loops and Arrays,") to be specific).
    For now, concentrate on the singular list box style.'
  merge: -1
