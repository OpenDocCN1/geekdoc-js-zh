  md: '# Building an Ad Hoc List


    Of course you don''t always want an ordered list. The next call to the buildList()
    method is different from the first version in two ways:


    ```

    $->buildList(array("alpha", "beta", "gamma", "delta\));

    ```


    +   - First, you build this on-the-fly rather than using a predefined array. This
    is useful when you want to build a list quickly but don''t already have an array.
    Just put the values in an ad hoc array before sending the array to the buildList()
    method.

    - Second, this is different because of the lack of a list type. If I don''t indicate
    what type of list I want, SuperHTML is smart enough to guess and put a legal value
    for me. This behavior is a good example of a principle called polymorphism, where
    an object can act differently in different situations. (Of course the formal definition
    is a little more profound than that, but this is good enough for now.) You can
    probably guess that the default list type is unordered.


    # Building More-Specialized Lists


    The buildList() method has one more trick up its sleeve. If you look back at the
    third list on the HTML output, it is written with a specific list type (<ol =
    ''a''>). I included the list attributes in the list type parameter, like this:


    ```

    $->buildList($myArray, ''ol = ''a'''');

    ```


    You can specify the list type complete with attributes for more flexible lists.


    # Making Tables with SuperHTML


    All the SuperHTML features you''ve seen are now to pretty handy, but the main
    thing I wanted was easy work with tables. You''ll frequently find yourself putting
    data in tables, and it can be confusing to switch from PHP to HTML syntax (especially
    when you add SQL to the mix, because then you''re thinking in three very different
    languages at once). I wanted some features that easily let you build HTML tables
    from PHP data structures. Figure 7.5 shows a program with this capability.


    The basic plan for building tables with SuperHTML is similar to the approach for
    making lists. However, tables are based on data structures more complex than lists,
    as you can see when you peruse the code.'
