    | * | zero or more occurrences of preceding character | [a-zA-z]\* | | |

    | (digit) | repeat preceding character that many times | \d(3)-\d(4) | 123-4567
    | 999-99999 |

    | | or operator | apple|banana | apple, banana | peach |

