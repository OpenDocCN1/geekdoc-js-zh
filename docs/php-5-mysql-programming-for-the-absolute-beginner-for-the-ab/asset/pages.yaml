  md: "# Writing the buildButton() Function\n\nThe procedure for building the buttons\
    \ was repetitive enough to warrant a direction. Each button is a radio button\
    \ corresponding to a direction. The radio button will have a value that comes\
    \ from the corresponding direction value from the current record. If the north\
    \ field of the current record is 12 (meaning the user goes North the data in record\
    \ 12), the radio button's value should be 12.\n\nThe trickier thing is getting\
    \ the appropriate label. The next room's ID is all that's stored in the current\
    \ record. If you want to display the room's name, you must make another query\
    \ to the database. That's exactly what the buildButton() function does:\n\n```\n\
    function buildButton($dir){\n  // builds a button for the specified direction\n\
    \  global $mainRow, $conn;\n  $newID = $mainRow[$dir];\n  print \"newID = $newID\"\
    ;\n  $query = \"SELECT name FROM adventure WHERE id = $newID\";\n  $result = mysql_query($query,\
    \ $conn);\n  $row = mysql_fetch_assoc($result);\n  $roomName = $row[\"name\"];\n\
    ```\n\n```\n$buttonText = <<< HERE\n<input type = \"radio\"\n  name = \"room\"\
    \n  value = \"$newID\">$roomName\n```\n\nHERE;\n\n```\nreturn $buttonText; //\
    \ end build button\n```\n\nThe function follows these steps:\n\n+   1. Borrows\
    \ the $mainRow array (which holds the value of the main record this is about)\
    \ and the data connection in $conn.\n2. Pulls the ID for this button from the\
    \ $mainRow array and stores it in a local variable. The buildButton() function\
    \ requires a direction name sent as a parameter. This direction should be the\
    \ field for one of the direction fields."
