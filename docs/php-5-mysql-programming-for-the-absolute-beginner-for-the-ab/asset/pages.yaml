    # Creating a Generic Form to Edit a Record


    The table created in tToEdit() calls a program called editRecord.php. This program
    accepts a one-record query. It prints out an HTML table based on the results of
    that query. The output of rToEdit() is shown in Figure 12.12.


    The tToEdit function produces a very simple HTML table. Every field has a corresponding
    textbox. The advantage of this approach is that it works with any table. However,
    the use of this function is quite risky.


    +   - The user should not be allowed to change the primary key, because that would
    edit some other record, which could have disastrous results.

    - The operationID field is a foreign key reference. The only valid entries to
    this field are corresponding to records in the operation table. There is no way
    for the user to know what operation a particular user is related to. Worse, they
    could enter any number (or any text) into the field. The results would be unpredictable,
    but almost certainly badly.


    I fix these defects in the smartRToEdit() function coming up next, but begin by
    studying this simpler function, because smartRToEdit() is built on rToEdit().'
