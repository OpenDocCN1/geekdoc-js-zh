  md: "The INSERT statement this function creates uses NULL as the primary key, because\
    \ all tables in the system are set to AUTO_INCREMENT. I used the same regular\
    \ expression trick as smartRToEdit() to recognize foreign key references. If they\
    \ exist, I built a drop-down list with fieldToList() to display all possible values\
    \ for used that field and send an appropriate key. Any field not recognized as\
    \ a primary or foreign key will have an ordinary key.\n\n# Processing an Added\
    \ Record\n\nThe tToAdd() function sends its results to processAdd.php, which reorganizes\
    \ the data like updateRecord.php. The field names and values are converted to\
    \ arrays, which are passed to the procAdd() function.\n\n```\nfunction procAdd($tableName,\
    \ $fields, $vals){\n    //ates INSERT query, applies to database\n    $dbConn;\n\
    \n$output = \"\";\n$query = \"INSERT into $tableName VALUES (*);\n    foreach\
    \ ($vals as $theValue) {\n        $query .= \"'$$theValue', \";\n    } // end\
    \ fetch\n\n//trim trailing space and comma\n$query = substr($query, 0, strlen($query))\
    \ - 2;\n\n$query .= \".\";\n$output = \"query is $query<br>\\n\";\n\n$result =\
    \ mysql_query($query, $dbConn);\nif ($result) {\n    $output .= \"<h3>Record added</h3>\\\
    n\";\n} else {\n    $output .= \"<h3>There was an error</h3>\\n\";\n} // end if\n\
    return $output;\n} // end procAdd\n```\n\nThe main job of procAdd() is to build\
    \ an SQL INSERT statement using the results of tToAdd(). This insert is passed\
