  md: "# Inheriting from a Parent Class\n\nYou've seen encapsulation and polymorphism.\
    \ The third pillar of OOP is a concept called inheritance.\n\nInheritance is used\
    \ to build on previous work and add new features to it. It is used to build common\
    \ functionality and at the same time allow variation. In writing a game using\
    \ Critters for example, I define all the characteristics common to everything\
    \ in the base Critter class and add a bunch of subclasses for the various types.\
    \ These subclasses incorporate additions or deviations from the basic behavior.\
    \ Think again of the police car I mentioned earlier in this chapter. The car is\
    \ a base class while a police car is an extension of the base class.\n\nI'll take\
    \ class definition and put it in its own file, like this:\n\n```\n<?\n// Critter\
    \ definition\n\n//define the critter class\nclass Critter{\n    var $name;\n\n\
    \    function __construct($handle = \"anonymous\") {\n        $this->setName($handle);\n\
    \    } // end constructor\n\n    function setName($newName) {\n        $this->name\
    \ = $newName;\n    } // end setName\n\n    function getName() {\n        return\
    \ $this->name;\n    } // end getName\n\n} // end Critter class\n?>\n```\n\nNotice\
    \ there's no HTML and no code that uses the class. This file simply contains the\
    \ definition for the class inside the normal php tags. Once I've got the class\
    \ definition safely stored in a file, I can reuse it easily. I made one minor\
    \ but useful"
