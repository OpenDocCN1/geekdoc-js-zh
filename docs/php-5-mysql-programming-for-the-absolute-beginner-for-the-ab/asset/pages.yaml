    # Creating Comments in SQL


    SQL is actually a language. Although it isn''t technically a programming language,
    it has many of the same features. Like PHP and other languages, SQL supports several
    types of comment characters. The # sign is often used to signify a comment in
    SQL. Comments are especially important when you save a group of SQL commands in
    a file for later use. These comments help you remember what type of database you
    were trying to build. It''s critical to put basic comments in your scripts.


    # Dropping a Table


    It may seem strange to talk about deleting a table from a database before youve
    built one, but often (as in this case) a database is created using a script. Before
    you create a new table, you should check if it already exists. If it does exist,
    delete it with the DROP command. The following command does exactly that:


    ```

    DROP TABLE IF EXISTS phoneList;

    ```


    If the phoneList table currently exists, it is deleted to avoid confusion.


    # Running a Script with SOURCE


    You can create an SQL script with any text editor. It is common to save SQL scripts
    with the .sql extension. Inside MySQL, you can use the SOURCE to load and execute
    a script file. Figure 9.9 shows MySQL after I run the buildPhoneList.sql script.'
