  md: "# Creating the Constructor\n\nYou might expect a complex object to have an\
    \ involved constructor, but it isn’t necessarily so.\n\n```\nfunction __Construct($tTitle\
    \ = \"Super HTML\"){\n  //constructor\n  $this->setTitle($tTitle);\n) // end constructor\n\
    ```\n\nThe constructor copies a temporary title value over the title property\
    \ using the currently undefined setTitle() method.\n\n# Manipulating Properties\n\
    \nYou would expect to find access methods for the properties, and SuperHTML has\
    \ a few. There is a setTitle(), a getTitle(), and a getPage() method. However,\
    \ there's no explicit setPage() method I intend for the programmer to build the\
    \ page incrementally through all the other methods.\n\n```\nfunction getTitle(){\n\
    \  return $this->title;\n) // end getTitle\n```\n\n```\nfunction setTitle($tTitle){\n\
    \  $this->title = $tTitle;\n) // end setTitle\n```\n\n```\nfunction getPage(){\n\
    \  return $this->thePage;\n) // end getPage\n```\n\nEach of these is simplistic.\
    \ You could improve them by checking for possible illegal values or adding default\
    \ values.\n\n# Adding Text\n\nThe SuperHTML program doesn’t print anything. All\
    \ it ever does is create a big string (thePage) and allow a programmer to retrieve\
    \ that page.\n\nThe addText() function adds ends to the $getPage whatever input\
    \ is fed it, along with a trailing newline character. Most of the functions in\
    \ the class, a getter returns the value with a newline but doesn’t write anything\
    \ to $thePage."
