  md: '# Assigning Numeric Values


    You create a numeric variable like any other variable in PHP: Simply assign a
    value to a variable. Notice that numeric values do not require quotation marks.
    I created variables called $x and $y and assigned appropriate values to these
    variables.


    # Using Mathematical Operators


    For each calculation, I want to print the problem as well as its solution. This
    line prints out the values of $x and $y variables with the plus sign between them:


    ```

    print "$x + $y = ";

    ```


    In this particular case (since $x is 3 and $y is 5), it prints out this literal:


    ```

    3 + 5 =

    ```


    Because the plus and the equals signs are inside quotation marks, they are treated
    as ordinary text elements. PHP doesn''t do any calculation (such as addition or
    assignment) with them.


    The next line does not contain any quotation marks:


    ```

    print $x + $y;

    ```


    It calculates the value of $x + $y and prints the result (8) to the Web page.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_54_0.png)'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'Most of the math symbols you are familiar with also work with numeric variables.
    The plus sign (+) is used for addition, the minus sign (-) indicates subtraction,
    the asterisk (*) multiples, and the forward slash (/) divides. The remainder of
    the program illustrates how PHP does subtraction, multiplication, and division.


    # Creating a Form to Ask a Question


    It''s very typical for PHP programs to be made of two or more separate documents.
    An ordinary HTML page contains a form, which the user fills out. When the user
    presses the submit button, the information in all the elements is sent to a program
    specified by a special attribute of the form. This program processes the information
    from the form and returns a result, which looks like the user an ordinary web
    page. To illustrate, look at the whatsName.html page illustrated in Figure 2.7.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_55_0.png)


    FIGURE 2.7

    This ordinary HTML page contains a form.


    The whatsName.html page does not contain any PHP at all. It''s simply an HTML
    page with a form on it. When the user clicks the Submit Query button, the page
    sends the value in the text area to a PHP program called hiUser.php. Figure 2.8
    shows what happens when the hiUser.php program runs.


    It''s important to recognize that two different pages are involved in the transaction.
    In this section you learn how to link an HTML page to a particular script and
    how to write a script that expects certain form information.'
  merge: -1
