  md: '# TRICK


    I used this statement to determine whether a field is a foreign key:

    ) else if (preg_match(/(.*)ID$/, $col, $match)) {


    It uses a simple but powerful regular expression: /(.*)ID$/. This expression looks
    for any line that ends with ID. (Recall that the $ indicates the end of a string.)
    The * indicates any number of characters. The parentheses around .* tell PHP to
    store all the characters before ID into a special array, called $match.

    Since there''s only one pattern to match in this expression, all the characters
    before ID contain the table name. So, this regular expression takes the name of
    a field and determines if it ends with ID. If so, the beginning part of the field
    ($col contains operationID, but ID is stored in $match[1]). If this line returns
    TRUE (because operationID ends with ID) and the table name (operation) is stored
    in $match[1].


    # Building the Foreign Key List Box


    If a field is a foreign key reference, it is necessary to build a list box containing
    some sort of meaningful value the user can read. Since I need this capability
    for a couple of places (and smartToEdit is already pretty complex), I build a
    new function called fieldToList(). This function (explained in detail later in
    the “Building a List Box from a Field” section of this chapter) builds a drop-down
    HTML list based on a table and field name. Rather than worrying about the details
    of fieldToList() here, I figured out what parameters it would need and printed
    that function''s results.


    # Working with Regular Fields


    Any field that is not a primary or foreign key is handled by the else clause,
    which prints out an rToEdit()-style textbox for user input. This textbox handles
    all fields that allow ordinary user input, but will not trip for certain errors
    (such as string being placed in numeric fields or longer than the underlying field
    accepts). These would be good improvement. The data designer did not name foreign
    key references according to my convention, those fields are still editable with
    a textbox, but the errors that could happen with rToEdit() are not worth concern.


