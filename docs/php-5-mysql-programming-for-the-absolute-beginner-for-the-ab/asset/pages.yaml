  md: 'function allows the user to type any index number into the textbox without
    any real indication what data correlates to that index. This version builds a
    drop-down list showing operation names. The key value associated with those names
    is stored in the value attribute of each option. (Details to follow in the `fieldList()`
    function.) The user doesn''t have to know anything about foreign key references
    or relational structures–he simply chooses an operation from a list. That list
    is dynamically generated each time the user chooses to add a record, so it always
    reflects all the operations in the agency.


    +   - Neither a primary nor secondary key. In this case, I print a simple textbox
    so the user can input the value of the field. In all cases, the output will reflect
    the current value of the field.


    # Working with the Primary Key


    The primary key value is much more important to the program than it is to the
    user. I decided to display it, but not to make it editable in any way. Primary
    keys should not be edited, but changed by adding or deleting records.


    I relied upon some conventions to determine whether the first field of the record
    is a primary key. I assumed that the first field of the record (field number 0)
    is the primary key. This is a very common convention, but not universal. Since
    I created the design in this case, I can be sure that the 0 field in every table
    is the primary key. For that field, I simply printed the field name and value
    in an ordinary HTML table row. I added the key''s value in a hidden field so the
    next program has access to it.


    # Recognizing Foreign Keys


    Unfortunately, there is no (at least in MySQL or SQLite) to determine if a field
    is a foreign key reference. I had to rely on a naming convention to make sure
    my program recognizes a field as a foreign key reference. I decided that all foreign
    key fields in my database will follow the foreign table''s name followed by the
    `operation` table will be called `operationID` in my database.


    This is a smart convention to follow anyway, as it makes your field names easy
    to remember. It becomes critical in `smartRTEdit()` because it''s the only way
    to tell whether a field is a foreign key reference. I used an `else` clause to
    check the name of field that is not the primary key (which was checked in the
    if clause). The `preg_match()` function lets me use a powerful regular expression
    match to determine the field''s name.'
