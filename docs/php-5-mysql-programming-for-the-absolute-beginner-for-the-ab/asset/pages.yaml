  md: '# Generating a Basic Array


    Look at the lines that describe $camelPop:


    ```

    //simply assign values to array

    $camelPop[1] = "Somalia";

    $camelPop[2] = "Sudan";

    $camelPop[3] = "Mauritania";

    $camelPop[4] = "Pakistan";

    $camelPop[5] = "India";

    ```


    The $camelPop variable is a means to hold the five countries with the largest
    camel populations in the world. (If this array isn''t working for you, at least
    you''ve learned something in this chapter!) Since $camelPop is going to hold the
    names of five different countries, that is this is an array (computer lingo for
    list) rather than an ordinary variable.


    The only thing different about $camelPop and all the other variables you worked
    with so far is $camelPop can have multiple values. To tell these values apart,
    use a numeric index in square brackets.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_131_0.png)


    Apparently the boxer George Foreman has several sons named George. I''ve wondered
    what Mrs. Foreman does when she wants somebody to take out the trash. I suspect
    she has assigned a number to each George, so there is no ambiguity. This is exactly
    how arrays works. Each element has the same name, but a different numerical index
    so you can tell them apart.


    Many languages require you to explicitly create array variables, but PHP is very
    easygoing in this regard. Simply assign a value to a variable with an index in
    square brackets and you''ve created an array.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_131_1.png)


    Even PHP is good natural about letting you create an array variable on-the-fly,
    you might get a warning about this behavior on Web servers that have error reporting
    to E_ALL. If that''s the case, you can create an empty array with the array()
    function described in the following sections and then add values to it.


    # Using a Loop to Examine an Array''s Contents


    Arrays go naturally with for loops. Very often when you have an array variable,
    you step through all of its values and do something to each one. In this example,
    I want to print the index and the corresponding country''s name. Here''s the for
    loop that performs this task:'
