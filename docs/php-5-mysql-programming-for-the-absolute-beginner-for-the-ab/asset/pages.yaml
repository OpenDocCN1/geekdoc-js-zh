    # IN THE REAL WORLD


    You might want to use XML data in these main instances:


    +   - You want a better organizational scheme for your information but don''t
    want to deal with a formal database system. In this case you can create your own
    XML language and build programs that work with the data. This is the use of XML
    described in this chapter.

    - You have XML data formatted in a predefined XML structure that you want to manipulate.
    There are XML standards for describing everything from virtual reality and molecular
    models to multimedia slideshows. You can use the features of simpleXML (or one
    of PHP''s other parsers) to manipulate this data and create your own program for
    interpreting it. Of course, HTML is rapidly becoming a subset of XML (in fact,
    the XHTML is simply HTML following stricter XML standards), so you can use XML
    tricks to load and manage an HTML file. This might be useful for extracting a
    Web page''s links or examining a Web page''s images.

    - You need a stand-in for data. Most database management systems allow you to
    import and export data in XML format. XML can be a terrific way to send complex
    data, such as database query results or complete data tables, to remote programs.
    Often programmers write client-side code in a language such as JavaScript or Flash
    and use a server-side program to query results to the client as XML data.


