    \ I can do a number of things to test the information before I make any property\
    \ changes. for example, if I decided that all my crater names should be fewer\
    \ than five characters, I could modify setName() to enforce that rule.\n\n```\n\
    function setName($newName) {\n    if(strlen($newName) > 5) {\n        $newName\
    \ = substr($newName, 0, 5);\n    }\n} // end if\n```\n\n```\n$this->name = $newName;\n\
    } // end setName\n```\n\nThis is a trivial example, but access methods can do\
    \ a lot to prevent certain kinds of problems. For example, if your program is\
    \ expecting numeric input and gets a string instead, your access method can quietly\
    \ (or not-so-quietly, if you wish) change the value to something legal without\
    \ the program crashing. Use of access methods can be a splendid way to add polymorphism\
    \ to your classes. If you are using a class that has access methods, you should\
    \ always use them rather than directly modifying a property. If you directly modify\
    \ a property, you are circumventing the safety provided by the access method."
