  md: 'The helloJacob page is mainly HTML with a small patch of PHP code in it. That
    code does a lot of very important work.


    # Creating a String Variable


    The line $userName = "Jacob"; does two major things. First, it creates a variable
    named $userName. Second, it will assign the value "Jacob" to the variable. In
    PHP, all variables begin with a dollar sign to distinguish them from other program
    elements. The variable''s name is significant.


    # Naming Your Variables


    As a programmer, you frequently get to name things. Experienced programmers have
    learned some tricks about naming variables and other elements.


    +   - Make the name descriptive. It''s much easier to figure out what $userName
    means something like $myVariable or $r. When possible, make sure your variables
    describe the kind of information they contain.

    - Use an appropriate length. Your variable name should be long enough to be descriptive,
    but not so long that it becomes tedious to type.

    - Don''t use spaces. Most languages (including PHP) don''t allow spaces in variable
    names.

    - Don''t use symbols. Most of the special characters such as #, *, and / already
    have meaning in programming languages. Of course, every variable in PHP begins
    with the $ character, but otherwise you should avoid using punctuation. One exception
    to this rule is the underscore (_) character, which is allowed in most languages,
    including PHP.

    - Be careful about case. PHP is a case-sensitive language, which means that it
    considers $userName, $USERNAME, and $UserName to be three different variables.
    The convention in PHP is to use lowercase when separating words. This is a good
    convention to follow, and it''s the one I use throughout this book.

    - Watch your spelling! Every time you refer to a variable, PHP checks if that
    variable already exists somewhere in your program. If so, it uses that variable.
    If not, it quietly makes a new variable for you. PHP will not catch a misspelling.
    Instead, it makes a whole new variable, and your program probably won''t work
    correctly.'
  merge: -1
