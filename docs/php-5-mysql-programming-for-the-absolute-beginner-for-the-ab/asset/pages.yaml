    I used a for loop to pull one character at a time using the substr() function.
    For the loop counter ($i) I used to determine the starting character of the substring,
    which is always one character long. Each character is placed at the same row as
    the starting character, but at a character offset by the position in the word.
    example example if the starting position is column one, the character is placed
    in column one, because E is at the 0th position in the word element, + 1 = 0.
    When the counter ($i) gets the letter L, it has the value 1, so it is placed in
    column two, and so on.


    If the formula for choosing the starting place and the plan for placing subsequent
    letters in place work correctly, you cannot add a letter outside the puzzle board.
    However, another thing could happen if a character from a previously placed word
    was in a cell that the current word wants. The code checks the current cell on
    the board to see its current status. If the cell contains the value ". it is empty
    and the new character can be freely placed there. If the cell contains the value
    that the current word wants to place in the cell, the program can continue without
    interruption. However, if the cell contains any character, the loop must exit
    and the program must reset the board and try again. Do this by setting theitWorked
