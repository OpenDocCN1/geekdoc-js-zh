  md: "# Building Select Objects\n\nThe select object is derived from an associative\
    \ array. It expects a name for the entire structure and an associative array.\
    \ For each element in the associative array, the index is translated to the value\
    \ property of an option object. Also, the value of the array element becomes the\
    \ text visible to the user.\n\n```\nfunction gSelect($name, $listVals){\n//given\
    \ an associative array,\n//prints an HTML select object\n//Each element has the\
    \ appropriate\n//value and displays the associated name\n$temp = \"\";\n$temp\
    \ .= \"<Select name = \\$name\\> \\n\";\nforeach ($listVals as $val => $desc){\n\
    $temp .= \" <option value = \\$val\\>$desc</option> \\n\";\n}// end foreach\n\
    $temp .= \"</select> \\n\"\nreturn $temp;\n}\n // end gSelect\n```\n\n```\nfunction\
    \ select($name, $listVals){\n$this->addText($this->gSelect($name, $listVals));\n\
