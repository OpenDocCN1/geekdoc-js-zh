    # Using a Database Management System


    Data is an important part of modern programming that entire programming languages
    are devoted to manipulating databases. The primary standard for database languages
    is Structured Query Language (SQL). SQL is a standardized language for creating
    databases, storing information in databases, and retrieving information from databases.
    Special applications and programming environments specialize in interpreting SQL
    data and acting on it.


    Often a programmer begins by creating a data structure in SQL, and then writes
    a program in some other language (such as PHP) to allow access to that data. The
    PHP program can then formulate data requests or updates, which are passed to the
    SQL interpreter. This approach has a couple of advantages:


    +   - Once you learn SQL, you can apply it easily to a new programming language.

    - You can easily add multiple interfaces to an existing data set because many
    programming languages have ways to access an SQL interpreter. Many relational
    database management systems are available, and the MySQL environment is especially
    well suited to working with PHP.'
  merge: -1
