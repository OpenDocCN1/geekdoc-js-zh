    It''s easy to create a table and modify its structure with phpMyAdmin.


    With phpMyAdmin you can choose variable types from a drop-down list; many field
    properties are available as checkboxes. It is crucial that when you choosing a
    variable type (and a field length in case of character fields). When you finish
