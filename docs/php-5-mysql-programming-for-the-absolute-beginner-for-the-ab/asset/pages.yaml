    # Selecting Results


    Of course, you want to see the results of all your table-building activities.
    If you want to see the data in a table, you can use the SELECT command. This is
    perhaps the most powerful command in SQL, but its basic is quite simple. Use this
    command to see all the data in the phoneList table:


    SELECT * FROM phoneList


    This command gathers all fields of all records of the phoneList database and displays
    them in table format.


    Figure 9.8 shows what happens after I add a SELECT statement to get the results.'
