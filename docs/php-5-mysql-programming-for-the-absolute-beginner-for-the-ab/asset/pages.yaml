  md: '# # Acknowledgments


    First I thank Him from whom all flows.

    Heather, you always work harder on these books than I do. Thank you for your love
    and your support. Thank you Elizabeth, Matthew, and Jacob for understanding why
    Daddy was typing all the time.


    Thanks to the Open Source community for creating great free software like PHP
    and MySQL. Also, thanks to the phpMyAdmin team and the SQLite team for developing
    such terrific software and making it freely available.


    Thank you, Stacy Hiquet, for your continued support and encouragement on this
    other projects.


    Thanks, Scott Harris. You did a great job of juggling those balls around.


    Thanks to Tonya Cupp for drastically improving the readability of the manuscript.
    Arlie Hartman, thank you for technical editing and for putting together the CD-ROM.


    Thanks to J. Wynia (www.phpgeek.com) for technical editing. Thanks also to Jason
    for use of PHPTriad on the CD-ROM.


    Special thanks to those who worked on the first edition. Your hard work is the
    foundation for something even better.


    Thank you to the many members of the Premier/Course team who worked on this book.


    A huge thanks goes to CSCI N399 and N452 Server-Side Web Development classes and
    the many people who sent in comments and advice from the first edition. Thank
    you for being patient with my manuscript, for helping me spot many errors, and
    for providing invaluable advice. I learned as much from you as you did from me.'
