    \ If $userName does not exist, empty($userName) evaluates as true. The condition\
    \ (empty($userName)) is generally true if this is the first time the program has\
    \ been called. The program should generate a form so the user can enter her name.\
    \ If the condition is false, which means the user has entered a name (presumably\
    \ through the form) so the program greets the user with that name.\n\nThe key\
    \ idea is that the program runs more once. When the user first links to hiUser.php,\
    \ the program creates a form. The user enters a value on the form, and presses\
    \ the submit button. This causes exactly the same program to run again on the\
    \ server. This time, though, the variable is not empty, so rather than generating\
    \ a form, the program uses the variable's value in a greeting.\n\nServer-side\
    \ programming works well in this way. It is uncommon for a user to call the program\
    \ many times in succession as part of solving a particular problem. You often\
    \ use branching structures as the if and switch statements to direct the program\
    \ flow based on the user's current state of activity."
