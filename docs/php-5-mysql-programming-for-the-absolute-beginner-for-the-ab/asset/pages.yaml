  md: 'WHERE agent.agentID = agent_specialty.agentID

    AND specialty.specialtyID = agent_specialty.specialtyID;


    It requires two comparisons to join the three tables. It is necessary to forge
    the relationship between agent and agent_specialty by common agentID values. It''s
    also necessary to secure the bond between specialty and agent_specialty by comparing
    the specialtyID fields. The results of such a query show that the correctness
    indeed been joined, as you can see in Table 11.9.


    # Table 11.9 Query Interpretation of AGENT_SPECIALTY Table


    | Agent Specialty ID | Agent | Specialty |

    |---|---|--|

    | 1 | Bond | Sabotage |

    | 2 | Bond | Doily Design |

    | 3 | Falcon | Counterintelligence |

    | 5 | Cardinal | Sabotage |

    | 6 | Blackford | Explosives |

    | 7 | Blackford | Flower Arranging |


    The link table provides the linkage between tables that have many-to-many relationships.
    Each time you want a new relationship between an agent and a specialty, you can
    add a new record to the agent_specialty table.


    # Creating Queries That Use Link Tables


    Whenever you want to know about the relationships between agents and specialties,
    the data is available in the agent_specialty table. For example, if you need to
    know which agents know flower arranging, you can use the following query:


    ```

    SELECT

    agent.name

    FROM

    agent,

    specialty,

    agent_specialty

    WHERE agent.agentID = agent_specialty.agentID

    AND agent_specialty.specialtyID = specialty.specialtyID

    AND specialty.name = ''Flower Arranging'';",

    ```'
  merge: -1
  pgno: 401
- img_proc: true
  md: 'This query looks a little scary, but it really isn''t bad. This query requires
    data from three different tables. The output needs the name from the agent table.
    I don''t want to remember what specialty is associated with Flower Arranging,
    so I let the query look up from the specialty table. I need to know which agent
    is associated with a particular specialty. I use the agent_specialty table to
    link up the other two tables. The WHERE clause simply provides the joins.


    The following phrase cements the relationship between agents and agent_specialty:\agents.agentID
    = agent_specialty.agentID


    Likewise, the following ensures the connection between specialties and agent_specialty:\agent_specialty.specialID
    = specialties.specialID


    The last part of the WHERE clause is the actual conditional part of the query
    that only returns records where the specialty is flower arranging. You know, flower
    arrangement can be a deadly art in the hands of a skilled practitioner)


    It might be helpful to imagine the ER diagram when building queries. If two tables
    have lines between them, use a WHERE clause to represent each line. To replicate
    a one-to-many join (with one line and two tables) you need one LINE to handle
    the connection. If creating a many-to-many join with a link table, you need a
    compound condition to handle connecting each table to the link table. You can
    then add any other conditions that help you narrow the query.


    # Summary


    In this chapter you move beyond programming to an understanding of data, the real
    fuel of modern applications. You learn how to take a poorly designed table and
    convert it into a series of well-organized tables that can avoid a lot of data
    problems. You learn about three stages of normalization and how to build an Entity
    Relationship diagram. You can recognize three kinds of relationships between entities
    and build normalized tables in SQL, including pointers for primary and foreign
    keys. You can connect normalized tables with INNER JOIN SQL statements. You know
    how to simulate a many-to-many relationship by building a link table. The civilized
    world is safer for your efforts.'
  merge: -1
