- img_proc: true
  md: 'All the other PHP programs in the system begin by including spyLib.php. Once
    this is done, every function in the library can be accessed as if it were a locally
    defined function. This provides tremendous power and flexibility to a programming
    system.


    # Connecting to the spy Database


    The utility of the spyLib library becomes immediately apparent as I connect to
    the spy database. Rather than worrying about exactly what database I''m connecting
    to, I simply defer to the connectToSpy() function in spyLib(). In the current
    code I don''t need to worry about the details of the database. With a library
    I can write the connection code one time and return that function as needed.


    Notice the connectToSpy() function returns a data connection pointer I can use
    for other database activities.


    > There''s another advantage of using a library when connecting to a database.
    It is likely that if you move this code to another system you''ll have a different
    way to log in the data server. If the code for connecting to the server is centralized,
    it only needs to be changed in one place when you want to update the code. This
    is far more efficient than searching through dozens of programs to find every
    reference to the mysql_connect() function. Also, if you want to convert the MySQL-based
    code in this book to SQLite or another database system, you only have to change
    the connectToSpy() function. That''s pretty cool, huh?


    # Retrieving the Queries


    I decided to encode a series of prepackaged queries into a table. (I explain about
    my reasons for this in the section on the viewQuery program). The main form must
    present a list of query descriptions and let the user select one of these queries.
    I use an SQL SELECT statement to extract everything from the storedQuery table.
    I then use the description and text fields from storedQuery to build a multiline
    list box.


    # Creating the Edit Table Form


    The second half of the spyMaster program presents all the tables in the database
    and allows the user to choose a table for later editing. Most of the functionality
    of the system comes through this section. Surprisingly, there is no PHP code at
    all in this part of the page. An HTML form sends the user to the editTable.php
    program.'
