  md: 'phpMyAdmin basically adds the visual editing tools of a program like Microsoft
    Access to the MySQL environment. It also adds some tools for adding records, viewing
    your data structure, exporting data to useful formats, experimenting with data
    structures. The program is written in PHP, so install it to your server''s HTML
    document path (usually htdocs if you''re using the Apache server).


    > > Trick Some of the more advanced phpMyAdmin features—including the ability
    to automate relationships and create PDF diagrams of your data—table installation
    and some other special configuration. If your server administrator has not enabled
    these features, consult an excellent tutorial at http://www.garvinhingning.de/tops/texte/imetutorial.


    # Connection to a Server


    MySQL is a client/server application. The MySQL server usually runs on the Web
    server where your PHP programs reside. You can connect a MySQL client such as
    phpMyAdmin to any MySQL server. Figure 9.10 shows a connection to the MySQL connection.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_338_0.png)


    It''s important to recognize that you can connect to any data server you have
    permission to use. This data server doesn''t need to be on the same physical machine
    you are using. This is useful if you want to use phpMyAdmin to view data on a'
  merge: -1
