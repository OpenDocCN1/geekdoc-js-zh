    # Using a Hidden Field for Persistence


    The text box is convenient for this example because you can see it, but using
    a text box this way in real programs causes serious problems. Text boxes are editable
    by the user, which means she could insert any kind of information and really mess
    up your day.


    Hidden fields are the unsung heroes of server-side programming. Look at $hdndCounter
    in the source code. This hidden field also has a counter, but the user never sees
    it. However, the value of the $hdndCounter variable is sent to the PHP program
    indicated by the form''s action attribute. That program can do anything with the
    attribute, including printing it in the HTML code body.


    Very often you want to track information between pages, you store the information
    in hidden fields on the user''s page.


    ![](img/ce4ca26587e04437774a2c81d16dfb4a_139_0.png)


    The hidden fields technique shown here works fine for storing small amounts of
    information, but it is very inefficient and insecure when you are working with
    more serious forms of data.


