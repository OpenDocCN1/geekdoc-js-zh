  md: "# Listening to Regular DOM Events\n\nIf you thought the previous section was\
    \ a doozy, wait until you see what we have here. Not all DOM events have SyntheticEvent\
    \ equivalents. It might seem like you can just add the on prefix and capitalize\
    \ the event you're listening when specifying it inline in your JSX:\n\n```\nclass\
    \ Something extends React.Component {\n\n  handleMyEvent(e) {\n    // do something\n\
    \  }\n\n  render() {\n    return (\n      <div someEvent={this.handleMyEvent}>Hello!</div>\n\
    \    );\n  }\n}\n```\n\nIt doesn't work that way! For events that React doesn't\
    \ officially recognize, you have to follow the traditional approach that uses\
    \ componentWill with a few extra hoops to jump through.\n\nTake a look at the\
    \ following section of code:\n\n```\nclass Something extends React.Component {\n\
    \n  handleMyEvent(e) {\n    // do something\n  }\n\n  componentDidMount() {\n\
    \    window.addEventListener(\"someEvent\", this.handleMyEvent);\n  }\n\n  componentWillUnmount()\
    \ {\n    window.removeEventListener(\"someEvent\", this.handleMyEvent);\n  }\n\
    \n  render() {\n    return (\n      <div>Hello!</div>\n    );\n  }\n}\n```"
