  md: "# A Better Way to Transfer Properties\n\nYou just saw an example of the spread\
    \ operator to avoid having to enumerate every single item in our array as part\
    \ of passing it to a function:\n\n```\nvar items = [\"1\", \"2\", \"3\\];\n\n\
    function printStuff(a, b, c) {\n  console.log(\"Printing: \" + a + \" \" + b +\
    \ \" \" + c);\n}\n\n// using the spread operator\nprintStuff(...items);\n\n//\
    \ without using the spread operator\nprintStuff(items[0], items[1], items[2]);\n\
    ```\n\nThe situation we face in transferring properties across components is very\
    \ similar to the problem of accessing each array item individually. Allow me to\
    \ elaborate:\n\nInside a component, our props object looks like:\n\n```\nvar props\
    \ = {\n  color: \"steelblue\",\n  num: \"3.14\",\n  size: \"medium\"\n};\n```\n\
    \nAs part of passing these values to a child component, we manually access each\
    \ item from our props object:\n\n```\n<Display color={this.props.color} num={this.props.num}\
    \ size={this.props.size}/>\n```\n\nWouldn't it be great if when there was a way\
    \ to wrap an object and pass on the property/value pairs like we were able to\
    \ wrap an array using the spread operator?\nAs it turns out, there is a way. It\
    \ actually involves the spread operator as well. We explain how later, but this\
    \ means we can call the Display component by using ...this.props:\n\n```\n<Display\
    \ {...this.props} />\n```\n\nThe runtime behavior when using ...this.props is\
    \ the same as when specifying the color, num, and size properties manually. This\
    \ means our earlier example can be simplified as follows (pay attention to the\
    \ highlighted lines):\n\n```\nclass Display extends React.Component {\n  render()\
    \ {\n    return (\n```"
