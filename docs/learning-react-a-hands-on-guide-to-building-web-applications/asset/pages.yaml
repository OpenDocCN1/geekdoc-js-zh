  md: '# Transferring Properties


    Working with properties has a frustrating side. We saw a bit of this side in the
    previous chapter. Passing properties from one component to another is nice and
    simple when you''re dealing with only one layer of components. When you want to
    send a property across multiple layers of components, things start to get complicated.


    Complication is never a good thing, so in this chapter, let''s see what we can
    do to make working with properties easy across multiple layers of components.


    # Problem Overview


    Let''s say that you have a deeply nested component, and its hierarchy (modeled
    as awomely colored circles) looks like Figure 6.1.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '![](img/bba9dcf50e224bceeea9a4c4b3771b06_80_0.png)


    Figure 6.1 The component hierarchy.


    You want to pass a property from your red circle all the way down to the purple
    circles, where it will be used. What you can''t do is the very obvious and straightforward
    thing shown in Figure 6.2.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '![](img/bba9dcf50e224bceeea9a4c4b3771b06_81_0.png)


    Figure 6.2 Can''t do this.


    You can''t pass a property directly to the component or components that you want
    to target. The reason has to do with how React works. React enforces a chain of
    command in which properties have to flow down from a parent component to an immediate
    child component. This means you can''t skip a layer of children when sending a
    property. This also means your children can''t send a property back to a parent.
    All communication is one-way from the parent to the child.


    Under these guidelines, passing a property from our red circle to your purple
    circle looks a little bit like Figure 6.3.


    Every component that lies on the intended path has to receive the property from
    its parent and then render that property to its child. This process repeats until
    your property reaches its intended destination. The problem is in this receiving
    and resounding step.


    If we had to send a property called color from the component representing our
    red circle to the component representing our purple circle, its path to the destination
    would look something like Figure 6.4.'
