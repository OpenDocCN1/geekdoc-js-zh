  md: '# Styling React Content Using CSS


    Using CSS to style React content is actually as straightforward as you can imagine
    it to. Because React ends up spinning up regular HTML tags, all of the various
    CSS tricks you''ve learned over the years for styling HTML still apply. You just
    need to keep a few minor points in mind.


    # Under the Generated HTML


    Before you can use CSS, you need to get a feel for how the HTML that React spits
    out is going to look. You can easily figure out by looking at the JSX defined
    inside the render methods. The parent render method is our ReactDOM-based one,
    and it looks like:


    ```

    <div>

    <Letter>A</Letter>

    <Letter>E</Letter>

    <Letter>I</Letter>

    <Letter>O</Letter>

    <Letter>U</Letter>

    </div>

    ```


    We have our Letter components wrapped inside a div. Nothing too exciting here.
    The render method inside our Letter component isn''t that much different, either:


    ```

    <div>

    {this.props.children}

    </div>

    ```


    As you can see, each individual vowel is wrapped inside its own set of div tags.
    If you play this all out (such as viewing our example in a browser), the final
    DOM structure for our vowels would look like Figure 4.3.


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_54_0.png)


    Figure 4.3 The preview from inside the browser.'
