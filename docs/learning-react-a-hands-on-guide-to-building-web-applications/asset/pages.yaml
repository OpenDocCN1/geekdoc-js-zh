  md: "```\nvar speed1 = 85;\ntvar time1 = 1.5;\nalert(speed1 * time1);\n```\n\n```\n\
    var speed2 = 12;\ntvar time2 = 9;\nalert(speed2 * time2);\n```\n\n```\nvar speed3\
    \ = 42;\ntvar time3 = 21;\nalert(speed3 * time3);\n```\n\nIn a really chill world\
    \ that involves functions, you can condense all that duplicated text into something\
    \ simple, like the following:\n\n```\nfunction getDistance(speed, time) {\n  var\
    \ result = speed * time;\n  alert(result);\n}\n```\n\nOur distance function removes\
    \ all the duplicated code you saw earlier, and it takes speed and arguments to\
    \ allow you to customize the calculation that gets returned.\n\nTo call this function,\
    \ all you have to do is this:\n\n```\ngetDistance(10, 5);\ngetDistance(85, 1.5);\n\
    getDistance(12, 9);\ngetDistance(42, 21);\n```\n\nDoesn't this look like? Functions\
    \ provide another value, too. Your functions (such as the alert inside getDistance)\
    \ can call other functions as part of their running. Take a look at using a formatDistance\
    \ function to change what getDistance returns:\n\n```\nfunction formatDistance(distance)\
    \ {\n  return distance + \" km\";\n}\n```\n\n```\nfunction getDistance(speed,\
    \ time) {\n  var result = speed * time;\n  alert(formatDistance(result));\n}\n\
    ```\n\nThis capability to have functions call other functions enables us to cleanly\
    \ separate functions. You don't need to have one monolithic function that does\
    \ everything under the sun; you can distribute functionality across many functions\
    \ that are specialized for a particular type of task.\n\nBest of all, after you\
    \ make changes to how your functions work, you don't have to do anything extra\
    \ to see the results of those changes. If the function signature didn't change,\
    \ any existing calls to that function will magically work and automatically pick\
    \ up any new changes you made to the function itself."
