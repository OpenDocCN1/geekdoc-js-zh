- img_proc: true
  md: 'What this app isn''t very important. The only detail we''ll throw in here is
    that some of these components are responsible for managing state and transferring
    some of that state around in the form of props:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_264_0.png)'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'In an ideal setup, the data that each component needs neatly down from parent
    to child:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_265_0.png)


    Unfortunately, outside of simple scenarios, what we want to do isn''t very realistic.
    Your typical app does a lot of state generating, processing, and transferring.
    One component might initiate a state change. Another component somewhere else
    will want to react to it.'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'The props related to this state change might travel both down the tree (yay!)
    as well as up the tree (no!) to reach whatever component is relying on the data
    being transferred:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_266_0.png)


    We''ve been guilty of this quite a few times ourselves as part of communicating
    something (variable value, function/event handler reference, and so on) from child
    to parent and beyond.


    At this point, we need to acknowledge a few problems that can arise from data
    traveling willy through our components:


    +   1. **Dependencies make our code difficult to maintain.** React''s stated goal
    was to avoid spaghetti-like dependencies. When we have data flowing around our
    app, we end up with exactly what we were supposed to be free from.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Using Redux with React 253


    +   2. Each time your state changes or a prop is transmitted, all affected components
    are asked to re-render. To ensure that your UI is in sync with the current state,
    this behavior is a good thing. As we mentioned previously, many components are
    unnecessarily asked to re-render when they''re simply passing a value from parent
    to child, with no additional input. We looked at ways of minimizing this re-rendering
    by setting shouldComponentUpdate or relying on PureComponent, but both approaches
    are a hassle to keep in sync with your app''s needs evolve.


    +   3. Our component hierarchy mimics the UI, not our data needs. The way we arrange
    and nest our components separate our UI into smaller and manageable pieces. This
    is the correct approach. Despite the correctness, the components that initiate
    a state change and the ones that need to react to it are often not in the same
    parent/child/descendant arrangement (a.k.a. subtree). Similar to what we talked
    about #ii, this requires our props to travel great distances, often fully times
    per change.


    The solution to our problems is Redux. Now, Redux doesn''t fully solve all of
    these problems, but it gets us really close. Redux allows you to have all of your
    application''s state live inside its data store instead of being distributed across
    a bunch of components:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_267_0.png)'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'This approach solves several problems. If you want to share data from one part
    of your app with another, you can do that without having to navigate up and down
    your component hierarchy:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_268_0.png)


    You can initiate a state change and involve only the components that are impacted
    directly. This directness reduces a lot of overhead you would otherwise have to
    maintain to ensure that your data (and any changes to it) gets to its intended
    destination without causing unnecessary renders. Pretty cool, right?'
