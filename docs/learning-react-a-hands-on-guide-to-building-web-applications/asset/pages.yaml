    project will be created. You will want to start from a blank slate, so you''re
    going to delete a lot of things. First, delete everything inside your public folder.
    Delete everything inside your src folder. Don''t worry: You''ll fill them back
    with content you care about in a few moments, starting with your HTML file.


    Inside the public folder, create a new file called index.html. Add the following
    content into it:


