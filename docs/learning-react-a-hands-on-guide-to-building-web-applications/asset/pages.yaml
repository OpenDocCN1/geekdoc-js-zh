  md: "# Building Our Single-Page App\n\nThe way we build our app is no different\
    \ than the way \"page\" we've been building all the apps so far. We'll have a\
    \ main parent component. Each individual \"page\" of our app will be a separate\
    \ component that feeds into the main component. The React Router brings to the\
    \ table is basically choosing which components to show and which to hide. To make\
    \ this feel natural and seamless, all of this navigating is tied in with our browser's\
    \ address bar and back/forward buttons.\n\n# Displaying the Initial Frame\n\n\
    When building a SPA, the part of your page will remain static. This static part,\
    \ also referred to as an app frame, could be one invisible HTML element that acts\
    \ as the container for all of your content, or it could include some visual things\
    \ such as a header, a footer, or navigation. In our case, our app frame will be\
    \ a component that contains UI of our navigation header and an empty area for\
    \ content to load.\n\nInside our src folder, create a new file named Main.js and\
    \ add the following content into it: import React, { Component } from \"react\"\
    ;\n\n```\nclass Main extends Component {\n  render() {\n    <div>\n      <h1>Simple\
    \ SPA</h1>\n      <ul>\n        <li><a href=\"/\">Home</a></li>\n        <li><a\
    \ href=\"#stuff\">Stuff</a></li>\n        <li><a href=\"/contact\">Contact</a></li>\n\
    \      </ul>\n      <div className=\"content\"></div>\n    </div>\n  }\n}\n\n\
    export default Main;\n```\n\nTake a look at what we have here. We have a component\
    \ called Main that returns some HTML. That's it. To see what we have so far in\
    \ action, type npm start and see what's going in your browser."
