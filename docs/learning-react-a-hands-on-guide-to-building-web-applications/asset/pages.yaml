  md: '# The Initial Rendering Phase


    When your component is about to start its life and make its way to the DOM, the
    following lifecycle methods get called (see Figure 11.4).


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_142_0.png)


    Figure 11.4 The lifecycle methods called initially.


    What you saw in your console when the example was loaded was a less colorful version
    of what you saw here. Now let''s go a bit further and see more about what each
    lifecycle methods does.


    # Getting the Default Props


    This property on the component allows you to specify the default value of this.props.
    If we wanted to set a name property on our CounterParent component, it could look
    as follows:


    ```

    CounterParent.defaultProps = {

    name: "Iron Man"

    };

    ```


    This gets run before your component is even created or any props from parent components
    are passed in.'
