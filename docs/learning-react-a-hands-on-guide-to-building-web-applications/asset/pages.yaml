    \ example. If you haven't done so, save your changes across all the files you've\
    \ been working on. If you preview your app in the browser (using npm start), you\
    \ will see your counter working as expected.\n\n# Conclusion\n\nIn many ways,\
    \ Redux is designed to fix some of the shortcomings that React claims as advantages.\
    \ We looked at some of these advantages when we examined how data in React is\
    \ supposed to flow. You could go further and say that the ideas behind Redux become\
    \ formalized as part of React itself that you get even better integration. But\
    \ Redux isn't perfect, either. As with many things in programming, Redux is simply\
    \ one of many tools you have for accomplishing a task. Not every situation involving\
    \ data requires Redux; in fact, Redux can sometimes create unnecessary complexity\
    \ when you're trying to do. Dan Abramov, one of the creators of Redux, wrote a\
    \ great article (https://medium.com/@dan_abramov/you-might-not-need-redux-be46360cf367)\
    \ describing some situations where you probably shouldn't use Redux to solve your\
    \ problem. I encourage you to read that to get the full picture.\n\nNote: If you\
    \ run into any issues, ask!\nIf you have any questions or your code isn't running\
    \ like you expect, don't hesitate to ask them!\nPost on the forums at https://forum.kirupa.com\
    \ and get help from some of the friendliest and most knowledgeable people the\
    \ Internet has ever brought together!"
