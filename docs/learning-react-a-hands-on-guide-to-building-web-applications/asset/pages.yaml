    At this point, you''re done with the app....almost done with this tutorial. You
    just need to know one more thing about these awesome components that you''ve added.


    # Presentational vs. Container Components


    Given what we''ve seen so far, it seems like a good time to talk about a design
    choice that we''ve been indirectly feeding not just in this tutorial, but in other
    tutorials as well. In our React apps, we have been primarily dealing with two
    types of components:


    +   1. Components that deal with how things look: presentational components.

    2. Components that perform under-the-covers processing: routing, including a counter,
    fetching data via a HTTP request, and so on. You will see these components referred
    to as container components.


    Thinking about components in terms of whether they display something (presentational)
    or whether they feed data to other components (container) helps you organize your
    React app. For the full low-down on how to deal with these two types of components,
    check out this article by React''s Dan Abramov: https://medium.com/@dan_abramov/smart-and-dumb-components-7ca2ffa7c7d0.'
