  md: "# Chapter 9 Going from Data to UI in React\n\nWe have made up of our circleStyle\
    \ object that contains the inline properties that turn our div into an awesome\
    \ circle. All the style values are hard-coded except for the backgroundColor property,\
    \ which takes its value from the bgColor prop that gets passed in.\n\nGoing beyond\
    \ our component, we ultimately display our circle via our usual ReactDOM.render\n\
    \n```\nReactDOM.render(\n<div>\n  <Circle bgColor=\"#F9C240\"/>\n</div>,\n  destination\n\
    );\n```\n\nWe have a single instance of our Circle component declared, and we\
    \ declare it with the bgColor prop set to the color we want to appear. Now, having\
    \ our Circle component defined as inside our render method is a bit limiting,\
    \ especially if we're going to be dealing with data that could affect our Circle\
    \ component does. In the next couple sections, we'll look at the ways we have\
    \ for that:\n\n# Your JSX Can Be Anywhere, Part II\n\nIn Chapter 7, \"Meet JS...Again\"\
    , you learned that JSX can actually live outside a render function and can be\
    \ used as a value assigned to a variable or property. For example, we can fearlessly\
    \ something like this:\n\n```\nvar theCircle = <Circle bgColor=\"#F9C240\" />;\n\
    ```\n\n```\nReactDOM.render(\n<div>\n  {theCircle}\n</div>,\n  destination\n);\n\
    ```\n\nThe Circle variable stores the JSX for instantiating our Circle. Evaluating\
    \ this variable inside our ReactDOM.render function results in a circle getting\
    \ displayed. The end result is no different than what we had earlier, but freeing\
    \ our Circle component instantiation from the shackles of the render method gives\
    \ us more options to do crazy and cool things.\n\nFor example, you can go and\
    \ create a function that returns a Circle component:\n\n```\nfunction showCircle()\
    \ {\n  var colors = [\"#393E61\", \"#E94F37\", \"#A1D363\\];\n  var ran = Math.floor(Math.random()\
    \ * colors.length);\n\n  // return a Circle with a randomly chosen color\n  return\
    \ <Circle bgColor={colors[ran]} />;\n}\n```"
  merge: -1
  pgno: 116
- img_proc: true
  md: "# Dealing with Arrays 103\n\nIn this case, the showCircle function returns\
    \ a Circle component (boring!) with the value for the bgColor prop set to a random\
    \ color value (awesome sauce!). Here to have our example the showCircle function,\
    \ all you have to evaluate it inside ReactDOM.render.\n\n```\nReactDOM.render(\n\
    <div>\n  {showCircle()}\n</div>,\ndestination\n);\n```\n\nAs long as the expression\
    \ you're returning JX, you can put pretty anything you want inside the { and }\
    \ brackets. That is really nice because you can do a lot when your JavaScript\
    \ lives outside the render function.\n\n# Dealing with Arrays\n\nNow we get to\
    \ some fun stuff! When you're displaying multiple components, you can't always\
    \ manually specify them:\n\n```\nReactDOM.render(\n<div>\n  {showCircle()}\n \
    \ {showCircle()}\n  {showCircle()}\n</div>,\ndestination\n);\n```\n\nIn real-world\
    \ scenarios, the number of components you display is related to the number of\
    \ items in an array or arraylike (an iterator) object you're working with. That\
    \ brings up a few simple complications. For example, let's say we have an array\
    \ that colors looks as:\n\n```\nvar colors = [\"#393841\", \"#E94F37\", \"#1C89BF\"\
    , \"#A1D363\", \"#85FFC7\", \"#297373\", \"#FF8552\", \"#A40E4C\"];\n```\n\nWe\
    \ want to create a Circle component for each item in this array (and set the bgColor\
    \ prop to the value of each array). We can do this by creating an array of components:\n\
    \n```\nvar colors = [\"#393841\", \"#E94F37\", \"#1C89BF\", \"#A1D363\", \"#85FFC7\"\
    , \"#297373\", \"#FF8552\", \"#A40E4C\"];\n```\n\n```\nvar renderData = [];\n\
    for (var i = 0; i < colors.length; i++) {\n  renderData.push(<Circle bgColor={colors[i]}\
    \ />);\n}\n```"
