  md: "Go ahead and add these highlighted lines to our example. Inside our componentDidMount\
    \ method that gets called after our component gets rendered, we have our setInterval\
    \ timerTick function every second (or 1000 milliseconds).\n\nWe haven't defined\
    \ our timerTick function, so let's fix that by adding the following highlighted\
    \ lines to our code:\n\n```\nclass LightningCounter extends React.Component {\n\
    \  constructor(props) {\n    super(props);\n\n    this.state = {\n      strikes:\
    \ 0\n    };\n  }\n\n  timerTick() {\n    this.setState({\n      strikes: this.state.strikes\
    \ + 100\n    });\n  }\n\n  componentDidMount() {\n    setInterval(this.timerTick,\
    \ 1000);\n  }\n\n  render() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n}\n```\n\nWhat our timerTick function does is pretty simple: it\
    \ just calls setState. The setState method comes in various flavors, but for what\
    \ we're doing here, it just takes an object as its argument. This object contains\
    \ all the properties you want to merge into the state object. In our case, we\
    \ are specifying the strikes property and setting its value to be 100 more than\
    \ what it is currently."
