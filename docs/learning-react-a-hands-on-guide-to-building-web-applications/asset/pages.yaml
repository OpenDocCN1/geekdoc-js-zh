  md: "# Chapter 18 Creating a Single-Page App in React Using React Router\n\nThat's\
    \ the last of the content we're going to add. If you take a look at what you're\
    \ adding, you'll see that these components can't get any simpler. They just return\
    \ some boilerplate JSX content. Be sure to save all your changes to these three\
    \ files. We'll look at how to make them useful shortly.\n\n# Using React Router\n\
    \nWe have our app in the form of our Main component. We have our content pages\
    \ represented by the Home, Stuff, and Contact components. Now we need to tie all\
    \ of these together to create our app. This is where React Router comes in. To\
    \ start it, go back to Main.js and ensure that your import statements look out\
    \ as follows:\n\n```\nimport { Component } from \"react\";\nimport {\n  Route,\n\
    \  NavLink,\n  HashRouter\n} from \"react-router-dom\";\nimport Home from \"./Home\"\
    ;\nimport Stuff from \"./Stuff\";\nimport Contact from \"./Contact\";\n```\n\n\
    We are importing Route, NavLink, and HashRouter from the react-router-dom NPM\
    \ package earlier. In addition, we're importing our Home, Stuff, and Contact components\
    \ because we'll be referencing them as part of loading our content.\n\nReact Router\
    \ works by defining what I call a routing region. Inside this region are two things:\n\
    \n+   1. Your navigation links\n2. The container to load your content into\n\n\
    There's a close correlation between the URL your navigation links specify and\
    \ the content that ultimately gets loaded. There's no way to easily explain this\
    \ without getting our hands dirty and implementing what you just read.\n\nThe\
    \ first thing to define is the routing region. Inside our Main component's render\
    \ method, add the following highlighted lines:\n\n```\nclass Main extends Component\
    \ {\n  render() {\n    return (\n      <HashRouter>\n        <div>\n        <h1>Simple\
    \ SPA</h1>\n        <ul className=\"header\">\n          <li><a href=\"/\">Home</a></li>\n\
    \          <li><a href=\"/Stuff\">Stuff</a></li>\n          <li><a href=\"/contact\"\
    >Contact</a></li>\n        </ul>\n        </div>\n      </HashRouter>\n    )\n\
    \  }\n```"
  merge: -1
  pgno: 244
- img_proc: true
  md: "# Building Our Single-Page App\n\n```\n<div className=\"content\">\n\n</div>\n\
    </div>\n<HashRouter>\n);\n}\n```\n\nThe HashRouter component provides the foundation\
    \ for the navigation and browser history handling that routing is made of. Next\
    \ we need to define our navigation links. We already have list elements with the\
    \ element defined. We need to replace them with the more specialized NavLink component,\
    \ so go ahead and make the following highlighted changes:\n\n```\nclass Main extends\
    \ Component {\n  render() {\n    <HashRouter>\n      <div>\n        <h1>Simple\
    \ SPA</h1>\n        <ul>\n          <li><NavLink to=\"/home\">Home</NavLink></li>\n\
    \          <li><NavLink to=\"/stuff\">Stuff</NavLink></li>\n          <li><NavLink\
    \ to=\"/contact\">Contact</NavLink></li>\n        </ul>\n        <div className=\"\
    content\">\n\n        </div>\n      </div>\n    </HashRouter>\n  }\n}\n```\n\n\
    For each link, pay attention to the URL we're telling our router to navigate to.\
    \ This URL value (defined by the to prop) acts as an identifier to ensure that\
    \ the right content gets loaded. We match the link with the content using a Route\
    \ component. Go ahead and add the following highlighted changes:\n\n```\nclass\
    \ Main extends Component {\n  render() {\n    <HashRouter>\n      <div>\n    \
    \    <h1>Simple SPA</h1>\n        <ul>\n          <li><NavLink to=\"/home\">Home</NavLink></li>\n\
    \          <li><NavLink to=\"/stuff\">Stuff</NavLink></li>\n          <li><NavLink\
    \ to=\"/contact\">Contact</NavLink></li>\n        </ul>\n</ul>\n```"
  merge: -1
