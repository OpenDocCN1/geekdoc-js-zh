- img_proc: true
  md: "# Chapter 18 Creating a Single-Page App in React Using React Router\n\n```\n\
    <div className=\"content\">\n  <Route path=\"/\" component={Home}/>\n  <Route\
    \ path=\"/stuff\" component={Stuff}/>\n  <Route path=\"/contact\" component={Contact}/>\n\
    </div>\n</Router>\n);\n```\n\nAs you see, the Route component contains a path\
    \ prop. The value you specify for the path determines when this route is going\
    \ to be active. When a route is active, the component specified by the component\
    \ (whose path is /stuff as set by the NavLink component's prop), the route whose\
    \ path value is also /stuff becomes active. This means the content of your component\
    \ get rendered.\n\nYou can see all of this for yourself. Jump back to your browser\
    \ to see the live updates or run npm start again. Something seems off, though,\
    \ right? Click on the links to see the content loading and in. The content for\
    \ our home page seems to always display even if we're clicking on the Stuff or\
    \ Contact links:\n\n![](img/bba9dcf50e224bceeea9a4c4b3771b06_246_0.png)"
  merge: -1
  pgno: 246
- img_proc: true
  md: "That seems problematic. We'll look at how to fix that and do many more little\
    \ housekeeping tasks in the next section when we go one level deeper into using\
    \ React Router.\n\n# It's the Little Things\n\nIn the previous section, we got\
    \ our SPA mostly up and running. We just wrapped our entire routing region inside\
    \ a HashRouter component, and we separated our links and the place our links by\
    \ using NavLink and Route components, respectively. Getting our example mostly\
    \ up and running and fully up and running are two different things. In the following\
    \ sections, we'll close those differences.\n\n# Fixing Our Routing\n\nWe ended\
    \ the previous section by determining that our routing has a bug in it. The contents\
    \ of our Home component are always displaying because the path for loading our\
    \ Home component is /. Our Route and Contact components have the character as\
    \ part of their paths as well. This means our Home always matches whatever we\
    \ are trying to navigate. The fix for that is simple: In the Route component representing\
    \ our Home content, add the exact prop as shown here:\n\n```\n<div className=\"\
    content\">\n  <Route path=\"/\" component={Home} />\n  <Route path=\"stuff\" component={Stuff}\
    \ />\n  <Route path=\"/contact\" component={Contact} />\n</div>\n```\n\nThis prop\
    \ ensures that the Route is only active if the path is an exact match for what\
    \ is being loaded. If you preview your app now, you'll see that the content loads\
    \ correctly, and the Home component displaying only when we are in the Home view.\n\
    \n# Adding Some CSS\n\nRight now, our app is completely unfinished. The fix for\
    \ that is easy. In your src folder, create a file named index.css and add the\
    \ following style rules into it:\n\n```\nbody {\n  background-color: #FFCC00;\n\
    \  padding: 20px;\n  margin: 0;\n}\nh1, h2, p, ul, li {\n  font-family: sans-serif;\n\
    }\n```"
  merge: -1
  pgno: 247
- img_proc: true
  md: "```\nul.header li {\n  display: inline;\n  list-style-type: none;\n  margin:\
    \ 0;\n}\nul.header {\n  background-color: #111;\n  padding: 0;\n}\nul.header li\
    \ a {\n  color: #FFF;\n  font-weight: bold;\n  text-decoration: none;\n  padding:\
    \ 20px;\n  display: inline-block;\n}\n.content {\n  background-color: #FFF;\n\
    \  padding: 20px;\n}\n.content h2 {\n  padding: 0;\n  margin: 0;\n}\n.content\
    \ li {\n  margin-bottom: 10px;\n}\n```\n\nNow, we need to reference this stylesheet\
    \ in our app. At the top of index.js, add the import statement to do that with:\n\
