  md: "```\nbackgroundColor: \"#FFDE00\",\ncolor: \"#333\",\ndisplay: \"inline-block\"\
    ,\nfontFamily: \"monospace\",\nfontSize: 32,\ntextAlign: \"center\";\n```\n\n\
    ```\nreturn (\n  <div>\n    {this.props.children}\n  </div>\n);\n```\n\nWe have\
    \ an object called letterStyle and the properties inside it are just CSS property\
    \ names and their value. If you've never defined CSS properties in JavaScript\
    \ (by object.style), the formula for converting them into JavaScript-friendly\
    \ is pretty simple:\n\n+   1. Single-word CSS properties (such as padding, margin,\
    \ and color) remain unchanged.\n2. Multiword CSS properties with a dash (such\
    \ as background-color, font-family, and border-radius) are turned into one camel-case\
    \ word, with the dash removed and the first letter of the second capitalized.\
    \ For example, using our example properties, background-color becomes backgroundColor,\
    \ font-family becomes fontFamily, and border-radius becomes borderRadius.\n\n\
    Our letterStyle object and its properties are pretty a direct JavaScript translation\
    \ of the .letter style rule we looked a few moments ago. All that remains now\
    \ is to assign this object to the element we want to style.\n\n# Actually Styling\
    \ Our Content\n\nNow that we have our object containing styles we want to apply,\
    \ the rest is easy. Find the element you want to apply the style on and the style\
    \ attribute to refer to that object. In our case, that is the div element returned\
    \ by Letter component's render function.\n\nTake a look at the highlighted line\
    \ to see how this is done for our example:\n\n```\nclass letter extends React.Component\
    \ {\n  render() {\n    var letterStyle = {\n      padding: 10,\n      margin:\
    \ 10,\n      backgroundColor: \"#FFDE00\",\n```"
