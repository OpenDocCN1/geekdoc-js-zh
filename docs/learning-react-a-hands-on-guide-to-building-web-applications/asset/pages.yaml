  md: "# Creating Our HelloWorld App\n\nNow that you've gotten a better idea of what\
    \ this project is doing, let's modify the example. We want to display the words\
    \ Hello, world! to our screen. We'll go about this by creating a component, appropriately\
    \ called HelloWorld, to handle it for you. The new part in this isn't that you\
    \ get some to display; you're a pro at this point. The part to focus on is how\
    \ to structure the files in your project to ensure that you're creating your app\
    \ right way.\n\nTo started from your src directory and delete all the files you\
    \ see there. Then create a new file called index.js. Start with the following\
    \ contents:\n\n```\nimport React from \"react\";\nimport ReactDOM from \"react-dom\"\
    ;\nimport HelloWorld from \"HelloWorld\";\n```\n\n```\nReactDOM.render(\n  <HelloWorld/>,\n\
    \  document.getElementById(\"root\")\n);\n```\n\nWe're importing React and ReactDOM\
    \ modules here. We're also importing a component called HelloWorld that we are\
    \ specifying in the ReactDOM.render call. That component doesn't exist, so we\
    \ are going to fix that.\n\nIn the same src directory that you're right now, create\
    \ a file called HelloWorld.js. Then go ahead and modify it by adding the following:\n\
    \n```\nimport React, { Component } from \"react\";\n```\n\n```\nclass HelloWorld\
    \ extends Component {\n  return (\n    <div className=\"helloContainer\">\n  \
    \    <h1>Hello, world!</h1>\n    </div>\n  );\n}\n\nexport default HelloWorld;\n\
    ```\n\nTake a moment to look through what you've added. You shouldn't see anything\
    \ really exciting on here—a boring import statement, the HelloWorld component\
    \ that prints some text to the screen, and (in the last line) code that tags your\
    \ HelloWorld component for export-so that it can be imported by another module,\
    \ such as index.js.\n\nWith these changes, we can test the application. Make sure\
    \ you've saved all your changes. Go back to the command line and type in npm start.\
    \ If your app was already running behind"
