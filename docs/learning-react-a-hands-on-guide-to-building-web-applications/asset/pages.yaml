- img_proc: true
  md: "# Simplifying Further with ES6 Arrow Functions\n\nLearning React is hard enough,\
    \ so I've tried to avoid forcing you to use ES6 techniques by default. When it\
    \ comes to working with the ref attribute, using arrow functions to deal with\
    \ the callback function simplifies a bit. This is one of those cases for which\
    \ I recommend you use an ES6 technique.\n\nAs you saw few months ago, to assign\
    \ a property on your component to the referenced HTML element, we did something\
    \ like this:\n\n```\n<input\n  ref={\n    function(el) {\n      self._input =\
    \ el;\n    }\n  }\n/>\n```\n\nTo deal with context shenanigans, we created a self\
    \ variable initialized to this, to ensure we created the _input property on our\
    \ component. That seems unnecessarily messy.\nUsing arrow functions, we can simplify\
    \ all of this down to just the following:\n\n```\n<input\n  ref={\n    (el) =>\
    \ this._input = el\n  }\n/>\n```\n\nThe end result is identical to what we spent\
    \ all this time looking at. Because of arrow functions deal with context, you\
    \ can use this function body and reference the component without doing any extra\
    \ work. No need for an outer self equivalent!\n\n# Using Portals\n\nYou need to\
    \ be aware of one DOM-related trick. So far, we've been dealing with HTML only\
    \ in the context of what JSX generates, either from a single component or combined\
    \ through many components. We are limited by the DOM hierarchy our parent components\
    \ impose on us. Having arbitrary access to any DOM element anywhere on the page\
    \ doesn't seem possible. Or is it? As it turns out, you can choose to render your\
    \ JSX to any DOM element anywhere on the page; you're limited to just sending\
    \ your JSX to a parent component. The magic behind this wizardry is a feature\
    \ known as portals.\n\nThe way we use a portal is very similar to what we do with\
    \ our ReactDOM.render method. We specify the JSX we want to render, and we specify\
    \ the DOM element we want to render to."
  merge: -1
  pgno: 157
