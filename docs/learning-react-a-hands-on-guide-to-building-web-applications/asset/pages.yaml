  md: '# Building Your First React App


    Thanks to the previous chapter, you probably now know all about the backstory
    of React and how it helps even your most complex user interfaces sing. For all
    the awomeness that React brings to the table, getting started with it (kind of
    like this sentence) is not the most straightforward. It has a steep learning curve
    filled with many small and big hurdles, as in Figure 2.1.


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_27_0.png)


    In this chapter, we start at the very beginning and get our hands dirty by building
    a simple React app. You''ll encounter some of these hurdles head-on, and some
    of these hurdles you''ll skip over—for now. By the end of this chapter, not only
    will you have built something you can proudly show off to your friends and family,
    but you''ll set yourself up nicely for diving deeper into all that React offers
    in future chapters.'
