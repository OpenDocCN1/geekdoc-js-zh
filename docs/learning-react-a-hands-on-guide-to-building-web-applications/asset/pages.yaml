  md: '# Chapter 4 Styling in React


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_60_0.png)


    Figure 4.5 Our vowels with background colors!


    What we''ve just done will be very hard to replicate using plain CSS. As we start
    to look at components whose contents change based on state or user interaction,
    you''ll see more much examples in which the React way of styling things has a
    lot of merit.


    # Conclusion


    As you dive in and learn more about React, you''ll see several cases in which
    React things quite differently than what you''ve told is correct on the web. In
    this tutorial, you saw React promoting inline styles in JavaScript as a way to
    style content instead of using CSS style rules. Earlier, we looked at JSX and
    showed how to clear the entirety of the UI in JavaScript using an XML-like syntax
    that sort of, kind of looks like HTML.


    In all of these, if you look deeper beneath the surface, the React diverges from
    conventional wisdom made a lot of sense. Building apps with their very complex
    UI requirements necessitate a new way of solving the challenges. HTML, CSS, and
    JavaScript techniques that made a lot of sense when dealing with pages and documents
    might not be applicable in a web-app where components are reused inside other
    components.


    With that, you need to pick and choose the techniques that make the most sense
    for your situation. I''m biased toward React''s way of solving UI development
    problems, but I do my best to highlight alternate or conventional methods as well.
    Tying back to what you saw here, using CSS rules with your React content is totally
    okay, as long as you make the decision knowing what you gain and what you lose.


    > * If you run into any issues, ask!

    If you have any questions or your code isn''t running like you expect, don''t
    hesitate to ask!

    Post on the forums at https://forum.kirupa.com and get help from some of the friendliest
    and most knowledgeable people the Internet has ever brought together!'
