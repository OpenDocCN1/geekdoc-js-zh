  md: "Going back to our code, we have created a new component called HelloWorld.\
    \ This is a component because it extends React.Component. If it didn't do that,\
    \ it would be an empty class that doesn't do much. Inside our class, you can put\
    \ all sorts of methods to define what HelloWorld does. Some methods that you define\
    \ are special, and React uses them to help your components work. One such mandatory\
    \ property is render.\n\nGo ahead and modify our HelloWorld component by adding\
    \ the render method, as shown:\n\n```\nclass HelloWorld extends React.Component\
    \ {\n  render() {\n    }\n}\n```\n\nJust like the render method you saw a few\
