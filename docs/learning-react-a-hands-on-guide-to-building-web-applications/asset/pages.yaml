  md: "# More Evening Shenanigans 117\n\nNo matter how you slice and dice, none of\
    \ it matters. It doesn't matter how simple or obvious the HTML we're returning\
    \ via a component looks. You simply can't listen for events them directly. This\
    \ is because components are wrappers for DOM elements. What does it mean to listen\
    \ for an event on a component? When your component gets unwrapped into DOM elements,\
    \ does the outer HTML element act the thing you're listening for? Is it some other\
    \ element? How do you年纪 listening for an event and declaring a prop for listening?\n\
    \nThere's no clear answer to any of those questions, either. Frankly, there's\
    \ a workaround: We can treat the event handler as a prop and pass it to the component.\
    \ Inside the component, we can assign the event to a DOM element and set the event\
    \ handler to the value of the prop we just passed. I realize that probably makes\
    \ no sense, so let's walk through an example.\n\nTake a look at the following\
    \ highlighted line:\n\n```\nclass CounterParent extends React.Component {\n\n\
    \  render() (\n    <div>\n      <Counter display={this.state.count} />\n     \
    \ <PlusButton onClick={this.increase} />\n    </div>\n  );\n}\n```\n\nIn this\
    \ example, we create a property called clickHandler whose value is the increase\
    \ handler. Inside our PlusButton component, we can then do something like:\n\n\
    ```\nclass PlusButton extends React.Component {\n  render() (\n    <button onClick={this.props.clickHandler}>\n\
    \      +\n    </button>\n  );\n}\n```\n\nOn our button element, we specify the\
    \ onClick event and set its value to the onClick prop. At runtime, this prop gets\
    \ evaluated via the increase function, and clicking the plus button ensures that\
    \ the increase function gets called. This solves our problem while still allowing\
    \ our component to participate in all this event goodness."
