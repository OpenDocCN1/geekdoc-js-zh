- img_proc: true
  md: "# Setting the Initial Value\n\nWe need a variable to act as our counter. Let's\
    \ call this variable strikes. We have a bunch of ways to create this variable,\
    \ but the most obvious one is the following:\n\n```\nvar strikes = 0; // :\n```\n\
    \nWe don't want to do that, though. For our example, the strikes variable is part\
    \ of our component's state. We want to create a state object, make our strikes\
    \ variable a property of it, and ensure that we set all of up when our component\
    \ is created. The component we want to do all of this to is LightningCounter Go\
    \ ahead ahead add the following highlighted lines:\n\n```\nclass LightningCounter\
    \ extends React.Component {\nconstructor(props) {\nthis.state = {\n  strikes:\
    \ 0\n};\n}\nnrender() {\nreturn (\n<h1>Hello!</h1>\n);\nn}\n```\n\nWe specify\
    \ our state object inside the LightningCounter component's constructor. This runs\
    \ way before your component gets rendered. We're telling React to set an object\
    \ containing our strikes property (initialized to 0).\n\nIf we inspect the value\
    \ of our state object after this code runs, it looks something like the following:\n\
    \n```\nvar state = {\nstrikes: 0\n}\n```\n\nBefore we wrap up this section, let's\
    \ visualize the strikes property. In our render method, make the following highlighted\
    \ change:\n\n```\nclass LightningCounter extends React.Component {\nconstructor(props)\
    \ {\nsuper(props);\n```\n\n```\nthis.state = {\n  strikes: 0\n}\n```"
  merge: -1
