  md: "```\nReactDOM.render(\n<Provider store={store}>\n<App />\n</Provider>\ndest\n\
    );\n```\n\nTake a moment to look at what we're doing here. We're first initializing\
    \ the Redux store and using our trustworthy createStore method that takes a reducer\
    \ as its argument. Our reducer is referenced by the counter variable, and if you\
    \ look at our import statements, it is defined in a file called reducer.js. We'll\
    \ deal with that in a few moments.\n\nAfter creating our Store, we provide it\
    \ as a prop to our Provider component. The Provider component is intended to be\
    \ used as the outermost component in our app, to help ensure that every component\
    \ has access to the Redux store and reactive functionality:\n\n```\nReactDOM.render(\n\
    <Provider store={store}>\n<App />\n</Provider>\n);\n```\n\nNext, let's create\
    \ our reducer. You already saw that our reducer is referenced by the counter variable\
    \ and lives inside a file called reducer.js—which doesn't exist. Let's fix that\
    \ by first creating a file called reducer.js in the src folder. After you have\
    \ created this file, add the following JavaScript into it:\n\n```\n// Reducer\n\
    function counter(state, action) {\n  if (state === undefined) {\n    return {\
    \ count: 0 };\n  }\n\n  var count = state.count;\n\n  switch (action.type) {\n\
    \    case \"increase\":\n      return { count: count + 1 };\n    case \"decrease\"\
    :\n      return { count: count - 1 };\n    default:\n      return state;\n  }\n\
    }\n\nexport default counter;\n```"
