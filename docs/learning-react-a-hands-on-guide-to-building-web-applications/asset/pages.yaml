  md: "Now let's take a few minutes to look at what our existing code does. First,\
    \ we have a component-called LightningCounterDisplay. The bulk of this component\
    \ is the divStyle object, which contains the styling information responsible for\
    \ the cool rounded background. The return function returns a div element that\
    \ wraps the LightningCounter component.\n\nThe LightningCounter component is where\
    \ all the action will take place:\n\n```\nclass LightningCounter extends React.Component\
    \ {\n  render() {\n    return (\n      <h1>Hello!</h1>\n    );\n  }\n}\n```\n\n\
    As it is right now, this component has nothing interesting going for it. It returns\
    \ the word Hello! That's okay—we'll fix this up in component later.\n\nThe last\
    \ thing to look at is our ReactDOM.render method:\n\n```\nReactDOM.render(\n \
    \ <LightningCounterDisplay/>,\n  document.querySelector(\"#container\")\n);\n\
    ```\n\nIt pushes the LightningCounterDisplay component to our container element\
    \ in our DOM. That's pretty much. The end is the combination of markup from our\
    \ ReactDOM. render method and the LightningCounterDisplay and LightningCounter\
    \ components.\n\n# Getting Our Counter On\n\nNow that you have an idea of what\
    \ we're starting with, its time to make plans for our next steps. The way our\
    \ counter works is pretty simple. We're going to be using a setInterval function\
    \ that calls code every 1000 milliseconds (a.k.a. 1 second). That \"some code\"\
    \ is going to increment a value by 100 each time it's called. Seems pretty straightforward,\
    \ right?\n\nTo make this all, we're relying on three APIs that our React component\
    \ exposes:\n\n+   1. componentDidMount\nThis method gets called just after our\
    \ component gets rendered (or mounted, React calls it).\n\n+   2. setState\nThis\
    \ method allows you to update the value of the state object.\n\nYou'll see these\
    \ APIs in use shortly, but here you get a preview so that you can spot them easily\
    \ in a lineup."
