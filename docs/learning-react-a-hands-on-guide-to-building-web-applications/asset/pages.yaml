- img_proc: true
  md: '# Optimizing render Calls


    component. That just sort happened automatically. Let''s get more precise. Three
    things cause a render method to automatically get called:


    +   1. A prop that lives on your component gets updated.

    2. A state property that lives on your component gets updated.

    3. A parent component''s render method gets called.


    All of these cases seem like good examples of when we want our component''s render
    method to be automatically called. After all, all of these cases could cause your
    visual state to change, right?


    The answer is well, it depends! Very often, components find themselves forced
    to re-render even when the prop or state that changed has absolutely nothing to
    do with them. In some situations, a parent component is correctly rendering or
    re-rendering, but that is localized to that component. There''s no need to ask
    the child components to re-render for something that doesn''t affect them.


    Now, I might be painting an alarming picture of unnecessary work that has been
    going right under our noses. One point to keep in mind that a render method being
    called is not the same thing as the DOM getting updated. React takes a few additional
    steps in which the DOM diff (that is, the previous version is compared with the
    new/current version) to see if any changes need to be represented. All of these
    "few additional steps" means work, and more complex apps with a lot of components
    will face many instances that will start to add up. In our render methods; we
    often have a lot of code to help generate the appropriate JSX. Rarely do our render
    method return a static piece of JSX with does our render method return a static
    piece of JSX with no evaluation or calculation handling, so minimizing unnecessary
    render calls is a good thing.


    # Optimizing render Calls


    Now we''ve looked at the problem, let''s examine some approaches we can use to
    ensure that we''re calling a component''s render method only when absolutely necessary.
    The following sections walk you through this.


    # Getting an Example Going


    To help make sense of this, we''re going to look at an example. It''s not just
    any example, either. We''ll revisit our sliding menu that we created earlier.
    If you have it, go ahead and open it in your code editor.


    If you don''t have the project, that''s okay. Use create-react-app to create a
    new React project and overwrite everything in your src and public folders with
    the contents from the Sliding Menu Github repo:'
