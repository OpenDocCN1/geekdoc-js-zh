- img_proc: true
  md: '# Conclusion


    Most of the time, everything you want to do be within arm''s reach of the JSX
    you''re writing. Sometimes, though, you need to break free from the box React
    puts you in. Even though we''re creating is rendering to a HTML document, our
    React app is like a self-sufficient tropical island within the document; you never
    quite see the actual HTML that lies beneath the sands. To help you see both the
    HTML inside the island and make contact with things that live outside the island,
    we looked at two features, refs and portals. Refs allow you to cut through and
    access the underlying HTML element beneath the JSX. Portals allow you to render
    your content to any element in the DOM that you have access to. Between these
    two solutions, you should be able to easily address any need that you have to
    deal with regards to the DOM directly.


    > Note: If you run into any issues, ask!

    If you have any questions or your code isn''t running like you expect, don''t
    hesitate to ask!

    Post on the forums at https://forum.kirupa.com and get help from some of the friendliest
    and most knowledgeable people the Internet has ever brought together!'
