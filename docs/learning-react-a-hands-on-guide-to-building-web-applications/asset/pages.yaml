  md: '# Chapter 16 Creating a Sliding Menu in React


    We set our menu''s position to fixed. This single change gives our menu a whole
    lot of magical capabilities. For starters, it ensures that normal layout rules
    no longer apply to it. We can position our menu anywhere using normal x and y
    values, and the menu won''t shift from we have positioned. If that isn''t awesome
    enough, our menu won''t display a scrollbar if we happen to hide it somewhere.


    All this is good thing because we hide our menu offscreen using our menu''s left
    and top properties to 0 and setting our menu transform to a translate3d method
    with a horizontal value of -100vw. The negative value ensures that we shift the
    menu left by the amount equivalent to our browser window'' width. While not directly
    related to position, the size of our menu plays an important role well. That''s
    why, in this snippet, we use the width and height properties with values of 100vw
    and 100vh, respectively, to ensure that our menu is the size as our browser window.


    # What Are vw and vh Units


    If you never seen the vw and vh units, they stand for viewport width (vw) and
    viewport height (vh). They''re a bit like percentage values. Each unit is 1/100th
    the width or height of your viewport (which we simply calling the browser window).
    For example, a value of 100vw means that its is the full width of our browser
    window. Similarly, 100vh refers to a value that is the full height of our browser
    window.


    When the menu is called to slide into view, we shift the menu until its horizontal
    position is the same as our browser window origin. If we had to look at the CSS
    for it might look like, this would be an easy change from what we already have.
    We simply set our transformproperty'' translate3d method and set the horizontal
    position to a value of 0vw.


    That might look like this:


    ```

    transform: translate3d(0vw, 0, 0);

    ```


    This ensures that our menu is shifted right from being hidden offscreen (with
    a horizontal-zantal value of -100vw) and is now visible. When our menu disappears,
    we can translate it by:


    ```

    transform: translate3d(-100vw, 0, 0);

    ```


    The best thing haven''t spoken about is the animation that makes the sliding look
    cool. This is done using a simple CSS transition that animates the transform property:


    ```

    transition: transform .3s cubic-bezier(0, .52, 0, 1);

    ```


    If''re not familiar with CSS transitions, it''s a very simple concept to wrap
    your brain around. I don''t explain it, so take a few moments and read through
    the short Introduction of CSS Transitions article (https://www.kirupa.com/html5/introduction_css_transitions)
    for an overview.'
