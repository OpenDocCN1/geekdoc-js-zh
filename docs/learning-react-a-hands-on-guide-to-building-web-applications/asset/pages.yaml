  md: "# Managing React State with Redux 265\n\nOur Counter component gets access\
    \ to increaseCount, decreaseCount, and countValue.\nThe only strange thing is\
    \ there's no render function or equivalent in sight. All of that is handled automatically\
    \ by React and its treatment of HOC.\n\nWe're almost done! Its time to get our\
    \ Counter component up and running. In our directory, add a file named Counter.js.\
    \ Put the following into it:\n\n```\nimport React, { Component } from \"react\"\
    ;\n\nclass Counter extends Component {\n  render() {\n    return (\n      <div\
    \ className=\"container\">\n        <button className=\"buttons\"\n          onClick={this.props.decreaseCount}></button>\n\
    \        <span>{this.props.count}</span>\n        <button className=\"buttons\"\
    \n          onClick={this.props.increaseCount}>></button>\n      </div>\n    );\n\
    \  }\n}\n\nexport default Counter;\n```\n\nThis will probably be the most boring\
    \ boring component you've seen in quite some time. We've already talked about\
    \ how our Connect HOC sends down props and other related shenanigans to our Counter\
    \ component. You can see those props in use here to display the counter value\
    \ or call the appropriate function when we plus or minus are clicked.\n\nThe last\
    \ thing we need to do is define our CSS file to style our component. In the src\
    \ folder we've been working in time create a file named index.css. Inside this\
    \ file, add the following styles:\n\n```\nbody {\n  margin: 0;\n  padding: 0;\n\
    \  font-family: sans-serif;\n  display: flex;\n  justify-content: center;\n  background-color:\
    \ #8B7C93;\n}\n\n.container {\n  background-color: #FFF;\n  margin: 100px;\n \
    \ padding: 10px;\n  border-radius: 3px;\n  width: 200px;\n}\n```"
