    \ library. Just below these two script tags, add the following line:\n\n```\n\
    <script src=\"https://unpkg.com/babel-standalone@6.15.0/babel.min.js\"></script>\n\
    ```\n\nHere you're adding a reference to the Babel JavaScript compiler (http://babeljs.io/).\
    \ Many cool things, but the one we care about is its capability to turn JSX into\
    \ JavaScript."
