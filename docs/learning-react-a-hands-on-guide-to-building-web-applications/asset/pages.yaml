  md: "# Removing Items\n\nAt this point, we can add items and see them appear. What\
    \ we can't do is remove items after they've been added. We're going to allow users\
    \ to remove items by clicking on them directly. This seems straightforward to\
    \ implement, right? The only thing to watch out for involves where to put all\
    \ our code. The items we click on are defined in. The actual logic for populating\
    \ the items lives in our state object in Todo.js. To give you a preview of what\
    \ to expect, we will be parting in some shenanigans as we pass things between\
    \ both of components.\n\nFirst we need to set up the event handler for dealing\
    \ the click event. Change the return statement under createTasks to look as follows:\n\
    \n```\ncreateTasks(item) {\n  return <li onClick={() => this.delete(item.key)}>{item.text}</li>\n\
    }\n```\n\nWe're simply listening to the click event and associating it with an\
    \ event handler called delete. Because of how event arguments and event handlers\
    \ deal with scope, we will work around all these issues using an arrow function\
    \ that allows us both to maintain the default event argument and pass in out our\
    \ arguments. If this seems bizarre, you can feel better knowing that this is a\
    \ JavaScript quirk and has nothing to do with React.\n\nAfter you've made this\
    \ change, we need to define the delete event handler. Make the following highlighted\
    \ changes:\n\n```\nclass TodoItems extends Component {\n  constructor(props) {\n\
    \    super(props);\n\n```\n\n```\nthis.createTasks = this.createTasks.bind(this);\n\
    }\n```\n\n```\ndelete(key) {\n  this.props.delete(key);\n}\n```\n\nWe define a\
    \ function called delete that takes our argument for the item key. To ensure that\
    \ this resolves properly, we explicitly bind this in the constructor. Notice that\
    \ our delete function doesn't actually do any deleting. It just calls another\
    \ delete function passed into this component via props. We'll work backward from\
    \ here and deal with that next."
