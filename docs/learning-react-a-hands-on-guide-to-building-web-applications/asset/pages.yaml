    # Quick Review of Functions


    In JavaScript, you have functions that enable you to make your code bit cleaner
    and more reusable. Now, there''s reason we''re taking some time to look at functions,
    and it''s not to annoy you! Conceptually, functions share a lot of surface area
    with React components, and the easiest way to understand what components do is
    to take a quick look at functions first.


    In a world where functions don''t exist, you might have some code that looks as
    follows:


    ```

    var speed = 10;

    var time = 5;

    alert(speed * time);

    ```'
