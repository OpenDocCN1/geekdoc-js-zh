  md: "# # 9 Going from Data to UI in React\n\nWhen you're building your apps, thinking\
    \ in terms of props, state, components, JSX tags, render methods, and other React-isms\
    \ might be the last thing on your mind. Most of the time, you're dealing with\
    \ data in the form of JSON objects, arrays, and other data structures that have\
    \ no knowledge (or interest) in React or anything visual. Bridging the gulf between\
    \ your data and what you eventually see can be frustrating! Not to worry, though.\
    \ This chapter helps reduce some of those frustrating moments by running through\
    \ some common scenarios you'll encounter.\n\n# ## The Example\n\nTo help make\
    \ everything you're about to see, we need an example. It's nothing too complicated,\
    \ so go ahead and create a new HTML document and throw the following stuff into\
    \ it:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>From\
    \ Data to UI</title>\n  <script src=\"https://unpkg.com/react@16/umd/react.development.js\"\
    ></script>\n  <script src=\"https://unpkg.com/react-dom@16/umd/react-dom.development.js\"\
    ></script>\n  <script src=\"https://unpkg.com/babel-standalone@6.15.0/babel.min.js\"\
    ></script>\n\n<style>\n  #container {\n    padding: 50px;\n    background-color:\
    \ #FFF;\n  }\n</style>\n</head>\n```"
  merge: -1
