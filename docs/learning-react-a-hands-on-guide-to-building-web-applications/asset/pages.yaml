    <p>Hello, world!</p>

    </div>,

    document.querySelector("#container")

    );

    ```


    Let''s re-create all of this by using a component. React gives us various ways
    of creating components, but we are going to create them by the class syntax. Go
    ahead and add the following highlighted code just above the render method:


    ```

    class HelloWorld extends React.Component {


    ReactDOM.render(

    <div>

    <p>Hello, world!</p>

    </div>,

    document.querySelector("#container")

    );

    ```


    If the class syntax is foreign to you, first check out our online tutorial Using
    Classes in JavaScript (https://www.kirupa.com/javascript/classy_way_to_create_objects.htm).'
