  md: "# Your JSX Can Be Anywhere\n\nIn many situations, your JSX won't be neatly\
    \ arranged inside a render or return function in the examples you've seen so far.\
    \ Take a look at the following example:\n\n```\nvar swatchComponent = <Swatch\
    \ color=\"#F2004F\"/>;\n\nReactDOM.render(\n  <div>\n    {swatchComponent}\n \
    \ </div>,\n  document.querySelector(\"#container\")\n);\n```\n\nWe have a variable\
    \ swatchComponent that is initialized to a line of JSX. When our swatchComponent\
    \ variable is placed inside the render function, our Swatch component gets initialized.\
    \ All of this is totally valid. You will do more such things in the future when\
    \ you learn how to generate and manipulate JSX using JavaScript.\n\n# Conclusion\n\
    \nWith this chapter, we've finally pieced together in one location the various\
    \ bits of JSX information that the previous chapters introduced. The most important\
    \ point to remember is that JSX is not HTML. It looks like HTML and behaves it\
    \ in many common scenarios, but it is ultimately designed to be translated into\
    \ JavaScript. This means you can do things that you could never imagine doing\
    \ using just plain HTML. Being able to evaluate expressions or programmatically\
    \ manipulate chunks of JSX is just the beginning. In upcoming chapters, we'll\
    \ explore this intersection of JavaScript and JSX further.\n\n> Note: If you run\
    \ into any issues, ask!\nIf you have any questions or your code isn't running\
