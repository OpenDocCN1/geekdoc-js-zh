  md: "# 226 Chapter 18 Creating a Single-Page App in React Using React Router\n\n\
    This creates our new project inside a folder called react_spa. Go ahead and navigate\
    \ into this folder:\n\n```\ncd react_spa\n```\n\nNormally, this is where we start\
    \ messing around with deleting the existing content to start from a blank slate.\
    \ We'll do that, but first, we're going to install React Router. To do that, run\
    \ the following command:\n\n```\nnpm i react-router-dom --save\n```\n\nThis copies\
    \ the appropriate React Router files and registers it in our package.json so that\
    \ your app is aware of its existence. That seems good, right?\n\nIt's time to\
    \ clean up the project to start a clean slate. From your react_spa folder, delete\
    \ everything inside your public and src folders. Now, let's create the index.html\
    \ file that will serve as our starting point. In your public folder, create a\
    \ file called index.html and add the following contents into it:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1, shrink-to-fit=no\">\n  <title>React\
    \ Router Example</title>\n</head>\n<body>\n  <div id=\"root\"></div>\n</body>\n\
    </html>\n```\n\nTake a quick glance at the HTML. You shouldn't see anything surprising\
    \ here. Next, we'll create our JavaScript entry point. Inside the src folder,\
    \ create a file called index.js and add the following contents into it:\n\n```\n\
    import React from \"react\"\nimport ReactDOM from \"react-dom\"\nimport Main from\
    \ \"../Main\";\n```\n\n```\nReactDOM.render(\n<Main/>\ndocument.getElementById(\"\
    root\")\n);\n```\n\nOur ReactDOM.render call lives here, and we're rendering our\
    \ Main component...which doesn't exist yet. The Main component will be the starting\
    \ point for our SPA expedition using React Router, and you'll see how beginning\
    \ with the next section."
