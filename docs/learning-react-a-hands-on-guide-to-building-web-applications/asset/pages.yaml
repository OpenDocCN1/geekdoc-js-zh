  md: "```\nrender() {\n  return (\n    <div display={this.state.count} /\n      <button\
    \ onClick={this.increase}>+</button>\n    </div>\n  );\n}\n```\n\nIn this example,\
    \ the value of this increase event handler refers to the CounterParent component.\
    \ It doesn't refer to the element that triggered the event. You can attribute\
    \ this behavior to binding the value of this to our component from inside our\
    \ constructor.\n\n# # React...Why? Why?\n\nBefore we call it a day, let's use\
    \ this time to talk about how React decided to deviate from what we've worked\
    \ with events in the past. There are two reasons:\n\n+   1. Browser compatibility\n\
    2. Improved performance\n\nLet's elaborate on these reasons a bit.\n\n# ## Browser\
    \ Compatibility\n\nEvent handling is one of those things works consistently in\
    \ modern browsers, but once you go back to older browser versions, things get\
    \ really bad quickly. By wrapping all the native events as an object of type SyntheticEvent,\
    \ React frees you from dealing with event-handling quirks.\n\n# ## Improved Performance\n\
    \nIn complex UIs, the more event handlers you have, the more memory your app takes\
    \ up. Manually dealing with that isn't difficult, but it is a bit tedious as you\
    \ try to group events under a common parent. Sometimes that isn't possible. Sometimes\
    \ the hassle doesn't outweigh the benefits. What React does is pretty clever.\n\
    \nReact never attaches event handlers to the DOM elements. It uses one event handler\
    \ at the root of your document that is responsible for listening to all events\
    \ and calling the appropriate event handler as necessary (see Figure 10.3)."
