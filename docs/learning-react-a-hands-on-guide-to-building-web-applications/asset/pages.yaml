  md: "With the container div element safely defined, let's modify the render method\
    \ to use it instead of document.body. Here's one way of doing this:\n\n```\nReactDOM.render(\n\
    \  <h1>Batman</h1>,\n  document.querySelector(\"#container\")\n);\n```\n\nAnother\
    \ option is to do something inside the render method itself:\n\n```\nvar destination\
    \ = document.querySelector(\"#container\");\n\nReactDOM.render(\n  <h1>Batman</h1>,\n\
    \  destination\n);\n```\n\nNotice that the destination variable stores the reference\
    \ to your container DOM element. Inside the render method, you simply reference\
    \ the destination variable instead of writing the full-element syntax as part\
    \ of the argument itself. The reason for this is simple: I want to show that you're\
    \ still writing JavaScript and that render is just another boring method that\
    \ happens to take two arguments.\n\n# Styling It Up!\n\nTime for the last change\
    \ before we call it a day. Right now, our names show up in whatever default h1\
