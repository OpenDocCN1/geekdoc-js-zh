- img_proc: true
  md: "# JSX Quirks to Remember\n\nwhich we've been using to perform this JSX-to-JS\
    \ transformation entirely in the browser. We'll eventually look at using Babel\
    \ as part of a more involved build environment in which we generate a transformed\
    \ JS file, but you'll see more on that when we get to the future.\n\nSo there\
    \ you have it, an answer to what exactly happens to all our JSX: It gets turned\
    \ into sweet JavaScript.\n\n# JSX Quirks to Remember\n\nAs we've been working\
    \ with JSX, you've probably noticed that we've run into some arbitrary rules and\
    \ exceptions on what we can and can't do. In this section, let's look at those\
    \ quirks...and some brand new ones!\n\n# Evaluating Expressions\n\nJSX is treated\
    \ like JavaScript. As you've seen a few times already, this means that you aren't\
    \ limited to dealing with static content like the following:\n\n```\nclass Staff\
    \ extends React.Component {\n  return (\n    <h1>Boring static content!</h1>\n\
    \  );\n};\n```\n\nThe values you return can be dynamically generated. All you\
    \ have to do is to wrap your expression in curly braces:\n\n```\nclass Staff extends\
    \ React.Component {\n  return (\n    <h1>Boring {Math.random() * 100} content</h1>\n\
    \  );\n};\n```\n\nNotice that we're throwing in a `Math.random()` call to generate\
    \ a random number. It gets evaluated along the static text beside it, but because\
    \ of the curly braces, what you looks something like the following: Boring 26.638820148227\
    \ content! \n\nThese braces allow your app to first evaluate the expression and\
    \ then return the result of the evaluation. Without them, you would see your expression\
    \ returned as text: Boring `Math.random() * 100 content!`\n\nThat isn't what you\
    \ would probably want."
  merge: -1
  pgno: 95
- img_proc: true
  md: "# Returning Multiple Elements\n\nIn a lot of our examples, we return one top-level\
    \ element (often a div) that then had many other elements under it. You aren't\
    \ technically limited to following that pattern: You can actually return multiple\
    \ elements. And you can do that in two ways.\n\nOne way is to use an arraylike\
    \ syntax:\n\n```\nclass Stuff extends React.Component {\n  render() {\n    <p>I\
    \ am</p>\n    <p>returning a list</p>\n    <p>of things!</p>\n  }\n}\n```\n\n\
    Here we are returning p tags. They don't have a single common parent. Now, when\
    \ you return multiple items, you might or not have to deal with one detail, depending\
    \ on the version of React you are targeting. You need to specify a key attribute\
    \ and use a unique value for each item:\n\n```\nclass Stuff extends React.Component\
    \ {\n  render() {\n    <p key=\"1\">I am</p>\n    <p key=\"2\">returning a list</p>\n\
    \    <p key=\"3\">of things!</p>\n  }\n}\n```\n\nThis helps React understand which\
    \ element it is dealing with and whether to make any changes to it. How do you\
    \ know whether you need to add the key attribute? React tells you. You'll see\
    \ a message similar to the one printed to your Dev Console: Warning: Each child\
    \ in an array or iterator should use a unique \"key\" prop.\n\nYou also have another\
    \ (and, arguably, better) way to return multiple elements. This involves something\
    \ as fragments. The way you use it as follows:\n\n```\nclass Stuff extends React.Component\
    \ {\n  render() {\n    <React.Fragment>\n    <p>I am</p>\n```"
  merge: -1
  pgno: 96
- img_proc: true
  md: "```\n<p>returning a list</p>\n<p>of things!</p>\n</React.Fragment>\n\n};\n\
    }\n```\n\nYou wrap the list of items you want to return into a magical React.Fragment\
    \ component. Note a few cool things here:\n\n+   1. This component doesn't actually\
    \ generate a DOM element. It is just something you specify in JSX that has no\
    \ tangible existence when transpiled into the HTML your browser sees.\n2. You\
    \ aren't treating what you are returning as items in an array, so you don't need\
    \ commas or anything separating each item.\n3. There's no need to specify a unique\
    \ key attribute and value; this is all taken care of the covers for you.\n\nBefore\
    \ we leave this section, know that you can use a more condensed syntax instead\
    \ of fully reacting.Fragment... like an animal. You can use empty <> and </> tags:\n\
    \n```\nclass Stuff extends React.Component {\n  render() {\n    return (\n   \
    \   <p>I am</p>\n      <p>returning a list</p>\n      <p>of things!</p>\n    )\n\
    \  }\n}\n```\n\nThis looks like something from the future, so if you're inclined\
    \ to use return multiple values, feel free to use this smaller syntax.\n\n# You\
    \ Can't Specify CSS Inline\n\nAs you saw in Chapter 4, \"Styling in React\", the\
    \ style attribute in your JSX behaves differently from the style attribute in\
    \ HTML. In HTML, you can specify CSS properties directly as values on your style\
    \ attribute:\n\n```\n<div style=\"font-family:Arial;font-size:24px\">\n  <p>Blah!</p>\n\
    </div>\n```"
  merge: -1
  pgno: 97
- img_proc: true
  md: "In JSX, the style attribute can't contain CSS inside it. Instead, it needs\
    \ to refer to an object containing styling information:\n\n```\nclass Letter extends\
    \ React.Component {\n  render() {\n    var letterStyle = {\n      padding: 10,\n\
    \      margin: 10,\n      backgroundColor: this.props.bg,\n      color: \"#333\"\
    ,\n      display: \"inline-block\",\n      fontFamily: \"monospace\",\n      fontSize:\
    \ \"32\",\n      textAlign: \"center\"\n    };\n\n    return (\n      <div style={letterStyle}>\n\
    \        {this.props.children}\n      </div>\n    );\n  }\n}\n```\n\nNotice that\
    \ we have an object called letter that contains all the CSS properties (in camel-case\
    \ JavaScript form) and their values. That object is what we then specify to the\
    \ style attribute.\n\n# Comments\n\nJust as it's a good idea to comment your HTML,\
    \ CSS, and JavaScript, it's a good to provide comments inside your JSX. Specifying\
    \ comments in JSX is similar to how you comment in JavaScript, with one exception.\
    \ If you're specifying a comment as a child of a tag, you need to enclose your\
    \ comment within the { } brackets to ensure that it is parsed as an expression:\n\
    \n```\nReactDOM.render(\n  <div className=\"slideIn\">\n    <p className=\"emphasis\"\
    >Gagagool!</p>\n    {/* I am a child comment */}\n    <Label/>\n  </div>\n, document.querySelector(\"\
    #container\"));\n```"
  merge: -1
  pgno: 98
- img_proc: true
  md: "# Capitalization, HTML Elements, and Components\n\nOur comment in this case\
    \ is a child of the div element. If you specify a comment wholly inside a tag,\
    \ you can just specify your single-line or multiline comment without having to\
    \ use the { and } angle brackets:\n\n```\nReactDOM.render(\n<div className=\"\
    slideIn\">\n<p className=\"emphasis\">Gabagool!</p>\n  /* This comment\n  goes\
    \ across\n  multiple lines *\n  className=\"colorCard\" // end of line\n  */\n\
    </div>,\ndocument.querySelector(\"#container\");\n```\n\nIn this snippet, you\
    \ can see an example of a multiline comment and a comment at the end of a line.\
    \ Now that you know all of it, you have one excuse to not comment your JSX.\n\n\
    # Capitalization, HTML Elements, and Components\n\nCapitalization is important.\
    \ To represent HTML elements, ensure that the HTML tag is lowercase:\n\n```\n\
    ReactDOM.render(\n<div>\n<section>\n<p>Something goes here!</p>\n</section>\n\
    </div>,\ndocument.querySelector(\"#container\");\n```\n\nWhen you want to represent\
    \ components, the component name must be capitalized:\n\n```\nReactDOM.render(\n\
    <div>\n<CustomComponent/>\n</div>,\ndocument.querySelector(\"#container\");\n\
    ```\n\nIf you get the capitalization wrong, React will not render your content\
    \ properly. Trying to identify capitalization issues is probably the last point\
    \ you'll think about when things aren’t working, so keep this little tip in mind."
  merge: -1
