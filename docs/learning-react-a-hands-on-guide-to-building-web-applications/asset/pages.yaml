  md: 'The solution is to set up your development environment so that your JSX-to-JS
    conversion is handled as part of getting your app built (Figure 13.2):


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_165_0.png)


    Figure 13.2 What the proper dev setup does with our JSX!


    With this solution, your browser is loading your app and dealing with an already
    converted (and potentially optimized) JavaScript file. Good stuff, right? The
    only reason we delayed talking about all of this until now is for simplicity.
    Learning React is difficult enough. Adding the complexity of build tools and setting
    up your environment as part of learning React is just not cool. Now that you have
    a solid grasp of everything React does, it''s time to change that with this chapter.'
