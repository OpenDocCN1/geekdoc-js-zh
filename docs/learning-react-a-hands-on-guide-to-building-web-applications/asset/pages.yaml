  md: "# Detailed Look at the Problem\n\nWe not only define the properties, but we\
    \ also initialize them with the values they will carry.\n\nInside the Shirt component,\
    \ these properties are stored inside the props object. To transfer these properties\
    \ on, we need to explicitly access these properties from the props object and\
    \ list them as part of the component call. The following is an example of what\
    \ looks like when our Shirt component calls its Label component:\n\n```\nclass\
    \ Shirt extends React.Component {\n  render() {\n    <div>\n      <Label color={this.props.color}\n\
    \        num={this.props.num}\n        size={this.props.size} />\n    </div>\n\
    \  }\n}\n```\n\nNotice that the color, num, and size are listed again. The only\
    \ difference we saw with the ReactDOM.render call is that the values for each\
    \ property are taken from their respective entry in the props instead of being\
    \ manually entered.\n\nWhen our Label component gives life, it has the props object\
    \ properly filled out with the color, num, and size properties. You can probably\
    \ see a pattern forming here. If you need to let out a big yawn, feel free.\n\n\
    The Label component continues the tradition by repeating the same steps and calling\
    \ the Display component:\n\n```\nclass Display extends React.Component {\n  render()\
    \ {\n    <Display color={this.props.color}\n      num={this.props.num}\n     \
    \ size={this.props.size} />\n  }\n}\n```\n\nNotice that the Display component\
    \ contains all the listing of properties and their values taken from our Label\
    \ component's props object. The good news from all of this is that we're almost\
    \ done here. The Display component just displays the properties as they were populated\
    \ inside its props object:\n\n```\nclass Display extends React.Component {\n \
    \ render() {\n    <div>\n      <p>{this.props.color}</p>\n      <p>{this.props.num}</p>\n\
    \    </div>\n  }\n```"
