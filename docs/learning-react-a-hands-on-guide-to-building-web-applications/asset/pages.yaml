  md: "# Chapter 3 Components in React\n\nHelloWorld call now has the greetTarget\
    \ attribute, along with a superhero (or equivalent mythical being) that we want\
    \ to greet. If you preview this example in the browser, you will see the greetings\
    \ happily printed onscreen.\n\nOne last point is important to call before we move\
    \ on. You are not limited to having just a single property on a component. You\
    \ can have as many properties as you want, and your props property will easily\
    \ accommodate any property requests without making any fuss.\n\n# Dealing with\
    \ Children\n\nA few sections ago, I mentioned that components (in JSX) are very\
    \ similar to regular HTML elements. You saw that when you wrapped a component\
    \ inside a div element or specified attribute and value as specifying properties.\
    \ Just as you can have many HTML elements, your components can have children.\n\
    \nThis means you can do this like:\n\n```\n<CleverComponent foo=\"bar\">\n<p>Something!</p>\n\
    </CleverComponent>\n```\n\nHere you have a component very cleverly called CleverComponent,\
    \ and it has a p element as a child. From within you have the capability to access\
    \ the p child element (and any children it has) the children accessed by this.props.children.\n\
    \nTo make sense of all this, let's look at another simple example. This time,\
    \ we have a component called Buttonify that wraps its children inside a button.\
    \ The component looks like:\n\n```\nclass Buttonify extends ReactComponent {\n\
    render() {\n  <div>\n    <button type={this.props.behavior}>{this.props.children}</button>\n\
    \  </div>\n}\n}\n```\n\nYou can use this component by calling it the ReactDOM.render\
    \ method, as shown here:\n\n```\n<div>\n<Buttonify behavior=\"submit\">SEND DATA</Buttonify>\n\
    </div>\ndocument.querySelector(\"#container\");\n```\n\nWhen this code runs, given\
    \ what the JSX looks like, you see the words SEND DATA wrapped inside a button\
    \ element. With the appropriate styling, the result could look comically large,\
    \ as in Figure 3.5."
