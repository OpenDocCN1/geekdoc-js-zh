    Figure 3.5 A large Send Data button.


    Getting back to the text, notice that we specify a custom property called behavior.
    This property allows us to specify the button element''s type attribute, and you
    can see us accessing it via this.props.behavior in the component definition''s
    render method.


    There''s more to consider a component''s children than what you''ve seen here.
    For example, if your child element is just some text, the this.props.children
    returns a string. If your child element is just a single element (as in our example),
    the this.props.children returns a single property that is not wrapped inside an
    array. We still need to call out a few more things, but instead of enumerating
    all the cases and boring, we''ll bring those points later as we look at more elaborate
    examples.


    # Conclusion


    If you want to build an app using React, you can''t wander too far without having
    to use a component. Trying to build a React app without using a component is kind
    of building a JavaScript-based app using functions. I''m not saying that it can''t
    be done; it''s just one of those things you do—kind of the Bad Idea part of the
    popular Animaniacs Good/Bad Idea sketches (https://www.youtube.com/watch?v=2dJOIl4mndus)


    If this video doesn''t convince you that you should learn to embrace components,
    I don''t know what will—except for a future chapter on creating components!


    Note: If you run into any issues, ask!


    If you have any questions or your code isn''t running like you expect, don''t
    hesitate to ask! Post on the forums at https://forum.kiripa.com and get help from
    some of the friendliest and most knowledgeable people the Internet has brought
    together!'
