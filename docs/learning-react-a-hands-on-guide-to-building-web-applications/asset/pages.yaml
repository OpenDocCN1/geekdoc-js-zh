- img_proc: true
  md: "# Chapter 8 Dealing with State in React\n\nNote: Incrementing the Existing\
    \ State Value\n\nAs you've seen here, you will end up modifying existing state\
    \ value with an updated value. We're getting the existing state value by calling\
    \ this.state.strikes. For performance-related reasons, React might decide to batch\
    \ state updates in rapid succession. This could lead to the original value stored\
    \ by this.state to be out-of-sync with React. To help with this, the setState\
    \ method gives you access to the previous state object via the prevState argument.\n\
    \nUsing that argument, our code could be to look as follows:\n\n```\n```javascript\n\
    this.setState((prevState) => {\n  return (\n    strikes: prevState.strikes + 100\n\
    \  );\n});\n```\n```\n\nThe end result is similar to what we had originally. Our\
    \ strikes property is incremented by 100. The only potential change is that the\
    \ value of the strikes property is guaranteed to be whatever the earlier value\
    \ stored by our state object would be.\n\nSo should you use this approach to update\
    \ your state? There are good arguments on both sides. One side for correctness,\
    \ despite this.state working fine for most real-world cases. The other side for\
    \ keeping the code simple and not introducing additional complexity. There's no\
    \ right or wrong answer, so use whatever approach you prefer. I'm calling this\
    \ only for completeness because you could run into the prevState approach in any\
    \ React code you encounter in the world.\n\nYou need to do one more. The timerTick\
    \ function has been added to our component, but its contents don't have the context\
    \ set to our component. In other words, the this keyword we are accessing setState\
    \ will return a TypeError in the current situation. You can employ several solutions\
    \ here, each a little frustrating in its own way. We'll look at this problem in\
    \ detail later. For now, we're going to explicitly bind our timerTick to our component\
    \ so that all this references resolve properly. Add the following line to our\
    \ constructor:\n\n```\n```javascript\nconstructor(props) {\n  super(props);\n\n\
    \  this.state = {\n    strikes: 0\n  };\n\n  this.timerTick = this.timerTick.bind(this);\n\
    }\n```\n```\n\nWhen you've done that, the timerTick function is ready to be a\
    \ useful part of our component."
  merge: -1
  pgno: 108
- img_proc: true
  md: "# Rendering to the State Change\n\nIf you preview your app now, you'll see\
    \ our strikes value start to increment by 100 every second (see Figure 8.2).\n\
    \n![](img/bba9dcf50e224bceeea9a4c4b3771b06_109_0.png)\n\nFigure 8.2 The strikes\
    \ value increments by 100 every second.\n\nLet's ignore for a moment what happens\
    \ with our end code. That's pretty straightforward. The interesting thing is that\
    \ everything we've done updating what you see onscreen. That updating has to do\
    \ with this React behavior: Whenever you call setState and update something in\
    \ the state object, your component's render method gets automatically called.\
    \ This kicks off a cascade of render for any component whose output is also affected.\
    \ The end result of all this is that what you see on your screen in the latest\
    \ representation of your app's UI state. Keeping your data and UI in sync is one\
    \ of the hardest problems with UI development, so it's so nice that React takes\
    \ care of this for you. It makes all this pain of learning to use React totally\
    \ worth it...almost!\n\n# Optional: The Full Code\n\nWhat we have right now is\
    \ a counter that increments by 100 every second. Nothing about it screams lightning\
    \ counter, but it does cover everything about states that I wanted to learn now.\
    \ If you optionally flesh out your example to look like the version you saw at\
    \ the beginning, this is the full code for what goes inside our script tag:\n\n\
    ```\nclass LightningCounter extends React.Component {\n  constructor(props) {\n\
    \    super(props);\n\n    this.state = {\n      strikes: 0\n    }\n\n    this.timerTick\
    \ = this.timerTick.bind(this);\n  }\n\n```"
