  md: "# Seeing the render Calls 219\n\nInside the MenuButton component, add the following\
    \ highlighted lines:\n\n```\nimport React, { Component } from \"react\"\nimport\
    \ \"./MenuButton.css\";\n\nclass MenuButton extends Component {\n  shouldComponentUpdate(nextProps,\
    \ nextState) {\n    return false;\n  }\n\n  render() {\n    console.log(\"Rendering:\
    \ MenuButton\");\n\n    return (\n      <button id=\"roundButton\"\n        onMouseDown={this.props.handleMouseDown}></button>\n\
    \    );\n  }\n}\n\nexport default MenuButton;\n```\n\nRefresh your app to test\
    \ your code. Pay attention to the console and see what gets printed when you're\
    \ showing and hiding a menu. Your output when your page loads and the menu is\
    \ displayed for the first time now appears as follows:\n\nRendering: MenuContainer\n\
    Rendering: MenuButton\nRendering: Menu\n\n**clicked\n**Rendering: MenuContainer**\n\
    **Rendering: Menu**\n\nNotice that our MenuButton component's render method isn't\
    \ called. That's great. Before we celebrate too much, we've really taken a hammer\
    \ to our problem by returning false when shouldComponentUpdate gets called. While\
    \ that works for what we are doing, it's a bit more careful to ensure we aren't\
    \ accidentally preventing valid updates in the future if we eventually modify\
    \ MenuButton and how it gets used.\n\nWhen you look at the shouldComponentUpdate\
    \ method's signature, you can see two arguments are passed in. One is for the\
    \ next prop value, and the other is for the next state value. We can use these\
    \ arguments to compare the present with the future and act a bit more intelligently\
    \ about whether we allow our render call to be made. In the case of MenuButton,\
    \ the"
  merge: -1
  pgno: 233
- img_proc: true
  md: "only prop we're passing in for the value of handleMouseDown. We can ensure\
    \ that this value doesn't change by modifying the shouldComponentUpdate method,\
    \ as follows:\n\n```\nshouldComponentUpdate(nextProps, nextState) {\nif (nextProps.handleMouseDown\
    \ === this.props.handleMouseDown) {\n  return false;\n} else {\n  return true;\n\
    }\n}\n```\n\nThis code ensures that we don't unnecessarily render if the value\
    \ of handleMouseDown stays the same. If the value of handleMouseDown changed,\
    \ we could properly return a value of true to allow the render method to be called.\
    \ You can use other criteria to specify whether the component's render method\
    \ should be called, and what you depend entirely on the component in. Feel free\
    \ to get creative, if you need to.\n\n# PureComponent\n\nIt's a common occurrence\
    \ we have components forced to re-render despite not having relevant prop or state\
    \ changes. My IconButton example is just one occurrence. The solution is to call\
    \ shouldComponentUpdate and check whether any prop or state changes have taken\
    \ place. To avoid having to make this check all the time, a special kind of component\
    \ can handle this checking automatically for you. That is PureComponent.\n\nNow,\
    \ until all of our components have been based on Component:\n\n```\nclass Blah\
    \ extends Component {\nrender() {\n  return (\n    <h1>Hello!</h1>\n  );\n}\n\
    }\n```\n\nTo base our components off PureComponent, all you have to do is this:\n\
    \n```\nclass Blah extends PureComponent {\nrender() {\n  return (\n    <h1>Hello!</h1>\n\
    \  );\n}\n}\n```\n\nIt's pretty much it. Your component will now be extra careful\
    \ render only when it determines that a change to the prop or state has been made.\
    \ To see this for yourself, you can change IconButton to be a PureComponent of\
    \ just a Component."
  merge: -1
  pgno: 234
- img_proc: true
  md: "# Seeing the reader Calls\n\nIn MenuButton.js, first detect the shouldComponentUpdate\
    \ method; you don't need it\nanymore. Then make the following two highlighted\
    \ changes:\n\n```\nimport React, { PureComponent } from \"react\";\nimport ./MenuButton.css\"\
    ;\n\nclass MenuButton extends PureComponent {\n  render() {\n    console.log(\"\
    Rendering: MenuButton\");\n\n    return (\n      <button id=\"root\"\n       \
    \ onMouseDown={this.props.handleMouseDown}></button>\n    );\n  }\n}\n\nexport\
    \ default MenuButton;\n```\n\nWe import the necessary code from the React library\
    \ to make PureComponent work. Next,\nextend our MenuButton from PureComponent.\
    \ If you test your app now and\ninpect the console after displaying the menu,\
    \ you'll see that our MenuButton component's\nrender method doesn't get when your\
    \ menu decides to show up (or disappear).\n\n# Why Not Use PureComponent?\n\n\
    The PureComponent seems pretty awesome, why don't we just use it always and ditch\n\
    Component altogether? We probably would! With that said, there are a few reasons\
    \ you might\nwant to stick with Component.\n\nPureComponent performs what's known\
    \ as a shallow comparison. It isn't a comprehensive\ncheck of everything that\
    \ might have changed in your props or state to re-render.\nFor many cases, it's\
    \ okay. For other cases, that might not be. Keep in mind when using\nPureComponent.\
    \ You might find that you need to write your shouldComponentUpdate\nand handle\
    \ the updating logic manually. You can use PureComponent and specify-\nComponentUpdate\
    \ at the same time, although that makes a nice tri!\n\nBeyond the comparison logic,\
    \ the benefit of using PureComponent is performance.\nHaving each of your components\
    \ check see if props or state have changed, if it's a\nshallow check, takes upon\
    \ computation time. Remember, these happen every time your\ncomponent decides\
    \ to re-render or is asked to re-render by a parent. For complex UI,\nthat could\
    \ happen frequently without you realizing it.\n\nTL;DR: This should probably have\
    \ been mentioned at the top of this note, but what are you\ngoing to do? Basically,\
    \ it's fine to use PureComponent instead of Component. Just be aware\nof the two\
    \ (minor) side effects."
