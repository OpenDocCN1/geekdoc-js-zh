  md: '# Chapter 12 Accessing DOM Elements in React


    If you have access to a browser, you can view it live at the following location:

    https://www.kirupa.com/react/examples/colorizer.htm.


    The Colorizer colors the (currently) white square with whatever color you provide
    it. To see

    it in action, enter a color value inside the text field and click/tap the Go button.
    (Eww! If you don''nhave any idea of what color to enter, yellow is a good one).
    After you provide a color and

    submit it, the white square turns whatever color value you provided (see Figure
    12.2).


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_150_0.png)


    Figure 12.2 The white square turns yellow.


    The fact that the square changes color for any valid color value you submit is
    pretty awesome,

    but that''s not what you should focus on. Instead, pay attention to the text field
    and the button

    after you submit a value. Notice that the button gets focus, and the color value
    you just

    submitted is still inside the form. If you want to enter another color value,
    you need

    explicitly return focus to the text field and clear whatever current color value
    is present. Eww!

    That seems unnecessary, and we can do better than that from a usability point
    of view.


    Wouldn''t it be great if we could both clear the existing color value and return
    focus to the

    field immediately after submitting a color? That would mean that if we submitted
    a color value

    of purple, afterward we would see something that looks like Figure 12.3.'
