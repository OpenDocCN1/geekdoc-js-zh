- img_proc: true
  md: 'The items in blue are what we originally had. The items in green are new as
    part of incorporating Redux into our app. Earlier, we mentioned that adding Redux
    to our app involved two steps. The green additions mimic those steps closely:


    +   1. The first step of providing access to our Redux store is handled by the
    `Provider` component.


    +   2. The second step of getting any interested components to our dispatch and
    actions is handled by the `Connect` component.


    Going into a little more detail, the `Provider` component is the gateway to getting
    Redux functionality in our React app. It is responsible for storing a reference
    to the Store and ensuring that all components in our app have a way of accessing
    it. It is able to do that by being the topmost component in our component hierarchy.
    That vaulted position allows it to easily pass Redux-related wisdom throughout
    the entire app.


    The `Connect` component is a bit more interesting. It isn''t a full-blown component
    in the traditional sense. It''s known as a Higher Order Component (https://reactjs.org/docs/higher-components.html),
    or HOC, as the cool kids say. HOCs provide a way to extend the functionality of
    a component by simply wrapping it and injecting their own additional functionality
    into it. Think of this as the React-friendly way to mimic what the `extends` keyword
    does when working with ES6 classes. Looking at our diagram, the result is that,
    thanks to the `Connect` HOC, our `Counter` component has access to any actions
    and dispatch calls to work with the Redux store, without having to write any special
    code to access it. The `Connect` HOC takes care of that.


    Both `Provider` and `Connect` HOCs create a symbiotic relationship that gives
    any old React app the ability to work with Redux''s peculiar (yet totally efficient
    and awesome) way of managing the application state. As we start to build our app,
    you''ll see how this plays out.


    # Getting Started


