  md: '# Dealing with Prop Changes


    The other time your component updates is when its prop value changes after it
    has has been rendered into the DOM. In this scenario, the lifecycle methods in
    Figure 11.6 get called.


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_146_0.png)


    Figure 11.6 Lifecycle methods when the component''s prop value changes.


    The only new method here is componentWillReceiveProps. This method receives one
    argument, and this argument contains the new prop value that is about to be assigned
    to it.


    You saw the rest of the lifecycle methods when looking at state changes, so let''s
    not revisit them. Their behavior is identical when dealing with a prop change.


    # The Unmounting Phase


    The last phase to look at is when your component is about to be destroyed and
    removed from the DOM (see Figure 11.7).


    Only lifecycle method is active here, and that is componentWillUnmount. You perform
    cleanup-related tasks here, such as removing event listeners and stopping timers.
    After this method gets called, your component is removed from the DOM and you
    can say goodbye to it.'
