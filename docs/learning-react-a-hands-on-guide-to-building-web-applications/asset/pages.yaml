- img_proc: true
  md: '# Creating a Single-Page App

    in in React Using React Router


    Now that you''ve familiarized yourself with the basics of how to work with React,
    let''s kick up a few notches. Here we''re going to use React to build a simple
    single-page app (also referred to as SPA by the cool kids and people living in
    Scandinavia). As we talked about our React introduction forever ago, single-page
    apps are different from the more traditional multipage apps that you see everywhere.
    The biggest difference is navigating a single-page app doesn''t involve going
    to an entirely new page. Instead, your pages (commonly known as views in this
    context) typically load inline within the same page itself:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_237_0.png)'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'When you''re loading content inline, things get a little challenging. The hard
    part isn''t loading the content itself. That''s relatively easy. The hard part
    is making sure that single-page apps behave in a way that is consistent with what
    your users are accustomed to. More specifically, when users navigate your app,
    they will have some expectations:


    +   1. The URL displayed in the address bar should always reflect the thing users
    are viewing.

    2. Users expect to be able to use the browser''s back and forward buttons successfully.

    3. Users should be able to navigate to a particular view (a.k.a. deep link) directly
    using the appropriate URL.


    With multipage apps, these three things come for free. You don''t have to do anything
    extra for any of it. With single-page apps, because you aren''t navigating to
    an entirely new page, you have to do real work with these three things that your
    users expect to work. You need to ensure that navigating within your app history
    is properly synchronized with each navigation to allow users to use the back and
    forward buttons. If users bookmark a particular view or copy/paste a URL to access,
    you need to ensure that your single-page app takes them to the correct place.


    To deal with all of this, you have a bucket full of techniques commonly known
    as routing. With routing, you need to map URLs to destinations that aren''t physical
    pages, such as the individual views in your single-page app. That sounds complicated,
    but fortunately, a bunch of JavaScript libraries can help with this. One JavaScript
    library is the star of this tutorial, React Router(https://github.com/reactjs/react-router).
    React Router provides routing capabilities to single-page apps built in React.
    What makes it nice is that it extends what you already know about React in familiar
    ways to give you all of this routing awomeness. Using this tutorial, you''ll learn
    all about how it does...and hopefully more.


    Onward!


    # The Example


    Before we go further, take a look at the following example in your browser: https://www.kirura.com/react/examples/react_router/index.html.


    Here, you have a simple React app that uses React Router to provide all the navigation
    and view-loading goodness:'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Getting Started


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_239_0.png)


    Click the various links to load the relevant content, and feel free to open this
    page in its own browser window (https://www.kirura.com/react/examples/react-router/index.html)
    to use the back and forward buttons and see them working.


    In the following sections, we''re going to be building this app in pieces. By
    the end, not only will you have re-created this app, but hopefully you''ve learned
    enough about React Router to build cooler and even more awesome things.


    # Getting Started


    First we need to get our project set up. We''ll use our trusty create-react-app
    command to do this. From your favorite terminal, navigate to the folder where
    you want to create your app and type the following:


    ```

    create-react-app react_spa

    ```'
