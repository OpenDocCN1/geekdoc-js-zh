  md: '![](img/bba9dcf50e224bceeea9a4c4b3771b06_68_0.png)


    Figure 5.7 The three components.


    An important point to note is that the component hierarchy has more to do with
    helping us define our code than it does with the finished product will look. You''ll
    notice that it looks a bit different from the visual hierarchy we started with.
    For visual details, always refer to your source material (a.k.a. your visual comps,
