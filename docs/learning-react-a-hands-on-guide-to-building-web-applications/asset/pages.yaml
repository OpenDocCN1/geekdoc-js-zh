  md: "# Styling React Content Using CSS\n\nWe have simply an HTML-ized expansion\
    \ of the various JSX fragments you saw in the render method a few moments ago,\
    \ with our vowels nested inside a bunch of div elements.\n\n# Just Style It Already!\n\
    \nWhen you understand the HTML arrangement of the things you want to style, the\
    \ hard part is done. Come now the fun and familiar part of defining style selectors\
    \ and specifying the properties you want to set. To affect the inner div elements,\
    \ add the following style tag:\n\n```\ndiv div {\n  padding: 10px;\n  margin:\
    \ 10px;\n  background-color: #FFDE00;\n  color: #333;\n  display: inline-block;\n\
    \  font-family: monospace;\n  font-size: 32px;\n  text-align: center;\n}\n```\n\
    \nThe div div selector ensures we style the right things. The end result will\
    \ be our vowels to look exactly like we out. With that, a selector of div div\
    \ looks a bit odd, doesn't it? It's too generic. In apps with more than three\
    \ div elements (which is common), you can end styling the wrong things. At times\
    \ like these, you will want to change the HTML that React generates to make the\
    \ content more easilyable.\n\nWe address this by giving our inner elements a class\
    \ value of letter. Here is where JSX extends React.Component\n\n```\nclass extends\
    \ Component {\n  render() {\n    return (\n      <div className=\"letter\">\n\
    \        {this.props.children}\n      </div>\n    );\n  }\n}\n```\n\nNotice that\
    \ we designate the class value by using the className attribute instead of the\
    \ class attribute. This is because the word class is a special keyword in JavaScript.\
    \ If that makes any sense, don't worry about it for now; we'll cover it later.\n\
    \nAfter you've given your div className attribute value letter, there's just one\
    \ more thing to do. Modify the CSS selector to target the div elements cleanly:\n\
    \n```\n.letter {\n  padding: 10px;\n  margin: 10px;\n}\n```"
  merge: -1
