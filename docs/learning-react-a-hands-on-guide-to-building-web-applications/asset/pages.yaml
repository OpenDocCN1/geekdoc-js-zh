  md: "We have our Something component that listens for an event called someEvent.\
    \ We start listening for this under the componentDidMount method, which is automatically\
    \ called when our component gets rendered. We listen for our event using addEventListener\
    \ both the event and the event handler to call.\n\nThat should be pretty straightforward.\
    \ The only point you need to keep in mind is that you need to remove the listener\
    \ when the component is about to be destroyed. To do that, you can use the opposite\
    \ of the componentDidMount method, the componentWillUnmount method and to put\
    \ removeEventListener inside to ensure that no trace of our event listing exists\
    \ after our component goes away.\n\n# The Meaning of this Inside the Event Handler\n\
    \nWhen dealing with React, the value of this inside your event handler is different\
    \ than what you normally see in the Non-React DOM. In the Non-React world, the\
    \ value of this inside an event handler refers to the element that fired the event:\n\
    \n```\nfunction doSomething(e) {\n  console.log(this); // button element\n}\n\
    ```\n\n```\nvar foo = document.querySelector(\"button\");\nfoo.addEventListener(\"\
    click\", doSomething, false);\n```\n\nIn the React, the value of this does not\
    \ refer to the element that fired the event. The value is the very unhelpful (yet\
    \ correct) undefined. That's why we need to explicitly specify what this binds\
    \ to the bind method, as you've seen a few times:\n\n```\nclass Counter = extends\
    \ React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = {\n      count: 0\n    }\n    this.increase = this.increase.bind(this);\n\
    \  }\n  increase(e) {\n    console.log(this);\n    this.setState({\n      count:\
    \ this.state.count + 1\n    });\n  }\\}\n```"
