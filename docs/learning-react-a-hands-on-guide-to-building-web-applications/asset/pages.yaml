  md: "# How the Sliding Menu Works\n\nThe way the sliding menus isn't as crazy as\
    \ it seems. The menu is never truly nonexistent; it is simply hidden outside the\
    \ view. To see what that looks like, check out the following diagram:\n\n![](img/bba9dcf50e224bceeea9a4c4b3771b06_213_0.png)\n\
    \nJust to the left of the content what we see is our menu, patiently hiding until\
    \ it is called upon. We do that by shifting the menu as far left as we can until\
    \ it's fully out of view. Figuring out how far to shift is easy. Our menu's size\
    \ is the same as our browser's window (a.k.a. the view-port) size because we want\
    \ the menu to fully cover whatever is shown. Given that detail, we just shift\
    \ the menu left by the browser's width. One way of doing that might be by using\
    \ CSS that looks as follows:\n\n```\n#theMenu {\n  position: fixed;\n  left: 0;\n\
    \  top: 0;\n  transform: translate3d(-100vw, 0, 0);\n\n  width: 100vw;\n  height:\
    \ 100vh;\n}\n```"
