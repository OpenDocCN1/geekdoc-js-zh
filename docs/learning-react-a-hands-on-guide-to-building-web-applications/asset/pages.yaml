  md: "# Getting the Default State\n\nThis step happens inside your component's constructor.\
    \ You get the chance to specify the default value of this.state as part of your\
    \ component's creation:\n\n```\nconstructor(props) {\n  super(props);\n\n  console.log(\"\
    constructor: Default state time!\");\\n\n  this.state = {\n    count: 0\n  };\n\
    \n  this.increase = this.increase.bind(this);\n}\n```\n\nNotice that we're defining\
    \ our state object and initializing it with a count property whose value is 0.\n\
    \n# componentWillMount\n\nThis is the last method that gets before your component\
    \ gets rendered to the DOM. There's an important point to note here: if you call\
    \ setState inside this method, your component will not re-render.\n\n# render\n\
    \nThis one should be very familiar to you by now. Every component must have this\
    \ method defined, and is responsible for returning some JSX. If you don't want\
    \ to render anything, simply return null or false.\n\n# componentDidMount\n\n\
    This method gets immediately after your component renders and gets placed on the\
    \ DOM. At this point, you can safely perform any DOM querying operations without\
    \ worrying about whether your component has made it. If you have any code that\
    \ depends on your component being ready, you can specify all of that here as well.\n\
    \nWith the exception of the render method, all of these lifecycle methods can\
    \ fire only once. That's quite different from the methods you see next."
