    in all three of our components'' render methods getting called. Click the menu
    to dismiss it. You''ll see that all three render methods get called. That doesn''t
    seem right, does it?


    Because we''re toggling a prop on Menu and our state is stored on MenuContainer,
    it makes sense for those two components'' render methods to be called...for now.
    But, why is the MenuButton component''s render method getting every single time?


    Looking at MenuContainer''s render call, we are calling our menu component and
    passing in a prop whose value will change:


    ```

    <MenuButton handleMouseDown={this.handleMouseDown} />

    ```


    The value of handleMouseDown doesn''t change each time our menu is opened or closed.
    This is why MenuContainer (a.k.a. the MenuButton''s parent) has its render method
    called. If a parent''s render method gets called, all the children'' render methods
    get called. If you''re keeping score, this is reason #3 we listed a few sections
    when talking about what a render method to be called automatically.


    So options do we have for stopping the MenuButton component''s render method from
    being unnecessarily called? As it turns out, we have


    # Overriding a Component Update


    A while ago, we looked at the various lifecycle React reacts. One of them is shouldComponentUpdate.
    This method is called just before a render call is made, and you can block the
    render method from being called by having the shouldComponentUpdate method return
    false. Here we''re going to use the shouldComponentUpdate method to do that.'
