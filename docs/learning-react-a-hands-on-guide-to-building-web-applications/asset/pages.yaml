  md: '# Introduction to Redux


    The greatest love story of all time isn''t between Romeo and Juliet. In fact,
    it''s not even between any characters we''ve seen in books or movies. It''s actually
    between React and a mysterious unknown straggler from a far-away land, known as
    Redux.


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_251_0.png)'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'By now, you know enough about React to understand how it works and why it does
    some of the things it does. We Haven''t talked about Redux at all, though. We
    need to fix that before we can try to figure out why React and Redux get along
    so well. In the following sections, we take a deep dive into what Redux is.


    # # What Is Redux?


    If we''ve learned one thing in all this time, it is this: Maintaining application
    state and keeping consistent with our UI is a major challenge. Solving this is
    partly why libraries such as React really took off. If you cast a wider net and
    look beyond just the UI layer, you''ll see that maintaining application state
    in general is complicated. The typical app has many layers, and each layer has
    its own dependency on some piece of data that it relies on to do its thing.


    Visualizing the relationship between your app''s functionality and its application
    state often is pretty confusing:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_252_0.png)'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'To solve this more general problem of maintaining application state, you have
    Redux. The easiest way to understand how Redux works is just to walk through the
    various pieces that go into it. The first thing we need is an app:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_253_0.png)


    This app doesn''t have to be anything special. It can be built in React, Angular,
    Vue, vanilla JS, or whatever happens to be the hot new library or framework this
    week. Redux doesn''t care how your app is built. It only cares that your app has
    a magical way for dealing with application state and storing it. In the Redux
    world, we store **all our application state** in a single location that we''ll
    just call the **Store:'
  merge: -1
  pgno: 253
- img_proc: true
  md: '![](img/bba9dcf50e224bceeea9a4c4b3771b06_254_0.png)


    The thing about the Store is that reading data from it is easy. Getting information
    into it is a whole another story. You add a new state to (or modify existing state
    in) the Store by using a combination of **actions**, which describe what to change,
    and a **reducer**, which determines what the final state will be as a result for
    a given action. When you throw both of these into the picture, this is what you
    see:'
  merge: -1
  pgno: 254
- img_proc: true
  md: '![](img/bba9dcf50e224bceeea9a4c4b3771b06_255_0.png)


    This diagram omits a few more moving pieces, but it''s a good approximation of
    what happens when our app needs to update the state stored in the Store. Now,
    looking at this diagram, you''re probably wondering why there''s all this roundaboutness
    and indirection. Why can''t our app just update the Store directly?'
  merge: -1
  pgno: 255
- img_proc: true
  md: '![](img/bba9dcf50e224bceeea9a4c4b3771b06_256_0.png)


    The reason is scalability. Even for simple apps, keeping our application state
    in-sync with what our app is doing is a chore. For complex apps in which different
    parts want to access and modify the application state, forget about it! This roundabout
    way is Redux''s answer for making storing application state easy for both simple
    apps and complex ones. Beyond just ease, Redux helps make maintaining your application
    state predictable. Dan Abramov and Andrew Clark, the creators of Redux, interpreted
    predictable as follows:


    +   1. Your entire application''s state is stored in a single location. You don''t
    have to search across a variety of data stores to find the part of your state
    you want to update. Keeping everything stored in a single location also ensures
    that you don''t have to worry about keeping all of this data in sync.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Building a Simple App Using Redux 243


    2. Your state should be read-only and can be modified only through actions. As
    you saw in the diagram earlier, in a Redux world, you need to ensure that random
    parts of your app can''t access the Store and modify the state stored inside it.
    The only way your app can modify what is in the Store is by relying on actions.


    3. You specify what the final state should be. To keep things simple, your state
    is never modified or mutated. You use a reducer to specify what the final result
    of your state should be.


    These three principles might seem a bit abstract, but as you start to write some
    Redux code, you''ll see them put into practice.


    # Building a Simple App Using Redux


    We''re now going to take all the diagrams and text you saw in the previous section
    and turn them into code. The app we''re building to highlight how Redux works
    will be a really simple console-driven app without any UI. This app will store
    and display a list of favorite colors. From our app, we''ll be able to add colors
    and remove others. That''s pretty much it.


    This might seem like a step backward from the UI-rich apps we''ve been building,
    but this app will tie together all this theoretical Redux knowledge to produce
    tangible lines of code. The goal is to simply make sense of Redux. We''ll complicate
    our world by combining Redux with some UI.


    # It''s Redux Time


    First we need to create a new HTML document and reference the Redux library as
    part of it. We won''t be using create-react-app or any fancy build system here.
    This will be a loose HTML file somewhere that you can view in your browser. Using
    your favorite code editor, go ahead and create a new file called favoriteColors.html
    and add the following markup:


    ```

    <!DOCTYPE html>

    <html>


    <head>

    <title>Favorite Colors!</title>

    <script src="https://unpkg.com/redux@latest/dist/redux.js"></script>

    </head>

    <body>

    <script>


    </script>

    </body>

    </html>

    ```'
  merge: -1
