- img_proc: true
  md: '# 5

    Creating Complex Components


    In Chapter 3, "Components in React," you learned about components and all the
    awesome things that they do. You learned that components are the primary ways
    through which React enables your visual elements to behave like little reusable
    bricks that contain all the HTML, JavaScript, and styling needed to run themselves.
    Beyond reusability, components bring another major advantage to the table. They
    make possible **composability**. You can combine components to create more complex
    components.


    In this chapter, we look at what all of this means. More specifically, we look
    at two points:


    +   - The boring technical stuff you need to know

    - The boring stuff you need to know to identify components when you look at a
    bunch of visual elements


    Okay, what you''re going to learn isn''t actually *that* boring. I''m just setting
    your expectations really low.


    # From Visuals to Components


    The examples we''ve looked at so far have been pretty basic. They were great for
    highlighting technical concepts, but they weren''t great for preparing you for
    the real world.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '48 Chapter 5 Creating Complex Components


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_62_0.png)


    # Not representative of the real world?? Srsly?


    In the real world, what you''ll be asked to implement in React will never be as
    simple as a list of names or colorful blocks of vowels. Instead, you''ll be given
    a visual of some complex user interface, such as a scribble, diagram, screenshot,
    video, redline, or comp. Then it''ll be up to you to bring all those static pixels
    to life. You''ll get some hands-on practice in this chapter doing just that.


    The task here is to build a simple color palette card (see Figure 5.1).


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_62_1.png)


    Figure 5.1 A simple color palette card.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Color palette cards are small rectangular cards that help you match a color
    with a particular type of paint. You can see them in home improvement stores or
    anywhere paint is sold. Your designer friend probably has a giant closet dedicated
    to them in his or her place. Anyway, our mission is to re-create one of these
    cards using React.


    We could go about this in several ways, but let''s take a systematic approach
    that simplifies and makes sense of even the most complex user interfaces. This
    approach involves two steps:


    +   1. Identify the major visual elements.


    +   2. Figure out what the components will be.


    Both of these steps sound really complex, but as we walk through this, you''ll
    see that you have nothing to worry about.


    # Identifying the Major Visual Elements


    The first step is to identify all the visual elements we''re dealing with. No
    visual element is too minor to omit—at, not initially. The easiest way to identify
    the relevant pieces is to start with the obvious visual elements and then dive
    into the obvious ones.


    The first thing you will see in our example is the card itself (see Figure 5.2).


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_63_0.png)


    Figure 5.2 The card.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Chapter 5 Creating Complex Components


    Within the card are two distinct regions. The top region is a square area that
    displays a particular color. The bottom region is a white area that displays a
    hex value.


    Let''s call out these two visual elements and arrange them into a treelike structure,
    as shown in Figure 5.3.


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_64_0.png)


    Figure 5.3 Treelike structure.


    Arranging your visuals into this treelike structure (a.k.a. a visual hierarchy)
    is a good way to get a better feel for how your visual elements are grouped. The
    goal of this exercise is to identify the important visual elements and break them
    into a parent/child arrangement until you can divide them by no further.


    > Try to Ignore Implementation Details

    It might be hard, but don''t think about the implementation details yet. Don''t
    focus on dividing your visual elements based on what combination of HTML and CSS
    is required. You''ll have plenty of time for that later.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'Continuing on, we can see that our colorful square isn''t something we can
    divide further. It doesn''t mean we''re done, though. We can further divide the
    label from the white region that surrounds it. Right now, our visual hierarchy
    looks as shown in Figure 5.4, with our label and white region occupying a separate
    spot in our tree.


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_65_0.png)


    Figure 5.4 Dividing things further into the label and the white region that surrounds
    it.


    At this point, we have nothing else to divide any further. We''re finished identifying
    and dividing up our visual elements, so the next step is to use what we''ve found
    to help us identify the components.


    # Identifying the Components


    This is where things get a little interesting. We need to figure out which of
    the visual elements we''ve identified will be turned into components and which
    ones not. Not every visual element needs to be turned into a component, and we
    also don''t want to create only a few extremely complex components (see Figure
    5.5).'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'Chapter 5 Creating Complex Components


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_66_0.png)


    Figure 5.5 Not too few and not many components.


    There''s an art to figuring out which visual elements become part of a component
    and which don''t. The general rule is that components should do just one thing.
    If you find that your potential component will end up doing too many things, you
    probably want to break it into multiple components. On the flipside, if your potential
    component does too little, you probably want to skip making that visual element
    a component altogether.


    Let''s try to figure out which elements would make good components in our example.
    From looking at our visual hierarchy, both the card and the colored square seem
    like they fit the bill for making a great component. The card acts as the outer
    container, and the colored square simply displays a color.


    That just puts a question mark around our label and the white region it is surrounded
    by (see Figure 5.6).'
  merge: -1
  pgno: 66
- img_proc: true
  md: '![](img/bba9dcf50e224bceeea9a4c4b3771b06_67_0.png)


    Figure 5.6 Question mark around the label and the white space around it.


    The important part here is the label itself. Without it, we can''t see the hex
    value. That leaves just the white region. It serves a negligible purpose; it is
    simply empty space, and responsibility can easily be handed off to our label itself.
    Brace yourself for what I''m about to say next: Sadly, our white rectangular region
    will not be turned into a component.


    At this point, we have identified our three components, and the component hierarchy
    looks like Figure 5.7.'
