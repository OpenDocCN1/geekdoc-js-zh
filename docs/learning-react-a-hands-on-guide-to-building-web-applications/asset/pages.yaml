  md: "# 4 Styling in React\n\nFor generations, mankind (and probably really smart\
    \ dolphins) has styled HTML content using CSS. Things were good. CSS had good\
    \ separation between content and presentation. The selector-syntax offered a lot\
    \ of flexibility in choosing which elements to style and which ones to skip. We\
    \ couldn't find even many reasons to hate the whole cascading thing which CSS\
    \ is all of.\n\nWell, don't tell React that React doesn't actively hate CSS, but\
    \ it has a different view when it comes to styling. As you've seen, one of React's\
    \ core ideas is to make an app's visual pieces self-contained and reusable. That's\
    \ why the HTML elements and the JavaScript impacts are in the same bucket, called\
    \ a component. You got a taste of that in the previous chapter.\n\nWhat about\
    \ the HTML elements look (a.k.a. their styling?) Where should they go? You can\
    \ probably guess where we're going with this. You can't have a self-contained\
    \ piece of UI when the styling for it is embedded somewhere. That's why React\
    \ encourages you to use your elements right alongside the HTML and the JavaScript.\
    \ In this tutorial, you'll learn all about this mysterious (and possibly scandalous)\
    \ approach to styling your content. Of course, we also look at how to use CSS.\
    \ There's room for both approaches, even if React might sort of kind of not think\
    \ so.\n\n# Styling Some Vowels\n\nTo learn how to style React content, let's work\
    \ together on a (totally sweet and exciting) example that simply displays vowels\
    \ on a page. You'll need a blank HTML page that will host your React content.\
    \ Create a new HTML document and add the following content into it:\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>Styling in React</title>\n\
    \  <script src=\"https://unpkg.com/react@16/umd/react.development.js\"></script>\n\
    ```"
  merge: -1
