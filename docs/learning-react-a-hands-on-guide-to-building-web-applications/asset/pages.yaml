- img_proc: true
  md: "# Chapter 19 Introduction to Redux\n\nAs you can see, we have an empty HTML\
    \ document with only the basic structure defined.\nWe're referencing a hosted\
    \ version of the Redux library, which is fine for kicking the tires\nlike we're\
    \ doing. For production apps, like the ones you saw with React, you have better\
    \ approaches to use. We'll look at those better approaches later, but referencing\
    \ the library directly is okay for now.\n\n# Lights! Camera! Action!\n\nWith our\
    \ Redux library referenced, we need to define our actions. Remember, the action\
    \ is the\nonly mechanism we have to communicate with our Store. For our app, because\
    \ we want to add\nand remove colors, our actions will represent in a way that\
    \ a Store will understand.\n\nInside your script tag, adding the following lines:\n\
    \n```\nfunction addColor(value) {\n  return {\n    type: \"ADD\",\n    color:\
    \ value\n  };\n}\n```\n\n```\nfunction removeColor(value) {\n  return {\n    type:\
    \ \"REMOVE\",\n    color: value\n  };\n}\n```\n\nWe have two functions, addColor\
    \ and removeColor. Each they take one argument and return\nan action object as\
    \ a result. For addColor, the action object is highlighted in the following lines:\n\
    \n```\nfunction addColor(value) {\n  return {\n    type: \"ADD\",\n    color:\
    \ value\n  };\n}\n```\n\nWhen defining an action, you have a lot of freedom. Every\
    \ action object has a type property.\nThis is a keyword that signals what you're\
    \ intending to do. Beyond that, any other information\nsent along with your action\
    \ is entirely up to you. Because we're interested in adding\nremoving a color\
    \ value from our Store, our action object also has a color property that stores\n\
    the color we're interested in.\n\nLet's get back to our addColor and removeColor\
    \ functions. Both really serve one purpose:\nto return an action. There's a more\
    \ formal name for these functions in the Redux world.\nThey're known as action\
    \ creators because they, um, create an action."
  merge: -1
  pgno: 258
- img_proc: true
  md: "# Our Reducer\n\nOur actions define what we want to do, the reducer handles\
    \ the specifics of what happens\nhow our new state is defined. You can think of\
    \ the reducer as the intermediary between\nThe Store and the outside world, where\
    \ it does the following three things:\n\n+   1. Provides access to the Store's\
    \ original state\n2. Allows you to inspect the action that was currently fired\n\
    3. Allows you to set the Store's new state\n\nYou can see all this when you add\
    \ a reducer to deal with adding and removing colors from the\nStore. Add the following\
    \ code after the point where you defined your action creators:\n\n```\nfunction\
    \ favoriteColors(state, action) {\n  if (state === undefined) {\n    state = [];\n\
    \  }\n\n  if (action.type === \"ADD\") {\n    return state.concat(action.color);\n\
    \  } else if (action.type === \"REMOVE\") {\n    return state.filter(function(item)\
    \ {\n      return item !== action.color;\n    });\n  } else {\n    return state;\n\
    \  }\n}\n```\n\nTake a moment to walk through what this code is doing. First we\
    \ ensure that we actually have\nsome state to fiddle with\n\n```\nfunction favoriteColors(state,\
    \ action) {\n  if (state === undefined) {\n    state = [];\n  }\n}\n```\n\n```\n\
    if (action.type === \"ADD\") {\n  return state.concat(action.color);\n} else if\
    \ (action.type === \"REMOVE\") {\n  return state.filter(function(item) {\n   \
    \ return item !== action.color;\n  });\n} else {\n  return state;\n}\n\n```"
  merge: -1
  pgno: 259
- img_proc: true
  md: "# Chapter 19 Introduction to Redux\n\nIf our state object doesn't exist, as\
    \ with the first time we launch our app, we just initialize it with an empty array.\
    \ You can use any data structure you want, but an array is the right one for what\
    \ we're trying to do.\n\nFrom there, the rest of our code is responsible for dealing\
    \ with our actions. Note that the reducer gets the full action object via its\
    \ action argument. This means you have access to not only the action's type property,\
    \ but also anything you specified earlier as part of defining your actions.\n\n\
    For this example, if our action's type is ADD, we add the color (specified by\
    \ the action's color property) to our state array. If your action's type is REMOVE,\
    \ we return a new array with the color in question. Lastly, if your action's type\
    \ is something we don't know, we just return our current state unmodified\n\n\
    ```\nfunction favoriteColors(state, action) {\n  if (state === undefined) {\n\
    \    state = [];\n  }\n\n  if (action.type === \"ADD\") {\n    return state.concat(action.color);\n\
    \  } else if (action.type === \"REMOVE\") {\n    return state.filter(function(item)\
    \ {\n      return item !== action.color;\n    });\n  } else {\n    return state;\n\
    \  }\n}\n```\n\nPretty simple, right? Be sure to keep one important Redux design\
    \ choice in mind. The Redux documentation (https://redux.js/docs/basics/Reducers.html)\
    \ describes it best:\n\nThings you should never inside a reducer:\n\n+   - Mutate\
    \ its arguments\n- Perform side effects like API calls and routing transitions\n\
    - Call non-pure functions, e.g. Date.now() or Math.random()\n\nGiven the same\
    \ arguments, it should calculate the state and return it. No surprises. No side\
    \ effects. No API calls. No mutations. Just a calculation.\n\nYou can see this\
    \ in our code. To add new colors to our state array, we used the concat method,\
    \ which returns an entirely new array made up of the old values and the new value\
    \ we're adding. Using push would give us the same result, but it violates our\
    \ goal of not modifying the existing state. To remove color values, we continue\
    \ to maintain our goal of not modifying our current state. We use the filter method,\
    \ which returns a new array with the value we want to remove omitted."
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Building a Simple App Using Redux


    Also keep the following in mind, as Mark Eriksson (@acemarker) reminded me: Redux
    doesn''t contain any mechanics to prevent us from modifying state and making other
    poor choices. The creators of Redux have provided some guidelines. It''s up to
    you to follow them and put guidelines into practice.


    # Store Stuff


    All that remains now is to tie our actions and the reducer with our Store. First
    we have to actually create the Store. Below your favoriteColors reducer function,
    and add the following:


    ```

    var store = Redux.createStore(favoriteColors);

    ```


    Here we''re creating a new Store using the createStore method. The argument we
    provide is the favoriteColors reducer we created a few moments ago. We''re now
    full circle using Redux to store state application. We have our store, have our
    reducer, and we have actions that we can work to.


    To see everything fully working, we''re going to add (and remove) some colors
    to the Store. To do this, we use the dispatch method on our store object that
    takes an action as its argument. Go ahead and add the following lines:


    ```

    store.dispatch(color("blue"));

    store.dispatch(color("yellow"));

    store.dispatch(color("green"));

    store.dispatch(color("red"));

    store.dispatch(color("gray"));

    store.dispatch(color("orange"));

    store.dispatch(removeColor("gray"));

    ```


    Each dispatch sends an action to our reducer. The reducer takes the action and
    performs the appropriate work to define our new state. To see the Store''s state,
    you can just add this after all the dispatch calls:


    ```

    console.log(store.getState());

    ```


    As its name implies, the getState returns the state''s value. If you view your
    app in the browser and up your developer''s tools, you''ll see that the colors
    we added displayed in the console:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_261_0.png)'
  merge: -1
  pgno: 261
- img_proc: true
  md: "# Chapter 19 Introduction to Redux\n\nWe're almost done here; We have just\
    \ one more really important thing to cover. In real-world scenarios, you will\
    \ be notified each time your application's state is modified. This push model\
    \ will make your life much easier if you update UI or perform other tasks as a\
    \ result of some change to the Store. To accomplish this, you have the subscribe\
    \ method for specifying a function (a.k.a. a listener) that gets called every\
    \ time the contents of the Store are modified. Use the subscribe method in action,\
    \ after you define the store object, add the following highlighted lines:\n\n\
    ```\nvar store = Redux.createStore(favoriteColors);\nstore.subscribe(render);\n\
    function render() {\n  console.log(store.getState());\n}\n```\n\nAfter you've\
    \ done this, preview your app. This time, whenever you call dispatch to fire another\
    \ action, the render function gets called when the Store is modified. Phew!\n\n\
    # Conclusion\n\nWe've taken a whirlwind tour of Redux and the major pieces of\
    \ functionality it brings to the table. We looked at not only the concepts that\
    \ make Redux really useful for dealing with application state, but also the code\
    \ to make everything real. The only thing we didn't get to do was create a more\
    \ realistic example. Redux is flexible enough to work with any UI framework, and\
    \ each UI framework has its own magic in working with Redux. Our UI framework\
    \ of choice is, of course, React! We'll look how to tie them together in the next\
    \ chapter.\n\n> Note: If you run into any issues, ask!\nIf you have any questions\
    \ or your code isn't running like you expect, don't hesitate to ask!\nPost on\
    \ the forums at https://forum.kirupa.com and get help from some of the friendliest\
    \ and most knowledgeable people the Internet has ever brought together!"
  merge: -1
