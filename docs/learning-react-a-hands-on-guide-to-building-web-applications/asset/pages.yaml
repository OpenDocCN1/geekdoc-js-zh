  md: "# Conclusion\n\nOkay, I lied. There's actually one thing we need to do, and\
    \ it's a subtle one. React makes UI updates fast by having a good idea of what\
    \ exactly is going on your DOM. It does this in several ways, but one really noticeable\
    \ way is by internally marking each element with some sort of an identifier.\n\
    \nWhen you create elements dynamically (such as what we're doing with our array\
    \ of Circle components), these identifiers are not automatically set. We need\
    \ to do some extra work. That work takes the form of a key prop whose value React\
    \ uses to uniquely identify each particular component.\n\nFor our example, we\
    \ can do something like this:\n\n```\nfor (var i = 0; i < colors.length; i++)\
    \ {\n  var color = colors[i];\n  renderData.push(<Circle key={i + color} bgColor={color}\
    \ />);\n}\n```\n\nOn each component, we specify our key prop and set it to a value\
    \ of color and index position inside the colors. This ensures that each component\
    \ we dynamically create ends up getting a unique identifier that React can use\
    \ to optimize any future UI updates.\n\n# Check Your Console, Yo!\n\nReact is\
    \ really telling you when you might be doing something wrong. For example, if\
    \ you dynamically create elements or components and don't specify a key prop on\
    \ them, you'll be greeted with the following warning in your console:\n\n> Warning:\
    \ Each child in an array or iterator should have a unique \"key\" prop. Check\
    \ the top-level render call using <div>.\n\nWhen you're working with React, it's\
    \ a good idea to periodically check your console for any messages. Even if things\
    \ are working just fine, you never know what you might find.\n\n# Conclusion\n\
    \nAll the tips and tricks you've seen in this article are possible because of\
    \ one thing: JSX JavaScript. This is what allows you to have JSX wherever JavaScript\
    \ lives. To us, it looks like we're doing something absolutely bizarre when we\
    \ specify something like this:\n\n```\nfor (var i = 0; i < colors.length; i++)\
    \ {\n  var color = colors[i];\n  renderData.push(<Circle key={i + color} bgColor={color}\
    \ />);\n}\n```"
