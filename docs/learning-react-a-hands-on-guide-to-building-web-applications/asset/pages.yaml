  md: "# Chapter 13 Setting Up Your React Environment Easily\n\nThe important part\
    \ to look at is the div element with an id value of root. This is where the contents\
    \ of our React app get printed to. Speaking of that, the contents of our React\
    \ app with all the JSX generated inside the src folder. The starting point for\
    \ our React app is contained in index.js.\n\n```\nimport React from 'react';\n\
    import ReactDOM from 'react-dom';\nimport './index.css';\nimport App from './App';\n\
    import registerServiceWorker from './registerServiceWorker';\n```\n\n```\nReactDOM.render(<App\
    \ />, document.getElementById('root'));\nregisterServiceWorker();\n```\n\nNotice\
    \ the ReactDOM.render call looks for the root element we called out in index.html.\
    \ You'll see a bunch of import statements at the top of the page. These import\
    \ statements are part of something in JavaScript known as modules. The goal of\
    \ modules is to divide the functionality of your app into increasingly smaller\
    \ pieces. When it comes time to use a piece, import all you need instead of everything\
    \ and the entire kitchen sink. Some of the modules you import are a part of your\
    \ project. Other modules, like React and ReactDOM, are external to your project\
    \ but still capable of being imported. I can say a lot about module loading, but\
    \ for your sanity (and mine!), let's leave that topic for now.\n\nIn our code\
    \ right, we're importing both the React and React-DOM libraries. That should be\
    \ familiar from when we included the script tags for them. We're also importing\
    \ a CSS file, a service worker script that we'll reference as registerServiceWorker,\
    \ and a React component that we'll reference as App.\n\nOur App component seems\
    \ like our next stop, to see what's inside, open App.js:\n\n```\nimport React,\
    \ { Component } from 'react';\nimport logo from './logo.svg';\nimport './App.css';\n\
    ```\n\n```\nclass App extends Component {\n  render() {\n    return (\n      <div\
    \ className=\"App\">\n        <header className=\"App-header\">\n          <img\
    \ src={logo} className=\"App-logo\" alt=\"logo\" />\n          <h1>Welcome to\
    \ React</h1>\n        </header>\n        <p className=\"App-intro\">\n       \
    \   To get started, edit <code>src/App.js</code> and save to reload.\n       \
    \ </p>\n      </div>\n    n  }\n}\n\nexport default App;\n```"
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Meet Create React 157


    Notice our App.js file has import statements of its own. Some, like the one for
    React and Component, necessary, given what our code is doing. The last line here
    is interesting: export default app. It contains the export command and the name
    that our project will use to identify the exported module. You''ll use this exported
    name when importing the App module in other parts of the project, such as index.js.
    Closing out this file is doing, it also imports an image and CSS file that are
    needed to make this work.


    You''ve seen a different way of structuring code using potentially new keywords.
    The purpose of all of this? These modules, import statements, and export statements
    are just niceties to make our app''s code more manageable. Instead of having everything
    defined in one giant file, you can break your code and related assets across multiple
    files. Depending on which files you reference and what files loaded ahead of others,
    our mysterious process (currently kicked off with an npm start) can optimize the
    output in a variety of ways that we don''t need to worry about.


    The important point to note is that none of these things you are doing affect
    the functionality of your final app in any major way. Behind the scenes, when
    we''re ready to test our app, a build step makes sense of all the various files
    and components you are importing, to them as an easily digestible set of combined
    files for the browser to take care of. We''ll get one JS file with all the relevant
    pieces represented:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_171_0.png)


    We''ll also get one combined CSS file. Depending on what you might have configured,
    you could get other combined files for your HTML and more. All of these will be
    in a form that your browser will immediately know what to do with. Your browser
    will have no additional work to do, as in our in-browser solution we were using
    initially. Everything gets as vanilla HTML, CSS, and JavaScript.'
