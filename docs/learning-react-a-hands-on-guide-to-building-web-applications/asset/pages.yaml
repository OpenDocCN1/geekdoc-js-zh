  md: '# Meet Synthetic Events


    In React, when you specify an event in JSX as we did with onClick, you''re not
    directly dealing with regular DOM events. Instead, you''re dealing with a React-specific
    event type known as a SyntheticEvent. Your event handlers do not get native arguments
    of type MouseEvent, KeyboardEvent, and so on. They always get arguments of type
    SyntheticEvent that wrap your browser''s native event instead. What''s the fault
    of this in our code? Surprisingly not a lot.


    Each SyntheticEvent contains the following properties:


    +   boolean bubbles

    boolean cancelable

    DOMEvent currentTarget

    boolean defaultPrevented

    number eventPhase

    boolean isTrusted

    DOMEvent nativeEvent

    void preventDefault()

    boolean isPrevented()

    void stopPropagation()

    boolean isPropagationStopped()

    DOMEvent target target

    number timestamp

    string type


    These properties should seem pretty straightforward...and generic! The generic
    stuff depends on what type of native event our SyntheticEvent is wrapping. This
    means that a SyntheticEvent that wraps a MouseEvent will have access to mouse-specific
    properties such as the following:


    +   boolean altKey

    number button

    number buttons

    number clientX

    number clientY

    boolean ctrlKey

    boolean getModifierState(key)

    boolean metaKey

    number pageX

    number pageY

    DOMEvent target related

    number screenX

    number screenY

    boolean shiftKey'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'Similarly, a SyntheticEvent that wraps a KeyboardEvent will have access to
    these additional keyboard-related properties:


    ```

    boolean altKey

    number charCode

    boolean ctrlKey

    boolean getModifierState(key)

    string key

    number keyCode

    string locale

    number location

    boolean metaKey

    boolean repeat

    boolean shiftKey

    number which

    ```


    In the end, all of this means that you still get the same functionality in the
    SyntheticEvent that you had in the vanilla DOM world.


    Now, here''s something I learned the hard way: Don''t refer to traditional DOM
    documentation when using SyntheticEvents and their properties. Because the SyntheticEvent
    wraps your native DOM event, and their properties might not map one-to-one. Some
    DOM events don''t even exist in React. To avoid running into any issues, if you
    want to know the name of a SyntheticEvent or any of its properties, refer to the
    React Event System document (https://facebook.github.io/react/docs/events.html)
    instead.


    # Doing Stuff with Event Properties


    By now, you''ve seen more about the DOM and SyntheticEvents than you''d probably
    like to. Wash away the taste of all that text, let''s write some code and put
    your newfound knowledge to good use. Right now, we increment our counter by 10
    when the Shift key on the keyboard is pressed while clicking the plus button with
    our mouse.


    We can do this by the shiftKey property that exists on the SyntheticEvent when
    using the mouse:


    ```

    boolean altKey

    number button

    number buttons

    number clientX

    number clientY

    boolean ctrlKey

    boolean getModifierState(key)

    boolean metaKey

    number pageX

    number pageY

    ```'
