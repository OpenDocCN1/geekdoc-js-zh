- img_proc: true
  md: "```\nrender() {\n  return (\n    {this.state.strikes}\n  );\n}\n```\n\nWe've\
    \ replaced our default Hello! text with an expression that displays the value\
    \ stored by the this.state.strikes property. If you preview your example in the\
    \ browser, you will see a value of 0. That's a start!\n\n# Starting Our Timer\
    \ and Setting State\n\nNext up, we is getting our timer going and incrementing\
    \ the strikes property. As we mentioned earlier, we will be using the setInterval\
    \ function to increase the strikes property by 100 every second. We're going to\
    \ do all of immediately after our component has been rendered using the built-in\
    \ componentDidMount method.\n\nThe code for kicking off our timer looks as follows:\n\
    \n```\nclass LightningCounter extends React.Component {\n  constructor(props)\
    \ {\n    super(props);\n\n    this.state = {\n      strikes: 0\n    };\n  }\n\n\
    \  timerTick() {\n    this.setState({\n      strikes: this.state.strikes + 100\n\
    \    });\n  }\n\n  componentDidMount() {\n    setInterval(this.timerTick, 1000);\n\
    \  }\n\n  render() {\n    return (\n      {this.state.strikes}\n    );\n  }\n\
    }\n```"
