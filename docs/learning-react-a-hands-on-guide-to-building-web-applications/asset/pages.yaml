  md: '# The Updating Phase


    After your components get added to the DOM, they can potentially update and re-render
    when a prop or state change occurs. During this time, a different collection of
    lifecycle methods gets called. Yawn. Sorry...


    # Dealing with State Changes


    First, let''s look at a state change. As we mentioned earlier, when a state change
    occurs, your component calls its render method. Any components that rely on the
    output of this component also get their render methods called. This is done to
    ensure that the component is always displaying the latest version of itself. All
    of that is true, but it''s only a partial representation of what happens.


    When a state change happens, all the lifecycle methods in Figure 11.5 get called.


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_144_0.png)


    Check out what these lifecycle methods do:'
  merge: -1
  pgno: 144
- img_proc: true
  md: "# Meet the Lifecycle Methods\n\n# shouldComponentUpdate\n\nSometimes you don't\
    \ want your component to update when a state change occurs. This method allows\
    \ you to control this updating behavior. If you use this method and return a true\
    \ value, the component will update. If this method returns a false value, this\
    \ component will skip updating.\n\nThat probably sounds a bit confusing, so take\
    \ a look at a simple snippet:\n\n```\nshouldComponentUpdate(newProps, newState)\
    \ {\n  console.log(\"shouldComponentUpdate: Should component update?\");\n```\n\
    \n```\nif (newState.count < 5) {\n  console.log(\"shouldComponentUpdate: Component\
    \ should update!\");\n  return true;\n} else {\n  ReactDOM.unmountComponentNode(destination);\n\
    \  console.log(\"shouldComponentUpdate: Component should not update!\");\n  return\
    \ false;\n}\n```\n\nThis method gets with two arguments, which we named newProps\
    \ and newState. In this snippet of code, we check whether the value of our id\
    \ state property is less than or equal to 2. If the value is less than or equal\
    \ to 2, we return true to indicate that this component should update. If the value\
    \ is not less than or equal to 2, we return false to indicate that this component\
    \ should not update.\n\n# componentWillUpdate\n\nThis method gets just before\
    \ your component is about to update. Nothing exciting happens here. One point\
    \ to note is that you can change your state by calling this.setState from this\
    \ method.\n\n# render\n\nIf you don't override the update via shouldComponentUpdate,\
    \ the code inside render gets called again to ensure that your component displays\
    \ itself properly.\n\n# componentDidUpdate\n\nThis method gets called after your\
    \ component updates and the render method has been called. If you need to execute\
    \ any code after the update takes place, this is the place to stash it."
  merge: -1
  pgno: 145
