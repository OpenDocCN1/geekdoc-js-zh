    that React takes care of that tedious task for you. If you''ve never had to optimize
    event handler–related code yourself, consider yourself lucky.


    # # Conclusion


    You''ll spend good amount of time dealing with events, and this chapter threw
    a lot of things at you. We started by exploring the basics of how to listen to
    events and specify your event handler. Toward the end, we got fully invested and
    looked at corner cases that you''ll bump into if you aren''t careful enough. You
    don''t want to bump into corners. That''s never fun.


