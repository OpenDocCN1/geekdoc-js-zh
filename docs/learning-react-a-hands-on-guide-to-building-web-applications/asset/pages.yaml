  md: '# 8

    Dealing with State in React


    Up to this point, the components we''ve created have been stateless. They have
    properties (a.k.a. props) that are passed in their parent, but nothing (usually)
    changes about them once the components come alive. Your properties are considered
    immutable once they''ve set. For many interactive scenarios, you don''t want that.
    You want to be able to change aspects of your components as a result of some user
    interaction (or some data getting returned from a server or a billion things).


    We need another way to store data on a component that goes beyond properties.
    We need a way to store data that can be changed. What we need is something known
    as state. In this chapter, you learn all about state and how you can use it to
    create stateful components.


    # Using State


    If you know how to work with properties, you totally know how to work with states...sort
    of. There are some differences, but they''re too short to bore you with right
    now. Instead, let''s jump right in and see states in action by using them in a
    small example.


    We''re going to create a simple lightning counter example, as shown in Figure
    8.1.'
