  md: '# Chapter 13 Setting Up Your React Dev Environment Easily


    In the following sections, we''re going to look at one way to set up your development
    environment using a combination of Node, Babel, webpack. If all of this sounds
    bizarre to you, don''t worry. We''ll use a really nifty solution created by Facebook
    that makes all of this a breeze.

    Onward!


    # Meet Create React


    A few years ago, getting your build environment setup would have been a huge pain
    because it involved manually configuring all the tools we''ve talked about. You
    would have had to ask your really smart friend for some advice. You might even
    questioned your decision to learn programming and React in the first place. Fortunately,
    the Create React project (https://github.com/facebookincubator/create-react-app)
    came about and greatly simplified the process of setting up your environment.
    You just run a few commands on your command line, and your React project is automatically
    created with all the proper behind-the-scenes configurations.


    To started, make sure you have the latest version of Node installed (https://nodejs.org/).
    Then bring up your favorite command line. If you''re not familiar with command
    lines, don''t worry. On Windows, launch the command prompt or the BASH shell.
    On Mac, launch the Terminal. You''ll see that looks like this:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_166_0.png)


    It''s basically bizarre window with a blinking cursor that allows you to type
    things into it. The first thing you need to do is install the Create React project.
    Type the following in your command line and press Enter/Return:


    ```

    npm install -g create-react-app

    ```'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'It can take anywhere from a few seconds to few minutes, but once your installation
    has completed, it''s time to create our new React project. Navigate to the folder
    where you have to create your new project—this can be your desktop, a location
    under Documents, and so on. When you''ve navigated to a folder in your command
    line, enter the following to create a new project at this location:


    ```

    create-react-app helloworld

    ```


    You''ll see something that looks as follows:


    ![](img/bba9dcf50e224bceeea9a4c4b3771b06_167_0.png)


    After the command has fully executed, you''ll have a project called helloworld
    created for you. Don''t worry too much about everything that''s going on; we''ll
    look at the project contents later. Now, the first thing to do is test this project.
    Navigate into the newly created project''s helloworld folder by typing the following:


    ```

    cd helloworld

    ```


    From inside this folder, enter the following to test the app:


    ```

    npm start

    ```


    If you have yarn installed, Create will prefer it over npm for the install and
    you''ll see onscreen instructions to use yarn start instead of npm start.'
