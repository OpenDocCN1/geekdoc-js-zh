    ```


    Calling this._input.value = "" clears the color we entered. We set back to our
    input element by calling this._input.focus(). Our all-ref work was to simply enable
    these two lines; we needed some way to have this._input point to the HTML element
    representing our input element in JSX. Then we can just call the value property
    and focus method that the DOM API exposes on this element.'
