  md: "```\n<div>\n<p>{this.props.color}</p>\n<p>{this.props.num}</p>\n<p>{this.props.size}</p>\n\
    </div>\n\n);\n}\nclass Label extends React.Component {\n  render() {\n    return\
    \ (\n      <Display {...this.props} />\n    );\n  }\n}\n```\n\n```\nclass Shirt\
    \ extends React.Component {\n  render() {\n    return (\n<div>\n      <Label {...this.props}\
    \ />\n    </div>\n    );\n  }\n}\n```\n\nIf you run this code, the end result\
    \ is unchanged from what we had earlier. The biggest difference is that we are\
    \ no longer passing in expanded forms of each property as part of calling each\
    \ component. This solves all the problems we originally set to solve.\n\nUsing\
    \ the spread operator, if you ever decide to add properties, rename properties,\
    \ or do any other sort of property-related shenanigans, you don't have to make\
    \ a billion different changes. You make one change at the spot you define your\
    \ property. That's all. All the intermediate components that merely transfer the\
    \ properties remain untouched the {...this.props} expression contains no details\
    \ of what goes inside.\n\n# Is this the best way to transfer properties?\n\nUsing\
    \ the spread operator to transfer properties is convenient, and it's a marked\
    \ improvement over explicitly defining each property at each component as we were\
    \ originally doing. The thing is, even the spread operator approach isn't a perfect\
    \ solution. If you want to transfer a property to a particular component, having\
    \ each intermediate component play a role in passing it is onerous. Worse, it\
    \ has the potential to be a performance bottleneck. Any change to a property that\
    \ you are passing along will trigger a component update on each component along\
    \ the property's path. That's not a good thing! Later, we look at ways to solve\
    \ this transferring properties problem in a much better, without any side effects."
