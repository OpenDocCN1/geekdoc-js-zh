  md: 'Conclusion 195


    # Uncontrolled Components vs. Controlled Components


    Form elements are interesting. These elements that contain some state on their
    own. For example, your text element might have some content in it, or you might
    have some items already selected in a drop-down list. React is all about centralizing
    state into its own little world, so it doesn''t like form elements have their
    internal mechanism for storing state. The guidance is to synchronize all the form
    data inside a React component by using events as onChange. These components that
    let React deal with form elements are known as controlled components.


    Still, it''s a hassle to have every form element deal keeping state in sync. The
    React developers that get as all. The workaround is to do nothing. We simply let
    form elements with their own state and use refs to access the values needed. That''s
    what we did in this example. When we have components that defer all state management
    to the form element, these components are known as uncontrolled components.


    # Conclusion


    Our app is pretty simple in what it does, but by building it from scratch, we
    covered almost every little interesting detail React brings to the table. More
    important, we created an example that shows how the various concepts we learned
    individually play together. That''s truly actually the important detail.


    Now here''s a quick question for you: Does everything we''ve done in this chapter
    make sense? If so, you''re in good shape to tell your friends and family that
    you''re close to mastering React. If you still find areas confusing, I recommend
    that you go back and reread the chapters to address your shortcomings.


    > Note: If you run into any issues, ask!

    If you have any questions or your code isn''t running like you expect, don''t
    hesitate to ask!

    Post on the forums at https://forum.kirupa.com and get help from some of the friendliest
    most knowledgeable people the Internet has brought together!'
