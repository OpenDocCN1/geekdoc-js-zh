    In our highlighted line, call our IPAddress component, define a prop called ip,
    and set its value to the ip_address state variable. This is to ensure that your
    IP address value travels all the way back to the IPAddress component''s render
    method, where it gets formatted and displayed.


    If you preview your app in your browser, you would see something identical to
    the example we set out to create in the beginning.


    ![](bbox=[0.247, 0.245, 0.752, 0.597])


    At this point, you''re done with the app....and almost done with this tutorial.
    You just need to know one more thing about these awesome components that you''ve
    added.


    # Presentational vs. Container Components


    Given we''ve seen here so far, it seems like a good time to talk about a design
    choice that we''ve been feeding not just in this tutorial, but in other tutorials
    as well. In our React apps, we have been mainly dealing with two types of components:


    +   1. **Components that deal with how things works.** These are better known
    as presentational components.

    2. **Components that perform under-the-covers processing.** Examples of this processing
    including routing, increasing a counter, fetching data via a HTTP request, and
    so on. You will see these components referred to as container components.


    Thinking about components in terms of whether they display something (presentational)
    or whether they feed data to other components (container) helps you organize your
    React app. For the full low-down on how to deal with these two types of components,
    check out this article by React''s Dan Abramov: https://medium.com/@dan_abramov/smart-and-dumb-components-7ca2f9a7c7d0.'
