  md: "# Seeing the render Calls 219\n\nInside the MenuButton component, add the following\
    \ highlighted lines:\n\n```\nimport React, { Component } from \"react\";nimport\
    \ \"./MenuButton.css\";\n```\n\n```\nclass MenuButton extends Component {\n  shouldComponentUpdate(nextProps,\
    \ nextState) {\n    return false;\n  }\n```\n\n```\nrender() {\n  console.log(\"\
    Rendering: MenuButton\");\n\n  return (\n    <button id=\"roundButton\"\n    \
    \  onMouseDown={this.props.handleMouseDown}></button>\n  );\n}\n```\n\n```\nexport\
    \ default MenuButton;\n```\n\nRefresh your app to test your code. Pay attention\
    \ to the console and see what gets printed when you're showing and hiding a menu.\
    \ Your output when your page loads and the menu is displayed for the first time\
    \ now as follows:\n\nRendering: MenuContainer\n\nRendering: MenuButton\n\nRendering:\
    \ Menu\n\n**clicked**\n\nRendering: MenuContainer\n\nRendering: Menu\n\nNotice\
    \ that our MenuButton component's render method isn't called. That's great. Before\
    \ we celebrate too much, we've really taken a hammer to our problem by always\
    \ returning false when shouldComponentUpdate gets called. While that works for\
    \ what we are doing, it's a bit more careful to ensure we're not accidentally\
    \ preventing valid updates in the future if we eventually modify MenuButton and\
    \ how it gets used.\n\nWhen you look at the shouldComponentUpdate method's signature,\
    \ you can see two arguments passed in. One is for the next prop value, and the\
    \ other is for the next state value. We can use these arguments to compare the\
    \ present with the future and act a bit more intelligently about whether we allow\
    \ our render call to be made. In the case of MenuButton, the"
