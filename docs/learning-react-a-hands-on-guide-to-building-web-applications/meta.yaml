  md: "# Styling React Content Using CSS\n\nUsing CSS to style React content is actually\
    \ as straightforward as you can imagine it to. Because React ends up spinning\
    \ out regular HTML tags, all of the various CSS tricks you've learned over the\
    \ years for styling HTML still apply. You just need to keep a few minor points\
    \ in mind.\n\n# Understand the Generated HTML\n\nBefore you can use CSS, you need\
    \ to get a feel for how the HTML that React spits out is going to look. You can\
    \ easily figure out by looking at the JSX defined inside the render methods. The\
    \ parent render method is ReactDOM-based one, and it looks as follows:\n\n```\n\
    <div>\n  <Letter>A</Letter>\n  <Letter>E</Letter>\n  <Letter>I</Letter>\n  <Letter>O</Letter>\n\
    \  <Letter>U</Letter>\n</div>\n```\n\nWe have our Letter components wrapped inside\
    \ a div. Nothing too exciting here. The render method inside our Letter component\
    \ isn't that much different, either:\n\n```\n<div>\n  {this.props.children}\n\
    </div>\n```\n\nAs you can see, each individual vowel is wrapped inside its own\
    \ set of div tags. If you play this all out (such as viewing our example in a\
    \ browser), the final DOM structure for our vowels would look like Figure 4.3.\n\
    \n```\n<div id=\"container\"> == $0\n<div>\n  <div>A</div>\n  <div>E</div>\n \
    \ <div>I</div>\n  <div>O</div>\n  <div>U</div>\n</div>\n</div>\n```\n\nFigure\
    \ 4.3 The preview from inside the browser."
  merge: -1
  pgno: 54
- img_proc: false
  md: "# Styling React Content Using CSS\n\nWe have simply an HTML-ized expansion\
    \ of the various JSX fragments you saw in the render method a few moments ago,\
    \ with our vowels nested a bunch of div elements.\n\n# Just Style It Already!\n\
    \nWhen you understand the HTML arrangement of the things you want to style, the\
    \ hard part is done. Now the fun and familiar part of defining style selectors\
    \ and specifying the properties you want to set. To affect the inner div elements,\
    \ add the following inside the style:\n\n```\ndiv div {\n  padding: 10px;\n  margin:\
    \ 10px;\n  background-color: #FFDE00;\n  color: #333;\n  display: inline-block;\n\
    \  font-family: monospace;\n  font-size: 32px;\n  text-align: center;\n}\n```\n\
    \nThe div selector ensures that we style the right things. The end result will\
    \ be our vowels to leak exactly like we set out. With that, a selector of div\
    \ div looks a bit odd, doesn't it? It's too generic. In apps with more than three\
    \ div elements (which is common), you can end up styling the wrong things. At\
    \ these times like, you will want to change the HTML that React generates to make\
    \ the content more easily sizeable.\n\nWe address this by giving our inner div\
    \ elements a class value of letter. Here is where JSX differs from HTML. Make\
    \ the following highlighted change:\n\n```\nclass Letter extends React.Component\
    \ {\n  render() {\n    return (\n      <div className=\"letter\">\n        {this.props.children}\n\
    \      </div>\n    );\n  }\n}\n```\n\nNotice that we designate the class value\
    \ using the className attribute instead of the class attribute. This is because\
    \ the word class is a special keyword in JavaScript. If that doesn't make any\
    \ sense, don't worry about it for now; we'll cover it later.\n\nAfter you've given\
    \ your div className value of letter, there's just one more thing to do. Modify\
    \ the CSS selector to target the div elements cleanly.\n\n```\n.letter {\n  padding:\
    \ 10px;\n  margin: 10px;\n}\n```"
  merge: -1
  pgno: 55
