    \ it introduces you to one of the most frequently used methods you'll use in the\
    \ React universe: `ReactDOM.render` method.\n\nThe `render` method takes two arguments:\n\
    \n+   1. The HTML-like elements (a.k.a. JSX) you want to output\n2. The location\
    \ in the DOM where React will render the JSX into\n\nHere's what our `render()`\
    \ method looks like:\n\n```\nReactDOM.render(\n  <h1>Sherlock Holmes</h1>,\n \
    \ document.body\n);\n```\n\nOur first argument is the text `Sherlock Holmes` wrapped\
    \ inside some `<h1>` tags. This HTML-like syntax your JavaScript is JSX is all\
    \ about. We'll spend a more time drilling into JSX a bit later, but I should mention\
    \ this up front: *It is bit as crazy as it looks.* Whenever I see brackets and\
    \ slashes in JavaScript, a part of me dies on the inside because of all the string"
