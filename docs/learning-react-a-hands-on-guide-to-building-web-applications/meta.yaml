  md: '# 16

    Creating a Sliding Menu in React


    Sliding menus are all the UIs today. All the cool kids are building them, and
    your friends probably just can''t get enough of them. These menus are basically
    off-screen elements that slide into view when you click or tap on something. *something*
    could be an arrow, a hamburger icon, or something else that indicates a menu will
    appear.


    To see a sliding menu in action, go here: https://www.kirupa.com/react/examples/sliding_menu_css/index.html.


    You''ll see a yellow menu with navigation links smoothly slide in. If you click
    a navigation link or anywhere in the yellow region inside that menu, the menu
    slides back (really smoothly again, of course) and the content behind it reappears.
    Let''s look at how to create all of this using React.


    > Note: For a Non-React Solution

    If you''re looking to create this menu using plain JavaScript without any React
    wizardry, the tutorial *Creating a Smooth Sliding Menu* (http://bit.ly/plainSidingMenu)
    has you covered.


    # How the Sliding Menu Works


    Before we jump into the code, let''s take a few moments to better understand how
    exactly our sliding menu works. Starting at the very top, we have our page that
    displays some content:'
