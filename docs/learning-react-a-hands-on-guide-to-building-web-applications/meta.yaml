  md: '# The Component Lifecycle


    In the beginning, we took a very simple view of components and what they do. As
    you learned more about React and did cooler and more involved things, you came
    to see that components aren''t all that simple. They help us dealth with properties,
    state, events, and often are responsible for the well-being of other components
    as well. Keeping track of everything components sometimes can be tough.


    To help with this, React provides us with lifecycle methods. Unsurprisingly, lifecycle
    methods are special methods that automatically get called as our component goes
    about its business. They notify us of important milestones in a component''s life,
    and we can use these notifications to simply pay attention or what our component
    is about to do.


    In this chapter, we look at these lifecycle methods and talk about what we can
    do with them.


    > Note: Changes Are a Foot Here!

    There are proposed changes in this area that will change how lifecycle methods
    behave. What you see printed here is based on the latest guidance, but note that
    this information may change. Visit this link to be up-to-date: http://bit.ly/lifecycleChanges.


    # Meet the Lifecycle Methods


    Lifecycle methods aren''t very complicated. You can think of them as glorified
    event handlers that get called at various points in a component''s life. With
    event handlers, you can write some code to do things at various points. Before
    we go further, it''s time for you to quickly meet our lifecycle methods:


    +   - componentWillMount

    - componentDidMount

    - componentWillUnmount

    - componentWillUpdate

    - componentDidDidUpdate

    - shouldComponentUpdate

    - componentWillReceiveProps

    - componentDidCatch'
