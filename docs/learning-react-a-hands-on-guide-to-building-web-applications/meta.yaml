    \n```\n<Display {...this.props} />\n```\n\nThe runtime behavior when using ...this.props\
    \ is the same as when specifying the color, num, and size properties manually.\
    \ This means our earlier example can be simplified as follows (pay attention to\
    \ the highlighted lines):\n\n```\nclass Display extends React.Component {\n  render()\
    \ {\n    return (\n```"
