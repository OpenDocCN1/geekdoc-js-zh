  md: "```\n<p>returning a list</p>\n<p>of things!</p>\n</React.Fragment>\n\n);\n\
    }\n```\n\nYou wrap the list of items you want to return into a magical React.Fragment\
    \ component.\nA few cool things here:\n\n+   1. This component doesn't actually\
    \ generate a DOM element. It is just something you specify in JSX that has no\
    \ tangible existence when transpiled into the HTML your browser sees.\n2. You\
    \ aren't treating what you are returning as items in an array, so you don't need\
    \ commas or anything separating each item.\n3. There's no need to specify a unique\
    \ key attribute and value; this is all taken care of under the covers for you.\n\
    \nBefore we leave this section, know that you can use a condensed syntax instead\
    \ of fully specifying React.Fragment... like an animal. You can just use empty\
    \ <> and </> tags:\n\n```\nclass Stuff extends React.Component {\nrender() {\n\
    <>\n  <p>I am</p>\n  <p>returning a list</p>\n  <p>of things!</p>\n</>\n};}\n\
    ```\n\nThis looks like something from the future, so if you're inclined to use\
    \ fragments to return multiple values, feel free to use this smaller syntax.\n\
    \n# You Can't Specify CSS Inline\n\nAs you saw in Chapter 4, \"Styling in React\"\
    , the style attribute in JSX behaves differently from the style attribute in HTML.\
    \ In HTML, you can specify CSS properties directly as values on your style attribute:\n\
    \n```\n<div style=\"font-family:Arial;font-size:24px\">\n  <p>Blah!</p>\n</div>\n\
    ```"
