  md: "```\n<style>\n</head>\n<body>\n<div id=\"container\"></div>\n<script type=\"\
    text/babel\">\n  var ReactDOM = document.querySelector(\"#container\");\n\n  ReactDOM.render(React.createElement(\n\
    \    \"h1\",\n    null,\n    \"Batman\"\n  ), destination);\n</script>\n</body>\n\
    </html>\n```\n\nNotice that there's a trace of React-like code in sight. (Also,\
    \ we should use the word nary more often in everyday conversation!)\n\n# Conclusion\n\
    \nIf this is your first time building a React app, we covered a lot of ground\
    \ here. One of the biggest takeaways is that React is different than other libraries\
    \ because it uses a new language called JSX to define what the visuals will look\
    \ like. You got a very small glimpse of that when we defined the h1 tag inside\
    \ the render method.\n\nJSX goes beyond how you define your UI elements. It also\
    \ alters how you build your app. Because your browser can't understand JSX in\
    \ its native representation, you need to use an intermediate step to convert JSX\
    \ into JavaScript. One approach is to build your app using the transpiled JavaScript\
    \ output to correspond to the JSX source. Another approach (the one we used here)\
    \ is to use the Babel to translate the JSX into JavaScript. While the performance\
    \ hit on the browser itself is not recommended for live/production apps, when\
    \ you're familiarizing with React, you can't beat the convenience.\n\nIn future\
    \ chapters, we spend some time dipping deeper into JSX and going beyond the render\
    \ method as we learn the important things that make React tick.\n\n+   - Note:\
    \ If you run into any issues, ask!\n- If you have any questions or your code isn't\
    \ running like you expect, don't hesitate to ask! Post on the forums at https://forum.kirupa.com\
    \ and get help from some of the friendliest and most knowledgeable people the\
    \ Internet has ever brought together!"
