    Onward!


    # Web Request 101


    As you probably know well by now, the Internet is made up of a bunch of interconnected
    computers, called servers. When you''re surfing the web and navigating between
    web pages, you''re really telling your browser to request information from any
    of these servers. It kind of looks as follows: Your browser sends a request, waits
    awkwardly for the server to respond to the request, and (once the server responds)
    processes the request. All of this communication is made possible because of something
    known as the HTTP protocol.


    The HTTP protocol provides a common language that allows your browser and a bunch
    of other things to communicate with all the servers that make up the Internet.
    The requests your browser makes on your behalf using the HTTP protocol are known
    as HTTP requests, and these requests go well beyond simply loading a new page
    as you are navigating. A common (and whole more exciting!) set of cases revolves
    around updating your page with data resulting from a HTTP request.


    For example, you might have a page where you''d like to display some information
    about the currently logged-in user. This is information your page might not have
    initially, but it is information your browser will request when you''re interacting
    with the page. The server will respond with the data and update your page with
    that information. All of this probably sounds a bit abstract, so I''m going to
    go a bit weird for a few moments and describe a possible HTTP request and response
    for this example.'
