  md: "# Chapter 7 Meet JSX...Again!\n\nIn JSX, the style attribute can't contain\
    \ CSS inside it. Instead, it needs to refer to an object that contains styling\
    \ information:\n\n```\nclass Letter extends React.Component {\n  render() {\n\
    \    var letterStyle = {\n      padding: 10,\n      margin: 10,\n      backgroundColor:\
    \ this.props.bgcolor,\n      color: \"#333\",\n      display: \"inline-block\"\
    ,\n      fontFamily: \"monospace\",\n      fontSize: \"32\",\n      textAlign:\
    \ \"center\"\n    };\n\n    return (\n      <div style={letterStyle}>\n      \
    \  {this.props.children}\n      </div>\n    );\n  }\n}\n```\n\nNotice we have\
    \ an object called letter that contains all the CSS properties (camel-case JavaScript\
    \ form) and their values. That object is what we then specify to the style attribute.\n\
    \n# Comments\n\nJust as it's a good idea to comment your HTML, CSS, and JavaScript,\
    \ it's a good idea to provide comments inside your JSX. Specifying comments in\
    \ JSX is similar to how you comment in JavaScript, with one exception. If you're\
    \ specifying a comment as a child of a tag, you need to enclose your comment within\
    \ the { } brackets to ensure that it is parsed as an expression:\n\n```\nReactDOM.render(\n\
    \  <div className=\"slideIn\">\n    <p className=\"emphasis\">Gagagool!</p>\n\
    \    /* I am a child comment */\n    <Label/>\n  </div>\n,document.querySelector(\"\
    #container\"));\n```"
  merge: -1
