    All we really did here was use a boring old JavaScript API inside a component,
    hook up some events, and do the same state- prop-related tasks you''ve done several
    times already. Here''s the thing: You''ve already learned almost everything there
    is to learn the basics of React. Going forward, nothing should surprise you. The
    only new things we''ll be looking at fall into the category of repurposing and
