    \ for dramatic effect, but fixing it is straightforward. The solution just involves\
    \ specifying a property name and accessing it via `this.props`. You've seen all\
    \ this before; the only difference is the number of times you have to do it.\n\
    \nThere's no way to specify a property on a parent component and have all descendants\
    \ automatically gain access to that property. There are many *improper* ways to\
    \ deal with this, such as defining objects and directly setting the value on a\
    \ component property. We won't concern ourselves with improper solutions right\
    \ now, though. We aren't animals!\n\nThe proper way to pass a value to a child\
