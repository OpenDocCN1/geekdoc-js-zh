  md: "# Capitalization, HTML Elements, and Components 85\n\nOur comment in this case\
    \ is a child of the our div element. If you specify a comment wholly inside a\
    \ tag, you can just specify your single-line or multiline comment without having\
    \ to use the { } angle brackets:\n\n```\nReactDOM.render(\n  <div className=\"\
    slideIn\">\n    <p className=\"emphasis\">Gabagool!</p>\n    <Label>\n      /*\
    \ This comment\n      goes across\n      multiple lines *\n      className=\"\
    colorCard\" // end line\n    </Label>\n  </div>\n  document.querySelector(\"#container\"\
    )\n);\n```\n\nIn this snippet, you can see an example of a multiline comment and\
    \ a comment at the end of a line. Now that you know all of it, you have no excuse\
    \ to not comment your JSX.\n\n# Capitalization, HTML Elements, and Components\n\
    \nCapitalization is important. To represent HTML elements, ensure that the HTML\
    \ tag is lowercase:\n\n```\nReactDOM.render(\n  <div>\n    <section>\n      <p>Something\
    \ goes here!</p>\n    </section>\n  </div>\n  document.querySelector(\"#container\"\
    )\n);\n```\n\nWhen you want to represent components, the component name must be\
    \ capitalized:\n\n```\nReactDOM.render(\n  <div>\n    <CustomComponent/>\n  </div>\n\
    \  document.querySelector(\"#container\")\n);\n```\n\nIf you get the capitalization\
    \ wrong, React will not render your content properly. Trying to identify capitalization\
    \ issues is probably the last point you'll think about when things aren't working,\
    \ so keep this little tip in mind."
