    #F9C240\" />\n  </div>,\n  document.querySelector(\"#container\")\n);\n</script>\n\
    </body>\n</html>\n```\n\nWhen you have your document set up, go ahead and preview\
    \ what you have in your browser. If everything went well, you'll be greeted by\
    \ a happy yellow circle (see Figure 9.1)."
  merge: -1
