- img_proc: false
  md: "# Animation! Animation! Animation!\n\nOur last task is to animate something,\
    \ to make adding and removing items look more natural. React offers many ways\
    \ to animate something. You can use traditional approaches such as CSS animations,\
    \ CSS transitions, requestAnimationFrame, the Web Animations API, or a popular\
    \ animation library. All of these approaches will take you...very far.\n\nWhen\
    \ it comes to animating the existence of an element, though, the approaches we\
    \ outlined run into some limitations. Because React entirely handles the lifecycle\
    \ of an element as it is to be deleted from the DOM. We can definitely override\
    \ some of the lifecycle methods to intercept the deletion and recreate our own\
    \ animation logic, but that gets us a bit far into the weeds. We don't want to\
    \ deal with that now.\n\nFortunately the React community has come up with a handful\
    \ of lightweight animation libraries that make adding and deleting elements relatively\
    \ easy. One such library is Flip Move. Among many things, this library makes the\
    \ addition and removal of list elements simple.\n\nTo use this, we need to add\
    \ it to our project. From the command line, make sure you are still in the same\
    \ location as our todolist project and run the following command:\n\n```\nnpm\
    \ i -S react-flip-move\n```\n\nClick Enter/Return to copy all the necessary things\
    \ locally into your project's node_modules folder. That's all the setup required.\
    \ After you've done this, in TodoItems.js, add the following import statement\
    \ at the top:\n\n```\nimport FlipMove from 'react-flip-move';\n```\n\nNow all's\
    \ left is to tell our FlipMove component to animate our list of items. In our\
    \ render function, make the following change:\n\n```\nrender() {\n  var todoEntries\
    \ = this.props.entries;\n  var listItems = todoEntries.map(this.createTasks);\n\
    \n  return (\n    <ul className=\"getList\">\n      <FlipMove duration={250} easing=\"\
    ease-out\">\n        {listItems}\n      </FlipMove>\n    </ul>\n  );\n}\n```\n\
    \nWe're simply wrapping our listitems (just before getting them printed) inside\
    \ a FlipMove component and specifying the animation duration and the type of easing\
    \ to use. That's it. If you preview your app now, you'll see that adding and removing\
    \ items doesn't suddenly happen; these items are smoothly animated."
  merge: -1
