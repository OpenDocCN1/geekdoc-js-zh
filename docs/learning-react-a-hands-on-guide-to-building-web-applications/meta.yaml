    }\n.buttons:nth-child(1) {\n  background-color: #F45B69;\n}\n.buttons:nth-child(3)\
    \ {\n  background-color: #C0DFA1;\n}\n```\n\nAt this point, we're done with our\
    \ example. If you haven't done so yet, save your changes across all the files\
    \ you've been working on. If you preview your app in the browser (using npm start),\
    \ you will see your counter working as expected.\n\n# Conclusion\n\nIn many ways,\
    \ Redux is designed to fix some of the shortcomings React often claims as advantages.\
    \ We looked at some of these advantages when we examined how data in React is\
    \ supposed to flow. You could go further and say that the ideas behind Redux become\
    \ formalized as part of React so that you get even better integration. But Redux\
    \ isn't perfect, either. As many things in programming, Redux is simply one of\
    \ many tools you have for accomplishing a task. Not every situation involves requiring\
    \ data for Redux; in fact, adding Redux sometimes creates unnecessary complexity\
    \ when you're trying to do. Dan Abramov, one of the creators of Redux, wrote a\
    \ great article (https://medium.com/@dan_abramov-you-might-need-redux-be46360cf367)\
    \ describing some situations where you probably shouldn't use Redux to solve your\
    \ problem. I highly encourage you to read that to get the full picture.\n\n> Note:\
    \ If you run into any issues, ask!\nIf you have any questions or your code isn't\
    \ running like you expect, don't hesitate to ask them!\nPost on the forums at\
    \ https://forum.kiripa.com and get help from some of the friendliest and most\
    \ knowledgeable people the Internet has ever brought together!"
