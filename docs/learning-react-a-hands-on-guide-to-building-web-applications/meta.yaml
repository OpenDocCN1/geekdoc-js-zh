  md: "# Listening to Regular DOM Events\n\nIf you thought the previous section was\
    \ a doozy, wait until you see what we have here. Not all DOM events are SyntheticEvent\
    \ equivalents. It might seem like you can just add the on prefix and capitalize\
    \ the event you're listening for when specifying it inline in your JSX:\n\n```\n\
    class Something extends React.Component {\n.\n  handleMouseEvent(e) {\n    //\
    \ do something\n  }\n\n  render() {\n    return (\n      <div onSubmit={this.handleMouseEvent}>Hello!</div>\n\
    \    );\n  }\n}\n```\n\nIt doesn't work that way! For events React doesn't officially\
    \ recognize, you have to follow the traditional approach that uses之一 with a few\
    \ extra hoops to jump through.\n\nTake a look at the following section of code:\n\
    \n```\nclass Something extends React.Component {\n\n  handleMouseEvent(e) {\n\
    \    // do something\n  }\n\n  componentDidMount() {\n    window.addEventListener(\"\
    someEvent\", this.handleMouseEvent);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"\
    someEvent\", this.handleMouseEvent);\n  }\n\n  render() {\n    return (\n    \
    \  <div>Hello!</div>\n    );\n  }\n}\n```"
