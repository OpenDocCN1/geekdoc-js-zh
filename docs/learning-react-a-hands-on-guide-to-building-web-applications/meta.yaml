  md: '# Accessing DOM Elements in React


    Sometimes you want to access properties and methods on an HTML element directly.
    In our React-colored world, where JSX represents everything that is good and pure
    about markup, why would you ever want to deal directly with the horribleness that
    is HTML? As you will find out (if you haven''t already), in many cases, dealing
    with HTML elements through the JavaScript DOM API directly is easier than fiddling
    with “the React way” of doing things. To highlight such situation, take a look
    at the Colorizer example in Figure 12.1.


    ![](bbox=[0.301, 0.558, 0.698, 0.933])


    Figure 12.1 Colorizer example.'
