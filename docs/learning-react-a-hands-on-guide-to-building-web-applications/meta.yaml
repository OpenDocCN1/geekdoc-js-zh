  md: "# 7\n\n# Meet JSX...Again!\n\nAs you've probably noticed by now, we've been\
    \ using a lot of JSX. But we really haven't taken a good look at what JSX actually\
    \ is. How does it work? Why don't we just call it HTML? What quirks does it have\
    \ up its sleeve? In this chapter, we answer all questions and more! We do some\
    \ serious backtracking (and some forwardtracking) to see what we need to know\
    \ about JSX in order to be dangerous.\n\n# What Happens with JSX\n\nOne of the\
    \ biggest things we've glossed over is trying to figure out what happens with\
    \ our JSX after we've written it. How does it end up as the HTML that you see\
    \ in the browser? Take a look at the following example, where we define a component\
    \ called Card:\n\n```\nclass Card extends React.Component {\n  render() {\n  \
    \  var cardStyle = {\n      height: 200,\n      width: 150,\n      padding: 0,\n\
    \      backgroundColor: \"#FFF\",\n      boxShadow: \"0px 5px #666\"\n    };\n\
    \n    return (\n      <div style={cardStyle}>\n        <Square color={this.props.color}\
    \ />\n        <Label color={this.props.color} />\n      </div>\n    );\n  }\n\
    }\n```"
  merge: -1
  pgno: 93
- img_proc: false
  md: "# 80 Chapter 7 Meet JSX...Again!\n\nWe can quickly spot the JSX here. It's\
    \ the following four lines:\n\n```\n<div style={cardStyle}>\n  <Square color={this.props.color}\
    \ />\n  <Label color={this.props.color} />\n</div>\n```\n\nKeep in mind that browsers\
    \ have no idea what to do with JSX. They probably think you're crazy if you try\
    \ to describe JSX to them. That's why we've been relying on things like Babel\
    \ to turn JSX into something the browsers understand: JavaScript.\n\nThis means\
    \ the JSX we write is for human (and well-trained cat) eyes. When this JSX reaches\
    \ our browser, it ends getting turned into pure JavaScript:\n\n```\nreturn React.createElement(\n\
    \  \"div\",\n  style: cardStyle,\n  React.createElement(Square, { color: this.props.color\
    \ }),\n  React.createElement(Label, { color: this.props.color })\n);\n```\n\n\
    All of those nested HTML-like elements, their attributes, and their children get\
    \ turned into a series of createElement calls with default initialization values.\
    \ Here's what our entire React component looks like it gets turned into JavaScript:\n\
    \n```\nclass Card extends React.Component {\n  render() {\n    var cardStyle =\
    \ {\n      height: 200,\n      width: 150,\n      padding: 0,\n      backgroundColor:\
    \ \"#FFF\",\n      boxShadow: \"0px 0px 5px #666\"\n    };\n\n    return React.createElement(\n\
    \      \"div\",\n      style: cardStyle,\n      React.createElement(Square, {\
    \ color: this.props.color }),\n      React.createElement(Label, { color: this.props.color\
    \ })\n    );\n  }\n}\n```\n\nNotice that there's no trace of JSX anywhere! All\
    \ these changes between what we wrote and our browser sees are part of the transpiling\
    \ we talked about in Chapter 1, \"Introducing React.\" That transpilation happens\
    \ entirely behind the scenes, thanks to Babel,"
  merge: -1
