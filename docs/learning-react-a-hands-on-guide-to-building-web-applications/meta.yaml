  md: "Yes, that's right! Our color palette card is done and visible, thanks to the\
    \ efforts of the Card, Square, and Label components. That doesn't mean we're done\
    \ yet, though. We have a few more things to cover.\n\n# Passing Properties, Again!\n\
    \nIn our example, we hard-coded the color value used by our Square and Label components.\
