  md: "# It's React Time! 167\n\nTo get information about the user, here's our HTTP\
    \ request:\n\n```\nGET /user\nAccept: application/json\n```\n\nFor that request,\
    \ here's what the server might return:\n\n```\n200 OK\nContent-Type: application/json\n\
    ```\n\n```\n{\n  \"name\": \"Kirupa\",\n  \"url\": \"http://www.kirupa.com\"\n\
    }\n```\n\nThis back-and-forth happens a bunch of times, and it's all supported\
    \ in JavaScript. This ability to asynchronously fetch and process data from a\
    \ server without requiring a navigation/reload has made us fetch Ajax (or AJAX,\
    \ if you want to). This acronym stands for Asynchronous JavaScript and XML. If\
    \ you were web developers a few years ago, Ajax was the buzzword everybody around\
    \ to describe the kind of web apps we take for granted (Twitter, Facebook, Google\
    \ Maps, Gmail, and more) that constantly fetch data as you interact with the page,\
    \ without requiring a full page reload.\n\nIn JavaScript, the object that is responsible\
    \ for allowing you to send and receive HTTP requests is the wildly named XMLHttpRequest.\
    \ This object allows you to do several things that are important to making web\
    \ requests:\n\n+   1. Send a request to a server\n2. Check on the status of the\
    \ request\n3. Retrieve and parse the response from the request\n4. Listen for\
    \ the readystatechange that helps you fetch the status of your request\n\nXMLHttpRequest\
    \ does a few more things, but those aren't important to deal with right.\n\n#\
    \ Why Not Use Third-Party Libraries?\n\nA bunch of third-party libraries wrap\
    \ and simplify how you can work with the XMLHttpRequest object. Feel free to use\
    \ them if you want, but using the XMLHttpRequest object directly isn't very complicated,\
    \ either. It's only a few lines of code, and (compared to everything you've been\
    \ learning in React) they're some of the easiest lines of code you'll encounter.\n\
    \n# It's React Time!\n\nNow that you have a good understanding of how HTTP requests\
    \ and the XMLHttpRequest object work, it's time to shift our focus to the React\
    \ side. I should warn you, that React brings very little to the table when it\
    \ comes to working with external data. React is primarily"
