  md: "We're ready to go one level deeper in our app and deal with our App component.\
    \ Inside the src folder, create a new file called App.js. Inside, add the following:\n\
    \n```\nimport { connect } from \"react-redux\";\nimport Counter from \"./Counter\"\
    ;\n```\n\n```\n// Map Redux state to component props\nfunction mapStateToProps(state)\
    \ {\n  return {\n    countValue: state.count;\n  };\n}\n```\n\n```\n// Action\n\
    var increaseAction = { type: \"*increase\" };\nvar decreaseAction = { type: \"\
    *decrease\" };\n```\n\n```\n// Map Redux actions to component props\nfunction\
    \ mapDispatchToProps(dispatch) {\n  return {\n    increaseCount: function() {\n\
    \      return dispatch(increaseAction);\n    },\n    decreaseCount: function()\
    \ {\n      return dispatch(decreaseAction);\n    }\n  };\n}\n```\n\n```\n// The\
    \ HOC\nvar connectedComponent = connect(\n  mapStateToProps,\n  mapDispatchToProps\n\
    )(Counter);\n```\n\n```\nexport default connectedComponent;\n```\n\nTake a few\
    \ moments to see what's going on here. The main purpose of the code here is to\
    \ turn all the Redux-hooks into something we can use in React. More specifically,\
    \ we provide all hooks as props that our component can easily consume through\
    \ two functions, called mapStateToProps and mapDispatchToProps.\n\nFirst up is\
    \ our mapStateToProps function:\n\n```\n// Map Redux state to component props\n\
    function mapStateToProps(state) {\n  return {\n    countValue: state.count;\n\
    \  };\n}\n```"
  merge: -1
  pgno: 277
- img_proc: false
  md: "# Chapter 20 Using Redux with React\n\nThis function subscribes to all Store\
    \ updates and gets called when anything in our Store changes. It returns an object\
    \ that contains the Store data you want to transmit as props to a component. In\
    \ our case, what we're transmitting is pretty simple: an object that contains\
    \ a property called countValue whose is represented by our old count property\
    \ from the Store.\n\nProviding the Store as props is only one of what we need\
    \ to do. The next part is to give our component access to the action creators\
    \ and also, in the form of props. The following code handles this:\n\n```\n//\
    \ Action\nvar increaseAction = { type: \"increase\" };\nvar decreaseAction = {\
    \ type: \"decrease\" };\n\n// Map Redux actions to component props\nfunction mapDispatchToProps(dispatch)\
    \ {\n  return {\n    increaseCount: function() {\n      return dispatch(increaseAction);\n\
    \    },\n    decreaseCount: function() {\n      return dispatch(decreaseAction);\n\
    \    }\n  };\n}\n```\n\nThe really interesting stuff happens with mapDispatchToProps.\
    \ We return an object containing the name of the two functions our component can\
    \ call to dispatch a change to our Store. The increaseCount function fires a dispatch\
    \ with an action type of increase. The decreaseCount function fires a dispatch\
    \ with an action type of decrease. If you look at the reducer we added a few moments\
    \ ago, we can see how these function calls will affect the value of count we are\
    \ storing in our Store.\n\nAll that remains is to ensure that whatever component\
    \ we want to provide all these props has some way of receiving them. That is where\
    \ the magical connect comes in:\n\n```\nvar connectedComponent = connect (\n \
    \ mapStateToProps,\n  mapDispatchToProps\n)(Counter);\n```\n\nThis function creates\
    \ the magical Connect HOC we talked about earlier. It takes our mapStateToProps\
    \ and mapDispatchToProps functions as arguments, and it passes all of that into\
    \ the Counter component, which you also specify. The end result of all this code\
    \ running is the equivalent of rendering the:\n\n```\n<Connect>\n<Counter increaseCount={increaseCount}\n\
    \      decreaseCount={decreaseCount}\n      countValue={countValue} />\n</Connect>\n\
    ```"
