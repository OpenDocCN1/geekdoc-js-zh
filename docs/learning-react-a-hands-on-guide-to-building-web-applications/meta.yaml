  md: '# Conclusion


    As created by the ES6/ES2015 committee, the spread operator is designed to work
    only on arrays and arraylike structures (a.k.a. something that has a Symbol.iterator
    property). The fact that it works on object literals like the props object is
    a result of React extending the standard. No browser currently supports using
    the spread object on object literals. Our example works because Babel. Besides
    turning all our JSX into something our browser understands, Babel turns cutting-edge
    and experimental features into something that''s friendly across browsers. That''s
    why we''re able to get away with using the spread operator on an object literal,
    and that''s why we''re able to elegantly solve the problem of transferring properties
    across multiple layers of components.


    Now, does any of this matter? Is it critical that you know about the nuances of
    the spread operator and how it works in certain situations and doesn''t work in
    others? For the most part, no. The important part to realize is that you can use
    the spread operator to transfer props from one component to another. The other
    important part to realize is that we will look at other ways in the future to
    make transferring properties equally simple, without running into performance
    issues.


    > Note: If you run into any issues, ask!

    If you have any questions or your code isn''t running like you expect, don''t
    hesitate to ask!

    Post on the forums at https://forum.kirupa.com and get help from some of the friendliest
    and most knowledgeable people the Internet has ever brought together!'
