    \ 0;\n}\nul.header {\n  background-color: #111;\n  padding: 0;\n}\nul.header li\
    \ a {\n  color: #FFF;\n  font-weight: bold;\n  text-decoration: none;\n  padding:\
    \ 20px;\n  display: inline-block;\n}\n.content {\n  background-color: #FFF;\n\
    \  padding: 20px;\n}\n.content h2 {\n  padding: 0;\n  margin: 0;\n}\n.content\
    \ li {\n  margin-bottom: 10px;\n}\n```\n\nNow, we need to reference this stylesheet\
