  md: "Getting back to our code, we have created a new component called HelloWorld.\
    \ This is a component because it extends React.Component. If it didn't that, it\
    \ would be an empty class that doesn't do much. Inside our class, you can put\
    \ all sorts of methods to define what HelloWorld does. Some methods that you define\
    \ are special, and React uses them to help your components work. One such magic\
    \ property is render.\n\nGo ahead and modify our HelloWorld component by adding\
    \ the render method, as shown:\n\n```\nclass HelloWorld extends React.Component\
    \ {\n  render() {\n}\n}\n```\n\nJust like the render method you saw a few moments\
    \ earlier as of ReactDOM.render, the render function inside a component is also\
    \ responsible for dealing with JSX. Let's modify our render function to return\
    \ Hello, componentized world! Add the following highlighted line:\n\n```\nclass\
    \ HelloWorld extends React.Component {\n  render() {\n    return <p>Hello, componentized\
    \ world!</p>\n  }\n}\n```\n\nYou've told the render function to return the JSX\
    \ that represents the Hello, componentized world! text. All that remains is to\
    \ actually use this component after you've defined it by calling it. Here we call\
    \ from our old friend, the ReactDOM.render method.\n\nThe way you call a component\
    \ from it is a bit unique. Go ahead and replace the first argument of ReactDOM.render\
    \ with the following:\n\n```\nReactDOM.render(\n  <HelloWorld/>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nThat's not a typo! The JSX we use for calling our HelloWorld\
    \ component is the very HTML-like <HelloWorld/>. If you preview your page in your\
    \ browser, you'll see the text Hello, componentized world! showing up on your\
    \ screen. If you were holding your breath in suspense, you can relax.\n\nIf you\
    \ have difficulty relaxing after seeing the syntax we use for calling HelloWorld,\
    \ stare at the circle in Figure 3.4 a few moments."
