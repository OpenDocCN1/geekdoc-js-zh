  md: '# What Is Redux?


    To solve this more general problem of maintaining application state, you have
    Redux. The easiest way to understand how Redux works is just to walk through the
    various pieces that go into it. The first thing we need is an app:


    ![](bbox=[0.279, 0.187, 0.72, 0.513])


    This app doesn''t have to be anything special. It can be built in React, Angular,
    Vue, vanilla JS, or whatever happens to be the hot new library or framework this
    week. Redux doesn''t care how your app is built. It only cares that your app has
    a magical way for dealing with application state and storing it. In the Redux
    world, we store all our application state in a single location that we''ll call
    the Store:'
  merge: -1
  pgno: 253
- img_proc: false
  md: '![](bbox=[0.318, 0.114, 0.663, 0.532])


    The thing about the Store is that reading data from it is easy. Getting information
    into it is a whole another story. You add a new state to (or modify existing state
    in) the Store by using a combination of **actions**, which describe what to change,
    and a **reducer**, which determines what the final state will be as a result for
    a given action. When you throw both of these into the picture, this is what you
    see:'
