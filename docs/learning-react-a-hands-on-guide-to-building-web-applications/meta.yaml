    # Displaying Your Name


    Now you''re going to use React to display your name onscreen. You do that by using
    a method called render. Inside your empty script tag in the body, add after the
    following:


    ```

    ReactDOM.render(

    <h1>Sherlock Holmes</h1>

    document.body

    );

    ```


    Don''t worry if none of these makes sense at this point. Our goal is to get something
    to display onscreen first, and we''ll make sense of what we did afterwards. Now,
    before previewing this in the page to see what happens, you need to designate
    this script block as something that Babel can work its magic. You do that by setting
    the type attribute on the script tag to a value of text:babel:


    ```

    <script type="text/babel">

    ReactDOM.render(

    <h1>Sherlock Holmes</h1>

    document.body

    );

    </script>

    ```'
