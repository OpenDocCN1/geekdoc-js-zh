  md: "It's the Little Things 235\n\n![](bbox=[0.272, 0.116, 0.751, 0.463])\n\nWe're\
    \ almost done here! We just need to do a few more things.\n\n# # Highlighting\
    \ the Active Link\n\nRight now, it's hard to tell which link corresponds to content\
    \ that is currently loaded. Having some sort of a visual cue could be useful.\
    \ The creators of React Router have already thought of it. When you click a link,\
    \ a class value of active is automatically assigned to it.\n\nFor example, this\
    \ is what the HTML for clicking the Stuff link looks like:\n\n```\n<a aria-current=\"\
    true\" href=\"#stuff\" class=\"active\">Stuff</a>\n```\n\nAll we have to do, then,\
    \ is add the appropriate CSS that lights up when an element has a class value\
    \ of active. To make this, go back to index.css and add the following style rule\
    \ to the bottom of your document:\n\n```\n.active {\n  background-color: #0099FF;\n\
    }\n```\n\nAfter you have this rule saved and your document, go back to your browser\
    \ and click around on the links. You'll see that the active link content is highlighted\
    \ with blue. Notice also that our Home link is always highlighted. That's not\
    \ correct. The fix is: just add the exact prop to the NavLink component representing\
    \ your Home content:\n\n+   - <NavLink exact=\"/\">Home</NavLink>\n- <NavLink\
    \ to=\"/stuff\">Stuff</NavLink>\n- <NavLink to=\"/contact\">Contact</NavLink>"
