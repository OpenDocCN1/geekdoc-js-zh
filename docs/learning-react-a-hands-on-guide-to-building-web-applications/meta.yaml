  md: "# Meet the React Component\n\nto be on top of. What we call arguments in the\
    \ function world are known as properties in the component world. Let's see these\
    \ properties in action!\n\nYou're going to modify the HelloWorld component to\
    \ allow you to specify who or what you get besides the generic World. For example,\
    \ being able to specify Bono as part of the HelloWorld call and seeing Hello,\
    \ Bono! appear onscreen.\n\nTo add properties to a component, you need to follow\
    \ two paths of instructions.\n\n# First Part: Updating the Component Definition\n\
    \nRight now, our HelloWorld component is hard-coded to always send out Hello,\
    \ world! as part of its return value. We first need to change that behavior by\
    \ having the return statement print out the value passed in property. We need\
    \ to give our property; for this example, we call our property greetTarget.\n\n\
    To specify the value of greetTarget as part of our component, we need to make\
    \ this modification:\n\n```\nclass HelloWorld extends React.Component {\n  render()\
    \ {\n    return <p>Hello, {this.props.greetTarget}!</p>\n  }\n}\n```\n\nYou access\
    \ a property by referencing it via this.props that every component has access.\
    \ Notice how you specify this property? You place it curly brackets, { }. In JSX,\
    \ if you want something to get evaluated as an expression, you need to wrap that\
    \ inside curly brackets. If you don't do that, you will see the text this.props.greetTarget\
    \ printed out.\n\n# Second Part: Modifying the Component Call\n\nAfter you've\
    \ updated the component definition, all that remains to pass in the property value\
    \ as part of the component call. This is done by adding an attribute with the\
    \ same name as the property, followed by the value you want to pass in. In our\
    \ example, that modifies the HelloWorld call with the greetTarget attribute and\
    \ the value you want to give it.\n\nGo ahead and modify the HelloWorld calls as\
    \ follows:\n\n```\nReactDOM.render(\n<div>\n  <HelloWorld greetTarget=\"Batman\"\
    />\n  <HelloWorld greetTarget=\"Iron Man\"/>\n  <HelloWorld greetTarget=\"Nicolas\
    \ Cage\"/>\n  <HelloWorld greetTarget=\"Mega Man\"/>\n  <HelloWorld greetTarget=\"\
    Bono\"/>\n  <HelloWorld greetTarget=\"Catwoman\"/>\n</div>\nndocument.querySelector(\"\
    #container\");\n```"
  merge: -1
  pgno: 47
