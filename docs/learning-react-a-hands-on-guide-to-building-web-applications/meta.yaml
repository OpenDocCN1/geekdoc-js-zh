  md: 'You might see warnings and other stuff displayed, but look for the output of
    the console.log statements you added. When you first run your app, you''ll see
    all three of your components have their respective render method called. This
    is expected because it''s the first time your app is being loaded.


    With your console still open, go ahead and click the blue button to bring up the
    menu. Then take a look at your console. You''ll see the following new items (highlighted
    in green):


    Rendering: MenuContainer


    Rendering: MenuButton


    Rendering: Menu


    # clicked


    # Rendering: MenuContainer


    # Rendering: MenuButton


    # Rendering: Menu


    When the handleMouseDown event handler gets called, the text clicked to the console.
    isn''t important for what we''re doing right now, but it does provide a nice separation
    between our two `render` calls. With that said, notice that displaying our menu
    results in all three of our components'' render methods getting called. Click
    the menu to dismiss it. You''ll see all three render methods getting called. That
    doesn''t seem right, does it?


    Because we''re clicking a prop on Menu and our state is stored on MenuContainer,
    it makes sense for those two components'' render methods to be called...for now.
    But, why is the MenuButton component''s render method getting called every single
    time?


    Looking at MenuContainer''s render call, we are calling our component and passing
    in a prop whose value will never change:


    ```

    <MenuButton handleMouseDown={this.handleMouseDown}/>

    ```


    The value of our handleMouseDown method doesn''t change each time our menu is
    opened or closed. This is because our MenuContainer (a.k.a. the MenuButton''s
    parent) has its render method called. If a parent''s render method gets called,
    all the children'' render methods get called. If you''re keeping score, this is
    reason #3 we listed a few sections when talking about a render method to be called
    automatically.


    So options do we have for stopping our MenuButton component''s render method from
    being unnecessarily called? As it turns out, we have two:


    # Overriding a Component Update


    A while ago, we looked at the various methods React provides. One of them is shouldComponentUpdate.
    This method is called just before a render call is made, and you can block the
    render method from being called by having the shouldComponentUpdate method return
    false. Here we''re going to use the shouldComponentUpdate method to do that.'
