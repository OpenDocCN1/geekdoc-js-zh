    \ The items we click on are defined in TodoItems.js. The actual logic\npopulating\
    \ the items lives in our state object in TodoList.js. To give you a preview of\n\
    what to expect, we will be participating in some shenanigans as we pass things\
    \ both of\nthese components.\n\nFirst we need to set up the event handler for\
    \ deleting the click event. Change the return\nstatement under createTasks to\
    \ look as follows:\n\n```\ncreateTasks(item) {\n  return <li onClick={(item) =>\
    \ this.delete(item.key)}\n      key={item.key}>{item.text}</li>\n}\n```\n\nWe're\
    \ simply listening to the click event and associating it with an event handler\
    \ called\ndelete. What might be new approach for passing arguments to the event\
    \ handler.\nBecause of how event arguments and event handlers like scope, we work\
    \ around all these\nissues using an arrow function that allows us both to maintain\
    \ the default event argument\nand pass in our arguments. If this seems bizarre,\
    \ you can feel better knowing that this is a\nJavaScript quirk and has nothing\
    \ to do with React.\n\nAfter you've made this change, we need to define the delete\
    \ event handler. Make the follow-\ninglighted changes:\n\n```\nclass TodoItems\
    \ extends Component {\n  constructor(props) {\n    super(props);\n```\n\n```\n\
    this.createTasks = this.createTasks.bind(this);\n}\n\ndelete(key) {\n  this.props.delete(key);\n\
    }\n```\n\nHere we define a function called delete that takes our argument for\
    \ the item key. To ensure\nthat this resolves properly, we explicitly bind this\
    \ in the constructor. Notice that our delete\nfunction doesn't actually do any\
    \ deleting. It just calls another delete function passed into this\ncomponent\
    \ via props. We'll work backward from here and deal with that next."
