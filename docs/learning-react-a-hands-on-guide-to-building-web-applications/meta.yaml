  md: '# 10


    # Events in React


    So far, most of our examples did their work only upon page load. As you probably
    guessed, that isn''t normal. In most apps, especially the kind of UI-heavy ones
    you''ll be building, the app will do a ton of things only as a reaction to something.
    Those somethings could be triggered by a mouse click, a key press, a window resize,
    or a whole bunch of gestures and interactions. Events are the glue that makes
    all of this possible.


    Now, you probably know all about events from your experience using them in the
    DOM world. If you don''t, then I suggest giving a quick refresh first: https://www.kirupa.com/html5/javascript_events.htm
    The way React deals with events is a bit different, and these differences can
    surprise you if you aren''t paying close attention. Don''t worry, that''s why
    you have this book! We start off with a few simple examples and then gradually
    look at increasingly more bizarre, complex, and (yes!) boring things.


    # Listening and Reacting to Events


    The easiest way to learn about events in React is to actually use them, and that''s
    exactly what you''re going to do here. To help with this, we have a simple example
    made up of a counter that increments each time you click a button. Initially,
    our example will look like Figure 10.1.


