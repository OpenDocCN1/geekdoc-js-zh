    );\n}\n```\n\nPhew! All we wanted to have our Display component display some values\
    \ for color, num, and size. The only complication was that the values we wanted\
    \ to display were originally defined as part of ReactDOM.render. The annoying\
    \ solution is the one you see here, every component along the path to the destination\
    \ needing to access and redefine each property as part of passing it along. That's\
    \ terrible. We can do better than this, and you'll see how in a few moments\n\n\
    # The Spread Operator\n\nThe solution to all problems lies in something new to\
    \ JavaScript, known as the spread operator. What the spread operator does is bit\
    \ bizarre to explain without some context, let's give you an example and then\
    \ you with a definition.\n\nTake a look at the following snippet:\n\n```\nvar\
    \ items = [\"1\", \"2\", \"3\"];\n\nfunction printStuff(a, b, c) {\n  console.log(\"\
    Printing: \" + a + \" * \" + b + \" * \" + c);\n}\n```\n\nWe have an array items\
    \ that contains three values. We also have a function called printStuff that takes\
    \ three arguments. We want to pass the values from our array as arguments to the\
    \ printStuff function. Sounds simple enough, right?\n\nHere's one really way of\
    \ doing that:\n\n```\nprintStuff(items[0], items[1], items[2]);\n```\n\nWe access\
    \ each array individually and pass it in to our printStuff function. With the\
    \ spread operator, we now have an easier way. You don't have to specify each item\
    \ in the array individually; you can do something like this:\n\n```\nprintStuff(...items);\n\
    ```\n\nThe spread operator is ... characters before our items array. Using ...items\
    \ is identical to calling items[0], items[1], and items[2] individually, as we\
    \ did earlier. The printStuff function will run with 1, 2, and 3 to console. Pretty\
    \ cool, right?\n\nNow that you've seen the spread operator in action, it's time\
    \ to define it. The spread operator allows you to unwrap an array into its individual\
    \ elements. The spread operator does a few more things, but that's not important\
    \ for now. We're going to use only this particular side of the spread operator\
    \ to solve our property transfer problem."
