- img_proc: false
  md: "It seems problematic. We'll look at how to fix that and do many more little\
    \ housekeeping tasks in the next section when we go one level deeper into using\
    \ React Router.\n\n# It's the Little Things\n\nIn the previous section, we got\
    \ our SPA mostly up and running. We just wrapped our entire routing region inside\
    \ a HashRouter component, and we separated our links and the place links by using\
    \ NavLink and Route components, respectively. Getting our example mostly up and\
    \ running and fully up and running are two different things. In the following\
    \ sections, we'll close those differences.\n\n# Fixing Our Routing\n\nWe ended\
    \ the previous section by determining that our routing has a bug in it. The contents\
    \ of our Home component are always displaying because the path for loading our\
    \ Home component is /. Our Route and Contact components have the / character as\
    \ part of their paths as well. This means our Home always matches whatever path\
    \ we are trying to navigate. The fix is to simple: In the Route component representing\
    \ our Home content, add the exact prop as shown here:\n\n```\n<div className=\"\
    content\">\n<Route path=\"/*\" component={Home} />\n<Route path=\"stuff\" component={Stuff}\
    \ />\n<Route path=\"/contact\" component={Contact} />\n</div>\n```\n\nThis prop\
    \ ensures that the Route is only active if the path is an exact match for what\
    \ is being loaded. If you preview your app now, you'll see that the content loads\
    \ correctly, with the Home component displaying only when our is in the Home view.\n\
    \n# Adding Some CSS\n\nRight now, our app is completely unfinished. The fix for\
    \ that is easy. In your src folder, create a file named index.css and add the\
    \ following style rules into it:\n\n```\nbody {\n  background-color: #FFCC00;\n\
    \  padding: 20px;\n  margin: 0;\n}\nh1, h2, p, ul, li {\n  font-family: sans-serif;\n\
    }\n```"
  merge: -1
