  md: '# Chapter 10 Events in React


    Similarly, a SyntheticEvent that wraps a KeyboardEvent will have access to these
    additional keyboard-related properties:


    ```

    boolean altKey

    number charCode

    boolean ctrlKey

    boolean getModifierState(key)

    string key

    number keyCode

    string locale

    number location

    boolean metaKey

    boolean repeat

    boolean shiftKey

    number which

    ```


    In the end, and all of this means that you still get the same functionality in
    the SyntheticEvent that you had in the vanilla DOM world.


    Now, here''s something I learned the hard way: Don''t refer to traditional DOM
    documentation when using SyntheticEvents and their properties. Because the SyntheticEvent
    wraps your native DOM event, and their properties might not map one-to-one. Some
    events don''t even exist in React. To avoid running into any issues, if you want
    to know the name of a SyntheticEvent or any of its properties, refer to the React
    Event System document (https://facebook.github.io/react/docs/events.html) instead.


    # Doing Stuff with Event Properties


    By now, you''ve seen more about the DOM and SyntheticEvents than you''d probably
    like. To wash away the taste of all you''ve seen, let some code and put your newfound
    knowledge to good use. Right now, our counter examples increment our counter by
    1 when the Shift key on the keyboard is pressed while clicking the plus button
    with our mouse.


    We can do that by the shiftKey property that exists on the SyntheticEvent when
    using the mouse:


    ```

    boolean altKey

    number button

    number buttons

    number clientX

    number clientY

    boolean ctrlKey

    boolean getModifierState(key)

    boolean metaKey

    number pageX

    number pageY

    ```'
