  md: '# Working with External Data in React


    Dealing with external data is pretty much standard in web apps today. This “dealing”
    typically looks as follows:


    +   1. Your app makes a request for some data to a remote service.

    2. The remote service receives the request and sends back some data.

    3. Your app receives the data.

    4. Your app formats and displays the data to the user.


    Whether or not you realize it, almost all your favorite websites follow these
    four steps...Facebook, Amazon, Twitter, Instagram, Gmail, KIRUPA, and so on. When
    you starting loading a page on any of these sites, they all display data initially.'
  merge: -1
  pgno: 177
