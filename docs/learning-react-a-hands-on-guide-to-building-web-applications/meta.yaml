  md: "As you can see, we have an empty HTML document with only the basic structure\
    \ defined. We're referencing a hosted version of the Redux library, which is fine\
    \ for kicking the tires like're doing. For production apps, like the ones you\
    \ saw with React, you have better approaches to use. We'll look at those better\
    \ approaches later, but referencing the library directly is okay for now.\n\n\
    # Lights! Camera! Action!\n\nWith our Redux library referenced, we need to define\
    \ our actions. Remember, the action is the only mechanism we have to communicate\
    \ with our Store. For our app, because we want to add and remove colors, our actions\
    \ will represent that in a way the Store will understand.\n\nInside your script\
    \ tag, add the following lines:\n\n```\nfunction addColor(value) {\n  return {\n\
    \    type: \"ADD\",\n    color: value\n  };\n}\n```\n\n```\nfunction removeColor(value)\
    \ {\n  return {\n    type: \"REMOVE\",\n    color: value\n  };\n}\n```\n\nWe have\
    \ two functions, addColor and removeColor. They each take one argument and return\
    \ an action object as a result. For addColor, the action object is highlighted\
    \ in the lines:\n\n```\nfunction addColor(value) {\n  return {\n    type: \"ADD\"\
    ,\n    color: value\n  };\n}\n```\n\nWhen defining an action, you have a lot of\
    \ freedom. Every action object has a type property. This is a keyword that signals\
    \ what you're intending to do. Beyond that, any other information you send along\
    \ your action is entirely up to you. Because we're interested in adding or removing\
    \ a color value from our Store, our action object also has a color property that\
    \ stores the color we're interested in.\n\nLet's get back to our addColor and\
    \ removeColor functions. Both really serve just one purpose: to return an action.\
    \ There's a more formal name for these functions in the Redux world. They're known\
    \ as action creators because they, um, create an action."
  merge: -1
  pgno: 258
- img_proc: false
  md: ''
  merge: -1
