  md: '# Chapter 20 Using Redux with React


    Our reducer is pretty simple. We have a count variable that we initialize to 0
    if our state is empty. This reducer will deal with two action types: increase
    and decrease. If the action type is increase, we we up our count value by 1. If
    our action type is decrease, we decrease our count value by 1 instead.


    At this point, we''re halfway done building our example (Figure 20.4):


    ![](bbox=[0.177, 0.235, 0.822, 0.881])


    Figure 20.4  We are almost there with getting our app working!'
