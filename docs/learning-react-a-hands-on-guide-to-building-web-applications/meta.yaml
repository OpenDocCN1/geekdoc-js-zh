    \ As the last chapter, this page is pretty barebones, with just a reference to\
    \ the React and Babel libraries and a div element that proudly sports an id value\
    \ of container.\n\n# Creating a Hello, World! Component\n\nLet's start simply.\
    \ We want to use a component to help us print the famous \"Hello, world!\" text\
    \ to the screen. As we already know, just using the render method of ReactDOM\
    \ would give us that code as follows:\n\n```\nReactDOM.render(\n<div>\n  <p>Hello,\
