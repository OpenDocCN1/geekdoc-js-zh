    We aren''t just adding the entered text. We''re actually adding an object that
    contains both the entered text and a unique key value that''s set by the current
    time (Date.now()). If you aren''t clear on why we''re specifying the key, that''s
    okay. You''ll totally see it in a few moments.


    The rest of our code is pretty boring. We''re setting our state''s items property
    to the value of itemArray. We''re clearing the value of our input element to make
    room for the next todo item. This line here less boring:


    ```

    e.preventDefault();

    ```


    We''re overiding this event''s default behavior. The reason has to do with how
    form submission works. By default, when you submit a form, the page reloads and
    clears everything out. We definitely don''t want that. By calling preventDefault,
    we block the default behavior. That''s a good thing!


    It''s time to take stock of where we are now. If you preview your app and check
    the browser console, you''ll see our state object correctly populating with each
    new todo item added (see Figure 15.4).'
