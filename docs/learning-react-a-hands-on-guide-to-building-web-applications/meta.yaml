  md: "# Chapter 17 Avoiding Unnecessary Renders in React\n\nonly prop we are passing\
    \ in for the value of handleMouseDown. We can ensure that this value doesn't change\
    \ by modifying the shouldComponentUpdate method, as follows:\n\n```\nshouldComponentUpdate(nextProps,\
    \ nextState) {\n  if (nextProps.handleMouseDown === this.props.handleMouseDown)\
    \ {\n    return false;\n  } else {\n    return true;\n  }\n}\n```\n\nThis code\
    \ ensures that we don't unnecessarily call render if the value of handleMouseDown\
    \ stays the same. If the value of handleMouseDown changed, we could properly return\
    \ a value of true to allow the render call to be made. You can use other criteria\
    \ to specify whether the component's render method should be called, and what\
    \ you depend entirely on the component in question. Feel free to get creative,\
    \ if you need to.\n\n# PureComponent\n\nIt's a common occurrence to have components\
    \ forced to re-render despite not having relevant prop or state changes. Our MyButton\
    \ example is just one such occurrence. The solution is to call shouldComponentUpdate\
    \ and check whether any prop or state changes have taken place. To avoid having\
    \ to make this check all the time, a special kind of component can handle this\
    \ checking automatically for you. That is PureComponent.\n\nNow, until all of\
    \ our components have been based on Component:\n\n```\nclass Blank extends Component\
    \ {\n  render() {\n    return (\n      <h1>Hello!</h1>\n    );\n  }\n}\n```\n\n\
    To base our components off PureComponent, all you have to do is this:\n\n```\n\
    class Blank extends PureComponent {\n  render() {\n    return (\n      <h1>Hello!</h1>\n\
    \    );\n  }\n}\n```\n\nThat's pretty much it. Your component will now be extra\
    \ careful about calling render only when it determines that a change to the prop\
    \ or state has actually been made. To see this for yourself, you can change MyButton\
    \ to be a PureComponent instead of just a Component."
  merge: -1
  pgno: 234
- img_proc: false
  md: "# Seeing the reader Calls\n\nIn MenuButton.js, first detect the shouldComponentUpdate\
    \ method; you don't need it anymore. Now, make the following two highlighted changes:\n\
    \n```\nimport React, { PureComponent } from \"react\";\nimport \n```\n\nWe import\
    \ the necessary code from the React library to make PureComponent work. Next,\
    \ we extend our MenuButton from PureComponent. If you test your app now and inspect\
    \ the console after displaying the menu, you'll see that MenuButton component's\
    \ render method doesn't get called when your menu decides to show up (or disappear).\n\
    \n# Why Not Always Use PureComponent?\n\nThe PureComponent seems pretty awesome,\
    \ right? Why don't we just use it and ditch Component altogether? We probably\
    \ should! With that said, there are a few reasons you might want to stick with\
    \ Component.\n\nPureComponent performs what's known as a shallow comparison. It't\
    \ no comprehensive check of everything that might have changed in your props or\
    \ state before re-render. For many cases, that's okay. For others cases, that\
    \ might not be. Keep in mind when using PureComponent that you might find you\
    \ need to write your own shouldComponentUpdate and handle the updating logic manually.\
    \ You can use PureComponent and specify shouldComponentUpdate at the same time,\
    \ although that makes a nice try!\n\nBeyond the comparison logic, the benefit\
    \ with using PureComponent is performance. Having each of your components check\
    \ to see if props or state have changed, if it's a shallow check, takes up computation\
    \ time. Remember, these checks happen every time your component decides to re-render\
    \ or is asked to re-render by a parent. For complex UI, that could happen frequently\
    \ without you realizing it.\n\nTL;DR: This should probably have been mentioned\
    \ at the top of this note, but what are you going to do? Basically, it's fine\
    \ to use PureComponent instead of Component. Just be aware of the two (minor)\
    \ side effects."
  merge: -1
  pgno: 235
