  md: "# Making the Background Color Customizable\n\nThe last thing to do before we\
    \ wrap up is take advantage of how React works with styles. By having our styles\
    \ defined in the same vicinity as the JSX, we can make the various styles easily\
    \ customizable by the parent (a.k.a. the consumer of the component). Let's see\
    \ this in action.\n\nRight now, if all our vowels have a yellow background. Wouldn't\
    \ it be cool if we could specify the background color as part of each Letter declaration?\
    \ To do this in our ReactDOM.render method, first add a bgcolor attribute and\
    \ specify some colors, as shown in the following lines:\n\n```\nReactDOM.render(\n\
    \  <div>\n    <Letter bgcolor=\"#58B3FF\">A</Letter>\n    <Letter bgcolor=\"#FF605FF\"\
    >E</Letter>\n    <Letter bgcolor=\"#FFD52E\">I</Letter>\n    <Letter bgcolor=\"\
    #49DD8E\">O</Letter>\n    <Letter bgcolor=\"#AE399FF\">U</Letter>\n  </div>\n\
    \  destination\n);\n```\n\nNext, we need to use this property. In the letterStyle\
    \ object, set the value of backgroundColor to this.props.bgColor:\n\n```\nvar\
    \ letterStyle = {\n  padding: 10,\n  backgroundColor: this.props.bgColor,\n  color:\
    \ \"#333\",\n  display: \"inline-block\",\n  fontFamily: \"monospace\",\n  fontSize:\
    \ 32,\n  textAlign: \"center\"\n};\n```\n\nThis ensures that the backgroundColor\
    \ value is inferred from what you set via the bgColor attribute as part of the\
    \ Letter declaration. If you preview this in your browser, you will now see the\
    \ vowels sporting some totally sweet background colors (see Figure 4.5)."
