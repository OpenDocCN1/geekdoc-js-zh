  md: "26 Chapter 3 Components in React\n\nIn a nutshell, functions are awesome. I\
    \ know that. You know that. That's why all of the code we write has them all over\
    \ the the place.\n\n# Changing How We Deal with UI\n\nI don't think anybody will\
    \ disagree with the good functions bring to the table. They really make it possible\
    \ to structure the code for your apps in a sane way. That level of care we use\
    \ in writing our code isn't always possible when it comes to writing UIs. For\
    \ various technical and nontechnical reasons, we've always tolerated a certain\
    \ level of sloppiness in how we typically work with our UI elements.\n\nThat's\
    \ a pretty controversial statement, so me highlight what I mean by looking at\
    \ some examples. Let's go back and look at the render method we used in the previous\
    \ chapter:\n\n```\nvar destination = document.querySelector(\"#container\");\n\
    ```\n\n```\nReactDOM.render(\n  <h1>Batman</h1>\n  destination\n);\n```\n\nOnscreen,\
    \ you see the word Batman printed in giant letters, thanks to the h1 element.\
    \ Let's change things up bit. Say we want to print the name of several other superheroes.\
    \ To do this, we modify our render method to look as follows:\n\n```\nvar destination\
    \ = document.querySelector(\"#container\");\n```\n\n```\nReactDOM.render(\n  <div>\n\
    \  <h1>Batman</h1>\n  <h1>Iron Man</h1>\n  <h1>Nicolas Cage</h1>\n  <h1>Mega Man</h1>\n\
    \  </div>\n  destination\n);\n```\n\nNotice what you see here. We emit a div that\
    \ contains the four h1 elements with our superhero names.\n\nOkay, now we have\
    \ four h1 elements that contains the name of a superhero. If we want to change\
    \ our h1 element to something like an h3 instead? We can manually update all of\
    \ these elements as follows:\n\n```\nvar destination = document.querySelector(\"\
    #container\");\n```\n\n```\nReactDOM.render(\n  <div>\n  <h3>Batman</h3>\n  <h3>Iron\
    \ Man</h3>\",\n```"
