  md: '# Managing React State with Redux


    The way Redux plugs into your React app is as straightforward as calling a few
    Redux APIs from your React code. Just two steps are involved:


    +   1. Give your app a reference to the Redux store.

    2. Map the action creators, dispatch functions, and state as props to whatever
    component needs data from the Store.


    To see what''s involved in bringing these two steps to life, we''re going to build
    a simple Counter app that looks as in Figure 20.1:


    ![](bbox=[0.221, 0.347, 0.743, 0.725])


    Our app will have a plus button and a minus button to increase or decrease a counter
    value. That''s it. Nothing else is going on here; this is just the right level
    of functionality and complexity to help you get your feet wet with combining React
    and Redux.'
