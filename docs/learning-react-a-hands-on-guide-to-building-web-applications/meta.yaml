  md: '# Meet Synthetic Events


    In React, when you specify an event in JSX as we did with onClick, you''re not
    directly dealing with regular DOM events. Instead, you''re dealing with a React-specific
    event type known as a SyntheticEvent. Your event handlers do not get native arguments
    of type MouseEvent, KeyboardEvent, and so on. They always get event arguments
    of type SyntheticEvent that wrap your browser''s native event instead. What''s
    the fault of this in our code? Surprisingly not a whole lot.


    Each SyntheticEvent contains the following properties:


    +   boolean bubbles

    boolean cancelable

    DOMEventTarget target

    boolean defaultPrevented

    number eventPhase

    boolean isTrusted

    DOMEvent nativeEvent

    void preventDefault()

    boolean isDefaulted()

    void stopPropagation()

    boolean isPropagationStopped()

    DOMEventTarget target

    number timestamp

    string type


    These properties should seem pretty straightforward...and generic! The nong stuff
    depends on what type of native event our SyntheticEvent is wrapping. This means
    that a SyntheticEvent that wraps a MouseEvent will have access to mouse-specific
    properties such as the following:


    +   boolean altKey

    number button

    number buttons

    number clientX

    number clientY

    boolean ctrlKey

    boolean getModifierState(key)

    boolean metaKey

    number pageX

    number pageY

    DOMEventTarget relatedTarget

    number screenX

    number screenY

    boolean shiftKey'
  merge: -1
