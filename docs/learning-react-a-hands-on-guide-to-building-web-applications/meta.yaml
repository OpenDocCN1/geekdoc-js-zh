  md: '![](bbox=[0.218, 0.107, 0.782, 0.503])


    Figure 3.2 Diagrammatic representation of the app components.


    Each dotted line represents an individual component that is responsible for both
    what you see and any interactions that it is responsible for. Don''t let this
    scare you. While this looks really complicated, you will soon see that it will
    start to make a whole lot of sense once you''ve had a chance to play with components
    and some of the awesome things they do—or, at least, really hard to do.


    # Quick Review of Functions


    In JavaScript, you have functions that enable you to make your code bit cleaner
    and more reusable. Now, there''s reason we''re taking some time to look at functions,
    and it''s not to annoy you! Conceptually, functions share a lot of surface area
    with React components, and the easiest way to understand what components do is
    to take a quick look at functions first.


    In a world where functions don''t exist, you might have some code that looks as
    follows:


    ```

    var speed = 10;

    var time = 5;

    alert(speed * time);

    ```'
