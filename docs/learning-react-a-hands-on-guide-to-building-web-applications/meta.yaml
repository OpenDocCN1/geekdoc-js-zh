  md: "# JSX Quirks to Remember\n\nwhich we've been using to perform this JSX-to-JS\
    \ transformation entirely in the browser. We'll eventually look at using Babel\
    \ as part of a more involved build environment in which we generate a transformed\
    \ JS file, but you'll see more on when we get there in the future.\n\nSo you have\
    \ it, an answer to what exactly happens to all our JSX: It gets turned into sweet\
    \ JavaScript.\n\n# JSX Quirks to Remember\n\nAs we've been working with JSX, you've\
    \ probably noticed we've run into some arbitrary rules and exceptions on what\
    \ we can and can't do. In this section, let's look at those quirks...and some\
    \ brand new ones!\n\n# Evaluating Expressions\n\nJSX is treated like JavaScript.\
    \ As you've seen a few times already, this means that you aren't limited to dealing\
    \ with static content like:\n\n```\nclass Staff extends React.Component {\n  render()\
    \ {\n    <h1>Boring static content!</h1>\n  }\n};\n```\n\nThe values you return\
    \ can be dynamically generated. All you have to do is wrap your expression in\
    \ curly braces:\n\n```\nclass Staff extends React.Component {\n  render() {\n\
    \    <h1>Boring {Math.random()} * 100 content!</h1>\n  }\n};\n```\n\nNote that\
    \ we're throwing in a Math.random() call to generate a random number. It gets\
    \ evaluated along with the static text beside it, but because of the curly braces,\
    \ what you looks something like the following: Boring 28.638820148227 content!\n\
    \nThese curly braces allow your app to first evaluate the expression and then\
    \ return the result of the evaluation. Without them, you would see your expression\
    \ returned as text: Boring Math.random() * 100 content!\n\nThat isn't what you\
    \ would probably want.\n\n81"
  merge: -1
