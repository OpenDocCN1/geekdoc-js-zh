  md: '# Store


    ![](bbox=[0.301, 0.155, 0.696, 0.613])


    # App


    The reason is scalability. Even for simple apps, keeping our application state
    in-sync with what our app is doing is a chore. For complex apps in which different
    parts want to access and modify the application state, forget about it! This roundabout
    way is Redux''s answer for making storing application state is easy for both simple
    apps and complex ones. Beyond just ease, Redux helps make maintaining your application
    state predictable. Dan Abramov and Andrew Clark, the creators of Redux, interpreted
    predictable as follows:


    +   1. Your entire application''s state is stored in a single location. You don''t
    have to search across a variety of data stores to find the part of the state you
    want to update. Keeping everything stored in a single location also ensures that
    you don''t have to worry about keeping all of this data in sync.'
