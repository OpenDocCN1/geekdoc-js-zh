    function printStuff(a, b, c) {\n  console.log(\"Printing: \" + a + \" \" + b +\
    \ \" \" + c);\n}\n\n// using the spread operator\nprintStuff(...items);\n\n//\
    \ without using the spread operator\nprintStuff(items[0], items[1], items[2]);\n\
    ```\n\nThe situation we face in transferring properties across components is very\
    \ similar to the problem of accessing each array item individually. Now let me\
    \ elaborate.\n\nInside a component, our props object looks as follows:\n\n```\n\
