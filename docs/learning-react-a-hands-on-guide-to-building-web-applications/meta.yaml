  md: "# Chapter 18 Creating a Single-Page App in React Using React Router\n\n```\n\
    <div className=\"content\">\n  <Route path=\"/\" component={Home}/>\n  <Route\
    \ path=\"stuff\" component={Stuff}/>\n  <Route path=\"contact\" component={Contact}/>\n\
    </div>\n<HashRouter>\n);\n```\n\nAs you can see, the Route contains a path prop.\
    \ The value you specify for the path determines when this route is going to be\
    \ active. When a route is active, the component specified by the component prop\
    \ gets rendered. For example, when we click on the stuff link (whose path is /stuff\
    \ as set by the Nav component’s prop), the route whose path value is also /stuff\
    \ becomes active. This means the content of our Stuff gets rendered.\n\nYou can\
    \ see all of this for yourself. Jump back to your browser to see the live updates\
    \ or run npm start again. Something seems off, though, right? The content on the\
    \ links to see the loading in and out. The content for our home page seems to\
    \ always display even if we're clicking on the Stuff or Contact links:\n\n![](bbox=[0.225,\
    \ 0.493, 0.775, 0.883])"
  merge: -1
