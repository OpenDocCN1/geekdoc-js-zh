  md: "Now let's take a few minutes to look at what our existing code does. First,\
    \ we have a comp-\nnent LightningCounterDisplay. The bulk of this component is\
    \ the divStyle object,\nwhich contains the styling information responsible for\
    \ the rounded background.\nreturn function returns a div element that wraps the\
    \ LightningCounter component.\n\nThe LightningCounter component is where all the\
    \ action will take place:\n\n```\nclass LightningCounter extends React.Component\
    \ {\n  render() {\n    return (\n      <h1>Hello!</h1>\n    );\n  }\n}\n```\n\n\
    As it is right now, this component has nothing interesting going for it. It returns\
    \ the word\nHello! That's okay—we'll fix up this component later.\n\nThe last\
    \ thing to look at is our ReactDOM.render method:\n\n```\nReactDOM.render(\n \
    \ <LightningCounterDisplay/>,\n  document.querySelector(\\#container\")\n);\n\
    ```\n\nIt pushes the LightningCounterDisplay component to our container element\n\
    in our DOM. That's pretty much. The end is the combination of markup from our\n\
    ReactDOM. render method and the LightningCounterDisplay and LightningCounter\n\
    components.\n\n# Getting Our Counter On\n\nNow that you have an idea of what we're\
    \ starting with, it's time to make plans for our next\nsteps. The way our counter\
    \ works is pretty simple. We're going to use a setInterval\nfunction that calls\
    \ some code every 1000 milliseconds (a.k.a. 1 second). That \"some code\" is\n\
    go to increment a value by 100 each time it's called. Seems pretty straightforward,\
    \ right?\n\nTo make this all, we're relying on three APIs that our React component\
    \ exposes:\n\n+   1. componentDidMount\n\nThis method gets just after our component\
    \ gets rendered (or mounted, React\ncalls it).\n\n+   2. setState\n\nThis method\
    \ allows you to update the value of the state object.\n\nYou'll see these APIs\
    \ in shortly, but here you get a preview so that you can spot them easily\nin\
    \ a lineup."
  merge: -1
  pgno: 104
- img_proc: false
  md: "# Setting the Initial Value\n\nWe need a variable to act as our counter. Let's\
    \ call this variable strikes. We have a bunch of ways to create this variable,\
    \ but the most obvious one is the following:\n\n```\nvar strikes = 0; // :\n```\n\
    \nWe don't want to do that, though. For our example, the strikes variable is part\
    \ of our component's state. We want to create a state object, make our strikes\
    \ variable a property of it, and ensure that we set all of up when our component\
    \ is created. The component we want to do all of this with LightningCounter. Go\
    \ ahead and add the following highlighted lines:\n\n```\nclass LightningCounter\
    \ extends React.Component {\n  constructor(props) {\n    this.state = {\n    \
    \  strikes: 0\n    };\n  }\n  render() {\n    return (\n      <h1>Hello!</h1>\n\
    \    );\n  }\n}\n```\n\nWe specify our state object inside the LightningCounter\
    \ component's constructor. This runs before your component gets rendered. We're\
    \ telling React to set an object containing our strikes property (initialized\
    \ to 0).\n\nIf we inspect the value of our state object after this code run, it\
    \ looks something like the following:\n\n```\nvar state = {\n  strikes: 0\n};\n\
    ```\n\nBefore we wrap up this section, let's visualize our strikes property. In\
    \ our render method, make the following highlighted change:\n\n```\nclass LightningCounter\
    \ extends React.Component {\n  constructor(props) {\n    this.state = {\n    \
    \  strikes: 0\n    };\n  }\n```"
  merge: -1
  pgno: 105
- img_proc: false
  md: "```\nrender() {\nreturn (\n  <h1>{this.state.strikes}</h1>\n);\n}\n```\n\n\
    We've replaced our default **Hello!** text with an expression that displays the\
    \ value stored by the `this.state.strikes` property. If you preview your example\
    \ in the browser, you will see a value of **0**. That's a start!\n\n#  Starting\
    \ Our Timer and Setting State\n\nNext up, is getting our timer going and incrementing\
    \ the `strikes` property. As we mentioned earlier, we will be using the `setInterval`\
    \ function to increase the strikes property by 100 every second. We're going to\
    \ do all of this immediately after our component has been rendered using the built-in\
    \ `componentDidMount` method.\n\nThe code for kicking off our timer looks as follows:\n\
    \n```\nclass LightningCounter extends React.Component {\nconstructor(props) {\n\
    \  this.state = {\n    strikes: 0\n  };\n}\ntimerTick() {\n  this.setState({\n\
    \    strikes: this.state.strikes + 100\n  });\n}\ncomponentDidMount() {\n  setInterval(this.timerTick,\
    \ 1000);\n}\nrender() {\nreturn (\n  <h1>{this.state.strikes}</h1>\n);\n}\n```"
  merge: -1
  pgno: 106
- img_proc: false
  md: "# Getting Our Counter On 93\n\nGo ahead and add these highlighted lines to\
    \ our example. Inside our componentDidMount method that gets called after our\
    \ component rendered, we have our setInterval method that calls a timerTick function\
    \ every second (or 1000 milliseconds).\n\nWe haven't defined our timerTick function,\
    \ so let's fix that by adding the following highlighted lines to our code:\n\n\
    ```\nclass LightningCounter extends React.Component {\n  constructor(props) {\n\
    \    this.state = {\n      strikes: 0\n    };\n  }\n```\n\n```\ntimerTick() {\n\
    \  this.setState({\n    strikes: this.state.strikes + 100\n  });\n}\n```\n\n```\n\
    componentDidMount() {\n  setInterval(this.timerTick, 1000);\n}\n```\n\n```\nrender()\
    \ {\n  return (\n    <h1>{this.state.strikes}</h1>\n  );\n}\n```\n\nWhat our timerTick\
    \ function does is quite simple: it just calls setState. The setState comes in\
    \ various flavors, but for what we're doing here, it takes an object as its argument.\
    \ This object contains all the properties you want to merge into the state object.\
    \ In our case, we are specifying the strikes property and setting its value to\
    \ be 100 more than what it is currently."
  merge: -1
  pgno: 107
- img_proc: false
  md: "# Chapter 8 Dealing with State in React\n\nNote: Incrementing the Existing\
    \ State Value\n\nAs you've seen here, you will end up modifying this state value\
    \ with an updated value. We're getting the existing state value by calling this.state.strikes.\
    \ For performance-related reasons, React might decide to batch state updates in\
    \ rapid succession. This could lead to the original value stored by this.state\
    \ to be out-of-sync with React. To help with this, setState method gives you access\
    \ to the previous state object via the prevState argument.\n\nUsing that argument,\
    \ our code could look like follows:\n\n```\nthis.setState((prevState) => {\n \
    \ return {\n    strikes: prevState.strikes + 100\n  };\n});\n```\n\nThe end result\
    \ is similar to what we had originally. Our strikes property is incremented by\
    \ 100. The only potential change is that the value of the strikes property is\
    \ guaranteed to be whatever the earlier value stored by our state object would\
    \ be.\n\nSo should you use this approach to update your state? There are good\
    \ arguments on both sides. One side for correctness, despite this.state working\
    \ fine for most real-world cases. The other side for keeping the code simple and\
    \ not introducing additional complexity. There's no right or wrong answer, so\
    \ use whatever approach you prefer. I'm calling this out for completeness because\
    \ you could run into the prevState approach in any React code you encounter in\
    \ the world.\n\nYou need to do one more thing. The timer function has been added\
    \ to our component, but its contents don't have the context set to our component.\
    \ In other words, the this keyword where we are accessing setState will return\
    \ a TypeError in the current situation. You can employ several solutions here,\
    \ each a little frustrating in its own way. We'll look at this problem in detail\
    \ later. For now, we're going to explicitly bind our timerTick to our component\
    \ so that all this references resolve properly. Add the following line to our\
    \ constructor:\n\n```\nconstructor(props) {\n  super(props);\n\nthis.state = {\n\
    \    strikes: 0\n  };\n\nthis.timerTick = this.timerTick.bind(this);\n}\n```\n\
    \nWhen you've done this, the timerTick function is ready to be a useful part of\
    \ our component."
  merge: -1
  pgno: 108
- img_proc: false
  md: "# Rendering to the State Change\n\nIf you preview your app now, you'll see\
    \ our strikes value start to increment by 100 every second (see Figure 8.2).\n\
    \n![](bbox=[0.247, 0.198, 0.772, 0.381])\n\nFigure 8.2 The strikes value increments\
    \ by 100 every second.\n\nLet's ignore for a moment what happens with our end\
    \ code. That's pretty straightforward. The interesting thing is that everything\
    \ we've done updating what you see onscreen. That updating has to do with this\
    \ React behavior: Whenever you call setState and update something in the state\
    \ object, your component's render method gets automatically called. This kicks\
    \ off a case of render for any component whose output is also affected. The end\
    \ result of all this is what you see on your screen in the latest representation\
    \ of your app's UI state. Keeping your data and UI in sync is one of the hardest\
    \ problems with UI development, so it's nice that React takes care of it for us.\
    \ It makes all this pain of learning to use React totally...almost!\n\n# Optional:\
    \ The Full Code\n\nWhat we have right now is a counter that increments by 100\
    \ every second. Nothing about it screams lightning counter, but does it cover\
    \ everything about states that I wanted to learn now. But if you optionally flesh\
    \ out your example to look like our version you saw at the beginning, this is\
    \ the full code for what goes inside our script tag:\n\n```\nclass LightningCounter\
    \ extends React.Component {\n  constructor(props) {\n    super(props);\n    this.state\
    \ = {\n      strikes: 0\n    }\n    this.timerTick = this.timerTick.bind(this);\n\
    \  }\n```"
  merge: -1
