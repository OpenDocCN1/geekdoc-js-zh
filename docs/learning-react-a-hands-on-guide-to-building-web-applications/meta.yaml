    \ this.state = {\n    visible: false\n  };\n\n  this.toggleMenu = this.toggleMenu.bind(this);\n\
    }\n\ntoggleMenu() {\n  this.setState({\n    visible: !this.state.visible\n  });\n\
    }\n```\n\nThe code you've added should look like a walk in the park by now. You're\
    \ storing a variable visible in your state object, and you're creating a method\
    \ toggleMenu that will be responsible for toggling visible is true or false.\n\
    \nNext up is to handle the click events on the button and menu. If the goal is\
    \ to update our state from inside our MenuContainer component, we need to place\
    \ our event handler inside MenuContainer as well. Go ahead and add the following\
    \ highlighted lines:\n\n```\nimport React, { Component } from \"react\";\n```\n\
    \n```\nclass MenuContainer extends Component {\n  constructor(props) {\n    super(props);\n\
    \n  this.state = {\n    visible: false\n  }\n```"
