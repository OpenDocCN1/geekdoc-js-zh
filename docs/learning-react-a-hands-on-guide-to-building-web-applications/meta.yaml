  md: '# Conclusion


    Ensuring that your app is performant requires constant vigilance. Profile your
    app’s performance frequently, and definitely do so each time you make a code change
    with the goal of optimizing performance. Each performance optimization you make
    brings complexity that just adds to your (or your team''s) overhead of maintaining
    the code and making fixes in it for the lifetime of your app. Be conscious and
    don''t optimize. If your app works well on the devices and browsers you''re targeting
    (especially the low-end ones), consider your job done. Take a break and don''t
    do any extra work!


    > Note: If you run into any issues, ask!

    If you have any questions or your code isn''t running like you expect, don''t
    hesitate to ask!

    Post on the forums at https://forum.kirupa.com and get help from some of the friendliest
    and most knowledgeable people the Internet has ever brought together!'
