  md: "# How the Sliding Menu Works\n\nThe way the sliding menu works isn't as crazy\
    \ as it seems. The menu is never truly nonexistent; it is simply hidden outside\
    \ the view. To see what that looks like, check out the following diagram:\n\n\
    ![](bbox=[0.233, 0.163, 0.772, 0.574])\n\nJust to the left of the content what\
    \ we see is our menu, patiently hiding until it is called upon. We do that by\
    \ shifting the menu as far as we can until it's fully out of view. Figuring out\
    \ how far to shift is easy. Our menu's size is the same as our browser's window\
    \ (a.k.a. the viewport) size because we want the menu to fully cover whatever\
    \ is shown. Given that detail, we will just shift the menu left by the browser's\
    \ width. One way of doing that might be by using some CSS that looks as follows:\n\
    \n```\n#theMenu {\n  position: fixed;\n  left: 0;\ntop: 0;\n  transform: translate3d(-100vw,\
    \ 0, 0);\n  width: 100vw;\n  height: 100vh;\n}\n```"
  merge: -1
  pgno: 213
- img_proc: false
  md: 'We set our menu''s position to fixed. This single change gives our menu a whole
    lot of magical capabilities. For starters, it ensures that normal layout rules
    no longer apply to it. We can position our menu anywhere using normal x and y
    values, and the menu won''t shift from where we have positioned. If that isn''t
    awesome enough, our menu won''t display a scrollbar if we happen to hide it somewhere
    offseason.


    All this is a good thing we hide our menu offseason by shifting our menu left
    and top properties to 0 and setting our menu transform to a translate3d method
    with a horizontal value of -100vw. The negative value ensures we shift the menu
    left by the amount equal to our browser window''s width. While not directly related
    to position, the size of our menu plays an important role as well. That''s why,
    in this snippet, we set the width properties with values of 100vw and 100vh, respectively,
    to ensure that our menu''s size is as large as our browser window.


    # What Are vw and vh Units?


    If you never seen the vw and vh units, they stand for viewport width (vw) and
    viewport height (vh). They''re a bit like percentage values. Each unit is 1/100th
    the width or height of your viewport (which we''ve simply calling the browser
    window). For example, a value of 100vw means that its value is the full width
    of our browser window. Similarly, 100vh refers to a value that is the full height
    of our browser window.


    When the menu is called to slide into view, we shift the menu right until its
    horizontal position is the same as our browser window origin. If we had to look
    at the CSS for it look like this, it would be an easy change from what we already
    have. We simply set our transform:property translate3d method and set the horizontal
    position to a value of 0vw.


    That might look like this:


    ```

    transform: translate3d(0, 0, 0);

    ```


    This ensures that our menu is shifted right from being hidden offseason (a horizontal
    translate value of -100vw) and is now visible. When our menu needs to disappear,
    we can translate it:


    ```

    transform: translate3d(-100vw, 0, 0);

    ```


    The biggest thing we haven''t spoken about is the animation that makes the sliding
    look cool. This is done using a simple CSS transition that animates the transform
    property:


    ```

    transition: transform .3s cubic-bezier(0, .52, 1);

    ```


    If you''re not familiar with CSS transitions, it''s a very simple concept to wrap
    your brain around. I don''t explain it, so take a few moments and read through
    the short Introduction to CSS Transitions article (https://www.kirupa.com/html5/introduction_css_transitions.html)
    for an overview.'
  merge: -1
