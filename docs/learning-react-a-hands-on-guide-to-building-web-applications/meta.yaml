  md: '# Meet Create React 157


    Notice our App.js file has import statements of its own. Some, such as the one
    for React and Component, necessary, given what our code is doing. The last line
    here is interesting: export default app. It contains the export command and the
    name that our project will use to identify the exported module. You''ll use this
    exported name when importing the App module in other parts of the project, such
    as index.js. Closing out this file is doing, it also imports an image and CSS
    file that are needed to make this work.


    You''ve seen a different way of structuring code using potentially new keywords.
    The purpose of what all of this? These modules, import statements, and export
    statements are just niceties to make our app''s code more manageable. Instead
    of having configured everything in one giant file, you can break your code and
    related assets across multiple files. Depending on which files you reference and
    what files get loaded ahead of others, our mysterious build process (currently
    kicked off with an npm start) can optimize the output in a variety of ways that
    we don''t need to worry about.


    The important point to note is that none of these things you are doing to your
    code affect the functionality of your final app in any major way. Behind the scenes,
    when we''re ready to test our app, a build step makes sense of all the various
    files and components you are importing, to present them as an easily digestible
    set of combined files for the browser to take care of. We''ll get one JS file
    with all the relevant pieces represented:


    ![](bbox=[0.257, 0.495, 0.742, 0.735])


    SINGLE FILE! Files your code relies on!


    We''ll also get one combined CSS file. Depending on what else you might have,
    you could get other combined files for your HTML and more. All of these will be
    in a form that your browser will immediately know what to do with. Your browser
    will have no additional work to do, as in our in-browser solution we were using
    initially. Everything gets generated as vanilla HTML, CSS, and JavaScript.'
