  md: "After you've made that change, preview what you have in your browser. You'll\
    \ see the words Sherlock Holmes printed in giant letters, as in Figure 2.4.\n\n\
    ![](bbox=[0.218, 0.169, 0.75, 0.523])\n\nCongratulations! You've just built an\
    \ app using React.\n\nAs apps go, this's not all that exciting. Chances are, your\
