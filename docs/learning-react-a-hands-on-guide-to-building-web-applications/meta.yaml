- img_proc: false
  md: "# Chapter 19 Introduction to Redux\n\nIf our state object doesn't exist, as\
    \ with the first time we launch our app, we just initialize it as an empty array.\
    \ You can use any data structure you want, but an array is the right one for what\
    \ we're trying to do here.\n\nFrom here the rest of our code is responsible for\
    \ dealing with our actions. Note that the reducer gets the full action object\
    \ via its action argument. This means you have access to not only the action's\
    \ type property, but also anything you specified earlier as part of defining your\
    \ actions.\n\nFor this example, if our action's type is ADD, we add the color\
    \ (specified by the action's color property) to our state array. If your action's\
    \ type is REMOVE, we return a new array with the color in question. Lastly, if\
    \ your action's type is something we don't know, we just return our current state,\
    \ unmodified:\n\n```\nfunction favoriteColors(state, action) {\n  if (state ===\
    \ undefined) {\n    state = [];\n  }\n```\n\n```\nif (action.type === \"ADD\"\
    ) {\n  return state.concat(action.color);\n} else if (action.type === \"REMOVE\"\
    ) {\n  return state.filter(function(item) {\n    return item !== action.color;\n\
    \  });\n} else {\n  return state;\n}\n```\n\nPretty simple, right? Be sure to\
    \ keep one important Redux design choice in mind. The Redux documentation (https://redux.js/docs/basics/Reducers.html)\
    \ describes it best:\n\nThings you should never inside a reducer:\n\n+   - Mutate\
    \ its arguments\n- Perform side effects like API calls and routing transitions\n\
    - Call non-pure functions, e.g. Date.now() or Math.random()\n\nGiven the same\
    \ arguments, it should calculate the state and return it. No surprises. Side effects.\
    \ No API calls. No mutations. Just a calculation.\n\nYou can see this in our code.\
    \ To add new color values to our state array, we used the concat method, which\
    \ returns an entirely new array made up of the old values and the new value we're\
    \ adding. Using push would give us the same result, but it violates our goal of\
    \ not modifying the existing state. To remove color values, we continue to maintain\
    \ our goal of not modifying our current state. We use the filter method, which\
    \ returns a new array with the value we want to remove omitted."
