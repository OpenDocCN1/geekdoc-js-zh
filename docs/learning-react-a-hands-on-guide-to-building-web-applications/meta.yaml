  md: "# Returning Multiple Elements\n\nIn a lot of our examples, we returned one\
    \ top-level element (often a div) that then had many other elements under it.\
    \ You aren't technically limited to following that pattern: You can actually return\
    \ multiple elements. And you can do that in two ways.\n\nOne way is to use an\
    \ arraylike syntax:\n\n```\nclass Stuff extends React.Component {\n  render()\
    \ {\n    return (\n      <p>I am</p>\n      <p>returning a list</p>\n      <p>of\
    \ things!</p>\n    );\n  }\n}\n```\n\nHere we are returning p tags. They don't\
    \ have a single common parent. Now, when you return multiple items, you might\
    \ or not have to deal with one detail, depending on the version of React you are\
    \ targeting. You need to specify a key attribute and a unique value for each item:\n\
    \n```\nclass Stuff extends React.Component {\n  render() {\n    return (\n   \
    \   <p key=\"1\">I am</p>\n      <p key=\"2\">returning a list</p>\n      <p key=\"\
    3\">of things!</p>\n    );\n  }\n}\n```\n\nThis helps better understand which\
    \ element it is dealing with and whether to make any changes to it. How do you\
    \ know whether you need to add the key attribute? React tells you. You'll see\
    \ a similar message to the one printed to your Dev Console: Warning: Each child\
    \ in an array or list should use a unique \"key\" prop.\n\nYou also have another\
    \ (and, arguably, better) way to return multiple elements. This involves something\
    \ called fragments. The way you use it is follows:\n\n```\nclass Stuff extends\
    \ React.Component {\n  render() {\n    return (\n      <React.Fragment>\n    \
    \    <p>I am</p>\n    );\n  }\n}\n```"
  merge: -1
