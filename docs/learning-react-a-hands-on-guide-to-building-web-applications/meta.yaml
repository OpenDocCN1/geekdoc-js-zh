    \ we need to account for a few things going on. We need to maintain some state\
    \ to keep track of whether the menu is hidden or shown. This state needs to be\
    \ something we update from both the button and the menu because clicking on either\
    \ will toggle whether the menu is visible. We need to live in a common location\
    \ where both the menu and the button can access. That common location will be\
    \ the MenuContainer component, so let's add the code to manage our state logic.\n\
    \nIn the MenuContainer.js file, add the constructor and toggleMenu methods just\
