- img_proc: false
  md: "# The Example 101\n\n![](bbox=[0.242, 0.116, 0.757, 0.432])\n\nFigure 9.1 If\
    \ everything went well, you'll get this yellow circle.\n\nIf you see what I see,\
    \ great! Now, let's take a moment to understand what this example is doing.\n\
    The bulk of what you see comes from the Circle component:\n\n```\nclass Circle\
    \ extends React.Component {\nrender() {\n  var circleStyle = {\n    padding: 10,\n\
    \    margin: 20,\n    display: \"inline-block\",\n    backgroundColor: this.props.bgColor,\n\
    \    borderRadius: \"50%\",\n    width: 100,\n    height: 100,\n  };\n\n  return\
    \ (\n    <div style={circleStyle}>\n    </div>\n  );\n}\n}\n```"
  merge: -1
  pgno: 115
- img_proc: false
  md: "We have made up of our circleStyle object that contains the inline style properties\n\
    turn our boring div into an awesome circle. All the style values are hard-coded\
    \ except for\nbackgroundColor property, which takes its value from the bgColor\
    \ prop that gets passed in.\n\nGoing beyond our component, we ultimately display\
    \ our circle via our usual ReactDOM.render\nmethod:\n\n```\nReactDOM.render(\n\
    <div>\n  <Circle bgColor=\"#F9C240\"/>\n</div>\n  destination\n);\n```\n\nWe have\
    \ a single instance of our Circle component declared, and we declare it with the\n\
    bgColor prop set to the color we want to appear. Now, having our Circle compo\n\
    ent be defined as inside our render method is a bit limiting, especially we're\
    \ going to be\ndealing with data that could affect our Circle component does.\
    \ In the next couple\nsections, we'll look at the ways we have for that:\n\n#\
    \ J SX Can Be Anywhere, Part II\n\nIn Chapter 7, \"Meet JS...Again,\" you learned\
    \ that JSX can actually live outside a render\nfunction and can be used as a value\
    \ assigned to a variable or property. For example, we can\nfearlessly do something\
    \ like this:\n\n```\nvar theCircle = <Circle bgColor=\"#F9C240\" />;\n```\n\n\
    ```\nReactDOM.render(\n<div>\n  {theCircle}\n</div>\ndestination\n);\n```\n\n\
    The Circle variable stores the JSX for instantiating our Circle. Evaluating this\n\
    variable inside our ReactDOM.render function results in a circle getting displayed.\
    \ The end\nresult is no different than what we had earlier, but freeing our Circle\
    \ component instantiation\nfrom the shackles of the render method gives us more\
    \ options to do crazy and cool things.\n\nFor example, you can free and create\
    \ a function that returns a Circle component:\n\n```\nfunction showCircle() {\n\
    \  var colors = [\"#393E61\",\"#E94AF37\", \"#1C89BF\", \"#A1D363\"];\n  var ran\
    \ = Math.floor(Math.random() * colors.length);\n\n  // return a Circle with a\
    \ randomly chosen color\n  return <Circle bgColor={colors[ran]} />;\n}\n```"
  merge: -1
  pgno: 116
- img_proc: false
  md: "# Dealing with Arrays 103\n\nIn this case, the showCircle function returns\
    \ a Circle component (boring!) with the value for the bgColor prop set to a random\
    \ color value (awesome sauce!). Now to have our example the showCircle function,\
    \ all you have to evaluate it inside ReactDOM.render.\n\n```\nReactDOM.render(\n\
    <div>\n  {showCircle()}\n</div>,\n  destination\n);\n```\n\nAs long as the expression\
    \ you're evaluating returns JSX, you can put pretty much anything you want inside\
    \ the { and } brackets. That flexibility is really nice because you can do a lot\
    \ when your JavaScript lives outside the render function.\n\n# Dealing with Arrays\n\
    \nNow we get to some fun stuff! When you're displaying multiple components, you\
    \ can't always manually specify them:\n\n```\nReactDOM.render(\n<div>\n  {showCircle()}\n\
    \  {showCircle()}\n  {showCircle()}\n</div>,\n  destination\n);\n```\n\nIn real-world\
    \ scenarios, the number of components you display is related to the number of\
    \ items in an array or arraylike object you're working with. That brings up a\
    \ few simple complications. For example, let's say we have an array that colors\
    \ looks as follows:\n\n```\nvar colors = [\"#39E341\", \"#E94F37\", \"#1C89BF\"\
    , \"#A1D363\", \"#85FFC7\", \"#297373\", \"#FF8552\", \"#A40E4C\"];\n```\n\nWe\
    \ want to create a Circle component for each item in this array (and set the bgColor\
    \ prop to the value of each array item). We can do this by creating an array of\
    \ components:\n\n```\nvar colors = [\"#39E341\", \"#E94F37\", \"#1C89BF\", \"\
    #A1D363\", \"#85FFC7\", \"#297373\", \"#FF8552\", \"#A40E4C\"];\n\nvar renderData\
    \ = [];\n\nfor (var i = 0; i < colors.length; i++) {\n  renderData.push(<Circle\
    \ bgColor={colors[i]} />);\n}\n```"
  merge: -1
  pgno: 117
- img_proc: false
  md: "# Chapter 9 Going from Data to UI in React\n\nIn this snippet, we populate\
    \ our renderData array with Circle components just as we originally set out to\
    \ do. So far, so good. React makes displaying all of these components very simple.\
    \ Take a look at the highlighted line for all you have to do:\n\n```\nReactDOM.render(\n\
    \  <div>\n    {renderData}\n  </div>,\n  destination\n);\n```\n\nIn our render\
    \ method, we all do specify our renderData array as an expression that we need\
    \ to evaluate. We don't need to take any other step to go from an array of components\
    \ to something that looks like Figure 9.2 when you preview in your browser.\n\n\
    ![](bbox=[0.226, 0.363, 0.742, 0.768])\n\nFigure 9.2 What you should see in your\
    \ browser."
  merge: -1
  pgno: 118
- img_proc: false
  md: "# Conclusion 105\n\nOkay, I lied. There's actually one more thing we need to\
    \ do, and it's a subtle one. React makes UI updates really fast by having a good\
    \ idea of what exactly is going on in your DOM. It does this in several ways,\
    \ but one really noticeable way is by internally marking each element with some\
    \ sort of an identifier.\n\nWhen you create elements dynamically (such as what\
    \ we're doing with our array of Circle components), these identifiers are not\
    \ automatically set. We need to do some extra work. That extra work takes the\
    \ form of a key prop whose value React uses to uniquely identify each particular\
    \ component.\n\nFor our example, we can do something like this:\n\n```\nfor (var\
    \ i = 0; i < colors.length; i++) {\n  var color = colors[i];\n  renderData.push(<Circle\
    \ key={i + color} bgColor={color} />);\n}\n```\n\nOn each component, we specify\
    \ our key prop and set its value to a combination of color and index position\
    \ inside the array. This ensures that each component we dynamically create up\
    \ getting a unique identifier that React can then use to optimize any future UI\
    \ updates.\n\n# Check Your Console, Yo!\n\nReact is really telling you when you\
    \ might be doing something wrong. For example, if you dynamically create elements\
    \ or components and don't specify a key prop on them, you'll be greeted with the\
    \ following warning in your console:\n\n> Warning: Each child in an array or iterator\
    \ should have a unique \"key\" prop. Check the top-level render call using <div>.\n\
    \nWhen you're working with React, it's a good idea to periodically check your\
    \ console for any messages. Even if things are working just fine, you never know\
    \ what you might find.\n\n# Conclusion\n\nAll the tips and tricks you've seen\
    \ in this article are possible because of one thing: JSX. This is what allows\
    \ you to have a life wherever JavaScript lives. To us, it looks like we're doing\
    \ something absolutely bizarre when we specify something like this:\n\n```\nfor\
    \ (var i = 0; i < colors.length; i++) {\n  var color = colors[i];\n  renderData.push(<Circle\
    \ key={i + color} bgColor={color} />);\n}\n```"
  merge: -1
  pgno: 119
- img_proc: false
  md: "# Chapter 9 Going from Data to UI in React\n\nEven though we're pushing pieces\
    \ of JSX to an array, just like magic, everything works in the end when renderData\
    \ is evaluated inside our render method. I hate to sound like a broken record,\
    \ but this is what our browser ultimately sees looks like this:\n\n```\nfor (var\
    \ i = 0; i < colors.length; i++) {\n  var color = colors[i];\n}\n\nrenderData.push(React.createElement(Circle,\n\
    \  {\n    key: i + color,\n    bgColor: color\n  }));\n}\n```\n\nWhen our JSX\
    \ gets converted into pure JS, everything makes sense again. This is what allows\
    \ us to get away with putting our JSX in all sorts of uncomfortable (yet photonic!)\
    \ situations and still get the end result we want. In the end, it's all JavaScript.\n\
    \n> Note: If you run into any issues, ask!\nIf you have any questions or your\
    \ code isn't running like you expect, don't hesitate to ask!\nPost on the forums\
    \ at https://forum.kirupa.com and get help from some of the friendliest and most\
    \ knowledgeable people the Internet has ever brought together!"
