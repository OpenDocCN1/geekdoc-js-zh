  md: "# The Initial Rendering Phase\n\nWhen your component is about to start its\
    \ life and make its way to the DOM, the following lifecycle methods get called\
    \ (see Figure 11.4).\n\n![](bbox=[0.222, 0.183, 0.777, 0.593])\n\nFigure 11.4\
    \ The lifecycle methods called initially.\n\nWhat you saw in your console when\
    \ the example was loaded was a less colorful version of what you saw here. Now\
    \ let's go a bit further and see more about what each lifecycle methods does.\n\
    \n# Getting the Default Props\n\nThis property on the component allows you to\
    \ specify the default value of this.props. If we wanted to set a name property\
    \ on our CounterParent component, it could look as follows:\n\n```\nCounterParent.defaultProps\
    \ = {\n  name: \"Iron Man\"\n};\n```\n\nThis gets run before your component is\
    \ even created or any props from parent components passed in."
  merge: -1
  pgno: 142
- img_proc: false
  md: "# Getting the Default State\n\nThis step happens inside your component's constructor.\
    \ You get the chance to specify the default value of this.state as part of your\
    \ component's creation:\n\n```\nconstructor(props) {\n  super(props);\n\n  console.log(\"\
    constructor: Default state time!\");\n\n  this.state = {\n    count: 0\n  };\n\
    \n  this.increase = this.increase.bind(this);\n}\n```\n\nNotice that we're defining\
    \ our state object and initializing it with a count property whose value is 0.\n\
    \n# componentWillMount\n\nThis is the last method that gets before your component\
    \ gets rendered to the DOM. There's an important point to note: if you call setState\
    \ inside this method, your component will not re-render.\n\n# render\n\nThis one\
    \ should be very familiar to you by now. Every component must have this method\
    \ defined, and it is responsible for returning some JSX. If you don't want to\
    \ render anything, simply return null or false.\n\n# componentDidMount\n\nThis\
    \ method gets called immediately after your component renders and gets placed\
    \ on the DOM. At this point, you can safely perform any DOM querying operations\
    \ without worrying about whether your component has made it. If you have any code\
    \ that depends on your component being ready, you can specify all of that code\
    \ here well.\n\nWith the exception of the render method, all of these lifecycle\
    \ methods can fire only once. That's quite different from the methods you see\
    \ next."
