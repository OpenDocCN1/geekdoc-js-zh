  md: '# The Colorizer Example


    ![](bbox=[0.255, 0.111, 0.744, 0.493])


    Figure 12.3 We get purple and the text field is ready for the next color.


    The entered value of purple is cleared and the focus is returned to the text field.
    This allows us to enter additional color values and submit them easily without
    having to keep jumping back and forth between the text field and the button. Isn''t
    that much nicer?


    Getting this behavior using JSX and traditional React techniques is hard. We aren''t
    even going to bother explaining how to go about it. On the other hand, getting
    this behavior right by dealing with the JavaScript DOM API on various HTML elements
    directly is pretty easy. Guess what we''re going to do? In the following sections,
    we''re going to use something known as refs, React provides to help us access
    the DOM API on HTML elements. We''ll also look at portals, which allow us to render
    content to any HTML element on the page.


