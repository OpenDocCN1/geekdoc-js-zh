  md: '# Dealing with Prop Changes


    The other time your component updates is when its prop value changes after it
    has has been rendered into the DOM. In this scenario, the lifecycle methods in
    Figure 11.6 get called.


    ![](bbox=[0.217, 0.203, 0.782, 0.62])


    Figure 11.6 Lifecycle methods when the component''s prop value changes.


    The only new method is componentWillReceiveProps. This method receives one argument,
    and this argument contains the new prop value that is about to be assigned to
    it.


    You saw the rest of the lifecycle methods when looking at state changes, so let''s
    revisit them. Their behavior is identical when dealing with a prop change.


    # The Unmounting Phase


    The last phase to look at is when your component is about to be destroyed and
    removed from the DOM (see Figure 11.7).


    Only one lifecycle method is active here, and that is componentWillUnmount. You
    perform cleanup-related tasks here, such as removing event listeners and stopping
    timers. After this method gets called, your component is removed from the DOM
    and you can say goodbye to it.'
  merge: -1
  pgno: 146
- img_proc: false
  md: '# Conclusion


    ![](bbox=[0.217, 0.135, 0.782, 0.535])


    Figure 11.7 Only one lifecycle method is active when your component is about to
    be destroyed and removed from the DOM.


    # Conclusion


    Components are fascinating little things. On the surface, they seem like they
    don''t have much going on. As in a good documentary about the oceans, when we
    look a little deeper and closer, it''s almost like seeing a whole world. As it
    turns out, React is constantly watching and notifying your component every time
    something happens. All of this is done via the (extremely boring) lifecycle methods
    that we spent this tutorial looking at. Now, I want to reassure you that knowing
    what each lifecycle method does and when it gets called will come in handy one
    day. All that you''ve learned isn''t trivial knowledge, although your friends
    will be impressed if you can describe every lifecycle method from memory. Go ahead
    and try it next time you see them.


    > Note: If you run into any issues, ask!

    If you have any questions or that your code isn''t running like you expect, don''t
    hesitate to ask! Post on the forums at https://forum.kirupa.com and get help from
    some of the friendliest and most knowledgeable people the Internet has ever brought
    together!'
