- img_proc: false
  md: '# Conclusion


    Most of the time, everything you want to be within arm''s reach of the JSX you''re
    writing. Sometimes, though, you need to break free from the box React puts you
    in. Even though everything we''re creating is rendering to a HTML document, our
    React app is like a self-sufficient tropical island within the document; you never
    quite see the actual HTML that lies just beneath the sands. To help you both see
    the HTML inside the island and make contact with things that live outside the
    island, we looked at two features, refs and portals. Refs allow you to cut through
    and access the underlying HTML element beneath the JSX. Portals allow you to render
    your content to any element in the DOM that you have access to. Between these
    solutions, you should be able to easily address any need that you have to deal
    with regards to the DOM directly.


