  md: '# #9 Going from Data to UI in React


    When you''re building your apps, thinking in terms of props, state, components,
    JSX tags, render methods, and other React-isms might be the last thing on your
    mind. Most of the time, you''re dealing with data in the form of JSON objects,
    arrays, and other data structures that have no knowledge (or interest) in React
    or anything visual. Bridging the gulf between your data and what you eventually
    see can be frustrating! Not to worry, though. This chapter helps reduce some of
    those frustrating moments by running through some common scenarios you''ll encounter.


    # ## The Example


    To help sense of everything you''re about to see, we need an example. It''s nothing
    too complicated, so go ahead and create a new HTML document and throw the following
    stuff into it:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <title>From Data to UI</title>

    <script src="https://unpkg.com/react@16/umd/react.development.js"></script>

    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>


    <style>

    #container {

    padding: 50px;

    background-color: #FFF;

    }

    </style>

    </head>

    ```'
  merge: -1
  pgno: 113
- img_proc: false
  md: "```\n<body>\n<div id=\"container\"></div>\n<script type=\"text/babel\">\nclass\
    \ Circle extends React.Component {\n  render() {\n    var circleStyle = {\n  \
    \    padding: 10,\n      margin: 20,\n      display: \"inline-block\",\n     \
    \ backgroundColor: this.props.bgColor,\n      borderRadius: \"50%\",\n      width:\
