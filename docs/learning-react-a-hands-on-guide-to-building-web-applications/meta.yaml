    \ a separate element that you will treat as the root element. This element will\
    \ serve as the destination your render method will use. To make this, go back\
    \ to the HTML and add a div with an id of container:\n\n```\n<div id=\"container\"\
    ></div>\n<script type=\"text/babel\">\nReactDOM.render(\n  <h1>Batman</h1>,\n\
    \  document.body\n);\n</script>\n</body>\n```"
