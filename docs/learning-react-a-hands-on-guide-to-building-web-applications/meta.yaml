  md: "# Chapter 4 Styling in React\n\n```\nbackground-color: #FFDE00;\ncolor: #333;\n\
    display: inline-block;\nfont-family: monospace;\nfont-size: 32px;\ntext-align:\
    \ center;\n```\n\nAs you can see, using CSS is a perfectly viable way to style\
    \ the content in your React-based apps. In the next section, we look at how to\
    \ style content using the approach React prefers.\n\n# Styling Content The React\
    \ Way\n\nReact favors an inline approach for styling content that doesn't use\
    \ CSS. That might seem a bit strange at first, but it's designed to make your\
    \ visuals more reusable. The goal is to make your components little black boxes\
    \ where everything related to your UI looks and works is. Let's see this in action.\n\
    \nContinuing our earlier example, remove the .letter style rule. Your vowels will\
    \ return to their unaltered state when you preview your app in the browser. For\
    \ completeness, you should also remove the className declaration from the Letter\
    \ component's render function. There's no point having your markup content pieces\
    \ you won't be using.\n\nNow's revert the Letter to its original state:\n\n```\n\
    class Letter extends React.Component {\nrender() {\n  return (\n    <div>\n  \
    \    {this.props.children}\n    </div>\n  );\n}\n```\n\nYou specify styles inside\
    \ your component by defining an object whose content is the CSS properties and\
    \ their values. When you have that object, you assign that object to the JSX elements\
    \ you want to style by using the style attribute. This will make more sense when\
    \ you perform these two steps perfectly, so let's apply all of this to the style\
    \ output of the Letter component.\n\n# Creating a Style Object\n\nLet's get right\
    \ to it by defining our object that contains the styles we want to apply:\n\n\
    ```\nclass Letter extends React.Component {\nrender() {\n  var letterStyle = {\n\
    \    padding: 10,\n    margin: 10,\n```"
