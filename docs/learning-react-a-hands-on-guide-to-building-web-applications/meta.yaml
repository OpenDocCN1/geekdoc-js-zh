  md: "# Getting Your React On\n\nIn the previous section, we looked at the two ways\
    \ you have for ensuring that your React app ends up as something your browser\
    \ understands. In this section, we put all those words into practice. First, you\
    \ need a blank HTML page as your starting point.\n\nCreate a new HTML document\
    \ with the following contents:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta\
    \ charset=\"utf-8\">\n  <title>React! React!</title>\n</head>\n<body>\n  <script>\n\
    \  </script>\n</body>\n</html>\n```\n\nThis page has nothing interesting or exciting\
    \ going for it, but let's fix that by adding a reference to the React library.\
    \ Just below the title, add these two lines:\n\n```\n<script src=\"https://unpkg.com/react@16/umd/react.development.js\"\
    ></script>\n<script src=\"https://unpkg.com/react-dom@16/umd/react-dom.development.js\"\
    ></script>\n```\n\nThese two lines bring in the core React library and the various\
    \ things React needs to work with the DOM. Without them, you're not building a\
    \ React app at all.\n\nNow, you're not done yet. You need to reference one more\
    \ library. Just below these two script tags, add the following line:\n\n```\n\
    <script src=\"https://unpkg.com/babel-standalone@6.15.0/babel.min.js\"></script>\n\
    ```\n\nHere you're adding a reference to the Babel JavaScript compiler (http://babeljs.io/).\
    \ Babel many cool things, but the one we care about is its capability to turn\
    \ JSX into JavaScript."
