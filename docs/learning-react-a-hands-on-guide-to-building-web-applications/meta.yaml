  md: "# Chapter 2 Building Your React App\n\nWith the container div element safely\
    \ defined, let's modify the render method to use it instead DOM.body. Here's one\
    \ way of doing this:\n\n```\nReactDOM.render(\n  <h1>Batman</h1>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nAnother option is to do something inside the render\
    \ method itself:\n\n```\nvar destination = document.querySelector(\"#container\"\
    );\n```\n\n```\nReactDOM.render(\n  <h1>Batman</h1>,\n  destination\n);\n```\n\
    \nNotice that the destination variable stores the reference to your container\
    \ DOM element. Inside the render method, you simply reference the destination\
    \ variable instead of writing the full-element syntax as part of the argument\
    \ itself. The reason for this is simple: I want to show you that you're still\
    \ writing JavaScript and render is just another boring method that happens to\
    \ take two arguments.\n\n# Styling It Up!\n\nTime for the last change before we\
    \ call it a day. Right now, our names show up in whatever default h1 styling the\
    \ browser provides. That's just terrible, let's fix that by adding some CSS. Inside\
    \ your head tag, add a style block with the following CSS:\n\n```\n<style>\n#container\
    \ {\n  padding: 50px;\n  background-color: #EEE;\n}\n#container h1 {\n  font-size:\
    \ 144px;\n  font-family: sans-serif;\n  color: #0080A8;\n}\n</style>\n```\n\n\
    After you've added everything, preview your page. Notice that the text appears\
    \ to have a little more purpose than it did earlier, when it relied entirely on\
    \ the browser's default styling (see Figure 2.5)."
