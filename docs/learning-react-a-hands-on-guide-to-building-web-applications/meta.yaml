  md: '# Chapter 4 Styling in React


    ![](bbox=[0.253, 0.103, 0.746, 0.355])


    Figure 4.5 Our vowels with background colors!


    What we''ve just done will be very hard to replicate using plain CSS. As we start
    to look at components whose contents change based on state or user interaction,
    you''ll see more such examples in which the React way of styling things has a
    lot of merit.


    # Conclusion


    As you dive in and learn more about React, you will see several cases in which
    React things quite differently than what you''ve been told is correct on the web.
    In this tutorial, you saw React promoting inline styles in JavaScript as a way
    to style content instead of using CSS style rules. Earlier, we looked at JX and
    CSS and showed how to declare the entirety of the UI in JavaScript using an XML-like
    syntax that sort of looks like HTML.


    With that, you need to pick and choose the techniques that make the most sense
    for your situation. I''m biased towards React''s way of solving UI development
    problems, but I do my best to highlight alternate or conventional methods as well.
    Tying back to what you saw here, using CSS style rules with React content is totally
    okay, as long as you make the decision knowing what you gain and what you lose.


