  md: "# Conclusion\n\n![](bbox=[0.237, 0.115, 0.762, 0.345])\n\nFigure 3.5 A large\
    \ Send JSX Data button.\n\nGetting back to the text, notice that we specify a\
    \ custom property called behavior. This property allows us to specify the button\
    \ element's type attribute, and you can see us accessing it via this.props.behavior\
    \ in the component definition's render method.\n\nThere's more to access a component's\
    \ children than what you've seen here. For example, if your child element is just\
    \ some text, the this.props.children returns a string. If your child element is\
    \ just a single element (as in our example), the this.props.children returns a\
    \ single component that is not wrapped inside an array. We still need to call\
    \ out few more things, but instead of enumerating all the cases and boring you,\
    \ we'll bring those points later as we look at more elaborate examples.\n\n# Conclusion\n\
    \nIf you want to build an app using React, you can't wander too far without having\
    \ to use a component. Trying to build a React app without using a component is\
    \ kind of building a JavaScript-based app using functions. I'm not saying that\
    \ it can't be done; it's just one of those things you do—kind of the Bad Idea\
    \ part of the Animaniacs Good Idea/Bad Idea sketches (https://www.youtube.com/watch?v=2djJOIl4mdnus)\n\
    \nIf this video doesn't convince you that you should learn to embrace components,\
    \ I don't know what will—except for a future chapter on creating components!\n\
    \n+   Note: If you run into any issues, ask!\nIf you have any questions or your\
    \ code isn't running like you expect, don't hesitate to ask! \nPost on the forums\
    \ at https://forum.kirupa.com and get help from some of the friendliest and most\
    \ knowledgeable people the Internet has brought together!"
