  md: '# 17

    Avoiding Unnecessary Renders in React


    You''re probably really tired of saying this, but fast DOM performance is one
    of the biggest feathers in React''s cap. That doesn''t mean you get all that great
    performance for free, though. While React handles a lot of the heavy lifting,
    you should consciously take certain steps to ensure your app isn''t doing unnecessary
    work and slowing things down. One of the biggest steps involves making sure each
    component''s render method is called only when it absolutely has to be. In the
    next few sections, we''ll look at why that''s a problem and what you can do about
    it.


    # About the render Method


    The render method''s official job description is pretty simple. It needs to show
    up on each component and help generate the JSX to return to whatever parent component
    called it. If we had to loosely describe the full workflow from components on
    one end and a fully finished app on the other end, it would look as follows:'
  merge: -1
  pgno: 225
- img_proc: false
  md: '212  Chapter 17  Avoiding Unnecessary Renders in React


    ![](bbox=[0.196, 0.101, 0.803, 0.693])


    You have your finished app on one side. You have the components that make up the
    app on the other. Inside all these components, you see render methods returning
    bits and chunks of JSX getting combined with more bits and chunks of JSX from
    other components. This process repeats until you get the final JSX at the root
    of the component hierarchy where we have our ReactDOM.render call. From there,
    the React Magic happens that turns all this JSX into the appropriate HTML/CSS/JS
    to display in the browser.


    Now that you have a very basic idea of how React works, let''s get back into the
    weeds where our components and their render methods live. In all the React code
    you''ve written so far, you might also have noticed that you never had to explicitly
    call the render method not any'
  merge: -1
  pgno: 226
- img_proc: false
  md: 'component. That just sort of happened automatically. Let''s get more precise.
    Three things cause a render method to automatically get called:


    +   1. A prop that lives on your component gets updated.

    2. A state property that lives on your component gets updated.

    3. A parent component''s render method gets called.


    All of these cases seem like good examples of when we want our component''s render
    method to be automatically called. After all, all three of these could cause your
    visual state to change, right?


    The answer is well, it depends! Very often, components find themselves forced
    to re-render even when the prop or state that changed has absolutely nothing to
    do with them. In some situations, a parent component is correctly rendering or
    re-rendering, but that is localized to that component. There''s no need to ask
    the child components to re-render for something that doesn''t affect them.


    Now, I might be painting an alarming picture of unnecessary work that has been
    right under our noses. One point to keep in mind is that a render method being
    called is not the same thing as the DOM getting updated. React takes a few additional
    steps in which the diff (that is, the previous version is compared with the new/current
    version) to truly see if any changes need to be represented. All of these "few
    additional steps" means work, and more complex apps with a lot of components will
    face many instances that will start to add up. Some of this is actual work done
    by React''s internals. Some of its important things we do in our render methods;
    we often have a lot of code to help generate the appropriate JSX. Rarely does
    our render method return a static piece of JSX with no evaluation or calculation
    handling, minimizing unnecessary render calls is a good thing.


    # Optimizing render Calls


    Now we''ve looked at the problem, let''s see some approaches we can use to ensure
    we''re calling a component''s render method only when absolutely necessary. The
    follow-ings will walk you through this.


    # Getting an Example Going


    To help make sense of this, we''re going to look at an example. It''s not just
    any example, either. We''ll revisit our sliding menu that we created earlier.
    If you have it, go ahead and open it in your code editor.


    If you don''t have the project, that''s okay. Use create-react-app to create a
    new React project and overwrite everything in your src and public folders with
    the contents from the Sliding Menu Github repo:'
