  md: "escaping and quotation mark gibberish I will need to do. With JSX, you do none\
    \ of that. You just place your HTML-like content as is, just like you've done\
    \ here. Magically (like the super-awesome kind involving dragons and laser beams),\
    \ it all works.\n\nThe second argument is document.body. There's nothing crazy\
    \ or bizarre about this argument. It specifies where the converted markup from\
    \ the JSX will end up living in our DOM. In our example, when the render method\
    \ runs, the tag (and everything inside it) is placed in our document's body.\n\
    \nNow, the goal of this exercise is to display a name on the screen. It is clear\
    \ to display your name. Go ahead and modify your code to do that. In my case,\
    \ the render method will look like follows:\n\n```\nReactDOM.render(\n  <h1>Batman</h1>,\n\
    \  document.body\n);\n```\n\nWell, it would look like that if my name were Batman!\
    \ Anyway, if you preview your page now, you'll see your name instead of Sherlock\
    \ Holmes.\n\n# It's All Still Familiar\n\nThe JavaScript looks new and shiny thanks\
    \ to JSX, but the end result your browser sees is nice and clean HTML, CSS, and\
    \ JavaScript. To see this for yourself, let's make a few alterations to how our\
    \ app behaves and looks.\n\n# Changing the Destination\n\nFirst we'll change where\
    \ JSX gets output. Using JavaScript to place things directly in your body element\
    \ is not a good idea. A lot can go wrong, especially if you're going to be mixing\
