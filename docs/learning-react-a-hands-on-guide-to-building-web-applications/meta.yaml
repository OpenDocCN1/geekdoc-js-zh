    \ re-create all of this by using a component. React gives us several ways of creating\
    \ components, but we are going to create them by using the class syntax. Go ahead\
    \ and add the following highlighted code just above the render method:\n\n```\n\
    class HelloWorld extends React.Component {\n}\n```\n\n```\nReactDOM.render(\n\
    <div>\n  <p>Hello, world!</p>\n</div>,\ndocument.querySelector(\"#container\"\
    )\n);\n```\n\nIf the class syntax is foreign to you, first check out our online\
    \ tutorial Using Classes in JavaScript (https://www.kirupa.com/javascript/classy_way_to_create_objects.htm)."
