    \n**12.** In the browser, go to:\n\n**www.yourwebsite.com/phplinks.html**\n\n\
    **13.** Click the **22. Display a text file** link.\n\nThe new thought should\
    \ appear below.\n\n## WORKING WITH FILES\n\n### Practice: Working Files\n\n**1.**\
    \ Create a Web page and script, **quotes.html** and **quotes.php**, that work\
