    ## WORKING WITH FILES

    **138**

    - **$myfile = fopen ($filename, ''r'') or die ("Can not open file");**

    Opens the file **thought.txt** in read-only mode and assigns it to the variable
    **$myfile**.


    - **while (!feof($myfile)){**

    This **while** loop loops through the **$myfile** variable one line at a time
    until it gets the end. **!feof** means “not the end of file.” So, this line means:
    “Keep looping through the file.”


    - **$line = fgets($myfile,5000);**

    This “gets” the first line of the **$myfile** file and assigns it to the variable
    **$line**. Each time the while loop comes back to this command, it will get the
    next line, and then the next line, and so on. The **5000** means that each line
    can be up 5000 characters long.


    - **print "$line <p>";**

    Prints the text in each line of **thought.txt** in a new paragraph as the script
    loops through them.


    - **}**

    This is the end marker for the while loop.


    - **fclose($myfile);**

    Once the while loop is finished, **$myfile** (the variable that stands for **thought.txt**)
    is closed.


