    - **function myFunction($company) {**: **function** 是创建函数的 PHP 命令。**myFunction**
    是用户函数的名称。变量 **$company** 通过括号 ( ) 内部被传递到用户函数中。

    - **{**: 标记用户函数的开始。

    - **print("<p>Welcome to $company</p>");**: 这是用户函数执行的操作。它向浏览器窗口打印文本“**Welcome
    to Acme Auto!**”。这是因为变量 **$company** 被赋予了值“Acme Auto”。

    - **}**: 标记用户函数的结束。


    - **<<body>**: 这个 HTML 标签标记了脚本中在浏览器中可见部分的开始。

    - **<?php**: 标记 PHP 脚本中可见部分的开始。

    - **$company = “Acme Auto";**: 给变量 **$company** 赋值文本值“Acme Auto”。

    - **myFunction($company);**: 执行在上方 **myFunction** 用户函数中编写的代码。这里是将变量 **$company**
    传递到用户函数的地方。

    - **?>**: 标记 PHP 脚本可见部分的结束。


