    then double click it.


    The **PHPSCRIPTS** folder should appear in the **Save In** box.


    ![](img/30f0fa1c6cb552c908695ea335a9f268_16_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_16_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_16_2.png)


    ## LEARNING THE BASICS


    **15**


    **6.** In the **File Name** textbox, type: **simple.php**


    ![](img/30f0fa1c6cb552c908695ea335a9f268_17_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_17_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_17_2.png)


    **7.** Click the ![](img/30f0fa1c6cb552c908695ea335a9f268_17_3.png) button.


    ## LEARNING THE BASICS


    **16**


    **8.** In the blank document window, type:


    ```php

    <?php

    print "Welcome to ACME AUTO";

    ?>

    ```


    ![](img/30f0fa1c6cb552c908695ea335a9f268_18_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_18_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_18_2.png)


    **Tip:** You’re now typing commands to the Web server in the PHP language. Sometimes
    these commands are case-sensitive. Use lower-case for PHP commands—that is, everything
    not enclosed in quotation marks, like **print** "Welcome to ACME AUTO";


    Also, don''t forget to type a semicolon (**;**) at the end of each line. For your
    commands to work, or “execute,” they need a semicolon (**;**) at the end.


    Forgetting a semicolon is the most common programming mistake in most computer
    languages.


    **9.** Save the script.


    Here’s what each line of this PHP script does:


    - **<?php** This is the opening PHP tag. PHP code is always written between the
    opening and closing PHP tags.

    - **(blank line)** Before the next line of code is a blank line. You can use blank
    lines throughout your PHP scripts. Blank lines allow you to group sections of
    code together, which makes scripts easier to read.

    - **print "Welcome to ACME AUTO";** This print command tells the Web server to
    “print” the words between the quotes to the browser window. Remember: for a command
    string to execute, there must be a semicolon (**;**) at the end.

    - **?>** This is the closing PHP tag. No more PHP code can be written after this
    closing tag without another opening PHP tag.


    ## LEARNING THE BASICS


    **18**


    ### Upload a script


    **1.** Open WS_FTP and navigate to the home directory on your Web server. It should
    look something like this:


    ![](img/30f0fa1c6cb552c908695ea335a9f268_20_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_20_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_20_2.png)![](img/30f0fa1c6cb552c908695ea335a9f268_20_3.png)![](img/30f0fa1c6cb552c908695ea335a9f268_20_4.png)


    **2.** In the left-hand **My Computer** pane, navigate to the **PHPSCRIPTS** folder
    on your computer.


    ![](img/30f0fa1c6cb552c908695ea335a9f268_21_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_21_1.png)


    **3.** Double-click the **PHPSCRIPTS** folder. **simple.php** should appear.


    ![](img/30f0fa1c6cb552c908695ea335a9f268_21_2.png)


    **4.** In the right-hand **PHP Uploads** pane, navigate to the **phpscripts**
    directory in your Web site.


    ![](img/30f0fa1c6cb552c908695ea335a9f268_22_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_22_1.png)


    **5.** Double-click the **phpscripts** directory. The pane should be blank:


    ![](img/30f0fa1c6cb552c908695ea335a9f268_22_2.png)


    **6.** Click **simple.php** in the **My Computer** pane, then click the button.


    ![](img/30f0fa1c6cb552c908695ea335a9f268_23_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_23_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_23_2.png)
    **simple.php** should now appear in the **PHP Uploads** pane:


    ![](img/30f0fa1c6cb552c908695ea335a9f268_23_4.png)![](img/30f0fa1c6cb552c908695ea335a9f268_23_5.png)![](img/30f0fa1c6cb552c908695ea335a9f268_23_6.png)


    ## LEARNING THE BASICS


    **22**


    ### Run a script from a Web page


    **1.** Using Notepad, create a new Web page with this code:


    ```html

    <html>

    <head>

    <title>Run your PHP scripts</title>

    </head>

    <body>

    Click on <a href="http://www.yourwebsite.com/phpscripts/simple.php">this link</a>
    to run your first PHP script.

    </body>

    </html>

    ```


    ![](img/30f0fa1c6cb552c908695ea335a9f268_24_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_24_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_24_2.png)


    ## LEARNING THE BASICS


    **23**


