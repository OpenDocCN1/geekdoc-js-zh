- md: "\n# Visibooks illustration-based computer textbooks\n\n# THE VISIBOOKS GUIDE\
    \ TO\n\n# PHP Basics\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_0_0.png)\n\n\
    # See. Do. Learn.\n\n## TABLE OF CONTENTS\n\n**Table of Contents**\n\n- **Learning\
    \ the Basics ........................................1**\n- **Install an FTP program\
    \ ..........................................................................2**\n\
    - **Create a simple script..........................................................................12**\n\
    - **Upload a script .....................................................................................18**\n\
    - **Run a script from a Web page.............................................................22**\n\
    - **Insert comments...................................................................................26**\n\
    - **Format output with HTML....................................................................32**\n\
    - **Working with Variables.................................39**\n- **Employ single\
    \ variables ......................................................................41**\n\
    - **Print quotation marks ..........................................................................52**\n\
    - **Employ lists of variables .....................................................................62**\n\
    - **Working with Numbers .................................71**\n- **Perform calculations............................................................................72**\n\
    - **Increment/decrement...........................................................................75**\n\
    - **Generate random numbers .................................................................78**\n\
    - **User Functions ..............................................83**\n- **Create\
    \ a user function.........................................................................84**\n\
    - **Pass form inputs to a script................................................................89**\n\
    - **Logic & Loops................................................95**\n- **Employ\
    \ conditional logic ....................................................................96**\n\
    - **Employ looping..................................................................................118**\n\
    - **Working With Files.......................................129**\n- **Create\
    \ a text file .................................................................130**\n\
    - **Display files................................................................137**\n\
    - **Append to files................................................................140**\n\
    \n## Learning the Basics\n\nIn this section, you’ll learn how to:\n- Install an\
    \ FTP program\n- Create a simple script\n- Upload a script\n- Run a script from\
    \ a Web page\n- Insert comments\n- Format output with HTML\n\n### Install an FTP\
    \ program\n\n1. Open your Web browser and go to: www.ipswitch.com\n2. Download\
    \ and install WS_FTP. FTP stands for File Transfer Protocol, a way to transfer\
    \ files between computers over the Internet. Using an FTP program is the most\
    \ straightforward way to upload a site to a Web server. WS_FTP is the most popular\
    \ FTP program used to upload and download pages. The Home version is free to use\
    \ for 30 days and can be downloaded at www.ipswitch.com.\n\n3. Open WS_FTP. The\
    \ Connection Wizard should open.\n![](img/30f0fa1c6cb552c908695ea335a9f268_5_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_5_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_5_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_5_3.png)\
    \ button.\n\n4. When the Site Name screen appears, type: in the Site Name box.\n\
    ![](img/30f0fa1c6cb552c908695ea335a9f268_6_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_6_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_6_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_6_3.png)\
    \ button.\n\n5. When the Server Address screen appears, type the host address\
    \ of your server in the Server Address box. It can be something like: www.visibooks.com,\
    \ washington.patriot.net, 207.176.7.217.\n![](img/30f0fa1c6cb552c908695ea335a9f268_7_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_7_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_7_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_7_3.png)\
    \ button.\n**Tip:** You can get the Server Address of your Web site, as well as\
    \ your username and password, from your Web server administrator.\n\n6. When the\
    \ User Name and Password screen appears, type in your username and password.\n\
    ![](img/30f0fa1c6cb552c908695ea335a9f268_8_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_8_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_8_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_8_3.png)\
    \ button.\n\n7. When the Connection Type screen appears, leave the connection\
    \ type set at FTP.\n![](img/30f0fa1c6cb552c908695ea335a9f268_9_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_9_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_9_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_9_3.png)\
    \ button.\n\n8. When the Finish screen appears, click \n![](img/30f0fa1c6cb552c908695ea335a9f268_10_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_10_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_10_2.png)\
    \ button.\n\n9. WS_FTP should connect to your server:\n![](img/30f0fa1c6cb552c908695ea335a9f268_11_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_11_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_11_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_11_3.png)(img/30f0fa1c6cb552c908695ea335a9f268_11_4.png)\n\
    \n10. In the right PHP Uploads pane, double-click the html folder, the folder\
    \ that contains your Web pages on the server. You should now see the contents\
    \ of your Web site on the server.\n\n11. In the right PHP Uploads pane, navigate\
    \ to that site.\n**Tip:** You may have to click \n![](img/30f0fa1c6cb552c908695ea335a9f268_12_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_12_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_12_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_12_3.png)\
    \ icon to move up.\n\n12. When the Make directory window appears, type: phpscripts\
    \ in the textbox.\n![](img/30f0fa1c6cb552c908695ea335a9f268_13_0.png) button.\n\
    You should now see a directory called phpscripts in the right pane:\n![](img/30f0fa1c6cb552c908695ea335a9f268_13_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_13_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_13_3.png)\n\
    \n15. Close WS_FTP.\n\n### Create a simple script\n\n1. Create a folder called\
    \ PHPSCRIPTS on your hard drive.\n2. Open the Notepad program on your computer.\n"
  mdcn: "\n\n# Visibooks 基于插图的计算机教材\n\n# VISIBOOKS 指南\n\n# PHP 基础\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_0_0.png)\n\
    \n# 查看。执行。学习。\n\n## 目录\n\n**目录**\n\n- **学习基础 ........................................1**\n\
    - **安装 FTP 程序 ..........................................................................2**\n\
    - **创建简单的脚本..........................................................................12**\n\
    - **上传脚本 .....................................................................................18**\n\
    - **从网页运行脚本.............................................................................22**\n\
    - **插入注释...................................................................................26**\n\
    - **使用 HTML 格式化输出...................................................................32**\n\
    - **变量操作.................................................39**\n- **使用单变量 ......................................................................41**\n\
    - **打印引号 ..........................................................................52**\n\
    - **使用变量列表 .....................................................................62**\n\
    - **数字操作 .................................................71**\n- **执行计算............................................................................72**\n\
    - **递增/递减...........................................................................75**\n\
    - **生成随机数 .................................................................78**\n\
    - **用户函数 ..............................................83**\n- **创建用户函数.........................................................................84**\n\
    - **将表单输入传递给脚本................................................................89**\n\
    - **逻辑与循环................................................95**\n- **使用条件逻辑 ....................................................................96**\n\
    - **使用循环..................................................................................118**\n\
    - **文件操作.......................................129**\n- **创建文本文件 .................................................................130**\n\
    - **显示文件................................................................137**\n\
    - **向文件追加内容................................................................140**\n\
    \n## 学习基础\n\n在本节中，你将学习如何：\n- 安装 FTP 程序\n- 创建简单的脚本\n- 上传脚本\n- 从网页运行脚本\n- 插入注释\n\
    - 使用 HTML 格式化输出\n\n### 安装 FTP 程序\n\n1. 打开你的 浏览器并访问：www.ipswitch.com\n2. 下载并安装\
    \ WS_FTP。FTP 代表文件传输协议（File Transfer Protocol），是一种通过互联网在计算机之间传输文件的方法。使用 FTP 程序是将网站上传到\
    \ Web 服务器最直接的方法。WS_FTP 是用于上传和下载页面的常用 FTP 程序。家庭版可免费使用 30 天，可以在 www.ipswitch.com\
    \ 下载。\n\n3. 打开 WS_FTP。连接向导应该会打开。\n![](img/30f0fa1c6cb552c908695ea335a9f268_5_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_5_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_5_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_5_3.png)\
    \ 按钮。\n\n4. 当出现站点名称（Site Name）屏幕时，在站点名称框中输入： \n![](img/30f0fa1c6cb552c908695ea335a9f268_6_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_6_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_6_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_6_3.png)\
    \ 按钮。\n\n5. 当出现服务器地址（Server Address）屏幕时，在服务器地址框中输入你服务器的主机地址。它可以是：www.visibooks.com,\
    \ washington.patriot.net, 207.176.7.217。\n![](img/30f0fa1c6cb552c908695ea335a9f268_7_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_7_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_7_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_7_3.png)\
    \ 按钮。\n**提示：** 你从你的 Web 服务器管理员处获取网站的服务器地址以及用户名和密码。\n\n6. 当出现用户名和密码（User Name and\
    \ Password）屏幕时，输入你的用户名和密码。\n![](img/30f0fa1c6cb552c908695ea335a9f268_8_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_8_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_8_2.png)\n\
    \n7. 当出现连接类型（Connection Type）屏幕时，将连接类型设置为 FTP。\n![](img/30f0fa1c6cb552c908695ea335a9f268_9_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_9_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_9_2.png)\
    \ 按钮。\n\n8. 当出现完成（Finish）屏幕时，点击\n![](img/30f0fa1c6cb552c908695ea335a9f268_10_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_10_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_10_2.png)\
    \ 按钮。\n\n9. WS_FTP 将连接到你的服务器：\n![](img/30f0fa1c6cb552c908695ea335a9f268_11_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_11_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_11_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_11_3.png)(img/30f0fa1c6cb552c908695ea335a9f268_11_4.png)\n\
    \n10. 在右侧的上传面板中，双击 html 文件夹，即服务器上包含你 Web 页面的文件夹。你现在可以看到服务器上的网站内容。\n\n11. 在右侧的上传面板中，导航到该站点。\n\
    **提示：** 你可能需要点击\n![](img/30f0fa1c6cb552c908695ea335a9f268_12_0.png)(img/30f0fa1c6cb552c908695ea335a9f268_12_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_12_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_12_3.png)\
    \ 图标返回上一级目录。\n\n12. 当创建目录（Make directory）窗口出现时，在文本框中输入：phpscripts。\n![](img/30f0fa1c6cb552c908695ea335a9f268_13_0.png)\
    \ 按钮。\n你现在可以在右侧面板看到一个名为 phpscripts 的目录：\n![](img/30f0fa1c6cb552c908695ea335a9f268_13_1.png)(img/30f0fa1c6cb552c908695ea335a9f268_13_2.png)(img/30f0fa1c6cb552c908695ea335a9f268_13_3.png)\n\
    \n15. 关闭 WS_FTP。\n\n### 创建简单的脚本\n\n1. 在你的硬盘驱动上创建一个名为 PHPSCRIPTS 的文件夹。\n2. 打开你电脑上的记事本程序。\n\
    \n"
