- md: "\n## WORKING WITH NUMBERS\n\nIn this section, you’ll learn how to:\n\n- Perform\
    \ calculations\n- Increment/decrement\n- Generate random numbers\n\n### Perform\
    \ calculations\n\n1. Create a new script with this code:\n\n```php\n<?php\n$var1\
    \ = 5;\n$var2 = 2;\n$answer = $var1 + $var2;\nprint \"$var1 plus $var2 equals\
    \ $answer.\";\n?>\n```\n\n2. Save the script as **add.php** in the **PHPSCRIPTS**\
    \ folder.\n\nHere's what the relevant lines in this script do:\n- $answer = $var1\
    \ + $var2 ;\nAdds the variables $var1 and $var2 together, then assigns the sum\
    \ to a variable called $answer.\n\nSince $var1 is 5, and $var2 is 2, $answer has\
    \ a value of 7.\n\n3. Upload **add.php** to the **PHPSCRIPTS** directory in your\
    \ Web site.\n\n4. Open **phplinks.html** and insert a new link to **add.php**:\n\
    \n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/add.php\">10. Add\
    \ five plus two.</a></p>\n```\n\n5. Save **phplinks.html**, then upload it to\
    \ the home directory in your Web site.\n\n6. In the browser, go to:\n\nwww.yourwebsite.com/phplinks.html\n\
    \n7. Click the **10. Add five plus two** link.\n\nThe output should look like\
    \ this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_75_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_75_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_75_2.png)\n\
    \n**Tip:** To subtract, just change the **+** sign in the script above to a **–**\
    \ sign.\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_76_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_76_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_76_2.png)\n\
    \nTo multiply, just change it to a **\\*** sign.\n\nTo divide, change it to **/**.\n\
    \n### Increment/decrement\n\n1. Create a new script with this code:\n\n```php\n\
    <?php\n$cars_on_lot = 10;\nprint \"We have $cars_on_lot cars.\\n<br>\";\nprint\
    \ \"We got another new car.\\n<br>\";\n$cars_on_lot++;\nprint \"Now we have $cars_on_lot\
    \ cars!\\n<p>\";\nprint '<b>$cars_on_lot++</b> is the same to PHP as <b>$cars_on_lot\
    \ + 1.</b>';\n?>\n```\n\n2. Save the script as **autoplus.php** in the **PHPSCRIPTS**\
    \ folder.\n\nHere's what the relevant lines in this script do:\n- $cars_on_lot++;\n\
    The auto incrementer (**) adds 1 to the $cars_on_lot variable.\n- print '<b>$cars_on_lot++</b>\
    \ is the same to PHP as <b>$cars_on_lot + 1</b>';\nPrints the text: $cars_on_lot++\
    \ is the same to PHP as $cars_on_lot + 1.\n\n3. Upload **autoplus.php** to the\
    \ **phpscripts** directory in your Web site.\n\n4. Open **phplinks.html** and\
    \ insert a new link to **autoplus.php**:\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/autoplus.php\"\
    >11. Advance a number by 1 automatically.</a></p>\n```\n\n5. Save **phplinks.html**,\
    \ then upload it to the home directory in your Web site.\n\n6. In the browser,\
    \ go to:\n\nwww.yourwebsite.com/phplinks.html\n\n7. Click the **11. Advance a\
    \ number by 1 automatically** link.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_78_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_78_1.png)\n\
    \n**Tip:** To automatically decrement by one, change the auto incrementer in the\
    \ script above (++) to an auto decrementer (--).\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_79_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_79_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_79_2.png)\n\
    \n### Generate random numbers\n\n1. Create a new script with this code:\n\n```php\n\
    <?php\n$random_number = rand(1,10);\nprint \"<p>Your Lucky Number from 1 to 10\
    \ is $random_number</p>\";\nprint \"Click the Reload button on your browser to\
    \ get a random number.\";\n?>\n```\n\n2. Save the script as **random.php** in\
    \ the **PHPSCRIPTS** folder.\n\nHere's what the relevant lines in this script\
    \ do:\n- $random_number = rand(1,10);\nThe rand() command generates a random number\
    \ from 1 to 10. It is then assigned to the variable $random_number.\n- print \"\
    <p>Your Lucky Number from 1 to 10 is $random_number</p>\";\nPrints \"Your Lucky\
    \ Number from 1 to 10 is X\". Because it’s a random number, the number on your\
    \ screen will be different.\n\n3. Upload **random.php** to the **phpscripts**\
    \ directory in your Web site.\n\n4. Open **phplinks.html** and insert a new link\
    \ to **random.php**:\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/random.php\"\
    >12. Generate random numbers.</a></p>\n```\n\n5. Save **phplinks.html**, then\
    \ upload it to the home directory in your Web site.\n\n6. In the browser, go to:\n\
    \nwww.yourwebsite.com/phplinks.html\n\n7. Click the **12. Generate random numbers**\
    \ link.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_81_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_81_1.png)\n\
    \n### Practice: Working with Numbers\n\n1. Write a script that multiplies 347\
    \ * 221.\n\n2. Save the script as **multiply.php** in the **PRACTICEPHP** folder\
    \ on your computer.\n\n3. Upload it into the **practicephp** directory in your\
    \ Web site.\n\n4. Add the paragraph “What’s 347 times 221?” to **practice.html**,\
    \ and link that paragraph to **multiply.php**.\n\n5. Save **practice.html** to\
    \ the home directory in your Web site.\n\n6. View **practice.html** in the browser,\
    \ then click the new link.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_82_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_82_1.png)\n\
    \n7. Write a script that generates a whole random number between 1 and 50. Then\
    \ have the script advance that number by 1.\n\n8. Save the script as **randinc.php**\
    \ in the **PRACTICEPHP** folder on your computer.\n\n9. Upload it into the **practicephp**\
    \ directory in your Web site.\n\n10. Add the paragraph “random number plus one”\
    \ to **practice.html**, and link that paragraph to **randinc.php**.\n\n11. View\
    \ **practice.html** in the browser, then click the new link.\n\nThe output should\
    \ look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_83_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_83_1.png)\n\
    \n## User Functions\n\nIn this section, you’ll learn how to:\n\n- Create a user\
    \ function\n- Pass form inputs to a script\n\n### Create a user function\n\n1.\
    \ Create a new page with this code:\n\n```html\n<html>\n<head>\n<title>Create\
    \ a User Function</title>\n<?php\nfunction myFunction($company) {\n    print(\"\
    <p>Welcome to $company</p>\");\n}\n?>\n</head>\n<body>\n<h3>Start</h3>\n<?php\n\
    $company = \"Acme Auto\";\nmyFunction($company);\n?>\n</body>\n</html>\n```\n\n\
    **What is a user function?**\n\nIt’s a block of reusable code that you create\
    \ within your program. It is sometimes called a subroutine.\n\nPHP instructions\
    \ within the user function can be called or executed from the main program more\
    \ then once. This makes redundant tasks simpler.\n\nYou can also pass variable\
    \ information into a subroutine to make the user function more powerful and flexible.\n"
  mdcn: "\n## 数字操作\n\n在本节中，你将学习如何：\n\n- 执行计算\n- 自增/自减\n- 生成随机数\n\n### 执行计算\n\n1. 使用以下代码创建一个新脚本：\n\
    \n```php\n<?php\n$var1 = 5;\n$var2 = 2;\n$answer = $var1 + $var2;\nprint \"$var1\
    \ plus $var2.\";\n?>\n```\n\n2. 将脚本保存为 **add.php** 并放入 **PHPSCRIPT** 文件夹中。\n\n\
    脚本中相关代码的作用是：\n- $answer = $var1 + $var2\n将变量 $var1 和 $var2 相加，并将结果赋值给变量 $answer。\n\
    \n由于 $var1 为 5，$var2 为 2，$answer 的值为 7。\n\n3. 将 **add.php** 上传到你网站的 **PHPSCRIPT**\
    \ 目录。\n\n4. 打开 **phplinks.html** 并插入一个指向 **add.php** 的新链接：\n\n```html\n<p><a href=\"\
    http://www.yourwebsite.com/phpscripts/add.php\">10. 五加二。</a>a></p>\n```\n\n5.\
    \ 保存 **phplinks.html**，然后将其上传到你网站的根目录。\n\n6. 在浏览器中，访问：\n\nwww.yourwebsite.com/phplinks.html\n\
    \n7. 点击 **10. 五加二** 链接。\n\n输出应该如下：\n\n![](img/30ffa1c6cb552c9086ea335a9f268_75_0.png)(img/30ffa1c6cb552c9086ea335a9f268_75_1.png)(img/30ffa1c6cb552c9086ea335a9f268_75_2.png)\n\
    \n**提示：** 若要执行减法，只需将脚本中的 **+** 号改为 **–** 号。\n\n![](img/30ffa1c6cb552c9086ea335a9f268_76_0.png)(img/30ffa1c6cb552c9086ea335a9f268_76_1.png)(img/30ffa1c6cb552c9086ea335a9f268_76_2.png)\n\
    \n若要执行乘法，只需将其改为 ******* 号。\n\n若要执行除法，将其改为 **/** 号。\n\n### 自增/自减\n\n1. 使用以下代码创建一个新脚本：\n\
    \n```php\n<?php\n$cars_on_lot = 10;\nprint \"We have $cars_on_lot cars.\\n<br>\"\
    ;\nprint \"We got another new car.\\n<br>\";\n$cars_on_lot++;\nprint \"Now we\
    \ have $cars_on_lot cars!\\n<p>\";\nprint '<b>$cars_on_lot++</b> 在 PHP 中等同于 <b>$cars_on_lot\
    \ + 1。</b>';\n?>\n```\n\n2. 将脚本保存为 **autoplus.php** 并放入 **PHPSCRIPT** 文件夹中。\n\n\
    脚本中相关代码的作用是：\n- $cars_on_lot++;\n自增器（**++**）为变量 $cars_on_lot 加 1。\n- print '<b>$cars_on_lot++</b>\
    \ 在 PHP 中等同于 <b>$cars_on_lot + 1。</b>';\n输出文本：$cars_on_lot++ 在 PHP 中等同于 $cars_on_lot\
    \ + 1。\n\n3. 将 **autoplus.php** 上传到你网站的 **phpscripts** 目录。\n\n4. 打开 **phplinks.html**\
    \ 并插入一个指向 **autoplus.php** 的新链接：\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/autoplus.php\"\
    >11. 自动将数字增加 1。</a>a></p>\n```\n\n5. 保存 **phplinks.html**，然后将其上传到你网站的根目录。\n\n\
    6. 在浏览器中，访问：\n\nwww.yourwebsite.com/phplinks.html\n\n7. 点击 **11. 自动将数字增加 1** 链接。\n\
    \n输出应该如下：\n\n![](img/30ffa1c6cb552c9086ea335a9f268_78_0.png)(img/30ffa1c6cb552c9086ea335a9f268_78_1.png)\n\
    \n**提示：** 若要自动减 1，将上述脚本中的自增器 (++) 改为自减器 (--)。\n\n![](img/30ffa1c6cb552c9086ea335a9f268_79_0.png)(img/30ffa1c6cb552c9086ea335a9f268_79_1.png)(img/30ffa1c6cb552c9086ea335a9f268_79_2.png)\n\
    \n### 生成随机数\n\n1. 使用以下代码创建一个新脚本：\n\n```php\n<?php\n$random_number = rand(1,10);\n\
    print \"<p>1 到 10 之间的幸运数字是 $random_number</p>\";\nprint \"点击浏览器上的刷新获取随机数。\";\n\
    ?>\n```\n\n2. 将脚本保存为 **random.php** 并放入 **PHPSCRIPT** 文件夹中。\n\n脚本中相关代码的作用是：\n\
    - $random_number = rand(1,10);\nrand() 命令生成 1 到 10 之间的随机数。将其赋值给变量 $random_number。\n\
    - print \"<p>1 到 10 之间的幸运数字是 $random_number</p>\";\n输出“1 到 10 之间的幸运数字是 X”。由于是随机数，屏幕上的数字会不同。\n\
    \n3. 将 **random.php** 上传到你网站的 **phpscripts** 目录。\n\n4. 打开 **phplinks.html** 并插入一个指向\
    \ **random.php** 的新链接：\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/random.php\"\
    >12. 生成随机数。</a>a></p>\n```\n\n5. 保存 **phplinks.html**，然后将其上传到你网站的根目录。\n\n6. 在浏览器中，访问：\n\
    \nwww.yourwebsite.com/phplinks.html\n\n7. 点击 **12. 生成随机数** 链接。\n\n输出应该如下：\n\n\
    ![](img/30ffa1c6cb552c9086ea335a9f268_81_0.png)(img/30ffa1c6cb552c9086ea335a9f268_81_1.png)\n\
    \n### 练习：数字操作\n\n1. 编写一个计算 347 * 221 的脚本。\n\n2. 将脚本保存为 **multiply.php** 并放入电脑上的\
    \ **PRACTICEPHP** 文件夹中。\n\n3. 将其上传到你网站的 **practicephp** 目录。\n\n4. 在 **phplinks.html**\
    \ 中添加段落“347 乘以 221 等于？”并将该段落链接到 **multiply.php**。\n\n5. 将 **phplinks.html** 保存到你网站的根目录。\n\
    \n6. 在浏览器中查看 **phplinks.html**，然后点击新链接。\n\n输出应该如下：\n\n![](img/30ffa1c6cb552c9086ea335a9f268_82_0.png)(img/30ffa1c6cb552c9086ea335a9f268_82_1.png)\n\
    \n7. 编写一个生成 1 到 50 之间随机整数的脚本。然后让脚本将该数字加 1。\n\n8. 将脚本保存为 **randinc.php** 并放入电脑上的\
    \ **PRACTICEPHP** 文件夹中。\n\n9. 将其上传到你网站的 **practicephp** 目录。\n\n10. 在 **phplinks.html**\
    \ 中添加段落“随机数加一”并将该段落链接到 **randinc.php**。\n\n11. 在浏览器中查看 **phplinks.html**，然后点击新链接。\n\
    \n输出应该如下：\n\n![](img/30ffa1c6cb552c9086ea335a9f268_83_0.png)(img/30ffa1c6cb552c9086ea335a9f268_83_1.png)\n\
    \n## 用户函数\n\n在本节中，你将学习如何：\n\n- 创建用户函数\n- 将表单输入传递给脚本\n\n### 创建用户函数\n\n1. 使用以下代码创建一个新页面：\n\
    \n```html\n<html>\n<head>\n<title>创建用户函数</title>\n<?php\nfunction myFunction($company)\
    \ {\n    print(\"<p>欢迎来到 $company</p>\");\n}\n?>\n</head>\n<body>\n<h3>开始</h3>\n\
    <?php\n$company = \"Acme Auto\";\nmyFunction($company);\n?>\n</body>\n</html>\n\
    ```\n\n**什么是用户函数？**\n\n它是你在程序中创建的一段可重使用的代码块。它有时被称为子程序。\n\n"
