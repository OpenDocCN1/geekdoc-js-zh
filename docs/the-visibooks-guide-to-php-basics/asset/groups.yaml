    \ in the browser, then click the link.\n\nIts output should look like this:\n\n\
    ![](img/30f0fa1c6cb552c908695ea335a9f268_70_0.png)\n\nWORKING WITH VARIABLES \n\
    69\n\n7. Write a script that creates a list (array) of presidents: James Buchanan,\
