    \n \n\n \n\n**Tip:** Since the HTML **<img>** tag requires the use of two double-\n\
    \nquotation marks inside the already quoted print statement. \n\n \n\n**<img src=”maxima.jpg”>**\
    \ \n\n \n\nenclose them in **\\\\** characters to let the Web server know that\
    \ you \n\nwant to print a double-quote to the screen. Otherwise, the Web \n\n\
    server will think you want the double-quotes to start and end a \n\ntext string\
    \ in a PHP command. \n\n \n\n**\\\\**is called an “escape character.” Escape characters\
    \ are used \n\nto print characters, such as double-quotes, that the Web server\
    \ \n\nmight otherwise think were part of a PHP command or text \n\nstring."
- md: "\nWORKING WITH VARIABLES \n58\n\n## Print with double vs. single quotes\n\n\
    1. Create a new script with this code:\n\n```php\n<?php\n# Printing with Double\
    \ Quotes (\")\n# vs. Single Quotes ('')\n$cars_on_lot = 100;\nprint \"<p>Welcome\
    \ to <b>ACME AUTO!</b></p>\\n\";\n# double quotes\nprint \"<p>Which one of our\
    \ $cars_on_lot cars is right for you?</p>\\n\";\n# single quotes\nprint '<p>Which\
    \ one of $cars_on_lot is right for you?</p>\\n';\n?>\n```\n\n2. Save the script\
    \ as **quotes.php** in the **PHPSCRIPTS** folder.\n\nHere’s what the relevant\
    \ lines in this script do:\n\n- `print \"<p>Which one of our $cars_on_lot cars\
    \ is right for you?</p>\\n\";`\nBy using “double quotes” in the above print statement,\
    \ the number assigned to the variable **$cars_on_lot** (100) is printed to the\
    \ browser window.\n\n- `print '<p>Which one of $cars_on_lot is right for you?</p>\\\
    n';`\nBy using ‘single quotes’ in the above print statement, the text **$cars_on_lot**\
    \ is printed to the browser window along with the words that surround it.\n\n\
    3. Upload **quotes.php** to the **phpscripts** directory in your Web site.\n\n\
    4. Open **phplinks.html** and insert a new link to **quotes.php**:\n\n```html\n\
    <p><a href=\"http://www.yourwebsite.com/phpscripts/quotes.php\">7. Double vs.\
    \ single quotes.</a></p>\n```\n\n5. Save **phplinks.html**, then upload it to\
    \ the home directory in your Web site.\n\n6. In the browser, go to:\n\n**www.yourwebsite.com/phplinks.html**\n\
    \n7. Click the **7. Double vs. single quotes** link.\n\nThe output should look\
    \ like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_62_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_62_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_62_2.png)\n\
    \n**Tip:** Using single quotes (**‘**) with the **print** function\n\n`print ‘<p>Which\
    \ one of $cars_on_lot is right for you?</p>\\n’;`\n\nprints literally everything\
    \ in between the two quotation marks. (Except HTML tags, such as the <p> and </p>\
    \ tags.)\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_62_3.png)\n\nIf you want\
    \ to display the value of a variable, use double quotes (**“**):\n\n```php\nprint\
    \ \"<p>Which one of our $cars_on_lot cars is right for you?</p>\\n\";\n```\n\n\
    ![](img/30f0fa1c6cb552c908695ea335a9f268_63_0.png)\n\nWORKING WITH VARIABLES \n\
    62\n\n## Employ lists of variables\n\nCreate lists of number variables\n\n1. Create\
    \ a new script with this code:\n\n```php\n<?php\n# This script demonstrates how\
    \ to create a numeric array.\n$AcmeInventory = array(178,286,387);\nprint \"$AcmeInventory[0]<br>\\\
    n\";\nprint \"$AcmeInventory[1]<br>\\n\";\nprint \"$AcmeInventory[2]<br>\\n\"\
    ;\nprint \"<p>We just created a list of numbers using an array variable!\";\n\
    ?>\n```\n\n**Tip:** Lists of variables are called arrays.\n\n2. Save the script\
    \ as **numberlist.php** in the **PHPSCRIPTS** folder.\n\nHere’s what the relevant\
    \ lines in this script do:\n\n- `$AcmeInventory = array(178,286,387);`\nThe numbers\
    \ 178, 286, and 387 are assigned to the array variable **$AcmeInventory**.\n\n\
    - `print \"$AcmeInventory[0]<br>\\n\";`\nPrints the first number in the array,\
    \ the number 178.\n\n- `print \"$AcmeInventory[1]<br>\\n\";`\nPrints the second\
    \ number in the array, the number 286.\n\n- `print \"$AcmeInventory[2]<br>\\n\"\
    ;`\nPrints the third number in the array, the number 387.\n\n3. Upload **numberlist.php**\
    \ to the **phpscripts** directory in your Web site.\n\n4. Open **phplinks.html**\
    \ and insert a new link to **numberlist.php**:\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/numberlist.php\"\
    >8. Create a list of numbers.</a></p>\n```\n\n5. Save **phplinks.html**, then\
    \ upload it to the home directory in your Web site.\n\n6. In the browser, go to:\n\
    \n**www.yourwebsite.com/phplinks.html**\n\n7. Click the **8. Create a list of\
    \ numbers** link.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_66_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_66_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_66_2.png)\n\
    \nWORKING WITH VARIABLES \n65\n\nCreate lists of text variables\n\n1. Create a\
    \ new script with this code:\n\n```php\n<?php\n# This script demonstrates how\
    \ to create a text array.\n$AcmeCars = array(\"Ford\",\"Dodge\",\"Chevy\");\n\
    print \"$AcmeCars[0]<br>\\n\";\nprint \"$AcmeCars[1]<br>\\n\";\nprint \"$AcmeCars[2]<br>\\\
    n\";\nprint \"<p>We just created a text array!</p>\";\n?>\n```\n\n2. Save the\
    \ script as **textlist.php** in the **PHPSCRIPTS** folder.\n\nHere’s what the\
    \ relevant lines in this script do:\n\n- `$AcmeCars = array(\"Ford\",\"Dodge\"\
    ,\"Chevy\");`\nThe words \"Ford\", \"Dodge\", and \"Chevy\" are assigned to the\
    \ array variable **$AcmeCars**.\n\n- `print \"$AcmeCars[0]<br>\\n\";`\nPrints\
    \ the first word in the array, \"Ford.\"\n\n- `print \"$AcmeCars[1]<br>\\n\";`\n\
    Prints the second word in the array, \"Dodge.\"\n\n- `print \"$AcmeCars[2]<br>\\\
    n\";`\nPrints the third word in the array, \"Chevy.\"\n\n3. Upload **textlist.php**\
    \ to the **phpscripts** directory in your Web site.\n\n4. Open **phplinks.html**\
    \ and insert a new link to **textlist.php**:\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/textlist.php\"\
    >9. Create a list of words.</a></p>\n```\n\n5. Save **phplinks.html**, then upload\
    \ it to the home directory in your Web site.\n\n6. In the browser, go to:\n\n\
    **www.yourwebsite.com/phplinks.html**\n\n7. Click the **9. Create a list of words**\
    \ link.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_69_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_69_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_69_2.png)\n\
    \nWORKING WITH VARIABLES \n68\n\n## Practice: Working with Variables\n\n1. Write\
    \ a script that uses a single variable to specify there are 16 monkeys in a barrel,\
    \ then print it to the browser.\n\n2. Save the script **monkeys.php** in the **PRACTICE**\
    \ folder on your computer.\n\n3. Upload it into the **practicephp** directory\
    \ in your Web site.\n\n4. Add the paragraph “How many monkeys are in a barrel?”\
