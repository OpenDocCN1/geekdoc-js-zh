- md: "\nLOGIC & LOOPS\n\n**114 **\n\n**3.**\n\nChange the code in **or.php** from\
    \ this:\n\n```php\n<?php\n$user1 = \"Paul\";\n$user2 = \"Donna\";\n\nif ($username\
    \ == $user1 || $username == $user2)\n{\n  print \"$username welcome to Acme Auto.\"\
    ;\n}\n?>\n```\n\nTo this:\n\n```php\n<?php\n$user = \"Donna\";\n$pass = \"acme\"\
    ;\n\nif ($username == $user && $password == $pass) {\n  print \"Welcome to Acme\
    \ Auto $username.\";\n}\n?>\n```\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_116_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_116_1.png)\n\
    \nLOGIC & LOOPS\n\n**115**\n\n**4.**\n\nSave the script as **and.php** in the\
    \ **PHPSCRIPTS** folder.\n\nHere's what the relevant lines in this script do:\n\
    \n- **if ($username == $user && $pass == $pass)**\nUses the AND operator:\n\n\
    **&&**\n\nto compare two conditions.\n\nIt’s asking:\n\nIs the word entered in\
    \ the textbox named username the same as the word assigned to the variable **$user**?\n\
    \nAND\n\nIs the word entered in the textbox named **password** the same as the\
    \ word assigned to the variable **$pass**?\n\nIf both these things are true, then\
    \ execute the code in the curly braces.\n\n**5.**\n\nUpload **and.php** to the\
    \ **phpscripts** directory in your Web site.\n\n**6.**\n\nOpen **phplinks.html**\
    \ and insert a new link to **and.html**:\n\n```html\n<p><a href=\"http://www.yourwebsite.com/and.html\"\
    >18. Enter the username and password.</a></p>\n```\n\n**7.**\n\nSave **phplinks.html**,\
    \ then upload it to the home directory in your Web site.\n\nLOGIC & LOOPS\n\n\
    **116 **\n\n**8.**\n\nIn the browser, go to:\n\n**www.yourwebsite.com/phplinks.html**\n\
    \n**9.**\n\nClick the **18. Enter the username and password** link.\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_118_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_118_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_118_2.png)\n\
    \n**10.** In the User Name box, type:\n\n**Donna**\n\nLOGIC & LOOPS\n\n**117**\n\
    \n**11.** In the Password box, type:\n\n**asdf**\n\nthen click the ![](img/30f0fa1c6cb552c908695ea335a9f268_119_0.png)\
    \ button.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_119_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_119_2.png)\n\
    \n**12.** View **and.html** in the browser.\n\nEnter **Donna** as the User Name\
    \ and **acme** as the Password, then click the ![](img/30f0fa1c6cb552c908695ea335a9f268_119_0.png)\
    \ button.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_119_4.png)![](img/30f0fa1c6cb552c908695ea335a9f268_119_5.png)\n\
    \nLOGIC & LOOPS\n\n**118 **\n\n**Employ looping **\n\nPrint a list of elements\n\
    \n**1.**\n\nCreate a new script with this code:\n\n```php\n<?php\n$AcmeCars =\
    \ array(\"Ford\",\"Dodge\",\"Chevy\");\nprint \"<p>The text array contains:</p>\"\
    ;\nforeach ($AcmeCars as $thisCar){\n  print \"$thisCar<br>\\n\";\n}\n?>\n```\n\
    \n**2.**\n\nSave the script as **printlist.php** in the **PHPSCRIPTS** folder.\n\
    \nHere's what the relevant lines in the script do:\n\n- **$AcmeCars = array (\"\
    Ford\",\"Dodge\",\"Chevy\");**\nCreates the array variable **$AcmeCars** and places\
    \ the “Ford”, “Dodge”, and “Chevy” values into the array.\n\n- **foreach ($AcmeCars\
    \ as $thisCar){**\n**foreach** tells the Web server to “loop” through the **$AcmeCars**\
    \ array, going through each value in the array, one by one.\n\n**$thisCar** is\
    \ a variable: it tells the Web server to pull out each separate element in the\
    \ **$AcmeCars** array.\n\n**3.**\n\nUpload **printlist.php** to the **phpscripts**\
    \ directory in your Web site.\n\n**4.**\n\nOpen **phplinks.html** and insert a\
    \ new link to **printlist.php**:\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/printlist.php\"\
    >19. Print a list of elements.</a></p>\n```\n\n**5.**\n\nSave **phplinks.html**,\
    \ then upload it to the home directory in your Web site.\n\n**6.**\n\nIn the browser,\
    \ go to:\n\n**www.yourwebsite.com/phplinks.html**\n\nLOGIC & LOOPS\n\n**120 **\n\
    \n**7.**\n\nClick the **19. Print a list of elements** link.\n\nThe output should\
    \ look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_120_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_120_1.png)\n\
    \nLOGIC & LOOPS\n\n**121**\n\n### Print elements in a table\n\n**1.**\n\nCreate\
    \ a new script with this code:\n\n```php\n<html>\n<head>\n<title>Table Example</title>\n\
    </head>\n<body>\n<table border=\"1\">\n<?php\n$AcmeCars = array(\"Ford\",\"Dodge\"\
    ,\"Chevy\");\nprint \"<p>The text array contains:</p>\";\nforeach ($AcmeCars as\
    \ $thisCar){\n  print \"<tr><td>$thisCar</td></tr>\\n\";\n}\n?>\n</table>\n</body>\n\
    </html>\n```\n\n**2.**\n\nSave the script as **printlist.php** in the **PHPSCRIPTS**\
    \ folder.\n\nHere's what the relevant lines in the script do:\n\n- **$AcmeCars\
    \ = array (\"Ford\",\"Dodge\",\"Chevy\");**\nCreates the array variable **$AcmeCars**\
    \ and places the “Ford”, “Dodge”, and “Chevy” values into the array.\n\n- **foreach\
    \ ($AcmeCars as $thisCar){**\n**foreach** tells the Web server to “loop” through\
    \ the **$AcmeCars** array, going through each value in the array, one by one.\n\
    \n**$thisCar** is a variable: it tells the Web server to pull out each separate\
    \ element in the **$AcmeCars** array.\n\n- **print \"<tr><td>$thisCar</td></tr>\\\
    n\";**\nPrints a table row and cell for each element in the array.\n\n**3.**\n\
    \nUpload **printlist.php** to the **phpscripts** directory in your Web site.\n\
    \n**4.**\n\nOpen **phplinks.html** and insert a new link to **printlist.php**:\n\
    \n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/printlist.php\"\
    >19. Print a list of elements.</a></p>\n```\n\n**5.**\n\nSave **phplinks.html**,\
    \ then upload it to the home directory in your Web site.\n\n**6.**\n\nIn the browser,\
    \ go to:\n\n**www.yourwebsite.com/phplinks.html**\n\n**7.**\n\nClick the **19.\
    \ Print a list of elements** link.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_120_1.png)\n"
  mdcn: "\n[content]\n\n逻辑与循环\n\n**114 **\n\n**3.**\n\n将 **or.php** 中的代码更改为：\n\n```php\n\
