    \ \n\nand email address from \n\nthe referring form, and \n\nplugs them into the\
    \ \n\n“from” and “reply to” \n\nheaders of the email \n\nsent to you. \n\n \n\n\
    The “recipient” and \n\n“subject” of this email \n\nare specified by you. \n\n\
    The Web page that appears \n\non the sender’s screen after \n\nthe email is sent.\
