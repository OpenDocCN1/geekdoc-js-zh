    \n**9.** 关闭记事本和 WS_FTP。\n\n**39**\n\n## 使用变量\n\n**40**\n\n## 什么是变量？\n\n变量是脚本中信息的占位符。在\
    \ PHP 中，变量可以是单个信息，也可以是一个列表。它们始终以 `$` 符号开头，并且区分大小写。例如，你可以轻松地将 PHP 脚本中的“brown”改为“blue”：\n\
