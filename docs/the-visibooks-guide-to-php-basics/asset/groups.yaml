  mdcn: "\n\n文件操作\n\n**140**\n\n## 追加内容到文件\n\n**1.**\n\n使用以下代码创建一个新脚本：\n\n```html\n\
    <html\n<head>\n<title>Append to files</title>\n</head>\n<body>\n<h2>添加今日感悟</h2>\n\
    <p><b>今日的感悟是：... </b></p>\n<?php\n$myfile = fopen ('textthought.txt', 'r') or\
    \ die(\"Can not open file\");\nwhile (!feof($myfile)){\n  $line = fgets($myfile,4096);\n\
    \  print \"$line <br>\";\n}\nfclose($myfile);\n?>\n<form action=\"textappender.php\"\
    \ method=\"post\">\n<input type=\"hidden\" name=\"filename\" value=\"textthought.txt\"\
    >\n<b>在此处输入你想添加的内容 ... </b><br>\n<textarea name=\"comments\" rows=3 cols=50 wrap></textarea>\n\
    <br><input type=\"submit\" value=\"更新感悟\">\n</form>\n</body>\n</html>\n```\n\n\
    **2.**\n\n将该脚本保存为 **textappenderform.php** 并存放在 **PHPSCRIPTS** 文件夹中，然后将其上传到网站的\
    \ **phpscripts** 目录。\n\n此脚本将页面（**textwriter.html**)和脚本（**textviewer.php**)合并为一个脚本。\n\
    \n```php\n<?php\n$myfile = fopen ('textthought.txt', 'r') or die(\"Can not open\
    \ file\");\nwhile (!feof($myfile)){\n  $line = fgets($myfile,4096);\n  print \"\
    $line <br>\";\n}\nfclose($myfile);\n?>\n```\n\n它显示 **textthought.txt** 文件中的文本，并创建一个表单允许你向文件末尾添加新文本。\n\
    \n唯一的变化是表单现在调用了一个名为 **textappender.php** 的新脚本：\n\n```html\n<form action=\"textappender.php\"\
    \ method=\"post\">\n```\n\n**3.**\n\n使用以下代码创建一个新脚本：\n\n```php\n<?php\n$myfile\
    \ = fopen ($filename, 'a') or die(\"Can not open file\");\n$outputFile = \"$comments\\\
    n\";\nfputs($myfile,$outputFile);\nfclose($myfile);\nprint \"<p>文件 $filename 已更新!</p>\"\
    ;\nprint \"<a href=\\\"$filename\\\">查看文本文件 $filename </a></a>\\n\";\n?>\n```\n\
    \n**4.**\n\n将该文件保存为 **textappender.php** 并存放在 **PHPSCRIPTS** 文件夹中，然后将其上传到网站的 **phpscripts**\
    \ 目录。\n\n以下是该脚本中相关行的作用：\n\n- `$myfile = fopen ($filename, 'a') or die(\"Can not\
    \ open file\");`\n  参数 ‘a’ 用于 **fopen()** 命令。它告诉 Web 服务器将新文本追加到现有文件的末尾，而不会覆盖已在那里的文本。\n\
    \n**5.**\n\n打开 **phplinks.html** 并插入指向 **textappenderform.php** 的新链接：\n\n```html\n\
    <p><a href=\"http://www.yourwebsite.com/phpscripts/textappenderform.php\">23.\
    \ 向文本文件追加新数据。</a></p>\n```\n\n**6.**\n\n保存 **phplinks.html**，然后将其上传到网站的根目录。\n\n\
    **7.**\n\n在浏览器中，访问：\n\n**www.yourwebsite.com/phplinks.html**\n\n**8.**\n\n点击 **23.\
    \ 向文本文件追加新数据** 链接。\n\n输出应该如下所示：\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_145_0.png)!(img/30f0fa1c6cb552c908695ea335a9f268_145_1.png)\n\
