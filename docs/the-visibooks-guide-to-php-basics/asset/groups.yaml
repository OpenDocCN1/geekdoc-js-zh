    Welcome to ACME AUTO\"; \n\n \n\nAlso, don't forget to type a semicolon (**;**)\
    \ at the end of each line. \n\nFor your commands to work, or “execute,” they need\
    \ a \n\nsemicolon (**;**) at the end."
  - "[PAGE 19]\n\n \n\nLEARNING THE BASICS \n\n**17**\n\nForgetting a semicolon is\
    \ the most common programming \n\nmistake in most computer languages. \n\n \n\n\
    **9.** \n\nSave the script. \n\n \n\nHere’s what each line of this PHP script\
    \ does: \n\n \n\n• **<?php **\n\nThis is the opening PHP tag. PHP code is always\
    \ written \n\nbetween the opening and closing PHP tags.\n\n• **(blank line) **\n\
    \nBefore the next line of code is a blank line. You can use \n\nblank lines throughout\
    \ your PHP scripts.\n\nBlank lines allow you to group sections of code together,\
    \ \n\nwhich makes scripts easier to read.\n\n• **print \"Welcome to ACME AUTO\"\
    ; **\n\nThis print command tells the Web server to “print” the \n\nwords between\
    \ the quotes to the browser window. \n\n \n\nRemember: for a command string to\
    \ execute, there must \n\nbe a semicolon (**;**) at the end.\n\n• **?> **\n\n\
    This is the closing PHP tag. No more PHP code can be \n\nwritten after this closing\
    \ tag without another opening \n\nPHP tag."
