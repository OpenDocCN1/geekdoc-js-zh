  mdcn: "\n变量操作 \n58\n\n## 使用双引号与单引号进行打印\n\n1. 使用以下代码创建一个新脚本：\n\n```php\n<?php\n#\
    \ 使用双引号 (\") 打印\n# 与单引号 ('') 对对比\n$cars_on_lot = 100;\nprint \"<p>Welcome to <b>ACME\
    \ AUTO!</b></p>\\n\";\n# 双引号\nprint \"<p>Which one of our $cars_on_lot cars is\
    \ right for you?</p>\\n\";\n# 单引号\nprint '<p>Which one of $cars_on_lot is right\
    \ for you?</p>\\n';\n?>\n```\n\n2. 将脚本保存为 **quotes.php** 并存放在 **PHPSCRIPTS** 文件夹中。\n\
    \n以下是该脚本中相关行的作用：\n\n- `print \"<p>Which one of our $cars_on_lot cars is right\
    \ for you?</p>\\n\";`\n  在上面的 print 语句中使用“双引号”，赋值给变量 **$cars_on_lot** 的数字 (100)\
    \ 会被打印到浏览器窗口。\n\n- `print '<p>Which one of $cars_on_lot is right for you?</p>\\\
    n';`\n  在上面的 print 语句中使用‘单引号’，文本 **$cars_on_lot** 会连周围的文字一起打印到浏览器窗口。\n\n3. 将 **quotes.php**\
    \ 上传到你网站的 **phpscripts** 目录。\n\n4. 打开 **phplinks.html** 并插入指向 **quotes.php** 的新链接：\n\
    \n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/quotes.php\">7.\
    \ 双引号与单引号。</a></p>\n```\n\n5. 保存 **phplinks.html**，然后将其上传到你网站的根目录。\n\n6. 在浏览器中，访问：\n\
    \n**www.yourwebsite.com/phplinks.html**\n\n7. 点击 **7. 双引号与单引号** 链接。\n\n输出应该如下：\n\
    \n![](img/30f0fa1c6cb552c908695ea335a9f268_62_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_62_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_62_2.png)\n\
    \n**提示：** 在 **print** 函数中使用单引号（**‘**)\n\n`print ‘<p>Which one of $cars_on_lot\
    \ is right for you?</p>\\n’;`\n\n会原样打印两个引号之间的所有内容。（HTML 标签除外，例如 <p> 和 </p> 标签。）\n\
    \n![](img/30-f0fa1c6cb552c908695ea335a9f268_62_3.png)\n\n如果你想显示变量的值，请使用双引号（**“**）：\n\
    \n```php\nprint \"<p>Which one of our $cars_on_lot cars is right for you?</p>\\\
    n\";\n```\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_63_0.png)\n\n变量操作 \n62\n\
    \n## 使用变量列表\n\n创建数字变量列表\n\n1. 使用以下代码创建一个新脚本：\n\n```php\n<?php\n# 此脚本演示了如何创建一个数字数组。\n\
    $AcmeInventory = array(178,286,387);\nprint \"$AcmeInventory[0]<br>\\n\";\nprint\
    \ \"$AcmeInventory[1]<br>\\n\";\nprint \"$AcmeInventory[2]<br>\\n\";\nprint \"\
    <p>We just created a list of numbers using an array!\";\n?>\n```\n\n**提示：** 变量列表被称为数组。\n\
    \n2. 将脚本保存为 **numberlist.php** 并存放在 **PHPSCRIPTS** 文件夹中。\n\n以下是脚本相关行的作用：\n\n-\
    \ `$AcmeInventory = array(178,286,387);`\n  数字 178、286 和 387 被赋值给变量 **$AcmeInventory**。\n\
    \n- `print \"$AcmeInventory[0]<br>\\n\";`\n  打印数组中的第一个数字 178。\n\n- `print \"$AcmeInventory[1]<br>\\\
    n\";`\n  打印数组中的第二个数字 286。\n\n- `print \"$AcmeInventory[2]<br>\\n\";`\n  打印数组中的第三个数字\
    \ 387。\n\n3. 将 **numberlist.php** 上传到你网站的 **phpscripts** 目录。\n\n4. 打开 **phplinks.html**\
    \ 并插入指向 **numberlist.php** 的新链接：\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/numberlist.php\"\
    >8. 创建数字列表。</a></p>\n```\n\n5. 保存 **phplinks.html**，然后将其上传到你网站的根目录。\n\n6. 在浏览器中，访问：\n\
    \n**www.yourwebsite.com/phplinks.html**\n\n7. 点击 **8. 创建数字列表** 链接。\n\n输出应该如下：\n\
    \n![](img/30f0fa1c6cb552c908695ea335a9f268_66_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_66_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_66_2.png)\n\
    \n变量操作 \n65\n\n创建文本变量列表\n\n1. 使用以下代码创建一个新脚本：\n\n```php\n<?php\n# 此脚本演示了如何创建一个文本数组。\n\
    $AcmeCars = array(\"Ford\",\"Dodge\",\"Chevy\");\nprint \"$AcmeCars[0]<br>\\n\"\
    ;\nprint \"$AcmeCars[1]<br>\\n\";\nprint \"$AcmeCars[2]<br>\\n\";\nprint \"<p>We\
    \ just created a text array!</p>\";\n?>\n```\n\n2. 将脚本保存为 **textlist.php** 并存放在\
    \ **PHPSCRIPTS** 文件夹中。\n\n以下是脚本相关行的作用：\n\n- `$AcmeCars = array(\"Ford\",\"Dodge\"\
    ,\"Chevy\");`\n  单词 \"Ford\"DDodge\" 和 \"Chevy\" 被赋值给变量 **$AcmeCars**。\n\n- `print\
    \ \"$AcmeCars[0]<br>\\n\";`\n  打印数组中的第一个单词 \"Ford\"。\n\n- `print \"$AcmeCars[1]<br>\\\
    n\";`\n  打印数组中的第二个单词 \"Dodge\"。\n\n- `print \"$AcmeCars[2]<br>\\n\";`\n  打印数组中的第三个单词\
    \ \"Chevy\"。\n\n3. 将 **textlist.php** 上传到你网站的 **phpscripts** 目录。\n\n4. 打开 **phplinks.html**\
    \ 并插入指向 **textlist.php** 的新链接：\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/textlist.php\"\
    >9. 创建单词列表。</a></p>\n```\n\n5. 保存 **phplinks.html**，然后将其上传到你网站的根目录。\n\n6. 在浏览器中，访问：\n\
    \n**www.yourwebsite.com/phplinks.html**\n\n7. 点击 **9. 创建单词列表** 链接。\n\n输出应该如下：\n\
    \n![](img/30f0fa1c6cb552c908695ea335a9f268_69_0.png)[](img/30f0fa1c6cb552c908695ea335a9f268_69_1.png)[](img/30f0fa1c6cb552c908695ea335a9f268_69_2.png)\n\
    \n变量操作 \n68\n\n## 练习：变量操作\n\n1. 写一个脚本，使用单个变量指定桶里有 16 只猴子，然后将其打印到浏览器。\n\n2. 将脚本\
