    ### Assign text to a variable


    **1.** Using Notepad, create a new script with this code:


    ```php

    <?php

    $company_name = "ACME AUTO";

    $cars_on_lot = 100;

    $deal_of_day = "Ford Mustang";

    print "<p>Welcome to $company_name!</p>";

    print "<p>Which one of our $cars_on_lot cars is right for you?</p>";

    print "<p>Today we have a GREAT deal on a $deal_of_day.</p>";

    ?>

    ```


    ![](img/30f0fa1c6cb552c908695ea335a9f268_50_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_50_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_50_2.png)


    ## WORKING WITH VARIABLES

    **49**


    **2.** Here’s what the relevant lines in this script do:


    - **$company_name = "ACME AUTO";** Assigns the text **ACME AUTO** to the variable
    **$company_name**.

    - **$deal_of_day = "Ford Mustang";** Assigns the text Ford Mustang to the variable
    **$deal_of_day**.

    - **$cars_on_lot = 100;** Assigns the number **100** to the variable **$cars_on_lot**.

    - **print "<p>Welcome to $company_name!</p>\n";** Prints the words “**Welcome
    to**” to the browser window, then inserts the text assigned to the variable **$company_name**
    (“ACME AUTO”).

    - **print "<p>Which one of our $cars_on_lot cars is right for you?</p>\n";** Prints
    words to the browser window, inserting the number assigned to the variable **$cars_on_lot**
    (100).


