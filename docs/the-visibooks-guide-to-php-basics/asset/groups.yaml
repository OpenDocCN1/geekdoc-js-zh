    If statements


    1. Create a new Web page with this code:


    `<html>

    <head>

    <title>If Statements</title>

    </head>

    <body>

    <h2>Acme Logon Page</h2>

    <form method="POST" action="http://www.yourwebsite.com/phpscripts/if.php">

    <h2>Enter Password:</h2>

    Password: <input type="password" name="password"><p>

    <input type="submit" value="Submit">

    </form>

    </body>

    </html>`


    2. Save the page as **if.html** in the **PHPSCRIPTS** folder.


    3. Upload it to the home directory in your Web site.


    4. Create a new script with this code:


    `<?php

    $GoodPassword = ''acme'';

    if ($password == $GoodPassword){

    print "<b>Acme Password verified!</b><br>";

    }

    ?>`


    5. Save the script as **if.php** in the **PHPSCRIPTS** folder, then upload it
    to the **phpscripts** directory in your Web site.


    Here''s what the relevant lines in this script do:


    - **$GoodPassword = ''acme'';**: Assigns the value “acme” to the variable **$GoodPassword**.

    - **if ($password == $GoodPassword){**: Compares the password word typed in the
    text box on **if.html** to the password assigned to the variable **$GoodPassword**.


    If they’re the same, then the code between the curly braces is executed:


    `print "<b>Acme Password verified!</b><br>";`


    **Tip:** The double equal sign **==** is used to compare variables. A single equal
    sign assigns a value to a variable.


