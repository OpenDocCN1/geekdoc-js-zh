    \ script. Data is \n\nstored and retrieved using variables. \n\n \n\nIn PHP, a\
    \ variable is can be a single piece of information, or a list of \n\nthings store\
    \ in an array. They always start with a dollar sign, and are \n\ncase sensitive.\
    \ \n\n \n\nExample: **$myName** \n\n \n\nVariables are essential to all programming,\
    \ and very useful. For \n\nexample, you can use a variable to easily change “brown\
    \ eyes” to \n\n“blue eyes” in a PHP script: \n\n \n\n**$eyecolor=“brown”; **\n\
    \n \n\nAs the old song says, “Don’t it make my $eyecolor eyes blue…”"
