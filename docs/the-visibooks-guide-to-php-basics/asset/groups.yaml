    \n- **print \"<tr><td>$thisCar</td></tr>\\n\";**\n为数组中的每个元素打印一个表格行和单元格。\n\n**3.**\n\
    \n将 **printlist.php** 上传到你网站的 **phpscripts** 目录。\n\n**4.**\n\n打开 **phplinks.html**\
    \ 并插入一个指向 **printlist.php** 的新链接：\n\n```html\n<p><a href=\"http://www.yourwebsite.com/phpscripts/printlist.php\"\
    >19. 打印元素列表。</a></p>\n```\n\n**5.**\n\n保存 **phplinks.html**，然后将其上传到你网站的根目录。\n\n\
