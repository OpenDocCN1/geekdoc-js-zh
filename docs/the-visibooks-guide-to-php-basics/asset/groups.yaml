- md: "\nWORKING WITH FILES\n\n**140**\n\n## Append to files\n\n**1.**\n\nCreate a\
    \ new script with this code:\n\n```html\n<html>\n<head>\n<title>Append to files</title>\n\
    </head>\n<body>\n<h2>Add to Today's Thought</h2>\n<p><b>Today's Thought is ...</b></p>\n\
    <?php\n$myfile = fopen ('textthought.txt', 'r') or die(\"Can not open file\");\n\
    while (!feof($myfile)){\n  $line = fgets($myfile,4096);\n  print \"$line <br>\"\
    ;\n}\nfclose($myfile);\n?>\n<form action=\"textappender.php\" method=\"post\"\
    >\n<input type=\"hidden\" name=\"filename\" value=\"textthought.txt\">\n<b>Write\
    \ what you want to add here ... </b><br>\n<textarea name=\"comments\" rows=3 cols=50\
    \ wrap></textarea>\n<br><input type=\"submit\" value=\"Update Thought\">\n</form>\n\
    </body>\n</html>\n```\n\n**2.**\n\nSave the script as **textappenderform.php**\
    \ in the **PHPSCRIPTS** folder, then upload it to the **phpscripts** directory\
    \ in your Web site.\n\nThis script combines a page (**textwriter.html**) and a\
    \ script (**textviewer.php**) into one script.\n\n```php\n<?php\n$myfile = fopen\
    \ ('textthought.txt', 'r') or die(\"Can not open file\");\nwhile (!feof($myfile)){\n\
    \  $line = fgets($myfile,4096);\n  print \"$line <br>\";\n}\nfclose($myfile);\n\
    ?>\n```\n\nIt displays the text in the **textthought.txt** file, and creates a\
    \ form that allows you to add new text to the end of it.\n\nThe one change is\
    \ that the form now calls a new script called **textappender.php**:\n\n```html\n\
    <form action=\"textappender.php\" method=\"post\">\n```\n\n**3.**\n\nCreate a\
    \ new script with this code:\n\n```php\n<?php\n$myfile = fopen ($filename, 'a')\
    \ or die(\"Can not open file\");\n$outputFile = \"$comments\\n\";\nfputs($myfile,$outputFile);\n\
    fclose($myfile);\nprint \"<p>The $filename file is updated!</p>\";\nprint \"<a\
    \ href=\\\"$filename\\\">View the $filename text file</a>\\n\";\n?>\n```\n\n**4.**\n\
    \nSave the file as **textappender.php** in the **PHPSCRIPTS** folder, then upload\
    \ it to the **phpscripts** directory in your Web site.\n\nHere's what the relevant\
    \ lines in this script do:\n\n- `$myfile = fopen ($filename, 'a') or die(\"Can\
    \ not open file\");`\n  The ‘a’ parameter is used with the **fopen()** command.\
    \ This tells the Web server to append new text to the end of the existing file,\
    \ without overwriting the text already there.\n\n**5.**\n\nOpen **phplinks.html**\
    \ and insert a new link to **textappenderform.php**:\n\n```html\n<p><a href=\"\
    http://www.yourwebsite.com/phpscripts/textappenderform.php\">23. Append new data\
    \ to a text file.</a></p>\n```\n\n**6.**\n\nSave **phplinks.html**, then upload\
    \ it to the home directory in your Web site.\n\n**7.**\n\nIn the browser, go to:\n\
    \n**www.yourwebsite.com/phplinks.html**\n\n**8.**\n\nClick the **23. Append new\
    \ data to a text file** link.\n\nThe output should look like this:\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_145_0.png)!(img/30f0fa1c6cb552c908695ea335a9f268_145_1.png)\n\
    \n**9.**\n\nIn its comments box, type:\n\nMoney doesn’t grow on trees.\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_146_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_146_1.png)\n\
    \n**10.**\n\n**11.** Click the ![](img/30f0fa1c6cb552c908695ea335a9f268_146_2.png)\
