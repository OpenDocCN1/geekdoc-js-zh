    \n- **if ($username == $user && $pass == $pass)**\n使用 AND 运算符：\n\n**&&**\n\n来比较两个条件。\n\
    \n它在询问：\n\n在名为 username 的文本框中输入的单词是否与赋值给变量 **$user** 的单词相同？\n\n以及（AND）\n\n在名为\
    \ **password** 的文本框中输入的单词是否与赋值给变量 **$pass** 的单词相同？\n\n如果这两个条件都成立，则执行大括号中的代码。\n\
    \n**5.**\n\n将 **and.php** 上传到你网站的 **phpscripts** 目录。\n\n**6.**\n\n打开 **phplinks.html**\
