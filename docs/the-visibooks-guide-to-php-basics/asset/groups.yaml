    \n逻辑与循环\n\n**118 **\n\n**使用循环 **\n\n打印元素列表\n\n**1.**\n\n创建一个带有此代码的新脚本：\n\n```php\n\
    <?php\n$AcmeCars = array(\"Ford\",\"Dodge\",\"Chevy\");\nprint \"<p>The text array\
    \ contains:</p>\";\nforeach ($AcmeCars as $thisCar){\n  print \"$thisCar<br>\\\
    n\";\n}\n?>\n```\n\n**2.**\n\n将脚本保存为 **PHPSCRIPTS** 文件夹中的 **printlist.php**。\n\
    \n脚本中相关行的作用如下：\n\n- **$AcmeCars = array (\"Ford\",\"Dodge\",\"Chevy\");**\n创建数组变量\
