    ## LEARNING THE BASICS


    **26**


    ### Insert comments


    **1.** Using Notepad, create a new script with this code:


    ```php

    <?php

    // A comment to explain the code

    /*

    A block of words can be commented this way.

    These comments do not affect the way the script works.

    */

    print "Welcome to ACME AUTO!"; // A comment on the same line

    ?>

    ```


    ![](img/30f0fa1c6cb552c908695ea335a9f268_28_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_28_1.png)


    ## LEARNING THE BASICS


    **27**


    **Tip:** If you’re writing a comment in a script and it wraps to the next line,
    it needs a new # character in front.


    Incorrect:

    The second line lets a browser display the script output.


    Correct:

    # The second line lets a browser

    # display the script output.


    **2.** Save this script as **comments.php** in the **PHPSCRIPTS** folder on your
    computer.


    ![](img/30f0fa1c6cb552c908695ea335a9f268_29_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_29_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_29_2.png)


