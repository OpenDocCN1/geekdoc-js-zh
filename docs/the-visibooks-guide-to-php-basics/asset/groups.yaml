    \ 按钮。\n\n输出应该如下所示：\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_119_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_119_2.png)\n\
    \n**12.** 在浏览器中查看 **and.html**。\n\n输入 **Donna** 作为用户名，输入 **acme** 作为密码，然后点击 ![](img/30f0fa1c6cb552c908695ea335a9f268_119_0.png)\
