    \ 文件夹中的 **printlist.php**。\n\n脚本中相关行的作用如下：\n\n- **$AcmeCars = array (\"Ford\"\
    ,\"Dodge\",\"Chevy\");**\n创建数组变量 **$AcmeCars** 并将“Ford”、“Dodge”和“Chevy”值放入数组。\n\
    \n- **foreach ($AcmeCars as $thisCar){**\n**foreach** 告诉 Web 服务器“循环”遍历 **$AcmeCars**\
