    \n4. 在 **practice.html** 中添加段落“桶里有多少只猴子?”并将该段落链接到 **monkeys.php**。\n\n5. 将 **practice.html**\
    \ 上传到你网站的根目录。\n\n6. 在浏览器中查看 **practice.html**，然后点击链接。\n\n它的输出应该如下：\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_70_0.png)\n\
    \n变量操作 \n69\n\n7. 写一个脚本创建一个总统列表（数组）：James Buchanan, George Washington, Millard\
    \ Fillmore …打印文本“这是革命中不可或缺的人物:” …然后打印列表中的第二个名字。\n\n8. 将脚本保存为 **presidents.php**\
