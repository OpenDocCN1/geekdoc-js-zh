    \\n\"; **\n\n**$headers .= \"Content-Type: text/plain; **\n\n**charset=iso-8859-1\\\
    \\n\"; **\n\n**$recipient = \"you@yourwebsite.com\"; **\n\n**$subject = \"Contact\
    \ From Your Website\"; **\n\n**$msg = wordwrap( $msg, 1024 ); **\n\n**//send the\
    \ message using the **\n\n**//server’s mail() function **\n\n**mail($recipient,\
    \ $subject, **\n\n**stripslashes($msg), $headers); **\n\n**?> **\n\n**<html> **\n\
    \n**<head> **\n\n**<title>Mail Sent</title> **\n\n**</head> **\n\n**<body> **\n\
    \n**<h2>Thank you <? echo \"$name\"; ?>!</h2> **\n\n**<p><strong>Your email has\
