    \n**9.** Close Notepad and WS_FTP.\n\nLEARNING THE BASICS\n\n**39**\n\n## Working\
    \ with Variables\n\n**40**\n\n## What’s a variable?\n\nA variable is a placeholder\
    \ for information within a script. In PHP, a variable can be a single piece of\
    \ information or a list of things. They always start with a dollar sign and are\
    \ case sensitive. For example, you can easily change “brown” to “blue” in a PHP\
    \ script:\n\n$color=\"brown\";\n\nDon’t make my eyes $color\n\nLEARNING THE BASICS\n\
    \n**41**\n\n## Assign a number to a variable\n\n**1.**\n\nIn Notepad, create a\
    \ new script with this code:\n\n<?php\n$cars_on_lot = 100;\n?>\n<p>Which one of\
