    \ == $user2)\n{\n  print \"$username welcome to Acme Auto.\";\n}\n?>\n```\n\n\
    修改为：\n\n```php\n<?php\n$user = \"Donna\";\n$pass = \"acme\";\n\nif ($username\
    \ == $user && $password == $pass) {\n  print \"Welcome to Acme Auto $username.\"\
    ;\n}\n?>\n```\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_116_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_116_1.png)\n\
