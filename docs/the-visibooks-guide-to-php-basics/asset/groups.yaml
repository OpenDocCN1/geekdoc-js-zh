    USER FUNCTIONS


    2. Save the page as **functionsimple.php** in the **PHPSCRIPTS** folder.


    Here''s what the relevant lines in this script do:


    - **function myFunction($company) {**: **function** is the PHP command to create
    a function. **myFunction** is the name of the user function. The variable **$company**
    is passed into the user function inside of the parentheses ( ).

    - **{**: Marks the beginning of the user function.

    - **print("<p>Welcome to $company</p>");**: This is what the user function does.
    It prints the text “**Welcome to Acme Auto!**” to the browser window. This is
    because the variable **$company** is given the value of “Acme Auto.”

    - **}**: Marks the end of the user function.


    - **<body>**: This HTML tag begins the part of this script that’s viewable in
    the browser.

    - **<?php**: Begins the viewable part of this PHP script.

    - **$company = “Acme Auto";**: The variable **$company** is assigned the text
    value “Acme Auto.”

    - **myFunction($company);**: Executes the code written in the **myFunction** user
    function above. This is where the variable **$company** is passed into the user
    function.

    - **?>**: Ends the viewable part of the PHP script.


    3. Upload **functionsimple.php** to the **phpscripts** directory in your Web site.


    4. Open **phplinks.html** and insert a new link to **functionsimple.php**:


    `<p><a href="http://www.yourwebsite.com/phpscripts/functionsimple.php">13. Execute
    a user function.</a></p>`


    5. Save **phplinks.html**, then upload it to the home directory in your Web site.


