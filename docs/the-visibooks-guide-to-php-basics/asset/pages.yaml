    \n \n\n \n\n**Tip:** Since the HTML **<img>** tag requires the use of two double-\n\
    \nquotation marks inside the already quoted print statement. \n\n \n\n**<img src=”maxima.jpg”>**\
    \ \n\n \n\nenclose them in **\\\\** characters to let the Web server know that\
    \ you \n\nwant to print a double-quote to the screen. Otherwise, the Web \n\n\
    server will think you want the double-quotes to start and end a \n\ntext string\
    \ in a PHP command. \n\n \n\n**\\\\**is called an “escape character.” Escape characters\
    \ are used \n\nto print characters, such as double-quotes, that the Web server\
    \ \n\nmight otherwise think were part of a PHP command or text \n\nstring."
