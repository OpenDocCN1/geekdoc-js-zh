  md: " \n\n \n\nLEARNING THE BASICS \n\n**16 **\n\n**8.** \n\nIn the blank document\
    \ window, type: \n\n \n\n**<?php **\n\n**print \"Welcome to ACME AUTO\"; **\n\n\
    **?> **\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_18_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_18_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_18_2.png)\n\
    \n \n\n**Tip:** You’re now typing commands to the Web server in the PHP \n\nlanguage.\
    \ Sometimes these commands are case-sensitive. Use \n\nlower-case for PHP commands—that\
    \ is, everything not enclosed \n\nin quotation marks, like \n\n \n\n**print **\"\
    Welcome to ACME AUTO\"; \n\n \n\nAlso, don't forget to type a semicolon (**;**)\
    \ at the end of each line. \n\nFor your commands to work, or “execute,” they need\
    \ a \n\nsemicolon (**;**) at the end."
  merge: -1
  pgno: 18
- img_proc: true
  md: " \n\nLEARNING THE BASICS \n\n**17**\n\nForgetting a semicolon is the most common\
    \ programming \n\nmistake in most computer languages. \n\n \n\n**9.** \n\nSave\
    \ the script. \n\n \n\nHere’s what each line of this PHP script does: \n\n \n\n\
    • **<?php **\n\nThis is the opening PHP tag. PHP code is always written \n\nbetween\
    \ the opening and closing PHP tags.\n\n• **(blank line) **\n\nBefore the next\
    \ line of code is a blank line. You can use \n\nblank lines throughout your PHP\
    \ scripts.\n\nBlank lines allow you to group sections of code together, \n\nwhich\
    \ makes scripts easier to read.\n\n• **print \"Welcome to ACME AUTO\"; **\n\n\
    This print command tells the Web server to “print” the \n\nwords between the quotes\
    \ to the browser window. \n\n \n\nRemember: for a command string to execute, there\
    \ must \n\nbe a semicolon (**;**) at the end.\n\n• **?> **\n\nThis is the closing\
    \ PHP tag. No more PHP code can be \n\nwritten after this closing tag without\
    \ another opening \n\nPHP tag."
  merge: -1
  pgno: 19
- img_proc: true
