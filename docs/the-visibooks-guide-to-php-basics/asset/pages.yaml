  md: " \n\n \n\nWORKING WITH VARIABLES \n\n**58 **\n\nPrint with double vs. single\
    \ quotes \n\n \n\n**1.** \n\nCreate a new script with this code: \n\n**<?php **\n\
    \n**\\# Printing with Double Quotes (\") **\n\n**\\# vs. Single Quotes (') **\n\
    \n**$cars\\_on\\_lot = 100; **\n\n**print \"<p>Welcome to <b>ACME AUTO!</b></p>\\\
    \\n\"; **\n\n**\\# double quotes **\n\n**print \"<p>Which one of our $cars\\_on\\\
    _lot cars is **\n\n**right for you?</p>\\\\n\"; **\n\n**\\# single quotes **\n\
    \n**print '<p>Which one of $cars\\_on\\_lot is right **\n\n**for you?</p>\\\\\
    n'; **\n\n**?> **\n\n**2.** \n\nSave the script as quotes.php in the **PHPSCRIPTS**\
    \ folder. \n\n \n\nHere’s what the relevant lines in this script do: \n\n \n\n\
    • **print \"<p>Which one of our $cars\\_on\\_lot **\n\n**cars is right for you?</p>\\\
    \\n\"; **\n\nBy using “double quotes” in the above print statement, \n\nthe number\
    \ assigned to the variable **$cars\\_on\\_lot** \n\n(100) is printed to the browser\
    \ window."
  merge: -1
