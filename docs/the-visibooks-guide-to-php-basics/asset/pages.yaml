  md: " \n\n \n\nLEARNING THE BASICS \n\n**2 **\n\n**Install an FTP program **\n\n\
    \ \n\n**1.** \n\nOpen your Web browser and go to: \n\n \n\n **www.ipswitch.com**\
    \ \n\n \n\n**2.** \n\nDownload and install WS\\_FTP Home. \n\n \n\n \n\n \n\n\
    \ \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\
    \n**WS\\_FTP **\n\n \n\nFTP stands for File Transfer Protocol, a way to transfer\
    \ files between \n\ncomputers over the Internet. \n\n \n\nUsing an FTP program\
    \ is the most straightforward way to upload a \n\nWeb site to a Web server. WS\\\
    _FTP is the most popular FTP program \n\nused to upload and download Web pages.\
    \ \n\n \n\nThe Home version is free to use for 30 days, and can be downloaded\
    \ \n\nat www.ipswitch.com."
  merge: -1
  pgno: 4
