  md: " \n\nWORKING WITH FILES \n\n**137**\n\n**Display files **\n\n \n\n**1.** \n\
    \nCreate a new script with this code: \n\n**<?php **\n\n**$myfile = fopen ('textthought.txt',\
    \ 'r') or die **\n\n**(\"Can not open file\"); **\n\n**while (!feof($myfile)){\
    \ **\n\n** $line = fgets($myfile,5000); **\n\n** print \"$line <br>\"; **\n\n\
    **} **\n\n**fclose($myfile); **\n\n**?> **\n\n \n\n**2.** \n\nSave the file as\
    \ **textviewer.php** in the **PHPSCRIPTS** folder, then \n\nupload it to the **phpscripts**\
    \ directory in your Web site. \n\n \n\nHere's what the relevant lines in this\
    \ script do: \n\n \n\n• **$myfile = fopen ('textthought.txt', 'r') **\n\n**or\
    \ die (\"Can not open file\"); **\n\nOpens the file **textthought.txt** in read-only\
    \ mode, and \n\nassigns the text in it to the variable **$myfile**."
