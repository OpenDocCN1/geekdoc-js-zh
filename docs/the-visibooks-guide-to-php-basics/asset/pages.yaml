    \nBegins the viewable part of this PHP script. \n\n• **$company = “Acme Auto”;\
    \ **\n\nThe variable **$company** is assigned the text value \n\n“Acme Auto.”\
    \ \n\n• **myFunction($company); **\n\nExecutes the code written in the **myFunction**\
