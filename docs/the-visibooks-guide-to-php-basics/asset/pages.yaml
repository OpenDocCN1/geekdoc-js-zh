  md: " \n\n \n\nUSER FUNCTIONS \n\n**84 **\n\n**Create a user function **\n\n \n\n\
    \ \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n**1.** \n\nCreate a new page with this\
    \ code: \n\n**<html> **\n\n**<head> **\n\n**<title>Create a User Function</title>\
    \ **\n\n**<?php **\n\n** function myFunction($company) { **\n\n** print(\"<p>Welcome\
    \ to $company</p>\"); **\n\n** } **\n\n**?> **\n\n**</head> **\n\n**<body> **\n\
    \n**<h3>Start</h3> **\n\n**<?php **\n\n** $company = “Acme Auto”; **\n\n** myFunction($company);\
    \ **\n\n**?> **\n\n**What is a user function?**\n\nIt’s a block of reusable code\
    \ that you create within your program. It is \n\nsometimes called a subroutine.\
    \ \n\n \n\nPHP instructions within the user function can be called or executed\
    \ \n\nfrom the main program more then once. This makes redundant tasks \n\nsimpler.\
    \ \n\n \n\nYou can also pass variable information into a subroutine to make the\
    \ \n\nuser function more powerful and flexible."
  merge: -1
  pgno: 86
- img_proc: true
  md: " \n\nUSER FUNCTIONS \n\n**85**\n\n**<h3>End</h3> **\n\n**</body> **\n\n**</html>\
    \ **\n\n \n\n**2.** \n\nSave the page as **functionsimple.php** in the **PHPSCRIPTS\
    \ **\n\nfolder. \n\n \n\nHere's what the relevant lines in this script do: \n\n\
    • **function myFunction($company) { **\n\n**function** is the PHP command to create\
    \ a function.\n\n**myFunction **is the name of the user function. \n\n \n\nThe\
    \ variable **$company** is passed into the user function \n\ninside of the parentheses\
    \ ( ).\n\n• **{ **\n\nMarks the beginning of the user function.\n\n• ** print(\"\
    <p>Welcome to $company</p>\"); **\n\nThis is what the user function does. It prints\
    \ the text \n\n“**Welcome to Acme Auto!**” to the browser window. This \n\nis\
    \ because the variable **$company** is given the value of \n\n“Acme Auto.”\n\n\
    • **} **\n\nMarks the end of the user function."
  merge: -1
