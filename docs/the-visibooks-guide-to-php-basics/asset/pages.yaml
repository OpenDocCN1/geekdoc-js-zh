    \ **$var1** and **$var2** together, then \n\nassigns the sum to a variable called\
    \ **$answer**. \n\n \n\nSince **$var1** is 5, and **$var2** is 2, **$answer**\
    \ has a value \n\nof 7.\n\n \n\n**3.** \n\nUpload **add.php** to the **PHPSCRIPTS**\
    \ directory in your Web site."
