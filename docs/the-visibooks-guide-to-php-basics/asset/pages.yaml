  md: " \n\n \n\nLEARNING THE BASICS \n\n**26 **\n\n**Insert comments**\n\n \n\n**1.**\
    \ \n\nUsing Notepad, create a new script with this code: \n\n \n\n**<?php **\n\
    \n**// A comment line to explain the code **\n\n**\\# Another example of a comment\
    \ line **\n\n**/\\* **\n\n**A block of words can be commented this way. **\n\n\
    **These comments do not affect the way **\n\n**the script works. **\n\n**\\*/\
    \ **\n\n**print \"Welcome to ACME AUTO!\"; // A comment on **\n\n**the same line\
    \ as your code. **\n\n**?> **\n\n![](img/30f0fa1c6cb552c908695ea335a9f268_28_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_28_1.png)"
  merge: -1
  pgno: 28
- img_proc: true
  md: " \n\nLEARNING THE BASICS \n\n**27**\n\n**Tip:** If you’re writing a comment\
    \ in a script and it wraps to the \n\nnext line, it needs a new # character in\
    \ front. \n\n \n\nIncorrect: \n\n \n\n**\\# The second line lets a browser **\n\
