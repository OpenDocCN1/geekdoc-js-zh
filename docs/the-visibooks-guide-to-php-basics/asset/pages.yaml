  md: " \n\n \n\nLOGIC & LOOPS \n\n**102 **\n\nHere's what the relevant lines in this\
    \ script do: \n\n \n\n• **if ($password == $GoodPassword){ **\n\nCompares the\
    \ password word typed in the text box on \n\n**ifelse.html** to the password assigned\
    \ to the variable \n\n**$GoodPassword**. \n\n \n\nIf they’re the same, then the\
    \ code between the curly \n\nbraces is executed.\n\n• **else { **\n\nIf the two\
