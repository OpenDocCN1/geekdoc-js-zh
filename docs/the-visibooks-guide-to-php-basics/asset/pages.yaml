  md: " \n\n \n\nWORKING WITH FILES \n\n**132 **\n\n**4.** \n\nSave the file as **textwriter.php**\
    \ in the **PHPSCRIPTS** folder. \n\n \n\nHere's what the relevant lines in this\
    \ script do: \n\n \n\n• **$myfile = fopen ($filename, 'w') or **\n\n**die(\"Can\
    \ not open file\"); **\n\nThe form in **textwriter.html** has a hidden text field\
    \ \n\nnamed filename. Here the script requests the value \n\nassigned to it in\
    \ the form—**textthought.txt**, then assigns \n\nthat value to the variable **$myfile**.\
    \ \n\n \n\nThe ‘**w**’ means the text file **textthough.txt** (**$myfile**) is\
    \ \n\nopened for writing. \n\n \n\nIf the file does not exist, a new one will\
    \ be created. If the \n\nfile already exists, it will overwrite the existing file.\
    \ \n\n \n\nIf there is a problem with the file opening, the process \n\nwill stop\
    \ (or die) and display the message “Can not open \n\nfile”. \n\n• **$outputFile\
    \ = “$comments\\\\n\\\\n”; **\n\nThis line adds two “new line” characters (**\\\
    \\n\\\\n**) to the \n\nend of the comments submitted through the form on \n\n\
    **textwriter.html**. \n\n \n\nAny new data added to the file **textthought.txt**\
    \ starts on \n\na new paragraph. This new data is then assigned to the \n\nvariable\
    \ **$outputFile**."
