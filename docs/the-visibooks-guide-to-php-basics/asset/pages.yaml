    \ **\n\n**print \"<b>Acme Password verified!</b>\\\\n\"; **\n\n**}** \n\n \n\n\
    To this: \n\n \n\n**if ($password == $GoodPassword){ **\n\n**print \"<b>Acme Password\
    \ verified!</b>\\\\n\"; **\n\n**} **\n\n**else { **\n\n**print \"<b>Acme Password\
    \ incorrect.</b>\\\\n\"; **\n\n**}**\n\n \n\n**4.** \n\nSave the script as **ifelse.php**\
    \ in the **PHPSCRIPTS** folder."
