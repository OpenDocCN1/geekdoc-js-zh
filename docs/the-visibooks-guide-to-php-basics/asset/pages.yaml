  md: " \n\n \n\nWORKING WITH VARIABLES \n\n**40 **\n\n \n\n**What’s a variable? **\n\
    \n \n\nA variable is a placeholder for information within a PHP script. Data is\
    \ \n\nstored and retrieved using variables. \n\n \n\nIn PHP, a variable is can\
    \ be a single piece of information, or a list of \n\nthings store in an array.\
    \ They always start with a dollar sign, and are \n\ncase sensitive. \n\n \n\n\
    Example: **$myName** \n\n \n\nVariables are essential to all programming, and\
    \ very useful. For \n\nexample, you can use a variable to easily change “brown\
    \ eyes” to \n\n“blue eyes” in a PHP script: \n\n \n\n**$eyecolor=“brown”; **\n\
    \n \n\nAs the old song says, “Don’t it make my $eyecolor eyes blue…”"
  merge: -1
  pgno: 42
- img_proc: true
  md: " \n\nWORKING WITH VARIABLES \n\n**41**\n\n**Employ single variables **\n\n\
    \ \n\nAssign a number to a variable \n\n \n\n**1.** \n\nOpen Notepad, then create\
    \ a new script with this code: \n\n**<?php **\n\n**$cars\\_on\\_lot = 100; **\n\
    \n**print \"<p>Welcome to <b>ACME AUTO!</b></p>\"; **\n\n**print \"<p>Which one\
    \ of our $cars\\_on\\_lot cars is **\n\n**right for you?</p>\"; **\n\n**?> **\n\
    \n![](img/30f0fa1c6cb552c908695ea335a9f268_43_0.png)![](img/30f0fa1c6cb552c908695ea335a9f268_43_1.png)![](img/30f0fa1c6cb552c908695ea335a9f268_43_2.png)"
  merge: -1
  pgno: 43
