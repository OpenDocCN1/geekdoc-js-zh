  md: " \n\nWORKING WITH VARIABLES \n\n**43**\n\n• **$cars\\_on\\_lot = 100; **\n\n\
    **$cars\\_on\\_lot** is the variable. Variables start with a **$**. \n\n \n\n\
    The number 100 is assigned to the variable. The number \n\nis easy to change—that’s\
    \ why it’s called a variable.\n\n• **print \"<p>Welcome to <b>ACME **\n\n**AUTO!</b></p>\"\
    ; **\n\n**print \"<p>Which one of our $cars\\_on\\_lot **\n\n**cars is right for\
    \ you?</p>\"; **\n\nThese lines should also look familiar. They’re HTML \n\ncode\
    \ like we’ve used before, but with a difference: \n\n**$cars\\_on\\_lot**. \n\n\
    \ \n\nThis variable tells the Web browser to get the number \n\nspecified (100)\
    \ and insert it here. \n\n \n\nYou’ll see how it works in the following steps."
