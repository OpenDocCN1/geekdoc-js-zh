- img_proc: true
  md: " \n\n \n\nWORKING WITH FILES \n\n**138 **\n\n• **while (!feof($myfile)){ **\n\
    \nThis **while** loop loops through the **$myfile** variable \n\none line at a\
    \ time until it gets to the end-of-file. \n\n \n\n**!feof** means “not the end\
    \ of the file.” \n\n \n\nSo, this line means: “Keep looping through each line\
    \ in \n\nthe **$myfile** file while it has “not” (**!**) reached “the end \n\n\
    of the file” (**feof**). \n\n \n\nWhen the program reaches the end of the file,\
    \ it will exit \n\nthe loop.\n\n• **$line = fgets($myfile,5000); **\n\n \n\nThis\
    \ “gets” the first line of the **$myfile** file and assigns \n\nit to the variable\
    \ **$line**. \n\n \n\nEach time the while loop comes back to this command, it\
    \ \n\nwill get the next line, and then the next line, and so on. \n\n \n\nThe\
    \ **5000** means that each line can be up to 5000 \n\ncharacters long. \n\n \n\
    \n• **print \"$line <p>\"; **\n\n \n\nPrints the text in each line of **textthought.txt**\
    \ in a new \n\nparagraph as the script loops through them. \n\n \n\n• **} **\n\
    \nThis is the end marker for the while loop."
