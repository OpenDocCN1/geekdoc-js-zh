  \n`ng new hello-mobile --mobile`\n\n步骤 3：提供移动应用服务：\n\n`cd hello-mobile`\n\n`ng serve`\n\
  \n步骤 4：导航至 `localhost:4200`（通常会自动打开）。\n\n当你使用 `--mobile` 标志调用 `ng` 时，`ng` 工具会创建一个包含以下内容的\
