  \ 包含 TypeScript 编译器的各种编译器相关属性及其值。请注意，`outDir` 属性指定 `dist/out-tsc` 子目录作为生成文件的位置。`sourceMap`\
  \ 为 true，这意味着在转译过程中会生成源映射。`src` 子目录包含更多配置文件，你可以随时查看其内容。关于 Angular 应用程序中配置相关文件的简要介绍到此结束。\n\
  \n## 什么是 AOT？\n\nAngular AOT 是预编译的缩写，它涉及在应用程序加载到浏览器之前编译一次应用程序，从而缩短加载时间。\n\n正如你已经看到的，Angular\
  \ 在浏览器中通过即时编译（JIT）加载应用程序。然而，JIT 编译会带来运行时性能损失，并且应用程序更大，因为它包含了 Angular 编译器和许多不必要的库代码。JIT\
  \ 编译可以在运行时发现组件-模板绑定错误，而 AOT 可以提前发现模板错误，并通过构建时编译提高性能。\n\n\n\n\n此外，AOT 与 Angular 命令行界面（CLI）集成良好。例如，以下命令在创建\
  \ Angular 应用的生产构建时使用了 AOT 编译：\n\n```\nng build --prod --aot\n```\n\n## AOT 的优势\n\
  \nAOT 的部分优势如下：\n\n![Image](img/greybox.jpg)更快的渲染\n\n![Image](img/greybox.jpg)更少的异步请求\n\
  \n![Image](img/greybox.jpg)更小的 Angular 框架下载体积\n\n![Image](img/greybox.jpg)更早检测模板错误\n\
  \n![Image](img/greybox.jpg)更好的安全性\n\n![Image](img/greybox.jpg)更好的性能\n\n![Image](img/greybox.jpg)模板的编译时错误报告\n\
  \n![Image](img/greybox.jpg)更小的应用体积\n\n![Image](img/greybox.jpg)移除死代码（摇树优化）\n\n直到最近，`ng`\
  \ 模板中的错误会在运行时（有时静默）失败，这使得调试 Angular 模板变得困难。现在 AOT 会在编译时报告模板错误，但目前 AOT 只能与 Webpack\
  \ 2 一起使用。这种情况未来可能会有所改变。\n\n## AOT 配置\n\n在 Angular 应用中启用 AOT 有两种方式：使用 `@ngtools/webpack`（下文讨论）或使用\
  \ `ngc` 工具（在另一节中讨论）。第一种方式提供更细粒度的控制，而第二种方式更简单且配置更少。请记住一个重要点：Angular AOT 仅适用于可静态分析的代码和元数据。\n\
  \n阅读以下章节后，你将能更好地决定哪种技术最适合你的需求。你可以参考以下内容获取更多信息：\n\n*[`github.com/UltimateAngular/aot-loader`](https://github.com/UltimateAngular/aot-loader)*\n\
  \n### 设置 @ngtools/webpack\n\n安装 `@ngtools/webpack` 并将其保存为开发依赖，如下所示：\n\n```\nnpm\
  \ install -D @ngtools/webpack\n```\n\n接下来，将以下代码添加到配置文件 `webpack.config.js` 中（Webpack\
  \ 将在后面讨论）：\n\n![Image](img/pg273.jpg)\n\n`@ngtools/webpack` 加载器与 `AotPlugin` 配合使用以启用\
  \ AoT 编译。请注意，Angular CLI 并非在所有场景下都支持自定义配置。\n\n### 使用 ngc 编译器\n\n`ngc` 编译器是 `tsc`\
  \ 的替代品，配置方式类似。\n\n然而，`ngc` 在缺乏必要上下文的情况下会尝试内联层叠样式表（CSS）。例如，`index.css` 中的 `@import\
  \ basscss-basic` 语句会导致错误，因为没有指示 `basscss-basic` 位于 `node_modules` 中。\n\n另一方面，`@ngtools/webpack`\
  \ 提供了 `AotPlugin` 和一个 Webpack 加载器，该加载器与其他加载器/插件共享上下文。因此，当 `@ngtools/webpack` 调用\
  \ `ngc` 时，`ngc` 可以从其他插件（如 `postcss-import`）获取信息，以编译诸如 `@import 'basscss-basic'`\
  \ 之类的内容。\n\n### tsconfig-aot.json 文件\n\n`ngc` 工具依赖于 `tsconfig-aot.json`，它是 `tsconfig.json`\
  \ 的一个变体。文件 `tsconfig-aot.json` 包含面向 AOT 的设置，示例如下：\n\n![Image](img/pg274.jpg)\n\n\
  注意加粗的两行，它们指定了 `app.module.ts` 和 `main.ts`，这两个文件都在 `src/app` 子目录中。\n\n### 编译步骤\n\n\
  现在，打开命令 shell 并安装这些 npm 依赖：\n\n```\nnpm install @angular/compiler-cli @angular/platform-server\
  \ --save\n```\n\n接下来，调用 `node_modules/@angular/compiler-cli` 中的 `ngc` 编译器，通过以下命令创建\
  \ AOT 相关文件：\n\n```\n./node_modules/.bin/ngc –p .\n```\n\n上述命令完成后，你将看到一个 `aot` 目录，其内容如下：\n\
  \n```\n./aot\n./aot/src\n./aot/src/app\n./aot/src/app/app.component.ngfactory.ts\n\
  ./aot/src/app/app.component.ngsummary.json\n./aot/src/app/app.module.ngfactory.ts\n\
  ./aot/src/app/app.module.ngsummary.json\n```\n\n简而言之，组件“工厂”文件通过将原始类文件与组件中模板的 JavaScript\
  \ 表示相结合来创建组件实例。此外，生成的工厂会引用原始组件类。\n\nAOT 和动态 Angular 组件的示例可在此处找到：\n\n*[`angularjs.blogspot.co.il/2017/01/understanding-aot-and-dynamic-components.html`](http://angularjs.blogspot.co.il/2017/01/understanding-aot-and-dynamic-components.html)*\n\
  \n### AOT、CLI 和 Angular Universal 的状态\n\nAngular CLI 不支持 Angular Universal。有一个单独的\
  \ Angular CLI 分支支持 Universal，但该分支不支持 AOT。不过，Angular Universal 的一些关键部分将被放入 Angular\
  \ 核心中。\n\n### 摇树优化与 Rollup 工具\n\nAOT 编译将 Angular 应用的更大一部分转换为 JavaScript。下一步是调用所谓的摇树优化，它涉及移除冗余代码，从而减小\
  \ Angular 应用的体积。请记住，摇树优化仅适用于 JavaScript 代码。\n\nAngular 提供了一个名为 `rollup` 的摇树优化工具，它执行静态代码分析以创建一个代码包，该包排除了所有从未被导入的导出代码。`rollup`\
  \ 工具仅适用于包含 `import` 和 `export` 语句的 ES2015 模块。\n\n现在使用以下命令安装 `rollup` 依赖：\n\n```\n\
  npm install rollup rollup-plugin-node-resolve rollup-plugin-commonjs rollup-plugin-uglify\
  \ --save-dev\n```\n\n### rollup-config.js 文件\n\n在项目根目录中创建配置文件 `rollup-config.js`，内容如下：\n\
  \n![Image](img/pg276a.jpg)\n\n上述文件中的 `entry` 属性指定 `app/main.js` 作为应用入口点，`dest` 属性使\
  \ `rollup` 在 `dist` 子目录中创建文件 `build.js`。\n\n### 调用 rollup 工具\n\n通过调用以下命令从命令行调用 `rollup`\
  \ 工具：\n\n```\nnode_modules/.bin/rollup -c rollup-config.js\n```\n\n上述命令创建文件 `dist/build.js`，你可以在\
  \ HTML 页面 `index.html` 中引用它，如下所示：\n\n![Image](img/pg276b.jpg)\n\n![Image](img/pg277.jpg)\n\
  \n现在使用以下命令启动 Angular 应用：\n\n```\nnpm run lite\n```\n\n片刻之后，你将看到一个新的浏览器会话，如果一切正常，你应该能看到\
  \ Angular 应用。\n\n### 减小 Angular 应用的体积\n\n使用 Angular AOT 结合摇树优化可以减小应用代码体积，并使代码执行更快。最简单的选项是使用以下命令为生产环境构建项目：\n\
  \n```\nng build --prod\n```\n\n然而，你可以通过以下命令进一步减小文件体积：\n\n```\nng build --prod --aot\n\
  ```\n\n上述命令会移除未使用的代码和 Angular 编译器。\n\n有关 AOT 编译器的更多信息可在此处找到：\n\n*[`angular.io/docs/ts/latest/cookbook/aot-compiler.html`](https://angular.io/docs/ts/latest/cookbook/aot-compiler.html)*\n\
  \n### 减小包体积\n\n本节描述了一个测量 Angular 应用中包体积的简单过程。第一步是执行以下安装：\n\n```\nsudo npm install\
  \ -g source-map-explorer\n```\n\n接下来，使用源映射构建应用，如下所示：\n\n```\nng build --prod -sm\n\
  ```\n\n![Image](img/pg278a.jpg)\n\n***图 10.1*** Angular 应用中代码大小的映射图。\n\n第三步，检查其中一个包，示例如下（你的应用中的名称会不同）：\n\
  \n```\nsource-map-explorer dist/main.d357e5f7797d112767e6.bundle.js\n```\n\n上述命令将启动一个\
  \ Chrome 浏览器会话，并显示总代码大小，以及该总大小中各个模块所占的百分比。\n\n图 10.1 显示了在 Chrome 浏览器中执行上述命令后的输出。\n\
  \n## Angular 变更检测\n\n\n\n\nAngular 中的变更检测基于 zone.js，它会监控所有异步事件。每个组件都有自己的变更检测器。变更检测（默认情况下）会检查任何模板表达式的值是否发生了变化。变更方向是单向的，并且只进行一次遍历，从组件树的顶部到底部。请记住，变更只能来自组件。\n\
  \n你也可以通过编程方式指定变更检测策略，如下面的代码片段所示：\n\n![Image](img/pg278b.jpg)\n\n上述代码块包含 `changeDetection`\
  \ 属性，其值为 `ChangeDetectionStrategy.OnPush`，这意味着只有当组件中的数据被修改时，组件才会重新渲染。\n\n正如你所知，Angular\
  \ 应用是一个由 Angular 组件组成的层次化树，每个组件都有自己的变更检测器。每当一个组件被修改时，整个树都会触发一次变更检测遍历。实际上，Angular\
  \ 在扫描变更时会从上到下遍历树。\n\n`ChangeDetectionStrategy.Default` 是 `changeDetection` 的默认值，而\
  \ `ChangeDetectionStrategy.OnPush` 是另一个可能的值。根据 Angular 文档（遗憾的是，文档中似乎没有关于“水合”的解释）：\n\
  \n> OnPush 意味着在 hydration 期间，变更检测器的模式将被设置为 `CheckOnce`。\n> \n> Default 意味着在 hydration\
  \ 期间，变更检测器的模式将被设置为 `CheckAlways`。\n\n上述引用来自以下 Angular 文档：\n\n[`angular.io/docs/ts/latest/api/core/index/ChangeDetectionStrategy-enum.html#!#OnPush-anchor`](https://angular.io/docs/ts/latest/api/core/index/ChangeDetectionStrategy-enum.html)\n\
  \n然而，如果 Angular 应用使用了不可变对象或 Observable，则可以修改变更检测系统以提高性能。此外，你可以通过指定仅在其某个输入值发生变化时才执行检查，来修改任何组件的变更检测器行为。回想一下，输入值是组件从应用其他地方接收到的属性。\n\
  \n考虑以下代码示例：\n\n![Image](img/pg279.jpg)\n\n![Image](img/pg280a.jpg)\n\n要使变更检测在 person\
  \ 发生变化（一个输入属性）时发生，请将其 `changeDetection` 属性设置为 `ChangeDetectionStrategy.OnPush`，如下所示：\n\
  \n![Image](img/pg280b.jpg)\n\n## zone.js 库\n\nAngular 在以下情况下使用 zone.js 库进行变更检测：\n\
  \n- ![Image](img/greybox.jpg) 当文档对象模型（DOM）事件发生时（例如 click、change 等）\n- ![Image](img/greybox.jpg)\
  \ 当 HTTP 请求被解析时\n- ![Image](img/greybox.jpg) 当定时器被触发时（`setTimeout` 或 `setInterval`）\n\
  \n然而，在某些情况下 zone.js 无法检测到变更，例如：\n\n- ![Image](img/greybox.jpg) 使用异步运行的第三方库\n- ![Image](img/greybox.jpg)\
  \ 不可变数据\n- ![Image](img/greybox.jpg) Observable\n\n## 什么是 Webpack？\n\n尽管本章不包含依赖\
  \ Webpack 的项目，但它是 Angular 应用的事实标准工具，其主页位于：\n\n[`webpack.github.io/`](https://webpack.github.io/)\n\
  \nWebpack 是一个模块打包器，这意味着 Webpack 接收带有依赖关系的模块，并生成代表这些模块的静态资源。Webpack 被认为是 Web 应用开发中的最新“热门”工具，并且在许多方面，Webpack\
  \ 取代了 Gulp 的功能（但后者仍然相关且有用）。幸运的是，你还可以将 Webpack 与 grunt、gulp、bower 和 karma 结合使用（参见在线文档中的示例）。\n\
  \nWebpack 的目标如下：\n\n- ![Image](img/greybox.jpg) 将依赖树拆分为按需加载的块。\n- ![Image](img/greybox.jpg)\
  \ 保持初始加载时间较短。\n- ![Image](img/greybox.jpg) 每个静态资源都应该能够成为一个模块。\n- ![Image](img/greybox.jpg)\
  \ 将第三方库作为模块集成。\n- ![Image](img/greybox.jpg) 自定义模块打包器的几乎每个部分。\n- ![Image](img/greybox.jpg)\
  \ 适用于大型项目。\n\nWebpack 的口头禅很简单：一切都是加载器。\n\n此外，你可以将 AOT 与 Webpack 结合使用。一个用于 AOT 的\
  \ Webpack 配置文件示例如下：\n\n[`github.com/blacksonic/angular2-aot-webpack/blob/master/webpack.aot.config.js`](https://github.com/blacksonic/angular2-aot-webpack/blob/master/webpack.aot.config.js)\n\
  \n## 使用 Webpack\n\nWebpack 二进制可执行文件会在你启动 webpack 的目录中搜索名为 `webpack.config.js` 的默认配置文件。此配置文件包含各种属性，因此你无需从命令行指定它们。Webpack\
  \ 支持许多选项，你可以通过调用以下命令查看完整列表：\n\n`webpack --help`\n\n尽管 webpack 2 版本于 2016 年底发布，但你仍然会遇到使用\
  \ webpack 1.x 版本的教程。\n\n## 启动 Webpack 的简单示例\n\n确保你已经安装了 npm，然后使用以下命令安装 Webpack：\n\
  \n`npm install webpack -g`\n\n接下来，使用以下命令安装 Webpack 开发服务器：\n\n`npm install webpack-dev-server\
  \ -g`\n\n完成上述步骤后，导航到一个空目录并创建两个文件：\n\n`entry.js`\n\n`index.html`\n\n`entry.js` 的内容如下：\n\
  \n```\ndocument.write(\"It works.\");\n```\n\n`index.html` 的内容如下：\n\n![Image](img/pg282a.jpg)\n\
  \n现在调用以下命令：\n\n`webpack ./entry.js bundle.js`\n\n上述命令完成后，你将在同一目录中找到 `bundle.js`\
  \ 文件。\n\n## 一个简单的 webpack.config.js 文件\n\n清单 10.3 显示了 `webpack.config.js` 的内容，这是一个示例\
  \ Webpack 配置文件。\n\n### 清单 10.3: webpack.config.js\n\n![Image](img/pg282b.jpg)\n\n\
  清单 10.3 包含有关生成的输出文件名称（此处为 `bundle.js`）以及 CSS 样式表加载器的信息。\n\n## 热模块替换（HMR）与 Webpack\n\
  \n热模块替换指的是文件的动态重新编译。你可以从命令行调用 HMR，或者在 `webpack.config.js` 中指定 HMR 属性。\n\n具体来说，有三种从命令行调用\
  \ HMR 的方法。\n\n第一种方法涉及 `webpack-dev-server` 工具（你可以通过 npm 全局安装），示例如下：\n\n```\n//选项\
  \ #1：WDS 已全局安装\nwebpack-dev-server --inline --hot\n```\n\n第二种方法涉及将 `webpack-dev-server`\
  \ 作为依赖项安装在 `package.json` 中，如下所示：\n\n```\n//选项 #2：WDS 作为开发依赖项安装\nnode_modules/webpack-dev-server/bin/webpack-dev-server.js\
  \ --inline –hot\n```\n\n第三种方法涉及将 `webpack-dev-server` 指定为 `package.json` 中 `scripts`\
  \ 元素的目标之一，如下所示：\n\n![Image](img/pg283.jpg)\n\n选择最适合你需求的选项。\n\n## 通过修改后的 webpack.config.js\
  \ 实现 AOT\n\n除了上一节中介绍的三种使用 AOT 的方法之外，你还可以修改 `webpack.config.js` 以支持 AOT，如清单 10.4\
  \ 所示。\n\n### 清单 10.4: webpack.config.js\n\n![Image](img/pg284.jpg)\n\n清单 10.4 通过添加\
  \ `plugins` 部分和 `loaders` 部分中的额外加载器，扩展了清单 10.3 的内容。在对 `webpack.config.js` 进行上述修改后，你可以使用前面章节中描述的选项之一从命令行调用\
  \ HMR。\n\n由于 Angular 4.1.0 支持 TypeScript 2.1 及以上版本，请阅读以下关于 AOT、TypeScript 和 Webpack\
  \ 的注意事项：\n\n[`stackoverflow.com/questions/43276853/angular-4-aot-with-webpack/43282448`](http://stackoverflow.com/questions/43276853/angular-4-aot-with-webpack/43282448)\n\
  \n\n\n\n\n## Angular Material\n\nAngular Material 包含用于 Angular 应用的 Material Design\
