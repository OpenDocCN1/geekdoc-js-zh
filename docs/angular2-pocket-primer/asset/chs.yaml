  \n图 8.5 显示了在 Android 设备上启动清单 8.8 中的代码后的输出。\n\n## React Native 与 NativeScript：高级比较\n\
  \n尽管这两个工具包都能让你开发原生移动应用，但它们确实存在差异。首先，NativeScript 将 Angular 的高级功能与 NativeScript 中的低级\
  \ UI 元素相结合，以创建具有一致外观和感觉的跨平台应用。另一方面，React Native 使开发人员能够编写与平台无关的代码，同时访问特定于平台的 UI\
  \ 层。其次，React 试图为业务逻辑提供抽象，而 NativeScript 则提供更“统一”的开发体验。\n\n第三，React Native 通过“热重载”提供快速部署和执行，这在某些情况下可能优于\
  \ NativeScript。第四，将 Angular 与 NativeScript 结合使用需要“拥抱”Angular 架构，而 React 则不需要。NativeScript\
  \ 和 Angular 也是独立的开源项目，因此存在另一个依赖关系，而 React Native 在 React 框架中处理跨平台功能。\n\n![Image](img/pg230.jpg)\n\
  \n***图 8.5*** Android 设备上 Angular 和 React Native 应用的图形。\n\n这些要点将帮助你结合项目需求权衡各种利弊，从而确定最适合你需求的环境。\n\
  \n## Angular 移动工具包\n\nAngular 移动工具包（AMT）使你能够创建渐进式 Web 应用，其主页位于：\n\n[`mobile.angular.io/`](https://mobile.angular.io/)\n\
