  \n# 第 1 章：Angular 快速入门\n\n本章快速介绍如何使用 Angular 开发 Web 应用程序。在介绍 Angular 的一些高级特性之后，你将能够快速理解后续章节中讨论的许多代码示例（但有些代码示例更为复杂）。同时，请记住，你需要投入额外的时间和精力才能更深入地理解\
  \ Angular。\n\n注意\n\n*本书中的 Angular 代码示例基于 2017 年 3 月发布的 Angular 生产代码。*\n\n另一个重要的考虑因素是你的学习风格：你可能更倾向于在深入第一个代码示例之前，先阅读有关\
  \ Angular 应用程序“脚手架”的详细信息。不过，完全可以先略读本章的引言部分，然后快速“深入”本章的第一个 Angular 示例代码，之后再回头复习引言部分。\n\
  \n本章第一部分讨论 Angular 的设计目标以及一些新特性，例如组件、模块和单向数据绑定。本章第二部分讨论 Angular 命令行界面（CLI），这是一个用于生成\
  \ Angular 应用程序的命令行工具。\n\n注意\n\n*本书中的 Angular 项目基于 `ng`（即 Angular CLI）的 1.0.0 版本，用于创建\
  \ Angular 4 应用程序。*\n\n在阅读本章之前，有几点需要牢记。首先，本书提供了许多 Angular 应用程序的示例，因此关于 Angular 概念、设计目标和架构的细节比你在\
  \ 500 页的书籍中可能找到的要“轻量”一些。不过，你可以在 Victor Savkin（以及其他人士）的在线文章中找到有用的信息。\n\n其次，你可以使用\
  \ ECMA5、ES6 和 TypeScript 创建 Angular 应用程序。但主要建议是使用 ES6 或 TypeScript 开发 Angular 应用程序；事实上，本书中的所有代码示例都使用\
  \ TypeScript，这使得转译过程（在“幕后”执行）变得简单直接。第三，不需要有 Angular 的使用经验，但有一些知识显然会有所帮助。\n\n注意\n\
  \n![Image](img/disc.jpg)\n\n*当你从随附光盘复制项目目录时，如果 `node_modules` 目录不存在，请复制已软链接到该项目目录内的顶层\
  \ `node_modules` 目录（大多数示例应用程序都是这种情况）。*\n\n## 支持的 Angular 版本：工作原理\n\n你可能已经知道，Angular\
  \ 的发展速度很快，从 2017 年 3 月 Angular 4 的生产版本开始，一直延伸到计划于 2018 年 9 月发布的 Angular 7。\n\n每个即将发布的版本（从\
  \ 2018 年的 Angular 6 开始）可能只支持前两个版本的 Angular。例如，Angular 6 将支持 Angular 4 和 Angular\
  \ 5，而 Angular 7 将支持 Angular 6 和 Angular 5（但不支持 Angular 4）。\n\n\n\n\n此外，Angular 的命名约定中存在一种“二元性”：即将发布的\
  \ Angular 版本会指定版本号，但*不带*版本号的 Angular 是 Angular 2 及更高版本的官方名称（而 AngularJS 是 1.x 版本的官方名称）。\n\
  \nAngular 核心团队在此开发过程中的另一个重要目标是尽量减少破坏性变更，并确保此类变更对升级到新版本 Angular 的影响最小。\n\n注意\n\n\
  *尽管未来生产代码版本有版本号，但 Angular 2 及更高版本在官方上被称为 Angular。*\n\n## 跳过 Angular 3 的原因\n\nAngular\
  \ 核心库位于 `github.com/angular/angular`。它们都采用相同的版本控制方式，但作为不同的基于 Node 的包分发：\n\n`@angular/core`\
  \ v2.3.0\n\n`@angular/compiler` v2.3.0\n\n`@angular/compiler-cli` v2.3.0\n\n`@angular/http`\
  \ v2.3.0\n\n`@angular/router` `v3.3.0`\n\n如你所见，路由包的版本号与其他包的版本号不同。使版本号相同的最简单方法是使用版本\
  \ 4 而不是版本 3，这反过来导致了跳过 Angular 3。\n\n## TypeScript 版本\n\n将 TypeScript 依赖从 v1.8 升级到\
  \ v2.1（或更高版本）确实涉及破坏性变更。幸运的是，从 Angular 2 升级到 Angular 4（及更高版本）并不需要大规模重写，只需更改几个核心库。\n\
  \nAngular 团队开发了一个自动升级流程，他们使用的工具也可能对公众开放（可能在 2017 年期间）。\n\n注意\n\n*本书中的 Angular 2\
  \ 应用程序使用 TypeScript 编译器的 2.2.2 版本。*\n\n## 从 Angular 2 迁移到 Angular\n\n如果你使用的是最新版本的\
  \ Angular，则本节为可选内容，因为最新版本自动包含了 Angular 2.0 之后 Angular 2.x 中引入的所有功能。\n\n下面简要概述了几个\
  \ Angular 2.x 版本，因为新功能已添加到 Angular 2 中（但它们不属于 Angular 2.0 的一部分）。此外，TypeScript 的版本也已更改。\n\
  \n首先，Angular 2.2 于 2016 年 11 月发布；该版本提供了提前编译（AOT）兼容性，并在第 10 章中进行了更详细的讨论。接下来，Google\
  \ 于 2016 年 12 月发布了 Angular 2.3，其中包含用于与集成开发环境（IDE）集成的 Angular 语言服务。该服务提供了类型补全和 Angular\
  \ 模板的错误检查。此外，该服务还提供了组件的对象继承功能。\n\n关于 TypeScript 版本：Angular 2 使用 TypeScript 1.8，而\
  \ Angular 4 的初始生产版本使用 TypeScript 2.1.6（或更高版本），这涉及一些相对较小的破坏性变更。\n\n## 学习 Angular\
  \ 应用程序需要掌握的内容\n\n本书中的 Angular 应用程序使用 TypeScript 编写，但你还需要掌握以下技术的基本技能：\n\n![图片](img/greybox.jpg)\
  \ NodeJS (npm)\n\n![图片](img/greybox.jpg) ECMA5、ES6 和 TypeScript\n\n![图片](img/greybox.jpg)\
  \ Webpack 2.2（或更高版本）\n\n以下小节包含有关上述列表中项目的更多信息。\n\n### NodeJS\n\n本书中的代码示例需要 node v6.x.x（或更高版本）和\
  \ npm 4.x.x（或更高版本）。在终端中使用以下命令确定你机器上的版本：\n\n```\nnode -v\nnpm -v\n```\n\n如有必要，请访问\
  \ NodeJS 主页下载更新版本的 node 可执行文件。如果你没有使用过 Node，请阅读在线教程以了解以下命令的用途：\n\n![图片](img/greybox.jpg)\
  \ `npm install –g webpack`\n\n![图片](img/greybox.jpg) `npm install webpack@latest\
  \ –save`\n\n![图片](img/greybox.jpg) `npm start`\n\n### ECMA5、ES6 和 TypeScript\n\n\
  你需要学习 ES6 和 TypeScript 的基本概念，它们各自的主页包含大量信息可帮助你入门。特别是，学习箭头函数、类、模板字符串和模块加载器。其他有用的功能包括展开和剩余运算符（你将在第\
  \ 7 章中遇到它们）。正如你将在后续章节中看到的，Angular 应用程序严重依赖动态模板，这些模板经常涉及变量插值（通过“{{}}”语法）。\n\n如果你计划使用\
  \ TypeScript 编写 Angular 应用程序，了解 ES6 会很有帮助。幸运的是，以下网站提供了一个在线“游乐场”以及 TypeScript 的文档和代码示例链接：\n\
  \n*[`www.typescriptlang.org/play/`](https://www.typescriptlang.org/play/)*\n\n熟悉\
  \ ECMA5 也很有用：例如，`filter()` 函数很方便（例如，与 Angular 管道一起使用），而 `map()` 函数在将 Observable\
  \ 与 Angular 应用程序中的 HTTP 请求结合使用时可能很有用。其他函数，如 `merge()` 和 `flatten()`，也可能有用，你可以根据需要学习它们以及其他函数。\n\
  \n你还需要对 Promise 和 Observable 有基本的了解。使用 TypeScript 的 Angular 更倾向于 Observable，本书中的代码示例也是如此，但你也会遇到使用\
  \ Promise 的在线代码示例。请自行查阅有关 ECMA5、Promise 和 Observable 的在线资源。\n\nAngular 利用了 ES6 的特性，如组件和类，以及\
  \ TypeScript 的特性，如注解及其类型系统。TypeScript 优于 ECMA5 或 ES6，因为 (1) TypeScript 支持 ES6 的所有特性，以及\
  \ (2) TypeScript 提供了一个可选的类型推断系统，可以帮助你捕获许多错误。\n\n至于脚手架工具，Webpack 已成为 Angular 应用程序的事实标准。Webpack（版本\
  \ 2.2 或更高版本）已成为 Angular 应用程序的事实标准脚手架工具，其主页位于：\n\n*[`webpack.github.io/`](https://webpack.github.io/)*\n\
  \n如果你没有使用过 Webpack，请了解 2.x 版本的功能（并跳过 1.x 版本）。\n\n一些其他相关细节：你可以在 Electron、Webstorm\
  \ 和 Visual Studio Code 中开发 Angular 应用程序。请查看它们各自的网站以了解定价和功能支持。最后，以下链接包含开发 Angular\
  \ 应用程序的样式指南以及“最佳实践”：\n\n*[`github.com/mgechev/angular2-style-guide`](https://github.com/mgechev/angular2-style-guide)*\n\
  \n快速浏览上述链接以熟悉其内容，然后你将在阅读本书各章节时知道何时阅读相关部分。\n\n## Angular 高层概览\n\nAngular 被设计为一个平台，支持浏览器中的\
  \ Angular 应用程序、服务器端渲染以及移动设备上的 Angular 应用程序。第一个方面——在浏览器中渲染 Angular 应用程序——是本书各章节的重点。第二个方面——Angular\
  \ Universal（即服务器端渲染）——在第 6 章中简要讨论。本质上，服务器端渲染在服务器上而不是浏览器中创建 Angular 应用程序的“第一视图”。由于浏览器无需构建此视图，它们可以更快地渲染视图，从而缩短感知加载时间。第三个方面——移动设备上的\
  \ Angular 应用程序——在第 8 章中讨论。\n\n\n\n\nAngular 也采用基于组件的架构，组件以树状结构组织（Angular 模块也是如此，你将在第\
  \ 5 章中看到）。Angular 还支持强大的技术，你将学会熟练编写 Angular 应用程序。创建 Angular 应用程序最简单的方法是使用 Angular\
  \ CLI（稍后详细讨论），它可以从命令行生成 Angular 应用程序所需的文件。\n\n以下是 Angular 的一些重要特性：\n\n![Image](img/greybox.jpg)单向数据绑定\n\
  \n![Image](img/greybox.jpg)“摇树优化”\n\n![Image](img/greybox.jpg)变更检测\n\n![Image](img/greybox.jpg)样式封装\n\
  \n前两个特性将在下面简要讨论，第三个特性在第 2 章中讨论，其中的代码示例会比本章更容易理解。\n\n由于 Angular 4 的生产版本于 2017 年 3\
  \ 月发布，并且后续发布了额外的“小版本”（例如 4.1），因此后续版本可能会导致本书中的某些代码示例发生破坏性变更。因此，你可能需要修改受影响代码示例中的应用程序编程接口（API）调用，或更改某些导入语句。你可以随时查阅关于\
  \ Angular 连续版本之间变更的在线文档：\n\n[`angular.io/`](https://angular.io/)\n\n## Angular 中的单向数据绑定\n\
  \nAngular 默认提供声明式单向绑定（但如果你愿意，也可以切换到双向绑定）。单向绑定作为一种单向变更传播，相比双向数据绑定有两个优势：（1）消除了 Angular\
  \ 1.x 中的 `$digest` 循环和观察者，从而提高了性能；（2）降低了代码复杂度。Angular 还支持有状态、响应式和不可变模型。随着你使用 Angular\
  \ 应用程序，上述声明的含义将变得更加清晰。\n\nAngular 应用程序涉及定义一个顶层（“根”）模块，该模块引用一个 `Component`，而该 `Component`\
  \ 又指定一个 HTML 元素（通过必需的 `selector` 属性），该元素是 `Component` 的“父”元素。`Component` 的定义涉及一个所谓的“装饰器”，其中包含\
  \ `selector` 属性和 `template` 属性（或 `templateUrl` 属性）。\n\n`template` 属性包含 HTML 和自定义标记的混合（可以放在单独的文件中，然后通过\
  \ `templateUrl` 属性引用）。此外，`Component` 之后紧跟着一个 TypeScript 类定义，其中包含与 `template` 属性中出现的组件相关变量相关联的“支持代码”。在你使用一些\
  \ Angular 应用程序之后，这些细节将变得更加清晰。\n\n**注意**\n\n*`templateUrl` 属性和 `styleUrls` 属性引用文件，而\
  \ `template` 属性和 `styles` 属性引用内联代码。*\n\n## 摇树优化 Angular 应用程序\n\n摇树优化指的是从 Angular\
  \ 项目中“修剪”不必要的文件（其他技术也有类似概念），就像摇晃树上的枯枝一样，以创建 Angular 应用程序的生产版本。这个生产版本可以显著更小，因此加载时间更短。Webpack\
  \ 2 和 Angular AOT 支持摇树优化，你将在第 10 章中看到一个使用 AOT 的示例。\n\n## Angular 应用程序的高层视图\n\nAngular\
  \ 应用程序由内置组件和自定义组件（后者由你编写）组合而成，每个组件通常定义在单独的 TypeScript 文件（扩展名为 `.ts`）中。每个组件通过 `import`\
  \ 语句指定其依赖项。Angular 中有多种类型的依赖项，例如指令和管道（本章稍后讨论）。\n\n*自定义指令*本质上是一个定义组件的 TypeScript\
  \ 文件的内容。因此，自定义指令由 `import` 语句、`@Component` 装饰器和一个导出的 TypeScript 类组成。\n\nAngular\
  \ 提供了*内置指令*，例如 `*ngIf`（用于“if”逻辑）和 `*ngFor`（用于循环）。这两个指令也被称为*结构型指令*，因为它们会修改 HTML 页面的内容。\n\
  \nAngular *内置管道*包括日期和数字项（`currency`、`decimal`、`number` 和 `percent`），而*自定义管道*由你定义。\n\
  \n此外，TypeScript 类使用*装饰器*（一种内置函数），它为类、其成员或其方法参数提供元数据。装饰器很容易识别，因为它们总是带有 `@` 前缀。Angular\
  \ 提供了许多内置装饰器，例如 `@Component()` 和 `@NgModule`。\n\n以上是对 Angular 特性的高层介绍。本章的下一部分将介绍\
  \ Angular CLI，本书将全程使用它来创建 Angular 应用程序。\n\n## Angular CLI\n\n在 Angular 的测试版发布期间，开发人员使用手动流程创建应用程序，或者使用“入门”或“种子”项目（通常在\
  \ GitHub 上提供）。然而，这些项目在 Angular 新版本发布后往往过时。因此，本书中的代码示例基于 Angular CLI，它是 Google 官方的\
  \ Angular 应用程序生成器。\n\nAngular CLI 是一个名为 `ng` 的命令行工具，它可以生成完整的 Angular 应用程序，包括测试相关代码，并且（默认情况下）还会启动\
  \ `npm install` 以在 `node_modules` 中安装所需的文件。Angular CLI 的主页位于：\n\n[`cli.angular.io`](https://cli.angular.io)\n\
  \nAngular CLI 生成一个名为 `package.json` 的配置文件，用于管理必要的依赖项及其版本号。生成 Angular 应用程序后，导航到 `node_modules`\
  \ 子目录，你将看到各种 Angular 子目录，其中包含 Angular 应用程序所需的文件。\n\nAngular CLI 是使用“入门”项目或手动创建项目的更优替代方案，其功能集将随着时间的推移不断改进。\n\
  \n## 安装 Angular CLI\n\n你需要执行几个步骤来安装 Angular CLI。首先使用以下命令卸载之前的 CLI（如果你安装了旧版本）：\n\n\
  ```\nsudo npm uninstall -g angular-cli\nnpm cache clean\n```\n\n接下来，使用以下命令安装新的 CLI（注意新的包名）：\n\
  \n```\n[sudo] npm install -g @angular/cli\n```\n\n按如下方式创建一个名为 `hello-world` 的新项目，使用\
  \ Angular 4：\n\n```\nng new hello-world\n```\n\nAngular CLI 提供了除自定义代码之外的所有内容，并且安装所需的时间明显长于入门应用程序。其次，Angular\
  \ CLI 允许你生成新的组件、路由器等，这些在入门应用程序中也是可能的。第三，Angular CLI 完全基于 TypeScript，生成的应用程序包括 JavaScript\
  \ 对象表示法（JSON）文件 `tsconfig.json`、`tslint.json`、`typedoc.json` 和 `typings.json`。另一方面，入门应用程序倾向于使用\
  \ Webpack，这涉及配置文件 `webpack.config.js`，其中包含 Angular 应用程序的信息。\n\n## Angular CLI 的特性\n\
  \n`ng` 可执行文件支持各种选项，以下是一些命令行调用示例：\n\n```\nng new app-root-name\nng build\nng deploy\n\
  ng e2e\nng generate <component-type>\nng generate route\nng generate ...\nng lint\n\
  ng serve\nng test\nng x18n\n```\n\n\n\n\n\n`ng g` 选项等同于 `ng generate` 选项，它允许你生成\
  \ Angular 自定义组件、Angular 管道（在第 5 章中讨论）等。`ng x18n` 选项从源代码中提取 i18n 消息。下一节将展示如何在应用程序中生成\
  \ Angular 自定义组件的示例，以及自动为你生成的文件内容。\n\n组件的默认前缀是 `app`（例如 `<app-root></app-root>`），但你可以通过以下调用指定不同的前缀：\n\
  \n`ng new app-root-name –prefix abc`\n\n注意\n\n*通过 `ng` 创建的 Angular 应用程序始终包含 `src/app`\
  \ 目录。*\n\n关于升级 Angular CLI 的信息位于：\n\n[`github.com/angular/angular-cli`](https://github.com/angular/angular-cli)\n\
  \nAngular CLI 的文档位于：\n\n[`cli.angular.io`](http://cli.angular.io)\n\n现在你已经了解了 `ng`\
  \ 工具的一些特性，让我们创建第一个 Angular 应用程序，这是下一节的主题。\n\n## 通过 Angular CLI 创建“Hello World”应用程序\n\
  \n导航到一个方便的目录，并使用以下命令创建一个名为 `myapp` 的 Angular 应用程序：\n\n`ng new myapp`\n\n注意\n\n*早期版本的\
  \ `ng` 需要 `--ng4` 开关。*\n\n上述命令完成后，进入新项目目录：\n\n`cd myapp`\n\n使用以下命令启动 Angular 应用程序：\n\
  \n`ng serve`\n\n上述命令会自动在以下 URL 启动浏览器会话：\n\n`localhost:4200`\n\n你将在屏幕上看到以下内容：\n\n\
  **app works!**\n\n上述字符串在文件 `app/app.component.ts` 的 `template` 属性中指定。\n\n注意\n\n\
  *`template` 属性（或 `templateUrl` 属性）是你放置自定义代码的地方，这些代码将生成 HTML 输出，然后插入到 `index.html`\
  \ 网页的 `<app-root>` 元素中。*\n\n## Angular 应用程序的结构\n\n当你调用 `ng` 命令创建 Angular 应用程序时，以下是自动创建的文件：\n\
  \n- `angular-cli.json`\n- `dist/`（详细信息省略）\n- `e2e/`（详细信息省略）\n- `karma.conf.js`\n\
  - `node_modules`\n- `package.json`\n- `protractor.conf.js`\n- `README.md`\n- `src/app/app.component.css`\n\
  - `src/app/app.component.html`\n- `src/app/app.component.spec.ts`\n- `src/app/app.component.ts`\n\
  - `src/app/app.module.ts`\n- `src/environments/environment.prod.ts`\n- `src/environments/environment.ts`\n\
  - `src/favicon.ico`\n- `src/index.html`\n- `src/main.ts`\n- `src/polyfills.ts`\n\
  - `src/styles.css`\n- `src/test.ts`\n- `src/tsconfig.json`\n- `tslint.json`\n\n\
  `dist` 子目录包含编译后的项目和 JavaScript 包，而 `e2e` 子目录包含端到端测试的文件（调用命令 `ng test` 来执行测试）。\n\n\
  文件 `app.component.ts`（以粗体显示）包含本书代码示例中的自定义 TypeScript 代码，并且（在较小程度上）你可能需要更新文件 `app.module.ts`。当你需要包含\
  \ JavaScript `<script>` 元素（用于 jQuery、Bootstrap 等）时，你将修改 `index.html`，而 `styles.css`\
  \ 文件用于全局层叠样式表（CSS）样式规则（如果有的话）。\n\n最后，文件 `angular-cli.json`、`package.json` 和 `tslint.json`\
  \ 分别是 `ng`、`npm` 和 `tslint` 的配置文件。请注意，当你调用命令 `ng lint` 时，它会调用 `tslint` 工具，而该工具又依赖于文件\
  \ `tslint.json`。\n\n## Angular 项目文件的命名约定\n\n`app` 子目录中的文件有一个命名约定，由三部分组成：功能类型、它是组件还是模块，以及指示代码类型的后缀。例如，TypeScript\
  \ 文件 `app.component.ts` 包含应用程序的组件相关代码，而 TypeScript 文件 `app.module.ts` 包含模块相关代码。此外，文件\
  \ `app.component.css` 包含组件的 CSS 选择器，`app.component.html` 包含同一组件的 HTML 标记。\n\n本章的下一部分包含两个小节：第一部分讨论\
  \ `index.html` 和各种 JavaScript 配置相关文件的内容，第二部分讨论包含在 `app` 子目录中的应用程序相关文件。唉，阅读这些部分是一个“漫长的过程”，虽然建议你阅读它们，但也可以随意浏览本节，并在启动第一个\
  \ Angular 应用程序后再回来阅读。两种阅读方式各有利弊，因此请以最适合你学习风格的方式继续学习这些材料。\n\n现在让我们看看 HTML 网页 `index.html`\
  \ 的内容，它是我们 Angular 应用程序的主网页。\n\n## index.html 网页\n\n清单 1.1 显示了通过 `ng` 工具从命令行生成的新\
  \ Angular 应用程序的 `index.html` 内容。\n\n### 清单 1.1：index.html\n\n![Image](img/pg13.jpg)\n\
  \n清单 1.1 非常简洁：只有自定义的 `<app-root>` 元素（你将在 `app/app.component.ts` 的 `selector` 属性中看到它）表明这个网页是\
  \ Angular 应用程序的一部分。\n\n注意\n\n*JavaScript 依赖项在项目“构建”期间由 Angular CLI 动态插入到 `index.html`\
  \ 中。*\n\n在我们深入探讨 Angular 应用程序中的 TypeScript 文件之前，让我们先快速了解一下 `import` 语句在 Angular\
  \ 应用程序中是如何工作的。如果你已经熟悉 Angular 中的 `import` 和 `export` 语句，可以跳过下一节。\n\n## 导出和导入包与类（可选）\n\
  \n请记住以下几点：在 TypeScript 文件中导入的每个 TypeScript 类都必须在定义该类的 TypeScript 文件中导出。你将看到许多 `import`\
  \ 和 `export` 语句的示例；事实上，本书中的每个 Angular 应用程序都是如此。\n\n有两种常见的 `import` 语句类型：一种涉及从 Angular\
  \ 模块导入包，另一种涉及导入自定义类（由你编写）。以下是两种类型的语法：\n\n```\nimport {some-package-name}   from\
  \ 'some-angular-module';\nimport {some-class }         from 'my-custom-class';\n\
  ```\n\n以下是两种 `import` 语句的示例：\n\n```\nimport { NgModule }     from '@angular/core';\n\
  import {EmpComponent}   from './emp.component';\n```\n\n在上面的代码片段中，`NgModule` 包是从位于\
  \ `node_modules` 目录中的 `@angular/core` 模块导入的。`EmpComponent` 类是在 TypeScript 文件 `emp.component.ts`\
  \ 中定义和导出的自定义类。\n\n在第二个 `import` 语句中，当从 TypeScript 文件导入自定义类时，需要 `\"./\"` 前缀，并且注意省略了\
  \ `\".ts\"` 后缀。\n\n接下来的几节将讨论 `src/app` 子目录中的三个与应用程序相关的 TypeScript 文件：`main.ts`、`app.component.ts`\
  \ 和 `app.module.ts`。这些文件分别是此 Angular 应用程序的引导文件、主模块和主组件类。\n\n以下是这三个文件用途的简要说明：Angular\
  \ 使用 `main.ts` 作为初始“入口点”来引导 Angular 模块 `AppModule`（在 `app.module.ts` 中定义），该模块又包含组件\
  \ `AppComponent`（在 `app.component.ts` 中定义），以及你导入到 `AppModule` 中的任何其他自定义组件（和模块）。\n\
  \n此外，这三个文件位于 `src/app` 子目录中，这也是你放置自定义组件（和模块）的地方，或者放在 `src/app` 的某个合适的子目录中，其名称基于其功能。\n\
  \n## 引导文件 main.ts\n\n清单 1.2 显示了 `src` 子目录（不是 `src/app` 子目录）中 `main.ts` 的内容，它导入并引导顶层\
  \ Angular 模块 `AppModule`。\n\n### 清单 1.2：main.ts\n\n![Image](img/pg14.jpg)\n\n![Image](img/pg15a.jpg)\n\
  \n\n\n\n\n清单 1.2 中的第一行代码是一个导入语句，用于后续代码中的条件逻辑。第二个导入语句在许多 Angular 代码示例中都会看到，它对于在桌面和笔记本电脑上启动\
  \ Angular 应用是必需的。\n\n第三个导入语句涉及 Angular 应用的顶层模块，该模块又包含此 Angular 模块中的所有自定义组件和服务。第四个导入语句包含与环境相关的信息，用于接下来的条件逻辑片段：如果当前应用处于生产模式，则执行`enableProdMode()`函数。\n\
  \n最后一行代码是实际的引导过程，涉及在浏览器中渲染`app.component.ts`中的代码。\n\n## 顶层模块文件 `app.module.ts`\n\
  \n清单 1.3 显示了`app.module.ts`（位于`src/app`子目录）的内容，该文件导出了顶层 Angular 模块`AppModule`。\n\
  \n`清单 1.3: app.module.ts`\n\n![Image](img/pg15b.jpg)\n\n清单 1.3 包含两个导入语句，分别导入`BrowserModule`、`NgModule`、`FormsModule`、`HttpModule`和`BrowserModule`，所有这些都属于\
  \ Angular。最后一个导入语句导入类`AppComponent`，这是清单 1.4 中所示的顶层组件。\n\n**注意：** Angular 依赖项始终包含`@`符号，而自定义依赖项则指定到\
  \ TypeScript 文件的相对路径。\n\n接下来，`@NgModule`装饰器包含一个具有多个属性的对象（将在下一节讨论）。这些属性为类`AppModule`指定元数据，该类在最后一行代码中导出。`AppModule`中的元数据涉及以下属性，每个属性都是一个值数组：`imports`、`providers`、`declarations`、`exports`和`bootstrap`。\n\
  \n在清单 1.3 中，数组属性`declarations`、`imports`和`bootstrap`非空，而`providers`属性是一个空数组。Angular\
  \ 需要这些元数据来引导`AppComponent`中的代码，而`AppComponent`又包含渲染内容（例如`<h1>`元素）和渲染位置（例如`index.html`中的`app-root`元素）的详细信息。\n\
  \n现在让我们仔细看看`@NgModule`装饰器中每个基于数组的属性的用途，以理解它们的作用。\n\n### `@NgModule`中的元数据\n\n`imports`数组包含此应用所需的`模块`，例如`BrowserModule`，以及一些可选模块（例如`FormModule`）。`imports`数组不具有传递性：如果模块\
  \ A 导入模块 B，模块 B 导入模块 C，则模块 C 不会导入到模块 A 中。\n\n接下来，`providers`数组是一个针对此 Angular 应用的全局服务数组。服务是提供后台功能的东西，在应用中不可见。`providers`数组包含通过`@Injectable`装饰器（稍后讨论）定义的所有可注入服务。\n\
  \n`declarations`数组由此应用所需的`组件`组成，例如`AppComponent`，以及自定义组件、指令和管道，所有这些都具有（模块级别的）私有作用域。具体来说，私有作用域意味着`declarations`数组中的所有内容只能通过在同一模块中声明的其他组件、指令和管道访问。\n\
  \n请记住，`declarations`属性中列出的组件*必须*从其各自的组件相关文件中导出。例如，`AppComponent`从`app.component.ts`（稍后显示）中导出，这使得你可以在`app.module.ts`中导入它，并在`declarations`属性中指定它。\n\
  \n`exports`数组包含应用中其他组件所需的组件、指令和管道。\n\n`schemas`数组包含值`CUSTOM_ELEMENTS_SCHEMA`，它提供了应用“外部”的附加信息；请参见第\
  \ 2 章中的示例和第 5 章中的示例。\n\n最后，`bootstrap`数组包含当 Angular 应用在浏览器中启动时将“引导”的组件名称。\n\n**注意：**\
  \ 通常，建议通过`bootstrap`属性仅引导一个组件。\n\n## 顶层组件文件 `app.component.ts`\n\n清单 1.4 显示了`app.component.ts`（位于`src/app`子目录）的内容，该文件导出了顶层\
  \ Angular 组件`AppComponent`。\n\n`清单 1.4: app.component.ts`\n\n![Image](img/pg17.jpg)\n\
  \n清单 1.4 以导入 Angular `@Component`装饰器的语句开头，用于为类`AppComponent`定义元数据。元数据至少涉及两个属性：`selector`和`template`。除了与路由相关的组件外，这两个属性在自定义组件中都是必需的。在此示例中，`selector`属性指定了你在\
  \ HTML 网页`index.html`中看到的自定义元素`app-root`（你可以更改它）。\n\n`template`属性指定将插入到自定义元素`app-root`中的\
  \ HTML 标记。在此示例中，标记是一个包含一些文本的`<h1>`元素。清单 1.4 中的最后一行代码是一个导出语句，使`AppComponent`类可用于在其他\
  \ TypeScript 文件中导入，例如清单 1.3 中所示的`app.module.ts`。\n\n**注意：** 本书中所有 Angular 项目的文件`main.ts`、`app.component.ts`和`app.module.ts`都位于`src/app`子目录中。\n\
  \n通过导航到根目录并在 shell 中输入以下命令来启动你的 Angular 应用：\n\n`ng serve`\n\n下一节将讨论 Angular 模板语法，你将在`template`属性中的自定义代码中使用它。\n\
  \n## 一个简单的 Angular 模板\n\n如清单 1.4 所示，文件`app.component.ts`包含一个`template`属性，其中包含一个`<h1>`元素，该元素包含一行文本。但是，当你将所有内容放在一对匹配的反引号（“``”）内时，Angular\
  \ 允许你指定多行文本。这种语法（在 ES6 中引入）在 Angular 应用中大量使用，并且方便地支持变量插值。\n\n清单 1.5 显示了一个新的`app.component.ts`文件的内容，该文件比清单\
  \ 1.4 有更多内容。此代码示例说明了如何在`template`属性中使用插值。\n\n`清单 1.5: app.component.ts`\n\n![Image](img/pg18.jpg)\n\
  \n![Image](img/pg19a.jpg)\n\n清单 1.5 包含两个`<h3>`元素；第一个是简单的文本字符串，第二个包含“花括号”，用于引用在类`AppComponent`中定义的数据值。Angular\
  \ 使用一种称为*插值*的方法，结合字面对象`emp`的元素，然后将花括号内的变量替换为它们在第二个`<h3>`元素中的实际值。\n\n## 在 Angular\
  \ 中使用组件\n\nAngular 应用是一个嵌套组件的树，其中顶层组件就是应用本身。组件定义了用户界面（UI）元素、屏幕和路由。通常，通过将每个自定义组件放在一个\
  \ TypeScript 文件中，然后将该 TypeScript 文件导入到包含顶层组件的“主”文件（通常命名为`app.component.ts`）中来组织\
  \ Angular 应用。\n\n### 组件中的元数据\n\nAngular 组件通常是`@Component`装饰器和类定义的组合，类定义可以选择包含构造函数。下面是一个简单的示例：\n\
  \n![Image](img/pg19b.jpg)\n\n上面的`@Component`装饰器包含几个属性，其中一些是必需的，另一些是可选的。让我们看看前面代码块中的两种类型。\n\
  \n`selector`属性是必需的，它指定作为 Angular 应用“根”的 HTML 元素（无论是现有元素还是自定义元素）。\n\n\n\n\n\n接下来，`template`\
  \ 属性（或 `templateUrl` 属性）是必需的，它包含标记、插值变量和 TypeScript 代码的混合。一个重要的细节：当 `template` 属性的定义跨越多行时，需要使用反引号。\n\
  \n`directives` 属性是一个可选属性，用于指定被视为嵌套组件的组件数组。在此示例中，`directives` 属性指定了组件 `EmpComponent`，该组件也在代码块开头附近通过\
  \ `import` 语句导入。请注意，`import` 语句不包含 `@` 符号，这意味着 `EmpComponent` 是在文件 `emp/emp.component.ts`\
  \ 中定义的自定义组件。\n\n## Angular 中的有状态组件与无状态组件\n\n从高层次来看，*有状态*组件会保留与同一 Angular 应用程序的其他部分相关的信息。另一方面，无状态组件不维护应用程序状态，也不请求或获取数据：它们通过属性绑定从另一个组件（例如其父组件）接收数据。\n\
  \n本书中的代码示例通常是有状态组件、无状态组件以及有时是“值对象”的组合，这些值对象是模拟不同实体（例如员工、客户、学生等）的自定义类的实例。\n\n你将在第\
  \ 2 章中看到一个表示组件的示例。同时，这里有一篇深入探讨有状态和无状态组件的好文章：\n\n*[`toddmotto.com/stateful-stateless-components#stateful`](https://toddmotto.com/stateful-stateless-components#stateful)*\n\
  \n## 使用 Angular CLI 生成组件\n\n之前你已经看到了 `ng` 实用程序的一些选项，本节将讨论如何使用 `generate` 选项。此外，这里还有一些不言自明的示例：\n\
  \n```\nng generate component mycomp\nng generate directive mydir\nng generate pipe\
  \ mypipe\nng generate route myroute\nng generate service mycomp\n```\n\n以下命令与上面列表中的对应命令等效，只是它们使用了短别名：\n\
  \n```\nng g c mycomp\nng g d mydir\nng g p mypipe\nng g r myroute\nng g s mycomp\n\
  ```\n\n上述命令会创建新文件，这些文件位于 `src/app` 的新子目录中。例如，命令 `ng g c mycomp` 会创建子目录 `src/app/mycomp`\
  \ 并用文件填充它（稍后讨论）。\n\n如果你不想创建新的子目录，请使用 `--flat` 选项，新文件将放置在 `src/app` 中，而不是 `src/app/mycomp`\
  \ 中。\n\n现在，让我们在 Angular 应用程序中调用以下命令来生成一个学生组件：\n\n```\nng g c student\n```\n\n上述命令完成后，你将看到以下输出：\n\
  \n```\ninstalling component\ncreate src/app/student/student.component.css\ncreate\
  \ src/app/student/student.component.html\ncreate src/app/student/student.component.spec.ts\n\
  create src/app/student/student.component.ts\n```\n\n如你所见，上述输出显示了四个新文件：一个 CSS 文件、一个\
  \ HTML 文件、一个 TypeScript 测试文件和一个组件定义文件。\n\n### 清单 1.6：student.component.ts\n\n![Image](img/pg21.jpg)\n\
  \n![Image](img/pg22a.jpg)\n\n> **注意**  \n> *当你使用 `ng` 创建自定义组件时，`ng` 会在 `app.module.ts`\
  \ 中插入一条 `import` 语句，并更新 `declarations` 属性，添加对新自定义组件的引用。*\n\n为了方便起见，当你从命令行生成组件时，`ng`\
  \ 还会生成一个测试文件。具体来说，清单 1.7 显示了名为 `student.component.spec.ts` 的测试文件的内容。\n\n### 清单 1.7：student.component.spec.ts\n\
  \n![Image](img/pg22b.jpg)\n\n清单 1.7 包含 `import` 语句，以使各种组件可用于此测试文件，包括清单 1.6 中定义的\
  \ `StudentComponent`。\n\n`student.component.html` 的自动生成内容如下所示：\n\n```\n<p>\nstudent\
  \ works!\n</p>\n```\n\n如你所见，文件 `student.component.html` 非常简约，你可以自由地在此文件中添加与应用程序相关的\
  \ HTML 标记。\n\n请注意，文件 `student.component.css` 当前为空；添加你需要的任何 CSS 选择器以进行样式设置。\n\n另一个细节：`ng`\
  \ 允许你在现有组件内部创建组件。例如，以下命令在 `student` 组件内部创建一个 `profile` 组件：\n\n```\nng g component\
  \ student/profile\n```\n\n你必须在 `student` 子目录中调用上述命令，否则你将看到以下错误消息：\n\n```\nYou have\
  \ to be inside an angular-cli project in order to use the generate command.\n```\n\
  \n准备就绪后，使用以下命令创建 Angular 应用程序的生产构建：\n\n```\nng build --prod\n```\n\n请记住，你可以通过 AOT\
  \ 显著减小 Angular 应用程序的大小，这在第 10 章中有更详细的讨论。\n\n## Angular 中的语法、属性和特性\n\nAngular 引入了方括号\
  \ `[]` 表示法用于属性和特性，以及圆括号 `()` 表示法用于处理事件的函数。这种新语法实际上是有效的 HTML5 语法。以下是指定属性和函数的代码片段示例：\n\
  \n```\n<foo [bar]= \"x+1\" (baz)=\"doSomething()\">Hello World</foo>\n```\n\n以下是指定属性和函数的示例：\n\
  \n```\n<button [disabled]=\"!inputIsValid\" (click)=\"authenticate()\" >Login </button>\n\
  ```\n\n以下是带有自定义元素的数据相关元素的示例：\n\n```\n<my-chart [data]=\"myData\" (drag)=\"handleDrag()\"\
  ></my-chart>\n```\n\n上述代码片段中的新语法消除了许多内置指令的需求，你将在本章后面看到这一点。\n\n## Angular 中的特性与属性\n\
  \n请记住以下区别：属性可以指定复杂模型，而特性只能指定字符串。例如，在 Angular 1.x 中，你可以编写以下代码：\n\n```\n<my-directive\
  \ foo=\"{{something}}\"></my-directive>\n```\n\nAngular 中对应的代码（不需要插值）如下所示：\n\n```\n\
  <my-directive [foo]=\"something\"></my-directive>\n```\n\nAngular 的新架构提供了改进的性能，并提供了开发“更干净”的\
  \ Angular 应用程序的机制，这些应用程序可以更快地开发、增强和维护。\n\n下一节包含一个涉及 `<button>` 元素的代码示例，这可能是 HTML\
  \ 网页中最常见的 UI 控件之一。\n\n## 在 Angular 中显示按钮\n\n在经历了本章中的所有代码清单并阅读了关于它们用途的解释之后，你可能会想知道在\
  \ Angular 中进行应用程序开发是否会是一个漫长而繁琐的过程。幸运的是，你可以用少量代码创建许多基本应用程序。当你准备创建中型应用程序时，你可以利用 Angular\
  \ 应用程序基于组件的特性，逐步添加新组件（和模块）。\n\n作为一个简单的示例，本节中的文件 `app.component.ts` 包含了此 Angular\
  \ 应用程序的所有自定义代码。`ng` 实用程序用于生成此代码示例中的所有文件，你无需手动修改其他文件。\n\n![Image](img/disc.jpg)\n\
  \n将配套光盘中的 `ButtonClick` 目录复制到方便的位置。清单 1.8 显示了 `app.component.ts` 的内容，它演示了如何渲染一个\
  \ `<button>` 元素，并通过显示用户在当前会话中点击 `<button>` 元素的次数来响应点击事件。\n\n### 清单 1.8：app.component.ts\n\
  \n![Image](img/pg25.jpg)\n\n\n\n\n\n清单 1.8 以一条导入语句开头，该语句出现在`app.component.ts`中，你将在本书的每个代码示例中看到它。这条语句让你能够访问`Component`装饰器，它会将元数据注入到名为`AppComponent`的\
  \ TypeScript 类中。当 TypeScript 编译器将 TypeScript 代码转译（转换）为 ECMA5 时，这些元数据也会被包含在内，以便在现代浏览器中运行\
  \ Angular 应用。\n\n必需的`selector`属性指定了值`app-root`，这是一个自定义元素（在`index.html`中列出），作为“容器”，`template`元素的内容将在其中渲染。\n\
  \n在这个示例中，`template`属性包含一个响应点击事件的`<button>`元素，以及一个`<p>`元素，当用户点击`<button>`元素时，其内容会更新。如你所见，`(click)`的值是`clickMe()`函数（定义在`AppComponent`类中），该函数会递增并显示`clickCount`变量的值。\n\
  \n此外，`styles`属性为`<button>`元素指定了`red`值。`styles`属性是组件样式的一个示例，这意味着这些样式仅适用于该组件的模板。\n\
  \n![图片](img/pg26.jpg)\n\n**图 1.1** 一个响应点击事件的`<button>`元素。\n\n实际上，Angular 通过生成唯一的属性来局部应用\
  \ CSS，而不是全局应用，当你点击 Chrome Web Inspector 中的 Elements 选项卡时，这些属性是可见的。\n\n关于 Angular\
  \ 中组件样式的更多详细信息，请参见：\n\n*[`angular.io/docs/ts/latest/guide/component-styles.html`](https://angular.io/docs/ts/latest/guide/component-styles.html)*\n\
  \n清单 1.8 的下一部分是`AppComponent`类的定义，其中包含`clickCount`变量，该变量在`clickMe()`函数中递增。\n\n导航到该应用的`src`子目录，并调用以下命令：\n\
  \n```\nng serve\n```\n\n图 1.1 显示了该 Angular 应用的浏览器输出。你还可以看到文件`main.bundle.js`，其中包含经过“树摇”压缩的代码，这在第\
  \ 10 章中有更详细的讨论。\n\n## 元素与属性\n\n在清单 1.8 中，`selector`属性匹配了 HTML 页面`index.html`中的元素`<app-root></app-root>`：\n\
  \n```\nselector: 'app-root'\n```\n\n然而，你也可以指定一个属性而不是元素。例如，假设`index.html`包含以下元素：\n\
  \n```\n<div app-root>加载中...</div>\n```\n\n你还需要按如下方式修改`selector`属性：\n\n```\nselector:\
  \ '[app-root]'\n```\n\n## 总结\n\n本章首先介绍了 Angular 的版本号、Angular 的必备条件，以及 Angular 及其基于组件的分层结构概述。\n\
  \n接着，你学习了 Angular CLI 工具`ng`，以及如何使用`ng`工具创建一个 Angular“Hello world”应用。你还了解了 TypeScript\
  \ 文件`main.ts`、`app.component.ts`和`app.module.ts`，它们包含 Angular 应用的 TypeScript 代码。然后，你学习了将\
  \ Angular 应用中的代码转译为 ECMA5 的原因。最后，你看到了一个 Angular 应用的代码，它显示了一个响应点击事件的`<button>`元素。\n\
  \n# 第 2 章\n\n## UI 控件与用户输入\n\n本章包含使用各种用户界面（UI）控件的 Angular 应用，以及处理用户交互（如用户输入和鼠标事件）的示例。请记住，本章中的代码示例使用标准\
  \ HTML 语法来渲染 UI 控件，而不是使用 Angular 特有的功能。此外，本章最后一节提供了提供 Angular UI 组件的工具包链接。\n\n本章第一部分简要讨论了在任何\
  \ Angular 应用中都可以使用的基本调试技术。该部分使用第 1 章中与按钮相关的代码示例来说明如何在 Angular 中使用调试器。\n\n本章第二部分展示了如何管理项目列表，包括显示、添加和删除列表中的项目。请注意，Angular\
  \ 中的表单将推迟到第 4 章讨论，届时你还会学习 Controls 和 ControlGroups。\n\n![图片](img/disc.jpg)\n\n本章第三部分包含两个显示用户名列表的示例：第一个示例检索存储在\
  \ JavaScript 数组中的字符串形式的用户名，第二个示例检索存储在 JavaScript 数组中的对象字面量形式的用户名。第三部分更进一步：你将学习如何定义一个包含用户相关信息（也存储在\
  \ JavaScript 数组中）的自定义用户组件。\n\n**注意**\n\n*当你从配套光盘复制项目目录时，如果`node_modules`目录不存在，请复制该目录内已软链接的顶层`node_modules`目录（大多数示例应用都是这种情况）。*\n\
  \n现在，让我们学习如何在 Angular 中执行一些基本调试。\n\n## 在控制台中调试 Angular 代码\n\n本节展示如何使用`ng.probe()`来“单步执行”Angular\
  \ 应用的执行过程，并查找（或更新）变量的值。本节中的信息将帮助你检测应用中的简单错误。如果你感兴趣，还有一个更强大的调试器 Augury（一个 Chrome\
  \ 扩展），在第 10 章中会讨论。\n\n现在，在 Chrome 中启动第 1 章（清单 1.8）中的 Angular 应用 ButtonClick，并执行以下步骤：\n\
  \n1. 打开 Chrome Web Inspector。\n2. 点击 Elements 选项卡。\n3. 点击`<app-root>`元素。\n\n现在点击\
  \ Console 选项卡，并在控制台中输入以下代码片段：\n\n```\nng.probe($0)\n```\n\n你将看到一个类似如下的`DebugElement`：\n\
  \n```\nDebugElement {nativeNode: app-root, parent: null, listeners: Array[0], providerTokens:\
  \ Array[1], properties: Map…}\n```\n\n展开上述对象并仔细查看其元素。多次点击按钮（屏幕顶部），然后使用以下代码片段获取组件类实例的引用：\n\
  \n```\nng.probe($0).componentInstance\n```\n\n上述代码片段显示以下元素：\n\n```\nUserInput {clickCount:\
  \ 3}\n```\n\n使用以下代码片段修改`clickCount`的值：\n\n```\nng.probe($0).componentInstance.clickCount\
  \ = 7\n```\n\n上述代码片段将`clickCount`的值改为 7，诚然，在这个代码示例中这没有任何实际用途。但在其他包含各种输入字段和小部件的 Angular\
  \ 应用中，此功能可能对测试有用。\n\n以下代码片段提供与组件相关的信息：\n\n```\nng.probe($0).injector._depProvider.componentView\n\
  ```\n\n上述代码片段显示以下输出：\n\n```\nAppView {proto: AppProtoView, renderer: DebugDomRenderer,\
  \ viewManager: AppViewManager_, projectableNodes: null, containerAppElement: AppElement…}\n\
  ```\n\n下一个代码片段提供更多信息：\n\n```\nng.probe($0).injector._depProvider.componentView.changeDetector\n\
  ```\n\n```\nChangeDetector_UserInput_0 {id: \"UserInput_0\"\", numberOfPropertyProtoRecords:\
  \ 2, bindingTargets: Array[1], directiveIndices: Array[0], strategy: 5…}\n```\n\n\
  通过展开并检查其内容来试验可用的元素。此外，以下链接包含有关 Chrome 开发工具的有用信息：\n\n[`developers.google.com/web/tools/chrome-devtools/javascript`](https://developers.google.com/web/tools/chrome-devtools/javascript)\n\
  \n现在，让我们创建一个简单的 Angular 应用，展示如何通过`ngFor`指令显示字符串列表，如下一节所述。\n\n## Angular 中的 ngFor\
