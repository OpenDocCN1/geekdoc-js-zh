  \ 使用简单服务器的 HTTP GET 请求\n\n本节向你展示如何使用命令行工具`json-server`，它可以提供基于 JSON 的数据。该程序执行一个非常简单的服务器功能：客户端可以发出\
  \ GET 请求以从服务器检索 JSON 数据。此外，在启动`json-server`的控制台中输入一个简单命令，即可将内存中的数据保存到文件中。\n\n尽管`json-server`不能执行包含\
  \ Express 和 MongoDB 的基于 Node 的应用的功能，但它是一个方便的程序，可以帮助你学习 Angular 应用如何与文件服务器交互。\n\n\
  你需要执行以下步骤：\n\n![Image](img/greybox.jpg)步骤 1：安装`json-server`。\n\n![Image](img/greybox.jpg)步骤\
