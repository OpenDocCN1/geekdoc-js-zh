  \n清单 9.8 包含一个标准导入语句，随后是两个额外的导入语句，分别用于`Observable`和`interval()`方法。接下来，一个模板属性包含名为`mytimer`的`Observable`，其输出通过管道传递给\
  \ async 操作符。\n\n`AppComponent`类包含`mytimer`的定义，该定时器每 1500 毫秒（本例中为`pause`的值）发出一个整数。\n\
  \n至此，您可以轻松地通过合并本章中的 Observables 来修改此代码示例。\n\n## RxJS 版本 5\n\nRxJS 版本 5 提供了更好的调试和更好的模块化。版本\
  \ 5 还遵循 ES7 规范，而 RxJS 版本 4 遵循 ES6 规范。\n\nRxJS 版本 5 在性能上有显著提升：在 Google Chrome V8\
  \ 中，RxJS 版本 5 平均比 RxJS v4 快 5 倍。\n\n使用 RxJS v5 和 ES6 的代码片段：\n\n```\nimport {Observable}\
  \ from \"rxjs/Observable\";\nimport { map } from \"rxjs/operator/map\";\nmap.call(Observable.of(1,2,3),\
  \ x => x*x).subscribe(console.log.bind(console));\n```\n\n使用 RxJS v5 和 Babel 的 ES6\
  \ 代码片段：\n\n```\nimport {Observable} from \"rxjs/Observable\";\nimport { map } from\
  \ \"rxjs/operator/map\";\nObservable.of(1,2,3)::map(x => x*x).subscribe(::console.log);\n\
  ```\n\n以下代码片段使用 TypeScript 中 RxJS 版本 5 的语法：\n\n```\nimport {Observable} from \"\
  rxjs/Observable\";\nimport \"rxjs/add/operator/map\";\nObservable.of(1,2,3).map(x\
  \ => x*x).subscribe(console.log.bind(console));\n```\n\n## 在 RxJS 版本 5 中创建 Observables\n\
  \n在版本 5 中创建`Observable`的语法与版本 4 略有不同：版本 5 中已去掉了“on”前缀。\n\nRxJS 版本 5 的语法示例如下：\n\n\
  ![Image](img/pg264.jpg)\n\n将上述语法与本章前面 Observables 的示例进行比较。\n\n## 在 RxJS 中缓存结果\n\n\
  \n\n\n\nRxJS 第 5 版支持 `cache()` 操作符，它允许你缓存 `Observable` 的结果。如果你使用的是 RxJS 第 4 版，并且希望在代码中使用缓存，以下链接包含有关缓存结果的信息：\n\
