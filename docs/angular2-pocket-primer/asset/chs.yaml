  \ `providers` 属性和 `declarations` 属性中（以粗体显示）。\n\n## Angular 中的 moduleId 和 templateUrl\
  \ 属性\n\n前面的一节向你展示了如何在 `template` 属性中使用 `ngFor` 指令来遍历项目列表。Angular 还支持 `templateUrl`\
  \ 属性，这意味着你可以将 `template` 属性中的代码移动到单独的文件中，然后将该文件的名称作为 `templateUrl` 属性的值进行引用。\n\n\
