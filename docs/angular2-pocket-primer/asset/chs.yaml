  \n![Image](img/pg142b.jpg)\n\n![Image](img/pg143a.jpg)\n\n清单 5.8 包含 `MyPipe` 类，其中包含\
  \ `transform()` 方法。这里给出了三个定义管道行为的示例，第一个示例返回名字以大写字母 J 开头的用户（虽然有些刻意，但足以说明管道相关功能）。\n\
  \n清单 5.9 显示了用于创建 `User` 实例的自定义组件 `user.component.ts` 的内容，该组件也通过 `app.component.ts`\
