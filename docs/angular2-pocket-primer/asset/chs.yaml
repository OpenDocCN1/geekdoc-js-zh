  \n清单 2.13 的下一部分是导出的类`MouseEvents`，它以变量`mouseCount`开头，初始值为`0`。`MouseEvents`的其余部分是`mouseEvent()`方法，该方法在每次`mouseover`事件期间递增并显示`mouseCount`的值，并显示`<input>`元素中的文本。\n\
