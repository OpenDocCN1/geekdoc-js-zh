  \ Angular 应用中使用 Observables，接下来让我们看看如何在 TypeScript 接口中表示 JSON 数据。\n\n## Angular\
  \ 中的 TypeScript 接口\n\nJSON 文件`customers.json`包含关于客户的记录式信息，每个客户都可以通过一种称为接口（interface）的东西来建模，这在许多编程语言中都存在。接口在某种程度上类似于\
  \ Apple Swift、Google Go 或 C 语言中的结构体（struct）。\n\n通常，TypeScript 接口指定一个变量列表及其类型，以及一个或多个方法。当你想要关联逻辑上相关的数据项（即信息片段）时，TypeScript\
  \ 接口是一个有用的构造。有许多包含多个数据项的实体示例，例如客户、员工、学生、采购订单等。你可以使用 TypeScript 接口对所有这些（以及许多其他）进行建模，下一节将讨论一个示例。\n\
  \n## 一个简单的 TypeScript 接口\n\n清单 4.11 展示了`employee.ts`文件的内容，其中包含一个假设员工的接口。实际示例中，这样的接口会包含许多其他信息片段（和方法），而这个高度简化的示例旨在说明如何在\
  \ Angular 中使用 TypeScript 接口。\n\n### 清单 4.11: employee.ts\n\n```\nexport interface\
  \ Employee {\nfname: string,\nlname: string,\ncity: string\n}\n```\n\n请注意，清单 4.11\
  \ 中`Employee`接口的结构与`Employees.json`中行的内容相匹配。\n\n## JSON 数据和 TypeScript 接口\n\n清单\
  \ 4.12 展示了`employees.ts`文件的内容，其中包含一个`Employee`实例数组。文件`employees.ts`说明了如何用符合 TypeScript\
  \ 接口的硬编码数据值填充数组。注意，当前代码示例中并未使用清单 4.10。其目的仅仅是演示可以从静态文件加载“种子数据”（这对测试目的很有用）。\n\n###\
  \ 清单 4.12: employees.ts\n\n![Image](img/pg112.jpg)\n\n## 使用 TypeScript 接口的 Angular\
  \ 应用\n\n本节讨论如何创建一个使用 TypeScript 接口的 Angular 应用。\n\n通过克隆 Angular 应用`ReadJSONFile`来创建一个名为`ReadJSONFileTS`的\
  \ Angular 应用，然后对`ReadJSONFileTS`中的`app.component.ts`文件内容进行两处小修改。\n\n第一处修改是添加以下导入语句：\n\
  \n```\nimport {Employee} from './employee';\n```\n\n第二处修改是将清单 4.10 中加粗的代码片段替换为以下代码片段，该片段将`employees`变量声明为符合`Employee`接口的对象数组：\n\
  \n```\nemployees : Employee[];\n```\n\n启动应用，你将看到相同的结果。请记住，此项目中唯一显著的区别在于 TypeScript\
  \ 接口。尽管在此示例中使用 TypeScript 接口并未提供显著优势，但请考虑包含多个 TypeScript 接口的 Angular 应用的情况，其中一些接口可能包含数十个元素。在这种情况下，TypeScript\
  \ 接口简化了跟踪相关数据的任务，这在需要执行创建、读取、更新和删除（CRUD）操作时非常有用。\n\n关于 TypeScript 接口，有一些有用的事实需要记住。首先，它们可以包含在类中实现的方法定义。其次，TypeScript\
  \ 接口可以扩展现有接口（因此可以创建层次结构）。第三，TypeScript 接口可以扩展 TypeScript 类。虽然本章没有包含说明这些额外功能的示例，但你可以通过在线搜索找到相关的代码示例和教程。\n\
