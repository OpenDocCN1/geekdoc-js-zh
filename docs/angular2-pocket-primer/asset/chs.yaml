  \n显示 Angular 组件的依赖树\n\nCompodoc\n\nAngular 与深度学习\n\n总结\n\n*索引*\n\n# 前言\n\n## 本书的核心价值主张是什么？\n\
  \n本书力求涵盖 Angular 4 的基本特性，并附有大量代码示例（基于 Angular 4 的生产版本），这些示例将容纳在一本 300 页的书中。代码示例的主要目标是向您展示如何完成各种任务，例如显示和更新用户列表、将信息保存到数据存储、使用\
  \ `Observables`、开发移动应用程序等。如果您对阅读那些“能完成任务”的 Angular 代码示例感兴趣，即使某些细节被省略，这本书也可能非常适合您。\n\
  \n如果您对本书的风格犹豫不决，或者您认为“口袋入门书”应该有不同的格式（关于这一点，意见确实存在分歧），那么也许另一本书更适合您的需求。\n\n## 阅读本书需要\
  \ Angular 知识吗？\n\n阅读本书不需要事先了解 Angular。您需要理解 HTML（如何使用基本元素）以及一些 JavaScript 知识。第 6\
  \ 章 包含与 Node 相关的代码示例，这确实需要一些背景知识才能理解材料。第 7 章 包含将 Angular 与 Redux 和 GraphQL 结合的代码示例，这些是更高级的主题。然而，如果您想专注于\
  \ Angular 的“核心”概念，可以省略这两章。如果您遇到不熟悉的概念，在许多情况下，您可以通过阅读众多在线教程中的一篇来学习这些概念。\n\n请记住，在代码示例技术细节的解释深度与广度之间，以及在一本短书中包含的示例类型（和数量）之间，总是存在权衡。本书倾向于广度而非深度，尤其是在代码示例方面。因此，某些主题（如测试）被省略了，而其他主题（ES6\
  \ 和 TypeScript）仅在“按需”基础上简要介绍。因此，有时您需要查阅其他资料以获取代码示例中技术“细节”的更详细信息，例如 ES6 方法 `map()`\
  \ 和 `filter()`，或者对 `Observables` 和 `Promises` 的深入解释。\n\n如果您想确保自己能掌握本书的内容，请浏览一些代码示例，了解其中有多少是您熟悉的，有多少是新的。\n\
  \n## 目标读者\n\n\n\n\n本书旨在面向全球读者，他们来自不同年龄层且背景各异。虽然许多读者能阅读英文，但他们的母语并非英语（可能是第二、第三甚至第四语言）。因此，本书使用标准英语，而非可能让这些读者感到困惑的口语表达。如你所知，许多人通过不同类型的模仿来学习，包括阅读、写作或听新材料（是的，也有一些基础视频可供使用）。本书充分考虑这些因素，旨在为目标读者提供舒适且有意义的学习体验。\n\
  \n### 如何充分利用本书\n\n有些程序员擅长通过文字学习，另一些则擅长通过示例代码（以及大量代码）学习，这意味着没有一种风格适用于所有人。\n\n此外，有些程序员希望先运行代码，观察其效果，然后再回头深入钻研代码细节（而另一些则采用相反的方法）。\n\
  \n因此，本书包含多种类型的代码示例：有些简短，有些较长，还有一些代码示例是在先前代码示例的基础上“构建”而成的。\n\n### 本书代码是如何测试的？\n\n\
  本书中的代码示例已在搭载 OS X 10.16 的 Macbook Pro 上的 Google Chrome 浏览器（版本 53）中测试过。除非另有说明，否则未使用任何特定于浏览器的特殊功能，这意味着这些代码示例在其他平台上的\
  \ Chrome 以及其他现代浏览器中应该也能正常工作。\n\n另需注意，所有对“Web Inspector”的引用均指 Chrome 中的 Web Inspector，这与\
  \ Safari 中的 Web Inspector 不同。如果你使用的是其他（但仍属现代）浏览器或早期版本的 Chrome，可能需要在线查询启动和查看 Web\
  \ Inspector 所需的按键序列。请访问以下链接获取更多有用信息：\n\n*[`benalman.com/projects/javascript-debug-console-log/`](http://benalman.com/projects/javascript-debug-console-log/)*\n\
  \n### 为什么截图是黑白的？\n\n黑白图像的成本低于原始彩色图像，因此采用黑白图像意味着本书可以以更低的价格提供。不过，彩色图像以及补充代码示例（在浏览器中启动时会以彩色呈现）均可在随附光盘中找到。\n\
  \n### 为什么本书只有 300 页而不是 500 页？\n\n本书属于 *Pocket Primer* 系列，该系列书籍通常介于 200 到 300 页之间。其次，目标读者是那些对\
  \ HTML 和 JavaScript 了解程度从入门到中级的读者。在编写本书的过程中，我们尽一切努力满足这些读者的需求，使他们能够在自学过程中充分准备好探索\
  \ SVG 的更高级功能。\n\n### 本书是否包含生产级代码示例？\n\n本书中的代码示例确实使用了 Angular 的生产版本来说明 Angular 的各种特性。清晰度比编写更紧凑但更难理解（且可能更容易出现错误）的代码更为重要，尤其是在一本篇幅较短的书中。如果你决定在正式网站中使用本书中的任何代码，则应对该代码进行与其他\
  \ Web 应用程序同样严格的分析。\n\n### 作者的其他相关书籍\n\n1) HTML5 Canvas and CSS3:\n\n[*http://www.amazon.com/HTML5-Canvas-CSS3-Graphics-Primer/dp/1936420341*](http://www.amazon.com/HTML5-Canvas-CSS3-Graphics-Primer/dp/1936420341)\n\
