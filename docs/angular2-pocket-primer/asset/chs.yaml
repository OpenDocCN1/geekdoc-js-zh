  \ 4.5 的内容类似。\n\n## 在 Angular 中使用 forkJoin() 进行多个并发请求\n\n上一节中的代码示例读取了单个文件的内容。然而，在某些情况下，您可能需要从多个源加载数据，并延迟加载后的逻辑，直到所有数据都加载完毕。`Observables`\
  \ 提供了一种名为 `forkJoin()` 的方法来“包装”多个 `Observables`，并发出多个并发的 `http.get()` 请求。请注意，如果任何一个单独的请求失败，整个操作就会失败。`subscribe()`\
  \ 方法为整个 `Observables` 集合设置处理程序。\n\n![Image](img/disc.jpg)\n\n将配套光盘中的 `ForkJoin`\
  \ 目录复制到一个方便的位置。清单 4.8 显示了 `app.component.ts` 的内容，该文件演示了如何引用自定义组件 `FileService`，该组件读取\
