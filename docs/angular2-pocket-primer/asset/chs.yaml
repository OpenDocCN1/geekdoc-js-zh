  \n## 总结\n\n本章首先向你展示了如何发起 HTTP GET 请求来读取基于 JSON 的文件内容。接着你学习了如何发起 HTTP GET 请求来获取 GitHub\
  \ 用户的信息，以及如何发起 HTTP POST 请求。你还学习了如何从网站获取 JSON 数据，将该数据转换为 Promise，然后再将 Promise 转换为\
  \ Observable。最后，你学习了如何在 Angular 应用程序中设置路由。\n\n# 第 5 章\n\n## 表单、管道和服务\n\n本章将向你展示如何创建使用\
  \ Angular 表单、管道和服务的 Angular 应用程序。代码示例依赖于对前面章节讨论的功能的理解，例如如何在 Angular 中发起 HTTP 请求。\n\
  \n本章的第一部分包含使用 Angular 控件和控件组的 Angular 应用程序。这一部分还提供了一个包含发起 HTTP GET 请求的表单的 Angular\
  \ 应用程序示例，该示例增强了第 4 章中涉及 HTTP 相关功能的示例。\n\n本章的第二部分讨论 Angular 管道（Angular 1.x 中过滤器的对应物）。你还将在这一部分学习异步管道，它可以消除定义实例变量的需要，并减少\
  \ Angular 应用程序中内存泄漏的可能性。\n\n## Angular 表单概述\n\nAngular 的 `FormControl` 表示单个输入字段，`FormGroup`\
  \ 由多个逻辑上相关的字段组成，`NgForm` 组件表示 HTML 网页中的 `<form>` 元素。用于提交表单的 `ngSubmit` 操作具有以下语法：\n\
  \n`(ngSubmit)=\"onSubmit(myForm.value)\"`\n\n请注意，`NgForm` 提供了 `ngSubmit` 事件，而你必须在该组件类中定义\
  \ `onSubmit()` 方法。表达式 `myForm.value` 由表单中的键/值对组成。在本章后面，你将看到涉及这些控件以及 `FormBuilder`\
  \ 的示例，`FormBuilder` 支持其他有用的功能。\n\nAngular 还支持模板驱动表单（使用 `FormsModule`）和响应式表单（使用 `ReactiveFormsModule`），两者都属于\
  \ `@angular/forms`。然而，响应式表单是同步的，而模板驱动表单是异步的。\n\n## 响应式表单\n\n响应式表单涉及对非用户界面（UI）数据模型与面向\
  \ UI 的表单模型之间流动的数据进行显式管理，该表单模型保留屏幕上 HTML 控件的状态和值。响应式表单提供了使用响应式模式、测试和验证的便利性。\n\n响应式表单涉及在组件类\
  \ `app.component.ts` 中创建 Angular 表单控件对象的树，这些对象也绑定到组件模板 `app.component.html` 中的原生表单控件元素。\n\
  \n组件类可以访问数据模型和表单控件结构，这使你能够将数据模型值传播到表单控件中，并检索 HTML 控件中用户提供的值。组件可以观察表单控件状态的变化并对其做出反应。直接使用表单控件对象的一个优点是值和有效性的更新始终是同步的，并且在你控制之下。你不会遇到有时困扰模板驱动表单的时间问题，并且响应式表单更容易进行单元测试。由于响应式表单是通过代码直接创建的，它们始终可用，这使你能够立即更新值并“深入”到后代元素。\n\
  \n## 模板驱动表单\n\n模板驱动表单涉及将 HTML 表单控件（例如 `<input>`、`<select>` 等）放置在组件模板中。此外，表单控件通过指令（如\
  \ `ngModel`）绑定到组件中的数据模型属性。\n\n请注意，Angular 指令根据提供的数据绑定中的信息创建 Angular 表单对象。Angular\
  \ 使用 `ngModel` 来处理数据值的传输，并在用户更改发生时更新可变数据模型。因此，`ngModel` 指令不属于 `ReactiveFormsModule`。\n\
  \n![Image](img/disc.jpg)\n\n在深入本节内容之前，配套光盘中包含 Angular 应用程序 `MasterForm`，其中包含与表单相关的代码。尽管此代码示例未使用\
  \ Angular `FormGroup`，但你可能会在代码中找到一些有用的功能。\n\n下一节将向你展示如何使用 Angular 的 `ngForm` 组件以“Angular\
  \ 方式”创建表单。然后你将看到一个示例，展示如何在 Angular 应用程序中使用 Angular 的 `FormGroup`。\n\n## 一个 Angular\
  \ 表单示例\n\n![Image](img/disc.jpg)\n\n将配套光盘中的 `NGForm` 目录复制到一个方便的位置。清单 5.1 显示了 `app.component.ts`\
  \ 的内容，该文件说明了如何在 Angular 应用程序中使用带有 `ngModel` 属性的 `<input>` 元素。\n\n### 清单 5.1：app.component.ts\n\
  \n![Image](img/pg129.jpg)\n\n![Image](img/pg130a.jpg)\n\n清单 5.1 定义了一个模板属性，其中包含一个带有两个\
  \ `<div>` 元素的 `<form>` 元素，每个 `<div>` 元素包含一个 `<input>` 元素。第一个 `<input>` 元素用于新用户的名字，第二个\
  \ `<input>` 元素用于新用户的姓氏。\n\nAngular 提供了 `NgModel` 指令，使你能够在 Angular 表单中使用实例变量 `myForm`。例如，以下代码片段将\
  \ `myForm` 指定为给定表单的控件组：\n\n`<form [ngModel]=\"myForm\" (ngSubmit)=\"onSubmit(myForm.value)\"\
  `\n\n请注意，`onSubmit` 指定了 `myForm`，并且一个控件绑定到了输入元素。\n\n**注意**：*在 `<form>` 元素中添加 `novalidate`\
  \ 属性以禁用浏览器验证。*\n\n清单 5.2 显示了 `app.module.ts` 的内容，该文件导入了 `FormsModule` 并将其包含在 `imports`\
  \ 属性中。\n\n### 清单 5.2：app.module.ts\n\n![Image](img/pg130b.jpg)\n\n清单 5.2 很直接：它包含两行（以粗体显示）涉及\
  \ `FormsModule` 的代码，这些代码是此代码示例所必需的。\n\n## 数据绑定与 ngModel\n\nAngular 支持表单中的三种绑定类型：无绑定、单向绑定和双向绑定。以下是一些示例：\n\
  \n```\n<!-- 无绑定 -->\n<input name=\"fname\" ngModel>\n\n<!-- 单向绑定 -->\n<input name=\"\
  fname\" [ngModel]=\"fname\">\n\n<!-- 双向绑定 -->\n<input name=\"fname\" [ngModel]=\"\
  fname\" (ngModelChange)=\"fname=$event\">\n\n<!-- 双向绑定 -->\n<input name=\"fname\"\
  \ [(ngModel)]=\"fname\">\n```\n\n\n\n\n单向绑定示例会在关联的组件中查找 `fname` 属性，并用 `fname` 属性的值初始化\
  \ `<input>` 字段。\n\n双向绑定示例在用户更改 `<input>` 字段的值时触发 `ngModelChange` 事件，从而更新组件中的 `fname`\
  \ 属性，确保输入值与其关联的组件值保持一致。你也可以将 `ngModelChange` 的值替换为函数的输出（例如，将用户在输入字段中输入的文本字符串转换为大写）。\n\
  \n第二个双向数据绑定示例使用了“盒子里的香蕉”语法，这是一种简写方式，可实现与第一个双向数据绑定示例相同的结果。然而，这种语法不支持使用函数，而较长的双向数据绑定语法则支持。\n\
  \n## 第三方 UI 组件\n\nValor 为 Angular 提供了 Bootstrap 组件，其主页位于：\n\n*[`valor-software.com/ng2-bootstrap/#/`](https://valor-software.com/ng2-bootstrap/#/)*\n\
