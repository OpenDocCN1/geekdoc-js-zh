  \n开发跨平台原生移动应用的另一个选择是结合使用 Ionic 2 和 NativeScript。在查看代码示例之前，我们先快速了解一下 NativeScript\
  \ 的一些基本特性，这是下一节的主题。\n\n![Image](img/pg219b.jpg)\n\n**图 8.3** 某个 GitHub 用户的仓库列表。\n\
  \n### 什么是 NativeScript？\n\nNativeScript 2.0 允许你为多个平台创建原生移动应用，其主页位于：\n\n[`www.nativescript.org/`](https://www.nativescript.org/)\n\
  \nNativeScript 使用原生平台的渲染引擎（即不使用 WebView）来渲染 UI，从而获得接近原生的性能。然而，NativeScript 为 Android\
  \ 和 iOS 生成原生应用，而 Ionic 2 为 Android 和 iOS 生成混合应用。因此，NativeScript 与 React Native“相当”，而\
  \ Ionic 2 则与 PhoneGap“相当”。\n\nNativeScript 具有以下特性：\n\n![Image](img/greybox.jpg)原生\
  \ UI（无 WebView）\n\n![Image](img/greybox.jpg)可扩展\n\n![Image](img/greybox.jpg)易于学习\n\
  \n![Image](img/greybox.jpg)跨平台\n\n![Image](img/greybox.jpg)由 Telerik 支持\n\n![Image](img/greybox.jpg)开源（Apache\
  \ 2 许可证）\n\n请记住，用于 Angular 的 NativeScript 为 Android 和 iOS 生成原生应用，而 Ionic 2 为 Android\
  \ 和 iOS 生成混合应用。因此，NativeScript 与 Angular 的组合是 React Native 的“对应物”（其中 UI 层可以是 ReactJS\
  \ 或 Angular）。\n\n### 安装与创建新项目\n\n使用以下命令安装 NativeScript：\n\n```\n[sudo] npm install\
  \ –g nativescript\n```\n\n上述命令完成后，你可以通过执行以下三个命令来创建和部署 NativeScript 应用：\n\n```\n\
  tns create FirstNSProject --template\nnativescript-template-tutorial\ncd FirstNSProject\n\
  tns run android\n```\n\n为简单起见，`FirstNSProject`项目基于现有的 NativeScript 模板。\n\n调用以下命令部署到\
  \ iOS 设备：\n\n```\ntns run ios\n```\n\n图 8.4 展示了 Android 设备上 NativeScript `FirstNSProject`的（显然很简单的）内容。\n\
