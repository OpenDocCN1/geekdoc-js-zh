  \n## 总结\n\n本章向你展示了多种创建移动应用的方法，这些方法使用 Angular 作为 UI 层。首先，你了解了 Angular Mobile Toolkit，它使你能够使用\
  \ Angular 创建移动应用。你还学习了如何使用 Ionic 2 工具包创建跨平台混合移动应用。然后，你看到了如何将 Ionic 2 与 NativeScript\
  \ 结合来创建原生移动应用。\n\n你还了解了如何使用 Angular 和 NativeScript 创建原生移动应用。接下来，你学习了 React Native，它使你能够使用\
  \ ReactJS 或 Angular 作为 UI 层生成跨平台原生移动应用。\n\n# 第 9 章：函数式响应式编程\n\n本章讨论函数式响应式编程（FRP），重点介绍一些基本的\
  \ RxJS 代码示例，这些示例可以帮助你开发简单的 Web 应用（即使没有 Angular）。从第 4 章开始，你已经看到了许多使用 `Observables`\
  \ 的 Angular 代码示例。然而，本章将深入探讨之前章节未涉及的 RxJS 的其他方面。\n\n你很快就会看到，本章中的大多数代码示例都是简单的 HTML\
  \ 网页。这种方法大大减少了开发时间，因为你只需在浏览器中启动 HTML 网页，而无需从命令行创建应用（也无需 `node_modules` 子目录）。因此，本章使你能够专注于快速学习\
  \ RxJS 的各个方面，之后你可以在 Angular 应用中使用你需要的功能。\n\n本章的第一部分包含对 FRP 的高层介绍，以及一些流行的 FRP JavaScript\
  \ 工具包列表。\n\n本章的第二部分讨论 RxJS 中的中间操作符和终端操作符，包括说明如何通过方法链调用多个操作符的代码示例。本节还讨论了冷 `Observable`\
  \ 与热 `Observable` 之间的区别，以及如何无法将前者“转换”为后者。本节中几乎所有的代码示例都是完整且自包含的，因此你可以在浏览器中启动它们，并在\
  \ Chrome Web Inspector 中查看其输出。\n\n\n\n\n\n本章的第三部分包含使用 RxJS 与可缩放矢量图形（SVG）生成图形和动画效果的示例。你还将看到一个在\
  \ HTML 网页中“reactify”某些 HTML 元素的示例。\n\n本章的最后部分提供了一个非常简短的章节，介绍 RxJS 第 5 版，以及 RxJS\
  \ 第 5 版与第 4 版之间的一些差异。\n\n## 什么是函数式响应式编程（FRP）？\n\n网络上可以找到 FRP 的各种定义。就我们的目的而言，FRP\
  \ 基于观察者模式、迭代器模式和函数式编程的组合。其主页位于：\n\n[`reactivex.io/`](http://reactivex.io/)\n\n响应式编程于\
  \ 1997 年引入，可以概括如下：\n\n![Image](img/greybox.jpg)它是使用异步数据流进行编程。\n\n![Image](img/greybox.jpg)它是事件驱动的，而非主动式。\n\
  \n![Image](img/greybox.jpg)有多种工具包和库可用。\n\n![Image](img/greybox.jpg)它支持 JS、Java、Scala、Android\
  \ 和 Swift 等语言。\n\nConal Elliott 被认为是 FRP 的创始人，你可以在此处找到他对 FRP 的非常具体的定义：\n\n[`stackoverflow.com/questions/1028250/what-is-functional-reactive-programming`](https://stackoverflow.com/questions/1028250/what-is-functional-reactive-programming)\n\
  \nFRP 的另一个定义涉及两个其他概念的组合：响应式编程（异步数据流）和函数式编程（纯函数、不可变性以及最小化变量和状态的使用）。\n\n响应式编程支持许多操作符，这些操作符在处理异步流时提供了强大的功能。响应式编程范式避免了其他环境中可能出现的“回调地狱”。此外，与基于\
  \ Promise 的工具包和库相比，Observable 提供了更大的灵活性。\n\nFRP 部分基于函数式编程，函数式编程之所以流行，是因为它可以减少程序中的状态量，从而有助于减少代码错误的数量。然而，FRP\
  \ 比函数式编程更具声明性，通常具有更多的抽象性，并且可能涉及高阶函数。因此，响应式编程和函数式编程的结合使你能够编写更简洁但更强大的代码。\n\n根据 Reactive\
  \ 主页的说法，FRP 能够正确处理异步流中的错误，并避免编写自定义代码来处理线程、同步和并发。从另一个角度来看，FRP 是从集合到流，再到异步流这条路径的“顶峰”。\n\
  \n以下网站可以找到 JavaScript 中用于 FRP 的几个工具包：\n\nRxJS：[`github.com/Reactive-Extensions/RxJS`](https://github.com/Reactive-Extensions/RxJS)\n\
  \nBacon.js：[`baconjs.github.io/`](https://baconjs.github.io/)\n\nKefir.js：[`rpominov.github.io/kefir/`](https://rpominov.github.io/kefir/)\n\
  \nmost.js：[`github.com/cujojs/most`](https://github.com/cujojs/most)\n\n上述工具包各有不同的优势，并且通常比\
  \ RxJS 更轻量。完成本章后，你将能够更好地评估这些 RxJS 的替代方案，并决定是否要使用它们来代替 RxJS。\n\n现在让我们简要了解一下 FRP 基础的观察者模式。\n\
  \n## 观察者模式\n\n观察者模式是一种强大的模式，在许多编程语言中都有实现。简而言之，观察者模式涉及一个 Observable（即被观察或“监视”的对象）和一个或多个\
  \ Observer 对象。Observer（也称为订阅者）“监视”另一个对象中数据的变化或事件的发生。在 Java 等语言中，Observable 包含一个已向该\
  \ Observable 注册的 Observer 对象集合。当 Observable 中发生状态变化或事件时，Observable 会通知已注册的 Observer\
  \ 对象。\n\n定义 Observable 的细节将在本章后面讨论，但关键思想是组合（“链式调用”）操作符（例如 `map()` 和 `filter()`），然后调用\
  \ `subscribe()` 方法来“使其发生”。\n\n## 处理异步事件\n\nRxJS 有时被描述为“用于异步事件的 LoDash”。各种类型的异步事件包括：\n\
  \n![Image](img/greybox.jpg)Ajax\n\n![Image](img/greybox.jpg)用户事件（包括鼠标相关事件）\n\n![Image](img/greybox.jpg)动画\n\
  \n![Image](img/greybox.jpg)套接字和服务器发送事件（SSE）\n\n![Image](img/greybox.jpg)Worker\n\
  \n作为对比，以下代码片段说明了处理异步事件的 ECMA5 风格：\n\n```\ngetDataFromSomewhere(function(result)\
  \ {\nconsole.log(\"result = \"+result)\n});\n```\n\n上述代码片段对应的 ES6 版本如下所示：\n\n```\n\
  getDataFromSomewhere((result) => {\nconsole.log(\"result = \"+result)\n});\n```\n\
  \n## Promise 与异步事件\n\nPromise 非常适合异步操作（例如基于 Ajax 的请求），前提是预期行为只有一个值并且随后完成。以下列表描述了\
  \ Promise 的一些属性：\n\n![Image](img/greybox.jpg)保证未来（在 Web 应用中并不总是可取）\n\n![Image](img/greybox.jpg)不可变\n\
  \n![Image](img/greybox.jpg)单一值（在 Web 应用中并不总是可取）\n\n![Image](img/greybox.jpg)缓存\n\
  \n![Image](img/greybox.jpg)立即调用\n\n![Image](img/greybox.jpg)无法取消\n\n![Image](img/greybox.jpg)无法重用\n\
  \n因此，当未来结果有保证且返回单个值时，Promise 是合适的。以下是一个使用 Promise 的简单示例：\n\n![Image](img/pg240.jpg)\n\
  \n![Image](img/pg241a.jpg)\n\n如果你还不知道，Observable 可用的某些操作符在 ECMA5 中也作为方法存在。在深入探讨\
  \ FRP 代码示例之前，让我们在下一节中看看如何使用其中一些方法。\n\n## 不使用 FRP 的操作符\n\n以下代码块展示了如何链式调用 `filter()`\
  \ 和 `map()` 方法来处理一组整数：\n\n![Image](img/pg241b.jpg)\n\n请注意，`result1` 和 `result2`\
  \ 的输出是相同的。如果可能，在 `map()` 方法之前指定 `filter()` 方法，以进行“前置”数据缩减（但请参见下面的注意事项）。在前面的示例中，性能差异可能无法察觉，但如果你将源数据改为包含前一百万个正整数，你可能会看到性能差异。\n\
  \n如前所述，关于操作顺序有一个重要的注意事项：当 `filter()` 方法和 `map()` 方法以相反顺序调用时，有时会产生*不同*的结果。例如，以下代码块是前面代码块的修改版本（修改部分以粗体显示），说明了这一点：\n\
  \n![Image](img/pg241c.jpg)\n\n![Image](img/pg242a.jpg)\n\n变量 `result3` 的值为 [0,4,8,12,16,20]，而变量\
  \ `result4` 的值为 [0,8,16]。\n\n## 关于 Observable 的类比\n\n如果你是 Observable 的新手，或者发现自己在处理包含\
  \ Observable 的代码示例时感到困难，本节提供了 Venkat Subramanian 的一个幽默类比，对 Observable 的世界有巧妙的见解。\n\
  \n首先，Observable 涉及一些关键概念：链式调用中间操作符（例如 `map()`、`filter()` 等），然后（可能稍后）调用终端操作符（例如 `subscribe()`\
  \ 或 `forEach`）来“让事情发生”。\n\n跳过语法相关的细节，考虑 JavaScript 中涉及中间操作符 `map()` 和 `filter()`\
  \ 的一对 Observable：\n\n![Image](img/pg242b.jpg)\n\n\n\n\n\n*问题*：`result1` 和 `result2`\
  \ 有什么区别？\n\n*答案*：只有 `result2` 包含了终端操作符 `subscribe()`。\n\n*结果*：第一个 `console.log()`\
  \ 不显示任何内容，第二个显示数字 0 和 12。\n\n现在，让我们来读一段来自 Venkat Subramanian 的有趣（且有意义）的类比，他通过讲述妻子和两个十几岁儿子的故事来解释\
  \ Observable，当时他们都在客厅看电视：\n\n母亲：“该关电视了。”\n\n儿子们：[没有回应。]\n\n母亲：“该倒垃圾了。”\n\n儿子们：[没人动。]\n\
  \n母亲：“你们该开始做作业了。”\n\n儿子们：[仍然没反应。]\n\n过了一段时间……\n\n母亲：“我去叫你们爸爸。”\n\n儿子们：[立刻行动起来……]\n\
  \n希望你能意识到，母亲的前三次请求类似于中间操作符，而她最后一句陈述则类似于终端操作符，它触发了前三次请求的执行。\n\n如果这个类比让你对 Observable、中间操作符和终端操作符有了“顿悟时刻”，那么好消息是，本章中的许多代码示例对你来说会更容易理解。\n\
  \n## RxJS 的 JavaScript 文件\n\nRxJS 的 JavaScript 文件可通过内容分发网络（CDN）获取，大约包含 10 个不同的文件。以下是在\
  \ HTML 网页中需要包含的“核心”JavaScript 文件：\n\n```html\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.js\"\
  >\n</script>\n\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.async.js\"\
  >\n</script>\n\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.binding.js\"\
  >\n</script>\n```\n\n本书付印时版本号可能有所不同。此外，请注意 RxJS v5 目前仍处于测试阶段。其他 RxJS 文件可在此处获取（第一个用于动画效果）：\n\
  \n```html\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.time.js\"\
  >\n</script>\n\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.coincidence.js\"\
  >\n</script>\n\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs-dom/2.0.7/rx.dom.js\"\
  >\n</script>\n```\n\n在讨论了所有预备细节之后，让我们在下一节深入探讨各种中间操作符和终端操作符。\n\n## 中间操作符与终端操作符\n\n\
  将 Observable 视为数据流或数据集，它们可以包含任意数量的项（时间任意）。Observable 在被“订阅”时生成值，并且可以被取消和重新启动（Promise\
  \ 则不行）。Observable 帮助你避免在不使用 Observable 或 Promise 的异步代码中可能出现的“回调地狱”。\n\n## 操作符\n\n\
  操作符是 Observable 中的方法。操作符可以是中间操作符或终端操作符（稍后讨论），它们允许你组合新的 Observable。常见的操作符包括 `filter()`、`map()`、`reduce`\
  \ 和 `merge()`。\n\n如果你需要在 RxJS 中创建自定义操作符，可以使用以下语法：\n\n```javascript\nRx.Observable.prototype.myCustomOperator\
  \ = // 在此处定义内容\n```\n\n你可以使用方法链式调用操作符，通用语法如下：\n\n![Image](img/pg244.jpg)\n\n*结果*：`obs`\
  \ 是一个“连接”到数据源的 Observable。\n\n## `subscribe()` 和 `unsubscribe()` 操作符\n\n必须调用 `subscribe()`\
  \ 方法才能生成数据。举例说明，考虑以下代码块：\n\n![Image](img/pg245.jpg)\n\n第一个 Observable 没有生成输出，因为没有\
  \ `subscribe()` 方法，而第二个 Observable 显示 0 到 3（含）之间的整数。\n\n另一方面，`unsubscribe()` 会“拆除”生产者，这意味着生产者将停止生成数据。以下代码块展示了如何调用\
  \ `unsubscribe()` 方法：\n\n```javascript\nlet x = Rx.Observable.(...)\nlet result\
  \ = x.subscribe(...)\n// 在此处执行某些操作...\nresult.unsubscribe();\n```\n\n调用 `unsubscribe()`\
  \ 操作符后，你可以重新启动一个 Observable 并“重新订阅”该 Observable，而 Promise 则无法做到这一点。（曾向 TC39 委员会提交了一项提案，要求增加对取消\
  \ Promise 的支持，但后来被撤回。）\n\n## `subscribe()` 和 `forEach()` 操作符\n\nRxJS 4.0 遵循 ES6\
  \ 规范（但不遵循 ES7 规范），其中 `subscribe()` 和 `forEach()` 是相同的。然而，RxJS 5.0 遵循 ES7 规范，其中 `subscribe()`\
  \ 和 `forEach()` 是不同的，如下所述。\n\nRxJS 5.0 中 `subscribe()` 方法的语法如下：\n\n```typescript\n\
  public subscribe(observerOrNext: Observer | Function, error: Function, complete:\
  \ Function): Subscription\n```\n\n`Observable.subscribe` 返回一个*订阅*令牌，使你能够取消订阅。当订阅事件的持续时间未知，或者需要提前终止时，此功能非常有用。\n\
  \nRxJS 5.0 中 `forEach()` 方法的语法如下：\n\n```typescript\npublic forEach(next: Function,\
  \ PromiseCtor?: PromiseConstructor): Promise\n```\n\n`Observable.forEach` 返回一个*Promise*，该\
  \ Promise 根据 Observable 是否完成（或失败）而 resolve（或 reject）。再次提醒，Promise 不能被取消。\n\n请记住，目前绝大多数在线代码示例都使用\
  \ RxJS 4.0，因此同时学习 RxJS 4.0 和 RxJS 5.0 可能是值得的。\n\n## 将数据源转换为 Observable\n\n你可以使用多种方法将其他数据源“转换”为\
  \ Observable，如下所示：\n\n```javascript\nObservable.of(...)\nObservable.from(promise/iterable/observable);\n\
  Observable.fromEvent(...)\n```\n\n接下来的几个小节包含代码示例，说明如何在 RxJS 中使用变量操作符。\n\n## 使用 `range()`\
  \ 和 `filter()` 操作符\n\n清单 9.1 显示了 `ObservableRangeFilter1.html` 的内容，该文件说明了如何使用不同的语法风格定义\
  \ Observable。\n\n### 清单 9.1 ObservableRangeFilter1.html\n\n![Image](img/pg246.jpg)\n\
  \n![Image](img/pg247.jpg)\n\n清单 9.1 包含三个 Observable，第一个没有生成任何输出，因为没有 `subscribe()`\
  \ 方法。第二个 Observable 将范围 (0,20) 内的整数过滤为小于 4 的整数，然后通过 `console.log()` 显示它们的值。第三个 Observable\
  \ 遍历范围 (1,5) 内的整数，并通过 `console.log()` 方法显示它们的值。\n\n运行清单 9.1 中的代码，你将看到以下输出：\n\n```\n\
  #2 x = 0\n#2 x = 1\n#2 x = 2\n#2 x = 3\nonNext: 1\nonNext: 2\nonNext: 3\nonNext:\
  \ 4\nonNext: 5\nonCompleted\n```\n\n下一节包含一个示例，展示如何链式调用 `from()` 和 `map()` 中间操作符。\n\
  \n## 使用 `from()` 和 `map()` 操作符\n\n清单 9.2 显示了 `ObservableMapUpper1.html` 的内容，该文件说明了如何使用\
  \ Observable 来“反应化”一个 HTML 网页。\n\n### 清单 9.2 ObservableMapUpper1.html\n\n![Image](img/pg248.jpg)\n\
  \n清单 9.2 从一个字符串数组定义了一个 Observable。`map()` 方法将每个数组项转换为大写形式，然后附加原始数组项。`subscribe()`\
  \ 方法仅显示在 `map()` 方法内部创建的每个字符串的值。在浏览器中运行清单 9.2 中的代码，你将看到以下输出：\n\n```\nA1a1\nA2a2\n\
  A3a3\n```\n\n下一节包含一个示例，展示如何链式调用 `interval()`、`take()` 和 `map()` 中间操作符。\n\n## 使用\
  \ `interval()`、`take()` 和 `map()` 操作符\n\n清单 9.3 显示了 `ObservableTake.html` 的内容，该文件说明了如何在\
  \ HTML 网页中“交错”两个 Observable 的输出。\n\n### 清单 9.3 ObservableTake.html\n\n![Image](img/pg249.jpg)\n\
  \n\n\n\n\n`清单 9.3` 定义了两个 `Observables`，它们调用了 `interval()`、`take()` 和 `map()` 操作符。第一个\
  \ `Observable` 每 1000 毫秒发射一次数据，而第二个 `Observable` 每 500 毫秒发射一次数据。第一个 `Observable`\
  \ 调用了包含 `console.log()` 语句的 `subscribe()` 方法来显示数据项。第二个 `Observable` 也调用了 `subscribe()`\
  \ 方法，但使用了不同的语法：指定了三个函数，分别处理 `next`、`error` 和 `completed` 事件。\n\n运行 `清单 9.3` 中的代码，你将看到以下输出：\n\
  \n```\nsource2 onNext: 1\nx = 1\nsource2 onNext: 2\nsource2 onNext: 3\nx = 2\nsource2\
  \ onNext: 4\nsource2 onCompleted\nx = 3\nx = 4\n```\n\n至此，你已经了解了如何组合一些中间操作符。`RxJS`\
  \ 还支持许多其他操作符，下一节将对这些操作符进行高层级且快速的介绍。\n\n## 其他中间操作符\n\n除了本章前面介绍的 `filter()` 和 `map()`\
  \ 操作符之外，`Observables` 还支持以下有用的操作符，其中大多数名称直观易懂：\n\n![Image](img/greybox.jpg)`reduce()`\n\
  \n![Image](img/greybox.jpg)`first()`\n\n![Image](img/greybox.jpg)`last()`\n\n![Image](img/greybox.jpg)`skip()`\n\
  \n![Image](img/greybox.jpg)`toArray()`\n\n![Image](img/greybox.jpg)`isEmpty()`\n\
  \n![Image](img/greybox.jpg)`retry()`\n\n![Image](img/greybox.jpg)`startWith()`\n\
  \n即使你之前没有见过上述操作符，也可能推测出这个 `Observable` 的结果：\n\n![Image](img/pg250.jpg)\n\n## `retry()`\
  \ 操作符\n\n`retry()` 操作符允许你多次尝试从外部网站访问数据。以下是该语法的两个示例：\n\n```\nmyObservable.retry(3);\n\
  myObservable.retryWhen(errors => errors.delay(3000));\n```\n\n下一节将列出一些用于在 `Observables`\
  \ 中合并和连接数据流的中间操作符。\n\n## 合并/连接操作符列表\n\n在第 4 章中，你学习了 `forkJoin()` 中间操作符，它合并了从多个端点发起的\
  \ HTTP 请求返回的数据。以下列表包含了各种对数据流执行合并或连接操作的中间操作符：\n\n![Image](img/greybox.jpg)`merge()`\n\
  \n![Image](img/greybox.jpg)`mergeMap()`\n\n![Image](img/greybox.jpg)`concat()`\n\
  \n![Image](img/greybox.jpg)`concatMap()`\n\n![Image](img/greybox.jpg)`switch()`\n\
  \n![Image](img/greybox.jpg)`switchMap()`\n\n![Image](img/greybox.jpg)`zip()`\n\n\
  ![Image](img/greybox.jpg)`forkJoin()`\n\n![Image](img/greybox.jpg)`withLatestFrom()`\n\
  \n![Image](img/greybox.jpg)`combineLatest()`\n\n其中一些名称直观易懂（例如 `concat()` 用于连接输出），但仍存在一些细微差别。例如，`merge()`\
  \ 操作符将多个 `Observables` 合并为一个 `Observable`，*可能交错*数据值。而 `concat()` 操作符按顺序将多个 `Observables`\
  \ 合并为一个 `Observable`，*不交错*任何数据。\n\n请阅读你感兴趣的中间操作符的在线文档（如果有时间，也可以了解所有操作符！）。\n\n##\
  \ 与 Map 相关的操作符列表\n\n在第 4 章中，你看到了几个使用 `map()` 中间操作符的示例，通常用于将输入流转换为基于 JavaScript 对象表示法（JSON）的数据。以下是与\
  \ map 相关的操作符列表：\n\n![Image](img/greybox.jpg)`map()`\n\n![Image](img/greybox.jpg)`flatMap()`\n\
  \n![Image](img/greybox.jpg)`flatMapLatest()`\n\n![Image](img/greybox.jpg)`mergeMap()`\n\
  \n![Image](img/greybox.jpg)`concatMap()`\n\n![Image](img/greybox.jpg)`switchMap()`\n\
  \n![Image](img/greybox.jpg)`flatten()`\n\n回想一下第 4 章中你如何使用 `map()` 操作符将字符串转换为基于 JSON\
  \ 的数据。一个更强大的操作符是 `concatMap()`，它使用 `concat()` 确保中间结果不被交错，然后应用 `map()` 操作符。\n\n正如你在上一节中学到的，中间结果可以通过\
  \ `merge()` 操作符交错。由于 `flatMap()` 使用了 `merge()` 操作符，因此中间结果也可以与 `flatMap()` 交错（但不能与\
  \ `concatMap()` 操作符交错）。\n\n请阅读你感兴趣的中间操作符的在线文档，特别是了解 `flatten()` 和 `flatMap()` 操作符之间的区别。\n\
  \n## `timeout()` 操作符\n\n`timeout()` 操作符用于检测 `Observable` 在指定时间段后是否未产生值：\n\n```\n\
  Rx.Observable\n  .fromEvent(document, 'dragover')\n  .throttle(350)\n  .map(true)\n\
  \  .timeout(1000, Rx.Observable.just(false))\n  .distinctUntilChanged();\n```\n\n\
  请记住，`timeout()` 会取消订阅源 `Observable`，并订阅作为参数传递给 `timeout()` 的 `Observable`；因此，你必须重新订阅该\
  \ `Observable` 才能接收后续结果。另一点需要记住的是，`map()` 操作放在 `throttle()` 操作符之后，以避免对未使用的值进行不必要的映射操作。\n\
  \n## 冷 Observable 与热 Observable\n\n*冷* `Observable` 类似于观看录制的电影（例如，在浏览器中观看）。尽管用户在不同时间访问相同的\
  \ URL，但他们都能看到电影的完整内容。对于冷 `Observables`，每个消费者（相当于观看电影的人）都会创建一个新的生产者（电影实例）。\n\n相比之下，*热*\
  \ `Observable` 类似于观看在线直播演示。用户在不同时间访问网站，他们看到的不是整个演示，而是从他们启动演示的时间点开始的部分内容。对于冷 `Observables`，每个消费者（观看演示的人）都使用同一个生产者（流式演示）。\n\
  \n`清单 9.4` 显示了网页 `ColdObservables1.html` 的内容，该页面演示了一系列冷 `Observables`，以及如何将它们转换为热\
  \ `Observables`。\n\n### 清单 9.4 `ColdObservables1.html`\n\n![Image](img/pg253.jpg)\n\
  \n![Image](img/pg254a.jpg)\n\n`清单 9.4` 包含一个冷 `Observable`，以及该 `Observable` 的两个 `Subscribers`。\n\
  \n运行 `清单 9.4` 中的代码，你将看到以下输出：\n\n```\nsubscriber 1: 13\nCalled next: 13\nsubscriber\
  \ 2: 13\ndelayed: 13\n```\n\n注意\n\n*默认情况下，所有 `Observables` 都是冷的，而所有 `Promises` 默认都是热的。*\n\
  \n将冷 `Observable` 转换为热 `Observable` 的一种方法是通过 `publish()` 操作符，如下所示：\n\n[`blog.thoughtram.io/angular/2016/06/16/cold-vs-hot-observables.html`](http://blog.thoughtram.io/angular/2016/06/16/cold-vs-hot-observables.html)\n\
  \n## 使 HTML 网页响应式\n\n包含用于访问外部数据的按钮元素的网页是使用 `Observables` 的良好候选。\n\n`清单 9.5` 显示了\
