  \n![Image](img/greybox.jpg)Dave-Jones\n\n![Image](img/greybox.jpg)Rick-Heard\n\n\
  过滤后的用户列表：\n\n![Image](img/greybox.jpg)Jane-Smith\n\n![Image](img/greybox.jpg)John-Stone\n\
  \n图 5.2 显示了启动此 Angular 应用程序并根据名字以大写字母 J 开头的用户进行过滤后的输出。\n\n![Image](img/pg144b.jpg)\n\
  \n***图 5.2*** 通过 Angular 管道过滤后的用户列表。\n\n现在你已经了解了如何在 Angular 中定义基本管道，你可以尝试使用自定义管道来异步接收数据。当你需要在数据更新后显示数据（例如列表或表格）而无需“轮询”数据源时，这种功能非常有用。\n\
  \n有关 Angular 管道的更多信息，请访问：\n\n*[`angular.io/docs/ts/latest/guide/pipes.html`](https://angular.io/docs/ts/latest/guide/pipes.html)*\n\
  \n至此，本章关于 Angular 管道的部分结束。下一节将讨论 Angular 应用程序中的服务。\n\n## 什么是 Angular 服务？\n\n有时，Web\
  \ 应用程序的前端包含表示逻辑和一些业务逻辑。Angular 组件构成表示层，而服务属于业务逻辑层。定义 Angular 服务时应使其与表示层解耦。\n\nAngular\
  \ 服务是实现某些业务逻辑的类，其设计目的是可以被组件、模型和其他服务使用。换句话说，服务可以作为应用程序其他部分的提供者。\n\n\n\n\n\n由于 Angular\
  \ 中的依赖注入（DI）机制，服务可以在 Angular 应用程序的其他部分被调用。此外，Angular 确保服务是单例的，这意味着每个服务消费者都将访问同一个服务类实例。\n\
  \n下面展示了一个 Angular 自定义服务的示例：\n\n![Image](img/pg145.jpg)\n\n简单的服务 `UpperCaseService`\
  \ 提供了一个方法，该方法接受一个字符串作为参数，并返回该字符串的大写版本。`@Injectable()` 装饰器是必需的，这样该类才能作为依赖项被注入。虽然这个装饰器并非在所有情况下都是强制性的，但以这种方式标记你的服务是一个好习惯。仅当服务（或类）“接收”注入时，才使用\
  \ `@Injectable` 装饰器。\n\n以下是一个 `app.component.ts` 类的示例，它调用了前面服务中的方法：\n\n![Image](img/pg146.jpg)\n\
  \n前面的代码块通过 import 语句导入了 `UpperCaseService` 类（以粗体显示），然后将该类的实例注入到 `UpperComponent`\
  \ 类的构造函数中。接下来，模板属性包含一个带有点击处理器的 `<button>` 元素，该处理器调用前面代码块中定义的 `greet()` 方法。`greet()`\
  \ 方法显示一个警告框，其内容是在自定义 `UpperCaseService` 类中调用 `upper()` 方法的结果。\n\n## 内置 Angular 服务\n\
  \nAngular 支持各种内置服务，这些服务被组织在不同的模块中。例如，`http` 模块（位于 `@angular/http` 中）包含对涉及常见动词（如\
  \ GET、POST、PUT 和 DELETE）的 HTTP 请求的支持。你在第 4 章中看到了基于 HTTP 的请求示例。路由模块（位于 `@angular/router`\
  \ 中）提供路由支持，包括 HTML5 和哈希路由。表单模块（位于 `@angular/forms` 中）提供与表单相关的服务。请查阅 Angular 文档以获取内置服务的完整列表。\n\
  \n## 一个 Angular 服务示例\n\n![Image](img/disc.jpg)\n\n将随附光盘中的 `ServiceExample` 目录复制到一个方便的位置。清单\
  \ 5.13 显示了 `app.component.ts` 的内容，其中包含一个定义服务的示例。\n\n### 清单 5.13：app.component.ts\n\
  \n![Image](img/pg147a.jpg)\n\n清单 5.13 包含一个 `Service` 类，该类前面有 `@Injectable` 装饰器，这使我们能够在清单\
  \ 5.13 的 `AppComponent` 类的构造函数中注入 `Service` 类的实例。\n\n## 带有 EventEmitter 的服务\n\n\
  本节包含一个使用 `EventEmitters` 在组件及其子组件之间进行通信的代码示例。\n\n![Image](img/disc.jpg)\n\n将随附光盘中的\
  \ `UserServiceEmitter` 目录复制到一个方便的位置。清单 5.14 显示了 `user.component.ts` 的内容，该文件为单个用户定义了一个自定义组件。\n\
