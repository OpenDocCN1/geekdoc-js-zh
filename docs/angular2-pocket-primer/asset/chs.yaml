  \ rel=\"stylesheet\">\n```\n\n第三，在 `angular-cli.json` 的 `styles` 数组中插入一个新条目：\n\n\
  ![Image](img/pg132a.jpg)\n\n如需更多说明和代码示例，请访问以下 URL：\n\n*[`github.com/valor-software/ng2-bootstrap`](https://github.com/valor-software/ng2-bootstrap)*\n\
  \n本章的下一部分将向你展示如何“以 Angular 方式”处理表单。\n\n## 使用 FormBuilder 的 Angular 表单\n\n`FormBuilder`\
  \ 类和 `FormGroup` 类是 Angular 内置的用于创建表单的类。`FormBuilder` 支持 `control()` 函数用于创建 `FormControl`，以及\
  \ `group()` 函数用于创建 `FormGroup`。\n\n![Image](img/disc.jpg)\n\n将随附光盘中的 `FormBuilder`\
  \ 目录复制到方便的位置。清单 5.3 显示了 `app.component.ts` 的内容，演示了如何在 Angular 应用程序中使用 Angular 表单。\n\
  \n### 清单 5.3：app.component.ts\n\n![Image](img/pg132b.jpg)\n\n![Image](img/pg133.jpg)\n\
  \n清单 5.3 包含一个 `<form>` 元素，其中有两个 `<div>` 元素，每个 `<div>` 包含一个 `<input>` 元素。第一个 `<input>`\
  \ 元素用于新用户的名字，第二个 `<input>` 元素用于新用户的姓氏。\n\n在清单 5.3 中，`FormBuilder` 被注入到构造函数中，该构造函数创建了一个\
  \ `FormBuilder` 实例，并赋值给构造函数中的 `fb` 变量。接着，通过调用 `group()` 方法初始化 `myForm`，该方法接受一个键值对对象。在此例中，`fname`\
  \ 和 `lname` 是键，它们都作为 `<input>` 元素出现在模板属性中。这些键的值是可选的初始值。\n\n显然，你可以在 `group()` 方法中添加许多其他属性（例如地址相关字段）。此外，你可以为每个新实体添加不同的表单。例如，你可以为\
  \ `Customer`、`PurchaseOrder` 和 `LineItems` 创建单独的表单。\n\n## Angular 响应式表单\n\n![Image](img/disc.jpg)\n\
  \n将随附光盘中的 `ReactiveForm` 目录复制到方便的位置。清单 5.4 显示了 `app.component.ts` 的内容，演示了如何在 Angular\
