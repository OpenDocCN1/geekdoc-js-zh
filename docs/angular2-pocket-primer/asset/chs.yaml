  \ `Observable` 转换为热 `Observable`。\n\n此外，你还学习了如何使 HTML 网页中的 HTML 元素响应式化。最后，你看到了如何使用\
  \ `Observable` 生成 SVG 图形和动画效果，以及一个跟随鼠标的示例，该示例在鼠标移动事件期间显示基于 SVG 的椭圆。\n\n最后，你学习了如何在\
  \ Angular 应用程序中将中间操作符 `interval()` 与 `async` 操作符结合使用，以定期发出整数。\n\n# 第 10 章：杂项主题\n\
  \n本章包含 Angular 功能的混合内容，包括对 Angular 应用程序的两个配置文件的简要描述、预编译（AOT）、`ngc` 编译器、“树摇”功能、Webpack\
  \ 工具以及其他一些主题。这些主题只是简要介绍，部分原因是本书付印后细节可能会发生变化。不过，你可以搜索相关的在线文档（或博客文章）以获取最新变化。\n\n本章第一部分简要讨论了配置文件\
  \ `package.json`（`npm` 工具所需）和 `tsconfig.json`（`tsc` 工具可选）。第二部分讨论了 AOT、其优势以及调用 AOT\
  \ 的两种方式。\n\n第三部分讨论了树摇和 `rollup` 工具，以及如何减小 Angular 应用程序的大小。第四部分向你介绍了 Webpack，以及如何将其与\
  \ AOT 结合使用。你还将了解热模块替换（HMR），它可以缩短开发周期，以及一些有用的 Angular 工具。\n\n最后一部分通过一个 Angular 应用程序简要探讨了深度学习，该应用程序为\
  \ TensorFlow Playground 提供了类似容器的功能，而后者提供了高度可定制神经网络的交互式可视化。\n\n## Angular 4.1.0\n\
  \nAngular 4.1.0 版本在本书付印时发布。然而，这是一个次要版本，意味着没有破坏性更改。此外，该版本是 4.x.x 的直接替代品。\n\n### 新特性\n\
  \n4.1.0 版本增加了对 TypeScript 2.2 和 2.3 的完全支持；事实上，Angular 是使用 TypeScript 2.3 构建的。幸运的是，这一更改不会影响随\
  \ TypeScript 2.1 发布的 Angular 4.0。\n\n此外，Angular 现在符合 TypeScript 中的 `StrictNullChecks`。因此，如果你愿意，可以在\
  \ Angular 项目中启用 `StrictNullChecks`。\n\nAngular 4.1.0 的完整功能和错误修复列表可在此处获取：\n\n*[`github.com/angular/angular/blob/master/CHANGELOG.md`](https://github.com/angular/angular/blob/master/CHANGELOG.md)*\n\
  \n## Angular 配置文件\n\n本节讨论配置文件 `package.json`（`npm` 所需）和 `tsconfig.json`（`tsc` 可选），它们是每个\
  \ Angular 应用程序的一部分。\n\n### package.json 配置文件\n\n清单 10.1 显示了 `package.json` 中的 JavaScript\
  \ 依赖项及其当前版本号，这些是由 `ng` 命令行工具自动生成的。请注意，在本书付印时，某些版本号可能略有不同。\n\n**清单 10.1: package.json**\n\
  \n![Image](img/pg268.jpg)\n\n![Image](img/pg269.jpg)\n\n![Image](img/pg270.jpg)\n\
  \n清单 10.1 中的 scripts 部分指定了可以从命令行调用的各种命令。清单 10.1 的下一部分是 dependencies 部分，列出了编译和启动应用程序所需的模块。当你从命令行调用\
