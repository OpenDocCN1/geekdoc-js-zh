  ## 展示型组件\n\n展示型组件接收数据作为输入，并生成视图作为输出（因此它们不维护应用程序状态）。考虑以下组件：\n\n![Image](img/pg57b.jpg)\n\
  \n`StudentDetailsComponent` 组件主要承担展示职责。该组件接收输入数据并将其显示在屏幕上。因此，该组件是可复用的。\n\n相比之下，特定于应用程序的组件（也称为“智能”组件）与特定的\
  \ Angular 应用程序紧密耦合。因此，智能组件可以包含展示型组件（但反之则不成立）。\n\n由于数据是同步传递给此组件的（而不是通过 `Observable`），数据最初可能不存在，这就是包含所谓的\
  \ Elvis 运算符（模板中的“?”）的原因。\n\n## Angular 中的样式元素和 Shadow DOM\n\nAngular 支持层叠样式表（CSS）封装，这意味着\
  \ CSS 选择器只会匹配在同一自定义组件中定义的元素。这种封装之所以可行，是因为 Angular 中的 ShadowDOM 模拟。具体来说，这涉及导入 `ViewEncapsulation`\
  \ 的 import 语句，并指定以下值之一：\n\n- ![Image](img/greybox.jpg) `ViewEncapsulation.Emulated`\n\
  - ![Image](img/greybox.jpg) `ViewEncapsulations.Native`\n- ![Image](img/greybox.jpg)\
  \ `ViewEncapsulation.None`\n\n组件的默认值是 `ViewEncapsulation.Emulated`，它会在样式旁边输出类的命名空间，并继承全局样式。相比之下，`ViewEncapsulations.Native`\
  \ 使用原生 ShadowDOM（并非所有浏览器都支持），并且会丢失全局样式。最后，`ViewEncapsulation.None` 会移除组件中的所有样式封装。\n\
  \n![Image](img/pg58.jpg)\n\n![Image](img/disc.jpg)\n\n将随附光盘中的 `ViewEncapsulation`\
  \ 目录复制到一个方便的位置。清单 2.30 显示了 `app.component.ts` 的内容，其中包含一个 CSS 选择器，该选择器匹配 `app.component.ts`\
  \ 中的 `<button>` 元素，但不匹配 `index.html` 中的 `<button>` 元素。\n\n### 清单 2.30：app.component.ts\n\
  \n![Image](img/pg59a.jpg)\n\n清单 2.30 包含两条 import 语句和一个 encapsulation 属性，其值设置为 `ViewEncapsulation.Native`。接下来，styles\
  \ 属性为模板部分中声明的 `<button>` 元素指定了红色。\n\n现在修改 `index.html` 中的 `<body>` 元素，添加一个 `<button>`\
  \ 元素，如下所示：\n\n![Image](img/pg59b.jpg)\n\n启动 Angular 应用程序，你将看到组件中有一个红色的 `<button>`\
  \ 元素，而 HTML 页面中有一个深灰色的 `<button>` 元素。\n\n## Angular UI 组件\n\n本章中的代码示例向你展示了如何在 Angular\
  \ 应用程序中使用 HTML 小部件。然而，你也可以使用作为 HTML 小部件“包装器”的 Angular UI 组件。Angular 官方网站包含大量 UI\
  \ 组件集合：\n\n[`angular.io/resources/#!#UI%20Components`](https://angular.io/resources/)\n\
  \n上述网站包含指向其他工具包的链接，例如 ng-bootstrap（Bootstrap 的原生 Angular 2 指令）和 Angular Material\
  \ 2（Angular 2 的 Material Design 组件）。\n\n以下网站包含大量 Angular UI 组件（例如表格、树、菜单和图表）：\n\n\
  [`github.com/brillout/awesome-angular-components`](https://github.com/brillout/awesome-angular-components)\n\
  \n请记住，上述链接中的 UI 组件适用于 Angular 2，因此最好在最新版本的 Angular 中测试它们。此外，第 5 章 包含一些在 Angular\
  \ 4 版本中确实可用的表单相关 UI 组件。\n\n你也可以通过互联网搜索其他开源（或商业）替代方案，以确定哪种方案适合你的需求。\n\n## Angular\
  \ 的新特性\n\nAngular 的一些新特性包括在 `ngIf` 指令中支持 if/else 逻辑，以及 `NgComponentOutlet` 指令。\n\
  \n\n\n\n\n`ngIf` 指令根据表达式的值有条件地包含一个模板。接着，`ngIf` 会计算表达式，然后根据表达式为真值或假值，分别渲染 `then`\
  \ 或 `else` 模板。通常，`then` 模板是 `ngIf` 的内联模板，除非绑定到不同的值；而 `else` 模板默认为空，除非进行了绑定。更多信息请参见此处：\n\
  \n[`angular.io/docs/ts/latest/api/common/index/NgIfdirective.html`](https://angular.io/docs/ts/latest/api/common/index/NgIfdirective.html)\n\
  \n`NgComponentOutlet` 指令是一个实验性指令，提供了一种声明式方法来创建动态组件，示例如下：\n\n![Image](img/pg60.jpg)\n\
  \n你可能已经猜到，`ng-container` 指令是一个用于“分组”节点的逻辑容器。在前面的代码块中，`ng-container` 指令包含一个 `NgComponentOutlet`，其值为\
  \ `Input` 类型，而 `Input` 又引用了一个自定义组件。接下来，请确保将动态组件添加到 `ngModule` 的 `entryComponents`\
  \ 部分，如下所示：\n\n![Image](img/pg61.jpg)\n\n`NgComponentOutlet` 指令支持其他选项，详情请参见此处：\n\n\
  [`angular.io/docs/ts/latest/api/common/index/NgComponentOutlet-directive.html`](https://angular.io/docs/ts/latest/api/common/index/NgComponentOutlet-directive.html)\n\
  \n## 总结\n\n本章介绍了如何在 Angular 应用程序中使用 UI 控件。你学习了如何渲染按钮、如何渲染名称列表，以及如何从这些列表中添加和删除名称。你还了解了条件逻辑以及如何创建子组件。\n\
  \n接着，你学习了如何处理鼠标相关事件，例如 `mousemove` 事件。然后你学习了父组件与子组件之间的通信，随后讨论了表示型组件。你还学习了如何在 Angular\
  \ 应用程序中指定不同类型的 CSS 封装。最后，简要介绍了 Angular 中一些与 UI 相关的新特性。\n\n# 第 3 章：图形与动画\n\n本章介绍如何通过\
  \ HTML5 技术和各种开源工具包，在 Angular 应用程序中创建图形和动画效果。本章之所以较早地引入图形相关内容，是因为图形提供了一种有趣的学习技术的方式。即使你不打算在\
  \ Angular 应用程序中使用图形和动画，也值得浏览本章内容，以熟悉未来可能对你有用的视觉效果。\n\n你很快会看到，本章的代码示例使用了与 Angular\
  \ 无关的技术，例如可缩放矢量图形（SVG）、数据驱动文档（D3）、GreenSock 动画平台（GSAP）、层叠样式表 3（CSS3）和 jQuery。实际上，有一个示例使用了“纯”CSS3\
  \ 在 Angular 应用程序中创建动画效果，然后将其改编为使用 Angular 的 `animations` 属性创建动画效果的代码示例。阅读该示例中的代码后，你可以创建自己的变体，或许可以结合本章其他代码示例中的技术。\n\
  \n如果你是图形效果方面的新手，这可能是学习如何使用 Angular 创建图形和动画效果的最快途径。因此，你将受益于两个原因：首先，“Angular 方式”的动画效果有相当多的在线文档；其次，你无需花费大量额外时间学习如何使用无关技术在\
  \ Angular 中创建动画效果。\n\n本章的第一节讨论了 Angular 生命周期，部分原因是本章中与 GSAP 相关的代码示例需要用到其中一个生命周期方法。\n\
  \n本章的第二节展示了如何在 SVG 以及 D3 中渲染图形和创建动画效果。尽管本节中的示例非常简单，但它们为你提供了起点，以便在 Angular 应用程序中创建此类效果。\n\
  \n第三节包含基于 D3 的图形和动画效果示例。如果你还不知道，D3 是一个极其流行且非常适合数据可视化的开源工具包（因此被纳入本章）。\n\n第四节包含一个使用“纯”CSS3\
  \ 创建动画效果的示例，以及一个将 CSS3 与 jQuery 结合的代码示例。接下来你将学习如何在 Angular 应用程序中处理鼠标相关事件。最后一节简要讨论了用于创建图表和图形的\
  \ Angular 模块 `ng2-charts`。\n\n关于本章代码示例的一个重要说明：它们假设你具备 SVG、D3、GSAP、CSS3 和 jQuery\
  \ 的基础知识。如果你对这些技术不熟悉，可以阅读描述其基本功能的在线教程，或者直接深入代码示例，找出需要从在线资源中学习的概念。即使你决定跳过图形示例，也请阅读本章的第一节，该节讨论了\
  \ Angular 生命周期，并提供了有关 Angular 应用程序的有用信息。\n\n本章包含了多个 GitHub 仓库，其中包含大量类似色板的代码示例，展示了通过\
  \ SVG、D3、HTML5 Canvas、GSAP 和 CSS3 创建额外图形和动画效果的技术。顺便提一下（如果你感兴趣），还可以将 WebGL 与 Angular\
  \ 结合使用，示例如下：\n\n[`github.com/chliebel/angular2-3d-demo`](https://github.com/chliebel/angular2-3d-demo)\n\
  \n还有一点需要牢记：尽量避免使用原生解决方案进行文档对象模型（DOM）操作，例如 `document.domMethod()` 或 `$('dom-element')`，并尽量少用（如果必须使用的话）。Angular\
  \ 允许你通过 `ElementRef`、`Renderer` 和 `ViewContainer` 应用程序编程接口（API）安全地执行 DOM 操作。然而，本章中的某些代码示例确实打破了上述建议，以展示如何创建特定类型的图形效果。\n\
  \n## 注意\n\n![Image](img/disc.jpg)\n\n*当你从配套光盘复制项目目录时，如果 `node_modules` 目录不存在，请复制该项目目录内已软链接的顶层\
  \ `node_modules` 目录（大多数示例应用程序都是这种情况）。*\n\n在深入图形相关的代码示例之前，让我们先看看 Angular 生命周期方法。\n\
  \n## Angular 生命周期方法\n\nAngular 应用程序具有生命周期方法，你可以在其中放置自定义代码来处理各种事件（应用程序启动、运行等）。生命周期钩子接口定义在\
  \ `@angular/core` 库中，如下所示：\n\n- ![Image](img/greybox.jpg) `OnInit`\n- ![Image](img/greybox.jpg)\
  \ `OnDestroy`\n- ![Image](img/greybox.jpg) `DoCheck`\n- ![Image](img/greybox.jpg)\
  \ `OnChanges`\n- ![Image](img/greybox.jpg) `AfterContentInit`\n- ![Image](img/greybox.jpg)\
  \ `AfterContentChecked`\n- ![Image](img/greybox.jpg) `AfterViewInit`\n- ![Image](img/greybox.jpg)\
  \ `AfterViewChecked`\n\n每个接口都有一个方法，其方法名是接口名前缀 `ng`。例如，`OnInit` 接口有一个名为 `ngOnInit`\
  \ 的方法。Angular 按以下顺序调用这些生命周期方法：\n\n- ![Image](img/greybox.jpg) `ngOnChanges`：当输入或输出绑定值发生变化时调用\n\
  - ![Image](img/greybox.jpg) `ngOnInit`：在第一次 `ngOnChanges` 之后调用\n- ![Image](img/greybox.jpg)\
  \ `ngDoCheck`：开发者的自定义变更检测\n- ![Image](img/greybox.jpg) `ngAfterContentInit`：组件内容初始化后调用\n\
  - ![Image](img/greybox.jpg) `ngAfterContentChecked`：每次检查组件内容后调用\n- ![Image](img/greybox.jpg)\
  \ `ngAfterViewInit`：组件视图初始化后调用\n- ![Image](img/greybox.jpg) `ngAfterViewChecked`：每次检查组件视图后调用\n\
  \n\n\n\n\n![Image](img/greybox.jpg)`ngOnDestroy`：在指令销毁之前调用。\n\n由于 Angular 在创建组件时会调用该组件的构造函数，因此构造函数是初始化组件状态的便捷位置。然而，在访问子组件中定义的任何属性或数据之前，必须先初始化子组件。在这种情况下，应将自定义代码放在\
  \ `ngOnInit` 生命周期方法中，以便从子组件访问数据。\n\n完整的 Angular 生命周期事件列表位于此处：\n\n*[`angular.io/docs/ts/latest/guide/lifecycle-hooks.html`](https://angular.io/docs/ts/latest/guide/lifecycle-hooks.html)*\n\
  \n*[`learnangular2.com/lifecycle/`](http://learnangular2.com/lifecycle/)*\n\n##\
  \ Angular 生命周期方法的简单示例\n\n![Image](img/disc.jpg)\n\n将随附光盘中的 `LifeCycle` 目录复制到一个方便的位置。\n\
  \n清单 3.1 显示了 `app.component.ts` 的内容，展示了某些 Angular 生命周期方法的调用顺序。\n\n***清单 3.1：app.component.ts***\n\
  \n![Image](img/pg66.jpg)\n\n![Image](img/pg67.jpg)\n\n清单 3.1 包含了所有 Angular 生命周期方法，每个方法都包含\
  \ `console.log()`，以便您查看方法的执行顺序。\n\n通过导航到 `LifeCycle` 应用的 `src` 子目录，并执行以下命令来启动应用：\n\
  \n`ng serve`\n\n在 Chrome 会话中导航到 localhost:4200，然后打开 Chrome Web Inspector，您将在 Console\
  \ 选项卡中看到以下输出：\n\n`ngOnInit`\n\n`ngDoCheck`\n\n`ngAfterContentInit`\n\n`ngAfterContentChecked`\n\
  \n`ngAfterViewInit`\n\n`ngAfterViewChecked`\n\n`ngDoCheck`\n\n`ngAfterContentChecked`\n\
  \n`ngAfterViewChecked`\n\n下一节将说明 `ngAfterContentInit()` 方法在动态生成一组 SVG 元素后应用动画效果的实用性。\n\
