  \n```\n[sudo] npm install –g json-server\n```\n\n导航到包含 JSON 文件`posts.json`的目录，并调用以下命令：\n\
  \n```\njson-server posts.json\n```\n\n上述命令在端口 3000 启动一个文件服务器，并将`posts.json`的内容读入内存，使该数据可用于\
  \ HTTP GET 请求。\n\n![Image](img/disc.jpg)\n\n\n\n\n将配套光盘中的目录 `JSONServerGET` 复制到一个方便的位置。清单\
