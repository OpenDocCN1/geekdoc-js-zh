  \ 文件的内容\n\n![Image](img/greybox.jpg)安装移动应用\n\n![Image](img/greybox.jpg)构建应用外壳\n\n\
  ![Image](img/greybox.jpg)通过 Service Worker 添加离线功能\n\n## 创建移动项目\n\n完成以下步骤，通过 `ng`\
