  \n清单 5.9 的内容很简单：有一个 `User` 类，包含字段 `fname` 和 `lname`，分别表示每个新用户的名字和姓氏。\n\n最后，我们需要更新\
  \ `app.module.ts` 的内容，如清单 5.10 所示，其中修改的内容以粗体显示。\n\n***清单 5.10: app.module.ts***\n\
  \n![Image](img/pg143c.jpg)\n\n![Image](img/pg144a.jpg)\n\n如你所见，清单 5.10 包含两个新的 import\
