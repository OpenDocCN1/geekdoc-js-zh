  \ `Observable`。请注意，该方法会递增每个作者的 `id` 属性值，以便将它们视为不同的作者（即使新用户的名称几乎相同）。\n\n另一方面，`getAuthorData()`\
  \ 方法确实使用 `Observable` 从运行在端口 3000 的文件服务器中检索作者相关数据（如清单 4.17 所示）。\n\n> **注意：** *当前功能仅支持插入一个新作者。作为练习，请修改代码以支持插入多个新作者。*\n\
