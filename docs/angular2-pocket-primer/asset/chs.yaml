  \n## Angular 的图表工具\n\n有多个开源工具包提供图表相关功能。其中之一是 Angular 模块 `ng2-charts`，用于创建图表和图形，其主页位于：\n\
  \n[`mean.expert/2016/09/17/angular-2-chart-component-revised/`](http://mean.expert/2016/09/17/angular-2-chart-component-revised/)\n\
  \n另一个选项是 `ng2d3` 框架，它是一个 Angular2 + D3js 可组合可复用的图表框架，其主页位于：\n\n[`github.com/swimlane/ng2d3`](https://github.com/swimlane/ng2d3)\n\
  \n`ng2d3` 框架使用 Angular 来渲染和动画化 SVG 元素，并使用 D3 进行数学函数、比例尺、坐标轴和形状生成器等。请注意，Angular 负责实际的渲染。此外，`ng2d3`\
  \ 支持自定义图表，并且样式可以通过 CSS 进行自定义。\n\n请检查这些（以及其他）工具包中支持的功能，以确定哪个最适合你的需求。\n\n## 总结\n\n\
  本章向你展示了如何在 Angular 应用程序中渲染基于 SVG 的图形。你学习了如何使用 D3 和 GSAP 创建图形和动画效果，在后一种情况下，你看到了如何将自定义代码放置在\
  \ Angular 的生命周期方法中，以便在 SVG 元素生成后应用动画效果。此外，你还学习了如何在 Angular 中使用纯 CSS3 图形和动画效果。\n\n\
  # 第 4 章\n\n## HTTP 请求与路由\n\n本章将向你展示如何在 Angular 应用程序中发起 HTTP 请求，以及如何在 Angular 应用程序中使用\
  \ `Observable`。代码示例将展示如何从各种来源获取数据，以及如何从 `Promise` 创建 `Observable`。如果需要，你可以访问各种在线教程，其中包含关于\
  \ `Observable` 和 `Promise` 的介绍性材料。\n\n第一部分简要讨论了依赖注入（DI）和 `@Injectable` 装饰器。第二部分展示了如何在\
  \ Angular 应用程序中发起 HTTP 请求，以读取文本文件中定义的基于 JSON 的数据。\n\n第三部分展示了如何在 Angular 应用程序中发起\
  \ HTTP 请求，以检索 GitHub 用户的信息。你还将看到如何通过 `forkJoin()` 方法发起多个并发请求。本章的最后一部分讨论了 Angular\
  \ 应用程序中的路由。\n\n注意\n\n![Image](img/disc.jpg)\n\n*当你从配套光盘复制项目目录时，如果 `node_modules`\
  \ 目录不存在，请复制该项目目录内软链接的顶层 `node_modules` 目录（大多数示例应用程序都是这种情况）。*\n\n## Angular 中的依赖注入\n\
  \nAngular 提供了一种简单的依赖注入机制：依赖项被注入到类的构造函数中。你可以通过在类的构造函数中将每个依赖项指定为参数来注入多个依赖项。\n\nDI\
