  \ Jade（许多人认为它有些困难），那么其他模板引擎对你来说可能更容易学习。\n\n如果你不熟悉 MongoDB，请阅读一篇介绍 MongoDB 的在线教程。然后你就可以进入下一节，该节将展示如何设置一个连接到\
  \ MongoDB 数据库实例的基于 Express 的应用。\n\n## 使用 MongoDB 的 Express 应用（第一部分）\n\n本节（第一部分）解释如何设置一个使用\
  \ Mongo 的 Express 应用，随后一节（第二部分）将讨论 Express 应用中的文件。\n\n![Image](img/disc.jpg)\n\n\
  在尝试启动本节中的应用之前，请确保你的机器上已安装 Mongo、`node` 和 `nodemon`。接下来，将目录 `ExpressMongoJade` 从随附光盘复制到一个方便的位置。该目录包含服务器端代码，用于处理来自\
  \ Angular 应用 `NG2NodeApp` 的请求，该应用将在本节后面讨论。\n\n以下是启动现有访问 MongoDB 数据库中数据的 Express\
  \ 应用所需执行的步骤：\n\n1) 在你的机器上安装 Mongo。\n2) 启动 `mongod`。\n3) 执行 `cd ExpressMongoJade`。\n\
  4) 执行 `mongo load-newusers.js`。\n5) 执行 `npm install`。\n6) 执行 `npm start`。\n7) 访问\
  \ `localhost:3000`。\n\n安装 Mongo 后，将 `bin` 目录添加到命令 shell 的 `PATH` 环境变量中，然后启动 `mongod`\
  \ 守护进程：\n\n```\nmongod\n```\n\n你也可以为数据文件指定不同的目录：\n\n```\nmongod --dbpath <目录的完整路径>\n\
  ```\n\n第 4 步用种子数据填充 Mongo 数据库。如果你还没有 `node_modules` 目录（示例代码中存在），则需要执行第 5 步；第 6 步通过执行脚本\
  \ `bin/www` 启动 Express 应用。\n\n如果一切顺利，你将在浏览器会话中看到以下文本：\n\nExpress\n\nWelcome to Express\n\
  \nURL `localhost:3000/userlist` 显示 Mongo 数据库中的当前用户列表，示例如下：\n\n用户列表\n\n![Image](img/greybox.jpg)\
  \ 0 Janice | Smith\n\n![Image](img/greybox.jpg) 1 Steven | Stone\n\n![Image](img/greybox.jpg)\
  \ 2 Yuki | Tanaka\n\n![Image](img/greybox.jpg) 3 Hideki | Hiura\n\n![Image](img/greybox.jpg)\
  \ 4 Himiko | Yamamoto\n\n现在让我们看看 `package.json` 的内容（显示在清单 6.6 中），它列出了该应用的所有依赖项。\n\
  \n### 清单 6.6：`package.json`\n\n![Image](img/pg171.jpg)\n\n如你所见，清单 6.6 指定了各种 Node\
  \ 模块，例如 `express`、`jade`（一个模板引擎）和 `mongo`。请注意，版本号在某些情况下可能会发生变化，你的机器上 `node` 和 `npm`\
  \ 的版本也可能不同。\n\n## 服务器端自定义文件（第二部分）\n\n在深入探讨上一节介绍的项目中与 Angular 相关的各种文件内容之前，我们先简要浏览一些重要文件的名称及其用途。\n\
  \n首先，文件 `app.js`（清单 6.7）包含 Node 应用代码。该代码包含中间件、对 Mongo 数据库实例的引用、对 `views` 目录的引用以及\
  \ `routes` 子目录中的路由定义。你可以通过以下命令启动 `app.js`：\n\n`npm start`\n\n每当你发出一个有效的 HTTP GET\
  \ 请求时，该请求会通过一个三步过程处理：第一步涉及 Express 应用中的相应代码（在 `app.js` 中定义），该代码作为第二步调用 `routes/index.js`\
  \ 中的相应代码块，然后数据作为第三步传递给 Jade 模板。在此过程结束时，将生成一个 HTML 页面并返回给发出初始请求的客户端。\n\n按照惯例，该应用的\
  \ Jade 模板位于 `views` 子目录中。在本例中，Jade 模板包括 `userlist.jade`（用于显示所有用户）和 `index.jade`（用于显示简单消息）。每个\
  \ Jade 模板都会处理从 `routes/index.js` 中的路由接收到的数据，以填充 Jade 模板。\n\n由于 Jade 模板和数据是*动态*组合以生成\
  \ HTML 网页的，因此应用中不存在与 Jade 模板对应的 HTML 网页。\n\n另一点：匹配 `/userlist` 的路由是最复杂的路由，因为它首先从\
  \ Mongo 数据库中提取所有用户的列表，然后将该用户列表传递给 Jade 模板 `views/userlist.jade`。\n\n为了以要点形式总结步骤，逻辑流程如下：\n\
  \n1) 客户端请求到达，由 `app.js` 处理。\n2) 该请求被“路由”到 `routes/index.js`。\n3) 数据被传递给 `views`\
  \ 目录中的 Jade 模板。\n4) 生成一个 HTML 网页。\n5) 生成的 HTML 网页返回给客户端。\n\n## app.js 文件\n\n清单 6.7\
