  \n![Image](img/pg135a.jpg)\n\n清单 5.4 包含常见的导入语句。注意变量 `userForm`（类型为 `FormBuilder`）是如何在构造函数中初始化的。除了两个文本字段外，`userForm`\
  \ 还包含 `address` 元素，其类型也是 `FormBuilder`。\n\n清单 5.5 显示了 `app.module.html` 的内容，其中包含一个\
  \ Angular 表单，该表单包含与 `userForm` 变量中的字段相对应的 `<input>` 元素。\n\n### 清单 5.5：app.component.html\n\
  \n![Image](img/pg135b.jpg)\n\n![Image](img/pg136a.jpg)\n\n清单 5.5 包含非常简单的 HTML 标记，允许用户更改每个输入字段的默认值。\n\
  \n清单 5.6 显示了 `app.module.ts` 的更新内容（以粗体显示）。\n\n### 清单 5.6：app.module.ts\n\n![Image](img/pg136b.jpg)\n\
  \n清单 5.6 包含一行新代码：导入 `ReactiveFormsModule` 的语句（可与 `FormsModule` 的导入语句合并），该模块也在 `imports`\
  \ 属性中被引用。\n\n## FormGroup 与 FormArray\n\n如你所知，`FormGroup` 将 `FormControl` 元素的值聚合到一个对象中，其中控件名称作为键。Angular\
  \ 还支持 `FormArray`（`FormGroup` 的一种“变体”），它将 `FormControl` 元素的值聚合到一个数组中。\n\n`FormGroup`\
  \ 数据序列化为对象，而 `FormArray` 数据序列化为数组。如果你不知道给定组中有多少个控件，请考虑使用 `FormArray`（否则使用 `FormGroup`）。以下链接包含使用\
  \ `FormArray` 的示例：\n\n*[`alligator.io/angular/reactive-forms-formarray-dynamic-fields/`](https://alligator.io/angular/reactive-forms-formarray-dynamic-fields/)*\n\
  \n## Angular 中的其他表单特性\n\n上一节让你初步了解了 Angular 表单的模块化风格，本小节将简要介绍 Angular 中其他与表单相关的特性，例如：\n\
  \n![Image](img/greybox.jpg)表单验证\n\n![Image](img/greybox.jpg)自定义验证器\n\n![Image](img/greybox.jpg)嵌套表单\n\
  \n![Image](img/greybox.jpg)动态表单\n\n![Image](img/greybox.jpg)模板驱动表单\n\n验证器允许你对表单字段执行验证，例如指定必填字段以及字段的最小和最大长度。你还可以指定字段必须匹配的正则表达式，这对于邮政编码、电子邮件地址等非常有用。或者，你也可以通过编程方式指定验证器。\n\
  \nAngular 表单还提供了事件监听器，用于检测与表单状态相关的各种事件，如下面的代码片段所示：\n\n```\n{{myform.form.touched}}\n\
  {{myform.form.untouched}}\n{{myform.form.pristine}}\n{{myform.form.dirty}}\n{{myform.form.valid}}\n\
  {{myform.form.invalid}}\n```\n\n例如，如果有一个或多个表单字段无效，则会显示以下 `<span>` 元素：\n\n```\n<span\
  \ *ngIf=\"!myform.form.valid\">表单无效</span>\n```\n\n你还可以使用 `*ngIf` 指令显示错误消息，以显示特定字段的状态，如下所示：\n\
  \n![Image](img/pg137.jpg)\n\n![Image](img/pg138.jpg)\n\n你可以在此处找到动态 Angular 表单的示例：\n\
  \n*[`angular.io/docs/ts/latest/cookbook/dynamic-form.html`](https://angular.io/docs/ts/latest/cookbook/dynamic-form.html)*\n\
  \n你可以在此处找到模板驱动 Angular 表单的示例：\n\n*[`toddmotto.com/angular-2-forms-template-driven`](https://toddmotto.com/angular-2-forms-template-driven)*\n\
  \n对于字段相关错误消息的样式效果，可以考虑使用 `ng2-bootstrap` 或 Bootstrap（下一节将简要讨论），而不是使用纯层叠样式表（CSS）。\n\
  \n## Angular 表单与 Bootstrap 4（可选）\n\n尽管 Bootstrap 是 Angular 的外部库，但你很可能希望为 Angular\
  \ 应用程序添加一些样式效果，尤其是当它们包含包含许多控件的 Angular 表单时。例如，前面章节中的 `ReactiveForm` 应用程序提供了非常朴素的用户界面，而\
  \ Bootstrap 可以帮助你极大地改善其外观。\n\n![Image](img/disc.jpg)\n\n\n\n\n\n然而，你并不局限于 Bootstrap，因此本节仅向你展示一些使用\
  \ Bootstrap 非常容易创建的视觉效果。如果你想查看相应的代码，请将随附光盘中的 `FormBootstrap4` 目录复制到一个方便的位置，并查看 `app.component.ts`\
  \ 的内容。\n\n图 5.1 显示了启动 `FormBootstrap4` 应用程序后的输出，该应用程序展示了一个表单和带有各种颜色的按钮。\n\n至此，本章关于\
  \ Angular 表单的部分结束。下一节将讨论 Angular 管道，它提供了 Angular 应用程序中的实用功能。\n\n## 在 Angular 中使用管道\n\
  \nAngular 支持一种称为管道（类似于 Unix 管道命令“|”）的功能，它允许你根据条件逻辑（由你指定）过滤数据。Angular 支持内置管道、异步管道以及自定义管道。接下来的两节将展示一些内置管道的示例，随后介绍异步管道。另外单独一节将展示如何定义自定义\
  \ Angular 管道。\n\n![Image](img/pg139.jpg)\n\n***图 5.1*** 一个使用 Bootstrap 4 的 Angular\
  \ 应用程序。\n\n### 使用内置管道\n\nAngular 支持多种内置管道，例如 `DatePipe`、`UpperCasePipe`、`LowerCasePipe`、`CurrencyPipe`\
  \ 和 `PercentPipe`。这些名称直观的管道提供了你所期望的功能：`DatePipe` 处理日期值，`UpperCasePipe` 将字符串转换为大写，等等。\n\
  \n作为一个简单示例，假设变量 `food` 的值为 pizza。那么以下代码片段将显示字符串 PIZZA：\n\n`<p>I eat too much {{\
  \ food | UppercasePipe }} </p>`\n\n你还可以为某些 Angular 管道设置参数，示例如下：\n\n`<p>My brother's\
  \ birthday is {{ birthday | date:\"MM/dd/yy\" }} </p>`\n\n事实上，你甚至可以链式使用管道，如下所示：\n\
  \n`My brother's birthday is {{ birthday | date | uppercase}}`\n\n在上面的代码片段中，`birthday`\
  \ 是一个自定义管道（由你编写）。再举一个例子，假设一个 Angular 应用程序包含变量 `employees`，它是一个基于 JSON 的数组。你可以通过以下代码片段显示该数组的内容：\n\
  \n`<div>{{employees | json }}</div>`\n\n### AsyncPipe\n\nAngular 的 `AsyncPipe` 接受一个\
  \ `Promise` 或 `Observable` 作为输入，并自动订阅该输入，最终返回发出的值。此外，`AsyncPipe` 是有状态的：该管道会保持对输入\
  \ `Observable` 的订阅，并在值到达时持续传递。\n\n以下代码块展示了如何显示股票报价，其中变量 `quotes$` 是一个 `Observable`：\n\
  \n![Image](img/pg140.jpg)\n\n请记住，`AsyncPipe` 有两个优点。首先，`AsyncPipe` 减少了样板代码。其次，无需手动订阅或取消订阅\
  \ `Observable`（后者有助于避免内存泄漏）。\n\n另一点：Angular 不提供用于过滤或排序列表的管道（即没有 `FilterPipe` 或 `OrderByPipe`），因为这两者都可能消耗大量计算资源，从而对应用程序的感知性能产生不利影响。\n\
  \n下一节的代码示例将展示如何创建一个自定义管道，该管道根据自定义代码中定义的条件逻辑显示过滤后的用户列表。\n\n### 创建自定义 Angular 管道\n\
  \n![Image](img/disc.jpg)\n\n将随附光盘中的 `SimplePipe` 目录复制到一个方便的位置。清单 5.7 显示了 `app.component.ts`\
  \ 的内容，该文件演示了如何在 Angular 应用程序中定义和使用自定义管道，以显示硬编码用户列表的子集。\n\n***清单 5.7: app.component.ts***\n\
  \n![Image](img/pg141.jpg)\n\n![Image](img/pg142a.jpg)\n\n清单 5.7 引用了自定义组件 `User`\
  \ 和自定义组件 `MyPipe`，其中后者在 `pipes` 属性的值数组中指定。`template` 属性显示两个无序的用户名列表。第一个列表显示完整列表，当用户（用鼠标）悬停在第一个列表中的某个用户上时，通过\
  \ `mouseEvent()` 方法（在 `AppComponent` 类中定义）中的代码将当前用户设置为该用户。请注意，`AppComponent` 类中的构造函数使用一组用户初始化了\
  \ `userList` 数组，每个用户都是自定义组件 `User` 的一个实例。\n\n第二个列表根据自定义管道 `MyPipe` 中的条件逻辑显示过滤后的用户列表。清单\
