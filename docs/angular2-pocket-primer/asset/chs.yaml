  \n## 使用 @Input、@Output 和 EventEmitter\n\n\n\n\nAngular 支持使用 `@Input` 和 `@Output`\
  \ 注解在组件之间传递值。`@Input` 注解用于从父组件接收值的变量，而 `@Output` 注解则在给定变量的值被修改时，将数据从组件发送（或“发射”）到其父组件。\n\
  \n此代码示例的输出结果并不出人意料。然而，该代码示例的目的是让你关注一些不太直观的代码片段（尤其是在 `app.module.ts` 中）。此外，该代码示例在\
  \ TypeScript 编译器 2.1.5 版本下能正常工作，但未来版本可能需要对代码进行修改（请记住这一点）。\n\n![Image](img/disc.jpg)\n\
  \n现在，将随附光盘中的 `ParentChildEmitters` 目录复制到一个方便的位置。清单 2.27 显示了 `app.component.ts` 的内容，向你展示如何从父组件更新子组件属性的值。\n\
  \n### 清单 2.27：app.component.ts\n\n![Image](img/pg54.jpg)\n\n清单 2.27 中的模板属性包含一个顶级\
  \ `<div>` 元素，该元素内有一个 `<child-comp>` 元素，它有两个属性，如下所示：\n\n```\n<child-comp [childValue]=\"\
  parentValue\" (childValueChange)=\"reportValueChange($event)\">\n</child-comp>\n\
  ```\n\n`[childValue]` 属性将 `parentValue` 的值赋给 `childValue` 的值。请注意，变量 `parentValue`\
  \ 定义在 `AppComponent` 中，而变量 `childValue` 定义在 `ChildComponent` 中。*这就是如何将值从父组件传递给子组件*。\n\
  \n接下来，`childValueChange` 属性被赋值为从 `ChildComponent` 返回到当前（“父”）组件的值。请记住，只有当 `childValue`（在子组件中）的值被修改时，`childValueChange`\
  \ 属性才会更新。*这就是如何将值从子组件传递给父组件*。\n\n请记住以下几点：子组件*必须*定义一个类型为 `EventEmitter` 的变量（例如 `childValueChange`），以便将修改后的值从子组件“发射”到父组件。\n\
  \n清单 2.27 的下一部分是一个简单的构造函数，后面跟着方法 `reportValueChange`，该方法包含一条 `console.log()` 语句。\n\
  \n清单 2.28 显示了 `childcomponent.ts` 的内容，向你展示如何从父组件更新子组件属性的值。\n\n### 清单 2.28：childcomponent.ts\n\
  \n![Image](img/pg55.jpg)\n\n![Image](img/pg56a.jpg)\n\n清单 2.28 包含一个模板属性，其中有一个“递减”\
  \ `<button>` 元素、一个用户可以输入数字的 `<input>` 字段，以及一个“递增” `<button>` 元素。第一个 `<button>` 元素增加\
  \ `<input>` 字段的值，而第二个 `<button>` 元素则减少该值。\n\n导出的类 `ChildComponent` 包含数值变量 `childValue`，该变量通过\
  \ `@Input()` 装饰，其值由父组件设置。\n\n如你所见，方法 `increment()` 和 `decrement()` 分别增加和减少 `childValue`\
  \ 的值。在这两种情况下，修改后的 `childValue` 值随后通过以下代码块“发射”回父组件：\n\n```\nthis.childValueChange.emit({\n\
  \  value: this.childValue\n})\n```\n\n按照清单 2.29 所示更新 `app.module.ts` 的内容，*这与本章前面示例中的代码不同*。\n\
