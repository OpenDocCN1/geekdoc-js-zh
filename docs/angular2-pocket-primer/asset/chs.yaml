  \n## 渐进式 Web 应用（可选）\n\n最近，PWA 在移动社区中引起了极大的兴趣。如果你不熟悉 PWA，以下是维基百科的一段引用：\n\n*渐进式 Web\
  \ 应用（PWA）是一个术语，用于表示一种新的软件开发方法。与传统应用不同，渐进式 Web 应用可以被视为常规网页（或网站）与移动应用的混合体。这种新的应用生命周期模型结合了大多数现代浏览器提供的功能以及移动体验的优势。（[`en.wikipedia.org/wiki/Progressive_web_app`](https://en.wikipedia.org/wiki/Progressive_web_app)）*\n\
  \nPWA 是类似原生移动应用的应用程序，由 HTML5、CSS3、JavaScript 和 Service Worker 创建。PWA 加载速度快，可以离线工作，并支持推送通知。PWA\
  \ 的图标会出现在移动设备上，就像“常规”的原生移动应用一样。然而，PWA 在任何应用商店中都是不可发现的，根据你的视角，这可能是优势（例如，省去了发布流程）或劣势（例如，其他人找不到你的\
  \ PWA，可能会减少流量）。\n\n目前，Chrome 支持 PWA，未来其他浏览器也可能在某个时候支持 PWA。\n\n## Web Worker 和 Service\
  \ Worker\n\nService Worker 提供了 Web Worker 的功能以及额外的特性。你可以在此处了解 Service Worker：\n\n\
  [`developers.google.com/web/fundamentals/getting-started/primers/service-workers?hl=en`](https://developers.google.com/web/fundamentals/getting-started/primers/service-workers?hl=en)\n\
