  \nApollo 相对于 Relay（稍后讨论）的优势之一是能够移除 GraphQL 查询返回的数据集中的重复子树。然而，Relay 由 Facebook 开发，是下一节的主题。\n\
  \n## 什么是 Relay？\n\nRelay 是 Facebook 基于 JavaScript 的技术，作为需要从服务器获取数据的 ReactJS 组件的“包装器”。Relay\
  \ 主页位于：\n\n*[`github.com/facebook/relay`](https://github.com/facebook/relay)*\n\n\
  ReactJS 应用程序可以使用 Relay（本章稍后讨论）向 GraphQL 发出数据请求。此外，GraphQL 可以向不使用 Relay 的客户端（如 Angular\
  \ 客户端）提供数据。\n\n注意\n\n*GraphQL 可以独立于 Relay 使用，而 Relay 不能在没有 GraphQL 的情况下使用。*\n\n\
  作为对比，基于 REST 的请求返回实体的数据（例如客户的数据），而 Relay 允许你请求实体的单个字段（例如客户的名字和姓氏）。简而言之，你可以将 Relay\
  \ 视为 REST 的更细粒度替代方案。\n\nRelay 使用网络层与 GraphQL 服务器通信。Relay 提供了一个与`express-graphql`兼容的网络层，并且随着开发，网络层将添加更多功能。\n\
  \n以下链接包含 Relay 的交互式教程：\n\n*[`www.learnrelay.org/`](https://www.learnrelay.org/)*\n\
  \n注意\n\n*GraphQL 可以独立于 Relay 使用，而 Relay 不能在没有 GraphQL 的情况下使用。*\n\n## Relay Modern\n\
  \nFacebook 在 2017 年初发布了 React Fiber，这是对 ReactJS 的大规模重写，目标是提高性能和可扩展性。Facebook 还重写了\
  \ Relay，称为 Relay Modern。Relay Modern 的新功能包括静态查询、AOT（提前）编译和内置垃圾回收。\n\nRelay Modern\
  \ 还提供了一个兼容性 API，以防你已经在使用旧版本的 Relay。\n\n## 总结\n\n本章从 Flux 开始，这是一种 Web 应用程序的单向模式。你还学习了\
  \ Redux，它是 Flux 模式的一种实现。此外，你了解了如何在 Angular 应用程序中使用 Flux/Redux。接着你学习了 Relay 和 GraphQL，两者均由\
  \ Facebook 开发。然后你看到了一个使用 GraphQL 检索基于 JSON 文件定义的服务器端数据的应用程序示例。\n\n# 第 8 章：Angular\
  \ 与移动应用\n\n本章将探讨使用多种工具包进行移动应用程序开发，包括 Ionic 2、Ionic 2 与 NativeScript、Angular 与 NativeScript，以及\
  \ Angular 与 React Native。\n\n\n\n\n\n本章的第一部分讨论 Ionic 2。Ionic 2 扩展了 Apache Cordova，后者是\
  \ Adobe 旗下 PhoneGap 的开源对应产品。由于 Ionic 2 依赖于 Cordova，因此你可以开发跨平台的混合移动应用。此外，Ionic 2\
  \ 使用 Angular 作为用户界面（UI）层，这也是将其纳入本章的原因。你将学习如何创建一个显示用户列表的简单 Ionic 2 移动应用。请注意，Ionic\
  \ 2 是本章中唯一依赖 WebView 的工具包；本章中所有其他技术都生成跨平台的原生移动应用（即不涉及文档对象模型 [DOM]）。\n\n本章的第二部分向你介绍\
  \ NativeScript，你可以将其与 Ionic 2 结合使用来创建原生移动应用。该工具包生成不涉及 DOM 的原生应用，这与 Facebook 的 React\
  \ Native 类似。\n\n第三部分将 NativeScript 与 Angular 结合，创建跨平台的原生移动应用。\n\n第四部分可能会让你感到惊讶：它概述了用于开发跨平台原生移动应用的\
  \ React Native。虽然 React Native 最初是与 ReactJS 结合用于 UI 层，但你可以将 React Native 与 Angular（用于\
  \ UI 层）结合，创建跨平台的原生移动应用。\n\n本章的第五部分讨论 Angular Mobile Toolkit，它基于 Angular CLI，因此你可以使用\
  \ `ng` 命令行工具创建应用。该工具包生成基于渐进式 Web 应用（PWA）的移动应用，但本章不讨论 PWA。\n\n## 使用 Ionic 2 进行移动开发\n\
  \nAngular 旨在支持多平台应用，包括移动应用。还有一些基于 Angular 的工具包用于开发移动应用。一个著名的工具包是 Ionic 2，其主页位于：\n\
  \n* [`ionic.io`](https://ionic.io)\n\nIonic 2 构建在 Angular 之上，并利用了 Cordova 工具包。Ionic\
