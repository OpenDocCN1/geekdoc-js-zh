  \ Angular 应用程序的根，而后者在 TypeScript 文件中定义。\n\n## 使用微服务（可选）\n\n本节包含对微服务的精简和简化概述。你将了解微服务的一些优点和缺点，然后是一个使用微服务的\
  \ Angular 应用程序示例。尽管 Angular 支持微服务（因此这是本章的相关主题），但你可以跳过本节而不会影响连续性。\n\n### 微服务的优点\n\
  \n微服务架构将单体应用分解为一组服务，而不减少原始应用的功能。每个服务通过其暴露的应用程序编程接口（API）可访问。使用微服务简化了开发、维护和增强“单一用途”服务的过程。\n\
  \n其次，微服务允许以独立的方式开发服务。每个新服务可以使用最适合该服务的技术来编写（这意味着当前技术不是强制性的）。\n\n第三个优点是微服务可以独立于其他微服务进行部署。第四，服务可以彼此独立地扩展。\n\
  \n### 微服务的缺点\n\n许多独立微服务的集合可能会产生复杂性。微服务之间的通信需要决定进程间通信的方式。此外，微服务的分布式特性要求处理由于超时和其他原因可能出现的故障。\n\
  \n例如，如果面向事务的微服务与多个数据库交互，那么处理和协调这些事务可能会很复杂。请记住，采用微服务的主要目标之一是减少大型单体应用中可能出现的相互依赖的复杂性。\n\
  \n有些人认为微服务是一种“细粒度的面向服务架构（SOA）”。然而，SOA 需要 Web 服务定义语言，该语言定义服务端点并且是强类型的，而微服务具有非常简单的连接和智能端点。另一个重要区别是\
  \ SOA 通常是无状态的，而微服务是有状态的，并将数据和逻辑保持在一起。总的来说，SOA 复杂且重量级，而微服务是更简单、轻量级的独立进程。\n\n## 总结\n\
  \n本章向你展示了如何创建简单的基于 Express 的 Node 应用程序，这些应用程序可以处理来自 Angular 应用程序的请求。你了解了如何使用 NoSQL\
  \ 数据库 MongoDB 来存储和检索 Web 应用程序的数据。你还学习了如何在不同端口号上启动多个 Express 应用程序，以便为 Angular 应用程序提供数据。然后你看到了微服务的概述，它可以与\
  \ Angular 无缝协作。最后，你学习了一些关于 Angular Universal 的基本概念，它涉及 Angular 代码的服务器端渲染。\n\n# 第\
  \ 7 章：*FLUX、REDUX、GRAPHQL、APOLLO 和 RELAY*\n\n本章对基于 JavaScript 的技术 Flux、Redux、GraphQL、Apollo\
  \ 和 Relay 进行了广泛介绍。除了 Apollo（由 Meteor 支持）之外，上述列表中的其他技术均由 Facebook 开发。尽管这些技术用于基于 ReactJS\
  \ 的 Web 应用程序，但它们也可以用于 Angular 应用程序（因此本章内容）。\n\n由于你可以在不使用本章任何内容的情况下创建 Angular 应用程序，因此主要目的是解释上述技术中的一些概念。此外，本章只有一个完整的代码示例（参见讨论\
  \ Apollo 的部分）。尽管网上有各种结合 Angular 和 Redux 的代码示例，但请注意，其中许多是为早期版本的 Angular 编写的，可能需要一些修改才能与\
  \ Angular 4.0.0 配合使用。\n\n本章的第一节描述了由 Facebook 设计的 Flux 架构，它有许多实现（包括 Redux 和 Relay）。Flux\
  \ 架构最初是为开发客户端 Web 应用程序而创建的。由于 Flux 与语言无关，你可以在基于 React 的应用程序、Angular 应用程序等中使用 Flux\
  \ 模式。注意，你也会看到 Flux 架构被描述为 Flux 模式，或许就像模型-视图-控制器（MVC）也是一种模式一样。\n\n第二节讨论 Redux，这是一个工具包，其目的是将应用程序状态存储在应用程序外部。有趣的是，这种存储应用程序状态的方法有一些优点，你将在本章后面看到。你将看到一个很好的示例，说明如何在\
  \ Angular 应用程序中使用 Redux 来跟踪项目。\n\n\n\n第三部分描述了 GraphQL，它是一个接收 Relay 请求的 JavaScript\
  \ 工具包。GraphQL 通过从数据存储（可以是关系型数据存储或 NoSQL 数据存储）中检索匹配的数据来处理这些请求。本部分包含一个使用 GraphQL 的基本\
  \ Angular 应用程序。\n\n第四部分讨论了 Apollo，它是客户端 JavaScript，用于向驻留在服务器上的 GraphQL 工具包发送数据请求。由于\
  \ Apollo 相对于 Relay 的优势，它最近获得了关注。\n\n需要记住的一点是，中大型 Web 应用程序从 Redux 或 GraphQL 等工具包中获益的程度要大于小型\
  \ Web 应用程序（在小型应用中 MobX 可能更合适）。因此，如果你目前正在开发基本的 Web 应用程序，本章的部分内容可能对你来说是可选的。\n\n##\
  \ 什么是 Flux？\n\nFlux 模式基于其他设计模式（如观察者模式和命令查询职责分离[CQRS]）。Flux 为开发复杂应用程序提供了良好的基础。Flux\
  \ 的主要目的是支持单向数据流。观看此视频获取 Flux 技巧：\n\n*[`angular-university.io/course/angular2-ngrx`](https://angular-university.io/course/angular2-ngrx)*\n\
  \n![Image](img/pg188.jpg)\n\n***图 7.1*** Flux 模式的元素。\n\nFlux 模式的组件包括 Action、Dispatcher\
  \ 和 Store。这些组件之间的关系如下所示：\n\nAction --> Dispatcher --> Store --> View（然后回到 Action）\n\
  \n图 7.1 中的图表展示了 Flux 架构（复制自 GitHub 仓库*[`github.com/lgvalle/android-flux-todo-app`](https://github.com/lgvalle/android-flux-todo-app)*）。\n\
  \n以下是对 Flux 模式的一段描述：当用户在 Web 应用程序中执行一个手势（例如点击按钮）时，该手势被转换为一个 Action，该 Action 通过(1)一个描述动作类型的`type`和(2)一个包含新值的`value`来“建模”状态变化。该\
  \ Action 被发送到 Dispatcher，Dispatcher 又将 Action 和当前 Store 发送给适当的 reducer 函数来处理该 Action。reducer\
  \ 函数包含一个 switch 语句和条件逻辑，以确定哪个 case 语句与 Action 类型匹配，然后执行匹配的 case 语句中的代码，最后从 reducer\
  \ 函数返回更新后的 Store（有时 Store 不变）。接下来，注册用于检测状态相关变化的 View 对象将相应地更新 Web 页面的内容。每当用户在 Web\
  \ 应用程序中执行手势时，这个过程就会重复。更一般的场景涉及多个 reducer 和多个 store，这意味着 Dispatcher 中需要额外的逻辑。此外，Action\
  \ 既可以来自服务器，也可以来自用户发起的事件。\n\n**注意**\n\n*在基于 Flux 的 Web 应用程序中，应用程序组件不会直接相互通信。*\n\n\
  注意，上述数据流*始终*是单向的。此外，数据*只能*在 reducer 中的一个 case 语句中更新，这反过来简化了调试过程。\n\n## 什么是 Action？\n\
  \nAction 是一个包含基于 JSON 的数据的 JavaScript 对象，具有一个名为`type`的必需属性。Action 的目的是指定需要在应用程序状态中修改什么以创建新状态。将\
  \ Action 视为包含用于更新应用程序状态的信息或指令的“消息”（例如添加新用户、删除用户等）。关键点：不是修改当前状态，而是通过将 action“应用”到当前状态来创建一个新对象。\n\
  \n简而言之，一个应用程序涉及许多 Action（作为异步操作执行）：一个 Dispatcher、一个或多个 Store 以及一个或多个 View 组件。Action\
  \ 通常包含与 View 组件中发生的用户发起事件（如用户输入、按键、鼠标相关事件等）相关联的数据。\n\n尽管 Action 可以是字符串或数组，但 Action\
  \ 通常是基于 JSON 的对象字面量。例如，一个涉及新用户的 ADD 操作的 Action 可能如下所示：\n\n```\n{ type: 'ADD_USER',\
  \ value: 'John Smith' }\n```\n\n上述 Action（通过 dispatcher）被转发给一个 reducer 函数，该函数将新用户添加到外部数据存储中。你将在本章后面看到此用例的更多细节。\n\
  \n另一点需要记住的是，Action 的属性可以有不同的名称。例如，以下 Action 等同于前面的代码片段：\n\n```\n{ kind: 'ADD_USER',\
  \ data: 'John Smith' }\n```\n\n请注意，你有时会看到一个 JavaScript“辅助”函数（称为“Action Creator”），它返回一个\
  \ Action，示例如下：\n\n![Image](img/pg190.jpg)\n\n## 什么是 Reducer？\n\nReducer 是一个没有副作用的\
  \ JavaScript 函数（也称为“纯函数”），其目的是根据 Action 对象的内容将应用程序的当前状态转换为新状态。通常，每个动作类型关联一个函数。Reducer\
  \ 是改变应用程序状态的 JavaScript 函数。\n\nJavaScript 的`Array`对象有一个`reduce()`方法，示例如下：\n\n```\n\
  function sum(a,b) { return a + b }\n\n[1,2,3,4].reduce(sum,0);\n```\n\nRedux 利用\
  \ JavaScript 的`reduce()`方法的概念如下：`reducer()`方法有一个 state 参数和一个 action 参数，并带有返回新状态的条件逻辑。\n\
  \n## Store 与应用程序状态\n\nStore 是一个容器，它保存全局状态树（一个 JavaScript 对象）并分发 actions。Store 还保存\
  \ reducers，并提供对状态变化的订阅。\n\n请记住，基于 Flux 的 Web 应用程序将应用程序状态维护在应用程序*外部*，并且当应用程序状态发生变化时，应用程序组件之间不会相互通信；相反，它们从\
  \ Store 的内容中获取应用程序状态。由于多个组件之间的交叉通信可能引入难以发现的错误，Flux 架构消除了这个错误源（想象一下一个包含数百个具有交叉通信的组件时可能发生的情况）。\n\
  \n由于 reducing 函数是唯一可以更新 Store 的地方，因此当发生与数据相关的错误时，你知道应该去哪里查找。\n\n## 什么是 Redux？\n\n\
  Redux 是由 Dan Abramov 创建的开源工具包，它实现了 Flux 模式（后者由 Facebook 创建）；其主页位于：\n\n*[`github.com/reactjs/react-redux`](https://github.com/reactjs/react-redux)*\n\
  \nRedux 由 Actions（用于消息）、Reducers（用于改变状态）和 Store（用于保存应用程序的全局状态）组成，这些组件共同实现了 Flux\
  \ 模式。\n\n一个说明 Redux 作用的简单用例是一个显示姓名列表并允许用户添加新姓名的 Web 应用程序。数据流涉及创建一个 action（用于添加用户），将该\
  \ action 分派给实际添加新用户的方法，然后用应用程序的新状态更新 store，最后更新 Web 页面以显示更新后的姓名列表。\n\nRedux 的 DevTools（支持热重载、动作回放和可自定义用户界面）可在此处下载：\n\
  \n*[`github.com/gaearon/redux-devtools`](https://github.com/gaearon/redux-devtools)*\n\
  \n## 应用程序数据的数据结构\n\n\n\n除了将应用状态存储在 store 中之外，还有一个问题：应该使用哪些数据结构来处理应用数据。适用于服务器端代码或视图组件的数据结构，未必最适合\
  \ store 中数据的结构。换句话说，你不能简单地模仿 store 中数据的相同结构（尽管这很诱人），并期望应用能够高效运行。有一篇文章讨论了这一点，链接如下：\n\
  \n[`hackernoon.com/avoiding-accidental-complexity-when-structuring-your-app-state-6e6d22ad5e2a#.jzmngm3cf`](https://hackernoon.com/avoiding-accidental-complexity-when-structuring-your-app-state-6e6d22ad5e2a#.jzmngm3cf)\n\
  \n## 何时应该使用 Redux？\n\n虽然对这个问题的答案各不相同，但 Dan Abramov 本人表示，人们往往过早地开始使用 Redux。也许使用 Redux\
  \ 的正确时机是当应用的复杂性需要 Redux 时。然而，这个回答又引出了一个新问题：什么才是合适的复杂性？\n\n幸运的是，有一些指导原则可以帮助你决定是否使用\
  \ Redux。以下链接也讨论了 Redux 的使用：\n\n[`jamesknelson.com/5-types-react-application-state/`](http://jamesknelson.com/5-types-react-application-state/)\n\
  \n这篇文章绝对值得花时间阅读，以了解上述编号列表的细节。\n\n还有一些额外的考虑因素。例如，当你热重载组件时，状态会从现有的组件树中移除。因此，如果应用的状态在外部维护，那么该状态可以随更新后的组件一起重新加载，从而保持状态的一致性。其他好处包括更好的测试工具、集中化的逻辑、时间旅行调试以及可预测的状态更新。\n\
  \n顺便提一下，除了 Redux 之外，还有许多 Flux 的实现，因此你确实有选择（到目前为止，Redux 是最流行的一种）。另一种选择是 Mobx，本章后面会讨论。\n\
  \n## Reducers 的简单示例\n\n正如你将在本节中看到的，reducers 中的自定义代码通常包含一个带有多个 case 语句（以及一个 default\
  \ case）的 switch 语句。以下代码块是一个 reducer 的通用示例，它接受一个 `state` 参数（初始化为空对象），后跟一个 `action`\
  \ 参数：\n\n![Image](img/pg193a.jpg)\n\ncase 语句的细节显然是特定于应用的。以下小节展示了状态为数字计数器的 reducers，以及状态为字符串数组的示例。请注意，某些代码示例使用了\
  \ JavaScript 中的“展开”运算符。\n\n### 用于加减数值的 Reducer\n\n在 HTML 网页中，JavaScript 变量可以跟踪一个数字计数器。现在让我们学习如何使用\
  \ reducer 函数来跟踪这样一个计数器。计数器的 `state` 就是它的当前值，该值将与网页中的 JavaScript 代码分开“存储”。\n\n假设我们有一个包含两个按钮的网页：一个按钮从计数器减\
  \ 1，另一个按钮给计数器加 1（计数器的初始值为 0）。\n\nACTION 元素 `{type:'ADD'}` 和 `{type:'SUBTRACT'}`\
  \ 分别对应加按钮和减按钮。\n\n该网页的 reducer 由一个 switch 语句组成，其中包含三个 case 语句，分别处理 ADD、SUBTRACT\
  \ 和一个默认操作，如下所示：\n\n![Image](img/pg193b.jpg)\n\n![Image](img/pg194a.jpg)\n\n注意\n\n\
  *Reducers 同步处理状态变化。*\n\n上述示例的通用版本涉及一个包含 `amt` 字段的 ACTION 元素，其数值是要从计数器中增加或减少的量。在这种情况下，典型的\
  \ ACTION 是 `{type:'ADD', amt:3}` 或 `{type:'SUBTRACT', amt:5}`，其中 `amt` 的值在其他地方填充。此外，修改后的\
  \ `CountReducer` 代码块如下：\n\n![Image](img/pg194b.jpg)\n\n实际应用中的 reducer 与上述 `CountReducer`\
  \ 类似：区别在于具体的 case 语句以及每个 case 语句中执行的代码。\n\n### 用于从数组中添加/删除字符串的 Reducer\n\n以下代码块定义了一个\
  \ reducer，它可以向数组中添加项（`ADD_ITEM`）和从数组中删除项（`DEL_ITEM`）：\n\n![Image](img/pg194c.jpg)\n\
  \n在上述代码块中，通过创建一个包含当前状态的新数组，并将该项追加到该数组中，从而添加一个新项。注意展开运算符“...”如何提供了一种简洁的方式来列出当前状态中的项。\n\
  \n通过 `filter()` 方法中的条件逻辑删除现有项：返回当前状态中除该项之外的所有内容。\n\n### Redux Reducers 是同步的\n\n\
  请记住关于 Redux reducers 的以下几点。首先，上一节中的 `arrReducer()` 方法是一个纯函数，因为该函数中没有发生突变；不需要外部变量，并且创建了一个新状态，而不是使用数组的\
  \ `push()` 方法（这是一个修改器）。\n\n其次，reducers 是同步的；但是，如果你需要一个执行异步计算的 reducer，可以使用 `redux-observable`。第三，`reducer()`\
  \ 中的数据逻辑与视图层分离。第四，可以在应用中定义多个 reducers。\n\nRxFlux 是一个基于 RxJS 的 Flux 实现，其主页位于：\n\n\
  [`github.com/fdecampredon/rx-flux`](https://github.com/fdecampredon/rx-flux)\n\n\
  关于 Redux 的一个非常好的介绍是 Dan Abramov 制作的这个视频系列：\n\n[`egghead.io/series/getting-started-with-redux`](https://egghead.io/series/getting-started-with-redux)\n\
  \n## Redux Store\n\nRedux Store 维护应用的状态，该状态表示为一个全局状态树。`Store` 提供了两个函数：`getState()`\
  \ 和 `dispatch()`。\n\n`getState()` 函数允许应用的不同部分访问与状态相关的信息。\n\n关于 Store 还有另外两点需要记住。首先，store\
  \ 持有 reducers，并在 actions 被派发时以“广播”方式调用它们。其次，store 提供了一种订阅机制，当状态树被修改时，通知应用的各个部分（如\
  \ UI）。\n\n以下代码块展示了如何创建一个 store：\n\n```\nimport { createStore } from 'redux'\n\n\
  import RootReducer from '../Reducers/'\n\nconst store = createStore(RootReducer)\n\
  ```\n\n## 中间件\n\nRedux Store 还可以通过中间件形式的插件进行扩展。有多种类型的第三方中间件可用于执行各种任务，例如持久化、日志记录和流程控制。\n\
  \n总结一下，Redux 的工作方式如下：\n\n![Image](img/greybox.jpg)应用状态封装在一个名为 `state` 的 JavaScript\
  \ 对象中。\n\n![Image](img/greybox.jpg)状态保存在 store 中。\n\n![Image](img/greybox.jpg)store\
  \ 是不可变的，永远不会被直接更改。\n\n![Image](img/greybox.jpg)用户交互触发 actions，这些 actions 描述事件并封装数据。\n\
  \n一个名为 reducer 的函数将旧状态和 action 结合起来，创建状态的新版本，该版本保存在 store 中。Redux 通过将功能代码与表示代码分离，简化了状态管理的任务。在\
  \ Angular 应用中使用 Redux 时，更简单的方法是使用 Redux 的实现，例如 `ngrx-store`。\n\n[`github.com/mgechev/angular-seed`](https://github.com/mgechev/angular-seed)\n\
  \n关于 `ngrx-store` 的详细描述（同时也强化了本章第一部分的内容）可以在这里找到：\n\n[`gist.github.com/btroncone/a6e4347326749f938510`](https://gist.github.com/btroncone/a6e4347326749f938510)\n\
  \n\n\n\n这里有一部关于 ngrx-store 的免费 10 分钟视频（截至本书出版时）：\n\n*[`egghead.io/lessons/angular-2-ngrx-store-in-10-minutes`](https://egghead.io/lessons/angular-2-ngrx-store-in-10-minutes)*\n\
  \n至此，关于 Angular 应用和 Redux 的部分就结束了。如果你认为 Redux 对你的需求来说过于复杂，那么 MobX 是 Redux 的一个替代方案，它比\
  \ Redux 更简单。MobX 被认为是 Redux 的流行（且更简单）替代方案之一，其主页位于：\n\n*[`github.com/mobxjs/mobx`](https://github.com/mobxjs/mobx)*\n\
  \n## 什么是 GraphQL？\n\nGraphQL 是 Facebook 推出的一种数据查询语言和运行时，可以向移动和 Web 应用发送数据；其主页位于：\n\
  \n*[`graphql.org/`](http://graphql.org/)*\n\nGraphQL 是一种规范，这意味着它可以与任何平台和任何语言一起使用。Facebook\
  \ 维护着其参考实现，该实现是用 JavaScript 编写的。GraphQL 规范位于：\n\n*[`facebook.github.io/graphql/`](http://facebook.github.io/graphql/)*\n\
  \nGraphQL 模式充当数据存储的“包装器”，数据存储可以包含 NoSQL 数据和关系数据。例如，以下链接解释了如何将 GraphQL 与 Mongo 一起使用：\n\
  \n*[`www.compose.io/articles/using-graphql-with-mongodb/`](https://www.compose.io/articles/using-graphql-with-mongodb/)*\n\
  \nFacebook 的 StarWars 模式位于：*[`goo.gl/oCrK7F`](https://goo.gl/oCrK7F)*\n\n以下是 GraphQL\
  \ 的几个方面：\n\n- ![Image](img/greybox.jpg)查询语言\n- ![Image](img/greybox.jpg)查询语义\n-\
  \ ![Image](img/greybox.jpg)查询变量\n- ![Image](img/greybox.jpg)变更\n- ![Image](img/greybox.jpg)片段\n\
  \nGraphQL 查询语言是 GraphQL 的主要部分，你将在后续章节中看到其示例。GraphQL 查询变量使你可以向 GraphQL 查询传递值，这显然比使用硬编码值更好。变更允许你更改\
  \ GraphQL 背后的数据集。变更与 GraphQL 查询中的字段非常相似，但 GraphQL 假定变更具有副作用并会更改模式背后的数据集。GraphQL\
  \ 片段提供了一种机制，用于对常用字段进行分组并重用它们。一些已实现 GraphQL 的编程语言位于：\n\n*[`graphql.org/code/`](http://graphql.org/code/)*\n\
  \n使用 GraphQL 的公司包括 Coursera、Intuit、Pinterest 和 Shopify。此外，GitHub（从 2016 年开始）支持 GraphQL，并已发布其公共\
  \ GraphQL API：\n\n*[`githubengineering.com/the-github-graphql-api/`](http://githubengineering.com/the-github-graphql-api/)*\n\
  \n## GraphQL 与 REST 对比\n\n正如你将在后续章节中看到的，GraphQL 允许你指定细粒度的查询，这些查询仅返回客户端应用所需的数据。请记住关于涉及\
  \ GraphQL 的应用的以下要点：在 GraphQL 中，数据获取细节由客户端决定，而在使用表述性状态转移（REST）的应用中，数据获取细节由服务器决定。\n\
  \n这种方法有几个优点：\n\n- ![Image](img/greybox.jpg)不会向客户端发送冗余数据。\n- ![Image](img/greybox.jpg)在服务器上添加新数据字段不会影响查询。\n\
  - ![Image](img/greybox.jpg)只需要一次网络往返。\n\nGraphQL 的上述优点对于移动应用尤其重要，因为在这些应用中检索数据的成本可能很高。此外，向客户对象（在服务器上）添加新字段不会影响\
  \ GraphQL 查询。\n\n另一方面，基于 REST 的请求粒度更粗，并且涉及“过度获取”：此类请求会返回客户对象中 100% 的字段，而不区分必需字段和非必需字段。此外，向客户对象添加新字段会增加返回给客户端的有效负载大小。\n\
  \n## GraphQL 查询\n\nGraphQL 查询是由服务器解释的字符串，它以指定格式返回数据。以下是一个非常简单的 GraphQL 查询示例：\n\n\
  ![Image](img/pg198a.jpg)\n\n上述查询可以理解为“给我 emp 实体的 fname 属性”。如你所见，emp 实体后面跟着一对花括号，其中包含一个名为\
  \ fname 的属性。\n\n下一个查询要复杂得多，但遵循与上一个查询相同的机制：\n\n![Image](img/pg198b.jpg)\n\n![Image](img/pg199a.jpg)\n\
  \n上述查询请求 id 为 30000 的用户的 id、name 和 isViewerFriend 属性。此外，该查询还请求同一用户的 profilePicture（50\
  \ × 50 像素大小）的 uri、width 和 height 属性。\n\n上述查询的响应如下所示：\n\n![Image](img/pg199b.jpg)\n\
  \nGraphQL 查询可能非常复杂，有时返回的数据包含重复的“子树”数据。开源项目 Apollo（本章后面会讨论）会从服务器返回的数据中删除重复的子树。\n\n\
