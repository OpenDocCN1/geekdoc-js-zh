  \ `user.service.ts` 的内容，该文件创建了一个用户列表，其中每个用户都有名字、姓氏和一个关联的 PNG 文件。\n\n### 清单 5.15：user.service.ts\n\
  \n![Image](img/pg148b.jpg)\n\n清单 5.15 导入了自定义组件 `User`（显示在清单 5.16 中），然后定义了自定义组件 `UserService`，它使用\
  \ `userList` 数组来跟踪用户。该数组在构造函数中初始化，创建了三个新的 `User` 实例并填充了数据。`getUserList()` 方法执行“服务”，返回\
  \ `userList` 数组。\n\n清单 5.16 显示了 `app.component.ts` 的内容，该文件引用了前面两个自定义组件，并在无序列表中渲染用户相关信息。\n\
  \n### 清单 5.16：app.component.ts\n\n![Image](img/pg149.jpg)\n\n![Image](img/pg150a.jpg)\n\
  \n清单 5.16 包含一个模板属性，用于显示当前用户列表（即在清单 5.15 的构造函数中初始化的三个用户）。注意显示用户列表中每个用户信息的语法：\n\n\
  `USER {{i+1}}: {{user.fname}}-{{user.lname}}`\n\n`<img class=\"user-image\" [src]=\"\
  user.imageUrl\" (mouseenter)=\"mouseEnter(user)\" width=\"50\" height=\"50\">`\n\
  \n当用户将鼠标移到显示的列表上时，会调用 `mouseEvent()` 方法，将 `currentUser` 设置为指向当前用户。此外，当用户将鼠标移到其中一张图片上时，会调用\
  \ `mouseEnter()` 方法，该方法通过 `console.log()` 显示一条消息，并显示一个警告框。\n\n清单 5.17 显示了 `app.module.ts`\
  \ 的内容，该文件引用了自定义组件和自定义服务。\n\n### 清单 5.17：app.module.ts\n\n![Image](img/pg150b.jpg)\n\
  \n![Image](img/pg151a.jpg)\n\n清单 5.17 的内容与第 2 章中包含 `schemas` 属性的示例基本相同。以粗体显示的行是本节代码示例所需的修改。\n\
  \n## 显示 GitHub 用户数据\n\n本节展示如何从输入字段读取 GitHub 用户名，在 GitHub 中搜索该用户，然后将该用户的一些详细信息附加到列表中。\n\
  \n![Image](img/disc.jpg)\n\n将随附光盘中的 `GithubUsersForm` 目录复制到一个方便的位置。清单 5.18 显示了 `app.component.ts`\
  \ 的内容，该文件说明了如何发出 HTTP GET 请求以检索有关 GitHub 用户的信息。\n\n### 清单 5.18：app.component.ts\n\
  \n![Image](img/pg151b.jpg)\n\n![Image](img/pg152.jpg)\n\n![Image](img/pg153.jpg)\n\
  \n清单 5.18 包含常见的 import 语句，后面跟着一个 `@Component` 装饰器，其中包含常见的 `selector` 属性和一个内容丰富的模板属性。\n\
  \n模板属性由一个顶级 `<div>` 元素组成，该元素包含一个 `<form>` 元素和另一个 `<div>` 元素。`<form>` 元素包含一个 `<input>`\
  \ 元素，用户可以在其中输入 GitHub 用户名，而 `<div>` 元素包含一个 `<ul>` 元素，该元素进而渲染当前用户列表。注意，`<ul>` 元素中的每个\
  \ `<li>` 元素通过将当前用户设置为用户鼠标高亮显示的元素来处理 `mouseover` 事件。\n\n清单 5.18 的下一部分是导出类 `AppComponent`\
  \ 的定义，它初始化了一些实例变量，然后是一个构造函数，该构造函数用两个硬编码的用户初始化了 `users` 数组。接下来，`currUser()` 方法“指向”用户鼠标高亮显示的用户。这个功能不是必需的，但如果你需要跟踪当前高亮显示的用户，它也是可用的。\n\
  \n`findGithubUser()` 方法在 `<input>` 元素为空时显示一个警告框（这可以防止冗余调用 `http()` 方法）。如果在 `<input>`\
  \ 元素中输入了用户，代码会向 GitHub 网站发出 HTTP GET 请求，并将新用户（作为 `UserComponent` 类的实例）追加到 `users`\
  \ 数组中。此外，如果没有与输入字符串匹配的 GitHub 用户，则会显示一个警告框。\n\n另一个小而重要的细节是以下代码片段，它跟踪用户指定的输入字符串：\n\
  \n`this.guserStr = guser.value;`\n\n上述代码片段是必需的，因为在调用 `get()` 方法内部会发生上下文变化，从而丢失对\
  \ `guser` 参数的引用。\n\n清单 5.19 显示了 `user.component.ts` 的内容，其中包含三个字符串，用于跟踪三个与用户相关的字段。\n\
  \n### 清单 5.19：user.component.ts\n\n![Image](img/pg154.jpg)\n\n\n\n\n\n清单 5.19 包含了字符串属性`field1`、`field2`和`field3`，用于跟踪基于\
  \ JSON 的 GitHub 用户信息字符串中的三个属性。`UserComponent`类中的属性名称是通用的，这样你就可以存储 JSON 字符串中的不同属性，例如`followers`、`following`和`created_at`。\n\
  \n现在你已经有了一个起点，可以显示关于用户的更多详细信息，并且可以通过使用 Bootstrap 或其他 UI 相关布局工具包来改进显示效果。\n\n图 5.3\
  \ 展示了启动这个 Angular 应用并添加 GitHub 用户信息后的输出。需要注意的一点是，当前示例允许重复（防止重复的代码留作练习）。\n\n![Image](img/pg155a.jpg)\n\
  \n***图 5.3*** 在列表中搜索并显示 GitHub 用户。\n\n## 其他与服务相关的用例\n\n正如你在上一节中所看到的，服务对于获取外部数据非常有用。此外，在\
  \ Angular 应用中还有其他涉及共享数据和服务的情况。特别是，一个应用可能需要服务类的多个实例，而另一个应用可能需要强制使用服务类的单个实例。还有一种情况涉及在\
  \ Angular 应用的组件之间共享数据。\n\n以下小节简要讨论了这三种场景，它们基于一个非常简单的`UserService`类，定义如下：\n\n![Image](img/pg155b.jpg)\n\
  \n### 多个服务实例\n\n假设`UserService`、`MyComponent1`和`MyComponent2`分别定义在 TypeScript 文件`user.service.ts`、`component1.ts`和`component2.ts`中。如果你需要在每个组件中使用`UserService`类的不同实例，可以在它们的构造函数中注入这个类，如下所示：\n\
  \n![Image](img/pg156.jpg)\n\n在上述代码中，`MyComponent1`中的`UserService`类实例与`MyComponent2`中的`UserService`类实例是不同的。\n\
  \n### 单个服务实例\n\n考虑这样一种情况：两个 Angular 组件必须共享`UserService`类的同一个实例。为简单起见，假设这两个组件是根组件的子组件。在这种情况下，执行以下步骤序列：\n\
  \n1. 创建一个新的服务组件（`ng g s service`）。\n2. 在`app.module.ts`的`providers`数组中包含`UserService`。\n\
  3. 在`service.component.ts`中导入`MyComponent1`和`MyComponent2`。\n4. 从`MyComponent1`的`providers`数组中移除`UserService`类。\n\
  5. 从`MyComponent2`的`providers`数组中移除`UserService`类。\n\n步骤 2 确保`UserService`类对此 Angular\
  \ 应用中的*所有*组件都可用，并且整个应用中只有一个`UserService`类的实例。\n\n### 服务与组件间通信\n\n将新用户从`MyComponent1`发送到`MyComponent2`需要三个步骤。\n\
  \n步骤 1：在`UserService`中定义一个变量`sendUser`，它是`EventEmitter`的一个实例，以及一个`sendNewUser()`方法：\n\
  \n![Image](img/pg157a.jpg)\n\n步骤 2：在`MyComponent1`中定义一个`onSend()`方法，用于向`MyComponent2`发送新用户：\n\
  \n![Image](img/pg157b.jpg)\n\n步骤 3：在`MyComponent2`中定义一个`Observable`，用于“监听”从`MyComponent1`发出的数据：\n\
  \n![Image](img/pg157c.jpg)\n\n另一种总结上述代码块中逻辑流程的方式如下：\n\n![Image](img/greybox.jpg)用户点击按钮添加新用户。\n\
  \n![Image](img/greybox.jpg)`UserService`实例将数据发送给`Component1`。\n\n![Image](img/greybox.jpg)`Component1`实例“发出”新用户。\n\
  \n![Image](img/greybox.jpg)`Component2`实例通过`Observable`“监听”新用户。\n\n### 将服务注入到服务中\n\
  \n你已经了解了如何使用 DI 通过构造函数将服务注入到组件中。你也可以将服务注入到其他服务中。为此，在“被注入的服务”中使用`@Injectable`装饰器：\n\
  \n```\n@Injectable\n\n@Component({\n\n})\n\nexport MyService(…)\n```\n\n> **注意**\
  \  \n> *Angular 中的 DI 仅适用于类定义中包含适当装饰器的类。*\n\n## 总结\n\n本章向你展示了如何创建包含 HTML5 表单以及包含\
  \ Angular 控件和 FormGroups 的 Angular 应用。你还了解了如何将基于表单的数据保存到本地存储中。接下来，你学习了 Angular 管道，并附有一个示例展示了如何实现此功能。\n\
  \n你还学习了 Angular 服务，并看到了一个说明如何使用服务的示例。最后，你学习了如何使用`Http`类的`http()`方法（返回一个`Observable`）来检索任何\
  \ GitHub 用户的数据，并将该数据的一部分显示在用户列表中。\n\n# 第 6 章\n\n## *ANGULAR 与 EXPRESS*\n\n本章包含与通常被称为“Node\
  \ 栈”的服务器端技术协同工作的 Angular 应用。你将学习如何创建在服务器上使用 Express 和 NoSQL 数据库 Mongo 的 Angular\
  \ 应用。本章还将介绍微服务。然而，本章不涵盖 Node 本身的入门级材料，这是本章的先决条件（网上有许多教程可供参考）。\n\n第一部分展示了如何设置一个简单的基于\
  \ JavaScript 对象表示法（JSON）的服务器（称为`json-server`），它可以与许多客户端应用（不仅仅是 Angular）一起使用。第二部分介绍了基本的基于\
  \ Express 的应用，这些应用可以处理客户端数据请求。\n\n第三部分稍微偏离主题，介绍了微服务，以及一个包含`forkJoin()`方法的 Angular\
  \ 应用，用于模拟一个非常简单的微服务示例。服务器端代码由三个 Express 应用组成，它们监听三个不同端口上的客户端请求。\n\n第四部分结合了一个基于 Express\
  \ 的应用和一个向 Express 应用发出数据请求的 Angular 应用。数据请求从 Mongo 实例中检索一组用户，然后将该用户列表返回给 Angular\
  \ 应用。此外，此代码示例使用了你在第 4 章中看到的技术，将服务器返回的基于 JSON 的数据转换为 Promise，再转换为 Observable，然后在\
  \ Angular 应用内部进行处理。\n\n### 一个极简的 Node 应用\n\n在第 4 章中，你学习了如何创建能够使用`json-server`向文件服务器发出\
