  ![Image](img/greybox.jpg)`dependencies.soundcloud-ngrx.svg`\n\n## Compodoc\n\nCompodoc\
  \ 是一个文档工具，用于生成 Angular 应用的静态文档，其主页位于此处（包含在线演示）：\n\n[`github.com/compodoc/compodoc`](https://github.com/compodoc/compodoc)\n\
  \nCompodoc 自动生成目录，并提供各种其他功能，例如主题、搜索功能、JSDoc 轻量支持，并且对 Angular CLI 友好。\n\n官方文档的网站位于此处：\n\
  \n[`compodoc.github.io/website/guides/getting-started.html`](https://compodoc.github.io/website/guides/getting-started.html)\n\
  \n## Angular 与深度学习\n\n本节包含 Angular 应用 AngularDLPG，该应用基于以下“deep playground”GitHub\
  \ 仓库中的代码。该仓库提供了基于深度学习的神经网络：\n\n[`github.com/tensorflow/playground`](https://github.com/tensorflow/playground)\n\
  \nDeep playground 是一个神经网络的交互式可视化工具，使用 TypeScript 和 D3.js 编写。本质上，AngularDLPG 应用充当了此交互式可视化的容器。\n\
  \nAngularDLPG 应用通过三个步骤创建，首先使用 `ng` 工具创建基线应用。接下来，将上述 GitHub 仓库中的 `package.json` 和\
  \ `index.html` 文件合并到 AngularDLPG 应用的对应文件中。第三步，将 GitHub 仓库中 `src` 子目录下的 TypeScript\
  \ 文件复制到 AngularDLPG 应用的 `src` 子目录中。\n\n![Image](img/disc.jpg)\n\n将配套光盘中的 `AngularDLPG`\
  \ 目录复制到方便的位置。该应用的 `src` 子目录中包含以下 TypeScript 文件（从 GitHub 仓库复制而来）：\n\n![Image](img/greybox.jpg)`dataset.ts`\n\
  ![Image](img/greybox.jpg)`heatmap.ts`\n![Image](img/greybox.jpg)`linechart.ts`\n\
  ![Image](img/greybox.jpg)`main.ts`\n![Image](img/greybox.jpg)`nn.ts`\n![Image](img/greybox.jpg)`playground.ts`\n\
  ![Image](img/greybox.jpg)`polyfills.ts`\n![Image](img/greybox.jpg)`seedrandom.d.ts`\n\
  ![Image](img/greybox.jpg)`state.ts`\n![Image](img/greybox.jpg)`typings.d.ts`\n\n\
  上述 TypeScript 文件（不包括 `typings.d.ts`）还通过添加以下代码片段进行了修改：\n\n```\nimport * as d3 from\
  \ 'd3';\n```\n\n上述代码片段使 TypeScript 文件能够访问位于 `node_modules` 子目录中的 D3 相关代码。\n\n通过导航到\
  \ `src` 子目录并执行以下命令来启动 Angular 应用：\n\n`ng serve`\n\n图 10.5 显示了在 Chrome 浏览器中 Angular\
  \ 应用内的 TensorFlow playground 内容。\n\n![Image](img/pg292.jpg)\n\n### 图 10.5 Angular\
  \ 应用中的 TensorFlow playground\n\n## 总结\n\n本章首先介绍了 Angular 4.1.0 的更新，随后介绍了 `npm` 工具和\
  \ `tsc` 工具的配置文件。接下来，你学习了 AOT，这是 Angular 中用于优化 Web 应用大小和性能的高级部分。\n\n你还了解了如何使用 `ngc`\
  \ 编译器、tree-shaking 功能和 `rollup` 工具的目的。接着，你学习了 Angular 变更检测和 `Webpack` 工具。你还了解了与\
  \ `Webpack` 结合使用的 HMR（热模块重载）。然后，你看到了一个使用 Angular Material 的示例，它可以提升 Angular 应用的美学价值。\n\
  \n你还学习了 Angular 中的其他各种主题，例如对 I18n 的支持、用于调试的 Augury Chrome 开发者工具扩展，以及用于显示 Angular\
  \ 应用依赖树的 `ngd` 工具。\n\n最后，你看到了一个包含深度学习神经网络交互式可视化的 Angular 应用。\n\n## 索引\n\n### A\n\
