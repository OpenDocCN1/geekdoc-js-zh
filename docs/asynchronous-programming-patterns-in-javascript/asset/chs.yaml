- "# Javascript 异步编程模式\n\n\n\n![](img/cover.jpg)\n\n# 引言\n\n异步编程在 JavaScript 中无处不在。这是定义其工作方式的基本选择所导致的结果。在其他语言中，你可以使用多线程来实现同步等待，而\
  \ JavaScript 缺少这一关键特性。它被设计为单线程，等待操作会停止一切，试想一下长时间计算导致 UI 冻结的情况。\n\n由于无法同步等待后续结果，JavaScript\
  \ 必须使用回调。即使是等待指定时间这样简单的事情，也需要一个在时间到达时执行的函数：\n\n```\nsetTimeout(() => {\n  console.log(\"\
  1 second passed!\");\n}, 1000);\n```\n\n这种模式随处可见，因为大多数操作本质上都是异步的。使用 `fetch` 向服务器发起\
  \ HTTP 调用是异步操作。通过 `getUserMedia` 获取可用摄像头和麦克风的信息也是如此，因为它需要获得用户许可。读写文件同样如此。虽然这些操作目前有同步版本，但它们的性能很差。或者你想用\
  \ Puppeteer 进行网页抓取？每条指令都是异步的，因为它们都与远程进程通信。对于后端应用，读写数据库数据本质上也是异步的。\n\n不仅如此，某些函数是异步的，所有调用它们的函数也必须是异步的。例如，需要发起网络调用的功能就是异步的，无论该调用相对于函数正在执行的其他操作有多么微不足道。因此，几乎所有的\
  \ JavaScript 应用程序都由异步操作组成。\n\n多年来，这门语言增加了许多让编写异步代码更简单的特性。所谓的“回调地狱”时代已经过去，那时一系列基于回调的异步调用使得程序结构难以理解，并且容易无意中忽略错误。\n\
  \n首先，`Promise` 获得了广泛支持，扁平化了回调的结构。然后，async/await 成为异步编程的主流方式，将异步的许多复杂性隐藏在仅有的两个关键字\
  \ `async` 和 `await` 之后。\n\n这提高了可读性，并使新手程序员更容易编写异步代码。现代 JavaScript 仍然使用相同的单线程无同步等待事件循环，但程序结构已经反映了现代语言的特点。\n\
  \n但异步编程本质上很困难。虽然语言通过语法帮助简化理解和编写代码，但异步性引入了许多潜在错误，其中大多数非常微妙，只在特殊情况下才会出现。\n\n尽管我已经使用异步代码工作多年，但本书中的一些问题花了我一周时间才找到满意的解决方案。我写这本书的目的是，当你遇到类似问题时，通过了解难点所在，能够更轻松地应对。这样你就不必从零开始，而是对障碍和最佳实践有清晰的认识。\n\
  \n你会注意到，错误处理是本书中反复出现的主题。这是因为这是一个经常被忽视的概念，导致代码容易出错。通过了解异步函数和 `Promise` 中的错误机制，你将编写出更安全的程序。\n\
  \n## 结构\n\n本书分为两部分。\n\n第一章 async/await 入门 介绍了 async/await 和 `Promise`，以及异步拼图的各个部分如何组合在一起。主要关注异步函数，因为它们是\
  \ JavaScript 中异步编程的主流方式。但如果不了解 `Promise`，async/await 就像魔法一样，因此你也会学习它们。\n\n到第一章结束时，你将很好地理解如何使用异步函数以及它们在底层是如何工作的。\n\
  \n本书的第二部分包含几个常见的编程任务和问题。你将了解特定问题何时重要、如何解决以及边界情况是什么。这为你提供了完整的图景，以便在遇到类似问题时知道如何处理。\n\
  \n本书不要求从头到尾阅读，而是作为参考指南使用。通过本书中描述的模式，我希望你能看到异步编程的潜在难点，这样在制定自己的解决方案时，你会了解陷阱和最佳实践，从而得到更可靠的代码。\n\
  \n# async/await 入门\n\n本章从 JavaScript 异步编程的介绍开始。主要关注异步函数，因为你可能会更频繁地使用它们，但你也会学习 `Promise`\
  \ 的工作原理。\n\n## 异步函数\n\n普通函数使用 `return` 关键字返回结果：\n\n```\nconst fn = () => {\n  return\
  \ 5;\n}\n\nfn();\n// 5\n```\n\n相比之下，异步函数返回一个 `Promise`：\n\n```\nconst asyncFn =\
  \ async () => {\n  return 5;\n}\n\nasyncFn();\n// Promise\n```\n\n你可以使用 `async`\
  \ 关键字使任何函数成为异步函数，并且有很多函数返回 `Promise` 而不是直接结果。\n\n例如，要从文件系统读取文件，你可以使用 `fs.promises`，它是返回\
  \ `Promise` 的 `fs` 函数变体：\n\n```\nconst fs = require(\"fs\");\n\nfs.promises.readFile(\"\
  test.js\");\n// Promise\n```\n\n或者使用 [sharp](https://www.npmjs.com/package/sharp)\
  \ 库将图像转换为 jpeg，该库也返回 `Promise`：\n\n```\nconst sharp = require(\"sharp\");\n\nsharp(\"\
  image.png\")\n  .jpeg()\n  .toFile(\"image.jpg\");\n// Promise\n```\n\n或者使用 `fetch`\
  \ 发起网络请求：\n\n```\nfetch(\"https://advancedweb.hu\");\n// Promise\n```\n\n### 如何使用\
  \ Promise\n\n异步函数仍然有返回值，而 `Promise` 持有这个结果。要获取该值，需要使用 `then()` 函数**附加一个回调**。这个回调将在函数结果可用时被调用。\n\
  \n要获取 `readFile` 后的文件内容：\n\n```\nconst fs = require(\"fs\");\n\nfs.promises.readFile(\"\
  test.js\").then((result) => {\n  console.log(result);\n  // Buffer\n});\n```\n\n\
  类似地，要获取我们简单异步函数的结果，使用 `then()`：\n\n```\nconst asyncFn = async () => {\n  return\
  \ 5;\n}\n\nasyncFn().then((res) => {\n  console.log(res);\n  // 5\n});\n```\n\n\
  ### Promise 的优势\n\n但为什么要用 `Promise` 使函数调用复杂化呢？普通函数直接返回一个值，可以在下一行使用，无需任何回调。\n\n返回\
  \ `Promise` 而不是值的好处在于，**结果可能在函数返回时尚未就绪**。回调可以在很久之后才被调用，但函数必须立即返回。这扩展了函数的能力。\n\n\
  ```\n// 同步\nfn();\n// 结果已就绪\n\n// 异步\nasyncFn().then(() => {\n  // 结果已就绪\n})\n//\
  \ 结果待定\n```\n\n在许多情况下，同步结果是不可能的。例如，与函数调用相比，发起网络请求需要很长时间。使用 `Promise`，无论某操作花费很长时间还是立即产生结果，都没有区别。在这两种情况下，`then()`\
  \ 函数都会在结果就绪时被调用。\n\n![](img/219846a27f36124ca15767dea9c7b8b464f160923c5e3e283f065d57c1088b38.png)\n\
  \n异步函数返回一个 `Promise`\n\n使用标准化的 `Promise` 还允许其他结构在此基础上构建。正如我们所见，`async` 关键字使函数返回\
  \ `Promise` 而不是值。\n\n总结\n\n异步函数返回 `Promise`，这些值将在未来的某个时刻可用。\n\n\n\n\n\n```\nconst\
  \ user = getUser();\nconst permissions = getPermissions();\nconst hasAccess = checkPermissions(user,\
  \ permissions);\nif (hasAccess) {\n  // 处理请求\n}\n```\n\nPromise 需要回调：\n\n```\ngetUser().then((user)\
  \ => {\n  getPermissions().then((permissions) => {\n    const hasAccess = checkPermissions(user,\
  \ permissions);\n    if (hasAccess) {\n      // 处理请求\n    }\n  });\n});\n```\n\n\
  注意\n\n当 Promise 按顺序调用时，它们支持扁平结构，这是它们相对于传统回调的主要卖点。例如，一系列异步调用可以处理一个对象：\n\n```\ngetUser()\n\
  \  .then(getPermissionsForUser)\n  .then(checkPermission)\n  .then((allowed) =>\
  \ {\n    // 处理允许或不允许的情况\n  });\n```\n\n这几乎是一种扁平结构，我们将在链式 Promise 章节中详细说明，但最后仍然需要一个回调。`await`\
  \ 关键字消除了这个需求。\n\n为了在不失去 Promise 优势的情况下解决这个问题，异步函数可以使用 `await` 关键字。它会**暂停函数直到 Promise\
  \ 就绪**，并返回结果值。\n\n```\nconst asyncFn = async () => {\n  return 5;\n}\n\nawait asyncFn();\n\
  // 5\n```\n\n上面使用回调的代码可以用 `await` 替代，从而形成更熟悉的结构：\n\n```\nconst user = await getUser();\n\
  const permissions = await getPermissions();\nconst hasAccess = checkPermissions(user,\
  \ permissions);\nif (hasAccess) {\n  // 处理请求\n}\n```\n\n`await` 关键字**等待异步结果**，使代码看起来几乎像同步代码，但拥有\
  \ Promise 的所有优点。\n\n注意，`await` 会暂停函数的执行，这看起来像是在 JavaScript 中不可能发生的事情。但在底层，它仍然使用\
  \ `then()` 回调，并且由于异步函数返回 Promise，它们不需要立即提供结果。这使得在不改变语言工作方式的情况下暂停函数成为可能。\n\n### 异步函数示例\n\
  \n带有 `await` 的异步函数非常强大。它们使复杂且异步的工作流程看起来简单而熟悉，隐藏了结果稍后到达的所有复杂性。\n\n浏览器自动化就是一个典型的例子。[Puppeteer](https://www.npmjs.com/package/puppeteer)\
  \ 项目允许启动 Chromium 并通过 DevTools 协议驱动它。\n\n截取网页截图只需几行代码：\n\n```\nconst browser = await\
  \ puppeteer.launch(options);\nconst page = await browser.newPage();\nconst response\
  \ = await page.goto(url);\nconst img = await page.screenshot();\nawait browser.close();\n\
  ```\n\n这段代码隐藏了大量复杂性。它启动一个浏览器，然后向其发送命令，所有操作都是异步的，因为浏览器是一个独立的进程。但最终结果是一个包含截图的图像缓冲区。\n\
  \n注意\n\n如果执行过程中出现错误，上述代码会让浏览器保持运行。你将在异步释放器模式章节中学习如何处理资源关闭。\n\n另一个例子是与数据库交互。远程服务总是需要网络调用，这意味着异步结果。\n\
  \n以下代码用于 AWS Lambda 函数，更新用户的头像图片：\n\n```\n// 将对象移出待处理目录\nawait s3.copyObject({/*...*/}).promise();\n\
  await s3.deleteObject({/*...*/}).promise();\n\n// 获取当前头像图片\nconst oldAvatar = (await\
  \ dynamodb.getItem({/*...*/}).promise())\n  .Item.Avatar.S;\n\n// 更新用户头像\nawait\
  \ dynamodb.updateItem({/*...*/}).promise();\n// 删除旧图片\nawait s3.deleteObject({/*...*/}).promise();\n\
  \nreturn {\n  statusCode: 200,\n};\n```\n\n它调用 AWS S3 服务来移动对象，并调用 DynamoDB 数据库来读取和修改数据。两者都是远程服务，但所有复杂性都隐藏在\
  \ `await` 后面。\n\n总结\n\n`await` 关键字会暂停函数，直到未来的结果可用。\n\n### 链式 Promise\n\n我们已经看到，当异步函数返回一个值时，它会被包装在\
  \ Promise 中，而 `await` 关键字会从中提取值。但是当异步函数返回一个 Promise 时会发生什么？这是否意味着你需要使用两个 `await`？\n\
  \n考虑以下代码：\n\n```\nconst f1 = async () => {\n  return 2;\n};\n\nconst f2 = async\
  \ () => {\n  return f1();\n}\n\nconst result = await f2();\n```\n\n严格遵循前面章节描述的过程，`f1()`\
  \ 返回 `Promise<2>`，而 `f2()` 返回 `Promise<Promise<2>>`，因此 `result` 的值将是 `Promise<2>`\
  \ 而不是 `2`。\n\n但实际情况并非如此。当异步函数返回一个 Promise 时，它不会添加另一层包装。无论它返回一个值还是一个 Promise，它始终是一个\
  \ Promise，并且始终解析为最终值，而不是另一个 Promise。\n\n这对于 Promise 链也是如此。`.then()` 回调也会被包装在 Promise\
  \ 中（如果还不是的话），因此你可以轻松地链式调用它们：\n\n```\ngetUser()\n  .then(async function getPermissionsForUser(user)\
  \ {\n    const permissions = await // ...;\n    return permissions;\n  })\n  .then(async\
  \ function checkPermission(permissions) {\n    const allowed = await // ...;\n \
  \   return allowed;\n  })\n  .then((allowed) => {\n    // 处理允许或不允许的情况\n  });\n```\n\
  \n`getUser` 函数返回 `Promise<User>`，然后 `getPermissionsForUser` 获取用户对象（解析后的值），然后返回权限集。下一个调用\
  \ `checkPermission` 获取权限，依此类推。\n\n一个有用的类比是数组的 `flatMap` 函数。无论它返回一个值还是一个数组，最终结果始终是一个包含值的数组。它是\
  \ `map` 后跟 `flat`。\n\n```\n[1].flatMap((a) => 5) // [5]\n[1].flatMap((a) => [5])\
  \ // [5]\n\n[1].flat() // [1]\n[[1]].flat() // [1]\n```\n\n当我不确定 Promise 链返回什么时，我会在脑海中将\
  \ Promise 转换为数组，其中每个异步函数返回一个包含其结果的扁平数组，而 `await` 则是获取第一个元素：\n\n```\nconst f1 = ()\
  \ => {\n  return [2].flat();\n};\n\nconst f2 = () => {\n  return [f1()].flat();\n\
  }\n\nconst result = f2()[0]; // 2\n```\n\n那么 Promise 链就变成了一系列的 `flatMap`：\n\n```\n\
  const getUser = () => [\"user\"];\n\ngetUser()\n  .flatMap(function getPermissionsForUser(user)\
  \ {\n    // user = \"user\"\n    const permissions = \"permissions\";\n    return\
  \ permissions;\n  })\n  .flatMap(function checkPermission(permissions) {\n    //\
  \ permissions = \"permissions\"\n    const allowed = true;\n    return allowed;\n\
  \  })\n  .flatMap((allowed) => {\n    // allowed = true\n    // 处理允许或不允许的情况\n  });\n\
  ```\n\n这消除了异步的大部分复杂性，并且更容易推理。\n\n## Promise\n\n到目前为止，我们已经讨论了如何编写产生 Promise 的异步函数，以及如何等待\
  \ Promise 拥有值。但是，在没有现有 Promise 可构建的情况下，如何创建 Promise 呢？\n\n要了解这一点，我们需要讨论 JavaScript\
  \ 中异步的工作原理，以及如何从回调构建 Promise。\n\n### 回调\n\n异步结果以回调的形式出现。它们类似于 Promise 中 `then()`\
  \ 函数的参数，但在特定事件发生时被调用。例如，最简单的回调是 `setTimeout` 调用，它等待给定的毫秒数，然后调用参数函数：\n\n```\nsetTimeout(()\
  \ => {\n  // 1 秒后\n}, 1000);\n```\n\n这种使用回调的模式在 JavaScript 中随处可见。\n\n用于 Google 服务的库\
  \ gapi，在加载客户端库时[需要一个回调](https://github.com/google/google-api-javascript-client/blob/master/docs/reference.md#----gapiloadlibraries-callbackorconfig------)：\n\
  \n```\ngapi.load(\"client:auth2\", () => {\n  // auth2 客户端已加载\n});\n```\n\n类似地，事件监听器（例如点击处理程序）在事件发生时调用一个函数：\n\
  \n\n\n\n\n```\nconst button = document.querySelector(\"#button\");\n\nbutton.addEventListener(\"\
  click\", () => {\n  // button is clicked\n}, {once: true})\n```\n\n回调函数的问题在于我们又回到了原点，因为不再是扁平结构，而是再次出现了嵌套。\n\
  \n幸运的是，有一种简单的方法可以将回调转换为 `Promises`，然后与 `await` 一起使用。\n\n事件监听器与 `Promises`\n\n眼尖的读者可能注意到了上一个例子中的\
  \ `{once: true}` 部分。事件监听器本质上与异步函数不同，因为它们代表的是*多个事件*，而不是单个结果值。因此，你不能用 `Promises` 来替换它们。\n\
  \n唯一的例外是当只有一个事件时，就像上面的例子那样。从某种意义上说，它的工作方式类似于超时或 gapi 加载函数，因为回调会在事件发生时被调用。\n\n###\
  \ `Promise` 构造函数\n\n异步函数返回 `Promises`，但你只能使用 `await` 来等待其他 `Promises`，而不能等待回调。要创建一个\
  \ `Promise`，你需要使用它的构造函数：\n\n```\nnew Promise((res) => {\n  // 当 Promise 就绪时调用 res\n\
  });\n```\n\n调用 `res` 回调会通知 `Promise` 结果已就绪。这与异步函数返回时的情况相同。\n\n要将 `setTimeout` 转换为\
  \ `Promise`，将其包装在构造函数中，并使用 `res` 作为回调：\n\n```\nawait new Promise((res) => {\n  setTimeout(res,\
  \ 1000);\n});\n// 1 秒后\n\n// 等同于\nawait new Promise((res) => {\n  setTimeout(()\
  \ => {\n    res();\n  }, 1000);\n});\n```\n\n现在它变成了一个 `Promise`，`await` 的工作方式与其他异步函数一样。\n\
  \n类似地，另外两个例子也很容易转换为 Promise：\n\n```\nawait new Promise((res) => {\n  gapi.load(\"\
  client:auth2\", res);\n});\n// auth2 客户端已加载\n```\n\n```\nconst button = document.querySelector(\"\
  #button\");\n\nawait new Promise((res) => {\n  button.addEventListener(\"click\"\
  , res, {once: true});\n});\n// 按钮被点击\n```\n\n使用 `Promises` 代替回调，可以轻松地使用 `await`\
  \ 来编排一系列异步操作。例如，在按钮被点击时加载 auth2 客户端：\n\n```\nawait new Promise((res) => {\n  button.addEventListener(\"\
  click\", res, {once: true});\n});\n// 按钮被点击\nawait new Promise((res) => {\n  gapi.load(\"\
  client:auth2\", res);\n});\n// gapi 库已加载\n```\n\n在回调与 `Promises` 之间转换\n\n你将在 在 `Promises`\
  \ 和回调之间转换 章节中了解更多。\n\n### `Promise` 状态\n\n由于 `Promise` 持有未来的值，它可以处于几种状态。\n\n当你创建一个\
  \ `Promise` 时，它最初处于 **Pending**（待定）状态。这是在 resolve/reject 回调被调用或异步函数完成之前的状态。\n\n\
  当有值时，`Promise` 转换为 **Resolved**（已解决）状态。此时 `await` 解除阻塞，异步函数继续运行。\n\n如果出现错误，`Promise`\
  \ 进入 **Rejected**（已拒绝）状态。此时 `await` 抛出异常。\n\nResolved 和 Rejected 状态统称为 **Fulfilled**（已完成）或\
  \ **Settled**（已敲定）。当 `Promise` 处于此状态时，它已经完成并产生了值或错误。\n\n![](img/c7bf165c038961ff3793fb930dc7f0f0e4deca1a722e24292ec3555a5c09e142.png)\n\
  \n`Promise` 状态\n\n### 结果值\n\n上面的例子都使用了 `Promise` 的 `res` 函数来通知异步操作已就绪，但没有产生任何值。要同时返回一个值，**将其传递给\
  \ `res` 调用**。\n\n```\nconst value = new Promise((res) => {\n  res(5);\n});\n// 5\n\
  ```\n\n一个更复杂的例子：下面的 `Promise` 显示 Google Drive 文件选择器，并在选择文件后解析。这看起来复杂，但核心思想是一样的：创建一个新的\
  \ `Promise`，然后在结果就绪时调用 `res` 方法。\n\n```\nconst folder = await new Promise((res)\
  \ => {\n  const picker = new google.picker.PickerBuilder()\n    // ... 配置 ...\n\
  \    .setCallback((data) => {\n      if (/* 选中的操作 */) {\n        // 选中了一个文件夹\n \
  \       const selectedFolder = ...\n\n        // 解析 Promise\n        res(selectedFolder);\n\
  \      }\n    })\n    .build();\n  picker.setVisible(true);\n});\n// folder 是选中的文件夹\n\
  ```\n\n注意\n\n通过 `res()` 调用只能返回一个值。你将在 返回多个值 章节中了解返回多个值的方法。\n\n## 错误处理\n\n到目前为止，我们讨论的都是异步函数一切顺利的情况。没有数据库超时，没有验证错误，没有突然的网络丢失。但这些情况确实会发生，所以我们也需要为此做好准备。如果没有正确的错误传播，失败会导致\
  \ `Promises` 和异步函数停滞，永远无法继续。\n\n对于同步函数，当某些东西 `throw` 错误时，错误会发生，并且会向上冒泡，直到遇到 `try-catch`：\n\
  \n```\nconst fn = () => {\n  throw new Error(\"发生了糟糕的事情\");\n}\n\ntry {\n  fn();\n\
  }catch(e) {\n  // 处理错误\n}\n```\n\n异步函数的工作方式类似，当抛出错误时，它会向上冒泡直到遇到 `try-catch`。当出现异步错误时（我们将在下一章探讨它们的工作原理），你可以使用同样熟悉的结构来处理：\n\
  \n```\nconst fn = async () => {\n  throw new Error(\"发生了糟糕的事情\");\n}\n\ntry {\n\
  \  await fn();\n}catch(e) {\n  // 处理错误\n}\n```\n\n注意\n\n错误是在 `await` 期间抛出的，而不是在函数调用时：\n\
  \n```\nconst asyncFn = async () => {\n  throw new Error(\"发生了糟糕的事情\");\n}\n\nconst\
  \ res = asyncFn(); // 这里没有错误\n\ntry {\n  await res; // 错误\n}catch(e) {\n  // 处理错误\n\
  }\n```\n\n### `Promise` 构造函数中的错误回调\n\n但是当你使用 `Promise` 构造函数时，需要注意传播错误。\n\n让我们重新审视之前的例子！`gapi.load`\
  \ 加载一个可用于 Google 服务的客户端库，它需要一个回调来通知加载完成。使用 `Promise` 构造函数很容易将其转换为 `Promise`：\n\n\
  ```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\", res);\n});\n//\
  \ auth2 已加载\n```\n\n但是当出现错误时会发生什么？也许网络断开，客户端库无法加载。在这种情况下，回调函数永远不会被调用，`Promise` 也永远不会完成。等待它的\
  \ `await` 将永远等待下去。\n\n```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\"\
  , res); // 错误\n});\n// 永远不会发生\n```\n\n要实现正确的错误传播，我们需要两件事。首先，一种向 `Promise` 发出错误信号的方法；其次，一种检测该错误的方法。\n\
  \n#### 拒绝一个 `Promise`\n\n`Promise` 构造函数提供了第二个回调，可以发出错误信号：\n\n```\nnew Promise((res,\
  \ rej) => {\n  // 一切正常时调用 res()\n  // 出现错误时调用 rej()\n});\n```\n\n当调用 `rej` 函数时，它的行为类似于异步函数抛出错误：\n\
  \n```\ntry {\n  await new Promise((res, rej) => {\n    rej(); // 发出错误信号\n  });\n\
  }catch(e) {\n  // 处理错误\n}\n```\n\n与 `res` 函数类似，你可以传递错误对象，该对象将成为拒绝原因：\n\n```\ntry\
  \ {\n  await new Promise((res, rej) => {\n    rej(new Error(\"发生了糟糕的事情\"));\n  });\n\
  }catch(e) {\n  console.log(e.message) // 发生了糟糕的事情\n}\n```\n\n什么是错误\n\n什么构成错误取决于具体实现。例如，`fetch`\
  \ 在无法建立连接时会抛出错误，但当响应码不在 2xx 范围内时则不会。\n\n```\ntry {\n  const response = await fetch(options);\n\
  \  if (response.ok) {\n    // 请求成功\n  }else {\n    // 错误响应\n  }\n} catch (e) {\n\
  \  // 发送请求时出错\n}\n```\n\n构造函数中抛出的异常也会拒绝 `Promise`：\n\n```\nnew Promise(() => {\n\
  \  throw Error(\"发生了糟糕的事情\");\n});\n// 被拒绝并带有错误\n```\n\n\n\n\n这种行为使得大多数编程错误能够正确传播。但与\
  \ `reject` 回调不同，它只处理同步错误。\n\n#### 检测错误\n\n现在我们已经有了向 `Promise` 发出错误信号的方法，接下来看看如何调整\
  \ `gapi` 示例以利用这一机制！\n\n在这个具体案例中，回调也可以是一个包含 `callback` 和 `onerror` 处理器的[对象](https://github.com/google/google-api-javascript-client/blob/master/docs/reference.md#----gapiloadlibraries-callbackorconfig------)：\n\
  \n```\nawait new Promise((res, rej) => {\n  gapi.load(\"client:auth2\", {callback:\
  \ res, onerror: rej});\n});\n```\n\n现在，如果在加载过程中出现错误，`rej` 函数会被调用，并且 `await` 会抛出一个错误。\n\
  \n注意\n\n底层函数如何传递结果和错误可能因库而异。你将在回调风格一章中了解更多。\n\n### Promise 链中的错误传播\n\n虽然异步函数使用与普通函数相同的\
  \ `try..catch` 结构，但 `Promise` 链的工作方式不同。`then` 回调有一个额外的回调，当之前的 `Promise` 被拒绝时会被调用：\n\
  \n```\nconst rejectedPromise = new Promise((res, rej) => {\n  rej(new Error(\"rejected\"\
  ));\n});\n\nrejectedPromise.then(undefined, (error) => {\n  // error = \"rejected\"\
  \n  // 处理错误\n});\n```\n\n`Promise` 链中的错误会移动到下一个错误处理器，跳过所有前面的步骤。这使得从多个步骤收集错误并在一个地方处理变得容易：\n\
  \n```\ngetUser()\n  .then(getPermissionsForUser)\n  .then(checkPermission)\n  .then((allowed)\
  \ => {\n    // 处理允许或不允许的情况\n  }).then(undefined, (error) => {\n    // 前面某个步骤出现了错误\n\
  \  });\n```\n\n一种有用的思考错误在链中传播的方式是将其视为两条并行的铁路轨道，上面有车站。一个车站就是一个 `then` 回调，其结果决定了列车继续行驶在哪条轨道上。\n\
  \n提示\n\n你可以使用简写 `.catch((error) => {...})` 来代替 `.then(undefined, (error) => {...})`。\n\
  \n![](img/1570b41fac08486b3d036c0da65981b6f9791bf94e4597cbb52302155f72e9e3.png)\n\
  \n`Promise` 链中的错误处理器\n\n这种思考方式有助于理清更复杂的链。让我们分析一下这里发生了什么：\n\n```\ngetPromise()\n\
  \  .then(handler1)\n  .then(handler2, catch1)\n  .then(handler3)\n  .then(undefined,\
  \ catch2)\n  .then(handler4)\n```\n\n这产生了以下图示：\n\n![](img/c354aee4c19744ca4aa52500db8678dff726cf80330cb30356faa176a2fc1d0c.png)\n\
  \nPromise 链的图示\n\n看起来复杂，但规则很简单：\n\n*   每个函数，无论它在哪条轨道上，都可以将执行转移到 OK 轨道或错误轨道。\n* \
  \  当缺少处理器时（上图中的菱形），执行会保持在同一条轨道上。\n\n例如，如果 `getPromise()` 被拒绝，下一个函数将是 `catch1`。如果它被解决，那么下一个就是\
  \ `handler3`。如果它被解决，`handler4` 会被调用，并且无论它解决还是拒绝，都将是整个链的结果。\n\n错误处理器\n\n注意这一行：\n\n\
  ```\n.then(handler2, catch1)\n```\n\n一个常见的错误来源是，如果 `handler2` 中出现错误，`catch1` **不会运行**。每个错误处理器处理来自*前面步骤*的错误。\n\
  \n# 并行与顺序处理\n\n当你在异步函数中使用 `await` 时，它会暂停执行直到 `Promise` 被解决。这使得每一行都等待前一行，从而产生看起来几乎像同步代码的代码：\n\
  \n```\nawait s3.copyObject({/*...*/}).promise();\nawait s3.deleteObject({/*...*/}).promise();\n\
  ```\n\n上面的代码先复制一个对象，然后删除一个对象。如果你想要*移动*对象，这是理想的事件链，因为你希望复制操作在删除原始对象之前完成。\n\n## 使用\
  \ Promise.all 进行并行处理\n\n但如果有一个不相关的调用，比如更新数据库呢？\n\n```\nawait s3.copyObject({/*...*/}).promise();\n\
  await s3.deleteObject({/*...*/}).promise();\n\nawait dynamodb.updateItem({/*...*/}).promise();\n\
  ```\n\n虽然 `dynamodb.updateItem` 与 S3 对象无关，但它仍然等待移动操作（复制+删除）完成。这使得整个过程比必要的时间更长。\n\
  \n![](img/3e190789d246b3a99678b872e19dca5e25722f9e39f7b5d615d91a516632adc7.png)\n\
  \n串行执行\n\n在这种情况下，更好的实现是让两个部分并行运行。为了更清楚地看到这一点，让我们用异步函数将两个操作分组：\n\n```\nconst moveObject\
  \ = async () => {\n  await s3.copyObject({/*...*/}).promise();\n  await s3.deleteObject({/*...*/}).promise();\n\
  };\n\nconst updateDatabase = async () => {\n  await dynamodb.updateItem({/*...*/}).promise();\n\
  };\n```\n\nJavaScript 有一个内置的便捷方法来并行运行任务。这就是 `Promise.all`，它接收一个 *Promise 集合* 并返回一个包含所有结果的\
  \ `Promise`。当你想要并发运行多个任务时，这就是要使用的工具。\n\n要并行运行这两个操作，请使用：\n\n```\nawait Promise.all([moveObject(),\
  \ updateDatabase()]);\n```\n\n![](img/327e086a88b6fea910123a1487b792143e5f047bb4e62f2c1be1ef125182b2c7.png)\n\
  \n并行执行\n\n这里需要注意几点。首先，`Promise.all` 接收的是 *Promise*。记住，*调用*一个异步函数会返回一个 `Promise`，所以不要忘记调用你想要运行的函数。\n\
  \n其次，它需要一个 *Promise 集合*，通常是一个数组。注意调用 `Promise.all` 时的 `([ ... ])` 结构。\n\n第三，`await`\
  \ 只用于 `Promise.all`，而不是用于单个异步函数调用。这是因为你想要等待*所有*它们完成后再继续。\n\n提示\n\n`await` 会暂停异步函数的执行。在\
  \ `Promise.all` 的情况下，你只想暂停一次，等待所有输入的 Promise 稳定。这就是为什么只需要一个 `await`。\n\n### 结果\n\
  \n在上面的例子中，没有一个操作返回值。让我们看看如何处理 `Promise.all` 返回的值！\n\n为了说明，假设异步函数需要两个不相关的数据：一个用户对象和一个组列表。这两个数据都存储在数据库中，因此可以通过异步函数获取。\n\
  \n```\nconst getUser = async () => {\n  // 获取用户对象\n  return user;\n}\nconst getGroups\
  \ = async () => {\n  // 获取组列表\n  return groups;\n}\n```\n\n注意在这个例子中，`getGroups`\
  \ 函数不需要用户对象。这使得它们可以并行运行。\n\n串行实现会分别调用这些函数并将结果存储在变量中：\n\n```\nconst user = await\
  \ getUser();\nconst groups = await getGroups();\n\n// user 和 groups 可用\n```\n\n\
  这里有两个 `await`，所以函数会暂停两次。无论你先放哪一个，总执行时间都是两次调用的总和。正如我们之前看到的，`Promise.all` 会并行运行异步函数返回的\
  \ Promise。它还会返回一个包含结果*数组*的 `Promise`。\n\n要并行运行这两个调用并提取结果，请使用数组解构运算符：\n\n```\nconst\
  \ [user, groups] = await Promise.all([\n  getUser(),\n  getGroups(),\n]);\n\n//\
  \ user 和 groups 可用\n```\n\n### Promise.all 中的错误\n\n当*任何*输入的 Promise 被拒绝时，结果 `Promise`\
  \ 也会被拒绝。这种行为使得错误能够无缝传播。\n\n```\ntry {\n  const [user, groups] = await Promise.all([\n\
  \    getUser(), // getUser 返回一个值\n    getGroups(), // getGroups 抛出一个异常\n  ]);\n\
  } catch(e) {\n  // 处理任一调用抛出的错误\n}\n```\n\n\n\n\n\n即使异步函数在某种意义上相互独立（一个函数不使用另一个函数的结果），在某些情况下你可能也不想让它们并行运行。在上面的\
  \ `moveObject` 和 `updateDatabase` 异步函数示例中，如果前者失败，你可能不希望运行后者。\n\n```\nawait Promise.all([moveObject(),\
  \ updateDatabase()]);\n```\n\n当这段代码运行时，可能产生以下结果：\n\n| 对象已移动 | 数据库已更新 |\n| --- |\
  \ --- |\n| ✓ | ✓ |\n| ✓ | ‐ |\n| **‐** | **✓** |\n| ‐ | ‐ |\n\n通过使用串行执行，你可以确保后续操作只有在前面的操作完成后才会运行：\n\
  \n```\nawait moveObject();\nawait updateDatabase();\n```\n\n当这段代码运行时，如果移动对象失败，数据库保证保持不变：\n\
  \n| 对象已移动 | 数据库已更新 |\n| --- | --- |\n| ✓ | ✓ |\n| ✓ | ‐ |\n| ‐ | ‐ |\n\n## 早期初始化\n\
  \n当你创建一个 `Promise` 时，它就开始执行。但异步函数只有在遇到 `await` 时才会暂停。这种结构允许你提前启动异步处理，但只在需要结果时才等待它。\n\
  \n例如，考虑以下代码，它会等待函数完成后再继续执行：\n\n```\nconst wait = (ms) => new Promise((res) => setTimeout(res,\
  \ ms));\n\nconst fn = async () => {\n  console.log(\"starting\");\n  await wait(100);\n\
  \  console.log(\"end\");\n}\n\nawait fn();\nconsole.log(\"after\");\n\n// starting\n\
  // end\n// after\n```\n\n![](img/8d4d58f7f1e0491f45e90876feb98157026c307f5ffe6bc7a5c07595adeaa4f7.png)\n\
  \n急切等待\n\n但当 `await` 被推迟时，执行顺序会发生变化：\n\n```\nconst fnProm = fn();\nconsole.log(\"\
  after\");\nawait fnProm;\n\n// starting\n// after\n// end\n```\n\n这提供了一种简单的方法来“在后台”运行任务，同时在需要时获取结果。\n\
  \n![](img/fa9d1f0ccc5366e0d05176dd3b8d30ec61b0c3928005a76744076d57359459e3.png)\n\
  \n延迟等待\n\n例如，一个 Web 服务器在收到请求时可能需要做几件事，其中之一是从 cookie 和会话存储中获取用户会话。\n\n```\nconst\
  \ http = require(\"http\");\n\nconst getUserSession = async (req) => {\n  // 提取会话\
  \ cookie\n  // 从 Redis 获取会话\n  // 返回用户对象\n};\n\nconst server = http.createServer(async\
  \ (req, res) => {\n  // 验证请求\n  // 获取配置\n  const session = await getUserSession(req);\n\
  \  // 处理请求\n});\n\nserver.listen(8080);\n```\n\n在上面的例子中，一切都是顺序执行的。服务器先处理请求，然后获取用户会话。\n\
  \n为了在请求到来后立即开始获取用户会话，你可以将调用异步函数和 `await` 分开：\n\n```\nconst server = http.createServer(async\
  \ (req, res) => {\n  const sessionProm = getUserSession(req);\n  // 验证请求\n  // 获取配置\n\
  \  const session = await sessionProm;\n  // 处理请求\n});\n```\n\n在这种情况下，会话在需要时仍然可用，但处理过程更早开始。这减少了用户感知的总时间。\n\
  \n不过有一个陷阱。正如我们在错误处理章节中讨论的，如果异步函数抛出错误，它会通过 `await` 传播。这意味着如果执行过程中没有遇到该 `Promise`\
  \ 的 `await`，错误将不会被处理。\n\n这是一个问题。\n\n考虑以下代码：\n\n```\nconst wait = (ms) => new Promise((res)\
  \ => setTimeout(res, ms));\n\nconst fn = async () => {\n  await wait(100);\n  throw\
  \ new Error(\"Something bad happened\");\n}\n\ntry{\n  const p = fn();\n  throw\
  \ new Error(\"There was an error\");\n  await p;\n}catch(e) {\n  console.log(e.message);\n\
  }\n```\n\n这会输出：\n\n```\nThere was an error\n(node:170) UnhandledPromiseRejectionWarning:\
  \ Error: Something\nbad happened\n(node:170) UnhandledPromiseRejectionWarning: Unhandled\
  \ promise\nrejection. This error originated either by throwing inside of an\nasync\
  \ function without a catch block, or by rejecting a promise\nwhich was not handled\
  \ with .catch(). To terminate the node\nprocess on unhandled promise rejection,\
  \ use the CLI flag\n`--unhandled-rejections=strict` (see\nhttps://nodejs.org/api/cli.html#cli_unhandled_rejections_mode).\n\
  (rejection id: 1)\n(node:170) [DEP0018] DeprecationWarning: Unhandled promise\n\
  rejections are deprecated. In the future, promise rejections that\nare not handled\
  \ will terminate the Node.js process with a\nnon-zero exit code.\n```\n\n未处理的拒绝是不好的。有一个全局的\
  \ `unhandledRejection` 事件可以处理它，但这会导致代码难以维护。正确的解决方案是确保 `Promise` 总是被 `await` 处理。这通常会导致代码更复杂。\n\
  \n在某些情况下，早期初始化模式是有用的，尤其是当任何异常都是灾难性的时。但当你有一个多个客户端可以调用的后端服务器时，最好避免使用。\n\n多个 await\n\
  \n如果一个 `Promise` 被多次 `await` 会发生什么？这不会导致函数被多次调用。当一个 `Promise` 被解决（resolved 或 rejected）后，`await`\
  \ 只是返回结果（或抛出异常）。\n\n考虑以下代码：\n\n```\nconst fn = async () => {\n  console.log(\"called\"\
  );\n  await wait(100);\n  return \"result\";\n}\n\n(async () => {\n  const p = fn();\n\
  \  console.log(await p);\n  console.log(await p);\n})();\n\n// called\n// result\n\
  // result\n```\n\n# 返回多个值\n\n正如我们在 Promise 构造函数章节中讨论的，和普通函数一样，一个 `Promise` 只能有一个返回值。但很多时候你可能想返回多个值。\n\
  \n幸运的是，JavaScript 支持对象和数组解构运算符，这使得使用单个变量来保存多个值变得容易。\n\n例如，一个 `Promise` 可以解析为一个值数组：\n\
  \n```\nconst getValues = () => new Promise((res) => {\n  const user = \"user\";\n\
  \  const group = \"group\";\n  res([user, group]);\n});\n\nconst [user, group] =\
  \ await getValues();\n// user, group\n```\n\n或者一个具有已知字段的对象：\n\n```\nconst getValues\
  \ = () => new Promise((res) => {\n  const user = \"user\";\n  const group = \"group\"\
  ;\n  res({user, group});\n});\n\nconst {user, group} = await getValues();\n// user,\
  \ group\n```\n\n当然，这与同步函数使用的模式相同：\n\n```\nconst getValues = () => {\n  const user\
  \ = \"user\";\n  const group = \"group\";\n  return {user, group};\n};\n\nconst\
  \ {user, group} = getValues();\n// user, group\n```\n\n并且异步函数也同样适用：\n\n```\nconst\
  \ getValues = async () => {\n  const user = \"user\";\n  const group = \"group\"\
  ;\n  return {user, group};\n};\n\nconst {user, group} = await getValues();\n// user,\
  \ group\n```\n\n# 在 `Promise` 和回调之间转换\n\n虽然 `Promise` 和 async/await 日益成为 JavaScript\
  \ 中编写异步代码的主要方式，但回调仍然在许多地方使用。许多采用这种风格的库迁移到更现代的替代方案的速度较慢，浏览器（和 Node）API 的变化也很慢。\n\n\
  例如，[marked](https://www.npmjs.com/package/marked) 是一个 markdown 编译器，在异步模式下使用时需要一个回调：\n\
  \n```\nmarked(text, options, (err, result) => {\n  // result 是编译后的 markdown\n});\n\
  ```\n\n类似地，`setTimeout` 在时间到达时调用一个函数：\n\n```\nsetTimeout(callback, 100);\n```\n\n\
  更不用说大量的 Web API，例如 [Indexed DB](https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API)、[FileReader](https://developer.mozilla.org/en-US/docs/Web/API/FileReader)\
  \ 等。回调仍然无处不在，将它们转换为 `Promise` 是一个好习惯，特别是当你的代码已经使用 async/await 时。\n\n## 回调风格\n\n\n\
  \n\n回调函数实现了延续传递风格的编程，其中**一个函数**不是返回一个值，而是**调用**一个延续（即**一个参数函数**）。这种模式在 JavaScript\
  \ 中尤为常见，因为它不支持同步等待。任何涉及未来事件的操作，例如网络调用、异步 API 或简单的超时，都只能通过回调机制实现。\n\n回调函数有多种工作方式。例如，`setTimeout`\
  \ 使用回调优先模式：\n\n```\nsetTimeout(callback, ms);\n```\n\n或者，函数可以接收多个函数，并在适当的时候调用它们：\n\
  \n```\nconst checkAdmin = (id, isAdmin, notAdmin) => {\n  if (/* 管理员逻辑 */) {\n \
  \   isAdmin();\n  }else {\n    notAdmin();\n  }\n};\n```\n\n回调的调用方式也可能不同。例如，它可能接收多个参数：\n\
  \n```\nconst getUserData = (id, cb) => {\n  const user = /* 获取用户 */\n  cb(user.id,\
  \ user.profile, user.avatar);\n};\n```\n\n此外，异步性也可以通过一个发出事件的对象来实现：\n\n```\nconst\
  \ reader = new FileReader();\nreader.onload = (event) => {\n  // event.target.result\n\
  }\nreader.onerror = (error) => {\n  // 处理错误\n};\nreader.readAsDataURL(blob);\n```\n\
  \n### Node 风格的回调\n\n由于实现回调的方式有多种且都同样合理，最初情况相当混乱。后来出现了一个事实上的标准，即现在所谓的 Node 风格或错误优先回调。在\
  \ JavaScript 中，只要需要回调，几乎都会使用这种风格。\n\nNode 风格的回调具有三个特点：\n\n*   回调函数是最后一个参数\n*   它首先被调用时传入一个错误对象，然后是结果（`(error,\
  \ result)`）\n*   它只返回一个结果\n\n例如，以下函数实现了一个 Node 风格的回调：\n\n```\nconst getUser = (id,\
  \ cb) => {\n  const user = /* 获取用户 */;\n  if (user) {\n    // 成功\n    cb(null, user);\n\
  \  }else {\n    // 错误\n    cb(new Error(\"获取用户失败\"));\n  }\n};\n```\n\n注意，当没有错误时，第一个参数是\
  \ `null`。这使得调用者可以轻松检查执行是否失败或成功：\n\n```\ngetUser(15, (error, result) => {\n  if (error)\
  \ {\n    // 处理错误\n  } else {\n    // 处理结果\n  }\n});\n```\n\n由于这种回调结构几乎被独占使用，因此可以更容易地在\
  \ Promise 和回调之间进行转换。\n\n## 将回调转换为 Promise\n\n这是更常见的方向，因为将基于回调的函数集成到 async/await\
  \ 流程中是一项常见任务。让我们看看如何实现！\n\n### Promise 构造函数\n\nPromise 构造函数是将回调转换为 Promise 的低级但普遍适用的方法。它适用于任何回调风格，并且只需要几行代码。\n\
  \nPromise 构造函数接收一个带有两个参数的函数：`resolve` 和 `reject` 函数。当其中一个被调用时，Promise 将根据传入 `resolve`\
  \ 函数的结果或传入 `reject` 的错误来定态。\n\n```\nnew Promise((res, rej) => {\n\n  // 用值解决\n \
  \ // res(value)\n\n  // 用错误拒绝：\n  // rej(error)\n})\n```\n\n这使得调用基于回调的函数并将其转换为 Promise\
  \ 变得容易，然后可以对其进行 `await`：\n\n```\n// Node 风格\nnew Promise((res, rej) => getUser(15,\
  \ (err, result) => {\n  if (err) {\n    rej(err);\n  }else {\n    res(result);\n\
  \  }\n}))\n\n// setTimeout\nnew Promise((res) => setTimeout(res, 100));\n\n// 基于事件\n\
  new Promise((res, rej) => {\n  const reader = new FileReader();\n  reader.onload\
  \ = (event) => {\n    // 解决 Promise\n    res(event.target.result);\n  }\n  reader.onerror\
  \ = (error) => {\n    // 拒绝 Promise\n    rej(error)\n  };\n  reader.readAsDataURL(blob);\n\
  });\n```\n\n#### 转换为 Promise 的函数\n\n上面的示例展示了如何调用基于回调的函数并返回一个 Promise，但每次调用都需要用 Promise\
  \ 样板代码包装。更好的做法是拥有一个模仿原始函数但不需要回调的函数。这样的函数将接收相同的参数（减去回调）并返回 Promise。\n\n要创建函数的 Promise\
  \ 化版本，只需将 Promise 构造函数包装在一个函数中，该函数接收回调之前的参数：\n\n```\n// setTimeout\nconst promisifiedSetTimeout\
  \ = (ms) =>\n  new Promise((res) => setTimeout(res, ms));\n\n// FileReader\nconst\
  \ promisifiedFileReader = (blob) =>\n  new Promise((res, rej) => {\n    const reader\
  \ = new FileReader();\n    reader.onload = (event) => {\n      res(event.target.result);\n\
  \    }\n    reader.onerror = (error) => {\n      rej(error)\n    };\n    reader.readAsDataURL(blob);\n\
  \  });\n\n// checkAdmin\nconst promisifiedCheckAdmin = (id) => new Promise((res)\
  \ => {\n  if (/* 管理员逻辑 */) {\n    res(true);\n  }else {\n    res(false);\n  }\n\
  };\n```\n\n这些函数是原始基于回调函数的直接替代品，可以直接在 async/await 工作流中使用：\n\n```\n// 超时\nsetTimeout(()\
  \ => {\n  console.log(\"超时已到\");\n}, 100);\n\nawait promisifiedSetTimeout(100);\n\
  console.log(\"超时已到\");\n\n// checkAdmin\nconst checkAdmin = (id, isAdmin, notAdmin)\
  \ => {\n  if (/* 管理员逻辑 */) {\n    isAdmin();\n  }else {\n    notAdmin();\n  }\n\
  };\n\ncheckAdmin(15, () => {\n  console.log(\"用户是管理员\");\n}, () => {\n  console.log(\"\
  用户不是管理员\");\n});\n\nconst admin = await promisifiedCheckAdmin(15);\nconsole.log(`用户是管理员:\
  \ ${admin}`);\n\n// FileReader\nconst dataURI = await promisifiedFileReader(blob);\n\
  ```\n\n### util.promisify\n\n虽然 Promise 构造函数提供了一种将回调转换为 Promise 的通用方法，但当回调模式遵循 Node\
  \ 风格时，有一种更简单的方法。`util.promisify` 接收基于回调的函数并返回一个 Promise 化版本。\n\n```\nimport util\
  \ from \"util\";\n\nconst promisifiedGetUser = util.promisify(getUser);\n\nconst\
  \ user = await promisifiedGetUser(15);\n// user 是结果对象\n```\n\n当调用 Promise 化函数时，回调参数会自动添加，并且它还会将结果（或错误）转换为\
  \ Promise 的返回值。\n\n它的工作原理并不神奇。它使用了我们上面讨论的 Promise 构造函数模式，并使用展开语法来允许任意数量的参数。一个简化的实现如下所示：\n\
  \n```\nconst promisify = (fn) => (...args) =>\n  new Promise((res, rej) => {\n \
  \   fn(...args, (err, result) => {\n      if (err) {\n        rej(err);\n      }else\
  \ {\n        res(result);\n      }\n    });\n  });\n```\n\n### 常见问题\n\n#### 处理 this\n\
  \n在 JavaScript 中，`this` 的值很复杂。根据你调用函数的方式，它可以获得不同的值。\n\n例如，类可以拥有附加到 `this` 的实例变量：\n\
  \n```\nclass C {\n  constructor() {\n    this.var = \"var\";\n  }\n  fn() {\n  \
  \  console.log(this.var);\n  }\n}\n```\n\n但是当你拥有这个类的对象时，你是直接在对象上调用这个函数，还是将其提取到另一个变量中，这会影响\
  \ `this` 的值：\n\n```\nnew C().fn(); // var\n\nlet fn = new C().fn;\nfn(); // TypeError:\
  \ Cannot read property 'var' of undefined\n```\n\n这会影响如何 Promise 化该对象的方法，因为 `util.promisify`\
  \ 只需要函数而不是整个对象。这反过来会破坏 `this`。\n\n例如，假设有一个 Database 对象，它在构造函数中创建连接，然后提供发送查询的方法：\n\
  \n```\nclass Database {\n  constructor() {\n    this.connection = \"数据库连接\";\n \
  \ }\n  getUser(id, cb) {\n    if (!this.connection) {\n      throw new Error(\"\
  无连接\");\n    }\n    setTimeout(() => {\n      if (id >= 0) {\n        cb(null, `用户:\
  \ ${id}`);\n      }else {\n        cb(new Error(\"id 必须为正数\"));\n      }\n    },\
  \ 100);\n  }\n}\n\nconst database = new Database();\ndatabase.getUser(15, (error,\
  \ user) => {\n  // 处理错误或用户\n})\n```\n\n使用 `util.promisify` 会破坏 `getUser` 函数，因为它改变了\
  \ `this` 的值：\n\n\n\n\n```\nconst promisifiedDatabaseGetUser =\n  util.promisify(database.getUser);\n\
  await promisifiedDatabaseGetUser(15);\n// Error: Cannot read property 'connection'\
  \ of undefined\n```\n\n要解决这个问题，可以将对象绑定到函数上，强制指定 `this` 的值：\n\n```\nconst promisifiedDatabaseGetUser\
  \ =\n  util.promisify(database.getUser.bind(database));\nconst user = await promisifiedDatabaseGetUser(15);\n\
  ```\n\n#### function.length\n\n函数的 `length` 属性表示它需要的参数个数。不要将其与 `Array` 的 `length`\
  \ 混淆，后者表示数组中*元素*的个数。\n\n例如，下面的函数需要 2 个参数，因此它的 `length` 为 2：\n\n```\nconst fn = (a,\
  \ cb) => {};\n\nconsole.log(fn.length); // 2\n```\n\n这个属性很少使用，但有些库依赖它的正确值，例如 [memoizee](https://www.npmjs.com/package/memoizee#user-content-arguments-length)\
  \ 会根据它决定如何缓存函数调用，或者 Markdown 编译器 [marked](https://www.npmjs.com/package/marked)\
  \ 会根据它判断其配置是[异步调用还是同步调用](https://github.com/markedjs/marked/blob/127ac84da0c4d0a651e00bbd4eebef65d95aed75/src/marked.js#L67)。\n\
  \n虽然函数的 `length` 很少使用，但它可能引发问题。`util.promisify` 不会改变它，因此转换后的函数与原始函数具有相同的 `length`，即使它需要的参数更少。\n\
  \n```\nconsole.log(fn.length); // 2\n\nconst promisified = util.promisify(fn);\n\
  \nconsole.log(promisified.length); // 2\n```\n\n## 将 Promise 转换为回调\n\n另一个方向是，你有一个返回\
  \ Promise 的函数（通常是 `async` 函数），需要将其转换为基于回调的函数。这种情况比反向转换要少得多，但有时确实需要，通常是在某个库期望异步函数且只支持回调时。\n\
  \n例如，marked 库支持一个 `highlight` 选项，该选项接收代码块并返回格式化后的版本。高亮函数接收代码、语言和一个回调参数，并期望用结果调用最后一个参数。\n\
  \n```\nimport marked from \"marked\";\nimport util from \"util\";\n\nconst promisifiedMarked\
  \ = util.promisify(marked);\n\nconst res = await promisifiedMarked(md, {\n  // highlight\
  \ 接收一个回调\n  highlight: (code, lang, cb) => {\n    const result = \"Code block\"\
  ;\n    cb(null, result);\n  }\n});\n```\n\n与 promisification 类似，将 async 函数转换为使用回调的方式有通用方法和\
  \ Node 回调专用方法。通用方法是使用 async IIFE（立即调用函数表达式），并在有结果或错误时通过 `then` 与回调交互：\n\n```\nhighlight:\
  \ (code, lang, cb) => {\n  (async () => {\n    const result = \"Code block\";\n\
  \    return result;\n  })().then((res) => cb(null, res), (err) => cb(err));\n}\n\
  ```\n\n这种结构支持所有回调风格，因为你可以控制如何将结果或错误传递给回调函数。\n\n对于 Node 风格的回调，可以使用 `util.callbackify`\
  \ 函数，它接收一个 async 函数并返回一个回调化版本：\n\n```\nhighlight: util.callbackify(async (code,\
  \ lang) => {\n  const result = \"Code block\";\n\n  return result;\n})\n```\n\n\
  这提供了一种便捷的结构，在大多数情况下都适用。\n\n此外，它会使结果函数的 `length` 增加 1，因为它除了原始参数外还需要一个回调参数：\n\n```\n\
  console.log(fn.length) // 2\nconsole.log(util.callbackify(fn).length) // 3\n```\n\
  \n# Promise 超时\n\n**JavaScript 中的 Promise 没有时间概念。** 当你使用 `await` 或通过 `.then()` 附加函数时，它会**一直等待直到\
  \ Promise 被 resolve 或 reject**。这通常不是问题，因为大多数异步任务会在合理时间内完成，并且需要其结果。\n\n但是，当客户端等待某个响应（比如\
  \ HTTP 服务器的响应）时，最好尽早返回错误，给调用者重试的机会，而不是等待可能很长的时间。\n\n幸运的是，有一个内置的 Promise 辅助函数可用于为任何基于\
  \ Promise 的结构添加超时功能。\n\n## Promise.race\n\n[Promise.race](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/race)\
  \ 是 `Promise` 对象的全局属性。**它接收一个 Promise 数组，并等待*第一个*完成**。race 的结果是 resolve 还是 reject\
  \ 取决于获胜者。\n\n![](img/9f8380b1ff6291470df6531613ee319b5bac317693c0f2d54da694da97dae3b4.png)\n\
  \np2 先完成\n\n例如，下面的代码让两个 Promise 竞赛。第二个更早 resolve，另一个的结果被丢弃：\n\n```\nconst p1 =\n\
  \  new Promise((res) => setTimeout(() => res(\"p1\"), 1000));\nconst p2 =\n  new\
  \ Promise((res) => setTimeout(() => res(\"p2\"), 500));\n\nconst result = await\
  \ Promise.race([p1, p2]);\n// result = p2\n```\n\n同样，它也适用于 reject。如果获胜的 `Promise`\
  \ 被 reject，则 race 被 reject：\n\n```\nconst p1 =\n  new Promise((res) => setTimeout(()\
  \ => res(\"p1\"), 1000));\nconst p2 =\n  new Promise((_r, rej) => setTimeout(()\
  \ => rej(\"p2\"), 500));\n\ntry {\n  const result = await Promise.race([p1, p2]);\n\
  } catch(e) {\n  // e = p2\n}\n```\n\n`Promise.race` 函数的参数是 *Promise*。这也使其适用于 `async`\
  \ 函数：\n\n```\nconst fn = async (time, label) => {\n  await new Promise((res) =>\
  \ setTimeout(res, time));\n  return label;\n}\n\nconst result =\n  await Promise.race([fn(1000,\
  \ \"p1\"), fn(500, \"p2\")])\n// result = p2\n```\n\n只是别忘了*调用* `async` 函数，这样 race\
  \ 才能得到 Promise。匿名函数可能会遇到这个问题，需要以 IIFE 风格包装：\n\n```\nconst result = await Promise.race([\n\
  \  fn(1000, \"p1\"),\n  (async () => {\n    await new Promise((res) => setTimeout(res,\
  \ 500));\n    return \"p2\";\n  })(),\n]);\n// result = p2\n```\n\n## 超时实现\n\n利用\
  \ `Promise.race`，可以轻松实现支持任何 Promise 的超时。除了异步任务之外，**再启动一个 `Promise`，当超时到达时 reject**。谁先完成（原始\
  \ Promise 或超时），谁就是结果。\n\n![](img/0c43ee3777ed3a14a2262881d8dcee6b4ccd9c3f4b984b8f042b98edd0f157e9.png)\n\
  \nPromise 在超时前完成\n\n```\nconst timeout = (prom, time) =>\n  Promise.race([\n   \
  \ prom,\n    new Promise((_r, rej) => setTimeout(rej, time))\n  ]);\n```\n\n使用这个辅助函数，包装任何\
  \ Promise，如果它在指定时间内没有产生结果，就会被 reject。\n\n```\n// 在 500 ms 内 resolve\nconst fn =\
  \ async () => {\n  await new Promise((res) => setTimeout(res, 500));\n  return \"\
  p2\";\n}\n\n// 在超时前完成\nconst result = await timeout(fn(), 1000);\n// result = p2\n\
  \n// 在 100 ms 时超时\nawait timeout(fn(), 100);\n// error\n```\n\n![](img/7221da63522922a688fa6822c7f619d06f1e665461f03a0c0d4ba10f1406dbab.png)\n\
  \n超时在 Promise 之前完成\n\n需要注意的是，**如果超时到达，它并不会终止 Promise**，只是丢弃其结果。如果 Promise 包含多个步骤，它们最终仍会执行完毕。\n\
  \n### 清除超时\n\n上述解决方案使用 `setTimeout` 调用来安排 reject。就像原始 Promise 在超时到达时不会终止一样，超时 Promise\
  \ **在 race 结束后不会取消这个定时器**。\n\n虽然这不会改变结果 Promise 的工作方式，但可能会产生副作用。事件循环需要检查定时器是否结束，某些环境可能会因未完成的定时器而表现不同。\n\
  \n让我们让包装函数使用 `Promise.finally` 来清除超时！\n\n```\nconst timeout = (prom, time) => {\n\
  \  let timer;\n  return Promise.race([\n    prom,\n    new Promise((_r, rej) =>\
  \ timer = setTimeout(rej, time))\n  ]).finally(() => clearTimeout(timer));\n}\n\
  ```\n\n上述实现将 `setTimeout` 的结果保存为 `timer`，并在 race 结束时清除它。\n\n### 错误对象\n\n\n\n\n\n\
  比赛结束了，但出现了拒绝。是因为超时，还是 `Promise` 抛出了错误？\n\n上述实现没有区分错误，这使得专门处理超时变得困难。\n\n```\nconst\
  \ fn = async () => {\n  throw new Error();\n};\n\ntry {\n  const result = await\
  \ timeout(fn(), 1000);\n}catch(e) {\n  // 错误还是超时？\n}\n```\n\n解决方案是添加第三个参数，即超时拒绝值。这样就有了区分错误的选项：\n\
  \n```\nconst timeout = (prom, time, exception) => {\n  let timer;\n  return Promise.race([\n\
  \    prom,\n    new Promise((_r, rej) =>\n      timer = setTimeout(rej, time, exception)\n\
  \    )\n  ]).finally(() => clearTimeout(timer));\n}\n```\n\n超时错误对象应该是什么？\n\nJavaScript\
  \ 中的 [Symbols](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol)\
  \ 是唯一对象，只与自身相等。这使得它们非常适合这种用例。将一个 `Symbol` 作为超时错误参数传递，然后检查拒绝值是否就是那个 `Symbol`。\n\n\
  ```\nconst timeoutError = Symbol();\ntry {\n  const result = await timeout(prom,\
  \ 1000, timeoutError);\n  // 处理结果\n}catch (e) {\n  if (e === timeoutError) {\n \
  \   // 处理超时\n  }else {\n    // 其他错误\n    throw e;\n  }\n}\n```\n\n这种结构允许专门处理超时错误。\n\
  \n# 异步序列化模式\n\n假设你有一个函数，它只在最近未计算过的情况下执行某些计算，从而在短时间内缓存结果。在这种情况下，**对该函数的后续调用会相互影响**，因为当需要刷新时，所有调用都必须等待。不考虑并发的实现可能会在缓存过期时多次并行执行刷新。\n\
  \n这个实现是有问题的：\n\n```\n// 返回一个将结果缓存 2 秒的函数\n// 有缺陷，不要使用\nconst badCachingFunction\
  \ = (() => {\n  const cacheTime = 2000;\n  let lastRefreshed = undefined;\n  let\
  \ lastResult = undefined;\n  return async () => {\n    const currentTime = new Date().getTime();\n\
  \    // 检查缓存是否足够新鲜\n    if (lastResult === undefined ||\n      lastRefreshed + cacheTime\
  \ < currentTime) {\n      // 刷新值\n      lastResult = await refresh();\n      lastRefreshed\
  \ = currentTime;\n    }\n    return lastResult;\n  }\n})();\n```\n\n当两个并发调用在函数需要刷新值时发生，`refresh`\
  \ 函数会被调用两次：\n\n```\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\
  \nconst refresh = async () => {\n  console.log(\"refreshing\")\n  await wait(1000);\n\
  };\n\nconst badCachingFunction = ...;\n\nbadCachingFunction();\nbadCachingFunction();\n\
  // refreshing\n// refreshing\n```\n\n正确的处理方式是**让第二个函数等待刷新过程**，而不启动另一个独立的刷新。\n\n\
  一种方法是**序列化对缓存函数的调用**。这使得*每个*函数都等待所有前面的函数完成，因此多个调用只触发一个刷新过程。\n\n这可以通过多种方式实现，但最简单的方法是让函数一个接一个地运行。在这种情况下，当一个函数需要刷新值时，其他函数会等待它完成，而不会启动自己的任务。\n\
  \n另一个需要类似解决方案的用例是，当后端调用需要令牌，而该令牌在一段时间后过期时。当调用遇到未授权错误时，它会刷新令牌并使用新令牌重试。其他后端调用需要等待新令牌才能运行。在这种情况下，这不仅仅是性能问题，因为新令牌会使所有旧令牌失效。\n\
  \n## 为什么 `await` 不是解决方案\n\n最简单的解决方案是使用 `await`，它可以轻松实现序列化。毕竟，这就是该关键字的作用。\n\n```\n\
  await badCachingFunction();\nbadCachingFunction();\n// refreshing\n```\n\n但这需要**调用之间的协作**，而这并不总是可行的。例如，当函数响应多种类型的事件而被调用时，`await`\
  \ 无法协调它们：\n\n```\ndocument.querySelector(\"#btn\").addEventListener(\"click\", ()\
  \ => {\n  fn();\n})\n\nwindow.addEventListener(\"message\",  => {\n  fn();\n});\n\
  ```\n\n在这种情况下，函数调用必须自行协调。\n\n## 通用解决方案\n\n解决方案是维护一个 Promise 队列，将它们一个接一个地链接起来。只需几行代码，并且是通用的，允许任何函数被序列化：\n\
  \n```\nconst serialize = (fn) => {\n  let queue = Promise.resolve();\n  return (...args)\
  \ => {\n    const res = queue.then(() => fn(...args));\n    queue = res.catch(()\
  \ => {});\n    return res;\n  };\n};\n```\n\n![](img/6600f68c8248bd1f1944c97a98bb9f325857eb96cbd5b1c092fd1fa91a14c374.png)\n\
  \n队列结构\n\n`Promise.resolve()` 是队列的起点。每次其他调用都会被追加到这个 `Promise` 上。\n\n`queue.then(()\
  \ => fn(...args))` 将函数调用添加到队列中，并将其结果保存在 `res` 中。它将在*当前调用及所有之前的调用都解决后*被解决。\n\n`queue\
  \ = res.catch(() => {})` 部分确保当队列的一部分被拒绝时，队列不会卡住。\n\n用这个序列化器包装缓存函数，确保即使有多个调用，也只运行一次刷新：\n\
  \n```\nconst fn = serialize((() => {\n  const cacheTime = 2000;\n  let lastRefreshed\
  \ = undefined;\n  let lastResult = undefined;\n  return async () => {\n    const\
  \ currentTime = new Date().getTime();\n    // 检查缓存是否足够新鲜\n    if (lastResult ===\
  \ undefined ||\n      lastRefreshed + cacheTime < currentTime) {\n      // 刷新值\n\
  \      lastResult = await refresh();\n      lastRefreshed = currentTime;\n    }\n\
  \    return lastResult;\n  }\n})());\n\nfn();\nfn();\n// refreshing\n```\n\n# 异步释放器模式\n\
  \n一种常见的模式是**运行一些初始化代码**来设置资源或配置，然后使用该资源，**最后**进行**清理**。它可以是全局属性，例如使用 [timekeeper](https://www.npmjs.com/package/timekeeper)\
  \ 冻结时间，使用 Puppeteer 启动 Chrome 浏览器，或创建临时目录。在所有这些情况下，你需要确保修改/资源被正确释放，否则它们可能会泄漏到代码库的其他部分。\n\
  \n例如，以下代码在系统临时目录中创建一个临时目录，然后在不需要时删除它。这在例如你想使用 ffmpeg 从视频中提取一些帧，并需要一个目录来告诉 `ffmpeg`\
  \ 命令输出图像时非常有用。\n\n```\n// 创建临时目录\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
  \ + path.sep\n);\ntry {\n\n  // 使用临时目录\n\n} finally {\n  // 删除目录\n  fs.rmdir(dir,\
  \ {recursive: true});\n}\n```\n\n类似的结构是 `console.time`，它需要一个 `console.timeEnd` 来输出代码段运行所花费的时间：\n\
  \n```\nconsole.time(\"name\");\ntry {\n  // ...\n} finally {\n  console.timeEnd(\"\
  name\");\n}\n```\n\n或者当你启动一个浏览器时，你想确保在不需要时关闭它：\n\n```\nconst browser = await puppeteer.launch({/*\
  \ ... */});\ntry {\n  // 使用浏览器\n} finally {\n  await browser.close();\n}\n```\n\n\
  所有这些情况都共享 `try..finally` 结构。没有它，**错误可能会跳过清理逻辑**，使资源保持初始化状态（或控制台计时仍在运行）：\n\n```\n\
  const browser = await puppeteer.launch({/* ... */});\n\n// 如果这里发生错误，浏览器将不会关闭！\n\n\
  await browser.close();\n```\n\n在其他语言（如 Java）中，这被称为 [try-with-resources](https://docs.oracle.com/javase/tutorial/essential/exceptions/tryResourceClose.html)，并且内置于语言中。例如，`BufferedReader`\
  \ 在块结束后被关闭：\n\n\n\n\n```\ntry (BufferedReader br =\n  new BufferedReader(new FileReader(path))\n\
  ) {\n  return br.readLine();\n}\n```\n\n这建立在[`AutoCloseable`](https://docs.oracle.com/javase/8/docs/api/java/lang/AutoCloseable.html)接口的`close`方法之上，因此很容易适应自定义资源类型。\n\
  \n但在 Javascript 中没有这样的结构。让我们看看如何实现一个！\n\n## Disposer 模式\n\n我们上面看到的`try..finally`结构的一个问题是**如何从`try`块内部返回值**。假设你想截取一个网站的截图，并希望稍后使用生成的图像。\n\
  \n```\nconst browser = await puppeteer.launch({/* ... */});\ntry {\n  const page\
  \ = await browser.newPage();\n  // ...\n  const screenshot = await page.screenshot({/*\
  \ ... */});\n\n  // the browser can be closed\n  // but how to use the screenshot\
  \ outside the try..finally?\n} finally {\n  await browser.close();\n}\n```\n\n一个次优的解决方案是在块外部声明一个变量，并用它来存储图像：\n\
  \n```\nlet screenshot;\n\nconst browser = await puppeteer.launch({/* ... */});\n\
  try {\n  const page = await browser.newPage();\n  // ...\n  screenshot = await page.screenshot({/*\
  \ ... */});\n} finally {\n  await browser.close();\n}\n\n// use screenshot\n```\n\
  \n更好的解决方案是**使用一个函数**：\n\n```\nconst makeScreenshot = async () => {\n  const browser\
  \ = await puppeteer.launch({/* ... */});\n  try {\n    const page = await browser.newPage();\n\
  \    // ...\n    return await page.screenshot({/* ... */});\n  } finally {\n   \
  \ await browser.close();\n  }\n}\n\nconst screenshot = await makeScreenshot();\n\
  ```\n\n这是 disposer 模式的基础。不同之处在于，**它不再将逻辑硬编码在`try..finally`块内部，而是接收一个函数**来实现那部分逻辑：\n\
  \n```\nconst withBrowser = async (fn) => {\n  const browser = await puppeteer.launch({/*\
  \ ... */});\n  try {\n    return await fn(browser);\n  } finally {\n    await browser.close();\n\
  \  }\n}\n\nconst screenshot = await withBrowser(async (browser) => {\n  const page\
  \ = await browser.newPage();\n  // ...\n  return await page.screenshot({/* ... */});\n\
  });\n```\n\n`withBrowser`函数包含了启动和关闭浏览器的逻辑，而**`fn`函数获取并使用浏览器实例**。每当参数函数返回时，浏览器会自动关闭，无需额外的清理逻辑。这种结构提供了一种优雅的方式来防止未关闭的资源残留。\n\
  \n这个模式的一个有趣之处在于，它是少数几个`return fn()`和`return await fn()`有区别的情况之一。通常，异步函数返回一个 Promise\
  \ 还是 Promise 的*结果*并不重要。但在这种情况下，如果没有`await`，`finally`块会在`fn()`调用完成*之前*运行。\n\n一个潜在的问题是，当参数函数返回时，其中可能还有任务正在运行。这通常发生在它启动了一个异步任务但没有等待其完成的情况下。在这种情况下，清理逻辑会运行并关闭浏览器实例，这可能导致错误。这通常是缺少`await`的标志。\n\
  \n# 重试异步操作\n\n## 退避算法\n\n一个 Javascript 应用向远程服务器发起了一个`fetch`调用，但失败了。它应该如何重试请求，以便最终成功，同时尽量减少调用次数？\n\
  \n退避算法确保**当目标系统无法处理请求时，不会因后续重试而使其不堪重负**。它通过在**重试之间引入等待时间**来实现这一点，给目标系统恢复的机会。\n\n\
  退避的需求基于这样一个观察：当服务过载时，它不可用，而发送更多请求只会加剧问题。当所有调用者暂时停止向已经过载的服务增加更多负载时，通常可以平滑流量峰值，仅带来轻微延迟。\n\
  \n![](img/81ffa39b4f50a6322742cfe80c6b0abe4a54d33a4cfc6e65c6d6bbe6f6f2f07c.png)\n\
  \n重试之间的等待\n\n**所使用的退避算法决定了重试之间等待的时间**。在网络拥塞的情况下，例如移动网络饱和时，最佳配置正在积极研究中。令人着迷的是，不同的实现会产生截然不同的有效带宽。\n\
  \n重试对远程服务器的失败调用是一个简单得多的问题，正确实现它不需要多年的研究。在本文中，你将学习如何在 Javascript 中实现一个足以满足所有实际需求的退避解决方案。\n\
  \n### 指数退避\n\n但让我们先重新审视选择退避策略的问题，即**重试之间等待多长时间**！发送请求太快会给可能已经不堪重负的服务器增加更多负载，而等待太久则会导致过多的延迟。\n\
  \n指数退避已成为标准算法。它对后续重试的等待时间呈指数增长，这使得前几次尝试只有轻微延迟，同时能快速达到较长的等待时间。\n\n它有两个参数：**第一个周期的延迟**和**增长因子**。例如，当第一次重试等待\
  \ 10 毫秒，后续每次翻倍时，等待时间依次为：10、20、40、80、160、320、640、1280……\n\n![](img/d5191b2e9a717182d5ab61edf29b6752ce765f65c23731a334bd94a7bf8e27c4.png)\n\
  \n指数退避\n\n## Javascript 实现\n\n实现退避算法时有两个陷阱。\n\n首先，确保**只在重试前等待，而不是在第一次请求前等待**。先等待再发送请求会为成功的请求也引入延迟。\n\
  \n其次，确保**限制重试次数**，以便代码最终放弃并抛出错误。即使调用最终成功，上游可能已经超时，用户很可能收到错误。及时返回错误并让用户重试操作是一种良好的用户体验实践。\n\
  \n在重试方面，有两种操作类型：基于拒绝的和基于进度的。让我们逐一讨论！\n\n### 基于拒绝的重试\n\n这种类型的调用**要么成功要么失败**，通常实现为\
  \ Promise 的 resolve 或 reject。一个典型的例子是“保存”按钮，它可能失败，在这种情况下，重试意味着再次发送请求。\n\n![](img/2117662494b59818a77ac0f1f0b249e36841997112e113693732a4400b88382a.png)\n\
  \n基于拒绝的重试\n\n为了说明，这个操作模拟了一个 90%时间会失败的网络调用：\n\n```\nconst wait = (ms) => new Promise((res)\
  \ => setTimeout(res, ms));\nconst maybeFail = (successProbability, result, error)\
  \ =>\n  new Promise((res, rej) => Math.random() < successProbability\n    ? res(result)\n\
  \    : rej()\n  );\n\nconst maybeFailingOperation = async () => {\n  await wait(10);\n\
  \  return maybeFail(0.1, \"result\", \"error\");\n}\n```\n\n在没有重试机制的情况下调用这个函数是糟糕的用户体验。用户需要反复点击按钮直到成功。\n\
  \n一个通用的解决方案，可以接受任何异步函数，并在放弃前重试几次：\n\n```\nconst callWithRetry = async (fn, depth\
  \ = 0) => {\n  try {\n    return await fn();\n  }catch(e) {\n    if (depth > 7)\
  \ {\n      throw e;\n    }\n    await wait(2 ** depth * 10);\n\n    return callWithRetry(fn,\
  \ depth + 1);\n  }\n}\n```\n\n并将其与上面定义的操作一起使用：\n\n```\nconst result = await callWithRetry(maybeFailingOperation);\n\
  ```\n\n在重试实现中，`depth`参数表示到目前为止对服务的调用次数。它决定了等待多长时间（`await wait(2 ** depth * 10)`）以及何时放弃（`if\
  \ (depth > 7) {...}`）。当函数调用自身时，它会递增这个值。\n\n\n\n\n有趣的是，这是一个使用 `return await` 会产生差异的场景。通常情况下，异步函数返回一个\
  \ Promise 还是其解析值并不重要。但在这个例子中并非如此，因为 `try..catch` 需要等待 `fn()` 调用完成，才能处理它抛出的异常。\n\n\
  请注意，此实现会对*任何错误*进行重试，即使是不可重试的错误（例如发送无效数据）也不例外。\n\n### 基于进度的重试\n\n另一类可重试操作是**每次调用可能取得部分进展，但未必能完成**。\n\
  \n一个很好的例子是 DynamoDB 的 `batchWriteItem` 调用。你定义要存储的项，该调用会尝试保存所有项。然后，它会在响应中返回一个列表，指示哪些元素失败。重试操作只需包含这些失败的项，而不需要整个请求。\n\
  \n![](img/eab2c064636a7004eb33ea8188c39e723476b67a79447737f4b9cbf93af9e9bd.png)\n\
  \n基于进度的重试\n\n作为示例，以下函数模拟了一个向远程服务器发送的进度调用。它返回一个从 0 到 1 的 `progress` 字段，并在调用完全完成时返回\
  \ `result`。它还需要知道*当前进度*，这是调用的一个参数：\n\n```\nconst progressingOperation = async (startProgress\
  \ = 0) => {\n  await wait(10);\n  const progress = Math.round(\n    Math.min(startProgress\
  \ + Math.random() / 3, 1) * 10\n  ) / 10;\n  return {\n    progress,\n    result:\
  \ progress === 1 ? \"result\" : undefined,\n  };\n}\n```\n\n在这种情况下，未完成时仍然会解析 Promise，这模拟了\
  \ DynamoDB API 的行为。但其他 API 可能会拒绝它。幸运的是，将拒绝的 Promise 转换为已解析的 Promise 很容易：`.catch()`。\n\
  \n在 DynamoDB `batchWriteItem` 示例中，`progress` 返回字段是未处理项的列表，而 `startProgress` 参数是要保存的项。\n\
  \n要重试上述调用直到完成，可以使用：\n\n```\nconst callWithProgress = async (fn, status, depth =\
  \ 0) => {\n  const result = await fn(status);\n\n  // 检查是否完成\n  if (result.progress\
  \ === 1) {\n    // 已完成\n    return result.result;\n  }else {\n    // 未完成\n    if\
  \ (depth > 7) {\n      throw result;\n    }\n    await wait(2 ** depth * 10);\n\n\
  \    return callWithProgress(fn, result.progress, depth + 1);\n  }\n}\n```\n\n要使用这个重试调用，可以这样：\n\
  \n```\nconst result = await callWithProgress(progressingOperation);\n```\n\n请注意，此实现并非通用，因为它依赖于调用返回进度信息的方式。\n\
  \n# 使用异步生成器进行分页\n\n许多 API 限制单次调用返回的结果数量。例如，AWS SDK 中返回列表的函数都是分页操作。这意味着你一次调用只能获得有限数量的元素，同时会得到一个用于获取下一批数据的令牌。如果你没有意识到这一点，可能会在开发时获取所有元素，但函数将来可能会出现问题。\n\
  \n然而，获取第一批数据只需 `await lambda.listFunctions().promise()`，但要分页直到检索完所有页面，则需要更多工作。\n\
  \n让我们看看如何创建一个可 `await` 的结构，可靠地从 AWS API 获取所有元素！\n\n## 分页\n\n以 Lambda 函数为例，如果你的 Lambda\
  \ 函数数量不多（最多 50 个），`lambda.listFunctions` [调用](https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/Lambda.html#listFunctions-property)\
  \ 会返回一个包含所有 Lambda 函数列表的结构：\n\n```\nconst functions = await lambda.listFunctions().promise();\n\
  ```\n\n```\n{\n  Functions: [...]\n}\n```\n\n要模拟分页情况，可以设置 `MaxItems` 参数：\n\n```\n\
  const functions = await lambda.listFunctions({\n  MaxItems: 1\n}).promise();\n```\n\
  \n这次还会返回一个 `NextMarker`，表示还有更多项：\n\n```\n{\n  Functions: [...],\n  NextMarker: ...\n\
  }\n```\n\n要获取下一批数据，需要提供上一个标记：\n\n```\nconst functions = await lambda.listFunctions({\n\
  \  MaxItems: 1,\n  Marker: functions.NextMarker,\n}).promise();\n```\n\n然后重复此过程，直到不再返回\
  \ `NextMarker`。\n\n## 使用异步生成器的解决方案\n\n异步生成器是 JavaScript 中相对较新的特性。它们类似于传统的生成器函数，但它们是异步的，这意味着你可以在其中使用\
  \ `await`。\n\n要收集所有 Lambda 函数，无论需要多少次调用，可以使用：\n\n```\nconst getAllLambdas = async\
  \ () => {\n  const EMPTY = Symbol(\"empty\");\n\n  const res = [];\n  for await\
  \ (const lf of (async function*() {\n    let NextMarker = EMPTY;\n    while (NextMarker\
  \ || NextMarker === EMPTY) {\n      const functions = await lambda.listFunctions({\n\
  \        Marker: NextMarker !== EMPTY ? NextMarker : undefined,\n      }).promise();\n\
  \      yield* functions.Functions;\n      NextMarker = functions.NextMarker;\n \
  \   }\n  })()) {\n    res.push(lf);\n  }\n\n  return res;\n}\n\n// 使用它\nconst functions\
  \ = await getAllLambdas();\n```\n\n异步生成器函数\n\n一个可以使用 `await` 的生成器函数。当遇到 `yield`\
  \ 或 `yield*` 时，执行会暂停，直到请求下一个元素。\n\n```\nconst wait = (ms) =>\n  new Promise((res)\
  \ => setTimeout(res, ms));\n\nconst gen = async function*() {\n  console.log(\"\
  start\");\n  await wait(100);\n  yield 1;\n  await wait(100);\n  console.log(\"\
  next\");\n  yield 2;\n  await wait(100);\n  console.log(\"end\");\n};\n\nconst it\
  \ = gen();\nconsole.log(await it.next());\nconsole.log(await it.next());\nconsole.log(await\
  \ it.next());\n\n// start\n// { value: 1, done: false }\n// next\n// { value: 2,\
  \ done: false }\n// end\n// { value: undefined, done: true }\n```\n\n### 分解说明\n\n\
  最重要的是跟踪上一次调用返回的 `NextMarker`，并用它来进行下一次调用。对于第一次调用，`Marker` 应为 `undefined`，为了区分第一次和最后一次（不返回\
  \ `NextMarker` 的那次），使用 Symbol 是一个安全的选择，因为它不会被 API 返回。\n\n```\nconst EMPTY = Symbol(\"\
  empty\");\nlet NextMarker = EMPTY;\nwhile (NextMarker || NextMarker === EMPTY) {\n\
  \  // Marker: NextMarker !== EMPTY ? NextMarker : undefined\n\n  NextMarker = functions.NextMarker;\n\
  }\n```\n\n调用之后，我们需要 `yield` 返回的函数：\n\n```\nyield* functions.Functions;\n```\n\n\
  `yield*` 确保每个元素作为单独的值由生成器返回。\n\n最后，使用 `for await..of` 循环收集结果，并将它们作为数组返回：\n\n```\n\
  const res = [];\nfor await (const lf of (async function*() {\n  ...\n})()) {\n \
  \ res.push(lf);\n}\nreturn res;\n```\n\n要使用它，只需调用该函数并等待返回的 Promise 解析：\n\n```\n\
  const functions = await getAllLambdas();\n```\n\n## 使其通用化\n\n相同的 `Marker`/`NextMarker`\
  \ 模式在 AWS SDK 中随处可见。但不幸的是，不同服务的命名不同。例如，获取 CloudWatch Logs 日志组时，你需要提供一个 `nextToken`\
  \ [参数](https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/CloudWatchLogs.html#describeLogGroups-property)。这使得无法用一个通用包装器支持所有列表函数。\n\
  \n幸运的是，由于模式相同，我们可以创建一个包装函数，处理除命名之外的所有内容：\n\n```\nconst getPaginatedResults = async\
  \ (fn) => {\n  const EMPTY = Symbol(\"empty\");\n  const res = [];\n  for await\
  \ (const lf of (async function*() {\n    let NextMarker = EMPTY;\n    while (NextMarker\
  \ || NextMarker === EMPTY) {\n      const {marker, results} = await fn(\n      \
  \  NextMarker !== EMPTY ? NextMarker : undefined\n      );\n\n      yield* results;\n\
  \      NextMarker = marker;\n    }\n  })()) {\n    res.push(lf);\n  }\n\n  return\
  \ res;\n};\n```\n\n它的结构与之前相同，但接受一个 `fn` 参数，该参数执行实际的 API 调用并返回列表和标记。\n\n要使用此包装器获取所有\
  \ Lambda 函数：\n\n\n\n\n```\nconst lambdas = await getPaginatedResults(async (NextMarker)\
  \ => {\n  const functions = await lambda.listFunctions(\n    {Marker: NextMarker}\n\
  \  ).promise();\n  return {\n    marker: functions.NextMarker,\n    results: functions.Functions,\n\
  \  };\n});\n```\n\n适配到日志组：\n\n```\nconst logGroups =\n  await getPaginatedResults(async\
  \ (NextMarker) => {\n    const logGroups = await logs.describeLogGroups(\n     \
  \ {nextToken: NextMarker}\n    ).promise();\n    return {\n      marker: logGroups.nextToken,\n\
  \      results: logGroups.logGroups,\n    };\n  });\n```\n\n# 在 postMessage 中使用异步函数\n\
  \n`postMessage` 调用允许在不同浏览上下文（例如 IFrame 和 Web Worker）之间建立异步通信通道，在这些上下文中直接函数调用无法工作。它的工作原理是向对方发送一条消息，然后接收端可以监听\
  \ `message` 事件。\n\n例如，页面可以通过 `postMessage` 与 IFrame 通信，并向彼此的窗口发送事件。`iframe.contentWindow.postMessage()`\
  \ 调用向 IFrame 发送消息，而 `window.parent.postMessage()` 则向主页面发送消息。两端可以使用 `window.addEventListener(\"\
  message\", (event) => {...})` 监听来自对方的消息。\n\n```\n// index.html\nconst iframe = document.querySelector(\"\
  iframe\");\n\nwindow.addEventListener(\"message\", ({data}) => {\n  // 3: 接收响应\n\
  \  console.log(\"来自 iframe 的消息: \" + data);\n});\n\n// 1: 发送请求\niframe.contentWindow.postMessage([5,\
  \ 2]);\n\n// iframe.html\nwindow.addEventListener(\"message\", ({data}) => {\n \
  \ // 2: 发送响应\n  window.parent.postMessage(event.data[0] + event.data[1]);\n});\n\
  ```\n\n![](img/b1786475a19dc022bf1f3004f04a3cdc36dd119d4b068f2b65998e8f866a5ba5.png)\n\
  \n页面与 IFrame 的通信\n\n对于 Web Worker，每个 Worker 都有独立的消息处理器。页面可以使用 `worker.postMessage()`\
  \ 调用向特定 Worker 发送消息，并使用 `worker.addEventListener(\"message\", (event) => {...})`\
  \ 监听来自该 Worker 的事件。在另一端，Worker 使用全局函数 `postMessage()` 和 `addEventListener()` 发送和接收事件：\n\
  \n```\n// index.html\nconst worker = new Worker(\"worker.js\");\nworker.addEventListener(\"\
  message\", ({data}) => {\n  console.log(\"来自 worker 的消息: \" + data); // 3\n});\n\
  \nworker.postMessage([5, 5]); // 1\n\n// worker.js\naddEventListener(\"message\"\
  , (event) => {\n  postMessage(event.data[0] + event.data[1]); // 2\n}, false)\n\
  ```\n\n## 请求-响应通信\n\n与 IFrame 和 Worker 通信都存在一些问题。首先，发送请求和处理响应是分离的。**接收端使用全局（或每个\
  \ Worker 的）事件监听器**，该监听器在所有调用之间共享。\n\n这对于“通知式”消息来说很好，即一端想通知另一端发生了某事，但不期望得到响应。但**通知式消息传递很少见**。通常需要的是“请求-响应式”消息传递。\n\
  \n例如，一端使用访问令牌，另一端可以刷新它。通信包括刷新请求和带有刷新令牌的响应。或者，当用户点击按钮而另一端需要处理该事件时也是如此。这个例子看起来像是“通知式”消息，但当操作进行时需要禁用按钮（如保存按钮），或者可能出现发送方需要知道的错误时，它就变成了请求-响应。\n\
  \n全局（或每个 Worker 的）消息处理器不适合将响应与请求配对。理想的解决方案是将所有这些复杂性隐藏在异步函数调用后面，并使用 `await` 等待结果：\n\
  \n```\nconst result = await add(10, 5);\n```\n\n让我们看看如何创建这样一个函数！\n\n### 响应标识\n\n\
  第一个任务是知道哪个请求触发了给定的响应。使用全局事件处理器的问题在于，很容易依赖一次只发生一个通信。当你测试 Web 应用时，你一次只测试一件事，但用户不会那么体贴。你不能假设任何时候只会发生一个请求-响应。\n\
  \n![](img/fe5ec8337fbbff1aac2fec193f30a60c549566acdab873dd3eab8e52fe5153a8.png)\n\
  \n非多路复用通道\n\n一种解决方案是使用*请求标识符*将响应与请求配对。\n\n![](img/b5b51157b8c956a6b5cbe1c493ca6946506fc1deedecbf7ead2f4895ca1bacbd.png)\n\
  \n请求 ID\n\n这种方法可行，尽管需要一些编码，但这是一个很好的解决方案。\n\n#### MessageChannel\n\n幸运的是，语言内置了一个更好的解决方案。`MessageChannel`\
  \ 允许一个专用的通信通道附加到 `postMessage` 调用上。发送端可以监听*该通道上*的消息，该通道与所有其他调用分离，接收端可以通过它获得的 `MessagePort`\
  \ 发送响应。\n\n`MessageChannel` 创建两个 `MessagePort`，一个用于通信的每一端。每个端口都支持 `onmessage` 和\
  \ `postMessage`，类似于基本的跨上下文通信通道。\n\n```\n// index.html\nconst worker = new Worker(\"\
  worker.js\");\n// 创建一个通道\nconst channel = new MessageChannel(); \n\n// 监听一端\nchannel.port1.onmessage\
  \ = ({data}) => {\n  console.log(\"来自通道的消息: \" + data); // 3\n};\n\n// 发送另一端\nworker.postMessage([15,\
  \ 2], [channel.port2]); // 1\n\n// worker.js\naddEventListener(\"message\", (event)\
  \ => {\n  // 在接收到的端口上响应\n  event.ports[0].postMessage(event.data[0] + event.data[1]);\
  \ // 2\n}, false)\n```\n\n要为端口附加消息处理器，请使用 `port.onmessage = (event) => {...}`。如果使用\
  \ `addEventListener`，则还需要启动通道：\n\n```\nport.addEventListener(\"message\", (event)\
  \ => {...});\nport.start();\n```\n\n要将端口附加到 `postMessage` 调用，请使用第二个参数：`postMessage(data,\
  \ [channel.port2])`。要在另一端使用此端口，请使用 `event.ports[0].postMessage()`。\n\n通过为每个请求创建一个新的\
  \ `MessageChannel`，响应的配对问题就解决了，因为通过该通道传来的任何内容都是对该特定请求的响应。\n\n### 错误处理\n\n请求-响应通信中一个经常被忽视的方面是错误处理。当接收端出现问题并抛出\
  \ `Error` 时，应该将其传播给发送方，以便发送方能够适当处理。\n\n`postMessage` 的问题在于它只能发送一种类型的消息，没有 `postError`\
  \ 调用。那么如何发出错误信号呢？\n\n一种可能的解决方案类似于 Node 风格的回调，仅使用一个函数来传播错误。这些回调同时使用错误和结果值，但只定义其中一个：\n\
  \n```\n(err, result) => {\n  if (err) {\n    // 错误\n  } else {\n    // 结果\n  }\n\
  }\n```\n\n为了用消息实现同样的效果，使用一个包含 `error` 和 `result` 属性的对象。当前者非空时，表示发生了错误。\n\n```\n\
  // worker.js\ntry{\n  event.ports[0].postMessage(\n    {result: event.data[0] +\
  \ event.data[1]}\n  );\n}catch(e) {\n  event.ports[0].postMessage({error: e});\n\
  }\n\n// index.html\nchannel.port1.onmessage = ({data}) => {\n  if (data.error) {\n\
  \    // 错误\n  }else {\n    // data.result\n  }\n};\n```\n\n不要忘记将接收端包裹在 try-catch\
  \ 中，以传播运行时错误。\n\n## 使用 Promise\n\n有了分离的响应通道和错误传播，很容易将调用包装在 `Promise` 构造函数中。\n\n\
  ```\nconst worker = new Worker(\"worker.js\");\n\nconst add = (a, b) => new Promise((res,\
  \ rej) => {\n  const channel = new MessageChannel(); \n\n  channel.port1.onmessage\
  \ = ({data}) => {\n    channel.port1.close();\n    if (data.error) {\n      rej(data.error);\n\
  \    }else {\n      res(data.result);\n    }\n  };\n\n  worker.postMessage([a, b],\
  \ [channel.port2]);\n});\n\nconsole.log(await add(3, 5)); // 8\n```\n\n\n\n\n通过一个`Promise`隐藏远程调用的所有复杂性，所有与\
  \ async/await 配合使用的方式同样适用于这些调用：\n\n```\n// 并行执行\nconsole.log(await Promise.all([\n\
  \  add(1, 1),\n  add(5, 5),\n])); // [2, 10]\n\n// 异步归约\nconsole.log(await [1, 2,\
  \ 3, 4].reduce(async (memo, i) => {\n  return add(await memo, i);\n}), 0); // 10\n\
  ```\n\n并且当需要时，`Promise` 会拒绝，从而允许在发送端进行适当的错误处理：\n\n```\n// worker.js\naddEventListener(\"\
  message\", (event) => {\n  try{\n    if (\n      typeof event.data[0] !== \"number\"\
  \ ||\n      typeof event.data[1] !== \"number\"\n    ) {\n      throw new Error(\"\
  both arguments must be numbers\");\n    }\n    event.ports[0].postMessage(\n   \
  \   {result: event.data[0] + event.data[1]}\n    );\n  }catch(e) {\n    event.ports[0].postMessage({error:\
  \ e});\n  }\n}, false)\n\n// index.html\ntry {\n  await add(undefined, \"b\");\n\
  }catch(e) {\n  console.log(\"Error: \" + e.message); // error\n}\n```\n\n一个限制是可以通过\
  \ `postMessage` 调用发送的内容。它使用*结构化克隆算法*，该算法支持复杂对象，但[并非所有内容](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm)。\n\
  \n# 使用异步函数处理集合\n\n虽然 async/await 非常适合让异步*命令*看起来像同步命令，但集合处理就没那么简单了。仅仅在传递给 `Array.reduce`\
  \ 的函数前加上 `async`，它并不会神奇地正确工作。但如果没有异步函数，你就无法使用 `await` 并在*之后*提供结果，而这对于读取数据库、建立网络连接、读取文件以及许多其他操作来说是必需的。\n\
  \n让我们看一些例子！\n\n当你需要使用的所有函数都是同步的时，事情很简单。例如，一个字符串可以在不涉及任何异步操作的情况下被加倍：\n\n```\nconst\
  \ double = (str) => {\n  return str + str;\n};\n\ndouble(\"abc\");\n// abcabc\n\
  ```\n\n如果函数是异步的，那么对于单个项目使用 `await` 也很简单。例如，要计算 SHA-256 哈希，JavaScript 提供了一个 `digest()`\
  \ 异步函数：\n\n```\n// https://developer.mozilla.org/docs/Web/API/SubtleCrypto/digest\n\
  const digestMessage = async (message) => {\n  const msgUint8 = new TextEncoder().encode(message);\n\
  \  const hashBuffer =\n    await crypto.subtle.digest(\"SHA-256\", msgUint8);\n\
  \  const hashArray = Array.from(new Uint8Array(hashBuffer));\n  const hashHex =\
  \ hashArray\n    .map(b => b.toString(16).padStart(2, \"0\"))\n    .join('');\n\
  \  return hashHex;\n};\n\nawait digestMessage(\"msg\");\n// e46b320165eec91e6344fa1034...\n\
  ```\n\n这看起来与之前的调用几乎相同，唯一的区别是加了一个 `await`。\n\n但对于集合来说，处理异步就变得不同了。\n\n要计算**字符串集合**中每个元素的加倍，使用\
  \ `map` 很简单：\n\n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nstrings.map(double);\n\
  // [\"msg1msg1\", \"msg2msg2\", \"msg3msg3\"]\n```\n\n但要计算集合中每个字符串的**哈希**，就不行了：\n\
  \n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nawait strings.map(digestMessage);\n\
  // [object Promise],[object Promise],[object Promise]\n```\n\n这是一个常见问题，因为异步函数比同步函数涵盖的范围更广。同步函数可以在异步环境中工作，但异步函数无法转换为同步方式。\n\
  \n对于更实际的场景，查询数据库本质上是异步的，因为它需要建立网络连接。从假设的数据库中获取单个 `userId` 的分数很简单：\n\n```\nconst\
  \ getUserObject = async (id) => {\n  // 根据 id 获取用户\n};\n\nconst userId = 15;\nconst\
  \ userObject = await getUserObject(userId);\nconst userScore = userObject.score;\n\
  ```\n\n但是如何查询一个*集合*的 `userId` 呢？\n\n```\nconst userIds = [15, 16, 21];\n// const\
  \ userObjects = ???\n```\n\n而且这不仅仅是使用 `map` 将一个值转换为另一个值。用户的分数是否大于 3？\n\n```\nconst\
  \ userObject = await getUserObject(userId);\nconst above3 = userObject.score > 3;\n\
  ```\n\n但是*任意*用户的分数是否大于 3？\n\n```\n// userIds.some(???)\n```\n\n或者平均分数是多少？\n\n```\n\
  // userIds.reduce(???)\n```\n\n更有趣的是，在 `map` 中添加 `async` 至少能给出一些变化的提示：\n\n```\n\
  // 同步\n[1, 2, 3].map((i) => {\n  return i + 1;\n});\n// [2, 3, 4]\n\n// 异步\n[1,\
  \ 2, 3].map(async (i) => {\n  return i + 1;\n});\n// [object Promise],[object Promise],[object\
  \ Promise]\n```\n\n但 `filter` 的行为则完全错误：\n\n```\n// 同步\n[1, 2, 3, 4, 5].filter((i)\
  \ => {\n  return i % 2 === 0;\n});\n// [2, 4]\n\n// 异步\n[1, 2, 3, 4, 5].filter(async\
  \ (i) => {\n  return i % 2 === 0;\n});\n// [1, 2, 3, 4, 5]\n```\n\n因此，异步集合处理需要一些努力，并且根据你想使用的函数类型而有所不同。异步\
  \ `map` 的工作方式与异步 `filter` 或异步 `reduce` 明显不同。\n\n在本章中，你将学习每种方法的工作原理以及如何高效地使用它们。\n\
  \n## 异步迭代\n\n但首先，让我们谈谈 `for` 循环！\n\n我不喜欢 `for` 循环，因为它们往往助长不良的编码习惯，比如一次性做很多事的嵌套循环，或者散布在各处的\
  \ `continue`/`break` 语句，很快就会变成难以维护的混乱。\n\n此外，使用 `map`/`filter`/`reduce` 等函数的函数式方法提倡一种风格：一个函数只做一件事，内部所有内容都是作用域内的且无状态的。而且函数式方法不仅在\
  \ 99% 的情况下可行，而且不会带来明显的性能下降，还能产生更简洁的代码（当然，至少在你熟悉相关函数时是这样）。\n\n但 async/await 属于剩下的\
  \ 1%。\n\n`for` 循环有一个显著特点：它们不依赖于*调用*函数。实际上，你可以在循环内部使用 `await`，它就能正常工作。\n\n```\n//\
  \ 同步\n{\n  const res = [];\n  for (let i of [1, 2, 3]){\n    res.push(i + 1);\n\
  \  }\n  // res: [2, 3, 4]\n}\n\n// 异步\n{\n  const res = [];\n  for (let i of [1,\
  \ 2, 3]){\n    await sleep(10);\n    res.push(i + 1);\n  }\n  // res: [2, 3, 4]\n\
  }\n```\n\n由于 `for` 循环是一种通用工具，它们可以用于处理集合时的各种需求。\n\n但它们的缺点仍然存在，虽然将函数式方法适配到 async/await\
  \ 并非易事，但一旦你开始看到通用模式，它也没那么难。\n\n## 使用 reduce 的异步函数\n\n`reduce` 函数迭代地构建一个值并返回它，这个值不一定是集合。这就是名称的由来，因为它将集合*归约*为一个值。\n\
  \n迭代函数接收前一个结果（在下面的例子中称为 `memo`）和当前值 `e`。\n\n以下函数对元素求和，从 0 开始（`reduce` 的第二个参数）：\n\
  \n```\nconst arr = [1, 2, 3];\n\nconst syncRes = arr.reduce((memo, e) => {\n  return\
  \ memo + e;\n}, 0);\n\nconsole.log(syncRes);\n// 6\n```\n\n| `memo`   |       `e`\
  \       |   结果 |\n| --- | --- | --- |\n| 0 (初始值) | **1** | 1 |\n| 1 | **2** | 3\
  \ |\n| 3 | **3** | (最终结果) 6 |\n\n![](img/87a5c26af62b04b8a3f8f8f31fadb7f21ef4327dd2eb7167aa4ee5b222f5a055.png)\n\
  \nreduce 函数\n\n### 异步 reduce\n\n异步版本几乎相同，但每次迭代返回一个 `Promise`，因此 `memo` 将是前一个结果的\
  \ `Promise`。迭代函数需要 `await` 它才能计算下一个结果：\n\n```\n// 用于休眠的实用函数\nconst sleep = (n) =>\
  \ new Promise((res) => setTimeout(res, n));\n\nconst arr = [1, 2, 3];\n\nconst asyncRes\
  \ = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n  return (await memo)\
  \ + e;\n}, 0);\n\nconsole.log(asyncRes);\n// 6\n```\n\n| `memo`   |       `e`  \
  \     |   结果 |\n| --- | --- | --- |\n| 0 (初始值) | **1** | `Promise(1)` |\n| `Promise(1)`\
  \ | **2** | `Promise(3)` |\n| `Promise(3)` | **3** | (最终结果) `Promise(6)` |\n\n\n\
  \n\n\n## 异步 reduce 函数\n\n借助 `async (memo, e) => await memo` 的结构，`reduce` 可以处理任何异步函数，并且可以被\
  \ `await`。\n\n### 时序\n\n在 `reduce` 中，并发有一个有趣的特性。在同步版本中，元素会逐个处理，这并不奇怪，因为它们依赖于*前一个*结果。但当异步\
  \ `reduce` 运行时，所有迭代函数会并行启动，并且仅在需要时才等待前一个结果（`await memo`）。\n\n#### 后置 await memo\n\
  \n在上面的例子中，所有的 `sleep` 是并行发生的，因为让函数等待前一个完成的 `await memo` 出现在后面。\n\n```javascript\n\
  const arr = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\nconst asyncRes\
  \ = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n  return (await memo)\
  \ + e;\n}, 0);\n\nconsole.log(`耗时 ${new Date().getTime() - startTime} 毫秒`);\n//\
  \ 耗时 11-13 毫秒\n```\n\n![](img/0b9006991849f3db718eda88ce54dd1256aac7028395d38d486e40e017b9c20c.png)\n\
  \n后置 \"await memo\" 的异步 reduce\n\n#### 前置 await memo\n\n但当 `await memo` 放在前面时，函数会顺序执行：\n\
  \n```javascript\nconst arr = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\
  \nconst asyncRes = await arr.reduce(async (memo, e) => {\n  await memo;\n  await\
  \ sleep(10);\n  return (await memo) + e;\n}, 0);\n\nconsole.log(`耗时 ${new Date().getTime()\
  \ - startTime} 毫秒`);\n// 耗时 36-38 毫秒\n```\n\n![](img/b5be8ee75623f698e0f641badb7276bd5dcf61c7743e9b3960452f00be724050.png)\n\
  \n前置 \"await memo\" 的异步 reduce\n\n这种行为通常不是问题，因为它自然意味着所有不依赖前一个结果的部分会立即计算，只有依赖的部分才会等待前一个值。\n\
  \n#### 当并行性很重要时\n\n但在某些情况下，提前做一些事情可能是不可行的。\n\n例如，我有一段代码，它打印不同的 PDF 并使用 [pdf-lib](https://www.npmjs.com/package/pdf-lib)\
  \ 库将它们合并成一个文件。\n\n以下实现并行运行资源密集型的 `printPDF` 函数：\n\n```javascript\nconst result =\
  \ await printingPages.reduce(async (memo, page) => {\n  const pdf = await PDFDocument.load(await\
  \ printPDF(page));\n\n  const pdfDoc = await memo;\n\n  (await pdfDoc.copyPages(pdf,\
  \ pdf.getPageIndices()))\n    .forEach((page) => pdfDoc.addPage(page));\n\n  return\
  \ pdfDoc;\n\n}, PDFDocument.create());\n```\n\n我注意到，当需要打印很多页面时，它会消耗过多内存并拖慢整体进程。\n\
  \n一个简单的改动让 `printPDF` 调用等待前一个完成：\n\n```javascript\nconst result = await printingPages.reduce(async\
  \ (memo, page) => {\n  const pdfDoc = await memo;\n\n  const pdf = await PDFDocument.load(await\
  \ printPDF(page));\n\n  (await pdfDoc.copyPages(pdf, pdf.getPageIndices()))\n  \
  \  .forEach((page) => pdfDoc.addPage(page));\n\n  return pdfDoc;\n\n}, PDFDocument.create());\n\
  ```\n\n## 异步函数与 map\n\n`map` 是最简单、最常用的集合函数。它通过迭代函数处理每个元素，并返回一个包含结果的数组。\n\n同步版本为每个元素加一：\n\
  \n```javascript\nconst arr = [1, 2, 3];\n\nconst syncRes = arr.map((i) => {\n  return\
  \ i + 1;\n});\n\nconsole.log(syncRes);\n// 2,3,4\n```\n\n异步版本需要做两件事。首先，它需要将**每个元素映射为一个包含新值的\
  \ *Promise***，这就是在函数前加上 `async` 所做的事情。\n\n其次，它需要**等待所有 Promise**，然后**将结果收集到一个数组**中。幸运的是，内置的\
  \ `Promise.all` 正是第二步所需要的。\n\n这使得异步 `map` 的通用模式为 `Promise.all(arr.map(async (...)\
  \ => ...))`。\n\n与同步版本功能相同的异步实现：\n\n```javascript\nconst arr = [1, 2, 3];\n\nconst\
  \ asyncRes = await Promise.all(arr.map(async (i) => {\n  await sleep(10);\n  return\
  \ i + 1;\n}));\n\nconsole.log(asyncRes);\n// 2,3,4\n```\n\n![](img/4882ecc2dd5773605f888af8d04d80ecb36a75c646ef743a8e2f5effef00a0a0.png)\n\
  \n异步 map\n\n### 并发\n\n上述实现会并行地对数组中的每个元素运行迭代函数。这通常没问题，但在某些情况下可能会消耗过多资源。例如，当异步函数调用\
  \ API 或消耗过多 RAM 时，同时运行太多可能不可行。\n\n虽然编写异步 `map` 很容易，但添加并发控制则更复杂。在接下来的几个例子中，我们将探讨不同的解决方案。\n\
  \n#### 批量处理\n\n最简单的方法是将元素分组，然后逐个处理这些组。这样你可以控制同时运行的最大并行任务数。但由于一组必须在前一组完成后才能开始，每组中*最慢*的元素会成为限制因素。\n\
  \n![](img/e1c1bb2cf8fe927cceb829b06b7bcf4d193ae1459d48dc895ae7f708be81dd0c.png)\n\
  \n分组映射\n\n为了创建分组，下面的例子使用了 [Underscore.js](https://underscorejs.org/#groupBy) 中的\
  \ `groupBy` 实现。许多库都提供了该实现，并且大多可以互换。Lodash 是个例外，因为它的 [groupBy 不传递元素的索引](https://lodash.com/docs/#groupBy)。\n\
  \n如果你不熟悉 `groupBy`，它会通过迭代函数处理每个元素，并返回一个对象，其中键是结果，值是由产生该结果的元素组成的列表。\n\n要创建最多包含 `n`\
  \ 个元素的分组，可以使用迭代函数 `Math.floor(i / n)`，其中 `i` 是元素的*索引*。例如，大小为 3 的分组会将元素映射如下：\n\n\
  ```\n0 => 0\n1 => 0\n2 => 0\n3 => 1\n4 => 1\n5 => 1\n6 => 2\n...\n```\n\n在 JavaScript\
  \ 中：\n\n```javascript\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconsole.log(\n\
  \  _.groupBy(arr, (_v, i) => Math.floor(i / 3))\n);\n// {\n//     0: [30, 10, 20],\n\
  //     1: [20, 15, 20],\n//     2: [10]\n// }\n```\n\n最后一组可能比其他组小，但所有组都保证不超过最大分组大小。\n\
  \n要映射一个组，通常使用 `Promise.all(group.map(...))` 结构即可。\n\n要顺序映射这些组，我们需要一个 reduce 来将前一个结果（`memo`）与当前组的结果拼接起来：\n\
  \n```javascript\nreturn Object.values(groups)\n  .reduce(async (memo, group) =>\
  \ [\n    ...(await memo),\n    ...(await Promise.all(group.map(iteratee)))\n  ],\
  \ []);\n```\n\n这个实现基于以下事实：`await memo` 会等待前一个结果完成，然后才继续执行下一行。\n\n实现批处理的完整代码：\n\n\
  ```javascript\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconst mapInGroups =\
  \ (arr, iteratee, groupSize) => {\n  const groups = _.groupBy(arr, (_v, i) =>\n\
  \    Math.floor(i / groupSize));\n\n  return Object.values(groups)\n    .reduce(async\
  \ (memo, group) => [\n      ...(await memo),\n      ...(await Promise.all(group.map(iteratee)))\n\
  \    ], []);\n};\n\nconst res = await mapInGroups(arr, async (v) => {\n  console.log(`开始\
  \ ${v}`);\n  await sleep(v);\n  console.log(`完成 ${v}`);\n  return v + 1;\n}, 3);\n\
  \n// -- 第一批 --\n// 开始 30\n// 开始 10\n// 开始 20\n// 完成 10\n// 完成 20\n// 完成 30\n// --\
  \ 第二批 --\n// 开始 20\n// 开始 15\n// 开始 20\n// 完成 15\n// 完成 20\n// 完成 20\n// -- 第三批\
  \ --\n// 开始 10\n// 完成 10\n\nconsole.log(res);\n// 31,11,21,21,16,21,11\n```\n\n\
  #### 并行处理\n\n另一种并发控制是同时运行最多 `n` 个任务，并在一个任务完成后立即启动新任务。\n\n![](img/902c1166225283a3fdcb8dc17bac41ee0ca65689964e8747ea3f7485578e1209.png)\n\
  \n受控并发\n\n我无法为此想出一个简单的实现，但幸运的是，Bluebird 库[直接提供了这个功能](http://bluebirdjs.com/docs/api/promise.map.html#map-option-concurrency)。这使得它非常简单：只需导入库并使用支持\
  \ `concurrency` 选项的 `Promise.map` 函数即可。\n\n\n\n\n\n在下面的示例中，`concurrency` 被限制为 `2`，这意味着会立即启动\
  \ 2 个任务，然后每当一个任务完成时，就会启动一个新任务，直到所有任务都完成：\n\n```\nconst arr = [30, 10, 20, 20, 15,\
  \ 20, 10];\n\n// Bluebird promise\nconst res = await Promise.map(arr, async (v)\
  \ => {\n  console.log(`S ${v}`)\n  await sleep(v);\n  console.log(`F ${v}`);\n \
  \ return v + 1;\n}, {concurrency: 2});\n\n// S 30\n// S 10\n// F 10\n// S 10\n//\
  \ F 30\n// S 20\n// F 10\n// S 15\n// F 20\n// S 20\n// F 15\n// S 20\n// F 20\n\
  // F 20\n\nconsole.log(res);\n// 31,11,21,21,16,21,11\n```\n\n#### 顺序处理\n\n有时任何并发都太多了，元素应该一个接一个地处理。\n\
  \n![](img/26e09fdca23842d354c8c0658109bdfdf041ea7696549b1aa4d4636fb2998b27.png)\n\
  \n顺序映射\n\n一个简单的实现是使用 Bluebird 的 `Promise` 并将 `concurrency` 设为 1。但对于这种情况，不需要引入一个库，因为简单的\
  \ `reduce` 就能完成工作：\n\n```\nconst arr = [1, 2, 3];\n\nconst res = await arr.reduce(async\
  \ (memo, v) => {\n  const results = await memo;\n  console.log(`S ${v}`)\n  await\
  \ sleep(10);\n  console.log(`F ${v}`);\n  return [...results, v + 1];\n}, []);\n\
  \n// S 1\n// F 1\n// S 2\n// F 2\n// S 3\n// F 3\n\nconsole.log(res);\n// 2,3,4\n\
  ```\n\n确保在 `await` 其他任何东西之前先 `await` 累加器（memo），否则它仍然会并发运行！\n\n## 使用 `forEach` 的异步函数\n\
  \n`forEach` 函数与 `map` 类似，但它不是转换值并使用结果，而是对每个元素运行函数并丢弃结果。实际上，重要的是调用函数的*副作用*。\n\n例如，同步地将每个元素打印到控制台：\n\
  \n```\nconst arr = [1, 2, 3];\n\narr.forEach((i) => {\n  console.log(i);\n});\n\n\
  // 1\n// 2\n// 3\n\nconsole.log(\"Finished sync\");\n// Finished sync\n```\n\n由于结果不重要，使用异步函数作为迭代器也可以工作：\n\
  \n```\nconst arr = [1, 2, 3];\n\narr.forEach(async (i) => {\n  // each element takes\
  \ a different amount of time to complete\n  await sleep(10 - i);\n  console.log(i);\n\
  });\n\nconsole.log(\"Finished async\");\n// Finished async\n\n// 3\n// 2\n// 1\n\
  ```\n\n![](img/44bde7cbd8fdafdc2c2494ae8f049fe77ae0bf57dd112b78b0ac05dec2e53192.png)\n\
  \n异步 forEach\n\n### 控制时序\n\n#### 等待完成\n\n但毫不意外的是，该函数是**异步**调用的，程序执行会跳过该调用。这与同步版本的一个重要区别是，当执行下一行时，同步的\
  \ `forEach` 已经完成，而异步版本则没有。这就是为什么 \"Finished async\" 日志出现在元素*之前*。\n\n要在继续之前等待所有函数调用完成，请使用带有\
  \ `Promise.all` 的 `map` 并丢弃结果：\n\n```\nconst arr = [1, 2, 3];\n\nawait Promise.all(arr.map(async\
  \ (i) => {\n  await sleep(10 - i);\n  console.log(i);\n}));\n\n// 3\n// 2\n// 1\n\
  \nconsole.log(\"Finished async\");\n// Finished async\n```\n\n![](img/4578a72f73ebe729751dc8a2e7982f5f5788c083d678588f96ebf1ca1642dd40.png)\n\
  \n异步 forEach，等待结果\n\n通过此更改，\"Finished async\" 出现在最后。\n\n#### 顺序处理\n\n但请注意，迭代器函数是并行调用的。为了忠实地遵循同步的\
  \ `forEach`，请使用带有 `await memo` 的 `reduce`：\n\n```\nconst arr = [1, 2, 3];\n\nawait\
  \ arr.reduce(async (memo, i) => {\n  await memo;\n  await sleep(10 - i);\n  console.log(i);\n\
  }, undefined);\n\n// 1\n// 2\n// 3\n\nconsole.log(\"Finished async\");\n// Finished\
  \ async\n```\n\n![](img/66b6c76bc716c0b5c0aa317848a0a8ee3bd423d67071bb936461d21f0a1e35ea.png)\n\
  \n异步 forEach，顺序处理\n\n这样，元素按顺序一个接一个地处理，程序执行会等待整个数组完成后再继续。\n\n## 使用 `filter` 的异步函数\n\
  \n`filter` 函数只保留满足条件的元素。它接收一个函数，这次称为*谓词*，该函数返回 true/false（更准确地说，是真值和假值）值。结果集合只包含谓词返回\
  \ true 的元素。\n\n```\nconst arr = [1, 2, 3, 4, 5];\n\nconst syncRes = arr.filter((i)\
  \ => {\n  return i % 2 === 0;\n});\n\nconsole.log(syncRes);\n// 2,4\n```\n\n###\
  \ 使用 `map` 的异步 filter\n\n这次异步版本稍微复杂一些，它分两个阶段工作。第一阶段通过谓词函数异步映射数组，生成 true/false 值。然后第二步是同步的\
  \ `filter`，它使用第一步的结果。\n\n![](img/ea88e1aac9cb48ef0755b091aa42472171622d59e3968cfa8bf14292042a7823.png)\n\
  \n异步 filter\n\n```\nconst arr = [1, 2, 3, 4, 5];\n\nconst asyncFilter = async (arr,\
  \ predicate) => {\n  const results = await Promise.all(arr.map(predicate));\n\n\
  \  return arr.filter((_v, index) => results[index]);\n}\n\nconst asyncRes = await\
  \ asyncFilter(arr, async (i) => {\n  await sleep(10);\n  return i % 2 === 0;\n});\n\
  \nconsole.log(asyncRes);\n// 2,4\n```\n\n或者一行实现：\n\n```\nconst asyncFilter = async\
  \ (arr, predicate) =>\n  Promise.all(arr.map(predicate))\n  .then((results) => arr.filter((_v,\
  \ index) => results[index]));\n```\n\n![](img/98752878cc289cb4a5f69120e50b00611fc444ce3124c0ed4c27ec622201b4b6.png)\n\
  \n使用 map 的异步 filter\n\n#### 并发\n\n上述实现并发运行所有谓词函数。这通常没问题，但与其他所有函数一样，它可能会过度消耗某些资源。幸运的是，由于上述实现依赖于\
  \ `map`，可以使用相同的并发控制。\n\n### 使用 `reduce` 的异步 filter\n\n除了使用异步 `map` 加同步 `filter`，也可以使用异步\
  \ `reduce` 来完成工作。由于只有一个函数，结构更简单，尽管它不提供相同级别的控制。\n\n首先，从一个空数组（`[]`）开始。然后通过谓词函数运行下一个元素，如果通过，则将其追加到数组中。如果不通过，则跳过它。\n\
  \n![](img/e378a1cbb53cf39e1f6f2e25de2cb568d2882c6080e3eb041f6caf103f70efa1.png)\n\
  \n使用 reduce 的异步 filter\n\n```\n// concurrently\nconst asyncFilter = async (arr,\
  \ predicate) => \n  arr.reduce(async (memo, e) =>\n    await predicate(e) ? [...await\
  \ memo, e] : memo\n  , []);\n```\n\n![](img/be648b1a6427cd57ea903ec9ddadf2fdd75c4b9f486bfb2a19bd42220a411f16.png)\n\
  \n使用 reduce 的异步 filter\n\n注意，`await predicate(e)` 出现在 `await memo` *之前*，这意味着它们将并行调用。\n\
  \n#### 顺序处理\n\n要等待一个谓词函数完成后再调用下一个，请更改 `await` 的顺序：\n\n```\n// sequentially\nconst\
  \ asyncFilter = async (arr, predicate) => \n  arr.reduce(async (memo, e) => \n \
  \   [...await memo, ...await predicate(e) ? [e] : []]\n  , []);\n```\n\n此实现等待前一个元素，然后根据谓词的结果有条件地追加一个元素（`...[e]`\
  \ 或 `...[]`）。\n\n![](img/9c63ff63c95c8f8ddc4bed111d964e35cf518c153bb4db4302fbd0a18f84a5e0.png)\n\
  \n顺序运行的 reduce 异步 filter\n\n## 使用 `some`/`every` 的异步函数\n\n这些函数接收一个迭代器函数，就像 `filter`\
  \ 一样，但它们返回单个 true/false，取决于谓词是否返回特定值。对于 `some`，如果*任何*谓词返回 true，结果将为 true。对于 `every`\
  \ 函数，如果任何返回 false，结果将为 false。\n\n```\nconst arr = [1, 2, 3];\n\nconst someRes =\
  \ arr.some((i) => {\n  return i % 2 === 0;\n});\n\nconsole.log(someRes);\n// true\n\
  \nconst everyRes = arr.every((i) => {\n  return i < 2;\n});\n\nconsole.log(everyRes);\n\
  // false\n```\n\n### 使用异步 `filter`\n\n仅考虑结果，这些函数可以用异步 `filter` 来模拟，而如何转换为异步已在之前的文章中介绍过。\n\
  \n\n\n\n\n```\n// sync\nconst some = (arr, predicate) =>\n  arr.filter(predicate).length\
  \ > 0;\nconst every = (arr, predicate) =>\n  arr.filter(predicate).length === arr.length;\n\
  \n// async\nconst asyncSome = async (arr, predicate) =>\n  (await asyncFilter(arr,\
  \ predicate)).length > 0;\nconst asyncEvery = async (arr, predicate) =>\n  (await\
  \ asyncFilter(arr, predicate)).length === arr.length;\n```\n\n![](img/7aab5ebf6fa625fce3d789c911166ad71474735e1dc2451535b590f24a1e8c8e.png)\n\
  \n基于过滤器的异步 `some`\n\n#### 短路\n\n但内置的 `some`/`every` 函数与基于 `filter` 的实现之间存在一个重要区别。当某个元素对\
  \ `some` 返回 true 时，它会**短路**，不再处理剩余元素：\n\n```\nconst arr = [1, 2, 3];\n\nconst res\
  \ = arr.some((i) => {\n  console.log(`检查 ${i}`);\n  return i % 2 === 0;\n});\n\n\
  // 检查 1\n// 检查 2\n\nconsole.log(res);\n// true\n```\n\n![](img/e7aefe8f1796e5a90d2c85d3ddd34a7d2117cda3fae26b9a0a5ac618974c984e.png)\n\
  \n同步 `some`\n\n类似地，`every` 在遇到第一个 false 结果后停止：\n\n```\nconst arr = [1, 2, 3];\n\n\
  const res = arr.every((i) => {\n  console.log(`检查 ${i}`);\n  return i < 2;\n});\n\
  \n// 检查 1\n// 检查 2\n\nconsole.log(res);\n// false\n```\n\n让我们看看如何编写一个以类似方式工作且工作量最小的异步版本！\n\
  \n### 异步 `some`\n\n最佳解决方案是使用异步 **for 迭代**，一旦找到真值结果就立即返回：\n\n```\nconst arr = [1,\
  \ 2, 3];\n\nconst asyncSome = async (arr, predicate) => {\n  for (let e of arr)\
  \ {\n    if (await predicate(e)) return true;\n  }\n  return false;\n};\nconst res\
  \ = await asyncSome(arr, async (i) => {\n  console.log(`检查 ${i}`);\n  await sleep(10);\n\
  \  return i % 2 === 0;\n});\n\n// 检查 1\n// 检查 2\n\nconsole.log(res);\n// true\n\
  ```\n\n![](img/29298028c2b0b61baa14673755d0e4cd641b66a550d0be0004a9bb9e23ceee1b.png)\n\
  \n基于 for 循环的异步 `some`\n\n对于第一个元素，如果 `predicate(e)` 返回 true，则结束 for 循环。\n\n### 异步\
  \ `every`\n\n类似的结构也适用于 `every`，只需对条件取反即可：\n\n```\nconst arr = [1, 2, 3];\n\nconst\
  \ asyncEvery = async (arr, predicate) => {\n  for (let e of arr) {\n    if (!await\
  \ predicate(e)) return false;\n  }\n  return true;\n};\nconst res = await asyncEvery(arr,\
  \ async (i) => {\n  console.log(`检查 ${i}`);\n  await sleep(10);\n  return i < 2;\n\
  });\n\n// 检查 1\n// 检查 2\n\nconsole.log(res);\n// false\n```\n\n每当 `predicate(e)`\
  \ 返回 false 时，函数就会结束，不再检查其他元素。\n\n### 并行处理\n\n短路实现会顺序处理元素，这在资源使用方面是高效的，但可能导致执行时间更长。\n\
  \n例如，如果迭代器通过网络发送请求，逐个发送可能需要一些时间。另一方面，虽然同时发送所有请求可能会导致更多请求被发送，但速度会更快。\n\n# 常见错误\n\n\
  ## 未传播错误\n\n当你将回调转换为 Promise 时，请确保也处理了错误情况。否则，Promise 永远不会被 resolve，`await` 会永远等待。\n\
  \n例如，`gapi.load` 为结果和错误提供了独立的回调：\n\n```\nawait new Promise((res, rej) => {\n  gapi.load(\"\
  client:auth2\", {callback: res, onerror: rej});\n});\n```\n\n如果你没有将 `rej` 回调附加到\
  \ `onerror` 处理程序，错误将不会在链中传播。这会导致难以调试的问题和“突然停止”的组件。\n\n## 在 `try..catch` 中缺少 `await`\n\
  \n当你在异步函数中使用 `try..catch` 或 `try..finally` 时，请确保也使用了 `await`。例如，当内部 Promise 成功 resolve\
  \ 时，以下代码可以正常工作：\n\n```\nconst fn = async () => {\n  return \"result\";\n}\n\nconst\
  \ outer = async () => {\n  try {\n    return fn(); // <= 缺少 await!\n  }catch(e)\
  \ {\n    console.log(e.message);\n  }\n}\n\nawait outer(); // result\n```\n\n但 `try..catch`\
  \ 无法处理异常：\n\n```\nconst fn = async () => {\n  throw new Error(\"error\");\n}\n\n\
  const outer = async () => {\n  try {\n    return fn(); // <= 缺少 await!\n  }catch(e)\
  \ {\n    console.log(e.message);\n  }\n}\n\nawait outer();\n// 抛出异常！\n```\n\n这是因为异常是从\
  \ `await` 抛出的，虽然从异步函数返回 Promise 会扁平化结果，但返回时不会等待它。如果不等待，异常就不会被 `try..catch` 捕获，而是在调用者使用\
  \ `await` 时抛出。\n\n```\nconst fn = async () => {\n  throw new Error(\"error\");\n\
  }\n\nconst outer = async () => {\n  try {\n    return await fn();\n  }catch(e) {\n\
  \    console.log(e.message); // error\n  }\n}\n\nawait outer();\n// 此处无异常\n```\n\
  \n## 未检查返回值\n\n当 Promise 被 resolve 时，并不一定意味着一切正常。例如，`fetch` 在*连接*出现问题时拒绝，但即使响应状态返回错误，它也会\
  \ resolve。\n\n当调用无法建立连接时，Promise 拒绝：\n\n```\ntry {\n  await fetch(\"htp://example.com\"\
  );\n}catch(e) {\n  console.log(e.message); // Failed to fetch\n}\n```\n\n但当响应状态码指示错误（500）时，Promise\
  \ 仍然 resolve：\n\n```\ntry {\n  await fetch(\"https://httpbin.org/status/500\");\n\
  \n  // 无错误\n}catch(e) {\n  console.log(e.message);\n}\n```\n\n因此，你需要检查结果中的错误响应。`fetch`\
  \ 结果提供了 `ok` 字段来实现这一点：\n\n```\nconst response = await fetch(\"https://httpbin.org/status/500\"\
  );\n\nif (!response.ok) {\n  throw new Error(\"错误响应\");\n}\n```\n\n## 拒绝时未关闭资源\n\
  \n通常我们会打开某个资源，然后在不需要时关闭它。例如，以下代码创建了一个临时目录，然后稍后删除它：\n\n```\nconst fs = require(\"\
  fs\").promises;\nconst os = require(\"os\");\nconst path = require(\"path\");\n\n\
  const dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n);\n\
  \n// 使用 dir 存储临时内容\n\nawait fs.rmdir(dir, {recursive: true});\n```\n\n除非出现异常跳过清理代码，否则这可以正常工作。\n\
  \n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n\
  );\n\nthrow Error(\"error\");\n\nawait fs.rmdir(dir, {recursive: true});\n// 清理代码不会执行！\n\
  ```\n\n使用 `try..finally` 实现可靠的清理：\n\n```\nconst dir = await fs.mkdtemp(\n  await\
  \ fs.realpath(os.tmpdir()) + path.sep\n);\ntry {\n  // 使用 dir 存储临时内容\n}finally {\n\
  \  await fs.rmdir(dir, {recursive: true});\n}\n```\n\n更好的做法是将资源生命周期移到专用函数中，如异步释放器模式章节所述：\n\
  \n```\nconst withTempDir = async (fn) => {\n  const dir = await fs.mkdtemp(\n  \
  \  await fs.realpath(os.tmpdir()) + path.sep\n  );\n  try {\n    return await fn(dir);\n\
  \  }finally {\n    fs.rmdir(dir, {recursive: true});\n  }\n};\n\nawait withTempDir((dir)\
  \ => {\n  // 使用 dir 存储临时内容\n})\n```\n\n## 在同一个 `then` 函数中同时使用拒绝和 resolve 处理程序\n\n\
  一个常见的问题是编写如下错误处理代码：\n\n```\ngetPromise()\n  .then(process, handleError);\n```\n\n\
  正如我们在 Promise 链中的错误传播章节中讨论的，`then()` 的第二个处理程序仅处理来自前一步骤的错误。\n\n![](img/ef010590c468612b89d4abfa91bab02e9dfbc8ee00ff194c7c4047da0758ec61.png)\n\
  \nPromise 链示意图\n\n注意，`handleError` 函数仅捕获来自 `getPromise` 的错误。如果 `process` 函数的结果被拒绝，它将不会被处理。\n\
  \n更好的解决方案是使用 `.catch` 来明确处理错误：\n\n```\ngetPromise()\n  .then(process)\n  .catch(handleError);\n\
  ```\n\n这样，两个步骤都被错误处理程序覆盖，清晰明了。\n\n## 未等待异步 `forEach`\n\n\n\n\n\n`forEach` 函数遍历一个集合并调用迭代器函数。一个典型的问题是它不会等待迭代完成：\n\
  \n```\n[1, 2, 3].forEach(async (e) => {\n  console.log(e);\n  return makePromise(e);\n\
  });\nconsole.log(\"finished\");\n// finished\n// 1\n// 2\n// 3\n```\n\n最佳实践是等待整个集合处理完毕，这可以通过\
  \ `Promise.all` 和 `map` 实现：\n\n```\nawait Promise.all([1, 2, 3].map(async (e) =>\
  \ {\n  console.log(e);\n  return makePromsie(e);\n}));\nconsole.log(\"finished\"\
  );\n// 1\n// 2\n// 3\n// finished\n```\n\n更多信息\n\n本主题在 Async functions with forEach\
  \ 章节中有更详细的介绍。\n\n# 术语表\n\n**异步函数**\n\n返回一个 `Promise` 的函数。`await` 关键字只能在异步函数中使用。\n\
  \n```\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst\
  \ fn = async () => {\n  await wait(100);\n  return \"result\";\n}\n\nfn(); // Promise\n\
  ```\n\n**异步生成器函数**\n\n可以使用 `await` 的生成器函数。当遇到 `yield` 或 `yield*` 时，执行会暂停，直到请求下一个元素。\n\
  \n```\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst\
  \ gen = async function*() {\n  console.log(\"start\");\n  await wait(100);\n  yield\
  \ 1;\n  await wait(100);\n  console.log(\"next\");\n  yield 2;\n  await wait(100);\n\
  \  console.log(\"end\");\n};\n\nconst it = gen();\nconsole.log(await it.next());\n\
  console.log(await it.next());\nconsole.log(await it.next());\n\n// start\n// { value:\
  \ 1, done: false }\n// next\n// { value: 2, done: false }\n// end\n// { value: undefined,\
  \ done: true }\n```\n\n参见 生成器函数。\n\n**await 关键字**\n\n可在异步函数中使用，它会暂停执行，直到参数 `Promise`\
  \ 变为已兑现。然后返回该值或抛出异常。参见 异步函数。\n\n**回调**\n\n作为参数传递的函数，调用时传入返回值。它允许异步结果，因为回调可以在稍后被调用。\n\
  \n例如，`setTimeout` 函数需要一个回调，在时间到达时调用它：\n\n```\nsetTimeout(() => {\n  // 1 秒后\n},\
  \ 1000);\n```\n\n参见 延续传递风格。\n\n**集合处理**\n\n一系列对元素集合（通常是数组）进行操作的函数，例如转换（`map`）、过滤（`filter`）和归约为一个值（`reduce`）。\n\
  \n**延续传递风格**\n\n一种编程结构，使用回调函数（延续）来处理函数结果，而不是直接返回结果。这允许异步结果，因为这些回调可以在稍后被调用。\n\n```\n\
  // 直接风格\nconst directFn = () => {\n  return \"result\";\n};\n\n// CPS\nconst cpsFn\
  \ = (callback) => {\n  callback(\"result\");\n};\n```\n\n参见 回调。\n\n**错误传播**\n\n\
  当出现错误时，它会向上层上下文传递，直到有代码能够处理它。\n\n例如，未处理的异常会被抛给调用者：\n\n```\nconst fn = () => {\n\
  \  // 错误在此处抛出\n  throw new Error(\"error\");\n}\n\ntry {\n  fn();\n}catch(e) {\n\
  \  // 在此处处理\n}\n```\n\n对于 Promise，错误会传播到下一个处理程序：\n\n```\ngetUser() // 返回一个 Promise\n\
  \  .then(() => {\n    // 错误在此处抛出\n    throw new Error(\"error\");\n  })\n  .catch((e)\
  \ => {\n    // 在此处处理\n  });\n```\n\n**错误优先回调**\n\n一种回调风格，其中第一个参数是错误对象。接收方需要检查该值是否为非\
  \ null（或非 undefined）。\n\n```\nconst fn = (callback) => {\n  try {\n    const result\
  \ = \"result\";\n    // error 为 null\n    callback(null, result);\n  }catch(e) {\n\
  \    // 发出错误信号\n    callback(e);\n  }\n}\n\nfn((err, result) => {\n  if (err) {\n\
  \    // 处理错误\n  }else {\n    // 处理结果\n  }\n});\n```\n\n参见 Node 风格回调。\n\n**已兑现的 Promise**\n\
  \n`Promise` 的一种状态，表示已解决或已拒绝。参见 Promise 状态。\n\n**生成器函数**\n\n返回可迭代结构的函数。它可以通过 `yield`\
  \ 语句冻结，只有在请求更多元素时才会恢复。\n\n```\nconst gen = function*() {\n  console.log(\"start\"\
  );\n  yield 1;\n  console.log(\"next\");\n  yield 2;\n  console.log(\"end\");\n\
  }\n\nconst it = gen();\nconsole.log(it.next());\nconsole.log(it.next());\nconsole.log(it.next());\n\
  \n// start\n// { value: 1, done: false }\n// next\n// { value: 2, done: false }\n\
  // end\n// { value: undefined, done: true }\n```\n\n**Node 风格回调**\n\n一种回调风格，其中：\n\
  \n*   回调函数是最后一个参数\n\n*   调用时先传入错误对象，再传入结果（`(error, result)`）\n\n*   只返回一个结果\n\n\
  ```\nconst getUser = (id, cb) => {\n  const user = /* 获取用户 */;\n  if (user) {\n\
  \    // 成功\n    cb(null, user);\n  }else {\n    // 错误\n    cb(new Error(\"Failed\
  \ to get user\"));\n  }\n};\n```\n\n**分页**\n\n当某个方法（通常是 API）不返回请求的所有结果，需要多次调用才能获取所有项目时使用。\n\
  \n**待定的 Promise**\n\n`Promise` 的一种状态，表示异步结果尚不可用。参见 Promise 状态。\n\n`postMessage`\n\
  \n一种跨上下文通信的 API，例如与 IFrame 和 Web Worker 通信。它是一种基于事件的通信方式，一端监听 `message` 事件，另一端使用\
  \ `postMessage` 函数发送消息。\n\n`Promise`\n\n一个持有异步结果的值。你可以使用 `then` 回调来处理 `Promise`\
  \ 变为已兑现的情况，或者在异步函数中使用 `await`。\n\n**Promise 链**\n\n一系列 `then()` 回调，每个回调获取前一个 `Promise`\
  \ 的状态并返回下一个。\n\n```\ngetUser() // 返回一个 Promise\n  .then(async function getPermissionsForUser(user)\
  \ {\n    const permissions = await // ...;\n    return permissions;\n  })\n  .then(async\
  \ function checkPermission(permissions) {\n    const allowed = await // ...;\n \
  \   return allowed;\n  })\n  .then((allowed) => {\n    // 处理是否允许\n  });\n```\n\n\
  `Promise` 状态\n\n`Promise` 可以处于多种状态之一：\n\n*   待定：值尚不可用\n\n*   已解决：值可用\n\n*   已拒绝：出现错误\n\
  \n当 `Promise` 已解决或已拒绝时，它被称为已兑现或已敲定。\n\n![](img/c7bf165c038961ff3793fb930dc7f0f0e4deca1a722e24292ec3555a5c09e142.png)\n\
  \nPromise 状态\n\n`Promise.all`\n\n一个工具函数，接收多个 Promise，当所有 Promise 都解决时解决，并返回包含结果的数组。如果任何一个输入\
  \ Promise 拒绝，则拒绝。\n\n```\nconsole.log(\n  await Promise.all([\n    Promise.resolve(\"\
  a\"),\n    Promise.resolve(\"b\"),\n  ])\n);\n\n// [\"a\", \"b\"]\n```\n\n`Promise.allSettled`\n\
  \n一个工具函数，接收多个 Promise，当所有 Promise 都敲定时解决。即使某些输入 Promise 拒绝，它也会解决。\n\n```\nconsole.log(\n\
  \  await Promise.allSettled([\n    Promise.resolve(\"a\"),\n    Promise.reject(\"\
  b\"),\n  ])\n);\n\n// [\n//     { status: 'fulfilled', value: 'a' },\n//     { status:\
  \ 'rejected', reason: 'b' }\n// ]\n```\n\n`Promise.catch`\n\n一个工具函数，为 `Promise`\
  \ 附加一个拒绝处理程序。它等价于 `then(undefined, handler)`。\n\n```\nPromise.reject(new Error(\"\
  error\"))\n  .catch((e) => {\n    console.log(e.message); // error\n  });\n```\n\
  \n`Promise.finally`\n\n一个工具函数，在 `Promise` 敲定时调用，无论是解决还是拒绝。它将 `try..finally` 结构引入\
  \ Promise。\n\n```\ngetUser() // 返回一个 Promise\n  .finally(() => {\n  // 即使 Promise\
  \ 被拒绝也会调用\n    console.log(\"finished\");\n  });\n// 不会改变结果值\n```\n\n`Promise.race`\n\
  \n\n\n\n\n一个工具函数，用于获取多个 `Promise`，并在第一个 Promise 敲定时进行决议（或拒绝）。\n\n```\nconst wait\
  \ = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst fn = async (ms,\
  \ result) => {\n  await wait(ms);\n\n  return result;\n}\nconsole.log(\n  await\
  \ Promise.race([\n    fn(100, \"a\"),\n    fn(50, \"b\"),\n  ])\n);\n// b\n```\n\
  \n`Promise.reject`\n\n一个工具函数，用于以提供的值进行拒绝。\n\n```\nPromise.reject(new Error(\"error\"\
  ))\n  .catch((v) => {\n    console.log(v.message); // error\n  })\n```\n\n`Promise.resolve`\n\
  \n一个工具函数，返回一个以提供的值进行决议的 `Promise`。可用于启动一个 `Promise` 链。\n\n```\nPromise.resolve(\"\
  value\")\n  .then((v) => {\n    console.log(v); // value\n  })\n```\n\n`Promise.then`\n\
  \n`Promise` 对象的一个方法，用于附加一个在 `Promise` 敲定时被调用的函数。参见 Promise 链。\n\n`Promisification`\n\
  \n将回调转换为 `Promise` 的过程。\n\n`Rejected Promise`\n\n表示错误的 `Promise` 状态。参见 Promise 状态。\n\
  \n`Resolved Promise`\n\n异步值可用的 `Promise` 状态。参见 Promise 状态。\n\n`Settled Promise`\n\
  \n已完成状态的另一种名称。参见 Promise 状态。\n\n`Synchronous function`\n\n运行时返回值的函数。参见 延续传递风格。\n\
