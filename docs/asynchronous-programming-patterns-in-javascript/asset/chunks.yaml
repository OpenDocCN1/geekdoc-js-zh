    ```\nconst functions = await getAllLambdas();\n```\n\n## Making it generic\n\n\
    The same `Marker`/`NextMarker` pattern appears throughout the AWS SDK. But unfortunately,\
    \ the naming is different for different services. For example, getting the CloudWatch\
