  trans: "\n\n有趣的是，这是一个使用 `return await` 会产生差异的场景。通常情况下，异步函数返回一个 Promise 还是其解析值并不重要。但在这个例子中并非如此，因为\
    \ `try..catch` 需要等待 `fn()` 调用完成，才能处理它抛出的异常。\n\n请注意，此实现会对*任何错误*进行重试，即使是不可重试的错误（例如发送无效数据）也不例外。\n\
    \n### 基于进度的重试\n\n另一类可重试操作是**每次调用可能取得部分进展，但未必能完成**。\n\n一个很好的例子是 DynamoDB 的 `batchWriteItem`\
    \ 调用。你定义要存储的项，该调用会尝试保存所有项。然后，它会在响应中返回一个列表，指示哪些元素失败。重试操作只需包含这些失败的项，而不需要整个请求。\n\n\
    ![](img/eab2c064636a7004eb33ea8188c39e723476b67a79447737f4b9cbf93af9e9bd.png)\n\
    \n基于进度的重试\n\n作为示例，以下函数模拟了一个向远程服务器发送的进度调用。它返回一个从 0 到 1 的 `progress` 字段，并在调用完全完成时返回\
    \ `result`。它还需要知道*当前进度*，这是调用的一个参数：\n\n```\nconst progressingOperation = async\
    \ (startProgress = 0) => {\n  await wait(10);\n  const progress = Math.round(\n\
    \    Math.min(startProgress + Math.random() / 3, 1) * 10\n  ) / 10;\n  return\
    \ {\n    progress,\n    result: progress === 1 ? \"result\" : undefined,\n  };\n\
    }\n```\n\n在这种情况下，未完成时仍然会解析 Promise，这模拟了 DynamoDB API 的行为。但其他 API 可能会拒绝它。幸运的是，将拒绝的\
    \ Promise 转换为已解析的 Promise 很容易：`.catch()`。\n\n在 DynamoDB `batchWriteItem` 示例中，`progress`\
    \ 返回字段是未处理项的列表，而 `startProgress` 参数是要保存的项。\n\n要重试上述调用直到完成，可以使用：\n\n```\nconst\
    \ callWithProgress = async (fn, status, depth = 0) => {\n  const result = await\
    \ fn(status);\n\n  // 检查是否完成\n  if (result.progress === 1) {\n    // 已完成\n   \
    \ return result.result;\n  }else {\n    // 未完成\n    if (depth > 7) {\n      throw\
    \ result;\n    }\n    await wait(2 ** depth * 10);\n\n    return callWithProgress(fn,\
    \ result.progress, depth + 1);\n  }\n}\n```\n\n要使用这个重试调用，可以这样：\n\n```\nconst result\
    \ = await callWithProgress(progressingOperation);\n```\n\n请注意，此实现并非通用，因为它依赖于调用返回进度信息的方式。\n\
    \n# 使用异步生成器进行分页\n\n许多 API 限制单次调用返回的结果数量。例如，AWS SDK 中返回列表的函数都是分页操作。这意味着你一次调用只能获得有限数量的元素，同时会得到一个用于获取下一批数据的令牌。如果你没有意识到这一点，可能会在开发时获取所有元素，但函数将来可能会出现问题。\n\
    \n然而，获取第一批数据只需 `await lambda.listFunctions().promise()`，但要分页直到检索完所有页面，则需要更多工作。\n\
    \n让我们看看如何创建一个可 `await` 的结构，可靠地从 AWS API 获取所有元素！\n\n## 分页\n\n以 Lambda 函数为例，如果你的\
    \ Lambda 函数数量不多（最多 50 个），`lambda.listFunctions` [调用](https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/Lambda.html#listFunctions-property)\
    \ 会返回一个包含所有 Lambda 函数列表的结构：\n\n```\nconst functions = await lambda.listFunctions().promise();\n\
    ```\n\n```\n{\n  Functions: [...]\n}\n```\n\n要模拟分页情况，可以设置 `MaxItems` 参数：\n\n```\n\
    const functions = await lambda.listFunctions({\n  MaxItems: 1\n}).promise();\n\
    ```\n\n这次还会返回一个 `NextMarker`，表示还有更多项：\n\n```\n{\n  Functions: [...],\n  NextMarker:\
    \ ...\n}\n```\n\n要获取下一批数据，需要提供上一个标记：\n\n```\nconst functions = await lambda.listFunctions({\n\
    \  MaxItems: 1,\n  Marker: functions.NextMarker,\n}).promise();\n```\n\n然后重复此过程，直到不再返回\
    \ `NextMarker`。\n\n## 使用异步生成器的解决方案\n\n异步生成器是 JavaScript 中相对较新的特性。它们类似于传统的生成器函数，但它们是异步的，这意味着你可以在其中使用\
    \ `await`。\n\n要收集所有 Lambda 函数，无论需要多少次调用，可以使用：\n\n```\nconst getAllLambdas = async\
    \ () => {\n  const EMPTY = Symbol(\"empty\");\n\n  const res = [];\n  for await\
    \ (const lf of (async function*() {\n    let NextMarker = EMPTY;\n    while (NextMarker\
    \ || NextMarker === EMPTY) {\n      const functions = await lambda.listFunctions({\n\
    \        Marker: NextMarker !== EMPTY ? NextMarker : undefined,\n      }).promise();\n\
    \      yield* functions.Functions;\n      NextMarker = functions.NextMarker;\n\
    \    }\n  })()) {\n    res.push(lf);\n  }\n\n  return res;\n}\n\n// 使用它\nconst\
    \ functions = await getAllLambdas();\n```\n\n异步生成器函数\n\n一个可以使用 `await` 的生成器函数。当遇到\
    \ `yield` 或 `yield*` 时，执行会暂停，直到请求下一个元素。\n\n```\nconst wait = (ms) =>\n  new Promise((res)\
    \ => setTimeout(res, ms));\n\nconst gen = async function*() {\n  console.log(\"\
    start\");\n  await wait(100);\n  yield 1;\n  await wait(100);\n  console.log(\"\
    next\");\n  yield 2;\n  await wait(100);\n  console.log(\"end\");\n};\n\nconst\
    \ it = gen();\nconsole.log(await it.next());\nconsole.log(await it.next());\n\
    console.log(await it.next());\n\n// start\n// { value: 1, done: false }\n// next\n\
    // { value: 2, done: false }\n// end\n// { value: undefined, done: true }\n```\n\
    \n### 分解说明\n\n最重要的是跟踪上一次调用返回的 `NextMarker`，并用它来进行下一次调用。对于第一次调用，`Marker` 应为 `undefined`，为了区分第一次和最后一次（不返回\
    \ `NextMarker` 的那次），使用 Symbol 是一个安全的选择，因为它不会被 API 返回。\n\n```\nconst EMPTY = Symbol(\"\
    empty\");\nlet NextMarker = EMPTY;\nwhile (NextMarker || NextMarker === EMPTY)\
    \ {\n  // Marker: NextMarker !== EMPTY ? NextMarker : undefined\n\n  NextMarker\
    \ = functions.NextMarker;\n}\n```\n\n调用之后，我们需要 `yield` 返回的函数：\n\n```\nyield* functions.Functions;\n\
    ```\n\n`yield*` 确保每个元素作为单独的值由生成器返回。\n\n最后，使用 `for await..of` 循环收集结果，并将它们作为数组返回：\n\
    \n```\nconst res = [];\nfor await (const lf of (async function*() {\n  ...\n})())\
    \ {\n  res.push(lf);\n}\nreturn res;\n```\n\n要使用它，只需调用该函数并等待返回的 Promise 解析：\n\n\
    ```\nconst functions = await getAllLambdas();\n```\n\n## 使其通用化\n\n相同的 `Marker`/`NextMarker`\
    \ 模式在 AWS SDK 中随处可见。但不幸的是，不同服务的命名不同。例如，获取 CloudWatch Logs 日志组时，你需要提供一个 `nextToken`\
    \ [参数](https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/CloudWatchLogs.html#describeLogGroups-property)。这使得无法用一个通用包装器支持所有列表函数。\n\
    \n幸运的是，由于模式相同，我们可以创建一个包装函数，处理除命名之外的所有内容：\n\n```\nconst getPaginatedResults = async\
    \ (fn) => {\n  const EMPTY = Symbol(\"empty\");\n  const res = [];\n  for await\
    \ (const lf of (async function*() {\n    let NextMarker = EMPTY;\n    while (NextMarker\
    \ || NextMarker === EMPTY) {\n      const {marker, results} = await fn(\n    \
    \    NextMarker !== EMPTY ? NextMarker : undefined\n      );\n\n      yield* results;\n\
    \      NextMarker = marker;\n    }\n  })()) {\n    res.push(lf);\n  }\n\n  return\
    \ res;\n};\n```\n\n它的结构与之前相同，但接受一个 `fn` 参数，该参数执行实际的 API 调用并返回列表和标记。\n\n要使用此包装器获取所有\
    \ Lambda 函数：\n\n"
- fmt: "\n```\nconst lambdas = await getPaginatedResults(async (NextMarker) => {\n\
    \  const functions = await lambda.listFunctions(\n    {Marker: NextMarker}\n \
    \ ).promise();\n  return {\n    marker: functions.NextMarker,\n    results: functions.Functions,\n\
    \  };\n});\n```\n\nAdapted to the log groups:\n\n```\nconst logGroups =\n  await\
    \ getPaginatedResults(async (NextMarker) => {\n    const logGroups = await logs.describeLogGroups(\n\
    \      {nextToken: NextMarker}\n    ).promise();\n    return {\n      marker:\
    \ logGroups.nextToken,\n      results: logGroups.logGroups,\n    };\n  });\n```\n\
    \n# Using async functions with postMessage\n\nThe `postMessage` call allows an\
    \ asynchronous communication channel between different browsing contexts, such\
    \ as with IFrames and web workers, where direct function calls don't work. It\
    \ works by sending a message to the other side, then the receiving end can listen\
    \ to `message` events.\n\nFor example, the page can communicate with an IFrame\
    \ via `postMessage` and send events to each others' windows. The `iframe.contentWindow.postMessage()`\
    \ call sends a message to the IFrame, while the `window.parent.postMessage()`\
    \ sends a message back to the main page. The two ends can listen to messages from\
    \ the other using `window.addEventListener(\"message\", (event) => {...})`.\n\n\
    ```\n// index.html\nconst iframe = document.querySelector(\"iframe\");\n\nwindow.addEventListener(\"\
    message\", ({data}) => {\n  // 3: receive response\n  console.log(\"Message from\
    \ iframe: \" + data);\n});\n\n// 1: send request\niframe.contentWindow.postMessage([5,\
    \ 2]);\n\n// iframe.html\nwindow.addEventListener(\"message\", ({data}) => {\n\
    \  // 2: send response\n  window.parent.postMessage(event.data[0] + event.data[1]);\n\
    });\n```\n\n![](b1786475a19dc022bf1f3004f04a3cdc36dd119d4b068f2b65998e8f866a5ba5.png)\n\
    \npage-IFrame communication\n\nFor web workers, each worker has a separate message\
    \ handler. The page can send a message to a specific worker using the `worker.postMessage()`\
    \ call and listen for events from that worker using `worker.addEventListener(\"\
    message\", (event) => {...})`. On the other side, the worker sends and receives\
    \ events using the global functions `postMessage()` and `addEventListener()`:\n\
    \n```\n// index.html\nconst worker = new Worker(\"worker.js\");\nworker.addEventListener(\"\
    message\", ({data}) => {\n  console.log(\"Message from worker: \" + data); //\
    \ 3\n});\n\nworker.postMessage([5, 5]); // 1\n\n// worker.js\naddEventListener(\"\
    message\", (event) => {\n  postMessage(event.data[0] + event.data[1]); // 2\n\
    }, false)\n```\n\n## Request-response communication\n\nBoth communicating with\
    \ an IFrame and with a worker has problems. First, sending the request and handling\
    \ the response is separated. **The receiving side uses a global (or a per-worker)\
    \ event listener**, which is shared between the calls.\n\nThis is good for \"\
    notification-style\" messages where one end wants to notify the other that something\
    \ happened but not expecting a response. But **notification-style messaging is\
    \ rare**. What is usually needed is a \"request-response-style\" messaging.\n\n\
    For example, one end uses an access token that the other one can refresh. The\
    \ communication consists of a request to refresh and a response to that with the\
    \ refreshed token. Or even when a user clicks on a button and the other side needs\
    \ to handle this. This example seems like a \"notification-style\" message, but\
    \ when the button needs to be disabled while the operation takes place (such as\
    \ a save button) or there is a possibility of an error that the sender needs to\
    \ know about, it's now a request-response.\n\nThe global (or per-worker) message\
    \ handler is not suited for pairing responses to requests. The ideal solution\
    \ would be to hide all these complications behind an async function call and use\
    \ `await` to wait for the result:\n\n```\nconst result = await add(10, 5);\n```\n\
    \nLet's see how to make such a function!\n\n### Response identification\n\nThe\
    \ first task is to know which request triggered a given response. The problem\
    \ with using the global event handler is that it's all too easy to rely on only\
    \ one communication happening at a time. When you test your webapp, you test one\
    \ thing at a time but users won't be that considerate. You can't assume only one\
    \ request-response will happen at any one time.\n\n![](fe5ec8337fbbff1aac2fec193f30a60c549566acdab873dd3eab8e52fe5153a8.png)\n\
    \nNon-multiplexed channel\n\nOne solution is to use *request identifiers* to pair\
    \ the responses to the requests.\n\n![](b5b51157b8c956a6b5cbe1c493ca6946506fc1deedecbf7ead2f4895ca1bacbd.png)\n\
    \nRequest ids\n\nThis works, and even though it requires some coding, this is\
    \ a good solution.\n\n#### MessageChannel\n\nFortunately, there is a better solution\
    \ built into the language. `MessageChannel` allows a dedicated communication channel\
    \ attached to the `postMessage` call. The sending end can listen for messages\
    \ *on that channel* which is separated from all other calls, and the receiving\
    \ end can send its responses through the `MessagePort` it got.\n\nA `MessageChannel`\
    \ creates two `MessagePort`s, one for each end of the communication. Each port\
    \ supports both the `onmessage` and the `postMessage`, similar to the basic cross-context\
    \ communication channels.\n\n```\n// index.html\nconst worker = new Worker(\"\
    worker.js\");\n// create a channel\nconst channel = new MessageChannel(); \n\n\
    // listen on one end\nchannel.port1.onmessage = ({data}) => {\n  console.log(\"\
    Message from channel: \" + data); // 3\n};\n\n// send the other end\nworker.postMessage([15,\
    \ 2], [channel.port2]); // 1\n\n// worker.js\naddEventListener(\"message\", (event)\
    \ => {\n  // respond on the received port\n  event.ports[0].postMessage(event.data[0]\
    \ + event.data[1]); // 2\n}, false)\n```\n\nTo attach a message handler to a port,\
    \ use `port.onmessage = (event) => {...}`. If you use `addEventListener` then\
    \ you need to start the channel too:\n\n```\nport.addEventListener(\"message\"\
    , (event) => {...});\nport.start();\n```\n\nTo attach a port to the `postMessage`\
    \ call, use the second argument: `postMessage(data, [channel.port2])`. To use\
    \ this port on the other end, use `event.ports[0].postMessage()`.\n\nBy creating\
    \ a new `MessageChannel` for each request, pairing the response is solved as whatever\
    \ comes through that channel is the response to this particular request.\n\n###\
    \ Error handling\n\nAn often overlooked aspect of request-response communication\
    \ is error handling. When the receiving end has a problem and throws an `Error`,\
    \ it should be propagated to the sender so that it can handle it appropriately.\n\
    \nThe problem with `postMessage` is that it can only send one type of message,\
    \ there is no `postError` call. How to signal an error then?\n\nA possible solution\
    \ is similar to how Node-style callbacks propagate errors using only a single\
    \ function. These callbacks use an error and a result value together, and only\
    \ one of them is defined:\n\n```\n(err, result) => {\n  if (err) {\n    // error\n\
    \  } else {\n    // result\n  }\n}\n```\n\nTo implement the same with messages,\
    \ use an object with `error` and `result` properties. When the former is non-null\
    \ that indicates that an error happened.\n\n```\n// worker.js\ntry{\n  event.ports[0].postMessage(\n\
    \    {result: event.data[0] + event.data[1]}\n  );\n}catch(e) {\n  event.ports[0].postMessage({error:\
    \ e});\n}\n\n// index.html\nchannel.port1.onmessage = ({data}) => {\n  if (data.error)\
    \ {\n    // error\n  }else {\n    // data.result\n  }\n};\n```\n\nDon't forget\
    \ to wrap the receiving end in a try-catch to propagate runtime errors.\n\n##\
    \ Using Promises\n\nWith a separated response channel and error propagation, it's\
    \ easy to wrap the call in a `Promise` constructor.\n\n```\nconst worker = new\
    \ Worker(\"worker.js\");\n\nconst add = (a, b) => new Promise((res, rej) => {\n\
    \  const channel = new MessageChannel(); \n\n  channel.port1.onmessage = ({data})\
    \ => {\n    channel.port1.close();\n    if (data.error) {\n      rej(data.error);\n\
    \    }else {\n      res(data.result);\n    }\n  };\n\n  worker.postMessage([a,\
    \ b], [channel.port2]);\n});\n\nconsole.log(await add(3, 5)); // 8\n```\n"
