  trans: "\n\n在下面的示例中，`concurrency` 被限制为 `2`，这意味着会立即启动 2 个任务，然后每当一个任务完成时，就会启动一个新任务，直到所有任务都完成：\n\
    \n```\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\n// Bluebird promise\nconst\
    \ res = await Promise.map(arr, async (v) => {\n  console.log(`S ${v}`)\n  await\
    \ sleep(v);\n  console.log(`F ${v}`);\n  return v + 1;\n}, {concurrency: 2});\n\
    \n// S 30\n// S 10\n// F 10\n// S 10\n// F 30\n// S 20\n// F 10\n// S 15\n// F\
    \ 20\n// S 20\n// F 15\n// S 20\n// F 20\n// F 20\n\nconsole.log(res);\n// 31,11,21,21,16,21,11\n\
    ```\n\n#### 顺序处理\n\n有时任何并发都太多了，元素应该一个接一个地处理。\n\n![](img/26e09fdca23842d354c8c0658109bdfdf041ea7696549b1aa4d4636fb2998b27.png)\n\
    \n顺序映射\n\n一个简单的实现是使用 Bluebird 的 `Promise` 并将 `concurrency` 设为 1。但对于这种情况，不需要引入一个库，因为简单的\
    \ `reduce` 就能完成工作：\n\n```\nconst arr = [1, 2, 3];\n\nconst res = await arr.reduce(async\
    \ (memo, v) => {\n  const results = await memo;\n  console.log(`S ${v}`)\n  await\
    \ sleep(10);\n  console.log(`F ${v}`);\n  return [...results, v + 1];\n}, []);\n\
    \n// S 1\n// F 1\n// S 2\n// F 2\n// S 3\n// F 3\n\nconsole.log(res);\n// 2,3,4\n\
    ```\n\n确保在 `await` 其他任何东西之前先 `await` 累加器（memo），否则它仍然会并发运行！\n\n## 使用 `forEach`\
    \ 的异步函数\n\n`forEach` 函数与 `map` 类似，但它不是转换值并使用结果，而是对每个元素运行函数并丢弃结果。实际上，重要的是调用函数的*副作用*。\n\
    \n例如，同步地将每个元素打印到控制台：\n\n```\nconst arr = [1, 2, 3];\n\narr.forEach((i) => {\n\
    \  console.log(i);\n});\n\n// 1\n// 2\n// 3\n\nconsole.log(\"Finished sync\");\n\
    // Finished sync\n```\n\n由于结果不重要，使用异步函数作为迭代器也可以工作：\n\n```\nconst arr = [1, 2,\
    \ 3];\n\narr.forEach(async (i) => {\n  // each element takes a different amount\
    \ of time to complete\n  await sleep(10 - i);\n  console.log(i);\n});\n\nconsole.log(\"\
    Finished async\");\n// Finished async\n\n// 3\n// 2\n// 1\n```\n\n![](img/44bde7cbd8fdafdc2c2494ae8f049fe77ae0bf57dd112b78b0ac05dec2e53192.png)\n\
    \n异步 forEach\n\n### 控制时序\n\n#### 等待完成\n\n但毫不意外的是，该函数是**异步**调用的，程序执行会跳过该调用。这与同步版本的一个重要区别是，当执行下一行时，同步的\
    \ `forEach` 已经完成，而异步版本则没有。这就是为什么 \"Finished async\" 日志出现在元素*之前*。\n\n要在继续之前等待所有函数调用完成，请使用带有\
    \ `Promise.all` 的 `map` 并丢弃结果：\n\n```\nconst arr = [1, 2, 3];\n\nawait Promise.all(arr.map(async\
    \ (i) => {\n  await sleep(10 - i);\n  console.log(i);\n}));\n\n// 3\n// 2\n//\
    \ 1\n\nconsole.log(\"Finished async\");\n// Finished async\n```\n\n![](img/4578a72f73ebe729751dc8a2e7982f5f5788c083d678588f96ebf1ca1642dd40.png)\n\
    \n异步 forEach，等待结果\n\n通过此更改，\"Finished async\" 出现在最后。\n\n#### 顺序处理\n\n但请注意，迭代器函数是并行调用的。为了忠实地遵循同步的\
    \ `forEach`，请使用带有 `await memo` 的 `reduce`：\n\n```\nconst arr = [1, 2, 3];\n\n\
    await arr.reduce(async (memo, i) => {\n  await memo;\n  await sleep(10 - i);\n\
    \  console.log(i);\n}, undefined);\n\n// 1\n// 2\n// 3\n\nconsole.log(\"Finished\
    \ async\");\n// Finished async\n```\n\n![](img/66b6c76bc716c0b5c0aa317848a0a8ee3bd423d67071bb936461d21f0a1e35ea.png)\n\
    \n异步 forEach，顺序处理\n\n这样，元素按顺序一个接一个地处理，程序执行会等待整个数组完成后再继续。\n\n## 使用 `filter` 的异步函数\n\
    \n`filter` 函数只保留满足条件的元素。它接收一个函数，这次称为*谓词*，该函数返回 true/false（更准确地说，是真值和假值）值。结果集合只包含谓词返回\
    \ true 的元素。\n\n```\nconst arr = [1, 2, 3, 4, 5];\n\nconst syncRes = arr.filter((i)\
    \ => {\n  return i % 2 === 0;\n});\n\nconsole.log(syncRes);\n// 2,4\n```\n\n###\
    \ 使用 `map` 的异步 filter\n\n这次异步版本稍微复杂一些，它分两个阶段工作。第一阶段通过谓词函数异步映射数组，生成 true/false\
    \ 值。然后第二步是同步的 `filter`，它使用第一步的结果。\n\n![](img/ea88e1aac9cb48ef0755b091aa42472171622d59e3968cfa8bf14292042a7823.png)\n\
    \n异步 filter\n\n```\nconst arr = [1, 2, 3, 4, 5];\n\nconst asyncFilter = async\
    \ (arr, predicate) => {\n  const results = await Promise.all(arr.map(predicate));\n\
    \n  return arr.filter((_v, index) => results[index]);\n}\n\nconst asyncRes = await\
    \ asyncFilter(arr, async (i) => {\n  await sleep(10);\n  return i % 2 === 0;\n\
    });\n\nconsole.log(asyncRes);\n// 2,4\n```\n\n或者一行实现：\n\n```\nconst asyncFilter\
    \ = async (arr, predicate) =>\n  Promise.all(arr.map(predicate))\n  .then((results)\
    \ => arr.filter((_v, index) => results[index]));\n```\n\n![](img/98752878cc289cb4a5f69120e50b00611fc444ce3124c0ed4c27ec622201b4b6.png)\n\
    \n使用 map 的异步 filter\n\n#### 并发\n\n上述实现并发运行所有谓词函数。这通常没问题，但与其他所有函数一样，它可能会过度消耗某些资源。幸运的是，由于上述实现依赖于\
    \ `map`，可以使用相同的并发控制。\n\n### 使用 `reduce` 的异步 filter\n\n除了使用异步 `map` 加同步 `filter`，也可以使用异步\
    \ `reduce` 来完成工作。由于只有一个函数，结构更简单，尽管它不提供相同级别的控制。\n\n首先，从一个空数组（`[]`）开始。然后通过谓词函数运行下一个元素，如果通过，则将其追加到数组中。如果不通过，则跳过它。\n\
    \n![](img/e378a1cbb53cf39e1f6f2e25de2cb568d2882c6080e3eb041f6caf103f70efa1.png)\n\
    \n使用 reduce 的异步 filter\n\n```\n// concurrently\nconst asyncFilter = async (arr,\
    \ predicate) => \n  arr.reduce(async (memo, e) =>\n    await predicate(e) ? [...await\
    \ memo, e] : memo\n  , []);\n```\n\n![](img/be648b1a6427cd57ea903ec9ddadf2fdd75c4b9f486bfb2a19bd42220a411f16.png)\n\
    \n使用 reduce 的异步 filter\n\n注意，`await predicate(e)` 出现在 `await memo` *之前*，这意味着它们将并行调用。\n\
    \n#### 顺序处理\n\n要等待一个谓词函数完成后再调用下一个，请更改 `await` 的顺序：\n\n```\n// sequentially\nconst\
    \ asyncFilter = async (arr, predicate) => \n  arr.reduce(async (memo, e) => \n\
    \    [...await memo, ...await predicate(e) ? [e] : []]\n  , []);\n```\n\n此实现等待前一个元素，然后根据谓词的结果有条件地追加一个元素（`...[e]`\
    \ 或 `...[]`）。\n\n![](img/9c63ff63c95c8f8ddc4bed111d964e35cf518c153bb4db4302fbd0a18f84a5e0.png)\n\
    \n顺序运行的 reduce 异步 filter\n\n## 使用 `some`/`every` 的异步函数\n\n这些函数接收一个迭代器函数，就像 `filter`\
    \ 一样，但它们返回单个 true/false，取决于谓词是否返回特定值。对于 `some`，如果*任何*谓词返回 true，结果将为 true。对于 `every`\
    \ 函数，如果任何返回 false，结果将为 false。\n\n```\nconst arr = [1, 2, 3];\n\nconst someRes\
    \ = arr.some((i) => {\n  return i % 2 === 0;\n});\n\nconsole.log(someRes);\n//\
    \ true\n\nconst everyRes = arr.every((i) => {\n  return i < 2;\n});\n\nconsole.log(everyRes);\n\
    // false\n```\n\n### 使用异步 `filter`\n\n仅考虑结果，这些函数可以用异步 `filter` 来模拟，而如何转换为异步已在之前的文章中介绍过。\n\
    \n"
- fmt: "\n```\n// sync\nconst some = (arr, predicate) =>\n  arr.filter(predicate).length\
    \ > 0;\nconst every = (arr, predicate) =>\n  arr.filter(predicate).length ===\
    \ arr.length;\n\n// async\nconst asyncSome = async (arr, predicate) =>\n  (await\
    \ asyncFilter(arr, predicate)).length > 0;\nconst asyncEvery = async (arr, predicate)\
    \ =>\n  (await asyncFilter(arr, predicate)).length === arr.length;\n```\n\n![](7aab5ebf6fa625fce3d789c911166ad71474735e1dc2451535b590f24a1e8c8e.png)\n\
    \nFilter-based Async `some`\n\n#### Short-circuiting\n\nBut there is an important\
    \ difference between the built-in `some`/`every` functions and the `filter`-based\
    \ implementations. When there is an element that returns true for a `some`, it\
    \ **short-circuits** and does not process the remaining elements:\n\n```\nconst\
    \ arr = [1, 2, 3];\n\nconst res = arr.some((i) => {\n  console.log(`Checking ${i}`);\n\
    \  return i % 2 === 0;\n});\n\n// Checking 1\n// Checking 2\n\nconsole.log(res);\n\
    // true\n```\n\n![](e7aefe8f1796e5a90d2c85d3ddd34a7d2117cda3fae26b9a0a5ac618974c984e.png)\n\
    \nSynchronous `some`\n\nSimilarly, `every` stops after the first false result:\n\
    \n```\nconst arr = [1, 2, 3];\n\nconst res = arr.every((i) => {\n  console.log(`Checking\
    \ ${i}`);\n  return i < 2;\n});\n\n// Checking 1\n// Checking 2\n\nconsole.log(res);\n\
    // false\n```\n\nLet's see how to code an async version that works in a similar\
    \ way and does the least amount of work!\n\n### Async `some`\n\nThe best solution\
    \ is to use an async **for iteration** that returns as soon as it finds a truthy\
    \ result:\n\n```\nconst arr = [1, 2, 3];\n\nconst asyncSome = async (arr, predicate)\
    \ => {\n  for (let e of arr) {\n    if (await predicate(e)) return true;\n  }\n\
    \  return false;\n};\nconst res = await asyncSome(arr, async (i) => {\n  console.log(`Checking\
    \ ${i}`);\n  await sleep(10);\n  return i % 2 === 0;\n});\n\n// Checking 1\n//\
    \ Checking 2\n\nconsole.log(res);\n// true\n```\n\n![](29298028c2b0b61baa14673755d0e4cd641b66a550d0be0004a9bb9e23ceee1b.png)\n\
    \nFor-based async `some`\n\nFor the first element `predicate(e)` returns true,\
    \ it concludes the for-loop.\n\n### Async `every`\n\nThe similar structure works\
    \ for `every`, it's just a matter of negating the conditions:\n\n```\nconst arr\
    \ = [1, 2, 3];\n\nconst asyncEvery = async (arr, predicate) => {\n  for (let e\
    \ of arr) {\n    if (!await predicate(e)) return false;\n  }\n  return true;\n\
    };\nconst res = await asyncEvery(arr, async (i) => {\n  console.log(`Checking\
    \ ${i}`);\n  await sleep(10);\n  return i < 2;\n});\n\n// Checking 1\n// Checking\
    \ 2\n\nconsole.log(res);\n// false\n```\n\nWhenever there is a false value returned\
    \ by `predicate(e)`, the function is ended without checking the other elements.\n\
    \n### Parallel processing\n\nThe short-circuiting implementation processes the\
    \ elements sequentially, which is efficient in terms of resource usage, but it\
    \ might result in longer execution.\n\nFor example, if the iteratee sends requests\
    \ via a network, it might take some time to send them one at a time. On the other\
    \ hand, while it might result in more requests sent, sending all of them at the\
    \ same time would be faster.\n\n# Common errors\n\n## Not propagating errors\n\
    \nWhen you convert a callback to a Promise, make sure that you also handle the\
    \ error case. Without that, the Promise is never resolved and an `await` waits\
    \ forever.\n\nFor example, the `gapi.load` provides separate callbacks for results\
    \ and errors:\n\n```\nawait new Promise((res, rej) => {\n  gapi.load(\"client:auth2\"\
    , {callback: res, onerror: rej});\n});\n```\n\nIf you don't attach the `rej` callback\
    \ to the `onerror` handler, errors won't propagate through the chain. This leads\
    \ to hard-to-debug problems and components that \"just stops\".\n\n## Missing\
    \ await in `try..catch`\n\nWhen you use `try..catch` or `try..finally` in an async\
    \ function, make sure that you use `await` too. For example, this code works fine\
    \ when the inner Promise resolves:\n\n```\nconst fn = async () => {\n  return\
    \ \"result\";\n}\n\nconst outer = async () => {\n  try {\n    return fn(); //\
    \ <= missing await!\n  }catch(e) {\n    console.log(e.message);\n  }\n}\n\nawait\
    \ outer(); // result\n```\n\nBut the `try..catch` won't handle exceptions:\n\n\
    ```\nconst fn = async () => {\n  throw new Error(\"error\");\n}\n\nconst outer\
    \ = async () => {\n  try {\n    return fn(); // <= missing await!\n  }catch(e)\
    \ {\n    console.log(e.message);\n  }\n}\n\nawait outer();\n// exception is thrown!\n\
    ```\n\nThis is because exceptions are thrown from the `await` and while returning\
    \ a Promise from an async function flattens the result, it will be returned without\
    \ waiting for it. And without waiting, an exception is not thrown for the `try..catch`\
    \ but when the caller uses `await`.\n\n```\nconst fn = async () => {\n  throw\
    \ new Error(\"error\");\n}\n\nconst outer = async () => {\n  try {\n    return\
    \ await fn();\n  }catch(e) {\n    console.log(e.message); // error\n  }\n}\n\n\
    await outer();\n// no exception here\n```\n\n## Not checking the return value\n\
    \nWhen a Promise is resolved it does not necessarily mean that everything is alright.\
    \ For example, the `fetch` rejects when there is a problem *with the connection*\
    \ but it resolves even if the response status returns an error.\n\nWhen the call\
    \ can not establish a connection, the Promise rejects:\n\n```\ntry {\n  await\
    \ fetch(\"htp://example.com\");\n}catch(e) {\n  console.log(e.message); // Failed\
    \ to fetch\n}\n```\n\nBut when the response status code indicates an error (500),\
    \ the Promise still resolves:\n\n```\ntry {\n  await fetch(\"https://httpbin.org/status/500\"\
    );\n\n  // no error\n}catch(e) {\n  console.log(e.message);\n}\n```\n\nBecause\
    \ of this, you need to check the result for error responses. The `fetch` result\
    \ provides the `ok` field to do this:\n\n```\nconst response = await fetch(\"\
    https://httpbin.org/status/500\");\n\nif (!response.ok) {\n  throw new Error(\"\
    Error response\");\n}\n```\n\n## Not closing resources in case of a rejection\n\
    \nIt's common to open some resource, then close it after it's not needed. For\
    \ example, this code creates a temporary directory then deletes it later:\n\n\
    ```\nconst fs = require(\"fs\").promises;\nconst os = require(\"os\");\nconst\
    \ path = require(\"path\");\n\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\n\n// use dir to store temporary things\n\nawait fs.rmdir(dir,\
    \ {recursive: true});\n```\n\nThis works unless there is an exception that jumps\
    \ over the cleanup code.\n\n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\n\nthrow Error(\"error\");\n\nawait fs.rmdir(dir, {recursive:\
    \ true});\n// the cleanup won't run!\n```\n\nUse `try..finally` to implement reliable\
    \ cleanup:\n\n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\ntry {\n  // use dir to store temporary things\n}finally {\n\
    \  await fs.rmdir(dir, {recursive: true});\n}\n```\n\nEven better, you can move\
    \ the resource lifecycle to a dedicated function, as discussed in the [The async\
    \ disposer pattern](#chapter8.xhtml_defined-async-disposer) chapter:\n\n```\n\
    const withTempDir = async (fn) => {\n  const dir = await fs.mkdtemp(\n    await\
    \ fs.realpath(os.tmpdir()) + path.sep\n  );\n  try {\n    return await fn(dir);\n\
    \  }finally {\n    fs.rmdir(dir, {recursive: true});\n  }\n};\n\nawait withTempDir((dir)\
    \ => {\n  // use dir to store temporary things\n})\n```\n\n## Using both the rejection\
    \ and resolve handlers in one `then` function\n\nA common source of problems is\
    \ to write error handling like this:\n\n```\ngetPromise()\n  .then(process, handleError);\n\
    ```\n\nAs we've discussed in the [Error propagation in Promise chains](#chapter2.xhtml_defined-error-propagation-in-promise-chains)\
    \ chapter, the second handler of the `then()` is called for errors but only from\
    \ the previous steps.\n\n![](ef010590c468612b89d4abfa91bab02e9dfbc8ee00ff194c7c4047da0758ec61.png)\n\
    \nDiagram of the promise chain\n\nNotice that the `handleError` function only\
    \ gets errors from the `getPromise`. If the result of the `process` function is\
    \ rejected, it won't be handled.\n\nA better solution is to use `.catch` to be\
    \ explicit about errors:\n\n```\ngetPromise()\n  .then(process)\n  .catch(handleError);\n\
    ```\n\nThis way it's clear that both steps are covered by the error handlers.\n\
    \n## Not waiting for an async `forEach`\n"
  raw: "```\n// sync\nconst some = (arr, predicate) =>\n  arr.filter(predicate).length\
    \ > 0;\nconst every = (arr, predicate) =>\n  arr.filter(predicate).length ===\
    \ arr.length;\n\n// async\nconst asyncSome = async (arr, predicate) =>\n  (await\
    \ asyncFilter(arr, predicate)).length > 0;\nconst asyncEvery = async (arr, predicate)\
    \ =>\n  (await asyncFilter(arr, predicate)).length === arr.length;\n```\n\n![](7aab5ebf6fa625fce3d789c911166ad71474735e1dc2451535b590f24a1e8c8e.png)\n\
    \nFilter-based async some\n\n#### Short-circuiting\n\nBut there is an important\
    \ difference between the built-in `some`/`every` functions and the `filter`-based\
    \ implementations. When there is an element that returns true for a `some`, it\
    \ **short-circuits** and does not process the remaining elements:\n\n```\nconst\
    \ arr = [1, 2, 3];\n\nconst res = arr.some((i) => {\n  console.log(`Checking ${i}`);\n\
    \  return i % 2 === 0;\n});\n\n// Checking 1\n// Checking 2\n\nconsole.log(res);\n\
    // true\n```\n\n![](e7aefe8f1796e5a90d2c85d3ddd34a7d2117cda3fae26b9a0a5ac618974c984e.png)\n\
    \nSynchronous some\n\nSimilarly, `every` stops after the first false result:\n\
    \n```\nconst arr = [1, 2, 3];\n\nconst res = arr.every((i) => {\n  console.log(`Checking\
    \ ${i}`);\n  return i < 2;\n});\n\n// Checking 1\n// Checking 2\n\nconsole.log(res);\n\
    // false\n```\n\nLet's see how to code an async version that works in a similar\
    \ way and does the least amount of work!\n\n### Async some\n\nThe best solution\
    \ is to use an async **for iteration** that returns as soon as it finds a truthy\
    \ result:\n\n```\nconst arr = [1, 2, 3];\n\nconst asyncSome = async (arr, predicate)\
    \ => {\n  for (let e of arr) {\n    if (await predicate(e)) return true;\n  }\n\
    \  return false;\n};\nconst res = await asyncSome(arr, async (i) => {\n  console.log(`Checking\
    \ ${i}`);\n  await sleep(10);\n  return i % 2 === 0;\n});\n\n// Checking 1\n//\
    \ Checking 2\n\nconsole.log(res);\n// true\n```\n\n![](29298028c2b0b61baa14673755d0e4cd641b66a550d0be0004a9bb9e23ceee1b.png)\n\
    \nFor-based async some\n\nFor the first element `predicate(e)` returns true, it\
    \ concludes the for-loop.\n\n### Async every\n\nThe similar structure works for\
    \ `every`, it's just a matter of negating the conditions:\n\n```\nconst arr =\
    \ [1, 2, 3];\n\nconst asyncEvery = async (arr, predicate) => {\n  for (let e of\
    \ arr) {\n    if (!await predicate(e)) return false;\n  }\n  return true;\n};\n\
    const res = await asyncEvery(arr, async (i) => {\n  console.log(`Checking ${i}`);\n\
    \  await sleep(10);\n  return i < 2;\n});\n\n// Checking 1\n// Checking 2\n\n\
    console.log(res);\n// false\n```\n\nWhenever there is a false value returned by\
    \ `predicate(e)`, the function is ended without checking the other elements.\n\
    \n### Parallel processing\n\nThe short-circuiting implementation processes the\
    \ elements sequentially, which is efficient in terms of resource usage, but it\
    \ might result in longer execution.\n\nFor example, if the iteratee sends requests\
    \ via a network, it might take some time to send them one at a time. On the other\
    \ hand, while it might result in more requests sent, sending all of them at the\
    \ same time would be faster.\n\n# Common errors\n\n## Not propagating errors\n\
    \nWhen you convert a callback to a Promise, make sure that you also handle the\
    \ error case. Without that, the Promise is never resolved and an `await` waits\
    \ forever.\n\nFor example, the `gapi.load` provides separate callbacks for results\
    \ and errors:\n\n```\nawait new Promise((res, rej) => {\n  gapi.load(\"client:auth2\"\
    , {callback: res, onerror: rej});\n});\n```\n\nIf you don't attach the `rej` callback\
    \ to the `onerror` handler, errors won't propagate through the chain. This leads\
    \ to hard-to-debug problems and components that \"just stops\".\n\n## Missing\
    \ await in try..catch\n\nWhen you use `try..catch` or `try..finally` in an async\
    \ function, make sure that you use `await` too. For example, this code works fine\
    \ when the inner Promise resolves:\n\n```\nconst fn = async () => {\n  return\
    \ \"result\";\n}\n\nconst outer = async () => {\n  try {\n    return fn(); //\
    \ <= missing await!\n  }catch(e) {\n    console.log(e.message);\n  }\n}\n\nawait\
    \ outer(); // result\n```\n\nBut the `try..catch` won't handle exceptions:\n\n\
    ```\nconst fn = async () => {\n  throw new Error(\"error\");\n}\n\nconst outer\
    \ = async () => {\n  try {\n    return fn(); // <= missing await!\n  }catch(e)\
    \ {\n    console.log(e.message);\n  }\n}\n\nawait outer();\n// exception is thrown!\n\
    ```\n\nThis is because exceptions are thrown from the `await` and while returning\
    \ a Promise from an async function flattens the result, it will be returned without\
    \ waiting for it. And without waiting, an exception is not thrown for the `try..catch`\
    \ but when the caller uses `await`.\n\n```\nconst fn = async () => {\n  throw\
    \ new Error(\"error\");\n}\n\nconst outer = async () => {\n  try {\n    return\
    \ await fn();\n  }catch(e) {\n    console.log(e.message); // error\n  }\n}\n\n\
    await outer();\n// no exception here\n```\n\n## Not checking the return value\n\
    \nWhen a Promise is resolved it does not necessarily mean that everything is alright.\
    \ For example, the `fetch` rejects when there is a problem *with the connection*\
    \ but it resolves even if the response status returns an error.\n\nWhen the call\
    \ can not establish a connection, the Promise rejects:\n\n```\ntry {\n  await\
    \ fetch(\"htp://example.com\");\n}catch(e) {\n  console.log(e.message); // Failed\
    \ to fetch\n}\n```\n\nBut when the response status code indicates an error (500),\
    \ the Promise still resolves:\n\n```\ntry {\n  await fetch(\"https://httpbin.org/status/500\"\
    );\n\n  // no error\n}catch(e) {\n  console.log(e.message);\n}\n```\n\nBecause\
    \ of this, you need to check the result for error responses. The `fetch` result\
    \ provides the `ok` field to do this:\n\n```\nconst response = await fetch(\"\
    https://httpbin.org/status/500\");\n\nif (!response.ok) {\n  throw new Error(\"\
    Error response\");\n}\n```\n\n## Not closing resources in case of a rejection\n\
    \nIt's common to open some resource, then close it after it's not needed. For\
    \ example, this code creates a temporary directory then deletes it later:\n\n\
    ```\nconst fs = require(\"fs\").promises;\nconst os = require(\"os\");\nconst\
    \ path = require(\"path\");\n\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\n\n// use dir to store temporary things\n\nawait fs.rmdir(dir,\
    \ {recursive: true});\n```\n\nThis works unless there is an exception that jumps\
    \ over the cleanup code.\n\n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\n\nthrow Error(\"error\");\n\nawait fs.rmdir(dir, {recursive:\
    \ true});\n// the cleanup won't run!\n```\n\nUse `try..finally` to implement reliable\
    \ cleanup:\n\n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir())\
    \ + path.sep\n);\ntry {\n  // use dir to store temporary things\n}finally {\n\
    \  await fs.rmdir(dir, {recursive: true});\n}\n```\n\nEven better, you can move\
    \ the resource lifecycle to a dedicated function, as discussed in the [The async\
    \ disposer pattern](#chapter8.xhtml_defined-async-disposer) chapter:\n\n```\n\
    const withTempDir = async (fn) => {\n  const dir = await fs.mkdtemp(\n    await\
    \ fs.realpath(os.tmpdir()) + path.sep\n  );\n  try {\n    return await fn(dir);\n\
    \  }finally {\n    fs.rmdir(dir, {recursive: true});\n  }\n};\n\nawait withTempDir((dir)\
    \ => {\n  // use dir to store temporary things\n})\n```\n\n## Using both the rejection\
    \ and resolve handlers in one then function\n\nA common source of problems is\
    \ to write error handling like this:\n\n```\ngetPromise()\n  .then(process, handleError);\n\
    ```\n\nAs we've discussed in the [Error propagation in Promise chains](#chapter2.xhtml_defined-error-propagation-in-promise-chains)\
    \ chapter, the second handler of the `then()` is called for errors but only from\
    \ the previous steps.\n\n![](ef010590c468612b89d4abfa91bab02e9dfbc8ee00ff194c7c4047da0758ec61.png)\n\
    \nDiagram of the promise chain\n\nNotice that the `handleError` function only\
    \ gets errors from the `getPromise`. If the result of the `process` function is\
    \ rejected, it won't be handled.\n\nA better solution is to use `.catch` to be\
    \ explicit about errors:\n\n```\ngetPromise()\n  .then(process)\n  .catch(handleError);\n\
    ```\n\nThis way it's clear that both steps are covered by the error handlers.\n\
    \n## Not waiting for an async forEach"
