  trans: "\n\n即使异步函数在某种意义上相互独立（一个函数不使用另一个函数的结果），在某些情况下你可能也不想让它们并行运行。在上面的 `moveObject`\
    \ 和 `updateDatabase` 异步函数示例中，如果前者失败，你可能不希望运行后者。\n\n```\nawait Promise.all([moveObject(),\
    \ updateDatabase()]);\n```\n\n当这段代码运行时，可能产生以下结果：\n\n| 对象已移动 | 数据库已更新 |\n| ---\
    \ | --- |\n| ✓ | ✓ |\n| ✓ | ‐ |\n| **‐** | **✓** |\n| ‐ | ‐ |\n\n通过使用串行执行，你可以确保后续操作只有在前面的操作完成后才会运行：\n\
    \n```\nawait moveObject();\nawait updateDatabase();\n```\n\n当这段代码运行时，如果移动对象失败，数据库保证保持不变：\n\
    \n| 对象已移动 | 数据库已更新 |\n| --- | --- |\n| ✓ | ✓ |\n| ✓ | ‐ |\n| ‐ | ‐ |\n\n## 早期初始化\n\
    \n当你创建一个 `Promise` 时，它就开始执行。但异步函数只有在遇到 `await` 时才会暂停。这种结构允许你提前启动异步处理，但只在需要结果时才等待它。\n\
    \n例如，考虑以下代码，它会等待函数完成后再继续执行：\n\n```\nconst wait = (ms) => new Promise((res) =>\
    \ setTimeout(res, ms));\n\nconst fn = async () => {\n  console.log(\"starting\"\
    );\n  await wait(100);\n  console.log(\"end\");\n}\n\nawait fn();\nconsole.log(\"\
    after\");\n\n// starting\n// end\n// after\n```\n\n![](img/8d4d58f7f1e0491f45e90876feb98157026c307f5ffe6bc7a5c07595adeaa4f7.png)\n\
    \n急切等待\n\n但当 `await` 被推迟时，执行顺序会发生变化：\n\n```\nconst fnProm = fn();\nconsole.log(\"\
    after\");\nawait fnProm;\n\n// starting\n// after\n// end\n```\n\n这提供了一种简单的方法来“在后台”运行任务，同时在需要时获取结果。\n\
    \n![](img/fa9d1f0ccc5366e0d05176dd3b8d30ec61b0c3928005a76744076d57359459e3.png)\n\
    \n延迟等待\n\n例如，一个 Web 服务器在收到请求时可能需要做几件事，其中之一是从 cookie 和会话存储中获取用户会话。\n\n```\nconst\
    \ http = require(\"http\");\n\nconst getUserSession = async (req) => {\n  // 提取会话\
    \ cookie\n  // 从 Redis 获取会话\n  // 返回用户对象\n};\n\nconst server = http.createServer(async\
    \ (req, res) => {\n  // 验证请求\n  // 获取配置\n  const session = await getUserSession(req);\n\
    \  // 处理请求\n});\n\nserver.listen(8080);\n```\n\n在上面的例子中，一切都是顺序执行的。服务器先处理请求，然后获取用户会话。\n\
    \n为了在请求到来后立即开始获取用户会话，你可以将调用异步函数和 `await` 分开：\n\n```\nconst server = http.createServer(async\
    \ (req, res) => {\n  const sessionProm = getUserSession(req);\n  // 验证请求\n  //\
    \ 获取配置\n  const session = await sessionProm;\n  // 处理请求\n});\n```\n\n在这种情况下，会话在需要时仍然可用，但处理过程更早开始。这减少了用户感知的总时间。\n\
    \n不过有一个陷阱。正如我们在错误处理章节中讨论的，如果异步函数抛出错误，它会通过 `await` 传播。这意味着如果执行过程中没有遇到该 `Promise`\
    \ 的 `await`，错误将不会被处理。\n\n这是一个问题。\n\n考虑以下代码：\n\n```\nconst wait = (ms) => new Promise((res)\
    \ => setTimeout(res, ms));\n\nconst fn = async () => {\n  await wait(100);\n \
    \ throw new Error(\"Something bad happened\");\n}\n\ntry{\n  const p = fn();\n\
    \  throw new Error(\"There was an error\");\n  await p;\n}catch(e) {\n  console.log(e.message);\n\
    }\n```\n\n这会输出：\n\n```\nThere was an error\n(node:170) UnhandledPromiseRejectionWarning:\
    \ Error: Something\nbad happened\n(node:170) UnhandledPromiseRejectionWarning:\
    \ Unhandled promise\nrejection. This error originated either by throwing inside\
    \ of an\nasync function without a catch block, or by rejecting a promise\nwhich\
    \ was not handled with .catch(). To terminate the node\nprocess on unhandled promise\
    \ rejection, use the CLI flag\n`--unhandled-rejections=strict` (see\nhttps://nodejs.org/api/cli.html#cli_unhandled_rejections_mode).\n\
    (rejection id: 1)\n(node:170) [DEP0018] DeprecationWarning: Unhandled promise\n\
    rejections are deprecated. In the future, promise rejections that\nare not handled\
    \ will terminate the Node.js process with a\nnon-zero exit code.\n```\n\n未处理的拒绝是不好的。有一个全局的\
    \ `unhandledRejection` 事件可以处理它，但这会导致代码难以维护。正确的解决方案是确保 `Promise` 总是被 `await` 处理。这通常会导致代码更复杂。\n\
    \n在某些情况下，早期初始化模式是有用的，尤其是当任何异常都是灾难性的时。但当你有一个多个客户端可以调用的后端服务器时，最好避免使用。\n\n多个 await\n\
    \n如果一个 `Promise` 被多次 `await` 会发生什么？这不会导致函数被多次调用。当一个 `Promise` 被解决（resolved 或 rejected）后，`await`\
    \ 只是返回结果（或抛出异常）。\n\n考虑以下代码：\n\n```\nconst fn = async () => {\n  console.log(\"\
    called\");\n  await wait(100);\n  return \"result\";\n}\n\n(async () => {\n  const\
    \ p = fn();\n  console.log(await p);\n  console.log(await p);\n})();\n\n// called\n\
    // result\n// result\n```\n\n# 返回多个值\n\n正如我们在 Promise 构造函数章节中讨论的，和普通函数一样，一个 `Promise`\
    \ 只能有一个返回值。但很多时候你可能想返回多个值。\n\n幸运的是，JavaScript 支持对象和数组解构运算符，这使得使用单个变量来保存多个值变得容易。\n\
    \n例如，一个 `Promise` 可以解析为一个值数组：\n\n```\nconst getValues = () => new Promise((res)\
    \ => {\n  const user = \"user\";\n  const group = \"group\";\n  res([user, group]);\n\
    });\n\nconst [user, group] = await getValues();\n// user, group\n```\n\n或者一个具有已知字段的对象：\n\
    \n```\nconst getValues = () => new Promise((res) => {\n  const user = \"user\"\
    ;\n  const group = \"group\";\n  res({user, group});\n});\n\nconst {user, group}\
    \ = await getValues();\n// user, group\n```\n\n当然，这与同步函数使用的模式相同：\n\n```\nconst\
    \ getValues = () => {\n  const user = \"user\";\n  const group = \"group\";\n\
    \  return {user, group};\n};\n\nconst {user, group} = getValues();\n// user, group\n\
    ```\n\n并且异步函数也同样适用：\n\n```\nconst getValues = async () => {\n  const user = \"\
    user\";\n  const group = \"group\";\n  return {user, group};\n};\n\nconst {user,\
    \ group} = await getValues();\n// user, group\n```\n\n# 在 `Promise` 和回调之间转换\n\n\
    虽然 `Promise` 和 async/await 日益成为 JavaScript 中编写异步代码的主要方式，但回调仍然在许多地方使用。许多采用这种风格的库迁移到更现代的替代方案的速度较慢，浏览器（和\
    \ Node）API 的变化也很慢。\n\n例如，[marked](https://www.npmjs.com/package/marked) 是一个 markdown\
    \ 编译器，在异步模式下使用时需要一个回调：\n\n```\nmarked(text, options, (err, result) => {\n  //\
    \ result 是编译后的 markdown\n});\n```\n\n类似地，`setTimeout` 在时间到达时调用一个函数：\n\n```\nsetTimeout(callback,\
    \ 100);\n```\n\n更不用说大量的 Web API，例如 [Indexed DB](https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API)、[FileReader](https://developer.mozilla.org/en-US/docs/Web/API/FileReader)\
    \ 等。回调仍然无处不在，将它们转换为 `Promise` 是一个好习惯，特别是当你的代码已经使用 async/await 时。\n\n## 回调风格\n\n"
- fmt: "\nCallbacks implement the continuation-passing style programming where **a\
    \ function** instead of returning a value **calls** a continuation, in this case,\
    \ **an argument function**. It is especially prevalent in Javascript as it does\
    \ not support synchronous waiting. Everything that involves some future events,\
    \ such as network calls, an asynchronous API, or a simple timeout is only possible\
    \ by using a callback mechanism.\n\nThere are several ways callbacks can work.\
    \ For example, `setTimeout` uses a callback-first pattern:\n\n```\nsetTimeout(callback,\
    \ ms);\n```\n\nOr functions can get multiple functions and call them when appropriate:\n\
    \n```\nconst checkAdmin = (id, isAdmin, notAdmin) => {\n  if (/* admin logic */)\
    \ {\n    isAdmin();\n  }else {\n    notAdmin();\n  }\n};\n```\n\nHow the callback\
    \ is invoked can also vary. For example, it might get multiple arguments:\n\n\
    ```\nconst getUserData = (id, cb) => {\n  const user = /* get user */\n  cb(user.id,\
    \ user.profile, user.avatar);\n};\n```\n\nAlso, asynchronicity might be implemented\
    \ as an object that emits events:\n\n```\nconst reader = new FileReader();\nreader.onload\
    \ = (event) => {\n  // event.target.result\n}\nreader.onerror = (error) => {\n\
    \  // handle error\n};\nreader.readAsDataURL(blob);\n```\n\n### Node-style callbacks\n\
    \nAs there are multiple equally reasonable ways to implement callbacks, it was\
    \ a mess at first. A de-facto standard emerged, which is now called Node-style\
    \ or error-first callbacks. It is used almost everywhere in Javascript whenever\
    \ a callback is needed.\n\nA Node-style callback has three characteristics:\n\n\
    *   The callback function is the last argument\n\n*   It is called with an error\
    \ object first, then a result (`(error, result)`)\n\n*   It returns only one result\n\
    \nAs an illustration, this function implements a Node-style callback:\n\n```\n\
    const getUser = (id, cb) => {\n  const user = /* get user */;\n  if (user) {\n\
    \    // success\n    cb(null, user);\n  }else {\n    // error\n    cb(new Error(\"\
    Failed to get user\"));\n  }\n};\n```\n\nNotice that when there is no error, the\
    \ first argument is `null`. This allows the caller to easily check whether the\
    \ execution failed or succeeded:\n\n```\ngetUser(15, (error, result) => {\n  if\
    \ (error) {\n    // handle error\n  } else {\n    // handle result\n  }\n});\n\
    ```\n\nWith a callback structure that is used almost exclusively, it is possible\
    \ to convert between Promises and callbacks more easily.\n\n## Convert callbacks\
    \ to Promises\n\nThis is the more prominent direction as it's a common task to\
    \ integrate a callback-based function into an async/await flow. Let's see how\
    \ to do it!\n\n### Promise constructor\n\nThe Promise constructor is the low-level\
    \ but universally applicable way to convert callbacks to Promises. It works for\
    \ every callback style and it needs only a few lines of code.\n\nThe Promise constructor\
    \ gets a function with two arguments: a `resolve` and a `reject` function. When\
    \ one of them is called, the Promise will settle with either a result passed to\
    \ the `resolve` function, or an error, passed to the `reject`.\n\n```\nnew Promise((res,\
    \ rej) => {\n\n  // resolve with a value\n  // res(value)\n\n  // reject with\
    \ error:\n  // rej(error)\n})\n```\n\nThis makes it easy to call a callback-based\
    \ function and convert it to a Promise which then can be `await`-ed:\n\n```\n\
    // Node-style\nnew Promise((res, rej) => getUser(15, (err, result) => {\n  if\
    \ (err) {\n    rej(err);\n  }else {\n    res(result);\n  }\n}))\n\n// setTimeout\n\
    new Promise((res) => setTimeout(res, 100));\n\n// event-based\nnew Promise((res,\
    \ rej) => {\n  const reader = new FileReader();\n  reader.onload = (event) =>\
    \ {\n    // resolve the Promise\n    res(event.target.result);\n  }\n  reader.onerror\
    \ = (error) => {\n    // reject the Promise\n    rej(error)\n  };\n  reader.readAsDataURL(blob);\n\
    });\n```\n\n#### Promisified functions\n\nThe above examples show how to call\
    \ a callback-based function and get back a Promise, but it requires wrapping every\
    \ call with the Promise boilerplate. It would be better to have a function that\
    \ mimics the original one but without the callback. Such a function would get\
    \ the same arguments minus the callback and return the Promise.\n\nTo make promisified\
    \ versions of functions, it is only a matter of wrapping the Promise constructor\
    \ in a function that gets the arguments before the callback:\n\n```\n// setTimeout\n\
    const promisifiedSetTimeout = (ms) =>\n  new Promise((res) => setTimeout(res,\
    \ ms));\n\n// FileReader\nconst promisifiedFileReader = (blob) =>\n  new Promise((res,\
    \ rej) => {\n    const reader = new FileReader();\n    reader.onload = (event)\
    \ => {\n      res(event.target.result);\n    }\n    reader.onerror = (error) =>\
    \ {\n      rej(error)\n    };\n    reader.readAsDataURL(blob);\n  });\n\n// checkAdmin\n\
    const promisifiedCheckAdmin = (id) => new Promise((res) => {\n  if (/* admin logic\
    \ */) {\n    res(true);\n  }else {\n    res(false);\n  }\n};\n```\n\nThese functions\
    \ are direct replacements to the callback-based originals and can be directly\
    \ used in an async/await workflow:\n\n```\n// timeout\nsetTimeout(() => {\n  console.log(\"\
    Timeout reached\");\n}, 100);\n\nawait promisifiedSetTimeout(100);\nconsole.log(\"\
    Timeout reached\");\n\n// checkAdmin\nconst checkAdmin = (id, isAdmin, notAdmin)\
    \ => {\n  if (/* admin logic */) {\n    isAdmin();\n  }else {\n    notAdmin();\n\
    \  }\n};\n\ncheckAdmin(15, () => {\n  console.log(\"User is an admin\");\n}, ()\
    \ => {\n  console.log(\"User is not an admin\");\n});\n\nconst admin = await promisifiedCheckAdmin(15);\n\
    console.log(`User is admin: ${admin}`);\n\n// FileReader\nconst dataURI = await\
    \ promisifiedFileReader(blob);\n```\n\n### util.promisify\n\nWhile the Promise\
    \ constructor offers a universal way to transform callbacks to Promises, when\
    \ the callback pattern follows the Node-style there is an easier way. The `util.promisify`\
    \ gets the callback-based function and returns a promisified version.\n\n```\n\
    import util from \"util\";\n\nconst promisifiedGetUser = util.promisify(getUser);\n\
    \nconst user = await promisifiedGetUser(15);\n// user is the result object\n```\n\
    \nWhen the promisified function is called, the callback argument is added automatically\
    \ and it also converts the result (or error) to the return value of the Promise.\n\
    \nHow it works is no magic though. It uses the Promise constructor pattern we've\
    \ discussed above, and uses the spread syntax to allow arbitrary amount of arguments.\
    \ A simplified implementation looks like this:\n\n```\nconst promisify = (fn)\
    \ => (...args) =>\n  new Promise((res, rej) => {\n    fn(...args, (err, result)\
    \ => {\n      if (err) {\n        rej(err);\n      }else {\n        res(result);\n\
    \      }\n    });\n  });\n```\n\n### Usual problems\n\n#### Handle this\n\nThe\
    \ value of `this` is complicated in Javascript. It can get different values depending\
    \ on how you call a function.\n\nFor example, classes can have instance variables,\
    \ attached to `this`:\n\n```\nclass C {\n  constructor() {\n    this.var = \"\
    var\";\n  }\n  fn() {\n    console.log(this.var);\n  }\n}\n```\n\nBut when you\
    \ have an object of this class, whether you call this function directly on the\
    \ object or extract it to another variable makes a difference in the value of\
    \ `this`:\n\n```\nnew C().fn(); // var\n\nlet fn = new C().fn;\nfn(); // TypeError:\
    \ Cannot read property 'var' of undefined\n```\n\nThis affects how to promisify\
    \ the methods of this object as the `util.promisify` requires just the function\
    \ and not the whole object. Which, in turn, breaks `this`.\n\nFor example, let's\
    \ say there is a Database object that creates a connection in its constructor\
    \ then it offers methods to send queries:\n\n```\nclass Database {\n  constructor()\
    \ {\n    this.connection = \"database connection\";\n  }\n  getUser(id, cb) {\n\
    \    if (!this.connection) {\n      throw new Error(\"No connection\");\n    }\n\
    \    setTimeout(() => {\n      if (id >= 0) {\n        cb(null, `user: ${id}`);\n\
    \      }else {\n        cb(new Error(\"id must be positive\"));\n      }\n   \
    \ }, 100);\n  }\n}\n\nconst database = new Database();\ndatabase.getUser(15, (error,\
    \ user) => {\n  // handle error or user\n})\n```\n\nUsing `util.promisify` would\
    \ break the `getUser` function as it changes the value of `this`:\n"
