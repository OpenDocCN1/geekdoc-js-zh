  trans: "\n这种行为使得大多数编程错误能够正确传播。但与 `reject` 回调不同，它只处理同步错误。\n\n#### 检测错误\n\n现在我们已经有了向\
    \ `Promise` 发出错误信号的方法，接下来看看如何调整 `gapi` 示例以利用这一机制！\n\n在这个具体案例中，回调也可以是一个包含 `callback`\
    \ 和 `onerror` 处理器的[对象](https://github.com/google/google-api-javascript-client/blob/master/docs/reference.md#----gapiloadlibraries-callbackorconfig------)：\n\
    \n```\nawait new Promise((res, rej) => {\n  gapi.load(\"client:auth2\", {callback:\
    \ res, onerror: rej});\n});\n```\n\n现在，如果在加载过程中出现错误，`rej` 函数会被调用，并且 `await` 会抛出一个错误。\n\
    \n注意\n\n底层函数如何传递结果和错误可能因库而异。你将在回调风格一章中了解更多。\n\n### Promise 链中的错误传播\n\n虽然异步函数使用与普通函数相同的\
    \ `try..catch` 结构，但 `Promise` 链的工作方式不同。`then` 回调有一个额外的回调，当之前的 `Promise` 被拒绝时会被调用：\n\
    \n```\nconst rejectedPromise = new Promise((res, rej) => {\n  rej(new Error(\"\
    rejected\"));\n});\n\nrejectedPromise.then(undefined, (error) => {\n  // error\
    \ = \"rejected\"\n  // 处理错误\n});\n```\n\n`Promise` 链中的错误会移动到下一个错误处理器，跳过所有前面的步骤。这使得从多个步骤收集错误并在一个地方处理变得容易：\n\
    \n```\ngetUser()\n  .then(getPermissionsForUser)\n  .then(checkPermission)\n \
    \ .then((allowed) => {\n    // 处理允许或不允许的情况\n  }).then(undefined, (error) => {\n\
    \    // 前面某个步骤出现了错误\n  });\n```\n\n一种有用的思考错误在链中传播的方式是将其视为两条并行的铁路轨道，上面有车站。一个车站就是一个\
    \ `then` 回调，其结果决定了列车继续行驶在哪条轨道上。\n\n提示\n\n你可以使用简写 `.catch((error) => {...})` 来代替\
    \ `.then(undefined, (error) => {...})`。\n\n![](img/1570b41fac08486b3d036c0da65981b6f9791bf94e4597cbb52302155f72e9e3.png)\n\
    \n`Promise` 链中的错误处理器\n\n这种思考方式有助于理清更复杂的链。让我们分析一下这里发生了什么：\n\n```\ngetPromise()\n\
    \  .then(handler1)\n  .then(handler2, catch1)\n  .then(handler3)\n  .then(undefined,\
    \ catch2)\n  .then(handler4)\n```\n\n这产生了以下图示：\n\n![](img/c354aee4c19744ca4aa52500db8678dff726cf80330cb30356faa176a2fc1d0c.png)\n\
    \nPromise 链的图示\n\n看起来复杂，但规则很简单：\n\n*   每个函数，无论它在哪条轨道上，都可以将执行转移到 OK 轨道或错误轨道。\n\
    *   当缺少处理器时（上图中的菱形），执行会保持在同一条轨道上。\n\n例如，如果 `getPromise()` 被拒绝，下一个函数将是 `catch1`。如果它被解决，那么下一个就是\
    \ `handler3`。如果它被解决，`handler4` 会被调用，并且无论它解决还是拒绝，都将是整个链的结果。\n\n错误处理器\n\n注意这一行：\n\
    \n```\n.then(handler2, catch1)\n```\n\n一个常见的错误来源是，如果 `handler2` 中出现错误，`catch1`\
    \ **不会运行**。每个错误处理器处理来自*前面步骤*的错误。\n\n# 并行与顺序处理\n\n当你在异步函数中使用 `await` 时，它会暂停执行直到\
    \ `Promise` 被解决。这使得每一行都等待前一行，从而产生看起来几乎像同步代码的代码：\n\n```\nawait s3.copyObject({/*...*/}).promise();\n\
    await s3.deleteObject({/*...*/}).promise();\n```\n\n上面的代码先复制一个对象，然后删除一个对象。如果你想要*移动*对象，这是理想的事件链，因为你希望复制操作在删除原始对象之前完成。\n\
    \n## 使用 Promise.all 进行并行处理\n\n但如果有一个不相关的调用，比如更新数据库呢？\n\n```\nawait s3.copyObject({/*...*/}).promise();\n\
    await s3.deleteObject({/*...*/}).promise();\n\nawait dynamodb.updateItem({/*...*/}).promise();\n\
    ```\n\n虽然 `dynamodb.updateItem` 与 S3 对象无关，但它仍然等待移动操作（复制+删除）完成。这使得整个过程比必要的时间更长。\n\
    \n![](img/3e190789d246b3a99678b872e19dca5e25722f9e39f7b5d615d91a516632adc7.png)\n\
    \n串行执行\n\n在这种情况下，更好的实现是让两个部分并行运行。为了更清楚地看到这一点，让我们用异步函数将两个操作分组：\n\n```\nconst moveObject\
    \ = async () => {\n  await s3.copyObject({/*...*/}).promise();\n  await s3.deleteObject({/*...*/}).promise();\n\
    };\n\nconst updateDatabase = async () => {\n  await dynamodb.updateItem({/*...*/}).promise();\n\
    };\n```\n\nJavaScript 有一个内置的便捷方法来并行运行任务。这就是 `Promise.all`，它接收一个 *Promise 集合* 并返回一个包含所有结果的\
    \ `Promise`。当你想要并发运行多个任务时，这就是要使用的工具。\n\n要并行运行这两个操作，请使用：\n\n```\nawait Promise.all([moveObject(),\
    \ updateDatabase()]);\n```\n\n![](img/327e086a88b6fea910123a1487b792143e5f047bb4e62f2c1be1ef125182b2c7.png)\n\
    \n并行执行\n\n这里需要注意几点。首先，`Promise.all` 接收的是 *Promise*。记住，*调用*一个异步函数会返回一个 `Promise`，所以不要忘记调用你想要运行的函数。\n\
    \n其次，它需要一个 *Promise 集合*，通常是一个数组。注意调用 `Promise.all` 时的 `([ ... ])` 结构。\n\n第三，`await`\
    \ 只用于 `Promise.all`，而不是用于单个异步函数调用。这是因为你想要等待*所有*它们完成后再继续。\n\n提示\n\n`await` 会暂停异步函数的执行。在\
    \ `Promise.all` 的情况下，你只想暂停一次，等待所有输入的 Promise 稳定。这就是为什么只需要一个 `await`。\n\n### 结果\n\
    \n在上面的例子中，没有一个操作返回值。让我们看看如何处理 `Promise.all` 返回的值！\n\n为了说明，假设异步函数需要两个不相关的数据：一个用户对象和一个组列表。这两个数据都存储在数据库中，因此可以通过异步函数获取。\n\
    \n```\nconst getUser = async () => {\n  // 获取用户对象\n  return user;\n}\nconst getGroups\
    \ = async () => {\n  // 获取组列表\n  return groups;\n}\n```\n\n注意在这个例子中，`getGroups`\
    \ 函数不需要用户对象。这使得它们可以并行运行。\n\n串行实现会分别调用这些函数并将结果存储在变量中：\n\n```\nconst user = await\
    \ getUser();\nconst groups = await getGroups();\n\n// user 和 groups 可用\n```\n\n\
    这里有两个 `await`，所以函数会暂停两次。无论你先放哪一个，总执行时间都是两次调用的总和。正如我们之前看到的，`Promise.all` 会并行运行异步函数返回的\
    \ Promise。它还会返回一个包含结果*数组*的 `Promise`。\n\n要并行运行这两个调用并提取结果，请使用数组解构运算符：\n\n```\n\
    const [user, groups] = await Promise.all([\n  getUser(),\n  getGroups(),\n]);\n\
    \n// user 和 groups 可用\n```\n\n### Promise.all 中的错误\n\n当*任何*输入的 Promise 被拒绝时，结果\
    \ `Promise` 也会被拒绝。这种行为使得错误能够无缝传播。\n\n```\ntry {\n  const [user, groups] = await\
    \ Promise.all([\n    getUser(), // getUser 返回一个值\n    getGroups(), // getGroups\
    \ 抛出一个异常\n  ]);\n} catch(e) {\n  // 处理任一调用抛出的错误\n}\n```\n\n"
- fmt: "\nEven when async functions are independent in a sense that one does not use\
    \ the result of the other, you might not want to run them in parallel in some\
    \ cases. In the example above with the `moveObject` and `updateDatabase` async\
    \ functions, you might not want to run the latter if the former is failed.\n\n\
    ```\nawait Promise.all([moveObject(), updateDatabase()]);\n```\n\nWhen this code\
    \ is run, it can produce the following results:\n\n| Object is moved | Database\
    \ is updated |\n| --- | --- |\n| ✓ | ✓ |\n| ✓ | ‐ |\n| **‐** | **✓** |\n| ‐ |\
    \ ‐ |\n\nBy using serial execution, you can make sure that the later operations\
    \ won't run unless the earlier ones are finished:\n\n```\nawait moveObject();\n\
    await updateDatabase();\n```\n\nWhen this code is run, the database is guaranteed\
    \ to be unchanged if the move object failed:\n\n| Object is moved | Database is\
    \ updated |\n| --- | --- |\n| ✓ | ✓ |\n| ✓ | ‐ |\n| ‐ | ‐ |\n\n## Early init\n\
    \nWhen you create a `Promise`, it starts executing. But the async function only\
    \ stops when it encounters an `await`. This allows a structure that starts the\
    \ async processing early but only stops for it when the result is needed.\n\n\
    For example, consider this code, which waits for the function to finish before\
    \ moving on:\n\n```\nconst wait = (ms) => new Promise((res) => setTimeout(res,\
    \ ms));\n\nconst fn = async () => {\n  console.log(\"starting\");\n  await wait(100);\n\
    \  console.log(\"end\");\n}\n\nawait fn();\nconsole.log(\"after\");\n\n// starting\n\
    // end\n// after\n```\n\n![](8d4d58f7f1e0491f45e90876feb98157026c307f5ffe6bc7a5c07595adeaa4f7.png)\n\
    \nEager await\n\nBut when the `await` is later, the order of execution changes:\n\
    \n```\nconst fnProm = fn();\nconsole.log(\"after\");\nawait fnProm;\n\n// starting\n\
    // after\n// end\n```\n\nThis allows an easy way to run things \"in the background\"\
    \ while also getting the results when they are needed.\n\n![](fa9d1f0ccc5366e0d05176dd3b8d30ec61b0c3928005a76744076d57359459e3.png)\n\
    \nDeferred await\n\nFor example, a web server might do several things when a request\
    \ arrives, one of them to fetch the user session from a cookie and a session store.\n\
    \n```\nconst http = require(\"http\");\n\nconst getUserSession = async (req) =>\
    \ {\n  // extract the session cookie\n  // fetch the session from Redis\n  //\
    \ return the user object\n};\n\nconst server = http.createServer(async (req, res)\
    \ => {\n  // validate request\n  // fetch configuration\n  const session = await\
    \ getUserSession(req);\n  // handle request\n});\n\nserver.listen(8080);\n```\n\
    \nIn the above example, everything happens sequentially. The server processes\
    \ the request and then fetches the user session.\n\nTo start getting the user\
    \ session right after the request comes, you can separate calling the async function\
    \ and the `await`:\n\n```\nconst server = http.createServer(async (req, res) =>\
    \ {\n  const sessionProm = getUserSession(req);\n  // validate request\n  // fetch\
    \ configuration\n  const session = await sessionProm;\n  // handle request\n});\n\
    ```\n\nIn this case, the session is still available when it's needed, but the\
    \ process starts sooner. This reduces the total time the user experiences.\n\n\
    There is catch though. As we've discussed in the [Error handling](#chapter11.xhtml_defined-error-handling)\
    \ chapter, if the async function throws an error it will be propagated through\
    \ the `await`. This means if the execution reaches no `await`s for that `Promise`,\
    \ the error won't be handled.\n\nThis is a problem.\n\nConsider this code:\n\n\
    ```\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst\
    \ fn = async () => {\n  await wait(100);\n  throw new Error(\"Something bad happened\"\
    );\n}\n\ntry{\n  const p = fn();\n  throw new Error(\"There was an error\");\n\
    \  await p;\n}catch(e) {\n  console.log(e.message);\n}\n```\n\nThis prints:\n\n\
    ```\nThere was an error\n(node:170) UnhandledPromiseRejectionWarning: Error: Something\n\
    bad happened\n(node:170) UnhandledPromiseRejectionWarning: Unhandled promise\n\
    rejection. This error originated either by throwing inside of an\nasync function\
    \ without a catch block, or by rejecting a promise\nwhich was not handled with\
    \ .catch(). To terminate the node\nprocess on unhandled promise rejection, use\
    \ the CLI flag\n`--unhandled-rejections=strict` (see\nhttps://nodejs.org/api/cli.html#cli_unhandled_rejections_mode).\n\
    (rejection id: 1)\n(node:170) [DEP0018] DeprecationWarning: Unhandled promise\n\
    rejections are deprecated. In the future, promise rejections that\nare not handled\
    \ will terminate the Node.js process with a\nnon-zero exit code.\n```\n\nAn unhandled\
    \ rejection is bad. There is a catch-all `unhandledRejection` event that allows\
    \ handling it, but that leads to unmaintainable code. A proper solution is to\
    \ make sure that the `Promise` is always `await`ed upon. This usually leads to\
    \ more complicated code.\n\nThere are valid cases where the early init pattern\
    \ is useful, especially when any exception is catastrophic. But when you have\
    \ a backend server that multiple clients can call, it is better to avoid.\n\n\
    Multiple awaits\n\nWhat happens if there are mutliple `await`s for a `Promise`?\
    \ This does not result in calling the function multiple times. When a `Promise`\
    \ is settled (resolved or rejected), `await` just returns the result (or throws\
    \ an exception).\n\nConsider the following code:\n\n```\nconst fn = async () =>\
    \ {\n  console.log(\"called\");\n  await wait(100);\n  return \"result\";\n}\n\
    \n(async () => {\n  const p = fn();\n  console.log(await p);\n  console.log(await\
    \ p);\n})();\n\n// called\n// result\n// result\n```\n\n# Returning multiple values\n\
    \nAs we've discussed in the [The Promise constructor](#chapter2.xhtml_defined-the-promise-constructor)\
    \ chapter, just like normal functions, a `Promise` can have a single return value.\
    \ But oftentimes you'll want to return multiple things.\n\nFortunately, Javascript\
    \ supports the object and the array destructuring operators that makes it easy\
    \ to use a single variable to hold multiple things.\n\nFor example, a `Promise`\
    \ can resolve with an array of values:\n\n```\nconst getValues = () => new Promise((res)\
    \ => {\n  const user = \"user\";\n  const group = \"group\";\n  res([user, group]);\n\
    });\n\nconst [user, group] = await getValues();\n// user, group\n```\n\nOr an\
    \ object with known fields:\n\n```\nconst getValues = () => new Promise((res)\
    \ => {\n  const user = \"user\";\n  const group = \"group\";\n  res({user, group});\n\
    });\n\nconst {user, group} = await getValues();\n// user, group\n```\n\nOf course,\
    \ it's the same pattern that you'd use for synchronous functions:\n\n```\nconst\
    \ getValues = () => {\n  const user = \"user\";\n  const group = \"group\";\n\
    \  return {user, group};\n};\n\nconst {user, group} = getValues();\n// user, group\n\
    ```\n\nAnd works the same with async functions too:\n\n```\nconst getValues =\
    \ async () => {\n  const user = \"user\";\n  const group = \"group\";\n  return\
    \ {user, group};\n};\n\nconst {user, group} = await getValues();\n// user, group\n\
    ```\n\n# Convert between `Promises` and callbacks\n\nWhile `Promises` and async/await\
    \ are increasingly the primary way to write asynchronous code in Javascript, callbacks\
    \ are still used in many places. Several libraries that adopted that style are\
    \ slow to migrate to the more modern alternative, and browser (and Node) APIs\
    \ are also slow to change.\n\nFor example, [marked](https://www.npmjs.com/package/marked),\
    \ a markdown compiler needs a callback when it's used in asynchronous mode:\n\n\
    ```\nmarked(text, options, (err, result) => {\n  // result is the compiled markdown\n\
    });\n```\n\nSimilarly, `setTimeout` invokes a function when the time is up:\n\n\
    ```\nsetTimeout(callback, 100);\n```\n\nNot to mention a ton of web APIs, such\
    \ as [Indexed DB](https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API),\
    \ [FileReader](https://developer.mozilla.org/en-US/docs/Web/API/FileReader), and\
    \ others. Callbacks are still everywhere, and it's a good practice to convert\
    \ them to `Promises` especially if your code is already using async/await.\n\n\
    ## Callback styles\n"
