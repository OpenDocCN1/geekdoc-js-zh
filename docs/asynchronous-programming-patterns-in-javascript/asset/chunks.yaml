  trans: "\n```\ntry (BufferedReader br =\n  new BufferedReader(new FileReader(path))\n\
    ) {\n  return br.readLine();\n}\n```\n\n这建立在[`AutoCloseable`](https://docs.oracle.com/javase/8/docs/api/java/lang/AutoCloseable.html)接口的`close`方法之上，因此很容易适应自定义资源类型。\n\
    \n但在 Javascript 中没有这样的结构。让我们看看如何实现一个！\n\n## Disposer 模式\n\n我们上面看到的`try..finally`结构的一个问题是**如何从`try`块内部返回值**。假设你想截取一个网站的截图，并希望稍后使用生成的图像。\n\
    \n```\nconst browser = await puppeteer.launch({/* ... */});\ntry {\n  const page\
    \ = await browser.newPage();\n  // ...\n  const screenshot = await page.screenshot({/*\
    \ ... */});\n\n  // the browser can be closed\n  // but how to use the screenshot\
    \ outside the try..finally?\n} finally {\n  await browser.close();\n}\n```\n\n\
    一个次优的解决方案是在块外部声明一个变量，并用它来存储图像：\n\n```\nlet screenshot;\n\nconst browser = await\
    \ puppeteer.launch({/* ... */});\ntry {\n  const page = await browser.newPage();\n\
    \  // ...\n  screenshot = await page.screenshot({/* ... */});\n} finally {\n \
    \ await browser.close();\n}\n\n// use screenshot\n```\n\n更好的解决方案是**使用一个函数**：\n\
    \n```\nconst makeScreenshot = async () => {\n  const browser = await puppeteer.launch({/*\
    \ ... */});\n  try {\n    const page = await browser.newPage();\n    // ...\n\
    \    return await page.screenshot({/* ... */});\n  } finally {\n    await browser.close();\n\
    \  }\n}\n\nconst screenshot = await makeScreenshot();\n```\n\n这是 disposer 模式的基础。不同之处在于，**它不再将逻辑硬编码在`try..finally`块内部，而是接收一个函数**来实现那部分逻辑：\n\
    \n```\nconst withBrowser = async (fn) => {\n  const browser = await puppeteer.launch({/*\
    \ ... */});\n  try {\n    return await fn(browser);\n  } finally {\n    await\
    \ browser.close();\n  }\n}\n\nconst screenshot = await withBrowser(async (browser)\
    \ => {\n  const page = await browser.newPage();\n  // ...\n  return await page.screenshot({/*\
    \ ... */});\n});\n```\n\n`withBrowser`函数包含了启动和关闭浏览器的逻辑，而**`fn`函数获取并使用浏览器实例**。每当参数函数返回时，浏览器会自动关闭，无需额外的清理逻辑。这种结构提供了一种优雅的方式来防止未关闭的资源残留。\n\
    \n这个模式的一个有趣之处在于，它是少数几个`return fn()`和`return await fn()`有区别的情况之一。通常，异步函数返回一个 Promise\
    \ 还是 Promise 的*结果*并不重要。但在这种情况下，如果没有`await`，`finally`块会在`fn()`调用完成*之前*运行。\n\n一个潜在的问题是，当参数函数返回时，其中可能还有任务正在运行。这通常发生在它启动了一个异步任务但没有等待其完成的情况下。在这种情况下，清理逻辑会运行并关闭浏览器实例，这可能导致错误。这通常是缺少`await`的标志。\n\
    \n# 重试异步操作\n\n## 退避算法\n\n一个 Javascript 应用向远程服务器发起了一个`fetch`调用，但失败了。它应该如何重试请求，以便最终成功，同时尽量减少调用次数？\n\
    \n退避算法确保**当目标系统无法处理请求时，不会因后续重试而使其不堪重负**。它通过在**重试之间引入等待时间**来实现这一点，给目标系统恢复的机会。\n\
    \n退避的需求基于这样一个观察：当服务过载时，它不可用，而发送更多请求只会加剧问题。当所有调用者暂时停止向已经过载的服务增加更多负载时，通常可以平滑流量峰值，仅带来轻微延迟。\n\
    \n![](img/81ffa39b4f50a6322742cfe80c6b0abe4a54d33a4cfc6e65c6d6bbe6f6f2f07c.png)\n\
    \n重试之间的等待\n\n**所使用的退避算法决定了重试之间等待的时间**。在网络拥塞的情况下，例如移动网络饱和时，最佳配置正在积极研究中。令人着迷的是，不同的实现会产生截然不同的有效带宽。\n\
    \n重试对远程服务器的失败调用是一个简单得多的问题，正确实现它不需要多年的研究。在本文中，你将学习如何在 Javascript 中实现一个足以满足所有实际需求的退避解决方案。\n\
    \n### 指数退避\n\n但让我们先重新审视选择退避策略的问题，即**重试之间等待多长时间**！发送请求太快会给可能已经不堪重负的服务器增加更多负载，而等待太久则会导致过多的延迟。\n\
    \n指数退避已成为标准算法。它对后续重试的等待时间呈指数增长，这使得前几次尝试只有轻微延迟，同时能快速达到较长的等待时间。\n\n它有两个参数：**第一个周期的延迟**和**增长因子**。例如，当第一次重试等待\
    \ 10 毫秒，后续每次翻倍时，等待时间依次为：10、20、40、80、160、320、640、1280……\n\n![](img/d5191b2e9a717182d5ab61edf29b6752ce765f65c23731a334bd94a7bf8e27c4.png)\n\
    \n指数退避\n\n## Javascript 实现\n\n实现退避算法时有两个陷阱。\n\n首先，确保**只在重试前等待，而不是在第一次请求前等待**。先等待再发送请求会为成功的请求也引入延迟。\n\
    \n其次，确保**限制重试次数**，以便代码最终放弃并抛出错误。即使调用最终成功，上游可能已经超时，用户很可能收到错误。及时返回错误并让用户重试操作是一种良好的用户体验实践。\n\
    \n在重试方面，有两种操作类型：基于拒绝的和基于进度的。让我们逐一讨论！\n\n### 基于拒绝的重试\n\n这种类型的调用**要么成功要么失败**，通常实现为\
    \ Promise 的 resolve 或 reject。一个典型的例子是“保存”按钮，它可能失败，在这种情况下，重试意味着再次发送请求。\n\n![](img/2117662494b59818a77ac0f1f0b249e36841997112e113693732a4400b88382a.png)\n\
    \n基于拒绝的重试\n\n为了说明，这个操作模拟了一个 90%时间会失败的网络调用：\n\n```\nconst wait = (ms) => new Promise((res)\
    \ => setTimeout(res, ms));\nconst maybeFail = (successProbability, result, error)\
    \ =>\n  new Promise((res, rej) => Math.random() < successProbability\n    ? res(result)\n\
    \    : rej()\n  );\n\nconst maybeFailingOperation = async () => {\n  await wait(10);\n\
    \  return maybeFail(0.1, \"result\", \"error\");\n}\n```\n\n在没有重试机制的情况下调用这个函数是糟糕的用户体验。用户需要反复点击按钮直到成功。\n\
    \n一个通用的解决方案，可以接受任何异步函数，并在放弃前重试几次：\n\n```\nconst callWithRetry = async (fn, depth\
    \ = 0) => {\n  try {\n    return await fn();\n  }catch(e) {\n    if (depth > 7)\
    \ {\n      throw e;\n    }\n    await wait(2 ** depth * 10);\n\n    return callWithRetry(fn,\
    \ depth + 1);\n  }\n}\n```\n\n并将其与上面定义的操作一起使用：\n\n```\nconst result = await callWithRetry(maybeFailingOperation);\n\
    ```\n\n在重试实现中，`depth`参数表示到目前为止对服务的调用次数。它决定了等待多长时间（`await wait(2 ** depth * 10)`）以及何时放弃（`if\
    \ (depth > 7) {...}`）。当函数调用自身时，它会递增这个值。\n"
- fmt: "\nInterestingly, this is a scenario where using `return await` makes a difference.\
    \ Usually, it does not matter if an async function returns a Promise or its resolved\
    \ value. But not in this case, as the `try..catch` needs to wait for the `fn()`\
    \ call to finish to handle exceptions thrown from it.\n\nNote that this implementation\
    \ retries for *any error*, even if it is a non-retriable one, such as sending\
    \ invalid data.\n\n### Progress-based retrying\n\nAnother class of retriable operations\
    \ is when **each call might make some progress towards completion but might not\
    \ reach it**.\n\nA great example of this is how DynamoDB's `batchWriteItem` call\
    \ works. You define the items to store, and the call tries to save all of them.\
    \ It then returns a list in the response indicating which elements failed. The\
    \ retry operation only needs to include these missed items and not the whole request.\n\
    \n![](eab2c064636a7004eb33ea8188c39e723476b67a79447737f4b9cbf93af9e9bd.png)\n\n\
    Progress-based retrying\n\nAs an illustration, this function emulates a progressing\
    \ call to a remote server. It returns a `progress` field that goes from 0 to 1,\
    \ and a `result` when the call is fully finished. It also needs to know the *current\
    \ progress*, which is a parameter for the call:\n\n```\nconst progressingOperation\
    \ = async (startProgress = 0) => {\n  await wait(10);\n  const progress = Math.round(\n\
    \    Math.min(startProgress + Math.random() / 3, 1) * 10\n  ) / 10;\n  return\
    \ {\n    progress,\n    result: progress === 1 ? \"result\" : undefined,\n  };\n\
    }\n```\n\nIn this case, not reaching completion still resolves the Promise, which\
    \ mimics the DynamoDB API. But a different API might reject it. Fortunately, it's\
    \ easy to convert a rejected Promise to a resolved one: `.catch()`.\n\nIn the\
    \ DynamoDB `batchWriteItem` example, the `progress` return field is the list of\
    \ the unprocessed items, and the `startProgress` parameter is the items to save.\n\
    \nTo retry the above call until it reaches completion:\n\n```\nconst callWithProgress\
    \ = async (fn, status, depth = 0) => {\n  const result = await fn(status);\n\n\
    \  // check completion\n  if (result.progress === 1) {\n    // finished\n    return\
    \ result.result;\n  }else {\n    // unfinished\n    if (depth > 7) {\n      throw\
    \ result;\n    }\n    await wait(2 ** depth * 10);\n\n    return callWithProgress(fn,\
    \ result.progress, depth + 1);\n  }\n}\n```\n\nTo use this retrying call, use:\n\
    \n```\nconst result = await callWithProgress(progressingOperation);\n```\n\nNote\
    \ that this implementation is not general-purpose as it builds on how the call\
    \ returns progress.\n\n# Paginating with async generators\n\nMany APIs limit how\
    \ many results they return for a single call. For example, the functions of the\
    \ AWS SDK that return lists are paginated operations. That means that you get\
    \ a limited number of elements in one call along with a token to get the next\
    \ batch. This can be a problem if you are not aware of it, as you might get all\
    \ the elements during development but your function might break in the future.\n\
    \nBut while getting the first batch is just `await lambda.listFunctions().promise()`,\
    \ paginating until all the pages are retrieved requires more work.\n\nLet's see\
    \ how to make an `await`-able structure that reliable gets all the elements from\
    \ an AWS API!\n\n## Pagination\n\nIn the case of Lambda functions, the `lambda.listFunctions`\
    \ [call](https://docs.aws.amazon.com/AWSJavaScriptSDK/latest/AWS/Lambda.html#listFunctions-property)\
    \ returns a structure with a list of all your lambdas if you don't have too many\
    \ of them (at most 50):\n\n```\nconst functions = await lambda.listFunctions().promise();\n\
    ```\n\n```\n{\n  Functions: [...]\n}\n```\n\nTo simulate a paginated case, you\
    \ can set the `MaxItems` parameter:\n\n```\nconst functions = await lambda.listFunctions({\n\
    \  MaxItems: 1\n}).promise();\n```\n\nThis time a `NextMarker` is also returned,\
    \ indicating there are more items:\n\n```\n{\n  Functions: [...],\n  NextMarker:\
    \ ...\n}\n```\n\nTo get the next batch, provide the last marker:\n\n```\nconst\
    \ functions = await lambda.listFunctions({\n  MaxItems: 1,\n  Marker: functions.NextMarker,\n\
    }).promise();\n```\n\nThen do so until no `NextMarker` is returned.\n\n## A solution\
    \ with async generators\n\nAsync generators are a relatively new feature of Javascript.\
