  raw: "The race is over and there is a rejection. Was it because of the timeout or\
    \ there was an error thrown from the Promise?\n\nThe above implementation does\
    \ not distinguish between errors and this makes it hard to handle timeouts specifically.\n\
    \n```\nconst fn = async () => {\n  throw new Error();\n};\n\ntry {\n  const result\
    \ = await timeout(fn(), 1000);\n}catch(e) {\n  // error or timeout?\n}\n```\n\n\
    The solution is to add a third argument that is the timeout rejection value. This\
    \ way there is an option to differentiate between errors:\n\n```\nconst timeout\
    \ = (prom, time, exception) => {\n  let timer;\n  return Promise.race([\n    prom,\n\
    \    new Promise((_r, rej) =>\n      timer = setTimeout(rej, time, exception)\n\
    \    )\n  ]).finally(() => clearTimeout(timer));\n}\n```\n\nWhat should be a timeout\
    \ error object?\n\n[Symbols](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol)\
    \ in Javascript are unique objects that are only equal to themselves. This makes\
    \ them perfect for this use-case. Pass a Symbol as the timeout error argument\
    \ then check if the rejection is that Symbol.\n\n```\nconst timeoutError = Symbol();\n\
    try {\n  const result = await timeout(prom, 1000, timeoutError);\n  // handle\
    \ result\n}catch (e) {\n  if (e === timeoutError) {\n    // handle timeout\n \
    \ }else {\n    // other error\n    throw e;\n  }\n}\n```\n\nThis construct allows\
    \ handling the timeout error specifically.\n\n# The async serializer pattern\n\
    \nLet's say you have a function that does some calculation but only if it hasn't\
    \ been done recently, effectively caching the result for a short amount of time.\
    \ In this case, **subsequent calls to the function affect each other**, as when\
    \ there is a refresh all of them need to wait for it. An implementation that does\
    \ not take concurrency into account can potentially run the refresh several times\
    \ in parallel when the cache expires.\n\nThis implementation is broken:\n\n```\n\
    // returns a function that caches its result for 2 seconds\n// broken, don't use\
    \ it\nconst badCachingFunction = (() => {\n  const cacheTime = 2000;\n  let lastRefreshed\
    \ = undefined;\n  let lastResult = undefined;\n  return async () => {\n    const\
    \ currentTime = new Date().getTime();\n    // check if cache is fresh enough\n\
    \    if (lastResult === undefined ||\n      lastRefreshed + cacheTime < currentTime)\
    \ {\n      // refresh the value\n      lastResult = await refresh();\n      lastRefreshed\
    \ = currentTime;\n    }\n    return lastResult;\n  }\n})();\n```\n\nWhen two concurrent\
    \ calls come when the function needs to refresh the value, the `refresh` function\
    \ is called twice:\n\n```\nconst wait = (ms) => new Promise((res) => setTimeout(res,\
    \ ms));\n\nconst refresh = async () => {\n  console.log(\"refreshing\")\n  await\
    \ wait(1000);\n};\n\nconst badCachingFunction = ...;\n\nbadCachingFunction();\n\
    badCachingFunction();\n// refreshing\n// refreshing\n```\n\nThe correct way to\
    \ handle this is to **make the second function wait for the refresh process**\
    \ without starting a separate one.\n\nOne way to do this is to **serialize the\
    \ calls** to the caching function. This makes *every* function to wait for all\
    \ the previous ones to finish, so multiple calls only trigger a single refresh\
    \ process.\n\nThis can be done in a variety of ways, but the easiest one is to\
    \ make the functions run one after the other. In this case, when one needs to\
    \ refresh the value, the other ones will wait for it to finish and won't start\
    \ their own jobs.\n\nAnother use-case I needed a solution like this is when backend\
    \ calls needed a token and that token expired after some time. When a call hit\
    \ an Unauthorized error, it refreshed the token and used the new one to retry.\
    \ Other backend calls needed to wait for the new token before they could be run.\
    \ In this case, it wasn't just performance-related as a new token invalidated\
    \ all the old ones.\n\n## Why await is not a solution\n\nThe trivial solution\
    \ is to use `await` that achieves serialization easily. After all, that's what\
    \ that keyword is for.\n\n```\nawait badCachingFunction();\nbadCachingFunction();\n\
    // refreshing\n```\n\nBut that requires *collaboration between the calls*, and\
    \ that is not always possible. For example, when the function is called in response\
    \ to multiple types of events, `await` is not possible to coordinate between them:\n\
    \n```\ndocument.querySelector(\"#btn\").addEventListener(\"click\", () => {\n\
    \  fn();\n})\n\nwindow.addEventListener(\"message\",  => {\n  fn();\n});\n```\n\
    \nIn this case, the function call must do the coordination.\n\n## A general-purpose\
    \ solution\n\nThe solution is to keep a queue of Promises that chains them one\
    \ after the other. It is just a few lines of code and it is general purpose, allowing\
    \ any function be serialized:\n\n```\nconst serialize = (fn) => {\n  let queue\
    \ = Promise.resolve();\n  return (...args) => {\n    const res = queue.then(()\
    \ => fn(...args));\n    queue = res.catch(() => {});\n    return res;\n  };\n\
    };\n```\n\n![](6600f68c8248bd1f1944c97a98bb9f325857eb96cbd5b1c092fd1fa91a14c374.png)\n\
    \nQueue structure\n\nThe `Promise.resolve()` is the start of the queue. Every\
    \ other call is appended to this Promise.\n\nThe `queue.then(() => fn(...args))`\
    \ adds the function call to the queue and it saves its result in `res`. It will\
    \ be resolved when *the current and all the previous calls are resolved*.\n\n\
    The `queue = res.catch(() => {})` part makes sure that the queue won't get stuck\
    \ in rejection when one part of it is rejected.\n\nWrapping the caching function\
    \ with this serializer makes sure that a single refresh is run even for multiple\
    \ calls:\n\n```\nconst fn = serialize((() => {\n  const cacheTime = 2000;\n  let\
    \ lastRefreshed = undefined;\n  let lastResult = undefined;\n  return async ()\
    \ => {\n    const currentTime = new Date().getTime();\n    // check if cache is\
    \ fresh enough\n    if (lastResult === undefined ||\n      lastRefreshed + cacheTime\
    \ < currentTime) {\n      // refresh the value\n      lastResult = await refresh();\n\
    \      lastRefreshed = currentTime;\n    }\n    return lastResult;\n  }\n})());\n\
    \nfn();\nfn();\n// refreshing\n```\n\n# The async disposer pattern\n\nA recurring\
    \ pattern is to **run some initialization code** to set up some resource or configuration,\
    \ then use the thing, **and** finally **do some cleanup**. It can be a global\
    \ property, such as freezing the time with [timekeeper](https://www.npmjs.com/package/timekeeper),\
    \ starting a Chrome browser with Puppeteer, or creating a temp directory. In all\
    \ these cases, you need to make sure the modifications/resources are properly\
    \ disposed of, otherwise, they might spill out to other parts of the codebase.\n\
    \nFor example, this code creates a temp directory in the system tmpdir then when\
    \ it's not needed it deletes it. This can be useful when, for example, you want\
    \ to use ffmpeg to extract some frames from a video and need a directory to tell\
    \ the `ffmpeg` command to output the images to.\n\n```\n// create the temp directory\n\
    const dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n);\n\
    try {\n\n  // use the temp directory\n\n} finally {\n  // remove the directory\n\
    \  fs.rmdir(dir, {recursive: true});\n}\n```\n\nA similar construct is `console.time`\
    \ that needs a `console.timeEnd` to output the time it took for a segment of the\
    \ code to run:\n\n```\nconsole.time(\"name\");\ntry {\n  // ...\n} finally {\n\
    \  console.timeEnd(\"name\");\n}\n```\n\nOr when you launch a browser, you want\
    \ to make sure it's closed when it's not needed:\n\n```\nconst browser = await\
    \ puppeteer.launch({/* ... */});\ntry {\n  // use browser\n} finally {\n  await\
    \ browser.close();\n}\n```\n\nAll these cases share the `try..finally` structure.\
    \ Without it, **an error can jump over the cleanup logic**, leaving the resource\
    \ initialized (or the console timing still ticking):\n\n```\nconst browser = await\
    \ puppeteer.launch({/* ... */});\n\n// if there is an error here the browser won't\
    \ close!\n\nawait browser.close();\n```\n\nIn other languages, such as Java, this\
    \ is known as [try-with-resources](https://docs.oracle.com/javase/tutorial/essential/exceptions/tryResourceClose.html)\
    \ and it is built into the language. For example, the `BufferedReader` is closed\
    \ after the block:"
