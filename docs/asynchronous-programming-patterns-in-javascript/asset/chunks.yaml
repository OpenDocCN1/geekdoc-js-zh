- fmt: "\n![](cover.jpg)\n\n# Introduction\n\nAsynchronous programming is everywhere\
    \ in Javascript. This is the result of the fundamental choices that define how\
    \ it works. In other languages, you can use multiple threads and that allows synchronous\
    \ waiting, a crucial feature missing from Javascript. It is by design single-threaded\
    \ and a wait operation stops everything, just think of the case where a long calculation\
    \ freezes the UI.\n\nWithout a way to wait for a later result synchronously, Javascript\
    \ needs to use callbacks. Even simple things like waiting for a given duration\
    \ requires a function that will be run when the time is up:\n\n```\nsetTimeout(()\
    \ => {\n  console.log(\"1 second passed!\");\n}, 1000);\n```\n\nYou can find this\
    \ pattern everywhere, as most of the things are asynchronous in nature. Using\
    \ `fetch` to make an HTTP call to a server is an async operation. Just like getting\
    \ information about the available cameras and microphones with the `getUserMedia`\
    \ call, as it needs to get permission from the user. Same with reading and writing\
    \ files. While these have synchronous versions for now, they are terrible for\
    \ performance. Or want to do some web scraping with Puppeteer? Every single instruction\
    \ is asynchronous as all of them communicate with a remote process. Or for backend\
    \ applications, reading or writing data to a database is also inherently async.\n\
    \nAnd not only that some functions are async but all the other functions that\
    \ call them need to be async too. A piece of functionality that requires making\
    \ a network call, for example, is asynchronous, no matter how insignificant that\
    \ call is compared to what other things the function is doing. Because of this,\
    \ almost all Javascript applications consist of mostly asynchronous operations.\n\
    \nOver the years, the language got a lot of features that make writing async code\
    \ easier. Gone are the days of the so-called callback hell where a series of callback-based\
    \ async calls made the program's structure very hard to understand and easy to\
    \ inadvertently silence errors.\n\nFirst, `Promises` gained widespread support,\
    \ flattening the structure of callbacks. Then async/await became the mainstream\
    \ way of async programming, hiding a lot of the complexities of asynchronicity\
    \ behind only two keywords: `async` and `await`.\n\nThis improved readability\
    \ and made it a lot easier for new programmers to write asynchronous code. Modern\
    \ Javascript is still using the same single-threaded no-sync-wait event loop,\
    \ but the program structure reflects that of a modern language.\n\nBut asynchronous\
    \ programming is inherently hard. While the language helps with the syntax to\
    \ make understanding and writing code easier, asynchronicity introduces a lot\
    \ of potential errors, most of them so subtle they only occur in special circumstances.\n\
    \nEven though I've been working for many years with asynchronous code, some of\
    \ the problems in this book took me a week to reach a solution I'm happy with.\
    \ My goal with this book is that you'll have an easier time when you encounter\
    \ similar problems by knowing what are the hard parts. This way you won't need\
    \ to start from zero but you'll have a good idea of what are the roadblocks and\
    \ the best practices.\n\nYou'll notice that error handling is a recurring topic\
    \ in this book. This is because it is an often overlooked concept and that leads\
    \ to code that easily breaks. By knowing how errors in async functions and `Promises`\
    \ work you'll write safer programs.\n\n## Structure\n\nThis book is divided into\
    \ two parts.\n\nThe first chapter, [Getting started with async/await](#chapter2.xhtml_defined-getting-started-with-async-await),\
    \ is an introduction to async/await and `Promises` and how each piece of the async\
    \ puzzle fit together. The primary focus is async functions as they are the mainstream\
    \ way to program asynchronously in Javascript. But async/await is a kind of magic\
    \ without knowing about `Promises`, so you'll learn about them too.\n\nBy the\
    \ end of the first chapter, you'll have a good understanding of how to use async\
    \ functions and how they work under the hood.\n\nThe second part of the book consists\
    \ of several common programming tasks and problems. You'll learn when that particular\
    \ problem is important, how to solve it, and what are the edge cases. This gives\
    \ you a complete picture so that when you encounter a similar problem you'll know\
    \ how to approach it.\n\nThis book is not meant to be read from cover to cover\
    \ but to be used as a reference guide. With the patterns described in this book,\
    \ my hope is that you'll see the underlying difficulty with async programming\
    \ so when you work on your own solutions you'll know the pitfalls and best practices\
    \ so you'll end up with more reliable code.\n\n# Getting started with async/await\n\
    \nIn this chapter, we start with an introduction to asynchronous programming in\
    \ Javascript. The main focus is async functions, as you'll likely use them more\
    \ often, but you'll also learn how `Promises` work.\n\n## Async functions\n\n\
    Normal functions return a result with the `return` keyword:\n\n```\nconst fn =\
    \ () => {\n  return 5;\n}\n\nfn();\n// 5\n```\n\nAsync functions, in contrast,\
    \ return a `Promise`:\n\n```\nconst asyncFn = async () => {\n  return 5;\n}\n\n\
    asyncFn();\n// Promise\n```\n\nYou can make any function async with the `async`\
    \ keyword, and there are a lot of functions that return a `Promise` instead of\
    \ a result.\n\nFor example, to read a file from the filesystem, you can use `fs.promises`,\
    \ a variant of the `fs` functions returning `Promises`:\n\n```\nconst fs = require(\"\
    fs\");\n\nfs.promises.readFile(\"test.js\");\n// Promise\n```\n\nOr convert an\
    \ image to jpeg with the [sharp](https://www.npmjs.com/package/sharp) library,\
    \ which also returns a `Promise`:\n\n```\nconst sharp = require(\"sharp\");\n\n\
    sharp(\"image.png\")\n  .jpeg()\n  .toFile(\"image.jpg\");\n// Promise\n```\n\n\
    Or make a network request with `fetch`:\n\n```\nfetch(\"https://advancedweb.hu\"\
    );\n// Promise\n```\n\n### How to use the Promise\n\nAn async function still has\
    \ a return value, and the `Promise` holds this result. To get access to the value,\
    \ **attach a callback** using the `then()` function. This callback will be called\
    \ with the result of the function.\n\nTo get the file contents after the `readFile`:\n\
    \n```\nconst fs = require(\"fs\");\n\nfs.promises.readFile(\"test.js\").then((result)\
    \ => {\n  console.log(result);\n  // Buffer\n});\n```\n\nSimilarly, to get the\
    \ result of our simple async function, use `then()`:\n\n```\nconst asyncFn = async\
    \ () => {\n  return 5;\n}\n\nasyncFn().then((res) => {\n  console.log(res);\n\
    \  // 5\n});\n```\n\n### The benefits of Promises\n\nBut why complicate a function\
    \ call with `Promises`? A normal function just returns a value that can be used\
    \ on the next line, without the need for any callbacks.\n\nThe benefit of returning\
    \ a `Promise` instead of a value is that the **result might not be ready by the\
    \ time the function returns**. The callback can be called much later, but the\
    \ function must return immediately. This extends what a function can do.\n\n```\n\
    // sync\nfn();\n// result is ready\n\n// async\nasyncFn().then(() => {\n  // result\
    \ is ready\n})\n// result is pending\n```\n\nIn many cases, a synchronous result\
    \ is not possible. For example, making a network request takes forever compared\
    \ to a function call. With `Promises`, it does not matter if something takes a\
    \ lot of time or produces a result immediately. In both cases, the `then()` function\
    \ will be called when the result is ready.\n\n![](219846a27f36124ca15767dea9c7b8b464f160923c5e3e283f065d57c1088b38.png)\n\
    \nAn async function returns a `Promise`\n\nUsing standardized `Promises` also\
    \ allows other constructs to build on it. As we've seen, the `async` keyword makes\
    \ a function return a `Promise` instead of a value.\n\nRecap\n\nAsync functions\
    \ return `Promises` which are values that are available sometime in the future.\n"
