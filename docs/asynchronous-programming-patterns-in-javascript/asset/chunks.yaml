  trans: "\n\n通过一个`Promise`隐藏远程调用的所有复杂性，所有与 async/await 配合使用的方式同样适用于这些调用：\n\n```\n\
    // 并行执行\nconsole.log(await Promise.all([\n  add(1, 1),\n  add(5, 5),\n])); //\
    \ [2, 10]\n\n// 异步归约\nconsole.log(await [1, 2, 3, 4].reduce(async (memo, i) =>\
    \ {\n  return add(await memo, i);\n}), 0); // 10\n```\n\n并且当需要时，`Promise` 会拒绝，从而允许在发送端进行适当的错误处理：\n\
    \n```\n// worker.js\naddEventListener(\"message\", (event) => {\n  try{\n    if\
    \ (\n      typeof event.data[0] !== \"number\" ||\n      typeof event.data[1]\
    \ !== \"number\"\n    ) {\n      throw new Error(\"both arguments must be numbers\"\
    );\n    }\n    event.ports[0].postMessage(\n      {result: event.data[0] + event.data[1]}\n\
    \    );\n  }catch(e) {\n    event.ports[0].postMessage({error: e});\n  }\n}, false)\n\
    \n// index.html\ntry {\n  await add(undefined, \"b\");\n}catch(e) {\n  console.log(\"\
    Error: \" + e.message); // error\n}\n```\n\n一个限制是可以通过 `postMessage` 调用发送的内容。它使用*结构化克隆算法*，该算法支持复杂对象，但[并非所有内容](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm)。\n\
    \n# 使用异步函数处理集合\n\n虽然 async/await 非常适合让异步*命令*看起来像同步命令，但集合处理就没那么简单了。仅仅在传递给 `Array.reduce`\
    \ 的函数前加上 `async`，它并不会神奇地正确工作。但如果没有异步函数，你就无法使用 `await` 并在*之后*提供结果，而这对于读取数据库、建立网络连接、读取文件以及许多其他操作来说是必需的。\n\
    \n让我们看一些例子！\n\n当你需要使用的所有函数都是同步的时，事情很简单。例如，一个字符串可以在不涉及任何异步操作的情况下被加倍：\n\n```\nconst\
    \ double = (str) => {\n  return str + str;\n};\n\ndouble(\"abc\");\n// abcabc\n\
    ```\n\n如果函数是异步的，那么对于单个项目使用 `await` 也很简单。例如，要计算 SHA-256 哈希，JavaScript 提供了一个 `digest()`\
    \ 异步函数：\n\n```\n// https://developer.mozilla.org/docs/Web/API/SubtleCrypto/digest\n\
    const digestMessage = async (message) => {\n  const msgUint8 = new TextEncoder().encode(message);\n\
    \  const hashBuffer =\n    await crypto.subtle.digest(\"SHA-256\", msgUint8);\n\
    \  const hashArray = Array.from(new Uint8Array(hashBuffer));\n  const hashHex\
    \ = hashArray\n    .map(b => b.toString(16).padStart(2, \"0\"))\n    .join('');\n\
    \  return hashHex;\n};\n\nawait digestMessage(\"msg\");\n// e46b320165eec91e6344fa1034...\n\
    ```\n\n这看起来与之前的调用几乎相同，唯一的区别是加了一个 `await`。\n\n但对于集合来说，处理异步就变得不同了。\n\n要计算**字符串集合**中每个元素的加倍，使用\
    \ `map` 很简单：\n\n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nstrings.map(double);\n\
    // [\"msg1msg1\", \"msg2msg2\", \"msg3msg3\"]\n```\n\n但要计算集合中每个字符串的**哈希**，就不行了：\n\
    \n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nawait strings.map(digestMessage);\n\
    // [object Promise],[object Promise],[object Promise]\n```\n\n这是一个常见问题，因为异步函数比同步函数涵盖的范围更广。同步函数可以在异步环境中工作，但异步函数无法转换为同步方式。\n\
    \n对于更实际的场景，查询数据库本质上是异步的，因为它需要建立网络连接。从假设的数据库中获取单个 `userId` 的分数很简单：\n\n```\nconst\
    \ getUserObject = async (id) => {\n  // 根据 id 获取用户\n};\n\nconst userId = 15;\n\
    const userObject = await getUserObject(userId);\nconst userScore = userObject.score;\n\
    ```\n\n但是如何查询一个*集合*的 `userId` 呢？\n\n```\nconst userIds = [15, 16, 21];\n// const\
    \ userObjects = ???\n```\n\n而且这不仅仅是使用 `map` 将一个值转换为另一个值。用户的分数是否大于 3？\n\n```\n\
    const userObject = await getUserObject(userId);\nconst above3 = userObject.score\
    \ > 3;\n```\n\n但是*任意*用户的分数是否大于 3？\n\n```\n// userIds.some(???)\n```\n\n或者平均分数是多少？\n\
    \n```\n// userIds.reduce(???)\n```\n\n更有趣的是，在 `map` 中添加 `async` 至少能给出一些变化的提示：\n\
    \n```\n// 同步\n[1, 2, 3].map((i) => {\n  return i + 1;\n});\n// [2, 3, 4]\n\n//\
    \ 异步\n[1, 2, 3].map(async (i) => {\n  return i + 1;\n});\n// [object Promise],[object\
    \ Promise],[object Promise]\n```\n\n但 `filter` 的行为则完全错误：\n\n```\n// 同步\n[1, 2,\
    \ 3, 4, 5].filter((i) => {\n  return i % 2 === 0;\n});\n// [2, 4]\n\n// 异步\n[1,\
    \ 2, 3, 4, 5].filter(async (i) => {\n  return i % 2 === 0;\n});\n// [1, 2, 3,\
    \ 4, 5]\n```\n\n因此，异步集合处理需要一些努力，并且根据你想使用的函数类型而有所不同。异步 `map` 的工作方式与异步 `filter`\
    \ 或异步 `reduce` 明显不同。\n\n在本章中，你将学习每种方法的工作原理以及如何高效地使用它们。\n\n## 异步迭代\n\n但首先，让我们谈谈\
    \ `for` 循环！\n\n我不喜欢 `for` 循环，因为它们往往助长不良的编码习惯，比如一次性做很多事的嵌套循环，或者散布在各处的 `continue`/`break`\
    \ 语句，很快就会变成难以维护的混乱。\n\n此外，使用 `map`/`filter`/`reduce` 等函数的函数式方法提倡一种风格：一个函数只做一件事，内部所有内容都是作用域内的且无状态的。而且函数式方法不仅在\
    \ 99% 的情况下可行，而且不会带来明显的性能下降，还能产生更简洁的代码（当然，至少在你熟悉相关函数时是这样）。\n\n但 async/await 属于剩下的\
    \ 1%。\n\n`for` 循环有一个显著特点：它们不依赖于*调用*函数。实际上，你可以在循环内部使用 `await`，它就能正常工作。\n\n```\n\
    // 同步\n{\n  const res = [];\n  for (let i of [1, 2, 3]){\n    res.push(i + 1);\n\
    \  }\n  // res: [2, 3, 4]\n}\n\n// 异步\n{\n  const res = [];\n  for (let i of [1,\
    \ 2, 3]){\n    await sleep(10);\n    res.push(i + 1);\n  }\n  // res: [2, 3, 4]\n\
    }\n```\n\n由于 `for` 循环是一种通用工具，它们可以用于处理集合时的各种需求。\n\n但它们的缺点仍然存在，虽然将函数式方法适配到 async/await\
    \ 并非易事，但一旦你开始看到通用模式，它也没那么难。\n\n## 使用 reduce 的异步函数\n\n`reduce` 函数迭代地构建一个值并返回它，这个值不一定是集合。这就是名称的由来，因为它将集合*归约*为一个值。\n\
    \n迭代函数接收前一个结果（在下面的例子中称为 `memo`）和当前值 `e`。\n\n以下函数对元素求和，从 0 开始（`reduce` 的第二个参数）：\n\
    \n```\nconst arr = [1, 2, 3];\n\nconst syncRes = arr.reduce((memo, e) => {\n \
    \ return memo + e;\n}, 0);\n\nconsole.log(syncRes);\n// 6\n```\n\n| `memo`   |\
    \       `e`       |   结果 |\n| --- | --- | --- |\n| 0 (初始值) | **1** | 1 |\n| 1\
    \ | **2** | 3 |\n| 3 | **3** | (最终结果) 6 |\n\n![](img/87a5c26af62b04b8a3f8f8f31fadb7f21ef4327dd2eb7167aa4ee5b222f5a055.png)\n\
    \nreduce 函数\n\n### 异步 reduce\n\n异步版本几乎相同，但每次迭代返回一个 `Promise`，因此 `memo` 将是前一个结果的\
    \ `Promise`。迭代函数需要 `await` 它才能计算下一个结果：\n\n```\n// 用于休眠的实用函数\nconst sleep = (n)\
    \ => new Promise((res) => setTimeout(res, n));\n\nconst arr = [1, 2, 3];\n\nconst\
    \ asyncRes = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n  return\
    \ (await memo) + e;\n}, 0);\n\nconsole.log(asyncRes);\n// 6\n```\n\n| `memo` \
    \  |       `e`       |   结果 |\n| --- | --- | --- |\n| 0 (初始值) | **1** | `Promise(1)`\
    \ |\n| `Promise(1)` | **2** | `Promise(3)` |\n| `Promise(3)` | **3** | (最终结果)\
    \ `Promise(6)` |\n\n"
- fmt: "\n## Async reduce function\n\nWith the structure of `async (memo, e) => await\
    \ memo`, the `reduce` can handle any async functions and it can be `await`ed.\n\
    \n### Timing\n\nConcurrency has an interesting property when it comes to `reduce`.\
    \ In the synchronous version, elements are processed one-by-one, which is not\
    \ surprising as they rely on the *previous* result. But when an async `reduce`\
    \ is run, all the iteratee functions start running in parallel and wait for the\
    \ previous result (`await memo`) only when needed.\n\n#### await memo last\n\n\
    In the example above, all the `sleep`s happen in parallel, as the `await memo`,\
    \ which makes the function to wait for the previous one to finish, comes later.\n\
    \n```\nconst arr = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\nconst\
    \ asyncRes = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n  return\
    \ (await memo) + e;\n}, 0);\n\nconsole.log(`Took ${new Date().getTime() - startTime}\
    \ ms`);\n// Took 11-13 ms\n```\n\n![](0b9006991849f3db718eda88ce54dd1256aac7028395d38d486e40e017b9c20c.png)\n\
    \nAsync reduce with \"await memo\" last\n\n#### await memo first\n\nBut when the\
    \ `await memo` comes first, the functions run sequentially:\n\n```\nconst arr\
    \ = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\nconst asyncRes =\
    \ await arr.reduce(async (memo, e) => {\n  await memo;\n  await sleep(10);\n \
    \ return (await memo) + e;\n}, 0);\n\nconsole.log(`Took ${new Date().getTime()\
    \ - startTime} ms`);\n// Took 36-38 ms\n```\n\n![](b5be8ee75623f698e0f641badb7276bd5dcf61c7743e9b3960452f00be724050.png)\n\
    \nAsync reduce with \"await memo\" first\n\nThis behavior is usually not a problem\
    \ as it naturally means everything that is not dependent on the previous result\
    \ will be calculated immediately, and only the dependent parts are waiting for\
    \ the previous value.\n\n#### When parallelism matters\n\nBut in some cases, it\
    \ might be unfeasible to do something ahead of time.\n\nFor example, I had a piece\
    \ of code that prints different PDFs and concatenates them into one single file\
    \ using the [pdf-lib](https://www.npmjs.com/package/pdf-lib) library.\n\nThis\
    \ implementation runs the resource-intensive `printPDF` function in parallel:\n\
    \n```\nconst result = await printingPages.reduce(async (memo, page) => {\n  const\
    \ pdf = await PDFDocument.load(await printPDF(page));\n\n  const pdfDoc = await\
    \ memo;\n\n  (await pdfDoc.copyPages(pdf, pdf.getPageIndices()))\n    .forEach((page)\
    \ => pdfDoc.addPage(page));\n\n  return pdfDoc;\n\n}, PDFDocument.create());\n\
    ```\n\nI noticed that when I have many pages to print, it would consume too much\
    \ memory and slow down the overall process.\n\nA simple change made the `printPDF`\
    \ calls wait for the previous one to finish:\n\n```\nconst result = await printingPages.reduce(async\
    \ (memo, page) => {\n  const pdfDoc = await memo;\n\n  const pdf = await PDFDocument.load(await\
    \ printPDF(page));\n\n  (await pdfDoc.copyPages(pdf, pdf.getPageIndices()))\n\
    \    .forEach((page) => pdfDoc.addPage(page));\n\n  return pdfDoc;\n\n}, PDFDocument.create());\n\
    ```\n\n## Async functions with map\n\nThe `map` is the easiest and most common\
    \ collection function. It runs each element through an iteratee function and returns\
    \ an array with the results.\n\nThe synchronous version that adds one to each\
    \ element:\n\n```\nconst arr = [1, 2, 3];\n\nconst syncRes = arr.map((i) => {\n\
    \  return i + 1;\n});\n\nconsole.log(syncRes);\n// 2,3,4\n```\n\nAn async version\
    \ needs to do two things. First, it needs to **map every item to a *Promise***\
    \ with the new value, which is what adding `async` before the function does.\n\
    \nAnd second, it needs to **wait for all the Promises** then **collect the results**\
    \ in an Array. Fortunately, the `Promise.all` built-in call is exactly what we\
    \ need for step 2.\n\nThis makes the general pattern of an async `map` to be `Promise.all(arr.map(async\
    \ (...) => ...))`.\n\nAn async implementation doing the same as the sync one:\n\
    \n```\nconst arr = [1, 2, 3];\n\nconst asyncRes = await Promise.all(arr.map(async\
    \ (i) => {\n  await sleep(10);\n  return i + 1;\n}));\n\nconsole.log(asyncRes);\n\
    // 2,3,4\n```\n\n![](4882ecc2dd5773605f888af8d04d80ecb36a75c646ef743a8e2f5effef00a0a0.png)\n\
    \nAsync map\n\n### Concurrency\n\nThe above implementation runs the iteratee function\
    \ in parallel for each element of the array. This is usually fine, but in some\
    \ cases, it might consume too much resources. This can happen when the async function\
    \ hits an API or consumes too much RAM that it's not feasible to run too many\
    \ at once.\n\nWhile an async `map` is easy to write, adding concurrency controls\
    \ is more involved. In the next few examples, we'll look into different solutions.\n\
    \n#### Batch processing\n\nThe easiest way is to group elements and process the\
    \ groups one by one. This gives you control of the maximum amount of parallel\
    \ tasks that can run at once. But since one group has to finish before the next\
    \ one starts, the *slowest* element in each group becomes the limiting factor.\n\
    \n![](e1c1bb2cf8fe927cceb829b06b7bcf4d193ae1459d48dc895ae7f708be81dd0c.png)\n\n\
    Mapping in groups\n\nTo make groups, the example below uses the `groupBy` implementation\
    \ from [Underscore.js](https://underscorejs.org/#groupBy). Many libraries provide\
    \ an implementation and they are mostly interchangeable. The exception is Lodash,\
    \ as its [groupBy does not pass the index of the item](https://lodash.com/docs/#groupBy).\n\
    \nIf you are not familiar with `groupBy`, it runs each element through an iteratee\
    \ function and returns an object with the keys as the results and the values as\
    \ lists of the elements that produced that value.\n\nTo make groups of at most\
    \ `n` elements, an iteratee `Math.floor(i / n)` where `i` is the *index* of the\
    \ element will do. As an example, a group of size 3 will map the elements like\
    \ this:\n\n```\n0 => 0\n1 => 0\n2 => 0\n3 => 1\n4 => 1\n5 => 1\n6 => 2\n...\n\
    ```\n\nIn Javascript:\n\n```\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconsole.log(\n\
    \  _.groupBy(arr, (_v, i) => Math.floor(i / 3))\n);\n// {\n//     0: [30, 10,\
    \ 20],\n//     1: [20, 15, 20],\n//     2: [10]\n// }\n```\n\nThe last group might\
    \ be smaller than the others, but all groups are guaranteed not to exceed the\
    \ maximum group size.\n\nTo map one group, the usual `Promise.all(group.map(...))`\
    \ construct is fine.\n\nTo map the groups sequentially, we need a reduce that\
    \ concatenates the previous results (`memo`) with the results of the current group:\n\
    \n```\nreturn Object.values(groups)\n  .reduce(async (memo, group) => [\n    ...(await\
    \ memo),\n    ...(await Promise.all(group.map(iteratee)))\n  ], []);\n```\n\n\
    This implementation is based on the fact that the `await memo`, which waits for\
    \ the previous result, will be completed before moving on to the next line.\n\n\
    The full implementation that implements batching:\n\n```\nconst arr = [30, 10,\
    \ 20, 20, 15, 20, 10];\n\nconst mapInGroups = (arr, iteratee, groupSize) => {\n\
    \  const groups = _.groupBy(arr, (_v, i) =>\n    Math.floor(i / groupSize));\n\
    \n  return Object.values(groups)\n    .reduce(async (memo, group) => [\n     \
    \ ...(await memo),\n      ...(await Promise.all(group.map(iteratee)))\n    ],\
    \ []);\n};\n\nconst res = await mapInGroups(arr, async (v) => {\n  console.log(`S\
    \ ${v}`);\n  await sleep(v);\n  console.log(`F ${v}`);\n  return v + 1;\n}, 3);\n\
    \n// -- first batch --\n// S 30\n// S 10\n// S 20\n// F 10\n// F 20\n// F 30\n\
    // -- second batch --\n// S 20\n// S 15\n// S 20\n// F 15\n// F 20\n// F 20\n\
    // -- third batch --\n// S 10\n// F 10\n\nconsole.log(res);\n// 31,11,21,21,16,21,11\n\
    ```\n\n#### Parallel processing\n\nAnother type of concurrency control is to run\
    \ at most `n` tasks in parallel, and start a new one whenever one is finished.\n\
    \n![](902c1166225283a3fdcb8dc17bac41ee0ca65689964e8747ea3f7485578e1209.png)\n\n\
    Controlled concurrency\n\nI couldn't come up with a simple implementation for\
    \ this, but fortunately, the Bluebird library [provides one](http://bluebirdjs.com/docs/api/promise.map.html#map-option-concurrency)\
    \ out of the box. This makes it straightforward, just import the library and use\
    \ the `Promise.map` function that has support for the `concurrency` option.\n"
