  trans: "\n回调函数实现了延续传递风格的编程，其中**一个函数**不是返回一个值，而是**调用**一个延续（即**一个参数函数**）。这种模式在 JavaScript\
    \ 中尤为常见，因为它不支持同步等待。任何涉及未来事件的操作，例如网络调用、异步 API 或简单的超时，都只能通过回调机制实现。\n\n回调函数有多种工作方式。例如，`setTimeout`\
    \ 使用回调优先模式：\n\n```\nsetTimeout(callback, ms);\n```\n\n或者，函数可以接收多个函数，并在适当的时候调用它们：\n\
    \n```\nconst checkAdmin = (id, isAdmin, notAdmin) => {\n  if (/* 管理员逻辑 */) {\n\
    \    isAdmin();\n  }else {\n    notAdmin();\n  }\n};\n```\n\n回调的调用方式也可能不同。例如，它可能接收多个参数：\n\
    \n```\nconst getUserData = (id, cb) => {\n  const user = /* 获取用户 */\n  cb(user.id,\
    \ user.profile, user.avatar);\n};\n```\n\n此外，异步性也可以通过一个发出事件的对象来实现：\n\n```\nconst\
    \ reader = new FileReader();\nreader.onload = (event) => {\n  // event.target.result\n\
    }\nreader.onerror = (error) => {\n  // 处理错误\n};\nreader.readAsDataURL(blob);\n\
    ```\n\n### Node 风格的回调\n\n由于实现回调的方式有多种且都同样合理，最初情况相当混乱。后来出现了一个事实上的标准，即现在所谓的 Node\
    \ 风格或错误优先回调。在 JavaScript 中，只要需要回调，几乎都会使用这种风格。\n\nNode 风格的回调具有三个特点：\n\n*   回调函数是最后一个参数\n\
    *   它首先被调用时传入一个错误对象，然后是结果（`(error, result)`）\n*   它只返回一个结果\n\n例如，以下函数实现了一个 Node\
    \ 风格的回调：\n\n```\nconst getUser = (id, cb) => {\n  const user = /* 获取用户 */;\n \
    \ if (user) {\n    // 成功\n    cb(null, user);\n  }else {\n    // 错误\n    cb(new\
    \ Error(\"获取用户失败\"));\n  }\n};\n```\n\n注意，当没有错误时，第一个参数是 `null`。这使得调用者可以轻松检查执行是否失败或成功：\n\
    \n```\ngetUser(15, (error, result) => {\n  if (error) {\n    // 处理错误\n  } else\
    \ {\n    // 处理结果\n  }\n});\n```\n\n由于这种回调结构几乎被独占使用，因此可以更容易地在 Promise 和回调之间进行转换。\n\
    \n## 将回调转换为 Promise\n\n这是更常见的方向，因为将基于回调的函数集成到 async/await 流程中是一项常见任务。让我们看看如何实现！\n\
    \n### Promise 构造函数\n\nPromise 构造函数是将回调转换为 Promise 的低级但普遍适用的方法。它适用于任何回调风格，并且只需要几行代码。\n\
    \nPromise 构造函数接收一个带有两个参数的函数：`resolve` 和 `reject` 函数。当其中一个被调用时，Promise 将根据传入 `resolve`\
    \ 函数的结果或传入 `reject` 的错误来定态。\n\n```\nnew Promise((res, rej) => {\n\n  // 用值解决\n\
    \  // res(value)\n\n  // 用错误拒绝：\n  // rej(error)\n})\n```\n\n这使得调用基于回调的函数并将其转换为\
    \ Promise 变得容易，然后可以对其进行 `await`：\n\n```\n// Node 风格\nnew Promise((res, rej) =>\
    \ getUser(15, (err, result) => {\n  if (err) {\n    rej(err);\n  }else {\n   \
    \ res(result);\n  }\n}))\n\n// setTimeout\nnew Promise((res) => setTimeout(res,\
    \ 100));\n\n// 基于事件\nnew Promise((res, rej) => {\n  const reader = new FileReader();\n\
    \  reader.onload = (event) => {\n    // 解决 Promise\n    res(event.target.result);\n\
    \  }\n  reader.onerror = (error) => {\n    // 拒绝 Promise\n    rej(error)\n  };\n\
    \  reader.readAsDataURL(blob);\n});\n```\n\n#### 转换为 Promise 的函数\n\n上面的示例展示了如何调用基于回调的函数并返回一个\
    \ Promise，但每次调用都需要用 Promise 样板代码包装。更好的做法是拥有一个模仿原始函数但不需要回调的函数。这样的函数将接收相同的参数（减去回调）并返回\
    \ Promise。\n\n要创建函数的 Promise 化版本，只需将 Promise 构造函数包装在一个函数中，该函数接收回调之前的参数：\n\n```\n\
    // setTimeout\nconst promisifiedSetTimeout = (ms) =>\n  new Promise((res) => setTimeout(res,\
    \ ms));\n\n// FileReader\nconst promisifiedFileReader = (blob) =>\n  new Promise((res,\
    \ rej) => {\n    const reader = new FileReader();\n    reader.onload = (event)\
    \ => {\n      res(event.target.result);\n    }\n    reader.onerror = (error) =>\
    \ {\n      rej(error)\n    };\n    reader.readAsDataURL(blob);\n  });\n\n// checkAdmin\n\
    const promisifiedCheckAdmin = (id) => new Promise((res) => {\n  if (/* 管理员逻辑 */)\
    \ {\n    res(true);\n  }else {\n    res(false);\n  }\n};\n```\n\n这些函数是原始基于回调函数的直接替代品，可以直接在\
    \ async/await 工作流中使用：\n\n```\n// 超时\nsetTimeout(() => {\n  console.log(\"超时已到\"\
    );\n}, 100);\n\nawait promisifiedSetTimeout(100);\nconsole.log(\"超时已到\");\n\n\
    // checkAdmin\nconst checkAdmin = (id, isAdmin, notAdmin) => {\n  if (/* 管理员逻辑\
    \ */) {\n    isAdmin();\n  }else {\n    notAdmin();\n  }\n};\n\ncheckAdmin(15,\
    \ () => {\n  console.log(\"用户是管理员\");\n}, () => {\n  console.log(\"用户不是管理员\");\n\
    });\n\nconst admin = await promisifiedCheckAdmin(15);\nconsole.log(`用户是管理员: ${admin}`);\n\
    \n// FileReader\nconst dataURI = await promisifiedFileReader(blob);\n```\n\n###\
    \ util.promisify\n\n虽然 Promise 构造函数提供了一种将回调转换为 Promise 的通用方法，但当回调模式遵循 Node 风格时，有一种更简单的方法。`util.promisify`\
    \ 接收基于回调的函数并返回一个 Promise 化版本。\n\n```\nimport util from \"util\";\n\nconst promisifiedGetUser\
    \ = util.promisify(getUser);\n\nconst user = await promisifiedGetUser(15);\n//\
    \ user 是结果对象\n```\n\n当调用 Promise 化函数时，回调参数会自动添加，并且它还会将结果（或错误）转换为 Promise 的返回值。\n\
    \n它的工作原理并不神奇。它使用了我们上面讨论的 Promise 构造函数模式，并使用展开语法来允许任意数量的参数。一个简化的实现如下所示：\n\n```\n\
    const promisify = (fn) => (...args) =>\n  new Promise((res, rej) => {\n    fn(...args,\
    \ (err, result) => {\n      if (err) {\n        rej(err);\n      }else {\n   \
    \     res(result);\n      }\n    });\n  });\n```\n\n### 常见问题\n\n#### 处理 this\n\
    \n在 JavaScript 中，`this` 的值很复杂。根据你调用函数的方式，它可以获得不同的值。\n\n例如，类可以拥有附加到 `this` 的实例变量：\n\
    \n```\nclass C {\n  constructor() {\n    this.var = \"var\";\n  }\n  fn() {\n\
    \    console.log(this.var);\n  }\n}\n```\n\n但是当你拥有这个类的对象时，你是直接在对象上调用这个函数，还是将其提取到另一个变量中，这会影响\
    \ `this` 的值：\n\n```\nnew C().fn(); // var\n\nlet fn = new C().fn;\nfn(); // TypeError:\
    \ Cannot read property 'var' of undefined\n```\n\n这会影响如何 Promise 化该对象的方法，因为 `util.promisify`\
    \ 只需要函数而不是整个对象。这反过来会破坏 `this`。\n\n例如，假设有一个 Database 对象，它在构造函数中创建连接，然后提供发送查询的方法：\n\
    \n```\nclass Database {\n  constructor() {\n    this.connection = \"数据库连接\";\n\
    \  }\n  getUser(id, cb) {\n    if (!this.connection) {\n      throw new Error(\"\
    无连接\");\n    }\n    setTimeout(() => {\n      if (id >= 0) {\n        cb(null,\
    \ `用户: ${id}`);\n      }else {\n        cb(new Error(\"id 必须为正数\"));\n      }\n\
    \    }, 100);\n  }\n}\n\nconst database = new Database();\ndatabase.getUser(15,\
    \ (error, user) => {\n  // 处理错误或用户\n})\n```\n\n使用 `util.promisify` 会破坏 `getUser`\
    \ 函数，因为它改变了 `this` 的值：\n\n"
- fmt: "\n```\nconst promisifiedDatabaseGetUser =\n  util.promisify(database.getUser);\n\
    await promisifiedDatabaseGetUser(15);\n// Error: Cannot read property 'connection'\
    \ of undefined\n```\n\nTo solve this, you can bind the object to the function,\
    \ forcing the value of `this`:\n\n```\nconst promisifiedDatabaseGetUser =\n  util.promisify(database.getUser.bind(database));\n\
    const user = await promisifiedDatabaseGetUser(15);\n```\n\n#### function.length\n\
    \nThe `length` of a function is how many arguments it needs. Don't confuse this\
    \ with the `Array`'s `length`, as that is how many *elements* in the array.\n\n\
    For example, this function needs 2 arguments, so its `length` is 2:\n\n```\nconst\
    \ fn = (a, cb) => {};\n\nconsole.log(fn.length); // 2\n```\n\nIt is rarely used,\
    \ but some libraries depend on it having the correct value, such as [memoizee](https://www.npmjs.com/package/memoizee#user-content-arguments-length),\
    \ which determines how to cache the function call or [marked](https://www.npmjs.com/package/marked),\
    \ a Markdown compiler, to decide whether its configuration is [called async or\
    \ sync](https://github.com/markedjs/marked/blob/127ac84da0c4d0a651e00bbd4eebef65d95aed75/src/marked.js#L67).\n\
    \nWhile the `length` of the function is rarely used, it can cause problems. `util.promisify`\
    \ does not change it, so the resulting function will have the same `length` as\
    \ the original one, even though it needs fewer arguments.\n\n```\nconsole.log(fn.length);\
    \ // 2\n\nconst promisified = util.promisify(fn);\n\nconsole.log(promisified.length);\
    \ // 2\n```\n\n## Convert Promises to callbacks\n\nThe other direction is to have\
    \ a Promise-returning function (usually an `async` function) and you need to convert\
    \ it to a callback-based one. It is much rarer than the other way around, but\
    \ there are cases when it's needed, usually when a library expects an asynchronous\
    \ function and it supports only callbacks.\n\nFor example, the marked library\
    \ supports a `highlight` option that gets the code block and returns a formatted\
    \ version. The highlighter gets the code, the language, and a callback argument,\
    \ and it is expected to call the last one with the result.\n\n```\nimport marked\
    \ from \"marked\";\nimport util from \"util\";\n\nconst promisifiedMarked = util.promisify(marked);\n\
    \nconst res = await promisifiedMarked(md, {\n  // highlight gets a callback\n\
    \  highlight: (code, lang, cb) => {\n    const result = \"Code block\";\n    cb(null,\
    \ result);\n  }\n});\n```\n\nAs with the promisification, there is a universal\
    \ and a Node-callback-specific way to convert an async function to use callbacks.\
    \ The universal way is to use an async IIFE (Immediately-Invoked Function Expression)\
    \ and add use `then` to interface with the callback when there is a result or\
    \ an error:\n\n```\nhighlight: (code, lang, cb) => {\n  (async () => {\n    const\
    \ result = \"Code block\";\n    return result;\n  })().then((res) => cb(null,\
    \ res), (err) => cb(err));\n}\n```\n\nThis structure allows all callback styles\
    \ as you control how a result or an error is communicated with the callback function.\n\
    \nFor Node-style callbacks, you can use the `util.callbackify` function that gets\
    \ an async function and returns a callbackified version:\n\n```\nhighlight: util.callbackify(async\
    \ (code, lang) => {\n  const result = \"Code block\";\n\n  return result;\n})\n\
    ```\n\nThis yields a convenient structure and it is suitable in most cases.\n\n\
    Also, it changes the resulting function's `length` by one, as it needs a callback\
    \ as well as all the original arguments:\n\n```\nconsole.log(fn.length) // 2\n\
    console.log(util.callbackify(fn).length) // 3\n```\n\n# Promise timeouts\n\n**Promises\
    \ in Javascript have no concept of time.** When you use `await` or attach a function\
    \ with `.then()`, it will **wait until the Promise is either resolved or rejected**.\
    \ This is usually not a problem as most async tasks finish within a reasonable\
    \ time and their result is needed.\n\nBut when a client is waiting for a response\
    \ of, let's say, an HTTP server, it's better to return early with an error giving\
    \ the caller a chance to retry rather than to wait for a potentially long time.\n\
    \nFortunately, there is a built-in Promise helper function that can be used to\
    \ add timeout functionality to any Promise-based construct.\n\n## Promise.race\n\
    \nThe [Promise.race](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/race)\
    \ is a global property of the `Promise` object. **It gets an array of Promises\
    \ and waits *for the first one* to finish**. Whether the race is resolved or rejected\
    \ depends on the winning member.\n\n![](9f8380b1ff6291470df6531613ee319b5bac317693c0f2d54da694da97dae3b4.png)\n\
    \np2 finishes first\n\nFor example, the following code races two Promises. The\
    \ second one resolves sooner, and the result of the other one is discarded:\n\n\
    ```\nconst p1 =\n  new Promise((res) => setTimeout(() => res(\"p1\"), 1000));\n\
    const p2 =\n  new Promise((res) => setTimeout(() => res(\"p2\"), 500));\n\nconst\
    \ result = await Promise.race([p1, p2]);\n// result = p2\n```\n\nSimilarly, it\
    \ works for rejections also. If the winning `Promise` is rejected, the race is\
    \ rejected:\n\n```\nconst p1 =\n  new Promise((res) => setTimeout(() => res(\"\
    p1\"), 1000));\nconst p2 =\n  new Promise((_r, rej) => setTimeout(() => rej(\"\
    p2\"), 500));\n\ntry {\n  const result = await Promise.race([p1, p2]);\n} catch(e)\
    \ {\n  // e = p2\n}\n```\n\nThe arguments of the `Promise.race` function are *Promises*.\
    \ This makes it work with `async` functions too:\n\n```\nconst fn = async (time,\
    \ label) => {\n  await new Promise((res) => setTimeout(res, time));\n  return\
    \ label;\n}\n\nconst result =\n  await Promise.race([fn(1000, \"p1\"), fn(500,\
    \ \"p2\")])\n// result = p2\n```\n\nJust don't forget to *call* the `async` functions\
    \ so that the race gets Promises. This can be a problem with anonymous functions\
    \ and those need to be wrapped IIFE-style:\n\n```\nconst result = await Promise.race([\n\
    \  fn(1000, \"p1\"),\n  (async () => {\n    await new Promise((res) => setTimeout(res,\
    \ 500));\n    return \"p2\";\n  })(),\n]);\n// result = p2\n```\n\n## Timeout\
    \ implementation\n\nWith `Promise.race`, it's easy to implement a timeout that\
    \ supports any Promises. Along with the async task, **start another `Promise`\
    \ that rejects when the timeout is reached**. Whichever finishes first (the original\
    \ Promise or the timeout) will be the result.\n\n![](0c43ee3777ed3a14a2262881d8dcee6b4ccd9c3f4b984b8f042b98edd0f157e9.png)\n\
    \nThe Promise finishes before the timeout\n\n```\nconst timeout = (prom, time)\
    \ =>\n  Promise.race([\n    prom,\n    new Promise((_r, rej) => setTimeout(rej,\
    \ time))\n  ]);\n```\n\nWith this helper function, wrap any Promise and it will\
    \ reject if it does not produce a result in the specified time.\n\n```\n// resolves\
    \ in 500 ms\nconst fn = async () => {\n  await new Promise((res) => setTimeout(res,\
    \ 500));\n  return \"p2\";\n}\n\n// finishes before the timeout\nconst result\
    \ = await timeout(fn(), 1000);\n// result = p2\n\n// timeouts in 100 ms\nawait\
    \ timeout(fn(), 100);\n// error\n```\n\n![](7221da63522922a688fa6822c7f619d06f1e665461f03a0c0d4ba10f1406dbab.png)\n\
    \nThe timeout finishes before the Promise\n\nIt's important to note that it *does\
    \ not terminate the Promise if the timeout is reached*, just discard its result.\
    \ If it consists of multiple steps, they will still run to completion eventually.\n\
    \n### Clear timeout\n\nThe above solution uses a `setTimeout` call to schedule\
    \ the rejection. Just as the original Promise does not terminate when the timeout\
    \ is reached, the timeout Promise **won't cancel this timer when the race is finished**.\n\
    \nWhile this does not change how the resulting Promise works, it can cause side-effects.\
    \ The event loop needs to check whether the timer is finished, and some environments\
    \ might work differently if there are unfinished ones.\n\nLet's make the wrapper\
    \ function use `Promise.finally` to clear the timeout!\n\n```\nconst timeout =\
    \ (prom, time) => {\n  let timer;\n  return Promise.race([\n    prom,\n    new\
    \ Promise((_r, rej) => timer = setTimeout(rej, time))\n  ]).finally(() => clearTimeout(timer));\n\
    }\n```\n\nThe above implementation saves the `setTimeout`'s result as `timer`\
    \ and clears it when the race is over.\n\n### Error object\n"
