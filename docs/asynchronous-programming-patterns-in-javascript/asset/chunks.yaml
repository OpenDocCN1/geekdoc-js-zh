  trans: "\n\n比赛结束了，但出现了拒绝。是因为超时，还是 `Promise` 抛出了错误？\n\n上述实现没有区分错误，这使得专门处理超时变得困难。\n\
    \n```\nconst fn = async () => {\n  throw new Error();\n};\n\ntry {\n  const result\
    \ = await timeout(fn(), 1000);\n}catch(e) {\n  // 错误还是超时？\n}\n```\n\n解决方案是添加第三个参数，即超时拒绝值。这样就有了区分错误的选项：\n\
    \n```\nconst timeout = (prom, time, exception) => {\n  let timer;\n  return Promise.race([\n\
    \    prom,\n    new Promise((_r, rej) =>\n      timer = setTimeout(rej, time,\
    \ exception)\n    )\n  ]).finally(() => clearTimeout(timer));\n}\n```\n\n超时错误对象应该是什么？\n\
    \nJavaScript 中的 [Symbols](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol)\
    \ 是唯一对象，只与自身相等。这使得它们非常适合这种用例。将一个 `Symbol` 作为超时错误参数传递，然后检查拒绝值是否就是那个 `Symbol`。\n\
    \n```\nconst timeoutError = Symbol();\ntry {\n  const result = await timeout(prom,\
    \ 1000, timeoutError);\n  // 处理结果\n}catch (e) {\n  if (e === timeoutError) {\n\
    \    // 处理超时\n  }else {\n    // 其他错误\n    throw e;\n  }\n}\n```\n\n这种结构允许专门处理超时错误。\n\
    \n# 异步序列化模式\n\n假设你有一个函数，它只在最近未计算过的情况下执行某些计算，从而在短时间内缓存结果。在这种情况下，**对该函数的后续调用会相互影响**，因为当需要刷新时，所有调用都必须等待。不考虑并发的实现可能会在缓存过期时多次并行执行刷新。\n\
    \n这个实现是有问题的：\n\n```\n// 返回一个将结果缓存 2 秒的函数\n// 有缺陷，不要使用\nconst badCachingFunction\
    \ = (() => {\n  const cacheTime = 2000;\n  let lastRefreshed = undefined;\n  let\
    \ lastResult = undefined;\n  return async () => {\n    const currentTime = new\
    \ Date().getTime();\n    // 检查缓存是否足够新鲜\n    if (lastResult === undefined ||\n\
    \      lastRefreshed + cacheTime < currentTime) {\n      // 刷新值\n      lastResult\
    \ = await refresh();\n      lastRefreshed = currentTime;\n    }\n    return lastResult;\n\
    \  }\n})();\n```\n\n当两个并发调用在函数需要刷新值时发生，`refresh` 函数会被调用两次：\n\n```\nconst wait\
    \ = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst refresh = async\
    \ () => {\n  console.log(\"refreshing\")\n  await wait(1000);\n};\n\nconst badCachingFunction\
    \ = ...;\n\nbadCachingFunction();\nbadCachingFunction();\n// refreshing\n// refreshing\n\
    ```\n\n正确的处理方式是**让第二个函数等待刷新过程**，而不启动另一个独立的刷新。\n\n一种方法是**序列化对缓存函数的调用**。这使得*每个*函数都等待所有前面的函数完成，因此多个调用只触发一个刷新过程。\n\
    \n这可以通过多种方式实现，但最简单的方法是让函数一个接一个地运行。在这种情况下，当一个函数需要刷新值时，其他函数会等待它完成，而不会启动自己的任务。\n\n\
    另一个需要类似解决方案的用例是，当后端调用需要令牌，而该令牌在一段时间后过期时。当调用遇到未授权错误时，它会刷新令牌并使用新令牌重试。其他后端调用需要等待新令牌才能运行。在这种情况下，这不仅仅是性能问题，因为新令牌会使所有旧令牌失效。\n\
    \n## 为什么 `await` 不是解决方案\n\n最简单的解决方案是使用 `await`，它可以轻松实现序列化。毕竟，这就是该关键字的作用。\n\n```\n\
    await badCachingFunction();\nbadCachingFunction();\n// refreshing\n```\n\n但这需要**调用之间的协作**，而这并不总是可行的。例如，当函数响应多种类型的事件而被调用时，`await`\
    \ 无法协调它们：\n\n```\ndocument.querySelector(\"#btn\").addEventListener(\"click\"\
    , () => {\n  fn();\n})\n\nwindow.addEventListener(\"message\",  => {\n  fn();\n\
    });\n```\n\n在这种情况下，函数调用必须自行协调。\n\n## 通用解决方案\n\n解决方案是维护一个 Promise 队列，将它们一个接一个地链接起来。只需几行代码，并且是通用的，允许任何函数被序列化：\n\
    \n```\nconst serialize = (fn) => {\n  let queue = Promise.resolve();\n  return\
    \ (...args) => {\n    const res = queue.then(() => fn(...args));\n    queue =\
    \ res.catch(() => {});\n    return res;\n  };\n};\n```\n\n![](img/6600f68c8248bd1f1944c97a98bb9f325857eb96cbd5b1c092fd1fa91a14c374.png)\n\
    \n队列结构\n\n`Promise.resolve()` 是队列的起点。每次其他调用都会被追加到这个 `Promise` 上。\n\n`queue.then(()\
    \ => fn(...args))` 将函数调用添加到队列中，并将其结果保存在 `res` 中。它将在*当前调用及所有之前的调用都解决后*被解决。\n\n\
    `queue = res.catch(() => {})` 部分确保当队列的一部分被拒绝时，队列不会卡住。\n\n用这个序列化器包装缓存函数，确保即使有多个调用，也只运行一次刷新：\n\
    \n```\nconst fn = serialize((() => {\n  const cacheTime = 2000;\n  let lastRefreshed\
    \ = undefined;\n  let lastResult = undefined;\n  return async () => {\n    const\
    \ currentTime = new Date().getTime();\n    // 检查缓存是否足够新鲜\n    if (lastResult ===\
    \ undefined ||\n      lastRefreshed + cacheTime < currentTime) {\n      // 刷新值\n\
    \      lastResult = await refresh();\n      lastRefreshed = currentTime;\n   \
    \ }\n    return lastResult;\n  }\n})());\n\nfn();\nfn();\n// refreshing\n```\n\
    \n# 异步释放器模式\n\n一种常见的模式是**运行一些初始化代码**来设置资源或配置，然后使用该资源，**最后**进行**清理**。它可以是全局属性，例如使用\
    \ [timekeeper](https://www.npmjs.com/package/timekeeper) 冻结时间，使用 Puppeteer 启动\
    \ Chrome 浏览器，或创建临时目录。在所有这些情况下，你需要确保修改/资源被正确释放，否则它们可能会泄漏到代码库的其他部分。\n\n例如，以下代码在系统临时目录中创建一个临时目录，然后在不需要时删除它。这在例如你想使用\
    \ ffmpeg 从视频中提取一些帧，并需要一个目录来告诉 `ffmpeg` 命令输出图像时非常有用。\n\n```\n// 创建临时目录\nconst dir\
    \ = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n);\ntry {\n\
    \n  // 使用临时目录\n\n} finally {\n  // 删除目录\n  fs.rmdir(dir, {recursive: true});\n\
    }\n```\n\n类似的结构是 `console.time`，它需要一个 `console.timeEnd` 来输出代码段运行所花费的时间：\n\n```\n\
    console.time(\"name\");\ntry {\n  // ...\n} finally {\n  console.timeEnd(\"name\"\
    );\n}\n```\n\n或者当你启动一个浏览器时，你想确保在不需要时关闭它：\n\n```\nconst browser = await puppeteer.launch({/*\
    \ ... */});\ntry {\n  // 使用浏览器\n} finally {\n  await browser.close();\n}\n```\n\
    \n所有这些情况都共享 `try..finally` 结构。没有它，**错误可能会跳过清理逻辑**，使资源保持初始化状态（或控制台计时仍在运行）：\n\n\
    ```\nconst browser = await puppeteer.launch({/* ... */});\n\n// 如果这里发生错误，浏览器将不会关闭！\n\
    \nawait browser.close();\n```\n\n在其他语言（如 Java）中，这被称为 [try-with-resources](https://docs.oracle.com/javase/tutorial/essential/exceptions/tryResourceClose.html)，并且内置于语言中。例如，`BufferedReader`\
    \ 在块结束后被关闭：\n\n"
- fmt: "\n```\ntry (BufferedReader br =\n  new BufferedReader(new FileReader(path))\n\
    ) {\n  return br.readLine();\n}\n```\n\nThis builds on the [`AutoCloseable`](https://docs.oracle.com/javase/8/docs/api/java/lang/AutoCloseable.html)\
    \ interface's `close` method so it's easy to adapt to custom resource types.\n\
    \nBut there is no such structure in Javascript. Let's see how to implement one!\n\
    \n## Disposer pattern\n\nOne problem with the `try..finally` structure we've seen\
    \ above is **how to return a value from inside the `try` block**. Let's say you\
    \ want to take a screenshot of a website and want to use the resulting image later.\n\
    \n```\nconst browser = await puppeteer.launch({/* ... */});\ntry {\n  const page\
    \ = await browser.newPage();\n  // ...\n  const screenshot = await page.screenshot({/*\
    \ ... */});\n\n  // the browser can be closed\n  // but how to use the screenshot\
    \ outside the try..finally?\n} finally {\n  await browser.close();\n}\n```\n\n\
    A suboptimal solution is to declare a variable outside the block and use it to\
    \ store the image:\n\n```\nlet screenshot;\n\nconst browser = await puppeteer.launch({/*\
    \ ... */});\ntry {\n  const page = await browser.newPage();\n  // ...\n  screenshot\
    \ = await page.screenshot({/* ... */});\n} finally {\n  await browser.close();\n\
    }\n\n// use screenshot\n```\n\nA better solution is to **use a function**:\n\n\
    ```\nconst makeScreenshot = async () => {\n  const browser = await puppeteer.launch({/*\
    \ ... */});\n  try {\n    const page = await browser.newPage();\n    // ...\n\
    \    return await page.screenshot({/* ... */});\n  } finally {\n    await browser.close();\n\
    \  }\n}\n\nconst screenshot = await makeScreenshot();\n```\n\nThis is the basis\
    \ of the disposer pattern. The difference is that **instead of hardcoding the\
    \ logic inside the `try..finally` block, it gets a function** that implements\
    \ that part:\n\n```\nconst withBrowser = async (fn) => {\n  const browser = await\
    \ puppeteer.launch({/* ... */});\n  try {\n    return await fn(browser);\n  }\
    \ finally {\n    await browser.close();\n  }\n}\n\nconst screenshot = await withBrowser(async\
    \ (browser) => {\n  const page = await browser.newPage();\n  // ...\n  return\
    \ await page.screenshot({/* ... */});\n});\n```\n\nThe `withBrowser` function\
    \ contains the logic to launch and close the browser, and **the `fn` function\
    \ gets and uses the browser instance**. Whenever the argument function returns,\
    \ the browser is automatically closed, no additional cleanup logic is needed.\
    \ This structure provides an elegant way to prevent non-closed resources hanging\
    \ around.\n\nAn interesting aspect of this pattern is that it is one of the few\
    \ cases where there is a difference between `return fn()` and `return await fn()`.\
    \ Usually, it does not matter if an async function returns a Promise or the *result*\
    \ of the Promise. But in this case, without the `await` the `finally` block runs\
    \ *before* the `fn()` call is finished.\n\nA potential problem is when there is\
    \ some task is running in the argument function when it returns. This can happen\
    \ when it starts an asynchronous task and does not wait for it to finish. In this\
    \ case, the cleanup logic runs and closes the browser instance that can cause\
    \ an error. It is usually the sign that an `await` is missing.\n\n# Retrying async\
    \ operations\n\n## Backoff algorithm\n\nA Javascript application made a `fetch`\
    \ call to a remote server and it failed. How should it retry the request so that\
    \ it eventually succeeds while also minimizing the calls made?\n\nA backoff algorithm\
    \ makes sure that **when a target system can not serve a request it is not flooded\
    \ with subsequent retries**. It achieves this by introducing a **waiting period\
    \ between the retries** to give the target a chance to recover.\n\nThe need for\
    \ a backoff builds on the observation that a service is unavailable when it is\
    \ overloaded and sending more requests only exacerbates the problem. When all\
    \ callers temporarily cease adding more load to the already overloaded service\
    \ usually smooths the traffic spikes with only a slight delay.\n\n![](81ffa39b4f50a6322742cfe80c6b0abe4a54d33a4cfc6e65c6d6bbe6f6f2f07c.png)\n\
    \nWaiting between retries\n\n**The backoff algorithm used determines how much\
    \ to wait between the retries**. The best configuration is actively researched\
    \ in the case of network congestion, such as when a mobile network is saturated.\
    \ It's fascinating to see that different implementations yield drastically different\
    \ effective bandwidth.\n\nRetrying a failed call to a remote server is a much\
    \ easier problem and doing it right does not require years of research. In this\
    \ article, you'll learn how to implement a backoff solution in Javascript that\
    \ is good enough for all practical purposes.\n\n### Exponential backoff\n\nBut\
    \ let's first revisit the problem of choosing the backoff strategy, i.e. **how\
    \ much to wait between the retries**! Sending requests too soon puts more load\
    \ on the potentially struggling server, while waiting too long introduces too\
    \ much lag.\n\nThe exponential backoff became the standard algorithm to use. It\
    \ waits exponentially longer for subsequent retries, which makes the first few\
    \ tries happen with only a slight delay while it reaches longer periods quickly.\n\
    \nIt has two parameters: the **delay of the first period** and the **growth factor**.\
    \ For example, when the first retry waits 10ms and the subsequent ones double\
    \ the previous values, the waiting times are: 10, 20, 40, 80, 160, 320, 640, 1280,\
    \ ...\n\n![](d5191b2e9a717182d5ab61edf29b6752ce765f65c23731a334bd94a7bf8e27c4.png)\n\
    \nExponential backoff\n\n## Javascript implementation\n\nThere are two pitfalls\
    \ when implementing a backoff algorithm.\n\nFirst, make sure to **wait only before\
    \ retries and not the first request**. Waiting first and sending a request then\
    \ introduces a delay even for successful requests.\n\nAnd second, make sure to\
    \ **put a limit to the number of retries** so that the code eventually gives up\
    \ and throws an error. Even if the call eventually succeeds, something upstream\
    \ timeouts in the meantime, and the user likely gets an error. Returning an error\
    \ in a timely manner and letting the user retry the operation is a good UX practice.\n\
    \nThere are two types of operation in terms of retrying: rejection-based and progress-based.\
    \ Let's discuss each of them!\n\n### Rejection-based retrying\n\nThis type of\
    \ call **either succeeds or fails** and it is usually implemented as a Promise\
    \ resolving or rejecting. A canonical example is a \"Save\" button that may fail\
    \ and in that case, retrying means sending the request again.\n\n![](2117662494b59818a77ac0f1f0b249e36841997112e113693732a4400b88382a.png)\n\
    \nRejection-based retrying\n\nFor illustration, this operation emulates a network\
    \ call that fails 90% of the time:\n\n```\nconst wait = (ms) => new Promise((res)\
    \ => setTimeout(res, ms));\nconst maybeFail = (successProbability, result, error)\
    \ =>\n  new Promise((res, rej) => Math.random() < successProbability\n    ? res(result)\n\
    \    : rej()\n  );\n\nconst maybeFailingOperation = async () => {\n  await wait(10);\n\
    \  return maybeFail(0.1, \"result\", \"error\");\n}\n```\n\nCalling this function\
    \ without a retry mechanism is bad UX. The user would need to click the button\
    \ repeatedly until it succeeds.\n\nA general-purpose solution that can take any\
    \ async function and retry it for a few times before giving up:\n\n```\nconst\
    \ callWithRetry = async (fn, depth = 0) => {\n  try {\n    return await fn();\n\
    \  }catch(e) {\n    if (depth > 7) {\n      throw e;\n    }\n    await wait(2\
    \ ** depth * 10);\n\n    return callWithRetry(fn, depth + 1);\n  }\n}\n```\n\n\
    And to use it with the operation defined above:\n\n```\nconst result = await callWithRetry(maybeFailingOperation);\n\
    ```\n\nIn the retry implementation, the `depth` argument indicates the number\
    \ of calls made to the service so far. It determines how much to wait (`await\
    \ wait(2 ** depth * 10)`) and when to give up (`if (depth > 7) {...}`). When the\
    \ function calls itself it increments this value.\n"
  raw: "```\ntry (BufferedReader br =\n  new BufferedReader(new FileReader(path))\n\
    ) {\n  return br.readLine();\n}\n```\n\nThis builds on the [AutoCloseable](https://docs.oracle.com/javase/8/docs/api/java/lang/AutoCloseable.html)\
    \ interface's `close` method so it's easy to adapt to custom resource types.\n\
    \nBut there is no such structure in Javascript. Let's see how to implement one!\n\
    \n## Disposer pattern\n\nOne problem with the `try..finally` structure we've seen\
    \ above is **how to return a value from inside the `try` block**. Let's say you\
    \ want to take a screenshot of a website and want to use the resulting image later.\n\
    \n```\nconst browser = await puppeteer.launch({/* ... */});\ntry {\n  const page\
    \ = await browser.newPage();\n  // ...\n  const screenshot = await page.screenshot({/*\
    \ ... */});\n\n  // the browser can be closed\n  // but how to use the screenshot\
    \ outside the try..finally?\n} finally {\n  await browser.close();\n}\n```\n\n\
    A suboptimal solution is to declare a variable outside the block and use it to\
    \ store the image:\n\n```\nlet screenshot;\n\nconst browser = await puppeteer.launch({/*\
    \ ... */});\ntry {\n  const page = await browser.newPage();\n  // ...\n  screenshot\
    \ = await page.screenshot({/* ... */});\n} finally {\n  await browser.close();\n\
    }\n\n// use screenshot\n```\n\nA better solution is to **use a function**:\n\n\
    ```\nconst makeScreenshot = async () => {\n  const browser = await puppeteer.launch({/*\
    \ ... */});\n  try {\n    const page = await browser.newPage();\n    // ...\n\
    \    return await page.screenshot({/* ... */});\n  } finally {\n    await browser.close();\n\
    \  }\n}\n\nconst screenshot = await makeScreenshot();\n```\n\nThis is the basis\
    \ of the disposer pattern. The difference is that **instead of hardcoding the\
    \ logic inside the `try..finally` block, it gets a function** that implements\
    \ that part:\n\n```\nconst withBrowser = async (fn) => {\n  const browser = await\
    \ puppeteer.launch({/* ... */});\n  try {\n    return await fn(browser);\n  }\
    \ finally {\n    await browser.close();\n  }\n}\n\nconst screenshot = await withBrowser(async\
    \ (browser) => {\n  const page = await browser.newPage();\n  // ...\n  return\
    \ await page.screenshot({/* ... */});\n});\n```\n\nThe `withBrowser` function\
    \ contains the logic to launch and close the browser, and **the `fn` function\
    \ gets and uses the browser instance**. Whenever the argument function returns,\
    \ the browser is automatically closed, no additional cleanup logic is needed.\
    \ This structure provides an elegant way to prevent non-closed resources hanging\
    \ around.\n\nAn interesting aspect of this pattern is that it is one of the few\
    \ cases where there is a difference between `return fn()` and `return await fn()`.\
    \ Usually, it does not matter if an async function returns a Promise or the *result*\
    \ of the Promise. But in this case, without the `await` the `finally` block runs\
    \ *before* the `fn()` call is finished.\n\nA potential problem is when there is\
    \ some task is running in the argument function when it returns. This can happen\
    \ when it starts an asynchronous task and does not wait for it to finish. In this\
    \ case, the cleanup logic runs and closes the browser instance that can cause\
    \ an error. It is usually the sign that an `await` is missing.\n\n# Retrying async\
    \ operations\n\n## Backoff algorithm\n\nA Javascript application made a `fetch`\
    \ call to a remote server and it failed. How should it retry the request so that\
    \ it eventually succeeds while also minimizing the calls made?\n\nA backoff algorithm\
    \ makes sure that **when a target system can not serve a request it is not flooded\
    \ with subsequent retries**. It achieves this by introducing a **waiting period\
    \ between the retries** to give the target a chance to recover.\n\nThe need for\
    \ a backoff builds on the observation that a service is unavailable when it is\
    \ overloaded and sending more requests only exacerbates the problem. When all\
    \ callers temporarily cease adding more load to the already overloaded service\
    \ usually smooths the traffic spikes with only a slight delay.\n\n![](81ffa39b4f50a6322742cfe80c6b0abe4a54d33a4cfc6e65c6d6bbe6f6f2f07c.png)\n\
    \nWaiting between retries\n\n**The backoff algorithm used determines how much\
    \ to wait between the retries**. The best configuration is actively researched\
    \ in the case of network congestion, such as when a mobile network is saturated.\
    \ It's fascinating to see that different implementations yield drastically different\
    \ effective bandwidth.\n\nRetrying a failed call to a remote server is a much\
    \ easier problem and doing it right does not require years of research. In this\
    \ article, you'll learn how to implement a backoff solution in Javascript that\
    \ is good enough for all practical purposes.\n\n### Exponential backoff\n\nBut\
    \ let's first revisit the problem of choosing the backoff strategy, i.e. **how\
    \ much to wait between the retries**! Sending requests too soon puts more load\
    \ on the potentially struggling server, while waiting too long introduces too\
    \ much lag.\n\nThe exponential backoff became the standard algorithm to use. It\
    \ waits exponentially longer for subsequent retries, which makes the first few\
    \ tries happen with only a slight delay while it reaches longer periods quickly.\n\
    \nIt has two parameters: the **delay of the first period** and the **growth factor**.\
    \ For example, when the first retry waits 10ms and the subsequent ones double\
    \ the previous values, the waiting times are: 10, 20, 40, 80, 160, 320, 640, 1280,\
    \ ...\n\nNotice that the sum of the first 3 attempts is less than 100 ms, which\
    \ is barely noticeable. But it reaches >1 second in just 8 tries.\n\n![](d5191b2e9a717182d5ab61edf29b6752ce765f65c23731a334bd94a7bf8e27c4.png)\n\
    \nExponential backoff\n\n## Javascript implementation\n\nThere are two pitfalls\
    \ when implementing a backoff algorithm.\n\nFirst, make sure to **wait only before\
    \ retries and not the first request**. Waiting first and sending a request then\
    \ introduces a delay even for successful requests.\n\nAnd second, make sure to\
    \ **put a limit to the number of retries** so that the code eventually gives up\
    \ and throws an error. Even if the call eventually succeeds, something upstream\
    \ timeouts in the meantime, and the user likely gets an error. Returning an error\
    \ in a timely manner and letting the user retry the operation is a good UX practice.\n\
    \nThere are two types of operation in terms of retrying: rejection-based and progress-based.\
    \ Let's discuss each of them!\n\n### Rejection-based retrying\n\nThis type of\
    \ call **either succeeds or fails** and it is usually implemented as a Promise\
    \ resolving or rejecting. A canonical example is a \"Save\" button that may fail\
    \ and in that case, retrying means sending the request again.\n\n![](2117662494b59818a77ac0f1f0b249e36841997112e113693732a4400b88382a.png)\n\
    \nRejection-based retrying\n\nFor illustration, this operation emulates a network\
    \ call that fails 90% of the time:\n\n```\nconst wait = (ms) => new Promise((res)\
    \ => setTimeout(res, ms));\nconst maybeFail = (successProbability, result, error)\
    \ =>\n  new Promise((res, rej) => Math.random() < successProbability\n    ? res(result)\n\
    \    : rej()\n  );\n\nconst maybeFailingOperation = async () => {\n  await wait(10);\n\
    \  return maybeFail(0.1, \"result\", \"error\");\n}\n```\n\nCalling this function\
    \ without a retry mechanism is bad UX. The user would need to click the button\
    \ repeatedly until it succeeds.\n\nA general-purpose solution that can take any\
    \ async function and retry it for a few times before giving up:\n\n```\nconst\
    \ callWithRetry = async (fn, depth = 0) => {\n  try {\n    return await fn();\n\
    \  }catch(e) {\n    if (depth > 7) {\n      throw e;\n    }\n    await wait(2\
    \ ** depth * 10);\n\n    return callWithRetry(fn, depth + 1);\n  }\n}\n```\n\n\
    And to use it with the operation defined above:\n\n```\nconst result = await callWithRetry(maybeFailingOperation);\n\
    ```\n\nIn the retry implementation, the `depth` argument indicates the number\
    \ of calls made to the service so far. It determines how much to wait (`await\
    \ wait(2 ** depth * 10)`) and when to give up (`if (depth > 7) {...}`). When the\
    \ function calls itself it increments this value."
