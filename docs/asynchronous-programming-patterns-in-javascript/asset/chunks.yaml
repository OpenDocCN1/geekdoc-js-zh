  trans: "\n\n```\nconst button = document.querySelector(\"#button\");\n\nbutton.addEventListener(\"\
    click\", () => {\n  // button is clicked\n}, {once: true})\n```\n\n回调函数的问题在于我们又回到了原点，因为不再是扁平结构，而是再次出现了嵌套。\n\
    \n幸运的是，有一种简单的方法可以将回调转换为 `Promises`，然后与 `await` 一起使用。\n\n事件监听器与 `Promises`\n\n\
    眼尖的读者可能注意到了上一个例子中的 `{once: true}` 部分。事件监听器本质上与异步函数不同，因为它们代表的是*多个事件*，而不是单个结果值。因此，你不能用\
    \ `Promises` 来替换它们。\n\n唯一的例外是当只有一个事件时，就像上面的例子那样。从某种意义上说，它的工作方式类似于超时或 gapi 加载函数，因为回调会在事件发生时被调用。\n\
    \n### `Promise` 构造函数\n\n异步函数返回 `Promises`，但你只能使用 `await` 来等待其他 `Promises`，而不能等待回调。要创建一个\
    \ `Promise`，你需要使用它的构造函数：\n\n```\nnew Promise((res) => {\n  // 当 Promise 就绪时调用\
    \ res\n});\n```\n\n调用 `res` 回调会通知 `Promise` 结果已就绪。这与异步函数返回时的情况相同。\n\n要将 `setTimeout`\
    \ 转换为 `Promise`，将其包装在构造函数中，并使用 `res` 作为回调：\n\n```\nawait new Promise((res) =>\
    \ {\n  setTimeout(res, 1000);\n});\n// 1 秒后\n\n// 等同于\nawait new Promise((res)\
    \ => {\n  setTimeout(() => {\n    res();\n  }, 1000);\n});\n```\n\n现在它变成了一个 `Promise`，`await`\
    \ 的工作方式与其他异步函数一样。\n\n类似地，另外两个例子也很容易转换为 Promise：\n\n```\nawait new Promise((res)\
    \ => {\n  gapi.load(\"client:auth2\", res);\n});\n// auth2 客户端已加载\n```\n\n```\n\
    const button = document.querySelector(\"#button\");\n\nawait new Promise((res)\
    \ => {\n  button.addEventListener(\"click\", res, {once: true});\n});\n// 按钮被点击\n\
    ```\n\n使用 `Promises` 代替回调，可以轻松地使用 `await` 来编排一系列异步操作。例如，在按钮被点击时加载 auth2 客户端：\n\
    \n```\nawait new Promise((res) => {\n  button.addEventListener(\"click\", res,\
    \ {once: true});\n});\n// 按钮被点击\nawait new Promise((res) => {\n  gapi.load(\"\
    client:auth2\", res);\n});\n// gapi 库已加载\n```\n\n在回调与 `Promises` 之间转换\n\n你将在 在\
    \ `Promises` 和回调之间转换 章节中了解更多。\n\n### `Promise` 状态\n\n由于 `Promise` 持有未来的值，它可以处于几种状态。\n\
    \n当你创建一个 `Promise` 时，它最初处于 **Pending**（待定）状态。这是在 resolve/reject 回调被调用或异步函数完成之前的状态。\n\
    \n当有值时，`Promise` 转换为 **Resolved**（已解决）状态。此时 `await` 解除阻塞，异步函数继续运行。\n\n如果出现错误，`Promise`\
    \ 进入 **Rejected**（已拒绝）状态。此时 `await` 抛出异常。\n\nResolved 和 Rejected 状态统称为 **Fulfilled**（已完成）或\
    \ **Settled**（已敲定）。当 `Promise` 处于此状态时，它已经完成并产生了值或错误。\n\n![](img/c7bf165c038961ff3793fb930dc7f0f0e4deca1a722e24292ec3555a5c09e142.png)\n\
    \n`Promise` 状态\n\n### 结果值\n\n上面的例子都使用了 `Promise` 的 `res` 函数来通知异步操作已就绪，但没有产生任何值。要同时返回一个值，**将其传递给\
    \ `res` 调用**。\n\n```\nconst value = new Promise((res) => {\n  res(5);\n});\n//\
    \ 5\n```\n\n一个更复杂的例子：下面的 `Promise` 显示 Google Drive 文件选择器，并在选择文件后解析。这看起来复杂，但核心思想是一样的：创建一个新的\
    \ `Promise`，然后在结果就绪时调用 `res` 方法。\n\n```\nconst folder = await new Promise((res)\
    \ => {\n  const picker = new google.picker.PickerBuilder()\n    // ... 配置 ...\n\
    \    .setCallback((data) => {\n      if (/* 选中的操作 */) {\n        // 选中了一个文件夹\n\
    \        const selectedFolder = ...\n\n        // 解析 Promise\n        res(selectedFolder);\n\
    \      }\n    })\n    .build();\n  picker.setVisible(true);\n});\n// folder 是选中的文件夹\n\
    ```\n\n注意\n\n通过 `res()` 调用只能返回一个值。你将在 返回多个值 章节中了解返回多个值的方法。\n\n## 错误处理\n\n到目前为止，我们讨论的都是异步函数一切顺利的情况。没有数据库超时，没有验证错误，没有突然的网络丢失。但这些情况确实会发生，所以我们也需要为此做好准备。如果没有正确的错误传播，失败会导致\
    \ `Promises` 和异步函数停滞，永远无法继续。\n\n对于同步函数，当某些东西 `throw` 错误时，错误会发生，并且会向上冒泡，直到遇到 `try-catch`：\n\
    \n```\nconst fn = () => {\n  throw new Error(\"发生了糟糕的事情\");\n}\n\ntry {\n  fn();\n\
    }catch(e) {\n  // 处理错误\n}\n```\n\n异步函数的工作方式类似，当抛出错误时，它会向上冒泡直到遇到 `try-catch`。当出现异步错误时（我们将在下一章探讨它们的工作原理），你可以使用同样熟悉的结构来处理：\n\
    \n```\nconst fn = async () => {\n  throw new Error(\"发生了糟糕的事情\");\n}\n\ntry {\n\
    \  await fn();\n}catch(e) {\n  // 处理错误\n}\n```\n\n注意\n\n错误是在 `await` 期间抛出的，而不是在函数调用时：\n\
    \n```\nconst asyncFn = async () => {\n  throw new Error(\"发生了糟糕的事情\");\n}\n\n\
    const res = asyncFn(); // 这里没有错误\n\ntry {\n  await res; // 错误\n}catch(e) {\n \
    \ // 处理错误\n}\n```\n\n### `Promise` 构造函数中的错误回调\n\n但是当你使用 `Promise` 构造函数时，需要注意传播错误。\n\
    \n让我们重新审视之前的例子！`gapi.load` 加载一个可用于 Google 服务的客户端库，它需要一个回调来通知加载完成。使用 `Promise`\
    \ 构造函数很容易将其转换为 `Promise`：\n\n```\nawait new Promise((res) => {\n  gapi.load(\"\
    client:auth2\", res);\n});\n// auth2 已加载\n```\n\n但是当出现错误时会发生什么？也许网络断开，客户端库无法加载。在这种情况下，回调函数永远不会被调用，`Promise`\
    \ 也永远不会完成。等待它的 `await` 将永远等待下去。\n\n```\nawait new Promise((res) => {\n  gapi.load(\"\
    client:auth2\", res); // 错误\n});\n// 永远不会发生\n```\n\n要实现正确的错误传播，我们需要两件事。首先，一种向\
    \ `Promise` 发出错误信号的方法；其次，一种检测该错误的方法。\n\n#### 拒绝一个 `Promise`\n\n`Promise` 构造函数提供了第二个回调，可以发出错误信号：\n\
    \n```\nnew Promise((res, rej) => {\n  // 一切正常时调用 res()\n  // 出现错误时调用 rej()\n});\n\
    ```\n\n当调用 `rej` 函数时，它的行为类似于异步函数抛出错误：\n\n```\ntry {\n  await new Promise((res,\
    \ rej) => {\n    rej(); // 发出错误信号\n  });\n}catch(e) {\n  // 处理错误\n}\n```\n\n与\
    \ `res` 函数类似，你可以传递错误对象，该对象将成为拒绝原因：\n\n```\ntry {\n  await new Promise((res, rej)\
    \ => {\n    rej(new Error(\"发生了糟糕的事情\"));\n  });\n}catch(e) {\n  console.log(e.message)\
    \ // 发生了糟糕的事情\n}\n```\n\n什么是错误\n\n什么构成错误取决于具体实现。例如，`fetch` 在无法建立连接时会抛出错误，但当响应码不在\
    \ 2xx 范围内时则不会。\n\n```\ntry {\n  const response = await fetch(options);\n  if (response.ok)\
    \ {\n    // 请求成功\n  }else {\n    // 错误响应\n  }\n} catch (e) {\n  // 发送请求时出错\n}\n\
    ```\n\n构造函数中抛出的异常也会拒绝 `Promise`：\n\n```\nnew Promise(() => {\n  throw Error(\"\
    发生了糟糕的事情\");\n});\n// 被拒绝并带有错误\n```\n\n"
- fmt: "\nThis behavior makes most programming errors to propagate correctly. But\
    \ unlike the `reject` callback, this only handles synchronous errors.\n\n####\
    \ Detecting errors\n\nNow that we have a way to signal an error to the `Promise`,\
    \ let's see how to adapt the `gapi` example to take advantage of this construct!\n\
    \nIn this specific case, the callback can also be an [object](https://github.com/google/google-api-javascript-client/blob/master/docs/reference.md#----gapiloadlibraries-callbackorconfig------)\
    \ with `callback` and `onerror` handlers:\n\n```\nawait new Promise((res, rej)\
    \ => {\n  gapi.load(\"client:auth2\", {callback: res, onerror: rej});\n});\n```\n\
    \nNow if there is an error during the load process the `rej` function is called\
    \ and the `await` throws an error.\n\nNote\n\nHow the underlying function signals\
    \ results and errors can vary from library-to-library. You'll learn more about\
    \ it in the [Callback styles](#chapter5.xhtml_defined-callback-styles) chapter.\n\
    \n### Error propagation in Promise chains\n\nWhile async functions use the same\
    \ `try..catch` structure as normal functions, `Promise` chains work differently.\
    \ The `then` callback gets an additional callback, one that is called when a previous\
    \ `Promise` is rejected:\n\n```\nconst rejectedPromise = new Promise((res, rej)\
    \ => {\n  rej(new Error(\"rejected\"));\n});\n\nrejectedPromise.then(undefined,\
    \ (error) => {\n  // error = \"rejected\"\n  // handle error\n});\n```\n\nErrors\
    \ in `Promise` chains move to the next error handler, skipping all previous steps.\
    \ This makes it easy to collect errors from multiple steps and handle them in\
    \ a single place:\n\n```\ngetUser()\n  .then(getPermissionsForUser)\n  .then(checkPermission)\n\
    \  .then((allowed) => {\n    // handle allowed or not\n  }).then(undefined, (error)\
    \ => {\n    // there was an error in one of the previous steps\n  });\n```\n\n\
    A useful way to think about error propagation through the chain is to think about\
    \ it as 2 parallel railway tracks with stations. A station is a `then` callback,\
    \ and its result determines which track the train continues.\n\nTip\n\nInstead\
    \ of `.then(undefined, (error) => {...})`, you can use the shorthand `.catch((error)\
    \ => {...})`.\n\n![](1570b41fac08486b3d036c0da65981b6f9791bf94e4597cbb52302155f72e9e3.png)\n\
    \nError handler in a `Promise` chain\n\nThis way of thinking allows untangling\
    \ way more complicated chains. Let's dissect what's happening here:\n\n```\ngetPromise()\n\
    \  .then(handler1)\n  .then(handler2, catch1)\n  .then(handler3)\n  .then(undefined,\
    \ catch2)\n  .then(handler4)\n```\n\nThis yields the following diagram:\n\n![](c354aee4c19744ca4aa52500db8678dff726cf80330cb30356faa176a2fc1d0c.png)\n\
    \nDiagram of the promise chain\n\nIt looks complicated, but there are simple rules:\n\
    \n*   Each function, no matter which track it is, can move the execution to the\
    \ OK as well as the error tracks\n\n*   When a handler is missing (the diamonds\
    \ in the above diagram) the execution stays on the same track\n\nFor example,\
    \ if `getPromise()` is rejected, the next function will be `catch1`. If it resolves,\
    \ then `handler3` is the next one. If it resolves, `handler4` is called, and it\
    \ will be the result of the whole chain, no matter if it resolves or rejects.\n\
    \nError handlers\n\nNotice this line:\n\n```\n.then(handler2, catch1)\n```\n\n\
    A common source of errors is that if there is an error in `handler2` then `catch1`\
    \ **won't run**. Each error handler handles errors from *previous steps*.\n\n\
    # Parallel and sequential processing\n\nWhen you use `await` in an async function,\
    \ it stops the execution until the `Promise` is resolved. This makes each line\
    \ wait for the previous, which yields a code that looks almost like a synchronous\
    \ one:\n\n```\nawait s3.copyObject({/*...*/}).promise();\nawait s3.deleteObject({/*...*/}).promise();\n\
    ```\n\nThe above code copies an object, then it deletes one. In case you wanted\
    \ to *move* the object, it is the desirable chain of events as you want the copy\
    \ operation to finish before deleting the original.\n\n## Parallel processing\
    \ with Promise.all\n\nBut what if there is an unrelated call, such as an update\
    \ to a database?\n\n```\nawait s3.copyObject({/*...*/}).promise();\nawait s3.deleteObject({/*...*/}).promise();\n\
    \nawait dynamodb.updateItem({/*...*/}).promise();\n```\n\nWhile the `dynamodb.updateItem`\
    \ has nothing to do with the S3 object, it still waits for the move operation\
    \ (copy + delete) to finish. This makes the overall process longer than necessary.\n\
    \n![](3e190789d246b3a99678b872e19dca5e25722f9e39f7b5d615d91a516632adc7.png)\n\n\
    Serial execution\n\nIn this case, a better implementation is to run the two parts\
    \ in parallel. To make it easier to see, let's group the two operations with async\
    \ functions:\n\n```\nconst moveObject = async () => {\n  await s3.copyObject({/*...*/}).promise();\n\
    \  await s3.deleteObject({/*...*/}).promise();\n};\n\nconst updateDatabase = async\
    \ () => {\n  await dynamodb.updateItem({/*...*/}).promise();\n};\n```\n\nJavascript\
    \ has a built-in convenience method to run things in parallel. This is the `Promise.all`,\
    \ that gets a *collection of Promises* and returns a `Promise` with all the results.\
    \ Whenever you want to run multiple things concurrently, this is the tool to use.\n\
    \nTo use it to run the two operations in parallel, use:\n\n```\nawait Promise.all([moveObject(),\
    \ updateDatabase()]);\n```\n\n![](327e086a88b6fea910123a1487b792143e5f047bb4e62f2c1be1ef125182b2c7.png)\n\
    \nParallel execution\n\nThere are multiple things to notice here. First, `Promise.all`\
    \ gets *Promises*. Remember that *calling* an async function returns a `Promise`,\
    \ so don't forget to call the functions you want to run.\n\nSecond, it needs a\
    \ *collection of Promises*, which is usually an array. Notice the `([ ... ])`\
    \ structure for the call to `Promise.all`.\n\nAnd third, `await` is only used\
    \ for the `Promise.all` and not for the individual async function calls. This\
    \ is because you want to wait for *all of them* to finish before moving on.\n\n\
    Tip\n\n`await` stops the async function execution. In the case of `Promise.all`\
    \ you want to stop only once, to wait for all the input Promises to settle. That's\
    \ why you only need one `await`.\n\n### Results\n\nIn the above example none of\
    \ the operations returned a value. Let's see how to handle values returned from\
    \ `Promise.all`!\n\nFor the sake of illustration, let's say there are two unrelated\
    \ piece of data an async function needs: a user object and a list of groups. Both\
    \ of these are stored in a database and thus they are available via async functions.\n\
    \n```\nconst getUser = async () => {\n  // gets the user object\n  return user;\n\
    }\nconst getGroups = async () => {\n  // gets the groups\n  return groups;\n}\n\
    ```\n\nNotice in this example that the `getGroups` function does not need the\
    \ user object. This makes them able to run in parallel.\n\nA serial implementation\
    \ calls these functions separately and stores their results in variables:\n\n\
    ```\nconst user = await getUser();\nconst groups = await getGroups();\n\n// user\
    \ and groups are available\n```\n\nThere are two `await`s here, so the function\
    \ will stop twice. No matter which you put first, the total execution time will\
    \ be the sum of the calls. As we've seen previously, the `Promise.all` runs the\
    \ Promises returned by the async function in parallel. It also returns a `Promise`\
    \ with an *array* of the results.\n\nTo run the two calls in parallel and extract\
    \ the results, use the array destructuring operator:\n\n```\nconst [user, groups]\
    \ = await Promise.all([\n  getUser(),\n  getGroups(),\n]);\n\n// user and groups\
    \ are available\n```\n\n### Errors in Promise.all\n\nWhen *any* of the input Promises\
    \ are rejected then the resulting `Promise` will be rejected as well. This behavior\
    \ allows errors to propagate seamlessly.\n\n```\ntry {\n  const [user, groups]\
    \ = await Promise.all([\n    getUser(), // getUser returns a value\n    getGroups(),\
    \ // getGroups throws an exception\n  ]);\n} catch(e) {\n  // handle error thrown\
    \ by either of calls\n}\n```\n"
