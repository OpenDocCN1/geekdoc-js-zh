  trans: "\n\n## 异步 reduce 函数\n\n借助 `async (memo, e) => await memo` 的结构，`reduce` 可以处理任何异步函数，并且可以被\
    \ `await`。\n\n### 时序\n\n在 `reduce` 中，并发有一个有趣的特性。在同步版本中，元素会逐个处理，这并不奇怪，因为它们依赖于*前一个*结果。但当异步\
    \ `reduce` 运行时，所有迭代函数会并行启动，并且仅在需要时才等待前一个结果（`await memo`）。\n\n#### 后置 await memo\n\
    \n在上面的例子中，所有的 `sleep` 是并行发生的，因为让函数等待前一个完成的 `await memo` 出现在后面。\n\n```javascript\n\
    const arr = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\nconst asyncRes\
    \ = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n  return (await\
    \ memo) + e;\n}, 0);\n\nconsole.log(`耗时 ${new Date().getTime() - startTime} 毫秒`);\n\
    // 耗时 11-13 毫秒\n```\n\n![](img/0b9006991849f3db718eda88ce54dd1256aac7028395d38d486e40e017b9c20c.png)\n\
    \n后置 \"await memo\" 的异步 reduce\n\n#### 前置 await memo\n\n但当 `await memo` 放在前面时，函数会顺序执行：\n\
    \n```javascript\nconst arr = [1, 2, 3];\n\nconst startTime = new Date().getTime();\n\
    \nconst asyncRes = await arr.reduce(async (memo, e) => {\n  await memo;\n  await\
    \ sleep(10);\n  return (await memo) + e;\n}, 0);\n\nconsole.log(`耗时 ${new Date().getTime()\
    \ - startTime} 毫秒`);\n// 耗时 36-38 毫秒\n```\n\n![](img/b5be8ee75623f698e0f641badb7276bd5dcf61c7743e9b3960452f00be724050.png)\n\
    \n前置 \"await memo\" 的异步 reduce\n\n这种行为通常不是问题，因为它自然意味着所有不依赖前一个结果的部分会立即计算，只有依赖的部分才会等待前一个值。\n\
    \n#### 当并行性很重要时\n\n但在某些情况下，提前做一些事情可能是不可行的。\n\n例如，我有一段代码，它打印不同的 PDF 并使用 [pdf-lib](https://www.npmjs.com/package/pdf-lib)\
    \ 库将它们合并成一个文件。\n\n以下实现并行运行资源密集型的 `printPDF` 函数：\n\n```javascript\nconst result\
    \ = await printingPages.reduce(async (memo, page) => {\n  const pdf = await PDFDocument.load(await\
    \ printPDF(page));\n\n  const pdfDoc = await memo;\n\n  (await pdfDoc.copyPages(pdf,\
    \ pdf.getPageIndices()))\n    .forEach((page) => pdfDoc.addPage(page));\n\n  return\
    \ pdfDoc;\n\n}, PDFDocument.create());\n```\n\n我注意到，当需要打印很多页面时，它会消耗过多内存并拖慢整体进程。\n\
    \n一个简单的改动让 `printPDF` 调用等待前一个完成：\n\n```javascript\nconst result = await printingPages.reduce(async\
    \ (memo, page) => {\n  const pdfDoc = await memo;\n\n  const pdf = await PDFDocument.load(await\
    \ printPDF(page));\n\n  (await pdfDoc.copyPages(pdf, pdf.getPageIndices()))\n\
    \    .forEach((page) => pdfDoc.addPage(page));\n\n  return pdfDoc;\n\n}, PDFDocument.create());\n\
    ```\n\n## 异步函数与 map\n\n`map` 是最简单、最常用的集合函数。它通过迭代函数处理每个元素，并返回一个包含结果的数组。\n\n同步版本为每个元素加一：\n\
    \n```javascript\nconst arr = [1, 2, 3];\n\nconst syncRes = arr.map((i) => {\n\
    \  return i + 1;\n});\n\nconsole.log(syncRes);\n// 2,3,4\n```\n\n异步版本需要做两件事。首先，它需要将**每个元素映射为一个包含新值的\
    \ *Promise***，这就是在函数前加上 `async` 所做的事情。\n\n其次，它需要**等待所有 Promise**，然后**将结果收集到一个数组**中。幸运的是，内置的\
    \ `Promise.all` 正是第二步所需要的。\n\n这使得异步 `map` 的通用模式为 `Promise.all(arr.map(async (...)\
    \ => ...))`。\n\n与同步版本功能相同的异步实现：\n\n```javascript\nconst arr = [1, 2, 3];\n\nconst\
    \ asyncRes = await Promise.all(arr.map(async (i) => {\n  await sleep(10);\n  return\
    \ i + 1;\n}));\n\nconsole.log(asyncRes);\n// 2,3,4\n```\n\n![](img/4882ecc2dd5773605f888af8d04d80ecb36a75c646ef743a8e2f5effef00a0a0.png)\n\
    \n异步 map\n\n### 并发\n\n上述实现会并行地对数组中的每个元素运行迭代函数。这通常没问题，但在某些情况下可能会消耗过多资源。例如，当异步函数调用\
    \ API 或消耗过多 RAM 时，同时运行太多可能不可行。\n\n虽然编写异步 `map` 很容易，但添加并发控制则更复杂。在接下来的几个例子中，我们将探讨不同的解决方案。\n\
    \n#### 批量处理\n\n最简单的方法是将元素分组，然后逐个处理这些组。这样你可以控制同时运行的最大并行任务数。但由于一组必须在前一组完成后才能开始，每组中*最慢*的元素会成为限制因素。\n\
    \n![](img/e1c1bb2cf8fe927cceb829b06b7bcf4d193ae1459d48dc895ae7f708be81dd0c.png)\n\
    \n分组映射\n\n为了创建分组，下面的例子使用了 [Underscore.js](https://underscorejs.org/#groupBy) 中的\
    \ `groupBy` 实现。许多库都提供了该实现，并且大多可以互换。Lodash 是个例外，因为它的 [groupBy 不传递元素的索引](https://lodash.com/docs/#groupBy)。\n\
    \n如果你不熟悉 `groupBy`，它会通过迭代函数处理每个元素，并返回一个对象，其中键是结果，值是由产生该结果的元素组成的列表。\n\n要创建最多包含\
    \ `n` 个元素的分组，可以使用迭代函数 `Math.floor(i / n)`，其中 `i` 是元素的*索引*。例如，大小为 3 的分组会将元素映射如下：\n\
    \n```\n0 => 0\n1 => 0\n2 => 0\n3 => 1\n4 => 1\n5 => 1\n6 => 2\n...\n```\n\n在 JavaScript\
    \ 中：\n\n```javascript\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconsole.log(\n\
    \  _.groupBy(arr, (_v, i) => Math.floor(i / 3))\n);\n// {\n//     0: [30, 10,\
    \ 20],\n//     1: [20, 15, 20],\n//     2: [10]\n// }\n```\n\n最后一组可能比其他组小，但所有组都保证不超过最大分组大小。\n\
    \n要映射一个组，通常使用 `Promise.all(group.map(...))` 结构即可。\n\n要顺序映射这些组，我们需要一个 reduce 来将前一个结果（`memo`）与当前组的结果拼接起来：\n\
    \n```javascript\nreturn Object.values(groups)\n  .reduce(async (memo, group) =>\
    \ [\n    ...(await memo),\n    ...(await Promise.all(group.map(iteratee)))\n \
    \ ], []);\n```\n\n这个实现基于以下事实：`await memo` 会等待前一个结果完成，然后才继续执行下一行。\n\n实现批处理的完整代码：\n\
    \n```javascript\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\nconst mapInGroups\
    \ = (arr, iteratee, groupSize) => {\n  const groups = _.groupBy(arr, (_v, i) =>\n\
    \    Math.floor(i / groupSize));\n\n  return Object.values(groups)\n    .reduce(async\
    \ (memo, group) => [\n      ...(await memo),\n      ...(await Promise.all(group.map(iteratee)))\n\
    \    ], []);\n};\n\nconst res = await mapInGroups(arr, async (v) => {\n  console.log(`开始\
    \ ${v}`);\n  await sleep(v);\n  console.log(`完成 ${v}`);\n  return v + 1;\n}, 3);\n\
    \n// -- 第一批 --\n// 开始 30\n// 开始 10\n// 开始 20\n// 完成 10\n// 完成 20\n// 完成 30\n//\
    \ -- 第二批 --\n// 开始 20\n// 开始 15\n// 开始 20\n// 完成 15\n// 完成 20\n// 完成 20\n// --\
    \ 第三批 --\n// 开始 10\n// 完成 10\n\nconsole.log(res);\n// 31,11,21,21,16,21,11\n```\n\
    \n#### 并行处理\n\n另一种并发控制是同时运行最多 `n` 个任务，并在一个任务完成后立即启动新任务。\n\n![](img/902c1166225283a3fdcb8dc17bac41ee0ca65689964e8747ea3f7485578e1209.png)\n\
    \n受控并发\n\n我无法为此想出一个简单的实现，但幸运的是，Bluebird 库[直接提供了这个功能](http://bluebirdjs.com/docs/api/promise.map.html#map-option-concurrency)。这使得它非常简单：只需导入库并使用支持\
    \ `concurrency` 选项的 `Promise.map` 函数即可。\n\n"
- fmt: "\nIn the example below the `concurrency` is limited to `2`, which means 2\
    \ tasks are started immediately, then whenever one is finished, a new one is started\
    \ until there are none left:\n\n```\nconst arr = [30, 10, 20, 20, 15, 20, 10];\n\
    \n// Bluebird promise\nconst res = await Promise.map(arr, async (v) => {\n  console.log(`S\
    \ ${v}`)\n  await sleep(v);\n  console.log(`F ${v}`);\n  return v + 1;\n}, {concurrency:\
    \ 2});\n\n// S 30\n// S 10\n// F 10\n// S 10\n// F 30\n// S 20\n// F 10\n// S\
    \ 15\n// F 20\n// S 20\n// F 15\n// S 20\n// F 20\n// F 20\n\nconsole.log(res);\n\
    // 31,11,21,21,16,21,11\n```\n\n#### Sequential processing\n\nSometimes any concurrency\
    \ is too much and the elements should be processed one after the other.\n\n![](26e09fdca23842d354c8c0658109bdfdf041ea7696549b1aa4d4636fb2998b27.png)\n\
    \nMapping sequentially\n\nA trivial implementation is to use Bluebird's `Promise`\
    \ with a `concurrency` of 1. But for this case, it does not warrant including\
    \ a library as a simple `reduce` would do the job:\n\n```\nconst arr = [1, 2,\
    \ 3];\n\nconst res = await arr.reduce(async (memo, v) => {\n  const results =\
    \ await memo;\n  console.log(`S ${v}`)\n  await sleep(10);\n  console.log(`F ${v}`);\n\
    \  return [...results, v + 1];\n}, []);\n\n// S 1\n// F 1\n// S 2\n// F 2\n//\
    \ S 3\n// F 3\n\nconsole.log(res);\n// 2,3,4\n```\n\nMake sure to `await` the\
    \ memo before `await`-ing anything else, as without that it will still run concurrently!\n\
    \n## Async functions with `forEach`\n\nThe `forEach` function is similar to the\
    \ `map`, but instead of transforming the values and using the results, it runs\
    \ the function for each element and discards the result. Effectively, the important\
    \ part is the *side effects* of calling the function.\n\nFor example, printing\
    \ each element to the console, synchronously:\n\n```\nconst arr = [1, 2, 3];\n\
    \narr.forEach((i) => {\n  console.log(i);\n});\n\n// 1\n// 2\n// 3\n\nconsole.log(\"\
    Finished sync\");\n// Finished sync\n```\n\nAs the result is not important, using\
    \ an async function as the iteratee would work:\n\n```\nconst arr = [1, 2, 3];\n\
    \narr.forEach(async (i) => {\n  // each element takes a different amount of time\
    \ to complete\n  await sleep(10 - i);\n  console.log(i);\n});\n\nconsole.log(\"\
    Finished async\");\n// Finished async\n\n// 3\n// 2\n// 1\n```\n\n![](44bde7cbd8fdafdc2c2494ae8f049fe77ae0bf57dd112b78b0ac05dec2e53192.png)\n\
    \nAsync forEach\n\n### Controlling the timing\n\n#### Waiting for finish\n\nBut,\
    \ not unsurprisingly, the function is called **asynchronously**, and the program\
    \ execution goes past the call. This is an important difference from the sync\
    \ version, as, by the time the next line is executed, the synchronous `forEach`\
    \ is already done, while the async version is not. That's why the \"Finished async\"\
    \ log appears *before* the elements.\n\nTo wait for all the function calls to\
    \ finish before moving on, use a `map` with a `Promise.all` and discard the results:\n\
    \n```\nconst arr = [1, 2, 3];\n\nawait Promise.all(arr.map(async (i) => {\n  await\
    \ sleep(10 - i);\n  console.log(i);\n}));\n\n// 3\n// 2\n// 1\n\nconsole.log(\"\
    Finished async\");\n// Finished async\n```\n\n![](4578a72f73ebe729751dc8a2e7982f5f5788c083d678588f96ebf1ca1642dd40.png)\n\
    \nAsync forEach, waiting for the results\n\nWith this change, the \"Finished async\"\
    \ comes last.\n\n#### Sequential processing\n\nBut notice that the iteratee functions\
    \ are called in parallel. To faithfully follow the synchronous `forEach`, use\
    \ a `reduce` with an `await memo` first:\n\n```\nconst arr = [1, 2, 3];\n\nawait\
    \ arr.reduce(async (memo, i) => {\n  await memo;\n  await sleep(10 - i);\n  console.log(i);\n\
    }, undefined);\n\n// 1\n// 2\n// 3\n\nconsole.log(\"Finished async\");\n// Finished\
    \ async\n```\n\n![](66b6c76bc716c0b5c0aa317848a0a8ee3bd423d67071bb936461d21f0a1e35ea.png)\n\
    \nAsync forEach, sequential processing\n\nThis way the elements are processed\
    \ in-order, one after the other, and the program execution waits for the whole\
    \ array to finish before moving on.\n\n## Async functions with `filter`\n\nThe\
    \ `filter` function keeps only the elements that pass a condition. It gets a function,\
    \ this time it's called a *predicate*, and this function returns true/false (truthy\
    \ and falsy, to be more precise) values. The resulting collection only contains\
    \ the elements where the predicate returned true.\n\n```\nconst arr = [1, 2, 3,\
    \ 4, 5];\n\nconst syncRes = arr.filter((i) => {\n  return i % 2 === 0;\n});\n\n\
    console.log(syncRes);\n// 2,4\n```\n\n### Async filter with `map`\n\nThe async\
    \ version is a bit more complicated this time and it works in two phases. The\
    \ first one maps the array through the predicate function asynchronously, producing\
    \ true/false values. Then the second step is a synchronous `filter` that uses\
    \ the results from the first step.\n\n![](ea88e1aac9cb48ef0755b091aa42472171622d59e3968cfa8bf14292042a7823.png)\n\
    \nAsync filter\n\n```\nconst arr = [1, 2, 3, 4, 5];\n\nconst asyncFilter = async\
    \ (arr, predicate) => {\n  const results = await Promise.all(arr.map(predicate));\n\
    \n  return arr.filter((_v, index) => results[index]);\n}\n\nconst asyncRes = await\
    \ asyncFilter(arr, async (i) => {\n  await sleep(10);\n  return i % 2 === 0;\n\
    });\n\nconsole.log(asyncRes);\n// 2,4\n```\n\nOr a one-liner implementation:\n\
    \n```\nconst asyncFilter = async (arr, predicate) =>\n  Promise.all(arr.map(predicate))\n\
    \  .then((results) => arr.filter((_v, index) => results[index]));\n```\n\n![](98752878cc289cb4a5f69120e50b00611fc444ce3124c0ed4c27ec622201b4b6.png)\n\
    \nAsync filter with map\n\n#### Concurrency\n\nThe above implementation runs all\
    \ of the predicate functions concurrently. This is usually fine, but, as with\
    \ all other functions, it might strain some resources too hard. Fortunately, since\
    \ the above implementation relies on `map`, the same concurrency controls can\
    \ be used.\n\n### Async filter with `reduce`\n\nInstead of using an async `map`\
    \ with a sync `filter`, an async `reduce` could also do the job. Since it's just\
    \ one function, the structure is even easier though it does not provide the same\
    \ level of control.\n\nFirst, start with an empty array (`[]`). Then run the next\
    \ element through the predicate function and if it passes, append it to the array.\
    \ If not, skip it.\n\n![](e378a1cbb53cf39e1f6f2e25de2cb568d2882c6080e3eb041f6caf103f70efa1.png)\n\
    \nAsync filter with reduce\n\n```\n// concurrently\nconst asyncFilter = async\
    \ (arr, predicate) => \n  arr.reduce(async (memo, e) =>\n    await predicate(e)\
    \ ? [...await memo, e] : memo\n  , []);\n```\n\n![](be648b1a6427cd57ea903ec9ddadf2fdd75c4b9f486bfb2a19bd42220a411f16.png)\n\
    \nAsync filter with reduce\n\nNotice that the `await predicate(e)` comes *before*\
    \ the `await memo`, which means those will be called in parallel.\n\n#### Sequential\
    \ processing\n\nTo wait for a predicate function to finish before calling the\
    \ next one, change the order of the `await`s:\n\n```\n// sequentially\nconst asyncFilter\
    \ = async (arr, predicate) => \n  arr.reduce(async (memo, e) => \n    [...await\
    \ memo, ...await predicate(e) ? [e] : []]\n  , []);\n```\n\nThis implementation\
    \ waits for the previous element then conditionally append an element depending\
    \ on the result of the predicate (`...[e]` or `...[]`).\n\n![](9c63ff63c95c8f8ddc4bed111d964e35cf518c153bb4db4302fbd0a18f84a5e0.png)\n\
    \nAsync filter with reduce running sequentially\n\n## Async functions with `some`/`every`\n\
    \nThese functions get an iteratee function, just like the `filter`, but they return\
    \ a single true/false, depending on whether the predicate returned a specific\
    \ value. In the case of the `some`, if *any* of the predicates returned true,\
    \ the result will be true. For the `every` function, if any returned false, the\
    \ result will be false.\n\n```\nconst arr = [1, 2, 3];\n\nconst someRes = arr.some((i)\
    \ => {\n  return i % 2 === 0;\n});\n\nconsole.log(someRes);\n// true\n\nconst\
    \ everyRes = arr.every((i) => {\n  return i < 2;\n});\n\nconsole.log(everyRes);\n\
    // false\n```\n\n### Using an async `filter`\n\nConsidering only the result, these\
    \ functions can be emulated with an async `filter`, which is already covered in\
    \ a previous article how to convert to async.\n"
