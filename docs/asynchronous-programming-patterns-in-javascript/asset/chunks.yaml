    \n```\ngetUser()\n  .then(getPermissionsForUser)\n  .then(checkPermission)\n \
    \ .then((allowed) => {\n    // 处理允许或不允许的情况\n  });\n```\n\n这几乎是一种扁平结构，我们将在链式 Promise\
    \ 章节中详细说明，但最后仍然需要一个回调。`await` 关键字消除了这个需求。\n\n为了在不失去 Promise 优势的情况下解决这个问题，异步函数可以使用\
    \ `await` 关键字。它会**暂停函数直到 Promise 就绪**，并返回结果值。\n\n```\nconst asyncFn = async ()\
    \ => {\n  return 5;\n}\n\nawait asyncFn();\n// 5\n```\n\n上面使用回调的代码可以用 `await`\
    \ 替代，从而形成更熟悉的结构：\n\n```\nconst user = await getUser();\nconst permissions = await\
    \ getPermissions();\nconst hasAccess = checkPermissions(user, permissions);\n\
    if (hasAccess) {\n  // 处理请求\n}\n```\n\n`await` 关键字**等待异步结果**，使代码看起来几乎像同步代码，但拥有\
    \ Promise 的所有优点。\n\n注意，`await` 会暂停函数的执行，这看起来像是在 JavaScript 中不可能发生的事情。但在底层，它仍然使用\
    \ `then()` 回调，并且由于异步函数返回 Promise，它们不需要立即提供结果。这使得在不改变语言工作方式的情况下暂停函数成为可能。\n\n###\
    \ 异步函数示例\n\n带有 `await` 的异步函数非常强大。它们使复杂且异步的工作流程看起来简单而熟悉，隐藏了结果稍后到达的所有复杂性。\n\n浏览器自动化就是一个典型的例子。[Puppeteer](https://www.npmjs.com/package/puppeteer)\
    \ 项目允许启动 Chromium 并通过 DevTools 协议驱动它。\n\n截取网页截图只需几行代码：\n\n```\nconst browser =\
    \ await puppeteer.launch(options);\nconst page = await browser.newPage();\nconst\
    \ response = await page.goto(url);\nconst img = await page.screenshot();\nawait\
    \ browser.close();\n```\n\n这段代码隐藏了大量复杂性。它启动一个浏览器，然后向其发送命令，所有操作都是异步的，因为浏览器是一个独立的进程。但最终结果是一个包含截图的图像缓冲区。\n\
    \n注意\n\n如果执行过程中出现错误，上述代码会让浏览器保持运行。你将在异步释放器模式章节中学习如何处理资源关闭。\n\n另一个例子是与数据库交互。远程服务总是需要网络调用，这意味着异步结果。\n\
    \n以下代码用于 AWS Lambda 函数，更新用户的头像图片：\n\n```\n// 将对象移出待处理目录\nawait s3.copyObject({/*...*/}).promise();\n\
    await s3.deleteObject({/*...*/}).promise();\n\n// 获取当前头像图片\nconst oldAvatar =\
    \ (await dynamodb.getItem({/*...*/}).promise())\n  .Item.Avatar.S;\n\n// 更新用户头像\n\
    await dynamodb.updateItem({/*...*/}).promise();\n// 删除旧图片\nawait s3.deleteObject({/*...*/}).promise();\n\
    \nreturn {\n  statusCode: 200,\n};\n```\n\n它调用 AWS S3 服务来移动对象，并调用 DynamoDB 数据库来读取和修改数据。两者都是远程服务，但所有复杂性都隐藏在\
    \ `await` 后面。\n\n总结\n\n`await` 关键字会暂停函数，直到未来的结果可用。\n\n### 链式 Promise\n\n我们已经看到，当异步函数返回一个值时，它会被包装在\
    \ Promise 中，而 `await` 关键字会从中提取值。但是当异步函数返回一个 Promise 时会发生什么？这是否意味着你需要使用两个 `await`？\n\
    \n考虑以下代码：\n\n```\nconst f1 = async () => {\n  return 2;\n};\n\nconst f2 = async\
    \ () => {\n  return f1();\n}\n\nconst result = await f2();\n```\n\n严格遵循前面章节描述的过程，`f1()`\
    \ 返回 `Promise<2>`，而 `f2()` 返回 `Promise<Promise<2>>`，因此 `result` 的值将是 `Promise<2>`\
    \ 而不是 `2`。\n\n但实际情况并非如此。当异步函数返回一个 Promise 时，它不会添加另一层包装。无论它返回一个值还是一个 Promise，它始终是一个\
    \ Promise，并且始终解析为最终值，而不是另一个 Promise。\n\n这对于 Promise 链也是如此。`.then()` 回调也会被包装在 Promise\
    \ 中（如果还不是的话），因此你可以轻松地链式调用它们：\n\n```\ngetUser()\n  .then(async function getPermissionsForUser(user)\
    \ {\n    const permissions = await // ...;\n    return permissions;\n  })\n  .then(async\
    \ function checkPermission(permissions) {\n    const allowed = await // ...;\n\
    \    return allowed;\n  })\n  .then((allowed) => {\n    // 处理允许或不允许的情况\n  });\n\
    ```\n\n`getUser` 函数返回 `Promise<User>`，然后 `getPermissionsForUser` 获取用户对象（解析后的值），然后返回权限集。下一个调用\
    \ `checkPermission` 获取权限，依此类推。\n\n一个有用的类比是数组的 `flatMap` 函数。无论它返回一个值还是一个数组，最终结果始终是一个包含值的数组。它是\
    \ `map` 后跟 `flat`。\n\n```\n[1].flatMap((a) => 5) // [5]\n[1].flatMap((a) => [5])\
    \ // [5]\n\n[1].flat() // [1]\n[[1]].flat() // [1]\n```\n\n当我不确定 Promise 链返回什么时，我会在脑海中将\
    \ Promise 转换为数组，其中每个异步函数返回一个包含其结果的扁平数组，而 `await` 则是获取第一个元素：\n\n```\nconst f1 =\
    \ () => {\n  return [2].flat();\n};\n\nconst f2 = () => {\n  return [f1()].flat();\n\
    }\n\nconst result = f2()[0]; // 2\n```\n\n那么 Promise 链就变成了一系列的 `flatMap`：\n\n\
    ```\nconst getUser = () => [\"user\"];\n\ngetUser()\n  .flatMap(function getPermissionsForUser(user)\
    \ {\n    // user = \"user\"\n    const permissions = \"permissions\";\n    return\
    \ permissions;\n  })\n  .flatMap(function checkPermission(permissions) {\n   \
    \ // permissions = \"permissions\"\n    const allowed = true;\n    return allowed;\n\
    \  })\n  .flatMap((allowed) => {\n    // allowed = true\n    // 处理允许或不允许的情况\n\
    \  });\n```\n\n这消除了异步的大部分复杂性，并且更容易推理。\n\n## Promise\n\n到目前为止，我们已经讨论了如何编写产生 Promise\
    \ 的异步函数，以及如何等待 Promise 拥有值。但是，在没有现有 Promise 可构建的情况下，如何创建 Promise 呢？\n\n要了解这一点，我们需要讨论\
    \ JavaScript 中异步的工作原理，以及如何从回调构建 Promise。\n\n### 回调\n\n异步结果以回调的形式出现。它们类似于 Promise\
    \ 中 `then()` 函数的参数，但在特定事件发生时被调用。例如，最简单的回调是 `setTimeout` 调用，它等待给定的毫秒数，然后调用参数函数：\n\
    \n```\nsetTimeout(() => {\n  // 1 秒后\n}, 1000);\n```\n\n这种使用回调的模式在 JavaScript\
    \ 中随处可见。\n\n用于 Google 服务的库 gapi，在加载客户端库时[需要一个回调](https://github.com/google/google-api-javascript-client/blob/master/docs/reference.md#----gapiloadlibraries-callbackorconfig------)：\n\
    \n```\ngapi.load(\"client:auth2\", () => {\n  // auth2 客户端已加载\n});\n```\n\n类似地，事件监听器（例如点击处理程序）在事件发生时调用一个函数：\n\
    \n"
- fmt: "\n```\nconst button = document.querySelector(\"#button\");\n\nbutton.addEventListener(\"\
    click\", () => {\n  // button is clicked\n}, {once: true})\n```\n\nThe problem\
    \ with callbacks is that we are back to square one as instead of having a flat\
    \ structure we have nesting again.\n\nFortunately, there is a simple way to convert\
    \ callbacks to `Promises` and then use them with `await`.\n\nEvent listeners and\
    \ `Promises`\n\nEagle-eyed readers might have spotted the `{once: true}` part\
    \ in the last example. Event listeners are inherently different than async functions\
    \ as they represent *multiple events* instead of a single result value. Because\
    \ of this, you can not replace them with `Promises`.\n\nThe exception is when\
    \ there is exactly one event, as in the above example. In a sense, it works similarly\
    \ to the timeout or the gapi load function, as the callback is invoked when the\
    \ event happens.\n\n### The `Promise` constructor\n\nAsync functions return `Promises`\
    \ but you can only use `await` to wait for other `Promises` and not for callbacks.\
    \ To make a `Promise`, you need to use its constructor:\n\n```\nnew Promise((res)\
    \ => {\n  // call res when the Promise is ready\n});\n```\n\nCalling the `res`\
    \ callback signals the `Promise` that the result is ready. This is the same as\
    \ when an async function returns.\n\nTo convert the `setTimeout` to a `Promise`,\
    \ wrap it in the constructor and use `res` as the callback:\n\n```\nawait new\
    \ Promise((res) => {\n  setTimeout(res, 1000);\n});\n// 1s later\n\n// same as\n\
    await new Promise((res) => {\n  setTimeout(() => {\n    res();\n  }, 1000);\n\
    });\n```\n\nNow that it is a `Promise`, `await` works just like for other async\
    \ functions.\n\nSimilarly, the two other examples are also easy to promisify:\n\
    \n```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\", res);\n});\n\
    // auth2 client loaded\n```\n\n```\nconst button = document.querySelector(\"#button\"\
    );\n\nawait new Promise((res) => {\n  button.addEventListener(\"click\", res,\
    \ {once: true});\n});\n// button is clicked\n```\n\nWith `Promises` instead of\
    \ callbacks it's easy to use `await` and make a sequence of async operations.\
    \ To load the auth2 client when the button is clicked:\n\n```\nawait new Promise((res)\
    \ => {\n  button.addEventListener(\"click\", res, {once: true});\n});\n// the\
    \ button is clicked\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\"\
    , res);\n});\n// the gapi library is loaded\n```\n\nConverting between callbacks\
    \ and `Promises`\n\nYou'll learn more about this in the [Convert between `Promises`\
    \ and callbacks](#chapter5.xhtml_defined-convert-between-promises-and-callbacks)\
    \ chapter.\n\n### `Promise` states\n\nAs a `Promise` holds a future value it can\
    \ be in several states.\n\nWhen you create a `Promise`, it starts in the **Pending**\
    \ state. It is before the resolve/reject callback is called or the async function\
    \ finished.\n\nWhen there is a value, the `Promise` transitions into the **Resolved**\
    \ state. It is when the `await` in unblocked and the async function continues\
    \ to run.\n\nIf there is an error, the `Promise` goes into the **Rejected** state.\
    \ It is when the `await` throws an exception.\n\nThe Resolved and the Rejected\
    \ states are collectively called **Fulfilled** (or **Settled**). When a `Promise`\
    \ is in this state it's already finished and produced a value or an error.\n\n\
    ![](c7bf165c038961ff3793fb930dc7f0f0e4deca1a722e24292ec3555a5c09e142.png)\n\n\
    `Promise` states\n\n### Result value\n\nThe examples above all used the `Promise`\
    \ `res` function to signal when an async operation is ready and did not produce\
    \ any value. To also return a value, **pass it to the `res` call**.\n\n```\nconst\
    \ value = new Promise((res) => {\n  res(5);\n});\n// 5\n```\n\nA more complicated\
    \ example, the next `Promise` shows the Google Drive file picker and resolves\
    \ with the selected file. This seems complicated, but the underlying idea is the\
    \ same: create a new `Promise`, then call the `res` method when the result is\
    \ ready.\n\n```\nconst folder = await new Promise((res) => {\n  const picker =\
    \ new google.picker.PickerBuilder()\n    // ... configuration ...\n    .setCallback((data)\
    \ => {\n      if (/* selected action*/) {\n        // a folder is selected\n \
    \       const selectedFolder = ...\n\n        // resolve the Promise\n       \
    \ res(selectedFolder);\n      }\n    })\n    .build();\n  picker.setVisible(true);\n\
    });\n// folder is the selected folder\n```\n\nNote\n\nYou can return only one\
    \ value with the `res()` call. You'll learn about ways to return multiple in the\
    \ [Returning multiple values](#chapter4.xhtml_defined-returning-multiple-values)\
    \ chapter.\n\n## Error handling\n\nSo far we've been discussing async functions\
    \ when everything is going fine. No database timeout, no validation errors, no\
    \ sudden loss of network. But these things happen, so we need to prepare for them\
    \ too. Without proper error propagation, failures stall `Promises` and async functions,\
    \ stopping them forever.\n\nWith synchronous functions, errors happen when something\
    \ `throw`s them, and they bubble up until there is a `try-catch`:\n\n```\nconst\
    \ fn = () => {\n  throw new Error(\"Something bad happened\");\n}\n\ntry {\n \
    \ fn();\n}catch(e) {\n  // handle error\n}\n```\n\nAsync functions work similarly\
    \ so that when there is an error thrown it will go up until a `try-catch`. When\
    \ there is an asynchronous error (we'll look into how they work in the next chapter),\
    \ you can handle it with the same familiar structure:\n\n```\nconst fn = async\
    \ () => {\n  throw new Error(\"Something bad happened\");\n}\n\ntry {\n  await\
    \ fn();\n}catch(e) {\n  // handle error\n}\n```\n\nNote\n\nErrors are thrown during\
    \ the `await` and not when the function is called:\n\n```\nconst asyncFn = async\
    \ () => {\n  throw new Error(\"Something bad happened\");\n}\n\nconst res = asyncFn();\
    \ // no error here\n\ntry {\n  await res; // error\n}catch(e) {\n  // handle error\n\
    }\n```\n\n### Error callback in the `Promise` constructor\n\nBut when you use\
    \ the `Promise` constructor, you need to pay attention to propagate the errors.\n\
    \nLet's revisit our previous examples! The `gapi.load` loads a client library\
    \ that can be used with Google services and it needs a callback to notify when\
    \ it's finished. This is easy to turn into a `Promise` with the `Promise` constructor:\n\
    \n```\nawait new Promise((res) => {\n  gapi.load(\"client:auth2\", res);\n});\n\
    // auth2 loaded\n```\n\nBut what happens when there is an error? Maybe the network\
    \ is down and the client library can not be loaded. In this case, the callback\
    \ function is never called and the `Promise` is never finished. An `await` waiting\
    \ for it will wait forever.\n\n```\nawait new Promise((res) => {\n  gapi.load(\"\
    client:auth2\", res); // error\n});\n// never happens\n```\n\nTo implement proper\
    \ error propagation, we need two things. First, a way to signal the `Promise`\
    \ that an error happened, and second, a way to detect that error.\n\n#### Rejecting\
    \ a `Promise`\n\nThe `Promise` constructor provides a second callback that can\
    \ signal that an error happened:\n\n```\nnew Promise((res, rej) => {\n  // call\
    \ res() when everything is fine\n  // call rej() when there is an error\n});\n\
    ```\n\nWhen the `rej` function is called it behaves similarly to an async function\
    \ throwing an error:\n\n```\ntry {\n  await new Promise((res, rej) => {\n    rej();\
    \ // signal error\n  });\n}catch(e) {\n  // handle error\n}\n```\n\nSimilar to\
    \ the `res` function, you can pass the error object which will be the rejection\
    \ reason:\n\n```\ntry {\n  await new Promise((res, rej) => {\n    rej(new Error(\"\
    Something bad happened\"));\n  });\n}catch(e) {\n  console.log(e.message) // Something\
    \ bad happened\n}\n```\n\nWhat is an error\n\nWhat constitutes an error is up\
    \ to the implementation. For example, `fetch` throws an error when the connection\
    \ can not be established, but it does not when the response code is outside the\
    \ 2xx range.\n\n```\ntry {\n  const response = await fetch(options);\n  if (response.ok)\
    \ {\n    // request successful\n  }else {\n    // error response\n  }\n} catch\
    \ (e) {\n  // error while sending the request\n}\n```\n\nExceptions thrown in\
    \ the constructor also reject the `Promise`:\n\n```\nnew Promise(() => {\n  throw\
    \ Error(\"something bad happened\");\n});\n// rejected with error\n```\n"
