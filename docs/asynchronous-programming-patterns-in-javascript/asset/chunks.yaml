  trans: "\n```\nconst lambdas = await getPaginatedResults(async (NextMarker) => {\n\
    \  const functions = await lambda.listFunctions(\n    {Marker: NextMarker}\n \
    \ ).promise();\n  return {\n    marker: functions.NextMarker,\n    results: functions.Functions,\n\
    \  };\n});\n```\n\n适配到日志组：\n\n```\nconst logGroups =\n  await getPaginatedResults(async\
    \ (NextMarker) => {\n    const logGroups = await logs.describeLogGroups(\n   \
    \   {nextToken: NextMarker}\n    ).promise();\n    return {\n      marker: logGroups.nextToken,\n\
    \      results: logGroups.logGroups,\n    };\n  });\n```\n\n# 在 postMessage 中使用异步函数\n\
    \n`postMessage` 调用允许在不同浏览上下文（例如 IFrame 和 Web Worker）之间建立异步通信通道，在这些上下文中直接函数调用无法工作。它的工作原理是向对方发送一条消息，然后接收端可以监听\
    \ `message` 事件。\n\n例如，页面可以通过 `postMessage` 与 IFrame 通信，并向彼此的窗口发送事件。`iframe.contentWindow.postMessage()`\
    \ 调用向 IFrame 发送消息，而 `window.parent.postMessage()` 则向主页面发送消息。两端可以使用 `window.addEventListener(\"\
    message\", (event) => {...})` 监听来自对方的消息。\n\n```\n// index.html\nconst iframe =\
    \ document.querySelector(\"iframe\");\n\nwindow.addEventListener(\"message\",\
    \ ({data}) => {\n  // 3: 接收响应\n  console.log(\"来自 iframe 的消息: \" + data);\n});\n\
    \n// 1: 发送请求\niframe.contentWindow.postMessage([5, 2]);\n\n// iframe.html\nwindow.addEventListener(\"\
    message\", ({data}) => {\n  // 2: 发送响应\n  window.parent.postMessage(event.data[0]\
    \ + event.data[1]);\n});\n```\n\n![](img/b1786475a19dc022bf1f3004f04a3cdc36dd119d4b068f2b65998e8f866a5ba5.png)\n\
    \n页面与 IFrame 的通信\n\n对于 Web Worker，每个 Worker 都有独立的消息处理器。页面可以使用 `worker.postMessage()`\
    \ 调用向特定 Worker 发送消息，并使用 `worker.addEventListener(\"message\", (event) => {...})`\
    \ 监听来自该 Worker 的事件。在另一端，Worker 使用全局函数 `postMessage()` 和 `addEventListener()` 发送和接收事件：\n\
    \n```\n// index.html\nconst worker = new Worker(\"worker.js\");\nworker.addEventListener(\"\
    message\", ({data}) => {\n  console.log(\"来自 worker 的消息: \" + data); // 3\n});\n\
    \nworker.postMessage([5, 5]); // 1\n\n// worker.js\naddEventListener(\"message\"\
    , (event) => {\n  postMessage(event.data[0] + event.data[1]); // 2\n}, false)\n\
    ```\n\n## 请求-响应通信\n\n与 IFrame 和 Worker 通信都存在一些问题。首先，发送请求和处理响应是分离的。**接收端使用全局（或每个\
    \ Worker 的）事件监听器**，该监听器在所有调用之间共享。\n\n这对于“通知式”消息来说很好，即一端想通知另一端发生了某事，但不期望得到响应。但**通知式消息传递很少见**。通常需要的是“请求-响应式”消息传递。\n\
    \n例如，一端使用访问令牌，另一端可以刷新它。通信包括刷新请求和带有刷新令牌的响应。或者，当用户点击按钮而另一端需要处理该事件时也是如此。这个例子看起来像是“通知式”消息，但当操作进行时需要禁用按钮（如保存按钮），或者可能出现发送方需要知道的错误时，它就变成了请求-响应。\n\
    \n全局（或每个 Worker 的）消息处理器不适合将响应与请求配对。理想的解决方案是将所有这些复杂性隐藏在异步函数调用后面，并使用 `await` 等待结果：\n\
    \n```\nconst result = await add(10, 5);\n```\n\n让我们看看如何创建这样一个函数！\n\n### 响应标识\n\
    \n第一个任务是知道哪个请求触发了给定的响应。使用全局事件处理器的问题在于，很容易依赖一次只发生一个通信。当你测试 Web 应用时，你一次只测试一件事，但用户不会那么体贴。你不能假设任何时候只会发生一个请求-响应。\n\
    \n![](img/fe5ec8337fbbff1aac2fec193f30a60c549566acdab873dd3eab8e52fe5153a8.png)\n\
    \n非多路复用通道\n\n一种解决方案是使用*请求标识符*将响应与请求配对。\n\n![](img/b5b51157b8c956a6b5cbe1c493ca6946506fc1deedecbf7ead2f4895ca1bacbd.png)\n\
    \n请求 ID\n\n这种方法可行，尽管需要一些编码，但这是一个很好的解决方案。\n\n#### MessageChannel\n\n幸运的是，语言内置了一个更好的解决方案。`MessageChannel`\
    \ 允许一个专用的通信通道附加到 `postMessage` 调用上。发送端可以监听*该通道上*的消息，该通道与所有其他调用分离，接收端可以通过它获得的 `MessagePort`\
    \ 发送响应。\n\n`MessageChannel` 创建两个 `MessagePort`，一个用于通信的每一端。每个端口都支持 `onmessage`\
    \ 和 `postMessage`，类似于基本的跨上下文通信通道。\n\n```\n// index.html\nconst worker = new Worker(\"\
    worker.js\");\n// 创建一个通道\nconst channel = new MessageChannel(); \n\n// 监听一端\n\
    channel.port1.onmessage = ({data}) => {\n  console.log(\"来自通道的消息: \" + data);\
    \ // 3\n};\n\n// 发送另一端\nworker.postMessage([15, 2], [channel.port2]); // 1\n\n\
    // worker.js\naddEventListener(\"message\", (event) => {\n  // 在接收到的端口上响应\n  event.ports[0].postMessage(event.data[0]\
    \ + event.data[1]); // 2\n}, false)\n```\n\n要为端口附加消息处理器，请使用 `port.onmessage =\
    \ (event) => {...}`。如果使用 `addEventListener`，则还需要启动通道：\n\n```\nport.addEventListener(\"\
    message\", (event) => {...});\nport.start();\n```\n\n要将端口附加到 `postMessage` 调用，请使用第二个参数：`postMessage(data,\
    \ [channel.port2])`。要在另一端使用此端口，请使用 `event.ports[0].postMessage()`。\n\n通过为每个请求创建一个新的\
    \ `MessageChannel`，响应的配对问题就解决了，因为通过该通道传来的任何内容都是对该特定请求的响应。\n\n### 错误处理\n\n请求-响应通信中一个经常被忽视的方面是错误处理。当接收端出现问题并抛出\
    \ `Error` 时，应该将其传播给发送方，以便发送方能够适当处理。\n\n`postMessage` 的问题在于它只能发送一种类型的消息，没有 `postError`\
    \ 调用。那么如何发出错误信号呢？\n\n一种可能的解决方案类似于 Node 风格的回调，仅使用一个函数来传播错误。这些回调同时使用错误和结果值，但只定义其中一个：\n\
    \n```\n(err, result) => {\n  if (err) {\n    // 错误\n  } else {\n    // 结果\n  }\n\
    }\n```\n\n为了用消息实现同样的效果，使用一个包含 `error` 和 `result` 属性的对象。当前者非空时，表示发生了错误。\n\n```\n\
    // worker.js\ntry{\n  event.ports[0].postMessage(\n    {result: event.data[0]\
    \ + event.data[1]}\n  );\n}catch(e) {\n  event.ports[0].postMessage({error: e});\n\
    }\n\n// index.html\nchannel.port1.onmessage = ({data}) => {\n  if (data.error)\
    \ {\n    // 错误\n  }else {\n    // data.result\n  }\n};\n```\n\n不要忘记将接收端包裹在 try-catch\
    \ 中，以传播运行时错误。\n\n## 使用 Promise\n\n有了分离的响应通道和错误传播，很容易将调用包装在 `Promise` 构造函数中。\n\n\
    ```\nconst worker = new Worker(\"worker.js\");\n\nconst add = (a, b) => new Promise((res,\
    \ rej) => {\n  const channel = new MessageChannel(); \n\n  channel.port1.onmessage\
    \ = ({data}) => {\n    channel.port1.close();\n    if (data.error) {\n      rej(data.error);\n\
    \    }else {\n      res(data.result);\n    }\n  };\n\n  worker.postMessage([a,\
    \ b], [channel.port2]);\n});\n\nconsole.log(await add(3, 5)); // 8\n```\n"
- fmt: "\nWith a `Promise` hiding all the complexities of the remote call, everything\
    \ that works with async/await works with these calls too:\n\n```\n// parallel\
    \ execution\nconsole.log(await Promise.all([\n  add(1, 1),\n  add(5, 5),\n]));\
    \ // [2, 10]\n\n// async reduce\nconsole.log(await [1, 2, 3, 4].reduce(async (memo,\
    \ i) => {\n  return add(await memo, i);\n}), 0); // 10\n```\n\nAnd the `Promise`\
    \ rejects when it should, allowing proper error handling on the sending end:\n\
    \n```\n// worker.js\naddEventListener(\"message\", (event) => {\n  try{\n    if\
    \ (\n      typeof event.data[0] !== \"number\" ||\n      typeof event.data[1]\
    \ !== \"number\"\n    ) {\n      throw new Error(\"both arguments must be numbers\"\
    );\n    }\n    event.ports[0].postMessage(\n      {result: event.data[0] + event.data[1]}\n\
    \    );\n  }catch(e) {\n    event.ports[0].postMessage({error: e});\n  }\n}, false)\n\
    \n// index.html\ntry {\n  await add(undefined, \"b\");\n}catch(e) {\n  console.log(\"\
    Error: \" + e.message); // error\n}\n```\n\nOne restriction is what can be sent\
    \ through the `postMessage` call. It uses the *structured clone algorithm* which\
    \ supports complex objects but [not everything](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Structured_clone_algorithm).\n\
    \n# Collection processing with async functions\n\nWhile async/await is great to\
    \ make async *commands* look like synchronous ones, collection processing is not\
    \ that simple. It's not just adding an `async` before the function passed to `Array.reduce`\
    \ and it will magically work correctly. But without async functions, you can not\
    \ use `await` and provide a result *later* which is required for things like reading\
    \ a database, making network connections, reading files, and a whole bunch of\
    \ other things.\n\nLet's see some examples!\n\nWhen all the functions you need\
    \ to use are synchronous, it's easy. For example, a string can be doubled without\
    \ any asynchronicity involved:\n\n```\nconst double = (str) => {\n  return str\
    \ + str;\n};\n\ndouble(\"abc\");\n// abcabc\n```\n\nIf the function is async,\
    \ it's also easy for a single item using `await`. For example, to calculate the\
    \ SHA-256 hash, Javascript provides a `digest()` async function:\n\n```\n// https://developer.mozilla.org/docs/Web/API/SubtleCrypto/digest\n\
    const digestMessage = async (message) => {\n  const msgUint8 = new TextEncoder().encode(message);\n\
    \  const hashBuffer =\n    await crypto.subtle.digest(\"SHA-256\", msgUint8);\n\
    \  const hashArray = Array.from(new Uint8Array(hashBuffer));\n  const hashHex\
    \ = hashArray\n    .map(b => b.toString(16).padStart(2, \"0\"))\n    .join('');\n\
    \  return hashHex;\n};\n\nawait digestMessage(\"msg\");\n// e46b320165eec91e6344fa1034...\n\
    ```\n\nThis looks almost identical to the previous call, the only difference is\
    \ an `await`.\n\nBut for collections, handling asynchronicity becomes different.\n\
    \nTo calculate the double for each element in a **collection of strings** is simple\
    \ with a `map`:\n\n```\nconst strings = [\"msg1\", \"msg2\", \"msg3\"];\n\nstrings.map(double);\n\
    // [\"msg1msg1\", \"msg2msg2\", \"msg3msg3\"]\n```\n\nBut to calculate the **hash**\
    \ of each string in a collection, it does not work:\n\n```\nconst strings = [\"\
    msg1\", \"msg2\", \"msg3\"];\n\nawait strings.map(digestMessage);\n// [object\
    \ Promise],[object Promise],[object Promise]\n```\n\nThis is an everyday problem\
    \ as async functions make a bigger category than synchronous ones. A sync function\
    \ can work in an async environment, but an async one can not be converted to work\
    \ in a synchronous way.\n\nFor a more realistic scenario, querying a database\
    \ is inherently async as it needs to make network connections. To get the score\
    \ for a single `userId` from a hypothetical database is simple:\n\n```\nconst\
    \ getUserObject = async (id) => {\n  // get user by id\n};\n\nconst userId = 15;\n\
    const userObject = await getUserObject(userId);\nconst userScore = userObject.score;\n\
    ```\n\nBut how to query the database for a *collection* of `userId`s?\n\n```\n\
    const userIds = [15, 16, 21];\n// const userObjects = ???\n```\n\nAnd it's not\
    \ just about using `map` to transform one value to another. Is the user's score\
    \ above 3?\n\n```\nconst userObject = await getUserObject(userId);\nconst above3\
    \ = userObject.score > 3;\n```\n\nBut is *any* of the users' score above 3?\n\n\
    ```\n// userIds.some(???)\n```\n\nOr what is the average score?\n\n```\n// userIds.reduce(???)\n\
    ```\n\nTo make things more interesting, adding an `async` to a `map` at least\
    \ gives some indication what is changed:\n\n```\n// synchronous\n[1, 2, 3].map((i)\
    \ => {\n  return i + 1;\n});\n// [2, 3, 4]\n\n// asynchronous\n[1, 2, 3].map(async\
    \ (i) => {\n  return i + 1;\n});\n// [object Promise],[object Promise],[object\
    \ Promise]\n```\n\nBut a `filter` just does something entirely wrong:\n\n```\n\
    // synchronous\n[1, 2, 3, 4, 5].filter((i) => {\n  return i % 2 === 0;\n});\n\
    // [2, 4]\n\n// asynchronous\n[1, 2, 3, 4, 5].filter(async (i) => {\n  return\
    \ i % 2 === 0;\n});\n// [1, 2, 3, 4, 5]\n```\n\nBecause of this, async collection\
    \ processing requires some effort, and it's different depending on what kind of\
    \ function you want to use. An async `map` works markedly differently than an\
    \ async `filter` or and async `reduce`.\n\nIn this chapter, you'll learn how each\
    \ of them works and how to efficiently use them.\n\n## Async for iteration\n\n\
    But first, let's talk about `for` loops!\n\nI don't like `for` loops as they tend\
    \ to promote bad coding practices, like nested loops that do a lot of things at\
    \ once or `continue`/`break` statements scattered around that quickly descend\
    \ into an unmaintainable mess.\n\nAlso, a more functional approach with functions\
    \ like `map`/`filter`/`reduce` promote a style where one function does only one\
    \ thing and everything inside it is scoped and stateless. And the functional approach\
    \ is not only possible 99% of the time but it comes with no perceivable performance\
    \ drop and it also yields simpler code (well, at least when you know the functions\
    \ involved).\n\nBut async/await is in the remaining 1%.\n\nFor loops have a distinctive\
    \ feature, as they don't rely on *calling* a function. In effect, you can use\
    \ `await` inside the loop and it will just work.\n\n```\n// synchronous\n{\n \
    \ const res = [];\n  for (let i of [1, 2, 3]){\n    res.push(i + 1);\n  }\n  //\
    \ res: [2, 3, 4]\n}\n\n// asynchronous\n{\n  const res = [];\n  for (let i of\
    \ [1, 2, 3]){\n    await sleep(10);\n    res.push(i + 1);\n  }\n  // res: [2,\
    \ 3, 4]\n}\n```\n\nAs `for` loops are a generic tool, they can be used for all\
    \ kinds of requirements when working with collections.\n\nBut their downside is\
    \ still present, and while it's not trivial to adapt the functional approach to\
    \ async/await, once you start seeing the general pattern it's not that hard either.\n\
    \n## Async functions with reduce\n\nThe `reduce` function iteratively constructs\
    \ a value and returns it, which is not necessarily a collection. That's where\
    \ the name comes from, as it *reduces* a collection to a value.\n\nThe iteratee\
    \ function gets the previous result, called `memo` in the examples below, and\
    \ the current value, `e`.\n\nThe following function sums the elements, starting\
    \ with 0 (the second argument of `reduce`):\n\n```\nconst arr = [1, 2, 3];\n\n\
    const syncRes = arr.reduce((memo, e) => {\n  return memo + e;\n}, 0);\n\nconsole.log(syncRes);\n\
    // 6\n```\n\n| `memo`   |       `e`       |   result |\n| --- | --- | --- |\n\
    | 0 (initial) | **1** | 1 |\n| 1 | **2** | 3 |\n| 3 | **3** | (end result) 6 |\n\
    \n![](87a5c26af62b04b8a3f8f8f31fadb7f21ef4327dd2eb7167aa4ee5b222f5a055.png)\n\n\
    The reduce function\n\n### Asynchronous reduce\n\nAn async version is almost the\
    \ same, but it returns a `Promise` on each iteration, so `memo` will be the `Promise`\
    \ of the previous result. The iteratee function needs to `await` it in order to\
    \ calculate the next result:\n\n```\n// utility function for sleeping\nconst sleep\
    \ = (n) => new Promise((res) => setTimeout(res, n));\n\nconst arr = [1, 2, 3];\n\
    \nconst asyncRes = await arr.reduce(async (memo, e) => {\n  await sleep(10);\n\
    \  return (await memo) + e;\n}, 0);\n\nconsole.log(asyncRes);\n// 6\n```\n\n|\
    \ `memo`   |       `e`       |   result |\n| --- | --- | --- |\n| 0 (initial)\
    \ | **1** | `Promise(1)` |\n| `Promise(1)` | **2** | `Promise(3)` |\n| `Promise(3)`\
    \ | **3** | (end result) `Promise(6)` |\n"
