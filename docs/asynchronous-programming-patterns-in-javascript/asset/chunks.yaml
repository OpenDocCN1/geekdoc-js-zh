  trans: "\n\n```\n// sync\nconst some = (arr, predicate) =>\n  arr.filter(predicate).length\
    \ > 0;\nconst every = (arr, predicate) =>\n  arr.filter(predicate).length ===\
    \ arr.length;\n\n// async\nconst asyncSome = async (arr, predicate) =>\n  (await\
    \ asyncFilter(arr, predicate)).length > 0;\nconst asyncEvery = async (arr, predicate)\
    \ =>\n  (await asyncFilter(arr, predicate)).length === arr.length;\n```\n\n![](img/7aab5ebf6fa625fce3d789c911166ad71474735e1dc2451535b590f24a1e8c8e.png)\n\
    \n基于过滤器的异步 `some`\n\n#### 短路\n\n但内置的 `some`/`every` 函数与基于 `filter` 的实现之间存在一个重要区别。当某个元素对\
    \ `some` 返回 true 时，它会**短路**，不再处理剩余元素：\n\n```\nconst arr = [1, 2, 3];\n\nconst\
    \ res = arr.some((i) => {\n  console.log(`检查 ${i}`);\n  return i % 2 === 0;\n\
    });\n\n// 检查 1\n// 检查 2\n\nconsole.log(res);\n// true\n```\n\n![](img/e7aefe8f1796e5a90d2c85d3ddd34a7d2117cda3fae26b9a0a5ac618974c984e.png)\n\
    \n同步 `some`\n\n类似地，`every` 在遇到第一个 false 结果后停止：\n\n```\nconst arr = [1, 2, 3];\n\
    \nconst res = arr.every((i) => {\n  console.log(`检查 ${i}`);\n  return i < 2;\n\
    });\n\n// 检查 1\n// 检查 2\n\nconsole.log(res);\n// false\n```\n\n让我们看看如何编写一个以类似方式工作且工作量最小的异步版本！\n\
    \n### 异步 `some`\n\n最佳解决方案是使用异步 **for 迭代**，一旦找到真值结果就立即返回：\n\n```\nconst arr = [1,\
    \ 2, 3];\n\nconst asyncSome = async (arr, predicate) => {\n  for (let e of arr)\
    \ {\n    if (await predicate(e)) return true;\n  }\n  return false;\n};\nconst\
    \ res = await asyncSome(arr, async (i) => {\n  console.log(`检查 ${i}`);\n  await\
    \ sleep(10);\n  return i % 2 === 0;\n});\n\n// 检查 1\n// 检查 2\n\nconsole.log(res);\n\
    // true\n```\n\n![](img/29298028c2b0b61baa14673755d0e4cd641b66a550d0be0004a9bb9e23ceee1b.png)\n\
    \n基于 for 循环的异步 `some`\n\n对于第一个元素，如果 `predicate(e)` 返回 true，则结束 for 循环。\n\n###\
    \ 异步 `every`\n\n类似的结构也适用于 `every`，只需对条件取反即可：\n\n```\nconst arr = [1, 2, 3];\n\n\
    const asyncEvery = async (arr, predicate) => {\n  for (let e of arr) {\n    if\
    \ (!await predicate(e)) return false;\n  }\n  return true;\n};\nconst res = await\
    \ asyncEvery(arr, async (i) => {\n  console.log(`检查 ${i}`);\n  await sleep(10);\n\
    \  return i < 2;\n});\n\n// 检查 1\n// 检查 2\n\nconsole.log(res);\n// false\n```\n\
    \n每当 `predicate(e)` 返回 false 时，函数就会结束，不再检查其他元素。\n\n### 并行处理\n\n短路实现会顺序处理元素，这在资源使用方面是高效的，但可能导致执行时间更长。\n\
    \n例如，如果迭代器通过网络发送请求，逐个发送可能需要一些时间。另一方面，虽然同时发送所有请求可能会导致更多请求被发送，但速度会更快。\n\n# 常见错误\n\
    \n## 未传播错误\n\n当你将回调转换为 Promise 时，请确保也处理了错误情况。否则，Promise 永远不会被 resolve，`await`\
    \ 会永远等待。\n\n例如，`gapi.load` 为结果和错误提供了独立的回调：\n\n```\nawait new Promise((res, rej)\
    \ => {\n  gapi.load(\"client:auth2\", {callback: res, onerror: rej});\n});\n```\n\
    \n如果你没有将 `rej` 回调附加到 `onerror` 处理程序，错误将不会在链中传播。这会导致难以调试的问题和“突然停止”的组件。\n\n## 在\
    \ `try..catch` 中缺少 `await`\n\n当你在异步函数中使用 `try..catch` 或 `try..finally` 时，请确保也使用了\
    \ `await`。例如，当内部 Promise 成功 resolve 时，以下代码可以正常工作：\n\n```\nconst fn = async ()\
    \ => {\n  return \"result\";\n}\n\nconst outer = async () => {\n  try {\n    return\
    \ fn(); // <= 缺少 await!\n  }catch(e) {\n    console.log(e.message);\n  }\n}\n\n\
    await outer(); // result\n```\n\n但 `try..catch` 无法处理异常：\n\n```\nconst fn = async\
    \ () => {\n  throw new Error(\"error\");\n}\n\nconst outer = async () => {\n \
    \ try {\n    return fn(); // <= 缺少 await!\n  }catch(e) {\n    console.log(e.message);\n\
    \  }\n}\n\nawait outer();\n// 抛出异常！\n```\n\n这是因为异常是从 `await` 抛出的，虽然从异步函数返回 Promise\
    \ 会扁平化结果，但返回时不会等待它。如果不等待，异常就不会被 `try..catch` 捕获，而是在调用者使用 `await` 时抛出。\n\n```\n\
    const fn = async () => {\n  throw new Error(\"error\");\n}\n\nconst outer = async\
    \ () => {\n  try {\n    return await fn();\n  }catch(e) {\n    console.log(e.message);\
    \ // error\n  }\n}\n\nawait outer();\n// 此处无异常\n```\n\n## 未检查返回值\n\n当 Promise\
    \ 被 resolve 时，并不一定意味着一切正常。例如，`fetch` 在*连接*出现问题时拒绝，但即使响应状态返回错误，它也会 resolve。\n\n\
    当调用无法建立连接时，Promise 拒绝：\n\n```\ntry {\n  await fetch(\"htp://example.com\");\n\
    }catch(e) {\n  console.log(e.message); // Failed to fetch\n}\n```\n\n但当响应状态码指示错误（500）时，Promise\
    \ 仍然 resolve：\n\n```\ntry {\n  await fetch(\"https://httpbin.org/status/500\"\
    );\n\n  // 无错误\n}catch(e) {\n  console.log(e.message);\n}\n```\n\n因此，你需要检查结果中的错误响应。`fetch`\
    \ 结果提供了 `ok` 字段来实现这一点：\n\n```\nconst response = await fetch(\"https://httpbin.org/status/500\"\
    );\n\nif (!response.ok) {\n  throw new Error(\"错误响应\");\n}\n```\n\n## 拒绝时未关闭资源\n\
    \n通常我们会打开某个资源，然后在不需要时关闭它。例如，以下代码创建了一个临时目录，然后稍后删除它：\n\n```\nconst fs = require(\"\
    fs\").promises;\nconst os = require(\"os\");\nconst path = require(\"path\");\n\
    \nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n\
    );\n\n// 使用 dir 存储临时内容\n\nawait fs.rmdir(dir, {recursive: true});\n```\n\n除非出现异常跳过清理代码，否则这可以正常工作。\n\
    \n```\nconst dir = await fs.mkdtemp(\n  await fs.realpath(os.tmpdir()) + path.sep\n\
    );\n\nthrow Error(\"error\");\n\nawait fs.rmdir(dir, {recursive: true});\n// 清理代码不会执行！\n\
    ```\n\n使用 `try..finally` 实现可靠的清理：\n\n```\nconst dir = await fs.mkdtemp(\n  await\
    \ fs.realpath(os.tmpdir()) + path.sep\n);\ntry {\n  // 使用 dir 存储临时内容\n}finally\
    \ {\n  await fs.rmdir(dir, {recursive: true});\n}\n```\n\n更好的做法是将资源生命周期移到专用函数中，如异步释放器模式章节所述：\n\
    \n```\nconst withTempDir = async (fn) => {\n  const dir = await fs.mkdtemp(\n\
    \    await fs.realpath(os.tmpdir()) + path.sep\n  );\n  try {\n    return await\
    \ fn(dir);\n  }finally {\n    fs.rmdir(dir, {recursive: true});\n  }\n};\n\nawait\
    \ withTempDir((dir) => {\n  // 使用 dir 存储临时内容\n})\n```\n\n## 在同一个 `then` 函数中同时使用拒绝和\
    \ resolve 处理程序\n\n一个常见的问题是编写如下错误处理代码：\n\n```\ngetPromise()\n  .then(process, handleError);\n\
    ```\n\n正如我们在 Promise 链中的错误传播章节中讨论的，`then()` 的第二个处理程序仅处理来自前一步骤的错误。\n\n![](img/ef010590c468612b89d4abfa91bab02e9dfbc8ee00ff194c7c4047da0758ec61.png)\n\
    \nPromise 链示意图\n\n注意，`handleError` 函数仅捕获来自 `getPromise` 的错误。如果 `process` 函数的结果被拒绝，它将不会被处理。\n\
    \n更好的解决方案是使用 `.catch` 来明确处理错误：\n\n```\ngetPromise()\n  .then(process)\n  .catch(handleError);\n\
    ```\n\n这样，两个步骤都被错误处理程序覆盖，清晰明了。\n\n## 未等待异步 `forEach`\n\n"
- fmt: "\nThe `forEach` function iterates over a collection and calls an iteratee\
    \ function. A typical problem is not waiting for the iteration to complete:\n\n\
    ```\n[1, 2, 3].forEach(async (e) => {\n  console.log(e);\n  return makePromise(e);\n\
    });\nconsole.log(\"finished\");\n// finished\n// 1\n// 2\n// 3\n```\n\nIt is a\
    \ best practice to wait until the whole collection is processed, which can be\
    \ achived with a `Promise.all` and a `map`:\n\n```\nawait Promise.all([1, 2, 3].map(async\
    \ (e) => {\n  console.log(e);\n  return makePromsie(e);\n}));\nconsole.log(\"\
    finished\");\n// 1\n// 2\n// 3\n// finished\n```\n\nMore info\n\nThis topic is\
    \ covered in more detail in the [Async functions with forEach](#chapter12.xhtml_defined-the-foreach-function)\
    \ chapter.\n\n# Glossary\n\n**Async function**\n\nA function that returns a `Promise`.\
    \ The `await` keyword is only usable in an async function.\n\n```\nconst wait\
    \ = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst fn = async ()\
    \ => {\n  await wait(100);\n  return \"result\";\n}\n\nfn(); // Promise\n```\n\
    \n**Async generator function**\n\nA generator function that can use `await`. When\
    \ it encounters a `yield` or a `yield*` the execution stops until a subsequent\
    \ element is requested.\n\n```\nconst wait = (ms) => new Promise((res) => setTimeout(res,\
    \ ms));\n\nconst gen = async function*() {\n  console.log(\"start\");\n  await\
    \ wait(100);\n  yield 1;\n  await wait(100);\n  console.log(\"next\");\n  yield\
    \ 2;\n  await wait(100);\n  console.log(\"end\");\n};\n\nconst it = gen();\nconsole.log(await\
    \ it.next());\nconsole.log(await it.next());\nconsole.log(await it.next());\n\n\
    // start\n// { value: 1, done: false }\n// next\n// { value: 2, done: false }\n\
    // end\n// { value: undefined, done: true }\n```\n\nSee [Generator function](#chapter14.xhtml_defined-glossary-generator-function).\n\
    \n**await keyword**\n\nUsable in async functions, it stops the execution until\
    \ the argument `Promise` becomes fulfilled. It then returns the value or throws\
    \ an exception. See [Async function](#chapter14.xhtml_defined-glossary-async-function).\n\
    \n**Callback**\n\nA function passed as an argument that is called with the return\
    \ value. It allows asynchronous results, as the callback can be invoked later.\n\
    \nFor example, the `setTimeout` function needs a callback that it calls when the\
    \ time is up:\n\n```\nsetTimeout(() => {\n  // 1 second later\n}, 1000);\n```\n\
    \nSee [Continuation-passing style](#chapter14.xhtml_defined-glossary-continuation-passing-style).\n\
    \n**Collection processing**\n\nA series of functions that work on a collection\
    \ of elements (usually, an array), such as transforming (`map`), filtering (`filter`),\
    \ and reducing to a value (`reduce`).\n\n**Continuation-passing style**\n\nA programming\
    \ construct that uses callback functions (continuations) for function results\
    \ instead of returning them directly. This allows asynchronous results as these\
    \ callbacks can be invoked later.\n\n```\n// direct style\nconst directFn = ()\
    \ => {\n  return \"result\";\n};\n\n// CPS\nconst cpsFn = (callback) => {\n  callback(\"\
    result\");\n};\n```\n\nSee [Callback](#chapter14.xhtml_defined-glossary-callback).\n\
    \n**Error propagation**\n\nWhen there is an error, it moves up in context until\
    \ there is a piece of code that can handle it.\n\nFor example, an unhandled exception\
    \ gets thrown to the caller:\n\n```\nconst fn = () => {\n  // the error is thrown\
    \ here\n  throw new Error(\"error\");\n}\n\ntry {\n  fn();\n}catch(e) {\n  //\
    \ and handled here\n}\n```\n\nWith Promises, errors propagate to the next handlers:\n\
    \n```\ngetUser() // returns a Promise\n  .then(() => {\n    // the error is thrown\
    \ here\n    throw new Error(\"error\");\n  })\n  .catch((e) => {\n    // and handled\
    \ here\n  });\n```\n\n**Error-first callbacks**\n\nA callback style where the\
    \ first argument is an error object. The receiving end needs to check if this\
    \ value is non-null (or non-undefined).\n\n```\nconst fn = (callback) => {\n \
    \ try {\n    const result = \"result\";\n    // error is null\n    callback(null,\
    \ result);\n  }catch(e) {\n    // signal error\n    callback(e);\n  }\n}\n\nfn((err,\
    \ result) => {\n  if (err) {\n    // handle error\n  }else {\n    // handle result\n\
    \  }\n});\n```\n\nSee [Node-style callbacks](#chapter14.xhtml_defined-glossary-node-style-callbacks).\n\
    \n**Fulfilled Promise**\n\nA state of a `Promise` that is either resolved or rejected.\
    \ See [Promise states](#chapter14.xhtml_defined-glossary-promise-states).\n\n\
    **Generator function**\n\nA function that returns an iterable structure. It can\
    \ be frozen with a `yield` statement and only resumes if more elements are requested.\n\
    \n```\nconst gen = function*() {\n  console.log(\"start\");\n  yield 1;\n  console.log(\"\
    next\");\n  yield 2;\n  console.log(\"end\");\n}\n\nconst it = gen();\nconsole.log(it.next());\n\
    console.log(it.next());\nconsole.log(it.next());\n\n// start\n// { value: 1, done:\
    \ false }\n// next\n// { value: 2, done: false }\n// end\n// { value: undefined,\
    \ done: true }\n```\n\n**Node-style callbacks**\n\nA callback style where:\n\n\
    *   The callback function is the last argument\n\n*   It is called with an error\
    \ object first, then a result (`(error, result)`)\n\n*   It returns only one result\n\
    \n```\nconst getUser = (id, cb) => {\n  const user = /* get user */;\n  if (user)\
    \ {\n    // success\n    cb(null, user);\n  }else {\n    // error\n    cb(new\
    \ Error(\"Failed to get user\"));\n  }\n};\n```\n\n**Pagination**\n\nWhen a method\
    \ (usually an API) does not return all results for a request and it requires multiple\
    \ calls to get all items.\n\n**Pending Promise**\n\nA `Promise` state where the\
    \ asynchronous result is not yet available. See [Promise states](#chapter14.xhtml_defined-glossary-promise-states).\n\
    \n`postMessage`\n\nAn API to communicate cross-context, such as with IFrames and\
    \ Web Workers. It is an event-based communication where one end listens for `message`\
    \ events and the other uses the `postMessage` function to send messages.\n\n`Promise`\n\
    \nA value that holds an asynchronous result. You can use the `then` callback to\
    \ handle when the `Promise` becomes fulfilled, or use `await` in an async function.\n\
    \n**Promise chain**\n\nA series of `then()` callbacks, each getting the previous\
    \ state of the `Promise` and returns the next one.\n\n```\ngetUser() // returns\
    \ a Promise\n  .then(async function getPermissionsForUser(user) {\n    const permissions\
    \ = await // ...;\n    return permissions;\n  })\n  .then(async function checkPermission(permissions)\
    \ {\n    const allowed = await // ...;\n    return allowed;\n  })\n  .then((allowed)\
    \ => {\n    // handle allowed or not\n  });\n```\n\n`Promise` states\n\nA `Promise`\
    \ can be in one of multiple states:\n\n*   Pending: The value is not yet available\n\
    \n*   Resolved: The value is available\n\n*   Rejected: There was an error\n\n\
    When the `Promise` is either resolved or rejected then it's fulfilled or settled.\n\
    \n![](c7bf165c038961ff3793fb930dc7f0f0e4deca1a722e24292ec3555a5c09e142.png)\n\n\
    Promise states\n\n`Promise.all`\n\nA utility function that gets multiple Promises\
    \ and resolves when all of them are resolved and returns an array with the results.\
    \ It rejects if any of the input Promises rejects.\n\n```\nconsole.log(\n  await\
    \ Promise.all([\n    Promise.resolve(\"a\"),\n    Promise.resolve(\"b\"),\n  ])\n\
    );\n\n// [\"a\", \"b\"]\n```\n\n`Promise.allSettled`\n\nA utility function that\
    \ gets multiple Promises and resolves when all of them are settled. It resolves\
    \ even if some input Promises reject.\n\n```\nconsole.log(\n  await Promise.allSettled([\n\
    \    Promise.resolve(\"a\"),\n    Promise.reject(\"b\"),\n  ])\n);\n\n// [\n//\
    \     { status: 'fulfilled', value: 'a' },\n//     { status: 'rejected', reason:\
    \ 'b' }\n// ]\n```\n\n`Promise.catch`\n\nA utility function that attaches a rejection\
    \ handler to a `Promise`. It's equivalent to `then(undefined, handler)`.\n\n```\n\
    Promise.reject(new Error(\"error\"))\n  .catch((e) => {\n    console.log(e.message);\
    \ // error\n  });\n```\n\n`Promise.finally`\n\nA utility function that is called\
    \ when the `Promise` settles, either if it's resolved or rejected. It brings the\
    \ `try..finally` construct to Promises.\n\n```\ngetUser() // returns a Promise\n\
    \  .finally(() => {\n  // called both even if the Promise is rejected\n    console.log(\"\
    finished\");\n  });\n// does not change the result value\n```\n\n`Promise.race`\n"
