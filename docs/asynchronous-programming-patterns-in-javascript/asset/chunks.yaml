  trans: "\n\n![](img/cover.jpg)\n\n# 引言\n\n异步编程在 JavaScript 中无处不在。这是定义其工作方式的基本选择所导致的结果。在其他语言中，你可以使用多线程来实现同步等待，而\
    \ JavaScript 缺少这一关键特性。它被设计为单线程，等待操作会停止一切，试想一下长时间计算导致 UI 冻结的情况。\n\n由于无法同步等待后续结果，JavaScript\
    \ 必须使用回调。即使是等待指定时间这样简单的事情，也需要一个在时间到达时执行的函数：\n\n```\nsetTimeout(() => {\n  console.log(\"\
    1 second passed!\");\n}, 1000);\n```\n\n这种模式随处可见，因为大多数操作本质上都是异步的。使用 `fetch` 向服务器发起\
    \ HTTP 调用是异步操作。通过 `getUserMedia` 获取可用摄像头和麦克风的信息也是如此，因为它需要获得用户许可。读写文件同样如此。虽然这些操作目前有同步版本，但它们的性能很差。或者你想用\
    \ Puppeteer 进行网页抓取？每条指令都是异步的，因为它们都与远程进程通信。对于后端应用，读写数据库数据本质上也是异步的。\n\n不仅如此，某些函数是异步的，所有调用它们的函数也必须是异步的。例如，需要发起网络调用的功能就是异步的，无论该调用相对于函数正在执行的其他操作有多么微不足道。因此，几乎所有的\
    \ JavaScript 应用程序都由异步操作组成。\n\n多年来，这门语言增加了许多让编写异步代码更简单的特性。所谓的“回调地狱”时代已经过去，那时一系列基于回调的异步调用使得程序结构难以理解，并且容易无意中忽略错误。\n\
    \n首先，`Promise` 获得了广泛支持，扁平化了回调的结构。然后，async/await 成为异步编程的主流方式，将异步的许多复杂性隐藏在仅有的两个关键字\
    \ `async` 和 `await` 之后。\n\n这提高了可读性，并使新手程序员更容易编写异步代码。现代 JavaScript 仍然使用相同的单线程无同步等待事件循环，但程序结构已经反映了现代语言的特点。\n\
    \n但异步编程本质上很困难。虽然语言通过语法帮助简化理解和编写代码，但异步性引入了许多潜在错误，其中大多数非常微妙，只在特殊情况下才会出现。\n\n尽管我已经使用异步代码工作多年，但本书中的一些问题花了我一周时间才找到满意的解决方案。我写这本书的目的是，当你遇到类似问题时，通过了解难点所在，能够更轻松地应对。这样你就不必从零开始，而是对障碍和最佳实践有清晰的认识。\n\
    \n你会注意到，错误处理是本书中反复出现的主题。这是因为这是一个经常被忽视的概念，导致代码容易出错。通过了解异步函数和 `Promise` 中的错误机制，你将编写出更安全的程序。\n\
    \n## 结构\n\n本书分为两部分。\n\n第一章 async/await 入门 介绍了 async/await 和 `Promise`，以及异步拼图的各个部分如何组合在一起。主要关注异步函数，因为它们是\
    \ JavaScript 中异步编程的主流方式。但如果不了解 `Promise`，async/await 就像魔法一样，因此你也会学习它们。\n\n到第一章结束时，你将很好地理解如何使用异步函数以及它们在底层是如何工作的。\n\
    \n本书的第二部分包含几个常见的编程任务和问题。你将了解特定问题何时重要、如何解决以及边界情况是什么。这为你提供了完整的图景，以便在遇到类似问题时知道如何处理。\n\
    \n本书不要求从头到尾阅读，而是作为参考指南使用。通过本书中描述的模式，我希望你能看到异步编程的潜在难点，这样在制定自己的解决方案时，你会了解陷阱和最佳实践，从而得到更可靠的代码。\n\
    \n# async/await 入门\n\n本章从 JavaScript 异步编程的介绍开始。主要关注异步函数，因为你可能会更频繁地使用它们，但你也会学习\
    \ `Promise` 的工作原理。\n\n## 异步函数\n\n普通函数使用 `return` 关键字返回结果：\n\n```\nconst fn = ()\
    \ => {\n  return 5;\n}\n\nfn();\n// 5\n```\n\n相比之下，异步函数返回一个 `Promise`：\n\n```\n\
    const asyncFn = async () => {\n  return 5;\n}\n\nasyncFn();\n// Promise\n```\n\
    \n你可以使用 `async` 关键字使任何函数成为异步函数，并且有很多函数返回 `Promise` 而不是直接结果。\n\n例如，要从文件系统读取文件，你可以使用\
    \ `fs.promises`，它是返回 `Promise` 的 `fs` 函数变体：\n\n```\nconst fs = require(\"fs\"\
    );\n\nfs.promises.readFile(\"test.js\");\n// Promise\n```\n\n或者使用 [sharp](https://www.npmjs.com/package/sharp)\
    \ 库将图像转换为 jpeg，该库也返回 `Promise`：\n\n```\nconst sharp = require(\"sharp\");\n\n\
    sharp(\"image.png\")\n  .jpeg()\n  .toFile(\"image.jpg\");\n// Promise\n```\n\n\
    或者使用 `fetch` 发起网络请求：\n\n```\nfetch(\"https://advancedweb.hu\");\n// Promise\n\
    ```\n\n### 如何使用 Promise\n\n异步函数仍然有返回值，而 `Promise` 持有这个结果。要获取该值，需要使用 `then()` 函数**附加一个回调**。这个回调将在函数结果可用时被调用。\n\
    \n要获取 `readFile` 后的文件内容：\n\n```\nconst fs = require(\"fs\");\n\nfs.promises.readFile(\"\
    test.js\").then((result) => {\n  console.log(result);\n  // Buffer\n});\n```\n\
    \n类似地，要获取我们简单异步函数的结果，使用 `then()`：\n\n```\nconst asyncFn = async () => {\n  return\
    \ 5;\n}\n\nasyncFn().then((res) => {\n  console.log(res);\n  // 5\n});\n```\n\n\
    ### Promise 的优势\n\n但为什么要用 `Promise` 使函数调用复杂化呢？普通函数直接返回一个值，可以在下一行使用，无需任何回调。\n\n\
    返回 `Promise` 而不是值的好处在于，**结果可能在函数返回时尚未就绪**。回调可以在很久之后才被调用，但函数必须立即返回。这扩展了函数的能力。\n\
    \n```\n// 同步\nfn();\n// 结果已就绪\n\n// 异步\nasyncFn().then(() => {\n  // 结果已就绪\n})\n\
    // 结果待定\n```\n\n在许多情况下，同步结果是不可能的。例如，与函数调用相比，发起网络请求需要很长时间。使用 `Promise`，无论某操作花费很长时间还是立即产生结果，都没有区别。在这两种情况下，`then()`\
    \ 函数都会在结果就绪时被调用。\n\n![](img/219846a27f36124ca15767dea9c7b8b464f160923c5e3e283f065d57c1088b38.png)\n\
    \n异步函数返回一个 `Promise`\n\n使用标准化的 `Promise` 还允许其他结构在此基础上构建。正如我们所见，`async` 关键字使函数返回\
    \ `Promise` 而不是值。\n\n总结\n\n异步函数返回 `Promise`，这些值将在未来的某个时刻可用。\n\n"
- fmt: "\n```\nconst user = getUser();\nconst permissions = getPermissions();\nconst\
    \ hasAccess = checkPermissions(user, permissions);\nif (hasAccess) {\n  // handle\
    \ request\n}\n```\n\nPromises need callbacks:\n\n```\ngetUser().then((user) =>\
    \ {\n  getPermissions().then((permissions) => {\n    const hasAccess = checkPermissions(user,\
    \ permissions);\n    if (hasAccess) {\n      // handle request\n    }\n  });\n\
    });\n```\n\nNote\n\nPromises support a flat structure when they are invoked sequentially,\
    \ this is their main selling point over traditional callbacks. For example, a\
    \ series of async calls can process an object:\n\n```\ngetUser()\n  .then(getPermissionsForUser)\n\
    \  .then(checkPermission)\n  .then((allowed) => {\n    // handle allowed or not\n\
    \  });\n```\n\nThis is an almost flat structure which we'll detail in the [Chaining\
    \ Promises](#chapter2.xhtml_defined-chaining-promises) chapter, but a callback\
    \ is still needed at the end. The `await` keyword eliminates the need for that.\n\
    \nTo solve this without losing the advantages of Promises, async functions can\
    \ use the `await` keyword. It **stops the function until the Promise is ready**\
    \ and returns the result value.\n\n```\nconst asyncFn = async () => {\n  return\
    \ 5;\n}\n\nawait asyncFn();\n// 5\n```\n\nThe above code that uses callbacks can\
    \ use `await` instead which leads to a more familiar structure:\n\n```\nconst\
    \ user = await getUser();\nconst permissions = await getPermissions();\nconst\
    \ hasAccess = checkPermissions(user, permissions);\nif (hasAccess) {\n  // handle\
    \ request\n}\n```\n\nThe `await` keyword that **waits for async results** makes\
    \ the code look almost like it's synchronous, but with all the benefits of Promises.\n\
    \nNote that `await` stops the execution of the function, which seems like something\
    \ that can not happen in Javascript. But under the hood, it still uses the `then()`\
    \ callbacks and since async functions return Promises they don't need to provide\
    \ a result immediately. This allows halting the function without major changes\
    \ to how the language works.\n\n### Async function examples\n\nAsync functions\
    \ with `await` are powerful. They make a complicated and asynchronous workflow\
    \ seem easy and familiar, hiding all the complexities of results arriving later.\n\
    \nBrowser automation is a prime example. The [Puppeteer](https://www.npmjs.com/package/puppeteer)\
    \ project allows starting Chromium and driving it with the DevTools protocol.\n\
    \nTaking a screenshot of a webpage is only a few lines:\n\n```\nconst browser\
    \ = await puppeteer.launch(options);\nconst page = await browser.newPage();\n\
    const response = await page.goto(url);\nconst img = await page.screenshot();\n\
    await browser.close();\n```\n\nThis code hides a lot of complexity. It starts\
    \ a browser, then sends commands to it, all asynchronous since the browser is\
    \ a separate process. But the end result is an image buffer containing the screenshot.\n\
    \nNote\n\nThe above code leaves the browser running if there is an error during\
    \ execution. You'll learn how to handle closing resources in the [The async disposer\
    \ pattern](#chapter8.xhtml_defined-async-disposer) chapter.\n\nAnother example\
    \ is to interface with databases. A remote service always requires network calls\
    \ and that means asynchronous results.\n\nThis code, used in an AWS Lambda function,\
    \ updates a user's avatar image:\n\n```\n// move object out of the pending directory\n\
    await s3.copyObject({/*...*/}).promise();\nawait s3.deleteObject({/*...*/}).promise();\n\
    \n// get the current avatar image\nconst oldAvatar = (await dynamodb.getItem({/*...*/}).promise())\n\
    \  .Item.Avatar.S;\n\n// update the user's avatar\nawait dynamodb.updateItem({/*...*/}).promise();\n\
    // delete the old image\nawait s3.deleteObject({/*...*/}).promise();\n\nreturn\
    \ {\n  statusCode: 200,\n};\n```\n\nIt makes calls to the AWS S3 service to move\
    \ objects, and to the DynamoDB database to read and modify data. Both of these\
    \ are remote services, but all the complexities are hidden behind the `await`s.\n\
    \nRecap\n\nThe `await` keyword stops the function until the future result becomes\
    \ available.\n\n### Chaining Promises\n\nWe've seen that when an async function\
    \ returns a value it will be wrapped in a Promise and the `await` keyword extracts\
    \ the value from it. But what happens when an async function returns a Promise?\
    \ Would that mean you need to use two `await`s?\n\nConsider this code:\n\n```\n\
    const f1 = async () => {\n  return 2;\n};\n\nconst f2 = async () => {\n  return\
    \ f1();\n}\n\nconst result = await f2();\n```\n\nStrictly following the process\
    \ described in the previous chapters, `f1()` returns `Promise<2>`, and `f2()`\
    \ returns `Promise<Promise<2>>`, so the value of `result` will be `Promise<2>`\
    \ instead of `2`.\n\nBut this is not what happens. When an async function returns\
    \ a Promise, it returns it without adding another layer. It does not matter if\
    \ it returns a value or a Promise, it will always be a Promise and it will always\
    \ resolve with the final value and not another Promise.\n\nThis works the same\
    \ for Promise chains too. The `.then()` callback is also wrapped in a Promise\
    \ if it's not one already so you can chain them easily:\n\n```\ngetUser()\n  .then(async\
    \ function getPermissionsForUser(user) {\n    const permissions = await // ...;\n\
    \    return permissions;\n  })\n  .then(async function checkPermission(permissions)\
    \ {\n    const allowed = await // ...;\n    return allowed;\n  })\n  .then((allowed)\
    \ => {\n    // handle allowed or not\n  });\n```\n\nThe `getUser` function returns\
    \ a `Promise<User>`, then the `getPermissionsForUser` gets the user object (the\
    \ resolved value), then returns the permission set. The next call, `checkPermission`\
    \ gets the permissions, and so on.\n\nA useful analog is how the `flatMap` function\
    \ for an array works. It does not matter if it returns a value or an array, the\
    \ end result will always be an array with values. It is a `map`, followed by a\
    \ `flat`.\n\n```\n[1].flatMap((a) => 5) // [5]\n[1].flatMap((a) => [5]) // [5]\n\
    \n[1].flat() // [1]\n[[1]].flat() // [1]\n```\n\nWhen I'm not sure what a Promise\
    \ chain returns, I mentally translate Promises to arrays where every async function\
    \ return a flattened array with its result and an `await` is getting the first\
    \ element:\n\n```\nconst f1 = () => {\n  return [2].flat();\n};\n\nconst f2 =\
    \ () => {\n  return [f1()].flat();\n}\n\nconst result = f2()[0]; // 2\n```\n\n\
    A Promise chain then becomes a series of `flatMap`s:\n\n```\nconst getUser = ()\
    \ => [\"user\"];\n\ngetUser()\n  .flatMap(function getPermissionsForUser(user)\
    \ {\n    // user = \"user\"\n    const permissions = \"permissions\";\n    return\
    \ permissions;\n  })\n  .flatMap(function checkPermission(permissions) {\n   \
    \ // permissions = \"permissions\"\n    const allowed = true;\n    return allowed;\n\
    \  })\n  .flatMap((allowed) => {\n    // allowed = true\n    // handle allowed\
    \ or not\n  });\n```\n\nThis eliminates most of the complexities of asynchronicity\
    \ and is a lot easier to reason about.\n\n## Promises\n\nSo far we've discussed\
    \ how to write Promise-producing async functions and how to wait for a Promise\
    \ to have a value. But how to create Promises in cases where there are no existing\
    \ Promises to build on?\n\nTo know this, we need to discuss how asynchronicity\
    \ works in Javascript and how to construct Promises from callbacks.\n\n### Callbacks\n\
    \nAsync results come in the form of callbacks. These are like the parameter of\
    \ the `then()` function in Promises but are called when a particular event happens.\
    \ For example, the simplest callback is the `setTimeout` call that waits a given\
    \ number of milliseconds then invokes the argument function:\n\n```\nsetTimeout(()\
    \ => {\n  // 1s later\n}, 1000);\n```\n\nThis pattern of using callbacks is everywhere\
    \ in Javascript.\n\nThe gapi, the library to use Google services, [needs a callback](https://github.com/google/google-api-javascript-client/blob/master/docs/reference.md#----gapiloadlibraries-callbackorconfig------)\
    \ when it loads a client library:\n\n```\ngapi.load(\"client:auth2\", () => {\n\
    \  // auth2 client loaded\n});\n```\n\nSimilarly, event listeners, such as a click\
    \ handler, calls a function when the event happened:\n"
