  trans: "\n\n`forEach` 函数遍历一个集合并调用迭代器函数。一个典型的问题是它不会等待迭代完成：\n\n```\n[1, 2, 3].forEach(async\
    \ (e) => {\n  console.log(e);\n  return makePromise(e);\n});\nconsole.log(\"finished\"\
    );\n// finished\n// 1\n// 2\n// 3\n```\n\n最佳实践是等待整个集合处理完毕，这可以通过 `Promise.all`\
    \ 和 `map` 实现：\n\n```\nawait Promise.all([1, 2, 3].map(async (e) => {\n  console.log(e);\n\
    \  return makePromsie(e);\n}));\nconsole.log(\"finished\");\n// 1\n// 2\n// 3\n\
    // finished\n```\n\n更多信息\n\n本主题在 Async functions with forEach 章节中有更详细的介绍。\n\n\
    # 术语表\n\n**异步函数**\n\n返回一个 `Promise` 的函数。`await` 关键字只能在异步函数中使用。\n\n```\nconst wait\
    \ = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst fn = async ()\
    \ => {\n  await wait(100);\n  return \"result\";\n}\n\nfn(); // Promise\n```\n\
    \n**异步生成器函数**\n\n可以使用 `await` 的生成器函数。当遇到 `yield` 或 `yield*` 时，执行会暂停，直到请求下一个元素。\n\
    \n```\nconst wait = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst\
    \ gen = async function*() {\n  console.log(\"start\");\n  await wait(100);\n \
    \ yield 1;\n  await wait(100);\n  console.log(\"next\");\n  yield 2;\n  await\
    \ wait(100);\n  console.log(\"end\");\n};\n\nconst it = gen();\nconsole.log(await\
    \ it.next());\nconsole.log(await it.next());\nconsole.log(await it.next());\n\n\
    // start\n// { value: 1, done: false }\n// next\n// { value: 2, done: false }\n\
    // end\n// { value: undefined, done: true }\n```\n\n参见 生成器函数。\n\n**await 关键字**\n\
    \n可在异步函数中使用，它会暂停执行，直到参数 `Promise` 变为已兑现。然后返回该值或抛出异常。参见 异步函数。\n\n**回调**\n\n作为参数传递的函数，调用时传入返回值。它允许异步结果，因为回调可以在稍后被调用。\n\
    \n例如，`setTimeout` 函数需要一个回调，在时间到达时调用它：\n\n```\nsetTimeout(() => {\n  // 1 秒后\n\
    }, 1000);\n```\n\n参见 延续传递风格。\n\n**集合处理**\n\n一系列对元素集合（通常是数组）进行操作的函数，例如转换（`map`）、过滤（`filter`）和归约为一个值（`reduce`）。\n\
    \n**延续传递风格**\n\n一种编程结构，使用回调函数（延续）来处理函数结果，而不是直接返回结果。这允许异步结果，因为这些回调可以在稍后被调用。\n\n\
    ```\n// 直接风格\nconst directFn = () => {\n  return \"result\";\n};\n\n// CPS\nconst\
    \ cpsFn = (callback) => {\n  callback(\"result\");\n};\n```\n\n参见 回调。\n\n**错误传播**\n\
    \n当出现错误时，它会向上层上下文传递，直到有代码能够处理它。\n\n例如，未处理的异常会被抛给调用者：\n\n```\nconst fn = () =>\
    \ {\n  // 错误在此处抛出\n  throw new Error(\"error\");\n}\n\ntry {\n  fn();\n}catch(e)\
    \ {\n  // 在此处处理\n}\n```\n\n对于 Promise，错误会传播到下一个处理程序：\n\n```\ngetUser() // 返回一个\
    \ Promise\n  .then(() => {\n    // 错误在此处抛出\n    throw new Error(\"error\");\n\
    \  })\n  .catch((e) => {\n    // 在此处处理\n  });\n```\n\n**错误优先回调**\n\n一种回调风格，其中第一个参数是错误对象。接收方需要检查该值是否为非\
    \ null（或非 undefined）。\n\n```\nconst fn = (callback) => {\n  try {\n    const result\
    \ = \"result\";\n    // error 为 null\n    callback(null, result);\n  }catch(e)\
    \ {\n    // 发出错误信号\n    callback(e);\n  }\n}\n\nfn((err, result) => {\n  if (err)\
    \ {\n    // 处理错误\n  }else {\n    // 处理结果\n  }\n});\n```\n\n参见 Node 风格回调。\n\n**已兑现的\
    \ Promise**\n\n`Promise` 的一种状态，表示已解决或已拒绝。参见 Promise 状态。\n\n**生成器函数**\n\n返回可迭代结构的函数。它可以通过\
    \ `yield` 语句冻结，只有在请求更多元素时才会恢复。\n\n```\nconst gen = function*() {\n  console.log(\"\
    start\");\n  yield 1;\n  console.log(\"next\");\n  yield 2;\n  console.log(\"\
    end\");\n}\n\nconst it = gen();\nconsole.log(it.next());\nconsole.log(it.next());\n\
    console.log(it.next());\n\n// start\n// { value: 1, done: false }\n// next\n//\
    \ { value: 2, done: false }\n// end\n// { value: undefined, done: true }\n```\n\
    \n**Node 风格回调**\n\n一种回调风格，其中：\n\n*   回调函数是最后一个参数\n\n*   调用时先传入错误对象，再传入结果（`(error,\
    \ result)`）\n\n*   只返回一个结果\n\n```\nconst getUser = (id, cb) => {\n  const user\
    \ = /* 获取用户 */;\n  if (user) {\n    // 成功\n    cb(null, user);\n  }else {\n  \
    \  // 错误\n    cb(new Error(\"Failed to get user\"));\n  }\n};\n```\n\n**分页**\n\
    \n当某个方法（通常是 API）不返回请求的所有结果，需要多次调用才能获取所有项目时使用。\n\n**待定的 Promise**\n\n`Promise`\
    \ 的一种状态，表示异步结果尚不可用。参见 Promise 状态。\n\n`postMessage`\n\n一种跨上下文通信的 API，例如与 IFrame\
    \ 和 Web Worker 通信。它是一种基于事件的通信方式，一端监听 `message` 事件，另一端使用 `postMessage` 函数发送消息。\n\
    \n`Promise`\n\n一个持有异步结果的值。你可以使用 `then` 回调来处理 `Promise` 变为已兑现的情况，或者在异步函数中使用 `await`。\n\
    \n**Promise 链**\n\n一系列 `then()` 回调，每个回调获取前一个 `Promise` 的状态并返回下一个。\n\n```\ngetUser()\
    \ // 返回一个 Promise\n  .then(async function getPermissionsForUser(user) {\n    const\
    \ permissions = await // ...;\n    return permissions;\n  })\n  .then(async function\
    \ checkPermission(permissions) {\n    const allowed = await // ...;\n    return\
    \ allowed;\n  })\n  .then((allowed) => {\n    // 处理是否允许\n  });\n```\n\n`Promise`\
    \ 状态\n\n`Promise` 可以处于多种状态之一：\n\n*   待定：值尚不可用\n\n*   已解决：值可用\n\n*   已拒绝：出现错误\n\
    \n当 `Promise` 已解决或已拒绝时，它被称为已兑现或已敲定。\n\n![](img/c7bf165c038961ff3793fb930dc7f0f0e4deca1a722e24292ec3555a5c09e142.png)\n\
    \nPromise 状态\n\n`Promise.all`\n\n一个工具函数，接收多个 Promise，当所有 Promise 都解决时解决，并返回包含结果的数组。如果任何一个输入\
    \ Promise 拒绝，则拒绝。\n\n```\nconsole.log(\n  await Promise.all([\n    Promise.resolve(\"\
    a\"),\n    Promise.resolve(\"b\"),\n  ])\n);\n\n// [\"a\", \"b\"]\n```\n\n`Promise.allSettled`\n\
    \n一个工具函数，接收多个 Promise，当所有 Promise 都敲定时解决。即使某些输入 Promise 拒绝，它也会解决。\n\n```\nconsole.log(\n\
    \  await Promise.allSettled([\n    Promise.resolve(\"a\"),\n    Promise.reject(\"\
    b\"),\n  ])\n);\n\n// [\n//     { status: 'fulfilled', value: 'a' },\n//     {\
    \ status: 'rejected', reason: 'b' }\n// ]\n```\n\n`Promise.catch`\n\n一个工具函数，为\
    \ `Promise` 附加一个拒绝处理程序。它等价于 `then(undefined, handler)`。\n\n```\nPromise.reject(new\
    \ Error(\"error\"))\n  .catch((e) => {\n    console.log(e.message); // error\n\
    \  });\n```\n\n`Promise.finally`\n\n一个工具函数，在 `Promise` 敲定时调用，无论是解决还是拒绝。它将 `try..finally`\
    \ 结构引入 Promise。\n\n```\ngetUser() // 返回一个 Promise\n  .finally(() => {\n  // 即使\
    \ Promise 被拒绝也会调用\n    console.log(\"finished\");\n  });\n// 不会改变结果值\n```\n\n\
    `Promise.race`\n\n"
- fmt: "\nA utility function that gets multiple `Promise`s and resolves (or rejects)\
    \ when the first one settles.\n\n```\nconst wait = (ms) => new Promise((res) =>\
    \ setTimeout(res, ms));\n\nconst fn = async (ms, result) => {\n  await wait(ms);\n\
    \n  return result;\n}\nconsole.log(\n  await Promise.race([\n    fn(100, \"a\"\
    ),\n    fn(50, \"b\"),\n  ])\n);\n// b\n```\n\n`Promise.reject`\n\nA utility function\
    \ that rejects with the value provided.\n\n```\nPromise.reject(new Error(\"error\"\
    ))\n  .catch((v) => {\n    console.log(v.message); // error\n  })\n```\n\n`Promise.resolve`\n\
    \nA utility function that returns a `Promise` that is resolved with the value\
    \ provided. Useful to start a `Promise` chain.\n\n```\nPromise.resolve(\"value\"\
    )\n  .then((v) => {\n    console.log(v); // value\n  })\n```\n\n`Promise.then`\n\
    \nA function of a `Promise` object that attaches a function that will be called\
    \ when the `Promise` is settled. See [Promise chain](#chapter14.xhtml_defined-glossary-promise-chain).\n\
    \n`Promisification`\n\nThe process of converting callbacks to `Promise`s.\n\n\
    `Rejected Promise`\n\nA `Promise` state that indicates an error. See [Promise\
    \ states](#chapter14.xhtml_defined-glossary-promise-states).\n\n`Resolved Promise`\n\
    \nA `Promise` state where the asynchronous value is available. See [Promise states](#chapter14.xhtml_defined-glossary-promise-states).\n\
    \n`Settled Promise`\n\nAn alternative name for the fulfilled state. See [Promise\
    \ states](#chapter14.xhtml_defined-glossary-promise-states).\n\n`Synchronous function`\n\
    \nA function that returns a value when it's run. See [Continuation-passing style](#chapter14.xhtml_defined-glossary-continuation-passing-style).\n\
