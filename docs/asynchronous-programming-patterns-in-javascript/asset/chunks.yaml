  trans: "\n\n一个工具函数，用于获取多个 `Promise`，并在第一个 Promise 敲定时进行决议（或拒绝）。\n\n```\nconst wait\
    \ = (ms) => new Promise((res) => setTimeout(res, ms));\n\nconst fn = async (ms,\
    \ result) => {\n  await wait(ms);\n\n  return result;\n}\nconsole.log(\n  await\
    \ Promise.race([\n    fn(100, \"a\"),\n    fn(50, \"b\"),\n  ])\n);\n// b\n```\n\
    \n`Promise.reject`\n\n一个工具函数，用于以提供的值进行拒绝。\n\n```\nPromise.reject(new Error(\"\
    error\"))\n  .catch((v) => {\n    console.log(v.message); // error\n  })\n```\n\
    \n`Promise.resolve`\n\n一个工具函数，返回一个以提供的值进行决议的 `Promise`。可用于启动一个 `Promise` 链。\n\n\
    ```\nPromise.resolve(\"value\")\n  .then((v) => {\n    console.log(v); // value\n\
    \  })\n```\n\n`Promise.then`\n\n`Promise` 对象的一个方法，用于附加一个在 `Promise` 敲定时被调用的函数。参见\
    \ Promise 链。\n\n`Promisification`\n\n将回调转换为 `Promise` 的过程。\n\n`Rejected Promise`\n\
    \n表示错误的 `Promise` 状态。参见 Promise 状态。\n\n`Resolved Promise`\n\n异步值可用的 `Promise`\
    \ 状态。参见 Promise 状态。\n\n`Settled Promise`\n\n已完成状态的另一种名称。参见 Promise 状态。\n\n`Synchronous\
    \ function`\n\n运行时返回值的函数。参见 延续传递风格。\n\n# 关于作者\n\nTamás Sallai![](img/self_big.jpg)\n\
    \n嘿，我是 Tamás！我是一名专注于 Web 技术和云计算的软件开发人员。我尤其热衷于探索边界情况和“如果……会怎样”，以编写可靠的软件。\n\n我是\
