  >\n\n<h1>Whack-a-Mole</h1>\n\n<p>Score: <span id=\"score\">0</span></p>\n\n<div\
  \ class=\"holes\">\n\n<div class=\"hole hole1\">\n\n<div class=\"mole\"></div>\n\
  \n</div>\n\n<div class=\"hole hole2\">\n\n<div class=\"mole\"></div>\n\n</div>\n\
  \n<div class=\"hole hole3\">\n\n<div class=\"mole\"></div>\n\n</div>\n\n<div class=\"\
  hole hole4\">\n\n<div class=\"mole\"></div>\n\n</div>\n\n<div class=\"hole hole5\"\
  >\n\n<div class=\"mole\"></div>\n\n</div>\n\n<div class=\"hole hole6\">\n\n<div\
  \ class=\"mole\"></div>\n\n</div>\n\n</div>\n\n</div>\n\n<script type=\"text/javascript\"\
  \ src=\"index.js\"></script>\n\n</body>\n\n</html>\n```\n\n### CSS 代码\n\n```css\n\
  .game {\n\ntext-align: center;\n\nmargin-top: 100px;\n\n}\n\n.holes {\n\ndisplay:\
  \ flex;\n\njustify-content: center;\n\nalign-items: center;\n\nmargin-top: 50px;\n\
  \n}\n\n.hole {\n\ndisplay: inline-block;\n\nwidth: 100px;\n\nheight: 100px;\n\n\
  background-color: #C2B280;\n\nmargin: 10px;\n\nposition: relative;\n\n}\n\n.mole\
  \ {\n\nposition: absolute;\n\ntop: 0;\n\nleft: 0;\n\nwidth: 100%;\n\nheight: 100%;\n\
  \nbackground-image: url('https://image.flaticon.com/icons/svg/174/174879.svg');\n\
  \nbackground-repeat: no-repeat;\n\nbackground-position: center;\n\nbackground-size:\
  \ 60%;\n\ntransition: all 0.3s;\n\n}\n\n.mole.up {\n\ntop: -60px;\n\n}\n\n.mole.hit\
  \ {\n\nbackground-image: url('https://image.flaticon.com/icons/svg/174/174875.svg');\n\
  \n}\n\np {\n\nfont-size: 24px;\n\nmargin-bottom: 20px;\n\n}\n\n#score {\n\nfont-weight:\
  \ bold;\n\ncolor: #FF6F00;\n\n}\n```\n\n### JavaScript 代码\n\n```javascript\nconst\
  \ holes = document.querySelectorAll('.hole');\n\nconst scoreBoard = document.querySelector('#score');\n\
  \nconst moles = document.querySelectorAll('.mole');\n\nlet score = 0;\n\nlet lastHole;\n\
  \nlet timeUp = false;\n\nfunction randomTime(min, max) {\n\nreturn Math.round(Math.random()\
  \ * (max - min) + min);\n\n}\n\nfunction randomHole(holes) {\n\nconst idx = Math.floor(Math.random()\
  \ * holes.length);\n\nconst hole = holes[idx];\n\nif (hole === lastHole) {\n\nreturn\
  \ randomHole(holes);\n\n}\n\nlastHole = hole;\n\nreturn hole;\n\n}\n\nfunction peep()\
  \ {\n\nconst time = randomTime(200, 1000);\n\nconst hole = randomHole(holes);\n\n\
  hole.classList.add('up');\n\nsetTimeout(() => {\n\nhole.classList.remove('up');\n\
  \nif (!timeUp) {\n\npeep();\n\n}\n\n}, time);\n\n}\n\nfunction bonk(e) {\n\nif (!e.isTrusted)\
  \ {\n\nreturn;\n\n}\n\nscore++;\n\nthis.classList.remove('up');\n\nscoreBoard.textContent\
  \ = score;\n\n}\n\nmoles.forEach((mole) => mole.addEventListener('click', bonk));\n\
  \nfunction startGame() {\n\nscoreBoard.textContent = 0;\n\nscore = 0;\n\ntimeUp\
  \ = false;\n\npeep();\n\nsetTimeout(() => timeUp = true, 10000);\n\n}\n```\n\n请查看下面的截图。\n\
  \n![](img/image_rsrc65P.jpg)\n\n## 部署和托管选项\n\n部署和托管是软件开发的关键环节，涉及将应用程序提供给各种设备和平台上的用户。根据应用程序类型、预算和所需控制级别，有多种部署和托管选项，各有优缺点。在本回答中，我们将讨论一些最常见的部署和托管选项。\n\
  \n*   本地部署：此部署选项涉及在位于现场的服务器或其他硬件上运行应用程序。本地部署使企业能够更好地控制其应用程序和数据，但维护和升级硬件成本较高，并且需要经验丰富的\
  \ IT 团队来管理基础设施。\n\n*   云部署：云部署涉及在由云服务提供商（如 Amazon Web Services (AWS)、Microsoft Azure\
  \ 和 Google Cloud Platform (GCP)）托管的远程服务器上运行应用程序。云部署具有可扩展性、灵活性和成本效益，因为企业只需为使用的资源付费。云服务提供商还提供数据库、存储和分析等各种服务，使企业能够轻松地将不同的服务和功能集成到其应用程序中。\n\
  \n*   虚拟专用服务器 (VPS) 托管：VPS 托管涉及从托管提供商处租用虚拟服务器。与共享托管相比，VPS 托管对服务器环境的控制更多，并且比专用托管更实惠。但是，VPS\
  \ 托管需要一定的技术知识来设置和管理，企业需要确保服务器资源足以满足其应用程序的需求。\n\n*   共享托管：共享托管涉及将应用程序托管在与其他用户共享的服务器上。共享托管是最实惠的托管选项，非常适合小型企业或个人拥有的小型应用程序。但是，共享托管对服务器环境的控制有限，并且共享资源可能导致性能问题。\n\
  \n*   专用托管：专用托管涉及租用完全专用于某个应用程序的物理服务器。专用托管提供对服务器环境的完全控制，非常适合高流量或资源密集型应用程序。但是，专用托管成本高昂，并且需要技术知识来设置和管理。\n\
  \n*   容器化：容器化涉及将应用程序打包到容器中，这些容器可以在不同的平台和环境中一致地运行。容器化提供了一个标准化的环境，开发人员可以在其中构建、测试和部署应用程序。容器化还允许轻松扩展、更新和维护应用程序。容器化技术包括\
  \ Docker 和 Kubernetes。\n\n### 了解几种更便宜的网站托管平台\n\n多家网络托管提供商为个人和小型企业提供经济实惠的托管方案。以下是一些最便宜的选择：\n\
  \n*   Hostinger：Hostinger 提供共享托管方案，起价仅为每月 0.99 美元。其方案包括免费域名、网站构建器和 24/7 客户支持。\n\n\
  *   Bluehost：Bluehost 是一家流行的网络托管提供商，提供共享托管方案，起价为每月 2.95 美元。其方案包括免费域名、SSL 证书和网站构建器。\n\
  \n*   DreamHost：DreamHost 提供共享托管方案，起价为每月 2.59 美元。其方案包括无限存储和带宽、免费域名以及 24/7 客户支持。\n\
  \n*   A2 Hosting：A2 Hosting 提供共享托管方案，起价为每月 2.99 美元。其方案包括无限存储和带宽、免费 SSL 证书以及 24/7\
  \ 客户支持。\n\n*   HostGator：HostGator 是另一家流行的网络托管提供商，提供共享托管方案，起价为每月 2.75 美元。其方案包括免费域名、网站构建器和\
  \ 24/7 客户支持。\n\n### 如何托管你的网站\n\n托管网站需要几个基本步骤，包括：\n\n\n\n\n\n- **选择托管提供商**：目前有多种托管提供商可用，例如\
  \ Bluehost、HostGator、SiteGround 等。你可以比较每个提供商的定价、功能和客户支持，并选择最符合你需求和预算的一个。\n- **选择托管计划**：一旦你选择了托管提供商，你就需要选择一个托管计划。大多数提供商会根据你所需的功能和资源（如存储空间、带宽、电子邮件账户等）提供不同的计划。\n\
  - **注册域名**：域名是你的网站的地址，例如 `www.example.com`。你可以从域名注册商（如 Namecheap 或 GoDaddy）购买域名。\n\
  - **将你的域名连接到你的托管账户**：你需要更新域名的 DNS 设置，以指向你的托管提供商的服务器。你通常可以通过域名注册商的控制面板进行此操作。\n- **上传你的网站文件**：你可以使用\
  \ FTP 客户端（如 FileZilla）将网站文件上传到托管账户。或者，许多托管提供商还提供网站生成器或针对 WordPress 等流行 CMS 平台的一键安装工具。\n\
  - **测试你的网站**：一旦上传了网站文件，你就想要测试你的网站以确保一切运行正常。你可以通过在网络浏览器中访问网站的 URL 来实现。\n- **发布你的网站**：当你对网站的外观和功能满意后，就可以通过将其向公众开放来正式发布它。\n\
  \n需要注意的是，具体的步骤可能会根据你选择的托管提供商和网站平台而略有不同。\n\n# 结\n\n本书带你开启了一场穿越现代 Web 开发基础支柱的全面之旅。通过深入研究\
