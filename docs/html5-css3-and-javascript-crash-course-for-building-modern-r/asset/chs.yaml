  \ 2\n```\n查看下方的输出。\n![](img/image_rsrc64B.jpg)\n\n### 取模 (%)\n该运算符用于找到除法后的余数。例如：\n\
  \n```javascript\nlet x = 10;\nlet y = 3;\nlet z = x % y;\nconsole.log(z); // Output:\
  \ 1\n```\n查看下方的输出。\n![](img/image_rsrc64C.jpg)\n\n## 比较运算符\nJavaScript 还有若干比较运算符，可用于比较两个值。这些运算符包括等于\
  \ (`==`)、不等于 (`!=`)、大于 (`>`)、小于 (`<`)、大于等于 (`>=`) 和小于等于 (`<=`)。让我们详细查看每一个运算符。\n\n\
  ### 等于 (==)\n该运算符用于检查两个值是否相等。例如：\n\n```javascript\nlet x = 5;\nlet y = 5;\nconsole.log(x\
  \ == y); // Output: true\n```\n查看下方的输出。\n![](img/image_rsrc64D.jpg)\n\n### 不等于 (!=\n\
  该运算符用于检查两个值是否不相等。例如：\n\n```javascript\nlet x = 5;\nlet y = 10;\nconsole.log(x !=\
  \ y); // Output: true\n```\n查看下方的输出。\n![](img/image_rsrc64E.jpg)\n\n### 大于 (>) 和\
  \ 小于 (<)\n这些运算符用于比较两个值，判断其中一个是否大于小于另一个。例如：\n\n```javascript\nlet x = 5;\nlet y =\
  \ 10;\nconsole.log(x < y); // Output: true\nconsole.log(x > y); // Output: false\n\
  ```\n查看下方的输出。\n![](img/image_rsrc64F.jpg)\n\n### 大于等于 (>=) 和 小于等于 (<=)\n这些运算符用于检查一个值是否大于等于或小于等于另一个值。例如：\n\
  \n```javascript\nlet x = 5;\nlet y = 5;\nconsole.log(x <= y); // Output: true\n\
  console.log(x >= y); // Output: true\n```\n查看下方的输出。\n![](img/image_rsrc64G.jpg)\n\
  \n## 逻辑运算符\n在编程中，逻辑运算符用于组合两个或多个条件以形成更复杂的条件。JavaScript 中有三个主要的逻辑运算符：\n\n### 与 运算符\
  \ (&&)\n与运算符表示为 `&&`，用于检查两个条件是否都为真。只有当两个条件都为真时，它才返回真。如果一个或两个条件为假，它返回假。\n\n示例：\n\
  ```javascript\nlet x = 5;\nlet y = 10;\nif(x > 0 && y > 5) {\n  console.log(\"Both\
  \ conditions are true\");\n}\nelse {\n  console.log(\"At least one condition is\
  \ false\");\n}\n// Output: Both conditions are true\n```\n在这个示例中，第一个条件 `(x > 0)`\
  \ 为真，第二个条件 `(y > 5)` 也是真。因此，控制台将输出 \"Both conditions are true\"。\n\n### 或 运算符 (||)\n\
  或运算符表示为 `||`，用于检查两个条件中至少有一个是否为真。如果其中一个或两个条件为真，它就返回真。如果两个条件都为假，它返回假。\n\n示例：\n```javascript\n\
  let x = 5;\nlet y = 10;\nif(x > 0 || y < 5) {\n  console.log(\"At least one condition\
  \ is true\");\n}\nelse { \n  console.log(\"Both conditions are false\");\n}\n//\
  \ Output: At least one condition is true\n```\n在这个示例中，第一个条件 `(x > 0)` 为真，第二个条件 `(y\
  \ < 5)` 为假。但由于至少有一个条件为真，控制台将输出 \"At least one condition is true\"。\n![](img/image_src64H)\n\
  \n### 非 运算符 (!)\n非运算符表示为 `!`，用于反转条件的逻辑状态。如果条件为真，它会使其为假；如果条件为假，它会使其为真。\n\n示例：\n```javascript\n\
  let x = 5;\nif(!(x > 0)) {\n  console.log(\"condition is false\");\n}\nelse {\n\
  \  console.log(\"condition is true\");\n}\n// Output: condition is true\n```\n在这个示例中，条件\
  \ `(x > 0)` 为真，但 `!` 使其为假，从而触发了 `else` 块。(image_src64J)\n\n## 条件语句 (IF/ELSE)\n条件语句也称为控制语句，用于控制程序的流程。它们允许程序做出决策。\n\
  \n### if 语句\n`if` 语句的语法如下：\n```javascript\nif (condition) {\n  // 如果条件为真则执行代码块\n\
  }\n```\n这是一个示例：\n```javascript\nlet a = 5;\nif (a > 3) {\n  console.log(\"a is greater\
  \ than 3\");\n}\n```\n在这个示例中，条件 `a > 3` 为真，因此执行大括号内的代码。(image_src64K)\n\n### else\
  \ 语句\n`else` 语句与 `if` 语句结合使用，在条件为假时执行代码块。`else` 语句的语法如下：\n```javascript\nif (condition)\
  \ {\n  // 如果条件为真则执行代码块\n}\nelse {\n  // 如果条件为假则执行代码块\n}\n```\n这是一个示例：\n```javascript\n\
  let a = 2;\nif (a > 3) {\n  console.log(\"a is greater than 3\");\n}\nelse {\n \
  \ console.log(\"a is less than or equal to 3\");\n}\n```\n在这个示例中，条件 `a > 3` 为假，因此执行\
  \ `else` 块。(image_src64M)\n\n### else if 语句\n`else if` 语句与 `if` 语句结合使用，当另一个条件为真时执行代码块。`else\
  \ if` 语句的语法如下：\n```javascript\nif (condition1) {\n  // 如果 condition1 为真则执行代码块\n\
  } else if (condition2) {\n  // 如果 condition2 为真则执行代码块\n}\nelse {\n  // 如果所有条件为假则执行代码块\n\
  }\n```\n这是一个示例：\n```javascript\nlet a = 7;\nif (a > 10) {\n  console.log(\"a is\
  \ greater than 10\");\n} else if (a > 5) {\n  console.log(\"a is greater than 5\
  \ but less than or equal to 10\");\n} else {\n  console.log(\"a is less than or\
  \ equal to 5\");\n}\n```\n\n\n\n\n## 条件语句\n\n在这个例子中，条件 `a > 10` 为假，但条件 `a > 5` 为真，因此第二个代码块将被执行，消息\
  \ \"a 大于 5 但小于或等于 10\" 将被打印到控制台。上述代码的输出如下所示。\n\n![](img/image_rsrc64N.jpg)\n\n##\
  \ Switch 语句\n\nSwitch 语句是一种控制流语句，用于 JavaScript、Java 和 C++ 等编程语言。它允许程序求值一个表达式，并根据表达式的值执行不同的操作。\n\
  \nJavaScript 中 switch 语句的语法如下：\n\n```javascript\nswitch(expression) {\n\ncase value1:\n\
  \n// code block\n\nbreak;\n\ncase value2:\n\n// code block\n\nbreak;\n\ndefault:\n\
  \n// code block\n\n}\n```\n\n表达式只会求值一次，其值将与每个 case 的值进行比较。如果匹配，则执行关联的代码块。如果不匹配，则执行\
  \ default 块中的代码。\n\n下面是 switch 语句的示例：\n\n```javascript\nlet day = new Date().getDay();\n\
  \nlet dayName;\n\nswitch(day) {\n\ncase 0:\n\ndayName = \"Sunday\";\n\nbreak;\n\n\
  case 1:\n\ndayName = \"Monday\";\n\nbreak;\n\ncase 2:\n\ndayName = \"Tuesday\";\n\
  \nbreak;\n\ncase 3:\n\ndayName = \"Wednesday\";\n\nbreak;\n\ncase 4:\n\ndayName\
  \ = \"Thursday\";\n\nbreak;\n\ncase 5:\n\ndayName = \"Friday\";\n\nbreak;\n\ncase\
  \ 6:\n\ndayName = \"Saturday\";\n\nbreak;\n\ndefault:\n\ndayName = \"Invalid day\"\
  ;\n\n}\n\nconsole.log(dayName);\n```\n\n在这个例子中，switch 语句使用 `Date` 对象的 `getDay()`\
  \ 方法获取当前星期几。代码将日期匹配到相应的字符串值，并将其赋值给 `dayName` 变量。如果日期值不匹配任何 case，则 default case 将\
  \ `dayName` 变量赋值为 \"Invalid day\"。上述代码的结果如下图所示。\n\n![](img/image_rsrc64P.jpg)\n\n\
  Switch 语句通常用作 if-else 语句的替代方案，当需要检查多个条件时。它们还可以使代码在某些情况下更具可读性和效率。\n\n## 函数与作用域\n\n\
  在 JavaScript 中，函数是可重用的代码块，可以接受输入（实参）并返回一个值。它们是编程的基本构建块，允许创建模块化和可重用的代码。在本章中，我们将介绍声明和调用函数、处理参数和实参、返回值以及理解作用域和闭包的基础知识。\n\
  \n### 声明和调用函数\n\n在 JavaScript 中，可以使用 `function` 关键字声明函数，后跟函数名和一对圆括号。函数体用花括号 `{}`\
  \ 包裹。例如：\n\n```javascript\nfunction greet() {\n\nconsole.log(\"Hello, world!\");\n\
  \n}\n```\n\n要调用此函数，只需使用函数名后跟一对圆括号：\n\n```javascript\ngreet(); // Output: Hello,\
  \ world!\n```\n\n请参见下面的输出：\n\n![](img/image_rsrc64R.jpg)\n\n### 参数与实参\n\n函数也可以通过参数接受输入。参数在函数声明中声明，用于指定函数的预期输入。例如：\n\
  \n```javascript\nfunction greet(name) {\n\nconsole.log(\"Hello, \" + name + \"!\"\
  );\n\n}\n```\n\n在上面的例子中，`greet` 函数接受一个参数 `name`。要用实参调用函数，只需在调用函数时传递值作为实参：\n\n```javascript\n\
  greet(\"Sammie\"); // Output: Hello, Sammie!\n```\n\n请参见下面的输出：\n\n![](img/image_rsrc64S.jpg)\n\
  \n函数也可以接受多个参数，用逗号分隔：\n\n```javascript\nfunction add(a, b) {\n\nreturn a + b;\n\n\
  }\n\nconsole.log(add(2, 3)); // Output: 5\n```\n\n请参见下面的输出：\n\n![](img/image_rsrc64T.jpg)\n\
  \n### 返回值\n\n函数也可以使用 `return` 关键字返回值。这允许函数提供一个可用于代码其他部分的结果。例如：\n\n```javascript\n\
  function multiply(a, b) {\n\nreturn a * b; }\n\nconsole.log(multiply(2, 3)); //\
  \ Output: 6\n```\n\n在上面的例子中，`multiply` 函数返回 `a` 和 `b` 的乘积。请参见下面的输出。\n\n![](img/image_rsrc64U.jpg)\n\
  \n### 作用域与闭包\n\n作用域指的是变量在代码不同部分的可见性。在 JavaScript 中，有两种作用域：全局作用域和局部作用域。\n\n**全局作用域**\n\
  \n全局作用域指的是在函数外部声明的变量，可以从代码的任何地方访问：\n\n```javascript\nlet globalVar = \"I'm a global\
  \ variable\";\n\nfunction printGlobalVar() {\n\nconsole.log(globalVar); }\n\nprintGlobalVar();\
  \ // Output: I'm a global variable\n```\n\n请参见下面的输出：\n\n![](img/image_rsrc64V.jpg)\n\
  \n**局部作用域**\n\n局部作用域指的是在函数内部声明的变量，只能在该函数内部访问：\n\n```javascript\nfunction printLocalVar()\
  \ {\n\nlet localVar = \"I'm a local variable\";\n\nconsole.log(localVar);\n\n}\n\
  \nprintLocalVar(); // Output: I'm a local variable\n```\n\n请参见下面的输出。\n\n![](img/image_rsrc64W.jpg)\n\
  \n**闭包**\n\n闭包指的是函数访问其外部（封闭）函数中变量的能力，即使外部函数已经返回。例如：\n\n```javascript\nfunction outer()\
  \ {\n\nlet x = 10;\n\nfunction inner() {\n\nconsole.log(x);\n\n}\n\nreturn inner;\n\
  \n}\n\nlet innerFunc = outer();\n\ninnerFunc(); // Output: 10\n```\n\n在上面的例子中，`outer`\
  \ 函数返回 `inner` 函数，该函数可以访问外部函数作用域中的 `x` 变量，即使外部函数已经返回。请参见下面的输出；\n\n![](img/image_rsrc64X.jpg)\n\
  \n在上面的例子中，`outer` 函数返回 `inner` 函数，该函数可以访问外部函数作用域中的 `x` 变量，即使外部函数已经返回。\n\n请对本章进行详细阐述，附上示例（3000\
  \ 字）。\n\n## 数组与循环\n\n数组和循环是 JavaScript 中最基础的概念之一。数组用于存储数据集合，而循环用于遍历这些数据。在本章中，我们将深入探讨数组的使用、数组方法以及\
  \ JavaScript 中不同类型的循环。\n\n### 数组与数组方法\n\n数组用于在 JavaScript 中存储数据集合。数组是一种特殊的变量，可以容纳多个值。数组中的每个值称为元素，每个元素都有一个唯一的索引号，表示其在数组中的位置。\n\
  \n声明数组时，我们使用方括号并用逗号分隔元素。例如：\n\n```javascript\nlet fruits = [\"apple\", \"banana\"\
  , \"orange\"];\n```\n\n在上面的例子中，我们声明了一个名为 `fruits` 的数组，包含三个元素：\"apple\"、\"banana\"\
  \ 和 \"orange\"。\n\n我们可以使用索引号访问数组的各个元素。数组第一个元素的索引始终是 `0`。例如，要访问 `fruits` 数组的第一个元素，我们使用：\n\
  \n```javascript\nlet firstFruit = fruits[0];\n```\n\n这会将值 \"apple\" 赋值给 `firstFruit`\
  \ 变量。\n\n数组还有几个内置方法，允许我们操作其所包含的数据一些最常用的数组方法包括：\n\n- `push()`: 将一个或多个元素添加到数组的末尾。\n\
  - `pop()`: 删除数组的最后一个元素并返回它。\n- `shift()`: 删除数组的第一个元素并返回它。\n- `unshift()`: 将一个或多个元素添加到数组的开头。\n\
  - `splice()`: 在指定索引处添加或删除数组的元素。\n- `slice()`: 返回一个新数组，包含原数组的一部分。\n\n下面是演示如何使用其中一些方法的示例：\n\
  \n![](img/image_rsrc64Y.jpg)\n\n### For 循环\n\nfor 循环用于遍历数组或任何其他可迭代对象。它有三个部分：初始化、条件\
  \ 和 更新。下面是一个 for 循环的示例，它遍历数字数组并将每个数字打印到控制台：\n\n```javascript\nlet numbers = [1,\
  \ 2, 3, 4, 5];\n\nfor (let i = 0; i < numbers.length; i++) {\n\nconsole.log(numbers[i]);\n\
  \n}\n```\n\n\n\n\n在上面的示例中，我们使用 `numbers` 数组的`length`属性来确定所需的迭代次数。循环从 0 开始，一直持续到索引等于数组的`length`。见下方的输出。\n\
  \n![](img/image_rsrc64Z.jpg)\n\n## While 循环\n\n`while` 循环是一种控制流语句，允许你在特定条件为真时重复执行一个代码块。`while`\
  \ 循环的语法如下：\n\n```javascript\nwhile (condition) {\n  // 要执行的代码\n}\n```\n\n在这里，`condition`\
  \ 是一个布尔表达式，在循环的每次迭代之前都会进行求值。如果条件为真，则执行代码块。这个过程会不断重复，直到条件为假。\n\n让我们通过一个例子来理解 `while`\
  \ 循环是如何工作的：\n\n```javascript\nlet i = 0;\nwhile (i < 5) {\n  console.log(i);\n \
  \ i++;\n}\n```\n\n在这个示例中，`while` 循环将执行代码块，直到 `i` 小于 5。上述代码的输出将是：\n\n![](img/image_rsrc650.jpg)\n\
  \n## Do-While 循环\n\n`do-while` 循环与 `while` 循环类似，但有一个显著区别：即使条件为假，代码块也会至少执行一次。`do-while`\
  \ 循环的语法如下：\n\n```javascript\nwhile (condition) {\n  // 要执行的代码\n}\n```\n\n在这里，`condition`\
  \ 是一个布尔表达式，在循环的每次迭代之后都会进行求值。如果条件为真，则再次执行代码块。这个过程会不断重复，直到条件为假。\n\n让我们通过一个例子来理解 `do-while`\
  \ 循环是如何工作的：\n\n```javascript\nlet i = 0;\nwhile (i < 5) {\n  console.log(i);\n \
  \ i++;\n}\n```\n\n在这个示例中，即使 `i` 不小于 5，代码块也会至少执行一次。上述代码的输出将是：\n\n![](img/image_rsrc651.jpg)\n\
  \n## forEach 方法\n\n`forEach` 方法是 JavaScript 中的一个内置函数，允许你遍历数组并在每个元素上执行一个函数。`forEach`\
  \ 方法的语法如下：\n\n```javascript\narray.forEach(function(currentValue, index, array)\
  \ {\n  // 要执行的代码\n});\n```\n\n在这里，`currentValue` 表示当前正在处理的元素，`index` 表示元素的索引，`array`\
  \ 表示正在扫描的数组。数组的每个元素都会接收代码块的执行。\n\n为了进一步理解 `forEach` 方法是如何工作的，让我们来看一个例子：\n\n```javascript\n\
  let fruits = [\"apple\", \"banana\", \"orange\"];\nfruits.forEach(function(fruit)\
  \ {\n  console.log(fruit);\n});\n```\n\n在这个示例中，`forEach` 方法将为 `fruits` 数组的每个元素执行代码块。上述代码的输出将是：\n\
  \n![](img/image_rsrc652.jpg)\n\n为了让代码更简短，你也可以使用箭头函数语法：\n\n```javascript\nlet fruits\
  \ = [\"apple\", \"banana\", \"orange\"];\nfruits.forEach(fruit => console.log(fruit));\n\
  ```\n\n见下方的输出：\n\n![](img/image_rsrc653.jpg)\n\n# 第十七章：对象与类\n\nJavaScript 中的对象是属性的组，每个属性都是一个键值对。对象可能具有特征，这些特征可以是其他对象，也可以是基本数据类型（如文本、整数和布尔值）。此外，还可以拥有方法，方法被定义为对象的属性和函数。因为对象让程序员能够高效地组织和管理代码，这对\
  \ JavaScript 编程至关重要。\n\n 创建和使用对象\n\n在 JavaScript 中创建一个对象，你可以使用对象字面量符号或 `Object`\
  \ 构造函数。对象字面量符号是创建对象的快捷方式，通过在大括号中包含键值对列表来创建。例如：\n\n```javascript\nlet person = {\n\
  \  name: \"John\",\n  age: 30,\n  city: \"New York\"\n};\n```\n\n在这个示例中，我们创建了一个名为\
  \ `person` 的对象，包含三个属性：`name`、`age` 和 `city`。\n\n你也可以使用 `Object` 构造函数创建对象。`Object`\
  \ 构造函数创建一个空对象，你可以为其添加属性和方法。例如：\n\n```javascript\nlet person = new Object();\nperson.name\
  \ = \"John\";\nperson.age = 30;\nperson.city = \"New York\";\n```\n\n这段代码使用 `new`\
  \ 关键字创建了一个名为 `person` 的空对象，然后使用点符号向其添加了三个属性。\n\n### 对象方法\n\nJavaScript 中的对象也可以拥有方法，方法是定义为对象属性的函数。方法可以访问对象的属性和其他方法。在\
  \ JavaScript 中，对象可以拥有方法，即属于对象并可以对其属性进行操作的函数。为对象创建方法，我们将函数定义为对象的属性。\n\n这是一个例子：\n\n\
  ```javascript\nlet person = {\n  firstName: 'John',\n  lastName: 'Smith',\n  fullName:\
  \ function() {\n    return this.firstName + ' ' + this.lastName;\n  }\n};\nconsole.log(person.fullName());\
  \ // 输出: \"John Smith\"\n```\n\n在这个示例中，我们为 `person` 对象定义了一个 `fullName` 方法。`fullName`\
  \ 方法将连接 `firstName` 和 `lastName`。\n\n我们可以使用箭头函数语法：\n\n```javascript\nlet person\
  \ = {\n  firstName: 'John',\n  lastName: 'Smith',\n  fullName: () => {\n    return\
  \ this.firstName + ' ' + this.lastName;\n  }\n};\nconsole.log(person.fullName());\
  \ // 输出: \"undefined\"\n```\n\n在对象方法中使用箭头方法使用 `this 关键字` 通常是不推荐的，因为会产生问题。\n\n对象方法也可以通过\
  \ `call()` 方法在对象之外调用。例如：\n\n```javascript\nlet person1 = {\n  firstName: 'John',\n\
  \  lastName: 'Smith',\n  fullName: function() {\n    return this.firstName + ' '\
  \ + this.lastName;\n  }\n};\nlet person2 = {\n  firstName: 'Jane',\n  lastName:\
  \ 'Smith'\n};\nconsole.log(person1.fullName.call(person2)); // 输出: \"Jane Smith\"\
  \n```\n\n在这个示例中，我们定义了对象 `person1` 和 `person2`。`person1` 有一个 `fullName` 方法，而 `person2`\
  \ 没有。我们可以使用 `call()` 方法调用 `person1` 的 `fullName` 方法，并将 `person2` 作为其 `this` 值。\n\
  \n![](img/image_rsrc654.jpg)\n\n还可以使用 ES6 语法定义对象方法：\n\n```javascript\nlet person\
  \ = {\n  firstName: 'John',\n  lastName: 'Smith',\n  fullName() {\n    return this.firstName\
  \ + ' ' + this.lastName;\n  }\n};\nconsole.log(person.fullName()); // 输出: \"John\
  \ Smith\"\n```\n\n在这个示例中，我们定义了一个名为 `person` 的对象，具有 `firstName`、`lastName` 属性和 `fullName`\
  \ 方法。见输出。\n\n![](img/image_rsrc655.jpg)\n\n对象方法还可以使用简写形式：\n\n```javascript\nlet\
  \ person = {\n  firstName: 'Sammie',\n  lastName: 'Smith',\n  fullName() {\n   \
  \ return this.firstName + ' ' + this.lastName;\n  }\n};\nconsole.log(person.fullName());\
  \ // 输出: \"Sammie Smith\"\n```\n\n这种方法与之前的示例相同。见输出的截图。\n\n## 创建类\n\n除了使用对象字面量符号或\
  \ `Object` 构造函数创建对象外，你还可以使用类创建对象。类是创建对象的蓝图，它定义了对象将拥有的属性和方法。在 JavaScript 中定义类，你使用\
  \ `class` 关键字，后面跟着类名。\n\n在 JavaScript 中，你可以使用 `class` 关键字创建类。类是定义想要创建对象的蓝图的方法。它们提供了一种将数据和行为封装在单一实体的方法。类可以像对象一样拥有属性和方法。\n\
  \n这是一个在 JavaScript 中创建类的例子：\n\n```javascript\nclass Person {\n  constructor(firstName,\
  \ lastName, age) {\n    this.firstName = firstName;\n    this.lastName = lastName;\n\
  \    this.age = age;\n  }\n\n  getFullName() {\n    return `${this.firstName} ${this.lastName}`;\n\
  \  }\n\n  canVote() {\n    return this.age >= 18;\n  }\n}\n```\n\n在这个示例中，我们定义了一个\
  \ `Person` 类，其构造函数接收三个参数：`firstName`、`lastName` 和 `age`。构造函数将这些值赋值给正在创建对象的属性。\n\n\
  该类还有两个方法：`getFullName` 和 `canVote`。`getFullName` 通过连接姓和名返回人的全名，而 `canVote` 检查人是否满\
  \ 18 岁或以上并返回真或假。\n\n\n\n\n要从此类创建一个对象，你需要使用 `new` 关键字并带有必要的参数调用构造函数：\n\n```javascript\n\
  const sammie = new Person('Sammie', 'Smith', 25);\nconsole.log(john.getFullName());\
  \ // 输出: \"Sammie Smith\"\nconsole.log(sammie.canVote()); // 输出: true\n```\n\n在这里，我们创建了一个名为\
  \ `sammie` 的新 `Person` 对象，其名为 \"Sammie\"，姓为 \"Smith\"，年龄为 25。然后我们在 `sammie` 对象上调用了\
  \ `getFullName` 和 `canVote` 方法。请查看下方的输出截图。\n\n![](img/image_rsrc658.jpg)\n\nJavaScript\
  \ 中的类还支持继承，这允许你基于现有的类创建一个新类。你可以使用 `extends` 关键字创建一个子类，它可以从父类继承属性和方法。\n\n例如，我们可以创建一个扩展\
  \ `Person` 类的 `Student` 类，并添加一个新属性 `major`：\n\n```javascript\nclass Person {\n \
  \ constructor(firstName, lastName, age) {\n    this.firstName = firstName;\n   \
  \ this.lastName = lastName;\n    this.age = age;\n  }\n  getFullName() {\n    return\
  \ `${this.firstName} ${this.lastName}`;\n  }\n  canVote() {\n    return this.age\
  \ >= 18;\n  }\n}\n\nclass Student extends Person {\n  constructor(firstName, lastName,\
  \ age, major) {\n    super(firstName, lastName, age);\n    this.major = major;\n\
  \  }\n  getMajor() {\n    return this.major;\n  }\n}\n```\n\n在这里，我们使用 `extends`\
  \ 关键字定义了一个扩展 `Person` 类的 `Student` 类。构造函数接受四个参数：`firstName`、`lastName`、`age` 和 `major`。我们带有必要的参数调用\
  \ `super` 方法来执行父类的构造函数并继承它的属性。\n\n`Student` 类还有一个名为 `getMajor` 的新方法，它返回 `major`\
  \ 属性的值。要创建一个 `Student` 对象，可以使用与创建 `Person` 对象相同的语法：\n\n```javascript\nconst alice\
  \ = new Student('Alice', 'Smith', 20, 'Computer Science');\nconsole.log(alice.getFullName());\
  \ // 输出: \"Alice Smith\"\nconsole.log(alice.getMajor()); // 输出: \"Computer Science\"\
  \nconsole.log(alice.canVote()); // 输出: true\n```\n\n在这里，我们创建了一个名为 `alice` 的新 `Student`\
  \ 对象，其名为 \"Alice\"，姓为 \"Smith\"，年龄 20，专业为 \"Computer Science\"。我们在 `alice` 对象上调用了\
  \ `getFullName`、`getMajor` 和 `canVote` 方法。请查看下方的代码输出。\n\n![](img/image_rsrc659.jpg)\n\
  \n# 构造函数与原型\n\n构造函数和原型是 JavaScript 面向编程的重要组成部分。在本节中，我们将探索构造函数和原型是如何工作的，以及如何使用它们来创建对象和类。\n\
  \n构造函数是用于创建新对象的函数。它们定义对象的属性和方法，还可以为这些属性定义默认值。当使用 `new` 关键字调用构造函数时，会创建一个新对象，构造函数会初始化对象的属性。\n\
  \n这是一个构造函数的示例：\n\n```javascript\nfunction Person(name, age) {\n  this.name = name;\n\
  \  this.age = age;\n}\n\nlet person1 = new Person(\"John\", 30);\nlet person2 =\
  \ new Person(\"Jane\", 25);\n```\n\n在这个示例中，我们创建了一个名为 `Person` 的构造函数，它接受两个参数 `name`\
  \ 和 `age`。在构造函数内部，我们使用 `this` 设置了对象的 `name` 和 `age` 属性。当使用 `new` 关键字调用构造函数时，会创建一个新对象，构造函数会初始化对象的属性。\n\
  \n原型是用于让对象共享属性和方法的机制。它允许你在一个对象上定义方法，并让该对象的所有实例访问这些方法。这可以节省内存，因为不需要为每个实例都创建一个相同的方法副本。\n\
  \n这是一个使用原型的示例：\n\n```javascript\nfunction Animal(name) {\n  this.name = name;\n\
  }\n\nAnimal.prototype.eat = function() {\n  console.log(this.name + \" is eating.\"\
  );\n};\n\nlet dog = new Animal(\"Buddy\");\ndog.eat(); // 输出: \"Buddy is eating.\"\
  \n```\n\n\n\n\n# JavaScript DOM 操作\n\n```javascript\nconst element = document.getElementById(\"\
  myElement\");\nelement.innerHTML = \"<h1>Hello World!</h1>\";\n```\n\n## textContent\n\
  \n`textContent` 属性用于获取或设置元素的文本内容。它返回所有子节点的文本内容，排除 HTML 标签。例如，假设我们有一个 ID 为 `myElement`\
  \ 的 HTML 元素。我们可以使用以下代码更改其文本内容：\n\n```javascript\nconst element = document.getElementById(\"\
  myElement\");\nelement.textContent = \"Hello World!\";\n```\n\n## setAttribute\n\
  \n`setAttribute` 方法用于设置元素的属性值。例如，假设我们有一个 ID 为 `myElement` 的 HTML 元素。我们可以使用以下代码设置它的\
  \ `src` 属性：\n\n```javascript\nconst element = document.getElementById(\"myElement\"\
  );\nelement.setAttribute(\"src\", \"image.jpg\");\n```\n\n## 事件处理\n\n事件处理是 Web 开发的一个关键方面，它使\
  \ Web 应用程序能够响应用户交互。用户可以通过点击按钮、在文本框中输入内容、在元素上悬停、滚动等方式与网页进行交互。DOM 允许我们操作网页上的元素，而通过事件处理，我们可以创建能够响应用户交互的交互式\
  \ Web 应用。\n\n在 JavaScript 中，事件是浏览器中发生的动作，例如点击按钮、提交表单或滚动页面。事件监听器是一个监听特定事件发生的函数，并在检测到事件时执行操作。\n\
  \n有多种方法可以向 HTML 元素附加事件监听器。最常用的方法是使用 `addEventListener()` 方法。该方法接受两个参数：要监听的事件名称以及检测到事件时应执行的函数。以下是一个如何为按钮添加事件监听器的示例，当按钮被点击时会向控制台打印消息：\n\
  \n```javascript\nconst myButton = document.querySelector('#myButton');\nmyButton.addEventListener('click',\
  \ function() {\nconsole.log('Button clicked!');\n});\n```\n\n在这个示例中，我们首先使用 `querySelector()`\
  \ 方法选择 ID 为 `myButton` 的按钮元素。然后，我们使用 `addEventListener()` 方法为按钮附加一个点击事件监听器。当按钮被点击时，作为\
  \ `addEventListener()` 第二参数传递的函数将执行执行，并在控制台打印“Button clicked!”消息。\n\n我们还可以使用 `removeEventListener()`\
  \ 方法从元素中移除事件监听器。该方法接受与 `addEventListener()` 相同的参数：要移除的事件名称以及最初用事件监听器的函数。\n\n```javascript\n\
  const myButton = document.querySelector('#myButton');\nfunction handleClick() {\n\
  console.log('Button clicked!');\n}\nmyButton.addEventListener('click', handleClick);\n\
  // 之后，我们可以移除事件监听器\nmyButton.removeEventListener('click', handleClick);\n```\n\n\
  在示例示例中，我们首先定义了一个函数 `handleClick()`，它在调用时会向控制台打印消息。然后，我们使用 `addEventListener()` 将\
  \ `handleClick()` 作为按钮点击事件的事件监听器。最后，我们使用 `removeEventListener()` 移除事件监听器。\n\n除了\
  \ `addEventListener()` 和 `removeEventListener()` 之外，处理事件时常用的一些其他方法和属性。这些包括：\n\n\
  - `event.target`：此属性返回触发事件的元素。\n- `event.preventDefault()`：此方法阻止元素的默认行为。例如，在表单上调用\
  \ `event.preventDefault()` 可以防止表单在点击提交按钮时提交。\n- `event.stopPropagation()`：此方法停止事件传播。例如，在子元素上调用\
  \ `event.stopPropagation()` 可以防止事件传播到其父元素。\n\n以下是如何使用其中一些方法的示例：\n\n```javascript\n\
  const myButton = document.querySelector('#myButton');\nmyButton.addEventListener('click',\
  \ function(event) {\nconsole.log('Button clicked!');\nconsole.log('Target:', event.target);\n\
  event.preventDefault();\nevent.stopPropagation();\n});\n```\n\n在示例中，我们为按钮附加了一个点击事件监听器。当按钮被点击时，作为\
  \ `addEventListener()` 第二参数传递的函数将执行。在函数内部，我们向控制台打印消息，并使用 `event.target` 属性打印触发事件的目标元素。我们还调用了\
  \ `event.preventDefault()` 和 `event.stopPropagation()` 来阻止按钮的默认行为并停止事件传播到其父元素。\n\
  \n## DOM 操作的实际实现\n\n以下是 DOM 操作实现的示例：\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta http-equiv=\"X-UA-Compatible\" content=\"\
  IE=edge\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n<title>DOM Manipulation Example</title>\n</head>\n<body>\n<h1 id=\"my-heading\"\
  >Hello World!</h1>\n<button id=\"my-button\">Change Text</button>\n<script src=\"\
  app.js\"></script>\n</body>\n<script>\n// 选择按钮和标题元素\nconst button = document.getElementById('my-button');\n\
  const heading = document.getElementById('my-heading');\n// 为按钮添加事件监听器\nbutton.addEventListener('click',\
  \ () => {\n// 修改标题元素的文本\nheading.textContent = 'New Text!';\n});\n</script>\n</html>\n\
  ```\n\n在示例中，我们首先使用 `getElementById()` 方法通过 id 属性选择按钮和标题元素。然后，我们使用 `addEventListener()`\
  \ 方法为按钮添加了事件监听器，用于监听“点击”事件。当按钮被点击时，监听器内部的匿名箭头函数执行，使用 `textContent` 属性更改标题元素的文本。请看下图。\n\
  \nimage_rsrc65C.jpg\n\n点击 Change text 后，你应该得到如下结果：\n\nimage_rsrc65D.jpg\n\n这只是一个简单的示例，但\
  \ DOM 操作可以用于网页的许多操作，例如更改 CSS 样式、创建和删除 HTML 元素等。\n\n# 第十九章：异步 JavaScript\n\n异步编程是\
  \ JavaScript 中用于执行耗时较长才能完成的代码的技术。JavaScript 代码通常在单线程环境中执行，这意味着长时间运行的代码会导致程序其他部分的出现延迟。异步编程允许我们在后台执行长时间运行的代码的同时继续执行其他代码，从而避免这些延迟。\n\
  \n在本章中，我们将探索 JavaScript 中不同的异步编程方法，包括回调函数、承诺（Promises）和 async/await。\n\n## 理解异步编程\n\
  \n在同步编程中，代码按顺序执行，一次执行一条指令。相比之下，异步编程允许代码无序执行，程序的不同部分可以同时执行。\n\n在 JavaScript 中，异步编程通常用于处理耗时较长才能完成的操作，例如网络请求、文件系统操作或数据库查询。\n\
  \n\n\n\n\n异步编程的好处是它可以提高应用程序的性能和响应能力。如果没有它，应用程序必须等待每个长耗时任务完成后才能继续执行下一个任务，这会导致应用程序看起来运行缓慢且无响应。通过使用异步编程，应用程序可以在后台执行这些长耗时任务的同时，继续响应用户的输入。\n\
  \n异步编程的一个常见示例是网络请求。当用户点击按钮从服务器获取数据时，应用程序可以使用异步函数来发送请求，并在等待响应的过程中继续执行代码。当响应到达时，该函数会收到通知并处理数据。\n\
  \n然而，异步编程可能会变得复杂且难以管理，特别是当有多个异步任务同时运行时。这就是为什么 JavaScript 提供了几种工具来简化这一过程，包括回调函数、`promises`\
  \ 和 `async/await`。\n\n## 回调函数 (CALLBACK FUNCTIONS)\n\n回调函数是作为参数传递给其他函数，并在特定事件发生时执行的函数。这些事件可以是任何内容，从用户点击按钮到\
  \ HTTP 请求返回响应。回调函数是 JavaScript 异步编程中的一个基本概念。\n\n让我们来看一个回调函数的实际示例。假设我们有一个数字数组，并想要遍历数组并将每个数字翻倍。我们可以使用\
  \ `map` 方法来实现：\n\n```\nconst numbers = [1, 2, 3, 4, 5];\n\nconst doubledNumbers\
  \ = numbers.map(function(number) {\n\nreturn number * 2;\n\n});\n\nconsole.log(doubledNumbers);\
  \ // 输出: [2, 4, 6, 8, 10]\n```\n\n在这个示例中，我们向 `map` 方法传递了一个回调函数。`map` 方法将为 `numbers`\
  \ 数组中的每个元素执行该函数，并返回一个带有转换后值的新数组。\n\n让我们来看另一个示例，其中我们使用回调函数来处理异步操作。假设我们有一个函数向 API\
  \ 发送 HTTP 请求并返回响应数据。我们希望在数据返回后对其进行某些操作，但我们并不知道数据确切何时返回。我们可以使用回调函数来处理这种情况：\n\n```javascript\n\
  function makeHttpRequest(url, callback) {\n\nconst xhr = new XMLHttpRequest();\n\
  \nxhr.addEventListener('load', function() {\n\nif (xhr.status === 200) {\n\ncallback(xhr.responseText);\n\
  \n}\n\n});\n\nxhr.open('GET', url);\n\nxhr.send();\n\n}\n\nmakeHttpRequest('https://jsonplaceholder.typicode.com/posts/1',\
  \ function(responseData) {\n\nconst data = JSON.parse(responseData);\n\nconsole.log(data);\n\
  \n});\n```\n\n在这个示例中，我们将一个回调函数作为第二个参数传递给 `makeHttpRequest` 函数。一旦 HTTP 请求完成并且我们获得了响应数据，我们就会将数据作为参数调用回调函数。在这种情况下，我们只是将数据打印到控制台，但我们可以在回调函数内部对数据进行任何操作。\n\
  \n回调函数还可以用于处理异步操作期间发生的错误。让我们修改一下 `makeHttpRequest` 函数，使用回调函数来处理错误：\n\n```javascript\n\
  function makeHttpRequest(url, successCallback, errorCallback) {\n\nconst xhr = new\
  \ XMLHttpRequest();\n\nxhr.addEventListener('load', function() {\n\nif (xhr.status\
  \ === 200) {\n\nsuccessCallback(xhr.responseText);\n\n} else {\n\nerrorCallback(xhr.statusText);\n\
  \n}\n\n});\n\nxhr.addEventListener('error', function() {\n\nerrorCallback('Network\
  \ Error');\n\n});\n\nxhr.open('GET', url);\n\nxhr.send();\n\n}\n\nmakeHttpRequest('https://jsonplaceholder.typicode.com/posts/1',\
  \ function(responseData) {\n\nconst data = JSON.parse(responseData);\n\nconsole.log(data);\n\
  \n}, function(error) {\n\nconsole.error(error);\n\n});\n```\n\n在这个示例中，我们将两个回调函数作为参数传递给\
  \ `makeHttpRequest` 函数。如果 HTTP 请求成功，将调用 `successCallback` 函数；如果发生错误，则将调用 `errorCallback`\
  \ 函数。我们还单独处理了错误事件，并带有相应的错误消息调用 `errorCallback` 函数。\n\n## 理解 Promise (UNDERSTANDING\
  \ PROMISES)\n\nPromise 是 ECMAScript 6 中引入的的一种较新的异步编程方法。Promise 是 JavaScript 中处理异步操作的一种方式。promise\
  \ 是一个代表未来值的对象，该值现在可能已经可用，也可能尚未可用。与传统的回调函数相比，Promise 为处理异步操作提供了一种更简洁、更灵活的方式。一个 promise\
  \ 有三种状态：\n\n- `Pending`（等待中）：初始状态，promise 既没有完成也没有被拒绝。\n- `Fulfilled`（已完成）：promise\
  \ 已完成，结果值可用。\n- `Rejected`（已拒绝）：promise 失败，错误消息可用。\n\n这是一个代表模拟 HTTP 请求的 promise\
  \ 示例：\n\n```javascript\nconst getData = () => {\n\nreturn new Promise((resolve,\
  \ reject) => {\n\nsetTimeout(() => {\n\nconst data = { id: 1, name: 'John Smith\
  \ ' };\n\nresolve(data);\n\n}, 2000);\n\n});\n\n};\n```\n\n在这个示例中，`getData()` 返回一个新的\
  \ promise。在 promise 内部，有一个 `setTimeout()` 函数来模拟 2 秒钟的延迟。一旦延迟完成，就会调用 `resolve()`\
  \ 函数并将示例数据对象 `data` 作为参数。\n\n要使用这个 promise，你可以在上面调用 `then()` 方法，并传入一个回调函数，该函数将在\
  \ promise 完成后执行：\n\n```javascript\ngetData().then(data => {\n\nconsole.log(data);\
  \ // 输出: { id: 1, name: 'John Smith' }\n\n});\n```\n\n在这个示例中，`then()` 方法接收一个接收 `data`\
  \ 的回调函数。\n\n## ASNC/AWAIT\n\nAsync/await 是 JavaScript 中处理异步代码的一种较新的方式，于 ES2017 引入。它构建在\
  \ Promise 之上，为处理异步操作提供了更具读性和更简洁的语法。`async` 关键字用于声明异步函数，该函数会自动返回一个 Promise。在异步函数内部，`await`\
  \ 关键字用于等待 Promise 完成，然后再继续执行下一行代码。\n\n这是一个异步函数的示例，它使用 `fetch` 方法从 API 获取数据并使用 Promise\
  \ 返回结果：\n\n```javascript\nasync function getData() {\n\nconst response = await fetch('https://api.example.com/data');\n\
  \nconst data = await response.json();\n\nreturn data;\n}\n```\n\n\n\n\n# JavaScript\
  \ 中的 Async/Await\n\n在上述代码中，`await` 关键字用于等待 `fetch` 方法的完成，该方法返回一个解析为 `Response` 对象的\
  \ `Promise`。`Response` 对象的 `JSON` 方法也返回一个 `Promise`，该 `Promise` 解析为实际的 `JSON` 数据。通过使用\
  \ `await` 关键字，我们等待两个 `Promise` 解析后再返回数据。\n\n我们也可以将 `try`/`catch` 块与 `async`/`await`\
  \ 函数一起使用来处理错误。以下是一个示例：\n\n```javascript\nasync function getData() {\n\ntry {\n\n\
  const response = await fetch('https://api.example.com/data');\n\nconst data = await\
  \ response.json();\n\nreturn data;\n\n} catch (error) {\n\nconsole.error('Error\
  \ fetching data:', error);\n\n}\n\n}\n```\n\n在上述代码中，如果在获取或解析数据时发生错误，错误将在 `catch`\
  \ 块中被捕获并记录到 `console`。\n\n`Async`/`await` 也可以与 `Promise.all` 一起使用，以并行获取多个资源。以下是一个示例：\n\
  \n```javascript\nasync function getData() {\n\nconst [userData, postData] = await\
  \ Promise.all([\n\nfetch('https://api.example.com/users'),\n\nfetch('https://api.example.com/posts')\n\
  \n]);\n\nconst users = await userData.json();\n\nconst posts = await postData.json();\n\
  \nreturn { users, posts };\n\n}\n```\n\n在上述代码中，我们使用 `Promise.all` 同时获取用户和帖子数据。然后使用\
  \ `await` 关键字等待两个 `Promise` 解析后再解析 `JSON` 数据并将其作为对象返回。\n\n# 第二十章：AJAX 和 APIs\n\n\
  本章聚焦于 `AJAX`（Asynchronous JavaScript and XML，异步 JavaScript 和 XML）和 `APIs`（Application\
  \ Programming Interfaces，应用程序编程接口），它们是构建动态和交互式 Web 应用程序的重要工具。`AJAX` 是一种与服务器交换数据、在不刷新整个页面的情况下更新网页部分内容并提供无缝用户体验的技术。另一方面，`APIs`\
  \ 提供了不同软件应用程序相互通信的方式，使开发者能够访问第三方服务的数据和功能，并将其集成到自己的应用程序中。\n\n在本章中，我们将介绍 `AJAX` 和\
  \ `APIs` 的基础知识，包括如何使用 `APIs`、如何使用 `AJAX` 获取数据以及如何在网页上显示数据。我们还将讨论一些常见的 `API` 集成场景，如社交媒体集成、天气数据集成等。到本章结束时，你将对如何使用\
  \ `AJAX` 和 `APIs` 创建强大的、动态的和交互式的 Web 应用程序有一个扎实的理解。\n\n## AJAX 简介\n\n`AJAX` 是 Asynchronous\
  \ `JavaScript` and `XML`（异步 JavaScript 和 XML）的缩写。它是一种用于 Web 开发的技术，用于创建可以与 Web 服务器交换数据而无需重新加载整个页面的动态网页。`AJAX`\
  \ 基于 `JavaScript`，并使用 `XMLHttpRequest`（`XHR`）对象和 `DOM` 的组合来与服务器异步交互并更新网页。\n\n在 `AJAX`\
  \ 出现之前，每次请求新数据时都必须重新加载整个网页，导致用户体验缓慢且低效。有了 `AJAX`，网页可以更新部分内容而无需重新加载整个页面，使用户体验更加流畅和快速。\n\
  \n`AJAX` 在 Web 开发中广泛用于多种场景，例如实时聊天应用程序、动态网页表单和自动建议搜索栏。它还允许开发者创建可以与 `APIs` 交互并实时获取和显示数据的\
  \ Web 应用程序。\n\n## 使用 APIs\n\n`API` 是 \"Application Programming Interface\"（应用程序编程接口）的缩写。它是一组用于构建软件应用程序的协议、例程和工具。`APIs`\
  \ 提供了不同软件组件相互交互的方式。在 Web 开发中，`API` 通常用于与服务器通信并检索数据或执行其他操作。\n\n要使用 `API`，你需要知道 `API`\
  \ 的端点或 URL，以及任何所需的认证或 `API` 密钥。你还需要知道 `API` 返回的数据格式，例如 `JSON` 或 `XML`。\n\n### 使用\
  \ Fetch API 获取数据\n\n```javascript\nfetch('https://api.example.com/data')\n.then(response\
  \ => response.json())\n.then(data => console.log(data))\n.catch(error => console.error(error));\n\
  ```\n\n在这个示例中，我们使用 `Fetch API` 向 `API` 端点 `https://api.example.com/data` 发送 GET\
  \ 请求。然后使用 `response.json()` 方法将响应转换为 `JSON`。结果数据被记录到 `console`。\n\n### 使用 Fetch\
  \ API 发送数据\n\n```javascript\nfetch('https://api.example.com/data', {\nmethod: 'POST',\n\
  body: JSON.stringify({ name: 'John Doe', email: 'johndoe@example.com' }),\nheaders:\
  \ { 'Content-Type': 'application/json' }\n})\n.then(response => response.json())\n\
  .then(data => console.log(data))\n.catch(error => console.error(error));\n```\n\n\
  在这个示例中，我们使用 `Fetch API` 向 `API` 端点 `https://api.example.com/data` 发送 POST 请求。我们在请求正文中包含一个\
  \ `JSON` 对象，其中包含 name 和 email 属性。我们还将 Content-Type 头设置为 `application/json`。然后使用\
  \ `response.json()` 方法将响应转换为 `JSON`。结果数据被记录到 `console`。\n\n### 使用 Axios\n\n```javascript\n\
  axios.get('https://api.example.com/data')\n.then(response => console.log(response.data))\n\
  .catch(error => console.error(error));\n```\n\n在这个示例中，我们使用 `Axios` 库向 `API` 端点 `https://api.example.com/data`\
  \ 发送 GET 请求。响应数据被记录到 `console`。\n\n### 实践练习：天气应用\n\n在这个练习中，我们将构建一个简单的天气应用，从 `API`\
  \ 获取天气数据并显示在网页上。用户可以输入一个地点，应用将显示该地点的当前天气状况。我们将使用 `OpenWeatherMap API` 来获取天气数据。该\
  \ `API` 提供免费计划，允许我们每分钟最多进行 60 次请求。\n\n### HTML 代码\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta http-equiv=\"X-UA-Compatible\"\
  \ content=\"IE=edge\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n<title>Weather App</title>\n<link rel=\"stylesheet\" href=\"index.css\">\n</head>\n\
  <body>\n<h1>Weather App</h1>\n<form>\n<label for=\"location1\">Enter location:</label>\n\
  <input type=\"text\" id=\"location1\" name=\"location\">\n<button type=\"button\"\
  \ class=\"get-weather\">Get Weather</button>\n</form>\n<div id=\"weather1\"></div>\n\
  <form>\n<label for=\"location2\">Enter location:</label>\n<input type=\"text\" id=\"\
  location2\" name=\"location\">\n<button type=\"button\" class=\"get-weather\">Get\
  \ Weather</button>\n</form>\n<div id=\"weather2\"></div>\n<script src=\"index.js\"\
  ></script>\n</body>\n</html>\n```\n\n### CSS 代码\n\n```css\n/* Set global styles\
  \ */\nbody {\nfont-family: Arial, sans-serif;\nbackground-color: #f8f8f8;\n}\nh1\
  \ {\ntext-align: center;\nmargin-top: 30px;\n}\nform {\ndisplay: flex;\nflex-direction:\
  \ row;\nalign-items: center;\nmargin: 20px 0;\n}\nlabel {\nmargin-right: 10px;\n\
  }\ninput[type=\"text\"] {\npadding: 5px;\nborder-radius: 5px;\nborder: none;\nmargin-right:\
  \ 10px;\n}\nbutton.get-weather {\npadding: 5px 10px;\nborder-radius: 5px;\nborder:\
  \ none;\nbackground-color: #4CAF50;\ncolor: #fff;\ncursor: pointer;\n}\nbutton.get-weather:hover\
  \ {\nbackground-color: #3e8e41;\n}\n#weather1,\n#weather2 {\nmargin: 20px 0;\npadding:\
  \ 10px;\nborder-radius: 5px;\nborder: 1px solid #ccc;\nbackground-color: #fff;\n\
  }\n```\n\n### JavaScript 代码\n\n```javascript\n// Get all the form elements\nconst\
  \ forms = document.querySelectorAll('form');\n\n// Loop through each form\nforms.forEach((form,\
  \ index) => {\nconst locationInput = form.querySelector('input[type=\"text\"]');\n\
  const weatherDiv = document.querySelector(`#weather${index + 1}`);\nconst button\
  \ = form.querySelector('button');\n\n// Add event listener to the button\nbutton.addEventListener('click',\
  \ () => {\nconst location = locationInput.value;\nconst apiKey = 'YOUR_API_KEY_HERE';\n\
  // Further implementation would go here\n});\n});\n```\n\n\n\n\n```javascript\n\
  const apiUrl = `https://api.openweathermap.org/data/2.5/weather?q=${location}&appid=${apiKey}&units=metric`;\n\
  \n// Fetch weather data\nfetch(apiUrl)\n  .then(response => response.json())\n \
  \ .then(data => {\n    const temperature = data.main.temp;\n    const description\
  \ = data.weather[0].description;\n    const city = data.name;\n    const country\
  \ = data.sys.country;\n    // Update the weather data\n    weatherDiv.innerHTML\
  \ = `\n    <p><<strong>>Location:</strong> ${city}, ${country}</p>\n    <p><<strong>>Temperature:</strong>\
  \ ${temperature} &deg;C</p>\n    <p><<strong>>Condition:</strong> ${description}</p>\n\
  \    `;\n  })\n  .catch(error => {\n    console.error(error);\n    weatherDiv.textContent\
  \ = 'An error occurred while fetching the weather data.';\n  });\n```\n\n查看下方输出。\n\
  \n![](img/image_rsrc65H.jpg)\n\n# 使用 AJAX 获取数据\n\n使用 AJAX 获取数据允许我们在不重新加载整个网页的情况下向\
  \ API 或服务器发送请求。这使得 Web 应用程序更加动态，并对用户操作做出响应。\n\nAJAX 代表“异步 JavaScript 和 XML”，但现在\
  \ JSON 通常被用来代替 XML。在 JavaScript 中，我们可以使用 `XMLHttpRequest` (XHR) 对象异步地从服务器发送和接收数据。然而，`Fetch\
  \ API` 是 JavaScript 中实现此操作的一种更新、更现代的方法。\n\n这里是一个使用 `Fetch API` 通过 AJAX 获取数据的示例：\n\
  \n```javascript\nconst apiUrl = 'https://api.example.com/data';\n\nfetch(apiUrl)\n\
  \  .then(response => {\n    if (!response.ok) {\n      throw new Error('Network\
  \ response was not ok');\n    }\n    return response.json();\n  })\n  .then(data\
  \ => {\n    console.log(data);\n  })\n  .catch(error => {\n    console.error('There\
  \ was a problem fetching the data:', error);\n  });\n```\n\n在此示例中，我们使用 `fetch()`\
  \ 方法对 `apiUrl` 变量指定的 URL 发送 GET 请求。`fetch()` 方法返回一个 `Promise`，该 Promise 将解析为代表服务器对请求响应的\
  \ `Response` 对象。然后我们可以使用 `Response` 对象的 `ok` 属性来检查响应是否成功。如果没有成功，我们可以抛出一个带有自定义消息的\
  \ `Error`。如果响应成功，我们可以使用 `Response` 对象的 `json()` 方法提取 JSON 数据，该方法同样会返回一个 `Promise`。\n\
  \n最后，我们可以使用另一个 `.then()` 块将检索到的数据打印到控制台，或对其进行其他处理。如果在任何一点发生错误，我们可以使用 `.catch()`\
  \ 块来处理它并在控制台记录自定义的错误消息。\n\n注意，`Fetch API` 在现代浏览器中受支持，但在旧版本的 Internet Explorer 中不支持。为了支持旧浏览器，我们可以使用\
  \ polyfill 或像 `jQuery` 这样的库来发送 AJAX 请求。\n\n# 在网页上显示数据\n\n一旦你使用 AJAX 成功获取数据，下一步将其显示在网页上。你可以通过多种方式显示数据，例如更新\
  \ HTML 元素、动态创建新元素或生成图表。\n\n以下是如何使用获取到的数据更新 HTML 元素的示例：\n\n### HTML 代码：\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta http-equiv=\"\
  X-UA-Compatible\" content=\"IE=edge\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<title>Displaying Data</title>\n<link rel=\"stylesheet\"\
  \ href=\"index.css\">\n</head>\n<body>\n<div id=\"data-container\">\n<h1>Loading\
  \ data...</h1>\n</div>\n<script src=\"index.js\"></script>\n</body>\n</html>\n```\n\
  \n### CSS 代码：\n\n```css\n#data-container {\nmargin: 20px auto;\npadding: 20px;\n\
  max-width: 600px;\ntext-align: center;\nbackground-color: #f5f5f5;\nborder: 1px\
  \ solid #ddd;\nborder-radius: 4px;\n}\nh1 {\nfont-size: 24px;\nfont-weight: bold;\n\
  margin-bottom: 10px;\n}\n```\n\n### JavaScript 代码：\n\n```javascript\nconst dataContainer\
  \ = document.querySelector('#data-container');\nconst apiUrl = 'https://jsonplaceholder.typicode.com/posts/1';\n\
  \nfetch(apiUrl)\n  .then(response => response.json())\n  .then(data => {\n    const\
  \ title = data.title;\n    const body = data.body;\n    const html = `\n    <h1>${title}</h1>\n\
  \    <p>${body}</p>\n    `;\n    dataContainer.innerHTML = html;\n  })\n  .catch(error\
  \ => console.error(error));\n```\n\n查看下方输出。\n\n![](img/image_rsrc65J.jpg)\n\n# 第二十一章\n\
  \n## 理解 ES6\n\nES6，也称为 `ECMAScript 2015`，是 JavaScript 语言的一次重大更新，它引入了许多新功能和语法改进。这些新功能为开发者提供了更强大的工具。\n\
  \n在本章中，我们将探索 ES6 引入的一些重要功能，包括箭头函数、模板字符串、解构和类。我们还会查看如何使用模块来更有效地组织代码。\n\n## ES6 简介\n\
  \nES6，也称为 `ECMAScript 2015`，是 JavaScript 语言的一次重大更新，它引入了许多新功能和语法改进。这些新功能为开发者提供了更强大的工具。\n\
  \nES6 引入了一些新功能，其中最显著的变化包括：\n\n- 块作用域变量 (`let` 和 `const`）\n- 箭头函数\n- 模板字符串\n- 解构\n\
  - 类和模块\n- 默认参数\n- 剩余和扩展运算符\n- Promise\n- 生成器\n- 符号\n\n## 新功能与语法\n\nES6 为 JavaScript\
  \ 引入了一些新功能和语法。一些主要的包括：\n\n- **Let 和 const**：ES6 引入了两个新的声明关键字：`let` 和 `const`。与具有函数作用域的\
  \ `var` 不同，`let` 和 `const` 具有块作用域。`let` 声明变量可以重新赋值。\n- **箭头函数**：箭头函数提供了更简洁的定义语法。它们是匿名函数，使用\
  \ `=>` 代替 `function` 关键字。箭头函数也可以作为返回值的简写。\n- **模板字符串**：模板字符串提供了在字符串字面量嵌入表达式的方法。它们使用反引号（``\
  \ `）而不是单引号或双引号，并允许在 `${}` 中包含变量和表达式。\n- **解构**：解构提供了一种从数组和对象提取值并将其赋值给变量的方法。它使用简写语法一次性提取多个值。\n\
  - **类和模块**：ES6 引入了类语法，提供更传统的面向对象编程模型。类允许定义具有方法和属性的蓝图。ES6 还引入了模块语法，使得文件之间的代码组织和共享更加容易。\n\
  - **默认参数**：默认参数允许在未提供值时为函数参数指定默认值。\n- **剩余和扩展运算符**：剩余和扩展运算符提供了更容易处理数组和对象的方法。剩余运算符\
  \ `...`可以将多个参数收集到一个数组中，而扩展运算符 `...`可以将数组或对象展开为单独参数。\n- **Promise**：Promise 提供了一种更具读性和可预测性的处理异步操作的方法。它们允许链式异步操作并优雅地处理错误。\n\
  - **生成器**：生成器提供了暂停和恢复函数执行的方法。它们用于创建迭代器，用于遍历值的序列。\n- **符号**：符号提供了一种创建唯一、不可变值的方法，这些值可以作为对象的键。它们有助于创建私有属性和方法。\n\
  \n## 使用模块\n\n\n\n\n\n# JavaScript 模块与现代特性\n\n## ES6 模块\n\n### 导出与导入\n\n在 ES6 中，引入了模块的概念以帮助更有效地组织和重用代码。模块简单来说就是一个包含代码的独立文件，这些代码可以被导入到另一个文件中中使用。\n\
  \n`export` 关键字用于模块文件，使某些代码部分可供其他文件使用。例如，如果我们有一个名为 `utils.js` 的文件，其中包含一个我们想在另一个文件中使用的函数\
  \ `sum`，我们可以这样导出 `sum` 函数：\n\n```javascript\n// utils.js\n\nexport function sum(a,\
  \ b) {\n\nreturn a + b;\n\n}\n```\n\n在另一个文件中，我们可以使用 `import` 关键字这样导入 `sum` 函数：\n\
  \n```javascript\n// app.js\n\nimport { sum } from './utils.js';\n\nconsole.log(sum(2,\
  \ 3)); // output: 5\n```\n\n上述 `import` 语句从 `utils.js` 模块中导入了 `sum` 函数，并使其可以在 `app.js`\
  \ 文件中可以使用。\n\n### 默认导出 (Export Default)\n\n从模块中导出代码的另一种方法是使用 `export default` 语法。通过这种语法，我们可以从模块中导单个值，而无需在导入时使用大括号。例如：\n\
  \n```javascript\n// utils.js\n\nexport default function sum(a, b) {\n\nreturn a\
  \ + b;\n\n}\n```\n\n在另一个文件中，我们可以这样导入默认导出：\n\n```javascript\n// app.js\n\nimport\
  \ sum from './utils.js';\n\nconsole.log(sum(2, 3)); // output: 5\n```\n\n注意，当使用\
  \ `export default` 时，导入导出的值时不需要使用大括号。我们只需要使用想要赋值给导入值的名称（在本例中为 `sum`）即可。\n\n## JavaScript\
  \ 未来更新\n\nJavaScript 是一门不断演进的语言，定期添加新的更新和提案。JavaScript 即将推出的一些特性和更新包括：\n\n*   可选链（Optional\
  \ Chaining）：此特性允许开发人员安全地访问对象的嵌套属性，而无需担心每个属性是否存在。这有助于减少用于空值检查的样板代码，并提高代码的可读性。\n\n\
  *   空值合并运算符（Nullish Coalescing Operator）：该运算符允许开发者检查 `null` 或 `undefined` 值，并简洁地提供默认值。它有助于减少用于空值检查的样板代码，并提供更具读性的代码。\n\
  \n*   `Promise.any()`：此特性允许开发者创建一个 `Promise`，当传递给它的任何一个 `Promise` 解决时，该就会就会解决。当你想要执行多个异步操作并在任何一个操作成功完成时获取结果时，这非常有用。\n\
  \n*   逻辑赋值运算符（Logical Assignment Operators）：这些运算符是常用操作（如 `+=`、`-=`、`*=` 和 `/=`）结合逻辑运算符的简写。例如，`||=`\
  \ 运算符仅在变量为 `null` 或 `undefined` 时才给其赋值。\n\n*   私有字段和方法（Private Fields and Methods）：此特性提供了一种在类中创建私有属性和方法的方法，更容易封装和保护数据。\n\
  \n*   SIMD（单指令多数据）：此特性允许 JavaScript 对数组执行 SIMD 操作，使其处理大量数据时更快、更高效。\n\n*   `GlobalThis`：此特性提供了一种跨平台访问全局对象的方法，无论代码运行在什么环境中。\n\
  \n这些只是 JavaScript 许多更新和提案中的几个例子。随着语言不断演进，开发者需要跟上最新的特性和语法。\n\n## 应当避免的常见错误\n\n遵循最佳实践以确保你的代码整洁、可维护且易读非常重要。在本文中我们将讨论编写\
  \ JavaScript 代码时应避免的一些常见错误，以及编写整洁可维护代码的一些最佳实践。\n\n*   不使用 `const` 和 `let`：最常见的错误之一是在声明变量时使用\
  \ `var` 而不是 `const` 或 `let`。`var` 关键字在循环或嵌套函数会导致问题，因为它不是块作用的。相比之下，`const` 和 `let`\
  \ 是块作用的，是声明变量的更好选择。\n\n*   未检查 `undefined`：另一个常见错误是未检查 `undefined` 值。这在尝试访问 `undefined`\
  \ 对象的属性或调用 `undefined` 函数时会导致错误。为了避免这种情况，请在访问它们之前始终检查 `undefined` 值。\n\n*   使用全局变量：全局变量在大型应用程序中使用会导致问题，因为可以从应用程序的任何部分访问和修改。相反，请使用局部变量或将代码封装在模块中以避免使用全局变量。\n\
  \n*   不使用严格模式：严格模式是 JavaScript 的一项特性，有助于捕获常见的编码错误并使编写安全代码更容易。在你的 JavaScript 代码中始终使用严格模式以避免常见错误。\n\
  \n*   不处理错误：错误处理是编写 JavaScript 代码的一个重要方面。不处理错误会导致意外行为，并使代码调试变得困难。请始终通过 `try-catch`\
  \ 块或返回错误对象来处理错误。\n\n## 编写整洁可维护代码的最佳实践\n\n*   使用描述性名称：为变量、函数和类使用描述性名称，以便更容易理解它们的作用。避免使用单字母或通用名称，因为这些名称可能使代码目的变得难以理解。\n\
  \n*   编写模块化代码：模块化代码是指组织成更小的、可重用模块的代码。这使得代码更容易维护和调试，并减少了引入 bug 的概率。使用模块封装你的代码并避免使用全局变量。\n\
  \n*   使用注释：使用注释解释代码的作用、其工作原理以及任何潜在的问题或陷阱（gotchas）。这使得其他开发者更容易理解和维护代码。\n\n*   避免嵌套代码：避免使用嵌套循环或嵌套函数，因为它们可能会使代码难以阅读和理解。相反，请使用模块化代码和函数将代码拆分为更小易管理的部分。\n\
  \n*   使用正确的缩进：正确的缩进对于提高代码的可读性和理解性很重要。为每一层代码使用一致的缩进，避免混合使用制表符和空格。\n\n*   使用分号：虽然\
  \ JavaScript 不是强制，但使用分号终止语句是一种良好的习惯。这使得代码更容易阅读并避免潜在错误。\n\n*   使用 `const` 和 `let`：声明变量时使用\
  \ `const` 和 `let` 代替 `var`。这使得代码更容易阅读和理解，并避免潜在的作用域问题。\n\n*   使用模板字符串：构建字符串时使用模板字符串代替拼接。模板字符串使得构建复杂字符串更容易，且比拼接更具可读性。\n\
  \n*   使用箭头函数：使用箭头函数代替传统的函数声明。箭头函数更简洁、易读。\n\n*   使用解构：使用解构从对象和数组中提取值。解构使得处理复杂数据结构变得更容易，比传统方法更具可读性。\n\
  \n# 第二十二章\n\n## 实践练习\n\nJavaScript 实践练习是开发者通过构建现实应用程序来练习编码技能的极佳方法。这些练习提供了将 JavaScript\
  \ 课程和教程中学到的概念应用于实际场景的机会。项目的复杂程度和范围各不相同，从简单的待事项列表应用到带有后端服务器的完整 Web 应用程序。\n\n进行项目练习有助于开发者对自己的编码能力建立信心，学习新技术并开发解决问题的能力。它还提供了探索新框架和库的机会，并在使用它们方面获得实战经验。\n\
  \n\n\n\n\n此外，JavaScript 实战练习可以是开发者作品集的极佳补充。潜在的雇主可以通过查看他们完成的项目来评估开发者的技能。此外，它还可以帮助开发者与其他从事相似项目的开发者建立联系并进行协作。\n\
  \n在本章中，我们将探索一些开发者可以用来提高其 JavaScript 技能的项目想法。每个项目都将有一个简要描述，我们将指导要实现的功能和特性。我们还将提供代码片段和有用的资源以辅助开发过程。\n\
  \n请注意，书中的代码列表仅用于指导您创建所需的网站或网络应用程序，您可以根据需要添加或删除任何元素。\n\n### 练习 1：创建一个简单的管理任务和待办事项的应用\n\
