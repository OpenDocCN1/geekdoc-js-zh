  // 切换待办事项的完成状态\nfunction toggleCompleted(index) {\n  todos[index].completed = !todos[index].completed;\n\
  \  renderTodos();\n}\n\n// 添加事件监听\naddTodoButton.addEventListener('click', addTodo);\n\
  newTodoInput.addEventListener('keydown', function(event) {\n  if (event.key ===\
  \ 'Enter') {\n    addTodo();\n  }\n});\n\n// 初始渲染\nrenderTodos();\n```\n\n请参下方的截图。\n\
