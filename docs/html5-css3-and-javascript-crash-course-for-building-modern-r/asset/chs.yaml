  \n请查看下面的计算结果。\n\n![](img/image_rsrc65N.jpg)\n\n### 练习 3：使用 JavaScript 创建简单游戏\n\n\
  下面是一个使用 HTML、CSS 和 JavaScript 创建的名为“打地鼠”的简单游戏示例：\n\n### HTML 代码\n\n```html\n<!DOCTYPE\
  \ html>\n\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n\n<meta http-equiv=\"\
