  \ initial-scale=1.0\">\n<title>To-do List</title>\n<link rel=\"stylesheet\" href=\"\
  index.css\">\n</head>\n<body>\n<h1>To-do List</h1>\n<input type=\"text\" id=\"new-todo\"\
  \ placeholder=\"Enter new to-do item\">\n<button id=\"add-todo\">Add</button>\n\
