- fmt: '

    ## JavaScript Overview


    - **Event-driven programming**: `JavaScript` is an event-driven language, meaning
    that it can respond to user actions or other events on a web page. This is in
    contrast to procedural languages like `C`, which follow a linear sequence of code
    execution.

    - **Client-side scripting**: `JavaScript` is primarily used as a client-side scripting
    language, running in the user''s web browser rather than on a server. This is
    in contrast to server-side languages like `PHP` or `Ruby`, which run on a server
    to generate web pages dynamically.

    - **Functional programming**: `JavaScript` supports functional programming, which
    is a different programming paradigm than the object-oriented programming used
    in many other languages.

    - **Versatility**: `JavaScript` is a versatile language that can be used for a
    wide range of applications beyond web development, including server-side programming
    with `Node.js` and desktop or mobile app development with frameworks like `Electron`
    or `React Native`.


    ## Understanding Object-Oriented Programming


    Object-Oriented Programming (OOP) is a programming paradigm that involves organizing
    code into objects that have attributes and behaviors. It''s based on the idea
    of creating real-world models of objects in code. OOP focuses on the idea of creating
    reusable code and simplifying complex systems.


    In OOP, objects have their properties and methods, and they can interact with
    other objects to perform specific tasks. OOP has four fundamental concepts: encapsulation,
    inheritance, abstraction, and polymorphism.


    - **Encapsulation** is the concept of hiding the implementation details of an
    object and only exposing the necessary methods and properties. This helps to ensure
    that the object can only be used in ways that were intended by the designer.

    - **Inheritance** is the concept of creating new classes based on existing ones.
    Inheritance allows a subclass to inherit the properties and methods of a superclass.
    This allows developers to create more specialized classes without having to rewrite
    code that already exists.

    - **Abstraction** is the concept of simplifying complex systems by breaking them
    down into smaller, more manageable parts. Abstraction allows developers to focus
    on the essential features of an object, without worrying about the implementation
    details.

    - **Polymorphism** is the concept of creating code that can work with objects
    of different types. This allows developers to write more flexible and reusable
    code.


    OOP is used in many popular programming languages, including `Java`, `Python`,
    and `C++`. It has become a standard for creating robust and scalable software
    applications. Understanding OOP is essential for any developer who wants to build
    complex systems that are easy to maintain and extend.


    ## Setting Up JavaScript Development Environment


    To set up a JavaScript development environment, you will need a few key tools
    and software. Here are the basic steps to get started:


    - **Install a code editor**: A code editor is a tool that allows you to write
    and edit code. There are many code editors available, including free and paid
    options. Some popular choices for JavaScript development include `Visual Studio
    Code`, `Sublime Text`, and `Atom`. You can download and install Visual Studio
    at “https://code.visualstudio.com/download”.


    ![](image_rsrc63S.jpg)


    - **Install Node.js**: `Node.js` is a JavaScript runtime environment that allows
    you to run JavaScript code outside of a web browser. It includes a package manager
    called `npm`, which is used to manage and install third-party packages and libraries.
    You can download `Node.js` from the official website “https://nodejs.org/en” and
    follow the installation instructions for your operating system. Install the "Node.js"
    runtime environment on your system. Make sure to install the LTS version for stability
    and long-term support.


    ![](image_rsrc63T.jpg)


    - **Create a project directory**: Once you have a code editor and `Node.js` installed,
