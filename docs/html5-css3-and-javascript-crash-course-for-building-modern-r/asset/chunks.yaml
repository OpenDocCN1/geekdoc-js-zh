    \  }\n};\nlet person2 = {\n  firstName: 'Jane',\n  lastName: 'Smith'\n};\nconsole.log(person1.fullName.call(person2));\
    \ // Output: \"Jane Smith\"\n```\n\nIn this example, we define two objects `person1`\
    \ and `person2`. `person1` has a `fullName` method, while `person2` does not.\
    \ We can still use the `call()` method to call `person1`'s `fullName` method with\
