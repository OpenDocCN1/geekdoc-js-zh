    ## CSS 动画


    CSS 动画是指使用 CSS（层叠样式表）为网页上的元素添加运动或移动的过程。通过使用 CSS 规则定义特定的动画来实现，这些规则可以应用于文本、图像、按钮和其他页面元素的
    HTML 元素。


    动画可以用于在网页上创建引人注目且具有交互性的效果，例如过渡、淡入、旋转等。它们还可以用于增加视觉趣味并增强用户体验。CSS 动画通常使用 `@keyframes`
    规则定义，该规则允许你指定动画的不同阶段以及在每个阶段应应用的 CSS 属性。


    使用 CSS 动画的某些优势包括：


    - 它们是轻量级的，不需要额外的 JavaScript 或库

    - 它们可以很容易地自定义和调整以适应你的特定需求

    - 它们受所有现代浏览器的支持

    - 它们可以帮助提高网站的整体用户体验和参与度。


    在使用 CSS 动画时，考虑性能、浏览器兼容性和可访问性等因素非常重要。应该谨慎且谨慎地使用动画，不应干扰网站的功能，也不应让用户难以导航或与内容交互。


    ### 应用 CSS 动画


    要应用 CSS 动画，你需要遵循以下步骤：


    - 定义关键帧：关键帧用于定义动画。你可以使用百分比值在不同阶段定义动画。

    - 将关键帧分配给元素：你可以使用 `animation-name` 属性将关键帧分配给元素。

    - 设置持续时间和计时函数：你可以使用 `animation-duration` 和 `animation-timing-function` 属性设置动画的持续时间和计时函数。

    - 指定动画方向和迭代次数：你可以使用 `animation-direction` 和 `animation-iteration-count` 属性指定动画的方向和动画重复的次数。


    这是一个应用简单 CSS 动画示例：


    ![](img/image_rsrc62V.jpg)


    在这个示例中，我们定义了一个名为 `example` 的关键帧，它在整个动画过程中将元素的背景颜色从红色变为黄色再变为蓝色。然后我们将此关键帧分配给 `div`
    元素，并使用相关的 CSS 属性指定动画的持续时间、计时函数、延迟、迭代次数和方向。请查看下方的网页结果。


    ![](img/image_rsrc62W.jpg)


    ## CSS 过渡


    CSS 过渡是在元素的两个状态之间创建平滑且渐进动画的方法。它们允许你定义元素如何在指定的持续时间和计时函数内更改其属性。


    要应用 CSS 过渡，你首先需要使用 CSS 属性定义元素的起始状态。然后，你可以使用 `transition` 属性指定动画的持续时间、计时函数和其他参数。


