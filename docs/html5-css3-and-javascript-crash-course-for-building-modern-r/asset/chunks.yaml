    ASYNC/AWAIT


    Async/await is a newer way to handle asynchronous code in JavaScript, introduced
    in ES2017\. It is built on top of Promises and provides a more readable and cleaner
    syntax for handling asynchronous operations. The async keyword is used to declare
    an asynchronous function, which automatically returns a Promise. Within an asynchronous
    function, the await keyword is used to wait for the completion of a Promise before
    continuing with the next line of code.


    Here''s an example of an asynchronous function that fetches data from an API using
