    as "red", "blue", "green", etc.


    *   Hexadecimal notation: This method allows you to specify a color using a six-digit
    code that represents the amount of red, green, and blue in the color.


    *   RGB notation: This method specifies the amount of red, green, and blue in
    a color using three numbers between 0 and 255.


    *   HSL notation: This method specifies the color using its hue, saturation, and
    lightness values.


    In addition to specifying colors for specific elements, you can also use CSS to
    apply color to specific parts of an element, such as its border or background.
    CSS also allows you to apply transparency to colors using the "opacity" property.


    ### Applying Color properties


    To apply color properties in CSS, you can use different color models like RGB,
    RGBA, Hexadecimal, HSL, HSLA, etc. Here are some examples:


    *   Using RGB values:


