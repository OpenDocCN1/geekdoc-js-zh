    FETCHING DATA WITH AJAX


    Fetching data with AJAX allows us to make requests to APIs or servers without
    having to reload the entire page. This makes web applications more dynamic and
    responsive to user actions.


    AJAX stands for "Asynchronous JavaScript and XML", but nowadays JSON is often
    used instead of XML. In JavaScript, we can use the XMLHttpRequest (XHR) object
    to send and receive data from a server asynchronously. However, the Fetch API
    is a newer and more modern way of doing this in JavaScript.


    Here''s an example of fetching data with AJAX using the Fetch API:


    const apiUrl = ''https://api.example.com/data'';


    fetch(apiUrl)


    .then(response => {


    if (!response.ok) {


    throw new Error(''Network response was not ok'');


    }


    return response.json();


    })


    .then(data => {


    console.log(data);


    })


    .catch(error => {


    console.error(''There was a problem fetching the data:'', error);


    });


    In this example, we use the fetch() method to make a GET request to the URL specified
    in the apiUrl variable. The fetch() method returns a Promise that resolves to
    the Response object representing the server''s response to the request. We can
    then check if the response was successful using the ok property of the Response
    object. If it was not successful, we can throw an Error with a custom message.
    If the response was successful, we can extract the JSON data using the json()
    method of the Response object, which also returns a Promise.


    Finally, we can use another .then() block to log the retrieved data to the console,
    or do something else with it. If there was an error at any point, we can use the
    .catch() block to handle it and log a custom error message to the console.


    Note that the Fetch API is supported in modern web browsers, but not in older
    versions of Internet Explorer. To support older browsers, we can use a polyfill
    or a library like jQuery to make AJAX requests.


    DISPLAYING DATA ON A WEBPAGE


    Once you have successfully fetched data using AJAX, the next step is to display
    it on your webpage. You can display the data in various ways, such as updating
    an HTML element, creating new elements dynamically, or generating charts.


    Here''s an example of how you can update an HTML element with the fetched data:


    HTML Code:


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta http-equiv="X-UA-Compatible" content="IE=edge">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Displaying Data</title>


    <link rel="stylesheet" href="index.css">


    </head>


    <body>


    <div id="data-container">


    <h1>Loading data...</h1>


    </div>


    <script src="index.js"></script>


    </body>


    </html>


