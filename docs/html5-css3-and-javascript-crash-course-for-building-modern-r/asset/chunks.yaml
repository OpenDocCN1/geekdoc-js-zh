    \ 中的对象也可以拥有方法，方法是定义为对象属性的函数。方法可以访问对象的属性和其他方法。在 JavaScript 中，对象可以拥有方法，即属于对象并可以对其属性进行操作的函数。为对象创建方法，我们将函数定义为对象的属性。\n\
    \n这是一个例子：\n\n```javascript\nlet person = {\n  firstName: 'John',\n  lastName:\
    \ 'Smith',\n  fullName: function() {\n    return this.firstName + ' ' + this.lastName;\n\
    \  }\n};\nconsole.log(person.fullName()); // 输出: \"John Smith\"\n```\n\n在这个示例中，我们为\
    \ `person` 对象定义了一个 `fullName` 方法。`fullName` 方法将连接 `firstName` 和 `lastName`。\n\n\
    我们可以使用箭头函数语法：\n\n```javascript\nlet person = {\n  firstName: 'John',\n  lastName:\
    \ 'Smith',\n  fullName: () => {\n    return this.firstName + ' ' + this.lastName;\n\
    \  }\n};\nconsole.log(person.fullName()); // 输出: \"undefined\"\n```\n\n在对象方法中使用箭头方法使用\
    \ `this 关键字` 通常是不推荐的，因为会产生问题。\n\n对象方法也可以通过 `call()` 方法在对象之外调用。例如：\n\n```javascript\n\
    let person1 = {\n  firstName: 'John',\n  lastName: 'Smith',\n  fullName: function()\
    \ {\n    return this.firstName + ' ' + this.lastName;\n  }\n};\nlet person2 =\
    \ {\n  firstName: 'Jane',\n  lastName: 'Smith'\n};\nconsole.log(person1.fullName.call(person2));\
    \ // 输出: \"Jane Smith\"\n```\n\n在这个示例中，我们定义了对象 `person1` 和 `person2`。`person1`\
    \ 有一个 `fullName` 方法，而 `person2` 没有。我们可以使用 `call()` 方法调用 `person1` 的 `fullName`\
    \ 方法，并将 `person2` 作为其 `this` 值。\n\n![](img/image_rsrc654.jpg)\n\n还可以使用 ES6 语法定义对象方法：\n\
    \n```javascript\nlet person = {\n  firstName: 'John',\n  lastName: 'Smith',\n\
    \  fullName() {\n    return this.firstName + ' ' + this.lastName;\n  }\n};\nconsole.log(person.fullName());\
    \ // 输出: \"John Smith\"\n```\n\n在这个示例中，我们定义了一个名为 `person` 的对象，具有 `firstName`、`lastName`\
    \ 属性和 `fullName` 方法。见输出。\n\n![](img/image_rsrc655.jpg)\n\n对象方法还可以使用简写形式：\n\n```javascript\n\
    let person = {\n  firstName: 'Sammie',\n  lastName: 'Smith',\n  fullName() {\n\
    \    return this.firstName + ' ' + this.lastName;\n  }\n};\nconsole.log(person.fullName());\
    \ // 输出: \"Sammie Smith\"\n```\n\n这种方法与之前的示例相同。见输出的截图。\n\n## 创建类\n\n除了使用对象字面量符号或\
    \ `Object` 构造函数创建对象外，你还可以使用类创建对象。类是创建对象的蓝图，它定义了对象将拥有的属性和方法。在 JavaScript 中定义类，你使用\
    \ `class` 关键字，后面跟着类名。\n\n在 JavaScript 中，你可以使用 `class` 关键字创建类。类是定义想要创建对象的蓝图的方法。它们提供了一种将数据和行为封装在单一实体的方法。类可以像对象一样拥有属性和方法。\n\
    \n这是一个在 JavaScript 中创建类的例子：\n\n```javascript\nclass Person {\n  constructor(firstName,\
    \ lastName, age) {\n    this.firstName = firstName;\n    this.lastName = lastName;\n\
    \    this.age = age;\n  }\n\n  getFullName() {\n    return `${this.firstName}\
    \ ${this.lastName}`;\n  }\n\n  canVote() {\n    return this.age >= 18;\n  }\n\
    }\n```\n\n在这个示例中，我们定义了一个 `Person` 类，其构造函数接收三个参数：`firstName`、`lastName` 和 `age`。构造函数将这些值赋值给正在创建对象的属性。\n\
    \n该类还有两个方法：`getFullName` 和 `canVote`。`getFullName` 通过连接姓和名返回人的全名，而 `canVote` 检查人是否满\
    \ 18 岁或以上并返回真或假。\n\n"
