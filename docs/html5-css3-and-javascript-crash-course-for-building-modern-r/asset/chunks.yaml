    ### Scope and Closures


    Scope refers to the visibility of variables in different parts of the code. In
    JavaScript, there are two types of scope: global scope and local scope.


    **Global Scope**


    Global scope refers to variables that are declared outside of any function and
    can be accessed from anywhere in the code:


    ```javascript

    let globalVar = "I''m a global variable";


    function printGlobalVar() {


    console.log(globalVar); }


    printGlobalVar(); // Output: I''m a global variable

    ```


    See the output below:


    ![](image_rsrc64V.jpg)


    **Local Scope**


    Local scope refers to variables that are declared inside a function and can only
    be accessed within that function:


    ```javascript

    function printLocalVar() {


    let localVar = "I''m a local variable";


    console.log(localVar);


    }


    printLocalVar(); // Output: I''m a local variable

    ```


    See the output below.


    ![](image_rsrc64W.jpg)


    **Closures**


    Closures refer to the ability of a function to access variables in its outer (enclosing)
    function, even after the outer function has returned. For example:


    ```javascript

    function outer() {


    let x = 10;


    function inner() {


    console.log(x);


    }


    return inner;


    }


    let innerFunc = outer();


    innerFunc(); // Output: 10

    ```


    In the above example, the `outer` function returns the `inner` function, which
    has access to the `x` variable in the outer function''s scope, even though the
    outer function has already returned. See the output below;


    ![](image_rsrc64X.jpg)


    In the above example, the `outer` function returns the `inner` function, which
    has access to the `x` variable in the outer function''s scope, even though the
    outer function has already returned.


