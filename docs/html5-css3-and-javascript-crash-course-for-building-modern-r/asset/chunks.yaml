    ## Positioning


    Positioning in CSS refers to how an element is placed on a web page, either with
    the browser window, the containing element, or other elements on the page. There
    are four different types of positioning in CSS:


    *   Static Positioning: This is the default positioning for all HTML elements,
    where the element appears in the order it is written in the HTML code.


    *   Relative Positioning: This type of positioning allows an element to be moved
    from its normal position by a specified number of pixels or percentage values,
    while still taking up its original space in the document flow.


    *   Absolute Positioning: This type of positioning allows an element to be positioned
    relative to its closest positioned ancestor element, or if none exists, relative
    to the initial containing block. It is removed from the normal document flow and
    will not affect the position of other elements on the page.


    *   Fixed Positioning: This type of positioning is similar to absolute positioning,
    but the element is positioned relative to the browser window rather than its containing
    element. The element remains in the same position even if the user scrolls the
    page.


    By using CSS positioning, web developers can create complex layouts and positioning
    effects on their web pages. However, it is important to use positioning judiciously,
    as it can be difficult to maintain consistency across different screen sizes and
    devices.


    ### Applying Positioning


    To apply positioning in CSS, you can use the position property. There are four
    different values you can use for the position property:


    *   static: This is the default value, and it means that the element will flow
    in the normal document flow.


    *   relative: This value positions the element relative to its normal position
    in the document flow. You can then use the top, bottom, left, and right properties
    to move the element to its normal position.


    *   absolute: This value positions the element relative to its closest positioned
    ancestor. If there is no positioned ancestor, the element will be positioned relative
    to the document body. You can then use the top, bottom, left, and right properties
    to move the element with its closest positioned ancestor.


    *   fixed: This value positions the element relative to the viewport, meaning
    that it will always stay in the same position even if the page is scrolled. You
    can then use the top, bottom, left, and right properties to move the element with
    the viewport.


