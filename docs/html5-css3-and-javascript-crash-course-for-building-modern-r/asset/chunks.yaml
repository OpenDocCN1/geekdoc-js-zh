    ## 定位 (Positioning)


    CSS 中的定位是指元素如何放置在网页上，可以是相对于浏览器窗口、包含元素或页面上的其他元素。CSS 中有四种不同的定位：


    - `静态定位 (Static Positioning)`：这是所有 HTML 元素的默认定位方式，元素按照其在 HTML 代码中的编写顺序出现。

    - `相对定位 (Relative Positioning)`：这种定位类型允许元素通过指定的像素数或百分比值从其正常位置移动，同时在文档流中占据其原始空间。

    - `绝对定位 (Absolute Positioning)`：这种定位类型允许元素相对于其最近的已定位祖先元素进行定位；如果不存在祖先元素，则相对于初始包含块进行定位。它脱离了正常的文档流，不会影响页面上其他元素的位置。

    - `固定定位 (Fixed Positioning)`：这种定位类型类似于绝对定位，但元素是相对于浏览器窗口而不是其包含元素定位的。即使用户滚动页面，元素也会保持相同的位置。


    通过使用 CSS 定位，网页开发者可以在网页上创建复杂的布局和定位效果。然而，审慎使用定位是非常重要的，因为在不同的屏幕尺寸和设备之间保持一致性可能是困难的。


    ### 应用定位 (Applying Positioning)


