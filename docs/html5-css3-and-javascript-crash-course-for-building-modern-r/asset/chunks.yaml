    DOM MANIPULATION


    The Document Object Model (DOM) is a programming interface for web documents.
    It represents the page so that programs can change the document structure, style,
    and content. In this chapter, we will explore the basics of DOM manipulation using
    JavaScript.


    INTRODUCTION TO THE DOCUMENT OBJECT MODEL (DOM)


    When a web page is loaded, the browser creates a Document Object Model (DOM) of
    the page. The DOM is an object-oriented representation of the web page, which
    can be modified with a scripting language such as JavaScript.


    The DOM consists of a hierarchical tree of nodes. Each node represents an object
    in the document, such as an element, attribute, or text node. The DOM tree can
    be traversed and manipulated using JavaScript.


    SELECTING AND MANIPULATING ELEMENTS


    One of the most common tasks when working with the DOM is selecting and manipulating
    elements. This can be done using various methods provided by the DOM API.


    getElementById


    The getElementById method is used to select an element with a specific ID. It
    returns a reference to the element if it exists in the DOM, or null if it does
    not.


    For example, let''s say we have an HTML element with an ID of "myElement". We
    can select this element using the following code:


    const element = document.getElementById("myElement");


    querySelector


    The querySelector method is used to select an element that matches a specified
    CSS selector. It returns the first element that matches the selector, or null
    if no element matches.


    For example, let''s say we have an HTML element with a class of "myClass". We
    can select this element using the following code:


    const element = document.querySelector(".myClass");


    querySelectorAll


    The querySelectorAll method is used to select all elements that match a specified
    CSS selector. It returns a NodeList object, which can be iterated over using a
    for loop.


    For example, let''s say we have several HTML elements with a class of "myClass".
    We can select all of these elements using the following code:


    const elements = document.querySelectorAll(".myClass");


