    \ HTML 文件，并包含以下代码。确保使用适合你正在进行的项目的信息。\n\nCSS 代码：\n\n```css\n* {\n    box-sizing:\
    \ border-box;\n}\n\nbody {\n    font-family: Arial, sans-serif;\n    font-size:\
    \ 16px;\n    margin: 0;\n    padding: 0;\n}\n\nheader {\n    background-color:\
    \ #333;\n    color: #fff;\n    padding: 10px;\n}\n\nnav ul {\n    list-style:\
    \ none;\n    margin: 0;\n    padding: 0;\n    display: flex;\n    flex-wrap: wrap;\n\
    }\n\nnav li {\n    margin: 0 10px;\n}\n\nnav a {\n    color: #fff;\n    text-decoration:\
