    动画。我们使用 `animation-duration`、`animation-timing-function` 和 `animation-iteration-count`
    属性指定了动画的持续时间、缓动函数以及重复次数。


    实际动画在 `@keyframes` 规则中定义。在这里，我们在不同时间点定义动画步骤：0% 为蓝色，50% 为绿色，100% 再次为蓝色。通过使用 `animation`
    属性将 `example` 动画应用于 `div`，我们得到了在蓝色和绿色之间循环的动画。


    ## 理解 Flexbox


    Flexbox 是 CSS 中的一种布局模块，提供了一种灵活的方式来对容器中的项目进行布局、对齐和分配空间。通过 Flexbox，你可以创建能够适应不同屏幕尺寸和方向的灵活布局。


    Flexbox 由两个部分组成：容器（也称为 flex 容器）和项目（也称为 flex 项目）。容器用于分组并控制内部项目的布局。项目是可以使用 flex
    属性进行排列的内部元素。


    主要的 flex 属性包括：


    - `display: flex` - 指定容器使用 flex 布局

    - `flex-direction` - 指定项目布局的主轴方向（行或列）

    - `justify-content` - 指定项目如何在主轴上对齐（例如：居中、开始、结束、两端对齐等）

    - `align-items` - 指定项目如何在交叉轴上对齐（例如：居中、开始、结束、拉伸等）

    - `flex-wrap` - 指定当单行空间不足时项目是否换到下一行

    - `flex-grow` - 指定项目相对于容器内其他项目的增长比例

    - `flex-shrink` - 指定项目相对于容器内其他项目的收缩比例

    - `flex-basis` - 指定在分配剩余空间之前项目的初始大小。


