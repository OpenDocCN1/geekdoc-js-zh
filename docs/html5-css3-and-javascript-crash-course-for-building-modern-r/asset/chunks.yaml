    # HTML 实践练习


    HTML 实践练习章节是一套旨在帮助你通过创建各种类型的网站来掌握 HTML 编码技能的实践练习。本章节包含从简单到复杂的各种项目，以满足不同技能水平的需求。这些项目涵盖广泛的主题，包括基本的
    HTML 标签和属性、表单、表格和列表、多媒体、画布和 SVG 图形，以及高级 HTML 功能，如 Web 存储、地理定位和 Web Workers。每个项目都旨在挑战你的编码能力并帮助你培养解决问题的技能。通过完成这些项目，你可以更好地理解
    HTML 的工作原理，提高代码质量，并创建功能强大且视觉吸引人的网站。无论你是初学者还是有经验的 Web 开发人员，HTML 实践练习章节都可以帮助你提升技能，成为一名熟练的
    HTML 编码者。


    ## 练习 1：创建登录页面


    ### 概述


    你需要首先为代码文件创建一个文件夹，确保索引文件及其从属文件都放在同一个文件夹中。每个项目都要这样做。


    ### 代码


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset=''utf-8''>

    <meta http-equiv=''X-UA-Compatible'' content=''IE=edge''>

    <title>Example Page</title>

    <meta name=''viewport'' content=''width=device-width, initial-scale=1''>

    <link rel=''stylesheet'' type=''text/css'' media=''screen'' href=''main.css''>

    <script src=''main.js''></script>

    </head>

    <body>

    <form>

    <h1>Login Page</h1>

    <label for="username">Username:</label>

    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>

    <input type="password" id="password" name="password" required>

    <input type="submit" value="Login">

    </form>

    </body>

    </html>

    ```


    ### 说明


    创建一个名为 `index.html` 的 HTML 文件，并复制上面的代码。


    ### 结果


    ![](img/image_rsrc61J.jpg)


    请参见下面的结果。


    ![](img/image_rsrc61K.jpg)


