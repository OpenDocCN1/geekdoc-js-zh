    # 第十二章：开始学习 JavaScript


    ## 什么是 JavaScript


    JavaScript 是一种高级的、解释执行的编程语言，广泛用于客户端 Web 开发。它最初由 Brendan Eich 在 1995 年在 Netscape
    开发，旨在为网页添加动态和交互式功能。


    在设计网页、应用程序、服务器甚至游戏时，Web 开发人员经常使用这种轻量级编程语言 JavaScript 来生成更动态的交互。JavaScript 通常与
    HTML 和 CSS 一起使用。对于格式化 组件，脚本语言和 CSS 配合得很好。用户交互仍然通过 JavaScript 维持，但 CSS 无法独立做到这一点。


