    ## Switch Statement


    The switch statement is a control flow statement used in programming languages
    like JavaScript, Java, and C++. It allows a program to evaluate an expression
    and execute different actions based on the value of the expression.


    The syntax for the switch statement in JavaScript is as follows:


    ```javascript

    switch(expression) {


    case value1:


    // code block


    break;


    case value2:


    // code block


    break;


    default:


    // code block


    }

    ```


    The expression is evaluated once, and the value is compared with the values of
    each case. If there is a match, the associated block of code is executed. If there
    is no match, the code in the default block is executed.


    Here''s an example of a switch statement in action:


    ```javascript

    let day = new Date().getDay();


    let dayName;


    switch(day) {


    case 0:


    dayName = "Sunday";


    break;


    case 1:


    dayName = "Monday";


    break;


    case 2:


    dayName = "Tuesday";


    break;


    case 3:


    dayName = "Wednesday";


    break;


    case 4:


    dayName = "Thursday";


    break;


    case 5:


    dayName = "Friday";


    break;


    case 6:


    dayName = "Saturday";


    break;


    default:


    dayName = "Invalid day";


    }


    console.log(dayName);

    ```


    In this example, the switch statement evaluates the current day of the week using
    the `getDay()` method of the `Date` object. The code matches the day with the
    appropriate string value and assigns it to the `dayName` variable. If the day
    value does not match any of the cases, the default case assigns the `dayName`
    variable the value of "Invalid day". The result of the code above is shown in
    the screenshot below.


    ![](image_rsrc64P.jpg)


    Switch statements are often used as an alternative to if-else statements when
    there are multiple conditions to check. They can also make code more readable
    and efficient in certain cases.


    ## Functions and Scope


    In JavaScript, functions are reusable blocks of code that can take in inputs (arguments)
    and return a value. They are a fundamental building block of programming and allow
    for the creation of modular and reusable code. In this chapter, we will cover
    the basics of declaring and calling functions, working with parameters and arguments,
    returning values, and understanding scope and closures.


    ### Declaring and Calling Functions


    Functions in JavaScript can be declared using the `function` keyword, followed
    by the name of the function and a set of parentheses. The function body is enclosed
    in curly braces `{}`. For instance:


    ```javascript

    function greet() {


    console.log("Hello, world!");


    }

    ```


    To call this function, simply use the function name followed by a set of parentheses:


    ```javascript

    greet(); // Output: Hello, world!

    ```


    See the output below:


    ![](image_rsrc64R.jpg)


    ### Parameters and Arguments


    Functions can also take in inputs through parameters. Parameters are declared
    in the function declaration and are used to specify the expected inputs for the
    function. For example:


    ```javascript

    function greet(name) {


    console.log("Hello, " + name + "!");


    }

    ```


    In the above example, the `greet` function takes in one parameter, `name`. To
    call the function with an argument, simply pass the value as an argument when
    calling the function:


    ```javascript

    greet("Sammie"); // Output: Hello, Sammie!

    ```


    See the output below:


    ![](image_rsrc64S.jpg)


    Functions can also take in multiple parameters, separated by commas:


    ```javascript

