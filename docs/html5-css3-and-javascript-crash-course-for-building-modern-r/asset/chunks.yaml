    ## 文本区域与按钮


    文本区域和按钮是 Web 表单中常用的两种额外输入字段，允许用户提供更详细的信息或提交表单数据。


    文本区域是一个多行输入字段，允许用户输入较大量的文本。在 HTML 中创建文本区域，可以使用带有 `cols` 和 `rows` 属性的 `<textarea>`
    标签。


