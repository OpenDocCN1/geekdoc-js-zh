    一旦建立 `WebSocket` 连接，你就可以使用 `send()` 方法向服务器发送消息，服务器也可以利用同一个 `WebSocket` 连接将消息回传给客户端。这使得客户端与服务器之间能够进行实时、双向的通信。


    ## 可访问性与搜索引擎优化


    在使用 HTML 开发网站时，可访问性和搜索引擎优化是两个重要的考量因素。可访问性指的是设计和开发能够被所有用户（包括残障或障碍人士）访问的网站。搜索引擎优化（SEO）则是指优化网站的内容和结构，以提高其在搜索引擎结果页面（SERP）中的可见性和排名。


    以下是一些在 HTML 中提升可访问性和 SEO 的技巧：


    ### 可访问性


    *   使用语义化 HTML 元素（如标题、列表和表格）以有意义且可访问的方式组织内容。

    *   为图片、视频及其他非文本内容提供替代文本描述，在 HTML 中使用 `alt` 属性。

    *   使用描述性的链接文本，准确反映链接的目标地址。

    *   确保颜色不是传达信息的唯一方式，因为视觉障碍用户可能无法区分不同颜色。

    *   使用键盘导航，并确保所有交互元素仅通过键盘即可访问和激活。

    *   为音频和视频内容提供字幕或文字记录。


    ### 搜索引擎优化


    *   为页面和标题使用描述性且相关的标题，利用 H1、H2 等标题标签组织内容。

    *   使用元描述为每个页面提供内容摘要。

    *   使用描述性 URL，准确反映页面内容。

    *   在标题、内容和元数据中使用与页面内容相关的关键词和短语。

    *   确保网站对移动设备友好且具有响应式设计，因为移动端优化是 SEO 的关键因素。

    *   使用结构化数据标记，向搜索引擎提供关于页面内容的额外信息。


    ## 让你的 HTML5 代码具有可访问性


    让 HTML5 代码具有可访问性，意味着设计和开发能够被残障人士使用的网页内容。HTML5 中的可访问性是通过采用最佳实践来优化代码，使其能够与辅助技术（如屏幕阅读器或盲文显示器）配合使用而实现的。


    以下是一些让你的 HTML5 代码具有可访问性的技巧：


    *   使用语义化 HTML 元素：使用标题、段落、列表和表格以有意义的方式组织内容。这些元素有助于屏幕阅读器更准确地解读内容。

    *   提供文本替代方案：使用 `alt` 属性为图片、视频及其他非文本内容提供文本描述。这使视觉障碍用户能够理解页面内容。

    *   使用描述性链接文本：为链接使用描述性文本，而不是像“点击这里”这样的通用文本。这有助于用户理解链接的目的。

    *   使用描述性标签：为表单控件（如文本字段、单选按钮和复选框）使用描述性标签。这使屏幕阅读器能够准确地向用户描述表单。

    *   谨慎使用颜色：不要将颜色作为传达信息的唯一方式。确保所有重要信息通过文本或其他视觉提示传达。

    *   提供键盘导航：确保所有交互元素仅通过键盘即可访问和激活。

    *   使用辅助技术进行测试：使用屏幕阅读器或其他辅助技术测试你的网站，以确保残障用户能够访问。


    ## 使用语义化标记


    使用语义化标记意味着使用 HTML 元素来描述网页内容的含义，而不是对所有内容都使用像 `div` 和 `span` 这样的通用元素。语义化标记有助于搜索引擎和其他自动化系统理解网页内容的结构和含义，从而提升页面的搜索引擎排名和用户可访问性。


    以下是一些语义化标记元素及其使用场景的示例：


    *   `<header>`：使用此元素定义网页的页眉，包括任何导航菜单或品牌标识。

    *   `<nav>`：使用此元素定义网页上的导航链接。

    *   `<main>`：使用此元素定义网页的主要内容。

    *   `<article>`：使用此元素定义独立的内容单元，例如博客文章或新闻文章。

    *   `<section>`：使用此元素定义主题相关的内容区块，例如书中的章节或新闻文章的一个部分。

    *   `<aside>`：使用此元素定义与主要内容相关但不属于核心的内容，例如侧边栏或广告。

    *   `<footer>`：使用此元素定义网页的页脚，包括任何版权信息或联系方式。


    ## 应用语义化标记


    要应用语义化标记，你需要选择最能描述网页上要显示内容含义的适当 HTML 元素。以下是一些如何应用语义化标记的示例：


    *   使用 `<header>` 作为网页的页眉部分。


    ![](img/image_rsrc619.jpg)


    *   使用 `<main>` 作为网页的主要内容区域。


    ![](img/image_rsrc61A.jpg)


    *   使用 `<nav>` 作为网页上的导航链接。


    ![](img/image_rsrc61B.jpg)


    *   使用 `<footer>` 作为网页的页脚部分。


    ![](img/image_rsrc61C.jpg)


    *   使用 `<section>` 对网页上的相关内容进行分组。


    ![](img/image_rsrc61D.jpg)


    ## 针对搜索引擎进行优化


    以下是一些针对搜索引擎优化 HTML5 代码的技巧：


    *   使用描述性页面标题和元描述：使用描述性页面标题和元描述，让搜索引擎和用户清楚了解你的页面内容。包含相关关键词，但不要不自然地堆砌。


    ![](img/image_rsrc61E.jpg)


    *   合理使用标题标签：使用标题标签（h1、h2、h3 等）以逻辑层级结构组织内容。这有助于搜索引擎理解页面不同部分的重要性。

    *   在内容中包含相关关键词：在内容中使用相关关键词，但不要过度。确保关键词自然地融入内容中。

    *   使用描述性且相关的 URL：使用描述性且相关的 URL，反映页面的内容。避免使用过长或不相关的 URL。


    ![](img/image_rsrc61F.jpg)


    *   优化图片：通过使用描述性文件名和替代文本，并压缩文件大小以加快加载速度来优化图片。这有助于你的图片在图片搜索中显示。


    ![](img/image_rsrc61G.jpg)


    *   使用内部链接：使用内部链接连接网站上的相关页面和内容。这有助于搜索引擎理解你网站的组织结构以及不同页面之间的关系。


    ![](img/image_rsrc61H.jpg)


