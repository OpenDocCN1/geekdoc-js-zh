    # JavaScript DOM Manipulation


    ```javascript

    const element = document.getElementById("myElement");

    element.innerHTML = "<h1>Hello World!</h1>";

    ```


    ## textContent


    The `textContent` property is used to get or set the text content of an element.
    It returns the text content of all child nodes, excluding HTML tags. For example,
    let''s say we have an HTML element with an ID of `myElement`. We can change its
    text content using the following code:


    ```javascript

    const element = document.getElementById("myElement");

    element.textContent = "Hello World!";

    ```


    ## setAttribute


    The `setAttribute` method is used to set the value of an attribute for an element.
    For example, let''s say we have an HTML element with an ID of `myElement`. We
    can set its `src` attribute using the following code:


    ```javascript

    const element = document.getElementById("myElement");

    element.setAttribute("src", "image.jpg");

    ```


    ## Event Handling


    Event handling is a critical aspect of web development that enables web applications
    to respond to user interactions. The user can interact with a web page by clicking
    buttons, typing into text fields, hovering over elements, scrolling, and more.
    The DOM allows us to manipulate elements on a web page, and with event handling,
    we can create interactive web applications that can respond to user interactions.


    In JavaScript, an event is an action that occurs in the browser, such as clicking
    a button, submitting a form, or scrolling the page. An event listener is a function
    that listens for a specific event to occur and performs an action when the event
    is detected.


    There are different ways to attach event listeners to HTML elements. The most
    common way is to use the `addEventListener()` method. This method takes two arguments:
    the name of the event to listen for and the function that should be executed when
    the event is detected. Here is an example of how to add an event listener to a
    button that logs a message to the console when it is clicked:


    ```javascript

    const myButton = document.querySelector(''#myButton'');

    myButton.addEventListener(''click'', function() {

    console.log(''Button clicked!'');

    });

    ```


    In this example, we first use the `querySelector()` method to select the button
    element with the ID of `myButton`. We then use the `addEventListener()` method
    to attach a click event listener to the button. When the button is clicked, the
    function passed as the second argument to `addEventListener()` will be executed
    and the message "Button clicked!" will be logged to the console.


    We can also use the `removeEventListener()` method to remove an event listener
    from an element. This method takes the same arguments as `addEventListener()`:
    the name of the event to remove and the function that was originally used as the
    event listener.


    ```javascript

    const myButton = document.querySelector(''#myButton'');

    function handleClick() {

    console.log(''Button clicked!'');

    }

    myButton.addEventListener(''click'', handleClick);

    // Later, we can remove the event listener

    myButton.removeEventListener(''click'', handleClick);

    ```


    In this example, we first define a function `handleClick()` that logs a message
    to the console when called. We then use `addEventListener()` to attach `handleClick()`
    as the event listener for the button''s click event. Finally, we use `removeEventListener()`
    to remove the event listener.


    Besides `addEventListener()` and `removeEventListener()`, some other methods and
    properties are commonly used when working with events. Some of these include:


    - `event.target`: This property returns the element that triggered the event.

    - `event.preventDefault()`: This method prevents the default behavior of an element.
    For example, calling `event.preventDefault()` on a form prevents it from submitting
    when the submit button is clicked.

    - `event.stopPropagation()`: This method stops the propagation of an event. For
    example, calling `event.stopPropagation()` on a child element prevents the event
    from propagating to its parent elements.


    Here is an example of how to use some of these methods:


    ```javascript

    const myButton = document.querySelector(''#myButton'');

    myButton.addEventListener(''click'', function(event) {

    console.log(''Button clicked!'');

    console.log(''Target:'', event.target);

    event.preventDefault();

    event.stopPropagation();

    });

    ```


    In this example, we attach a click event listener to the button. When the button
    is clicked, the function passed as the second argument to `addEventListener()`
    will be executed. Inside this function, we log a message to the console, as well
    as the target element that triggered the event using the `event.target` property.
    We also call `event.preventDefault()` and `event.stopPropagation()` to prevent
    the default behavior of the button and stop the event from propagating to its
    parent elements.


    ## Practical Implementation of DOM Manipulation


    Below is an example of DOM Manipulation implementation


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Manipulation Example</title>

    </head>

    <body>

    <h1 id="my-heading">Hello World!</h1>

    <button id="my-button">Change Text</button>

    <script src="app.js"></script>

    </body>

    <script>

    // select the button and heading elements

    const button = document.getElementById(''my-button'');

    const heading = document.getElementById(''my-heading'');

    // add an event listener to the button

    button.addEventListener(''click'', () => {

    // change the text of the heading element

    heading.textContent = ''New Text!'';

    });

    </script>

    </html>

    ```


    In this example, we first select the button and heading elements using their id
    attributes using the `document.getElementById()` method. Then, we add an event
    listener to the button using the `addEventListener()` method, which listens for
    a "click" event on the button. When the button is clicked, the anonymous arrow
    function inside the event listener is executed, which changes the text of the
    heading element using the `textContent` property. See the screenshots below.


    ![](image_rsrc65C.jpg)


    After clicking on Change text, you should have the result below.


    ![](image_rsrc65D.jpg)


    This is just a simple example, but DOM manipulation can be used to do many things
    on a webpage, such as changing CSS styles, creating and removing HTML elements,
    and more.


    # Chapter Nineteen: Asynchronous JavaScript


    Asynchronous programming is a technique used in JavaScript to execute code that
    takes a long time to complete. JavaScript code typically executes in a single-threaded
    environment, which means that long-running code can cause delays in other parts
    of the program. Asynchronous programming allows us to avoid these delays by executing
    long-running code in the background while continuing to execute other code.


    In this chapter, we''ll explore the different methods of asynchronous programming
    in JavaScript, including callback functions, promises, and async/await.


    ## Understanding Asynchronous Programming


    In synchronous programming, code is executed linearly, one instruction at a time.
    In contrast, asynchronous programming allows code to be executed out of order,
    with different parts of the program executing simultaneously.


    In JavaScript, asynchronous programming is typically used when dealing with operations
    that take a long time to complete, such as network requests, file system operations,
    or database queries.


    Asynchronous programming is a programming paradigm that allows the code to continue
    executing while waiting for a long-running task to finish. It''s commonly used
    for operations that take a lot of time to complete, like network requests or file
    input/output. In contrast to synchronous programming, where the code blocks and
    waits for the task to complete before continuing, asynchronous programming lets
    the code proceed without waiting for the task to finish.

