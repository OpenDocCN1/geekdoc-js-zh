    WORKING WITH STRINGS, NUMBERS, AND BOOLEAN VALUES


    Strings, numbers, and boolean values are the most common data types used in JavaScript.
    Understanding how to work with these data types is essential to effectively write
    JavaScript code.


    WORKING WITH STRINGS


    A string is a sequence of characters enclosed in single or double quotes. In JavaScript,
    strings are considered objects and have a set of properties and methods that can
    be used to manipulate them.


    Declaring a String Variable


    To declare a string variable in JavaScript, you can use either single or double
    quotes. Here is an example:


    let message = ''Hello World!'';


    You can also use backticks to declare a string variable. Backticks are useful
    for creating template literals, which allow you to embed expressions inside a
    string. Here is an example:


