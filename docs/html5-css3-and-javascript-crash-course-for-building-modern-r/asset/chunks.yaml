    ![](image_rsrc65E.jpg)


    You can also chain multiple then() methods to handle the resolved data:


    getData()


    .then(data => {


    console.log(data); // Output: { id: 1, name: ''John Smith'' }


    return data.id;


    })


    .then(id => {


    console.log(id); // Output: 1


