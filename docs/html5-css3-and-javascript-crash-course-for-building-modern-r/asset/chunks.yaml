    \ the output below.\n![](image_rsrc64C.jpg)\n\n## COMPARISON OPERATORS\nJavaScript\
    \ also has several comparison operators that can be used to compare two values.\
    \ These operators include equal to (`==`), not equal to (`!=`), greater than (`>`),\
    \ less than (`<`), greater than or equal to (`>=`), and less than or equal to\
    \ (`<=`). Let's take a closer look at each of these operators.\n\n### Equal to\
    \ (==)\nThis operator is used to check if two values are equal. For example:\n\
    \n```javascript\nlet x = 5;\nlet y = 5;\nconsole.log(x == y); // Output: true\n\
    ```\nSee the output below.\n![](image_rsrc64D.jpg)\n\n### Not Equal to (!=\nThis\
    \ operator is used to check if two values are not equal. For example:\n\n```javascript\n\
    let x = 5;\nlet y = 10;\nconsole.log(x != y); // Output: true\n```\nSee the output\
    \ below.\n![](image_rsrc64E.jpg)\n\n### Greater than (>) and less than (<)\nThese\
    \ operators are used to compare two values to see if one is greater than or less\
    \ than the other. For example:\n\n```javascript\nlet x = 5;\nlet y = 10;\nconsole.log(x\
    \ < y); // Output: true\nconsole.log(x > y); // Output: false\n```\nSee the output\
    \ below.\n![](image_rsrc64F.jpg)\n\n### Greater than or equal to (>=) and less\
    \ than or equal to (<=)\nThese operators are used to check if one value is greater\
    \ than or equal to, or less than or equal to, another value. For example:\n\n\
    ```javascript\nlet x = 5;\nlet y = 5;\nconsole.log(x <= y); // Output: true\n\
    console.log(x >= y); // Output: true\n```\nsee the output below.\n![](image_rsrc64G.jpg)\n\
    \n## LOGICAL OPERATORS\nIn programming, logical operators are used to combine\
    \ two or more conditions to form a more complex condition. There are three main\
    \ logical operators in JavaScript:\n\n### AND Operator (&&)\nThe AND operator\
    \ is represented by `&&` and is used to check if two conditions are both true.\
    \ It returns true only if both conditions are true. If one or both conditions\
    \ are false, it returns false.\n\nExample:\n```javascript\nlet x = 5;\nlet y =\
    \ 10;\nif(x > 0 && y > 5) {\n  console.log(\"Both conditions are true\");\n}\n\
    else {\n  console.log(\"At least one condition is false\");\n}\n// Output: Both\
    \ conditions are true\n```\nIn this example, the first condition `(x > 0)` is\
    \ true, and the second condition `(y > 5)` is also true. Therefore, the console\
    \ will output \"Both conditions are true\".\n\n### OR Operator (||)\nThe OR operator\
    \ is represented by `||` and is used to check if at least one of two conditions\
    \ is true. It returns true if one or both conditions are true. If both conditions\
    \ are false, it returns false.\n\nExample:\n```javascript\nlet x = 5;\nlet y =\
    \ 10;\nif(x > 0 || y < 5) {\n  console.log(\"At least one condition is true\"\
    );\n}\nelse { \n  console.log(\"Both conditions are false\");\n}\n// Output: At\
    \ least one condition is true\n```\nIn this example, the first condition `(x >\
    \ 0)` is true, and the second condition `(y < 5)` is false. However, since at\
    \ least one of the conditions is true, the console will output \"At least one\
    \ condition is true\". See the output below.\n![](image_rsrc64H.jpg)\n\n### NOT\
    \ Operator (!)\nThe NOT operator is represented by `!` and is used to reverse\
    \ the logical state of a condition. If a condition is true, the NOT operator will\
    \ make it false. If a condition is false, the NOT operator will make it true.\n\
    \nExample:\n```javascript\nlet x = 5;\nif(!(x > 0)) {\n  console.log(\"condition\
    \ is false\");\n}\nelse {\n  console.log(\"condition is true\");\n}\n// Output:\
    \ condition is true\n```\nIn this example, the condition `(x > 0)` is true, but\
    \ the `!` makes it false, triggering the `else` block.\n![](image_src64J)\n\n\
    ## CONDITIONAL STATEMENTS (IF/ELSE)\nConditional statements, also known as control\
    \ statements, are used to control the flow of a program. They allow the program\
    \ to make decisions. \n\n### The if Statement\nThe `if` statement syntax in JavaScript:\n\
    ```javascript\nif (condition) {\n  // block of code to be executed if condition\
    \ is true\n}\n```\nHere is an example:\n```javascript\nlet a = 5;\nif (a > 3)\
    \ {\n  console.log(\"a is greater than 3\");\n}\n```\nIn this example, the condition\
    \ `a > 3` evaluates to true, so the code inside the curly braces is executed.\
    \ (image_rsrc64K)\n\n### The Else Statement\nThe `else` statement can be used\
    \ in conjunction with the `if` statement to execute a block of code if the condition\
    \ is false. The `else` statement syntax:\n```javascript\nif (condition) {\n  //\
    \ block of code to be executed if condition is true\n}\nelse {\n  // block of\
    \ code to be executed if condition is false\n}\n```\nHere is an example:\n```javascript\n\
    let a = 2;\nif (a > 3) {\n  console.log(\"a is greater than 3\");\n}\nelse {\n\
    \  console.log(\"a is less than or equal to 3\");\n}\n```\nIn this example, the\
    \ condition `a > 3` evaluates to false, so the `else` block is executed. (image_rsrc64M)\n\
    \n### The else if statement\nThe `else if` statement can be used in conjunction\
    \ with the `if` statement to execute a block of code if a different condition\
    \ is true. The `else-if` statement syntax:\n```javascript\nif (condition1) {\n\
    \  // block of code to be executed if condition1 is true\n}\nelse if (condition2)\
    \ {\n  // block of code to be executed if condition2 is true\n}\nelse {\n  //\
    \ block of code to be executed if all conditions are false\n}\n```\nHere is an\
    \ example:\n```javascript\nlet a = 7;\nif (a > 10) {\n  console.log(\"a is greater\
    \ than 10\");\n}\nelse if (a > 5) {\n  console.log(\"a is greater than 5 but less\
    \ than or equal to 10\");\n}\nelse {\n  console.log(\"a is less than or equal\
    \ to 5\");\n}\n```\n"
