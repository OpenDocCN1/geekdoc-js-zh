    ## Understanding the basic structure of an HTML document


    here''s a brief overview of the basic structure of an HTML document:


    *   <!DOCTYPE html>: This is the document type declaration, which tells the web
    browser which version of HTML the document is written in. For HTML5, this should
    always be the first line of your document.


    *   <html>: The <html> tag is used to define the beginning and end of the HTML
    document. All the content of the document should be enclosed within these tags.


    *   <head>: The <head> tag contains meta-information about the document such as
    the title of the page, links to CSS stylesheets, and other metadata that is not
    displayed in the browser.


    *   <title>: The <title> tag is used to define the title of the document. This
    title appears in the browser''s title bar and is also used by search engines to
    describe the page.


    *   <body>: The <body> tag is used to define the main content of the document.
    This is where you put all of the visible content that will be displayed in the
    browser.


    *   <h1>, <h2>, <h3>, <h4>, <h5>, <h6>: These are the heading tags, which are
    used to define headings and subheadings within the document. <h1> is the largest
    heading and <h6> is the smallest.


    *   <p>: The <p> tag is used to define paragraphs of text.


    *   <a>: The <a> tag is used to create hyperlinks to other web pages or other
    sections within the same document.


    *   <img>: The <img> tag is used to insert images into the document.


    *   <ul> and <li>: These are the unordered list and list item tags, respectively.
    They are used to create bulleted lists.


    *   <ol> and <li>: These are the ordered list and list item tags, respectively.
    They are used to create numbered lists.


    *   <div>: The <div> tag is used to group related elements in the document. It
    is often used in conjunction with CSS to apply styles to a group of elements.


    That''s a quick overview of the basic structure of an HTML document. Keep in mind
    that there are many more tags and attributes available in HTML, but these are
    some of the most commonly used ones.


    ## Basic Tags and Attributes


    HTML5 includes a wide variety of tags and attributes that you can use to create
    content and structure web pages. Here are some of the most common HTML tags and
    attributes:


    Tags:


    *   <html>: The root tag that wraps around all other content on the web page.


    *   <head>: Contains meta-information about the web page, such as the page title
    and links to external stylesheets and scripts.


    *   <body>: Contains the main content of the web page.


    *   <h1> to <h6>: Used to create headings of varying levels of importance.


    *   <p>: Used to create paragraphs of text.


    *   <a>: Used to create hyperlinks to other web pages or resources.


    *   <img>: Used to insert images into the web page.


    *   <ul> and <ol>: Used to create unordered and ordered lists, respectively.


    *   <li>: Used to create list items.


    *   <div> and <span>: Used to group content and apply styles to it.


    *   <form>: Used to create a form for user input.


    Attributes:


    *   id: Used to uniquely identify an element on the web page.


    *   class: Used to group elements together and apply styles to them.


    *   src: Used to specify the URL of an image or other resource.


    *   alt: Used to provide alternative text for images, which is used by screen
    readers and search engines.


    *   href: Used to specify the URL that a hyperlink points to.


    *   target: Used to specify where the linked resource should be displayed (e.g.
    in a new window or tab).


    *   type: Used to specify the type of input in a form field (e.g. text, password,
    checkbox, radio button).


    These are just a few of the many HTML tags and attributes available. As you become
    more familiar with HTML, you''ll discover additional tags and attributes that
    can be used to create more complex and interactive web pages.


    ## Creating an HTML Document


    Here are the basic steps to create an HTML document:


    *   Open a text editor on your computer like Visual Studio.


    *   Start with the HTML doctype declaration, which is the first line of an HTML
    document. It looks like this: <!DOCTYPE html>


    *   Next, create the HTML document structure by adding the <html> element. This
    element contains the entire HTML document and has two parts: the <head> section
    and the <body> section.


    *   Inside the <head> section, you can add the title of your document using the
    <title> element. This is the text that appears in the browser''s title bar.


    *   Inside the <body> section, you can add the content of your document using
    various HTML elements such as <p> for paragraphs, <h1> for headings, <ul> and
    <li> for lists, etc.


    *   Once you''ve added all the content you want, save your file with a .html extension.


