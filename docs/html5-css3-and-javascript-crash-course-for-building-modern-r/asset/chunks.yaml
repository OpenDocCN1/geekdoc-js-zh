    ## 理解表单验证


    表单验证是对表单用户输入进行检查的过程，以确保符合某些要求或约束。验证非常重要，因为它有助于确保通过表单收集的数据的准确性和一致性。


    HTML5 提供了内置表单验证功能，允许你通过属性为输入字段指定验证要求。验证在现代浏览器中自动完成，如果输入不符合要求，用户将收到错误提示。


    HTML 中用于表单验证的一些常用属性包括：


    -   `required`：指定提交表单前必须填写输入字段。

    -   `pattern`：指定匹配的正则表达式。

    -   `min` 和 `max`：指定数值输入字段允许的最小最大值。

    -   `minlength` 和 `maxlength`：指定文本输入字段的最小最大长度。

    -   `type`：指定输入类型（如 email、url、number 或 date），浏览器将相应对其进行验证。


    以下是使用这些验证属性的示例：


    ![](img/image_rsrc60E.jpg)


    在上述代码中，`required` 属性用于确保在提交表单之前填写用户名、邮箱和密码字段。`minlength` 属性用于指定用户名和密码字段至少为 5 个和
    8 个字符。`type` 属性用于指定邮箱和数字输入字段，并启用浏览器对其相应的验证。


