    # CHAPTER ELEVEN


    # RESPONSIVE WEBSITES PRACTICAL EXERCISES


    In this chapter, we will focus on practical exercises that will help you create
    a responsive website from scratch. You will learn how to use HTML and CSS to build
    a website that looks good on desktop computers, tablets, and smartphones.


    We will cover various topics such as layout design, media queries, and responsive
    images. By the end of this chapter, you will be able to create a website that
    looks great on any device, making it accessible to a wider audience.


    ## Exercise 1: Design a responsive restaurant website


    Design a responsive restaurant website with a homepage, menu page, reservation
    page, and contact page. Use responsive design techniques to ensure the website
    looks good on all devices and provides a user-friendly experience for customers
    with HTML and CSS.


    Below is an example of how you can create a restaurant website.


    HTML Code:


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta http-equiv="X-UA-Compatible" content="IE=edge">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Restaurant Homepage</title>


    <link rel="stylesheet" href="style.css">


    </head>


    <body>


    <header>


    <nav>


    <ul>


    <li><a href="#">Home</a></li>


