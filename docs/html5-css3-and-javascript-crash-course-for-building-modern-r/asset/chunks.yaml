  raw: 'The benefit of asynchronous programming is that it can improve the performance
    and responsiveness of an application. Without it, the application would have to
    wait for each long-running task to finish before proceeding to the next, making
    the application appear slow and unresponsive. By using asynchronous programming,
    the application can continue to respond to user input while performing these long-running
    tasks in the background.


    One common example of asynchronous programming is a network request. When a user
    clicks a button to fetch data from a server, the application can use an asynchronous
    function to send the request and continue executing code while waiting for a response.
    When the response arrives, the function can be notified and process the data.


    However, asynchronous programming can be complex and difficult to manage, particularly
    when multiple asynchronous tasks are running simultaneously. That''s why JavaScript
    provides several tools to simplify the process, including callback functions,
    promises, and async/await.


    CALLBACK FUNCTIONS


    Callback functions are functions that are passed as arguments to other functions
    and are executed when certain events occur. These events can be anything from
    a user clicking on a button to an HTTP request returning a response. Callback
    functions are a fundamental concept in asynchronous programming in JavaScript.


    Let''s look at an example of a callback function in action. Suppose we have an
    array of numbers and we want to iterate over the array and double each number.
    We can use the map method to achieve this:


    const numbers = [1, 2, 3, 4, 5];


    const doubledNumbers = numbers.map(function(number) {


    return number * 2;


    });


    console.log(doubledNumbers); // Output: [2, 4, 6, 8, 10]


    In this example, we''re passing a callback function to the map method. The map
    method will execute this function for each element in the numbers array and return
    a new array with the transformed values.


    Let''s look at another example where we use a callback function to handle an asynchronous
    operation. Suppose we have a function that makes an HTTP request to an API and
    returns the response data. We want to be able to do something with this data once
    it''s returned, but we don''t know exactly when the data will be returned. We
    can use a callback function to handle this:


    function makeHttpRequest(url, callback) {


    const xhr = new XMLHttpRequest();


    xhr.addEventListener(''load'', function() {


    if (xhr.status === 200) {


    callback(xhr.responseText);


    }


    });


    xhr.open(''GET'', url);


    xhr.send();


    }


    makeHttpRequest(''https://jsonplaceholder.typicode.com/posts/1'', function(responseData)
    {


    const data = JSON.parse(responseData);


    console.log(data);


    });


    In this example, we''re passing a callback function as the second argument to
    the makeHttpRequest function. Once the HTTP request is complete and we have the
    response data, we''re calling the callback function with the data as the argument.
    In this case, we''re simply logging the data to the console, but we could do anything
    with the data inside the callback function.


    Callback functions can also be used to handle errors that occur during an asynchronous
    operation. Let''s modify our makeHttpRequest function to handle errors with a
    callback function:


    function makeHttpRequest(url, successCallback, errorCallback) {


    const xhr = new XMLHttpRequest();


    xhr.addEventListener(''load'', function() {


    if (xhr.status === 200) {


    successCallback(xhr.responseText);


    } else {


    errorCallback(xhr.statusText);


    }


    });


    xhr.addEventListener(''error'', function() {


    errorCallback(''Network Error'');


    });


    xhr.open(''GET'', url);


    xhr.send();


    }


    makeHttpRequest(''https://jsonplaceholder.typicode.com/posts/1'', function(responseData)
    {


    const data = JSON.parse(responseData);


    console.log(data);


    }, function(error) {


    console.error(error);


    });


    In this example, we''re passing two callback functions as arguments to the makeHttpRequest
    function. The successCallback function will be called if the HTTP request is successful,
    and the errorCallback function will be called if an error occurs. We''re also
    handling the error event separately and calling the errorCallback function with
    an appropriate error message.


    UNDERSTANDING PROMISES


    Promises are a newer method of asynchronous programming that was introduced in
    ECMAScript 6\. Promises are a way of handling asynchronous operations in JavaScript.
    A promise is an object that represents a future value, which may or may not be
    available yet. Promises provide a cleaner and more flexible way to handle asynchronous
    operations compared to traditional callback functions. A promise can have three
    states:


    *   Pending: The initial state, the promise is neither fulfilled nor rejected
    yet.


    *   Fulfilled: The promise has been completed, and the result value is available.


    *   Rejected: The promise has failed, and the error message is available.


    Here''s an example of a promise that represents a simulated HTTP request:


    const getData = () => {


    return new Promise((resolve, reject) => {


    setTimeout(() => {


    const data = { id: 1, name: ''John Smith '' };


    resolve(data);


    }, 2000);


    });


    };


    In this example, getData() returns a new promise. Inside the promise, there is
    a setTimeout() function that simulates a delay of 2 seconds. Once the delay is
    complete, the resolve() function is called with a sample data object as an argument.


    To use this promise, you can call the then() method on it, passing in a callback
    function that will be executed once the promise is fulfilled:


    getData().then(data => {


    console.log(data); // Output: { id: 1, name: ''John Smith'' }


    });


    In this example, the then() method takes a callback function that takes the resolved
    data as an argument. The console.log() statement will output the data object to
