    ## Arrays and Loops


    Arrays and loops are two of the most fundamental concepts in JavaScript. Arrays
    are used to store collections of data, while loops are used to iterate over that
    data. In this chapter, we will dive into working with arrays, using array methods,
    and exploring different types of loops in JavaScript.


    ### Working with Arrays and Array Methods


    Arrays are used to store collections of data in JavaScript. An array is a special
    type of variable that can hold multiple values. Each value in an array is called
    an element, and each element has a unique index number that represents its position
    in the array.


    To declare an array, we use square brackets and separate the elements with commas.
    For example:


    ```javascript

    let fruits = ["apple", "banana", "orange"];

    ```


    In the above example, we declared an array named `fruits` with three elements:
    "apple", "banana", and "orange".


    We can access individual elements of an array using their index numbers. The index
    of the first element in an array is always `0`. For example, to access the first
    element of the `fruits` array, we would use:


    ```javascript

    let firstFruit = fruits[0];

    ```


    This would assign the value "apple" to the `firstFruit` variable.


    Arrays also have several built-in methods that allow us to manipulate the data
    they contain. Some of the most commonly used array methods include:


    - `push()`: Adds one or more elements to the end of an array.

    - `pop()`: Removes the last element from an array and returns it.

    - `shift()`: Removes the first element from an array and returns it.

    - `unshift()`: Adds one or more elements to the beginning of an array.

    - `splice()`: Adds or removes elements from an array at a specified index.

    - `slice()`: Returns a new array containing a portion of the original array.


