    # CHAPTER SEVEN: INTRODUCTION TO CSS


    CSS (Cascading Style Sheets) is a language used to describe the presentation of
    a document written in HTML (Hypertext Markup Language). It is used to add style
    and formatting to web pages and can control the layout, typography, colors, and
    other visual elements of a webpage. CSS can be used to create responsive designs
    that adapt to different screen sizes and devices, and it can be used in conjunction
    with HTML and JavaScript to create dynamic and interactive web pages. Understanding
    CSS is essential for creating professional-looking and functional websites.


    ![What is CSS?](image_rsrc61S.jpg)


    ## What is CSS?


    CSS stands for Cascading Style Sheets. It is a styling language used to describe
    the presentation of a document written in HTML or XML, including colors, layout,
    fonts, and other visual elements. CSS separates the content of a web page from
    its presentation, allowing for more flexible and efficient website design. By
    using CSS, web developers can control the look and feel of a website across multiple
    web pages and devices, making it easier to maintain and update.


    ## How is CSS used in Web Development?


    CSS works by selecting HTML elements and defining how they should be displayed.
    For example, you can select all paragraphs on a page and set their font size,
    color, and line height to create a consistent look throughout the document. CSS
    can be applied to HTML elements directly or through classes and IDs, which allows
    for more targeted styling.


    CSS is an essential part of modern web development and is used to create visually
    appealing and user-friendly websites. It allows developers to separate the content
    and structure of a webpage from its presentation, making it easier to maintain
    and update. With CSS, you can create responsive designs that adapt to different
    screen sizes and devices, and add animations and interactive elements to enhance
    the user experience.


    ## How CSS works with HTML


    CSS works with HTML by targeting and styling the HTML elements within a webpage.
    HTML provides the structure and content of the webpage, while CSS is used to control
    the presentation and layout of that content.


    CSS selectors are used to target HTML elements, and then properties are applied
    to those elements to change their appearance. For example, the following CSS code
    would target all `<p>` elements and set their font size to 16 pixels:


    ![](image_rsrc61T.jpg)


    This would make all paragraphs within the HTML document have a font size of 16
    pixels. CSS can be applied to HTML documents in a few different ways, such as
    through an external stylesheet file or inline styles within the HTML document.


    ## Understand the Difference Between CSS and HTML


    HTML and CSS are two separate languages used in web development. HTML, or HyperText
    Markup Language, is used for creating the structure and content of a web page.
    It defines the various elements that make up the page, such as headings, paragraphs,
    images, and links.


    CSS, or Cascading Style Sheets, is used for styling the presentation of the web
    page. It defines how the HTML elements should be displayed, such as the color,
    font, size, and layout. CSS can be used to create complex page layouts and visually
    appealing designs.


    In short, while HTML defines the content and structure of a web page, CSS defines
    its presentation and style. They work together to create a complete and functional
    website.


    ## Benefits of using CSS


    There are several benefits of using CSS in web development:


    * **Separation of presentation and content**: CSS allows for a clear separation
    between the presentation and content of a web page, making it easier to maintain
    and update the design without affecting the content.

    * **Consistency**: CSS enables the designer to apply consistent styles to multiple
    pages, ensuring that the look and feel of the website are uniform.

    * **Flexibility**: CSS provides flexibility in design by allowing for the use
    of various layout and positioning techniques, as well as the ability to create
    responsive designs that adapt to different screen sizes.

    * **Faster page load times**: By separating the presentation and content, CSS
    reduces the amount of code needed to load a web page, resulting in faster page
    load times.

    * **Accessibility**: CSS makes it easier to create accessible websites by providing
    the ability to apply styles to specific elements, such as headings and links,
    and improving the readability of the content.


    ## Basic CSS Syntax


    The basic syntax of CSS consists of a selector and a set of declarations:


    ![](image_rsrc61U.jpg)


    The selector selects the HTML element(s) that you want to apply the styles, and
    the declarations define the styles themselves. Each declaration consists of a
    property and its value, separated by a colon.


    Here is an example:


    ![](image_rsrc61V.jpg)


    In this example, `h1` is the selector that targets all `h1` HTML elements, and
    the declarations define the styles that will be applied to them: blue text color,
    `24px` font size, and centered text alignment.


    ## Writing CSS rules


    Writing CSS rules involves selecting HTML elements and applying style properties
    to them. The basic syntax for writing a CSS rule is:


    ![](image_rsrc61W.jpg)


    * **Selector**: Specifies which HTML element(s) the rule applies to

    * **Property**: Defines the aspect of the element that we want to style

    * **Value**: Sets the value of the property


    For example, to set the font color of all paragraph elements to red, we would
    use the following CSS rule:


    ![](image_rsrc61X.jpg)


    Multiple properties can be applied to the same selector, by separating them with
    a semicolon (`;`). For example:


    ![](image_rsrc61Y.jpg)


    This rule sets the font size of all `h1` elements to `24 pixels`, sets the color
    to blue, and centers the text.


    ## Selectors and Declarations


    In CSS, selectors and declarations are used to target specific HTML elements and
    apply styling rules to them.


    Selectors are patterns used to select the elements that you want to style, while
    declarations define the styling rules that you want to apply to those elements.
    For example, consider the following CSS code:


    ![](image_rsrc61Z.jpg)


    In this example, the `h1` selector targets all `<h1>` elements on the page, and
    the declarations inside the curly braces apply the styling rules. The `color`
    declaration sets the text color to red, and the `font-size` declaration sets the
    font size to `24 pixels`.

