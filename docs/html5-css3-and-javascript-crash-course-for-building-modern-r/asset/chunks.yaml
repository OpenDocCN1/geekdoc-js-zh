    ## Working with Strings, Numbers, and Boolean Values


    Strings, numbers, and boolean values are the most common data types used in JavaScript.
    Understanding how to work with these data types is essential to effectively write
    JavaScript code.


    ### Working with Strings


    A string is a sequence of characters enclosed in single or double quotes. In JavaScript,
    strings are considered objects and have a set of properties and methods that can
    be used to manipulate them.


    #### Declaring a String Variable


    To declare a string variable in JavaScript, you can use either single or double
    quotes. Here is an example:


    ```javascript

    let message = ''Hello World!'';

    ```


    You can also use backticks to declare a string variable. Backticks are useful
    for creating template literals, which allow you to embed expressions inside a
    string. Here is an example:


    ```javascript

    let name = ''Sammie'';

    let greeting = `Hello ${name}!`;

    console.log(greeting); // output: Hello Sammie!

    ```


    See the output below.


    ![](image_rsrc63Y.jpg)


    #### Accessing Individual Characters in a String


    You can access individual characters in a string by using the `charAt()` method
    or square bracket notation. Here is an example:


    ```javascript

    let message = ''Hello World!'';

    console.log(message.charAt(0)); // output: H

    console.log(message[0]); // output: H

    ```


    See the output below.


    ![](image_rsrc63Z.jpg)


    #### Concatenating Strings


    You can concatenate two or more strings using the concatenation operator (+) or
    template literals. Below is an example:


    ```javascript

    let firstName = ''Sammie'';

    let lastName = ''Smith'';

    let fullName = firstName + '' '' + lastName;

    console.log(fullName); // output: Sammie Smith

    let message = `My name is ${firstName} ${lastName}.`;

    console.log(message); // output: My name is Sammie Smith

    ```


    See the output below.


    ![](image_rsrc640.jpg)


    ### Working with Numbers


    In JavaScript, numbers are represented as floating-point values. You can perform
    arithmetic operations such as addition, subtraction, multiplication, and division
    of numbers.


    #### Declaring a Number Variable


    To declare a number variable in JavaScript, you can simply assign a numeric value
    to a variable. Here is an example:


    ```javascript

    let x = 10; let y = 3.14;

    ```


    #### Performing Arithmetic Operations


    You can perform arithmetic operations on numbers using operators such as +, -,
    *, and /. Here is an example:


    ```javascript

    let x = 10; let y = 5;

    console.log(x + y); // output: 15

    console.log(x - y); // output: 5

    console.log(x * y); // output: 50

    console.log(x / y); // output: 2

    ```


    See the output below.


    ![](image_rsrc641.jpg)


    ### Working with Booleans


    A Boolean value represents either true or false. Booleans are commonly used in
    conditional statements and loops to control the flow of a program.


    #### Declaring a Boolean Variable


    To declare a Boolean variable in JavaScript, you can simply assign a true or false
    value to a variable. Here is an example:


    ```javascript

    let isRaining = true;

    let isSunny = false;

    ```


    #### Using Boolean Operators


    You can use Boolean operators such as && (and), || (or), and ! (not) to perform
    logical operations on Boolean values. Here is an example:


    ```javascript

    let isRaining = true;

    let isCold = true;

    let isWindy = false;

    console.log(isRaining && isCold); // output: true

    console.log(isRaining || isWindy); // output: true

    console.log(!isCold); // output: false

    ```


    See the output below.


    ![](image_rsrc642.jpg)


