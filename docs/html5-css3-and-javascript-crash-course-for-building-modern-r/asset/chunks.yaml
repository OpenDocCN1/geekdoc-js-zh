    # Chapter Twelve: Getting Started with JavaScript


    ## What Exactly is JavaScript


    JavaScript is a high-level, interpreted programming language that is widely used
    for client-side web development. It was first developed by Brendan Eich at Netscape
    in 1995 as a way to add dynamic and interactive features to web pages.


    When designing web pages, applications, servers, or even games, web developers
    frequently employ the lightweight programming language JavaScript to generate
    more dynamic interactions. JavaScript is typically used by developers along with
    HTML and CSS. For formatting HTML components, the scripting language and CSS function
    well together. User interaction is still maintained via JavaScript, but CSS is
    unable to do so on its own.

