    0.3 秒并使用 `ease` 计时函数。


    当悬停在按钮上时，我们使用 `:hover` 伪类应用新的红色背景颜色。由于过渡属性的作用，背景颜的变化将在指定的持续时间和计时函数内平滑且渐进地发生。你可以将
    CSS 过渡应用于广泛的 CSS 属性，包括背景颜色、字体大小、宽度、高度、透明度等。


    ## 使用关键帧进行动画


    使用关键帧进行动画是一种 CSS 技术，它允许你创建比传统过渡控制力更复杂的动画。它涉及使用 `@keyframes` 规则在不同时间点定义动画步骤，然后使用
    `animation` 属性将该动画应用于元素。


