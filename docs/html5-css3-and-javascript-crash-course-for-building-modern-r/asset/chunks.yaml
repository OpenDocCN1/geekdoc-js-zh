    作用域指的是变量在代码不同部分的可见性。在 JavaScript 中，有两种作用域：全局作用域和局部作用域。


    **全局作用域**


    全局作用域指的是在函数外部声明的变量，可以从代码的任何地方访问：


    ```javascript

