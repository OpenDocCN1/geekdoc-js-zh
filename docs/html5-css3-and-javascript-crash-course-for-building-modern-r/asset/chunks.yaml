    \ // Output: \"Sammie Smith\"\n```\n\nIn this example, we define the `fullName`\
    \ method using a shorthand notation. The result is the same as the previous example.\
    \ See the screenshot of the output below.\n\n![](image_rsrc657.jpg)\n\n## Creating\
