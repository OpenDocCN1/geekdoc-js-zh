    # HTML Practical Exercises


    The HTML Practical Exercises chapter is a collection of practical exercises designed
    to help you master HTML coding skills by creating various types of websites. This
    chapter includes a range of projects, from simple to complex, to suit the needs
    of different skill levels. These projects cover a wide range of topics, including
    basic HTML tags and attributes, forms, tables and lists, multimedia, canvas, and
    SVG graphics, and advanced HTML features like web storage, geolocation, and web
    workers. Each project is designed to challenge your coding abilities and help
    you develop your problem-solving skills. By completing these projects, you can
    gain a better understanding of how HTML works, improve your code quality, and
    create functional and visually appealing websites. Whether you are a beginner
    or an experienced web developer, the HTML Practical Exercises chapter can help
    you refine your skills and become a proficient HTML coder.


    ## Exercise 1: Creating a Login Page


    ### Overview


    You will need to first create a folder for your code files, ensuring that both
    the index file and the subordinate files are together in the same folder. Do this
    for every single project you are carrying out.


    ### Code


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset=''utf-8''>

    <meta http-equiv=''X-UA-Compatible'' content=''IE=edge''>

    <title>Example Page</title>

    <meta name=''viewport'' content=''width=device-width, initial-scale=1''>

    <link rel=''stylesheet'' type=''text/css'' media=''screen'' href=''main.css''>

    <script src=''main.js''></script>

    </head>

    <body>

    <form>

    <h1>Login Page</h1>

    <label for="username">Username:</label>

    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>

    <input type="password" id="password" name="password" required>

    <input type="submit" value="Login">

    </form>

    </body>

    </html>

    ```


