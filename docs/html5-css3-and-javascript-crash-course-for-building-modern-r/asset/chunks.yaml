    CONSTRUCTORS AND PROTOTYPES


    Constructors and prototypes are an essential part of object-oriented programming
    in JavaScript. In this section, we will explore how constructors and prototypes
    work and how they can be used to create objects and classes.


    Constructors are functions that are used to create new objects. They define the
    properties and methods of the object and can also define default values for these
    properties. When a constructor is called with the new keyword, a new object is
    created, and the constructor initializes the object''s properties.


    Here''s an example of a constructor function:


    function Person(name, age) {


    this.name = name;


    this.age = age;


    }


    let person1 = new Person("John", 30);


    let person2 = new Person("Jane", 25);


    In this example, we have created a constructor function called Person that takes
    two arguments, name, and age. Inside the constructor, we set the name and age
    properties of the object using this keyword. We then create two new Person objects,
    person1, and person2, using the new keyword and passing in the name and age arguments.


    Prototypes are used to add new properties and methods to an object or class. They
    allow us to define a set of properties and methods that can be shared by all objects
    created from the same constructor function.


    Here''s an example of how to add a method to a constructor''s prototype:


    function Person(name, age) {


    this.name = name;


    this.age = age;


    }


    Person.prototype.greet = function() {


    console.log("Hello, my name is " + this.name + " and I am " + this.age + " years
    old.");


    }


    let person1 = new Person("John", 30);


    person1.greet(); // Output: "Hello, my name is John and I am 30 years old."


    In this example, we have added a new method called greet to the Person constructor''s
    prototype. This method is then available to all objects created from the Person
    constructor. We create a new Person object, person1, and call the greet method
    on it to output a message to the console. See the screenshot below.


    ![](image_rsrc65A.jpg)


    Another use of prototypes is to create classes in JavaScript. A class is a blueprint
    for creating objects that share the same properties and methods. We can use a
    constructor function and its prototype to create a class.


    Here''s an example of how to create a class using a constructor and its prototype:


    function Animal(name) {


    this.name = name;


    }


    Animal.prototype.sayName = function() {


    console.log("My name is " + this.name);


    }


    class Dog extends Animal {


    constructor(name, breed) {


    super(name);


    this.breed = breed;


    }


    bark() {


    console.log("Woof! Woof!");


    }


    }


    let myDog = new Dog("Rufus", "Labrador Retriever");


    myDog.sayName(); // Output: "My name is Rufus"


    myDog.bark(); // Output: "Woof! Woof!"


    In this example, we create a new class called Dog that extends the Animal class.
    We use the constructor function and its prototype to define the properties and
    methods of the Dog class. We also use the super keyword to call the Animal constructor
    and set the name property. We then define a new method, bark, that is specific
    to the Dog class.


    We create a new Dog object, myDog, and call the sayName and bark methods on it
