    ## 文本输入框与标签


    在 HTML 中，文本输入和标签用于在网页上创建用户输入字段。文本输入允许用户输入文本，而标签则用于描述在输入字段中输入什么类型的信息。


    要创建一个文本输入字段，可以使用带有 `type="text"` 属性的 `<input>` 标签。例如：


    ![](img/image_rsrc604.jpg)


