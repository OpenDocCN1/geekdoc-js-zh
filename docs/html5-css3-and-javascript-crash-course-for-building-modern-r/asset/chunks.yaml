    # JavaScript 中的 Async/Await


    在上述代码中，`await` 关键字用于等待 `fetch` 方法的完成，该方法返回一个解析为 `Response` 对象的 `Promise`。`Response`
    对象的 `JSON` 方法也返回一个 `Promise`，该 `Promise` 解析为实际的 `JSON` 数据。通过使用 `await` 关键字，我们等待两个
    `Promise` 解析后再返回数据。


    我们也可以将 `try`/`catch` 块与 `async`/`await` 函数一起使用来处理错误。以下是一个示例：


    ```javascript

    async function getData() {


    try {


    const response = await fetch(''https://api.example.com/data'');


    const data = await response.json();


    return data;


    } catch (error) {


    console.error(''Error fetching data:'', error);


    }


    }

    ```


    在上述代码中，如果在获取或解析数据时发生错误，错误将在 `catch` 块中被捕获并记录到 `console`。


    `Async`/`await` 也可以与 `Promise.all` 一起使用，以并行获取多个资源。以下是一个示例：


    ```javascript

    async function getData() {


    const [userData, postData] = await Promise.all([


    fetch(''https://api.example.com/users''),


    fetch(''https://api.example.com/posts'')


    ]);


    const users = await userData.json();


    const posts = await postData.json();


    return { users, posts };


    }

    ```


    在上述代码中，我们使用 `Promise.all` 同时获取用户和帖子数据。然后使用 `await` 关键字等待两个 `Promise` 解析后再解析 `JSON`
    数据并将其作为对象返回。


    # 第二十章：AJAX 和 APIs


    本章聚焦于 `AJAX`（Asynchronous JavaScript and XML，异步 JavaScript 和 XML）和 `APIs`（Application
    Programming Interfaces，应用程序编程接口），它们是构建动态和交互式 Web 应用程序的重要工具。`AJAX` 是一种与服务器交换数据、在不刷新整个页面的情况下更新网页部分内容并提供无缝用户体验的技术。另一方面，`APIs`
    提供了不同软件应用程序相互通信的方式，使开发者能够访问第三方服务的数据和功能，并将其集成到自己的应用程序中。


    在本章中，我们将介绍 `AJAX` 和 `APIs` 的基础知识，包括如何使用 `APIs`、如何使用 `AJAX` 获取数据以及如何在网页上显示数据。我们还将讨论一些常见的
    `API` 集成场景，如社交媒体集成、天气数据集成等。到本章结束时，你将对如何使用 `AJAX` 和 `APIs` 创建强大的、动态的和交互式的 Web 应用程序有一个扎实的理解。


    ## AJAX 简介


    `AJAX` 是 Asynchronous `JavaScript` and `XML`（异步 JavaScript 和 XML）的缩写。它是一种用于 Web
    开发的技术，用于创建可以与 Web 服务器交换数据而无需重新加载整个页面的动态网页。`AJAX` 基于 `JavaScript`，并使用 `XMLHttpRequest`（`XHR`）对象和
    `DOM` 的组合来与服务器异步交互并更新网页。


    在 `AJAX` 出现之前，每次请求新数据时都必须重新加载整个网页，导致用户体验缓慢且低效。有了 `AJAX`，网页可以更新部分内容而无需重新加载整个页面，使用户体验更加流畅和快速。


    `AJAX` 在 Web 开发中广泛用于多种场景，例如实时聊天应用程序、动态网页表单和自动建议搜索栏。它还允许开发者创建可以与 `APIs` 交互并实时获取和显示数据的
    Web 应用程序。


    ## 使用 APIs


    `API` 是 "Application Programming Interface"（应用程序编程接口）的缩写。它是一组用于构建软件应用程序的协议、例程和工具。`APIs`
    提供了不同软件组件相互交互的方式。在 Web 开发中，`API` 通常用于与服务器通信并检索数据或执行其他操作。


    要使用 `API`，你需要知道 `API` 的端点或 URL，以及任何所需的认证或 `API` 密钥。你还需要知道 `API` 返回的数据格式，例如 `JSON`
    或 `XML`。


    #### 使用 Fetch API 获取数据


    ```javascript

    fetch(''https://api.example.com/data'')

    .then(response => response.json())

    .then(data => console.log(data))

    .catch(error => console.error(error));

    ```


    在这个示例中，我们使用 `Fetch API` 向 `API` 端点 `https://api.example.com/data` 发送 GET 请求。然后使用
    `response.json()` 方法将响应转换为 `JSON`。结果数据被记录到 `console`。


    #### 使用 Fetch API 发送数据


    ```javascript

    fetch(''https://api.example.com/data'', {

    method: ''POST'',

    body: JSON.stringify({ name: ''John Doe'', email: ''johndoe@example.com'' }),

    headers: { ''Content-Type'': ''application/json'' }

    })

    .then(response => response.json())

    .then(data => console.log(data))

    .catch(error => console.error(error));

    ```


    在这个示例中，我们使用 `Fetch API` 向 `API` 端点 `https://api.example.com/data` 发送 POST 请求。我们在请求正文中包含一个
    `JSON` 对象，其中包含 name 和 email 属性。我们还将 Content-Type 头设置为 `application/json`。然后使用
    `response.json()` 方法将响应转换为 `JSON`。结果数据被记录到 `console`。


    #### 使用 Axios


    ```javascript

    axios.get(''https://api.example.com/data'')

    .then(response => console.log(response.data))

    .catch(error => console.error(error));

    ```


    在这个示例中，我们使用 `Axios` 库向 `API` 端点 `https://api.example.com/data` 发送 GET 请求。响应数据被记录到
    `console`。


    ### 实践练习：天气应用


