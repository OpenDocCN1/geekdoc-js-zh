    Greater than (>), than (<):


    Less These operators are used to compare two values to see if one is greater than
    or less than the other. For example:


    let x = 5;


    let y = 10;


    console.log(x < y); // Output: true


    console.log(x > y); // Output: false


    See the output below.


    ![](image_rsrc64F.jpg)


    Greater than or equal to (>=), less than or equal to (<=):


    These operators are used to check if one value is greater than or equal to, or
    less than or equal to, another value. For example:


    let x = 5; let y = 5;


    console.log(x <= y); // Output: true


    console.log(x >= y); // Output: true


    see the output below.


    ![](image_rsrc64G.jpg)


    LOGICAL OPERATORS


    In programming, logical operators are used to combine two or more conditions to
    form a more complex condition. There are three main logical operators in JavaScript:


    AND Operator (&&):


    The AND operator is represented by && and is used to check if two conditions are
    both true. It returns true only if both conditions are true. If one or both conditions
    are false, it returns false.


    Example:


    let x = 5;


    let y = 10;


    if(x > 0 && y > 5) {


    console.log("Both conditions are true");


    }


    else {


    console.log("At least one condition is false");


    }


    // Output: Both conditions are true


    In this example, the first condition (x > 0) is true, and the second condition
    (y > 5) is also true. Therefore, the console will output "Both conditions are
    true".


    OR Operator (||):


    The OR operator is represented by || and is used to check if at least one of two
    conditions is true. It returns true if one or both conditions are true. If both
    conditions are false, it returns false.


    Example:


    let x = 5;


    let y = 10;


    if(x > 0 || y < 5) {


    console.log("At least one condition is true");


    }


    else { console.log("Both conditions are false");


    }


    // Output: At least one condition is true


    In this example, the first condition (x > 0) is true, and the second condition
    (y < 5) is false. However, since at least one of the conditions is true, the console
    will output "At least one condition is true". See the output below.


    ![](image_rsrc64H.jpg)


    NOT Operator (!):


    The NOT operator is represented by ! and is used to reverse the logical state
    of a condition. If a condition is true, the NOT operator will make it false. If
    a condition is false, the NOT operator will make it true.


    Example:


    let x = 5;


    if(!(x > 0)) {


    console.log("The condition is false");


    }


    else {


    console.log("The condition is true");


    }


    // Output: The condition is true


    In this example, the condition inside the parentheses (x > 0) is true. However,
    the NOT operator (!) in front of the parentheses reverses the logical state of
    the condition and makes it false. Therefore, the console will output "The condition
    is true". See the screenshot below


    ![](image_rsrc64J.jpg)


    CONDITIONAL STATEMENTS (IF/ELSE)


    Conditional statements, also known as control statements, are used to control
    the flow of a program. They allow the program to make decisions based on certain
    conditions. Conditional statements are a crucial part of programming because they
    make the program more flexible and intelligent. In this section, we will explore
    conditional statements in JavaScript.


    The two main types of conditional statements are the if statement and the switch
    statement. The if statement is used to execute a block of code if a condition
    is true. The switch statement is used to execute different code blocks based on
    different conditions.


    The if Statement:


    The if statement syntax in JavaScript is written like this:


    if (condition) {


    // block of code to be executed if the condition is true


    }


    The condition in the if statement is an expression that is evaluated to be either
    true or false. If the condition is true, the block of code inside the curly braces
    will be executed. If the condition is false, the block of code will be skipped.


    Here is an example:


    let a = 5;


    if (a > 3) {


    console.log("a is greater than 3");


    }


    In this example, the condition is a > 3, which evaluates to true because a is
    equal to 5, which is greater than 3. Therefore, the block of code inside the curly
    braces will be executed, and the message "a is greater than 3" will be printed
    on the console. The output of the code above is shown below.


    ![](image_rsrc64K.jpg)


    The Else Statement:


    The else statement can be used in conjunction with the if statement to execute
    a block of code if the condition is false. The else statement syntax is written
    as follows:


    if (condition) {


    // block of code to be executed if the condition is true


    }


    else {


    // block of code to be executed if the condition is false


    }


    Here is an example:


    let a = 2;


    if (a > 3) {


    console.log("a is greater than 3");


    }


    else { console.log("a is less than or equal to 3");


    }


    In this example, the condition is a > 3, which evaluates to false because a is
    equal to 2, which is less than 3. Therefore, the block of code inside the else
    statement will be executed, and the message "a is less than or equal to 3" will
    be printed to the console. The output of the above code is shown below.


    ![](image_rsrc64M.jpg)


    The else if statement:


    The else if statement can be used in conjunction with the if statement to execute
    a block of code if a different condition is true. The else-if statement syntax
    is written as follows:


    if (condition1) {


    // block of code to be executed if condition1 is true


    }


    else if (condition2) {


    // block of code to be executed if condition2 is true


    }


    else {


    // block of code to be executed if all conditions are false


    }


    Here is an example:


    let a = 7;


    if (a > 10) {


    console.log("a is greater than 10");


    }


    else if (a > 5) {


    console.log("a is greater than 5 but less than or equal to 10");


    }


    else { console.log("a is less than or equal to 5");


