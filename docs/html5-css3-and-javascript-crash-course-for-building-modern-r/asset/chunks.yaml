    # 第七章：CSS 简介


    CSS（层叠样式表）是一种用于描述用 HTML（超文本标记语言）编写的文档呈现方式的语言。它用于为网页添加样式和格式，可以控制网页的布局、排版、颜色和其他视觉元素。CSS
    可用于创建适应不同屏幕尺寸和设备的响应式设计，并可与 HTML 和 JavaScript 结合使用，以创建动态且交互的网页。理解 CSS 对于创建专业且功能齐全的网站至关重要。


    ![什么是 CSS?](img/image_rsrc61S.jpg)


    ## 什么是 CSS?


    CSS 的全称是 Cascading Style Sheets（层叠样式表）。它是一种样式语言，用于描述用 HTML 或 XML 编写的文档的呈现方式，包括颜色、布局、字体和其他视觉元素。CSS
    将网页的内容与其呈现方式分离，从而实现更灵活、更高效的网站设计。通过使用 CSS，Web 开发人员可以在多个网页和设备上控制网站的外观和感觉，使其更易于维护和更新。


    ## CSS 在 Web 开发中如何使用？


    CSS 的工作原理是通过选择 HTML 元素并定义它们应如何显示。例如，您可以选择页面上的所有段落，并设置它们的字体大小、颜色和行高，从而在整个文档中创建一致的外观。CSS
    可以直接应用于 HTML 元素，也可以通过类（class）和 ID 应用，从而实现更具针对性的样式定义。


    CSS 是现代 Web 开发的重要组成部分，用于创建视觉吸引力强且用户友好的网站。它允许开发人员将网页的内容和结构与其呈现方式分离，使其更易于维护和更新。借助
    CSS，您可以创建适应不同屏幕尺寸和设备的响应式设计，并添加动画和交互元素以增强用户体验。


    ## CSS 如何与 HTML 协同工作


    CSS 通过定位并为网页中的 HTML 元素设置样式来与 HTML 协同工作。HTML 提供网页的结构和内容，而 CSS 则用于控制该内容的呈现和布局。


    CSS 选择器用于定位 HTML 元素，然后将属性应用于这些元素以改变其外观。例如，以下 CSS 代码将定位所有 `<p>` 元素并将其字体大小设置为 16
    像素：


    ![](img/image_rsrc61T.jpg)


    这将使 HTML 文档中的所有段落字体大小均为 16 像素。CSS 可以通过几种不同的方式应用于 HTML 文档，例如通过外部样式表文件或 HTML 文档内的内联样式。


    ## 理解 CSS 和 HTML 之间的区别


    HTML 和 CSS 是 Web 开发中使用的两种独立语言。HTML（超文本标记语言）用于创建网页的结构和内容。它定义了构成页面的各种元素，如标题、段落、图像和链接。


    CSS（层叠样式表）用于定义网页呈现的样式。它定义了 HTML 元素应如何显示，例如颜色、字体、大小和布局。CSS 可用于创建复杂的页面布局和具有视觉吸引力的设计。


    简而言之，HTML 定义网页的内容和结构，而 CSS 定义其呈现方式和样式。它们共同协作，创建一个完整且功能齐全的网站。


    ## 使用 CSS 的好处


    在 Web 开发中使用 CSS 有诸多好处：


    * **呈现与内容分离**：CSS 实现了网页呈现与内容的清晰分离，使得在不影响内容的情况下，更容易维护和更新设计。

    * **一致性**：CSS 使设计者能够将一致的样式应用于多个页面，确保网站的外观和感觉统一。

    * **灵活性**：CSS 通过允许使用各种布局和定位技术，以及创建适应不同屏幕尺寸的响应式设计，提供了极高的设计灵活性。

    * **更快的页面加载速度**：通过将呈现与内容分离，CSS 减少了加载网页所需的代码量，从而缩短了页面加载时间。

    * **可访问性**：CSS 通过能够为特定元素（如标题和链接）应用样式并提高内容的易读性，使创建无障碍网站变得更加容易。


    ## 基础 CSS 语法


    CSS 的基础语法由一个选择器和一组声明组成：


    ![](img/image_rsrc61U.jpg)


    选择器选中您想要应用样式的 HTML 元素，而声明则定义样式本身。每个声明由一个属性及其值组成，由冒号分隔。


    这是一个示例：


    ![](img/image_rsrc61V.jpg)


    在这个例子中，`h1` 是定位所有 `h1` HTML 元素的选择器，而声明定义了将应用于它们的样式：蓝色文本颜色、`24px` 字体大小以及文本居中对齐。


    ## 编写 CSS 规则


    编写 CSS 规则涉及选择 HTML 元素并为其应用样式属性。编写 CSS 规则的基本语法是：


    ![](img/image_rsrc61W.jpg)


    * **选择器 (Selector)**：指定该规则适用于哪个 HTML 元素

    * **属性 (Property)**：定义我们想要设置样式的元素方面

    * **值 (Value)**：设置该属性的具体值


    例如，要将所有段落元素的字体颜色设置为红色，我们将使用以下 CSS 规则：


    ![](img/image_rsrc61X.jpg)


    可以通过分号 (`;`) 分隔，将多个属性应用于同一个选择器。例如：


    ![](img/image_rsrc61Y.jpg)


    此规则将所有 `h1` 元素的字体大小设置为 `24 pixels`，颜色设置为蓝色，并使文本居中。


    ## 选择器与声明


    在 CSS 中，选择器和声明用于定位特定的 HTML 元素并为其应用样式规则。


    选择器是用于选中您想要设置样式的元素的模式，而声明则定义您想要应用于这些元素的样式规则。例如，考虑以下 CSS 代码：


