    ## Linking an External CSS


    Linking an external CSS file to an HTML document involves the following steps:


    * Create a CSS file: Create a new file and save it with a ".css" extension, e.g.
    "styles.css". This file will contain all of your CSS code.

    * Add CSS code: Add your CSS code to the "styles.css" file. This can include any
    selectors, declarations, and rules that you want to apply to your HTML document.

    * Link the CSS file to your HTML document: In the head section of your HTML document,
    add a link element that specifies the location of the CSS file. The link element
    should look like this:


