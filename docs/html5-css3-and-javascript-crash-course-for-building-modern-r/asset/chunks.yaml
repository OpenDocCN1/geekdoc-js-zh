    ## 复选框与单选按钮


    复选框和单选按钮是 Web 表单中常用的两种输入字段类型，允许用户从选项列表中进行选择。


    复选框允许用户从选项列表中选择一个或多个选项。在 HTML 中创建复选框，可以使用带有 `type="checkbox"` 属性的 `<input>` 标签。


