  trans: "\n\nJavaScript 具有若干算术运算符，可执行数学运算。这些运算符包括加法 (`+`)、减法 (`-`)、乘法 (`*`)、除法 (`/`)\
    \ 和取模 (`%`)。让我们详细查看每一个运算符。\n\n### 加法 (+)\n该运算符用于两个两个或多个数字。例如：\n\n```javascript\n\
    let x = 5;\nlet y = 10;\nlet z = x + y;\nconsole.log(z); // Output: 15\n```\n\
    查看下方的输出。\n![](img/image_rsrc648.jpg)\n\n### 减法 (-)\n该运算符用于从一个数字减去另一个数字。例如：\n\n\
    ```javascript\nlet x = 10;\nlet y = 5;\nlet z = x - y;\nconsole.log(z); // Output:\
    \ 5\n```\n查看下方的输出。\n![](img/image_rsrc649.jpg)\n\n### 乘法 (*)\n该运算符用于将两个或多个数字相乘。例如：\n\
    \n```javascript\nlet x = 5;\nlet y = 10;\nlet z = x * y;\nconsole.log(z); // Output:\
    \ 50\n```\n查看下方的输出。\n![](img/image_rsrc64A.jpg)\n\n### 除法 (/)\n该运算符用于将一个数字除以另一个数字。例如：\n\
    \n```javascript\nlet x = 10;\nlet y = 5;\nlet z = x / y;\nconsole.log(z); // Output:\
    \ 2\n```\n查看下方的输出。\n![](img/image_rsrc64B.jpg)\n\n### 取模 (%)\n该运算符用于找到除法后的余数。例如：\n\
    \n```javascript\nlet x = 10;\nlet y = 3;\nlet z = x % y;\nconsole.log(z); // Output:\
    \ 1\n```\n查看下方的输出。\n![](img/image_rsrc64C.jpg)\n\n## 比较运算符\nJavaScript 还有若干比较运算符，可用于比较两个值。这些运算符包括等于\
    \ (`==`)、不等于 (`!=`)、大于 (`>`)、小于 (`<`)、大于等于 (`>=`) 和小于等于 (`<=`)。让我们详细查看每一个运算符。\n\
    \n### 等于 (==)\n该运算符用于检查两个值是否相等。例如：\n\n```javascript\nlet x = 5;\nlet y = 5;\n\
    console.log(x == y); // Output: true\n```\n查看下方的输出。\n![](img/image_rsrc64D.jpg)\n\
    \n### 不等于 (!=\n该运算符用于检查两个值是否不相等。例如：\n\n```javascript\nlet x = 5;\nlet y = 10;\n\
    console.log(x != y); // Output: true\n```\n查看下方的输出。\n![](img/image_rsrc64E.jpg)\n\
    \n### 大于 (>) 和 小于 (<)\n这些运算符用于比较两个值，判断其中一个是否大于小于另一个。例如：\n\n```javascript\nlet\
    \ x = 5;\nlet y = 10;\nconsole.log(x < y); // Output: true\nconsole.log(x > y);\
    \ // Output: false\n```\n查看下方的输出。\n![](img/image_rsrc64F.jpg)\n\n### 大于等于 (>=)\
    \ 和 小于等于 (<=)\n这些运算符用于检查一个值是否大于等于或小于等于另一个值。例如：\n\n```javascript\nlet x = 5;\n\
    let y = 5;\nconsole.log(x <= y); // Output: true\nconsole.log(x >= y); // Output:\
    \ true\n```\n查看下方的输出。\n![](img/image_rsrc64G.jpg)\n\n## 逻辑运算符\n在编程中，逻辑运算符用于组合两个或多个条件以形成更复杂的条件。JavaScript\
    \ 中有三个主要的逻辑运算符：\n\n### 与 运算符 (&&)\n与运算符表示为 `&&`，用于检查两个条件是否都为真。只有当两个条件都为真时，它才返回真。如果一个或两个条件为假，它返回假。\n\
    \n示例：\n```javascript\nlet x = 5;\nlet y = 10;\nif(x > 0 && y > 5) {\n  console.log(\"\
    Both conditions are true\");\n}\nelse {\n  console.log(\"At least one condition\
    \ is false\");\n}\n// Output: Both conditions are true\n```\n在这个示例中，第一个条件 `(x\
    \ > 0)` 为真，第二个条件 `(y > 5)` 也是真。因此，控制台将输出 \"Both conditions are true\"。\n\n###\
    \ 或 运算符 (||)\n或运算符表示为 `||`，用于检查两个条件中至少有一个是否为真。如果其中一个或两个条件为真，它就返回真。如果两个条件都为假，它返回假。\n\
    \n示例：\n```javascript\nlet x = 5;\nlet y = 10;\nif(x > 0 || y < 5) {\n  console.log(\"\
    At least one condition is true\");\n}\nelse { \n  console.log(\"Both conditions\
    \ are false\");\n}\n// Output: At least one condition is true\n```\n在这个示例中，第一个条件\
    \ `(x > 0)` 为真，第二个条件 `(y < 5)` 为假。但由于至少有一个条件为真，控制台将输出 \"At least one condition\
    \ is true\"。\n![](img/image_src64H)\n\n### 非 运算符 (!)\n非运算符表示为 `!`，用于反转条件的逻辑状态。如果条件为真，它会使其为假；如果条件为假，它会使其为真。\n\
