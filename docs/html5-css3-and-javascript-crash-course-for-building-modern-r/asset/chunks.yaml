    # JavaScript DOM 操作


    ```javascript

    const element = document.getElementById("myElement");

    element.innerHTML = "<h1>Hello World!</h1>";

    ```


    ## textContent


    `textContent` 属性用于获取或设置元素的文本内容。它返回所有子节点的文本内容，排除 HTML 标签。例如，假设我们有一个 ID 为 `myElement`
    的 HTML 元素。我们可以使用以下代码更改其文本内容：


    ```javascript

    const element = document.getElementById("myElement");

    element.textContent = "Hello World!";

    ```


    ## setAttribute


    `setAttribute` 方法用于设置元素的属性值。例如，假设我们有一个 ID 为 `myElement` 的 HTML 元素。我们可以使用以下代码设置它的
    `src` 属性：


    ```javascript

    const element = document.getElementById("myElement");

    element.setAttribute("src", "image.jpg");

    ```


    ## 事件处理


    事件处理是 Web 开发的一个关键方面，它使 Web 应用程序能够响应用户交互。用户可以通过点击按钮、在文本框中输入内容、在元素上悬停、滚动等方式与网页进行交互。DOM
    允许我们操作网页上的元素，而通过事件处理，我们可以创建能够响应用户交互的交互式 Web 应用。


    在 JavaScript 中，事件是浏览器中发生的动作，例如点击按钮、提交表单或滚动页面。事件监听器是一个监听特定事件发生的函数，并在检测到事件时执行操作。


    有多种方法可以向 HTML 元素附加事件监听器。最常用的方法是使用 `addEventListener()` 方法。该方法接受两个参数：要监听的事件名称以及检测到事件时应执行的函数。以下是一个如何为按钮添加事件监听器的示例，当按钮被点击时会向控制台打印消息：


    ```javascript

    const myButton = document.querySelector(''#myButton'');

    myButton.addEventListener(''click'', function() {

    console.log(''Button clicked!'');

    });

    ```


    在这个示例中，我们首先使用 `querySelector()` 方法选择 ID 为 `myButton` 的按钮元素。然后，我们使用 `addEventListener()`
    方法为按钮附加一个点击事件监听器。当按钮被点击时，作为 `addEventListener()` 第二参数传递的函数将执行执行，并在控制台打印“Button
    clicked!”消息。


    我们还可以使用 `removeEventListener()` 方法从元素中移除事件监听器。该方法接受与 `addEventListener()` 相同的参数：要移除的事件名称以及最初用事件监听器的函数。


    ```javascript

    const myButton = document.querySelector(''#myButton'');

    function handleClick() {

    console.log(''Button clicked!'');

    }

    myButton.addEventListener(''click'', handleClick);

    // 之后，我们可以移除事件监听器

    myButton.removeEventListener(''click'', handleClick);

    ```


    在示例示例中，我们首先定义了一个函数 `handleClick()`，它在调用时会向控制台打印消息。然后，我们使用 `addEventListener()`
    将 `handleClick()` 作为按钮点击事件的事件监听器。最后，我们使用 `removeEventListener()` 移除事件监听器。


    除了 `addEventListener()` 和 `removeEventListener()` 之外，处理事件时常用的一些其他方法和属性。这些包括：


    - `event.target`：此属性返回触发事件的元素。

    - `event.preventDefault()`：此方法阻止元素的默认行为。例如，在表单上调用 `event.preventDefault()` 可以防止表单在点击提交按钮时提交。

    - `event.stopPropagation()`：此方法停止事件传播。例如，在子元素上调用 `event.stopPropagation()` 可以防止事件传播到其父元素。


    以下是如何使用其中一些方法的示例：


    ```javascript

    const myButton = document.querySelector(''#myButton'');

    myButton.addEventListener(''click'', function(event) {

    console.log(''Button clicked!'');

    console.log(''Target:'', event.target);

    event.preventDefault();

    event.stopPropagation();

    });

    ```


    在示例中，我们为按钮附加了一个点击事件监听器。当按钮被点击时，作为 `addEventListener()` 第二参数传递的函数将执行。在函数内部，我们向控制台打印消息，并使用
    `event.target` 属性打印触发事件的目标元素。我们还调用了 `event.preventDefault()` 和 `event.stopPropagation()`
    来阻止按钮的默认行为并停止事件传播到其父元素。


    ## DOM 操作的实际实现


    以下是 DOM 操作实现的示例：


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Manipulation Example</title>

    </head>

    <body>

    <h1 id="my-heading">Hello World!</h1>

    <button id="my-button">Change Text</button>

    <script src="app.js"></script>

    </body>

    <script>

    // 选择按钮和标题元素

    const button = document.getElementById(''my-button'');

    const heading = document.getElementById(''my-heading'');

    // 为按钮添加事件监听器

    button.addEventListener(''click'', () => {

    // 修改标题元素的文本

    heading.textContent = ''New Text!'';

    });

    </script>

    </html>

    ```


    在示例中，我们首先使用 `getElementById()` 方法通过 id 属性选择按钮和标题元素。然后，我们使用 `addEventListener()`
    方法为按钮添加了事件监听器，用于监听“点击”事件。当按钮被点击时，监听器内部的匿名箭头函数执行，使用 `textContent` 属性更改标题元素的文本。请看下图。


    image_rsrc65C.jpg


    点击 Change text 后，你应该得到如下结果：


    image_rsrc65D.jpg


    这只是一个简单的示例，但 DOM 操作可以用于网页的许多操作，例如更改 CSS 样式、创建和删除 HTML 元素等。


    # 第十九章：异步 JavaScript


    异步编程是 JavaScript 中用于执行耗时较长才能完成的代码的技术。JavaScript 代码通常在单线程环境中执行，这意味着长时间运行的代码会导致程序其他部分的出现延迟。异步编程允许我们在后台执行长时间运行的代码的同时继续执行其他代码，从而避免这些延迟。


    在本章中，我们将探索 JavaScript 中不同的异步编程方法，包括回调函数、承诺（Promises）和 async/await。


    ## 理解异步编程


    在同步编程中，代码按顺序执行，一次执行一条指令。相比之下，异步编程允许代码无序执行，程序的不同部分可以同时执行。


    在 JavaScript 中，异步编程通常用于处理耗时较长才能完成的操作，例如网络请求、文件系统操作或数据库查询。


