    按钮是用户点击以提交表单或执行其他操作的输入字段。按钮有三种类型：提交（submit）、重置（reset）和按钮（button）。提交按钮用于提交表单数据，重置按钮用于将表单恢复到初始状态，而按钮类型用于自定义操作。


