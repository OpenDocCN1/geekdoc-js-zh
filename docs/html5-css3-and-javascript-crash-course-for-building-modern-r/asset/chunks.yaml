    ## Switch 语句


    Switch 语句是一种控制流语句，用于 JavaScript、Java 和 C++ 等编程语言。它允许程序求值一个表达式，并根据表达式的值执行不同的操作。


    JavaScript 中 switch 语句的语法如下：


    ```javascript

    switch(expression) {


    case value1:


    // code block


    break;


    case value2:


    // code block


    break;


    default:


    // code block


    }

    ```


    表达式只会求值一次，其值将与每个 case 的值进行比较。如果匹配，则执行关联的代码块。如果不匹配，则执行 default 块中的代码。


    下面是 switch 语句的示例：


    ```javascript

    let day = new Date().getDay();


    let dayName;


    switch(day) {


    case 0:


    dayName = "Sunday";


    break;


    case 1:


    dayName = "Monday";


    break;


    case 2:


    dayName = "Tuesday";


    break;


    case 3:


    dayName = "Wednesday";


    break;


    case 4:


    dayName = "Thursday";


    break;


    case 5:


    dayName = "Friday";


    break;


    case 6:


    dayName = "Saturday";


    break;


    default:


    dayName = "Invalid day";


    }


    console.log(dayName);

    ```


    在这个例子中，switch 语句使用 `Date` 对象的 `getDay()` 方法获取当前星期几。代码将日期匹配到相应的字符串值，并将其赋值给 `dayName`
    变量。如果日期值不匹配任何 case，则 default case 将 `dayName` 变量赋值为 "Invalid day"。上述代码的结果如下图所示。


    ![](img/image_rsrc64P.jpg)


    Switch 语句通常用作 if-else 语句的替代方案，当需要检查多个条件时。它们还可以使代码在某些情况下更具可读性和效率。


    ## 函数与作用域


    在 JavaScript 中，函数是可重用的代码块，可以接受输入（实参）并返回一个值。它们是编程的基本构建块，允许创建模块化和可重用的代码。在本章中，我们将介绍声明和调用函数、处理参数和实参、返回值以及理解作用域和闭包的基础知识。


    ### 声明和调用函数


    在 JavaScript 中，可以使用 `function` 关键字声明函数，后跟函数名和一对圆括号。函数体用花括号 `{}` 包裹。例如：


    ```javascript

    function greet() {


    console.log("Hello, world!");


    }

    ```


    要调用此函数，只需使用函数名后跟一对圆括号：


    ```javascript

    greet(); // Output: Hello, world!

