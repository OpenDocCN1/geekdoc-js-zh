    - `relative`：此值将元素相对于其正常位置定位。

    - `absolute`：此值将元素相对于其最近的已定位祖先元素进行定位。

    - `fixed`：此值将元素相对于浏览器窗口定位，即使页面滚动，元素也会保持在原位。


