    CHAPTER SEVENTEEN


    OBJECTS AND CLASSES


    An object in JavaScript is a group of properties, each of which is a key-value
    pair. Objects may have characteristics that are either other objects or primitive
    data types (such as texts, integers, and booleans). Additionally, objects are
    capable of having methods, which are defined as the object''s properties and functions.
    Because they make it possible for programmers to efficiently organize and manage
    code, objects are crucial to JavaScript programming.


    CREATING AND WORKING WITH OBJECTS


    To create an object in JavaScript, you can use either the object literal notation
    or the Object constructor. The object literal notation is a shorthand way of creating
    an object by enclosing a list of key-value pairs in curly braces. For example:


    let person = {


    name: "John",


    age: 30,


    city: "New York"


    };


    In this example, we create an object, called a person with three properties: name,
    age, and city.


    You can also create an object using the Object constructor. The Object constructor
    creates an empty object that you can add properties and methods to. For example:


    let person = new Object();


    person.name = "John";


    person.age = 30;


    person.city = "New York";


    This code creates an empty object called a person using the new keyword and then
    adds three properties to it using dot notation.


    Object Methods


    Objects in JavaScript can also have methods, which are functions that are defined
    as properties of the object. Methods can access the object''s properties and other
    methods. In JavaScript, objects can have methods, which are functions that belong
    to the object and can operate on its properties. To create a method for an object,
    we define a function as a property of the object.


    Here''s an example:


    let person = {


    firstName: ''John'',


    lastName: ''Smith'',


    fullName: function() {


    return this.firstName + '' '' + this.lastName;


    }


    };


    console.log(person.fullName()); // Output: "John Smith"


    In this example, we define an object called a person with properties firstName,
    lastName, and a method fullName. The fullName method concatenates the firstName
    and lastName properties and returns the result. See the output below.


    ![](image_rsrc654.jpg)


    We can also define object methods using ES6 syntax with arrow functions:


    let person = {


    firstName: ''Sammie'',


    lastName: ''Smith'',


    fullName: () => {


    return this.firstName + '' '' + this.lastName;


    }


    };


    console.log(person.fullName()); // Output: "undefined undefined"


    See the output below.


    ![](image_rsrc655.jpg)


    However, using arrow functions for object methods is generally not recommended,
    as it can cause issues with this keyword.


    Object methods can also be called outside of the object context by using the call()
    or apply() method. For example:


    let person1 = {


    firstName: ''John'',


    lastName: ''Smith'',


    fullName: function() {


    return this.firstName + '' '' + this.lastName;


    }


    };


    let person2 = {


    firstName: ''Jane'',


    lastName: ''Smith''


    };


    console.log(person1.fullName.call(person2)); // Output: "Jane Smith"


    In this example, we define two objects person1 and person2\. person1 has a fullName
    method, while person2 does not. We can still use the call() method to call person1''s
    fullName method with person2 as its this value, effectively "borrowing" the method.
    See the screenshot of the output below.


    ![](image_rsrc656.jpg)


    Object methods can also be defined using shorthand notation:


    let person = {


    firstName: ''Sammie'',


    lastName: ''Smith'',


    fullName() {


    return this.firstName + '' '' + this.lastName;


    }


    };


    console.log(person.fullName()); // Output: "Sammie Smith"


    In this example, we define the fullName method using a shorthand notation. The
    result is the same as the previous example. See the screenshot of the output below.


    ![](image_rsrc657.jpg)


    CREATING CLASSES


    In addition to creating objects using the object literal notation or the Object
    constructor, you can also create objects using classes. A class is a blueprint
    for creating objects, and it defines a set of properties and methods that the
    objects will have. To define a class in JavaScript, you use the class keyword,
    followed by the name of the class. For example:


    In JavaScript, you can create classes using the class keyword. Classes are a way
    to define blueprints for objects that you want to create. They provide a way to
    encapsulate data and behavior in a single entity. A class can have properties
    and methods just like an object.


    Here''s an example of how to create a class in JavaScript:


    class Person {


    constructor(firstName, lastName, age) {


    this.firstName = firstName;


    this.lastName = lastName;


    this.age = age;


    }


    getFullName() {


    return `${this.firstName} ${this.lastName}`;


    }


    canVote() {


    return this.age >= 18;


    }


    }


    In this example, we define a Person class with a constructor that takes in three
    parameters: firstName, lastName, and age. The constructor assigns these values
    to the properties of the object being created.


    The class also has two methods: getFullName and canVote. getFullName returns the
    full name of the person by concatenating the first and last names, while canVote
    checks if the person is 18 years or older and returns true or false.'
