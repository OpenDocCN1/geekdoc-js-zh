    ### Return Values


    Functions can also return a value using the `return` keyword. This allows the
    function to provide a result that can be used in other parts of the code. For
    example:


    ```javascript

    function multiply(a, b) {


    return a * b; }


    console.log(multiply(2, 3)); // Output: 6

