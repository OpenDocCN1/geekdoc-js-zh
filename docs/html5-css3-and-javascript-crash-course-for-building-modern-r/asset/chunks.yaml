    COMPARISON OPERATORS


    JavaScript also has several comparison operators that can be used to compare two
    values. These operators include equal to (==), not equal to (!=), greater than
    (>), less than (<), greater than or equal to (>=), and less than or equal to (<=).
    Let''s take a closer look at each of these operators.


    Equal to (==):


    This operator is used to check if two values are equal. For example:


    let x = 5; let y = 5;


    console.log(x == y); // Output: true


    See the output below.


