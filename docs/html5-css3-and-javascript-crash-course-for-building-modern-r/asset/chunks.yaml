    我们将从探索 HTML（超文本标记语言）开始，它是网络的基石。你将学习如何使用语义化 HTML 来构建网页结构，确保内容组织良好，并且对用户和搜索引擎都易于访问。在打好
    HTML 基础后，我们将深入 CSS（层叠样式表）的领域，发现样式设计的强大之处。你将揭开响应式设计的秘密，利用 CSS 媒体查询、灵活的布局和流式网格，创建视觉上吸引人且适应性强的网页界面。


    但我们的旅程并未止步于此。为了真正释放响应式网页开发的潜力，我们将借助 JavaScript 的力量。你将学习如何使用 JavaScript 在网站上创建动态和交互式元素。从实现响应式导航菜单，到构建交互式表单，再到集成第三方库，你将掌握让网站生动起来并吸引所有设备用户所需的技能。


    在本书中，我们不仅会涵盖 HTML、CSS 和 JavaScript 的技术方面，还会深入探讨最佳实践、性能优化技巧以及跨浏览器兼容性。你将学习如何优化网站性能、处理不同屏幕尺寸，并确保无论使用何种设备都能获得无缝的用户体验。


    到本书结束时，你将深入理解 HTML、CSS 和 JavaScript，并能够创建令人惊艳、用户友好且响应式的网站，这些网站能够完美适应任何设备。无论你是在构建个人博客、电子商务平台还是企业网站，这些知识都将帮助你提供卓越的用户体验，并在当今竞争激烈的数字领域中保持领先。


    因此，如果你准备好踏上响应式网页开发的变革之旅，《用 HTML、CSS 和 JavaScript 构建响应式网站：释放网络三剑客的力量》将是你全面的伴侣。让我们深入探索，释放网络三剑客的全部潜力，创造出令人瞩目且响应式的数字体验，给受众留下持久印象。


    # 第一章：HTML 入门


    在本章中，我们将介绍 HTML 的基础知识，包括标签、属性和元素。我们将解释如何创建 HTML 文档、设置基本结构以及添加内容。


    ## 什么是 HTML？


    HTML 代表超文本标记语言。它是一种标准的标记语言，用于创建网页以及可在互联网上显示的其他类型的数字内容。HTML 提供了一种结构化和格式化内容（如文本、图像和多媒体元素）的方式，使网页浏览器能够以视觉上吸引人且有条理的方式呈现它们。


    HTML 通过使用一组标签和属性来定义网页内容的结构和外观。这些标签被尖括号（< >）括起来，并指定它们所包含内容的类型。例如，`<h1>` 标签用于定义标题，而
    `<p>` 标签用于定义段落。属性用于提供关于标签的附加信息，例如其类、id 或样式。


    网页开发者将 HTML 与 CSS（层叠样式表）和 JavaScript 结合使用，以创建动态、交互式的网页。HTML5 是 HTML 规范的最新版本，包含了许多新特性，例如视频和音频元素，以及对移动设备的更好支持。


    ## HTML5 的新特性


    HTML5 引入了许多新特性和对之前 HTML 版本的改进。一些关键的新特性包括：


    *   **视频和音频特性**：音频和视频元素是 HTML5 的两个重要新特性。它们使网站设计者能够轻松地在页面中添加视频或音频片段。HTML5 的视频元素可以使用
    CSS 进行样式设置。可以修改边框、不透明度、渐变、反射、过渡、变换甚至动画。YouTube 也通过提供可嵌入代码，让其他网站嵌入其视频，从而宣布了视频嵌入功能。这有助于网络在多媒体方面变得更加互动。为了在互联网上的网页中嵌入任何音频片段，HTML5
    提供了一个名为音频标签的新元素供使用。


    *   **页眉和页脚**：由于这些新标签的出现，不再需要使用 `<div>` 标签来分隔这两个部分。页眉位于页面顶部，而页脚位于底部。如果你使用 HTML5
    的 header 和 footer 元素，浏览器将知道先加载什么，后加载什么。


    *   **新增的输入标签类型**：一个名为“input”的旧属性在 HTML 中获得了新生，它采用了新的值，如“email”、“month”、“number”、“range”、“search”、“tel”、“color”、“week”、“URL”、“time”、“date”、“DateTime-local”等。现在输入标签可以包含以下新值：


    1.  **ContentEditable**：这是一个允许用户修改内容的功能。它使得“所见即所得”变得简单。你可以通过点击内容来编辑它。


    2.  **Progress**：此标签用于跟踪任务的完成进度。它与 JavaScript 的进度标签兼容。它看起来像一个进度条。


    3.  **Section**：section 标签用于将文档划分为不同的部分或组件。例如，一篇文章可能包含多个部分，如页眉、页脚、主要内容部分以及最新新闻等。


    4.  **Main**：main 标签用于总结页面的主要内容。一个文档只能包含一个 main 标签，并且该标签不能包含在 article、aside、footer
    或 header 标签中。它没有页眉、页脚或导航栏。


    *   **Figure 和 figcaption**：以前无法在文档中添加图形和标题。随着 figure 和 figcaption 标签的出现，现在可以在语义上将图像及其说明嵌入到网站中。语法如下：


    ![](img/`image_rsrc5YV.jpg`)


    *   **占位符**：以前，我们必须使用一点 JavaScript 来为文本字段创建占位符。当然，你可以先根据需要修改 value 属性，但如果用户删除该信息并点击其他地方，输入框将变为空。使用
    placeholder 属性可以解决这个问题。


    *   **预加载视频**：这是一个分享视频的绝佳功能。它说明了如何上传视频以及网站加载视频所需的时间。这通知浏览器关于网页用户体验的改进。虽然这不是必须的，但你仍然应该添加此功能。它有助于更真实地呈现页面。


    *   **控制显示**：元素的行为由 display 属性决定。如果未指定此属性，则应用默认值。


    *   **正则表达式**：我们可以使用正则表达式来添加特定的输入模式。例如，最常见的模式是 `[A-Za-z] 5,11\.`。它接受大写和小写字母。此外，它还规定了最小和最大字符长度分别为
    5 和 11。


    *   **可访问性**：自创建以来，HTML5 在帮助网站提供最佳可访问性功能方面做出了重大贡献。因此，网站的使用变得更加简单。HTML5 的可访问性功能允许几乎任何类型的残障用户（包括视力障碍、色盲、弱视、失明等）访问网站。例如，表单中的验证就是提供可访问性的最佳示例。标签必须清晰可见。


    *   **内联组件**：这些内联元素对于保持代码的时效性非常有用：


    1.  **mark**：它突出显示以某种方式标记的项目。


    2.  **Time**：用于显示网站的当前时间和日期。


