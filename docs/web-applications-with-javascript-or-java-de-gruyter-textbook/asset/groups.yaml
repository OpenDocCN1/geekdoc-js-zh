  mdcn: "\n\n## 2 使用原生 JS 实现单向函数关联\n\n请注意，发布者的名称被用作 ID 引用，因为它是 Publisher 类的标准 ID。\n\
    \n## 2.3 构建 JS 类模型\n\n构建 JS 类模型的起点是一个 OO（面向对象）类模型，如图 1.10 所示的类。\n\n我们展示了如何通过四个步骤从该\
    \ OO 类模型派导出 JS 类模型。对于 OO 类模型中的每个检查项：\n\n- 1. 为所有（非派生的）单值属性添加 `get/set` 构型，意味着隐含的\
    \ getter 和 setter。回想在 setter 中，会调用相应的检查操作，且仅当检查没有检测到约束违背时，才会设置该属性。\n- 2. 为每个（非派生的）属性创建一个\
    \ `check` 操作，以便为实现属性约束提供一个集中的位置地。对于标准的 ID 属性（如 `Book::isbn`），需要两个或三个检查操作：\n  \
    \ 1. 一个基础检查操作，如 `checkIsbn`，用于检查语法约束，但不检查 `mandatory`（必填）值和唯一性约束。\n   2. 一个标准的\
    \ ID 检查操作，如 `checkIsbnAsId`，用于检查标准 ID 属性隐含的 `mandatory` 值和唯一性约束。\n- 3. 如果其他类具有引用所考虑类的引用属性，则添加一个\
    \ ID 引用检查操作，用于检查施加在 ID 引用（或外键）属性上的引用完整性约束。例如，由于 Book::publisher 属性引用了 Publisher\
    \ 对象，我们需要在 Publisher 类中一个 `checkNameIdRef` 操作。\n- 4. 为 `toString()` 添加一个对象序列化函数，用于在错误消息和日志消息中显示对象的状态。\n\
    - 5. 为 `record()` 添加一个对象到存储的转换函数，该函数为模型对象准备好存储为实体表中的行，该行可以通过 `JSON.stringify`\
    \ 序列化为 JSON 字符串，从而可以作为应用 `localStorage` 数据存储的值的值。\n\n对于引用属性（如 `Book::publisher`），检查操作\
    \ `Book.checkNameAsIdRef` 必须通过调用 `Publisher.checkNameAsIdRef` 来检查隐含的引用完整性约束，如果该属性是必填的，可能还需要检查必填约束。\n\
    \n这得出了 Book 的以下 JS 类模型，其中类级（静态）方法用下划线表示：\n\n| Book | Book |\n| --- | --- |\n|\
    \ isbn[1]: String (id) | «get/set» isbn[1]: string (id) |\n| title[1]: String\
    \ | «get/set» title[1]: string |\n| year[1]: integer | «get/set» year[1]: number(int)\
    \ |\n| publisher[0..]: Publisher | «get/set» publisher[0..1]: Publisher |\n| |\
    \ checkIsbn(isbn: string): ConstraintViolation |\n| | checkIsbnAid(isbn: string):\
    \ ConstraintViolation |\n| | checkIsbnAidRef(isbn: string): ConstraintViolation\
    \ |\n| | checkTitle(title: string): ConstraintViolation |\n| | checkYearIn(year:\
    \ number(int)): ConstraintViolation |\n| | checkPublisher(p: Publisher): ConstraintViolation\
    \ |\n| | toString(): String |\n| | toRecord(): Object |\n\n我们必须对 Publisher 类执行类似的转换。这为我们提供了从上述\
    \ OO 类模型派出的完整 JS 类模型，如图 2.1 所示。\n\n| Book | |\n| --- | --- |\n| «get/set» isbn[1]:\
    \ string (id) | |\n| «get/set» title: string | |\n| «get/set» year[1]: number(int)\
    \ | |\n| «get/set» publisher[0..1]: Publisher | |\n| checkIsbn(isbn: string):\
    \ ConstraintViolation | |\n| checkIsbnAid(isbn: string): ConstraintViolation |\
    \ |\n| isbn: ConstraintViolation | |\n| checkIsbnAidRef(isbn: string): ConstraintViolation\
    \ | |\n| checkTitle(title: string): ConstraintViolation | |\n| checkYearIn(year:\
    \ number(int)): ConstraintViolation | |\n| checkPublisher(p: Publisher): ConstraintViolation\
    \ | |\n| p: Publisher): ConstraintViolation | |\n| toString(): String | |\n| toRecord():\
    \ Object | |\n\n| Publisher | |\n| --- | --- |\n| «get/set» name: string (id)\
    \ | |\n| «get/set» address: string | |\n| checkName(n: string): ConstraintViolation\
    \ | |\n| checkNameAid(n: string): ConstraintViolation | |\n| checkNameAidRef(n:\
    \ string): ConstraintViolation | |\n| checkAddress(in a: string): ConstraintViolation\
    \ | |\n| toString(): String | |\n| toRecord(): Object | |\n\n**图 2.1:** 定义类 Book\
    \ 和 Publisher 的 JS 类模型。\n\n## 2.4 新问题\n\n与第 1 卷讨论的验证和枚举应用相比，我们必须处理许多技术问题：\n\n\
