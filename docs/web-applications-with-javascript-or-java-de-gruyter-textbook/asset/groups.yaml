  - "[PAGE 40]\n\n# 2 Implementing Unidirectional Functional Associations with Plain\
    \ JS\n\nNotice that the name of a publisher is used as an ID reference, since\
    \ it is the standard ID ID of the Publisher class.\n\n# 2.3 Make a JS Class Model\n\
    \nThe starting point for making a JS class model is an OO class model like the\
    \ one shown in Figure 1.10.\n\nWe show how to derive a JS class model from this\
    \ OO class model in four steps. For each check in the OO class model:\n\n+   1.\
    \ Add a `get/set` stereotype to all (non-derived) single-valued properties, implying\
    \ implicit getters and setters. Recall that in the setter, the corresponding check\
    \ operation is invoked and the property is only set, if the check does not detect\
    \ constraint violation.\n2. Create a `check` operation for each (non-derived)\
    \ property in order to have a central place for implementing property constraints.\
    \ For a standard ID attribute (such as `Book::isbn`), two or three check operations\
    \ are needed:\n   1. A basic check operation, like `checkIsbn`, for checking for\
    \ syntactic constraints, but not the `mandatory` value and the uniqueness constraints.\n\
    \   2. A standard ID check operation, like `checkIsbnAsId`, for checking the `mandatory`\
    \ value and uniqueness constraints that are implied by a standard ID attribute.\n\
    3. If other classes have a reference property that references the class under\
    \ consideration, add an ID reference check operation for checking the referential\
    \ integrity constraint imposed on ID reference (or foreign key) attributes. For\
    \ instance, since the Book::publisher property references Publisher objects, we\
    \ need a `checkNameIdRef` operation in the Publisher class.\n3. Add an object\
    \ serialization function to `toString()` for showing an object's state in error\
    \ messages and log messages.\n4. Add an object-to-storage conversion function\
    \ to `record()` that prepares a model object for being stored as a row in an entity\
    \ table, which can be serialized to a JSON string with `JSON.stringify` such that\
    \ it can be stored as a value of an app's `localStorage` datastore.\n\nFor a reference\
    \ property, such as `Book::publisher`, the check operation, Book.checkNameAsIdRef,\
    \ has to check the implied referential integrity constraint by invoking Publisher.checkNameAsIdRef,\
    \ and possibly also a mandatory constraint, if the property is mandatory."
