  - '[PAGE 184]


    # 168 14 Subtyping with Java EE


    e.g., TextBook has a subjectArea property which Biography has an about property.


    +   - the render attribute used with f:ajax specifies which of the JSF components
    are to be updated . This is needed because the DOM changes (client, server side)
    which applies after the AJAX call

    - AJAX is used to submit the form for revaluation when the special selection list
    is changed (something is selected). As a result, it enforces the rendering of
    the three panels corresponding to three book cases: simple book, text book and
    biography. Using execute="@this" we enforce the re-evaluation of the form at server
    side, so the resulting HTML DOM structure contains the changes accordingly the
    conditions specified by the rendered attributes of the various JSF elements. Notice
    that a JSF element that has a conditional expression must be a child of another
    JSF element which is always part of the DOM.

    - h:GroupLayout is used to define a set of elements which are either or hidden.

    - the action attribute of the h:commandButton can''t be used with conditional
    expressions, therefore we have to create three buttons, for each case: create/update
    a Book, a TextBook or a Biography. The method of the corresponding controller
    class (i.e., BookController, TextBookController/BiographyController is called).

    - since we do not have a corresponding property in the Java bean(class) for the
    special type (category), we can use JSF variables to store the value of the single
    select list, and then use the variable in rendered conditions for various elements.
    Therefore, for the h:selectOneMenu, the value="#{viewScope.bookTypeValue}" specifies
    that we use a "on the fly" defined property named bookTypeValue, which is part
    of the view scope JSF object(s). We can also define such outside the view scope,
    e.g., value="#{bookTypeValue}", but in this case they are requested, so their
    value is lost after submitting the form, and the rendered conditions can''t be
    correctly evaluated.


    For a class in this hierarchy, one corresponding controller class is defined.
    It contains the specific create, update and delete methods. The shared methods,
    such as getAllObjects are defined by the controller of the top level class (e.g.,
    for our example, this is BookController). Minimal app for more details on how
    to implement the controller class and the corresponding CRUD methods.


    The Update test case is very similar with the Create test test case. The Delete
    test test case remains unchanged.'
- md: "\n## 14.3 Case Study 2: Implement a Class Hierarchy with Joined Table Inheritance\n\
    \nThe starting point for our case study is the design model shown in Figure 12.8\
    \ above. In the following sections, we show how to eliminate the Manager class\
    \ using the Class Hierarchy Merge design pattern and how to implement the Person\
    \ hierarchy and use Joined, Multiple Table Inheritance storage with the help of\
    \ JPA framework.\n\n### 14.3.1 Make the Java Entity class model\n\nWe design the\
    \ model classes of our example app with the help of a Java Entity class model\
    \ that we derive from the design model by essentially leaving the generalization\
    \ as they are and just adding getters and setters to each class. However, in the\
    \ case of our example app, it is natural to apply the Class Hierarchy Merge design\
    \ pattern to the segmentation of Employee for simplifying the data model by eliminating\
    \ the Manager subclass. This leads to the model shown in Figure 14.2 below. Note\
    \ that we also made two technical decisions:\n\n| Person |\n| :--- |\n| <get/set>\
    \ personid : Integer (id) |\n| <get/set> name : String |\n| checkPersonIdAsId(id\
    \ : String, in : type) : ConstraintViolation |\n\n| Employee |\n| :--- |\n| <get/set>\
    \ empNo[1] : integer (unique) |\n| <get/set> type(0..1) : EmployeeType |\n| <get/set>\
    \ department(0..1) : String |\n| checkUniqueEmployeeNo(n : Integer) : ConstraintViolation\
    \ toString() : String |\n| create(in pid : Integer, in n : String, in t : EmployeeType,\
    \ in d : String) retrieveAll() : Employee[] ...n() |\n\n| Author |\n| :--- |\n\
    | <get/set> biography : String |\n| toString() : String |\n| create(in pid : Integer,\
    \ in name : String, in bio : String) retrieveAll() : Author[] ...() |\n\n(disjoint,\
    \ complete)\n\nFigure 14.2: The Java Entity class model of the Person class hierarchy.\n\
    \n## 14 Subtyping of Java EE\n\n- 1. We have declared the segmentation of Person\
    \ into Employee and Author to be disjoint and complete, that is, any person is\
    \ either an employee or an author. Since Java does not support multiple classification,\
    \ we cannot implement an overlapping segmentation, as needed when modeling roles,\
    \ with Java.\n- 2. We turned Person into an abstract class (indicated by its name\
    \ in italics), which means that it cannot have direct instances, but only indirect\
    \ ones via its subclasses Employee and Author. This technical design decision\
    \ is compatible with the fact that any Person is an Employee or Author (or both),\
    \ and consequently there is no need for any object to instantiate directly.\n\n\
    ### 14.3.2 New Issues\n\nCompared to the model of our first case study, shown\
    \ in Figure 14.1 above, we have to define the category relationships between Employee\
    \ and Person, as well as between Author and Person, using the JPA annotation.\n\
    In the UI we have to care of:\n\n- 1. Adding the views (in the folders WebContent/views/authors\
    \ and WebContent/views/employees) and controller classes (AuthorController and\
    \ EmployeeController) for the corresponding Author and Employee model classes.\n\
    \n- 2. Deal with the Manager case, by adding a \"Special type\" select control,\
    \ in the forms of the \"Create book\" and \"Update book\" use cases in WebContent/views/books/create.xhtml\
    \ and WebContent/views/books/update.xhtml. Segment property fields (i.e., department\
    \ in our example) are only displayed, and their validation is performed, when\
    \ a corresponding employee type has been selected.\n\n### 14.3.3 Code the Model\
    \ Classes of the Java Entity Class Model\n\nThe Java Entity class shown in Figure\
    \ 14.2 above is coded by using the JavaBeans Person, Employee and Author as well\
    \ as for the enumeration EmployeeCategoryEL.\n\n### 14.3.3.1 Define the Category\
    \ Relationships\n\nWe define the category relationships between Employee and Person,\
    \ as well as between Author and Person, using the JPA annotations. At first we\
    \ create the Person class as shown below:\n\n```java\n@Entity @Table(name=\"persons\"\
    )\n@Inheritance(strategy=InheritanceType.JOINED)\n@DiscriminatorColumn(name=\"\
    category\",\ndiscriminatorType=DiscriminatorType.STRING, length=16)\npublic abstract\
    \ class Person {\n    @Id @NotNull(message=\"A person ID is required!\")\n   \
    \ private Integer personId;\n    @NotNull(message=\"A name is required!\") @Column(nullable=false)\n\
    \    private String name;\n}\n```\n\nComparing with the Book hierarchy shown in\
    \ Test Case 1, the @Inheritance annotation defines the strategy=InheritanceType.JOINED.\
    \ This means, for every class in the inheritance hierarchy, a database table is\
    \ used. The @DiscriminatorColumn(name=\"category\") specifies the column in the\
    \ corresponding table (i.e., persons) of the top hierarchy class (i.e., Person)\
    \ which stores the discriminator values used to identify the stored type of each\
    \ entry (table).\n\nNotice that the Java class Person is declared abstract, which\
    \ means it can't be initialized, instead we can and initialize subclasses derived\
    \ from it (i.e., Employee and Author). This also means we don't declare a @DiscriminatorValue\
    \ because no instance of Person is stored in the database table.\n\nFurther, we\
    \ define the Author class as follows:\n\n```java\n@Entity @Table(name=\"authors\"\
    )\n@DiscriminatorValue(value=\"AUTHOR\")\n@ManagedBean(name=\"author\") @ViewScoped\n\
    public class Author extends Person {\n    @NotNull(message=\"A biography is required!\"\
    )\n    private String biography;\n}\n```\n\nThe Author class inherits Person,\
    \ therefore the get and set methods corresponding to personId and name properties\
    \ are available. The @discriminatorValue(value=\"AUTHOR\") specifies the column\
    \ of the category table stores the value AUTHOR for every entry which comes from\
    \ persisting an Author instance.\nFinally, we define the Employee class:\n\n```java\n\
    @Entity @Table(name=\"employees\")\n@DiscriminatorValue(value=\"EMPLOYEE\")\n\
    @ManagedBean(name=\"employee\") @ViewScoped\npublic class Employee extends Person\
    \ {\n    @Column( nullable=false)\n    @NotNull message=\"An employee ID is required!\"\
    \n    private Integer empno;\n    @Column(nullable=false, length=32)\n    @Enumerated(EnumType.STRING)\n\
    \    private EmployeeCategoryEmployeeCategoryEL type;\n    @Column(nullable=true,\
    \ length=64)\n    private String department;\n}\n```\n\nNotice the type property\
    \ used to identify the Employee type, such as Manager. Its values are defined\
    \ by the EmployeeCategoryEL enumeration.\n\n### 14.3.3.2 Database Schema for Joined\
    \ Table Hierarchy\n\nAs a result of the annotation\n```java\n@Inheritance(strategy=InheritanceType.JOINED)\n\
    ```\nfor each class in the inheritance hierarchy, one database table is created.\
    \ The corresponding SQL-DDL scripts generated by JPA to create the persons, authors\
    \ and employees tables are shown below:\n\n```sql\nCREATE TABLE IF EXISTS 'persons'\
    \ (\n    `PERSONID` int(11) NOT NULL,\n    `category` varchar(16) DEFAULT NULL,\n\
    \    `NAME` varchar(255) NOT NULL\n);\nCREATE TABLE IF EXISTS 'authors' (\n  \
    \  `PERSONID` int(11) NOT NULL,\n    `BIOGRAPHY` varchar(255) DEFAULT NULL\n);\n\
    ADD CONSTRAINT `FK_authors_PERSONID` FOREIGN KEY (`PERSONID`) REFERENCES 'persons'\
    \ (`PERSONID`);\nCREATE TABLE IF EXISTS 'employees' (\n    `PERSONID` int(11)\
    \ NOT NULL,\n    `DEPARTMENT` varchar(64) DEFAULT NULL,\n    `EMPNO` int(11) NOT\
    \ NULL,\n    `TYPE` varchar(32) DEFAULT NULL\n);\nADD CONSTRAINT `FK_employees_PERSONID`\
    \ FOREIGN KEY (`PERSONID`) REFERENCES 'persons' (`PERSONID`);\n```\n\nAs we can\
    \ see, every table contains the direct properties as defined by the Java bean\
    \ class. Additionally, the authors and employees tables are correlated with a\
    \ foreign key constraint for the PERSONID column referring to the PERSONID from\
    \ the persons table.\n\n### 14.3.4 Write the View and Controller Code\n\nIn the\
    \ user interface, for every Java bean class, we have a controller class which\
    \ contains the create, update and delete CRUD methods. The PersonController class\
    \ is defined as abstract and contains the checkPersonIdAsId method, which inherits\
    \ from all subclasses.\n\nFor every non-abstract entity class in the inheritance\
    \ hierarchy we define a set of views corresponding to CRUD operations. For example,\
    \ in the case of Author we have the files RetrieveAll.xhtml, create.xhtml, update.xhtml,\
    \ and delete.xhtml in the folder WebContent/views/authors/. In the case of Employee,\
    \ the Retrieve/List Employees use cases to display the Special type of employee\
    \ column:\n\n```xml\n<h:column>\n    <f:facet name=\"header\">Special type of\
    \ employee</f:facet>\n    #{e.type == null ? e.label.concat(\" \")...}\n```\n\n\
    Notice that within EL expressions we cannot use the + (plus) operator for concatenating\
    \ strings. EL allows the + operator to be used only for numeric addition. However,\
    \ we can use the concat method instead.\n\n## 14.4 Run the App\n\nFor running\
    \ your application, you may have to stop your Tomcat/TomEE server (with bin/shutdown.bat\
    \ for Windows or bin/shutdown.sh for Linux). Next, download and unzip your ZIP\
    \ file containing all the source code of the application and also the ANT script\
    \ file that you have to edit (modify the server.folder property value). Now, execute\
    \ the following command in your console or terminal:\n"
  mdcn: "\n\n## 14.3 案例 2：使用连接表继承实现类层次结构\n\n我们案例研究的起点是上方图 12.8 所示的设计模型。在接下来的章节中，我们将展示如何使用类层次结构合并（Class\
    \ Hierarchy Merge）设计模式消除 `Manager` 类，以及如何借助 JPA 框架实现 `Person` 层次结构并使用连接多表继承（Joined\
    \ Multiple Table Inheritance）存储。\n\n### 14.3.1 构建 Java 实体类模型\n\n我们通过 Java 实体类模型来设计示例应用的模型类，该模型是从设计模型推导而来的，基本上保留了泛化结构，仅为每个类添加了\
    \ getter 和 setter。然而，在我们的示例应用中，将类层次结构合并设计模式应用于 `Employee` 的划分是合理的，通过消除 `Manager`\
    \ 子类来简化数据模型。这导致了下方图 14.2 所示的模型。注意，我们还做了两个技术决策：\n\n| Person |\n| :--- |\n| <get/set>\
    \ personid : Integer (id) |\n| <get/set> name : String |\n| checkPersonIdAsId(id\
    \ : String, in : type) : ConstraintViolation |\n\n| Employee |\n| :--- |\n| <get/set>\
    \ empNo[1] : integer (unique) |\n| <get/set> type(0..1) : EmployeeType |\n| <get/set>\
    \ department(0..1) : String |\n| checkUniqueEmployeeNo(n : Integer) : ConstraintViolation\
    \ toString() : String |\n| create(in pid : Integer, in n : String, in t : EmployeeType,\
    \ in d : String) retrieveAll() : Employee[] ...n() |\n\n| Author |\n| :--- |\n\
    | <get/set> biography : String |\n| toString() : String |\n| create(in pid : Integer,\
    \ in name : String, in bio : String) retrieveAll() : Author[] ...() |\n\n(互斥，完全的)\n\
    \n图 14.2：Person 类层次结构的 Java 实体类模型。\n\n## 14 Java EE 的子类型\n\n- 1. 我们声明将 `Person`\
    \ 划分为 `Employee` 和 `Author` 是互斥（disjoint）且完全（complete）的，也就是说，任何人员要么是员工，要么是作者。由于\
    \ Java 不支持多重分类，我们无法用 Java 实现在建模角色时所需的重叠划分。\n- 2. 我们将 `Person` 转换为一个抽象类（通过其*斜体*名称来标识），这意味着它不能被直接实例化，只能通过其子类\
    \ `Employee` 和 `Author` 间接实例化。这一技术设计决策与任何 `Person` 都是 `Employee` 或 `Author`（或两者都是）的事实兼容，因此不需要任何对象直接实例化。\n\
    \n### 14.3.2 新问题\n\n与上方图 14.1 所示的第一个案例模型相比，我们需要使用 JPA 注解定义 `Employee` 与 `Person`\
    \ 之间的类别关系，以及 `Author` 与 `Person` 之间的关系。\n在 UI 中我们需要处理：\n\n- 1. 添加视图（在 `WebContent/views/authors`\
    \ 和 `WebContent/views/employees` 文件夹下）以及控制器类（`AuthorController` 和 `EmployeeController`），对应相应的\
    \ `Author` 和 `Employee` 模型类。\n\n- 2. 处理 `Manager` 情况，通过在 `WebContent/views/books/create.xhtml`\
    \ 和 `WebContent/views/books/update.xhtml` 的“创建书籍”和“更新书籍”用例中添加一个“特殊类型”选择控件。分段属性字段（例如我们示例中的\
    \ `department`）只有在选择了相应的员工类型时才会显示并对其进行验证。\n\n### 14.3.3 编写 Java 实体类模型的模型类\n\n\
    上方图 14.2 所示的 Java 实体类是通过使用 JavaBeans `Person`、`Employee` 和 `Author` 以及枚举类 `EmployeeCategoryEL`\
    \ 编写的。\n\n### 14.3.3.1 定义类别关系\n\n我们使用 JPA 注解定义 `Employee` 与 `Person` 之间的类别关系，以及\
    \ `Author` 与 `Person` 之间的关系。首先，我们如下所示创建 `Person` 类：\n\n```java\n@Entity @Table(name=\"\
    persons\")\n@Inheritance(strategy=InheritanceType.JOINED)\n@DiscriminatorColumn(name=\"\
    category\",\ndiscriminatorType=DiscriminatorType.STRING, length=16)\npublic abstract\
    \ class Person {\n    @Id @NotNull(message=\"A person ID is required!\")\n   \
    \ private Integer personId;\n    @NotNull(message=\"A name is required!\") @Column(nullable=false)\n\
    \    private String name;\n}\n```\n\n与用例 1 中所示的 `Book` 层次结构相比，`@Inheritance` 注解定义了\
    \ `strategy=InheritanceType.JOINED`。这意味着对于继承体系中的每个类，都使用一个数据库表。`@DiscriminatorColumn(name=\"\
    category\")` 指定了顶层次类（即 `Person`）对应表（即 `persons`）中的列，用于存储标识每个条目（表）存储类型的区分符值。\n\n\
    注意 Java 类 `Person` 被声明为抽象类，这意味着它不能被初始化，相反，我们可以初始化从其派生的子类（即 `Employee` 和 `Author`）。这意味着我们没有声明\
    \ `@DiscriminatorValue`，因为数据库表中没有 `Person` 的实例。\n\n此外，我们如下定义 `Author` 类：\n\n```java\n\
    @Entity @Table(name=\"authors\")\n@DiscriminatorValue(value=\"AUTHOR\")\n@ManagedBean(name=\"\
    author\") @ViewScoped\npublic class Author extends Person {\n    @NotNull(message=\"\
    A biography is required!\")\n    private String biography;\n}\n```\n\n`Author`\
    \ 类继承自 `Person`，因此提供了 `get` 和 `set` 方法。`@DiscriminatorValue(value=\"AUTHOR\")`\
    \ 指定了对应表（即 `authors`）中的列，用于存储区分符值。最后，我们定义 `Employee` 类：\n\n```java\n@Entity @Table(name=\"\
    employees\")\n@DiscriminatorValue(value=\"EMPLOYEE\")\n@ManagedBean(name=\"employee\"\
    ) @ViewScoped\npublic class Employee extends Person {\n    @NotNull(message=\"\
    An employee ID is required!\")\n    private Integer empno;\n    @Enumerated(EnumType.STRING)\n\
    \    private EmployeeCategoryEL type;\n    @Column(nullable=false)\n    private\
    \ String department;\n}\n```\n\n### 14.3.3.2 连接数据库架构\n\n由于注解\n```java\n@Inheritance(strategy=InheritanceType.JOINED)\n\
    ```\n继承层次结构中的每个类都使用一个数据库表。`@DiscriminatorColumn(name=\"category\")` 指定了顶层次类（即\
    \ `Person`）对应表（即 `persons`）中的列，用于存储标识每个条目（表）存储类型的区分符值。\n\n注意 Java 类 `Person` 被声明为抽象类，这意味着它不能被初始化，相反，我们可以初始化从其派生的子类（即\
    \ `Employee` 和 `Author`）。这意味着我们没有声明 `@DiscriminatorValue`，因为数据库表中没有 `Person` 的实例。\n\
    \n由 JPA 生成的创建 `persons` 和 `employees` 表的 SQL 脚本如下：\n\n```sql\nCREATE TABLE IF\
    \ EXISTS 'persons' (\n    `personid` int(11) NOT NULL,\n    `category` varchar(16)\
    \ NOT NULL,\n    `name` varchar(255) NOT NULL\n);\nCREATE TABLE IF EXISTS 'authors'\
    \ (\n    `personid` int(11) NOT NULL,\n    `category` varchar(16) NOT NULL,\n\
    \    `biography` varchar(255) NOT NULL,\n    CONSTRAINT FK_authors_personid FOREIGN\
    \ KEY (`personid`) REFERENCES persons(`personid`)\n);\nCREATE TABLE IF EXISTS\
    \ 'employees' (\n    `personid` int(11) NOT NULL,\n    `category` varchar(16)\
    \ NOT NULL,\n    `empno` int(11) NOT NULL,\n    `type` varchar(32) NOT NULL,\n\
    \    `department` varchar(64),\n    CONSTRAINT FK_employees_personid FOREIGN KEY\
    \ (`personid`) REFERENCES persons(`personid`)\n);\n```\n\n### 14.3.4 编写视图和控制器代码\n\
    \n在用户界面中，对于每个 Java Bean 类我们都有一个控制器类，包含 `create`、`update` 和 `delete` CRUD 方法。`PersonController`\
    \ 类被定义为抽象，并包含了 `checkPersonIdAsId` 方法。\n\n对于继承体系中的每个非抽象实体类，我们定义一组对应 CRUD 操作的视图。例如，在\
    \ `Author` 的情况下，我们在 `WebContent/views/authors/` 目录下有 `RetrieveAll.xhtml`、`create.xhtml`、`update.xhtml`\
    \ 和 `delete.xhtml`。在 `Employee` 的情况下，`Retrieve/List Employees` 用例显示“特殊类型”列：\n\n\
    ```xml\n<h:column>\n    <f:facet name=\"header\">Special type of employee</f:facet>\n\
    \    #{e.type == null ? e.label.concat(\" \") : e.type.label}\n</h:column>\n```\n\
    \n注意在 EL 表达式中我们不能使用 `+` 运算符连接字符串。EL 仅允许 `+` 运算符用于数值相加。然而，我们可以使用 `concat` 方法。\n\
    \n## 14.4 运行应用\n\n运行你的应用时，你可能需要停止 Tomcat/TomEE 服务器（Windows 使用 `bin/shutdown.bat`\
    \ 或 Linux 使用 `bin/shutdown.sh`）。接下来，下载并解压包含应用程序所有源码的 ZIP 文件，以及你必须编辑的 ANT 脚本文件（修改\
    \ `server.folder` 属性值）。现在，在控制台或终端中执行以下命令：\n\n"
