    \ : ConstraintViolation | toRecord() : Object |\n| checkAuthor(author : Author)\
    \ : ConstraintViolation | |\n| addAuthor(author : Author) | | |\n| removeAuthor(author\
    \ : Author) | | |\n| toString() : String | | |\n| toRecord() : Object | | |\n\n\
    ## Author\n\n### 8.2 Write the Model Code\n\nThe JS class model can be directly\
    \ coded for getting the code of the model layer of your JavaScript frontend app.\n\
    \n### 8.2.1 New Issues\n\nCompared to the unidirectional association app, we have\
    \ to deal with a number of new technical issues:\n\n- 1. We define the derived\
    \ inverse reference properties, like Publisher::publishedBooks, without a check\
    \ operation and without a set operation.\n- 2. We also have to take care of maintaining\
    \ the derived inverse reference properties by maintaining the derived (sets) of\
    \ inverse reference properties that collect the value of a derived inverse reference\
    \ property. This requires in particular that:\n- whenever the value of a single-valued\
    \ master reference property is initialized or updated with the help of a setter\
    \ (such as assigning a reference to a Publisher instance p to b.publisher for\
    \ a Book instance b), an inverse reference has to be assigned or added to the\
    \ corresponding value of the derived inverse reference property (such as adding\
    \ b to p.publishedBooks); when the value of the master reference property is updated\
    \ or multi-valued, then the obsolete inverse reference to the previous value of\
    \ the single-valued master reference property has to be deleted;\n- 2. whenever\
    \ the value of an optional single-valued master reference property is unset (by\
    \ assigning null to b.publisher for a Book instance b), the inverse reference\
    \ has to be removed from the corresponding value of the derived inverse reference\
    \ property (such as removing b from p.publishedBooks), if the derived reference\
    \ property is multi-valued, otherwise the corresponding value of the derived inverse\
    \ reference property has to the value of be unset or updated;\n- 3. whenever a\
    \ reference is added to a multi-valued master reference property with the help\
    \ of an add method (such as adding an Author reference to a b. for Book instance\
    \ b), an inverse reference has to be assigned or added to the corresponding value\
    \ of the derived inverse reference property (such as adding b to a.authoredBooks);\n\
    - 4. whenever a reference is removed from a multi-valued master reference property\
    \ with the help of a remove method (such as removing a reference to a b. for Book\
    \ instance b), the inverse reference has to be removed from the corresponding\
    \ value of the derived inverse reference property (such as removing b from p.publishedBooks),\
    \ if the derived reference property is multi-valued, otherwise the corresponding\
    \ value of the derived inverse reference property has to the value of be unset\
    \ or updated;\n- 5. whenever the value of a single-valued master reference property\
    \ is initialized or updated with the help of a setter (such as assigning a reference\
    \ to a Publisher instance p to b.publisher for a Book instance b), an inverse\
    \ reference has to be assigned or added to the corresponding value of the derived\
    \ inverse reference property (such as adding b to p.publishedBooks); when the\
    \ value of the master reference property is updated or multi-valued, then the\
    \ obsolete inverse reference to the previous value of the single-valued master\
    \ reference property has to be deleted;\n\nNotice that when an object is created\
    \ with a single reference or multiple references as the value of a master reference\
    \ property (e.g., a new Book instance with a single reference b.publisher), its\
    \ setter will take care of creating inverse references.\n\n### 8.2.2 Coding Summary\n\
    \nCode each of the JS class model as ES2015 class with implicit getters and setters\
    \ (or, alternatively, as ES5 constructor function with explicit setters):\n\n\
    - 1. Code the property checks in the form of class-level ('static') methods. Take\
    \ care that all constraints specified in the JS class model are properly coded.\n\
    - 2. For each single-valued property, code the specified getter and setter:\n\
    \    - In each setter, the corresponding property check is invoked and the property\
    \ is only set/unset, if the check does not detect any violation.\n    - If the\
    \ concerned property is the inverse of a derived property (representing a bidirectional\
    \ association), make sure that the setter also assigns/unsets (or adds/removes)\
    \ the inverse reference from the collection value of the inverse property.\n-\
    \ 3. For each multi-valued property, code its add and remove operations, as well\
    \ as the specified get/set operations:\n    - Code the add/remove operations as\
    \ (instance-level) methods that invoke the corresponding property checks.\n  \
    \  - Code the setter such that it invokes the add operation for each item of the\
    \ collection to be assigned.\n    - If the concerned property is the inverse of\
    \ a derived property (representing a bidirectional association), make sure that\
    \ the add/remove methods also assign/unset (or add/remove) the inverse reference\
    \ to/from (the collection value) of the inverse property.\n- 4. Write the code\
    \ of the serialization function toString() and the object-to-storage conversion\
    \ function toRecord(). In the object-to-storage conversion of a publisher or author\
    \ to toRecord(), the derived properties published and authored books are not included\
    \ since their information is redundant (it is derived from the publisher and authors\
    \ properties of books).\n- 5. Take care of deletion dependencies in the destroy\
    \ method. Make sure that when an object with a single reference or multiple references\
    \ as the value of a master reference property is destroyed, the derived references\
    \ are unset (or removed) first.\n\n### 8.2.3 Code Each Class of the JS Class Model\n\
    \nFor instance, the Publisher class from the JS class model is coded in the following\
    \ way:\n\n```\nclass Publisher {\n  constructor({name, address}) {\n    this.name\
    \ = name;\n    this.address = address;\n    // derived inverse reference property\
    \ (inverse of Book::publisher)\n    this._publishedBooks = {}; // initialize as\
    \ empty map\n  }\n  getName() {. . . }\n  static checkName(n) {. . . }\n  static\
    \ checkNameAsId(n) {. . . }\n}\n```\n"
