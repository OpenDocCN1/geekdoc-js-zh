    \ operations as class-level methods.\nTake care of the inverse relation management\
    \ in the create and update methods.\n\nThese steps are discussed in more detail\
    \ in the following sections.\n\n# 9.2.3 Code Each Class of the Java Entity Class\
    \ Model\n\nIn the Publisher class, we add the publishedBooks property and we use\
    \ the @OneToOne annotation corresponding to @ManyToMany from the Book class, representing\
    \ the inverse relation:\n\n# 9 Implementing Bidirectional Associations with Java\
    \ EE\n\n```java\n@Entity\npublic class Publisher {\n  ..\n  @OneToMany(fetch=FetchType.EAGER,\
    \ mappedBy=\"publisher\")\n  private Set<Book> publishedBooks;\n  ..\n}\n```\n\
    \nThe mappedBy parameter of the @OneToMany annotation of the publishedBooks property\
    \ specifies the property that implements the @ManyToOne relation in the Book class:\n\
    \n```java\n@Entity\npublic class Book {\n  ..\n  @ManyToOne(fetch=FetchType.EAGER)\n\
    \  @JoinColumn(name=\"PUBLHER_ID\")\n  private Publisher publisher;\n  ..\n}\n\
    ```\n\nIn the Author class, we add the authoredBooks property with the @ManyToMany\
