    \ . . }\n  get about() { . . . }\n  static checkAbout(a, cat) {. . . }\n  set\
    \ about(a) { . . . }\n}\n```\n\n注意，构造函数使用了 ES2015 的函数参数解构功能定义了一个单个记录参数。\n我们以以下方式为\
    \ `category` 属性编码 `checkCategory` 和 `setCategory` 方法：\n\n```js\nstatic checkCategory(c)\
    \ {\n  if (c === undefined || c === \"\") {\n    return new NoConstraintViolation();\
    \ // c 是可选的\n  } else if (!util.isIntegerOrIntegerString(c) || parseInt(c) < 1\
    \ || parseInt(c) > CategoryEL.MAX) {\n    return new RangeConstraintViolation(\n\
