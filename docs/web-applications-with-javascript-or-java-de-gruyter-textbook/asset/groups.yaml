    \ derived inverse references have to be removed first (e.g., by removing b from\
    \ p.publishedBooks).\nNotice that when a new object is created with a single reference\
    \ or multiple references as a value of a master reference property (e.g., a new\
    \ Book instance with a single reference b.publisher), its setter or add method\
    \ will be invoked and take care of creating the inverse references.\n\n+ In the\
    \ UI code we can now exploit the inverse reference properties for efficiently\
