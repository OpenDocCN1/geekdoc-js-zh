    about\");\n    }\n  } catch (e) {\n    //\n  }\n};\n```\n\n## 13.2 案例研究 1：消除类层次结构\n\
    \n### 13.2.4 编写视图和控制器\n\n应用的用户界面（UI）包含一个起始页，允许导航到数据管理页面（在示例中为 `books.html`）。此类数据管理页面包含部分：管理书籍、列出并检索所有书籍、创建书籍、更新书籍和删除书籍，使得任何时候只显示其中一个（通过对其他设置\
    \ CSS 属性 `display:none`）。\n\n### 13.2.4.1 摘要\n\n我们需要在“检索并列出所有书籍”用例以及“创建书籍”和“更新书籍”用例中处理\
    \ `category` 属性和分段属性 `subjectArea` 和 `about`，方法如下：\n\n- 在 `books.html` 的“检索并列出所有书籍”用例显示表中添加分段信息列（标题为“Category”）。\n\
    - 在 `books.html` 的“创建书籍”和“更新书籍”用例表单中添加“Category”选择字段以及所有分段属性的输入字段。分段属性的表单字段仅在选择了相应类别后显示。\n\
    \n### 13.2.4.2 在“检索/列出所有”中添加分段信息列\n\n我们在 `books.html` 的“列出所有书籍”用例显示表中添加一个“特殊类型”类别：\n\
    \n```html\n<table id=\"books\">\n  <head>\n    <tr><th>ISBN</th><th>Title</th><th>Year</th><th>Category</th></tr>\n\
    \  </head>\n  <tbody></tbody>\n</table>\n```\n\n没有特殊类别的书籍在这一列中将有一个单元格，对于所有其他书籍，其类别将在该列显示，并带有特定的类别信息。这需要在\
    \ `view/books.js` 文件的 `pl.v.books.retrieveListAll.setupUserInterface` 中实现相应的 `switch`\
    \ 语句：\n\n```js\nif (book.category) {\n    switch (book.category) {\n        case\
    \ BookCategoryEL.TEXTBOOK:\n            row.insertCell(-1).content = book.subjectArea\
    \ + \" (textbook)\";\n            break;\n        case BookCategoryEL.BIOGRAPHY:\n\
    \            row.insertCell(-1).content = \"Biography about \" + book.about;\n\
    \            break;\n    }\n}\n```\n\n### 13.2.4.3 在“创建和更新”中添加类别选择字段\n\n在两种情况下，我们都需要通过选择字段允许选择特殊类型的书籍（'textbook'\
    \ 或 'biography'），如下方的 HTML 片段所示：\n\n```html\n<div class=\"field\">\n  <label>Category:\
    \ <select name=\"category\"></select></label>\n</div>\n<div class=\"field Textbook\"\
    ><!-- 条件字段 -->\n  <label>Subject area: <input type=\"text\" name=\"subjectArea\"\
    \ /></label>\n</div>\n<div class=\"field Biography\"><!-- 条件字段 -->\n  <label>About:\
    \ <input type=\"text\" name=\"about\" /></label>\n</div>\n```\n\n注意，我们将 \"Textbook\"\
    \ 和 \"Biography\" 作为分段字段容器元素类属性的额外值添加。这支持根据类别属性的值来渲染或取消渲染“Textbook”和“Biography”字段。在\
    \ `handleCategorySelectChangeEvent` 处理程序中，只有在选择了相应的类别书籍时，才会通过 `pl.v.app.displaySegmentFields`\
    \ 显示分段属性表单字段。\n\n"
