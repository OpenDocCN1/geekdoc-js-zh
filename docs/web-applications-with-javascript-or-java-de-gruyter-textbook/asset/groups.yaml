    # 前言


    这两本书展示了如何使用基于模型的方法设计并实现 Web 应用，使用了 Web 开发中最两个相关的平台：JavaScript 和 Java。Web 应用通过
    UML 图表的形式进行设计，并实现为：


    - JavaScript 前端，使用 Java 后端，使用 Java Server Faces (JSF) 作为用户界面，使用 Java Persistence
    API (JPA) 进行对象到存储的映射，以及 MySQL/MariaDB 数据库管理系统。


    本书的重点是关于以下基础管理问题的通用概念和技术：

    - 完整性约束和数据验证

    - 枚举和属性

    - 对象类型之间的单向和双向关联

    - 类层级结构中的子类型和继承。


    前两个问题在本书的第 1 卷中讨论，后两个问题在第 2 卷中讨论。我们假设读者已经熟悉 HTML 和至少一种面向对象的编程语言，如 C++、Java、PHP
    或 C#。此外，我们假设读者对 JavaScript 有一定了解，并兴趣学习更多使用 JavaScript 或 Java 进行编程。本书可用于计算机科学、信息系统及相关专业的学生
    Web 开发课程；供 JavaScript 开发者学习 Java；供 Java 开发者学习 JavaScript；供 JavaScript 和 Java（以及
    PHP/C#）开发者学习如何使用原生 JavaScript 或 Java 构建完整的 Web 应用。本书附带六个示例应用程序的完整源代码，您可以从我们的 Web
    服务器运行或下载这些代码。


