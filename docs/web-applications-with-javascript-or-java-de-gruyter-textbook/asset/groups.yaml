    \    }\n    catch (Exception e) {\n        e.printStackTrace();\n    }\n    return\
    \ \"create\";\n}\n```\n\nThe update book use case is similar to the book use case.\n\
    \n## 5.6 Run the App and Get the Code\n\nFor running your application, you may\
    \ first have to stop your Tomcat/TomEE server (with `bin/shutdown.bat` for Windows\
    \ or `bin/shutdown.sh` for Linux). Next, download and unzip the ZIP file containing\
    \ all the source code of the app and the ANT script file that you have to edit\
    \ (modify the `server.folder` property value).\n\nNow, execute the deploy command\
    \ in your console or terminal:\n\n```bash\nant deploy -Dappname=UnidirectionalAssociationApp\n\
    ```\n\nFinally, start your Tomcat web server (by using `bin/startup.bat` for Windows\
    \ OS or `bin/startup.sh` for Linux). Please be patient, this can take some time\
    \ depending on the speed of your computer. It will be ready when the console displays:\
    \ `INFO: Initializing UnidirectionalAssociationApp`. Finally, open a browser and\
    \ navigate to: `http://localhost:8080/UnidirectionalAssociationApp/views/index.xhtml`\n\
    \n## 5.7 Sets Versus Lists as the Values of Properties\n\nRecall that a set is\
    \ an unordered collection that has unique elements, while a list is an ordered\
    \ collection that may contain the same element more than once. When an association\
    \ end is ordered, like `Book::authors`, in the class diagram in Figure 5.1, this\
    \ implies that the range of the corresponding reference property needs to be an\
    \ ordered collection, such as List types.\n\n| Book | authored | |\n|---|---|---|\n\
    | isbn : String | Books | Author |\n| title : String | | |\n| year : Integer |\
    \ | (ordered)\n\nIn theory, set-valued reference properties should be defined\
    \ with `Set<T>`, such as declaring `Set<Book>` as the range of `Author::authoredBooks`,\
    \ while ordered-set-valued reference properties should be defined with `SortedSet<T>`,\
    \ such as declaring `SortedSet<Author>` as the range of `Book::authors`. The Java\
    \ interface `Set` is typically implemented by the Java class `HashSet`, while\
