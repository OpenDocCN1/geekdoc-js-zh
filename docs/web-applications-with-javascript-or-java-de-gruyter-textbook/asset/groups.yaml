    \nThere are two ways to realize the derivation of a property: it may be derived\
    \ via a read-time computation of value, or it may be derived on update via an\
    \ update-time computation performed whenever one of the variables in the derivation\
    \ expression (typically, another property) changes its value. The latter corresponds\
