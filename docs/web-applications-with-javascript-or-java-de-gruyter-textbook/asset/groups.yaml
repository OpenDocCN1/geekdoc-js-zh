- md: "\n# 13 Subtyping with Plain JS\n\n## 13.2.3.2 Code the Enumeration Type BookCategoryEL\n\
    \nThe enumeration type BookCategoryEL is coded with the help of our library meta-class\
    \ at the beginning of the Book.js model class file in the following way:\n\n```js\n\
    BookCategoryEL = new Enumeration([ \"Textbook\", \"Biography\"]);\n```\n\n## 13.2.3.3\
    \ Code the Model Class Book\n\nWe code the model class Book in the form of an\
    \ ES2015 class definition where the category attribute as well as the segment\
    \ attributes subjectArea and about are optional, with getters, setters and static\
    \ check functions for all properties:\n\n```js\nclass Book {\n  constructor(isbn,\
    \ title, year, category, subjectArea, about) {\n    this.isbn = isbn;\n    this.title\
    \ = title;\n    this.year = year;\n    // optional properties\n    if (category)\
    \ this.category = category;\n    if (subjectArea) this.subjectArea = subjectArea;\n\
    \    if (about) this.about = about;\n  }\n  get isbn() { . . }\n  static checkIsbn(isbn)\
    \ { . . }\n  static checkIsbnAsId(isbn) { . . }\n  set isbn(isbn) { . . }\n  get\
    \ title() { . . }\n  static checkTitle(t) { . . }\n  set title(t) { . . }\n  get\
    \ year() { . . }\n  static checkYear(y) { . . }\n  set year(y) { . . }\n  get\
    \ category() { . . }\n  static checkCategory(c) { . . }\n  set category(c) { .\
    \ . }\n  get subjectArea() { . . }\n  static checkSubjectArea(sA, cat) { . . }\n\
    \  set subjectArea(s) { . . }\n  get about() { . . . }\n  static checkAbout(a,\
    \ cat) {. . . }\n  set about(a) { . . . }\n}\n```\n\nNote that the constructor\
    \ function is defined with a single record parameter using the ES2015 feature\
    \ of function parameter destructuring.\nWe code the checkCategory and setCategory\
    \ methods for the category attribute in the following way:\n\n```js\nstatic checkCategory(c)\
    \ {\n  if (c === undefined || c === \"\") {\n    return new NoConstraintViolation();\
    \ // c is optional\n  } else if (!util.isIntegerOrIntegerString(c) || parseInt(c)\
    \ < 1 || parseInt(c) > CategoryEL.MAX) {\n    return new RangeConstraintViolation(\n\
    \      \"Invalid value for category: \" + c);\n  } else {\n    return new NoConstraintViolation();\n\
    \  }\n}\nset category(c) {\n  var validationResult = null;\n  if (this.category)\
    \ { // already set/assigned\n    validationResult = new FrozenConstraintViolation(\n\
    \      \"The category cannot be changed!\");\n  } else {\n    validationResult\
    \ = Book.checkCategory(c);\n  }\n  if (validationResult instanceof NoConstraintViolation)\
    \ {\n    this._category = parseInt(c);\n  } else {\n    throw validationResult;\n\
    \  }\n}\n```\n\nWhile the getters for segment properties (in this example: subjectArea\
    \ and about) follow the standard pattern, their checks and setters have to make\
    \ sure that the property applies to the category of the instance being checked.\
    \ This is achieved by checking a combination of a property value and a category,\
    \ as in the following example:\n\n```js\nstatic checkSubjectArea(sa, c) {\n  if\
    \ (c === BookCategoryEL.TEXTBOOK && !sa) {\n    return new MandatoryConstraintViolation(\n\
    \      \"A subject area must be provided for a textbook!\");\n  } else if (c !=\
    \ BookCategoryEL.TEXTBOOK && sa) {\n    return new ConstraintViolation(\"A subject\
    \ area must not \" +\n      \"be provided if the book is not a textbook!\");\n\
    \  } else if (sa && (typeof(sa) != \"String\" || sa.trim() === \"\")) {\n    return\
    \ new RangeConstraintViolation(\n      \"The subject area must be a non-empty\
    \ string!\");\n  } else {\n    return new ConstraintViolation();\n  }\n}\n```\n\
    \nIn the serialization function toString, we serialize the category attribute\
    \ and segment properties in a switch statement:\n\n```js\ntoString() {\n  var\
    \ bookStr = \"Book(ISBN:\" + this.isbn + \", title:\" +\n    this.title + \",\
    \ year:\" + this.year;\n  switch (this.category) {\n    case BookCategoryEL.TEXTBOOK:\n\
    \      bookStr += \", \" + this.subjectArea;\n      break;\n    case BookCategoryEL.BIOGRAPHY:\n\
    \      bookStr += \", biography:\" + this.about;\n      break;\n  }\n  return\
    \ bookStr + \")\";\n}\n```\n\nIn the update method of a model class, we only set\
    \ a property if it is updated, that is a corresponding argument different from\
    \ the old property value. In the special case of a category attribute with FrozenConstraint,\
    \ we need to make sure it can only be updated if it has not yet been assigned.\
    \ Then, in the Book.update method, we perform the special test if book.category\
    \ === undefined handling the special case of initial assignment, while we handle\
    \ updates of the segment properties in a more standard way:\n\n```js\nBook.update\
    \ = function ({isbn, title, year,\n  category, subjectArea, about}) {\n  const\
    \ book = Book.instances[isbn];\n  var objectBeforeUpdate = util.clone(book);\n\
    \  var noConstraintViolated=true, updatedProperties=[];\n  try {\n    if (category\
    \ && book.category !== category) {\n      book.category = category;\n      updatedProperties.push(\"\
    category\");\n    } else if (category === \"\" && \"category\" in book) {\n  \
    \    throw new FrozenConstraintViolation(\n        \"The category cannot be unset!\"\
    );\n    }\n    if (subjectArea && book.subjectArea !== subjectArea) {\n      book.subjectArea\
    \ = subjectArea;\n      updatedProperties.push(\"subjectArea\");\n    }\n    if\
    \ (about && book.about !== about) {\n      book.about = about;\n      updatedProperties.push(\"\
    about\");\n    }\n  } catch (e) {\n    //\n  }\n};\n```\n\n## 13.2 Case Study\
    \ 1: Eliminating a Class Hierarchy\n\n### 13.2.4 Write the View and Controller\n\
    \nThe app's user interface (UI) consists of a start page that allows navigating\
    \ to data management pages (in our example, books.html). Such a data management\
    \ page contains sections: manage books, list and retrieve all books, create book,\
    \ update book and delete book, such that only one of them is displayed at any\
    \ time (by setting the CSS property display:none for all others).\n\n### 13.2.4.1\
    \ Summary\n\nWe have to care of handling the category attribute and the segment\
    \ properties subjectArea and about in the “Retrieve and list all books” use case\
    \ as well as in the “Create book” and “Update book” use cases by:\n\n- Adding\
    \ a segment information column (with heading “Category”) to the display table\
    \ of the “Retrieve and list all books” use case in books.html.\n- Adding a “Category”\
    \ selection field, and input fields for all segment properties, in the forms of\
    \ “Create book” and “Update book” use cases in books.html. The form fields for\
    \ segment properties are only displayed when a corresponding category has been\
    \ selected.\n\n### 13.2.4.2 Add a Segment Information Column in Retrieve/List\
    \ All\n\nWe add a “special type” category to the display table of the “List all\
    \ books” use case in books.html:\n\n```html\n<table id=\"books\">\n  <head>\n\
    \    <tr><th>ISBN</th><th>Title</th><th>Year</th><th>Category</th></tr>\n  </head>\n\
    \  <tbody></tbody>\n</table>\n```\n\nA book without a special category will have\
    \ an empty table cell in this column, for all other books their category will\
    \ be shown in this column, with category-specific information. This requires a\
    \ corresponding switch statement in pl.v.books.retrieveListAll.setupUserInterface\
    \ in the view/books.js file:\n\n```js\nif (book.category) {\n    switch (book.category)\
    \ {\n        case BookCategoryEL.TEXTBOOK:\n            row.insertCell(-1).content\
    \ = book.subjectArea + \" (textbook)\";\n            break;\n        case BookCategoryEL.BIOGRAPHY:\n\
    \            row.insertCell(-1).content = \"Biography about \" + book.about;\n\
    \            break;\n    }\n}\n```\n\n### 13.2.4.3 Add a Category Selection Field\
    \ in Create and Update\n\nIn both cases, we need to allow selecting a special\
    \ category of book ('textbook' or 'biography') with the help of a selection field,\
    \ as shown in the following HTML fragment:\n\n```html\n<div class=\"field\">\n\
    \  <label>Category: <select name=\"category\"></select></label>\n</div>\n<div\
    \ class=\"field Textbook\"><!-- conditional field -->\n  <label>Subject area:\
    \ <input type=\"text\" name=\"subjectArea\" /></label>\n</div>\n<div class=\"\
    field Biography\"><!-- conditional field -->\n  <label>About: <input type=\"text\"\
    \ name=\"about\" /></label>\n</div>\n```\n\nNote that we have added \"Textbook\"\
    \ and \"Biography\" as additional values of the class attribute of the segment\
    \ field container elements. This supports the rendering and un-rendering of \"\
    Textbook\" and \"Biography\" fields, depending on the value of the category attribute.\
    \ In the handleCategorySelectChangeEvent handler, segment property form fields\
    \ are only displayed, with pl.v.app.displaySegmentFields, when a corresponding\
    \ category book has been selected.\n"
  mdcn: "\n\n# 13 使用原生 JS 实现子类型\n\n## 13.2.3.2 编码枚举类型 BookCategoryEL\n\n枚举类型 BookCategoryEL\
