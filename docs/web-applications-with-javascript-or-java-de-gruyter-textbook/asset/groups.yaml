    ## 7 Bidirectional Associations


    In programming, a bidirectional association is an association that is represented
    as a pair of mutually inverse reference properties, which allow ''navigation''
    (object access) in both directions.


    The model shown in Figure 7.1 below (about publishers, books and their authors)
    serves as our running example. Notice that it contains two bidirectional associations,
    as indicated by the ownership dots at both association ends.


    | Publisher | published Books | Book | authored Books | Author |

    | --- | --- | --- | --- | --- |

    | name : String (id) | | isbn : String (id) | | personid : Integer (id) |

    | address : String | 0.1 | * | * | name : String |


    Figure 7.1: The Publisher-Book-Author design model with two bidirectional associations.


    ### 7.1 Inverse Reference Properties


    For being able to easily retrieve the committees that are chaired or co-chaired
    by a club member, we add two reference properties to our Committee-ClubMember
    example: the property of a club member to be the chair of a committee (ClubMember::committee)
    and the property of a club member to be the co-chair of a committee (ClubMember::coChairedCommittee)
    may chair or co-chair at most one committee (where the disjunction is non-exclusive).
    We get with the following model:


    | Committee | ClubMember |

    | --- | --- |

    | name : String | chairedCommittee[0..1] : Committee |

    | chair : ClubMember | chairedCommittee[0..1] : Committee |


    Notice that there is a correspondence between the two reference properties Committee::chair
    and ClubMember::chairedCommittee. They are the inverse of each other: when the
    club member Tom is the chair of the budget committee, expressed by the tuple ("budget
    committee", "Tom"), then the budget committee is chaired by the club member Tom,
    expressed by the inverse tuple ("Tom", "budget committee"). For expressing this
    inverse correspondence in the diagram, we append an inverse property constraint,
    inverse of chair, in curly braces


    to the declaration of the property ClubMember::chairedCommittee, and a similar
    one to the property CommitteeMember::chair, as shown in the following diagram:


    | Committee | ClubMember |

    |---|---|

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember (inverse of chairedCommittee) | chairedCommittee[0..1] :
    Committee |


    Using the reference path notation of OOP languages, with c referencing a Committee
    object, we obtain the equation:


    ```

    c.chair.chairedCommittee = c

    ```


    Or, the other way, with m referencing a ClubMember object, we obtain the equation:


    ```

    m.chairedCommittee.chair = m

    ```


    Notice when the property $p_2$ is the inverse of a property $p_1$, this implies
    that, the other way, $p_1$ is the inverse of $p_2$. While a reference property
    that is derived on read may not guarantee efficient navigation, the on-read property
    that is derived on update does provide efficient navigation.


    When we designate an inverse property as derived by prefixing it with a slash
    (/), we indicate that it is derived on update. For instance, the property /chairedCommittee
    in the example above is derived on update from the property chair.


    | Committee | ClubMember |

    |---|---|

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember | chairedCommittee[0..1] : Committee |

