    \ : String |\n| <get/set>-title[1] : String |\n| <get/set>-year[1] : Integer |\n\
    | <get/set>-publisher[0..1] : Publisher |\n| +checkISBNAsId(in : String, em :\
    \ EntityManager) : ConstraintViolation |\n| +toString() : string |\n| +retrieveAll(in\
    \ : EntityManager) : List<Publisher> |\n| +retrieve(in : EntityManager, name :\
    \ String) : Publisher |\n| +create(in : EntityManager, name : String, address\
    \ : String) |\n| +update(in : EntityManager, name : String, address : String)\
    \ |\n| +delete(in : EntityManager, name : String) |\n\nIn a Java Entity class,\
    \ for any association end in the OO class, we show the reference property representing\
    \ the association and annotate it with the functionality type. In our example,\
    \ we use a functionality type manyToOne:\n\n## 4.3 New Issues\n\nCompared to the\
    \ single-class apps discussed in previous, we have to deal with a number of new\
    \ issues:\n\n- 1. In the model code we now have to take care of reference properties\
    \ that require defining referential integrity constraints with the help of suitable\
    \ JPA annotations; extending the code of the create, update and delete methods\
    \ by taking the reference properties into consideration; a method for converting\
    \ between (internal) object references and corresponding (external) ID references\
    \ in serialization and de-serialization operations.\n- 2. In the user interface\
    \ (view) code we now have to take care of showing information about associated\
    \ objects in the retrieve/list all use case; allowing to select an associated\
    \ object from a list of all existing instances of the target class in the create\
    \ object and update object use cases.\n\n## 4.4 Write the Model Code\n\nThe Entity\
    \ class model can be directly coded for getting the model layer code of our Java\
    \ back-end app.\n\n### 4.4.1 Summary\n\n- 1. Code each class from the Java Entity\
    \ class model as a corresponding entity class.\n2. Code an [id] property modifier\
    \ with the JPA annotation @Id\n3. Code any property modifier denoting the functionality\
    \ type of a reference property, such as [manyToOne], with the JPA annotation,\
    \ such as @ManyToOne.\n4. Code the integrity constraints specified in the model\
    \ with the help of Java Bean Validation annotations (or custom validation annotations).\n\
    5. Code the getters and setters.\n6. Code the create, retrieve, update and delete\
    \ storage management operations as class-level methods.\n\nThese steps are discussed\
    \ in more detail in the following sections.\n"
