    \n## 12.7.4 使用 SQL 数据库表表示类层次结构\n\n标准 DBMS 将信息（对象）存储在表的行中，这些行在关系型数据库系统中被构想为集合论关系。关系型数据库语言\
    \ SQL 用于定义、填充、更新和查询此类数据库。但也存在更简单的存储技术，允许以表的形式存储数据，但不支持 SQL。特别是键值存储系统（例如 JavaScript\
    \ 的 Local Storage API），允许将 JS 实体的序列化内容（实体记录的映射）作为与表作为键关联的字符串值进行存储。\n\n虽然 SQL 的经典版本（SQL92）不支持子类型化和继承，但这在\
    \ SQL99 中已经发生了变化。然而，SQL99 中与子类型相关的语言元素仅在某些 DBMS 中实现，例如开源 DBMS PostgreSQL。因此，为了设计一个可以使用各种\
    \ SQL DBMS 框架（包括如 MySQL 和 SQLite 等较弱的技术）来进行实现的设计模型，我们无法使用 SQL99 的子类型功能，而必须通过普通表和外键依赖在数据库设计模型中对继承层次结构进行建模。将这些类层次结构映射到关系表（以及反之）是对象-关系映射（ORM）框架的工作，例如\
    \ JPA 提供程序（如 Hibernate）、微软的 Entity Framework 或 Rails 框架的 Active Record 方法。\n\n\
    本质上有三种使用数据库表表示类层次结构的替代方法：\n\n- 1. **单表继承 (Single Table Inheritance, STI)** 是简单的方法，整个类层次结构由单个表表示，该表包含根类及其所有子类的所有属性列，以及根类的名称。\n\
    - 2. **类表继承 (Table per Class Inheritance, TCI)** 是一种方法，类层次结构中的每个类都由相应的表表示，该表还包含继承属性的列，并重复表示其父类的类的表列。\n\
    \n注意，STI 方法与上面 12.6 节讨论的“类层次结构合并”设计模式密切相关。当此设计模式已应用于设计模型中，或者设计模型已经根据此设计模式进行了重构时，相关的类层次结构（其子类）在设计中已被消除，因此在要在应用模型层中以类定义形式编码的数据模型中也被消除了，所以不再需要将类映射到单表。否则，设计模型包含一个类层次结构，该结构在应用模型层中通过相应的类层次结构实现，并将通过\
    \ STI 方法的帮助映射到数据库表。\n\n我们通过两个简单的示例来说说明这些方法的使用。第一个示例是 Book 类层次结构，如上图 12.1 所示。第二个示例是\
    \ Person 角色 Employee、Manager 和 Author 的类层次结构，如下文图 12.8 中的类图所示。\n\n### 12.7.4.1\
    \ 单表继承\n\n考虑上图 12.1 所示的单级类层次结构，它是对类 Book 的不完全不交分段，作为 MVC 应用模型类的设计。在这种情况下，每当我们拥有一个仅一层（或少数层）子类型化的模型层次结构，且每个子类型只有少数额外属性时，使用\
    \ STI 是更优的，因此我们建模一个包含所有属性的单表，其中代表段子类额外属性（“分段属性”）的列是可选的，如图 12.9 中的 SQL 表模型所示。\n\
    \n| Person |\n| :--- |\n| personid : Integer (id) |\n| name : String |\n| Employee\
    \ | Author |\n| empNo : integer (key) | biography : String |\n| Manager | |\n\
    | department : String | |\n\n**图 12.8:** 一个带有 Person 角色层次结构的信息设计模型。\n\n```\n«SQL\
    \ table»\nisbn[1] : VARCHAR (pkey)\ntitle[1] : VARCHAR\nyear[1] : INTEGER\ncategory[0..1]\
    \ : \"TextBook\",\"Biography\" (frozen)\nsubject_area[0..1] : VARCHAR\nabout[0..1]\
    \ : VARCHAR\n```\n\n```\n«invariant»\n{(category=\"TextBook\" IFF subject_area\
    \ IS NOT NULL)\n(category=\"Biography\" IFF about IS NOT NULL)}\n```\n\n**图 12.9:**\
    \ 表示 Book 层次结构的 SQL 表。\n\n添加一个特殊的鉴别器列来表示对应于子类的行的类别是一种常用方法。该列通常为字符串值，但被限制为子类名称之一。DBMS\
    \ 支持枚举，它也可以是枚举值的。当给定的分段是不交的时，使用单值枚举类别来表示信息所属的子类；如果它是不交的，则使用多值枚举类别来表示信息所属的子类。这种属性可以在\
    \ SQL 中通过定义一组枚举代码或标签的字符串值列来实现。\n\n根据书的类别，由于教科书-传记分段是刚性的，我们必须强制：当且仅当它是“TextBook”时，其属性\
    \ `subjectArea` 有值，且当且仅当它是“Biography”时，其属性 `about` 有值。这种隐含约束表示在上方类图中附加到 Book 表类的\
    \ invariant 中，其中逻辑运算符“IFF”代表“当且仅当”。它需要在数据库中实现，例如使用 SQL CHECK 子句或 SQL 触发器。\n\n\
    考虑如图 12 所示的类层次结构。在 Employee、Manager 和 Author 子类中仅定义三个额外属性，此类层次结构可以使用 STI 方法进行映射，如表\
    \ 12.10 所示。\n\n| people |\n| :--- |\n| person_id[1] | INTEGER (pkey) |\n| name[1]\
    \ | VARCHAR |\n| categories[*] | VARCHAR (\"Employee\", \"Manager\", \"Author\"\
    ) |\n| emp_no[0..1] | INTEGER (unique) |\n| biography[0..1] | VARCHAR |\n| department[0..1]\
    \ | VARCHAR |\n\n```\n«invariant»\n(\"Employee\" IN categories IFF NOTNULL(emp_no)\n\
    AND (\"Manager\" IN categories IFF NOTNULL(emp_no))\nAND NOTNULL(department)\n\
    AND (\"Author\" IN categories IFF NOTNULL(biography))\n```\n\n**图 12.10:** 表示\
