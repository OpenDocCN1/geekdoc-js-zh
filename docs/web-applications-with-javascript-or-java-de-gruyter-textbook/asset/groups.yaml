    \ Dennett | 0553345842 |\n| 2 | Douglas Hofstadter | 0553345842, 04650307093 |\n\
    | 3 | Immanuel Kant | 1463794762, 1928565379 |\n\nNotice how Book records reference\
    \ Publisher and Author records, and, vice-versa, Publisher and Author records\
    \ reference Book records.\n\n## 8 Implementing Bidirectional Associations with\
    \ Plain JS\n\nIn this chapter, we show:\n\n- 1. how to derive a JS class model\
    \ from an OO class model with derived inverse reference properties,\n- 2. how\
    \ to code the JS class model in the frame of JavaScript class models,\n- 3. how\
    \ to write the inverse and controller code based on the model code.\n\n### 8.1\
    \ Make a JavaScript Class Model\n\nThe starting point for making our JS class\
    \ model is an OO class model with derived inverse reference properties like the\
    \ one discussed above, which we present here again, for convenience:\n\n| Book\
    \ | Publisher |\n| :--- | :--- |\n| isbn[1]: String (id) | personId[1]: Integer\
    \ (id) |\n| title[1]: String | name[1]: String |\n| year[1]: Integer | /publishedBooks[*]:\
    \ Book (inverse of publisher) |\n| publisher[0..1]: Publisher | /authors[*]: Author\
    \ |\n\nNotice the model contains two inverse reference properties: Publisher:/publishedBooks\
    \ and Author::/authoredBooks. Each of them is linked to a master property, from\
    \ which it is derived. Consequently, each of them represents a pair of mutually\
    \ inverse reference properties corresponding to a bidirectional association.\n\
    \nCompared to making JS class models with unidirectional associations, the only\
    \ new issue is:\n\n- 1. Add a «get> stereotype to all inverse reference properties,\
    \ implying that they have an implicit getter, but no setter. They are implicitly\
    \ set whenever their master reference property is updated.\n\nThis concerns the\
    \ two derived inverse reference properties Publisher:/publishedBooks and Author::/authoredBooks.\
    \ Thus, we get the following JavaScript class model:\n\n## Book\n\n## Publisher\n\
    \n| <get/set> isbn[id] : string (id) | <get/set> setname[1] : string (id) |\n\
    | <get/set> title[1] : string | <get/set> setaddress[1] : string |\n| <get/set>\
    \ year[1] : number(int) | <get/set> publishedBooks[*] : Book (inverse of publisher)\
    \ |\n| <get/set> publisher[0..1] : Publisher | checkName(n : String) : ConstraintViolation\
    \ |\n| <get/set> author[1] : Author | checkNameAs(n : String) : ConstraintViolation\
    \ |\n| checkIsbn(isbn : String) : ConstraintViolation | checkRefIn(isbn : String)\
    \ : ConstraintViolation |\n| checkIsbnAidRef(isbn : String) : ConstraintViolation\
    \ | checkAddress(a : String) : ConstraintViolation |\n| checkTitle(title : String)\
