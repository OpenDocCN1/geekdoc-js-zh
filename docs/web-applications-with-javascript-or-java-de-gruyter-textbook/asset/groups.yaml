    \ introduce a few new elements of the JavaScript language, which we are going\
    \ to use throughout the JavaScript code discussed in this book.\n\n## 2.1 New\
    \ JavaScript Elements\n\nIn this section, we present the most important new language\
    \ elements introduced to JavaScript by ECMAScript 2015+ (that is, 2015+16+17+18+19+20+...).\n\
    \n### 2.1.1 Block-Scope Variable Declarations with let and const\n\nES5 did not\
    \ allow declaring variables the scope of which is a block delimited by pair of\
    \ curly braces, { }, or defined by a for loop. Rather, all variables declared\
    \ with var, even declared within a block, have either a function scope or the\
    \ global scope. The new feature of block-scope variable declarations with let\
    \ and const allows declaring local variables with a finer-grained scope, which\
    \ helps avoiding unintended variable duplications and leads to more modular code.\n\
    \nThere is only one meaning difference between let and const. Variables declared\
    \ with const are frozen or immutable, and in this sense constant, while let variables\
    \ are not. It is preferable to use const for all variables that are not supposed\
    \ to change their values. Otherwise, or if this is not clear, one should declare\
    \ the variable with let if it is a block-scoped variable, or with var if it is\
    \ a global or function-scoped variable.\n\n### 2.1.2 Arrow Functions\n\nCompared\
    \ to classical JS functions, arrow functions (with =>) provide a more concise\
    \ function syntax, see Ex. 1, and allow using JavaScript's variable from the function's\
    \ outer environment (its *closure*) in their function body, see Ex. 2.\n\n**Example\
    \ 2.1.**\n\n```javascript\nlet evens = [0,2,4,6,8];\nlet odds = evens.map(v =>\
    \ v+1); // [1,3,5,7,9]\n// instead of evens.map(function (v) { return v+1; })\n\
    ```\n\n**Example 2.2.**\n\n```javascript\nthis.nums = [1,3,5,8,10,12,15,17];\n\
