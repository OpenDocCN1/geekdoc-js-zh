    \ JS, a collection-valued reference property can be implemented in two ways:\n\
    1. having an array list (JS array) as its value,\n2. having a map as its value,\
    \ when that the values of the object's standard ID attribute are the keys, which\
    \ are mapped to internal JS object references.\n\nWe prefer using maps for set-valued\
    \ reference properties since they\ngarantee that each element is unique, while\
    \ with an array we would have to prevent\nduplicate elements. Also, an element\
    \ of a map can be easily deleted (with the help of\nthe delete operator), while\
    \ this requires more effort in the case of an array. However,\nfor implementing\
    \ ordered (or nonunique) association ends corresponding to ordered-collection-valued\
    \ (or bag/sequence-valued) reference properties, we use JS arrays.\n\n# 3.2 Make\
    \ a JS Class Model\n\nOur starting point for making a JS class model is the following\
    \ OO class model:\n\n| Book | Publisher |\n|---|---|n| isbn[1] : String (id) |\
    \ name : String (id) |\n| title[1] : String | address : String |\n| year[1] :\
    \ Integer | |\n| publisher[0..1] : Publisher | |\n| authors[*] : Author | |\n\
    | | personid : Integer (id) |\n| | name : String |"
- md: "\n# 40 Implementing Unidirectional Non-Functional Associations with Plain JS\n\
    \nThis model contains, in addition to the single-valued reference property Book::publisher,\
    \ the multi-valued reference property Book::authors representing the unidirectional\
    \ many-to-many association Book-has-Author.\n\nFor a JS class model from the OO\
    \ class model we have to follow the same steps as in Section 2.3 and, in addition\
    \ we have to take care of multi-valued reference properties, such as Book::authors;\
    \ for which we\n\n- 1. create a class-level check operation, such as checkAuthor,\
    \ which is responsible for checking the corresponding referential integrity constraint\
    \ for the references to be added to the property's collection;\n- 2. create an\
    \ add operation, such as addAuthor, for adding a reference to the collection;\n\
    - 3. create a remove operation, such as removeAuthor, for removing a reference\
    \ from the collection.\n\nThis leads to the following JS class model:\n\n| Book\
    \ | Publisher |\n| --- | --- |\n| | get/set isbn(id): string | get/set name: string\
    \ (id) |\n| | get/set title(id): string | get/set address: string |\n| | get/set\
    \ publisher[0..1]: Publisher | checkName(n: string): ConstraintViolation |\n|\
    \ | get/set authors[1..]: Author | checkNameAidRef(n: string): ConstraintViolation\
    \ |\n| | checkIsbn(isbn: String): ConstraintViolation | checkAddress(n: string):\
    \ ConstraintViolation |\n| | checkIsbnAidRef(isbn: String): ConstraintViolation\
    \ | toString(): string |\n| | checkTitle(title: String): ConstraintViolation |\
    \ toRecord(): Object |\n| | checkYear(year: integer): ConstraintViolation | Author\
    \ |\n| | checkAuthor(publisher): ConstraintViolation | get/set authorid: number(int)\
    \ (id) |\n| | checkAuthor(author: Author): ConstraintViolation | get/set name:\
    \ string |\n| addAuthor(author: Author) | checkAuthorAid(aid: number(int)): ConstraintViolation\
    \ |\n| removeAuthor(author: Author) | checkAuthorAidRef(aid: number(int)): ConstraintViolation\
    \ |\n| | toString(): string | checkNameAidRef(aid: number(int)): ConstraintViolation\
    \ |\n| | toRecord(): Object | checkName(n: string): ConstraintViolation |\n| |\
    \ | toString(): string |\n| | | toRecord(): Object |\n\n# 3.3 New Issues\n\nIn\
    \ dealing with a functional association, as discussed in the previous chapter,\
    \ we have to deal with the following new issues:\n\n- 1. In the model code we\
    \ have to take care of multi-valued reference properties that require implementing\n\
    - 1. an **add** and a **remove** method, such as addAuthor and removeAuthor, as\
    \ well as a **setter** method for assigning a set of object references with the\
    \ help of the add method, possibly converting ID references to object references;\
    \ three methods may need to check *cardinality constraints*, as there are any;\n\
    - 2. a class-level *check* operation, such as checkAuthor, which has to invoke\
    \ the corresponding `check ... AsIdRef` method of the property's range class for\
    \ checking the property's implicit *referential integrity constraint*;\n- 3. converting\
    \ a collection of object references to a collection of ID references in the object-to-storage\
    \ conversion function `toRecord`.\n\n- 2. In the **user interface** (\"view\"\
    ) code we now have to take care of\n- 1. showing information about a set of associated\
    \ objects in the property's column of the table view of the Retrieve/list all\
    \ use case; the simplest approach is showing a comma-separated list of ID references,\
    \ possibly combined with corresponding names; alternatively, HTML lists can be\
    \ rendered in the property's data table cells;\n- 2. allowing to select a set\
    \ of associated objects from a list of all instances of the property's range class\
    \ in the **Create** and **Update** cases.\n\nThe last issue, allowing to select\
    \ a set of associated objects from a list of all instances, can not be solved\
    \ with the help of an HTML select form control because of its poor usability.\
    \ Whenever the selectable options is greater than a threshold (defined by the\
    \ number of options that can be seen on the screen without scrolling), the multiple-select\
    \ element is no usable, and an alternative **multiple-choice widget** has to be\
    \ used.\n\n# 3.4 Code the Model\n\nNotice that, for simplicity, we do not include\
    \ the code for all constraint validation checks shown in the JS class model in\
    \ the code of the example app.\n\n# 3.4.1 Summary\n\nCode each class of the JS\
    \ class model as an E2015 class with implicit getters and setters:\n\n- 1. Code\
    \ the property checks in the form of class-level ('static') methods. Take care\
    \ that all constraints of a property as specified in the JS class model are properly\
    \ coded in the property.\n- 2. For each single-valued property, code the specified\
    \ getter and setter such that in each setter, the corresponding property check\
    \ is invoked and the property is only set/unset, if the check does not detect\
    \ any constraint violation.\n- 3. For each multi-valued property, code its add\
    \ and remove operations, as well as the specified get/set operations:\n- 1. Code\
    \ the add/remove operations as (instance-level) methods that invoke the corresponding\
    \ property checks.\n- 2. Code the setter such that it invokes the add operation\
    \ for each item of the collection to be assigned.\n- 4. Write the code of the\
    \ serialization function to toString() and the object-to-storage conversion function\
    \ to toRecord().\n- 5. Take care of deletion dependencies in the destroy method.\n\
    \nThese steps are discussed in more detail in the following sections.\n\n# 3.4.2\
    \ Code the Add and Remove Operations\n\nFor the multi-valued property Book::authors,\
    \ we need to code the operations addAuthor and removeAuthor. Both operations accept\
    \ one parameter denoting an author by ID reference (the author ID as integer or\
    \ string) or by object reference. The code of addAuthor is as follows:\n\n```\n\
    addAuthor (a) {\n  // can be an ID reference or an object reference\n  const author_id\
    \ = (typeof a == \"object\") ? parseInt(a) : a.authorId;\n  const validationResult\
    \ = Book.checkAuthor( author_id);\n  if (author_id && validationResult instanceof\
    \ NoConstraintViolation) {\n    // add the new author reference\n    let key =\
    \ String(author_id);\n    this._authors[key] = Author.instances[key];\n  } else\
    \ {\n    throw validationResult;\n  }\n}\n```\n\nIn removeAuthor method, the author\
    \ reference is first checked, and if no constraint violation is detected, the\
    \ corresponding entry in the map._authors is deleted:\n\n```\nremoveAuthor (a)\
    \ {\n  // can be an ID reference or an object reference\n  const author_id = (typeof\
    \ a == \"object\") ?\n  parseInt(a) : a.authorId;\n  const validationResult =\
    \ Book.checkAuthor( author_id);\n  if (validationResult instanceof NoConstraintViolation)\
    \ {\n    // delete the author reference\n    delete this._authors[author_id];\n\
    \  } else {\n    throw validationResult;\n  }\n}\n```\n\nFor assigning an array\
    \ of ID references, or a map of object references, to the property Book::authors;\
    \ the method setColor adds one by one with the help of addAuthor:\n\n```\nset\
    \ authors (a) {\n  this._authors = {};\n  if (Array.isArray(a)) { // array of\
    \ IdRefs\n    for (let idRef of a) {\n      this.addAuthor(idRef);\n    }\n  }\
    \ else { // map of IdRefs to object references\n    for (let idRef of Object.keys(a))\
    \ {\n      this.addAuthor(a[idRef]);\n    }\n  }\n}\n```\n\n# 3.4.3 Choose and\
    \ Implement a Deletion Policy\n\nFor the property Book::authors, we have to choose\
    \ and implement a deletion in the destroy method of the Author class. We have\
    \ to choose between deleting all books (co-)authored by the deleted author (reflecting\
    \ the logic of Existential Dependency);\n\n- 1. deleting all books (co-)authored\
    \ by the deleted author (reflecting the logic of Existential Dependency);\n- 2.\
    \ dropping from books (co-)authored by the deleted author the reference to the\
    \ deleted author (reflecting the logic of Existential Independence).\n\nFor simplicity,\
    \ we go for the second option. This is shown in the following code of the static\
    \ Author.destroy method for all concerned book objects the author reference book.authors[authorID]\
    \ is dropped:\n\n```\nAuthor.destroy = function (authorID) {\n  const author =\
    \ Author.instances[authorID];\n  // delete all dependent book records\n  for (let\
    \ isbn of Object.keys(Book.instances)) {\n    let book = Book.instances[isbn];\n\
    \    if (book.authors[authorID]) delete book.authors[authorID];\n  }\n}\n```\n"
  mdcn: "\n\n# 40 使用纯 JS 实现单向非功能关联\n\n该模型除了单值引用属性 `Book::publisher` 之外，还包含了多值引用属性\
    \ `Book::authors`，它代表了单向多对多关联“书籍-作者”。\n\n对于从面向对象的类模型转换到 JS 类模型，我们必须遵循与第 2.3 节相同的步骤，此外，我们还必须处理多值引用属性，例如\
    \ `Book::authors`；为此我们：\n\n- 1. 创建一个类级检查操作，例如 `checkAuthor`，它负责检查要添加到属性集合中的引用是否符合相应的引用完整性约束；\n\
    - 2. 创建一个添加操作，例如 `addAuthor`，用于向集合中添加引用；\n- 3. 创建一个移除操作，例如 `removeAuthor`，用于从集合中移除引用。\n\
    \n这导致了以下 JS 类模型：\n\n| Book | Publisher |\n| --- | --- |\n| | get/set isbn(id):\
    \ string | get/set name: string (id) |\n| | get/set title(id): string | get/set\
    \ address: string |\n| | get/set publisher[0..1]: Publisher | checkName(n: string):\
    \ ConstraintViolation |\n| | get/set authors[1..]: Author | checkNameAidRef(n:\
    \ string): ConstraintViolation |\n| | checkIsbn(isbn: String): ConstraintViolation\
    \ | checkAddress(n: string): ConstraintViolation |\n| | checkIsbnAidRef(isbn:\
    \ String): ConstraintViolation | toString(): string |\n| | checkTitle(title: String):\
    \ ConstraintViolation | toRecord(): Object |\n| | checkYear(year: integer): ConstraintViolation\
    \ | Author |\n| | checkAuthor(publisher): ConstraintViolation | get/set authorid:\
    \ number(int) (id) |\n| | checkAuthor(author: Author): ConstraintViolation | get/set\
    \ name: string |\n| addAuthor(author: Author) | checkAuthorAid(aid: number(int)):\
    \ ConstraintViolation |\n| removeAuthor(author: Author) | checkAuthorAidRef(aid:\
    \ number(int)): ConstraintViolation |\n| | toString(): string | checkNameAidRef(aid:\
    \ number(int)): ConstraintViolation |\n| | toRecord(): Object | checkName(n: string):\
    \ ConstraintViolation |\n| | | toString(): string |\n| | | toRecord(): Object\
    \ |\n\n# 3.3 新问题\n\n在处理功能性关联时（如上一章所述），我们必须处理以下新问题：\n\n- 1. 在模型代码中，我们必须处理多值引用属性，这些属性需要实现：\n\
    - 1. 一个**add** 和**remove** 方法，例如 `addAuthor` 和 `removeAuthor`，以及一个通过借助 `add` 方法分配一组对象引用的\
    \ **setter** 方法，并可能将 ID 引用转换为对象引用；这三个方法可能需要检查*基数约束*（如果有的话）；\n- 2. 一个类级*check*（检查）操作，例如\
    \ `checkAuthor`，它必须调用属性范围类相应的 `check ... AsIdRef` 方法，以检查属性的隐式*引用完整性约束*；\n- 3.\
    \ 在对象到存储的转换函数 `toRecord` 中，将对象引用集合转换为 ID 引用集合。\n\n- 2. 在**用户界面**（“视图”）代码中，我们现在必须处理：\n\
    - 1. 在“检索/列出所有”用例的表格视图属性列中，显示一组关联对象的信息；最简单的方法是显示逗号分隔的 ID 引用列表，可能与相应的名称结合；或者，可以在属性的数据单元格中渲染\
    \ HTML 列表；\n- 2. 在**创建**和**更新**用例中，允许从属性范围类所有实例的列表中选择一组关联对象。\n\n最后一个问题（允许从所有实例列表中选择一组关联对象）无法通过\
    \ HTML `select` 表单控件解决，因为它的易用性较差。当可选选项超过阈值（由屏幕上无需滚动即可可见的选项数量定义）时，多选元素将不可用，必须使用替代的**多选组件**。\n\
    \n# 3.4 编写模型\n\n请注意，为了简单起见，我们没有在示例应用程序的代码中包含 JS 类模型中显示的所有约束检查代码。\n\n# 3.4.1 总结\n\
    \n将 JS 类模型中的每个类编码为具有隐式 getter 和 setter 的 E2015 类：\n\n- 1. 以类级（“静态”）方法的形式编写属性检查。确保\
    \ JS 类模型中指定的所有属性约束在属性中都被正确编码。\n- 2. 对于每个单值属性，编写指定的 getter 和 setter，使得在每个 setter\
    \ 中都会调用相应的属性检查，并且只有当检查未检测到任何约束违反时，才设置/取消属性。\n- 3. 对于每个多值属性，编写其 add 和 remove 操作，以及指定的\
    \ get/set 操作：\n- 1. 将 add/remove 操作编写为（实例级）方法，这些方法调用相应的属性检查。\n- 2. 编写 setter，使其对要分配的集合中的每个项调用\
    \ add 操作。\n- 4. 编写序列化函数 `toString()` 和对象到存储的转换函数 `toRecord()` 的代码。\n- 5. 在 `destroy`\
    \ 方法中处理删除依赖关系。\n\n这些步骤将在接后的章节中进行详细讨论。\n\n# 3.4.2 编写添加和移除操作\n\n对于多值属性 `Book::authors`，我们需要编写\
    \ `addAuthor` 和 `removeAuthor` 操作。这两个操作都接受一个参数，用 ID 引用（整数或字符串形式的作者 ID）或对象引用。`addAuthor`\
    \ 的代码如下：\n\n```\naddAuthor (a) {\n  // 可以是 ID 引用或对象引用\n  const author_id = (typeof\
    \ a == \"object\") ? parseInt(a) : a.authorId;\n  const validationResult = Book.checkAuthor(\
    \ author_id);\n  if (author_id && validationResult instanceof NoConstraintViolation)\
    \ {\n    // 添加新的作者引用\n    let key = String(author_id);\n    this._authors[key]\
    \ = Author.instances[key];\n  } else {\n    throw validationResult;\n  }\n}\n\
    ```\n\n在 `removeAuthor` 方法中，首先检查引用，如果没有检测到约束违反，则删除 `map._authors` 中的对应条目：\n\n\
    ```\nremoveAuthor (a) {\n  // 可以是 ID 引用或对象引用\n  const author_id = (typeof a ==\
    \ \"object\") ?\n  parseInt(a) : a.authorId;\n  const validationResult = Book.checkAuthor(\
    \ author_id);\n  if (validationResult instanceof NoConstraintViolation) {\n  \
    \  // 删除作者引用\n    delete this._authors[author_id];\n  } else {\n    throw validationResult;\n\
    \  }\n}\n```\n\n对于将 ID 引用数组或对象引用映射赋值给属性 `Book::authors`；`setColor` 方法将通过 `addAuthor`\
    \ 逐个添加：\n\n```\nset authors (a) {\n  this._authors = {};\n  if (Array.isArray(a))\
    \ { // IdRefs 数组\n    for (let idRef of a) {\n      this.addAuthor(idRef);\n \
    \   }\n  } else { // IdRefs 到对象引用的映射\n    for (let idRef of Object.keys(a)) {\n\
    \      this.addAuthor(a[idRef]);\n    }\n  }\n}\n```\n\n# 3.4.3 选择并实现删除策略\n\n\
    对于属性 `Book::authors`，我们需要在 `Author` 类的 `destroy` 方法中选择并实现删除。我们需要在删除所有由删除作者编写的书籍（反映依赖性逻辑）之间进行选择：\n\
    \n- 1. 删除所有由删除作者编写的书籍（反映依赖性逻辑）；\n- 2. 从由删除作者编写的书中删除对被删除作者的引用（反映独立性逻辑）。\n\n为了简单起见，我们选择第二种方案。在如下静态\
    \ `Author.destroy` 方法代码中，对于所有相关的书籍对象，作者引用 `book.authors[authorID]` 被删除：\n\n```\n\
    Author.destroy = function (authorID) {\n  const author = Author.instances[authorID];\n\
    \  // 删除所有相关的书籍记录\n  for (let isbn of Object.keys(Book.instances)) {\n    let\
    \ book = Book.instances[isbn];\n    if (book.authors[authorID]) delete book.authors[authorID];\n\
    \  }\n}\n```\n\n"
