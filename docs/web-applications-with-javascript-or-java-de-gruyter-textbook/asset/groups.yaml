    ```\n\n# 10 Special Topics on Associations\n\n### 10.1 Part-Whole Associations\n\
    \nA part-whole association represents a relationship between a part type and a\
    \ whole type. Instances are part-whole relationships between two objects where\
    \ one of them is a part of the other (the). The UML makes a distinction between\
    \ two kinds of part-whole associations: *aggregation* and *composition*. While\
    \ these types are defined in a pretty precise, albeit unsatisfactory, way in the\
    \ UML, many software developers have a different interpretation following a terminological\
    \ tradition of the C++ programming community where, unlike the parts of an ‘aggregation-composition’,\
    \ the parts of a ‘composition’ cannot exist independently of the composite references\
    \ them.\n\nWe follow the UML and improve their definition of composition by introducing\
    \ a distinction between two kinds of compositions: those with *separable* parts\
    \ and those with *inseparable* parts.\n\n### 10.1.1 Aggregation\n\nAn aggregation\
    \ is a special form of a part-whole association, where the parts of a whole can\
    \ be shared with other wholes. For instance, we can model an aggregation between\
    \ the classes DegreeProgram and Course, as shown in the following diagram, since\
    \ a course is part of a degree program and a course can be shared among two or\
    \ more degree programs (e.g. an engineering degree could share a C programming\
    \ course with a computer science degree).\n\n| DegreeProgram | Course |\n|---|---|\n\
    | name : String | id : String |\n| * | name : String |\n\nHowever, the concept\
    \ of an aggregation with *shareable parts* doesn't mean much, really, so it has\
    \ no implications on how to code the association and many developers prefer not\
    \ to use the white diamond in their class diagrams, but just model a plain association\
    \ instead. The UML says: “Precise semantics of shared aggregation varies by application\
    \ area and modeler”.\n\nThe *multiplicity* of an aggregation's association end\
    \ at the whole side may be any number (*) because a part may belong to, or *shared\
    \ among*, any number of wholes.\n\n# 10 Special Topics on Associations\n\n###\
    \ 10.1.2 Composition\n\nIt's amazing how much confusion exists about the distinction\
    \ between the part-whole association concepts aggregation and composition. The\
    \ main problem is the widespread misunderstanding (even among expert software\
    \ developers and among authors of UML) that the concept of composition implies\
    \ a life-cycle dependency between the whole and its parts that the parts cannot\
    \ exist without the whole. But this view ignores the fact that there are also\
    \ cases of part-whole associations with non-shareable parts where the parts can\
    \ be detached and survive the destruction of the whole.\n\nIn the Specification\
    \ document, the definition of the term \"composition\" has always implied non-shareable\
    \ parts, but it has not clear what is the defining characteristic of \"composition\"\
    , and what is merely an optional characteristic. Even in the UML version 2.5 (as\
    \ of 2015), after an attempt to provide the definition of the term \"composition\"\
    , it remains still ambiguous and does not provide any guidance how to model part-whole\
    \ associations with non-shareable parts where the parts can be detached from,\
    \ and survive the destruction of, the as opposed to the case where the parts cannot\
    \ be detached and are destroyed together with the whole. They say:\n\n> If a composite\
    \ object is deleted, all of its parts are objects that are deleted with.\n\nAt\
    \ the same time they also say:\n\n> A part may be removed from a composite object\
    \ before the composite object is deleted, and thus not deleted as part of the\
    \ composite object.\n\nThis confusion points to an incompleteness of the UML definition,\
    \ which does not account for life-cycle dependencies between components and composites.\
    \ It's therefore important to understand how the UML definition can be enhanced,\
    \ e.g. by introducing a UML stereotype for \"inseparable\" compositions, or by\
    \ introducing a key word inseparable for characterizing the association end at\
    \ the component side.\n\nMartin Fowler explained, the main issue for characterizing\
    \ composition relationships is that \"an object can only be the part of composition\
    \ relationship\". This is also explained in the blog post UML Composition with\
    \ Aggregation as Association by B. Bellelekens. In addition to defining this characteristic\
    \ of a composition (to have exclusive, or non-shareable, parts), a composition\
