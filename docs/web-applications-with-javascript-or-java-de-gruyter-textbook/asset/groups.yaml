- md: "\n## 9. Implementing Bidirectional Associations with Java EE\n\nFor instance,\
    \ for the multi-valued reference property Book::authors that is coupled to the\
    \ derived inverse reference property Author::authoredBooks for implementing the\
    \ bidirectional authorship association between Book and Author, the addAuthor\
    \ method is coded in the following way:\n\n```java\npublic class Book {\n\n  public\
    \ void addAuthor(Author author) {\n    if (this.authors == null) {\n      this.authors\
    \ = new HashSet<Author>();\n    }\n    if (!this.authors.contains(author)) {\n\
    \      // add the new author reference\n      this.authors.add(author);\n    \
    \  // add the derived inverse reference\n      author.addAuthoredBook(this);\n\
    \    }\n  }\n}\n```\n\nFor the removal class `removeAuthor` we obtain the following\
    \ code:\n\n```java\npublic class Book {\n\n  public void removeAuthor(Author author)\
    \ {\n    if (this.authors != null && author != null &&\n        this.authors.contains(author))\
    \ {\n      // delete the author reference\n      this.authors.remove(author);\n\
    \      // delete the derived inverse reference\n      author.removeAuthoredBook(this);\n\
    \    }\n  }\n}\n```\n\nRemember, for a Java Collection, such as Set or List, the\
    \ `contains` method compares two objects by using the `equals` method of the objects.\
    \ For example, for using the `contains` method over a `Set<Author>`, such as `publishedBooks`,\
    \ in the `Author` class we implement the following `equals` method (two authors\
    \ are equal if their `personId` property values are):\n\n```java\npublic class\
    \ Author {\n  ..\n  @Override\n  public boolean equals(Object obj) {\n    if (obj\
    \ instanceof Author) {\n      Author author = (Author) obj;\n      return (this.personId.equals(author.personId));\n\
    \    } else return false;\n  }\n}\n```\n\n### 9.2.6 Take Care of Deletion Dependencies\n\
    \nWhen a Book instance `b`, with a single reference `b.publisher` to a Publisher\
    \ instance `p` and multiple references `b.authors` to Author instances, is destroyed,\
    \ the derived inverse references have to be removed first (e.g., by removing `b`\
    \ from `p.publishedBooks`). This is accomplished by calling the methods for the\
    \ single and multi-valued properties with a null parameter, e.g., `b.setPublisher(null)`\
    \ and `b.setAuthors(null)` within the `Book.delete` method:\n\n```java\npublic\
    \ class Book {\n  ..\n  public static void delete(EntityManager em,\n    UserTransaction\
    \ ut, String isbn) throws Exception {\n    ut.begin();\n    Book b = em.find(Book.class,\
    \ isbn);\n    b.setPublisher(null);\n    b.setAuthors(null);\n    em.remove(b);\n\
    \    ut.commit();\n  }\n}\n```\n\nIn the same way, we have to take care of deleting\
    \ the references to Book instances when deleting a Publisher or an Author instance:\n\
    \n```java\npublic class Author {\n  public static void delete(EntityManager em,\n\
    \    UserTransaction ut, Integer personId) throws Exception {\n    ut.begin();\n\
    \    Author a = em.find(Author.class, personId);\n    a.setAuthoredBooks(null);\n\
    \    em.remove(a);\n    ut.commit();\n  }\n}\n```\n\n```java\npublic class Publisher\
    \ {\n  public static void delete(EntityManager em,\n    UserTransaction ut, String\
    \ name) throws Exception {\n    ut.begin();\n    Publisher p = em.find(Publisher.class,\
    \ name);\n    p.setAuthoredBooks(null);\n    em.remove(p);\n    ut.commit();\n\
    \  }\n}\n```\n\n### 9.2.7 Entity Managers and Cached Entities\n\nUnfortunately,\
    \ JPA does not provide automatic maintenance of derived inverse references. According\
    \ to the Java Persistence Wiki, we have to implement the (di- and inverse) relations\
    \ management with set/add/remove methods:\n\n> A common problem with bidirectional\
    \ relationships is the application updates one side of the relationship, while\
    \ the other side not get updated, and becomes out of sync. In JPA, as Java in\
    \ general, it is the responsibility of the application or the object model to\
    \ maintain relationships. If your application adds to one side of the relationship,\
    \ then it must add to the other side. This is commonly resolved through add or\
    \ set methods in the object model that handle both sides of the relationships,\
    \ so the application code does not need to worry about it. There are two ways\
    \ to go about this: you can either add the relationship maintenance code to one\
    \ side of the relationship, and only use the setter from that side (such as making\
    \ the other side protected), or to add to both sides and ensure you avoid an infinite\
    \ loop.\n\nWe have used an entity manager for each controller class. Every entity\
    \ manager maintains a set of cached entities which can be “shared” with other\
    \ entity managers by using the merge method. In our example code, as part of the\
    \ create and update methods of each model class, we have to merge the entities\
    \ that belong to another entity manager. For example, in the `Book.create` method,\
    \ we need to merge the new book's publisher, managed by the `PublisherController`'s\
    \ entity manager, and all its authors, managed by the `AuthorController`'s entity\
    \ manager:\n\n```java\npublic class Book {\n    public static void create(EntityManager\
    \ em,\n        UserTransaction ut,\n        String isbn, String title, Integer\
    \ year,\n        Publisher publisher, Set<Author> authors)\n        throws Exception\
    \ {\n        ut.begin();\n        Book book = new Book(isbn, title, year,\n  \
    \          publisher, authors);\n        em.persist(book);\n        if (publisher\
    \ != null) {\n            em.merge(publisher);\n        }\n        if (authors\
    \ != null) {\n            for (Author a : authors) {\n                em.merge(a);\n\
    \            }\n        }\n        ut.commit();\n    }\n}\n```\n\nWithout using\
    \ merge, the publisher as well as all author instances from the authors list,\
    \ do not represent references to the originally cached entities, and are not going\
    \ to retain their changes. For more details, please check the Java Persistence\
    \ Documentation related to this.\n\nIt is also possible to disable the JPA caching,\
    \ so the entities are reloaded from the database for every new instance, e.g.,\
