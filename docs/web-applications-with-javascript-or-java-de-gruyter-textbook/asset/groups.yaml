    不支持将关联视为一等公民。它们没有定义关联的语言元素。因此，面向对象（OOP）类设计模型（我们称之为 OO 类模型）不应包含任何显式关联。


    ## 1.5 为非无向关联添加方向性


    当我们以 UML 类图的形式制作信息模型时，通常会得到一个包含一个或多个关联的模型，这些关联的末端没有定义任何所有权，例如图 1.4 所示。当关联的末端都没有所有权点（ownership
    dot）时（如例），这意味着模型没有指定如何通过引用属性（reference properties）表示（或实现）该关联。这种关联没有方向。根据 UML 2.5
    规范，此类关联的末端由其自身“所有”，而不是由参与其中的任何类所有。


    | Committee | chairedCommittee | ClubMember |

    |---|---|---|

    | name : String | | 1 |


    图 1.4: 委员会（Committee）与俱乐部成员（ClubMember）之间非无向关联的模型。


    包含没有关联端所有权点的信息设计模型作为关系型数据库设计模型是可以接受的，但作为 OOP 语言的设计模型，它是不完整的。


    例如，图 1.4 的模型提供了一个关系型数据库设计，包含两个实体表（committees 和 clubmembers）以及一个单独的一一一关系表 committee_clubmember_as_chair。它没有为
    Java 类提供设计，因为它没有指定如何通过引用属性来实现该关联。


    有三种方案可以将非无向关联的信息设计模型（不包含任何关联所有权点）转换为所有关联均为单向或双向的信息模型：我们可以在关联的任一末端或两个末端都放置所有权点。这三个方案中的每一个都定义了通过引用属性表示或实现关联的不同方法。因此，对于上述图
    1.4 所示的关联，我们有以下选项：


    - 1. 在 chair 关联端放置所有权点，得到如图 1.2 所示的模型，该模型可以转换为上述图 1.1 所示的 OO 类模型。

    - 2. 在 chairedCommittee 关联端放置所有权点，得到下文图 1.8 所示的完整模型。

    - 3. 通过在两个关联端都放置所有权点来使关联变为双向，如图 1.5 所示，其含义是关联通过一对互逆的引用属性 `Committee::chair` 和
    `ClubMember::chairedCommittee` 以冗余方式实现，如第 7 节所述。


    | Committee | chair | ClubMember |

    |---|---|---|

    | name : String | 0.1 | 1 |


    图 1.5: 委员会（Committee）与俱乐部成员（ClubMember）之间的双向关联建模。


    每当我们对关联进行建模时，都必须选择哪一个末端代表引用属性并因此标记所有权点。这可以是其中一个，也可以是两者。这个决策也意味着对关联导航性（navigability）的决策。当关联表示引用属性时，这意味着它是可导航的（通过该属性）。


    对于非一对一（not-to-one）的功能性关联，最简单的设计是根据其功能定义关联的方向，将关联所有权点放在多重性为 0..1 或 1 的关联端。对于非无向的一一或多对多关联，我们可以根据意愿选择方向，即我们可以在任何关联端放置所有权点。


