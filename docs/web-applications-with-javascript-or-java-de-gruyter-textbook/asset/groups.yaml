    ### 1.10.2 题 2：何时检查引用完整性


    对于域为 C 范围类为 D 的引用属性 p，在任何情况下必须检查引用完整性（选择一个或多个）：


    - 类型 C 的对象被毁。

    - 某些对象的 p 值发生变化。

    - 创建新的类型 C 对象。

    - 类型 D 的对象被毁。

