- md: "\nNotice that, since the name attribute is the standard ID attribute of Publisher,\
    \ we only check syntactic constraints in checkName, and check the mandatory value\
    \ and uniqueness constraints in checkNameAsId, which invokes checkName:\n\n```\n\
    static checkNameAsId(n) {\n    var validationResult = Publisher.checkName(n);\n\
    \    if ((validationResult instanceof NoConstraintViolation) {\n        if (n\
    \ === undefined) {\n            return new MandatoryValueConstraintViolation(\n\
    \                \"A publisher name is required!\"\n            );\n        }\
    \ else if (Publisher.instances[n]) {\n            validationResult = new UniquenessConstraintViolation(\n\
    \                \"There is already a publisher record with this name!\"\n   \
    \         );\n        } else {\n            validationResult = new NoConstraintViolation();\n\
    \        }\n    }\n}\n```\n\nIf we have to deal with ID references (foreign keys)\
    \ in other classes, we need to provide a further check, called checkNameAsIdRef,\
    \ for checking the referential integrity constraint:\n\n```\nstatic checkNameAsIdRef(n)\
    \ {\n    var validationResult = Publisher.checkName(n);\n    if ((validationResult\
    \ instanceof NoConstraintViolation) &&\n        n !== undefined) {\n        if\
    \ (!Publisher.instances[n]) {\n            validationResult = new ReferentialIntegrityConstraintViolation(\n\
    \                \"There is no publisher record with this name!\"\n          \
    \  );\n        }\n    }\n    return validationResult;\n}\n```\n\nThe condition\
    \ !Publisher.instances[n] checks if there is no publisher object with the given\
    \ name n, and then creates a validationResult object as an instance of the exception\
    \ class ReferentialIntegrityConstraintViolation. The Book.checkNameAsRef function\
    \ is called by the Book.checkPublisher function:\n\n```\nclass Book {\n  ..\n\
    \  static checkPublisher(publisher_id) {\n    var validationResult = null;\n \
    \   if (publisher_id === undefined || publisher_id === \"\") {\n      validationResult\
    \ = new NoConstraintViolation(); // optional\n    } else {\n      // invoke foreign\
    \ key constraint check\n      validationResult = Publisher.checkNameAsIdRef(publisher_id);\n\
    \    }\n    return validationResult;\n  }\n  ..\n}\n```\n\n## 2 Implementing Unidirectional\
    \ Functional Associations with Plain JS\n\n### 2.5.4 Code the Property Setters\n\
    \nIn the setters, the corresponding check function is called and the property\
    \ is only set, if the check does not detect constraint violation. In the case\
    \ of a reference property, we allow invoking the setter with an object reference\
    \ or an ID reference. The resulting ambiguity is resolved by testing if the argument\
    \ provided in the invocation of the setter is an object or not. For instance,\
    \ the publisher setter is coded in the following way:\n\n```\nclass Book {\n \
    \ ..\n  set publisher(p) {\n    if (!p) // unset publisher\n      delete this._publisher;\n\
    \    } else {\n      // p can be an ID reference or an object reference\n    \
    \  const publisher_id = typeof p==\"object\" ? p : p.name;\n      const validationResult\
    \ = Book.checkPublisher(publisher_id);\n      if (validationResult instanceof\
    \ NoConstraintViolation) {\n        // create the new publisher reference\n  \
    \      this._publisher = Publisher.instances[publisher_id];\n      } else {\n\
    \        throw validationResult;\n      }\n    }\n  }\n}..\n```\n\n### 2.5.5 Choose\
    \ and Implement a Deletion Policy\n\nFor any reference property, we have to choose\
    \ and implement one of the two possible deletions discussed in Section 1.2 for\
    \ managing the corresponding object destruction dependency in the destroy method\
    \ of the property's range class. In our case, when deleting a publisher record,\
    \ we have to choose between\n\n- 1. deleting records of books published by the\
    \ deleted publisher (Existential Dependency);\n- 2. dropping from all books published\
    \ by the deleted publisher reference to the deleted publisher (Existential Independence).\n\
    \nAssuming that books not existentially depend on their publishers, we choose\
    \ the second option. This is shown in the following code of the Publisher.destroy\
    \ method where for all concerned book objects the property publisher.is is cleared:\n\
    \n```\nPublisher.destroy = function (name) {\n    const publisher = Publisher.instances[name];\n\
    \    // delete all references to this publisher in book objects\n    for (let\
    \ key of Object.keys(Book.instances)) {\n        const book = Book.instances[key];\n\
    \        if (book.publisher === publisher) {\n            book.publisher = null;\
    \ // delete the slot\n            console.log(\"Book \" + book.isbn + \" updated.\"\
    );\n        }\n    }\n    // delete the publisher record\n    delete Publisher.instances[name];\n\
    \    console.log(\"Publisher \" + name + \" deleted.\");\n};\n```\n\nNote that\
    \ the deletion of all references to the deleted publisher is performed in a sequential\
    \ scan through all book objects, which may be inefficient when there are many\
    \ of them. It would be much more efficient when each publisher object would hold\
    \ a list of references to all books published by this publisher. Creating and\
    \ maintaining a list would make the association between books and their publisher\
    \ bidirectional.\n\n### 2.5.6 Serialization and Object-to-Storage Mapping\n\n\
    In the case of a reference property, like Book::publisher, the serialization function\
    \ Book::toString() has to show a human-readable identifier of the referred object,\
    \ like this publisher.name:\n\n```\ntoString() {\n  var bookStr = `Book: ISBN:\
    \ ${this.isbn}, title: ${this.title},` +\n  `year: ${this.year}`;\n  if (this.publisher)\
    \ bookStr += `, publisher: ${this.publisher.name}`;\n  return bookStr;\n}\n```\n\
    \nThe object-to-storage mapping Book::toRecord() converts typed JS objects with\
    \ object references (untyped) record objects with ID references:\n\n```\ntoRecord()\
    \ {\n  var rec = {};\n  for (let p of Object.keys(this)) {\n    // copy only property\
    \ with underscore prefix\n    if (p.charAt(0) === \"_\") {\n      switch (p) {\n\
    \        case \"_publisher\":\n          // convert object reference to ID reference\n\
    \          if (this._publisher) rec.publisher_id = this._publisher.name;\n   \
    \       break;\n        default:\n          // remove underscore prefix\n    \
    \      rec[p.substr(1)] = this[p];\n      }\n    }\n  }\n  return rec;\n}\n```\n\
    \nThe inverse conversion, from untyped record objects with ID references to corresponding\
    \ typed objects with object references, is performed by the Book constructor,\
    \ which tolerates both ID references and object references as arguments for setting\
    \ reference properties.\n\n## 2. Code the View and Controller\n\nThe user interface\
    \ (UI) consists of a start page index.html that allows navigating to data management\
    \ UI pages, for each object type (in our example, books.html and publishers.html).\
    \ Each of these data management UI pages contains two sections: a Manage section,\
    \ Manage books, with a menu for choosing a CRUD use case, and a section for each\
    \ CRUD use case, like Retrieve/list books, Create book, Update book and Delete\
    \ book, such that only one of them is displayed at any time (for instance, by\
    \ setting the CSS property display:none for all others).\n\n### 2.6.1 Initialize\
    \ the App\n\nFor initializing a data management use case, the required data (for\
    \ instance, all publisher and book records) have to be loaded from persistent\
    \ storage. This is performed in a controller procedure as pl.c.books.manage.initialize\
    \ in c/books.js with the following code:\n\n```\npl.c.books.manage = {\ninitialize:\
    \ function () {\n  Publisher.retrieveAll();\n  Book.retrieveAll();\n  pl.v.books.manage.setUpInterface();\n\
    \  }\n};\n```\n\nThe initialize method for managing book data first loads the\
    \ publishers table and the books table since the book data management UI needs\
    \ to show their data. Then the book data management menu is rendered by calling\
    \ the setUpInterface procedure.\n\n### 2.6.2 Showing Associated Objects in Retrieve/List\
    \ All\n\nIn our example, we have only one reference property, Book::publisher,\
    \ which is functional and optional. For showing information about the optional\
    \ publisher of a book in the Retrieve/list all use case, the corresponding cell\
    \ in the HTML table is filled with the name of the publisher, if there is any.\n"
  mdcn: "\n请注意，由于 `name` 属性是 Publisher 的标准 ID 属性，我们只在 `checkName` 中检查语法约束，并在 `checkNameAsId`\
    \ 中检查强制值约束和唯一性约束，后者会调用 `checkName`：\n\n```\nstatic checkNameAsId(n) {\n    var\
    \ validationResult = Publisher.checkName(n);\n    if ((validationResult instanceof\
    \ NoConstraintViolation) {\n        if (n === undefined) {\n            return\
    \ new MandatoryValueConstraintViolation(\n                \"A publisher name is\
    \ required!\"\n            );\n        } else if (Publisher.instances[n]) {\n\
    \            validationResult = new UniquenessConstraintViolation(\n         \
    \       \"There is already a publisher record with this name!\"\n            );\n\
    \        } else {\n            validationResult = new NoConstraintViolation();\n\
    \        }\n    }\n}\n```\n\n如果我们要在其他类中处理 ID 引用（外键），我们需要提供进一步的检查，即 `checkNameAsIdRef`，用于检查完整性约束：\n\
    \n```\nstatic checkNameAsIdRef(n) {\n    var validationResult = Publisher.checkName(n);\n\
    \    if ((validationResult instanceof NoConstraintViolation) &&\n        n !==\
    \ undefined) {\n        if (!Publisher.instances[n]) {\n            validationResult\
    \ = new ReferentialIntegrityConstraintViolation(\n                \"There is no\
    \ publisher record with this name!\"\n            );\n        }\n    }\n    return\
    \ validationResult;\n}\n```\n\n条件 `!Publisher.instances[n]` 检查是否存在具有给定名称 `n` 的\
    \ publisher 对象，然后创建一个作为异常类 `ReferentialIntegrityConstraintViolation` 实例 `validationResult`\
    \ 对象。`Book.checkNameAsRef` 函数由 `Book.checkPublisher` 函数调用：\n\n```\nclass Book\
    \ {\n  ..\n  static checkPublisher(publisher_id) {\n    var validationResult =\
    \ null;\n    if (publisher_id === undefined || publisher_id === \"\") {\n    \
    \  validationResult = new NoConstraintViolation(); // optional\n    } else {\n\
    \      // 调用外键约束检查\n      validationResult = Publisher.checkNameAsIdRef(publisher_id);\n\
    \    }\n    return validationResult;\n  }\n  ..\n}\n```\n\n## 2 使用原生 JS 实现单向函数式关联\n\
    \n### 2.5.4 编写属性 Setter 方法\n\n在 setter 中，会调用相应的检查函数，只有当检查未检测到约束违反时，才会设置属性。对于引用属性，我们允许使用对象引用或\
    \ ID 引用调用 setter。产生的歧义通过测试在调用 setter 时提供的参数是否为对象来解决。例如，publisher 的 setter 是按以下方式编写的：\n\
    \n```\nclass Book {\n  ..\n  set publisher(p) {\n    if (!p) // 取消 publisher\n\
    \      delete this._publisher;\n    } else {\n      // p 可以是 ID 引用或对象引用\n    \
    \  const publisher_id = typeof p==\"object\" ? p : p.name;\n      const validationResult\
    \ = Book.checkPublisher(publisher_id);\n      if (validationResult instanceof\
    \ NoConstraintViolation) {\n        // 创建新的 publisher引用\n        this._publisher\
    \ = Publisher.instances[publisher_id];\n      } else {\n        throw validationResult;\n\
    \      }\n    }\n  }\n}..\n```\n\n### 2.5.5 选择并实现删除策略\n\n对于任何引用属性，我们必须在 1.2 节中讨论的两种可能的删除策略中选择并实现一种，以便在属性范围类的\
    \ `destroy` 方法中管理相应的对象销毁依赖。在案例中，当删除 publisher 记录时，我们必须在以下之间选择：\n\n- 1. 删除由被删除出版社出版的书记录（生存依赖）；\n\
    - 2. 从所有由被删除出版社出版的书中删除对该出版社的引用（生存独立）。\n\n假设书籍在生存上不依赖其出版社，我们选择第二种方案。在下面的 `Publisher.destroy`\
    \ 方法代码中，对于所有相关的书籍对象，属性 `publisher.is` 被清空了：\n\n```\nPublisher.destroy = function\
    \ (name) {\n    const publisher = Publisher.instances[name];\n    // 在 book 对象中删除对此\
    \ publisher 的引用\n    for (let key of Object.keys(Book.instances)) {\n        const\
    \ book = Book.instances[key];\n        if (book.publisher === publisher) {\n \
    \           book.publisher = null; // 删除槽\n            console.log(\"Book \" +\
    \ book.isbn + \" updated.\");\n        }\n    }\n    // 删除 publisher 记录\n    delete\
    \ Publisher.instances[name];\n    console.log(\"Publisher \" + name + \" deleted.\"\
    );\n};\n```\n\n注意，对被删除出版社的所有引用的删除是通过对所有书籍进行顺序扫描完成的，当书籍很多时，这可能是无效的。如果每个 publisher\
    \ 对象都持有一个指向该出版社出版的所有书籍的列表，效率将会高得多。创建并维护列表将使书籍与其出版社之间的关联变为双向。\n\n### 2.5.6 序列化与对象到存储的映射\n\
    \n对于引用属性（如 `Book::publisher`），序列化函数 `Book::toString()` 必须显示被引用对象的可读标识符，例如此 `publisher.name`：\n\
    \n```\ntoString() {\n  var bookStr = `Book: ISBN: ${this.isbn}, title: ${this.title},`\
    \ +\n  `year: ${this.year}`;\n  if (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n\
    \  return bookStr;\n}\n```\n\n对象到存储的映射 `Book::toRecord()` 将带有对象引用的强类型 JS 对象（无类型）转换为带有\
    \ ID 引用的无类型记录对象：\n\n```\ntoRecord() {\n  var rec = {};\n  for (let p of Object.keys(this))\
    \ {\n    // 只拷贝带下划线前缀的属性\n    if (p.charAt(0) === \"_\") {\n      switch (p) {\n\
    \        case \"_publisher\":\n          // 将对象引用转换为 ID 引用\n          if (this._publisher)\
    \ rec.publisher_id = this._publisher.name;\n          break;\n        default:\n\
    \          // 下划线前缀\n          rec[p.substr(1)] = this[p];\n      }\n    }\n \
    \ }\n  return rec;\n}\n```\n\n从带有 ID 引用的无类型记录对象到相应的带有对象引用的类型对象的反转换由 Book 构造函数完成，它允许\
    \ ID 引用和对象引用作为设置引用属性的参数。\n\n## 2 编写视图与控制器\n\n用户界面（UI）包含一个起始页面 `index.html`，允许导航到数据管理\
    \ UI 页面，对应每个对象类型（在示例中为 `books.html` 和 `publishers.html`）。这些数据管理 UI 页面每个包含两个部分：管理部分（Manage\
    \ books），带有用于选择 CRUD 用例的菜单；以及每个 CRUD 用例的部分（如检索/列表书籍、创建书籍、更新书籍和删除书籍），确保任何时候只有一个显示（例如通过设置其他部分的\
    \ CSS 属性 `display:none`）。\n\n### 2.6.1 初始化应用\n\n为了初始化数据管理用例，必须从持久化存储加载所需数据（例如所有出版社和书籍记录）。这是通过控制器程序\
    \ `pl.c.books.manage.initialize` 在 `c/books.js` 中实现的，代码如下：\n\n```\npl.c.books.manage\
    \ = {\ninitialize: function () {\n  Publisher.retrieveAll();\n  Book.retrieveAll();\n\
    \  pl.v.books.manage.setUpInterface();\n  }\n};\n```\n\n管理书籍数据的初始化方法首先加载出版社和书籍表，因为书籍管理\
    \ UI 需要显示它们的数据。然后通过调用 `setUpInterface` 程序渲染书籍管理菜单。\n\n### 2.6.2 在检索/列表中显示关联对象\n\
    \n在我们的示例中，我们只有一个引用属性 `Book::publisher`，它是函数式的且可选的。为了在检索/列表用例中显示书籍的可选出版社信息，HTML\
    \ 表格中相应的单元格将填充该出版社的名称（如果存在的话）。\n"
