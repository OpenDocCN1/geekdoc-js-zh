    - 注意 Person 表包含四种不同类型的人：

    1. 个人，Harry Wagner，他是一个作者（带有简历）也是一名员工（带有员工编号）。

    2. 个人，Peter Boss，他是一个经理（员工的一种特殊类型），负责销售部。

    3. 个人，Tom Daniels，他既不是作者也不是员工。

