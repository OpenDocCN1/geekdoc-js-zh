  mdcn: "\n\n## 164 14 Java EE 中的子类型\n\n```java\n@Min(value=1459, message=\"年份不能早于\
    \ 1459 年!\")\nprivate Integer year;\n构造函数、set、get 以及其他方法\n```\n\n在对类层次结构使用 JPA\
    \ 单表继承（Single Table Inheritance）技术时，必须在父类上设置 `@Inheritance` 注解（例如我们示例中的 `Book`）。它为\
    \ `strategy` 参数提供了 `InheritanceType.SINGLE_TABLE` 值。`@DiscriminatorColumn` 注解指定了存储不同子类类型值（示例中为\
    \ `Textbook` 和 `Biography`）的列名。\n\n遗憾的是，我们无法使用 `BookCategoryEL` 枚举来定义区分器列的类型，因为像\
    \ `BookCategoryEL.TEXTBOOK.name()` 这样的 Java 不是常量，会导致抛出 Java 编译器异常。相反，我们使用 `DiscriminatorType.STRING`。`@DiscriminatorValue`\
    \ 注解指定了存储在代表给定类实例的行的区分器列中的唯一值。\n\n此外，我们定义了子类 `Textbook` 和 `Biography`：\n\n```java\n\
    @Entity(name=\"textbooks\")\n@DiscriminatorValue(value=\"TEXTBOOK\")\n@ManagedBean(name=\"\
    book\") @ViewScoped\npublic class Textbook extends Book (\n  @Column( nullable=false)\
    \ @NotNull(\n    message=\"需要学科领域值\")\n  String subjectArea;\n  构造函数、set、get 以及其他方法\n\
    )\n```\n\n`Textbook` 和 `Biography` 是 `Book` 的子类，因此我们使用 `extends` 来定义它们。对于每个子类，我们都添加了一个带有\
    \ `BookCategoryEL` 枚举中值的 `@DiscriminatorValue` 注解。\n\n## 14.2.4 STI 数据库模式\n\n\
    根据注解的结果：\n\n```java\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n```\n\
    \n## 14.2 案例研究 1：使用单表继承实现类层次结构\n\n仅使用一个数据库表来表示类层次结构。该表包含与层次结构中所有类的属性对应的列，加上区分器列。在我们的示例中，`books`\
    \ 包含以下列：isbn`、`title`、`year`、`subjectArea`、`about` 和 `category`。用于应用程序生成 `books`\
    \ 表的简化 SQL-DDL 代码所示：\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n  `ISBN`\
    \ varchar(10) NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n  `YEAR` int(11) NOT\
    \ NULL,\n  `SUBJECTAREA` varchar(255) DEFAULT NULL,\n  `ABOUT` varchar(255) DEFAULT\
    \ NULL,\n  `category` varchar(16) DEFAULT NULL\n)\n```\n\n## 14.2.5 编写视图和控制器代码\n\
    \n用户界面 (UI) 由一个允许导航到数据管理页面的页面组成（在示例中，位于 `WebContent/views/books/index.xhtml`）。此类数据管理页面包含四个部分：检索/列出所有书籍、创建书籍、更新书籍和删除书籍。\n\
    \n### 14.2.5.1 总结\n\n我们必须在“列出所有书籍”用例以及“创建书籍”和“更新书籍”用例中处理类别区分器和 `subjectArea` 分段属性：\n\
    \n- 1. 在 `WebContent/views/books/retrieveAndListAdapter.xhtml` 的“检索/列出所有”用例显示表中添加分段信息列（`Special\
    \ type`）。\n- 2. 在 `WebContent/views/books/create.xhtml` 和 `update.xhtml` 的“创建书籍”和“更新书籍”用例表单中，添加“特殊类型”选择控件以及所有分段属性的对应表单字段。分段属性字段仅在选择了相应的书籍类别后才会显示并进行验证。\n\
    \n### 14.2.5.2 在检索/列出所有中添加分段信息列\n\n我们在 `books.html` 的“列出所有书籍”用例显示表中添加一个“特殊类型”列：\n\
    \n```xml\n<h:dataTable value=\"#{bookController.books}\" var=\"b\">\n  <h:column>\n\
    \    <f:facet name=\"header\">Special type</f:facet>\n    #{b.getClass().getSimpleName()\
    \ != 'Book' ? b.getClass().getSimpleName() : ''}\n  </h:column>\n</h:dataTable>\n\
    ```\n\n使用条件表达式来检查 Java Bean 类名是否为 `Book`，如果是，则不显示；如果是其他类型（例如 `Textbook` 或 `Biography`），则显示出来。此表达式还展示了如何调用/各种\
    \ Java Bean 方法，而不仅仅是自定义方法。\n\n### 14.2.5.3 在创建和更新中添加“特殊类型”选择控件\n\n在用例中，我们需要通过\
    \ `panelGrid` 元素中的选择控件允许选择特殊类别的书籍（`textbook` 或 `biography`）：\n\n```xml\n<h:panelGrid\
    \ id=\"bookPanel\" columns=\"3\">\n  <h:outputText value=\"Special type: \" />\n\
    \  <h:selectOneMenu id=\"bookType\" value=\"#{viewScope.bookType}\">\n    <f:selectItem\
    \ label=\"--\" />\n    <f:selectItems value=\"#{book.items}\" />\n    <f:ajax\
    \ event=\"change\" execute=\"@this\" render=\"textBookPanel biographyBookPanel\"\
    />\n  </h:selectOneMenu>\n  <h:message for=\"bookType\" errorClass=\"error\" />\n\
    </h:panelGrid>\n```\n\n在选择控件中，引用了三个备用面板组：\n\n- 1. \"standardBookPanel\"：\n```xml\n\
    <h:panelGroup id=\"standardBookPanel\" rendered=\"#{viewScope.bookType == null}\"\
    >\n  <h:commandButton value=\"Create\" action=\"#{bookController.create}\" />\n\
    </h:panelGroup>\n```\n- 2. \"textBookPanel\"：\n```xml\n<h:panelGroup id=\"textBookPanel\"\
    \ rendered=\"#{viewScope.bookType == 'TEXTBOOK'}\">\n  <h:outputText value=\"\
    Subject area: \" />\n  <h:inputText id=\"subjectArea\" value=\"#{viewScope.subjectArea}\"\
    \ />\n  <h:commandButton value=\"Create\" action=\"#{bookController.create}\"\
    \ />\n</h:panelGroup>\n```\n- 3. \"biographyBookPanel\"：\n```xml\n<h:panelGroup\
    \ id=\"biographyBookPanel\" rendered=\"#{viewScope.bookType == 'BIOGRAPHY'}\"\
    >\n  <h:outputText value=\"About: \" />\n  <h:inputText id=\"about\" value=\"\
    #{viewScope.about}\" />\n  <h:commandButton value=\"Create\" action=\"#{bookController.create}\"\
    \ />\n</h:panelGroup>\n```\n\n"
