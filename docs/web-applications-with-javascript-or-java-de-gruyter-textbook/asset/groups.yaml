    \ : ConstraintViolation |\n| +toString(): String |\n| +... |\n\n# 9.2 Write the\
    \ Model\n\nThe Java Entity model can be directly coded for getting the model layer\
    \ code of our Java back-end app.\n\n# 9.2.1 New Issues\n\nCompared to the unidirectional\
