    - 2. 双向多对多关联被映射到参与关联的两个类中的每一对对互反多值引用属性。同样，在其中一个类中，代表（反向）关联的多值引用属性被指定为*派生属性*，每当另一个类（维护关联的地方）中的对应属性被更新时，它会自动更新。转换如图
