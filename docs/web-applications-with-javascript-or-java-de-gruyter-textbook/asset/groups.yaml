  mdcn: "\n\n## 9. 使用 Java EE 实现双向关联\n\n例如，对于多值引用属性 `Book::authors`，它与派生的反向引用属性 `Author::authoredBooks`\
    \ 耦合，以实现 Book 和 Author 之间的双向作者关系，其 `addAuthor` 方法的代码如下：\n\n```java\npublic class\
    \ Book {\n\n  public void addAuthor(Author author) {\n    if (this.authors ==\
    \ null) {\n      this.authors = new HashSet<Author>();\n    }\n    if (!this.authors.contains(author))\
    \ {\n      // 添加新的作者引用\n      this.authors.add(author);\n      // 添加派生的反向引用\n\
    \      author.addAuthoredBook(this);\n    }\n  }\n}\n```\n\n对于删除类 `removeAuthor`，我们得到以下代码：\n\
    \n```java\npublic class Book {\n\n  public void removeAuthor(Author author) {\n\
    \    if (this.authors != null && author != null &&\n        this.authors.contains(author))\
    \ {\n      // 删除作者引用\n      this.authors.remove(author);\n      // 删除派生的反向引用\n\
    \      author.removeAuthoredBook(this);\n    }\n  }\n}\n```\n\n记住，对于 Java 集合（如\
    \ Set 或 List），`contains` 方法通过使用对象的 `equals` 方法来比较两个对象。例如，在 `Author` 类中对 `Set<Author>`（如\
    \ `publishedBooks`）使用 `contains` 方法，我们实现了以下 `equals` 方法（如果两个作者的 `personId` 属性值相等，则它们相等）：\n\
    \n```java\npublic class Author {\n  ..\n  @Override\n  public boolean equals(Object\
    \ obj) {\n    if (obj instanceof Author) {\n      Author author = (Author) obj;\n\
    \      return (this.personId.equals(author.personId));\n    } else return false;\n\
    \  }\n}\n```\n\n### 9.2.6 处理删除依赖\n\n当一个 Book 实例 `b`（具有单个引用 `b.publisher` 指向 Publisher\
    \ 实例 `p` 以及多个引用 `b.authors` 指向 Author 实例）被删除时，必须先移除派生的反向引用（例如通过从 `p.publishedBooks`\
    \ 中移除 `b`）。这是通过在 `Book.delete` 方法中为单值和多值属性调用带有空参数的方法实现的，例如 `b.setPublisher(null)`\
    \ 和 `b.setAuthors(null)`：\n\n```java\npublic class Book {\n  ..\n  public static\
    \ void delete(EntityManager em,\n    UserTransaction ut, String isbn) throws Exception\
    \ {\n    ut.begin();\n    Book b = em.find(Book.class, isbn);\n    b.setPublisher(null);\n\
    \    b.setAuthors(null);\n    em.remove(b);\n    ut.commit();\n  }\n}\n```\n\n\
    同样，在删除 Publisher 或 Author 实例时，我们必须处理删除对 Book 实例的引用：\n\n```java\npublic class Author\
    \ {\n  public static void delete(EntityManager em,\n    UserTransaction ut, Integer\
    \ personId) throws Exception {\n    ut.begin();\n    Author a = em.find(Author.class,\
    \ personId);\n    a.setAuthoredBooks(null);\n    em.remove(a);\n    ut.commit();\n\
    \  }\n}\n```\n\n```java\npublic class Publisher {\n  public static void delete(EntityManager\
    \ em,\n    UserTransaction ut, String name) throws Exception {\n    ut.begin();\n\
    \    Publisher p = em.find(Publisher.class, name);\n    p.setAuthoredBooks(null);\n\
    \    em.remove(p);\n    ut.commit();\n  }\n}\n```\n\n### 9.2.7 实体管理器和缓存实体\n\n\
    遗憾的是，JPA 并不提供对派生反向引用的自动维护。根据 Java Persistence Wiki，我们必须通过 set/remove 方法来实现对派生的反向引用的维护：\n\
    \n> 双向关系中的一个常见问题是应用程序更新了关系的一侧，而另一侧没有更新，导致不同步。在 JPA 中（泛指在 Java 中），维护关系是应用程序或模型的责任。解决这个问题有两种方法：你既可以将关系维护代码添加到关系的一侧，并仅使用该侧的\
    \ setter（例如将另一侧保护），或者在双方都添加以避免无限循环。\n\n我们为每个类都使用了实体管理器。每个实体管理器都维护一组缓存实体，可以通过 `merge`\
    \ 方法与其他实体管理器“共享”。在我们的示例代码中，在每个类的创建和更新方法中，我们需要合并属于另一个管理器的实体。例如，在 `Book.create`\
    \ 方法中，我们需要合并由 `PublisherController` 实体管理器管理的书籍出版社，以及由 `AuthorController` 实体管理器管理的所有作者：\n\
    \n```java\npublic class Book {\n    public static void create(EntityManager em,\n\
    \        UserTransaction ut,\n        String isbn, String title, Integer year,\n\
    \        Publisher publisher, Set<Author> authors)\n        throws Exception {\n\
    \        ut.begin();\n        Book book = new Book(isbn, title, year,\n      \
    \      publisher, authors);\n        em.persist(book);\n        if (publisher\
    \ != null) {\n            em.merge(publisher);\n        }\n        if (authors\
    \ != null) {\n            for (Author a : authors) {\n                em.merge(a);\n\
    \            }\n        }\n        ut.commit();\n    }\n}\n```\n\n如果不使用 merge，出版社以及作者列表中的所有作者实例都不代表原始缓存实体的引用，并且不会保留它们的更改。更多详细信息请查阅相关的相关的\
    \ Java Persistence 文档。\n\n也可以禁用 JPA 缓存，使得每个新实例都从数据库重新加载实体，例如当调用 `EntityManager.find`\
    \ 方法时。这可以通过在 `persistence.xml` 文件中添加该行来实现：\n\n```xml\n<property name=\"ecliselink.cache.shared.default\"\
    \ value=\"false\"/>\n```\n\n上述配置适用于 ecliselink 实现，其他 API 实现可能有所不同。请注意，如果没有严重原因，不建议禁用实体缓存，因为这会降低应用程序的性能。\n\
    \n"
