- md: "# 13.3 Case Study 2: Implementing a Class Hierarchy\n\nWhenever a class hierarchy\
    \ is more complex, we cannot simply eliminate it, but have to implement it (1)\
    \ in the app's model code, (2) in the underlying database and (3) in its user\
    \ interface.\n\nThe starting point for our case study is the design model shown\
    \ in Figure 12.8 above. In the following sections, we derive a JS class model\
    \ and an JS entity model from the design model. The entity table model is used\
    \ as a design for the object-to-storage mapping that we need for storing the objects\
    \ of our app with the browsers; Local storage technology.\n\n## 13.3.1 Make a\
    \ JS Class Model\n\nWe design the model classes of our example app with the help\
    \ of a JS class model that we derive from the design model by essentially leaving\
    \ the generalization rows as we are just adding get/set methods and static check\
    \ functions to each class. However, in the case of our example app, it is natural\
    \ to apply the Class Hierarchy Merge design pattern (discussed in Section 12.6)\
    \ to the single-subclass segmentation of Employee for simplifying the class model\
    \ by eliminating the Manager subclass. This leads to the model shown in Figure\
    \ 13.2. Notice that a Person may be an Employee or Author or both.\n\n```\nPerson\n\
    <get/set> personid: Integer (id)\n<get/set> name: String\ncheckPerson(in id :\
    \ string) : ConstraintViolation\ncheckPersonAid(in id : string, in type) : ConstraintViolation\n\
    checkName(in n : string) : ConstraintViolation\n```\n\n```\nAuthor\n<get/set>\
    \ biography : string\ncheckBiography(in b : string) : ConstraintViolation\n```\n\
    \n| Employee | enumeration |\n| :--- | :--- |\n| <get/set> empNo[1] : number (unique)\
    \ | |\n| <get/set> category[0..1] : EmployeeCategoryEL | EmployeeCategoryEL |\n\
    | <get/set> department[0..1] : string | MANAGER |\n| checkEmpNo(in n : number)\
    \ : ConstraintViolation | |\n| checkCategory(in c : number) : ConstraintViolation\
    \ | |\n| checkDepartment(in d : string) : ConstraintViolation | |\n\nFigure 13.2:\
    \ The JS class model of the Person roles class hierarchy.\n\n## 13.3.2 Make a\
    \ JS Entity Table Model\n\nSince we use the browsers' Local Storage as the persistent\
    \ storage technology for our example app, we have to deal with simple key-value\
    \ storage. For each design model class with a singular (capitalized) name Entity,\
    \ we use its pluralized lowercase name entities as the corresponding name and\
    \ as a key that its associated string value is obtained by serializing the object\
    \ collection Entity.instances with the help of the JSON.stringify method.\n\n\
    We design a set of suitable JS entity tables in the form of a JS entity table\
    \ model that we derive from the information design model. We have to make certain\
    \ choices how to organize our data and how to derive a corresponding entity table\
    \ model.\n\nThe first choice to make concerns therein using the Single Table Inheritance\
    \ (STI), the Table per Class Inheritance (TCI) or the Joined Tables Inheritance\
    \ (JTI) approach, which are introduced in Section 12.7.4. In the STI approach,\
    \ a segmentation (or an entire hierarchy) is represented with a single table,\
    \ containing columns for all attributes of all classes involved, and as shown\
    \ in the example model of Figure 13.3.\n\n| « entity table » | category: |\n|\
    \ :--- | :--- |\n| people | 1 = Author |\n| personid[1] : number pkey | 2 = Employee\
    \ |\n| name[1] : string | |\n| categories[1] : number (1,2,3) | 3 = Employee &\
    \ Manager |\n| biography[0] : string | |\n| empno[0] : number (unique) | |\n|\
    \ department[0] : string | |\n\nFigure 13.3: An STI model of the Person roles\
    \ class hierarchy.\n\nSince the given segmentation is non-disjoint, a multi-valued\
    \ enumeration attribute categories is used for representing the information to\
    \ which subclasses an belongs.\n\nUsing the STI approach is feasil for the given\
    \ example, since the role hierarchy does not have many levels and the segment\
    \ subclasses do not add attributes. But, in a more realistic example, we would\
    \ have more attributes in the segment subclasses of the given role hierarchy.\
    \ The STI approach is not really an option for representing a multi-level role\
    \ hierarchy. However, we may choose it for representing the single-segment class\
    \ hierarchy Manager-is-subclass-of-Employee.\n\nFor simplicity, and because the\
    \ browsers' Local Storage does not support foreign keys as required by JTI, we\
    \ choose the TCI approach, where we obtain a rateable for each class of the Person\
    \ segmentation, but without foreign keys. Our choices result in the model shown\
    \ in Figure 13.4 below, which has been derived from the design model shown in\
    \ Figure 12.8 by:\n\n1. Merging the Manager subclass into its superclass Employee,\
    \ according to the Class Hierarchy design pattern described in Section 12.6.\n\
    2. Replacing the standard ID property modifier {id} of the personId attribute\
    \ of Person, Author and Employee with {pkey} for indicating that the attribute\
    \ is a primary key.\n3. Replacing the singular (capitalized) class names (Person,\
    \ Author and Employee) with pluralized lowercase table names (people, authors\
    \ and employees).\n4. Adding the {JS entity table> stereotype to all class rectangles\
    \ (people, authors and employees).\n5. Replacing the platform-independent datatype\
    \ names with JS datatype names.\n6. Dropping all generalization arrows and adding\
    \ all attributes of supertables (personId and name) to subtables.\n\n| <JS entity\
    \ table> | |\n| :--- | :--- |\n| people | personid : number pkey |\n| | name :\
    \ string |\n\n| <JS entity table> | |\n| :--- | :--- |\n| authors | personid :\
    \ number pkey |\n| | name : string |\n| | biography : string |\n\n| <JS entity\
    \ table> | |\n| :--- | :--- |\n| employees | personid : number pkey |\n| | name\
    \ : string |\n| | empno[1]: number (unique) |\n| | category[0..1]: number |\n\
    | | department[0..1]: string |\n| category: | Manager |\n\nFigure 13.4: A TCI\
    \ of the Person roles hierarchy.\n\nIn the case of JTI approach, in addition to\
    \ the steps 1–5 above, we would:\n\n1. Copy the primary key column (personId)\
    \ of the root table (people) to subtables (authors and employees).\n2. Replace\
    \ the generalization arrows with «fkey» stereotyped arrows (representing foreign\
    \ key dependencies) that are annotated at their source end with the name of subtable's\
    \ primary key (here: personId).\n\n## 13.3.3 New Issues\n\nCompared to the model\
    \ of our first case study, in Figure 13.1 above, we have to deal with a number\
    \ of new issues in the model code:\n\n1. Defining the subclass relationships between\
    \ Employee and Person, as well as between Author and Person, using the JS extends\
    \ discussed in Section 13.1.\n2. When loading the instances of the root class\
    \ (Person.instances) from persistent storage (Person.retrieve), we load (1) the\
    \ records of the table representing the root class (people) for creating its direct\
    \ instances and (2) also the records of all other tables representing its subclasses\
    \ (authors and employees) for creating their direct instances, also adding their\
    \ object references to the root class population (to Person.instances). In this\
    \ way, the root class population does not only contain direct instances, but all\
    \ instances.\n3. When saving the instances of Employee and Author as records of\
    \ the JS entity employees and to persistent storage in Employee.saveAll and Author.saveAll\
    \ (invoked in p.v.employees.manage and p.v.authors.manage), we also save the direct\
    \ instances of Person as records of the table.\n\n## 13.3.4 Code Model Classes\
    \ of the JS Class Model\n\nThe JS class model shown in Figure 13.2 above can be\
    \ directly coded for getting the code of the model classes Person, Employee and\
    \ Author as well as for the enumeration type EmployeeCategoryEL.\n\n### 13.3.4.1\
    \ Defining Subtype Relationships\n\nWe define the subtype relationships between\
    \ Employee and Person, as well as between Author and Person, with extends. For\
    \ instance, in m/Employee.js we define:\n\nEmployeeCategoryEL = new Enumeration([\"\
    Manager\"]);\n\n```\nclass Employee extends Person {\n  constructor(({personId,\
    \ name, empNo, category, department}) {\n    super({personId, name});\n    this.empNo\
    \ = empNo;\n    if (category) this.category = category;\n    if (department) this.department\
    \ = department;\n  }\n}\n```\n"
  mdcn: "\n# 13.3 案例研究 2：实现类层次结构\n\n当类层次结构变得复杂时，我们无法简单地将其消除，而必须在 (1) 应用的模型代码中、(2)\
    \ 底层数据库以及 (3) 用户界面中实现它。\n\n我们案例研究的起点是上方图 12.8 所示的设计模型。在接下来的章节中，我们从设计模型推导出一个 JS\
    \ 类模型和一个 JS 实体模型。实体表模型被用于对象到存储映射的设计，我们需要通过浏览器的本地存储（Local storage）技术来存储应用中的对象实例。\n\
    \n## 13.3.1 创建 JS 类模型\n\n我们通过从设计模型推导出的 JS 类模型来设计示例应用的模型类。推导过程中，我们本质上是保留了泛化行，仅为每个类添加了\
    \ get/set 方法和静态检查函数。然而，在我们的示例应用中，自然地将类层次结构合并设计模式（在 12.6 节讨论）应用于 `Employee` 的单子子类划分，通过消除\
    \ `Manager` 子类来简化类模型。这导致了图 13.2 所示的模型。注意，`Person` 可能是 `Employee`、`Author` 或两者皆是。\n\
    \n```\nPerson\n<get/set> personid: Integer (id)\n<get/set> name: String\ncheckPerson(in\
    \ id : string) : ConstraintViolation\ncheckPersonAid(in id : string, in type)\
    \ : ConstraintViolation\ncheckName(in n : string) : ConstraintViolation\n```\n\
    \n```\nAuthor\n<get/set> biography : string\ncheckBiography(in b : string) : ConstraintViolation\n\
    ```\n\n| Employee | enumeration |\n| :--- | :--- |\n| <get/set> empNo[1] : number\
    \ (unique) | |\n| <get/set> category[0..1] : EmployeeCategoryEL | EmployeeCategoryEL\
    \ |\n| <get/set> department[0..1] : string | MANAGER |\n| checkEmpNo(in n : number)\
    \ : ConstraintViolation | |\n| checkCategory(in c : number) : ConstraintViolation\
    \ | |\n| checkDepartment(in d : string) : ConstraintViolation | |\n\n图 13.2：Person\
    \ 角色类层次结构的 JS 类模型。\n\n## 13.3.2 创建 JS 实体表模型\n\n由于我们使用浏览器的本地存储（Local Storage）作为示例应用的持久化存储技术，我们必须处理简单的键值存储。对于每个以大写单数\
    \ `Entity` 命名的模型类，我们使用其复数小写名称 `entities` 作为对应名称，并通过 `JSON.stringify` 方法对对象集合 `Entity.instances`\
    \ 进行序列化作为获取其关联字符串值的键。\n\n我们从信息设计模型推导出来，以 JS 实体表模型的形式设计了一系列合适的 JS 实体表。我们必须就如何组织数据以及如何推导出相应的实体表模型做出某些选择。\n\
    \n第一个选择涉及使用单表继承（STI）、按类表继承（TCI）或连接表继承（JTI）方法，这些方法在 12.7.4 节中介绍。在 STI 方法中，一个划分（或整个层次结构）由单张表表示，该表包含所有相关类的所有属性的列，如图\
    \ 13.3 的示例模型所示。\n\n| « entity table » | category: |\n| :--- | :--- |\n| people\
    \ | 1 = Author |\n| personid[1] : number pkey | 2 = Employee |\n| name[1] : string\
    \ | |\n| categories[1] : number (1,2,3) | 3 = Employee & Manager |\n| biography[0]\
    \ : string | |\n| empno[0] : number (unique) | |\n| department[0] : string | |\n\
    \n图 13.3：Person 角色类层次结构的 STI 模型。\n\n由于给定的划分是非不交的，因此使用多值枚举属性 `categories` 来表示子类属于哪些信息信息。\n\
    \n对于给定的示例，使用 STI 方法是可行的，因为角色层次结构没有很多层级，且划分子类没有增加属性。但在更真实的示例中，给定角色层次结构的划分子类中将会有更多属性。STI\
    \ 方法并不是表示多层级角色层次结构的理想选择。然而，我们可以选择它来表示 `Manager-is-subclass-of-Employee` 这种单划分类层次结构。\n\
    \n为了简单起见，并且因为浏览器的本地存储不支持 JTI 所的外键，我们选择了 TCI 方法，即为 `Person` 划分的每个类获取一个可排序的表，但不使用外键。我们的选择导致了下方图\
    \ 13.4 所示的模型，该模型由图 12.8 所示的设计模型推导出：\n\n1. 根据 12.6 节描述的类层次结构设计模式，将 `Manager` 子类合并到其父类\
    \ `Employee` 中。\n2. 将 `Person`、`Author` 和 `Employee` 的 `personId` 属性的标准 ID 修饰符\
    \ `{id}` 替换为 `{pkey}`，以指示该属性为主键。\n3. 将单数大写类名（`Person`, `Author`, `Employee`）替换为复数小写表名（`people`,\
    \ `authors`, `employees`）。\n4. 为所有类矩形（people, authors 和 employees）添加 `{JS entity\
    \ table>` 标记。\n5. 将平台无关的数据类型名称替换为 JS 数据类型名称。\n6. 去掉所有泛化箭头，并将父表的所有属性（`personId`\
    \ 和 `name`）添加到子表中。\n\n| <JS entity table> | |\n| :--- | :--- |\n| people | personid\
    \ : number |\n| | name : string |\n\n| <JS entity table> | |\n| :--- | :--- |\n\
    | authors | personid : number |\n| | name : string |\n| | biography : string |\n\
    \n| <JS entity table> | |\n| :--- | :--- |\n| employees | personid : number |\n\
    | | name : string |\n| | empno[1]: number (unique) |\n| | category[0..1]: number\
    \ |\n| | department[0..1]: string |\n\n图 13.4：角色层次结构的 TCI。\n\n在 JTI 方法的情况下，除了上述步骤\
    \ 1-5 外，我们还将：\n\n1. 将根表（people）的主键列（personId）复制到子表中。\n2. 将泛化箭头替换为带有 «fkey»标记的箭头（表示外键依赖），并在源端标注子表的主键（此处为\
    \ personId）。\n\n## 13.3.3 新问题\n\n与上方 13.1 所示的第一个案例模型相比，我们必须在模型代码中处理一些新问题：\n\n\
    1. 使用 13.1 节讨论的 JS `extends` 定义 `Employee` 与 `Person` 以及 `Author` 与 `Person` 之间的子类关系。\n\
    2. 从持久化存储加载根类实例（Person.instances）时，我们加载 (1) 表示根类的表（people）的记录以创建直接实例，(2) 同时加载其所有子类的表（authors\
    \ 和 employees）的记录以创建它们的直接实例，并将它们的对象引用添加到根类集合（Person.instances）。这样，根类集合不仅包含直接实例，还包含所有实例。\n\
    3. 当 `Employee` 和 `Author` 实例作为 JS 实体 employees 和 authors 的记录并在 Employee.saveAll\
    \ 和 Author.saveAll 中保存到持久化存储中时（在 p.v.employees.manage 和 p.v.authors.manage 中调用），我们也将\
    \ Person 的直接实例保存为记录。\n\n## 13.3.4 JS 类模型的代码类\n\n图 13.2 所示的 JS 类模型可以直接编码，以获取 `Person`、`Employee`\
    \ 和 `Author` 模型类的代码以及枚举类型 `EmployeeCategoryEL` 的代码。\n\n### 13.3.4.1 定义子类型关系\n\n\
    我们通过 `extends` 定义 `Employee` 与 `Person` 以及 `Author` 与 `Person` 之间的子类型关系。例如，在 `m/Employee.js`\
    \ 中定义：\n\nEmployeeCategoryEL = new Enumeration([\"Manager\"]);\n\n```\nclass Employee\
    \ extends Person {\n  constructor(({personId, name, empNo, category, department})\
    \ {\n    super({personId, name});\n    this.empNo = empNo;\n    if (category)\
    \ this.category = category;\n    if (department) this.department = department;\n\
    \  }\n}\n```\n"
