- md: "\n## 13.3.4.2 Loading the Instances of the Root Class Person\n\nWhen retrieving\
    \ the instances of a class hierarchy’s root class (in our example, Person) from\
    \ a persistent data store organized according to the TCI approach, we have to\
    \ retrieve not only its direct instances from the table representing the root\
    \ class (people), but also all indirect instances from all tables representing\
    \ its sub-classes (employees and authors), as shown in the following code:\n\n\
    ```javascript\nPerson.retrieve = function () {\n  var people=(), employees={},\
    \ authors={};\n  if (!localStorage[\"authors\"]) localStorage[\"authors\"] = \"\
    {}\";\n  if (!localStorage[\"employees\"]) localStorage[\"employees\"] = \"{}\"\
    ;\n  if (!localStorage[\"people\"]) localStorage[\"people\"] = \"{}\";\n  try\
    \ {\n    people = JSON.parse(localStorage[\"people\"]);\n    employees = JSON.parse(localStorage[\"\
    employees\"]);\n    authors = JSON.parse(localStorage[\"authors\"]);\n  } catch\
    \ (e) {\n    console.log(\"Error when retrieving from LocalStorage\\n\" + e);\n\
    \  }\n  for (let key of Object.keys(authors)) {\n    try { // convert record to\
    \ (typed) object\n      Author.instances[key]=new Author(authors[key]);\n    \
    \  // create superclass extension\n      Person.instances[key] = Author.instances[key];\n\
    \    } catch (e) {\n      console.log(`${e.constructor.name} while deserializing`\
    \ + `author ${key}: ${e.message}`);\n    }\n  }\n}\n```\n\nEach record of the\
    \ authors table is retrieved and converted to an Author object, a reference to\
    \ it is copied. Also the records of the employees table are processed in this\
    \ way, while the records of the people table are simply retrieved and converted\
    \ to Person objects:\n\n```javascript\nPerson.retrieveAll = function () {\n  ..\n\
    \  for (let key of Object.keys(employees)) {\n}\nfor (let key of Object.keys(people))\
    \ {\n  try { // convert record to (typed) object\n    Person.instances[key] =\
    \ new Person(people[key]);\n  } catch (e) {\n    console.log(`${e.constructor.name}\
    \ while deserializing ${key}: ${e.message}`);\n  }\n}\n}\n```\n\n## 13.3.4.3 Saving\
    \ the Supertable when Saving a Subtable\n\nSince the app's data is kept in main\
    \ memory as long as the app is running (which is as long as the app's webpage\
    \ is kept open in the browser), the data has to be saved to persistent storage\
    \ when the app is exited (e.g., by closing its browser tab). When saving the instances\
    \ of Employee and Author to persistent storage in pl.v.employees.manage.exit and\
    \ pl.v.authors.manage.exit, we also save the direct instances of Person (as records\
    \ of the people table). This is necessary because changes to Employee or Author-instances\
    \ may imply changes of Person.instances.\n\nFor instance, for Employee data management,\
    \ we define in v/employees.js:\n\n```javascript\npl.v.employees.manage = {\n \
    \ exit: function () {\n    Employee.saveAll();\n    Person.saveAll();\n  },\n\
    ..}\n```\n\n## 14 Subtyping with Java EE\n\nIn this chapter, we explain two case\
    \ studies based on fragments of the information model of our running example,\
    \ the Public Library app. In the first case study, we consider the single-level\
    \ class hierarchy with root Book shown in Figure 12.1, which is an incomplete\
    \ disjoint segmentation. We use the Single Table Inheritance approach for mapping\
    \ this class hierarchy to a single database table.\n\nIn the second case study,\
    \ we consider the multi-level class hierarchy consisting of the Joined Person\
    \ roles Employee, Manager and Author, shown in Figure 12.8. We use the Joined\
    \ Table Inheritance approach for mapping this class hierarchy to a set of database\
    \ tables that are related with each other via foreign key dependencies.\n\nIn\
    \ both cases we showed how:\n\n- 1. how to derive a Java Entity class model,\n\
    - 2. how to code the Java Entity class model in the form of Java Entity classes,\n\
    - 3. how to write the view and controller code based on the model code.\n\n##\
    \ 14.1 Subtyping in Java\n\nJava provides built-in support for subtyping with\
    \ its extends keyword, but it does not support multiple inheritance. Consider\
    \ the following information design model:\n\n| Person |\n| :--- |\n| firstName\
    \ : String |\n| lastName : String |\n| Student |\n| studNo : Integer |\n\nFirst,\
    \ we define the superclass Person. Then, we define the subclass Student and its\
    \ subtype relationship to Person by means of the extends keyword:\n\n```java\n\
    public class Person {\n    private String firstName;\n    private String lastName;\n\
    \    ...\n}\npublic class Student extends Person {\n    private int studentNo;\n\
    ```\n\n## 14.2 Case Study 1: Implement a Class Hierarchy with Single Inheritance\n\
    \n```java\npublic Student( String first, String last, int studNo) {\n    super(firstName,\
    \ lastName);\n    this.setStudNo(studNo);\n}\n```\n\nNote that in the Student\
    \ class, we define a constructor with all the parameters required to create an\
    \ instance of Student. In this subclass constructor we use super to invoke the\
    \ constructor of the superclass Person.\n\n## 14.2 Case Study 1: Implement a Class\
    \ Hierarchy with Single Table Inheritance\n\nIn this example we implement the\
    \ Book hierarchy shown in Figure 12.1.\n\n### 14.2.1 The Java Entity Class\n\n\
    Recall that the Java Entity class is derived from the model by:\n- (1) making\
    \ properties private,\n- (2) using Java classes,\n- (3) adding public getters\
    \ and setters,\n- (4) adding a toString() function,\n- (5) adding create, update,\
    \ and delete methods.\n\n### 14.2.2 New Issues\n\nWe have to deal with the number\
    \ of issues:\n\n- 1. Coding the enumeration type (BookCategoryEL) used in facelets.\n\
    - 2. Coding the model classes using suitable JPA annotations:\n  - In the UI code\
    \ we have to care of:\n    - 1. The select control for choosing the category.\n\
    \    - 2. The specific fields only when certain conditions are met.\n\n![Figure\
    \ 14.1: The Entity class model of the hierarchy.](img_178_0.png)\n![1.](img_178_1.png)\n\
    ![2.](img_178_2.png)\n![3.1.](img_178_3.png)\n\nFigure 14.1: The Entity class\
    \ model of the Book hierarchy.\n\n### 14.2.3 The Classes of the Java Entity\n\n\
    The Java Entity class model can be directly coded for getting the model classes\
    \ of our Java EE back-end app.\n"
  mdcn: "\n\n## 13.3.4.2 加载根类 Person 的实例\n\n当从按照 TCI 方案组织的持久化数据存储中检索类层次结构根类（在我们的示例中为\
    \ Person）的实例时，我们不仅需要从表示根类的表（people）中检索其直接实例，还需要从表示其子类的所有表（employees 和 authors）中检索所有间接实例，如下面的代码所示：\n\
    \n```javascript\nPerson.retrieve = function () {\n  var people=(), employees={},\
    \ authors={};\n  if (!localStorage[\"authors\"]) localStorage[\"authors\"] = \"\
    {}\";\n  if (!localStorage[\"employees\"]) localStorage[\"employees\"] = \"{}\"\
    ;\n  if (!localStorage[\"people\"]) localStorage[\"people\"] = \"{}\";\n  try\
    \ {\n    people = JSON.parse(localStorage[\"people\"]);\n    employees = JSON.parse(localStorage[\"\
    employees\"]);\n    authors = JSON.parse(localStorage[\"authors\"]);\n  } catch\
    \ (e) {\n    console.log(\"Error when retrieving from LocalStorage\\n\" + e);\n\
    \  }\n  for (let key of Object.keys(authors)) {\n    try { // convert record to\
    \ (typed) object\n      Author.instances[key]=new Author(authors[key]);\n    \
    \  // create superclass extension\n      Person.instances[key] = Author.instances[key];\n\
    \    } catch (e) {\n      console.log(`${e.constructor.name} while deserializing`\
    \ + `author ${key}: ${e.message}`);\n    }\n  }\n}\n```\n\nauthors 表中的每条记录都被检索并转换为\
    \ Author 对象，并复制其引用。同样，employees 表的记录也以这种方式处理，而 people 表的记录则被被检索并转换为 Person 对象：\n\
    \n```javascript\nPerson.retrieveAll = function () {\n  ..\n  for (let key of Object.keys(employees))\
    \ {\n}\nfor (let key of Object.keys(people)) {\n  try { // convert record to (typed)\
    \ object\n    Person.instances[key] = new Person(people[key]);\n  } catch (e)\
    \ {\n    console.log(`${e.constructor.name} while deserializing ${key}: ${e.message}`);\n\
    \  }\n}\n}\n```\n\n## 13.3.4.3 在保存子表时保存主表\n\n由于应用在运行期间数据一直保存在主内存中（只要应用在浏览器中的网页就保持打开状态），因此在应用退出时（例如关闭浏览器标签页），必须将数据保存到持久化存储中。在\
    \ pl.v.employees.manage.exit 和 pl.v.authors.manage.exit 中将 Employee 和 Author 的实例保存到持久化存储时，我们还需要保存\
    \ Person 的直接实例（作为 people 表的记录）。这是必要的，因为对 Employee 或 Author 实例的更改可能意味着 Person.instances\
    \ 的变化。\n\n例如，对于 Employee 数据管理，我们在 v/employees.js 中定义了：\n\n```javascript\npl.v.employees.manage\
    \ = {\n  exit: function () {\n    Employee.saveAll();\n    Person.saveAll();\n\
    \  },\n..}\n```\n\n## 14 使用 Java EE 实现子类型\n\n在本章中，我们将基于运行示例——公共图书馆应用（Public Library\
    \ app）的模型片段，解释两个案例研究。在第一个案例研究中，我们考虑了图 12.1 所示的以 Book 为根类的单级类层次结构，这是一个不完全的不交分段。我们使用单表继承（Single\
    \ Table Inheritance）方法将此类层次结构映射到单个数据库表。\n\n在第二个案例研究中，我们考虑了图 12.8 所示的由连接 Person\
    \ 角色 Employee、Manager 和 Author 组成的多级类层次结构。我们使用连接表继承（Joined Table Inheritance）方法将此类层次结构映射到一组通过外键依赖相互关联的数据库表。\n\
    \n在两种情况下，我们都展示了如何：\n\n- 1. 如何推导出 Java 实体类模型，\n- 2. 如何以 Java 实体类的形式编写 Java 实体类模型，\n\
    - 3. 如何基于模型代码编写视图和控制器代码。\n\n## 14.1 Java 中的子类型\n\nJava 通过其 `extends` 关键字提供了子类型的内置支持，但它不支持多继承。考虑以下信息设计模型：\n\
    \n| Person |\n| :--- |\n| firstName : String |\n| lastName : String |\n| Student\
    \ |\n| studNo : Integer |\n\n首先，我们定义父类 Person。然后，我们通过 `extends` 关键字定义子类 Student\
    \ 及其与 Person 的子类型关系：\n\n```java\npublic class Person {\n    private String firstName;\n\
    \    private String lastName;\n    ...\n}\npublic class Student extends Person\
    \ {\n    private int studentNo;\n```\n\n## 14.2 案例研究 1：用单继承实现类层次结构\n\n```java\n\
    public Student( String first, String last, int studNo) {\n    super(firstName,\
    \ lastName);\n    this.setStudNo(studNo);\n}\n```\n\n注意，在 Student 类中，我们定义了一个带有创建\
    \ Student 实例所需参数的构造函数。在子类构造函数中，我们使用 `super` 调用父类 Person 的构造函数。\n\n## 14.2 案例研究\
    \ 1：用单继承实现类层次结构\n\n在这个示例中，我们实现了图 12.1 所示的 Book 层次结构。\n\n### 14.2.1 Java 实体类\n\n\
    回想 Java 实体类是通过以下方式从模型派出的：\n- (1) 将属性私有化，\n- (2) 使用 Java 类，\n- (3) 添加公共 getter\
    \ 和 setter，\n- (4) 添加 `toString()` 函数，\n- (5) 添加创建、更新和删除方法。\n\n### 14.2.2 新问题\n\
    \n我们需要处理许多新问题：\n\n- 1. 编写 facelets 中使用的枚举类型（BookCategoryEL）。\n- 2. 使用适当的 JPA 注解对模型类\n\
    \  - 在 UI 代码中，我们需要考虑：\n    - 1. 选择类别的控件。\n    - 2. 仅满足特定条件时的特定字段。\n\n![图 14.1：层次结构的实体类模型](img_178_0.png)\n\
    ![1.](img_178_1.png)\n![2.](img_178_2.png)\n![3.1.](img_178_3.png)\n\n图 14.1：Book\
    \ 层次结构的实体类模型。\n\n### 14.2.3 Java 实体的类\n\n可以直接编写 Java 实体类模型，以获取我们 Java EE 后端应用的模型类。\n\
    \n"
