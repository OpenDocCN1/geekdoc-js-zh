    \nA standard DBMS stores information (objects) in the rows of tables, which have\
    \ been conceived as set-theoretic relations in relational database systems. The\
    \ relational database language SQL is used for defining, populating, updating\
    \ and querying such databases. But there are also simpler storage techniques that\
    \ allow to store data in the form of table, but do not support SQL. In particular,\
    \ key-value storage systems, such as JavaScript's Local Storage API, allow storing\
    \ serialization of a JS entity (a map of entity records) as the string value associated\
    \ with the table as a key.\n\nWhile the classical version of SQL (SQL92) there\
    \ is no support for subtyping and inheritance, this has been changed in SQL99.\
    \ However, the subtyping-related language elements of SQL99 have only been implemented\
    \ in some DBMS, for the open source DBMS PostgreSQL. As a consequence, for making\
    \ a design model that can be implemented with various frameworks using SQL DBMS\
    \ (including weaker technologies such as MySQL and SQLite), we cannot use the\n\
    \nSQL99 features for subtyping, but have to model inheritance hierarchies in database\
    \ design models by means of plain tables and foreign key dependencies. This mapping\
    \ class hierarchies to relational tables (and back) is the business of Object-Relational-Mapping\
    \ frameworks such as JPA Providers (like Hibernate), Microsoft's Entity Framework,\
    \ or the Active Record approach of the Rails framework.\n\nThere are essentially\
    \ three alternative approaches how to represent a class hierarchy with database\
    \ tables:\n\n- 1. **Single Table Inheritance (STI)** is the simplest approach,\
    \ where the entire class hierarchy is represented by a single table, containing\
    \ columns for all attributes of the root class and all of its subclasses, and\
    \ after the name of the root class.\n- 2. **Table per Class Inheritance (TCI)**\
    \ is an approach, where each of the class hierarchy is represented by a corresponding\
    \ table containing also columns for inherited properties, repeating the columns\
    \ of the table that represents its superclasses.\n\nNotice that the STI approach\
    \ is closely related to the Class Hierarchy Merge design pattern discussed in\
    \ Section 12.6 above. When this design pattern has already been applied in the\
    \ design model, or the design model has already been refactored according to this\
    \ design pattern, the class hierarchies concerned (their subclasses) have been\
    \ eliminated in the design, and consequently also in the data model to be coded\
    \ in the form of class definitions in the app's model layer, so there is no anymore\
    \ to map class to single tables. Otherwise, the design model contains a class\
    \ hierarchy that is implemented with a corresponding class hierarchy in the app's\
    \ model layer, which would be mapped to database tables with the help of the STI\
    \ approach.\n\nWe illustrate the use of these approaches with the help of two\
    \ simple examples. The first example is the Book class hierarchy, which is shown\
    \ in Figure 12.1 above. The second example is the class hierarchy of the Person\
    \ roles Employee, Manager and Author, shown in the class diagram in Figure 12.8\
    \ below.\n\n### 12.7.4.1 Single Table Inheritance\n\nConsider the single-level\
    \ class hierarchy shown in Figure 12.1 above, which is an incomplete disjoint\
    \ segmentation of the class Book, as the design for the model classes of an MVC\
    \ app. In such a case, whenever we have a model hierarchy with only one level\
    \ (or only a few levels) of subtyping and each subtype has only a few additional\
    \ properties, is preferable to use STI, so we model a single table containing\
    \ for all attributes such that the columns representing additional attributes\
    \ of segment subclasses (“segment attributes”) are optional, as shown in the SQL\
    \ table model in Figure 12.9.\n\n| Person |\n| :--- |\n| personid : Integer (id)\
    \ |\n| name : String |\n| Employee | Author |\n| empNo : integer (key) | biography\
    \ : String |\n| Manager | |\n| department : String | |\n\n**Figure 12.8:** An\
    \ information design model with a Person roles hierarchy.\n\n```\n«SQL table»\n\
    isbn[1] : VARCHAR (pkey)\ntitle[1] : VARCHAR\nyear[1] : INTEGER\ncategory[0..1]\
    \ : \"TextBook\",\"Biography\" (frozen)\nsubject_area[0..1] : VARCHAR\nabout[0..1]\
    \ : VARCHAR\n```\n\n```\n«invariant»\n{(category=\"TextBook\" IFF subject_area\
    \ IS NOT NULL)\n(category=\"Biography\" IFF about IS NOT NULL)}\n```\n\n**Figure\
    \ 12.9:** An SQL table representing the Book hierarchy.\n\nIt is a common approach\
    \ to add a special discriminator column for representing the category of each\
    \ row corresponding to the subclass. A column would normally be string-valued,\
    \ but constrained to one of the names of the subclasses. The DBMS supports enumerations,\
