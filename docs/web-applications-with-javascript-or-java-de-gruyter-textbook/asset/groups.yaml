    \ `const` 的块作用域变量声明新功能允许具有更细粒度作用域局部变量，这有助于避免意外的变量重复并使代码更加模块化。\n\n`let` 和 `const`\
    \ 之间只有一个意义上的区别。用 `const` 声明的变量是冻结或不可变的，从这个意义上说是常量，而 `let` 变量不是。对于所有不应改变值的变量，最好使用\
    \ `const`。否则，或者如果不明确，如果是块作用域变量，则应该用 `let` 声明；如果是全局或函数作用域变量，则用 `var` 声明。\n\n###\
