    \ to which subclass belongs.., if it is non-disjoint, a multi-valued enumeration\
    \ category is used for representing the information to which subclasses belongs.\
    \ Such an attribute can be implemented in SQL by defining a string-valued column\
    \ for a set of enumeration codes or labels as corresponding string concatenations.\n\
    \nBased on the category of a book, since textbook-biography segmentation is rigid,\
    \ we have to enforce that if and only if it is “TextBook”, its attribute subjectArea\
    \ has a value, and if only if it is “Biography”, its attribute about has a value.\
    \ This implied constraint is expressed in the invariant attached to the Book table\
    \ class in the class diagram above, where the logical operator keyword “IFF” represents\
    \ the logical operator “if and only if”. It needs to be implemented in the database,\
    \ e.g., with an SQL CHECK clause or with SQL triggers.\n\nConsider the class hierarchy\
