    当派生的反向引用属性是多值的，而其反向基属性是单值的时（例如图 7.4 所示的 `Publisher::publishedBooks` 是由 `Book::publisher`
    派生的），其生命周期依赖关系意味着：

    1. 每当创建一个“基对象”（如书籍）时，都需要更新对应的反向属性，即在其值中添加指向新基对象的引用（即向 `Publisher::publishedBooks`
    中添加指向新书籍的引用）；

    2. 每当基属性发生更新时（例如为书籍分配了新的出版商），对应的反向属性（在我们的示例中为 `Publisher::publishedBooks`）也必须进行更新，即从其值中移除旧引用并添加新引用；

    3. 每当一个基对象（如书籍）被销毁时，必须更新对应的反向属性，即从其值中移除该基对象（例如从 `Publisher::publishedBooks` 中移除指向待删除书籍的引用）。


    注意，从纯计算的角度来看，我们可以自由地选择两个互反的引用属性之一（如 `Book::authors` 和 `Author::authoredBooks`）作为主属性。然而，在许多情况下，关联代表了不对称的本体论存在，这决定了两个互反引用属性中哪一个是主。例如，`Book`
    类和 `Author` 类之间的作者关联代表了书籍对其作者的本体论依赖。书籍在存在上依赖于作者，而作者并不在存在上依赖她的任何书籍。因此，`Book` 和
    `Author` 之间对应的对象生命周期依赖意味着，它们的双向关联通过在 `Book::authoredBooks` 中维护 `Author` 引用来维持（这是主属性的选择），而
    `Author` 是从属性，它是从 `Book::authors` 派生的。


    ## 7.2 构建 OO 类模型


    由于经典编程语言不支持将显式关联作为一等公民，而仅支持通过表示隐式关联的引用属性类，我们必须消除所有显式关联以获取 OO 类模型。


    ### 7.2.1 基础属性


    我们消除关联过程的起点是一个包含各种单向和双向关联的信息设计模型，如上方图 7.1 所示的模型仍然包含任何非导向关联，我们首先必须通过对其端点的所有权做出决策（通常基于导航需求），将它们转换为导向关联。


    注意，`Publisher-Book-Author` 信息设计模型中的两个关联——`publisher-publishedBooks` 和 `authoredBooks-authors`（或
    Authorship）都是双向的，正如关联端点的所有权点所示。为了从信息设计模型中消除所有显式关联，我们必须执行以下步骤：


    - 1. 消除连接源类与目标类的单向关联，通过将它们替换为源类中的一个引用属性，使目标类成为其范围（range）。

    - 2. 通过将双向关联替换为一对互反的引用属性来消除这些关联。


    ### 7.2.2 如何消除单向关联


    连接源类与目标类的单向关联被替换为其源类中相应的引用属性，该属性的范围为目标类。它的多重性与目标端的多重性相同。如果存在关联端名称，则其名称为该关联端的名称，否则设置为目标类的名称（如果引用属性是多值的，则可能使用复数形式）。


    ### 7.2.3 如何消除双向关联


    双向关联（如图 7.1 所示模型中 `Book` 类和 `Author` 类之间的作者关联）被替换为一对互反的引用属性，例如 `Book::authors`
    和 `Author::authoredBooks`。由于两个属性都代表相同的信息（同一组二元关系），因此可以将其中一个视为“主”，另一个视为“从”（后者由主属性派生），这是一种可选的方案。我们将讨论一对一和多对多的关联情况。


    - 1. 在双向一对一关联的情况下，会在两个关联类中的每一个类中产生一对互反的单值引用属性。由于它们本质上代表相同的信息（相同的链接/关系），必须选择其中一个作为主属性，另一个作为从属属性，该从属属性通过反转从主属性派生。在类图中，从属属性被指定为*派生属性*，每当
    1) 创建新的主对象，2) 更新主引用属性，或 3) 主对象被销毁时，它会自动更新。这种转换如图 7.2 所示。


