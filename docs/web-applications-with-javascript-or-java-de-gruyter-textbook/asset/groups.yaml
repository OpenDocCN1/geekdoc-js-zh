    \ |\n\n# 9.2 编写模型\n\n可以直接对 Java 实体模型进行编码，以获取我们 Java 后端应用的模型层代码\n\n# 9.2.1 新问题\n\
    \n与之前讨论的单向关联应用相比，我们必须处理一组新的技术问题：\n\n+ 1. 在模型代码中，你现在需要维护派生的反向引用属性，这需要通过维护构成派生反向引用属性值的派生反向引用（集合）来实现。特别是：\n\
    2. 每当通过 setter 初始化或更新单值主引用属性的值时（例如将指向 `Publisher` 实例 `p` 的引用赋值给 `Book` 实例 `b`\
    \ 的 `p.publisher`），必须向派生反向引用属性的相应值分配或添加反向引用（例如将 `b` 添加到 `p.publishedBooks`）；当主引用属性的值更新且派生反向引用属性是多值时，需要删除指向单值主引用属性旧值的过时反向引用；\n\
    3. 每当可选的单值主引用属性的值取消设置时（例如通过为 `Book` 实例 `b` 的 `b.publisher` 赋值 `null`），如果派生反向引用属性是多值的，则必须从派生反向引用属性的相应值移除反向引用（例如从\
    \ `p.publishedBooks` 中移除 `b`），否则必须取消或更新派生反向引用属性的相应值；\n4. 每当通过 add 方法向多值主引用属性的值添加引用时（例如向\
    \ `Book` 实例 `b` 的 `b.authors` 添加 `Author` 引用），必须向反向引用属性的相应值分配或添加反向引用（例如将 `b` 添加到\
    \ `a.authoredBooks`）；\n5. 每当通过 remove 方法从多值主引用属性的值移除引用时（例如从 `Book` 实例 `b` 的 `b.authors`\
    \ 中移除指向 `Author` 实例的引用），如果派生反向引用属性是多值的，则必须从派生反向引用属性的相应值移除反向引用（例如从 `a.authoredBooks`\
    \ 中移除 `b`），否则必须取消或更新派生反向引用属性的相应值；\n\n+ 当具有单引用或多个主引用属性值的对象被销毁时（例如当一个具有单引用 `b.publisher`\
    \ 指向 `Publisher` 实例 `p` 的 `Book` 实例被销毁时），必须移除派生的反向引用（例如通过从 `p.publishedBooks`\
    \ 中移除 `b`）。\n注意，当使用单引用或多个引用作为主引用属性的值创建新对象时（例如具有单引用 `b.publisher` 的新 `Book` 实例），其\
    \ setter 或 add 方法将被调用并处理反向引用的创建。\n\n+ 在 UI 代码中，我们现在可以利用反向引用属性在列表对象用例中高效创建反向对象列表。例如，我们可以更高效地为每个发行者创建所有已出版书籍列表。\n\
    \n# 9.2.2 总结\n\n+ 将 Java 实体类模型中的每个类编码为相应的实体类。\n使用 JPA 注解 `@Id` 编码 (id) 属性修符。\n\
    使用相应的 JPA 注解（如 `@ManyToMany`）编码表示引用属性功能的任何属性修符，如 `(ManyToOne)`。\n借助 Java Bean\
    \ Validation 注解（或自定义校验注解）编码模型中指定的完整性约束。\n为多个属性编码 getters、setters 以及 add 和 remove\
    \ 方法。\n将创建、检索、更新和删除存储管理操作编码为类级方法。\n在创建和更新方法中处理反向关系管理。\n\n这些步骤将在后续章节中进行更详细的讨论。\n\
    \n# 9.2.3 编码 Java 实体类模型中的每个类\n\n在 `Publisher` 类中，我们添加 `publishedBooks` 属性，并使用与\
    \ `Book` 类中的 `@ManyToMany` 对应的注解，表示反向关系：\n\n# 9 使用 Java EE 实现双向关联\n\n```java\n\
    @Entity\npublic class Publisher {\n  ..\n  @OneToMany(fetch=FetchType.EAGER, mappedBy=\"\
    publisher\")\n  private Set<Book> publishedBooks;\n  ..\n}\n```\n\n`publishedBooks`\
    \ 属性的 `@OneToMany` 注解的 `mappedBy` 参数指定了 `Book` 类中实现 `@ManyToOne` 的属性：\n\n```java\n\
    @Entity\npublic class Book {\n  ..\n  @ManyToOne(fetch=FetchType.EAGER)\n  @JoinColumn(name=\"\
    PUBLHER_ID\")\n  private Publisher publisher;\n  ..\n}\n```\n\n在 `Author` 类中，我们添加\
    \ `authoredBooks` 属性，并使用与 `Book` 类中的 `@ManyToMany` 对应的 注解，表示反向关系：\n\n```java\n\
    @Entity\npublic class Author {\n  ..\n  @ManyToMany(fetch=FetchType.EAGER, mappedBy=\"\
    authors\")\n  private Set<Book> authoredBooks;\n  ..\n}\n```\n\n`Author` 类 `authoredBooks`\
