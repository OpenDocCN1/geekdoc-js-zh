    # 5.4.3 Implement a Deletion Policy


    For the reference property Book::authors, we have to implement a deletion method
    in the delete method of the Author class. If we just try to delete an author,
    and the author is referenced by any of the book records, then an integrity constraint'
  - "[PAGE 89]\n\nviolation exception is raised, and the author cannot be deleted.\
    \ We have two possibilities for dealing with this situation:\n\n+   1. delete\
    \ all books (co-)authored by the deleted author;\n2. drop from all books (co-)authored\
    \ by the deleted author reference to the deleted author.\n\nWe go for the second\
    \ option. This is shown in the following code of the Author.delete method:\n\n\
    ```\npublic static void delete(EntityManager em, UserTransaction ut,\nInteger\
    \ personId) throws Exception {\nut.begin();\nAuthor author = em.find(Author.class,\
    \ personId);\n// Find all books of this author\nQuery query = em.createQuery(\"\
    SELECT DISTINCT b FROM Book b \" +\nINNER JOIN b.authors WHERE a.personId = :personId\"\
    );\nquery.setParameter(\"personId\", personId);\nList<Book> books = query.getResultList();\n\
    // Remove the author reference from the books'\nfor (Book b : books) {\n  b.getAuthors().remove(author);\n\
    }\n// Delete the author record (table row)\nem.remove(author);\nut.commit();\n\
    }\n```\n\nEssentially, the delete operation consists of three steps:\n\n+   1.\
    \ Create a JPQL query which selects all books of this author (since this is a\
    \ unidirectional association from books to authors, the books of an author are\
    \ not accessible from an author).\n2. For every book referencing this author,\
    \ we have to remove the author reference from its authors list.\n3. Finally, delete\
    \ the author record.\n\n# 5.4.4 Serialization and De-Serialization\n\nIn Java\
    \ EE, the serialization from objects to corresponding database records as well\
    \ as the de-serialization from database records to objects are performed automatically\
    \ by the Java EE execution environment based on JPA annotations and converter\
    \ classes for custom conversions."
- md: "\n## 5.5 Write the User Interface Code\n\n### 5.5.1 Show Information About\
    \ Associated Objects in Retrieve/List All\n\nFor showing information about the\
    \ authors of a book in the retrieve/list all books use case, the corresponding\
    \ cell in the HTML table has to be filled with a list of the names of all authors.\
    \ For this, we implement a method in the Book class which re-returns the serialized\
    \ list of author names (in the form, authorName_1, authorName_2, ..., authorName_n):\n\
    \n```java\npublic String getAuthorNames() {\n    String result = \"\";\n    int\
    \ i = 0, n = 0;\n    if ( this.authors!= null) {\n        n = this.authors.size();\n\
    \        for ( Author author : this.authors) {\n            result += author.getName();\n\
    \            if (i< n-1) {\n                result += \",\";\n            }\n\
    \            i++;\n        }\n    }\n    return result;\n}\n```\n\nIn the file\
    \ `retrieveAndList.xhtml` in the folder `WebContent/views/books/`, this method\
    \ is invoked in the JSF expression of the \"Authors\" column:\n\n```xml\n<ui:composition\
    \ template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"content\">\n\
    \  <h:dataTable value=\"#{bookController.books}\" var=\"b\">\n    ..\n    <h:column>\n\
    \      <f:facet name=\"header\">Publisher</f:facet>\n      #{b.publisher.name}\n\
    \    </h:column>\n    <h:column>\n      <f:facet name=\"header\">Authors</f:facet>\n\
    \      #{b.authorNames}\n    </h:column>\n  </h:dataTable>\n  <h:button value=\"\
    Back\" outcome=\"index\" />\n</ui:define>\n</ui:composition>\n```\n\nRecall that\
    \ using `b.authorNames` results in invoking a method named `getAuthorNames` on\
    \ the given object.\n\n### 5.5.2 Allow Selecting Associated Objects in Create\n\
    \nFor allowing to select multiple authors to be associated with a book in the\
    \ create use case, a multiple selection list (a select element with `multiple=\"\
    multiple\"`), as shown in the facet below, is populated with the instances of\
    \ the associated object type. The following code is part of the `create.xhtml`\
    \ view file in the folder `WebContent/views/`:\n\n```xml\n<ui:composition template=\"\
    WEB-INF/templates/page.xhtml\">\n<ui:define name=\"content\">\n<h:form id=\"createBookForm\"\
    >\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"authors\" value=\"Authors\"\
    \ />\n<h:selectManyListBox id=\"authors\" value=\"#{book.authors}\" var=\"a\"\
    >\n<f:selectItems items=\"#{authorController.authors}\" itemLabel=\"#{a.name}\"\
    \ itemValue=\"#{a}\" />\n<f:converter converterId=\"AuthorConverter\" />\n</h:selectManyListBox>\n\
    <h:message for=\"authors\" class=\"error\" />\n</h:panelGrid>\n<h:commandButton\
    \ value=\"Create\" action=\"#{bookController.create(book.isbn, book.title, book.publisher,\
    \ book.authors)}\" />\n</h:form>\n<h:button value=\"Back\" outcome=\"index\" />\n\
    </ui:define>\n</ui:composition>\n```\n\nRemember that we have to add the `equals`\
    \ method for the Author model class. In our case, two authors are \"one and the\
    \ same\" if the values of their `personId` property are equal:\n\n```java\n@Override\n\
    public boolean equals(Object obj) {\n    if (obj instanceof Author) {\n      \
    \  Author author = (Author) obj;\n        return (this.personId.equals(author.personId));\n\
    \    } else return false;\n}\n```\n\nLike the case of Publisher, a JSF converter\
    \ class is used to serialize objects to display strings, when the select list\
    \ is populated, and back to objects, when the create method of the BookController\
    \ is called (the “Create” button was pushed by the user). The `BookController.create`\
    \ method is extended with a new parameter, the authors list:\n\n```java\npublic\
    \ String create(String isbn, String title, Integer year,\n    Publisher publisher,\
