    \ methods:\n\n> A common problem with bidirectional relationships is the application\
    \ updates one side of the relationship, while the other side not get updated,\
    \ and becomes out of sync. In JPA, as Java in general, it is the responsibility\
    \ of the application or the object model to maintain relationships. If your application\
    \ adds to one side of the relationship, then it must add to the other side. This\
    \ is commonly resolved through add or set methods in the object model that handle\
    \ both sides of the relationships, so the application code does not need to worry\
    \ about it. There are two ways to go about this: you can either add the relationship\
    \ maintenance code to one side of the relationship, and only use the setter from\
    \ that side (such as making the other side protected), or to add to both sides\
    \ and ensure you avoid an infinite loop.\n\nWe have used an entity manager for\
    \ each controller class. Every entity manager maintains a set of cached entities\
    \ which can be “shared” with other entity managers"
