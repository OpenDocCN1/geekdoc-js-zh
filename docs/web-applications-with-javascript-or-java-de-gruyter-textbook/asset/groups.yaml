    \ : ConstraintViolation | tostring() : String |\n| checkPublisher(p : Publisher)\
    \ : ConstraintViolation | toRecord() : Object |\n| checkAuthor(author : Author)\
    \ : ConstraintViolation | | |\n| addAuthor(author : Author) | | | |\n| removeAuthor(author\
    \ : Author) | | | |\n| toString() : String | | | |\n| toRecord() : Object | |\
    \ |\n\n## 作者 (Author)\n\n### 8.2 编写模型代码\n\n可以直接为 JS 类模型进行编码，以获取 JavaScript 前端应用模型层的代码。\n\
    \n### 8.2.1 新问题\n\n与单向关联应用相比，我们必须处理许多新的技术问题：\n\n- 1. 我们定义了派生反向引用属性，例如 Publisher::publishedBooks，它不包含检查操作（check），也不包含设置操作（set）。\n\
