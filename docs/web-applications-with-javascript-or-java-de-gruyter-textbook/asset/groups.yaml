  - "[PAGE 42]\n\n# 26 — 2 Implementing Unidirectional Functional Associations with\
    \ Plain JS\n\n# 2.4 New Issues\n\nCompared to the validation and enumeration apps\
    \ discussed in Volume 1, we have to deal with a number of technical issues:\n\n\
    +   1. In the model code we now have to take care of reference properties that\
    \ require\n   1. maintaining referential integrity;\n   2. choosing and implementing\
    \ one of the two deletion policies discussed in Section 1.2 for managing the corresponding\
    \ object destruction de-dependency in the destroy method of the property’s range\
    \ class;\n   3. conversion between internal object references and external ID\
    \ references in the serialization function toString() and the conversion function\
    \ toRecord(), as well as in the constructor function.\n\n+   2. In the user interface\
    \ (“view”) code we now have to take care of\n   1. showing information about associated\
    \ objects in the Retrieve/List use case;\n   2. allowing to select an object from\
    \ a list of all instances of the association's target class and add it to, or\
    \ remove an object from, a list of associated objects, in the Create and Update\
    \ cases.\n\n# 2.5 Code the Model\n\nThe JS model can be directly coded for getting\
    \ the JS classes of our app.\n\n# 2.5.1 Summary\n\nCode each class of the JS class\
    \ model as an ES2015 class with implicit getters and setters:\n\n+   1. Code the\
    \ property checks in the form of class-level (‘static’) methods. Take care that\
    \ all constraints of a property as specified in the JS class model are properly\
    \ coded in the property checks.\n2. For each single-valued property, code the\
    \ specified getter and setter that in each setter, the corresponding property\
    \ is invoked and the property is only set/unset, if the check does not detect\
    \ any constraint violation.\n3. Write the code of the serialization function toString()\
    \ and the storage conversion function toRecord().\n4. Take care of deletion dependencies\
    \ in the destroy method.\n\nThese steps are discussed in more detail in the following\
    \ sections."
  - "[PAGE 43]\n\n# 2.5 Code the Model 27\n\n# 2.5.2 Each Model Class as an ES2015\
    \ Class\n\nEach class C of the JS class model is coded as an ES2015 class with\
    \ the same name C and a constructor having a single record parameter, which specifies\
    \ a field for each (non-derived) property of the class. The range of these properties\
    \ should be indicated in a comment. In the case of a reference property the range\
    \ is another class.\n\nIn the constructor body, we assign the fields of the record\
    \ parameter to corresponding properties. These property assignments invoke the\
    \ corresponding setter methods.\n\nFor instance, the Publisher class from the\
    \ JS class model is coded in the following way:\n\n```\nclass Publisher {\n  constructor(({name,\
    \ address})) {\n    this.name = name;\n    this.address = address;\n  }\n}\n```\n\
    \nSince the setters may throw constraint violation exceptions, the constructor\
    \ function, and any setter, should be called in a try-catch block where the catch\
    \ clause takes care of logging suitable error messages.\n\nFor each model class\
    \ C, we define a class-level property C.instances representing the collection\
    \ of all C instances managed by the application in the form of an entity table\
    \ (a map of records). This property is initially set to {}. For instance, in the\
    \ case of the model class Publisher, we define:\n\nPublisher.instances = {};\n\
    \nThe Book class from the JS class model is coded in a similar way:\n\n```\nclass\
    \ Book {\n  constructor(({isbn, title, year, authors, authorIdRefs, \n    publisher,\
    \ publisher_id})) {\n    this.isbn = isbn;\n    this.title = title;\n    this.year\
    \ = year;\n    this.authors = authors || authorIdRefs;\n  }\n```"
