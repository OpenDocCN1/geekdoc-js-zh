    - 3. how to write the view and controller code based on the model code.\n\n##\
    \ 13.1 Subtyping with JavaScript with Constructor-Based Classes\n\nBefore the\
    \ version ES2015, JavaScript did not have an explicit class concept and subtyping\
    \ was not directly supported, it had to be implemented with the help of certain\
    \ code patterns providing two inheritance mechanisms: (1) inheritance of properties\
    \ and (2) inheritance of methods.\n\nAs we have explained in Chapter 1 of Volume\
    \ 1, classes can be defined in two alternative ways: constructor-based and factory-based.\
    \ Both approaches have their own way of implementing inheritance.\n\nWe summarize\
    \ the ES2015 code pattern for defining a superclass and a subclass in a constructor-based\
    \ single-inheritance class hierarchy with the help of the following example:\n\
    \n| Person | |\n| :--- | :--- |\n| firstName | String |\n| lastName | String |\n\
    | Student | |\n| studNo | Integer |\n\nThen, we define a base class, Person, with\
    \ two properties, firstName and lastName, defined with getters and setters:\n\n\
    ```javascript\nclass Person {\n  constructor ({first, last}) {\n    // assign\
