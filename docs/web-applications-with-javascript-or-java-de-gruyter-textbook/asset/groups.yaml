    \    }\n  } else {\n    console.log(`There is no book with ${isbn}`);\n  }\n}\n\
    ```\n\n## 98 8 使用原生 JS 实现双向关联\n\n```javascript\n// 从作者处删除反向引用\nfor (let authorID\
    \ of Object.keys(book.authors)) {\n  delete book.authors[authorID].authoredBooks[isbn];\n\
    \  delete book.authors[authorID];\n}\n} else {\n  console.log(`There is no book\
    \ with ${isbn}`);\n}\n```\n\n## 8.3 在用户界面中利用引用属性\n\n在 UI 代码中，我们现在可以在“获取所有（Retrieve\
    \ All）”用例中利用发布者的派生属性。\n\n## 8.3.1 在“获取所有”中显示已书籍的信息\n\n为了在“获取所有”案例中显示书籍信息，我们现在可以利用派生属性：\n\
