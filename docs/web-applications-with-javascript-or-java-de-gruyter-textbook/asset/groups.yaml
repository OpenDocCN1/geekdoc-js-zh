    \ (unique) |\n| biography[0..1] | VARCHAR |\n| department[0..1] | VARCHAR |\n\n\
    ```\n«invariant»\n(\"Employee\" IN categories IFF NOTNULL(emp_no)\nAND (\"Manager\"\
    \ IN categories IFF NOTNULL(emp_no))\nAND NOTNULL(department)\nAND (\"Author\"\
    \ IN categories IFF NOTNULL(biography))\n```\n\n**Figure 12.10:** An STI table\
    \ representing the Person roles hierarchy.\n\nNotice that when the discriminator\
    \ column categories is multi-valued, the segmentation of Person is not disjoint,\
    \ but overlapping, implying that a Person object may belong to several categories.\
    \ Notice also that, since a role segmentation (like Employee, Manager, Author)\
    \ is not rigid, the discriminator column categories does not have a frozen constraint.\n"
