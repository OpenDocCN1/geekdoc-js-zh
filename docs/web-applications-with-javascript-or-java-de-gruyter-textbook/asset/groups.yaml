    \  name=\"books_authors\",\n    joinColumns = @JoinColumn(name=\"BOOK_ID\"),\n\
    \    inverseJoinColumns = @JoinColumn(name=\"AUTHOR_ID\")\n  )\n  private Set<Author>\
    \ authors;\n  ..\n}\n```\n\n我们还使用 `@JoinTable` 注解指定多对关系的连接表以及连接表的相应列，例如表名为 `books_authors`，列名为\
    \ `BOOK_ID` 和 `AUTHOR_ID`。\n\n# 9.2.4 编码 Setter 操作\n\n对于任何与派生反向引用属性耦合（实现双向关联）的引用属性，现在还需要向反向属性的相应值（集合）分配/添加/移除反向引用。此类\
    \ setter 的示例是 `setPublisher` 方法：\n\n```java\npublic void setPublisher(Publisher\
    \ publisher) {\n  // 从 publisher.publishedBooks 中移除书籍引用\n  if (this.publisher\
    \ != null) {\n    this.publisher.removePublishedBook(this);\n  }\n  // 将书籍添加到\
    \ publisher.publishedBooks 中\n  if (publisher != null) {\n    publisher.addPublishedBook(this);\n\
    \  }\n  this.publisher = publisher;\n}\n```\n\n# 9.2.5 编码添加和删除操作\n\n对于任何与派生反向引用属性耦合的多值引用属性，add\
    \ add 和 remove 方法都必须向反向属性的相应值（集合）分配/添加/移除反向引用。\n\n"
