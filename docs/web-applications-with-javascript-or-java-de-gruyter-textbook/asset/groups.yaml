  - "[PAGE 83]\n\n# 5 Unidirectional Non-Functional Associations with Java EE\n\n\
    A unidirectional non-functional association is either one-to-many or many-to-many.\
    \ In both cases such an association is represented with the help of a multi-valued\
    \ reference property.\n\nIn this chapter, we show\n\n+   1. how to derive a Java\
    \ Entity model from an OO class model with multi-valued reference properties representing\
    \ unidirectional non-functional associations,\n2. how to code the Java Entity\
    \ class model in the form of entity classes (implementing model classes),\n3.\
    \ how to write the view and controller code based on the model code.\n\n# 5.1\
    \ Implementing Multi-Valued Reference Properties in Java\n\nA multi-valued reference\
    \ property, as Book::authors, allows storing collection of internal references\
    \ to objects of some type, such as references to Author objects. When creating\
    \ a new type of Book, the constructor function needs to have a parameter for providing\
    \ a suitable value for this property. In general, the value can be a set of internal\
    \ object references or of ID references. With JPA, we use object references:\n\
    \n```\n@Entity @Table (name=\"books\")\n@ManagedBean (name=\"book\")\n@ViewScoped\n\
    public class Book {\n\n    private Set<Author> authors;\n\n    public Book() {\
    \ // required JPA @Entity annotation!\n    public Book(String isbn, String title,\
    \ Integer year,\n               Publisher publisher, Set<Author> authors) { .\
    \ . . }\n\n    public Set<Author> getAuthors() { return this.authors; }\n    public\
    \ void setAuthors( Set<Author> authors) { this.authors = authors; }\n}\n```"
- md: "\n68 — Unidirectional Non-Functional Associations with Java EE\n\n## 5.2 Make\
    \ a Java Entity Class Model\n\nOur starting point for making a Java Entity class\
    \ model is the following OO class model:\n\n| Book | Publisher |\n| :--- | :---\
    \ |\n| isbn[1] : String (id) | name : String (id) |\n| title[1] : String | address\
    \ : String |\n| year[1] : Integer | | |\n| publisher[0..1] : Publisher | | |\n\
    | authors[*] : Author | | |\n| | personid : integer (id) |\n| | name : String\
    \ |\n\nThis model contains, in addition to the single-valued reference property\
    \ Book::publisher representing the unidirectional many-to-one association *Book-has-Publisher*,\
    \ the multi-valued reference property Book::authors representing the unidirectional\
    \ many-to-many association *Book-has-Author*.\n\nRecall that we obtain a Java\
    \ Entity class, like Author, from the corresponding class in the OO class model,\
    \ by (1) making all properties private, (2) using Java data-type classes, (3)\
    \ adding public getters and setters, (4) adding a toString function, (5) adding\
    \ the data storage methods *create, retrieve, update and delete*:\n\n| «Java Entity»\
    \ Author |\n| :--- |\n| /get/set--personid : Integer (id) |\n| /get/set--name\
    \ : String |\n| +checkPersonIdAid(in pid : Integer, in em : EntityManager) : ConstraintViolation\
    \ |\n| +toString() : String |\n| +(...) |\n\nIn the Java Entity class model, any\
    \ reference property specified in the OO class model is annotated with the functionality\
    \ type of the association represented by it.\n\n## 5.3 New Issues\n\nCompared\
    \ to dealing with a unidirectional functional association, as discussed in the\
    \ previous instance, we have to deal with the following new techniques:\n\n- 1.\
    \ In **model classes** we have to take care of **multi-valued reference properties**\
    \ that have to be annotated with `@OneToMany` or `@ManyToMany`. \n- 2. In the\
    \ **user interface** code we have to take care of:\n   1. showing information\
    \ about a collection of associated objects in the view table columns that render\
    \ multi-valued reference properties in the `retrieve` list objects we use;\n \
    \  2. allowing to select a collection of associated objects from a list of all\
    \ existing instances of the target class in the `create` object and `update` object\
    \ cases.\n\nThe last issue, allowing to select a collection of associated objects\
    \ from a list of all existing instances of some class, in general, cannot be solved\
    \ with the help of an HTML select element because of usability problems. Whenever\
    \ the set of selectable options is greater than a certain threshold (defined by\
    \ the number of options that can be seen on the screen without scrolling), the\
    \ HTML `select multiple` element is no longer usable, and an alternative `multi-selection`\
    \ widget has to be used.\n\n## 5.4 Write the Model Code\n\nThe Java Entity class\
    \ model can be directly coded for implementing the model layer of our Java back-end\
    \ app.\n\nIn our example, we annotate the property authors in the Entity class\
    \ Book with manyToToMany:\n\n| «Java Entity» |\n| :--- |\n| «get/set»isbn[1]:\
    \ String (id) |\n| «get/set»title[1]: String |\n| «get/set»year[1]: Integer |\n\
    | «get/set»publisher[..1]: Publisher (manyToOne) |\n| «get/set»authors[*]: Author\
    \ (manyToMany) |\n| +checkisBlank(in: String, in: EntityManager) : ConstraintViolation\
    \ |\n| +addAuthor(in: Author) |\n| +removeAuthor(in: Author) |\n| +toString():\
    \ string |\n| +- |\n\n### 5.4.1 Summary\n\n- 1. Code each class of the Java Entity\
    \ class model as a corresponding entity class.\n- 2. Code any [id] property modifier\
    \ with the JPA property annotation @Id.\n- 3. Code any property modifier denoting\
    \ the functionality type of a reference property, such as [manyToOne], with the\
    \ corresponding JPA annotation, as @ManyToOne.\n- 4. Code the integrity constraints\
    \ specified in the model with the help of Bean Validation annotations (or custom\
    \ validation annotations).\n- 5. Code the getters and setters as well as the add\
    \ and remove methods for multi-valued properties.\n- 6. Code the create, retrieve,\
    \ update and delete storage operations as class-level methods.\n\nThese steps\
    \ are discussed in more detail in the following sections.\n\n### 5.4.2 Each Class\
    \ of the Java Entity Class Model\n\nFor the multi-valued reference property Book::authors,\
    \ we use a parametrized Set type:\n\n```java\n@Entity @Table ( name=\"books\"\
    )\n@ViewScoped @ManagedBean ( name=\"book\")\npublic class Book {\n    ...\n \
    \   @ManyToMany ( fetch=FetchType.EAGER )\n    private Set<Author> authors;\n\n\
    \    public Book() {}\n    public Book( String isbn, String title, Integer year,\n\
    \               Publisher publisher, Set<Author> authors) { . . . }\n\n    ...\n\
    \    public Set<Author> getAuthors() { return this.authors; }\n    public void\
    \ setAuthors( Set<Author> authors) { this.authors=authors; }\n\n}\n```\n\nThe\
    \ JPA annotation @ManyToMany allows to specify the Many-To-Many relation between\
    \ the Book and Author. The annotation parameter FetchType.EAGER is used, so when\
    \ a Book instance is created, the list of authors is populated with the corresponding\
    \ Author instances. As a result of this annotation, a relation table between Book\
    \ and Author is created, and the resulting SQL code is shown below:\n\n```sql\n\
    CREATE TABLE IF NOT EXISTS 'books_author' (\n  'Book_ISBN' varchar(10) NOT NULL,\n\
    \  'authors_PERSONID' int(11) NOT NULL\n);\n```\n\nThe resulting class is the\
    \ underscore-separated concatenation of the corresponding table names (e.g., books_author).\
    \ The primary columns from each of the two tables are used to implement the relation.\
    \ The corresponding column names are created as follows:\n\n- for the table (e.g.,\
    \ books) which corresponds to the class with the @ToMany annotation (e.g., Book),\
    \ the class name is used as well as the primary column name, (e.g., Book_ISBN).\n\
    - for the other (e.g., authors), the table name is concatenated with the primary\
    \ column name, (e.g., authors_PERSONID).\n\nIt is possible to control these parameters,\
    \ i.e., table name and relation column names, e.g., by using the @JoinTable annotation.\
    \ To obtain a custom named relation table, one can use:\n\n```java\n@JoinTable(name=\"\
    books_author\",\n  joinColumns = @JoinColumn(name=\"Book_ISBN\"),\n  inverseJoinColumns\
    \ = @JoinColumn(name=\"authors_PERSONID\"))\n```\n\n### 5.4.3 Implement a Deletion\
    \ Policy\n\nFor the reference property Book::authors, we have to implement a deletion\
    \ method in the delete method of the Author class. If we just try to delete an\
    \ author, and the author is referenced by any of the book records, then an integrity\
    \ constraint violation is raised, and the author cannot be deleted. We have two\
    \ possibilities for dealing with this situation:\n\n- 1. delete all books (co-)authored\
    \ by the deleted author;\n- 2. drop from all books (co-)authored by the deleted\
    \ author reference to the deleted author.\n\nWe go for the second option. This\
    \ is shown in the following code of the Author.delete:\n\n```java\npublic static\
    \ void delete(EntityManager em, UserTransaction ut, Integer personId) throws Exception\
    \ {\n    ut.begin();\n    Author author = em.find(Author.class, personId);\n \
    \   // Find all books of this author\n    Query query = em.createQuery(\"SELECT\
    \ DISTINCT b FROM Book b \" +\n    INNER JOIN b.authors WHERE a.personId = :personId\"\
    );\n    query.setParameter(\"personId\", personId);\n    List<Book> books = query.getResultList();\n\
    \    // Remove the author reference from the books'\n    for (Book b : books)\
    \ {\n      b.getAuthors().remove(author);\n    }\n    // Delete the author record\
    \ (table row)\n    em.remove(author);\n    ut.commit();\n}\n```\n"
  mdcn: "\n68 — 使用 Java EE 的单向非功能关联\n\n## 5.2 构建 Java 实体类模型\n\n我们构建 Java 实体类模型的起点是以下面向对象（OO）类模型：\n\
    \n| 书 (Book) | 出版 (Publisher) |\n| :--- | :--- |\n| isbn[1] : String (id) | name\
    \ : String (id) |\n| title[1] : String | address : String |\n| year[1] : Integer\
    \ | | |\n| publisher[0..1] : Publisher | | |\n| authors[*] : Author | | |\n| |\
    \ personid : integer (id) |\n| | name : String |\n\n该模型除了代表单向多对一关联*书-拥有出版社（Book-has-Publisher）*的单值引用属性\
    \ `Book::publisher` 外，还包含代表单向多对多关联*书-拥有作者（Book-has-Author）*的多值引用属性 `Book::authors`。\n\
    \n回想，我们通过以下步骤从 OO 类模型中对应的类获取 Java 实体类（如 Author）：(1) 将所有属性设为私有，(2) 使用 Java 数据类型类，(3)\
    \ 添加公共的 getter 和 setter，(4) 添加 `toString` 函数，(5) 添加数据存储方法*创建、检索、更新和删除（create,\
    \ retrieve, update and delete）*：\n\n| «Java 实体» Author |\n| :--- |\n| /get/set--personid\
    \ : Integer (id) |\n| /get/set--name : String |\n| +checkPersonIdAid(in pid :\
    \ Integer, in em : EntityManager) : ConstraintViolation |\n| +toString() : String\
    \ |\n| +(...) |\n\n在 Java 实体类模型中，OO 类模型中指定的任何引用属性都将用其所代表的关联的功能类型对其进行注解。\n\n##\
    \ 5.3 新问题\n\n与上一个实例中讨论的单向功能关联相比，我们必须处理以下新技术：\n\n- 1. 在**模型类**中，我们必须处理需要用 `@OneToMany`\
    \ 或 `@ManyToMany` 注解的**多值引用属性**。\n- 2. 在**用户界面**代码中，我们必须处理：\n   1. 在 `retrieve`\
    \ 列表对象使用的视图表列中，显示关联对象集合的信息，以渲染多值引用属性；\n   2. 在 `create` 对象和 `update` 对象的情况下，允许从目标类所有现有实例的列表中选择关联对象集合。\n\
    \n最后一个问题，即允许从某些类的所有现有实例列表中选择关联对象集合，通常无法通过 HTML `select` 元素解决，因为存在可用性问题。每当可选选项集超过某个阈值（由屏幕上无需滚动即可可见的选项数量定义），HTML\
    \ `select multiple` 元素就不再可用，必须使用替代的`多选`小部件。\n\n## 5.4 编写模型代码\n\n可以直接对 Java 实体类模型编码以实现我们\
    \ Java 后端应用的模型层。\n\n在示例中，我们对实体类 `Book` 中的属性 `authors` 注解了 `manyToToMany`：\n\n\
    | «Java 实体» |\n| :--- |\n| «get/set»isbn[1]: String (id) |\n| «get/set»title[1]:\
    \ String |\n| «get/set»year[1]: Integer |\n| «get/set»publisher[..1]: Publisher\
    \ (manyToOne) |\n| «get/set»authors[*]: Author (manyToMany) |\n| +checkisBlank(in:\
    \ String, in: EntityManager) : ConstraintViolation |\n| +addAuthor(in: Author)\
    \ |\n| +removeAuthor(in: Author) |\n| +toString(): string |\n| +- |\n\n### 5.4.1\
    \ 总结\n\n- 1. 将 Java 实体类模型中的每个类编码为相应的实体类。\n- 2. 对任何 [id] 属性修饰符使用 JPA 属性注解 `@Id`\
    \ 进行编码。\n- 3. 对任何表示引用属性功能类型的属性修饰符（如 [manyToOne]），使用相应的 JPA 注解（如 `@ManyToOne`）编码。\n\
    - 4. 使用 Bean Validation 注解（或自定义校验注解）对模型中指定的完整性约束进行编码。\n- 5. 为多值属性编写 getter、setter\
    \ 以及添加（add）和删除（remove）方法。\n- 6. 将创建、检索、更新和删除存储操作编码为类方法。\n\n这些步骤将在后续章节中进行详细讨论。\n\
    \n### 5.4.2 Java 实体类模型中的每个类\n\n对于多值引用属性 `Book::authors`，我们使用参数化的 `Set` 类型：\n\n\
    ```java\n@Entity @Table ( name=\"books\")\n@ViewScoped @ManagedBean ( name=\"\
    book\")\npublic class Book {\n    ...\n    @ManyToMany ( fetch=FetchType.EAGER\
    \ )\n    private Set<Author> authors;\n\n    public Book() {}\n    public Book(\
    \ String isbn, String title, Integer year,\n               Publisher publisher,\
    \ Set<Author> authors) { . . . }\n\n    ...\n    public Set<Author> getAuthors()\
    \ { return this.authors; }\n    public void setAuthors( Set<Author> authors) {\
    \ this.authors=authors; }\n\n}\n```\n\nJPA 注解 `@ManyToMany` 允许指定 `Book` 和 `Author`\
    \ 之间的多对多关系。使用了参数 `FetchType.EAGER`，因此当创建 `Book` 实例时，作者列表将填充相应的 `Author` 实例。由于该注解，会创建一个\
    \ `Book` 和 `Author` 之间的关系表，生成的 SQL 代码如下所示：\n\n```sql\nCREATE TABLE IF NOT EXISTS\
    \ 'books_author' (\n  'Book_ISBN' varchar(10) NOT NULL,\n  'authors_PERSONID'\
    \ int(11) NOT NULL\n);\n```\n\n生成的类是对应表名用下划线连接的结果（例如 `books_author`）。使用两个表的主键来实现该关系。相应的列名如下：\n\
    \n- 对于对应带有 `@ToMany` 注解的类（例如 `books`），使用类名以及主键列名（例如 `Book_ISBN`）。\n- 对于另一个表（例如\
    \ `authors`），使用类名以及主键列名（例如 `authors_PERSONID`）。\n\n可以控制这些参数，即表名和关系列名，例如通过 `@JoinTable`\
    \ 注解。为了获取自定义的关系表，可以使用：\n\n```java\n@JoinTable(name=\"books_author\",\n  joinColumns\
    \ = @JoinColumn(name=\"Book_ISBN\"),\n  inverseJoinColumns = @JoinColumn(name=\"\
    authors_PERSONID\"))\n```\n\n### 5.4.3 实现删除策略\n\n对于属性 `Book::authors`，我们必须在 `Author`\
    \ 类的删除方法中实现删除逻辑。如果我们尝试删除一个作者，而该作者被任何书籍记录引用，则会抛出完整性违反异常，导致无法删除作者。处理这种情况有两种种可能性：\n\
    \n- 1. 删除所有由被删除作者编写的书；\n- 2. 从所有由被删除作者编写的书中移除该作者的引用。\n\n我们选择第二种方案。下文 `Author.delete`\
    \ 的代码所示：\n\n```java\npublic static void delete(EntityManager em, UserTransaction\
    \ ut, Integer personId) throws Exception {\n    ut.begin();\n    Author author\
    \ = em.find(Author.class, personId);\n    // 查找该作者的所有书籍\n    Query query = em.createQuery(\"\
    SELECT DISTINCT b FROM Book b \" +\n    INNER JOIN b.authors WHERE a.personId\
    \ = :personId\");\n    query.setParameter(\"personId\", personId);\n    List<Book>\
    \ books = query.getResultList();\n    // 从书籍移除作者引用\n    for (Book b : books) {\n\
    \      b.getAuthors().remove(author);\n    }\n    // 删除作者记录（表行）\n    em.remove(author);\n\
    \    ut.commit();\n}\n```\n"
