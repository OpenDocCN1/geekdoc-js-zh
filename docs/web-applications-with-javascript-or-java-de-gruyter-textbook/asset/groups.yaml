    ## 1.8 在用户界面中渲染引用属性


    用于 CRUD 用户界面（UI）的数据输入输出控件通常对应于模型类中的枚举属性或引用属性。我们需要区分输入字段和选择控件（如列表）。在 UI 中使用选择控件而不是输入字段可以防止用户输入无效
    ID，从而维护引用完整性。


    通常情况下，单值引用属性无论其范围有多少对象，都可以在 UI 中渲染为单选列表，并从中进行特定的选择。如果引用属性的范围足够小（例如小于 7），也可以使用单选按钮组。


    多值引用属性可以在 UI 中渲染为多选列表。然而，当可选范围很多（例如超过 20 个）时，HTML 对应的多选控件并不好用，因为选择方式过于分散。在只有少数选项（例如不超过
    7 个）的特殊情况下，可以使用复选框组代替多选列表。但对于一个包含引用属性范围内所有关联对象的通用情况，我们需要开发一种特殊的控件，允许向已选列表添加（移除）对象。


    这种多选控件由：


    1. 一个包含（关联）对象的 HTML 列表，每个列表项包含一个用于移除对象的按钮；

    2. 一个单选控件，配合按钮从多值引用属性的范围内添加新的关联对象。


    ## 1.9 多值引用属性的集合类型


    默认情况下，函数关联将目标类的实例集与源类的任何实例关联，这意味着对应多值引用属性的集合值为集合。然而，也存在函数关联端是有序的情况，因此对应引用属性的集合值为有序集合的形式。


    在以下示例中，关联 `publishedBooks` 不是有序的，而关联 `authors` 是有序的，因为书的作者顺序是有意义的。注意在 UML 类图中，有序关联端标记为
    `{ordered}`。


    ## 引用属性与单向关联


    | 出版社 | 出书籍 | 作者 (有序) | 作者 |

    | :--- | :--- | :--- | :--- |

