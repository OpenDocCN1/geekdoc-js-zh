    \    inverseJoinColumns = @JoinColumn(name=\"AUTHOR_ID\")\n  )\n  private Set<Author>\
    \ authors;\n  ..\n}\n```\n\nWe also use the @JoinTable annotation to specify the\
    \ join table name for the Many-To relation and the corresponding column names\
    \ for the join table, e.g., the table is books_authors and the columns are named\
