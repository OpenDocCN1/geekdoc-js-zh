    - 2. how to code the JS model based on\n- 3. how to write the view and controller\
    \ code.\n\n### 3.1 Implementing Multi-Valued Reference Properties\n\nA multi-valued\
    \ reference property, such as authors, allows a collection of references to some\
    \ type, such as Author objects. When creating a new object of Book, the constructor\
    \ function needs to have a parameter for this. We can allow this value to be a\
    \ collection of internal object references or ID references, as shown in the following\
    \ example:\n\n```js\nclass Book {\n  constructor({isbn, title, year, authors,\
    \ authorIdRefs, publisher, publisher_id}) {\n    this.isbn = isbn;\n    this.title\
    \ = title;\n    this.year = year;\n    // assign object reference or ID reference\n\
    \    this.authors = authors || authorIdRefs;\n    if (publisher || publisher_id)\
    \ this.publisher = publisher || publisher_id;\n  }\n}\n```\n\nNotice that the\
    \ constructor's parameter is expected to contain either authors or authorIdRefs.\
    \ The JavaScript expression authors || authorIdRefs, using the disjunction operator\
    \ ||, evaluates to a map authors, if there is a slot with name, or to an array\
    \ authorIdRefs, otherwise. We handle the resulting ambiguity in the property setter\
    \ by checking the type of the argument as shown in following code:\n\n```js\n\
    set authors(a) {\n  this._authors = {};\n  if (Array.isArray(a)) { // array of\
