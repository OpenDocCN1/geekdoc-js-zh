  - "[PAGE 71]\n\n# 4.3 New Issues\n\nCompared to the single-class apps discussed\
    \ in previous, we have to deal with a number of new technical issues:\n\n+   1.\
    \ In the model code we now have to take care of reference properties that require\n\
    \   defining referential integrity constraints with the help of suitable JPA annotations;\n\
    \   extending the code of the create, update and delete methods by taking the\
    \ reference properties into consideration;\n   a method for converting between\
    \ (internal) object references and corresponding (external) ID references in serialization\
    \ and de-serialization operations.\n2. In the user interface (view) code we now\
    \ have to take care of\n   showing information about associated objects in the\
    \ retrieve/list all use case;\n   allowing to select an associated object from\
    \ a list of all existing instances of the target class in the create object and\
    \ update object use cases.\n\n# 4.4 Write the Model Code\n\nThe Entity class model\
    \ can be directly coded for getting the model layer code of our Java back-end\
    \ app.\n\n# 4.4.1 Summary\n\n+   1. Code each class from the Java Entity class\
    \ model as a corresponding entity class.\n2. Code an [id] property modifier with\
    \ the JPA annotation @Id\n3. Code any property modifier denoting the functionality\
    \ type of a reference property, such as [manyToOne], with the JPA annotation,\
    \ such as @ManyToOne.\n4. Code the integrity constraints specified in the model\
    \ with the help of Java Bean Validation annotations (or custom validation annotations).\n\
    5. Code the getters and setters.\n6. Code the create, retrieve, update and delete\
    \ storage management operations as class-level methods.\n\nThese steps are discussed\
    \ in more detail in the following sections."
- md: "\n56 — 4 Implementing Unidirectional Functional Associations with Java EE\n\
    \n## 4.4.2 Code Each Class of the Entity Model\n\nEach class of the Java entity\
    \ class model is coded as an annotated bean class with name C having a default\
    \ constructor (no parameters) and a constructor with entity parameters.\n\nFor\
    \ instance, the Book class from the entity class model is coded in the following-way:\n\
    \n```java\n@Entity @Table( name=\"books\")\n@ViewScoped ManagedBean(name=\"book\"\
    )\npublic class Book {\n    @Id @NotNull( message=\"An ISBN is required!\")\n\
    \    private String isbn;\n    @Column(nullable=false)\n    @NotNull(message=\"\
    A title is required!\")\n    private String title;\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"A year is required!\")\n    private Integer year;\n  \
    \  @ManyToOne( fetch=FetchType.EAGER)\n    private Publisher publisher;\n\n  \
    \  public Book() {}\n    public Book(String isbn, String title, Integer year,\
    \ Publisher publisher) {\n        this.setIsbn(isbn);\n        this.setTitle(title);\n\
    \        this.setYear(year);\n        this.setPublisher(publisher);\n    }\n\n\
    \    .. // getters, setters, etc.\n}\n```\n\nThe @ManyToOne annotation on the\
    \ publisher is used for specifying the functionality of the association Book has\
    \ Publisher represented by the reference publisher since it holds that a book\
    \ has one publisher and a publisher has many books. This annotation also allows\
    \ to specify a fetch type with the parameter fetching one of the following possible\
    \ values:\n\n- FetchType.EAGER, implying that a retrieval of an entity includes\
    \ a retrieval of the associated entity referenced by this property. In our example,\
    \ this means that when a Book entity is retrieved, the Publisher entity referenced\
    \ by the book's publisher property is also retrieved. This behavior is very useful\
    \ and it should be used whenever the data to be retrieved can be handled in main\
    \ memory.\n- FetchType.LAZY, implying that referenced entities are not automatically\
    \ retrieved when retrieved. In example, this means that the referenced Publisher\
    \ entity is not retrieved with a referencing Book entity, leaving the value of\
    \ the publisher property to null. With this fetching behavior, a referenced entity\
    \ has been retrieved separately by invoking the reference getter in the context\
    \ of a transaction (in our example by invoking getPublisher).\n\nIn the case of\
    \ a single-valued reference property (representing a functional association) annotated\
    \ with @OneToOne or @ManyToOne, the default value is FetchType.EAGER, so referenced\
    \ entities are fetched together with referencing entities, while in the case of\
    \ a non-functional association (with either @ToMany or @ManyToMany), the default\
    \ value is FetchType.LAZY, so referenced entities are not fetched together with\
    \ referencing entities, but have to be retrieved separately, if needed.\n\nAs\
    \ a result of JPA annotations, the following SQL table creation statement for\
    \ creating the tables is generated:\n\n```sql\nCREATE TABLE IF NOT EXISTS `books`\
    \ (\n`ISBN` varchar(10) NOT NULL,\n`TITLE` varchar(255) NOT NULL,\n`YEAR` int(10)\
    \ NOT NULL,\n`PUBLISHER_NAME` varchar(255) DEFAULT NULL\nFOREIGN KEY (`PUBLISHER_NAME`)\
    \ REFERENCES `publishers` (`NAME`)\n);\n```\n\n## 4.4.3 Code the Constraints\n\
    \nTake care that all property constraints specified in the entity class model\
    \ are properly coded using suitable Bean Validation annotations. For instance,\
    \ for the attribute name, we have to use the JPA annotation @Id for specifying\
    \ that the attribute corresponds to the primary key column of the database table\
    \ to which the entity is mapped, and the Bean Validation annotation @NotNull for\
    \ defining a mandatory value constraint that is checked before an entity is saved\
    \ to the database.\n\nIn the case of the address attribute, we have to define\
    \ a mandatory value constraint in two forms: with the JPA annotation @Column(nullable=false)\
    \ for the corresponding table column, and with the Bean Validation annotation\
    \ @NotNull for the attribute.\n\n```java\n@Id@NotNull( message=\"A name is required!\"\
    )\nprivate String name;\n```\n\n```java\n@Column( nullable=False)\n@NotNull( message=\"\
    An address is required!\")\nprivate String address;\n```\n\nNotice that, unfortunately,\
    \ the current Java EE technology requires defining the same constraint twice,\
    \ once for the database in the form of a JPA annotation, and for the Java app\
    \ in the form of a Bean Validation annotation.\n\n## 4.4.4 Code Getters and Setters\n\
    \nCode the setter operations as (instance-level) methods. The setters only assign\
    \ values and do not perform any validation, since the property constraints are\
    \ only checked before save by the Java EE execution environment. The getters simply\
    \ return the actual values of properties.\n\n## 4.4.5 Implement a Deletion Policy\n\
    \nFor reference property, we have to choose and implement a deletion policy for\
    \ taking care of the corresponding object destruction dependency in the delete\
    \ method of the reference property’s range class. In our case, we have to choose\
    \ between\n\n- deleting all books by the deleted publisher;\n- dropping from all\
    \ books published by the deleted publisher reference to the deleted publisher.\n\
    \nWe choose the second policy, which can only be used if the case of an optional\
    \ reference property such as book.publisher. This is shown in the following code\
    \ of the Publisher.delete method where all book entities concerned the property\
    \ publisher is cleared.\n\n```java\npublic static void delete(EntityManager em,\
    \ UserTransaction ut,\nString name) throws Exception {\n    ut.begin();\n    Publisher\
    \ publisher = em.find(Publisher.class, name);\n    // find All Books which has\
    \ this publisher\n    Query query = em.createQuery(\n    \"SELECT b FROM Book\
    \ b WHERE b.publisher = :name\");\n    query.setParameter(\"name\", name);\n \
    \   List<Book> books = query.getResultList();\n    // clear these books' reference\n\
    \    for (Book b: books) { b.setPublisher(null); }\n    em.remove(publisher);\n\
    \    ut.commit();\n}\n```\n\nThe method loops through all Book entities referencing\
    \ the publisher to sets its publisher property to null.\n\n## 4.4.6 Serialization\
    \ and De-Serialization\n\nBased on JPA annotations, together with suitable classes\
    \ when needed, serialization (from Java objects to table rows) as well as the\
    \ corresponding de-serialization (from table columns to Java objects) are performed\
    \ automatically.\n\n## 4.5 The View and Controller Layers\n\nThe user interface\
    \ (UI) consists of start page for navigating to data management pages and one\
    \ UI for object type. All UI pages are defined in the form of JSF files in subfolders\
    \ of WebContent. We create the Main page index.xhtml in subfolder WebContent/views/app\
    \ with the following content:\n\n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \nxmlns:ui=\"http://java.sun.com/jsf/ui\"\nxmlns:f=\"http://java.sun.com/jsf/core\"\
    >\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"\
    content\">\n<h2>Public Library</h2>\n<h:button value=\"Manage publishers\" outcome=\"\
    views/publishers/index\" />\n<h:button value=\"Manage books\" outcome=\"views/books/index\"\
    \ />\n<h:form>\n<h:commandButton value=\"Clear database\" action=\"#{appCtrl.clearData()}\"\
    \ />\n<h:commandButton value=\"Create test data\" action=\"#{appCtrl.createTestData()}\"\
    \ />\n</h:form>\n</ui:define>\n</ui:composition>\n</html>\n```\n\nIt creates the\
    \ menu buttons which provide the redirects to corresponding views. Additionally,\
    \ we need to create a corresponding AppController class which is responsible for\
    \ the creation and deletion of the test data. The controller is used to combine\
    \ code of the Publisher.createTestData and Book.clearData methods as follows:\n\
    \n```java\n@ManagedBean (name=\"appCtrl\") @SessionScoped\npublic class AppController\
    \ {\n    @PersistenceContext(unitName=\"UnidirAssocApp\")\n    private EntityManager\
    \ em;\n    @Resource\n    UserTransaction ut;\n\n    public String clearData()\
    \ {\n        try {\n            Book.clearData (em, ut);\n            Publisher.clearData\
    \ (em, ut);\n        } catch (Exception e) {\n            e.printStackTrace();\n\
    \        }\n        return \"index\";\n    }\n\n    public String createTestData()\
    \ {\n        try {\n            Publisher.createTestData (em, ut);\n         \
    \   Book.createTestData (em, ut);\n        } catch (Exception e) {\n         \
    \   e.printStackTrace();\n        }\n        return \"index\";\n    }\n}\n```\n\
    \nThe deletion of Book and Publisher data must be done in a particular order for\
    \ avoiding referential integrity violations (books have to be deleted first, before\
    \ their publishers are deleted).\n"
  mdcn: "\n56 — 4 使用 Java EE 实现单向函数关联\n\n## 4.4.2 编写实体模型中的每个类\n\nJava 实体类模型中的每个类都被编码为一个带有注解的\
    \ Bean 类，名称为 C，具有一个默认构造函数（无参数）和一个带有实体参数的构造函数。\n\n例如，实体类模型中的 `Book` 类按以下方式编码：\n\
    \n```java\n@Entity @Table( name=\"books\")\n@ViewScoped ManagedBean(name=\"book\"\
    )\npublic class Book {\n    @Id @NotNull( message=\"An ISBN is required!\")\n\
    \    private String isbn;\n    @Column(nullable=false)\n    @NotNull(message=\"\
    A title is required!\")\n    private String title;\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"A year is required!\")\n    private Integer year;\n  \
    \  @ManyToOne( fetch=FetchType.EAGER)\n    private Publisher publisher;\n\n  \
    \  public Book() {}\n    public Book(String isbn, String title, Integer year,\
    \ Publisher publisher) {\n        this.setIsbn(isbn);\n        this.setTitle(title);\n\
    \        this.setYear(year);\n        this.setPublisher(publisher);\n    }\n\n\
    \    .. // getters, setters, etc.\n}\n```\n\n`publisher` 上的 `@ManyToOne` 注解用于指定\
    \ `Book` 与 `Publisher` 关联的功能，该关联通过引用 `publisher` 表示，因为它假定一本书仅有一个出版商，而一个出版社有许多书。此注解还允许通过\
    \ `fetching` 参数指定获取类型，其取值为以下可能值之一：\n\n- `FetchType.EAGER`，意味着检索实体时会包含检索由此属性引用的关联实体。在我们的示例中，这意味着当检索一个\
    \ `Book` 实体时，由书的 `publisher` 属性引用的 `Publisher` 实体也会被检索。这种行为非常有用，每当要检索的数据可以在主内存中处理时都应该使用它。\n\
    - `FetchType.LAZY`，意味着在检索时不会自动检索引用的实体。例如，这意味着在检索引用的 `Book` 实体时，不会检索引用的 `Publisher`\
    \ 实体，使 `publisher` 属性的值保持为 `null`。通过这种获取行为，引用的实体将在事务上下文中通过调用引用 getter 方法单独检索（在我们的示例中是通过调用\
    \ `getPublisher`）。\n\n在带了 `@OneToOne` 或 `@ManyToOne` 注解的单值引用属性（表示函数关联）的情况下，默认值为\
    \ `FetchType.EAGER`，因此引用的实体会与引用实体一起被获取；而在非函数关联（使用 `@ToMany` 或 `@ManyToMany`）的情况下，默认值为\
    \ `FetchType.LAZY`，因此引用的实体不会与引用实体一起被获取，而是如果需要，则必须单独检索。\n\n作为 JPA 注解的结果，将生成用于创建表的以下\
    \ SQL 表创建语句：\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n`ISBN` varchar(10)\
    \ NOT NULL,\n`TITLE` varchar(255) NOT NULL,\n`YEAR` int(10) NOT NULL,\n`PUBLISHER_NAME`\
    \ varchar(255) DEFAULT NULL\nFOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers`\
    \ (`NAME`)\n);\n```\n\n## 4.4.3 编写约束\n\n请确保实体类模型中指定的所有属性约束都使用合适的 Bean Validation\
    \ 注解进行正确编码。例如，对于属性名称，我们必须使用 JPA 注解 `@Id` 来指定该属性对应于实体映射到的数据库表的主键，并使用 Bean Validation\
    \ 注解 `@NotNull` 来定义强制值约束，该约束会在实体保存到数据库之前进行检查。\n\n在 `address` 属性的情况下，我们必须以两种形式定义强制值约束：使用\
    \ JPA 注解 `@Column(nullable=false)` 用于对应的表列，使用 Bean Validation 注解 `@NotNull` 用于属性。\n\
    \n```java\n@Id@NotNull( message=\"A name is required!\")\nprivate String name;\n\
    ```\n\n```java\n@Column( nullable=False)\n@NotNull( message=\"An address is required!\"\
    )\nprivate String address;\n```\n\n注意，遗憾的是，目前的 Java EE 技术需要定义两次相同的约束：一次是以 JPA\
    \ 注解的形式针对数据库，另一次是以 Bean Validation 注解的形式针对 Java 应用程序。\n\n## 4.4.4 编写 Getter 和\
    \ Setter\n\n将 setter 操作编码为（实例级）方法。setter 只负责赋值，不执行任何验证，因为属性约束仅在 Java EE 执行环境在保存之前进行检查。getter\
    \ 则简单地返回属性的实际值。\n\n## 4.4.5 实现删除策略\n\n对于引用属性，我们必须选择并实现删除策略，以处理引用属性范围类 `delete`\
    \ 方法中对应的对象销毁依赖。在我们案例中，我们必须在以下之间选择：\n\n- 删除所有属于被删除出版社的书；\n- 从所有由被删除出版社出版的书中删除对被删除出版社的引用。\n\
    \n我们选择了第二种策略，该策略仅在适用于可选引用属性（如 `book.publisher`）时可以使用。这在下面的 `Publisher.delete`\
    \ 方法代码中显示，其中所有涉及 `publisher` 属性的实体实体都被清除了。\n\n```java\npublic static void delete(EntityManager\
    \ em, UserTransaction ut,\nString name) throws Exception {\n    ut.begin();\n\
    \    Publisher publisher = em.find(Publisher.class, name);\n    // 查找所有拥有此出版社的书\n\
    \    Query query = em.createQuery(\n    \"SELECT b FROM Book b WHERE b.publisher\
    \ = :name\");\n    query.setParameter(\"name\", name);\n    List<Book> books =\
    \ query.getResultList();\n    // 清除这些书的引用\n    for (Book b : books) { b.setPublisher(null);\
    \ }\n    em.remove(publisher);\n    ut.commit();\n}\n```\n\n该方法遍历引用该出版社的所有实体并将其属性设置为\
    \ `null`。\n\n## 4.4.6 序列化与反序列化\n\n基于 JPA 注解，根据需要，序列化（从 Java 对象到表行）以及反序列化（从表列到\
    \ Java 对象）会自动完成。\n\n## 4.5 视图与控制层\n\n用户界面（UI）由导航到数据管理页面的起始页面组成。所有的 UI 页面都定义在子文件夹形式的\
    \ JSF 文件中。我们在 `WebContent/views/app` 中创建主页面 `index.xhtml`，内容如下：\n\n```xml\n<!DOCTYPE\
    \ html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\nxmlns:ui=\"http://java.sun.com/jsf/ui\"\
    \nxmlns:f=\"http://java.sun.com/jsf/core\">\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h2>公共图书馆</h2>\n<h:button value=\"管理出版社\" outcome=\"\
    views/publishers/index\" />\n<h:button value=\"管理书籍\" outcome=\"views/books/index\"\
    \ />\n<h:form>\n<h:commandButton value=\"清除数据库\" action=\"#{appCtrl.clearData()}\"\
    \ />\n<h:commandButton value=\"创建测试数据\" action=\"#{appCtrl.createTestData()}\"\
    \ />\n</h:form>\n</ui:define>\n</ui:composition>\n</html>\n```\n\n它创建了指向相应视图的按钮。此外，我们需要创建一个对应的\
    \ `AppController` 类，负责测试数据的创建和删除。该控制器用于组合 `Publisher.createTestData` 和 `Book.clearData`\
    \ 方法，如下：\n\n```java\n@ManagedBean (name=\"appCtrl\") @SessionScoped\npublic class\
    \ AppController {\n    @PersistenceContext(unitName=\"UnidirAssocApp\")\n    private\
    \ EntityManager em;\n    @Resource\n    UserTransaction ut;\n\n    public String\
    \ clearData() {\n        try {\n            Book.clearData (em, ut);\n       \
    \     Publisher.clearData (em, ut);\n        } catch (Exception e) {\n       \
    \     e.printStackTrace();\n        }\n        return \"index\";\n    }\n\n  \
    \  public String createTestData() {\n        try {\n            Publisher.createTestData\
    \ (em, ut);\n            Book.createTestData (em, ut);\n        } catch (Exception\
    \ e) {\n            e.printStackTrace();\n        }\n        return \"index\"\
    ;\n    }\n}\n```\n\n书籍和出版社数据的删除必须按特定顺序进行，以避免违反引用完整性约束（必须先删除书籍，再删除其出版社）。\n\n"
