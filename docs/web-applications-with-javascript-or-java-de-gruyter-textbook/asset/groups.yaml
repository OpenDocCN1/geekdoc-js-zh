    As we can see, every table contains the direct properties as defined by the corresponding
    Java bean class. Additionally, the authors and employees tables are correlated
    with a foreign key constraint for the PERSONID column referring to the PERSONID
    column from the persons table.


    # 14.3.4 Write the View and Controller Code


    In the user interface, for every Java bean class, we have a controller class which
    contains the create, update and delete CRUD methods. The PersonController class
    is defined as abstract and contains the checkPersonIdAsId method, which inherits
    from all subclasses. The AuthorController and EmployeeController


    For every non-abstract entity class in the inheritance hierarchy we define a set
    of views corresponding to CRUD operations. For example, in the case of Author
    we have the files RetrieveAll.xhtml, create.xhtml, update.xhtml, and delete.xhtml
    in the folder WebContent/views/authors/. In the case of Employee, the Retrieve/List
    Employees use cases to display the Special type of employee column:


    ```

    <h:column>

    <f:facet name="header">Special type of employee</f:facet>

    #{e.type == null ? e.label.concat(" ").

    ```


    Notice that within EL expressions we cannot use the + (plus) operator for concatenating
    strings. EL allows the + operator to be used only for numeric addition. However,
    we can use the concat method instead.


