    \ 和 `Author` 没有任何约束，这意味着它是完全的、重叠（非互斥的）且非刚性的。\n\n对于简单的 `Manager-is-Employee` 子层级，我们使用“类层次结构合并”设计模式，并使用“连接继承”（Joined\
    \ Inheritance）方法将 `Employee-and-Author-is-a-Person` 类层次结构映射到一组通过外键依赖相互关联的数据库表。\n\
    \n在两个案例研究中，我们展示了：\n\n- 1. 如何从信息设计模型推导出 JS 类模型以及相应的实体表模型；\n- 2. 如何以 JS 模型类的形式编写\
    \ JS 类模型代码；\n- 3. 如何基于模型代码编写视图和控制器代码。\n\n## 13.1 使用基于构造函数的类的 JavaScript 进行子类型化\n\
    \n在 ES2015 版本之前，JavaScript 并没有显式的类概念，且不支持支持子类型化，它必须借助某些代码模式的帮助来实现，提供两种继承机制：(1)\
    \ 属性继承和 (2) 方法继承。\n\n正如我们在第一卷第 1 章中解释的那样，类可以通过两种替代方式定义：基于构造函数的和基于工厂的。这两种方法都有各自实现继承的方式。\n\
    \n我们通过以下示例总结了在 ES2015 中用于在基于构造函数的单继承类层级结构中定义父类和子类的代码模式：\n\n| Person | |\n| :---\
    \ | :--- |\n| firstName | String |\n| lastName | String |\n| Student | |\n| studNo\
    \ | Integer |\n\n然后，我们定义一个基类 `Person`，带有两个属性 `firstName` 和 `lastName`，并用 getter\
    \ 和 setter 定义：\n\n```javascript\nclass Person {\n  constructor ({first, last})\
    \ {\n    // 通过调用 setter 分配属性\n    this.firstName = first;\n    this.lastName =\
    \ last;\n  }\n  getFirstName () {return this._firstName};\n  setFirstName (f)\
    \ {\n    . . . 检查约束\n    this._firstName = f;\n  }\n  getLastName () {return this._lastName};\n\
    \  setLastName (l) {\n    . . . 检查约束\n    this._lastName = l;\n  }\n}\n```\n\n\
    然后，我们定义一个子类 `Student`，多了一个额外属性 `studNo`：\n\n```javascript\nclass Student extends\
    \ Person {\n  constructor ({first, last, studNo}) {\n    // 调用父类的构造函数\n    super({first,\
    \ last});\n    // 分配额外属性\n    this.studNo = studNo;\n  }\n\n  get studNo () {return\
    \ this._studNo;}\n  set studNo (sn) {\n    // 检查约束\n    this._studNo = sn;\n \
    \ }\n}\n```\n\n注意父类构造函数是如何调用的：使用 `super({{first, last}})`。\n\n## 13.2 案例研究 1：消除类层次结构\n\
    \n通过应用“类层次结构合并”设计模式可以消除简单的类层级结构。我们案例研究的起点是图 12.1 所示的简单类层级结构，它代表了将 `Book` 划分为 `TextBook`\
