    \ an HTMLCollection is iterable\nfor (let dEl of divElems) {\n console.log(dEl.id);\n\
    }\n```\n\nA *for-of* loop is often more handy than a *for* loop whenever a counter\
    \ variable is not needed. As opposed to a *forEach* loop, a *for-of* loop allows\
