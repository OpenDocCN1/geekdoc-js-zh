    \ {\n      this.addAuthor(a[idRef]);\n    }\n  }\n}\n```\n\n### 3.2 Make a JS\
    \ Class Model\n\nIn JS, a collection-valued reference property can be implemented\
    \ in two ways:\n1. having an array list (JS array) as its value,\n2. having a\
    \ map as its value, when the values of the object's standard ID attribute are\
    \ the keys, which are mapped to internal JS object references.\n\nWe prefer using\
    \ maps for set-valued reference properties since they guarantee that each element\
    \ is unique, while with an array we would have to prevent duplicate elements.\
