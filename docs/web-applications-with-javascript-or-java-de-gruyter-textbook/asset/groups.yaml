    \ 注意事项\n\n我们仍然在模型层中针对每个类和每个属性包含了重复性的代码结构（称为样板代码），用于约束验证（检查和设置器），并针对每个类用于数据存储管理方法\
    \ `add`、`update` 和 `destroy`。虽然在学习应用开发时编写几次这些代码是有好处的，但在处理实际项目时，你不希望反复编写它们。为了避免重复的样板代码，需要这些方法的泛型形式，以便它们可以在应用的所有模型类中重用。例如，`classjs`\
    \ 库就提供了这种方法。\n\n## 4 使用 Java EE 实现单向功能关联\n\n单向功能关联可以是一对一的也可以是对一的。在这两种情况下，这种关联都是通过单值引用属性辅助表示或实现的。\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从具有表示单向功能关联的单值引用属性的 OO 类模型，推导出 Java 实体类模型形式的数据模型；\n- 2.\
    \ 如何以实体类的形式编写 Java 实体类模型（实现模型类）；\n- 3. 如何基于实体类编写视图和控制器代码。\n\n## 4.1 在 Java 中实现单值引用属性\n\
    \n单值引用属性（例如 `Book` 类型对象的 `publisher`）允许存储对另一种类型对象（如 `Publisher`）的内部引用。（*注：原文此段存在大量重复的句子，翻译时已根据语意合并处理*）\n\
    \n```java\n@Entity\n@Table(name=\"books\")\n@ViewScoped\npublic class Book {\n\
    \n    private Publisher publisher;\n\n    public Book() {}\n\n    public Book(String\
    \ isbn, String title, Integer year,\n        Publisher publisher) {}\n\n    public\
    \ Publisher getPublisher() {\n        return publisher;\n    }\n\n    public void\
    \ setPublisher(Publisher publisher) {\n        this.publisher = publisher;\n \
    \   }\n}\n```\n\n## 4.2 创建 Java 实体类\n\n创建 Java 类的起点是像图 10 所示的 OO 模型。如前所述，我们通过以下方式获取实体类：(1)\
    \ 将所有属性设为私有；(2) 使用 `String`、`Integer` 等；(3) 添加公共 getter 和 setter；(4) 添加 `toString`；(5)\
    \ 添加检索、更新和删除的类级方法：\n\n| Java Entity |\n| :--- |\n| Book |\n| <get/set>-isbn[1]\
