    \    document.getElementById(\"Publisher-M\").style.display = \"none\";\n    document.getElementById(\"\
    Publisher-R\").style.display = \"block\";\n  }\n};\n```\n\n## 9 使用 Java EE 实现双向关联\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从 OO 类模型（派生自信息设计模型）导出 Java 实体模型，\n- 2. 如何以实体类（表示模型类）的形式编写实体模型，\n\
    - 3. 如何基于实体类编写视图和控制器代码。\n\n## 9.1 创建 Java 实体模型\n\n创建 Java 实体模型的起点是一个带有派生反向属性的\
