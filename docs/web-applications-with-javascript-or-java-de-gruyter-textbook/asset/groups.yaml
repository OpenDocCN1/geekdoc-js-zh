    \  bookStr += \", biography:\" + this.about;\n      break;\n  }\n  return bookStr\
    \ + \")\";\n}\n```\n\n在模型类的 `update` 方法中，我们只在属性被更新时才进行设置，即相应的参数与旧属性值不同。在带有 `FrozenConstraint`\
