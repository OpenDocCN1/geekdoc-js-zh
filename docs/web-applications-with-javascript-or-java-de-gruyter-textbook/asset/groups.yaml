    \ 属性具有代表相应分段的值时才能为该属性赋值。我们在稍后讨论如何编写 JS 类模型代码时，更详细地解释这种验证语义。\n\n这引出了图 13.1 所示的\
    \ JS 类模型，其中类级（'static'）方法是未定义的：\n\n| Book | «enumeration» |\n| :--- | :--- |\n\
    | isbn[1] : String (id) | <<enumeration> |\n| title[1] : String | BookTypeEL |\n\
    | year[1] : Integer | TextBook |\n| category[0..1] : BookTypeEL(frozen) | Biography\
    \ |\n| subjectArea[0..1] : String | |\n| about[0..1] : String | |\n\n**图 13.1:**\
    \ Book 类的 JS 类模型。\n\n### 13.2.2 新问题\n\n与第一卷第 11 章讨论的枚举相比，我们必须处理许多新问题：\n\n- 1.\
    \ 在模型代码中，我们需要：\n- 2. 添加 `FrozenViolation` 约束类。\n- 3. 编写用于 `category` 属性范围的枚举类型\
