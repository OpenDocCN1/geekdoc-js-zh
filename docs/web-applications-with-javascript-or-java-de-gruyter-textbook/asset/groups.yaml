    ## 12.1 Subtyping and Inheritance


    When specializing an object type, we define additional features for the newly
    added subtype. In many cases, these additional features are more specific properties.
    For instance, in the case of TextBook specializing Book, we define the additional
    attribute subjectArea. In some programming languages, such as in Java, it is said
    that the subtype extends the supertype.


    However, we can also specialize an object type without defining additional properties
    or operations/methods, but by defining additional constraints.


    ## 12.2 Introducing Supertypes by Generalization


    We illustrate generalization with the example shown in Figure 12.2.


    | Employee | | Book | Author |

    | :--- | :--- | :--- | :--- |

    | employeeNo : Integer (id) | | isbn : String (id) | authorId[1] : Integer (id)
    |

    | name : String | | title : String | name[1] : String |

    | dateBirth : Date | | year : Integer | dateBirth[1] : Date |

    | salary : Decimal | | | dateDeath[0..1] : Date |

    | address : String | 0..1 | * | biography[1] : Text |


    **Figure 12.2:** The object types Employee and Author share several attributes.


    After adding the type Employee we notice that Employee and Author share a number
    of attributes due to the fact that both employees and authors are people, and
    being an employee as well as an author are roles played by people. So, we may
    generalize these two object types by adding a joint supertype Person, as shown
    in the diagram of Figure 12.3.


    When generalizing two or more object types, we move those features that are shared
    by them to the newly added supertype where they are centralized. In the case of
    Employee and Author, this set of shared features consists of the attributes name,
    dateBirth and dateDeath. In general, shared features may include attributes, associations
    and constraints.


    Notice that since in an information design model, each top-level class needs to
    have a standard identifier, in the new class Person we have declared the standard
    identifier attribute personId, which is inherited by all subclasses. Therefore,
    we have to reconsider the attributes that had been declared as standard identifiers
    in the subclasses before the generalization. In the case of Employee, we had declared
    the attribute employeeNo as a standard identifier. Since the employee is an important
    business information item, we have to keep this attribute, even if it is no longer
    the standard identifier. Because it is an alternative identifier (a "Key"), we
    define a uniqueness constraint for it with the constraint keyword key.


    In the case of Author, we had declared the attribute authorId as a standard identifier.
    Assuming that this represents a purely technical, rather than business, information
    item, we dropped it, since it is no longer needed as an identifier for authors.
    Consequently, we ended up with a model which allows to identify employees either
    by their employee number or by their personId value, and to identify authors by
    their personId.


    We consider the following extension of our original example model, shown in Figure
    12.4:


    - 1. the disjoint (but incomplete) segmentation of Book into TextBook and Biography,

    - 2. the overlapping and incomplete segmentation of Person into Author and Employee,
    which is further specialized by Manager.


    | Employee | Person |

    | :--- | :--- |

    | employeeNo: Integer (key) | personId[1]: integer (id) |

    | salary : Decimal | name[1]: String |

    | | dateBirth[1]: Date |

    | | dateDeath[0..1]: Date |


    | published | Book | authored |

    | :--- | :--- | :--- |

    | Publisher | Books | Books |

    | name : String (id) | isbn: String (id) | Author |

    | address : String | title : String | biography : Text |

    | | 0.1 * | year: Integer * |


    **Figure 12.3:** The object types Employee and Author are generalized by the common
    supertype Person.


    ## 12.3 Intension versus Extension


    The **intension** of an object type is given by the set of its features, including
    attributes, associations, constraints and operations.


    The **extension** of an object type is the set of all objects instantiating the
    object type. The extension of an object type is also called its *population.*


    ![](img/64ab58e459ff4b56e7fc22fe399651a42.png)

    **Figure 12.4:** An information model with class hierarchies.


    We have the following duality: while all features of a supertype are included
    in the intentions, or feature sets, of its subtypes (intensional inclusion), all
    instances of a subtype are included in the extensions, or instance sets, of its
    supertypes (extensional inclusion). This formal structure has been investigated
    in formal analysis.


    Due the intention/extension duality we can specialize a given type in two ways:


    - 1. By extending the type’s intention through adding features in the new subtype
    (such as adding the attribute subjectArea in TextBook).

    - 2. By restricting the type’s extension through adding a constraint (such as
    defining a subtype where the attribute subjectArea has the value “Mathematics”).


    Typical OO programming languages, such as Java and C#, only support the first
    possibility (specializing a given type by extending its intention), while XML
    Schema and SQL also support the second possibility (specializing a given type
    by restricting its extension).


    ## Type Hierarchy


    A type hierarchy (or class hierarchy) consists of two or more types, one of them
    being the root (or top-level) type, and all others having at least one supertype.


    When all non-root types have a unique supertype, the type hierarchy is a single-inheritance
    hierarchy, otherwise it''s a multiple-inheritance hierarchy. For instance, in
    Figure 12.5 below, the class Vehicle is the root of a single-inheritance hierarchy,
    while Figure 12.6 shows an example of multiple-inheritance hierarchy due to the
    fact Vehicle has two direct superclasses: LandVehicle and WaterVehicle.


    ![](img/64ab58e459ff4b56e7fc22fe399651a430.png)

    **Figure 12.5:** A class hierarchy having the root Vehicle.


    The simplest case of a class hierarchy, which has only one level of subtyping,
    is called a generalization in UML but may be more naturally called segmentation.
    A segmentation is complete when the union of all subclasses extends to the extent
    of the superclass (or, in words, if all instances of the superclass instantiate
    some subclass). A segmentation is disjoint if all subclasses are pairwise disjoint
    (or, in words, no instance of the superclass instantiates more than one subclass).
    Otherwise, it is called overlapping. A complete and disjoint segmentation is a
    partition.


    ![](img/64ab58e459ff4b56e7fc22fe399651a431.png)

    **Figure 12.6:** A multiple inheritance hierarchy.


    In a class diagram, we can express these constraints by annotating the shared
    generalization arrow with the keywords complete and disjoint enclosed in braces.
    For instance, the annotation of a segmentation with {complete, disjoint} indicates
    that it is a partition. By default, whenever a segmentation does not have any
    annotation like the segmentation of Vehicle into LandVehicle and WaterVehicle
    in Figure 12.6 above, an information model may contain any number of class hierarchies.


    ## 12.5 Kinds and Roles


    In order to better understand the different categories of object types and subtypes
    in natural language statements about the real world and in information models,
    we can distinguish between sortal and non-sortal, and between rigid and non-rigid
    object types, as presented by Giancarlo Guizzardi in his theory of object type
    categories presented in Chapter 4 of Ontological foundations for structural models.


    An object type is sortal if it has a uniform identity for its instances. Such
    a condition defines the property (or set of properties) that no instances have
    in common, without being the same object. An example of a sortal object type is
    Person since all its instances (people) are identifiable by a set of properties
    related to their birth (born when, and to whom). Book is an example of a non-sortal
    object type because it contains instances (e.g., textbooks and self-published
    novels) that are identified in different ways.


    An object is rigid if its instances cannot cease to be of that type ceasing to
    exist (or altering their identity). Person is an example of a rigid object type,
    while Employee is not rigid. A segmentation is called rigid if all segment classes
    are rigid.


    A kind is a rigid sortal object type. Examples of kinds are Textbook and Person.
    Role is a sortal object type R classifying all instances of a kind K that participate
    in a relationship (of a certain type A) with an instance of object type O. Notice
    R is a non-rigid subtype of K since its instances do not cease to exist when happen
    to cease instantiating R because they no longer participate in a relationship
    of A with an instance of type O.


    For instance, Employee is an example of a role since it is a sortal object type
    classifying all instances of Person that participate in an employment relationship
    with an instance of type Enterprise.


    ## 12.6 The Class Hierarchy Merge Design Pattern


    Consider the simple class hierarchy of the design model in Figure 12.1 above,
    showing disjoint segmentation of the class Book. In such a case, whenever there
    is only one level (or there are only a few levels) of subtyping and each subtype
    has only one (or a few) additional properties, it''s an option to re-factor the
    class hierarchy by merging all the additional properties of subclasses into an
    expanded version of the supertype.

