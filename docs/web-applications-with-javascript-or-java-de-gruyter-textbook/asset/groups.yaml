    | | name : String |


    This model contains, in addition to the single-valued reference property Book::publisher
    representing the unidirectional many-to-one association *Book-has-Publisher*,
    the multi-valued reference property Book::authors representing the unidirectional
    many-to-many association *Book-has-Author*.


    Recall that we obtain a Java Entity class, like Author, from the corresponding
    class in the OO class model, by (1) making all properties private, (2) using Java
    data-type classes, (3) adding public getters and setters, (4) adding a toString
    function, (5) adding the data storage methods *create, retrieve, update and delete*:


    | «Java Entity» Author |

    | :--- |

    | /get/set--personid : Integer (id) |

    | /get/set--name : String |

    | +checkPersonIdAid(in pid : Integer, in em : EntityManager) : ConstraintViolation
    |

    | +toString() : String |

    | +(...) |


    In the Java Entity class model, any reference property specified in the OO class
    model is annotated with the functionality type of the association represented
    by it.'
