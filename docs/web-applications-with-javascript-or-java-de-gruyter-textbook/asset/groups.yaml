    # 4.2 Make a Java Entity Class Model


    The starting point for making a Java Entity class model is an OO class model like
    the one shown in Figure 1.10.

    As explained before, we obtain the Entity class Publisher from the corresponding
    OO design class by (1) making all properties private, (2) using Java data-type
    classes (String, Integer, etc.), (3) adding the stereotype «get/set» to properties
    (specifying public getters and setters), (4) adding to toString function, (5)
    adding the (class-level) data storage methods to retrieve, update and delete:


