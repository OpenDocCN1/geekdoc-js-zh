    An object class representing an inseparable component type, like Chapter, does
    not need to have a standard identifier attribute because there is no need for
    inseparable components to be referenced independently of their composite object.
    For referencing inseparable components, a composite key that is composed of the
    primary key of the composite type and a suitable (relatively unique) attribute
    of the component type is used. For instance, a textbook chapter is referenced
    by a combination of the textbook''s ISBN and the chapter''s sequence number.


    Since Chapter objects, as inseparable components of Textbook objects, cannot continue
    to exist when their Textbook ceases to exist, we need not use the CASCADE deletion
    policy, requiring to delete all associated chapters with deleting a textbook,
    in the implementation of the Delete Textbook object.


    An inseparable component type does not require its own CRUD data user interfaces.
    Rather, all CRUD operations are provided within the data management user interfaces
    of its composite type. For instance, creating, retrieving, updating and deleting
    textbook chapters is done within the user interfaces for managing textbook data.


    ## 10.2 Association Classes


    An association class is a class that represents an association.


    Recall that simple associations are eliminated in an OO class model by turning
    them into reference properties of the involved object classes, as shown in 1.7.
    But whenever an association has attributes, it cannot be eliminated and has to
    be turned into a class in an OO class model.


    As an example, consider the association Reservation over the object types Book
    and Person, allowing to express facts “the book with ISBN 3627921105 has a reservation
    by the person with ID 4701199 on 2020-08-22”. Since it has an attribute date,
    this association is modeled as an association class in an information design model,
    as shown in the following class diagram:


    | Reservation | | | Person |

    | --- | --- | --- | --- |

    | date : Date | * | * | |

    | Book | | | |

    | isbn : String (id) | | reserved_by | id : Integer (id) |

    | title : String | | | name |

    | year : Integer | | | |


    In an OO class model, which is the basis for coding the model classes of an app,
    association classes are turned into ordinary classes, with reference properties
    that reference the involved object classes. For instance, the association class
    Reservation is transformed into the following OO model class:


    | Reservation |

    | --- |

    | book : Book |

    | reserved_by : Person |

    | date : Date |


