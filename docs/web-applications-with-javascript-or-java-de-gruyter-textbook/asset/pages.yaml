  md: '# 13 Subtyping with Plain JS


    In this chapter, we first explain the general approach to constructor-based subtyping
    in JavaScript before presenting two case studies based on fragments of the information
    model of our running example, the Public Library app, shown above.


    In the first case study, we consider the single-level hierarchy with root Book
    shown in Figure 12.1, which an incomplete disjoint rigid segmentation. We use
    the Class Hierarchy Merge design pattern for re-factoring this simple hierarchy
    to a single class that can be mapped to a persistent database table.


    In the second case study, we consider the multi-level hierarchy consisting of
    the Person roles Employee, Manager and Author, shown in Figure 12.8. The segmentation
    of Person into Employee and Author does not have any constraints, which means
    that it is complete, overlapping (non-disjoint) and non-rigid.


    We use the Class Hierarchy Merge design pattern for the simple Manager-is-Employee
    sub-hierarchy, and the Joined Inheritance approach for mapping the Employee-and-Author-is-a-Person
    class hierarchy to a set of three database tables that are related with each other
    via foreign key dependencies.


    In both case studies we show


    +   1. how to derive a JS class model, and a corresponding entity table model,
    from the information design model,

    2. how to code the JS class model in the form of JS model classes,

    3. how to write the view and controller code based on the model code.


    # 13.1 Subtyping with JavaScript with Constructor-Based Classes


    Before the version ES2015, JavaScript did not have an explicit class concept and
    subtyping was not directly supported, it had to be implemented with the help of
    certain code patterns providing two inheritance mechanisms: (1) inheritance of
    properties and (2) inheritance of methods.


    As we have explained in Chapter 1 of Volume 1, classes can be defined in two alternative
    ways: constructor-based and factory-based. Both approaches have their own way
    of implementing inheritance.'
