    # 14.3.3.2 Database Schema for Joined Table Class Hierarchy


    As a result of the annotation


    ```

    @Inheritance(strategy = InheritanceType.JOINED)

    ```


    for each class in the inheritance hierarchy, one database table is created. The
    corresponding SQL-DDL scripts generated by JPA to create the persons, authors
    and employees tables are shown below:


    ```

    CREATE TABLE IF NOT EXISTS ''persons'' (

    `PERSONID` int(11) NOT NULL,

    `category` varchar(16) DEFAULT NULL,

    `NAME` varchar(255) NOT NULL

    );

    CREATE TABLE IF NOT EXISTS ''authors'' (

    `PERSONID` int(11) NOT NULL,

    `BIOGRAPHY` varchar(255) DEFAULT NULL

    );

    ADD CONSTRAINT `FK_authors_PERSONID` FOREIGN KEY (`PERSONID`)

    REFERENCES ''persons'' (`PERSONID`);

    CREATE TABLE IF NOT EXISTS ''employees'' (

    `PERSONID` int(11) NOT NULL,

    `DEPARTMENT` varchar(64) DEFAULT NULL,

    `EMPNO` int(11) NOT NULL,

    `TYPE` varchar(32) DEFAULT NULL

    );

    ADD CONSTRAINT `FK_employees_PERSONID` FOREIGN KEY (`PERSONID`)

    REFERENCES ''persons'' (`PERSONID`);

    ```'
