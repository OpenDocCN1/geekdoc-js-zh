  md: '# 10 Special Topics on Associations


    # 10.1.2 Composition


    It''s amazing how much confusion exists about the distinction between the part-whole
    association concepts aggregation and composition. The main problem is the widespread
    misunderstanding (even among expert software developers and among authors of UML)
    that the concept of composition implies a life-cycle dependency between the whole
    and its parts that the parts cannot exist without the whole. But this view ignores
    the fact that there are also cases of part-whole associations with non-shareable
    parts where the parts can be detached and survive the destruction of the whole.


    In the Specification document, the definition of the term "composition" has always
    implied non-shareable parts, but it has not clear what is the defining characteristic
    of "composition", and what is merely an optional characteristic. Even in the UML
    version 2.5 (as of 2015), after an attempt to provide the definition of the term
    "composition", it remains still ambiguous and does not provide any guidance how
    to model part-whole associations with non-shareable parts where the parts can
    be detached from, and survive the destruction of, the as opposed to the case where
    the parts cannot be detached and are destroyed together with the whole. They say:


    If a composite object is deleted, all of its parts are objects that are deleted
    with.


    At the same time they also say:


    > A part may be removed from a composite object before the composite object is
    deleted, and thus not deleted as part of the composite object.


    This confusion points to an incompleteness of the UML definition, which does not
    account for life-cycle dependencies between components and composites. It''s therefore
    important to understand how the UML definition can be enhanced, e.g. by introducing
    a UML stereotype for "inseparable" compositions, or by introducing a key word
    inseparable for characterizing the association end at the component side.


    Martin Fowler explained, the main issue for characterizing composition relationships
    is that "an object can only be the part of composition relationship". This is
    also explained in the blog post UML Composition with Aggregation as Association
    by B. Bellelekens. In addition to defining this characteristic of a composition
    (to have exclusive, or non-shareable, parts), a composition may also come with
