    retrieveAll() : Employee[] ...n() |


    | Author |

    | <get/set> biography : String |

    | toString() : String

    | create(in pid : Integer, in name : String, in bio : String) retrieveAll() :
    Author[] ...() |


    (disjoint, complete)


