    \ example above is derived on update from the property chair.\n\nIn the case of\
    \ a derived reference property, we have to deal with life-cycle dependencies between\
    \ the affected model classes requiring special change management mechanisms based\
    \ on the functionality of the represented association (either one-to-one, many-to-one\
    \ or many-to-many).\n\nIn our example of the derived inverse property ClubMember::chairedCommittee,\
