    An ordered association should not represent any ordering based on the properties
    of the target class. In our example, this implies that the ordering of the authors
    of a book should, for example, not represent their alphabetical ordering, but
    rather it should represent information that is not available via the properties
    of Author. This is, indeed, the case, since it represents some sort of significance,
    which is not expressed by any property.


    Notice that ordered association ends in design models are just transformed into
    an unordered one by adding one or more attributes to the association''s target
    class, such that these attributes'' values can be used for the ordering. Ordered
    association ends allow a more concise information model, and a more efficient
    implementation, by not requiring the ordering explicit with the help of auxiliary
    ordering attributes.


    The two important types of collections for multi-valued reference properties are
    sets and ordered sets, while use cases for bags (multi-sets) and sequences (ordered
    multi-sets) the collection type of a multi-valued reference property is bag (or
    sequence), this can be expressed in the class diagram with the help of the annotation
    {nonunique} or {ordered, nonunique} in the annotation of the association end or
    property modifier.


    Notice, that it is quite common to use lists (such as JS arrays or the Java interface
    type List) as the range of multi-valued reference properties, both for ordered
    and unordered properties.


