    @Entity @Table( name=\"books\")\n@ViewScoped ManagedBean(name=\"book\")\npublic\
    \ class Book {\n    @Id @NotNull( message=\"An ISBN is required!\")\n    private\
    \ String isbn;\n    @Column(nullable=false)\n    @NotNull(message=\"A title is\
    \ required!\")\n    private String title;\n    @Column(nullable=false)\n    @NotNull(message=\"\
    A year is required!\")\n    private Integer year;\n    @ManyToOne( fetch=FetchType.EAGER)\n\
    \    private Publisher publisher;\n\n    public Book() {}\n    public Book(String\
    \ isbn, String title, Integer year, Publisher publisher) {\n        this.setIsbn(isbn);\n\
    \        this.setTitle(title);\n        this.setYear(year);\n        this.setPublisher(publisher);\n\
    \    }\n\n    .. // getters, setters, etc.\n}\n```\n\nThe @ManyToOne annotation\
    \ on the publisher is used for specifying the functionality of the association\
    \ Book has Publisher represented by the reference publisher since it holds that\
    \ a book has one publisher and a publisher has many books. This annotation also\
    \ allows to specify a fetch type with the parameter fetching one of the following\
    \ possible values:\n\n+   - FetchType.EAGER, implying that a retrieval of an entity\
    \ includes a retrieval of the associated entity referenced by this property. In\
    \ our example, this means that when a Book entity is retrieved, the Publisher\
    \ entity referenced by the book's publisher property is also retrieved. This behavior\
    \ is very"
