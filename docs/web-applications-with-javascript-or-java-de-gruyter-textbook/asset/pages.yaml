    Figure 12.5: A class hierarchy having the root class Vehicle.


    The simplest case of a class hierarchy, which has only one level of subtyping,
    is called a generalization set in UML, but may be more naturally called segmentation.
    A segmentation is complete, or when the union of all subclasses extends to the
    extent of the superclass (or, in other words, if all instances of the superclass
    instantiate some subclass). A segmentation is disjoint, if all subclasses are
    pairwise disjoint (or, in other words, no instance of the superclass instantiates
    more than one subclass). Otherwise, it is called overlapping. A complete and disjoint
    segmentation is a partition.


