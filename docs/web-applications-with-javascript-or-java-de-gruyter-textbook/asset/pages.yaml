    \ is invoked and the property is only set/unset, if the check does not detect\
    \ any constraint violation.\n3. Write the code of the serialization function toString()\
    \ and the storage conversion function toRecord().\n4. Take care of deletion dependencies\
    \ in the destroy method.\n\nThese steps are discussed in more detail in the following\
    \ sections."
