  md: "In a UML class diagram, the derivation of a property can be specified by an\
    \ OCL derive that evaluates the value of the derived property for a given object.\
    \ In the case of a property being the inverse of another property, specified by\
    \ the constraint expression (inverse of anotherProperty) appended to the property\
    \ declaration, the derivation expression is implied. In our example, for any club\
    \ member m, it evaluates to the committee c such that c.chair = m. In OCL, this\
    \ derivation would be expressed as follows: \n\n```\nClubMember::chairedCommittee:\
    \ Committee\nif Committee.allInstances().exists(c | c.chair = self) then c\n```\n\
    \nThere are two ways to realize the derivation of a property: it may be derived\
    \ via a read-time computation of value, or it may be derived on update via an\
    \ update-time computation performed whenever one of the variables in the derivation\
    \ expression (typically, another property) changes its value. The latter corresponds\
    \ to a materialized view in a database. While a reference property that is derived\
    \ on read may not guarantee efficient navigation, the on-read property that is\
    \ derived on update does provide efficient navigation.\n\nWhen we designate an\
    \ inverse property as derived by prefixing it with a slash (/), we indicate that\
