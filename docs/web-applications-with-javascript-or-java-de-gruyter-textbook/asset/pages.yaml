  md: '# 7.2 Making an OO Class Model 87


    associations, we first have to turn them into directed ones by making a decision
    on the ownership of their ends, which is typically based on navigability requirements.


    Notice that both associations in the Publisher-Book-Author information design
    model, publisher-publishedBooks and authoredBooks-authors (or Authorship), are
    bidirectional as indicated by the ownership dots at association ends. For eliminating
    all explicit associations from an information design model, we have to perform
    the following steps:


    +   1. Eliminate unidirectional associations, connecting a source with a target
    class, by replacing them with a reference property in the source class such that
    the target class is its range.


    +   2. Eliminate bidirectional associations by replacing them with a pair of mutually
    inverse reference properties.


    # 7.2.2 How to Eliminate Unidirectional Associations


    A unidirectional association connecting a source with a target class is replaced
    with a corresponding reference property in its source class having the target
    class as its range. Its multiplicity is the same as the multiplicity of the target
    association end. Its name is the name of the association end, if there is, otherwise
    it is set to the name of the target class (possibly pluralized, if the reference
    property is multi-valued).


    # 7.2.3 How to Eliminate Bidirectional Associations


    A bidirectional association, as the authorship association between the classes
    Book and Author in the model shown in Figure 7.1 above, is replaced with a pair
    of mutually inverse reference properties, such as Book::authors and Author::authoredBooks.
    Since both properties represent the same information (the same set of binary relationships),
    it''s an option to consider one of them the “master” and the other the “slave”,
    which is derived from the master. We discuss the cases of a-to-one and a many-to-many
    association


    +   1. In the case of a bidirectional one-to-one association, which leads to a
    pair of mutually single-valued reference properties, in each of the two associated
    classes. Since both of them represent essentially the same information (the same
    links/relationships), one has to choose which of them is considered the master
    property, such that the other is the slave property, which is derived from the
    master property by inversion. In the class diagram, the slave property is designated
    as a *derived property* that is automatically updated whenever 1) a new master
    object is created, 2) the master reference property is updated, or 3) a master
    object is destroyed. This transformation is illustrated in Figure 7.2.'
