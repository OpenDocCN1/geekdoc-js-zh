  md: "# 3 Implementing Unidirectional Non-Functional Associations with Plain JS\n\
    \nA unidirectional non-functional association is either one-to-many or many-to-many.\
    \ In both cases such an association is represented, implemented, with the help\
    \ of a multi-valued reference property.\nIn this chapter, we show\n\n+   1. how\
    \ to derive a JS class model from an OO class model with multi-valued reference\
    \ properties representing unidirectional non-functional associations,\n2. how\
    \ to code the JS class model in the form of JavaScript model classes,\n3. how\
    \ to write the view and controller code based on the model code.\n\n# 3.1 Implementing\
    \ Multi-Valued Reference Properties\n\nA multi-valued reference property, such\
