    Compared to the unidirectional association app discussed before, we have to deal
    with a new of new technical issues:


    +   1. In the model code you now have to take care of maintaining the derived
    inverse reference properties by maintaining the derived (sets) of inverse references
    that form the values of a derived inverse reference property. In particular that

    2. whenever the value of a single-valued master reference property is initialized
    or updated with the help of a setter (such as assigning a reference to an Publisher
    instance p to.publisher for a Book instance b), an inverse reference has to be
    assigned or added to the corresponding value of the derived inverse reference
    property (such as adding b to p.publishedBooks); when the value of the master
    reference property is updated and the derived inverse reference property is multi-valued,
    the obsolete inverse reference to the previous value of the single-valued master
    reference property to be deleted;

    3. whenever the value of an optional single-valued master reference property is
    unset (e.g. by assigning null to b.publisher for a Book instance b), the inverse
    reference has to be removed from the corresponding value of the derived inverse
    reference property (such as removing b from p.publishedBooks), if the derived
    inverse reference property is multi-valued, otherwise the corresponding value
    of the derived inverse reference property has to be unset or updated;

    4. whenever a reference is added to the value of a multi-valued master reference
    property with the help of an add method (such as adding an Author reference to
    b.authors for a Book instance b), an inverse reference has to be assigned or added
    to the corresponding value of the inverse reference property (such as adding b
    to a.authoredBooks);

    5. whenever a reference is removed from the value of a multi-valued master reference
    property with the help of a remove method (such as removing a reference to an
    Author instance from b.authors for a Book instance b), the inverse reference has
    to be removed from the corresponding value of the derived inverse reference property
