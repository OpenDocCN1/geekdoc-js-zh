    ## 2.1\. Use CSS Selectors to Style Elements


    Why don''t we start with a quick recap of what HTML, CSS and JavaScript each does?
    The idea here is comparing HTML, CSS and JavaScript to different parts of grammar
    where we have nouns, adjectives and verbs.


    **HTML** is the **noun** - like the button or heading of a form. **CSS** is the
    **adjective** which *describes* the noun – like the size of the button (e.g. a
    *large* button). **Javascript** is the **verb** - the *action* that the noun performs
    – like a button that constantly flashes colors or looks depressed when it’s clicked.


    CSS stands for **Cascading Style Sheet**. The style sheet portion I think is relatively
    self-explanatory because we’re using CSS to style contents. The cascading part
    is something we will come back to once you’ve learned a bit more. So just to recap,
    CSS is a language (not necessarily a programming language) that we can use to
    just describe the appearance or the visual representation of our documents.


    With CSS, there are hundreds of CSS properties you can use to change the way an
    element looks on your page. The beauty of all of this is that you don''t need
    to hold it all in your head. Nobody expects you to be a master of every single
    property.


    The ones that you use the most you''ll just naturally come to remember. But the
    ones you don''t frequently use you''ll just pick up. Just focus on the syntax,
    the patterns and being able to access information if you need it, but not cramming
    it all into your head at once.


    MDN does have CSS reference. You can find information when you need it at [https://developer.mozilla.org/en-US/docs/web/CSS/reference](https://developer.mozilla.org/en-US/docs/web/CSS/reference).
    So, let''s begin.


    Whenever we write CSS, we''re writing CSS rules. They look something like Figure
    2.1.0.


    ![Image](images/image-43.jpeg)


    Figure 2.1.0A: The basic pattern of CSS


    This is the basic pattern or template. We have something called a selector and
    then curly braces { and } and then property , colon : , value and a semicolon
    ; . For example, here is how we would make an h1 element on our page purple:


    h1 {


    color: purple;


    }


    Here’s another example. To make **all image elements** on our page 100 pixels
    wide and 200 pixels tall, we would write


    img {


    width: 100px;


    height: 200px;


    }


    Here''s a much more complex one, but it still follows the same pattern:


    Input[type=”text”]:nth-of-type(2n){


    border:2px solid red;


    }


    This input selector is selecting every other text input and applying a solid red
    color with a border of 2 pixels to it. In other words, this CSS code is saying,
    where we have only text-type inputs, we want to select every second one and apply
    a solid red color with a border of 2 pixels to it. See the output of this code
    in Figure 2.1.0B.


    ![Image](images/image-44.jpeg)


    Figure 2.1.0B: An example of a complex CSS selector


    What is inline CSS?


    When you entered <h2 style="color: red;">CatPhotoApp</h2> in the previous lesson,
    you were styling that individual h2 element with inline CSS. Here’s another example.
    Enter it in your new index.html file and run it. It should display a pale green
    button on your index page.


    <button style="background-color:palegreen;">I am Button</button>


    If we had another button on our website, often we want them to be branded and
    styled the same way. So, if we want this button to have green or pale green text,
    I have to duplicate the code snippet above. Also, if we decide we don''t want
    pale green anymore but forest green, we’ll have to change that style in two places.


    On a real website, we might have a dozen or more buttons. We''d have to change
    them all individually. Also, we can''t share these styles between documents. For
    example, we might have 10 different pages or HTML documents for an application
    and they all need to have the same styles. So, this is not a good approach, but
    you may see it. It''s just one way to specify the style of an element, but there''s
    a better way to apply CSS.


    The <Style> element


    The next option is to use the <style> element which allows us to write CSS directly
    inside of our document, but not nested or embedded in an element. At the top of
    the editor, create a style block like this:


    <style>


    </style>


    Inside that style block, you can create a CSS selector for all h2 elements. For
    example, if you wanted all h2 elements to be red, you would add a style rule that
    looks like this:


    <style>


    h2 {


    color: red;


    }


    </style>


    <h2>I am an h2</h2>


    See Figure 2.1.1.


    ![Image](images/image-45.jpeg)


    Figure 2.1.1: A CSS selector created for an h2 element'
