  trans: "\n图 2.39.2：相邻选择器用于给按钮设置粉色的背景颜色\n\n现在，又来挑战挑战。你能解释这段 CSS 中的相邻选择器会起什么作用吗？\n\
    \n```css\nh2 + button {\n  font-size: 20px;\n  background-color: magenta;\n}\n\
    ```\n\n## 2.40. 直接后代/子元素选择器\n\n我们将看到的下一个选择器是直接后代或子元素选择器。这里有一个示例。\n\n```css\ndiv\
    \ > li {\n  color: white;\n}\n```\n\n我们使用大于号或右角括号（`>`）。在这种情况下，它将选择所有作为 `div` 直接子元素的\
    \ `li`。它不仅仅是嵌套在 `div` 某处的普通子元素，而是直接后代或直接子元素。\n\n学习以下示例。\n\n```html\n<footer>\n\
    \  <nav>\n    <a href=\"https://google.com\">前往 Google</a> <br/>\n    <label for=\"\
    search\">搜索</label>\n    <input type=\"text\" placeholder=\"search\" id=\"search\"\
    >\n    <button>登录</button>\n    <button id=\"signup\">注册</button>\n  </nav>\n\
    \  <a href=\"https://yahoo.com\">前往 Yahoo</a>\n</footer>\n```\n\n在此标记语言中，第一个锚点标签（前往\
    \ Google）不是 `footer` 的直接子元素。它是 `nav` 的直接子元素。然而，第二个锚点标签（前往 Yahoo）是 `footer` 的直接子元素，因此在这种情况下我们将编写以下\
    \ CSS 来仅为第二个锚点标签设置红色：\n\n```css\nfooter > a {\n  color: red;\n}\n```\n\n尝试一下。使用你的\
    \ `challenge.html` 和 `styles.css` 文件。图 2.40.1 显示了输出。\n\n![Image](img/image-66.jpeg)\n\
    \n图 2.40.1：相邻后代选择器用于仅给第二个锚点标签设置红色\n\n我们刚刚查看了几个常用的 CSS 选择器，但你可以在这里通过 MDN 其他选择器：[`developer.mozilla.org/en-US/docs/Web/CSS/CSS_Selectors`](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Selectors)。\n\
    \n## 2.41. 伪类\n\n接下来，我们将介绍一些伪类，伪类是我们添加在选择器末尾的修饰符或关键词。它们指定了所选元素的特定状态。例如，我们可以使用它们来针对如已选中的复选框或正在悬停的元素，或者每隔一个按钮。\n\
    \n以下是几个示例。\n\n*   `:active`\n*   `:hover`\n*   `:checked`\n*   `:not()`\n*   `:first`\n\
    *   `:first-child`\n*   `:nth-child()`\n*   `:nth-of-type()`\n\n注意它们都以冒号（`:`）开头。我们确实需要添加冒号来表示我们正在使用伪类。当你悬停在某些元素上时，看到这种情况非常常见，它们会有某种不同的行为或不同的视觉表示，向你展示你可以交互。\n\
    \n我们将从最常用的伪类之一开始，即 `:hover`。例如，当你将鼠标图标悬停在 [www.google.com](http://www.google.com/)\
    \ 的 Google 搜索按钮上时，它会变得更加显著。此外，当你悬停在 [www.google.com](http://www.google.com/) 的任何链接（如\
    \ Gmail 或 Images）上时，这些链接会被下划线（就像这些：Gmail 和 Images）。\n\n让我用按钮来做第一个示例。以下是你如何编写 CSS\
    \ 代码，以使网页上的*所有*按钮在悬停时将背景颜色更改为红色，并将文本颜色改为浅白色。\n\n```css\nbutton:hover {\n  background-color:\
    \ red;\n  color: #f1faee\n}\n```\n\n使用你在 2.40 节中使用的相同 `challenge.html` 文件来尝试一下。\n\
    \n我也可以做得更具体一些。例如，与其说*所有*按钮，不如说文章*内部*（inside of a post）的按钮。因此，我只需要这样写：\n\n```css\n\
    .post button:hover {\n  background-color: red;\n  color: #f1faee\n}\n```\n\n然后当你悬停在网页上文章内部的任何按钮上时，它们的背景颜色将变为红色，文本颜色将变为浅白色。所有其他按钮将不受影响。\n\
    \n现在，这是你的挑战。这段 CSS 中的所有锚点标签会发生什么？\n\n```css\na:hover {\n  text-decoration: overline;\n\
    }\n```\n\n这很简单。这段 CSS 的意思是，当你悬停在任何锚点标签上时，文本装饰将变为上划线。\n"
