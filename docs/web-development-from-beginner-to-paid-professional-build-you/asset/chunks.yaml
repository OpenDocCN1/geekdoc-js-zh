- fmt: "\nAs we continue, I'm going to show you more very similar h-elements. I already\
    \ introduced `h1` which is the top-level heading for the entire web page. All\
    \ the common heading or section heading elements are the `h1`, `h2`, `h3`, `h4`,\
    \ `h5` and `h6` elements.\n\nHowever, in your web page, you should never have\
    \ an `h3` without `h2` or `h1`. Similarly, you should never have an `h6` without\
    \ `h5` or `h4` and so on. These headings exist not for size actually but to add\
    \ structure to the page, and to indicate the main topic or subtopics.\n\nSo, those\
    \ headings are important. We use them all the time. But remember, `don't use them\
    \ for size`, and make sure that you are using them correctly. For example, you\
    \ should have at most one `h1` on a page.\n\n## 1.2. Headline with the H2 Element\n\
    \nOver the next few lessons, we'll build an HTML5 cat photo web app piece-by-piece.\
    \ The `h2` element you will be adding in this step will add a level two heading\
    \ to the web page.\n\nThis element tells the browser about the structure of your\
    \ website. `h1` elements are often used for main headings, while `h2` elements\
    \ are generally used for subheadings. There are also `h3`, `h4`, `h5` and `h6`\
    \ elements to indicate different levels of subheadings.\n\nAdd an `h2` tag that\
    \ says \"CatPhotoApp\" to create a second HTML element below your \"Hello World\"\
    \ `h1` element.\n\n## 1.3. Inform with the Paragraph Element\n\n`p` elements are\
    \ the preferred element for paragraph text on websites. `p` is short for \"paragraph\"\
    .\n\nYou can create a paragraph element like this:\n\n```html\n<p>I'm a p tag!</p>\n\
    ```\n\nCreate a `p` element below your `h2` element, and give it the text Hello\
    \ Paragraph.\n\nNote: As a convention, all HTML tags are written in lowercase,\
    \ for example `<p></p>` and not `<P></P>`.\n\n## 1.4. Fill in the Blank with Placeholder\
    \ Text\n\nWeb developers traditionally use lorem ipsum text as placeholder text.\
    \ The lorem ipsum text is randomly scraped from a famous passage by Cicero of\
    \ Ancient Rome.\n\nLorem ipsum text has been used as placeholder text by typesetters\
    \ since the 16th century, and this tradition continues on the web.\n\nWell, 5\
    \ centuries is long enough. Since we're building a CatPhotoApp, let's use something\
    \ called \"kitty ipsum\" text.\n\nReplace the text inside your `p` element with\
    \ the words of this kitty ipsum text:\n\nKitty ipsum dolor sit amet, shed everywhere\
    \ shed everywhere stretching attack your ankles chase the red dot, hairball run\
    \ catnip eat the grass sniff.\n\n## 1.5. Comment/Uncomment HTML\n\nCommenting\
    \ is a way that you can leave comments for other developers within your code without\
    \ affecting the resulting output that is displayed by the end user.\n\nCommenting\
    \ is also a convenient way to make code inactive without having to delete it entirely.\n\
    \nComments in HTML start with `<!--` and end with `-->`.\n\nUncomment your `h1`,\
    \ `h2` and `p` elements as follows:\n\n```html\n<!--\n<h1>Hello World</h1>\n<h2>CatPhotoApp</h2>\n\
    <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack\
    \ your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>\n\
    -->\n```\n\n## 1.6. Comment out HTML\n\nRemember that in order to start a comment,\
    \ you need to use `<!--` and to end a comment, you need to use `-->`. Here, you'll\
    \ need to end the comment before your `h2` element begins. Comment out your `h1`\
    \ element and your `p` element, but not your `h2` element. See your code snippet\
    \ below.\n\nCode:\n\n```html\n<!--\n<h1>Hello World</h1>\n-->\n\n<h2>CatPhotoApp</h2>\n\
    \n<!--\n<p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching\
    \ attack your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>\n\
    -->\n```\n\n## 1.7. Deleting HTML Elements\n\nOur phone doesn't have much vertical\
    \ space. Let's remove the unnecessary elements so we can start building our CatPhotoApp.\n\
    \nDelete your `h1` element so we can simplify our view:\n\n```html\n<h2>CatPhotoApp</h2>\n\
    <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack\
    \ your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>\n\
    ```\n\n## 1.8. Introduction to HTML5 Elements\n\nHTML5 introduces more descriptive\
    \ HTML tags. These include `main`, `header`, `footer`, `nav`, `video`, `article`,\
    \ `section` and others.\n\nThese tags give a descriptive structure to your HTML,\
    \ make your HTML easier to read, and help with Search Engine Optimization (SEO)\
    \ and accessibility. The main HTML5 tag helps search engines and other developers\
    \ find the main content of your page. Here’s an example usage, a `main` element\
    \ with two child elements nested inside it:\n\n```html\n<main>\n  <h1>Hello World</h1>\n\
    \  <p>Hello Paragraph</p>\n</main>\n```\n\nNote: Many of the new HTML5 tags and\
    \ their benefits are covered in the *Applied Accessibility* section (Chapter 4).\n\
    \nCreate a second `p` element with the following kitty ipsum text:\n\nPurr jump\
    \ eat the grass rip the couch scratched sunbathe, shed everywhere rip the couch\
    \ sleep in the sink fluffy fur catnip scratched.\n\nThen, create a `main` element\
    \ and nest only the two `p` elements inside the `main` element. Here’s the code:\n\
    \n```html\n<h2>CatPhotoApp</h2>\n<main>\n  <p>Kitty ipsum dolor sit amet, shed\
    \ everywhere shed everywhere stretching attack your ankles chase the red dot,\
    \ hairball run catnip eat the grass sniff.</p>\n  <p>Purr jump eat the grass rip\
    \ the couch scratched sunbathe, shed everywhere rip the couch sleep in the sink\
    \ fluffy fur catnip scratched.</p>\n</main>\n```\n\n## 1.9. Add Images to Your\
    \ Website\n\nYou can add images to your website using the `img` element, and point\
    \ to a specific image using the `src` attribute.\n\nAn example of this would be:\n\
    \n```html\n<img src=\"https://topcat.com/catcat.jpg\">\n```\n\nNote that `img`\
    \ elements are self-closing. All `img` elements must have an `alt` attribute.\
    \ The text inside an `alt` attribute is used for screen readers and is displayed\
    \ if the image fails to load.\n\nNote: If the image is purely decorative, using\
    \ an empty `alt` attribute is a best practice.\n\nLet's add an `alt` attribute\
    \ to our image example:\n\n```html\n<img src=\"https://topcat.com/catcat.jpg\"\
    \ alt=\"A cat\">\n```\n\nLet's try to add an image to our website. Within the\
    \ existing `main` element, insert an `img` element before the existing `p` elements.\
    \ Now set the `src` attribute so that it points to the `https://bit.ly/3Inho`.\n\
    \nFinally, don't forget to give your `img` element an `alt` attribute.\n\n```html\n\
    <h2>CatPhotoApp</h2>\n<main>\n  <img src=\"https://bit.ly/3Inho\" alt=\"A cat\"\
    >\n  <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching\
    \ attack your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>\n\
    \  <p>Purr jump eat the grass rip the couch scratched sunbathe, shed everywhere\
    \ rip the couch sleep in the sink fluffy fur catnip scratched.</p>\n</main>\n\
    ```\n\n## 1.10. Link to External Pages with Anchor Elements\n\nYou can use `a`\
    \ (anchor) elements to link to content outside of your web page. `a` elements\
    \ need a destination web address called an `href` attribute (href means hypertext\
    \ reference). They also need anchor text. Here's an example:\n\n```html\n<a href=\"\
    https://www.facebook.com\">this links to facebook.com</a>\n```\n\nThen your browser\
    \ will display the text *this links to facebook.com* as a link you can click.\
    \ That link will take you to the web address `https://www.facebook.com`.\n\nNow,\
    \ create an `a` element that links to `https://bit.ly/3Inho` and has \"cat photo\"\
    \ as its anchor text. Here it is:\n\n```html\n<a href=\"https://bit.ly/3Inho\"\
    >cat photo</a>\n```\n\n## 1.11. Link to Internal Sections of a Page with Anchor\
    \ Elements\n\n`a` (anchor) elements can also be used to create internal links\
    \ to jump to different sections within a webpage.\n\nTo create an internal link,\
    \ you assign a link's `href` attribute to a hash symbol `#` plus the value of\
    \ the `id` attribute for the element that you want to internally link to, usually\
    \ further down the page. You then need to add the same `id` attribute to the element\
    \ you are linking to. An `id` is an attribute that uniquely describes an element.\n\
    \nBelow is an example of an internal anchor link and its target element:\n\n```html\n\
    <a href=\"#section-1\">Go to section 1</a>\n...\n<div id=\"section-1\">This is\
    \ section 1.</div>\n```\n"
  raw: 'As we continue, I''m going to show you more very similar h elements. I already
    introduced h1 which is the top-level heading for the entire web page. All the
    common heading or section heading elements are the h1, h2, h3, h4, h5 and h6 elements.


    However, in your web page, you should never have an h3 without h2 or H1\. Similarly,
    you should never have an h6 without h5 or h4 and so on. These headings exist not
    for size actually but to add structure to the page, and to indicate the main topic
    or subtopics.


    So, those headings are important. We use them all the time. But remember, **don''t
    use them for size**, and make sure that you are using them correctly. For example,
    you should have at most one h1 on a page.


    ## 1.2. Headline with the H2 Element


    Over the next few lessons, we''ll build an HTML5 cat photo web app piece-by-piece.
    The h2 element you will be adding in this step will add a level two heading to
    the web page.


    This element tells the browser about the structure of your website. h1 elements
    are often used for main headings, while h2 elements are generally used for subheadings.
    There are also h3, h4, h5 and h6 elements to indicate different levels of subheadings.


    Add an h2 tag that says "CatPhotoApp" to create a second HTML element below your
    "Hello World" h1 element.


    ## 1.3. Inform with the Paragraph Element


    **p** elements are the preferred element for paragraph text on websites. p is
    short for "paragraph".


    You can create a paragraph element like this:


    <p>I''m a p tag!</p>


    Create a p element below your h2 element, and give it the text Hello Paragraph.


    Note: As a convention, all HTML tags are written in lowercase, for example <p></p>
    and not <P></P>.


    ## 1.4\. Fill in the Blank with Placeholder Text


    Web developers traditionally use lorem ipsum text as placeholder text. The lorem
    ipsum text is randomly scraped from a famous passage by Cicero of Ancient Rome.


    Lorem ipsum text has been used as placeholder text by typesetters since the 16th
    century, and this tradition continues on the web.


    Well, 5 centuries is long enough. Since we''re building a CatPhotoApp, let''s
    use something called "kitty ipsum" text.


    Replace the text inside your p element with the words of this kitty ipsum text:


    Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack
    your ankles chase the red dot, hairball run catnip eat the grass sniff.


    ## 1.5. Comment/Uncomment HTML


    Commenting is a way that you can leave comments for other developers within your
    code without affecting the resulting output that is displayed to the end user.


    Commenting is also a convenient way to make code inactive without having to delete
    it entirely.


    Comments in HTML start with <!-- and end with a -->.


    Uncomment your h1, h2 and p elements as follows:


    <!--


    <h1>Hello World</h1>


    <h2>CatPhotoApp</h2>


    <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack
    your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>


    -->


    ## 1.6. Comment out HTML


    Remember that in order to start a comment, you need to use <!-- and to end a comment,
    you need to use -->. Here, you''ll need to end the comment before your h2element
    begins. Comment out your h1 element and your p element, but not your h2 element.
    See your code snippet below.


    Code:


    <!--


    <h1>Hello World</h1>


    -->


    <h2>CatPhotoApp</h2>


    <!--


    <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack
    your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>


    -->


    ## 1.7. Deleting HTML Elements


    Our phone doesn''t have much vertical space. Let''s remove the unnecessary elements
    so we can start building our CatPhotoApp.


    Delete your h1 element so we can simplify our view:


    <h2>CatPhotoApp</h2>


    <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack
    your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>


    ## 1.8. Introduction to HTML5 Elements


    HTML5 introduces more descriptive HTML tags. These include main, header, footer,
    nav, video, article, section and others.


    These tags give a descriptive structure to your HTML, make your HTML easier to
    read, and help with Search Engine Optimization (SEO) and accessibility. The main
    HTML5 tag helps search engines and other developers find the main content of your
    page. Here’s an example usage, a main element with two child elements nested inside
    it:


    <main>


    <h1>Hello World</h1>


    <p>Hello Paragraph</p>


    </main>


    Note: Many of the new HTML5 tags and their benefits are covered in the *Applied
    Accessibility* section (Chapter 4).


    Create a second p element with the following kitty ipsum text:


    Purr jump eat the grass rip the couch scratched sunbathe, shed everywhere rip
    the couch sleep in the sink fluffy fur catnip scratched.


    Then, create a main element and nest only the two p elements inside the main element.
    Here’s the code:


    <h2>CatPhotoApp</h2>


    <main>


    <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack
    your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>


    <p>Purr jump eat the grass rip the couch scratched sunbathe, shed everywhere rip
    the couch sleep in the sink fluffy fur catnip scratched.</p>


    </main>


    ## 1.9\. Add Images to Your Website


    You can add images to your website by using the img element, and point to a specific
    image''s URL using the src attribute.


    An example of this would be:


    <img src="https://www.bestcat.com/your-image.jpg">


    Note that img elements are self-closing. All img elements must have an alt attribute.
    The text inside an alt attribute is used for screen readers to improve accessibility
    and is displayed if the image fails to load.


    Note: If the image is purely decorative, using an empty alt attribute is a best
    practice. Ideally the alt attribute should not contain special characters unless
    needed.


    Let''s add an alt attribute to our img example above:


    <img src="  https://www.bestcat.com/assets/images/1be14cae888f608f02ff0ab2d12a8699.png"
    alt="A cute cat.">


    Let''s try to add an image to our website. Within the existing main element, insert
    an img element before the existing p elements. Now set the src attribute so that
    it points to the url https://bit.ly/3wwInho.


    Finally, don''t forget to give your img element an alt attribute with applicable
    text.


    <h2>CatPhotoApp</h2>


    <main>


    <img src="https://bit.ly/3wwInho" alt="A cute cat.">


    <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack
    your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>


    <p>Purr jump eat the grass rip the couch scratched sunbathe, shed everywhere rip
    the couch sleep in the sink fluffy fur catnip scratched.</p>


    </main>


    ## 1.10. Link to External Pages with Anchor Elements


    You can use a (anchor) elements to link to content outside of your web page. a
    elements need a destination web address called an href attribute (href means hypertext
    reference). They also need anchor text. Here''s an example:


    <a href="https://www.facebook.com">this links to facebook.com</a>


    Then your browser will display the text *this links to facebook.com* as a link
    you can click. That link will take you to the web address https://www.facebook.com.


    Now, create an a element that links to https://bit.ly/3wwInho and has "cat photo"
    as its anchor text. Here it is:


    <a href="https://bit.ly/3wwInho ">cat photo</a>


    ## 1.11. Link to Internal Sections of a Page with Anchor Elements


    a (anchor) elements can also be used to create internal links to jump to different
    sections within a webpage.


    To create an internal link, you assign a link''s href attribute to a hash symbol
    # plus the value of the id attribute for the element that you want to internally
    link to, usually further down the page. You then need to add the same id attribute
    to the element you are linking to. An id is an attribute that uniquely describes
    an element.


