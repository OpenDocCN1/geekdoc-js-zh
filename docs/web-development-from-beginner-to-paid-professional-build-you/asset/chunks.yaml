    ![Image](images/image-36.jpeg)


    Figure 1.30.1: Output of a 2 by 3 table


    Obviously, this table is not formatted (styled). You will notice that the borders
    (dividing lines) are missing. You’ll learn how to style your tables with CSS in
    later chapters. Also, we do not have any heading for the table.


    ### 1.30.2. How to Add a Table Heading


    The <th> element is used to add a heading to a table. Basically, the table heading
    always takes the top row. This means that you will declare <th> in the first row
    of your table, before you add the actual data. By default, the text you add in
    the heading is bolded and centered.


    Here''s an example of how to use <th>.


    <table>


    <tr>


    <th>F/Name</th>


    <th>L/Name</th>


    <th>Email</th>


    </tr>


    <tr>


    <td>William</td>


    <td>Henry</td>


    <td>William.Henry@gmail.com</td>


    </tr>


    <tr>


    <td>Robert</td>


    <td>John</td>


    <td>Robert.John@yahoo.com</td>


    </tr>


    </table>


    Figure 1.30.2 is a screenshot of the output.


    ![Image](images/image-37.jpeg)


    Figure 1.30.2: Output showing a simple table with headings


    ### 1.30.3. How to Add a Table Caption


    The purpose of a caption is to provide a description about the data you want to
    represent in a table. You can place a caption either at the top or the bottom
    of the table. By default, a caption is always centered.


    Use the <caption></caption> tags to insert a caption into your table. Here’s another
    sample form showing how to use <caption> and other tags you’ve learned so far.
    The caption is placed at the top.


    <table>


    <caption>Data of Some College Students</caption>


    <tr>


    <th>Name</th>


    <th>Gender</th>


    <th>Age</th>


    </tr>


    <tr>


    <td>Mary</td>


    <td>Female</td>


    <td>18</td>


    </tr>


    <tr>


    <td>John</td>


    <td>Male</td>


    <td>19</td>


    </tr>


    <tr>


    <td>David</td>


    <td>Male</td>


    <td>22</td>


    </tr>


    </table>


    Figure 1.30.3 is a screenshot of the output.


    ![Image](images/image-38.jpeg)


    Figure 1.30.3: Output showing a simple table with a caption at the top


    ### 1.30.4. How to Use the Scope Attribute


    We use the scope attribute to define whether a specific header is intended for
    a row, a column, or a group of both. The scope element is used to identify the
    target data so that we do not have to rely on our assumptions.


    We declare the attribute in the header cell <th>. The attribute can take any of
    the values row, col, rowgroup or colgroup. The values row and col are used to
    show that the header cell is giving information for either the columns or rows
    respectively.


    The values rowgroup and colgroup are used to show that the header cell is giving
    information for either a group of columns or a group of rows respectively.


    You may find this difficult to understand but I can help you with this example.


    | **Course Grade** |


    | 1 | Mat 101 | Distinction |


    | 2 | CHM 101 | Credit |


    | 3 | PHY 101 | Pass |


    Here’s the code for the table.


    <table>


    <tr>


    <th></th>


    <th scope="col">Course</th>


    <th scope="col">Grade</th>


    </tr>


    <tr>


    <td>1</td>


    <td>MAT 101</td>


    <td>Distinction</td>


    </tr>


    <tr>


    <td>2</td>


    <td>CHM 101</td>


    <td>Credit</td>


    </tr>


    <tr>


    <td>3</td>


    <td>PHY 101</td>


    <td>Pass</td>


    </tr>


    </table>


    Make sure you write this code in your editor and run it to see your beautiful
    output.


    ### 1.30.5. How to Use Cell Spanning


    You may have seen cells that stretch across two or more rows or columns in a table.
    We call this cell spanning.


    You can apply the same features in an HTML table if you use these two cell attributes:


    rowspan for vertical spanning and


    colspan for horizontal spanning.


    To use either of these attributes, just assign any number (1 or above) to indicate
    the number of cells you want to span. Let’s take a look at how to use these attributes
    to create the following table.


    | Name | Subject | Mark |


    | Robert | Physics | 80 |


    | Math | 72 |


    | John | Chemistry | 65 |


    | English | 90 |


    | Average: 76.75 |


    Here’s the code for this table.


    <table>


    <tr>


    <th>Name</th>


    <th>Subject</th>


    <th>Marks</th>


    </tr>


    <tr>


    <td rowspan = "2">Robert</td>


    <td>Physics</td>


    <td>80</td>


    </tr>


    <tr>


    <td>Math</td>


    <td>72</td>


    </tr>


    <tr>


    <td rowspan = "2">Lary</td>


    <td>Chemistry</td>


    <td>65</td>


    </tr>


    <tr>


    <td>English</td>


    <td>90</td>


    </tr>


    <tr>


    <td></td>


    <td colspan="3">Average: 76.75</td>


    </tr>


    </table>


    Run this code yourself. Figure 1.30.4 shows the output you’re expected to get.


    ![Image](images/image-39.jpeg)


    Figure 1.30.4: Output showing a table with spanning attributes applied


    Note: When you’re using the attributes rowspan and colspan , ensure you declare
    the values you assign correctly to avoid overlapping of cells.


