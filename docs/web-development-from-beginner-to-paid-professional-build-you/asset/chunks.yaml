    >JANUARY</th>\n      <th colspan=\"2\">FEBRUARY</th>\n    </tr>\n  </thead>\n\
    \  <tbody>\n    <tr>\n      <td>Sales($)</td>\n      <td>Profit($)</td>\n    \
    \  <td>Sales($)</td>\n      <td>Profit($)</td>\n    </tr>\n    <tr>\n      <td>150,000</td>\n\
    \      <td>70,000</td>\n      <td>350,000</td>\n      <td>95,000</td>\n    </tr>\n\
    \  </tbody>\n  <tfoot\n    <tr>\n      <th colspan=\"4\">FEBRUARY WAS MORE PRODUCTIVE</th>\n\
    \    </tr>\n  </tfoot>\n</table>\n```\n\n在你的代码编辑器中输入并运行这段代码。图 1.30.5 显示了你预期的输出。\n\
    \n![Image](img/image-40.jpeg)\n\n图 1.30.5：显示应用了表头、主体和表脚标签的表格输出\n\n注意：这里需要注意的一点是，你的表格可以有多个\
    \ `<tbody>` 部分。在这种情况下，每个 `<tbody>` 将相关的行分组。\n\n现在，挑战来了。我想让你练习一下所有这些与表格相关的元素（哎！）。你的目标是创建图\
    \ 1.30.6 所示的表格。\n\n![Image](img/image-41.jpeg)\n\n图 1.30.6：一个 4x3 表格的挑战\n\n如果你觉得需要更多帮助，完成后你可以使用本书底部的支持链接与我联系。我将在\
    \ 24 小时内内回复你。\n\n# 2. 基础 CSS (层叠样式表)\n\n恭喜你完成了 HTML 学习！我为你坚持下来感到非常自豪，你也应该为自己感到自豪。现在，你将进入一个全新的世界——CSS\
    \ 的世界。这个世界看起来可能可怕，也可能令人兴奋，或者两者兼具，但它充满了可能。这是奇妙 CSS 旅程的开始，而不只是 HTML 旅程的终结。\n\n我们还没有结束\
    \ HTML，因为它将在本章的大部分中发挥作用。事实上，我们将在本节使用大量的 HTML，因为 CSS 用于对现有的 HTML 元素进行样式化。因此，我们有几个\
    \ CSS 的章节。这是一个相对巨大的话题，但也非常简单。不要恐慌！\n\n那么，话话说此，祝你好运。我们继续吧！\n\n对于本章的课程，我想让你创建一个新文件夹。正如我在介绍章节中所解释的（第\
    \ 0 节`），你将创建一个文件夹并将其命名为 `02_lesson`：\n\n1. 打开你的 `Html_course` 文件夹。\n2. 创建一个标题为\
    \ `02_lesson` 的新文件夹。\n3. 在此文件夹中，创建一个记事本或文本文档，并将默认文件名更改为 `index`，扩展名从 `.txt` 改为\
    \ `.html`。\n4. 在 Visual Studio 中，点击顶部的`文件 (File)` 菜单并选择`打开文件夹 (Open Folder...)`。\n\
    5. 导航到你保存 `02_lesson` 文件夹的位置并选择它。\n6. 选择此文件夹以便 Visual Studio 资源管理器中加载 `index.html`\
    \ 文件。\n\n查看图 2.1 中的 (1)。关闭*入门指南 (Get Started)* 标签 (2)。\n\n![Image](img/image-42.jpeg)\n\
    \n图 2.1：在 Visual Studio 中创建了一个新文件\n\n要打开你的代码编辑器窗口并开始编码，点击 `index.html` 文件 (1)。\n\
    \n## 2.1. 使用 CSS 选择器为元素样式\n\n我们为什么不先快速回顾一下 HTML、CSS 和 JavaScript 各自的作用呢？这里的想法是将\
    \ HTML、CSS 和 JavaScript 比作语法中的不同部分，我们有名词、形容词和动词。\n\n**HTML** 是**名词**——比如表单中的按钮或标题。**CSS**\
    \ 是**形容词**，用于*描述*名词——比如按钮的大小（例如，一个*大*按钮）。**Javascript** 是**动词**——名词执行的*动作*——比如一个不断闪烁颜色的按钮，或在点击时看起来很落的按钮。\n\
    \nCSS 代表 **Cascading Style Sheet (层叠样式表)**。我认为“样式表”部分是自言易懂的，因为我们正在使用 CSS 为内容设置样式。“层叠\
    \ (Cascading)”部分是在你学习更多知识后我们会回到的内容。所以简单回顾一下，CSS 是一种语言（不一定是编程语言），我们可以用它来描述元素的外观或视觉表示。\n\
    \n"
