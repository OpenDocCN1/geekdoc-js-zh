    Most HTML elements have an **opening tag** and a **closing tag**.


    Opening tags look like this:


    <h1>


    Closing tags look like this:


    </h1>


    The only difference between opening and closing tags is the forward slash after
    the opening bracket of a closing tag. Place your mouse pointer immediately after
    the closing tag, </h1> and click once. Then press the return/enter key. The second
    line **2** of the markup is automatically created for you. This means you’re ready
