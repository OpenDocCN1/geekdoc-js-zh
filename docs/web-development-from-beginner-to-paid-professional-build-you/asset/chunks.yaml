    # 2\. Basic CSS (Cascaded Style Sheet)


    Congratulations on graduating HTML! I''m so proud of you for making it, and you
    should be proud of yourself. Now, you''re about to enter a whole new world - the
    world of CSS. It''s a world that might seem scary. It might be exciting. It might
    be both, but it''s certainly full of possibilities. This is the start of an amazing
    CSS journey, not just the end of an HTML journey.


    We are not done with HTML because it''s going to play a role in most sections
    of this chapter. In fact, we''ll be using a lot of HTML in this section because
    CSS is used to style existing HTML elements. So, we have a couple of sections
    on CSS. It''s a relatively huge topic, but it''s also pretty simple. Don’t panic!


    So, without further ado, good luck. Onwards we go!


    For the lessons in this chapter, I want you to create a new folder. Like I explained
    in the introductory chapter ([Section 0](#index_split_004.html_id_Toc101098661)),
