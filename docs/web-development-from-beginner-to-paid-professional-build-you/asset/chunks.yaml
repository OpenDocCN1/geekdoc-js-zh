    Figure 1.22.1: Output of the code


    ## 1.23. Create a Set of Checkboxes


    Forms commonly use checkboxes for questions that may have more than one answer.
    Checkboxes are a type of input.


    Each of your checkboxes can be nested within its own label element. By wrapping
    an input element inside of a label element, it will automatically associate the
    checkbox input with the label element surrounding it.


    All related checkbox inputs should have the same name attribute.


    It is considered best practice to explicitly define the relationship between a
    checkbox input and its corresponding label by setting the for attribute on the
    label element to match the id attribute of the associated input element.


    Here''s an example of a checkbox:


    <label for="loving"><input id="loving" type="checkbox" name="personality"> Loving</label>


    Here’s your next challenge.


    Add to your form a set of three checkboxes. Each checkbox should be nested within
    its own label element. All three should share the name attribute of personality.


    Your code should look like this:


    <label for="indoor">


    <input id="indoor" type="radio" name="SportsType"> Indoor


    </label>


    <label for="outdoor">


    <input id="outdoor" type="radio" name="SportsType"> Outdoor


    </label><br>


    <label for="loving"><input id="loving" type="checkbox" name="personality"> Loving</label>


    <label for="Honest"><input id="Honest" type="checkbox" name="personality"> Honest</label>


    <label for="Humble"><input id="Humble" type="checkbox" name="personality"> Humble</label>


    Here’s another way to write this code (with the label placed on the left side
    of the button/checkbox):


    label for="indoor">Indoor


    <input id="indoor" type="radio" name="SportsType"></label>


    <label for="outdoor"> Outdoor


    <input id="outdoor" type="radio" name="SportsType"></label>


    <br>


    <label for="loving"> Loving <input id="loving" type="checkbox" name="personality"></label>


    <label for="lazy"> Lazy <input id="lazy" type="checkbox" name="personality"></label>


    <label for="energetic"> Energetic <input id="energetic" type="checkbox" name="personality"></label>


    You can set a checkbox or radio button to be checked by default using the checked
    attribute. To do this, just add the word checked to the inside of an input element.
    For example:


    <input type="radio" name="test-name" checked>


    Set the first of your radio buttons and the first of your checkboxes to both be
    checked by default.


    Here it is:


    <label for="indoor"><input id="indoor" type="radio" name="indoor-outdoor" value="indoor"
    checked> Indoor</label>


    <label for="outdoor"><input id="outdoor" type="radio" name="indoor-outdoor" value="outdoor">
    Outdoor</label><br>


    <label for="loving"><input id="loving" type="checkbox" name="personality" value="loving"
    checked> Loving</label>


    <label for="lazy"><input id="lazy" type="checkbox" name="personality" value="lazy">
    Lazy</label>


    <label for="energetic"><input id="energetic" type="checkbox" name="personality"
    value="energetic"> Energetic</label>


    Run this code on your browser to see its output.


    When the selected values are sent to the server, we need to know which one of
    the radio buttons (Indoor or Outdoor) was selected by the user. To do that, we
    have to add on a particular attribute called value. Whatever we have in the value,
    such as “Indoor”, is sent through to the server when the form is submitted.


    ## **1.24\. Drop-down Menu, Slider, Text Area, Form Validation** **& File Upload
    Button**


    Next up, we have the select element, which is essentially a drop-down menu. Actually,
    it’s the product of two elements working together: a select element and the option
    element. Here’s a sample code for creating a drop-down menu for selecting shoe
    sizes.


    <label for="size-select">Choose a shoe size:</label>


    <br>


    <select name="shoes" id="size-select">


    <option value="">--Please choose an option--</option>


    <option value="XS">Extra Small</option>


    <option value="S">Small</option>


    <option value="M">Medium</option>


    <option value="L">Large</option>


    </select>


    Try and run this code. Figure 1.24.1 shows the result when I clicked the down
    arrow on the right side of the menu:


    ![Image](images/image-20.jpeg)


    Figure 1.24.1: The output of a shoe-size selector code'
