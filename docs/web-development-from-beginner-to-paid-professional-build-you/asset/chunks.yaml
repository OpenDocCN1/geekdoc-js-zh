    ## 1.12. 在段落中嵌套锚点元素


    你可以将链接嵌套在其他文本元素中。


    ```html

    <p>Here''s a <a target="_blank" href="https://www.bestcat.com"> link to www.bestcat.com</a>
    for you to follow.</p>

    ```


    让我们拆解这个示例。普通文本被包裹在 `<p>` 元素中：


    ```html

    <p> Here''s a ... for you to follow. </p>

    ```


    接下来是锚点元素 `<a>`（它需要一个闭合标签 `</a>`）：


    ```html

    <a> ... </a>

    ```


    `target` 是锚点标签的属性，用于指定在何处打开链接。值 `_blank` 表示在新标签页中打开链接。`href` 是锚点标签的属性，包含链接的 URL
    地址：


    ```html

    <a href="https://www.bestcat.com" target="_blank"> ... </a>

    ```


    `<a>` 元素内的文本 `link to www.bestcat.com` 称为锚文本，它将显示供点击的链接：


    ```html

    <a href=" ... " target="...">link to bestcat.com</a>

    ```


    该示例的最终输出将如下：Here''s a [link to www.bestcat.com](https://www.cats.com/) for you
    to follow.


