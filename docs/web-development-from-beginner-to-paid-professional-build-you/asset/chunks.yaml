    ## 2.14. Set the id of an Element


    In addition to classes, each HTML element can have an `id`. An `id` should be
    unique on the page, meaning you should only have one element with a given `id`.
    You can set an `id` using the `id` attribute. For example:


    ```html

    <div id="main-photo"></div>

    ```


    Now you can style this `id` in CSS using the `#` symbol. For example:


    ```css

    #main-photo {

    border-color: blue;

    }

    ```


    One cool thing about ids is that you can use them to select specific elements
    with JavaScript. For example:


    ```javascript

    document.getElementById("main-photo")

    ```


