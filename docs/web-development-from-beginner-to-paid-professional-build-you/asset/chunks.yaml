    Figure 2.16.1: Illustration of padding of an element


    The black boundary around each color is called the `border`, which can be solid,
    dotted, or thin. Note that the red box has more `padding` than the blue box. When
    you increase the blue box''s `padding`, it will increase the distance between
    the text and the border around it.


