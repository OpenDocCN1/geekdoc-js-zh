    <li>lasagna</li>

    </ul>

    </div>

    ```


    ## 2.15. Use an id Attribute to Style an Element


    One cool thing about ids is that, like classes, you can style them using CSS.
    However, an id is not reusable and should only be applied to one element. An id
    also has a higher specificity (importance) than a class so if both are applied
    to the same element and have conflicting styles, the styles of the id will be
    applied.


    Here''s an example of how you can take your element with the id attribute of `photo-element`
    and give it the background color of green. In your style:


    ```css

    #photo-element {

    background-color: green;

    }

    ```


