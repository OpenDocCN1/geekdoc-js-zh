    # How to Learn HTML5, CSS & Javascript Well


    I know there are more than sufficient resources online to teach absolute beginners
    everything they need to learn web development from scratch. But this book is different
    because it addresses a few web development problems. The credibility of a web
    developer is much more than their credentials. It’s actually about the strength
    of their portfolio.


    [Employment opportunities](https://www.turing.com/jobs) often come from work samples
    and concrete skills, rather than a college degree. So, you need to learn well
    enough. This book will not only help you learn well and build a stunning portfolio,
    it will also provide you continuous help and support.


    With this book and my **dedicated 24/7 help and support team**, there’s nothing
    for you to fear. I have helped many web developers update their development skills,
    launch successful careers and get hired for [remote jobs](https://vanhack.com/jobs/).
    I notice that even the most ambitious beginners can run into problems, such as
    unable to decide where to begin. Sometimes they get completely lost on the way
    and therefore need further help.


    The truth is everyone needs help at one point or the other to learn html5, CSS
    or Javascript correctly in their web development journey. I put sufficient coding
    challenges and their solutions in this book. You will **get regularly updated
    cheat sheets, coding exercises, a stunning web developer portfolio to show off
    your work samples, practice projects. You will also get further help if you**
    **use the free support link at the bottom of this book. I will help you learn
    well**.


    Finally, if you buy this book, I will add you to my web development community
    so you can continue to learn and get more help until you become a well-paid professional.


    Bolakale Aremu


    CEO, Ojula Technology Innovations


    Web developer and Software Engineer


    # 0. Getting Started with Free Coding Tools


    HTML is on its fifth iteration, and that’s why it referred to as HTML5\. CSS is
    on its third, so it’s also known as CSS3\. Whether you use Windows, Mac or Linux
    operating system, you need an updated modern browser and a text/code editor, such
    as a notepad, to get started in your coding journey. However, I highly recommend
    you download and install [Visual Studio editor](https://code.visualstudio.com/download)
    and [Google Chrome browser](https://www.google.com/chrome/) right now to get started.
    They are very easy to install, and they have a bunch of developer tools pre-installed.
    There are tons of videos on Youtube on how to install the latest versions of [Visual
    Studio](https://www.youtube.com/watch?v=m9mIwKeTJhk) and [Chrome browser](https://www.youtube.com/watch?v=ThQAkabE0J8).
    Once you’ve installed these, let’s get started!


    On your desktop or any other location you like on your computer,


    1\. Create a new folder and give it a good title like Web-Development. Open this
    folder.


    2\. In this folder, create another folder and give it a title like, Html_course.
    Open this folder.


    3\. In this folder, create another folder and give it a title like, 01_lesson.
    Open this folder.


    4\. In this folder, create a new notepad or text document and rename/change the
    default title to index and the extension (.txt) to .html. See Figure 0.1.


    ![Image](images/image.jpeg)


    Figure 0.1: Renaming a new text document (Notepad)


    Once you press the return/enter button, you will receive a warning that your document/file
    may become unusable. Select yes to indicate you want to change the file name and
    extension to **index.html**, the sort of a standard **home page** or **main page**
    for an application. Your first web file is now ready! Your file should now have
    the logo of chrome browser, or whatever browser you use, as shown in Figure 0.2.


    ![Image](images/image-1.jpeg)


    Figure 0.2: Text document now has the logo of Chrome browser


    Now, open Visual Studio which you installed earlier. Go to **File** menu (1) at
    the top left, and click on it to open the new panel shown in Figure 0.3\. Later
    on in this book, you can select the first option (**New File**) to create a new
    *untitled* file. A new window will be opened for you to write your code in.


    ![Image](images/image-2.jpeg)


    Figure 0.3: How to open a new folder in Visual Studio


    But for now, just select **Open Folder** (2). The dialog box shown in Figure 0.4
    opens.


    ![Image](images/image-3.jpeg)


    Figure 0.4: How to navigate to and select your 01_lesson folder on your computer


    Navigate to the **01_lesson**  folder and click on it to select it (1). Click
    the **Select Folder** button (2) to close the dialog window. You should see this
    folder (1) and your **index.html** file (2) on the left panel of the Visual studio
    like shown below.


    ![Image](images/image-4.jpeg)


    Figure 0.5: Visual Studio file explorer window showing how to select your index.html
    file


    You will not see other files, such as 1.jpg, 2.jpg shown in the above screenshot
    since you don’t have them for now. This is ok. Click your **index.html** file
    (2) on the left to select it.


    ![Image](images/image-5.jpeg)


    Figure 0.6: Visual Studio code editor window (right side) showing the first line
    of our code


    A code editor window will open on the right side with the title *index.html* (1).
    Henceforth, you will be writing your code inside a window like this. The number
    **1** you see below the tab (2) indicates the first line of your code. So, are
    you ready to start coding? Move on to the next chapter!


    # 1\. Basic HTML5 & Useful Resources


    What does HTML5 actually mean? I see a lot of confusion around this with students
    and with good reason. To some of them, HTML5 sounds like a version that you download,
    install or upgrade to, just like with video games.


    But HTML5 is a little bit different. If we actually go to read [MDN’s little blurb
    about it](https://developer.mozilla.org/en-US/docs/Glossary/HTML5),


    *“The term HTML5 is essentially a buzzword that refers to a set of modern web
    technologies*.”


    It’s the latest evolution of the standard that defines HTML. The term represents
    two different concepts. It is a new version of the language of HTML with new elements,
    attributes and behaviors. It also refers to a larger set of web technologies.


    This is nothing you really need to care about right now, but it includes different
    technologies that help us that help us do things like build websites with 3D graphics,
    storing information in the browser, and other things that are technically not
    HTML but which we still call HTML. This whole new set of things was called HTML5
    or HTML5 and friends. So, this makes it kind of confusing.


    So, when I say HTML5, I''m referring to just the latest evolution of the **standard**
    that defines HTML. But what does “standard” mean and why is it a standard that
    defines HTML? Well, the way that HTML works is that there is not one official
    copy that you download. We never install HTML. There''s a very large document
    called [The HTML Standard](https://html.spec.whatwg.org) that says how HTML should
    work.'
