  raw: 'So, when we say HTML5, it is not a version of something you download or install;
    it''s just a version of this document and it includes new elements, such as the
    video element, the audio element, and so on. They weren''t around 15 years ago
    in HTML, and they''re now part of this document. Browsers (Chrome, Firefox, Edge,
    or whatever browser you''re using) then implement them.


    You could have gotten along just fine without knowing any of this. But I do like
    to clear this up because I hear students talking about upgrading to HTML5 and
    things like that. That''s not really at all what you do. Your browser and the
    organization behind it are the ones who implement features based upon the latest
    version of this HTML standard.


    Technically speaking, HTML is a markup language that uses a special syntax or
    notation to describe the structure of a webpage to the browser. HTML elements
    usually have opening and closing tags that surround and give meaning to content.
    For example, different elements can describe text as a heading, paragraph, or
    list item.


    Now, I''d like to quickly introduce you to one of the most useful resources that
    I use frequently in this book, and I recommend you use it too. It''s called [Mozilla
    Developer Network](https://developer.mozilla.org/en-US/docs/Web/HTML) or **MDN**.
    It''s a lifesaver. It is a resource that covers the basics of Web technologies
    and more. Figure 1.0 is a screenshot of MDN.


    ![Image](images/image-6.jpeg)


    Figure 1.0: HTML Reference page on the [MDN Website](https://developer.mozilla.org/en-US/docs/Web/HTML)


    It''s a resource for developers and is written by developers. Think of it as the
    Wikipedia for HTML, CSC, JavaScript, browsers and a whole bunch of other stuff
    that explains the rules of HTML. It''s full of tutorials, references and guides.
    So, it is documentation or a resource that helps you understand and learn about
    Web technologies.


    However, keep in mind that Mozilla is not the creator of HTML, CSS and JavaScript.
    There are other resources that are similar to MDN. This is just one sort of encyclopedia
    of knowledge, but it''s not an official document or anything. It''s open source
    and is created by developers.


    ## 1.1\. Say Hello to HTML Elements


