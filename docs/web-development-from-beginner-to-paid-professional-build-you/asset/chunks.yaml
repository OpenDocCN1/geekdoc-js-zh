    ## 1.25. Nest Elements with Div & Span


    I would bet if you asked the majority of developers who use HTML, most of them
    would not know what DIV means or why it''s called a div. Apparently, it''s the
    Content Division element or division divider.


    The div element is a general-purpose container for other elements. It’s probably
    the most commonly used HTML element of all. It''s kind of a weird term, but div
    is just a generic container to hold things or to group elements together. It’s
    a block level element. So, if I add a div around some content it’s going to take
    up a whole block and force content above and below it. See an example of how div
    is used in Figure 1.25.1.


    ![Image](images/image-28.jpeg)


    *Figure 1.25.1: An example of how* div *is used to create a generic container
    for holding an image and some text elements together*


    Just like any other non-self-closing element, you can open a div element with
    <div> and close it on another line with </div>.


    Nest your "Things cats love" and "Top 3 things cats hate" lists all within a single
    div element.


    Hint: Try putting your opening div tag above your "Things cats love" p element
    and your closing div tag after your closing ol tag so that both of your lists
    are within one div.


    This is it:


    <div>


    <p>Things cats love:</p>


    <ul>


    <li>cat nip</li>


    <li>laser pointers</li>


    <li>lasagna</li>


    </ul>


    <p>Top 3 things cats hate:</p>


    <ol>


    <li>flea treatment</li>


    <li>thunder</li>


    <li>other cats</li>


    </ol>


    </div>


    The next element that I''m going to show you kind of serves a similar purpose.
    It''s called a span. The span is another generic container, but it’s an inline
    element (it does not take its own block of contents). Just like any other non-self-closing
    element, you can open a span element with <span> and close it on another line
    with </span>.


    See an example of how span is used in Figure 1.25.2.


    ![Image](images/image-29.jpeg)


    Figure 1.25.2: An example of how span is used to create a generic container for
    holding a group of texts together


    To wrap up, a **block-level element** always starts on a new line and takes up
    the full width available, whereas an **inline element** does not start on a new
    line and it only takes up as much width as necessary.


    ## 1.26. Declare the Doctype of an HTML Document


    The challenges so far have covered specific HTML elements and their uses. However,
    there are a few elements that give overall structure to your page, and should
    be included in every HTML document.


    At the top of your document, you need to tell the browser which version of HTML
    your page is using. HTML is an evolving language, and is updated regularly. Most
    major browsers support the latest specification, which is HTML5\. However, older
    web pages may use previous versions of the language.


    You tell the browser this information by adding the <!DOCTYPE ...> tag on the
    first line, where the ... part is the version of HTML. For HTML5, you use <!DOCTYPE
    html>. So, this tag is just a declaration. What this does is it indicates to browsers
    that this document uses HTML5 syntax or the fifth version of the standard. The
    ! and uppercase DOCTYPE is important, especially for older browsers. The html
    is not case sensitive.


    If you add this DOCTYPE


    <!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">


    to the top of your HTML document, it does not really change anything. It tells
    the browser what it should be expecting, but it won''t turn anything off. It''s
    just telling the browser that it should expect HTML4.01\. So just keep it in mind.


    Next, the rest of your HTML code needs to be wrapped in html tags. The opening
    <html> goes directly below the <!DOCTYPE html> line, and the closing </html> goes
    at the end of the page.


    Here''s an example of the page structure. Your HTML code would go in the space
    between the two html tags.


    <!DOCTYPE html>


    <html>


    .


    .


    </html>


    Add a DOCTYPE tag for HTML5 to the top of the blank HTML document in the code
    editor. Under it, add opening and closing html tags, which wrap around an h1 element.
    The heading can include any text.


    <!DOCTYPE html>


    <html>


    <h1> Test Heading</h1>


    </html>


