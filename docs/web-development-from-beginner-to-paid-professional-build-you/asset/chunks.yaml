    ## 1.29. Introduction to the Chrome Inspector


    Next, I''d like to show you a little bit about the chrome developer tools, There
    are a bunch of different tools that Chrome comes with to help debug and work with
    HTML, CSS and JavaScript.


    For now, we''re going to look at one called the inspector. You can use the chrome
    inspector to see/inspect the underlying web elements of the front page of a web
    page and make *temporary* edits to the page. To start using the inspector, just
    right-click anywhere on a web page and select **Inspect**. Figure 1.29.1 is an
    example of a web page taken from Wikipedia: [https://en.wikipedia.org/wiki/Elephant](https://en.wikipedia.org/wiki/Elephant).


