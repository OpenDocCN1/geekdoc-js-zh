  trans: "\n\n随着我们的继续，我将向你展示更多非常相似的 h 元素。我已经介绍过 `h1`，它是整个网页的顶层标题。所有常见的标题或章节标题元素都是\
    \ `h1`、`h2`、`h3`、`h4`、`h5` 和 `h6` 元素。\n\n然而，在你的网页中，你不应该在没有 `h2` 或 `h1` 的情况下使用\
    \ `h3`。同样，你不应该在没有 `h5` 或 `h4` 的情况下使用 `h6` 等。这些标题的存在实际上并不是为了大小，而是为了给页面添加结构，并指示主主题或子主题。\n\
    \n所以，这些标题是非常重要的。我们经常使用它们。但记住，*不要用它们来控制大小*，并确保你正确地使用了它们。例如，一个页面最多有一个 `h1`。\n\n\
    ## 1.2. 使用 H2 元素的标题\n\n在接下来的几节中，我们将逐步构建一个 HTML5 猫咪照片 Web 应用。在此步中将添加的 `h2` 元素将为网页添加一个二级标题。\n\
    \n该元素告诉浏览器你网站的结构。`h1` 元素通常用于主标题，而 `h2` 元素通常用于子标题。还有 `h3`、`h4`、`h5` 和 `h6` 元素来指示不同级别的子标题。\n\
    \n添加一个内容为 \"CatPhotoApp\" 的 `h2` 标签，在你的 \"Hello World\" `h1` 元素下方创建一个第二个 HTML\
    \ 元素。\n\n## 1.3. 使用段落元素提供信息\n\n`p` 元素是网站段落文本的首选元素。`p` 是 \"paragraph\"段落）的缩写。\n\
    \n你可以这样创建一个段落元素：\n\n```html\n<p>I'm a p tag!</p>\n```\n\n在你的 `h2` 元素下方创建一个 `p`\
    \ 元素，并给它文本 Hello Paragraph。\n\n注意：按照惯例，所有的 HTML 标签都写成小写，例如 `<p></p>` 而不是 `<P></P>`。\n\
    \n## 1.4. 使用占位文本填充空白\n\nWeb 开发者传统上使用 lorem ipsum 文本作为占位文本。lorem ipsum 文本随机摘自古罗马西塞罗的一段著名文章。\n\
    \n自 16 世纪以来，排字员一直使用 lorem ipsum 文本作为占位文本，这种传统延续到了网页。\n\n嗯，5 个世纪已经够久了。既然我们正在构建\
    \ CatPhotoApp，让我们用某种被称为 \"kitty ipsum\" 的文本。\n\n将你的 `p` 元素中的文本替换为这段 kitty ipsum\
    \ 文本的文字：\n\nKitty ipsum dolor sit amet, shed everywhere shed everywhere stretching\
    \ attack your ankles chase the red dot, hairball run catnip eat the grass sniff.\n\
    \n## 1.5. HTML 的注释/取消注释\n\n注释是你可以在代码中为其他开发者留下注释的方法，而不会影响显示给用户的最终输出。\n\n注释也是一种让代码不生效的方便方法，而无需完全删除。\n\
    \nHTML 中的注释以 `<!--` 开始，以 `-->` 结束。\n\n如下所示取消你的 `h1`、`h2` 和 `p` 元素的注释：\n\n```html\n\
    <!--\n<h1>Hello World</h1>\n<h2>CatPhotoApp</h2>\n<p>Kitty ipsum dolor sit amet,\
    \ shed everywhere shed everywhere stretching attack your ankles chase the red\
    \ dot, hairball run catnip eat the grass sniff.</p>\n-->\n```\n\n## 1.6. 注释 HTML\n\
    \n记住，为了开始注释，你需要使用 `<!--`，为了结束注释，你需要使用 `-->`。在这里，你需要在 `h2` 元素开始之前结束注释。注释掉你的 `h1`\
    \ 元素和 `p` 元素，但不要注释你的 `h2` 元素。见下方的代码片段。\n\n```html\n<!--\n<h1>Hello World</h1>\n\
    -->\n\n<h2>CatPhotoApp</h2>\n\n<!--\n<p>Kitty ipsum dolor sit amet, shed everywhere\
    \ shed everywhere stretching attack your ankles chase the red dot, hairball run\
    \ catnip eat the grass sniff.</p>\n-->\n```\n\n## 1.7. 删除 HTML 元素\n\n我们的手机垂直空间不大。让我们移除必要的元素，这样我们开始构建\
    \ CatPhotoApp 了。\n\n删除你的 `h1` 元素以便简化我们的视图：\n\n```html\n<h2>CatPhotoApp</h2>\n\
    <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack\
    \ your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>\n\
    ```\n\n## 1.8. HTML5 元素介绍\n\nHTML5 引入了更多描述性的 HTML 标签。这些包括 `main`、`header`、`footer`、`nav`、`video`、`article`、`section`\
    \ 等。\n\n这些标签为你的 HTML 提供了描述性结构，使你的 HTML 更易，并有助于搜索引擎优化（SEO）和辅助功能。主要的 HTML5 标签帮助搜索引擎和其他开发者找到页面的主要内容。这是一个示例用法，一个嵌套了两个子元素的\
    \ `main` 元素：\n\n```html\n<main>\n  <h1>Hello World</h1>\n  <p>Hello Paragraph</p>\n\
    </main>\n```\n\n注意：许多新的 HTML5 标签及其优势将在 *Applied Accessibility*（应用辅助）章节（第 4 章）中介绍。\n\
    \n创建一个带有以下 kitty ipsum 文本的第二个 `p` 元素：\n\nPurr jump the grass rip the couch scratched\
    \ shed everywhere sleep in the sink fluffy fur catnip.\n\n然后在 `main` 元素内部嵌套两个\
    \ `p` 元素，并包含 kitty ipsum 文本。代码如下：\n\n```html\n<h2>CatPhotoApp</h2>\n<main>\n \
    \ <p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere stretching attack\
    \ your ankles chase the red dot, hairball run catnip eat the grass sniff.</p>\n\
    \  <p>Purr jump the grass rip the couch scratched shed everywhere sleep in the\
    \ sink fluffy fur catnip.</p>\n</main>\n```\n\n## 1.9. 为网站添加图片\n\n你可以使用 `img`\
    \ 元素向网站添加图片，并使用 `src` 属性指向特定图片。\n\n一个示例是：\n\n```html\n<img src=\"topcat.com\"\
    >\n```\n\n注意 `img` 元素是自合的。所有的 `img` 元素必须有一个 `alt` 属性。`alt` 属性在图片加载失败时显示。\n\n注意：如果图片完全是装饰性的，使用空的\
    \ `alt` 属性是最佳实践。\n\n让我们为图片添加 `alt` 属性：\n\n```html\n<img src=\"topcat.com\" alt=\"\
    A cat\">\n```\n\n让我们向我们的网站添加一张图片。在现有的 `main` 元素中插入 `img` 元素。现在设置 `src` 属性使其指向\
    \ `https://bit.ly/3Inho`。\n\n最后，忘记给你的 `img` 元素一个 `alt` 属性。\n\n```html\n<h2>CatPhotoApp</h2>\n\
    <main>\n  <img src=\"https://bit.ly/3Inho\" alt=\"A cat\">\n  <p>Kitty ipsum dolor\
    \ sit amet, shed everywhere shed everywhere stretching attack your ankles chase\
    \ the red dot, hairball run catnip eat the grass sniff.</p>\n  <p>Purr jump the\
    \ grass rip the couch scratched shed everywhere sleep in the sink fluffy fur catnip.</p>\n\
    </main>\n```\n\n## 1.10. 使用锚元素链接到外部页面\n\n你可以使用 `a` 元素链接到网页之外的内容。`a` 元素需要一个名为 `href`\
    \ 的目标 Web 地址（href 代表超文本引用）。它们还需要锚文本。这是一个示例：\n\n```html\n<a href=\"https://www.facebook.com\"\
    >this links to facebook.com</a>\n```\n\n然后你的浏览器会将 *this links to facebook.com*\
    \ 显示为可以点击的链接。该链接将带你进入 `https://www.facebook.com` 地址。\n\n现在，创建一个链接到 `https://bit.ly/3Inho`\
    \ 并以 \"cat photo\" 作为其锚文本的 `a` 元素。如下：\n\n```html\n<a href=\"https://bit.ly/3Inho\"\
    >cat photo</a>\n```\n\n## 1.11. 使用锚元素链接到页面内部部分\n\n`a` 元素也可以用于创建内部链接跳转到网页的不同部分。\n\
    \n要创建内部链接，你将链接的 `href` 属性赋值为哈希符号 `#` 加上要内部链接的元素的 `id` 属性值，通常在页面的下方。然后你需要在要链接的元素上添加相同的\
    \ `id` 属性。`id` 是一个唯一描述元素的属性。\n\n下面是内部锚点链接及其目标元素的示例：\n\n```html\n<a href=\"#section-1\"\
    >Go to section 1</a>\n...\n<div id=\"section-1\">This is section 1.</div>\n```\n\
    \n"
- fmt: "\n# Contacts\n\nWhen users click the `Contacts` link, they'll be taken to\
    \ the section of the webpage with the Contacts heading element.\n\nChange your\
    \ external link to an internal internal link by changing the `href` attribute\
    \ to `#footer` and the text from `cat photo` to `Jump to Bottom`.\n\nRemove the\
    \ `target=\"_blank\"` attribute from the anchor tag since this causes the linked\
    \ document to open in a new window tab. Then add an `id` attribute with a value\
    \ of `footer` to the `<footer>` element at the bottom of the page:\n\n```html\n\
    <img src=\"https://bit.ly/3wwInho\" alt=\"A cute cat.\">\n<a href=\"#footer\"\
    >cat photos</a>\n```\n\n<p>Kitty ipsum dolor sit amet, shed everywhere shed everywhere\
    \ stretching attack your ankles chase the red dot, hairball run catnip eat the\
    \ grass sniff. Purr jump eat the grass rip the couch scratched sunbathe, shed\
    \ everywhere rip the couch sleep in the sink fluffy fur catnip scratched. Kitty\
    \ ipsum dolor sit amet, shed everywhere shed everywhere stretching attack your\
    \ ankles chase the red dot, hairball run catnip eat the grass sniff.</p>\n\n<p>Purr\
    \ jump eat the grass rip the couch scratched sunbathe, shed everywhere rip the\
    \ couch sleep in the sink fluffy fur catnip scratched. Kitty ipsum dolor sit amet,\
    \ shed everywhere shed everywhere stretching attack your ankles chase the red\
    \ dot, hairball run catnip eat the grass sniff. Purr jump eat the grass rip the\
    \ couch scratched sunbathe, shed everywhere rip the couch sleep in the sink fluffy\
    \ fur catnip scratched.</p>\n\n<p>Meowwww loved it, hated it, loved it, hated\
    \ it yet spill litter box, scratch at owner, destroy all furniture, especially\
    \ couch or lay on arms while you're using the keyboard. Missing until dinner time\
    \ toy mouse squeak roll over. With tail in the air lounge in doorway. Man running\
    \ from cops stops to pet cats, goes to jail.</p>\n\n<p>Intently stare at the same\
    \ spot poop in the plant pot but kitten is playing with dead mouse. Get video\
    \ posted to internet for chasing red dot leave fur on owners clothes meow to be\
    \ let out and mesmerizing birds leave fur on owners clothes or favor packaging\
    \ over toy so purr for no reason. Meow to be let out play time intently sniff\
    \ hand run outside as soon as door open yet destroy couch.</p>\n\n<footer id=\"\
    #footer\">Copyright Cat Photo App</footer>\n\n## 1.12. Nest an Anchor Element\
    \ within a Paragraph\n\nYou can nest links within other text elements.\n\n```html\n\
    <p>Here's a <a target=\"_blank\" href=\"https://www.bestcat.com\"> link to www.bestcat.com</a>\
    \ for you to follow.</p>\n```\n\nLet's break down the example. Normal text is\
    \ wrapped in the `p` element:\n\n```html\n<p> Here's a ... for you to follow.\
    \ </p>\n```\n\nNext is the anchor element `<a>` (which requires a closing tag\
    \ `</a>`):\n\n```html\n<a> ... </a>\n```\n\n`target` is an anchor tag attribute\
    \ that specifies where to open the link. The value `_blank` specifies to open\
    \ the link in a new tab. The `href` is an anchor tag attribute that contains the\
    \ URL address of the link:\n\n```html\n<a href=\"https://www.bestcat.com\" target=\"\
    _blank\"> ... </a>\n```\n\nThe text, `link to www.bestcat.com`, within the `<a>`\
    \ element is called anchor text, and will display the link to click:\n\n```html\n\
    <a href=\" ... \" target=\"...\">link to bestcat.com</a>\n```\n\nThe final output\
    \ of the example will look like this: Here's a [link to www.bestcat.com](https://www.cats.com/)\
    \ for you to follow.\n\nNow, nest the existing `<a>` element within a new `<p>`\
    \ element. Do not create a new anchor tag. The new paragraph should have text\
    \ that says `View more cat photos`, where `cat photos` is a link, and the rest\
    \ is plain text.\n\n```html\n<p>Click here to view more <a href=\"https://www.bestcat.com/\"\
    \ target=\"_blank\">cat photos</a>.</p>\n```\n\n## 1.13. Make Dead Links Using\
    \ the Hash Symbol\n\nSometimes you want to add a elements to your website before\
    \ you know where they will link. This is also handy when you're changing the behavior\
    \ of a link using JavaScript, which we'll learn about later.\n\nThe current value\
    \ of the `href` attribute is a link that points to \"https://www.catphotoapp.com\"\
    . Replace the `href` attribute value with a `#`, also known as a hash symbol,\
    \ to create a dead link.\n\nFor example: `href=\"#\"`\n\n```html\n<p>Click here\
    \ to view more <a href=\"#\" target=\"_blank\">cat photos</a>.</p>\n```\n\n##\
    \ 1.14. Turn an Image into a Link\n\nYou can make elements into links by nesting\
    \ them within an `<a>` element. Nest your image within an `<a>` element. Here's\
    \ an example:\n\n```html\n<a href=\"#\"><img src=\"https://bit.ly/3wwInho\" alt=\"\
    A kitten staring at the camera.\"></a>\n```\n\nRemember to use `#` as your `<a>`\
    \ element's `href` property in order to turn it into a dead link. Place the existing\
    \ image element within an `<a>` (anchor) element.\n\nOnce you've done this, hover\
    \ over your image with your cursor on your browser. Your cursor's normal pointer\
    \ should become the link clicking pointer. The photo is now a link.\n\n```html\n\
    <a href=\"#\"> <img src=\"https://bit.ly/3wwInho\" alt=\" A kitten staring at\
    \ the camera.\"></a>\n```\n\n## 1.15. Create a Bulleted Unordered List\n\nHTML\
    \ has a special element for creating unordered lists, or bullet point style lists.\
    \ Unordered lists start with an opening `<ul>` element, followed by any number\
    \ of `<li>` elements. Finally, unordered lists close with a `</ul>`.\n\nFor example:\n\
    \n```html\n<ul>\n  <li>milk</li>\n  <li>cheese</li>\n</ul>\n```\n\nwould create\
    \ a bullet point style list of milk and cheese.\n\nRemove the last two `<p>` elements\
    \ and create an unordered list of three things that cats love at the bottom of\
    \ the page.\n\n```html\n<ul>\n  <li>cat nip</li>\n  <li>laser pointers</li>\n\
    \  <li>lasagna</li>\n</ul>\n```\n\n## 1.16. Create an Ordered List\n\nHTML has\
    \ another special element for creating ordered lists, or numbered lists. Ordered\
    \ lists start with an opening `<ol>` element, followed by any number of `<li>`\
    \ elements. Finally, ordered lists are closed with the `</ol>` tag.\n\nFor example:\n\
    \n```html\n<ol>\n  <li>Garfield</li>\n  <li>Sylvester</li>\n</ol>\n```\n\nwould\
    \ create a numbered list of Garfield and Sylvester.\n\nNow, create an ordered\
    \ list of the top 3 things cats hate the most. Here’s an example:\n\n```html\n\
    <ol>\n  <li>flea treatment</li>\n  <li>thunder</li>\n  <li>other cats</li>\n</ol>\n\
    ```\n\n## 1.17. Create a Text Field\n\nNow let's create a web form. `input` elements\
    \ are a convenient way to get input from your user. You can create a text input\
    \ like this:\n\n```html\n<input type=\"text\">\n```\n\nNote that `input` elements\
    \ are self-closing. Create an `input` element of `type` `text` below your lists.\n\
    \n```html\n<input type=\"text\">\n```\n\n## 1.18. Add Placeholder Text to a Text\
    \ Field\n\nPlaceholder text is what is displayed in your `input` element before\
    \ your user has inputted anything. You can create placeholder text like so:\n\n\
    ```html\n<input type=\"text\" placeholder=\"this is placeholder text\">\n```\n\
    \nNote: Remember that `input` elements are self-closing.\n\nIn your code editor,\
    \ set the `placeholder` value of your text input to `cat photo`. Here it is:\n\
    \n```html\n<input type=\"text\" placeholder=\"cat photo\">\n```\n\n## 1.19. Forms:\
    \ Creating a Form Element\n\nYou can build web forms that actually submit data\
