    document.getElementById("main-photo")

    ```


    现在你可以回到 CatPhotoApp，为包含喜欢的东西列表的 `div` 元素添加一个 `id="photo-container"`：


    ```html

    <div id="photo-container">

    <p>猫喜欢的东西：</p>

    <ul>

    <li>猫抓薄荷</li>

    <li>激光笔</li>

    <li>千层百/披饼</li>

    </ul>

    </div>

    ```


    ## 2.15. 使用 id 属性样式元素


    id 的奇之处在于，像类一样，你可以使用 CSS 设置样式。但是，id 不是可复用的，应该只应用于元素。id 的优先级（权重）比类高，因此如果它们被应用于同一个元素且样式冲突，则
    id 的样式将被应用。


    这是一个如何将你具有 id 属性 `photo-element` 的元素赋予绿色背景色的示例。在你的样式中：


    ```css

    #photo-element {

    background-color: green;

    }

    ```


    注意，在 style 元素内部，你总是通过名称前加 `.` 来引用类。你总是通过名称前加 `#` 来引用 id。


    在这个挑战中，给你的现在具有 id `cat-photo-form` 的表单设置一个绿色背景。


    这是更新后的：


    ```css

    .red-text {

    color: red;

    }

    h2 {

    font-family: Lobster, monospace;

    }

    p {

    font-size: 16px;

    font-family: monospace;

    }

    .thick-green-border {

    border-color: green;

    border-width: 10px;

    border-style: solid;

    border-radius: 50%;

    }

    .smaller-image {

    width: 100px;

    }

    .silver-background {

    background-color: silver;

    }

    #cat-photo-form {

    background-color: green;

    }

    ```


