    ## 2.34\. Use Abbreviated Hex Code


    Many people feel overwhelmed by the possibilities of more than 16 million colors.
    And it''s difficult to remember hex code. Fortunately, you can shorten it.


    For example, red''s hex code #FF0000 can be shortened to #F00\. This shortened
    form gives one digit for red, one digit for green, and one digit for blue. This
    reduces the total number of possible colors to around 4,000\. But browsers will
    interpret #FF0000 and #F00 as exactly the same color.


    | Color | Short Hex Code |


    | Cyan | #0FF |


    | Green | #0F0 |


    | Red | #F00 |


    | Fuchsia | #F0F |


    Now, copy the code below. Go and try using the abbreviated hex codes to color
    the correct elements in the code.


    <style>


    .red-text {


    color: #000000;


    }


    .fuchsia-text {


    color: #000000;


    }


    .cyan-text {


    color: #000000;


    }


    .green-text {


    color: #000000;


    }


    </style>


    <h1 class="red-text">I am red!</h1>


    <h1 class="fuchsia-text">I am fuchsia!</h1>


    <h1 class="cyan-text">I am cyan!</h1>


    <h1 class="green-text">I am green!</h1>


    Here’s the updated code:


    <style>


    .red-text {


    color: #F00;


    }


    .fuchsia-text {


    color: #F0F;


    }


    .cyan-text {


    color: #0FF;


    }


    .green-text {


    color: #0F0;


    }


    </style>


    <h1 class="red-text">I am red!</h1>


    <h1 class="fuchsia-text">I am fuchsia!</h1>


    <h1 class="cyan-text">I am cyan!</h1>


    <h1 class="green-text">I am green!</h1>


    ## 2.35\. Use RGB values to Color Elements


    Another way you can represent colors in CSS is by using RGB values.


    The RGB value for black looks like this:


    rgb(0, 0, 0)


    The RGB value for white looks like this:


    rgb(255, 255, 255)


    Instead of using six hexadecimal digits like you do with hex code, with RGB you
    specify the brightness of each color with a number between 0 and 255.


    If you do the math, the two digits for one color equal 16 times 16, which gives
    us 256 total values. So **RGB, which starts counting from zero, has the exact
    same number of possible values as hex code**.


    Here''s an example of how you''d change the body background to orange using its
    RGB code.


    body {


    background-color: rgb(255, 165, 0);


    }


    In the code below, replace the hex code in the body element''s background color
    with the RGB value for black: rgb(0, 0, 0)


    <style>


    body {


    background-color: #F00;


    }


    </style>


    Here’s the updated code:


    <style>


    body {


    background-color: rgb(0, 0, 0);


    }


    </style>


    ## 2.36\. Use RGB to Mix Colors


    Just like with hex code, you can mix colors in RGB by using combinations of different
    values.


    Now, replace the hex codes in your style element with their correct RGB values
    in this table:


    | Color | RGB |


    | Blue | rgb(0, 0, 255) |


    | Red | rgb(255, 0, 0) |


    | Orchid | rgb(218, 112, 214) |


    | Sienna | rgb(160, 82, 45) |


    Here’s the code. Run it as it is first before you edit it:


    <style>


    .red-text {


    color: #000000;


    }


    .orchid-text {


    color: #000000;


    }


    .sienna-text {


    color: #000000;


    }


    .blue-text {


    color: #000000;


    }


    </style>


    <h1 class="red-text">I am red!</h1>


    <h1 class="orchid-text">I am orchid!</h1>


    <h1 class="sienna-text">I am sienna!</h1>


    <h1 class="blue-text">I am blue!</h1>


    Here’s the solution.


    <style>


    .red-text {


    color: rgb(255, 0, 0);


    }


    .orchid-text {


    color: rgb(218, 112, 214);


    }


    .sienna-text {


    color: rgb(160, 82, 45);


    }


    .blue-text {


    color: rgb(0, 0, 255);


    }


    </style>


    <h1 class="red-text">I am red!</h1>


    <h1 class="orchid-text">I am orchid!</h1>


    <h1 class="sienna-text">I am sienna!</h1>


    <h1 class="blue-text">I am blue!</h1>


    ## 2.37. Selector List


    Another thing you''ll see is that we can use a comma to combine multiple selectors
    in a list.


    h1,h2 {


    color: magenta;


    }


    In this example, both h1 and h2 will be styled and made magenta. So, we can use
    this comma in multiple situations. We''ll see this again later. This is a very
    common one if you have two or more elements that you want to style similarly.


    ## 2.38. Descendant Selector


    The next selector we’ll take a look at is the descendant selector. We write it
    using a space. Here’s an example.


    li a {


    color: #f10d0d;


    }


    In this example, we have li, space and then a. This is going to select all anchor
    tags a that are nested or are descendants of a list li. That is, all anchor tags
    that descend from or somewhere nested inside of an li.


    That space is very important, and is very different than a comma (li,a). So, no
    li will be styled in this example; only anchor tags a will have red color (#f10d0d)
    applied to them if they''re nested inside of an li.


    Here’s another example.


    span a {


    color: #0000ff;


    }


    In this example, we have span, space and then a. This is going to select all anchor
    tags that are nested or are descendants of a list span. That is, the color #0000ff
    (blue) will be applied to all anchor tags that descend from or somewhere nested
    inside of a span.


    So, no span will be styled in this example; only anchor tags if they''re nested
    inside of a span.


    Here’s your next challenge. Write this code snippet between the <body> and </body>
    tags of your challenge.html file.


    <h2> Search Engines like <a href="https://google.com">Google</a></h2>


    <li><a href="https://yahoo.com">Yahoo</li>


    <li><a href="https://bing.com">Bing</li>


    <li><a href="https://ask.com">Ask</li>


    Next, create a *styles.css* file in the same *02_lesson* folder if you haven’t
    already, and write the following CSS snippet inside it. Make sure you link this
    file to your *challenge.html* file.


    /* An illustration of a descendant selector */


    li a {


    color: #f10d0d;


    }


    In the first line of this code, /*…*/ is only used to represent a **multi-line
    comment** of this CSS. The **/*** comment ***/** syntax is used for either a single
    line or a multi-line (block) comment.


    When you’re ready, run the *challenge.html* code in your chrome browser. Figure
    2.38.1 shows the result you should get.


    ![Image](images/image-63.jpeg)


    Figure 2.38.1: Output of our Descendant Selector example showing the styled anchor
    tags inside a list


    As you can see in Figure 2.38.1, only the three search engines in the list have
    a red color applied to them. Google is not styled because it’s not a descendant
    of the list.


    Here’s another challenge. Explain this:


    /*Another illustration of a descendant selector*/


    footer a {


    background-color: black;


    color: blue;


    font-size: 10;


    }


    Also explain this:


    /*A third illustration of a descendant selector*/


    footer li a {


    background-color: yellow;


    color: blue;


    font-size: 12;


    }


    ## 2.39. Adjacent Selector (Combinator)


    The adjacent selector is technically called a combinator. Look at this example.


    h1 + p {


    color: red;


    }


    This + sign is the adjacent combinator. This combinator sort of alters the behavior
    of the overall selection. What this does is select every paragraph p that is immediately
    preceded by an h1 or, if you could think of it the other way, every paragraph
    that comes right after an h1 on the same level (adjacent). They''re not children
    or parents, and are not nested in anyway.


    Here''s another example. Supposing you wanted to create a navigation bar at the
    top of your web page, and you wrote this in your *challenge.html* file.


    <head>


    <link rel="stylesheet" href="styles.css">


    <nav>


    <label for="search">Search</label>


    <input type="text" placeholder="search" id="search">


    <button>Log in</button>


    <button id="signup">Sign up</button>


    </nav>


    </head>


    Here’s the output you would get:


    ![Image](images/image-64.jpeg)


    Figure 2.39.1: A search box, a login button and a sign up button created to illustrate
    how to use the adjacent combinator


    In this example, the **Log in** button comes immediately after the **search box
    (**input**)** so they are adjacent. Here’s the *styles.css* that shows how you
    could use the adjacent selector to give *every button* that comes immediately
    after *every input box* a pink color background.


    input + button {


    background-color: pink;


    }


    Here’s the output.


    ![Image](images/image-65.jpeg)'
