    in Figure 1.29.2\. It may be placed on the right side of the screen as shown,
    but you could place it on the bottom or somewhere else.


    ![Image](images/image-33.jpeg)


    Figure 1.29.2: The Chrome browser (left) and the Chrome Inspector (right)


    To start inspecting any element such as the heading Elephant on the page, first
    click the arrow on the top left corner of the inspector to activate inspection
    from the web page. So, when you now hover your mouse icon or click on any web
    element, such as Elephant on the page, the inspector automatically highlights
    the element and displays more information about it on both the page and the inspector.
    You can see that **Elephant** is a first-level heading (h1) on this page. See
    (1) and (2) Figure1.29.3.


