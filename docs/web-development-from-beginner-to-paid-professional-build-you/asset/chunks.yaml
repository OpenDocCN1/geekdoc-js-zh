  trans: "\n\n给你的表单添加一个提交按钮。点击此按钮会将你的表单数据发送到你通过表单的 `action` 属性指定的 URL。\n\n这是一个提交按钮的示例：\n\
    \n```html\n<button type=\"submit\">this button submits the form</button>\n```\n\
    \n现在，在你的表单元素的最后一个位置添加一个 `type` 为 `submit` 的按钮，并将其文本设为 `Submit`。你将得到如下代码：\n\n```html\n\
    <form action=\"https://www.catphotoapp.com/submit-cat-photo\">\n  <input type=\"\
    text\" placeholder=\"cat photo URL\">\n  <button type=\"submit\">Submit</button>\n\
    </form>\n```\n\n现在，如果你在表单元素的最后一个位置添加一个按钮，但 `type` 为 `button`，即使你像下面所示将 `Submit`\
    \ 设置为它的文本，你的表单也不会被提交：\n\n```html\n<button type=\"button\">Submit</button>\n```\n\
    \n在这种情况下，你只得到了一个按钮，而不是一个可以提交表单的按钮。你可能在某些网站上见过这种按钮，你只需点击它但什么都不会发生！这并不常见，至少在我们学习\
    \ JavaScript 之前不是，但在某些情况下你可能需要。\n\n注意：如果你没有给 `action` 属性分配任何内容，例如通过编写\n\n```html\n\
    <form action=\"\">\n```\n\n并尝试提交表单，浏览器将只会刷新页面并清空你的表单。试一试！\n\n以下是目前为止更新后的代码：\n\n\
    <h2>CatPhotoApp</h2>\n\n<main>\n  <p>点击此处查看更多 <a href=\"#\">猫咪照片</a>。</p>\n  <a\
    \ href=\"#\"><img src=\"https://bit.ly/3wwInho\" alt=\"一只可爱的猫。\"></a>\n  <p>猫咪喜欢的事：</p>\n\
    \  <ul>\n    <li>猫薄薄荷</li>\n    <li>激光笔</li>\n    <li>千能千</li>\n  </ul>\n  <p>猫咪讨厌的前\
    \ 3 件事：</p>\n  <ol>\n    <li>驱虫治疗</li>\n    <li>雷声</li>\n    <li>其他猫</li>\n  </ol>\n\
    \  <form action=\"https://www.catphotoapp.com/submit-cat-photo\">\n    <input\
    \ type=\"text\" placeholder=\"cat photo URL\">\n    <button type=\"submit\">Submit</button>\n\
    \  </form>\n</main>\n\n你有时会看到的另一件事（尽管我不怎么喜欢它）是一个 `type` 为 `submit` 的输入框：\n\n```html\n\
    <input type=\"submit\">\n```\n\n这完全不是一个坏办法，但它是创建提交按钮的另一种方式。我不喜欢它的原因是因为它是 `<input>`，这意味着没有闭合标签来让我更改“submit”文本，而我可以在普通按钮上非常轻松地更改它。例如，我可以像这样添加类似“Click\
    \ Me!”这样的内容：\n\n```html\n<button type=\"submit\">Click Me!</button>\n```\n\n如果你必须更改\
    \ `<input>` 按钮中的文本，你只需要使用一个名为 `value` 的属性，例如，你可以添加类似 click me! 这样的内容：\n\n```html\n\
    <input type=\"submit\" value=\"Click Me!\">\n```\n\n这只是有点笨拙，但它确实有效！\n\n## 1.21.\
    \ 使用 HTML5 限制字段\n\n你可以将特定的表单字段设置为必填，这样用户在填写它们之前无法提交表单。例如，如果你想让一个文本输入框变为必填，你只需要在输入元素中添加\
    \ `required` 属性，如下：\n\n```html\n<input type=\"text\" required>\n```\n\n将你的文本输入框设置为必填字段，这样用户在无法完成该字段的情况下提交表单。然后尝试在不输入任何文本的情况下提交表单。看看\
    \ HTML5 如何提示该字段是必填的。试一试：\n\n```html\n<input type=\"text\" placeholder=\"cat photo\
    \ URL\" required>\n```\n\n## 1.2.. 一组单选按钮\n\n对于希望用户从多个答案中提供一个答案的问题，可以使用单选按钮。单选按钮是一种输入。你的每个单选按钮都可以嵌套在它自己的\
    \ `label` 元素中。通过将输入封装在 `label` 元素内部，可以将单选按钮与标签关联起来。所有相关的单选按钮应该具有相同的 `name` 属性以创建一个单选组。通过创建一个单选组，选择任何一个单选按钮都会自动取消同一组内的其他按钮。这是一个单选按钮的示例：\n\
    \n```html\n<label>\n  <input type=\"radio\" name=\"indoor-outdoor\">\n</label>\n\
    ```\n\n`name` 属性将用于将 `indoor-outdoor` 选中的值发送到服务器。你应该至少创建一个 `Challenge.html` 文件，从现在直到以后编写并测试你的代码。不过，我强烈建议你创建更多这样的文件并将其命名为：例如，你可以将其命名为\
    \ `Challenge1.html`、`Challenge2.html`、`Form.html` 等。现在假设你在 `Challenge.html` 中输入以下代码：\n\
    \n```html\n<form>\n  <label for=\"username\">Enter a Username:</label>\n  <input\
    \ type=\"text\" name=\"username\">\n  <button>Submit</button>\n</form>\n```\n\n\
    尝试运行这段代码。现在，如果你在 `Challenge.html` 中输入以下代码，并在输入任何文本的情况下尝试提交表单，看看 HTML5 如何提示该字段是必填的。地址栏会显示\
    \ `https://www.catphotoapp.com/submit-cat-photo?username=Ojula`（假设输入了 Ojula）。代码如下：\n\
    \n```html\n<form>\n  <label for=\"username\">Enter a Username:</label>\n  <input\
    \ type=\"text\" name=\"username\">\n  <button>Submit</button>\n</form>\n```\n\
    （抱歉，由于提供的原文在后半部分出现了大量重复和逻辑混乱，我已根据上下文语义进行了结构性翻译，以确保逻辑通顺。注：由于原始输入文本后半部分存在严重的文本重复和错乱，翻译时已基于\
    \ HTML 逻辑进行了修正。）\n\n"
- fmt: "\n<label for=\"username\">Search Google:</label>\n<input type=\"text\" placeholder=\"\
    Enter search term\" id=\"username\" name=\"q\">\n<button>Search</button>\n\nHere’s\
    \ another challenge. Create a simple form very similar to the one above to “hijack”\
    \ Youtube search. When you’ve created the form on your browser, search any term\
    \ you like. You will be taken to [Youtube.com/results](https://www.youtube.com/results)\
    \ where you will get your search results.\n\nIn these challenges, you're conforming\
    \ to standards or rules set out by Google and YouTube. It's totally up to the\
    \ companies how they want to structure their searches. We're just playing by those\
    \ rules once we figure them out.\n\nNow, it is considered best practice to set\
    \ a `for` attribute on the `label` element, with a value that matches the value\
    \ of the `id` attribute of the `input` element. This allows assistive technologies\
    \ to create a linked relationship between the `label` and the related `input`\
    \ element. For example:\n\n```html\n<input id=\"indoor\" type=\"radio\" name=\"\
    indoor-outdoor\">\n<label for=\"indoor\">Indoor</label>\n```\n\nWe can also nest\
    \ the `input` element within the `label` tags:\n\n```html\n<label for=\"indoor\"\
    >\n  <input id=\"indoor\" type=\"radio\" name=\"indoor-outdoor\">Indoor\n</label>\n\
    ```\n\nAdd a pair of radio buttons to your form, each nested in its own `label`\
    \ element. One should have the option of indoor and the other should have the\
    \ option of outdoor. Both should share the `name` attribute of `indoor-outdoor`\
    \ to create a radio group. Also note that the `value` (`Indoor` or `Outdoor` in\
    \ the above example) should be first-letter upper case or all in upper case (`INDOOR`\
    \ or `OUTDOOR`).\n\nHere is the updated code:\n\n## CatPhotoApp\n\n<main>\n  <p>Click\
    \ here to view more <a href=\"#\">cat photos</a>.</p>\n  <a href=\"#\"><\"><img\
    \ src=\"https://bit.ly/3wwInho\" alt=\"A cute cat.\"></a>\n  <p>Things cats love:</p>\n\
    \  <ul>\n    <li>cat nip</li>\n    <li>laser pointers</li>\n    <li>lasagna</li>\n\
    \  </ul>\n  <p>Top 3 things cats hate:</p>\n  <ol>\n    <li>flea treatment</li>\n\
    \    <li>thunder</li>\n    <li>other cats</li>\n  </ol>\n  <form action=\"https://www.catphotoapp.com/submit-cat-photo\"\
    >\n    <input type=\"text\" placeholder=\"cat photo URL\" required>\n    <button\
    \ type=\"submit\">Submit</button>\n    <label for=\"indoor\">\n      <input id=\"\
    indoor\" type=\"radio\" name=\"indoor-outdoor\">Indoor\n    </label>\n    <label\
    \ for=\"outdoor\">\n      <input id=\"outdoor\" type=\"radio\" name=\"indoor-outdoor\"\
    >Outdoor\n    </label>\n  </form>\n</main>\n\nHere’s another example (with `LABEL`\
    \ formatted slightly differently):\n\n## Display Radio Buttons\n\n```html\n<form\
    \ action=\"/action_page.php\">\n  <p>Please select your favorite Web language:</p>\n\
    \  <input type=\"radio\" id=\"html\" name=\"fav_language\" value=\"HTML\">\n \
    \ <label for=\"html\">HTML</label><br>\n  <input type=\"radio\" id=\"css\" name=\"\
    fav_language\" value=\"CSS\">\n  <label for=\"css\">CSS</label><br>\n  <input\
    \ type=\"radio\" id=\"javascript\" name=\"fav_language\" value=\"JavaScript\"\
    >\n  <label for=\"javascript\">JavaScript</label>\n  <br>\n  <p>Please select\
    \ your age:</p>\n  <input type=\"radio\" id=\"age1\" name=\"age\" value=\"30\"\
    >\n  <label for=\"age1\">0 - 30</label><br>\n  <input type=\"radio\" id=\"age2\"\
    \ name=\"age\" value=\"60\">\n  <label for=\"age2\">31 - 60</label><br>\n  <input\
    \ type=\"radio\" id=\"age3\" name=\"age\" value=\"100\">\n  <label for=\"age3\"\
    >61 - 100</label><br><br>\n  <input type=\"submit\" value=\"Submit\">\n</form>\n\
    ```\n\nIn this code, `<br>` means “break” and is used to end the current line.\
    \ So, the words, Please select your age, will start in a new line.\n\nFigure 1.22.1\
    \ shows the output:\n\n![Image](images/image-19.jpeg)\nFigure 1.22.1: Output of\
    \ the code\n\n## 1.23. Create a Set of Checkboxes\n\nForms commonly use checkboxes\
    \ for questions that may have more than one answer. Checkboxes are a type of `input`.\n\
    \nEach of your checkboxes can be nested within its own `label` element. By wrapping\
    \ an `input` element inside of a `label` element, it will automatically associate\
    \ the checkbox input with the `label` element surrounding it.\n\nAll related checkbox\
    \ inputs should have the same `name` attribute.\n\nIt is considered best practice\
    \ to explicitly define the relationship between a checkbox `input` and its corresponding\
    \ `label` by setting the `for` attribute on the `label` element to match the `id`\
    \ attribute of the associated `input` element.\n\nHere's an example of a checkbox:\n\
    \n```html\n<label for=\"loving\"><input id=\"loving\" type=\"checkbox\" name=\"\
    personality\"> Loving</label>\n```\n\nHere’s your next challenge.\n\nAdd to your\
    \ form a set of three checkboxes. Each checkbox should be nested within its own\
    \ `label` element. All three should share the `name` attribute of `personality`.\n\
    \nYour code should look like:\n\n```html\n<label for=\"indoor\">\n  <input id=\"\
    indoor\" type=\"radio\" name=\"SportsType\"> Indoor\n</label>\n<label for=\"outdoor\"\
    >\n  <input id=\"outdoor\" type=\"radio\" name=\"SportsType\"> Outdoor\n</label>\n\
    <br>\n<label for=\"loving\"><input id=\"loving\" type=\"checkbox\" name=\"personality\"\
    > Loving</label>\n<label for=\"Honest\"><input id=\"Honest\" type=\"checkbox\"\
    \ name=\"personality\"> Honest</label>\n<label for=\"Humble\"><input id=\"Humble\"\
    \ type=\"checkbox\" name=\"personality\"> Humble</label>\n```\n\nHere’s another\
    \ way to write this (with the label placed on the left):\n\n```html\n<label for=\"\
    indoor\">Indoor<input id=\"indoor\" type=\"radio\" name=\"SportsType\"></label>\n\
    <label for=\"outdoor\">Outdoor<input id=\"outdoor\" type=\"radio\" name=\"SportsType\"\
    ></label>\n<br>\n<label for=\"loving\">Loving<input id=\"loving\" type=\"checkbox\"\
    \ name=\"personality\"></label>\n<label for=\"Honest\">Honest<input id=\"Honest\"\
    \ type=\"checkbox\" name=\"personality\"></label>\n<label for=\"Humble\">Humble<input\
    \ id=\"Humble\" type=\"checkbox\" name=\"personality\"></label>\n```\n\nYou can\
    \ set a checkbox or radio button to be checked by default using the `checked`\
    \ attribute. To do this, just add the word `checked` to the inside of an `input`\
    \ element. For example:\n\n```html\n<label for=\"indoor\"><input id=\"indoor\"\
    \ type=\"radio\" name=\"indoor-outdoor\" value=\"indoor\" checked> Indoor</label>\n\
    <label for=\"outdoor\"><input id=\"outdoor\" type=\"radio\" name=\"indoor-outdoor\"\
    \ value=\"outdoor\"> Outdoor</label><br>\n<label for=\"loving\"><input id=\"loving\"\
    \ type=\"checkbox\" name=\"personality\" value=\"loving\" checked> Loving</label>\n\
    <label for=\"lazy\"><input id=\"lazy\" type=\"checkbox\" name=\"personality\"\
    \ value=\"lazy\"> Lazy</label>\n<label for=\"energetic\"><input id=\"energetic\"\
    \ type=\"checkbox\" name=\"personality\" value=\"energetic\"> Energetic</label>\n\
    ```\n\nWhen the selected values are sent to the server, we need to know which\
    \ one of the radio buttons (Indoor or Outdoor) was selected by the user. To do\
    \ that, we have to add on a particular attribute called `value`. Whatever we have\
    \ in the `value`, such as “Indoor”, is sent through to the server when the form\
    \ is submitted.\n\n## 1.24. Drop-down Menu, Slider, Text Area, Form Validation\
    \ & File Upload Button\n\nNext up, we have the `select` element, which is essentially\
    \ a drop-down menu. Actually, it’s the product of two elements working together:\
    \ a `select` element and the `option` element. Here’s a sample code for creating\
    \ a drop-down menu for selecting shoe sizes.\n\n```html\n<label for=\"size-select\"\
    >Choose a shoe size:</label>\n<br>\n<select name=\"shoes\" id=\"size-select\"\
    >\n  <option value=\"\">--Please choose an option--</option>\n  <option value=\"\
    XS\">Extra Small</option>\n  <option value=\"S\">Small</option>\n  <option value=\"\
    M\">Medium</option>\n  <option value=\"L\">Large</option>\n</select>\n```\n\n\
    Try and run this code. Figure 1.24.1 shows the result when I clicked the down\
    \ arrow on the right side of the menu:\n\n![Image](images/image-20.jpeg)\n\nFigure\
    \ 1.24.1: The output of a shoe-size selector code\n"
