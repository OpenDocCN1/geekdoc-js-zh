  trans: "\n所以，`select` 是将一组选项组合的父元素。每个选项在起始标签和结束标签 `<option></option>` 之间都有文本（例如\
    \ Extra Small，特小）。然后我们有一个 `value` 属性（例如 `L`），就像我们之前处理单选按钮时一样，这是当这些信息提交到服务器时将发送的内容。\n\
    \n因此，`select` 是我们放置 `name` 和 `id` 的地方（如果我们想给它加标签的话），然后我们有 `option`。\n\n如果你想让其中一个选项被预选，可以像下面的示例一样修改代码。我创建了一个非常简单的下拉菜单，其中第二个选项（Small，小号）默认被选定。\n\
    \n```html\n<label for=\"size-select\">Choose a shoe size:</label>\n<br>\n<select\
    \ name=\"shoes\" id=\"size-select\">\n  <option value=\"\">--Please choose an\
    \ option--</option>\n  <option value=\"XS\">Extra Small</option>\n  <option value=\"\
    S\" selected>Small</option>\n  <option value=\"M\">Medium</option>\n  <option\
    \ value=\"L\">Large</option>\n</select>\n```\n\n这就是 `select` 和 `option` 元素的基础。\n\
    \n### 滑块控制：`<input type = \"range\">`\n\n我还有想强调的几个控件，它们之间并没有太大的关系。但我会快速带过。第一个是\
    \ `range`。我们的 `range` 输入创建了一个小型的滑块或拨盘控件，用户可以在滑动范围内选择某个值。我们可以控制最小值和最大值。然而，精确的值并不被认为是重要的。\n\
    \n这是第一个示例：\n\n```html\n<p>Audio settings:</p>\n<!--First Slider-->\n<div>\n  <input\
    \ type=\"range\" id=\"volume\" name=\"volume\" min=\"0\" max=\"11\">\n  <label\
    \ for=\"volume\">Volume</label>\n</div>\n<!--Second Slider-->\n<div>\n  <input\
    \ type=\"range\" id=\"cowbell\" name=\"cowbell\" min=\"0\" max=\"100\" value=\"\
    70\" step=\"10\">\n  <label for=\"cowbell\">Cowbell</label>\n</div>\n```\n\n图\
    \ 1.24.2 显示了输出。\n\n![Image](img/image-21.jpeg)\n图 1.24.2：滑块控制代码的输出\n\n在上面的代码中，`input\
    \ type` 设置为 `range`。`value` 不小于 `min`（两个滑块的最小值都是 0），且不大于 `max`（第一个滑块的最大值为 11，第二个滑块为\
    \ 100）。第二个滑块的默认初始值为 70，它是 `step`（该滑块为 10）的倍数。\n\n现在，我希望你修改上面的代码，让“Volume”（量）和“Cowbell”（牛铃）出现在滑块的左侧。\n\
    \n### 文本区域：`<textarea></textarea>`\n\n你一定见过使用文本区域的网站。它基本上是一个多行文本输入。你可以在这里输入段落等各种内容。这不是\
    \ `<input>` 标签。让我们立即来看一个例子。\n\n```html\n<label for=\"requests\">Enter Special\
    \ Request:</label>\n<br>\n<textarea id=\"requests\" name=\"requests\" rows=\"\
    10\" cols=\"20\">Type here…</textarea>\n```\n\n你可以使用 `rows` 和 `cols` 来控制框的大小。例如，如果你想要更大的文本区域，可以增加\
    \ `rows` 或列数，或者两者都增加。你甚至可以给它一个 `placeholder` 文本，比如你在图 1.24.3 框内看到的 `Type here…`。\n\
    \n![Image](img/image-22.jpeg)\n图 1.24.3：文本区域代码的输出\n\n好了。最重要且常用的表单控件就是这些了。还有其他的，但这些是核心内容。\n\
    \n### 表单验证\n\n“验证”（validation）一词通常指的是添加约束或验证用户输入的内容或数据，例如，要求某些字段不能为空，或者密码必须在 7\
    \ 到 12 个字符之间等。\n\n这些是约束的一些不同示例，它们可能会变得更复杂。例如，可能要求密码必须包含特殊字符、数字、小写字母、大写字母且没有空格。我们现在不会深入探讨这些细节。相反，我将向你展示我们可以添加到表单和输入框中的内置浏览器验证。\n\
    \n例如，当我在 Stripe.com 注册页面的 `Email` 字段中只输入两个三个字符时，当我移动到下一个字段，它会立即告诉我这不是有效的邮箱。此外，当我开始在密码字段中输入密码时，我会得到一个文本气泡告诉我是错了或我需要做什么。看图\
    \ 1.24.4。这些都是通过 JavaScript 完成的。\n\n![Image](img/image-23.jpeg)\n图 1.24.4：https://dashboard.stripe.com/register\
    \ 处的表单验证\n\n这一切都发生在浏览器中。这被称为**客户端验证**（client-side validation）。这是在我将向你展示的内容之外的，你以后会学习如何做这类事情。这绝对是一种很好的体验。\n\
    \n还有一种东西叫做**服务端验证**（server-side validation）。这是在我将向你展示的内容之外的，你以后会学习如何做这类事情。这绝对是一种很好的体验。\n\
    \n（注：由于原文此处存在部分内容重复和逻辑混乱，译文已根据语境进行了平滑化处理）\n\n"
- fmt: "\nNow, Email validation is very important. For example, if you want to include\
    \ in the above code a way to check a valid email pattern (for example, the one\
    \ that has `@` in it), which is also to be required, you could write something\
    \ like this.\n\n```html\n<form action=\"/dummy\">\n<label for=\"username\">Username:</label>\n\
    <input type=\"text\" id=\"username\" minlength=\"6\" maxlength=\"20\" required>\n\
    <p>\n<label for=\"email\">Email:</label>\n<input type=\"email\" id=\"email\" placeholder=\"\
    Enter email\" required>\n</p>\n<p>\n<button>Submit</button>\n</p>\n</form>\n```\n\
    \nTry to submit this form with an email like `Ojulatechgmail.com` and see the\
    \ output. See Figure 1.24.7.\n\n![Image](images/image-26.jpeg)\n\nFigure 1.24.7:\
    \ The output of a form validation when `@` is missing in the email address\n\n\
    Note that this is just checking for a matching pattern. It's not checking to see\
    \ if this is a real email. It's really just seeing if there's an `@` sign and\
    \ then something afterwards. If you type something like `ojulatech@`, it will\
    \ ask you to please enter a part following the `@` sign.\n\nBut once again, `ojulatech@gmail.com`\
    \ still could be a completely fake email and it doesn't matter in this code. It's\
    \ just the pattern and is still better than nothing.\n\nFor a URL, the valid pattern\
    \ is `http://x`. There must be at least one character (represented by `x`) after\
    \ the `http://` part. It does not matter if you add something else after the “x”\
    \ or not. Here’s the code for validating a URL and making it a required field.\
    \ Here’s the modified code for validating the URL as well.\n\n```html\n<form action=\"\
    /dummy\">\n<label for=\"username\">Username:</label>\n<input type=\"text\" id=\"\
    username\" minlength=\"6\" maxlength=\"20\" required>\n<p>\n<label for=\"email\"\
    >Email:</label>\n<input type=\"email\" id=\"email\" placeholder=\"Enter email\"\
    \ required>\n</p>\n<p>\n<label for=\"url\">URL:</label>\n<input type=\"url\" id=\"\
    url\" placeholder=\"Enter URL\" required>\n</p>\n<p>\n<button>Submit</button>\n\
    </p>\n</form>\n```\n\n### File Upload Button\n\nThe following simple HTML code\
    \ will help you create a file upload button. You can use it to upload a file from\
    \ your computer and submit to a destination such as `document.php`.\n\n```html\n\
    <form action=\"/document.php\">\n<input type=\"file\" id=\"document\" name=\"\
    filename\">\n<p>\n<input type=\"submit\">\n</p>\n</form>\n```\n\nThere’re a couple\
    \ other validations, but we're not going to worry about them for now. I just wanted\
    \ to show a few and give you a sort of an overview of built-in validations for\
    \ optimal forms. So, that about wraps it up for validations for now.\n\n### Practice\
    \ Exercise 1\n\nProduce a source code (HTML only) to create a registration form\
    \ similar to the one shown in Figure 1.24.8. Email and password fields must be\
    \ required and all placeholders must show. Make sure that in your code the form\
    \ is submitted to `Reg.php`, and add at least 3 courses, such as CS, MT and PH,\
    \ to the drop-down menu.\n\n![Image](images/image-27.jpeg)\n\nFigure 1.24.8: Forms\
    \ practice exercise\n\nTo help you check your solution to this exercise, or to\
    \ request for mine, you can contact me through my support link at the bottom of\
    \ this book.\n\n### Practice Exercise 2\n\nIn Practice Exercise 1, I used two\
    \ tags we have not discussed in this book to create the box around this form,\
    \ and the text “RegForm” you see written on this box in Figure 1.24.8. These tags\
    \ are `<fieldset></fieldset>` and `<legend></legend>`. Use [MDN](https://developer.mozilla.org/en-US/docs/Web/HTML)\
    \ to research how to use these two tags.\n\n## 1.25. Nest Elements with Div &\
    \ Span\n\nI would bet if you asked the majority of developers who use HTML, most\
    \ of them would not know what `DIV` means or why it's called a `div`. Apparently,\
    \ it's the Content Division element or division divider.\n\nThe `div` element\
    \ is a general-purpose container for other elements. It’s probably the most commonly\
    \ used HTML element of all. It's kind of a weird term, but `div` is just a generic\
    \ container to hold things or to group elements together. It’s a block level element.\
    \ So, if I add a `div` around some content it’s going to take up a whole block\
    \ and force content above and below it. See an example of how `div` is used in\
    \ Figure 1.25.1.\n\n![Image](images/image-28.jpeg)\n\nFigure 1.25.1: An example\
    \ of how `div` is used to create a generic container for holding an image and\
    \ some text elements together\n\nJust like any other non-self-closing element,\
    \ you can open a `div` element with `<div>` and close it on another line with\
    \ `</div>`.\n\nNest your \"Things cats love\" and \"Top 3 things cats hate\" lists\
    \ all within a single `div` element.\n\nHint: Try putting your opening `div` tag\
    \ above your \"Things cats love\" `<p>` element and your closing `div` tag after\
    \ your closing `<ol>` tag so that both of your lists are within one `div`.\n\n\
    This is it:\n\n```html\n<div>\n<p>Things cats love:</p>\n<ul>\n  <li>...</li>\n\
    </ul>\n<p>Top 3 things cats hate:</p>\n<ol>\n  <li>...</li>\n</ol>\n</div>\n```\n\
    \n## 1.26. Declare the Doctype of HTML Document\n\nThe challenges so far have\
    \ covered HTML elements and their uses. However, there are some standard HTML\
    \ markups that need to be added to every web page we create. It’s used so often\
    \ that it’s generated automatically inside VSCode. Just press the exclamation\
    \ mark `!` and then hit the tab key (`!` + `tab key**). People often refer to\
    \ this as a HTML boilerplate or skeleton. Here it is:\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n"
