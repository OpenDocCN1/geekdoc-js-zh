- fmt: "\nLet's add a submit button to your form. Clicking this button will send the\
    \ data from your form to the URL you specified with your form's `action` attribute.\n\
    \nHere's an example submit button:\n\n```html\n<button type=\"submit\">this button\
    \ submits the form</button>\n```\n\nNow, add a button as the last element of your\
    \ form element with a `type` of `submit`, and `Submit` as its text. This is what\
    \ you should get:\n\n```html\n<form action=\"https://www.catphotoapp.com/submit-cat-photo\"\
    >\n  <input type=\"text\" placeholder=\"cat photo URL\">\n  <button type=\"submit\"\
    >Submit</button>\n</form>\n```\n\nNow, if you add a button as the last element\
    \ of your form element but with a `type` of `button`, and even if you put `Submit`\
    \ as its text as shown below, your form will not be submitted:\n\n```html\n<button\
    \ type=\"button\">Submit</button>\n```\n\nIn this case, you only get a button,\
    \ not a button that submits a form. You’ve probably seen this type of button on\
    \ some websites where you just click on it and nothing happens! That's not very\
    \ common, at least not until we get to JavaScript, but there are times you may\
    \ want this.\n\nNote: If you assign nothing to the `action` attribute, for example\
    \ by writing\n\n```html\n<form action=\"\">\n```\n\nand you try to submit the\
    \ form, the browser will only refresh the page and purge your form. Try it!\n\n\
    Here is the updated code so far:\n\n<h2>CatPhotoApp</h2>\n\n<main>\n  <p>Click\
    \ here to view more <a href=\"#\">cat photos</a>.</p>\n  <a href=\"#\"><img src=\"\
    https://bit.ly/3wwInho\" alt=\"A cute cat.\"></a>\n  <p>Things cats love:</p>\n\
    \  <ul>\n    <li>cat nip</li>\n    <li>laser pointers</li>\n    <li>lasagna</li>\n\
    \  </ul>\n  <p>Top 3 things cats hate:</p>\n  <ol>\n    <li>flea treatment</li>\n\
    \    <li>thunder</li>\n    <li>other cats</li>\n  </ol>\n  <form action=\"https://www.catphotoapp.com/submit-cat-photo\"\
    >\n    <input type=\"text\" placeholder=\"cat photo URL\">\n    <button type=\"\
    submit\">Submit</button>\n  </form>\n</main>\n\nOne other thing that you will\
    \ see sometimes, although I'm not a big fan of it, is an input with the `type`\
    \ of `submit`:\n\n```html\n<input type=\"submit\">\n```\n\nThis is not a bad way\
    \ at all, but it's another way to make a submit button. The reason I don't like\
    \ this is that it's `<input>`, which means there's no closing tag that allows\
    \ me to change the text “submit”, whereas I can change it on the regular button\
    \ very easily. For example, I can add something like “Click Me!” like this:\n\n\
    ```html\n<button type=\"submit\">Click Me!</button>\n```\n\nIf you must change\
    \ the text in the `<input>` button you just have to use an attribute called `value`\
    \ for example, you can add something like click me!:\n\n```html\n<input type=\"\
    submit\" value=\"Click Me!\">\n```\n\nIt's just a little clunky, but it does work!\n\
    \n## 1.21. Use HTML5 to Require a Field\n\nYou can require specific form fields\
    \ so that your user will not be able to submit the form until he or she has filled\
    \ out. For example, if you wanted to make a text input required, you can just\
    \ add the `required` attribute within your input element, like this:\n\n```html\n\
    <input type=\"text\" required>\n```\n\nMake your text input a required field,\
    \ so that your user can't submit the form without completing this field. Then\
    \ try to submit the form without inputting any text. See how HTML5 notifies you\
    \ that the field is required. Try it:\n\n```html\n<input type=\"text\" placeholder=\"\
    cat photo URL\" required>\n```\n\n## 1.2.. a Set of Radio Buttons\n\nYou can use\
    \ radio buttons for questions where you want the user to give you one answer out\
    \ of multiple. Radio buttons are a type of input. Each of your radio buttons can\
    \ be nested within its own label element. By wrapping an input inside a label\
    \ element it will associate the radio button with the label. All related radio\
    \ buttons should have the same `name` attribute to create a radio group. By creating\
    \ a radio group, selecting any single radio button will automatically deselect\
    \ the other buttons within the same group. Here's an example of a radio button:\n\
    \n```html\n<label>\n  <input type=\"radio\" name=\"indoor-outdoor\">\n</label>\n\
    ```\n\nThe `name` attribute will be used to send the value selected for `indoor-outdoor`\
    \ to the server. You should create at least one `Challenge.html` file to write\
    \ and test your code from now till the rest of. However, I highly recommend you\
    \ create more of these files and name them like: for example you can name them\
    \ `Challenge1.html`, `Challenge2.html`, `Form.html`, etc. Now let’s say you enter\
    \ the following code in `Challenge.html`:\n\n```html\n<form>\n  <label for=\"\
    username\">Enter a Username:</label>\n  <input type=\"text\" name=\"username\"\
    >\n  <button>Submit</button>\n</form>\n```\n\nTry and run this code. Now if you\
    \ enter `Ojula` as your username in the form for example, after clicking the `Submit`\
    \ button to submit the form, you will see this on the address bar of your browser:\n\
    \n`http://127.0.0.1:5500/Challenge.html?username=Ojula`\n\nIn this example, the\
    \ `name` attribute submits the value of `username`, which is `Ojula`, to the server.\
    \ Study the following code. Then try to enter and run it to see the output:\n\n\
    ```html\n<h1>Forms Demo</h1>\n<form action=\"tacos\">\n  <p>\n    <label for=\"\
    username\">Enter a Username:</label>\n    <input type=\"text\" placeholder=\"\
    Enter Username\" id=\"username\" name=\"username\">\n  </p>\n  <p>\n    <label\
    \ for=\"password\">Enter Password</label>\n    <input type=\"password\" placeholder=\"\
    Enter Password\" id=\"password\" name=\"password\">\n  </p>\n  <p>\n    <label\
    \ for=\"color\">Enter a color:</label>\n    <input type=\"color\" id=\"color\"\
    \ name=\"color\">\n  </p>\n  <input type=\"month\" name=\"month\">\n  <input type=\"\
    number\" name=\"number\">\n  <input type=\"radio\" name=\"color\">\n  <p>\n  \
    \  <button>Submit</button>\n  </p>\n</form>\n```\n\nNow, once the code has loaded\
    \ on your browser, try to fill the form. For me, I selected March, 2022 as the\
    \ Month and a shade of red color. I entered 1258 for the number, and `me1234`\
    \ as my password. Finally, I clicked the `Submit` button. This is the URL I see\
    \ on the address bar of my browser:\n\n`http://127.0.0.1:5500/tacos?username=Ojula&password=me1234&color=%23e60aa&month=2022-03&number=1258`\n\
    \nYou should see all the values you entered in the form inside the address! The\
    \ `&` (ampersand) is used to connect the different pairs of entries. `%23e60aa`\
    \ is the hash symbol for my shade of red color.\n\nTo cut the long story short,\
    \ `name` is important. You should put it on every single input that you use. It\
    \ will be used when you send your data to a server eventually.\n\nFor the number\
    \ input, you can set a minimum, a maximum, and an initial value. You can also\
    \ set an incremental `step`. So, for `<input type=\"number\" name=\"number\">`,\
    \ try to modify it in your editor as follows and then run it:\n\n```html\n<label>\
    \ Enter a Number:\n  <input type=\"number\" name=\"number\" min=\"10\" max=\"\
    1000\" step=\"20\">\n</label>\n```\n\nWhen you use the up and down arrows to increase/decrease\
    \ the number, you can only go up or down by a step of 10, and you won’t be able\
    \ to go below 10 or above 1000.\n\nThe last thing I want to mention is when we\
    \ run our code, our data is showing up in the URL, which could be problematic,\
    \ right? We don't want our password to be in the URL, but that's because we're\
    \ sending what's known as a `GET` request.\n\nLater on, you'll see that there're\
    \ different types of requests, such as a `HTTP` request, and a `POST` request\
    \ where that data will not be in the URL when it is sent, not necessarily in a\
    \ secret way, but in a less obvious or less visually obvious way. This is a much\
    \ better approach.\n\nFor now, we're not dealing with that. This just allows us\
    \ to see that all of our data is sent using that name.\n"
  raw: 'Let''s add a submit button to your form. Clicking this button will send the
    data from your form to the URL you specified with your form''s action attribute.


    Here''s an example submit button:


    <button type="submit">this button submits the form</button>


    Now, add a button as the last element of your form element with a type of submit,
    and Submit as its text. This is what you should get:


    <form action="https://www.catphotoapp.com/submit-cat-photo">


    <input type="text" placeholder="cat photo URL">


    <button type="submit">Submit</button>


    </form>


    Now, if you add a button as the last element of your form element but with a type
    of button, and even if you put Submit as its text as shown below, your form will
    not be submitted.


    <button type="button">Submit</button>


    In this case, you only get a button, not a button that submits a form. You’ve
    probably seen this type of button on some websites where you just click on it
    and nothing happens! That''s not very common, at least not until we get to JavaScript,
    but there are times you may want this.


    Note: If you assign nothing to the action attribute, for example by writing


    <form action="”>


    and you try to submit the form, the browser will only refresh the page and purge
    your form. Try it!


    Here is the updated code so far:


    <h2>CatPhotoApp</h2>


    <main>


    <p>Click here to view more <a href="#">cat photos</a>.</p>


    <a href="#"><img src="https://bit.ly/3wwInho" alt="A cute cat."></a>


    <p>Things cats love:</p>


    <ul>


    <li>cat nip</li>


    <li>laser pointers</li>


    <li>lasagna</li>


    </ul>


    <p>Top 3 things cats hate:</p>


    <ol>


    <li>flea treatment</li>


    <li>thunder</li>


    <li>other cats</li>


    </ol>


    <form action="https://www.catphotoapp.com/submit-cat-photo">


    <input type="text" placeholder="cat photo URL">


    <button type="submit">Submit</button>


    </form>


    </main>


    One other thing that you will see sometimes, although I''m not a big fan of it,
    is an input with the type of submit:


    <input type="submit">


    This is not a bad way at all, but it''s another way to make a submit button. The
    reason I don''t like this is that it''s <input>, which means there''s no closing
    tag that allows me to change the text “submit”, whereas I can change it on the
    regular button very easily. For example, I can add something like “Click Me!”
    like this:


    <button type="submit">Click Me!</button>


    If you must change the text in the <input> button you just have to use an attribute
    called value for example, you can add something like click me!


    <input type="submit" value="Click Me!">


    It''s just a little clunky, but it does work!


    ## 1.21\. Use HTML5 to Require a Field


    You can require specific form fields so that your user will not be able to submit
    your form until he or she has filled them out.


    For example, if you wanted to make a text input field required, you can just add
    the attribute required within your input element, like this:


    <input type="text" required>


    Make your text input a required field, so that your user can''t submit the form
    without completing this field.


    Then try to submit the form without inputting any text. See how your HTML5 form
    notifies you that the field is required. Try it.


    <input type="text" placeholder="cat photo URL" required>


    ## 1.22. Create a Set of Radio Buttons


    You can use **radio buttons** for questions where you want the user to only give
    you one answer out of multiple options.


    Radio buttons are a type of input.


    Each of your radio buttons can be nested within its own label element. By wrapping
    an input element inside of a label element it will automatically associate the
    radio button input with the label element surrounding it.


    All related radio buttons should have the same name attribute to create a radio
    button group. By creating a radio group, selecting any single radio button will
    automatically deselect the other buttons within the same group ensuring only one
    answer is provided by the user.


    Here''s an example of a radio button:


    <label>


    <input type="radio" name="indoor-outdoor">Indoor


    </label>


    The attribute name will be used to send the value selected for "indoor-outdoor"
    to the server. You should create at least one Challenge.html file to write and
    test your code in from now till the rest of this book. However, I highly recommend
    you create more of these files and name them as you like, For example, you can
    name them like Challenge1.html, Challenge2.html, FormChallenge.html, etc.


    Now, let’s say you enter the following code in your first Challenge.html file:


    <Form>


    <label for="username">Enter a Username:</label>


    <input type="text" name="username" id="username">


    <button>Submit</button>


    </Form>


    Try and run this code. Now, if you enter Ojula as your username in the form for
    example, after clicking the “Submit” button to submit the form, you will see this
    on the address bar of your browser:


    http://127.0.0.1:5500/Challenge.html?username=Ojula


    In this example, the attribute name submits the value of username, which is Ojula,
    to the server.


    Study the following code. Then try to enter and run it to see the output.


    <h1>Forms Demo</h1>


    <form action="tacos">


    <p>


    <label for="username">Enter a Username:</label>


    <input type="text" placeholder="Enter Username" id="username" name="username">


    </p>


    <p>


    <label for="password">Enter a Password</label>


    <input type="password" placeholder="Enter Password" id="password" name="password">


    </p>


    <p>


    <label for="color">Enter a color:</label>


    <input type="color" id="color" name="color">


    </p>


    <input type="month" name="month">


    <input type="number" name="number">


    <input type="radio" name="color">


    <p>


    <button>Submit</button>


    </p>


    </form>


    Now, once the code has loaded on your browser, try to fill the form. For me, I
    selected March, 2022 as the Month and a shade of red color. I entered 1258 for
    the number, and “me1234” as my password. Finally, I clicked the “Submit” button.
    This is the URL I see on the address bar of my browser:


    http://127.0.0.1:5500/tacos?username=Ojula&password=me1234&color=%23e60a0a&month=2022-03&number=1258


    You should see all the values you entered in the form inside the address! The
    & (ampersand) is used to connect the different pairs of entries. “%23e60a0a” is
    the hash symbol for my shade of red color.


    To cut the long story short, name is important. You should put it on every single
    input that you use. It will be used when you send your data to a server eventually.


    For the number input, you can set a minimum, a maximum, and an initial value.
    You can also set an incremental step. So, for <input type="number" name="number">,
    try to modify it in your editor as follows and then run it:


    <label> Enter a Number:


    <input type="number" name="number" min="10" max="1000" step="20">


    </label>


    When you use the up and down arrows to increase/decrease the number, you can only
    go up or down by a step of 10, and you won’t be able to go below 10 or above 1000.


    The last thing I want to mention is when we run our code, our data is showing
    up in the URL, which could be problematic, right? We don''t want our password
    to be in the URL, but that''s because we''re sending what''s known as a GET request.


    Later on, you''ll see that there''re different types of requests, such as a HTTP
    request, and a POST request where that data will not be in the URL when it is
    sent, not necessarily in a secret way, but in a less obvious or less visually
    obvious way. This is a much better approach.


    For now, we''re not dealing with that. This just allows us to see that all of
    our data is sent using that name. Google, Youtube and other search engines use
    terms like q and search_query as their name to send search queries to their servers.


    In this challenge, you’re going to “hijack” Google search by creating a simple
    form with the code below to search on Google. When you’ve created the form on
    your browser, search any term you like. You will be taken to [Google.com/search](https://www.google.com/search)
    where you will get your search results.


    <form action="https://www.google.com/search">'
