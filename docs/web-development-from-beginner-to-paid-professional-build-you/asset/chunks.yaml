    ## 2.24. Understand Absolute versus Relative Units (EM and REM)


    The last several challenges all set an element''s margin or padding with pixels
    (`px`). Pixels are a type of length unit, which is what tells the browser how
    to render elements.


    The two main types of length units are absolute and relative. Absolute units,
    such as `px`, `mm`, `cm`, `in`, `pt`, and `pc`, are fixed physical measurements.
    Relative units, such as `em`, `rem`, `vw`, `vh`, and `%`, are sized relative to
    some other value. For example, `em` is relative to the font size of the element,
    while `rem` is relative to the font size of the root element.


