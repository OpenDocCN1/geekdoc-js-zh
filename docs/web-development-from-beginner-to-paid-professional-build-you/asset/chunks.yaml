  trans: "\n这里是更新：\n\n```html\n<style>\nbody {\n  background-color: black;\n  font-family:\
    \ monospace;\n  color: green;\n}\n.pink-text {\n  color: pink;\n}\n</style>\n\
    ```\n\n`<h1 class=\"pink-text\">Hello World!</h1>`\n\n如果你现在查看更新后的代码输出，你会发现你的 `h1`\
    \ 元素被赋予了粉红色。这证明你的 `pink-text` 类覆盖了 `body` 元素的 CSS。\n\n## 2.28. 在后续 CSS 中覆盖样式\n\
    \n我们的 `pink-text` 类覆盖了 `body` 元素的 CSS 声明！我们刚刚证明了类会覆盖 `body` 元素的 CSS。所以，下一个逻辑性问题是，我们能做什么来覆盖我们的\
    \ `pink-text` 类呢？\n\n创建一个名为 `blue-text` 的额外 CSS 类，将元素设置为蓝色。确保它位于你的 `pink-text`\
    \ 类声明之下。\n\n在你的 `h1` 元素上除了 `pink-text` 类之外也应用 `blue-text` 类，让我们看看哪一个胜出。在 HTML\
    \ 元素上应用多个类属性是通过在它们之间加空格来实现的：\n\n`class=\"class1 class2\"`\n\n注意：类在 HTML 元素中列出的顺序并不重要。\n\
    \n然而，`<style>` 部分中类声明的顺序才是重要的。第二个声明总是优先于第一个声明。因为 `.blue-text` 是第二个声明的，它覆盖了 `.pink-text`\
    \ 的属性。\n\n代码如下：\n\n```html\n<style>\nbody {\n  background-color: black;\n  font-family:\
    \ monospace;\n  color: green;\n}\n.pink-text {\n  color: pink;\n}\n.blue-text{\n\
    \  color: blue;\n}\n</style>\n<h1 class=\"pink-text blue-text\">Hello World!</h1>\n\
    ```\n\n## 2.29. 通过为 ID 属性覆盖类声明\n\n我们刚刚证明了浏览器按照声明顺序从上到下读取 CSS。这意味着在发生冲突时，浏览器将使用最后出现的\
    \ CSS 声明。注意，即使我们在 `h1` 元素的类中将 `blue-text` 放在 `pink-text` 之前，它仍然会查看声明顺序，而不是使用顺序！\n\
    \n但我们还没有结束。还有其他覆盖 CSS 的方法。你还记得 id 属性吗？\n\n让我们通过给 `h1` 元素一个 id 并对该 id 进行样式，来覆盖你的\
    \ `pink-text` 和 `blue-text` 类，并将 `h1` 元素设置为橙色。\n\n给你的 `h1` 元素添加 `id=\"orange-text\"\
    `。记住，id 样式看起来像：\n\n`<h1 id=\"orange-text\">`\n\n在你的 `h1` 元素上保留 `blue-text` 和 `pink-text`\
    \ 类。在你的样式元素中为你的 `orange-text` id 创建 CSS 声明。这是一个示例：\n\n```css\n#brown-text {\n\
    \  color: brown;\n}\n```\n\n注意：无论将此 CSS 在 `pink-text` 类之上还是之下都不重要，因为 `id` 属性始终具有高优先级。\n\
    \n你的代码应该是这样的：\n\n```html\n<style>\nbody {\n  background-color: black;\n  font-family:\
    \ monospace;\n  color: green;\n}\n.pink-text {\n  color: pink;\n}\n.blue-text\
    \ {\n  color: blue;\n}\n#orange-text {\n  color: orange;\n}\n</style>\n<h1 id=\"\
    orange-text\" class=\"pink-text blue-text\">Hello World!</h1>\n```\n\n你的输出应该像图\
    \ 2.29.1。\n\n![Image](img/image-61.jpeg)\n\n图 2.29.1：H1 元素呈现橙色，因为 `pink-text`\
    \ 和 `blue-text` 类被覆盖了。\n\n## 2.30. 使用内联样式覆盖类声明\n\n所以，我们证明了无论在样式元素 CSS 中于什么位置声明，id\
    \ 声明都会覆盖类声明。\n\n还有其他覆盖 CSS 的方法。你还记得内联样式吗？使用内联样式尝试让我们的 `h1` 元素变为白色。记住，内联样式看起来像：\n\
    \n`<h1 style=\"color: green;\">`\n\n在你的 `h1` 元素上保留 `blue-text` 和 `pink-text` 类。方法如下：\n\
    \n```html\n<style>\nbody {\n  background-color: black;\n  font-family: monospace;\n\
    \  color: green;\n}\n.pink-text {\n  color: pink;\n}\n.blue-text {\n  color: blue;\n\
    }\n#orange-text {\n  color: orange;\n}\n</style>\n<h1 style=\"color: white;\"\
    \ id=\"orange-text\" class=\"pink-text blue-text\">Hello World!</h1>\n```\n\n\
    检查浏览器上的输出。“Hello World!”文本应该是白色的。\n\n## 2.31. 使用 Important 覆盖所有其他样式\n\n太棒了！我们刚刚证明内联样式将覆盖样式元素中的所有\
    \ CSS 声明。等一下。还有最后一种覆盖 CSS 的方法。这是所有方法中最强大的。但在在此之前，让我们谈谈你为什么想要覆盖 CSS。\n\n在很多情况下，你会使用\
    \ CSS 库。这些库可能会意外地覆盖你自己的 CSS。因此，当你绝对需要确保一个元素具有特定的 CSS 时，你可以使用 `!important`。\n\n\
    回到我们的 `pink-text` 类声明。记住，我们的 `pink-text` 类被后续的类声明、id 声明和内联样式覆盖了。\n\n给你的 `pink-text`\
    \ 类添加关键字 `!important`。\n\n```css\n.pink-text {\n  color: pink !important;\n}\n\
    ```\n\n## 2.32. 使用十六进制代码指定特定颜色\n\n你知道还有其他指定颜色的方法吗？其中一种就是十六进制代码。十六进制代码以 `#` 开头，后跟六个字符：0-9\
    \ 和 a-f（或 A-F）。这是一个 16 进制系统，每个数字提供 16 种可能的值。\n\n六六数字分别代表红、绿、蓝的量。例如，`#FF0000` 是纯红色，`#00FF00`\
    \ 是纯绿色，`#0000FF` 是纯蓝色。\n\n| 颜色 | 十六进制代码 |\n| :--- | :--- |\n| 红色 | #FF0000 |\n\
    | 绿色 | #00FF00 |\n| 蓝色 | #0000FF |\n| 橙色 | #FFA500 |\n| 紫色 | #800080 |\n| 青色 |\
    \ #00FFFF |\n\n通过混合这三种颜色，你可以创造超过 1600 万种颜色！\n\n## 2.33. 使用十六进制代码混合颜色\n\n回顾一下，十六进制代码使用红\
    \ (R)、绿 (G) 和蓝 (B) 分量。从这三种纯色（红、绿、蓝）中，我们可以改变每种量来创建任何颜色。\n\n例如，橙色是纯红色混合了一些绿色且没有蓝色。在十六进制代码中，这翻译为\
    \ `#FFA500`。\n\n数字 0 是十六进制代码中最小的，代表颜色的完全缺失。数字 F 是十六进制代码中最大的，代表最大的亮度。\n\n| 颜色 |\
    \ 十六进制代码 |\n| :--- | :--- |\n|  深青色 | #1E90FF |\n| 绿色 | #00FF00 |\n| 橙色 | #FFA500\
    \ |\n| 红色 | #FF0000 |\n"
- fmt: "\n![Image](images/image-62.jpeg)\n\nFigure 2.33.1: Colors produced with their\
    \ Hex codes\n\n## 2.34 Use Abbreviated Hex Code\n\nMany people feel overwhelmed\
    \ by the possibilities of more than 16 million colors. And it's difficult to remember\
    \ hex code. Fortunately, you can shorten it.\n\nFor example, red's hex code `#FF0000`\
    \ can be shortened to `#F00`. This shortened form gives one digit for red, one\
    \ digit for green, and one digit for blue. This reduces the total number of possible\
    \ colors to around 4,000. But browsers will interpret `#FF0000` and `#F00` as\
    \ exactly the same color.\n\n| Color | Short Hex Code |\n| :--- | :--- |\n| Cyan\
    \ | #0FF |\n| Green | #0F0 |\n| Red | #F00 |\n| Fuchsia | #F0F |\n\nNow, copy\
    \ the code below. Go and try using the abbreviated hex codes to color the correct\
    \ elements in the code.\n\n```html\n<style>\n.red-text {\n  color: #000000;\n\
    }\n.fuchsia-text {\n  color: #000000;\n}\n.cyan-text {\n  color: #000000;\n}\n\
    .green-text {\n  color: #000000;\n}\n</style>\n\n<h1 class=\"red-text\">I am red!</h1>\n\
    <h1 class=\"fuchsia-text\">I am fuchsia!</h1>\n<h1 class=\"cyan-text\">I am cyan!</h1>\n\
    <h1 class=\"green-text\">I am green!</h1>\n```\n\nHere’s the updated code:\n\n\
    ```html\n<style>\n.red-text {\n  color: #F00;\n}\n.fuchsia-text {\n  color: #F0F;\n\
    }\n.cyan-text {\n  color: #0FF;\n}\n.green-text {\n  color: #0F0;\n}\n</style>\n\
    \n<h1 class=\"red-text\">I am red!</h1>\n<h1 class=\"fuchsia-text\">I am fuchsia!</h1>\n\
    <h1 class=\"cyan-text\">I am cyan!</h1>\n<h1 class=\"green-text\">I am green!</h1>\n\
    ```\n\n## 2.35 Use RGB values to Color Elements\n\nAnother way you can represent\
    \ colors in CSS is by using RGB values.\n\nThe RGB value for black looks like\
    \ this:\n`rgb(0, 0, 0)`\n\nThe RGB value for white looks like this:\n`rgb(255,\
    \ 255, 255)`\n\nInstead of using six hexadecimal digits like you do with hex code,\
    \ with RGB you specify the brightness of each color with a number between 0 and\
    \ 255.\n\nIf you do the math, the two digits for one color equal 16 times 16,\
    \ which gives us 256 total values. So `RGB, which starts counting from zero, has\
    \ the exact same number of possible values as hex code`.\n\nHere's an example\
    \ of how you'd change the body background to orange using its RGB code.\n\n```css\n\
    body {\n  background-color: rgb(255, 165, 0);\n}\n```\n\nIn the code below, replace\
    \ the hex code in the body element's background color with the RGB value for black:\
    \ `rgb(0, 0, 0)`\n\n```html\n<style>\nbody {\n  background-color: #F00;\n}\n</style>\n\
