    <h5 class="box red-box">padding</h5>

    <h5 class="box blue-box">padding</h5>

    </div>

    ```


    Note that the red box has a bigger `margin` than the blue box, making it appear
    smaller. When you increase the blue box''s `margin`, it will increase the distance
    between its border and surrounding elements.


