    \n这是另一个挑战。解释这段代码：\n\n```css\n/*Another illustration of a descendant selector*/\n\
    footer a {\n  background-color: black;\n  color: blue;\n  font-size: 10;\n}\n\
    ```\n\n同时也解释这段代码：\n\n```css\n/*A third illustration of a descendant selector*/\n\
    footer li a {\n  background-color: yellow;\n  color: blue;\n  font-size: 12;\n\
    }\n```\n\n## 2.39 相邻选择器（组合器）\n\n相邻选择器技术上称为组合器。看这个示例：\n\n```css\nh1 + p {\n  color:\
    \ red;\n}\n```\n\n这个 `+` 符号就是相邻组合器。这种组合器改变了整体选择的行为。它的作用是选择每一个紧跟在 `h1` 之前的段落 `p`，或者如果你反过来想，每一个紧跟在同一层（相邻）`h1`\
    \ 之后的段落。它们不是子元素或父元素，也没有嵌套。\n\n这是另一个示例。假设你想在网页顶部创建一个导航栏，并且在 `challenge.html` 文件中写了这些：\n\
    \n```html\n<head>\n  <link rel=\"stylesheet\" href=\"styles.css\">\n  <nav>\n\
    \    <label for=\"search\">Search</label>\n    <input type=\"text\" placeholder=\"\
    search\" id=\"search\">\n    <button>Log in</button>\n    <button id=\"signup\"\
    >Sign up</button>\n  </nav>\n</head>\n```\n\n这是你得到的输出：\n\n![Image](img/image-64.jpeg)\n\
    \n图 2.39.1: 创建的搜索框、登录按钮和注册按钮，用于说明如何使用相邻组合器\n\n在这个示例中，**Log in** 按钮紧跟在**搜索框 (`input`)**\
    \ 之后，因此它们是相邻的。这是 `styles.css`，展示了你可以如何使用相邻选择器为每个紧跟在每个输入框之后的按钮设置粉色背景色。\n\n```css\n\
    input + button {\n  background-color: pink;\n}\n```\n\n这是输出。\n\n![Image](img/image-65.jpeg)\n\
    \n"
- fmt: "\nFigure 2.39.2: The adjacent combinator is used to give a pink background-color\
    \ to the button\n\nNow, another challenge. Can you explain what the adjacent selector\
    \ in this CSS will do?\n\n```css\nh2 + button {\n  font-size: 20px;\n  background-color:\
    \ magenta;\n}\n```\n\n## 2.40. Direct Descendant/Child Selector\n\nThe next selector\
    \ we’ll look at is the direct descendant or direct child selector. Here’s an example.\n\
    \n```css\ndiv > li {\n  color: white;\n}\n```\n\nWe use the greater-than sign\
    \ or right-angle bracket (`>`). This is going to select all `li`s that are direct\
    \ children of a `div` in this case. It’s not just generic children nested somewhere\
    \ in a `div` but they are the direct descendant or direct child.\n\nStudy the\
    \ following example.\n\n```html\n<footer>\n  <nav>\n    <a href=\"https://google.com\"\
    >Go to Google</a> <br/>\n    <label for=\"search\">Search</label>\n    <input\
    \ type=\"text\" placeholder=\"search\" id=\"search\">\n    <button>Log in</button>\n\
    \    <button id=\"signup\">Sign up</button>\n  </nav>\n  <a href=\"https://yahoo.com\"\
    >Go to Yahoo</a>\n</footer>\n```\n\nIn this markup, the first anchor tag (Go to\
    \ Google) is not a direct child of the `footer`. It’s a direct child of the `nav`\
    \ instead. However, the second anchor tag (Go to Yahoo) is a direct child of the\
    \ `footer`, so in this case we would write the following CSS to give a red color\
    \ to only the second anchor tag:\n\n```css\nfooter > a {\n  color: red;\n}\n```\n\
    \nTry it yourself. Use your `challenge.html` and `styles.css` files. Figure 2.40.1\
    \ shows the output.\n\n![Image](images/image-66.jpeg)\n\nFigure 2.40.1: The adjacent\
    \ descendant selector is used to give a red color to only the second anchor tag\n\
    \nWe’ve just looked at a few popular CSS selectors, but you can learn about other\
    \ ones on MDN here: [https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Selectors](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Selectors).\n\
    \n## 2.41. Pseudo Classes\n\nNext up, we're going to cover some pseudo classes,\
    \ which are the kind of modifiers or keywords that we add on to the end of a selector.\
    \ They specify a particular state of those selected elements. For example, we\
    \ can use them to target things like checkboxes that have been checked or elements\
    \ that are being hovered over, or things like every other button.\n\nBelow are\
    \ a few examples.\n\n*   `:active`\n*   `:hover`\n*   `:checked`\n*   `:not()`\n\
    *   `:first`\n*   `:first-child`\n*   `:nth-child()`\n*   `:nth-of-type()`\n\n\
    Notice they all start with a colon (`:`). We do need to add that colon to signify\
    \ we're using a pseudo class. It's super common to see that when you hover over\
    \ something, they have some sort of different behavior or a different visual representation\
    \ to show you that you can interact with it.\n\nWe’re going to start with one\
    \ of the most commonly used ones, which is `:hover`. For example, the Google Search\
    \ button at [www.google.com](http://www.google.com/) becomes more prominent when\
    \ you hover your mouse icon on it. Also, when you hover over any of the links\
    \ at [www.google.com](http://www.google.com/), such as Gmail or Images, these\
    \ links get underlined (like these: Gmail and Images).\n\nLet me do the first\
    \ example with a button. Here’s how you would write a CSS code to have *all* buttons\
    \ on a web page change their background-color to red and their text color to light-white\
    \ on hover.\n\n```css\nbutton:hover {\n  background-color: red;\n  color: #f1faee\n\
    }\n```\n\nGive it a try using the same `challenge.html` file you used in section\
    \ 2.40.\n\nI can also get more specific. For example, instead of saying *all*\
    \ buttons, I could say a button *inside* of a post. So, I would just write it\
    \ like this:\n\n```css\n.post button:hover {\n  background-color: red;\n  color:\
    \ #f1faee\n}\n```\n\nThen when you hover over any button inside of a post on the\
    \ web page, their background-color would change to red and their text color to\
    \ light-white. All other buttons will be unaffected.\n\nNow, here is your challenge.\
    \ What happens to all anchor tags in this CSS?\n\n```css\na:hover {\n  text-decoration:\
    \ overline;\n}\n```\n\nIt’s simple. This CSS is saying that when you hover over\
    \ any anchor tag, it becomes decorated with a line over it. What about this?\n\
    \n```css\nbutton:active {\n  background-color: blue;\n}\n```\n\nAssuming that\
    \ initially on hover, the background-color of this button would change to red\
    \ and its text color to light-white. Now, when you **click and hold** your mouse\
    \ button, the background-color of this button would change to blue, that is, it\
    \ becomes **active**. When you now release your mouse button, the background-color\
    \ of this button would change back to red (inactive).\n\nNow here’s another challenge.\
    \ I want you to go search “pseudo-classes” on [MDN](https://developer.mozilla.org/),\
    \ or just go directly to [https://developer.mozilla.org/en-us/docs/web/css/pseudo-classes](https://developer.mozilla.org/en-us/docs/web/css/pseudo-classes)\
    \ and do a little research about the following:\n\n*   `::after`\n*   `::before`\n\
    *   `::first`\n*   `::first-child`\n*   `::first-line`\n*   `::nth-child`\n* \
    \  `::nth-of-type`\n*   `::not`\n*   `::selection`\n\n## 2.42. Pseudo Elements\n\
    \nPseudo elements are keywords that we add to the end of a selector to specify\
    \ a particular part of the selected element. For example, we can use them to target\
    \ things like the first letter of a paragraph, the first line, or even the selected\
    \ text.\n\nLet’s take our first example.\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=edge\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <title>Pseudo Elements</title>\n  <link rel=\"stylesheet\"\
    \ href=\"styles.css\">\n</head>\n<body>\n  <h2>click here to sign up</h2>\n  <p>This\
    \ is the first paragraph. Pseudo elements are keywords that we add to the end\
    \ of a selector to specify a particular part of the selected element. For example,\
    \ we can use them to target things like the first letter of a paragraph, the first\
    \ line, or even the selected text.</p>\n  <p>This is the second paragraph. There's\
    \ only a handful of pseudo elements. Some are even experimental (they have a symbol\
    \ of a little flask next to them on MDN), and so they should not be used in production\
    \ code (says MDN). Generally we use two colons (`::`) to indicate a pseudo element.\
    \ However, most browsers don't actually care if you use one.</p>\n</body>\n</html>\n\
    ```\n\nI want to increase the font size of first letter of *every* `h2` on the\
    \ page to 70 pixels:\n\n```css\nh2::first-letter {\n  font-size: 70px;\n}\n```\n\
    \nThe result is shown in Figure 2.42.1.\n\n![Image](images/67.jpeg)\n\nFigure\
    \ 2.42.1: A pseudo element is used to increase the font size of this text to 70\
    \ pixels\n\nNow, for your challenge. Write a CSS code to give the first line of\
    \ every paragraph of the html code above a purple color.\n\nNow, here’s the solution.\n\
    \n```css\np::first-line {\n  color: purple;\n}\n```\n\nSupposing you want to use\
    \ a yellow color to select/highlight any section of a paragraph? What could you\
    \ write?\n\nHere it is.\n\n```css\np::selection {\n  color: yellow;\n}\n```\n\n\
    # 3. A Preview of Volume 2\n\n## 3.1. Continuing Your Web Development Training\n\
    \nThere’s no doubt you’ve learned a lot of stuff in this book as far as web development\
    \ is concerned. But this is not the end. In the second volume, you'll continue\
    \ your lessons on HTML5, CSS (including CSS frameworks like Bootstrap), Javascript,\
    \ and so much more!\n"
