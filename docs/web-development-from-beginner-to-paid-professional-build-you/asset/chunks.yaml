    In these challenges, you''re conforming to standards or rules set out by Google
    and YouTube. It''s totally up to the companies how they want to structure their
    searches. We''re just playing by those rules once we figure them out.


    Now, it is considered best practice to set a for attribute on the label element,
    with a value that matches the value of the id attribute of the input element.
    This allows assistive technologies to create a linked relationship between the
    label and the related input element. For example:


    <input id="indoor" type="radio" name="indoor-outdoor">


