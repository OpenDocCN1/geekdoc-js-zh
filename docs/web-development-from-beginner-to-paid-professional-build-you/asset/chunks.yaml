    to the login button


    Now, another challenge. Can you explain what the adjacent selector in this CSS
    will do?


    h2 + button {


    font-size: 20px;


    background-color: magenta;


    }


    ## 2.40. Direct Descendant/Child Selector


    The next selector we’ll look at is the direct descendant or direct child selector.
    Here’s an example.


    div > li {


    color: white;


    }


    We use the greater-than sign or right-angle bracket (>). This is going to select
    all li’s that are direct children of a div in this case. It’s not just generic
    children nested somewhere in a div but they are the direct descendant or direct
    child.


    Study the following example.


    <footer>


    <nav>


    <a href="https://google.com">Go to Google</a> <br/>


    <label for="search">Search</label>


    <input type="text" placeholder="search" id="search">


    <button>Log in</button>


    <button id="signup">Sign up</button>


    </nav>


    <a href="https://yahoo.com">Go to Yahoo</a>


    </footer>


    In this markup, the first anchor tag (Go to Google) is not a direct child of the
    footer. It’s a direct child of the <nav> instead. However, the second anchor tag
    (Go to Yahoo) is a direct child of the footer, so in this case we would write
    the following CSS to give a red color to only the second anchor tag:


    footer > a {


    color: red;


    }


    Try it yourself. Use your *challenge.html* and *styles.css* files. Figure 2.40.1
    shows the output.


    ![Image](images/image-66.jpeg)


    Figure 2.40.1: The adjacent descendant selector is used to give a red color to
    only the second anchor tag


    We’ve just looked at a few popular CSS selectors, but you can learn about other
    ones on MDN here: [https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Selectors](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Selectors).


    ## 2.41. Pseudo Classes


    Next up, we''re going to cover some pseudo classes, which are the kind of modifiers
    or keywords that we add on to the end of a selector. They specify a particular
    state of those selected elements. For example, we can use them to target things
    like checkboxes that have been checked or elements that are being hovered over,
    or things like every other button.


    Below are a few examples.


    *   : active


    *   : hover


    *   : checked


    *   : not ()


    *   : first


    *   : first-child


    *   : nth-child ()


    *   : nth-of-type ()


    Notice they all start with a colon (**:**). We do need to add that colon to signify
    we''re using a pseudo class. It''s super common to see that when you hover over
    something, they have some sort of different behavior or a different visual representation
    to show you that you can interact with it.


    We’re going to start with one of the most commonly used ones, which is :hover.
    For example, the Google Search button at [www.google.com](http://www.google.com/)
    becomes more prominent when you hover your mouse icon on it. Also, when you hover
    over any of the links at [www.google.com](http://www.google.com/), such as Gmail
    or Images, these links get underlined (like these: Gmail and Images).


    Let me do the first example with a button. Here’s how you would write a CSS code
    to have *all* buttons on a web page change their background-color to red and their
    text color to light-white on hover.


    button:hover {


    background-color: red;


    color: #f1faee


    }


    Give it a try using the same *challenge.html* file you used in section 2.40.


    I can also get more specific. For example, instead of saying *all* buttons, I
    could say a button *inside* of a post. So, I would just write it like this:


    .post button:hover {


    background-color: red;


    color: #f1faee


    }


    Then when you hover over any button inside of a post on the web page, their background-color
    would change to red and their text color to light-white. All other buttons will
    be unaffected.


    Now, here is your challenge. What happens to all anchor tags in this CSS?


    a:hover {


    text-decoration: overline;


    }


    It’s simple. This CSS is saying that when you hover over any anchor tag, it becomes
    decorated with a line over it. What about this?


    button:active {


    background-color: blue;


    }


    Assuming that initially on hover, the background-color of this button would change
    to red and its text color to light-white. Now, when you **click and hold** your
    mouse button, the background-color of this button would change to blue, that is,
    it becomes **active**. When you now release your mouse button, the background-color
    of this button would change back to red (inactive).


    Now here’s another challenge. I want you to go search “pseudo-classes” on [MDN](https://developer.mozilla.org/),
    or just go directly to [https://developer.mozilla.org/en-us/docs/web/css/pseudo-classes](https://developer.mozilla.org/en-us/docs/web/css/pseudo-classes)
    and do a little research about the following pseudo classes:


    *   : not ()


    *   : first


    *   : first-child


    *   : nth-child ()


    *   : nth-of-type ()


    I can check your results for you if you send them to me by email. I will get back
    to you in 24 hours or less.


    ## 2.42. Pseudo Elements


    Pseudo elements are keywords that we add to a selector, sort of like modifiers
    to our selectors, that helps us to select a particular part of the selected element(s).
    For example, we can use them to style things like the first letter or the first
    line of some elements.


    There''s only a handful of pseudo elements. Some are even experimental (they have
    a symbol of a little flask next to them on MDN), and so they should not be used
    in production code (says [MDN](https://developer.mozilla.org/en-US/docs/Web/CSS/Pseudo-elements)).
    Generally we use two semicolons (**::**) to indicate a pseudo element. However,
    most browsers don''t actually care if you use one.


    These are a few popular ones:


    *   ::after


    *   ::first-letter


    *   ::first-line


    *   ::before


    *   ::selection


    Let’s take our first example. In the markup below, I want to increase the font
    size of first letter of *every* h2 heading on the page to 70 pixels:


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta http-equiv="X-UA-Compatible" content="IE=edge">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Pseudo Elements</title>


    <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <h2>click here to sign up</h2>


    <p> This is the first paragraph. Pseudo elements are keywords that we add to a
    selector, sort of like modifiers to our selectors, that helps us to select a particular
    part of the selected element(s). For example, we can use them to style things
    like the first letter or the first line of some elements.</p>


    <p> This is the second paragraph. There''s only a handful of pseudo elements.
    Some are even experimental (they have a symbol of a little flask next to them
    on MDN), and so they should not be used in production code (says MDN). and generally
    we use two semicolons (::) to indicate a pseudo element. However, most browsers
    don''t actually care if you use one.</p>


    </body>


    </html>


    I would write this simple CSS to do that:


    h2::first-letter {


    font-size: 70px;


    }


    The result is shown in Figure 2.42.1.


    ![Image](images/image-67.jpeg)


    Figure 2.42.1: A pseudo element is used to increase the font size of this text
    to 70 pixels


    Now, for your challenge. Write a CSS code to give the first line of every paragraph
    of the html code above a purple color.


    Now, here’s the solution.


    p::first-line {


    color: purple;


    }


    Supposing you want to use a yellow color to select/highlight any section of a
    paragraph? What could you write?


    Here it is.


    p::selection {


    color: yellow;


    }


    # 3\. A Preview of Volume 2


    ## 3\. 1. Continuing Your Web Development Training


    There’s no doubt you’ve learned a lot of stuff in this book as far as web development
    is concerned. But this is not the end. In the second volume, you''ll continue
    your lessons on HTML5, CSS (including CSS frameworks like Bootstrap), Javascript,
    and so much more!'
