    所以，当我们说 HTML5 时，它并不是某种供你下载或安装的版本；它只是该文档的一个版本，并包含了新的元素，例如视频元素、音频元素等。这些元素在 15 年前的
    HTML 中是不存在的，但它们现在已经是该文档的一部分了。随后，由浏览器（Chrome、Firefox、Edge 或你正在使用的任何浏览器）来实现这些功能。


    即使你不了解这些内容，你也可以过得很好。但我很喜欢澄清这一点，因为我听过学生们谈论升级到 HTML5 之类的话。那实际上并不是你所要做的事情。你的浏览器及其背后的组织才是根据最新版本的
    HTML 标准来实现这些功能的实体。


    从技术上来说，HTML 是一种标记语言，它使用特殊的语法或符号来向浏览器描述网页的结构。HTML 元素通常有起始标签和结束标签，它们用于包围并赋予内容意义。例如，不同的元素可以将文本描述为标题、段落或列表项。


    现在，我想向你快速介绍我在本书中经常使用的最有用资源之一，我也建议你使用它。它被称为 [Mozilla 开发者网络](https://developer.mozilla.org/en-US/docs/Web/HTML)
    或 `MDN`。它是救命稻草。它是一个涵盖 Web 技术基础及更多内容的资源。图 1.0 是 MDN 的截图。


    ![Image](img/image-6.jpeg)


    图 1.0：[MDN 网站](https://developer.mozilla.org/en-US/docs/Web/HTML) 上的 HTML 参考页面


    这是一个面向开发者的资源，并由开发者编写。将其想象成 HTML、CSS、JavaScript、浏览器以及许多其他解释 HTML 规则的维基百科即可。它充满了教程、参考和指南。因此，它是一份帮助你理解和学习
    Web 技术的文档或资源。


    然而，请记住，Mozilla 并不是 HTML、CSS 和 JavaScript 的创建者。还有其他与 MDN 类似的资源。这只是知识百科全书的一种，但并不是官方文档。它是开源的，并由开发者创建。


    ## 1.1 向 HTML 元素你好


    在本卷中，你将构建一个猫照片应用来学习最常见的 HTML 元素——任何网页的构建块。欢迎来到我的 HTML 编码挑战。这些挑战将一步步引导你完成 Web 开发之旅。


    首先，你将开始使用 HTML 构建一个简单的网页。你可以在代码编辑器中编辑标记。现在，在你的编辑器中输入`<h1>Hello</h1>`。你的结果应该像图
    1.1.1 所示。


    ![Image](img/image-7.jpeg)


    图 1.1.1：编辑器中的第一行标记已完成


    你代码编辑器中显示为 `<h1>Hello</h1>` (1) 的标记是一个 HTML 元素。小白点 (2) 意味着你在编辑器中有未保存的更改。要保存代码，只需点击顶部的
    `File`（文件）并选择 `Save`（保存）。这是你保存更改时应遵循的路径：


    `File > Save`


    一旦你保存了代码，小白点就会变为 `X` (3)。看图 1.1.2。


    ![Image](img/image-8.jpeg)


    图 1.1.2：如何在编辑器中保存代码


    大多数 HTML 元素都有一个**起始标签**和一个**结束标签**。


    起始标签看起来如下：


    ```

    <h1>

    ```


    结束标签看起来如下：


    ```

    </h1>

    ```


    起始标签和结束标签之间的唯一区别是结束标签左括号后有一个斜杠。将你的鼠标光标直接放在结束标签 `</h1>` 之后并点击一下。然后按回车/Enter 键。标记的第二行
    **2** 将自动为你创建。这意味着你已经准备好输入标记的第二行了。


    正如很快要解释的那样，每当你想要测试/运行代码时，只需在编辑器窗口任何地方点击右键并选择 `Open with Live Server`（用 Live Server
    开启）。如果你没有安装 Live Server，或者不想使用它，只需点击顶部的 `Run`（运行）(1)。然后选择 `Run Without Debugging`（不调试运行）(2)。


    ![Image](img/image-9.jpeg)


    图 1.1.3：如何在编辑器中运行代码


    这意味着你只想看到代码的输出，而不打算检查标记中可能存在的任何错误（bug）。如果你选择 `Start Debugging`（启动调试）(3)，这意味着你还想在运行运行时检查标记中可能存在的错误。目前，由于我们确定这个简单标记中没有
    bug，请选择 `Run Without Debugging` (2)。


    你可能会被要求选择要使用哪个浏览器来查看代码的输出（如图 1.1.4 所示的 1 或 2）。


    ![Image](img/image-10.jpeg)


    图 1.1.4：如何选择浏览器显示你的输出


    否则，你的默认浏览器（在此情况下为 Google Chrome）应该打开并向你显示简单代码的结果。你的输出是一个简单的 **Hello**。看图 1.1.5。这正是我们预期的结果。


    ![Image](img/image-11.jpeg)


    图 1.1.5：你的输出


    正如之前提到的，查看输出的另一种方法是使用 Live Server 打开你的浏览器。如果你还没有安装 Live Server，可以从市场商店下载。市场商店有许多你可以在
    Visual Studio 中下载并安装的其他扩展。这里是下载的链接：[`marketplace.visualstudio.com/items?itemName=ritdey.LiveServer`](https://marketplace.visualstudio.com/items?itemName=ritdey.LiveServer)。看图
    1.1.6。


    ![Image](img/image-12.jpeg)


    图 1.1.6：如何下载 Live Server


    要安装它，请遵循图 1.1.7 中突出显示的步骤。


    1. 选择 Visual Studio 左侧面板上的 `Extensions`（扩展）图标 (1)。

    2. 点击 `...` 图标 (2) 打开更多选项。

    3. 点击 `Install from VSIX` (3)。


    打开一个对话框。导航到你电脑上的位置并点击对话窗口底部的 `Install` 按钮开始安装。几秒后，你的扩展将安装完成。在继续之前你可能需要重启 Visual
    Studio。


    现在，每你想打开浏览器并运行代码时，只需在编辑器内任何地方点击右键并选择 `Open with Live Server`。看图 1.1.8。


    ![Image](img/image-14.jpeg)


    图 1.1.8：如何使用 Live Server 打开浏览器


    你的 Chrome 浏览器将打开并显示图 1.1.9 所示的输出。从地址栏可以看到，网页地址是一个本地服务器：`http://127.0.0.1:5500/index.html`，这不像图
    1.1.5 中地址栏仅显示你计算机上的目录/文件夹。


    ![Image](img/image-15.jpeg)


    图 1.1.9：Chrome 浏览器显示你的输出


    现在，这是你的第一个挑战：将你的 `h1` 元素的文本更改为 Hello World。保存代码并再次运行。如果你喜欢，可以通过在资源管理器窗口中右键创建一个新文件来尝试你的代码。选择
    `New File`（新建文件）并给它一个唯一的名称，例如 `MyTestCode.html`。然后按回车/Enter 键完成文件的创建。看图 1.1.10
    和图 1.1.11。


    ![Image](img/image-16.jpeg)


    图 1.1.10：在 Visual Studio 中创建新文件，部分 1


    ![Image](img/image-17.jpeg)


    图 1.1.11：在 Visual Studio 中为新文件命名


    注意：不要忘记在运行代码之前始终保存代码！否则，你的输出可能不会更新。


