    \ 开发中的实际问题。一个 Web 开发者的信誉远不止他们的证书，这实际上取决于他们作品集的优实力。\n\n[就业机会](https://www.turing.com/jobs)\
    \ 往往来自工作样本和具体技能，而不是大学学位。因此，你需要学习得足够好。这本书不仅会帮助你良好学习并建立惊人的作品集，还将为你提供持续的帮助和支持。\n\n\
    有了这本书和我我的`dedicated 24/7 help and support team`，你无所畏。我帮助过许多 Web 开发者更新他们的开发技能，开启了成功的职业，并获得了[远程工作](https://vanhack.com/jobs/)。我注意到，即使是最心勃勃的初学者也会遇到问题，例如不知道从哪里开始。有时他们会在途中完全迷失，因此需要进一步的帮助。\n\
    \n事实是，在 Web 开发之路上，每个人在某个时刻都需要帮助来正确地学习 HTML5、CSS 或 Javascript。我在书中编写了足够的编码挑战及其解决方案。你将`定期获得更新的备表、编码练习、一个用于展示你工作样本的惊人的\
    \ Web 开发者作品集、实践项目。如果你使用书底的免费支持链接，你还将获得更多帮助。我会帮助你学得好`。\n\n最后，如果你购买这本书，我会将你加入我的\
    \ Web 开发社区，这样你可以继续学习并获得更多帮助，直到你成为一名高薪的专业人士。\n\nBolakale Aremu\nCEO, Ojula Technology\
    \ Innovations\nWeb 开发者和软件工程师\n\n# 0. 使用免费编码工具开始\n\nHTML 已经是第五次迭代，这就是为什么被称为 HTML5。CSS\
    \ 处于第三次迭代，所以也被称为 CSS3。无论你使用 Windows、Mac 还是 Linux 系统，你需要一个更新过的现代浏览器和一个文本/代码编辑器（如记事本）来开启编码之旅。然而，我强烈建议你现在下载并安装\
    \ [Visual Studio 编辑器](https://code.visualstudio.com/download) 和 [Google Chrome\
    \ 浏览器](https://www.google.com/chrome/) 开始。它们非常容易安装，并且预装了一系列开发者工具。Youtube 上有大量关于如何安装最新版本的\
    \ [Visual Studio](https://www.youtube.com/watch?v=m9mIwKeTJhk) 和 [Chrome 浏览器](https://www.youtube.com/watch?v=ThQAkabE0J8)\
    \ 的视频。一旦安装好这些，让我们开始吧！\n\n在你的桌面或计算机上的任何其他喜欢的位置：\n\n1. 创建新文件夹并给它一个好标题，如 `Web-Development`。打开这个文件夹。\n\
    2. 在此文件夹中，创建另一个文件夹并给它一个标题如 `Html_course`。打开这个文件夹。\n3. 在此文件夹中，创建另一个文件夹并给它一个标题如\
    \ `01_lesson`。打开这个文件夹。\n4. 在此文件夹中创建一个新的记事本或文本文档，重命名/更改默认标题为 `index`，并将扩展名（`.txt`）改为\
    \ `.html`。见图 0.1。\n\n![Image](img/image.jpeg)\n图 0.1：重命名一个新的文本文档（记事本）\n\n一旦按下回车/Enter\
    \ 键，你将收到一个警告，提示你的文档/文件可能会失效。选择“是”，表示你想将文件名和扩展名更改为 `index.html`，这是应用程序标准的`首页`或`主页`。你的第一个\
    \ Web 文件现在准备好了！你的文件现在应该显示 Chrome 浏览器的图标（或你使用的任何浏览器），如图 0.2 所示。\n\n![Image](img/image-1.jpeg)\n\
    图 0.2：文本文档现在有了 Chrome 浏览器的图标\n\n现在，打开你之前安装的 Visual Studio。点击左上角的 `File` 菜单 (1)，点击它以打开图\
    \ 0.3 所示的新面板。在书的后面，你可以选择第一个选项（`New File`）创建一个新的 `untitled` 文件。将打开一个新窗口供你编写代码。\n\
    \n![Image](img/image-2.jpeg)\n图 0.3：如何在 Visual Studio 中打开新文件夹\n\n但现在，只需选择 `Open\
    \ Folder` (2)。将打开图 0.4 所示的对话框。\n\n![Image](img/image-3.jpeg)\n图 0.4：如何在你的计算机上导航并选择你的\
    \ `01_lesson` 文件夹\n\n导航到 `01_lesson` 文件夹并点击 `Select Folder` (1) 打开它。你将在文件资源管理器中看到\
    \ `index.html`。双击 `index.html` 在编辑器中打开它。\n\n![Image](img/image-4.jpeg)\n图 0.5：显示\
    \ index.html 的 Visual Studio 文件管理器\n\n现在，在编辑器中输入以下代码：\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n  <h1>Hello World!</h1>\n</body>\n</html>\n```\n\n按下 `Ctrl+S`\
    \ 保存文件。现在，右键点击文件管理器中的 `index.html`，选择 `Open with` 并选择 `Google Chrome`。你将在浏览器中看到你的第一个网页！\n\
    \n![Image](img/image-5.jpeg)\n图 0.6：在 Chrome 浏览器中运行你的第一个网页\n\n# 1. 基础 HTML5 与有用资源\n\
    \nHTML5 到底意味着什么？我看到学生们对此有很多困惑，而且很有理由。对于他们中的人来说，HTML5 听起来像是一个你可以下载、安装或升级的版本，就像视频游戏一样。但\
    \ HTML5 的不同。如果我们真的去阅读 [MDN 关于它的简短介绍](https://developer.mozilla.org/en-US/docs/Glossary/HTML5)，\n\
    \n> “HTML5 术语本质上是一个指的是一组现代 Web 技术的流行语。”\n\n它是定义 HTML 的标准的最新演进。这个术语代表了两个不同的概念。它是\
    \ HTML 语言的新版本，具有新的元素、属性和行为。它还指的是一个更大的 Web 技术集合。\n\n所以，当我说 HTML5 时，我指的是定义 HTML\
    \ 的**标准**的最新演进。\n\n"
