  trans: "\n\n<label for=\"username\">搜索 Google:</label>\n<input type=\"text\" placeholder=\"\
    输入搜索词\" id=\"username\" name=\"q\">\n<button>搜索</button>\n\n这是另一个挑战。创建一个与上面非常的简单表单来“劫持”\
    \ Youtube 搜索。当你在浏览器上创建好表单后，搜索任何你喜欢的词条。你将被带到 [Youtube.com/results](https://www.youtube.com/results)，并在那里将获得你的搜索结果。\n\
    \n在这些挑战中，你正在遵循 Google 和 YouTube 设定的标准或规则。公司想要如何构建它们的搜索完全由它们决定。一旦我们弄清楚了规则，只需要按照这些规则执行即可。\n\
    \n现在，在 `label` 元素上设置 `for` 属性被认为是最佳实践，其值应与 `input` 元素的 `id` 属性值匹配。这允许辅助技术在 `label`\
    \ 和相关的 `input` 元素之间建立链接关系。例如：\n\n```html\n<input id=\"indoor\" type=\"radio\"\
    \ name=\"indoor-outdoor\">\n<label for=\"indoor\">Indoor</label>\n```\n\n我们还可以将\
    \ `input` 元素嵌套在 `label` 标签内：\n\n```html\n<label for=\"indoor\">\n  <input id=\"\
    indoor\" type=\"radio\" name=\"indoor-outdoor\">Indoor\n</label>\n```\n\n在你的表单中添加一对单选按钮，每个都嵌套在自己的\
    \ `label` 元素中。其中一个应该有室内（indoor）选项，另一个应该有户外（outdoor）选项。两者都应该共享 `name=\"indoor-outdoor\"\
    ` 属性以创建一个单选组。还要注意，`value`（上述示例中的 `Indoor` 或 `Outdoor`）应该是首字母大写或全大写（`INDOOR` 或\
    \ `OUTDOOR`）。\n\n这里是更新后的代码：\n\n## CatPhotoApp\n\n<main>\n  <p>点击此处查看更多 <a href=\"\
    #\">猫照片</a></p>\n  <a href=\"#\"><\"><img src=\"https://bit.ly/3wwInho\" alt=\"\
    一只可爱的猫。\"></a>\n  <p>猫喜欢的东西：</p>\n  <ul>\n    <li>猫薄荷</li>\n    <li>激光笔</li>\n\
    \    <li>千千面</li>\n  </ul>\n  <p>猫讨厌的前 3 件事：</p>\n  <ol>\n    <li>驱跳虫治疗</li>\n\
    \    <li>雷声</li>\n    <li>其他猫</li>\n  </ol>\n  <form action=\"https://www.catphotoapp.com/submit-cat-photo\"\
    >\n    <input type=\"text\" placeholder=\"猫照片 URL\" required>\n    <button type=\"\
    submit\">提交</button>\n    <label for=\"indoor\">\n      <input id=\"indoor\" type=\"\
    radio\" name=\"indoor-outdoor\">Indoor\n    </label>\n    <label for=\"outdoor\"\
    >\n      <input id=\"outdoor\" type=\"radio\" name=\"indoor-outdoor\">Outdoor\n\
    \    </label>\n  </form>\n</main>\n\n这是另一个示例（`LABEL` 的格式略有不同）：\n\n## 显示单选按钮\n\n\
    ```html\n<form action=\"/action_page.php\">\n  <p>请选择你喜欢的 Web 语言：</p>\n  <input\
    \ type=\"radio\" id=\"html\" name=\"fav_language\" value=\"HTML\">\n  <label for=\"\
    html\">HTML</label><br>\n  <input type=\"radio\" id=\"css\" name=\"fav_language\"\
    \ value=\"CSS\">\n  <label for=\"css\">CSS</label><br>\n  <input type=\"radio\"\
    \ id=\"javascript\" name=\"fav_language\" value=\"JavaScript\">\n  <label for=\"\
    javascript\">JavaScript</label>\n  <br>\n  <p>请选择你的年龄：</p>\n  <input type=\"radio\"\
    \ id=\"age1\" name=\"age\" value=\"30\">\n  <label for=\"age1\">0 - 30</label><br>\n\
    \  <input type=\"radio\" id=\"age2\" name=\"age\" value=\"60\">\n  <label for=\"\
    age2\">31 - 60</label><br>\n  <input type=\"radio\" id=\"age3\" name=\"age\" value=\"\
    100\">\n  <label for=\"age3\">61 - 100</label><br><br>\n  <input type=\"submit\"\
    \ value=\"提交\">\n</form>\n```\n\n在这段代码中，`<br>` 表示“换行”，用于结束当前行。因此，“Please select\
    \ your age”这些词将从新行开始。\n\n图 1.22.1 显示了输出：\n\n![Image](img/image-19.jpeg)\n图 1.22.1：代码的输出\n\
    \n## 1.23. 创建一组复选框\n\n表单通常使用复选框来处理可能有一个多个答案的问题。复选框是 `input` 的一种类型。\n\n你的每个复选框都可以嵌套在自己的\
    \ `label` 元素中。通过将 `input` 元素包裹在 `label` 元素内部，它会自动将复选框输入与围绕它的 `label` 元素关联。\n\n\
    所有相关的复选框输入都应该具有相同的 `name` 属性。\n\n通过在 `label` 元素上设置 `for` 属性以匹配关联的 `input` 元素的\
    \ `id` 属性，显式地定义复选框 `input` 与其对应 `label` 之间的关系被认为是最佳实践。\n\n这是一个复选框的示例：\n\n```html\n\
    <label for=\"loving\"><input type=\"checkbox\"> Loving</label>\n```\n\n在你的表单中添加一组复选框，每个都嵌套在自己的\
    \ `label` 元素中。所有复选框都共享 `name=\"personality\"` 属性。代码看起来如下：\n\n```html\n<label for=\"\
    indoor\">\n  <input type=\"checkbox\" name=\"personality\">\n</label>\n```\n\n\
    每个复选框都嵌套在 `label` 元素中。这是一个单选框的，代码看起来如下：\n\n```html\n<label for=\"indoor\">\n \
    \ <input id=\"indoor\" type=\"radio\" name=\"indoor-outdoor\"> Indoor\n</label>\n\
    <label for=\"outdoor\">\n  <input id=\"outdoor\" type=\"radio\" name=\"indoor-outdoor\"\
    > Outdoor\n</label>\n<br>\n<label for=\"loving\">\n  <input type=\"checkbox\"\
    \ name=\"personality\"> Loving\n</label>\n<label for=\"Honest\">\n  <input type=\"\
    checkbox\" name=\"personality\"> Honest\n</label>\n<label for=\"Humble\">\n  <input\
    \ type=\"checkbox\" name=\"personality\"> Humble\n</label>\n```\n\n这是另一种写法（将标签放在左侧）：\n\
    \n```html\n<label for=\"indoor\">Indoor<input type=\"radio\" name=\"SportsType\"\
    ></label>\n<label for=\"outdoor\">Outdoor<input type=\"radio\" name=\"SportsType\"\
    ></label>\n<br>\n<label for=\"loving\">Loving<input type=\"checkbox\" name=\"\
    personality\"></label>\n<label for=\"Honest\">Honest<input type=\"checkbox\" name=\"\
    personality\"></label>\n<label for=\"Humble\">Humble<input type=\"checkbox\" name=\"\
    personality\"></label>\n```\n\n你可以使用 `checked` 属性设置复选框或单选按钮默认勾选。要这样做，只需在 `input`\
    \ 内部添加 `checked` 单词。例如：\n\n```html\n<label for=\"indoor\"><input type=\"radio\"\
    \ name=\"indoor-outdoor\" value=\"indoor\" checked> Indoor</label>\n<label for=\"\
    outdoor\"><input type=\"radio\" name=\"indoor-outdoor\" value=\"outdoor\"> Outdoor</label><br>\n\
    <label for=\"loving\"><input type=\"checkbox\" name=\"personality\" value=\"loving\"\
    \ checked> Loving</label>\n<label for=\"lazy\"><input type=\"checkbox\" name=\"\
    personality\" value=\"lazy\"> Lazy</label>\n<label for=\"energetic\"><input type=\"\
    checkbox\" name=\"personality\" value=\"energetic\"> Energetic</label>\n```\n\n\
    当选中的值发送到服务器时，我们需要知道用户选择了哪一个单选按钮（Indoor 或 Outdoor）。为了实现这一点，我们必须添加名为 `value` 的特定属性。我们在\
    \ `value` 中的任何内容，例如“Indoor”，都会在提交表单时发送到服务器。\n\n## 1.24. 下拉菜单、滑动条、文本区域、表单验证与文件上传按钮\n\
    \n接下来是 `select` 元素，它本质上是一个下拉菜单。实际上两个元素协作的结果：`select` 元素和 `option` 元素。这里有一个用于创建鞋码下拉菜单的示例代码。\n\
    \n```html\n<label for=\"size-select\">选择鞋码：</label>\n<br>\n<select name=\"shoes\"\
    \ id=\"size-select\">\n  <option value=\"\">--选择一个选项--</option>\n  <option value=\"\
    XS\">极小</option>\n  <option value=\"S\">小号</option>\n  <option value=\"M\">中号</option>\n\
    \  <option value=\"L\">大号</option>\n</select>\n```\n\n尝试运行这段代码。图 1.24.1 显示了当我点击菜单右侧箭头时的结果：\n\
    \n![Image](img/image-20.jpeg)\n\n图 1.24.1：鞋码选择器代码的输出\n\n"
- fmt: "\nSo, the select is the parent that groups together a bunch of options. Each\
    \ option has some text (such as Extra Small) in between the opening and closing\
    \ tags `<option></option>`. Then we have a value attribute (such as `L`), just\
    \ like we did with our radio buttons, which is what will be sent through when\
    \ this information is submitted to the server.\n\nSo, the select is where we put\
    \ the `name` and an `id` if we wanted to label it, and then we have `option`.\n\
    \nIf you want one of the options pre-selected, you can modify the code above as\
    \ shown in the following example. I created a very simple dropdown menu where\
    \ the second option (Small) is selected by default.\n\n```html\n<label for=\"\
    size-select\">Choose a shoe size:</label>\n<br>\n<select name=\"shoes\" id=\"\
    size-select\">\n  <option value=\"\">--Please choose an option--</option>\n  <option\
    \ value=\"XS\">Extra Small</option>\n  <option value=\"S\" selected>Small</option>\n\
    \  <option value=\"M\">Medium</option>\n  <option value=\"L\">Large</option>\n\
    </select>\n```\n\nThat is the basics of a `select` and the `option` elements.\n\
    \n### Slider Control: `<input type = \"range\">`\n\nThere are a couple more controls\
    \ that I do want to highlight, and they don't really have a lot to do with one\
    \ another. But I'm just going to make this quick. The first one is `range`. Our\
    \ `range` input creates a little slider or dial control where a user can select\
    \ some value on a sliding range. We can control the minimum and maximum value.\
    \ A precise value, however, is not considered important.\n\nHere's the first example:\n\
    \n```html\n<p>Audio settings:</p>\n<!--First Slider-->\n<div>\n  <input type=\"\
    range\" id=\"volume\" name=\"volume\" min=\"0\" max=\"11\">\n  <label for=\"volume\"\
    >Volume</label>\n</div>\n<!--Second Slider-->\n<div>\n  <input type=\"range\"\
    \ id=\"cowbell\" name=\"cowbell\" min=\"0\" max=\"100\" value=\"70\" step=\"10\"\
    >\n  <label for=\"cowbell\">Cowbell</label>\n</div>\n```\n\nFigure 1.24.2 shows\
    \ the output.\n\n![Image](images/image-21.jpeg)\nFigure 1.24.2: The output of\
    \ slider controls code\n\nIn the above code, the `input type` is set to `range`.\
    \ The `value` is not less than `min` (minimum which is 0 for both sliders), and\
    \ is not greater than `max` (maximum which is 11 for first slider and 100 for\
    \ second slider). The default initial value is 70 for the second slider, and is\
    \ a multiple of `step` which is 10 for this slider.\n\nNow, I want you to modify\
    \ the above code so that “Volume” and “Cowbell” appear on the left side of the\
    \ slider.\n\n### Text Area: `<textarea></textarea>`\n\nYou definitely have seen\
    \ before a website that uses a text area. It’s basically a multiline text input.\
    \ It's where you can type in a paragraph and all sorts of things. This is not\
    \ an `<input>` tag. Let’s take an example right away.\n\n```html\n<label for=\"\
    requests\">Enter Special Request:</label>\n<br>\n<textarea id=\"requests\" name=\"\
    requests\" rows=\"10\" cols=\"20\">Type here…</</textarea>\n```\n\nYou can use\
    \ `rows` and `cols` to control the size of the box. If you want a bigger text\
    \ area for example, increase the number of `rows` or columns or both. You can\
    \ even give it a `placeholder` text like `Type here…` that you see inside the\
    \ box in Figure 1.24.3.\n\n![Image](images/image-22.jpeg)\nFigure 1.24.3: The\
    \ output of text area code\n\nOk. That's pretty much it for the most important\
    \ and commonly used form controls. There are others but those are the essentials.\n\
    \n### Form Validations\n\nThe term validation generally refers to adding constraints\
    \ or validating user input or data, such as, requiring that some fields can't\
    \ be empty, or that a password has to be between 7 and 12 characters or whatever.\n\
    \nThese are a few different examples of constraints and they can get more complex.\
    \ For example, it might be required that your password must have a special character,\
    \ a number, a lowercase letter, an uppercase letter and no spaces. We're not going\
    \ to go into all of that right now. Instead, I'm going to show you the built-in\
    \ browser validations that we can add in to our forms and inputs.\n\nWhen I just\
    \ type in two or three characters in the `Email` field at Stripe.com’s registration\
    \ page, for example, it just tells me immediately I move to the next field that\
    \ it's not a valid email. Also, as I start typing my password in the password\
    \ field, I get a text blow telling me what's wrong or what I need to do. See Figure\
    \ 1.24.4. That is all done with JavaScript.\n\n![Image](images/image-23.jpeg)\n\
    Figure 1.24.4: Form validations at https://dashboard.stripe.com/register\n\nThis\
    \ is all happening in the browser. It’s called **client-side validation**. This\
    \ is in addition to what I'm going to show you and you'll learn how to do this\
    \ sort of thing later on. This is definitely a nice experience.\n\nThere's something\
    \ else called **server-side validation**. If I try to submit my data as shown\
    \ in Figure 1.24.4, it won't even let me submit. This is all happening in the\
    \ browser. It’s called **client-side validation**. This is in addition to what\
    \ I'm going to show you and you'll learn how to do this sort of thing later on.\
    \ This is definitely a nice experience.\n\nThere's something else called **server-side\
    \ validation**. If I try to submit my data as shown in Figure 1.24.4, it won't\
    \ even let me submit. This is all happening in the browser. It’s called **client-side\
    \ validation**. This is in addition to what I'm going to show you and you'll learn\
    \ how to do this sort of thing later on. This is definitely a nice experience.\n\
    \n(Wait, the input text repeated the the the the the the the the the the the the\
    \ the text).\n\nWe'll focus on the basics of the built-in validations. The first\
    \ thing you need to know is an attribute called `required`. Run this code:\n\n\
    ```html\n<form action=\"https://google.com/search\">\n  <label for=\"username\"\
    >Search Google:</label>\n  <input type=\"text\" placeholder=\"Enter search term\"\
    \ id=\"username\" required>\n  <p>\n    <button>Search</button>\n  </p>\n</form>\n\
    ```\n\nNow, you can’t submit this form unless you fill it. Figure 1.24.5 shows\
    \ my output when I tried to submit without anything.\n\n![Image](images/image-24.jpeg)\n\
    Figure 1.24.5: The output of a form validation using the `required` attribute\n\
    \nThe error, `Please fill out this field` is shown by Chrome. You might see a\
    \ different looking error message depending on the browser you're. This may not\
    \ be fully implemented by the way across every browser. In addition to `required`\
    \ validation, we also have `minlength` and `maxlength` which are attributes for\
    \ validating the minimum and maximum length of a text. So, you could use them\
    \ for a username and/or password as well.\n\n```html\n<form action=\"/dummy\"\
    >\n  <label for=\"username\">Username:</label>\n  <input type=\"text\" id=\"username\"\
    \ minlength=\"5\" maxlength=\"20\" required>\n  <p>\n    <button>Submit</button>\n\
    \  </p>\n</form>\n```\n\nIf you try to submit this form with less than 6 or more\
    \ than 20 characters in the username field, you will get the error shown in Figure\
    \ 1.24.6.\n\n![Image](images/image-25.jpeg)\nFigure 1.24.6: The output of a form\
    \ validation using the `minlength` and `maxlength` attributes\n\n### Pattern,\
    \ Email & URL Validations\n\nWe also have some inputs that actually have a default\
    \ validation built in. They are matching a pattern. So, `pattern` is actually\
    \ an attribute. We can add two elements and define something called a regular\
    \ expression. We're not going into this right now. All you need to know is that\
