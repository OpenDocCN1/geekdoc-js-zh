    That’s how to use the link element and specify the attribute. You do that all
    the time. Follow that formula. Every time you have multiple documents or pages
    on your website and you want to use the same styles, make a new style sheet and
    connect it with a <link> element.


    ## 2.2\. Use a CSS Class to Style an Element


    Classes are reusable styles that can be added to HTML elements. Here''s an example
    CSS class declaration:


    <style>


    .blue-text {


    color: blue;


    }


    </style>


    You can see that we''ve created a CSS class called blue-text within the <style>
    tag. You can apply a class to an HTML element like this:


    <h2 class="blue-text">CatPhotoApp</h2>.


    Note that in your CSS style element, class names start with a period. In your
    HTML elements'' class attribute, the class name does not include the period.


    Here’s your challenge. Inside your style element, change the h2 selector to .red-text
    and update the color''s value from blue to red. Also, give your h2 element the
    class attribute with a value of red-text.


    Here it is:


    <style>


    .red-text {


    color: red;


    }


    </style>


    <h2 class="red-text">CatPhotoApp</h2>


    ## 2.3. Style Multiple Elements with a CSS Class


    Classes allow you to use the same CSS styles on multiple HTML elements. You can
    see this by applying your red-text class to the first p element.


    <style>


    .red-text {


    color: red;


    }


    </style>


    <h2 class="red-text">CatPhotoApp</h2>


    <main>


    <p class="red-text">Click here to view more <a href=" https://www.bestcat.com/">cat
    photos</a>.</p>


    ## 2.4. Universal Selector *{ }


    The next thing you’ll learn is the universal selector.


    <style>


    * {


    color: black;


    }


    </style>


    Honestly, I don''t think I''ve ever used this. But I gave it you in case *you*
    might have a good use for it. It selects everything in the document and applies
    the property you specify inside the curly braces. For example, you can change
    the black color to pink. Another example is if you want it to make everything
    a certain font size, you could definitely use this.


    But it''s not generally a good idea because, on a larger document, it can be pretty
    inefficient and there are other ways to achieve this. I only wanted to show it
    to you, though I don’t use it.


    ## 2.5. Change the Font Size of an Element


    Font size is controlled by the font-size CSS property, like this:


    h1 {


    font-size: 30px;


    }


    Inside the same <style> tag that contains your red-text class, create an entry
    for p elements and set the font-size to 16 pixels (16px). Give it a try. Here’s
    mine.


    <style>


    .red-text {


    color: red;


    p {


    font-size: 16px;


    }


    </style>


    <h2 class="red-text">CatPhotoApp</h2>


    <main>


    <p class="red-text">Click here to view more <a href=" https://www.bestcat.com/">cat
    photos</a>.</p>


    ## 2.6\. Set the Font Family of an Element'
