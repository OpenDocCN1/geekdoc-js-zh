    then something afterwards. If you type something like ojulatech@, it will ask
    you to please enter a part following the @ sign.


    But once again, ojulatech@gmail.com still could be a completely fake email and
    it doesn''t matter in this code. It''s just the pattern and is still better than
    nothing.


    For a URL, the valid pattern is http://x. There must be at least one character
    (represented by x) after the http:// part. It does not matter if you add something
    else after the “x” or not. Here’s the code for validating a URL and making it
    a required field. Here’s the modified code for validating the URL as well.


