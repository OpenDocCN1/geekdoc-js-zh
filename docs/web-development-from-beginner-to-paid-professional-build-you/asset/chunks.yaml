    \n## 2.7. 导入 Google 字体\n\n除了指定大多数操作系统上都有的字体外，我们还可以为我们的网站指定非标准的、自定义的网络字体。互联网上有许多网络字体来源。在这个示例中，我们将关注\
    \ `Google Fonts 库`。\n\nGoogle Fonts 是一个免费的网络字体库，你可以通过引用字体的 URL 在 CSS 中使用它。现在，让我们导入并应用一个\
    \ Google 字体（注意，如果 Google 在你的国家被屏蔽，则你需要跳过此挑战）。\n\n要导入 Google 字体，你可以从 Google Fonts\
    \ 库复制字体的 URL，然后将其粘贴到 HTML 中。在这个挑战中，我们将导入 `Lobster` 字体。为了这一点，请复制以下代码片段并将其粘贴到代码编辑器的顶部（在\
    \ `style` 标签之前）：\n\n```html\n<link href=\"https://fonts.googleapis.com/css?family=Lobster\"\
    \ rel=\"stylesheet\" type=\"text/css\">\n```\n\n现在你可以像下面的示例那样通过通过 `Lobster` 作为\
    \ `FAMILY_NAME` 在 CSS 中使用 `Lobster` 字体：\n\n```css\nfont-family: FAMILY_NAME, GENERIC_NAME;\n\
    ```\n\n`GENERIC_NAME` 是可选的，当其他指定的字体不可用时的备用字体。这将在下一个挑战中介绍。\n\n族名称对大小写敏感，如果名称中有空格，则需要用引号括起来。例如，使用\
    \ `Open Sans` 字体需要引号，但使用 `Lobster` 字体则不需要。\n\n将 `Lobster` 字体导入到你的网页中。然后，使用元素选择器将其设置为你的\
    \ `h2` 元素的 `font-family`。\n\n这里是更新后的内容：\n\n```html\n<link href=\"https://fonts.googleapis.com/css?family=Lobster\"\
    \ rel=\"stylesheet\" type=\"text/css\">\n<style>\n.red-text {\n  color: red;\n\
    }\nh2 {\n  font-family: Lobster;\n}\np {\n  font-size: 16px;\n  font-family: monospace;\n\
    }\n</style>\n<h2 class=\"red-text\">CatPhotoApp</h2>\n```\n\n这是应用程序的更新：\n\n![Image](img/image-49.jpeg)\n\
    \n图 2.7.1：为 h2 标题应用了 Lobster 字体的更新后的应用程序\n\n## 2.8. 指定字体应如何退级\n\n所有浏览器中都提供了几种默认字体。这些通用字体族包括\
    \ `monospace`、`serif` 和 `sans-serif`。当某种字体不可用时，你可以告诉浏览器“退级”到另一种字体。\n\n例如，如果你想让元素使用\
