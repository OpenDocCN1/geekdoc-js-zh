    no bugs in this simple markup, select **Run Without Debugging** (2).


    You may be asked to select which browser you want to use to view the output of
    your code (1 or 2 as shown in Figure 1.1.4).


    ![Image](images/image-10.jpeg)


    Figure 1.1.4: How to select a browser to display your output


    Otherwise, your default browser, Google Chrome in this case, should open and show
    you the outcome of your simple code. Your output is a simple **Hello**. See Figure
