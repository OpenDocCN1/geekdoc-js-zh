    ## 1.27. 定义 HTML 文档的 Head 和 Body


    你可以在 `html` 标签内通过 `head` 和 `body` 元素在你的 HTML 文档中添加另一个层级的结构。头部 `<head></head>`
    也称为文档元数据元素，它基本上包含了那些不会在网页上显示的内容。例如，`<title>My First Webpage</title>` 将将标题“My First
    Webpage”直接放在浏览器窗口/标签页的顶端，而不是在页面本身的任何地方。请见图 1.27.1。


    ![Image](img/image-30.jpeg)


    图 1.27.1: 网页浏览器如何显示页面标题


    元数据是关于网页的信息，例如字符集、关键词、页面描述、文档作者以及针对查看页面的不同设备的视口设置。元数据不会显示在网页上，但会被机器解析。


    任何带有关于页面信息的标记都应该放入 `head` 标签中。然后，任何带有页面内容（用户看到的内容）的标记应该放入 `body` 标签中。


    元数据元素，如 `link`、`meta`、`title` 和 `style` 通常位于 `head` 元素内部。


    这是一个页面布局的示例：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta />

    </head>

    <body>

    <div>

    </div>

    </body>

    </html>

    ```


    编辑下面的标记，使其包含 head 和 body。`head` 元素应该只包含标题，而 `body` 元素应该只包含 `h1` 和 `p`：


