    ## 2.7. Import a Google Font


    In addition to specifying common fonts that are found on most operating systems,
    we can also specify non-standard, custom web fonts for use on our website. There
    are many sources for web fonts on the Internet. For this example, we will focus
    on the **Google Fonts library**.


    Google Fonts is a free library of web fonts that you can use in your CSS by referencing
    the font''s URL. So, let''s go ahead to import and apply a Google font (note that
    if Google is blocked in your country, you will need to skip this challenge).


    To import a Google Font, you can copy the font''s URL from the Google Fonts library
    and then paste it in your HTML. For this challenge, we''ll import the Lobster
    font. To do this, copy the following code snippet and paste it into the top of
    your code editor (before the opening style element):


    <link href="https://fonts.googleapis.com/css?family=Lobster" rel="stylesheet"
    type="text/css">


    Now you can use the Lobster font in your CSS by using Lobster as the FAMILY_NAME
    as in the following example:


    font-family: FAMILY_NAME, GENERIC_NAME;


    The GENERIC_NAME is optional, and is a fallback font in case the other specified
    font is not available. This is covered in the next challenge.


    Family names are case-sensitive and need to be wrapped in quotes if there is a
    space in the name. For example, you need quotes to use the *Open Sans* font, but
    not to use the *Lobster* font.


    Import the *Lobster* font to your web page. Then, use an element selector to set
    it as the font-family for your h2 element.


    Here’s the update:


    <link href="https://fonts.googleapis.com/css?family=Lobster" rel="stylesheet"
    type="text/css">


    <style>


    .red-text {


    color: red;


    }


    h2 {


    font-family: Lobster;


    }


    p {


    font-size: 16px;


    font-family: monospace;


    }


    </style>


    <h2 class="red-text">CatPhotoApp</h2>


    Here’s the app update:


    ![Image](images/image-49.jpeg)


    Figure 2.7.1: The updated app with Lobster font applied to the h2 heading


    ## 2.8. Specify How Fonts Should Degrade


    There are several default fonts that are available in all browsers. These generic
    font families include *monospace*, *serif* and *sans-serif*. When one font isn''t
    available, you can tell the browser to "degrade" to another font.


    For example, if you wanted an element to use the *Helvetica* font, but degrade
    to the *sans-serif* font when Helvetica isn''t available, you will specify it
    as follows:


    p {


    font-family: Helvetica, sans-serif;


    }


    Generic font family names are not case-sensitive. Also, they do not need quotes
    because they are CSS keywords. To begin, apply the monospace font to the h2 element,
    so that it now has two fonts - *Lobster* and *Monospace*.


    In the last challenge, you imported the Lobster font using the link tag. Now comment
    out that import of the Lobster font (using the HTML comments you learned before)
    from Google Fonts so that it isn''t available anymore. Notice how your h2 element
    degrades to the monospace font.


    Note: If you have the Lobster font installed on your computer, you won''t see
    the degradation because your browser is able to find the font.


    Here’s the code:


    <!--link href="https://fonts.googleapis.com/css?family=Lobster" rel="stylesheet"
    type="text/css"-->


    <style>


    .red-text {


    color: red;


    }


    h2 {


    font-family: Lobster, monospace;


    }


    p {


    font-size: 16px;


    font-family: monospace;


    }


    </style>


    <h2 class="red-text">CatPhotoApp</h2>


    ## 2.9\. How to Size Your Images


    CSS has a property called width that controls an element''s width. Just like with
    fonts, we''ll use px (pixels) to specify the image''s width.


    For example, if we wanted to create a CSS class called larger-image that gave
    HTML elements a width of 500 pixels, we''d use:


    <style>


    .larger-image {


    width: 500px;


    }


    </style>


    Now, create a class called smaller-image and use it to resize the image so that
    it''s only 100 pixels wide. Give it a try.


    Here it is:


    <link href="https://fonts.googleapis.com/css?family=Lobster" rel="stylesheet"
    type="text/css">


    <style>


    .red-text {


    color: red;


    }


    .smaller-image {


    width: 100px;


    }


    h2 {


    font-family: Lobster, monospace;


    }


    p {


    font-size: 16px;


    font-family: monospace;


    }


    </style>


    <h2 class="red-text">CatPhotoApp</h2>


    <main>


    <p class="red-text">Click here to view more <a href=" https://www.bestcat.com/">cat
    photos</a>.</p>


    <a href="#"><img class="smaller-image" src="https://bit.ly/3wwInho" alt="A cute
    cat."></a>


    ## 2.10\. Add Borders Around Your Elements


    CSS borders have properties like style, color and width. For example, if we wanted
    to create a red, 5 pixel border around an HTML element, we could use this class:


    <style>


    .thin-red-border {


    border-color: red;


    border-width: 5px;


    border-style: solid;


    }


    </style>


    In this challenge, you will create a class called thick-green-border. This class
    should add a 10px solid, green border around an HTML element. Apply the class
    to your cat photo.


    Remember that you can apply multiple classes to an element using its class attribute,
    by separating each class name with a space. For example:


    <img class="thin-red-border smaller-image" src="https://bit.ly/3wwInho" alt="A
    cute cat.">


