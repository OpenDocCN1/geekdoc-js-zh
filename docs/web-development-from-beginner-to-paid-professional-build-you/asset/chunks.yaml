    \ Sans` font, but not to use the `Lobster` font.\n\nImport the `Lobster` font\
    \ to your web page. Then, use an element selector to set it as the `font-family`\
    \ for your `h2` element.\n\nHere’s the update:\n\n```html\n<link href=\"https://fonts.googleapis.com/css?family=Lobster\"\
    \ rel=\"stylesheet\" type=\"text/css\">\n<style>\n.red-text {\n  color: red;\n\
    }\nh2 {\n  font-family: Lobster;\n}\np {\n  font-size: 16px;\n  font-family: monospace;\n\
    }\n</style>\n<h2 class=\"red-text\">CatPhotoApp</h2>\n```\n\nHere’s the app update:\n\
    \n![Image](images/image-49.jpeg)\n\nFigure 2.7.1: The updated app with Lobster\
    \ font applied to the h2 heading\n\n## 2.8. Specify How Fonts Should Degrade\n\
    \nThere are several default fonts that are available in all browsers. These generic\
