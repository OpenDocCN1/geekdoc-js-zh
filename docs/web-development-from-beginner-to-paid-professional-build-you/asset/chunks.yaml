    <a href="#"><img src="https://bit.ly/3wwInho" alt="A kitten staring at the camera."></a>

    ```


    记得使用 `#` 作为你的 `<a>` 元素的 `href` 属性，以便将其无效链接。将现有的图片元素放置在 `<a>`（锚点）元素中。


    完成后，在浏览器中将光标悬停在图片上。你的光标普通指针应该变成链接点击指针。现在照片变成了一个链接了。


    ```html

