    \ if you wanted an element to use the `Helvetica` font, but degrade to the `sans-serif`\
    \ font when Helvetica isn't available, you will specify it as follows:\n\n```css\n\
    p {\n  font-family: Helvetica, sans-serif;\n}\n```\n\nGeneric font family names\
    \ are not case-sensitive. Also, they do not need quotes because they are CSS keywords.\
    \ To begin, apply `monospace`, `serif` and `sans-serif` to your elements. (Wait,\
