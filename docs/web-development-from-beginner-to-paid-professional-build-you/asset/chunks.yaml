    \nThe six digits represent the amount of red, green, and blue respectively. For\
    \ example, `#FF0000` is pure red, `#00FF00` is pure green, and `#0000FF` is pure\
    \ blue.\n\n| Color | Hex Code |\n| :--- | :--- |\n| Red | #FF0000 |\n| Green |\
