    图 2.1.2 显示了代码在 Visual Studio 编辑器中的外观。


    ![Image](img/image-46.jpeg)


    图 2.1.2：带有 CSS 的更新 CatPhotoApp 代码


    如你所示，直接在文档的 `<style>` 和 `</style>` 之间编写 CSS 比使用内联 CSS 要好得多。对我来说，在本书中我会继续使用这种方法一段时间。但如果你的网站上有多个文档或页面，并且你想使用相同的样式怎么办？你将不得不将
    `<style>` 和 `</style>` 标签之间的所有内容复制并粘贴到每个文档。


    在这种情况下，最好的方法（也是你最常见的方法）是在 `external`（外部）样式表中编写样式。要做到这一点，请创建一个新文件（完全独立的文件，但在同一个
    `02_lesson` 文件夹中），在其中编写你的 CSS。你可以将此文件命名为 `styles` 并赋予它 `.css` 扩展名。因此，完整文件名将是 `styles.css`。然后你可以在该文件包含在你自己的文档或创建的任何其他文档中


    现在，从你的应用中删除 css 规则（见下方）。


    ```html

    <style>

    h2 {

    color: blue;

    }

    </style>

    ```


    现在，将 `<style>` 和 `</style>` 之间的所有内容写入你新的 `styles.css` 文件中，并确保保存文件。如下所示：


    ```css

    h2 {

    color: blue;

    }

    ```


    查看图 2.1.3 中它在 Visual Studio 中的外观。


    ![Image](img/image-47.jpeg)


    图 2.1.3：从 index.html 文件迁移到 styles.css 文件的 CSS 规则


    但你还没有完成，因为这两个文件（`index.html` 和 `styles.css`）之间没有任何连接。这个 HTML 文件对 CSS 文件一无所知，尽管它们在同一个文件夹中。你需要告诉
    HTML 关于 CSS 的信息。为了做到，你将使用一个名为 `<link>` 的新元素。该元素位于 `<head></head>` 标签内部。它的写法如下：


    ```html

    <link rel="stylesheet" href="styles.css">

    ```


    或者，你可以这样写：


    ```html

    <link rel="stylesheet" type="text/css" href="styles.css">

    ```


    `type` 用于指示你所链接的文件内容。默认值为 `text` 或 `css`。


    想象一下，如果你的 CSS 文件在不同的文件夹中（例如 `03_lesson`），你编写 `<link>` 代码将如下所示：


    ```html

    <link rel="stylesheet" href="03_lesson/styles.css">

    ```


    由于你目前还没有 `03_lesson` 文件夹，请使用 `<link rel="stylesheet" href="styles.css">`。


    你更新后的 `index.html` 文件现在应该是这样的（`<link>` 代码以蓝色突出，且必须放在 `<head>` 和 `</head>` 部分之间）：


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Introduction</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    ... (其余内容) ...

    </html>

    ```

