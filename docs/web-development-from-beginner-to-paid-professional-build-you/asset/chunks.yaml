    <h1 class="pink-text">Hello World!</h1>


    If you view the output of the updated code now, you’ll see that your h1 element
    has been given a pink color. This proves that your pink-text class overrides the
    body element''s CSS.


    ## 2.28. Override Styles in Subsequent CSS


    Our pink-text class overrode our body element''s CSS declaration! We just proved
    that our classes will override the body element''s CSS. So, the next logical question
    is, what can we do to override our pink-text class?


    Create an additional CSS class called blue-text that gives an element the color
    blue. Make sure it''s below your pink-text class declaration.


    Apply the blue-text class to your h1 element in addition to your pink-text class,
    and let''s see which one wins. Applying multiple class attributes to a HTML element
    is done with a space between them like this:


    class="class1 class2"


    Note: It doesn''t matter which order the classes are listed in the HTML element.


    However, the order of the class declarations in the <style> section is what is
    important. The second declaration will always take precedence over the first.
    Because .blue-text is declared second, it overrides the attributes of .pink-text.


    Here it is:


    <style>


    body {


    background-color: black;


    font-family: monospace;


    color: green;


    }


    .pink-text {


    color: pink;


    }


    .blue-text{


    color: blue;


    }


    </style>


    <h1 class="pink-text blue-text">Hello World!</h1>


    ## 2.29. Override Class Declarations by Styling ID Attributes


    We just proved that browsers read CSS from top to bottom in order of their declaration.
    That means that, in the event of a conflict, the **browser will use whichever
    CSS declaration came last**. Notice that if we even had put blue-text before pink-text
    in our h1 element''s classes, it would still look at the **declaration order**
    and not the **order of their use**!


    But we''re not done yet. There are other ways that you can override CSS. Do you
    remember id attributes?


    Let''s override your pink-text and blue-text classes, and make your h1 element
    orange, by giving the h1 element an id and then styling that id.


    Give your h1 element the id attribute of orange-text. Remember, id styles look
    like this:


    <h1 id="orange-text">


    Leave the blue-text and pink-text classes on your h1 element. Create a CSS declaration
    for your orange-text id in your style element. Here''s an example of what this
    looks like:


    #brown-text {


    color: brown;


    }


    Note: It doesn''t matter whether you declare this CSS above or below pink-text
    class, since the id attribute will always take precedence.


    Here’s what your code should like:


    <style>


    body {


    background-color: black;


    font-family: monospace;


    color: green;


    }


    .pink-text {


    color: pink;


    }


    .blue-text {


    color: blue;


    }


    #orange-text {


    color: orange;


    }


    </style>


    <h1 id="orange-text" class="pink-text blue-text">Hello World!</h1>


    Your output should look like Figure 2.29.1.


    ![Image](images/image-61.jpeg)


    Figure 2.29.1: H1 element takes orange color because the pink-text and blue-text
    classes are overridden


    ## 2.30. Override Class Declarations with Inline Styles


    So, we''ve proven that **id declarations override class declarations**, regardless
    of where they are declared in your style element CSS.


    There are other ways that you can override CSS. Do you remember inline styles?
    Use an inline style to try to make our h1 element white. Remember, inline styles
    look like this:


    <h1 style="color: green;">


    Leave the blue-text and pink-text classes on your h1 element. Here’s how to do
    it:


    <style>


    body {


    background-color: black;


    font-family: monospace;


    color: green;


    }


    .pink-text {


    color: pink;


    }


    .blue-text {


    color: blue;


    }


    #orange-text {


    color: orange;


    }


    </style>


    <h1 style="color: white;" id="orange-text" class="pink-text blue-text">Hello World!</h1>


    Check the output on your browser. The “Hello World!” text should be white.


    ## 2.31. Override All Other Styles by using Important


    Yay! We just proved that inline styles will override all the CSS declarations
    in your style element. But wait. There''s one last way to override CSS. This is
    the most powerful method of all. But before we do it, let''s talk about why you
    would ever want to override CSS.


    In many situations, you will use CSS libraries. These may accidentally override
    your own CSS. So when you absolutely need to be sure that an element has specific
    CSS, you can use !important.


    Let''s go all the way back to our pink-text class declaration. Remember that our
    pink-text class was overridden by subsequent class declarations, id declarations,
    and inline styles.


    Let''s add the keyword !important to your pink-text element''s color declaration
    to make 100% sure that your h1 element will be pink.


    An example of how to do this is:


    color: red !important;


    Here’s the how to write it:


    .pink-text {


    color: pink !important;


    }


    Update your code now. Then check the output on your browser and confirm that your
    h1 element is now pink!


    ## 2.32\. Use Hex Code for Specific Colors


    Did you know there are other ways to represent colors in CSS? One of these ways
    is called **hexadecimal code**, or **hex code** for short.


    We usually use *decimals*, or base 10 numbers, which use the symbols 0 to 9 for
    each digit. Hexadecimals (or hex) are base 16 numbers. This means it uses sixteen
    distinct symbols. Like decimals, the symbols 0-9 represent the values zero to
    nine. Then A, B, C, D, E, F represent the values 10 to 15\. Altogether, 0 to F
    can represent a digit in hexadecimal, giving us 16 total possible values. You
    can find more information about hexadecimal numbers [here](https://www.sciencedirect.com/topics/engineering/hexadecimal).


    In CSS, we can use 6 hexadecimal digits to represent colors, two each for the
    red (R), green (G), and blue (B) components. For example, #000000 is black and
    is also the lowest possible value. You can find more information about the RGB
    color system [here](https://whatis.techtarget.com/definition/RGB-red-green-and-blue).


    body {


    color: #000000;


    }


    Copy the code below to your editor, and replace the word black in the body element''s
    background-color with its hex code representation, #000000.


    <style>


    body {


    background-color: black;


    }


    </style>


    Here’s it:


    <style>


    body {


    background-color: #000000;


    }


    </style>


    ## 2.33\. Use Hex Code to Mix Colors


    To review, hex codes use 6 hexadecimal digits to represent colors, two each for
    red (R), green (G), and blue (B) components.


    From these three pure colors (red, green, and blue), we can vary the amounts of
    each to create over 16 million other colors!


    For example, orange is pure red, mixed with some green, and no blue. In hex code,
    this translates to being #FFA500.


    The digit 0 is the lowest number in hex code, and represents a complete absence
    of color. The digit F is the highest number in hex code, and represents the maximum
    possible brightness.


    | Color | Hex Code |


