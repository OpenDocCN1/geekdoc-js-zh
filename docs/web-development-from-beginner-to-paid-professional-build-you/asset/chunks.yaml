    \ are quite dense and crazy to try and understand.\n"
  raw: 'So, the select is the parent that groups together a bunch of options. Each
    option has some text (such as Extra Small) in between the opening and closing
    tags <option></option>. Then we have a value attribute (such as L), just like
    we did with our radio buttons, which is what will be sent through when this information
    is submitted to the server.


    So, the select is where we put the name and an id if we wanted to label it, and
    then we have option.


    If you want one of the options pre-selected, you can modify the code above as
    shown in the following example. I created a very simple dropdown menu where the
    second option (Small) is selected by default.


    <label for="size-select">Choose a shoe size:</label>


    <br>


    <select name="shoes" id="size-select">


    <option value="">--Please choose an option--</option>


    <option value="XS">Extra Small</option>


    <option value="S" selected>Small</option>


    <option value="M">Medium</option>


    <option value="L">Large</option>


    </select>


    That is the basics of a select and the option elements.


    Slider Control: <input type = "range">


    There are a couple more controls that I do want to highlight, and they don''t
    really have a lot to do with one another. But I''m just going to make this quick.
    The first one is range. Our range input creates a little slider or dial control
    where a user can select some value on a sliding range. We can control the minimum
    and maximum value. A precise value, however, is not considered important.


    Here''s the first example:


    <p>Audio settings:</p>


    <!--First Slider-->


    <div>


    <input type="range" id="volume" name="volume" min="0" max="11">


    <label for="volume">Volume</label>


    </div>


    <!--Second Slider-->


    <div>


    <input type="range" id="cowbell" name="cowbell" min="0" max="100" value="70" step="10">


    <label for="cowbell">Cowbell</label>


    </div>


    Figure 1.24.2 shows the output.


    ![Image](images/image-21.jpeg)


    Figure 1.24.2: The output of slider controls code


    In the above code, the input type is set to range. The value is not less than
    min (minimum which is 0 for both sliders), and is not greater than max (maximum
    which is 11 for first slider and 100 for second slider). The default initial value
    is 70 for the second slider, and is a multiple of step which is 10 for this slider.


    Now, I want you to modify the above code so that “Volume” and “Cowbell” appear
    on the left side of the slider.


    Text Area: <textarea></textarea>


    You definitely have seen before a website that uses a text area. It’s basically
    a multiline text input. It''s where you can type in a paragraph and all sorts
    of things. This is not an <input> tag. Let’s take an example right away.


    <label for="requests">Enter Special Request:</label>


    <br>


    <textarea id="requests" name="requests" rows="10" cols="20">Type here…


    </textarea>


    You can use rows and cols to control the size of the box. If you want a bigger
    text area for example, increase the number of rows or columns or both. You can
    even give it a placeholder text like Type here… that you see inside the box in
    Figure 1.24.3.


    ![Image](images/image-22.jpeg)


    Figure 1.24.3: The output of text area code


    Ok. That''s pretty much it for the most important and commonly used form controls.
    There are others but those are the essentials.


    Form Validations


    The term validation generally refers to adding constraints or validating user
    input or data, such as, requiring that some fields can''t be empty, or that a
    password has to be between 7 and 12 characters or whatever.


    These are a few different examples of constraints and they can get more complex.
    For example, it might be required that your password must have a special character,
    a number, a lowercase letter, an uppercase letter and no spaces. We''re not going
    to go into all of that right now. Instead, I''m going to show you the built-in
    browser validations that we can add in to our forms and inputs.


    When I just type in two or three characters in the Email field at Stripe.com’s
    registration page, [https://dashboard.stripe.com/register](https://dashboard.stripe.com/register)
    for example, it just tells me immediately I move to the next field that it''s
    not a valid email. Also, as I start typing my password in the password field,
    I get a text blow telling me what''s wrong or what I need to do. See Figure 1.24.4\.
    That is all done with JavaScript.


    ![Image](images/image-23.jpeg)


    Figure 1.24.4: Form validations at https://dashboard.stripe.com/register


    This is all happening in the browser. It’s called **client-side validation**.
    This is in addition to what I''m going to show you and you''ll learn how to do
    this sort of thing later on. This is definitely a nice experience.


    There''s something else called **server-side validation**. If I try to submit
    my data as shown in Figure 1.24.4, it won''t even let me submit. But if I did
    submit it, there could also be validations on the server (in this case, Stripe’s
    server) to make sure that my data meets their expectations.


    For example, it''s possible that somebody could get past this client-side validation,
    or there might be a bug. It would be hard, but somebody could directly send data
    that does not conform to the required pattern to the server. They could send their
    own request or use a terminal or something to send data to Stripe. They likely
    also have validations on the server side. Those are the two different terms.


    In the past, server-side validation was pretty common (and is still around), where
    you would type something, fill everything out, and after you hit submit and the
    page refreshes. Then it tells you if there''s any problems because it''s hitting
    a server first and then coming back to tell you if there are issues.


    Here'' we''re going to focus on the basics of the built-in validations. The first
    thing you need to know is a particular attribute called required. Run this code:


    <form action="https://www.google.com/search">


    <label for="username">Search Google:</label>


    <input type="text" placeholder="Enter search term" id="username" name="q" required>


    <p>


    <button>Search</button>


    </p>


    </form>


    Now, you can’t submit this form unless you fill it first. Figure 1.24.5 shows
    my output when I tried to submit the form without typing in anything.


    ![Image](images/image-24.jpeg)


    *Figure 1.24.5: The output of a form validation using the “*required*” attribute*


    The error, “*Please fill out this field*” is shown by Chrome. You might see a
    different looking error message depending on the browser you''re in. This may
    not be fully implemented by the way across every browser these days. It''s pretty
    standard and common, but it''s not a guarantee.


    In addition to required validation, we also have minlength and maxlength which
    are attributes for validating the minimum and maximum length of a text. So, you
    could use them for a username and/or password as well.


    <form action="/dummy">


    <label for="username">Username:</label>


    <input type="text" id="username" minlength="5" maxlength="20" required>


    <p>


    <button>Submit</button>


    </p>


    </form>


    If you try to submit this form with less than 6 or more than 20 characters in
    the username field, you will get the error shown in Figure 1.25.6.


    ![Image](images/image-25.jpeg)


    *Figure 1.24.6: The output of a form validation using the* *“minlength" "maxlength”
    attributes*


    As we’ve seen in section 1.22, there''s also min and max which are used for numeric
    values. For example, min could be used to exclude negative numbers, while min
    and max could be used for things like a date, a month, a week, time or a range
    of input.


    Pattern, Email & URL Validations


    We also have some inputs that actually have a default validation built in. They
    are matching a pattern. So, pattern is actually an attribute. We can add two elements
    and define something called a regular expression. We''re not going into this right
    now. All you need to know is that regular expressions are incredibly useful. We''ll
    touch on them later on, They are quite dense and crazy to try and understand.'
