    You may have already noticed this, but all HTML elements are essentially little
    rectangles. Three important properties control the space that surrounds each HTML
    element: `padding`, `border`, and `margin`.


    An element''s `padding` controls the amount of space between the element''s content
    and its border. If you run the code below, you will see that the blue box and
    the red box are nested within the yellow box.


    ```html

    <style>

    .injected-text {

    margin-bottom: -25px;

    text-align: center;

    }

