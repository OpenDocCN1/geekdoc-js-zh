    ```html

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    </head>

    <body>

    </body>

    </html>

    ```


    The attribute `lang="en"` indicates that English is the default language of this
    page. The `<meta charset="UTF-8">` tag basically specifies the character set the
    website is written with. Here is what it means:


    - `U` stands for `Universal Character Set`.

    - `TF` stands for `Transformation Format`

    - `8` stands for `8-bit`.


    This is a character encoding capable of encoding all possible characters in Unicode.


    The `<meta http-equiv="X-UA-Compatible" content="IE=edge">` meta tag allows web
    authors to choose what version of Internet Explorer (IE) the page should be rendered
    as. Depending upon what Microsoft browsers you want your page to support, you
    may not need to continue using the `X-UA-Compatible` tag.


    If you need to support `IE9` or `IE8`, then I would recommend using the tag. If
    you want your page to only support the latest browsers (`IE11` and/or `Edge`)
    then I would consider removing this tag altogether.


    The `viewport` refers to the user''s visible area of the web page. It actually
    varies with the device. It is bigger on a computer screen than on a mobile phone.


    `<meta name="viewport" content="width=device-width, initial-scale=1.0">` gives
    the user’s browser instructions on how to control the scaling and dimensions of
    the page.


    The `width=device-width` part sets the width of the page to follow the screen-width
    of the device (which actually varies depending on the device). The `initial-scale=1.0`
    part sets the initial zoom level when the browser first loads the page.


    ## 1.27. Define the Head and Body of an HTML Document


    You can add another level of organization in your HTML document within the `html`
    tags with the `head` and `body` elements. The head `<head></head>`, also called
    the document metadata element, contains basically things that don''t show up on
    the web page. For example, `<title>My First Webpage</title>` will put the title
    My First Webpage right at the top of the browser’s window/tab, not anywhere on
    the page itself. See Figure 1.27.1.


    ![Image](images/image-30.jpeg)


    Figure 1.27.1: How a web browser displays a page title


    Metadata is the information about the web page, such as character set, keywords,
    page description, the author of the document, and viewport settings for different
    devices that view the page. Metadata is not displayed on a web page, but is parsed
    by the machine.


    Any markup with information about your page would go into the `head` tag. Then
    any markup with the content of the page (what displays for a user) would go into
    the `body` tag.


    Metadata elements, such as `link`, `meta`, `title`, and `style`, typically go
    inside the `head` element.


    Here''s an example of a page''s layout:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta />

    </head>

    <body>

    <div>

    </div>

    </body>

    </html>

    ```


    Edit the markup below so there''s a head and a body. The head element should only
    include the title, and the body element should only include the `h1` and `p`:


    ```html

