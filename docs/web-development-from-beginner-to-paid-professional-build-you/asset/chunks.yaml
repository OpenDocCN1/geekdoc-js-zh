    border-style: solid;

    border-color: black;

    border-width: 5px;

    text-align: center;

    }

    .yellow-box {

    background-color: yellow;

    padding: 10px;

    }

    .red-box {

    background-color: crimson;

    color: #fff;

    padding: 20px;

    }

    .blue-box {

    background-color: blue;

    color: #fff;

