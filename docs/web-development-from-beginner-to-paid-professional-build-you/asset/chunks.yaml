    Note that it''s important to have both opening and closing curly braces (`{` and
    `}`) around each element''s `style rule(s)`. You also need to make sure that your
    element''s style definition is between the opening and closing style tags. Finally,
    be sure to add a semicolon to the end of each of your element''s style rules.


    Now, for your cat photo app, edit your CSS style block and add the necessary CSS
    styles to turn all `h2` elements blue.


    This is the updated code:


    ```html

    <style>

    h2 {

    color: blue;

    }

    </style>


    <h2>CatPhotoApp</h2>


    <main>

    <p>Click here to view more <a href="  https://www.bestcat.com/">cat photos</a></a>.</p>

    <a href="#"><img src="https://bit.ly/3wwInho" alt="A cute cat."></a>

    <div>

    <p>Things cats love:</p>

    <ul>

    <li>cat nip</li>

    <li>laser pointers</li>

    <li>lasagna</li>

    </ul>

    <p>Top 3 things cats hate:</p>

    <ol>

    <li>flea treatment</li>

    <li>thunder</li>

    <li>other cats</li>

    </ol>

    </div>

    <form action="https://catphotoapp.com/submit-cat-photo">

    <label><input type="radio" name="indoor-outdoor" checked> Indoor</label>

    <label><input type="radio" name="indoor-outdoor"> Outdoor</label><br>

    <label><input type="checkbox" name="personality" checked> Loving</label>

    <label><input type="checkbox" name="personality"> Lazy</label>

    <label><input type="checkbox" name="personality"> Energetic</label><br>

    <input type="text" placeholder="cat photo URL" required>

    <button type="submit">Submit</button>

    </form>

    </main>

    ```


    Figure 2.1.2 shows how the code appears in the Visual Studio editor.


    ![Image](images/image-46.jpeg)


    Figure 2.1.2: The updated CatPhotoApp code with CSS


    As you can see, writing CSS directly between `<style>` and `</style>` inside of
    our document is much better than using inline CSS. For me, I will continue to
    use this approach for a while in this book. But what about if you have multiple
    documents or pages on your website and you want to use the same styles? You would
    have to copy and paste everything between the `<style>` and `</style>` tags into
    each document.


    In this case, the best approach, and the one you see the most, is to write your
    styles in an `external` style sheet. To do this, make a new file (a completely
    separate file but in the same `02_lesson folder`) where you’ll write your CSS.
    You can name this file something like `styles` and give it a `.css` extension.
    So, the full file name will be `styles.css`. Then you can include that file in
    your own document or any other documents you make.


    Now, delete the css rule (see it below) from your app.


    ```html

    <style>

    h2 {

    color: blue;

    }

    </style>

    ```


    Now, write everything between `<style>` and `</style>` inside your new `styles.css`
    file and make sure you save the file. Here’s it.


    ```css

    h2 {

    color: blue;

    }

    ```


    See how it looks in Visual Studio in Figure 2.1.3.


    ![Image](images/image-47.jpeg)


    Figure 2.1.3: CSS rule transferred from index.html file to styles.css file


    But you’re not done yet because the two files (`index.html` and `styles.css`)
    are not connected in any way. This HTML file knows nothing about that CSS file,
    even though they’re in the same folder. You need to tell HTML about the CSS. To
    do this, you’ll use a new element called the `<link>` element. The link element
    goes inside our `<head></head>` tags. It’s written as follows:


    ```html

    <link rel="stylesheet" href="styles.css">

    ```


    Alternatively, you can write it like this:


    ```html

    <link rel="stylesheet" type="text/css" href="styles.css">

    ```


    `type` is used to indicate the content of the file you''re linking. The default
    value is a text or `css`.


    For a moment, imagine that your CSS file were in a different folder (say, `03_lesson`),
    you would have written the `<link>` code like this:


    ```html

    <link rel="stylesheet" href="03_lesson/styles.css">

    ```


    Since you currently don’t have the `03_lesson` folder, use `<link rel="stylesheet"
    href="styles.css">`.


    You updated `index.html` file should now be this (the `<link>` code is highlighted
    in blue and must be placed inside the `<head>` and `</head>` section):


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Introduction</title>

    <link rel="stylesheet" href="styles.css">

    </head>

    <body>

    <h2>CatPhotoApp</h2>

    <main>

    <p>Click here to view more <a href=" https://www.bestcat.com/">cat photos</a></a>.</p>

    ... (rest of the body) ...

    </body>

    </html>

    ```

