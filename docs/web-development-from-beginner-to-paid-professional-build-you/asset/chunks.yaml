    \ element the `id` attribute of `orange-text`. Remember, id styles look like this:\n\
    \n`<h1 id=\"orange-text\">`\n\nLeave the `blue-text` and `pink-text` classes on\
    \ your `h1` element. Create a CSS declaration for your `orange-text` id in your\
    \ style element. Here's an example of what this looks like:\n\n```css\n#brown-text\
    \ {\n  color: brown;\n}\n```\n\nNote: It doesn't matter whether you declare this\
    \ CSS above or below `pink-text` class, since the `id` attribute will always take\
    \ precedence.\n\nHere’s what your code should like:\n\n```html\n<style>\nbody\
    \ {\n  background-color: black;\n  font-family: monospace;\n  color: green;\n\
    }\n.pink-text {\n  color: pink;\n}\n.blue-text {\n  color: blue;\n}\n#orange-text\
    \ {\n  color: orange;\n}\n</style>\n<h1 id=\"orange-text\" class=\"pink-text blue-text\"\
    >Hello World!</h1>\n```\n\nYour output should look like Figure 2.29.1.\n\n![Image](images/image-61.jpeg)\n\
    \nFigure 2.29.1: H1 element takes orange color because the `pink-text` and `blue-text`\
    \ classes are overridden.\n\n## 2.30. Override Class Declarations with Inline\
    \ Styles\n\nSo, we've proven that id declarations override class declarations,\
    \ regardless of where they are declared in your style element CSS.\n\nThere are\
    \ other ways that you can override CSS. Do you remember inline styles? Use an\
    \ inline style to try to make our `h1` element white. Remember, inline styles\
    \ look like this:\n\n`<h1 style=\"color: green;\">`\n\nLeave the `blue-text` and\
    \ `pink-text` classes on your `h1` element. Here’s how to do it:\n\n```html\n\
    <style>\nbody {\n  background-color: black;\n  font-family: monospace;\n  color:\
    \ green;\n}\n.pink-text {\n  color: pink;\n}\n.blue-text {\n  color: blue;\n}\n\
    #orange-text {\n  color: orange;\n}\n</style>\n<h1 style=\"color: white;\" id=\"\
    orange-text\" class=\"pink-text blue-text\">Hello World!</h1>\n```\n\nCheck the\
    \ output on your browser. The “Hello World!” text should be white.\n\n## 2.31.\
    \ Override All Other Styles by using Important\n\nYay! We just proved that inline\
    \ styles will override all the CSS declarations in your style element. But wait.\
    \ There's one last way to override CSS. This is the most powerful method of all.\
    \ But before we do it, let's talk about why you would ever want to override CSS.\n\
    \nIn many situations, you will use CSS libraries. These may accidentally override\
    \ your own CSS. So when you absolutely need to be sure that an element has specific\
