    \ | 不同类中的 `attack()`\n\n## 在 JavaScript 中创建对象\n\n对象将相关的属性和函数组合。\n\n### 使用对象字面量\n\
    \n```js\nlet player = {\n  name: \"Knight\",\n  health: 100,\n  attack: function\
