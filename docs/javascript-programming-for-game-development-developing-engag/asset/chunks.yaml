    that move and chase the player ✔ Obstacles like spikes, lava, or moving platforms
    ✔ Basic AI behavior for enemy movements and attacks


    ## 1\. Creating Enemy Objects


    Enemies move left and right  on a platform or chase the player .


    ### Step 1: Defining Enemy Properties


