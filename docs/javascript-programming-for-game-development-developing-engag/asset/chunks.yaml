    \n# Chapter 4\n\n# Game Physics and Movement\n\nPhysics is a crucial part of game\
    \ development, providing a sense of realism and immersion. In JavaScript games,\
    \ physics controls movement, gravity, friction, collisions, and acceleration,\
    \ ensuring objects behave naturally.\n\nThis chapter explores game physics basics,\
    \ implementing gravity and friction, and velocity & acceleration mechanics in\
    \ JavaScript-based 2D games.\n\n## 4.1 Understanding Game Physics Basics\n\nGame\
    \ physics refers to the mathematical principles that govern how objects move and\
    \ interact within a game world. In 2D JavaScript games, physics is used to simulate\
    \ real-world behaviors like:\n\n- **Gravity** (pulling objects downward)\n- **Friction**\
    \ (slowing down movement)\n- **Velocity & acceleration** (speed and motion over\
    \ time)\n- **Collision response** (bouncing, stopping, or sliding after impact)\n\
    \nPhysics in JavaScript games is often implemented using:\n\n1. Manual calculations\
    \ with JavaScript's `requestAnimationFrame()`\n2. Physics libraries like `Matter.js`,\
    \ `Box2D`, or `Planck.js`\n\n### Key Game Physics Terms\n\n| Term | Definition\
    \ |\n| :--- | :--- |\n| Mass | How much matter an object has (not always needed\
    \ in 2D games). |\n| Velocity (v) | Speed and direction of an object. |\n| Acceleration\
    \ (a) | Rate of change of velocity over time. |\n| Gravity (g) | Constant downward\
    \ force acting on objects. |\n| Friction | Resistance force that slows down movement.\
    \ |\n| Collision Detection | Checking if objects are touching each other. |\n\n\
    ***\n\n## 4.2 Implementing Gravity and Friction in Games\n\n### Simulating Gravity\
    \ in JavaScript\n\nGravity is the force that pulls objects downward. In games,\
    \ it is implemented by continuously increasing an object's vertical velocity (y-axis).\n\
    \n#### Basic Gravity Formula\n\n```makefile\nvelocityY += gravity;\npositionY\
    \ += velocityY;\n```\n\n- `velocityY` increases over time due to gravity.\n- `positionY`\
    \ updates based on velocity.\n\n### Example: Applying Gravity to a Falling Object\n\
    \n```js\nconst canvas = document.getElementById(\"gameCanvas\");\nconst ctx =\
    \ canvas.getContext(\"2d\");\nlet player = {\n  x: 100,\n  y: 50,\n  width: 50,\n\
    \  height: 50,\n  velocityY: 0, // Vertical speed\n  gravity: 0.5, // Simulated\
    \ gravity force\n  jumpStrength: -10, // Upward force when jumping\n  onGround:\
    \ false\n};\n\nfunction update() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\
    \ // Clear canvas\n  // Apply gravity\n  if (!player.onGround) {\n    player.velocityY\
    \ += player.gravity;\n  }\n  player.y += player.velocityY;\n  // Collision with\
    \ the ground\n  if (player.y + player.height >= canvas.height) {\n    player.y\
    \ = canvas.height - player.height; // Set position to the ground\n    player.velocityY\
    \ = 0;\n    player.onGround = true;\n  }\n  // Draw player\n  ctx.fillStyle =\
    \ \"blue\";\n  ctx.fillRect(player.x, player.y, player.width, player.height);\n\
    \  requestAnimationFrame(update);\n}\n\nupdate();\n```\n\n- The player falls naturally\
    \ until they hit the ground.\n- Gravity is applied only if the player is in the\
    \ air.\n\n### Adding Jumping Mechanics\n\nTo allow jumping, we set a negative\
    \ velocity when the player presses the jump key.\n\n```js\ndocument.addEventListener(\"\
    keydown\", function(event) {\n  if (event.key === \" \" && player.onGround) {\n\
    \    player.velocityY = player.jumpStrength;\n    player.onGround = false; //\
    \ Player is now in the air\n  }\n});\n```\n\nNow, when the player presses the\
    \ spacebar, they jump upwards.\n\n## Friction: Slowing Down Movement\n\nFriction\
    \ is resistance that slows down an object's movement. It is applied to horizontal\
    \ movement to simulate a natural stop.\n\n#### Basic Friction Formula\n\n```nginx\n\
    velocityX *= friction;\n```\n\n- Friction gradually reduces horizontal speed over\
    \ time.\n\n### Example: Implementing Friction\n\n```js\nlet player = {\n  x: 50,\n\
    \  y: 250,\n  width: 50,\n  height: 50,\n  velocityX: 5, // Horizontal speed\n\
    \  friction: 0.9 // Slows down movement\n};\n\nfunction update() {\n  ctx.clearRect(0,\
    \ 0, canvas.width, canvas.height);\n  // Apply friction\n  player.velocityX *=\
    \ player.friction;\n  player.x += player.velocityX;\n  // Draw player\n  ctx.fillStyle\
    \ = \"red\";\n  ctx.fillRect(player.x, player.y, player.width, player.height);\n\
    \  requestAnimationFrame(update);\n}\n\nupdate();\n```\n\nNow, when movement stops,\
    \ the player gradually slows down instead of stopping instantly.\n\n## 4.3 Velocity\
    \ and Acceleration Mechanics\n\n### What is Velocity?\n\nVelocity determines how\
