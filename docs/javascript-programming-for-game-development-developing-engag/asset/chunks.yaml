  trans: "\n\n3D 游戏（FPS 射击、赛车游戏、开放世界游戏）虚拟现实（VR）和增强现实（AR）3D 仿真与交互环境\n\n`Three.js` 是高性能\
    \ 3D Web 游戏的最佳选择。\n\n在本章中，我们探索了：\n✔ `Phaser.js` 用于 2D 游戏开发\n✔ `Three.js` 用于 3D\
    \ 图形和游戏开发\n✔ 如何两个框架中设置并构建简单游戏\n\n通过选择合适的框架，开发者可以为浏览器和移动设备创建引人注目的高性能游戏。\n\n在下一章中，我们将优化游戏性能并减少延迟，以获得更流畅的游戏体验！\n\
    \n# 第 13 章\n\n# 使用 Three.js 创建 3D 游戏\n\n`Three.js` 是一个强大的 JavaScript 库，能够在浏览器中进行\
    \ 3D 游戏开发。它构建在 `WebGL` 之上，允许开发者创建交互式 3D 环境、基于物理的游戏机制以及高性能图形。\n\n在本章中，我们将：\n\n\
    ✔ 理解 `WebGL` 和 `Three.js` 的基础知识\n✔ 使用 `Three.js` 设置基础 3D 场景\n✔ 添加光照、摄像和对象以创建一个动态游戏世界\n\
    \n## 13.1 WebGL 和 Three.js 简介\n\n### 1. 什么是 WebGL？\n\n`WebGL`（Web 图形库）是一种用于在浏览器中渲染\
    \ 3D 图形的低级 API。它允许开发者在不需要外部插件的情况下创建交互式 3D 应用。\n\n- 直接在浏览器中运行\n- 使用 GPU 加速以实现高性能\n\
    - 基于 `OpenGL ES`，这是一种流行的图形标准\n\n### 2. 为什么使用 Three.js 而不是原生 WebGL？\n\n编写原生 `WebGL`\
    \ 代码可能复杂且耗时，需要对着色器（shaders）、缓冲区（buffers）和低级渲染技术的知识。\n\n`Three.js` 通过处理以下内容简化了\
    \ 3D 开发：\n\n- 场景创建和对象管理\n- 光照和材质\n- 摄像头和透视处理\n- 3D 模型加载（`GLTF`、`FBX`、`OBJ` 等）\n\
    \n### 3. 安装 Three.js\n\n你可以使用 CDN 或 `npm` 安装 `Three.js`。\n\n#### CDN 方法（推荐初学者使用）\n\
    \n```html\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"\
    ></script>\n```\n\n#### NPM 安装（针对高级用户）\n\n```sh\nnpm install three\n```\n\n##\
    \ 13.2 使用 Three.js 设置 3D 场景\n\n一个 `Three.js` 场景包含：\n\n- 一个 `Scene`（场景）：存放所有对象的容器\n\
    - 一个 `Camera`（摄像头）：定义玩家对 3D 世界的视角\n- 一个 `Renderer`（渲染器）：在屏幕上绘制所有内容\n\n### 1. 初始化\
    \ Three.js 场景\n\n创建一个 HTML 文件并引入 `Three.js` CDN。\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n<title>Three.js 的 3D 游戏</title>\n\
    <style>\nbody { margin: 0; overflow: hidden; }\ncanvas { display: block; }\n</style>\n\
    </head>\n<body>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"\
    ></script>\n<script src=\"game.js\"></script>\n</body>\n\n</html>\n```\n\n###\
    \ 2. 创建基础 3D 场景 (game.js)\n\n```js\n// 创建一个场景\nconst scene = new THREE.Scene();\n\
    \n// 创建一个摄像头\nconst camera = new THREE.PerspectiveCamera(75, window.innerWidth\
    \ / window.innerHeight, 0.1, 1000);\ncamera.position.z = 5;\n\n// 创建一个渲染器\nconst\
    \ renderer = new THREE.WebGLRenderer();\nrenderer.setSize(window.innerWidth, window.innerHeight);\n\
    document.body.appendChild(renderer.domElement);\n```\n\n- 创建一个 3D 世界（`scene`）。\n\
    - 添加一个透视摄像头以实现深度感知。\n- 创建一个渲染器，将图形输出到屏幕上。\n\n### 3. 添加 3D 对象\n\n我们可以向场景中添加一个简单的立方体。\n\
    \n```js\n// 创建一个立方体\nconst geometry = new THREE.BoxGeometry();\nconst material\
    \ = new THREE.MeshBasicMaterial({ color: 0x00ff00 });\nconst cube = new THREE.Mesh(geometry,\
    \ material);\n\n// 将立方体添加到场景\nscene.add(cube);\n```\n\n- 使用 `BoxGeometry` 创建一个绿色立方体。\n\
    - `MeshBasicMaterial` 定义了它的颜色。\n- 将立方体添加到场景。\n\n### 4. 立方体动画\n\n为了让立方体持续旋转，我们使用了游戏循环。\n\
    \n```js\nfunction animate() {\n  requestAnimationFrame(animate);\n  // 旋转立方体\n\
    \  cube.rotation.x += 0.01;\n  cube.rotation.y += 0.01;\n  renderer.render(scene,\
    \ camera);\n}\nanimate();\n```\n\n- `requestAnimationFrame(animate)` 确保动画流畅。\n\
    - 在每一帧更新立方体的旋转角度。\n\n### 5. 调整窗口大小\n\n如果窗口调整大小，我们应该更新渲染器。\n\n```js\nwindow.addEventListener(\"\
    resize\", () => {\n  camera.aspect = window.innerWidth / window.innerHeight;\n\
    \  camera.updateProjectionMatrix();\n  renderer.setSize(window.innerWidth, window.innerHeight);\n\
    });\n```\n\n## 13.3 添加光照、摄像头和对象\n\n为了让我们的 3D 场景更加真实，我们需要：\n- 光照\n- 摄像头设置\n- 交互元素\n\
    \n### 1. 添加光照\n\n没有光照，3D 对象看起来会是平面的。\n\n#### 示例：添加平行射光\n\n```js\nconst light =\
    \ new THREE.DirectionalLight(0xffffff, 1);\nlight.position.set(5, 5, 5);\nscene.add(light);\n\
    ```\n\n- `DirectionalLight` 模拟阳光。\n\n#### 示例：添加环境光\n\n```js\nconst ambientLight\
    \ = new THREE.AmbientLight(0x404040);\nscene.add(ambientLight);\n```\n\n- `AmbientLight`\
    \ 提供整体亮度度。\n\n### 2. 使用摄像头 (OrbitControls)\n\n默认情况下，摄像头是固定的。我们可以使用 `OrbitControls`\
    \ 添加摄像头控制。\n\n#### 第 1 步：安装 OrbitControls（针对 NPM）\n\n```sh\nnpm install three/examples/jsm/controls/OrbitControls.js\n\
    ```\n\n#### 第 2 步：添加摄像头控制\n\n```js\nconst controls = new THREE.OrbitControls(camera,\
    \ renderer.domElement);\ncontrols.enableDamping = true;\n```\n\n- 允许用户自由移动摄像头。\n\
    \n### 3. 添加地面和天空\n\n为了让场景感觉更真实，我们添加地面和天空。\n\n#### 示例：添加地面\n\n```js\nconst groundGeometry\
    \ = new THREE.PlaneGeometry(20, 20);\nconst groundMaterial = new THREE.MeshStandardMaterial({\
    \ color: 0x22bb22 });\nconst ground = new THREE.Mesh(groundGeometry, groundMaterial);\n\
    ground.rotation.x = -Math.PI / 2;\nscene.add(ground);\n```\n\n- 创建一个绿色地面。\n- 将其绕\
    \ X 轴旋转。\n\n#### 示例：添加天空\n\n```js\nconst loader = new THREE.TextureLoader();\n\
    const skyTexture = loader.load(\"sky.jpg\");\nscene.background = skyTexture;\n\
    ```\n\n- 加载天空贴理。\n\n### 4. 添加多个对象\n\n让我们创建一个包含多个对象的简单环境。\n\n```js\nfunction createTree(x,\
    \ z) {\n  const trunkGeometry = new THREE.CylinderGeometry(0.2, 0.2, 1);\n  const\
    \ trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });\n  const\
    \ trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);\n\n  const leavesGeometry\
    \ = new THREE.SphereGeometry(0.5);\n  const leavesMaterial = new THREE.MeshStandardMaterial({\
    \ color: 0x22bb22 });\n  const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);\n\
    \n  trunk.position.set(x, 0.5, z);\n  leaves.position.set(x, 1, z);\n\n  scene.add(trunk,\
    \ leaves);\n}\n\ncreateTree(2, 2);\ncreateTree(-2, -3);\n```\n\n- 使用圆柱和球体创建树。\n\
    - 将它们放置在不同的位置。\n\n## 13.4 在 3D 环境中实现物理\n\n在真实的 3D 游戏中，对象应该对重力、碰撞和力做出响应。`Three.js`\
    \ 不包含内置物理引擎，因此我们集成了外部库如 `Cannon.js` 或 `Ammo.js` 来来实现物理效果。\n\n"
- fmt: "\n# 1. Choosing a Physics Engine\n\n| Physics Engine | Best For |\n| :---\
    \ | :--- |\n| `Cannon.js` | Simple rigid body physics (falling objects, collisions)\
    \ |\n| `Ammo.js` | More advanced physics (soft bodies, joints, ragdoll effects)\
    \ |\n| `Oimo.js` | Lightweight physics for mobile games |\n\nFor this tutorial,\
    \ we will use `Cannon.js` as it is lightweight and easy to integrate.\n\n# 2.\
    \ Setting Up Cannon.js for Physics\n\n### Step 1: Install Cannon.js\n\nIf using\
    \ `npm`:\n\n```sh\nnpm install cannon-es\n```\n\nFor a CDN approach, include:\n\
    \n```html\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/cannon-es/0.19.0/cannon-es.min.js\"\
    ></script>\n```\n\n### Step 2: Initializing the Physics World\n\nIn `game.js`,\
    \ we create a `Cannon.js` physics world with gravity.\n\n```js\nimport * as CANNON\
    \ from 'cannon-es';\n\n// Create physics world\nconst physicsWorld = new CANNON.World();\n\
    physicsWorld.gravity.set(0, -9.8, 0); // Apply gravity\n```\n\n● ● This sets up\
    \ a physics simulation where objects fall downward.\n\n### Step 3: Creating a\
    \ Physics-Enabled Ground\n\nIn Three.js, we use `Mesh` objects, but in `Cannon.js`,\
    \ we use `Bodies`.\n\n```js\nconst groundBody = new CANNON.Body({\n  mass: 0,\
    \ // Static ground (no movement)\n  shape: new CANNON.Plane(),\n  position: new\
    \ CANNON.Vec3(0, 0, 0),\n});\nphysicsWorld.addBody(groundBody);\n```\n\n● ● The\
    \ ground remains fixed in place.\n\nTo match it with Three.js:\n\n```js\nconst\
    \ groundGeometry = new THREE.PlaneGeometry(20, 20);\nconst groundMaterial = new\
    \ THREE.MeshStandardMaterial({ color: 0x228B22 });\nconst groundMesh = new THREE.Mesh(groundGeometry,\
    \ groundMaterial);\ngroundMesh.rotation.x = -Math.PI / 2;\nscene.add(groundMesh);\n\
    ```\n\n● ● Now, the Three.js ground and physics body align.\n\n### Step 4: Adding\
    \ a Physics-Enabled Player\n\nWe create a physics body for the player.\n\n```js\n\
    const playerBody = new CANNON.Body({\n  mass: 5,\n  shape: new CANNON.Sphere(0.5),\n\
    \  position: new CANNON.Vec3(0, 3, 0), // Start above ground\n});\nphysicsWorld.addBody(playerBody);\n\
    ```\n\nAnd its Three.js representation:\n\n```js\nconst playerMesh = new THREE.Mesh(\n\
    \  new THREE.SphereGeometry(0.5),\n  new THREE.MeshStandardMaterial({ color: 0x0000ff\
    \ })\n);\nscene.add(playerMesh);\n```\n\n### Step 5: Updating the Physics World\n\
    \nWe update the physics simulation every frame.\n\n```js\nfunction updatePhysics()\
    \ {\n  physicsWorld.step(1 / 60); // Step the physics simulation\n  // Sync Three.js\
    \ objects with Cannon.js physics\n  playerMesh.position.copy(playerBody.position);\n\
    }\n\n// Update loop\nfunction animate() {\n  requestAnimationFrame(animate);\n\
    \  updatePhysics();\n  renderer.render(scene, camera);\n}\nanimate();\n```\n\n\
    ● ● The player now falls due to gravity.\n\n### Step 6: Implementing Collisions\n\
    \nWe detect collisions between objects.\n\n```js\nplayerBody.addEventListener(\"\
    collide\", (event) => {\n  console.log(\"Player collided with:\", event.body);\n\
    });\n```\n\n● ● Now, we can detect when the player hits the ground or obstacles.\n\
    \n### Step 7: Adding Player Controls\n\nTo move the player, we apply forces.\n\
    \n```js\ndocument.addEventListener(\"keydown\", (event) => {\n  if (event.key\
    \ === \"ArrowRight\") playerBody.velocity.x = 2;\n  if (event.key === \"ArrowLeft\"\
    ) playerBody.velocity.x = -2;\n  if (event.key === \"ArrowUp\") playerBody.velocity.z\
    \ = -2;\n  if (event.key === \"ArrowDown\") playerBody.velocity.z = 2;\n});\n\
    ```\n\n● ● Now, pressing arrow keys moves the player smoothly.\n\n# 13.5 Building\
    \ an Interactive 3D Game\n\nWith physics in place, we now create an interactive\
    \ 3D game.\n\n## 1. Game Objective\n\nThe player must:\n✔ Collect objects (coins,\
    \ power-ups)\n✔ Avoid obstacles (falling objects, barriers)\n✔ Reach the finish\
    \ line\n\n## 2. Creating Collectibles\n\nWe add collectible spheres for the player.\n\
    \n```js\nconst coins = [];\nfor (let i = 0; i < 5; i++) {\n  let coinBody = new\
    \ CANNON.Body({\n    mass: 0,\n    shape: new CANNON.Sphere(0.3),\n    position:\
    \ new CANNON.Vec3(Math.random() * 10 - 5, 1, Math.random() * 10 - 5),\n  });\n\
    \  physicsWorld.addBody(coinBody);\n  let coinMesh = new THREE.Mesh(\n    new\
    \ THREE.SphereGeometry(0.3),\n    new THREE.MeshStandardMaterial({ color: 0xffff00\
    \ })\n  );\n  scene.add(coinMesh);\n  coins.push({ body: coinBody, mesh: coinMesh\
    \ });\n}\n```\n\n● ● Creates multiple coins at random positions.\n\n### 3. Detecting\
    \ Coin Collection\n\nWhen the player collides with a coin, it disappears.\n\n\
    ```js\nfunction checkCoinCollection() {\n  coins.forEach((coin, index) => {\n\
    \    let distance = playerBody.position.distanceTo(coin.body.position);\n    if\
    \ (distance < 0.5) {\n      physicsWorld.removeBody(coin.body);\n      scene.remove(coin.mesh);\n\
    \      coins.splice(index, 1);\n      console.log(\"Coin collected!\");\n    }\n\
    \  });\n}\n```\n\n● ● Coins disappear when the player touches them.\n\n## 4. Adding\
    \ Obstacles\n\nTo add difficulty, we introduce moving obstacles.\n\n```js\nconst\
    \ obstacles = [];\nfor (let i = 0; i < 3; i++) {\n  let obstacleBody = new CANNON.Body({\n\
    \    mass: 1,\n    shape: new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)),\n  \
    \  position: new CANNON.Vec3(Math.random() * 8 - 4, 3, Math.random() * 8 - 4),\n\
    \  });\n  physicsWorld.addBody(obstacleBody);\n  let obstacleMesh = new THREE.Mesh(\n\
    \    new THREE.BoxGeometry(1, 1, 1),\n    new THREE.MeshStandardMaterial({ color:\
    \ 0xff0000 })\n  );\n  scene.add(obstacleMesh);\n  obstacles.push({ body: obstacleBody,\
    \ mesh: obstacleMesh });\n}\n```\n\n● ● Obstacles move downward due to gravity.\n\
    \n## 5. Creating a Finish Line\n\nThe player wins when they reach a target zone.\n\
    \n```js\nconst finishLine = new THREE.Mesh(\n  new THREE.BoxGeometry(2, 0.2, 2),\n\
    \  new THREE.MeshStandardMaterial({ color: 0x00ff00 })\n);\nfinishLine.position.set(0,\
    \ 0.1, -8);\nscene.add(finishLine);\n```\n\nChecking if the player reaches it:\n\
    \n```js\nfunction checkWinCondition() {\n  if (playerBody.position.z < -7.5) {\n\
    \    alert(\"You win!\");\n    location.reload();\n  }\n}\n```\n\n● ● When the\
    \ player enters the finish zone, the game ends.\n\n## 6. Running the Game Loop\n\
    \n```js\nfunction updatePhysics() {\n  physicsWorld.step(1 / 60); // Step the\
    \ physics simulation\n  // Sync Three.js objects with Cannon.js physics\n  playerMesh.position.copy(playerBody.position);\n\
    }\n\nfunction animate() {\n  requestAnimationFrame(animate);\n  updatePhysics();\n\
    \  renderer.render(scene, camera);\n}\nanimate();\n```\n\n● ● This loop updates\
    \ all objects in real time.\n"
  raw: '## 1\. Choosing a Physics Engine


    | Physics Engine | Best For |


    | Cannon.js | Simple rigid body physics (falling objects, collisions) |


    | Ammo.js | More advanced physics (soft bodies, joints, ragdoll effects) |


    | Oimo.js | Lightweight physics for mobile games |


    For this tutorial, we will use Cannon.js  as it is lightweight and easy to integrate
    .


    ## 2\. Setting Up Cannon.js for Physics


    ### Step 1: Install Cannon.js


    If using npm:


    sh


    CopyEdit


    npm install cannon-es


    For a CDN approach, include:


    html


    CopyEdit


    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon-es/0.19.0/cannon-es.min.js"></script>


    ### Step 2: Initializing the Physics World


    In game.js , we create a Cannon.js physics world  with gravity.


    js


    CopyEdit


    import * as CANNON from ''cannon-es'';


    // Create physics world


    const physicsWorld = new CANNON.World();


    physicsWorld.gravity.set(0, -9.8, 0); // Apply gravity


    ​● ​ This sets up a physics simulation where objects fall downward .


    ### Step 3: Creating a Physics-Enabled Ground


    In Three.js, we use Mesh objects , but in Cannon.js, we use Bodies .


    js


    CopyEdit


    const groundBody = new CANNON.Body({


    mass: 0, // Static ground (no movement)


    shape: new CANNON.Plane(),


    position: new CANNON.Vec3(0, 0, 0),


    });


    physicsWorld.addBody(groundBody);


    ​● ​ The ground remains fixed in place .


    To match it with Three.js:


    js


    CopyEdit


    const groundGeometry = new THREE.PlaneGeometry(20, 20);


    const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });


    const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);


    groundMesh.rotation.x = -Math.PI / 2;


    scene.add(groundMesh);


    ​● ​ Now, the Three.js ground and physics body align .


    ### Step 4: Adding a Physics-Enabled Player


    We create a physics body  for the player.


    js


    CopyEdit


    const playerBody = new CANNON.Body({


    mass: 5,


    shape: new CANNON.Sphere(0.5),


    position: new CANNON.Vec3(0, 3, 0), // Start above ground


    });


    physicsWorld.addBody(playerBody);


    And its Three.js representation:


    js


    CopyEdit


    const playerMesh = new THREE.Mesh(


    new THREE.SphereGeometry(0.5),


    new THREE.MeshStandardMaterial({ color: 0x0000ff })


    );


    scene.add(playerMesh);


    ### Step 5: Updating the Physics World


    We update the physics simulation every frame .


    js


    CopyEdit


    function updatePhysics() {


    physicsWorld.step(1 / 60); // Step the physics simulation


    // Sync Three.js objects with Cannon.js physics


    playerMesh.position.copy(playerBody.position);


    }


    // Update loop


    function animate() {


    requestAnimationFrame(animate);


    updatePhysics();


    renderer.render(scene, camera);


    }


    animate();


    ​● ​ The player now falls due to gravity .


    ### Step 6: Implementing Collisions


    We detect collisions between objects .


    js


    CopyEdit


    playerBody.addEventListener("collide", (event) => {


    console.log("Player collided with:", event.body);


    });


    ​● ​ Now, we can detect when the player hits the ground or obstacles .


    ### Step 7: Adding Player Controls


    To move the player , we apply forces .


    js


    CopyEdit


    document.addEventListener("keydown", (event) => {


    if (event.key === "ArrowRight") playerBody.velocity.x = 2;


    if (event.key === "ArrowLeft") playerBody.velocity.x = -2;


    if (event.key === "ArrowUp") playerBody.velocity.z = -2;


    if (event.key === "ArrowDown") playerBody.velocity.z = 2;


    });


    ​● ​ Now, pressing arrow keys moves the player smoothly .


    # 13.5 Building an Interactive 3D Game


    With physics in place, we now create an interactive 3D game .


    ## 1\. Game Objective


    The player must: ✔ Collect objects (coins, power-ups) ✔ Avoid obstacles (falling
    objects, barriers) ✔ Reach the finish line


    ## 2\. Creating Collectibles


    We add collectible spheres  for the player.


    js


    CopyEdit


    const coins = [];


    for (let i = 0; i < 5; i++) {


    let coinBody = new CANNON.Body({


    mass: 0,


    shape: new CANNON.Sphere(0.3),


    position: new CANNON.Vec3(Math.random() * 10 - 5, 1, Math.random() * 10 - 5),


    });


    physicsWorld.addBody(coinBody);


    let coinMesh = new THREE.Mesh(


    new THREE.SphereGeometry(0.3),


    new THREE.MeshStandardMaterial({ color: 0xffff00 })


    );


    scene.add(coinMesh);


    coins.push({ body: coinBody, mesh: coinMesh });


    }


    ​● ​ Creates multiple coins at random positions .


    ### 3\. Detecting Coin Collection


    When the player collides with a coin, it disappears.


    js


    CopyEdit


    function checkCoinCollection() {


    coins.forEach((coin, index) => {


    let distance = playerBody.position.distanceTo(coin.body.position);


    if (distance < 0.5) {


    physicsWorld.removeBody(coin.body);


    scene.remove(coin.mesh);


    coins.splice(index, 1);


    console.log("Coin collected!");


    }


    });


    }


    ​● ​ Coins disappear when the player touches them .


    ## 4\. Adding Obstacles


    To add difficulty, we introduce moving obstacles .


    js


    CopyEdit


    const obstacles = [];


    for (let i = 0; i < 3; i++) {


    let obstacleBody = new CANNON.Body({


    mass: 1,


    shape: new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)),


    position: new CANNON.Vec3(Math.random() * 8 - 4, 3, Math.random() * 8 - 4),


    });


    physicsWorld.addBody(obstacleBody);


    let obstacleMesh = new THREE.Mesh(


    new THREE.BoxGeometry(1, 1, 1),


    new THREE.MeshStandardMaterial({ color: 0xff0000 })


    );


    scene.add(obstacleMesh);


    obstacles.push({ body: obstacleBody, mesh: obstacleMesh });


    }


    ​● ​ Obstacles move downward due to gravity .


    ## 5\. Creating a Finish Line


    The player wins when they reach a target zone .


    js


    CopyEdit


    const finishLine = new THREE.Mesh(


    new THREE.BoxGeometry(2, 0.2, 2),


    new THREE.MeshStandardMaterial({ color: 0x00ff00 })


    );


    finishLine.position.set(0, 0.1, -8);


    scene.add(finishLine);


    Checking if the player reaches it:


    js


    CopyEdit


    function checkWinCondition() {


    if (playerBody.position.z < -7.5) {


    alert("You win!");


    location.reload();


    }


    }


    ​● ​ When the player enters the finish zone, the game ends .


    ## 6\. Running the Full Game Loop


    js


    CopyEdit


    function updatePhysics() {


    physicsWorld.step(1 / 60);


    playerMesh.position.copy(playerBody.position);


    coins.forEach(coin => coin.mesh.position.copy(coin.body.position));


    obstacles.forEach(obstacle => obstacle.mesh.position.copy(obstacle.body.position));


    checkCoinCollection();


    checkWinCondition();


    }


    function animate() {


    requestAnimationFrame(animate);


    updatePhysics();


    renderer.render(scene, camera);


    }


    animate();


    ​● ​ This loop updates all objects in real time .


    In this section, we built: ✔ Physics-based movement using Cannon.js ✔ A 3D game
    with collectibles, obstacles, and a finish line ✔ Collision detection for game
    interactions


    This is the foundation for advanced 3D games , including platformers, adventure
    games, and multiplayer battle arenas .


    In the next chapter, we will optimize performance and improve visuals to enhance
    the gaming experience!


    # Chapter 14


    # Game Deployment and Monetization


    Once a JavaScript game is developed, it needs to be packaged, deployed, and monetized
     to reach players worldwide. Whether you''re making a browser-based game, a downloadable
    desktop game, or a mobile app , proper deployment ensures players can access and
    enjoy  your game easily.


    In this chapter, we will cover: ✔ Packaging JavaScript games for different platforms
    ✔ Hosting games online using GitHub Pages, Netlify, or Firebase


    ## 14.1 Packaging JavaScript Games for Different Platforms


    JavaScript games can be deployed on multiple platforms:


    ​● ​ Web browsers  (playable on Chrome, Firefox, Edge, Safari)


    ​● ​ Desktop apps  (Windows, macOS, Linux)


    ​● ​ Mobile apps  (Android, iOS)


    ​● ​ Progressive Web Apps (PWAs)


    Each platform requires different packaging techniques .


    ### 1\. Packaging Games for Web Browsers


    Most JavaScript games  run in the browser, making web deployment  the easiest
    approach.


    #### Steps for Packaging a Web Game


    ​1\. ​ Organize your game files


    ​○ ​ Store all HTML, JavaScript, CSS, images, and assets  in a single folder.


    Example structure:


    bash


    CopyEdit


    /my-game


    ├── index.html  (Main game file)


    ├── game.js  (Game logic)


    ├── assets/  (Images, sounds, etc.)


    ├── styles.css  (CSS for UI)


    ​○ ​'
