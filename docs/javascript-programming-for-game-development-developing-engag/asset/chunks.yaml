    本章将探索游戏物理基础，并在基于 JavaScript 的 2D 游戏中实现重力、摩擦力，以及速度与加速度机制。\n\n## 4.1 理解游戏物理基础\n\n\
    游戏物理是指控制物体在游戏世界中移动和交互的数学原理。在 2D JavaScript 游戏中，物理被用于模拟真实世界的行为，如：\n\n- **重力**（将物体向下拉）\n\
