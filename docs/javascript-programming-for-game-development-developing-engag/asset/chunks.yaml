    \ {\n  enemy.remove();\n}\n```\n\n- ● 在不再需要时删除对象。\n\n### B. 移除元素时清除事件监听器\n\n如果对象使用了事件监听器，请在删除前移除它们。\n\
    \n#### 示例：移除事件监听器\n\n```js\nfunction removeButton(button) {\n  button.removeEventListener(\"\
    click\", handleClick);\n  button.remove();\n}\n```\n\n- ● 防止由残留事件监听器引起的内存泄漏。\n\
    \n## 2. 减少垃圾回收暂停\n\n垃圾回收（GC）会导致突然掉帧。通过以下方式减少 GC 暂停：复用对象而不是创建新对象；使用类型数组（`Float32Array`）获得更好的性能；在循环内部避免不必要的变量分配。\n\
    \n#### 示例：对象池\n\n不要重复创建新对象，而是复用现有对象。\n\n```js\nconst enemyPool = [];\nfunction\
