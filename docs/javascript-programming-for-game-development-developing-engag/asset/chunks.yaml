    \ = this.add.image(400, 350, \"startButton\").setInteractive();\n    startButton.on(\"\
    pointerdown\", () => {\n      this.scene.start(\"GameScene\");\n    });\n  }\n\
    }\n```\n\n显示背景和开始按钮。点击时，游戏开始。\n\n### B. 更新游戏配置\n\n现在，在主游戏场景之前注册 `MenuScene`。\n\
    \n```js\nconst config = {\n  type: Phaser.AUTO,\n  width: 800,\n  height: 600,\n\
    \  physics: {\n    default: \"arcade\",\n    arcade: { gravity: { y: 300 }, debug:\
    \ false }\n  },\n  scene: [MenuScene, GameScene]\n};\nconst game = new Phaser.Game(config);\n\
    ```\n\n确保菜单先加载。\n\n## 2. 添加 HUD (抬头显示器)\n\nHUD 将显示分数、血量和关卡编号。\n\n### A. 显示分数和血量\n\
    \n修改 `GameScene` 中的 `create` 函数。\n\n```js\nthis.score = 0;\nthis.health = 3;\n\
    this.scoreText = this.add.text(16, 16, \"Score: 0\", { fontSize: \"20px\", fill:\
    \ \"#fff\" });\nthis.healthText = this.add.text(16, 40, \"Health: 3\", { fontSize:\
    \ \"20px\", fill: \"#fff\" });\n```\n\n用于分数和血量更新文本 UI。\n\n### B. 更新 HUD\n\n修改\
    \ `collectCoin` 函数。\n\n```js\nfunction collectCoin(player, coin) {\n  coin.disableBody(true,\
    \ true);\n  this.score += 10;\n  this.scoreText.setText(\"Score: \" + this.score);\n\
    }\n```\n\n✔ 实时更新分数。\n\n修改 `playerHit` 函数。\n\n```js\nfunction playerHit(player,\
    \ enemy) {\n  this.health -= 1;\n  this.healthText.setText(\"Health: \" + this.health);\n\
    \  if (this.health <= 0) {\n    this.scene.start(\"GameOverScene\");\n  }\n}\n\
    ```\n\n当血量达到 0 时，游戏结束。\n\n## 3. 添加暂停界面\n\n为了暂停游戏，我们检测玩家按下 \"P\"键。\n\n```js\nthis.input.keyboard.on(\"\
    keydown-P\", () => {\n  this.scene.pause();\n  this.scene.launch(\"PauseScene\"\
    );\n});\n```\n\n### 创建暂停场景\n\n```js\nclass PauseScene extends Phaser.Scene {\n\
    \  constructor() {\n    super({ key: \"PauseScene\" });\n  }\n  create() {\n \
    \   let resumeButton = this.add.text(300, 250, \"Resume\", { fontSize: \"30px\"\
    , fill: \"#fff\" }).setInteractive();\n    resumeButton.on(\"pointerdown\", ()\
    \ => {\n      this.scene.stop();\n      this.scene.resume(\"GameScene\");\n  \
    \  });\n  }\n}\n```\n\n允许玩家暂停和恢复游戏。\n\n## 4. 添加声音和视觉效果\n\n### A. 加载音效\n\n在 `preload`\
    \ 函数中：\n\n```js\nthis.load.audio(\"jumpSound\", \"jump.wav\");\nthis.load.audio(\"\
    coinSound\", \"coin.wav\");\nthis.load.audio(\"hitSound\", \"hit.wav\");\n```\n\
    \n### B. 在动作时播放声音\n\n修改函数以播放声音。\n\n```js\nfunction collectCoin(player, coin) {\n\
