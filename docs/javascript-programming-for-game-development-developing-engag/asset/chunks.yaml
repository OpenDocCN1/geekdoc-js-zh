    # 9.5 Scoring System, Health, and Win/Lose Conditions


    To complete the game, we need:   A scoring system   Health mechanics (player loses
    health on damage)   A win condition (reaching the exit)


    ## 1. Implementing a Score System


    The player should earn points by collecting coins .


    ### Step 1: Tracking the Score


    js


    CopyEdit


    let score = 0;


    function drawScore() {


    ctx.fillStyle = "white";


    ctx.font = "20px Arial";


    ctx.fillText("Score: " + score, 20, 30);


