    \ (VR) and augmented reality (AR) 3D simulations and interactive environments\n\
    \n`Three.js` is the best choice for high-performance 3D web games.\n\nIn this\
    \ chapter, we explored:\n✔ `Phaser.js` for 2D game development\n✔ `Three.js` for\
    \ 3D graphics and game development\n✔ How to set up and build simple games in\
    \ both frameworks\n\nBy choosing the right framework, developers can create engaging,\
    \ high-performance games for browsers and mobile devices.\n\nIn the next chapter,\
    \ we will optimize game performance and reduce lag for smoother gameplay!\n\n\
    # Chapter 13\n\n# Creating a 3D Game with Three.js\n\n`Three.js` is a powerful\
    \ JavaScript library that enables 3D game development in the browser. It is built\
    \ on top of `WebGL`, allowing developers to create interactive 3D environments,\
    \ physics-based gameplay, and high-performance graphics.\n\nIn this chapter, we\
    \ will:\n\n✔ Understand `WebGL` and `Three.js` fundamentals\n✔ Set up a basic\
    \ 3D scene with `Three.js`\n✔ Add lighting, cameras, and objects to create a dynamic\
    \ game world\n\n## 13.1 Introduction to WebGL and Three.js\n\n### 1. What is WebGL?\n\
    \n`WebGL` (Web Graphics Library) is a low-level API for rendering 3D graphics\
    \ in browsers. It allows developers to create interactive 3D applications without\
    \ needing external plugins.\n\n- Runs directly in the browser\n- Uses GPU acceleration\
    \ for high performance\n- Based on `OpenGL ES`, a popular graphics standard\n\n\
    ### 2. Why Use Three.js Instead of Raw WebGL?\n\nWriting raw `WebGL` code can\
    \ be complex and time-consuming, requiring knowledge of shaders, buffers, and\
    \ low-level rendering techniques.\n\n`Three.js` simplifies 3D development by handling:\n\
    \n- Scene creation and object management\n- Lighting and materials\n- Cameras\
    \ and perspective handling\n- 3D model loading (`GLTF`, `FBX`, `OBJ`, etc.)\n\n\
    ### 3. Installing Three.js\n\nYou can install `Three.js` using either a CDN or\
    \ `npm`.\n\n#### CDN Method (Recommended for Beginners)\n\n```html\n<script src=\"\
    https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"></script>\n\
    ```\n\n#### NPM Installation (For Advanced Users)\n\n```sh\nnpm install three\n\
    ```\n\n## 13.2 Setting Up a 3D Scene with Three.js\n\nA `Three.js` scene consists\
    \ of:\n\n- A `Scene`: The container that holds all objects\n- A `Camera`: Defines\
    \ the player's view of the 3D world\n- A `Renderer`: Draws everything on the screen\n\
    \n### 1. Initializing a Three.js Scene\n\nCreate an HTML file and include the\
    \ `Three.js` CDN.\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta\
    \ charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n<title>3D Game with Three.js</title>\n<style>\nbody { margin: 0; overflow:\
    \ hidden; }\ncanvas { display: block; }\n</style>\n</head>\n<body>\n<script src=\"\
    https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"></script>\n\
    <script src=\"game.js\"></script>\n</body>\n</html>\n```\n\n### 2. Creating a\
    \ Basic 3D Scene (game.js)\n\n```js\n// Create a scene\nconst scene = new THREE.Scene();\n\
    \n// Create a camera\nconst camera = new THREE.PerspectiveCamera(75, window.innerWidth\
    \ / window.innerHeight, 0.1, 1000);\ncamera.position.z = 5;\n\n// Create a renderer\n\
    const renderer = new THREE.WebGLRenderer();\nrenderer.setSize(window.innerWidth,\
    \ window.innerHeight);\ndocument.body.appendChild(renderer.domElement);\n```\n\
    \n- Creates a 3D world (`scene`).\n- Adds a perspective camera for depth perception.\n\
    - Creates a renderer that outputs the graphics to the screen.\n\n### 3. Adding\
    \ a 3D Object\n\nWe can add a simple cube to the scene.\n\n```js\n// Create a\
    \ cube\nconst geometry = new THREE.BoxGeometry();\nconst material = new THREE.MeshBasicMaterial({\
    \ color: 0x00ff00 });\nconst cube = new THREE.Mesh(geometry, material);\n\n//\
    \ Add the cube to the scene\nscene.add(cube);\n```\n\n- Creates a green cube using\
    \ `BoxGeometry`.\n- `MeshBasicMaterial` defines its color.\n- Adds the cube to\
    \ the scene.\n\n### 4. Animating the Cube\n\nTo rotate the cube continuously,\
    \ we use a game loop.\n\n```js\nfunction animate() {\n  requestAnimationFrame(animate);\n\
    \  // Rotate the cube\n  cube.rotation.x += 0.01;\n  cube.rotation.y += 0.01;\n\
    \  renderer.render(scene, camera);\n}\nanimate();\n```\n\n- `requestAnimationFrame(animate)`\
    \ ensures smooth animations.\n- Updates the cube’s rotation on every frame.\n\n\
    ### 5. Resizing the Window\n\nWe should update the renderer if the window resizes.\n\
    \n```js\nwindow.addEventListener(\"resize\", () => {\n  camera.aspect = window.innerWidth\
    \ / window.innerHeight;\n  camera.updateProjectionMatrix();\n  renderer.setSize(window.innerWidth,\
    \ window.innerHeight);\n});\n```\n\n## 13.3 Adding Lights, Cameras, and Objects\n\
    \nTo make our 3D scene more realistic, we need:\n- Lighting\n- Camera setup\n\
    - Interactive elements\n\n### 1. Adding Lights\n\nWithout lighting, 3D objects\
    \ appear flat.\n\n#### Example: Adding Directional Light\n\n```js\nconst light\
    \ = new THREE.DirectionalLight(0xffffff, 1);\nlight.position.set(5, 5, 5);\nscene.add(light);\n\
    ```\n\n- `DirectionalLight` simulates sunlight.\n\n#### Example: Adding Ambient\
    \ Light\n\n```js\nconst ambientLight = new THREE.AmbientLight(0x404040);\nscene.add(ambientLight);\n\
    ```\n\n- `AmbientLight` provides overall brightness.\n\n### 2. Using Camera (OrbitControls)\n\
    \nBy default, the camera stays fixed. We can add camera controls using `OrbitControls`.\n\
    \n#### Step 1: Install OrbitControls (For NPM)\n\n```sh\nnpm install three/examples/jsm/controls/OrbitControls.js\n\
    ```\n\n#### Step 2: Add Camera Controls\n\n```js\nconst controls = new THREE.OrbitControls(camera,\
    \ renderer.domElement);\ncontrols.enableDamping = true;\n```\n\n- Allows users\
    \ to move the camera freely.\n\n### 3. Adding Ground and Sky\n\nTo make the scene\
    \ feel more realistic, let’s add a ground plane and a sky.\n\n#### Example: Adding\
    \ Ground Plane\n\n```js\nconst groundGeometry = new THREE.PlaneGeometry(20, 20);\n\
    const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x22bb22 });\n\
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);\nground.rotation.x\
    \ = -Math.PI / 2;\nscene.add(ground);\n```\n\n- Creates a green ground plane.\n\
    - Rotates it flat on the X-axis.\n\n#### Example: Adding Sky\n\n```js\nconst loader\
    \ = new THREE.TextureLoader();\nconst skyTexture = loader.load(\"sky.jpg\");\n\
    scene.background = skyTexture;\n```\n\n- Loads a sky texture.\n\n### 4. Adding\
    \ Multiple Objects\n\nLet’s create a simple environment with multiple objects.\n\
    \n```js\nfunction createTree(x, z) {\n  const trunkGeometry = new THREE.CylinderGeometry(0.2,\
    \ 0.2, 1);\n  const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513\
    \ });\n  const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);\n\n  const\
    \ leavesGeometry = new THREE.SphereGeometry(0.5);\n  const leavesMaterial = new\
    \ THREE.MeshStandardMaterial({ color: 0x22bb22 });\n  const leaves = new THREE.Mesh(leavesGeometry,\
    \ leavesMaterial);\n\n  trunk.position.set(x, 0.5, z);\n  leaves.position.set(x,\
    \ 1, z);\n\n  scene.add(trunk, leaves);\n}\n\ncreateTree(2, 2);\ncreateTree(-2,\
    \ -3);\n```\n\n- Creates trees using cylinders and spheres.\n- Places them at\
    \ different positions.\n\n## 13.4 Implementing Physics in 3D Environments\n\n\
    In a realistic 3D game, objects should respond to gravity, collisions, and forces.\
    \ `Three.js` does not include a built-in physics engine, so we integrate external\
    \ libraries like `Cannon.js` or `Ammo.js` for realistic physics.\n"
