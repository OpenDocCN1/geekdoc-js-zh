    # Chapter 3


    # The HTML5 Canvas API for 2D Games


    The HTML5 Canvas API  is one of the most powerful tools available for JavaScript
    game development . It enables developers to create high-performance, interactive
    2D games  directly within the browser without relying on third-party plugins.
    Unlike traditional DOM-based elements, the Canvas API  provides direct pixel manipulation,
    making it ideal for rendering game objects, handling animations, and managing
    real-time graphics.


    In this chapter, we will explore the fundamentals of the Canvas API , including
    how to draw shapes and objects , which serve as the foundation for 2D game development.


    3.1 What is the Canvas API?


    The Canvas API  is an HTML5 feature that allows JavaScript developers to draw
    and manipulate graphics on a web page dynamically . It provides a blank surface
    (canvas) where developers can render 2D images, shapes, animations, and even interactive
    gameplay elements.


    ### Key Features of the Canvas API


    ​● ​ Direct Pixel Manipulation : Unlike traditional DOM elements, the canvas operates
    at the pixel level, enabling precise graphics control.


    ​● ​ Performance-Oriented : The canvas is hardware-accelerated, making it ideal
    for fast-moving graphics.


    ​● ​ Animation Capabilities : Allows developers to create smooth animations using
    requestAnimationFrame() .


    ​● ​ Support for Images and Text : Developers can draw images, text, and complex
    visual elements dynamically.


    ​● ​ Event Handling : Works alongside JavaScript event listeners to detect player
    input (mouse, keyboard, touch).


    ### Setting Up the Canvas Element


    To use the Canvas API , we first need to create a <canvas>  element in the HTML
    document.


    #### Basic HTML Canvas Setup


    html


    CopyEdit


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Canvas Example</title>


    </head>


    <body>


    <canvas id="gameCanvas" width="800" height="600"></canvas>


    <script src="game.js"></script>


    </body>


    </html>


    ​● ​ The <canvas>  element defines the drawing area  (800px by 600px).


    ​● ​ The id="gameCanvas"  helps target  the canvas in JavaScript.


    ​● ​ The <script>  tag loads the game logic  from game.js .


    ### Accessing the Canvas with JavaScript


    To start drawing on the canvas, we need to obtain its drawing context  using JavaScript.


    js


    CopyEdit


    // Select the canvas element


    const canvas = document.getElementById("gameCanvas");


    // Get the 2D rendering context


    const ctx = canvas.getContext("2d");


    ​● ​ canvas.getContext("2d")  returns a 2D rendering context , which provides
    methods for drawing shapes, text, and images.


