    \ |\n| 碰撞检测 | 检查物体是否相互接触。 |\n\n***\n\n## 4.2 在游戏中实现重力和摩擦力\n\n### 在 JavaScript\
    \ 中模拟重力\n\n重力是向下拉动物体的力。在游戏中，它通过不断增加物体的垂直速度（y 轴）来实现。\n\n#### 基础重力公式\n\n```makefile\n\
    velocityY += gravity;\npositionY += velocityY;\n```\n\n- `velocityY` 因为重力而随时间增加。\n\
    - `positionY` 根据速度更新。\n\n### 示例：对掉落物体应用重力\n\n```js\nconst canvas = document.getElementById(\"\
    gameCanvas\");\nconst ctx = canvas.getContext(\"2d\");\nlet player = {\n  x: 100,\n\
    \  y: 50,\n  width: 50,\n  height: 50,\n  velocityY: 0, // 垂直速度\n  gravity: 0.5,\
    \ // 模拟重力值\n  jumpStrength: -10, // 跳跃时的向上力\n  onGround: false\n};\n\nfunction\
    \ update() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height); // 清除画布\n  //\
    \ 应用重力\n  if (!player.onGround) {\n    player.velocityY += player.gravity;\n \
    \ }\n  player.y += player.velocityY;\n  // 碰撞地面\n  if (player.y + player.height\
    \ >= canvas.height) {\n    player.y = canvas.height - player.height; // 设置位置到地面\n\
    \    player.velocityY = 0;\n    player.onGround = true;\n  }\n  // 绘制玩家\n  ctx.fillStyle\
    \ = \"blue\";\n  ctx.fillRect(player.x, player.y, player.width, player.height);\n\
    \  requestAnimationFrame(update);\n}\n\nupdate();\n```\n\n- 玩家自然地掉落直到碰到地面。\n-\
    \ 重力仅在玩家处于空中时应用。\n\n### 跳跃机制\n\n为了允许跳跃，我们在玩家按下按键时设置一个负速度。\n\n```js\ndocument.addEventListener(\"\
    keydown\", function(event) {\n  if (event.key === \" \" && player.onGround) {\n\
    \    player.velocityY = player.jumpStrength;\n    player.onGround = false; //\
    \ 现在在空中\n  }\n});\n```\n\n现在，当玩家按下空格键时，他们会向上。\n\n## 摩擦力：减慢移动\n\n摩擦力是物体移动的阻力。它应用于水平移动以模拟自然停止。\n\
    \n#### 基础摩擦力公式\n\n```nginx\nvelocityX *= friction;\n```\n\n- 摩擦力随时间逐渐减少速度。\n\n\
    ### 示例：实现摩擦力\n\n```js\nlet player = {\n  x: 50,\n  y: 250,\n  width: 50,\n  height:\
    \ 50,\n  velocityX: 5, // 水平速度\n  friction: 0.9 // 减速\n};\n\nfunction update()\
    \ {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  // 应用摩擦力\n  player.velocityX\
    \ *= player.friction;\n  player.x += player.velocityX;\n  // 绘制玩家\n  ctx.fillStyle\
    \ = \"red\";\n  ctx.fillRect(player.x, player.y, player.width, player.height);\n\
    \  requestAnimationFrame(update);\n}\n\nupdate();\n```\n\n现在，当移动停止时，玩家会逐渐减慢而不是立即停止。\n\
    \n## 4.3 速度与加速度机制\n\n### 什么是速度？\n\n速度决定物体在特定方向上移动的快慢。它在每一帧中实时更新。\n\n#### 基础速度公式\n\
    \n```arduino\nposition += velocity;\n```\n\n- `velocityX` 控制水平移动。\n- `velocityY`\
    \ 控制垂直移动。\n\n### 示例：使用速度移动物体\n\n```js\nlet ball = { x: 50, y: 50, velocityX: 2,\
    \ velocityY: 3 };\nfunction update() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n\
