    \ 1. 防止内存泄漏\n\n### A. 移除未使用的游戏对象\n\n当不再需要时，应从内存中删除对象。\n\n#### 错误示例（未移除对象）\n\n\
    ```js\nfunction createEnemy() {\n  let enemy = document.createElement(\"div\"\
