    # 1.5 Introduction to the HTML5 Canvas API


    The `HTML5 Canvas API` is a powerful graphics rendering tool that allows developers
    to draw, animate, and manipulate images directly on a webpage using JavaScript.
    It is widely used in 2D game development due to its flexibility, high performance,
    and direct control over pixels.


    ## What is the HTML5 Canvas API?


    The `Canvas API` provides a drawing surface (`canvas` element) where developers
    can render graphics, animations, and game elements programmatically using JavaScript.


    ### Basic Structure of an HTML5 Canvas


    To use the `Canvas API`, developers need to add a `<canvas>` element to their
    HTML file and manipulate it with JavaScript.


    #### Example: Setting Up a Canvas


    ```html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canvas Example</title>

    </head>

    <body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script src="game.js"></script>

    </body>

    </html>

    ```


    #### JavaScript Code to Draw on the Canvas


    ```js

    const canvas = document.getElementById("gameCanvas");

    const ctx = canvas.getContext("2d");

    // Draw a red rectangle

    ctx.fillStyle = "red";

    ctx.fillRect(50, 50, 200, 100);

    ```


    This code initializes a `canvas` and draws a red rectangle on it.


    ## Canvas API Methods for Game Development


    The `Canvas API` provides several methods for drawing shapes, handling images,
    and animating elements.


    ### 1. Drawing Basic Shapes


    | Method | Description |

    | :--- | :--- |

    | `fillRect(x, y, width, height)` | Draws a filled rectangle |

    | `strokeRect(x, y, width, height)` | Draws an outlined rectangle |

    | `clearRect(x, y, width, height)` | Clears a specific area of the canvas |


    #### Example: Drawing Multiple Shapes


    ```js

    ctx.fillStyle = "blue";

    ctx.fillRect(100, 100, 150, 75);

    ctx.strokeStyle = "black";

    ctx.strokeRect(300, 200, 100, 50);

    ```


    ### 2. Drawing Circles and Lines


    | Method |

    | :--- |

    | `beginPath()` |

    | `arc(x, y, radius, startAngle, endAngle)` |

    | `stroke()` |

    | `fill()` |


    #### Example: Drawing a Circle


    ```js

    ctx.beginPath();

    ctx.arc(200, 200, 50, 0, Math.PI * 2);

    ctx.fillStyle = "green";

    ctx.fill();

    ```


    ### 3. Adding Images to the Canvas


    To enhance games with sprites and backgrounds, images can be drawn onto the canvas.


    #### Example: Loading and Drawing an Image


    ```js

    const img = new Image();

    img.src = "character.png"; // Replace with the actual image path

    img.onload = function() {

    ctx.drawImage(img, 100, 100, 50, 50);

    };

    ```


    ### 4. Handling Animations


    To create smooth game animations, developers use the `requestAnimationFrame()`
    function to update the game loop efficiently.


    #### Example: Simple Animation


    ```js

    let x = 0;

    function animate() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillRect(x, 100, 50, 50);

    x += 2; // Move rectangle

    requestAnimationFrame(animate);

    }

    animate();

    ```


    This function continuously updates the position of the rectangle, creating an
    animation.


    By mastering the `HTML5 Canvas API`, developers can create dynamic 2D games with
    smooth animations, interactive elements, and high-performance rendering. The next
    chapter will cover game physics and movement, laying the groundwork for building
    interactive game mechanics.


