    \ variable\nfunction startGame() {\n  console.log(\"Welcome to\", gameName);\n\
    }\nstartGame();\n```\n\n#### 2. Local Scope (Function Scope)\n\nVariables declared\
    \ inside functions are only accessible within that function.\n\n```js\nfunction\
    \ increaseScore() {\n  let points = 10; // Local variable\n  console.log(\"Score\
