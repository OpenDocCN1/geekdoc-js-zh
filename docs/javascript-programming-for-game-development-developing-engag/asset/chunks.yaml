    ArrowRight\"]) {\n    console.log(\"Moving right\");\n  }\n  requestAnimationFrame(updatePlayerMovement);\n\
    }\n\nupdatePlayerMovement();\n```\n\n## Handling Mouse Input in Games\n\nMouse\
    \ input is useful for aiming, shooting, clicking UI elements, and selecting game\
    \ objects.\n\n### Detecting Mouse Clicks\n\n```js\ndocument.addEventListener(\"\
    mousedown\", function(event) {\n  console.log(`Mouse clicked at (${event.clientX},\
    \ ${event.clientY})`);\n});\n```\n\n### Tracking Mouse Movement\n\n```js\ndocument.addEventListener(\"\
    mousemove\", function(event) {\n  console.log(`Mouse moved to (${event.clientX},\
    \ ${event.clientY})`);\n});\n```\n\n### Creating a Shooting Mechanic\n\n```js\n\
    document.addEventListener(\"click\", function(event) {\n  let bullet = { x: event.clientX,\
    \ y: event.clientY };\n  console.log(\"Bullet fired at\", bullet);\n});\n```\n\
    \n## Handling Touch Input for Mobile Games\n\nOn touch-enabled devices, we replace\
    \ `mousedown` and `mousemove` with `touchstart` and `touchmove`.\n\n### Detecting\
    \ a Tap\n\n```js\ndocument.addEventListener(\"touchstart\", function(event) {\n\
    \  console.log(\"Screen touched at\", event.touches[0].clientX, event.touches[0].clientY);\n\
    });\n```\n\n### Handling Swipes (Left, Right, Up, Down)\n\n```js\nlet startX,\
    \ startY;\n\ndocument.addEventListener(\"touchstart\", function(event) {\n  startX\
    \ = event.touches[0].clientX;\n  startY = event.touches[0].clientY;\n});\n\ndocument.addEventListener(\"\
