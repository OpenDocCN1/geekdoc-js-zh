    );\n    });\n  }\n}\n```\n\n玩家在失败后可以重新开始。\n\n## 2. 为 Web 打包\n\n### A. 压缩 JavaScript\
    \ 以加速\n\n使用 `Terser` 减小文件大小。\n\n```\nnpx terser game.js -o game.js\n```\n\n###\
