    ## Installing Node.js and npm


    While `Node.js` is not required for browser-based games, it is beneficial for
    managing JavaScript libraries and dependencies. `npm` (Node Package Manager) allows
    developers to install, update, and manage game development libraries efficiently.


    ### Steps to Install Node.js and npm


    1. Download `Node.js` from the official website: `https://nodejs.org`

    2. Install it on your system (`npm` is included in the installation).


    Open a terminal and check the installation:


    ```sh

    node -v

    npm -v

    ```


    3.

    4. If the installation is successful, the terminal will display the installed
    versions of `Node.js` and `npm`.


    ### Why Use npm in Game Development?


    - Simplifies installation of JavaScript game frameworks (e.g., `Phaser.js`, `Three.js`)

    - Helps in managing project dependencies

    - Provides access to thousands of open-source JavaScript libraries


    ## Setting Up a Local Development Server


    A local server is useful for testing JavaScript games, especially when working
    with external assets like images, sounds, and scripts.


    ### Methods to Run a Local Server


    | Method | Command |

    | :--- | :--- |

    | Using Python | `python -m http.server 8000` (Python 3) |

    | Using Node.js | Install `http-server` with `npm install -g http-server`, then
    run `http-server` |

    | Using Live Server (VS Code Extension) | Install the "Live Server" extension
    and click "Go Live" |


    Using `Live Server` in `VS Code` is the easiest option for beginners as it provides
    real-time updates when modifying game files.


    ## Setting Up a Basic Game Project Structure


    Organizing files properly is essential for managing large game projects. A recommended
    directory structure for JavaScript games is:


    ```bash

    /my-game-project

    │── /assets           # Stores images, sounds, and other media files

    │── /scripts          # JavaScript files (game logic, engine, UI)

    │── /styles           # CSS files for styling (if needed)

    │── index.html        # Main game entry point

    │── game.js           # Main JavaScript file

    │── package.json      # npm configuration (if using npm)

    ```


    This structure helps keep assets, scripts, and styles organized, making it easier
    to scale the game as development progresses.


    ## Setting Up Git for Version Control


    Version control is essential for game development, allowing developers to track
    changes, collaborate with others, and revert to previous versions when necessary.


    ### Basic Git Setup


    1. Install `Git` from `https://git-scm.com/`

    Initialize a `Git` repository in the project folder:


    ```sh

    git init

    ```


    2. Add files and commit changes:


    ```sh

    git add .

    git commit -m "Initial commit"

    ```


    3.

    4. Push the project to GitHub or another repository hosting service for backup
    and collaboration.


    Using `Git` ensures that developers can maintain version control and avoid accidental
    loss of game progress.


