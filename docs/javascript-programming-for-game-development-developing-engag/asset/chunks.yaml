    # 2.4 Object-Oriented Programming (OOP) in JavaScript Game Development


    Object-Oriented Programming (OOP) is a programming paradigm that structures code
    into reusable objects. This approach is highly beneficial for game development,
    allowing developers to model game entities like players, enemies, and items efficiently.


    ## Key OOP Concepts


    | Concept | Description | Example |


    | Objects | Containers for properties and methods | let player = { name: "Hero",
    health: 100 }; |


    | Classes | Templates for creating objects | class Player { constructor(name)
    { this.name = name; } } |


    | Inheritance | Allows one class to inherit from another | class Enemy extends
    Character {} |


    | Encapsulation | Restricts access to certain properties | class Player { #health
    = 100; } |


    | Polymorphism | Allows different objects to share the same method | attack()
    {}  in different classes |


    * * *


    ## Creating Objects in JavaScript


    Objects group related properties and functions.


    ### Using Object Literals


    js


    CopyEdit


    let player = {


    name: "Knight",


    health: 100,


    attack: function () {


    console.log(`${this.name} attacks!`);


    }


    };


    player.attack();


    ## Classes in JavaScript Game Development


    Classes provide a blueprint for creating objects with shared properties and methods.


    ### Defining a Class


    js


    CopyEdit


    class Player {


    constructor(name, health) {


    this.name = name;


    this.health = health;


    }


    attack() {


    console.log(`${this.name} attacks!`);


    }


    }


    let hero = new Player("Warrior", 100);


    hero.attack();


    ## Using Inheritance to Create Game Entities


    Inheritance allows objects to share behavior.


    js


    CopyEdit


    class Character {


    constructor(name, health) {


    this.name = name;


    this.health = health;


    }


    takeDamage(amount) {


    this.health -= amount;


    console.log(`${this.name} takes ${amount} damage.`);


    }


    }


    class Enemy extends Character {


    constructor(name, health, type) {


    super(name, health);


    this.type = type;


    }


    attack() {


    console.log(`${this.name} the ${this.type} attacks!`);


    }


    }


    let goblin = new Enemy("Goblin", 50, "Monster");


    goblin.attack();


    goblin.takeDamage(10);


    ## Encapsulation and Private Properties


    Encapsulation restricts access to certain properties.


    js


    CopyEdit


    class Player {


    #health = 100; // Private property


    takeDamage(amount) {


    this.#health -= amount;


    console.log(`Health is now ${this.#health}`);


    }


    }


    let warrior = new Player();


    warrior.takeDamage(20);


    // console.log(warrior.#health); // Error: Private field cannot be accessed


    ## Polymorphism in Game Development


    Polymorphism allows different classes to implement the same method.


    js


    CopyEdit


    class Character {


    attack() {


    console.log("Character attacks!");


    }


    }


    class Warrior extends Character {


    attack() {


    console.log("Warrior slashes with a sword!");


    }


    }


    class Mage extends Character {


    attack() {


    console.log("Mage casts a fireball!");


    }


    }


    let hero1 = new Warrior();


    let hero2 = new Mage();


    hero1.attack(); // Warrior slashes with a sword!


    hero2.attack(); // Mage casts a fireball!


    OOP in JavaScript game development improves organization, scalability, and code
    reusability. By using objects and classes, developers can efficiently manage game
    elements like players, enemies, weapons, and levels. The next section will explore
    event-driven programming and handling user input , a critical aspect of making
