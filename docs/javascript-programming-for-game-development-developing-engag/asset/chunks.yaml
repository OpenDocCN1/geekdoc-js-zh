    \  this.jumpParticles.start();\n}\n```\n\n粒子让跳跃感觉更有动态感。\n\n# 16.4 完善并部署游戏\n\n\
    一旦游戏完成并优化，就是时候将其部署到在线了。\n\n## 1. 创建游戏结束场景\n\n当玩家失去所有血量时，他们会看到游戏结束屏幕。\n\n```js\n\
    class GameOverScene extends Phaser.Scene {\n  constructor() {\n    super({ key:\
