    CopyEdit


    function updateEnemies() {


    enemies.forEach(enemy => {


    chasePlayer(enemy);


    });


    }


    ​● ​ Now, some enemies will actively follow the player .


    ## 4\. Adding Obstacles (Spikes, Lava, Moving Platforms)


