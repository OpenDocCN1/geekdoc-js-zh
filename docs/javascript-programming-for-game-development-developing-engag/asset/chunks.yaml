    \ 平台游戏\n\n平台游戏是最受欢迎的游戏类型之一。它们涉及由玩家控制的角色在包含障碍物、平台和敌人的关卡中穿。《超级马里奥兄弟》、《空洞骑士》和《蔚蓝》等游戏都是设计良好的平台游戏绝例。\n\
    \n在本章中，我们将：\n- 规划并设计游戏概念\n- 创建一个包含平台和关卡的 2D 游戏世界\n- 实现玩家控制和物理系统（跳跃、重力和移动）\n\n\
    ## 9.1 规划与设计游戏概念\n\n在开始编码之前，我们需要定义 2D 平台游戏的概念。\n\n### 1. 核心机制\n\n2D 平台游戏通常包括：\n\
    - 玩家移动（左、右、跳跃）\n- 重力和跳跃机制\n- 平台和地形\n- 敌人和陷阱\n- 可收集物品（金币、道具等）\n- 目标（出口门、旗帜或 Boss\
    \ 战）\n\n### 2. 选择主题\n\n主题赋予游戏视觉和玩法上的身份。\n\n| 主题 | 背景 | 示例游戏 |\n| :--- | :--- |\
    \ :--- |\n| 奇幻 | 魔法城堡、地下牢 | 空洞骑士 |\n| 科幻 | 空间站、未来城市 | 洛洛洛人 |\n| 丛林冒险 | 森林、洞穴、寺庙\
    \ | 大金刚王国 |\n| 古典复古 | 像素风、横向卷轴 | 超级马里奥兄弟 |\n\n在本教程中，我们将构建一个设定在森林世界中的基础冒险平台游戏。\n\
    \n### 3. 游戏关卡结构\n\n平台游戏通过关卡推进，难度逐渐增加。\n\n| 关卡 | 特性 |\n| :--- | :--- |\n| 第一关 |\
    \ 简单的平台、易于跳跃 |\n| 第二关 | 移动平台、引入敌人 |\n| 第三关 | 坑洞、尖刺、可收集物品 |\n| 第四关 | Boss 战或最终挑战\
    \ |\n\n每个关卡都应该有一个明确的目标（到达出口、击败敌人、收集物品）。\n\n## 9.2 创建游戏世界和关卡\n\n游戏世界由滚动背景、平台和障碍物组成。\n\
    \n### 1. 设置画布\n\n首先，我们创建一个 HTML5 画布来渲染游戏世界。\n\n```html\n<canvas id=\"gameCanvas\"\
    \ width=\"800\" height=\"400\"></canvas>\n<script src=\"game.js\"></script>\n\
    ```\n\n-   `canvas` 是绘制所有元素（玩家、平台、敌人）的地方。\n-   JavaScript 文件 `game.js` 包含游戏逻辑。\n\
    \n### 2. 绘制背景和地面\n\n我们首先创建一个滚动背景和供玩家使用的地面。\n\n#### 示例：设置背景\n\n```js\nlet canvas\
    \ = document.getElementById(\"gameCanvas\");\nlet ctx = canvas.getContext(\"2d\"\
    );\nlet bgImage = new Image();\nbgImage.src = \"background.png\";\nlet groundHeight\
    \ = 50;\n\nfunction drawBackground() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n\
    \  ctx.drawImage(bgImage, 0, 0);\n  ctx.fillStyle = \"green\";\n  ctx.fillRect(0,\
    \ canvas.height - groundHeight, canvas.width, groundHeight);\n}\n\nfunction update()\
    \ {\n  drawBackground();\n  requestAnimationFrame(update);\n}\nupdate();\n```\n\
    \n-   首先绘制背景图像。\n-   一个实绿色矩形代表地面。\n\n### 3. 创建平台\n\n平台是玩家可以跳跃的浮浮对象。\n\n#### 示例：平台对象\n\
    \n```js\nlet platforms = [\n  { x: 100, y: 300, width: 100, height: 20 },\n  {\
    \ x: 250, y: 250, width: 150, height: 20 },\n  { x: 400, y: 200, width: 120, height:\
    \ 20 }\n];\n\nfunction drawPlatforms() {\n  ctx.fillStyle = \"brown\";\n  platforms.forEach(platform\
    \ => {\n    ctx.fillRect(platform.x, platform.y, platform.width, platform.height);\n\
    \  });\n}\n```\n\n-   平台存储在数组中。\n-   游戏遍历数组并绘制每一个平台。\n\n### 4. 添加可收集物品\n\n金币和道具是可选的。\n\
    \n#### 示例：收集对象\n\n```js\nlet coins = [\n  { x: 150, y: 280, collected: false },\n\
    \  { x: 300, y: 230, collected: false }\n];\n\nfunction drawCoins() {\n  ctx.fillStyle\
    \ = \"yellow\";\n  coins.forEach(coin => {\n    if (!coin.collected) {\n     \
    \ ctx.beginPath();\n      ctx.arc(coin.x, coin.y, 5, 0, Math.PI * 2);\n      ctx.fill();\n\
    \    }\n  });\n}\n```\n\n-   绘制未被收集的金币。\n-   一旦被收集，它们就会消失。\n\n## 9.3 实现玩家控制和物理系统\n\
    \n玩家必须能够移动、跳跃并与环境交互。\n\n### 1. 创建玩家对象\n\n```js\nlet player = {\n  x: 50,\n  y:\
    \ canvas.height - groundHeight - 40,\n  width: 30,\n  height: 40,\n  speed: 5,\n\
    \  velocityY: 0,\n  gravity: 0.5,\n  jumpStrength: -10,\n  onGround: false\n};\n\
    \nfunction drawPlayer() {\n  ctx.fillStyle = \"blue\";\n  ctx.fillRect(player.x,\
    \ player.y, player.width, player.height);\n}\n```\n\n-   玩家由一个蓝色矩形表示。\n-   初始化了重力和跳跃机制。\n\
    \n### 2. 处理移动（左、右和跳跃）\n\n```js\nlet keys = {};\n\ndocument.addEventListener(\"\
    keydown\", function(event) {\n  keys[event.key] = true;\n});\n\ndocument.addEventListener(\"\
    keyup\", function(event) {\n  keys[event.key] = false;\n});\n\nfunction updatePlayer()\
    \ {\n  // 左右移动\n  if (keys[\"ArrowRight\"]) player.x += player.speed;\n  if (keys[\"\
    ArrowLeft\"]) player.x -= player.speed;\n\n  // 跳跃\n  if (keys[\" \"]) {\n   \
    \ if (player.onGround) {\n      player.velocityY = player.jumpStrength;\n    \
    \  player.onGround = false;\n    }\n  }\n\n  // 应用重力\n  player.velocityY += player.gravity;\n\
    \  player.y += player.velocityY;\n\n  // 与地面碰撞\n  if (player.y + player.height\
    \ >= canvas.height - groundHeight) {\n    player.y = canvas.height - groundHeight\
    \ - player.height;\n    player.velocityY = 0;\n    player.onGround = true;\n \
    \ }\n}\n```\n\n-   左右方向键可以移动玩家。\n-   空格键触发跳跃。\n-   重力将玩家向下拉。\n\n### 3. 实现平台碰撞\n\
    \njs\n\n"
