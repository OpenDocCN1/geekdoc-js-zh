    \n# 8.3 创建角色和敌人动画\n\n在大多数游戏中，角色和敌人会动态地移动、攻击和交互。为了让这些动作感觉真实且吸引人，我们使用了具有良好帧过渡的 Sprite\
    \ 动画。\n\n本节涵盖：\n- 为角色的移动和动作制作动画\n- 创建不同行为的敌人动画\n- 处理 AI 驱动的 Sprite 动画\n\n## 1.\
    \ 角色动画：行走、跳跃和攻击\n\n每个角色动画由多个帧组成，按顺序显示以创建运动效果。\n\n| 动画 | 帧数 | 精灵图中的行 |\n| :---\
    \ | :--- | :--- |\n| 待机 | 4 | 0 |\n| 行走 | 6 | 1 |\n| 跳跃 | 3 | 2 |\n| 攻击 | 5 |\
    \ 3 |\n\n### 步骤 1：设置精灵图\n\n我们定义了一个精灵图，其中不同的行代表不同的动画。\n\n```js\nlet characterSprite\
    \ = new Image();\ncharacterSprite.src = \"character-sprite.png\"; // 替换为实际路径\n\
    ```\n\n### 步骤 2：实现角色动画系统\n\n我们创建了一个动画对象来动态处理不同的动作。\n\n#### 示例：角色动画对象\n\n```js\n\
    let player = {\n  x: 100,\n  y: 250,\n  frameX: 0,\n  frameY: 0, // 精灵图中的行\n \
    \ frameCount: [4, 6, 3, 5], // 每个动画的帧数\n  speed: 5,\n  action: \"idle\",\n};\n\
    function drawCharacter() {\n  ctx.drawImage(characterSprite,\n    player.frameX\
    \ * 64, player.frameY * 64,\n    64, 64,\n    player.x, player.y, 64, 64);\n}\n\
    function updateCharacterAnimation() {\n  player.frameX = (player.frameX + 1) %\
    \ player.frameCount[player.frameY];\n}\nsetInterval(updateCharacterAnimation,\
    \ 100); // 每 100ms 更新一次\n```\n\n- 每个动作都有自己的帧数。\n- 帧过渡在固定间隔内发生（每帧 100ms）。\n\n###\
    \ 步骤 3 根据动作切换动画\n\n我们根据玩家输入动态更新动画。\n\n#### 示例：根据移动切换动画\n\n```js\ndocument.addEventListener(\"\
    keydown\", function(event) {\n  if (event.key === \"ArrowRight\") {\n    player.x\
    \ += player.speed;\n    player.frameY = 1; // 行走动画\n  }\n  if (event.key === \"\
    \ \") {\n    player.frameY = 2; // 跳跃动画\n  }\n  if (event.key === \"a\") {\n \
    \   player.frameY = 3; // 攻击动画\n  }\n});\n```\n\n- 右方向键触发行走动画。\n- 空格键切换到跳跃动画。\n\
    - 按下“A”激活攻击动画。\n\n## 2. 敌人动画：待机、追逐和攻击\n\n敌人应该像玩家角色一样具有不同的动画状态。\n\n| 敌人状态 | 帧数\
    \ | Sprite 灵行 |\n| :--- | :--- | :--- |\n| 待机 | 3 | 0 |\n| 追逐 | 5 | 1 |\n| 攻击\
    \ | 4 | 2 |\n\n#### 示例：敌人动画对象\n\n```js\nlet enemy = {\n  x: 400,\n  y: 250,\n\
    \  frameX: 0,\n  frameY: 0, // 精灵图中的行\n  speed: 2,\n  action: \"idle\",\n};\n\
    function drawEnemy() {\n  ctx.drawImage(characterSprite,\n    enemy.frameX * 64,\
    \ enemy.frameY * 64,\n    64, 64,\n    enemy.x, enemy.y, 64, 64);\n}\nfunction\
    \ updateEnemyAnimation() {\n  enemy.frameX = (enemy.frameX + 1) % 4;\n}\nsetInterval(updateEnemyAnimation,\
    \ 120);\n```\n\n- 待机状态使用第 0 行。\n- 追逐动画（向玩家移动）使用第 1 行。\n\n### 步骤 4 根据 AI 行为切换敌人动画\n\
    \n```js\nfunction updateEnemyAI() {\n  let distance = Math.abs(player.x - enemy.x);\n\
    \  if (distance < 200) {\n    enemy.frameY = 1; // 切换到追逐动画\n    enemy.x -= enemy.speed;\
    \ // 向玩家移动\n  }\n  if (distance < 50) {\n    enemy.frameY = 2; // 攻击动画\n  }\n\
    }\nsetInterval(updateEnemyAI, 100);\n```\n\n- 如果玩家靠近，敌人开始追逐。\n- 如果玩家非常近，敌人攻击。\n\
    \n# 8.4 添加平滑过渡和效果\n\n当动画在状态之间平滑混合时，看起来更真实。\n\n本节涵盖：\n- 在动画之间添加平滑过渡\n- 创建运动模糊和视觉效果\n\
    - 使用缓动实现自然移动\n\n## 1. 使用补间 (Tweening) 实现平滑过渡\n\n我们不是立即切换动画，而是使用补间（渐进变化）。\n\n####\
    \ 示例：平滑动画过渡\n\n```js\nlet currentAnimation = \"idle\";\nlet nextAnimation = \"\
    walking\";\nlet transitionSpeed = 0.05;\nlet animationProgress = 0;\n\nfunction\
    \ smoothTransition() {\n  if (currentAnimation !== nextAnimation) {\n    animationProgress\
    \ += transitionSpeed;\n    if (animationProgress >= 1) {\n      currentAnimation\
    \ = nextAnimation;\n      animationProgress = 0;\n    }\n  }\n}\n```\n\n"
