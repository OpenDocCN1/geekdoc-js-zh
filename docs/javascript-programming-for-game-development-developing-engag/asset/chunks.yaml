    let enemies = [\n  { x: 300, y: 250, width: 30, height: 40, speed: 2, direction:\
    \ 1 },\n  { x: 500, y: 200, width: 30, height: 40, speed: 1.5, direction: 1 }\n\
    ];\nfunction drawEnemies() {\n  ctx.fillStyle = \"red\";\n  enemies.forEach(enemy\
    \ => {\n    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);\n  });\n\
    }\n```\n\n- ● 每个敌人都在平台上移动。\n- ● 它们被用红色矩形表示。\n\n### 2. 实现基础敌人移动（巡逻）\n\n敌人应该在固定路径上往回移动。\n\
    \n#### 示例：巡逻 AI\n\n```javascript\nfunction updateEnemies() {\n  enemies.forEach(enemy\
    \ => {\n    enemy.x += enemy.speed * enemy.direction;\n    // 当碰到屏幕边界或限制时改变方向\n\
    \    if (enemy.x <= 200 || enemy.x >= 600) {\n      enemy.direction *= -1;\n \
    \   }\n  });\n}\n```\n\n- ● 敌人左右移动。\n- ● 它们在到达边界时反转方向。\n\n### 3. 实现敌人 AI（追逐玩家）\n\
    \n某些敌人应该检测玩家 并追逐他们。\n\n#### 示例：AI 追逐玩家\n\n```javascript\nfunction chasePlayer(enemy)\
    \ {\n  let distance = player.x - enemy.x;\n  if (Math.abs(distance) < 150) { //\
    \ 仅在 150px 内时追逐\n    enemy.direction = distance > 0 ? 1 : -1;\n    enemy.x +=\
    \ enemy.speed * enemy.direction;\n  }\n}\n```\n\n- ● 如果玩家在附近，敌人会向他们移动。\n\n####\
    \ 在游戏循环中更新敌人 AI\n\n```javascript\nfunction updateEnemies() {\n  enemies.forEach(enemy\
    \ => {\n    chasePlayer(enemy);\n  });\n}\n```\n\n- ● 现在，某些敌人会主动跟随玩家。\n\n## 4.\
    \ 添加障碍物（尖刺、岩浆、移动平台）\n\n### 步骤 1：创建障碍物\n\n```javascript\nlet obstacles = [\n  {\
    \ x: 200, y: 350, width: 50, height: 10, type: \"spike\" },\n  { x: 400, y: 320,\
    \ width: 60, height: 20, type: \"lava\" }\n];\nfunction drawObstacles() {\n  obstacles.forEach(obstacle\
    \ => {\n    ctx.fillStyle = obstacle.type === \"spike\" ? \"gray\" : \"orange\"\
    ;\n    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);\n\
    \  });\n}\n```\n\n- ● 尖刺是灰色的。\n- ● 岩浆是橙色的。\n\n### 步骤 2：检查玩家与障碍物的碰撞\n\n```javascript\n\
    function checkObstacleCollisions() {\n  obstacles.forEach(obstacle => {\n    if\
    \ (player.x + player.width > obstacle.x &&\n    player.x < obstacle.x + obstacle.width\
    \ &&\n    player.y + player.height > obstacle.y) {\n      player.health -= 1;\
    \ // 接触时减少血量\n    }\n  });\n}\n```\n\n- ● 触摸障碍物会减少玩家血量。\n\n### 5. 添加移动平台\n\n上下移动\
    \ 或左右移动的平台增加了多样性。\n\n```javascript\nlet movingPlatforms = [\n  { x: 300, y: 280,\
    \ width: 100, height: 10, speed: 2, direction: 1 }\n];\nfunction updateMovingPlatforms()\
    \ {\n  movingPlatforms.forEach(platform => {\n    platform.x += platform.speed\
    \ * platform.direction;\n    if (platform.x <= 200 || platform.x >= 600) {\n \
    \     platform.direction *= -1;\n    }\n  });\n}\n```\n\n- ● 平台在移动。\n- ● 它们在到达限制时反转。\n\
    \n### 6. 更新游戏循环\n\n```javascript\nfunction update() {\n  ctx.clearRect(0, 0, canvas.width,\
    \ canvas.height);\n  drawBackground();\n  drawPlatforms();\n  drawCoins();\n \
    \ drawObstacles();\n  drawEnemies();\n  drawPlayer();\n  updatePlayer();\n  updateEnemies();\n\
    \  updateMovingPlatforms();\n  requestAnimationFrame(update);\n}\nupdate();\n\
    ```\n\n- ● 平台在移动。\n- ● 障碍物被持续绘制。\n\n# 9. 评分系统、血量和胜利条件\n\n为了让游戏更具挑战性和吸引力，我们需要引入：\n\
    - 评分系统\n- 血量机制（玩家受到伤害）\n- 胜利条件（到达出口）\n\n## 1. 实现评分系统\n\n玩家通过收集硬币获得积分。\n\n### 步骤\
    \ 1：跟踪分数\n\n```javascript\nlet score = 0;\nfunction drawScore() {\n  ctx.fillStyle\
    \ = \"white\";\n  ctx.fillText(\"Score: \" + score, 20, 30);\n}\n```\n\n### 步骤\
    \ 2：收集硬币\n\n```javascript\nfunction checkCollection() {\n  coins.forEach(coin\
    \ => {\n    if (player.x + player.width > coin.x &&\n    player.x < coin.x + coin.width\
    \ &&\n    player.y + player.height > coin.y) {\n      coin.collected = true;\n\
    \      score += 10;\n    }\n  });\n}\n```\n\n- ● 每枚硬币增加 10 分。\n\n## 2. 实现玩家血量\n\
    \n触摸障碍物时会减少血量。\n\n### 步骤 1：添加血量系统\n\n```javascript\nplayer.health = 3;\nfunction\
    \ drawHealth() {\n  ctx.fillStyle = \"red\";\n  ctx.fillText(\"Health: \" + player.health,\
    \ 20, 50);\n}\n```\n\n### 步骤 2：受到伤害\n\n```javascript\nfunction checkCollision()\
    \ {\n  enemies.forEach(enemy => {\n    if (player.x + player.width > enemy.x &&\n\
    \    player.x < enemy.x + enemy.width &&\n    player.y + player.height > enemy.y)\
    \ {\n      player.health -= 1;\n    }\n  });\n}\n```\n\n- ● 玩家碰到敌人会减少血量。\n\n##\
    \ 3. 添加胜利/失败条件\n\n当玩家到达目标或失去血量时游戏结束。\n\n### 步骤 1：添加目标\n\n```javascript\nlet goal\
    \ = { x: 750, y: 320, width: 40, height: 40 };\nfunction drawGoal() {\n  ctx.fillStyle\
    \ = \"gold\";\n  ctx.fillRect(goal.x, goal.y, goal.width, goal.height);\n}\n```\n\
    \n### 步骤 2：检查游戏结束\n\n```javascript\nfunction checkWinOrLose() {\n  if (player.health\
    \ <= 0) {\n    alert(\"Game Over!\");\n    location.reload();\n  }\n  if (player.x\
    \ + player.width > goal.x &&\n  player.y + player.height > goal.y) {\n    alert(\"\
    You Win! Score: \" + score);\n    location.reload();\n  }\n}\n```\n\n- ● 碰到目标会赢得游戏。\n\
    - ● 血量归零则玩家失败。\n\n"
- fmt: "\nA game economy enhances player engagement by introducing collectibles, rewards,\
    \ and upgrades. Coins and points provide incentives for players to explore, take\
    \ risks, and strategize. Upgrades allow players to customize abilities or unlock\
    \ new features.\n\nIn this section, we will implement: ✔ Coins and a points system\
    \ ✔ Power-ups and item purchases ✔ Player upgrades (e.g., faster movement, higher\
    \ jumps)\n\n## 1. Implementing Coins and Points System\n\nCoins serve as in-game\
    \ currency that can be used for upgrades, unlocking levels, or scoring purposes.\n\
    \n### Step 1: Creating Coin Objects\n\n```js\nlet coins = [\n  { x: 150, y: 280,\
    \ collected: false },\n  { x: 300, y: 230, collected: false },\n  { x: 500, y:\
    \ 200, collected: false }\n];\n\nfunction drawCoins() {\n  ctx.fillStyle = \"\
    yellow\";\n  coins.forEach(coin => {\n    if (!coin.collected) {\n      ctx.beginPath();\n\
    \      ctx.arc(coin.x, coin.y, 5, 0, Math.PI * 2);\n      ctx.fill();\n    }\n\
    \  });\n}\n```\n\n* Coins are stored in an array.\n* Uncollected coins are drawn\
    \ on the screen.\n\n### Step 2: Collecting Coins\n\nWhen the player touches a\
    \ coin, they should collect it and gain points.\n\n```js\nlet score = 0;\nfunction\
    \ checkCoinCollection() {\n  coins.forEach(coin => {\n    if (!coin.collected\
    \ &&\n      player.x + player.width > coin.x &&\n      player.x < coin.x + 10\
    \ &&\n      player.y + player.height > coin.y) {\n      coin.collected = true;\n\
    \      score += 10; // Increase score\n    }\n  });\n}\n```\n\n* The coin disappears\
    \ when collected.\n* Player score increases by 10 points per coin.\n\n### Step\
    \ 3: Displaying the Score\n\n```js\nfunction drawScore() {\n  ctx.fillStyle =\
    \ \"white\";\n  ctx.font = \"20px Arial\";\n  ctx.fillText(\"Score: \" + score,\
    \ 20, 30);\n}\n```\n\n* Continuously updates the player's score on the screen.\n\
    \n## 2. Implementing Power-Ups and Item Purchases\n\nPower-ups provide temporary\
    \ or permanent boosts to the player, such as extra speed, double jump, or invincibility.\n\
    \n### Step 1: Creating a Power-Up Object\n\n```js\nlet powerUps = [\n  { x: 250,\
    \ y: 250, type: \"speed\", collected: false }\n];\n\nfunction drawPowerUps() {\n\
    \  ctx.fillStyle = \"blue\";\n  powerUps.forEach(powerUp => {\n    if (!powerUp.collected)\
    \ {\n      ctx.fillRect(powerUp.x, powerUp.y, 15, 15);\n    }\n  });\n}\n```\n\
    \n* Power-ups are displayed as blue squares.\n\n### Step 2: Collecting Power-Ups\n\
    \n```js\nfunction checkPowerUpCollection() {\n  powerUps.forEach(powerUp => {\n\
    \    if (!powerUp.collected &&\n      player.x + player.width > powerUp.x &&\n\
    \      player.x < powerUp.x + 15 &&\n      player.y + player.height > powerUp.y)\
    \ {\n      powerUp.collected = true;\n      if (powerUp.type === \"speed\") {\n\
    \        player.speed += 2; // Increase speed\n        setTimeout(() => player.speed\
    \ -= 2, 5000); // Reset after 5s\n      }\n    }\n  });\n}\n```\n\n* Increases\
    \ player speed for 5 seconds when collected.\n\n## 3. Implementing a Simple Upgrade\
    \ System\n\nPlayers can use collected coins to buy upgrades.\n\n### Step 1: Creating\
    \ an Upgrade Store\n\n```html\n<button onclick=\"buyUpgrade('speed')\">Increase\
    \ Speed (Cost: 50)</button>\n<button onclick=\"buyUpgrade('jump')\">Increase Jump\
    \ Height (Cost: 50)</button>\n```\n\n### Step 2: Buying Upgrades with Coins\n\n\
    ```js\nlet upgrades = { speed: false, jump: false };\nfunction buyUpgrade(type)\
    \ {\n  if (score >= 50) { // Requires 50 points\n    score -= 50;\n    upgrades[type]\
    \ = true;\n    if (type === \"speed\") player.speed += 2;\n    if (type === \"\
    jump\") player.jumpStrength -= 2;\n  }\n}\n```\n\n* Players can spend points to\
    \ improve movement or jump height.\n\n### Updating the Game Loop\n\n```js\nfunction\
    \ update() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n  drawBackground();\n\
    \  drawPlatforms();\n  drawCoins();\n  drawPowerUps();\n  drawPlayer();\n  drawScore();\n\
    \  updatePlayer();\n  checkCoinCollection();\n  checkPowerUpCollection();\n  requestAnimationFrame(update);\n\
    }\nupdate();\n```\n\n* Coins, power-ups, and upgrades are now fully functional.\n\
    \n## 10.4 Saving and Loading Game Progress with Local Storage\n\nSaving player\
    \ progress ensures they can resume where they left off. We use Local Storage,\
    \ which allows JavaScript to store data in the browser.\n\n## 1. Saving Game Data\n\
    \nWe save: ✔ Player’s score ✔ Collected coins and power-ups ✔ Purchased upgrades\n\
    \n```js\nfunction saveGame() {\n  let gameData = {\n    score: score,\n  };\n\
    \  // Logic to save gameData to localStorage\n}\n```\n\n## 2. Loading Game Data\n\
    \nWhen the game starts, we check if there’s saved data.\n\n```js\nfunction loadGame()\
    \ {\n  let savedData = localStorage.getItem(\"gameSave\");\n  if (savedData) {\n\
    \    let gameData = JSON.parse(savedData);\n    // Logic to apply gameData to\
    \ player\n  }\n}\n```\n\n## 3. Resetting and Deleting Save\n\n```js\nfunction\
    \ resetGame() {\n  localStorage.removeItem(\"gameSave\");\n  location.reload();\n\
    }\n```\n\n## 4. Adding Save/Load Buttons\n\n```html\n<button onclick=\"saveGame()\"\
    >Save Game</button>\n<button onclick=\"resetGame()\">Reset Game</button>\n```\n\
    \n## 5. Updating the Game Loop to Include Saving\n\n```js\nsetInterval(saveGame,\
    \ 10000); // Auto-save every 10 seconds\n```\n"
