    \    console.log(\"Swipe Down\");\n    } else {\n      console.log(\"Swipe Up\"\
    );\n    }\n  }\n});\n```\n\n## Handling Gamepad Input\n\nMany modern browsers\
    \ support game controllers using the `Gamepad API`.\n\n### Detecting a Controller\
    \ Connection\n\n```js\nwindow.addEventListener(\"gamepad connected\", function(event)\
    \ {\n  console.log(\"Gamepad connected:\", event.gamepad.id);\n});\n```\n\n###\
    \ Checking Button Presses\n\n```js\nfunction checkGamepadInput() {\n  let gamepads\
    \ = navigator.getGamepads();\n  if (gamepads[0]) {\n    if (gamepads[0].buttons[0].pressed)\
    \ {\n      console.log(\"Jump button pressed!\");\n    }\n  }\n  requestAnimationFrame(checkGamepadInput);\n\
    }\n\ncheckGamepadInput();\n```\n\n## 2.6 Manipulating the DOM for Game Elements\n\
    \nThe Document Object Model (DOM) allows developers to create and modify game\
