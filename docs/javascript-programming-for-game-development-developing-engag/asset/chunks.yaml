    * 玩家每获得一个金币得分增加 10 分。\n\n### 步骤 3：显示得分\n\n```js\nfunction drawScore() {\n  ctx.fillStyle\
    \ = \"white\";\n  ctx.font = \"20px Arial\";\n  ctx.fillText(\"Score: \" + score,\
    \ 20, 30);\n}\n```\n\n* 在屏幕上持续更新玩家的得分。\n\n## 2. 实现道具和道具购买\n\n道具为玩家提供临时或永久的增强，例如额外的速度、双倍跳跃或无敌。\n\
    \n### 步骤 1：创建道具对象\n\n```js\nlet powerUps = [\n  { x: 250, y: 250, type: \"speed\"\
    , collected: false }\n];\n\nfunction drawPowerUps() {\n  ctx.fillStyle = \"blue\"\
    ;\n  powerUps.forEach(powerUp => {\n    if (!powerUp.collected) {\n      ctx.fillRect(powerUp.x,\
    \ powerUp.y, 15, 15);\n    }\n  });\n}\n```\n\n* 道具以蓝色方块的形式显示。\n\n### 步骤 2：收集道具\n\
    \n```js\nfunction checkPowerUpCollection() {\n  powerUps.forEach(powerUp => {\n\
    \    if (!powerUp.collected &&\n      player.x + player.width > powerUp.x &&\n\
    \      player.x < powerUp.x + 15 &&\n      player.y + player.height > powerUp.y)\
    \ {\n      powerUp.collected = true;\n      if (powerUp.type === \"speed\") {\n\
    \        player.speed += 2; // Increase speed\n        setTimeout(() => player.speed\
    \ -= 2, 5000); // Reset after 5s\n      }\n    }\n  });\n}\n```\n\n* 收集后玩家速度增加\
    \ 5 秒。\n\n## 3. 实现简单的升级系统\n\n玩家可以使用收集的金币购买升级。\n\n### 步骤 1：创建升级商店\n\n```html\n\
    <button onclick=\"buyUpgrade('speed')\">增加速度 (花费: 50)</button>\n<button onclick=\"\
    buyUpgrade('jump')\">增加跳跃高度 (花费: 50)</button>\n```\n\n### 步骤 2：使用金币购买升级\n\n```js\n\
    let upgrades = { speed: false, jump: false };\nfunction buyUpgrade(type) {\n \
    \ if (score >= 50) { // Requires 50 points\n    score -= 50;\n    upgrades[type]\
    \ = true;\n    if (type === \"speed\") player.speed += 2;\n    if (type === \"\
    jump\") player.jumpStrength -= 2;\n  }\n}\n```\n\n* 玩家可以使用积分来改进移动或跳跃高度。\n\n###\
    \ 更新游戏循环\n\n```js\nfunction update() {\n  ctx.clearRect(0, 0, canvas.width, canvas.height);\n\
    \  drawBackground();\n  drawPlatforms();\n  drawCoins();\n  drawPowerUps();\n\
    \  drawPlayer();\n  drawScore();\n  updatePlayer();\n  checkCoinCollection();\n\
    \  checkPowerUpCollection();\n  requestAnimationFrame(update);\n}\nupdate();\n\
    ```\n\n* 金币、道具和升级现在已完全可用。\n\n## 10.4 使用 Local Storage 保存和加载游戏进度\n\n保存玩家进度可以确保他们能够从离开的地方继续。我们使用\
    \ Local Storage，它允许 JavaScript 在浏览器中存储数据。\n\n## 1. 保存游戏数据\n\n我们保存了：✔ 玩家得分 ✔ 收集的金币和道具\
    \ ✔ 购买的升级\n\n```js\nfunction saveGame() {\n  let gameData = {\n    score: score,\n\
    \  };\n  // Logic to save gameData to localStorage\n}\n```\n\n## 2. 加载游戏数据\n\n\
    当游戏开始时，我们检查是否有已保存的数据。\n\n```js\nfunction loadGame() {\n  let savedData = localStorage.getItem(\"\
    gameSave\");\n  if (savedData) {\n    let gameData = JSON.parse(savedData);\n\
    \    // Logic to apply gameData to player\n  }\n}\n```\n\n## 3. 重置和删除存档\n\n```js\n\
    function resetGame() {\n  localStorage.removeItem(\"gameSave\");\n  location.reload();\n\
    }\n```\n\n## 4. 添加保存/加载按钮\n\n```html\n<button onclick=\"saveGame()\">保存游戏</button>\n\
    <button onclick=\"resetGame()\">重置游戏</button>\n```\n\n## 5. 更新游戏循环包含保存功能\n\n```js\n\
    setInterval(saveGame, 10000); // 每 10 秒自动保存一次\n```\n\n"
- fmt: "\n✔ Server Load Management: Handling thousands of connections efficiently.\n\
    \n## 11.2 Setting Up a WebSocket Server for Multiplayer Gaming\n\nWe will now\
    \ set up a WebSocket server using `Node.js` and `Socket.io`.\n\n### 1. Installing\
    \ Dependencies\n\nFirst, install `Node.js` and `Socket.io` (for real-time communication).\n\
    \n#### Step 1: Create a New Project\n\n```sh\nmkdir multiplayer-game\ncd multiplayer-game\n\
    npm init -y\n```\n\n#### Step 2: Install Required Packages\n\n```sh\nnpm install\
    \ express socket.io\n```\n\n● `Express`: Creates the HTTP server.\n● `Socket.io`:\
    \ Handles WebSocket connections.\n\n### 2. Setting Up the WebSocket Server\n\n\
    Create a new file `server.js` and add the following code:\n\n```js\nconst express\
    \ = require(\"express\");\nconst http = require(\"http\");\nconst { Server } =\
    \ require(\"socket.io\");\n\nconst app = express();\nconst server = http.createServer(app);\n\
    const io = new Server(server);\n\napp.use(express.static(\"public\")); // Serves\
    \ client files\n\nio.on(\"connection\", (socket) => {\n    console.log(\"A player\
    \ connected:\", socket.id);\n    // Broadcast new player to all clients\n    socket.broadcast.emit(\"\
    newPlayer\", { id: socket.id });\n    // Handle player movement\n    socket.on(\"\
    move\", (data) => {\n        io.emit(\"playerMoved\", { id: socket.id, x: data.x,\
    \ y: data.y });\n    });\n    // Handle disconnections\n    socket.on(\"disconnect\"\
    , () => {\n        io.emit(\"playerDisconnected\", { id: socket.id });\n     \
    \   console.log(\"Player disconnected:\", socket.id);\n    });\n});\n\nserver.listen(3000,\
    \ () => {\n    console.log(\"Server running on http://localhost:3000\");\n});\n\
    ```\n\n● Creates a WebSocket server that listens for player connections.\n● Broadcasts\
    \ new players and movement updates.\n● Handles player disconnections gracefully.\n\
    \n### 3. Creating the Client-Side Connection\n\nNow, create a `public/index.html`\
    \ file.\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
    UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n    <title>Multiplayer Game</title>\n    <script src=\"/socket.io/socket.io.js\"\
    ></script>\n    <script defer src=\"game.js\"></script>\n    <style>\n       \
    \ canvas { background: #000; display: block; margin: auto; }\n    </style>\n</head>\n\
    <body>\n    <canvas id=\"gameCanvas\" width=\"800\" height=\"400\"></canvas>\n\
    </body>\n</html>\n```\n\n● Loads `Socket.io` client-side script.\n● Includes a\
    \ `<canvas>` for rendering the game.\n\n### 4. Handling Player Movement in the\
    \ Client\n\nCreate a new file `public/game.js`.\n\n```js\nconst socket = io();\n\
    const canvas = document.getElementById(\"gameCanvas\");\nconst ctx = canvas.getContext(\"\
    2d\");\nlet players = {};\n\nsocket.on(\"newPlayer\", (data) => {\n    players[data.id]\
    \ = { x: Math.random() * canvas.width, y: Math.random() * canvas.height };\n});\n\
    \nsocket.on(\"playerMoved\", (data) => {\n    if (players[data.id]) {\n      \
    \  players[data.id].x = data.x;\n        players[data.id].y = data.y;\n    }\n\
    });\n\nsocket.on(\"playerDisconnected\", (data) => {\n    delete players[data.id];\
    \ // Remove disconnected player\n});\n\n// Player controls\nlet player = { x:\
    \ 100, y: 100, speed: 5 };\ndocument.addEventListener(\"keydown\", (event) =>\
    \ {\n    if (event.key === \"ArrowRight\") player.x += player.speed;\n    if (event.key\
    \ === \"ArrowLeft\") player.x -= player.speed;\n    if (event.key === \"ArrowUp\"\
    ) player.y -= player.speed;\n    if (event.key === \"ArrowDown\") player.y +=\
    \ player.speed;\n    socket.emit(\"move\", { x: player.x, y: player.y });\n});\n\
    \n// Rendering players\nfunction draw() {\n    ctx.clearRect(0, 0, canvas.width,\
    \ canvas.height);\n    // Draw all players\n    for (let id in players) {\n  \
    \      ctx.fillStyle = id === socket.id ? \"blue\" : \"red\";\n        ctx.fillRect(players[id].x,\
    \ players[id].y, 20, 20);\n    }\n    requestAnimationFrame(draw);\n}\ndraw();\n\
    ```\n\n### 5. Running the Multiplayer Game\n\nTo run the game:\n\n```sh\nnode\
    \ server.js\n```\n\nThen open `http://localhost:3000` in multiple browser tabs.\
    \ Each tab represents a different player!\n\n## 6. Handling Player Lag (Interpolation)\n\
    \nTo smooth player movement, use interpolation.\n\n```js\nlet lastUpdateTime =\
    \ Date.now();\nfunction interpolatePlayers() {\n    let now = Date.now();\n  \
    \  let deltaTime = (now - lastUpdateTime) / 1000; // Convert to seconds\n    for\
    \ (let id in players) {\n        players[id].x += (players[id].targetX - players[id].x)\
    \ * deltaTime * 5;\n}players[id].y += (players[id].targetY - players[id].y) *\
    \ deltaTime * 5;\n    }\n    lastUpdateTime = now;\n}\nsetInterval(interpolatePlayers,\
    \ 50);\n```\n\n● Smooths position updates to compensate for network lag.\n\n##\
    \ 7. Preventing Cheating\n\nSince players send movement data to the server, they\
    \ could modify their position manually (e.g., teleporting). To prevent this:\n\
    ✔ Validate movements on the server.\n✔ Use authoritative servers to handle physics.\n\
    ✔ Implement cheat detection (e.g., teleport checks, speed limits).\n\nIn this\
    \ section, we built:\n✔ A WebSocket server for real-time player interactions.\n\
    ✔ A client-side system for synchronizing player movements.\n✔ Basic networking\
    \ principles for multiplayer games.\n\nThis lays the foundation for more advanced\
    \ multiplayer features, such as combat mechanics, chat systems, and game rooms.\n\
    \nIn the next section, we will implement collision detection and interactions\
    \ between players to make the multiplayer experience more interactive!\n\n# 11.3\
    \ Handling Multiplayer Synchronization and Game Events\n\nIn multiplayer games,\
    \ synchronization ensures all players see the same game state in real time. Since\
    \ players connect from different locations with varying internet speeds and latencies,\
    \ we must optimize data transmission to minimize delays and inconsistencies.\n\
    \nIn this section, we will cover:\n✔ How to synchronize player movement.\n✔ Managing\
    \ game events (e.g., collisions, scoring, power-ups).\n✔ Handling latency and\
    \ lag compensation.\n\n## 1. Understanding Multiplayer Synchronization\n\nIn a\
    \ real-time game, every player's movement, position, and actions need to be broadcast\
    \ to others while keeping the game smooth.\n\nProblems that occur in multiplayer\
    \ synchronization:\n● `Lag`: Players may experience delayed responses.\n● `Desync`:\
    \ Some players may see different game states.\n● `Cheating Risks`: Without validation,\
    \ players could send false position updates.\n\n## 2. Server-Client Synchronization\
    \ Model\n\n### Two Approaches to Synchronization\n\n| Approach | Description |\
    \ Use Case |\n| :--- | :--- | :--- |\n| `Client-Authority` | Clients send movement\
    \ data, and the server updates it. | Low-latency games (small player count). |\n\
    | `Server-Authority` | The server calculates all movement and physics. Clients\
    \ only display updates. | Competitive games (e.g., FPS, racing). |\n\nFor casual\
    \ multiplayer games, a hybrid approach works best:\n● Clients predict movements\
    \ locally.\n● The server corrects any inconsistencies.\n\n## 3. Synchronizing\
    \ Player Movement\n\nEach time a player moves, the client sends movement updates\
    \ to the server.\n\n### Step 1: Emit Player Movement from Client\n\n```js\ndocument.addEventListener(\"\
    keydown\", function(event) {\n    let moveData = { x: player.x, y: player.y };\n\
    \    if (event.key === \"ArrowRight\") moveData.x += player.speed;\n    if (event.key\
    \ === \"ArrowLeft\") moveData.x -= player.speed;\n    if (event.key === \"ArrowUp\"\
    ) moveData.y -= player.speed;\n    if (event.key === \"ArrowDown\") moveData.y\
    \ += player.speed;\n    socket.emit(\"move\", moveData);\n});\n```\n\n● Each time\
    \ a key is pressed, a movement update is sent to the server.\n\n### Step 2: Process\
    \ Movement on the Server\n\nThe server validates and broadcasts movement updates.\n\
    \n```js\nio.on(\"connection\", (socket) => {\n    console.log(\"Player connected:\"\
    , socket.id);\n    socket.on(\"move\", (data) => {\n        if (isValidMove(data.x,\
    \ data.y)) {\n            io.emit(\"playerMoved\", { id: socket.id, x: data.x,\
    \ y: data.y });\n        }\n    });\n});\n```\n\n● Ensures movement is valid before\
    \ broadcasting.\n● Prevents teleporting or unrealistic movement.\n\n### Step 3:\
    \ Updating Other Players' Positions\n\n```js\nsocket.on(\"playerMoved\", (data)\
    \ => {\n    if (players[data.id]) {\n        players[data.id].x = data.x;\n  \
    \      players[data.id].y = data.y;\n    }\n});\n```\n\n● Each client updates\
    \ other players' positions when they receive new data.\n"
  raw: '✔ Server Load Management:  Handling thousands of connections efficiently .


    ## 11.2 Setting Up a WebSocket Server for Multiplayer Gaming


    We will now set up a WebSocket server  using Node.js and Socket.io .


    ### 1\. Installing Dependencies


    First, install Node.js  and Socket.io  (for real-time communication).


    #### Step 1: Create a New Project


    sh


    CopyEdit


    mkdir multiplayer-game


    cd multiplayer-game


    npm init -y


    #### Step 2: Install Required Packages


    sh


    CopyEdit


    npm install express socket.io


    ​● ​ Express : Creates the HTTP server.


    ​● ​ Socket.io : Handles WebSocket connections.


    ### 2\. Setting Up the WebSocket Server


    Create a new file server.js  and add the following code:


    js


    CopyEdit


    const express = require("express");


    const http = require("http");


    const { Server } = require("socket.io");


    const app = express();


    const server = http.createServer(app);


    const io = new Server(server);


    app.use(express.static("public")); // Serves client files


    io.on("connection", (socket) => {


    console.log("A player connected:", socket.id);


    // Broadcast new player to all clients


    socket.broadcast.emit("newPlayer", { id: socket.id });


    // Handle player movement


    socket.on("move", (data) => {


    io.emit("playerMoved", { id: socket.id, x: data.x, y: data.y });


    });


    // Handle disconnections


    socket.on("disconnect", () => {


    io.emit("playerDisconnected", { id: socket.id });


    console.log("Player disconnected:", socket.id);


    });


    });


    server.listen(3000, () => {


    console.log("Server running on http://localhost:3000");


    });


    ​● ​ Creates a WebSocket server that listens for player connections .


    ​● ​ Broadcasts new players and movement updates .


    ​● ​ Handles player disconnections gracefully .


    ### 3\. Creating the Client-Side Connection


    Now, create a public/index.html  file.


    html


    CopyEdit


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Multiplayer Game</title>


    <script src="/socket.io/socket.io.js"></script>


    <script defer src="game.js"></script>


    <style>


    canvas { background: #000; display: block; margin: auto; }


    </style>


    </head>


    <body>


    <canvas id="gameCanvas" width="800" height="400"></canvas>


    </body>


    </html>


    ​● ​ Loads Socket.io client-side script .


    ​● ​ Includes a <canvas>  for rendering the game .


    ### 4\. Handling Player Movement in the Client


    Create a new file public/game.js .


    js


    CopyEdit


    const socket = io();


    const canvas = document.getElementById("gameCanvas");


    const ctx = canvas.getContext("2d");


    let players = {};


    socket.on("newPlayer", (data) => {


    players[data.id] = { x: Math.random() * canvas.width, y: Math.random() * canvas.height
    };


    });


    socket.on("playerMoved", (data) => {


    if (players[data.id]) {


    players[data.id].x = data.x;


    players[data.id].y = data.y;


    }


    });


    socket.on("playerDisconnected", (data) => {


    delete players[data.id]; // Remove disconnected player


    });


    // Player controls


    let player = { x: 100, y: 100, speed: 5 };


    document.addEventListener("keydown", (event) => {


    if (event.key === "ArrowRight") player.x += player.speed;


    if (event.key === "ArrowLeft") player.x -= player.speed;


    if (event.key === "ArrowUp") player.y -= player.speed;


    if (event.key === "ArrowDown") player.y += player.speed;


    socket.emit("move", { x: player.x, y: player.y });


    });


    // Rendering players


    function draw() {


    ctx.clearRect(0, 0, canvas.width, canvas.height);


    // Draw all players


    for (let id in players) {


    ctx.fillStyle = id === socket.id ? "blue" : "red";


    ctx.fillRect(players[id].x, players[id].y, 20, 20);


    }


    requestAnimationFrame(draw);


    }


    draw();


    ### 5\. Running the Multiplayer Game


    To run the game:


    sh


    CopyEdit


    node server.js


    Then open http://localhost:3000  in multiple browser tabs. Each tab represents
    a different player !


    ## 6\. Handling Player Lag (Interpolation)


    To smooth player movement , use interpolation .


    js


    CopyEdit


    let lastUpdateTime = Date.now();


    function interpolatePlayers() {


    let now = Date.now();


    let deltaTime = (now - lastUpdateTime) / 1000; // Convert to seconds


    for (let id in players) {


    players[id].x += (players[id].targetX - players[id].x) * deltaTime * 5;


    players[id].y += (players[id].targetY - players[id].y) * deltaTime * 5;


    }


    lastUpdateTime = now;


    }


    setInterval(interpolatePlayers, 50);


    ​● ​ Smooths position updates to compensate for network lag .


    ## 7\. Preventing Cheating


    Since players send movement data  to the server, they could modify their position
    manually  (e.g., teleporting). To prevent this: ✔ Validate movements on the server
    .


    ✔ Use authoritative servers to handle physics .


    ✔ Implement cheat detection (e.g., teleport checks, speed limits).


    In this section, we built: ✔ A WebSocket server for real-time player interactions
    ✔ A client-side system for synchronizing player movements ✔ Basic networking principles
    for multiplayer games


    This lays the foundation for more advanced multiplayer features , such as combat
    mechanics, chat systems, and game rooms.


    In the next section, we will implement collision detection and interactions between
    players  to make the multiplayer experience more interactive!


    # 11.3 Handling Multiplayer Synchronization and Game Events


    In multiplayer games, synchronization  ensures all players see the same game state
     in real time. Since players connect from different locations with varying internet
    speeds and latencies , we must optimize data transmission  to minimize delays
    and inconsistencies .


    In this section, we will cover: ✔ How to synchronize player movement   Managing
    game events (e.g., collisions, scoring, power-ups)   Handling latency and lag
    compensation


    ## 1. Understanding Multiplayer Synchronization


    In a real-time game , every player''s movement, position, and actions need to
    be broadcast to others  while keeping the game smooth.


    Problems that occur in multiplayer synchronization:


    ​● ​ Lag:  Players may experience delayed responses .


    ​● ​ Desync:  Some players may see different game states .


    ​● ​ Cheating Risks:  Without validation, players could send false position updates
    .


    ## 2. Server-Client Synchronization Model


    ### Two Approaches to Synchronization


    | Approach | Description | Use Case |


    | Client-Authority | Clients send movement data, and the server updates it. |
    Low-latency games (small player count). |


    | Server-Authority | The server calculates all movement and physics. Clients only
    display updates. | Competitive games (e.g., FPS, racing). |


    For casual multiplayer games , a hybrid approach  works best:


    ​● ​ Clients predict movements  locally.


    ​● ​ The server corrects any inconsistencies .


    ## 3. Synchronizing Player Movement


    Each time a player moves, the client sends movement updates  to the server.


    ### Step 1: Emit Player Movement from Client


    js


    CopyEdit


    document.addEventListener("keydown", function(event) {


    let moveData = { x: player.x, y: player.y };


    if (event.key === "ArrowRight") moveData.x += player.speed;


    if (event.key === "ArrowLeft") moveData.x -= player.speed;


    if (event.key === "ArrowUp") moveData.y -= player.speed;


    if (event.key === "ArrowDown") moveData.y += player.speed;


    socket.emit("move", moveData);


    });


    ​● ​ Each time a key is pressed, a movement update is sent to the server .


    ### Step 2: Process Movement on the Server


    The server validates and broadcasts  movement updates.


    js


    CopyEdit


    io.on("connection", (socket) => {


    console.log("Player connected:", socket.id);


    socket.on("move", (data) => {


    if (isValidMove(data.x, data.y)) {


    io.emit("playerMoved", { id: socket.id, x: data.x, y: data.y });


    }


    });


    });


    ​● ​ Ensures movement is valid before broadcasting .


    ​● ​ Prevents teleporting or unrealistic movement .


    ### Step 3: Updating Other Players'' Positions


    js


    CopyEdit


    socket.on("playerMoved", (data) => {


    if (players[data.id]) {


    players[data.id].x = data.x;


    players[data.id].y = data.y;


    }


    });


    ​● ​ Each client updates other players'' positions when they receive new data
    .'
