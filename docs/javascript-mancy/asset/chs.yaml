  \ 6                 `(${position.x}, ${position.y}) 传送到 (${x}, ${y})`);\n 7    \
  \ position.x = x;\n 8     position.y = y;\n 9   };\n10 \n 11   this.healthReport\
  \ = function(){\n12     console.log(`${this} 有 ${this.hp} 点生命。看起来健康。`);\n13   };\n\
  14 }\n```\n\n在这种情况下，我们不使用 `__proto__` 属性，而是将原型 `minion` 赋值给构造函数的 `prototype` 属性：\n\
  \n```\n1 // 记住，minion 对象看起来像：\n2 // let minion = {\n3 //   hp: 10,\n4 //   name:\
  \ 'minion',\n5 //   toString(){ return this.name;}\n6 // };\n7 \n8 TeleportingMinion.prototype\
  \ = minion;\n9 TeleportingMinion.prototype.constructor = TeleportingMinion;\n```\n\
  \n从现在起，我们用这个 `constructor function` 创建的每个对象都将 `minion` 对象作为原型：\n\n```\n1 let oneCrazyTeleportingMinion\
  \ = new TeleportingMinion();\n2 oneCrazyTeleportingMinion.healthReport();\n3 //\
  \ => minion 有 10 点生命。看起来健康。\n4 \n5 let anotherCrazyTeleportingMinion = new TeleportingMinion();\n\
  6 anotherCrazyTeleportingMinion.healthReport();\n7 // => minion 有 10 点生命。看起来健康。\n\
  ```\n\n正如你在上面的示例中所看到的，这些传传送小怪的 `healthReport` 方法通过原型链访问了原始 `minion` 对象的 `hp` 属性。\n\
  \n### 创建更长的原型链\n\n你应该知道，你并不局限于仅由一个对象和一个 `prototype` 组成的单层 `prototype chain`。你可以像在\
  \ C# 中一样创建大型继承结构。\n\n假设我们想创建一个 `wizard`。我们可以使用 `__proto__` 属性让它继承自 `TeleportingMinion`：\n\
  \n```\n1 let wizard = {\n2   '__proto__': new TeleportingMinion(),\n3   name: 'Evil\
  \ wizard',\n4   castsFireballSpell(target){ \n5     console.log(`${this} 释放火球术 `+\n\
  6                 `并毁灭了 ${target}`);\n7   }\n8 };\n```\n\n实际上建立了一个如下的 `prototype\
  \ chain`：\n\n```\n1 wizard => teleportingMinion => minion\n```\n\n现在，我们的新对象 `wizard`\
  \ 同时继承了 `teleportingMinion` 和 `minion` 的行为，正如你在下面的示例所示：\n\n```\n 1 // 巫师可以释放火球\n\
  \ 2 wizard.castsFireballSpell('sandwich');\n 3 // => 恶魔巫师释放火球术并毁灭了三明治\n 4 // 该死，那是我的最后一个三明治\n\
  \ 5 \n 6 // 它可以传送\n 7 wizard.teleportsTo(1,2);\n 8 // => 恶魔巫师从 (0, 0) 传送到 (1, 2)\n\
  \ 9 \n10 // 它有生命值\n11 wizard.healthReport();\n12 // => 恶魔巫师有 10 点生命。看起来健康。\n```\n\
  \n我们也可以对 `constructor functions` 执行同样的事，比如这个 `Druid`：\n\n```\n1 function Druid(){\n\
  2   this.name = 'Druid of the Forest';\n3   this.changesSkinIntoA = function(skin){\n\
  4     console.log(`${this} 将他的皮肤变成了一个 ${skin}`);\n5   }\n6 }\n```\n\n由于这次我们手里拿的是\
  \ `construction function`，我们不再使用 `__proto__` 属性，而是使用 `Druid.prototype`：\n\n```\n\
  1 Druid.prototype = new TeleportingMinion();\n2 Druid.prototype.constructor = Druid;\n\
  ```\n\n并创建了一个这样的 `prototype chain`：\n\n```\n1 Druid => teleportingMinion => minion\n\
  ```\n\n现在，任何使用 `Druid` 实例化的 `druid` 对象：\n\n```\n1 let druid = new Druid();\n2 druid.changesSkinIntoA('elf');\n\
  3 // => druid 将他的皮肤变成了精灵\n```\n\n\n\n每当你尝试访问具有原型的对象的属性或方法时，JavaScript 运行时将尝试在对象内部查找该属性或方法，如果找不到，它将继续沿着\
  \ `prototypical chain`（原型链）向下查找，直到找到为止。这被称为 `delegation-based inheritance`（基于委托的继承），是\
  \ JavaScript 中常见的`原型继承`形式。如果你以这种委托的方式为多个对象使用同一个原型对象，你应该避免在 `prototype` 中存储状态，因为它可能会导致你所有的“派生”对象耦合。\n\
  \n另一种原型继承的形式被称为 `concatenative inheritance`（级联继承）。它由将属性从原型复制到对象组成，并导致对象组合。我们将在书的后面部分介绍它。\n\
  \n## 练习\n\n## 召唤基础：多态\n\n```\n 如果它像龙一样飞行，\n像龙一样喷火，\n像龙一样吃掉平民，\n那么，我的朋友，\n那它就是一条龙。\n\
  \n        - KinnLar Sane,\n        龙猎人, 第 8 时代 \n```\n\n### 多态意味着多种形式\n\n`Polymorphism`（多态）是我们在静态和强类型语言中经常发现的一种机制。在这些语言中，我们利用多态来对具有共同祖先的不同类型复用算法或计算。这些类型要么派生自共享的基类，要么实现相同的接口。\n\
  \n让我们复习如何在 C# 中利用多态。\n\n### C# 中的多态\n\n想象你正在建立一支军队来统治已知世界。在这支不死灵军中，你有一群多样的小兵（不死生物的维护成本更低：骷髅不需要食物，食尸鬼对吃什么并不挑剔）。\n\
  \n看！一个骷髅！\n\n```\n 1 public class Skeleton{\n 2 \tpublic int Health {get;set;}\n\
  \ 3 \tprivate Position position;\n 4 \n 5 \tpublic Skeleton(){\n 6 \t\tHealth =\
  \ 50;\n 7 \t\tposition = new Position();\n 8 \t}\n 9 \n10 \tpublic void MovesTo(int\
  \ x, int y){\n11 \t\tposition.X = x;\n12 \t\tposition.Y = y;\n13 \t}\n14 }\n```\n\
  \n只会移动的骷髅并不是非常实用的武器。你需要赋予它攻击敌人的能力：\n\n```\n 1 public class Skeleton{\n 2 \tpublic\
  \ int Health {get;set;}\n 3 \tprivate int damage;\n 4 \tprivate Position position;\n\
  \ 5 \n 6 \tpublic Skeleton(){\n 7 \t\tHealth = 50;\n 8 \t\tdamage = 10;\n 9 \t\t\
  position = new Position();\n10 \t}\n11 \t\n12 \tpublic void MovesTo(int x, int y){\n\
  13 \t\tposition.X = x;\n14 \t\tposition.Y = y;\n15 \t}\n16 \n17     public void\
  \ Attacks(Skeleton enemySkeleton){\n18         enemySkeleton.Health -= damage;\n\
  19     }\n20 }\n```\n\n好了。现在你有了一个可以攻击其他骷髅的骷髅！耶！让我们想象你最宿敌的敌人有一支巨大的哥布军队：\n\n```\n\
  1 public class Goblin{\n2     public int Hp {get;set;}\n3     \n4 \tpublic void\
  \ MovesTo(int x, int y){\n5 \t\tposition.X = x;\n6 \t\tposition.Y = y;\n7 \t}\n\
  8 }\n```\n\n`Goblin` 不是 `Skeleton`，因此你的骷髅虽然杀力很大，但很难击败那支军队。所以你决定比敌人领先一步，教你的骷髅如何对付哥布林。你专门为哥布林添加了一个新的\
  \ `Attacks` 方法：\n\n```\n1     public void Attacks(Skeleton enemySkeleton){\n2  \
  \       enemySkeleton.Health -= damage;\n3     }\n4 \n5     public void Attacks(Goblin\
  \ goblin){\n6         goblin.Health -= damage;\n7     }\n```\n\n然后你发现，他不仅有哥布林，还有兽人、巨魔、战狼和巨龙。好了，这很简单，你只需要添加多个\
  \ `Attacks` 方法并确保覆盖所有基础情况：\n\n```\n 1     public void Attacks(Skeleton enemySkeleton){\n\
  \ 2         enemySkeleton.Health -= damage;\n 3     }\n 4 \n 5     public void Attacks(Goblin\
  \ goblin){\n 6         goblin.Health -= damage;\n 7     }\n 8 \n 9     public void\
  \ Attacks(Orc orc){\n10         orc.Health -= damage;\n11     }\n 12 \n13     public\
  \ void Attacks(Troll troll){\n14         troll.Health -= damage;\n15     }\n16 \n\
  17     public void Attacks(Warg warg){\n18         warg.Health -= damage;\n19  \
  \   }\n20 \n21     public void Attacks(Wyrm wyrm){\n22         wyrm.Health -= damage;\n\
  23     }\n```\n\n你一定会同意我的，这整件事变得真的太失控了。这是`多态`可以派上用场的一个场景。我们可以通过为所有这些生物定义一个共同的基类来利用多态。这个\
  \ `Monster` 类将封装 `Health`。\n\n```\npublic class Monster {\n    public int Health\
  \ {get;set;}\n}\n```\n\n```\npublic class Skeleton : Monster {\n    private int\
  \ damage;\n    private Position position;\n\n    public Skeleton(){\n        Health\
  \ = 50;\n        damage = 10;\n        position = new Position();\n    }\n\n   \
  \ public void MovesTo(int x, int y){\n        position.X = x;\n        position.Y\
  \ = y;\n    }\n\n    public void Attacks(Skeleton enemySkeleton){\n        enemySkeleton.Health\
  \ -= damage;\n    }\n\n    public void Attacks(Goblin goblin){\n        goblin.Health\
  \ -= damage;\n    }\n\n    public void Attacks(Orc orc){\n        orc.Health -=\
  \ damage;\n    }\n\n    public void Attacks(Troll troll){\n        troll.Health\
  \ -= damage;\n    }\n\n    public void Attacks(Warg warg){\n        warg.Health\
  \ -= damage;\n    }\n\n    public void Attacks(Wyrm wyrm){\n        wyrm.Health\
  \ -= damage;\n    }\n}\n```\n\n等等，我很抱歉，我在思考过程中包含了一些额外的代码。让我按照要求提供提供文本的整洁版本。\n\n\n\
  \n当我们像上文所示定义 `attacks` 方法时，JavaScript 在关于 `monster` 唯一关心的只是它拥有一个 `health` 属性：\n\n\
  ```\n 1 // 一个兽人、一个地精和一座防御塔...\n 2 let orc = { \n 3   name: 'orc', \n 4   health:\
  \ 100, \n 5   toString(){return this.name;}\n 6 };\n 7 let goblin = {\n 8   health:\
  \ 10, \n 9   toString(){return 'goblin';}\n10 };\n11 let tower = {\n12   health:\
  \ 1000, \n13   toString(){ return 'fortified tower';}\n14 };\n15 \n16 skeleton.attacks(orc);\n\
  17 // => Skeleton attacks orc fiercely!\n18 skeleton.attacks(goblin);\n19 // =>\
  \ Skeleton attacks goblin fiercely!\n20 skeleton.attacks(tower);\n21 // => Skeleton\
  \ attacks tower fiercely!\n```\n\nJavaScript 并不关心你传入函数的生物或物体类型。它只关心对象是否暴露了匹配的接口，在在这种情况下就是\
  \ `health` 属性。\n\n我们可以通过做一些疯狂的事情来进一步强化这一观点。在下面的示例中，我们为 `skeleton.attacks` 函数本身增加了一个\
  \ `health` 属性，现在 `skeleton` 就可以攻击它了！\n\n```\n1 skeleton.attacks.health = 50;\n2\
  \ skeleton.attacks(skeleton.attacks);\n3 // => Skeleton attacks function attacks(monster)\
  \ { ...\n4 // OMG 这太元编程了\n5 \n6 console.log(skeleton.attacks.health);\n7 // => 40\n\
  ```\n\n所以，只要对象拥有 `health` 属性，它就会被视为一个根据 `attacks` 方法定义的可以被攻击的对象，无论其继承关系如何。这就是关于*鸭子类型*（duck\
  \ typing）的流行俗言……\n\n> 如果它像鸭子一样走路，像鸭子一样游泳，像鸭子一样叫，那我称它为鸭子。\n\n如果它拥有 `health` 属性，那么它就是一个可以攻击的对象。这就是为什么我声称继承在\
  \ JavaScript 中不像在 C# 中那样实现*多态*的手段。\n\n让我们来看看 C# *多态*与 JavaScript *鸭子类型*之间的差异：\n\n\
  | C# 多态 | JavaScript 鸭子类型 |\n| --- | --- |\n| 继承自基类或实现接口将决定你是否可以对特定类型使用*多态*。 | 在\
  \ JavaScript 中，这一切取决于在评估对象时是否具有预期的属性或方法。 |\n| 在 C# 中，你在函数签名中对函数内部可以使用的类型建立了显式预期。\
  \ | 在 JavaScript 中，预期取决于该对象在函数实现内部是如何使用的。 |\n| 为了利用多态，你需要对此非常有针对性，因为它要求应用程序中具有特定的架构。在实践中，这意味着你需要创建额外的类或接口。\
  \ | JavaScript 鸭子类型在无需额外投入的情况下为你提供了最细粒度的多态性。你不需要创建额外的类或等价物。 |\n| 代码作者的意图非常明确，因为只有在结构到位的情况下，多态才能起作用。C#\
  \ 中的扩展点非常显式。 | 在 JavaScript 中，任何一点都是可扩展的。 |\n\n### 总结\n\n在本章中，我们简要回顾了 C# 中*多态*的概念，以及你如何将其作为代码复用的机制和创建可扩展应用程序的手段。\n\
  \n接下来，你学习了*多态*在 JavaScript 中通过*鸭子类型*概念是如何工作的，这种思想是**对象的定义并不取决于它是什么，而取决于它能做什么**。因此，如果某东西像鸭子一样走路、像鸭子一样游泳、像鸭子一样叫，你就把它当作鸭子对待。\n\
  \n我们通过 C# *多态*与 JavaScript *鸭子类型*的简要比较结束了本章，以及后者如何以更少的代码和更简单的设计实现 C# 能做的一切切。\n\n\
  ### 练习题\n\n## 白塔召唤：在 JavaScript 中模拟 C# 经典继承\n\n```\n 生命如一条流水，\n你永远无法两次触摸同一片水。\n\
  流去的水将永不再流回。\n所以请享受生命的每一秒。\n\n生命并非流水，\n但现在你对生命有了了更多了解。\n\n        - Kinvalso Immax\n\
  \        JavaScript 魔法师 2 时代，\n        《教学原理》\n```\n\n### 听过经典继承吗？\n\n在本章中，我们将深入研究如何在\
  \ JavaScript 中模拟*经典继承*，以达到与 C# 中实现的操作最接近的等。我们将关注在 *ES6 类*之前我们拥有的替代方案，以便你即使受限于 *ES5*\
  \ 也能使用*类*。更棒的是，这样你就可以理解 *ES6 类*的底层实现了，它们只是 JavaScript *原型继承*模型上的语法糖。\n\n我们将首先在 JavaScript\
  \ 中模拟一个单一的 C# *类*，并尝试寻找与 C# 构造结构（如访问修饰符、静态类和方法重载）对应的等价物。然后我们将继续将知识从单个类扩展到多个类，从而实现类似于\
  \ C# *经典继承*的东西。这种技术将允许你在 JavaScript 中的工作方式就像你通常在 C# 中一样，使用*类*分类法构建领域模型，并与*类*的实例进行工作。\n\
  \n### 在 JavaScript 中模拟 C# 类\n\n为了在 JavaScript 中创建*类*的等价物，你需要将一个*构造函数*与*原型*（prototype）结合起来。让我们快速回顾这些构造结构，看看将它们结合起来如何产生类似于\
  \ C# 的结果。\n\n#### 构造函数\n\n*构造函数*允许我们创建具有相同属性的对象。它们充当对象创建的配方，并代表自定义类型：\n\n```\n1\
  \ function Barbarian(name){\n2   this.name = name;\n3   this[\"character\"] = \"\
  barbarian\";\n4   this.hp = 200;\n5   this.weapons = [];\n6 \n7   this.talks = function(){\
  \ 8     console.log(\"I am \" + this.name + \" !!!\");\n9   };\n10 \n11   this.equipsWeapon\
  \ = function(weapon){ \n12     weapon.equipped = true;\n13     this.weapons.push(weapon);\n\
  14   };\n15 \n16   this.toString = function(){\n17     return this.name;\n18   };\n\
  19 }\n```\n\n注意*构造函数*不仅像 C# 那样用一组值初始化对象，还决定了对象将拥有哪些属性。这意味着**构造函数实际上既是构造函数也是类定义**。\n\
  \n定义了构造函数后，你可以像 C# 一样使用 `new` 关键字创建一个新对象：\n\n```javascript\nlet conan = new Barbarian(\"\
  Conan, the Barbarian\");\n```\n\n这个新实例的类型为 `Barbarian`，正如 `instanceof` 运算符所示：\n\n\
  ```\n1 console.log(`Conan is a Barbarian: ${conan instanceof Barbarian}`);\n2 //\
  \ => Conan is a Barbarian: true\n3 \n4 console.log(`Conan is an Object: ${conan\
  \ instanceof Object}`);\n5 // => Conan is an Object: true\n```\n\n并且它的所有属性都是公开的：\n\
  \n```\n1 conan.talks();\n2 // => I am Conan, the Barbarian!!!\n3 \n4 console.log(conan.name);\n\
  5 // => Conan, The Barbarian\"\n6 \n7 conan.equipsWeapon({\n8   name: \"two-handed\
  \ sword\",\n9   type: \"sword\",\n10   damage: \"2d20+10\",\n11   material: \"cimmerian\
  \ steel\",\n12   status: \"well maintained\"\n13 });\n14 \n15 console.log(`Conan\
  \ has these weapons: ${conan.weapons}`);\n16 // => Conan has these weapons: two-handed\
  \ sword\n```\n\n### 原型继承\n\n\n\n\nJavaScript 中的每个 `constructor function`（以及每个函数）都有一个\
  \ `prototype` 属性。该属性包含一个对象，该对象将作为 `prototype` —— 为所有通过 `new` 关键字调用 `constructor\
  \ function` 创建的对象提供共享属性。\n\n```\n1 // 每个函数都有一个 prototype 属性\n2 console.log(`Barbarian.prototype:\
  \ ${Barbarian.prototype}`);\n3 // => Barbarian.prototype: [object Object]\n```\n\
  \n`prototype` 对象也有一个 `constructor` 属性，它指向原来的 `constructor` 函数：\n\n```\n1 // 并且 prototype\
  \ 有一个 constructor 属性 \n2 // 指向该函数\n3 console.log(`Barbarian.prototype.constructor:\
  \ \n4   ${Barbarian.prototype.constructor}`);\n5 // => Barbarian.prototype.constructor:\
  \ \n6 //  function Barbarian(name) {...}\n```\n\n我们可以轻松地验证使用该 `constructor function`\
  \ 实例化的对象是如何从 `prototype` 对象继承属性和方法的。如果我们取上一个示例中的 `prototype`，并用一个简单的 `saysHi` 函数来扩展它：\n\
  \n```\n1 Barbarian.prototype.saysHi = function() { \n2   console.log(\"Hi! I am\
  \ \" + this.name);\n3 }\n```\n\n然后我们实例化两个粗野野人：\n\n```\n1 var krull = new Barbarian(\"\
  krull\");\n2 var conan = new Barbarian(\"Conan\");\n```\n\n我们可以看到 `krull` 和 `conan`\
  \ 两个对象都暴露了 `saysHi` 方法，尽管它并不是 `Barbarian` `constructor function` 的一部分（该函数只有 `talks`、`equipsWeapon`\
  \ 和 `toString` 方法）：\n\n```\n1 krull.saysHi();\n2 // => Hi! I am krull\n3 \n4 conan.saysHi();\n\
  5 // => Hi! I am Conan\n```\n\n这种之所以可行是因为实例 (`krull`) 和 `prototype` (`Barbarian.prototype`)\
  \ 之间存在 `prototype chain`（原型链），这允许实例将方法调用派发给 `prototype`。\n\n为了避免在每次想要增强原型时都编写：\n\
  \n```\n1 ConstructorFunction.prototype.property = ...;\n```\n\n一种常见的惯用方法是将 `prototype`\
  \ 赋值给一个新对象：\n\n```\n 1 // 这样：\n2 var barbarianPrototype = {\n3   constructor: Barbarian\n\
  4   saysHi: function(){console.log(\"Hi! I am \" + this.name);} \n5 }\n6 Barbarian.prototype\
  \ = barbarianPrototype;\n7 \n8 // 或者简单地：\n9 Barbarian.prototype = {\n10   constructor:\
  \ Barbarian\n11   saysHi: function(){console.log(\"Hi! I am \" + this.name);} \n\
  12 }\n```\n\n这种模式可以避免你编写更多代码，并为属于原型的属性提供了一个更一致、统一的视图。\n\n现在我们已经回顾了 `constructor\
  \ functions` 和 `prototypes`，让我们看看将它们结合起来如何让我们更接近 C# 的 `inheritance model`。\n\n###\
  \  Constructor Function + Prototype = Class\n\nJavaScript 中与 C# `class` 最接近的等价物是\
  \ `constructor function` 和 `prototype` 对：\n\n*   **构造函数定义了一个带有系列属性的自定义类型**。它将决定该自定义类型的实例将拥有哪些特定的属性。**通常，它将包含类的成员**。\n\
  *   **原型提供了一系列在给定类型的所有实例间共享的方法**。**通常，它将包含类的方法**。它也是类与类之间的桥梁，是通过 `prototype chain`\
  \ 将它们连接起来实现 `class` 继承的手段。\n\n将 `constructor` 和 `prototype` 结合，我们可以如下定义一个与第一个 `Barbarian`\
  \ 类似的 `ClassyBarbarian` `class`：\n\n```\n 1 // 构造函数：\n 2 //   - 定义了 ClassyBarbarian\
  \ 类型\n 3 //   - 定义了 ClassyBarbarian \n 4 //     实例将拥有的属性\n 5 //\n6 function ClassyBarbarian(name){\n\
  \ 7   this.name = name;\n 8   this[\"character class\"] = \"barbarian\";\n 9   this.hp\
  \ = 200;\n10   this.weapons = [];\n11 }\n12 \n13 // 原型：\n14 //   - 定义了在 \n15 //\
  \     所有 ClassyBarbarian 实例间共享的方法\n16 //\n17 ClassyBarbarian.prototype = {\n18 \
  \  constructor: ClassyBarbarian,\n19   talks: function(){ \n20     console.log(\"\
  I am \" + this.name + \" !!!\");\n21   },\n22   equipsWeapon: function(weapon){\
  \ \n23     weapon.equipped = true;\n24     this.weapons.push(weapon);\n25     console.log(`${this.name}\
  \ grabs a ` + \n26                 `${weapon.name} from the cavern floor`);\n27\
  \   },\n28   toString: function(){\n29     return this.name;\n30   },\n31   saysHi:\
  \ function (){ \n32     console.log(\"Hi! I am \" + this.name);\n33   }\n34 };\n\
  ```\n\n我们可以像在 C# 中使用 `class` 一样使用这个新类。我们使用 `new` 运算符来实例化它：\n\n```\n1 var logen =\
  \ new ClassyBarbarian(\"Logen\");\n```\n\n并随意地与它交互：\n\n```\n1 logen.saysHi();\n\
  2 // => Hi! I am Logan\n3 \n4 logen.talks();\n5 // => I am Logan !!!\n6 \n7 logen.equipsWeapon({name:\
  \ \"axe\"});\n8 // => Logan grabs a axe from the cavern floor\n9 \n10 console.log(logen.toString());\n\
  11 // => Logan\n```\n\n这与我们之前的 `constructor function` 示例有什么区别？从消费者的角度来看它们是一样的，但\
  \ `prototype` 在两个方面改进了我们的示例：\n\n1. 原型中的所有方法都在实例间共享。减少了应用程序的内存占用。\n2. 这种技术为后续介绍的功能铺了道路。\n\
  \n#### 访问修饰符\n\n遗憾的是，JavaScript 没有内置访问修饰符的概念：*public*、*protected* 和 *private* 都不存在。你添加到对象的任何属性都是公开的，任何可以访问对象的人都可以访问。\n\
  \n尽管如此，可以使用两种模式来实现类似于私有变量和方法以及信息隐藏：\n\n*   **闭包 (Closures)**：你可以使用它们来捕获外部作用域的变量（在这种情况下，类方法捕获变量）。这些变量不是对象的一部分，它们被对象方法捕获，因此无法通过对象直接访问。\n\
  *   **ES6 Symbols**：当你使用 *symbols* 为对象的属性和方法索引时，因为 symbol 是唯一的，只有当你拥有该 symbol 时，才能访问这些属性或方法。使用\
  \ *symbol* 时，对象有一个由该 *symbol* 索引的属性，它是公开的，但即使你拥有对象，由于你没有该 symbol 的引用，你也无法访问该属性。\n\
  \n让我们看看如何将这些方法分别应用于我们的 JavaScript *classes*，以及两种选择的影响。\n\n##### 使用闭包实现类和信息隐藏\n\n\
  为了使用*闭包* 实现数据隐私，你需要一个闭了变量的函数。如果我们想遵循“构造函数处理状态+原型处理行为”的模式，这就会带来一个小问题。这是因为 *prototype*\
  \ 方法定义在 *constructor* 函数之外，因此它们无法闭包在其中定义的任何变量。\n\n因此，如果我们不再希望暴露野人类的 `weapons` 属性：\n\
  \n\n\n\n```javascript\n// 构造函数\nfunction PrivateBarbarian(name){\n  // 私有成员\n  var\
  \ weapons = [],\n      hp = 200;\n\n  // 公有成员\n  this.name = name;\n  this[\"character\
  \ class\"] = \"private barbarian\";\n  this.equipsWeapon = function(weapon){ \n\
  \    weapon.equipped = true;\n    // 此函数闭包了 weapons 变量\n    weapons.push(weapon);\n\
  \    console.log(`${this.name} grabs a ${weapon.name} \n      from the cavern floor`);\n\
  \  };\n  this.toString = function(){\n    if (weapons.length > 0)\n      return\
  \ `${this.name} looks angry and \n              wields a ${weapons.find(w => w.equipped).name}`;\n\
  \    else \n      return `${this.name} looks peaceful`;\n  }\n}\n\n // 原型:\nPrivateBarbarian.prototype\
  \ = {\n    constructor: PrivateBarbarian,\n    talks: function(){ \n        console.log(\"\
  I am \" + this.name + \" !!!\");\n    },\n    saysHi: function (){ \n        console.log(\"\
  Hi! I am \" + this.name);\n    }\n};\n```\n\n在这一段代码中，我们做了以下更改：\n\n*   我们修改了*构造函数*，使得\
  \ `weapons` 变量不再是 `Barbarian` 实例的属性，而是函数体内部的一个简单变量。\n*   我们将 `equipsWeapon` 函数从*原型*移动到了*构造函数*中，并更新了其体，使其闭包了\
  \ `weapons` 变量。\n\n结果，如果我们创建一个新的 `PrivateBarbarian` 实例，它将不会向外部世界暴露任何 `weapons` 属性：\n\
  \n```javascript\nvar privateBarbarian = new PrivateBarbarian('krox');\n \nconsole.log(`Barbarian\
  \ weapons: ${privateBarbarian.weapons}`);\n // => 野蛮人的武器: undefined\n // 我们无法访问野蛮人的武器，因为\n\
  \ // 它们不是对象的一部分\n```\n\n变量 `weapons` 仍然存在，并且其作用*就像*它是对象的私有成员一样。事实上，你可以轻松地验证闭包了该变量的\
  \ `equipsWeapon` 仍然有效：\n\n```javascript\nprivateBarbarian.equipsWeapon({name:'Two-handed\
  \ Hammer'});\n // => krox grabs a Two-handed Hammer from the cavern floor\n \nconsole.log(privateBarbarian.toString());\n\
  \ // => krox looks angry and wields a Two-handed Hammer\n```\n\n就像你可以拥有私有成员一样，你也可以拥有私有方法。假设我们为野蛮人有一些格式化函数，我们不希望向公众暴露。我们可以按照之前使用的相同模式将它们设为私有：\n\
  \n```javascript\n function PrivateBarbarian(name){\n  // 与前一个示例未变的代码\n \n  this.toString\
  \ = function(){\n    if (weapons.length > 0) return formatWeaponizedBarbarian();\n\
  \    else return formatPeacefulBarbarian();\n  }\n \n  // \"私有\"方法\n  function formatWeaponizedBarbarian(){\n\
  \    return `${name} looks angry and wields \n            a ${weapons.find(w =>\
  \ w.equipped).name}`;\n  }\n \n  // \"私有\"方法\n  function formatPeacefulBarbarian(){\n\
  \    return `${name} looks peaceful`;\n  }\n }\n```\n\n`formatWeaponizedBarbarian`\
  \ 和 `formatPeacefulBarbarian` 函数现在是私有的，并被作为野蛮人公共接口部分的 `toString` 方法所闭包。\n\n总结来说，如果你想使用*闭包*来管理*类*的*数据隐私性*，你需要在*构造函数*内部定义方法，而不是在*原型*中。这有一个可能不会立即察觉的注意事项：类的每个实例都将拥有它自己的方法属性，因此这些方法不会通过*原型*被所有实例共享。结果，将闭包作为你的*信息隐藏*策略将迫使你比比方案更大的内存开销。\n\
  \n### 使用 ES6 Symbols 实现类和信息隐藏\n\n使用*ES6 symbols* 允许你实现*数据隐私性*并将方法保留在*原型*中。技巧在于是将你的\
  \ symbols 也设为私有。\n\n为了实现这一点，我们将定义一个非常简单的*模块*。JavaScript *模块* 允许你封装相关功能部分，并根据需要将其暴露给应用程序的其他部分，这样它们就能完美地保持我们的\
  \ symbols 为私有。我们将使用以下模式创建一个简单的 `characters` 模块来存储我们的字符：\n\n```javascript\n // 一个简单的模块\
  \ \n(function(characters){\n    characters.SymbolicBarbarian = SymbolicBarbarian;\n\
  \ \n    // 等等\n}(window.characters = window.characters || {}))\n \n // 外部世界只能访问我们暴露的内容\n\
  \ // 通过 characters 对象\n```\n\n\n\nC# 中的静态成员和方法在给定类的所有实例之间共享的。它们只能访问其他静态成员和方法，并通过类名后跟成员或方法名\
  \ `Class.staticProperty` 来进行访问。它们通常用于收集相关的工具方法，这些方法不需要共享状态，因此不需要类实例即可操作。\n\n你可以通过为`构造函数`（constructor\
  \ functions）添加新属性在 JavaScript 中模拟`静态成员和方法`。例如，我们可以在 `ClassyBarbarian` 中创建几个工厂方法，以便创建带有常用预设的野蛮人：\n\
  \n```\n 1 // 我们扩展了 ClassyBarbarian 构造函数 \n 2 // 来自之前的示例函数\n 3 // 添加了两个新属性\n 4 ClassyBarbarian.default\
  \ = function(){ \n 5   return new Barbarian('default barbarian');\n 6 };\n 7 \n\
  \ 8 ClassyBarbarian.swordWieldingBarbarian = function(){\n9   var barbarian = new\
  \ Barbarian('sword wielding barbarian');\n10   barbarian.equipsWeapon({name: 'sword'});\n\
  11   return barbarian;\n12 };\n```\n\n由于这些是`构造函数`的属性而非任何特定实例的属性，因此只有通过对`构造函数`的引用才能访问它们。\n\
  \n```\n1 var defaultBarbarian = ClassyBarbarian.default();\n2 console.log(defaultBarbarian.name);\n\
  3 // => default barbarian\n4 \n5 var swordWieldingBarbarian = \n6   ClassyBarbarian.swordWieldingBarbarian();\n\
  7 console.log(swordWieldingBarbarian.name);\n8 // => sword wielding barbarian\n\
  ```\n\n此外，这些成员或方法只能访问其他`静态`成员和方法，因为它们没有绑定到任何特定实例。\n\n### 静态类\n\n`静态类`（static class）是指只有静态成员和方法的类，它是密封的（sealed）且无法实例化。与你在这些示例中看到的类似，你可以将`静态类`定义为一个只包含`静态成员和方法`的`构造函数`——即赋值给`构造函数`本身的属性。\n\
  \n这会带给你一种与在 C# 中使用`静态类`相似的感觉，但稍微有一点牵强。这是因为你仍然可以使用该`构造函数`实例化对象，并使其成为继承链的一部分。你可以通过在调用`构造函数`时抛出错误来解决这两个问题：\n\
  \n```\n1 function DateHelpers(){ throw Error('static class'); };\n2 DateHelpers.ToJavaScriptMonth\
  \ = function(month){\n3     // JavaScript 的月份从 0 开始\n4     return month - 1;\n5\
  \ }\n```\n\n尽管这可能是在试图将 C# 的方式引入 JavaScript 得太深，你可能会发现使用简单的`对象初始化器`（object initializer）是更好的解决方案。\n\
  \n### 方法重载\n\n在`实用函数模式：方法重载`中，我们学习了 JavaScript 并没有内置支持方法重载。尝试通过为相同方法的不同参数提供不同的实现来重载方法，只会用重载版本覆盖原始方法。然而，我们可以遵循一些不同的模式来实现相同的效果：\n\
  \n*   **参数检查**：检查传递给函数的参数个数以及它们的类型，然后决定执行什么。\n*   **选项对象**：提供一个包含方法参数的`options`对象。你将获得命名参数和高扩展性的益处。\n\
  *   **ES6 默认值和解构**：`Defaults` 默认值允许你提供不同的签名，如果某些参数没有传入函数，将使用默认值。`Destructuring`\
  \ 解构赋值让你以非常直接的方式解析选项对象。\n*   **函数式编程和多态函数**：通过组合多个函数来定义多态函数，这些函数会被轮流调用直到从其中任何一个获得结果。这种解决方案具有极强的扩展性。\n\
  \n你可以在本章定义的`类`中使用这些任何一种方法，如果你需要复习，请查看*实用函数模式：方法重载]。\n\n### 在 JavaScript 中模拟经典继承\n\
  \n让我们总结一下到目前为止所学的内容：\n\n*   我们可以通过`构造函数和原型对`（constructor function and prototype\
  \ pair）模拟单个 C# `class`。\n*   `构造函数`通常定义每个实例的成员，而`原型`（prototype）定义其方法。\n*   JavaScript\
  \ 没有内置的访问修饰符，但你可以通过闭包和 `ES6 symbols`来获取`私有成员`。闭包迫使你在使用方法之前将它们从`原型`移动到`构造函数`中。\n\
  *   你可以通过增强其`构造函数`来为`class`添加静态成员和方法。\n*   JavaScript 没有内置的方法重载，但有几种技术你可以用来自己实现方法重载。\n\
  \n现在我们已经到了可以在 JavaScript 中表示类的这一步。但是**如何从单个类转变为继承树并模拟经典继承呢？**\n\n在创建你的`class`时，可以通过遵循以下两个步骤来模拟经典继承：\n\
  \n1.  **调用基类构造函数**：确保每个`构造函数`都使用 `call` 或 `apply` 调用其基类型`构造函数`。这将确保`class`的任何实例都包含在每个和每一个基类`class`中定义的全部属性（正如它们在每个`构造函数`中定义一样）。\n\
  2.  **使用原型继承**：使用原型继承来确保`class`的任何实例都能从每个基类`class`继承方法（因为这些方法包含在每个`原型`中）。\n\n让我们通过示例查看如何实现`经典继承`。假设我们要开发一个魔法战斗模拟器来磨炼我们作为将军和战略家的技能。我们可以将这个战斗模拟器设计成具有以下领域模型的游戏：\n\
  \n```\n1 Creature -> MovingGameObject -> DrawableGameObject -> GameObject\n```\n\
  \n其中继承树中的不同对象具有不同的职责：\n\n*   `GameObject`：代表游戏场景中的任何游戏对象。它提供了在游戏循环的每个游戏节拍中更新游戏对象状态的功能。\n\
  *   `DrawableGameObject`：代表游戏场景中可见的游戏对象子集，例如军队中的士兵。它提供了在屏幕上绘制这些对象的功能。\n*   `MovingGameObject`：代表可以在屏幕内移动的可绘制游戏对象子集。它提供了在屏幕上移动这些对象的功能。\n\
  *   `Creature`：军队中的特定生物。它为每种生物提供特定的属性、功能、图形等（野蛮人、巫师、萨满、巨魔、小鬼等等可能的生物）。\n\n除了这个领域之外，我们还有一个`GameEngine`类，用于控制游戏循环、收集用户输入，并更新和绘制一组`GameObject`对象集合，这些对象代表士兵、弹药、地形、天气条件等……\n\
  \n该领域部分的简化版本大致如下所示。从`DrawableGameObject`开始：\n\n\n\n\n\n```javascript\n// 继承层次:\n\
  //   MovingGameObject -> DrawableGameObject -> GameObject\n\nfunction DrawableGameObject(sprite){\n\
  \  // 调用基类构造函数\n  GameObject.call(this);\n  this.sprite = sprite;\n}\n\n// 在 DrawableGameObject\
  \ 和 GameObject 之间建立原型继承\nDrawableGameObject.prototype = \n  Object.create(GameObject.prototype);\n\
  DrawableGameObject.prototype.constructor = DrawableGameObject;\n\n// 特定的 DrawableGameObject\
  \ 原型方法\nDrawableGameObject.prototype.draw = function(){\n  console.log(\"drawing\
  \ sprite: \" + this.sprite);\n  // 绘制精灵\n};\n```\n\n继续编写 `MovingGameObject`：\n\n\
  ```javascript\n// 辅助 Position 类\nfunction Position(x,y){\n  this.x = x;\n  this.y\
  \ = y;\n}\nPosition.prototype.toString = function(){\n  return \"[\" + this.x +\
  \ \",\" + this.y + \"]\";\n}\n\n// GameObject 类\nfunction MovingGameObject(position,\
  \ sprite) {\n  // 调用基类构造函数\n  DrawableGameObject.call(this, sprite);\n  this.position\
  \ = position;    \n}\n\n// 在 MovingGameObject 和 DrawableGameObject 之间建立原型继承\nMovingGameObject.prototype\
  \ = \n  Object.create(DrawableGameObject.prototype);\nMovingGameObject.prototype.constructor\
  \ = MovingGameObject;\n\nMovingGameObject.prototype.movesTo = function(newPosition){\n\
  \  this.position = newPosition;\n  console.log(`${this} moves to ${newPosition}`);\n\
  }\n```\n\n在这个示例中，你有两个类：`DrawableGameObject` 是一个可以通过 `sprite`（图像）在屏幕上绘制的物体，而 `MovingGameObject`\
  \ 代表某种可以在二维空间中移动的对象类型。你可以通过以下方式验证：\n\n1. `MovingGameObject` 构造函数通过 `DrawableGameObject.apply(this,\
  \ sprite);` 调用了父类构造函数。这确保了移动的游戏对象将同时拥有 `sprite` 和 `position` 属性。\n\n2. `MovingGameObject.prototype`\
  \ 对象是一个新对象，它反过来以 `DrawableGameObject.prototype` 作为原型。这确保了移动的游戏对象可以访问 `MovingGameObject`\
  \ 和 `DrawableGameObject` 的原型方法。\n\n我们可以用另一个类——明智的 `Shaman`（萨满）来扩展我们的继承树：\n\n```javascript\n\
  // 继承层次:\n//   Shaman -> MovingGameObject -> DrawableGameObject\n\nfunction Shaman(name,\
  \ position, sprite){\n  // 调用基类构造函数\n  MovingGameObject.call(this, position, sprite);\n\
  \  this.name = name;\n}\n\n// 在 Shaman 和 MovingGameObject 之间建立原型继承\nShaman.prototype\
  \ = Object.create(MovingGameObject.prototype);\nShaman.prototype.constructor = Shaman;\n\
  \n// Shaman 特有方法\nShaman.prototype.toString = function(){\n  return this.name;\n\
  };\nShaman.prototype.heals = function(target){\n  console.log(`${this} heals ${target}\
  \ (+ 50hp)`);\n  target.hp += 50;\n}\n```\n\n我们可以通过创建一个实例并进行测试，来验证 `Shaman` 是否按预期工作：\n\
  \n```javascript\nvar koloss = new Shaman(\"Koloss\", new Position(0,0), \"koloss.jpg\"\
  );\n\nkoloss.movesTo(new Position(5,5))\n// => Koloss moves to [5,5]\n\nkoloss.draw()\n\
  // => drawing sprite: koloss.jpg\n\nkoloss.heals(conan);\n// => Koloss heals Conan,\
  \ the Barbarian\n```\n\n#### 方法重写（Method overriding）\n\n你可以遵循在构造函数中使用的类似模式，来重写或扩展基类中定义的任何方法。也就是说，为了重写一个方法，你使用\
  \ `call` 或 `apply` 调用基类中的方法。\n\n让我们在一个新类型的萨满中重写 `heals` 方法，这就是神秘的 `WhiteShaman`（白萨满），它除了治愈伤口外，还能移除队友身上所有的疾病，如诅咒、中毒和疾病：\n\
  \n```javascript\n// 构造函数\nfunction WhiteShaman(name, position, sprite){\n    //\
  \ 调用基类构造函数\n    Shaman.call(this, name, position, sprite);\n}\n\n// 原型\nWhiteShaman.prototype\
  \ = Object.create(Shaman.prototype);\nWhiteShaman.prototype.constructor = WhiteShaman;\n\
  \n// WhiteShaman 特有方法\nWhiteShaman.prototype.castsSlowCurse = function(target){\n\
  \  console.log(`${this} casts slow on ${target}.`);\n  console.log(`${this} removes\
  \ ailments from ${target}`);\n};\n\nWhiteShaman.prototype.heals = function(target){\n\
  \  // 调用基类方法\n  Shaman.prototype.heals.call(this, target);\n  if (target.curses)\
  \ {\n    target.curses.push('slow');\n  }\n  if (target.poisons) {\n    target.poisons.push('poison');\n\
  \  }\n  if (target.diseases) {\n    target.diseases.push('disease');\n  }\n}\n```\n\
  \n在这个示例中，`WhiteShaman.prototype.heals` 重写了 `Shaman.prototype.heals`，并扩展了移除诅咒、中毒和疾病的新功能。这段代码\
  \ `Shaman.prototype.heals.call(this, target)` 在 `this` 的上下文中执行了 `Shaman.prototype.heals`\
  \ 方法。让我们看看 `WhiteShaman` 在治愈病人时表现如何：\n\n```javascript\nvar koloss = new WhiteShaman('Koloss',\
  \ new Position(0,0), \"koloss.png\");\n\nkoloss.castsSlowCurse(conan);\n// => Koloss\
  \ casts slow on Conan.\n// => Koloss removes ailments from Conan\n\nkoloss.heals(conan);\n\
  // => Koloss heals Conan, the Barbarian\n// => Koloss cleanses all ailments\n```\n\
  \n注意，你并不强制要求扩展方法。你也可以通过简单的隐藏（shadowing）来完全覆盖它。这利用了 JavaScript 运行时如果当前对象上存在该方法，则不会调用原型链方法的特性。\n\
  \n假设你想完全替换白萨满的 `toString` 方法。你可以这样编写一个新的 `toString` 方法：\n\n```javascript\n// 你不需要重写并扩展方法\n\
  // 你可以完全替换它\n// JavaScript 运行时将确保调用正确的方法\nWhiteShaman.prototype.toString = function(){\n\
  \    return `${this.name} the White Shaman`;\n}\n```\n\n下面你可以看到 `toString` 方法不再返回\
  \ `Koloss`，而是返回 `Koloss the White Shaman`：\n\n```javascript\nconsole.log(koloss.toString());\n\
  // => Koloss the White Shaman\n```\n\n### 简化 ES5 中的经典继承\n\n现在到了这一章的末尾，你可能会认为在 JavaScript\
  \ 中编写类是一项巨大的工作。**你是完全正确的**。这就是为什么编写一个辅助函数来让你工作更轻松并移除样板代码是有帮助的。\n\n理想情况下，我们定义一个辅助函数，允许通过一次性提供所有组件来创建一个类：\n\
  \n*   一个构造函数\n\n*   一个 `prototype`（原型）\n\n*   （可选的）一个用于扩展或派生的 `class`\n\n这个函数 `newClass`\
  \ 是此类辅助函数的一种可能实现：\n\n\n\n\n\n```javascript\nfunction newClass({constructor, \n \
  \                  methods:prototype, \n                   extends:BaseClass=Object}){\n\
  \n  // helper function that creates a new constructor function\n  // that calls\
  \ the base class constructor function\n  function extendConstructor(ctor, ctorToExtend){\n\
  \     return function newCtor(...args){\n        ctorToExtend.apply(this, args)\n\
  \        ctor.apply(this, args);\n        return this;\n     };\n  }\n         \
  \           \n  // make sure constructor calls base class constructor\n  let extendingConstructor\
  \ = extendConstructor(constructor, BaseClass);\n  \n  // set the class prototype\
  \ to an object that has\n  // the base class prototype as prototype\n  extendingConstructor.prototype\
  \ = Object.create(BaseClass.prototype);\n  extendingConstructor.prototype.constructor\
  \ = extendingConstructor;\n \n  // extend the prototype with the *class* methods\n\
  \  Object.assign(extendingConstructor.prototype, prototype);\n                 \
  \   \n  return extendingConstructor;\n}\n```\n\n`newClass` 函数接收构建一个*class*所需的三个要素：`constructor`、`prototype`\
  \ 和 `base class`（基类），并为你将它们全部组合在一起。它将：\n\n1. 确保创建一个新的*constructor function*（构造函数），该函数会在你自己的类*constructor*\
  \ 之前调用基类的*constructor*。\n2. 通过创建一个具有基类*class* prototype 的对象，并将其与你自己的*class* prototype\
  \ 组合，从而组合出一个合适的 *prototype*。\n\n如果你不提供基*class* 来扩展它，它将使用 `Object` *class* 作为默认值。\n\
  \n让我们来看看 `newClass` 函数的运行效果，并定义一个新的 `Berserker` *class*：\n\n```javascript\nvar Berserker\
  \ = newClass({\n  constructor: function(name, position, sprite, animalSpirit){\n\
  \    this.animalSpirit;\n  },\n  methods: {\n    rageAttack: function(target){\n\
  \      console.log(`${this} screams and hits ${target} \n        with a terrible\
  \ blow`);\n      target.hp -= 100;\n    }\n  },\n  extends: ClassyBarbarian\n});\n\
  ```\n\n*感觉好多了对吧？* 现在你可以开始使用你的 `Berserker` *class* 为你的军队招募无所畏（且疯狂）的战士了：\n\n```javascript\n\
  var dwarfBerserker = new Berserker(\n                     'Gloin', \n          \
  \           new Position(0,0), \n                     'gloin.png', \n          \
  \           'badger');\n\ndwarfBerserker.rageAttack(\"conan\");\n// => Gloin screams\
  \ and hits conan with a terrible blow\n\ndwarfBerserker.equipsWeapon({name: 'Double\
  \ bearded Axe'});\n// => Gloin grabs a Double bearded Axe from the cavern floor\n\
  ```\n\n## 结语\n\n在本章中，你学习了如何在 JavaScript 中模拟 C# 的 *classes* 和 *classical inheritance*（经典继承）。\n\
  \n你看到了组合一个 *constructor function* 和 *prototype* 对象如何让你创建一个类似于类的事物，其中 *constructor\
  \ function* 定义了你的*class members*，而 *prototype* 定义了你的*class methods*。然后你学习了使用闭包和符号来实现\
  \ *data privacy*（数据私有），以及如何在 JavaScript 中编写 *static members, methods and classes*（静态成员、方法和类）。\n\
  \n我们继续将范围从单个类扩展到多个类，你发现了如何实现等同于 C# *classical inheritance* 的体验。我们可以通过两个步骤来实现：\n\n\
  1. 为派生*class constructor* 调用基*class* *constructor function*；\n2. 在每个 *class* prototype\
  \ 之间建立 *prototypical chain*（原型链）。\n\n我们在章节末尾讨论了如何覆盖和扩展 *class* 方法，以及如何使用我们自己设计的辅助函数来简化\
  \ JavaScript 中的 *class inheritance*。\n\n如果你稍微回想一下在本章中学到的内容，你可能会疑惑：*真的吗？在 JavaScript\
  \ 中写一个类需要这么难吗？*。这正是 *ES6 classes* 试图解决的问题，它们提供了一种更熟悉、更简单且优雅的语法来在 JavaScript 中编写\
  \ *classes*。非常方便的是，下一章的主题恰好就是 *ES6 classes*。\n\n### 练习题\n\n## 白塔召唤增强版：ES6 类的魅力\n\
  \n```text\n 类的用处在于它们\n让我们能够以一种简单的抽象方式\n呈现我们周围的世界，\n 将无限复杂的世界\n简化为眼下的问题。\n\n为你那无所不能的军队\n\
  编写召唤咒？\n你可能不需要为你的\n生物建立消化系统模型\n\n        - RaezIm Rurat\n        Kwarok 之神\n```\n\
  \n### 使用 ES6 类更快地创建这些单位！\n\n在上一章中，你学习了如何在不依赖 *ES6 classes* 的情况下在 JavaScript 中实现\
  \ *classes*。这让你处于学习 *ES6 classes* 的绝佳位置：\n\n1. 现在你对 *ES6 classes* 的底层实现有了深入的理解，它们只是\
  \ *constructor functions* 和 *prototypes* 的语法糖。这不仅有助于你理解 *ES6 classes* 如何工作，还能帮助你理解它们与\
  \ JavaScript 其他部分的关系。\n2. 你亲身经历了编写大量模板代码来实现等同于 *classes* 和 *classical inheritance*\
  \ 的繁琐。在这一背景下，*ES6 classes* 的价值主张变得显而易见。\n\n### 从 ES5 “Classes” 到 ES6\n\n在上一节中，你学习了如何通过组合\
  \ *constructor function* 和 *prototype* 来获得等同于类的类的效果：\n\n```javascript\n// 构造函数：\n\
  //   - 定义了 Classyarian 实例\nfunction Classyarian(name){\n  this.name = name;\n  this[\"\
  character class\"] = \"barbarian\";\n  this.hp = 200;\n  this.weapons = [];\n}\n\
  \n// 原型：\n//   - 定义了实例共享的方法\nClassyarian.prototype = {\n  constructor: Classyarian,\n\
  \  talks: function(){ \n    console.log(\"I am \" + this.name + \" !!!\");\n  },\n\
  \  equipsWeapon: function(weapon){ \n    weapon.equipped = true;\n    this.weapons.push(weapon);\n\
  \    console.log(`${this.name} grabs a ${weapon.name} from ` + \n              \
  \    the cavern floor`);\n  },\n  toString: function(){\n    return this.name;\n\
  \  },\n  saysHi: function (){ \n    console.log(\"Hi! I am \" + this.name);\n  }\n\
  };\n```\n\n这种类类到完整的 ES6 class 的转换非常直观。看！强大的 `Barbarian` 类！\n\n```javascript\nclass\
  \ Barbarian {\n\n  constructor(name){\n    this.name = name;\n    this[\"character\
  \ class\"] = \"barbarian\";\n    this.hp = 200;\n    this.weapons = [];\n  }\n\n\
  \  talks(){ \n    console.log(\"I am \" + this.name + \" !!!\");\n  }\n\n  equipsWeapon(weapon){\
  \ \n    weapon.equipped = true;\n    this.weapons.push(weapon);\n    console.log(`${this.name}\
  \ grabs a ${weapon.name} from ` + \n                  the cavern floor`);\n  }\n\
  \n  toString(){\n    return this.name;\n  }\n\n  saysHi(){ \n    console.log(\"\
  Hi! I am \" + this.name);\n  }\n}\n```\n\n`class` 关键字后跟着 *class* 名称，现在作为整个 *class*\
  \ 的容器。体内的语法与你之前在本书中学过的对象初始化*简写方法语法*非常相似：\n\n* **constructor function** 变成了类内部的 `constructor`\
  \ 方法\n* **prototype** 方法变成了类体内部的方法。它们通过换行分隔，而不是像对象初始化那样用逗号分隔。\n\n\n\n\n*   我们不像像\
  \ `saysHi: function(){}` 那样使用 `function` 关键字编写方法，而是使用更接近 C# 方法语法的简写版本 `saysHi(){`。\n\
  \n*   除了方法之外，你还可以像在对象字面量中一样定义 `getters` 和 `setters`。\n\n定义后，你可以使用 `new` 关键字创建 `class`\
  \ 实例：\n\n```\n1 const conan = new Barbarian('Conan');\n2 \n3 console.log(`Conan\
  \ is a barbarian: ` +\n4             `${conan instanceof Barbarian}`);\n5 // =>\
  \ Conan is a barbarian: true\n6 \n7 conan.equipsWeapon('steel sword');\n8 // =>\
  \ Conan grabs a undefined from the cavern floor\n```\n\n### 通过 Extends 实现原型继承\n\n\
  使用 *ES6 classes* 时，表达继承变得同样简单。`extends` 关键字比 *ES5* 中的等效方法提供了更具声明性的方法。\n\n在 *ES5*\
  \ 中，我们需要：\n\n1.  确保调用了基类的 `constructor function`，并且\n\n2.  设置 `constructor function`\
  \ 的 `prototype` 属性\n\n如此例所示：\n\n```\n 1 function Berserker(name, animalSpirit){\n\
  \ 2     // 1) 调用基类构造函数\n 3     Barbarian.call(this, name); \n 4     this.animalSpirit\
  \ = animalSpirit;\n 5 };\n 6 \n7 // 2) 命令式设置原型\n 8 Berserker.prototype = Object.create(Barbarian.prototype);\n\
  \ 9 Berserker.prototype.constructor = Berserker;\n10 Berserker.prototype.rageAttack\
  \ = function(target){\n11   console.log(`${this} screams and hits ` + \n12     \
  \          `${target} with a terrible blow`);\n13   target.hp -= 100;\n14 };\n```\n\
  \n在 *ES6 classes* 中，我们在类声明中使用 `extends` 关键字：\n\n```\n 1 class Berserker extends\
  \ Barbarian {\n 2 \n 3     constructor(name, animalSpirit){\n 4         super(name);\n\
  \ 5         this.animalSpirit = animalSpirit;\n 6     }\n 7 \n 8     rageAttack(target){\n\
  \ 9       console.log(`${this} screams and hits ${target} ` + \n10             \
  \      `with a terrible blow`);\n11       target.hp -= 100;\n12     }\n13 }\n```\n\
  \n`extends` 关键字确保了 `Berserker` 类继承（源自）`Barbarian` 类。`constructor` 内部的 `super` 关键字允许你调用基类构造函数。\n\
  \n如果我们现在实例化一个新的狂暴 `Berserker`，你会体会到它同时拥有 `Berserker` 和 `Barbarian` 类型：\n\n```\n\
  1 const logen = new Berserker('Logen, the Bloody Nine', 'wolf');\n2 console.log(`Logen\
  \ is a barbarian: ${logen instanceof Barbarian}`);\n3 // => Logen is a barbarian:\
  \ true\n4 console.log(`Logen is a berserker: ${logen instanceof Berserker}`);\n\
  5 // => Logen is a berserker: true\n```\n\n并且包含了来自两个类的方法：\n\n```\n1 logen.equipsWeapon({name:'huge\
  \ rusty sword'});\n2 // => Logen, the Bloody Nine grabs a huge rusty sword \n3 //\
  \    from the cavern floor\n4 logen.rageAttack(conan);\n5 // => Logen, the Bloody\
  \ Nine screams and hits Conan with \n6 //    a terrible blow\n```\n\n好得多，不是吗？\n\n\
  ### 在 ES6 Classes 中重写方法\n\n你也可以使用 `super` 关键字来重写和扩展 `class` 方法。还记得我们在上一章中为了说明方法重写而使用的\
  \ `Shaman` 和 `WhiteShaman` 吗？下面的示例展示了你如何使用 ES6 类实现相同的功能。我们将原始类转换为非常简洁的 ES6 类，并使用\
  \ `super` 关键字重写了 `heals` 方法。\n\n这里是 `Shaman` 类：\n\n```\n 1 class Shaman extends\
  \ Barbarian{\n 2   constructor(name){\n 3     super(name);\n 4   }\n 5   \n 6  \
  \ heals(target){\n 7     console.log(`${this} heals ${target} (+ 50hp)`);\n 8  \
  \   target.hp += 50;\n9   }\n10 }\n```\n\n这里是 `WhiteShaman`，它用新的改进功能重写并扩展了 `heals`\
  \ 方法：\n\n```\n 1 class WhiteShaman extends Shaman {\n 2 \n 3   castsSlowCurse(target){\n\
  \ 4     console.log(`${this} casts slow on ${target}.` + \n 5                 `\
  \ ${target} seems to move slower`);\n 6     if (target.curses) target.curses.push('slow');\n\
  \ 7     else target.curses = ['slow'];\n 8   }\n 9   \n10   heals(target){\n11 \
  \    // 取代 Shaman.prototype.heals.call(this, target);\n12     // 你可以使用 super\n13\
  \     super.heals(target);\n14     console.log(`${this} cleanses all negatives effects\
  \ ` +\n15                 `in ${target}`);\n16     target.curses = [];\n17     target.poisons\
  \ = [];\n18   }\n19 }\n```\n\n\n\n\n就像 `ES5 classes` 一样，如果你想使用闭包来声明私有成员或方法，你需要将消耗这些私有方法的方法到\
  \ `class` 的 `constructor` 内部。这将确保该方法可以闭包私有成员或方法。\n\n例如，我们可以像上一章中做的那样，让 `weapons`\
  \ 成员变为私有：\n\n```\n 1 class PrivateBarbarian {\n 2 \n3   constructor(name){\n 4 \
  \    // private members\n 5     const weapons = [];\n 6 \n7     // public members\n\
  \ 8     this.name = name;\n 9     this[\"character class\"] = \"barbarian\";\n10\
  \     this.hp = 200;\n11 \n12     this.equipsWeapon = function (weapon){ \n13  \
  \     weapon.equipped = true;\n14 \n15       // the equipsWeapon method encloses\
  \ \n16       // the weapons variable\n17       weapons.push(weapon);\n18 \n19  \
  \     console.log(`${this.name} grabs a ${weapon.name} ` + \n20                \
  \   `from the cavern floor`);\n21     };\n22 \n23     this.toString = function(){\n\
  24       if (weapons.length > 0) {\n25         return `${this.name} wields a ` +\
  \ \n26                `${weapons.find(w => w.equipped).name}`;\n27       } else\
  \ return this.name\n28     };\n29   }\n30 \n31   talks(){ \n32     console.log(\"\
  I am \" + this.name + \" !!!\");\n33   }\n34 \n35   saysHi(){ \n36     console.log(\"\
  Hi! I am \" + this.name);\n37   }\n38 };\n```\n\n### 通过闭包实现 ES6 私有成员\n\n在上面的示例中，我们在\
  \ `constructor` 作用域内将 `weapons` 定义为一个普通变量。然后我们将 `equipsWeapon` 和 `toString` 方法移动到构造函数内部，并重写了它们以闭包\
  \ `weapons` 变量。现在我们可以验证 `weapons` 如何有效地成为 `PrivateBarbarian` 类的私有成员：\n\n```\n1 const\
  \ privateBarbarian = new PrivateBarbarian('timido');\n2 privateBarbarian.equipsWeapon({name:\
  \ 'mace'});\n3 // => timido grabs a mace from the cavern floor\n4 \n5 console.log(`Barbarian\
  \ weapons: ${privateBarbarian.weapons}`);\n6 // => Barbarian weapons: undefined\n\
  7 \n8 console.log(privateBarbarian.toString())\n9 // => timido wields a mace\n```\n\
  \n### 通过 Symbols 实现 ES6 私有成员\n\n或者，你也可以像使用 `ES5 classes` 一样使用 symbols：\n\n```\n\
  \ 1 // 这应该被放在模块内部\n 2 // 只有 SymbolicBarbarian 才能访问它\n 3 const weapons = Symbol('weapons');\n\
  \ 4 \n5 class SymbolicBarbarian {\n 6 \n7   constructor(name){\n 8     this.name\
  \ = name;\n 9     this[\"character class\"] = \"barbarian\";\n10     this.hp = 200;\n\
  11     this[weapons] = [];\n12   }\n13 \n14   talks(){ \n15     console.log(\"I\
  \ am \" + this.name + \" !!!\");\n16   }\n17 \n18   equipsWeapon(weapon){ \n19 \
  \    weapon.equipped = true;\n20     this[weapons].push(weapon);\n21     console.log(`${this.name}\
  \ grabs a ` + \n22                 `${weapon.name} from the cavern floor`);\n23\
  \   }\n24 \n25   toString(){\n26     if(this[weapons].length > 0) {\n27       return\
  \ `${this.name} wields a ` +\n28              `${this[weapons].find(w => w.equipped).name}`;\n\
  29     } else return this.name;\n30   }\n31 \n32   saysHi(){ \n33     console.log(\"\
  Hi! I am \" + this.name);\n34   }\n35 };\n```\n\n这同样导致 `weapons` 变为私有：\n\n```\n\
  1 const symbolicBarbarian = new SymbolicBarbarian('simbolo');\n2 symbolicBarbarian.equipsWeapon({name:\
  \ 'morning star'});\n3 // => timido grabs a mace from the cavern floor\n4 \n5 console.log(`Barbarian\
  \ weapons: ${symbolicBarbarian.weapons}`);\n6 // => Barbarian weapons: undefined\n\
  7 \n8 console.log(symbolicBarbarian.toString())\n9 // => timido wields a morning\
  \ star\n```\n\n#### 该选择哪一个？\n\n这取决于你偏好的风格。只需知道闭包和 `symbols` 对于 `ES6 classes` 相比于\
  \ `ES5 classes` 具有相同的权衡即可：\n\n| 闭包 | ES6 Symbols |\n| --- | --- |\n| 让你能够实现真正的私有性。\
  \ | 你无法实现真正的私有性，因为客户端可以使用 `getOwnPropertySymbols` 获取你的 symbols，从而获取你的私有变量。 |\n|\
  \ 因为你需要用方法来闭包变量，使用闭包会迫使你将方法从 `prototype` 移动到 `constructor function`。这需要更多内存，因为这些方法不再被所有实例共享。\
  \ | 使用 symbols，你可以将方法保留在 `prototype` 中，从而消耗更少的内存。 |\n\n### ES6 Classes 的幕后机制\n\n\
  如果你在学习 `ES6 classes` 时一直很专注，你可能注意到一点：`ES6 classes` 只是对继承模型的语法糖。例如，让我们这些战士们获得新的神模式能力：\n\
  \n```\n1 Barbarian.prototype.entersMode = function(){\n2   console.log(`${this}\
  \ enters mode`);\n3   this.hp = 999;\n4   this.damage = 999;\n5   this.speed = 999;\n\
  6   this.attack = 999;\n7 };\n```\n\n执行这段代码后，我们之前创建的实例如 `conan`（战士）、`logen`（狂战士）和\
  \ `khaaar`（法师）获得了进入神模式的能力：\n\n```\n1 conan.entersMode();\n2 // => Barbarian enters\
  \ mode!!!!\n3 logen.entersMode();\n4 // => Berserker enters mode!!!!\n5 khaaar.entersMode();\n\
  6 // => Shaman enters mode!!!!\n```\n\n### 总结\n\n*ES6 classes* 是 JavaScript 自然演化的结果，从\
  \ `ES5` 中原始的 `class` 支持进化到了 `ES6` 中更好的原生支持。\n\n它们类似于 C# 类，并可以使用 `class` 关键字创建。它们有一个\
  \ `constructor` 函数，可以在其中声明 `class` 成员，并且语法与对象初始化器非常相似。\n\n*ES6 classes* 通过 `super`\
  \ 关键字提供了方法覆盖支持，通过 `static` 关键字提供了静态方法，并且可以通过 `extends` 关键字声明式的方式表示继承树（原型链）。\n\n\
  理解 `ES6 classes` 只是继承模型的语法糖是非常重要的。掌握了这些知识，你可以利用之前章节中学到的内容来实现静态成员、通过闭包和符号实现数据私有化、在运行时增强\
  \ `class` 原型，以及任何你能想象的内容。\n\n现在你已经知道如何用 C# 风格编写 JavaScript OOP 了，是时候超越*经典继承* 并拥抱\
  \ JavaScript 的动态特性和灵活性了。接下来是！Mixins 和对象组合！\n\n### 练习题\n\n## 黑塔召唤：使用 Mixins 织交对象\n\
  \n```\n 我曾经认为 JavaScript 重要的创新\n是原型继承。\n\n经过进一步反思，我认为它是\n无类面向对象编程。\n\n这是 JavaScript\
  \ 给予人类的礼物。\n\n        - Glas Ford,\n        JavaScript-Mancy: A missunderstood art,\
  \ Meditations\n```\n\n### 类与经典继承的问题……\n\n我们所处的世界极其复杂。创建能够处理这种无限程度复杂性和细节的软件是徒劳的。面向对象编程试图通过在问题空间内抽象世界，并创建简化的现实表示来解决非常特定的问题，从而将不可完成的任务转变为某种东西，即使不是简单的，至少是可管理的。\n\
  \n\n\n\n这些 OOP 表示通常是借助 `classes` 和 `objects` 来完成的。`class` 代表某个事物的蓝图，即现实世界中我们想要抽象化并在程序中使用某些实体。它决定了我们用于表示该实体的属性，以及它能够执行的操作。`object`\
  \ 代表该蓝图（即该 `class`）的一个特定实例，一个存在的、具有特定状态并且可以操作的东西。\n\n这些都很好。我们生活在一个复杂的世界里，而 OOP 帮助我们通过被称为\
  \ `classes` 和 `objects` 的现实简化版本来管理这种复杂性。\n\n使用 `classes` 的副作用是，它为我们周围世界的实体创建了一套“分类法”（`taxonomy`）或“分类”。由于类和继承的本质，这种分类往往是非常僵化的，不容忍变化。这里的\
  \ `变化` 并不严格意义于为类添加新属性，而是指让 `classes` 系统能够适应关于当前领域的新知识。\n\n我们在本书的介绍 中看到过这个特定问题的例子，其中我们定义了这三个类\
  \ `Minion`、`Wizard` 和 `Thief`：\n\n```\n 1 class Minion {\n 2   constructor(name,\
  \ hp){\n 3     this.name = name;\n 4     this.hp = hp;\n 5   }\n 6   toString(){\n\
  \ 7     return this.name;\n 8   }\n 9 }\n10 \n11 class Wizard extends Minion {\n\
  \ 12   constructor(element, mana, name, hp){\n 13     super(name, hp);\n 14    \
  \ this.element = element;\n 15     this.mana = mana;\n 16   }\n 17   toString(){\n\
  \ 18     return super.toString() + \", the \" + this.element +\" Wizard\";\n 19\
  \   }\n 20   castsSpell(spell, target){\n 21     console.log(this + ' casts ' +\
  \ spell + ' on ' + target);\n 22     this.mana -= spell.mana;\n 23     spell(target);\n\
  \ 24   }\n 25 }\n 26 \n27 class Thief extends Minion {\n 28   constructor(name,\
  \ hp){\n 29     super(name, hp);\n 30   }\n 31   toString(){\n 32     return super.toString()\
  \ + \", the Thief\";\n 33   }\n 34   steals(target, item){\n 35     console.log(`${this}\
  \ steals ${item} from ${target}`);\n 36   }\n 37 }\n```\n\n我们的问题空间由一个世界表示，其中 `Wizard`\
  \ 是一个会施咒法的人，而 `Thief` 是一个会偷东西的人。在这个背景下，我们对领域学到了新知识：`Bards` 的存在——作为神话和传说中的生物，它们既能施咒法，又能偷东西，甚至演奏乐器！\n\
  \n但我们创建的 `classes` 系统（即我们目前代表世界的分类法）并不能很好地兼容 `Bard` 的想法……它是一个 `Wizard` 吗？它是一个 `Thief`\
  \ 吗？还是别的什么？它不能兼顾！可能吗！？\n\n因此，为了将这些知识引入我们的系统，我们需要对 `classes` 进行重大重设计，重新定义整个分类法，或者重复代码并放弃多态可能带来的益处。\n\
  \n所以类创建了分类法。分类法是僵化的且不容忍变化。*我们还有其他需要考虑的吗？* 嗯，还有一个关于**时机**的问题，即我们何时创建这些类和分类法？这又如何影响我们的工作方式？\n\
  \n一位非常有智慧的人 ^(17) 对此进行了反思，并意识到我们在启动项目时就开始构建这些分类法，而那时正是我们对领域和问题空间了解最少的时刻。我们正在用这些非常僵化的系统来表示一个我们通常并不熟悉的领域。随着我们对领域的不断深入，这些系统不可避免地需要改变，但它们并不适合适应这种变化。\n\
  \n**有更好的方法吗？**\n\n是的，先生/女士，是有的。那就是**无类的面向对象编程**，这位绅士称之为 JavaScript 对人类最重大的单一贡献。在本章和接下来的章节中，我们将关注你如何实现这种面向对象编程方法，在这种情况下\
  \ `classes` 消失了，我们只关注 `objects`。听起来很令人兴奋不是吗？\n\n### 通过对象组合和 Mixins 从类中解脱\n\n在本书的介绍\
  \ 中，当你学习如何使用 `Object.assign` 将对象组合在一起时，你领略了`无类继承`。在那个特定的无类继承实现中，我们将行为定义为对象：`canBeIdentifiedByName`、`canCastSpells`、`canSteal`\
  \ 和 `canPlayMusic`：\n\n```\n 1 const canBeIdentifiedByName = {\n 2   toString(){\n\
  \ 3     return this.name;\n 4   }\n 5 };\n 6 \n 7 const canCastSpells = {\n 8  \
  \ castsSpell(spell, target){\n 9     console.log(this + ' casts ' + spell + ' on\
  \ ' + target);\n10     this.mana -= spell.mana;\n11     spell(target);\n12   }\n\
  13 };\n14 \n15 const canSteal = {\n 16   steals(target, item){\n 17     console.log(`${this}\
  \ steals ${item} from ${target}`);\n 18   }\n 19 };\n20 \n21 const canPlayMusic\
  \ = {\n 22   playsMusic(instrument){\n 23     console.log(`${this} plays ${instrument}`);\n\
  \ 24   }\n 25 };\n```\n（注：提示中提供的输入文本在第二个代码块后突然中断了。我已格式化了可用部分。）*\n\n\n\n让我们通过一个新的示例来继续加强对对象组合和灵活性的理解。想象一下，你能够在地图上显示你的军团，以便在通往统治已知世界的道路上做出更好的战略决策。\n\
  \n你可以定义一个 `canBePositioned` 对象，来封装这种放置物品的新行为：\n\n```javascript\n 1 const canBePositioned\
  \ = {\n 2     x : 0,\n 3     y : 0,\n 4     movesTo(x, y) {\n 5         console.log(`${this}\
  \ moves from ` +\n 6           `(${this.x}, ${this.y}) to (${x}, ${y})`);\n 7  \
  \       this.x = x;\n 8         this.y = y;\n 9     }\n10 };\n```\n\n并为我们所有的小兵添加该功能：\n\
  \n```javascript\n1 Object.assign(wizard, canBePositioned);\n2 Object.assign(thief,\
  \ canBePositioned);\n3 Object.assign(bard, canBePositioned);\n4 Object.assign(orcMagician,\
  \ canBePositioned);\n```\n\n突然之间，我们可以随心所欲地放置并移动它们了。如果我们定义一个像下面这样一个简单的 ASCII 二维地图：\n\
  \n```javascript\n 1 function Map(width, height, creatures){\n 2   \n 3   function\
  \ paintPoint(x,y){\n 4     const creatureInPosition = creatures\n 5       .find(c\
  \ => c.x === x && c.y === y);\n 6     if (creatureInPosition) \n 7       return\
  \ creatureInPosition.name[0];\n 8     return '_';\n 9   }\n10   \n 11   return {\n\
  \ 12     width,\n 13     height,\n 14     creatures,\n 15     paint() {\n 16   \
  \    let map = '';\n 17       for(let y = 0; y < height; y++)\n 18         for (let\
  \ x = 0; x < width; x++)\n 19           map += paintPoint(x,y);\n 20         map\
  \ += '\\n';\n 21       }\n 22       return map;\n 23     }\n 24   }\n 25 }\n```\n\
  \n我们可以将 `Map` 的绘图能力与小兵自身的定位和移动能力相结合，得到我们军队的战术表示：\n\n```javascript\n 1 wizard.movesTo(10,10);\n\
  \ 2 // => Randalf, the Red moves from (0, 0) to (10, 10)\n 3 thief.movesTo(5,5);\n\
  \ 4 // => Locke Lamora moves from (0, 0) to (5, 5)\n 5 bard.movesTo(15,15);\n 6\
  \ // => Kvothe moves from (0, 0) to (15, 15)\n 7 \n 8 const worldMap = Map(50, 20,\
  \ [wizard, thief, bard, orcMagician]);\n 9 console.log(worldMap.paint());\n10 \n\
  11 /* =>\n12 o_________________________________________________\n13 __________________________________________________\n\
  14 __________________________________________________\n15 __________________________________________________\n\
  16 o_________________________________________________\n17 __________________________________________________\n\
  18 __________________________________________________\n19 __________________________________________________\n\
  20 __________________________________________________\n21 __________________________________________________\n\
  22 __________________________________________________\n23 __________________________________________________\n\
  24 __________________________________________________\n25 __________________________________________________\n\
  26 __________________________________________________\n27 __________________________________________________\n\
  28 __________________________________________________\n29 __________________________________________________\n\
  30 __________________________________________________\n31 __________________________________________________\n\
  32 */\n```\n\n\n\n\n```javascript\nconst canBePositionedIn3Dimensions = {\n    x:\
  \ 0,\n    y: 0,\n    z: 0,\n    movesTo(x, y, z) {\n        console.log(`${this}\
  \ moves from (${this.x}, ${this.y}, ${this.z}) to (${x}, \\\n        ${y}, ${z})`);\n\
  \        this.x = x;\n        this.y = y;\n        this.z = z;\n    }\n};\n\nconst\
  \ raist = Wizard('death', /*mana*/ 1000, 'Raistlin', /*hp*/ 1);\nObject.assign(raist,\
  \ canBePositioned, canBePositionedIn3Dimensions);\n\n// we used the movesTo method\
  \ thinking about the canBePositioned mixin\n// and we get an unexpected result z\
  \ becomes undefined\nraist.movesTo(10, 20);\n// => Raistlin moves from (0, 0, 0)\
  \ to (10, 20, undefined)\n```\n\n*有办法可以超越这些限制吗？* 确实有！看这里！**函数式混入（Functional mixins）**！\n\
  \n#### 函数式混入\n\n*函数式混入*是用函数而不是对象实现的*混入*。因为它们是函数，所以：\n\n*   通过闭包天然地支持*数据私有性*，并且\n\
  *   作为*混入*的工厂，可以轻松避免对象之间不必要的耦合\n\n让我们来看看如何将之前定义的行为从*混入*对象转换为*函数式混入*：\n\n```javascript\n\
  const canCastSpellsFn = (state) => ({\n  castsSpell(spell, target){\n    console.log(`${state.name}\
  \ casts ${spell} on ${target}`);\n    state.mana -= spell.mana;\n    spell(target);\n\
  \  }\n});\n\nconst canStealFn = (state) => ({\n  steals(target, item){\n    console.log(`${state.name}\
  \ steals ${item} from ${target}`);\n  }\n});\n\nconst canPlayMusicFn = (state) =>\
  \ ({\n  playsMusic(){\n    console.log(`${state.name} grabs his ${state.instrument}\
  \ and starts playing musi\\\n    c`);\n  }\n});\n```\n\n在这个示例中，`canCastSpell`*混入*及其同伴已被重写为函数。这些函数接收一个\
  \ `state` 参数，该参数代表*混入*将要扩展的对象的状态，并使用它来增强对象的新功能。这种函数式实现有两个优势：\n\n*   因为 `state` 对象作为参数传递给*混入*，所以它可以在对象和*混入*之间保持私有。\n\
  *   因为每次调用*函数式混入*对象时，它都会返回一个新对象，我们解决了对象之间状态耦合的问题。\n\n重新定义行为后，我们也可以根据这些行为重新定义法师、小偷和吟诗人：\n\
  \n```javascript\nfunction TheWizard(element, mana, name, hp){\n  // 私有状态\n  const\
  \ state = {element, \n                 mana, \n                 name, \n       \
  \          hp};\n  \n  // 公有 API\n  return Object.assign({},\n               canBeIdentifiedByNameFn(state),\n\
  \               canCastSpellsFn(state));\n}\n\nfunction TheThief(name, hp){\n  const\
  \ state = {name, \n                 hp};\n  \n  return Object.assign({},\n     \
  \          canBeIdentifiedByNameFn(state),\n               canStealFn(state));\n\
  }\n\nfunction TheBard(instrument, mana, name, hp){\n  const state = {instrument,\
  \ \n                 mana, \n                 name, \n                 hp};\n  \n\
  \  return Object.assign({},\n               canBeIdentifiedByNameFn(state),\n  \
  \             canCastSpellsFn(state),\n               canStealFn(state),\n     \
  \          canPlayMusicFn(state));\n}\n```\n\n并像我们在之前的示例中那样使用它们：\n\n```javascript\n\
  const landaf = TheWizard('light', 100, 'Landaf the light', 100);\nlandaf.castsSpell(lightningSpell,\
  \ orc);\n// => Landaf the light casts lightning spell on orc\n// => A bolt of lightning\
  \ electrifies orc(-10hp)\n\n\n\nconst lupen = TheThief('Lupen', 200);\nlupen.steals(orc,\
  \ 'rusty copper ring');\n// => Lupen steals rusty copper ring from orc\n\nconst\
  \ bart = TheBard('lute', 200, 'Bart', 100);\nbart.playsMusic();\n// => Bart grabs\
  \ his lute and starts playing music\nbart.steals(lupen, 'rusty copper ring');\n\
  // => Bart steals rusty copper ring from Lupen\nbart.castsSpell(lightningSpell,\
  \ landaf);\n// => Bart casts lightning spell on Landaf the light\n// => A bolt of\
  \ lightning electrifies Landaf the light(-10hp)\n// 哇，Bart 真坏！\n```\n\n在函数式混入的这个用例中，我们将每个对象的内部状态（由\
  \ `state` 对象表示）与其工厂函数返回的公有 *API* 分隔开。\n\n对象的内部状态作为参数传递给不同的*函数式混入*，以便它们随后可以访问它。\n\
  \n公有 API 是通过将空对象扩展为将不同的*函数式混入*应用于 `state` 对象后产生的结果而定义的。这个空对象也可以包含 `state` 中包含的部分或全部变量，在这种情况下，它们将变为公开的：\n\
  \n```javascript\nfunction TheBard(instrument, mana, name, hp){\n  // 内部状态\n  const\
  \ state = {instrument, \n                 mana, \n                 name, \n    \
  \             hp};\n  \n  // 公有 API\n  // 公开整个 state\n  return Object.assign({},\n\
  \               canBeIdentifiedByNameFn(state),\n               canCastSpellsFn(state),\n\
  \               canStealFn(state),\n               canPlayMusicFn(state));\n```\n\
  \n\n\n\n在组合 `ES6 classes` 与 `mixins` 时，你有两个选择。你可以根据具体情况（`per-case`）用 `mixin` 组合已经实例化的对象，也可以用\
  \ `mixin` 组合你的 `class` 原型，从而自动为该 `class` 的所有现有和未来的实例提供新行为。\n\n让我们假设我们有一个 `Warrior`\
  \ 类来通过示例辅助说明这一点：\n\n```\n 1 class Warrior {\n 2   \n 3   constructor(name, hp=500)\
  \ {\n 4     this.name = name;\n 5     this.hp = hp;\n 6     this.weapons = [];\n\
  \ 7   }\n 8   \n 9   equipsWeapon(weapon) {\n10     weapon.isEquipped = true;\n\
  11     this.weapons.push(weapon);\n12     console.log(`${this} picks ${weapon} from\
  \ the ground ` + \n13                 `and looks at it appreciatively`);\n14   }\n\
  15   \n16   attacks(target) {\n17     if (this.weapons.length === 0) {\n18     \
  \  console.log(`${this} attacks ${target} with ` + \n19                   `his bare\
  \ arms`);\n20     } else {\n21       console.log(`${this} attacks ${target} with\
  \ ` + \n22                   `${this.weapons.find(w => w.isEquipped)}`);\n23   \
  \  }\n24   }\n25 \n26   toString() {\n27     return this.name;\n28   }\n29 \n30\
  \ }\n```\n\n第一种方案非常直接，因为我们只是将一个对象与另一个对象组合。我们可以实例化一个新的战士 `caramon`：\n\n```\n1 const\
  \ caramon = new Warrior('Caramon', 1000);\n```\n\n现在，如果我们想让这个特定的战士能够偷东西，我们可以用之前示例中的\
  \ `canSteal` `mixin` 来组合它：\n\n```\n1 Object.assign(caramon, canSteal);\n2 \n3 caramon.steals(bard,\
  \ 'lute');\n4 // => Caramon steals lute from Kvothe\n```\n\n或者，我们可以用 `mixin` 组合\
  \ `Warrior` `class` 的原型，并为该类的所有现有和未来的实例提供新功能。这是定义一系列可重用行为并根据需要将其与我们的领域模型类组合极极方法。\n\
  \n例如，让我们通过 `canBePositioned` `mixin` 让所有战士都能够在地图上进行定位：\n\n```\n1 Object.assign(Warrior.prototype,\
  \ canBePositioned);\n```\n\n我们可以很容易地验证像 `caramon` 这样已经定义的战士以及像 `riverwind` 这样新的战士是否确实可以在二维空间中移动：\n\
  \n```\n1 // existing instances of Warrior now can be positioned\n2 caramon.movesTo(10,10);\n\
  3 // => Caramon moves from (0, 0) to (10, 10)\n4 // Crazy!\n5 \n6 // and new ones\
  \ as well\n7 const riverwind = new Warrior('Riverwind', 300);\n8 riverwind.movesTo(20,20);\n\
  9 // => Riverwind moves from (0, 0) to (20, 20)\n```\n\n### 深度解析 Object.assign\n\
  \n在本章以及之前的章节中，我们多次使用了 `Object.assign`。我们知道它将属性从多个源对象拷贝到目标对象中。*但它复制了所有属性吗？对象原型中的属性呢？它对源对象进行了深拷贝吗？还是浅拷贝？*\
  \ 这我们将在节中回答的问题。\n\n`Object.assign` 方法是 `ES6` 中一个新的 `Object` 静态方法，允许你从一个或多个 `source`\
  \ 对象将所有可枚举的属性拷贝到单个 `target` 对象中。\n\n```javascript\n 1 // copy properties from one\
  \ object to another\n 2 const companyOfTheRing = { aHobbit: 'frodo'};\n 3 const\
  \ companyPlusOne = Object.assign(\n 4   /* target */ companyOfTheRing, \n 5   /*source*/\
  \ { aWizard: 'Gandalf'}\n 6 );\n 7 console.log(companyOfTheRing);\n 8 // => [object\
  \ Object] { \n 9 //    aHobbit: \"frodo\", aWizard: \"Gandalf\" \n10 //    }\n11\
  \ \n 12 // merge serveral objects into one \n13 Object.assign(companyOfTheRing,\
  \ \n14   {anElf: 'Legolas'}, \n15   {aDwarf: 'Gimli'}\n16 );\n17 console.log(companyOfTheRing);\n\
  18 // => [objetc Object] {\n19 //    aHobbit: \"frodo\", ... anElf: \"Legolas\"\
  , aDwarf: \"Gimli\"\n20 //    }\n```\n\n`target` 对象是传递给 `Object.assign` 的第一个参数，但它也是方法的返回值：\n\
  \n```javascript\n1 // the returned object is the same as the target object\n2 console.log(`companyPlusOne\
  \ and companyOfTheRingt ` + \n3   `are the same: ${companyPlusOne === companyOfTheRing}`);\n\
  4 // => companyPlusOne and companyOfTheRing are the same: true\n```\n\n如果你不想修改任何现有的对象，可以使用新对象\
  \ `{}`：\n\n\n\n\n1. 从右到左遍历 `sources` 数组，\n2. 它对数组中的每个项应用 `assignObject` 函数，\n3.\
  \ 将结果累积在 `target` 对象中，该对象将再次回传给 `assignObject` 函数以处理下一个项。\n\n## 结语\n\n软件开发是一项复杂的权衡。我们试图通过创建抽象和简化来对周围的世界进行建模，这些抽象仅包含解决当前问题所需的细节。面向对象编程试图通过定义代表现实世界实体简化版的类，来减少软件开发的复杂性。然而，使用类会导致僵化的分类法，这种分类并不擅长吸收变化。\n\
  \n*无类面向对象编程*作为经典 OOP 的一种替代方案出现，它更具适应性且更灵活。*无类* OOP 的一个示例是通过*混入（*mixins*）*实现的对象组合性。*混入*是封了一了一部分可重用功能或行为的对象或函数。你可以通过\
  \ `Object.assign` 和所谓的*级联继承（*concatenative inheritance*，我们在书的前几章节中讨论的第二种*原型继承*）将这些*混入*应用到你的领域模型对象上。\n\
  \n你可以将*混入*表示为对象或函数。函数*混入*比对象混入更好，因为它们支持*数据隐私*并防止通过共享引用产生耦合。两种类型的*混入*都存在命名冲突问题，因为对象组合是将属性从一个对象拷贝到另一个对象。\n\
  \n`Object.assign` 是 *ES6* 中一个新的 `Object` 方法，它允许你从一个或多个源（*source*）对象将枚举自身的属性拷贝到一个目标（*target*）对象中。如果你没有使用\
  \ *ES6*，可以使用流行的 JavaScript 库（如 *jQuery* 或 *underscore*）中的替代方案，或者编写自己的 `Object.assign`\
  \ 实现。\n\n在接下来的章节中，我们将查看实现*无类面向对象编程*的其他其他味的方法：特性（*traits*）和印章（*stamps*）。\n\n### 练习题\n\
  \n## 黑塔召唤：使用特性实现更安全的对象组合\n\n```\n人类是有缺陷的。\n在设计工具时\n请考虑到这一点。\n\n在你的工具内部，创建一条路径\n\
  引导你的用户通向成功。\n她的失败就是你的失败。\n\n        - Iamnos Ydad\n        第一时代，咒术大师 \n```\n\n###\
  \ 对混入的改进\n\n在上一章中，你学习了*混入*以及你如何使用它们来封装可重用的行为单元，稍后可以将它们与你的领域对象或类进行组合。\n\n*混入*虽然很棒，但存在一些局限性。特别在使用\
  \ `Object.assign` 时，冲突的*混入*方法和属性会被覆盖。雪上加霜的是，当这种情况发生时你不会收到任何警告。在某个时刻用新功能更新*混入*可能会无意中改变你某些对象的行为，并导致意外的结果。\n\
  \n*特性（*Traits*）*通过提供一种更安全、更有结构化的对象组合方式，解决了这个问题。\n\n### 特性（Traits）\n\n*特性*的出现是对更传统的\
  \ OOP 实践（如经典继承、多重继承和混入）中存在的问题和局限性的自然反应。在回到特性及其特征之前，让我们逐一个地检查这些问题。\n\n#### 类的问题\n\
  \n*经典继承*中的**类**执行了两个具有冲突目标的截然功能。它们的工作方式如下：\n\n1. **创建对象**的工厂\n2. 通过继承实现**代码重用**的机制\n\
  \n对象创建的第一个目标要求类是完整的，以便你用它来实例化对象。代码重用的第二个目标在你拥有小型可重用单元时真正大放异彩。这两个目标相互冲突，因为完整的类产生大型的可重用单元，而小型的可重用单元产生不完整的类。\n\
  \n由于这种二分法，使用类来设计领域模型正如我们在前面的章节中所看到的，留下的选择很少：你可以将继承作为一种*代码重用*的方法（继承所有内容），你可能会在不同类之间产生*代码重复*，或者你需要大量的样板代码将行为委托给其他类。\n\
  \n#### 多重继承的问题\n\n**多重继承**改进了单类继承方法的*代码重用*因子，但带来了它自己的一系列问题。\n\n通过多重继承，你可以定义更小的类，并让新类重用这些较小单元的功能。然而，问题随之而来，继承树的几条路径可能会提供冲突的功能，并且通过\
  \ `super` 进行覆盖可能会产生歧义：*亲爱的，你指的是哪一个 `super` 类呢？*\n\n#### 混入的困境\n\n**混入**通过定义小型的可重用单元擅长*代码重用*，这些单元可以与现有的类和对象进行组合。与*类*不同，混入的目标不是作为对象的工厂，因此可以是不完整的（并且是小而集中的）。\n\
  \n另一方面，由于使用混入组合类和对象的机制，无法保证生成的对象是正确的：\n\n* 目标类或对象可能不满足混入的要求，即：组合后的类可能缺少混入所依赖的属性\n\
  * 混入之间可能会以意想不到的方式相互冲突，例如：当两个混入提供了同名的方法时\n\n此外，当我们在组合对象失败或混入特性相互冲突时，没有任何警告。\n\n####\
  \ 特性的救救\n\n*特性*试图解决前述技术中存在的所有这些问题。它们通过提供一种重用代码和行为的方式来实现这一点，就像我们使用*混入*那样，但这种方式更安全，让我们能够：\n\
  \n* 处理特性之间的冲突并在发生冲突时收到警告\n* 在我们的特性中定义在某些某些功能之前必须满足的 string\n\n让我们看看你如何在 JavaScript\
  \ 中开始使用特性。\n\n### 使用带有 traits.js 的特性\n\n[Trait.js](http://soft.vub.ac.be/~cutsem/traitsjs/)\
  \ 是一个将特性引入 JavaScript 的开源库。使用 *traits.js* 我们可以定义可重用的行为片段——**特性**，然后组合它们来构建对象。\n\n\
  假设我们想用特性 `TPositionable` 表示在二维空间中的定位能力。Traits.js 允许我们通过使用工厂函数（`Trait`）并传入包含感兴趣行为的对象来定义新特性：\n\
  \n```\n1 const TPosition = Trait({\n2   x: 0,\n3   y: 0,\n4   location(){\n5   \
  \  console.log(`${this} is calmly resting ` +\n6                 `at (${this.x},\
  \ ${this.y})`);\n7   }\n8 });\n```\n\n在这种情况下，`TPositionable` 特性由表示位置的两个属性和一个打印当前位置的方法\
  \ `location` 组成。\n\n现在我们定义了第一个特性，可以开始基于该特性创建对象。看这个精简的小精灵！\n\n```\n1 function MinionWithPosition(){\n\
  2   const methods = {\n3     toString(){ return 'minion';}\n4   };\n5 \n6   const\
  \ minion = Object.create(\n7          /* prototype */ methods, \n8          /* traits\
  \ (object properties) */ TPositionable);\n9   return minion;\n10 }\n```\n\n在这个例子中，我们有一个工厂函数\
  \ `MinionWithPosition`，它可以创建具有定位能力的精灵。\n\n我们使用 `Object.create` 创建一个精灵实例，该实例将具有以下特征：\n\
  \n* 包含单个方法 `toString` 的原型\n* 由 `TPositionable` 特性反映的一组属性\n\n这很有趣，因为它突显了将 JavaScript\
  \ 的*原型继承*与特性相结合的事实。\n\n\n\n\n\n```\n1 const minionWithPosition = MinionWithPosition();\n\
  2 \n3 minionWithPosition.location();\n4 // => minion is calmly resting at (0, 0)\n\
  ```\n\n一个永远停留在同一个地方的小人并没有什么用。让我们看看如何通过给这个小人更多的行为，来真正挖掘特性（traits）的力量。\n\n### 组合特性\
  \ (Composing Traits)\n\n让我们定义一个新的特性，用来表示从一个地方移动到另一个地方的行为 `TMovable`：\n\n```\n 1\
  \ const TMovable = Trait({\n 2   // 必要的属性\n 3   x: Trait.required,\n 4   y: Trait.required,\n\
  \ 5 \n 6   movesTo(x,y){\n 7       console.log(`${this} moves from ` + \n 8    \
  \     `(${this.x}, ${this.y}) to (${x}, ${y})`);\n9       this.x = x;\n10      \
  \ this.y = y;\n11   }\n12 });\n```\n\n这个新特性将由两个部分组成：\n\n- **移动行为**，由 `movesTo` 方法表示，它允许我们的小人执行实际的移动。\n\
  - **一组要求**，目标对象需要满足这些要求才能使 `movesTo` 方法正常工作。在这种情况下，这些是两个属性 `x` 和 `y`，因为如果一个人根本无法处于任何位置，那么移动就没有意义了。\n\
  \n注意 `Trait.js` 如何允许我们通过静态属性 `Trait.required` 来定义必要的属性。当我们稍后尝试实例化新对象时，这些必要的属性会被考虑在内。\n\
  \n现在我们有了两个特性，让我们将它们组合起来创建一个更有用的小人。你可以使用 `Traits.compose` 方法将特性组合在一起，这将会产生一个新的复合特性：\n\
  \n```\n1 function MovingMinion(){\n2   const methods = {\n3     toString() { return\
  \ 'moving minion';}\n4   };\n5 \n6   const minion = Object.create(/* prototype */\
  \ methods,\n7       Trait.compose(TPositionable, TMovable));\n8   return minion;\n\
  9 }\n```\n\n现在我们可以看到一个移动的小人如何既可以**定位 (positioned)** 又能**到处移动 (move around)**：\n\n\
  ```\n1 const movingMinion = MovingMinion();\n2 \n3 movingMinion.location();\n4 //\
  \ => moving minion is calmly resting at (0, 0)\n5 \n6 movingMinion.movesTo(2,2);\n\
  7 // => moving minion moves from (0, 0) to (2, 2)\n8 movingMinion.location();\n\
  9 // => moving minion is calmly resting at (2, 2)\n```\n\n在在上一个示例中，我们直接在 `Object.create`\
  \ 方法内部使用了新的复合特性，这使得它没有被注意到。注意，你可以将复合特性保存以便以后使用，进一步组合它们并构建更丰富、更详细的特性，就像我们在这个示例所示的：\n\
  \n```\n1 const TPositionableAndMovable = \n   Trait.Compose(TPositionable, TMovable);\n\
  3 \n4 const TDrawable = Trait({...drawing behavior...});\n5 \n6 const T2DCapable\
  \ = \n   Trait.Compose(TPositionableAndMovable, TDrawable);\n8 \n9 // 等\n```\n\n\
  ### 当你缺少必要属性时发生了什么？\n\n让我们尝试创建一个带有 `TMovable` 特性但不符合其要求的新对象。我们将设计一个“困惑的小人 (ConfusedMinion)”，它可以到处移动，但不知道自己具体在哪里：\n\
  \n```\n 1 function ConfusedMinion(){\n2   const methods = {\n3     toString() {\
  \ return 'confused minion'; }\n4   };\n5 \n6   const minion = Object.create(/* prototype\
  \ */ methods, \n7                              /* properties */ TMovable);\n8  \
  \ return minion;\n9 }\n10 \n11 const confusedMinion = ConfusedMinion();\n12 confusedMinion.movesTo(1,1);\n\
  13 // => confused minion moves from \n14 //    (undefined, undefined) to (1, 1);\n\
  15 // => TypeError: Cannot assign to \n16 //    read only property 'x' of [object\
  \ Object]\n```\n\n正如在这个示例所示，当特定特性的要求未满足时，你会获得良好的反馈。\n\n使用缺少必要属性的特性调用 `Object.create`\
  \ 会导致产生一个具有这些只读属性要求的对象。如果你尝试将这些属性设置为新值，将得到一个异常，警告你你的对象没有组合正确。这是对 `mixins` 的巨大改进，在\
  \ `mixins` 中，缺少预期的属性可能会意外的副作用。\n\n### 解决命名冲突\n\n与仅支持线性组合（后定义的 mixins 会覆盖先定义的）的 `mixins`\
  \ 不同，`Traits` 的组合顺序是无关的。在特性中，冲突的方法或属性必须显式地解决。\n\n让我们想象我们现在想要能够在三维空间中定位我们的小人。我们这样定义一个\
  \ `TPositionable3D` 特性：\n\n```\n 1 const TPositionable3D = Trait({\n2   x: 0, //\
  \ 冲突\n3   y: 0, // 冲突 \n4   z: 0,\n5 \n6   location(){ // 冲突\n7     console.log(`${this}\
  \ moves from ` + \n8       (${this.x}, ${this.y}) to (${x}, ${y})`);\n9   }\n10\
  \ });\n```\n\n由于我们想要能够在三维空间中定位我们的小人，我们这样定义一个 `TPositionable3D` 特性：\n\n```\n 1 const\
  \ TPositionable3D = Trait({\n2   x: 0, // 冲突\n3   y: 0, // 冲突 \n4   z: 0,\n5 \n\
  6   location(){ // 冲突\n7     console.log(`${this} moves from ` + \n8       (${this.x},\
  \ ${this.y}) to (${x}, ${y})`);\n9   }\n10 });\n```\n\n*Traits* 提供了你可以用于解决冲突的各种策略：\n\
  \n- **别名或重命名 (Aliasing or renaming)**：当你想要保留冲突特性的功能时使用。重命名冲突属性将导致对象包含两者的原始属性。\n\
  - **排除属性 (Excluding properties)**：当你不在乎某个特性时使用。在创建新对象时，排除的属性不会被考虑。\n- **覆盖属性 (Overriding\
  \ properties)**：当你想要一个特性完全覆盖另一个特性时使用。\n\n`Trait.js` 提供了 `Trait.resolve` 函数，帮助你使用我们详细说明的策略解决冲突。例如，你可以通过使用\
  \ `Trait.resolve` 将属性映射到另一个名称来**重命名**它：\n\n```\n1 function AliasedMinion(){\n2 \
  \  const methods = {\n3     toString() { return 'aliased minion'; }\n4   };\n5 \n\
  6   const minion = Object.create(/* prototype */ methods,\n7       Trait.compose(TPositionable,\
  \ \n8                     Trait.resolve(/* mappings * /{\n9                    \
  \                x: 'x3d', \n10                                    y: 'y3d', \n\
  11                                    location: 'location3d'\n12               \
  \                    }, TPositionable3D)));\n13   return minion;\n14 }\n```\n\n\
  `Trait.resolve` 两个参数，第一个是描述冲突映射的对象，第二个是我们想要重名的特性。在上面的示例中，我们将 `x` 重命名为 `x3d`，将 `y`\
  \ 重命名为 `y3d`，并将 `location` 方法重命名为 `location3d`。\n\n解决冲突后，我们可以顺利地实例化一个新的小人：\n\n```\n\
  1 const aliasedMinion = new AliasedMinion();\n2 \n3 aliasedMinion.location3d();\n\
  4 // => aliased minion is calmly resting at (0, 0, 0)\n5 \n6 aliasedMinion.location();\n\
  7 // => aliased minion is calmly resting at (0, 0)\n```\n\n使用这种重命名方法，从特性组合而的对象将保留原始特性的所有属性：\n\
  \n\n\n\n\n```\n 1 console.log(aliasedMinion);\n 2 /* => [object Object] {\n 3  \
  \ toString: function toString() {\n 4       return 'aliased minion';\n 5     },\n\
  \ 6   x: 0,\n 7   x3d: 0,\n 8   y: 0,\n 9   y3d: 0,\n10   z: 0,\n11 }\n12 */\n```\n\
  \n注意，通过 `location` 和 `location3d` 特性定义的方法在打印对象时并没有出现。这是因为通过特性的创建的方法不是可枚举的，也就是说，它们不能通过\
  \ `for/in` 循环进行枚举。当你想要枚举对象的属性并且只感兴趣其数据成员（其状态）时，这非常有帮助。\n\n我们可以通过直接打印这两个方法来验证 `location`\
  \ 和 `location3d` 这两个方法都是 `aliasedMinion` 对象的一部分：\n\n```\n 1 console.log(aliasedMinion.location);\n\
  \ 2 // => function location() {\n 3 //  console.log(this + \" is calmly resting\
  \ at (\" +\n 4 //              this.x + \", \" + this.y + \")\");\n 5 // }\n 6 console.log(aliasedMinion.location3d);\n\
  \ 7 // => function location() {\n 8 //  console.log(this + \" is calmly resting\
  \ at (\" +\n 9 //    this.x + \", \" + this.y + \", \" + this.z + \")\");\n10 //\
  \ }\n```\n\n上面的示例强调了你可能忽略的一个重要点：重命名特性属性并不会重命名函数体内部对该属性的引用。如果你查看 `location3d` 的函数体，就能体会这一点，因为它仍然引用了\
  \ `this.x` 和 `this.y`。这在你通过别名在 `traits.js` 中解决冲突时，需要记住的一个重要局限性。\n\n或者，你可以使用 `Trait.resolve`\
  \ 函数来排除特定属性，并将属性映射的值设置为 `undefined`：\n\n```\n 1 function LeanMinion(){\n 2   const\
  \ methods = {\n 3     toString() { return 'lean minion'; }\n 4   };\n 5 \n 6   const\
  \ minion = Object.create(/* prototype */ methods, \n 7       Trait.compose(TPositionable,\
  \ TMovable\n 8                     Trait.resolve({\n 9                         \
  \       x: undefined, \n10                                y: undefined, \n11   \
  \                             location: 'location3d'\n12                       \
  \       }, TPositionable3D)));\n13   return minion;\n14 }\n```\n\n这将创建一个精瘦的 minion，其中\
  \ `TPositionable3D` 属性的 `x` 和 `y` 属性已被排除。在生成的对象中，`location3d` 方法实际上使用了原始 `TPositionable`\
  \ 特性的 `x` 和 `y` 属性：\n\n```\n 1 const leanMinion = LeanMinion();\n 2 leanMinion.location3d();\n\
  \ 3 // => lean minion is calmly resting at (0, 0, 0)\n 4 leanMinion.location();\n\
  \ 5 // => lean minion is calmly resting at (0, 0)\n 6 \n 7 console.log(leanMinion);\n\
  \ 8 /*\n 9 [object Object] {\n10   toString: function toString() {\n11       return\
  \ 'lean minion';\n12     },\n13   x: 0,\n14   y: 0,\n15   z: 0\n16 }\n 17 */\n```\n\
  \n最后，你可以使用 `Trait.override` 方法来覆盖特性之间的冲突属性。`Trait.override` 的工作方式类似于 `Object.assign`，但其优先级是从左到右的——也就是说，顺序是相反。\n\
  \n按照这个顺序，第一个特性中的属性将覆盖第二个特性的属性，第二个特性中的属性将覆盖第三个特性的属性，以此此类推：\n\n```\n 1 function OverridenMinion(){\n\
  \ 2   const methods = {\n 3     toString() { return 'overriden minion'; }\n 4  \
  \ };\n 5 \n 6   const minion = Object.create(/* prototype */ methods, \n 7     \
  \  Trait.compose(TMovable,\n 8                     Trait.override(TPositionable3D,\
  \ \n 9                                    TPositionable)));\n10   return minion;\n\
  11 }\n```\n\n在生成的 minion 中，所有来自 `TPositionable` 的属性都已被 `TPositionable3D` 覆盖了：\n\n\
  ```\n 1 const overridenMinion = OverridenMinion();\n 2 overridenMinion.location();\n\
  \ 3 // => overriden minion is calmly resting at (0, 0, 0)\n 4 \n 5 overridenMinion.movesTo(1,2);\n\
  \ 6 // => overriden minion moves from (0, 0) to (1, 2)\n 7 overridenMinion.location();\n\
  \ 8 // => overriden minion is calmly resting at (1, 2, 0)\n 9 \n10 console.log(overridenMinion);\n\
  11 /* => \n12 [object Object] {\n13   toString: function toString() {\n14      \
  \ return 'overriden minion';\n15     },\n16 */\n```\n\n\n\n\n\n`Trait.js` 提供了另一个方法\
  \ `Trait.create`，它可以让你实例化高完整性的对象。使用 `Trait.create` 创建的对象将：\n\n- 如果有未满足的要求，则将抛出异常\n\
  - 如果存在未解决的命名冲突，将抛出异常\n- 将其所有方法绑定到它们本身\n- 变为不可变\n\n让我们结合在本章之前定义的某些特性（traits）使用 `Trait.create`。例如，我们可以利用\
  \ `TPositionable` 实例化一个可以定位的小精灵：\n\n```javascript\n 1 function ImmutableMinionWithPosition(){\n\
  \ 2   const methods = {\n 3     toString(){ return 'minion';}\n 4   };\n 5   const\
  \ minion = Trait.create(/* prototype */ methods, \n 6                          \
  \   /* traits */ TPositionable);\n 7 \n 8   return minion;\n 9 }\n10 \n11 const\
  \ immutableMinion = new ImmutableMinionWithPosition();\n12 immutableMinion.location();\n\
  13 // => minion is calmly resting at (0, 0)\n```\n\n生成的 `immutableMinion` 是一个不可变对象。尝试更改、删除或添加新属性将导致异常（这在\
  \ `strict mode` 模式下生效，否则它将静默失败）：\n\n```javascript\n1 immutableMinion.x = 10;  \n\
  2 // => TypeError: Cannot assign to read only property 'x \n3 \n4 delete immutableMinion.x;\
  \ \n5 // => TypeError: Cannot delete property 'x'\n6 \n7 immutableMinion.health\
  \ = 100; \n8 // => TypeError: Can't add property health, object is not extensible\n\
  ```\n\n正如我们早些介绍的那样，如果我们尝试创建一个缺少要求的对象，`Trait.create` 将立即通过抛出组合异常来通知我们。\n\n例如，如果我们尝试创建一个带有\
  \ `TMovable` 特性的新小精灵，而该特性需要 `x` 和 `y` 属性，但我们没有提供这些属性：\n\n```javascript\n 1 function\
  \ ConfusedMinionThatThrows(){\n 2   const methods = {\n 3     toString() { return\
  \ 'confused minion'; }\n 4   };\n 5   \n 6   // TMovable 特性需要两个属性：x 和 y\n 7   const\
  \ minion = Trait.create(/* prototype */ methods, TMovable);\n 8   return minion;\n\
  \ 9 }\n10 \n11 const confusedMinionThatThrows = ConfusedMinionThatThrows();\n12\
  \ // => Error: Missing required property: x\n```\n\n在尝试创建一个具有未解决冲突的对象时也是如此，例如当结合\
  \ `TPositionable` 和 `TPositionable3D` 特性时：\n\n```javascript\n 1 function ConflictedMinionThatThrows(){\n\
  \ 2   const methods = {\n 3     toString() { return 'conflicted minion' }\n 4  \
  \ };\n 5   const minion = Trait.create(/* prototype */ methods, \n 6       Trait.compose(TPositionable,\
  \ TPositionable3D));\n 7   return minion;\n 8 }\n 9 \n10 const conflictedMinionThatThrows\
  \ = ConflictedMinionThatThrows();\n11 // => Error: Remaining conflicting property:\
  \ location\n```\n\n通常情况下，你会发现 `Trait.create` 比 `Object.create` 提供了更好的开发者体验，并帮助你创建不可变的高完整性对象。但如果你所有的对象都是不可变的，你该如何构建应用程序呢？如果你无法更改状态，如何让小精灵移动呢？你有两个选择：\n\
  \n1. 分离可变和不可变状态\n2. 拥抱不可变性\n\n### 分离可变不可变状态\n\n享受 `Trait.create` 提供的卓越开发者体验并允许面向对象编程常见的可变状态的一种简单方法是将可变与不可变状态分离。\n\
  \n你可以通过将可变状态保持在函数作用范围内并使用闭包来访问和转换它来实现。如果其他特性或最终对象的用户需要访问可变状态，你需要通过 getter 和 setter\
  \ 使可用。\n\n让我们重新定义 `TPositionable` 以将可变状态与公共不可变状态分离。我们首先将特性封装在一个函数内部，该函数将作为定位特性的工厂，并允许它们拥有自己的状态：\n\
  \n```javascript\n1 function TPositionable(x, y){\n2   return Trait({\n3     location(){\n\
  4       console.log(`${this} is calmly resting at (${x}, ${y})`);\n5     }\n6  \
  \ });\n7 }\n```\n\n下一步是使用 getter 和 setter 让其他特性能够访问可变状态 `x`, `y`：\n\n```javascript\n\
  \ 1 function TPositionable(x, y){\n2   return Trait({\n 3     // 现在其他特性可以根据这些属性\n\
  \ 4     // 定义要求\n 5     // 甚至可以访问它们。\n 6     // 对象用户也是如此\n 7     get x() { return\
  \ x; },\n8     set x(value) { x = value; },\n9     get y() { return y; },\n10  \
  \   set y(value) { y = value; },\n11 \n12     location(){\n13       console.log(`${this}\
  \ is calmly resting at (${x}, ${y})`);\n14     }\n15   });\n16 }\n```\n\n我们现在可以定义另一个特性\
  \ `TMovable`，它要求目标对象具有 `x` 和 `y` 属性，并提供允许任何对象移动的行为：\n\n```javascript\n1 function\
  \ TMovable(){\n2   return Trait({\n3     movesTo(newX, newY){\n4       console.log(`${this}\
  \ moves from (${this.x}, ${this.y}) to (${newX}, ${newY})`);\n5       this.x = newX;\n\
  6       this.y = newY;\n7     }\n8   });\n9 }\n```\n\n最后，可以通过组合这些特性来创建一个 `StatefulMinion`：\n\
  \n```javascript\n1 function StatefulMinion(x, y){\n2   const methods = {\n3    \
  \ toString(){ return 'minion';}\n4   };\n5 \n6   const minion = Trait.create(/*\
  \ prototype */ methods, \n7                             Trait.compose(TPositionable(x,\
  \ y), TMovable()));\n8   return minion;\n9 }\n```\n\n这个忠诚的仆人现在可以定位并移动：\n\n```javascript\n\
  1 const statefulMinion = StatefulMinion(1, 1);\n2 \n3 statefulMinion.location();\n\
  4 // => minion is calmly resting at (1, 1)\n5 statefulMinion.movesTo(2, 2);\n6 //\
  \ => minion moves from (1, 1) to (2, 2)\n7 statefulMinion.location();\n8 // => minion\
  \ is calmly resting at (2, 2)\n```\n\n太棒了！现在我们既获得了面向对象编程熟悉的り变状态处理，而且如果我们忘记某些属性或定义了具有冲突的新特性，`Trait.create`\
  \ 会立即警告我们。万岁！\n\n### 拥抱不可变性\n\n第二个选项是拥抱不可变性。在这种做法常见的传统的函数式编程中，答案是重写更改的方法以创建新对象。在这种语境下，`movesTo`\
  \ 方法不仅仅是更改当前对象的位置，而是创建一个反映新位置的完整新对象。然而，由于特性不是完整对象而只是片段，这种方法被证明是具有挑战性的，因为它要求特性必须了解其完整对象的形状。\n\
  \n一种可能的解决方案是使用类似 Redux 的架构，其中特性方法不会实例化新对象，而是触发一个表示所需更改的动作，最终导致在集中存储库中考虑所有特性的情况下从头创建一个新状态。但这需要本章范围之外的详细论述。\n\
  \n下面你可以找到使用 `Object.create` 和 `Trait.create` 的总结对比：\n\n| Object.create | Trait.create\
  \ |\n| --- | --- |\n| 即使存在未满足的要求或未解决的冲突也可以创建对象。 | 存在未满足的要求或未解决冲突无法创建对象。 |\n| 未满足的要求会导致只读属性。在严格模式下尝试更改它们时会抛出异常。\
  \ | 未满足的要求在实例化对象时就会抛出异常。 |\n| 访问具有未解决冲突的属性会抛出异常。 | 未解决的冲突在实例化对象时就会抛出异常。 |\n| 创建的对象没有绑定方法。\
  \ | 创建的对象的所有方法都已绑定。 |\n\n\n\n\n\n| 创建的对象可以被修改并添加新属性增强。 | 创建的对象是不可变的。你无法向其添加新属性、删除属性或修改现有属性。\
  \ |\n\n### Traits（特性）与 Mixins（混入）\n\n| Mixins | Traits |\n| :--- | :--- |\n| 基于通过\
  \ `Object.assign` 进行对象组合的无类继承。它允许你封装功能和行为，并轻松地复用它们。 | 基于特性的组合的无类继承。它允许你封装功能和行为，并轻松地复用它们。\
  \ |\n| Mixins 没有表达需求的方法。Mixin 可能期望组合对象中存在某个属性或方法，但它没有方法来表示这一点。如果未满足需求，可能会发生不可预测的副作用。\
  \ | Traits 可以表示它们运行需要特定的属性或方法。未能满足需求将导致在尝试赋值不存在的必需属性或在创建对象时（`Trait.create`）抛出错误。\
  \ |\n| 仅允许线性组合。后组合的 mixins 会覆盖之前的 mixins。 | 可以自由地组合，因为它们要求你显式地解决任何冲突。 |\n| | |\n\
  | | 冲突可以通过重命名、排除属性或覆盖特性来解决。 |\n| | |\n| | 未解决的冲突将在访问冲突属性或方法时或在创建对象时（使用 `Trait.create`）抛出异常。\
  \ |\n| 使用闭包和 symbol 支持数据隐私。 | 使用闭包和 symbol 支持数据隐私。`Trait.js` 不支持 symbol，但这更多是实现细节，而不是特性本身不支持\
  \ symbol。 |\n| 对象 mixins 可能会导致从同一个 mixin 组合的不同对象之间产生状态耦合。 | Traits 也会导致组合对象之间存在状态。为了避免这种情况，请将你的\
  \ trait 封装在 trait 工厂函数内部。这将确保新对象是由新状态组合的。 |\n| | |\n| 函数性 mixins 通过兼当对象工厂提供了此问题的解决方案，确保每个新对象都是与新状态组合的。\
  \ | |\n| Mixins 通常扩展现有的对象或类。 | Traits 通过组合许多特性来从零开始创建新对象，而不是扩展现有的对象或类。 |\n| | 支持使用\
  \ `Trait.create` 轻松创建高完整性的对象。 |\n\n## 结语\n\n`Traits` 是 `mixins` 的一种`无类`面向对象编程替代方案。就像\
  \ `mixins` 一样，它们封装了可以组合在一起创建复杂对象的可复用行为片段。相比之下，它们是对 `mixins` 的改进，因为它们允许你在特性中表达需求并积极解决冲突。这两个特性都使得代码更不容易出错，因为组合错误不会静默失败并像使用\
  \ `mixins` 那样产生意外的副作用。\n\n`Traits.js` 是一个将特性引入 JavaScript 的库。它允许你通过 `Trait` 工厂方法定义特性，通过\
  \ `Trait.compose` 组合特性，使用 `Trait.required` 定义需求，并通过 `Trait.resolve` 解决冲突。\n\n`Traits.js`\
  \ 提供了两种从特性实例化对象的方法：`Object.create` 和 `Trait.create`。第一种是 JavaScript 原生的，它创建可以被修改和增强的纯\
  \ JavaScript 对象。使用 `Object.create` 时，未满足的需求会导致只读属性，访问具有未解决冲突的属性会导致异常。`Trait.create`\
  \ 提了一个比 `Object.create` 高完整性的替代方案，具有更短的反馈循环。在缺少需求或存在未解决冲突时，它会在创建对象时抛出异常。`Trait.create`\
  \ 返回不可变对象，我们无法对其添加新属性，且其属性无法更改或删除。 |\n\n## 练习\n\n## 黑塔召唤：使用 Stamps 进行进阶对象组合\n\n\
  ```\n采用组合\n而非继承\n\n        - Gill Of Fyra\n模式设计者 \n```\n\n### 我称它们为 Stamps（印章）\n\
  \n在最后两个章节中，你学习了经典面向对象编程的两个伟大替代方案：`mixins` 和 `traits`。这两种技术都拥抱 JavaScript 的动态特性。它们都鼓励创建小型的可复用组件，你可以将它们与现有对象混合，或者将它们组合在一起从零创建新对象。\n\
  \n对象和函数 `mixins` 是对象组合最简单的方法。配合 `Object.assign`，它们使得可以非常容易地创建小型的可复用行为单元，并用它们来增强你的领域对象。\n\
  \n`Traits` 延续了 `mixins` 的组合性传统，并在基础上增加了额外的层表达能力和安全性。它们允许你定义必需属性、解决命名冲突，并在当你未能正确组合特性时向你警告。\n\
  \n在本章中，你将学习一种通过对象组合实现无类继承的新技术。这种特定技术不仅拥抱 JavaScript 的动态特性，还拥抱了其实现代码复用的许多方式：原型、mixins\
  \ 和闭包。看吧！**Stamps**！\n\n### 什么是 Stamps？\n\n**Stamps 是可组合的工厂函数**。就像普通的工厂函数一样，它们允许你创建新对象，但是，惊喜的是，它们还具有惊天地的能力，可以彼此组合。工厂组合将开启一个充满可能的世界和一个全新的无类面向对象编程范式，正如你很快就会看到的。\n\
  \n想象你有一个创建一个可以 `wield`（挥舞）的剑的工厂函数：\n\n```\n 1 const Sword = () =>\n2   ({\n3   \
  \  description: 'common sword',\n4     toString(){ return this.description;},\n\
  5     wield(){\n6       console.log(`You wield ${this.description}`);\n7     }\n\
  8   });\n9 \n10 const sword = new Sword();\n11 sword.wield();\n```\n\n另一个是创建可以 `throw`（投掷）的致命短刀的工厂函数：\n\
  \n```11 const Knife = () =>\n2   ({\n3     description: 'rusty knife',\n4     toString(){\
  \ return this.description},\n5     throw(target){\n6       console.log(`You throw\
  \ ${this.description} ` +\n7                   `towards ${target}`);\n8     }\n\
  9   });\n10\n11 const knife = new Knife();\n12 knife.throw('orc');\n```\n\n如果有一种方法可以将\
  \ `wielding` 和 `throwing` 结合起来，让你可以 `wield` 把刀或者 `throw` 一把剑，不是很好吗？这正是 `stamps`\
  \ 让你做的事情。通过 `stamps`，你可以定义封装行为片段的工厂函数，之后将它们相互组合。\n\n在开始组合之前，让我们把 `Sword` 和 `Knife`\
  \ 拆解为定义它们的独立行为。每一个这些行为都将由一个独立的 stamp 表示，我们将借助 `stampit` 函数（`stampit` 库的核心 API）来创建这些\
  \ stamp。\n\n所以，我们为可以挥舞的东西创建 stamps：\n\n```\n1 // 挥舞东西\n2 const Wieldable = stampit({\n\
  3   methods: {\n4     wield(){\n5       console.log(`You wield ${this.description}`);\n\
  6     }\n7   }\n8 });\n```\n\n可以被投掷的东西：\n\n```\n1 // 投掷东西\n2 const Throwable = stampit({\n\
  3   methods: {\n4     throw(target){\n5       console.log(`You throw ${this.description}\
  \ ` +\n6                   `towards ${target}`);\n7     }\n8   }\n9 });\n```\n\n\
  以及可以被描述的东西：\n\n```\n1 // 或者描述某物\n2 const Describable = stampit({\n3   methods: {\n\
  4     toString(){\n5       return this.description;\n6     }\n7   },\n8   // 默认描述\n\
  9   props: {\n10     description: 'something' \n11   },\n12   // 允许你初始化描述\n13  \
  \ init({description=this.description}){\n14     this.description = description;\
  \ \n15   }\n16 });\n```\n\n\n在上面的示例中，我们使用 `stampit` 函数创建了三个不同的印章：`Wieldable`、`Throwable`\
  \ 和 `Describable`。`stampit` 函数接收一个 `configuration object`（配置对象），该对象代表了如何创建对象，并生成一个使用该配置创建新对象的工厂。\n\
  \n在我们的示例中，我们使用了 `configuration object` 的不同属性来创建印章：\n\n* `methods`：允许我们定义对象应该拥的方法，如\
  \ `wield`、`throw` 和 `toString`。\n* `props`：让我们为对象的 `description` 设置默认值。\n* `init`：允许印章的使用者使用给定的\
  \ `description` 初始化对象。\n\n结果，`Wieldable` `stamp`（印章）创建了拥有 `wield` 方法的对象，`Throwable`\
  \ `stamp` 创建了拥有 `throw` 方法的对象，以此此类推。\n\n一旦你定义了这些 `stamps`（印章），你就可以使用 `compose` 方法将它们组合成另一个代表武器的\
  \ `stamp`：\n\n```\n1 const Weapon = stampit()\n2   .compose(Describable, Wieldable,\
  \ Throwable);\n```\n\n现在你可以使用这个 `stamp` `Weapon`（它的工作方式就像工厂一样）来创建新的强大武器，并对它们进行 `wield`（挥动）、`throw`（投掷）和描述。\n\
  \n让我们从一把巨剑开始：\n\n```\n1 const anotherSword = Weapon({description: 'migthy sword'});\n\
  2 \n3 anotherSword.wield();\n4 // => 你挥起了巨剑\n5 anotherSword.throw('ice wyvern');\n\
  6 // => 你将巨剑投向了冰冰翼龙\n```\n\n注意我们是如何将一个带有 `description` 属性的对象传递给印章的？这个 `description`\
  \ 将被转发到我们之前定义的 `Describable` 印章的 `init` 方法中。\n\n祭祀刀呢？\n\n```\n1 const anotherKnife\
  \ = Weapon({description: 'sacrificial knife'});\n2 \n3 anotherKnife.wield();\n4\
  \ // => 你挥起了祭祀刀\n5 anotherKnife.throw('heart of the witch');\n6 // => 你将祭祀刀投向了巫术的心\n\
  ```\n\n耶！我们做到了！通过印章，我们能够为可以被挥动、投掷和描述的东西创建工厂，并将它们组合在一起，创建出既能挥动又能投掷的剑和刀。这些示例仅仅接触了\
  \ `stamps` 能力的冰角。还有更多精彩等着你。让我们继续吧！\n\n### Stamps 拥抱 JavaScript\n\n`stamps` 一个非常有趣的特性是将它与其他现有的对象组合方法区别开来，在于它真正拥抱了\
  \ JavaScript 的优势和惯用写法。`Stamps` 使用了：\n\n* `Prototypical inheritance`（原型继承），让你能够利用原型在对象之间共享方法。\n\
  * `Mixins`（混入），让你能够与你的印章组合行为片段，使用默认值、初始化或重写属性。\n* `Closures`（闭包），让你你能够实现数据私有化，并仅通过你选择的接口暴露它。\n\
  \n此外，印章将所有这些特性封装在一个非常直观的声明式接口中：\n\n```\n 1 let stamp = stampit({\n 2   // 通过原型继承继承的方法\n\
  \ 3   methods: {...}, \n4\n 5   // 通过 Object.assign (mixin) 混合的属性和方法\n 6   props:\
  \ {...}, \n7\n 8   // 通过递归算法混合的属性和方法 \n 9   // (深度拷贝混入)\n10   deepProps: {...} \n\
  11\n 12   // 可以包含私有成员的闭包\n 13   init: function(arg0, context){...}, \n 14 });\n\
  ```\n\n### Stamps 示例\n\n让我们继续剑和刀的示例——毕竟如果我们想击败 `The Red Hand`（红手），我们需要为军队装备——并介绍\
  \ `stamps` 提供的每个功能。\n\n在接下来的章节中，我们将根据需要使用新的 `stamp` 选项从头定义武器 `stamp`，并展示 `stamps`\
  \ 如何利用不同的 JavaScript 特性。\n\n#### 原型继承与 Stamps\n\n我们将首先定义一些可以在所有武器之间共享的常用方法，因此将它们放在\
  \ `prototype`（原型）中是有意义。为了做到这一点，我们使用了之前示例中看到的 `methods` 属性：\n\n```\n 1 const AWeapon\
  \ = stampit({\n 2   methods: {\n 3     toString(){\n 4       return this.description;\n\
  \ 5     },\n 6     wield(target){\n 7       console.log(`You wield the ${this} `\
  \ + \n 8                   `and attack the ${target}`);\n 9     },\n10     throw(target){\n\
  11       console.log(`You throw the ${this} ` + \n12                   `at the ${target}`);\n\
  13     }\n14   }\n15 });\n```\n\n我们现在有了一个拥有 `toString`、`wield` 和 `throw` 三个方法的 `AWeapon`\
  \ 印章，我们可以用它来实例化像这把剑这样的新武器：\n\n```\n1 const aSword = AWeapon({description: 'a sword'});\n\
  2 aSword.wield('giant rat');\n3 // => 你挥起剑并攻击了巨型鼠\n```\n\n你可以使用 `Object.getPrototypeOf()`\
  \ 来验证包含在 `methods` 属性中的所有这些方法都是 `aSword` 对象原型形的一部分：\n\n```\n1 console.log(Object.getPrototypeOf(aSword));\n\
  2 // => [object Object] {\n3 //    throw:....\n4 //    toString:...\n5 //    wield:...}\n\
  ```\n\n`Object.getPrototypeOf` 方法返回 `aSword` 对象的原型，正如我们预期的，它包含了我们寻找的所有方法：`throw`、`wield`\
  \ 和 `toString`。\n\n#### Mixins 与 Stamps\n\n`props` 和 `deepProps` 属性允许你定义通过 `stamps`\
  \ 创建的每个对象将包含的属性或方法。这两个属性定义了一个 `object mixin`（对象混入），该混入将与由 `stamp` 创建的对象组合：\n\n*\
  \ `props` 对象内部的属性使用 `Object.assign` 合并，因此被原样复制到新对象中。\n* `deepProps` 对象内部的属性会被深度拷贝，然后使用\
  \ `Object.assign` 合并，这保证了通过 `stamp` 创建的对象之间不会共享任何状态。如果你有带有对象或数组的属性，这非常重要，因为你不希望其中一个对象的状态变化影响到其他对象。\n\
  \n我们可以使用 `props` 和 `deepProps` 扩展之前的武器示例，为我们的武器添加新功能。这些包括：\n\n1. 在检查（`examine`）时获取详细描述\n\
  2. 使用咒语对武器进行魔法（`enchant`）\n\n```\n1 const AWeapon = stampit({\n2   props: {\n3 \
  \    // 1. 检查能力的属性\n4     weight: '4 stones',\n5     material: 'iron',\n6     description:\
  \ 'weapon'\n7   },\n8   deepProps: {\n9     // 2. 魔法能力的深度拷贝属性\n10     enchantments:\
  \ []\n11   },\n12   methods: {\n13     /* \n14        为了节省空间而折叠\n15        toString(){...},\n\
  16        wield(target){...},\n17        throw(target){...},\n18     */\n19    \
  \ examine(){\n20       console.log(`You examine the ${this}. \n21       It's made\
  \ of ${this.material} and ${this.examineWeight()}.\n22       ${this.examineEnchantments()}.`)\n\
  23     },\n24     examineWeight(){\n25       const weight = Number.parseInt(this.weight);\n\
  26       if (weight > 5) return 'it feels heavy';\n27       if (weight > 3) return\
  \ 'it feels light';\n28       return 'it feels surprisingly light';\n29     },\n\
  30     examineEnchantments(){\n31       if (this.enchantments.length === 0) \n32\
  \         return 'It is not enchanted.';\n33       return `It seems enchanted: ${this.enchantments}`;\n\
  34     },\n35     enchant(enchantment){\n36       console.log(`You enchant the ${this}\
  \ with ${enchantment}`);\n37       this.enchantments.push(enchantment)\n38     }\n\
  39   },\n40   init({description = this.description}){\n41     this.description =\
  \ description;\n42   }\n43 });\n```\n\n现在我们可以 `examine` 我们的武器了，从现在起它们将拥有 `weight`\
  \ 并由某种 `material` 制成：\n\n```\n1 const aWeightedSword = AWeapon({\n2   description:\
  \ 'sword of iron-ness'\n3 });\n4 \n5 aWeightedSword.examine();\n6 // => 你检查了这把铁质剑。\n\
  7 //    它是由铁制成的，而且感觉很轻。\n8 //    它没有被注入魔法。\n```\n\n\n\n\n甚至可以使用强大的咒对它们进行 `enchant`：\n\
  \n```\n1 aWeightedSword.enchant('speed +1');\n2 // => 你为铁剑附魔了 speed +1\n3 \n4 aWeightedSword.examine();\n\
  5 // => 你检查了这把铁制剑。 \n6 //    它是由铁制成的，感觉很轻。\n7 //    它似乎被附了魔：speed +1。\n```\n\n值得注意的是，在创建新对象时，作为参数传递给\
  \ `stamp` 函数的对象将传递给所有定义的初始化器（`init` 方法）。例如，在上面的示例中，我们调用了带有对象 `{description: 'sword\
  \ of iron-ness'}` 的 `AWeightedWeapon` stamp。该对象被传递给了该 stamp 的 `init` 方法，并被用于初始化生成的\
  \ `aWeightedSword` 对象的武器描述。如果有更多带有 `init` 方法的 stamp，该对象将作为参数传递给它们中的每一个。\n\n除了使用\
  \ `props` 和 `deepProps` 来定义通过印章（stamps）创建的对象的结构外，我们还可以将它们与之前章节中看到的相同 `mixins` 结合使用。也就是说，我们可以利用以前定义的表示行为的\
  \ mixins，并将它们与我们新创建的 stamps 组合。\n\n例如，我们可以定义一个重用的 `madeOfIron` `mixin`：\n\n```\n\
  1 const madeOfIron = {\n2     weight: '4 stones',\n3     material: 'iron'\n4 };\n\
  ```\n\n并将其作为 `props` 对象的一部分传递：\n\n```\n1 const AnIronWeapon = stampit({\n2   props:\
  \ madeOfIron, \n3   ...\n4 });\n```\n\n使用 `stamp` 链式 API 可以更轻松地实现这种 `object composition`（对象组合），我们将在后续章节中详细介绍它：\n\
  \n```\n1 const AnHeavyIronHolyWeapon = \n2   // 一个加重量武器\n3   AWeightedWeapon\n4\
  \   // 与 madeOfIron mixin 组合\n5   .props(madeOfIron)\n6   // 与 veryHeavyWeapon mixin\
  \ 组合\n7   .props(veryHeavyWeapon)\n8   // 与 holyEnchantments mixin 的深拷贝版本组合\n9 \
  \  .deepProps(holyEnchantments);\n```\n\n### 数据隐私与印章（Stamps）\n\n让我们想象一下我们不想向所有人暴露我们是如何实现武器附魔引擎的，以便将来对其进行更改和优化。是否有方法可以让这些信息私有化？是的，确实有。`Stamps`\
  \ 通过 `init` 属性使用闭包来实现数据隐私。\n\n让我们回到之前的武器示例，并将附魔实现私有化。我们将通过将 `enchantments` 属性从公共\
  \ API（`props`）移动到 `init` 函数来实现，从而将其与外部世界隔离。由于访问此私有 `enchantments` 属性的方式是通过闭包的，我们需要将所有需要访问该属性的方法也移动到\
  \ `init` 函数内部（`examineEnchantments` 和 `enchant`）：\n\n```\n 1 const APrivateWeapon\
  \ = stampit({\n 2   methods: {\n 3     /*  \n4         如之前的示例所示\n 5         toString(){...},\n\
  \ 6         wield(target){...},\n 7         throw(target){...},\n 8     */\n 9 \
  \    examine(){\n10       console.log(`你检查了 ${this}. \n11 它是由 ${this.material} 制成的，重量为\
  \ ${this.examineWeight()}.\n12 ${this.examineEnchantments()}.`)\n13     },\n14 \
  \    examineWeight(){\n15       const weight = Number.parseInt(this.weight);\n16\
  \       if (weight > 5) return '感觉很重';\n17       if (weight > 3) return '感觉很轻';\n\
  18       return '感觉出奇地轻';\n19     }\n20   },\n 21  props: {\n22    weight: '4 stones',\n\
  23    material: 'iron',\n24    description: 'weapon'\n25  },\n26  init: function({description=this.description}){\n\
  27    // 这个私有变量是被闭包的\n28    const enchantments = []; \n29    this.description =\
  \ description;\n30    \n31    // 增强正在创建的对象\n32    // 添加 examineEnchantments 和 enchant\n\
  33    // 方法\n34    Object.assign(this, {\n35      examineEnchantments(){\n36   \
  \      if (enchantments.length === 0) return '没有附魔。';\n37         return `似乎被附了魔：${enchantments}`;\n\
  38      },\n39      enchant(enchantment){\n40         console.log(`你为 ${this} 附了魔\
  \ ${enchantment}`);\n41         enchantments.push(enchantment)\n42      }\n43  \
  \  });\n44  }\n45 });\n```\n\n`init` 函数将在创建对象期间被调用，并将对象本身作为上下文（`this`）。这允许我们通过封装\
  \ `enchantments` 属性的 `examineEnchantments` 和 `enchant` 方法来增强对象。因此，当我们使用这个 stamp\
  \ 创建对象时，它将有一个私有变量 `enchantments`可以通过这些方法进行操作。\n\n在定义了这个新 stamp 后，我们可以验证 `enchantments`\
  \ 属性现在确实是私有的：\n\n\n\n\n正如我们之前提到的，这个 `options` 对象将作为第一个参数传递给 `init` 函数，从而导致生成的武器只能容纳一个魔文：\n\
  \n```\n 1 onlyOneEnchanmentWeapon.examine();\n 2 // => 你检查了那把隐私之剑。 \n 3 //它是由铁制成的，感觉很轻。\n\
  \ 4 //它没有附魔。\n 5 \n 6 onlyOneEnchanmentWeapon.enchant('luck +1');\n 7 // => 你给一把单次魔文剑附上了\
  \ luck +1\n 8 \n 9 onlyOneEnchanmentWeapon.enchant(\n10   'touch of gold: everything\
  \ you touch becomes gold');\n11 // => 噢不！这个武器不能再次附魔了！\n```\n\n正如你在这个示例中看到的，`init`\
  \ 函数为你的 `stamps` 增加了很多灵活性，因为它允许你在创建时通过额外参数（例如 `maxNumberOfEnchantments`）对其进行配置。\n\
  \n### Stamp 的组合\n\n**Stamps 非常擅长组合**。一方面，你通过组合 `prototypes`、`mixins` 和 `closures`\
  \ 来产生单个 `stamp`。另一方面，你可以像在在本章介绍中看到的单词、刀具、挥持和投掷那样，将 `stamps` 相互组合。\n\n让我们仔细观察一下 stamp\
  \ 的组合。紧接前几节中 `weapons` 的示例，假设突然我们需要一种方法来表示 `potions`（药水）和 `armors`（护甲）。\n\n**我们该怎么做？**\n\
  \n嗯，我们可以通过将 `weapon` stamp 拆分为更小的、可重用的行为开始，这些行为也表示为 `stamps`。我们已经在章节开头定义了 `Throwable`、`Wieldable`\
  \ 和 `Describable` 行为：\n\n```\n 1 const Throwable = stampit({\n2   methods: {\n3\
  \     throw(target){\n4       console.log(`You throw the ${this.description} ` +\
  \ \n5                   `towards the ${target}`);\n6     }\n7   }\n8 });\n 9 \n\
  10 // 挥持某\n11 const Wieldable = stampit({\n12   methods: {\n13     wield(target){\n\
  14       console.log(`You wield the ${this.description} ` + \n15               \
  \    `and attack the ${target}`);\n16     }\n17   }\n18 });\n 19 \n20 // 或者描述某物\n\
  21 const Describable = stampit({\n22   methods: {\n23     toString(){\n24      \
  \ return this.description;\n25     }\n26   },\n27   props: {\n28     description:\
  \ 'something'\n29   },\n30   init({description=this.description}){\n31     this.description\
  \ = description;\n32   } \n33 });\n```\n\n我们可以定义新的 `Weighted` 和 `MadeOfMaterial`\
  \ stamps 来表示具有重量的东西以及由某种材料制成的东西：\n\n```\n 1 const Weighted = stampit({\n2   methods:\
  \ {\n3     examineWeight(){\n4       const weight = Number.parseInt(this.weight);\n\
  5       if (weight > 5) return 'it feels heavy';\n6       if (weight > 3) return\
  \ 'it feels light';\n7       return 'it feels surprisingly light';\n8     }\n9 \
  \  },\n10   props: {\n11    weight: '4 stones'\n12   },\n13   init({weight=this.weight}){\n\
  14     this.weight = weight;\n15   }\n16 });\n 17 \n18 const MadeOfMaterial = stampit({\n\
  19   methods: {\n20     examineMaterial(){\n21       return `It's made of ${this.material}`;\n\
  22     }\n23   },\n24   props: {\n25     material: 'iron'\n26   },\n27   init({material=this.material}){\n\
  28     this.material = material;\n29   }\n30 });\n```\n\n最后，还有一个 `Enchantable` stamp\
  \ 来表示可以被附魔的东西：\n\n```\n 1 const Enchantable = stampit({\n2  init: function({maxNumberOfEnchantments=10}){\n\
  3    // 这个私有变量被闭包了\n4    const enchantments = []; \n5    \n6    Object.assign(this,\
  \ {\n7      examineEnchantments(){\n8        if (enchantments.length === 0) return\
  \ 'It is not enchanted.';\n9        return `It seems enchanted: ${enchantments}`;\n\
  10      },\n11      enchant(enchantment){\n12        if(enchantments.length ===\
  \ maxNumberOfEnchantments) {\n13          console.log('Oh no! This weapon cannot\
  \ be enchanted ' + \n14                      'any more!');\n15        } else {\n\
  16          console.log(`You enchant the ${this} with ${enchantment}`);\n17    \
  \      enchantments.push(enchantment);\n18        }\n19      }\n20    });\n21  }\n\
  22 });\n```\n\n现在我们已经识别了所有可重用的行为，开始将它们组合在一起。我们可以将最基础的行为封装在一个 `Item` `stamp` 中：\n\
  \n```\n1 const Item = stampit()\n2            .compose(Describable, Weighted)\n\
  ```\n\n\n\n在之前的两个示例中，我们添加了两种行为——饮用和穿戴——作为 `Potion` 和 `Armor` `stamps`（印章）的一部分。使用这种方法允许我们创建一个丰富的丰富的领域模型，并可以随心所欲地复用和组合这些行为。这些印章产生类似于领域特定语言的词汇，使我们能够用其他印章来表达一个印章，或者用领域模型中的一个思想或概念来表达另一个概念：\n\
  \n```\n1 const Armor = stampit().compose(Item, Wearable, Enchantable);\n2 // =>\
  \ 护甲是一个可以穿戴且可以附魔的物品\n3 \n4 const Weapon = stampit().compose(Item, Throwable, Wieldable);\n\
  5 // => 武器是一个可以投掷或挥持的物品\n6 \n7 const Potion = stampit().compose(Item, Drinkable,\
  \ Throwable);\n8 // => 药水是一个可以饮用或投掷的物品\n```\n\n很酷对吧？你最终获得了一种非常声明式、易读、灵活且可扩展的对象处理方式。现在想象一下，如果使用传统的继承来实现相同的解决方案，你将需要多少工作量和额外的代码。\n\
  \n## 组合印章时的原型继承\n\n你可能在想……*当你组合两个印章时，原型继承会发生什么？`stampit` 会创建多个原型并在它们之间建立原型链吗？*\n\
  \n答案是否。每当你组合 `stamps` 时，分配给每个 `stamp` 中 `methods` 属性的所有不同方法都会被扁化（单一的 `prototype`（原型）。\n\
  \n让我们用一个例子来说明这一点。假设你想定义元素武器，让你执行强大的元素攻击。为了实现这一点，你将现有的 `AComposedWeapon` 印章与一个带有\
  \ `elementalAttack` 方法的新印章组合：\n\n```\n1 const ElementalWeapon = stampit({\n2   methods:\
  \ {\n3     elementalAttack(target){\n4       console.log(`You wield the ${this.description}\
  \ and perform ` + \n5                   `a terrifying elemental attack on the ${target}`);\n\
  6     }\n7   }\n8 }).compose(AComposedWeapon);\n```\n\n当你实例化一个新的火剑时，你可以轻松地验证 `aFireSword`\
  \ 对象并没有具有单一 `elementalAttack` 方法的原型。相反，原型包含了所有在创建 `ElementalWeapon` 时组合的所有 `stamps`\
  \ 中定义的方法：\n\n```\n 1 const aFireSword = ElementalWeapon({\n 2   description: 'magic\
  \ sword of fire'\n 3 });\n 4 \n 5 console.log(Object.getPrototypeOf(aFireSword));\n\
  \ 6 // => [object Object] {\n 7 //  elementalAttack: ...\n 8 //  examine: ...\n\
  \ 9 //  examineMaterial: ...\n10 //  examineWeight: ...\n11 //  throw: ...\n12 //\
  \  toString: ... \n13 //  wield: ...\n14 // }\n```\n\n如果组合的 `stamps` 之间存在命名冲突，最后一个获胜并覆盖冲突的方法，就像\
  \ `Object.assign` 一样。\n\n## 组合使用闭包定义私有数据并在以后相互组合 `stamps` 的另一个有趣优点是私有数据不会冲突。如果你在两个不同的\
  \ `stamps` 中具有同名的私有成员，并将它们组合在一起，它们将作为两个完全不同的变量运行。\n\n让我们用另一个例子来说明这一点（疯狂示例！！）。如果你还记得之前的章节，`AComposedWeapon`\
  \ 印章允许武器附魔（通过 `Enchanted` 印章），并将这些魔法存储在一个名为 `enchantments` 的私有变量中。*如果我们重写元素武器，让它也有一个名为\
  \ `enchantments` 的私有属性，会发生什么？*\n\n```\n 1 // 我们重新定义元素武器，将其元素属性 \n 2 // 作为某种魔法存储：\n\
  \ 3 \n 4 const AnElementalWeapon = stampit({\n 5   init({enchantments=[]}){   \n\
  \ 6     Object.assign(this, {\n 7       elementalAttack(target){\n 8         console.log(`You\
  \ wield the ${this.description} and ` + \n 9           `perform a terrifying elemental\
  \ attack of ` + \n10           `${enchantments} on the ${target}`);\n11     }});\n\
  12   }\n13 }).compose(AComposedWeapon);\n```\n\n在这个示例中，我们重新定义了元素武器，将其力量像魔法一样存储（即存储在\
  \ `enchantments` 数组内部）。我们将 `elementalAttack` 方法从 `methods` 属性移动到 `init` 属性，以便它能够闭包\
  \ `enchantments` 私有成员，从现在起这将存储元素攻击。\n\n我们继续创建一个新的超级元素武器：一把岩岩枪！\n\n```\n1 const igneousLance\
  \ = AnElementalWeapon({\n2   description: 'igneous Lance', \n3   enchantments: ['fire']\n\
  4 });\n```\n\n但是这个实际上具有两个 `enchantments` 私有成员（来自 `AnElementalWeapon` 和 `Enchanted`\
  \ 印章）的长矛会发生什么？嗯，我们可以通过让长矛运行来轻松地验证它们并不互相影响：\n\n```\n 1 igneousLance.elementalAttack('rabbit');\n\
  \ 2 // => You wield the igneous Lance and perform a \n 3 //    terrifying elemental\
  \ attack of fire on the rabbit\n 4 \n 5 igneousLance.enchant('protect + 1');\n 6\
  \ // => You enchant the igneous Lance with protect + 1\n 7 \n 8 igneousLance.elementalAttack('goat');\n\
  \ 9 // => You wield the igneous Lance and perform a \n10 //    terrifying elemental\
  \ attack of fire on the goat\n```\n\n为什么 `enchantments` 变量没有发生冲突？尽管我经常使用私有成员来引用这些变量，但事实是它们属于\
  \ `stamps` 创建的两个不同作用域。\n\n## 链式 API\n\n除了我们之前在 `stampit` 方法中传递配置对象的 API 之外，如果你更喜欢，可以使用这种链式接口：\n\
  \n```\n1 const stamp = stampit()\n2   // 通过原型继承\n3   methods({\n4     wear(){\n\
  5       console.log(`You wear ${this} in your ` + \n6         `${this.position}\
  \ gaining +${this.protection} ` + \n7         `armor protection.`);\n8   }})\n9\
  \   .props({ \n10     // 这些作为默认值\n11     position: 'chest',\n12     protection:\
  \ 50\n13   })\n14   .init(function init({\n15                    position=this.position,\
  \ \n16                    protection=this.protection}){\n17     this.position =\
  \ position;\n18     this.protection = protection;\n19   })\n20   // 与其它印章组合\n21\
  \   compose(...); \n```\n\n例如，我们可以使用这种新接口重新定义 `Armor` `stamp` 为方法链：\n\n```\n1 const\
  \ FluentArmor = stampit()\n2   .methods({\n3     wear(){\n4       console.log(`You\
  \ wear ${this} in your ` + \n5         `${this.position} gaining +${this.protection}\
  \ ` + \n6         `armor protection.`);\n7   }})\n8   .props({ \n9     // 这些作为默认值\n\
  10     position: 'chest',\n11     protection: 50\n12   })\n13   .init(function init({\n\
  14                    position=this.position, \n15                    protection=this.protection}){\n\
  16     this.position = position;\n17     this.protection = protection;\n18   })\n\
  19   .compose(Item, Enchantable);\n```\n\n它的工作方式正如你预期的一样：\n\n```\n1 const fluentArmor\
  \ = FluentArmor({\n2   description: 'leather jacket',\n3   protection: 70\n4 });\n\
  5 \n6 fluentArmor.wear();\n7 // => You wear leather jacket in your chest \n8 //\
  \    gaining +70 armor protection\n```\n\n\n\n\n重要的是，要理解链式接口的每种方法都会返回一个新的 `stamp`。这意味着，你并没有修改当前的\
  \ `stamp`，而是随着你添加更多方法，不断创建带有新增功能的新 `stamps`。**当你想要在现有的 stamp 或行为之上进行构建时，链式接口变得特别有用**。\n\
  \n### 总结：Stamps vs Mixins vs Traits\n\n**Stamps 就像是加强版的 mixins（混合）**。它们提供了一个极佳的声明式\
  \ API，用于创建和组合你的对象工厂（`stamps`），并内置了对原型组合、特性混合、深拷贝组合以及私有变量的支持。\n\n`Stamps` 真正拥抱了 JavaScript\
  \ 的本质，并利用了它所有的面向对象编程技术：原型继承、通过 mixins 实现的组合继承，以及通过闭包实现信息隐藏。\n\n与 `mixins` 相比，唯一的缺点是它们需要使用第三方库，而\
  \ `Object.assign` 是 JavaScript 的原生方法。\n\n与 `traits` 相比，它们仍然提供了更安全的组合体验，支持必选属性和主动的命名冲突解决。\n\
  \n无论是 mixins、traits 还是 stamps，它们都是让你的面向对象编程更加模块化、可重用、灵活且可扩展的优秀技术，真正利用了 JavaScript\
  \ 的动态特性。\n\n本章总结了我想提供给你的不同对象组合技术，作为经典面向对象编程的替代方案。我希望你喜欢学习它们，并且至少对在下一个项目中尝试它们感到一丝好奇。\n\
  \n### 练习题\n\n## 对象内部原理：对象的秘密\n\n```\n 塑造世界\n是一项高尚的追求，\n\n塑造塑造的艺术，\n雕琢塑造的技艺，\n是大师的标志\n\
  \n        - Sylo Peskimn\n        大师技师 \n```\n\n### 小技巧\n\n到本书为止，我们花了很多精力关注如何在 JavaScript\
  \ 中操作对象，以及这种优美语言所支持的各种面向对象编程范式。在本章和接下来的章节中，我们将尝试一些不同的事情。我们将深入对象的内部工作机制，以及不同的元编程技术，这些技术将让你对定义和操作对象有更多的控制：**ES5\
  \ 对象 API**、**ESnext 装饰器**、`ES6 Proxies`、`ES6 Reflection API` 以及 `ES6 Symbols`。\n\
  \n跟随我一起沉浸到 JavaScript 对象内部的深处，揭开对象的深层秘密吧！\n\n### 你的所有对象都属于 `Object`\n\nJavaScript\
  \ 中几乎所有的对象都继承自 `Object`（就像所有的 C# 对象都继承自 `System.Object` 一样）。这意味着所有对象通过我们在前面章节中描述的原型链，从\
  \ `Object.prototype` 继承属性和方法。因此，为 `Object.prototype` 对象添加新属性和方法，会导致所有对象都能访问这些新的属性和方法。\n\
  \n除了作为基础对象外，`Object` 构造函数还有许多静态方法，可以让你对对象进行更大的控制，并让你获取有关它们的额外信息。使用这些方法，你可以定义一个给定属性是只读的还是枚举的，定义一个对象是否不可变，或者找到给定对象的原型是什么。\n\
  \n听起来很有趣吗？那么让我们来看看这些方法。。\n\n### 使用 Object.defineProperty 定义属性\n\n`Object.defineProperty`\
  \ 允许你通过**属性描述符（property descriptors）**定义新的属性和方法。但什么是属性描述符？它们看起来是什么样？让我们通过一个示例来了解。\n\
  \n假设你有一个 `goat`（羊）：\n\n```\n1 const goat = {};\n```\n\n此时，我们的 `goat` 是一个空对象，这没什么意思。我们可以通过使用下面的属性描述符为它添加一个属性\
  \ `hitPoints`，用来描述 `goat` 所谓的中的生命精华：\n\n```\n1 Object.defineProperty(goat, 'hitPoints',\
  \ {\n2   /* 属性描述符 */\n3   value: 50,\n4   writable: true, \n5   enumerable: true,\n\
  6   configurable: true\n7 });\n```\n\n这导致 `goat` 对象现在有一个值为 `50` 的 `hitPoints` 属性。\n\
  \n瞧！\n\n```\n1 console.log(`Goat has ${goat.hitPoints} hit points`);\n2 // => Goat\
  \ has 50 hit points\n```\n\n好了，所以我们给对象添加了一个属性。*这有什么新的吗？* 我们从第一天起就在给对象添加属性了。\n\n\
  嗯，上一个例子中重要的部分是**属性描述符**。它提供了一些更高程度的控制提示，而这种控制在我们仅仅向对象添加属性时是无法获得的：\n\n```\n1 goat.hitPoints\
  \ = 50\n```\n\n让我们来看看属性描述符，遍历它们的每一个属性，并学习它们如何影响所应用的对象。\n\n#### 属性描述符：数据描述符和访问器描述符\n\
  \n**属性描述符是一个描述对象内部属性或方法应如何行为的对象**。JavaScript 有两种类型的属性描述符：数据描述符（data descriptors）和访问器描述符（accessor\
  \ descriptors）。\n\n你可以使用**数据描述符**来描述对象内的普通属性或方法。我们在上一个例子中为 `hitPoints` 属性使用的描述符就是一个很好的例子：\n\
  \n```\n1 {\n2   /* 数据描述符 */\n3   value: 50,\n4   writable: true, \n5   enumerable:\
  \ true,\n6   configurable: true\n7 }\n```\n\n利用数据描述符，例如我们可以通过将其 `writable` 属性设置为\
  \ `false` 来使属性变为只读：\n\n```\n1 // 使用同一个 goat\n2 Object.defineProperty(goat, 'woolColor',\
  \ {\n3   value: 'brown',\n4   writable: false,\n5   enumerable: true,\n6   configurable:\
  \ true\n7 });\n```\n\n如果你尝试设置这个只读（不可 *writable*）属性的值，你会遇到一个 `TypeError`：\n\n```\n\
  1 goat.woolColor = 'black';\n2 // => TypeError: Cannot assign to read property 'woolColor'\
  \ of object\n```\n\n除了数据描述符，我们还有访问器描述符。访问器描述符代表属性的 getter（get）和 setter（set），用 `get`\
  \ 和 `set` 取替 `value` 和 `writable` 属性。\n\n例如，假设我们要在 `hp` 属性中强制某些不变性，即我们要添加一些验证，以确保\
  \ hp 属性不会获得无效或不一致的值。\n\n再次，我们从一个危险的预测开始：\n\n```\n1 const sheep = {};\n```\n\n这一次，我们将以类似的方式使用数据描述符定义一个底层字段\
  \ `_hitPoints`：\n\n```\n1 Object.defineProperty(sheep, '_hitPoints', {\n2  /* 属性描述符\
  \ */\n3   value: 50,\n4   writable: true, \n5   enumerable: false, // 看这里！\n6  \
  \ configurable: true\n7 });\n```\n\n注意到我们将 `enumerable` 属性设置为 `false` 了吗？这意味着当你遍历该对象的属性时，不希望这个属性出现（尽管现在它是完全公开的，这使其变得稍微难以触及）。\n\
  \n现在我们可以使用访问器描述符将 `hitPoints` 属性定义为 getter/setter 对：\n\n```\n 1 Object.defineProperty(sheep,\
  \ 'hitPoints', {\n 2   /* 访问器描述符 */ \n 3   get(){ return this._hitPoints},\n 4 \
  \  set(value){\n 5     if (value === undefined \n 6        || value === null\n 7\
  \        || value < 0)\n 8       throw new Error(`Invalid value ${value}! Hit points`\
  \ +\n 9                       `should be a number greater than 0!`);\n 10     this._hitPoints\
  \ = value;\n 11   }, \n 12   enumerable: true,\n 13   configurable: true\n 14 });\n\
  ```\n\ngetter 方法直接暴露 `_hitPoints` 值，而 setter 方法包含了我们的验证逻辑。我们可以测试并验证它按预期工作。\n\n当你提供合理的值时，该属性表现正常：\n\
  \n\n\n\n\n```\n1 console.log(`Sheep has ${sheep.hitPoints} hit points`);\n2 // =>\
  \ Sheep has 50 hit points\n3 \n4 // Let's try something simple\n5 sheep.hitPoints\
  \ = 10;\n6 \n7 console.log(`Sheep has ${sheep.hitPoints} hit points`);\n8 // =>\
  \ Sheep has 10 hit points\n```\n\n但当你破坏不变性（invariants）时，你会得到一个描述详细的异常：\n\n```\n\
  1 // Now let's go into the danger zone\n2 try{\n3   sheep.hitPoints -= 20;\n4 }\
  \ catch (e){\n5   console.log(e.message);\n6   // => Invalid value -10! Hit points\
  \ should \n7   // be a number greater than 0!\n8 }\n```\n\n哎呀！而且……\n\n```\n1 //\
  \ And more danger!\n2 try{\n3   sheep.hitPoints = undefined;\n4 } catch (e){\n5\
  \   console.log(e.message);\n6   // => Invalid value undefined! Hit points \n7 \
  \  // be be a number greater than 0!\n8 }\n```\n\n哎哟！……好了，让我们来看看每个属性及其含义。数据描述符（data\
  \ descriptors）和访问器描述符（accessor descriptors）共享两个属性：\n\n- `configurable`：如果为 `true`，允许修改属性描述符并从给定对象删除该属性。默认值为\
  \ `false`。\n- `enumerable`：如果为 `true`，允许枚举属性。如果你熟悉 JavaScript 中的可枚举概念，它意味着在使用 `for...in`\
  \ 循环遍历对象的属性时，该属性会出现。默认值为 `false`。\n\n**数据描述符**描述属性和方法，具有这两个额外属性：\n\n- `writable`：如果为\
  \ `true`，允许修改属性的值。默认值为 `false`。\n- `value`：包含属性的值，可以是任何 JavaScript 表达式。如果是函数，则生成的属性将是一个方法。默认值为\
  \ `undefined`。\n\n**访问器描述符**描述 getter 和 setter，具有另外两个额外属性：\n\n- `get`：表示属性 getter\
  \ 的函数。如果为 `undefined`，则当你尝试使用点表示法检索其值时，属性将返回 `undefined`。一个没有 `get` 方法但有 `set` 方法的属性实际上会变成一个“只写”属性。\n\
  - `set`：表示属性 setter 的函数。如果为 `undefined`，则无法设置该属性。该函数接收一个值作为参数并赋值给属性。一个有 `get` 方法但没有\
  \ `set` 方法的属性实际上会变成一个“只读”属性。\n\n### 使用 Object.defineProperties 定义多个属性\n\n除了能够逐个定义属性外，你还可以使用\
  \ `Object.defineProperties` 方法一次为对象添加许多属性。\n\n假设我们想对最危险的随从 `goat`（羊）进行军事化和武器化。我们可以通过两个新属性\
  \ `weapons` 和 `armor` 来扩展它：\n\n```\n 1 Object.defineProperties(goat, {\n2   weapons:\
  \ {\n3     value: ['knife', 'katana', 'hand-trebuchet'],\n4     enumerable: true,\n\
  5     writable: true,\n6     configurable: true\n7   },\n8   armor: {\n9     value:\
  \ ['templar helmet', 'platemail'],\n110     enumerable: true,\n 11     writable:\
  \ true,\n 12     configurable: true\n 13   }\n 14 });\n```\n\n而且**简直太“羊”了 (shit\
  \ goat serious/非常严重)**：\n\n```\n1 console.log(goat.weapons);\n2 // => [\"knife\"\
  , \"katana\", \"hand-trebuchet\"]\n3 console.log(goat.armor);\n4 // => [\"templar\
  \ helmet\", \"platemail\"]\n```\n\n值得强调的是 `Object.defineProperties` 的第二个参数（即定义新属性的参数）是一个对象而不是你预期的数组。该对象的每个键代表新属性的名称，每个值包含描述其行为的属性描述符。\n\
  \n一只戴着头盔和板甲的羊，这可可有点……\n\n### 使用 ESnext 装饰器进行优属性操作\n\n装饰器（Decorators）是一种方便的声明式方式，可以将属性描述符应用于类、方法、属性和函数。\n\
  \n使用装饰器，我们可以重写羊的只读属性：\n\n```\n1 const goat = {}\n2 // using the very same goat\n\
  3 Object.defineProperty(goat, 'woolColor', {\n4   value: 'brown',\n5   writable:\
  \ false,\n6   enumerable: true,\n7   configurable: true\n8 });\n```\n\n变为：\n\n```\n\
  1 const goat = {\n2   @readOnly\n3   woolColor: 'brown'\n4 }\n```\n\n哇！真不错！正如你从上面的示例中看到的，装饰器有一种特殊的语法，由前跟\
  \ `@` 符号的名称组成。上面的 `readOnly` 装饰器只是一个简单的函数：\n\n```\n1 // Decorator parameters:\n\
  2 // - *target* object\n3 // - decorated *property*\n4 // - property *descriptor*\n\
  5 function readOnly(target, property, descriptor){\n6   console.log(`Making ${property}\
  \ read only!`);\n7   descriptor.writable = false;\n8 }\n```\n\n好得多对吧？`@readOnly`\
  \ 装饰器实现了两点：\n\n- 凭借函数的形式，它可以封装一段可以在应用程序中复用的行为。\n- 它提供了优雅、简洁的语法，明显优于命令式方法。\n\n同样，我们也可以为\
  \ `sheep` 创建装饰器并重写以下内容：\n\n```\n1 const sheep = {}\n2 Object.defineProperty(sheep,\
  \ 'woolColor', {\n3   value: 'brown',\n4   writable: false,\n5   enumerable: true,\n\
  6   configurable: true\n7 });\n```\n\n变为：\n\n```\n1 const sheep = {\n2   @notUndefinedNegative\n\
  3   hitPoints\n4 }\n```\n\n其中 `notUndefinedNegative` 装饰器看起来如下：\n\n```\n1 function\
  \ notUndefinedNegative(target, property, descriptor){\n2   console.log(`Adding validation\
  \ to ${property}!`)\n3   const backingField = descriptor.initializer();\n4   return\
  \ {\n5    /* data descriptor */\n6     get(){ return backingField},\n7     set(value){\n\
  8       if (value === undefined || value === null\n9          || value < 0)\n10\
  \         throw new Error(`Invalid value ${value}! ${property}` +\n11          \
  \       `should be a number greater than 0!`);\n12       backingField = value;\n\
  13     },\n14     enumerable: true,\n15     configurable: true\n16   };\n17 }\n\
  ```\n\n也就是说，返回一个新的描述符替换了与原始属性关联的原始描述符。这引出了装饰器组合（composition）的话题。之前示例的更好写法应该是这样的：\n\
  \n```\n1 const sheep = {\n2   @notNull\n3   @notUndefined\n4   @notNegative\n5 \
  \  hitPoints: 100\n6 }\n```\n\n或者可能是正向的：\n\n```\n1 const sheep = {\n2   @defined\n\
  3   @greaterThanZero\n4   hitPoints: 100\n5 }\n```\n\n在这里我们实际上是在组合不同的运算符并将其应用于给定属性。这种方法更好是因为它更容易阅读，而且现在我们可以更好地复用装饰器。\n\
  \n在示例示例中，`@defined` 装饰器可能像这样：\n\n```\n 1 function defined(target, property, descriptor){\n\
  2   return composeSetter(target, property, descriptor, {\n3     set(value){\n4 \
  \      throwIfInvalid(value)\n5     }\n6   });\n7   function throwIfInvalid(value){\n\
  8     if (value === undefined || value === null)\n9       throw new Error(`Invalid\
  \ value ${value}! ` +\n10          `${property} should be defined!`);\n11   }\n\
  12 }\n```\n\n而这个就是 `@greaterThanZero` 装饰器：\n\n\n\n\n```javascript\nfunction greaterThanZero(target,\
  \ property, descriptor){\n  return composeSetter(target, property, descriptor, {\n\
  \    set(value){\n      throwIfInvalid(value)\n    }\n  });\n  function throwIfInvalid(value){\n\
  \    if (value < 0)\n      throw new Error(`Invalid value ${value}! ` +\n      \
  \    `${property} should be a number ` + \n          `greater than 0!`);\n  }\n\
  }\n```\n\n两者都使用了这个辅助函数来组合 setter 函数：\n\n```javascript\nfunction composeSetter(target,\
  \ property, oldDesc, newDesc){\n  const backingField = (oldDesc.get && oldDesc.get())\
  \ || \n                      oldDesc.initializer(),\n      defaultSetter = (value)\
  \ => backingField = value;\n      \n  return {\n    get: () => backingField,\n \
  \   set: before(oldDesc.set || defaultSetter, newDesc.set)\n  };\n  \n  // 创建一个新函数\
  \ 'newF'\n  // 在调用原始函数 `f` 之前\n  // 调用装饰器函数\n  function before(f, decorator){\n\
  \    return (...args) => {\n      decorator(...args);\n      f(...args);\n    }\n\
  \  }\n}\n```\n\n## 使用装饰器工厂的可配置装饰器\n\n你还可以向装饰器传递参数，这增加了一个额外的扩展性和可配置性，使其更具可复用性。想象一位智的巫师：\n\
  \n```javascript\nconst wizard = {\n    name: 'Wise Wizard'\n};\n```\n\n她必须奔赴战场拯救人类。她需要一些铠甲：\n\
  \n```javascript\nconst wizard = {\n    name: 'Wise Wizard',\n    armor: 'cloth vest'\n\
  };\n```\n\n在战斗中，她可能倾向于将保护性较的布质背心换成高级的骑士板甲。然而，她不能！因为巫师不能穿板甲！\n\n表示这种限制的一种优方法是以以下方式使用装饰器\
  \ `allowedArmors`：\n\n```javascript\nconst wizard = {\n    name: 'Wise Wizard',\n\
  \    @allowedArmors('cloth', 'wool', 'silk')\n    armor: 'cloth vest'\n};\n```\n\
  \n`allowedArmors` 装饰器的实现可能如下：\n\n```javascript\nfunction allowedArmors(...armors){\n\
  \  const decorator = (target, property, descriptor) => {\n    console.log(descriptor);\n\
  \    const backingField = descriptor.initializer();\n    return {\n      set: (value)\
  \ => {\n        if (value !== '' && \n            armors.every(a => !value.includes(a)))\n\
  \          throw new Error(\n            `${target} can't wear armor ${value}.`\
  \ + \n            ` She only can wear these armor classes ${armors}`);\n       \
  \ backingField = value;\n      },\n      get: () => backingField\n    }\n  }\n \
  \ return decorator;\n}\n```\n\n其中 `allowedArmors` 函数本质上是一个装饰器工厂，调用时返回一个可以应用于我们类方法的新装饰器。从现在起，当巫师尝试穿不该穿的铠甲时，她会被以下错误感到惊讶：\n\
  \n```javascript\ntry {\n  wizard.armor = 'plate mail';\n} catch (e) {\n  console.error(e.message);\n\
  \  // => Wise Wizard can't wear armor plate mail. \n  // She can only wear these\
  \ armor classes cloth,wool,silk\n}\n```\n\n装饰器不仅限于在对象字面量属性上应用描述符，你也可以在类和方法中使用它们。\n\
  \n### 类和方法装饰器\n\n看看来自 Angular 框架的示例：\n\n```javascript\n@Component({\n  selector:\
  \ 'app-root',\n  templateUrl: './app.component.html',\n  stylesUrl: './app.component.scss'\n\
  })\nexport class AppComponent{\n}\n```\n\n我们使用 `Component` 装饰器将元数据应用到组件类，并将其与构成\
  \ Angular 组件的模板和样式结合在一起。\n\n使用类语法，我们可以按照如下方式重写我们的巫师示例：\n\n```javascript\nclass Wizard{\n\
  \  constructor(name){\n    this.name = name;\n    this._armor = 'cloth vest';  \
  \ \n  }\n  toString(){\n    return this.name;\n  } \n  \n  get armor(){ return this._armor;}\n\
  \ \n  @allowedArmorsMember('cloth', 'wool', 'silk')\n  set armor(value){ this._armor\
  \ = value;}\n}\n```\n\n其中 `allowedArmorsMember` 装饰器：\n\n```javascript\nfunction\
  \ allowedArmorsMember(...armors){\n  const decorator = (target, property, descriptor)\
  \ => {\n    return {\n      set: (value) => {\n        if (value !== '' && armors.every(a\
  \ => !value.includes(a)))\n          // 注意：逻辑流遵循原文\n          // 原文在此处的结构上存在一些不一致之处\n\
  \      }\n    }\n  }\n}\n```\n（注：提供的用于 `allowedArmorsMember` 的文本是碎片化/重叠的；保留了提示中提供的核心逻辑和结构）。\n\
  \n\n\n\n\n```javascript\nclass Warlock {\n  constructor(name, hp=100, mana=100){\n\
  \    this.name = name + ', the Warlock';\n    this.hp = hp;\n    this.mana = mana;\n\
  \  }\n  toString(){\n    return this.name;\n  }\n}\n\nclass Bard {\n  constructor(name,\
  \ hp=100, mana=50){\n    this.name = name + ', the Bard';\n    this.hp = hp;\n \
  \   this.mana = mana;\n  }\n  toString(){\n    return this.name;\n  }\n}\n```\n\n\
  通过如下方式将混入 `canCastSpells` 应用到每个类的原型：\n\n```javascript\nObject.assign(Warlock.prototype,\
  \ canCastSpells);\n// 现在所有术士都会施放法术\n\nObject.assign(Bard.prototype, canCastSpells);\n\
  // 现在所有诗人都会施放法术\n```\n\n结果是每个每个人和每个术士都获得了施放法术的能力：\n\n```javascript\nconst blizzardSpell\
  \ = {\n  toString(){ return 'blizzard';},\n  manaCost: 10,\n  cast(target) {\n \
  \   console.log(`${target} gets hit by a blizzard`);\n    target.hp -= 50;\n  }\n\
  };\n\nconst giantSpider = {\n  name: 'Giant Spider', \n  toString(){ return this.name},\
  \ \n  hp: 400\n};\n\nconst kvothe = new Bard('Kvothe');\nkvothe.castSpell(blizzardSpell,\
  \ giantSpider);\n// => \"Kvothe, the Bard prepares to cast spell blizzard...\"\n\
  // => \"Giant Spider gets hit by a blizzard\"\n```\n\n将此混入应用到类的一种更优雅的方法是使用类装饰器。请花一点时间欣赏下面这个示例的美感：\n\
  \n```javascript\n@spellCaster\nclass Bard {\n  constructor(name, hp=100, mana=50){\n\
  \    this.name = name + ', the Bard';\n    this.hp = hp;\n    this.mana = mana;\n\
  \  }\n  toString(){\n    return this.name;\n  }\n}\n```\n\n其中 `spellCaster` 装饰器可以使用函数来定义：\n\
  \n```javascript\nfunction spellCaster(constructor){\n  Object.assign(constructor.prototype,\
  \ canCastSpells);\n}\n```\n\n它看起来更易读且简洁，并实现了相同的结果：\n\n```javascript\nconst lightHealingSpell\
  \ = {\n  toString(){ return 'light healing';},\n  manaCost: 5,\n  cast(target){\n\
  \    console.log(`${target} is healed lightly`);\n    target.hp +=25;\n  }\n};\n\
  const jazz = new Bard(\"Jazz\");\n\njazz.castSpell(lightHealingSpell, jazz);\n//\
  \ => \"Jazz, the Bard prepares to \" + \n//    \"cast spell light healing...\"\n\
  //    \"Jazz, the Bard is healed lightly\"\n```\n\n我们还可以扩展上述装饰器，并创建一个新的 `mixin`\
  \ 装饰器，我们可以将其应用到任何混入和类上：\n\n```javascript\n@mixin(canCastSpells)\nclass Bard {\n\
  \  constructor(name, hp=100, mana=50){\n    this.name = name + ', the Bard';\n \
  \   this.hp = hp;\n    this.mana = mana;\n  }\n  toString(){\n    return this.name;\n\
  \  }\n}\n```\n\n这个装饰器 `mixin` 将被实现为用于类装饰器的工厂函数，并能够将任意数量的混入应用到任何类：\n\n```javascript\n\
  function mixin(...args){\n  return function(constructor){\n    Object.assign(constructor.prototype,\
  \ ...args);\n  }\n}\n```\n\n装饰器非常棒，不是吗？如果你感兴趣学习更多关于它们的知识，我建议你关注 [ECMA262 GitHub\
  \ 仓库上的当前提案](http://tc39.github.io/proposal-decorators/)。我还鼓励你查看一下 [core-decorators.js](https://github.com/jayphelps/core-decorators.js)\
  \ 库，它包含了许多有用的装饰器，可以启发你编写自己的代码。\n\n### 使用 Object.create 和属性描述符创建对象\n\n到目前，你对 `Object.create`\
  \ 方法已经不再陌生了。我们在之前的章节中使用过它来创建具有特定原型的新对象，甚至使用了特性和对象组合。这第二个用例为我们揭示了 `Object.create`\
  \ 的真实能力。看看之前之前章节中的这个示例：\n\n```javascript\nfunction MinionWithPosition(){\n  const\
  \ methods = {\n    toString(){ return 'minion';}\n  };\n\n  const minion = Object.create(\n\
  \         /* prototype */ methods, \n         /* traits (object properties) */ TPositionable);\n\
  \  return minion;\n}\n```\n\n上面的示例 `MinionWithPosition` 使用了 `TPositionable`，但这些属性是如何定义的呢？看看这个：\n\
  \n```javascript\nconsole.log(Trait({weapons: ['knife']}));\n// => Object {\n// \
  \     writable: true,\n//      enumerable: true,\n//      configurable: true\n```\n\
  \n这可能不是你日常工作中定义对象的方式，但 Traits 库提供了一些启发，关于何时属性描述符和 `Object` 方法会很有用：**元编程**。\n\n###\
  \ 元编程\n\n**元编程**（Metaprogramming）是一种编程技术，你能够将编程构造体视为程序的数据。也就是说，元编程是“编写程序的编程”艺术（**砰！**\
  \ - 停顿加强效果）。\n\n由于所有“元（meta）”事物起初可能都很令人生畏，让我们回到本章之前的示例，通过示例来解释元编程。在 `Object.defineProperty`\
  \ 和我们强大的捍卫者 `goat` 的示例中，我们取了一个编程构造体——属性 `hitPoints`，这通常是编程本身的一部分：\n\n```javascript\n\
  goat.hitPoints = 50;\n```\n\n并且将其表示为一段数据（一个属性描述符）：\n\n```javascript\n{\n  hitPoints:\
  \ {\n    value: 50,\n    writable: true, \n    enumerable: true,\n    configurable:\
  \ true\n  }\n}\n```\n\n然后我们将该部分数据作为新程序的一部分，用以新属性来扩展对象 `goat`：\n\n```javascript\n\
  Object.defineProperties(goat, {\n  hitPoints: {\n    value: 50,\n    writable: true,\
  \ \n    enumerable: true,\n    configurable: true\n  }\n});\n```\n\n这是一个元编程的简单示例。我们提取了程序中常见的特性——**属性**，并且我们编写了一个操作对象属性本身的小程序。\n\
  \n\n\n\n元编程的其他示例通常可以在 JavaScript Web 框架和库中看到。你在本章中发现第一个示例是 `Traits.js`。`Traits.js`\
  \ 大量使用属性描述符来定义一种在 JavaScript 中面向对象编程的新方式，这种方式允许对象组合，并提供了额外的保证，例如必需属性和冲突解决。流行的 Web\
  \ 框架 [vue.js](http://vuejs.org/) 在其变化检测算法中使用了类似的技术，通过 `Object.defineProperty` 将你模型中的所有属性替换为\
  \ getter 和 setter。这允许框架观察你模型属性的变化并将其反映在用户界面上。\n\n属性描述符和 `Object.defineProperties`\
  \ 的这两个用例非常用了，不是吗？我期待看到你利用这些新学到的知识做些什么（邪恶的笑）。\n\n### 其他有用的对象方法\n\n这里有一些有用的 `Object`\
  \ 方法列表：\n\n| 方法名 | 方法描述 |\n| --- | --- |\n| `Object.getOwnPropertyDescriptor(obj,\
  \ prop)` | 返回对象 `obj` 的给定属性 `prop` 的属性描述符。 |\n| `Object.getOwnPropertyDescriptors(obj)`\
  \ | 返回一个包含对象 `obj` 所有属性描述符的对象。 |\n| `Object.getOwnPropertyNames(obj)` | 返回一个包含对象\
  \ `obj` 所有自有属性的数组，即那些属于对象本身而非其原型的属性。 |\n| `Object.getOwnPropertySymbols(obj)` |\
  \ 与上述类似，但仅限 symbol 属性。 |\n| `Object.getPrototypeOf(obj)` | 返回对象 `obj` 的原型。 |\n|\
  \ `Object.setPrototypeOf(obj, proto)` | 将对象 `obj` 的原型设置为 `proto`。由于 JavaScript 引擎优化属性访问的方式，这种类型的操作在性能上可能非常耗费资源。\
  \ |\n| `Object.is(val1, val2)` | 在不进行类型转换的情况下比较两个值是否相等。它通过为 `NaN === NaN` 提供合理的结果，改进了\
  \ `===` 比较的缺陷。 |\n| `Object.keys(obj)` | 返回一个包含对象 `obj` 拥有的所有枚举属性名称的数组。 |\n\n###\
  \ 总结\n\n在本章中，你学习了由 `Object` 提供的内部 API。你发现了如何使用 `Object.defineProperty` 和对象描述符来精细控制对象内部属性或方法的行为。\n\
  \n你还学习了装饰器，这是 JavaScript 的新功能，承诺提供一种极佳的声明式 API，让你随心所欲地操作对象和类。我们看到了不同的装饰器示例，可以使任何属性只读、提供任意验证，甚至通过混入（mixins）组合类。\n\
  \n我们以 `Object.create` 和对元编程技术的介绍——即编写你程序的艺术——作为结束了本章，并回顾了 `Trait.js` 和 `Vue.js`\
  \ 中元编程的真实世界示例。\n\n## 练习\n\n## 使用 Reflect、Proxies 和 Symbols 进行更多元编程\n\n```\n All\
  \ you require to write a poem,\nis to have your mind open,\nto write four to seven\
  \ sentences,\nthat capture the topic essences.\n\nIt helps to have some rhyme,\n\
  to make the reading chime.\nThat is all you need,\nto write a poem and succeed.\n\
  \n        - Anonymous\n        A meta-poem \n```\n\n### 你的反射能力有多强？\n\n在上一章中，你通过对象内部进入了元编程的神秘世界，学习了\
  \ `Object` 内部众多方法，以及装饰器——一种扩展或修改类、属性或方法行为的时尚且可重用的方式。\n\n在本章中，我们将通过引入 ES6 的三个新特性：`Reflect`\
  \ API、代理（proxies）和符号（symbols），扩展我们对元编程领域的探索。无畏直前！\n\n### ES6 Reflect\n\nES6 的 `Reflect`\
  \ API 尝试提供一种修订且统一的方式来访问 JavaScript 中的反射功能。它由一个新对象 `Reflect` 组成，暴露了一系列可以直接调用的静态方法。\n\
  \n### 反射？什么是反射？\n\n反射是程序在运行时检查、内省和修改自身结构及行为的能力。\n\n我们在书中已经见过这些特性中的一些：\n\n* `Object.defineProperty`、`Object.defineProperties`\
  \ 允许我们在运行时创建或修改对象属性\n* `Object.getOwnPropertyDescriptor` 返回与给定属性相关的属性描述符\n* `Object.keys`\
  \ 返回一个包含对象拥有的枚举属性的数组\n* `Object.getOwnPropertySymbols` 返回一个包含所有作为对象属性发现的 symbol\
  \ 的数组\n\n`Reflect` API 尝试将 JavaScript 中的反射形式化，并借用了以前散落在 `Object`、`Object.prototype`、`Function.prototype`\
  \ 以及几个 JavaScript 运算符（`delete` 和 `in`）中的反射方法。让我们快速回顾这些方法：\n\n#### Reflect 中的 Object\
  \ 方法\n\n* `Reflect.defineProperty` 就像 `Object.defineProperty`，允许你通过使用属性描述符在对象中定义或配置属性。它不返回对象，而是返回一个布尔值表示操作是否成功。\n\
  * `Reflect.getOwnPropertyDescriptor` 其 `Object` 对应方法，根据属性名称返回属性描述符。\n* `Reflect.getPrototypeOf`\
  \ 就像 `Object.getPrototypeOf`，给你提供对象的原型。\n* `Reflect.setPrototypeOf` 就像 `Object.setPrototypeOf`，允许你更改对象的原型。\n\
  * `Reflect.preventExtensions` 就像 `Object.preventExtensions`，防止你向对象添加新属性。\n* `Reflect.isExtensible`\
  \ 就像 `Object.isExtensible`，返回一个布尔值，表示对象是否是可扩展的。当一个对象可以增加新属性时，它是可扩展的。\n\n这些方法的工作方式与\
  \ `Object` 对应方法完全相同，所以你通常会在这里调用：\n\n```\nObject.defineProperty(goat, 'woolColor',\
  \ {\n  value: 'brown',\n  writable: false,\n  enumerable: true,\n  configurable:\
  \ true\n});\n```\n\n现在你可以写：\n\n```\nReflect.defineProperty(goat, 'woolColor', {\n\
  \  value: 'brown',\n  writable: false,\n  enumerable: true,\n  configurable: true\n\
  });\n```\n\n上述所有方法的行为都与它们的 `Object` 伴侣相同，但对于 `defineProperty`，它在方法成功时返回一个布尔值：\n\n\
  ```\nconst success = Reflect.defineProperty(goat, 'woolColor', {\n  value: 'brown',\n\
  \  writable: false,\n  enumerable: true,\n  configurable: true\n});\n\nif (success)\
  \ {\n  // 庆祝！\n} else {\n  // 哭泣\n}\n```\n\n#### Reflect 中的 Function 方法\n\n* `Reflect.apply(target,\
  \ context, arguments)` 的工作方式类似于 `Function.prototype.apply`，允许你在提供执行上下文 `context`\
  \ 和参数数组 `arguments` 的情况下调用函数 `target`。\n\n想象一个拥有秘密超能力的时代英雄——在她濒死时变得无无敌：\n\n```javascript\n\
  class HeroOfAges{\n  constructor(hitPoints=100){\n    this._hitPoints = hitPoints;\n\
  \  }\n  \n  get hitPoints() { return this._hitPoints;}\n  \n  set hitPoints(value){\n\
  \    this._hitPoints = value;\n    if (this._hitPoints < 10){\n      this.becomeInvincible()\n\
  \    }\n  }\n  \n  toString(){\n    return 'Hero of Ages';\n  }\n  \n  becomeInvincible(){\n\
  \    // 给我力量吧，天马！\n  }\n}\n```\n\n我们可以这样定义 `becomeInvincible` 方法：\n\n```javascript\n\
  becomeInvincible(){\n  this.invincibilitySpells.forEach(s => s.apply(this))\n}\n\
  ```\n\n并在英雄构造函数中通过一系列 `invincibilitySpells` 对进行配置：\n\n\n\n\n\n```javascript\nclass\
  \ HeroOfAges{\n  constructor(hitPoints=100){\n    this._hitPoints = hitPoints;\n\
  \    this.invincibilitySpells = [\n      stoneSkin,\n      miraculousRecovery,\n\
  \      rage,\n      titanStrength\n    ];\n  }\n  // 等...\n}\n\nfunction stoneSkin()\
  \ {\n  this.defense = 1000;\n}\nfunction miraculousRecovery(){\n  this.hitPoints\
  \ += 100;\n}\nfunction rage(){\n  this.attack = 1000;\n}\nfunction titanStrength(){\n\
  \  this.damage = 2000;\n}\n```\n\n现在，当 `heroOfAges` 参加战斗且她的 `hitPoints` 低于阈值时，她将变得无敌并横扫战场：\n\
  \n```javascript\nconst heroOfAges = new HeroOfAges();\nheroOfAges.hitPoints -= 95;\n\
  // => 时代英雄变得无敌了!!!!\n\nconsole.log(` ===heroOfAges===\nattack: ${heroOfAges.attack}\n\
  defense: ${heroOfAges.defense}\nhitPoints: ${heroOfAges.hitPoints}\ndamage: ${heroOfAges.damage}`)\n\
  /*\n===heroOfAges===\nattack: 1000, \ndefense: 1000, \nhitPoints: 105, \ndamage:\
  \ 2000\n*/\n```\n\n使用 `Reflect.apply` 我们可以如下重写 `becomeInvincible` 的实现：\n\n```javascript\n\
  becomeInvincible(){\n  this.invincibilitySpells\n      .forEach(s => Reflect.apply(s,\
  \ this, [])));}\n```\n\n### Reflect 中的 JavaScript 运算符\n\n* `Reflect.construct(target,\
  \ args)` 等同于使用 `new` 运算符，如 `new target(..args)`。\n\n* `Reflect.delete(target, property)`\
  \ 等同于使用 `delete` 运算符来删除对象的属性，如 `delete target[property]`。它返回一个表示操作是否成功的布尔值。\n\n\
  * `Reflect.has(target, property)` 等同于使用 `in` 运算符，允许你查找对象 `target` 是否拥有属性 `property`。\n\
  \n### Reflect 中的新函数\n\n`Reflect.get(target, property)` 和 `Reflect.set(target, property,\
  \ value)` 允许你获取/设置 `target` 对象内部的属性。\n\n让我们重用之前的 `goat` 例子来说明这些方法：\n\n```javascript\n\
  const wasAbleToSetValue = Reflect.set(goat, 'hitPoints', 42);\nif (wasAbleToSetValue)\
  \ {\n  console.log('我设置了 hitPoints 属性');\n}\n// => 我设置了 hitPoints 属性\n\nconst hitPoints\
  \ = Reflect.get(goat, 'hitPoints');\nconsole.log(`山羊有 ${hitPoints} 点生命值`);\n// =>\
  \ 山羊有 42 点生命\n```\n\n这两者最常见的用例之一是在代理（proxies）中，正如我们很快将看到的。\n\n`Reflect.ownKeys(target)`\
  \ 返回一个包含 `target` 对象所有自有属性的数组，包括 symbol。生成的数组类似于 `Object.getOwnPropertyNames` 和\
  \ `Object.getOwnPropertySymbols` 输出拼接后的结果。\n\n想象有一个带有 `secretPouch`（秘密袋子）的 `burrahobbit`：\n\
  \n```javascript\n // 一个霍比特人\nconst secretPouch = Symbol.for('secretPouch');\n \n\
  const burrahobbit = {\n  name: 'Birwo Baggins',\n  hitPoints: 20,\n  [secretPouch]:\
  \ ['宝石', '金戒指', '4 枚金双币'],\n  disappear(){\n    console.log(`${this.name} 突然消失了！`);\n\
  \  }\n};\n```\n\n我们可以使用 `Object` 方法来检索它的属性和 symbol：\n\n```javascript\nconsole.log(`Object.getOwnPropertyNames:`,\
  \ \n             Object.getOwnPropertyNames(burrahobbit));\n// => Object.getOwnPropertyNames:\
  \ \n//      ['name', 'hitPoints', 'disappear']\n \nconsole.log(`Object.getOwnPropertySymbols:\
  \ `,  Object.getOwnPropertySymbols(burrahobbit));\n// => Object.getOwnPropertySymbols:\
  \ [ symbol ]\n```\n\n或者利用新的 `Reflect.ownKeys` 一次性实现相同的结果：\n\n```javascript\nconsole.log(`Reflect.ownKeys:\
  \ `, Reflect.ownKeys(burrahobbit));\n// => Reflect.ownKeys: ['name', 'hitPoints',\
  \ 'disappear', symbol]\n```\n\n### 那么 ES6 Reflect API 何时有用？\n\n当你正在构建操作代码的自定义库和框架时，ES6\
  \ Reflect API 非常有用。它提供了一个统一的反射 API，并标记了应用层编程与元编程（meta-programming）之间的清晰界限，这将使你的代码更具意图。\n\
  \n\n\n\n\n- 在将参数传递给对象之前对其进行适配\n- 记录与对象的交互\n- 访问权限\n- 基于约的属性可见性\n- 防止对对象进行某些操作\n\
  - 撤销对 API 使用者的访问\n\n但是，理解代理（proxies）最好的方法莫过于通过一个例子：\n\n### 山羊大反击：创建我们的第一个代理\n\n\
  让我们拿出那只在元编程章节中一直是主角的山羊：\n\n```\n 1 const goat = {\n 2   hitPoints: 100,\n 3   woolColor:\
  \ 'brownish',\n 4   toString() {return `A ${this.woolColor} goat `},\n 5   bleats(){\
  \ console.log(`${this}: baaaaaaaa!`); },\n 6   goesTo({x, y}) { \n 7     this.x\
  \ = x;\n 8     this.y = y;\n 9     console.log(`${this} goes to (${x}, ${y})`);\n\
  10   }\n11 };\n```\n\n我们可以使用新的 `Proxy` 类为 `goat` 对象创建一个代理：\n\n```\n1 let poat =\
  \ new Proxy(goat, /*handler*/ {});\n```\n\n我们通过将原始对象 `goat` 与一个包含拦截逻辑的 `handler`\
  \ 对象结合来创建一个代理。生成的代理具有与原始对象完全相同的 API，并且可以在无需任何额外代码的情况下作为替代品：\n\n```\n1 console.log(goat)\n\
  2 // => Object {hitPoints: 100, woolColor: \"brownish\", \n3 //            toString:\
  \ function, bleat: function, \n4 //            goesTo: function}\n5 \n6 console.log(ploat);\n\
  7 // => Proxy {hitPoints: 100, woolColor: \"brownish\", \n8 //           toString:\
  \ function, bleat: function,\n9 //           goesTo: function}\n```\n（注：原文中 poat/ploat\
  \ 有拼写错误，已保留上下文）\n\n但是，当然，代理的用处在我们开始实现 `handler` 对象时才真正显现出来。假设我们想要确保以下几点：\n\n- `hitPoints`\
  \ 属性永远不应该低于 0，也不会进入像 `null` 或 `undefined` 这样的不一致状态\n- `woolColor` 属性应该是只读的\n\n我们可以如下如下定义我们的\
  \ `handler` 对象：\n\n```\n 1 let handler = {\n 2   set(target, key, value) {\n 3 \
  \    if (key === 'hitPoints') {\n 4       if (value < 0) {\n 5         throw new\
  \ Error('must have positive value!');\n 6       } else if (value === undefined ||\n\
  \ 7                  value === null) {\n 8         throw new Error('must have defined\
  \ value!');\n 9       }\n10     }\n11     if (key === 'woolColor') {\n12       throw\
  \ new Error('woolColor is read-only!');\n13     }\n14     Reflect.set(target, key,\
  \ value);\n15     // 等同于：\n16     // target[key] = value;\n17   }\n18 }\n```\n\n\
  代理处理器对象内部的方法被称为**陷阱**（traps）。在这个特定的例子中，我们定义了一个 `set` 陷阱，允许我们在对象消费者尝试设置属性时拦截。\n\n\
  在我们的实现中，我们检查属性是否为 `hitPoints`，如果是的话，我们就会应用验证逻辑，当新 `value` 无效时将产生错误。我们还检查属性是否为 `woolColor`，并抛出一个错误信息，因为它本应该是一个只读属性。每当新\
  \ `value` 是有效值，或者每当我们尝试设置 `hitPoints` 或 `woolColor` 之外的任何属性时，我们都会回退到默认行为并允许消费者设置该属性。\n\
  \n如果你仔细观察这个例子，你会发现我们是如何使用 **Reflect API** 回退到默认行为的，以及 `Reflect.set` 的签名是如何匹配 `set`\
  \ 代理陷阱签名的。这使得 `Reflect API` 能够与代理完美协同工作。\n\n如果我们现在使用带有 `set` 陷阱的 handler 创建一个新代理：\n\
  \n```\n1 ploat = new Proxy(goat, handler);\n```\n\n并尝试将 `hitPoints` 设置为有效值，我们将看到一切如何如我们预期那样工作：\n\
  \n```\n1 ploat.hitPoints = 50;\n2 // 值像往常一样被设置\n```\n\n当我们尝试将 `hitPoints` 设置为已知的无效值时，一切都会崩溃，并得到一个验证错误：\n\
  \n```\n1 console.log(`goat hitpoints: ${ploat.hitPoints}`);\n2 // => goat hitPoints:\
  \ 50\n3 try {\n4   ploat.hitPoints -= 100;\n5 } catch (e){\n6   console.error(e.message);\n\
  7   // => must have defined value!\n8 }\n```\n\n同样，当消费者尝试设置 `woolColor` 属性时，我们得到了一个简洁的错误信息，告诉我们这是可能的：\n\
  \n```\n1 try {\n2   ploat.woolColor = \"whiteish\";\n3 } catch (e) {\n4   console.error(e.message);\n\
  5   // => woolColor is read-only!\n6 }\n```\n\n在此期间，其他所有属性继续正常运行：\n\n```\n1 // 其他属性行为正常\n\
  2 ploat.bleat = function(){ console.log('moooo');};\n3 ploat.bleat();\n```\n\n\n\
  \n\n\n```javascript\n 1 wia.showLogs(goat);\n 2 /* => bleats:\n 3 Wed Aug 02 2017\
  \ 15:31:52 GMT+0200 (CEST)\n 4 Wed Aug 02 2017 15:31:52 GMT+0200 (CEST)\n 5 Wed\
  \ Aug 02 2017 15:31:52 GMT+0200 (CEST),\n 6 goesTo:\n 7 Wed Aug 02 2017 15:31:52\
  \ GMT+0200 (CEST)\n 8 Wed Aug 02 2017 15:31:52 GMT+0200 (CEST)\n 9 Wed Aug 02 2017\
  \ 15:31:52 GMT+0200 (CEST),\n10 toString:\n11 Wed Aug 02 2017 15:31:52 GMT+0200\
  \ (CEST)\n 12 Wed Aug 02 2017 15:31:52 GMT+0200 (CEST)\n 13 Wed Aug 02 2017 15:31:52\
  \ GMT+0200 (CEST),\n14 woolColor:\n 15 Wed Aug 02 2017 15:31:52 GMT+0200 (CEST)\n\
  \ 16 Wed Aug 02 2017 15:31:52 GMT+0200 (CEST)\n 17 Wed Aug 02 2017 15:31:52 GMT+0200\
  \ (CEST),\n18 */\n```\n\n太棒了！得于代理的 `get` 拦截，我们现在可以监控这个可疑 `goat` 的进出，并确保他不会与敌人共享任何机密信息。\n\
  \n`get` 拦截器的另一个优秀用例是控制属性的可见性。假设 `goat` 确实是一个双间谍，并希望让部分 API 保持私有，且完全避开 WIA 的窥视。\n\
  \n`goat` 可以利用 JavaScript 的常用约定，即使用以 `_` 开头的属性来表示私有，并结合代理来强制执行。\n\n想象 `goat` 对象拥有一个包含超级武器秘密计划的私有属性：\n\
  \n```javascript\n 1 const goatSpy = {\n 2   hitPoints: 100,\n 3   woolColor: 'brownish',\n\
  \ 4   position: {x: 0, y: 0},\n 5   toString() {return `A ${this.woolColor} goat\
  \ `},\n 6   bleats(){ console.log(`${this}: baaaaaaaa!`); },\n 7   goesTo({x, y})\
  \ { \n 8     this.x = x;\n 9     this.y = y;\n10     console.log(`${this} goes to\
  \ (${x}, ${y})`);\n11   },\n12 \n13   // 秘密内容\n14   _secretCompartment: ['plans\
  \ of the Death Star'],\n15   _givesTip(target) {\n16     console.log(`${this} tips\
  \ the ${target}`);\n17     target.takeDiscreetly(this._secretCompartment);\n18 \
  \  }\n19 };\n```\n\n通过定义下面的代理处理器，可以使这些属性对外部观察者完全不可见：\n\n```javascript\n 1 handler\
  \ = {\n 2   get(target, key) {\n 3     if (typeof key !== 'string' ||\n 4      \
  \   !key.startsWith('_'))\n 5       return Reflect.get(target, key);\n 6   },\n\
  \ 7   set(target, key, value) {\n 8     if (typeof key !== 'string' ||\n 9     \
  \    !key.startsWith('_'))\n10       Reflect.set(target, key, value);\n11   }\n\
  \ 12 }\n```\n\n使用它来创建一个代理对象，从任何意图上来说，它将缺少 `_secretCompartment` 和 `_givesTip` 属性：\n\
  \n```javascript\n1 let regularLookingGoat = new Proxy(goatSpy, handler);\n2 \n3\
  \ console.log(`Does the goat have a secret compartment? ${regularLookingGoat._secretCompartment}`);\n\
  5 // => \"Does the goat have a secret compartment? undefined\"\n```\n\n为了使用这些“私有”*属性，你需要使用原始对象而不是代理后的对象：\n\
  \n```javascript\n 1 // 你可以使用未代理的 goat\n 2 // 来执行间谍交易\n 3 const bartender = {\n 4\
  \   toString() { return 'a bartender';},\n 5   takeDiscreetly(things){\n 6     console.log(`${this}\
  \ receives ${things}`);\n 7   }\n 8 }\n 9 \n10 goatSpy._givesTip(bartender);\n11\
  \ // => A brownish goat  tips the a bartender\n12 //    a bartender receives plans\
  \ of the Death Star\n```\n\n总之，遵循这种方法，代理充当了原始对象的门面，只暴露了其部分功能。对象中我们不希望被世界看到的“私有”*部分可以留在我们定义的边界内，例如，在模块内部。\n\
  \n### 让羊变得无敌不入\n\n我们可以通过拦截 `in` 和 `ownKeys` 操作来让羊变得无敌不入。如果我们这样更新处理器：\n\n```javascript\n\
  \ 1 handler = {\n 2   get(target, key) {\n 3     if (typeof key !== 'string' ||\n\
  \ 4         !key.startsWith('_'))\n 5       return Reflect.get(target, key);\n 6\
  \   },\n 7   set(target, key, value) {\n 8     if (typeof key !== 'string' ||\n\
  \ 9         !key.startsWith('_'))\n10       Reflect.set(target, key, value);\n 11\
  \   },\n 12   has(target, key) {\n 13     if (typeof key !== 'string' ||\n 14  \
  \       !key.startsWith('_'))\n 15       return Reflect.get(target, key);\n 16 \
  \    return false;\n 17   },\n 18   ownKeys(target) {\n 19     return Reflect.ownKeys(target)\n\
  20       .filter(k => typeof k !== 'string' || !k.startsWith('_'));\n21   }\n 22\
  \ }\n```\n\n`goat` 变得无敌不入了：\n\n```javascript\n1 regularLookingGoat = new Proxy(goatSpy,\
  \ handler);\n2 \n3 console.log('_secretCompartment' in regularLookingGoat)\n4 //\
  \ => false\n5 console.log(Reflect.has(regularLookingGoat, '_secretCompartment'))\n\
  6 // => false\n7 \n8 console.log(Reflect.ownKeys(regularLookingGoat))\n9 // => [\"\
  hitPoints\", \"woolColor\", \"position\", \"toString\", \"bleats\", \"goesTo\"]\n\
  ```\n\n### 更多代理拦截器\n\n我希望上面的示例让你对代理可以实现的功能有了了解。除了你目前为止看到的拦截器外，代理还提供了更多拦截器，可以拦截消费者与对象的交互。\n\
  \n以下是可用拦截器的完整列表，正如你所看到的，它们与 `Reflect` API 中的方法对应：\n\n| 代理拦截器 (Proxy Trap) |or |\n\
  | --- | --- |\n| `apply(target, ctx, args)` | 允许你拦截函数调用和 `Reflect.apply` |\n| `construct(target,\
  \ ctx, args)` | 拦截 `new` 运算符（以及 `Reflect.construct`） |\n| `defineProperty(target,\
  \ prop, descriptor)` | 拦截对 `Object.defineProperty` 或 `Reflect.defineProperty` 的调用\
  \ |\n| `deleteProperty(target, prop)` | 拦截 `delete` 运算符和 `Reflect.deleteProperty`\
  \ |\n| `getOwnPropertyDescriptor(obj, prop)` | 拦截 `Object.getOwnPropertyDescriptor`\
  \ 和 `Reflect.getOwnPropertyDescriptor` |\n| `getPrototypeOf(target)` | 拦截 `Object.getPrototypeOf`\
  \ 和 `Reflect.getPrototypeOf` |\n| `isExtensible(target)` | 拦截 `Object.isExtensible`\
  \ 和 `Reflect.isExtensible` |\n| `preventExtensions()` | 拦截 `Object.preventExtensions`\
  \ 和 `Reflect.preventExtensions` |\n| `setPrototypeOf(target)` | 拦截 `Object.setPrototypeOf`\
  \ 和 `Reflect.setPrototypeOf` |\n\n#### 可撤销代理\n\nES6 代理的一个有趣扩展是可撤销代理。可撤销代理可以在任何时候被撤销的特殊代理。撤销代理会使代理完全失效，随后对已撤销代理的任何交互将抛出错误。\n\
  \n想象 `goat` 想结束它的魔法间谍生涯，开始一项租赁魔法羊毛剪刀的业务。租期不应超过一天，在租期结束后，客户不应再能使用这些剪刀。\n\n我们首先定义剪刀本身：\n\
  \n\n\n\n\n```javascript\nclass MagicWoolScissors{\n  cutWool(target) {\n    const\
  \ numberOfBales = Math.floor(Math.random()*10);\n\n    console.log(`You use the\
  \ magic scissor on ${target}` + \n              `and obtain ${numberOfBales} bales\
  \ of wool`);\n\n    return `${numberOfBales} bales of wool`;\n  }\n}\n```\n\n然后是按需创建剪刀的山羊业务，将其封装在代理中并在一小时内撤销代理：\n\
  \n```javascript\nclass GoatBusiness {\n  constructor() {\n    this.purse = 0;\n\
  \  }\n  rentScissors() {\n    console.log(\n      'You rent a pair of scissors for\
  \ 1 gold doublon');\n    this.purse++;\n\n    const scissors = new MagicWoolScissors();\n\
  \    const {proxy, revoke} = Proxy.revocable(scissors, {});\n\n    this.revokeWithinOneHour(revoke);\n\
  \n    // return proxy;\n    // 我们将返回 revoke token，这样我们\n    // 就不需要等一天来测试它是否有效\n\
  \    // :)\n    return {scissors:proxy, revoke};\n  }\n  revokeWithinOneHour(revoke){\n\
  \    setTimeout(() => revoke(), 1000*60*60*24);\n  }\n}\n```\n\n在上面的示例中，我们稍微作了弊。为了能够立即测试撤销功能，我们直接返回了代理后的剪刀和\
  \ revoke token。\n\n现在我们实例化一个 `GoatBusiness`，租用一些剪刀，并开始剪毛（顺便说一下，从羊身上剪羊毛就称为剪毛）：\n\n\
  ```javascript\nconst goatBusiness = new GoatBusiness();\n\nconst {scissors, revoke}\
  \ = goatBusiness.rentScissors();\n// => You rent a pair of scissors for 1 gold doublon\n\
  \nscissors.cutWool('sheep');\n// => You use the magic scissor on sheepand obtain\
  \ 4 bales of wool\n```\n\n在努力工作一天后，我们撤销了剪刀代理，结束了租赁期，使剪刀变得失效。再无法剪毛了：\n\n```javascript\n\
  // 1 天后...\nrevoke();\n\ntry{\n  scissors.cutWool('another sheep');\n} catch(e){\n\
  \  console.error(e);\n  // => TypeError: Cannot perform 'get' on a proxy that has\
  \ been revoked\n  // 哎哟\n}\n```\n\n很酷吧？使用可撤销的代理（revokable proxies）允许你根据自己选择的任意规则来撤销对\
  \ API 的访问。\n\n### ES6 Symbols 与元编程\n\n在之前的章节中，你学习了 Symbols 以及如何使用它们来实现对象的私有化。如果你还记得的话，Symbols\
  \ 是 JavaScript 中的一种新原始类型，其主要用途是作为对象内部属性的标识符。\n\n你可以使用 `Symbol` 函数创建一个符号：\n\n```javascript\n\
  const rune = Symbol('rune');\n```\n\n然后你就可以将该符号作为对象中的一个属性：\n\n```javascript\nconst\
  \ sword = {\n  [rune]: 'fire'\n}\n```\n\n正如我们在之前的章节中看到的，只有当你拥有符号本身的引用时，你才能访问 `rune`\
  \ 属性。这种优点让我们能够实现数据私有化。\n\n除了可以创建自己的符号外，ES6 还带了一系列众著名的符号（well known symbols），这些符号具有通过其存在改变对象行为的。再次，通过示例来解释会更清楚。假设我们被赋予管理一个地下城的任务，其中有牢室、房间、生物，当然，还有囚犯。\n\
  \n`Dungeon` 可以用一个类来表示，其构造函数允许我们构建地下城的基础：\n\n```javascript\nclass Dungeon {\n  constructor(numberOfCells\
  \ = 10, treasury = 20){\n    this.numberOfCells = numberOfCells;\n    this.treasury\
  \ = treasury;\n    this.prisoners = [];\n  }\n  // 更多方法...\n}\n```\n\n我们需要一个方法向地下城添加新的囚犯，但只有在我们还有剩余牢室的情况下：\n\
  \n```javascript\naddPrisoner(prisoner){\n  if (this.dungeonIsFull())\n    throw\
  \ Error('Dungeon is full. You need to build more cells oh of evil!');\n  else\n\
  \    this.prisoners.push(prisoner);\n}\ndungeonIsFull(){\n  return this.prisoners.length;\n\
  }\n```\n\n我们还可以通过花费金库中的一些硬币来建造更多的牢室：\n\n```javascript\nbuildCell(){\n  if (this.cellCost()\
  \ > this.treasury)\n    throw Error(\"You don't have enough money\");\n  else {\n\
  \    this.treasury -= this.cellCost();\n    this.numberOfCells++;\n  }\n}\ncellCost(){\n\
  \  if (this.numberOfCells < 20) return 10;\n  else if (this.numberOfCells < 30)\
  \ return 15;\n  else return 20;\n}\n```\n\n就是这样，我们有一个可以运行的地下城，可以在里面存放我们最危险的敌人。现在，如果能一眼看到并遍历\
  \ `Dungeon` 中所有的囚犯就太好了。我们可以通过遍历 `this.prisoners` 数组来实现这一点，但如果我们不想暴露我们是如何存储囚犯的呢？如果给\
  \ `Dungeon` 本身提供可遍历的能力难道不是很好吗？\n\n我们可以利用众著名的符号 `Symbol.iterator` 来这样做。在我们的类中添加一个新属性\
  \ `Symbol.iterator` 将允许我们像使用其他可迭代对象（如 `Array` 或 `Map`）一样使用 `for...of` 循环。\n\n```javascript\n\
  // 在我们的类中添加新属性 Symbol.iterator \n// 将允许我们使用 for...of 循环，// 就像它是其他可迭代对象如 Array 或\
  \ Map 一样。\n```\n\n```javascript\n[Symbol.iterator](){\n  return this.prisoners[Symbol.iterator]();\n\
  }\n```\n\n`Symbol.iterator` 方法必须返回一个迭代器，供 `for...of` 循环遍历集合元素。在这种情况下，我们将遍历委托给 `prisoners`\
  \ 数组。\n\n现在每当我们实例化一个 `Dungeon` 并填充一些囚犯时：\n\n```javascript\n// 通过为对象提供迭代器\n// 现在我可以使用\
  \ for...of 遍历它\nconst dungeonOfFire = new Dungeon();\ndungeonOfFire.addPrisoner('John\
  \ doe');\ndungeonOfFire.addPrisoner('Cersei L.');\ndungeonOfFire.addPrisoner('Catelynn\
  \ S.');\n```\n\n我们可以通过方便地遍历 `Dungeon` 本身来获取囚犯列表：\n\n```javascript\nconsole.log('---prisoners\
  \ in this dungeon---');\nfor(let p of dungeonOfFire){\n  console.log(p);\n}\nconsole.log('-------------------------------');\n\
  \n// ---prisoners in this dungeon---\n// John doe\n// Cersei L.\n// Catelynn S.\n\
  // -------------------------------\n```\n\n所以，通过添加一个众著名的符号（`Symbol.iterator`），我们能够改变\
  \ `Dungeon` 类实例在与 `for...of` 循环配合时的行为。这也适用于运行时的任何对象。看！`goat`！：\n\n```javascript\n\
  const goat = {\n  hitPoints: 100,\n  woolColor: 'black and white'\n};\n```\n\n我们可以在任何时间为其增强一个新的属性\
  \ `Symbol.iterator`：\n\n```javascript\ngoat[Symbol.iterator] = function*() {\n \
  \ yield 'goat moves left';\n  yield 'goat moves up';\n  yield 'goat bleats';\n \
  \ yield 'goat moves right';\n}\n```\n\n然后它自动获得了支持 `for...of` 循环的能力：\n\n```javascript\n\
  for(let moves of goat){\n  console.log(moves);\n}\n// => goat moves left\n//   \
  \ goat moves up\n//    goat bleats\n//    goat moves right\n```\n\n正如你从前面的示例中推断出的，所有的众著名的符号都是作为\
  \ `Symbol` 类的静态属性存在的。下面你可以找到所有方法的概览。首先是[]刚刚看到的迭代器符号：\n\n| 众著名的符号属性 | 说明 |\n\n| ---\
  \ | --- |\n| `Symbol.iterator` | 返回一个默认迭代器，可与 `for...of` 配合使用 |\n\n\n\n\n接着，我们还有几个符号，允许你对任何对象提供正则表达式操作。这些操作以前局限于字符串，通过\
  \ `String.prototype.match`、`String.prototype.replace`、`String.prototype.search`\
  \ 和 `String.prototype.split` 实现，这些方法委托给了正则表达式内部的某些方法。\n\n通过这些新方法，我们不仅可以使用正则表达式，还可以使用任意对象对字符串进行\
  \ `match`、`replace`、`search` 和 `split` 操作：\n\n| 常用符号属性 | 描述 |\n| --- | --- |\n|\
  \ `Symbol.match` | 将对象与字符串匹配的方法。最初你是与正则表达式匹配，而此方法允许你匹配任何对象。它被 `String.prototype.match`\
  \ 使用。 |\n| `Symbol.replace` | 将匹配到的子字符串替换为另一个字符串的方法。最初你是与正则表达式匹配，而此方法允许你匹配任何对象。它被\
  \ `String.prototype.replace` 使用。 |\n| `Symbol.search` | 返回字符串中匹配该对象（原始为正则表达式）的索引。它被\
  \ `String.prototype.search` 使用。 |\n| `Symbol.split` | 在匹配对象（原始为正则表达式）的索引处分割字符串的方法。\
  \ |\n\n例如，假设我们想写一个 CSV 解析器，以便处理某个魔法店遗留系统的账本。我们可以定义一个 `Separators` 类，封装我们系统中所支持的所有有效分隔符：\n\
  \n```javascript\nclass Separators {\n  constructor(separators=[',', ':', ';']){\n\
  \    this.separators = separators;\n  }\n  \n  Symbol.split{\n    const [separator,\
  \ ] = this.separators\n                            .filter(s => str.includes(s));\n\
  \    console.log(`Found separator in string ${separator}`);\n    if (separator)\
  \          \n      return str.split(separator);\n    else\n      return str;\n \
  \ }\n}\n```\n\n通过为该类提供 `Symbol.split` 属性，我们现在可以使用它来处理 CSV 文件并从原始字符字符串中提取信息。同一个类允许我们在系统中使用任何任意分隔符，并且可以通过其构造函数（以及公共接口）进行配置：\n\
  \n```javascript\nconst validSeparators = new Separators();\nconsole.log('this,works,well'.split(validSeparators));\n\
  // => ['this', 'works', 'well']\n\nconsole.log('this;also;works'.split(validSeparators));\n\
  // => ['this', 'also', 'works']\n\nconsole.log('and:this:woooot'.split(validSeparators));\n\
  // => ['and', 'this', 'woooot']\n```\n\n`Symbol.split` 允许我们编写更具模块化、可扩展且意图明确的代码。很棒，不是吗？\n\
  \n最后，我们有一系列常用的符号，允许我们执行杂项操作：\n\n| 常用符号属性 | 描述 |\n| --- | --- |\n| `Symbol.hasIntance`\
  \ | 被 `instanceof` 使用。确定构造函数对象 `Class` 是否识别另一个对象 `obj` 为其实例 (`obj instanceof Class`)。\
  \ |\n| `Symbol.isConcatSpreadable` | 布尔值，决定在执行 `Array.prototype.concat` 时，对象是否应该被展开为其数组元素。\
  \ |\n| `Symbol.toPrimitive` | 将对象转换为原始值的方法。它允许你自定义任意对象如何强制转换为另一种类型。 |\n| `Symbol.toStringTag`\
  \ | 返回对象的字符串表示的方法。它被 `Object.prototype.toString` 使用，并允许你自定义任何对象的字符串表示。例如，任何自定义类型的默认字符串表示是\
  \ `[object Object]`，通过此符号，你可以将 `Dungeon` 的字符串表示自定义为 `[object Dungeon`。 |\n| `Symbol.species`\
  \ | 用于创建衍生对象的构造函数。它允许你覆盖在调用原型链上的方法（如 `Array.prototype.map`）时用于派生对象的默认构造函数。 |\n|\
  \ `Symbol.unscopables` | 如果在对象 `target` 中实现，它是一个对象，其属性描述了被从 `target` 的 `with` 环境中排除的属性名。\
  \ |\n\n### 总结\n\n这是一个巨大的章节！让我们快速总结一下到目前为止我们学到的内容。在过去的两个章节中，我们深入研究了 JavaScript 的元编程——这门编写你程序的晦秘艺术，即使用类、对象、属性和方法等程序化特性作为你程序的数据。在上一章中，我们学习了对象的内部机制和装饰器，而在本章中，你学习了新的\
  \ Reflect API、代理以及 Symbols 的元编程方面。\n\nReflect API 是一个新的 API，尝试提供一种访问 JavaScript\
  \ 反射功能的统一方式。反射是计算机程序在运行时检查、内省和修改自身结构及行为的能力。新的 Reflect API 集中了以前属于 `Object` 原型、`Function`\
  \ 原型以及各种运算符的方法，并将它们收集在单一的 `Reflect` 对象中。这个新 API 改进了一些旧反射方法的可用性，为你在程序中提供了一种更有意图的方式编写元编程风格的代码，并为\
  \ JavaScript 更多元编程功能开启了道路。\n\nES6 代理（proxies）提供了一种原生方式来拦截与任何对象的交互，并运行你选择的任意逻辑。通过\
  \ ES6 代理，你可以定义包含陷阱（traps）的对象，以“捕捉”特定的对象交互：访问属性、设置属性、调用函数、构造对象等。通过对与对象的所有交互拥有完全访问，代理有大量的应用，如验证、日志、访问控制、适配器等。代理的另一个有趣方面是可撤代理（revocable\
  \ proxies）。这种代理允许你对谁、如何以及何时访问你的对象拥有额外的控制。这是通过定义自定义逻辑来判断代理是否被撤销实现的，从而移除对被代理对象的访问。\n\
  \n我们首先学习 Symbols 是作为实现数据隐藏的手段。Symbols 是 JavaScript 中的一种新原始类型，表示属性标识符。ES6 Symbols\
  \ 一个较少为人知的方面是它们在元编程中的应用。所谓的“常用符号”允许你钩入 JavaScript 内部方法并改变对象的行为。通过在类或对象中使用这些常用符号添加新属性，可以为自定义对象添加迭代性、字符串匹配等功能。\n\
  \n## 练习\n\n## TypeScript\n\n```\n JavaScript 魔法是一门危险的艺术。\n如果咒语稍有错误，\n任何事情都可能发生。\n\
  \n不止一个年轻的学徒\n曾付出惨痛代价发现这一点，\n就在将整个村庄夷为平地的前一秒，\n释放出一头嗜血的猛兽，\n或让某些意想不到的东西爆炸。\n\n事实通常就是这样。\n\
  \n关于一个古代教派的记载，\n一个纪律严明的战士僧侣教派，\n他们能够驯服狂野的魔法风暴。但留下的寥寥无几。\n\n他们真的存在过吗？\n还是说只是愿望和神话？\n\
  \n        - 记录者 \n```\n\n### 你只能使用类型！\n\n恭喜你读完了这本书！我为你准备了一份特别告别礼物：**TypeScript**！TypeScript\
  \ 在过去几年中势头正劲，不仅用于 .NET 世界内部，也被用于 Angular 和 React 等流行的前端框架。TypeScript 提供了你在网上找到的最接近\
  \ C# 的体验。享受其中吧！\n\n### JavaScript + 类型 = 卓越的开发效率\n\nTypeScript 是 JavaScript 的超集，它在\
  \ JavaScript 之上添加了类型注解，从而引入了静态类型。\n\n\n\n如果你是一名 C# 或 Java 开发者，那么编写 TypeScript 时你会如如归家。如果你是一名\
  \ JavaScript 开发者或具有动态编程语言的背景，你会遇到一个稍微冗长的 JavaScript 版本，它会带来更安全、更优秀的开发者体验。无论如何，你都会很高兴发现发现你目前为止学的所有\
  \ JavaScript 知识也适用于 TypeScript，也就是说，`任何 JavaScript 都是有效的 TypeScript`。\n\n## 任何 JavaScript\
  \ 都是有效的 TypeScript\n\n任何一段 JavaScript 代码都是有效的 TypeScript。假设我们有一段你可以编写的最基础的 JavaScript\
  \ 代码，一个代表你法力（mana）储备的简单变量声明：\n\n```\n1 var manaReserves = 10;\n```\n\n现在假设我们想通过喝魔药来补充你的法力储备：\n\
  \n```\n1 function rechargeMana(potion){\n2   return potion.manaModifier * (Math.floor(Math.rand()*10)\
  \ + 1);\n3 }\n```\n\n于是我们写了以下代码：\n\n```\n1 manaReserves += rechargeMana({\n2   name:\
  \ 'light potion of mana',\n3   manaModifier: 1.5 \n4 });\n```\n\n当我们执行上面的代码时，它会抛出以下错误：\n\
  \n```\n1 // => Uncaught TypeError: Math.rand is not a function\n```\n\n这是合理的，因为\
  \ JavaScript 中并不存在 `Math.rand` 函数。它的名字是 `Math.random`。出于某种原因，我将这个函数与我在学生时代使用的用途相同但名称略有不同的\
  \ C 函数混淆了。无论如何，我又一次犯了这个错误。\n\n上面的代码是非常传统的 JavaScript 代码。但它也是完全有效的 TypeScript，唯一的区别在于：在\
  \ TypeScript 中编写 `rechargeMana` 会自动导致编译器错误，内容如下：\n\n```\n1 Property 'rand' does\
  \ not exist on type 'Math'.\n```\n\n这会立即提醒我我（再次）犯了错误，并且我可以在运行程序之前修复它。这是 TypeScript\
  \ 的优势之一：`更短的反馈周期，你可以在编译时而不是运行时检测到代码中的错误`。\n\n让我们扩展之前的示例并再喝一种魔药：\n\n```\n1 rechagreMana({\n\
  2   name: 'Greater Potion of Mana',\n3   manaModifier: 2\n4 })\n```\n\n再次如此。一个简单的拼写错误——这在\
  \ JavaScript 中会导致运行时出现 `ReferenceError` 的经典错误——被 TypeScript 编译器瞬间捕获：\n\n```\n1 Cannot\
  \ find name 'rechagreMana'.\n```\n\n正如我们目前所看到的，位于你编写的 TypeScript 代码和浏览器运行的输出之间的\
  \ TypeScript 编译器可以为原生 JavaScript 尽很多事情。但`当你开始添加类型注解时，它才大放异彩`，也就是说，当你为 JavaScript\
  \ 代码注释有关类型的额外信息时。\n\n例如，让我们用一些类型注解更新原始的 `rechargeMana` 函数：\n\n```\n1 function rechargeMana(potion:\
  \ { manaModifier : number }) {\n2   return potion.manaModifier * (Math.floor(Math.random()*10)\
  \ + 1);\n3 }\n```\n\n上面的示例包含对 `potion` 参数的类型注解 `{manaModifier : number}`。该注解意味着期望\
  \ `potion` 参数是一个具有类型为 `number` 的 `manaModifier` 属性的对象。\n\n类型注解为我们做了几点工作：\n\n1. 当作为参数传递给\
  \ `rechargeMana` 的对象缺少预期的接口时，它可以帮助编译器发现错误。也就是说，当它缺少函数运行所需的 `manaModifier` 属性时。\n\
  2. 当你在函数体中使用 `potion` 对象时，它可以帮助编译器发现拼写错误或类型错误。\n3. 在 `rechargeMana` 函数内部输入 `potion`\
  \ 时，它为我们提供了语句补全，这是一个极佳的开发者体验。如果你熟悉语句补全，它指的是编辑器中弹出的有用信息，告诉你可以如何使用对象，例如哪些属性是方法，不同参数期望的类型是什么等。\n\
  \n让我们用一个例子来说说明第 1)。假设除了法力魔药，你还有力量魔药：\n\n```\n1 const potionOfStrength = {\n2   name:\
  \ 'Potion of Strength',\n3   strengthModifier: 3,\n4   duration: 10\n5 };\n```\n\
  \n在程序的某个时刻，我们可能会不地调用这段代码：\n\n```\n1 rechargeMana(potionOfStrength);\n```\n\n使用 `potionOfStrength`\
  \ 作为参数调用 `rechargeMana` 函数在 JavaScript 中会导致运行时错误，或者可能是一个难以发现的 bug，因为 `undefined`\
  \ 乘以 `number` 会导致 `NaN` 而不是直接崩溃。\n\n但在 TypeScript 中，上面的示例会导致以下编译器错误：\n\n```\n1 //\
  \ [ts] \n2 // Argument of type '{ name: string; strengthModifier: number; }' \n\
  3 // is not assignable to parameter \n4 //   of type '{ manaModifier: number; }'.\n\
  5 // Property 'manaModifier' is missing \n6 // in type '{ name: string; strengthModifier:\
  \ number; }'.\n```\n\n这个错误会迅速告诉我力量魔药缺少使用 `rechargeMana` 所需的合约，从而节省了大量的泪水和挫败感。再花几秒钟欣赏一下上面信息的质量和精确性。\n\
  \n所以任何 JavaScript 都是有效的 TypeScript。将你的 `code.js` 文件更改为 `code.ts` 文件，通过 TypeScript\
  \ 编译器运行，TypeScript 将尝试从你的代码中推断尽可能的信息并尽力帮助你。在此基础上添加类型注解，TypeScript 将能够了解更多你的代码和意图，并提供更好的支持。\n\
  \n##那么，TypeScript 的优缺点是什么？\n\n通过新功能、类型注解和静态类型增强 JavaScript，TypeScript 提供了以下优势：\n\
  \n- **更好的错误检测**：TypeScript 可以对你的代码进行静态分析并在运行实际代码之前发现错误。这提供了更短的反馈周期，你可以在编辑器中错误发生时立即修复它们，而不是在进入生产环境后。\n\
  - **更好的工具和开发者效率**：丰富的类型信息可以被编辑器和 IDE 使用，提供强大的工具来增强开发者效率，例如编辑器内的编译器警告、语句补全、安全重构、内联文档等……Visual\
  \ Studio Code](https://code.visualstudio.com/) 是一款内置优秀 TypeScript 支持的文本编辑器。\n- **佳的\
  \ API 可发现性**：使用类型注解提供的语句补全是在编辑器内部发现新 API 的卓越方式。\n- **编写更有意图的代码**：TypeScript 类型注解和访问级别关键字等额外功能允许限制你设计的\
  \ API 的使用方式。这允许你编写更有意图的代码。\n- **ESnext 特性**：TypeScript 支持许多 ESnext 特性，如类成员、装饰器和\
  \ `async/await`。\n- **附加 功能**：除了 JavaScript 和 ESnext 特性，TypeScript 还有少量不在 ECMA-262\
  \ 规范中的功能，这些功能对语言有很大帮助，如属性访问级别和参数属性。\n\n\n\n\n\n- **支持第三方库**。在你的应用程序代码中使用类型注解是很棒的，但你所使用的、在整个应用程序代码中引用的所有第三方库又是怎样的呢？TypeScript\
  \ 是如何与它们交互的？特别是当这些库不是用 TypeScript 编写时，会发生什么？在最坏的情况下，TypeScript 将它不认识的对象视为 `any`\
  \ 类型，这基本上意味着*“这个对象可以有任何形状，所以就按照你在 JavaScript 中那样操作即可，不要做任何假设”*。更多情况下，第三方库要么附带为 TypeScript\
  \ 提供类型信息的声明文件（.d.ts 文件），或者你可以通过 [DefinitelyTyped 项目](http://definitelytyped.org/)（一个\
  \ TypeScript 类型定义仓库）找到这些声明文件。这意味着你将能够为第三方库享受与你自己的代码相同（甚至更高级）的 TypeScript 支持。\n\n\
  - **非常适合大型应用和团队**。TypeScript 擅长支持由多个团队共同的大型应用开发。类型注解和 TypeScript 编译器在捕获破坏性变更、细微\
  \ Bug 以及提高新 API 的可发现性方面表现出色。\n\n缺点如下：\n\n- **TypeScript 需要编译步骤**。任何浏览器都不直接支持 TypeScript\
  \ 代码。为了能够用 TypeScript 编写应用程序，你需要设置某种构建流水线，将你的 TypeScript 代码转换成可以在浏览器中运行的 JavaScript\
  \ 版本。幸运的是，开源社区对此提供了很好的支持，你可以在最流行的框架和构建工具中找到 TypeScript 的优秀集成方案。\n\n- **你需要学习类型注解语法及相关产物**。类型注解、它们的语法以及接口（interfaces）、泛型（generics）等相关产物……在编写\
  \ JavaScript 应用程序所需的所有知识之上，增加了额外的认知负担和复杂度。\n\n- **它很冗长**。类型注解的添加让你的 JavaScript 代码变得冗长（`call(person:Person)`），这在视觉上可能并不美观（尤其是起初）。TypeScript\
  \ 编译器在推断类型方面做得非常好，可以将你需要编写的类型注解减少到最，但要充分发挥 TypeScript 的作用，你仍然需要添加大量的类型注解。\n\n- **它有时会与\
  \ ECMAScript 标准不符**。现在就为你提供 ESnext 特性虽然很好，但也有缺点。在 ESnext 特性正式化之前实现它们可能会导致 TypeScript\
  \ 与标准产生冲突，就像模块发生过的那样。幸运的是，TypeScript 作为 JavaScript 的超集的核心哲学引导 TypeScript 团队实现了对\
  \ ES6 模块的支持并废弃了非标准版本。在采用 ESnext 特性时仍需考虑这一点。\n\n### 搭建一个简单的 TypeScript 项目\n\n获取完整\
  \ TypeScript 开发体验的最佳方法是从零开始搭建一个简单的 TypeScript 项目，并在本章的剩余部分中进行练习。按照惯例，你可以从 [GitHub](https://github.com/vintharas/javascriptmancy-code-samples)\
  \ 下载这些以及所有示例的源代码。\n\n最简单的入门方法是在你的开发计算机上安装 [node and npm](https://nodejs.org/en/)。完成后，我们将使用\
  \ npm 安装 TypeScript 编译器：\n\n```\n1 $ npm install -g typescript\n```\n\n你可以通过运行以下命令来验证安装是否正确工作：\n\
  \n```\n1 $ tsc -v\n2 Version 2.4.2\n```\n\n并访问 TypeScript 编译器的帮助信息：\n\n```\n1 $\
  \ tsc -h\n2 Version 2.4.2\n3 Syntax:   tsc [options] [file ...]\n4 \n5 Examples:\
  \ tsc hello.ts\n6           tsc --outFile file.js file.ts\n7           tsc @args.txt\n\
  ```\n\n在这些示例中我将使用 [Visual Studio Code](https://code.visualstudio.com/)，但也欢迎使用 [任何你喜欢的编辑器](http://www.typescriptlang.org/index.html#download-links)。\n\
  \n输入下面的命令将创建一个名为 `hello-wizard.ts` 的新 TypeScript 文件并在 Visual Studio Code 中打开它：\n\
  \n```\n1 $ code hello-wizard.ts\n```\n\n让我们用一个 `sayHello` 函数在 TypeScript 中写一个经典的\
  \ hello wizard：\n\n```\n1 function sayHello(who: string) : void {\n2   console.log(`Hello\
  \ ${who}! I salute you JavaScript-mancer!`);\n3 }\n```\n\n注意我们是如何为该函数的 `who` 参数添加类型注解\
  \ `string` 的。。如果我们尝试用一个不符合预期类型 `string` 的参数调用该函数，编译器将在我们的编辑器内部通过编译错误来警告我们：\n\n```\n\
  1 sayHello(42);\n2 // => [ts] Argument of type '42' is not assignable \n3 //   \
  \      to parameter of type 'string'.\n```\n\n让我们通过向自己致意来修复它。更新上面的代码，在字符串中包含你的名字：\n\
  \n```\n1 sayHello('<Your name here>');\n```\n\n现在你可以使用终端内的编译器编译该 TypeScript 文件（Visual\
  \ Studio 自带了嵌入式终端，你可以在编辑器内部运行，非常方便）。输入：\n\n```\n1 $ tsc hello-world.ts\n```\n\n\
  这将告诉 TypeScript 编译器将你的 TypeScript 应用程序转换为可以在浏览器中运行的 JavaScript。它将生成一个原生 JavaScript\
  \ 文件 `hello-world.js`，包含以下代码：\n\n```\n1 function sayHello(who) {\n2   console.log(\"\
  Hello \" + who + \"! I salute you JavaScript-mancer!\");\n3 }\n4 sayHello('<Your\
  \ name here>');\n```\n\n你可以使用 `node` 来运行此文件：\n\n```\n1 $ node hello-world.js\n2\
  \ Hello <Your here>! I salute you JavaScript-mancer!\n```\n\n搞定！你已经编写、编译并运行了你的 TypeScript\
  \ 程序！世界，这里！\n\n由于每次修改 `ts` 文件时运行 TypeScript 编译器可能会有点无聊，你可以在**监听模式（watch mode）**下设置编译器。这将告诉\
  \ TypeScript 编译器监控你的源代码，并在检测到更改时随时进行转换。要在监听模式下设置 TypeScript 编译器，只需输入以下内容：\n\n```\n\
  1 $ tsc -w hello-world.ts\n2 10:55:11 AM - Compilation complete. Watching for file\
  \ changes.\n```\n\n在接下来的章节中，我们将发现你可以在 TypeScript 中使用的一些很棒的功能，你关于 TypeScript 类型注解的所有知识，以及在实际项目中使用\
  \ TypeScript 时需要考虑的问题。\n\n#### 酷的 TypeScript 特性\n\n除了类型注解外，TypeScript 本身通过 ESnext\
  \ 特性和自身的一些特性改进了 JavaScript。\n\n#### TypeScript 类\n\nTypeScript 类带有几项功能，提供了比 ES6\
  \ 类好得开发者体验。第一个是**类成员**。\n\n不要像下面这样写你的类：\n\n```\n  // ES6 class\n2 class Gladiator\
  \ {\n3   constructor(name, hitPoints){\n4     this.name = name;\n5     this.hitPoints\
  \ = hitPoints;\n6   }\n7   toString(){\n8     return `${this.name} the gladiator`\n\
  9   }\n10 }\n```\n\n你可以将类成员 `name` 和 `hitPoints` 提取到类体中，就像在静态类型语言中一样：\n\n```\n 1\
  \ class Gladiator {\n2   name: string;\n3   hitPoints: number;\n4 \n5   constructor(name:\
  \ string, hitPoints: number){\n6     this.name = name;\n7     this.hitPoints = hitPoints;\n\
  8   }\n9 \n10   toString(){\n11     return `${this.name} the gladiator`\n12   }\n\
  13 }\n```\n\n这可能有点冗长，所以 TypeScript 提供了另一项名为**参数属性（parameter properties）**的功能，它允许你一次性指定类成员并通过构造函数对其初始化。\n\
  \n使用*参数属性*的上述等效版本所示：\n\n\n\n\n\n```typescript\nclass SleekGladiator {\n  constructor(public\
  \ name: string, \n              public hitPoints: number){}\n\n  toString() {\n\
  \    return `${this.name} the gladiator`\n  }\n}\n```\n\n这样好多了，不是吗？类构造函数中的 `public`\
  \ 关键字告诉 TypeScript `name` 和 `hitPoints` 是可以通过构造函数初始化的类成员。\n\n此外，`public` 关键字还向我们提示了\
  \ TypeScript 为类带来的最后一项改进：**访问修饰符**。TypeScript 带有四种访问修饰符，决定了你如何访问类成员：\n\n- `readonly`：使成员变为只读。你必须在声明时或在构造函数初始化它，之后就无法更改。\n\
  - `private`：使成员变为私有。它只能在类内部被访问。\n- `protected`：使成员变为受保护。它只能在类或派生类型内部访问。\n- `public`：使成员变为公共。任何人都可以访问。遵循\
  \ JavaScript ES6 类的实现，如果未提供，`public` 是类成员和方法的默认访问修饰符。\n\n`readonly` 修饰符让我们省去了像在之前的章节中那样定义\
  \ `@readonly` 装饰器的必要。\n\n一旦确定了名字，就不应该被更改，所以让我们让 `Gladiator` 的名字变为只读的：\n\n```typescript\n\
  class FixedGladiator {\n  constructor(readonly name: string,\n              public\
  \ hitPoints: number){}\n\n  toString() {\n    return `${this.name}, the gladiator`\n\
  \  }\n}\n```\n\n现在，当我们创建一个新的斗士并为他/她起一个名字时，这个名字将刻在石上：\n\n```typescript\nconst maximo\
  \ = new FixedGladiator('Maximo', 5000);\n\nmaximo.name = \"Aurelia\";\n// => [ts]\
  \ Cannot assign to 'name' because it is \n//         a constant or a read-only property.\n\
  ```\n\n这里需要注意的一点是，这些访问修饰符仅适用于 TypeScript 世界。也就是说，当你编写 TypeScript 时，TypeScript 编译器会强制执行它们，但当代码被编译为\
  \ JavaScript 时，它们会被移除。\n\n上述 `FixedGladiator` 的编译后版本产生如下 JavaScript：\n\n```javascript\n\
  var FixedGladiator = (function () {\n  function FixedGladiator(name, hitPoints)\
  \ {\n    this.name = name;\n    this.hitPoints = hitPoints;\n  }\n\n  FixedGladiator.prototype.toString\
  \ = function () {\n    return this.name + \", the gladiator\";\n  };\n\n  return\
  \ FixedGladiator;\n}());\n```\n\n正如从上面的示例中看到的，没有任何机制可以确保 `name` 属性是只读的。\n\n接下来让我们测试\
  \ `private` 访问修饰符。在之前的章节中，我们讨论了在 JavaScript 中实现私有性的不同方法：闭包和符号（symbols）。在 TypeScript\
  \ 中，你可以通过 `private`（以及 `protected`）访问修饰符来实现数据隐藏。\n\n这是我们在*第 6 章：白塔召唤增强：ES6 类的奇迹*中使用的示例，用于展示使用闭包实现数据隐藏：\n\
  \n```typescript\nclass PrivateBarbarian {\n  constructor(name) {\n    // 私有成员\n\
  \    let weapons = [];\n    // 公有成员\n    this.name = name;\n    this[\"character\
  \ class\"] = \"barbarian\";\n    this.hp = 200;\n\n    this.equipsWeapon = function\
  \ (weapon) {\n      weapon.equipped = true;\n      // equipsWeapon 方法闭包了 weapons\
  \ 变量\n      weapons.push(weapon);\n      console.log(`${this.name} grabs a ${weapon.name}\
  \ ` + \n                  `from the cavern floor`);\n    };\n    this.toString =\
  \ function() {\n      if (weapons.length > 0) {\n        return `${this.name} wields\
  \ a ` + \n               `${weapons.find(w => w.equipped).name}`;\n      } else\
  \ return this.name\n    };\n  }\n\n  talks() { \n    console.log(\"I am \" + this.name\
  \ + \" !!!\");\n  }\n\n  saysHi() { \n    console.log(\"Hi! I am \" + this.name);\n\
  \  }\n};\n```\n\n在这个示例中，我们使用闭包来封装 `weapons` 变量，使其在所有意义上都变成私有的。正如你所看到的，使用闭包迫使我们将使用\
  \ `weapons` 变量的 `equipsWeapon` 和 `toString` 方法从类体移动到构造函数体中。\n\n该类在 TypeScript 中的等效写法如下：\n\
  \n```typescript\nclass PrivateBarbarian {\n  // 私有成员\n  private weapons = [];\n\n\
  \  // 公有成员\n  [\"character class\"] = \"barbarian\";\n  hp = 200;\n\n  constructor(name:\
  \ string) {}\n\n  equipsWeapon(weapon) {\n    weapon.equipped = true;\n    weapons.push(weapon);\n\
  \    console.log(`${this.name} grabs a ${weapon.name} ` + \n                `from\
  \ the cavern floor`);\n  }\n\n  toString() {\n    if (weapons.length > 0) {\n  \
  \    return `${this.name} wields a ` + \n             `${weapons.find(w => w.equipped).name}`;\n\
  \    } else return this.name;\n  }\n\n  talks() {\n    console.log(\"I am \" + this.name\
  \ + \" !!!\");\n  }\n\n  saysHi() {\n    console.log(\"Hi! I am \" + this.name);\n\
  \  }\n}\n```\n\n如果你现在实例化一个不可战胜的野蛮人并尝试 `weapons` 属性，你会遇到以下错误：\n\n```typescript\n\
  const conan = new PrivateBarbarian(\"shy\");\nconst privateWeapons = conan.weapons;\n\
  // => [ts] Property 'weapons' is private and \n//         only accessible within\
  \ class 'Barbarian'.\n```\n\n回并对比这两种方法，我认为你会同意我，TypeScript 的语法比 ES6 更好。将所有方法放在类体中更加一致且易于理解。\n\
  \n另一方面，`private` 访问修饰符是一个在编译为 JavaScript 时会消失的 TypeScript 特性，这意味着库消费者能够访问 `weapons`\
  \ 属性。这通常不会成为问题，因为你的开发团队很可能都在使用 TypeScript，但在某些情况下可能会有问题。例如，我可以看到这对使用 TypeScript\
  \ 创建库并让原生 JavaScript 消费者访问是一个问题。\n\n### 为什么我在编写 ES6 类时会遇到 TypeScript 错误？它不是有效的 JavaScript\
  \ 吗？\n\n很好的问题！当你在 TypeScript 编辑器中输入 ES6 `Barbarian` 类示例时，你会惊讶地发现 `this.name`、`this.hp`\
  \ 和 `this.equipsWeapon` 声明会导致 TypeScript 错误。*什么？* 我以前以为每一段 JavaScript 都是有效的 TypeScript，而这完全是\
  \ ES6 代码。*发生了什么？我一直生活在谎言中吗？*\n\n这些错误的原因是 TypeScript 有不同的正确性级别：\n\n- 在第一层，TypeScript\
  \ 编译器在应用类型注解之前检查代码是否符合语法。如果是，那么它就能执行编译并生成正确的 JavaScript 代码（我们刚刚发现的关于 ES6 类的问题就在此类）。\n\
  - 在第二层，TypeScript 编译器会查看类型注解。根据 TypeScript 的类型系统，`PrivateBarbarian` 没有 `name` 属性（属性应该在类体内声明），因此它显示错误\
  \ `[ts] Property 'name' does not exist on type 'PrivateBarbarian'`。\n- 在第三层（通过编译器标志\
  \ `--noImplicitAny` 启用），TypeScript 编译器将变得非常严格，不再假设未注解变量的类型为 `any`。也就是说，它要求所有变量、属性和方法都必须类型。\n\
  \n\n\n\n因此在我们的 ES6 示例中，TypeScript 将你的代码理解为有效的 ES6，并能够将你的代码编译为 JavaScript，但根据 TypeScript\
  \ 的类型系统，你应该重构你的 `class` 并将类成员移动到类体内部。\n\n## 枚举 (Enums)\n\nTypeScript 的另一个强大特性是枚举（enums）。枚举是\
  \ `C#` 和 `Java` 等静态类型语言中的常用数据类型，用于以强类型的方式表示有限数量的事物。\n\n想象你想表达所有不同的元素魔法系：火、水、气和土。当你创建不同的元素法术时，它们将属于这些派系中的某些，并对其他派系的法术具有优势或劣势。例如，一个火球法术可能像这样：\n\
  \n```\n 1 const fireballSpell = {\n 2   type: 'fire',\n 3   damage: 30,\n 4   cast(target){\n\
  \ 5     const actualDamage = target.inflictDamage(this.damage, \n 6            \
  \                                   this.type);\n 7     console.log(`A huge fireball\
  \ springs from your ` +  \n 8         `fingers and impacts ${target} (-${actualDamage}hp)`);\n\
  \ 9   }\n10 };\n```\n\n`target.inflictDamage` 将根据目标对特定元素魔法的抗性或其是否有针对性的防御法术，计算对目标造成的\
  \ `actualDamage`。\n\n这个示例的问题是，字符串并不直观，也没有提供关于可用元素魔法系的丰富信息。在上面的示例中，很容易发生拼写错误，将 `'fire'`\
  \ 误拼为其他内容。\n\n对之前方法的改进是使用对象来封装所有可用选项：\n\n```\n1 const schoolsOfElementalMagic =\
  \ {\n2   fire: 'fire',\n3   water: 'water',\n4   air: 'air',\n5   earth: 'earth'\n\
  6 };\n```\n\n现在我们可以重写之前的示例了：\n\n```\n 1 const fireballSpell = {\n 2   type: schoolsOfElementalMagic.fire,\n\
  \ 3   damage: 30,\n 4   cast(target){\n 5     const actualDamage = target.inflictDamage(this.damage,\
  \ \n 6                                               this.type);\n 7     console.log(`A\
  \ huge fireball springs from your ` +  \n 8         `fingers and impacts ${target}\
  \ (-${actualDamage}hp)`);\n 9   }\n10 };\n```\n\n太棒了！这比我们之前使用的魔法字符串好得多。但它仍然容易受到拼写错误的影响，而且没有任何阻止你在法术内部编写\
  \ `type: 'banana'`。\n\n这就是 TypeScript 枚举用用用场。它们提供了一种静态且强类型的方式来表示有限的集合或状态。一个 `SchoolsOfMagic`\
  \ 枚举可能像这样：\n\n```\n1 enum SchoolsOfMagic {\n2   Fire,\n3   Water,\n4   Air,\n5 \
  \  Earth\n6 }\n```\n\n这个枚举允许我们指定一个表示 `Spell` 形状的接口。注意一个有效的 `Spell` 有一个 `type` 属性，其类型就是我们刚刚创建的枚举\
  \ `SchoolsOfMagic`：\n\n```\n1 // now we can define a Spell interface\n2 interface\
  \ Spell {\n3   type: SchoolsOfMagic,\n4   damage: number,\n5   cast(target: any);\n\
  6 }\n```\n\n当我们现在定义新法术时，TypeScript 将强制要求法术提供的 `type` 必须是 `SchoolsOfMagic` 类型，不仅如此，当使用\
  \ Visual Studio Code 等编辑器时，它将通过语句补全为我们提供所有可用选项（`Fire`、`Water`、`Air` 和 `Earth`）。\n\
  \n```\n 1 const enumifiedFireballSpell: Spell = {\n 2   type: SchoolsOfMagic.Fire,\n\
  \ 3   damage: 30,\n 4   cast(target){\n 5     const actualDamage = target.inflictDamage(this.damage,\
  \ \n 6                                               this.type);\n 7     console.log(`A\
  \ huge fireball springs from your ` +  \n 8         `fingers and impacts ${target}\
  \ (-${actualDamage}hp)`);\n 9   }\n10 }\n```\n\n如果我们输入 `SchoolsOfMagic` 枚举之外的任何内容（例如字符串），TypeScript\
  \ 将立即通过以下错误消息警告我们：\n\n```\n1 // providing other than a SchoolsOfMagic enum would\
  \ result in error:\n2 // [ts] \n3 //   Type \n4 //  '{ type: string; damage: number;\
  \ cast(target: any): void; }' \n5 //   is not assignable to type 'Spell'.\n6 //\
  \   Types of property 'type' are incompatible.\n7 //   Type 'string' is not assignable\
  \ to type 'SchoolsOfMagic'.\n```\n\n编译为 JavaScript 时，枚举将产生以下代码：\n\n```\n1 var SchoolsOfMagic;\n\
  2 (function (SchoolsOfMagic) {\n3     SchoolsOfMagic[SchoolsOfMagic[\"Fire\"] =\
  \ 0] = \"Fire\";\n4     SchoolsOfMagic[SchoolsOfMagic[\"Water\"] = 1] = \"Water\"\
  ;\n5     SchoolsOfMagic[SchoolsOfMagic[\"Air\"] = 2] = \"Air\";\n6     SchoolsOfMagic[SchoolsOfMagic[\"\
  Earth\"] = 3] = \"Earth\";\n7 })(SchoolsOfMagic || (SchoolsOfMagic = {}));\n```\n\
  \n乍看之下可能有点令人生畏。但让我们将其分解为更小的语句：\n\n```\n1 var SchoolsOfMagic;\n2 (function (SchoolsOfMagic)\
  \ {\n3     SchoolsOfMagic[SchoolsOfMagic[\"Fire\"] = 0] = \"Fire\";\n4     SchoolsOfMagic[SchoolsOfMagic[\"\
  Water\"] = 1] = \"Water\";\n5     SchoolsOfMagic[SchoolsOfMagic[\"Air\"] = 2] =\
  \ \"Air\";\n6     SchoolsOfMagic[SchoolsOfMagic[\"Earth\"] = 3] = \"Earth\";\n7\
  \ })(SchoolsOfMagic || (SchoolsOfMagic = {}));\n```\n\n等待，输入文本中有一些重复。我将根据你的要求清理逻辑流。\n\
  \n\n\n\n```javascript\n 1 function obliterate(){\n 2   // Unfortunately arguments\
  \ is not an array :O\n 3   // so we need to convert it ourselves\n 4   var victims\
  \ = Array.prototype.slice.call(arguments, \n 5                               /*\
  \ startFromIndex */ 0);\n 6 \n7   victims.forEach(function(victim){\n 8     console.log(victim\
  \ + \" wiped off of the face of the earth\");\n 9   });\n10   console.log('*Everything*\
  \ has been obliterated, ' + \n11               'oh great master of evil and deceit!');\n\
  12 }\n```\n\n可以使用剩余语法（rest syntax）直接将所有传入的参数收集到一个数组 `victims`：\n\n```javascript\n\
  1 function obliterate(...victims){\n2   victims.forEach(function(victim){\n3   \
  \  console.log(`${victim} wiped out of the face of the earth`);\n4   });\n5   console.log('*Everything*\
  \ has been obliterated, ' + \n6               'oh great master of evil and deceit!');\n\
  7 }\n```\n\n另一方面，展开运算符（spread operator）的工作方式与剩余参数（rest parameters）相反。展开运算符不是接收任意数量的参数并将其封装成数组，而是接收一个数组并将其展开为它的组合项。\n\
  \n遵循这一原则，展开运算符有很多用场景^(28)。例如合并数组：\n\n```javascript\n1 let knownFoesLevel1 = ['rat',\
  \ 'rabbit']\n2 let newFoes = ['globin', 'ghoul'];\n3 let knownFoesLevel2 = [...knownFoesLevel1,\
  \ ...newFoes];\n```\n\n或者克隆它们：\n\n```javascript\n1 let foes = ['globin', 'ghoul'];\n\
  2 let clonedFoes = [...foes];\n```\n\n`Object Spread and Rest`（对象展开与剩余）将数组相同的功能引入了对象。\n\
  \n`对象展开运算符`的一个绝用场景是混合（mixins）。在之前的章节中，我们使用 `Object.assign` 来混合两个或多个不同对象的属性。例如，在这个\
  \ `Wizard` 工厂函数中，我们将巫师属性与封装了通过名称识别和释放法术的行为的混合混合在一起：\n\n```javascript\n 1 function\
  \ Wizard(element, mana, name, hp){\n 2   let wizard = {element, \n 3           \
  \      mana, \n 4                 name, \n 5                 hp};\n 6   Object.assign(wizard,\
  \ \n 7                canBeIdentifiedByName,\n 8                canCastSpells);\n\
  \ 9   return wizard;\n10 }\n```\n\n我们可以使用对象展开如下重写上面的示例：\n\n```javascript\n 1 function\
  \ Wizard(element, mana, name, hp){\n 2   let wizard = {element, \n 3           \
  \      mana, \n 4                 name, \n 5                 hp};\n 6 \n 7   //\
  \ 现在我们使用对象展开\n 8   return {...wizard, \n 9           ...canBeIdentifiedByName,\n\
  10           ...canCastSpells\n11          };\n12 }\n```\n\n对象展开运算符本质上是说：*获取 wizard、canBeIdentifiedByName\
  \ 和 canCastSpells 的所有属性，并将它们放在同一个对象中*。如果有任何同名的属性，最后一个将胜出并覆盖第一个。\n\n对象展开的反面对象剩余参数。它们的工作方式与\
  \ ES6 剩余参数类似，并且与 ES6 解构赋值结合使用时特别有用。\n\n如果你还记得，我们使用解构和剩余参数从数组中提取元素：\n\n```javascript\n\
  1 let [first, second, ...rest] = ['dragon', 'chimera', 'harpy', 'medusa'];\n2 console.log(first);\
  \ // => dragon\n3 console.log(second); // => chimera\n4 console.log(rest); // =>\
  \ ['harpy', 'medusa']\n```\n\n通过对象展开运算符，我们可以遵循相同的模式从对象中提取并收集属性：\n\n```javascript\n\
  \ 1 let {name, type, ...stats} = {\n 2   name: 'Hammer of the Morning',\n 3   type:\
  \ 'two-handed war hammer',\n 4   weight: '40 pounds',\n 5   material: 'nephirium',\n\
  \ 6   state: 'well kept'\n 7 };\n 8 console.log(name); // => Hammer of Morning\n\
  \ 9 console.log(type); // => two-handed war hammer\n10 console.log(stats); \n11\
  \ // => {weight: '40 pounds', \n12 //     material: 'nephirium', \n13 //     state:\
  \ 'well kept'}\n```\n\n#### 还有更多！\n\nTypeScript 中还有许多扩展 ES6 的功能，这些功能可以通过早期实现目前处于提案阶段的\
  \ ESnext 特性（如 `async/await` 或装饰器），也可以通过像我们看到的与类和枚举相关的全新功能来实现。\n\n如果你对学习更多 TypeScript\
  \ 感兴趣，我鼓励查看 [TypeScript 手册](http://bit.ly/ts-handbook) 和 [发布说明](http://bit.ly/ts-whats-new)，这两者都提供了关于\
  \ TypeScript 为你准备的详细信息。\n\n### TypeScript 中的类型注解\n\n类型注解是 TypeScript 的立身之本，它为 JavaScript\
  \ 提供了新层次的元编程能力：类型元编程。类型注解让你能够为你和你的团队创建更好的开发者体验。（此处省略了原文中大量重复的句子翻译，根据您的要求保持格式一致）\n\
  \n\n\n\n\n```javascript\nfunction frost(minion) {\n    var damage = 10;\n    console.log(minion\
  \ + \" is covered in frozy icicles (-\" + damage + \" hp)\");\n    minion.hitPoints\
  \ -= damage;\n}\n```\n\n这说明了接口是为你的代码库添加类型注释的轻量级方法，可以在开发过程中获益，而不会对在浏览器上运行的代码产生任何负面影响。\n\
  \n让我们用不同类型的参数测试我们新的 `frost` 函数和 `Minion` 接口，看看它们的表现如何。拿出我们上一个例子中的 `duck` 吧\n\n```javascript\n\
  // const duck = {\n//  toString(){ return 'duck';}, \n//  hitPoints: 100\n// };\n\
  frosty(duck);\n// => duck is covered in frozy icicles (-10hp)\n```\n\n看起来工作得非常完美。如果我们尝试使用代表\
  \ `Tower` 的类，并且它具有 `hitPoints` 和 `defense` 属性，它似乎也能工作：\n\n```javascript\nclass Tower\
  \ {\n    constructor(public hitPoints=500, public defense=100){}\n    toString(){\
  \ return 'a mighty tower';}\n}\nconst tower = new Tower();\n\nfrosty(tower);\n//\
  \ => a mighty tower is covered in frozy icicles (-10hp)\n```\n\n一个带有 `hitPoints`\
  \ 属性的简单对象字面量也是如此\n\n```javascript\nfrosty({hitPoints: 100});\n// => [object Object]\
  \ is covered in frozy icicles (-10hp)\n```\n\n然而，如果我们使用一个除了 `hitPoints` 还有另一个属性的对象字面量，编译器就会报错：\n\
  \n```javascript\nfrosty({hitPoints: 120, toString(){ return 'a bat';}})\n// => doesn't\
  \ compile\n// => Argument of type '{ hitPoints: number; toString(): string; }'\n\
  //    is not assignable to parameter of type 'Minion'.\n//  Object literal may only\
  \ specify known properties, \n//  and 'toString' does not exist in type 'Minion'.\n\
  ```\n\n错误信息看起来很有帮助。它说对于对象字面量，我只能指定已知属性，并且 `toString` 不存在于 `Minion` 中。那么，如果我将对象字面量存储在变量\
  \ `aBat` 中会发生什么？\n\n```javascript\nlet aBat = {\n    hitPoints: 120, \n    toString(){\
  \ return 'a bat';}\n};\nfrosty(aBat);\n// => a bat is covered in frozy icicles (-10hp)\n\
  ```\n\n成功了！有趣的是，从这些实验来看，TypeScript 会认为 `Minion` 是任何满足接口定义规范的对象，即具有类型为 `number` 的\
  \ `hitPoints` 属性。\n\n然而，看起来当你使用对象字面量时，TypeScript 有一套稍微更严格的规则，它期望一个完全匹配 `Minion`\
  \ 接口的参数。那么，`Minion` 到底是什么？当 TypeScript 遇到任意对象时，它是如何判断它是否为 `Minion` 的？\n\n**它遵循结构化类型的规则**。\n\
  \n### 结构化类型\n\n**结构化类型是一种类型系统，类型兼容性和等效性由所比较类型的结构（即它们的属性）决定**。\n\n例如，遵循结构化类型，以下所有类型都是等效的，因为它们具有相同的结构（相同的属性）：\n\
  \n```typescript\n// an interface\ninterface Wizard {\n  hitPoints: number;\n  toString():\
  \ string;\n  castSpell(spell:any, targets: any[]);\n}\n\n// an object literal\n\
  const bard = {\n  hitPoints: 120,\n  toString() { return 'a bard';},\n  castSpell(spell:\
  \ any, ...targets: any[]){\n    console.log(`${this} cast ${spell} on ${targets}`);\n\
  \    spell.cast(targets);\n  }\n}\n\n// a class\nclass MagicCreature {\n  constructor(public\
  \ hitPoints: number){}\n  toString(){ return \"magic creature\";}\n  castSpell(spell:\
  \ any, ...targets: any[]){\n    console.log(`${this} cast ${spell} on ${targets}`);\n\
  \    spell.cast(targets);\n  }\n}\n```\n\n你可以使用这段代码片段进行验证：\n\n```typescript\nlet\
  \ wizard: Wizard = bard;\nlet anotherWizard: Wizard = new MagicCreature(120);\n\
  ```\n\n相比之下，C# 或 Java 等语言拥有我们所说的**名义类型系统**。在名义类型系统中，类型等效性基于类型的名称和显式声明，只有当类显式实现了该接口时，`MagicCreature`\
  \ 才是一个 `Wizard`。\n\n结构化类型对于 JavaScript 开发者来说是非常棒的，因为它的行为非常类似于鸭子类型（duck typing），而鸭子类型是\
  \ JavaScript 面对象编程模型的核心特征之一。对于 C#/Java 开发者来说也很棒，因为他们可以享受接口、类和编译时反馈等 C#/Java 特性，但具有更高的自由度和灵活性。\n\
  \n仍然有一个用例符合我们刚刚描述的结构化类型规则。如果你还记得上一节的例子，对象字面量似乎是结构化类型规则的一个例外。\n\n### TypeScript 帮助你进行类型注释\n\
  \nTypeScript 的另一个有趣侧面是它的**类型推断**能力。编写类型注释不仅会导致代码更加冗长，而且是你需要额外完成的工作。为了尽可能减少你对代码注释的工作量，TypeScript\
  \ 会尽力从代码本身推断使用的类型。例如：\n\n```typescript\nconst aNumber = 1;\nconst anotherNumber\
  \ = 2 * aNumber;\n\n// aNumber: number\n// anotherNumber:number\n```\n\n在代码示例中，我们没有指定任何类型。尽管如此，TypeScript\
  \ 毫无疑问地知道 `aNumber` 变量的类型是 `number`，通过评估 `anotherNumber`，它知道它的类型也是 `number`。同样，我们可以这样写：\n\
  \n```typescript\nconst double = (n: number) => 2*n;\n// double: (n:number) => number\n\
  ```\n\n### 从接口到类\n\n到为止，我们已经看到了如何以原始类型、数组、对象字面量和接口的形式使用类型注释。所有这些都是 TypeScript 特有的产物，当你将\
  \ TypeScript 代码编译为 JavaScript 时就会消失。我们还看到了 TypeScript 如何尝试从你的代码中推断类型，以便你不需要花费额外的时间来注释代码。\n\
  \n然后我们有了类。类是 ES6/TypeScript 特性，我们可以用它来描述结构和行为的领域模型实体，它包含特定的实现，并同时作为类型注释。\n\n\n\n\
  \n\n在之前的章节中，我们定义了一个名为 `Minion` 的接口，表示一个具有 `hitPoints` 属性的实体。我们可以用类来实现这一点：\n\n```typescript\n\
  1 class ClassyMinion {\n2   constructor(public hitPoints: number) {}\n3 }\n```\n\
  \n并创建一个新的 `classyFrost` 函数，将该类作为参数类型：\n\n```typescript\n1 function classyFrost(minion:\
  \ ClassyMinion){\n2   const damage = 10;\n3   console.log(`${minion} is covered\
  \ in frozy icicles (-${damage} hp)`)\n4   minion.hitPoints -= damage;\n5 }\n```\n\
  \n我们可以结合新的 `ClassyMinion` 类使用此函数，甚至可以配合之前的 `aBat` 和 `bard` 变量，因为根据结构化类型（structural\
  \ typing）的规则，这些类型都是等价的：\n\n```typescript\n1 classyFrosty(new ClassyMinion());\n\
  2 // => a classy minion is covered in frozy icicles (-10hp)\n3 classyFrosty(aBat);\n\
  4 // => a bat is covered in frozy icicles (-10hp)\n5 classyFrosty(bard);\n6 // =>\
  \ a bard is covered in frozy icicles (-10hp)\n```\n\n通常情况下，我们会让 `class` 实现所需的 `interface`。例如：\n\
  \n```typescript\n1 class ClassyMinion implements Minion {\n2   constructor(public\
  \ hitPoints: number) {}\n3 }\n```\n\n虽然从结构化类型的角度来看，这不会改变该类的看待方式，但它提升了我们的开发体验。添加\
  \ `implements Minion` 有助于 TypeScript 告诉我们是否正确实现了接口，或者是否漏掉了某些属性或方法。对于只有一个属性的类来说，这听起来可能意义不大，但随着类变得复杂，它会变得越来越有用。\n\
  \n总的来说，使用 `class` 和使用 `interface` 的区别在于，类在编译为 JavaScript 时会生成真实的 JavaScript 类（尽管取决于你的\
  \ JavaScript 版本，它可能是构造函数/原型对）。\n\n例如，上面的类在我们当前的配置下会生成以下 JavaScript：\n\n```javascript\n\
  \ 1 var ClassyMinion = (function () {\n 2     function ClassyMinion(hitPoints) {\n\
  \ 3         if (hitPoints === void 0) { hitPoints = 100; }\n 4         this.hitPoints\
  \ = hitPoints;\n 5     }\n 6     ClassyMinion.prototype.toString = function () {\n\
  \ 7         return 'a classy minion';\n 8     };\n 9     return ClassyMinion;\n\
  10 }());\n```\n\n这是有道理的，因为与 `interface`（仅用于 TypeScript 类型注解世界的虚拟产物）不同，`class` 是运行程序所必需的。\n\
  \n### 那么，什么时候使用接口，什么时候使用类呢？\n\n让我们回顾一下这两种构造的作用及其行为：\n\n- **接口 (Interface)**：描述形状和行为。在编译过程中会被移除。\n\
  - **类 (Class)**：描述形状和行为。提供具体的实现。它会被转译为 JavaScript。\n\n因此，接口和类都描述了类型的形状和行为。此外，类提供了具体的实现。\n\
  \n在 C# 或 Java 的世界中，遵循**依赖倒置**（dependency inversion）原则，我们建议在描述类型时优先使用接口而不是类。这会为我们的程序提供大量的灵活性和扩展性，因为我们可以实现一个松耦合的系统，具体类型之间彼此独立。然后我们就可以注入各种符合接口定义契约的具体类型。这在\
  \ C# 或 Java 等静态类型语言中是必须的，因为它们使用命名类型系统。但 TypeScript 呢？\n\n正如我们之前提到的，TypeScript 使用的是结构化类型系统，当类型具有相同的结构（即具有相同的成员）时，它们就是等价的。基于此，你可以说使用接口或类来标记类型其实并不重要。如果接口、类或对象字量共享相同的结构，它们将受到同等对待，那么我们为什么还需要在\
  \ TypeScript 中使用接口呢？在考虑使用接口对比类时，你可以遵循以下准则：\n\n1. **单一职责原则**（The single responsibility）是降低程序复杂性的极佳准则。**在接口与类的抉择中应用单一职责原则，我们可以得出使用接口表示类型、使用类表示实现的结论**。接口提供了一种非常简洁的方式表示类型的形状，而类则将形状和实现混合在一起，这可能使得仅仅通过类就很难确定类型的形状。\n\
  2. `interfaces` 比类更具灵活性。因为类包含了具体的实现，从其本质上来说，它比接口更僵化。使用接口，我们可以捕捉类之间常见的细粒度细节或行为片段。\n\
  3. `interfaces` 是一种轻量级的方式，可以为可能属于应用程序外部的数据提供类型信息，例如来自 Web 服务的数据。\n4. 对于没有关联任何行为的类型（即纯数据类型），你可以直接使用类。在这种情况下，使用接口通常会是大材小用且没必要的。使用类会通过构造函数简化对象的创建。\n\
  \n因此，总的来说，我们在 C# 和 Java 等静态类型语言中遵循的接口的准则也适用于 TypeScript。优先使用接口来描述类型，并使用类进行特定的实现。如果类型只是没有行为的数据，你可以考虑单独使用类。\n\
  \n#### 高级类型注解 (Advanced Type Annotations)\n\n除了我们目前看到的，TypeScript 还提供了更多表达复杂类型的机制。其核心思想是：无论你使用哪种构造或模式，都应该能够通过类型注解表示其类型。这些高级注解的示例包括：\n\
  \n- 泛型 (Generics)\n- 交叉类型和联合类型 (Intersection and Union Types)\n- 类型守卫 (Type Guards)\n\
  - 可空类型 (Nullable Types)\n- 类型别名 (Type Aliases)\n- 字符串字面量类型 (String-literal Types)\n\
  \n让我们来看每一个、它们为什么被需要以及如何使用。\n\n##### 泛型\n\n泛型是 C# 和 Java 等静态类型语言中的常用技术，用于将数据结构或算法的应用泛化到多个类型上。例如，而不是为每种不同类型编写单独的\
  \ `Array` 实现：`NumberArray`、`StringArray`、`ObjectArray` 等：\n\n```typescript\n 1 interface\
  \ NumberArray {\n 2   push(n: number);\n 3   pop(): number;\n 4   [index: number]:\
  \ number;\n 5   // 等\n 6 }\n 7 \n8 interface StringArray {\n 9   push(s: string);\n\
  10   pop(): string;\n11   [index: number]: string;\n12   // 等\n13 }\n14 \n15 //\
  \ 等\n```\n\n我们使用泛型来描述任意类型 `T` 的 `Array`：\n\n```typescript\n1 // 注意 Array<T> 是 TypeScript\
  \ 中的内置类型\n2 interface Array<T>{\n3   push(s: T);\n4   pop(): T;\n5   [index: number]:\
  \ T;\n6   // 等\n7 }\n```\n\n现在我们可以通过为 `T` 选择类型来复用这个单一类型定义：\n\n```typescript\n1 let\
  \ numbers: Array<number>;\n2 let characters: Array<string>;\n3 // 以此类推...\n```\n\
  \n就像我们在接口中使用泛型一样，也可以在类中使用它们：\n\n```typescript\n1 class Cell<T> {\n2   private prisoner:\
  \ T;\n3 \n4   inprison(prisoner: T) { \n5     this.prisoner = prisoner; \n6   }\n\
  7 \n8   free(): T { \n9     const prisoner = this.prisoner; \n10    this.prisoner\
  \ = undefined;\n11     return prisoner;\n12   }\n13 }\n```\n\n最后，你可以限制类型 `T` 为某些类型的子集。例如，假设某个函数只在\
  \ `Minion` 的上下文中才有意义。你可以写道：\n\n```typescript\n1 interface ConstrainedCell<T extends\
  \ Minion>{\n2   inprison(prisoner: T);\n3   free(): T;\n4 }\n```\n\n现在这将会是一个完全可以盒子：\n\
  \n```typescript\n1 let box: ConstrainedCell<MagicCreature>;\n```\n\n但这种情况下是不行的，因为类型\
  \ `T` 不匹配 `Minion` 接口。\n\n\n\n\n\n```\n1 let box: ConstrainedCell<{name: string}>;\n\
  2 // => [ts] Type '{ name: string; }' \n3 //    does not satisfy the constraint\
  \ 'Minion'.\n4 //    Property 'hitPoints' is missing in type '{ name: string; }'.\n\
  ```\n\n### 交叉类型与联合类型\n\n我们已经看到了原始类型、接口、类、泛型等许多提供类型信息的方法，尽管这些方法非常灵活，但仍然有一个它们难以涵盖的用例：`Mixins`（混合器）。\n\
  \n在使用混合器时，生成的对象是其他不同对象的混合。该结果对象的类型本身不是一个已知的类型，而是现有类型的组合。\n\n例如，让我们回到之前看过的 `Wizard`\
  \ 示例：\n\n```\n 1 function Wizard(element, mana, name, hp){\n 2   let wizard = {element,\
  \ \n3                 mana, \n4                 name, \n5                 hp};\n\
  \ 6 \n7   // 现在我们使用对象展开运算符\n 8   return {...wizard, \n9           ...canBeIdentifiedByName,\n\
  10           ...canCastSpells\n11          };\n12 }\n```\n\n我们可以将其拆解为独立的元素：\n\n\
  ```\n 1 interface WizardProps{\n 2   element: string;\n 3   mana: number;\n 4  \
  \ name: string;\n 5   hp: number;\n 6 }\n 7 \n8 interface NameMixin {\n 9   toString():\
  \ string;\n10 }\n11 \n12 interface SpellMixin {\n13   castsSpell(spell:Spell, target:\
  \ Minion);\n14 }\n```\n\n我们如何定义由 `WizardProps`、`NameMixin` 和 `SpellMixin` 组合而成的\
  \ `Wizard` 类型呢？我们使用**交叉类型**（Intersection Types）。交叉类型允许我们定义其他类型组合的类型。例如，我们可以使用以下类型注解来表示我们的\
  \ `Wizard`：\n\n```\n1 WizardProps & NameMixin & SpellMixin\n```\n\n并且我们可以将其作为工厂函数的返回类型：\n\
  \n```\n 1 let canBeIdentifiedByName: NameMixin = {\n 2   toString(){ return this.name;\
  \ }\n 3 };\n 4 \n5 let canCastSpells: SpellMixin = {\n 6   castsSpell(spell:Spell,\
  \ target:Minion){\n 7     // 施法术\n 8   }\n 9 }\n10 \n11 function WizardIntersection(element:\
  \ string, mana: number, \n12                             name : string, hp: number):\
  \ \n13          WizardProps & NameMixin & SpellMixin {\n14   let wizard: WizardProps\
  \ = {element, \n15                 mana, \n16                 name, \n17       \
  \          hp};\n18 \n19   // 现在我们使用对象展开运算符\n20   return {...wizard, \n21      \
  \     ...canBeIdentifiedByNameMixin,\n22           ...canCastSpellsMixin\n23   \
  \       };\n24 }\n25 \n26 const merlin = WizardIntersection('spirit', 200, 'Merlin',\
  \ 200);\n27 // merlin.steal(conan);\n28 // => [ts] Property 'steal' does not exist\
  \ \n29 //    on type 'WizardProps & NameMixin & SpellMixin'.\n```\n\n正如我们通过交叉类型产生一个其他类型组合的类型一样，我们也有能力创建一个可以是一系列类型中任意一个的类型，即可以是\
  \ `string` 或 `number` 或其他类型。我们将这些类型称为**联合类型**（Union Types）。它们通常用于你有重载函数或方法时，这些方法可能接受不同类型的参数。\n\
  \n看看下面这个召唤骨髅军队的函数：\n\n```\n 1 function raiseSkeleton(numberOrCreature){\n 2   if\
  \ (typeof numberOrCreature === \"number\"){\n 3     raiseSkeletonsInNumber(numberOrCreature);\n\
  \ 4   } else if (typeof numberOrCreature === \"string\") {\n 5     raiseSkeletonCreature(numberOrCreature);\n\
  \ 6   } else {\n 7     console.log('raise a skeleton');\n 8   }\n 9 \n10   function\
  \ raiseSkeletonsInNumber(n){\n11     console.log('raise own + n + ' skeletons');\n\
  12   }\n13   function raiseSkeletonCreature(creature){\n14     console.log('raise\
  \ a skeleton ' + creature);\n15   };\n16 }\n```\n\n根据 `numberOrCreature` 的类型，上面的函数可以召唤骨髅，也可以召唤骨髅生物：\n\
  \n```\n1 raiseSkeleton(22);\n2 // => raise 22 skeletons\n3 \n4 raiseSkeleton('dragon');\n\
  5 // => raise a skeleton dragon\n```\n\n我们可以使用联合类型为 `raiseSkeletonTS` 函数添加一些 TypeScript\
  \ 的优秀特性：\n\n```\n 1 function raiseSkeletonTS(numberOrCreature: number | string){\n\
  \ 2   if (typeof numberOrCreature === \"number\"){\n 3     raiseSkeletonsInNumber(numberOrCreature);\n\
  \ 4   } else if (typeof numberOrCreature === \"string\") {\n 5     raiseSkeletonCreature(numberOrCreature);\n\
  \ 6   } else {\n 7     console.log('raise a skeleton');\n 8   }\n 9 \n10   function\
  \ raiseSkeletonsInNumber(n){\n11     console.log('raise ' + n + ' skeletons');\n\
  12   }\n13   function raiseSkeletonCreature(creature){\n14     console.log('raise\
  \ a skeleton ' + creature);\n15   };\n16 }\n```\n\n\n\n\n同样，使用 React 和 `Create React\
  \ App` 工具（也称为 CRA）启动一个带有 TypeScript 的 React 项目只需要输入^(29):\n\n```\n1 $ create-react-app\
  \ my-new-app --scripts-version=react-scripts-ts\n```\n\n如果你使用了上述任何选项，你就可以开始了。无论哪种情况，系统都会为你引导并创建一个新应用，你将能够开始使用\
  \ TypeScript 构建你的 Angular 或 React 应用。\n\n另一方面，如果你出于某种原因需要从零开始，你会发现对于最常见的任务管理器或模块打包器（如\
  \ grunt、gulp 或 webpack），都有相应的 [TypeScript 插件](http://bit.ly/ts-plugins)。在将 TypeScript\
  \ 集成到你的工具链时，你可能还需要额外执行一个步骤来配置 TypeScript 编译器：设置你的 `tsconfig` 文件。\n\n## `tsconfig.json`\
  \ 文件\n\n`tsconfig.json` 文件包含了你项目的 TypeScript 配置。它会告诉 TypeScript 编译器关于编译项目时所需的所有细节，例如：\n\
  \n*   要转译哪些文件\n*   忽略哪些文件\n*   使用哪个版本的 JavaScript 作为转译目标\n*   在输出的 JavaScript 中使用哪个模块系统\n\
  *   编译器的严格程度应该是多少。是否应该允许隐式 `any`？是否应该执行严格的空检查？\n*   加载哪些第三方库的类型\n\n如果你没有指定部分信息，TypeScript\
  \ 编译器将尽力而。例如，不指定任何要转译的文件将提示 TypeScript 编译器转译项目文件夹内的所有 TypeScript 文件 (`*.ts`)。不指定任何第三方类型将导致\
  \ TypeScript 编译器在项目内查找类型定义文件（即在 `./node_modules/@types` 中）。\n\n这是一个来自 TypeScript\
  \ 文档的 `tsconfig.json` 示例，可以让你有一个直感受：\n\n```\n 1 {\n 2     \"compilerOptions\": {\n\
  \ 3         \"module\": \"system\",\n 4         \"noImplicitAny\": true,\n 5   \
  \      \"removeComments\": true,\n 6         \"preserveConstEnums\": true,\n 7 \
  \        \"outFile\": \"../../built/local/tsc.js\",\n 8         \"sourceMap\": true\n\
  \ 9     },\n 10     \"include\": [\n 11         \"src/**/*\"\n 12     ],\n 13  \
  \   \"exclude\": [\n 14         \"node_modules\",\n 15         \"**/*.spec.ts\"\n\
  \ 16     ]\n 17 }\n```\n\n有关所有可用选项的完整参考，请查看 [TypeScript 文档](http://bit.ly/tsc-options)。\n\
  \n## TypeScript 与第三方库\n\n从 TypeScript 2.0 开始，为第三方库安装类型声明变得与 `npm` 安装任何其他库一样简单。\n\
  \n假设你想利用 ramda。\n\n```\nnpm install @types/ramda\n```\n\n\n\n\n# 第三卷. JavaScript\
  \ 魔法与函数式编程：函数式编程者的之路\n\n## JavaScript 中函数式编程的基础\n\n```\n text text text text text\
  \ text text,  \ntext text text text text text text,  \ntext text text text text\
  \ text text,  \ntext text text text text text text,  \ntext text text text text\
  \ text text,  \ntext text text text text text text,  \ntext text text text text\
  \ text text,  \ntext text text text text text text.\n\n                        \
  \        - XXXX Xxxxx,\n                                Some title, Some time \n\
  ```\n\n```\n1 /* \n2  * story \n3  *\n4  */\n```\n\n### 函数编程与 JavaScript\n\n函数是\
  \ JavaScript 中最基础且常见的结构之一。我们使用它们处理各种事务：抽象、封装和重用功能，作为对象工厂和构造函数，模拟数据隐私，创建命名空间和模块，我们还可以将其与其他函数组合在一起……它们无处不在。\n\
  \n函数在 JavaScript 中如此流行，以至于它们是[一等公民](https://en.wikipedia.org/wiki/First-class_function)，并且使用[高阶函数](https://en.wikipedia.org/wiki/Higher-order_function)非常自然，这使得\
  \ JavaScript 成为一种函数式编程的极佳语言。\n\n但这些关于一等公民和高阶函数的废话到底意味着什么？**起初你为什么要关注函数式编程呢**？而且……函数式编程到底是什么？\n\
  \n### 什么是函数式编程？\n\n函数式编程是一种范式，通过构建、组合和评估函数来编写程序，就像处理数学函数一样。这些特殊函数通常具有特点：避免改变状态、副作用以及使用不可变数据。\n\
  \n### 为什么要关注函数式编程？\n\n函数式编程的应用带来了非常声明式的编码风格，你将计算的每一个部分封装在可重用的函数中，然后将它们组合在一起以构建更大的抽象并完成更复杂的任务。因此，函数式风格的代码非常简洁且易读。\n\
  \n由于函数式编程鼓励使用纯函数（即没有副作用的确定性函数，其输出完全由输入决定），遵循这些原则编写的程序非常易于测试且不容易出现 bug。此外，遵循逻辑和预测程序行为变得变得容易得多。\n\
  \n函数式编程还擅长将隐式需求或代码约转换为显式的程序需求，这有助于澄清代码意图并使其更易读、更易理解。事实上，可以说函数式编程是将隐性转化为显性的艺术。\n\n\
  总而言之，函数式编程帮助你：\n\n* 编写可重用的代码\n* 编写简洁、易读的代码\n* 编写更不易出错且更容易测试的代码\n* 让你的程序行为更容易理解和预测\n\
  * 通过将隐式需求转换为显式需求，让你的代码更有意图\n\n听起来有趣吗？那么让我们开启函数式编程者的之路吧。在谈论函数式编程时，经常会随意提到一些不同的函数式编程概念，你可能并不熟悉它们。因此，我们将帮助你在这个新领域变得更加自在，并使用简单的示例解释纯函数、高阶函数、`closures`\
  \ 等概念，以便你打好基础，并获得足够的信心立即开始编写函数式风格的代码。\n\n### 函数作为一等公民\n\n说一种语言具有一等函数或函数作为一等公民时，是指函数的行为就像语言中的任何普通值一样，即：\n\
  \n* 你可以将它们存储在变量中\n* 你可以作为参数传递给其他函数\n* 你可以从其他函数返回它们\n\n这意味着函数并不是一种只能在类上下文中定义的特殊神秘结构，而是它们本身的一项基础结构，可以在程序的任何地方使用。\n\
  \nJavaScript 具有一等函数的语言。在 JavaScript 中，你可以将函数存储在变量中：\n\n```\n1 const add = (a, b)\
  \ => a + b;\n2 console.log(`1 + 2 = ${add(1, 2)}`);\n3 // => 1 + 2 = 3\n```\n\n\
  你可以将其作为参数传递给另一个函数：\n\n```\n1 const magicNumbers = [1, 2, 3, 4];\n2 const sum = magicNumbers.reduce(add);\n\
  3 console.log(`${magicNumbers.join(' + ')} = ${sum}`);\n```\n\n最后，你可以返回一个函数：\n\n\
  ```\n1 const addX = x => b => x + b;\n2 const add10 = addX(10);\n3 console.log(add10(5));\
  \ // => 15\n```\n\n### 什么是高阶函数？\n\n高阶函数（也称为函数形式或算子）是指具有至少一个特征的函数：\n\n* 它接收一个或多个函数作为参数\n\
  * 它返回一个函数\n\n你熟悉的所有其他函数都是我们所知的一阶函数。\n\n你已经在上一节中看到高阶函数的实际应用了。例如，`Array.prototype.reduce`\
  \ 函数就是一个高阶函数，因为它接受一个函数作为参数。`reduce` 的朴素实现如下：\n\n```\n1 const reduce = (array, reducingFunction,\
  \ initialValue = 0) => {\n2   let result = initialValue;\n3   for (let item of array)\n\
  4     result = reducingFunction(result, item);\n5   return result;\n6 }\n```\n\n\
  其中，我们遍历 `array` 的元素，并在每个元素上应用 `reducingFunction`：\n\n```\n1 const sumAgain = reduce(magicNumbers,\
  \ add);\n2 console.log(`${magicNumbers.join(' + ')} = ${sum} (with our own reduce)`);\n\
  3 // => 1 + 2 + 3 + 4 = 10 (with our own reduce)\n```\n\n`reduce` 不仅用于数字数字数组，它通过应用归约操作将值集合转换为不同值这一想法的推广。我们可以将其用于任何地方！任何地方！？\n\
  \n例如，在魔法商店寻找最便宜的魔杖：\n\n```\n 1 let shop = [\n2   {name: 'wand of fire', price: 100},\n\
  3   {name: 'wand of ice', price: 200},\n4   {name: 'wand of healing', price: 50}\n\
  \ 5 ];\n 6\n7 let cheapestWand = shop\n8   .reduce((item1, item2) => item1.price\
  \ < item2.price ? item1 : item2)\n9 console.log(`The cheapest wand is ${cheapestWand.name}`)\n\
  10 // => The cheapest wand is wand of healing\n```\n\n或者过滤出低于给定的魔杖：\n\n\n\n\n\n\
  ```javascript\n1 // 或者过滤出给定价格以下的魔杖\n2 let cheapWands = shop\n3   .reduce((cheapWands,\
  \ wand) => {\n4     if (wand.price <= 100) cheapWands.push(wand) \n5     return\
  \ cheapWands;\n6    }, []);\n7 console.log(`Cheap wands under 100 silvers: ${cheapWands.map(w\
  \ => w.name)}`);\n8 // => 100 银币以下的魔杖：火杖，治疗杖\n```\n\n在上一节中，你还看到了一个返回另一个函数的示例，带有\
  \ `add`、`addX` 和 `addXX`。这意味着我们可以直接跳转到下一个函数式编程概念：**纯函数**！\n\n## 纯函数\n\n`pure function`（纯函数）是一个完全确定的函数，具有以下两个特征：\n\
  \n- 它的结果仅取决于它的输入值，不受函数任何外部状态的影响\n- 它没有任何副作用，也就是说，它不会影响（改变、修改）函数外部的任何状态\n\n由于这些特征，纯函数只对其参数进行操作，这使得它们非常容易理解、易于测试且不易出错。同样的原理，用`pure\
  \ functions`构建的程序也具有相同的特征。\n\n我们在本节中已经看到了几个`pure functions`。例如，`add` 函数就是一个`pure\
  \ function`：\n\n```javascript\n1 const add = (a, b) => a + b;\n```\n\n`a` 加 `b`\
  \ 的结果仅取决于这些输入，无论你加多少次 `1+1`，结果始终是 `2`。此外，该函数没有副作用，它不会影响其边界之外的任何东西。\n\n在另一侧，我们有不纯函数，它们在\
  \ OOP 语言中非常常见。例如，假设我们有一个 `WizardryShop` 类，它代表一个拥有所有商品、账单和每日销售额的魔法店。\n\n``````javascript\n\
  \ 1 class WizardryShop {\n 2   constructor(){\n 3     this.items = new Map();\n\
  \ 4     this.coins = 0;\n 5     this.sales = [];\n 6   }\n 7   addItemToInventory(item,\
  \ units) {\n 8     this.items.set(item, units)\n 9   }\n 10   sellItem(item, coins,\
  \ date = new Date()) {\n 11     this.items.set(item, this.items.get(item) - 1);\n\
  \ 12     this.coins += coins;\n 13     this.sales.push({item, coins, date});\n 14\
  \   }\n 15   computeDailySales(date=new Date()){\n 16     return this.sales\n 17\
  \       .filter(s => s.date.toDateString() === date.toDateString())\n 18       .reduce((total,\
  \ sale) => total + sale.coins, 0);\n 19   }\n 20 }\n``````\n\n假设魔法店的 `computeDailySales`\
  \ 方法是不纯的。它依赖 `date` 参数，但也依赖于函数外部的状态。对于任何给定日期，计算每日销售额的结果将根据 `wizardryShop` 的状态而不同：\n\
  \n```javascript\n 1 let wizardryShop = new WizardryShop();\n 2 wizardryShop.addItemToInventory('heal\
  \ potion +50hp', 5);\n 3 wizardryShop.sellItem('heal potion +50hp', 20, new Date(2015,\
  \ 10, 10));\n 4 wizardryShop.sellItem('heal potion +50hp', 20);\n 5 wizardryShop.sellItem('heal\
  \ potion +50hp', 30);\n 6 console.log(`Sales today: ${wizardryShop.computeDailySales()}\
  \ silvers`);\n 7 // => 今日销售额：50 银币\n```\n\n**为什么从函数式编程的角度来看这是一个问题呢？** 嗯，拥有外部依赖使得函数实现变得更加复杂，更难预测其行为也更难测试，因为我们在测试它之前，需要重新创建整个\
  \ `wizardryShop` 对象的状态。\n\n函数式编程源于`lambda calculus`和数学领域，倾向于使用`pure functions`，这是函数在数学中的工作方式，如果你想构建健壮的程序，这是一件好事。\n\
  \n尽管如此，它偶尔也会包含不纯函数。例如，`addXX` 返回的函数是不纯函数：\n\n```javascript\n 1 const addXX = function(x)\
  \ {\n 2   return function(b) {\n 3     return add(x, b);\n 4   }\n 5 }\n```\n\n\
  这是因为内部函数可以访问在其边界之外定义的 `x` 变量。这就是我们所说的闭包（closure），是函数式编程中常用的另一种工具。\n\n## 闭包\n\n`Closures`（闭包）是在创建时封装了`free\
  \ variables`（自由变量）值的函数。`free variable`是指定义在函数局部作用域之外且在其`lexical scope`（词法作用域）中的变量。`Lexical\
  \ Scope` 是 JavaScript 中使用的一种作用域方案，其中每个内部作用域都可以访问外层作用域。让我们用一个例子来说说明这些概念：\n\n```javascript\n\
  \ 1 // substractX 词法作用域的一部分\n 2 let cucumber = 'the cucumber';\n 3 \n4 const createSubstractX\
  \ = function(x) {\n 5   // substractX 词法作用域的一部分\n...（此处省略重复内容）\n```\n\n\n\n我们有一位急需治疗药水的英雄，于是他穿遍城市，想要买下这里的每一种高级治疗药水。他来到第一家商店并买了药水：\n\
  \n```\n1 theFlamingLantern.sellItem('potion of greater healing +500hp', 100);\n\
  2 // => potion of greater healing +500hp sold for 100 silvers\n```\n\n一切进展顺利，但当他去第二家商店意图购买同样的药水时：\n\
  \n```\n1 try {\n2   theLightOfAdun.sellItem('potion of greater healing +500hp',\
  \ 100);\n3 } catch(error) {\n4   console.log(error.message);\n5   // => Oh no! potion\
  \ of greater healing +500hp is sold out!\n6 }\n```\n\n一切都崩溃了。两家商店访问了同一个可变数组，并且在无意中耦合在了一起。我们的代码库中已经存在数月的可怕\
  \ Bug，而我们甚至完全没有注意到！它会缓慢破坏我们虚拟王国的经济，并在魔法物品销售社区引起许多动荡，他们可能会认为自己正受到盗贼或邪恶诅咒的侵害。\n\n\
  然而，如果我们决定通过 `Object.freeze` 方法使用不可变数据结构来使数组不可变：\n\n```\n1  let immutableItems =\
  \ [\n2   'potion of healing +50hp',\n3   'potion of stamina +10sp',\n4   'potion\
  \ of greater healing +500hp'\n5   ];\n6   Object.freeze(immutableItems);\n```\n\n\
  那么当尝试尝试修改共享数组时：\n\n```\n 1   let theFlyingBoar = new WizardryShopWithStartingItems(immutableItems);\n\
  \ 2   let theLighthouseOfArda = new WizardryShopWithStartingItems(immutableItems);\n\
  \ 3 \n 4   // 我们的英雄急需治疗药水\n 5   // 所以他穿遍城市想要买下这里的每一种治疗药水\n 6   try {\n 7     theFlyingBoar.sellItem('potion\
  \ of greater healing +500hp', 100);\n 8     theLighthouseOfArda.sellItem('potion\
  \ of greater healing +500hp', 100);\n 9   } catch(error) {\n10     console.log(error.message);\n\
  11     // => TypeError: Cannot add/remove sealed array elements\n12     // 注意冻结对象仅在严格模式下抛出异常\n\
  13   }\n```\n\n我们就会收到警告，发现两家商店都在尝试修改同一个数据结构。这有助于防止我们上面讨论的恶性 Bug，并让我们采取额外的措施来确保修改操作封装在商店内部。例如，它会提示我们克隆初始物品数组的必要性：\n\
  \n```\n 1 class WizardryShopWithStartingItems {\n 2   constructor(items){\n 3  \
  \   this.items = clone(items);    // <== 可能的解决方案\n 4     this.coins = 0;\n 5   \
  \  this.sales = [];\n 6   }\n 7   // 等\n 8 }\n 9 \n10 function clone(arr){\n11 \
  \  return arr.slice(0, arr.length -1));\n12 }\n```\n\n不可变对象具有线程安全的优势，这在我们如今日益生活的并行计算世界中是非常棒的（虽然对于单线程的\
  \ JavaScript 来说这并不是大用例，但无论如何知道它是好的）。\n\n我们将在本书的后续部分详细讨论不可变性，包括 JavaScript 中不可变数据的挑战，并介绍\
  \ [immutable.js](https://facebook.github.io/immutable-js/)。\n\n### 总结\n\n函数式编程是一种范式，它通过增加预测性并使用关注“做什么”而非“怎么做”的声明式风格，使你的程序变得更简单并更具可读性。\n\
  \n函数式编程围绕的核心思想是：通过函数创建抽象来解决编程问题，然后组合这些函数以创建更多高级的抽象，并解决更具挑战性的问题。因此，它高度依赖于*函数作为语言的一等公民*的理念，即函数可以存储在变量中、被传递或从另一个函数返回。\n\
  \n接收一个或多个函数作为参数并/或返回另一个函数的函数称为`高阶`函数。我们之前通过 `reduce` 和 `addX` 看到过这类函数的例子。\n\n`纯函数`也是函数式编程中的一个重要概念。纯函数的结果仅由其输入决定，且没有副作用。使用这种函数会产生非常易于追踪且易于测试的代码库。\n\
  \n与*纯性*概念相关的是*不可变*数据的理念。使用*不可变数据*可以让你确保没有函数会篡改你的数据，从而减少副作用和耦合。我们通过两家库存使用相同数组初始化的魔法商店说明了这种耦合问题。\n\
  \n最后，我们讨论了`闭包`，这是在使用*高阶函数*时的一种常用技术。闭包是捕获了其词法作用域内自由变量值的函数。\n\n通过这次介绍，你现在应该已经熟悉最常见的函数式编程概念和思想。在本书这一部分的后续章节中，我们将通过更多函数式编程实践示例来强化这些概念，并提供关于如何在当今应用程序中使用函数式编程的建议。\n\
  \n### 做研究\n\n*   学习函数式编程的一种极佳方法是查看函数式编程。\n\n\n\n\n\n用例子来理解会更容易。例如，我们将 `f` 替换为 `filter`（或\
  \ LINQ 中的 `Where`），并将 `g` 替换为任意谓词，例如 `x => x.status === 'poisoned'`：\n\n```\n 1\
  \ var hobbits = [{name: 'Frodo', status: 'poisoned'},\n 2                {name:\
  \ 'Sam', status: 'poisoned'},\n 3                {name: 'Bilbo', status: 'healthy'}];\n\
  \ 4 filter(hobbits, /* predicate */ h => h.status === 'poisoned')\n 5 //  \n 6 //\
  \   1\\. 将谓词应用于数组的每个元素 [ true, true, false ]\n 7 //   2\\. 选取满足条件的元素 [{name:'Frodo',...},\
  \ {name: 'Sam',...}]\n 8 //\n9 // => [{name: 'Frodo', status: 'poisoned'},\n10 //\
  \     {name: 'Sam', status: 'poisoned'}]\n```\n\n事实证明 `Array.prototype` 有一个 `filter`\
  \ 函数。我们可以利用它来定义以下 `cureAll` 方法，让我们能够治愈中毒的个体：\n\n```\n1 function cureAll(companions){\n\
  2   companions\n3     .filter(companion => companion.status === 'poisoned')\n4 \
  \    .forEach(cure); // cure 定义在其他地方\n5 }\n6 cureAll([Frodo, Sam, Pippin, Merry])\n\
  7 // => 你成功治愈了 Frodo, Sam, Pippin 和 Merry 的中毒！\n8 // => 干得！\n```\n\n在这个示例中，你可以看到\
  \ `cureAll` 函数如何将谓词 `x => x.status === 'poisoned'` 应用于 `companions` 数组的每个项，以便在调用\
  \ `cure` 方法之前对其进行过滤。\n\n当你稍微离开面向对象编程（OOP）的世界，离开对象以及它们典型的[每条信息的微语言](http://bit.ly/microlanguage)时（在那个世界里，你需要特定的微语言来与每个独立的对象进行交流或交互，由其接口定义），当你开始转向一个单一的数据结构（如集合）以及一组可以操作该相同数据结构的函数时，你可以在代码的可重用性、灵活性、可读性和一致性方面获得非常有趣的结果。\n\
  \n> 最好让 100 个函数在一个数据结构上操作，而不是 10 个函数在 10 个数据结构上操作。 - Alan J. Perlis [编程格言](http://bit.ly/epigrams-programming)\n\
  \n这就是 LINQ 的核心所在：获取一个项集合，对其执行任意转换，最终以你所需的形式和形状获取信息。让我们看看如何在 JavaScript 中实现 LINQ。\n\
  \n### 使用 Array 原型方法的 LINQ\n\n在书的数据结构部分，我们讨论了 JavaScript 数组是你可以找到的最多功能数据结构。除了可以作为数组、队列或栈之外，`Array.prototype`\
  \ 还提供了几种方法，让你能够以与 LINQ 极其相似的方式对数组元素执行操作。例如：\n\n* `map`，就像 LINQ 中的 `Select`，让你有可能对数组的每个元素执行转换，并创建一个包含这些转换结果的新数组。\n\
  \n* `filter`，就像 `Where`，允许你根据你选择的谓词过滤数组元素。\n\n* `some`，就像 `Any`，当数组包含满足给定谓词或条件的项时返回\
  \ `true`。\n\n你可以像在 LINQ 方法语法中使用一样使用这些方法中的任何一个。假设我们有一个由以下构造函数和原型对表示的 `Minion` 类：\n\
  \n```\n1 function Minion(type, hp){\n2   this.type = type;\n3   this.hp = hp ||\
  \ 100;\n4 }\n5 Minion.prototype.isAlive = function(){ return this.hp > 0; }\n6 Minion.prototype.toString\
  \ = function(){ return this.type; }\n```\n\n我们可以定义一个强大的函数 `castMany`，让我们能够同时对许多个体施加任意咒语：\n\
  \n```\n1 function castMany(spell, minions){\n2     minions\n3       .filter(function(minion){\
  \ return minion.isAlive();})\n4       .forEach(spell);\n5 }\n```\n\n我们可以配合流行的 `stokeSkin`\
  \ 咒语使用它，当你计划去海滩时这总是很棒：\n\n```\n 1 function stokeSkin(minion){\n 2     console.log('all\
  \ of the sudden the ' + minion + \"'s skin appears hard as rock (+\\\n 3 2 constitution)\"\
  );\n 4 }\n 5 \n 6 castMany(stokeSkin, [new Minion('orc'), new Minion('troll'), new\
  \ Minion('bunny'), ne\\\n7 w Minion('Ghould', /* hp */ -100)]);\n 8 \n 9 /*\n10\
  \ => all of the sudden the orc's skin appears hard as rock (+2 constitution)\n11\
  \ => all of the sudden the troll's skin appears hard as rock (+2 constitution)\n\
  12 => all of the sudden the bunny's skin appears hard as rock (+2 constitution)\n\
  13 */\n```\n\n如果你喜欢 `LINQ` 的方法命名，你可以像这样扩展 `Array.prototype` 来轻松创建别名：\n\n```\n1 Array.prototype.select\
  \ = Array.prototype.map;\n2 Array.prototype.any = Array.prototype.some;\n3 Array.prototype.where\
  \ = Array.prototype.filter;\n4 Array.prototype.first = Array.prototype.find;\n5\
  \ Array.prototype.aggregate = Array.prototype.reduce;\n6 // 等等\n```\n\n得益 JavaScript\
  \ 的原型继承，所有数组现在都将暴露这些新方法。因此，你可以如下重写 `castMany` 函数：\n\n```\n1 function castMany(spell,\
  \ minions){\n2     minions\n3       .where(function(minion){ return minion.isAlive();})\n\
  4       .forEach(spell);\n5 }\n```\n\n如果用箭头函数代替匿名函数表达式，同样的示例将变得更加易读且简洁：\n\n```\n\
  1 function castMany(spell, minions){\n2     minions\n3       .where(minion => minion.isAlive())\n\
  4       .forEach(spell);\n5 }\n```\n\n就像我们使用 `where` 和 `forEach` 一样，我们可以同样容易地使用\
  \ `select`：\n\n```\n1 function describe(minions){\n2   var description = minions\n\
  3      .select(m => m.type)   // map\n4      .join(', ');\n5   console.log(`These\
  \ are the minions in your army: ${description}`);\n6\n7 describe(minions);\n8 //\
  \ These are the minions: orc, troll, bunny, Ghoul\n```\n\n或者 `aggregate`：\n\n```\n\
  1 function getArmy(minions){\n2   var armySize = minions\n3       .select(m => m.hp)\n\
  4       .aggregate((a,hp) => a + hp, 0);\n5   return armySize;\n6 }\n7 var sizeOf\
  \ = getArmy(minions);\n8 console.log(`My army has a total of ${sizeOf} hp`);\n9\
  \ // my army has a total of 400\n```\n\n此外，需要注意的是，虽然 `filter` 和 `find` 方法是 ES6 的一部分，但大多数这些类\
  \ LINQ 的方法都是可用的。在这里你可以看到不同方法的完整列表。\n\n### Array.Prototype 类 LINQ 方法速查表\n\n| 方法名\
  \ | 超能力 | ES 版本 |\n| --- | --- | --- |\n| `Array.forEach(f, [thisArg])` | 为数组的每个元素调用函数\
  \ `f`。 | ES5 |\n| - `[1,2].forEach(n => console.log(n))` | | |\n| `// => 1` | |\
  \ |\n| `// => 2` | | |\n| `Array.every(f, [thisArg])` | 如果数组中的每个元素都满足给定条件 (`f`)\
  \ 则返回 `true`，否则返回 `false`。 | ES5 |\n| - `[1,2].every(n => n < 3)` | | |\n| `// =>\
  \ true` | | |\n| `Array.some(f, [thisArg])` | 如果数组中的任何元素满足给定条件 (`f`) 则返回 `true`，否则返回\
  \ `false`。 | ES5 |\n| - `[1,2].some(n => n < 3)` | | |\n| `// => true` | | |\n|\
  \ `Array.filter(f, [thisArg])` | 返回一个新数组，该数组包含原数组中满足给定条件 (`f`) 的元素。 | ES6 |\n| -\
  \ `[1,2].filter(n => n < 2)` | | |\n| `// => [1]` | | |\n| `Array.find(f, [thisArg])`\
  \ | 返回数组中第一个匹配给定条件 (`f`) 的元素，如果没有匹配项则返回 `undefined`。 | ES6 |\n| - `[1,2,1].find(n\
  \ => n < 3)` | | |\n| `// => 1` | | |\n| `Array.findIndex(f, [thisArg])` | 同上，但它返回匹配元素在数组中的索引，如果没有找到匹配项则返回\
  \ `-1`。 | ES6 |\n| `Array.map(f, [thisArg])` | 返回一个新数组，其结果是在原数组的每个元素上调用函数 `f` 得到的。\
  \ | ES5.1 |\n| - `[1, '2 dogs'].map(n => parseInt(n))` | | |\n| `// => [1, 2]` |\
  \ | |\n\n\n\n\n\n| `Array.reduce(f, [initialValue])` | 调用函数 `f` 并提供累加器和原始数组中的每个元素。累加器的初始值默为\
  \ `0`，也可以参数提供。 | ES5.1 |\n| - `[1,2].reduce((a,b) => a+b)` | | |\n| `// => 3` |\
  \ | |\n| `Array.reduceRight(f, [initialValue])` | 与上述相同，但是从右到左遍历原始数组的元素。 | ES5.1\
  \ |\n\n这些方法中提供的每个函数具有相同的签名：\n\n```\n1 function(currentElement, index, array){}\n\
  ```\n\n例如：\n\n```javascript\n1 [1, '2 dogs'].map(n => parseInt(n))\n```\n\n等同于：\n\
  \n```javascript\n1 [1, '2 dogs'].map(function(currentElement, index, array) {\n\
  2     return parseInt(currentElement);\n3 });\n4 // => [1, 2]\n```\n\n除了 `reduce`\
  \ 和 `reduceRight` 函数外，其他函数也接受累加器作为参数：\n\n```\n1 function(accumulator, currentElement,\
  \ index, array){}\n```\n\n其中 `accumulator` 是函数上一次调用的返回值：\n\n```javascript\n1 [1,2].reduce(function(accumulator,\
  \ currentElement, index, array){\n2     return accumulator + currentElement;\n3\
  \ }, /* initialValue*/ 0);\n4 // => 3\n```\n\n这就是你如何在 JavaScript 中实现 LINQ 的！或者等一下……\n\
  \n### 使用 ES6 生成器的 LINQ 延迟执行\n\n之前有一件事我漏告诉你们了。`Array.prototype` 方法在被调用时就会执行，因此一旦方法被调用，每个过滤器、每次转换都会在数组的每个项上立即执行。这意味着，当你使用这些\
  \ `Array.prototype` 方法时，并没有像 LINQ 中那样的[延迟执行](http://bit.ly/deferred-execution-linq)概念。\n\
  \n或者说以前没有……ES6 生成器 为 JavaScript 引入了 `yield` 关键字和延迟求值。让我们通过一个示例来看它们的运行情况。\n\n我们首先使用\
  \ `linq` 生成器对数组的迭代进行封装：\n\n```javascript\n1 // * 号标识此函数为生成器\n2 function *linq(array){\n\
  3   for (let item of array){\n4     yield item;\n5   }\n6 }\n```\n\n并使用生成器创建类似 `where`\
  \ 或 `select` 的 LINQ 方法：\n\n```javascript\n 1 function *where(predicate){\n 2   for(let\
  \ item of this){\n 3     if (predicate(item)) {\n 4       yield item;\n 5     }\n\
  \ 6   }\n 7 }\n 8 \n 9 function *select(transform){\n10   for (let item of this){\n\
  11     yield transform(item);\n12   }\n13 }\n```\n\n如果有一种方法可以实例化 LINQ 查询就好了，因此我们定义了\
  \ `toList` 方法，利用扩展运算符遍历整个生成器并产生结果：\n\n```javascript\n1 function toList(){\n2   return\
  \ [...this];\n3 }\n```\n\n现在我们需要创建一个像 LINQ 一样工作的流式接口。为了做到这一点，我们创建一个名为 `linqable`\
  \ 的混入（mixin）来封装所有的 LINQ 方法：\n\n```javascript\n1 // 使用 linq-able 混入来封装 linq 生成器\n\
  2 let linqable = {where, select, toList};\n```\n\n并为每个生成器的原型增强 LINQ 功能：\n\n```javascript\n\
  1 // 为每个生成器增强 linq 功能\n2 // 以提供熟悉的流式 API\n3 Object.assign(/* target */ linq.prototype,\
  \ linqable)\n4 Object.assign(where.prototype, linqable)\n5 Object.assign(select.prototype,\
  \ linqable)\n```\n\n哒哒！我们有了自己的带有延迟执行的 LINQ 版本。让我们来试用一下：\n\n```javascript\n 1 var\
  \ minions = [\n 2{name: 'orc', hp: 100},\n 3{name: 'troll', hp: 40},\n 4{name: 'bunny',\
  \ hp: 1},\n 5{name: 'skeleton', hp: 31},\n 6{name: 'peon', hp: 10}];\n 7 \n 8 var\
  \ query = linq(minions)\n 9   .where(m => m.hp > 30)\n10   .select(m => m.name);\n\
  11 \n12 // 查询尚未执行\n13 console.log(`It's value is: ${query}`);\n14 // => It's value\
  \ is [object Generator]\n15 // 此时它是一个生成器，等待被迭代\n16 \n17 // 我们可以通过迭代生成器来实例化查询\n18\
  \ console.log(`It's value is: ${query}`);\n19 // => It's value is [object Generator]\n\
  20 // 此时它是一个生成器，等待被迭代\n```\n\n\n\n如果你仔细观察链（chain）产生的对象，你会发现它是一个特殊的下划线对象（underscore\
  \ object）。无论如何，链在定义后就会被求值：\n\n```\n 1 // 以及第二个示例...\n 2 var minions = [\n 3   new\
  \ Minion (/*name:*/ 'orc', /*hp:*/ 100),\n 4   new Minion ('troll', 40),\n 5   new\
  \ Minion ('bunny', 1),\n 6   new Minion ('skeleton', 31),\n 7   new Minion ('peon',\
  \ 10)];\n 8 \n 9 var healthyMinions = _.chain(minions)\n10   .filter(m => {\n11\
  \       console.log('calling this function with: ' + m);\n12       return m.hp >\
  \ 30;\n13   })\n14   .map(m => m.type);\n15 // => calling this function with: orc\n\
  16 //    calling this function with: troll\n17 //    calling this function with:\
  \ bunny\n18 //    calling this function with: skeleton\n19 //    calling this function\
  \ with: peon\n20 \n21 // 让我们看看 healthyMinions 到底是什么：\n22 console.log(healthyMinions);\n\
  23 // => w {_wrapped: Array[3], _chain: true}\n24 // hmm 某种类型的下划线包装对象 :)\n25 \n\
  26 // 我们可以通过调用 value 来解开它\n27 console.log(healthyMinions.value());\n28 // => [orc,\
  \ troll, skeleton]\n```\n\n我们使用 `value` 方法来解开链的结果，在这个例中，即是健康的小兵。\n\n由于 lodash 是\
  \ underscore 的超集，如果你在这个示例中切换库（只需移除 underscore 并添加 lodash），它将可以运行……或者几乎可以。虽然 lodash\
  \ 看起来和 underscore 非常相似，但它的工作方式略有不同。其中，lodash 内置了延迟求值（deferred evaluation），也就是说，在未通过\
  \ `value` 解开之前，链不会被求值。这就是为什么 `castMany` 函数需要重写，以添加一个显式的 `value` 调用：\n\n```\n1 function\
  \ castMany(spell, minions){\n2   // underscore 链允许你将\n3   // 方法调用链在一起\n4   _.chain(minions)\
  \            // 以 minions 数组开始链\n5     .filter(m => m.isAlive()) // 过滤出活着的个体\n6\
  \     .each(spell);              // 在每个项目上调用 spell 函数\n7 }\n```\n\n你可以在下面的代码片段中看到延迟求值的效果：\n\
  \n```\n 1 // 现在是使用 lodash 的相同示例\n 2 var mightiestMinions = _.chain(minions)\n 3\
  \   .filter(m => { \n 4       // 在调用 value 之前，链不会被求值\n 5       // 这是获取延迟求值的另一种方式\n\
  \ 6       console.log('calling this function with: ' + m);\n 7       return m.hp\
  \ > 30;\n 8   })\n 9   .map(m => m.type;);\n10 \n11 // 链还没有被求值。\n12 // 让我们看看 mightiestMinions\
  \ 到底是什么：\n13 console.log(mightiestMinions);\n14 // => zt {__wrapped__: Ut, __actions__:\
  \ Array[0], \n15 //        __chain__: true, __index__: 0, __values__: undefined}\n\
  16 \n17 // hmm 某种类型的 lodash 包装对象 :)\n18 // 看看！！！我最强壮的小兵：\n19 console.log(mightiestMinions.value());\n\
  20 // => calling this function with: orc\n21 //    calling this function with: troll\n\
  22 //    calling this function with: bunny\n23 //    calling this function with:\
  \ skeleton\n24 //    calling this function with: peon\n25 //    [orc, troll, skeleton]\n\
  ```\n\n此外，你可以用 lodash 做的一件酷酷的事情是 underscore 中做不到的，那就是隐式链（implicit chaining），即直接将任何数组包装在\
  \ lodash 对象中并在上面应用 lodash 方法：\n\n```\n 1 var mightiestMinionsWithoutChain = _(minions)\n\
  \ 2   .filter(m => {\n 3       // 在调用 value 之前，链不会被求值\n 4       // 这是获取延迟求值的另一种方式\n\
  \ 5       console.log('calling this function with: ' + m);\n 6       return m.hp\
  \ > 30;\n 7   })\n 8   .map(m => m.type)\n 9   .value();\n10 // => calling this\
  \ function with: orc\n11 //    etc...\n```\n\n如果你尝试在 underscore 中 true 这样做，`filter`\
  \ 方法将直接返回一个原生数组而不是下划线对象，你的程序将抛出异常。\n\n除了 `underscore` 和 `lodash` 这两个*事实标准*之外，还有其他可能值得关注的库：\n\
  \n*   **[linq.js](https://linqjs.codeplex.com/)** 是直接移植到 JavaScript 的 LINQ，它将带给你所能找到的最像\
  \ LINQ 的体验。\n*   **[wu.js](https://fitzgen.github.io/wu.js/)** 是一个利用 ES6 (ES2015)\
  \ 迭代器和生成器的库。使用迭代器和生成器可以获得真正的、原生的延迟求值，并能自动与新的 ES6 特性（如 `for/of` 循环和展开运算符）集成。\n* \
  \  **[ramda.js](http://ramdajs.com/0.21.0/index.html)** 是另一个类似于 LINQ 的库，侧重于函数式编程、纯函数和不可变性。\n\
  \n### 总结\n\nLINQ 绝对太棒了，是神灵赐给我们这些凡人的礼物，让我们能够编写出优美的代码。现在你知道如何直接在 JavaScript 中利用 LINQ\
  \ 了：\n\n*   你可以使用 `Array.prototype` 方法来实现原生的类 LINQ 的功能。**优点是**，由于它们是原生的，你可以假设它们会比非原生实现更快，而且不需要你添加任何额外的库。**缺点是**，方法并不多，其中某些方法仅在\
  \ ES5 可用，另一些在 ES6 可用，因此取决于你针对的浏览器，支持程度各不相同。它们在被调用时就会被执行，所以你无法获得延迟求值。\n*   ES6 `generators`（生成器）允许你在组合中加入延迟求值。了解生成器的工作原理很有用，但你可能不想自己编写并维护一套\
  \ LINQ 的实现，相反，你可能想……\n*   使用 JavaScript 生态系统中的许多库之一。[Underscore](http://underscorejs.org/)\
  \ 和 [lodash](https://lodash.com) 是最流行的，但还有一个名为 [linq.js](https://linqjs.codeplex.com/)\
  \ 的 LINQ 移植版，以及像 [wu.js](https://fitzgen.github.io/wu.js/) 这样支持 ES6 迭代器和生成器的新库，以及具有强大函数式背景的\
  \ [ramda.js](http://ramdajs.com/0.21.0/index.html)。**优点是**，这些库中的任何一个提供的功能都比 `Array.prototype`\
  \ 方法多得多，它们在许多浏览器中行为一致，并且在原生 API 存在时通常会提供[补丁 (polyfills)](https://en.wikipedia.org/wiki/Polyfill)\
  \ 并回退到它们。**缺点是**，它们是你需要管理的额外依赖，也是需要学习的新库。\n\n在下一章中，你将学习函数式编程的真正力量：创建小的可重用函数并将其*无限地*组合在一起，以非常简单的方式解决复杂问题。\n\
  \n### 附录. 使用 ES.Next 推导式的 LINQ 查询语法\n\nES.Next 可能带来的一种超级实用的功能是推导式（comprehensions）。它们为操作数组（或[任何迭代数据结构](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Iterators_and_Generators））提供了一种查询式的语法。如果你熟悉\
  \ Python、Ruby 或 CoffeeScript，你可能遇到过推导式。它们看起来像：\n\n```\n1 var healthyMinions = [for\
  \ (m of minions)\n2                        if (m.isAlive && m.hp > 50)\n3      \
  \                    m];\n4 \n5 console.log(healthyMinions);\n6 console.log(\"看！这些都是我健康的小兵!\"\
  , healthyMinions);\n7 // => 看！这些都是我健康的小兵！ [{\"type\": \"bunny\", \"hp\": 100}]\n\
  ```\n\n当你处理嵌套集合时，它们会变得更有趣：\n\n\n\n\n\n```javascript\nvar fortresses = [\n  {name:\
  \ \"Castle Doom\",\n   minions: [{name: \"troll\", type: \"elite\", hp: 1000},\n\
  \              {name: \"orc\", type: \"normal\", hp: 50},\n              {name:\
  \ \"warg\", type: \"normal\", hp: 100}]\n  },\n  {name: \"Fortress Of Solitude\"\
  ,\n    minions: [{name: \"superman\", type: \"hero\", hp: 99999}]\n  },\n  {name:\
  \ \"GreySkull\",\n    minions: [{name: \"He-Man\", type: \"elite\", hp: 5000}]\n\
  \  },\n  {name: \"Cave\",\n    minions: [{name: \"TheGrue\", type: \"elite\", hp:\
  \ 10000}]\n  }\n];\n\n// you can also traverse nested collections\nvar eliteMinions\
  \ = [for (f of fortresses)\n                      for (m of f.minions)\n       \
  \                 if (m.type == \"elite\")\n                          m];\nconsole.log(\"\
  Behold! My minions!: \", eliteMinions);\n// => Behold! My minions!: [{\"name\":\
  \ \"troll\", \"type\": \"elite\", ....\n```\n\n此外，[ES.next 可能还会带来生成器推导式](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Generator_comprehensions)，它们看起来像数组推导式，但使用的是括号\
  \ `(<my comprehension here>)` 而不是方括号 `[]`。它们的行为与数组推导式相同，但具有延迟求值。\n\n### 做些研究！\n\n\
