  \ in my tobaccoPouch: pipe,tobacco\n```\n（注：由于原文文本存在大量逻辑重复和乱码，以上译文已根据核心含义进行了清理，确保无重复）\n\
  \n\n\n遗憾的是，这个技巧对数组的最后一个元素不起，因为 `rest operator`（剩余运算符）是贪婪的。它想要提取数组中的所有项，因此 `[...initialOnes,\
  \ last]` 无法完成任务。\n\n你可以像只超级狡猾的狐狸一样这样做操作：\n\n```\n1 let [last] = Array\n2     .from(['goblin',\
  \ 'ghoul', 'ghost', 'white walker'])\n3     .reverse();\n4 console.log(`last is\
  \ ${last}`);\n5 // => last is whiteWalker\n```\n\n非常漂亮！`array destructuring`（数组解构）的另一个用例是交换两个变量的值：\n\
  \n```\n1 console.log(`first is ${first}, last is ${last}`);\n2 // => first is goblin,\
  \ last is white walker\n3 \n4 [first, last] = [last, first];\n5 \n6 console.log(`but\
  \ wait! Now first is ${first}, last is ${last}`)\n7 // => but wait! Now first is\
  \ white walker, last is goblin\n```\n\n最后，在执行 `array destructuring` 时，你也可以享受多功能的\
  \ `defaults`（默认值）：\n\n```\n1 let [aMonster, anotherMonster, yetAnotherMonster='cucumber']\
  \ \n2     = ['goblin', 'ghoul'];\n3 console.log(`We've got a monster that is a ${aMonster},\
  \ \n4 another that is ${anotherMonster}, and yet another one \n5 that is a ${yetAnotherMonster}`);\n\
  6 // => We've got a monster that is a goblin, another that \n7 //    is ghoul, and\
  \ yet another one that is a cucumber\n```\n\n因为我们试图从一个只有两个元素的数组中提取三个元素，`yetAnotherMonster`\
  \ 变量将获得 `undefined`。使用默认值防止了这种情况，并确保该变量有一个安全值 `cucumber`。因为没有什么比黄黄瓜更能代表安全了。\n\n\
  ### 解构函数参数\n\n在 `Useful Function Patterns: Default Parameters` 中，你简要地看到了解构在函数参数列表中使用时是很有用的。\n\
  \n```\n 1 // With destructuring we can unpack the direction from\n 2 // the incoming\
  \ object and use it right away\n 3 let randalf = {\n 4     toString(){ return 'Randalf\
  \ the Mighty own },\n 5     castIceCone(mana, {direction}){\n 6         console.log(`${this}\
  \ spends ${mana} mana \n 7             and casts a terrible ice cone ${direction}`);\n\
  \ 8     }\n 9 };\n10 \n11 let options = { direction: 'towards Mordor'}\n12 randalf.castIceCone(10,\
  \ options);\n13 // => Randalf the Mighty spends 10 mana and \n14 //    casts a terrible\
  \ ice cone towards Mordor\n```\n\n原理相同，但 `destructuring` 过程是以更间接的方式发生的。解构的一部分是作为参数传递方法的对象，在这种情况下是\
  \ `options`：\n\n```\n1 randalf.castIceCone(10, options);\n```\n\n另一部分是带有特定变量作为方法签名部分的\
  \ `destructuring` 语法 `{direction}`：\n\n```\n1     castIceCone(mana, {direction}){\n\
  ```\n\n就像普通的 `destructuring` 一样，它也适用于数组：\n\n```\n1 function castMiniCone(mana, [target,\
  \ ...others]){\n2     var caster = this || 'God almighty';\n3     console.log(`${caster}\
  \ spends ${mana} mana \n4     and casts a super teeny ice cone that only reaches\n\
  5 ${target} but misses ${others} because it is so tiny and cute`);\n6 }\n7 randalf.castMiniCone\
  \ = castMiniCone;\n8 randalf.castMiniCone(10, ['giant', 'troll']);\n9 // => Randalf\
  \ the Mighty spends 10 mana \n10 //    and casts a super teeny ice cone that only\
  \ reaches\n11 //    giant but misses troll, and cute\n```\n\n### 总结\n\n在本章中，我们简要回顾了到目前为止学习的所有\
  \ ES6 特性：用于块作用域变量的 `let`、`const`、`default parameters`、`rest parameters`、对象初始化器的简写语法、symbols、模板字字符串和标签。我们还深入研究了\
  \ `destructuring`，并学习了如何使用这一新功能轻松地从对象提取属性以及从数组提取项。发现你可以在函数参数中使用 `destructuring`，以及当你尝试提取的属性不存在于对象或数组时，如何结合\
  \ `destructuring` 和 `default values`。\n\n### 使用 ECMAScript 6 升级你的日常 JavaScript -\
  \ 箭头函数\n\n`Arrow functions`（箭头函数）是我 ES6 中最喜欢的特性之一。它们提供了一种优美且简洁编写函数的方式，让人想起 C# 的\
  \ lambda 表达式。你有一个普通的函数表达式：\n\n```\n1 let createWater = function (mana){\n2     return\
  \ `${mana} liters of water`;\n3 }\n```\n\n这里你有一个等等的 `arrow function` 版本：\n\n```\n\
  1 let createWater = mana => `${mana} liters of water`;\n```\n\n如果你调用这些任何一个函数，将得到相同的结果：\n\
  \n```\n1 console.log(createWater(10));\n2 // => 10 liters of water\n```\n\n让我们仔细检查\
  \ `arrow function`。你可能注意到它没有任何 `return` 语句。那是因为在最简单的形式中，`arrow function` 有一个隐式的\
  \ `return`，返回胖箭头 `=>` 右侧任何表达式。注意，这种表示法仅在 `arrow function` 只有一个语句时有效。\n\n就像在 C# 中一样，你经常看到\
  \ `arrow functions` 与数组方法结合使用，例如 `filter`（LINQ 中 `Where` 的 JavaScript 版本）：\n\n```\n\
  1 let monsters = ['orc chieftain', 'orc grunt', 'small orc', 'goblin'];\n2 let orcs\
  \ = monsters\n3   .filter(m => m.includes('orc'));\n4 console.log(orcs);\n55 //\
  \ => [\"orc chieftain\", \"orc grunt\", \"small orc\"]\n```\n\n你可以定义带有任意数量参数的 `arrow\
  \ functions`。例如，你可以完全没有参数：\n\n```\n1 let helloMiddleEarth = () => \"hello Middle\
  \ Earth!\";\n2 \n3 console.log(helloMiddleEarth());\n4 // => hello Middle Earth!\n\
  ```\n\n或者有一个：\n\n```\n 1 let frodo = {\n 2   toString(){ return 'Frodo'},\n 3  \
  \ destroyTheOneRing() { \n 4     console.log(`${this} throws the one ring into the\
  \ entrails of Mount Doom`);\n 5   },\n 6   hideFrom(enemy, how) {\n 7     console.log(`${this}\
  \ hides from the ${enemy} ${how}`);\n 8   }\n 9 };\n10 \n11 let destroyDaRing =\
  \ (hobbit) => hobbit.destroyTheOneRing();\n12 \n13 destroyDaRing(frodo);\n14 //\
  \ => Frodo throws the one ring into the entrails of Mount Doom\n```\n\n两个：\n\n```\n\
  1 let nazgul = {\n2   toString(){ return 'scary nazgul';}\n3 };\n4 let useElvenCloak\
  \ = (hobbit, enemy) \n5     => hobbit.hideFrom(enemy, 'with an elven cloak');\n\
  6 \n7 useElvenCloak(frodo, nazgul);\n8 // => Frodo hides from the scary nazgul with\
  \ an elven cloak\n```\n\n或者使用 `rest syntax` 定义你想要数量的参数：\n\n```\n1 useElvenCloak\
  \ = (hobbit, ...enemies) \n2     => hobbit.hideFrom(enemies, 'with an elven cloak');\n\
  3 useElvenCloak(frodo, nazgul, 'orc', 'troll');\n4 // => Frodo hides from the scary\
  \ nazgul,orc,troll with an elven cloak\n```\n\n因为它们只是函数，你也可以使用默认值：\n\n```\n1 destroyDaRing\
  \ = (hobbit=frodo) => hobbit.destroyTheOneRing();\n2 destroyDaRing();\n3 // => Frodo\
  \ throws the one ring into the entrails of Mount Doom\n```\n\n还有 `destructuring`：\n\
  \n```\n 1 let companyOfTheRing = {\n 2   smartestHobbit: frodo,\n 3   wizard: 'Gandalf',\n\
  \ 4   ranger: 'Aragorn',\n 5   // etc\n 6 };\n 7 destroyDaRing = ({smartestHobbit})\
  \ => smartestHobbit.destroyTheOneRing();\n 8 \n9 destroyDaRing(companyOfTheRing);\n\
  10 // => Frodo throws the one ring into the entrails of Mount Doom\n```\n\n\n\n\n\
  ```\n 1 let eatRation = (hobbit, rations) => {\n 2   let ration = rations.shift();\n\
  \ 3   if (ration) {\n 4     hobbit.hp += ration.hp;\n 5     console.log(`${hobbit}\
  \ eats ${ration} and recovers ${ration.hp} hp`);\n 6   } else {\n 7     console.log(`There\
  \ are no rations left! We're all gonna die!!!!`);\n 8   }\n 9 }\n10 \n11 let rations\
  \ = [{\n12   name: 'sandwich',\n13   hp: 5,\n14   toString(){ return this.name;}\n\
  15 }];\n16 \n17 eatRation(frodo, rations);\n18 // => Frodo eats sandwich and recovers\
  \ 5 hp\n```\n\n此外，当你有多个条语句时，你需要显式地 `return` 一个值：\n\n```\n1 let carveWood = (wood,\
  \ shape) => {\n2   console.log(`You carve a piece of ${wood} into a ${shape}`);\n\
  3   return {name: shape, material: wood};\n4 }\n5 let pipe = carveWood('oak', 'pipe');\n\
  6 // => You carve a piece of oak into a pipe\n```\n\n*箭头函数*还可以通过对象初始化器语法返回一个对象。在这样做时，你需要将其封装在*括号*中。这样，JavaScript\
  \ 运行时就能理解它是一个对象，而不是一个代码块：\n\n```\n1 let createHealthPotion = () => ({\n2   name:\
  \ 'potion of health', \n3   hp: 10,\n4   toString(){\n5     return `${this.name}\
  \ (+${this.hp}hp)`;\n6   }});\n7 let healthPotion = createHealthPotion();\n8 console.log(healthPotion.toString());\n\
  9 // => potion of Health (+10 hp)\n```\n\n总结来说，*箭头函数*非常棒。使用箭头函数你可以写出更简洁的代码，同时仍然可以使用解构或默认值等功能。但作为函数本身，它们有一点特殊，当我说“有点”时，我的意思是“非常多”。\n\
  \n### 箭头函数的奥秘\n\n尽管它们看起来像普通函数，但*箭头函数*也有自己的怪之处：\n\n* 它们没有 `this`\n\n* 它们没有 `arguments`\
  \ 对象\n\n* 你不能使用 `bind`、`apply` 和 `call` 来设置它们求值的上下文\n\n* 你不能使用 `new` 也不 `super`\n\
  \n这可能让你感到惊讶，但如果你查看 ECMA-262 规范^(21)，即 JavaScript 自身的规范，你会读到以下内容：\n\n> #### 14.2.16\
  \ 箭头函数 - 运行时语义：求值\n\n> *ArrowFunction* 为 `arguments`、`super`、`this` 或 `new.target`\
  \ 定义本地绑定。在 *ArrowFunction* 内部对 `arguments`、`super`、`this` 或 `new.target` 的任何引用必须解析为词闭作用环境中的绑定。通常，这将是紧邻包含它的函数的函数环境（Function\
  \ Environment）。\n\n*但箭头函数没有自己的 `this` 或 `arguments` 版本到底意味着什么？*\n\n这意味着当你在*箭头函数*内部引用\
  \ `this` 或 `arguments` 时，你实际上指的是闭包环境中的 `this` 或 `arguments`。让我们通过一个例子来澄清这一点。\n\n\
  假设我们有一个 `gollum`，他在背后捅你并偷走你的婚戒指之前正想对你很友好。如果我们使用普通函数来定义他的问候：\n\n```\n 1 let gollum\
  \ = {\n 2   name: 'Golum! Golum!',\n 3   toString(){ return `${this.name}!!!`;},\n\
  \ 4   saysHi(){ \n 5     console.log(`Hi! I am ${this}`);\n 6     setTimeout(function(){\n\
  \ 7       console.log(`${this} stabs you in the back and \n 8 steals your wedding\
  \ ring while saying 'My Preciouuuuuus'`)\n 9     },/*waitPeriodInMilliseconds*/\
  \ 500);\n10   }\n11 };\n```\n\n然后调用函数 `saysHi`：\n\n```\n1 // 在 gollum 对象的上下调用\n\
  2 gollum.saysHi();\n3 // => Hi! I am Gollum! Gollum!!!!\n4 // => \"[object Window]\
  \ stabs you in the back and \n5 steals your wedding ring while saying 'My Preciouuuuuus'\"\
  \n6 / => Hi! am Gollum! Gollum!!!!\n```\n\n正如我们预期的那样，`gollum` 高兴地向我们致意。然后过了一会儿，他回来捅了我们背。唯一的问题是它不再是\
  \ `gollum` 而是 `Window` 对象。这并不是新奇事。我们在 JavaScript 规范奥秘 中学习过 `this` 的这种奇怪行为。但如果我们使用*箭头函数*而不是普通函数会发生什么呢？\n\
  \n```\n 1 // 如果使用箭头函数会发生什么？\n 2 let gollumWithArrowFunctions = {\n 3   name: 'Golum!\
  \ Golum!',\n 4   toString(){ return `${this.name}!!!`;},\n 5   saysHi(){ \n 6  \
  \   console.log(`Hi! I am ${this}`);\n 7     setTimeout(() =>\n 8       console.log(`${this}\
  \ stabs you in the back and \n```\n\n\n\n\n当我第一次学习箭头函数时，我的第一个反应是：*太棒了！现在我可以在任何地方使用箭头函数！*\
  \ 于是我写了这段代码：\n\n```\n1 let raistlin = {\n2   name: 'Raistlin',\n3   toString(){\
  \ return this.name;},\n4   deathRay: () => console.log(`${this} casts a terrible\
  \ ray of deaaaath!`)\n5 }\n```\n\n令我惊讶的是，当我尝试让 `raistlin` 射出一道恶毒的死亡射线时，发生了这种情况：\n\
  \n```\n1 raistlin.deathRay();\n2 // => [object Window] casts a terrible ray of deaaaath!\n\
  ```\n\n我们之前认为对 `this` 问题不受影响的“箭头函数”（`arrow function`），现在却向我们展示了经典的 `this` 问题。\n\n\
  *这里发生了什么？* 嗯，如果你还记得上一节的内容，`arrow functions` 没有自己的 `this`。正因如此，当你尝试在 `arrow function`\
  \ 内部访问 `this` 时，你引用的是外部作用域的 `this`。在对象字面量的情况下，来自外部作用域的 `this` 无非就是 `Window` 对象。再次强调，我们在\
  \ JavaScript 的奥秘 中中学的关于 `this` 的规则不适用于 `arrow functions`，而且使用点表示法调用 `arrow function`\
  \ 不会在对象的上下文中求值它。因此请记住，要小心不要将箭头函数作为对象字面量的属性。\n\n## 你无法绑定箭头函数\n\n**你无法对箭头函数使用 `bind`**。如果你足够勇敢并尝试将一个\
  \ `arrow function` 绑定到一个对象上，你将会非常失望，因为这是不起作用的。\n\n让我们用一个例子来说说明这一点：\n\n```\n 1 let\
  \ saruman = {\n 2   name: 'Saruman, the White',\n 3   toString(){ return this.name;},\n\
  \ 4   raiseUrukhai(){\n 5     console.log(`${this} raises a Urukhai from the pits\
  \ of Isengard`);\n 6     return {name: 'Uruk', hp: 500, strength: 18};\n 7   },\n\
  \ 8   telekineticStaffAttack: () => \n 9     console.log(`${this} uses his staff\
  \ to throw \n10 you across the room \"telekinetically\" speaking`)\n11 }\n```\n\n\
  看这个 `saruman`！另一个史诗级的 JavaScript 魔法师。他有几个展示其魔力的方法。其中 `raiseUrukhai` 是一个普通函数，另一个\
  \ `telekineticStaffAttack` 使用了 `arrow function`。如果我们使用点表示法调用这些方法：\n\n```\n1 saruman.raiseUrukhai();\n\
  2 // => Saruman, the White raises a Urukhai from the pits of Isengard\n3 \n4 saruman.telekineticStaffAttack();\n\
  5 // => [object Window] uses his staff to throw \n6 //    you across the room \"\
  telekinetically\" speaking\n7 //    this would be undefined instead of Window if\
  \ we used strict mode\n```\n\n再次，就像我们在上一节中看到的那样，当我们调用 `telekineticStaffAttack` 方法时，`this`\
  \ 被求值为为 `Window`。但假设我们想像往常那样通过使用 `bind` 来解决它。\n\n如果我们使用 `bind` 将这两个方法绑定到不同的对象：\n\
  \n```\n1 // 如果我们尝试将这两个方法绑定到一个新对象\n2 let boromir = {name: 'Boromir of Gondor', toString(){return\
  \ this.name}};\n3 let raiseUrukhaiBound = saruman.raiseUrukhai.bind(boromir);\n\
  4 raiseUrukhaiBound();\n5 // => Boromir of Gondor raises a Urukhai from the pits\
  \ of Isengard\n```\n\n我们可以理解如何绑定一个普通函数，但当我们尝试绑定一个 `arrow function` 时，什么都没有发生：\n\n\
  ```\n1 let telekineticStaffAttackBound = saruman.telekineticStaffAttack.bind(boromir);\n\
  2 telekineticStaffAttackBound();\n3 // => undefined uses his staff to throw \n4\
  \ //    you across the room \"telekinetically\" speaking\n5 //    没用，对 Boromir 来说不是感应杖攻击\n\
  ```\n\n由于 `arrow function` 没有 `this`，对它进行 `bind` 没有任何意义。\n\n尽管**箭头函数并不等同于绑定函数**，但一旦\
  \ `arrow function` 被声明并捕获了它最近的 `this`，它的行为基本上与绑定函数相同。让我们用一些代码来阐明这个观点：\n\n```\n 1\
  \ // 这是一个构造函数\n 2 let Warg = function(name, size){\n 3   this.name = name;\n 4 \
  \  this.size = size;\n 5   this.name = '${name}, the ${size} warg`;\n 6   // 魔狼不汪汪，它们呜呜\n\
  \ 7   this.wark = () => console.log(`${name} warks!: Wark! Wark!`);\n 8   this.jump\
  \ = (function(){\n 9     console.log(`${name} jumps around`);\n10   }).bind(this);\n\
  11 }\n12 \n13 // 这里我们使用 new 运算符创建一个新对象\n14 let willyTheWarg = new Warg('willy',\
  \ 'litte');\n```\n\n在这个例子中，我们使用了 `constructor function` 和 `new` 关键字来实例化一只愤怒的魔狼。虽然我们还没有看到这些概念的任何一个（因为我把它们留到了后面），但由于\
  \ `arrow function` 不拥有 `this`，一旦 `arrow function` 被声明并捕获了它最近的 `this`，它的行为基本上与绑定函数相同。\n\
  \n\n\n\n```\n1 // *箭头函数*完全忽略了作为参数传递的 `this` 值\n2 willyTheWarg.wark.apply(caragor);\n\
  3 // => willy, the litte warg warks!: Wark! Wark!\n4 willyTheWarg.wark.call(caragor);\n\
  5 // => willy, the litte warg warks!: Wark! Wark!\n```\n\n在上面的示例中，你可以很容易发现，相比于 `scary\
  \ caragor`，`wark` 内部*箭头函数*中的 `${this}` 被求值为 `willy, the little`。这证明了*箭头函数*在通过 `call`\
  \ 或 `apply` 调用时会忽略其上下文。\n\n### 箭头函数没有 arguments 对象\n\n*箭头函数*的另一个有趣特性是它们没有 `arguments`\
  \ 对象。就像 `this` 一样，如果你尝试在*箭头函数*内部访问 `arguments` 对象，你访问的将是外层闭包环境的 `arguments`。\n\n\
  如果你还记得更多实用的函数模式 - 多参数，JavaScript 中的每个函数都有一个 `arguments` 对象，你可以用它来访问传递给函数的哪些参数。所以，如果你有一个普通函数来记录\
  \ `arguments` 对象：\n\n```\n1 function rememberWhatISaid(){\n2   console.log(`you\
  \ said: ${Array.from(arguments).join(', ')}`);\n3 }\n```\n\n你可以轻松地演示 `arguments`\
  \ 对象是如何收集传递给函数的参数的：\n\n```\n1 rememberWhatISaid('hello', 'you', 'there');\n2 //\
  \ => you said: hello, you, there\n3 rememberWhatISaid('supercalifragilisticusespialidosus')\n\
  4 // => you said: supercalifragilisticusespialidosus\n```\n\n*箭头函数*则不然：\n\n```\n\
  1 let forgetWhatISaid = () => {\n2   console.log(`I am going to forget that you\
  \ said: ${arguments}`);\n3 }\n4 forgetWhatISaid('I said Wazzaaaaa');\n5 // => error\
  \ ReferenceError: arguments is not defined\n```\n\n`arguments` 变量未定义，因此我们得到了 `ReferenceError`。让我们定义它并看看会发生什么：\n\
  \n```\n1 let arguments = ['trying something crazy'];\n2 let forgetWhatISaid = ()\
  \ => {\n3   console.log(`I am going to forget that you said: ${arguments}`);\n4\
  \ }\n5 forgetWhatISaid('I said Wazzaaaaa');\n6 // => I am going to forget that you\
  \ said: trying something crazy\n```\n\n我们也可以通过将*箭头函数*封装在另一个函数内部来进行同样的实验：\n\n```\n\
  1 let createMemoryWisp(){\n2   return () => console.log(`*MemoryWisp*: You said...\
  \ \n3 ${Array.from(arguments).join(', ')}`);\n4 }\n5 let wispRememberThis = createMemoryWisp(1,\
  \ 2, 3, 4, 'banana!');\n6 wispRememberThis('important password', '123456789');\n\
  7 // => *MemoryWisp*: You said... 1, 2, 3, 4, banana!\n```\n\n正如你在在这两个示例中看到的，*箭头函数*没有自己的\
  \ `arguments` 对象，而是使用它们外层环境的 `arguments` 对象。但*如果我们想向箭头函数发送任意数量的参数怎么办？*好吧，在这种情况下，你应该使用*剩余参数运算符（rest\
  \ operator）*：\n\n```\n1 function createMemoryWispWithRest(){\n2   return (...thingsToRemember)\
  \ => \n3         console.log(`*MemoryWisp*: You said... ${thingsToRemember.join(',\
  \ ')}`);\n4 }\n5 let wispRememberThisAgain = createMemoryWispWithRest();\n6 wispRememberThisAgain('important\
  \ password', '123456789');\n7 // => *MemoryWisp*: You said... important password,\
  \ 123456789\n```\n\n总结，每当你在*箭头函数*内部使用 `arguments` 时，访问的都是外层环境的 `arguments` 对象。所以，如果你想向*箭头函数*发送多个任意参数，请使用*剩余参数运算符*。\n\
  \n### 箭头函数与 new 和 super 运算符\n\n`new` 和 `super` 是两个我们将在书的 OOP（面向对象）部分深入介绍的运算符。`new`\
  \ 运算符允许你在应用于任何函数时创建新的对象实例，该函数随后将作为构造函数。`super` 关键字是 ES6 新引入的，允许你访问继承链中父类的方法。\n\n\
  与 `bind`、`call` 和 `apply` 的情况类似，你不能对*箭头函数*使用 `new` 或 `super`。\n\n### 总结\n\n在本章中你学习了\
  \ ES6 *箭头函数*，它类似于 C# 中的 *lambda*。*箭头函数*允许你使用比普通函数更简洁的语法，并通过使用所在环境的 `this` 值帮助你避免\
  \ `this` 关键字的问题。\n\n*箭头函数*在 `this` 方面有点特殊，因为它们是 JavaScript 中唯一没有自己的 `this` 值的*函数*。由于这个特性，你无法使用\
  \ `bind`、`call` 或 `apply` 来指定箭头函数求值时的上下文。同样，你不能在*箭头函数*中使用 `new` 和 `super` 运算符。\n\
  \n此外,*箭头函数*没有自己的 `arguments` 对象，如果你在*箭头函数*内部访问 `arguments`，访问的是外层函数内部的 `arguments`\
  \ 对象。这意味着如果你想让*箭头函数*接收任意数量的参数，你需要使用*剩余参数语法（rest syntax）*。\n\n### 练习题\n\n## 使用 ECMAScript\
  \ 6 升级你的日常 JavaScript 魔术 - 展开运算符\n\n```\n 学习在代码中发现美，\n它会让编码任务本身\n就变成一种享受，\n它将让你以完全不同的方式欣赏代码。\n\
  \n        - Zazongel emjia\n        诗人与吟 \n```\n\n### 准备好展开你的翅膀了吗？\n\n在更多实用的函数模式:\
  \ 多参数中，你学习了*剩余参数（rest parameters）*，这是 ES6 的新特性，允许你定义具有任意数量参数的函数就像 C# 中的 `params`\
  \ 一样。\n\n*展开运算符（spread operator）*的工作方式类似于与*剩余运算符（rest operator）*相反。*剩余运算符*接收变量数量的参数并将它们打包成一个*数组*，而*展开运算符*接收一个*数组*并将其**展开**为各个项。\n\
  \n在本章中，你将看到几种方案，通过利用展开运算符（例如合并数组）来帮助编写更好的代码。\n\n### 使用展开运算符无缝合并数组\n\n你可以使用*展开运算符*轻松地合并*数组*。假设我们想要收集最可怕的敌人以备后用。有一个数组\
  \ `knownFoesLevel1` 和另一个包含新敌人的数组 `newFoes`（因为敌人永远不够）：\n\n```\n1 let knownFoesLevel1\
  \ = ['rat', 'rabbit']\n2 let newFoes = ['globin', 'ghoul'];\n```\n\n由于管理一个集合比两个容易，我们想这两个集合合并为一个单一*数组*。在\
  \ ES5 中你会使用 `concat` 方法：\n\n```\n1 let knownFoesLevel2 = knownFoesLevel1.concat(newFoes);\n\
  2 console.log(knownFoesLevel2);\n3 // => [\"rat\", \"rabbit\", \"globin\", \"ghoul\"\
  ]\n```\n\n在 ES6 中，你可以使用*展开运算符*实现相同的结果，语法更加清晰：\n\n```\n1 let knownFoesLevel2WithSpread\
  \ = [...knownFoesLevel1, ...newFoes];\n2 console.log(knownFoesLevel2WithSpread);\n\
  3 // => [\"rat\", \"rabbit\", \"globin\", \"ghoul\"]\n```\n\n你甚至可以混合*数组*和单个项：\n\n\
  ```\n1 let undead = ['zombie', 'banshee', 'vampire', 'skeleton'];\n2 let knownFoesLevel3\
  \ = [...knownFoesLevel2, 'troll', 'orc', ...undead];\n3 console.log(knownFoesLevel3);\n\
  4 // => [\"rat\", \"rabbit\", \"globin\", \"ghoul\", \"troll\", \n\"orc\", \"zombie\"\
  , \"banshee\", \"vampire\", \"skeleton\"]\n```\n\n### 使用展开运算符轻松使用 apply\n\n*展开运算符*的另一个有用用例是作为\
  \ `Function.prototype.apply` 的替代语法。\n\n\n\n\n\n在 JavaScript 术奥秘 中，你学习了如何使用 `apply`\
  \ 函数来显式地设置函数执行的上下文（`this`）。你还学习了 `apply` 如何期望第二个参数是一个参数数组 `array`，以及当函数最终被调用时，`array`\
  \ 中的每个元素是如何作为独立的参数传递给原始函数的。\n\n嗯，**展开运算符**（spread operator）让你能够以一种比 `apply` 更好的方式，使用参数\
  \ `array` 来调用任意函数。\n\n假设你正在编写一个法咒，用来命令你的小魔执行随机动作，因为过于预测性太无趣了，而你很欣赏这种随机性因素。你将这些随机动作表示为\
  \ `arrays`：`['minion1', 'action', 'minion2']`。\n\n```\n1 let action = ['hobbit',\
  \ 'attacks', 'rabbit'];\n```\n\n现在，假设你编写了自己的函数，你希望动作以“残暴地”（viciously）的方式执行（看起来你今天心情不太好）：\n\
  \n```\n1 function performActionViciously(agent1, action, agent2){\n2     console.log(`${agent1}\
  \ ${action} ${agent2} viciously`);\n3 }\n```\n\n由于动作是以 `array` 形式表示的，但 `performActionViciously`\
  \ 函数期望的是一系列独立的参数，因此你需要一种方法来适配这两个异异的元素。\n\n在 ES6 之前，你会使用 `apply` 函数：\n\n```\n1 performActionViciously.apply(/*\
  \ this */ null, action); \n2 // => hobbit attacks rabbit viciously\n```\n\n在这种情况下，你需要为\
  \ `apply` 方法填充函数将执行的上下文（即 `this` 的值）。\n\n在 ES6 中，你可以使用 `展开运算符`（spread operator）来轻松地执行该操作：\n\
  \n```\n1 // let action = ['hobbit', 'attacks', 'rabbit'];\n2 performActionViciously(...action);\
  \ \n3 // => hobbit attacks rabbit viciously\n```\n\n不需要设置函数执行的上下文，而且由于省略了 `apply`，生成的代码更加简洁。\n\
  \n现在你可能会问自己：*为什么我不直接让 `performActionViciously` 函数接收数组作为参数，然后忘掉这些关于展开运算符的废话呢？* 嗯，你可以那样做。但当你对被调用的函数**没有控制权**时会发生什么呢？\n\
  \n以 `console.log` 为例。想象一下，你并不是残暴地执行这些动作，而只想记录它们。由于 `console.log` 接收任意数量的参数，而你有一个数组，你需要某种方法将数组适配到预期的签名。同样，在\
  \ ES6 之前，你会使用 `apply`：\n\n```\n1 // console.log 期望这样的结构 console.log(a1, a2, a3,\
  \ a4, 等)\n2 console.log.apply(/* this */ console.log, action);\n3 // => 'hobbit',\
  \ 'attacks', 'rabbit'\n```\n\n使用 ES6 和 `展开运算符`，你可以极大简化上面的代码示例：\n\n```\n1 console.log(...action);\n\
  2 // => 'hobbit', 'attacks', 'rabbit'\n```\n\n`展开运算符` 另一个派得上用场的场景是当我们想要用另一个 `array`\
  \ 扩展有的 `array` 时。在过去，我们会写成：\n\n```\n1 let anotherAction = ['jaime', 'cleans', 'the\
  \ dishes'];\n2 let moreThingsToClean = ['the toilet', 'the hut', 'the stables'];\n\
  3 Array.prototype.push.apply(anotherAction, moreThingsToClean);\n4 console.log(anotherAction);\n\
  5 // => ['jaime', 'cleans', 'the dishes', 'the toilet', 'the hut', 'the stables'];\n\
  ```\n\n使用 `展开运算符`，这变得非常简单：\n\n```\n1 anotherAction.push(...moreThingsToClean);\n\
  ```\n\n总结来说，*如果你有一个作为数组的变量，并需要将其应用到接收独立参数的函数上？* **使用展开运算符**。\n\n### 将类数组和集合转换为数组\n\
  \n`展开运算符` 的另一个有趣应用是将 `类数组对象`（array-like objects）转换为 `arrays`。\n\n如果你还记得更多实用的函数模式：多参数，类数组对象是一种特殊的对象，它们可以被索引、枚举，拥有\
  \ `length` 属性，但不具备 `array` 的任何方法。类数组对象的的一些示例包括函数内部的 `arguments` 对象，或者使用 `document.querySelector`\
  \ 时生成的 DOM 节点列表。\n\n假设我们有一个基于 Web 的用户界面（表单），帮助我们根据手动输入的某些特征来创建小魔（即使是巫师也能从网页界面中获益）。它看起来像这样：\n\
  \n```\n 1 <form action=\"post\" id=\"minion\">\n 2   <label for=\"name\">Name:</label>\n\
  \ 3   <input type=\"text\" name=\"name\" value=\"Orc\">\n 4 \n 5   <label for=\"\
  class\">Class:</label>\n 6   <input type=\"text\" name=\"class\" value=\"Warrior\"\
  >\n 7 \n 8   <label for=\"strength\">Strength:</label>\n 9   <input type=\"number\"\
  \ name=\"strength\" value=\"18\">\n10 \n11   <button>Save</button>\n12 </form>\n\
  ```\n\n当用户点击 `Save` 按钮时，表单会被提交。我们阻止默认提交并自己处理数据。我们使用 `addEventListener` 方法捕捉事件：\n\
  \n```javascript\nconst form = document.querySelector('#minion');\nform.addEventListener('submit',\
  \ (event) => {\n    event.preventDefault();\n    const data = new FormData(form);\n\
  \    console.log(Object.fromEntries(data));\n});\n```\n\n所以我们使用 `form.querySelectorAll('input')`\
  \ 来选择所有元素。该方法返回一个类数组对象。因为它拥有 `length` 属性，我们可以使用简单的 `for` 循环和一个新数组 `values` 来收集值。\n\
  \n```javascript\nlet inputs = form.querySelectorAll('input');\nlet values = [];\n\
  for (let i = 0; i < inputs.length; i++) {\n    values.push(inputs[i].value);\n}\n\
  ```\n\n*但是，有更好的方法收集这些值吗？* 将 `inputs` 类数组对象转换为 `array` 并使用有用的*数组*方法代替 `for` 循环如何？*展开运算符*来救急！\n\
  \n```javascript\nfunction saveionWithSpread(e){\n    event.preventDefault();\n \
  \   let values = [...form.querySelectorAll('input')]\n        .map(i => i.value);\n\
  \    console.log(values);\n}\n```\n\n通过使用 `展开运算符` 将类数组转换为数组，我们可以使用诸如 `map` 等数组函数并编写更漂亮的代码！`map`\
  \ 的工作方式就像 *LINQ* 中的 `Select`，它允许你对集合中的每个项进行转换。在这种情况下，我们只是将元素集合转换为值。很棒，对吧？\n\n除了类数组对象外，你还可以使用\
  \ `展开运算符` 将任何迭代对象转换为数组。例如一个 `Set`（唯一项集合）：\n\n```javascript\n// 你也可以使用展开将任何迭代器转换为数组\n\
  let exits = new Set(['north', 'south', 'east', 'west']);\n\nconsole.log(exits);\n\
  // => [object Set]\n\nconsole.log([...exits]);\n// => ['north', 'south', 'east',\
  \ 'west'];\n```\n\n或者一个 `Map`（类似于 C# 的 `Dictionary`）：\n\n\n\n\n\n```\n 1 let box\
  \ = new Map();\n 2 box.set('jewels', ['emerald', 'ruby']);\n 3 box.set('gold coins',\
  \ 100);\n 4 \n 5 console.log(box);\n 6 // => [object Map]\n 7 \n 8 console.log([...box])\n\
  \ 9 // => [[\"jewels\", [\"emerald\", \"ruby\"]], [\"gold coins\", 100]]\n10 //\
  \ 在这种情况下我们得到了一个键值对数组\n```\n\n### 扩展运算符让你结合 new 和 apply\n\n`spread` 运算符还允许你将 `new`\
  \ 运算符与向函数 `apply` 参数的能力相结合。也就是说，你可以在使用`构造函数` 实例化对象的同时，将参数数组转换为期望接收独立参数的`构造函数`。\n\
  \n让我们继续上一节的示例，我们从一个 `HTML 表单`中提取了小人的特征。为了唤起你的记忆，表单看起来如下：\n\n```\n 1 <form action=\"\
  post\" id=\"minion\">\n 2   <label for=\"name\">Name:</label>\n 3   <input type=\"\
  text\" name=\"name\" value=\"Orc\">\n 4 \n 5   <label for=\"class\">Class:</label>\n\
  \ 6   <input type=\"text\" name=\"class\" value=\"Warrior\">\n 7 \n 8   <label for=\"\
  strength\">Strength:</label>\n 9   <input type=\"number\" name=\"strength\" value=\"\
  18\">\n10 \n 11   <button>Save</button>\n12 </form>\n```\n\n下一个自然的步骤是使用这些特征和下面的`构造函数`来创建一个新的小人：\n\
  \n```\n1 function Minion(name, minionClass, strength){\n2   this.name = name\n3\
  \   this.minionClass = minionClass\n4   this.strength = strength\n5   this.toString\
  \ = function(){\n6     return `I am ${name} and I am a ${minionClass}`;\n7   }\n\
  8 }\n```\n\n如果我们使用纯 ES5，我们需要在这些值之前对它们进行解包：\n\n```\n1 var newMinion = new Minion(values[0],\
  \ values[1], values[2]);\n```\n\n使用 ES6，我们可以将 `new` 与 `spread` 运算符结合，得到这段漂亮的代码：\n\
  \n```\n1 let newMinion = new Minion(...values);\n```\n\n完整的代码示例可能如下：\n\n```\n 1\
  \ // 为表单提交事件添加事件处理器\n 2 form.addEventListener('submit', saveMinionForReal);\n 3\
  \ \n 4 function saveMinionForReal(e){\n 5   let values = [... form.querySelectorAll('input')]\n\
  \ 6     .map(i => i.value);\n 7   console.log(values);\n 8   // => [\"Orc\", \"\
  Warrior\", \"18\"]\n 9 \n10   // 使用这些值创建小人\n11   let newMinion = new Minion(...values);\n\
  12   console.log(`Raise and live my minion: ${newMinion}!!!`)\n13   // => Raise\
  \ and live my minion: I am Orc and I am a Warrior!!!\n14 \n15   // saveNewMinion(newMinion);\n\
  16   \n 17   e.preventDefault();\n18 }\n```\n\n在上面的示例中，我们首先从表单中提取值，然后通过同时应用 `new`\
  \ 和 `spread` 运算符来创建一个 `newMinion` 对象。\n\n## 结语\n\n在这一章中，你学习了 ES6 `spread` 运算符以及它的工作方式，它的方式与\
  \ `rest` 运算符恰相反。`spread` 运算符不是将单独的项目分组到数组中，而是将数组展开为单独的项目。\n\n你学习了如何在许多场景中使用它，这通常会产生更具读性的代码：轻松地连接数组、作为\
  \ `apply` 的替代方案、将`类数组`对象甚至其他迭代器转换为数组，最后，将 `new` 运算符与 `apply` 结合。\n\n这一章结束了《JavaScript\
  \ 魔法术》的第一卷！干得好，JavaScript 魔法师！是时候展开你们的翅膀，深入探索 JavaScript 中数据结构的奥秘了！\n\n# 第一卷.II\
  \ JavaScript 魔法术与数据结构\n\n## JavaScript 数组：全能数据结构\n\n```\n 记住，\n\n掌握主题，\n文字便会随之而来。\n\
  \n在脑海中明确论点，\n文字就会自然流淌而出。\n\n先关注数据结构，\n你的代码将会更加整洁。\n\n        - Svotarld Siunl\n\
  \        贤者 \n```\n\n### 我们只需要理解所有这些项目\n\n在很长一段时间内（直到 2015 年 ES6 的出现），JavaScript\
  \ 中唯一可用的数据结构是数组。对于大量的 JavaScript 开发者来说，这不是一个大问题，因为 JavaScript 的数组既是数组、列表、队列、栈，而且提供了类似于\
  \ LINQ 的功能。听起来很有趣吗？让我们来看看。\n\n### JavaScript 数组\n\n在 JavaScript 中创建数组最简单的方法是使用数组字面量：\n\
  \n```\n1 var rightPocket = [];\n2 console.log('This is what I have in my right pocket:\
  \ ' + rightPocket);\n3 // => This is what I have in my right pocket: \n```\n\n尽管你使用\
  \ `Array` 构造函数：\n\n```\n1 var leftPocket = Array();\n2 console.log('And this is\
  \ what I have in my left pocket: ' + leftPocket);\n3 // => And this is what I have\
  \ in my left pocket: \n```\n\n不幸的是，这有一点不一致。例如，你可以使用带单个参数的 `Array` 构造函数来创建一个任意大小的数组：\n\
  \n```\n1 console.log(Array(1));\n2 // => [undefined]\n3 console.log(Array(3));\n\
  4 // => [undefined, undefined, undefined]\n```\n\n或者你可以使用多个参数使用它，创建一个包含你传递的参数的数组（就像\
  \ `[]` 一样）：\n\n```\n1 console.log(Array(1, 2, 3));\n2 // => [1, 2, 3]\n```\n\n正如你对任何像样的数组所预期的那样，你可以通过索引设置数组中的项：\n\
  \n```\n1 rightPocket[0] = 'bearded axe';\n2 leftPocket[0] = '10 gold coins';\n3\
  \ \n4 console.log('right pocket: ' + rightPocket);\n5 // => right pocket: bearded\
  \ axe\n6 console.log('left pocket: ' + leftPocket);\n7 // => left pocket: 10 gold\
  \ coins\n```\n\n你还可以通过索引数组来检索这些项目：\n\n```\n1 console.log('I have a ' + rightPocket[0]\
  \ + ' bearded axe in my right pocket. ' + \n2 'I am maniac... and I have to patent\
  \ this pants...');\n3 // => I have a bearded axe bearded axe in my right pocket.\
  \ \n4 //    I am maniac... and I have to patent this pants...\n```\n\n数组具有动态大小，并随着向它们中添加新元素而增长。你可以使用它的\
  \ `length` 属性访问数组的大小：\n\n```\n1 console.log('The size of my right pocket is: ' +\
  \ rightPocket.length);\n2 // => The size of my right pocket is: 1\n3 rightPocket[1]\
  \ = \"orb of power\";\n4 console.log('And now it is: ' + rightPocket,length);\n\
  5 // => And now it is 2\n```\n\n特别有趣的是，JavaScript 允许你在同一个数组中拥有不同类型的元素：\n\n```\n\
  1 var leatherBag = ['20 gold coins', \n2   {name: 'wand of invisibility', charges:\
  \ 1, toString(){return this.name;}}];\n3 console.log('You examine your leather bag\
  \ and find: ' + leatherBag);\n4 // => You examine your leather bag and find: 20\
  \ gold coins,wand of invisibility\n```\n\n### 极其灵活的数据结构\n\n在很长一段时间内，数组是 JavaScript\
  \ 中唯一可用的数据结构，因此它提供了许多功能，以涵盖你在编写 JavaScript 时通常遇到的大多数用例。它在某种程度上是一个通用集合。\n\n例如，如果你使用\
  \ `push` 和 `pop` 方法，它可以作为`栈`（LIFO - 后进先出）工作。这些方法分别从数组的末尾添加和删除元素：\n\n```\n1 rightPocket.push('chewing\
  \ gum');\n2 console.log('You get the ' + rightPocket.pop());\n3 // => You get the\
  \ chewing gum\n```\n\n如果你使用 `shift` 方法从数组开头提取项目并将其与 `push` 结合，它可以作为`队列`（FIFO - 先进先出）工作：\n\
  \n```\n1 leftPocket.push('cheese sandwich');\n2 console.log('You pay the cheese\
  \ sandwich with ' + \n     leftPocket.shift() + '. That was a pricy sandwich...');\n\
  4 // => You pay the cheese sandwich with 10 gold coins. \n5 //    That was a pricy\
  \ sandwich...\n```\n\n你还可以通过 `unshift` 方法在数组开头插入项目：\n\n```\n1 leftPocket.unshift('beautiful\
  \ stone');\n2 console.log('You examine the ' + leftPocket[0] + ' in wonder.');\n\
  3 // => You examine the beautiful stone in wonder.\n```\n\n此外，`push` 和 `unshift`\
  \ 都允许你一次添加多个项目。\n\n\n\n\n\n```\n1 leatherBag.push('dried meat', 'white feather');\n\
  2 leatherBag.unshift('1 copper coin', 'skeleton skull');\n3 console.log('You look\
  \ inside your leather bag and find: ' + leatherBag);\n4 // => You look inside your\
  \ leather bag and find: \n5 //    1 copper coin,skeleton skull,20 gold coins,\n\
  6 //    wand of invisibility,dried meat,white feather\n```\n\n另一个可以让你从数组的任意位置删除元素的实用方法是\
  \ `splice` 方法。它有许多用场景：\n\n```\n 1 var firstItem = leatherBag.splice(/* 开始索引 */ 0,\
  \ /* 删除元素数量 */ 1);\n 2 console.log('extracted first item => ' + firstItem);\n 3\
  \ // => extracted first item => 1 copper coin\n 4 \n5 // 你可以使用负索引从数组的末尾开始\n 6 var\
  \ lastItem = leatherBag.splice(-1, 1);\n 7 console.log('extracted last item => '\
  \ + lastItem);\n 8 // => extracted last item => white feather\n 9 \n10 var someRandomItemsInTheMiddle\
  \ = leatherBag.splice(1, 2);\n11 console.log('extracted items in the middle => '\
  \ + someRandomItemsInTheMiddle);\n12 // => extracted items in the middle => 20 gold\
  \ coins,wand of invisibility\n```\n\n`splice` 甚至可以在指定点插入元素：\n\n```\n1 console.log(rightPocket);\n\
  2 // => [\"bearded axe\", \"orb of power\"]\n3 \n4 // 我们在斧头和法球之间添加几个元素\n5 // splice(开始索引,\
  \ 删除元素数量, item1, item2, 等...)\n6 rightPocket.splice(1, 0, \"candlestick\", \"yerky\"\
  );\n7 console.log(rightPocket);\n8 // => [\"bearded axe\", \"candlestick\", \"yerky\"\
  , \"orb of power\"]\n```\n\n或者同时删除元素并插入元素：\n\n```\n1 // splice(开始索引, 删除元素数量, item1,\
  \ item2, 等...)\n2 let candle = rightPocket.splice(1, 1, \"secret message\", \"wax\"\
  );\n3 console.log(rightPocket);\n4 // => [\"bearded axe\", \"secret message\", \"\
  wax\", \"yerky\", \"orb of power\"]\n```\n\n### 数组排序\n\n数组提供了几种方法让你对其包含的元素进行排序。你需要考虑的第一个是\
  \ `sort` 方法，它接受一个比较函数作为参数。让我们对我们的药水进行排序：\n\n```\n 1 function Potion(name, quantity){\n\
  2   return {\n3     name, \n4     quantity, \n5     toString(){return `(${this.quantity})\
  \ ${this.name}`;}\n6   };\n7 }\n 8\n\n9 var potionsCase = [\n10   Potion('potion\
  \ of firebreathing', 2),\n11   Potion('potion of vigor', 1),\n12   Potion('potion\
  \ of major healing', 3),\n13   Potion('potion of cure poison', 1)\n14 ];\n15 //\
  \ 比较函数 f(a,b) 应该返回：\n16 // a < b 时返回 < 0\n17 // a === b 时返回 0\n18 // a > b 时返回 >\
  \ 0\n19 potionsCase.sort((p1,p2) => p1.quantity - p2.quantity);\n20 console.log(\"\
  You examine your potion case closely... \" + potionsCase);\n21 // => You examine\
  \ your potion case closely... \n22 //     (1) potion of cure poison,\n23 //    \
  \ (1) potion of vigor,\n24 //     (2) potion of firebreathing\n25 //     (3) potion\
  \ of major healing,\n```\n\n看起来你得再买点那种解毒药了，因为你永远不知道下一个转角处会有什么在等着你。比较函数 `compare(a,b)`\
  \ 预期返回：\n\n- 当 `a` 和 `b` 被视为相等时返回 `0`\n- 当 `a < b` 时返回 `< 0`\n- 当 `a > b` 时返回 `>\
  \ 0`\n\n另一个需要记住的事实是，`sort` 方法是**原地排序**（in-place），因此你的原始数组在排序后会反映这些变化。\n\n与排序相关的第二个数组方法是\
  \ `reverse` 方法。该方法反转数组内所有元素的位置，也是原地操作：\n\n```\n1 console.log(\"Let's' see what I\
  \ can sell... \" + potionsCase.reverse());\n2 // => Let's' see what I can sell...\
  \ \n3 //    (3) potion of major healing,\n4 //    (2) potion of firebreathing,\n\
  5 //    (1) potion of cure poison,\n6 //    (1) potion of vigor\n```\n\n### 安全数组方法\n\
  \n到目前为止我们看到的所有方法都会改变数组本身。这意味着使用它们会改变方法被调用处数组的内部内容。现在让我们来看一些安全的方法，即不会改变原始数组的方法。\n\
  \n`concat` 方法允许你将两个数组合并并返回生成的数组：\n\n```\n1 // 使用 concat 拼接数组\n2 var superPocket\
  \ = rightPocket.concat(leftPocket);\n3 console.log(superPocket);\n4 // => [\"bearded\
  \ axe\", \"secret message\", \"wax\", \"yerky\", \n```\n\n`join` 方法允许你使用任意分隔符将数组元素连接成字符串：\n\
  \n```javascript\n1 function beautify(pocket){\n2   return pocket.join('\\n');\n\
  3 }\n4 console.log(beautify(rightPocket));\n5 // bearded axe\n// secret message\n\
  // wax\n// yerky\n// orb of power\n```\n\n`indexOf` 方法返回元素在数组中的位置：\n\n```javascript\n\
  1 var indexOfAxe = rightPocket.indexOf('bearded axe');\n2 console.log('The bearded\
  \ axe is at position: ' + indexOfAxe);\n3 // 0\n```\n\n`lastIndexOf` 方法返回元素在数组中最后一次出现的位置：\n\
  \n```javascript\n1 var lastIndexOf = rightPocket.lastIndexOf('wax');\n2 console.log('The\
  \ last wax is at position: ' + lastIndexOf);\n3 // 3\n```\n\n`slice` 方法是 `splice`\
  \ 的非变异替代方案。它返回数组部分内容的浅拷贝：\n\n```javascript\n1 var lastItem = leatherBag.slice(-1);\n\
  2 console.log(lastItem);\n3 // [\"dried meat\"]\n```\n\n### 遍历数组\n\n在 ES6 之前，JavaScript\
  \ 提供了两种数组元素的方法：`for/in` 循环和 `Array.prototype.forEach` 方法。\n\n`for/in` 循环是一种 JavaScript\
  \ 结构，允许你遍历任何对象的属性。对于数组来说，这些属性就是数组的索引：\n\n```\n1 console.log('You examine your inventory:\
  \ ');\n2 for(var index in leatherBag){\n3   console.log(leatherBag[index]);\n4 }\n\
  5 // => You examine your inventory: \n6 //    skeleton skull\n7 //    dried meat\n\
  ```\n\n`forEach` 方法提供了更好的遍历开发者体验，因为它直接给你数组的每个项：\n\n```javascript\n1 console.log('You\
  \ examine your inventory.... closer: ')\n2 leatherBag.forEach(function(item) {\n\
  3   console.log('You examine ' + item + ' closely');\n4 });\n5 // => You examine\
  \ your inventory.... closer: \n6 //    You examine skeleton skull closely\n7 //\
  \    You examine dried meat closely\n```\n\n\n\n\n```javascript\n1 console.log('You\
  \ examine your inventory.... veeery closely: ')\n2 leatherBag.forEach(function(item,\
  \ index, array) {\n3   console.log('You examine ' + item + ' closely (' + (index+1)\
  \ + '/' + array.length \\\n4 + ')');\n5 });\n6 // => You examine your inventory....\
  \ veeery closely:\n7 //    You examine skeleton skull closely (1/2)\n8 //    You\
  \ examine dried meat closely (2/2)\n```\n\nES6 通过引入迭代器协议（iterator protocol）和 `for/of`\
  \ 循环，扩展了 JavaScript 中的可迭代概念：\n\n```javascript\n1 console.log('You look at the stuff\
  \ in your bag:');\n2 for(let item of leatherBag){\n3   console.log(item);\n4 }\n\
  5 // => You look at the stuff in your bag:\n6 //    skeleton skull\n7 //    dried\
  \ meat\n```\n\n我们将在书中后的数据结构部分深入探讨迭代器协议和 `for/of` 循环，届时将学习如何利用它来创建自定义对象的迭代方式。\n\n\
  ### JavaScript 数组与 LINQ\n\n如果你认为到为止看到的已经是关于 JavaScript 数组的全部，那么你就有大福了，因为“等等！还有更多！”。\n\
  \nJavaScript 数组我最喜欢的特性之一是它包含了一组与 .NET LINQ 非常相似的方法。是的，你没读错。这难道不很棒吗？在本书的函数式编程部分，我专门用了一个章节介绍数组的类\
  \ LINQ 方法，但这里是一个小开胃。\n\n```javascript\n 1 var shop = [\n2   {name: 'sword of truth',\
  \ type: 'sword', damage: 60, price: 1000},\n3   {name: 'shield of stamina', type:\
  \ 'shield', defense: 50, price: 500, \n4    modifiers: [{value: 2, characteristic:\
  \ 'stamina'}]},\n5   {name: 'minor potion of healing', type: 'potion', price: 1,\n\
  6    effects: [{value: 10, characteristic: 'hitPoints'}]},\n7   {name: 'grand potion\
  \ of healing', type: 'potion', price: 7,\n8    effects: [{value: 50, characteristic:\
  \ 'hitPoints'}]}\n9 ];\n10 \n11 console.log('The shopkeeper looks at you greedily\
  \ and tells you:');\n12 console.log('*These are the potions we have today sir...'\
  \ +\n13            'they are the best in the kingdowm!*');\n14 var potions = shop\n\
  15       .filter(item => item.type === 'potion')\n16       .map(potion => potion.name);\n\
  17 for(let potion of potions){\n18     console.log(potion);\n19 }\n20 // => The\
  \ shopkeeper looks at you greedily and tells you:\n21 //    *These are the potions\
  \ we have today sir...they are the best in the kingdowm!*\n22 //    minor potion\
  \ of healing\n23 //    grand potion of healing\n```\n\n我在示例中使用了 `箭头函数`（arrow functions），是为了让你对\
  \ `Array.prototype` 的类 LINQ 方法与 LINQ 之间的相似性产生熟悉，但你必须知道，这些方法大部分在 ES5 中已经可用，并且配合普通的函数表达式同样有效。\n\
  \n```javascript\n1 var totalPrice = shop\n2       .map(function(item){return item.price;})\n\
  3       .reduce(function(total, itemPrice){\n4         return total + itemPrice;\n\
  5       }, /* initialTotal */ 0);\n6 console.log('The total price of the items is\
  \ ' + totalPrice + \n7             ' silvers');\n8 // => The total price of the\
  \ items is 1508 silvers\n```\n\n### 其他 ES6 和 ES7 特性\n\n除了正式数组的迭代概念外，ES6 还带来了几个新的实用方法，让操作数组和类数组（Array-likes）变得更简单。\n\
  \n`Array.from` 方法允许我们从任何`类数组`和迭代对象创建数组。这是 ES6 针对 ES5 中使用 `Array.prototype.slice`\
  \ 将类数组转换为真正的数组这一常见做法的解决方案：\n\n```javascript\n1 // (在这种情况下，使用剩余参数语法 ...items 更好)\n\
  2 function sortItems(){  \n3   var items = Array.from(arguments);\n4   return items.sort();\n\
  5 }\n6 console.log(sortItems('mandragora', 'amber', \"elf's tongue\"));\n7 // =>\
  \ [\"amber\", \"elf's tongue\", \"mandragora\"]\n```\n\n我们将在本节稍后的部分查看迭代对象，但任何可以被迭代的对象都可以使用\
  \ `Array.from` 转换为数组。例如，一个 `Map`：\n\n```javascript\n 1 var library = new Map();\n\
  2 library.set('horror', ['It', 'The thing', 'horrors of Swarland']);\n3 library.set('love',\
  \ ['Romance and Betrayal', 'Beauty I']);\n4 library.set('history', ['The fall of\
  \ the Kraagg Empire']);\n5 \n6 console.log('Welcome to the library of Anriva!' +\n\
  7            ' These are our most valuable books');\n8 Array.from(library)\n9  \
  \    .forEach(keyValuePair);\n10 // (等等，提供的文本在这里似乎中断了，但根据逻辑)\n```\n\n\n\n\n```javascript\n\
  1 // 当找不到某个项时，indexOf 返回 -1\n2 if (rightPocket.indexOf('red stone') === -1)\n3 {\n\
  4     console.log(\"你的口袋里没有有一块珍贵的红宝石\");\n5 }\n```\n\n除了可以指明你正在查找的是数组中的哪一个项外，你还可以为搜索指定一个起始索引：\n\
  \n```javascript\n1 let herbs = ['sage', 'salvia', 'aloe vera'];\n2 console.log('Is\
  \ sage the last item in my herb poach?:', \n3    herbs.includes('sage', herbs.length);\n\
  4 // => sage 是我草药包里的最后一项吗？ false\n```\n\n## 数组速查表\n\n| 基础 | 说明 |\n| --- | --- |\n\
  | `[]` | 创建一个空数组 |\n| `[1, 2, 3]` | 创建一个数组 |\n| `Array(n)` | 创建一个包含 `n` 个 `undefined`\
  \ 元素的数组 |\n| `Array(1, 2, 3)` | 等于 `[1, 2, 3]` |\n\n## ES5 不安全方法\n\n| 方法名 | 超能力\
  \ |\n| --- | --- |\n| `Array.prototype.push(n1, n2...)` | 在数组末尾添加项 |\n| - `[].push(1)`\
  \ | |\n| - `[].push(1, 2, 3)` | |\n| `Array.prototype.pop()` | 从数组末尾删除项 |\n| - `let\
  \ n = [1].pop()` | |\n| `Array.prototype.shift()` | 从数组开头删除项 |\n| - `let n = [1].shift()`\
  \ | |\n| `Array.prototype.unshift(n1, n2...)` | 在数组开头插入项 |\n| - `[].unshift(1)`\
  \ | |\n| - `[].unshift(1, 2, 3)` | |\n| `Array.prototype.splice(start, length, n1,\
  \ n2)` | 在任意位置删除项并插入新项 |\n| - `[1,2].splice(0, 1)` | - 删除第一个项 |\n| - `[1,2].splice(-1,\
  \ 1)` | - 删除最后一个项 |\n| - `[1,2,3,4].splice(1,2)` | - 删除中间的两个项 |\n| - `[1,2].splice(0,\
  \ 1, 'ash')` | - 将第一个项更改为 `'ash'` |\n| - `[1,2,3,4].splice(1,2, 'ash', 'gold')`\
  \ | - 将中间两个项更改为 `'ash'` 和 `'gold'` |\n| `Array.prototype.sort(compareFn)` | 排序数组\
  \ |\n| - `[1,2,3].sort()` | - 根据字符 UNICODE 代码点值排序 |\n| - `[1,2,3].sort((a,b) =>\
  \ a-b)` | - 对数字排序 |\n| | - `a > b ⇒ 返回 > 0` |\n| | - `a < b ⇒ 返回 < 0` |\n| | - `a\
  \ === b ⇒ 返回 0` |\n| `Array.prototype.reverse()` | 反转数组内项的顺序 |\n| - `[1,2,3].reverse()`\
  \ | |\n\n## ES5 安全方法\n\n| 方法名 | 超能力 |\n| --- | --- |\n| `Array.prototype.concat(arr)`\
  \ | 合并两个数组 |\n| - `[1,2,3].concat([5,6])` | |\n| `Array.prototype.join(separator)`\
  \ | 使用 `separator` 连接数组中的项 |\n| - `[1,2,3].join(', ')` | - `\"1, 2, 3\"` |\n| `Array.prototype.indexOf(n)`\
  \ | 返回项在数组中首次出现的索引 |\n| - `[1,2,3].indexOf(1)` | |\n| - `[1,2,3].indexOf(5)` | -\
  \ 如果项不在数组中，则返回 `-1` |\n| `Array.prototype.lastIndexOf(n)` | 返回项在数组中最后出现的索引 |\n|\
  \ - `[1,1,1].lastIndexOf(1)` | |\n| - `[1,1,1].lastIndexOf(2)` | - 如果项不在数组中，则返回\
  \ `-1` |\n| `Array.prototype.slice(start, end)` | 返回 `start` 和 `end` 索引之间的子数组。不包含\
  \ `end` 索引。 |\n| - `[1,2,3].slice(1,2)` | - 返回 `[2]` |\n| - `[1,2,3].slice(1)` |\
  \ - 返回 `[2, 3]` |\n| - `[1,2,3].slice(-1)` | - 返回 `[3]` |\n\n### 遍历数组\n\n| 方法 |\
  \ 超能力 |\n| --- | --- |\n| `for/in` | 遍历数组的索引 |\n| - `for(var i in arr)` | |\n| `for/of`\
  \ | 遍历数组的项 |\n| - `for(let i of arr)` | |\n| `Array.prototype.forEach` | 遍历数组的项\
  \ |\n| - `arr.forEach(doSomething)` | |\n\n### 数组 LINQ 类方法\n\n查看书籍函数式编程部分的 LINQ\
  \ 章节\n\n## ES6 新数组方法\n\n| 方法名 | 超能力 |\n| --- | --- |\n| `Array.from` | 将可迭代对象转换为数组\
  \ |\n| `Array.isArray` | 检查对象是否为数组 |\n| `Array.from()` | 根据映射函数创建一个新数组 |\n| `Array.prototype.from()`\
  \ | 创建数组的浅拷贝 |\n| `Array.prototype.includes()` | 检查数组是否包含某个项 |\n| `Array.prototype.find()`\
  \ | 找到第一个满足查找条件的项 |\n| `Array.prototype.findIndex()` | 返回第一个满足查找条件的项的索引 |\n| `Array.prototype.findLast()`\
  \ | 找到最后一个满足查找条件的项 |\n| `Array.prototype.findLastIndex()` | 返回最后一个满足查找条件的项的索引 |\n\
  | `Array.prototype.flat()` | 将数组平化到指定的深度 |\n| `Array.prototype.flatMap()` | 相当于\
  \ map 然后再平化一层 |\n\n\n\n\n```\n1 console.log(`Wizards archive has info on '42': ${wizardsArchive.has(42)}`);\n\
  2 // => Wizards archive has info on '42': false\n3 console.log(`Wizards archive\
  \ has info on 'firebolt': \n4   ${wizardsArchive.has('firebolt')}`);\n5 // => Wizards\
  \ archive has info on 'firebolt': false\n```\n\nAnd when we are done for the day\
  \ and want to remove every item at once, the `Map` offers the `clear` method:\n\n\
  ```\n1 wizardsArchive.clear();\n2 console.log(`there are ${wizardsArchive.size}\
  \ wizards in the archive`);\n3 // => there are 0 wizards in the archive\n```\n\n\
  ### Iterating Over the Elements of a Map\n\nJust like with arrays you can iterate\
  \ over the elements of a `Map` using the `for/of` loop:\n\n```\n 1 // let's add\
  \ some items back so we have something to iterate over...\n 2 // the set method\
  \ is chainable by the by!\n 3 wizardsArchive\n      .set('jaime', {name: 'jaime',\
  \ title: 'The Bold', race: 'ewok', \n 5        traits: ['joyful', 'hairless']})\n\
  \ 6     .set('theRock', {name: 'theRock', race: 'giant', \n 7        traits: ['big\
  \ shoulders']});\n 8 \n 9 for(let keyValue of wizardsArchive){\n10   console.log(`${keyValue[0]}\
  \ : ${JSON.stringify(keyValue[1])}`);\n11 }\n12 /*\n13 \"jaime : {\\\"name\\\":\\\
  \"jaime\\\",\\\"race\\\":\\\"....\n14 \"theRock : {\\\"name\\\":\\\"theRock\\\"\
  ,\\\"race\\....\n15 */\n```\n\nThe default `Map` iterator (also available via the\
  \ `entries` property) lets you traverse a `Map` using key-value pairs. Each pair\
  \ is an array with two items, the first being the key and the second is the value.\
  \ The example above is equivalent to:\n\n```\n1 for(let keyValue of wizardsArchive.entries()){\n\
  2   console.log(`${keyValue[0]} : ${JSON.stringify(keyValue[1])}`);\n3 }\n```\n\n\
  Both examples above are a little displeasing to the eye, aren’t they? You can improve\
  \ them greatly if you use the destructuring syntax to extract the key and the value\
  \ from the key-value array:\n\n```\n1 for(let [key, value] of wizardsArchive){\n\
  2   console.log(`${key} : ${JSON.stringify(value)}`);\n3 }\n```\n\nMuch nicer right?\
  \ Alternatively you can use the `Map.prototype.forEach` method analogous to `Array.prototype.forEach`\
  \ but with keys and values:\n\n```\n1 wizardsArchive.forEach((key,value) => \n2\
  \   console.log(`${key} : ${JSON.stringify(value)}`)\n3 );\n4 // => jaime: {\\\"\
  name\\\" ...\n5 // => theRock: {\\\"name\\\" ...\n```\n\nIn addition to iterating\
  \ over key-value pairs, you can also traverse the keys:\n\n```\n1 console.log(Array.from(wizardsArchive.keys()).join(',\
  \ '));\n2 // => jaime,theRock\"\n```\n\nAnd the values:\n\n```\n1 console.log(Array.from(wizardsArchive.values()).map(i\
  \ => i.race).join(', '));\n2 // => ewok, giant\n```\n\nBoth the `keys` and `values`\
  \ iterators provide a better developer experience in those cases where you just\
  \ need the keys or the values.\n\nNote that in the examples above we created an\
  \ `Array` from the `keys` and the `values` iterators and concatenated its elements\
  \ using `join`. This resulted in us “iterating” over the whole `Map` at once, but\
  \ we could have just as well used a `for/of` loop and operated on each item separately.\n\
  \n### Creating a Map From an Iterable Collection\n\nIn addition to creating empty\
  \ Maps and filling them with information, you can create Maps from any iterable\
  \ collection. For instance, let’s say that you have an array of wizards:\n\n```\n\
  1 let jaimeTheWizard = {name: 'jaime', title: 'The Bold', race: 'ewok', traits:\
  \ ['joyf\\\n2 ul, 'hairless']};\n3 let theRock = {name: 'theRock', title: 'The Mighty',\
  \ race: 'giant', trait: ['big sho\\\n4 ulders']};\n5 let randalfTheRed = {name:\
  \ 'randalf', title: 'The Red', race: 'human', traits: ['pyr\\\n6 omaniac']};\n7\
  \ \n8 let wizards = [jaimeTheWizard, theRock, randalfTheRed];\n```\n\nAnd you want\
  \ to group them by `race` and put them on a dictionary where you can easily find\
  \ them. You can do that by passing a suitably shaped collection into the `Map` constructor:\n\
  \n```\n1 var wizardsByRace = new Map(wizards.map(w => [/*key*/ w.race, /*value*/\
  \ w]));\n2 \n3 console.log(Array.from(wizardsByRace.keys()));\n4 // => [\"ewok\"\
  , \"giant\", \"human\"]\n5 console.log(wizardsByRace.get(\"human\").name);\n6 //\
  \ => randalf\n```\n\nThe `Map` constructor expects to find an iterator that goes\
  \ through key-value pairs represented as an array where the first element is the\
  \ key and the second element is the value:\n\n```\n1 [[key1, value1], [key2, value2]]\n\
  ```\n\n\n\n你还学习了可以对 `Map` 执行的基本操作，包括如何存储、检索和删除数据，如何检查 `Map` 中是否存在某个键，以及如何以不同的方式对其进行迭代。\n\
  \n## 练习\n\n## 集合（Sets），当只能有一个时\n\n```\n 我们生活在一个 \n崇尚个性的世界里。\n\n享受你的独特性，\n将它穿在胸前，\n\
  无论你走到何处。\n\n人们会因你而爱 way。\n\n        - Lenrolc Srich\n        做回自己 \n```\n\n### 你是独一无二的\n\
  \n`Set` 是一种用于表示不同项目集合的数据结构，其中每个项目都是唯一的且只出现一次。这种需求非常常见，如果你已经使用 JavaScript 了一段时间，很可能在某个时候需要自己动手实现一个。现在，由于\
  \ ES6 引入了原生的 `Set` 实现，你再也不需要那样做了。太好了！\n\n### 使用集合\n\n你可以使用 `Set` 构造函数创建一个新的集合：\n\
  \n```\n1 let set = new Set();\n```\n\n或者从数组等可迭代集合创建：\n\n```\n1 let elementsOfMagic\
  \ = new Set([\n2    'earth', 'fire', 'air', \n3    'earth', 'fire', 'water'\n4 ]);\n\
  5 \n6 console.log(`These are the elements of magic: ${[...elementsOfMagic]}`);\n\
  7 // => These are the elements of magic: earth, fire, air, water\n```\n\n从上面的示例可以看出，数组中有一个重复的值\
  \ `earth`，它在创建 `Set` 时被删除了。这是因为 `Set` 会自动移除任何重复项，并且只存储一次特定的项目。\n\n你可以使用 `add` 方法轻松地向\
  \ `Set` 添加更多项目：\n\n```\n1 elementsOfMagic.add('aether');\n2 \n3 console.log(`More\
  \ magic!: ${[...elementsOfMagic]}`);\n4 // => More magic!: earth, fire, air, water,\
  \ aether\n```\n\n`add` 方法是可以链式调用的，因此添加多个新项目非常方便：\n\n```\n1 elementsOfMagic.add('earth').add('air').add('water');\n\
  ```\n\n你可以使用 `has` 方法检查项目是否存在于 `Set` 中：\n\n```\n1 console.log(`Is water one of the\
  \ sacred elements of magic? ${elementsOfMagic.has('wa\\\n2 ter')}`)\n3 // => Is\
  \ water one of the sacred elements of magic? true\n```\n\n你可以使用 `delete` 从集合中移除项目：\n\
  \n```\n1 elementsOfMagic.delete('aether');\n2 \n3 console.log(`The aether element\
  \ flows like the tides and \n4 like the tides sometimes disappears: \n5 ${[...elementsOfMagic]}`);\n\
  6 \n7 // => The aether element flows \n8 //    like the tides and sometimes disappears:\
  \ \n9 //    earth,fire,air,water\n```\n\n此外，你可以使用 `size` 属性获取集合元素的数量：\n\n```\n1\
  \ console.log(`${elementsOfMagic.size} are the elements of magic`);\n```\n\n以及使用\
  \ `clear` 从集合中移除所有项目：\n\n```\n1 const castMagicShield = () => elementsOfMagic.clear();\n\
  2 castMagicShield();\n3 \n4 console.log(`ups! I can't feel the elements: ${elementsOfMagic.size}`);\n\
  5 // => ups! I can't feel the elements: 0\n```\n\n如果你花一点时间思考一下 `Set` API 并尝试回忆上一章的\
  \ `Map`，你会发现这两个 API 之间的一致性非常好。一致性是非常棒的，它能帮助你快速学会这些 API，并编写更不容易出错的代码。\n\n让我们看看如何迭代\
  \ `Set` 的元素。\n\n### 迭代集合\n\n就像 `Map` 一样，你可以使用 `for/of` 循环迭代 `Set` 的元素：\n\n```\n\
  1 elementsOfMagic.add('fire').add('water').add('air').add('earth');\n2 for(let element\
  \ of elementsOfMagic){\n3   console.log(`element: ${element}`);\n4 }\n5 // => element:\
  \ fire\n6 //    element: water\n7 //    element: air\n8 //    element: earth\n```\n\
  \n在这种情况下，你迭代的不是键值对，而是 `Set` 中的每个项目。注意，元素的迭代顺序与它们被插入的顺序相同。`Set` 的默认迭代器是 `values`\
  \ 迭代器。接段代码与上面的代码等效：\n\n```\n1 for(let element of elementsOfMagic.values()){\n2 \
  \  console.log(`element: ${element}`);\n3 }\n```\n\n`Set` 也有对应 `keys` 和 `entries`\
  \ 的迭代器，就像 `Map` 一样，尽管你可能不需要使用它们。`keys` 迭代器等同于 `values`。`entries` 迭代器将每个项目转换为键值对，其中键和值都是\
  \ `Set` 中的对应项目。因此，如果你使用 `entries` 迭代器，你将只是在迭代 `[value, value]` 数组。\n\n除了使用这两种迭代器外，你还可以利用\
  \ `Set.prototype.forEach` 方法来遍历 `Set` 中的项目：\n\n```\n1 elementsOfMagic.forEach((value,\
  \ alsoValue, set) => {\n2   console.log(`element: ${value}`);\n3 })\n4 // => element:\
  \ fire\n```\n\n### 使用数组方法\n\n在这种情况下，你迭代的不是键值对，而是 `Set` 中的每个项目。注意，元素的迭代顺序与它们被插入的顺序相同。`Set`\
  \ 的默认迭代器是 `values` 迭代器。接段代码与上面的代码等效：\n\n（注：原文此处存在大量重复的 Using Array Methods 及描述文本，根据翻译要求，已按逻辑结构翻译并保持格式一致）\n\
  \n\n\n\n与此同时，如果你需要对对象使用类似 `Set` 的功能，最佳方案是使用字典，通过一个代表其唯一性的键来索引对象。\n\n```\n1 var fakeSetThisIsAHack\
  \ = new Map();\n2 fakeSetThisIsAHack\n3   .set(randalf.id, randalf)\n4   .set(1,\
  \ {id: 1, name: 'randalf'});\n5 console.log(`fake set has ${fakeSetThisIsAHack.size}\
  \ item`);\n6 // => fake set has 1 item\n```\n\n## Set 查表\n\n## 基本操作\n\n| 基础 | 描述\
  \ |\n| --- | --- |\n| var set = new Set() | 创建空集合 |\n| var set = new Set(iterator)\
  \ | 从迭代器创建集合 |\n| set.add(‘value’) | 如果项已不在集合中，则将其添加。添加到集合中的项可以是任何类型。它使用严格相等比较来判断。支持链式调用。\
  \ |\n| set.delete(‘value’) | 如果项存在则将其删除。如果删除了项则返回 true，否则返回 false。 |\n| set.has(‘value’)\
  \ | 检查项是否存在于集合中。根据键是否存在分别返回 true 或 false。 |\n| set.size | 返回集合中的项数 |\n| set.clear()\
  \ | 集合中的所有项 |\n\n## 遍历集合\n\n| 迭代方法 | 描述 |\n| --- | --- |\n| set.forEach((value,value,map)\
  \ ⇒ {}) | 遍历集合中的每一个项 |\n| set.value() | 返回一个值迭代器。这是 Set 的默认迭代器 |\n| set.keys() |\
  \ 返回一个键迭代器，允许你遍历集合中的项（就像遍历值一样） |\n| set.entries() | 返回一个键/值对迭代器，允许你遍历集合中这些项的值/值对\
  \ |\n\n## 结语\n\n`Set` 是 ES6 中的一种新数据结构，让你能够轻松地从项集合中移除重复项。它提供了一个非常简单的 API，与 `Map`\
  \ 的 API 非常一致，它将成为你工具箱中的极佳补充，并让你免去自己手动实现的麻烦。\n\n遗憾的是，目前它有一个很大的局限性，即它仅支持严格相等比较来判断两个项是否相等。希望在不久的将来，我们能够定义自定义的相等性版本，到那时\
  \ `Sets` 将实现其真正的潜力。在此之前，对数字和字符串请使用 `Set`，而在处理对象时依赖 `Map`。\n\n## 练习\n\n# 集合背后的秘密：可枚举性、可迭代性、迭代器和生成器\n\
  \n```\n text text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text.\n\
  \n                                - XXXX Xxxxx,\n                              \
  \  Some title, Some time \n```\n\n```\n1 /* \n2  * story \n3  *\n4  */\n```\n\n\
  在之前的章节中，我们讨论了 JavaScript 和 ES6 中提供的不同数据结构。对于其中任何一种，在遍历数组项或 Map 的键/值对时，我们反复回到“可迭代性（iterability）”和“迭代器（iterators）”的概念上。我们虽然做了这些，但从未解释过\
  \ JavaScript 中可迭代性和迭代器的概念到底意味着什么。我们现在就解决这个问题！在本章中，你不仅将学习关于可迭代性和迭代器，还将学习关于可枚举性（enumerability）和生成器（generators）的概念。\n\
  \n让我们从开始学习……\n\n## 从前，存在可枚举性\n\n从很久时候起，JavaScript 就有一个叫做[可枚举性](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Enumerability_and_ownership_of_properties)\
  \ 的概念，即通过 `for/in` 循环遍历对象内部属性的能力。\n\n理想情况下，你应该能够使用 `for/in` 循环来遍历对象的属性，或者数组的值（通过其索引）。假设我有一个用于制作药水和咒语的成分数组：\n\
  \n```\n1 let ingredients = ['mandragora', 'troll nail', 'dragon scale', 'gorgon\\\
  's eye'];\n```\n\n你可以使用 `for/in` 循环遍历数组中的所有成分：\n\n```\n1 console.log('you can enumerate\
  \ all the ingredients within the array with a for/in lo\\\n2 op:')\n3 for (let idx\
  \ in ingredients){\n4     console.log(`Item at index ${idx}: ${ingredients[idx]}`);\n\
  5 }\n6 // => Item at index 0: mandragora\n7 // => Item at index 1: troll nail\n\
  8 // => etc...\n```\n\n嗯，到目前为止没有问题，一切似乎如你预期的那样工作，除了一个微小的事实：你只能遍历数组的索引，而不是项本身。这有点烦人，但你可以学会适应它。\n\
  \n然而，你可能听过使用 `for/in` 循环遍历数组不是一个好主意。让我们找出为什么。我们先从向 `ingredients` 数组添加一个新属性开始。\n\n\
  ```\n1 ingredients.maxNumberOfIngredients = 666;\n```\n\n如果我们现在尝试遍历 `ingredients`\
  \ 数组：\n\n```\n1 for (let idx in ingredients){\n2     console.log(`Item at index\
  \ ${idx}: ${ingredients[idx]}`);\n3 }\n4 // => Item at index 0: mandragora\n5 //\
  \ => Item at index 1: troll nail\n6 // => etc...\n7 // => Item at index maxNumberOfIngredients:\
  \ 666\n```\n\n事实证明，JavaScript 对象内部的属性可以进行某种程度的配置，其中一种配置是“可枚举性（enumerable）”属性描述符，它允许我们定义一个属性是否可以通过\
  \ `for/in` 循环进行枚举。当我们使用对象字面量或使用点符号符号向对象扩充属性时，这些属性默认被定义为可枚举的。\n\n让我们使用 `propertyIsEnumerable`\
  \ 方法验证我们之前创建的 `maxNumberOfIngredients` 属性确实是可枚举的：\n\n```\n1 console.log(ingredients.propertyIsEnumerable('maxNumberOfIngredients'));\n\
  2 // => true\n```\n\n以及像 `push` 这样的方法不是枚举的：\n\n```\n1 console.log(ingredients.propertyIsEnumerable('push'));\n\
  2 // => false\n```\n\n\n\n\n\n你可能看过这个：物品的秘密生活，但它仍然值得重申。为了将一个属性指定为**不可枚举**（`not-enumerable`），我们需要降低一个抽象层，并使用\
  \ `Object.prototype` 的低级方法：`defineProperty` 和 `defineProperties`。我们可以使用 `defineProperty`\
  \ 方法来修改现有属性（如 `maxNumberOfIngredients`）的配置：\n\n```\n1 Object.defineProperty(/* object\
  \ */ ingredients,\n2                       /* property */ 'maxNumberOfIngredients',\n\
  3                       /* descriptor */ { enumerable: false});\n```\n\n如果我们现在尝试通过\
  \ `for/in` 循环枚举 `ingredients` 数组：\n\n```\n1 console.log('\\n 当我们在将属性修改为不可枚举后进行枚举时：')\n\
  2 for (let idx in ingredients){\n3     console.log(`Item at index ${idx}: ${ingredients[idx]}`);\n\
  4 }\n5 // => Item at index 0: mandragora\n6 // => ...\n7 // => Item at index 3:\
  \ gorgon's eye\n8 // 修复好了！！\n```\n\n`Object.prototype.keys` 方法也提供了另一种方法，来检查对象内部哪些属性是可枚举的：\n\
  \n```\n1 console.log('这些是 ingredients 数组的可枚举属性： ', Object\\\n2 .keys(ingredients));\n\
  3 // => 这些是 ingredients 数组的可枚举属性 [0, 1, 2, 3]\n```\n\n你也可以使用 `Object.defineProperty`\
  \ 方法来定义新属性：\n\n```\n1 var elementsOfMagic = ['wind', 'earth', 'fire', 'water'];\n\
  2 Object.defineProperty(elementsOfMagic, 'secretElements', {\n3     enumerable:\
  \ false,\n4     value: ['aether', 'iron']\n5 });\n```\n\n通过将属性定义为**不可枚举**，我们可以在某种程度上保证可以使用\
  \ `for/in` 循环枚举数组中的项或对象中的属性。\n\n另一个关于枚举属性和 `for/in` 循环的不那么明显的问题发生在我们扩展对象的原型时。当你认为这已经全部时，JavaScript\
  \ 的原型继承被引入了。如果我们随所欲地扩展 `Array.prototype` 会发生什么？\n\n```\n1 Array.prototype.countMissisipi\
  \ = function(){ \n2   return this.length + \" Mississipi!\";\n3 }\n```\n\n嗯，发生的情况是我们将破坏当前环境中所有数组的\
  \ `for/in` 行为：\n\n```\n1 for (let idx in ingredients){\n2     console.log(`Item\
  \ at index ${idx}: ${ingredients[idx]}`);\n3 }\n4 // => Item at index countMissisipi:\
  \ .....\n5 // => 爆炸了！\n```\n\n但请注意，我们仍然可以按照相同的步骤使用 `Object.defineProperty` 方法修复这个问题：\n\
  \n```\n1 Object.defineProperty(Array.prototype, 'countMissisipi', {\n2     enumerable:\
  \ false\n3 });\n```\n\n正如你从这些示例中看到的，枚举性和 `for/in` 循环并不是遍历数组或对象最可靠的方法。`for/in` 循环对于反射或对象内省等操作仍然很有趣，但对于遍历数组，你可能需要限制使用\
  \ `Array.prototype.forEach`、其他数组函数或原生的 `for` 循环。或者等一下……ES6 (2015) 登场了！\n\n### ES6\
  \ 带来了真正的迭代器和迭代器\n\n如你所知，ES6 引入了两个新结构：maps 和 sets（以及它们的弱版本）。突然之间变得更加明显，我们需要一种可靠且直接的方法来遍历这些结构，以及我们的老朋友——数组。幸运的是，ES6\
  \ 不仅带有这些新结构，还通过 `iterables`（迭代器）、`iterators`（迭代器）以及新的 `for/of` 循环固化了对集合迭代的概念（这些类似于\
  \ `IEnumerable` 和 `IEnumerator` 接口）。\n\n如果 JavaScript 对象实现了可迭代（类似于 `IEnumerable`），它就变成了可迭代的，这并不是指我们在\
  \ C# 中实现的那种方式，而是更原生的鸭子类型意义。也就是说，如果一个对象有一个返回有效迭代器的 `GetIterator` 方法，那么该对象就是可迭代的。我之所以说\
  \ `GetIterator`，是因为该方法的名称本身是由常量定义的：`Symbol.iterator`：\n\n```\n1 console.log(Symbol.iterator);\n\
  2 // => Symbol(iterator)\n```\n\n如果我们查看 ES2015 (ES6) 中的数组、map 和 set，我们可以验证它们确实是可迭代的。让我们从数组开始：\n\
  \n```\n1 let inventory = [\n2   \"sword\",\n3   \"shield\",\n4   \"100 coppers\"\
  \n5 ];\n```\n\n你可以像我们在之前的章节中看到的那样，使用 `for/of` 循环遍历它：\n\n```\n1 console.log('旅行者，你的背包里有：')\n\
  2 for(let item of inventory){\n3   console.log(item)\n4 }\n5 // => 旅行者，你的背包里有：\n\
  6 // => sword\n7 // => shield\n8 // => 100 coppers\n```\n\n在后台，`for/of` 使用了默认迭代器，允许你遍历数组的值。你可以通过使用\
  \ `Symbol.iterator` 作为键来获取此迭代器的引用：\n\n```\n1 // 数组默认迭代器\n2 console.log(Symbol.iterator);\n\
  ```\n\n如果我们查看 ES2015 (ES6) 中的数组、map 和 set，我们可以验证它们确实是可迭代的。让我们从数组开始：\n\n```\n1 let\
  \ inventory = [\n2   \"sword\",\n3   \"shield\",\n4   \"100 coppers\"\n5 ];\n```\n\
  \n你可以像我们在之前的章节中看到的那样，使用 `for/of` 循环遍历它：\n\n```\n1 console.log('旅行者，你的背包里有：')\n2\
  \ for(let item of inventory){\n3   console.log(item)\n4 }\n5 // => 旅行者，你的背包里有：\n\
  6 // => sword\n7 // => shield\n8 // => 100 coppers\n```\n\n在后台，`for/of` 使用了默认迭代器，允许你遍历数组的值。你可以通过使用\
  \ `Symbol.iterator` 作为键来获取此迭代器的引用：\n\n```\n1 // 数组默认迭代器\n2 console.log(Symbol.iterator);\n\
  ```\n*(注：此处原文示例代码似乎有截断或重复，已根据逻辑对齐)*\n\n抱歉，重新按照您提供的完整文本进行翻译：\n\n[content]\n你可能看过这个内容：物品的秘密生活，但它仍然值得重申。为了将一个属性指定为**不可枚举**（`not-enumerable`），我们需要降低一个抽象层，并使用\
