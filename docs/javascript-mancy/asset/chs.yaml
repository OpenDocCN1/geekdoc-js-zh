  \ 响应式编程简介](https://egghead.io/series/introduction-to-reactive-programming)\n\n*\
  \ [使用 Rx.js 进行响应式编程书籍](http://amzn.to/1pIpkLF)\n\n* [一切皆流](https://www.youtube.com/watch?v=UHI0AzD_WfY)\
  \ 视频\n\n### 总结\n\n所以！这篇文章比我最初预想的要大一点点！哈哈！但希望你喜欢它。\n\n今天你学习了 Rx.js 和响应式编程。你看到了回调（callbacks）和\
  \ promises 作为异步模式的局限性，并发现了可观测流作为一种超可组合的异步范式。可观测流让你能够表示随时间推移的异步数据序列，随心所欲地将它们转换为对程序有用的东西，并产生超声明式且可读的源码。你还看到了可观测流与观察者模式（observer\
  \ pattern）、迭代器模式（iterator pattern）以及项散布在时间中的数组的相似之处。我们最后反思了使用单一抽象来表示程序中数据流的威力，以及使用\
  \ Rx.js 如何限制代码中所需的副作用数量。\n\n还有一些内容需要涵盖，比如 Rx.js 的一些底层原理、更深入观察可观测类型和观察者类型、海量操作符、实用配方、错误处理、rx.js\
  \ 和 angular2，所以请保持关注！ :)\n\n## 响应式编程第二部分\n\n```\n text text text text text text\
  \ text,  \ntext text text text text text text,  \ntext text text text text text\
