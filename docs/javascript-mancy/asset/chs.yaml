  ```\n\n正如你从之前的示例看到的，在 `ES6` 之前编写“类”并非易事。它需要很多活动部件和大量的代码。这就是为什么 `ES6` 引入了 `classes`，它提供了比你目前看到的更优雅的语法。你不再需要亲自处理\
  \ `constructor functions`（构造函数）和 `prototypes`（原型），而是使用新的 `class` 关键字，它很好地将两者都封装成一种更连贯、且对开发者更友好的语法：\n\
  \n```\n 1 // 这等同于 Minion\n 2 class ClassyMinion{\n 3   constructor(name, hp){\n\
  \ 4     this.name = name;\n 5     this.hp = hp;\n 6   }\n 7   toString(){\n 8  \
  \   return this.name;\n 9   }\n10 }\n 11 \n12 const classyOrc = new ClassyMinion('classy\
  \ orc', 50);\n13 console.log(classyOrc);\n14 // => [object Object] {\n15 //  hp:\
  \ 100,\n16 //  name: \"classy orc\"\n17 //}\n 18 \n19 console.log(classyOrc.toString());\n\
  20 // => classy orc\n21 \n22 console.log('classy orc is a ClassyMinion: ' + \n23\
  \   (classyOrc instanceof ClassyMinion));\n24 // => classy orc is a ClassyMinion:\
  \ true\n```\n\nES6 类还提供了 `extend` 和 `super` 关键字，改进了类与父类之间的关系和交互方式。`extend` 允许你以一种可读的、声明的方式建立类继承，而\
  \ `super` 则允许你访问父类的方法：\n\n```\n 1 // 这等同于 Wizard\n 2 class ClassyWizard extends\
  \ ClassyMinion{\n 3   constructor(name, element, hp, mana){\n 4     // super 让你访问父类的方法\n\
  \ 5     // 比如父类的构造函数\n 6     super(name, hp);\n 7     this.element = element;\n\
  \ 8     this.mana = mana;\n 9   }\n10   toString(){\n11     // 或者任何其他方法\n12    \
  \ return super.toString() + \", the \" + this.element +\" Wizard\";\n13   }\n14\
  \   castsSpell(spell, target){\n15     console.log(this + ' casts ' + spell + '\
  \ on ' + target);\n16     this.mana -= spell.mana;\n17     spell(target);\n18  \
  \ }\n19 }\n```\n\n同样，我们可以通过实例化一个“优雅的灰色巫师”来验证它的工作方式与之前一样：\n\n```\n 1 const classyGandalf\
  \ = new Wizard(/* name */ \"Classy Gandalf\",\n 2                              \
  \  /* element */ \"Grey\", \n 3                                /* hp */ 50, \n 4\
  \                                /* mana */ 50);\n 5 console.log('Classy Gandalf\
  \ is a ClassyWizard: ' + \n 6             (classyGandalf instanceof ClassyWizard));\n\
  \ 7 // => Classy Gandalf is a ClassyWizard: true\n 8 \n 9 console.log('Classy Gandalf\
  \ is a ClassyMinion: ' + \n10             (classyGandalf instanceof ClassyMinion));\n\
  11 // => Classy Gandalf is a ClassyMinion: true\n 12 \n13 console.log(classyGandalf.toString());\n\
  14 // => ClassyGandalf, the Grey Wizard\n 15 \n16 classyGandalf.castsSpell(lightningSpell,\
  \ classyOrc);\n17 // => Classy Gandalf, the Grey Wizard casts lightning spell \n\
  18 //    on classy orc\n19 // => A bolt of lightning electrifies classy orc(-10hp)\n\
  ```\n\n通过 ES6 类，我们可以用更少、更好的代码实现之前相同的结果。但需要强调的是，ES6 类仅仅是语法糖。在底层，你刚刚看到的这些 ES6 类等同于\
  \ `constructor function`/`prototype` 对。\n\n这就是你在 JavaScript 中模拟经典继承的方法。现在，让我们放眼更远。。\n\
  \n### 类之外的 OOP\n\n我们在这里陷入了困境。经典继承倾向于构建一种僵化的类型分类法，即某物要么是“巫师”，要么是“小兵”，但不能两者都是。*如果在\
  \ C# 中使用经典继承，我们该如何解决 Bard 的问题呢？* 嗯……\n\n1. 我们可以将 `castsSpell` 和 `steals` 方法都移动到基类\
  \ `SpellCastingStealingMin` 中，让三种类型都继承它。`ClassyThief` 在施法术时会抛出异常，`ClassyWizard`\
  \ 在偷窃时也是如此。这并不是一个好的方案（再见里氏替换原则）。\n\n2. 我们可以创建一个 `SpellCastingStealingion`，复制 `ClassyThief`\
  \ 和 `ClassyWizard` 的功能，并让 `Bard` 继承自它。这种方案意味着代码重复，从而增加了维护负担。\n\n3. 我们可以为这些行为定义接口\
  \ `ICanSteal`、`ICanCastSpells` 并让每个类实现这些接口。这样更好，但我们需要在每个独立的类中提供特定的实现。这里没有多少代码复用。\n\
  \n4. 我们可以像上一种方案那样，但将偷窃和施法的实现委托给另一个类，供巫师、小兵和诗人复用。这可以实现更多的代码复用，但需要大量额外的人为管道来完成委托。\n\
  \n因此，这些方案都不非常有吸引力：它们涉及糟糕的设计、代码重复或二者兼有。*JavaScript 能帮助我们为这个问题提供更好的解决方案吗？* **是的！它可以！**\n\
  \n想象一下，我们将所有这些行为拆解并封装在独立的对象中（`canCastSpells`、`canSteal` 和 `canPlayMusic`）：\n\n\n\
  \n\n\n```javascript\n 1 const canCastSpells = {\n 2   castsSpell(spell, target){\n\
  \ 3     console.log(this + ' casts ' + spell + ' on ' + target);\n 4     this.mana\
  \ -= spell.mana;\n 5     spell(target);\n 6   }\n 7 };\n 8 \n9 const canSteal =\
  \ {\n10   steals(target, item){\n11     console.log(`${this} steals ${item} from\
  \ ${target}`);\n12   }\n13 };\n14 \n15 const canPlayMusic = {\n16   playsMusic(){\n\
  17     console.log(`${this} grabs his ${this.instrument} ` + \n18              \
  \   `and starts playing music`);\n19   }\n20 };\n21 \n22 // 通过名称识别角色的额外行为！\n23 const\
  \ canBeIdentifiedByName = {\n24   toString(){\n25     return this.name;\n26   }\n\
  27 };\n```\n\n现在，我们已经将每个行为封装在独立的对象中，可以将它们组合在一起，为 `wizard`（魔法师）、`thief`（盗贼）和 `bard`（吟游）提供必要的功能：\n\
  \n```javascript\n 1 // 现在我们可以通过组合这些\n 2 // 行为来创建我们的对象\n 3 function TheWizard(element,\
  \ mana, name, hp){\n 4   const wizard = {element, \n 6                 mana, \n\
  \ 7                 name, \n 8                 hp};\n9   Object.assign(wizard, \n\
  10                canBeIdentifiedByName,\n11                canCastSpells);\n12\
  \   return wizard;\n 13 }\n 4 \n15 function TheThief(name, hp){\n16   const thief\
  \ = {name, \n17                hp};\n18   Object.assign(thief,\n19             \
  \   canBeIdentifiedByName,\n20                canSteal);\n21   return thief;\n22\
  \ }\n 23 \n24 function TheBard(instrument, mana, name, hp){\n25   const bard = {instrument,\
  \ \n26                 mana, \n27                 name, \n28                 hp};\n\
  29   Object.assign(bard,\n30                canBeIdentifiedByName,\n31         \
  \       canSteal,\n32                canCastSpells,\n33                canPlayMusic);\n\
  34   return bard;\n35 }\n```\n\n通过一种非常直观的方式，我们可以看到 `wizard` 是一个会施法术的人，`thief` 是一个会偷东西的人，而\
  \ `bard` 是一个不仅会施法术和偷东西，还会演奏音乐的人。通过跳出经典继承和静态类型系统的僵化限制，我们进入了一个可以非常灵活且可扩展地复用行为并组合新对象的境界。\n\
  \n我们可以验证这种方法确实运行得完美。`Wizard` 施了强大的法术：\n\n```javascript\n1 const wizard = TheWizard('fire',\
  \ 100, 'Randalf, the Red', 10);\n2 \n3 wizard.castsSpell(lightningSpell, orc);\n\
  4 // => Randalf, the Red casts lightning spell on orc\n5 // => 一道闪电击中了 orc(-10hp)\n\
  ```\n\n`Thief` 潜悄靠近你并偷东西：\n\n```javascript\n1 const thief = TheThief('Locke Lamora',\
  \ 100);\n2 \n3 thief.steals('orc', /*item*/ 'gold coin');\n4 // => Locke Lamora\
  \ steals gold coin from orc\n```\n\n而 `Bard`，这位真正才华横溢的 `Bard`，施法术、偷东西并演奏音乐：\n\n\
  ```javascript\n 1 const bard = TheBard('lute', 100, 'Kvothe', 100);\n 2 \n3 bard.castsSpell(lightningSpell,\
  \ orc);\n4 // => Kvothe casts lightning spell on orc\n5 // => 一道闪电击中了 orc(-10hp)\n\
  \ 6 \n7 bard.steals('orc', /*item*/ 'sandwich');\n8 // => Kvothe steals sandwich\
  \ from orc\n 9 \n10 bard.playsMusic();\n11 // => Kvothe grabs his lute and starts\
  \ playing music\n```\n\n示例中的 `Object.assign` 是 ES6 方法，允许你用其他对象扩展对象。这实际上就是我们提到的“组合型原型继承”。\n\
  \n### 对象召唤者进阶之路\n\n#### 召唤基础：面向对象编程简介\n在**Summoning Fundamentals: an Introduction\
  \ to Object Oriented Programming in JavaScript**中，你将从开始理解定义和实例化对象所需的基础结构。在本章中，构造函数和\
  \ `new` 运算符将与你目前发现的知识相结合。你将回顾如何实现信息隐藏，学习 JavaScript 原型继承模型的基础知识，以及你如何使用它来复用行为并优化内存占用。\n\
  \n#### JavaScript 中的白色召唤或在 JavaScript 中模拟经典继承\n在**White Summoning or Emulating Classical\
  \ Inheritance in JavaScript**中，你将结合构造函数和原型，在 JavaScript 中创建等同于 `C#` 类的内容。然后你将进一步推向\
  \ JavaScript 继承模型的边界，通过方法扩展和重写来模拟像 C# 那样的构建继承链。\n\n#### 进阶白色召唤：ES6 类的魔力\n在**White\
  \ Summoning Enhanced: the Marvels of ES6 Classes**中，你将学习新的 `ES6 Class` 语法以及它如何提供更好的类体验。\n\
  \n\n\n\n最后，我们将通过查看 `TypeScript` 来完成召唤者（Summoner）之路。TypeScript 提供了你在网上可以找到的最接近 C#\
  \ 的体验。它是 JavaScript 的超集，通过新功能和类型注解增强了你的开发体验。这些类型注解为 JavaScript 引入了静态类型，但它们足够灵活，不会牺牲\
  \ JavaScript 的动态特性。\n\n## 结语\n\nJavaScript 是一门非常多功能的语言，支持许多编程范式和不同的面向对象风格。在接下来的章节中，你将看到如何通过组合少量的原始构造结构和技术来实现各种\
  \ OOP 风格。\n\nJavaScript 与语言的任何其他部分一样，在处理对象时赋予了你极大的自由，有时你会觉得有太多的选项和可以做的事情，以至于不知道什么是正确的路径。因此，我将尽力为你提供指导，并重点介绍每个可用选项的优缺点。\n\
  \n**准备好学习一些 JavaScript OOP 吧！**\n\n## 召唤者基础：封装与信息隐藏\n\n```\n 封装意味着划定边界。\n 内部有东西，\n\
  \ 外部有东西。\n\n 信息隐藏意味着隐藏细节，\n 避免无意的耦合，\n\n 前者是一种能力，\n 后者是一个设计决策\n\n        - Dacun\
  \ Whirnnmar\n        神圣索引的守护者 \n```\n\n### 让我们从 OOP 的基础开始！\n\n是时候开始建立自己的对象军队了！在这些介绍章节中，你将学习\
  \ JavaScript 面向对象编程的基础。在每一章中，我们将遍历 OOP 的每一个经典支柱：`封装`、`继承`和`多态`。\n\n我们将首先查看 `封装`\
  \ 原则，以及如何通过`对象初始化器`（object initializers）和`构造函数`（constructor functions）创建对象。你还将复习你手头可以实现`信息隐藏`的技巧。我们将通过比较`对象初始化器`、`工厂`（factories）和`构造函数`来结束本章，以尝试理解它们的优缺点。\n\
  \n在接下来的章节中，你将学习 JavaScript 的`原型继承`和`多态`，并理解它们与我们在 C# 中习惯的模式有何不同。\n\n### 封装：在 JavaScript\
  \ 中创建对象\n\n**封装的原理是将数据和操作这些数据的函数一起放在单个组件中**。在某些定义中，它包含了`信息隐藏`（或数据隐藏）原则，即通过定义一个清晰的、从消费者角度来看是安全的边界或接口，来向消费者隐藏实现细节的能力。\n\
  \n信息隐藏允许作者更改隐藏的实现细节，而不破坏由组件公共接口建立的契约。因此，作者和消费者都可以继续开发，而互不干扰：作者可以调整其实现方式，而消费者可以放心作者不会破坏她的代码。\n\
  \n在本章中，我们将`封装`与`数据隐藏`分开，因为 JavaScript 使用了不同的方法来解决这些中的每一个问题。\n\n让我们从`封装`开始。JavaScript\
  \ 提供了实现`封装`的不同策略：\n\n*   对象初始化器\n*   构造函数\n*   ES6 类\n\n我们现在来看前两个，并在书后面用整个章节来讲解\
  \ `ES6 类`。\n\n### 对象初始化器\n\n在理解 JavaScript 对象基础中，你学习了使用`对象初始化器`（也称为对象字面量）的复杂之处。\n\
  \n使用对象初始化器创建新对象非常简单：\n\n```\n1 // 创建简单的对象\n2 let object = {};\n3 console.log(object);\n\
  4 // => [object Object] { ... }\n```\n\n在你的对象中定义任意数量的属性和方法也是如此：\n\n```\n 1 // 你可以创建具有任意数量\n\
  \ 2 // 属性和方法的对象\n 3 let minion = {\n4   hp: 10,\n5   name: 'minion',\n6   toString(){\
  \ return this.name;}\n7 };\n8 \n9 console.log(minion);\n10 // => [object Object]\
  \ {\n11 //  hp: 10,\n12 //  name: \"minion\",\n13 //  toString: function toString()\
  \ {\n14 //    return this.name;\n15 //  }\n16 // }\n```\n\n你甚至可以在对象创建后对其进行增强：\n\n\
  ```\n1 minion.armor = 'chain mail';\n2 console.log(minion.armor);\n3 // => chain\
  \ mail\n```\n\n并使用`工厂函数`（factory functions）来辅助对象创建：\n\n```\n1 // 我们可以使用工厂来简化对象的创建\n\
  2 function createMinion(name, hp=10){\n3   return {\n4     hp: hp,\n5     name:\
  \ name,\n6     toString: function(){ return this.name;}\n7   };\n8 }\n```\n\n依赖新的\
  \ ES6 简写语法，我们可以用更简洁的方式重写工厂函数：\n\n```\n1 // 我们可以使用工厂来简化对象的创建\n2 function createMinion(name,\
  \ hp=10){\n3   return {\n4     hp,\n5     name,\n6     toString(){ return this.name;}\n\
  7   };\n8 }\n```\n\n当你对你的工厂函数满意后，只需调用它来创建一个新对象并像你的那样使用它：\n\n```\n1 let orc = createMinion('orc',\
  \ 100);\n2 \n3 console.log(orc);\n4 // => [object Object] {\n5 //  hp: 100,\n6 //\
  \  name: \"orc\",\n7 //  toString: function() {\n8 //    return this.name;\n9 //\
  \  }\n10 }\n```\n\n### 构造函数与 new 运算符\n\n在上节中，我们看到了如何使用对象初始化器创建对象：\n\n```\n1 let\
  \ object = {};\n```\n\n我们可以通过将 `new` 运算符应用于构造函数来获得相同的结果。上述语句的等效写法如下：\n\n```\n1 let\
  \ anotherObject = new Object();\n2 \n3 console.log(anotherObject);\n4 // => [object\
  \ Object] { ... }\n```\n\n虽然 `Object` 函数创建空对象，但你可以对 JavaScript 中的任何函数应用 `new` 运算符来实例化你自己的对象。\n\
  \n使用 `new` 运算符调用的函数被称为构造函数：\n\n```\n 1 function Minion(name='minion', hp=10){\n\
  2   this.hp = hp;\n3   this.name = name;\n4   this.toString = () => this.name;\n\
  5 };\n6\n7 let anotherMinion = new Minion();\n8 console.log(anotherMinion);\n9 //\
  \ => [object Object] {\n10 //  hp: 10,\n11 //  name: \"minion\",\n12 //  toString:\
  \ () => this.name\n13 }\n```\n\n这个示例首先强调的重点是，虽然我们在 C# 中在类上使用 `new` 运算符来实例化新对象，但在\
  \ JavaScript 中，我们在构造函数上使用它。构造函数在某种程度上充当了自定义类型和类定义，因为它定义了我们在调用时将创建的对象的属性和方法。\n\n\
  我们可以使用 `instanceof` 运算符来证实这一点。`instanceof` 允许你验证对象是否具有给定类型。使用上一个示例中的 `anotherMinion`，我们可以快速验证它确实是\
  \ `Minion` 类型：\n\n```\n1 console.log(`anotherMinion is a Minion: ` +\n2        \
  \     ` ${anotherMinion instanceof Minion}`);\n3 // => anotherMinion is a Minion:\
  \ true\n4 \n5 console.log(`anotherMinion is an Object: ` + \n6             `${anotherMinion\
  \ instanceof Object}`);\n7 // => anotherMinion is an Object: true\n```\n\n\n\n\n\
  现在花点时间检查一下 `Minion` *构造函数*，并将其与上一节中的*工厂函数*进行比较。你会发现它们略有不同。在*工厂函数*中，我们通过*对象初始化器*创建一个对象然后将其返回。然而，在当前的示例中，从我们能看到的，并没有对象被创建或返回。*这里到底发生了什么？那么对象是如何创建的呢？*\n\
  \n这都归功于 `new` 操作符。当你对一个函数使用 `new` 操作符时，后台会发生几件我们肉眼看不见的事情：\n\n1. 首先，**创建一个空对象并将其设置为正在执行函数的\
  \ `this`**。这意味着，`this` 关键字指向的是一个刚刚创建的新对象。\n\n2. 如果构造函数具有 `prototype`（原型），则该新对象将获得该原型（关于原型的更多内容将在下一章介绍）。\n\
  \n3. 之后，会调用函数体。在上面的示例中，我们为对象添加了一些属性：`hp`、`name` 和 `toString`。\n\n4. **最后返回 `this`\
  \ 的值**。这是隐式完成的，不需要我们做任何操作。而且正如你从上面的示例中看到的，对象被成功创建了。\n\n但如果我们从*构造函数*中显式地返回内容会发生什么呢？这取决于你返回了什么。假设我们尝试返回一个原始类型，如\
  \ `string`：\n\n```\n 1 // 如果你尝试返回原始类型，它会被忽略\n 2 function MinionOrBanana(name='minion',\
  \ hp=10){\n 3   this.hp = hp;\n 4   this.name = name;\n 5   return 'banana'; \n\
  \ 6 }\n 7 \n 8 let isItAMinionOrIsItABanana = new MinionOrBanana();\n 9 console.log(isItAMinionOrIsItABanana)\n\
  10 // => [object Object] {\n11 //  hp: 10,\n12 //  name: \"minion\"\n13 //}\n```\n\
  \n在上面的示例中，我们可以看到如果我们显式返回字符串，JavaScript 将将完全忽略它并返回构造的对象（`this`）。这适用于所有原始类型。\n\n*如果我们返回一个对象会发生什么？*\n\
  \n```\n 1 // 如果你尝试返回一个对象，它会被返回\n 2 // 而不是 `this` 对象\n 3 function MinionOrBanana(name='minion',\
  \ hp=10){\n 4   this.hp = hp;\n 5   this.name = name;\n 6   return {name: 'banana'};\
  \ \n 7 }\n 8 \n 9 let isItAMinionOrIsItABanana = new MinionOrBanana();\n10 console.log(isItAMinionOrIsItABanana)\n\
  11 // => [object Object] {\n12 //  name: \"banana\"\n13 //}\n```\n\n如果你尝试显式返回一个对象（如上面的\
  \ `{name: 'banana'}`），这个对象将被返回，而你的原始对象（作为 `this` 注入到*构造函数*中的那个）将被忽略。\n\n你可能已经注意到我使用大写字母命名*构造函数*\
  \ `Minion`，而不是遵循常用的 JavaScript 驼峰命名法（`minion`）。*为什么呢？* 使用大写字母命名*构造函数*是 JavaScript\
  \ 社区中一种流行的约定，用来与其他函数区分开来。这种约定是为了告诉 API 的使用者，在调用这些函数时应该使用 `new` 操作符，而不是直接调用它们。但*为什么我们需要区分它们呢？它们不不都是函数吗？*\n\
  \n嗯，考虑一下如果不使用 `new` 操作符调用*构造函数*会发生什么：\n\n```\n1 let yetAnotherMinion = Minion();\n\
  2 console.log(yetAnotherMinion);\n3 // => undefined\n```\n\n*嗯，没有返回对象……但为什么呢？* 你还记得当函数在没有上下文的情况下被调用时\
  \ `this` 发生了什么吗？是的！没错！当我们在没有上下文的情况下调用函数时，`this` 的值就会被设置为`Window 对象`（除非你处于`strict\
  \ mode`，否则它将是 `undefined`）。*那么这里发生了什么？*通过不使用 `new` 操作符调用*构造函数*，该函数在`Window 对象`的上下文中求值，我们并没有创建一个新对象，而是向`Window\
  \ 对象`扩展了两个新属性 `hp` 和 `name`。哎呀！\n\n```\n1 console.log(window.hp);\n2 // => 10\n\
  3 console.log(window.name);\n4 // => 'minion'\n```\n\n如果我们在*strict mode*下犯了同样的错误，我们会立即收到一个错误，这会更快地提醒我们出现了非常糟糕的错误：\n\
  \n```\n1 let yetAnotherMinion = Minion();\n2 // => TypeError: Cannot set property\
  \ 'hp' of undefined\n3 // wat\n```\n\n这就是为什么我们通常在编写*构造函数*时使用大写字母表示法。我们希望避免毫无防备的开发者忘记使用\
  \ `new` 操作符，从而在程序中导致奇怪的副作用或错误。\n\n但约定并不是非常可靠的东西，对吧？难道有一种万无一失的方法来保护我们的构造函数更好，这样即使我们忘记使用\
  \ `new` 操作符，它们仍然可以工作吗？\n\n我们人类很容易出错……通过遵循这种模式来突出开发过程中的问题：\n\n```\n1 function MinionSafe(name='minion',\
  \ hp=10){\n2   'use strict';\n3   if (!this) return;\n4 \n5   this.name = name;\n\
  6   this.hp = hp;\n7 }\n```\n\n现在无论我们如何调用*构造函数*都不重要了。使用 `new` 调用：\n\n```\n1 console.log('using\
  \ operator: ', new MinionSafe());\n2 // => [object Object] {\n3  hp: 10,\n4  name:\
  \ \"minion\"\n5 //}\n```\n\n不使用 `new` 调用：\n\n```\n1 console.log('using function:\
  \ ', MinionSafe());\n2 // => [object Object] {\n3  hp: 10,\n4  name: \"minion\"\n\
  5 //}\n```\n\n它会按预期工作。太棒了！但我们可以改进它吗？如果我们不需要为每个每个构造函数编写守护语句不是更好吗？\n\n函数式编程来救援！我们可以定义一个\
  \ `safeConstructor` 函数，它代表了守护语句的抽象，并可以与任何构造函数组合：\n\n```\n1 function safeConstructor(constructorFn)\
  \ {\n2   return function() {\n3     return new constructorFn(...arguments); // ES6\n\
  4     // return new (constructorFn.bind.apply(null, arguments)); // ES5\n5   }\n\
  6 }\n```\n\n`safeConstructor` 函数接收一个构造函数作为参数（`constructorFn`），并返回一个新函数，无论什么情况下都会调用\
  \ `new` 操作符。你可以将这个新函数视为一个改进或增强的*构造函数*。\n\n从现在起，可以使用此函数来保护应用程序中的任何构造函数：\n\n```\n\
  // function Minion(name='minion', hp=10){\n//    etc...\n// }\nlet SafeMinion =\
  \ safeConstructor(Minion);\n```\n\n通过将 `safeConstructor` 与 `Minion`*构造函数*组合，我们得到了一个新的函数\
  \ `SafeMinion`，即使我们忘记使用 `new` 操作符它也能工作：\n\n```\n1 console.log(`using function: ${SafeMinion('orc',\
  \ 110)}`);\n2 // => using function: [object Object] etc...\n3 console.log(`using\
  \ new operator: ${new SafeMinion('pirate', 50)}`);\n4 // => \"using new operator:\
  \ [object Object] etc...\"\n```\n\n### JavaScript 中的数据隐藏\n\n在理解 JavaScript 对象基础\
  \ 中，你学习了两种在 JavaScript 中实现数据隐藏模式：*closures*和*ES6 symbols*。在这两种模式中，只有*closures*提供了真正的数据隐私性，而\
  \ *ES6 symbols* 只是让访问“私有”数据变得不方便。\n\n由于构造函数只是函数，你可以利用闭包和 *ES6 symbols* 来创建私有属性和方法。使用闭包非常简单，只需在你的函数构造函数体中声明变量，并在你想要暴露的方法中引用它们：\n\
  \n\n\n\n\n```javascript\n 1 // just like factory methods you can implement data\
  \ privacy \n 2 // using closures with constructor functions\nfunction WalkingMinion(name='minion',\
  \ hp=10){\n  let position = {x: 0, y: 0};\n  \n  this.hp = hp;\n  this.name = name;\n\
  \  this.toString = () => this.name;\n  \n  // this function is a closure\n  // that\
  \ encloses the position variable\n  this.walksTo = (x,y) => {\n    console.log(`${this}\
  \ walks from (${position.x}, ${position.y}) ` + \n                ` to (${x}, ${y})`);\n\
  \    position.x = x;\n    position.y = y;\n  };\n\n};\n```\n\n在这个示例中，我们有一个名为 `WalkingMinion`\
  \ 的构造函数，可以用它来创建许多微小的行走小兵。在函数内部，我们声明了一个变量 `position`，它代表小人在二维空间中的位置，并定义了一个 `walksTo`\
  \ 方法，允许小人在该空间内移动。`walksTo` 方法是一个闭包，因为它封装了 `position` 变量的值。\n\n如果你仔细观察这个构造函数，你会发现\
  \ `position` 变量并不是所创建对象的属性。也就是说，我们从没有向 `this` 对象添加过 `position` 属性。结果是，使用该函数创建的小兵在任何意义上都拥有一个私有属性\
  \ `position`，并将任何调用者对其的交互限制在使用 `walksTo` 方法上。封装的妙之处允许我们调用此方法来命令每个小兵行走，而无需暴露定位系统的实际实现（在这种情况下，它只是一个带有\
  \ `x` 和 `y` 属性的对象）。\n\n事实上，如果我们使用上述构造函数实例化一个 `walkingMinion`，我们可以看到没有办法访问 `position`\
  \ 属性：\n\n```javascript\n1 let walkingMinion = new WalkingMinion();\n2 console.log(walkingMinion.position);\n\
  3 // => undefined\n```\n\n`position` 属性并不属于对象本身，但它实际上是其内部状态的一部分，因为该变量已经被 `walksTo`\
  \ 函数封装或捕获。这意味着 `walksTo` 方法可以读取或更新 `position` 属性的状态，如下所示：\n\n```javascript\n1 walkingMinion.walksTo(2,\
  \ 2)\n2 // => minion walks from (0, 0) to (2, 2)\n3 walkingMinion.walksTo(3,3)\n\
  4 // => minion walks from (2, 2) to (3, 3)\n```\n\n除了通过闭包实现数据隐藏外，你还可以使用 ES6 符号（symbols）：\n\
  \n```javascript\n 1 function FlyingMinion(name='minion', hp=10){\n 2 let position\
  \ = Symbol('position');\n 3\n 4 this.hp = hp;\n 5 this.name = name;\n 6 this.toString\
  \ = () => this.name;\n \n 8 this[position] = {x: 0, y: 0};\n 9 this.fliesTo = (x,y)\
  \ => {\n10   console.log(`${this} flies like the wind from (${this[position].x},\
  \ ` +\n11               `${this[position].y}) to (${x}, ${y})`);\n12   this[position].x\
  \ = x;\n13   this[position].y = y;\n14 };\n15 };\n```\n\n并获得与我们在闭包中看到的相似行为。也就是说，没有明显的方法从\
  \ `FlyingMinion` 对象外部访问 `position` 属性：\n\n```javascript\n1 // 再次你（几乎）无法访问 position\
  \ 属性\n2 let flyingMinion = new FlyingMinion();\n3 console.log(flyingMinion.position);\n\
  4 // => undefined\n```\n\n但我们可以通过它的接口通过 `fliesTo` 方法来实现：\n\n```javascript\n1 flyingMinion.fliesTo(1,1);\n\
  2 // => minion flies like the wind from (0, 0) to (1, 1)\n3 flyingMinion.fliesTo(3,3);\n\
  4 // => minion flies like the wind from (1, 1) to (3, 3)\n```\n\n注意，尽管 ES6 符号提供了私有性的象，但它们并没有提供真正的私有性。你始终可以使用\
  \ `Object.getOwnPropertySymbols` 或 `Reflect.ownKeys` 方法从对象获取符号，从而获取其“私有”属性。因此，优于使用闭包而不是符号，你可以用更少的代码实现真正的数据隐藏。\n\
  \n### 对象初始化器 vs 构造函数\n\n| 对象初始化器 | 构造函数 |\n| --- | --- |\n| 易于编写、方便且易于读 | 稍微复杂一点。它们看起来像普通函数，但你需要以不同的方式实现它们，因为\
  \ `new` 运算符会将新对象作为函数的上下文（`this`） |\n| 对象的单次创建 | 你可以复用它们来创建许多对象 |\n| | |\n| 它们仅通过\
  \ ES6 符号支持信息隐藏 | 它们通过 ES6 符号和闭包支持信息隐藏 |\n| 定义 getter 和 setter 的语法非常简单 | 定义 getter\
  \ 和 setter 的唯一方法是使用 `Object.defineProperty` |\n| 你不子类型且无法使用 `instanceof`，但依赖多态比检查类型要好得多\
  \ | 允许创建自定义类型并能够使用 `instanceof` |\n| | 不使用 `new` 调用构造函数可能会导致 bug 和意外的副作用，除非你采取了预防措施\
  \ |\n\n### 对象工厂 vs 构造函数\n\n| 对象初始化器 + 工厂函数 | 构造函数 |\n| --- | --- |\n| 易于编写、方便且易于读。工厂函数就像普通函数，不需要担心\
  \ `this` | 稍微复杂一点。它们看起来像普通函数，但你需要以不同的方式实现它们，因为 `new` 运算符会将新对象作为函数的上下文（`this`）。 |\n\
  | 你可以复用它们来创建许多对象 | 你可以复用它们来创建许多对象 |\n| 它们通过 ES6 符号和闭包支持信息隐藏 | 它们通过 ES6 符号和闭包支持信息隐藏\
  \ |\n| 定义 getter（只读属性）和 setter 的语法非常简单 | 定义 getter 和 setter 的唯一方法是使用 `Object.defineProperty`\
  \ |\n| 你你不子类型且无法使用 `instanceof`，但依赖多态比检查类型要好得多 | 允许创建自定义类型并能够使用 `instanceof` |\n\
  | 工厂函数与其他任何函数一样工作。不需要使用 `new`，因此不需要记住使用它或防止忘记。它们很容易与其他函数组合 | |\n\n### 总结\n\n在本章中，你学习了\
  \ JavaScript 面向编程的第一部分——**封装**，以及如何使用*对象初始化器*、*工厂函数*和*构造函数*来实现它。\n\n*对象初始化器*类似于\
  \ C# 的对象字面量。它们使用非常直接且易于读，但你只能用它们创建一次性对象，并且它们仅通过 ES6 符号允许*信息隐藏*（这比基于约定的信息隐藏稍微好一点）。\n\
  \n你可以通过将*对象初始化器*封装在*工厂函数*中来增强它们。工厂函数让你能够创建许多相同类型的对象，并通过闭包实现了真正的*信息隐藏*。\n\n\n\n\n\
  最后，你可以使用 `constructor functions`（构造函数）作为封装的一种方法。`constructor function` 允许你定义自定义类型，并包含自定义的属性和方法。我们通过增强在用\
  \ `new` 运算符调用函数时传递给函数的对象（`this`）来实现这一点。由于构造函数本质上是函数，它们支持通过 ES6 symbol 和闭包来实现`信息隐藏`。同时，它们的行为与普通函数略有不同，因为它们期望被用\
  \ `new` 运算符调用，并有一个需要被增强的 `this` 对象。这意味着如果它们被当作普通函数调用，可能会导致 bug 并产生意想不到的副作用。我们可以通过实现一个防御机制，防止在没有使用\
  \ `new` 运算符的情况下直接调用构造函数，来规范这种缺陷。\n\n在下一章中，你将发现 JavaScript 面向对象编程的下一个特性：**原型继承**。\n\
  \n# 召唤基础：原型继承\n\n```\n Don't Repeat Yourself\n\n        - Tunh Ynad\n        Guildmaster\
  \ School of Pragmatics,\n        Principles \n```\n\n## 不要重复自己。继承！\n\n在上一章中，你学习了如何通过使用\
  \ `object initializers`（对象初始化器）、`factory functions`（工厂函数）和 `constructor functions`（构造函数）在\
  \ JavaScript 中实现`封装`。对象初始化器对你来说应该非常熟悉，因为 C# 有对象字面量；工厂函数类似于 C# 的工厂方法；而构造函数与类构造函数也没有太大区别。当你发现如何通过\
  \ `closures`（闭包）和 `ES6 symbols` 实现数据隐藏时，事情开始变得有点奇怪，因为这两个概念对 C# 来说相当陌生。通向 OOP 大师之路的下一步是**继承**，请注意，因为事情将变得更加诡异了。\n\
  \n在 C# 中，你可以通过派生具体类、抽象类或实现接口来实现继承。无论通过哪种方式，**继承是代码复用和多态的机制**。一方面，每当你想要在多个类之间共享某种行为以避免代码重复时，你就会使用继承。另一方面，你使用它来实现灵活且可扩展的面向对象设计，其中特定的接口在运行时被具体的实现所替换。\n\
  \nJavaScript 的继承与你在 C# 中习惯的模式大不相同，这主要归于两个原因：\n\n*首先，JavaScript 并不依赖继承来实现多态。它毕竟是一门动态语言，通过鸭子类型（duck\
  \ typing）运行。这意味着在 JavaScript 中，继承主要是一种代码复用技术。其次，更为重要的一是，JavaScript 支持另一种与传统或基于类的继承完全不同的继承形式：**原型继承（Prototypical\
  \ Inheritance）**。\n\n*你说原型继承？*\n\n是的！JavaScript 展示了一种特殊的继承方式，对象的蓝图实际上是——*鼓点*——另一个对象。这种充当蓝图的角色通常由\
  \ C# 和其他静态类型语言中强大的类承担。在像 JavaScript 这样具有原型继承的语言中，它由谦逊的对象完成。在原型继承的上下文中，一切都是关于根据其他对象进行建模，而这些对象从此被称为**原型（prototypes）**。在这个对象的宇宙中，任何单一对象都可以基于某个原型，继承其所有的属性和方法，然后在其基础上拥有自己特定的属性和方法。这不需要类。\n\
  \n所以，如果你只需要对象，**JavaScript 的原型继承与 C# 的经典继承相比如何？**\n\n### 经典继承 vs 原型继承\n\n从高层面上来看，C#\
  \ 经典继承与 JavaScript 原型继承的对比如下：\n\n| C# 经典继承 | JavaScript - 原型继承 |\n| --- | --- |\n\
  | 关注类 | 关注对象 |\n| 类在运行时无法修改：你定义了一个包含系列方法和属性的类，且你不能在运行时添加新方法或属性，也不能修改现有的。 | 原型比类更灵活、更可扩展。它们可以是不可变的，但你也有在运行时扩展或修改它们的选项。当你这样做时，会影响所有继承该原型的对象。\
  \ |\n| 你拥有类、抽象类、接口、对象、override、virtual、sealed 等。 | 你主要拥有对象。根据你的偏好，你可能有类、构造函数、工厂等。但总的来说，这是一个更简单的模型，需要的元素和规则更少。\
  \ |\n| C# 类促进了严谨的分类法。这需要大量的额外代码和技巧来实现良好的设计。 | JavaScript 原型继承更灵活。组合对象非常直观。 |\n|\
  \ C# 不支持多继承 | JavaScript 允许你使用任意数量的原型组合对象，实现类似于多继承的效果。 |\n| C# 对信息隐藏有很好的支持 | JavaScript\
  \ 通过闭包和 symbol 实现信息隐藏。 |\n\n在 C# 关注类和创建分类法时， JavaScript 关注对象，并可以实现比 C# 对应物更灵活、更可扩展的无类继承。C#\
  \ 类在运行时是不可变的，而 JavaScript 原型可以在任何时间点被增强或修改。C# 提供了许多关键字和结构，让你能够非常详尽且明确地规定他人如何与你创建的类进行交互，而\
  \ JavaScript 抛弃了这些概念，转而采用更简单的继承模型。C# 为如何进行继承提供了一条非常清晰且带有主观倾向的路径，而 JavaScript 给予你的自由以至于有时会让人无所畏。\n\
  \n现在我们已经了解了 C# 和 JavaScript 继承模型之间的差异，让我们深入研究原型继承，看看它在实际代码中意味着什么。\n\n## JavaScript\
  \ 原型继承\n\n我们可以区分两种类型的*原型继承*：\n\n第一种也是最常见的，是**基于委托的继承（delegation-based inheritance）**。在基于委托的继承中，对象和原型建立了所谓的**原型链（prototypical\
  \ chain）**或**原型链（prototype chain）**，其中属性或方法的调用从对象分发或委托给原型。\n\n第二种是**拼接式继承（concatenative\
  \ inheritance）**。在这种继承类型中，对象与原型合并，从而获得了它的属性和方法。对象与原型的合并是将原型的属性复制或拼接到对象中。\n\n但是，**什么是对象原型？**\n\
  \n### 对象原型\n\n任何对象都可以是原型。一个对象之所以成为原型，是因为另一个对象*指定*它为自己的原型。就如此简单。\n\n指定一个对象为原型的方法取决于你创建新对象的方法：\n\
  \n*   对象初始化器\n*   `Object.create`\n*   构造函数\n\n让我们轮流回顾这些方法：\n\n#### 使用对象初始化器的对象原型\n\
  \n当你使用*对象初始化器*时，可以通过 `__proto__` 属性定义*原型*。如果你将对象 `O` 的此属性设置为另一个对象 `P`，那么 `P` 实际上就成为了一个*原型*。\n\
  \n例如，如果我们有之前示例中的 `minion`：\n\n```javascript\nlet minion = {\n  hp: 10,\n  name:\
  \ 'minion',\n  toString(){ \n    return this.name;\n  }\n};\n```\n\n\n\n然后我们设计了一个新法术来召唤一只\
  \ `giantScorpion`。我们可以通过它的 `__proto__` 属性（ES6 ^(10)可用）将 `minion` 设置为 `giantScorpion`\
  \ 的原型：\n\n```\n1 let giantScorpion = {\n2   // 在这里我们将 minion 设置为原型\n3   '__proto__':\
  \ minion, \n4   name: 'scorpion',\n5   stings() { \n6     console.log(`${this} pierces\
  \ your shoulder with its venomous sting`); \n7   }\n8 }\n```\n\n搞定！现在 `minion` 成了\
  \ `giantScorpion` 的原型，也就是说它们之间存在`原型继承` 关系。如果我们尝试通过 `giantScorpion` 访问仅存在于 `minion`\
  \ 中的属性，我们就能看到`原型链` 挥作用作用了：\n\n```\n1 // 通过原型链访问原型属性\n2 console.log(`giant scorpion\
  \ has ${giantScorpion.hp} hit points`);\n3 // => giant scorpion has 10 hit points\n\
  ```\n\n确实，我们可以看到本身没有 `hp` 属性的 `giantScorpion` 是如何访问其原型的 `hp` 属性的。那么两者共享的 `name`\
  \ 属性又是怎样的呢？\n\n```\n1 // 如果一个属性在对象和它的原型之间共享\n2 // 不需要遍历原型链\n3 // 最近的属性胜出\n4 giantScorpion.stings();\n\
  5 // => scorpion pierces your shoulder with its venomous sting\n```\n\n在上面的示例中，我们调用了\
  \ `stings` 方法，该方法反过来调用了 `toString` 方法并返回 `this.name`。由于 `name` 变量存在于 `giantScorpion`\
  \ 对象中，因此不需要遍历原型链。结果是属性 `giantScorpion.name` 被用于生成 `giantScorpion` 的字符串表示，我们得到了 `\"\
  scorpion pierces your shoulder...\"`（而不是 `\"minion pierces your shoulder...\"`）。\n\
  \n从这里开始，关于如何使用原型，你有两个选择：为每个对象实例使用一个原型实例，或者在多个对象之间共享一个原型。虽然没有什么阻止你为每个对象创建一个原型，但从代码重用的角度来看，继承的真正优势在于多个对象之间共享同一个原型：\n\
  \n```\n 1 let smallScorpion = {\n 2   // 在这里我们将 minion 设置为原型\n 3   '__proto__':\
  \ minion, \n 4   name: 'small scorpion',\n 5   stings() { \n 6     console.log(`${this}\
  \ pierces your shoulder with its tiny venomous sting`); \n 7   }\n 8 };\n 9 \n10\
  \ let giantSpider = {\n 11   // 在这里我们将 minion 设置为原型\n 12   '__proto__': minion,\
  \ \n 13   name: 'giant spider',\n 14   launchWeb() { \n 15     console.log(`${this}\
  \ launches a sticky web and immobilizes you`); \n 16   }\n 17 };\n```\n\n在这些示例中，`minion`\
  \ 原型中的属性和方法包含在一个对象中。这些属性通过原型链被 `giantScorpion`、`smallScorpion` 和 `giantSpider` 对象共享。如果我们忽略继承，需要在每个特定的派生对象中定义并分配它们，从而增加额外的内存占用。\n\
  \n你可能会想，等一下，`minion` 对象有一个 `hp` 属性，这不意味着所有派生对象都是耦合的吗？如果我改变其中一个对象中的 `hp`，会影响所有其他对象？\n\
  \n观察得很敏锐！当你对多个对象使用同一个原型时，你应该避免在原型中存储状态。虽然拥有数字或字符串等基本类型值的属性不会让你的对象耦合，但拥有数组或对象的属性肯定会使它们耦合。可以通过一个示例来更好地说明这一点。\n\
  \n首先，如果你尝试设置位于原型中的属性值，你只会在派生对象中创建一个新属性。这个新创建的属性将遮蔽（shadow）`prototype` 的对应属性。这就是为什么原型中具有基本类型值的属性某种程度上是`初始或默认值`：\n\
  \n```\n1 console.log(`Small scorpion has ${smallScorpion.hp} hp`);\n2 // => Small\
  \ scorpion has 10 hp\n3 smallScorpion.hp = 22;\n4 \n5 console.log(`Small scorpion\
  \ has ${smallScorpion.hp} hp`);\n6 // => Small scorpion has 22 hp\n7 \n8 console.log(`Giant\
  \ Spider *still* has ${giantSpider.hp}`);\n9 // => Giant spider still has 10 hp\n\
  ```\n\n然而，如果你尝试与持有对象或数组的原型属性交互，所有共享该原型的对象都会受到影响。\n\n假设你有一个 `minion` 原型，其中有一个数组表示的\
  \ `stomach` 属性，你的邪恶小兵在那里消化受害者。由于所有派生对象都共享 `minion` 作为原型，它们都将持有 `stomach` 属性的同一个引用。结果是，如果\
  \ `giantScorpion` 吃了一个 `elf`，那么 `giantSpider`（以及 `smallScorpion`）会显示相同的副作用：\n\n\
  ```\n 1 // 假设一个小兵有一个肚子\n 2 // 胃是多么奇妙的东西\n 3 minion.stomach = [];\n 4 \n 5 // 如果巨蝎子吃了一个精灵\n\
  \ 6 minion.stomach.push('elf')\n 7 \n 8 console.log(`giantScorpion stomach: ${giantScorpion.stomach}`);\n\
  \ 9 // => elf\n10 \n11 console.log(`giantSpider stomach: ${giantSpider.stomach}`);\n\
  12 // => elf\n13 \n14 console.log(`smallScorpion stomach: ${smallScorpion.stomach}`);\n\
  15 // => elf\n```\n*(注：此处根据上下文代码逻辑微调了翻译后的示例代码以符合逻辑，但保持了原意)* 修正：原文代码逻辑略有混乱，按原意翻译如下：\n\
