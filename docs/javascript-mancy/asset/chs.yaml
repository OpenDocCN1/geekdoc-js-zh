  \n## JavaScript 异步编程基础\n\n### 介绍\n\n## 回调 ### 回调地狱 ## 其他\n\n## 使用 Promises 的异步\n\
  \n## 使用 Async/Await 的异步\n\n## 响应式编程的异步\n\n```\ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text.\n\n                                - XXXX\
  \ Xxxxx,\n                                Some title, Some time \n```\n\n我听过的第一个关于\
  \ `Reactive Extensions`（响应式扩展）的演讲是在 2010 年在瑞典的一个 `.NET` 会议上。那时它看起来像是编写超响应（响应极快的意义）`WPF`\
  \ 应用的一种极佳方式。我惊讶地看着演讲者演示如何魔术般将大量各种异步操作编排成一组优美、声明且简洁的指令集。\n\n我当时看着它，赞叹不已，但再也没有见过它，自己也从未用过它，哪怕一次。是的……这种事情有时会发生\
  \ :)\n\n快回到今天，感觉 `Rx.js` 正在爆发（爆炸式增长！！！），像 `cycle.js` 这样的框架让你直接在 `Rx.js` 之上构建应用程序，而\
  \ `Angular2` 也选择了 `Rx.js` 作为其核心异步模式。\n\n[{% img blend center /images/rxjs-logo.png\
  \ 300 “Rx.js” “Rx.js Logo” %}](http://reactivex.io/)\n\n但什么是 `Rx.js`，它为什么如此流行且有用？\n\
  \n#### 让我们来发现吧\n\n#### JavaScript 与异步\n\nJavaScript 和异步是形影不离的。作为一个单线程运行时，JavaScript\
  \ 中的每个昂贵操作都是通过 `callbacks` 或最近通过 `promises` 以异步方式处理的。\n\n应用程序所需的用户体验越丰富，应用程序就变得越复杂，你就越需要熟练地编排各种异步操作：处理\
  \ DOM 事件、将它们与对 API 的异步请求混合、更多的 DOM 事件、更多的请求等。\n\n传统的异步模式（如 `callbacks`）在这种场景下扩展性不佳，因为它们会扰乱程序的流，不利于组合，而且在处理错误方面表现并不好。\n\
  \n`Promises` 在回调的基础上有了巨大的改进，因为它们可组合的，它们定义了非常统一的 API 和处理处理的清晰方法。然而，它们只能表达一个将在未来某个时间完成的单项任务。\n\
  \n这就是 `Observables` 和 `Rx.js` 登场的地方。`Rx.js` 将 promise 的概念泛化为随时间流过的异步数据序列，并提供了大量的操作符，帮助你以任何想要的方式处理该序列。\n\
  \n#### 在你被这些废话搞疯之前，先看这个示例\n\n*你可以在 jsFiddle(https://jsfiddle.net/vintharas/atq1Lpk2/)\
  \ 上找到此示例的源代码和在线演示。*\n\n让我们想象一个程序，每当你点击按钮时，你都想为虚拟飞镖游戏挑选一个随机玩家并显示出来。\n\n\n\n\n为了实现这一点，我们使用了\
  \ `flatMap`，它在这个示例中执行了几个操作。首先，它执行一个 `map` 操作，从而将数据从原始观测流（一个 `url`）转换为另一个观测流，后者代表向远程服务器发送请求的异步任务。其次，它“平坦化”（flatten）了生成的观测流，这样我们得到的不是一个观测流的观测流，而是一个响应的观测流，这更容易处理。\n\
  \n你可以通过弹性图（Marble diagrams）更清楚地看到 `map` 和 `flatMap` 之间的区别：\n\n```\n1 requests$ \
  \         -------u-------------u------->   u (url)\n2 requests$.map      ----------------------------->\
  \   R (response)\n3                           |             |\n4               \
  \            ----R--->     |\n5                                         ----R--->\
  \ \n6 requests$.flatmap  -----------R-------------R--->   R (response)\n```\n\n\
  其中来自 `requests$.map` 原始流（随时间产生的数据序列）的箭头代表新的流。结果是我们得到了某种流的流，被称为*元流*（metastream，这可能是你这周学到的最酷的词），因此才需要对其进行平坦化。\n\
  \n从上面的示例中注意到的另一个有趣的点是，我使用了新的 [fetch API](https://developer.mozilla.org/en/docs/Web/API/Fetch_API)\
  \ 来发送请求，并将请求体反序列化为 JSON。由于这两个 API 都返回 promise，我们需要使用 `fromPromise` 算符将它们转换为观测流。我会重复这个示例，让你有机会再次看到它，因为重复对学习非常有帮助：\n\
  \n```\n1 let responses$ = requests$\n2   .flatMap(url => Rx.Observable.fromPromise(fetch(url)))\n\
  3   .flatMap(r => Rx.Observable.fromPromise(r.json()))\n```\n\n好了，现在我们已经直接从 GitHub\
  \ 获取了了一组玩家响应，我们只需要通过以下转换随机挑选其中一个：\n\n```\n1 let randomPlayer$ = responses$\n2  \
  \ .map(pickRandomItem)\n3 \n4 function pickRandomItem(arr){\n5   var randomIndex\
  \ = Math.floor(Math.random() * arr.length)\n6 \treturn arr[randomIndex]\n7 }\n```\n\
  \n最后，我们订阅了 `randomPlayer$` 观测流，这样每当我们收到一个新的随机发射的玩家时，就将其追加到 DOM 中。这个 `subscribe`\
  \ 方法特别有趣，因为观测流在有人订阅它之前是休眠状态的。在这行代码之前，什么都没有发生，还没有向 GitHub API 请求过请求来获取我们的第一个玩家。当你订阅一个观测流时，它才活过来并开始为你施魔法。\n\
  \n```\n1 randomPlayer$.subscribe(appendPlayerToDOM)\n```\n\n`appendPlayerToDOM`\
  \ 只是一个使用 [原生 JS](http://vanilla-js.com/) 进行一些 DOM 操作的函数：\n\n```\n 1 function appendPlayerToDOM(u){\n\
  \ 2   var t = toTemplate(u)\n 3   var users = document.querySelector('.players')\n\
  \ 4   users.appendChild(t)\n 5 }\n 6 7 function toTemplate(user){\n 8 \tvar a =\
  \ document.createElement(\"a\")\n 9   a.textContent = user.login\n10   a.href =\
  \ user.html_url\n11   var img = document.createElement(\"img\")\n12   img.src =\
  \ user.avatar_url\n13   var div = document.createElement(\"div\")\n14   div.appendChild(img)\n\
  15   div.appendChild(a)\n16   return div;\n17 }\n```\n\n由于我是按照非常循序渐进的方法完成这个示例，它看起来代码很多，但现实（也是最酷的）是，我们可以一眼看出整个应用程序完整代码，并瞬间理解发生了什么：\n\
  \n```\n 1 let requests$ = Rx.Observable\n 2   .fromEvent(btnLoadMore, 'click')\n\
  \ 3   .map( _ => 'https://api.github.com/users')\n 4   .startWith('https://api.github.com/users')\n\
  \ 5\n 6 let responses$ = requests$\n 7   .flatMap(url => Rx.Observable.fromPromise(fetch(url)))\n\
  \ 8   .flatMap(r => Rx.Observable.fromPromise(r.json()))\n 9\n10 let randomPlayer$\
  \ = responses$\n11   .map(pickRandomItem)\n```\n\n或者：\n\n```\n1 let randomPlayer$\
  \ = Rx.Observable\n2   .fromEvent(btnLoadMore, 'click')\n3   .map( _ => 'https://api.github.com/users')\n\
  4   .startWith('https://api.github.com/users')\n5   .flatMap(url => Rx.Observable.fromPromise(fetch(url)))\n\
  6   .flatMap(r => Rx.Observable.fromPromise(r.json()))\n7   .map(pickRandomItem)\n\
  ```\n\n或者：\n\n```\n1 1\\. 获取“加载更多”按钮的所有点击事件\n2 2\\. 将它们转换为用户 URL\n3 3\\. 甚至在用户点击按钮之前就从一个用户\
  \ URL 开始\n4 4\\. 将它们转换为请求\n5 5\\. 将响应转换为用户集合\n6 6\\. 随机挑选一个用户\n```\n\n我不知道你是否认同我的观点，但我认为能够将这个小应用程序看作是不同形式和形状的连续数据流，直到得到我们想要的结果，这太棒了。\n\
  \n### 更好的异步模式：观测流与异步数据流\n\n正如你从上一个示例中看到的，观测流让对多样化的异步操作进行处理变得非常自然且直接。它们具有极强的组合性，并且自然地适用于处理异步数据序列。\n\
  \n你可以将 `Observable` 看作是两个经典编程设计模式的结合：*观察者*（Observer）模式和*迭代器*（Iterator）模式。\n\n*观察者*模式允许多个观察者在他们观察主体发生变化时接收通知。这本质上就是当我们\
  \ `subscribe` 一个 `Observable` 并在 `Observable` 发射新部分数据时收到通知所发生的事情。`subscribe` 方法确实在帮助我们通过非常简单的\
  \ API 创建观察者（在上一个示例中仅仅就一个方法）。\n\n由于 `Observables` 也具有数据集合或序列的这一维度，所以我们得到了*迭代器*模式。这种模式通过将迭代封装在对象内部并提供统一的\
  \ API 来抽象化如何遍历特定的集合：通过调用 `next` 方法获取下一个元素，并通过 `hasNext` 方法判断是否完成了迭代。对于 `Observables`，客户端不是由自己遍历序列，而是在值出现时被推送到客户端，并且可以使用不同的\
  \ *Rx.js* 算符来重新定义序列的迭代方式。事实上，如果你查看 *Rx.js* 观察者的 API，你会发现它暴露了 `onNext` 和 `onCompleted`\
  \ 方法，这些方法在概念上映射到迭代器模式中的 `next` 和 `hasNext`。\n\n> #### 响应式编程？为什么我听到这么多关于 Rx.js 的？\n\
  \n> 响应式编程涉及处理异步数据流。流是随时间产生的数据序列。Rx.js 让进行响应式编程变得非常简单，因为它提供了 `Observable` 类型（作为异步数据流的表示）以及许多用于处理它们的算符。\n\
  \n> ##### 观测流 vs 数据流\n\n> 如果你被 Rx.js 警察抓住了，你需要知道 Observable 和 Stream 之间的区别。你可以把\
  \ Observable 看作是一个惰性流。当一个观测 被某个订阅它的人激活时，它就变成了一个流。\n\n关于 观测流的极简介绍：像数组但又不同\n\n*（你可以在\
  \ jsFiddle 上找到并尝试这个示例](https://jsfiddle.net/vintharas/0453u28/)*\n\n让我们降低难度来看一个非常简单的\
  \ [Rx.js](http://reactivex.io/) 示例，它可能没有太大的实用价值，但将帮助你理解观测流。\n\n假设你在 JavaScript 中有一个数字数组：\n\
  \n```javascript\n1 var numbers = [1,2,3,4,5,6]\n```\n\n你可以直接打印数组，并验证现在，在此时，它包含了你声明的所有项：\n\
  \n```javascript\n1 console.log(numbers) // => 1,2,3,4,5,6\n```\n\n你可以利用 `Array.prototype`\
  \ 方法来累加所有大于 `3` 的数字：\n\n```javascript\n1 var result = numbers\n2    .filter(n =>\
  \ n > 3)\n3    .reduce((a,x) => a+x, 0)\n```\n\n\n\n再次，你可以记录结果：\n\n```\n1 console.log(result)\
  \  // => 15\n```\n\n我们可以获取这个数组并使用 Rx.js 自动地将其转换为可观测流（observable）：\n\n```\n1 var\
  \ numbers$ = Rx.Observable\n2   .range(1,6);\n```\n\n或者，另一种方法是复用数组：\n\n```\n1 //\
  \ 一个流\n2 var numbers$ = Rx.Observable\n3   .interval(500)\n4   .take(6)\n5   .map(i\
  \ => numbers[i]);\n```\n\n这样，我们不再拥有一个在特定时间包含所有值的数组，而是拥有了一个异步数据序列，其中数组中的项随着时间被推送到或发射。在这种特定情况下，每隔\
  \ 500 毫秒我们都会得到一个新的数字。如果我们 `subscribe` 这个可观测流，就可以验证值是如何发射的：\n\n```\n1 numbers$.subscribe(n\
  \ => console.log(n));\n2 // => 1\n3 // => 2\n4 // => 3... 等\n```\n\n由于这个序列也代表了一个像数组一样的集合，因此使用类数组的方法来操作该序列是有意义的，所以我们也可以使用\
  \ `filter` 和 `reduce`：\n\n```\n1 var result$ = numbers$\n2   .filter(n => n > 3)\n\
  3   .reduce((a,x) => a+x, 0);\n4 \n5 result$.subscribe(n => console.log(n));\n6\
  \ // => 15\n```\n\n因此我们可以看到，可观测流就像数组一样，但它代表的不是在特定时间点空间中项的集合，而是代表在一段时间内可用的项的集合。希望这能让你理解得更清晰！！\
  \ :)\n\n### 单一抽象的威力\n\n使用 [Rx.js](http://reactivex.io/) 产生的一个非常有趣的点现象是：你可以用输入和输出来表示任何应用程序，用在程序生命周期内转换的异步数据流来表示。\n\
  \n[Rx.js](http://reactivex.io/) 带有许多操作符（operators），让你可以将几乎任何内容转换为可观测流、任何原始数据类型、DOM\
  \ 事件、promises 等……你甚至可以自己将任何内容封装在可观测流内部（如果你愿意的话，可以自己去实现它）。在这种背景下，考虑到一切都可以变成可观测流，并且考虑到可观测流之间非常容易组合，以及\
  \ [Rx.js](http://reactivex.io/) 带有大量操作符帮助你用可观测流做很不起的事情，突然之间，你拥有了一个拥有无限可能的世界。\n\n\
  ### 使用 Rx.js 的副作用\n\n在应用程序中使用 Rx.js 的其他很棒的副作用是代码的可读性和更不容易出错。\n\n[Rx.js](http://reactivex.io/)\
  \ 的声明式本质导致了更简洁的代码，这种代码非常有可读性，你可以一步步跟踪数据在程序中的流向（正如你在上面的示例中看到的那样）。\n\n此外，将你的应用程序转换为数据流限制了副作用的数量，并突出了确实存在的副作用（因为它们显然影响了流之外的东西），这最终使得你的程序不易出错，并帮助你理解代码中正在发生什么。\n\
  \n砰！\n\n### 想学习更多吗？\n\n你想学习更多关于可观测流（Observables）、Rx.js 和响应式编程的知识吗？请查看以下任何资源：\n\n\
