  好了！现在我们可以继续了！\n\n## 使用文件模板代替内联模板\n\n事情进入正轨后，我们现在要做第一件事是将 `PersonDetailsComponent`\
  \ 模板提取到它自己的独立文件中。是的，你可以这样做！\n\n作为一个开始，我觉得让你在组件 API 旁边看到你的模板绑定很不错，但现在我们要编写更多的 HTML\
  \ 了，将其分离到单独的文件中会更好，并且可以整体获得语法高亮和更好的文本编辑器支持（尽管取决于你使用的编辑器，你也可以通过[这里](https://marketplace.visualstudio.com/items?itemName=natewallace.angular2-inline)\
  \ 或未来的[这里](https://marketplace.visualstudio.com/items?itemName=Angular.ng-template)\
  \ 在 TypeScript 中获得很好的 HTML 支持）。\n\n我们如何使用文件模板而不是内联模板？\n\n`@Component` 装饰器除了我们一直使用的\
  \ `template` 属性外，还有一个 `templateUrl` 属性。利用该属性，我们可以告诉 Angular 我们为特定组件使用哪个 HTML 模板。让我们将\
  \ `PersonDetailsComponent` 模板提取到 `person-details.component.html` 文件：\n\n```\n1 \
  \  <section *ngIf=\"person\">\n2     <h2>你选择了: {{person.name}}</h2>\n3     <h3>描述</h3>\n\
  4     <p>\n5       {{person.name}} 体重为 {{person.weight}}，身高为 {{person.height}}。\n\
  6     </p>\n7   </section>\n8   <button (click)=\"gotoPeoplesList()\">返回人物列表</button>\n\
  ```\n\n并更新我们的 `PersonDetailsComponent` 元数据：\n\n```\n1 // some imports\n2 \n3 @Component({\n\
  4   selector: 'app-person-details',\n5   template-url: './person-details.component.html',\
  \  // <=== HERE!\n6 })\n7 export class PersonDetailsComponent implements OnInit\
  \ {\n8     // some code...\n9 }\n```\n\n## Angular 中的基础表单\n\n好了，既然我们已经解决了这个问题，让我们在视图中添加一个\
  \ HTML 表单吧。Angular 与 HTML5 标准完美配合，所以我们只需要创建一个原生的 HTML 表单来编辑我们在 `Person` 接口中的属性。\n\
  \n我们更新模板，使其看起来如下所示：\n\n```\n 1 <!-- ng-if 的新语法 -->\n 2 <section *ngIf=\"person\"\
  >\n 3   <section>\n4     <h2>你选择了: {{person.name}}</h2>\n5     <h3>描述</h3>\n6  \
  \   <p>\n7       {{person.name}} 体重为 {{person.weight}}，身高为 {{person.height}}。\n\
  8     </p>\n9   </section>\n10   <section>\n11     <form>\n12       <div>\n13  \
  \       <label for=\"name\">姓名:</label>\n14         <input type=\"text\" name=\"\
  name\">\n15       </div>\n16       <div>\n17         <label for=\"weight\">体重:</label>\n\
  18         <input type=\"number\" name=\"weight\">\n19       </div>\n20       <div>\n\
  21         <label for=\"height\">身高:</label>\n22         <input type=\"number\"\
  \ name=\"height\">\n23       </div>\n24     </form>\n25   </section>\n26 \n27  \
  \ <button (click)=\"gotoPeoplesList()\">返回人物列表</button>\n28 </section>\n```\n\n\
  好了，现在我们有了一个基础表单，但还没有显示任何内容。利用我们到目前为止学到的，我们可以通过事件绑定和属性绑定将表单连接到组件的 person 实例上。\n\n\
  例如，我们可以这样做：\n\n```\n1 <div>\n2     <label for=\"name\">姓名:</label>\n3     <input\
  \ type=\"text\" \n4            name=\"name\" \n5            [value]=\"person.name\"\
  \ \n6            (change)=\"person.name = name.value\" \n7            #name>\n8\
  \ </div>\n```\n\n其中我们使用 `[value]` 属性绑定将组件的 `person.name` 属性绑定到 `input` 元素，并使用 `(change)`\
  \ 事件绑定来更新我们的用户姓名。\n\n不过在这个特定的例子中有一个奇怪的地方，就是我们 `input` 元素内部的 `#name`。这就是 Angular\
  \ 称为**模板本地变量**（template local variable），它通常用于将 DOM 元素相关的引用和逻辑从我们的组件代码中分离出来。\n\n\
  在这种情况下，`name` 变量指的是 `input` 元素本身。这就是为什么当 Angular 计算 `person.name = name.value` 表达式时，我们的\
  \ person 模型被更新了。\n\n## ngModel 和 Angular 双向数据绑定\n\n\n\n\n当然有！`ngModel` 数据绑定与 AngularJS\
  \ 的 `ng-model` 非常相似，它允许我们在组件和模板之间的给定属性上建立双向数据绑定。双向数据绑定可以有效同步模板和组件之间属性的值，并在两个方向传递变化。\n\
  \n这种语法有点特殊，需要一点时间来习惯：\n\n```\n1 <div>\n2     <label for=\"name\">Name: </label>\n\
  3     <input type=\"text\" name=\"name\" [(ngModel)]=\"person.name\">\n4 </div>\n\
  ```\n\n确实如此！你没读错：`[(ngModel)]=\"person.name\"`。在你开始诅咒它之前，让我们再花一分钟时间仔细思考这段代码……\n\n\
  我们已经学习过**事件绑定（event bindings）**是从模板到底层组件的单向绑定，并用圆括号 `(click)` 表示。我们还学习过**属性绑定（property\
  \ bindings）**是从组件到模板的单向绑定，并用方括号 `[src]` 表示。因此，如果我们需要双向绑定，我们就拥有了等同于事件绑定加上属性绑定的东西，将这两种语法合并，就得到了\
  \ `[(ngModel)]` 这种“香蕉放在盒子里”的语法。很有道理对吧？\n\n`[(ngModel)]` 双向数据绑定确实可以分解为如下的事件/属性绑定组合：\n\
  \n```\n1 <input type=\"text\" name=\"name\"\n2   [ngModel]=\"model.name\"\n3   (ngModelChange)=\"\
  model.name = $event\" >\n```\n\n在普通 DOM 事件的情况下，`$event` 变量通常允许我们访问 DOM 事件本身。但在这种特殊情况下，对于特殊的\
  \ `(ngModelChange)` 自定义事件，它获取的是被改变的输入的值。[如果你想了解更多关于 `ngModel` 以及以及何时解构它很有用，请查看 Angular\
  \ 文档](https://angular.io/docs/ts/latest/guide/forms.html#!#inside-ngmodel-)。\n\n\
  好了！既然我们知道 `[(ngModel)]` 存在了，我们可以在表单中使用它来为每个 person 属性创建双向数据绑定（但对于 `id`，你可能不想改变它）：\n\
  \n```\n 1   <!-- ng-if 的新语法 -->\n 2 <section *ngIf=\"person\">\n 3   <section>\n\
  \ 4     <h2>You selected: {{person.name}}</h2>\n 5     <h3>Description</h3>\n 6\
  \     <p>\n 7       {{person.name}} weights {{person.weight}} and is {{person.height}}\
  \ tall.\n 8     </p>\n 9   </section>\n10   <section>\n 11     <form>\n 12     \
  \  <div>\n 13         <label for=\"name\">Name: </label>\n 14         <input type=\"\
  text\" name=\"name\" [(ngModel)]=\"person.name\">\n 15       </div>\n 16       <div>\n\
  \ 17         <label for=\"weight\">Weight: </label>\n 18         <input type=\"\
  number\" name=\"weight\" [(ngModel)]=\"person.weight\">\n 19       </div>\n 20 \
  \      <div>\n 21         <label for=\"height\">Height: </label>\n 22         <input\
  \ type=\"number\" name=\"height\" [(ngModel)]=\"person.height\">\n 23       </div>\n\
  \ 24     </form>\n 25   </section>\n 26 \n 27   <button (click)=\"gotoPeoplesList()\"\
  >Back to peoples list</button>\n 28 </section>\n```\n\n如果你在浏览器中运行该应用程序（如果你很酷，记得使用\
  \ `ng serve --open` 或 `ng s -o`），你将看到每当你更改这些输入框的值时，变化都会立即反映在描述中。\n\n### Angular\
  \ 数据绑定复习\n\n通过 `[(ngModel)]` 绑定，我们现在已经涵盖了 Angular 中为你提供的所有数据绑定。在继续学习表单和验证之前，让我们来快速回顾一下它们。\n\
  \nAngular 支持这些数据绑定：\n\n*   **插值（Interpolation）**：从组件到模板的单向数据绑定。允许你将组件中的信息显示在模板中。示例：`{{person.name}}`。\n\
  *   **属性绑定（Property bindings）**：从组件到模板的单向绑定。允许你将数据绑定到模板中。你通常使用它们将组件数据绑定到 DOM 元素的属性（例如图像的\
  \ `src` 属性）。示例：`<img [src]=\"person.imageUrl\">`。\n*   **事件绑定（Event bindings）**：从模板到组件的单向绑定。允许你将模板事件绑定到组件。你通常使用它们在响应用户与应用程序界面之间的交互时执行任意代码。示例：`(click)=\"\
  selectPerson(person)\"`。\n*   **`[(ngModel)]`**：从组件到模板及反之的双向数据绑定。它从组件到模板和反向同步数据。你通常在表单输入中使用它。示例：`[(ngModel)]=\"\
  person.name\"`。\n\n### 为我们的表单添加验证\n\n现在我们已经有了更新人员详情的方法，让我们添加一些验证，以确保在保存数据之前引入的数据是合法的。我们将执行以下操作：\n\
  \n1.  将 `name` 字段设为必填。\n2.  当字段为空时，显示友好的错误消息。\n3.  根据有效性启用/禁用表单按钮。\n\n我们使用 `ngModel`\
  \ 指令来跟踪用户是否更改了内容及其有效性。通过在 `name` 上使用 `required` 属性，我们可以将其标记为无效。\n\nAngular 使用 `name`\
  \ 属性来识别此特定的输入并跟踪它的变化。可视化它如何添加/删除类的最简单方法是查看 DOM 的 `className` 属性。如果你使用以下片段更新输入并进入浏览器，你将能够欣赏与输入交互时，不同的类是如何添加的：\n\
  \n```\n1 <label for=\"name\">Name: </label>\n2 \n3 <!-- 在输入中添加了 #name 局部变量 -->\n\
  4 <input type=\"text\" name=\"name\" required [(ngModel)]=\"person.name\" #name\n\
  5 \n6 <!-- 添加了文本以显示输入元素 -->\n7 <p>\n8  class is: {{ name.className }}\n9 </p>\n\
  ```\n\n所以，如果你：\n\n*   保持输入不触动，它将具有 `ng-untouched ng-pristine ng-valid` 类\n*   点击输入内部，它将被标记为**已访问（visited）**并赋予\
  \ `ng-touched` 类\n*   输入内容，它将被标记为**已修改（dirty）**并赋予 `ng-dirty` 类\n*   删除其全部内容，它将被标记为**无效（invalid）**并赋予\
  \ `ng-invalid` 类\n\n**你自己测试一下！**\n\n我们可以利用这一特性，在输入有效或无效时为它们添加一些 CSS 样式。你可以更新 `styles.css`\
  \ 文件包含以下内容：\n\n```\n1 // 这些样式深受、深受灵感（被偷了！！）\n2 // 来自 Angular 文档\n3 \n4 // 有效且必填显示绿色\n\
  5 input.ng-valid[required] {\n6   border-left: 5px solid #42A948; /* 绿色 */\n7 }\n\
  8 \n9 // 无效\n10 input.ng-invalid {\n11   border-left: 5px solid #a94442; /* 红色 */\n\
  12 }\n```\n\n该 CSS 文件在 `index.html` 中链接。因此，它代表我们应用程序的全局样式，无论你在哪个组件中都会应用。在将来，你将学习定义仅应用于组件的组件样式。耶！\n\
  \n回到 `PersonDetailsComponent` 模板，我们现在希望在用户没有输入姓名时显示错误消息。我们可以通过创建一个**局部模板变量** `name`\
  \ 并将其值设置为 `ngModel` 来实现。*我们如何这样做呢？*尽管这不符合直觉，但你通过像这样将*局部模板变量*分配给 `ngModel` 来实现。更新之前的片段到以下内容：\n\
  \n\n\n\n\n```html\n1 <label for=\"name\">Name: </label>\n2 <input type=\"text\"\
  \ name=\"name\" required [(ngModel)]=\"person.name\" #name=\"ngModel\">\n```\n\n\
  你可以将其认为是获取用于跟踪输入变化和有效性的指令（directive）访问的方法。现在 `name` 持有了 `ngModel` 指令的值，我们可以访问它的属性，并找到输入是否处于有效状态。我们可以使用这些信息来切换错误信息的可见性：\n\
  \n```html\n1 <label for=\"name\">Name: </label>\n2 <input type=\"text\" name=\"\
  name\" required [(ngModel)]=\"person.name\" #name=\"ngModel\">\n3 <div [hidden]=\"\
  name.valid || name.pristine\" class=\"error\">\n4     亲爱的先生先生/女士，姓名是必写的！\n5 </div>\n\
  ```\n\n我们将用这段神奇的 `css` 对其进行样式化：\n\n```css\n1 .error{\n2   padding: 12px;\n3   background-color:\
  \ rgba(255, 0, 0, 0.2);\n4   color: red;\n5 }\n```\n\n注意通过使用属性绑定 `property binding`\
  \ 语法，我们可以将任何表达式绑定到 `[hidden]` DOM 属性。在这种情况下，只有当 `ngModel` 告诉我们输入是有效的（`valid））或未修改的（`pristine））时，我们才隐藏消息（如果用户甚至还没有开始编辑输入，没有显示错误）。\n\
  \n### 自定义验证太棒了！\n\n让我们来另一个验证示例。这次是针对绑定到人员体重的输入元素，使用 `max` 和 `min` HTML5 输入属性。假设我们的《星球大战》手办重量不应该比羽毛轻，也不应该比兰科兽（Rancor）重。我们将如下所示更新模板：\n\
  \n```html\n1 <label for=\"weight\">Weight: </label>\n2 <input type=\"number\" name=\"\
  weight\" [(ngModel)]=\"person.weight\" min=0 max=350 #weight\\\n3 =\"ngModel\">\n\
  ```\n\n现在我们为这两个约束条件添加验证消息：\n\n```html\n1 <div *ngIf=\"weight.errors && (weight.dirty\
  \ || weight.touched)\"\n2     class=\"error\">\n3     <p [hidden]=\"!weight.errors.min\"\
  >\n4       重量必须比羽毛重。{{weight.value}} 太低了。\n5     </p>\n6     <p [hidden]=\"!name.errors.max\"\
  >\n7       重量不能比兰科兽重。{{weight.value}} 太高了。\n8     </p>\n9 </div>\n```\n\n如果你再次运行示例（记得使用\
  \ `ng serve --open`），你将发现这个新验证不起作用！噢不不！我们该怎么办？\n\nAngular 允许你使用自己的新验证器扩展内置的验证系统。让我们为\
  \ `min` 和 `max` 属性创建两个新的验证器。这些验证器将表示为指令，我们可以通过我们强大的伴侣：Angular CLI 的帮助来创建它们。你可以将指令认为是一种为匹配特定选择器的\
  \ DOM 元素添加自定义行为的方法。\n\n输入以下内容：\n\n```bash\n1 PS> ng generate directive min-validator\n\
  2 # ng g d min-validator\n```\n\n这将为我们创建一个新指令并将指令注册到我们的 `AppModule` 中。新指令看起来像这样：\n\
  \n```typescript\n 1 import { Directive } from '@angular/core';\n 2 \n 3 @Directive({\n\
  \ 4   selector: '[appMinValidator]'\n 5 })\n 6 export class MinValidatorDirective\
  \ {\n 7 \n 8   constructor() { }\n 9\n10 }\n```\n\n我们可以更改选择器以反映我们想要绑定到验证逻辑的属性（`min`）：\n\
  \n```typescript\n 1 import { Directive } from '@angular/core';\n 2 \n 3 @Directive({\n\
  \ 4   // 属性的 CSS 选择器\n 5   selector: '[min]'\n 6 })\n 7 export class MinValidatorDirective\
  \ {\n 8 \n 9   constructor() { }\n10 }\n```\n\n为了将这个新指令转换为验证器，我们需要实现包含 `validate`\
  \ 方法的 `Validator` 接口。该方法将包含验证逻辑，将输入的当前值与我们的属性 `min` 值进行比较。\n\n但在实现该逻辑之前，我们需要获取 `min`\
  \ 值。我们将利用 `@Input` 装饰器来实现（如果你错过了该系列之前的文章，可以使用 inputs 将数据传递到组件或指令）：\n\n```typescript\n\
  1 export class MinValidatorDirective {\n2   // 这里有新的 @Input\n3   // 它将从属性中获取 min\
  \ 数字\n4   // 例如对于 <input min=5 ...\n5   @Input() min: number;  \n6 \n7   constructor()\
  \ { }\n8 }\n```\n\n现在我们按照如下方式实现带有 `validate` 方法的 `Validator` 接口：\n\n```typescript\n\
  \ 1 import { Validator, AbstractControl, ValidationErrors} from '@angular/forms';\n\
  \ 2 \n 3 @Directive({...})\n 4 export class MinValidatorDirective implements Validator\
  \ {\n 5   // 这里有新的 @Input\n 6   // 它将从属性中获取 min 数字\n 7   // 例如对于 <input min=5 ...\n\
  \ 8   @Input() min: number;\n 9\n10   constructor() { }\n11 \n12   // 定义验证逻辑\n13\
  \   validate(control: AbstractControl): ValidationErrors {\n14     const currentValue\
  \ = control.value;\n15     const isValid = currentValue >= this.min;\n16 \n17  \
  \   // 以对象形式返回错误\n18     return isValid ? null : {\n19       min: {\n20        \
  \ valid: false\n21       }\n22     };\n23   }\n24 }\n```\n\n好了！现在我们有了 `min` 属性的自定义验证器指令。我们需要让\
  \ Angular 验证系统感知此验证器。我们通过在 `@Directive` 元数据内部将验证器注册为 `NG_VALIDATORS` 的提供者（provider）来实现：\n\
  \n```typescript\n 1 import { Validator, AbstractControl, ValidationErrors} from\
  \ '@angular/forms';\n 2 \n 3 @Directive({\n 4   selector: '[min]',\n 5   // 在 DI\
  \ 中注册验证器\n 6   providers: [{provide: NG_VALIDATORS, useExisting: MinValidatorDirective,\
  \ multi: true}]\n 7 })\n 8 export class MinValidatorDirective implements Validator\
  \ {\n 9   // 代码...\n10 }\n```\n\n现在当 Angular 验证系统使用依赖注入获取所有可用验证器（由 `NG_VALIDATORS`\
  \ 表示）时，它也将访问这个新的验证器。测试权重 `-100`你会收到一个错误。耶！\n\n现在我们对 `max` 验证器重复这些步骤。让我们酷一点，使用 Angular\
  \ CLI 简写：\n\n```bash\n1 PS> ng g d max-validator\n```\n\n并编写验证器逻辑：\n\n```typescript\n\
  \ 1 import { Directive, Input } from '@angular/core';\n 2 import { Validator, AbstractControl,\
  \ ValidationErrors } from '@angular/forms';\n 3 \n4 @Directive({\n 5   selector:\
  \ '[max]',\n 6   // 在 DI 中注册验证器\n 7   providers: [{provide: NG_VALIDATORS, useExisting:\
  \ MaxValidatorDirective, multi: true}]\n 8 })\n9 export class MaxValidatorDirective\
  \ implements Validator {\n10   @Input() max: number;\n11 \n12   validate(control:\
  \ AbstractControl): ValidationErrors {\n13     const currentValue = control.value;\n\
  14     const isValid = currentValue <= this.max;\n15 \n16     // 以对象形式返回错误\n17 \
  \    return isValid ? null : {\n18       max: {\n19         valid: false\n20   \
  \    }\n21     };\n22   }\n23 \n24   constructor() { }\n25 }\n```\n\n哒哒！现在我们有了准备就绪的\
  \ `min` 和 `max` 自定义验证器。做得好！\n\n### 提交我们的表单\n\n好了！让我们快速总结一下！到为止，我们为表单中的 `name` 输入添加了一些验证，这样如果用户删除了姓名，我们将显示错误，因为你不应该对必填字段这样做。我们还为\
  \ `weight` 属性添加了 `min` 和 `max` 验证以及一些基础样式。\n\n下一步是实际尝试保存这些更改。为此，我们将在表单内部添加一个 `submit`\
  \ 按钮：\n\n```html\n1   <section>\n2     <form>\n3       <!--- 这里是表单输入 ...--->\n4\
  \ \n5       <!-- 添加按钮 -->\n6       <button type=\"submit\">Save</button>\n7    \
  \ </form>\n8   </section>\n```\n\n\n\n\n我们需要在表单无效时禁用它，以便用户无法保存损坏/无效的数据，从而导致混乱、骚乱并破坏我们心爱的服务器（尽管你我都知道，你必须在服务层和客户端中都应该有这种类型的验证）。\n\
  \n为了实现这一点，我们创建了另一个本地模板变量 `#personForm`，以便通过 `ngForm` 指令访问实际表单。然后，我们使用该变量在表单无效时禁用按钮：\n\
  \n```\n1   <section>\n2     <form #personForm=\"ngForm\">\n3       <div>\n4    \
  \       <!-- inputs ... -->\n5       </div>\n6       <button type=\"submit\" [disabled]=\"\
  !personForm.form.valid\">Save</button>\n7     </form>\n8   </section>\n```\n\n最后，我们在表单中设置了一个提交事件（submit\
  \ event）绑定，这样每当我们提交表单时，就可以保存人员详细信息：\n\n```\n1   <section>\n2     <form (ngSubmit)=\"\
  savePersonDetails()\" #personForm=\"ngForm\">\n3       <div>\n4           <!-- inputs\
  \ ... -->\n5       </div>\n6       <button type=\"submit\" [disabled]=\"!personForm.form.valid\"\
  >Save</button>\n7     </form>\n8   </section>\n```\n\n整个模板现在看起来像这样：\n\n```\n 1 <section\
  \ *ngIf=\"person\">\n 2   <!-- description -->\n 3   <section>\n 4     <h2>You selected:\
  \ {{person.name}}</h2>\n 5     <h3>Description</h3>\n 6     <p>\n 7       {{person.name}}\
  \ weights {{person.weight}} and is {{person.height}} tall.\n 8     </p>\n 9   </section>\n\
  10 \n 11   <!-- form -->\n 12   <section>\n 13     <form (ngSubmit)=\"savePersonDetails()\"\
  \ #personForm=\"ngForm\">\n 14       <div>\n 15         <label for=\"name\">Name:\
  \ </label>\n 16         <input type=\"text\" name=\"name\" [(ngModel)]=\"person.name\"\
  \ required #name=\"ngM\\\n17 odel\">\n18         <div [hidden]=\"name.valid || name.pristine\"\
  \ class=\"error\">\n19             Name is required my good sir/lady!\n20      \
  \   </div>\n 21       </div>\n 22       <div>\n 23         <label for=\"weight\"\
  >Weight: </label>\n 24         <input type=\"number\" name=\"weight\" [(ngModel)]=\"\
  person.weight\" min=0 max=350\\\n25  #weight=\"ngModel\">\n 26         <div *ngIf=\"\
  weight.errors && (weight.dirty || weight.touched)\"\n 27             class=\"error\"\
  >\n 28             <p [hidden]=\"!weight.errors.min\">\n 29               Weight\
  \ must be bigger than a feather's. {{weight.value}} is way too lo\\\n30 w.\n 31\
  \             </p>\n 32             <p [hidden]=\"!weight.errors.max\">\n 33   \
  \            Weight can't be bigger than a Rancor's. {{weight.value}} is too high\n\
  \ 34             </p>\n 35         </div>\n 36       </div>\n 37       <div>\n 38\
  \         <label for=\"height\">Height: </label>\n 39         <input type=\"number\"\
  \ name=\"height\" [(ngModel)]=\"person.height\">\n 40       </div>\n 41       <div>\n\
  \ 42         <label for=\"profession\">Profession:</label>\n 43         <select\
  \ name=\"profession\" [(ngModel)]=\"person.profession\">\n 44           <option\
  \ *ngFor=\"let profession of professions\" [value]=\"profession\">{{prof\\\n45 ession}}</option>\n\
  \ 46         </select>\n 47       </div>\n 48 \n 49 \n 50       <button type=\"\
  submit\" [disabled]=\"!personForm.form.valid\">Save</button>\n 51     </form>\n\
  \ 52   </section>\n 53 \n 54   <button (click)=\"gotoPeoplesList()\">Back to peoples\
  \ list</button>\n 55 <section>\n```\n\n我们只需要更新 `PersonDetailsComponent` 以便能够处理该提交事件：\n\
  \n```\n 1 // imports \n 2 \n3 @Component({\n 4   selector: 'app-person-details',\n\
  \ 5   templateUrl: './person-details.component.html',\n 6   styles: []\n 7 })\n\
  \ 8 export class PersonDetailsComponent implements OnInit {\n 9     // codes...\n\
  10 \n11     savePersonDetails(){\n12         alert(`saved!!! ${JSON.stringify(this.person)}`);\n\
  13     }\n14 }\n```\n\n现在，如果你在浏览器中测试你刚刚所做的：点击 Luke Skywalker，将他的名字改为 Luke Vader（moahahaha），然后保存，你应该能在警弹框中看到你的更改。\n\
  \n让我们进一步更新组件，以便我们借助 `PeopleService` 来保存这些信息。\n\n### 保存信息\n\n这与表单和验证无关，因此我将像风一样快速地跳过它，不进行过多细节。我们将在服务中添加一个\
  \ `save` 方法，然后将在我们的服务内存中保存对人员所做的更改。\n\n我们首先从更新 `PersonDetailsComponent` 开始：\n\n\
  ```\n1 // etc\n2 export class PersonDetailsComponent implements OnInit {\n3    \
  \ savePersonDetails(){\n4       this.peopleService.save(this.person);\n5     }\n\
  ```\n\n然后我们用新的 `save` 方法更新 `PeopleService`：\n\n```\n 1 import { Injectable } from\
  \ '@angular/core';\n 2 import { Person } from './person';\n 3 \n4 const PEOPLE :\
  \ Person[] = [\n 5       {id: 1, name: 'Luke Skywalker', height: 177, weight: 70,\
  \ profession: ''},\n 6       {id: 2, name: 'Darth Vader', height: 200, weight: 100,\
  \ profession: ''},\n 7       {id: 3, name: 'Han Solo', height: 185, weight: 85,\
  \ profession: ''},\n 8     ];\n 9 \n10 @Injectable()\n11 export class PeopleService{\n\
  12 \n13   getAll() : Person[] {\n14     return PEOPLE.map(p => this.clone(p));\n\
  15   }\n16   get(id: number) : Person {\n17     return this.clone(PEOPLE.find(p\
  \ => p.id === id));\n18   }\n19   save(person: Person){\n20     let index = PEOPLE.findIndex(p\
  \ => p.id === person.id);\n21     if (index !== -1) {\n22       PEOPLE[index] =\
  \ this.clone(person);\n23     }\n24   }\n25 \n26   private clone(object: any){\n\
  27     return JSON.parse(JSON.stringify(object));\n28   }\n29 }\n```\n\n如果你非常敏锐，会发现我在服务中加入了\
  \ `clone` 方法。这个方法的目的是在不同的组件之间共享对象引用，以便我们以更真实的方式“保存”。\n\n\n\n\n\n```\nexport class\
  \ PersonDetailsComponent implements OnInit {\n    professions: string[] = ['jedi',\
  \ 'bounty hunter', 'princess', 'sith lord'];\n    // 其他代码\n}\n```\n\n最后，我们更新了 `PersonDetailsComponent`\
  \ 模板以包含 `select` 元素：\n\n```\n 1 <!-- 描述头部 ... -->\n 2   <section>\n 3     <form\
  \ (ngSubmit)=\"savePersonDetails()\" #personForm=\"ngForm\">\n 4       <div>\n 5\
  \       <! -- 旧的输入 ... --> \n 6       <!-- ...以及新的 select 元素 -->\n 7       <div>\n\
  \ 8         <label for=\"profession\">职业:</label>\n 9         <select name=\"profession\"\
  \ [(ngModel)]=\"person.profession\">\n10           <option *ngFor=\"let profession\
  \ of professions\" [value]=\"profession\">{{profession}}</option>\n11         </select>\n\
  12       </</div>\n13       <button type=\"submit\" [disabled]=\"!personForm.form.valid\"\
  >保存</button>\n14     </form>\n15   </section>\n```\n\n搞定！你现在可以返回表单，点击卢克·天行者，让他成为一名西斯领主，保存，然后谁知道下一部《星球大战》电影会发生什么呢。\n\
  \n### 你想学习更多关于表单的知识吗？\n\n如果你想学习更多 Angular 表单，可以查看以下文章：\n\n* [Angular Forms 文档](https://angular.io/docs/ts/latest/guide/forms.html)\n\
  * [Angular 新表单变更提案](https://docs.google.com/document/d/1RIezQqE4aEhBRmArIAS1mRIZtWFf6JxN_7B4meyWK0Y/preview)。这是一份非常棒的文档，论证了新表单\
  \ API 的理由以及所有的破坏性变更\n* [Angular 表单食谱](https://angular.io/docs/ts/latest/cookbook/dynamic-form.html)\n\
  * [Angular ngForm 指令文档](https://angular.io/docs/ts/latest/api/forms/index/NgForm-directive.html)\n\
  \n顺便说一下，如果你还没有看的话，可以去 Pluralsight 看看这门非常棒的 Angular 课程：[Angular: First Look](http://app.pluralsight.com/courses/angular-2-first-look)，由独一无二的\
  \ [John Papa](https://twitter.com/John_Papa) 主讲\n\n## 结语\n\n太棒了！我们到了另一篇文章的结尾。现在你可以把表单和验证作为你额外的\
  \ Angular 忍者技能之一。\n\n接下来是：**使用 Angular Http 消费真实服务**。\n\n### 旁白：哦不！我没时间更新到新的表单 API！我可以更新到\
  \ RC5 吗？\n\n如果你没有时间更新到新的表单 API 但仍然想开始使用 RC5，你可以通过导入 `DeprecatedFormsModule` 并将其添加到\
  \ `app.module.ts` 中来启用旧表单：\n\n```\n1 import {DeprecatedFormsModule} from @angular/common;\n\
  2 \n3 @NgModule({\n4   imports: [ BrowserModule, routing, DeprecatedFormsModule\
  \ ],\n5   declarations: [ AppComponent, PeopleListComponent, PersonDetailsComponent],\n\
  6   bootstrap: [ AppComponent ]\n7 })\n8 export class AppModule { }\n```\n\n## 使用\
  \ Http 获取真实数据\n\n```\n text text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text.\n\n                                - XXXX Xxxxx,\n           \
  \                     Some title, Some time \n```\n\n```\n1 /* \n2  * story \n3\
  \  *\n4  */\n```\n\n祝好！今天我们将学习如何使用 Angular 中的 http 模块从网络服务检索真实数据。在此过程中，我们还将学习一点关于\
  \ [Observables 和 Rxjs](http://reactivex.io/intro.html)（Angular 中首选的新异步武器）。\n\n让我们开始吧！\n\
  \n### 代码示例\n\n你可以从[这个 GitHub 仓库](https://github.com/Vintharas/angular2-step-by-step-06-consuming-real-data-with-http)\
  \ 下载本文的所有代码示例。\n\n### 我们到为止的应用程序\n\n到为止，我们开发了一个微小的 Angular 应用，用来学习更多关于《星球大战》宇宙中的人物。我们有两个组件：显示人物列表的\
  \ `PeopleListComponent` 和显示你所选角色更多信息的 `PersonDetailsComponent`。人物详情显示在表单中，你可以自由编辑并保存它们。\n\
  \n我们使用 Angular 路由在两个视图之间导航，人物列表是我们的默认视图，也是应用程序启动时立即渲染的视图。\n\n### 为我们的应用获取一些真实数据吧！\n\
