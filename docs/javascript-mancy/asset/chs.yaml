  \ SOLID 原则之一。它规定派类类能够替换其基类。这意味着派生类的行为应该符合基类的描述，并且不会破坏其接口创建的预期。在这个特定的示例中，如果你在基类中有\
  \ `castsSpell` 和 `steals` 方法，而派生类在调用它们时抛出了异常，那么你就违反了这个原则。这是因为派生类破坏了基类建立的预期（即你应该能够使用这两个方法）。\n\
