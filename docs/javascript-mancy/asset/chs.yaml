- "# JavaScript 魔法指南\n\n\n\n![](img/title_page.png)\n\n![JavaScript-mancy](img/title_page.png)\n\
  \n\n\n\n\n\n\n\n\n献给我美丽的妻子 Malin 和可爱的儿子 Teo\n\n\n## 指南\n\n1. 开始阅读\n\n## 关于我如何编写这本书的说明\n\
  \n你好，亲爱的读者！\n\n我想，让你稍微了解一下我是如何写这本书的可能会很有趣。如果你真的感兴趣，请尽管查看下方内容；否则请直接跳转到下一章。\n\n###\
  \ 流程\n\n我逐章编写每个章节，通常遵循以下步骤：\n\n1. 大纲\n2. 完整编写内容和代码示例\n3. 审核内容\n4. 在等待审核员时跳转到下一章\n\
  5. 审核员审核章节并提供反馈\n6. 第二轮审核\n7. 将故事、练习、代码示例添加到 GitHub\n8. 终审\n\n我通常遵循步骤 `1` 到 `3`，并在章节之间跳转，以便能尽可能快地让你读到最多的内容。我会批量收集审核员的反馈并分批处理。步骤\
  \ `7` 和 `8` 我将留到最后，等所有将成为书籍的内容完成后再处理。\n\n之后，我将移除状态标记，开始进行书籍的最终格式调整！\n\n祝阅读愉快，如果你有任何问题，请随时给我邮件。\n\
  \n**Jaime**\n\n## 关于作者\n\n![Jaime González García](img/jaime-bw.jpg)\n\nJaime González\
  \ García\n\n**Jaime González García** ([@Vintharas](https://twitter.com/Vintharas))\
  \ *软件开发者、UX 专家、演讲者、作者兼极客*\n\nJaime 是一位全栈 Web 开发者和 UX 设计师，他认为用第三人称介绍自己很奇怪。在过去的几年职业生涯中，他缓慢而坚定地专注于前端开发和用户体验，在道路上的某个时刻，他爱上了\
  \ JavaScript。尽管如此，他仍然享受全栈开发，将想法变为现实，从无中创造出那些使用起来感到愉悦和惊喜的美物。\n\nJaime 在 Google 担任技术解决方案顾问，帮助出版社变得卓越。他在空暇之余还会构建自己的产品，并在\
  \ barbarianmeetscoding.com 写博客（那是一个很长的故事）。他喜欢与心爱的 Malin 待在一起、画画、写作、阅读奇幻和科幻小说，以及举重。\n\
  \n## 关于技术审核员\n\n![Nathan Gloyn](img/nathan-gloyn.jpg)\n\nNathan Gloyn\n\n**Nathan\
  \ Gloyn** ([@NathanGloyn](https://twitter.com/NathanGloyn)) *充满激情的开发者、架构师和演讲者*\n\
  \nNathan 是一位独立的软件顾问和敏捷教练，他对开发充满热情，并坚定地信奉敏捷原则。在工作中，他是一名合同工，帮助客户构建并交付运行的软件。\n\nNathan\
  \ 成功地在不同的公司启动了敏捷团队，并在多次活动中进行过技术和敏捷方面的演讲。\n\n![Andreas Bäcklund](img/andreas-bw.jpg)\n\
  \nAndreas Bäcklund\n\n**Andreas Bäcklund** ([@andbackl](https://twitter.com/andbackl))\
  \ *顾问、充满激情的程序员*\n\nAndreas 是一位顾问、充满激情的程序员、双硕士和终身学习者。\n\nAndreas 喜欢各种技术，并编写运行在从船引擎到云端任何设备上的软件。他喜欢全栈工作，因为这同时具有成就感、趣味性和挑战性。\n\
  \n![Artur Mizera](img/artur.jpg)\n\nArtur Mizera\n\n**Artur Mizera** ([@arturmizera](http://twitter.com/arturmizera))\
  \ *Web 开发者*\n\nArtur 是一位充满激情的软件开发者，曾为小型及企业公司构建过各种 Web 应用程序。\n\n他有时会想起 `jQuery` 处于测试版本的美好时光，当时它即将发布\
  \ 1.0 版本，而且没人知道 SPA 是什么意思……目前他在 Oracle 担任高级应用开发人员。回到家后，他会摆弄开源的侧项目。\n\n## 前言\n\n\
  ```\n 在第二纪元\n 伟大的创始人 Iec，\n\n 首次发现了奥秘的 REPL，\n 并学会了如何按照自己的意志扭曲存在的织物，\n\n 就在之后，我们发现\
  \ \n 有种机制可以\n 将 生命 编织进“模式（Pattern）”之中，\n\n        - Iec,  \n        JavaScript 的起源\n\
  \        第七时代 \n```\n\n想象一下……想象你生活在一个可以使用 JavaScript 改变周围世界的世界。那么，来到 JavaScript-mancy\
  \ 的世界吧，这里的巫师（也被称为 JavaScript 法师）控制着奥秘的魔法之风，挥舞着 JavaScript 并指挥现实本身的结构。\n\n不幸的是，我们程序员并不生活在这样的世界里。但我们确实拥有某种魔法（[chap85.xhtml_magic]），**我们拥有从无中创造物的能力和力量**。即使我们还不能发射火球或悬浮，但我们完全可以用我们的小创作来改变/改进/增强现实以及我们周围的宇宙。这不超级酷吗？\n\
  \n嗯，我希望这本书能激励你继续创造，并使用我们共享的这项妙技能，这次是使用 JavaScript。\n\n### 关于我为什么要写这本书的故事\n\n我坐在房间后后，背部挺直，手指在桌子上局促地动着。我既兴奋又紧张。这是我第一次尝试参加当地\
  \ .NET 用户组不定期举办的会议。*兴奋*是因为能和这么多志同道合的人聚在一起简直太棒了，他们也像我一样热爱代码，他们对软件开发如此充满，以至于愿意牺牲空闲时间聚会讨论编程。*紧张*是因为，当然，我不想在这样一群优秀的人面前显得愚蠢或说话难听。\n\
  \n聚会开始讨论 `TypeScript`，这是 JavaScript 的新超集，它为 C# 开发者在这一超交互 Web 应用的新世界中提供了*天堂*。这里是\
  \ TypeScript，那里也是 TypeScript，因为编写 JavaScript 太太糟糕了……房间里的每个人都开始分享他们过去编写 JavaScript\
  \ 的旧事，讨论它与 C# 相比时有多糟糕，等等……\n\n\n\n\n“呃……TypeScript 编译器写出的 JavaScript 非常漂亮，”我大胆地说道……房间陷入了沉默。人们惊讶地互相看着对方，面情充满了困惑和不置信……有人竟然敢在同一个句子里同时使用\
  \ `beautiful` 和 `JavaScript`。\n\n这已经不是第一次在 .NET 社区中遇到对 `JavaScript` 这种普遍的反应和感受了。`JavaScript`\
  \ 不值得我们考虑。`JavaScript` 是一门玩具语言。`JavaScript` 是不可靠的，行为诡异且出乎意料。`JavaScript` 开发者不知道如何编程。`JavaScript`\
  \ 的工具链非常糟糕……\n\n而每当我保持沉默坐着，心里暗想、反思、绞尽脑汁地思考……如何才能展示并解释 `JavaScript` 实际上很棒？如何分享它是一门美丽的语言？一门写起来超级有趣的、丰富的语言？这本书就是这样产生的。\n\
  \n让我告诉你们一个小秘密。就在几年前，我对 `JavaScript` 也有完全相同的感觉。然后，突然之间，我开始使用它，带着初学者的心态，没有偏见，没有轻蔑。起初这很难，因为我太精通\
  \ `C#` 了，以至于无法理解如何在 `JavaScript` 中实现同样程度的流畅和表现力。尽管如此，我继续向前，突然之间，我开始爱上了它。\n\n`JavaScript`\
  \ 的问题在于它看起来太像 `C#` 了，足以让你自信自己因为懂 `C#` 所以就懂 `JavaScript`。而正当你完全放松、信任且毫无防备时，`JavaScript`\
  \ 就会用一把战锤直接砸在你脸上，因为在很多方面，`JavaScript` 完全不像 `C#`。它只是在表面上看起来像它。\n\n`JavaScript` 确实是一门美丽的语言，虽然边缘有些粗糙，但终究是一门美丽的语言。相信我，你会有大收获的。\n\
  \n## 为什么你应该关注 JavaScript？\n\n你可能在想，如果你已经精通了 `C#`，为什么还需要了解 `JavaScript`。\n\n嗯，首先最重要的是，`JavaScript\
  \ 写起来超级有趣`。它缺乏繁文缛节且反馈周期极快，使其成为一门非常有趣的编程语言，是快速原型设计、快速测试事物、捣捣、构建东西以及快速获得结果的理想选择。如果你最近对编程没有感觉了，`JavaScript`\
  \ 将帮助你重新发现对编程的热爱和喜爱。\n\n`JavaScript 是 Web 的语言`，如果你正在进行任何类型的 Web 开发，你就需要理解如何编写优秀的\
  \ `JavaScript` 代码以及 `JavaScript` 本身是如何工作的。即使你在编写像 `TypeScript` 或 `CoffeeScript`\
  \ 这样的编译语言，它们在浏览器中都会变成 `JavaScript`，因此了解 `JavaScript` 会让你变得高效得多。\n\n但 `JavaScript\
  \ 不局限于 Web`，在过去的几年里，`JavaScript` [席卷全球](http://githut.info/)，你可以用 `JavaScript` 构建网站、编写后端、构建移动应用、游戏，甚至控制机器人和\
  \ IoT 设备，这使其成为了真正的跨平台语言。\n\n`JavaScript 是一门非常容易上手的语言`，一门宽容的语言，易学难精。它的构造是极简的，优且富有表现力，并支持许多编程范式。如果你思考\
  \ `JavaScript` 的特性，你会发现它是如何以简单为核心构建的。诸如类型转换（“44”和 44 到底有什么区别吗？）或可以使用单引号或双引号声明字符串，这些都是该原则的极佳体现。\n\
  \n`JavaScript` 的开放性和易扩展性是使其成为`快速演进的语言和生态系统`的完美基础。作为 Web 的唯一语言，作为浏览器可以理解的语言，它已成为所有软件开发社区交流的完美媒介，在这里，.NET\
  \ 开发者的想法可以与来自 `Ruby` 和 `Python` 社区的想法交流交融。这使得知识、模式和思想以前所未有的跨边界传播。\n\n由于没有单一实体真正控制\
  \ `JavaScript`，`社区对语言的演进具有巨大影响`。凭借蓬勃的开源社区以及语言内置的开放性和扩展性，是社区和浏览器开发了语言和平台，而标准机构则遵循并稳定这些趋势。当人们发现\
  \ `JavaScript` 在某些方面缺失时，他们会迅速用强大的库、工具链和技术来填补空白。\n\n但不要只听我的。这正是这本书的目的，向你展示。\n\n##\
  \ 本书的目标是什么？\n\n这本书的目标是让你精通 `JavaScript`，能够立即表达你的想法，并用它构建出很棒的东西。你不仅会学习语言本身，还将学习如何编写地道的\
  \ `JavaScript`。你将学习今天 `JavaScript` 中最常用的模式和惯用法，还将全面了解 `JavaScript` 的最新版本：`ECMAScript\
  \ 6`（也 `ECMAScript 2015`）甚至是即将推出的版本 `ECMAScript 7`。\n\n但我们不会止于此，因为如果你不能用它构建任何东西，语言本身又意味着什么呢？我想教你读完这本书后成功并在编写\
  \ `JavaScript` 时获得乐趣所需的一切。这就是为什么我们我们将更进一步，看一眼 JavaScript 生态系统、JavaScript 社区、快速原型设计工具、构建现代\
  \ JavaScript 应用所需的优秀工具链、JavaScript 测试以及使用现代 JavaScript 框架（Angular 2）构建应用。\n\n##\
  \ 为什么是 JavaScript 术（JavaScript-mancy）？\n\n编写代码是我最喜欢的爱好之一，读奇幻小说也是。对于这个项目，我想将我的这两个爱好结合起来，并从中创造出一些了不起的东西。在奇幻世界中，我们通常有魔法的概念，非常强大、晦奥，只有少数专注的人才能触及。还有不同的魔法派系或类型，火系魔法处理火焰，元素术与金属触发的魔法有关，死灵术完全关于死亡魔法、召唤骷军队和僵尸、长生不老等。\n\
  \n我想，在魔法与我们日常工作之间建立类比是完美的。因为对于未受训练的心灵来说它是晦奥的，需要大量的努力和学习才能入门，而且我们拥有从无中创造的力量。\n\n\
  因此，JavaScript 术（JavaScript-mancy），即编写优秀 JavaScript 的奥术。\n\n\n\n本书分为三个部分，侧重于语言、生态系统以及如何使用\
  \ JavaScript 构建你的第一个应用程序。\n\n### 第一部分：精通 JavaScript 魔法\n本书将教你如何流练地编写 JavaScript。\n\
  \n我们将首先简要回顾 `JavaScript 基础`，为本书奠定基调，很快我们就会讨论 C# 开发者通常会卡住和绊倒的“大坑（gotchas）”。\n\n之后，我们将研究\
  \ `JavaScript 中的面向对象编程`，学习原型继承，以及如何在 JavaScript 中模拟 C#（经典）继承。我们还将超越类 OOP（class OOP），探索混入（mixins）、多重继承和印章模式（stamps），JavaScript\
  \ 将带带你进入一些在传统 C# 中很少见的的有趣 OOP 范式。\n\n接着，我们将深入研究 `JavaScript 中的函数式编程`，并开启穿越 `LINQ`、应用编程（applicative\
  \ programming）、不可变性、生成器（generators）、组合器（combinators）和函数组合的之旅。\n\n`组织你的 JavaScript\
  \ 应用`将是下一个主题，涵盖模块模式、`commonJS`、`AMD`（异步模块定义）和 `ES6` 模块。\n\n最后，我们将查看 JavaScript 中的`异步编程`，包括回调、承诺（promises）和响应式编程。\n\
  \n由于 `ES6` 的普及需要一些时间，而且在未来几年里你可能会看到很多 `ES5` 代码，我们将从本书的每一节开始，展示我们现在使用 `ES5` 编写 JavaScript\
  \ 的最常见解决方案和模式。这将是理解和展示新 `ES6` 特性、它们试图解决的问题以及它们如何极大提升你的 JavaScript 的完美起点。\n\n###\
  \ 第二部分：来到 JavaScript 领域\n我们将查看 JavaScript 生态系统，并回顾该语言的简史，这有助于你理解为什么 JavaScript 会变成今天这样，然后继续介绍\
  \ `node.js` 革命以及 JavaScript 如何成为一种真正的跨平台、跨域语言。\n\n第二部分将继续介绍`如何搭建你的 JavaScript 开发环境`，以最大化你的生产力并减少你的挫败感。我们将涵盖现代\
  \ JavaScript 和前端工作流、JavaScript 单元测试、浏览器开发者工具，甚至查看各种文本编辑器和 IDE。\n\n我们将通过查看转换语言（transpiled\
  \ languages）的作用来结束第二部分。如 `TypeScript`、`CoffeeScript` 甚至 `ECMAScript 6` 等语言，以及它们如何影响并将将如何影响\
  \ JavaScript 开发。\n\n### 第三部分：使用 Angular 2 构建你的第一个现代 JavaScript 应用\n本书将通过构建现代 JavaScript\
  \ 应用的实践视角作为结束。`Angular 2` 是实现此目的的绝佳框架，因为它利用了所有现代网络标准、`ES6`，并且设计非常紧凑，使得编写 `Angular\
  \ 2` 应用感觉就像编写原生 JavaScript。这意味着，你不需要花费大量时间去学习复杂的框架概念，而是专注于开发你的 JavaScript 技能来构建一个真实的应用，达到一举两治（哈哈哈！）。\n\
  \n关于每个章节的大小和长度，除了引言外，我将每个章节都保持得很短。这种想法是你可以循序渐进地学习，获得一些可以应用到日常工作中的知识，并从一开始就感受到进步和完成感。\n\
  \n### 理解书中的代码示例\n\n#### 如何运行书中的代码示例\n为了简单起见，我建议你开始在浏览器中运行代码示例。这是最直接的方法，因为你不需要在计算机上安装任何东西。你可以在边操作边在浏览器\
  \ JavaScript 控制台中输入它们（Windows 下按 `F12`，Mac 下按 `Opt-CMD-J`），也可以使用原型工具如 [JsBin](http://jsbin.io)、[jsFiddle](https://jsfiddle.net/)、[CodePen](http://codepen.io)\
  \ 或 [Plunker](http://plnkr.co/)。这些工具都非常好，你可以选择你喜欢的。\n\n如果你不想输入，所有的示例都可以在 jsFiddle/jsBin\
  \ JavaScriptmancy 中找到：[`bit.ly/javascriptmancy-samples`](http://bit.ly/javascriptmancy-samples)。\n\
  \n测试 `ECMAScript 6` 示例，我推荐使用 [JsBin](http://jsbin.io)、[jsFiddle](https://jsfiddle.net/)\
  \ 或位于 [`babeljs.io/repl/`](https://babeljs.io/repl/) 的 Babel REPL。此外，还有一个非常有趣的 Chrome\
  \ 插件可以用来运行运行 `ES5` 和 `ES6` 示例，名为 [ScratchJS][]。\n\n如果你愿意，可以从 GitHub 下载所有代码示例，并使用\
  \ [node.js](http://www.nodejs.org) 在你的计算机本地运行它们。\n\n同时请关注 **[javascriptmancy.com](http://www.javascriptmancy.com)**，我将在不远的将来在那里添加交互练习。\n\
  \n#### 关于代码示例中所用惯例的说明\n书中三种类型的代码示例。每当你看到像下面的代码提取片段（即语句前面有一个 `>`）时，我希望你在 REPL 中输入这些示例。\n\
  \n`>` 之后的代码是你需要输入的，紧随其后的表达式是预期结果：\n\n```\n1 > 2 + 2\n2 // => 4 \n```\n\n某些你经常在 REPL\
  \ 中编写的表达式（如变量或函数声明）求值为 `undefined`：\n\n```\n1 > var hp = 100;\n2 // => undefined\n\
  ```\n\n由于我发现这只是给示例增加了不必要的噪音，我会省略这些 `undefined` 值，只写出有意义的结果。例如：\n\n```\n1 > console.log('yippiiii')\n\
  2 // => yippiiii\n```\n\n当我有一个多行语句时，我会省略 `>`，以便你可以方便地将其到 REPL 或原型工具中（*jsBin*、*CodePen*\
  \ 等）。\n\n```\n1 let createWater = function(mana){\n2     return `${mana} liters\
  \ of water`;\n3 }\n```\n\n我预计同一个章节内的示例组合运行，因此有时示例会引用之前示例中的变量。为了简单起见，我会尝试每次展示一小部分代码。\n\
  \n对于更高级的示例，代码看起来像一个程序，不会找到 `>`，我会添加文件名作为参考。你可以在喜欢的编辑器中输入文件内容，也可以直接从 GitHub 下载。\n\
  \n```\n 1 export class Doom {\n 2   constructor(){\n 3     /* 噢不！你看了...\n 4    \
  \ /\n 5     /  我很遗憾地告诉你，三天后的午夜\n 6     /  最可怕的幻象将 7     /  从你喜欢的开发机器\n 8     / \
  \ 中出来\n 9     /  那就是...\n10     /  除非你把这本书作为礼物送给\n11     /  其他 3 位开发者，如果是那样，你\n\
  12     /  将永远受福\n13     */\n 14   }\n 15 }\n```\n\nCrazyExampleOfDoom.js\n\n####\
  \ 关于书中 ECMAScript 5 和 ECMAScript 6,7 的说明\n编程中的每一个事物都有其存在的理由。你几个个月前编写的某段复杂的代码、进入应用程序的特性、语言中的某种语法或结构，*在当时都是或看起来是是好主意*。`ES6`、`ES7`\
  \ 以及未来的 JavaScript 版本都试图改进我们现有的 JavaScript 版本。而且，理解它们试图解决的痛点、它们出现的背景以及被需要的背景是有帮助的。这就是为什么本书将结合\
