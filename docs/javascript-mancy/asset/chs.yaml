  \ `C++`、`Java`、`C#` 这样的静态编程语言是被编译后执行的，而像 `Ruby`、`Python` 或 `JavaScript` 这样的动态编程语言不是编译的，而是在执行时进行解释的。结果是，编译后的程序在运行时无法更改（你需要重新编译），而解释型程序可以更改，因为在运行之前没有什么是固定不变的。然而在当今世界，像\
