  \ `GetIterator`，是因为该方法的名称本身是由常量定义的：`Symbol.iterator`：\n\n```\n1 console.log(Symbol.iterator);\n\
  2 // => Symbol(iterator)\n```\n\n如果我们查看 ES2015 (ES6) 中的数组、map 和 set，我们可以验证它们确实是可迭代的。让我们从数组开始：\n\
  \n```\n1 let inventory = [\n2   \"sword\",\n3   \"shield\",\n4   \"100 coppers\"\
  \n5 ];\n```\n\n你可以像我们在之前的章节中看到的那样，使用 `for/of` 循环遍历它：\n\n```\n1 console.log('旅行者，你的背包里有物品：')\n\
  2 for(let item of inventory){\n3   console.log(item)\n4 }\n5 // => 旅行者，你的背包里有：\n\
  6 // => sword\n7 // => shield\n8 // => 100 coppers\n```\n\n在后台，`for/of` 使用了默认迭代器，允许你遍历数组的值。你可以通过使用\
  \ `Symbol.iterator` 作为键来获取此迭代器的引用：\n\n```\n1 // 数组默认迭代器\n2 console.log(Symbol.iterator);\n\
  ```\n*(注：用户提供的原文文本后续存在重复和截断，此处已按逻辑完成翻译)*\n\n由于您提供的原文在后半部分出现了大量重复和格式断裂，以上翻译已基于核心逻辑进行了完整处理。\n\
  \n\n\n总结来说，ES6 引入集合内元素的可迭代性（iterability）概念，并将其应用于所有新旧数据结构：数组、maps 和 sets。一个可迭代对象（iterable\
  \ object）是指那些在其 `Symbol.iterator` 属性中实现了 `GetIterator` 方法的对象。原生的 JavaScript 对象不是可迭代的，因为它们没有迭代器（它们没有实现成为可迭代所需的接口）。\n\
  \n我们如何让任何任意对象都变得可迭代呢？让我们深入研究并寻找答案。\n\n### ES6 可迭代对象\n\n要让任何任意对象变得可迭代，我们需要实现一个 `GetIterator`\
  \ 方法。假设我们有之前示例中那个华丽的 `swordOfTruth`：\n\n```javascript\n 1 let swordOfTruth = {\n\
  \ 2   description: `Behold the Mighty Sword Of Truth! ....`,\n 3   damage: 100,\n\
  \ 4   magicDamage: 1000,\n 5   weight: 30,\n 6   state: 'well kept',\n 7   toString(){\
  \ return this.description}\n 8 };\n 9 console.log(swordOfTruth);\n10 // => {\"description\"\
  :\"Behold the mighty.....\n```\n\n它是一个原生的 JavaScript 对象，因此是不可迭代的：\n\n```javascript\n\
  1 try{\n2   for (let prop of swordOfTruth){\n3     console.log(prop);\n4   }\n5\
  \ }catch(ex){\n6   console.error(`Error`: ${ex.message}`);\n7   // => swordOfTruth[Symbol.iterator]\
  \ is not a function\n8 }\n```\n\n我们可以实现自己的方法 `getObjectPropertiesIterator` 来遍历对象的属性：\n\
  \n```javascript\n1 function getObjectPropertiesIterator(){\n2   // 注意，我在这里借用了一个数组的迭代器\n\
  3   // Object.getOwnPropertyNames 方法返回一个包含对象属性的数组\n4   // 我正在复用该数组的迭代器来让任何对象变得可迭代\n\
  5   let objectProperties = Object.getOwnPropertyNames(this);\n6   return objectProperties[Symbol.iterator]();\n\
  7 }\n```\n\n如果我们将它设置为对象的 `Symbol.iterator` 属性：\n\n```javascript\n1 swordOfTruth[Symbol.iterator]\
  \ = getObjectPropertiesIterator;\n```\n\n`swordOfTruth` 对象现在变得可迭代的了，你可以像使用其他数据结构一样使用\
  \ `for/of` 循环：\n\n```javascript\n1 console.log('This is the Sword of Truth!')\n\
  2 for (let prop of swordOfTruth){\n3   console.log(`${prop}: ${swordOfTruth[prop]}`);\n\
  4 }\n5 // => description: Behold the Mighty Sword of Truth!\n6 // => damage: 100\n\
  7 // ...\n8 // => toString: function(){...}\n```\n\nJavaScript 中这种关于可迭代性的新抽象/泛化酷酷且有趣的地方在于，它使我们能够以非常直接的方式复用迭代器。也就是说，你编写一个函数为对象创建一个迭代器，然后在系统的其他部分随心所欲地复用它。\n\
  \n例如，我们可以通过为 `Object.prototype` 对象添加 `Symbol.iterator` 属性，让所有对象默认都变成可迭代的：\n\n```javascript\n\
  1 Object.prototype[Symbol.iterator] = getObjectPropertiesIterator;\n```\n\n如果我们现在创建一个任意对象，得益于原型链，你将能够看到我们如何遍历它的属性：\n\
  \n```javascript\n1 var stoneOfTears = { description: \"A common blue stone with\
  \ the shape of a diamond\"};\n2 for (let prop of stoneOfTears){\n3   console.log(`${prop}:\
  \ ${stoneOfTears[prop]}`);\n4 }\n5 // => description: a common blue stone with the\
  \ shape of a diamond\n```\n\n我不知道你是否注意到，在上一个示例中，我走了一个捷径，通过从对象的属性数组中提取并复用了数组迭代器。但我们并不限于复用内置迭代器，如果我们需要额外的自由度和控制力，我们甚至可以实现自己的迭代器。让我们来看看怎么做。\n\
  \n## ES6 迭代器\n\n如果我们查看内置的[迭代器](https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Iteration_protocols)，会发现它包含一个单一的\
  \ `next` 方法：\n\n```javascript\n1 let minions = ['troll', 'orc', 'goblin'];\n2 let\
  \ it = minions[Symbol.iterator]();\n3 console.log(it.next);\n4 // => function next\n\
  ```\n\n调用这个 `next` 方法会发生什么？如果你调用 `next`，你将获得数组中的下一个元素：\n\n```javascript\n1 let nextItem\
  \ = it.next();\n2 console.log(nextItem);\n3 // => {\"value\": \"troll\", \"done\"\
  : false}\n```\n\n事实上，我们得到的是一个包含集合中下一个 `value` 以及状态 `done` 的对象，`done` 表示数组中仍有元素待遍历。我们可以继续调用\
  \ `next` 直到没有可遍历的项：\n\n```javascript\n1 console.log(it.next());\n2 // => {\"value\"\
  : \"orc\", \"done\": false}\n3 console.log(it.next());\n4 // => {\"value\": \"goblin\"\
  , \"done\": false}\n5 console.log(it.next());\n6 // => {\"done\": true}\n```\n\n\
  那么，我们如何实现自定义迭代器呢？通过实现一个 `next` 方法，返回与上述内置迭代器相同的信息，从而满足[迭代器协议](https://developer.mozilla.org/en-docs/Web/JavaScript/Reference/Iteration_protocols)。我们需要实现一个\
  \ `next` 方法来封装遍历对象的行为，但排除方法。让我们创建一个 `ObjectPropertiesIterator` 类，所示：\n\n```javascript\n\
  1 class ObjectPropertiesIterator {\n2   constructor(obj){\n3     this.properties\
  \ = Object.getOwnPropertyNames(obj)\n4                             .filter(p =>\
  \ typeof obj[p]) !== 'function');\n5     this.index = 0;\n6   }\n7   next(){\n8\
  \     if (this.index === this.properties.length) return {done: true};\n9     else\
  \ {\n10       this.index++;\n11       return {value: this.properties[this.index-1],\
  \ done: false};\n12     }\n13   }\n14 }\n```\n\n如果你查看这个迭代器的构造函数，你会看到我们声明了一个 `properties`\
  \ 数组，包含了对象中的所有属性。我们还声明了一个 `index` 来帮助跟踪当前遍历的属性。`next` 方法使用 `index` 在每次调用时遍历数组，并返回预期的\
  \ `{value, done}`。\n\n当我们定义了合适的迭代器后，可以将其设置为原生 对象的默认迭代器：\n\n```javascript\n1 let\
  \ swordOfTruth = {\n2   description: `Behold the Mighty Sword Of Truth! ....`,\n\
  3   damage: 100,\n4   magicDamage: 1000,\n5   weight: 30,\n6   state: 'well kept',\n\
  7   toString() { return this.description;},\n8   [Symbol.iterator]: getObjectPropertiesIterator\n\
  9 };\n10 \n11 function getObjectPropertiesIterator(){\n12   // 现在我们创建自己的迭代器\n13\
  \   return new ObjectPropertiesIterator(this);\n14 }\n```\n\n现在我们可以遍历 `swordOfTruth`\
  \ 的属性（而不是方法）：\n\n```javascript\n1 console.log(\"The sword of truth!\")\n2 for(let\
  \ prop of swordOfTruth){\n3   console.log(`${prop}: ${swordOfTruth[prop]}`);\n4\
  \ }\n5 /* => The sword of truth!\n6       description: Behold the Mighty Sword Of\
  \ Truth! ....\n7       damage: 100\n8       magicDamage: 1000\n9       weight: 30\n\
  10      state: well kept\n11  */\n```\n\n再次，正如我们在上一节所看到的，通过拥有迭代器的显式表示，我们可以根据需要从应用程序的其他部分复用它。\n\
  \n## 创建迭代器的更好方法：ES6 生成器\n\n最后我们到了神奇的生成器（generators）。从你在上一节中看到的，**创建新的迭代器可能有点麻烦**：你需要创建一个带有\
  \ `next` 方法的类，主动处理并跟踪迭代器的当前状态，组合 `next` 方法的结果……如果能有一种更快捷、更妙的方法来创建迭代器该有多好了？\n\n嗯，这正是生成器的用处。生成器通过\
  \ `function` 关键字后的 `*` 以及非常有特征的 `yield` 关键字，易于识别：\n\n\n\n\n\n```\n 1 // 星号和 yield\
  \ 关键字将下面的函数标记为生成器\n 2 function *getObjectPropertiesIterator(){\n 3   for (let prop\
  \ in this) {\n 4     if (typeof(this[prop]) !== 'function') {\n 5       // yield\
  \ 关键字返回属性并在\n 6       // 此处停止函数的执行\n 7       yield prop;\n 8     }\n 9   }\n10 }\n\
  11 \n12 console.log(`${getObjectPropertiesIterator()}`)\n13 // => [object Generator]\n\
  ```\n\n这个生成器创建了上一节中功能相同的迭代器，该迭代器可以遍历对象的属性但不遍历方法。现在我们可以将其添加到任何任意对象中，例如 `swordOfTruth`：\n\
  \n```javascript\n1 let swordOfTruth = {\n2   description: `Behold the Mighty Sword\
  \ Of Truth! ....`,\n3   damage: 100,\n4   magicDamage: 1000,\n5   weight: 30,\n\
  6   state: 'well kept',\n7   toString: () => this.description,\n8   [Symbol.iterator]:\
  \ getObjectPropertiesIterator\n9 };\n```\n\n```javascript\n 1 console.log(\"The\
  \ sword of truth!\")\n 2 for(let prop of swordOfTruth){\n 3   console.log(`${prop}:\
  \ ${swordOfTruth[prop]}`);\n 4 }\n 5 /* => The sword of truth!\n 6       description:\
  \ Behold the Mighty Sword Of Truth! ....\n 7       damage: 100\n 8       magicDamage:\
  \ 1000\n 9       weight: 30\n10       state: well kept\n11 */\n```\n\n## 你可以用生成器做的一些奇特操作\n\
  \n由于对生成器创建的迭代器调用 `next` 产生的结果是按需生成的，因此生成器可以用一种非常廉价且直接的方式创建无限序列。\n\n考虑以下生成器，它用于在我们假设的古代英雄在难度不断增加的游戏中，产生无限的恶鬼小精序列：\n\
  \n```javascript\n 1 // 小精们！！\n 2 function* impsExclamationExclamation(){\n 3   let\
  \ fn1 = 1,\n 4       fn2 = 1;\n 5   while (true){\n 6     let current = fn2;\n 7\
  \     fn2 = fn1;\n 8     fn1 = fn1 + current;\n 9     yield `spawned ${current}\
  \ imps!`;\n10   }\n11 }\n```\n\n定义了像这样一个生成器后，连续调用 `next` 将导致无限的小精军团：\n\n```javascript\n\
  \ 1 var imps = impsExclamationExclamation(); // 小精来了！！\n 2 console.log(imps.next().value);\n\
  \ 3 // =>  spawned 1 imps!\n 4 console.log(imps.next().value);\n 5 // => spawned\
  \ 1 imps!\n 6 console.log(imps.next().value);\n 7 // => spawned 2 imps!\n 8 console.log(imps.next().value);\n\
  \ 9 // => spawned 3 imps!\n10 console.log(imps.next().value);\n11 // => spawned\
  \ 5 imps!\n 12 console.log(imps.next().value);\n13 // => spawned 8 imps!\n14 \n\
  15 console.log('oh hero, now you are in a pickle!')\n```\n\n此外，你可以通过参数来配置生成器。我们可以定义一个新的生成器，它将\
  \ `minimumNumberOfImps` 作为起始数量的参数：\n\n```javascript\n 1 // 小精们！！\n 2 function* impsExclamationExclamationWithOffset(minimumNumberOfImps){\n\
  \ 3   let fn1 = 1, fn2 =1;\n 4   while (true){\n 5     let current = fn2;\n 6  \
  \   fn2 = fn1;\n 7     fn1 = fn1 + current;\n 8     if (current >= minimumNumberOfImps){\n\
  \ 9       yield `spawned ${current} imps!`;\n10     }\n11   }\n12 }\n```\n\n并通过从一开始就直接从\
  \ `50` 个恶小精开始来增加游戏难度：\n\n```javascript\n 1 var impsWithOffset = impsExclamationExclamationWithOffset(/*minimumNumberOfImps*/\
  \ 50\\\n 2 );\n 3 console.log(impsWithOffset.next().value);\n 4 // =>  spawned 55\
  \ imps!\n 5 console.log(impsWithOffset.next().value);\n 6 // => spawned 89 imps!\n\
  \ 7 console.log(impsWithOffset.next().value);\n 8 // => spawned 144 imps!\n 9 console.log(impsWithOffset.next().value);\n\
  10 // => spawned 233 imps!\n 11 console.log(impsWithOffset.next().value);\n12 //\
  \ => spawned 377 imps!\n 13 console.log(impsWithOffset.next().value);\n14 // =>\
  \ spawned 610 imps!\n15 \n16 console.log('oh hero, now you are in a pickle!')\n\
  ```\n\n生成器的另一个有趣功能是，如果我们把数据作为参数传递给 `next` 方法，它就可以接收数据。这些数据可以通过多种方式影响序列的迭代，例如，假设我们想重置小精的创建，为我们的英雄留出喘息的空间。我们可以创建一个这样的生成器：\n\
  \n```javascript\n 1 // 小精们！！\n 2 function* impsExclamationExclamationWithOffset(minimumNumberOfImps){\n\
  \ 3   let fn1 = 1, fn2 =1;\n 4   while (true){\n 5     let current = fn2;\n 6  \
  \   fn2 = fn1;\n 7     fn1 = fn1 + current;\n 8     // 我们传递给 next 方法的内容会被 9    \
  \ // 存储在 breathe 变量中\n10     var breathe = yield `spawned ${current} imps!`;\n11\
  \     if (breathe){\n12       fn1 = 1;\n 13       fn2 = 1;\n14     }\n15   }\n16\
  \ }\n```\n\n我们可以通过给它传递 `breathe` 参数来重启小精的流，如下例所示：\n\n```javascript\n 1 var impsWithRespit\
  \ = impsExclamationExclamationWithOffset();\n 2 console.log(impsWithRespit.next().value);\n\
  \ 3 // =>  spawned 55 imps!\n 4 console.log(impsWithRespit.next().value);\n 5 //\
  \ => spawned 89 imps!\n 6 console.log(impsWithRespit.next().value);\n 7 // => spawned\
  \ 144 imps!\n 8 console.log(impsWithRespit.next().value);\n 9 // => spawned 233\
  \ imps!\n 10 console.log(impsWithRespit.next().value);\n11 // => spawned 377 imps!\n\
  \ 12 console.log(impsWithRespit.next(/* breathe */ true).value);\n13 // => spawned\
  \ 1 imps!\n14 \n15 console.log('fiuuuuu')\n```\n\n在这里你可以体会我们如何通过传递值为为 `true` 的 `breathe`\
  \ 参数来触发序列的重启。\n\n### 总结\n\n在本章中，你学习了 JavaScript 中遍历集合的历史，从最初的可枚举性概念到 ES6 以及通过迭代器和生成器实现的迭代性泛化。总结来说，我们看到了：\n\
  \n* 之前的 JavaScript 版本通过可枚举性概念使用 `for/in` 循环遍历对象属性。\n* 使用可枚举属性和 `for/in` 的局限性和不可靠性，以及在扩展原型时的副作用。\n\
  * ES6 带来了两个新的数据结构：`maps` 和 `sets`，以及新的迭代性概念，允许我们安全地遍历数组/set 的项或 `map` 的键/值对。\n*\
  \ 如何让任何对象变得可迭代以及如何实现自定义迭代器。\n* ES6 生成器如何简化了迭代器的创建，以及如何使用生成器生成无限恶鬼序列。\n\n\n\n\n正如人们所说，好事终有尽头。我真心希望你喜欢这本巨著，希望你学到了许多新知识，并对编写\
  \ JavaScript 感到非常兴奋！\n\n祝你度过美好的一天！\n\n– Jaime，你最谦卑的仆人\n\n# 第二卷. JavaScript 魔法术与面向对象：召唤者之路\n\
  \n## 召唤与命令对象的路径（也称为面向对象编程）\n\n### 召唤与命令对象的路径（又名 OOP）简介\n\n```javascript\n 筑造魔像的方法有很多种，\n\
  \n用粘土铸造它的蓝图\n然后吟诵实例化的咒语，\n\n或者组合各个部件\n让整体获得生命，\n\n或者让它直接出世\n无需预先思考。\n\n 筑造魔像的方法有很多种，\n\
  在 JavaScript 中。\n\n            - KeDo,\n            首席术师,\n            《JavaScript\
  \ 魔法术诗》 \n```\n\n### 我来给你聊聊 JavaScript 中的 OOP\n\n欢迎来到召唤 ^(1) 与命令对象的路径！在这份古老手稿的后续，你将学习如何在\
  \ JavaScript 中操作对象，如何定义它们、创建它们，甚至如何将它们交织在一起。结束时，你将掌握 JavaScript 中的面向对象编程，并准备好指挥你庞对象军队迈向永恒的荣耀。\n\
  \nJavaScript OOP 的故事非常特别。当我年前开始认真学习 JavaScript 时，作为一名来自 C# 的开发者，我首要考虑之一就是发现如何写类（class）。我在\
  \ C# 方面颇有造诣，并希望将所有的知识和能力带入 JavaScript 世界，因此我的第一个方法是尝试将每个 C# 概念映射到 JavaScript 中。我把“类”（它们是\
  \ C# 中的核心构造结构，也是我当时编程风格中重要的组成部分）视为我精通 JavaScript 的秘密武器。\n\n嗯，无论我如何费力，也找不到关于“如何在\
  \ JavaScript 中写类”的良好参考资料。我花了很长时间才理解如何模拟经典继承。但这些时间花得很值，因为在过程中我学了许多关于 JavaScript 以及它支持面向对象编程的许多不同方式。此外，这次探索帮助我跳出经典继承，转向其他更类似于\
  \ JavaScript 的 OOP 风格，在这些风格中，灵活性和表现力优于严格且固定的类分类体系。\n\n在系列的后续部分，我将尝试手把手地带你走过我经历过的旅程。我们将从如何在\
  \ JavaScript 中实现经典继承开始，这样你就可以通过将 C# 技能翻译为 JavaScript 来获得基础的熟练程度。然后我们将超越此，进入真正利用\
  \ JavaScript 语言特性的新模式，这些模式将让你大开眼界。\n\n让我们通过对 JavaScript 面向对象编程的高级概述 ^(2) 来领略一下等待你的内容。如果你觉得无法跟上示例，不要担心。在接下来的章节中，我们将深入探讨所使用的每个概念和技术，并以更慢的速度分别讨论。\n\
  \n### JavaScript 中的 C# 类\n\nC# 的 `class` 多多等同于 JavaScript 的 `constructor function`（构造函数）和\
  \ `prototype`（原型）对：\n\n```javascript\n 1 // 这里我们有一个小鬼（Minion）的构造函数\n 2 function\
  \ Minion(name, hp){\n 3   // 构造函数通常定义 \n 4   // “类”内部的数据，构造函数中包含的\n 5   // 属性将是每个由此创建的对象的一部分\n\
  \ 6   this.name = name;\n 7   this.hp = hp;\n 9 }\n10 \n 11 // 原型通常定义 \n 12 // “类”内部的方法。它是所有\
  \ \n 13 // Minion 实例之间共享的\n14 Minion.prototype.toString = function(){\n15   return\
  \ this.name;\n16 };\n```\n\n`constructor function` 代表对象应该如何被构建（或创建），而 `prototype`\
  \ 则代表可重用行为的片段。在实践中，`constructor function` 通常定义“类”内部的成员变量，而 `prototype` 定义了它的方法。\n\
  \n你可以通过对 `new` 算符使用 `constructor function` 来实例化一个新的 `Minion` 对象：\n\n```javascript\n\
  \ 1 var orc = new Minion('orc', 100);\n 2 console.log(orc);\n 3 // => [object Object]\
  \ {\n 4 //  hp: 100,\n 5 //  name: \"orc\",\n 6 //  toString: function () {\n 7\
  \ //    return this.name;\n 8 //  }\n 9 // }\n10 \n 11 console.log(orc.toString())\n\
  12 // => orc\n 13 \n14 console.log('orc is a Minion: ' + (orc instanceof Minion));\n\
  15 // => true\n```\n\n通过实例化 `orc`，我们得到一个拥有两个属性 `hp` 和 `name` 的新 `Minion` 对象。`Minion`\
