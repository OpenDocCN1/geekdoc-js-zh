  \ `dynamic` 和 `ExpandoObject` 的方式类似），你可以在任何时间为对象添加新属性\n\n因此，我不会专注于做到 100% 的绝对正确并深究每一个微小的细节，我将倾向于保持简单，并仅在细节有助于理解\
