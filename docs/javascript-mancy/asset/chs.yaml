  6.  Yeoman 和 Visual Studio\n\n### 什么是 Yeoman?\n\nYeoman 是一套工具，旨在通过自动化可能的步骤让 Web\
  \ 开发者的生活变得更轻松，创建一个无缝的开发环境，让你专注于开发 Web 应用。这些步骤包括：\n\n*   在几秒内创建全新的项目\n*   当你更改代码时自动刷新浏览器\n\
  *   安装并管理第三方库并将其集成到应用程序中\n*   当你更改代码时自动运行测试\n*   创建 Web 应用组件并将其引入应用\n*   创建经过压缩、混淆的发布包\n\
  \nYeoman 本身由三部分工具组成：\n\n*   `yo`，脚手架工具，帮助你从零创建应用以及 Web 应用组件，例如 angular 中的指令或 knockout\
  \ 中的组件。\n*   `bower` 和 `npm`，包管理器帮助你安装和维护不可少的库。`Bower` 负责前端库，而 `npm` 专注于后端和工具。\n\
  *   `grunt` 或 `gulp`，任务运行工具管理日常任务的自动化，如构建、运行测试、托管 Web 服务器以便预览你的 Web 应用等。\n\n好了，让我们通过预览这些文中学习的内容来演示：\n\
  \n### 安装 Yeoman\n\n为了安装 [Yeoman][]，你首先需要安装 [node.js][]。[node][] 最初是一个用于 JavaScript\
  \ 开发各种应用程序的平台，它周围产生了一个惊人的社区和生态系统，促进了 JavaScript 开发者之间的协作，反过来改善了整个 Web 开发世界。而且，作为副作用，[node][]\
  \ 已成为 yeoman 等前端 DevOps 工具的绝佳环境。\n\n#### Windows\n\n*注意！！ Yeoman 工作流大量使用命令行。我建议你查看\
  \ [cmder](http://bliker.github.io/cmder/) 和 PowerShell。*\n\n1.  获取 *chocolatey](https://chocolatey.org)，Windows\
  \ 包管理器\n2.  打开你的 PowerShell 控制台并使用 *chocolatey* 安装 node\n\n```\n1 # cinst 是 chocolatey\
  \ install 的快捷方式\n2 PS> cinst nodejs.install\n```\n\n1.  安装 yeoman: yo, bower, grunt\n\
  \n\n\n\n\n```\n1 # 全局安装 yo bower 和 grunt 命令行界面 (-g) \n2 PS> npm install -g yo bower\
  \ grunt-cli\n```\n\n## Mac\n\n如果你是 Mac 用户，你可能很熟悉终端。如果你没听过 [tmux](https://www.youtube.com/watch?v=wKEGA8oEWXw)，可以去了解一下，它是同时管理多个终端的一种非常棒的方法。\n\
  \n1. 获取 [homebrew](http://brew.sh/)，Mac 的包管理器\n\n2. 在你的终端（bash, zsh 等）中执行\n\n```\n\
  1 $ brew install node\n```\n\n3. 安装 yeoman:\n\n```\n1 # 全局安装 yo bower 和 grunt 命令行界面\
  \ (-g) \n2 $ npm install -g yo bower grunt-cli\n```\n\n## 创建一些应用\n\n好了，既然我们已经安装了\
  \ `yeoman`，让我们来创建一些 Web 应用吧！在系列文章中，我将使用 [angular.js](https://angularjs.org/) 和 [knockout.js](http://knockoutjs.com/)\
  \ 创建几个应用程序，我们在后续每篇文章的进一步开发过程中，会学习更多关于 `yeoman` 的趣味性知识。\n\n让我们从 angular 开始。\n\n###\
  \ 创建一个 Angular 应用\n\n要使用 `yeoman` 创建一个新的 angular 应用，首先获取 [angular generator](https://github.com/yeoman/generator-angular)\
  \ —— [生成器](http://yeoman.io/authoring/) 就像一个食谱，告诉 `yo` 如何创建一个新项目（注意，[有很多生成器可用](http://yeoman.io/generators/)\
  \ 可用于创建不同类型的应用程序）。\n\n```\n1 PS> npm install -g generator-angular\n```\n\n现在你可以使用\
  \ `yo` 来创建一个新的 angular 项目（安装过程中对所有提示都说 *Yes* 吧）：\n\n```\n1 PS> mkdir myFavoriteQuotes\n\
  2 PS> cd myFavoriteQuotes\n3 PS> yo angular\n```\n\n这将创建一个具有以下结构的 angular 项目：\n\n\
  ```\n 1 app                 # 你的应用的实际源代码\n 2 -- scripts          # javascript 文件\n\
  \ 3 -- styles           # 样式\n 4 -- views            # 部分视图\n 5 -- images      \
  \     # 图片\n 6 -- favicon.ico      # 网站图标\n 7 -- index.html       # 主页面\n 8 -- 404.html\
  \         # 404 未找到页面\n 9 -- robots.txt       # 用于爬虫的 robots.txt 文件\n10 \n11 test\
  \                # 为你的应用搭建的测试\n 12 -- spec             # 所有 jasmine 规范的文件夹\n 13\
  \ -- karma.conf.js    # karma 测试运行器配置文件\n14 \n15 bower_components    # 存放你通过 bower\
  \ 安装的所有库\n 16 node_modules        # 存放你通过 npm 安装的所有库\n 17 package.json        #\
  \ 应用程序及其对 node.js 和 npm 依赖的定义\n 18\n 19 bower.json          # bower 中库依赖的描述\n 20\
  \ Gruntfile.js        # 供我们享用的自动化 grunt 任务集\n 21 \n22 .bowerrc            # bower\
  \ 配置\n 23 .gitattributes      # git 仓库配置\n 24 .gitignore          # git 忽略的文件\n\
  \ 25 .editorconfig       # 共享编辑器配置\n 26 .jshintrc           # jshint 配置\n 27 .travis.yml\
  \         # 可配合 travis CI 使用\n```\n\n你现在可以使用以下命令在浏览器中预览你的应用程序，这本质上会启动一个 node.js\
  \ 服务器并打开你的浏览器：\n\n```\n1 PS> grunt serve\n```\n\n现在就此，你有了一个可以开始工作的基础 angular 应用。如果你想停止服务器，只需在命令行窗口中点击\
  \ `CTRL`+`C` 即可。\n\n如果你等不及想现在就了解更多，可以在 GitHub 上查看 [angular generator](https://github.com/yeoman/generator-angular)\
  \ 的功能，并遵循[这个优秀的教程](http://yeoman.io/codelab.html)。\n\n### 创建一个 Knockout.js 应用\n\n\
  [Steven Sanderson](https://twitter.com/stevensanderson) 编写了这个 [yeoman knockout.js\
  \ 生成器](https://github.com/SteveSanderson/generator-ko)，它让你能够用非常酷的 knockout.js 配置开始编写新的单页应用。只需输入以下命令安装生成器：\n\
  \n```\n1 # 全局安装 knockout 生成器\n2 # 以及一个简单的 http-server 来提供 Web 应用服务\n3 # 因为这个生成器没有带\
  \ serve 任务\n4 PS> npm install -g generator-ko http-server\n```\n\n然后创建你的新应用：\n\n\
  ```\n1 PS> mkdir myFavoriteRecipes\n2 PS> cd myFavoriteRecipes\n3 PS> yo ko \n```\n\
  \n你可以选择使用 TypeScript 或 JavaScript，以及是否添加测试设置。当你完成新应用的脚手架后，你将拥有如下目录结构：\n\n```\n 1\
  \ src              # 包含应用源代码的文件夹\n 2 -- bower_modules # 第三方库\n 3 -- components \
  \   # knockout 组件\n 4 -- app           # 你的应用启动、路由和模块配置\n 5 -- css           # 样式\n\
  \ 6 -- index.html    # 你的应用主页面\n 7 test             # js 测试文件夹\n 8 node_modules\
  \     # 存放 npm 包的文件夹\n 9 bower.json       # bower 中库依赖的描述\n10 .bowerrc         #\
  \ bower 配置\n11 package.json     # 应用程序及其对 node.js 和 npm 依赖的定义\n12 karma.conf.js\
  \    # karma 测试运行器配置文件\n13 .gitignore       # git 忽略的文件\n```\n\n你可以选择使用 TypeScript\
  \ 或 JavaScript，以及是否添加测试设置。\n\n你可以使用 `http-server` 工具在浏览器中预览应用：\n\n```\n1 PS> http-server\
  \ src\n2 Starting up http-server, serving on http://0.0.0.0:8080\n3 Hit CTRL-C to\
  \ stop\n```\n\n### 总结\n\n在这篇文章中，我介绍了 `yeoman`，这是一个一个超级棒的*现代应用 Web 脚手架工具*。我希望你喜欢它，或者觉得它有点意思。如果你想学习更多，请继续关注……如果你等不及了，请查看这些文章：\n\
