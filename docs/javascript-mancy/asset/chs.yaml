  \n## 使用 Gulp 自动化你的前端工作流\n\n```\n text text text text text text text,  \ntext text\
  \ text text text text text,  \ntext text text text text text text,  \ntext text\
  \ text text text text text,  \ntext text text text text text text,  \ntext text\
  \ text text text text text,  \ntext text text text text text text.\n\n         \
  \                       - XXXX Xxxxx,\n                                Some title,\
  \ Some time \n```\n\n```\n1 /* \n2  * story \n3  *\n4  */\n```\n\n现代 Web 开发非常困难。根据你的环境、偏好、需求和目标，从源代码到生产就绪的应用程序有千百种步骤。\n\
  \n你可能想使用 TypeScript 或 ES2015 来获得显而易见的开发优势，但随后你需要将其中之一编译为可以在浏览器中运行的 JavaScript 版本。你可能想使用\
  \ SASS 或 LESS，同样是为了它们提供的更好的开发体验，但随后你也需要将它们编译为 CSS。你需要管理第三方库并在应用中引用它们，优化 Web 图片的大小，并打包、混淆你的资源、添加缓存刷新（cache\
  \ busting）等等，等等。\n\n\n\n\n\n有很多步骤是你可能不想一直记在脑子里或记录在某个清单上的。你希望它们成为你开发工作流的固有组成部分，并对其进行自动化，以便团队中的所有成员（甚至持续集成和交付基础设施）都能进行复现和重复重用。\n\
  \n这就是 [Gulp](http://gulpjs.com/) 和 [其他流行的任务运行器/管理器](http://jpsierens.com/task-runners-a-comparison-between-grunt-gulp-broccoli-and-mimosa/)\
  \ 派上用场的地方。Gulp 帮助你自动化工作流，通过提供 API 来创建和组合任务，使工作流显式化并在团队内共享。这些任务可以是任何内容，从将文件复制到发布目录，到转换\
  \ ES2015，到删除未使用的 CSS 类等。你可以构建自己的任务，也可以利用 Gulp 社区已经存在的庞大生态，通过插件访问你想象的任何任务。\n\n[{%\
  \ img center blend /images/barbaric-toolbox-gulp.jpg “用 gulp 自动化并增强你的工作流” “一张 gulp\
  \ 的图片，上面写着 Automate and enhance your workflow with gulp” %}](http://gulpjs.com/)\n\
  \n听起来趣吗？那么让我们开始吧。\n\n## 开始使用 Gulp\n\n### 在你的项目中安装 Gulp\n\n和[许多其他前端开发工具](http://www.barbarianmeetscoding.com/blog/2014/12/22/barbaric-development-toolbox-elevate-your-front-end-workflow-with-yeoman/)一样，gulp](http://gulpjs.com/)\
  \ 运行在 [node.js](https://nodejs.org/en/) 上。这意味着在开始使用 gulp 之前，你需要在[机器上安装 node](http://www.barbarianmeetscoding.com/blog/2014/12/22/barbaric-development-toolbox-elevate-your-front-end-workflow-with-yeoman/)。如果\
  \ node 不是你开发环境的一部分，请[查看这关于前端开发工具的文章](http://www.barbarianmeetscoding.com/blog/2014/12/22/barbaric-development-toolbox-elevate-your-front-end-workflow-with-yeoman/)，我将在文中指导你如何在\
  \ OSX 和 Windows 上进行操作。\n\n一旦你的环境中有了 node 和 npm，你就可以安装 gulp 本身了。\n\n#### 对于 Node\
  \ 练手\n\n全局安装 `gulp-cli` 并在项目中安装 `gulp`：\n\n```\n1 PS> npm install -g gulp-cli\n\
  2 PS> npm init\n3 PS> npm install gulp --save-dev\n```\n\n#### 对于 Node 初学者\n\n让我们从全局安装\
  \ gulp 命令行界面开始。打开你喜欢的命令行（PowerShell 或 [Cmder](http://bliker.github.io/cmder/) 均可）并输入：\n\
  \n```\n1 PS> npm install -g gulp-cli\n```\n\n创建一个开始学习 gulp 的文件夹：\n\n```\n1 PS> mkdir\
  \ crazy-experiments-with-gulp\n2 PS> cd crazy-experiments-with-gulp\n```\n\n并尝试运行\
  \ gulp：\n\n```\n1 PS> gulp\n```\n\n你可能会看到以下：\n\n```\n1 [20:48:11] Local gulp not\
  \ found in .../crazy-experiments-with-gulp\n2 [20:48:11] Try running: npm install\
  \ gulp\n```\n\n这为你提供了一个很好的提示，说明你需要在项目中安装 gulp。我们正处于正确的道路上！耶！\n\n在安装 gulp 之前，你需要为项目创建一个\
  \ `package.json` 清单文件。为什么呢？你可能会这样问。答案是 `package.json` 允许你定义项目的开发依赖。一旦定义，你就可以将其保存到喜欢的源码控制系统中，这样你团队的其他成员或偶然发现你代码的人也可以享受到\
  \ gulp 的便利。\n\n你可以通过输入以下内容来创建清单：\n\n```\n1 PS> npm init\n```\n\n这将启动一个向导，引导你完成创建清单的过程。由于你并不打算向\
  \ npm 发布新库，你只需一直按 `ENTER` 直到向导结束即可设置所有默认选项。这将生成一个格式正确的 `package.json`，你可以通过输入以下命令添加\
  \ `gulp` 作为开发依赖：\n\n```\n1 PS> npm install gulp --save-dev\n```\n\n这应该会产生一个包含 `gulp`\
  \ 作为 `devDependency` 的 `package.json`：\n\n```\n1 {\n2   // 等等\n3   \"devDependencies\"\
  : {\n4     \"gulp\": \"³.9.1\"\n5   },\n6   // 等等\n7 }\n```\n\n#### 恭喜！你已经在项目中安装了\
  \ Gulp！\n\n现在如果你运行 `gulp`：\n\n```\n1 PS> gulp\n2 [21:03:56] No gulpfile found\n\
  ```\n\n这突出了一个非常重要的事实：gulp 期望你有一个 `gulpfile.js` 文件，其中将包含你的自动化任务。\n\n### 创建你的第一个任务\n\
  \n让我们创建一个非常简单的 gulp 配置文件。在项目根目录下创建一个 `gulpfile.js`，用你喜欢的编辑器打开它，并输入以下内容：\n\n```javascript\n\
  1 // 获取 gulp API\n2 var gulp = require('gulp');\n3 \n4 // 创建任务\n5 gulp.task('puny-human',\
  \ function(){        // gulp.task(taskName, callback)\n6     console.log('Puny Human!!!!');\n\
  7 });\n```\n\n太棒了！你定义了第一个 gulp 任务。你可以从命令行中执行它（或使用 [Visual Studio 的 Task Runner Explorer](https://visualstudiogallery.msdn.microsoft.com/8e1b4368-4afb-467a-bc13-9650572db708)），在\
  \ `gulp` 之后输入它的名称：\n\n```\n1 PS> gulp puny-humans\n2 [21:20:43] Using gulpfile ~/GitHub/barbaric-toolbox-gulp/gulpfile.js\n\
  3 [21:20:43] Starting 'puny human'...\n4 Puny humaaaan\n5 [21:20:43] Finished 'puny\
  \ human' after 154 µs\n```\n\n`gulp.task` 是 gulp API 的核心函数之一，允许你通过提供任务名称和在调用任务时执行的函数来定义任务。\n\
  \n### 这完全关于文件流\n\n前端任务自动化与文件管理很大很大：从一个地方获取文件，对其进行转换、改进、优化和处理，然后将其放置在另一个地方。gulp 选择建模这些经过不同类型转换的文件的方式是\
  \ <a href=\"https://en.wikipedia.org/wiki/Stream_(computing)\" title=\"流!\">流</a></a>。\n\
  \n在计算机科学中，流（stream）是随时间提供的数据元素序列。流可以被认为是传送带上的物品，一个接一个地进行处理，而不是大批量处理。\n\n使用 gulp\
  \ 创建文件流的方法是使用 `gulp.src`，而将流中的文件写入你选择的某个地方的方式是通过 `gulp.dest`。\n\n假设你构建了一个 Web 应用程序，并且\
  \ `app/js` 文件夹中有一组 JavaScript 文件。你想获取这些文件、压缩、打包，然后将它们复制到 `build` 文件夹。嗯，你可以从创建一个只复制文件的简单任务开始：\n\
  \n```javascript\n1 gulp.task('build', function(){\n2     return gulp.src('app/**/*.js')\
  \          // gulp.src(glob)\n3             .pipe(gulp.dest('build'));      // gulp.dest(path)\n\
  4 });\n```\n\n如果你通过 `gulp build` 运行任务，你就能验证项目文件夹中是否有一个新的 `build` 文件夹，以及 `app/js`\
  \ 中的每个 js 文件是如何被复制到 `build/js` 的。\n\n这里值得注意的一个有趣点是 gulp 如何确定在复制时使用哪些路径。在表达式 `gulp.src('app/**/*.js')`\
  \ 中，`**` 将基础路径 `app` 与要复制到目标路径 `build` 的相对路径隔离开来。这就是为什么 `app/js/sandwich.js` 文件会被复制到\
  \ `build/js/sandwich.js`，而不是 `build/app/js/sandwich.js` 或 `build/sandwich.js`。另一个值得注意的有趣点是我们在\
  \ `gulp.task` 的函数内部返回流。我们这样做是因为这允许我们将来将任务组合在一起。\n\n一旦我们定义了文件的源和终点，就可以向流水线中添加处理步骤，如压缩或打包。例如：\n\
  \n```javascript\n1 gulp.task('build', function(){\n2     return gulp.src('app/**/*.js')\
  \          // gulp.src(glob)\n3             .pipe(minify())\n4             .pipe(bundle())\n\
  5             .pipe(cacheBust())\n6             .pipe(addBellsAndWhistles())\n7\
  \             .pipe(gulp.dest('build'));      // gulp.dest(path)\n8 });\n```\n\n\
  \n\n\n\n我们将在本系列的后续部分中介绍这这两个内容。现在，让我们回到基础吧！\n\n## 帮助可视化流\n\n可视化文件在流中移动过程的一种极佳方法是使用\
  \ `gulp-print` 插件。你可以通过 npm 安装它：\n\n```\n1 PS> npm install gulp-print --save-dev\n\
  ```\n\n然后将它添加到你的 `gulpfile.js` 的构建流水线中：\n\n```\n1 var gulp = require('gulp'),\n\
  2     print = require('gulp-print');\n3 \n4 gulp.task('build', function(){\n5  \
  \   return gulp.src('app/**/*.*')\n6             .pipe(print())\n7             .pipe(gulp.dest('build'));\n\
  8 });\n```\n\n现在你可以看到文件流流过流水线了。如果你输入 `gulp build`，你就能看到以下内容，这对于调试和理解 gulp 的工作原理非常有帮助：\n\
  \n```\n1 [21:57:28] Using gulpfile ~/GitHub/barbaric-toolbox-gulp/gulpfile.js\n\
  2 [21:57:28] Starting 'build'...\n3 [21:57:28] app/css/styles.css\n4 [21:57:28]\
  \ app/templates/footer.html\n5 [21:57:28] app/templates/header.html\n6 [21:57:28]\
  \ app/templates/main.html\n7 [21:57:28] app/js/codes.js\n8 [21:57:28] app/js/more-codes.js\n\
  9 [21:57:28] Finished 'build' after 49 ms\n```\n\n## 当文件更改时执行操作\n\n我们从自动化开始写这个博客，如果你必须手动运行每一个任务，那么我们就没有体现出自动化的价值。这就是为什么\
  \ gulp 提供了一种了一种监听文件变化并自动为你触发任务的方法。常见用例是？更改 TypeScript 或 ES6 文件，并将其自动转编译为 JavaScript\
  \ 并复制到正确的文件夹，这样你就可以在浏览器中立即或几乎立即地看到你的更改。\n\n你可以通过 `gulp.watch` 函数让 gulp 监听文件变化。我们先保持基础，每当文件发生变化时只需触发\
  \ `build` 任务：\n\n```\n1 gulp.task('watch', function(){\n2     gulp.watch('app/**/*.*',\
  \ ['build']);\n3 });\n```\n\n每当你运行 `gulp watch`，gulp 都会开始监控你指定的 glob 匹配的文件（在本例中是\
  \ `app` 文件夹及其子文件夹中的所有文件），并在其中任何一个文件发生变化时触发构建。\n\n## 设置默认任务\n\n我们即将接近这个 gulp 介绍的末尾，但我想再留给你一个小知识点。你知道如果你在项目内部直接输入\
  \ `gulp` 会发生什么吗？让我们试一下：\n\n```\n1 PS> gulp\n2 [22:28:51] Using gulpfile ~/GitHub/barbaric-toolbox-gulp/gulpfile.js\n\
  3 [22:28:51] Task 'default' is not in your gulpfile\n4 [22:28:51] Please check the\
  \ documentation for proper gulpfile formatting\n```\n\n发生的情况是 gulp 抱怨你的配置文件中没有定义\
  \ `default` 任务。嗯，你可以定义一个默认任务，每当你输入 `gulp` 时执行它。例如，可以是我们的 `build` 任务：\n\n```\n1 gulp.task('default',\
  \ ['build']);\n```\n\n现在，每当你输入 `gulp`，`build` 任务就会执行。是的！你为你节省了输入 6 个字符的时间！想想用这段空闲时间能做的事情吧！！！\n\
  \n### 总结\n\n所以我希望你喜欢开始使用 gulp。在这篇文章中，你学习了：\n\n*   如何在项目中安装 gulp，\n*   如何创建一个简单的任务来记录一些有趣的内容，\n\
  *   gulp 如何与文件流工作，通过 `gulp.src` 从你选择的源获取文件，以不同的方式对其进行转换，并通过 `gulp.dest` 将它们放回目标位置\n\
  *   如何使用 `gulp-print` 插件来可视化文件流并调试任务\n*   如何通过 `gulp.watch` 监听文件变化并触发任务\n*   以及如何定义\
  \ `default` 任务并节省你宝贵的生命精力\n\n如果你想查看本文的完整构建流水线，请检查 [GitHub 上的 Barbaric-Toolbox-Gulp\
  \ 仓库](https://github.com/Vintharas/barbaric-toolbox-gulp)。\n\n## 使用 Gulp  ES6\n\n\
  在[使用 Gulp 自动化你的前端工作流](http://www.barbarianmeetscoding.com/blog/2016/02/18/barbaric-development-toolbox-automate-your-front-end-workflow-with-gulp/)中，你学习了\
  \ Gulp 的基础知识，以及它如何通过创建和共享任务帮助你和你的团队节省宝的时间。任务可以包括从一个地方复制文件到另一个地方、压缩、打包、管理依赖、运行测试或将\
  \ [ES6](https://en.wikipedia.org/wiki/ECMAScript)/[ES2015](https://en.wikipedia.org/wiki/ECMAScript)\
  \ 甚至 TypeScript 转换为浏览器可以理解的 JavaScript 版本。\n\n[{% img center blend /images/barbaric-toolbox-gulp.jpg\
  \ “用 gulp 自动化并增强你的工作流” “一张写着 Automate and enhance your workflow with gulp 的 gulp\
  \ 图片” %}](http://gulpjs.com/)\n\n这是现代 Web 开发中的一个常见问题，你想开始使用 ES6/ES2015 并享受所有诱人的新特性，但你不能直接切换，因为[并不是每个\
  \ ES6 特性都已经被浏览器实现](https://kangax.github.io/compat-table/es6/)。这个问题的解决办法是在你的构建过程中添加一个额外的步骤，将\
  \ ES6 [转编译](https://en.wikipedia.org/wiki/Source-to-source_compiler) 为每个浏览器都能理解的\
  \ JavaScript 版本 (ES5)。\n\n你可以使用 [Babel.js](https://babeljs.io/) 进行即时转编译，但这会破坏你网站的用户体验。你也可以在每次将代码提交到版本控制之前手动进行，但那样你需要在每次提交时处理合并冲突。\n\
  \n更好的方法是使用 gulp 任务自动化 ES6 到 ES5 的转换，这样你就可以与团队共享它并避免烦恼的合并冲突。此外，你的持续集成和交付服务器可以使用同一个\
  \ gulp 任务，因此这是一个双赢局面。\n\n所以，让我们看看如何在 Babel 和 Gulp 的帮助下开始使用 ES6。\n\n## 什么是 Babel？\n\
  \n[Babel.js](https://babeljs.io/) 已成为将 ES6/ES2015 代码转换为 ES5 的*事实*标准。它不仅仅于此，还让你开始使用\
  \ JavaScript 语言的其他未来特性，这些特性仍在标准委员会的评估中，并且将来可能会成为语言的一部分（例如装饰器或 async/await）。\n\n\
  Babel 设计为一个插件系统，以便你可以选择在项目中启用哪些特性。这意味着如果你想保守一点，可以只启用当前 规范中的特性。\n\n## 使用 Gulp 和 Babel\
  \ 转编译 ES6\n\n在项目中使用 gulp 启用 ES6 最简单的方法是利用 `gulp-babel` 插件。你可以通过 npm 安装它（如果你在开发环境中没有\
  \ node 和 npm，查看这篇教你如何做的文章](http://www.barbarianmeetscoding.com/blog/2014/12/22/barbaric-development-toolbox-elevate-your-front-end-workflow-with-yeoman/)):\n\
  \n```\n1 PS> npm install --save-dev gulp-babel babel-preset-es2015\n```\n\n注意除了\
  \ `gulp-babel` 我们还安装了 `babel-preset-es2015`，它配置 babel 使用 ES6/ES2015 规范中的所有特性。\n\n\
  安装完成后，你可以创建一个新任务来处理转编译，我们将其命名为 `js`。将其添加到我们的 `gulpfile.js` 中：\n\n```\n1 var babel\
  \ = require('gulp-babel');\n2  \n3 gulp.task('default', function() {\n4 \treturn\
  \ gulp.src('app/**/*.js')               // #1 选择 app 文件夹下所有的 js \\\n5 folder\n6\
  \         .pipe(print())                           // #2 打印流中的每个文件\n7 \t\t.pipe(babel({\
  \ presets: ['es2015'] }))    // #3 使用 ES20\\\n8 将 ES2015 转编译为 ES5\n9 15 preset\n\
  9 \t\t.pipe(gulp.dest('build'));               // #4 将结果复制到 build fold\\\n10 er\n\
  11 });\n```\n\n\n\n\n现在你可以通过 `gulp js` 运行 `js` 任务了。让我们创建一个包含 ES6 代码的 JavaScript\
  \ 文件，以便验证一切是否确实按预期工作。我们将修改 `app/js/codes.js` 和 `app/js/more-codes.js` 文件，这些文件是[我们在系列前一篇文章中使用过的](http://www.barbarianmeetscoding.com/blog/2016/02/18/barbaric-development-toolbox-automate-your-front-end-workflow-with-gulp/)，你可以在\
  \ [GitHub 上找到](https://github.com/Vintharas/barbaric-toolbox-gulp)：\n\n```\n 1 //\n\
  \ 2 // codes.js\n 3 //\n 4 export class TapeMachine{\n 5     constructor(){\n 6\
  \         this.recordedMessage = '';\n 7     }\n 8     record(message){\n 9    \
  \     this.recordedMessage = message;\n10     }\n11     play(){\n12         console.log(this.recordedMessage);\n\
  13     }\n14 }\n15 \n16 //\n17 // more-codes.js\n18 // \n19 import {TapeMachine}\
  \ from \"./codes\";\n20 \n21 const tp = new TapeMachine();\n22 tp.record(\"Hello...\
  \ Hellooooo!!! Helloooooo!!!!!\");\n23 tp.play();\n24 // => Hello... Hellooooo!!!\
  \ Helloooooo!!!!!\n```\n\n运行 `gulp js` 后，我们可以看到 ES6 语法和关键字在 `build/app/js/codes.js`\
  \ 中被转译为 ES5：\n\n```\n 1 // \n 2 // codes.js\n 3 //\n 4 'use strict';\n 5 \n 6 Object.defineProperty(exports,\
  \ \"__esModule\", { value: true });\n 7 var _createClass = function () { // etc...\
  \ \n 8 function _classCallCheck(instance, Constructor) { // etc...\n 9 \n10 var\
  \ TapeMachine = exports.TapeMachine = function () {\n11     function TapeMachine()\
  \ {\n12         _classCallCheck(this, TapeMachine);\n13 \n14         this.recordedMessage\
  \ = '';\n15     }\n16 \n17     _createClass(TapeMachine, [{\n18         key: 'record',\n\
  19         value: function record(message) {\n20             this.recordedMessage\
  \ = message;\n21         }\n22     }, {\n23         key: 'play',\n24         value:\
  \ function play() {\n25             console.log(this.recordedMessage);\n26     \
  \    }\n27     }]);\n28 \n29     return TapeMachine;\n30 }();%\n31 \n32 //\n33 //\
  \ more-codes.js\n34 //\n35 \"use strict\";\n36 \n37 var _codes = require(\"./codes\"\
  );\n38 \n39 var tp = new _codes.TapeMachine();\n40 tp.record(\"Hello... Hellooooo!!!\
  \ Helloooooo!!!!!\");\n41 tp.play();\n42 // => Hello... Hellooooo!!! Helloooooo!!!!!%\n\
  ```\n\n注意，默认情况下，ES6/ES2015 预设使用了 [CommonJS 模块](http://www.commonjs.org/specs/modules/1.0/)。如果你想用\
  \ `node.js` 在后端编写 JavaScript，这很棒；但如果你想在浏览器中运行它，就不如此了。\n\n浏览器并不理解 CommonJS 模块，事实上，它任何模块都不理解，这就是为什么我们需要退回到可以采用多种形式的自定义实现：IIFE、[AMD](https://en.wikipedia.org/wiki/Asynchronous_module_definition)\
  \ 库如 [require.js](http://requirejs.org/)、[browserify](http://browserify.org/)、[webpack](https://webpack.github.io/)、[system.js](https://github.com/systemjs/systemjs)\
  \ 等。\n\n*JavaScript 模块是一个独立的世界，遗憾的是它超出了本文的范围，但我很快会写一篇关于它的！*\n\n所以！我们想在浏览器中运行 ES6，因此我们需要选择这些选项之一。在本文中，我们将利用\
  \ [system.js](https://github.com/systemjs/systemjs)，它是一个*通用动态模块加载器*，应用范围比 *browserify*\
  \ 和 *webpack* 等工具要窄得多。它专注于加载模块（ES6、CommonJS 等），并且需要更简单的设置（这样我就可以引入较少的新概念并让本文更简单）。我们需要做几件事：\n\
  \n1. **安装 ES6 polyfill（填充）**，因为 system.js 需要 ES6 promises 和生成器（generators）。无论如何我们都需要这样做，因为我们自己也想使用这些\
  \ ES6 特性。但 Babel 不是已经为我做这些了吗？你现在可能在想。嗯，Babel 将新的 ES6 语法转译为有效的 ES5 代码，但额外的方法如 `Object.assign`、新类型如\
  \ `Promise` 或生成器是在单独的 JavaScript 文件中作为 polyfill 提供的。\n\n2. **安装 system.js** 并为它添加配置\n\
  \n我们可以使用 `npm` 安装所有这些需求：\n\n```\n1 PS> npm install --save systemjs babel-polyfill\n\
  ```\n\n在这种情况下，`system.js` 和 `babel-polyfill` 是必须的。\n\n\n\n\n今天你已经学习了如何利用 babel 和\
  \ gulp 在项目中开始使用 ES6。你已经学习了：\n\n*   `Babel.js` 是一个工具，它可以将 ES6 代码编译为可以在浏览器中运行的 ES5\
  \ 代码\n*   `gulp-babel` 插件让你能够将 babel 集成到你的 gulp 前端流水线中\n*   你可以使用 2015 预设（preset）来获取基础配置以启用所有\
  \ ES5 特性\n*   默认情况下，babel 会产生 CommonJS 模块，这些模块无法在浏览器中运行\n*   你可以使用 `system.js` 模块加载器在浏览器中加载\
  \ ES6 模块\n*   除了编译代码外，你还需要添加 babel 的 `polyfill.js`，它包含了 ES6 填充程序（如 `Object.assign`、`Array.from`、`Promise`\
  \ 等）\n*   `gulp-webserver` 插件非常有用，可以快速创建一个 Web 服务器并提供静态服务\n\n在文章的下一部分，你将学习关于源码映射（source\
  \ maps）、添加监听任务（watch tasks）以便在你每次更改某些文件时重新编译 ES6、实时重载以及在你喜欢的编辑器中启用 ES6/ES2015。\n\
  \n## Webpack\n\n```\n text text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text.\n\n                                - XXXX Xxxxx,\n           \
  \                     Some title, Some time \n```\n\n```\n1 /* \n2  * story \n3\
  \  *\n4  */\n```\n\n## Testing\n\n```\n text text text text text text text,  \n\
  text text text text text text text,  \ntext text text text text text text,  \ntext\
  \ text text text text text text,  \ntext text text text text text text,  \ntext\
  \ text text text text text text,  \ntext text text text text text text,  \ntext\
  \ text text text text text text.\n\n                                - XXXX Xxxxx,\n\
  \                                Some title, Some time \n```\n\n```\n1 /* \n2  *\
  \ story \n3  *\n4  */\n```\n\n# 第三部分. 使用 Angular 2 构建现代 JavaScript 应用程序\n\n## 现代\
  \ Web 开发简介\n\n```\n text text text text text text text,  \ntext text text text text\
  \ text text,  \ntext text text text text text text,  \ntext text text text text\
  \ text text,  \ntext text text text text text text,  \ntext text text text text\
  \ text text,  \ntext text text text text text text,  \ntext text text text text\
  \ text text.\n\n                                - XXXX Xxxxx,\n                \
  \                Some title, Some time \n```\n\n```\n1 /* \n2  * story \n3  *\n\
  4  */\n```\n\n## 你的第一个 Angular 组件\n\n```\n text text text text text text text, \
  \ \ntext text text text text text text,  \ntext text text text text text text, \
  \ \ntext text text text text text text,  \ntext text text text text text text, \
  \ \ntext text text text text text text,  \ntext text text text text text text, \
  \ \ntext text text text text text text.\n\n                                - XXXX\
  \ Xxxxx,\n                                Some title, Some time \n```\n\n```\n1\
  \ /* \n2  * story \n3  *\n4  */\n```\n\n### 为什么你应该关注 Angular？\n\n自从 AngularJS 发布以来，JavaScript\
  \ 和 Web 世界发生了巨大变化。Angular 利用了自那以后发生的所有进步，拥抱 Web 标准，并弃用了许多现在已经是 JavaScript 原生的构造结构，例如模块、类或装饰器。\n\
  \n不仅如此，它还汲取了数千名开发者在 AngularJS 中开展大量项目的教训，提供了一种更一致、更紧凑的开发者体验。这种体验需要掌握的概念更少，具有易于学习的开发模型和语法。\n\
  \n它[而且速度更快、开箱即用服务端渲染、跨平台、支持旧版浏览器等。](https://angular.io/features.html)\n\n### Angular\
  \ 准备就绪了吗？\n\nAngular 确实准备就绪了！自从本文发布以来，Angular 已经从 beta（测试版）经历了 RC（候选版）到正式版，现在已经是\
  \ 4 版本。它不仅被许多公司使用，甚至在 Google 的 200 多个项目中广泛使用，包括 AdWords、GreenTea（Google 内部 CRM 系统）和\
  \ Google Fiber。\n\n### 代码示例\n\n你可以[从此 GitHub 仓库下载本博客的完整代码示例](https://github.com/Vintharas/angular2-step-by-step-01-your-first-component)。\n\
  \n### 上手 Angular 和 TypeScript\n\n学习 Angular 和 TypeScript 的最佳方法是使用 [angular cli](http://cli.angular.io)\
  \ 来引导新项目。\n\nangular cli 非常棒，因为它包含了你立即开始编写 Angular 应用程序所需的所有内容：一个可以将 TypeScript\
  \ 编译为可以在浏览器中运行的 JavaScript 的前端构建流水线、许多用于脚搭建应用的生成器、一个可以在你更改时自动在浏览器中反映这些更改的 Web 开发服务器以及更多功能。我称之为“零摩擦学习”\
  \ :)\n\n首先使用 `npm` 安装 Angular cli（在继续之前，你需要在开发机器上安装 [node.js 和 npm]）。在你选择的终端中输入：\n\
  \n```\n1 PS> npm install -g @angular/cli\n```\n\n现在你准备好使用 angular cli 创建新项目了。访问\
  \ angular cli 的命令是 `ng`。要创建一个新应用，输入以下内容：\n\n```\n1 PS> ng new angular-get-started\
  \ --style scss\n```\n\n这将从零开始创建一个新的 Angular 项目，并配置好你可以使用 SASS 作为 CSS 预处理器。如果你进入刚刚创建的\
  \ `angular-get-started` 文件夹，你会发现目录结构大致如下：\n\n```\n 1 // app 源代码（以及规范）\n 2 - src\n\
  \ 3   - app                 # 你的源代码（以及规范）\n 4   - assets              # 静态资源，如图片等\n\
  \ 5   - index.html          # 应用的入口\n 6   - styles.scss         # 应用的全局样式\n 7  \
  \ - environments        # 在这里你可以定义不同的环境配置（prod\n 8 dev，等）\n 9 \n10 // 依赖项\n11 -\
  \ node_modules          # 应用依赖的源代码\n12 - package.json          # 应用清单，列出了所有依赖项\n\
  13 \n14 // TypeScript 配置\n15 - tsconfig.json         # TypeScript 编译器配置\n16 - tslint.json\
  \           # TypeScript 校验配置\n17 \n18 // 测试\n19 - e2e                   # 包含到端测试的文件夹\n\
  20 - karma.conf.js         # karma 测试运行配置\n21 - protractor.conf.js  # protractor\
  \ e2e 测试配置\n22 \n23 - .gitignore       \n24 - README.md\n```\n\n你可以通过运行开发服务器来测试一切是否都按预期工作。输入以下命令：\n\
  \n```\n1 PS> ng serve --open\n```\n\n这应该启动开发服务器、打开浏览器并加载你的应用。你可以通过在终端中输入几次 `CTRL-C`\
  \ 来随时停止服务器。但目前只需庆祝吧！你创建了你的第一个 Angular 应用！\n\n### Index.html 你的入口\n\n`index.html`\
  \ 是应用程序的入口：\n\n*   它链接了你的样式和 JavaScript 文件\n*   它通过自定义的 `<app-root>` 元素为你的应用程序提供了\
  \ HTML 标记\n\n如果你快速查看项目中的 `index.html` 文件，你会看到以下内容：\n\n\n\n\n```\n 1 <!doctype html>\n\
  \ 2 <html>\n 3 <head>\n 4   <meta charset=\"utf-8\">\n 5   <title>AngularGetStarted</title>\n\
  \ 6   <base href=\"/\">\n 7 \n 8   <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n 9   <link rel=\"icon\" type=\"image/x-icon\" href=\"favicon.ico\"\
  >\n10 </head>\n11 <body>\n12   <!-- 3\\. Display the application -->\n13   <!--\
  \ this is your application root component -->\n14   <app-root>Loading...</app-root>\n\
  15 </body>\n16 </html>\n```\n\n你可能在想……*嗯……样式表和 JavaScript 文件在哪里呢？我看到的只有一个自定义元素 `app-root`。**。你会高兴地发现，你的视力没有问题，因为样式和\
  \ JavaScript 文件确实不在那里……只是还没有。之所以这样做是因为 Angular CLI 依赖 [Webpack](https://webpack.github.io/)\
  \ 在需要时注入这些文件。\n\n### 启动你的应用 (Bootstrapping)\n\n在 AngularJS 中，我们使用 `ng-app` 指令让 Angular\
  \ 指向应用的起点。在 Angular 中，我们使用启动引导器（bootstrapper）。你可以在 `src/main.ts` 模块中找到启动逻辑：\n\n\
  ```\n 1 import { enableProdMode } from '@angular/core';\n 2 import { platformBrowserDynamic\
  \ } from '@angular/platform-browser-dynamic';\n 3 \n 4 import { AppModule } from\
  \ './app/app.module';\n 5 import { environment } from './environments/environment';\n\
  \ 6 \n 7 if (environment.production) {\n 8   enableProdMode();\n 9 }\n10 \n11 platformBrowserDynamic().bootstrapModule(AppModule);\n\
  ```\n\n在这个文件中，我们从 `'@angular/platform-browser-dynamic'` 模块导入了 `platformBrowserDynamic`\
  \ 对象，并以 `AppModule` 作为参数调用它的 `bootstrapModule` 函数。\n\n这里有两个值得注意的地方：\n\n- `'@angular/platform-browser-dynamic'`\
  \ 启动引导器暗示了 `Angular 是平台无关的`。这意味着，你可以在浏览器中运行它，也可以使用不同的启动引导器在 Web Worker 或服务器上运行。\n\
  - 注意我们以不同的方式导入模块：`Angular` 2 模块是通过名称导入的，而应用组件是通过相对路径导入的。\n\n将 `AppModule` 作为参数调用\
  \ `bootstrapModule` 函数告诉 Angular 该模块是你应用程序的主模块。\n\n### 等等……但什么是 Angular 模块？我以为我们在\
  \ Angular 中只是在使用 ES6 模块了！\n\n是的，我们在 Angular 中确实使用了标准的 ES6 模块。Angular 模块只是为我们开发者提供的一种新便利，是一种用于封装\
  \ ES6 模块的高级模块，其核心在于*开发者人体工程学*。\n\nAngular 模块和新的 `NgModule` 装饰器允许我们在一个地方声明应用的所有依赖和组件，而不需要对每个组件单独进行（就像我们以前在之前的版本中所做）：\n\
  \n```\n 1 import { BrowserModule } from '@angular/platform-browser';\n 2 import\
  \ { NgModule } from '@angular/core';\n 3 import { FormsModule } from '@angular/forms';\n\
  \ 4 import { HttpModule } from '@angular/http';\n 5 \n 6 import { AppComponent }\
  \ from './app.component';\n 7 \n 8 @NgModule({\n 9   declarations: [ AppComponent\
  \ ],\n10   imports: [ BrowserModule, FormsModule, HttpModule ],\n11   providers:\
  \ [],\n12   bootstrap: [AppComponent]\n13 })\n14 export class AppModule { }\n```\n\
  \n`NgModule` 装饰器接收一个包含以下信息的对象：\n\n- 一个 `imports` 数组，在其中声明模块依赖，例如浏览器、表单、路由或 http。上面使用的\
  \ `BrowserModule` 包含了在浏览器上运行 Angular 所的所有依赖。\n- 一个 `declarations` 数组，在其中声明属于当前模块的组件和指令。\n\
  - 一个 `bootstrap` 数组，用于标识 Angular 应该用于启动应用的根组件。\n\n在这个示例中，我们从 `app.component.ts`\
  \ 模块导入了 `AppComponent` 组件，并将其设置为应用的根节点。\n\n### 你的第一个组件：列出星球大战中的知名人物！\n\n我们要做的第一件事不需要服务，暂时不需要。我们将创建第一个组件来显示《星球大战》人物列表，并开始模拟这些数据。\n\
  \n从定义我们问题领域的领域模型开始是一个良好的习惯，在这种情况下是一个 `Person`。我们将利用 TypeScript 的 `interface`（尽管我们也可以使用类），并在\
  \ `person.ts` 文件中创建一个 `Person`。但我们不会手动创建它，我们将使用 Angular CLI！Angular CLI 来救了！\n\n\
  Angular CLI 有我们称为生成器（generators）的东西，它可以为你脚手架应用程序的一部分。例如，你可以使用以下命令创建一个接口：\n\n```\n\
  1 PS> ng generate interface person\n2 # 或者使用简写：\n3 # ng g i person \n```\n\n运行此命令的结果是在\
  \ `app` 文件夹中生成一个 `person.ts` 文件：\n\n```\n1 export interface Person{\n2 }\n```\n\n\
  现在，让我们添加一些代表人物的属性：\n\n```\n1 export interface Person{\n2     name: string;\n3  \
  \   weight: number;\n4     height: number;\n5 }\n```\n\n\n\n既然我们已经定义了领域模型的核心对象，现在让我们创建第一个组件：`PeopleListComponent`。再次利用\
  \ Angular cli 并输入以下内容：\n\n```\n1 PS> ng generate component --inline-template people-list\n\
  2 # 或者使用简写形式：\n3 # ng g c -it people-list \n```\n\n这将生成一个名为 `people-list` 的新文件夹，并在文件夹内放置一个\
  \ TypeScript 文件和一个样式文件。由于我们选择了 `--inline-template` 选项，组件将不会使用外部模板文件，而是使用 `@Component`\
  \ 装饰器中的 `template` 属性来定义内联模板。\n\n它看起来像这样：\n\n```\n 1 import { Component, OnInit\
  \ } from '@angular/core';\n 2 \n 3 @Component({\n 4   selector: 'app-people-list',\n\
  \ 5   template: `\n 6     <p>\n 7       people-list Works!\n 8     </p>\n 9   `,\n\
  10   styleUrls: ['./people-list.component.scss']\n11 })\n12 export class PeopleListComponent\
  \ implements OnInit {\n13 \n14   // 暂时可以忽略这些内容 :)\n15   constructor() {}\n16   ngOnInit()\
  \ {}\n17 }\n```\n\n好了，现在我们有了一个可以使用 `<app-people-list>` 元素渲染的组件。事实上，你可以发现 Angular\
  \ cli 是创建一个虚拟模板的，以便你可以立即测试组件是否正常工作。但在显示《星球大战》名人列表之前，我们仍然需要进行一些更改。\n\n我们将做的下一件事是暴露一个\
  \ `people` 属性，它是一个包含 `Person` 对象的数组，其中包含了强大的卢克（Luke）、达斯·维德（Darth Vader）和汉·索罗（Solo）。\n\
  \n```\n 1 import { Component, OnInit } from '@angular/core';\n 2 import { Person\
  \ } from '../person';\n 3 \n 4 @Component({\n 5   selector: 'app-people-list',\n\
  \ 6   template: `\n 7     <p>\n 8       people-list Works!\n 9     </p>\n10   `,\n\
  11   styleUrls: ['./people-list.component.scss']\n12 })\n13 export class PeopleListComponent{\n\
  14   people: Person[] = [\n15     {name: 'Luke Skywalker', height: 177, weight:\
  \ 70},\n16     {name: 'Darth Vader', height: 200, weight: 100},\n17     {name: 'Han\
  \ Solo', height: 185, weight: 85},\n18   ];\n19 \n20   constructor(){}\n21   ngOnInit(){}\n\
  22 }\n```\n\n现在我们将更新它的模板，以便能够表示《星球大战》人物列表。就像 AngularJS 中的 `ng-repeat` 一样，Angular\
  \ 提供了一个重复器指令，让我们重复模板的部：`*ngFor`：\n\n```\n1   <!-- 这是 ng-repeat 的新语法 -->\n2   <ul>\n\
  3     <li *ngFor=\"let person of people\">\n4       {{person.name}} \n5     </li>\n\
  6   </ul>\n```\n\n`ngFor` 之前的 `*` 符号表示 `*ngFor` 是一个被叫做**结构型指令**（structural directive），这种指令会以某种方式影响\
  \ DOM，向其添加或删除元素。很快你就会注意到 Angular 如何在语法中使用许多此类标记来传达特定的含义，并帮助你学习和理解不同的指令以及框架部分的作用。\n\
  \n`let person` 创建了一个本地模板变量，它包含 `people` 数组中的每一项，并绑定到每个 `li` 元素上。\n\n将一切整合在一起，我们得到：\n\
  \n```\n 1 import { Component, ngOnInit } from '@angular/core';\n 2 import { Person\
  \ } from '../person';\n 3 \n 4 @Component({\n 5   selector: 'app-people-list',\n\
  \ 6   template: `\n 7   <!-- 这是 ng-repeat 的新语法 -->\n 8   <ul>\n 9     <li *ngFor=\"\
  let person of people\">\n10      {{person.name}} \n11     </li>\n12   </ul>\n13\
  \   `\n14 })\n15 export class PeopleListComponent{\n16   people: Person[] = [\n\
  17     {name: 'Luke Skywalker', height: 177, weight: 70},\n18     {name: 'Darth\
  \ Vader', height: 200, weight: 100},\n19     {name: 'Han Solo', height: 185, weight:\
  \ 85},\n20   ];\n21 \n22   constructor(){}\n23   ngOnInit(){}\n24 \n25 }\n```\n\n\
  现在我们可以更新 `AppComponent` 来显示《星球大战》人物列表了。我们只需要更新 `app.component.html` 模板即可：\n\n```\n\
  1 <h1>{{title}}</h1>\n2 <app-people-list></app-people-list>\n```\n\n然后——魔法发生了！！！它自动运行了！（（再次检查浏览器更新，或运行\
  \ `ng serve -o`）。\n\n值得提到的一点是，如果你遵循了之前的步骤但却是手动创建新组件，那么它是无法运行的。这是为什么呢？因为 Angular\
  \ cli 在后台为你做了很多工作。例如，当我们之前创建组件时，cli 不仅创建了组件本身，还将其连接起来，以便我们可以在应用程序中使用它。\n\n事实上，要在另一个组件中使用组件，你需要让你的应用程序感知它。你可以在\
  \ `app.module.ts` 文件中（即你的 Angular 模块）完成这一点。如果你查看这个文件，你会发现以下内容：\n\n```\n 1 import\
  \ { AppComponent } from './app.component';\n 2 // 谁这么做的？\n 3 import { PeopleListComponent\
  \ } from './people-list/people-list.component';\n 4\n 5 @NgModule({\n 6   declarations:\
  \ [\n 7     AppComponent,\n 8     PeopleListComponent //还有这个呢？？\n 9   ],\n10   //\
  \ 等等\n11 })\n12 export class AppModule { }\n```\n\n没错！angular cli 已经连接好了，省去了你自己去做的麻烦。太棒了！愿神保佑\
  \ angular cli！\n\n### 结\n\n干得好！你开启了学习 Angular 的之路！耶！在这篇博客中我们接触了大量内容：Angular、TypeScript、Angular\
  \ cli、模块、引导、组件、装饰器、类和模板字符串。接下来是！**重构为服务**（Refactoring to services）！\n\n\n\n\n\n\n\
  我知道，我们目前的数据访问逻辑非常简单，只是实例化了一个数组，到此结束，但在不久的将来我们将使用服务（service），所以请多包涵 :)\n\n## 什么是\
  \ Angular 服务？\n\n每个应用程序由许多子系统组成，它们执行不同的任务，如日志记录、数据访问、缓存、特定的应用程序领域知识等。根据你构建的应用程序类型或所使用的框架，有不同的方法来表示这些子系统。\n\
  \nAngular 使用 `services` 的概念，Angular 服务 是一个 `class`，它封装了某些功能并将其作为服务提供应用程序的其他部分。\n\
  \n如果你有 AngularJS 背景，你将会欢迎 Angular 概念模型中的这种简化：不再有 service/factory/constant/provider\
  \ 的困扰。在 Angular 中只有服务，而且它们只是原生的 ES6 `classes`。\n\n## 创建 PeopleService\n\n让我们在新文件\
  \ `people.service.ts` 中创建一个新的 `PeopleService`。我们将利用 Angular CLI 生成器并运行以下命令：\n\n\
  ```\n1 PS> ng generate service people\n2 # 简写形式：\n3 # ng g s people\n```\n\n这将创建一个名为\
  \ `people.service.ts` 的空服务，其内容如下：\n\n```\n1 import { Injectable } from '@angular/core';\n\
  2 \n3 @Injectable()\n4 export class PeopleService {\n5 \n6   constructor() { }\n\
  7 \n8 }\n```\n\n现在，如果我们将数据访问代码从 `PeopleListComponent` 提取到服务中，我们将得到以下内容：\n\n```\n\
  \ 1 import { Injectable } from '@angular/core';\n 2 import { Person } from './person';\n\
  \ 3 \n 4 @Injectable()\n 5 export class PeopleService {\n 6   constructor() { }\n\
  \ 7 \n 8   getAll() : Person[] {\n 9     return [\n10       {name: 'Luke Skywalker',\
  \ height: 177, weight: 70},\n11       {name: 'Darth Vader', height: 200, weight:\
  \ 100},\n13       {name: 'Han Solo', height: 185, weight: 85},\n14     ];\n15  \
  \ }\n16 \n17 }\n```\n\n如你所示，这只是一个[原生的 ES6 类](http://www.barbarianmeetscoding.com/blog/2015/12/20/white-tower-summoning-enhanced-the-marvels-of-es6-classes/)，它暴露了一个\
  \ `getAll` 方法，该方法返回人物列表。\n\n## 在 People List 组件中注入我们的 People Service\n\n现在我们有了一个封装了星球大战人物数据访问的服务，我们可以在\
  \ `PeopleListComponent` 中使用它。我们将利用依赖注入，并通过组件的构造函数注入服务。\n\n### 什么是依赖注入？\n\n现实世界的应用程序执行着很多事情。\n\
  \n为了管理现实系统固有的复杂性，我们将其拆分为更小的子系统，理想情况下每个系统只做一件事或极小的一组事情。\n\n结果我们得到了由相互依赖的小组件组成的简单系统。最初，我们可能将这些依赖项硬编码（例如使用\
  \ `new` 运算符来实例化它们），但我们希望这些依赖项之间了解尽可能少的信息。我们希望每个子系统依赖于抽象而不是具体的实现。\n\n为什么呢？因为这样我们就可以创建更灵活、可扩展且健壮的系统，具体实现的更改不会传播到系统的其他部分。\n\
  \n所以我们拥有了这些仅依赖于抽象的优秀子系统集合。但是……我们应该如何与它们协作并用它们创建一个真正的程序呢？或者说，我们如何让它们在运行时使用真实的依赖项？嗯，这就是依赖注入的用处。它是我们向这些子系统引入可以在运行时执行实际工作的真实实现的机制。\n\
  \n如果你想[了解更多关于 SOLID、依赖倒置原则和依赖注入，请查看这篇文章](http://www.barbarianmeetscoding.com/blog/2010/12/02/introduction-to-principles-of-object-oriented-design/)\n\
  \n### 使用 Angular 依赖注入在 People List 组件中注入我们的 People Service\n\n我们首先从 `people.service`\
  \ 模块导入 `PeopleService`：\n\n```\n1 import { PeopleService } from '../people.service';\n\
  ```\n\n然后通过构造函数将其注入到 `PeopleListComponent`：\n\n```\n1 export class PeopleListComponent{\n\
  2   people: Person[] = [];\n3 \n4   // 这种简写语法会自动在类中创建并\n5   // 初始化一个新的私有成员\n6  \
  \ constructor(private peopleService: PeopleService) { \n7     this.people = peopleService.getAll();\n\
  8   }\n9 }\n```\n\n我们使用 TypeScript 的简写语法直接声明 `PeopleListComponent` 的私有成员。构造函数中的\
  \ `private peopleService` 等同于：\n\n```\n1 export class PeopleListComponent {\n2 \
  \  private peopleService: PeopleService;\n3   people: Person[] = [];\n4 \n5   constructor(peopleService\
  \ : PeopleService){ \n6     this.peopleService = peopleService\n7     this.people\
  \ = this.peopleService.getAll();\n8   }\n9 }\n```\n\n大功告成了，整个 `PeopleListComponent`\
  \ 现在看起来像这样：\n\n```\n 1 import { Component, OnInit } from '@angular/core';\n 2 import\
  \ { Person } from '../person';\n 3 import { PeopleService } from \"../people.service\"\
  ;\n 4 \n 5 @Component({\n 6   selector: 'app-people-list',\n 7   template: `\n 8\
  \   <!-- 这是 ng-repeat 的新语法 -->\n 9   <<ul>\n10     <li *ngFor=\"let person of people\"\
  >\n11      {{person.name}} \n12     </li>\n13   </ul>\n14   `,,\n15   styleUrls:\
  \ ['./people-list.component.scss']\n16 })\n17 export class PeopleListComponent implements\
  \ OnInit {\n18   people: Person[];\n19 \n20   constructor(private peopleService:\
  \ PeopleService) { \n21     this.people = peopleService.getAll();\n22   }\n23 \n\
  24   ngOnInit() {} \n25 }\n```\n\n如果你运行了 http 服务器（如果你没有运行 `ng serve`），你会看到……它没起作用！！\n\
  \n嗯……一切看起来正常……`PeopleListComponent` 使用了 `PeopleService`……打开浏览器开发者工具，你会发现以下错误消息：\n\
  \n```\n1 No provider for PeopleService! (PeopleListComponent -> PeopleService)\n\
  ```\n\n啊！Angular 不知道向 `PeopleListComponent` 注入 `PeopleService`。让我们下一步这样做。\n\n##\
  \ 在 Angular 中注册你的服务\n\n要在 Angular 中注册服务，你需要使用 `Component` 装饰器中的 `providers` 属性。例如，为了让\
  \ `PeopleService` 在整个应用程序中可用，我们可以在 `AppComponent` 组件中注册它。这将使该组件及其所有子组件（如 `PeopleListComponent`）可用。我们首先从模块导入服务：\n\
  \n```\n1 import { PeopleService } from './people.service';\n```\n\n将其添加到 `Component`\
  \ 装饰器的 `providers` 属性中：\n\n```\n1 import { Component } from '@angular/core';\n2\
  \ import { PeopleService } from './people.service';\n3 \n4 @Component({\n5   selector:\
  \ 'app-root',\n6   templateUrl: './app.component.html',\n7   styleUrls: ['./app.component.scss'],\n\
  8   providers: [PeopleService]\n9 })\n10 export class AppComponent {\n11   title\
  \ = 'Star Wars PPlz!!!';\n12 }\n```\n\n在某种程度上，我们可以将此 `providers` 属性与 IoC（控制反转）容器的配置部分进行比较。\n\
  \n在这个特定的示例中，我们作了小弊，因为我们在 `PeopleListComponent` 构造函数和此 `providers` 属性中都使用了具体的类。请多包涵，在系列文章的前几中中我会尽可能保持简单，稍后会详细扩展\
  \ Angular 中的依赖注入。\n\n好吧，好吧……嘿嘿，如果你等不及，可以使用这种更冗长的方法立即让你的应用程序依赖于抽象：\n\n\n\n\n\n```\n\
  1 // 在 AppComponent 中\n2 providers: [ {provide:'IPeopleService', useClass: PeopleService}\
  \ ]\n3 \n4 // 在 PeopleListComponent 中\n5 constructor(@Inject(\"IPeopleService\"\
  )private _peopleService : IPeopleService)\n6 \n7 // 在 PeopleService 中\n8 export\
  \ interface IPeopleService {...}\n9 export class PeopleService implements IPeopleService\
  \ {...}\n```\n\n注意，这种类型匹配很重要，因为我们正在使用 `TypeScript`。如果我们使用 `ES6` 或 `vanilla JavaScript`，那么无论类型我们都可以注入我们想要的内容。\n\
  \n### 你也可以在模块级别注册服务\n\n随着 RC5 之后引入 `NgModule` 装饰器和 Angular 模块的新概念，你现在可以注册服务供整个模块使用。你可以通过\
  \ `NgModule` 装饰器的 `providers` 属性来实现这一点：\n\n```\n1 import { PeopleService } from\
  \ './people.service';\n2 \n3 @NgModule({\n4   imports: [ BrowserModule, routing\
  \ ],\n5   declarations: [ AppComponent, PeopleListComponent, PersonDetailsComponent],\n\
  6   bootstrap: [ AppComponent ],\n7   providers: [ PeopleService] // 你可以在这里放置你的服务！\n\
  8 })\n9 export class AppModule { }\n```\n\n你会在什么时候这样做呢？——你可能会想。嗯，每当你要在整个应用程序中使用同一个服务实例时即可。\n\
  \n### Angular Cli 可以帮助你注册！耶！\n\nAngular Cli 也可以帮助你注册服务。当你生成一个新的服务时，除了生成新服务外，还可以使用一个额外的标记将注册代码注入到模块中：`--module`\
  \ 标记（简写为 `-m`）。\n\n例如，下面的示例将生成 `PeopleModule` 并将其注册到我们的 `AppModule` 中：\n\n```\n\
  1 PS> ng generate service people --module app\n2 # 使用简写符号：\n3 # ng g s people -m\
  \ app\n```\n\n很酷吧？Angular `cli` 反击了，为我们节省了一些额外的击键。\n\n### 利用 Angular 组件生命周期\n\n\
  Angular 相比 `AngularJS` 的另一个改进是，现在钩入组件生命周期非常简单。例如，我们可以让 `constructor` 变得简洁，并将数据初始化移动到\
  \ `OnInit` 组件中。\n\n```\n 1 import { Component, OnInit } from '@angular/core';\n\
  \ 2 import { Person } from './person';\n 3 import { PeopleService } from './people.service';\n\
  \ 4 \n5 @Component({\n 6   selector: 'people-list',\n 7   template: `\n 8   <!--\
  \ 这是 ng-repeat 的新语法 -->\n 9   <ul>\n10     <li *ngFor=\"let person of people\">\n\
  11         {{person.name}}\n12     </li\n13   </ul>\n14   `\n15 })\n16 export class\
  \ PeopleListComponent implements OnInit{\n17   people: Person[] = [];\n18   constructor(private\
  \ _peopleService : PeopleService){ }\n19 \n20   ngOnInit(){\n21     this.people\
  \ = this._peopleService.getAll();\n22   }\n23 \n24 }\n```\n\n这在编写单元测试时将非常有帮助，因为我们可以信赖于这一点：当我们实例化组件时，它不会执行任何沉重的工作。此外，组件的\
  \ inputs 在类构造函数内部尚不可，只有在之后的 `OnInit` 生命周期钩子中才可用（你将在本系列的后续章节学习 inputs）。\n\n### 在你的服务中启用依赖注入\n\
  \n我们看到了如何在组件中注入内容，但如何在服务中注入内容呢？嗯，你遵循与组件相同的过程，通过在 `constructor` 中注入依赖项并在根组件的 `providers`\
  \ 属性中注册。此外，你还需要用 `Injectable` 装饰器来装饰服务，正如下面的示例所示：\n\n```\n 1 import { Injectable\
  \ } from '@angular/core';\n 2 import { Person } from './person';\n 3 import { SomeOtherService\
  \ } from './some-other.service';\n 4 \n5 @Injectable()\n6 export class PeopleService{\n\
  \ 7   constructor(private _someOtherService: SomeOtherService){}\n 8 \n9   getAll()\
  \ : Person[] {\n10     return [\n11       {name: 'Luke Skywalker', height: 177,\
  \ weight: 70},\n12       {name: 'Darth Vader', height: 200, weight: 100},\n13  \
  \     {name: 'Han Solo', height: 185, weight: 85},\n14     ];\n15   }\n16 \n17 }\n\
  ```\n\n我们为什么不在组件中使用 `Injectable` 装饰器呢？因为 `Component` 装饰器直接启用了依赖注入。\n\n每当你使用 Angular\
  \ `cli` 生成服务时，它都会为你添加 `Injectable` 装饰器。所以使用 Angular `cli`，你就可以完全忘记这一节并过上幸福的生活了。\n\
  \n字体 想了解更多关于 Angular 依赖注入吗？\n\n你想学习更多关于 Angular 依赖注入，并且等不及看我写关于它的后续文章？别担心，查看这两篇很色的文章：\n\
  \n- [Dependency Injection in AngularJS and Angular](http://victorsavkin.com/post/126514197956/dependency-injection-in-angular-1-and-angular-2)\
  \ 由 [Viktor Savkin](https://twitter.com/victorsavkin) ，他是 Angular 核心团队成员之一。\n- [Dependency\
  \ Injection in Angular](http://blog.thoughtram.io/angular/2015/05/18/dependency-injection-in-angular-2.html)\
  \ 出自 [Thoughtram blog](http://blog.thoughtram.io/)\n- [Dependency Injection in Angular](https://angular.io/docs/ts/latest/guide/dependency-injection.html)\
  \ 出自 Angular 文档\n\n## 结语\n\n做得好！现在你已经了解了组件、服务和依赖注入。接下来我们将通过创建一个第二个组件来学习更多 Angular\
  \ 数据绑定，该组件将帮助我们发现更多关于这些古代星球大战英雄的信息。\n\n祝你今天过愉快！\n\n## 你的第二个组件和 Angular 数据绑定\n\n\
  ```\n text text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text.\n\
  \n                                - XXXX Xxxxx,\n                              \
  \  Some title, Some time \n```\n\n```\n1 /* \n2  * story \n3  *\n4  */\n```\n\n\
  早上好！在前两个章节中，你编写了第一个 Angular 组件，将数据访问逻辑重构为服务，并利用 Angular 依赖注入将其注入到组件中。\n\n在本章中，你将创建第二个组件，并将更好地理解\
  \ Angular 在数据绑定方面提供的不同可能性。让我们开始吧！\n\n### 代码示例\n\n你可以从[此 GitHub 仓库](https://github.com/Vintharas/angular2-step-by-step-03-your-second-component-and-data-bindings)\
  \ 下载本文的代码示例。\n\n### 人员详情组件\n\n我们想要了解更多关于这些星球大战角色的信息。因此，我们将更新应用程序，以便当你点击 `PeopleListComponent`\
  \ 中的某个人时，我们为所选的人员显示更详细的信息。\n\n我们将首先直接在 `PeopleListComponent` 中显示这些详细信息，然后将其提取到自己的\
  \ `PersonDetailsComponent` 中。\n\n最终解决方案应该是这样的：\n\n### 我们现在的人列表组件\n\n这是上一个练习结束时 `PeopleListComponent`\
  \ 的样子：\n\n\n\n\n\n我们正在为 `PeopleService` 获取一个《星球大战》角色列表，并利用 `*ngFor` 指令和插值绑定将它们展示给用户。\n\
  \n### 点击角色时显示人员详情\n\n现在，我们希望在点击任何一个人员时都能选中它。我们该如何做呢？我们使用 Angular 的 `(click)` 事件绑定。\n\
  \n```\n 1 @Component({\n 2   selector: 'app-people-list',\n 3   template: `\n 4\
  \   <!-- 这是 ng-repeat 的新语法 -->\n 5   <<ul>\n 6     <li *ngFor=\"let person of people\"\
  >\n 7 \n 8       <!-- 这里：添加带有点击事件绑定的元素 -->\n 9       <a href=\"#\" (click)=\"selectPerson(person)\"\
  >\n10         {{person.name}} \n11       </a>\n12     </</li>\n13      </ul>\n14\
  \   `\n15 })\n```\n\n`(click)=\"selectPerson(person)\"` 事件绑定告诉 Angular，每当用户点击 `a`\
  \ 元素时，都调用 `selectPerson` 组件方法。\n\n我们现在可以更新 `PeopleListComponent` 来为视图提供该方法：\n\n\
  ```\n 1 export class PeopleListComponent implements OnInit{\n 2   people: Person[]\
  \ = [];\n 3   selectedPerson: Person;\n 4 \n 5   constructor(private _peopleService\
  \ : PeopleService){ }\n 6 \n 7   ngOnInit(){\n 8     this.people = this._peopleService.getAll();\n\
  \ 9   }\n10 \n11   <!-- 这里是新方法 -->\n12   selectPerson(person){\n13       this.selectedPerson\
  \ = person;\n14   }\n15 }\n```\n\n现在，每当用户点击列表中的人员时，Angular 都会调用 `selectPerson` 方法，该方法反过来会更新\
  \ `PeopleListComponent` 内部 `selectedPerson` 属性。\n\n如果我们现在模板中使用 `selectedPerson`\
  \ 属性，就得到了解决方案：\n\n```\n 1 @Component({\n 2   selector: 'app-people-list',\n 3  \
  \ template: `\n 4   <!-- 这是 ng-repeat 的新语法 -->\n 5   <<ul>\n 6     <li *ngFor=\"\
  let person of people\">\n 7       <a href=\"#\" (click)=\"selectPerson(person)\"\
  >\n 8         {{person.name}} \n 9       </a>\n10     </li>\n11   </</ul>\n12 \n\
  13   <!-- 这里：我们添加了人员详情的模板 -->\n14   <section *ngIf=\"selectedPerson\">\n15     <h2>你选择了：\
  \  {{selectedPerson.name}}</h2>\n16     <h3>描述</h3>\n17     <p>\n18        {{selectedPerson.name}}\
  \ 体重为 {{selectedPerson.weight}}，身高为 selected\\\n19 Person.height}}。\n20     </p>\n\
  21   </section>\n22   `\n23 })\n```\n\n注意我们是如何使用 `*ngIf` 绑定（类似于 AngularJS 中的 `ng-if`）的，`*ngIf`\
  \ 是另一个像 `*ngFor` 一样的结构型指令，它可以根据表达式操作 DOM。在这种情况下，只有在选择了人员时才会显示该人员的详情信息。\n\n包含人员详情的完整\
  \ `PeopleListComponent` 如下：\n\n```\n 1 import { Component, OnInit } from '@angular/core';\n\
  \ 2 import { Person } from '../person';\n 3 import { PeopleService } from '../people.service';\n\
  \ 4 \n 5 @Component({\n 6   selector: 'app-people-list',\n 7   template: `\n 8 \
  \  <!-- 这是 ng-repeat 的新语法 -->\n 9   <ul>\n10     <li *ngFor=\"let person of people\"\
  >\n11       <a href=\"#\" (click)=\"selectPerson(person)\">\n12         {{person.name}}\
  \ \n13       </a\n14     </</li>\n15   </ul>\n16 \n17   <section *ngIf=\"selectedPerson\"\
  >\n18     <h2>你选择了：  {{selectedPerson.name}}</h2>\n19     <h3>描述</h3>\n20     <p>\n\
  21        {{selectedPerson.name}} 体重为 {{selectedPerson.weight}}，身高为 selected\\\n\
  22 Person.height}}。\n23     </p>\n24   </section>\n25   `\n26 })\n27 export class\
  \ PeopleListComponent implements OnInit{\n28   people: Person[] = [];\n29   selectedPerson:\
  \ Person;\n30 \n31   constructor(private peopleService : PeopleService){ }\n32 \n\
  33   ngOnInit(){\n34     this.people = this.peopleService.getAll();\n35   }\n36\
  \ \n37   selectPerson(person: Person){\n38     this.selectedPerson = person;\n39\
  \   }\n40 \n41 }\n```\n\n### 什么是 Angular 事件绑定？\n\nAngular 数据绑定的工作方式与 AngularJS 有些不同。\n\
  \nAngular 提供了多种绑定选项。你已经看到了插值绑定，它提供了从组件到模板的单向数据绑定，用于显示数据。现在你学习了`事件绑定`，它在模板和底层组件之间提供了单向数据绑定。\n\
  \n事件绑定语法允许你直接将组件方法绑定到 DOM 事件上。你不再需要像在 AngularJS 中那样使用 `ng-click`、`ng-change` 等自定义\
  \ Angular 绑定了……你只需要绑定 `(click)`、`(change)` 或任何你需要的事件即可。\n\n### 将人员详情提取到独立组件中\n\n\
  如果你查看之前的 `PeopleComponentList` 代码示例，感觉里面发生的事情太多了。当你开始产生“这里内容太多了”的这种念头时，这就是你需要开始考虑拆分内容的完美信号。\n\
  \n人员详情是拥有一个独立组件的完美人选。让我们创建一个 `PersonDetailsComponent` 吧！耶！\n\n我们开始创建一个新的 `person-details.component.ts`\
  \ 文件和一个包含我们新组件的模块。再次 Angular CLI 派上了用场，输入以下命令生成新组件：\n\n```\n1 PS> ng g c -it -is\
  \ person-details\n2 # ng generate component --inline-template --inline-style\n```\n\
  \n这将包含与显示人员详情信息相关的模板片段：\n\n```\n 1 import { Component, OnInit } from '@angular/core';\n\
  \ 2 import { Person } from '../person';\n 3 \n 4 @Component({\n 5   selector: 'app-person-details',\n\
  \ 6   template: `\n 7 \n8   <!-- 这里是显示人员详情的模板 -->\n9   <section *ngIf=\"person\"\
  >\n10     <h2>你选择了：{{person.name}}</h2>\n11     <h3>描述</h3>\n12     <p>\n13    \
  \    {{person.name}} 体重为 {{person.weight}}，身高为 {{person.height}}。\n14     </p>\n\
  15   </section>\n16   `,\n17   styles: []\n18 })\n19 export class PersonDetailsComponent\
  \ implements OnInit {\n20   person: Person;\n21 \n22   constructor() { }\n23   ngOnInit()\
  \ { }\n24 }\n```\n\n就是这样。现在我们有一个表示人员详情的组件，可以在应用程序中复用并组合。太棒了！但我们如何才能让 `person` 属性获得可显示的数据呢？换句话说，我们如何将人员绑定到该组件？\n\
  \n我们使用 Angular `Input` 装饰器：\n\n```\n1 // 在 person-details.component.ts 顶部\n2 import\
  \ { Component, Input } from '@angular/core';\n3 \n4 export class PersonDetailsComponent\
  \ {\n5   // 使用 @Input() 装饰 person 属性\n6   @Input() person : Person;\n7 }\n```\n\n\
  这将 `person` 属性标记为 `PersonDetailsComponent` 的输入，并允许其他组件向该组件发送人员。如何实现？通过使用类似这样的 Angular\
  \ `属性绑定`：\n\n```\n1 <app-person-details [person]=\"selectedPerson\"></app-person-details>\n\
  ```\n\n\n\n\n\n```\n1 <!-- 这是 ng-repeat 的新语法 -->\n2 <ul>\n3   <li *ngFor=\"let person\
  \ of people\">\n4     <a href=\"#\" (click)=\"selectPerson(person)\"> \n5      \
  \ {{person.name}}  \n6     </a>\n7   </li>\n8 </ul>\n9 <app-person-details [person]=\"\
  selectedPerson\"></app-person-details>\n```\n\n由于 `PeopleListComponent` 的变化，完整的\
  \ `PeopleListComponent` 看起来如下：\n\n```\n 1 import { Component, OnInit } from '@angular/core';\n\
  \ 2 import { Person } from '../person';\n 3 import { PeopleService } from \"../people.service\"\
  ;\n 4 \n 5 @Component({\n 6   selector: 'app-people-list',\n 7   template: `\n 8\
  \ \n9   <!-- 这是 ng-repeat 的新语法 -->\n10   <ul>\n11     <li *ngFor=\"let person of\
  \ people\">\n12       <a href=\"#\" (click)=\"selectPerson(person)\">\n13      \
  \ {{person.name}} \n14       </a>\n15     </li>\n16   </ul>\n17 \n18   <app-person-details\
  \ [person]=\"selectedPerson\"></app-person-details>\n19 \n20   `,\n21   styleUrls:\
  \ ['./people-list.component.scss']\n22 })\n23 export class PeopleListComponent implements\
  \ OnInit {\n24   selectedPerson: Person;\n25   people: Person[];\n26 \n27   constructor(private\
  \ peopleService: PeopleService) { }\n28 \n29   ngOnInit() {\n30     this.people\
  \ = this.peopleService.getAll();\n31   }\n32 \n33   selectPerson(person:Person){\n\
  34     this.selectedPerson = person;\n35   }\n36 \n37 }\n```\n\n你已经完成了！如果你现在检查浏览器（记得使用\
  \ `ng serve --open` 或 `ng s -o` 来启动 Web 服务器并在浏览器中加载你的应用），你应该能够测试：每当你点击一个《星球大战》人物时，他们的详情就会显示。干得好！\n\
  \n### 什么是 Angular 属性绑定（Property Bindings）？\n\nAngular `属性绑定` 类似于 `事件绑定` 的反向操作，它们在组件和模板之间提供了单向数据绑定。\n\
  \n它们允许你在组件之间通信时绑定到自定义属性（就像你在这个练习中看到的那样），但它们也允许你绑定到原生 DOM 属性，例如图像元素的 `src`。`属性绑定`\
  \ 是另一个例子，展示了 Angular 如何消除了 AngularJS 中的许多自定义指令：当你可以可以直接绑定到 `[src]` 时，就不再需要 `ng-src`\
  \ 指令了。\n\n### 想要学习更多关于 Angular 数据绑定（Data Bindings）的内容吗？\n\n在系列文章后期，我将写文章详细探讨 Angular\
  \ 数据绑定系统，但如果你现在好奇，这里有几篇文章可以告诉你更多关于 Angular 数据绑定的工作原理：\n\n- [Angular 基础：模板语法](https://angular.io/docs/ts/latest/guide/template-syntax.html)\
  \ 描述了 Angular 模板语法的基础，包括插值、事件绑定和属性绑定。\n- [Angular 备忘录（Angular Cheatsheet）](https://angular.io/docs/ts/latest/guide/cheatsheet.html)\
  \ 包含了你可以使用的各种有用绑定的良好汇。\n- [Angular 中的变化检测](http://victorsavkin.com/post/110170125256/change-detection-in-angular-2)\
  \ Angular 核心成员 [Victor Savkin](https://twitter.com/victorsavkin) 的一篇精彩文章。\n- [Angular\
  \ 变化检测详解](http://blog.thoughtram.io/angular/2016/02/22/angular-2-change-detection-explained.html)\
  \ [thoughtram 博客](http://blog.thoughtram.io/angular/2016/02/22/angular-2-change-detection-explained.html)\
  \ 另一篇精彩的博客。\n\n## 结语\n\n干得漂亮！你已经创建了两个 Angular 组件，通过插值、事件绑定、属性绑定、`*ngFor`、`*ngIf`\
  \ 学会了很多关于 Angular 模板语法的知识，创建了第一个服务并使用 Angular DI 注入了它。思考一下你将用 Angular 构建出的所有东西吧！！\
  \ :)\n\n下一个是！路由（Routing）！我猜……正在检查 GitHub……路由！！\n\n祝你有美好的一天！\n\n## Angular 路由\n\n\
  ```\n text text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text,\
  \  \ntext text text text text text text,  \ntext text text text text text text.\n\
  \n                                - XXXX Xxxxx,\n                              \
  \  Some title, Some time \n```\n\n```\n1 /* \n2  * story \n3  *\n4  */\n```\n\n\
  在上一章中，我们学习了更多 Angular 数据绑定，今天你将学习路由，即如何在应用程序的不同部分之间导航。\n\n### 代码示例\n\n你可以从[这个 GitHub\
  \ 仓库](https://github.com/Vintharas/angular2-step-by-step-04-routing) 下载本文的所有代码示例。\n\
  \n### 我们到目前为止的应用程序\n\n到目前，我们开发了一个微型 Angular 应用，用来学习更多关于《星球大战》宇宙的人物。我们有两个组件：显示列表的\
  \ `PeopleListComponent` 和显示详情的 `PersonDetailsComponent`（注：此处原文为 components，根据语境指代组件）。现在想象你正在处理\
  \ UI 设计，路由允许你根据 URL 跳转不同的视图。\n\n### 进入 Angular 路由\n\nAngular 提供了将应用分为多个视图的可能性，让用户可以在它们之间跳转。\n\
  \n在 Angular 中配置路由是通过一个路由配置文件的，其中包含：\n\n1. 一个包含路由集合的 `Routes` 数组\n2. 一个将路由配置提供给其他部分的导出\n\
  \n我们将首先在 `app` 文件夹创建一个新文件 `app.routes.ts`，并从 `@angular/router` 模块导入 `Routes` ：：\n\
  \n```\nimport { Routes } from '@angular/router';\n```\n\n现在我们可以使用它来定义应用的默认路由，即《星球大战》人物。。为了实现，我们导入\
  \ `PeopleListComponent`：\n\n```typescript\nimport { PeopleListComponent } from './people-list.component';\n\
  ```\n\n并创建以下 `Routes` 数组：\n\n```typescript\n  // 路由配置允许将映射映射到组件\n 2 const: Routes\
  \ = [\n\n3   //将 '/persons' 映射到列表组件\n44   \n\n5      : ' '',',\n\n 6     component:\
  \ PeopleListComponent,\n 7   },\n 8   //将 '/' 映射到 '/persons' 作为我们的默认路由\n 9   {\n\
  10     path: '',\n11     redirectTo: '/persons',\n12     pathMatch: 'full'\n13 \
  \  },\n 14 ];\n```\n\n如你上所示，每个路由都将 `path`（'persons'）映射到 `component`（`PeopleListComponent`）。我们通过创建一个额外的配置，将空路径映射到\
  \ `persons` 路径，来告诉 Angular 这是我们的默认路由。\n\n\n\n\n下一步是让我们的路由对应用程序的其他部分可用。为了实现这一点，我们从\
  \ `@angular/router` 模块中导入 `RouterModule`：\n\n```typescript\n1 import { Routes, RouterModule\
  \ }  from '@angular/router';\n```\n\n并按照如下方式导出我们自定义路由：\n\n```typescript\n1 export\
  \ const appRouterModule = RouterModule.forRoot(routes);\n```\n\n现在整个 `app.routes.ts`\
  \ 路由配置文件看起来应该是这样的：\n\n```typescript\n 1 import { Routes, RouterModule } from '@angular/router';\n\
  \ 2 import { PeopleListComponent } from \"./people-list/people-list.component\"\
  ;\n 3 \n 4 路由配置允许你将路由映射到组件\n 5 const routes: Routes = [\n 6   // 将 '/persons' 映射到人物列表组件\n\
  \ 7   {\n 8     path: 'persons',\n 9     component: PeopleListComponent,\n10   },\n\
  \ 11   // 将 '/' 映射到 '/persons' 作为我们的默认路由\n 12   {\n 13     path: '',\n 14     redirectTo:\
  \ '/persons',\n 15     pathMatch: 'full'\n 16   },\n 17 ];\n 18 \n 19 export const\
  \ appRouterModule = RouterModule.forRoot(routes);\n```\n\n现在我们可以更新应用程序，使用我们在配置文件中定义的路由。实现这一点是在我们的应用程序模块\
  \ `app.module.ts` 中包含 `routing`：\n\n```typescript\n 1 import { BrowserModule } from\
  \ '@angular/platform-browser';\n 2 import { NgModule } from '@angular/core';\n 3\
  \ import { FormsModule } from '@angular/forms';\n 4 import { HttpModule } from '@angular/http';\n\
  \ 5 \n 6 import { AppComponent } from './app.component';\n 7 import { PeopleListComponent\
  \ } from './people-list/people-list.component';\n 8 import { PeopleService } from\
  \ './people.service';\n 9 import { PersonDetailsComponent } from './person-details/person-details.component';\n\
  10 \n 11 import { appRouterModule } from \"./app.routes\";\n 12\n 13 @NgModule({\n\
  14   declarations: [\n15     AppComponent,\n16     PeopleListComponent,\n17    \
  \ PersonDetailsComponent\n18   ],\n19   imports: [\n20     BrowserModule,\n21  \
  \   FormsModule,\n22     HttpModule,\n23     appRouterModule\n24   ],\n25   providers:\
  \ [PeopleService],\n26   bootstrap: [AppComponent]\n27 })\n28 export class AppModule\
  \ { }\n```\n\n这不仅让我们的应用能够访问我们定义的路由，还可以访问 `@angular/router` 提供的不同路由服务，如我们将在本文后面部分使用的\
  \ `Router` 和 `ActivatedRoute`。\n\n尽管我们已经为应用提供了路由信息，但我们仍然在 `AppComponent` 模板中直接使用\
  \ `<people-list>` 组件。我们真正想要的是根据浏览器中选择的路径来选择显示哪个组件。我们如何告诉 `AppComponent` 这样做？我们使用\
  \ `router-outlet` 指令，这是一个 Angular 路由指令，用于显示激活路由（类似于 `ng-view`）。\n\n更新 `app.component.html`\
  \ 以如下所示使用 `router-outlet` 指令：\n\n```html\n 1 <h1>{{title}}</h1>\n 2 <router-outlet></router-outlet>\n\
  ```\n\n如果你现在启动应用程序（记住使用 `ng s -o`），你会看到应用按预期加载了 `PeopleListComponent`，且没有发生变化！嗯……如果你查看浏览器的\
  \ `url` 字段，你应该能看到它显示：\n\n```\n1 http://localhost:3000/persons\n```\n\n这意味着路由实际上在按照预期的方式工作！干得好！\n\
  \n### 附言：没有使用 CLI？\n\n在教程的之前的版本中，此时在开发服务器上运行代码示例会导致错误。应用程序将会崩溃！哦不！但仔细查看开发者控制台，你会看到这个错误：\n\
  \n```\n1 Subscriber.ts:243 Uncaught EXCEPTION: Error during instantiation of LocationStrategy\\\
  \n2 ! (Router -> Location -> LocationStrategy).\n3 ORIGINAL EXCEPTION: No base href\
  \ set. Please provide a value for the APP_BASE_HREF t\\\n4 oken or add a base element\
  \ to the document.\n```\n\n这是因为 Angular 路由期望你在 `index.html` 的 `head` 部分中有一个 `base`\
  \ 元素：\n\n```html\n 1 <html>\n 2   <head>\n 3     <title>...</title>\n 4     <base\
  \ href=\"/\">\n 5     <!-- 等... -->\n 6  </head>\n 7 <!-- 等... -->\n 8 </html>\n\
  ```\n\n此[元素启用了 HTML 5 history.pushState](https://angular.io/docs/ts/latest/guide/router.html#!#base-href)\
  \ API，允许 Angular 提供“HTML5 式”的 URL（而不是使用带有 `#` 前缀的）。\n\n由于我们现在使用 Angular cli 从头开始生成此项目，`base`\
  \ 元素将始终被包含，你再也不会遇到这个错误。这是 Angular cli 的另一个奖励。\n\n### 设置 PersonDetails 路由\n\n现在我们将设置人物详情路由，并更改应用程序应用程序工作流，以便你不会直接在同一个视图中显示详情，而是在完全不同的视图中显示。\n\
  \n我们首先导入 `PersonDetailsComponent`get `app.routes.ts` 中定义新路由：\n\n```typescript\n\
  \ 1 import { Routes, RouterModule } from '@angular/router';\n 2 import { PeopleListComponent\
  \ } from \"./people-list/people-list.component\";\n 3 \n 4 // 此处：新导入\n 5 import\
  \ { PersonDetailsComponent } from \"./person-details/person-details.component\"\
  ;\n 6 \n 7 路由配置允许你将路由映射到组件\n 8 const routes: Routes = [\n 9   // 将 '/persons' 映射到人物列表组件\n\
  10   {\n 11     path: 'persons',\n 12     component: PeopleListComponent,\n 13 \
  \  },\n 14\n 15   // 此处：PersonDetailsComponent 的新路由\n 16   // 将 '/persons/:id' 映射到人物详情组件\n\
  \ 17   {\n 18     path: 'persons/:id', \n 19     component: PersonDetailsComponent\
  \ \n 20   },\n 21\n 22   // 将 '/' 映射到 '/persons' 作为我们的默认路由\n 23   {\n 24     path:\
  \ '',\n 25     redirectTo: '/persons',\n 26     pathMatch: 'full'\n 27   },\n 28\
  \ ];\n 29\n 30 export const appRouterModule = RouterModule.forRoot(routes);\n```\n\
  \n现在我们定义了一个 `Person Details` 路由，它将 `/persons/:id` 路径映射到 `PersonDetailsComponent`。路由的\
  \ `:id` 部分是一个路由参数，我们将用它来唯一标识每个星大战中的人物。\n\n这意味着我们需要更新 `Person` 接口以包含它：\n\n```typescript\n\
  \ 1 export interface Person {\n 2   id: number;\n 3   name: string;\n 4   height:\
  \ number;\n 5   weight: number;\n 6 }\n```\n\n以及我们的 `PeopleService` 服务以提供它：\n\n\
  ```typescript\n 1 import { Injectable } from '@angular/core';\n 2 import { Person\
  \ } from './person';\n 3 \n 4 @Injectable()\n 5 export class PeopleService {\n 6\
  \   constructor() { }\n 7 \n 8   getAll() : Person[] {\n 9     return [\n10    \
  \   {id: 1, name: 'Luke Skywalker', height: 177, weight: 70},\n11       {id: 2,\
  \ name: 'Darth Vader', height: 200, weight: 100},\n12       {id: 3, name: 'Han Solo',\
  \ height: 185, weight: 85},\n13     ];\n 14   }\n 15 }\n```\n\n### 创建路由链接\n\n现在我们定义了路由，但我们希望用户在初始视图中点击人物时能够访问它。*但是我们如何构建指向人物路由的正确链接？*\n\
  \nAngular 路由提供了 `[routerLink]` 指令，帮助你以非常直接的方式生成这些链接。\n\n我们将更新 `PeopleListComponent`\
  \ 模板以使用 `[routerLink]` 指令，而不是像以前那样处理 `(click)` 事件。我们还将从模板中删除 `person-details` 元素：\n\
  \n```html\n 1   <ul>\n 2     <li *ngFor=\"let person of people\">\n 3       <a [routerLink]=\"\
  ['/persons', person.id]\">\n 4       {{person.name}}\n 5       </a>\n 6     </li>\n\
  \ 7   </ul>\n```\n\n在上面的代码中你可以看到如何将路由参数数组绑定到 `routerlink` 指令，一个用于路由路径 `/persons`，另一个带有我们在\
  \ `app.routes.ts` 中定义的实际 `id` 参数。有了这两个信息，Angular 就可以创建指向人物的相应链接（例如 `/person/2`）。\n\
  \n我们还可以移除一些不必要的代码，如 `(click)` 事件处理器和 `selectedPerson` 属性。更新后的 `PeopleListComponent`\
  \ 应该是这样的：\n\n\n\n\n\n```\nimport { Component, OnInit } from '@angular/core';\nimport\
  \ { Person } from '../person';\nimport { PeopleService } from \"../people.service\"\
  ;\n\n@Component({\n  selector: 'app-people-list',\n  template: `\n  <!-- this is\
  \ the new syntax for ng-repeat -->\n  <ul>\n    <li *ngFor=\"let person of people\"\
  >\n      <a [routerLink]=\"['/persons', person.id]\">\n        {{person.name}} \n\
  \      </a>\n    </li>\n  </ul>\n  `,\n  styleUrls: ['./people-list.component.scss']\n\
  })\nexport class PeopleListComponent implements OnInit {\n  people: Person[];\n\n\
  \  constructor(private peopleService: PeopleService) { }\n\n  ngOnInit() {\n   \
  \ this.people = this.peopleService.getAll();\n  }\n}\n```\n\n好了，现在让我们回到浏览器。如果你将鼠标悬停在某人的名字上，你将发现它指向了正确的链接。\n\
  \n但如果你点击它，它将不起作用。这是因为 `PersonDetailsComponent` 组件不知道如何从路由中检索 `id`，根据该 `id` 获取人员并在视图中显示它。\n\
  \n让我们接下来来实现这一点！\n\n### 从路由中提取参数\n\n在之前的版本中，`person-details` 组件暴露了一个 `person` 属性，我们可以将人员绑定到它。在这个路由的新世界里，情况已不再如此。\n\
  \n我们不再直接将人员绑定到它，而是通过路由来访问组件。当用户点击某人时，我们将导航到人员详情路由，组件可用的唯一信息将是人的 `id`。\n\n我们将更新 `PersonDetailsComponent`\
  \ 以从路由中提取该信息，使用 `PeopleService` 获取相应的用户，然后将其显示给用户。\n\nAngular 路由提供了 `ActivatedRoute`\
  \ 服务用于此目的，即访问路由参数。我们可以从 `@angular/router` 模块导入它，并通过构造函数将其注入到 `PersonDetailsComponent`\
  \ 中：\n\n```\nimport { ActivatedRoute } from '@angular/router';\n```\n\n```\nexport\
  \ class PersonDetailsComponent{\n    constructor(private peopleService: PeopleService,\n\
  \               private route: ActivatedRoute){\n    }\n    // more codes...\n}\n\
  ```\n\n现在我们可以使用它来从 URL 中检索 `id` 参数，并从 `PeopleService` 获取要显示的人员。我们将在 `ngOnInit` 中执行此操作：\n\
  \n```\nexport class PersonDetailsComponent implements OnInit {\n    person: Person;\n\
  \n    // more codes...\n\n    ngOnInit(){\n        this.route.params.subscribe(params\
  \ => {\n          let id = Number.parseInt(params['id']);\n          this.person\
  \ = this.peopleService.get(id);\n        });\n    }\n}\n```\n\n注意 `route.params`\
  \ 返回一个 `observable`，这是处理异步操作的模式，我们将在[本系列的 http 章节中深入探讨它](http://www.barbarianmeetscoding.com/blog/2016/04/02/getting-started-with-angular-2-step-by-step-6-consuming-real-data-with-http/)。在此期间，请记住\
  \ `subscribe` 方法允许异步操作（在本例中为加载路由和检索路由参数）完成时执行一些代码。\n\n为了避免内存泄漏，我们可以在 Angular 销毁人员详情组件时对\
  \ `route.params` 观察对象进行取消订阅。我们可以利用 `OnDestroy` 生命周期钩子来实现这一点：\n\n```\nimport { Component,\
  \ OnInit, OnDestroy } from '@angular/core';\n```\n\n```\nexport class PersonDetailsComponent\
  \ implements OnInit, OnDestroy {\n    // more codes...\n    sub: any;\n\n    ngOnInit(){\n\
  \        this.sub = this.route.params.subscribe(params => {\n          let id =\
  \ Number.parseInt(params['id']);\n          this.person = this.peopleService.get(id);\n\
  \        });\n    }\n\n    ngOnDestroy(){\n        this.sub.unsubscribe();\n   \
  \ }\n}\n```\n\n`PersonDetailsComponent` 的完整源代码如下：\n\n```\nimport { Component, OnInit,\
  \ OnDestroy } from '@angular/core';\nimport { ActivatedRoute } from \"@angular/router\"\
  ;\n\nimport { PeopleService } from \"../people.service\";\nimport { Person } from\
  \ \"../person\";\n\n@Component({\n  selector: 'app-person-details',\n  template:\
  \ `\n  <section *ngIf=\"person\">\n    <h2>你选择了：  {{person.name}}</h2>\n    <h3>描述</h3>\n\
  \    <p>\n       {{person.name}} 体重 {{person.weight}}，身高 {{person.height}}。\n  \
  \  </p>\n  </section>\n  `,\n  styles: []\n})\nexport class PersonDetailsComponent\
  \ implements OnInit, OnDestroy {\n  person: Person;\n  sub:any;\n\n  constructor(private\
  \ route:ActivatedRoute,\n              private peopleService:PeopleService) { }\n\
  \n  ngOnInit() { \n    this.sub = this.route.params.subscribe(params => {\n    \
  \  let id = Number.parseInt(params['id']);\n      this.person = this.peopleService.get(id);\n\
  \    });\n  }\n\n  ngOnDestroy(): void {\n    this.sub.unsubscribe();\n  }\n}\n\
  ```\n\n我们还需要更新 `PeopleService` 以提供一个通过 id 获取人员的新方法，下面的 `get(id: number)` 方法将正好做到这一点：\n\
  \n```\nimport { Injectable } from '@angular/core';\nimport { Person } from './person';\n\
  \n// 1\\. 将数组提取到 PEOPLE 变量中\nconst PEOPLE : Person[] = [\n      {id: 1, name: 'Luke\
  \ Skywalker', height: 177, weight: 70},\n      {id: 2, name: 'Darth Vader', height:\
  \ 200, weight: 100},\n      {id: 3, name: 'Han Solo', height: 185, weight: 85},\n\
  \    ];\n\n@Injectable()\nexport class PeopleService{\n  getAll() : Person[] {\n\
  \    // 2\\. 重构以使用 PEOPLE 变量\n    return PEOPLE;\n  }\n\n  // 3\\. 新方法也使用 PEOPLE\
  \ 变量\n  get(id: number) : Person {\n    return PEOPLE.find(p => p.id === id);\n\
  \  }\n}\n```\n\n完成了！现在如果你去看看你的应用，点击 `Luke Skywalker`，砰！你看到了关于这位强大的绝地骑士的详细信息。\n\n\
  但如何返回主视图呢？嗯，如果你点击浏览器的后退按钮，你会成功。Angular 路由与浏览默认行为配合良好，这符合用户的预期。\n\n但如果你想在详情底部提供一个漂亮的按钮供用户点击呢？这样我可以教你如何进行编程导航）\n\
  \n### 返回人员列表\n\n现在我们想要创建一个按钮，允许用户在点击它时返回主视图。Angular 路由自带一个 `Router` 服务可以帮助你。\n\n\
  我们首先将按钮添加到模板中，并将其绑定到 `goToPeopleList` 方法，我们很快会将该方法添加到组件中：\n\n```\n  <section *ngIf=\"\
  person\">\n    <h2>你选择了：{{person.name}}</h2>\n    <h3>描述</h3>\n    <p>\n      {{person.name}}\
  \ 体重 {{person.weight}}，身高 {{person.height}}。\n    </p>\n  </section>\n  <!-- 在此处添加按钮！\
  \ -->\n  <button (click)=\"gotoPeopleList()\">返回人员列表</button>\n```\n\n我们可以通过构造函数在\
  \ `PersonDetailsComponent` 中注入 `Router` 服务。我们首先从 `@angular/router` 导入它：\n\n```\n\
  import { ActivatedRoute, Router} from '@angular/router';\n```\n\n然后注入它：\n\n```\n\
  export class PersonDetailsComponent implements OnInit, OnDestroy {\n    // other\
  \ codes...\n    constructor(private peopleService: PeopleService,\n            \
  \    private route: ActivatedRoute,\n                private router: Router){\n\
  \    }\n}\n```\n\n剩下的工作就是实现 `goToPeopleList`，以利用路由并触发到应用主视图的导航：\n\n```\nexport class\
  \ PersonDetailsComponent implements OnInit, OnDestroy {\n    // other codes...\n\
  \n    gotoPeoplesList(){\n        let link = ['/persons'];\n        this.router.navigate(link);\n\
  \    }\n}\n```\n\n\n\n\n在这里我们调用 `router.navigate` 方法并向其传递 Angular 路由所需的参数，以确定我们想要去的地方。在这种情况下，由于路由不需要任何参数，我们只需要创建一个包含路由路径\
  \ `/persons` 的数组即可。\n\n如果你现在去浏览器测试应用，你会发现一切工作均如预期。你已经学会了 Angular 路由，我的朋友。干得好！！\n\
  \n这里是我们的 `PersonDetailsComponent` 的完整源代码：\n\n```\n 1 import { Component, OnInit,\
  \ OnDestroy } from '@angular/core';\n 2 import { ActivatedRoute, Router } from \"\
  @angular/router\";\n 3 \n 4 import { PeopleService } from \"../people.service\"\
  ;\n 5 import { Person } from \"../person\";\n 6 \n 7 @Component({\n 8   selector:\
  \ 'app-person-details',\n 9   template: `\n10   <section *ngIf=\"person\">\n11 \
  \    <h2>你选择了：{{person.name}}</h2>\n12     <h3>描述</h3>\n13     <p>\n14        {{person.name}}\
  \ 体重为 {{person.weight}}，身高为 {{person.height}}。\n15     </p>\n16   </section>\n17\
  \ \n18   <button (click)=\"gotoPeoplesList()\">返回人员列表</button>\n19   `,\n20   styles:\
  \ []\n21 })\n22 export class PersonDetailsComponent implements OnInit, OnDestroy\
  \ {\n23   person: Person;\n24   sub:any;\n25 \n26   constructor(private route: ActivatedRoute,\n\
  27               private peopleService: PeopleService,\n28               private\
  \ router: Router) { }\n29 \n30   ngOnInit() { \n31     this.sub = this.route.params.subscribe(params\
  \ => {\n32       let id = Number.parseInt(params['id']);\n33       this.person =\
  \ this.peopleService.get(id);\n34     });\n35   }\n36 \n37   ngOnDestroy() {\n38\
  \     this.sub.unsubscribe();\n39   }\n40 \n41   gotoPeoplesList(){\n42     let\
  \ link = ['/persons'];\n43     this.router.navigate(link);\n44   }\n45 }\n```\n\n\
  现在你可能在想……等一下……如果我们只是使用 `router` 导航到人员列表，那么意味着当我点击浏览器的后退按钮时，我将回到人员详情页。你是对的。另一种让浏览器历史更合理的方法是像下面所示使用\
  \ `window.history` API：\n\n```\n1 gotoPeoplesList(){\n2     window.history.back();\n\
  3 }\n```\n\n但那样我就没法演示 `Router` 服务了，对吧？*呵呵*\n\n### 使用 Angular CLI 生成你的路由\n\n正如我在文章开头暗示的那样，Angular\
  \ cli 可以帮助你为应用程序生成路由。首先，当你从零开始创建一个新应用时，可以运行带有 `--routing` 标志的 `ng new` 命令，如下：\n\n\
  ```\n1 PS> ng new my-new-app --routing --style scss\n```\n\n`--routing` 标志将为你新应用设置一个基础的路由配置，位于名为\
  \ `app-routing.module.ts` 的独立路由模块中。该路由配置将封装在一个新的 Angular 模块 `AppRoutingModule` 中：\n\
  \n```\n 1 import { NgModule } from '@angular/core';\n 2 import { Routes, RouterModule\
  \ } from '@angular/router';\n 3 \n 4 // 在此处定义你的路由\n 5 const routes: Routes = [\n\
  \ 6   {\n 7     path: '',\n 8     // 不要担心这个\n 9     // 我们会在本系列文章后续后续深入研究路由时\n10\
  \     // 对其进行解释\n11     children: []\n12   }\n13 ];\n 14 \n15 @NgModule({\n16  \
  \ imports: [RouterModule.forRoot(routes)],\n17   exports: [RouterModule]\n18 })\n\
  19 export class AppRoutingModule { }\n```\n\n它被你应用的主 Angular 模块 `AppModule` 导入：\n\
  \n```\n 1 // 其他导入\n 2 \n 3 import { AppRoutingModule } from './app-routing.module';\n\
  \ 4 \n5 @NgModule({\n 6   declarations: [\n 7     AppComponent\n 8   ],\n 9   imports:\
  \ [\n10     BrowserModule,\n11     FormsModule,\n12     HttpModule,\n13     AppRoutingModule\
  \ // 在此处我们导入了应用路由\n14   ],\n15   providers: [],\n16   bootstrap: [AppComponent]\n\
  17 })\n18 export class AppModule { }\n```\n\n如你上面所见，angular cli 遵循为应用程序代码和路由创建独立模块的约定：`AppModule`（`app.module.ts`）将有一个对应的\
  \ `AppRoutingModule`（`app-routing.module.ts`）。\n\n事实上，如果你创建了更多模块来封装应用程序中的不同功能（这在\
  \ Angular 中是被鼓励的），你可以使用 Angular cli 配合 `--routing` 标志创建额外的路由模块。想象你想为我们的“星球大战”应用添加一个新功能，以便在星球大战宇宙中创作史诗级故事，你可以这样创建一个新模块：\n\
  \n```\n1 PS> ng generate --routing story-writing\n2 # 简而言之 ng g m -r story-writing\n\
  ```\n\n这将导致你的应用中产生两个新模块：`story-writing.module.ts`，它包含构建该故事写作功能的组件、服务和指令；以及一个 `story-writing-routing.module.ts`，它可以封装应用程序这部分的路由配置。\n\
  \n### 将路由提取到独立模块中\n\n让我们遵循 Angular cli 约定，将新创建的路由提取名为 `AppRoutingModule` 的独立模块中。这将非常有帮助，因为让我们分离了关注点（将应用程序逻辑与路由分离），在以后测试应用时会非常有用，并且符合大多数开发者已经熟悉的\
  \ Angular cli 约定。\n\n将 `app.routing.ts` 重命名为 `app-routing.module.ts` 并更新其内容如下：\n\
  \n```\n 1 import { NgModule } from '@angular/core';\n 2 import { Routes, RouterModule\
  \ } from '@angular/router';\n 3 \n 4 import { PeopleListComponent } from \"./people-list/people-list.component\"\
  ;\n 5 import { PersonDetailsComponent } from \"./person-details/person-details.component\"\
  ;\n 6 \n 7 路由配置允许你将路由映射到组件\n 8 const routes: Routes = [\n 9   // 将 '/persons' 映射到人员列表组件\n\
  10   {\n11     path: 'persons',\n12     component: PeopleListComponent,\n13   },\n\
  14   // 将 '/persons/:id' 映射到人员详情组件\n15   {\n16     path: 'persons/:id', \n17   \
  \  component: PersonDetailsComponent \n18   },\n19   // 将 '/' 映射到 '/persons' 作为我们的默认路由\n\
  20   {\n21     path: '',\n22     redirectTo: '/persons',\n23     pathMatch: 'full'\n\
  24   },\n25 ];\n 26 \n27 // 在此处：新模块\n28 @NgModule({\n29   imports: [RouterModule.forRoot(routes)],\n\
  30   exports: [RouterModule]\n31 })\n32 export class AppRoutingModule { }\n```\n\
  \n现在我们更新 `app.module.ts` 来导入 `AppRoutingModule`：\n\n```\n 1 // ...大量的导入...\n 2 \n\
  \ 3 import { AppRoutingModule } from \"./app-routing.module\";\n 4 \n 5 @NgModule({\n\
  \ 6   declarations: [\n 7     AppComponent,\n 8     PeopleListComponent,\n 9   \
  \  PersonDetailsComponent\n10   ],\n11   imports: [\n12     BrowserModule,\n13 \
  \    FormsModule,\n14     HttpModule,\n15     AppRoutingModule,   // 在此处：新路由模块\n\
  16   ],\n17   providers: [PeopleService],\n18   bootstrap: [AppComponent]\n19 })\n\
  20 export class AppModule { }\n```\n\n完成！如果你运行 `ng s -o` 启动开发服务器，应用将如预期运行。\n\n###\
  \ 想学习更多 Angular 路由吗？\n\n在本文中学习了许多关于 Angular 路由的知识，但你可能还需要。如果是，请查看以下文章：\n\n* [Angular\
  \ Routing](https://angular.io/docs/ts/latest/guide/router.html) 来自 Angular 官方文档，带有非常棒的代码示例。\n\
  \n* [Angular Router](http://victorsavkin.com/post/145672529346/angular-router) Victor\
  \ Savkin 作品，已更新至最新的 Angular router。\n\n* [Angular Router：空路径、无组件路由和重定向](http://victorsavkin.com/post/146722301646/angular-router-empty-paths-componentless-routes)\
  \ 同样来自 Viktor Savkin，包含了关于 Angular router 边缘情况的额外信息。\n\n* [由设计师 Viktor Savkin 编写的\
  \ Angular 路由新书](https://leanpub.com/router/)\n\n## 结语\n\n哇，我们几乎完成了 Angular 基础学习了！干得好！到为止你学习了组件、服务、依赖注入、Angular\
  \ 不同的数据绑定和模板语法以及路由。\n\n**下一站！表单与验证！！**\n\n\n\n\n```\n text text text text text text\
