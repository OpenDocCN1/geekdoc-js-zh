  ```\n\n在使用像上面的 `function expressions` 时，有几个重要的点你需要考虑：它们都是`anonymous functions`——它们没有名字——而且如果存储在变量中，它们将遵循适用于\
  \ JavaScript 中任何其他变量的 `hoisting`（提升）规则。但**什么是提升（hoisting）？**以及**匿名函数是如何影响我们的程序的呢？**。\n\
  \n## JavaScript 秘辛：函数作用域与提升\n\nJavaScript 的一个有趣之处是，与许多其他语言不同，`JavaScript 中的变量具有函数作用域`（而不是块作用域）。也就是说，是函数本身为变量创建了作用域，而不是块。可以通过一个例子得到更好的说明：\n\
  \n```javascript\n 1 function openPandoraBox(){\n 2 \n 3     if (true){\n 4     \
  \    var treasure = 'mouse';\n 5     }\n 6     console.log('the pandora box holds\
  \ a: **' + treasure + '**');\n 7 }\n 8 openPandoraBox();\n 9 // => the pandora box\
  \ holds a: **mouse**\n10 // ！？ x 是在 if 块内部声明的。它是如何被 console.log 访问到的？\n12 // 只有一个词：函数作用域\
  \ \n```\n\n在上面的代码中发生的情况是 JavaScript 运行时[提升](http://bit.ly/hoisting-mdn)（向上移动）了函数定义内部所有的变量到函数体的开头。即使是在\
  \ `if` 语句等代码块中声明的变量也是如此。这意味着你上面看到的函数等同于这个：\n\n```javascript\n1 function openPandoraBox(){\n\
  2     // 变量定义被提升到了这里\n3     var treasure = undefined;\n4     if (true){\n5     \
  \    treasure = 'mouse';\n6     }\n7     console.log('the pandora box holds a: **'\
  \ + treasure + '**');\n8     // => the pandora box holds a: **mouse**\n9 }\n```\n\
  \n其中 `treasure` 变量的作用域不仅是 `if` 语句，而是整个函数。在另一个 `hoisting` 的例子中，我们在 `for` 循环内部声明的变量\
  \ `i` 实际上是整个函数的一部分（令人惊讶！！*）：\n\n```javascript\n 1 function aMagicFunctionToIllustrateHoisting(){\n\
  \ 2     // 实际上\n 3     // var i = undefined\n 4 \n 5     console.log('before i ='\
  \ + i);\n 6     // => before i = undefined\n 7 \n 8     for(var i = 0; i < 10; i++){\n\
  \ 9         // jara jara\n10     }\n11 \n12     console.log('after i = ' + i);\n\
  13     // => after i = 10\n14 }\n```\n\n这就是为什么 JavaScript 开发者——老练的 JavaScript 大师们——通常在函数的开头编写所有的变量声明。他们这样做是为了更显式地说明函数求值时到底发生了什么，并避免不必要的错误。\n\
  \n如果你看一眼 [jQuery](http://bit.ly/jquery-loadjs（这是一个流行的 JavaScript 开源库），你将随处发现这种技术：\n\
  \n```javascript\n 1 /**\n 2  * 将 url 加载到页面中\n 3  */\n4 jQuery.fn.load = function(\
  \ url, params, callback ) {\n 5     var selector, type, response,\n 6         self\
  \ = this,\n 7         off = url.indexOf(\" \");\n 8 \n 9     //...更多代码\n10 }\n```\n\
  \n函数作为应用作用域的管理员是非常有趣的，因为突然之间，函数不仅用于封装和抽象一段逻辑，还出于结构性的原因。也就是说，一种组织和分发各个功能和代码的方法。例如，你经常看到在另一个函数内部声明函数：\n\
  \n```javascript\n 1 // 在函数内部声明函数？\n 2 // 那不奇怪吗？？？？\n 3 function blessMany(many){\n\
  \ 4   many.forEach(bless);\n 5   \n 6   function bless(target){\n 7     console.log('You\
  \ bless ' + target + '. (+5 WillPower) ');\n 8   }\n 9 }\n10 \n11 blessMany(['john\
  \ snow', 'sansa stark']);\n12 // => You bless John Snow (+5 Willpower) \n13 // =>\
  \ You bless Sansa Stark (+5 Willpower)\n```\n\n如果你是从 C# 转过来的，这看起来可能非常奇怪。但直到最近 ES6\
  \ 模块出现之前，这是我们对一组松散关联的功能进行分组唯一方法。\n\n## JavaScript 秘辛解密：使用 ES6 let 和 const 具有块作用域的变量\n\
  \n对你来说、对我来说都很幸运的是，ES6 提供了不是一种而是两种声明具有块作用域变量的方法：`let` 和 `const`。\n\n现在你已经学习了函数表达式的一些主要特征，让我们来看看在\
  \ JavaScript 中可用的两种 `function expressions` 类型：`anonymous function expressions`（匿名函数表达式）和\
  \ `named function expressions`（命名函数表达式）。\n\n\n\n\n\n# 匿名函数表达式\n\n`Anonymous function\
  \ expressions`（匿名函数表达式）特别有趣，因为尽管你读了以下代码：\n\n```javascript\n1 var castFireballSpell\
  \ = function(){\n2     console.log('...chaos and mayhem');\n3 };\n```\n\n你可能会认为函数的名称是\
  \ `castFireballSpell`，**但并不是如此！？！** `castFireballSpell` 只是我们用来存储`anonymous function`\
  \ 的变量。你可以通过检查函数本身的 `name` 属性来领略这种匿名性：\n\n```javascript\n1 var castFireballSpell\
  \ = function(){\n2     console.log('...chaos and mayhem');\n3 };\n4 console.log(castFireballSpell.name);\n\
  5 // => \"\"\n6 // 没有名字！\n```\n\n幸运的是，只要匿名函数绑定到一个变量上，现代浏览器的开发者工具在调用堆栈（call stacks）中显示错误时就会使用该变量（**这在调试时是救星**）：\n\
  \n```\n 1 // 检查绑定到变量的匿名函数的调用堆栈\n 2 var castFireballSpellWithError = function(){\n\
  \ 3     console.log('...chaos and mayhem');\n 4     try {\n 5         throw new\
  \ Error();\n 6     } catch (e) {\n 7         console.log('stack: ', e.stack);\n\
  \ 8     }\n 9 };\n10 castFireballSpellWithError();\n11 //=> stack:  Error\n12 //\
  \     at castFireballSpellWithError (http://fiddle.jshell.net/_display/:53:15)\n\
  13 //     at window.onload (http://fiddle.jshell.net/_display/:58:1)\n```\n\n即使我们将此函数作为参数使用：\n\
  \n```javascript\n1 // 如果你将此函数作为 lambda 使用，调用堆栈中仍会显示名称：\n2 var spellLauncher = function(f){\
  \ f(); }\n3 spellLauncher(castFireballSpellWithError);\n4 // => stack:  Error\n\
  5 //    at castFireballSpellWithError (http://fiddle.jshell.net/_display/:56:15)\n\
  6 //    at spellLauncher (http://fiddle.jshell.net/_display/:68:35)\n7 //    at\
  \ window.onload (http://fiddle.jshell.net/_display/:69:1)\n```\n\n然而，**未绑定的匿名函数在调用堆栈中显示为完全匿名，这使其在发生错误时更难调试**（我以后将这些函数称为\
  \ `strict anonymous function` 严格匿名函数）：\n\n```javascript\n 1 // 严格匿名函数不会出现在调用堆栈中\n\
  \ 2 spellLauncher(function(){\n 3     console.log('...chaos and mayhem');\n 4  \
  \   try {\n 5         throw new Error();\n 6     } catch (e) {\n 7         console.log('stack:\
  \ ', e.stack);\n 8     }\n 9 });\n10 //=> stack:  Error\n11 //    at http://fiddle.jshell.net/_display/:76:15\n\
  12 //    at spellLauncher (http://fiddle.jshell.net/_display/:68:35)\n13 //    at\
  \ window.onload (http://fiddle.jshell.net/_display/:73:1)\n```\n\n这种名称的缺失也会影响使用**递归**的能力，因为没有名称的函数无法从其内部调用自己。尽管如此，就像之前的示例一样，如果我们将`anonymous\
  \ function` 绑定到一个变量上，我们就可以通关并利用 `JavaScript lexical scope` 通过该变量访问函数：\n\n```javascript\n\
  \ 1 // 当匿名函数绑定到变量时，你可以使用递归\n 2 var castManyFireballsSpell = function(n){\n 3   \
  \  // 此函数闭包了 castManyFireballsSpell 变量\n 4     // 因此变成了一个闭包\n 5     console.log('...\
  \ SHOOOOOOOOOSH ....');\n 6     if (n > 0)\n 7         castManyFireballsSpell(n-1);\n\
  \ 8 };\n 9 castManyFireballsSpell(3);\n10 // => ... SHOOOOOOOOOSH ....\n11 //  \
  \  ... SHOOOOOOOOOSH ....\n12 //    ... SHOOOOOOOOOSH ....\n13 //    ... SHOOOOOOOOOSH\
  \ ....\n```\n\n注意，这种使用递归的方法非常脆弱。在这个例子中，我们使用变量 `castManyFireballsSpell` 在函数内部访问匿名函数。如果在未来的某个时刻，你恰好将该变量设置为另一个函数，你就会陷入麻烦。这是一个非常棘手的局面，带有一个非常微妙的\
  \ Bug，原始函数将调用这个新函数而不是自己（*所以不再有递归，并且会发生奇怪的意外情况*）。\n\n另一方面，`strict anonymous function`\
  \ 没有方法引用自己，因此你失去了使用递归的能力。例如，当我们定义一个 `anonymous function expression` 并立即调用它时，情况就是如此：\n\
  \n```javascript\n1 // 但匿名函数无法通过任何其他方式调用自己\n2 (function(n){\n3     console.log('...\
  \ SHOOOOOOOOOSH ....');\n4     if (n > 0) {\n5         // 我无法调用自己... :(\n6     }\n\
  7 }(5));\n8 // => ... SHOOOOOOOOOSH ....\n```\n\n总结来说，**普通函数表达式是匿名的事实使得它们更难调试，并复杂了递归的使用**。而且它们被提升为变量的特性（这是所有函数表达式的共同特征）**使得它们的可读性更差**。\n\
  \n## 命名函数表达式\n\n你可以通过在 `function` 关键字后添加名称，使用**命名函数表达式**来解决匿名问题：\n\n```javascript\n\
  1 // 命名函数表达式\n2 var FireballSpell = function castballSpell(){\n3   // 混沌与混乱\n4 };\n\
  5 console.log(\"此函数的名称是: \", FireballSpell.name);\n6 // => castSpell\n```\n\n*named\
  \ function expression* 即使作为参数使用，也会正确出现在调用堆栈中（未绑定到变量）：\n\n```\n 1 // 命名函数表达式始终出现在调用堆栈中\n\
  \ 2 spellLauncher(function spreadChaosAndhem(){\n 3     console.log('...chaos and\
  \ mayhem');\n 4     try {\n 5         throw new Error();\n 6     } catch (e) {\n\
  \ 7         console.log('stack: ', e.stack);\n 8     }\n 9 });\n10 // stack:  Error\n\
  11 //     at spreadChaosAndhem (http://fiddle.jshell.net/_display/:134:15)\n12 //\
  \     at spellLauncher (http://fiddle.jshell.net/_display/:68:35)\n13 //     at\
  \ window.onload (http://fiddle.jshell.net/_display/:131:1)\n```\n\n有助于调试并使你的代码更易读，因为**你可以在查看实现代码之前读取函数名称并理解它的作用**。\n\
  \n*named function expressions* 的一个有趣事实是，你无法从外部通过名称调用它们：\n\n```javascript\n1 var\
  \ castballSpell = function cucumber(){\n2     // ?\n3 };\n4 cucumber();\n5 // =>\
  \ ReferenceError: cucumber is not defined\n```\n\n`function expression` 的名称是一个内部标识符，可以在函数体内部使用。这在处理递归时非常有用。例如，如果我们声明一个递归\
  \ *named function expression* 并立即调用它，它就能正常工作：\n\n```\n 1 // 但你可以从函数体内部调用它，这有助于递归\n\
  \ 2 (function fireballSpellWithRecursion(n){\n 3     console.log('... SHOOOOOOOOOSH\
  \ ....');\n 4     if (n > 0) {\n 5         fireballSpellWithRecursion(n-1);\n 6\
  \     }\n 7 }(5));\n 8 // => ... SHOOOOOOOOOSH ....\n 9 //    ... SHOOOOOOOOOSH\
  \ ....\n10 //    ... SHOOOOOOOOOSH ....\n11 //    ... SHOOOOOOOOOSH .....等..\n```\n\
  \n总结来说，**命名函数表达式通过增加可读性、改进调试过程以及允许函数调用自己改进了匿名函数表达式**。\n\n#### 函数表达式被提升为变量\n\n*Function\
  \ expressions* 仍然存在问题，因为它们像变量一样被提升了。但这到底意味着什么？这意味着**你只能在声明函数表达式之后才能使用它**，因此它迫使你从实现细节开始编写代码，向更高层次的抽象延伸。\n\
  \n\n\n\n这与你想要的完全相反。想一下，当你作为一个 C# 开发者编写一个类时，你会从类定义顶部的 `public API` 开始写。然后，你从上到下、从高抽象层到低抽象层编写每个方法的实现，使得阅读过程变得自然。你打开文件顶端，通过阅读组成其公共\
  \ API 的意图化名称一眼就能看出它的作用，然后只有在你需要或想要查看时，才会向下遍历文件查看实现细节。\n\n被迫从相反的方向开始会对你代码的可读性产生负面影响：\n\
  \n```\n 1 (function (magic){\n 2     //这个函数代表一个模块 'magic'\n 3     // 它只是将志同道合的代码组合的方式\n\
  \ 4 \n 5     var oven = {\n 6         open: function(){},\n 7         placeBaking:\
  \ function(){},\n 8         increaseTemperature: function(){},\n 9         claimVictory:\
  \ function(){ return 'awesome cake';}\n10     };\n11 \n12     var mix = function\
  \ mix(ingredients){\n13         console.log('mixin ingredients:', ingredients.join(''));\n\
  14         return 'un-appetizing mixture';\n15     }\n16 \n17     var work = function\
  \ work(mixture){\n18         console.log('working ' + mixture);\n19         return\
  \ 'yet more un-appetizing dough';\n20     };\n21 \n22     var bake = function bake(dough){\n\
  23         oven.open();\n24         oven.placeBaking(dough);\n25         oven.increaseTemperature(200);\n\
  26         // insta-oven!\n27         return oven.claimVictory();\n28     };\n29\
  \ \n30     var enchant = function enchant(ingredients){\n31         var mixture\
  \ = mix(ingredients),\n32             dough = work(mixture),\n33             cake\
  \ = bake(dough);\n34         return cake;\n35     };\n36 \n37     // 这是该模块的公共 API\n\
  38     // 但它几乎隐藏在底部\n39     magic.enchant = enchant;\n40 \n41 }(window.magic ||\
  \ (window.magic = {})));\n42 \n43 var cake = magic.enchant(['flour', 'mandragora',\
  \ 'dragon', 'chicken foot']);\n44 // => mixin ingredients:  flour mandragora dragon\
  \ chicken foot\n45 // => working un-appetizing mixture\n46 console.log(cake);\n\
  47 // => awesome cake\n```\n\n如果你尝试重新调整模块内不同函数的顺序，让它们从公共 API 开始并从上到下、从高抽象层到低抽象层继续排列，你将会遇到许多问题：\n\
  \n```\n 1 (function (magic){\n 2     //这个函数代表一个模块 'magic'\n 3     // 它只是将志同道合的代码组合的方式\n\
  \ 4 \n 5     // 将 enchant 暴露为 'magic' 模块的 API\n 6     magic.enchant = enchant;\n\
  \ 7     // => 变量提升问题，此时 enchant 是未定义的\n 8     // 所以我们只是在暴露一个未定义的变量，却以为它是一个函数\n 9\
  \ \n10     // 如果取消注释这将导致异常\n11     // enchant();\n12     // => TypeError: enchant\
  \ is not a function\n13     // => 变量提升问题，此时 enchant 是未定义的\n14 \n15     var enchant\
  \ = function enchant(ingredients){\n16         var mixture = mix(ingredients),\n\
  17             dough = work(mixture),\n18             cake = bake(dough);\n19  \
  \       return cake;\n20     };\n21 \n22     // 如果取消注释这将导致异常\n23     // enchant();\n\
  24     // => TypeError: mix is not a function (此时 mix 是未定义的)\n25     // 变量提升问题，此时\
  \ mix 是未定义的\n26 \n27     /* 剩余代码...\n28     var mix = function mix(ingredients){}\n\
  29     var work = function work(mixture){};\n30     var bake = function bake(dough){};\n\
  31     var oven = {};\n32     */\n33 \n34 }(window.magic || (window.magic = {})));\n\
  35 \n36 try {\n37     var cake = magic.enchant(['flour', 'mandragora', 'dragon',\
  \ 'chicken foot']);\n38     console.log(cake);\n39 } catch (e) {\n40     console.warn('ups!!!!!!',\
  \ e);\n41     // => ups!!!!!! TypeError: magic.enchant is not a function\n42 }\n\
  ```\n\n在这个示例中，我们使用 `function expressions`（函数表达式）来定义每个函数。因为当我们尝试将 `enchant` 函数赋值给\
  \ `magic.enchant` 对象时，它们`像变量一样被提升`，因此其值是 `undefined`。这导致我们向外部暴露了一个 `undefined` 值，而不是一个可以制作美味蛋糕的有用函数。同样，当我们尝试在\
  \ `enchant` 或 `mix` 初始化之前调用 `enchant` 函数时，我们会得到 `TypeError` 异常。\n\n总结来说，命名函数表达式和匿名函数表达式都会被提升为变量。`这会影响它们的可读性，并在我们尝试运行函数或将其作为模块的公共\
  \ API 暴露时可能导致 bug`。\n\n### 函数声明 (Function Declarations)\n\n`function declarations`（函数声明）相比\
  \ `function expressions` 有一些优势：\n\n1. `它们是有命名的，你可以在函数外部和内部使用它们。`\n2. `它们被作为一个整体被提升为变量，这允许你像这样声明函数：`\n\
  3. `由于这种特殊的提升行为，函数声明允许你像之前讨论的那样，从高抽象层到低抽象层编写 JavaScript 模块，如下所示：`\n\n```\n1 // 使用函数声明你可以这样写函数\n\
  2 // 完全不需要担心提升问题\n3 (function(magic){\n4 \n5 // 模块的公共 API\n6     magic.enchant =\
  \ enchant;\n7 \n8 // 从高抽象层到低抽象层的函数\n9     function enchant(ingredients){\n10   \
  \      var mixture = mix(ingredients),\n11             dough = work(mixture),\n\
  12             cake = bake(dough);\n13         return cake;\n14     }\n15 \n16 \
  \    // 这些是模块的私有函数\n17     function mix(ingredients){\n18         console.log('mixin\
  \ ingredients:', ingredients.join(''));\n19         return 'un-appetizing mixture';\n\
  20     }\n21 \n22     function work(mixture){\n23         console.log('working '\
  \ + mixture);\n24         return 'yet more un-appetizing dough';\n25     }\n26 \n\
  27     function bake(dough){\n28         oven.open();\n29         oven.placeBaking(dough);\n\
  30         oven.increaseTemperature(200);\n31         // insta-oven!\n32       \
  \  return oven.claimVictory();\n33     }\n34 \n35     var oven = {\n36         open:\
  \ function(){},\n37         placeBaking: function(){},\n38         increaseTemperature:\
  \ function(){},\n39         claimVictory: function(){ return 'awesome cake';}\n\
  40     };\n41 \n42 }(window.magic || (window.magic = {})));\n43 \n44 var cake =\
  \ magic.enchant(['flour', 'mandragora', 'dragon', 'chicken foot']);\n45 // => mixin\
  \ ingredients:  flour mandragora dragon chicken foot\n46 // => working un-appetizing\
  \ mixture\n47 console.log(cake);\n48 // => awesome cake\n```\n\n并且，就像 `function\
  \ expressions` 一样，你也可以将 `function declarations` 作为值（和参数）。请注意下方的 `disintegrate` 函数：\n\
  \n\n\n\n```\n 1 var orc = {toString: function(){return 'a mighty evil orc';}};\n\
  \ 2 var warg = {toString: function(){return 'a terrible warg';}};\n 3 var things\
  \ = [1, orc, warg, false];\n 4 \n 5 // 使用 disintegrate 函数声明作为参数\n 6 // 简洁且易读\n 7\
  \ things.forEach(disintegrate);\n 8 \n 9 function disintegrate(thing){\n10     console.log(thing\
  \ + ' suddenly disappears into nothingness...');\n11 }\n12 \n13 // => 1 suddenly\
  \ disappears into nothingness...\n14 // a mighty evil orc suddenly disappears into\
  \ nothingness...\n15 // a terrible warg suddenly disappears into nothingness...\n\
  16 // false suddenly disappears into nothingness...\n```\n\n上面的示例中发生了一些值得注意的有趣现象：*类型转换*。当\
  \ `disintegrate` 函数体被求值时，下面的表达式：\n\n```\n1 thing + ' suddenly disappears into nothingness...'\n\
  ```\n\n会将 `thing` 变量强制转换为 `string` 类型。对于 `orc` 和 `warg` 这两个对象，这意味着调用 `toString`\
  \ 方法并获取这两个对象中任何一个字符串表示。\n\n### 结论：优先使用函数声明和命名函数表达式\n\n**函数表达式**（Function expressions）具有一些局限性：\n\
  \n1. 它们是**匿名的**，这会导致它们的可读性较低、更难调试，且难以在递归中使用。\n\n2. 它们**作为变量被提升**，这可能会导致 Bug，并强制要求在使用它们之前先声明它们。\n\
  \n**命名函数表达式**（Named function expressions）解决了匿名问题。它们让你的原生*函数表达式*更具可读性、更易调试，并支持递归。\n\
  \n**函数声明**（Function declarations）同时解决了匿名和提升两个问题（它们是作为一个整体被提升的），甚至允许你从高抽象到低抽象级别编写代码。\n\
  \n你可以使用 `let` 和 `const` 关键字来解决与*函数表达式*相关的*变量提升*问题，但你无法获得使用*函数声明*时那种优雅的从上到下的叙述逻辑。也就是说，使用\
  \ `let` 和 `const` 时，你不能在声明函数之前使用它，如果尝试这样做，将会抛出异常。\n\n总结来说，基于 JavaScript 的特性，**优先使用命名函数表达式和函数声明，而不是匿名函数表达式**。\n\
  \n希望你喜欢这一章关于 JavaScript 中编写函数不同方式的内容。接下来，我们将讨论在编写 JavaScript 函数时实现默认值、多参数和函数重载的最常见模式，并看看\
  \ ES6 的新特性如何为其中一些功能提供原生支持。\n\n## 练习\n\n## 有用的函数模式：默认参数\n\n```\n 把自己想象成听众、\n 进食者、\n\
  \ 读者、\n 以及你精心设计的咒语的使用者。\n\n 从外向内思考，\n 你将获得数倍的回报。\n\n考虑开发者体验！！\n\n        - Llroc\n\
  \        战士诗人 \n```\n\n### 你听说过默认值吗？\n\n我不认识你，但我总是尝试为自己和其他开发者编写更少的代码和漂亮的 API。实现这一点的一个小方法是使用默认参数。默认值允许你在\
  \ API 背后添加更多意图，并为函数执行的最常见功能或任务提供快捷方式。\n\n在本章以及接下来的章节中，我们将讨论几种可以改进你所编写的 JavaScript\
  \ 函数可用性的模式：默认值、多参数和函数重载。让我们从 ES5 和 ES6 中的默认值开始。\n\n### 在如今的 JavaScript 中使用默认参数\n\
  \n如果你有机会查看过一些 JavaScript 代码，你可能遇到过以下语句并好奇它（到底）是什么意思：\n\n```\n1 var type = type ||\
  \ \"GET\";\n```\n\n坐稳了，因为我们就要揭开这个谜底。这条语句长期以来一直是 JavaScript 中编写默认值的主流方法。如果你做一点简单的心理练习，尝试回忆你读过的关于\
  \ `||`（或）运算符的知识，你会想起该运算符的行为非常特殊：它返回所有求值表达式中的第一个真值\n3 type: type || \"GET\",\n4 \n\
  \ 5 // 或者来自 yeoman router.js \n6 // (https://github.com/yeoman/yo/blob/master/lib/router.js)\n\
  7 this.conf = conf || new Configstore(pkg.name, {\n```\n\n由于在 ES6 之前没有对默认值的原生支持，使用\
  \ `||` 运算符是实现它最紧凑的方法（此处此处重复）\n\n默认值最常见的用法之一发生在评估函数参数时，例如在这个 `castCone` 咒语中：\n\n\
  ```\n1 function castCone(mana, options){\n2   // 我们利用 || 运算符来定义默认值\n3   var mana\
  \ = mana || 5,\n4     options = options || {direction:'in front of you'},\n5   \
  \  direction = options.direction || 'in front of you',\n6     damageMod = options.damage\
  \ || 10,\n7     damage = mana + damageMod;\n8     \n9   console.log(\"You spend\
  \ \" + mana + \" mana and casts a terrible ice cone \" +\n10 on + \" (\" + damage\
  \ + \" DMG).\");\n11\n\n`castCone` 函数有两个参数：一个代表法师施放冰锥时消耗的 `mana` 参数，另一个是带有细节的 `options`\
  \ 对象。\n\n该函数大量使用 `||` 运算符来提供默认值。在最简单的情况下，用户直接调用它，当需要更多技巧时，他或她可以填充丰富的 `options` 参数：\n\
  \n```\n1 castCone();\n2 // => You spend 5 mana and casts a terrible ice cone in\
  \ front of you (20 DMG)\n3 castCone(10);\n4 // => You spend 5 mana and casts a terrible\
  \ ice cone in front of you (20 DMG)\n5 castCone(10, {damage: 200});\n6 // => You\
  \ spend 5 mana and casts a terrible ice cone in front of you (220 DMG)\n7 castCone(10,\
  \ {direction:'towards Mordor'})\n8 // => You spend 10 mana and casts a terrible\
  \ ice cone towards Mordor (30 DMG)\n9 castCone(10, {direction:'towards Mordor',\
  \ damage: 200})\n10 // => You spend 10 mana and casts a terrible ice cone towards\
  \ Mordor (220 DMG)\n```\n\n实现默认值的另一种方法是将它们封装在对象中。\n\n### 对象默认值\n\n除了依赖 `||` 运算符外，你还可以使用对象来收集默认值。每当调用函数时，将用户参数与代表默认值的对象进行合并。只有当实际参数缺失时，才会应用默认值。\n\
  \n你可以定义一个 `mergeDefaults` 函数来执行合并操作：\n\n```\n1 function mergeDefaults(args, defaults){\n\
  2   if (!args) args = {};\n3   for (var prop in defaults) {\n4     if (defaults.hasOwnProperty(prop)\
  \ && !args[prop]) {\n5       args[prop] = defaults[prop];\n6     }\n7   }\n8   return\
  \ args;\n9 }\n```\n\n然后将它应用到传递给函数的参数上，例如在这个 `castLightningBolt` 咒语中：\n\n\n\n\n\n\
  ```javascript\n 1 function castLightningBolt(details){\n 2   // 我们将默认值定义为一个对象\n\
  \ 3   var defaults = {\n 4   \tmana: 5,\n 5     direction: 'in front of you'\n 6\
  \   };\n 7   // 合并 details 和默认值\n 8   // 属性从右到左被覆盖\n 9   details = mergeDefaults(details,\
  \ defaults);\n10   \n11   console.log('You spend ' + details.mana + \n12       '\
  \ and cast a powerful lightning bolt ' + \n13       details.direction + '!!!');\n\
  14 }\n```\n\n这提供了与第一个示例类似的默认开发者体验：\n\n```javascript\n1 castLightningBolt();\n2 //\
  \ => You spend 5 and cast a powerful lightning bolt in front of you!!!\n3 castLightningBolt({mana:\
  \ 100});\n4 // => You spend 100 and cast a powerful lightning bolt in front of you!!!\n\
  5 castLightningBolt({direction: 'to the right'});\n6 // => You spend 5 and cast\
  \ a powerful lightning bolt to the right!!!\n7 castLightningBolt({mana: 10, direction:\
  \ 'towards Mordor'});\n8 // => You spend 10 and cast a powerful lightning bolt towards\
  \ Mordor!!!\n```\n\n尽管如此，你更有可能依赖于流行的开源库。像 `jQuery`、`underscore` 或 `lodash` 这样的库通常带有许多实用函数，你可以将其用于此以及许多其他目的。例如，`jQuery`\
  \ 带有 `$.extend` 函数，而 `underscore` 则同时带有 `_.defaults` 和 `_.extend` 函数，它们可以帮助你解决这种场景。\n\
  \n让我们用这两个库的代码来更新之前的示例：\n\n```javascript\n 1 function castLightningBoltOSS(details){\n\
  \ 2   // 我们将默认值定义为一个对象\n 3   var defaults = {\n 4   \t  mana: 5,\n 5       direction:\
  \ 'in front of you'\n 6   };\n 7   // 用 defaults 扩展 details\n 8   // 属性从右到左被覆盖\n\
  \ 9   // jQuery:\n10   details = $.extend({}, defaults, details);\n11   // underscore:\n\
  12   //details = _.extend({}, defaults, details);\n13   \n14   // 要使用默认值，交换参数位置\n\
  15   // 属性只有在为 undefined 时才会被覆盖\n16   // underscore:\n17   //details = _.defaults({},details,\
  \ defaults);\n18   \n19   console.log('You spend ' + details.mana + \n20       '\
  \ and cast a powerful lightning bolt ' + \n21       details.direction + '!!!');\n\
  22 }\n```\n\n如果你一直关注 ES6，你可能知道它带有了一个类似于 jQuery `$.extend` 方法的原生版本，称为 `Object.assign`。事实上，你可以如下所示更新之前的示例并获得相同的结果：\n\
  \n```javascript\n1 //details = $.extend({}, defaults, details);\n2 details = Object.assign({},\
  \ defaults, details);\n```\n\n但是，如果你计划使用 ES6，有一种更好的方法来使用默认值。\n\n### 使用 ECMAScript\
  \ 6 的原生默认参数\n\nES6 让声明默认参数变得极其简单。就像在 C# 中一样，你使用等号 `=` 并在参数本身分配一个默认值：\n\n```javascript\n\
  1 function castIceCone(mana=5){\n2   console.log(`You spend ${mana} mana and casts\
  \ a terrible ice cone`);\n3 }\n4 \n5 castIceCone();\n6 // => You spend 5 mana and\
  \ casts a terrible ice cone\n7 castIceCone(10);\n8 // => You spend 10 mana and casts\
  \ a terrible ice cone\n```\n\nJavaScript 对默认值的处理更进一步，因为它们并不局限于常量表达式如 [C# *可选参数](https://msdn.microsoft.com/en-us/library/dd264739.aspx)。在\
  \ JavaScript 中，任何表达式都是有效的默认参数。\n\n例如，你可以使用整个对象作为默认值：\n\n```javascript\n 1 function\
  \ castIceCone(mana=5, options={direction:'in front of you'}){\n 2   console.log(`You\
  \ spend ${mana} mana and casts a ` + \n 3     `terrible ice cone ${options.direction}`);\n\
  \ 4 }\n 5 \n 6 castIceCone();\n 7 // => You spend 5 mana and casts a terrible ice\
  \ cone in front of you\n 8 castIceCone(10);    \n 9 // => You spend 10 mana and\
  \ casts a terrible ice cone in front of you\n10 castIceCone(10, {direction: 'towards\
  \ Mordor'});\n11 // => You spend 10 mana and casts a terrible ice cone towards Mordor\n\
  12 castIceCone(10, {duck: 'cuack'});\n13 // => You spend 10 mana and casts a terrible\
  \ ice cone undefined\n```\n\n如果你仔细观察上面示例的末尾，你会发现我们的函数中有一个小漏洞（bug）。我们是为整个 `options`\
  \ 对象设置了默认值，而不是为它的部分设置。因此，如果开发者提供了一个缺少 `direction` 属性的对象，我们将得到一个奇怪的结果（在控制台上写入 `undefined`）。\n\
  \n我们可以通过利用新的**解构语法**来解决这个问题，它允许你直接将参数属性赋值给函数内部的变量，同时为对象的部分提供默认值：\n\n```javascript\n\
  \ 1 function castIceCone(mana=5, options={direction:'in front of you'}){\n 2   console.log(`You\
  \ spend ${mana} mana and casts a ` + \n 3     `terrible ice cone ${options.direction}`);\n\
  \ 4 }\n 5 \n 6 castIceCone();\n 7 // => You spend 5 mana and casts a terrible ice\
  \ cone in front of you\n 8 castIceCone(10);    \n 9 // => You spend 10 mana and\
  \ casts a terrible ice cone in front of you\n10 castIceCone(10, {direction: 'towards\
  \ Mordor'});\n11 // => You spend 10 mana and casts a terrible ice cone towards Mordor\n\
  12 castIceCone(10, {duck: 'cuack'});\n13 // => You spend 10 mana and casts a terrible\
  \ ice cone undefined\n```\n*(注：此处示例代码在原文中未提供解构后的修复版本，此处保留原文逻辑描述)*\n\n如果你仔细观察上面示例的末尾，你会发现我们的函数中有一个小漏洞（bug）。我们是为整个\
  \ `options` 对象设置了默认值，而不是为它的部分设置。因此，如果开发者提供了一个缺少 `direction` 属性的对象，我们将得到一个奇怪的结果（在控制台上写入\
  \ `undefined`）。\n\n我们可以通过利用新的**解构语法**来解决这个问题，它允许你直接将参数属性赋值给函数内部的变量，同时为对象的部分提供默认值：\n\
  \n### 总结\n\n太棒了！在本章中你学习了在 JavaScript 中使用默认值的几种方法，无论你使用的是 ES5 还是 ES6 及以后版本。利用默认值让你编写更少的代码，并为调用者提供更好的用户体验。\n\
  \n下一节是关于多个参数和剩余参数的更多函数模式！\n\n## 练习\n\n## 更有用的函数模式：任意参数\n\n```\n 适用于一个，\n可能适用于多个...\n\
  \n        - Eccason,\n        Aethis 大魔法师 \n```\n\n### 任意数量的参数\n\n有时，你会编写一个根据单个参数执行某些操作的函数。一段时间后，你发现如果可以使用同一个函数，但这次是任意数量的参数就太好了。你可能想要更改原始函数的接口，使其接收数组而不是单个项目。然而，这样做会破坏使用该函数的代码，并迫使任何未来的开发者在发送参数时将其封装在数组中，即使只有一个参数也是如此。\n\
  \n在这种特定场景下，你可能想采取不同的做法。你可能想保持函数接口不变，并优雅地扩展它以支持多个参数，而不影响任何现有代码。我们在 C# 中通过 `params`\
  \ 关键字来实现这一点，而在 JavaScript 中，可以通过 `arguments` 对象或 ES6 *剩余参数语法* 来实现。\n\n这就是你将在本章中学习的内容。但在之前，你知道\
  \ JavaScript 函数在处理参数方面非常独特吗？\n\n\n\n\n在处理函数参数和参数时，JavaScript 给了你极大的自由。例如，你可以一个具有特定数量参数的函数，并且如果你愿意，可以在完全不传递任何参数的情况下调用它。\n\
  \n想象有一个名为 `heal` 的函数，它能对某人施加治疗法术：\n\n```javascript\n1 function heal(person, inchantation,\
  \ modifier){\n2   var healedHp;\n3   modifier = modifier || 1;\n4   healedHp = modifier\
  \ * 100;\n5 \n6   console.log('you heal ' + person + ' with ' + inchantation + \n\
  7               ' spell (+' + healedHp + 'hp)' );\n8   person.hp += healedHp;\n\
  9 }\n```\n\n该函数的 `arity`（次数）为 3，也就是说它期望 3 个参数。你可以通过访问它的 `length` 属性来验证这一点。（顺便说一下，这是一个常见的面试题）：\n\
  \n```javascript\n1 console.log(heal.length);\n2 // => 3\n```\n\n得益于 JavaScript 无限自由的魔力，你可以在没有任何任何参数的情况下调用它。尽管这并不意味着它能够正常工作：\n\
  \n```javascript\n1 try {\n2   heal();\n3 } catch (e) {\n4   console.log(e)\n5 }\n\
  6 // => you heal undefined with undefined spell (+100hp)\n7 // => TypeError: cannot\
  \ read property hp of undefined\n```\n\n你也可以根据意愿传入这 3 个参数中的任意数量进行调用：\n\n```javascript\n\
  \ 1 var JonSnow = {name: 'Jon Snow', hp: 5, toString: function(){return this.name;}};\n\
  \ 2 \n 3 heal(JonSnow);\n 4 // => you heal Jon Snow with undefined spell (+100hp)\n\
  \ 5 \n 6 heal(JonSnow, 'cure');\n 7 // => you heal Jon Snow with cure spell (+100hp)\n\
  \ 8 \n 9 heal(JonSnow, 'super heal', /* modifier */ 2);\n10 // => you heal Jon Snow\
  \ with super heal spell (+200hp)\n```\n\n甚至可以比函数本身定义的参数还要多：\n\n```javascript\n1\
  \ heal(JonSnow, 'heal', 1, 3, 2, 3, 'cucumber', {a: 1, b:2}, 'many arguments');\n\
  2 // => you heal Jon Snow with heal spell (+100hp)\n```\n\n实现函数体并根据你的需要处理每种情况取决于你自己。但当你想要写一个接收任意数量参数的函数时，会发生什么呢？\n\
  \n## 现在就有任意参数函数！\n\n在 C# 中，每当我们编写这样的函数时，都会使用 [`params 关键字](https://msdn.microsoft.com/en-us/library/w5zay9db.aspx)。而在\
  \ JavaScript（直到 ES5）中，目前没有任何关键字或运算符允许我们这样做。\n\n唯一的方法是使用 `arguments` 对象。`arguments`\
  \ 和 `this` 一样，是 JavaScript 中每个函数内部存在的一种特殊对象。它的唯一目的是为了在函数内部访问调用函数时所使用的参数。\n\n想象一个\
  \ `obliterate`（毁灭）法术，你可以用它彻底抹除敌人：\n\n```javascript\n1 function obliterate(enemy){\n\
  2   console.log(enemy + \" wiped out of the face of the earth\");\n3 }\n4 \n5 obliterate('batman');\n\
  6 // => batman wiped out of the face of the earth\n```\n\n但为什么要停留在一个呢？有了 `arguments`，你可以制作一个\
  \ `obliterate` 法术来一次性清除你所有的敌人！\n\n```javascript\n 1 function obliterate(){\n2  \
  \ // 遗憾的是 arguments 不是一个数组 :O\n3   // 所以我们需要自己转换它\n4   var victims = Array.prototype.slice.call(arguments,\
  \ /* startFromIndex */ 0);\n5 \n 6   victims.forEach(function(victim){\n7     console.log(victim\
  \ + \" wiped off of the face of the earth\");\n8   });\n9   console.log('*Everything*\
  \ has been obliterated, ' + \n10               'oh great master of evil and deceit!');\n\
  11 }\n```\n\n确实，我们可以使用一个或任意数量的参数来使用我们的 `obliterate` 函数。我们在不破坏原有性的情况下扩展了函数 API：\n\
  \n```javascript\n 1 obliterate('batman');\n 2 // => batman wiped out of the face\
  \ of the earth\n 3 // *Everything* has been obliterated, oh great master of evil\
  \ and deceit!\n 4 \n 5 obliterate(\"John Doe\", getPuppy(), 1, new Minion('Willy',\
  \ 'troll'));\n 6 /*\n7 John Doe wiped off of the face of the earth\n8 cute puppy\
  \ wiped off of the face of the earth\n9 1 wiped off of the face of the earth\n10\
  \ Willy the troll wiped off of the face of the earth\n11 *Everything* has been obliterated,\
  \ oh great master of evil and deceit!\n12 */\n13 \n14 function getPuppy(){\n15 \
  \  return {\n16     cuteWoof: function(){console.log('wiii');},\n17     toString:\
  \ function(){return 'cute puppy';}\n18   };\n19 };\n20 \n21 function Minion(name,\
  \ type){\n22   this.name = name;\n23   this.type = type;\n24 }\n```\n\n\n\n\n```javascript\n\
  function obliterate(...victims){\n  victims.forEach(function(victim){\n    console.log(victim\
  \ + \" wiped out of the face of the earth\");\n  });\n  console.log('*Everything*\
  \ has been obliterated, ' + \n              'oh great master of evil and deceit!');\n\
  }\n```\n\n在使用剩余参数（rest parameters）时，`victims` 会自动变成一个数组，因此不需要进行额外的转换。事实上，如果我们像之前那样使用这个新的\
  \ `obliterate` 函数，它工作得非常完美：\n\n```\n 1 obliterate('batman');\n 2 // => batman wiped\
  \ out of the face of the earth\n 3 // *Everything* has been obliterated, oh great\
  \ master of evil and deceit!\n 4 \n 5 \n 6 obliterate(\"John Doe\", getPuppy(),\
  \ 1, new Minion('Willy', 'troll'));\n 7 /*\n 8 John Doe wiped off of the face of\
  \ the earth\n 9 cute puppy wiped off of the face of the earth\n10 1 wiped off of\
  \ the face of the earth\n11 Willy the troll wiped off of the face of the earth\n\
  12 *Everything* has been obliterated, oh great master of evil and deceit!\n13 */\n\
  ```\n\n剩余参数也可以与普通参数结合使用。例如，想象 `obliterate` 咒语对它遇到的第一个敌人有一个额外效果。我们可以这样重写它：\n\n```javascript\n\
  1 function obliterate(unfortunateVictim, ...victims){\n2   console.log(unfortunateVictim\
  \ + \" wiped out of the face of EXISTENCE \" +\n3              \"as if it had never\
  \ existed.... Woooo\");\n4   victims.forEach(function(victim){\n5     console.log(victim\
  \ + \" wiped out of the face of the earth\");\n6   });\n7   console.log('*Everything*\
  \ has been obliterated, ' + \n8               'oh great master of evil and deceit!');\n\
  9 }\n```\n\n在使用这个恶毒咒语时，第一个敌人将完全、彻底地从世界上消失：\n\n```\n1 obliterate(\"John Doe\", getPuppy(),\
  \ 1, new Minion('Willy', 'troll'));\n2 /*\n3 John Doe wiped out of the face of EXISTENCE\
  \ as if it had never existed.... Woooo be4 cute puppy wiped off of the face of the\
  \ earth\n5 etc...\n6 */\n```\n\n注意剩余参数是如何轻松地捕获 `unfortunateVictim` 之后的所有剩余参数的。太棒了！\n\
  \n你现在知道了实现接收任意数量参数函数的不同方法。无论用一个参数还是多个参数调用，该函数都提供相同的 API。但如果你恰好有一个数组呢？如果另一个函数的输出是一个需要被消灭的敌人数组会发生什么？嗯，这时\
  \ **ES6 展开运算符**就派上用场了。\n\n**ES6 展开运算符**（以及你稍后在书中学的其他内容）让你能够使用数组作为参数，无缝地调用这类函数：\n\
  \n```javascript\n1 let mortalEnemies = [\"John Doe\", getPuppy()];\n2 obliterate(...mortalEnemies);\n\
  3 obliterate(\"John Doe\", getPuppy(), 1, new Minion('Willy', 'troll'));\n4 /*\n\
  5 John Doe wiped out of the face of the earth\n6 cute puppy wiped out of the face\
  \ of the earth\n7 *Everything* has been obliterated, oh great master of evil and\
  \ deceit!\n8 */\n```\n\n使用展开运算符（spread operator）允许你将数组展开为独立的参数传递给函数。这在处理动态数量的参数时非常有用。\n\
  \n\n\n\n\n```\n1 raiseSkeletonWithArgumentInspecting();\n2 // => raise a skeleton\n\
  3 raiseSkeletonWithArgumentInspecting(4);\n4 // => raise 4 skeletons\n5 raiseSkeletonWithArgumentInspecting('king');\n\
  6 // => raise skeleton king\n```\n\n这种方法很快就会变得非常笨肿。随着重载函数及其参数数量的增加，该函数将变得越来越难以阅读、维护和扩展。\n\
  \n此时，你可能在想：*“……检查传递参数的类型？认真的吗？！”* 我赞同你的观点，这就是为什么我更喜欢使用接下来的方法。\n\n使用 使用配置对象（Options\
  \ Object）\n\n实现函数重载的更好方法是使用一个 `options` 对象。该对象作为函数可以消耗的不同参数的容器：\n\n```javascript\n\
  \ 1 function raiseSkeletonWithOptions(spellOptions){\n 2   spellOptions = spellOptions\
  \ || {};\n 3   var armySize = spellOptions.armySize || 1,\n 4     creatureType =\
  \ spellOptions.creatureType || '';\n 5   \n 6   if (creatureType){\n 7     console.log('raise\
  \ a skeleton ' + creatureType);\n 8   } else {\n 9     console.log('raise ' + armySize\
  \ + ' skeletons ' + creatureType);\n10   }\n11 }\n```\n\n这允许你使用不同的参数调用函数：\n\n```javascript\n\
  1 raiseSkeletonWithOptions();\n2 // => raise a skeleton\n3 raiseSkeletonWithOptions({armySize:\
  \ 4});\n4 // => raise 4 skeletons\n5 raiseSkeletonWithOptions({creatureType:'king'});\n\
  6 // => raise skeleton king\n```\n\n这并不是严格的函数重载，但它提供了相同的好处：它以统一 API 的形式为你提供了不同的可能性，并且具有命名参数和易于扩展的性。也就是说，你可以添加新的选项，而不破坏该函数的任何现有客户端。\n\
  \n以下是在实际场景中同时使用*参数检查*和*配置对象*模式的示例，参考 [jQuery ajax 函数](http://bit.ly/jquery-ajax-js)\
  \ ：\n\n```javascript\n 1 ajax: function( url, options ) {\n 2   // 如果 url 是一个对象，则模拟\
  \ 1.5 之前的签名\n 3   if ( typeof url === \"object\" ) {\n 4     options = url;\n 5\
  \     url = undefined;\n 6   }\n 7 \n 8   // 强制 options 为对象\n 9   options = options\
  \ || {};\n10 \n 11   var transport,\n 12     // 不带缓存参数的 URL\n 13     cacheURL,\n\
  \ 14     // 响应头\n 15     responseHeadersString,\n 16     responseHeaders,\n 17 \
  \    // 超时处理\n 18     timeoutTimer,\n 19     // 等等\n20 }\n```\n\n### 利用 ES6 默认参数\n\
  \n尽管 ES6 没有引入经典的函数重载，但它带了默认参数，比我们目前为止获得的函数重载提供了更好的支持。\n\n如果你思考一下，默认参数是函数重载的一种特殊版本。可以认为它是它的子集，适用于那些可以使用不断增加的预定义参数的情况：\n\
  \n```javascript\n1 function castIceCone(mana=5, {direction='in front of you'}={}){\n\
  2   console.log(`You spend ${mana} mana and casts a ` + \n3     `terrible ice cone\
  \ ${direction}`);\n4 }\n5 castIceCone();\n6 // => You spend 5 mana and casts a terrible\
  \ ice cone in front of you\n7 castIceCone(10, {direction: 'towards Mordor'});\n\
  8 // => You spend 10 mana and casts a terrible ice cone towards Mordor\n```\n\n\
  ### 利用多态函数\n\n实现函数重载的另一种有趣模式是依赖 JavaScript 对函数式编程的强大支持。在函数式编程的世界，有一个多态函数的概念，即根据参数表现出不同行为的函数。\n\
  \n让我们用一个例子来说说明它们。我们的起点是我们在*检查参数*部分中看到的这个函数：\n\n```javascript\n 1 function raiseSkeletonWithArgumentInspecting(){\n\
  \ 2   if (typeof arguments[0] === \"number\"){\n 3     raiseSkeletonsInNumber(arguments[0]);\n\
  \ 4   } else if (typeof arguments[0] === \"string\") {\n 5     raiseSkeletonCreature(arguments[0]);\n\
  \ 6   } else {\n 7     console.log('raise a skeleton');\n 8   }\n 9 \n10   function\
  \ raiseSkeletonsInNumber(n){\n11     console.log('raise ' + n + ' skeletons');\n\
  12   }\n13   function raiseSkeletonCreature(creature){\n14     console.log('raise\
  \ a skeleton ' + creature);\n15   };\n16 }\n```\n\n我们将它拆解为更小的函数：\n\n```javascript\n\
  \ 1 function raiseSkeletons(number){\n 2   if (Number.isInteger(number)){ return\
  \ `raise ${number} skeletons`;}\n 3 }\n 4 \n 5 function raiseSkeletonCreature(creature){\n\
  \ 6   if (creature) {return `raise a skeleton ${creature}`;}\n 7 }\n 8 \n 9 function\
  \ raiseSingleSkeleton(){\n10   return 'raise a skeleton';\n11 }\n```\n\n现在我们创建一个创建一个抽象（函数式编程喜欢抽象），该函数按顺序执行几个其他函数，直到其中一个函数返回有效结果为止。任何不同于\
  \ `undefined` 的值都是有效结果：\n\n```javascript\n 1 // 这是一个返回新函数的高阶函数。\n 2 // 类似于函数工厂。\n\
  \ 3 // 我们可以随心所欲地重用它。\n 4 function dispatch(...fns){\n 5 \n 6   return function(...args){\n\
  \ 7     for(let f of fns){\n 8       let result = f.apply(null, args);\n 9     \
  \  if(exists(result)) return result;\n10     }\n11   };\n12 }\n 13 \n14 function\
  \ exists(value){\n15   return value !== undefined\n16 }\n```\n\n`dispatch` 让我们创建一个由所有之前的函数组合的新函数：`raiseSkeletons`、`raiseSkeletonCreature`\
  \ 和 `raiseSingleSkeleton`：\n\n```javascript\n1 let raiseSkeletonFunctionally = dispatch(\n\
  2           raiseSkeletons, \n3           raiseSkeletonCreature, \n4           raiseSingleSkeleton);\n\
  ```\n\n这个新函数将根据它接收的参数表现出不同的行为。它会将任何调用委托给每个特定的召唤骨髅函数，直到获得合适的结果为止。\n\n```javascript\n\
  1 console.log(raiseSkeletonFunctionally());\n2 // => raise a skeleton\n3 console.log(raiseSkeletonFunctionally(4));\n\
  4 // => raise 4 skeletons\n5 console.log(raiseSkeletonFunctionally('king'));\n6\
  \ // => raise skeleton\n```\n\n注意最后一个 `raiseSingleSkeleton` 是一个捕捕函数。无论发送什么参数，它始终会返回一个有效结果。\n\
  \n你可能注意到或没有注意的一个超级超级酷酷的事情是，这种方法具有**极佳的可组合性**。如果我们以后想扩展这个函数，可以在不修改原始函数的情况下完成。看下这个：\n\
  \n```javascript\n1 function raiseOnSteroids({number=0, type='skeleton'}={}){\n2\
  \   if(number) {\n3     return `raise ${number} ${type}s`;\n4   }\n5 }\n6 \n7 let\
  \ raiseAdvanced = dispatch(raiseOnSteroids, raiseSkeletonFunctionally);\n```\n\n\
  我们现在有了一个 `raiseAdvanced` 函数，它通过 `raiseOnSteroids` 所代表的新所需功能增强了 `raiseSkeletonFunctionally`：\n\
  \n```javascript\n1 console.log(raiseAdvanced());\n2 // => raise a skeleton\n3 console.log(raiseAdvanced(4));\n\
  4 // => raise 4 skeletons\n5 console.log(raiseAdvanced('king'));\n6 // => raise\
  \ skeleton\n7 console.log(raiseAdvanced({number: 10, type: 'ghoul'}))\n8 // => raise\
  \ 10 ghouls\n```\n\n函数式编程非常酷，对吧？我们将在书的后部分 FP 圣经中深入探讨函数式编程，你将会有机会更多实验高阶函数和函数组合。\n\
  \n### 总结\n\n尽管 JavaScript 不支持函数重载，但你可以通过不同的模式（检查参数、使用配置对象、依赖 ES6 默认参数或利用多态函数）来实现相同的行为。\n\
  \n\n\n\n你可以使用 `arguments` 对象并 `inspect the arguments` 查看传递给函数的参数。你应该只在最简单的实现中使用此方案，因为随着函数参数和重载的增加，它会变得难以臃肿且难以维护。\n\
  \n或者，你可以使用一个 `options object`（选项对象）作为参数的包装器。这比检查参数更具可读性且可维护性，并提供了两个额外优势：命名参数以及使用新参数扩展函数的极大灵活性。\n\
  \nES6 通过原生默认参数，在某些情况下改进了对函数重载的支持。\n\n最后，你可以利用函数式编程的优势，用较小的函数组合成你的函数，并使用分发机制根据参数来选择使用哪种函数。\n\
  \n## 练习\n\n## 关于召唤仆人和小生物的艺术，或理解 JavaScript 对象的的基础\n\n```\n 事物是思想，\n思想是抽象，\n抽象是对象，\n\
  对象是事物。\n\n这就是 JavaScript 魔法术的秘密\n\n        - Branden Iech,\n        《冥想录》\n```\n\
  \n### 对象数组\n\n你好，JavaScript 魔法师！是时候接触 JavaScript 对象的基础了。在这一章中，你将学习对象初始化器的美感，以及 ES6\
  \ 为对象带来的良好改进。如果你认为自己已经熟悉这些内容，请想两次！这一章中不止一个惊喜，我保证你在读完之后会学到新东西。\n\n让我们开始吧！我们将把精力集中在谦虚的对象初始化器上。这将提供一个基础，当我们之后学习\
  \ JavaScript 中的面向对象编程书籍和原型继承时，可以使用它。\n\n就是对象！\n\n### 对象初始化器（又称对象字面量）\n\n在 JavaScript\
  \ 中创建对象的最简单方法是使用对象初始化器：\n\n```\n1 var critter = {}; // {} 是空对象初始化器\n```\n\n你可以随心所欲地在对象初始化器内部添加属性和方法：\n\
  \n```\n 1 critter = {\n 2   position: {x: 0, y: 0},\n 3   movesTo: function (x,\
  \ y){\n 4     console.log(this + ' moves to (' + x + ',' + y + ')');\n 5     this.position.x\
  \ = x;\n 6     this.position.y = y;\n 7   },\n 8   toString: function(){\n 9   \
  \  return 'critter';\n10   },\n11   hp: 40\n12 }\n```\n\n当然，如果你调用了 `critter` 对象内部的方法，它的行为将符合你对任何一个体面的、自尊的方法预期：\n\
  \n```\n1 critter.moveTo(10, 10);\n2 // => critter moves to (10,10)\n```\n\n正如你在书的介绍中所看到的，你可以随时为任何\
  \ any-^(10) 对象添加新属性：\n\n```\n1 critter.damage = 1;\n2 critter.attacks = function(target)\
  \ {\n3   console.log(this + ' rabidly attacks ' + target + \n4               'with\
  \ ' + this.damage + ' damage');\n5   target.hp-=this.damage;\n6 };\n```\n\n并使用这些新能力去造成巨大的破坏：\n\
  \n```\n1 var rabbit = {hp:10, toString: function(){return 'rabbit';}};\n2 \n3 critter.attacks(rabbit);\n\
  4 // => critter rabidly attacks rabbit with 1 damage\n```\n\n或者，你也可以通过通过 `[]` 使用\
  \ `indexing notation` 来访问对象内部的任何属性和方法：\n\n```\n1 critter'attacks';\n2 // => critter\
  \ rabidly attacks rabbit with 1 damage\n```\n\n虽然这种写法稍微冗长，但它允许你使用特殊字符作为属性和方法的名字：\n\
  \n```\n 1 critter['sounds used when communicating'] = ['beeeeeh', 'grrrrr', 'tjjiiiiii'];\n\
  \ 2 critter.saysSomething = function(){\n 3   var numberOfSounds = this['sounds\
  \ used when communicating'].length,\n 4       randomPick = Math.floor(Math.random()*numberOfSounds);\n\
  \ 5 \n 6   console.log(this['sounds used when communicating'][randomPick]);\n 7\
  \ };\n 8 \n 9 critter.saysSomething();\n10 // => beeeeeeh (random pick)\n11 critter.saysSomething();\n\
  12 // => tjjiiiii (random pick)\n```\n\n正如你在上面的许多示例所示，你可以使用 `this` 关键字引用对象本身，从而访问同一对象内的其他属性。\n\
  \n#### Getters 和 Setters\n\nGetters 和 setters 是对象初始化器中经常被忽略的特性。你甚至会发现相当丰富的 JavaScript\
  \ 开发人员都它们的存在。它们的工作方式与 C# 完全相同，看起来如下：\n\n```\n 1 var mouse = {\n 2   strength: 1,\n\
  \ 3   dexterity: 1,\n 4   get damage(){ return this.strength*die20() + this.dexterity*die8();},\n\
  \ 5   attacks: function(target){\n 6     console.log(this + ' ravenously attacks\
  \ ' + target + \n 7                 'with ' + this.damage + ' damage!');\n 8   \
  \  target.hp-=this.damage;\n 9   },\n10   toString: function() { return 'mouse';}\n\
  11 }\n```\n\n注意 `damage` 属性是一个 getter。当你需要根据其他属性定义属性时，getters 非常有用。例如，上面的 `damage`\
  \ 属性是使用 `strength` 和 `dexterity` 计算出的。\n\nsetter 允许你在设置属性时执行代码。这对于验证或转换值非常有用：\n\n\
  ```\n1 var mouse = {\n2   _strength: 1,\n3   set strength(value){\n4     if(value\
  \ < 0){\n5       console.log(\"Strength cannot be negative\");\n6     } else {\n\
  7       this._strength = value;\n8     }\n9   },\n10  get strength(){\n11    return\
  \ this._strength;\n12  }\n13 };\n\n14 mouse.strength = -5; // Logs: Strength cannot\
  \ be negative\n15 mouse.strength = 10; // Works\n```\n\n\n\n\n```javascript\nfunction\
  \ monster(type, hp){\n  return {\n    type: type,\n    hp: hp || 10,\n    toString:\
  \ function(){return this.type;},\n    position: {x: 0, y: 0},\n    movesTo: function\
  \ (x, y){\n      console.log(this + ' moves to (' + x + ',' + y + ')');\n      this.position.x\
  \ = x;\n      this.position.y = y;\n    }\n  };\n}\n```\n\n定义完成后，我们可以根据意愿使用它来实例化新对象：\n\
  \n```javascript\nvar tinySpider = monster('tiny spider', /* hp */ 1);\ntinySpider.movesTo(1,1);\n\
  // => tiny spider moves to (1,1)\n```\n\n```javascript\nvar giantSpider = monster('giant\
  \ spider', /* hp */ 200);\ngiantSpider.movesTo(10,10);\n// => giant spider moves\
  \ to (10,10);\n```\n\n在 JavaScript 中，你可以使用工厂做很多酷酷的事情。当你学习 OOP（面向对象编程）时，会发现其中一些，届时我们将看到通过混入（mixins）进行对象组合，作为类继承的替代方案。在此期间，让我们来看看**如何实现数据隐私**。\n\
  \n#### JavaScript 中的数据隐私\n\n你现在可能已经注意到，JavaScript 中没有访问修饰符，没有 `private`、`public`\
  \ 或 `protected` 关键字。这是因为**每个属性都是公共的**，也就是说，无法通过仅仅使用对象初始化器来声明私有属性。你需要依赖带有**闭包**（closures）的额外模式来实现数据隐私，这正是工厂大显身手的地方。\n\
  \n假设我们有之前的 `monster` 示例，但现在我们不想暴露我们是如何实现定位的。我们更希望将这一事实从窥探的眼睛和对象消费者那里隐藏起来。如果我们将来决定将其更改为三维表示、极坐标或未知的什么，它都不会破坏对象的任何客户端。这是我所称的**意图编程**（intentional\
  \ programming）的一部分，你所做的每一个决策、你构建的接口、你选择隐藏或公开的部分，都代表了你对特定对象或 API 应如何使用的意图。**编写代码时要保持谨慎且具有意图性**。回到\
  \ `monster`：\n\n```javascript\nfunction stealthyMonster(type, hp){\n  var position\
  \ = {x: 0, y: 0};\n  \n  return {\n    type: type,\n    hp: hp || 10,\n    toString:\
  \ function(){return 'stealthy ' + this.type;},\n    movesTo: function (x, y){\n\
  \      console.log(this + ' moves stealthily to (' + x + ',' + y + ')');\n     \
  \ // 此函数闭包（或封装）了 position 变量\n      // position 不是对象本身的一部分，它是一个自由变量\n      // 这就是为什么你不能通过\
  \ this.position 访问它\n      position.x = x;\n      position.y = y;\n    }\n  };\n\
  }\n```\n\n让我们仔细观察这个示例。我们将 `position` 属性提取到对象初始化器之外，并放在 `stealthyMonster` 作用域内的变量中（记住\
  \ JavaScript 中的函数会创建作用域）。同时，我们更新了 `movesTo` 函数，它创建了自己的作用域，以引用外部作用域内的 `position`\
  \ 变量，从而有效地创建了闭包。\n\n由于 `position` 不是返回对象的一部分，因此客户端无法通过点符号符号访问它。由于 `movesTo` 变成了一个闭包，它可以访问外部作用域内的\
  \ `position` 变量。总之，我们获得了一些数据隐私：\n\n```javascript\nvar darkSpider = stealthyMonster('dark\
  \ spider');\nconsole.log(darkSpider.position)\n// 现在 position 是完全私有的\n// => undefined\n\
  \ndarkSpider.movesTo(10,10);\n// => stealthy dark spider moves stealthily to (10,10)\n\
  ```\n\n#### ES6 改进了对象初始化器\n\nES6 对对象初始化器带来了一些改进，减少了创建新对象所需的代码。例如，在 ES6 中，你可以使用简写语法在对象内部声明方法：\n\
  \n```javascript\nlet sugaryCritter = {\n  position: {x: 0, y: 0},\n  // 从 movesTo:\
  \ function(x, y) 变为...\n  movesTo(x, y){\n    console.log(`${this} moves to (${x},${y})`);\n\
  \    this.position.x = x;\n    this.position.y = y;\n  },\n  // 从 toString: function()\
  \ 变为...\n  toString(){\n    return 'sugary ES6 critter';\n  },\n  hp: 40\n};\n\n\
  sugaryCritter.movesTo(10, 10);\n// => sugary ES6 critter moves to (10, 10)\n```\n\
  \n正如你在上面示例的 `movesTo` 和 `toString` 方法中看到的，使用简写语法可以让你跳过 `function` 关键字，直接在函数名后合并参数。\n\
  \n此外，你还可以将简写语法应用于对象属性。当你编写工厂函数时，通常会遵循这样一种模式：根据传递给工厂函数的参数来初始化对象属性：\n\n```javascript\n\
  function simpleMonster(type, hp = 10){\n  return {\n    type: type,\n    hp: hp\n\
  \  };\n}\n```\n\n在 `type: type` 和 `hp: hp` 中你有一点点冗余代码。属性简写语法允许你只写一次属性/值对，消除了重复的需要。因此，之前的示例变成了一个更简洁的工厂方法：\n\
  \n```javascript\nfunction simpleMonster(type, hp = 10){\n  return {\n    // 使用属性简写，我们避免了重复\n\
  \    // 变量名两次 (type: type)\n    type,\n    hp\n  };\n}\n```\n\n这里你有一个完整的示例，我们同时使用方法简写和属性简写来获得终极甜味怪物：\n\
  \n```javascript\nfunction sugaryStealthyMonster(type, hp = 10){\n  let position\
  \ = {x: 0, y: 0};\n  \n  return {\n    // 使用属性简写，我们避免了重复\n    // 变量名两次 (type: type)\n\
  \    type,\n    hp,\n    toString(){return `stealthy ${this.type}`;},\n    movesTo(x,\
  \ y){\n      console.log(`${this} moves stealthily to (${x},${y})`);\n      position.x\
  \ = x;\n      position.y = y;\n    }\n  };\n}\n\nlet sugaryOoze = sugaryStealthyMonster('sugary\
  \ Ooze', /*hp*/ 500);\nsugaryOoze.movesTo(10, 10);\n// => stealthy sugary Ooze moves\
  \ stealthily to (10,10)\n```\n\n最后，随着 ES6 的出现，你可以使用任何表达式作为属性名。也就是说，你不再局限于普通名称或处理特殊字符的方括号符号。从\
  \ ES6 开始，你可以使用任何表达式，JavaScript 引擎将将其求值为字符串（符号是我们在下一节看到的例外）。看这个：\n\n```javascript\n\
  let theArrow = () => 'I am an arrow';\n\n// \n\nlet crazyMonkey = {\n  // ES6 计算属性\n\
  \  [(() => 'loves!')()]: ['bananas'],\n  [sugaryOoze.type]: sugaryOoze.type\n  //\
  \ 更疯狂的\n  [theArrow]: `what's going on!?`,\n}\n```\n\n这个示例让我们意识到任何表达式都是有效的。我们使用了求值函数的结果\
  \ `(() => 'loves!')()`、另一个对象的属性 `sugaryOoze.type` 甚至一个箭头函数 `theArrow` 作为属性名。如果你检查对象本身，你可以看到每个属性是如何被解释为字符串的：\n\
  \n```javascript\nconsole.log(crazyMonkey);\n// => [object Object] {\n   function\
  \ theArrow() {\n     return 'I am an arrow';\n   }: \"what's going on?\",\n   hates!:\
  \ [\"mario\", \"luigi\"],\n   loves!: [\"bananas\"],\n   name: \"Kong\",\n  sugary\
  \ Ooze: \"sugary Ooze\"\n// }\n```\n\n你可以使用 `[]`(索引）语法来检索它们：\n\n```javascript\n\
  console.log(crazyMonkey[theArrow]);\n// => \"what's going on?\"\n```\n\n\n\n\n\n\
  Symbol（符号）是 JavaScript 中的一种新类型。它们被设计用于表示常量，并用作对象属性的标识符。规范甚至将它们描述为“可以用作对象属性键的所有非字符串值的集合”\
  \ ^(13)。它们是不可变的，并且可以关联一个描述信息。\n\n你可以使用 `Symbol` 函数来创建一个 `symbol`：\n\n```\n1 let\
  \ anUndescriptiveSymbol = Symbol();\n2 console.log(anUndescriptiveSymbol);\n3 //\
  \ => [object Symbol]\n4 console.log(typeof anUndescriptiveSymbol);\n5 // => symbol\n\
  6 console.log(anUndescriptiveSymbol.toString());\n7 // => Symbol()\n```\n\n你还可以通过将描述作为同一函数的参数传递来为\
  \ `symbol` 添加描述。这对于调试非常有帮助，因为 `toString` 方法会显示该描述：\n\n```\n1 // 你可以为 Symbol 添加一个描述\n\
  2 // 这样你以后就可以识别这个 symbol\n3 let up = Symbol('up');\n4 console.log(up.toString());\n\
  5 // => Symbol(up)\n```\n\n每个 symbol 都是唯一的且不可变的，所以即使我们创建两个描述相同的 symbol，它们仍然是两个完全不同的\
  \ symbol：\n\n```\n1 // 每个 symbol 都是唯一且不可变的\n2 console.log(`Symbol('up') === Symbol('up')??\
  \ ${Symbol('up') === Symbol('up')}`);\n3 // => Symbol('up') === Symbol('up')?? false\n\
  ```\n\n除了闭包，ES6 symbol 为我们提供了一种数据隐私的新方法。使用 symbol 作为名称（或键）的属性只能通过该 symbol 的引用（用于标识该属性的同一个\
  \ symbol）来访问。由于这种特殊特性，如果你不向外部世界这个 symbol，你就为自己提供了数据隐私。让我们看看这在实践中是如何工作的：\n\n```\n\
  \ 1 function flyingMonster(type, hp = 10){\n 2   let position = Symbol('position');\n\
  \ 3   \n 4   return {\n 5     [position]: {x: 0, y: 0},\n 6     type,\n 7     hp,\n\
  \ 8     toString(){return `stealthy ${this.type}`;},\n 9     movesTo(x, y){\n10\
  \       console.log(`${this} flies like the wind from` +\n11                   `(${this[position].x},\
  \ ${this[position].y}) to (${x},${y})`);\n12       this[position].x = x;\n13   \
  \    this[position].y = y;\n14     }\n 15   };\n 16 }\n 17 \n 18 let pterodactyl\
  \ = flyingMonster('pterodactyl');\n 19 pterodactyl.movesTo(10,10);\n20 // => stealthy\
  \ pterodactyl flies like the wind from (0,0) to (10,10)\n```\n\n由于在 `flyingMoster`\
  \ 函数外部我们没有 symbol `position` 的引用（它在函数内部作用域），我们无法访问 position 属性：\n\n```\n1 console.log(pterodactyl.position);\n\
  2 // => undefined\n```\n\n因为每个 symbol 都是唯一的，我们无法使用另一个描述相同的 symbol 来访问该属性：\n\n```\n\
  1 console.log(pterodactyl[Symbol('position')]);\n2 // => undefined\n```\n\n如果一切到此为止，这个世界将是完美的，我们可以使用\
  \ symbol 进行数据隐私并永远幸福地生活。然而，它有一个缺点：JavaScript 的 `Object` 原型提供了 `getOwnPropertySymbols`\
  \ 方法，允许你获取任何给定对象中作为属性使用的 symbols。这意味着在经过了这一切麻烦之后，我们通过以下简单步骤就可以访问 position 属性：\n\n\
  ```\n1 var symbolsUsedInObject = Object.getOwnPropertySymbols(pterodactyl);\n2 var\
  \ position = symbolsUsedInObject[0];\n3 console.log(position.toString());\n4 //\
  \ => Symbol(position)\n5 // 抓到你了！\n6 \n7 console.log(pterodactyl[position]);\n8\
  \ // => {x: 10, y: 10}\n9 // 哎！\n```\n\n所以你可以将 symbol 理解为实现数据隐私的一种软方法，你让代码的意图更加清晰，但你的数据并不是真正的私。正是由于这种限制性，我仍然倾向于使用闭包而不是\
  \ symbol。\n\n## 结语\n\n在本章中，你学习了在 JavaScript 中处理对象最直接的方法：对象初始化器。你学习了如何创建带有属性和方法的对象，如何用新属性扩展现有对象，以及如何使用\
  \ getter 和 setter。我们还回顾了如何重载对象方法，并通过工厂函数简化对象的重复创建。我们将工厂封装在一个模式中，通过使用闭包实现了 JavaScript\
  \ 中的数据隐私。\n\n你还学习了 ES6 为对象初始化器带来的微小改进，即针对方法和属性的简写符号。在本章结束时，我们回顾了新的 ES6 Symbol 类型及其在实现软版本数据隐私方面的用法。\n\
  \n## 练习\n\n## JavaScript 奥秘谜：揭秘 JavaScript 的怪异行为与陷阱\n\n```\n 警惕任何假设，\n 怀疑任何先入为主，\n\
  \ 放弃你的经验，\n 用初学者的思维去思考。\n\n        - Appa Ojnh\n        白圣人 \n```\n\n### 关于 JavaScript\
  \ 怪异行为与陷阱的一些小提示\n\n虽然 JavaScript 看起来很像类 C 语言，但在许多方面它的行为并不像。我认为，这是最大的原因。如果你紧跟了本书，你可能注意到我将这些意料之外的行为称为“JavaScript\
  \ 奥秘（Arcana）”。到目前为止已经看到了一些例子。让我们对它们做一个快速的总结：\n\n*   函数作用域和变量提升\n*   类数组对象\n\n###\
  \ 我们将通过快速回顾你已经学习的怪异行为开始本章（重复是学习的极佳工具）。并将继续深入探讨这些奥秘的其他部分：\n\n*   诡异的 `this` 关键字\n\
  *   默认全局作用域\n*   类型转换的疯狂\n*   JavaScript 严格模式\n\n### 这个最危险的敌人\n\n我们将特别关注 `this`\
  \ 关键字晦涩的行为。我预计在本章中学到的知识将让你免受未来无法的沮丧。\n\n### JavaScript 奥秘快速回顾\n\n在《JavaScript 函数基础》中，我们看到\
  \ JavaScript 具有函数作用域。也就是说，与 C# 每个代码块都会创建一个新作用域不同，在 JavaScript 中只有函数会创建作用域。每当你通过\
  \ `var` 关键字声明变量时，它都限于它的函数。你还学习了提升的概念以及 JavaScript 运行时如何将变量声明移动到函数顶部。最后，你发现了 ES6\
  \ 引入了 `let` 和 `const` 关键字，让你能够声明块级作用域变量并忘记提升带来的烦恼。\n\n在《函数模式：任意参数》中，你学习了 `arguments`\
  \ 对象。可以在每个函数内部访问它以获取传递给该函数的参数。你看到 `arguments` 对象虽然看起来像数组，但实际上是我们所说的类数组对象。类数组对象可以枚举、索引并拥有\
  \ `length` 属性，但它们缺少所有的数组方法。你还发现了如何使用 `Array.prototype.slice` 或 `Array.from` 将这些对象转换为真正的数组，以及新的\
  \ ES6 剩余参数完全解决了 `arguments` 问题。\n\n在《函数模式：重载》中，你学习了你无法像 C# 那样重载 JavaScript 函数或方法。相反，你可以使用几种模式来实现相同的效果：参数检查、选项对象、ES6\
  \ 默认参数或通过多态函数进行函数式编程。\n\n\n\n\n\nC# 开发者在转向 JavaScript 时，遇到的最常见问题之一，就是他们期望 `this`\
  \ 的工作方式与 C# 中完全一样。他或她或它们会写这段常见的代码，却没有意识到潜伏在一次 HTTP 调用之后的巨大危险……\n\n```\n 1 function\
  \ UsersCatalog(){\n 2   this.users = [];\n 3   getUsers()\n 4 \n5   function getUsers(){\n\
  \ 6     $.getJSON('https://api.github.com/users')\n 7     .success(function updateUsers(users){\n\
  \ 8       this.users.push(users);\n 9       // BOOOOOOOM!!!!!\n10       // => Uncaught\
  \ TypeError: Cannot read property 'push' of undefined\n11     });\n12   }\n13 }\n\
  14 var catalog = new UsersCatalog();\n```\n\n在这个代码示例中，我们尝试从 [GitHub API](http://bit.ly/github-api)\
  \ 获取用户集合。我们使用 jQuery 的 `getJSON` 执行 AJAX 请求，如果请求成功，响应将作为参数传递给 `updateUsers` 函数。\n\
  \n该示例抛出了异常 `cannot read property 'push' of undefined`，这是我们熟悉的宿敌在 JavaScript 中的版本：`NullReferenceException`（*我们重逢了*）。本质上，当我们评估\
  \ `updateUsers` 函数时，`this.users` 表达式的值为 `undefined`。当我们尝试执行 `this.users.push(users)`\
  \ 时，我们基本上是在对空对象调用 `push` 方法，从而导致异常抛出。\n\n为了理解为什么会发生这种情况，我们需要学习 `this` 在 JavaScript\
  \ 中是如何工作的。在接下来的章节中，我们将这样做。到本章结束，当我们揭开 `this` 的神秘面纱成为 `this` 专家后，你就能理解错误的原因了。\n\n\
  ## JavaScript 遭遇 This\n\n所以 JavaScript 中的 `this` 很诡异。与其他语言不同，JavaScript 中 `this`\
  \ 的值取决于函数被调用的上下文。重复一遍。JavaScript 中 `this` 的行为并非总是 100% 稳定或可靠，它取决于函数被调用的上下文。\n\n\
  这本质上意味着取决于你如何调用函数，函数内部 `this` 的值会变化。我们可以区分以下四种场景：\n\n* `this` 与对象\n* 未绑定的 `this`\
  \ (unbound)\n* 显式绑定的 `this` (explicit)\n* 绑定的 `this` (bound)\n\n## This 与对象\n\n\
  对于 OOP 开发者来说，最常见的场景是将函数作为方法调用。也就是说，我们使用点符号调用一个作为对象内部属性的函数。\n\n如果我们从地狱深处产生了一个名为 `hellHound`\
  \ 的对象，拥有喷火的凶猛能力：\n\n```\n1 // #1\\. 在对象上下文中调用的函数（方法）\n2 var hellHound = {\n3   attackWithFireBreath:\
  \ function(){\n4     console.log(this + \" jumps towards you and unleashes \" +\
  \ \n5                 \"his terrible breath of fire! (-3 hp, +fear)\");\n6   },\n\
  7   toString: function (){ return 'Hellhound';}\n8 }\n```\n\n当我们使用点符号调用它的 `attackWithFireBreath`\
  \ 方法时，`this` 将取对象本身的值：\n\n```\n1 hellHound.attackWithFireBreath();\n2 // => Hellhound\
  \ jumps towards you and unleashes \n3 //    his terrible breath of fire! (-3 hp,\
  \ +fear)\n4 // 'this' 是 hellHound 对象\n```\n\n这里没什么奇怪的。这是我们在 C# 中熟悉并喜欢的 `this` 版本。在下一个场景中，情况会变得有点复杂。\n\
  \n## 未绑定的 This (This Unbound)\n\n在 JavaScript 中，你可以做一些疯狂的事情。比如在没有定义方法的对象之外调用该方法。由于函数是值，我们可以直接将\
  \ `attackWithFireBreath` 方法保存在变量中：\n\n```\n1 // #2\\. 在没有对象上下文中调用的函数\n2 var attackWithFireBreath\
  \ = hellHound.attackWithFireBreath;\n```\n\n并通过新创建的变量调用函数：\n\n```\n1 attackWithFireBreath();\n\
  2 // => [object Window] jumps towards you and unleashes \n3 //    his terrible breath\
  \ of fire! (-3 hp, +fear)\n```\n\n*哦哦！这里发生了什么？* `this` 不再是地狱犬了，而是 `Window` 对象。你可能在问自己：*什么？*\
  \ 接下来是你需要记住的异部分：每每你在没有对象作为上下文的情况下调用函数时，`this` 会自动变成 `Window 对象`。\n\nJavaScript 中的\
  \ `Window` 对象代表浏览器窗口，包含了文档对象模型（也称为 DOM），它是网站内元素的对象表示。\n\n作为一个酷的练习，你现在可以获取那个自由函数并将其添加到另一个与原始不同的对象\
  \ `zandalf` 中：\n\n```\n1 // 我们可以将相同的方法添加到另一个对象：\n2 var zandalf = {\n3   toString:\
  \ function(){return 'zandalf';}\n4 };\n5 zandalf.attackWithFireBreath = attackWithFireBreath;\n\
  ```\n\n然后使用点符号作为方法调用它：\n\n```\n1 zandalf.attackWithFireBreath();\n2 // => zandalf\
  \ jumps towards you and unleashes \n3 //    his terrible breath of fire! (-3 hp,\
  \ +fear)\n```\n\n再次，当我们在对象上下文中调用原始函数时，`this` 变成了该对象。\n\n让我们总结一下目前为止看到的内容：\n\n1.\
  \ 在对象上下文中调用函数，`this` 将取该对象的值\n2. 在没有上下文的情况下调用函数，`this` 将取 `Window` 对象的值。除非处于*严格模式*，否则它将取\
  \ `undefined` 的值。\n\n## 显式绑定 (This Explicitly)\n\n JavaScript 中的所有函数都继承自 [`Function`](http://bit.ly/mdn-function)。该原型提供了两个非常有帮助的方法，允许你显式设置执行上下文：`call`\
  \ 和 `apply`。\n\n取上一个示例中的 `attackWithFireBreath` 函数。这次，我们没有直接调用它，而是使用 `call` 方法并将对象\
  \ `zandalf` 作为参数：\n\n```\n1 attackWithFireBreath.call(zandalf);\n2 // => zandalf...\n\
  3 // => 'this' 是 zandalf\n```\n\n对象 `zandalf` 变成了函数的上下文。同样，如果在同一个函数上调用 `apply` 方法并将对象\
  \ `hellHound` 作为参数：\n\n```\n1 attackWithFireBreath.apply(hellHound);\n2 // => hell\
  \ hound...\n3 // => 'this' 是 hellHound\n```\n\n但是，如果原始函数有参数怎么办？不用！`call` 和 `apply`\
  \ 都接受传递给原始函数的额外参数。看这个 `attackManyFireBreath` 函数，它向多个目标释放恐怖的火息：\n\n```\n1 function\
  \ attackManyFireBreath(){\n2   var targets = Array.prototype.slice.call(arguments,\
  \ 0);\n3   console.log(this + \" jumps towards \" + targets.join(', ') + \n4   \
  \  \" and unleashes his terrible breath of fire! (-3 hp, +fear)\");\n5 }\n```\n\n\
  `call` 方法除了 `this` 的值外，允许指定一组逗号分隔的参数列表：\n\n```\n1 attackManyFireBreath.call(hellHound,\
  \ 'you', 'me', 'the milkman');\n2 // => Hellhound jumps towards you, me, the milkman\
  \ and unleashes \n3 //    his terrible breath of fire! (-3 hp, +fear)\n```\n\n同样，`apply`\
  \ 接受一个参数数组：\n\n```\n1 attackManyFireBreath.apply(hellHound, ['me', 'you', 'irene']);\n\
  2 // => Hellhound jumps towards me, you, irene and \n3 //    unleashes his terrible\
  \ breath of fire! (-3 hp, +fear)\n```\n\n\n\n\n\n### 3. 使用 `call` 和 `apply` 调用函数\n\
  通过显式作为参数传递上下文，`this` 将取你所传递的任何值。\n\n#### 绑定（Bound）\n\n从 ES5 开始，`Function` 原型还提供了一个非常有趣的方法，称为\
  \ `bind`。`bind` 允许你创建一个**始终具有固定上下文**的新函数，即 `this` 有一个固定值。\n\n让我们使用 `bind` 为我们原始的\
  \ `attackWithFireBreath` 函数中的 `this` 设置一个固定值。`bind` 将返回一个新函数 `attackBound`，它的 `this`\
  \ 的值将是我们指定的指定的。在这种情况下，它将是 `hellHound`：\n\n```\n1 // 从 ES5 开始，我们可以永久地绑定函数的执行上下文\n\
  2 attackBound = attackWithFireBreath.bind(hellHound);\n```\n\n使用 `bind` 之后，即使你不使用点表示法，`this`\
  \ 的值也会绑定到 `hellHound` 对象：\n\n```\n1 attackBound();\n2 // => Hellhound 向你冲来并释放了 \n\
  3 //    他恐怖的火息！(-3 hp, +fear)\n4 // 即使我没有使用点表示法，“this` 也是 Hellhound\n```\n\n此外，如果你将\
  \ `attackBound` 方法赋值给另一个对象并使用点表示法调用它，`attackBound` 方法将在原始对象 `hellHound` 的上下文中执行。也就是说，在用\
  \ `bind` 将函数绑定到上下文后，即使将函数赋值给另一个对象，上下文也会保持不变：\n\n```\n1 // 即使我把函数给另一个另一个对象，函数也是绑定的\n\
  2 zandalf.attackBound = attackBound;\n3 \n4 zandalf.attackBound();\n5 // => Hellhound\
  \ ...\n6 // 即使我用另一个对象使用点表示法，“this` 也是 Hellhound\n```\n\n一旦函数被绑定，就无法取消绑定，也无法重新绑定到另一个对象：\n\
  \n```\n1 // 你不能重新绑定一个已绑定的函数\n2 var attackReBound = attackBound.bind(zandalf);\n\
  3 \n4 attackReBound();\n5 // => Hellhound ...\n6 \n7 attackBound();\n8 // => hellHound\
  \ ...\n```\n\n但你始终可以使用原始的未绑定函数，通过后续对不同上下文的 `bind` 调用来创建新的绑定版本：\n\n```\n1 // 但你仍然可以绑定原始的\n\
  2 var attackRebound = attackWithFireBreath.bind(zandalf);\n3 attackRebound();\n\
  4 // => zandalf...\n```\n\n#### 总结 this\n\n总结一下，`this` 可以根据函数如何被调用而取不同的值。它可以：\n\n\
  * 如果我们在对象内部使用点表示法调用函数，它可以是一个对象\n* 如果函数是被独立调用的，它可以是 `Window` 对象或 `undefined`（严格模式）\n\
  * 可以是作为 `call` 或 `apply` 的参数传递的任何对象\n* 可以作为 `bind` 的参数传递的任何对象\n\n现在你已经是一个 *this\
  \ 专家（this-xpert）*，如果我们回到原始示例，你就能发现问题。由于 `updateUsers` 函数是一个回调，它不是在 `UsersCatalog`\
  \ 对象的上下文中调用的。回调是作为普通函数调用的，因此是在 `Window` 对象的上下文中（或严格模式下的 `undefined`）。由于由于，`updateUsers`\
  \ 内部的 `this` 值不会是 `catalog` 而是 `undefined`。\n\n因为 `this` 不是 `catalog` 对象，它没有 `users`\
  \ 属性，因此导致了 `cannot read property of undefined` 错误：\n\n```\n 1 function UsersCatalog(type){\n\
  \ 2   this.users = [];\n 3   getUsers()\n 4 \n5   function getUsers(){\n 6     $.getJSON('https://api.github.com/users')\n\
  \ 7     .success(function(users){\n 8       this.users.push(users);\n 9       //\
  \ BOOOOOOOM!!!!!\n10       // => Uncaught TypeError: Cannot read property 'push'\
  \ of undefined\n11       // 在此上下文中，“this” 是 jqXHR 对象\n12       // 不是我们的原始对象\n13\
  \     });\n14   }\n15 }\n16 var catalog = new UsersCatalog();\n```\n\n你可以通过两种方法解决这个问题。你可以利用\
  \ JavaScript 对闭包的支持，声明一个 `self` 变量，在 `this` 指向 `UsersCatalog` 对象时“捕获”它的值，并在所示的闭包函数它（这是\
  \ JavaScript 中非常常见的模式）：\n\n```\n 1 function UsersCatalogWithClosure(){\n 2   \"\
  use strict\";\n 3   var self = this;\n 4 \n 5   self.users = [];\n 6   getUsers()\n\
  \ 7 \n 8   function getUsers(){\n 9     $.getJSON('https://api.github.com/users')\n\
  10     .success(function(users){\n11       self.users.push(users);\n12       console.log('success!');\n\
  13     });\n14   }\n15 }\n16 var catalog = new UsersCatalogWithClosure();\n```\n\
  \n或者，你可以利用 `bind` 并确保你作为回调使用的函数绑定到你想要的对象上：\n\n```\n 1 // 使用 bind\n 2 function CatalogWithBind(){\n\
  \ 3   \"use strict\";\n 4 \n 5   this.users = [];\n 6   getUsers();\n 7 \n 8   function\
  \ getUsers(){\n 9     $.getJSON('https://api.github.com/users')\n10     .success(function(users){\n\
  11       this.users.push(users);\n12       console.log('success!');\n13     });\n\
  14   }\n15 }\n16 var catalog = new CatalogWithBind().bind(this);\n\n#### 默认全局作用域与\
  \ JavaScript 中的命名空间\n\n正如你在书结束时将体会到的，ES6 箭头函数在这种情况下也可以帮助你。这些构造之一是命名空间。由于我们没有命名空间的概念，在\
  \ JavaScript 文件中定义的变量属于全局作用域，它们是可见且可访问的\n\n```\n1 dice = \"d12\";\n2 dice; // =>\
  \ d12\n3 window.dice; // => d12\n```\n\n全局变量的问题为人周知：它们紧密耦合了应用程序的不同组件并可能导致命名冲突。想象你有多个定义相同变量但执行不同任务的\
  \ JavaScript 文件。或者引入可能会覆盖自己变量的第三方库。由于这些问题，我们完全避免使用全局变量，但缺乏命名空间支持……怎么办？\n\n**我们可以使用对象来模拟命名空间**。下面所示是一种常用模式，我们使用\
  \ [IIFE](https://en.wikipedia.org/wiki/Immediately-invoked_function_expression)（立即执行函数表达式）来创建/增强命名空间：\n\
  \n```\n 1 // IIFE - 我们在声明函数表达式的同时立即调用它\n 2 (function(armory){\n 3     // armory\
  \ 对象充当命名空间\n 4     // 我们向它添加属性\n 5     // 这些属性构成了 'armory' 模块/命名空间的 API\n 6    \
  \ armory.sword = {damage: 10, speed: 15};\n 7     armory.axe = {damage: 15, speed:\
  \ 8};\n 8     armory.mace = {damage: 16, speed: 7};\n 9     armory.dagger = {damage:\
  \ 5, speed: 20};\n 10 \n11     // 此外你还可以声明私有变量和函数\n12 \n13     // 增强或创建 armory 命名空间\n\
  14 }(window.armory = window.armory || {} )); \n15 \n16 console.log(armory.sword.damage);\n\
  17 // => 10\n```\n\n立即执行函数表达式顾名其名，一个被立即调用的函数表达式。**由于它是函数，它创建了一个新的作用域，你可以在其中安全地拥有变量，并避免与外部世界的命名冲突**。如果你声明与外部作用域中现有变量同名的变量，新变量将仅仅遮蔽该外部变量。\n\
  \n\n\n\n\n通过立即调用函数，你可以根据需要为 `window.armory` 对象扩展任何属性，从而为 `armory` 对象创建一个某种公共 API，使其成为一个命名空间或模块。这是一个容器，你可以在其中放置属性和函数，并将作为服务暴露给应用程序的其他部分。\n\
  \n我们将在关于 JavaScript 模块的章节中重新讨论命名空间（namespacing）和更高级的 JavaScript 代码组织方式。\n\n### 类型转换的疯狂\n\
  \n在 JavaScript 魔法的基础（basic ingredients of javascript-mancy)中，你学习了一些关于 JavaScript\
  \ 类型转换的知识。你学习了 JavaScript 如何提供 `==` 和 `!=` 抽象相等运算符，它们允许你对值进行松散相等比较；以及 `===` 和 `!==`\
  \ 运算符，它们执行严格相等比较。\n\n通过使用第一组运算符，JavaScript 会在执行比较之前尝试将被比较的类型转换为匹配的类型，而第二组运算符则期望类型是匹配。你还学习了类型转换如何通过在将不同的值和类型转换为布尔时赋值\
  \ `true` 和 `false`，从而创建了“假值”（falsey）和“真值”（truthy）的概念。\n\n我认为让你多学一点关于这个 JavaScript\
  \ 特性的知识以及它的潜在陷阱会很有趣。\n\nJavaScript 被设计成一种易读的语言^(18)，即使是没有任何编程经验的外行也能使用它来创建交互式网站。这门欢迎的语言可以帮助任何人编写自己的\
  \ Web 应用并解决自己的问题。你可以在 JavaScript 的许多功能中清晰地看到这一愿景，即使在一些最具争议的特性中也是如此。如果你从这个角度考虑，下面的语句求值为为\
  \ true 并不觉得奇怪：\n\n```\n1 > 42 == '42'\n2 // => true\n```\n\n难道 `42` 不等于 `'42'` 吗？它们难道不是都指向同一个数字吗？它们的类型不同真的重要吗？因此，我们有了类型的隐式转换。\n\
  \n根据我的经验，利用类型转换通常会导致代码更简洁：\n\n```\n1 > if (troll) { // 与 (troll !== null && troll\
  \ !== undefined) 相比\n2   // 执行某些操作\n3 }\n```\n\n利用严格相等通常会产生更正确、更少产生 Bug 代码：\n\n\
  ```\n1 > if (troll !== null && troll !== undefined){\n2 // 执行某些操作\n3 }\n```\n\n\
  在第一情况下，只要 `troll` 具有真值，条件就会满足：它可以是一个对象、一个数组、一个字符串或一个非 0 的数字。在第二种情况下，只要 `troll` 不是\
  \ `null` 也不是 `undefined`，条件就会满足（即使 `troll` 等于 `0`，与上一个例子不同）。**表现力还是正确性，选择你偏好的那一个**。\n\
  \n最常见类型的真值和假值如下（注意我们如何使用 `!!` 显式地将每个值转换为布尔值）。数组和对象都是真值，即使它们是空的也是如此：\n\n```\n1 >\
  \ !![1,2,3]\n2 // => true\n3 > !![]\n4 // => true\n5 > !!{message: 'hello world'}\n\
  6 // => true\n7 > !!{}\n8 // => true\n```\n\n非空字符串是真值，而空字符串是假值：\n\n```\n1 > !!\"\
  hellooooo\"\n2 // => true\n3 > !!\"\"\n4 // => false\n```\n\n数字是真值，但 `0` 是假值：\n\n\
  ```\n1 > !!42\n2 // => true\n3 > !!0\n4 // => false\n```\n\n`undefined` 和 `null`\
  \ 始终是假值：\n\n```\n1 > !!undefined\n2 // => false\n3 > !!null\n4 // => false\n```\n\
  \n### 在严格模式下使用 JavaScript\n\n从 ES5 开始，你可以使用[严格模式（strict mode)](http://bit.ly/mdn-strict-mode)\
  \ 来获得更好的 JavaScript 体验。严格模式的主要目标之一是通过让 JavaScript 运行时更主动地抛出错误，而不是产生静默错误或副作用，防止你掉入常见的\
  \ JavaScript 陷阱。\n\n以回调中 `this` 的值为例。与其将 `this` 的值设置为 `Window` 对象，当你使用严格模式时，`this`\
  \ 的值变为 `undefined`。这个小小的改进防止了你意外访问 `Window` 对象或扩展它，并在你尝试这样做时立即通过错误警示你。**短的反馈循环和快速失败是成功的秘诀**。\n\
  \n严格模式带来的其他改进还有：\n\n*   尝试在不声明的情况下创建变量（使用 `var`、`let` 或 `const`）将抛出错误。在没有严格模式的情况下，它将向\
  \ `Window` 对象添加属性。\n*   尝试将变量赋值为 `NaN`，或给对象内部的只读或不可写属性将抛出异常\n*   尝试删除对象内部不可删除的属性将抛出异常\n\
  *   尝试使用重名作为参数将抛出语法错误\n*   以及更显式的错误，将帮助你更快发现 Bug\n\n此外，启用严格模式后，JavaScript 运行时可以自由做出某些假设并进行优化，从而让你的代码运行更快。如果你想了解更多关于严格模式的细节，我建议你查看\
  \ [MDN (Mozilla 开发者网络)](http://bit.ly/mdn-strict-mode)，这是最好的 JavaScript 资源。\n\n\
  #### 启用严格模式\n\n你可以通过在文件顶部编写 `'use strict';` 来启用严格模式。这将为整个文件启用严格模式：\n\n```\n1 'use\
  \ strict';\n2 // 我的代码 ...\n3 var pouch = {};\n```\n\n或者，你可以在函数顶部使用严格模式声明。这将导致严格模式仅应用于该函数内部：\n\
  \n```\n1 (function(){\n2   'use strict';\n3   // 我的代码 ...\n4   var bag = {};\n5\
  \ }());\n```\n\n在函数内部封装严格模式声明可以防止严格模式应用于可能未准备的代码。这可能发生在严格模式脚本与非严格模式脚本合并时。**ES6 模块始终使用严格模式**。\n\
  \n### 总结\n\n在本章中，你学习了 JavaScript 最奇异的部分，即神秘的 JavaScript 魔法。你从章节开始回顾了在之前章节中读过的 JavaScript\
  \ 魔法部分：函数作用域和变量提升、类数组对象以及函数重载。\n\n你继续查看狡猾的 `this` 关键字，并理解了它的值取决于函数执行的上下文：\n\n* \
  \  如果你使用点符号表示法将函数作为方法调用，`this` 值将是持有该方法的对象。\n*   如果你直接调用函数，`this` 的值将是 `Window`\
  \ 对象（在严格模式下为 `undefined`）。\n*   如果你使用 `call`、`apply` 或 `bind` 调用函数，`this` 的值将设置为你作为这些函数参数传递进去的对象。\n\
  *   你可以使用 `bind` 创建一个绑定到特定对象的函数版本。也就是说，在该新函数中 `this` 将永远是该对象。\n\n你看到了 JavaScript\
  \ 默认假设全局作用域，以及你如何通过使用对象表示命名空间并组织代码来实现类似的命名空间解决方案。你研究了 IIFE（立即调用函数表达式）的概念，以及你如何使用它创建一个隔离的作用域来声明变量并将它们添加到命名空间对象中。\n\
  \n之后，你回顾了 JavaScript 中的类型转换，最后结束了考察严格模式的章节——这是一种通过更响亮的失败来尝试帮助你更快发现 Bug 的更严格的 JavaScript\
  \ 版本。\n\n\n\n\n单词、文本和文本操作在当今的应用程序中非常常见。应用程序通常会提供某种用户界面作为允许用户交互的方式。此 UI 将包含各种形式的文本信息，如标签、工具提示、帮助文本、文本内容等。即使是不暴露用户界面的应用程序，通常也会信息记录到文件系统或分析服务中用于故障排除和监控。\n\
  \nJavaScript 与许多其他语言一样，有一种可以满足所有文本表示和操作需求的原始类型：`string`。在本章中，你将学习关于 JavaScript 字符串的所有知识，以及\
  \ ES6 带来的令人兴奋的新特性：模板字字量和标签。\n\n让我们先从基础开始吧！\n\n## 字符串的基础\n\n你可以使用单引号 `'` 或双引号 `\"\
  ` 来创建字符串。\n\n```\n1 // 你可以使用双引号创建一个字符串\n2 > typeof \"Klaatu... verata... n... Necktie.\
  \ Nectar. Nickel. Noodle.\"\n3 // => string\n4 \n5 // 或者使用单引号\n6 > typeof 'Klaatu...\
  \ verata... n... Necktie. Nectar. Nickel. Noodle.'\n7 // => string\n```\n\n你经常会使用单引号\
  \ `'` 字符串在字符串内部包含双引号 `\"`，反之亦然：\n\n```\n1 // 你经常会使用 ' 来转义 \"\n2 > \"Ya ain't gonna\
  \ need that fairy dust!\"\n3 // => ya ain't gonna need that fairy dust!\n4 \n5 //\
  \ 反之亦然\n6 > 'it was, in essence, a sophisticated heat beam which we called a \"\
  laser\".'\n7 // => it was, in essence, a sophisticated heat beam which we call a\
  \ \"laser\".\n```\n\n你可以使用 `+` 运算符拼接两个字符串。\n\n```\n1 > \"Three rings \" + \"for\
  \ the elves\"\n2 // => three rings for the elves\n```\n\n`+` 运算符经常用于在字符串中注入值，从而根据数据创建文本：\n\
  \n```\n1 > var conan = {toString: function() {return 'Conan, the cimmerian';}}\n\
  2 > conan + \" was a famous hero of a past age\"\n3 // => Conan, the cimmerian was\
  \ a famous hero of a past age\n```\n\n你也可以使用相同的运算符创建多行字符串：\n\n```\n1 > \"There are\
  \ few men with more blood on their hands than me. \" + \n2 \"None, that I know of.\
  \ \" + \n3 \"The Bloody-Nine they call me, my enemies, and there’s a lot of ’em\"\
  \n4 // => \"There are few men with more blood on their hands than me.  None, \n\
  5 // that I know of. The Bloody-Nine they call me, my enemies, and there’s \n6 //\
  \ a lot of ’em\"\n```\n\n或者，通过在每行末尾使用反斜杠 `\\`：\n\n```\n1 > \"There are few men with\
  \ more blood on their hands than me.\\ \n2 None, that I know of.\\\n3 The Bloody-Nine\
  \ they call me, my enemies, and there’s a lot of ’em\"\n4 // => \"There are few\
  \ men with more blood on their hands than me. None, \n5 // that I know of. The Bloody-Nine\
  \ they call me, my enemies, and there’s \n6 // a lot of ’em\"\n```\n\n此外，你还可以使用换行符\
  \ `\\n` 插入新行：\n\n```\n1 > \"There are few men with more blood on their hands than\
  \ me.\\n None, that I knowof.\\\n2 \\n The Bloody-Nine they call me, my enemies,\
  \ and there’s a lot of ’em\"\n3 // => \"There are few men with more blood on their\
  \ hands than me.\n4 //    None, that I know of.\n5 //    The Bloody-Nine they call\
  \ me, my enemies, and there’s a lot of ’em\"\n```\n\n正如你从上一个示例中推出的那样，JavaScript\
  \ 使用反斜杠 `\\` 作为转义字符：\n\n```\n1 > \"\\\"\"\n2 // => \"\n3 > '\\''\n4 // => '\n```\n\
  \n现在你已经更好地掌握了 JavaScript 中的字符串，让我们看看你可以对它们执行的不同操作。\n\n### 字符串是字符数组吗？\n\nJavaScript\
  \ 字符串不是字符数组，它们的行为更像类数组对象。（此处省略重复内容）[文本已节略]\n\n### 对字符串执行操作\n\n除了这些数组方法外，字符串类型还了自己的系列方法来帮助。你可以使用\
  \ `toUpperCase` 和 `toLowerCase` 获取现有字符串的大写或小写版本：\n\n```\n1 console.log(justIt.toUpperCase());\n\
  2 => JUST IT!\n3 \n4 console.log(justIt.toLowerCase());\n5 => just do it!\n```\n\
  \n你可以使用 `charAt` 提取特定位置的字符：\n\n```\n1 > justIt.charAt(0)\n2 => j\n```\n\n`indexOf`\
  \ 方法返回文本在字符串中首次出现的位置。\n\n```\n1 > justIt.indexOf('DO')\n2 => 5\n```\n\n你经常会看到它通过与\
  \ `-1` 比较来查找文本是否存在于字符串中：\n\n```\n1 // 当找不到文本时，indexOf 返回 `-1`\n2 > justIt.indexOf('DO')\
  \ !== -1\n3 // => true\n4 > justIt.indexOf('Sand castle') !== -1\n5 // => false\n\
  ```\n\n或者你可以使用 `search` 方法。它是 `indexOf` 的增强版本，允许使用正则表达式指定要查找的内容：\n\n```\n1 > justIt.search(/DO/)\n\
  2 => 5\n```\n\n`match` 反过来是 `search` 的增强版本，允许根据你选择的正则表达式在字符串中找到多个匹配项：\n\n```\n1\
  \ > justIt.match(/DO/)\n2 => [\"DO\"]\n3 \n4 > justIt.match(/DO.*/)\n5 => [\"DO\
  \ IT!\"]\n```\n\n`replace` 方法让你将一段文本替换为另一个你选择的内容：\n\n```\n1 > justIt.replace('DO\
  \ IT!', 'DANCE!')\n2 // Just DANCE!\n```\n\n由于 `replace` 也允许使用正则表达式，你可以一次性匹配并替换所有子字符串字符串。只需使用\
  \ `g` 标志（代表 *global*）：\n\n```\n1 > 'a dragon is a creature that can breathe fire'.replace(/a\
  \ /g, 'the ')\n2 // => the dragon is the creature that can breathe fire\n```\n\n\
  \n\n\n\n```\n1 // String.prototype.substr(startIndex, length)\n2 > 'a dragon is\
  \ a creature that can breathe fire'.substr(2, 6)\n3 // => dragon\n\n5 // String.prototype.substring(startIndex,\
  \ endIndex)\n6 > 'a dragon is a creature that can breathe fire'.substring(2, 6)\n\
  7 // => drag\n```\n\n你可以使用 `split` 方法将字符串拆分为若干部分。分割后的部分将作为数组项返回：\n\n```\n1 > 'a\
  \ dragon is a creature that can breathe fire'.split(' ');\n2 // => [\"a\", \"dragon\"\
  , \"is\", \"a\", \"creature\", \"that\", \"can\", \"breathe\", \"fire\"]\n```\n\n\
  `split` 和 `join` 方法让你非常容易地将字符串转换为数组，**反之亦然**。使用它们将让你能够不受限制地同时利用字符串方法和数组方法。你有一个字符串并想使用\
  \ `Array.prototype.map` 方法吗？通过 `split` 将其转换为数组，执行任何你需要的操作，然后使用 `join` 获取回字符串。\n\n\
  ```\n1 > 'a dragon is a creature that can breathe fire'.split(' ').join(' ');\n\
  2 // => 'a dragon is a creature that can breathe fire'\n```\n\n## ES6 中的新字符串特性\n\
  \nES6 为字符串带来了许多令人兴奋的新特性：\n\n* 几个新的实用用方法，如 `startsWith` 和 `endsWith`。\n* 通过 `Template\
  \ Literals`（模板字符串）对我们在 JavaScript 中定义字符串的方式进行了彻底重构。模板字符串对字符串插值、多行字符串、HTML 友好字符串提供了更好的支持，并允许创建名为\
  \ `tags` 的可用字符串格式化器。\n\n## ES6 带来新的字符串方法\n\n在读完之前的章节后，你可能错过了三个在 C# 中常用的方法：`Contains`、`StartsWith`\
  \ 和 `EndsWith`。不用担心，因为 ES6 为 JavaScript 字符串引入了所有这些新方法：\n\n`startsWith` 和 `endsWith`\
  \ 方法的工作方式与 C# 中完全相同。前者验证字符串是否以指定的子字符串开头，后者检查字符串是否以指定的文本片段结尾：\n\n```\n1 > 'thunder\
  \ and lightning!'.startsWith('thunder')\n2 // => true\n3 > 'thunder and lightning!'.endsWith('lightning!')\n\
  4 // => true\n```\n\n`includes` 方法执行与 C# `Contains` 相同的功能，通过检查一段文本是否包含在字符串内：\n\n\
  ```\n1 > 'thunder and lightning!'.includes('thunder')\n2 // => true\n3 > 'thunder\
  \ and lightning!'.includes('lightning!')\n4 // => true\n5 > 'thunder and lightning!'.includes('and')\n\
  6 // => true\n```\n\n注意使用 `includes` 方法比之前章节中的 `indexOf` 方法提供了更好的开发者体验和更具可读性的代码。\n\
  \n最后，ES6 引入了 `repeat` 方法，它允许通过重复现有字符串的指定次数来创建一个新字符串：\n\n```\n1 > 'NaN'.repeat(10)\
  \ + ' BatMan!'\n2 // => NaNNaNNaNNaNNaNNaNNaNNaNNaNNaN BatMan!\n```\n\n## ES6 模板字符串的强大之处\n\
  \nES6 模板字符串提供了一种处理字符串的新且非常强大的方式。你可以通过在反引号之间包裹文本来使用模板字符串创建字符串：\n\n```\n1 > `Rain\
  \ fire and destruction upon thy enemies!`\n2 // => Rain fire an destruction upon\
  \ thy enemies!\n```\n\n模板字符串让你自由地使用单引号和双引号，而无需进行转义：\n\n```\n1 > `Rain fire n' destruction\
  \ upon thy \"enemies\"!`\n2 //=> Rain fire n' destruction upon thy \"enemies\"!\n\
  ```\n\n模板字符串的一个巨大优势是你可以以一种非常直观且可读的方式注入值。通过在模板字符串内部使用语法 `${target}`，你可以将变量 `target`\
  \ 的值包含在生成的字符串中。这也称为 `string interpolation`（字符串插值）：\n\n```\n1 let target = 'Sauron',\
  \ spell = 'balefire'\n2 console.log(`Blast ${target} with ${spell}!`) \n3 // =>\
  \ blast Sauron with balefire!\n4\n5 // 在 ES6 之前，我们需要这样写： \n6 // 'blast' + target\
  \ + 'with' + spell\n```\n\n你可以包含模板字符串声明作用域内可访问的任何变量。告别使用 `+` 运算符拼接字符串和变量吧。再见！\n\n\
  此外，在进行字符串插值时，你不限于使用变量。`你可以使用任何有效的 JavaScript 表达式`。例如，你可以调用一个函数：\n\n```\n1 function\
  \ calculateDamage(modifier){ \n2   return Math.round(modifier*Math.random())\n3\
  \ }\n4 console.log(`Blast ${target} with ${spell} making ${calculateDamage(10)}\
  \ damage`)\n5 // => Blast Sauron with balefire making 4 damage\n```\n\n或者执行算术：\n\
  \n```\n1 console.log(`1 + 1 is not ${1+1} ===> SYNERGY!!!`);\n2 // => 1 + 1 is not\
  \ 2 ===> SYNERGY!!!\n```\n\n模板字符串相比原生字符串的另一个巨大改进是多行字符串。使用模板字符串，如果你想有一个多行字符串，直接写多行字符串即可。如此简单：\n\
  \n```\n1 let multiline = `I start in this line,\n2 and then I go to the next,\n\
  3\n```\n\n### Tags\n\nTags 是模板字符串一个非常有趣的的特性。它们允许你自定义字符串字面量的解析方式。要应用标签，可以在模板前加上它的名称：\n\
  \n```\n1 let clothes = 'boots';\n2 let orcLikesBoots = orcSpeech`I like those ${clothes}\
  \ that you're!`\n```\n\n当你像上面那样将标签应用于模板字符串时，其效果与调用标签函数并传入 literals 和 substitutions\
  \ 相同。因此下面的代码是相同的：\n\n```\n1 orcSpeech(['I like those ', \" that you're wearing!\"\
  ], \n2 'boots');\n```\n\n在上例中，`literals` 和 `substitutions` 将是：\n\n```\n1 literals\
  \ => \"I like those\", \" that you're wearing\"\n2 substitutions => ['boots']\n\
  ```\n\n`orcSpeech` 函数的实现可能如下：\n\n```\n1 function orcSpeech(literals, ...substitutions){\n\
  2   console.log(literals); // => ['I like those ', ' that you're wearing']\n3  \
  \ console.log(substitutions); // => ['boots']\n4\n5   let phrase = literals[0];\n\
  6   substitutions.forEach(function(s, idx){\n7     phrase += `${s}${literals[idx+1]}`\n\
  8   });\n9\n10   return phrase.replace(/s/g, 'sss').replace(/r/g, 'rr')\n11 }\n\
  ```\n\n在这里我们组合 literals 和 substitutions，然后分别将 `s` 和 `r` 替换为 `sss` 和 `rr`，从而为原句带有兽人、地精和其他黑暗生物特有的粗犷感。\n\
  \n```\n1 console.log(orcLikesBoots);\n2 // => I like thossse bootsss that you'rering!\n\
  ```\n\n除了你目前看到的之外，标签还让你拥有访问原始字符串字面量（raw string literals）的可能性。访问原始字面量让你能够自定义如何解析特殊字符，例如*换行*\
  \ `/n`、*制表符* `/t` 等。\n\n\n\n\n\n我们可以通过一个假设的 `orcSpeechRaw` 标签来演示这一点：\n\n```\n 1\
  \ function orcSpeechRaw(literals, ...substitutions){\n 2   console.log(literals.raw);\
  \ // => ['I like those ', ' that you're wearing']\n 3   console.log(substitutions);\
  \ // => ['boots']\n 4   \n 5   let phrase = literals.raw[0];\n 6   substitutions.forEach(function(s,\
  \ idx){\n 7     phrase += `${s}${literals.raw[idx+1]}`\n 8   });\n 9   \n10   return\
  \ phrase.replace(/s/g, 'sss').replace(/r/g, 'rr')\n11 }\n```\n\n`literals` 数组暴露了一个\
  \ `raw` 属性，它包含了与 `literals` 数组相同但原始格式的信息。查看非原始标签 `orcSpeech` 的输出：\n\n```\n1 console.log(orcSpeech`I\
  \ like those ${clothes}\\n\\n that you're \\twearing!`)\n2 // => [\"I like those\
  \ \", \"\n3 // \n4 // that you're  wearing!\"]\n5 // ['boots']\n6 // I like thossse\
  \ bootsss\n7 //\n8 // that you'rre  wearring\n```\n\n你将能够体会特殊字符是如何转换为空白字符的。如果你接着查看原始标签\
  \ `orcSpeechRaw` 的输出：\n\n```\n1 console.log(orcSpeechRaw`I like those ${clothes}\\\
  n\\n that you're \\twearing!`)\n2 \n3 // => [\"I like those \", \"\\n\\n that you're\
  \ \\twearing!\"]\n4 // [\"boots\"]\n5 // \"I like thossse bootsss\\n\\n that you'rre\
  \ \\ewearring!\"\n```\n\n你会看到特殊字符在 `literals.raw` 数组中是可用的。\n\n而言之，**标签为你提供了创建可重用格式化函数，甚至为你的\
  \ Web 应用创建小型文本处理 DSL（领域特定语言）的机会**。例如，标签模板字符串字量的一个有趣应用可以是构建你自己的 HTML 模板引擎：\n\n```\n\
  \ 1 let inventory = [\n 2   {name: 'rusty sword', price: 2},\n 3   {name: 'health\
  \ potion', price: 10},\n 4   {name: 'medallion of Valor', price: 300}\n 5 ];\n 6\
  \ \n 7 console.log(ul`\n 8 ${inventory.map(function(item){ return li`${item.name}:\
  \ ${item.price} silvers`})}\n 9 `)\n10 // => \"<ul>\n11 // <li>rusty sword: 2 silvers</li>\n\
  12 // <li>health potion: 10 silvers</li>\n13 // <li>medallion of Valor: 300 silvers</li>\n\
  14 // </ul>\"\n```\n\n在这里我们创建了 `ul` 和 `li` 标签，它们是对是对更通用 `html` 标签的扩展：\n\n```\n 1\
  \ function html(literals, ...substitutions){\n 2   let phrase = literals[0];\n 3\
  \   substitutions.forEach(function(s, idx){\n 4     if (Array.isArray(s)) s = s.join('\\\
  n'); // 如果是数组则转换为字符串\n 5     phrase += `${s}${literals[idx+1]}`;\n 6     // 你也可以添加一些特殊字符处理\n\
  \ 7     // 用于解析不符合 HTML 规范的字符，如 &\n 8   });\n 9   return phrase;\n10 }\n 11 \n12\
  \ function ul(literals, ...substitutions){\n 13   return `<ul>${html(literals, ...substitutions)}</ul>`;\n\
  \ 14 }\n 15 \n 16 function li(literals, ...substitutions){\n 17   return `<li>${html(literals,\
  \ ...substitutions)}</li>`;\n 18 }\n```\n\n如果我们使用下一节介绍的 ES6 箭头函数，应用模板引擎的代码可以进一步简化。但没什么能阻止我们先预览一眼，对吧？\n\
  \n```\nul`${inventory.map(item => li`${item.name}: ${item.price} silvers`)}`)\n\
  ```\n\n太棒了！\n\n### 字符串快速查表\n\n#### 基础\n\n| 基础 | 描述 |\n| --- | --- |\n| `'a string'`,\
  \ `\"a string\"` | 创建字符串 |\n| `\"Y'all\"`, `'the \"laser\"`` | 转义单引号和双引号 |\n| `\"\
  You are: \" + status` | 使用 `+` 拼接字符串和值 |\n| `\"lalalala too long\" +` | 用于多行字符串的拼接\
  \ |\n| `\"lala\"` | |\n| `\"lalalala too long\\` ` | 使用行尾的 `\\` 创建多行字符串 |\n| `lala\"\
