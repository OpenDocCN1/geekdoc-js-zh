  \ Active Dublin 2016 的 JavaScript 黑客松上做的一样。\n\n这个游戏是[打字游戏的变体，单词从屏幕上掉落，你需要在它们到达你面前之前输入](http://zty.pe/)。细微的区别在于将游戏机制从打字改为说话。在我们的游戏中，字母将从屏幕上掉落，玩家需要说出一个以该字母开头的单词来得分、消毁字母并避免某些毁灭。\n\
  \n[{% img center /images/say-what-maddafakka-sketch.jpeg 500 “Say What Maddafakka\
  \ Sketches” “Say What Maddafakka Sketches” %}](http://jsfiddle.net/vintharas/42dbst8g/)\n\
  \n在上一篇文章的末尾，我们完成了一个具有漂亮黑色背景和一些字母从屏幕上掉落的游戏开头。让我们通过 Web Speech API 添加一些玩家交互来继续构建我们的游戏吧！\n\
  \n### Web Speech API\n\n[Web Speech API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API)\
  \ 允许你将语音交互直接纳入 Web 应用程序中。你可以利用 [Speech Synthesis API](https://developer.mozilla.org/en-US/docs/Web/API/SpeechSynthesis)\
  \ 让你的计算机与用户对话，或者利用 [Speech Recognition API](https://developer.mozilla.org/en-US/docs/Web/API/SpeechRecognition)\
  \ 教你的程序听并识别用户，从而实现新颖酷的交互。\n\n在这次黑客松之前，我对 Speech Synthesis API 做过一点实验，但对 Speech Recognition\
  \ 完全没做过任何事情。由于这一点以及黑客松超级无超级超级紧凑的时间表，我选择了最简单的方法，使用 [annyang 库](https://www.talater.com/annyang/)\
  \ 来满足我的语音识别需求。\n\n### 使用 Annyang 收集玩家输入\n\n*[记住你可以在这个 jsFiddle 中测试游戏并获得完整的源代码](http://jsfiddle.net/vintharas/42dbst8g/)*\n\
  \n[annyang 库](https://www.talater.com/annyang/) 提供了一个非常简单的 API 来识别人的语音。你使用文本模式定义\
  \ `commands`，并将这些模式绑定到回调函数。例如，如果你希望你的应用程序在用户说 `cucumber` 时执行某些操作，你可以这样定义一个命令：\n\n\
  ```\n1 var commands = {\n2   'cucumber': _ => console.log('haha he said cucumber')\n\
  3 }\n```\n\n如果你想提取用户语音的一部分，你也可以这样做。想象一下你想点一个带有任意配料的披萨，你可以输入以下：\n\n```\n1 var commands\
  \ = {\n2   'order pizza with *ingredients': ingredients => {\n3       console.log(`the\
  \ user order a pizza with ${ingredients}`)\n4       magicPizza.createOrder(ingredients);\n\
  5    }\n6 }\n```\n\n命令中的 `*ingredients` 部分将被 Speech Recognition API 识别并作为参数传递给你的函数。\n\
  \n在我们特殊的情况下，我们希望能够理解某些单词，稍后将它们与屏幕上掉落的字母进行匹配。例如，如果屏幕上出现一个 `l`，玩家可以开始大喊 `lentils!\
  \ lenses! lotion!` 来消除它并赢得……比比……100 分。\n\n我们可以这样设置一个简单的命令来识别玩家说的任何话：\n\n```\n1 var\
  \ commands = {\n2   '*word': word => {\n3       console.log('user said: ', word);\n\
  4       // TODO: 以某种方式处理玩家单词\n5    }\n6 };\n```\n\n你只需要通过这两简单的代码就可以挂钩命令并启动语音识别：\n\
  \n```\n1 // 将我们的命令添加到 annyang\n2 annyang.addCommands(commands)\n3 \n4 // 开始监听。 \n\
  5 annyang.start()\n```\n\n**但我们如何将其纳入游戏呢？** 我们需要以某种方式将用户输入封装在一个可观测流中。实现这一点有多种方法，但我采用的是\
  \ `Subject`。\n\n`Subject` 是一个特殊的 Rx.js 对象，既是观察者又是可观测流。当它扮演观察者时，它可以订阅其他可观测流，或者推送新值（如玩家发出的单词）。作为可观测流，它可以发射这些值，你可以将其与其他可观测流结合或订阅它。\n\
  \n> ##### 对 Subjects 感奇吗？\n\n> \n\n> 然后[查看 ReactiveX.io 上的这篇文章](http://reactivex.io/documentation/subject.html)。\n\
  \n你可以通过 `Rx.Subject` 函数创建一个 subject：\n\n```\n1 var userWords$ = new Rx.Subject()\n\
  ```\n\n一旦创建，我们就可以更新 `commands` 将值推入 subject 中（利用其观察者属性）：\n\n```\n1 /* VOICE STUFF\
  \ */\n2 var commands = {\n3     '*word': word => {\n4       console.log('user said:\
  \ ', word);\n5       userWords$.onNext(word);\n6    }\n7 };\n```\n\n\n\n现在我们需要将这些单词包含到游戏循环中。每当玩家说出一个单词时，我们希望将该单词与屏幕上掉落的字母进行比较，如果匹配成功，我们就想消除该字母并增加用户的分数。\n\
  \n我们可以创建一个新的观测流 `newWordAndGame$`，用来表示每当用户说出一个新的不同的单词时的游戏状态：\n\n```\n1 var newWordAndGame$\
  \ = game$\n2   .combineLatest(userWords$, (gameObjects, userWord) => {\n3     return\
  \ {gameObjects, userWord}\n4   })\n5   .distinctUntilChanged(o => o.userWord)\n\
  ```\n\n这个新的观测流结合了 `userWords$` 和 `game$` 观测流。如果你忘了这里 `game$` 观测流的样子，这里有一个复习：\n\n\
  ```\n1 var game$ = gameLoop$\n2   .combineLatest(background$, letters$, (_,b,l)\
  \ => {\n3     var gameObjects = [b, ...l]\n4     return gameObjects\n5   })\n```\n\
  \n`distinctUntilChanged` 操作符确保只有当玩家说出一个新单词时才会发射新值。我们可以订阅生成的观测流并执行单词匹配，以查看是否可以从屏幕上消除一个字母并给玩家一些分：\n\
  \n```\n1 newWordAndGame$.subscribe(gameObjectsAndWords => {\n2   matchWords(gameObjectsAndWords);\n\
  3 });\n```\n\n`matchWords` 方法将实现匹配逻辑。它可能像这样：\n\n```\n1 function matchWords({gameObjects,\
  \ userWord}){\n2   console.log(`matching ${userWord} with ${gameObjects.letters.map(l\
  \ => l.letter)}`);\n3   let letterMatched = findLetterMatchingWord(gameObjects,\
  \ userWord)\n4   if (letterMatched){\n5     console.log('matched word')\n6     removeLetter(letterMatched,\
  \ gameObjects)\n7     updateScore(100)\n8   }\n9 }\n```\n\n其中 `findLetterMatchingWord`\
  \ 将检索屏幕上第一个与玩家所说单词开头字母相同的字母（例如，如果玩家说 `violoncello`，那将是 `letters` 数组中的第一个 `v`）：\n\
  \n```\n1 function findLetterMatchingWord(letters, word){\n2   return gameObjects.letters.find(l\
  \ => userWord.toLowerCase().startsWith(l.letter))\n3 }\n```\n\n`removeLetter` 函数将从字母游戏对象集合中移除匹配的字母：\n\
  \n```\n1 function removeLetter(letter, letters){\n2     let idx = letters.indexOf(letter)\n\
  3     letters.splice(idx, 1)\n4 }\n```\n\n而 `updateScore` 函数将更新分数。我们暂时将其留为空空，因为我们的游戏中还没有任何分数：\n\
  \n```\n1 function updateScore(points){\n2     // update score for great justice\n\
  3 }\n```\n\n由于我们需要一种方便的方法来访问游戏对象中的 `letters`（在此阶段 `gameObjects.letters` 属性不存在），我们更新了\
  \ `game$` 观测流来暴露它们：\n\n```\n1 var game$ = gameLoop$\n2   .combineLatest(background$,\
  \ letters$, (_,b,l) => {\n3     var gameObjects = {letters: l, all: [b, ...l]}\n\
  4     return gameObjects\n5   })\n```\n\n这意味着我们必须在 `subscribe` 方法中进行微小的更新以适应新的 API：\n\
  \n```\n1 game$\n2   .subscribe(gameObjects => {\n3     gameObjects\n4       .all\n\
  5       .forEach(g => {\n6         g.update()\n7         g.draw()\n8       })\n\
  9   })\n```\n\n如果你现在运行游戏，你应该能够像玩家一样与其交互。一旦你从浏览器中打开游戏，系统就会提示你*允许*或*拒绝*访问麦克风。允许它，当你看到字母从屏幕上掉落时，说出一个以该字母开头的单词。该字母应该消失。\n\
  \n如果没有发生这种情况，请检查控制台查看是否有错误。你还可以添加视觉帮助，直接在游戏内看到你说出的单词。在你的 html 标记中添加以下元素：\n\n```\n\
  1     <ul class=\"matches\">\n2     </ul>\n```\n\n并更新 `userWordsAndGame$.subscribe`\
  \ 以将说出的单词添加到 `matches` 列表中：\n\n```\n 1 userWordsAndGame$.subscribe((gou) => {\n\
  \ 2   matchWords(gou)\n 3   appendToDom(gou.userWord)\n 4 });\n 5 \n 6 function\
  \ appendToDom(word){\n 7   var ul = document.querySelector('.matches')\n 8   var\
  \ li = document.createElement('li')\n9   li.textContent = word\n10   ul.appendChild(li)\n\
  11 }\n```\n\n现在你应该能够更轻松地验证 Web Speech API 识别的单词或句子，因为它们会出现在画布旁边的。\n\n### 为什么我们没有在原始的\
  \ game$ 观测流中包含 userWords$？\n\n现在你可能在想……为什么我们没有让 `userWords$` 成为 `game$` 观测流的一部分呢，就像我们之前做的那样？\n\
  \n嗯，如果我们这样做，要判断用户何时说了一个单词将变得困难。因为每当组合观测流发射值时，`combineLatest` 都会发射一个值。\n\n### 添加分数\n\
  现在我们有了表示分数的方法，我们需要将其加入游戏。就像我们处理玩家单词一样，我们将创建一个 subject，以便在用户匹配字母时推送新分数：\n\n```\n\
  1 var ScoreSubject = new Rx.Subject()\n```\n\n我们现在可以实现之前的 `updateScore` 方法了：\n\n\
  ```\n1 function updateScore(points){\n2   ScoreSubject.onNext(points)\n3 }\n```\n\
  \n我们将它添加到游戏循环中以便它可以被绘制。为了做到这一点，我们创建了 `score$` 观测流，它接收分数值并将其映射为 `Score` 对象：\n\n```\n\
  1 var score$ = ScoreSubject\n2   .startWith(0)                                 \
  \    \n3   .map(v => new Score(v))                           \n4   .scan((prev,cur)\
  \ => prev.add(cur), new Score(0))\n```\n\n我们使用 `scan` 操作符的方式与系列的第一部分相似，但在这里是为了累积分数。\n\
  \n下一步是将分数包含到游戏循环中：\n\n```\n1 var game$ = gameLoop$\n2   .combineLatest(background$,\
  \ letters$, score$, (_,b,l,s) => {\n3     var gameObjects = {letters: l, all: [b,\
  \ ...l]}\n4     return gameObjects\n5   })\n```\n\n现在如果你启动游戏，你就能在左上角看到一个 `0`。如果你说与屏幕上任何字母匹配的单词，你应该能看到分数是如何增加的。所以说一个单词，你的分数就增加了……200!!!\n\
  \n### 等等……发生了什么奇怪的事？每当我说一个单词都会得到 200 分！什么鬼？？\n\n所以，你希望玩家每说出一个正确的单词分数就增加 100 分，但不知为何，每当你说出一个消除字母的单词时，你都得到了\
  \ 200 分。而且，如果你仔细看，看起来每 2 秒掉下 2 个单词，而不是只有一个。这里发生了什么？\n\n嗯，发生的是我们创建了一个带有两个订阅者的*冷观测流*（cold\
  \ observable），而我们真正想要的是*热观测流*（hot observable）。\n\n冷？热？[什么啥](https://i.ytimg.com/vi/1IkGj5Ghgm4/hqdefault.jpg)！！?\n\
  \n\n\n# 冷热观测流（Cold vs Hot Observables）实现\n\n我们在游戏中创建的观测流类型在 Rx.js 术语中被称为**冷观测流 (cold\
  \ observables)**。冷观测流只有在有人订阅它们时才会开始运行。也就是说，它们是惰性的、死死的，在有人对它们调用 `suscribe` 之前，它们什么都不会做。\n\
  \n此外，**冷观测流推送的值不会在订阅者之间共享**。例如，如果你有一个产生整数序列的冷观测流，并且有两个不同的订阅者，无论他们何时订阅该观测流，整个整数序列都会被推送给这两个订阅者：\n\
  \n```javascript\n 1 // 每 500ms 推送总共 3 个数字\n 2 var cold$ = Rx.Observable\n 3   .interval(500)\n\
  \ 4   .take(3);\n 5   \n 6 cold$.subscribe(value => console.log(`cold 1: ${value}`))\n\
  \ 7 \n 8 // 700 ms 后订阅\n9 setTimeout(_ => \n10   cold$.subscribe(value => console.log(`cold\
  \ 2: ${value}`)), 700);\n11   \n12 // => cold 1: 0\n13 // => cold 1: 1\n14 // =>\
  \ cold 2: 0\n15 // => cold 1: 2\n16 // => cold 2: 1\n17 // => cold 2: 2\n18 \n19\
  \ // 两个订阅者都获得了所有值\n20 // 即使订阅者 2 来晚了\n```\n\n*如果你好奇并想自己动手尝试，可以在 [JsFiddle 中找到这个示例](https://jsfiddle.net/vintharas/qvhpcfyL/)。*\n\
  \n如果你现在已经了解了冷观测流并再次审视我们的游戏，你会发现我们有两个订阅者订阅了 `game$` 观测流。结果是创建的 `letters` 增加了一倍，积累的分数也增加了一倍。\n\
  \n我们希望无论订阅者的数量，都使用相同的序列。我们需要的是一个**热观测流 (Hot observable)**。热观测流与*冷观测流*相反，它们甚至在还没有活跃订阅者之前就会发射值值。你可以通过不同的方法将冷观测流转换为热观测流，在这种情况下，我们将使用\
  \ `share` 操作符。\n\n我们可以修改之前的示例来演示它的用法：\n\n```javascript\n 1 // 每 500ms 推送总共 3 个数字\n\
  \ 2 var hot$ = Rx.Observable\n 3   .interval(500)\n 4   .take(3)\n 5   .share();\n\
  \ 6 \n 7 hot$.subscribe(value => console.log(`hot 1: ${value}`))\n 8 \n 9 // 700\
  \ 毫秒后订阅\n10 setTimeout(_ => \n11   hot$.subscribe(value => console.log(`hot 2: ${value}`)),\
  \ 700);\n12     \n13 // => hot 1: 0\n14 // => hot 1: 1\n15 // => hot 2: 1\n16 //\
  \ => hot 1: 2\n17 // => hot 2: 2\n18     \n19 // 无论订阅者数量，值都会被推送\n20 // 当订阅者 2 订阅时，\n\
  21 // 值 0 已经发射了，因此\n22 // 它错过了这个值\n```\n\n所以！就像在这个例子中，我们可以在 `game$` 观测流中使用 `share`\
  \ 操作符来解决这个问题：\n\n```javascript\n1 var game$ = gameLoop$\n2   .combineLatest(background$,\
  \ letters$, score$, (_,b,l,s) => {\n3     var gameObjects = {letters: l, all: [b,\
  \ s, ...l]}\n4     return gameObjects\n5   })\n6   .share()\n```\n\n现在你应该可以回到游戏，看看一切是如何按照预期运行的了。耶！！！\n\
  \n### 总结\n\n太棒了！现在我们有了一个可以玩的游戏！很酷对吧？\n\n我们在上一篇文章的基础上，通过语音命令增加了玩家交互，并能够通过移除字母和增加玩家分数来影响游戏状态。我们还学习了一些新的\
  \ Rx.js 概念，如**主题 (subjects)** 和**热冷观测流**。\n\n不过还有一些工作没做，首先，游戏永远不会结束。无论屏幕上掉落多少字母，你都可以一直玩，这很糟糕，因为游戏的趣味和刺激之处之一在于你可以失败。\n\
  \n所以，在系列的下一篇文章中，我们将专注于一种表示玩家生命的方法，并为游戏增加一些刺激感。我们将通过添加一些图形、进行一些重构并对整个业务进行反来结束这个系列。\n\
  \n## 你想了解更多关于 Web Speech API 和 Rx.js 吗？\n\n看看这些很棒的文章：\n\n*   [Google Developers\
  \ 的 Web Speech API 简介](https://developers.google.com/web/updates/2013/01/Voice-Driven-Web-Apps-Introduction-to-the-Web-Speech-API?hl=en)\n\
  *   [MDN 的 Web Speech API](https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API)\n\
  *   [更多关于 Subjects](http://reactivex.io/documentation/subject.html)\n*   [更多关于热与冷观测流](https://github.com/Reactive-Extensions/RxJS/blob/master/doc/gettingstarted/creating.md)\n\
  \n[在系列之前的文章中，我们一直在使用 Rx.js 和 Web Speech 构建一个游戏](http://www.barbarianmeetscoding.com/blog/categories/rx-js-game/)。我们大致遵循了我在都柏林的\
  \ Active Solution Spring 会议期间参加 JavaScript 魔法术比赛时所采取的步骤。\n\n*如果你错过了之前的任何文章，请不要犹豫，[从头开始查看](http://www.barbarianmeetscoding.com/blog/2016/04/27/making-a-game-with-rx-dot-js-and-web-speech-at-active-dublin-2016/)！*\n\
  \n在最后一期中，我们将通过通过增加死亡的可能性来增加一些刺激，从而完成我们的游戏。我们还将通过一些样式和图形让游戏更具视觉吸引力，尝试 Web Speech\
  \ Synthesis API，并对整个体验进行简单的反思作为结束。\n\n## 快速回顾\n\n好！让我们快速回顾一下。到目前为止，我们已经构建了一个包含以下元素的游戏：\n\
  \n*   我们有一个游戏循环和实体的概念。\n*   我们有一个背景。\n*   屏幕上掉落的字母。\n*   我们可以说出与字母匹配的单词。\n\n\n\n\
  \n注意我们是如何使用 `takeWhile` 算符包含游戏结束条件的。每当 `takeWhile` 方法中使用的条件不再为真时，`game$` 序列将完成并停止发射值。\n\
  \n如果你现在快速看一眼屏幕，你应该能在屏幕右上角看到你的玩家生命值。但无论你如何仔细看，当字母在屏幕底部消失时，生命值并没有被移除。这就是我们接下来要更新的内容。\n\
  \n我们需要修改游戏，使得每当字母到达底部时，玩家就会失去一条生命。我们在 `subscribe` 方法中实现这一点：\n\n```\n 1 game$\n 2\
  \   .subscribe((gameObjects) => {\n 3     gameObjects\n 4       .all\n 5       .forEach(g\
  \ => {\n 6         g.update()\n 7         g.draw()\n 8       })\n 9     computeLivesLeft(gameObjects);\n\
  10   })\n```\n\n其中 `computeLivesLeft` 负责管理玩家生命值：\n\n```\n1 function computeLivesLeft(gameObjects){\n\
  2   var letters = gameObjects.letters;\n3   var livesLost = letters\n4     .filter(l\
  \ => l.isOutOfBounds())\n5     .length;\n6   gameObjects.player.loseLives(livesLost);\n\
  7   if (livesLost) console.log('lives lost!', livesLost);\n8 }\n```\n\n我们在 `Letter`\
  \ 游戏对象中添加了一个新方法 `isOutOfBounds`：\n\n```\n1 class Letter extends GameObject{\n2 \
  \  constructor(letter, x, y, speed = DEFAULT_SPEED){ //... \n3   update(){ // ...\n\
  4   draw(){ // ...\n5 \n6   isOutOfBounds(){\n7     return this.x > 500 || this.y\
  \ > 500 || this.x < 0 || this.x > 500\n8   }\n9 }\n```\n\n最后，我们在玩家失去生命且 `game$`\
  \ Observable 流完成时显示游戏结束界面（并且为什么不呢，添加一些错误处理）：\n\n```\n 1 game$\n 2   .subscribe((gameObjects)\
  \ => {\n 3     gameObjects\n 4       .all\n 5       .forEach(g => {\n 6        \
  \ g.update()\n 7         g.draw()\n 8       })\n 9     computeLivesLeft(gameObjects);\n\
  10     cleanUp(gameObjects);\n11   }, \n12   (error) => { console.error('ERROR:\
  \ ', error)},\n13   (complete) => drawGameOver())\n```\n\n正如你在上面的摘文中所示，`subscribe`\
  \ 方法[接受三个参数](https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/operators/subscribe.md)：\n\
  \n* `onNext` 回调函数，每当序列发射新值时被调用\n* `onError` 回调函数，当序列由于异常原因（如错误）终止时被调用\n* `onComplete`\
  \ 回调函数，当序列完成（优雅终止）时被调用\n\n`drawGameOver` 函数如下：\n\n```\n 1 function drawGameOver(){\n\
  2     var canvas = document.getElementById(\"game\")\n3     var ctx = canvas.getContext(\"\
  2d\")\n4     ctx.fillStyle = \"#000\"\n5     ctx.fillRect(0,0,500,500)\n6     ctx.fillStyle\
  \ = \"red\"\n7     ctx.fillText('GAME OVER', 150, 240)\n8     ctx.fillText('MOTHERFUCKER',\
  \ 100, 300)\n9     // 无礼的游戏！！！你应该为自己感到羞愧！\n10 }\n```\n\n现在当你运行游戏时，你会看到每当字母到达底部，你就会失去一条生命。快说个词！在你死之前！快！不不不！！\n\
  \n### 添加一些样式和图形\n\n好了，我们现在有一个可以运行的游戏，但它看起来非常糟糕。让我们通过改进样式和添加一些图形让它变得更有吸引力。\n\n我记得在黑客松的最后\
  \ 30 分钟内修复样式，天哪，那确实产生了很大影响。\n\n我们将从添加一种更有趣的字体开始，某种比 `Times New Roman` 更好地突出 `fun`。我们可以从\
  \ [Google Fonts](https://www.google.com/fonts) 中选择任何字体，例如 `Chewy`：\n\n```\n1 <link\
  \ href='https://fonts.googleapis.com/css?family=Chewy' rel='stylesheet' type='te\\\
  \n2 xt/css'>\n```\n\n我们稍微修调一下标记语言：\n\n```\n 1 <section class=\"game-chrome\">\n\
  2   <section class=\"game-surface\">\n3     <h1>\n4     Say What Muddafukaaa!!!!\n\
  5     </h1>\n6     <canvas id=\"game\" width=\"500\" height=\"500\"></canvas>\n\
  7     <ul class=\"matches\">\n8       <!-- test styling -->\n9       <!-- /test\
  \ styling -->\n10     </ul>\n11   </section>\n12 </section>\n```\n\n并添加一些样式：\n\n\
  ```\n 1 body {\n2   background-color: #249D7F;\n3 }\n4 \n5 .game-chrome {\n6   display:\
  \ flex;\n7   justify-content: center;\n8   align-items: center;\n9 }\n10 .game-surface\
  \ {\n11   width: 500px;\n12   height: 500px;\n13 }\n14 h1 {\n15   text-align: center;\n\
  16   font-size: 3em;\n17   font-family: 'Chewy';\n18   color: rgba(241, 234, 22,\
  \ 0.95);\n19 }\n20 canvas {\n21   background-color: black;\n22   display: inline-block;\n\
  23 }\n24 ul {\n25   display: inline-block;\n26   padding: 10px;\n27   list-style:\
  \ none;\n28 }\n29 li:nth-child(odd) {\n30   transform: rotate(-2deg);\n31 }\n```\n\
  \n\n\n\n```\n1 function gameOver(){\n2     // draw game over code...\n3     say('GAME\
  \ OVER MOTHER FUCKER');\n4 }\n```\n\n我们可以将 `drawGameOver` 重命名为 `gameOver`，因为现在我们既进行绘制又进行了语音输出。\n\
  \n如果你对[语音合成 API](https://developer.mozilla.org/en-US/docs/Web/API/SpeechSynthesis)\
  \ 感兴趣，可以继续尝试[使用不同的声音](https://developer.mozilla.org/en-US/docs/Web/API/SpeechSynthesis/getVoices)、音调、速率等……\n\
  \n### 是时候进行清理工作了！\n\n我们忘记做一件事，这与性能和内存管理有关，而这两个都是游戏开发中非常敏感的方面。等等……我现在想起来，这可能导致了游戏中出现一些奇怪的行为……的事实是，我们在无限地创建字母，并且从不清理它们，即使它们离开了屏幕我们再也看不见它们也是如此。\n\
  \n我们将利用 `isOutOfBounds` 方法，并稍微更新我们的 `subscribe` 方法，添加对 `cleanUp` 的调用：\n\n```\n 1\
  \ game$\n 2   .subscribe((gameObjects) => {\n 3     gameObjects\n 4       .all\n\
  \ 5       .forEach(g => {\n 6         g.update()\n 7         g.draw()\n 8      \
  \ })\n 9     computeLivesLeft(gameObjects);\n10     cleanUp(gameObjects);\n11  \
  \ }, \n12   (error) => { console.error('ERROR: ', error)},\n13   (complete) => gameOver())\n\
  ```\n\n在这里，我们移除了到达底部的字母：\n\n```\n1 function cleanUp(gameObjects){\n2   var letters\
  \ = gameObjects.letters;\n3   var lettersToRemove = letters.filter(l => l.isOutOfBounds())\n\
  4   lettersToRemove.forEach(l => {\n5     //console.log('remove out of bounds letter',\
  \ l)\n6     removeLetter(l, letters);\n7   })\n8 }\n```\n\n现在一切都应该运行得完美了。如果我们想进一步进一步优化，可以创建有限数量的\
  \ `Letter` 对象，每当它们到达底部时，将它们返回屏幕顶部并更换不同的字母。\n\n## 结语\n\n我们完成了！耶！（*开心地跳舞庆祝！*）我们使用\
  \ Rx.js 和 Web Speech 在不到 250 行代码内完成了一个小游戏。\n\n在此过程中，我们实验了各种 Rx.js 操作符、订阅者（subjects），学习了热流和冷流（observables）之间的区别，并实验了\
  \ Web Speech API。\n\n扩展我的 Rx.js 能力来尝试用流来创建一个游戏非常有意思。我会用 Rx.js 写一个完整的游戏吗？嗯，我不知道……我没有用传统的\
  \ OOP 写过一个完整的游戏，所以我没有什么可以比较的。不过，这会是一个很有有趣的挑战 :) 我们肯定会有更少的副作用和 Bug，代码库也会更简洁。\n\n\
