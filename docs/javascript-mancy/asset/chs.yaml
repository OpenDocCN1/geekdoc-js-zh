  \n## 练习\n\n* …\n* …\n* …\n\n## Underscore 入门\n\n## JavaScript 中的函数组合\n\n```text\n\
  text text text text text text text,  \ntext text text text text text text,  \ntext\
  \ text text text text text text,  \ntext text text text text text text,  \ntext\
  \ text text text text text text,  \ntext text text text text text text,  \ntext\
  \ text text text text text text,  \ntext text text text text text text.\n\n    \
  \                            - XXXX Xxxxx,\n                                Some\
  \ title, Some time \n```\n\n```javascript\n/* \n  * story \n  *\n  */\n```\n\n###\
  \ 函数式编程核心在于函数\n\n到为止，你已经学习了函数式编程的核心概念：一等函数、高阶函数、纯函数和不可变性。你甚至已经通过在 JavaScript 中使用类似\
  \ LINQ 查询查询应用编程来尝试函数式编程。\n\n下一步是完全沉浸在函数的美世界。在 C# 和其他 OOP 语言中，我们习惯于通过对象创建抽象。同样，函数式编程擅长通过函数在更小的层级创建抽象，因此将函数推向了前端。\n\
  \n让我们重新发现被遗忘的函数艺术吧！\n\n### 被遗忘的函数艺术\n\n我们将从一个例子开始，因为没有比使用一个经典的老例子更能理解新概念的方法了。\n\n\
  想象你拥有一家魔法店，出售各种魔法物品：不可思议的奥术法杖、可以穿透一切的邪恶匕首、能够抵御任何攻击的魔法盔等等。你有一把强大的毁灭之杖，用一个对象表示：\n\n\
  ```javascript\nfunction StaffOfDestruction(){\n  let charges = 1;\n  \n  return\
  \ {\n    destruct(adversary){\n      if (charges > 0) {\n        console.log(`${adversary}\
  \ 突然消散了！！！我的槽，你真硬！`);\n        charges--;\n      } else {\n        console.log(`似乎什么也没有发生...`);\n\
  \      }\n    }\n  };\n}\n```\n\n毁灭之杖是一件强大的装备，可以毁灭你选择的任何目标。但它有一个缺点：只能使用一次。毁灭咒期间释放的强大魔法电流会震碎法杖，使其完全失效。这对它的持有者不利，但对生意很有利。\n\
  \n最近一位不满的顾客来到你的店抱怨，说他误触发了法杖，并毫无用处将其震碎：\n\n```javascript\nconst mightyStaffOfDestruction\
  \ = new StaffOfDestruction();\nmightyStaffOfDestruction.destruct();\n// => undefined\
  \ 突然消散了！！！我的槽，你真硬！\nmightyStaffOfDestruction.destruct('bitter enemy');\n// => 似乎什么也没有发生...\n\
  ```\n\n他想要退款，否则你绝没办法改变他的主意。为了避免未来的投诉，你决定改进法杖的设计，增加一个安全装置，使得法杖只有有目标时才释放 `destruct`\
  \ 咒：\n\n```javascript\nfunction StaffOfDestructionWithLaserScope(){\n  let charges\
  \ = 1;\n  \n  return {\n    destruct(adversary){\n      if (!adversary) return;\n\
  \      \n      if (charges > 0) {\n        console.log(`${adversary} 突然消散了！！！我的槽，你真硬！`);\n\
  \        charges--;\n      } else {\n        console.log(`似乎什么也没有发生...`);\n    \
  \  }\n    }\n  };\n}\n```\n\n完成！你测试了它，它确实如你预期那样工作：\n\n```javascript\nconst laserStaffOfDestruction\
  \ = new StaffOfDestructionWithLaserScope();\nlaserStaffOfDestruction.destruct();\n\
  // => \nlaserStaffOfDestruction.destruct(undefined);\n// =>\nlaserStaffOfDestruction.destruct(null);\n\
  // =>\nlaserStaffOfDestruction.destruct('unsuspecting rodent');\n// => 毫无防备的老鼠突然消散了！！！我的槽，你真硬！\n\
  ```\n\n太棒了！现在你有一种方法防止顾客误触发毁灭之杖了！太棒了！有了这个新设备，你可以给所有的法杖都加上激光准镜！多棒的主意！如果有一种方法可以在所有法杖上复用这段代码就好了……\n\
  \n```javascript\nif (!adversary) return;\n```\n\n嗯，我们可以定义一个 `withLaserScope` 函数来封装该功能：\n\
  \n```javascript\nfunction withLaserScope(spell){\n  return function(target){\n \
  \   if (!target) return;\n    return spell(target);\n  }\n}\n```\n\n// TODO 详细解释一下我们正在做什么\n\
  \n我们现在可以使用该函数为毁灭之杖添加*激光准镜*行为：\n\n```javascript\nfunction StaffOfDestructionWithLaserScopeImproved(){\n\
  \  let charges = 1;\n  \n  return {\n    destruct: withLaserScope(function(adversary){\n\
  \      if (charges > 0) {\n        console.log(`${adversary} 突然消散了！！！我的槽，你真硬！`);\n\
  \        charges--;\n      } else {\n        console.log(`似乎什么也没有发生...`);\n    \
  \  }\n    })\n  };\n}\n\nconst laserStaffOfDestructionImproved = new StaffOfDestructionWithLaserScope();\n\
  laserStaffOfDestructionImproved.destruct();\n// => \nlaserStaffOfDestructionImproved.destruct('unsuspecting\
  \ insect');\n// => 毫无防备的昆虫突然消散了！！！我的槽，你真硬！\n```\n\n或者库存中的任何其他法杖：\n\n```javascript\n\
  const wandOfLightning = {\n  electrocute: withLaserScope((target) => console.log(`${target}\
  \ 被电击了`))\n};\nwandOfLightning.electrocute();\n// =>\nwandOfLightning.electrocute('unsuspecting\
  \ mount');\n// => 毫无防备的坐骑被电击了\n```\n\n\n\n\n让我们停下来，反思一下我们所做的一切。我们把编程中一种非常常见的操作——对\
  \ `null` 或 `undefined` 的检查，并将其封装在一个函数 `withLaserScope` 中，从而创建了一个可以在整个代码中复用的新抽象。我的朋友们，这就是函数式编程。\n\
  \n这种针对 `null` 或 `undefined` 的特定检查在函数式编程圈中通常被称为 `maybe`：\n\n```\n1 function maybe(fn){\n\
  2   return function(arg){\n3     if (!arg) return;\n4     return fn(arg);\n5   }\n\
  6 }\n```\n\n如果你再次审视“毁灭之杖”（`staff of destruction`），发现还有另一个部分可以封装到它自己的函数中：法杖拥有有限次数次数的概念，或者用编程术语来说，就是被有限次数地调用一个函数：\n\
  \n```\n 1 function charges(number, spell){\n 2     var chargesRemaining = number;\n\
  \ 3   return function(target){\n 4     if (chargesRemaining){\n 5       chargesRemaining--;\n\
  \ 6       return spell(target);\n 7     }\n 8   }\n 9 }\n10 /* \n11   如果你现在不想用奇幻风格，也可以将其命名为\
  \ callMaxXTimes n\\\n12 ow:\n13   const callMaxXTimes = charges;\n14 */\n```\n\n\
  同样，我们得到了一个高阶函数，它封装了一个微小的行为：确保一个函数只被调用特定的次数。如果现在现在重构我们的毁灭之杖，我们将得到一个非常具有可读性且声明式的结果：\n\
  \n```\n 1 function SuperStaffOfDestruction(){\n 2   return {\n 3     destruct: charges(1,\
  \ withLaserScope(\n 4       adversary => \n 5         console.log(`${adversary}\
  \ suddenly disintegrates!!!!! Holy shit you're tough\\\n 6 !`)))\n 7   };\n 8 }\n\
  \ 9 \n10 const superStuffOfDestruction = new SuperStaffOfDestruction();\n11 superStuffOfDestruction.destruct('unsuspecting\
  \ stone');\n12 // => unsuspecting stone suddenly disintegrates!!!!! Holy shit you're\
  \ tough!\n13 superStuffOfDestruction.destruct('unsuspecting bottle of ale');\n14\
  \ // =>\n```\n\n你甚至可以通过在 `charges` 之上创建另一个名为 `once` 的抽象来使其变得更加易读：\n\n```\n1 function\
  \ once(spell){\n2   return charges(1, spell);\n3 }\n```\n\n其结果如下：\n\n```\n 1 function\
  \ SuperStaffOfDestruction(){\n 2   return {\n 3     // 确保在存在有效参数时，只能调用一次毁灭法术\n 4\
  \     //\n 5     destruct: once(withLaserScope(\n 6       adversary => \n 7    \
  \     console.log(`${adversary} suddenly disintegrates!!!!! Holy shit you're tough\\\
  \n 8 !`)))\n 9   };\n10 }\n```\n\n你还可以开始这些这些新抽象制作更魔法的物品：\n\n```\n 1 var wandOfFireball\
  \ = {\n 2     // 确保使用这根法杖只能调用两次火球法术\n 3     fireball: charges(2, (adversary) =>\
  \ console.log(`${adversary} is turned to cinde\\\n 4 rs`))\n 5 };\n 6 \n 7 wandOfFireball.fireball('white\
  \ walker');\n 8 // => white walker is turned to cinders\n 9 wandOfFireball.fireball('ghoul');\n\
  10 // => ghoul is turned to cinders\n 11 wandOfFireball.fireball('zombie');\n12\
  \ // =>\n```\n\n让我们快速总结一下到目前为止所做的。在本章的开始，我们拥有一个带有 `destruct` 法术的“毁灭之杖”，可以用它来消灭我们的敌人。它有两个额外的属性：它可以使用一次，并且只有在你有目标时才能激活。我们将这两个独立的行为封装到两个高阶函数中：`withLaserScope`\
  \ 和 `charges`（或者 `maybe` 和 `callMaxXTimes`）。我们将本不是毁灭之杖法术真正一部分、但与它交织在一起的东西提取到函数中，从而使其变成显式且可复用的东西。本质上，我们提取了程序的两种常见规范：`对\
  \ null 的检查`和`能够按特定次数调用函数`，并将它们从方法体内部的隐式内容挖掘出来，变成了一个非常显式的东西——一个函数。我们获得了什么？\n\n* \
  \  一种非常声明式且易读的方法来添加空检查和函数调用策略\n*   一种在程序任何地方复用这些抽象的方法\n*   两个我们可以相互组合的新抽象，甚至可以与未来的抽象组合\n\
  \n除了组合这些抽象外，你还看到了我们如何通过让 `charges` 函数变得更具体来创建一个新的抽象 `once`。我们通过将 `charges` 的第一个参数设置为\
  \ `1` 实现了函数式编程圈中被称为“部分应用”（partial application）的技巧。\n\n### 部分应用\n\n`Partial Application`\
  \ 是一种常见的函数式编程实践，通过固定或关闭原始且更通用的函数的某些参数，来创建更具体的函数。\n\n你在上一节中通过 `charges` 函数看到了这一点，该函数接受两个参数\
  \ `number` 和 `spell`：\n\n```\n1 function charges(number, spell){\n2     var chargesRemaining\
  \ = number;\n3   return function(target){\n4     if (chargesRemaining){\n5     \
  \  chargesRemaining--;\n6       return spell(target);\n7     }\n8   }\n9 }\n```\n\
  \n 使用 使用 Bind 部分应用\n\n在书的开头，你学习了如何使用 `bind` 方法来绑定执行上下文（`this`）。嗯，`bind` 是一个非常有用的方法，因为它允许从左到右对任何函数进行部分应用。\n\
  \n使用 `bind`，我们可以重写之前节节中的函数：\n\n```\n1 const onceWithBind = charges.bind(/* context\
  \ */ null, 1);\n2 const twiceWithBind = charges.bind(/* context */ null, 2);\n3\
  \ \n4 const blessSpell = (target) => console.log(`${target} is blessed (+2 WillPower)`);\n\
  5 const blessOnce = onceWithBind(blessSpell);\n6 blessOnce('daughter');\n7 // =>\
  \ daughter is blessed (+2 WillPower)\n8 blessOnce('hound');\n9 // =>\n```\n\n\n\n\
  \n```javascript\nfunction partialLeft(fn, ...left) {\n  return function(...restOfArguments)\
  \ {\n    return fn.apply(null, [...left, ...restOfArguments]);\n  };\n}\n```\n\n\
  如果你停下来思考一下，你会发现 `bind`、`partialRight` 和 `partialLeft` 都是用于操作和创建新函数的抽象。就像我们将空值检查并将其抽象为函数\
  \ `maybe`一样，这些函数也抽象了“偏函数应用（partial application）”的概念，使我们免于手动操作的麻烦。\n\n也就是说，从手动编写一个\
  \ `once` 函数：\n\n```javascript\nfunction once(spell){\n  return charges(1, spell);\n\
  }\n```\n\n变为：\n\n```javascript\nconst once = partialLeft(charges, 1);\n```\n\n另一种与`partial\
  \ application`非常相关的函数式编程技术是`柯里化（currying）`。\n\n### 柯里化\n\n想象你准备扩大业务，除了出售魔法物品外，你还要提供新的安全和监控服务。你将在每次魔法物品每次被使用时通知购买者来实现。为了做到这一点，我们将创建一个\
  \ `after` 函数，它代表“在魔法物品被使用后执行某事”的概念。在编程术中，就是在我们在物品内部调用 `spell` 函数之后，调用 `doAfter`\
  \ 函数。\n\n这样的 `after` 函数如下所示：\n\n```javascript\n// 在函数被调用后执行某些操作\nfunction after\
  \ (spell, doAfter) {\n  return function castSpellAndDoAfter(...args) {\n    // #1.\
  \ 调用 spell 函数\n    var result = spell.apply(this, args);\n    // #2. 然后调用 doAfter\
  \ 函数\n    doAfter.apply(this, args);\n    // 返回施放法术的结果\n    return result;\n  };\n\
  }\n```\n\n这个新函数允许你创建一个新函数 `castSpellAndDoAfter`，它可以施放任何任意法术，并在之后调用我们选择的函数 `doAfter`。\n\
  \n我们现在可以使用新的 `after` 函数通过这些新的监控服务来增强 `wandOfFireball`（火球术杖）：\n\n```javascript\n\
  function fireballSpell(adversary){\n  console.log(adversary + ' is turned to cinders');\n\
  }\nfunction sendNotification(){\n  console.log(`Your ${this} has been recently used.\
  \ \nIf you haven't used it yourself, \ncontact our nearest Magic Bazaar representative.`);\n\
  }\n\nvar wandOfFireball = {\n  // 确保你使用这根杖只能调用两次火球术\n  fireball: after(fireballSpell,\
  \ sendNotification),\n  toString: function() { return 'Sacred Wand Of Fireball +3\
  \ Magic';}\n};\n```\n\n在这个示例中，我们结合 `after` 函数与 `fireballSpell` 以及 `sendNotification`\
  \ 使用，以达到预期效果，并创建一个能够实时发送通知的火球术增强版本。事实上，我们可以很容易地验证它的运行方式符合你的预期：\n\n```javascript\n\
  wandOfFireball.fireball('vulture');\n// => vulture is turned to cinders\n// => Your\
  \ Sacred Wand Of Fireball +3 Magichas been recently used\n```\n\n编写 `after` 函数的另一种方式是：\n\
  \n```javascript\nfunction afterCurried (doAfter) {\n  return function (fn) {\n \
  \   return function (...args) {\n      var result = fn.apply(this, args);\n    \
  \  doAfter.apply(this, args);\n      return result;\n    };\n  }\n}\n```\n\n// 柯里化示例\
  \ ⇒ after 可以被柯里化\n\n### 使用 Compose 进行组合……\n\n// 组合很多函数，等等\n\n// TODO: 将 after/before\
  \ 向上移动！！\n\n```javascript\n// 在函数被调用后执行某些操作\nfunction after (decoration) {\n  return\
  \ function (fn) {\n    return function () {\n      var result = fn.apply(this, arguments);\n\
  \      decoration.apply(this, arguments);\n      return result;\n    }\n  }\n}\n\
  \n// 当然，你还希望在你使用魔杖时，手机上能收到通知\n// 至少防止有人在你不知情的情况下在使用它\nvar sendNotificationAfter\
  \ = after(function(){\n    console.log('Your ' + this + \" has been recently used.\
  \ If you haven't used it your yourself,\" + \n                \" contact our nearest\
  \ Magic Bazaar representative.\");\n});\n\nvar wandOfFireball = {\n  // 确保你使用这根杖只能调用两次火球术\n\
  \  fireball: sendNotificationAfter(maybe(charges(2, function(adversary){ \n    \
  \  console.log(adversary + ' is turned to cinders');\n  }))),\n  toString: function()\
  \ { return 'Sacred Wand Of Fireball +3 Magic';}\n};\n\nwandOfFireball.fireball('jaime');\n\
  // => jaime is turned to cinders\n// => Your Sacred Wand Of Fireball +3 Magichas\
  \ been recently used\n```\n\n\n\n\n\n```javascript\n\"use strict\";\n\ntry {\n \
  \ delete goat.hitPoints;\n} catch (e) {\n  console.log(e.toString());\n  // => TypeError:\
  \ Cannot delete property 'hitPoints'...\n}\n```\n\n### `Object.freeze` 的注意事项\n\n\
  // 不是深度不可变 // 请自行定义深度不可变性\n\n### 不变性领域的更多对象方法\n\n下面列出了其他与其他与不可变性相关的有趣方法：\n\n| 方法名称\
  \ | 方法描述 |\n| --- | --- |\n| `Object.isFrozen(obj)` | 如果对象被冻结则返回 `true`，否则返回 `false`。\
  \ |\n| `Object.preventExtensions(obj)` | 防止向对象添加新属性 |\n| `Object.isExtensible(obj)`\
  \ | 如果对象可以扩展则返回 `true`，否则返回 `false`。 |\n| `Object.seal()` | 防止删除对象的属性 |\n| `Object.isSealed(obj)`\
  \ | 如果对象被密封则返回 `true`，否则返回 `false`。 |\n\n# 现实应用中的函数式编程\n\n```\ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text,  \ntext text text text\
  \ text text text,  \ntext text text text text text text.\n\n                   \
  \             - XXXX Xxxxx,\n                                Some title, Some time\
  \ \n```\n\n```javascript\n1 /* \n  * story \n3*\n\n  */\n```\n\n### 现实世界中的函数式编程\n\
  \n// TODO\n\n### 进行研究\n\n* * *\n\n## 练习\n\n* * *\n\n# 第四卷：架构与模式\n\n## 使用模块组织你的 JavaScript\
  \ 代码\n\n### IIFE\n\n## 模块模式 暴露模块模式\n\n## CommonJS 模块\n\n### Node.js 和 CommonJS 模块\n\
  \n## Browserify\n\n## AMD 模块 - 异步模块定义\n\n### AMD 基础\n\n## 结合 Require.js 使用 AMD\n\
