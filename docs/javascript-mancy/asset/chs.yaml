  \ | `\"NaNaNa\"` |\n\n## 结语\n\n我们到这里结束！在本章中，你学习了大量关于 JavaScript 字符串的知识，你看到字符串类型与\
  \ C# 非常相似。它们是不可变的，对它们进行任何形式的操作都会产生新的字符串。\n\n字符串的行为非常像类数组对象，虽然它们没有数组方法，但你可以通过 `call`\
  \ 和 `apply` 对它们应用非数组方法。此外，ES6 引入了新的字符串方法如 `startsWith` 和 `endsWith`，但更重要的是它以模板字符串的形式引入了处理字符串的新方式。标签是模板字符串的绝佳伙伴，允许你自定义模板字符串解析为字符串的方式，为\
  \ JavaScript 中的文本处理开启了无限可能。\n\n## 练习\n\n\n\n\n\n*   在实用函数模式：多参数 中，你了解了**剩余参数**（rest\
  \ parameters）。它们的工作方式就像 C# 中的 `params`，允许你定义可以接收任意数量参数的函数。\n*   在论召唤仆人和奇生物的艺术，或理解\
  \ JavaScript 对象的基础 中，你发现了 ES6 如何通过简写语法（同时适用于属性和方法）简化对象初始化器。你还学习了 ES6 *符号*（symbols）以及它们如何如何帮助你处理数据隐私。\n\
  *   在字符串指南：寻找合适的词汇和正确的拼读语调 中，你深入研究了 ES6 模板字符串（Template Literals），并学习了它们如何改变我们在 JavaScript\
  \ 中处理字符串的方式。你还查看了标签和新的字符串方法。\n\n在本章及后续章节中，我们将介绍其他其他强大的 ES6 特性，你可以在日常 JavaScript\
  \ 中使用它们：解构、箭头函数和展开运算符。是时候将你的 JavaScript 魔法术升级到 ES6 了！\n\n### 解构一切！\n\nES6 提供了一个非常实用的新特性，叫做*解构*（destructuring）。*解构*让你能够以非常自然且简洁的方式从对象和其他数据结构中提取部分信息。\n\
  \n### 对象解构\n\n在最简单的用法中，你可以使用以下语法从对象的属性初始化变量：\n\n```\n1 let pouch = {coins: 10};\n\
  2 let {coins} = pouch;\n```\n\n这等同于：\n\n```\n1 let coins = pouch.coins;\n```\n\n\
  在真实世界的示例中使用*解构*并没有什么不同。想象你有一个渴望提高 JavaScript 技能的西里亚蛮人。我们称他为 `conan`：\n\n```\n 1\
  \ let conan = {\n 2         firstName: 'Conan',\n 3         lastName: 'the barbarian',\n\
  \ 4         height: 178,\n 5         weight: 90,\n 6         email: 'conan.thecimmerian@akilonia.com',\n\
  \ 7         toString() {\n 8             return this.firstName;\n 9         }\n\
  \ 10     };\n```\n\n我们可以创建一个 `javascriptmancyCourse` 对象，允许任何人（而不仅仅是蛮人）通过一个实用的 `signUp`\
  \ 方法来学习一些 JavaScript：\n\n```\n 1 let javascriptmancyCourse = {\n 2     signUp(person){\n\
  \ 3       let {firstName, lastName} = conan;\n 4       console.log(`Thank you ${firstName},\
  \ ${lastName}!! \n 5 You have successfully signed up to our very special JavaScript\
  \ course!\n 6 Welcome and prepare to learn some JavaScript!`);\n 7 }};\n 8 \n 9\
  \ javascriptmancyCourse.signUp(conan);\n10 // => Thank you Conan, the barbarian!!\
  \ You have succesfully signed up to\n11 //    our very special JavaScriptmancy course!\
  \ Welcome and prepare to\n12 //    learn some JavaScript!\n```\n\n`let {firstName,\
  \ lastName} = conan` 让我们能够从 `conan` 对象中提取必要的信息，并在一个简洁的单语句中准备好进行处理。如果你喜欢编写漂亮的代码，没有比这更更好的了。\n\
  \n而且还有更多！你不限于使用与原始对象中属性名称完全相同的变量。你可以利用稍微高级一点的*解构*语法将对象属性映射到不同的变量：\n\n```\n1 let\
  \ { lastName:title } = conan;\n```\n\n这等同于：\n\n```\n1 let title = conan.lastName;\n\
  ```\n\n因此，`lastName` 是*源*属性的名字，而 `title` 是*目标*变量的名字。此外，如果你尝试提取源对象中不存在的属性，新创建的变量将为\
  \ `undefined`：\n\n```\n1 // let pouch = {coins: 10};\n2 let {bills} = pouch;\n3\
  \ console.log(bills);\n4 // => undefined\n```\n\n为了防止这种情况发生，你可以在使用*解构*语法的同时使用默认值。通过这种强大的组合，如果对象没有指定的属性，你的变量仍然会获得默认值，而不是\
  \ `undefined`：\n\n```\n1 // let pouch = {coins: 10};\n2 let {bills=10} = pouch;\n\
  ```\n\n如上所示，在*解构*中使用默认值将确保你永远不会穷，即使那些幻幻的 `10` 元钞票不在你的 `pouch`（袋子）中也能享受它们。魔法！\n\n\
  *解构*的另一个强大特性是提取位于对象深处的属性的能力。想象你拥有那种带有无限口袋的有用包子，你想去拿你的烟袋：\n\n```\n1 let bag = { \n\
  2     leftPocket: {\n3         tobaccoPouch: ['pipe', 'tobacco']\n4     }, \n5 \
  \    rightPocket: [pouch],\n6     interior: ['10 pieces of dried meat', 'toilet\
  \ paper', 'leprechaun']\n7 };\n```\n\n嗯，你可以使用解构创建一个新的 `tobbacoPouch` 变量。简单如此：\n\n\
  ```\n1 let {leftPocket: {tobbacoPouch}} = bag;\n2 \n3 console.log(`Let's see what\
  \ I've got in my tobaccoPouch: ${tobaccoPouch}`);\n4 // => Let's see what I've got\
  \ in my tobaccoPouch: pipe,tobacco\n```\n（注：原文中 `tobbacoPouch` 拼写错误，此处保留或根据上下文逻辑处理）\n\
  \n我们可以通过解构创建一个 `tobbacoPouch` 变量。简单如此：\n\n```\n1 let {leftPocket: {tobbacoPouch}}\
  \ = bag;\n2 \n3 console.log(`看看我的烟袋里到底有什么：${tobaccoPouch}`); // 注：此处为演示逻辑，代码内部不翻译\n\
  4 // => 看看我的烟袋里到底有什么：pipe,tobacco\n```\n*抱歉，根据指令，代码块不翻译。此处重新提供该部分的正确翻译输出：*\n\n```\n\
