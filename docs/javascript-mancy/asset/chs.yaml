  \n突然间，我想起了那些打字游戏，单词从屏幕顶部出现并缓慢移动。核心是在单词到达底部之前输入它们，否则你就会死亡并消失在虚无中。如果你输入正确，单词就会被消除，你将获得积分并继续战斗生存。随着游戏的进行，单词出现的频率越高，滚动速度也越越快，直到它们将你淹没并带来你的终结。\n\
  \n[{% img center /images/say-what-maddafakka-sketch.jpeg 500 “Say What Maddafakka\
  \ Sketches” “Say What Maddafakka Sketches” %}](http://jsfiddle.net/vintharas/42dbst8g/)\n\
  \n\n\n是的！我正打算构建那样的东西，但使用的是语音而不是键盘。我的主意是开始大喊用给定字母开头的单词，然后可能添加更多复杂的层次，结合字母、短语、速度等。\n\
  \n太棒了，我终于为这个黑马拉松想出了主意……燥起来吧！\n\n### 看看这个 Rx.js 介绍\n\n如果你以前没有用过 Rx.js，那么在继续阅读之前，你可能想看看[这个解释了一些基础知识的介绍](http://www.barbarianmeetscoding.com/blog/2016/04/11/getting-started-with-rx-dot-js/)。如果你喜欢挑战极限，请继续吧，我那冒险的朋友。\n\
  \n### 一一步步构建游戏 - 第一部分\n\n*这篇文章的所有代码都在这个 [jsFiddle](http://jsfiddle.net/vintharas/42dbst8g/)\
  \ 中。请注意，这是周末会议-酒精-黑马拉松级别的代码。请预料会有代码重复和不一致的情况 :P*\n\n所以！鉴于时间非常紧，我的首要任务是尽快在屏幕上显示一些东西。我选择使用\
  \ [jsFiddle](http://jsfiddle.net/vintharas/42dbst8g/) 来编写游戏，这样在黑马拉松结束时就可以于演示和分享。\n\
  \n我决定从黑色背景和一些字母以固定的间隔从屏幕上掉落开始。为了实现这一点，我需要创建一个类的微型游戏引擎，并唤醒我有限的游戏开发知识（来自[这里](http://www.barbarianmeetscoding.com/Serenity/)、这里](http://www.barbarianmeetscoding.com/projects/war-of-the-orbs/)\
  \ 和[那里](http://www.barbarianmeetscoding.com/blog/2013/10/16/barbaric-october-writing-a-ios-game-with-spritekit/)）。\n\
  \n如果你以前没有涉足这些领域，让我们来看游戏开发的简单化版本和一个示例游戏引擎。\n\n#### 游戏开发的简要介绍\n\n在编程术语中，游戏由包含以下步骤的无限循环组成：\n\
  \n1. 收集用户输入，\n2. 根据该输入更新游戏状态\n3. 绘制所有内容\n\n这通常被称为……坐稳了……（阴森的声音）**游戏循环**。\n\n除了实现游戏循环外，你还需要一种方法来表示运行在游戏中的不同实体，比如玩家本身、背景、敌人、得分等。你通过使用通常称为\
  \ `GameObject` 的抽象来表示这些实体。一个 `GameObject` 通常有一个 `update` 和 `draw` 方法。`update` 方法根据玩家输入、之前的交互或其他游戏逻辑更新游戏对象的状态，而\
  \ `draw` 方法则将其绘制到屏幕上。\n\n此外，你通常将游戏划分为一组 `Scenes`（场景）。每个 `Scene` 允许你对进行分组并管理在任何给定时间点向玩家显示并与之交互的游戏对象集合。\n\
  \n一个只有一个场景的简单游戏，其游戏循环可能如下：\n\n```\n1 -> every game loop interval\n2 ----- gather\
  \ user input\n3 ----- FOR every game object in this Scene DO\n4 --------- update\
  \ game object\n5 --------- draw game object\n```\n\n#### 在 Rx.js 中实现游戏循环\n\n现在，让我们尝试在\
  \ Rx.js 中重创建这个。如果你仔细思考，无限循环可以被看作是执行某项操作事件的无限序列。由于我们希望这个序列在特定的间隔内执行游戏循环，我们使用 `Rx.Observable.interval`。\n\
  \n```\n1 const INTERVAL_GAME = 16; // 60 fps => 16 ms\n2 var gameLoop$ = Rx.Observable.interval(INTERVAL_GAME);\n\
  ```\n\n现在我们要在那个无限循环中设置我的背景。所以我们创建一个 `GameObject` 来表示一个可以绘制到屏幕上的游戏对象。这个游戏对象在二维空间中有位置，并在移动时有一个速度：\n\
  \n```\n1 class GameObject {\n2   constructor(x,y,speed){\n3     this.x = x\n4  \
  \   this.y = y\n5     this.speed = speed\n6   }\n7   update(){}\n8   draw(){}\n\
  9 }\n```\n\n然后我们创建一个 `Background` 对象来表示我游戏的实际背景：\n\n```\n1 class Background extends\
  \ GameObject {\n2   constructor(){\n3     super(0,0,0) // positioned at 0,0\n4 \
  \  }\n5   draw(){ \n6       // to implement\n7   }\n8 }\n```\n\n为了绘制 `Background`\
  \ 和游戏本身，我们需要在 HTML 标记中放置一个 `canvas`：\n\n```\n1 <canvas id=\"game\" width=\"500\"\
  \ height=\"500\"></canvas>\n```\n\n现在我们有了 `canvas`，我们就可以使用它的原始图形在背景 `draw` 方法被调用时绘制一个黑色矩形：\n\
  \n```\n 1 class Background extends GameObject {\n 2   constructor(){\n 3     super(0,0,0)\
  \ // positioned at 0,0\n 4   }\n 5   draw(){ \n 6     var canvas = document.getElementById(\"\
  game\")\n 7     var ctx = canvas.getContext(\"2d\")\n 8     ctx.fillStyle = \"#000\"\
  \n 9     ctx.fillRect(0,0,500,500)\n10   }\n```\n\n\n现在我们必须决定如何将这些字母引入游戏中。让我们想一下……我们希望字母每隔一段时间从屏幕上掉落，这听起来像是某种间隔。假设我们希望每\
  \ 2 秒出现一个新字母。我们可以通过一个新的 `letters$` 可观测流来表示：\n\n```\n1 const INTERVAL_WORD = 2000\n\
  2 var letters$ = Rx.Observable\n3   .interval(INTERVAL_WORD)\n```\n\n但我们需要一种方法将这些间隔转换为实际字母：\n\
  \n```\n1 var letters$ = Rx.Observable\n2   .interval(INTERVAL_WORD)\n3   .map(_\
  \ => new Letter(getRandomLetter(), getRandomPosition(0,500), 0))\n```\n\n`getRandomLetter`\
  \ 和 `getRandomPosition` 只是一些辅助方法，用于获取任意字母并将其放置在屏幕的任意位置：\n\n```\n1 function getRandomLetter()\
  \ {\n2   var letter = String.fromCharCode(97 + Math.floor(Math.random() * 26))\n\
  3   return letter\n4 }\n5 \n6 function getRandomPosition(min, max){\n7   return\
  \ Math.floor(Math.random()*max - min)\n8 }\n```\n\n我们还想在游戏中保留这些字母，将它们累积起来直到玩家说出一个单词或者字母直接掉出屏幕。\n\
  \n为了实现这一点，我们将使用 `scan` 运算符，它的作用类似于 `Array.prototype.reduce`，并对流中的现有项应用 `reduce`：\n\
  \n```\n1 var letters$ = Rx.Observable\n2   .interval(INTERVAL_WORD)\n3   .map(_\
  \ => new Letter(getRandomLetter(), getRandomPosition(0,500), 0))\n4   .scan((letters,\
  \ newLetter) => {\n5   \tletters.push(newLetter)\n6     return letters\n7   }, [])\n\
  ```\n\n如果用大理石图来表示，它看起来像这样：\n\n```\n1 interval    --------0--------1--------2-------->\n\
  2 map         --------l--------l--------l-------->\n3 scan        --------[l]------[l,l]----[l,l,l]-->\n\
  ```\n\n这意味着我们每 2 秒在数组中累积一次字母。剩下的工作是将它们包含在我们的 `game$` 可观测流中并加入游戏中：\n\n```\n1 var\
  \ game$ = gameLoop$\n2   .combineLatest(background$, letters$, (_,b,l) => {\n3 \
  \    var gameObjects = [b, ...l]\n4     return gameObjects\n5   })\n```\n\n搞定！你应该能看到屏幕上每\
  \ 2 秒出现一个字母，并向下移动，直到它们离开屏幕。\n\n### 第一部分总结\n\n再次，这篇文章写得比我预想的要长得多，因此我们将它分成几篇文章。\n\n\
  在第一个分段中，你学习了如何在 Rx.js 中实现游戏引擎的基础知识，包括一个基础的游戏循环以及一种表示游戏对象、更新其状态并在屏幕上绘制它们的方法。在在此过程中，你还学习了\
  \ `combineLatest` 和 `scan` 运算符。我们现在有了一个游戏的开头，显示背景和向屏幕下方移动的字母。\n\n接下来，我们将继续使用 Web\
  \ Speech API 收集一些用户输入，这些输入将影响我们的游戏并为我们赢得奖励。\n\n无论如何，[你可以在这个 jsFiddle 中找到完整的源代码](http://jsfiddle.net/vintharas/42dbst8g/)，如果你感兴趣，请尽管自己尝试。\n\
