  17   ],\n18   providers: [PeopleService],\n19   bootstrap: [AppComponent]\n20 })\n\
  21 export class AppModule { }\n```\n\n### 在应用中启用 Http 模块\n\nhttp 模块位于 Angular 核心分离文件中，它依赖于\
  \ [RxJS 库](http://reactivex.io/)，我们稍后会看到。这意味着你可以使用任何其他 http 库来消费服务。\n\n因为[我们使用了\
  \ Angular cli 来启动应用](https://www.barbarianmeet.com/blog/2016/03/25/getting-started-with-angular-2-step-by-step-1-first-component/)\
  \ 模块和 `rxjs` 已经添加到项目中并可以就绪使用。\n\n### 让我们开始使用 Http 模块从互联网获取内容吧！\n\n\n\n\n\nAngular\
  \ 的 http 模块 `@angular/http` 暴露了一个 `Http` 服务，我们的应用程序可以使用它通过 HTTP 访问网络服务。我们将在 `PeopleService`\
  \ 服务中使用这个奇妙的工具。我们首先导入它，以及进行 http 请求时涉及的所有类型：\n\n```\n1 import { Http, Response }\
  \ from '@angular/http';\n2 import { Observable } from 'rxjs/Observable';\n3 import\
  \ 'rxjs/add/operator/map';\n```\n\n什么？除了 `Http` 之外，我们还导入了那些东西全是什么？这些都是使用 Angular\
  \ 向网络服务发送并处理 HTTP 请求时所需的类型和相关内容：\n\n- `Http` 是一个 Angular 服务，提供了发送 HTTP 请求的 API，其方法与\
  \ HTTP 动词（如 `get`、`post`、`put` 等对应。\n- `Response` 是一个类型，代表 HTTP 服务的响应，并遵循 [fetch\
  \ API 规范](https://fetch.spec.whatwg.org/#response-class)。\n- `Observable` 是 Angular\
  \ 中使用的异步模式。可观测的概念源于[观察者设计模式](https://en.wikipedia.org/wiki/Observer_pattern)，它作为一个对象在发生有趣事件时通知感兴趣的观察者（observers）。在\
  \ RxJS 中，它被泛化为管理数据序列或事件序列（也称为 `streams`），以便与其他可观测对象组合组合，并提供了许多被称为操作符（operators）的实用函数，让你实现惊不起的功能。\n\
  - `rxjs/add/operator/map` 指的是 `rxjs` 的 `map` 操作符。`rxjs` 是一个非常大的库，包含大量的操作符和特性。最佳实践是只导入你需要的\
  \ `rxjs` 部分，这就是为什么我们开始时只导入了 `map` 操作符（最常用的操作符之一）。\n\n我知道，我知道，有很多新概念，但先不要放弃，请耐心听我说，很快就会解释清楚的！\n\
  \n在导入必要的项后，我们可以通过构造函数在 `PeopleService` 内部注入 `Http` 服务：\n\n```\n1 @Injectable()\n\
  2 export class PeopleService{\n3   constructor(private http : Http){\n4   }\n5 \
  \  // other methods...\n6 }\n```\n\n好了！现在我们已经已经在 `PeopleService` 中注入了 `Http` 服务，我们可以用它来获取那些讨厌的星大战角色。我们将像这样更新\
  \ `getAll` 方法：\n\n```\n 1 Injectable()\n 2 export class PeopleService{\n 3   private\
  \ baseUrl: string = 'http://swapi.co/api';\n 4   constructor(private http : Http){\n\
  \ 5   }\n 6 \n7   getAll(): Observable<Person[]>{\n 8     let people$ = this.http\n\
  \ 9       .get(`${this.baseUrl}/people`, {headers: this.getHeaders()})\n10     \
  \  .map(mapPersons);\n11       return people$;\n12   }\n13 \n14   private getHeaders(){\n\
  15     // 我包含了这些头，否则 FireFox\n16     // 会请求 text/html 而不是 application/json\n17 \
  \    let headers = new Headers();\n18     headers.append('Accept', 'application/json');\n\
  19     return headers;\n20   }\n21 \n22   // other code...\n23 }\n```\n\n如果你过去用过\
  \ AngularJS 的 `http` 服务，或者你习惯于使用 promises，那么这段代码看起来可能极其诡异。**`map` 在那里是干什么的？我的 `then`\
  \ 在哪儿？谁移动了我的奶酪？**\n\n嗯，`http.get` 方法向星大战 API 发起一个 `GET` 请求并返回一个 `Observable<Response>`（而不是你可能预期的\
  \ `Promise`）。`Observable<Response>` 可以被描述为随时间变化的响应序列，尽管在这种特定情况下，它将是单个响应的序列。\n\n\
  将其视为随时间变化的响应序列或集合，那么使用像 `map` 这样的方法来转换该序列中的项（就像我们对 `Array.prototype.map` 所做的那样）转换为更类似于应用程序领域模型的内容（例如人物）会更有意义。\n\
  \n如果我们这样想，可以如下定义 `mapPersons` 函数，将一个 `Response` 转换为人物数组：\n\n```\n 1 function mapPersons(response:Response):\
  \ Person[]{\n 2    // API 的响应有一个 results\n 3    // 属性，其中包含实际结果\n 4    return response.json().results.map(toPerson)\n\
  \ 5 }\n 6 \n 7 function toPerson(r:any): Person{\n 8   let person = <Person>({\n\
  \ 9     id: extractId(r),\n10     url: r.url,\n11     name: r.name,\n12     weight:\
  \ Number.parseInt(r.mass),\n13     height: Number.parseInt(r.height),\n14   });\n\
  15   console.log('Parsed person:', person);\n16   return person;\n17 }\n18 \n19\
  \ // 为了避免破坏应用程序的其他部分\n20 // 我从人物 url 中提取 id\n21 // 这是因为星大战 API 没有 id 字段\n22 function\
  \ extractId(personData:any){\n23  let extractedId = personData.url.replace('http://swapi.co/api/people/','').replace(\\\
  \n24 '/','','');\n25  return parseInt(extractedId);\n26 }\n```\n\n由于现在我们的 `getAll`\
  \ 方法返回一个 `Observable<Person[]>`，我们破坏了之前为应用程序其他部分提供的契约，因此需要更新 `PeopleListComponent`。你如何解包这个\
  \ `Observable<Person[]>` 数组？你可以这样 `subscribe` 它：\n\n```\n[content]\n\n\n\n\n这里是完整的\
  \ `people.service.ts`，以便于参考：\n\n```typescript\n 1 import { Injectable } from '@angular/core';\n\
  \ 2 import { Http, Response, RequestOptions, Headers } from '@angular/http';\n 3\
  \ \n 4 import { Observable } from 'rxjs/Observable';\n 5 import 'rxjs/add/operator/map';\n\
  \ 6 \n 7 import { Person } from './person';\n 8 \n 9 const PEOPLE : Person[] = [\n\
  10       {id: 1, name: 'Luke Skywalker', height: 177, weight: 70},\n11       {id:\
  \ 2, name: 'Darth Vader', height: 200, weight: 100},\n12       {id: 3, name: 'Han\
  \ Solo', height: 185, weight: 85},\n13     ];\n14 \n15 @Injectable()\n16 export\
  \ class PeopleService{\n17   private baseUrl: string = 'http://swapi.co/api';\n\
  18 \n19   constructor(private http : Http){}\n20 \n21   getAll(): Observable<Person[]>{\n\
  22     let people$ = this.http\n23       .get(`${this.baseUrl}/people`, { headers:\
  \ this.getHeaders()})\n24       .map(mapPersons);\n25       return people$;\n26\
  \   }\n27 \n28   private getHeaders(){\n29     // 我包含了这些 headers，否则 FireFox\n30\
  \     // 将请求 text/html\n31     let headers = new Headers();\n32     headers.append('Accept',\
  \ 'application/json');\n33     return headers;\n34   }\n35   get(id: number): Observable<Person>\
  \ {\n36     let person$ = this.http\n37       .get(`${this.baseUrl}/people/${id}`,\
  \ {headers: this.getHeaders()})\n38       .map(mapPerson);\n39       return person$;\n\
  40   }\n41 \n42   save(person: Person) : Observable<Response>{\n43     // 这并不会实际生效，因为\
  \ StarWars API \n44     // 是只读的。但看起来应该是这样的：\n45     return this\n46       .http\n\
  47       .put(`${this.baseUrl}/people/${person.id}`, \n48             JSON.stringify(person),\
  \ \n49             {headers: this.getHeaders()});\n50   }\n51 \n52 }\n53 \n54 \n\
  55 function mapPersons(response:Response): Person[]{\n56   // API 的响应包含一个 results\
  \ \n57   // 属性，其中包含实际的结果\n58   return response.json().results.map(toPerson)\n59\
  \ }\n61 \n61 function toPerson(r:any): Person{\n62   let person = <Person>({\n63\
  \     id: extractId(r),\n64     url: r.url,\n65     name: r.name,\n66     weight:\
  \ Number.parseInt(r.mass),\n67     height: Number.parseInt(r.height),\n68   });\n\
  69   console.log('Parsed person:', person);\n70   return person;\n71 }\n72 \n73\
  \ // 为了避免破坏我们应用的其他部分\n74 // 我从人的 url 中提取 id\n75 function extractId(personData:any){\n\
  76   let extractedId = personData.url.replace('http://swapi.co/api/people/','').replace\\\
  \n77 ('/','');\n78   return parseInt(extractedId);\n79 }\n80 \n81 function mapPerson(response:Response):\
  \ Person{\n82    // toPerson 看起来和之前的示例一样\n83    return toPerson(response.json());\n\
  84 }\n```\n\n最后！我们的整个应用程序都在消费一个真实的 Web 服务，并获取真实数据进行显示。耶！\n\n但是……当出现错误响应时会发生什么？\n\
  \n### 使用 Observables 进行错误处理\n\nObservables 就像 `Promises` 一样，提供了一种直接处理错误的方法。由于 `PeopleService`、`PersonDetailsComponent`\
  \ 和 `PeopleListComponent` 工作在两个不同的抽象层级（一个处理 HTTP 请求和响应，另一个处理领域模型对象），我们将有两个层级的错误处理。\n\
  \n第一级错误处理发生在服务层级，处理在 HTTP 请求时可能发生的问题。在这个简单的应用中，它将记录错误并转换为应用程序级别的错误。我们首先从 `rxjs`\
  \ 导入 `catch` 算符和 `throw` 方法，如下：\n\n```typescript\n1 import 'rxjs/add/operator/catch';\n\
  2 import 'rxjs/add/observable/throw';\n```\n\n现在我们在我们的 `rxjs` 流中使用它们。具体来说：\n\n-\
  \ 我们使用 `catch` 来处理流中的错误 \n- 我们使用 `throw` 在更高层级的抽象级上抛出一个新错误\n\n看下文 `catch` 如何允许我们拦截流中的错误：\n\
  \n```typescript\n 1 Injectable()\n 2 export class PeopleService{\n 3   // 代码省略 ...\n\
  \ 4 \n 5   getAll(): Observable<Person[]>{\n 6     let people$ = this.http\n 7 \
  \      .get(`${this.baseUrl}/people`, { headers: this.getHeaders()})\n 8       .map(mapPersons)\n\
  \ 9       .catch(handleError);  // 这里：这是新的！\n10       return people$;\n11   }\n\
  \ 12 \n 13   // 更多代码...\n 14 \n 15   get(id: number): Observable<Person> {\n 16\
  \     let person$ = this._http\n 17       .get(`${this.baseUrl}/people/${id}`, {headers:\
  \ this.getHeaders()})\n 18       .map(mapPerson)\n 19       .catch(handleError);\
  \  // 这里：这是新的！\n 20       return person$;\n 21   }\n 22 \n 23 }\n```\n\n而 `throw`\
  \ 让我们将新错误推向我们的应用程序：\n\n```typescript\n 1 // 这也可以组件类的一个私有方法\n 2 function handleError\
  \ (error: any) {\n 3   // 记录错误\n 4   // 可以是更复杂的\n 5   let errorMsg = error.message\
  \ || `哎呀！我们的超速驱动器设备\\\n 6 有问题，我们无法检索您的数据!`\n 7   console.error(errorMsg);\n 8  \
  \ return Observable.throw(errorMsg);\n 9 }\n```\n\n第二级错误处理发生在应用程序级，位于组件内部：\n\n```typescript\n\
  \ 1 @Component({\n 2   selector: 'people-list',\n 3   template: `\n 4     <ul>\n\
  \ 5       <!-- 这是 ng-repeat 的新语法 -->\n 6       <li *ngFor=\"let person of people\"\
  >\n 7           <a [routerLink]=\"['persons', person.id]\">\n 8             {{person.name}}\n\
  \ 9           </a>\n10       </li>\n 11     </ul>\n12     <!-- 这里：添加了错误消息 -->\n\
  13     <section *ngIf=\"errorMessage\">\n14       {{errorMessage}}\n15     </section>\n\
  16   `\n 17 })\n18 export class PeopleListComponent implements OnInit{\n19   people:\
  \ Person[] = [];\n20   errorMessage: string = '';\n21 \n22   constructor(private\
  \ peopleService : PeopleService){ }\n23 \n24   ngOnInit(){\n25     this.peopleService\n\
  26       .getAll()\n27       .subscribe(\n28          /* 成功路径 */ p => this.people\
  \ = p,\n29          /* 错误路径 */ e => this.errorMessage = e);\n30   }\n31 }\n```\n\
  \n我们使用 `subscribe` 方法的第二个参数来订阅错误并向用户显示错误。\n\n此外，`subscribe` 方法允许你定义第三个参数 `onComplete`，在请求顺利完成时执行。我们可以用它来切换进度条或\
  \ `loading` 消息：\n\n```typescript\n 1 import { Component, OnInit } from '@angular/core';\n\
  \ 2 import { Person } from './person';\n 3 import { PeopleService } from './people.service';\n\
  \ 4 \n 5 @Component({\n 6   selector: 'people-list',\n 7   template: `\n 8     <!--\
  \ 这里！进度条！！ -->\n 9     <section *ngIf=\"isLoading && !errorMessage\">\n10     加载我们的超速器！！！正在检索数据...\n\
  11     </section>\n12     <ul>\n13       <!-- 这里是 ng-repeat 的新语法 -->\n14       <li\
  \ *ngFor=\"let person of people\">\n15           <a [routerLink]=\"['persons', person.id]\"\
  >\n16             {{person.name}}\n17           </a>\n18       </li>\n 19     </ul>\n\
  20     <section *ngIf=\"errorMessage\">\n21       {{errorMessage}}\n22     </section>\n\
  23   `\n 24 })\n25 export class PeopleListComponent implements OnInit{\n26   people:\
  \ Person[] = [];\n27   errorMessage: string = '';\n28   isLoading: boolean = true;\n\
  29 \n30   constructor(private peopleService : PeopleService){ }\n31 \n32   ngOnInit(){\n\
  33     this.peopleService\n34       .getAll()\n35       .subscribe(\n36        \
  \  /* 成功路径 */ p => this.people = p,\n37          /* 错误路径 */ e => this.errorMessage\
  \ = e,\n38          /* onComplete */ () => this.isLoading = false);\n39   }\n40\
  \ }\n```\n\n我们可以通过在 `PeopleService` 中模拟一个问题，来测试我们的错误处理将如何工作。让我们让我们在 `mapPersons`\
  \ 函数中抛出一个错误（你也可以将 API 资源名称拼错为 `potato` 来获取 HTTP 404 not found 错误，但我觉得力场喉要酷得多）：\n\
  \n\n\n\n\n```javascript\nfunction mapPersons(response:Response): Person[]{\n   throw\
  \ new Error('ups! Force choke!');\n\n   // The response of the API has a results\n\
  \   // property with the actual results\n   // return response.json().results.map(toPerson)\n\
  }\n```\n\n现在查看浏览器中的你的应用（如果还没有运行，请运行 `ng serve`），你将看到控制台和 UI 都显示了以下消息：`ups! Force\
  \ choke!`（如果你拼错了 API 资源的名称，你会在控制台中看到一个 404 错误——这是一个低抽象层面的错误——而在屏幕上会看到一个人类可读的错误“哎呀！我们的超空间驱动设备出了问题，我们无法检索您的数据！”*）。\n\
  \n太棒了！现在你可以移除这个虚假的错误并继续下下了……如果我们可以在《星球大战》人物可用时直接将他们推送到模板中，那不是很好吗？而不需要手动调用 `subscribe`\
  \ 并设置 `people` 属性？\n\n嗯，我们可以通过 `async` 管道来实现这一点！\n\n### Async 管道（Async Pipe）\n\n\
  使用 `async` 管道（记住管道是 AngularJS 过滤器的新术语），你可以通过以下方式简化上面的示例：\n\n1. 在你的组件中暴露一个 `people:\
  \ Observable<Person[]>` 属性\n2. 使用 `peopleService.getAll` 方法设置它的值\n3. 在模板中使用 `async`\
  \ 管道\n\n```javascript\n@Component({\n  selector: 'people-list',\n  template: `\n\
  \  <ul class=\"people\">\n    <li *ngFor=\"let person of people | async \" >\n \
  \       <a href=\"#\" [routerLink]=\"['/persons', person.id]\">\n          {{person.name}}\n\
  \        </a>\n    </li>\n  </ul>  `,\n})\nexport class PeopleListComponent implements\
  \ OnInit{\n  people: Observable<Person[]>;\n\n  constructor(private peopleService\
  \ : PeopleService){}\n\n  ngOnInit(){\n    this.people = this.peopleService.getAll();\n\
  \  }\n}\n```\n\n这很大地简化了 `PeopleListComponent` 的逻辑，并让异步代码看起来非常同步。\n\n请注意，为了简单起见，我移除了错误处理和\
  \ `is loading...` 消息。你可以像我们在上一个示例中那样通过订阅 observable 来恢复它们。\n\n还是对 Observables 不太信服吗？你怀念过去那些\
  \ promises 美好的时光吗？别担心，如果你喜欢的话，你仍然可以使用 promises。\n\n### 将 Observables 转换为 Promises\n\
  \n在过去的某个时间的某个地方，我提到过 RxJS 带有许多超级实用的操作符，可以帮助你组织复杂的异步应用程序。它还包含一个将 observables 转换为\
  \ promises 的操作符：`toPromise` 操作符。\n\n使用 `toPromise` 操作符，你可以在数据访问服务中将 Observables\
  \ 转换为 Promises，并继续在你的组件中使用 Promises。例如，我们可以这样重写 `getAll` 方法：\n\n```javascript\n\
  Injectable()\nexport class PeopleService{\n  private baseUrl: string = 'http://swapi.co/api';\n\
  \  constructor(private http : Http){}\n\n  getAll(): Promise<Person>{\n    return\
  \ this.http\n      .get(`${this.baseUrl}/people`, {headers: this.getHeaders()})\n\
  \      .toPromise()\n      .then(mapPersons)\n      .catch(handleError);\n  }\n\n\
  \  // 其他代码...\n}\n\nfunction handleError(error: any){\n  // 记录错误\n  // 可以是更复杂的处理\n\
  \  let errorMsg = error.message || `哎呀！我们的超空间驱动设备出了问题，我们无法检索您的数据!`\n  console.error(errorMsg);\n\
  \  // 返回一个被拒绝的 Promise 而不是 Observable\n  return Promise.reject(errorMsg);\n}\n```\n\
  \n然后像你在 AngularJS 和其他框架中习惯的那样，从我们的任何组件中消费返回的 promises。\n\n### 想学习更多关于 Angular HTTP\
