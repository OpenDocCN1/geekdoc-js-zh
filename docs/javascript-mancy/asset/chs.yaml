  \ text,  \ntext text text text text text text,  \ntext text text text text text\
  \ text,  \ntext text text text text text text,  \ntext text text text text text\
  \ text,  \ntext text text text text text text.\n\n                             \
  \   - XXXX Xxxxx,\n                                Some title, Some time \n```\n\
  \n```\n1 /* \n2  * story \n3  *\n4  */\n```\n\n早上好！是时候开启 Angular 的世界了！在上一章节中，你学习了\
  \ Angular 路由（Routing），今天你将学习如何在 Angular 中创建表单并对其进行验证。\n\n## 代码示例\n\n你可以从[这个 GitHub\
  \ 仓库](https://github.com/Vintharas/angular2-step-by-step-05-forms-and-validation)\
  \ 下载本文的所有代码示例。\n\n## 到目前为止我们的应用程序\n\n到目前，我们开发了一个微小的 Angular 应用，用于学习更多关于《星球大战》宇宙中的人物。我们有两个组件：显示人物列表的\
  \ `PeopleListComponent` 以及显示你所选角色更多信息的 `PersonDetailsComponent`。\n\n我们使用 Angular\
  \ 路由在这两个视图之间导航，人物列表是我们的默认视图，也是应用程序启动时立即渲染的视图。\n\n## 我们想保存自己的数据！\n\n到目前为止，我们一直只是读取信息，我们已经读腻了！我们想要能够写入并保存自己的数据。\n\
  \n为了实现这一点，我们将把 `PersonDetailsComponent` 转换为一个表单，并在上面添加一些验证，以确保我们保存的信息是正确的。\n\n练习结束，我们的详情表单应该看起来像这样：\n\
  \n// TODO: add image\n\n## 首先！我们需要向应用中添加 Forms 模块！\n\n从 RC5 版本开始，我们需要在 `NgModule`\
  \ 中声明模块依赖项，由于我们想使用[新的表单 API](https://angular.io/docs/ts/latest/guide/forms.html)，你需要在我们的\
  \ `app.module.ts` 中导入它：\n\n```\n1 import { FormsModule } from '@angular/forms';\n\
  ```\n\n并通过 `imports` 属性将其指定为依赖项：\n\n```\n 1 // imports\n 2 \n3 @NgModule({\n 4 \
  \  declarations: [\n 5     AppComponent,\n 6     PeopleListComponent,\n 7     PersonDetailsComponent\n\
