  2 // => Gandalf, the Grey Wizard\n```\n\n而我们伟大的灰色巫师可以施展强大的法术：\n\n```\n 1 // 一道闪电术\n\
  \ 2 var lightningSpell = function(target){\n 3   console.log('A bolt of lightning\
  \ electrifies ' + target + '(-10hp)');\n 4   target.hp -= 10;\n 5 };\n 6 lightningSpell.mana\
  \ = 5;\n 7 lightningSpell.toString = function(){ return 'lightning spell';};\n 8\
