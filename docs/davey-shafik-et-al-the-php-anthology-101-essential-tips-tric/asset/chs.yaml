  \n`<a href=\"newpass.php\">忘记密码？</a>`\n\n## 如何让用户更改密码？\n\n许多 PHP 应用程序的一个良好设计测试是，用户是否可以在更改密码后无需重新登录应用程序。只要你精心构建应用程序，用户就应该能够在更改密码后继续他们的操作，无需额外步骤。如果你希望用户留在你的网站上，体贴地对待他们是很重要的！\n\
  \n访问控制\n\n331\n\n## 解决方案\n\n如果我们回到本章前面讨论的基于会话的身份验证机制，你会记得登录名和 md5 加密密码存储在会话变量中，并由\
  \ `Auth` 类在每个新页面上重新检查。诀窍在于，当用户更改密码时，同时更改会话变量和数据库中的密码值。我们可以通过对 `AccountMaintenance`\
  \ 类进行一个小修改（参见“如何处理忘记密码的成员？”）并添加一个新表单来实现这个技巧。\n\n### 修改 AccountMaintenance\n\n通过对\
  \ `AccountMaintenance` 类稍作调整，添加一个用于更改密码的方法，我们应该能够相当轻松地处理这项工作。`changePassword` 方法需要\
  \ `Auth` 类的实例（参见“如何创建一个类来控制对网站某部分的访问？”）、旧密码和新密码作为参数：\n\n**AccountMaintenance.class.php（摘录）**\n\
  \n```\npublic function changePassword($auth, $oldPassword, $newPassword)\n{\n$var_login\
  \ = $this->cfg['login_vars']['login'];\n$user_table = $this->cfg['users_table']['table'];\n\
  $user_login = $this->cfg['users_table']['col_login'];\n$user_pass = $this->cfg['users_table']['col_password'];\n\
  ```\n\n在方法开始时，我们将一些配置设置存储在局部变量中，以提高方法其余部分的可读性。\n\n然后，该方法实例化一个新的 `Session` 对象（我们在“如何创建会话类？”中见过），并尝试在数据库中查找用户记录：**AccountMaintenance.class.php（摘录）**\n\
  \n```\n$session = new Session();\ntry\n{\n$sql = \"SELECT *\nFROM \" . $user_table\
  \ . \"\n```\n\n332\n\nPHP 文集\n\n```\nWHERE\n\" . $user_login . \" = :login\nAND\n\
  \" . $user_pass . \" = :pass\";\n$stmt = $this->db->prepare($sql);\n$stmt->bindParam(':login',\
  \ $session->get($var_login));\n$stmt->bindParam(':pass', md5($oldPassword));\n$stmt->execute();\n\
  $result = $stmt->fetchAll(PDO::FETCH_ASSOC);\n}\ncatch (PDOException $e)\n{\nthrow\
  \ new AccountDatabaseException('Database error when' .\n' finding user: '.$e->getMessage());\n\
  }\n```\n\n该方法首先执行数据库查找，以找到使用当前登录详细信息（从会话信息中获取）和旧密码的用户记录。如果抛出 `PDOException`，该方法会抛出我们的自定义异常\
  \ `AccountDatabaseException`。\n\n检查数据库查找的结果——如果返回的不是一条匹配记录，该方法将抛出 `AccountUnknownException`：**AccountMaintenance.class.php（摘录）**\n\
  \n```\nif (count($result) != 1)\n{\nthrow new AccountUnknownException('Could not\
  \ find account');\n}\n```\n\n最后，如果没有抛出异常，该方法将使用新密码更新数据库中的密码信息：**AccountMaintenance.class.php（摘录）**\n\
  \n```\ntry\n{\n$sql = \"UPDATE \" . $user_table . \"\nSET\n\" . $user_pass . \"\
  \ = :pass\n```\n\n访问控制\n\n333\n\n```\nWHERE\n\" . $user_login . \" = :login\";\n\
  $stmt = $this->db->prepare($sql);\n$stmt->bindParam(':login', $session->get($var_login));\n\
  $stmt->bindParam(':pass', md5($newPassword));\n$stmt->execute();\n$auth->storeAuth($session->get($var_login),\n\
  $newPassword);\n}\ncatch (PDOException $e)\n{\nthrow new AccountDatabaseException('Database\
  \ error when' .\n' updating password: '.$e->getMessage());\n}\n}\n```\n\n\n\n\n\n\
  在更新用户表中的信息后，当前会话信息也会通过 `Auth->storeAuth` 方法进行更新。同样，如果操作抛出 `PDOException`，我们会抛出一个\
  \ `AccountDatabaseException`。\n\n在更改密码并让用户使用新密码访问之前，要求用户输入旧密码是一个好主意。也许用户曾在网吧登录后离开，忘记退出登录，或者更糟，其会话被电子劫持。确认用户能够提供旧密码的过程可以排除一些潜在的损害，因为它可以防止任何“接管”会话的人更改密码，从而完全控制账户。相反，新入侵者只能在会话持续期间保持登录状态。\n\
  \n（出于同样的原因，您可能还希望要求用户在完成任何重大操作（如信用卡购买）之前重新输入密码。）\n\n### 更改密码表单\n\n这个网页表单将向您展示如何在注册系统中轻松使用\
