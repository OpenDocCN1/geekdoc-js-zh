  \n## 讨论\n\n使用 `addAttachment` 方法不仅可以传输文本文件。4 也可以用于图像或应用程序文件。只需确保在第二个参数中指定正确的文件内容类型即可。如果你不向该方法提供更多参数，将使用默认值——通常这些默认值就足够了。例如：`$mime->addAttachment('php.gif',\
  \ 'image/gif');`\n\n如果默认值不合适，你可以精确指定希望文件如何附加到邮件中。第三个参数表示你希望附件在邮件中显示的文件名。\n\n4 要查看\
  \ `addAttachment` 方法的完整文档，请参见 http://pear.php.net/manual/en/package.mail.mail-mime.addattachment.php。\n\
