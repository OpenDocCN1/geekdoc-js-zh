  \n在表格中显示表格数据看似简单，但当表格是 Web 应用的一部分时，通常需要进行定制。例如，你可能希望以表格格式显示成员信息列表，并自定义某一列来显示成员的头像缩略图。\n\
  \n## 解决方案\n\n`Structures_DataGrid` 类允许你指定格式化函数回调，以自定义表格中显示的数据。在本解决方案中，我们将为成员姓名和头像添加自定义列。请确保你已阅读本章中的“如何在可排序表格中显示数据？”以确保你已具备所需\
  \ PEAR 包列表中的所有内容。\n\n第一步是包含所需的 PHP 文件：\n\n### pearDataGridCustom.php（节选）\n\n```php\n\
  <?php\nrequire 'dbcred.php';\nrequire 'Structures/DataGrid.php';\n```\n\n`dbcred.php`\
  \ 包含用于 `Structures_DataGrid` 对象的数据库登录凭据。该文件包含与测试环境相关的凭据，因此如果你想在自己的 Web 服务器上尝试，请务必更改它们。需要\
  \ `Structures/DataGrid.php` 来创建 `Structures_DataGrid` 对象。\n\n接下来，我们定义一些自定义回调函数：`getName`\
  \ 和 `getThumbnail`：\n\n### pearDataGridCustom.php（节选）\n\n```php\nfunction getName($data)\n\
  {\nreturn $data['record']['first_name'] .' '.\n$data['record']['last_name'];\n}\n\
  \nfunction getThumbnail($data)\n{\nif (strlen($data['record']['filename']) > 0)\n\
  {\nreturn '<img src=\"images/avatars/'\n.$data['record']['filename']. '\" />';\n\
  }\nelse\n{\nreturn '<img src=\"images/avatars/missing.gif\" />';\n}\n}\n```\n\n\
  第一个函数 `getName` 简单地将 `first_name` 和 `last_name` 列拼接起来。`getThumbnail` 使用 `filename`\
  \ 列返回一个 HTML `<img>` 标签。\n\n当回调函数被调用时，它会接收一个数组作为参数，该数组包含数据库行以及有关当前列的一些信息：当前排序和行号。回调函数必须返回要在该列中显示的字符串。\n\
  \n然后我们实例化 `Structures_DataGrid` 对象，并创建一系列 `Structures_DataGrid_Column` 对象，每个对象代表一个显示列。我们使用\
  \ `addColumn` 方法将它们添加到网格对象中：\n\n### pearDataGridCustom.php（节选）\n\n```php\n$datagrid\
  \ = new Structures_DataGrid(2);\n\n$thumb = new Structures_DataGrid_Column(\"\"\
  , \"thumb\", \"thumb\", null, null, \"getThumbnail()\");\n$datagrid->addColumn($thumb);\n\
  \n$name = new Structures_DataGrid_Column(\"Name\", \"name\",\n\"first_name\", null,\
  \ null, \"getName()\");\n$datagrid->addColumn($name);\n\n$email = new Structures_DataGrid_Column(\"\
  E-Mail\", \"email\",\n\"email\");\n$datagrid->addColumn($email);\n\n$login = new\
  \ Structures_DataGrid_Column(\"Login Name\", \"login\",\n\"login\");\n$datagrid->addColumn($login);\n\
  \n$sig = new Structures_DataGrid_Column(\"Signature\", \"signature\",\n\"signature\"\
  );\n$datagrid->addColumn($sig);\n\n$datagrid->setDefaultSort(array('first_name'\
  \ => 'ASC'));\n```\n\n我们还设置了数据的默认排序，使其按名字升序（字母顺序）排列。`Structures_DataGrid_Column`\
  \ 构造函数的代码骨架如下所示：\n\n```php\nStructures_DataGrid_Column(\nstring $label,\n[string\
  \ $field = null],\n[string $orderBy = null],\n[array $attributes = array()],\n[string\
  \ $autoFillValue = null],\n[mixed $formatter = null],\n[array $formatterArgs = array()]\n\
  );\n```\n\n我们上面的自定义列代码展示了两个重要的代码特性：`$thumb` 和 `$name` 列的自定义格式化函数（在它们的最后一个参数中指定），以及\
  \ `$name` 列的 `orderBy` 参数。对于 `$name` 列，`orderBy` 参数很重要，因为当我们拼接两个名字时，无法再按其中一个排序。因此，我们必须提供一个列名或一个用于排序的表达式。在我们的解决方案中，我们选择按名字排序。\n\
  \n接下来，我们使用 `bind` 方法将网格绑定到 SQL 查询：\n\n### pearDataGridCustom.php（节选）\n\n```php\n\
  $options = array(\n```\n\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar =\
  \ avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`\n\n在`List.of(arg0, arg1,\
  \ arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd arg0\
  \ arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\
  我们将这个类命名为 `RequestPath`，并为其设置一个私有属性 `$parts`，用于存储请求 URL 的所有部分：\n\n```\n**RequestPath.class.php\
  \ *(excerpt)***\n\nclass RequestPath\n{\n    private $parts = array();\n```\n\n\
  实际的路径解析发生在 `__construct` 方法中，它简单地将路径按正斜杠（`/`）字符拆开，然后先处理前两个路径元素作为特殊情况，再处理后续的键值对。我们首先获取路径，并去除末尾的\
  \ `/` 字符（如果有的话）：\n\n```\n**RequestPath.class.php *(excerpt)***\n\npublic function\
  \ __construct()\n{\n    if (isset($_SERVER['PATH_INFO']))\n    {\n        $path\
  \ = (substr($_SERVER['PATH_INFO'], -1) == \"/\") ?\n            substr($_SERVER['PATH_INFO'],\
  \ 0, -1) :\n            $_SERVER['PATH_INFO'];\n    }\n    else\n    {\n       \
  \ $path = (substr($_SERVER['REQUEST_URI'], -1) == \"/\") ?\n            substr($_SERVER['REQUEST_URI'],\
  \ 0, -1) :\n            $_SERVER['REQUEST_URI'];\n    }\n```\n\n接下来，我们将路径按 `/` 字符拆分成数组。第一个元素视为动作（action），第二个元素视为类型（type）：\n\
  \n```\n**RequestPath.class.php *(excerpt)***\n\n$bits = explode(\"/\", substr($path,\
  \ 1));\n$parsed['action'] = array_shift($bits);\n$parsed[] = $parsed['action'];\n\
  $parsed['type'] = array_shift($bits);\n$parsed[] = $parsed['type'];\n```\n\n剩余的元素我们按键值对分组。如果剩余元素个数为奇数，我们只需将最后一个元素放到键值数组的末尾：\n\
  \n```\n**RequestPath.class.php *(excerpt)***\n\n$parts_size = sizeof($bits);\nif\
  \ ($parts_size % 2 != 0) {\n    $parts_size -= 1;\n}\nfor ($i = 0; $i < $parts_size;\
  \ $i+=2) {\n    $parsed[$bits[$i]] = $bits[$i+1];\n    $parsed[] = $bits[$i+1];\n\
  }\nif (sizeof($bits) % 2 != 0) {\n    $parsed[] = array_pop($bits);\n}\n```\n\n\
  最后，作为构造方法的最后一步，我们将组装好的路径元素数组赋值给类的私有 `$parts` 属性：\n\n```\n**RequestPath.class.php\
  \ *(excerpt)***\n\n$this->parts = $parsed;\n}\n```\n\n我们可以在 `RequestPath` 类中使用 `__get`、`__set`\
  \ 和 `__isset` 魔术方法，让类的使用者能够像访问类属性一样通过键来获取、设置和测试路径元素的值，从而使我们的类保持简洁易用：\n\n```\n**RequestPath.class.php\
  \ *(excerpt)***\n\npublic function __get($key)\n{\n    return $this->parts[$key];\n\
  }\n\npublic function __set($key, $value)\n{\n    $this->_parts[$key] = $value;\n\
  }\n\npublic function __isset($key)\n{\n    return isset($this->_parts[$key]);\n\
  }\n}\n?>\n```\n\n使用这段代码甚至更简单。假设传入的请求是：`http://yourhostname/edit/trackbacks/for/163-My-Example-Page`\
  \ 我们可以通过创建一个新的 `RequestPath` 对象来访问路径信息：\n\n```\n<?php\nrequire_once 'RequestPath.class.php';\n\
  $request = new RequestPath();\necho \"Request action: {$request->action}</br>\"\
  ;\necho \"Request type: {$request->type}</br>\";\necho \"Request for: {$request->for}</br>\"\
  ;\n?>\n```\n\n这段代码应输出以下内容：\n\n```\nRequest action: edit</br>\nRequest type: trackbacks</br>\n\
  Request for: 163-My-Example-Page</br>\n```\n\n## 讨论\n\n一旦我们设置并运行了漂亮的 URL，就可以开始实现专业的架构方案，例如模型-视图-控制器架构（MVC）。[¹⁶]\
  \ 漂亮的 URL 正迅速成为热门网站的基本要求，仔细考虑你的 URL 并使其尽可能易于记忆（或“可猜测”）非常重要。\n\n## 总结\n\n在本章中，我们探讨了多种简化\
  \ Web 表单和表格构建的方法，以便腾出时间专注于 Web 开发中更重要的方面。每个表格和每个表单都有一定的共性，但作为开发者，我们的职责是处理差异——我们可以自动化共性部分，但需要学会处理每个案例中独特的方面。本章还让我们有机会尝试使用\
  \ Apache Web 服务器和一些简单的 PHP 来在我们的 Web 应用中应用漂亮的 URL。\n\n表格、表单和漂亮的 URL 是任何 Web 开发者工作经历中的常见任务。本章的目标是突出我们可以自动化的开发方面，并简化我们无法自动化的部分的处理。不幸的是，除了经验之外，没有什么能让这项工作始终轻松！\n\
  \n[¹⁶]: http://en.wikipedia.org/wiki/Model-view-controller\n\n# 第 6 章\n\n## 处理文件\n\
  \n数据库是存储信息的绝佳工具，因为它们速度快，并且借助 SQL 易于导航。但有时，你需要能够访问存储在文件中的数据——无论是图像、配置信息，甚至是远程服务器上的网页。PHP\
  \ 凭借其强大的文件函数集合使这类工作变得简单。唯一困难的部分是为任务选择合适的工具！\n\n为了演示，我保存了 Pax Dickinson 的文章《Top 7\
  \ PHP Security Blunders!》[¹] 的可打印版本，我们将使用 PHP 的文件函数对其进行操作。该文件以 `writeSecureScripts.html`\
  \ 的名称保存在本书的代码归档中。\n\n[¹]: http://www.sitepoint.com/article/php-security-blunders\n\
  \n![Image 44](img/index-170_1.png)\n\n![Image 45](img/index-170_2.jpg)\n\n### 关于安全的一点说明\n\
  \n在随意使用 PHP 的文件函数之前，请仔细考虑你在做什么：你将使操作系统中的文件在暴露于互联网的网页上可用。反复检查访问文件的代码——寻找逻辑中可能允许未经授权访问这些文件的漏洞。\n\
  \n当允许通过 URL 识别文件或目录，或者允许从你的站点上传或下载文件时，要特别小心。这个警告也适用于 PHP 的 include 命令，这些命令可用于执行从远程\
  \ Web 服务器包含的脚本，例如：`include 'http://www.hacker.com/bad_script.txt';`。\n\n由于存在潜在危险，`php.ini`\
  \ 中提供了设置来关闭此功能。`allow_url_fopen = Off` 用于禁用通过 URL 打开远程文件的支持（针对支持 URL 的 fopen 封装器）。从\
  \ PHP 5.2 开始，还有 `allow_url_include` 设置，它对 `include`、`include_once`、`require` 和 `require_once`\
  \ 函数执行相同的操作。如果 `allow_url_fopen` 被关闭，`allow_url_include` 也会自动关闭。\n\n我将在每个解决方案中强调潜在的危险，以便你能够小心地学习编写安全的代码。\n\
  \n### 如何读取本地文件？\n\n读取本地文件的方法多到你无法想象。在本解决方案中，我们将讨论几种最流行的方法，但如果你想继续研究，请查看相关手册页面。[²]\n\
  \n[²]: http://www.php.net/filesystem/\n\n## 解决方案\n\n本节涵盖三种选项：将文件读取为数组、将文件读取为字符串、以及将文件直接读取到屏幕。\n\
  \n##### 将文件读取为数组\n\n首先是 PHP 的 `file` 函数，它将文件读入一个数组，使用换行符来指示新数组元素的开始位置：\n\n```\n\
  **fileFunc.php *(excerpt)***\n\n<?php\n$file = **file('writeSecureScripts.html')**;\n\
  $lines = count($file);\n$alt = '';\nfor ($i=0; $i<$lines; $i++) {\n    $alt = ($alt\
  \ == 'even') ? 'odd' : 'even';\n    echo '<div class=\"' . $alt . '\">';\n    echo\
  \ $i . ': ' . htmlspecialchars($file[$i]);\n    echo \"</div>\\n\";\n}\n?>\n```\n\
  \n瞧！文件以格式良好的页面弹出，你可以逐行查看。我们只需用 `for` 循环遍历 `$file` 变量（一个数组），并按需显示它。\n\n你可能注意到上述代码中，我们在\
  \ `for` 循环之后的行中使用了**三元运算符**来实现交替行颜色。三元运算符接受三个参数，是编写简单 `if` 语句的快捷方式。\n\n\n\n\n\n\
  基本语法如下：\n\n`(condition) ? true : false`\n\n我们工作的输出如图 6.1 所示。\n\n![Image 46](img/index-172_1.jpg)\n\
  \n150\n\nPHP 文集\n\n图 6.1. 将本地文件读取为数组\n\n## 将文件读取为字符串\n\n自 PHP 4.3 起，名为 `file_get_contents`\
  \ 的函数可将文件直接读入字符串，而无需拆分：\n\n`fileGetFunc.php` *(摘录)*\n\n```php\n<?php\n$file = file_get_contents('writeSecureScripts.html');\n\
  $file = strip_tags($file);\n?>\n<form>\n<textarea>\n<?php\necho htmlspecialchars($file);\n\
  ?>\n</textarea>\n</form>\n```\n\n![Image 47](img/index-173_1.jpg)\n\n文件操作\n\n151\n\
  \n现在，文件内容显示在 HTML 文本区域中，所有 HTML 标签已被剥离。输出如图 6.2 所示。\n\n图 6.2. 将本地文件读取为字符串\n\n##\
  \ 将文件直接读取到屏幕\n\n读取本地文件的另一种方法是使用 `readfile` 函数，该函数获取文件内容并直接显示在屏幕上：\n\n`readFileFunc.php`\
  \ *(摘录)*\n\n```php\n<?php\nreadfile('writeSecureScripts.html');\n?>\n```\n\n![Image\
  \ 48](img/index-174_1.jpg)\n\n152\n\nPHP 文集\n\n这一行代码将文件原样显示——不要停在“开始”，不要收取 200 美元。输出如图\
  \ 6.3 所示。\n\n图 6.3. 将本地文件直接读取到屏幕\n\n## 讨论\n\n`readfile` 是保护文件和带宽的便捷方式。通过使用 `readfile`\
  \ 函数，将网站上的所有文件通过脚本链接起来，可以防止他人直接链接到这些文件，从而可能消耗你网站的带宽³。这种方法通常被称为“防盗链”脚本。如果结合身份验证系统和/或\
  \ HTTP 引用检查，你将拥有一个安全的系统，确保只有你网站的合法访问者才能访问你的文件。\n\n³ 关于如何防止此类盗用的示例，请参见“如何使用 PHP 管理文件下载？”\n\
  \n文件操作\n\n153\n\n## 如何使用文件句柄？\n\n要使用上一节中看到的文件函数，只需将函数指向要读取的文件，使用相对于执行该函数的 PHP 脚本的路径即可。然而，PHP\
  \ 的大多数文件函数使用一种略有不同的机制来访问文件——这种机制与连接数据库的机制非常相似。该过程使用 `fopen` 函数进行“连接”，使用 `fclose`\
  \ 进行“断开”。`fopen` 函数返回的值是一个 PHP 文件指针，也称为文件的句柄。一旦我们获得了文件的句柄，就可以用它来对文件执行各种操作，包括读取、追加、修改等。\n\
  \n## 解决方案\n\n这个简单的示例演示了如何打开和关闭与文件的“连接”：\n\n`fileHandle.php` *(摘录)*\n\n```php\n<?php\n\
  $location = 'writeSecureScripts.html';\n$fp = fopen($location, 'rb');\n⋮ 文件句柄 $fp\
  \ 现在可用\nfclose($fp);\necho $file;\n?>\n```\n\n当你使用 `fopen` 连接文件时，必须指定文件的路径以及访问文件的模式（例如\
  \ `r` 表示只读）。模式指示符 `b` 表示文件将以二进制模式打开。正如 `fopen` 手册页所述⁴，应始终指定二进制模式，以确保代码在不同操作系统之间的可移植性。有关可用各种模式的更多信息，请阅读手册页。\n\
  \n### 处理小文件\n\n现在我们有了文件句柄，让我们用它来读取文件：⁴ http://www.php.net/fopen/\n\n154\n\nPHP 文集\n\
  \n`fileHandle.php` *(摘录)*\n\n```php\n<?php\n$location = 'writeSecureScripts.html';\n\
  $fp = fopen($location, 'rb');\n$file_contents = fread($fp, filesize($location));\n\
  fclose($fp);\necho $file_contents;\n?>\n```\n\n这个示例仅仅演示了文件句柄的实际应用。注意，当我们使用 `fread`\
  \ 时，第二个参数表示从文件开头读取的数据量（以字节为单位）。对于这个参数，我使用了 `filesize` 函数，它告诉我文件的总大小。\n\n### 处理大文件\n\
  \n前面的解决方案适用于小文件。然而，当读取大文件的所有内容时，PHP 将被迫用这些内容填充大量内存，可能导致性能问题。为了缓解这个潜在问题，我们采用不同的方法来读取大文件的内容——我们分块读取文件，并在读取过程中对每个块进行操作：\n\
  \n`fileHandle2.php` *(摘录)*\n\n```php\n<?php\n$fp = fopen('writeSecureScripts.html',\
  \ 'rb');\nwhile (!feof($fp)) {\n    $chunk = fgets($fp);\n    echo $chunk;\n}\n\
  fclose($fp);\n?>\n```\n\n在我们的示例中，文件照常打开。接下来，为了读取文件内容，我们使用一个 while 循环，只要 `feof` 函数返回\
  \ FALSE，循环就会继续。`feof` 在到达文件末尾或文件句柄出现错误（例如连接丢失，可能发生在远程文件上）时返回 TRUE。\n\n文件操作\n\n155\n\
  \n接下来，我们使用 `fgets` 从当前位置开始获取文件的“一块”，直到下一个换行符。我们得到字符串，同时 `fgets` 相应地向前移动文件句柄的内部 PHP\
  \ 文件指针。\n\n## 讨论\n\n还有许多其他函数可用于使用文件句柄读取文件。一个是 `fgetss`（注意双 s），它与 `fgets` 几乎相同，但会像\
  \ `strip_tags` 函数那样剥离其中找到的任何 HTML 标签。另一个是 `fscanf`，它像 `printf` 一样格式化文件输出。还有 `fgetcsv`，它使处理\
  \ CSV（逗号分隔值）文件变得轻而易举。在空闲时，非常值得浏览文件系统函数以寻找有用的功能⁵。\n\n但是，如果你只想将整个文件内容读入一个变量，那么 `file`\
  \ 和 `file_get_contents` 函数更易于使用，并且可能提供更好的性能。\n\n## 如何修改本地文件？\n\n现在你已经了解了如何读取文件内容并熟悉了文件句柄，那么如何更新文件呢？同样，使用\
  \ PHP 也很简单。\n\n## 解决方案\n\n看看这段代码：\n\n`write.php` *(摘录)*\n\n```php\n<?php\n$lines\
  \ = file('writeSecureScripts.html');\n$fp = fopen('writeSecureScripts.txt', 'w');\n\
  foreach ($lines as $line) {\n    $line = strip_tags($line);\n    fwrite($fp, $line);\n\
  }\nfclose($fp);\necho '<pre>';\necho file_get_contents('writeSecureScripts.txt');\n\
  echo '</pre>';\n?>\n```\n\n我们使用 `fwrite` 函数将字符串写入文件。注意我们使用 `fopen` 打开新文件时使用的模式。模式\
  \ `w` 将打开文件进行写入，从文件开头开始，覆盖任何已存在的内容。如果我们使用 `a` 模式，新内容将追加到文件中，保留原始内容。无论哪种情况，如果文件不存在，都会创建该文件。\n\
  \n对于快速、直接的文件写入方法，请研究 `file_put_contents` 函数⁶。它等同于依次调用 `fopen`、`fwrite` 和 `fclose`，正如我们在“如何使用文件句柄？”中看到的那样。\n\
  \n## 讨论\n\n请注意，在基于 Unix 的 Web 服务器上，PHP 通常以 www 或 nobody 等用户身份运行——这些账户权限非常有限，并非你个人所有。由\
  \ PHP 创建的文件需要放置在该用户具有写入权限的目录中。\n\n要使文件或目录可读可写，请使用以下命令：`chmod o=rw <目录 | 文件>`\n\n\
  如果你还需要执行该文件（例如，它是一个 PHP 脚本），请使用以下命令：`chmod o=rwx <目录 | 文件>`\n\n## 保护敏感文件\n\n\n\n\
  \n如果你使用共享服务器，像这样设置目录的读写权限意味着服务器上的其他用户将能够读取和修改这些目录中的内容。请谨慎对待你存放在其中的信息类型！你的虚拟主机提供商应该能够帮助你解决任何安全问题。\n\
  \n6 http://www.php.net/file_put_contents/\n\n## 文件操作\n\n## 如何获取本地文件的信息？\n\nPHP 提供了一系列函数来帮助你获取文件的信息。\n\
  \n## 解决方案\n\n在下面的示例中，我们使用了一些实用的函数：\n\n- `file_exists`，用于检查文件是否存在\n- `is_file`，用于检查文件确实是文件而不是目录\n\
  - `is_readable`，用于检查文件是否可读\n- `is_writable`，用于检查文件是否可写\n- `filemtime`，用于检查文件最后修改的日期和时间\n\
  - `fileatime`，用于查找文件最后访问的日期和时间\n- `filesize`，用于检查文件的大小\n\n我们还用一些自定义代码包装了结果，使其更易读：`fileInfo.php`\
  \ *(节选)*\n\n```php\n<?php\n\n// Function to convert a size to bytes to large units\
  \ function fileSizeUnit($size)\n\n{\n\nif ($size >= 1073741824)\n\n{\n\n$size =\
  \ number_format(($size / 1073741824), 2);\n\n$unit = 'GB';\n\n}\n\nelse if ($size\
  \ >= 1048576)\n\n{\n\n$size = number_format(($size / 1048576), 2);\n\n$unit = 'MB';\n\
  \n}\n\nelse if ($size >= 1024)\n\n{\n\n$size = number_format(($size / 1024), 2);\n\
  \n$unit = 'KB';\n\n}\n\nelse if ($size >= 0)\n\n{\n\n$unit = 'B';\n\n}\n\nelse\n\
  \n{\n\n$size = '0';\n\n$unit = 'B';\n\n}\n\nreturn array('size' => $size, 'unit'\
  \ => $unit);\n\n}\n\n$file = 'writeSecureScripts.html';\n\n// set the default timezone\
  \ to use. Available since PHP 5.1\n\n// needed otherwise date() throws an E_STRICT\
  \ error in v5.2\n\ndate_default_timezone_set('UTC');\n\n// Does the file exist\n\
  \nif (file_exists($file))\n\n{\n\necho 'Yep: ' . $file . ' exists.<br />';\n\n}\n\
  \nelse\n\n{\n\ndie('Where has: ' . $file . ' gone!<br />');\n\n}\n\n// Is it a file?\
  \ Could be is_dir() for directory\n\nif (is_file($file))\n\n{\n\necho $file . '\
  \ is a file<br />';\n\n}\n\n// Is it readable\n\nif (is_readable($file))\n\n{\n\n\
  echo $file . ' can be read<br />';\n\n}\n\n// Is it writable\n\nif (is_writable($file))\n\
  \n{\n\necho $file . ' can be written to<br />';\n\n}\n\n![Image 51](img/index-181_1.jpg)\n\
  \n// When was it last modified?\n\n$modified = date(\"D d M g:i:s\", filemtime($file));\
  \ echo $file . ' last modifed at ' . $modified . '<br />';\n\n// When was it last\
  \ accessed?\n\n$accessed = date(\"D d M g:i:s\", fileatime($file)); echo $file .\
  \ ' last accessed at ' . $accessed . '<br />';\n\n// Use a more convenient file\
  \ size\n\n$size = fileSizeUnit(filesize($file));\n\n// Display the file size\n\n\
  echo 'It\\'s ' . $size['size'] . ' ' . $size['unit'] .\n\n' in size.<br />';\n\n\
  ?>\n```\n\n## 讨论\n\n我们在代码开头使用的 `fileSizeUnit` 函数有助于让 PHP 的 `filesize` 函数的结果更易读。\n\
  \nPHP 会缓存文件信息函数的结果以提高性能。但有时需要清除该缓存；我们可以使用 `clearstatcache` 函数来实现。上述代码的输出如图 6.4 所示。\n\
  \n图 6.4. 获取文件信息\n\n## 如何使用 PHP 检查目录？\n\n当你用 PHP 创建基于网页的文件管理器时，能够浏览目录的内容会非常方便。\n\n\
  ## 解决方案\n\n使用 PHP 检查目录有两种基本方法——你可以选择自己喜欢的方式。7\n\n#### 使用 readdir 函数\n\n第一种方法使用 `opendir`、`readdir`\
  \ 和 `closedir` 函数，类似于使用 `fopen`、`fread` 和 `fclose` 读取文件的过程：`readdir.php` *(节选)*\n\
  \n```php\n<?php\n\n$location = './';\n\n$dp = opendir($location);\n\nwhile ($entry\
  \ = readdir($dp))\n\n{\n\nif (is_dir($location . $entry))\n\n{\n\necho '[Dir] '\
  \ . $entry . '<br />';\n\n}\n\nelse if (is_file($location . $entry))\n\n{\n\necho\
  \ '[File] ' . $entry . '<br />';\n\n}\n\n}\n\nclosedir($dp);\n\n?>\n```\n\n7 我们将在后面的“如何在\
  \ PHP 5 中使用标准 PHP 库处理文件？”中讨论第三种选择。\n\n#### 使用 dir 伪类\n\n另一种方法是使用 `dir` 伪类。8 `dir`\
  \ 的使用方式与 `readdir` 非常相似：`readdir2.php` *(节选)*\n\n```php\n<?php\n\n$location = './';\n\
  \n$dir = dir($location);\n\nwhile ($entry = $dir->read())\n\n{\n\nif (is_dir($location\
  \ . $entry))\n\n{\n\necho '[Dir] ' . $entry . '<br />';\n\n}\n\nelse if (is_file($location\
  \ . $entry))\n\n{\n\necho '[File] ' . $entry . '<br />';\n\n}\n\n}\n\n$dir->close();\n\
  \n?>\n```\n\n8 `dir` 定义了 `Directory` 类——这是 PHP 内置的预定义类之一。你可以在手册页面 http://www.php.net/manual/en/reserved.classes.php\
  \ 上阅读更多关于预定义类的信息。\n\n## 如何在线显示 PHP 源代码？\n\n有时你可能想显示某个文件的源代码。也许你想公开代码，但不想处理下载；或者你不想不断更新显示页面以使其与实际代码保持同步（毕竟你可能在持续改进它）。事实证明，稍微偷懒一点并不是什么罪过。\n\
  \n## 解决方案\n\nPHP 提供了一个非常方便的函数来显示代码：`highlight_string`，它使用 `php.ini` 中定义的格式以美观的方式显示\
  \ PHP 代码。\n\n使用该函数的伙伴函数 `highlight_file` 显示代码更加简单，只需传入要显示的文件名即可：`highlight.php`\
  \ *(节选)*\n\n```php\n<?php\n\n// Define an array of allowed files - VERY IMPORTANT!\n\
  \n$allowed = array('fileInfo.php',\n\n'fileGetFunc.php',\n\n'fileHandle.php',\n\n\
  'fileHandle2.php');\n\nif (isset($_GET['view']) && in_array($_GET['view'], $allowed))\n\
  \n{\n\nhighlight_file($_GET['view']);\n\n}\n\nelse\n\n{\n\n$location = './';\n\n\
  $dir = dir($location);\n\nwhile ($entry = $dir->read())\n\n{\n\nif (in_array($entry,\
  \ $allowed))\n\n{\n\necho '<a href=\"' . $_SERVER['PHP_SELF'] .\n\n'?view=' . $entry\
  \ . '\">' . $entry . \"</a><br />\\n\";\n\n}\n\n}\n\n$dir->close();\n\n}\n\n?>\n\
  ```\n\n在 PHP 4.2.0 或更高版本中，如果你向 `highlight_string` 或 `highlight_file` 传递第二个参数 `TRUE`，该函数将返回结果字符串，而不是直接显示文件。\n\
  \n`highlight.php` 的输出如图 6.5 所示。\n\n![Image 52](img/index-185_1.jpg)\n\n图 6.5. 显示\
  \ PHP 源代码\n\n## 讨论\n\n在显示目录内容或单个文件源代码时，我会小心地只允许访问指定的文件。在显示源代码时务必极其谨慎，否则你可能会泄露超出预期的信息，例如用于访问数据库的用户名和密码。\n\
  \n请注意，我在这里并不是提倡为了安全而隐藏代码。代码首先应该被编写得安全。隐藏代码以免有人发现其中的漏洞是灾难性的做法。最终会有人发现你隐藏的内容，更糟糕的是，你可能根本不知道他们正在利用你松懈的安全措施。\n\
  \n## 如何将配置信息存储在文件中？\n\n在整个网站中反复使用的某些信息（例如密码、路径和变量）最好存储在一个文件中。这样，如果你需要将代码迁移到另一个站点，只需修改一次设置，而不是在代码中修改数百次。\n\
  \n## 解决方案\n\n存储配置信息最简单的方法是创建一个 `.ini` 文件，在其中定义变量，然后使用 `parse_ini_file` 函数将该文件包含到你的代码中，该函数解析使用与\
  \ `php.ini` 相同格式的文件。以下是一个 `.ini` 文件的示例：`example.ini` *(节选)*\n\n```ini\n; Settings\
  \ to connect to MySQL\n```\n\n\n\n\n\n[Database_Settings]\n\nhost=localhost\n\n\
  user=littleme\n\npass=secret\n\ndbname=world\n\n; 各种文件的默认位置\n\n[Locations]\n\ncss=/home/littleme/myinc/css\n\
  \njavascript=/home/littleme/myinc\n\nimages=/home/littleme/image\n\n此脚本使用 `parse_ini_file`\
  \ 函数从你的 `.ini` 文件中检索值：`parseini.php` *（摘录）*\n\n```php\n<?php\n\n$iniVars = parse_ini_file('example.ini',\
  \ TRUE); echo '<pre>';\n\nprint_r($iniVars);\n\necho $iniVars['Locations']['css'];\n\
  \necho '</pre>';\n\n?>\n```\n\n以下是脚本的输出：\n\nArray\n\n(\n\n[Database_Settings] =>\
  \ Array\n\n(\n\n[host] => localhost\n\n[user] => littleme\n\n[pass] => secret\n\n\
  ![Image 53](img/index-187_1.jpg)\n\n![Image 54](img/index-187_2.png)\n\n处理文件\n\n\
  165\n\n[dbname] => world\n\n)\n\n[Locations] => Array\n\n(\n\n[css] => /home/littleme/myinc/css\n\
  \n[javascript] => /home/littleme/myinc\n\n[images] => /home/littleme/image\n\n)\n\
  \n)\n\n`/home/littleme/myinc/css`\n\n# 处理文件\n\n## 讨论\n\n使用 `.ini` 文件存储配置信息相比将信息保存在\
  \ PHP 文件中具有一些优势。有时，编辑 PHP 文件会让用户感到紧张——他们可能难以看出哪些设置是可编辑的，而且如果他们更改了不该更改的内容，可能会破坏你的脚本。此外，由于\
  \ `.ini` 文件扩展名与脚本文件不同，通过包含简单指令的 `.htaccess` 文件来保护所有 `.ini` 文件相对容易。9\n\n## 配置文件安全\n\
  \n一般来说，最好不要将配置文件存储在 Web 根目录中——尤其是因为它通常包含用户和密码信息。\n\n由于你可以从文件系统中的任何位置包含文件，因此最好稳妥行事：将配置文件放在服务器\
  \ Web 根目录之外，使其远离黑客和谷歌的触及范围。\n\n如果你*必须*将配置文件存储在 Web 根目录中，请务必通过在 `.htaccess` 文件中包含文件指令来限制谁可以访问这些文件，从而保护它们。为了使配置信息绝对安全，你始终可以加密敏感数据（例如使用\
  \ mcrypt 等工具）。10\n\n9 有关文件指令的更多信息，请参见 http://httpd.apache.org/docs/2.0/mod/core.html#files。\n\
  \n10 http://www.php.net/mcrypt/\n\n166\n\nPHP 文集\n\n## 如何访问远程服务器上的文件？\n\n大多数情况下，PHP\
  \ 可以通过互联网以几乎与访问本地文件相同的方式访问远程服务器上的文件。\n\n## 解决方案\n\n`fopen` 函数可以将 URL 而不是文件路径作为其第一个参数。在此示例中，我们像打开文件一样打开一个网页：`urlFopen.php`\
  \ *（摘录）*\n\n```php\n<?php\n\n$fp = fopen('http://www.sitepoint.com/print/758', 'r');\
  \ while (!feof($fp))\n\n{\n\n$chunk = fgets($fp);\n\necho $chunk;\n\n}\n\nfclose($fp);\n\
  \n?>\n```\n\n## 讨论\n\nPHP 在 4.3.0 版本中实现了流的使用，作为一种将文件、网络、数据压缩和其他操作统一到一组通用函数中的方式。11\
  \ 基本上，如果你能以线性方式读取数据，你就在使用流。\n\n将远程和本地文件作为流处理的能力内置于各种文件函数中，这无疑使生活更轻松。缺点是，通过允许将远程文件当作本地文件处理，PHP\
  \ 很容易让你在不知不觉中使网站面临安全风险。12\n\n11 在 http://www.php.net/stream/ 了解更多关于流的信息。\n\n12 如果你愿意，可以在\
  \ `php.ini` 文件中设置 `allow_url_fopen` = Off 来禁用 PHP 打开远程文件的能力。\n\n处理文件\n\n167\n\n\
  ## 如何在 PHP 中使用 FTP？\n\nPHP 的一大优点是它内置或仅需扩展即可获得的大量功能。文件传输协议（FTP）就是这类功能的一个很好的例子。\n\n\
  ## 解决方案\n\n以下是两种在 PHP 中使用 FTP 的常用方法。\n\n#### 使用 PHP 内置的 FTP 函数\n\n你可以使用 PHP 的 FTP\
  \ 功能让 PHP 脚本充当 FTP 服务器的客户端。这对于无数任务都很有用，无论是为 FTP 文件存储库构建 Web 界面，还是开发一个从 PHP 开发环境更新网站的工具。要使用\
  \ FTP 函数，你需要确保你的主机已启用 PHP 的 FTP 功能。\n\n在此示例中，我们使用 PHP 的 FTP 功能连接到 FTP 服务器并列出目录中的文件：\n\
  \n`ftp.php` *（摘录）*\n\n```php\n<?php\n\nset_time_limit(0);\n\n$ftpServer = 'localhost';\n\
  \n$targetDir = '/';\n\nif (!$fp = ftp_connect($ftpServer, 21, 30))\n\n{\n\ndie('连接失败');\n\
  \n}\n\nif (!ftp_login($fp, 'anonymous', 'user@domain.com'))\n\n{\n\ndie('登录失败');\n\
  \n}\n\nif (!ftp_chdir($fp, $targetDir))\n\n{\n\ndie ('无法更改目录为：' . $targetDir);\n\
  \n}\n\necho \"<pre>当前目录：\" . ftp_pwd($fp) .\n\n\"\\n\\n\";\n\necho \"可用文件：\\n\"\
  ;\n\n$files = ftp_nlist($fp, '/');\n\nforeach ($files as $file)\n\n{\n\necho $file\
  \ . \"\\n\";\n\n}\n\necho '</pre>';\n\n?>\n```\n\n#### 使用 PEAR::Net_FTP 类\n\n`PEAR::NET_FTP`\
  \ 是一个方便的类，可确保数据以正确的模式（即 ASCII 或二进制）传输，并解决与递归上传和下载相关的问题，在这些操作中我们需要将目录及其子目录从一个系统传输到另一个系统。\n\
  \n此示例使用 `PEAR::NET_FTP` 实现与前一个示例相同的结果：\n\n`pearftp.php` *（摘录）*\n\n```php\n<?php\n\
  \nset_time_limit(0);\n\nrequire_once 'NET/FTP.php';\n\n$ftpServer = 'localhost';\n\
  \n$ftpUser = 'anonymous';\n\n$ftpPass = 'user@domain.com';\n\n$localDir = 'import/';\n\
  \n$remoteDir = '/';\n\n$ftp = new Net_FTP();\n\n$ftp->setHostname($ftpServer);\n\
  \n$ftp->setUsername($ftpUser);\n\n$ftp->setPassword($ftpPass);\n\n$ftp->connect();\n\
  \n$ftp->login();\n\n$ftp->getExtensionsFile('extensions.ini');\n\nif ($ftp->getRecursive($remoteDir,\
  \ $localDir))\n\n{\n\necho '文件传输成功';\n\n}\n\nelse\n\n{\n\necho '传输失败';\n\n}\n\n\
  ?>\n```\n\n请注意，`Net_FTP` 的 `getExtensionsFile` 方法允许你指定一个文件，该文件定义了特定文件扩展名（例如 `.gif`\
  \ 和 `.jpg`）为二进制或 ASCII，确保它们以正确的方式传输。`getRecursive` 方法获取指定远程目录的内容，包括其子目录。\n\n假设你有权限在服务器上放置文件，你可以使用\
  \ `putRecursive` 方法轻松反向应用该操作。这对于在本地开发系统和网站之间传输整个项目来说是一个有用的工具，特别是如果你从命令行使用 PHP。\n\
  \n凭借根据文件扩展名正确传输文件的能力，`Net_FTP` 也是单个 `put` 和 `get` 文件操作的绝佳选择，因为它消除了你正确设置文件传输模式的需要。\n\
  \n有关此 PEAR 包的更多信息，请参阅其文档。15\n\n## 讨论\n\n当你通过任何方式连接到普通 FTP 服务器时，你提供的用户名和密码会以明文形式发送到服务器。恶意方可以使用插入在你和所连接服务器之间任何位置的数据包嗅探器轻松读取这些信息。请务必定期更改密码，并且通常，在有更好替代方案时尽量避免使用\
  \ FTP。\n\n如果你有 SSH 访问权限，可以使用许多免费的 SFTP（SSH 文件传输协议）客户端与之交互。16\n\n15 http://pear.php.net/package/Net_FTP/docs/\n\
  \n16 维基百科提供了 SFTP 客户端列表，可作为你研究的一个良好起点，网址为 http://en.wikipedia.org/wiki/Comparison_of_FTP_clients#Protocol_support。\n\
  \n\n\n\n\n170\n\nPHP 文集\n\n## 如何使用 PHP 管理文件下载？\n\n开发构建提供文件下载的网站时，开发者常遇到的一个普遍问题就是文件管理。也许有些文件不应公开提供。也许你希望访客通过网页表单提供详细信息后才允许下载文件。处理下载可能不仅仅是简单地将文件存储在公共目录中并从网站链接到它。\n\
  \n## 解决方案\n\n使用 PHP 处理下载的技巧是使用几个特殊的 HTTP 头信息和 `readfile` 函数：\n\n**download.php *(摘录)***\n\
  \n```php\n<?php\n\n$fileName = 'example.ini';\n\n$mimeType = 'application/zip';\n\
  \nif (strpos($_SERVER['HTTP_USER_AGENT'], 'MSIE 5') or strpos($_SERVER['HTTP_USER_AGENT'],\
  \ 'Opera 7'))\n\n{\n\n$mimeType = 'application/x-download';\n\n}\n\nheader('Content-Disposition:\
  \ attachment; filename=' . $fileName); header('Content-Type: ' . $mimeType);\n\n\
  header('Content-Length: ' . filesize($fileName));\n\nreadfile($fileName);\n\n?>\n\
  ```\n\n`Content-Disposition` 头信息告诉浏览器将文件视为下载（即不在浏览器窗口中显示），并为其指定文件名。\n\n`Content-Type`\
  \ 头信息也告诉浏览器我们发送的是哪种类型的文件。\n\n在大多数情况下，`Content-Type` 应与所发送的文件类型匹配；然而，Internet Explorer\
  \ 5 和 Opera 浏览器有一个坏习惯：无论 `content-disposition` 头信息如何，它们都会在浏览器中显示已识别类型的文件，因此对于这些浏览器，我们将\
  \ MIME 类型设置为虚构的值 `application/x-download`。\n\n![Image 55](img/index-193_1.jpg)\n\
  \n![Image 56](img/index-193_2.png)\n\n文件处理\n\n171\n\n最后，`content-length` 头信息告诉浏览器文件的大小，以便它能够显示下载进度条。\n\
  \n#### 首先发送 HTTP 头信息！\n\n请记住，头信息必须在向浏览器发送任何其他内容之前发送。\n\n请注意，PHP 的输出控制函数在这里会很有帮助，17\
  \ 因为它们允许你按正确顺序向浏览器发送内容片段：你可以暂存 PHP 已发送的输出内容，同时让头信息通过并到达浏览器。\n\n## 讨论\n\n对于这类问题，没有完美的解决方案。例如，假设有人决定复制从你这里购买的图片，并在你不知情的情况下重新分发这些副本。几乎不可能阻止客户这样做，除非你提供专门为分发目的而修改的文件——例如添加水印。\n\
  \n尽管这个问题没有理想的解决方案，但了解一些不同的文件分发策略仍然很重要：\n\n- 通过电子邮件发送文件。这对于小文件来说是一个不错的选择，但电子邮件系统可能会限制用户可接收的文件大小，阻止某些类型的文件，并且运行垃圾邮件过滤器，可能会拦截你的邮件。\n\
  - 为客户提供一个唯一的链接，他们可以在有限的时间内（例如一周）使用该链接下载文件。如果下载尝试失败（例如，客户在下载过程中断开了互联网连接），这种策略允许他们重试。可以生成一个唯一的随机数，并将其用于下载的\
  \ URL 中。该数字对应于数据库中的一个条目，该条目在指定时间后过期。这种方法至少会限制文件被下载的次数，并应有助于防止通过同一 URL 重新分发文件。\n\n\
  17 http://www.php.net/outcontrol/\n\n172\n\nPHP 文集\n\n- 为客户提供用户名和密码组合，他们可以使用这些组合登录网站并下载自己的文件。这种方法在\
  \ SitePoint 的在线图书馆中特别有效，用于以 Adobe PDF 格式分发 SitePoint 的书籍。PDF 文件使用客户的电子邮件地址进行保护。这显然会阻止客户重新分发\
  \ PDF，因为很容易看出哪个账户被用于重新分发文件。\n\n正如我所说，这个问题没有完美的解决方案。然而，如果下载的文件本身内置了某种形式的安全保护，例如文档下载的密码、图像上的水印或软件包的许可证密钥，那么可以实现更好的保护。\n\
  \n## 如何使用 PHP 创建压缩的 ZIP/TAR 文件？\n\n也许你有一个包含许多文件或不同类型文件以及子目录的目录。在某些情况下，你可能需要创建整个目录的下载，并保留其原始结构。在基于\
  \ Unix 的系统上，创建此类下载的典型命令行方法是首先创建一个“归档”文件，例如 `.tar` 文件（`.tar` 文件是“磁带归档”，最初是为了帮助将文件系统备份到磁带而设计的），然后使用\
  \ `gzip` 或 `bzip2` 实用程序压缩该文件。\n\n## 解决方案\n\n在基于 *nix 的系统上，你通常使用命令行中可用的 `tar` 功能来创建这些文件。使用\
  \ PHP 的 `system` 函数，你可以从 PHP 脚本中执行这些命令，前提是你的 Web 服务器有权使用 `tar` 和 `gzip` 或 `bzip2`\
  \ 可执行文件。然而，你的服务器可能没有这些权限，因此在本解决方案中，我们选择使用 `PEAR::Archive_Tar` 包。该包允许你从数据库中存储的数据或\
  \ XML 文档中的节点创建归档，以及处理基本文件。\n\n![Image 57](img/index-195_1.jpg)\n\n![Image 58](img/index-195_2.png)\n\
  \n文件处理\n\n173\n\n#### 注意 E_STRICT 错误\n\n`PEAR::Archive_Tar` 包最初是为 PHP 4 开发的。如果你在\
  \ PHP 5 中启用了 `E_STRICT` 错误，则会收到关于传递对象时已弃用的引用使用的 `E_STRICT` 错误。\n\n#### 压缩简单文件\n\n\
  在此示例中，我们使用 `Archive_Tar` 类创建一个归档文件，并向其中添加文件。然后我们执行相反的操作——提取我们添加的所有文件：\n\n**tar.php\
  \ *(摘录)***\n\n```php\n<?php\n\nrequire_once 'Archive/Tar.php' ;\n\n$tar = new Archive_Tar('demo.tar.gz',\
  \ 'gz');\n\n$files = array(\n\n'example.ini',\n\n'writeSecureScripts.html'\n\n);\n\
  \n$tar->create($files);\n\necho 'Archive created';\n\n$tar2 = new Archive_Tar('demo.tar.gz');\n\
  \n$tar2->extract('demo');\n\necho 'Archive extracted';\n\n?>\n```\n\n这段代码相当简单。在实例化类时，构造函数的第二个参数告诉\
  \ `Archive_Tar` 使用哪种压缩类型（`gz` 用于 gzip 压缩，替代方案是 `bz2`，用于 bzip2 压缩）。如果不需要压缩，只需省略第二个参数。使用\
  \ `create` 方法时需要指定文件名数组，保持文件路径相对于脚本执行位置。文件压缩就是这样！\n\n提取过程实际上更简单。我们调用 `extract` 方法，并提供一个路径（同样相对于脚本位置）来指示方法提取归档的位置——在本例中，是子目录\
  \ `demo`。\n\n非常简单方便！\n\n174\n\nPHP 文集\n\n#### 压缩数据库数据\n\n`Archive_Tar` 特别有趣的一点是，它允许将字符串作为文件添加到归档中。这个假设的示例演示了网站文章数据库的归档——所有文章都从数据库中检索，每篇文章的正文文本存储在一个文本文件中，文件名与文章\
  \ ID 匹配：\n\n**tar2.php *(摘录)***\n\n```php\n$db = new PDO(DBHOST, DBUSER, DBPASS,\
  \ DBNAME);\n\n$tar = new Archive_Tar('demo/articles.tar.gz', 'gz'); $sql = \"SELECT\
  \ article_id, body FROM articles\"; foreach($db->query($sql) as $row)\n\n{\n\n$tar->addString('articles/'\
  \ . $row['article_id'] . '.txt', $row['body']);\n\n}\n\necho 'Article archive created';\n\
  ```\n\n\n\n\n在这里，我们使用 PHP 5 中可用的 `PDO` 类查询了数据库，并使用 `addString` 方法将获取的部分数据作为文件添加到归档中。\n\
  \n第一个参数表示字符串应存储的路径和文件名；第二个参数是字符串本身。这应该能让您大致了解 `Archive_Tar` 在何时对您有用。\n\n## 如何在 PHP\
  \ 5 中使用标准 PHP 库处理文件？\n\n随着 PHP 5 的发布，我们得以使用 SPL（标准 PHP 库）。\n\nSPL 是一个类和接口的库，旨在解决各种标准问题。您可能已经猜到，读取目录并获取其中包含的文件信息就是这样一个问题。\n\
  \n`DirectoryIterator` 类是 SPL 的一部分，是一种读取文件目录和检索文件信息的便捷方式。您还可以写入文件。\n\n此外，`DirectoryIterator`\
  \ 类有一个 `openFile` 方法，可以创建一个 `SplFileObject` 实例，方便您进行操作！不过，使用 `SplFileObject` 超出了我们在此解决方案中计划涵盖的范围，因此请务必查看\
  \ SPL 文档以了解更多信息。18\n\n## 解决方案\n\n在此示例中，我们使用 `DirectoryIterator` 类遍历文件目录，并发现关于 `example.ini`\
  \ 文件的所有信息：`dirIterator.php` *（摘录）*\n\n```php\n<?php\n\ntry\n{\n    // 将目录中的各种文件当作数组处理\n\
  \    foreach ( new DirectoryIterator('./') as $Item )\n    {\n        echo $Item.\"\
  \\n\";\n        // 告诉我关于这个文件的信息\n        if($Item->getFilename() == 'example.ini')\n\
  \        {\n            echo \"\\tProperties of example.ini\\n\";\n            echo\
  \ \"\\tFile name = \"\n                . $Item->getFilename() . \"\\n\";\n     \
  \       echo \"\\tPath = \"\n                . $Item->getPath()\n              \
  \  . \"\\n\";\n            echo \"\\tPath name = \"\n                . $Item->getPathname()\
  \ . \"\\n\";\n            echo \"\\tPermission = \" . $Item->getPerms()\n      \
  \          . \"\\n\";\n            echo \"\\tInod = \"\n                . $Item->getInode()\n\
  \                . \"\\n\";\n            echo \"\\tSize = \"\n                .\
  \ $Item->getSize()\n                . \"\\n\";\n            echo \"\\tOwner = \"\
  \n                . $Item->getOwner()\n                . \"\\n\";\n            echo\
  \ \"\\tGroup = \"\n                . $Item->getGroup()\n                . \"\\n\"\
  ;\n            echo \"\\tAtime = \"\n                . $Item->getATime()\n     \
  \           . \"\\n\";\n            echo \"\\tMtime = \"\n                . $Item->getMTime()\n\
  \                . \"\\n\";\n            echo \"\\tCTime = \"\n                .\
  \ $Item->getCTime()\n                . \"\\n\";\n            echo \"\\tType = \"\
  \n                . $Item->getType()\n                . \"\\n\";\n            echo\
  \ \"\\tWritable = \"\n                . $Item->isWritable()\n                . \"\
  \\n\";\n            echo \"\\tReadable = \"\n                . $Item->isReadable()\n\
  \                . \"\\n\";\n            echo \"\\tExecutable = \" . $Item->isExecutable()\
  \ . \"\\n\";\n            echo \"\\tIs file = \"\n                . $Item->isFile()\n\
  \                . \"\\n\";\n            echo \"\\tIs directory = \" . $Item->isDir()\n\
  \                . \"\\n\";\n            echo \"\\tIs link = \"\n              \
  \  . $Item->isLink()\n                . \"\\n\";\n            echo \"\\tIs dot =\
  \ \"\n                . $Item->isDot()\n                . \"\\n\";\n           \
  \ echo \"\\tTo string = \"\n                . $Item->__toString()\n            \
  \    . \"\\n\";\n            echo '------------------------------------------------'.\"\
  \\n\";\n            echo \"\\tFile contents = \\n\";\n            readfile($Item->getPathName());\n\
  \            echo '------------------------------------------------'.\"\\n\";\n\
  \        }\n    }\n    echo \"\\n\\nAll the class methods\\n\";\n    // 给我 DirectoryIterator\
  \ 可用的所有方法\n    foreach( get_class_methods('DirectoryIterator') as $methodName)\n\
  \    {\n        echo $methodName.\"\\n\";\n    }\n}\ncatch(Exception $e){\n    //\
  \ 处理异常\n    echo 'No files Found! Message returned: '.$e->getMessage().\"\\n\";\n\
  }\n?>\n```\n\n## 讨论\n\n我们以简单的 `try {…} catch {…}` 块开始代码，以处理在处理目录时可能发生的任何异常。19\n\n\
  接下来，我们在 `foreach` 循环中遇到了 `DirectoryIterator` 构造函数。`DirectoryIterator` 是迭代器设计模式的一种实现。20\
  \ 要使一个类实现迭代器设计模式，它必须提供一种按顺序访问实例化对象元素的方式。`DirectoryIterator` 对象可以像数组一样处理，也可以像对象一样处理。因此，我们可以将其放入\
  \ `foreach` 循环中，以遍历提供给构造函数的路径中的各种文件，这类似于我们在前面“如何用 PHP 检查目录？”一节中所做的操作。\n\n然后我们选择了一个文件（`example.ini`），并使用文件对象的方法查看了它的所有属性——获得了与前面“如何用\
  \ PHP 检查目录？”中基本相同的信息，但无需使用那么多 `if` 语句！\n\n19 异常通常被认为是更好的、面向对象的错误处理方式，并且被认为比我们之前看到的\
  \ `if` 块语句更可取。\n\n20 如果您还不知道什么是设计模式，别担心！网上有大量信息，例如维基百科：http://en.wikipedia.org/wiki/Iterator_pattern。PHP\
  \ 手册中也有关于迭代的条目：http://www.php.net/manual/en/language.oop5.iterations.php。\n\n最后，我们想要获取\
  \ `DirectoryIterator` 对象方法的完整列表。我们在另一个 `foreach` 循环中使用了 `get_class_methods` 函数来输出这些方法。\n\
  \n如果您想了解更多关于 `DirectoryIterator` 的信息，请先查看 SPL 文档和所有方法页面，21 尤其要注意用户评论。您还可以查看带有 UML（统一建模语言）图表的\
  \ SPL 文档，22 这将让您了解 SPL 中还有哪些其他可用功能。\n\n## 总结\n\n如您所见，处理文件并不难！实际上，一旦您知道该用什么以及如何使用，它就相当简单。PHP\
  \ 内置的文件系统和流功能、众多 PEAR 包以及 PHP 5 标准 PHP 库（SPL）都提供了许多与文件相关的工具。每个工具都能让您的工作更轻松——只是别让老板知道这到底有多简单！\n\
  \n21 http://www.php.net/spl/  \n22 http://www.php.net/~helly/php/ext/spl/\n\n# 第\
  \ 7 章：电子邮件\n\n构建在线应用不仅仅是向浏览器提供页面——这类应用通常还涉及电子邮件功能。电子邮件在 Web 应用中用于多种任务，包括发送定期通讯以保持与访客的联系，以及为用户注册系统提供自动通知。\n\
  \n一旦您知道如何在 PHP 中高效地创建电子邮件，就更容易为您的网站添加电子邮件功能，并与网站的访客进行沟通。\n\n## 如何发送一封简单的电子邮件？\n\n\
  您需要发送一封简单的文本电子邮件。它并不复杂——只是一条简短的消息来传递一些信息。让我们看看如何实现。\n\n## 解决方案\n\n有两种简单的方法可用。第一种使用\
  \ PHP 内置的 `mail` 函数，第二种依赖于 `PEAR::Mail` 包。\n\n#### 使用 PHP 的 `mail` 函数\n\n使用 PHP\
  \ 的 `mail` 函数发送简单的电子邮件很容易。1 您只需要一行代码就能发送消息——还有比这更简单的吗？下面是它的工作原理：`phpMail.php`\n\n\
  ```php\n<?php\nmail('you@yourdomain.com', 'Howdy', 'Glad to meet you.',\n     'From:\
  \ me@mydomain.com');\n?>\n```\n\n上面提供给 `mail` 函数的参数按顺序包含以下信息：\n\n- 我们发送电子邮件的地址\n\
