  \n## 引言\n\nPHP 是一种专门为构建网站而设计的编程语言，它既幸运又不幸地非常易于学习和使用。入门极其简单。不久之后，典型的初学者就能搭建一个简单的网站，并尝试通过\
  \ SourceForge1 等资源获得的大量开源项目。\n\n\n\n\n\n不幸的是，基于 PHP 的网站易于开发也意味着你可能会很快陷入困境。随着网站流量的增加——以及对更多功能和更高复杂性的需求——更深入地理解\
  \ PHP，并研究那些已在大型网站上证明成功的应用设计和技术，就显得尤为重要。当然，你不能指望一蹴而就，立刻掌握所有知识。即便你能做到，那又有什么乐趣呢？\n\n\
  在第一章中，我假设你已经掌握了 PHP 的基础知识，例如 SitePoint 的 PHP 入门书籍《使用 PHP 与 MySQL 构建自己的数据库驱动网站》前几章所提供的内容，因此我将重点放在\
  \ PHP 中“入门”的要点上。\n\n在本章中，你将了解在哪里寻求帮助——这是对那些冲你喊“去读手册！”的人的一种防御——并快速浏览 PHP 5 的面向对象语法和概念。这里并非所有内容都属于“基础”范畴——对于更有经验的\
  \ PHP 开发者来说，可能还会有一些惊喜，所以请睁大眼睛！\n\n不过要提醒你，虽然讨论 PHP 语法并非最令人振奋的主题，但它对于后续章节的准备至关重要。如果你开始感到吃力，请记住《龙威小子》中的教训：在学会鹤踢之前，你必须先学会“打蜡，擦蜡”。\n\
  \n## 我在哪里可以获得帮助？\n\nPHP 是使用最广泛的 Web 脚本语言，运行在超过 2000 万个网站上。对于一项缺乏任何企业资助的开源技术来说，它的流行似乎难以解释。然而，PHP\
  \ 的成功并不神秘；它拥有所有技术中最活跃、最乐于助人的在线社区之一。最近的估计显示，全球 PHP 开发者数量约为 50 万，考虑到媒介的性质，可以合理地假设其中很大一部分人活跃在线上。换句话说，对于基于\
  \ PHP 的网站开发者来说，帮助只需点击几下鼠标即可获得。\n\n## 解决方案\n\n如今，网上有大量 PHP 资源，其中最重要的就是官方 PHP 手册。3\n\
  \n### RTFM：阅读优秀的手册\n\n有一个著名的四个字母的缩写词 RTFM，它往往被用来骚扰计算领域各个方面的初学者。虽然我能理解老手们可能不愿意无休止地重复相同的、已有详细文档的说明，但我认为基本假设应该是我们首先都知道如何阅读手册。\n\
  \n2 http://www.sitepoint.com/books/phpmysql1/\n\n3 http://www.php.net/\n\n引言 3\n\
  \nPHP 的文档非常出色，由志愿者维护，他们致力于保持文档的更新、易懂和相关性。在线版本非常易于导航，并且包含来自全球开发者的注释形式的进一步知识。手册是 PHP\
  \ 真正卓越的领域之一；像 Sun 和 Microsoft 这样的软件公司要为其平台上的开发者提供这种质量的材料，还有很长的路要走。\n\n该手册还提供 24\
  \ 种不同语言版本，但既然你在阅读本书，我假设你满意英文版手册。它分为五个主要部分以及附录。了解哪些信息可以在哪里找到是值得的——至少在前五个部分中，这些部分对典型的\
  \ PHP 开发者最为相关。\n\n#### I. 入门指南 和 II. 安装与配置\n\n- http://www.php.net/getting-started/\n\
  - http://www.php.net/install/\n\n这些部分是真正初学者开始的地方。第一部分对 PHP 进行了基本介绍，解释了 PHP 是什么以及它能做什么，并提供了一个简单的教程来展示\
  \ PHP 的工作原理。第二部分详细展示了如何在各种操作系统上执行 PHP 的基本安装。\n\n#### III. 语言参考\n\n- http://www.php.net/langref/\n\
  \n本节涵盖了 PHP 作为编程语言的基础知识。其中一些对于你用 PHP 实现任何功能至关重要，而另一些则在你寻找改进技术的方法时变得有用。一口气读完整个部分可能就像读字典一样。幸运的是，通过阅读网上大量的教程以及检查开源\
  \ PHP 应用程序中使用的代码，可以吸收语言参考中包含的大部分信息。当然，当你阅读本书时，我希望你能学到一些关于如何充分利用 PHP 的技巧。然而，熟悉手册本节中包含的主题，并将其牢记在心以备将来参考，是值得的。\n\
  \n4 PHP 文集\n\n#### IV. 安全\n\n- http://www.php.net/security/\n\n对于初学者和有经验的编码人员来说，这都是非常重要的一章。它包含有关配置设置、文件系统和数据库安全以及一般“良好实践”的信息，是所有编码人员的必读内容。大多数安全问题源于代码本身，而非\
  \ PHP 本身，因此对任何编码人员来说，保持偏执是件好事！你在 PHP 编码经验中越早熟悉文档的这一部分，就越好。毕竟，养成好习惯比改掉坏习惯更容易。\n\n\
  #### V. 特性\n\n- http://www.php.net/features/\n\n本节涵盖了 PHP 的核心元素，这些元素通常专注于解决特定的 Web\
  \ 相关问题。特性部分的大部分内容读起来像“执行摘要”，从开发者的角度来看，当你看到它在实际应用中时——例如，在本书中我们将看到的示例中——这里包含的信息可能更容易理解。\n\
  \n#### VI. 函数参考\n\n- http://www.php.net/funcref/\n\n本节构成了手册的主体，涵盖了 PHP 中所有可用的功能方面。随着你对\
  \ PHP 的深入学习，你将在这里花费大部分时间，所以你会很高兴听到 PHP 团队已经做出了协调一致的努力，使本节易于使用。甚至在闲暇时，浏览手册并惊叹于你可以用\
  \ PHP 做的一切事情，也很有趣。是的，我*确实*刚刚把阅读手册描述为“有趣”！\n\n函数参考分为多个子部分，涵盖各种函数类别，每个类别对应一个 **PHP\
  \ 扩展**。除了核心语言语法之外，PHP 的大部分内容都被分组到代表离散功能的扩展中。\n\n引言 5\n\n#### PHP 扩展\n\n扩展的概念一开始可能有点令人困惑，因为许多扩展都随标准\
  \ PHP 安装一起分发。我们离不开的字符串函数就是一个例子。通常，PHP 团队会将他们认为对开发者至关重要的所有扩展作为默认 PHP 安装的一部分进行分发。\n\
  \n被视为非必要功能的扩展（即某些开发者需要，但并非所有开发者都需要）必须单独添加。每个扩展的重要信息出现在该扩展主页上的 **安装** 标题下。核心扩展无需安装，因为它们包含在\
  \ PHP 核心中；文档会通过“使用这些函数无需安装；它们是 PHP 核心的一部分”这句话明确说明这一点。非标准扩展可以在 **PECL 仓库** 中找到。4\
  \ PECL（PHP 扩展社区库）是所有已知 PHP 扩展的目录。\n\n查找和安装 PECL 扩展的过程在手册的安装与配置部分中进行了说明。\n\n\n\n\n\
  通过**搜索**字段（位于手册右上角）以及在**函数列表**中进行搜索，可以访问函数参考中的信息。\n\n注意：在函数列表中搜索仅检查手册的函数参考部分。要搜索整个手册，你需要在**在线文档**中进行搜索。\n\
  \n另一种浏览手册的便捷方式是通过 URL 直接跳转到你感兴趣的主题名称。例如，尝试在浏览器的地址栏中输入：`http://www.php.net/strings/`。这将带你到`http://www.php.net/manual/en/ref.strings.php`，这是字符串扩展的主页。在页面底部，你会看到该扩展提供的所有函数列表。\n\
  \n以`strpos`函数为例，输入 URL `http://www.php.net/strpos/`（它会带你到`http://www.php.net/manual/en/function.strpos.php`）。你会看到如图\
  \ 1.1 所示的信息。\n\n![图 11](img/index-28_1.jpg)\n\n图 1.1. php.net 上`strpos`的文档页面。第一行包含函数名称，第二行列出了该函数可用的\
  \ PHP 版本。第三行告诉我们该函数实际的作用。在这个例子中，这是一个相当简洁的解释，但`strpos`确实不是一个能让很多人兴奋的主题。\n\n在**描述**标题下，也许是最重要的一行——函数的**签名**。签名描述了**参数**——该函数接受的必要和可选值——以及**返回值**，即函数运行后我们收到的值。从左到右阅读，我们有`int`，它告诉我们函数返回的值是一个整数（在本例中，是一段文本在另一段文本中的位置）。接下来是函数本身的名称，然后在括号内，是该函数接受的参数，用逗号分隔。\n\
  \n让我们看看参数`string $haystack`。这表示第一个**参数**——提供给参数的值——应该是一个字符串值，而`$haystack`只是给参数命名，以便在详细描述中引用。注意第三个参数放在方括号内，这意味着它是可选的（即你不必提供这个参数）。下面是一个简单的例子，展示了这个函数的工作方式：\n\
  \n```php\nhelloworld.php\n<?php\n$haystack = 'Hello World!';\n$needle   = 'orld';\n\
  $position = strpos($haystack, $needle);\necho 'The substring \"' . $needle . '\"\
  \ in \"' .\n     $haystack . '\" begins at character ' . $position;\n?>\n```\n\n\
  注意，这里我使用`strpos`的方式与手册中出现的类似。我使用了变量名`$haystack`和`$needle`来明确每个变量与手册解释的关系，但你可以使用任何你喜欢的变量名。\n\
  \n函数签名约定在整个手册中一致使用，因此一旦你习惯了，就能快速掌握如何使用你之前未尝试过的函数。\n\n## 用户评论\n\n你会在手册每页的底部找到用户提交的评论。通常，至少你会看到一个展示函数用法的示例——这些信息可能解决你遇到的特定难题。在许多情况下，你还会找到函数的替代解释和用法，这有助于拓宽你的理解。请记住，用户评论不是官方文档的一部分，因此有些评论可能不完全真实。通常，任何事实存疑的评论后来都会被纠正和澄清。\n\
  \n## 其他资源\n\n在手册之外，还有成千上万的在线资源可以为你提供进一步的帮助。我敢说，你在 PHP 中遇到的 99%的常见问题都已经被某人在某处遇到过，并且他们的解决方案可以在网上找到。这意味着最明显（但有时被遗忘）的起点是谷歌，在那里快速搜索\
  \ PHP `strpos`问题会让你明白我的意思。\n\n还有一些优秀的网站，你可以直接从其他 PHP 开发者那里获得答案（当然是免费的——这是 PHP 精神的一部分）。也许最大的三个英语资源是：\n\
  \n- SitePoint 论坛，位于`http://www.sitepointforums.com/`\n- Dev Shed 论坛，位于`http://forums.devshed.com/`\n\
  - phpBuilder，位于`http://www.phpbuilder.com/board/`\n\n这些网站都托管在线讨论，因此拥有非常友好、易于使用的界面。所有网站都有非常活跃的会员，你应该能在\
  \ 24 小时内得到大多数问题的答案。在你发布问题或使用后面列出的其他方法寻求帮助之前，请务必阅读*如何聪明地提问*，以帮助你为问题做好功课。5\n\n注意，当你在论坛上寻求帮助时，帮助他人自助的原则就凸显出来了。初学者在发布问题时最常犯的错误之一是发布一条消息说“这个脚本有问题”，然后在下面粘贴整个\
  \ PHP 脚本。相反，更好的做法是缩小问题范围——确定你遇到问题的区域，并粘贴这段代码片段，同时附上其他相关信息，如错误消息、代码目的、操作系统等。提供帮助的人通常不想在你的问题上花费超过几分钟的时间（毕竟他们是免费帮忙），所以节省他们的时间将提高你获得有用答案的机会。\n\
  \n对于拥有 IRC（互联网中继聊天）客户端的人来说，还有许多专门用于 PHP 开发的 IRC 频道。两个比较流行的频道是`efnet.org`上的`#php`6\
  \ 和`freenode.net`上的`##php`7。这些资源可以为你的问题提供即时帮助，但和论坛一样，频道的用户会期望你事先做好功课。\n\n不太方便，但也许最有效的最后手段是\
  \ PHP 邮件列表 8，其中鼓励初学者使用 PHP 通用用户列表 9。这些列表可供有限浏览，但可以使用 PHP 网站上的搜索工具搜索其中一些列表，并从搜索结果中选择你想要的列表。\n\
  \nZend10，开发 PHP 引擎核心的公司，也托管了一个相当活跃的论坛，用于解答一般的 PHP 问题 11。当然，如果你想要一个保证的答案，值得考虑付费支持选项。更多信息可以在\
  \ Zend Network 网站上找到 12。\n\n## 什么是 OOP？\n\n仅仅处理面向对象编程（OOP）的基础知识就足以构成一整本书——而且市面上有很多这样的书可以证明！任何关于面向对象编程的讨论都可能涵盖大量信息，因此本节将提供一个快速概述，帮助你理解基本概念，并为本书的其余部分做好准备。它并非旨在成为全面的入门指南，而是旨在引导你进入\
  \ OOP 的世界。\n\n## 解决方案\n\n**面向对象编程**范式是一种编程方法，旨在鼓励开发结构良好且可维护的应用程序。许多 PHP 编码者将面向对象编程视为某种神秘的艺术，因为\
  \ PHP 的示例经常只使用**过程式**方法。13\n\n\n\n这很可惜，因为采用面向对象的方法开发 PHP 应用程序能带来诸多好处，其中最重要的或许是**代码复用**。一段编写良好的面向对象代码可以轻松地用于解决其他项目中的相同问题；我们只需在需要时将其插入即可。目前有越来越多的面向对象代码仓库——例如\
  \ PEAR¹⁴ 和 PHP Classes¹⁵——它们能帮你节省大量处理常见问题的时间，让你可以专注于应用程序的具体细节。\n\n随着 PHP 5 的发布，我们获得了一个大幅增强的对象模型，它提供了比\
  \ PHP 4 更出色的性能和特性。实际上，学习使用 PHP 提供的对象模型需要我们实现两个目标，这两个目标通常必须同时进行：\n\n- 你需要学习 PHP 类语法和面向对象术语。\n\
  - 你必须在思维上从过程式代码跃迁到面向对象代码。\n\n第一步很容易；毕竟，这只是记忆的问题。第二步——思维跃迁——既容易又具有挑战性。一旦你完成跃迁，你将不再思考单个脚本应完成的一长串任务；相反，你会将编程视为组装一组工具，你的脚本将把工作委托给这些工具。\n\
  \n## 类详解\n\n**类**是某事物的通用蓝图。“什么东西的蓝图？”你可能会问。嗯，几乎任何东西：汽车、客户、产品、按钮；任何与应用程序相关的对象。类实际上并不是对象。相反，它定义了对象的**方法**（或行为）和**属性**（或特征、状态）。类是用来创建对象的计划，就像汽车的蓝图用来制造汽车一样——它只是实现所需产品的计划。\n\
  \nPHP 手册包含了大量关于 OOP 的信息¹⁶，但如果你对 OOP 一无所知，那么理解它的最佳起点是基本的 PHP 类语法¹⁷。让我们通过自己创建一个类来更仔细地了解类。\n\
  \n让我们创建一个非常简单的类，名为 `HTMLParagraph`，它输出一个 HTML 段落元素。现在，你可能会想：“一个只做这么点事的类有什么用？”\n\n\
  但请耐心听我介绍——我保证它会逐渐变得有用！\n\n¹⁴ http://pear.php.net/\n¹⁵ http://www.phpclasses.org/\n\
  ¹⁶ http://www.php.net/oop5/\n¹⁷ http://www.php.net/manual/en/language.oop5.basic.php\n\
  \n首先，我们从关键字 `class` 开始，后面跟着类的名称——在本例中是 `HTMLParagraph`。然后我们使用花括号来界定类的开始和结束：\n\n\
  **HTMLParagraph.php（节选）**\n\n```php\n<?php\n\nclass HTMLParagraph\n{\n    ⋮ *属性和方法写在这里*\n\
  }\n\n?>\n```\n\n我们可以在这些花括号之间添加属性和方法。属性，也称为**成员变量**，是从这个类创建的对象将拥有的特征。它们保存对象运行所需的数据值。例如，从\
  \ `HTMLParagraph` 类创建的对象需要一个属性来存储段落的内容。我们使用 `private` 修饰符将这个属性声明为私有，稍后我们会讨论这个修饰符。按照惯例，并且为了可读性，属性在类的开头声明：\n\
  \n**HTMLParagraph.php（节选）**\n\n```php\n<?php\n\nclass HTMLParagraph\n{\n    private\
  \ $content;\n    ⋮ *方法写在这里*\n}\n\n?>\n```\n\n方法描述了对象将允许我们执行的操作。类的方法包含对象运行所需的指令。\n\
  \n让我们向 `HTMLParagraph` 类添加一些方法：\n\n**HTMLParagraph.php（节选）**\n\n```php\n<?php\n\n\
  class HTMLParagraph\n{\n    private $content;\n\n    public function __construct($content\
  \ = '')\n    {\n        $this->content = $content;\n    }\n\n    public function\
  \ getSource()\n    {\n        return '<p>' . $this->content . '</p>';\n    }\n\n\
  \    ⋮ *可能还有更多方法写在这里*\n}\n\n?>\n```\n\n这里，我们向类添加了两个方法——`__construct` 和 `getSource`。\n\
  \n`__construct` 是一个特殊方法，用于初始化我们的对象，而 `getSource` 是一个允许我们的 `HTMLParagraph` 对象实现其目的的方法：以\
  \ HTML 格式编写段落元素。\n\n方法可以被视为通信：一个对象可以调用另一个对象的方法并收到返回的答案。例如，一个对象可以调用从我们的 `HTMLParagraph`\
  \ 类创建的对象上的 `getSource` 方法，并收到段落元素的 HTML 源代码作为响应。`HTMLParagraph` 对象为我们处理所有细节。\n\n\
  正如我们所见，方法是类的实际工作者——它的行为或动作。\n\n例如，我们的 `HTMLParagraph` 类有一个 `getSource` 方法，用于将内容组装成有效的\
  \ HTML 段落元素。方法的工作是只做一件事，并且只做一件事——并且把它做好。\n\n方法的语法很简单（注意方括号表示可选语法）：\n\n```\npublic|protected|private\
  \ [static] function methodName([$param1[, $param2]]){…}\n```\n\n## 封装与可见性\n\n**封装**是面向对象编程的一个基本概念，它规定类应该有一个公共接口和一个私有实现。**公共接口**是外观——简单来说，就是从该类创建的对象所拥有的方法和属性，所有其他对象都可以看到和使用它们。**私有实现**指的是类的内部工作方式，只有从该类创建的对象才需要知道。将类的内部工作方式与外部外观分离，对于生成高质量的面向对象代码至关重要。\n\
  \n你的类的用户应该能够使用类的公共接口，即 **API**（应用程序编程接口），而不关心内部实现，并且确信他们能获得期望的输出。对用户隐藏类的内部工作方式，确保我们可以随着时间的推移根据需要更改这些内部实现——修复错误、提高性能或完全改变方法的实现方式——而不会对用户造成干扰或破坏。将类视为一个黑盒：用户只需将数据输入对象，就能得到他们想要的结果。\n\
  \n我们通过描述属性和方法的**可见性**来指示类的公共接口和私有实现——简而言之，描述谁可以看到和访问它们。PHP 5 有三个可见性级别：public、protected\
  \ 和 private。\n\n**public 可见性**级别允许任何对象或脚本看到并使用该属性或方法¹⁸。**protected 可见性**意味着只有那些继承（我们将在后续章节讨论继承的概念）自该类的类以及该类本身才能看到该属性或方法。**private\
  \ 可见性**级别描述的是只有该类本身才能看到该方法或属性的情况。注意，在我们的示例类中，属性是私有的，而方法是公有的。\n\n¹⁸ 实际上，public 方法也可以被脚本中的过程式代码调用，但这里我们专注于面向对象的上下文。\n\
  \n\n\n\n当你开始学习面向对象编程时，常常会有一种诱惑，想把所有类都设为公开，完全不去考虑封装。然而，让类的其他使用者知道该类应该如何被使用以及他们可以期待哪些行为是很重要的——他们会假设所有公开的内容都是安全可用的。显然，如果你随后更改了这些公开的类，可能会引发很多问题！因此，为了实现封装的目标，我们必须将所有属性和方法的可见性降低到尽可能低的级别。\n\
  \n## 构造函数和析构函数\n\n**构造函数**是一种特殊的方法，在我们首次**实例化**或创建对象时使用。无论类名是什么，构造函数方法都命名为 `__construct`。由于构造函数是在我们从类创建对象时调用的，因此我们在此方法中设置对象属性的任何默认值——这些属性也称为**实例变量**，即类的特定实例的属性——或者初始化对象所需的任何其他内容。在我们的示例类中，我们初始化了创建段落元素所需的各种属性。另一个常见的例子是购物车的订单类——购物车在\
  \ `__construct` 方法中初始化，其中设置客户编号，将购物车中的商品数量设为零，并将购物车余额设为零美元。\n\n**析构函数**是构造函数的补充。与构造函数一样，析构函数有一个特殊的名称\
  \ `__destruct`，无论类名是什么都使用它。\n\n`__destruct` 也是一种特殊方法，在对象被销毁之前立即运行。在析构函数中，我们处理所有未完成的事务，例如关闭数据库连接或文件句柄。\n\
  \n## 魔术方法\n\n`__construct` 和 `__destruct` 是所谓的**魔术方法**的示例。\n\n魔术方法是一组执行特殊内部 PHP\
  \ 类功能的方法。它们都以 `__`（双下划线）开头，你可以在 PHP 手册中了解更多关于它们的信息。例如，当从类创建的对象被转换为字符串时，会调用 `__toString`\
  \ 方法。正如你将看到的，这非常有用。\n\n## 创建对象\n\n现在我们已经知道什么是类，是时候谈谈对象了。正如我们在本章前面看到的，对象是使用类作为蓝图创建（或在面向对象术语中称为*实例化*）出来的东西。因此，对象是类的实际实现。正因为如此，我们可以实例化同一个类的多个对象，每个对象都有自己独特的特征和状态——就像单个蓝图可以用来建造多辆汽车一样。这些汽车可能都是相同的品牌和型号，但它们以不同的速度行驶，并且总里程数不同。\n\
  \n让我们看一些有助于澄清对象概念的代码：\n\n**HTMLParagraph.php（节选）**\n\n```\n$para = new HTMLParagraph('Hello\
  \ world!');\necho $para->getSource();\n```\n\n在上面的第一行中，我使用 `new` 关键字实例化对象，并确保传递构造函数所需的任何数据。基本上，这行代码指示\
  \ PHP 使用 `HTMLParagraph` 类创建一个新对象，并将该对象放入 `$para` 变量中。\n\n由于 `$para` 中的对象是 `HTMLParagraph`\
  \ 类的实现，因此它具有该类的所有功能和属性。上述代码的输出将是：\n\n```\n<p>Hello world!</p>\n```\n\n## `$this`\
  \ 变量\n\n现在我们理解了对象和类之间的区别，我想稍微回溯一下。在 `HTMLParagraph` 类文件中，你会发现 `$this` 变量出现在类方法中——例如\
  \ `getSource` 方法：\n\n**HTMLParagraph.php（节选）**\n\n```\npublic function getSource()\n\
  {\n    return '<p>' . $this->content . '</p>';\n}\n```\n\n在任何方法（包括构造函数）中，`$this`\
  \ 变量指向该方法正在运行的对象，并允许该方法访问属于该特定对象的其他方法和变量。因此，即使我们可能有两个 `HTMLParagraph` 对象运行相同的类函数代码，当我们对其中一个调用\
  \ `getSource` 函数时，`$this` 将指向拥有我们调用的函数的对象——即我们正在检索 HTML 源代码的那个对象。另一个对象的连接将保持打开状态。\n\
  \n`->`（箭头）运算符是我们用来访问对象中命名的属性或方法的语法。你可以在脚本中以及对象内部使用此运算符来访问对象自身的属性和方法。\n\n## 将对象视为字符串\n\
  \n如果你还记得，当从类创建的对象被转换为字符串时，会调用 `__toString` 方法。这对我们的 `HTMLParagraph` 来说非常方便，因为它允许我们的段落对象用于字符串拼接。这是我们的\
  \ `__toString` 方法：\n\n**HTMLParagraph.php（节选）**\n\n```\npublic function __toString()\n\
  {\n    return $this->getSource();\n}\n```\n\n我们的 `__toString` 方法调用 `getSource` 方法，该方法返回段落的\
  \ HTML 源代码。所以现在可以这样使用它：\n\n**HTMLParagraph.php（节选）**\n\n```\n<?php\n$para2 = new\
  \ HTMLParagraph('The __toString method makes life' .\n                         \
  \  ' easy!');\necho \"<h1>The Magic __toString Method</h1>\\n\";\necho $para2;\n\
  ?>\n```\n\n上述代码的输出将是：\n\n```\n<h1>The Magic __toString Method</h1>\n<p>The __toString\
  \ method makes life easy!</p>\n```\n\n## 继承\n\n**继承**是面向对象范式的另一个基本组成部分，也是其表达力的重要方面。该术语指的是一种关系，其中一个类被定义为另一个类的**子类**或**派生类**。子类继承**父类**中定义的方法和属性，并且可以更改它们或添加自己的方法。继承允许你定义希望所有子类共享的类的公共方法和属性。\n\
  \n我们的 `HTMLParagraph` 类创建了一个合适的 HTML 段落元素，但除了段落之外，还有很多 HTML 元素，它们都有一些共同的特征。让我们创建一个名为\
  \ `HTMLElement` 的父类，并添加所有公共方法和属性：\n\n**HTMLElement.class.php（节选）**\n\n```\n<?php\n\
  class HTMLElement\n{\n    protected $content;\n    protected $tagname;\n    protected\
  \ $attributes;\n}\n```\n\n考虑到 HTML 元素的公共属性，我们添加了两个新属性 `$tagname` 和 `$attributes`，分别用于存储\
  \ `HTMLElement` 的标签名称和属性。注意，我将这些属性声明为 `protected`。这允许子类访问以重新定义它们。如果我们将属性声明为 `private`，子类将无法访问它们。\n\
  \n`__construct` 方法现在接受第二个参数用于元素属性：\n\n**HTMLElement.class.php（节选）**\n\n```\npublic\
  \ function __construct($content, $attributes = array())\n{\n    $this->content =\
  \ $content;\n    $this->attributes = $attributes;\n}\n```\n\n只要定义了 `$tagname` 属性，我们新的\
  \ `getSource` 方法就具备了为任何 HTML 元素生成源代码的所有智能：\n\n**HTMLElement.class.php（节选）**\n\n\
  ```\npublic function getSource()\n{\n    return '<' . $this->tagname . $this->getAttributeSource()\
  \ . '>' .\n           $this->content .\n           '</' . $this->tagname . '>';\n\
  }\n```\n\n`getSource` 方法还会遍历属性数组，并为元素的属性组装 HTML 源代码字符串。它通过调用 `getAttributeSource`\
  \ 方法来实现这一点。\n\n\n\n\n\n`getAttributeSource`方法构建并返回 HTML 元素属性的源字符串（如果有的话）：\n\n`HTMLElement.class.php\
  \ (excerpt)`\n\n```php\npublic function getAttributeSource()\n{\n    $attributes\
  \ = '';\n    if (count($this->attributes)) {\n        foreach ($this->attributes\
  \ as $attrnme => $attrval)\n        {\n            $attributes .= ' ' . $attrnme\
  \ . '=\"' . $attrval . '\"';\n        }\n    }\n    return $attributes;\n}\n```\n\
  \n最后，`__toString`魔术方法与之前的版本保持一致——它已经完成了我们需要的工作，并且可以用于任何 HTML 元素：\n\n## 引言 19\n\n\
  `HTMLElement.class.php (excerpt)`\n\n```php\npublic function __toString()\n{\n \
  \   return $this->getSource();\n}\n}\n?>\n```\n\n可以看到，将`HTMLParagraph`类标记为`HTMLElement`的子类，比从头构建`HTMLParagraph`类要容易得多——大部分工作已经为我们完成。我们使用`extends`关键字来表示这种关系：\n\
  \n`HTMLParagraph.class.php (excerpt)`\n\n```php\n<?php\nrequire_once 'HTMLElement.class.php';\n\
  class HTMLParagraph extends HTMLElement\n{\n    protected $tagname = 'p';\n    public\
  \ function __construct($content, $attributes = array())\n    {\n        parent::__construct($content,\
  \ $attributes);\n    }\n}\n?>\n```\n\n现在`HTMLParagraph`是`HTMLElement`的子类。或者，我们可以说`HTMLElement`是`HTMLParagraph`的父类或**超类**。我们重新定义了`$tagname`属性并修改了构造函数。暂时忽略`parent::__construct($content,\
  \ $attributes);`这部分，我很快就会解释。\n\n现在我们可以实例化子类，访问`getSource`方法，并且由于我们重新定义了`$tagname`属性，HTML\
  \ 源代码会正确地输出为 HTML 段落元素：\n\n20\n\n`childClass.php (excerpt)`\n\n```php\n<?php\nrequire\
  \ 'HTMLParagraph.class.php';\n$para = new HTMLParagraph(\"The object oriented programming\\\
  n\" .\n    \" paradigm is an approach to programming that's intended\\n\" .\n  \
  \  \" to encourage the development of well-structured and\\n\" .\n    \" maintainable\
  \ applications.\",\n    array(\n        'id' => 'oop_intro',\n        'class' =>\
  \ 'introduction'\n    )\n);\necho \"<h1>OOP in PHP 5</h1>\\n\"; echo $para;\n?>\n\
  ```\n\n上述代码的输出将是：\n\n```html\n<h1>OOP in PHP 5</h1>\n<p id=\"oop_intro\" class=\"\
  introduction\">The object oriented\n➥ programming\nparadigm is an approach to programming\
  \ that's intended to encourage the development of well-structured and\nmaintainable\
  \ applications.</p>\n```\n\n这个例子展示了继承的基本原理，但如果不讨论**覆盖**——子类修改父类方法和属性的机制——就无法展示这种能力的真正威力。\n\
  \n## 覆盖方法和属性\n\n在子类中给方法或属性赋予与父类相同的名称，或者覆盖该方法或属性，是完全允许的。在我们的`HTMLParagraph`类中，我们覆盖了父类`HTMLElement`的`$tagname`属性。当我们调用`HTMLParagraph->getSource`并获取`$tagname`值时，它会检索到被覆盖的值`p`。\n\
  \n为了演示，让我们创建另一个子类：`HTMLImage`类。\n\nHTML 图像标签的构造略有不同——它们没有结束标签——因此我们需要覆盖`getSource`方法来处理这种特殊情况：\n\
  \n![Image 12](img/index-43_1.jpg)\n\n![Image 13](img/index-43_2.png)\n\n21\n\n`HTMLImage.class.php\
  \ (excerpt)`\n\n```php\n<?php\nclass HTMLImage extends HTMLElement\n{\n    ⋮ *the\
  \ usual properties and constructor function* public function getSource()\n    {\n\
  \        return '<'. $this->tagname . $this->getAttributeSource() .' />';\n    }\n\
  ```\n\n### 覆盖方法？注意参数！\n\n当子类覆盖方法时，PHP 更倾向于（尽管不强制要求）子类方法具有与父类方法相同数量的参数。如果子类和父类版本的方法参数数量不同，你的代码在面向对象编程方面仍然是完全合法的，并且仍然可以正常运行。但是，如果在`php.ini`中启用了`E_STRICT`警告，则会导致`E_STRICT`错误出现。20\n\
  \n你也可以让子类在内部使用父类的方法或属性，即使是在覆盖它的情况下。为了确保我们的类生成高质量的 HTML，我希望所有图像元素都包含`alt`属性，即使只是为了提醒开发者缺少该属性。我们将覆盖`getAttributeSource`方法：\n\
  \n`HTMLImage.class.php (excerpt)`\n\n```php\npublic function getAttributeSource()\n\
  {\n    if (!array_key_exists('alt',$this->attributes)) {\n        $this->attributes['alt']\
  \ = 'This image needs alt text';\n    }\n    return parent::getAttributeSource();\n\
  }\n}\n?>\n```\n\n20 `E_STRICT`警告在 PHP 手册中被定义为“运行时通知。启用[这些通知]可以让 PHP 建议更改……以确保代码的最佳互操作性和向前兼容性。”\
  \ [http://www.php.net/errorfunc/]\n\n![Image 14](img/index-44_1.png)\n\n![Image\
  \ 15](img/index-44_2.jpg)\n\n22\n\n我们可以使用`parent`关键字和`::`运算符来调用父类的方法。这个技巧避免了重复父类中已有的功能。注意，我们也可以通过父类的名称来达到完全相同的结果。例如，上面的父类方法调用也可以写成这样：\n\
  \n```php\nreturn HTMLElement::getAttributeSource();\n```\n\n这里，我们用`HTMLElement`类的名称替换了`parent`关键字。虽然输出完全相同，但使用`parent`可以避免在子类中记住父类的名称，并且是推荐的语法。21\n\
  \n### 覆盖构造函数\n\n大多数面向对象语言（例如 Java）会自动运行给定父类的构造函数，然后再运行子类中覆盖的构造函数。这种行为称为**级联构造函数**。\n\
  \nPHP 没有这个特性。如果你在 PHP 的子类中创建构造函数，请注意你完全覆盖了父类的构造函数。如果你希望父类处理对象初始化的一部分，必须在新构造函数中显式调用该构造函数，例如使用`parent::__construct()`。\n\
  \n我们可以在下面的例子中看到覆盖的实际应用：\n\n`overriding.php (excerpt)`\n\n```php\n<?php\nrequire\
  \ 'HTMLImage.class.php';\n$logo = new HTMLImage('',\n    array(\n        'id' =>\
  \ 'logo',\n        'src' => 'php.gif'\n    )\n);\necho $logo;\n?>\n```\n\n21 PHP\
  \ 的双冒号运算符（`::`）被称为**作用域解析运算符**，或*Paamayim Nekudotayim*。这可能是双冒号的一个奇怪命名，但在编写 Zend\
  \ Engine 0.5（驱动 PHP 3）时，Zend 团队决定这样称呼它。实际上，它在希伯来语中的意思就是双冒号！\n\n23\n\n上述代码将输出以下内容：\n\
  \n```html\n<img id=\"logo\" src=\"php.gif\" alt=\"This image needs alt text\" />\n\
  ```\n\n如果你检查输出，可以看到`HTMLImage->getAttributeSource`方法按照我们的意图输出了适当的属性。\n\n## 对象聚合与组合\n\
  \n除了继承之外，对象还可以通过其他方式交互；例如，一个对象可以通过创建要使用的对象或通过方法的参数接收对象来使用另一个对象执行功能。这种交互展示了面向对象范式的表达能力。\n\
  \n一个对象使用另一个对象有两种方式：聚合和组合。\n\n### 聚合\n\n**聚合**发生在一个对象被“临时借用”给另一个对象时。第二个对象通常通过第一个对象的某个方法（例如构造函数）传递给第一个对象。然后第一个对象能够调用第二个对象中的方法，这意味着它可以利用第二个对象中存储的功能来实现自己的目的。\n\
  \n\n\n\n\n# 简介\n\n让我们看一个聚合的实际例子。我们将构建一个 `HTMLUnorderedList` 类，它可以持有一个 `HTMLListItem`\
  \ 对象的数组。`HTMLListItem` 类是父类 `HTMLElement` 的一个简单扩展：\n\n`HTMLListItem.class.php` *（摘录）*\n\
  \n```php\n<?php\n\nrequire_once 'HTMLElement.class.php';\n\nclass HTMLListItem extends\
  \ HTMLElement\n\n{\n\nprotected $tagname = 'li';\n\n24\n\nThe PHP Anthology\n\n\
  public function __construct($content, $attributes = array())\n\n{\n\nparent::__construct($content,\
  \ $attributes);\n\n}\n\n}\n\n?>\n```\n\n然而，`HTMLUnorderedList` 类有一个新的属性和方法：`HTMLUnorderdList.class.php`\
  \ *（摘录）*\n\n```php\n<?php\n\nrequire_once 'HTMLListItem.class.php';\n\nclass HTMLUnorderedList\
  \ extends HTMLElement\n\n{\n\n⋮ *其他属性…*\n\nprivate $items = array();\n\n⋮ *构造方法…*\n\
  \npublic function addListItem(HTMLListItem $item)\n\n{\n\n$this->items[] = $item;\n\
  \n}\n\npublic function getSource()\n\n{\n\nif (count($this->items)) {\n\n$this->content\
  \ = '';\n\nforeach ($this->items as $item)\n\n{\n\n$this->content .= $item->getSource();\n\
  \n}\n\n}\n\nreturn parent::getSource();\n\n}\n\n}\n\n?>\n```\n\n`addListItem` 方法接受一个\
  \ `HTMLListItem` 对象作为参数，并将其添加到存储在 `$items` 属性中的列表项数组中。`getSource` 方法\n\n![图 16](img/index-47_1.jpg)\n\
  \n![图 17](img/index-47_2.png)\n\n简介\n\n25\n\n也被重写，以便能够使用列表项构建 HTML 列表元素。\n\n## 类型提示揭秘\n\
  \n如你所见，我在 `addListItem` 方法中使用了**类型提示**。类型提示是一种规范，要求方法的参数必须是某个指定类的对象。如果脚本没有向构造函数传递指定类型的对象，就会引发致命错误（或者在\
  \ PHP 5.2 中是可恢复的错误）。在示例函数 `addListItem(HTMLListItem $item)` 中，要求脚本向构造函数传递一个 `HTMLListItem`\
  \ 对象。\n\n类型提示也可以应用于对象接口，我们将在“对象接口”一节中讨论。实际上，PHP 编程中的惯例是只对接口进行类型提示，*而不是*具体的类实现。不过，在我们简单的\
  \ OOP 介绍中这样做是可以理解的。\n\n## 组合\n\n**组合**描述了一种面向对象编程风格，其中一个对象完全拥有另一个对象——也就是说，第一个对象负责实例化第二个对象。在许多情况下，组合都很有用，尽管它最常用于第一个对象可能是唯一需要使用第二个对象的情况。\n\
  \n例如，让我们创建一个类来表示网站徽标图形。我们希望该类能够输出徽标图像的 HTML，为此，它使用我们的 `HTMLImage` 类，如下所示：\n\n`WebsiteLogo.class.php`\
  \ *（摘录）*\n\n```php\n<?php\n\nrequire_once 'HTMLImage.class.php';\n\nclass WebsiteLogo\n\
  \n{\n\nprivate $img;\n\npublic function __construct($imagesrc, $title, $alt)\n\n\
  {\n\n$this->img = new HTMLImage('',array('src' => $imagesrc,\n\n'title' => $title,\n\
  \n'alt' => $alt,\n\n'class' => 'sitelogo'));\n\n26\n\nThe PHP Anthology\n\n}\n\n\
  public function getSource()\n\n{\n\nreturn $this->img->getSource();\n\n}\n\npublic\
  \ function __toString()\n\n{\n\nreturn $this->getSource();\n\n}\n\n}\n\n?>\n```\n\
  \n由于 `HTMLImage` 类已经知道如何编写图像标签的 HTML，我们可以使用 `HTMLImage` 的实例，只需为我们的网站徽标图形提供正确的图像源、标题和替代文本。我们还能够在网站徽标的\
  \ `<img>` 标签中强制输出特定的类名。当调用 `WebsiteLogo->getSource` 方法时，它只是调用 `HTMLImage` 对象的 `getSource`\
  \ 方法。\n\n## 使用聚合与组合：优势与陷阱\n\n在实际开发中，知道何时应用聚合或组合非常重要。如何判断对象 A 应该聚合还是组合对象 B？问问自己：“如果对象\
  \ A 消亡了，对象 B 还会存活吗？”如果对象 B 需要在对象 A 消亡后继续存在，那么对象 A 应该聚合对象 B。但如果对象 B 在对象 A 消亡时也随之消亡更好，那么对象\
  \ A 应该组合对象 B。\n\n聚合的优势在于开销比组合低，因为单个对象可以被多个其他对象共享。聚合你的数据库连接类当然是个好主意；如果每个想要执行查询的对象都组合它，可能会导致多个数据库连接，这会在高流量时导致应用程序运行缓慢。\n\
  \n组合使类更易于使用，因为它们是自包含的。使用该类的代码不必担心传递它所需的其他对象，这在复杂应用程序中往往会变得非常棘手，以至于需要开发设计变通方案。组合的另一个优点是，在使用它的代码中，我们确切知道哪个类可以访问被组合的对象。\n\
  \n聚合的一个问题是，共享聚合对象的某个对象可能会修改其状态，导致该对象无法被其他应该使用它的类使用。\n\n组合会在两个对象之间产生更紧密的**耦合**——即更大的依赖性——使得在不依赖另一个的情况下重用其中一个变得更加困难。\n\
  \n## 多态\n\n面向对象编程的另一个强大方面是**多态**——不同对象共享接口并因此变得可互换的能力。\n\n**接口**是指一个或多个方法的名称，这些方法允许你将类用于特定目的。例如，假设你有两个数据库连接类——一个用于\
  \ MySQL，一个用于 PostgreSQL。只要它们都提供了 `query` 方法，你就可以互换地使用它们在不同数据库上运行查询——当然，你的 SQL 必须在两个数据库中都有效。在这种情况下，`query`\
  \ 方法代表了一个简单的接口，两个类共享它。\n\n共享相同接口的类通常继承自一个父类，该父类提供了公共方法，或者实现了一个公共接口。这个概念最好通过以下示例来说明。\n\
  \n## 抽象类与方法\n\n我们的父类 `HTMLElement` 包含了所有子类的公共功能。然而，我们并不希望能够从 `HTMLElement` 类实例化对象——它没有标签名称信息，也不会输出任何有用的\
  \ HTML。因此，我们使用 `abstract` 关键字使其成为一个抽象基类，它提供了 `HTMLElement` 对象所需的最小功能概要：公共的 `getSource`\
  \ 和 `getAttributeSource` 方法。我们扩展 `HTMLElement` 类来定义具体的子类，每个子类都创建了一种构建 HTML 元素的特定方法：\n\
  \n28\n\nThe PHP Anthology\n\n`AbstractHTMLElement.class.php` *（摘录）*\n\n```php\n\
  <?php\n\nabstract class HTMLElement\n\n{\n\n⋮ *公共属性和方法…*\n\n}\n\n?>\n```\n\n术语**抽象**和**具体**指的是类的使用方式——特别是，一个类是否打算被直接使用。\n\
  \n抽象类是指具有某些功能或结构，这些功能或结构将由所有子类共享，但类本身不能直接使用。换句话说，我们不应该从抽象类创建对象。如果尝试这样做，将会引发致命错误。具体类是抽象类的子类，我们可以从中创建对象。\n\
  \n`abstract` 关键字的使用方式不仅仅局限于类级别。\n\n通常，抽象类还有一个或多个空方法，这些方法除了要求给定的子类实现它们之外，不做任何事情。例如，我们可以添加一个假设的方法\
  \ `addContent`；我们只包含方法名和参数：\n\n`AbstractHTMLElement.class.php` *（摘录）*\n\n```php\n\
  <?php\n```\n\n\n\n\n\n`abstract class HTMLElement`\n```\n{\n    ⋮ 公共属性和方法…\n   \
  \ abstract public function addContent(HTMLElement $element);\n}\n?>\n```\n\n以这种方式定义抽象方法，可以让抽象类的作者表明类的意图，而无需规定具体实现。在这个例子中，抽象的\
  \ `addContent` 方法必须接受一个包含 `HTMLElement` 对象的单一参数。包含这个抽象方法意味着任何子类都必须实现该方法。虽然这个抽象方法的意图可能是强制任何\
  \ `HTMLElement` 对象添加一个子 HTML 元素到\n\n## 引言\n\n其内部内容中，但每个 HTML 元素实现这一目标的方式各不相同。例如，有些\
  \ HTML 元素只能包含特定类型的子元素；而另一些则根本不能包含任何子元素。如果你对抽象概念感兴趣，可以查阅手册页面。22\n\n## 对象接口\n\n对象接口相当于一份实现特定方法的协议。\n\
  \n它与抽象类的区别在于，它完全不包含任何实现。接口通过 `interface` 关键字定义；它们的编写方式与类相同，只是方法没有任何内容。以下是一个接口示例：`HTMLSource.interface.php`（节选）\n\
  \n```\n<?php\ninterface HTMLSource\n{\n    public function getSource();\n}\n?>\n\
  ```\n\n这是一个非常简单的接口，但足以作为示例。这里我们定义了一个方法：`getSource`。任何实现此接口的类都必须实现该方法；否则将引发致命错误。由于接口的目的是定义公共接口，因此所有方法都必须声明为\
  \ public。上述接口的意图是指明哪些对象可以输出 HTML 源字符串。\n\n要指明一个类实现了特定接口，可以使用 `implements` 关键字。以下是在我们之前定义的\
  \ `WebsiteLogo` 类中修改后的使用示例：\n\n`WebsiteLogo2.class.php`（节选）\n\n```\n<?php\nrequire_once\
  \ 'HTMLImage.class.php';\nrequire_once 'HTMLSource.interface.php';\nclass WebsiteLogo\
  \ implements HTMLSource\n{\n22 http://www.php.net/manual/en/language.oop5.abstract.php\n\
  30\nThe PHP Anthology\n    ⋮ 类属性和方法…\n    public function getSource()\n    {\n \
  \       return $this->img->getSource();\n    }\n}\n?>\n```\n\n你可能会想：“这有什么大不了的？”那么，让我们通过一个场景来结束对对象接口的解释，看看接口在什么情况下会派上用场。假设在本演示中，抽象的\
  \ `HTMLElement` 类也实现了 `HTMLSource` 接口。由于它已经有一个名为 `getSource` 的方法，因此它实际上已经实现了该接口，但在代码中明确指明这一点可以让我们确定地测试它。我们可以这样指明实现：`AbstractHTMLElement2.class.php`（节选）\n\
  \n```\n<?php\nrequire_once 'HTMLSource.interface.php';\nabstract class HTMLElement\
  \ implements HTMLSource\n{\n    ⋮ 公共属性和方法…\n}\n?>\n```\n\n为了利用代码库中的这个新特性，让我们修改基类中\
  \ `getSource` 方法的实现：`AbstractHTMLElement2.class.php`（节选）\n\n```\npublic function\
  \ getSource()\n{\n    if ($this->content instanceof HTMLSource)\n    {\n       \
  \ $html = $this->content->getSource();\n    }\n    else\n    {\n        $html =\
  \ $this->content;\n    }\nIntroduction\n31\n    return '<' . $this->tagname .\n\
  \        $this->getAttributeSource() . '>' .\n        $html .\n        '</' . $this->tagname\
  \ . '>';\n}\n```\n\n通过这个修改后的函数，任何基于 `HTMLElement` 类的对象现在都可以将其内容设置为任何实现了 `HTMLSource`\
  \ 接口的对象。这可以是基于我们之前定义的任何 `HTMLElement` 类的对象，甚至是基于 `WebsiteLogo` 类的对象。当调用 `getSource`\
  \ 时，使用 `instanceof` 类型运算符检查 `content` 属性的类型——如果它是一个实现了该接口的对象，我们就调用它的 `getSource`\
  \ 方法；否则，我们假定它是一个字符串值并使用它。该运算符允许我们检查对象是否实现了接口，从而无需确切知道它是什么类型的对象即可使用它。23\n\n## 静态属性和方法\n\
  \n静态属性和方法与对象属性和方法的不同之处在于，它们允许在不实例化对象的情况下访问属性或方法。当你希望使用某个类的方法而无需实例化对象时，这个特性有时会非常方便。\n\
  \n让我们更详细地了解静态属性的工作原理。由于每次创建段落时都要输入 `new HTMLParagraph(…)` 略显繁琐，我们希望简化这一过程。让我们创建一个名为\
  \ `HTML` 的类——我们可以无需实例化任何对象就能使用它——来为我们创建对象。24 我们使用 `static` 关键字来表明这些方法是静态的：\n\n![Image\
  \ 18](img/index-54_1.png)\n\n![Image 19](img/index-54_2.jpg)\n\n`HTML.class.php`\n\
  \n```\n<?php\nrequire_once 'HTMLParagraph.class.php';\nclass HTML\n{\n    public\
  \ static function p($content, $attributes = array()) {\n        return new HTMLParagraph($content,\
  \ $attributes);\n    }\n}\n?>\n```\n\n以下是 `HTML` 类的使用示例：`echo HTML::p('This is a\
  \ static method!');`\n\n该示例将输出如下内容：\n\n```\n<p>This is a static method!</p>\n```\n\
  \n注意，当我们使用静态方法时，我们使用 `::` 运算符，而不是对象 `->` 运算符来访问方法。你可能已经注意到，这与用于调用当前对象父类方法的运算符相同，例如\
  \ `parent::method()`。父类用法是继承中的一个特例，因为父类方法仍然可以访问对象的实例数据，因此它不是静态的。\n\n### 静态方法中不能使用\
  \ `$this`\n\n由于静态方法是在不实例化对象的情况下使用的，因此不能在静态方法中使用 `$this` 变量。\n\n现在，为了进一步扩展这个示例——并可能激发你对\
  \ PHP 5 中 OOP 的兴趣——想象一下，我们已经为 `HTML` 类添加了一个静态方法和一个对应的类，用于每个可能的 HTML 元素。记住，一个 `HTMLElement`\
  \ 对象可以作为内容传递给另一个 `HTMLElement` 对象的构造函数，我们现在可以为所有 HTML 元素创建方法，如下例所示：\n\n```\necho\
  \ HTML::div(HTML::h1('Welcome to my web site!'),\n    array('id' => 'header'));\n\
  ```\n\n该示例将输出以下 HTML：\n\n```\n<div id=\"header\"><h1>Welcome to my web site!</h1></div>\n\
  ```\n\n以上述示例为目标，我将把这样一个 API 的实现留给你。来吧——有了 OOP 入门知识，这应该很容易！\n\n## 如何编写可移植的 PHP 代码？\n\
  \n并非所有 PHP 安装环境都是相同的。根据 `php.ini` 文件中的版本和配置设置，你的脚本可能无法在另一台安装了 PHP 的服务器上正确运行。然而，你应该考虑采用一些普遍接受的最佳实践，以简化工作并尽量减少为其他服务器重写代码的需求。\n\
  \n## 解决方案\n\n普遍接受的最佳实践列表包括：集中管理配置、编写可重用的代码、始终使用完整的 PHP 标签、始终使用超全局变量且绝不使用 `register_globals`、以及始终检查魔术引号。\n\
  \n### 集中管理配置\n\n\n\n\n\n对于大多数 PHP 应用程序来说，有必要编写描述脚本运行环境的配置信息，包括数据库用户名和密码、目录位置等。通常，尽量将这些信息集中存放在一个地方——甚至是一个文件——这样当你需要修改信息时，可以在一个地方完成所有必要的更改。也就是说，在构建模块化应用程序时，你可能希望将配置的局部元素存储到特定模块本身中，而不是集中存放。\n\
  \n我们每个人选择存储这些信息的方式纯属个人偏好。\n\n在某些情况下，考虑使用 XML 文件或将部分信息存储在数据库中可能是值得的。另外，了解 `parse_ini_file`\
  \ 函数也很有必要。25\n\n一种简单而有效的存储机制是将所有设置作为 PHP 常量放入一个文件中，这样应用程序中的任何函数或类都可以访问它们。示例如下：\n\
  \n```php\n<?php\n\n// 配置设置\n\ndefine('DOMAIN', 'sitepoint.com');\n\n// 在另一个脚本中\n\
  \necho '域名是 ' . DOMAIN;\n\n?>\n```\n\n不过，使用常量时需要谨慎。为了让你的函数和类能够在其他应用程序中重用，它们不应依赖于固定名称的常量；相反，它们应该接受配置信息作为参数——这种方法将允许更大的代码复用。在这种情况下，最好在中央配置文件中使用\
  \ PHP 变量，然后根据需要将它们传递给函数和类。\n\n例如，当连接到数据库时，我们可以确定需要集中存储的多个变量：服务器主机名、用户名和密码。我们可以使用\
  \ `require_once` 函数创建一个名为 `config.php` 的文件，并将其放置在公共 Web 目录之外。\n\n这种方法有助于确保用户不会意外浏览到包含这些关键信息的文件——这种情况会危及网站的安全。\n\
  \n## 回收与重用\n\n说起来容易，但如果你发现自己一生中编写的 PHP 脚本不止一个，那么你就需要开始考虑如何让代码可重用，以免过早脱发！\n\n如果你最终在其他网站或应用程序上工作，你会感激拥有现成的代码，可以直接插入到新项目中。此外，如果你编写的代码\
  \ 25\n\n25 http://www.php.net/manual/en/function.parse-ini-file.php\n\n需要被其他人集成到他们网站上的现有应用程序中，那么你需要以不依赖他们已有代码的形式打包它。例如，如果你的应用程序有某种用户认证系统，你需要问自己它是否能与网站所有者已经在使用的系统集成——这些系统很可能已经关联了庞大的用户数据库。\n\
  \n最好的方法是编写面向对象的代码，着眼于创建可重用的组件或功能片段。有些人认为使用面向对象的代码创建 PHP 应用程序会导致运行速度变慢，应不惜一切代价避免。但他们忘记提及的是，面向对象编程能显著提升代码的性能。毕竟，快速的程序员比快速的微处理器更昂贵！\n\
  \n在评估代码的可重用潜力时，必须考虑几个重要点：\n\n- 当项目需求发生变化时会发生什么？\n- 向代码中添加新功能有多容易？\n- 经过长时间后，你还能理解这些代码吗？\n\
  - 你的代码能否轻松地与其他应用程序集成？\n- 你在代码中做出的假设是否适用于你在其他网站上的工作？\n\n本书将提供许多提示和建议，帮助你编写可重用的代码，尽管对\
  \ PHP 应用程序设计进行深入分析超出了本书的范围。在阅读本书时，你应该能够识别出一些关键因素作为进一步研究的主题。作为一名经验丰富的 PHP 开发者，你对自己有一个主要责任：不断扩展你在软件开发更晦涩方面的知识，例如设计模式和企业应用程序架构，以此改进你的开发技术，更重要的是，节省你的时间。你的知识越广泛，在接手下一个大项目时失败的风险就越低。\n\
  \n## 可移植性要点\n\n以下是确保 PHP 代码可移植性应采取的三个步骤。\n\n### 使用完整的 `<?php ?>` 标签\n\nPHP 支持多种标签样式来标记代码段，包括短标签（`<?\
  \ ?>`）和 ASP 风格标签（`<% %>`）。标签样式支持通过 `php.ini` 中的 `short_open_tag` 和 `asp_tags` 设置来控制。但请注意，虽然你可能启用了这些设置，但其他服务器管理员可能没有，这可能会带来问题。例如，短标签样式在\
  \ PHP 与使用如下处理指令的 XML 文档混合时会导致问题：\n\n```xml\n<?xml version=\"1.0\"?>\n```\n\n如果你的文档包含\
  \ PHP 和 XML，并且启用了 `short_open_tag` 设置，PHP 会将 XML 处理指令 `<?xml` 误认为是 PHP 开始标签。\n\n\
  你的代码可能需要在 `short_open_tags` 和 `asp_tags` 都关闭的环境中运行。确保这些设置被禁用的最佳方法是养成始终使用 `<?php\
  \ ?>` 标签样式的习惯——否则，将来你可能需要重写大量代码。\n\n### 关闭 `register_globals`\n\n确保在你的 `php.ini`\
  \ 文件中包含以下代码：\n\n```\nregister_globals = off\n```\n\n这将迫使你通过特殊的预定义超全局变量（例如 `$_GET['username']`）访问传入数据，从而确保不会与你脚本中创建的变量发生冲突。\n\
  \n也可以通过将以下代码放入 Apache 的 `.htaccess` 文件中达到相同效果：\n\n```\nphp_flag register_globals\
  \ off\n```\n\n更多信息请参阅 PHP 手册 26 以及 Kevin Yank 在 SitePoint 上发表的文章 *Write Secure Scripts\
  \ with PHP 4.2!* 27。\n\n26 http://www.php.net/manual/en/security.globals.php\n27\
  \ http://www.sitepoint.com/article/write-secure-scripts-php-4-2/\n\n### 检查魔术引号\n\
  \n**魔术引号** 是 PHP 的一个特性，旨在帮助防止 PHP 初学者开发的网站出现安全漏洞。\n\n魔术引号特性会在你的脚本能够访问任何传入值之前，自动向传入的\
  \ URL 查询字符串、表单提交和 cookie 数据中添加**转义字符**——即反斜杠，表示引号应*包含在*字符串中，而不是标记*字符串的结束*。如果你直接将数据插入数据库，只要魔术引号功能处于*开启*状态，恶意用户就无法篡改数据库。\n\
  \n对于初学者来说，这无疑是防止灾难的有用方法。然而，一旦你理解了什么是 SQL 注入攻击，并养成了编写代码来避免它们的习惯 28，魔术引号功能就可能变得弊大于利。\n\
  \n魔术引号功能由 PHP 配置设置 `magic_quotes_gpc` 控制，可以设置为开启或关闭。\n\n\n\n\n我个人总是倾向于关闭魔术引号，并自行处理\
  \ SQL 语句中数据的转义任务。不幸的是，这意味着我编写的代码在启用了魔术引号的 PHP 安装环境中无法良好移植——我的内容中最终会出现反斜杠。幸运的是，为了解决这个问题，PHP\
  \ 提供了 `get_magic_quotes_gpc()` 函数，可用于检测魔术引号功能是否已开启。为了使本书中的代码具有可移植性，我们将使用一个简单的文件来去除魔术引号（如果该功能已启用）：\n\
  \n28 关于 SQL 注入攻击的更多信息，请参见第 2 章“如何保护我的网站免受 SQL 注入攻击？”\n\n38\n\nPHP 文集\n\n```php\n\
  <?php\n/**\n * 检查 magic_quotes_gpc 是否开启，如果开启则从传入请求中去除转义\n */\nif (get_magic_quotes_gpc())\
  \ {\n    $_GET   = array_map('stripslashes', $_GET);\n    $_POST  = array_map('stripslashes',\
  \ $_POST);\n    $_COOKIE = array_map('stripslashes', $_COOKIE);\n}\n?>\n```\n\n\
  如果我们在任何接受来自查询字符串、表单提交或 Cookie 数据的文件开头包含这段代码，那么当魔术引号功能开启时，我们将移除由魔术引号添加的所有反斜杠。\n\n\
  ## 总结\n\n你准备好跳入 PHP 5 的水中一试身手了吗？本章向你展示了如何保持头部浮出水面并踩水。你可能还不是专业游泳者，但有《PHP 手册》以及本书相伴，我们将让你保持漂浮，向你介绍\
  \ PHP 海洋中的一些美妙之处，并最终教你如何优雅地在水面滑行！\n\n## 第 2 章\n\n## 使用 PDO 操作数据库\n\n在互联网的“旧时代”，大多数网页不过是包含\
  \ HTML 的文本文件。当人们访问你的网站时，你的 Web 服务器只是将文件提供给他们的浏览器。这种方法起初还不错，但随着网站的发展，设计和导航等问题变得越来越重要，开发者发现维护数百个\
  \ HTML 文件的一致性变得非常头疼。为了解决这个问题，将可变内容（文章、新闻条目等）与网站的静态元素（设计和布局）分离开来变得流行起来。\n\n如果使用数据库作为存储可变内容的仓库，那么像\
  \ PHP 这样的服务器端语言就会负责获取数据并将其放入统一的布局模板中。这意味着修改网站的外观和感觉可以作为与内容维护分开的任务来处理。并且，维护网站所有页面的一致性不再消耗开发者的每一个清醒时刻。\n\
  \nPHP 支持所有值得一提的关系型数据库，包括大公司常用的那些：Oracle、IBM 的 DB2 和 Microsoft 的 SQL Server 等等。三个最值得注意的开源替代方案是\n\
  \n40\n\nPHP 文集\n\nSQLite、PostgreSQL 和 MySQL。PostgreSQL 可以说是三者中最好的数据库，因为它支持更多关系型数据库常见的特性。SQLite\
  \ 是那些仍然需要数据库功能的小型应用的完美选择。MySQL 是支持 PHP 的虚拟主机提供商中的热门选择，因此通常比 PostgreSQL 更容易找到。\n\n\
  本章涵盖了 PHP 开发者在处理数据库时执行的所有常见操作：检索和修改数据，以及搜索和备份数据库。为了实现这些任务，我们将使用内置的 PDO 扩展，而不是特定于数据库的扩展。我们将使用的示例只涉及一个表，因此这里不讨论表关系。关于该主题的完整讨论，请参见\
  \ Kevin Yank 的《使用 PHP & MySQL 构建你自己的数据库驱动网站，第 3 版》（SitePoint，墨尔本，2006）[¹]。\n\n这里包含的示例使用了名为“world”的\
  \ MySQL 示例数据库，尽管我们将进行的所有交互都可以使用 PDO 支持的任何数据库进行。world 数据库的 SQL 文件可在 http://dev.mysql.com/doc/#sampledb\
  \ 获取，其使用说明可在 http://dev.mysql.com/doc/world-setup/en/world-setup.html 找到。\n\n##\
  \ 什么是 PDO？\n\n**PDO**，即 PHP 数据对象扩展，是一个数据访问抽象层。但这到底是什么呢？基本上，它是多个数据库的一致接口。你不再需要使用\
  \ `mysql_*` 函数、`sqlite_*` 函数或 `pg_*` 函数，也不必为它们编写包装器来与数据库交互。相反，你可以直接使用 PDO 接口，通过相同的方法与所有这三个函数一起工作。而且，如果你更换数据库，只需更改\
  \ PDO 的 **DSN**（数据源名称）即可使代码正常工作。[²]\n\nPDO 使用特定的数据库驱动程序与各种数据库交互，因此你不能单独使用 PDO。你需要启用将与\
  \ PDO 一起使用的驱动程序，因此请务必在 PDO 手册页面上研究如何针对你的特定主机操作系统进行配置。[³]\n\nPDO 随 PHP 5.1 一起发布，并且可以从\
  \ PECL 获取用于 PHP 5.0 的版本。不幸的是，由于 PDO 需要 PHP 5 的新面向对象特性，它不适用于 PHP 4。在本书中，我们与数据库的所有交互都将使用\
  \ PDO 与 MySQL 后端进行交互。\n\n## 如何访问数据库？\n\n在对数据库进行任何操作之前，我们需要与它通信。而要通信，我们必须建立数据库连接。这很合乎逻辑，不是吗？\n\
  \n## 解决方案\n\n以下是我们如何连接到 localhost 上的 MySQL 数据库：\n\n**mysqlConnect.php *(摘录)***\n\
  \n```php\n<?php\n$dsn = 'mysql:host=localhost;dbname=world;';\n$user = 'user';\n\
  $password = 'secret';\ntry\n{\n    $dbh = new PDO($dsn, $user, $password);\n}\n\
  catch (PDOException $e)\n{\n    echo 'Connection failed: ' . $e->getMessage();\n\
  }\n?>\n```\n\n我们将使用以下代码连接到 localhost 上的 SQLite 数据库：\n\n**sqliteConnect.php *(摘录)***\n\
  \n```php\n<?php\n$dsn = 'sqlite2:\"C:\\sqlite\\world.db\"';\ntry\n{\n    $dbh =\
  \ new PDO($dsn);\n}\ncatch (PDOException $e)\n{\n    echo 'Connection failed: '\
  \ . $e->getMessage();\n}\n?>\n```\n\n以下代码将让我们连接到 localhost 上的 PostgreSQL 数据库：\n\n\
  **postgreConnect.php *(摘录)***\n\n```php\n<?php\n$dsn = 'pgsql:host=localhost port=5432\
  \ dbname=world user=user ';\n$dsn .= 'password=secret';\ntry\n{\n    $dbh = new\
  \ PDO($dsn);\n}\ncatch (PDOException $e)\n{\n    echo 'Connection failed: ' . $e->getMessage();\n\
  }\n?>\n```\n\n## 讨论\n\n请注意，在上述三个示例中，我们只是创建了一个新的 PDO 对象。只有 PDO 构造函数的连接数据在每个案例中有所不同：对于\
  \ SQLite 和 PostgreSQL 连接，我们只需要 DSN；而 MySQL 连接还需要用户名和密码参数才能连接到数据库。[⁴]\n\n![Image\
  \ 20](img/index-65_1.jpg)\n\n使用 PDO 操作数据库\n\n43\n\n### DSN 详解\n\n如上所述，DSN 是数据源名称（Data\
  \ Source Name）的缩写。DSN 提供了连接数据库所需的信息。PDO 的 DSN 包含三个基本部分：PDO 驱动程序名称（例如 `mysql`、`sqlite`\
  \ 或 `pgsql`）、冒号以及驱动程序特定的语法。这里可能有点令人困惑的是驱动程序特定的语法，因为每个驱动程序需要不同的信息。但别担心，当然还有可靠的手册！\n\
  \n[¹]: http://www.sitepoint.com/books/phpmysql1/\n[²]: 只要你编写的 SQL 不是特定于数据库的，那么你只需要这样做。如果你尽量遵循\
  \ ANSI 92 标准 [http://www.contrib.andrew.cmu.edu/~shadow/sql/sql1992.txt]，通常应该没问题——大多数数据库都支持该语法。\n\
  [³]: http://www.php.net/pdo/\n[⁴]: 我们可以将用户名和密码信息放在 MySQL DSN 中，提供完整的 DSN，但普通用户在使用\
  \ MySQL 时没有理由这样做。这只会给 DSN 增加不必要的复杂性。\n\n\n\n\n\n# 使用 PDO 操作数据库\n\n手册中描述了每个 PDO 驱动在\
  \ DSN 中所需的数据库驱动特定语法。你只需前往数据库驱动页面，5 选择你的数据库驱动，然后点击链接查看 DSN 信息。例如，手册中的 MySQL DSN 页面位于\
  \ `http://www.php.net/manual/en/ref.pdo-mysql.connection.php`，如图 2.1 所示。\n\n图 2.1.\
  \ PDO_MySQL DSN 手册页面\n\n5 `http://www.php.net/manual/en/ref.pdo.php#pdo.drivers`\n\
  \n![Image 21](img/index-66_1.png)\n![Image 22](img/index-66_2.jpg)\n\n每个手册页面也提供了\
  \ DSN 示例，帮助你快速上手。\n\n## 不要在 DSN 中传递凭据\n\n在我们刚刚看到的数据库连接示例中，我将访问凭据包含在了 DSN 中，或者放在了\
  \ `$user` 和 `$pass` 变量中，但这仅仅是为了演示目的 *而已*。这并不是标准——也不恰当——的做法，因为恶意方可能会滥用这些信息来访问你的数据库。\n\
  \n## 其他概念\n\n在使用数据库时，有几个概念你需要理解。首先，你需要记住数据库服务器是一个与 PHP 完全独立的实体。虽然在这些示例中，数据库服务器和\
  \ Web 服务器是同一台机器，但情况并非总是如此。因此，如果你的数据库与 PHP 位于不同的机器上，你需要修改 DSN 中的主机名以指向它。\n\n更有趣的是，数据库服务器只会在特定的端口号上监听你的连接。每个数据库服务器都有一个默认端口号（MySQL\
  \ 是 3306，PostgreSQL 是 5432），但这可能不是数据库管理员选择的端口，或者 PHP 知道要查找的端口。如有疑问，请在 DSN 中包含你的端口号。\n\
  \n你还需要注意，一个数据库服务器上可以有多个数据库，所以你的数据库可能不是唯一的一个。这就是为什么数据库名称通常包含在 DSN 中——以帮助你访问 *你的*\
  \ 数据，而不是其他人的！\n\n最后，请确保你理解从 PDO 连接中会得到什么。你的连接将返回一个 `PDO` 对象——而不是对数据库的引用，也不是任何数据。正是通过\
  \ `PDO` 对象，我们与数据库进行交互，使其服从我们的意愿。\n\n## 如何从表中获取数据？\n\n好了，我们已经连接到数据库。呜呼！但如果无法从数据库中获取任何数据，那又有什么用呢？\n\
  \n## 解决方案\n\nPDO 提供了几种与数据库交互的方式。在这里，我们将探讨两种可能的解决方案。\n\n#### 使用 Query 方法\n\n首先，让我们看看更快但不一定更好的方式——使用\
  \ `query` 方法：\n\n`pdoQuery.php` *(摘录)*\n\n```php\n$country = 'USA';\ntry\n{\n  \
  \  $dbh = new PDO($dsn, $user, $password);\n    $dbh->setAttribute(PDO::ATTR_ERRMODE,\n\
  \        PDO::ERRMODE_EXCEPTION);\n    $sql = 'Select * from city where CountryCode\
  \ =' .\n        $dbh->quote($country);\n    foreach ($dbh->query($sql) as $row)\n\
  \    {\n        print $row['Name'] . \"\\t\";\n        print $row['CountryCode']\
  \ . \"\\t\";\n        print $row['Population'] . \"\\n\";\n    }\n}\ncatch (PDOException\
  \ $e)\n{\n    echo 'PDO Exception Caught. ';\n    echo 'Error with the database:\
  \ <br />';\n    echo 'SQL Query: ', $sql;\n    echo 'Error: ' . $e->getMessage();\n\
  }\n```\n\n这段代码的输出摘录如图 2.2 所示。\n\n![Image 23](img/index-68_1.jpg)\n\n图 2.2. 使用 PDO\
  \ query 方法产生的输出\n\n#### 使用 Prepare 和 Execute 方法\n\n使用 `prepare` 和 `execute` 方法通常被认为是处理数据库查询的更好方式。首先，我们调用\
  \ `PDO->prepare`，并将 SQL 语句作为参数传入。作为返回，我们得到一个 `PDOStatement` 对象，然后在该对象上调用 `execute`\
  \ 方法。接着，在 `while` 循环中，我们反复调用 `PDOStatement->fetch` 方法来检索从数据库中选择的数据：\n\n`pdoPrepEx.php`\
  \ *(摘录)*\n\n```php\n$country = 'USA';\ntry\n{\n    $dbh = new PDO($dsn, $user, $password);\n\
  \    $sql = 'Select * from city where CountryCode =:country';\n    $dbh->setAttribute(PDO::ATTR_ERRMODE,\n\
  \        PDO::ERRMODE_EXCEPTION);\n    $stmt = $dbh->prepare($sql);\n    $stmt->bindParam(':country',\
  \ $country, PDO::PARAM_STR);\n    $stmt->execute();\n    while ($row = $stmt->fetch(PDO::FETCH_ASSOC))\n\
  \    {\n        print $row['Name'] . \"\\t\";\n        print $row['CountryCode']\
  \ . \"\\t\";\n        print $row['Population'] . \"\\n\";\n    }\n}\ncatch (PDOException\
  \ $e)\n{\n    echo 'PDO Exception Caught. ';\n    echo 'Error with the database:\
  \ <br />';\n    echo 'SQL Query: ', $sql;\n    echo 'Error: ' . $e->getMessage();\n\
  }\n```\n\n![Image 24](img/index-69_1.jpg)\n\n这段代码的输出摘录如图 2.3 所示。\n\n图 2.3. 使用 PDO\
  \ prepare 和 execute 方法产生的输出\n\n## 讨论\n\n你会注意到，这两种解决方案都提供了相同的数据，这应该是正常的。但选择一种解决方案而非另一种，有非常具体的原因。\n\
  \n`PDO->query` 在你只执行一次查询时非常有用。虽然它不会自动转义你发送的任何数据，但它有一个非常方便的能力：可以遍历成功 `SELECT` 语句的结果集。然而，使用此方法时应当小心。如果你没有获取结果集中的所有数据，下一次调用\
  \ `PDO->query` 可能会失败。6 如果你要多次使用同一个 SQL 语句，最好的选择是使用 `prepare` 和 `execute`——这是更推荐的解决方案。\n\
  \n使用 `prepare` 和 `execute` 相比 `query` 有几个优点。首先，它会自动转义你提供的任何参数，从而有助于防止 SQL 注入攻击（仅凭这一点，这种方法通常被认为是更好的实践）。当然，如果你从用户输入构建查询的其他部分，这会抵消这一优势，但你不会那样做，对吧？其次，多次使用的预处理语句（例如，对数据库执行多次插入或更新）比重复调用\
  \ `query` 方法消耗更少的资源，运行速度也更快。\n\n还有其他几种方式可以在查询中使用 `prepare` 和 `execute`，但我认为我们在这里讨论的示例是最清晰的。在这个解决方案中，我使用了命名参数，但请注意\
  \ PDO 也支持问号（`?`）参数占位符。在我们看到的示例中，你也可以选择不使用 `paramBind` 方法——而是将参数直接传递给 `execute` 命令。如果你对替代语法有任何疑问，请参阅\
  \ PHP 手册。\n\n### 使用 Fetch 选项\n\n当你使用 `prepare` 和 `execute` 时，你可以选择多种数据返回格式。我们看到的示例使用了\
  \ `PDO::FETCH_ASSOC` 选项与 `fetch` 方法，因为它以 PHP4 用户非常熟悉的格式返回数据：关联数组。7\n\n如果你更愿意在应用程序中只使用面向对象的代码，你可以改用\
  \ `fetchObject` 方法，顾名思义，它返回结果集作为对象。以下是使用 `fetchObject` 方法时 `while` 循环的样子：\n\n`pdoPrepEx2.php`\
  \ *(摘录)*\n\n```php\nwhile ($row = $stmt->fetchObject())\n{\n    print $row->Name\
  \ . \"\\t\";\n    print $row->CountryCode . \"\\t\";\n    print $row->Population\
  \ . \"\\n\";\n}\n```\n\n![Image 25](img/index-71_1.jpg)\n![Image 26](img/index-71_2.png)\n\
  \n## 如何解决 SQL 查询中的错误？\n\n错误是不可避免的。它们困扰着我们所有人，有时可能由我们无法控制的情况引起——数据库崩溃、数据库升级、维护停机等等。当你尝试同时处理\
  \ PHP 和 SQL 时，如果出现问题，通常很难找到原因。诀窍是让 PHP 告诉你问题出在哪里，同时要记住，当网站上线时，你必须能够向访问者隐藏这些信息。\n\
  \n6 更多信息，请参阅 PHP 手册页面：`http://www.php.net/manual/en/function.PDO-query.php`。\n7\
  \ 更多信息，请参阅 PHP 手册页面：`http://www.php.net/manual/en/function.PDO-query.php`。\n\n\n\
  \n\n\n# 我们只负责查找错误——不负责修复！\n\n我不会在这里深入讲解错误处理——而是向你展示如何查找错误。关于找到错误后如何修复的更多信息，请参阅第\
  \ 9 章。\n\n## 解决方案\n\n`PDO` 提供了多种捕获错误的解决方案。在接下来的示例中，我们将逐一介绍这三种选项，并在世界数据库的表名中故意引入一个拼写错误，使其变成\
  \ *cities* 而非 *city*。如果你自己运行这段代码，也可以尝试注释掉错误处理代码，看看网站访问者会看到什么。\n\n### 使用静默模式\n\n\
  `PDO::ERRMODE_SILENT` 是默认模式：\n\n**pdoError1.php *(节选)***\n\n```\n$country = 'USA';\n\
  $dbh = new PDO($dsn, $user, $password);\n$sql = 'Select * from cities where CountryCode\
  \ =:country';\n$stmt = $dbh->prepare($sql);\n$stmt->bindParam(':country', $country,\
  \ PDO::PARAM_STR);\n$stmt->execute();\n$code = $stmt->errorCode();\nif (empty($code))\n\
  {\n    ⋮ *proceed to fetch data*\n}\nelse\n{\n    echo 'Error with the database:\
  \ <br />';\n    echo 'SQL Query: ', $sql;\n    echo '<pre>';\n    var_dump($stmt->errorInfo());\n\
  \    echo '</pre>';\n}\n```\n\n默认错误模式会设置 `PDOStatement` 对象的 `errorCode` 属性，但不会执行其他操作。如本例所示，你需要手动检查错误代码以确定是否发现了错误——否则脚本会继续愉快地执行下去。\n\
  \n### 使用警告模式\n\n`PDO::ERRMODE_WARNING` 会在设置 `errorCode` 属性的同时生成一个 PHP 警告：\n\n**pdoError2.php\
  \ *(节选)***\n\n```\n$country = 'USA';\n$dbh = new PDO($dsn, $user, $password);\n\
  $dbh->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_WARNING);\n$sql = 'Select * from\
  \ cities where CountryCode =:country';\n$stmt = $dbh->prepare($sql);\n$stmt->bindParam(':country',\
  \ $country, PDO::PARAM_STR);\n$stmt->execute();\n$code = $stmt->errorCode();\nif\
  \ (empty($code))\n{\n    ⋮ *proceed to fetch data*\n}\nelse\n{\n    echo 'Error\
  \ with the database: <br />';\n    echo 'SQL Query: ', $sql;\n    echo '<pre>';\n\
  \    var_dump($stmt->errorInfo());\n    echo '</pre>';\n}\n```\n\n同样，除非你专门检查错误代码，否则程序会继续愉快地执行。因此，除非你开启了“显示错误”功能、使用了自定义错误处理器或检查了错误日志，否则你可能不会注意到它。\n\
  \n### 使用异常模式\n\n`PDO::ERRMODE_EXCEPTION` 会在设置 `errorCode` 属性的同时创建一个 `PDOException`：\n\
  \n**pdoError3.php *(节选)***\n\n```\n$country = 'USA';\ntry\n{\n    $dbh = new PDO($dsn,\
  \ $user, $password);\n    $dbh->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \    $sql = 'Select * from cities where CountryCode =:country';\n    $stmt = $dbh->prepare($sql);\n\
  \    $stmt->bindParam(':country', $country, PDO::PARAM_STR);\n    $stmt->execute();\n\
  \    ⋮ *proceed to fetch data*\n}\ncatch (PDOException $e)\n{\n    echo 'PDO Exception\
  \ Caught. ';\n    echo 'Error with the database: <br />';\n    echo 'SQL Query:\
  \ ', $sql;\n    echo '<pre>';\n    echo 'Error: ' . $e->getMessage() . '<br />';\n\
  \    echo 'Code: ' . $e->getCode() . '<br />';\n    echo 'File: ' . $e->getFile()\
  \ . '<br />';\n    echo 'Line: ' . $e->getLine() . '<br />';\n    echo 'Trace: '\
  \ . $e->getTraceAsString();\n    echo '</pre>';\n}\n```\n\n`PDO::ERRMODE_EXCEPTION`\
  \ 允许你将代码包裹在 `try {…} catch {…}` 块中。未捕获的异常会终止脚本并显示堆栈跟踪，让你知道存在问题。\n\n`PDOException`\
  \ 是标准 PHP 库（即 `SPL`）中通用 PHP `Exception` 类的扩展。\n\n## 讨论\n\n大多数人会选择利用 PHP 更强大的面向对象模型，并使用异常模式来处理错误，因为它遵循了面向对象的错误处理风格——捕获并处理不同类型的异常——并且更易于使用。\n\
  \n无论你选择哪种方式处理错误，最好返回 SQL 查询本身的文本。这可以让你准确看到哪个查询有问题，并有助于调试错误。\n\n## 如何向数据库添加数据或修改数据？\n\
  \n能够从数据库中获取数据只是一个开始，但如何首先将数据放入其中呢？\n\n## 解决方案\n\n我们使用 SQL 的 `INSERT` 命令向数据库添加数据，使用\
  \ SQL 的 `UPDATE` 命令修改数据库中已有的数据。这两个命令都可以通过 `query` 方法或 `prepare` 和 `execute` 方法发送到数据库。在本解决方案中，我将使用\
  \ `prepare` 和 `execute` 方法。\n\n#### 向数据库插入数据\n\n首先，我们来看一个简单的 `INSERT` 示例，使用 world\
  \ 数据库中的 `City` 表：\n\n**insert.php *(节选)***\n\n```\n$id = '4080';\n$name = 'Guam';\n\
  $country = 'GU';\n$district = 'Guam';\n$population = 171018;\ntry\n{\n    $dbh =\
  \ new PDO($dsn, $user, $password);\n    $dbh->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \    $sql = 'INSERT INTO city\n            (ID, Name, CountryCode, District, Population)\n\
  \            VALUES (:id, :name, :country, :district, :pop)';\n    $stmt = $dbh->prepare($sql);\n\
  \    $stmt->bindParam(':id', $id);\n    $stmt->bindParam(':name', $name);\n    $stmt->bindParam(':country',\
  \ $country);\n    $stmt->bindParam(':district', $district);\n    $stmt->bindParam(':pop',\
  \ $population);\n    $stmt->execute();\n}\ncatch (PDOException $e)\n{\n    echo\
  \ 'PDO Exception Caught. ';\n    echo 'Error with the database: <br />';\n    echo\
  \ 'SQL Query: ', $sql;\n    echo 'Error: ' . $e->getMessage();\n}\n?>\n```\n\n####\
  \ 更新数据库中的数据\n\n下面是一个简单的 `UPDATE` 示例，同样使用 world 数据库中的 `City` 表：\n\n**update.php *(节选)***\n\
  \n```\n$id = '4080';\n$name = 'Guam';\n$country = 'GU';\n$district = 'Guam';\n$population\
  \ = 171019; // data provided by the U.S. Census\n                      // Bureau,\
  \ International Data Base\n                      // Mid year 2006\ntry\n{\n    $dbh\
  \ = new PDO($dsn, $user, $password);\n    $dbh->setAttribute(PDO::ATTR_ERRMODE,\
  \ PDO::ERRMODE_EXCEPTION);\n    $sql = 'UPDATE city SET Name = :name,\n        \
  \    CountryCode = :country, District = :district,\n            Population = :pop\
  \ WHERE ID = :id';\n    $stmt = $dbh->prepare($sql);\n    $stmt->bindParam(':id',\
  \ $id);\n    $stmt->bindParam(':name', $name);\n    $stmt->bindParam(':country',\
  \ $country);\n    $stmt->bindParam(':district', $district);\n    $stmt->bindParam(':pop',\
  \ $population);\n    $stmt->execute();\n}\ncatch (PDOException $e)\n{\n    echo\
  \ 'PDO Exception Caught. ';\n    echo 'Error with the database: <br />';\n    echo\
  \ 'SQL Query: ', $sql;\n    echo 'Error: ' . $e->getMessage();\n}\n?>\n```\n\n![Image\
  \ 27](img/index-77_1.jpg)\n![Image 28](img/index-77_2.png)\n\n## 讨论\n\n请注意，除了在 `prepare`\
  \ 方法中使用的 SQL 语句不同之外，上面两个示例中的代码完全相同。我们喜欢让 PHP 保持简单！\n\n在实际应用中，查询的输入部分或全部来自用户生成的内容。由于我们使用了\
  \ `prepare` 和 `execute` 方法，因此不必担心此查询受到 SQL 注入攻击：所有变量都会被自动转义。\n\n#### 谨慎使用 UPDATE\
  \ 和 DELETE\n\n在 SQL 中使用 `UPDATE` 或 `DELETE` 时要非常小心。如果 SQL 语句中没有 `WHERE` 子句，最终会更新或删除表中的所有行。不用说，这两种结果都可能导致严重问题！\n\
  \n## 如何保护我的网站免受 SQL 注入攻击？\n\n\n\n\n当攻击者利用你网站上的合法用户输入机制发送 SQL 代码，而你的脚本在不知情的情况下将其传递给数据库执行时，就会发生\
  \ SQL 注入攻击。避免 SQL 注入攻击的黄金法则是：在将外部来源的所有数据交给数据库之前，先对其进行转义。这条规则不仅适用于 `INSERT` 和 `UPDATE`\
  \ 查询，也适用于 `SELECT` 查询。\n\n正如我们之前讨论的，在脚本中为所有查询使用预处理语句几乎可以消除 SQL 注入攻击的问题，但如果你选择使用\
  \ `query` 方法，你将得不到这样的保护——你必须手动转义进入查询的任何用户输入。让我们看一个例子：`sqlInject.php` *（节选）*\n\n\
  ```\n//$city = 'New York';\n\n$city =\"' or Name LIKE '%\" ;\n\ntry\n\n{\n\n$dbh\
  \ = new PDO($dsn, $user, $password);\n\n$dbh->setAttribute(PDO::ATTR_ERRMODE,\n\n\
  56\n\nThe PHP Anthology\n\nPDO::ERRMODE_EXCEPTION);\n\n$sql = \"Select * from city\
  \ where Name ='\". $city .\"'\"; foreach ($dbh->query($sql) as $row)\n\n{\n\nprint\
  \ $row['Name'] . \"\\t\";\n\nprint $row['CountryCode'] . \"\\t\";\n\nprint $row['Population']\
  \ . \"\\n\";\n\n}\n\n}\n\ncatch (PDOException $e)\n\n{\n\necho 'PDO Exception Caught.\
  \ ';\n\necho 'Error with the database: <br />';\n\necho 'SQL Query: ', $sql;\n\n\
  echo 'Error: ' . $e->getMessage();\n\n}\n```\n\n在这个例子中，我们假设 SQL 语句中使用的 `$city` 变量来自用户提交的表单。一个典型的用户会提交类似\
  \ **New York** 的内容。这将得到以下 SQL 语句：`Select * from city where Name ='New York'`\n\n\
  这在脚本中不会引起任何问题。然而，一个精明的攻击者可能会输入 `' OR Name LIKE '%`，这将得到以下 SQL 语句：`Select * from\
  \ city where Name ='' OR Name LIKE '%'`\n\n这个输入将整个表暴露给了攻击者。“没什么大不了的，”你可能会说。“这只是一个城市列表。”是的，但如果这不是我们简单的城市表，而是授权用户表呢？攻击者将能够访问极其敏感的数据！\n\
  \n## 解决方案\n\n幸运的是，这个问题相当容易避免，尽管解决方案意味着你需要做更多的工作。你可以使用 PDO 方便的 `quote` 方法来转义你传递给\
  \ SQL 字符串的任何数据。只需将 SQL 代码改为：`$sql = \"Select * from city where Name ='\".$dbh->quote($city).\"\
  '\";`\n\n使用 PDO 操作数据库\n\n57\n\n请记住，你需要对 SQL 查询中使用的*每一个*数据片段进行转义——没有任何捷径！除非你把 `prepare`\
  \ 和 `execute` 视为一种捷径。\n\n## 讨论\n\n如果你使用 `PDO->query` 方法，请始终对输入进行转义。*始终如此*！\n\n如果你选择使用\
  \ `prepare` 和 `execute` 方法，则无需转义绑定到预处理 SQL 的值（例如，要插入的值）——这些都由驱动程序为你完成。然而，有时你可能无法将变量绑定到预处理\
  \ SQL。在这种情况下，如果你正在构建动态 SQL 语句，你需要对任何无法绑定的值（例如 `GROUP BY` 或 `ORDER BY` 子句，或表名）进行转义。\n\
  \n记住：强大的防御就是最好的进攻。\n\n## 如何创建灵活的 SQL 语句？\n\nSQL 是一种用于操作数据的强大语言。使用 PHP，我们可以用变量构建\
  \ SQL 语句——这种方法对于按单列排序表格，或在多页上显示大量结果集非常有用。\n\n## 解决方案\n\n在 SQL 被准备和执行之前，它仍然只是一个你可以随意操作的字符串。这个解决方案基于用户输入使用拼接来从指定国家选择城市，并按指定顺序显示它们：`flexSQLConcat.php`\
  \ *（节选）*\n\n```\n$validCountries = array ('USA', 'CAN', 'GU', 'ISR'); if (isset($_GET['country'])\
  \ &&\n\nin_array($_GET['country'], $validCountries))\n\n{\n\n$country = $_GET['country'];\n\
  \n}\n\nelse\n\n{\n\n$country = 'USA';\n\n}\n\n58\n\nThe PHP Anthology\n\n$order\
  \ = (!isset($_GET['order'])) ? FALSE : $_GET['order']; try\n\n{\n\n$dbh = new PDO($dsn,\
  \ $user, $password);\n\n$dbh->setAttribute(PDO::ATTR_ERRMODE,\n\nPDO::ERRMODE_EXCEPTION);\n\
  \n$sql = 'SELECT * FROM city WHERE CountryCode = :country'; switch ($order) {\n\n\
  case 'district':\n\n// Add to the $sql string\n\n$sql .= \" ORDER BY District\"\
  ;\n\nbreak;\n\ncase 'pop':\n\n$sql .= \" ORDER BY Population DESC\";\n\nbreak;\n\
  \ndefault:\n\n// Default sort by title\n\n$sql .= \" ORDER BY Name\";\n\nbreak;\n\
  \n}\n\n$stmt = $dbh->prepare($sql);\n\n$stmt->bindParam(':country', $country);\n\
  \n$stmt->execute();\n\nwhile ($row = $stmt->fetch(PDO::FETCH_ASSOC)) {\n\nprint\
  \ $row['Name'] . \"\\t\";\n\nprint $row['CountryCode'] . \"\\t\";\n\nprint $row['Population']\
  \ . \"\\n\";\n\n}\n\n}\n\ncatch (Exception $e)\n\n{\n\necho 'PDO Exception Caught.\
  \ ';\n\necho 'Error with the database: <br />';\n\necho 'SQL Query: ', $sql;\n\n\
  echo 'Error: ' . $e->getMessage();\n\n}\n```\n\n在这段代码中，用户输入要么从方法为 `GET` 的 Web 表单读取，要么从带有查询字符串的\
  \ URL 读取。在上面的 `switch` 语句中，我们使用拼接生成动态 SQL。读取 `$order` 值，并向 SQL 查询添加一个 `ORDER BY`\
  \ 子句。\n\n使用 PDO 操作数据库\n\n59\n\n## 讨论\n\n另一种解决方案是使用 `sprintf` 来构建动态 SQL。这种方法类似于将变量绑定到预处理\
  \ SQL：`flexSQLSprintf.php` *（节选）*\n\n```\nswitch ($order) {\n\ncase 'district':\n\
  \n$orderby = \" District\";\n\nbreak;\n\ncase 'pop':\n\n$orderby = \" Population\
  \ DESC\";\n\nbreak;\n\ndefault:\n\n$orderby = \" Name\";\n\nbreak;\n\n}\n\n$format\
  \ = 'SELECT * FROM city\n\nWHERE CountryCode = :country ORDER BY %s';\n\n$sql =\
  \ sprintf($format, $orderby);\n```\n\n这属于个人风格问题，但这两种方法都可以扩展到列、表名、`WHERE` 子句、`LIMIT`\
  \ 子句以及你想在 SQL 查询中包含的任何其他内容。\n\n请记住，在 SQL 被准备和执行之前，它只是一个你可以根据需要随意操作的字符串。\n\n## 如何知道影响了多少行？\n\
  \n通常，在处理查询返回或影响的行之前，能够统计它们的数量是很有用的。这种能力在将结果分页显示或生成统计信息时尤其方便。\n\n## 解决方案\n\n以下两个解决方案将帮助你统计操作在数据库中返回的行数和受影响的行数。\n\
  \n60\n\nThe PHP Anthology\n\n#### 统计返回的行数\n\nPDO 没有神奇的方法来统计 `SELECT` 调用返回的行数。你可以使用\
  \ `PDOStatement->rowCount` 方法来返回某些 PDO 数据库驱动中 `SELECT` 语句返回的行数。然而，由于这个函数的行为不能保证与每个数据库驱动一致，我在这里就不介绍了。你可以自行尝试你的数据库驱动，但请记住，如果你需要编写可移植的代码，这种方法并不可靠。\n\
  \n不过，有一种解决方案可以绕过这个缺少有用方法的问题——它使用 SQL 聚合函数 `COUNT`。\n\n以下是统计返回行数的代码：`count.php` *（节选）*\n\
  \n```\n$country = 'USA';\n\ntry\n\n{\n\n$dbh = new PDO($dsn, $user, $password);\n\
  \n$dbh->setAttribute(PDO::ATTR_ERRMODE,\n\nPDO::ERRMODE_EXCEPTION);\n\n$sql = 'SELECT\
  \ COUNT(*) FROM city\n\nWHERE CountryCode =:country';\n\n$stmt = $dbh->prepare($sql);\n\
  \n$stmt->bindParam(':country', $country, PDO::PARAM_STR); $result = $stmt->execute();\n\
  \necho 'There are ', $stmt->fetchColumn(), ' rows returned.';\n\n}\n\ncatch (PDOException\
  \ $e)\n\n{\n\necho 'PDO Exception Caught. ';\n\necho 'Error with the database: <br\
  \ />';\n\necho 'SQL Query: ', $sql;\n\necho 'Error: ' . $e->getMessage();\n\n}\n\
  ```\n\n## 讨论\n\n（注意：原文以“**讨论**”结束，但未提供进一步内容。输入中此部分的讨论内容缺失。我们按原样保留标题。）\n\n\n\n\n\
  `COUNT` 返回查询或查询部分中的行数，通常与 `DISTINCT` 关键字一起使用。SQL 的聚合函数 `COUNT` 被各种数据库系统广泛支持。有关数据库如何处理\
  \ `COUNT` 的更多信息，请参阅数据库的文档。\n\n![Image 29](img/index-83_1.jpg)\n\n![Image 30](img/index-83_2.png)\n\
  \n# 使用 PDO 操作数据库\n\n61\n\n## 统计受影响的行数\n\n我们可以使用 `PDOStatement->rowCount` 方法来找出 `UPDATE`、`INSERT`\
  \ 或 `DELETE` 查询影响了多少行。在典型的 PHP 应用程序中，`rowCount` 的使用并不常见，但它可以很好地告知用户“从 Customers\
  \ 表中删除的记录数：`n`。”\n\n以下是所需的代码：\n\naffect.php（节选）\n\n```\n$country = 'AFG';\n\ntry\n\
  \n{\n\n$dbh = new PDO($dsn, $user, $password);\n\n$dbh->setAttribute(PDO::ATTR_ERRMODE,\n\
  \nPDO::ERRMODE_EXCEPTION);\n\n$sql = 'DELETE FROM city WHERE CountryCode = :country';\
  \ $stmt = $dbh->prepare($sql);\n\n$stmt->bindParam(':country', $country, PDO::PARAM_STR);\
  \ $result = $stmt->execute();\n\necho 'Number of records deleted from the city table:\
  \ ';\necho $stmt->rowCount();\n\n}\n\ncatch (PDOException $e)\n\n{\n\necho 'PDO\
  \ Exception Caught. ';\n\necho 'Error with the database: <br />';\n\necho 'SQL Query:\
  \ ', $sql;\n\necho 'Error: ' . $e->getMessage();\n\n}\n```\n\n调用 `PDOStatement->execute`\
  \ 后，可以调用 `PDOStatement->rowCount` 方法返回受影响的行数。\n\n## 确保添加 WHERE 子句\n\n当使用 SQL 命令\
  \ `UPDATE` 和 `DELETE` 时，务必确保添加 `WHERE` 子句。如果没有，你可能会更新数据库中的整个列，或者删除表中的所有数据，这很可能不是你的本意！\n\
  \n62\n\nPHP 文集\n\n## 如何获取新 `INSERT` 操作在自增字段中的行号？\n\n当处理数据库表中的自增列时，经常需要找出刚插入行的 ID，以便用此信息更新其他表。毕竟，这就是表之间关系的维护方式。\n\
  \n## 解决方案\n\n要完成此任务，PDO 提供了 `lastInsertId` 方法，如果所使用的驱动程序支持此功能，它将返回最后一次 `INSERT`\
  \ 操作生成的 ID。9 其工作原理如下：\n\nlastId.php（节选）\n\n```\n$name = 'Dededo';\n\n$country =\
  \ 'GU';\n\n$district = 'Guam';\n\n$population = 42980; // 根据 2000 年美国人口普查 try\n\n\
  {\n\n$dbh = new PDO($dsn, $user, $password);\n\n$dbh->setAttribute(PDO::ATTR_ERRMODE,\n\
  \nPDO::ERRMODE_EXCEPTION);\n\n$sql = 'INSERT INTO city\n\n(Name, CountryCode, District,\
  \ Population)\n\nVALUES (:name, :country, :district, :pop)';\n\n$stmt = $dbh->prepare($sql);\n\
  \n$stmt->bindParam(':name', $name);\n\n$stmt->bindParam(':country', $country);\n\
  \n$stmt->bindParam(':district', $district);\n\n$stmt->bindParam(':pop', $population);\n\
  \n$stmt->execute();\n\necho 'ID of last insert: ', $dbh->lastInsertId();\n\n}\n\n\
  catch (PDOException $e)\n\n{\n\n9 `lastInsertId` 在不同数据库驱动程序中的行为可能不一致——某些数据库驱动程序不支持自增字段。有关更多信息，请阅读\
  \ http://www.php.net/manual/en/function.PDO-lastInsertId.php 的手册页面。\n\n使用 PDO 操作数据库\n\
  \n63\n\necho 'PDO Exception Caught. ';\n\necho 'Error with the database: <br />';\n\
  \necho 'SQL Query: ', $sql;\n\necho 'Error: ' . $e->getMessage();\n\n}\n```\n\n\
  ## 讨论\n\n使用 `lastInsertId` 方法时，请确保使用 `PDO` 对象（上面的 `$dbh`），而不是 `PDOStatement` 对象（即使用\
  \ `prepare` 时创建的对象——上面的 `$stmt`）。否则会导致错误。\n\n## 如何搜索我的表？\n\n有些人就是缺乏耐心；他们不会使用你提供的友好导航系统浏览网站，而是立即要求相关信息！而像你我这样乐于助人的\
  \ PHP 开发者，会愉快地实现搜索功能，为访问者提供获取所需信息的快捷方式。\n\n在过去糟糕的日子里，所有内容都以 HTML 文件形式存储，开发可用的搜索功能可能相当困难，但现在我们使用数据库存储内容，执行搜索变得容易得多。\n\
  \n## 解决方案\n\n最基本的搜索形式是针对单个列，使用数据库的 `LIKE` 运算符：\n\nlike.php（节选）\n\n```\n$country\
  \ = 'A';\n\ntry\n\n{\n\n$dbh = new PDO($dsn, $user, $password);\n\n$dbh->setAttribute(PDO::ATTR_ERRMODE,\n\
  \nPDO::ERRMODE_EXCEPTION);\n\n$sql = 'SELECT * FROM city\n\nWHERE CountryCode LIKE\
  \ :country';\n\n$stmt = $dbh->prepare($sql);\n\n$country = $country.'%';\n\n$stmt->bindParam(':country',\
  \ $country, PDO::PARAM_STR);\n\n64\n\nPHP 文集\n\n$stmt->execute();\n\nwhile ($row\
  \ = $stmt->fetchObject()) {\n\nprint $row->Name . \"\\t\";\n\nprint $row->CountryCode\
  \ . \"\\t\";\n\nprint $row->Population . \"\\n\";\n\n}\n\n}\n\ncatch (PDOException\
  \ $e)\n\n{\n\necho 'PDO Exception Caught. ';\n\necho 'Error with the database: <br\
  \ />';\n\necho 'SQL Query: ', $sql;\n\necho 'Error: ' . $e->getMessage();\n\n}\n\
  ```\n\n## 讨论\n\n`LIKE` 搜索几乎被所有数据库系统支持，10 通常与通配符一起使用。我在上面示例中使用的 `%` 字符匹配任意数量的字符——甚至零个字符。示例中使用的通配符允许我的查询找到任何以字母\
  \ A 开头的国家中的城市。\n\n另一个通常可用的通配符是 `_`，它匹配任意单个字符。因此，在上面的示例中，如果我只想查找以 A 开头并以 G 结尾的国家中的城市，只需更改一行代码：\n\
  \n```\n/* $country = $country.'%';\n<- 删除此行 */\n$country = $country.'_G';\n// <-\
  \ 添加此行\n```\n\n如果需要更复杂的搜索方法，请查阅数据库文档以了解可用功能。例如，MySQL 具有 `FULLTEXT` 搜索功能，如 MySQL\
  \ 手册网站所述。11\n\n10 应验证 `LIKE` 关键字以及要使用的通配符在数据库系统文档中的可用性。\n\n11 http://dev.mysql.com/doc/refman/5.0/en/fulltext-search.html\n\
  \n## 如何处理事务？\n\n假设我们正在当地银行完成一笔交易——需要将一些钱从储蓄账户转到支票账户（当然是为了支付度假费用）。现在，如果交易中途出现问题（在从储蓄账户取款之后，但在存入支票账户之前），钱就会消失，你的假期也就泡汤了。但真的会这样吗？\n\
  \n如果需要将一组 SQL 查询作为一个操作来运行以维护数据的完整性，那么就需要事务。几乎所有数据库都以某种形式提供事务支持，了解如何使用 `PDO` 处理事务可以帮助你确保那个应得的假期。\n\
  \n## 解决方案\n\n我们使用 `PDO->beginTransaction` 方法开始假设的事务，如果一切顺利，则使用 `PDO->commit` 结束。如果出现问题，则使用\
  \ `PDO->rollback` 方法撤销事务中发生的所有操作：\n\ntransaction.php（节选）\n\n```\ntry\n\n{\n\n$dbh\
  \ = new PDO($dsn, $user, $password);\n\n$dbh->setAttribute(PDO::ATTR_ERRMODE,\n\n\
  PDO::ERRMODE_EXCEPTION);\n\n$dbh->beginTransaction();\n\n$sql = 'INSERT INTO transactions\n\
  \n(acctNo, type, value, adjustment)\n\nVALUES (:acctNo, :type, :value, :adjust)';\n\
  \n$stmt = $dbh->prepare($sql);\n\n$stmt->execute(array(':acctNo'=>$acctFrom, ':type'=>$withdrawal,\n\
  \n':value'=>$amount, ':adjust'=>'-'));\n\n$sql = 'INSERT INTO transactions\n\n(acctNo,\
  \ type, value, adjustment)\n\nVALUES (:acctNo, :type, :value, :adjust)';\n\n$stmt\
  \ = $dbh->prepare($sql);\n\n$stmt->execute(array(':acctNo'=>$acctTo,\n\n':type'=>$deposit,\n\
  \n':value'=>$amount,\n\n':adjust'=>'+'));\n\n66\n\nPHP 文集\n\n$dbh->commit();\n\n\
  }\n\ncatch (Exception $e)\n\n{\n\n$dbh->rollBack();\n\n⋮ 此处进行进一步错误处理\n\n}\n```\n\
  \n\n\n\n## 讨论\n\n在深入探讨 PDO 事务处理能力的细微差别之前，我们先来看一下 PDO 手册第 12 页中关于**数据库事务**的官方定义：\n\
  \n“如果你之前从未接触过事务，那么它们提供了四大特性：*原子性、一致性、隔离性和持久性（ACID）*。13 通俗地说，在事务中执行的任何工作，即使是分阶段执行的，在提交时都能保证安全地应用到数据库中，并且不受其他连接的干扰。事务性工作也可以在你要求时自动撤销（前提是你尚未提交），这使得脚本中的错误处理更加容易。”\n\
  \n“事务通常通过‘累积’一批更改并一次性应用来实现；这还有一个很好的副作用，即大幅提高这些更新的效率。换句话说，事务可以使你的脚本运行得更快，并且可能更健壮（你仍然需要正确使用它们才能获得这种好处）。”\n\
  \n遗憾的是，并非所有数据库系统都支持事务。因此，默认情况下，PDO 会以自动提交模式运行，每个查询都被视为一个独立的事务。如果数据库不支持事务，则查询会在没有事务的情况下执行。如果你的数据库支持事务，你可以手动启动和停止事务，而不是使用自动提交功能。在上面的示例中，`PDO->beginTransaction`\
  \ 和 `PDO->commit` 方法在 try 块中被调用。`PDO->rollback` 在 catch 块中被使用，以便在出现问题时回滚数据库。\n\n\
  ### 如何在 PDO 中使用存储过程？\n\n许多数据库支持**存储过程**——这些脚本通常在数据库特定的 SQL 语言中运行。14 存储过程允许在数据所在位置附近操作数据，从而减少带宽。它们保持了数据与脚本逻辑的分离，并允许多个可能使用不同语言的系统以统一的方式访问数据（节省了宝贵的编码和调试时间）。最后，存储过程通过使用预定的执行计划来提高查询速度，并且可以防止与数据的直接交互，从而保护数据。\n\
  \n## 解决方案\n\n使用 PDO 处理存储过程相当简单。在下面的示例中，你将看到我们将在代码中与之交互的简单存储过程。15 它所做的只是生成莎士比亚《麦克白》中的台词：“Out,\
  \ damned spot!”：\n\n`getQuote.sql` *(摘录)*\n\n```sql\nDROP PROCEDURE IF EXISTS getQuote;\n\
  DELIMITER //\nCREATE PROCEDURE getQuote()\nBEGIN\n  DECLARE outStr VARCHAR(45);\n\
  \  SET outStr = \"Out, damned spot!\";\n  SELECT outStr;\nEND//\nDELIMITER ;\n```\n\
  \n以下是使用该存储过程的代码：\n\n14 这类语言包括 PL/SQL (Oracle)、T-SQL (SQL Server)、PL/pgSQL (PostgreSQL)\
  \ 以及 SQL::2003 (IBM DB2 和 MySQL)。  \n15 该存储过程使用 MySQL 的 SQL::2003 语法编写。\n\n`storedProc.php`\
  \ *(摘录)*\n\n```php\ntry\n{\n  $dbh = new PDO($dsn, $user, $password);\n  $dbh->setAttribute(PDO::ATTR_ERRMODE,\
  \ PDO::ERRMODE_EXCEPTION);\n  $sql = 'CALL getQuote()';\n  $stmt = $dbh->prepare($sql);\n\
  \  $stmt->execute();\n  $return_string = $stmt->fetch();\n}\ncatch (PDOException\
  \ $e)\n{\n  echo 'PDO Exception Caught. ';\n  echo 'Error with the database: <br\
  \ />';\n  echo 'SQL Query: ', $sql;\n  echo 'Error: ' . $e->getMessage();\n}\necho\
  \ 'Called stored procedure. It returned: ', $return_string[0];\n```\n\n示例脚本将产生以下输出：\n\
  \n```\nCalled stored procedure. It returned: Out, Damned Spot!\n```\n\n## 讨论\n\n\
  每个数据库的存储过程语言都不同，因此请务必查阅系统文档，以确定创建存储过程所需的具体语法。要了解更多关于 MySQL 存储过程的信息，请查看相关手册页面。16\n\
  \n在上面的 MySQL 示例中，你会注意到存储过程包含了 `DECLARE`、`SET` 和 `SELECT` 语句。一般来说，任何 MySQL 存储过程都需要这些语句来检索数据。从存储过程中检索数据不需要特殊操作——我们只需使用\
  \ `PDOStatement->fetch` 方法来获取存储过程中最后一个 `SELECT` 语句返回的值。（MySQL 通常为存储过程使用 *OUT* 参数，但在\
  \ PDO 中这不是必需的。）\n\n16 http://dev.mysql.com/doc/refman/5.0/en/stored-procedures.html\n\
  \n## 如何备份我的数据库？\n\n数据库变得越大，没有备份其中数据就越令人焦虑。这简直是噩梦：如果服务器崩溃，所有数据都丢失了怎么办？正是出于这个原因，数据库软件通常内置某种备份工具。在本解决方案中，我们将通过一个使用\
  \ MySQL 数据库系统的 `mysqldump` 工具的示例来进行说明。\n\n## 解决方案\n\n你可以使用 `mysqldump` 从命令行导出数据库内容：\n\
  \n```\nmysqldump -uuser -psecret world > world.sql\n```\n\n该命令将以用户“user”（`-uuser`）和密码“secret”（`-psecret`）登录\
  \ MySQL，并将 `world` 数据库的内容输出到名为 `world.sql` 的文件中。`world.sql` 的内容将是一系列可以在 MySQL 上运行的查询。使用\
  \ `mysql` 工具，我们可以从命令行执行反向操作：\n\n```\nmysql -uuser -psecret world < world.sql\n```\n\
  \n你可以使用 PHP 的 `system` 函数在 PHP 脚本中执行此命令（但你需要登录并能够从命令行执行 PHP 脚本）。以下示例将 `mysqldump`\
  \ 命令行工具封装到一个方便的 PHP 类中，你可以使用它来定期备份你的站点：\n\n`MySQLDump.class.php` *(摘录)*\n\n```php\n\
  <?php\nclass MySQLDump\n{\n  private $cmd;\n  public function __construct($dbUser,\
  \ $dbPass, $dbName, $dest, $zip = 'gz')\n  {\n    $zip_util = array('gz'=>'gzip','bz2'=>'bzip2');\n\
  \    if (array_key_exists($zip, $zip_util))\n    {\n      $fname = $dbName . '.'\
  \ . date(\"w\") . '.sql.' . $zip;\n      $this->cmd = 'mysqldump -u' . $dbUser .\
  \ ' -p' . $dbPass .\n                   ' ' . $dbName . '| ' . $zip_util[$zip] .\
  \ ' >' .\n                   $dest . '/' . $fname;\n    }\n    else\n    {\n   \
  \   $fname = $dbName . '.' . date(\"w\") . '.sql';\n      $this->cmd = 'mysqldump\
  \ -u' . $dbUser . ' -p' . $dbPass .\n                   ' ' . $dbName . ' >' . $dest\
  \ . '/' . $fname;\n    }\n  }\n  public function backup()\n  {\n    system($this->cmd,\
  \ $error);\n    if ($error)\n    {\n      trigger_error('Backup failed: ' . $error);\n\
  \    }\n  }\n}\n?>\n```\n\n![Image 31](img/index-92_1.png)\n![Image 32](img/index-92_2.jpg)\n\
  \n#### MySQLDump 假设\n\n`MySQLDump` 类对你的操作系统配置做出了一些假设。它假设执行此脚本的用户路径中可用的 `mysqldump`\
  \ 工具。如果使用了 `gzip` 或 `bzip2` 工具，它们也预期存在于用户路径中。如果你有选择，请使用 `bzip2`，因为它比 `gzip` 提供更好的压缩，有助于节省磁盘空间。\n\
  \n以下代码展示了如何使用这个类：\n\n`backup.php` *(摘录)*\n\n```php\n<?php\nrequire_once 'MySQLDump.class.php';\n\
  $dbUser = 'user';\n$dbPass = 'secret';\n$dbName = 'world';\n$dest   = '/home/user/backups';\n\
  $zip    = 'bz2';\n$mysqlDump = new MySQLDump($dbUser, $dbPass, $dbName, $dest, $zip);\n\
  $mysqlDump->backup();\n?>\n```\n\n这段代码将在 `/home/user/backups` 目录中创建 `world` 数据库的备份。如果你测试这个示例，请确保更改变量以匹配你的设置。\n\
  \n## 讨论\n\n`$dest` 变量指定了备份文件应放置的目录路径。创建的文件名格式如下：`databaseName.dayOfWeek.sql.zipExtension`\n\
  \n示例如下：\n\n`world.1.sql.bz2`\n\n\n\n\n一个代表星期几的数字（0 表示星期日，6 表示星期六）会被插入到 `dayOfWeek`\
  \ 元素中。这种文件名约定可以实现每周滚动备份，当前周的文件会覆盖前一周的文件。这种方法能够提供足够的备份：它给你一周的时间来发现任何严重问题，并且不需要过多的磁盘空间来存储文件。\n\
  \n是否使用 ZIP 工具是可选的。`$zip` 参数的默认值是 `gz`，表示应使用 gzip 工具。另一个选项是 `bz2`，表示应使用 bzip2 工具。如果这两个值都不使用，则不会进行压缩；不过，对于大型数据库来说，使用压缩工具来最小化所需的磁盘空间显然是个好主意。\n\
  \n这个类旨在与 `crontab` 工具一起使用，这是 Unix 的一个特性，允许你定期（例如每天）执行脚本。\n\n## 适应平台差异\n\n你可能已经注意到，上面的\
  \ `MySQLDump` 类只能在 *nix 服务器上运行。如果你的数据库服务器使用的是 Windows 系统呢？我提供以下解决方案来规避这个问题。首先，我们定义一个抽象的\
  \ `MySQLDump` 类，然后为每个平台扩展它创建子类，最后创建一个工厂方法来实例化所需的正确 `MySQLDump` 对象。以下是我们的抽象 `MySQLDump`\
  \ 类：\n\n### AbstractMySQLDump.class.php（节选）\n\n```php\nrequire_once 'MySQLDump_ms.class.php';\n\
  require_once 'MySQLDump_nix.class.php';\n\nabstract class MySQLDump\n{\n    public\
  \ static function factory($dbUser, $dbPass, $dbName, $dest, $zip)\n    {\n     \
  \   if (strtoupper(substr(PHP_OS, 0, 3)) === 'WIN')\n        {\n            return\
  \ new MySQLDump_ms($dbUser, $dbPass, $dbName, $dest, $zip);\n        }\n       \
  \ else\n        {\n            return new MySQLDump_nix($dbUser, $dbPass, $dbName,\
  \ $dest, $zip);\n        }\n    }\n\n    abstract public function __construct($dbUser,\
  \ $dbPass, $dbName, $dest, $zip = 'gz');\n\n    public function backup()\n    {\n\
  \        system($this->cmd, $error);\n        if ($error)\n        {\n         \
  \   throw new MySQLDumpException(\n                'Backup failed: Command = ' .\
  \ $this->cmd .\n                ' Error = ' . $error);\n        }\n    }\n}\n\n\
  class MySQLDumpException extends Exception {}\n```\n\n`backup` 方法代表了我们的备份 API。子类需要实现一个自定义构造函数来设置\
  \ `cmd` 属性。覆盖 `backup` 方法则是可选的。静态方法 `factory` 会根据 `PHP_OS` 常量（代表主机平台）来实例化一个 `MySQLDump`\
  \ 对象实例。我们还添加了一个自定义异常类 `MySQLDumpException` 用于错误处理。\n\n我们的备份类的 *nix 版本将包含与上述解决方案类类似的实现，但我们需要修改类定义，使其继承抽象的\
  \ `MySQLDump` 类：\n\n### MySQLDump_nix.class.php（节选）\n\n```php\nrequire_once 'AbstractMySQLDump.class.php';\n\
  \nclass MySQLDump_nix extends MySQLDump\n{\n    protected $cmd;\n\n    public function\
  \ __construct($dbUser, $dbPass, $dbName, $dest, $zip = 'gz')\n    {\n        $zip_util\
  \ = array('gz'=>'gzip','bz2'=>'bzip2');\n        if (array_key_exists($zip, $zip_util))\n\
  \        {\n            $fname = $dbName . '.' . date(\"w\") . '.sql.' . $zip;\n\
  \            $this->cmd = 'mysqldump -u' . $dbUser . ' -p' . $dbPass .\n       \
  \         ' ' . $dbName . '| ' . $zip_util[$zip] . ' >' .\n                $dest\
  \ . '/' . $fname;\n        }\n        else\n        {\n            $fname = $dbName\
  \ . '.' . date(\"w\") . '.sql';\n            $this->cmd = 'mysqldump -u' . $dbUser\
  \ . ' -p' . $dbPass .\n                ' ' . $dbName . ' >' . $dest . '/' . $fname;\n\
  \        }\n    }\n}\n```\n\n然后我们可以为 Windows 平台实现一个版本：\n\n### MySQLDump_ms.class.php（节选）\n\
  \n```php\nrequire_once 'AbstractMySQLDump.class.php';\n\nclass MySQLDump_ms extends\
  \ MySQLDump\n{\n    protected $cmd;\n\n    public function __construct($dbUser,\
  \ $dbPass, $dbName, $dest, $zip = 'none')\n    {\n        $fname = $dbName . '.'\
  \ . date(\"w\") . '.sql';\n        $this->cmd = 'mysqldump -u' . $dbUser . ' -p'\
  \ . $dbPass .\n            ' ' . $dbName . ' >' . $dest . '\\\\' . $fname;\n   \
  \ }\n}\n```\n\n上面的 Windows 版本包含了适应 Windows 路径的修改，并且由于该平台上缺少 `gzip` 和 `bzip2`，因此忽略了\
  \ `$zip` 参数。这个类还假设 `mysqldump.exe` 可执行文件的路径位于系统 `PATH` 环境变量中。\n\n以下是一个在 Windows\
  \ 系统上使用上述类的备份脚本示例：\n\n### backup2.php（节选）\n\n```php\n<?php\nrequire_once 'AbstractMySQLDump.class.php';\n\
  \ntry\n{\n    $dbUser = 'user';\n    $dbPass = 'secret';\n    $dbName = 'world';\n\
  \    $dest   = 'c:\\backups';\n    $zip    = 'none';\n\n    $mysqlDump = MySQLDump::factory($dbUser,\
  \ $dbPass, $dbName, $dest, $zip);\n    $mysqlDump->backup();\n}\ncatch (Exception\
  \ $e)\n{\n    echo $e->getMessage();\n}\n?>\n```\n\n由于我们使用抽象类来定义 API，无论使用哪个平台，只要它是我们支持的平台之一，类的使用方式都保持不变。\n\
  \n## 总结\n\n好了，我们对 PDO 和数据库的快速浏览到此结束！现在，你应该已经掌握了 PHP 的 PDO 扩展与数据库之间的基本工作原理。我们还讨论了搜索、存储过程、保护脚本免受\
  \ SQL 注入攻击、编写灵活代码以及进行数据库备份等主题。\n\n能够熟练使用数据库是 PHP 坚实基础的一部分，而学会充分利用 PHP 的 PDO 扩展只会让这一切变得更加容易。\n\
  \n利用这里提供的示例和解决方案来帮助你巩固现有的数据库技能。\n\n我也希望你能花时间进一步学习 SQL 和你的数据库。了解所选数据库平台的细微差别和功能，只会随着时间的推移让你的代码更加高效和优雅。\n\
  \n# 第 3 章：字符串\n\n`字符串`可以说是 PHP 的基础、存在的理由，甚至是跳动的心脏。毕竟，PHP 归根结底就是字符串的输入和输出。因此，PHP\
  \ 拥有比几乎所有其他脚本语言更多的字符串相关函数，这并不令人惊讶！\n\n与其他语言（如 C）不同，PHP 中的字符串不是字符数组；它们被视为一种简单类型，即**标量**。在\
  \ PHP 中，字符串可以使用单引号（`'`）或双引号（`\"`）来定义。使用双引号定义的字符串会被**插值**——这意味着字符串中的变量会被替换为其值。\n\n\
  对于不需要插值的字符串，请使用单引号。字符串本身是区分大小写的，但许多字符串函数允许以不区分大小写的方式对字符串进行操作。PHP 手册网站的字符串函数页面提供了所有可用字符串相关函数的链接。¹\n\
  \nPHP 的变量插值是使该语言如此快速易用的众多特性之一。然而，它的能力是有限的。首先，请看这个例子：\n\n```php\n<?php\n$who = 'world';\n\
  echo \"Hello $who\";\n?>\n```\n\n这里，我们有一个非常简单的变量 `$who`，其值为 `'world'`。当我们将变量名放入字符串中时，最终输出为“Hello\
  \ world”。\n\n虽然这个例子非常简单，但你可能会遇到数据存储在数组或复杂对象中的情况，在这些情况下，我们需要帮助 PHP 解释器。我们可以将变量括在花括号（`{`\
  \ 和 `}`）中，或者使用**连接**——即 `.` 运算符。以下是一个示例：\n\n```php\n<?php\n$user = array(\n    \"\
  first_name\" => \"Davey\",\n    \"last_name\" => \"Shafik\"\n);\n\n// 使用花括号\necho\
  \ \"Hello {$user['first_name']} {$user['first_name']}\";\n\n// 使用连接\necho 'Hello\
  \ ' . $user['first_name'] .' '. $user['last_name'];\n?>\n```\n\n在上面的例子中，我们通过将变量包裹在花括号中演示了变量插值。最后的语句表明，如果使用简单的连接，我们也能得到相同的输出。\n\
  \n¹ http://www.php.net/strings/\n\n\n\n尽管字符串被视为标量值，但 PHP 在某些情况下能够将字符串当作数组来处理。请看这个简单的示例，我们在一个\
  \ for 循环中逐字母输出字符串：\n\n```php\n<?php\n$string = 'Hello World!';\n$length = strlen($string);\n\
  for ($i = 0; $i < $length; $i++) {\n    echo $string[$i] . '<br />';\n}\n?>\n```\n\
  \n## 字符串\n\n注意，我们使用数组表示法从字符串中输出单个字母。上述代码将输出以下内容：\n\n```\nH<br />e<br />l<br />l<br\
  \ />o<br /> <br />W<br />o<br />r<br />l<br />d<br />!<br />\n```\n\n不过，这种将字符串当作数组处理的能力是有限的。例如，你不能将字符串传递给\
  \ PHP 的数组函数。\n\n## 如何安全地输出字符串？\n\n对字符串最常见的操作就是输出它们。\n\n无论你是将字符串输出到浏览器还是数据库，都需要小心地对字符串进行正确编码。某些字符串数据具有特殊含义，在最理想的情况下，它们可能会使输出变得模糊；在最坏的情况下，输出错误的字符串数据可能导致安全漏洞。\n\
  \n## 解决方案\n\n当将字符串输出到浏览器时，我们必须考虑几个方面：\n\n- 你是在 `<a>` 标签内输出 URL 吗？\n- 你是输出到 HTML\
  \ 表单元素吗？\n- 你是想显示还是移除任何 HTML？\n- 你需要保留格式吗？\n\n让我们看一个示例：\n\n```php\n<?php\n$text\
  \ = \"Ben & Jerrys Ice Cream\";\necho '<a href=\"/buy/' . rawurlencode($text) .\
  \ '\">Buy ' . htmlentities($text) . '</a>';\n?>\n```\n\n这里，`$text` 变量字符串包含一个需要转义的与符号（`&`）。\n\
  \n我们需要对文本执行两个独立的操作，以便在两个使用位置转义与符号。首先，我们需要使用 `rawurlencode` 函数将与符号和空格转换为有效的 URL 字符串。第二个操作使用\
  \ `htmlentities` 将与符号转换为有效的 HTML 实体，因为“&”在 HTML（和 XML）中是一个特殊字符。\n\n生成的 HTML 如下所示：\n\
  \n```html\n<a href=\"/buy/Ben%20%26%20Jerrys%20Ice%20Cream\">Buy Ben &amp; Jerrys\
  \ Ice Cream</a>\n```\n\n在 URL 字符串中，与符号已被替换为 `%26`，空格被替换为 `%20`，而链接文本中的与符号已被替换为 `&amp;`。\n\
  \n当你输出字符串以预填充表单字段时，还会出现更多考虑因素——也许你想显示默认数据、显示用户输入以供确认，或者处理错误。同样，`htmlentities` 函数可以完成这项工作：\n\
  \n```php\n<?php\n$quote = '\"So long, and thanks for all the fish!\"';\n?>\n<input\
  \ type=\"text\" name=\"fave_quote\"\nvalue=\"<?php echo htmlentities($quote); ?>\"\
  \ />\n```\n\n如果我们使用 `htmlentities` 函数，即使值包含双引号，也能确保其显示无误。上述代码的输出如下：\n\n```html\n\
  <input type=\"text\" name=\"fave_quote\"\nvalue=\"&quot;So long, and thanks for\
  \ all the fish!&quot;\" />\n```\n\n引号已被转换为 HTML 实体 `&quot;`。\n\n当我们将数据插入数据库时，最佳实践是插入未经输出转义转换的数据（例如我们刚才用于将字符串转换为\
  \ HTML 的那些转换）。这种做法确保你可以随时更改输出格式。然而，当我们将数据插入数据库时，必须转义某些字符，以确保数据不会干扰查询本身，并防止 SQL 注入攻击。如何转义插入的数据取决于你选择的数据库；例如，对于\
  \ MySQL，我们使用 `mysql_real_escape_string` 函数。\n\n请看这个示例，它演示了如何转义通过假设表单提交的字符串数据：\n\n\
  ```php\n<?php\n$first_name = mysql_real_escape_string($_POST['first_name']);\n$last_name\
  \ = mysql_real_escape_string($_POST['first_name']);\n$fave_quote = mysql_real_escape_string($_POST['fave_quote']);\n\
  $sql = \"INSERT INTO my_table (first_name, last_name, fave_quote)\n        VALUES\
  \ ('$first_name', '$last_name', '$fave_quote')\";\n// 继续执行查询：mysql_query($sql);\n\
  echo $sql;\n?>\n```\n\n使用 `mysql_real_escape_string` 函数可以确保无论用户通过表单提交什么内容，都不会破坏我们试图执行的\
  \ SQL——它既不会导致错误，也不会允许用户执行非预期的 SQL。其他数据库管理系统也有自己特定的字符串转义函数。例如，如果你使用 PostgreSQL 或\
  \ SQLite，可以分别使用 `pg_escape_string` 和 `sqlite_escape_string`。PDO 用户可以使用 `PDOStatement->bindParam`\
  \ 或 `PDO->quote` 方法，这些内容在第 2 章的“如何保护我的网站免受 SQL 注入攻击？”中讨论过。\n\n## 如何保留格式？\n\n假设你想将一封电子邮件输出到网页上，但在此过程中，你想保留电子邮件的格式——即保留换行符。PHP\
  \ 是否有现成的字符串函数可用？\n\n## 解决方案\n\n有两种简单的方法可以确保文本格式在网页上得以保留。首先，也是最简单的方法，你可以将文本放在 `<pre>`\
  \ 标签内。或者，如果你不想冒险因长行而破坏页面布局，可以使用 `nl2br` 函数将换行符转换为 `<br />` 标签。\n\n你可能有一段这样的 HTML：\n\
  \n```html\n<p>尊敬的先生或女士，\n\n这是我格式精美的信件。希望它能给您留下深刻印象。\n\n看！我开始了新段落。\n\n此致，\n\n迈克·格式</p>\n\
  ```\n\n你可能知道，当这段 HTML 输出时，用户将看到以下结果：\n\n尊敬的先生或女士，这是我格式精美的信件。希望它能给您留下深刻印象。看！我开始了新段落。此致，迈克·格式\n\
  \n但通过应用 `nl2br` 函数，我们可以确保用户看到的是原始格式的文本：\n\n```html\n<p>尊敬的先生或女士，<br />\n这是我格式精美的信件。希望它能给您留下深刻印象。<br\
  \ />\n<br />\n看！我开始了新段落。<br />\n此致，<br />\n迈克·格式</p>\n```\n\n## 如何从文本中剥离 HTML 标签？\n\
  \n如果你允许公众更新你的网站，那么防止使用 HTML 就很重要——你需要阻止访问者发布会干扰网站布局的标记。\n\n## 解决方案\n\nPHP 函数 `strip_tags`\
  \ 几乎完美地处理了这项工作。给定一些文本，`strip_tags` 会消除任何看起来像 HTML 标签的内容。更准确地说，`strip_tags` 会移除任何以\
  \ `<` 开头、以 `>` 结尾的文本块，而标签之外的所有内容则原封不动地保留。下面是一个简单的示例：\n\n```php\n<?php\n$text = '这是\
  \ <b>粗体</b>，这是 <i>斜体</i>。这个 <a href=\"http://www.php.net/\">链接</a> 呢？';\necho strip_tags($text);\n\
  ?>\n```\n\n这将输出以下结果：\n\n这是粗体，这是斜体。这个链接呢？\n\n你还可以为 `strip_tags` 提供一个允许的标签列表，让这些标签被忽略。\n\
  \n让我们稍微修改上面的示例：\n\n```php\necho strip_tags($text, '<b><i>');\n```\n\n这次，`strip_tags`\
  \ 会忽略 `<b>` 和 `<i>` 标签，并剥离其余部分，产生以下输出：\n\n这是 `<b>粗体</b>`，这是 `<i>斜体</i>`。这个链接呢？\n\
  \n## 讨论\n\n如你所见，`strip_tags` 会保留开始标签和结束标签之间的文本。如果它找到一个 `<` 字符但未能找到匹配的 `>` 字符，则会移除从该位置到字符串末尾的所有文本。\n\
  \n\n\n\n尽管这是推荐的解决方案，但使用 `strip_tags` 移除 HTML 并*不能*保证你的网站布局免受潜在危害。通过允许某些你认为对访客安全的标签，你给了访客使用这些标签中属性的可能性——例如\
  \ `style`——这可能会给你的网站布局带来问题。更糟糕的是，链接中包含的 JavaScript 提交可能导致跨站脚本攻击（XSS）安全漏洞。有关 XSS\
  \ 及其预防方法的更多信息，请参阅 Chris Shiflett 网站上的解决方案，2 以及 WikiBlog 关于 XSS 预防的页面。3\n\n2 http://shiflett.org/articles/foiling-cross-site-attacks\
  \ 3 http://wiki.flux-cms.org/display/BLOG/XSS+Prevention\n\n84\n\nPHP 文集\n\n## 如何强制文本在特定字符数后换行？\n\
  \n大多数开发者发现一个非常实用的函数是 `wordwrap`。如果你有一段没有特定格式的长文本，你可以使用 `wordwrap` 在指定间隔处插入一个字符，例如换行符（`\\\
  n`）。`wordwrap` 会注意不拆分单词，除非你特别指定。这个函数在构建格式良好的电子邮件消息时尤其有用。\n\n## 解决方案\n\n要使用 `wordwrap`，我们只需向其传递一个字符串。`wordwrap`\
  \ 的默认行为是尽可能在接近 75 个字符处换行（不会拆分单词），并在每个断点处插入换行符（`\\n`）。在这个例子中，我们打算输出 HTML，因此我们提供两个额外参数来改变这个默认行为：\n\
  \n```php\n<?php\n\n$string = \"This is a long sentence that will be cut at sixty\n\
  ➥ characters automatically. Don't worry,\n➥ no words will be broken up.\";\n\necho\
  \ wordwrap($string, 60, \"<br />\");\n\n?>\n```\n\n通过这个调用，`wordwrap` 在 60 个字符处换行，并插入\
  \ `<br />` 标签而不是换行符。输出结果如下：This is a long sentence that will be cut at sixty characters<br\
  \ />\n➥automatically. Don't worry, no words will be broken up.\n\n因此，我们把这个笨拙的句子处理得更加易读——而且没有拆分任何单词。\n\
  \n## 如何执行高级搜索和替换操作？\n\nPHP 附带了一套强大的字符串函数，可用于搜索和替换操作。你第一次浏览 PHP 网站上的相关手册页面时，可能会觉得这些函数很简单，但稍加巧妙运用，你就能用它们完成很多任务。4\
  \ `str_replace`、`strpos` 和 `substr_replace` 就是三个这样的例子——它们初看简单，但我们可以用它们完成复杂任务。`str_replace`\
  \ 替换一个字符串中所有出现的另一个字符串，`strpos` 返回一个字符串在另一个字符串中首次出现的位置，`substr_replace` 替换字符串中某一部分的文本。\n\
  \n## 解决方案\n\n搜索和替换文本最简单的方法是使用 `str_replace` 函数。让我们考虑以下代码：\n\n```php\n<?php\n\n$word\
  \ = 'general-purpose';\n\n$text = <<<EOD\n\nPHP (recursive acronym for \"PHP: Hypertext\
  \ Preprocessor\") is a widely used Open Source general-purpose scripting language.\n\
  \nEOD;\n\necho str_replace($word, '<strong>' . $word . '</strong>', $text);\n\n\
  ?>\n```\n\n上面的例子执行了一个非常简单的搜索和替换操作，帮助我们向文本添加 HTML 标记。在这个例子中，文本中的字符串“general-purpose”被包裹在\
  \ `<strong>` 标签中，并产生以下输出：PHP (recursive acronym for \"PHP: Hypertext Preprocessor\"\
  ) is a widely used Open Source `<strong>general-purpose</strong>`\n➥ scripting language.\n\
  \n`substr_replace` 函数提供了对文本替换方式的控制，但要使用它，我们需要指定替换的位置和长度。例如，如果我们只想找到要替换文本的第一个实例，可以尝试以下代码：\n\
  \n4 http://www.php.net/strings/\n\n86\n\nPHP 文集\n\n```php\n<?php\n\nfunction addTag($text,\
  \ $word, $tag)\n\n{\n\n$length = strlen($word);\n\n$start = strpos($text, $word);\n\
  \n$word\n\n= '<' . $tag . '>' . $word . '</' . $tag . '>'; return substr_replace($text,\
  \ $word, $start, $length);\n\n}\n\n$text = <<<EOD\n\nPHP (recursive acronym for\
  \ \"PHP: Hypertext Preprocessor\") is a widely used Open Source general-purpose\
  \ scripting language.\n\nEOD;\n\necho addTag($text, 'general-purpose', 'strong');\n\
  \n?>\n```\n\n这里我们创建了一个函数 `addTag`，它在指定单词首次出现的位置包裹一个 HTML 标签。为了使用 `substr_replace`\
  \ 完成这个任务，我们必须使用 `strlen` 找到单词的长度，并使用 `strpos` 找到它在文本中的位置。\n\n`substr_replace` 非常灵活。如果你为\
  \ `$start` 参数指定一个负值，它将从文本末尾而不是开头开始计数进行替换操作。`$length` 参数表示要替换的原始文本长度，是可选的。如果省略此参数，则替换整个字符串。如果设置为零，则不替换任何文本——替换字符串会被插入到\
  \ `$start` 参数指定的位置。负值设置表示从文本末尾开始多少字符处停止替换操作。\n\n## 如何将文本分割成行数组？\n\n假设你有一个包含在字符串值中的信息，你想将其拆分成单独的值，例如用逗号分隔的标签列表，或用换行符分隔的项目列表。完成这个任务的最佳方法是什么？\n\
  \n## 解决方案\n\n如果我们假设文本中包含换行符，我们可以使用 `explode` 函数将其分割成行数组：\n\n![Image 33](img/index-109_1.jpg)\n\
  \nStrings\n\n87\n\n```php\n<?php\n\n$text = <<<EOD\n\nThis will be row 1\n\nThis\
  \ will be row 2\n\nThis will be row 3\n\nThis will be row 4\n\nEOD;\n\n$lines =\
  \ explode(PHP_EOL, $text);\n\necho '<table border=\"1\">' .PHP_EOL;\n\nforeach ($lines\
  \ as $line)\n\n{\n\necho '<tr>' .PHP_EOL. '<td>' .$line. '</td>' .PHP_EOL. '</tr>'\
  \ .\n\nPHP_EOL;\n\n}\n\necho '</table>' .PHP_EOL;\n\n?>\n```\n\n这个脚本使用 `explode`\
  \ 在换行符处分割文本，并将文本放入一个数组中。使用 `PHP_EOL` 常量——当前操作系统的行结束符（EOL）——作为换行符，使脚本更具可移植性。\n\n\
  然后使用该数组构建一个 HTML 表格，如图 3.1 所示。\n\n图 3.1. 使用 `explode` 将文本输出为表格\n\n## 讨论\n\n了解 `implode`\
  \ 函数的作用与这里看到的完全相反——它从数组构建一个字符串，这很有用。让我们在上面的例子中添加以下代码：\n\n```php\necho implode($lines,\
  \ PHP_EOL);\n```\n\n以下是原始字符串的输出结果：\n\n88\n\nPHP 文集\n\nThis will be row 1\n\nThis\
  \ will be row 2\n\nThis will be row 3\n\nThis will be row 4\n\n## 如何修剪文本中的空白？\n\n\
  在处理表单提交等任务时，我们经常需要考虑空白。有时用户会错误地提交空白——毕竟很难看到。用户也可能故意提交空白，例如为了逃避填写字段。\n\n提交数据中的空白可能会给你的应用程序带来问题——例如，错误地包含空白可能导致存储不正确的用户名或电子邮件地址——因此能够修剪提交表单值中的空白非常有用。\n\
  \n## 解决方案\n\n`trim` 函数是另一个方便的 PHP 工具。它移除字符串开头和结尾的空白字符，用法如下：\n\n```php\n<?php\n\n\
  $string = ' This has whitespace at both ends\n\n';\n\n// 移除那些空白\n\n$string = trim($string);\n\
  \nif (strlen($string) > 0) {\n\n⋮ *不仅仅是空格…*\n\n}\n\n?>\n```\n\n\n\n\n# 如何输出格式化文本？\n\
  \n这个简单的函数能确保用户不会用空格代替真实数据。如果我们只想去除字符串左侧或右侧的空白，可以分别使用 `ltrim` 或 `rtrim`。\n\n字符串 89\n\
  \n## 解决方案\n\n强大的 `printf` 和 `sprintf` 函数根据特殊的格式化指令输出格式化字符串，前者将输出显示到屏幕，后者则输出到字符串。格式化指令的形式是\
  \ `%` 字符后跟一个或多个指令元素。下面是一个示例：\n\n```php\n<?php\n\n$fruit = array('banana', 'mango',\
  \ 'pear');\n\n$price = array('30', '50', '35');\n\n$format = 'A %s costs %d cents.<br\
  \ />'; for ($i = 0; $i < 3; $i++)\n\n{\n\nprintf($format, $fruit[$i], $price[$i]);\n\
  \n}\n\n?>\n```\n\n该脚本产生以下输出：\n\nA banana costs 30 cents.\n\nA mango costs 50 cents.\n\
  \nA pear costs 35 cents.\n\n在这个例子中，`$format` 包含特殊字符 `%s` 和 `%d`，`printf` 和 `sprintf`\
  \ 会识别它们，并用我们作为参数提供的值进行替换。参数按照传递给函数的顺序与值交换：`%s` 将值格式化为字符串，`%d` 将值格式化为数字。\n\n要改变值在输出中出现的顺序，我们可以简单地更改格式字符串，而无需更改传递给\
  \ `printf` 或 `sprintf` 函数的参数顺序。让我们使用第一个示例中的值数组，但更改输出，使值以不同的顺序出现：\n\n```php\n$format\
  \ = ' %2$d cents will buy you a %1$s.<br />'; for ($i = 0; $i < 3; $i++)\n\n{\n\n\
  printf($format, $fruit[$i], $price[$i]);\n\n}\n```\n\n`%2$d` 格式字符会将第二个参数格式化为数字。如果为了变量插值而需要对格式字符串使用双引号，则需要转义\
  \ `$` 字符。例如，如果我们想在末尾添加换行符 `\\n`，则需要以下格式字符串：\n\n```php\n$format = \" %2\\$d cents\
  \ will buy you a %1\\$s.<br />\\n\";\n```\n\n这些示例非常简单，但格式化指令（如填充、对齐或浮点精度）可能相当复杂。更多详情，请参考\
  \ PHP 手册中的 `sprintf` 页面。5\n\nhttp://www.php.net/sprintf/\n\n# 如何验证提交的数据？\n\n验证字符串是实现网页表单的重要组成部分。如何确保用户通过表单提交的数据是预期的内容——例如，一个\
  \ URL 或电子邮件地址？提交无效数据是一个非常常见的问题。\n\n## 解决方案\n\n典型的验证方法包括大量使用正则表达式。幸运的是，`PEAR::Validate`\
  \ 可以帮上忙，所以我们不需要重新发明轮子。`PEAR::Validate` 提供了一个主类，用于验证 Web 应用程序中常见的字符串和值，以及越来越多的相关国际化类，用于处理特定国家/地区的要求，例如英国邮政编码和美国居民的社会安全号码。每个类都包含一组静态方法（无需从类构造对象即可调用的方法），用于验证特定值。\n\
  \n以下是我们如何使用主 `Validate` 类中的三个方法——即 `string`、`email` 和 `url`——来验证通过表单接收的数据：\n\n`pear_validate.php`\
  \ *(摘录)*\n\n```php\nerror_reporting(E_ALL);\n\nrequire_once 'strip_quotes.php';\n\
  \nrequire_once 'Validate.php';\n\n$errors = array('name' => '', 'email' => '', 'url'\
  \ => ''); if (isset($_POST['submit']))\n\n{\n\n$name_options = array(\n\n'format'\n\
  \n=> VALIDATE_ALPHA . VALIDATE_SPACE,\n\n'min_length' => 5\n\n);\n\nif (!Validate::string($_POST['name'],\
  \ $name_options))\n\n{\n\n$errors['name'] = ' class=\"error\"';\n\n}\n\nif (!Validate::email($_POST['email']))\n\
  \n{\n\n$errors['email'] = ' class=\"error\"';\n\n}\n\nif (!Validate::url($_POST['url']))\n\
  \n{\n\n$errors['url'] = ' class=\"error\"';\n\n}\n\n}\n```\n\n首先，我们使用 `error_reporting`\
  \ 函数关闭 `E_STRICT` 错误报告，因为 `PEAR::Validate` 会生成 `E_STRICT` 错误。你可以在第 9 章中阅读更多关于此内容及其他错误处理主题的信息。\n\
  \n接下来，我们包含 `strip_quotes.php` 和 `PEAR::Validate` 包。`strip_quotes.php` 包含处理魔术引号的代码（你可以在第\
  \ 1 章的“检查魔术引号”部分阅读更多内容）。我们还创建了一个 `$errors` 变量数组，用于存储字段验证的结果。然后，在测试表单已提交后，我们静态调用验证方法来检查字段。第一个检查确定名字字段中的数据是一个仅包含字母或空格字符的字符串，并且长度至少为五个字符——这个验证要求是自定义的，我们通过\
  \ `$name_options` 数组来定义它。\n\n接下来，我们只需调用 `Validate::email` 和 `Validate::url` 方法来检查通过表单提交的电子邮件和\
  \ URL 字段。请注意，如果我们将值 `true` 作为第二个参数传递，`PEAR::Validate` 会使用 PHP 的 `checkdnsrr` 函数检查指定主机名在\
  \ DNS 中的存在性。还要注意，这种验证会导致时间延迟，因为主机需要与最近的 DNS 服务器通信。\n\n在我们的 `$errors` 数组中，如果验证通过，我们存储一个空字符串；如果验证失败，则存储\
  \ `' class=\"error\"'`。我们将这个字符串插入到表单的 `<label>` 标签中。在标签元素中添加 `' class=\"error\"\
  '` 允许我们通过 CSS 向用户提供一些视觉反馈，以指示验证错误。\n\n以下是表单本身的代码：\n\n`pear_validate.php` *(摘录)*\n\
  \n```php\n<form class=\"userinfo\"\n\naction=\"<?php echo $_SERVER['SCRIPT_NAME'];\
  \ ?>\" method=\"post\">\n\n<?php\n\n$name = isset($_POST['name']) ? $_POST['name']\
  \ : ''; $email = isset($_POST['email']) ? $_POST['email'] : ''; $url = isset($_POST['url'])\
  \ ? $_POST['url'] : '';\n\n?>\n\n<legend>输入您的详细信息</legend>\n\n<div>\n\n<label<?php\
  \ echo $errors['name']; ?>>姓名：</label>\n\n<span>\n\n<input type=\"text\" name=\"\
  name\"\n\nvalue=\"<?php echo $name; ?>\" />\n\n</span>\n\n</div>\n\n<div>\n\n<label<?php\
  \ echo $errors['email']; ?>>电子邮件：</label>\n\n<span>\n\n<input type=\"text\" name=\"\
  email\"\n\nvalue=\"<?php echo $email; ?>\" />\n\n</span>\n\n</div>\n\n<div>\n\n\
  <label<?php echo $errors['url']; ?>>网站：</label>\n\n<span>\n\n<input type=\"text\"\
  \ name=\"url\"\n\nvalue=\"<?php echo $url; ?>\" />\n\n</span>\n\n</div>\n\n<div>\n\
  \n<span>\n\n<input type=\"submit\" name=\"submit\" value=\"发送\" />\n\n</span>\n\n\
  </div>\n\n</form>\n```\n\n![图片 34](img/index-115_1.jpg)\n\n字符串 93\n\n图 3.2. 验证前显示的表单\n\
  \n提交后重新构建表单时，我们使用 `$errors` 数组和一些 CSS 将表单标签高亮显示为红色：\n\n`pear_validate.php` *(摘录)*\n\
  \n```css\n.error {\n\ncolor: red;\n\nfont-weight: bold;\n\n}\n```\n\n这可以让用户知道输入的哪一部分无效，如图\
  \ 3.3 所示。\n\n![图片 35](img/index-116_1.jpg)\n\n94\n\nPHP 文集\n\n图 3.3. 验证后显示的表单\n\n\
  当然，仅仅将标签颜色改为红色并不够信息量；你可以通过添加字段验证消息来改进这个示例，让用户确切知道如何修复验证问题。\n\n## 讨论\n\n验证用户输入并向用户传达错误是作为\
  \ Web 开发人员需要执行的最重要的任务之一。当然，如果 `PEAR::Validate` 对你的需求来说过于复杂，你可能会发现内置的 `ctype_*` 函数更合你的口味。6\n\
  \n请记住：出于安全考虑，你必须验证所有用户输入，并且在将其输出为 HTML 或保存到数据库之前对其进行转义。\n\n\n\n\n\n## 总结\n\n现在你应该对\
  \ PHP 普通字符串函数能实现的功能有了清晰的认识。如果仅使用这些函数就能满足需求，那就尽管用吧——它们快速、易用，且远不如正则表达式那样容易出错。\n\n\
  字符串操作是 PHP 开发者工作的核心。从用户输入到应用输出——从发送给浏览器的 HTML 到发送给数据库的 SQL——如何安全、可靠且高效地处理字符串，是 PHP\
  \ 专业人员最重要的技能之一。\n\n6 http://www.php.net/c_type/\n\n# 第 4 章\n\n## 日期与时间\n\n如果我们一周有十天，一小时有\
  \ 100 分钟，一年有十个月，那该多好？\n\n日期和时间可能是你习以为常的东西。你每天都会处理它们，却可能没有意识到大脑中那些巧妙的数学算法，它们让你能预判还要等多久才能迎来周五的夜晚。直到你开始用代码处理日期和时间时，你才会意识到，这些年来你习以为常的东西在代码中并不那么容易处理。这都怪罗马人！\n\
  \n在日常生活中，我们习惯使用十进制（基数为十）的数字，这种进制针对十的倍数进行了优化（十个一等于十，十个十等于一百，十个百等于一千，以此类推）。我不想给你上数学课，但日期和时间的问题在于它们不能整齐地按十的倍数划分。想想看：\n\
  \n- 一秒有 1000 毫秒。没问题。\n- 一分钟有 60 秒。\n- 一小时有 60 分钟。\n\n96\n\nPHP 文集\n\n- 一天有 24 小时。\n\
  \n那么，给定一个毫秒值，如何计算天数？这需要一连串的长除法！而且这还只是时间——日期呢？\n\n- 一周有 7 天（你的星期是从周日还是周一开始？）。\n-\
  \ 一个月有……呃……你无法确切知道有多少天或多少周；这取决于月份（更别提闰年了！）。\n- 一年有 12 个月。\n\n当然，这还算简单。那如何让它变得更复杂呢？你经常需要以多种格式表示日期，例如“2003\
  \ 年 3 月 18 日星期二”、“03/18/03”（美国格式）、“18/03/03”（欧洲格式）、“18 Mar 2003”和“20030318”（MySQL\
  \ 风格的时间戳），更不用说“1047942000”（Unix 时间戳）了！\n\n你打算如何显示从数据库中获取并按日期排序的文章列表？如果你想呈现更复杂的内容，比如在线日历呢？\n\
  \n如你所见，在应用程序中处理日期和时间需要考虑很多方面。幸运的是，PHP 在尽可能简化时间和日期处理方面确实很有帮助，这要归功于像 `date` 这样强大的函数。但作为\
  \ PHP 程序员，尽早制定处理日期和时间的正确策略至关重要。从一开始就采取正确的方法，你就能避免日后回头编写极其复杂的代码来修复新手时期犯下的错误。在本章中，我们将探讨可以采用的策略，并解决在编程处理日期和时间时常见的一些问题。\n\
  \n### 如何使用 Unix 时间戳？\n\n**时间戳** 是以一种格式标识日期和时间的数字，这种格式可用于解决应用程序中常见的各种问题；它使得执行诸如排序列表或比较两个日期等操作变得更加容易。\n\
  \n作为 PHP 开发者，你可能会遇到两种类型的时间戳：Unix 时间戳和 MySQL（或其他数据库管理系统）时间戳。\n\n日期与时间\n\n97\n\nUnix\
  \ 时间戳通常是表示和操作日期与时间值最有效的格式——它们为棘手的问题提供了简单的解决方案。Unix 时间戳反映了自纪元（1970 年 1 月 1 日 00:00:00\
  \ GMT）以来经过的秒数。将日期转换为 Unix 时间戳使得在 PHP 中进行日期和时间相关的计算变得简单。让我们看看它们是如何工作的。\n\n## 解决方案\n\
  \nPHP 提供了诸如 `time` 和 `mktime` 之类的函数来帮助我们处理 Unix 时间戳。`time` 会以 Unix 时间戳的形式返回当前时间。从\
  \ PHP 5.1 开始，全局变量 `$_SERVER['REQUEST_TIME']` 会返回当前请求的时间戳。`mktime` 会返回指定日期的时间戳。我们这样使用\
  \ `mktime`：\n\n```\n$timestamp = mktime($hour, $minute, $second, $month, $day, $year);\n\
  ```\n\n## 讨论\n\nUnix 时间戳的缺点在于，除非你是某种天才，否则它们对人类来说不可读。如果我告诉你 1047994036 是自 1970 年\
  \ 1 月 1 日以来经过的秒数，你能多快告诉我那是什么日期？\n\nUnix 时间戳的另一个问题是，根据操作系统的不同，它们只能在有限的日期范围内使用。在基于\
  \ Linux 的系统上，你应该能回溯到大约 1902 年，并向前到 2037 年。在基于 Windows 的操作系统上，最早的日期可能只到 1970 年 1\
  \ 月 1 日。问题在于用于表示时间值的数字大小。任何操作系统都能轻松处理一定大小以内的整数（对于当前的 32 位操作系统是 4,294,967,296），超过这个大小后，操作系统就必须更费力地处理过大的数字。\n\
  \n因此，为了提高效率，操作系统通常会对日期和时间等重要值施加这个“最大”大小限制。至少 Linux 允许日期使用负整数值；它可以处理 1970 年 1 月 1\
  \ 日之前的日期，而 Windows 上的 PHP 可能会对这些日期报错。此外，这个问题的另一面是，另一个潜在的类似 Y2K 的问题将影响所有仍存在的 32 位操作系统，它笼罩着\
  \ 2038 年 1 月 19 日这个日期。\n\n98\n\nPHP 文集\n\n在谷歌上搜索那个日期，你就会明白我的意思。虽然 2038 年还很遥远，而且时间戳问题可能最多只会影响你选择心脏起搏器，但如果你正在规划一个需要处理遥远过去或未来日期的应用程序（比如历史网站），那么记住这个故障是值得的。要亲眼看到这个问题，请尝试在尽可能多的不同操作系统上运行以下脚本：\n\
  \n```php\n<?php\necho '1899 年 1 月 1 日: ' . mktime(0, 0, 0, 1, 1, 1899) . '<br />';\n\
  echo '1902 年 1 月 1 日: ' . mktime(0, 0, 0, 1, 1, 1902) . '<br />';\necho '1969 年\
  \ 12 月 31 日: ' . mktime(0, 0, 0, 12, 31, 1969) . '<br />';\necho '1970 年 1 月 1 日:\
  \ ' . mktime(0, 0, 0, 1, 1, 1970) . '<br />';\necho '2037 年 1 月 1 日: ' . mktime(0,\
  \ 0, 0, 1, 1, 2037) . '<br />';\necho '2038 年 1 月 1 日: ' . mktime(0, 0, 0, 1, 1,\
  \ 2038) . '<br />';\necho '2038 年 1 月 19 日: ' . mktime(0, 0, 0, 1, 19, 2038) . '<br\
  \ />';\necho '2038 年 1 月 20 日: ' . mktime(0, 0, 0, 1, 20, 2038) . '<br />';\necho\
  \ '2039 年 1 月 1 日: ' . mktime(0, 0, 0, 1, 19, 2039) . '<br />';\n?>\n```\n\n根据你的操作系统（这在\
  \ Windows 上尤其是个问题），这个示例可能会生成一系列不同的 PHP 警告错误。\n\n处理 Unix 时间戳时需要注意的另一个方面是，它们的长度会变化；1970\
  \ 年 1 月 2 日的时间戳显然会比当前的时间戳短。一般来说，当你在数据库中存储 Unix 时间戳时，列大小为 11（INT(11)）应该足以让你的应用程序在未来几百年内正常运行（当然，前提是它不在\
  \ 32 位操作系统上运行）。\n\n### 如何获取当前日期？\n\n获取当前日期看似简单，但很快就会变得棘手。考虑到在任何给定时间点，可能存在多种客户端和服务器时区以及夏令时偏移，你可以看出这个操作很快就会变得比最初看起来复杂得多。\n\
  \n日期与时间\n\n99\n\n## 解决方案\n\n\n\n\n\n根据你的服务器获取当前日期的最简单方法是使用 `time` 函数。`time` 返回当前日期的\
  \ Unix 时间戳。我们可以使用 `date` 函数将该日期格式化为人类可读的形式：\n\n```php\n<?php\n\n$timestamp = time();\n\
  \necho date(\"F jS, Y\", $timestamp); // November 7th, 2006\n\n?>\n```\n\n`date`\
  \ 的第一个参数是一系列占位符，用于指定日期的格式。最常见的占位符见表 4.1。如果你没有指定时间戳参数，`date` 默认使用当前日期。\n\n## 讨论\n\
  \n直接调用 `time` 函数的一个问题是，返回的时间是服务器所在时区的时间，而不是你或访问者的时区。为了解决这个问题，我们可以使用 `php.ini` 中的\
  \ `date.timezone` 设置，或者使用 `date_default_timezone_set` 函数，该函数会更改所有日期相关函数的时区：\n\n\
  ```php\n<?php\n\n$timestamp = time();\n\necho date(\"F jS, Y\", $timestamp) . '<br\
  \ />'; // August 24th, 2007\n\ndate_default_timezone_set('America/New_York');\n\n\
  echo date(\"F jS Y H:i:s\") . '<br />'; // August 24th, 2007 03:06:29\n\ndate_default_timezone_set('Africa/Cairo');\n\
  \necho date(\"F jS Y H:i:s\"); // August 24th, 2007 10:06:29\n\n?>\n```\n\n### 表\
  \ 4.1. 最常见的占位符\n\n| 占位符 | 描述 |\n|--------|------|\n| `d` | 月份中的日期，两位数，带前导零 |\n|\
  \ `D` | 日期的文本表示，三个字母 |\n| `j` | 月份中的日期，不带前导零 |\n| `l`（小写 L） | 星期几的完整文本表示 |\n| `S`\
  \ | 月份中日期的英文序数后缀，两个字符 |\n| `F` | 月份的完整文本表示，例如 January 或 March |\n| `m` | 月份的数字表示，带前导零\
  \ |\n| `M` | 月份的简短文本表示，三个字母 |\n| `n` | 月份的数字表示，不带前导零 |\n| `t` | 给定月份的天数 |\n| `L`\
  \ | 是否为闰年 |\n| `Y` | 年份的完整数字表示，四位数字 |\n| `y` | 年份的两位数字表示 |\n| `a` | 小写的 am 或 pm\
  \ |\n| `A` | 大写的 AM 或 PM |\n| `g` | 12 小时制的小时，不带前导零 |\n| `G` | 24 小时制的小时，不带前导零 |\n\
  | `h` | 12 小时制的小时，带前导零 |\n| `H` | 24 小时制的小时，带前导零 |\n| `i` | 分钟，带前导零 |\n| `s` | 秒，带前导零\
  \ |\n| `I`（大写 i） | 日期是否处于夏令时 |\n| `O` | 与格林威治时间（GMT）的小时差 |\n| `P` | 与格林威治时间（GMT）的时差，小时和分钟之间带冒号（PHP\
  \ 5.1.3 新增） |\n| `T` | 本机的时区设置 |\n\n### 如何找到某一天是星期几？\n\n我们按照星期几来安排生活。当人们谈论日期时，经常使用“下周二”或“上周三”这样的说法。这样理解日期比阅读一个日期然后推断出它是下周二要容易得多。那么，给定任意格式的日期，比如“1984\
  \ 年 5 月 31 日”，我们如何轻松确定这个日期是星期几呢？\n\n## 解决方案\n\n我们不需要编写复杂的解析器将日期转换为时间戳，然后进行复杂的数学运算来计算自该日期以来经过的秒数等，只需将日期传递给\
  \ `strtotime` 函数即可。`strtotime` 函数似乎拥有无限的能力来理解日期并自动将其转换为 Unix 时间戳，然后我们可以将其与 `date`\
  \ 函数和 `l`（小写 L）占位符一起使用。下面是 `strtotime` 的实际应用：\n\n```php\n<?php\n\n$timestamp = strtotime(\"\
  May 31st 1984\");\n\n$weekday = date(\"l\", $timestamp);\n\necho $weekday; // Thursday\n\
  \n?>\n```\n\n### 如何找到一个月中的天数？\n\n一个常见的任务，尤其是在编写基于日期的应用程序（如日历）时，是查找一个月中的天数。别忘了那个棘手的月份——二月！幸运的是，使用\
  \ PHP 可以轻松获取一个月中的天数。\n\n## 解决方案\n\n我们使用 `strtotime` 函数和 `date` 函数，配合 `t` 占位符，轻松获取此信息：\n\
  \n```php\n<?php\n\n$timestamp = strtotime(\"October\");\n\n$days = date(\"t\", $timestamp);\n\
  \necho $days; // 31\n\n?>\n```\n\n### 如何创建日历？\n\n所有开发者在职业生涯中都会遇到一个令人生畏的任务：创建某种形式的日历。知道从哪里开始往往是第一个障碍。\n\
  \n## 解决方案\n\n正如你可能从我们之前的讨论中开始察觉到的，`strtotime` 是一个非常强大的函数。事实上，到目前为止你只看到了它能力的一小部分。除了日历日期，`strtotime`\
  \ 还允许你传入更随意、人类可读的表达式，例如 `+1 week`、`next friday`、`last saturday`，甚至 `+1 year 6 months\
  \ 38 days 15 hours 26 minutes 12 seconds`。通过利用 `strtotime` 的出色能力，并借助 PEAR 的 `HTML_Table_Matrix`\
  \ 类，我们可以非常轻松地创建一个简单的日历。¹\n\n让我们开始吧：\n\n**calendar.php（节选）**\n\n```php\nerror_reporting(E_ALL);\n\
  \nrequire_once \"HTML/Table/Matrix.php\";\n\ndefine(\"EMPTY_COLUMN\", \"\");\n```\n\
  \n首先，我们使用 `error_reporting` 函数关闭 `E_STRICT` 错误报告，因为 `PEAR::HTML_Table_Matrix` 会生成\
  \ `E_STRICT` 错误——你可以在第 9 章中了解更多关于此内容和其他错误处理主题的信息。接下来，我们引入 `HTML_Table_Matrix` 包，并定义一个常量\
  \ `EMPTY_COLUMN`，以使代码更具可读性。\n\n接下来，我们对月份和年份值进行验证：¹ 你可以在 http://pear.php.net/package/HTML_Table_Matrix/docs/1.0.5/HTML_Table_Matrix/HTML_Table_Matrix.html\
  \ 阅读关于 `HTML_Table_Matrix` 的全部内容。\n\n**calendar.php（节选）**\n\n```php\n$months = array(\"\
  January\", \"February\", \"March\",\n\n\"April\", \"May\", \"June\", \"July\",\n\
  \n\"August\", \"September\", \"October\",\n\n\"November\", \"December\");\n\nif\
  \ (isset($_GET['month']) && in_array($_GET['month'], $months))\n\n{\n\n$month =\
  \ $_GET['month'];\n\n}\n\nelse\n\n{\n\n$month = date(\"F\");\n\n}\n\nif (isset($_GET['year'])\
  \ &&\n\nis_numeric($_GET['year']) &&\n\n$_GET['year'] >= 1970 &&\n\n$_GET['year']\
  \ <= 2038)\n\n{\n\n$year = $_GET['year'];\n\n}\n\nelse\n\n{\n\n$year = date(\"Y\"\
  );\n\n}\n```\n\n上面，我们定义了一个允许的 `$month` 变量值数组。这是我们的白名单，用于确保传递了有效的月份。如果没有传递值或传递了无效值，则使用当前月份。为了完成输入验证，我们确保\
  \ `$_GET['year']` 的值在 1970 到 2038 之间。同样，如果没有传递值或传递了无效值，则使用当前年份。\n\n下一步是获取给定年份中给定月份的第一天和最后一天的时间戳：\n\
  \n**calendar.php（节选）**\n\n```php\n$start_date = strtotime(\"$month 1st $year\");\
  \ $end_date = strtotime(\"$month \" .date(\"t\", $start_date). \" $year\");\n```\n\
  \n然后，我们创建一个数组，包含从该月第一天到最后一天的数字：\n\n**calendar.php（节选）**\n\n```php\n$date_range =\
  \ range(1, date(\"t\", $start_date));\n```\n\n在这里，我们使用 `-1 month` 和 `+1 month` 修饰符来创建上个月和下个月的时间戳，并对上一年和下一年执行相同操作：\n\
  \n**calendar.php（节选）**\n\n```php\n$previous_month = strtotime(\"-1 month\", $start_date);\
  \ $next_month = strtotime(\"+1 month\", $start_date); $previous_year = strtotime(\"\
  -1 year\", $start_date); $next_year = strtotime(\"+1 year\", $start_date);\n```\n\
  \n为了简化操作并避免重复，我们使用 `sprintf` 和以下字符串格式化程序来创建允许用户向前或向后移动一年或一个月的链接：\n\n**calendar.php（节选）**\n\
  \n```php\n$html = \"<a href='\" . $_SERVER['SCRIPT_NAME'] .\n```\n\n\n\n\n\n`\"\
  ?month=%s&amp;year=%s'>%s</a>\"`；接下来，我们开始创建一个表示日历的数组。这里我们构建第一个表格行，其中包含一个显示前一年的链接，接着是表示当前正在查看的年份的文本，最后是一个显示下一年的链接。我们使用\
  \ `EMPTY_COLUMN` 常量来表示应留空的列：\n\n```\nif (date(\"Y\", $previous_year) >= 1970)\n\
  {\n    $calendar_data[] = sprintf($html, date(\"F\", $start_date), date(\"Y\", $previous_year),\
  \ date(\"Y\", $previous_year));\n}\nelse\n{\n    $calendar_data[] = EMPTY_COLUMN;\n\
  }\n```\n\n`$calendar_data[] = EMPTY_COLUMN;`\n`$calendar_data[] = EMPTY_COLUMN;`\n\
  `$calendar_data[] = date(\"Y\", $start_date);`\n`$calendar_data[] = EMPTY_COLUMN;`\n\
  `$calendar_data[] = EMPTY_COLUMN;`\n\n```\nif (date(\"Y\", $next_year) < 2038 &&\
  \ date(\"Y\", $next_year) != 1969)\n{\n    $calendar_data[] = sprintf($html, date(\"\
  F\", $start_date), date(\"Y\", $next_year), date(\"Y\", $next_year));\n}\nelse\n\
  {\n    $calendar_data[] = EMPTY_COLUMN;\n}\n```\n\n下一行与上一行类似，不同之处在于它依次显示前一个月的链接、当前查看的月份以及下一个月的链接：\n\
  \n```\n$calendar_data[] = sprintf($html, date(\"F\", $previous_month), date(\"Y\"\
  , $previous_month), date(\"M\", $previous_month));\n$calendar_data[] = EMPTY_COLUMN;\n\
  $calendar_data[] = EMPTY_COLUMN;\n$calendar_data[] = date(\"M\", $start_date);\n\
  $calendar_data[] = EMPTY_COLUMN;\n$calendar_data[] = EMPTY_COLUMN;\n$calendar_data[]\
  \ = sprintf($html, date(\"F\", $next_month), date(\"Y\", $next_month), date(\"M\"\
  , $next_month));\n```\n\n第三行仅包含星期几，从星期一开始：\n\n```\n$calendar_data[] = \"Mon\";\n\
  $calendar_data[] = \"Tue\";\n$calendar_data[] = \"Wed\";\n$calendar_data[] = \"\
  Thu\";\n$calendar_data[] = \"Fri\";\n$calendar_data[] = \"Sat\";\n$calendar_data[]\
  \ = \"Sun\";\n```\n\n为了确保数字日期与星期几同步，我们首先插入若干空白列。我们使用 `date` 函数中的 `N` 占位符，以便返回当月第一天对应的星期几（数字表示），然后通过\
  \ `for` 循环为剩余的天数添加 `EMPTY_COLUMN` 常量：\n\n```\n$blank_days = date(\"N\", $start_date);\n\
  for ($i = 1; (int) $blank_days > $i; $i++)\n{\n    $calendar_data[] = EMPTY_COLUMN;\n\
  }\n```\n\n然后，我们将当前月份的数字日期添加到日历数据数组中。接下来，实例化 `HTML_Table_Matrix` 对象，并将数组传递给 `setData`\
  \ 方法。最后，创建一个从左到右、从上到下的 `HTML_Table_Matrix_Filler` 对象，以便我们的 `HTML_Table_Matrix` 能够计算出最终输出所需的行和列：\n\
  \n```\nforeach ($date_range as $day)\n{\n    $calendar_data[] = $day;\n}\n$calendar\
  \ = new HTML_Table_Matrix();\n$calendar->setTableSize(8,7);\n$calendar->setData($calendar_data);\n\
  $filler = HTML_Table_Matrix_Filler::factory(\"LRTB\", $calendar);\n$calendar->accept($filler);\n\
  ```\n\n我们使用 `toHTML` 方法来显示结果：\n\n![Image 36](img/index-129_1.jpg)\n\n```\n<h1>PHP\
  \ Calendar</h1>\n<div id=\"cal\">\n<?php echo $calendar->toHTML(); ?>\n</div>\n\
  ```\n\n最终成品如图 4.1 所示。\n\n图 4.1. 使用 PEAR::HTML_Table_Matrix 生成的日历\n\n就是这样。别再被吓倒了！将这个解决方案保存在你的\
  \ PHP 工具箱中，无论什么应用，你都能随时快速生成一个日历。\n\n## 如何在 MySQL 中存储日期？\n\n人类可读的日期有多种格式，可以适应多种场景。然而，这些格式并不是存储日期的最佳方式。\n\
  \n乍一看，在 MySQL 中存储日期最简单的方法似乎就是直接按照它们在网页上显示的样子存入，例如“2003 年 3 月 8 日”。但请注意——走这条路是通往严重脱发和胃溃疡的第一步。例如，针对\
  \ MySQL 执行的 SQL 语句中的 `WHERE` 子句不允许你这样操作：\n\n```\nSELECT * FROM table WHERE date\
  \ > '2007 年 2 月 14 日'\n```\n\n`'2007 年 2 月 14 日'` 不是一个日期值——它只是一个由字符串表示的日期。在将其转换为日期值之前，它无法作为日期值进行操作或比较。如果你将日期存储为字符串，你将永远在日期值数据类型之间来回转换。谁需要这种头疼事呢？\n\
  \n## 解决方案\n\n更好的存储日期信息的方法是使用 MySQL 时间戳。\n\n要获取当前服务器本地时区的当前时间，我们可以使用 `NOW` 或 `CURRENT_TIMESTAMP`\
  \ 函数。我们也可以使用 `UTC_TIMESTAMP` 来获取 UTC 时区的时间戳：\n\n```\nmysql> SELECT CURRENT_TIMESTAMP();\n\
  +---------------------+\n| CURRENT_TIMESTAMP() |\n+---------------------+\n| 2007-11-05\
  \ 21:18:28 |\n+---------------------+\nmysql> SELECT NOW();\n+---------------------+\n\
  | NOW()               |\n+---------------------+\n| 2007-11-05 21:18:32 |\n+---------------------+\n\
  mysql> SELECT UTC_TIMESTAMP();\n+---------------------+\n| UTC_TIMESTAMP()     |\n\
  +---------------------+\n| 2007-11-06 02:18:44 |\n+---------------------+\n```\n\
  \n## 讨论\n\nMySQL 时间戳比 Unix 时间戳更简单。其通用格式为 `YYYY-MM-DD HH:MM:SS`，通常存储在 `DATETIME`\
  \ 类型的列中（不要与 `DATE` 和 `TIME` 列类型混淆，它们分别只存储 `YYYY-MM-DD` 和 `HH:MM:SS`）。\n\n这种形式的时间戳非常适合简单的排序和比较操作，*并且*具有人类可读的优点。它们还具有可预测的长度（直到公元\
  \ 9999 年），这使得验证更加容易。\n\n你可以通过原生的 MySQL `DATETIME` 列类型利用许多原生的 MySQL 日期和时间函数，如果需要，也可以轻松转换为\
  \ Unix 时间戳。\n\n## 如何格式化 MySQL 时间戳？\n\nMySQL 时间戳虽然人类可读，但并非完全人性化——例如，你可能不会在生日派对邀请函上使用它们。相比\
  \ `2008-02-14 13:00:00`，我相信你更愿意写成“2008 年 2 月 14 日下午 1 点”。幸运的是，让 MySQL 时间戳变得人性化非常简单——你的派对邀请函会看起来很棒。我保证！\n\
  \n## 解决方案\n\nMySQL 和 PHP 一样，有一个日期格式化函数，恰如其分地命名为 `DATE_FORMAT` 函数。要使用这个函数，我们只需传递一个格式字符串和一个时间戳，如下所示：\n\
  \n```\nmysql> SELECT DATE_FORMAT(NOW(), \"%W %M %D, %Y\");\n+------------------------------------+\n\
  | DATE_FORMAT(NOW(), \"%W %M %D, %Y\") |\n+------------------------------------+\n\
  | Monday October 8th, 2007           |\n+------------------------------------+\n\
  ```\n\n**表 4.2. DATE_FORMAT 格式说明符**\n\n| 说明符 | 描述 |\n|--------|------|\n| `%a` |\
  \ 缩写的星期几名称（Sun … Sat） |\n| `%b` | 缩写的月份名称（Jan … Dec） |\n| `%c` | 月份，数字（0 … 12） |\n\
  | `%d` | 带英文后缀的月份中的日期（0th, 1st, 2nd, 3rd, …） |\n| `%D` | 月份中的日期，数字（00 … 31） |\n\
  | `%e` | 月份中的日期，数字（0 … 31） |\n| `%f` | 微秒（000000 … 999999） |\n| `%H` 或 `%k` | 小时（00\
  \ … 23） |\n| `%h`、`%I` 或 `%l` | 小时（01 … 12） |\n| `%i` | 分钟，数字（00..59） |\n| `%M`\
  \ | 月份名称（January..December） |\n| `%m` | 月份，数字（00..12） |\n| `%p` | 上午或下午 |\n| `%r`\
  \ | 时间，12 小时制（hh:mm:ss 后跟上午或下午） |\n| `%S` 或 `%s` | 秒（00 … 59） |\n| `%T` | 时间，24\
  \ 小时制（hh:mm:ss） |\n| `%W` | 星期几名称（Sunday … Saturday） |\n| `%w` | 星期几（0=Sunday …\
  \ 6=Saturday） |\n| `%Y` | 年份，数字，四位 |\n| `%y` | 年份，数字（两位） |\n| `%%` | 一个文字 `%` 字符\
  \ |\n\n与 PHP 的 `date` 函数非常相似，`DATE_FORMAT` 函数使用包含说明符的格式字符串来定义格式。表 4.2 列出了常用的说明符。\n\
  \n## 如何使用 MySQL 执行日期计算？\n\n\n\n\n\n在执行查询时，经常需要指定日期范围。例如，你可能需要检索过去 30 天内创建的所有博客文章。在\
  \ MySQL 中进行日期计算非常轻松，让我们来看看。\n\n## 解决方案\n\n你可以使用 MySQL 的日期函数执行复杂的日期运算。通过`DATE_ADD`和`DATE_SUB`函数，我们可以使用`INTERVAL`关键字来添加或减去时间间隔。因此，我们使用`DATE_ADD`来增加一天：\n\
  \n```\nmysql> SELECT DATE_ADD(NOW(), INTERVAL 1 DAY);\n+---------------------------------+\n\
  | DATE_ADD(NOW(), INTERVAL 1 DAY) |\n+---------------------------------+\n| 2007-10-09\
  \ 21:32:20             |\n+---------------------------------+\n```\n\n同样，我们使用`DATE_SUB`来减去一天：\n\
  \n```\nmysql> SELECT DATE_SUB(NOW(), INTERVAL 1 DAY);\n+---------------------------------+\n\
  | DATE_SUB(NOW(), INTERVAL 1 DAY) |\n+---------------------------------+\n| 2007-10-07\
  \ 21:32:26             |\n+---------------------------------+\n```\n\n我们还可以添加或减去月份和年份：\n\
  \n```\nmysql> SELECT DATE_ADD(NOW(), INTERVAL 1 MONTH);\n+-----------------------------------+\n\
  | DATE_ADD(NOW(), INTERVAL 1 MONTH) |\n+-----------------------------------+\n|\
  \ 2007-11-08 21:31:05               |\n+-----------------------------------+\n```\n\
  \n```\nmysql> SELECT DATE_SUB(NOW(), INTERVAL 1 MONTH);\n+-----------------------------------+\n\
  | DATE_SUB(NOW(), INTERVAL 1 MONTH) |\n+-----------------------------------+\n|\
  \ 2007-09-08 21:31:55               |\n+-----------------------------------+\n```\n\
  \n```\nmysql> SELECT DATE_ADD(NOW(), INTERVAL 1 YEAR);\n+----------------------------------+\n\
  | DATE_ADD(NOW(), INTERVAL 1 YEAR) |\n+----------------------------------+\n| 2008-10-08\
  \ 21:32:31              |\n+----------------------------------+\n```\n\n```\nmysql>\
  \ SELECT DATE_SUB(NOW(), INTERVAL 1 YEAR);\n+----------------------------------+\n\
  | DATE_SUB(NOW(), INTERVAL 1 YEAR) |\n+----------------------------------+\n| 2006-10-08\
  \ 21:32:37              |\n+----------------------------------+\n```\n\n在 MySQL\
  \ 中编写 SQL 查询时，我们可以使用更人性化的术语——例如`1 DAY`、`1 MONTH`和`1 YEAR`——而无需处理以毫秒为单位的 Unix 时间戳。借助\
  \ MySQL，我们可以使用`DATE_SUB`和`DATE_ADD`函数来检索特定日期范围内的数据库记录。下面，我们获取所有`updated_date`在过去\
  \ 30 天内的数据：\n\n```\nSELECT * FROM my_table WHERE DATE_SUB(NOW(), INTERVAL 30 DAYS)\
  \ >= updated_date;\n```\n\n类似地，以下语句将返回`updated_date`超过一周但不超过 14 天的行：\n\n```\nSELECT\
  \ * FROM my_table WHERE updated_date BETWEEN(DATE_SUB(NOW(), INTERVAL 14 DAYS),\
  \ DATE_SUB(NOW(), INTERVAL 7 DAYS));\n```\n\n如你所见，MySQL 的日期函数使得日期计算变得异常简单，这得益于人性化术语的使用。\n\
  \n## 总结\n\n在本章中，我们探讨了 Unix 时间戳的使用以及 PHP 的`strtotime`和`date`函数的灵活性，从而能够轻松完成几乎所有涉及日期和时间的任务。我们还看到\
  \ MySQL 提供了一系列日期函数，通过将`DATE_SUB`或`DATE_ADD`与`INTERVAL`关键字结合使用，提供了与 PHP 类似的功能。\n\n\
  你可能想知道在进行自己的日期计算时应该采用哪种方法——是使用 PHP 函数还是尝试 MySQL 函数？这个决定很简单：当时间戳存储在数据库中时，使用 MySQL\
  \ 方法更快。然而，正如我们在本章的日历示例中所看到的，当时间戳并非来自数据库时，使用 PHP 方法更快。\n\n没有人能逃脱时间的无情流逝，但当我们掌握了 PHP\
  \ 日期函数的力量时，至少可以驾驭时间的计算和呈现。像`strtotime`和`date`这样的函数乍看之下可能很简单，但在你的 Web 应用程序中却可以非常巧妙地使用。\n\
  \n# 第 5 章：表单、表格和漂亮的 URL\n\n创建交互式网页正是 PHP 的用武之地。当你使用 PHP 构建网站和应用程序时，你会很快发现自己需要反复开发相同的网页元素。\n\
  \n当你开发第一个 PHP 网站时，编写一个生成 HTML 表格的脚本可能看起来不是什么大问题，但随着时间的推移：当你搭建了几个网站，并且不得不一次又一次地回头修改过去的成果时，处理表格就不再那么美好了。最终，仅仅提到“维护”这个词，就足以让你在键盘前默默哭泣，惊呼“又是表格！”\n\
  \n别担心——有办法解决！并非所有 HTML 都相同，但 HTML 元素之间存在着明显的共性。这些共性正是 PHP 类的完美目标，它们能让你消除重复性工作，专注于编程中你喜欢的创造性方面。\n\
  \n在本章中，我们将为一些最常见的任务提供解决方案：构建表单、构建表格以及创建漂亮的 URL。在此过程中，我们将大量使用 PEAR 的一些 HTML 包——作为手工编写\
  \ HTML 表单和表格的升级方案，PEAR 具有极高的价值。\n\n我们在这里讨论的一些示例将使用以下数据库表。\n\n首先，是一个用户表：\n\n`chapter_05.sql`\
  \ *(摘录)*\n\n```sql\nCREATE TABLE user (\n  id          INT(11)      NOT NULL AUTO_INCREMENT,\n\
  \  login       VARCHAR(50)  NOT NULL DEFAULT '',\n  password    VARCHAR(50)  NOT\
  \ NULL DEFAULT '',\n  email       VARCHAR(50)  DEFAULT NULL,\n  first_name  VARCHAR(50)\
  \  DEFAULT NULL,\n  last_name   VARCHAR(50)  DEFAULT NULL,\n  signature   TEXT \
  \        NOT NULL,\n  PRIMARY KEY (id),\n  UNIQUE KEY user_login (login)\n);\n```\n\
  \n我们还将使用这个表来存储图片：\n\n`chapter_05.sql` *(摘录)*\n\n```sql\nCREATE TABLE user_images\
  \ (\n  image_id  INT(11)      NOT NULL AUTO_INCREMENT,\n  user_id   INT(11)    \
  \  NOT NULL,\n  type      VARCHAR(50)  NOT NULL DEFAULT '',\n  filename  VARCHAR(32)\
  \  NOT NULL,\n  PRIMARY KEY (image_id)\n);\n```\n\n## 如何使用 PHP 构建 HTML 表单？\n\nHTML\
  \ 表单是网站上用户数据的关键输入机制。作为 Web 开发者，我们必须处理 HTML 表单的多个方面：\n\n- 表单生成\n- 表单验证\n- 获取有效的表单数据\n\
  - 用提交的数据重新填充无效的表单\n\n![Image 37](img/index-139_1.jpg)\n![Image 38](img/index-139_2.png)\n\
  \n## 解决方案\n\n幸运的是，PEAR 通过`HTML_QuickForm`（http://pear.php.net/package/HTML_QuickForm/）提供了解决方案，它的目标正如其名——快速创建表单。`HTML_QuickForm`可以帮助自动化与表单构建相关的所有任务。\n\
  \n#### 使用 HTML_QuickForm2\n\n在撰写本文时，PEAR 已经发布了`HTML_QuickForm2`类（http://pear.php.net/package/HTML_QuickForm2/）的\
  \ alpha 版本。这个新版本是专门为 PHP 5 编写的，并且兼容`E_STRICT`级别的错误报告。\n\n我们的第一个示例演示了使用`HTML_QuickForm`类构建注册表单是多么容易。我们通过包含`HTML/QuickForm.php`文件并实例化`HTML_QuickForm`对象来开始构建表单：\n\
  \n`htmlForm.php` *(摘录)*\n\n```php\n<?php\nrequire_once 'HTML/QuickForm.php';\n$form\
  \ = new HTML_QuickForm('Create', 'post', basename(__FILE__));\n```\n\n传递给构造函数的参数分别代表表单的\
  \ name、method 和 action HTML 属性。\n\n接下来，我们使用`addElement`方法开始添加所需的表单元素：\n\n`htmlForm.php`\
  \ *(摘录)*\n\n```php\n$opts = array('size' => 20, 'maxlength' => 255);\n$form->addElement('static',\
  \ 'header', null,\n    '<h1>Register</h1>'\n);\n$form->addElement('text', 'first_name',\
  \ 'First Name', $opts);\n$form->addElement('text', 'last_name', 'Last Name', $opts);\n\
  $form->addElement('text', 'login', 'Login Name', $opts);\n$form->addElement('password',\
  \ 'password', 'Password', $opts);\n$form->addElement('text', 'email', 'E-Mail',\
  \ $opts);\n```\n\n\n\n\n\n`$form->addElement('static', 'valid', null,\n'<strong>E-Mail\
  \ address must be valid, and will only be'.\n' used for account verification.</strong>'\n\
  );\n\n$form->addElement('textarea', 'signature', 'Signature', array('rows' => 10,\
  \ 'cols' => 20));\n\n$form->addElement('file', 'avatar', 'Avatar Image'); $form->addElement('static',\
  \ 'reqs', null,\n'<strong>Image <em>must</em> be no more than 64x64 pixels' .\n\
  ' in size.</strong>'\n);\n\n$form->addElement('submit', 'register', \"Register Now!\"\
  );`\n\n传递给 `addElement` 方法的第一个参数表示元素类型。可能的元素类型有很多种，每种类型都由一个 PHP 类表示——完整列表可在 PEAR\
  \ 文档页面的“QuickForm 元素类型”中找到。3 我们上面使用的元素类型包括 `static`，它表示不会随表单提交的静态 HTML 内容。我们使用 `static`\
  \ 元素来显示标题和表单帮助文本。其他使用的类型包括 `text`、`password`、`textarea`、`file` 和 `submit`；每种类型都对应其各自的\
  \ HTML 表单元素。\n\n我们传递给 `addElement` 方法的其余参数随后会被传递给相应类型类的构造函数，因此这些参数是特定于这些类的。PEAR\
  \ 文档页面的“QuickForm 元素类型”中包含了使用这些类所需的所有详细信息。4\n\n添加完表单元素后，我们可以使用 `toHTML` 方法获取表单的\
  \ HTML 源代码：\n\n`htmlForm.php` *(摘录)*\n```\n$formsource = $form->toHtml();\n?>\n\
  ```\n\n剩下要做的就是将表单源代码添加到网页中：3 http://pear.php.net/manual/en/package.html.html-quickform.intro-elements.php\
  \ 4 http://pear.php.net/manual/en/package.html.html-quickform.intro-elements.php\n\
  \n![Image 39](img/index-141_1.jpg)\n\n表单、表格和漂亮的 URL\n\n`htmlForm.php` *(摘录)*\n```\n\
  <!DOCTYPE html public \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n⋮ *HTML 头部内容…*\n</head>\n\
  <body>\n<?php echo $formsource; ?>\n</body>\n</html>\n```\n\n上面的代码将渲染为图 5.1 所示。\n\
  \n图 5.1. 我们的第一个注册表单\n\n如你所见，这个表单实际上并没有做太多事情，除了构建这个表单比手写 HTML 稍微容易一点之外，你可能会问：“这有什么大惊小怪的？”好吧，正如你将在下一个示例中看到的，我们可以以最少的麻烦为表单添加复杂的验证规则。\n\
  \n我们使用 `addRule` 方法为表单添加验证规则：5\n\n`htmlFormValidation.php` *(摘录)*\n```\n$form->addRule('first_name',\n\
  'You must enter your first name',\n'required', null, 'client'\n);\n$form->addRule('first_name',\n\
  'Your first name must be at least 3 letters',\n'minlength', '3', 'client'\n);\n\
  ```\n\n`addRule` 方法的第一个参数是表单元素名称，后面跟着错误消息。下一个参数指示所需的验证类型，并包含一个额外的可选参数用于验证类型，以及一个可选参数指示验证发生的位置；此设置可以指定\
  \ `client` 或 `server`。如果指定 `client`，则会向表单添加 JavaScript 验证以支持该规则。\n\n你可能已经注意到在上面的代码中，你可以为单个表单元素添加多个规则。我们可以看到上面代码中的第一个规则是\
  \ `required` 规则，它指示该字段不能为空。由于此规则不需要参数，因此下一个参数是 `null`。最后一个参数指示验证将在客户端（即浏览器）上进行。第二个规则是\
  \ `minlength` 规则，可选参数指示 `first_name` 字段值的最小长度为 3 个字符。\n\n然而，我们并不局限于这些规则。还有许多其他验证类型可用，并且它们都方便地记录在\
  \ PEAR 网站上。6 让我们继续为其余元素添加更多规则：\n\n5 http://pear.php.net/manual/en/package.html.html-quickform.html-quickform.addrule.php\
  \ 6 http://pear.php.net/manual/en/package.html.html-quickform.intro-validation.php\n\
  \n`htmlFormValidation.php` *(摘录)*\n```\n$form->addRule('last_name',\n'You must enter\
  \ your last name',\n'required', null, 'client'\n);\n$form->addRule('last_name',\n\
  'Your last name must be at least 3 letters',\n'minlength', '3', 'client'\n);\n$form->addRule('email',\n\
  'You must enter your email address',\n'required', null, 'client'\n);\n$form->addRule('email',\n\
  'Please enter a valid email address',\n'email', FALSE, 'client'\n);\n$form->addRule('login',\n\
  'You must enter a login name',\n'required', null, 'client'\n);\n$form->addRule('login',\n\
  'Your login name must be between 6-20 characters long',\n'rangelength', array(6,\
  \ 20), 'client'\n);\n$form->addRule('password',\n'You must enter a password',\n\
  'required', null, 'client'\n);\n$form->addRule('password',\n'Your Password must\
  \ be at least 6 characters long.',\n'minlength', '6', 'client'\n);\n```\n\n现在我们已经添加了这些规则，可以添加一些表单处理代码：\n\
  \n`htmlFormValidation.php` *(摘录)*\n```\nif ($form->validate())\n{\n$form->removeElement('validemail');\n\
  $form->removeElement('reqs');\n$form->removeElement('avatar');\n$form->removeElement('register');\n\
  $form->freeze();\n$formsource = $form->toHtml();\n}\nelse\n{\n$formsource = $form->toHtml();\n\
  }\n?>\n```\n\n`validate` 方法允许我们检查表单是否已提交并通过所有验证要求。如果表单验证通过，你可以在此步骤添加代码以某种方式操作表单数据——例如，将其保存到数据库。在我们的示例解决方案中，我们冻结表单并再次显示它。冻结的元素仅显示其值——而不是可编辑的表单元素。当然，这对静态元素和按钮没有影响，因此我们在冻结表单之前从表单中移除这些元素。使用\
  \ `freeze` 方法冻结表单允许我们在表单提交过程中添加一个确认步骤，这使用户有机会在提交之前检查他们的信息。\n\n如果表单未通过验证，我们只需显示其\
  \ HTML 源代码。如果表单尚未提交，也会执行此步骤。如果检测到验证错误，验证规则错误消息将添加到表单的 HTML 源代码中。\n\n你可以在图 5.2 中看到渲染后的表单。请注意，验证规则的存在如何自动插入了必填字段指示符。该图像还显示了由服务器端验证机制添加的错误消息——你需要在浏览器中禁用\
  \ JavaScript 才能看到此消息。\n\n图 5.3 显示了冻结后的表单。\n\n![Image 40](img/index-145_1.jpg)\n\n\
  图 5.2. 带有验证机制的注册表单\n\n![Image 41](img/index-146_1.jpg)\n\n图 5.3. 冻结后的注册表单\n\n现在我们已经验证了用户提交的数据，我们需要接收并存储它。让我们看看上面示例的另一种方法，其中我们提取表单数据并将其插入到数据库中。要提取表单中提交的数据，我们只需使用\
  \ `exportValues` 方法：\n\n`htmlFormExport.php` *(摘录)*\n```\nif ($form->validate())\n\
  {\n$values = $form->exportValues();\n```\n\n现在我们有了表单数据，可以建立数据库连接并将其插入到数据库中：\n\n\
  `htmlFormExport.php` *(摘录)*\n```\nrequire 'dbcred.php';\ntry\n{\n$db = new PDO($dsn,\
  \ $user, $password);\n$db->setAttribute(PDO::ATTR_ERRMODE,\nPDO::ERRMODE_EXCEPTION);\n\
  $sql = 'INSERT INTO user ' .\n'(login, password, email, first_name, last_name,'\
  \ .\n' signature) VALUES (:login, :password, :email,' .\n' :firstname, :lastname,\
  \ :sig)';\n$stmt = $db->prepare($sql);\n```\n\n\n\n\n\n`$stmt->bindParam(':login',\
  \ $values['login']);`\n\n`$stmt->bindParam(':password', $values['password']);`\n\
  `$stmt->bindParam(':email', $values['email']);`\n\n`$stmt->bindParam(':firstname',\
  \ $values['first_name']);`\n`$stmt->bindParam(':lastname', $values['last_name']);`\n\
  `$stmt->bindParam(':sig', $values['signature']);`\n\n`$stmt->execute();`\n\n首先，我们将注册信息插入到用户表中。使用`PDO`以及带有绑定参数的`prepare`和`execute`方法，可以让我们在\
  \ SQL 查询中安全地使用表单数据。关于此技术的更多信息，请参阅第 2 章中的“如何向数据库添加或修改数据？”。\n\n接下来，我们从之前的数据库插入操作中获取插入\
  \ ID；稍后我们会用到它。`$form->_submitFiles`属性包含一个文件数组，这些文件是通过表单提交的。我们可以利用这些信息访问头像图片文件，并将其移动到头像目录，同时为其应用一个唯一的文件名：\n\
  \n`htmlFormExport.php` *(摘录)*\n\n```\n$id = $db->lastInsertId();\n\n$type = $form->_submitFiles['avatar']['type'];\n\
  \n$file = 'images/avatars/' . md5(microtime()) .\nbasename($form->_submitFiles['avatar']['name']);\n\
  \nmove_uploaded_file(\n    $form->_submitFiles['avatar']['tmp_name'],\n    $file\n\
  );\n```\n\n我们还需要将这个图片文件信息插入到`user_image`表中。这正是使用我们在上一步中保存的插入 ID 的好机会：\n\n126\n\n\
  PHP 文集\n\n`htmlFormExport.php` *(摘录)*\n\n```\n$sql = 'INSERT INTO user_images' .\n\
  \       ' (user_id, type, filename) VALUES' .\n       ' (:id, :type, :file)';\n\
  $stmt = $db->prepare($sql);\n$stmt->bindParam(':id', $id);\n$stmt->bindParam(':type',\
  \ $type);\n$stmt->bindParam(':file', $file);\n$stmt->execute();\n```\n\n我们的最后任务是创建确认显示页面：`htmlFormExport.php`\
  \ *(摘录)*\n\n```\n$form->removeElement('validemail');\n$form->removeElement('reqs');\n\
  $form->removeElement('avatar');\n$form->removeElement('register');\n$form->freeze();\n\
  $formsource = $form->toHtml() . '<p>The above information has\n➥ been successfully\
  \ submitted</p>';\n}\n```\n\n然而，如果发生了数据库异常，我们需要记录错误并创建错误信息显示：\n\n`htmlFormExport.php`\
  \ *(摘录)*\n\n```\ncatch(PDOException $e)\n{\n    error_log('Registraiton form error:\
  \ '. $e->getMessage());\n    $form->removeElement('validemail');\n    $form->removeElement('reqs');\n\
  \    $form->removeElement('avatar');\n    $form->removeElement('register');\n  \
  \  $form->freeze();\n    $formsource = $form->toHtml() . '<p>An error has occurred.\
  \ The\n➥ above information was not successfully submitted</p>';\n}\n}\n```\n\n表单、表格与漂亮的\
  \ URL\n\n127\n\n最后，像往常一样，如果表单尚未提交，我们只需显示它：`htmlFormExport.php` *(摘录)*\n\n```\nelse\n\
  {\n    $formsource = $form->toHtml();\n}\n```\n\n使用`HTML_QuickForm`类，您可以轻松高效地为网站或\
  \ Web 应用程序添加网页表单，而无需过多麻烦。请务必查看 PEAR 文档，以了解该类中所有其他可用的功能。7\n\n## 如何在表格中显示数据？\n\n表格是数据显示的重要组成部分——说实话，这也是大多数网页的重要组成部分！那么，如何轻松地在表格中显示数据，并以一种自动化处理大部分枯燥、重复的表格\
  \ HTML 编写工作的方式呢？\n\n## 解决方案\n\n这个问题的答案是使用 PEAR 的`HTML_Table`类。8 在本例中，我们将使用`HTML_Table`来显示一个简单\
  \ SQL 查询的结果。\n\n首先，我们需要包含所需的 PHP 文件：\n\n`pearTable.php` *(摘录)*\n\n```\n<?php\nrequire\
  \ 'dbcred.php';\nrequire 'HTML/Table.php';\n```\n\n`dbcred.php`包含我们用于`PDO`的数据库登录凭据。该文件包含适用于我们测试环境的凭据，因此如果您想在自己的\
  \ Web 服务器上尝试，需要更改它们。`HTML/Table.php`包含`HTML_Table`类。\n\n7 http://pear.php.net/package/HTML_QuickForm/\n\
  8 http://pear.php.net/manual/en/package.html.html-table.php\n\n128\n\nPHP 文集\n\n\
  接下来，我们实例化`PDO`对象并执行 SQL 查询。我们打开一个`try`块来捕获可能发生的任何`PDOException`：\n\n`pearTable.php`\
  \ *(摘录)*\n\n```\ntry\n{\n    $db = new PDO($dsn, $user, $password);\n    $db->setAttribute(PDO::ATTR_ERRMODE,\n\
  \                     PDO::ERRMODE_EXCEPTION);\n    $sql = \"SELECT * FROM user\"\
  ;\n    $stmt = $db->prepare($sql);\n    $stmt->execute();\n```\n\n创建表格很简单。我们实例化`HTML_Table`对象并调用`setAutoGrow`方法，该方法会激活一个标志，指示`HTML_Table`在向不存在的单元格添加数据时自动添加行和列。然后我们调用`addRow`方法来添加一个标题行：\n\
  \n`pearTable.php` *(摘录)*\n\n```\n    $table = new HTML_Table;\n    $table->setAutoGrow(true);\n\
  \    $table->addRow(array(\"\",\"Login\",\"Password\",\"E-Mail\",\n            \
  \             \"First Name\",\"Last Name\",\"Signature\"), null, \"th\");\n```\n\
  \n添加行之后是一个`while`循环，我们在其中调用`addRow`方法来添加查询结果。`addRow`方法接受一个索引数组作为行内容的参数，因此我们需要使用`PDO::FETCH_NUM`参数调用`PDOStatement->fetch`，以使`PDO`将行数据作为索引数组返回。\n\
  \n最后，我们调用`toHTML`将表格 HTML 源代码赋值给一个变量：`pearTable.php` *(摘录)*\n\n```\n    while ($row\
  \ = $stmt->fetch(PDO::FETCH_NUM))\n    {\n        $table->addRow($row);\n    }\n\
  ```\n\n表单、表格与漂亮的 URL\n\n129\n\n```\n    $tablesource = $table->toHTML();\n}\n```\n\
  \n我们的`catch`块只是记录任何错误，并将`$tablesource`变量设置为空字符串，从而避免向网页用户输出任何晦涩的错误信息：\n\n`pearTable.php`\
  \ *(摘录)*\n\n```\ncatch (PDOException $e)\n{\n    error_log('Error in '.$e->getFile().\n\
  \              ' Line: '.$e->getLine().\n              ' Error: '.$e->getMessage()\n\
  \    );\n    $tablesource = \"\";\n}\n?>\n```\n\n现在可以在网页输出中使用`$tablesource`变量：`pearTable.php`\
  \ *(摘录)*\n\n```\n<!DOCTYPE html public \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
