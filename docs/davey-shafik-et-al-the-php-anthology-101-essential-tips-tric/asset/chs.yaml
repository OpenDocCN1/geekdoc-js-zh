  \ PEAR 的替代方案\n\n## 索引\n\n\n\n\nPHP 的一大优点在于其充满活力且活跃的社区。开发者们拥有许多在线交流平台，包括 SitePoint\
  \ 论坛¹，开发者们在这里互相帮助，解决日常遇到的各种问题，从 PHP 的基础工作原理，到“如何验证表单？”这类设计问题。作为寻求帮助的途径，这些社区非常出色——它们充满了各种关键片段，能帮助你成功完成项目。但要将所有这些知识整合成一个适用于你特定情况的解决方案，可能是一项挑战。通常，社区成员会假设其他发帖者具备一定程度的专业知识；你常常需要花费大量时间，从不同的帖子、讨论串和用户（每个用户都有不同的编程风格）中拼凑出完整的图景。\n\
  \n*《PHP 宝典：101 个必备技巧、窍门与黑客方法，第 2 版》* 首先是一本汇编，汇集了 SitePoint 论坛上经常出现的常见 PHP 问题的最佳解决方案，并结合了我们的作者多年来从事\
  \ PHP 工作所积累的经验和见解。\n\n这本书与其他 PHP 书籍的不同之处在于，它脱离了教程风格，而是专注于以最少的努力实现实际目标。因此，你应该能够以即插即用的方式使用本书提供的许多解决方案，而无需从头到尾阅读本书。为了帮助你，每个部分都遵循一致的问题与解答格式。你可以浏览目录，直接翻到解决你问题的部分。\n\
  \n话虽如此，这些讨论中贯穿着一个隐藏的意图。除了解决方案，本书还旨在向你介绍一些技巧，这些技巧可以节省你的精力，并帮助你减少完成和维护基于 PHP 的 Web\
  \ 应用程序所需的时间。\n\n尽管 PHP 最初被设想为一种过程式编程语言，但近年来，它作为开发面向对象解决方案的语言已越来越成功。随着 PHP 5 的发布，PHP\
  \ 获得了一个完全重写且功能更强大的对象模型。这一点在 2007 年 7 月 13 日 PHP 开发团队宣布 PHP 4 生命周期结束时得到了进一步强化。\n\n\
  面向对象范式似乎吓到了许多 PHP 开发者，并且通常被认为只有 PHP 大师才能涉足。本书将向你展示的是，你不需要计算机科学学位就能利用 PHP 5 中可用的面向对象特性和类库。\n\
  \nPHP 扩展与应用仓库，即 PEAR²，提供了不断增长的、可重用且维护良好的解决方案集合，用于解决全球 PHP 开发者经常遇到的架构问题（例如 Web 表单生成和验证）。在开发本书提供的解决方案时，我们尽可能使用了我们的作者个人认为方便且为他们节省了大量开发时间的免费可用库。\n\
  \n本书强调利用可重用组件来构建你的 PHP Web 应用程序，这反映了与当前许多 PHP 相关书籍关注点的另一个不同之处。虽然你不会找到关于面向对象应用程序设计的广泛讨论，但通过潜移默化的过程，从头到尾阅读\
  \ *《PHP 宝典：101 个必备技巧、窍门与黑客方法，第 2 版》* 将帮助你提升 PHP 编码技能，使你能够构建经得起时间考验的应用程序。\n\n*《PHP\
  \ 宝典：101 个必备技巧、窍门与黑客方法，第 2 版》* 将为你提供使用 PHP 引擎时所需的基本知识，让你充满信心，包括一个关于 PHP 面向对象编程的快速入门（参见第\
  \ 1 章的“什么是 OOP？”）。在完成这些准备之后，本书将探讨几乎适用于所有基于 PHP 的 Web 应用程序的解决方案，这些解决方案的基本内容你可能已经知道，但尚未完全掌握。\n\
  \n## 谁应该阅读本书？\n\n如果你已经对 PHP 有了一定的了解，也许读过 Kevin Yank 的 *《使用 PHP 和 MySQL 构建自己的数据库驱动网站，第\
  \ 3 版》*（SitePoint，墨尔本，ISBN 0-9752402-1-8），并且用 PHP 完成了你的第一个或两个项目，那么这本书就是为你准备的。\n\n\
  如果你一直在问诸如“如何验证网页表单？”、“如何为我的照片添加水印？”或“如何从我的 Web 应用程序发送自动电子邮件？”之类的问题，你将在本书中找到这些问题的答案。\n\
  \n如果你有动力通过可重用组件、缓存性能或 Web 服务等概念来提升技能或改进你的 Web 应用程序，那么你会发现这本书是一个极好的入门读物。\n\n## 本书涵盖哪些内容？\n\
  \n以下是本书各章节的内容：\n\n### 第 1 章：引言\n\n本章提供了通过 PHP 手册和其他资源寻求帮助的有用指南。它包括面向对象编程的介绍：PHP\
  \ 类语法的概述，以及解释面向对象范式的所有关键元素如何应用于 PHP 的入门知识。这是阅读本选集后续章节的重要准备阅读材料。本章还提供了编写可移植代码的技巧，并让我们有机会了解一些主要的\
  \ PHP 配置陷阱。\n\n### 第 2 章：使用 PDO 操作数据库\n\n本章为你提供了快速掌握 PHP 数据对象（`PDO`）扩展所需的一切。我们从基础开始，涵盖重要主题，如如何编写灵活的\
  \ SQL 语句和避免 SQL 注入攻击。然后我们深入探讨许多鲜为人知的方面，如搜索、使用事务和存储过程，以及如何备份数据库。\n\n### 第 3 章：字符串\n\
  \n本章探讨了处理网站内容的细节。我们将讨论你离不开的字符串函数，以及验证和过滤用户提交内容的过程。\n\n### 第 4 章：日期和时间\n\n在这里，你将学习如何使用\
  \ PHP 的日期函数，并实现一个在线日历。你还将获得在 MySQL 中存储和操作日期的坚实基础。\n\n### 第 5 章：表单、表格和漂亮的 URL\n\n\
  本章涵盖了网页表单和表格的基本要素。我们将讨论使用 `PEAR::HTML_QuickForm` 开发表单，你将看到如何使用 `PEAR::HTML_Table`\
  \ 实现数据网格和分页结果集。我们还将介绍一些可以与 Apache 配合使用的技巧，以生成对搜索引擎友好的 URL。\n\n### 第 6 章：处理文件\n\n\
  本章是 PHP 中处理文件的生存指南。在这里，我们将涵盖从访问本地文件系统到使用 PHP 的 FTP 客户端通过网络获取文件的所有内容。我们将继续学习如何使用\
  \ `PEAR::Archive_Tar` 创建自己的压缩存档，并简要介绍标准 PHP 库的使用。\n\n### 第 7 章：电子邮件\n\n在本章中，我们专门处理与电子邮件相关的解决方案，向你展示如何充分利用\
  \ PHP 处理电子邮件。我们将学习借助 `PEAR::Mail` 和 `PEAR::Mail_Mime` 成功发送 HTML 电子邮件和附件，并使用 PHP\
  \ 轻松处理发送到你的 Web 服务器的传入邮件。\n\n### 第 8 章：图像\n\n\n\n\n本章探讨了缩略图的创建，并解释了如何为网站上的图片添加水印。我们还将讨论如何防止其他网站的热链接，如何创建一个包含\
  \ Exif 数据的图片库，以及如何使用 JpGraph 生成一些专业的图表和图形——以及 CAPTCHA 验证码图片。\n\n## 第 9 章：错误处理\n\n\
  在这一内容丰富的章节中，你将了解 PHP 的错误报告机制，如何利用 PHP 的自定义错误处理功能，以及如何优雅地处理错误——重点介绍异常处理和自定义异常。\n\n\
  xix\n\n## 第 10 章：访问控制\n\n本章从基本的 HTTP 认证开始，然后过渡到应用级认证，探讨了控制网站访问的各种方法。后续的解决方案涉及实现用户注册系统，以及创建具有用户、组和权限的细粒度访问控制系统。\n\
  \n## 第 11 章：缓存\n\n本章的基本观点是 HTML 最快，并向你展示如何利用客户端和服务器端的缓存来减少带宽使用并显著提升性能。内容涵盖 HTTP\
  \ 头、输出缓冲以及使用 PEAR:Cache_Lite。\n\n## 第 12 章：XML 与 Web 服务\n\n随着 XML 迅速成为几乎所有基于 Web\
  \ 的应用程序的关键组成部分，本章探讨了 PHP 5 丰富的 XML 功能。在这里，你将发现基于 RSS、XML-RPC、SOAP 和 REST 的 Web 服务的创建与消费是多么简单。\n\
  \n## 第 13 章：最佳实践\n\n本章的目标是审视一些已被证明有助于开发项目成功的技术。讨论内容包括代码版本控制、如何编写可分发的代码、如何为你的工作添加\
  \ API 文档、如何通过单元测试减少 bug，以及如何安全地部署代码。\n\n## 运行代码示例\n\n要运行本书中的代码示例，你需要确保拥有所有必需的软件、库和扩展。部分示例使用了需要单独安装的附加包。在介绍需要附加包的解决方案时，你会找到相关网页的链接；请务必阅读文档，包括安装说明。\n\
  \nxx\n\n本书示例中使用了以下包：\n\n- PHP 5.21（包括 GD、EXIF 和 XML-RPC 扩展）\n- PEAR：http://pear.php.net/（包括\
  \ Archive_Tar、Cache_Lite、HTML_Table、HTML_QuickForm、Mail、Net_FTP、Structures_DataGrid\
  \ 和 Validate）\n- Zend Framework：http://framework.zend.com/\n- JpGraph：http://www.aditus.nu/jpgraph/\n\
  \n要运行所有示例，你还需要一个 Web 服务器、数据库服务器、邮件服务器和 FTP 服务器，不过它们的安装和配置说明超出了本书的范围。如果你想搭建一个学习 PHP\
  \ 的软件环境，XAMPP（http://www.apachefriends.org/en/xampp.html）服务器包在安装和使用上都非常方便。它也适用于多种操作系统。\n\
