  \ .\n        $e->getMessage());\n    exit();\n}\n\n$auth = new Auth($dbh, 'login.php',\
  \ 'secret');\nif (isset($_GET['action']) && $_GET['action'] == 'logout')\n{\n  \
  \  $auth->logout();\n}\n?>\n```\n\n首先，我们尝试创建一个 PDO 实例来连接数据库。如果抛出异常且无法连接，我们不想泄露受保护的内容。相反，我们只需记录错误，并将用户重定向到一个显示有用信息的错误页面。一旦有了\
  \ PDO 实例，我们就可以创建一个新的 Auth 实例来检查当前用户的登录凭据。我们将 PDO 实例、登录表单的 URL（`login.php`）以及登录详情哈希功能的种子传递给构造函数。之后，我们使用\
  \ `if` 语句检查注销请求。如果存在 `$_GET['action']` 变量且其值等于 `logout`，我们就知道注销链接已被点击，应该通过 `Auth->logout`\
  \ 方法将用户注销。要创建注销链接，只需在站点上的任何 URL 后附加 `?action=logout` 即可。\n\n最后，这是受限页面的 HTML，包含一个注销链接：\n\
  \n`access.php` *(摘录)*\n\n```\n<!DOCTYPE html public \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
