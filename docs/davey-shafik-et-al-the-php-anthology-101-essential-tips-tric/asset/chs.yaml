  \n188\n\nPHP 文集\n\n图 7.1. 显示多部分消息\n\n## 如何向一群人发送邮件？\n\n在许多情况下，能够同时向多人发送邮件非常有用——例如，发送新闻简报、群发邮件列表消息、向\
  \ IT 人员发送网站更新通知、向开发团队发送功能冻结通知等。然而，在某些情况下，向一群人发送未经请求的邮件也可能被称为垃圾邮件——我相信你不会用 PHP 做这种事！\n\
  \n如果你使用 `PEAR::Mail_Mime`，可以通过在邮件中添加 BCC 或 CC 头来发送群发邮件。不过，这种方法可能不适合你的需求——将特别大的分发列表中的所有地址都列在一封邮件的头部，可能会迅速压垮你的邮件服务器。\n\
  \n更好的方法是单独发送每封邮件，并为每封新邮件重用同一个 `PEAR::Mail_Mime` 类实例。\n\n电子邮件 189\n\n## 解决方案\n\n\
  `group.php`（节选）\n\n```php\n<?php\n\nerror_reporting(E_ALL);\n\nrequire 'Mail.php';\n\
  \nrequire 'Mail/mime.php';\n\n/* create the email */\n\n$mime = new Mail_Mime(\"\
  \\r\\n\");\n\n$mime->addAttachment('php.gif', 'image/gif');\n\n$header = array(\n\
  \n'From'\n\n=> 'me@mydomain.com',\n\n'Subject' => 'Forum Newsletter'\n\n);\n\n$mail\
  \ = Mail::factory('smtp', array('host'=>'smtp.mydomain.net'));\n\n/* go to the database\
  \ to get the member information */\n\n$dsn = 'mysql:host=localhost;dbname=forum;';\n\
  \n$user = 'user';\n\n$password = 'secret';\n\ntry\n\n{\n\n$dbh = new PDO($dsn, $user,\
  \ $password);\n\n$dbh->setAttribute(PDO::ATTR_ERRMODE,\n\nPDO::ERRMODE_EXCEPTION);\n\
  \n$sql = 'SELECT member_email, firstname, lastname FROM member';\n\n/* cycle through\
  \ the list sending the custom emails */\n\nforeach ($dbh->query($sql) as $row)\n\
  \n{\n\n$mime->setTXTBody(\n\n\"Howdy {$row['firstname']} {$row['lastname']}\");\
  \ $body = $mime->get();\n\n$hdrs = $mime->headers( $header);\n\n$succ = $mail->send($row['member_email'],\
  \ $hdrs, $body); if (PEAR::isError($succ))\n\n{\n\nerror_log(\"Email not sent to\
  \ {$row['member_email']}: \" .\n\n$succ->getMessage());\n\n}\n\n}\n\n}\n\ncatch\
  \ (PDOException $e)\n\n{\n\necho 'PDO Exception Caught. ';\n\necho 'Error with the\
  \ database: <br />';\n\necho 'SQL Query: ', $sql;\n\necho 'Error: ' . $e->getMessage();\n\
  \n}\n\n?>\n```\n\n![Image 64](img/index-212_1.png)\n\n![Image 65](img/index-212_2.jpg)\n\
  \n190\n\nPHP 文集\n\n在上面的例子中，我们实例化了 `PEAR::Mime_Mail` 对象，并设置了消息及其发送者。然后，我们访问假设的成员数据库，获取每个成员的电子邮件地址、名字和姓氏。接着，利用该结果集，我们向邮件中添加自定义的欢迎消息，构建消息，设置头部，并将邮件发送到该用户的电子邮件地址。\n\
  \n## 讨论\n\n对于非常大的分发列表，简单的 `foreach` 循环是不够的——你可能会用大量消息淹没你的邮件服务器！相反，你需要设计一种以服务器能够处理的速度发送消息的方法。实现这一点的最简单方法是使用\
  \ PHP 的 `sleep` 函数，每发送大约十条消息后暂停脚本。你还需要使用 `set_time_limit` 函数，让脚本运行时间超过默认的三十秒限制。\n\
  \n最后，别忘了联系你的托管服务商，看看他们是否设置了任何你必须遵守的限制或约束。一些托管服务商对每小时可发送的邮件数量有严格限制，以保护自己不被视为垃圾邮件发送者。\n\
  \n## 遵守反垃圾邮件法规\n\n在美国（州和联邦层面），已经通过了关于未经请求的电子邮件和垃圾邮件的法律。美国有 2003 年的联邦 CAN_SPAM 法案以及众多州级法律，这些可能会影响你在邮件中包含的内容以及发送方式。当然，美国并不是唯一通过此类法律的国家——欧盟、亚洲、南美洲等全球各地的国家也制定了反垃圾邮件法规。更多信息，请访问\
  \ Spam Laws 网站（尽管它并非权威列表），并查看你当地政府的网站。\n\n## 如何用 PHP 处理收到的邮件？\n\n你已经看到用 PHP 发送邮件没有问题。但如何处理收到的邮件呢？如果你的网站托管在\
  \ Linux 系统上，你会很高兴地听到，只需稍加调整，就可以让 PHP 检查收到的电子邮件。\n\n## 解决方案\n\n在这个解决方案中，我假设你的网站托管在基于\
  \ Linux 的系统上，你可以通过命令行访问服务器并能够从命令行运行 PHP，并且你使用 `sendmail` 来处理服务器上的电子邮件。\n\n呼！我知道这是一长串要求，但这种相当常见的配置大大简化了问题。\n\
  \n首先，你需要在你的主目录中放置一个名为 `.forward` 的文件。\n\n\n\n\n使用文本编辑器将以下内容写入文件（全部在一行内）：you@yoursite.com\
  \ \"|`/home/yourUserName/mailhandler.php`\"\n\n现在，在 PHP 脚本 `mailhandler.php` 中，你可以按照任何你喜欢的方式处理发送到\
  \ you@yoursite.com 的传入电子邮件。以下是一个示例脚本，用于检测来自特定地址的传入电子邮件，并发送第二封通知邮件作为响应：\n\n**`mailhandler.php`\
  \ *（节选）***\n\n```\n#!/usr/bin/php\n\n<?php\n\n// Read the email from the stdin file\n\
  \n$fp = fopen('php://stdin', 'r');\n\n$email = fread ($fp, filesize('php://stdin'));\n\
  \n5 http://www.spamlaws.com/\n\n192\n\nThe PHP Anthology\n\nfclose($fp);\n\n// Break\
  \ the email up by linefeeds\n\n$email = explode(\"\\n\", $email);\n\n// Initialize\
  \ vars\n\n$numLines = count($email);\n\nfor ($i = 0; $i < $numLines; $i++) {\n\n\
  // Watch out for the From header\n\nif (preg_match(\"/^From: (.*)/\", $email[$i],\
  \ $matches)) {\n\n$from = $matches[1];\n\nbreak;\n\n}\n\n}\n\n// Forward the message\
  \ to the hotline email\n\nif (strstr($from, ' *vip@example.com*')) {\n\nmail(' *you@yourdomain.com*',\
  \ 'Urgent Message!',\n\n'Check your mail!');\n\n}\n\n?>\n```\n\n## 讨论\n\n`.forward`\
  \ 文件告诉服务器上的邮件系统，任何发送到 you@yoursite.com 的电子邮件不仅需要投递到该地址，还必须发送到位于 `/home/yourUserName/mailhandler.php`\
  \ 的 PHP 脚本。\n\n本解决方案中给出的 PHP 脚本旨在由邮件系统自动运行，而不是由你的 Web 服务器运行。文件的第一行必须指向服务器上独立 PHP\
  \ 程序的位置（通常是 `/usr/bin/php`），这被称为 **释伴行**。之后，代码从标准输入获取电子邮件并对其进行处理。\n\n处理入站电子邮件有多种方式。首先，你可以使用上面用到的简单字符串函数，这些函数内置于\
  \ PHP 中。此外，还可以使用 `IMAP` 扩展和 `MailParse` 扩展。在 PEAR 中，你也可以使用 `Mail_Mime` 包（具体来说是 `Mail_mimeDecode`）。6\n\
  \n6 有关 `Mail_mimeDecode` 实际使用的示例，请参见\nhttp://pear.php.net/manual/en/package.mail.mail-mimedecode.example.php。\n\
  \n![Image 66](img/index-215_1.jpg)\n\n![Image 67](img/index-215_2.png)\n\n电子邮件\n\
  \n193\n\n## 一个寻找问题的解决方案？\n\n使用 PHP 处理传入电子邮件的价值起初可能并不明显。但如果你曾经阅读过 SitePoint 的“**技术时报**”7，你就会知道答案——无论你是否意识到！订阅和退订该邮件列表的操作都是由\
  \ PHP 处理的。你还可以使用 PHP 构建垃圾邮件过滤器，允许用户通过发送到特殊地址的电子邮件（当然需要适当的身份验证）来更新应用程序的版本控制系统，以及创建大量其他应用程序。\n\
  \n7 http://www.sitepoint.com/newsletter/\n\n## 如何保护我的网站免受电子邮件注入攻击？\n\n**电子邮件注入攻击**是指破解者利用你网站的电子邮件表单，以你从未预料的方式发送电子邮件——要么伪造你的表单，要么使用脚本填写并提交表单。这种行为的一些更恶劣的例子包括：通过你的表单发送垃圾邮件、使用你的带宽群发邮件，或者发送冒充你的钓鱼邮件。\n\
  \n这类攻击可能会带来后果——可能简单到收到托管服务商的警告，也可能严重到需要支付更高的带宽费用、被托管公司撤销邮件权限，或者被列入已知垃圾邮件发送者的黑名单。\n\
  \n通过使用 PHP 的 `mail` 函数处理你网站的邮件表单，你将自己暴露在电子邮件注入攻击的可能性之下，这并非因为 PHP `mail` 函数的缺陷，而是由于\
  \ MIME 和 SMTP 标准。在不深入这些标准细节的情况下，你应该知道，破解者要控制你的邮件表单，只需能够添加或操纵消息的原始标头即可。一个巧妙添加的换行符或额外的标头行就足够了。\n\
  \n幸运的是，归根结底，针对电子邮件注入攻击的基本保护实现起来非常简单：不要在用于电子邮件标头的用户输入中允许换行。尽管使用这种技术可以轻松避免攻击，但许多开发者并未实施。\n\
  \n![Image 68](img/index-216_1.png)\n\n![Image 69](img/index-216_2.jpg)\n\n194\n\n\
  PHP 文集\n\n## 深入细节\n\n如果你需要更多关于 SMTP 和 MIME 协议的细节，可以在网上搜索轻量级信息，或者直接通过阅读互联网工程任务组网站上的相关\
  \ RFC（请求评论）来获取原始资料。\n\n有关 SMTP 的信息，请参见：\n\n■ http://www.ietf.org/rfc/rfc0821.txt\n\
  \n有关 MIME 协议的信息，请访问：\n\n■ http://www.ietf.org/rfc/rfc2045.txt\n\n■ http://www.ietf.org/rfc/rfc2046.txt\n\
  \n■ http://www.ietf.org/rfc/rfc2047.txt\n\n■ http://www.ietf.org/rfc/rfc2048.txt\n\
  \n■ http://www.ietf.org/rfc/rfc2049.txt\n\n## 解决方案\n\n以下是一个示例，展示了如何从用户输入中移除换行符：**`attack.php`\
  \ *（节选）***\n\n```\n<?php\n\n$error = FALSE;\n\nif (isset($_POST['submit']))\n\n\
  {\n\n$to = ' *me@mydomain.com*';\n\n// replace new lines with a space\n\n// prevents\
  \ a user from adding headers\n\n$subject = preg_replace('/[\\r|\\n]+/', \" \", $_POST['subject']);\
  \ $from = preg_replace('/[\\r|\\n]+/', \" \", $_POST['from']);\n\n// basic validation\
  \ for subject and email address\n\n$emailPattern = '/^[\\w-\\.]+@([\\w-]+\\.)+[\\\
  w-]{2,4}$/'; if (preg_match('/^[^\\w .!?\\*%$#]+$/', $subject) ||\n\n!preg_match($emailPattern,\
  \ $from))\n\n{\n\n$error = \"Invalid input. Try again.\";\n\n}\n\nif ($error ===\
  \ FALSE &&\n\nEmail\n\n195\n\nmail($to, $subject, $_POST['message'], \"FROM: $from\"\
  ))\n\n{\n\n$error = \"Message Sent\";\n\n}\n\nelse\n\n{\n\n$error .= \" We could\
  \ not send your message. Sorry\";\n\n}\n\n}\n?>\n```\n\n## 讨论\n\n正如我所提到的，设置针对电子邮件注入攻击的基本保护就像从用户输入中移除任何换行符一样简单，但你还可以通过验证将用于电子邮件标头的用户输入来获得额外保护——即验证将出现在收件人、发件人或主题标头中的任何文本。\n\
  \n在此提供的解决方案中，我使用了基本的字符串函数 `str_replace` 来搜索换行符（`\\r` 或 `\\n`），并将其替换为空格。我还验证了发件人地址和电子邮件主题行，以确保它们包含合法的值。\n\
  \n验证方面更难解释，因为它使用了 Perl 兼容正则表达式（也称为“`pcre`”），不幸的是这超出了本书本节的范围。幸运的是，网上有大量资源可以帮助你。8\n\
  \n提供有关电子邮件注入攻击额外信息的网站包括：\n\n■ http://www.securephpwiki.com/index.php/Email_Injection\n\
  \n■ http://www.mailinjection.com/\n\n■ http://www.nyphp.org/phundamentals/email_header_injection.php\n\
  \n8 有关 PHP 实现 `pcre` 的更多信息，请访问 http://www.php.net/pcre/。有关正则表达式的更多通用信息，请查看网上的 http://www.regular-expressions.info/。\n\
  \n196\n\nPHP 文集\n\n## 总结\n\n电子邮件是任何企业或网站的关键元素。它提供了一种简单、便捷的方式与客户、访客、同事甚至你的服务器进行通信。希望本章能让你对如何利用\
  \ PHP 的强大功能以及 `PEAR::Mail` 和 `PEAR::Mail_Mime` 类的灵活性来轻松创建和接收电子邮件有所了解。\n\n现在，去运用这种力量吧——发送新闻通讯、服务器更新、信息以及访客反馈——用于善举而非恶行！\n\
  \n# 第 8 章 图像\n\n构建网站可以将你的创造力扩展到 (X)HTML 展示之外\n\n\n\n格式化文本，如果你愿意的话。多媒体这个总称描述了多种形式的内容传递到你的桌面，包括声音、文本、图像、动画和电影。在图像方面，PHP\
  \ 拥有强大的能力——你可以用它做更多的事情，而不仅仅是向 HTML 中添加静态图像。\n\n你是否希望能够为图像添加水印、为网页创建合适尺寸的缩略图，或者根据数据库中存储的数据构建图表？你是否希望仅使用\
  \ PHP 就能自动、即时地完成所有这些操作？我们将在接下来的页面中涵盖所有这些内容以及更多。\n\n要使用这里的示例，你需要 PHP 的 GD 图像库。我假设你拥有\
  \ GD 2.0 或更高版本（与最新版本的 PHP 捆绑在一起），并且内置了 Free-type、JPEG、GIF 和 PNG 支持。使用 GD 库的 PHP\
  \ 函数在 PHP 手册中有文档说明。¹ 2004 年，GIF 图像的专利问题结束，自 GD 库 2.0.28 版本（随 PHP 4.3.9 发布）起，对该格式的支持已重新启用。\n\
  \n¹ http://www.php.net/gd/\n\n## 图像\n\n尽管 GD 库再次支持 GIF 图像，但值得注意的是，PNG 能够支持 alpha\
  \ 通道透明度和完整的 64 位图像，而 GIF 仅支持 8 位。此外，PNG 使用更高效的压缩算法，减少了所需的带宽。\n\n虽然本章重点介绍创建、操作和使用图像及相关库的技术细节，但你可能也想复习一下基础知识。\n\
  \nMike Doughty 在他的网站上对图像和图形处理做了很好的介绍。²\n\n² http://www.sketchpad.net/readme.htm\n\
  \n## 如何指定正确的图像 MIME 类型？\n\nMIME 代表多用途互联网邮件扩展（Multipurpose Internet Mail Extensions），最初是为了帮助识别不同的电子邮件内容类型而构思的标准。此后，MIME\
  \ 已成为互联网上描述内容类型的事实标准。当你在 PHP 中处理图像时，掌握不同的内容类型非常重要，否则你可能会在一个实际上很简单的问题上花费数小时。\n\n\
  ## 解决方案\n\n一般来说，你的 Web 服务器在向用户浏览器发送请求的内容之前，必须通过特殊的 Content-Type 头部来声明内容类型，以便浏览器知道如何处理该内容。例如，以下是服务器可能发送的用于声明便携式网络图形（PNG）格式图像的头部：\n\
  \n```\nHTTP/1.1 200 OK\nDate: Fri, 28 Mar 2003 21:42:44 GMT\nServer: Apache/1.3.27\
  \ (Unix) PHP/4.3.1\nLast-Modified: Wed, 26 Feb 2003 01:27:19 GMT\nContent-Length:\
  \ 1164\nConnection: close\nContent-Type: image/png\n```\n\nContent-Type 头部用于指定响应当前\
  \ URL 请求所提供内容的 MIME 类型。在这种情况下，MIME 类型是 `image/png`，表示一个 PNG 图像。\n\n当我们从 PHP 脚本生成图像时，MIME\
  \ 类型在 PHP 中变得重要。默认情况下，PHP 脚本发送的 MIME 类型是 `text/html`（表示 HTML 文档）。因此，当你的脚本发送的是图像而不是\
  \ HTML 时，你需要使用 PHP 的 `header` 函数来指定 MIME 类型。示例如下：\n\n```php\n<?php\nheader('Content-Type:\
  \ image/png');\n?>\n```\n\n表 8.1 列出了你需要的常见图像 MIME 类型。\n\n**表 8.1. 图像的 MIME 类型**\n\
  \n| 图像格式 | MIME 类型 |\n| --- | --- |\n| JPEG 文件交换格式（`.jpeg`/`.jpg`） | `image/jpega`\
  \ |\n| 便携式网络图形（`.png`） | `image/png` |\n| 图形交换格式（`.gif`） | `image/gif` |\n| Windows\
  \ 位图（`.bmp`） | `image/bmp` |\n| 可缩放矢量图形（`.svg`） | `image/xml+svg` |\n\na Internet\
  \ Explorer 能理解 `image/jpeg` 类型，但在上传 JPEG 图像时，它会发送 `image/pjpeg` 类型。\n\n## 如何创建缩略图？\n\
  \n如果你的网站允许上传图像（例如用于与提交的内容一起显示），如何确保显示的图像尺寸合适？如果用户上传了特别大的图像，它可能会破坏页面布局。\n\n## 解决方案\n\
  \n解决这个问题的一个方法是创建缩略图，这能保证显示的图像永远不会超过特定的高度和宽度值。\n\n构建基本缩略图分为五个步骤：\n\n1. 将源图像加载到 PHP\
  \ 变量中。\n2. 确定原始图像的高度和宽度。\n3. 创建一个正确尺寸的空白缩略图图像。\n4. 将原始图像复制到空白缩略图中。\n5. 使用正确的内容类型显示缩略图。\n\
  \n让我们从一张 JPEG 格式的照片创建缩略图。首先，我们指定源图像的路径，以及我们期望的宽度和高度（以像素为单位）：`thumb.php（摘录）`\n\n\
  ```php\n<?php\n$sourceImage = 'sample_images/terrier.jpg';\n$thumbWidth = 200;\n\
  $thumbHeight = 200;\n```\n\n接下来，我们使用 `imagecreatefromjpeg` 将文件系统中的图像加载到 PHP 变量 `$original`\
  \ 中。`getimagesize` 函数返回图像的宽度和高度（我们将在“如何在不拉伸的情况下调整图像大小？”中进一步讨论 `getimagesize`）：\n\
  \n`thumb.php（摘录）`\n\n```php\n$original = imagecreatefromjpeg($sourceImage);\n$dims\
  \ = getimagesize($sourceImage);\n```\n\n然后，我们使用 `imagecreatetruecolor` 函数创建一个空白图像（在内存中，作为\
  \ PHP 变量 `$thumb`），缩略图将被放置在其中：\n\n`thumb.php（摘录）`\n\n```php\n$thumb = imagecreatetruecolor($thumbWidth,$thumbHeight);\n\
  ```\n\n正如函数名所示，`imagecreatetruecolor` 创建一个真彩色（24 位）图像，而 `imagecreate` 函数提供的是基于调色板（8\
  \ 位）的图像。我们之前使用的 `imagecreatefromjpeg` 函数从源文件创建了一个真彩色图像，因此缩略图也必须是真彩色的。\n\n示例代码中的下一行是从原始图像实际创建缩略图的关键点：\n\
  \n`thumb.php（摘录）`\n\n```php\nimagecopyresampled( $thumb, $original, 0, 0, 0, 0,\n\
  $thumbWidth, $thumbHeight, $dims[0], $dims[1] );\n```\n\n`imagecopyresampled` 函数将图像的缩放版本放入空白缩略图中，并在过程中重新采样，以确保图像平滑缩放。该函数的旧版本\
  \ `imagecopyresized` 则更粗糙地改变图像大小。\n\n该函数的前两个参数分别代表目标图像 `$thumb` 和源图像 `$original`。`imagecopyresampled`\
  \ 函数非常灵活，可用于将图像的一部分复制到另一图像中。接下来的四个参数指的是目标图像和源图像部分（从左上角开始）的 *x* 和 *y* 坐标。由于我们只关心复制整个图像，因此所有四个参数都设为\
  \ 0。最后四个参数代表目标图像和源图像部分的宽度和高度。同样，由于我们希望复制整个图像，我们提供每个图像的完整尺寸。更多信息请参考 PHP 手册。³\n\n\
  ³ http://www.php.net/imagecopyresampled/\n\n最后，在发送了正确的内容类型头部 `Content-type: image/jpeg`\
  \ 之后，我们使用 `imagejpeg` 输出完成的缩略图：\n\n`thumb.php（摘录）`\n\n```php\nheader( \"Content-type:\
  \ image/jpeg\" );\nimagejpeg( $thumb );\n?>\n```\n\n图 8.1 显示了最终结果。\n\n![Image 70](img/index-224_1.png)\n\
  \n图 8.1. 我们的第一个缩略图\n\n虽然肯定还有改进空间，但这只是一个开始。\n\n## 如何在不拉伸的情况下调整图像大小？\n\n\n\n\n\n除非原始图像和缩略图恰好具有相同的宽高比（或`aspect\
  \ ratio`），否则调整图像大小以生成缩略图的过程会扭曲图像的尺寸。我们真正想要的是原始图像按比例缩放后的版本，使其尽可能整齐地适应空白缩略图。\n\n##\
  \ 解决方案\n\n我们可以确定原始图像的尺寸，并用这些尺寸来计算缩略图的比例尺寸。`getimagesize`函数返回一个包含图像有用信息的数组。示例如下：\n\
  \n```php\n<?php\n$sourceImage = 'sample_images/terrier.jpg';\n$dims = getimagesize($sourceImage);\n\
  echo ( '<pre>' );\nprint_r($dims);\necho ( '</pre>' );\n?>\n```\n\n上述示例将显示`$dims`变量的内容：\n\
  \n```\nArray\n(\n    [0] => 600\n    [1] => 450\n    [2] => 2\n    [3] => width=\"\
  600\" height=\"450\"\n    [bits] => 8\n    [channels] => 3\n    [mime] => image/jpeg\n\
  )\n```\n\n数组的第一个元素是图像的宽度；第二个是高度。第三个数组元素是一个数字，用于标识图像类型，其中 1 表示 GIF，2 表示 JPEG，3 表示\
  \ PNG——更多值在 PHP 手册中有描述。4 第四个数组元素包含一个字符串，用于 HTML 的`<img>`标签中。`bits`元素包含颜色深度。5 `channels`元素对于\
  \ RGB 彩色图像值为 3，对于 CMYK 为 4。6 `mime`元素包含 MIME 类型。\n\n4 http://www.php.net/getimagesize/\n\
  \n5 8 位可以表示 256 种颜色，8 位颜色称为索引颜色。真彩色（24 位）可以表示 16,777,216 种颜色。\n\n6 RGB（红-绿-蓝）颜色模型用于计算机显示器，而\
  \ CMYK（青-品红-黄-黑）用于印刷。\n\n在本节中，我们将编写一个名为`Thumbnail`的类，用于生成按比例缩放的图像。该类还使我们能够处理小于缩略图尺寸的图像，如果需要，可以保留其原始尺寸。该类设计为仅处理\
  \ PNG 和 JPEG 文件，但可以轻松修改以处理其他格式。\n\n在开始创建`Thumbnail`类之前，我们需要为错误处理定义一些自定义异常：\n\nThumbnail.class.php（节选）\n\
  \n```php\nclass ThumbnailException extends Exception\n{\n    public function __construct($message\
  \ = null, $code = 0)\n    {\n        parent::__construct($message, $code);\n   \
  \     error_log('Error in '.$this->getFile().\n            ' Line: '.$this->getLine().\n\
  \            ' Error: '.$this->getMessage()\n        );\n    }\n}\n\nclass ThumbnailFileException\
  \ extends ThumbnailException {}\nclass ThumbnailNotSupportedException extends ThumbnailException\
  \ {}\n```\n\n我们的基础自定义异常类`ThumbnailException`确保异常详情通过`error_log`函数记录。子类表示在创建缩略图过程中可能出现的不同异常情况。\n\
  \n与任何类一样，我们从类属性开始：\n\nThumbnail.class.php（节选）\n\n```php\nclass Thumbnail\n{\n  \
  \  private $maxWidth;\n    private $maxHeight;\n    private $scale;\n    private\
  \ $inflate;\n    private $types;\n    private $imgLoaders;\n    private $imgCreators;\n\
  \    private $source;\n    private $sourceWidth;\n    private $sourceHeight;\n \
  \   private $sourceMime;\n    private $thumb;\n    private $thumbWidth;\n    private\
  \ $thumbHeight;\n}\n```\n\n`$maxWidth`、`$maxHeight`、`$scale`、`$inflate`、`$types`、`$imgLoaders`和`$imgCreators`由构造函数设置，下面将进行描述。`$source`、`$sourceWidth`、`$sourceHeight`和`$sourceMime`表示源图像的属性，将由下面描述的图像加载方法设置。`$thumb`、`$thumbWidth`和`$thumbHeight`表示创建的缩略图的属性，也将在下面描述。\n\
  \n接下来，我们创建一个类构造函数：\n\nThumbnail.class.php（节选）\n\n```php\npublic function __construct($maxWidth,\
  \ $maxHeight, $scale = true, $inflate = true)\n{\n    $this->maxWidth = $maxWidth;\n\
  \    $this->maxHeight = $maxHeight;\n    $this->scale = $scale;\n    $this->inflate\
  \ = $inflate;\n```\n\n`Thumbnail`类的构造函数接受四个参数。前两个分别是缩略图的最大宽度和高度（以像素为单位）。第三个参数告诉`Thumbnail`对象是否应按比例缩放图像到缩略图，还是像前面的示例那样直接拉伸。第四个参数告诉`Thumbnail`对象如何处理太小的图像，即是否将其放大以填充缩略图。\n\
  \n将这些参数安全地存储在实例变量中后，我们可以创建构造函数的其余部分：\n\nThumbnail.class.php（节选）\n\n```php\n$this->types\
  \ = array('image/jpeg', 'image/png', 'image/gif');\n$this->imgLoaders = array(\n\
  \    'image/jpeg' => 'imagecreatefromjpeg',\n    'image/png' => 'imagecreatefrompng',\n\
  \    'image/gif' => 'imagecreatefromgif'\n);\n$this->imgCreators = array(\n    'image/jpeg'\
  \ => 'imagejpeg',\n    'image/png' => 'imagepng',\n    'image/gif' => 'imagegif'\n\
  );\n}\n```\n\n`$this->types`属性存储该类可以处理的 MIME 类型数组。`$this->imgLoaders`属性存储用于加载这些\
  \ MIME 类型图像的函数名称，而`$this->imgCreators`属性存储用于创建这些类型新图像的函数名称。\n\n`Thumbnail`类提供了两种加载要转换图像的方法。第一种是`loadFile`，允许你指定要加载的本地文件：\n\
  \nThumbnail.class.php（节选）\n\n```php\npublic function loadFile ($image)\n{\n    if\
  \ (!$dims = @getimagesize($image))\n    {\n        throw new ThumbnailFileException(\n\
  \            'Could not find image: '.$image);\n    }\n    if (in_array($dims['mime'],$this->types))\n\
  \    {\n        $loader = $this->imgLoaders[$dims['mime']];\n        $this->source\
  \ = $loader($image);\n        $this->sourceWidth = $dims[0];\n        $this->sourceHeight\
  \ = $dims[1];\n        $this->sourceMime = $dims['mime'];\n        $this->initThumb();\n\
  \        return true;\n    }\n    else\n    {\n        throw new ThumbnailNotSupportedException(\n\
  \            'Image MIME type '.$dims['mime'].' not supported');\n    }\n}\n```\n\
  \n`loadFile`方法使用`getimagesize`函数获取所有必需的图像属性，包括宽度、高度和 MIME 类型。如果`getimagesize`返回\
  \ false，则发生错误，我们抛出自定义异常`ThumbnailFileException`。如果图像的 MIME 类型不在我们支持的列表中，则抛出`ThumbnailNotSupportedException`。如果一切正常，我们通过适合该\
  \ MIME 类型的图像加载函数加载图像，并将其赋值给`$this->source`属性。我们还将图像宽度赋值给`$this->sourceWidth`属性，图像高度赋值给`$this->sourceHeight`属性，MIME\
  \ 类型赋值给`$this->sourceMime`属性。\n\n设置完所有实例变量后，该方法调用`initThumb`方法，我们稍后将处理该方法。最后，如果没有异常，该方法返回\
  \ true。\n\n`loadData`方法执行与`loadFile`相同的功能，不同之处在于我们从字符串而不是文件加载图像。该字符串可能来自数据库，例如。以下是我们的`loadData`方法：\n\
  \nThumbnail.class.php（节选）\n\n```php\npublic function loadData ($image, $mime)\n\
  {\n    if ( in_array($mime,$this->types) ) {\n        if($this->source = @imagecreatefromstring($image))\n\
  \        {\n            $this->sourceWidth = imagesx($this->source);\n         \
  \   $this->sourceHeight = imagesy($this->source);\n            $this->sourceMime\
  \ = $mime;\n            $this->initThumb();\n            return true;\n        }\n\
  \        else\n        {\n            throw new ThumbnailFileException(\n      \
  \          'Could not load image from string');\n        }\n    }\n    else\n  \
  \  {\n        throw new ThumbnailNotSupportedException(\n            'Image MIME\
  \ type '.$mime.' not supported');\n    }\n}\n```\n\n\n\n\n\n`loadData` 方法执行的功能与\
  \ `loadFile` 方法相同，并设置相同的实例变量，但它使用的函数与 `loadFile` 不同。`loadData` 方法首先使用 `imagecreatefromstring`\
  \ 函数加载图像，如果无法创建图像，则抛出 `ThumbnailFileException` 异常。`imagecreatefromstring` 会返回一个图像资源，该资源来自传递给函数的字符串数据。源图像的宽度和高度通过\
  \ `imagesx` 和 `imagesy` 函数获取，这两个函数分别返回图像的宽度和高度。除了图像数据，你还需要将 MIME 类型作为第二个参数提供给 `loadData`\
  \ 方法。\n\n接下来，使用 `buildThumb` 方法来渲染最终的缩略图：\n\n```\npublic function buildThumb($file\
  \ = null)\n{\n    $creator = $this->imgCreators[$this->sourceMime];\n    if (isset($file))\
  \ {\n        return $creator($this->thumb, $file);\n    } else {\n        return\
  \ $creator($this->thumb);\n    }\n}\n```\n\n如果你向该方法传递一个文件名，缩略图将作为文件存储，并使用你指定的名称。否则，图像将直接输出到浏览器，因此你需要确保首先发送了正确的\
  \ HTTP 头，你将在 `Thumbnail` 类描述之后的用法示例中看到这一点。注意，我们使用了在构造函数中分配给 `$this->imgCreators`\
  \ 属性的图像函数名称。\n\n最后的公共方法用于收集有关缩略图的信息。`getMime` 方法返回 MIME 类型，可用于为缩略图生成 `Content-Type`\
  \ 头：\n\n```\npublic function getMime()\n{\n    return $this->sourceMime;\n}\n```\n\
  \n`getThumbWidth` 和 `getThumbHeight` 方法用于返回缩略图的宽度和高度（以像素为单位）；你可以利用这些信息来创建 HTML 的\
  \ `img` 标签，例如：\n\n```\npublic function getThumbWidth()\n{\n    return $this->thumbWidth;\n\
  }\n\npublic function getThumbHeight()\n{\n    return $this->thumbHeight;\n}\n```\n\
  \n我们的类有一个私有方法，名为 `initThumb`，它由我之前描述的加载方法调用。`initThumb` 处理我们类的缩放和放大功能。第一步是处理缩放：\n\
  \n```\nprivate function initThumb ()\n{\n    if ( $this->scale )\n    {\n      \
  \  if ( $this->sourceWidth > $this->sourceHeight )\n        {\n            $this->thumbWidth\
  \ = $this->maxWidth;\n            $this->thumbHeight = floor(\n                $this->sourceHeight\
  \ *\n                ($this->maxWidth/$this->sourceWidth)\n            );\n    \
  \    }\n        else if ( $this->sourceWidth < $this->sourceHeight )\n        {\n\
  \            $this->thumbHeight = $this->maxHeight;\n            $this->thumbWidth\
  \ = floor(\n                $this->sourceWidth *\n                ($this->maxHeight/$this->sourceHeight)\n\
  \            );\n        }\n        else\n        {\n            $this->thumbWidth\
  \ = $this->maxWidth;\n            $this->thumbHeight = $this->maxHeight;\n     \
  \   }\n    }\n```\n\n这部分函数会检查是否需要图像缩放。如果需要，则执行一些计算来确定缩略图的合适尺寸，使其匹配原始图像的宽高比，并将最长轴限制为最初提供给构造函数的最大尺寸。\n\
  \n如果不需要缩放，我们直接使用最初提供给构造函数的 `$maxWidth` 和 `$maxHeight` 值：\n\n```\nelse\n{\n    $this->thumbWidth\
  \ = $this->maxWidth;\n    $this->thumbHeight = $this->maxHeight;\n}\n```\n\n下一步是通过使用\
  \ `imagecreatetruecolor` 函数创建空白缩略图图像：\n\n```\n$this->thumb = imagecreatetruecolor(\n\
  \    $this->thumbWidth,\n    $this->thumbHeight\n);\n```\n\n`initThumb` 方法的最后一步是将源图像复制到缩略图图像中：\n\
  \n```\nif ( $this->sourceWidth <= $this->maxWidth && $this->sourceHeight <= $this->maxHeight\
  \ && $this->inflate == false )\n{\n    $this->thumb = $this->source;\n}\nelse\n\
  {\n    imagecopyresampled( $this->thumb, $this->source, 0, 0, 0, 0, $this->thumbWidth,\
  \ $this->thumbHeight,\n        $this->sourceWidth, $this->sourceHeight\n    );\n\
  }\n```\n\n如果源图像小于指定的缩略图图像尺寸，并且 `inflate` 属性设置为 `false`，则 `thumb` 属性被设置为原始图像。否则，使用\
  \ `imagecopyresampled` 函数将源图像重新采样到空白缩略图图像中。我们在“如何创建缩略图图像？”中更详细地讨论了 `imagecopyresampled`\
  \ 函数。\n\n这就是我们的类！让我们来试试看。下面是一个快速演示，它基于文件输出缩略图：\n\n```\n<?php\nrequire_once('Thumbnail.class.php');\n\
  $tn = new Thumbnail(200,200);\n$tn->loadFile('sample_images/terrier.jpg');\nheader('Content-Type:\
  \ '.$tn->getMime());\n$tn->buildThumb();\n?>\n```\n\n首先，我们实例化一个 `Thumbnail` 对象，指定我们希望缩略图的尺寸为\
  \ 200×200 像素。然后我们调用 `loadFile` 方法并传递一个文件名。我们使用 PHP 的 `header` 函数结合 `getMime` 方法来发送正确的\
  \ HTTP 头；然后，我们只需调用 `buildThumb` 方法来显示图像。我们的工作结果如图 8.2 所示。\n\n图 8.2. 按比例缩放的缩略图\n\n\
  下面是另一个示例，展示 `loadData` 方法，并说明如何将文件存储而不是直接输出：\n\n```\n<?php\nrequire_once('Thumbnail.class.php');\n\
  $tn = new Thumbnail(200, 200);\n$image = file_get_contents('sample_images/terrier.jpg');\n\
  $tn->loadData($image, 'image/jpeg');\n$tn->buildThumb('sample_images/nice_doggie.jpg');\n\
  ?>\n```\n\n我们首先包含我们的类并实例化 `Thumbnail` 对象。我们使用 `file_get_contents` 函数模拟一个源图像字符串。当然，在实际场景中，这个字符串可能来自数据库。我们使用\
  \ `loadData` 方法加载图像字符串，并调用 `buildThumb` 方法，但这次我们还传递了一个文件名参数，使该方法将缩略图保存到 `sample_images/nice_doggie.jpg`\
  \ 文件中。\n\n接下来是示例页面的 HTML：\n\n```\n<!DOCTYPE html public \"-//W3C//DTD XHTML 1.0\
  \ Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<title> Thumbnail Example\
  \ </title>\n<meta http-equiv=\"Content-Type\"\ncontent=\"text/html; charset=iso-8859-1\"\
  \ />\n<style type=\"text/css\">\ndiv { float: left; }\n</style>\n</head>\n<body>\n\
  <div>\n<h1>Before...</h1>\n<p>\n<img src=\"sample_images/terrier.jpg\" alt=\"Original\
  \ Image\" />\n</p>\n</div>\n<div>\n<h1>After...</h1>\n<p>\n<img src=\"sample_images/nice_doggie.jpg\"\
  \nwidth=\"<?php echo ( $tn->getThumbWidth() );?>\"\nheight=\"<?php echo ( $tn->getThumbHeight()\
  \ );?>\"\nalt=\"Resized Image\" />\n</p>\n</div>\n</body>\n</html>\n```\n\n注意，在生成缩略图的\
  \ `img` 标签时，我们使用 `getThumbWidth` 和 `getThumbHeight` 方法来填充 `<img>` 标签的 `width` 和\
  \ `height` 属性。生成的页面如图 8.3 所示。\n\n图 8.3. 调整大小前后的图像\n\n好了，现在无论尺寸多大，Rover 看起来都很可爱！\n\
  \n### 如何构建一个简单的缩略图画廊？\n\n在上一节中，我们研究了如何创建缩略图，而不会让你心爱的狗狗看起来像某种奇怪的狗蝙蝠杂交体。掌握了这些知识，从一个包含\
  \ PNG、GIF 和 JPEG 文件的目录中构建一个简单的缩略图画廊应该是一件容易的事！\n\n## 解决方案\n\n\n\n\n我们将使用上一节创建的`Thumbnail`类，以及\
  \ PHP 内置的`dir`伪类（关于`dir`伪类的更多信息，请参考第 6 章“使用`dir`伪类”一节）来构建我们的相册。我们只需遍历目录，查找没有缩略图的图片并创建它们；同时，生成用于显示这些图片的\
  \ HTML。这种方法（在磁盘上创建并存储缩略图）的一个重要好处是，它省去了每次动态创建缩略图的开销。\n\n当然，我们需要做的第一步是引入`Thumbnail`类，并将`$image_html`变量初始化为空字符串：\n\
  \n`thumbGallery.php` *(摘录)*\n\n```php\n<?php\nrequire_once('Thumbnail.class.php');\n\
  $image_html = '';\n```\n\n`$image_html`变量最终将保存相册的所有 HTML 代码。\n\n接下来，我们使用`dir`伪类为`sample_images`目录获取一个`Directory`对象。这个对象允许我们启动一个`while`循环，遍历`sample_images`中的所有目录条目：\n\
  \n`thumbGallery.php` *(摘录)*\n\n```php\n$dir = dir('sample_images');\nwhile ($image\
  \ = $dir->read())\n{\n```\n\n每次循环会将通过`$dir->read`方法获取的下一个目录条目赋值给`$image`变量。当没有更多目录条目时，循环终止。\n\
  \n接下来，我们检查获取的目录条目是否是我们想要包含在相册中的图片文件：\n\n`thumbGallery.php` *(摘录)*\n\n```php\n$ext\
  \ = explode('.',$image);\n$size = count($ext);\nif (($ext[$size-1] == 'png' ||\n\
  $ext[$size-1] == 'jpg' ||\n$ext[$size-1] == 'gif')\n&& !preg_match('/^thumb_/',\
  \ $image)\n&& $image != '.' && $image != '..')\n{\n```\n\n为了检查当前目录条目是否是我们想要包含在相册中的图片，我们首先检查文件扩展名，确保它是`.png`、`.jpg`或`.gif`。然后，我们确保文件名不以`thumb_`开头（这表示它是我们的缩略图之一），并且该条目不是`.`或`..`目录条目。\n\
  \n如果满足这些条件，我们就继续创建缩略图：\n\n`thumbGallery.php` *(摘录)*\n\n```php\nif ( !file_exists('sample_images/thumb_'.$image)\
  \ )\n{\n$tn = new Thumbnail(200, 200, true, false);\n$tn->loadFile('sample_images/'.$image);\n\
  $tn->buildThumb('sample_images/thumb_'.$image);\n}\n```\n\n首先，我们检查当前图片的缩略图是否已经存在。然后，我们使用`Thumbnail`类创建一个新的缩略图，并将其保存，文件名前加上`thumb_`。\n\
  \n`while`循环内的最后一步是为当前图片添加 HTML 标记：\n\n`thumbGallery.php` *(摘录)*\n\n```php\n$image_html\
  \ .= '<div class=\"image\">' .\n'<a href=\"sample_images/'.$image.'\">' .\n'<img\
  \ src=\"sample_images/thumb_'.$image.'\">' .\n'</a></div>';\n}\n}\n?>\n```\n\n相册页面的\
  \ HTML 非常简单；一旦布局和 CSS 样式表创建完成，图片的标记就会从`$image_html`变量中输出：\n\n`thumbGallery.php`\
  \ *(摘录)*\n\n```php\n<!DOCTYPE html public \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head>\n<title> 缩略图示例 </title>\n<style type=\"text/css\">\n⋮ *在此处插入吸引人的视觉样式…*\n\
  </style>\n</head>\n<body>\n<h1>相册</h1>\n<?php echo ( $image_html ); ?>\n</body>\n\
  </html>\n```\n\n该脚本的输出示例如图 8.4 所示。\n\n![Image 73](img/index-239_1.jpg)\n\n图 8.4.\
  \ 我们的缩略图相册\n\n## 如何从图片中提取 EXIF 信息？\n\n现在你已经有了一个功能完善的相册，你可能还想为访问者提供关于照片的额外信息。**可交换图像文件格式**（通常称为\
  \ EXIF 格式）提供了一种在图像中存储元数据的机制；大多数数码相机和图像编辑应用程序都原生支持此功能。如果你用数码相机拍摄了相册中的一些图片，你可以提取 EXIF\
  \ 数据，例如照片的日期和时间、相机型号以及使用的相机设置，并将其与照片一起显示。\n\n## 解决方案\n\n当你从 PHP 的 EXIF 函数中寻求一点帮助时，提取这些信息就变得非常简单。要使用\
  \ EXIF 函数，你需要确保你的 PHP 安装已启用 EXIF 支持。请阅读 EXIF 函数手册页面上的说明。7\n\n`exif_read_data`函数将\
  \ JPEG 或 TIFF 图像中的所有元信息读取到一个数组中。请看这个示例：\n\n`exif.php` *(摘录)*\n\n```php\n<?php\n\
  // 获取 exif 数据\n$exif_data = exif_read_data( 'sample_images/terrier.jpg' );\necho\
  \ '<pre>';\nprint_r($exif_data);\necho '</pre>';\n?>\n```\n\n上述代码显示了图像的所有可用 EXIF\
  \ 信息。为简洁起见，由于数组中有大量元信息，这里只列出我们可用信息的一个子集：\n\n```\nArray\n(\n[FileName] => terrier.jpg\n\
  [FileDateTime] => 1185158396\n[FileSize] => 46196\n[FileType] => 2\n[MimeType] =>\
  \ image/jpeg\n[Make] => FUJIFILM\n[Model] => FinePix S9500\n[ExposureTime] => 10/520\n\
  [FNumber] => 390/100\n[ISOSpeedRatings] => 80\n[ShutterSpeedValue] => 576/100\n\
  )\n```\n\n让我们利用这些信息，更新我们在“如何构建一个简单的缩略图相册？”中构建的相册输出。我们只需要修改生成`$image_html`变量中标记的代码，如下所示：7\
  \ http://www.php.net/exif/\n\n`exifGallery.php` *(摘录)*\n\n```php\nif($ext[$size-1]\
  \ == 'jpg')\n{\n$exif_data = exif_read_data( 'sample_images/' . $image );\n}\nelse\n\
  {\n$exif_data = array();\n}\n$image_html .= '<div class=\"image\">';\n$image_html\
  \ .= '<div class=\"thumbnail\">';\n$image_html .= '<a href=\"sample_images/' . $image\
  \ . '\">';\n$image_html .= '<img src=\"sample_images/thumb_' . $image . '\">';\n\
  $image_html .= '</a></div>';\n$image_html .= '<div class=\"exifdata\">';\nif(isset($exif_data['FileDateTime']))\n\
  {\n$image_html .= '<p>日期: ' .\ndate( 'jS F Y', $exif_data['FileDateTime'] ) . '</p>';\n\
  }\nif(isset( $exif_data['Make']))\n{\n$image_html .= '<p>拍摄设备: ' . $exif_data['Make'];\n\
  if(isset($exif_data['Model']))\n{\n$image_html .= ' ' . $exif_data['Model'];\n}\n\
  $image_html .= '</p>';\n}\n$image_html .= '</div></div>';\n```\n\n在上述对相册的修改中，如果图片是\
  \ JPEG 图像，我们会添加显示照片拍摄日期以及所用相机的品牌和型号（如果这些信息可用）。\n\n如图 8.5 所示，EXIF 数据显示在相应图片的下方。\n\
  \n![Image 74](img/index-242_1.jpg)\n\n图 8.5. 显示图片 EXIF 数据的缩略图相册\n\n## 如何为图片添加水印？\n\
  \n那么，你非常喜欢自己的照片，并想用**水印**来保护它们。也就是说，你想在原始图片中放置一些标识性的图像或文字，以表明你拥有其版权。借助 GD 库和 PHP，添加水印轻而易举！\n\
  \n## 解决方案\n\n`imagestring`函数可用于在图片中放置文字，而`imagecopymerge`函数可用于在原始图片中放置另一张图片。使用这些函数都非常简单。\n\
  \n### 显示文字水印\n\n在图片中添加文字是最简单的水印形式。其工作原理如下：\n\n![Image 75](img/index-243_1.png)\n\
  \n`textWatermark.php` *(摘录)*\n\n```php\n<?php\n$image = imagecreatefromjpeg('sample_images/thumb_terrier.jpg');\n\
  $color = imagecolorallocate($image, 68, 68, 68);\nimagestring($image, 5, 90, 0,\
  \ \"Abbey '07\", $color);\nheader('Content-Type: image/jpg');\nimagejpeg($image);\n\
  ?>\n```\n\n\n\n\n\n`imagecolorallocate`函数允许你通过指定红、绿、蓝分量来创建一种新颜色，用于在图像上绘图。该函数返回一个数字，用于标识图像中的该颜色。\n\
  \n获得颜色后，你可以使用`imagestring`函数将文本放置在图像上。该函数的第一个参数是图像，第二个参数是字体编号——数字 1 到 5 引用内置字体。你可以使用`imageloadfont`来提供其他字体。第三和第四个参数表示文本应在图像上绘制的水平和垂直坐标。第五个参数包含你希望放置在图像中的文本，最后一个参数指定文本的颜色。此脚本的输出如图\
  \ 8.6 所示。\n\n**图 8.6.** 应用文本水印\n\n## 显示图形水印\n\n带有透明背景的徽标或其他可识别图形很容易放置在另一张图像上。以下是一个示例：\n\
  \n```php\n<?php\n$image = imagecreatefromjpeg('sample_images/thumb_terrier.jpg');\n\
  $iWidth = imagesx($image);\n$watermark = imagecreatefrompng('sample_images/sitepoint_watermark.png');\n\
  $wmWidth = imagesx($watermark);\n$wmHeight = imagesy($watermark);\n$xPos = $iWidth\
  \ - $wmWidth;\nimagecopymerge($image, $watermark, $xPos, 0, 0, 0, $wmWidth, $wmHeight,\
  \ 100);\nheader('Content-Type: image/jpg');\nimagepng($image);\n?>\n```\n\n过程很简单：加载原始图像和水印图像；然后，在获取原始图像的高度和宽度后，使用`imagecopymerge`将水印放置在原始图像上。`imagecopymerge`函数的前两个参数是原始（或目标）图像对象和源图像对象（本例中为水印）。接下来的四个参数分别表示目标图像和源图像的*x*和*y*坐标，从图像的左上角开始。接下来的两个参数表示源图像的宽度和高度。最后一个参数表示真彩色图像所需的透明度级别——参数\
  \ 100 表示完全不透明，而参数 0 表示原始图像不受水印影响。\n\n结果如图 8.7 所示——照片右上角出现了一个微型 SitePoint 徽标。\n\n\
  ![Image 76](img/index-245_1.jpg)\n\n**图 8.7.** 应用图形水印\n\n## 如何使用 PHP 显示图表和图形？\n\n\
  以图形形式显示数据是与网站访问者沟通的有力方式，并且可以帮助你准确了解网站的使用情况。图表可以显示任何相关数据，包括网站的月度流量统计或网站上的销售计数。\n\n\
  ## 解决方案\n\n许多项目扩展了 PHP 的基本图像渲染能力，允许数据以某种图表或图形形式显示。\n\n首先是一个用 PHP 编写的项目，它充分利用了 GD\
  \ 库和 PHP 的图像函数：优秀的 JpGraph 库。你可以用 JpGraph 做很多事情，对其进行详细讨论超出了本书的范围。该库的文档超过 1MB，非常详尽，并提供了许多有用的示例。如果你正在寻找关于\
  \ JpGraph 的更高级阅读材料，我推荐 Jason E. Sweat 的两篇文章：一篇在 Zend Developer Zone，另一篇在 php|architect。不过，在这里，我们将通过使用该库为给定数据集显示柱状图和饼图来感受一下。\n\
  \n请注意，JpGraph 仅免费用于非商业用途——请务必阅读网站上的许可信息。我在本例中使用的版本是 2.2，它仅适用于 PHP 5.1.0 及以上版本。如果你使用的是\
  \ PHP 4，则需要下载 JpGraph 版本 1。这里的代码还假设你已经将`jpgraph/src/`目录添加到 PHP 的 include 路径中，以便加载\
  \ JpGraph 类文件。\n\n#### JpGraph 和 PHP 错误通知\n\n如果你在`php.ini`中启用了 PHP 的错误通知，使用 JpGraph\
  \ 时可能会遇到问题。生成的错误消息可能导致图形图像无法显示。本章中的示例显式禁用了通知以避免此问题。有关如何控制错误报告的更多信息，请参见第 9 章。\n\n\
  ### 创建柱状图\n\n首先，让我们看看如何使用 JpGraph 生成柱状图：\n\n```php\n<?php\nerror_reporting(E_ALL\
  \ ^ E_NOTICE);\nrequire_once ('jpgraph.php');\nrequire_once ('jpgraph_bar.php');\n\
  $xdata = array('Mousemats','Pens','T-Shirts','Mugs');\n$ydata = array (35,43,15,10);\n\
  ```\n\n首先，我们关闭`E_NOTICE`报告；然后包含核心“引擎”以及柱状图类（确保它位于你的 PHP include 路径中）。接下来，我们设置两个示例数据数组，这些数据将绘制在图形的*x*和*y*轴上。在实际应用中，这些可能是你从\
  \ MySQL 中获取的结果。\n\nJpGraph API 相当直观，并附有高质量文档。从数据数组生成图形的第一步是设置图形本身的基础，设置其大小和背景颜色：\n\
  \n```php\n// Width, height,cache filename\n$graph = new Graph(400,200,'auto');\n\
  // Margin widths\n$graph->img->SetMargin(40,20,20,40);\n// X text scale, Y linear\
  \ scale\n$graph->SetScale('textlin');\n// Plot background\n$graph->SetColor('white');\n\
  // Margin color\n$graph->SetMarginColor('darkgray');\n// Use a drop shadow\n$graph->SetShadow();\n\
  // Frame color\n$graph->SetFrame(true,'black');\n```\n\n为图形添加标题没有问题。JpGraph 带有三种内置位图字体，其中两种可以以粗体显示，并且内置支持多种\
  \ TrueType 字体。请注意，TrueType 字体并未随 JpGraph 打包——它们必须作为操作系统字体的一部分单独提供。\n\n接下来，我们设置图形的标题：\n\
  \n```php\n// Title text\n$graph->title->Set('Sales Figures for March');\n// Title\
  \ color\n$graph->title->SetColor('white');\n// Title font\n$graph->title->SetFont(FF_VERDANA,FS_BOLD,14);\n\
  ```\n\n现在，让我们构建*x*轴。这里，使用`SetTickLabels`方法分配标签，刻度是*x*轴上每个间隔的标记：\n\n```php\n// Axis\
  \ title text\n$graph->xaxis->title->Set('Product Type');\n// Axis title color\n\
  $graph->xaxis->title->SetColor('black');\n// Axis title font\n$graph->xaxis->title->SetFont(FF_VERDANA,FS_BOLD,10);\n\
  // Add labels\n$graph->xaxis->SetTickLabels($xdata);\n// Axis colors\n$graph->xaxis->SetColor('black','white');\n\
  // Axis font\n$graph->xaxis->SetFont(FF_VERDANA,FS_NORMAL,8);\n// Hide ticks\n$graph->xaxis->HideTicks();\n\
  ```\n\n*y*轴将采用自动生成的数值，一旦添加了*y*数据：\n\n```php\n// Axis title text\n$graph->yaxis->title->Set('Units\
  \ Sold');\n// Axis title color\n$graph->yaxis->title->SetColor('black');\n// Axis\
  \ title font\n$graph->yaxis->title->SetFont(FF_VERDANA,FS_BOLD,10);\n// Axis colors\n\
  $graph->yaxis->SetColor('black','white');\n// Axis font\n$graph->yaxis->SetFont(FF_VERDANA,FS_NORMAL,8);\n\
  // Hide ticks\n$graph->yaxis->HideTicks();\n```\n\n在以下代码中，我们创建一个新的`BarPlot`对象，该对象负责在图表上绘制柱状条：\n\
  \n```php\n// Instantiate with Y data\n```\n\n\n\n\n\n$bplot = new BarPlot($ydata);\n\
  \n// Width of bars\n$bplot->SetWidth(0.75);\n\n// Set bar background color\n$bplot->SetFillColor('darkgray');\n\
  \n剩下的工作就是将柱状图绘图对象添加到图形对象中，并将其发送到浏览器：\n\n![Image 79](img/index-249_1.png)\n\n图像\n\
  \n227\n\n`bargraph.php` *(摘录)*\n\n```\n$graph->Add($bplot);\n$graph->Stroke();\n\
