  \ ' 登录 ');\n\n?>\n```\n\n![图片 103](img/index-317_1.jpg)\n\n最后，我们有了登录表单页面的 HTML：\n\
  \n`login.php` *（摘录）*\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head>\n⋮ *HTML 头部内容…*\n</head>\n<body>\n<h1>请登录</h1>\n<?php echo $form->toHTML();\
  \ ?>\n</body>\n</html>\n```\n\n完成的登录表单如图 10.2 所示。\n\n图 10.2. 完成的登录表单\n\n## 讨论\n\n\
  访问控制由两个主要部分（或阶段）组成：\n\n### 认证\n\n认证是确定用户身份是否与其声称一致的过程。我们的 `Auth` 类在 `login` 方法中处理这一判断，即我们根据数据库确认用户名和密码。\n\
  \n我们假设只有正确的用户才会拥有这两条信息。\n\n### 授权\n\n授权是确定已认证用户应被授予哪些权限的过程。在这方面，`Auth` 类非常有限，因为没有定义访问级别——只有全局访问或无法访问网站。当然，您可能希望授予介于这两个极端之间的访问级别，在这种情况下，您应该参阅“如何构建权限系统？”\n\
  \n您可能会问，为什么我们在这个类中使用数据库来处理用户，而不是使用类似于前面解释的 HTTP 认证的方法。实际上，有几个原因。首先，随着网站从只有少数成员发展到成百上千甚至数百万（我们希望如此）的成员，HTTP\
  \ 认证会变得难以处理且速度变慢。是的，我们可以将成员详细信息添加到用户文件中，但随着文件变大，服务器读取和查找特定用户所需的时间也会增加。其次，如果我们想存储比用户名和密码更多的用户信息（当然，大多数人都想这样做），该怎么办？我们将这些信息保存在哪里？当然，我们会将其保存在数据库中。这是否意味着我们将用户信息存储在两个地方？是的，没错，正如您所知，这是我们想要避免的；如果以后需要回头更改内容，这只会让我们的工作更加困难。\n\
  \n## 改进空间\n\n`Auth` 类的基本机制是可靠的，但它缺乏阻止任何严重入侵者所必需的更复杂的元素。\n\n最好实现一种机制，用于监控来自单个客户端的失败登录尝试次数。如果您的应用程序总是立即响应任何登录尝试，那么潜在的入侵者就有可能（可能使用自动化软件）在极短的时间内发出大量请求——使用不同的用户名和密码组合。解决方案是构建一个使用会话变量统计失败尝试次数的机制。\n\
  \n每当失败次数能被三整除时（例如，输入了三次错误密码），使用 PHP 的 `sleep` 函数将下一次尝试延迟，例如延迟十秒。您还可以决定，在达到某个阈值（例如\
  \ 15 次失败尝试）后，在给定时间段（例如一小时）内阻止来自该 IP 地址的所有进一步访问。当然，对于决心坚定的入侵者来说，更改 IP 地址很容易，但至少您可以拖延潜在的入侵者，也许还能让他们的生活变得足够困难，从而说服他们去其他地方进行恶意活动。\n\
  \n## 如何构建注册系统？\n\n拥有认证系统固然不错，但首先如何向其中填充用户呢？如果只有您自己和几个朋友访问您的网站，您可能可以通过数据库管理界面为所有用户创建账户。然而，对于一个旨在成为繁荣社区、允许任何人自由注册的网站，您很可能需要自动化这一过程。您希望允许访问者自行注册，但您可能也会进行一定程度的“筛选”，以便至少掌握一些关于注册用户的信息，例如确认其身份的方法。一种常见且有效的筛选方法是让注册者确认其电子邮件地址。\n\
  \n筛选机制的目的是让您能够阻止那些以某种方式“违反规则”并失去账户权限的用户创建新账户。您拥有他们的电子邮件地址，或者至少拥有他们的一个电子邮件地址——如果他们尝试使用该地址再次注册，您可以拒绝其访问。不过请注意：一种新型互联网服务正变得越来越流行。以\
  \ Mailinator 为首，这些服务为用户提供临时电子邮件地址，供其注册使用。当然，这意味着电子邮件并非万无一失的筛选机制，但它仍然是注册系统中值得添加的功能。\n\
  \n## 解决方案\n\n在这里，我们将构建一个注册系统，该系统通过电子邮件地址验证新注册者，并向他们发送一封电子邮件，要求他们通过 URL 确认注册。\n\n\
  注册系统是构建更多类的又一个绝佳机会！不过，这次会更有趣，因为我们将使用 [PEAR::HTML_QuickForm](http://pear.php.net/package/HTML_QuickForm/)\
  \ 包和 [PEAR::Mail_Mime](http://pear.php.net/package/Mail_Mime/) 来完成注册系统的部分工作。\n\n\
  其余部分将由我们构建的类来处理，但最终结果将易于您在自有应用程序中自定义和重用。\n\n首先，我们需要了解新用户注册的流程：\n\n- 用户填写注册表单。\n\
  - 用户完成表单后，注册系统在注册表中插入一条记录，并发送一封确认邮件。\n- 访问者点击邮件中的链接并确认账户。\n- 我们将详细信息从注册表复制到用户表。账户现在处于激活状态。\n\
  \n我们使用两个表来处理注册：这样，我们可以将“危险”或未验证的用户数据与“安全”或已确认的用户数据分开。您需要一个 cron 作业或类似定时任务来定期检查注册表，并删除任何超过（例如）24\
  \ 小时的条目。将表分开可以更轻松地清空注册表的内容（并避免不幸的错误），同时保持用户表精简，以便在用户认证期间不会对性能造成不必要的影响。\n\n我们的解决方案使用特定的数据库结构。以下是注册表的\
  \ SQL：`access_control.sql` *（摘录）*\n\n```sql\nCREATE TABLE signup (\n  signup_id\
  \     INT(11)       NOT NULL AUTO_INCREMENT,\n  login         VARCHAR(50)   NOT\
  \ NULL DEFAULT '',\n  password      VARCHAR(50)   NOT NULL DEFAULT '',\n  email\
  \         VARCHAR(50)   DEFAULT NULL,\n  firstName     VARCHAR(50)   DEFAULT NULL,\n\
  \  lastName      VARCHAR(50)   DEFAULT NULL,\n  signature     TEXT          NOT\
  \ NULL,\n```\n\n\n\n\n\n`confirm_code` `VARCHAR(40)` `NOT NULL` `DEFAULT ''`,\n\
  `created` `INT(11)` `NOT NULL` `DEFAULT '0'`,\n`PRIMARY KEY` (`signup_id`),\n`UNIQUE\
  \ KEY` `confirm_code` (`confirm_code`),\n`UNIQUE KEY` `user_login` (`login`),\n\
  `UNIQUE KEY` `email` (`email`)\n);\n\n## 访问控制\n\n以下是用户表的 SQL：\n\n`access_control.sql`（节选）\n\
  \n```sql\nCREATE TABLE user (\nuser_id INT(11) NOT NULL AUTO_INCREMENT,\nlogin VARCHAR(50)\
  \ NOT NULL DEFAULT '',\npassword VARCHAR(50) NOT NULL DEFAULT '',\nemail VARCHAR(50)\
  \ DEFAULT NULL,\nfirstName VARCHAR(50) DEFAULT NULL,\nlastName VARCHAR(50) DEFAULT\
  \ NULL,\nsignature TEXT NOT NULL,\nPRIMARY KEY (user_id),\nUNIQUE KEY user_login\
  \ (login)\n);\n```\n\n## SignUp 类\n\n我们解决方案的第一部分是 `SignUp` 类，它提供了注册新用户的所有功能，并使用以下配置设置：\n\
  \n`access_control.ini`（节选）\n\n```ini\n; Access Control Settings\n;user login table\
  \ details\n[users_table]\ntable=user\ncol_id=user_id\ncol_login=login\ncol_password=password\n\
  col_email=email\ncol_name_first=firstName\ncol_name_last=lastName\ncol_signature=signature\n\
  ;signup login table details\n[signup_table]\ntable=signup\ncol_id=signup_id\ncol_login=login\n\
  col_password=password\ncol_email=email\ncol_name_first=firstName\ncol_name_last=lastName\n\
  col_signature=signature\ncol_code=confirm_code\ncol_created=created\n```\n\n第一组设置代表数据库中用户表的详细信息——数据库名称及其列。第二组代表注册表的数据库和列名。\n\
  \n让我们定义一些自定义异常类，以便提供一致的错误处理级别：\n\n`Signup.class.php`（节选）\n\n```php\nclass SignUpException\
  \ extends Exception\n{\npublic function __construct($message = null, $code = 0)\n\
  {\nparent::__construct($message, $code);\nerror_log('Error in '.$this->getFile().\n\
  ' Line: '.$this->getLine().\n' Error: '.$this->getMessage()\n);\n}\n}\n\nclass SignUpDatabaseException\
  \ extends SignUpException {}\nclass SignUpNotUniqueException extends SignUpException\
  \ {}\nclass SignUpEmailException extends SignUpException {}\nclass SignUpConfirmationException\
  \ extends SignUpException {}\n```\n\n我们的基类 `SignUpException` 是一个自定义异常，确保使用 `error_log`\
  \ 函数记录异常详情。子类代表注册过程中可能出现的不同异常情况。这种错误处理实现方法确保所有异常都被一致地记录，并允许任何使用我们 `SignUp` 类的脚本实现自定义逻辑来处理各种类型的异常。我们很快就会看到如何在脚本中实现这样的逻辑。\n\
  \n我们从类属性开始定义 `SignUp` 类：\n\n`Signup.class.php`（节选）\n\n```php\nclass SignUp\n{\n\
  protected $db;\nprotected $cfg;\nprotected $from;\nprotected $to;\nprotected $subject;\n\
  protected $message;\nprotected $html;\nprotected $listener;\nprotected $confirmCode;\n\
  ```\n\n`$db` 将包含一个用于数据库连接的 `PDO` 实例，`$cfg` 将存储我们的配置细节，`$from` 将包含确认邮件中 `From` 字段使用的名称和地址，`$to`\
  \ 将包含邮件发送到的名称和地址，`$subject` 将包含邮件的主题，`$message` 将代表邮件的正文，`$html` 将包含一个 `true` 或\
  \ `false` 值，指示邮件是否为 HTML 邮件。`$listener` 属性将包含作为邮件确认链接列出的 URL，`$confirmCode` 将包含确认该特定用户注册所需的唯一代码。\n\
  \n`$to` 和 `$confirmCode` 属性由类内部设置和使用，而其余属性由类构造函数初始化：\n\n`Signup.class.php`（节选）\n\
  \n```php\npublic function __construct(PDO $db, $listener, $frmName, $frmAddress,\
  \ $subj, $msg, $html)\n{\n$this->db = $db;\n$this->cfg = parse_ini_file('access_control.ini',\
  \ TRUE);\n$this->listener = $listener;\n$this->from[$frmName] = $frmAddress;\n$this->subject\
  \ = $subj;\n$this->message = $msg;\n$this->html = $html;\n}\n```\n\n当我们在上面的构造函数中实例化对象时，需要传递一个包含数据库连接的\
  \ `PDO` 对象实例、注册者确认注册时应指向的 URL、用于注册邮件的发件人名称和 `From` 地址（例如 `Your Name <you@yoursite.com>`），以及邮件本身的主题和消息。最后，我们需要标识这是否是\
  \ HTML 邮件，以便 `PEAR::Mail_Mime` 能正确格式化消息。\n\n无论是否包含 HTML，消息中应至少包含一个特殊标签：`<confirm_url/>`。这作为消息中的占位符，标识邮件正文中应插入由\
  \ `SignUp` 类构建的确认 URL 的位置。\n\n`createCode` 方法在类内部调用，用于生成将通过邮件发送的确认码：\n\n`Signup.class.php`（节选）\n\
  \n```php\nprivate function createCode($login)\n{\nsrand((double)microtime() * 1000000);\n\
  $this->confirmCode = md5($login . time() . rand(1, 1000000));\n}\n```\n\n当提交注册表单时，`createSignup`\
  \ 方法会创建注册请求的记录。`createSignup` 方法接收用户通过注册表单提交的信息，检查数据库以确保用户名和电子邮件地址在用户表中不存在，然后将新记录插入注册表。让我们看看这个方法是如何工作的：\n\
  \n`Signup.class.php`（节选）\n\n```php\npublic function createSignup($userDetails)\n\
  {\n$user_table = $this->cfg['users_table']['table'];\n$user_login = $this->cfg['users_table']['col_login'];\n\
  $user_pass = $this->cfg['users_table']['col_password'];\n$user_email = $this->cfg['users_table']['col_email'];\n\
  $user_first = $this->cfg['users_table']['col_name_first'];\n$user_last = $this->cfg['users_table']['col_name_last'];\n\
  $user_sig = $this->cfg['users_table']['col_signature'];\n$sign_table = $this->cfg['signup_table']['table'];\n\
  $sign_login = $this->cfg['signup_table']['col_login'];\n$sign_pass = $this->cfg['signup_table']['col_password'];\n\
  $sign_email = $this->cfg['signup_table']['col_email'];\n$sign_first = $this->cfg['signup_table']['col_name_first'];\n\
  $sign_last = $this->cfg['signup_table']['col_name_last'];\n$sign_sig = $this->cfg['signup_table']['col_signature'];\n\
  $sign_code = $this->cfg['signup_table']['col_code'];\n$sign_created = $this->cfg['signup_table']['col_created'];\n\
  try\n{\n$sql = \"SELECT COUNT(*) AS num_row FROM \" . $user_table . \"\nWHERE \"\
  \ . $user_login . \"=:login OR \" . $user_email . \"=:email\";\n$stmt = $this->db->prepare($sql);\n\
  $stmt->bindParam(':login', $userDetails[$user_login]);\n$stmt->bindParam(':email',\
  \ $userDetails[$user_email]);\n$stmt->execute();\n$result = $stmt->fetch(PDO::FETCH_ASSOC);\n\
  }\ncatch (PDOException $e)\n{\nthrow new SignUpDatabaseException('Database error\
  \ when' .\n' checking user is unique: '.$e->getMessage());\n}\n```\n\n首先，我们将所有需要的配置设置分配给局部变量，以提高脚本的可读性。该方法执行的第一个操作是完成一个数据库查询：它统计用户表中提交的用户名与数据库中\
  \ `login` 列的值匹配，或提交的电子邮件地址与 `email` 列的值匹配的行数。我们将此操作包装在 `try {…} catch (PDOException\
  \ $e) {…}` 块中，以防抛出 `PDOException`。当捕获到 `PDOException` 时，我们会抛出一个为此类编写的自定义异常——`SignUpDatabaseException`。\n\
  \n`createSignup` 方法的下一步是检查查询结果，如果可以继续，则准备数据以插入注册表：\n\n\n\n\n\n### `Signup.class.php`（节选）\n\
  \n```\nif ($result['num_row'] > 0)\n{\n    throw new SignUpNotUniqueException(\n\
  \        'username and email address not unique');\n}\n$this->createCode($userDetails[$user_login]);\n\
  $toName = $userDetails[$user_first] . ' ' .\n    $userDetails[$user_last];\n$this->to[$toName]\
  \ = $userDetails[$user_email];\n```\n\n另一方面，如果结果不为 0，则表明我们已经拥有使用该用户名或电子邮件地址的用户，因此不能继续注册。我们的反应是抛出另一个自定义异常，这次是\
  \ `SignUpNotUniqueException`，以表示注册信息不唯一。\n\n`createSignup` 方法的最后一步是将新注册信息插入到注册表中：\n\
  \n### `Signup.class.php`（节选）\n\n```\ntry\n{\n    $sql = \"INSERT INTO \" . $sign_table\
  \ .\n        \"(\". $sign_login . \", \" . $sign_pass .\n        \", \" . $sign_email\
  \ . \", \" . $sign_first .\n        \", \" . $sign_last . \", \" . $sign_sig .\n\
  \        \", \" . $sign_code . \", \" . $sign_created . \") \".\n        \"VALUES\
  \ (:login, :password,\n        :email, :firstname, :lastname,\n        :signature,\
  \ :confirm, :time)\";\n    $stmt = $this->db->prepare($sql);\n    $stmt->bindParam(':login',\
  \ $userDetails[$user_login]);\n    $stmt->bindParam(':password', $userDetails[$user_pass]);\n\
  \    $stmt->bindParam(':email', $userDetails[$user_email]);\n    $stmt->bindParam(':firstname',\
  \ $userDetails[$user_first]);\n    $stmt->bindParam(':lastname', $userDetails[$user_last]);\n\
  \    $stmt->bindParam(':signature', $userDetails[$user_sig]);\n    $stmt->bindParam(':confirm',\
  \ $this->confirmCode);\n    $stmt->bindParam(':time', time());\n    $stmt->execute();\n\
  }\ncatch (PDOException $e)\n{\n    throw new SignUpDatabaseException('Database error\
  \ when' .\n        ' inserting into signup: '.$e->getMessage());\n}\n```\n\n`$userDetails`\
  \ 变量中的所有数据（即通过注册表单提交的详细信息）都被插入到注册表中。如果抛出 `PDOException`，我们会抛出一个新的 `SignUpDatabaseException`\
  \ 类实例。\n\n`sendConfirmation` 方法用于向刚注册的用户发送确认邮件：\n\n### `Signup.class.php`（节选）\n\n\
  ```\npublic function sendConfirmation()\n{\n    // Pear Mail_Mime included in the\
  \ calling script\n    $fromName = key($this->from);\n    $hdrs = array(\n      \
  \  'From' => $this->from[$fromName],\n        'Subject' => $this->subject\n    );\n\
  \    $crlf = \"\\n\";\n    if ($this->html)\n    {\n        $replace = '<a href=\"\
  ' . $this->listener . '?code=' .\n            $this->confirmCode . '\">' . $this->listener\
  \ .\n            '?code=' . $this->confirmCode . '</a>';\n    }\n    else\n    {\n\
  \        $replace = $this->listener . '?code=' . $this->confirmCode;\n    }\n  \
  \  $this->message = str_replace('<confirm_url/>', $replace,\n        $this->message\n\
  \    );\n    $mime = new Mail_mime($crlf);\n    $mime->setHTMLBody($this->message);\n\
  \    $mime->setTXTBody(strip_tags($this->message));\n    $body = $mime->get();\n\
  \    $hdrs = $mime->headers($hdrs);\n    $mail = Mail::factory('mail');\n    $succ\
  \ = $mail->send($this->to, $hdrs, $body);\n    if (PEAR::isError($succ))\n    {\n\
  \        throw new SignUpEmailException('Error sending confirmation' .\n       \
  \     ' email: ' .$succ->getDebugInfo());\n    }\n}\n```\n\n`sendConfirmation` 方法将通过替换特殊文本\
  \ `<confirm_url/>` 为确认 URL（用户需要点击该 URL 以确认注册）来生成确认邮件的内容（HTML 或纯文本）。确认 URL 使用类构造函数设置的\
  \ `$listener` 属性和 `confirmCode` 方法返回的唯一代码生成。然后，`sendConfirmation` 使用 `PEAR::Mail_mime`\
  \ 类的实例来创建并发送邮件。如果发送邮件时发生错误，将抛出另一个自定义异常 `SignUpEmailException`。我们还将使用 `PEAR_Error`\
  \ 对象的 `getDebugInfo` 方法来获取有关错误的一些信息。\n\n最后，`confirm` 方法用于通过邮件中发送的 URL 来检查确认信息：\n\
  \n### `Signup.class.php`（节选）\n\n```\npublic function confirm($confirmCode)\n{\n\
  \    $user_table = $this->cfg['users_table']['table'];\n    $user_login = $this->cfg['users_table']['col_login'];\n\
  \    $user_pass = $this->cfg['users_table']['col_password'];\n    $user_email =\
  \ $this->cfg['users_table']['col_email'];\n    $user_first = $this->cfg['users_table']['col_name_first'];\n\
  \    $user_last = $this->cfg['users_table']['col_name_last'];\n    $user_sig = $this->cfg['users_table']['col_signature'];\n\
  \    $sign_table = $this->cfg['signup_table']['table'];\n    $sign_id = $this->cfg['signup_table']['col_id'];\n\
  \    $sign_login = $this->cfg['signup_table']['col_login'];\n    $sign_pass = $this->cfg['signup_table']['col_password'];\n\
  \    $sign_email = $this->cfg['signup_table']['col_email'];\n    $sign_first = $this->cfg['signup_table']['col_name_first'];\n\
  \    $sign_last = $this->cfg['signup_table']['col_name_last'];\n    $sign_sig =\
  \ $this->cfg['signup_table']['col_signature'];\n    $sign_code = $this->cfg['signup_table']['col_code'];\n\
  \    try\n    {\n        $sql = \"SELECT * FROM \" . $sign_table . \"\n        \
  \    WHERE \" . $sign_code . \"=:confirmCode\";\n        $stmt = $this->db->prepare($sql);\n\
  \        $stmt->bindParam(':confirmCode', $confirmCode);\n        $stmt->execute();\n\
  \        $row = $stmt->fetchAll();\n    }\n    catch (PDOException $e)\n    {\n\
  \        throw new SignUpDatabaseException('Database error when' .\n           \
  \ ' inserting user info: '.$e->getMessage());\n    }\n}\n```\n\n同样，我们将配置设置赋值给局部变量，以提高脚本的可读性。首先，`confirm`\
  \ 方法从注册表中选择所有 `confirm_code` 列的值与 `$confirmCode` 值匹配的记录。\n\n如果返回的记录数不是 1，则说明出现了问题，并抛出\
  \ `SignUpConfirmationException` 异常：\n\n### `Signup.class.php`（节选）\n\n```\nif (count($row)\
  \ != 1) {\n    throw new SignUpConfirmationException(count($row) .\n        ' records\
  \ found for confirmation code: ' .\n        $confirmCode\n    );\n}\n```\n\n如果只找到一条匹配记录，该方法可以继续处理确认：\n\
  \n### `Signup.class.php`（节选）\n\n```\ntry\n{\n    // Copy the data from Signup to\
  \ User table\n    $sql = \"INSERT INTO \" . $user_table . \" (\n        \" . $user_login\
  \ . \", \" . $user_pass . \",\n        \" . $user_email . \", \" . $user_first .\
  \ \",\n        \" . $user_last . \", \" . $user_sig . \") VALUES (\n        :login,\
  \ :pass, :email, :firstname, :lastname, :sign )\";\n    $stmt = $this->db->prepare($sql);\n\
  \    $stmt->bindParam(':login',$row[0][$sign_login]);\n    $stmt->bindParam(':pass',$row[0][$sign_pass]);\n\
  \    $stmt->bindParam(':email',$row[0][$sign_email]);\n    $stmt->bindParam(':firstname',$row[0][$sign_first]);\n\
  \    $stmt->bindParam(':lastname',$row[0][$sign_last]);\n    $stmt->bindParam(':sign',$row[0][$sign_sig]);\n\
  \    $stmt->execute();\n    $result = $stmt->fetch();\n    // Delete row from signup\
  \ table\n    $sql = \"DELETE FROM \" . $sign_table . \"\n        WHERE \" . $sign_id\
  \ . \"= :id\";\n    $stmt = $this->db->prepare($sql);\n    $stmt->bindParam(':id',\
  \ $row[0][$sign_id]);\n    $stmt->execute();\n}\ncatch (PDOException $e)\n{\n  \
  \  throw new SignUpDatabaseException('Database error when' .\n        ' inserting\
  \ user info: '.$e->getMessage());\n}\n```\n\n如果账户成功确认，记录将被复制到用户表中，并从注册表中删除旧记录。至此，确认过程、用户注册以及我们的\
  \ `SignUp` 类就完成了！\n\n### 注册页面\n\n现在我们的 `SignUp` 类已经完成，我们需要一个网页来显示注册表单并运行该过程。第一步是包含我们将要使用的类：\n\
  \n### `signup.php`（节选）\n\n```\n<?php\nerror_reporting(E_ALL);\nrequire_once 'SignUp.class.php';\n\
  require_once 'HTML/QuickForm.php';\nrequire_once 'Mail.php';\nrequire_once 'Mail/mime.php';\n\
  require 'dbcred.php';\n```\n\n首先，由于我们使用的是 PEAR 包，在 PHP 5 下会导致 `E_Strict` 错误，因此我们使用\
  \ `error_reporting` 函数将错误报告级别设置为 `E_ALL`。当然，我们需要包含我们的 `SignUp` 类文件。我们还将使用 PEAR 的\
  \ `HTML_Quickform` 和 `Mail_mime` 包。`dbcred.php` 文件包含连接数据库所需的数据库凭据。\n\n接下来，我们创建所需的变量：\n\
  \n\n\n\n\n### `signup.php` *（节选）*\n\n```php\n$reg_messages = array(\n\n'success'\
  \ => array(\n\n'title' => 'Confirmation Successful',\n\n'content' => '<p>Thank you.\
  \ Your account has now been' .\n\n' confirmed.<br />You can now <a href=\"access.php\"\
  >login' .\n\n'</a></p>'\n\n),\n\n'confirm_error' => array(\n\n'title' => 'Confirmation\
  \ Problem',\n\n'content' => '<p>There was a problem confirming your' .\n\n' account.<br\
  \ />Please try again or contact the site ' .\n\n'administrators</p>'\n\n),\n\n'email_sent'\
  \ => array(\n\n'title' => 'Check your email',\n\n'content' => '<p>Thank you. Please\
  \ check your email to ' .\n\n'confirm your account</p>'\n\n),\n\n'email_error' =>\
  \ array(\n\n'title' => 'Email Problem',\n\n310\n\nThe PHP Anthology\n\n'content'\
  \ => '<p>Unable to send confirmation email.<br />' .\n\n'Please contact the site\
  \ administrators.</p>'\n\n),\n\n'signup_not_unique' => array(\n\n'title' => 'Registration\
  \ Problem',\n\n'content' => '<p>There was an error creating your' .\n\n' account.<br\
  \ />The desired username or email address has' .\n\n' already been taken.</p>'\n\
  \n),\n\n'signup_error' => array(\n\n'title' => 'Registration Problem',\n\n'content'\
  \ => '<p>There was an error creating your' .\n\n' account.<br />Please contact the\
  \ site administrators.' .\n\n'</p>'\n\n)\n\n);\n\n$listener = 'http://localhost/phpant2/chapter_10/examples/'\
  \ .\n\n'signup.php';\n\n$frmName = 'Your Name';\n\n$frmAddress = 'noreply@yoursite.com';\n\
  \n$subj = 'Account Confirmation';\n\n$msg = <<<EOD\n\n<html>\n\n<body>\n\n<h2>Thank\
  \ you for registering!</h2>\n\n<div>The final step is to confirm\n\nyour account\
  \ by clicking on:</div>\n\n<div><confirm_url/></div>\n\n<div>\n\n<b>Your Site Team</b>\n\
  \n</div>\n\n</body>\n\n</html>\n\nEOD;\n```\n\n`$reg_messages` 变量包含一个页面标题和消息的数组，这些消息将根据注册过程的阶段和状态在网页中使用。\n\
  \n`$listener`、`$frmName`、`$frmAddress`、`$subj` 和 `$msg` 是我们的 `Signup` 类所需的变量。如果你查看\
  \ `$msg` 变量（确认邮件的正文），你会看到特殊的 `<confirm_url/>` 代码，它将在后续过程中被确认 URL 替换。\n\n## 访问控制\n\
  \n311\n\n`$listener` 变量存储了确认代码应提交到的脚本的绝对 URL。在我们的示例脚本中，它指向自身。此变量设置为反映我们测试环境的文件夹结构，因此请确保更改此变量以适合您自己的设置。\n\
  \n下一步是设置数据库连接并实例化我们的 `SignUp` 对象：\n\n### `signup.php` *（节选）*\n\n```php\ntry\n\n\
