  \ `PEAR::Mail` 包。接着，我们使用静态方法 `Mail::factory` 来实例化一个能够发送邮件的 `Mail` 对象。我们向工厂方法传入参数\
  \ `'mail'`，表示希望使用 PHP 内置的 `mail` 函数。然后，我们创建一个数组来存放希望在邮件中包含的头部信息，最后调用 `Mail->send`\
  \ 方法，传入收件人的邮箱地址、头部数组以及邮件正文。\n\n`Mail->send` 方法在成功时返回 `true`，失败时返回一个 `PEAR_Error`\
  \ 对象。我们可以使用 `PEAR::IsError` 方法来检测是否存在错误，并据此采取相应操作。\n\n## 注意 E_STRICT 错误\n\n`PEAR::Mail`\
  \ 包最初是为 PHP 4 开发的。如果在 PHP 5 中启用了 `E_STRICT` 错误，你会收到 `E_STRICT` 错误。在上面的例子以及后续的例子中，我们使用\
  \ `error_reporting` 函数将报告的错误级别设置为 `E_ALL`，从而避免在 PHP 5 中出现 `E_STRICT` 错误。\n\n## 讨论\n\
  \n`mail` 函数可以与本地的 `sendmail` 客户端（一种广泛用于 Unix 系统的邮件应用程序）集成，如果你没有兼容 `sendmail` 的客户端，也可以与远程\
  \ SMTP（简单邮件传输协议）服务器集成。你的网络托管服务商应该能够提供相关的 SMTP 服务器详细信息，供你在脚本中使用。不过，如果你在 Windows 开发环境中使用，则需要通过修改\
  \ `php.ini` 中的以下设置来告诉 PHP 应该使用哪个 SMTP 服务器发送邮件：\n\n182\n\nPHP 文集\n\n```\n[mail function]\n\
  ; For Win32 only.\nSMTP = smtp.yourdomain.com\nsmtp_port = 25\nsendmail_from = you@yourdomain.com\n\
  ```\n\n这里，我们将 `SMTP` 设置设为 SMTP 服务器的域名，在绝大多数情况下，这将是你的 ISP 提供的 SMTP 服务器。我们还将 `smtp_port`\
  \ 设置设为相应的服务器端口号（默认是 25）。`sendmail_from` 设置代表你邮件的发送地址。\n\n你可能想要发送的大多数邮件可能并不像我们这里处理的那么简单。即使你想保持邮件简单，只使用纯文本，当你开始添加额外的头部、编写更长的消息以及包含附件时，事情也会变得有点复杂。\n\
  \n这里介绍的第二种解决方案比第一种（只使用了一行 PHP 代码）使用了更多的代码，但作为额外代码的交换，我们获得了更多的灵活性，并且在创建更复杂的邮件时会发现系统更容易使用。因此，接下来的示例将使用\
  \ `PEAR` 包中提供的各种类。\n\n## 如何简化复杂邮件的生成？\n\n使用 `mail` 函数对于简单消息来说没问题，但当你尝试创建更复杂的邮件时，它的局限性就变得明显了。例如，你可能希望自己的邮箱地址出现在邮件的\
  \ `From` 字段中，希望在地址旁边添加人名，希望将邮件抄送（CC）给多个收件人，或者希望将邮件发送到不同的 SMTP 服务器。在这些情况下，你需要比 `mail`\
  \ 更强大的工具来完成工作。\n\n这时，`PEAR::Mail` 和 `PEAR::Mail_Mime` 类就派上用场了。2 这些类为 `mail` 函数提供了大量额外功能，例如能够包含附件、创建\
  \ HTML 和混合格式的邮件、完全绕过 `mail` 函数，以及直接连接到 SMTP 服务器。这些类还提供了一个 API，使得构建更复杂的邮件变得非常容易。\n\
  \n2 参见 Mail 包文档：http://pear.php.net/manual/en/package.mail.mail.php，以及 Mail_Mime\
  \ 文档：http://pear.php.net/manual/en/package.mail.mail-mime.php。\n\n邮件\n\n183\n\n\
  ## 解决方案\n\n以下代码使用指定的 SMTP 服务器发送邮件：`pearMailSMTP.php` *(摘录)*\n\n```php\n<?php\nerror_reporting(E_ALL);\n\
  require 'Mail.php';\n\n$mail = Mail::factory('smtp', array('host'=>'smtp.mydomain.com'));\n\
  $hdrs = array(\n    'From'    => 'Me <me@mydomain.com>',\n    'CC'      => 'Mr Example\
  \ <example@exampledomain.com>',\n    'Subject' => 'Howdy'\n);\n$body = 'Glad to\
  \ meet you.';\n$succ = $mail->send('you@yourdomain.com', $hdrs, $body);\nif (PEAR::isError($succ))\n\
  {\n    echo 'Email sending failed: ' . $succ->getMessage();\n}\nelse\n{\n    echo\
  \ 'Email sent succesfully';\n}\n?>\n```\n\n## 讨论\n\n得益于 `PEAR::Mail` 类，我们不再局限于使用\
