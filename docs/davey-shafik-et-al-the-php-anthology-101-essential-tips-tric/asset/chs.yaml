  \ 讨论\n\n现在您已经知道如何允许用户更改密码，那么更改其他账户设置（如名字、姓氏和签名）应该也不成问题——只需将详细信息添加到 `AccountMaintenance`\
  \ 类即可。如果您希望允许用户更改电子邮件地址，则需要检查之前“如何构建注册系统？”中使用的注册流程，并修改 `SignUp` 类。您应确保用户在更改电子邮件地址之前确认新地址。\n\
  \n访问控制\n\n339\n\n### 如何构建权限系统？\n\n在前面的章节中，我们构建了一个为网站提供全局安全性的身份验证系统。但是，请考虑一下：您网站的所有成员都平等吗？\n\
  \n例如，您可能不希望所有用户都有权编辑和删除文章。为了解决这个问题，您需要在安全系统中添加更多功能，允许您为成员组分配权限，仅允许这些用户执行特定操作。\n\n\
  \n\n\n与其将权限分配给单个账户（这很快就会成为管理上的噩梦），我们将基于*用户*、*组*和*权限*来构建一个权限系统。用户（登录账户）将被分配到组中，这些组会有诸如管理员、作者、经理等名称。权限反映了用户被允许在网站内执行的操作，它们也将被分配给组。从管理角度来看，这个系统易于管理，因为查看特定组拥有哪些权限，以及哪些用户被分配到该组，将是一件简单的事情。\n\
  \n这种访问控制被称为**基于角色的访问控制**。如果你想了解更多关于基于角色的访问控制的理论，美国政府国家标准与技术研究院的网站上有完整的章节介绍。¹¹\n\n\
  ## 解决方案\n\n让我们开始构建我们的权限系统。\n\n## 设置数据库\n\n构建权限系统首先需要在数据库表之间建立多对多关系。具体说明如下：\n\n-\
  \ 一个用户可以属于多个组。\n- 一个组可以有多个用户。\n- 一个权限可以分配给多个组。\n- 一个组可以有多个权限。\n\n¹¹ http://csrc.nist.gov/rbac/\n\
  \n在实际操作中，在 MySQL 中构建多对多关系的方法是使用**桥接表**，该表关联另外两个表。桥接表存储一个两列索引，每一列是其中一个关联表的主键。例如，我们的数据库中有一个用户表和一个集合表。以下是这些表的\
  \ SQL：\n\n**access_control.sql *(摘录)***\n\n```sql\nCREATE TABLE user (\n  user_id\
  \       INT(11)      NOT NULL AUTO_INCREMENT,\n  login         VARCHAR(50)  NOT\
  \ NULL DEFAULT '',\n  password      VARCHAR(50)  NOT NULL DEFAULT '',\n  email \
  \        VARCHAR(50)  DEFAULT NULL,\n  firstName     VARCHAR(50)  DEFAULT NULL,\n\
  \  lastName      VARCHAR(50)  DEFAULT NULL,\n  signature     TEXT         NOT NULL,\n\
  \  PRIMARY KEY (user_id),\n  UNIQUE KEY user_login (login)\n);\n\nCREATE TABLE collection\
  \ (\n  collection_id INT(11)      NOT NULL auto_increment,\n  name          VARCHAR(50)\
  \  NOT NULL default '',\n  description   TEXT         NOT NULL,\n  PRIMARY KEY (collection_id)\n\
  );\n```\n\n每个用户都有一个唯一的 ID 和登录名，以及与其记录关联的其他几条信息。每个组都有一个唯一的 ID、一个名称和一个描述。我们将使用一个桥接表来将用户链接到他们的组，以及将组链接到他们的用户。\n\
  \n以下是 `user2collection` 查找表的定义：\n\n**access_control.sql *(摘录)***\n\n```sql\nCREATE\
  \ TABLE user2collection (\n  user_id       INT(11) NOT NULL default '0',\n  collection_id\
  \ INT(11) NOT NULL default '0',\n  PRIMARY KEY (user_id, collection_id)\n);\n```\n\
  \n![Image 109](img/index-363_1.jpg)\n\n![Image 110](img/index-363_2.png)\n\n注意，该表的主键使用了*两列*：这确保了\
  \ `user_id` 和 `collection_id` 的任何组合都不会出现多次。\n\n## 注意保留字\n\n我在 MySQL 中使用“collection”来指代“group”。“Group”是\
  \ SQL 中的保留字，因此不应将其用作表名。从技术上讲，通过适当的引号是可以使用的，但何必冒混淆我们自己——以及可能混淆 MySQL 的风险呢？\n\n你可以在\
  \ MySQL 网站上找到更多关于 SQL 保留字的信息。¹²\n\n以下是一些假设数据，展示了桥接表的使用方式：\n\n```sql\nmysql> select\
  \ * from user2collection;\n+---------+---------------+\n| user_id | collection_id\
  \ |\n+---------+---------------+\n|       1 |             1 |\n|       2 |     \
  \        1 |\n|       2 |             2 |\n|       3 |             1 |\n|      \
  \ 4 |             1 |\n+---------+---------------+\n5 rows in set (0.00 sec)\n```\n\
  \n这些数据告诉我们，用户 1 是组 1 的成员，用户 2 是组 1 和组 2 的成员，用户 3 是组 1 的成员，以此类推。\n\n我们还需要一个权限表来跟踪权限：\n\
  \n**access_control.sql *(摘录)***\n\n```sql\nCREATE TABLE permission (\n  permission_id\
  \ INT(11)      NOT NULL AUTO_INCREMENT,\n  name          VARCHAR(50)  NOT NULL DEFAULT\
  \ '',\n  description   TEXT         NOT NULL,\n  PRIMARY KEY (permission_id)\n);\n\
  ```\n\n¹² http://dev.mysql.com/doc/refman/4.1/en/reserved-words.html\n\n每个权限都有一个唯一的\
  \ ID、一个名称和一个描述。权限名称将代表操作；例如，查看、创建、编辑和删除。我们需要一个桥接表来将组链接到权限——以下是 `collection2permission`\
  \ 表：\n\n**access_control.sql *(摘录)***\n\n```sql\nCREATE TABLE collection2permission\
  \ (\n  collection_id INT(11) NOT NULL DEFAULT '0',\n  permission_id INT(11) NOT\
  \ NULL DEFAULT '0',\n  PRIMARY KEY (collection_id, permission_id)\n);\n```\n\n定义了查找表之后，我们现在可以跨表执行查询，以识别特定用户被允许的权限。例如，以下查询返回\
  \ `user_id` 为 1 的用户的所有权限名称：\n\n```sql\nSELECT p.name as permission\nFROM\n  user2collection\
  \ uc,\n  INNER JOIN collection2permission cp\n    ON uc.collection_id = cp.collection_id\n\
  \  INNER JOIN permission p\n    ON cp.collection_id = p.collection_id\nWHERE uc.user_id\
  \ = 1;\n```\n\n注意，我为表名使用了别名，例如 `user2collection uc`，以便更容易编写查询。\n\n如果你已经下载并安装了本章引言中提到的示例\
  \ `access_control` 数据库，你会发现它包含三个示例用户账户，详细信息如表 10.1 所示。\n\n**表 10.1. 示例用户账户**\n\n\
  **登录名** **密码** **组**\n\njackblack password 用户\n\njackwhite password 编辑\n\nsiteadmin\
  \ password 管理员\n\n`access_control` 数据库还包含三个示例组，如表 10.2 所示。\n\n**表 10.2. 示例组**\n\n\
  **组** **权限**\n\n用户 查看\n\n编辑 查看、创建、编辑\n\n管理员 查看、创建、编辑、删除\n\n## 用户类\n\n`User` 类将封装检查用户权限的所有功能。我们的类使用以下配置设置：\n\
  \n**access_control.ini *(摘录)***\n\n```ini\n; Access Control Settings\n;web form\
  \ variables e.g. $_POST['login']\n[login_vars]\nlogin=login\n\n;user login table\
  \ details\n[users_table]\ntable=user\ncol_id=user_id\ncol_login=login\ncol_password=password\n\
  col_email=email\ncol_name_first=firstName\ncol_name_last=lastName\ncol_signature=signature\n\
  \n;Permission table details\n[permission_table]\ntable=signup\ncol_id=permission_id\n\
  col_name=name\n\n;Collection table details\n[collection_table]\ntable=collection\n\
  col_id=collection_id\ncol_name=name\n\n;User to Collection lookup table details\n\
  [user_to_collection_table]\ntable=user2collection\ncol_id=user_id\ncol_collection_id=collection_id\n\
  \n;Collection to Permission lookup table details\n[collection_to_permission_table]\n\
  table=collection2permission\ncol_id=collection_id\ncol_permission_id=permission_id\n\
  ```\n\n我们定义了一些自定义异常类，以提供一致级别的错误处理：\n\n**User.class.php *(摘录)***\n\n```php\nclass\
  \ UserException extends Exception\n{\n  public function __construct($message = null,\
  \ $code = 0)\n  {\n    parent::__construct($message, $code);\n    error_log('Error\
  \ in '.$this->getFile().\n              ' Line: '.$this->getLine().\n          \
  \    ' Error: '.$this->getMessage()\n    );\n  }\n}\n\nclass UserDatabaseException\
  \ extends UserException {}\n```\n\n我们的基类 `UserException` 是一个自定义异常，它确保异常详情通过 `error_log`\
  \ 函数记录。子类 `UserDatabaseException` 表示数据库问题。如果你要向 `User` 类添加更多功能，可以基于 `UserException`\
  \ 类创建更多的自定义异常，以覆盖所有可能的异常情况。\n\n我们通过定义一些类属性来开始创建该类：\n\n**User.class.php *(摘录)***\n\
  \n```php\nclass User\n{\n  private $db;\n  protected $cfg;\n  private $userId;\n\
  \  private $firstName;\n  private $lastName;\n  private $email;\n```\n\n\n\n\n\n\
  `$db` 将包含一个用于数据库连接的 `PDO` 实例，`$cfg` 将存储我们的配置细节，其余属性将包含来自用户账户信息的数据。\n\n构造函数接收一个 `PDO`\
  \ 类的实例，加载配置文件，并调用 `populate()` 方法：\n\n`User.class.php`（节选）\n```\npublic function\
  \ __construct(PDO $db)\n{\n    $this->db = $db;\n    $this->cfg = parse_ini_file('access_control.ini',\
  \ TRUE);\n    $this->populate();\n}\n```\n\n接下来是 `populate()` 方法：\n\n`User.class.php`（节选）\n\
  ```\nprivate function populate()\n{\n    $var_login = $this->cfg['login_vars']['login'];\n\
  \    $user_table = $this->cfg['users_table']['table'];\n    $user_id = $this->cfg['users_table']['col_id'];\n\
  \    $user_login = $this->cfg['users_table']['col_login'];\n    $user_email = $this->cfg['users_table']['col_email'];\n\
  \    $user_first = $this->cfg['users_table']['col_name_first'];\n    $user_last\
  \ = $this->cfg['users_table']['col_name_last'];\n```\n\n我们将一些配置值加载到局部变量中，以提高代码的可读性。\n\
  \n接下来，我们尝试在数据库中查找用户的详细信息：\n\n`User.class.php`（节选）\n```\n$session = new Session();\n\
  try\n{\n    $sql = \"SELECT\n            \" . $user_id . \", \" . $user_email .\
  \ \",\n            \" . $user_first . \", \" . $user_last . \"\n            FROM\n\
  \            \" . $user_table . \"\n            WHERE\n            \" . $user_login\
  \ . \" = :login\";\n    $stmt = $this->db->prepare($sql);\n    $login = $session->get($var_login);\n\
  \    $stmt->bindParam(':login', $login);\n    $stmt->execute();\n    $row = $stmt->fetch(PDO::FETCH_ASSOC);\n\
  }\ncatch(PDOException $e)\n{\n    throw new UserDatabaseException('Database error\
  \ when' .\n        ' populating user details: '.$e->getMessage());\n}\n```\n\n我们首先需要实例化一个新的会话对象（我们在“如何创建会话类？”中构建了它）。然后使用会话登录变量作为键，在用户表中查找用户的详细信息。如果抛出\
  \ `PDOException`，我们将抛出自定义的 `UserDatabaseException`。\n\n一旦我们从数据库中检索到用户记录，我们将所有详细信息存储在\
  \ `User` 对象的属性中：\n\n`User.class.php`（节选）\n```\n$this->userId = $row[$user_id];\n\
  $this->email = $row[$user_email];\n$this->firstName = $row[$user_first];\n$this->lastName\
  \ = $row[$user_last];\n}\n```\n\n`populate()` 从数据库中提取该用户的记录，并将该记录中的各种有用信息存储在对象的变量中，以便我们可以轻松访问它们；例如，当我们想在页面上显示用户名时。最重要的方面是从数据库中获取\
  \ `user_id` 值，以便检查权限。\n\n我们还添加了一些访问器方法。访问器方法允许公共访问原本受保护的对象属性——它们允许读取属性，而不授予类的用户公共写入权限：\n\
  \n`User.class.php`（节选）\n```\npublic function getId()\n{\n    return $this->userId;\n\
  }\n\npublic function getFirstName()\n{\n    return $this->firstName;\n}\n\npublic\
  \ function getLastName()\n{\n    return $this->lastName;\n}\n\npublic function getEmail()\n\
  {\n    return $this->email;\n}\n```\n\n最后，我们添加 `checkPermission()` 方法。该方法接受一个命名权限作为参数，并检查用户是否拥有该权限：\n\
  \n`User.class.php`（节选）\n```\npublic function checkPermission($permission)\n{\n \
  \   if (!isset($this->permissions))\n    {\n        $perm_table = $this->cfg['permission_table']['table'];\n\
  \        $perm_id = $this->cfg['permission_table']['col_id'];\n        $perm_name\
  \ = $this->cfg['permission_table']['col_name'];\n        $u2c_table = $this->cfg['user_to_collection_table']['table'];\n\
  \        $u2c_id = $this->cfg['user_to_collection_table']['col_id'];\n        $c2p_table\
  \ = $this->cfg['collection_to_permission_table']['table'];\n        $c2p_id = $this->cfg['collection_to_permission_table']['col_id'];\n\
  \        $c2p_pid = $this->cfg['collection_to_permission_table']['col_permission_id'];\n\
  ```\n\n我们首先检查该用户的权限数组是否已设置。如果没有，则继续进行数据库查找。不过，在执行查找之前，我们将一些配置设置分配给局部变量，以帮助提高代码的可读性。\n\
  \n接下来，我们组装 SQL 查询，并使用 `User->userId` 属性作为键执行查找：\n\n`User.class.php`（节选）\n```\ntry\n\
  {\n    $this->permissions = array();\n    $this->permissions = array();\n    $sql\
  \ = 'SELECT p.'. $perm_name .' as perm\n            FROM\n            ' . $u2c_table\
  \ . ' uc\n            INNER JOIN ' . $c2p_table . ' cp\n            ON uc.' . $u2c_id\
  \ . ' = cp.' . $c2p_id . '\n            INNER JOIN ' . $perm_table . ' p\n     \
  \       ON cp.' . $c2p_pid . ' = p.' . $perm_id . '\n            WHERE uc.user_id\
  \ =:user';\n    $stmt = $this->db->prepare($sql);\n    $stmt->bindParam(':user',\
  \ $this->userId);\n    $stmt->execute();\n    while ($row = $stmt->fetch(PDO::FETCH_ASSOC))\n\
  \    {\n        $this->permissions[] = $row['permission'];\n    }\n}\ncatch(PDOException\
  \ $e)\n{\n    throw new UserDatabaseException('Database error when' .\n        '\
  \ checking permissions: '.$e->getMessage());\n}\n}\n```\n\n如果查找返回了数据库行，我们将它们存储在对象\
  \ `User->permissions` 属性数组中。这意味着如果我们需要在页面上多次检查权限，那么该检查只会花费一次查询的成本。并且，像往常一样，如果抛出\
  \ `PDOException`，我们会转而抛出自定义的 `UserDatabaseException`。\n\n最后，我们检查作为参数传入方法的 `$permission`\
  \ 变量中的权限是否包含在用户的权限数组中：\n\n`User.class.php`（节选）\n```\nif (in_array($permission, $this->permissions))\n\
  {\n    return true;\n}\nelse\n{\n    return false;\n}\n}\n}\n```\n\n`checkPermission()`\
  \ 如果用户拥有该权限则返回 `true`，否则返回 `false`。\n\n### 权限测试页面\n\n现在，为了测试我们的权限系统，我们可以构建一个权限测试页面。该测试页面将要求您使用用户表中某个账户的详细信息登录，并模拟尝试访问权限表中定义的四个权限级别之一——查看、创建、编辑和删除。\n\
  \n首先，我们需要包含所有必需的类和数据库凭据文件：\n\n`permissions.php`（节选）\n```\n<?php\nrequire_once 'Session.class.php';\n\
  require_once 'Auth.class.php';\nrequire_once 'User.class.php';\nrequire_once 'dbcred.php';\n\
  ```\n\n接下来，我们实例化 `PDO`、`Auth`（我们在“如何创建一个控制站点某部分访问权限的类？”中见过它）和 `User` 对象：\n\n`permissions.php`（节选）\n\
  ```\ntry\n{\n    $db = new PDO($dsn, $user, $password);\n    $auth = new Auth($db,\
  \ 'login.php', 'secret');\n    $authuser = new User($db);\n```\n\n`Auth` 对象将确保当前用户已授权，如果未授权则将其重定向到登录表单。如果用户已授权，我们创建一个\
  \ `User` 对象，以便能够检查用户的权限。\n\n我们通过查询字符串变量 `$_GET['view']` 来模拟权限：\n\n`permissions.php`（节选）\n\
  ```\nswitch (@$_GET['view']) {\n    case 'create':\n        $permission = 'create';\n\
  \        $msg = 'You are able to create new content.';\n        break;\n    case\
  \ 'edit':\n        $permission = 'edit';\n        $msg = 'You are able to edit existing\
  \ content.';\n        break;\n    case 'delete':\n        $permission = 'delete';\n\
  \        $msg = 'You are able to delete existing content.';\n        break;\n  \
  \  default:\n        $permission = 'view';\n        $msg = 'You are able to read\
  \ existing content.';\n}\n```\n\n我们设置权限级别和 `$msg` 变量（页面上显示的消息），以反映 `$_GET['view']`\
  \ 的值。\n\n接下来，我们测试用户的权限：\n\n`permissions.php`（节选）\n```\nif (!$authuser->checkPermission($permission))\
  \ {\n    $msg = 'You do not have permission to do this.';\n}\n```\n\n\n\n\n如果用户没有所需的权限，我们会采取适当的措施。由于此演示仅是一个测试，我们只是设置页面消息来指示用户没有所需的权限级别。在生产环境的\
  \ Web 应用中，你会将用户重定向到登录表单，并添加一条消息，表明他们无权获得该级别的访问权限。\n\n最后，我们确保捕获所有异常并采取适当的措施：\n\n\
  ### permissions.php *(摘录)*\n\n```\n}\ncatch (Exception $e)\n{\n    $msg = 'An error\
  \ has occurred: ' . $e->getMessage();\n}\n?>\n```\n\n剩下的唯一任务是创建用于权限测试页面的 HTML：\n\
  \n352\n\nPHP 文集\n\n### permissions.php *(摘录)*\n\n```\n<!DOCTYPE html public \"-//W3C//DTD\
  \ XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n⋮ *HTML 头部内容…*\n</head>\n\
  <body>\n<h1>权限测试</h1>\n<p>\n<a href=\"<?php echo $_SERVER['PHP_SELF']; ?>\">查看</a>\
  \ |\n<a href=\"<?php echo $_SERVER['PHP_SELF'];\n?>?view=create\">创建</a> |\n<a href=\"\
  <?php echo $_SERVER['PHP_SELF'];\n?>?view=edit\">编辑</a> |\n<a href=\"<?php echo\
  \ $_SERVER['PHP_SELF'];\n?>?view=delete\">删除</a>\n</p>\n<h2><?php echo $authuser->getFirstName()\
  \ . ' ' .\n$authuser->getLastName(); ?></h2>\n<p>权限级别: '<?php echo $permission ?>'</p>\n\
  <p><?php echo $msg; ?></p>\n</body>\n</html>\n```\n\n测试页面非常简单。首先，我们有一个链接菜单，通过向链接\
  \ URL 附加适当的查询字符串来测试每个权限级别。然后，页面主体包含当前用户的姓名、当前权限级别以及权限测试设置的消息。\n\n## 讨论\n\n`User`\
  \ 类基于“按需了解”的原则获取数据。也就是说，尽管某些用户数据在实例化时通过 `populate` 方法获取，但每次实例化 `User` 类时可能并不需要权限相关的数据。\n\
  \n我们很可能只在受限的页面上检查权限，因此当用户浏览公共页面时，可以节省一次数据库查询，只在需要时才调用 `checkPermission` 方法。这种仅在需要时从数据库获取数据的方法（而不是一开始就执行所有查询）被称为**懒加载**，这是一种减少不必要查询和性能开销的有效方法。\n\
  \n访问控制\n\n353\n\n当然，权限测试页面只是一个简单的示例，但你可以以任何你喜欢的方式使用 `checkPermission` 方法——例如在 `if`\
  \ 语句中决定用户允许做什么和看什么。另一种方法是使用一个变量（比如我们这里使用的 `$msg` 变量）来存储一个 PHP 脚本的名称，该脚本包含受限内容，以便与\
  \ `include` 语句一起使用。\n\n除此之外，就是这样了。现在，你只需要构建一个管理界面来控制用户、组和权限。那么，你还在等什么呢？\n\n## 如何将会话存储在数据库中？\n\
  \n如前文“如何使用会话？”中所述，PHP 在服务器端的默认会话行为是创建一个临时文件来存储会话数据。这个文件通常保存在操作系统的临时目录中，因此会给你的应用程序带来安全风险，尤其是在使用共享服务器时。\n\
  \n## 解决方案\n\n使用 PHP 函数 `session_set_save_handler` 来指定一个自定义会话处理器，该处理器提供一个完全由你控制的替代数据存储。`session_set_save_handler`\
  \ 函数定义如下：\n\n```\nbool session_set_save_handler (callback $open,\n             \
  \                  callback $close,\n                               callback $read,\n\
  \                               callback $write,\n                             \
  \  callback $destroy,\n                               callback $gc\n);\n```\n\n\
  每个回调参数都是一个必须符合 PHP 会话 API 的函数。你可以在 PHP 手册页面上阅读更多关于该函数的信息。13 你可以为每个回调简单地实现一个独立的函数；然而，在本解决方案中，我们创建一个新类——`DatabaseSession`\
  \ 类——来封装所有会话处理需求，并使用 `PDO` 对象连接到数据库并在其中存储会话信息。\n\n13 http://www.php.net/session_set_save_handler/\n\
  \n354\n\nPHP 文集\n\n在深入探讨类的细节之前，我将展示我们使用的会话表的 `CREATE` 语句。该语句提供了最少量的信息供你跟踪，因此如果你愿意，可以随意添加更多内容——例如，你可能希望存储\
  \ IP 地址或最后访问的页面。只需记住将新列和值添加到下面类方法中使用的查询中：\n\n```\nCREATE TABLE session (\n    sess_id\
  \         VARCHAR(255),\n    sess_start      DATETIME,\n    sess_last_acc   DATETIME,\n\
  \    sess_data       VARCHAR(255),\n    PRIMARY KEY (sess_id)\n);\n```\n\n## DatabaseSession\
  \ 类\n\n现在，让我们看看这个类。我们首先定义类的属性：\n\n### DatabaseSession.class.php *(摘录)*\n\n```\n\
  class DatabaseSession\n{\n    private $sess_table;\n    private $sess_db;\n    private\
  \ $sess_db_host;\n    private $sess_db_usr;\n    private $sess_db_pass;\n    private\
  \ $db;\n```\n\n`$sess_table` 将存储数据库表名，`$sess_db` 将存储数据库名，`$sess_db_host` 将存储数据库服务器主机名，`$sess_db_usr`\
  \ 将存储数据库用户名，`$sess_db_pass` 将存储数据库密码。`$db` 属性将存储用于所有数据库查询的 `PDO` 对象。\n\n接下来，我们定义构造函数方法：\n\
  \n访问控制\n\n355\n\n### DatabaseSession.class.php *(摘录)*\n\n```\npublic function __construct($sess_db_usr\
  \ = 'user',\n                            $sess_db_pass = 'passwd',\n           \
  \                 $sess_table = 'session',\n                            $sess_db\
  \ = 'dbname',\n                            $sess_db_host = 'locolhost')\n{\n   \
  \ $this->sess_db_usr = $sess_db_usr;\n    $this->sess_db_pass = $sess_db_pass;\n\
  \    $this->sess_table = $sess_table;\n    $this->sess_db = $sess_db;\n    $this->sess_db_host\
  \ = $sess_db_host;\n}\n```\n\n构造函数只是将传递给方法的数据库信息存储在对象的属性中。\n\n我们必须传递给 `session_set_save_handler`\
  \ 函数的第一个回调函数是一个 `open` 函数，它在会话启动时被调用。`DatabaseSession` 类的 `open` 方法将处理该任务：\n\n###\
  \ DatabaseSession.class.php *(摘录)*\n\n```\npublic function open($path, $name)\n\
  {\n    try\n    {\n        $dsn = \"mysql:host={$this->sess_db_host};\".\n     \
  \          \"dbname={$this->sess_db}\";\n        $this->db = new PDO($dsn, $this->sess_db_usr,\n\
  \                            $this->sess_db_pass );\n        $this->db->setAttribute(PDO::ATTR_ERRMODE,\n\
  \                                PDO::ERRMODE_EXCEPTION);\n    }\n    catch (PDOException\
  \ $e)\n    {\n        error_log('Error connecting to the session database.');\n\
  \        error_log('Reason given:'.$e->getMessage().\"\\n\");\n        return false;\n\
  \    }\n    return true;\n}\n```\n\n356\n\nPHP 文集\n\n该方法接收两个字符串参数——会话文件的路径和文件名——并且必须返回\
  \ `true` 或 `false`。由于我们使用的是数据库，路径和文件名信息对我们来说无关紧要，因此我们不对其进行处理。\n\n在该方法中，我们建立到存储会话数据的数据库的连接。如果出现错误，我们返回\
  \ `false`；如果数据库连接成功，我们返回 `true`。\n\n我们需要实现的下一个回调函数是 `close` 函数，因此我们向类中添加一个 `close`\
  \ 方法：\n\n### DatabaseSession.class.php *(摘录)*\n\n```\npublic function close()\n\
  {\n    $this->db = null;\n    return true;\n}\n```\n\n`close` 方法在会话结束时被调用，并且必须返回\
  \ `true` 或 `false`。在这里手动调用垃圾回收（`gc`）方法并不罕见，尽管严格来说并非必要——PHP 会在整个过程中自行进行垃圾回收。我们通过将\
  \ `close` 方法设置为 `null` 来移除数据库连接。\n\n`session_set_save_handler` 还要求实现一个 `read` 函数。\n\
  \n\n\n\n\n`read` 函数需要将会话 ID 作为参数，并返回一个字符串——如果合适的话，即使是空字符串也可以。我们在类中实现了一个 `read` 方法：\n\
  \n`DatabaseSession.class.php` *(节选)*\n\n```php\npublic function read($sess_id)\n\
  {\n    try\n    {\n        $sql = \"SELECT sess_data FROM {$this->sess_table} WHERE\
  \ \" .\n               \"sess_id = :id\";\n        $stmt = $this->db->prepare($sql);\n\
  \        $stmt->execute(array(':id'=>$sess_id));\n        $res = $stmt->fetchAll(PDO::FETCH_ASSOC);\n\
  \    }\n    catch (PDOException $e)\n    {\n        error_log('Error reading the\
  \ session data table in the' .\n                  ' session reading method.');\n\
  \        error_log(' Query with error: '.$sql);\n        error_log(' Reason given:'.$e->getMessage().\"\
  \\n\");\n        return '';\n    }\n    if (count($res) > 0)\n    {\n        return\
  \ isset($res[0]['sess_data']) ?\n               $res[0]['sess_data'] : '';\n   \
  \ }\n    else\n    {\n        return '';\n    }\n}\n```\n\n`read` 方法使用会话 ID 作为键从数据库中检索会话数据，并将数据作为字符串返回。如果未找到数据或发生数据库错误，则返回空字符串。\n\
  \n在 `read` 函数之后，我们需要实现的下一个函数回调是 `write` 函数。顾名思义，该函数处理会话数据的写入。该函数需要接受两个参数——会话 ID\
  \ 和会话数据——并且返回值必须是 `true` 或 `false`。我们在基于类的解决方案中实现了一个 `write` 方法。在我们的方法中，首先检查会话 ID\
  \ 是否已存在于数据库中：\n\n`DatabaseSession.class.php` *(节选)*\n\n```php\npublic function write($sess_id,\
  \ $data)\n{\n    try\n    {\n        $sql = \"SELECT sess_data FROM {$this->sess_table}\
  \ WHERE \" .\n               \"sess_id = :id\";\n        $stmt = $this->db->prepare($sql);\n\
  \        $stmt->execute(array(':id'=>$sess_id));\n        $res = $stmt->fetchAll(PDO::FETCH_ASSOC);\n\
  \    }\n    catch (PDOException $e)\n    {\n        error_log('Error reading the\
  \ session data table in the' .\n                  ' session writing method.');\n\
  \        error_log(' Query with error: '.$sql);\n        error_log(' Reason given:'.$e->getMessage().\"\
  \\n\");\n        return false;\n    }\n}\n```\n\n`$res` 变量包含数据库查询的结果。根据这个结果，我们使用\
  \ SQL `UPDATE` 查询更新现有的会话记录，或者使用 SQL `INSERT` 查询插入一条新记录：\n\n`DatabaseSession.class.php`\
  \ *(节选)*\n\n```php\ntry\n{\n    if (count($res) > 0)\n    {\n        $sql = \"UPDATE\
  \ {$this->sess_table} SET\" .\n               \" sess_last_acc = NOW(), sess_data\
  \ = :data\" .\n               \" WHERE sess_id = :id\";\n        $stmt = $this->db->prepare($sql);\n\
  \        $stmt->bindParam(':data', $data);\n        $stmt->bindParam(':id', $sess_id);\n\
  \    }\n    else\n    {\n        $sql = \"INSERT INTO {$this->sess_table}(sess_id,\"\
  \ .\n               \" sess_start, sess_last_acc,\" .\n               \" sess_data)\
  \ VALUES (:id, NOW(), NOW(), :data)\";\n        $stmt = $this->db->prepare($sql);\n\
  \        $stmt->bindParam(':id', $sess_id);\n        $stmt->bindParam(':data', $data);\n\
  \    }\n    $res = $stmt->execute();\n}\n```\n\n如果你确定只使用 MySQL 作为数据库，可以考虑使用 `REPLACE`\
  \ 语法[¹⁴]。由于我们不想将类限制为 MySQL，因此我们使用上述更长但更兼容的方法。\n\n最后，我们需要捕获所有 `PDOException` 并返回\
  \ `true` 或 `false`：\n\n`DatabaseSession.class.php` *(节选)*\n\n```php\ncatch (PDOException\
  \ $e)\n{\n    error_log('Error writing to the session data table.');\n    error_log('Query\
  \ with error: '.$sql);\n    error_log('Reason given:'.$e->getMessage().\"\\n\");\n\
  \    return false;\n}\nreturn true;\n```\n\n我们的下一个任务是实现一个 `destroy` 函数，顾名思义，该函数在会话被销毁时调用。它接收会话\
  \ ID 作为参数，并且必须返回 `true` 或 `false`。在我们的类方法 `destroy` 中，我们简单地使用会话 ID 作为键从数据库中删除会话，如果发生错误则返回\
  \ `false`，如果操作成功则返回 `true`：\n\n`DatabaseSession.class.php` *(节选)*\n\n```php\npublic\
  \ function destroy($sess_id)\n{\n    try\n    {\n        $sql = \"DELETE FROM {$this->sess_table}\
  \ WHERE sess_id = :id\";\n        $stmt = $this->db->prepare($sql);\n        $stmt->execute(array(':id'=>$sess_id));\n\
  \    }\n    catch (PDOException $e)\n    {\n        error_log('Error destroying\
  \ the session.');\n        error_log('Query with error: '.$sql);\n        error_log('Reason\
  \ given:'.$e->errorMessage().\"\\n\");\n        return false;\n    }\n    return\
  \ true;\n}\n```\n\n我们需要实现的最后一个函数是 `gc`（垃圾回收）函数，用于清理任何未正确关闭的旧会话。它接收一个整数参数，表示会话的“生存时间”（TTL）值。在我们的类方法\
  \ `gc` 中，我们删除所有最后访问时间小于当前时间减去 TTL 值的会话记录：\n\n`DatabaseSession.class.php` *(节选)*\n\
  \n```php\npublic function gc($ttl)\n{\n    $end = time() - $ttl;\n    try\n    {\n\
  \        $sql = \"DELETE FROM {$this->sess_table} WHERE\" .\n               \" sess_last_acc\
  \ < :end\";\n        $stmt = $this->db->prepare($sql);\n        $stmt->execute(array(':id'=>$end));\n\
  \    }\n    catch (PDOException $e)\n    {\n        error_log('Error with the garbage\
  \ collection method of the' .\n                  ' session class.');\n        error_log('Query\
  \ with error: '.$sql);\n        error_log('Reason given:'.$e->getMessage());\n \
  \       return false;\n    }\n    return true;\n}\n```\n\n垃圾回收方法由 PHP 根据 `php.ini`\
  \ 设置 `session.gc_probability` 和 `session.gc_divisor` 调用，并在每次启动新会话时进行检查。同样，如果你愿意，也可以在会话关闭方法中手动调用它。\n\
  \n![Image 111](img/index-383_1.jpg)\n\n![Image 112](img/index-383_2.png)\n\n###\
  \ MySQL MyISAM 引擎性能\n\n如果你的会话表有较高的插入和删除频率，你应该考虑在垃圾回收函数中添加一个 `OPTIMIZE TABLE` 查询，以回收内存并提高性能。有关\
  \ `OPTIMIZE TABLE` 的更多信息，请参阅 MySQL 手册[¹⁵]。\n\n最后，我们实现一个类 `__destruct` 方法。这一步是由于\
  \ PHP 5.0.5 之后会话关闭方式的变化而必需的。基本上，我们只需要通过调用 `session_write_close` 函数来确保会话被显式写入和关闭。你可以在手册页面上阅读更多关于此任务的信息[¹⁶]。以下是我们的\
  \ `__destruct` 方法和类定义的结尾：\n\n`DatabaseSession.class.php` *(节选)*\n\n```php\npublic\
  \ function __destruct()\n{\n    session_write_close();\n}\n```\n\n### 使用 DatabaseSession\
  \ 类\n\n以下是一个简单的脚本来测试我们新的 `DatabaseSession` 类：\n\n`dbsession.php` *(节选)*\n\n```php\n\
  <?php\nrequire_once 'DatabaseSession.class.php';\n\n$session = new DatabaseSession('user',\
  \ 'secret', 'session',\n                               'access_control','localhost');\n\
  \nsession_set_save_handler(array($session, 'open'),\n                         array($session,\
  \ 'close'),\n                         array($session, 'read'),\n               \
  \          array($session, 'write'),\n                         array($session, 'destroy'),\n\
  \                         array($session, 'gc')\n                        );\n\n\
  session_start();\n\n$name = (isset($_SESSION['name']))? $_SESSION['name'] :'';\n\
  if ($name !== '')\n{\n    echo 'Welcome ', $name, ' to your session!';\n}\nelse\n\
  {\n    echo 'Lets start the session!';\n    $_SESSION['name'] = 'PHP';\n}\n?>\n\
  ```\n\n我们引入 `DatabaseSession` 类，然后实例化 `DatabaseSession` 对象。接下来，我们使用 `session_set_save_handler`\
  \ 注册自定义的 PHP 会话处理方法。然后我们进行一个快速的小演示，以显示会话正在工作——第一次加载网页时，你应该看到消息“Let's start the session!”。然后我们将\
  \ `$_SESSION['name']` 设置为 `PHP`。当你刷新网页时，消息应变为“Welcome PHP to your session!”，这表明我们的会话数据正在数据库中正确存储和检索。\n\
  \n欢迎使用数据库保存的会话！\n\n## 总结\n\n[¹⁴]: `REPLACE` 是 SQL 标准的 MySQL 扩展，它要么插入新行，要么删除旧行并插入新行（如果旧行与新行在\
  \ `PRIMARY KEY` 或 `UNIQUE` 索引上具有相同的值）。你可以在 http://dev.mysql.com/doc/refman/5.1/en/replace.html\
  \ 上阅读更多信息。\n[¹⁵]: http://dev.mysql.com/doc/refman/5.1/en/optimize-table.html\n[¹⁶]:\
  \ http://www.php.net/session_set_save_handler/\n\n\n\n\n\n# 第 11 章：缓存\n\n在过去的美好时光里，构建网站就像拼凑几个\
  \ HTML 页面一样简单，将网页传送到浏览器只需让 Web 服务器获取一个文件即可。网站的访问者几乎能立即看到那些小巧、纯文本的页面，除非他们使用的是特别慢的调制解调器。一旦页面下载完成，浏览器会将其缓存在本地计算机的某个位置，这样，如果再次请求该页面，浏览器在与服务器快速确认页面未被更新后，就可以显示本地缓存的版本。页面以尽可能快速高效的方式被提供，每个人都感到满意。\n\
  \n随后，动态网页的出现带来了两个问题，破坏了这种美好局面：\n\n- 当服务器收到对动态网页的请求时，必须完成一些中间处理，例如由 PHP 引擎执行脚本。这种处理会在\
  \ Web 服务器开始向浏览器传送输出之前引入延迟。对于简单的 PHP 脚本来说，这种延迟可能并不显著，但对于更复杂的应用程序，PHP 引擎在页面最终准备好传送之前可能需要做大量工作。这种额外的工作会导致用户请求与页面实际在浏览器中显示之间出现明显的时滞。\n\
  - 典型的 Web 服务器（如 Apache）会使用文件修改时间告知浏览器所请求页面的时效，从而允许浏览器采取适当的缓存操作。对于动态网页，实际的 PHP 脚本可能只是偶尔更改；而它所显示的内容（通常从数据库获取）则会频繁变化。Web\
  \ 服务器无法识别数据库的更新，因此它不会发送最后修改日期。如果客户端（即用户的浏览器）没有数据有效期的指示，它就会自行猜测。如果浏览器决定使用本地缓存的页面版本，而该版本已经过时，或者浏览器决定向服务器请求页面的新副本，但实际上并没有新内容，导致请求冗余，这都会带来问题。无论数据库中的数据是否实际发生变化，Web\
  \ 服务器总是会返回一个全新构建的页面版本。\n\n为了避免网站访问者看到过时内容的可能性，大多数 Web 开发者使用 meta 标签或 HTTP 头来告诉浏览器永远不要使用页面的缓存版本。然而，这否定了\
  \ Web 浏览器缓存网页的自然能力，并带来了一些严重的缺点。例如，动态页面提供的内容可能每天只变化一次，因此让浏览器缓存页面（即使只有 24 小时）显然是有益的。\n\
  \n如果你正在处理一个小型 PHP 应用程序，通常可以忍受这两个问题。但随着网站复杂性的增加——以及流量的增长——你会开始遇到性能问题。然而，这两个问题都可以解决：第一个问题通过服务器端缓存；第二个问题通过从应用程序内部控制客户端缓存。解决这些问题的具体方法取决于你的应用程序，但在本章中，我们将考虑\
  \ PHP 以及来自 PEAR 的一些类库，作为解决网页困境的可能方案。\n\n请注意，在本章关于缓存的讨论中，我们只关注那些可以用 PHP 实现的解决方案。关于更通用的介绍，Mark\
  \ Nottingham 的教程是 Web 缓存权威讨论的代表¹。此外，本章中的解决方案不应与一些基于优化和缓存编译后 PHP 脚本的脚本缓存解决方案混淆，例如\
  \ Zend Accelerator²和 ionCube PHP Accelerator³。\n\n## 如何防止 Web 浏览器缓存页面？\n\n如果信息的时效性对你的网站至关重要，并且你希望避免过时内容被看到，你需要了解如何从一开始就防止\
  \ Web 浏览器——以及代理服务器——缓存页面。\n\n## 解决方案\n\n解决这个问题有两种可能的方法：使用 HTML meta 标签，以及使用 HTTP\
  \ 头。\n\n#### 使用 HTML Meta 标签\n\n防止页面缓存最基本的方法是使用 HTML meta 标签：\n\n```html\n<meta\
  \ http-equiv=\"expires\" content=\"Mon, 26 Jul 1997 05:00:00 GMT\"/>\n<meta http-equiv=\"\
  pragma\" content=\"no-cache\" />\n```\n\n将已经过去的日期插入到`Expires` meta 标签中，告诉浏览器页面的缓存副本总是过时的。遇到这个标签后，浏览器通常不会缓存该页面。虽然`Pragma:\
  \ no-cache` meta 标签不能保证生效，但它是一个相当广泛支持的约定，大多数 Web 浏览器都会遵循。然而，与这种方法相关的两个问题（我们将在下面讨论）可能会促使你考虑替代方案。\n\
  \n#### 使用 HTTP 头\n\n更好的方法是使用 HTTP 协议本身，借助 PHP 的`header()`函数，生成与上述两个 HTML meta 标签等效的内容：\n\
  \n```php\n<?php\nheader('Expires: Mon, 26 Jul 1997 05:00:00 GMT');\nheader('Pragma:\
  \ no-cache');\n?>\n```\n\n我们可以更进一步，使用支持 HTTP 1.1 的浏览器所支持的`Cache-Control`头：\n\n```php\n\
  <?php\nheader('Expires: Mon, 26 Jul 1997 05:00:00 GMT');\nheader('Cache-Control:\
  \ no-store, no-cache, must-revalidate');\nheader('Cache-Control: post-check=0, pre-check=0',\
  \ FALSE);\nheader('Pragma: no-cache');\n?>\n```\n\n关于 HTTP 1.1 `Cache-Control`头的精确描述，请参阅\
  \ W3C 的 HTTP 1.1 RFC⁴。另一个关于 HTTP 头的极好信息来源是 mod_perl 关于发出正确头部的文档⁵，这些信息可以轻松应用于 PHP。\n\
  \n## 讨论\n\n使用`Expires` meta 标签听起来是个好方法，但有两个相关问题：\n\n- 浏览器必须先下载页面才能读取 meta 标签。如果浏览器首次请求页面时该标签不存在，浏览器将毫不知情，并保留其原始缓存副本。\n\
  - 缓存网页的代理服务器（例如 ISP 常见的那些）通常不会读取 HTML 文档本身。Web 浏览器可能知道它不应该缓存页面，但浏览器和 Web 服务器之间的代理服务器可能不知道——它会继续向客户端传送相同的过时页面。\n\
  \n另一方面，使用 HTTP 协议防止页面缓存基本上可以保证没有 Web 浏览器或中间代理服务器会缓存该页面，因此\n\n![图 113](img/index-389_1.jpg)\n\
  \n![图 114](img/index-389_2.png)\n\n¹ http://www.mnot.net/cache_docs/\n² http://www.zend.com/\n\
  ³ http://www.php-accelerator.co.uk/\n⁴ http://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.9\n\
  ⁵ http://perl.apache.org/docs/general/correct_headers/correct_headers.html\n\n\n\
  \n\n访问者将始终获得最新内容。实际上，第一个头部本身就应该实现这一点；这是确保页面不被缓存的最佳方式。添加`Cache-Control`和`Pragma`头部是为了提供一定程度的保障。虽然它们并非在所有浏览器或代理上都有效，但`Cache-Control`和`Pragma`头部能够捕获一些`Expires`头部未能按预期工作的情况——例如，如果客户端计算机的日期设置不正确。\n\
  \n当然，完全禁止缓存会带来本章开头讨论的问题：它否定了网页浏览器缓存页面的自然能力，并可能产生不必要的开销，因为总是请求页面的新版本，即使这些页面自浏览器上次请求以来可能并未更新。\n\
  \n我们稍后将探讨这些问题的解决方案。\n\n## 如何控制客户端缓存？\n\n我们在“如何防止网页浏览器缓存页面？”中讨论了禁用客户端缓存的任务，但禁用缓存很少是唯一（或最佳）的选择。\n\
  \n这里我们将探讨一种机制，它允许我们以可从 PHP 脚本内部控制的方式利用客户端缓存。\n\n### 需要 Apache！\n\n这种方法仅在您将 PHP 作为\
  \ Apache Web 服务器模块运行时才有效，因为它需要使用`getallheaders`函数（该函数仅适用于 Apache）来获取 Web 浏览器发送的\
  \ HTTP 头部。\n\n## 解决方案\n\n在控制客户端缓存时，您有两种选择。您可以设置页面过期日期，或者响应浏览器的请求头部。让我们看看每种策略是如何执行的。\n\
  \n#### 设置页面过期头部\n\n最容易实现的头部是`Expires`头部——我们用它来设置页面过期日期，在此之前，允许 Web 浏览器使用页面的缓存版本。以下是此头部工作的示例：\n\
  \n368\n\n《PHP 文集》\n\n`expires.php`（摘录）\n\n```php\n<?php\n\nfunction setExpires($expires)\
  \ {\n\nheader(\n\n'Expires: '.gmdate('D, d M Y H:i:s', time()+$expires).'GMT');\n\
  \n}\n\nsetExpires(10);\n\necho ( 'This page will self destruct in 10 seconds<br\
  \ />' ); echo ( 'The GMT is now '.gmdate('H:i:s').'<br />' ); echo ( '<a href=\"\
  '.$_SERVER['PHP_SELF'].'\">View Again</a><br />' );\n\n?>\n```\n\n在这个示例中，我们创建了一个名为`setExpires`的自定义函数，它将\
  \ HTTP `Expires`头部设置为未来的某个时间点，以秒为单位定义。上述示例的输出显示了当前的 GMT 时间，并提供了一个允许我们再次查看页面的链接。如果我们点击这个链接，会注意到时间每十秒才更新一次。如果你愿意，还可以通过使用浏览器的刷新按钮来告诉浏览器刷新缓存，并观察显示日期发生的变化。\n\
  \n#### 响应浏览器的请求头部\n\n一种更有用的客户端缓存控制方法是利用`Last-Modified`和`If-Modified-Since`头部，这两个头部在\
  \ HTTP 1.0 中均可使用。这种操作在技术上称为执行条件 GET 请求；你的脚本是否返回任何内容取决于传入的`If-Modified-Since`请求头部的值。\n\
  \n如果你在 Apache 上使用 PHP 4.3.0 及以上版本，可以通过函数`apache_request_headers`和`apache_response_headers`访问\
  \ HTTP 头部。注意，函数`getallheaders`已成为新函数`apache_request_headers`的别名。\n\n这种方法要求每次访问你的\
  \ PHP 脚本时都发送一个`Last-Modified`头部。下次浏览器请求该页面时，它会发送一个包含时间的`If-Modified-Since`头部；你的脚本随后可以判断页面自该时间以来是否已更新。如果没有更新，你的脚本会发送一个\
  \ HTTP 304 状态码以指示页面未被修改，并在发送页面正文之前退出。\n\n缓存\n\n369\n\n让我们看看这些头部的实际应用。下面的示例使用了一个文本文件的修改日期。为了模拟更新，我们首先需要创建一种随机写入文件的方法：\n\
  \n`ifmodified.php`（摘录）\n\n```php\n<?php\n\n$file = 'ifmodified.txt';\n\n$random\
  \ = array (0,1,1);\n\nshuffle($random);\n\nif ( $random[0] == 0 ) {\n\n$fp = fopen($file,\
  \ 'w');\n\nfwrite($fp, 'x');\n\nfclose($fp);\n\n}\n\n$lastModified = filemtime($file);\n\
  ```\n\n我们的简单随机化器提供了每次请求页面时文件有三分之一概率被更新的机会。我们还使用`filemtime`函数获取文件的最后修改时间。\n\n接下来，我们发送一个使用文本文件修改时间的`Last-Modified`头部。我们需要为渲染的每个页面发送此头部，以使访问的浏览器在每次请求时向我们发送`If-Modified-Since`头部：\n\
  \n`ifmodified.php`（摘录）\n\n```php\nheader('Last-Modified: ' .\n\ngmdate('D, d M Y\
  \ H:i:s', $lastModified) . ' GMT');\n```\n\n我们使用`getallheaders`函数确保 PHP 将所有传入的请求头部作为一个数组提供给我们。然后我们需要检查`If-Modified-Since`头部是否实际存在；如果存在，我们必须处理由较旧的\
  \ Mozilla 浏览器（版本 6 之前）引起的特殊情况，这些浏览器在其`If-Modified-Since`头部中附加了一个非法的额外字段。我们使用 PHP\
  \ 的`strtotime`函数从浏览器发送给我们的日期生成一个时间戳。如果没有这样的头部，我们将此时间戳设置为零，这将强制 PHP 向访问者提供页面的最新副本：\n\
  \n`ifmodified.php`（摘录）\n\n```php\n$request = getallheaders();\n\nif (isset($request['If-Modified-Since']))\n\
  \n{\n\n$modifiedSince = explode(';', $request['If-Modified-Since']); $modifiedSince\
  \ = strtotime($modifiedSince[0]);\n\n}\n\nelse\n\n{\n\n$modifiedSince = 0;\n\n}\n\
  ```\n\n最后，我们检查自访问者上次收到此页面以来缓存是否已被修改。如果没有，我们只需发送一个 304 Not Modified 响应头部并退出脚本，通过提示浏览器显示其缓存的页面副本来节省带宽和处理时间：\n\
  \n`ifmodified.php`（摘录）\n\n```php\nif ($lastModified <= $modifiedSince)\n\n{\n\n\
  header('HTTP/1.1 304 Not Modified');\n\nexit();\n\n}\n\necho ( 'The GMT is now '.gmdate('H:i:s').'<br\
  \ />' ); echo ( '<a href=\"'.$_SERVER['PHP_SELF'].'\">View Again</a><br />' );\n\
  \n?>\n```\n\n运行此示例时，请记得使用“再次查看”链接（点击刷新按钮通常会清除浏览器的缓存）。如果你反复点击该链接，缓存最终会被更新；你的浏览器将丢弃其缓存版本并从服务器获取新页面。\n\
  \n如果你将`Last-Modified`头部方法与应用程序中已有的时间值（例如最新新闻文章的时间）结合使用，你应该能够利用 Web 浏览器缓存，从而节省带宽并提高应用程序的感知性能。\n\
  \n缓存\n\n371\n\n不过，请务必小心测试以这种方式执行的任何缓存；如果弄错了，可能会导致访问者始终看到你网站的过期副本。\n\n## 讨论\n\nHTTP\
  \ 日期总是相对于格林威治标准时间（GMT）计算的。PHP 函数`gmdate`与`date`函数完全相同，只是它会根据服务器的系统时钟和区域设置自动将时间偏移到\
  \ GMT。\n\n当浏览器遇到`Expires`头部时，它会缓存该页面。在指定过期时间之前对该页面的所有后续请求都使用页面的缓存版本——不会向 Web 服务器发送请求。当然，客户端缓存只有在计算机的系统时间准确时才真正有效。如果计算机的时间与\
  \ Web 服务器的时间不同步，你可能会面临页面被错误缓存或从未更新的风险。\n\n\n\nExpires 头的优势在于实现简单；然而，在大多数情况下，除非你是一个高度有条理的人，否则你无法确切知道网站上某个页面的更新时间。由于浏览器只会在页面过期后联系服务器，因此无法告知浏览器它们缓存的页面已经过时。此外，你还会失去对网站访问流量的一些了解，因为浏览器在请求已缓存的页面时不会与服务器建立连接。\n\
  \n## 如何在浏览器中检查 HTTP 头？\n\n如果你无法实际看到 HTTP 头，如何检查你的应用程序是否按预期运行，或者调试你的代码？了解你的脚本发送了哪些头信息是很有价值的，尤其是在处理\
  \ HTTP 缓存头时。\n\n## 解决方案\n\n有几种值得使用的工具可以帮助你更仔细地查看 HTTP 头：\n\n**LiveHTTPHeaders (http://livehttpheaders.mozdev.org/)**\n\
  这个 Firefox 浏览器的附加组件是一个简单但非常实用的工具，可以在浏览时检查请求和响应头。\n\n**Firebug (http://getfirebug.org/)**\n\
  另一个有用的 Firefox 附加组件，Firebug 是一个工具，其界面提供了一个专门的选项卡来检查 HTTP 请求信息。\n\n**HTTPWatch (http://www.httpwatch.com/)**\n\
  这个用于 Internet Explorer 的 HTTP 查看和调试附加组件，类似于上面的 LiveHTTPHeaders。\n\n**Charles Web\
  \ Debugging Proxy (http://getcharles.com/)**\n适用于 Windows、Mac OS X 和 Linux 或 Unix，Charles\
  \ Web 调试代理是一个代理服务器，允许开发者查看其浏览器与所连接 Web 服务器之间的所有 HTTP 流量。\n\n这些工具中的任何一个都能让你检查服务器与浏览器之间的通信。\n\
  \n## 如何使用 Internet Explorer 缓存文件下载？\n\n如果你正在为 Internet Explorer 用户开发文件下载脚本，你可能会注意到下载过程中的一些问题。特别是，当你通过一个\
  \ PHP 脚本提供文件下载，该脚本使用了诸如 `Content-Disposition: attachment, filename=myFile.pdf` 或\
  \ `Content-Disposition: inline, filename=myFile.pdf` 这样的头，并且告诉浏览器不要缓存页面时，Internet\
  \ Explorer 将不会把文件传递给用户。\n\n## 解决方案\n\nInternet Explorer 处理下载的方式相当不寻常：它会向网站发出两个请求。第一个请求下载文件并将其存储在缓存中，然后发出第二个请求，第二个请求的响应不会被存储。第二个请求会根据文件类型触发将文件传递给最终用户的过程——例如，如果文件是\
  \ PDF 文档，它会启动 Acrobat Reader。\n\n因此，如果你发送了指示浏览器不要缓存页面的缓存头，Internet Explorer 会在第一个请求和第二个请求之间删除该文件，导致最终用户什么也收不到！\n\
  \n如果你通过 PHP 脚本提供的文件不会改变，一个解决方案就是简单地禁用下载脚本中的“不缓存”头，即我们在“如何防止 Web 浏览器缓存页面？”中讨论的 `pragma`\
  \ 和 `cache-control`。\n\n如果文件下载会定期更改，并且你希望浏览器下载最新版本，那么你需要使用我们在“如何控制客户端缓存？”中遇到的 `Last-Modified`\
  \ 头，并确保在连续两次请求中修改时间保持不变。你应该能够在不影响正确处理下载的浏览器用户的情况下实现这一目标。\n\n最后一个解决方案是将文件写入你的 Web\
  \ 服务器文件系统，并简单地提供一个链接，让 Web 服务器为你报告缓存头。\n\n当然，如果文件需要安全保护，这可能不是一个可行的选择。\n\n## 如何使用输出缓冲进行服务器端缓存？\n\
  \n服务器端处理延迟是动态网页最大的痛点之一。\n\n我们可以通过缓存输出来减少服务器端延迟。页面正常生成，使用 PHP 执行数据库查询等操作；然而，在将其发送到浏览器之前，我们捕获并存储完成的页面到某个地方——例如，一个文件中。\n\
  \n下次请求该页面时，PHP 脚本首先检查是否存在页面的缓存版本。如果存在，脚本直接将缓存版本发送到浏览器，避免了重建页面所涉及的延迟。\n\n## 解决方案\n\
  \n在这里，我们将介绍 PHP 内置的缓存机制——输出缓冲，它可以与你喜欢的任何页面渲染系统（无论是否使用模板）一起使用。\n\n考虑你的脚本使用例如 `echo`\
  \ 或 `print` 显示结果，而不是直接将数据发送到浏览器的情况。在这种情况下，你可以使用 PHP 的输出控制函数将数据存储到内存缓冲区中，你的 PHP 脚本可以访问并控制该缓冲区。\n\
  \n下面是一个简单的示例，演示了输出缓冲的工作原理：`buffer.php` *(摘录)*\n\n```php\n<?php\nob_start();\necho\
  \ '1\\. 将此内容放入缓冲区<br />';\n$buffer = ob_get_contents();\nob_end_clean();\necho '2\\\
  . 普通的 echo<br />';\necho $buffer;\n?>\n```\n\n缓冲区本身将输出存储为字符串。因此，在上面的脚本中，我们使用 `ob_start`\
  \ 函数开始缓冲，并使用 `echo` 显示一段文本，该文本会自动存储在输出缓冲区中。然后我们使用 `ob_get_contents` 函数获取 `echo`\
  \ 语句放入缓冲区中的数据，并将其存储在 `$buffer` 变量中。`ob_end_clean` 函数停止输出缓冲并清空内容；另一种方法是使用 `ob_end_flush`\
  \ 函数，它会显示缓冲区的内容。\n\n上面的脚本会输出以下内容：\n\n2\\. 普通的 echo\n\n1\\. 将此内容放入缓冲区\n\n换句话说，我们捕获了第一个\
  \ `echo` 的输出，然后在第二个 `echo` 之后将其发送到浏览器。正如这个简单示例所示，输出缓冲在构建网站时可以成为一个非常强大的工具；它提供了一种缓存解决方案，我们稍后会看到，并且也是向网站访问者隐藏错误的一种极好方式，正如第\
  \ 9 章所讨论的。输出缓冲甚至为用户认证等场景中的浏览器重定向提供了一种可能的替代方案。\n\n为了提高网站性能，我们可以将输出缓冲区的内容存储到一个文件中。然后，我们可以在下一次请求时调用这个文件，而不必从头开始重新构建输出。让我们快速看一下这种技术的示例。首先，我们的示例脚本检查缓存文件是否存在：\n\
  \n`sscache.php` *(摘录)*\n\n```php\n<?php\nif (file_exists('./cache/page.cache'))\n\
  {\nreadfile('./cache/page.cache');\nexit();\n}\n```\n\n如果脚本找到了缓存文件，我们只需输出其内容，然后结束！\n\
  \n如果未找到缓存文件，我们继续使用输出缓冲输出页面：`sscache.php` *(摘录)*\n\n```php\nob_start();\n?>\n<!DOCTYPE\
  \ html public \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<title>缓存的页面</title>\n\
  </head>\n<body>\n此页面已使用 PHP 的\n<a href=\"http://www.php.net/outcontrol\"\n>输出控制函数</a>\
  \ 进行缓存\n</body>\n</html>\n<?php\n$buffer = ob_get_contents();\nob_end_flush();\n\
  ```\n\n在刷新输出缓冲区以显示页面之前，我们确保将缓冲区内容存储在 `$buffer` 变量中。\n\n最后一步是将保存的缓冲区内容存储到一个文本文件中：\n\
  \n`sscache.php` *(摘录)*\n\n```php\n$fp = fopen('./cache/page.cache','w');\nfwrite($fp,$buffer);\n\
  fclose($fp);\n```\n\n\n\n`page.cache`文件的内容与脚本渲染的 HTML 完全相同：\n\n`cache/page.cache`\
  \ *(摘录)*\n\n```html\n<!DOCTYPE html public \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head>\n<title>Cached Page</title>\n</head>\n<body>\nThis page was cached with\
  \ PHP's\n<a href=\"http://www.php.net/outcontrol\"\n>Output Control Functions</a>\n\
  </body>\n</html>\n```\n\n## 讨论\n\n如需查看如何使用 PHP 的输出缓冲功能更优雅地处理错误的示例，请参阅*PHP Freaks*上\
  \ Derek Ford 撰写的文章“输出缓冲入门”。6\n\n## 模板缓存呢？\n\n模板引擎通常包含模板缓存功能——`Smarty`就是一个例子。7 通常，这些引擎提供内置机制来存储模板的编译版本（即从模板生成的原始\
  \ PHP），这使我们开发人员无需在每次请求页面时重新编译模板。\n\n6 http://www.phpfreaks.com/tutorials/59/0.php\n\
  \n7 http://smarty.php.net/\n\n![Image 115](img/index-399_1.jpg)\n\n![Image 116](img/index-399_2.png)\n\
  \n## 缓存\n\n377\n\n此过程不应与输出缓存或内容缓存混淆，后者指的是缓存 PHP 发送给浏览器的渲染后的 HTML（或其他输出）。除了本章讨论的内容缓存机制外，`Smarty`还可以缓存\
  \ HTML 页面的内容。无论您使用`Smarty`的内容缓存还是本章讨论的其他替代方案，都可以在同一站点上同时使用模板缓存和内容缓存。\n\n## HTTP\
  \ 头与输出缓冲\n\n输出缓冲可以帮助解决与`header`函数相关的最常见问题，更不用说`session_start`和`set_cookie`带来的问题了。通常，如果在页面输出开始后调用这些函数中的任何一个，您将收到一个令人讨厌的错误消息。当输出缓冲开启时，唯一能逃出缓冲区的输出类型是\
  \ HTTP 头。如果您在应用程序执行的最开始使用`ob_start`，您可以在任何您喜欢的位置发送头信息，而不会遇到常见的错误。然后，当您确定不再需要发送 HTTP\
  \ 头时，可以一次性写出缓冲的页面内容。\n\n## 负责任地使用输出缓冲\n\n虽然输出缓冲可以很好地解决所有头信息问题，但不应仅仅为此而使用它。通过确保所有输出都在所有头信息发送之后生成，您可以节省使用输出缓冲所涉及的时间和资源开销。\n\
  \n## 如何只缓存页面中不经常变化的部分？\n\n缓存整个页面是一种简单的输出缓冲方法。虽然实现起来很容易，但这种方法否定了 PHP 输出控制函数所提供的真正好处，即以一种与内容不同生命周期相关的方式来提高网站性能。\n\
  \n毫无疑问，您发送给访问者的页面某些部分变化非常少，例如页面的头部、菜单和页脚。但其他部分——例如博客文章下方的评论列表——可能变化相当频繁。幸运的是，PHP\
  \ 允许您分别缓存页面的各个部分。\n\n378\n\nPHP 文集\n\n## 解决方案\n\n输出缓冲可用于将页面的各个部分分别缓存到不同的文件中。然后可以从这些文件中重建页面以进行输出。\n\
  \n这种技术消除了重复数据库查询、while 循环等的需要。您可以考虑为页面的每个块分配一个过期时间，之后重新创建缓存文件；或者，您可以在应用程序中构建一种机制，每当存储的内容发生变化时删除缓存文件。\n\
  \n让我们通过一个示例来演示这一原理。首先，我们将创建两个辅助函数：`writeCache`和`readCache`。以下是`writeCache`函数：\n\n\
  `smartcache.php` *(摘录)*\n\n```php\n<?php\nfunction writeCache($content, $filename)\n\
  {\n    $fp = fopen('./cache/' . $filename, 'w');\n    fwrite($fp, $content);\n \
  \   fclose($fp);\n}\n```\n\n`writeCache`函数非常简单；它只是将第一个参数的内容写入第二个参数指定的文件中，并将该文件保存到`cache`目录下的某个位置。我们将使用此函数将\
  \ HTML 写入缓存文件。\n\n`readCache`函数将返回第一个参数指定的缓存文件的内容（如果该文件尚未过期），即文件的最后修改时间不早于当前时间减去第二个参数指定的秒数。\n\
  \n如果文件已过期或不存在，该函数返回`false`：\n\n`smartcache.php` *(摘录)*\n\n```php\nfunction readCache($filename,\
  \ $expiry)\n{\n    if (file_exists('./cache/' . $filename))\n    {\n        if ((time()\
  \ - $expiry) > filemtime('./cache/' . $filename))\n        {\n            return\
  \ false;\n        }\n        $cache = file('./cache/' . $filename);\n        return\
  \ implode('', $cache);\n    }\n    return false;\n}\n```\n\n为了演示这一概念，我采用了过程式方法。然而，我不建议在实践中这样做，因为它会导致代码非常混乱，并可能引发文件锁定问题。例如，当有人在缓存文件正在更新的瞬间访问它时会发生什么？更好的解决方案将在本章后面部分进行说明。\n\
  \n让我们继续这个示例。在输出缓冲启动后，处理开始。首先，脚本调用`readCache`来检查`header.cache`文件是否存在；该文件包含页面顶部——HTML\
  \ 的`<head>`标签和`<body>`开始标签。我们使用了 PHP 的`date`函数来显示页面实际渲染的时间，这样当页面显示时，您就能看到不同的缓存文件在起作用：\n\
  \n`smartcache.php` *(摘录)*\n\n```php\nob_start();\nif (!$header = readCache('header.cache',\
  \ 604800))\n{\n?>\n<!DOCTYPE html public \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head>\n<title>Chunked Cached Page</title>\n<meta http-equiv=\"Content-Type\"\
  \ncontent=\"text/html; charset=iso-8859-1\"/>\n</head>\n<body>\n<p>The header time\
  \ is now: <?php echo date('H:i:s'); ?></p>\n<?php\n$header = ob_get_contents();\n\
  ob_clean();\nwriteCache($header,'header.cache');\n}\n```\n\n请注意当缓存文件未找到时会发生什么：头部内容被输出并通过`ob_get_contents`赋值给变量`$header`，然后调用`ob_clean`函数清空缓冲区。这使我们能够以“块”的形式捕获输出，并通过`writeCache`函数将它们分配给单独的缓存文件。\n\
  \n页面的头部现在存储为一个文件，可以重复使用，而无需重新渲染页面。回顾一下`if`条件的开头。当我们调用`readCache`时，我们给了它一个过期时间 604800\
  \ 秒（一周）；`readCache`使用缓存文件的修改时间来确定缓存是否仍然有效。\n\n对于页面主体，我们将使用相同的过程。然而，这次当我们调用`readCache`时，我们将使用五秒的过期时间；当缓存文件超过五秒时，它将被更新：\n\
  \n`smartcache.php` *(摘录)*\n\n```php\nif (!$body = readCache('body.cache', 5))\n\
  {\n    echo 'The body time is now: ' . date('H:i:s') . '<br />';\n    $body = ob_get_contents();\n\
  \    ob_clean();\n    writeCache($body, 'body.cache');\n}\n```\n\n页面页脚与头部基本相同。在页脚之后，输出缓冲停止，并显示保存页面数据的三个变量的内容：\n\
  \n`smartcache.php` *(摘录)*\n\n```php\nif (!$footer = readCache('footer.cache', 604800))\
  \ {\n?>\n<p>The footer time is now: <?php echo date('H:i:s'); ?></p>\n</body>\n\
  </html>\n<?php\n$footer = ob_get_contents();\n```\n\n\n\n\n```\nob_clean();\n\n\
  writeCache($footer, 'footer.cache');\n\n}\n\nob_end_clean();\n\necho $header . $body\
  \ . $footer;\n\n?>\n```\n\n最终结果如下所示：\n\n头部时间现在是：17:10:42\n\n主体时间现在是：18:07:40\n\n\
  底部时间现在是：17:10:42\n\n头部和底部每周更新一次，而主体在超过五秒后就会更新。如果你不断刷新页面，你会看到主体时间在更新。\n\n## 讨论\n\n\
  请注意，如果你的页面根据多个变量动态构建内容，你需要调整处理缓存文件的方式。例如，你可能有一个在线购物目录，其列表页面由类似这样的 URL 定义：\n\n`http://example.com/catalogue/view.php?category=1&page=2`\n\
  \n这个 URL 应该显示类别一中所有商品的第二页；假设这是袜子的类别。但如果我们使用上面的缓存代码，我们查看的第一个类别的第一页的结果会被缓存，并且任何其他页面或类别的请求都会显示这个缓存内容，直到缓存过期时间结束。这肯定会让下一个想要浏览鞋子类别的访客感到困惑——那个人会看到袜子的缓存内容！\n\
  \n为了避免这个问题，你需要将类别 ID 和页码合并到缓存文件名中，如下所示：\n\n![Image 117](img/index-404_1.png)\n\n\
  ![Image 118](img/index-404_2.jpg)\n\n382\n\nPHP 文集\n\n```\n$cache_filename = 'catalogue_'\
  \ . $category_id . '_' .\n$page . '.cache';\nif (!$catalogue = readCache($cache_filename,\
  \ 604800))\n{\n⋮ *显示类别 HTML…*\n}\n```\n\n这样，每个请求都能检索到正确的缓存内容。\n\n## 嵌套缓冲区\n\n你可以通过多次调用\
  \ `ob_start` 将一个缓冲区嵌套在另一个缓冲区中，实际上可以*无限*嵌套。如果你有多个使用输出缓冲区的操作，比如一个用于捕获 PHP 错误消息，另一个用于处理缓存，这会很有用。需要注意确保每次使用\
  \ `ob_start` 时都调用 `ob_end_flush` 或 `ob_end_clean`。\n\n## 如何使用 PEAR::Cache_Lite 进行服务器端缓存？\n\
  \n前面的解决方案探讨了使用 PHP `ob_*` 函数进行输出缓冲的思路。尽管我们当时提到，这种方法可能不是实现代码可维护性和可靠缓存机制双重目标的最佳方式。现在是时候看看如何以一种可靠且易于维护的方式将缓存系统付诸实践了。\n\
  \n## 解决方案\n\n为了保持代码的可维护性并拥有可靠的缓存机制，最好将缓存逻辑的责任委托给你信任的类。在这种情况下，我们将借助 `PEAR::Cache_Lite`（此处示例使用版本\
  \ 1.7.2）的帮助。8 `Cache_Lite` 提供了一个稳定且易于使用的缓存库，并处理以下问题：文件锁定；创建、检查和删除缓存文件；控制输出缓冲区；以及直接缓存函数和类方法调用的结果。更重要的是，`Cache_Lite`\
  \ 应该相对容易应用于现有应用程序，只需进行少量代码修改。\n\n`Cache_Lite` 有四个主要类。首先是基类 `Cache_Lite`，它纯粹处理创建和获取缓存文件，但不使用输出缓冲。这个类可以单独用于不需要输出缓冲的缓存操作，例如存储你用\
  \ PHP 解析过的模板内容。这里的示例不会直接使用 `Cache_Lite`，而是重点介绍三个子类。`Cache_Lite_Function` 可用于调用函数或类方法并缓存结果，例如，这对于存储\
  \ MySQL 查询结果集可能很有用。`Cache_Lite_Output` 类使用 PHP 的输出控制函数来捕获脚本生成的输出并将其存储在缓存文件中；它允许你执行诸如我们在“如何仅缓存页面中不经常更改的部分？”中完成的任务。`Cache_Lite_File`\
  \ 类根据主文件的时间戳来确定缓存过期，如果缓存文件比时间戳旧，则视为已过期。\n\n让我们通过一个示例来展示如何使用 `Cache_Lite` 创建一个简单的缓存解决方案。当我们实例化\
  \ `Cache_Lite` 的任何子类时，必须首先提供一个选项数组，这些选项决定了 `Cache_Lite` 本身的行为。我们稍后会详细查看这些选项。请注意，我们指定的\
  \ `cacheDir` 目录必须是脚本具有读写权限的目录：\n\n**cachelite.php（摘录）**\n\n```php\n<?php\n\nrequire_once\
  \ 'Cache/Lite/Output.php';\n\n$options = array(\n\n'cacheDir' => './cache/',\n\n\
  'writeControl' => 'true',\n\n'readControl' => 'true',\n\n'fileNameProtection' =>\
  \ false,\n\n'readControlType' => 'md5'\n\n);\n\n$cache = new Cache_Lite_Output($options);\n\
  ```\n\n对于我们要缓存的每一块内容，我们需要设置一个生命周期（以秒为单位），即缓存刷新前应保留的时间。接下来，我们使用 `start` 方法（仅在 `Cache_Lite_Output`\
  \ 类中可用）来开启输出缓冲。传递给 `start` 方法的两个参数是此特定缓存文件的标识值和一个缓存组。组是一个标识符，允许对一组缓存文件进行操作；例如，可以删除给定组中的所有缓存文件（稍后会详细介绍）。`start`\
  \ 方法会检查是否存在有效的缓存文件，如果存在，则开始输出缓存内容。如果缓存文件不可用，`start` 将返回 false 并开始缓存后续输出。\n\n一旦此块的输出完成，我们使用\
  \ `end` 方法停止缓冲并将内容存储为文件：\n\n**cachelite.php（摘录）**\n\n```php\n$cache->setLifeTime(604800);\n\
  \nif (!$cache->start('header', 'Static')) {\n\n?>\n\n<!DOCTYPE html public \"-//W3C//DTD\
  \ XHTML 1.0 Transitional//EN\"\n\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n\n<head>\n\n<title>PEAR::Cache_Lite\
  \ 示例</title>\n\n<meta http-equiv=\"Content-Type\"\n\ncontent=\"text/html; charset=iso-8859-1\"\
  />\n\n</head>\n\n<body>\n\n<h2>PEAR::Cache_Lite 示例</h2>\n\n<p>头部时间现在是：<?php echo\
  \ date('H:i:s'); ?></p>\n\n<?php\n\n$cache->end();\n\n}\n```\n\n为了缓存主体和底部，我们遵循与头部相同的步骤。请注意，在缓存主体时，我们再次指定了五秒的生命周期：\n\
  \n**cachelite.php（摘录）**\n\n```php\n$cache->setLifeTime(5);\n\nif (!$cache->start('body',\
  \ 'Dynamic')) {\n\necho '主体时间现在是：' . date('H:i:s') . '<br />'; $cache->end();\n\n\
  }\n```\n\n![Image 119](img/index-407_1.jpg)\n\n![Image 120](img/index-407_2.png)\n\
  \n缓存\n\n385\n\n```php\n$cache->setLifeTime(604800);\n\nif (!$cache->start('footer',\
  \ 'Static')) {\n\n?>\n\n<p>底部时间现在是：<?php echo date('H:i:s'); ?></p>\n\n</body>\n\
  \n</html>\n\n<?php\n\n$cache->end();\n\n}\n\n?>\n```\n\n在查看页面时，`Cache_Lite` 会在缓存目录中创建缓存文件。由于我们将\
  \ `fileNameProtection` 选项设置为 false，`Cache_Lite` 会创建以下名称的文件：\n\n- `./cache/cache_Static_header`\n\
  - `./cache/cache_Dynamic_body`\n- `./cache/cache_Static_footer`\n\n你可以在“`Cache_Lite`\
  \ 支持哪些配置选项？”中了解 `fileNameProtection` 选项以及更多内容。当稍后请求同一页面时，上述代码将使用有效的且未过期的缓存文件。\n\n\
  ## 保护你的缓存文件\n\n确保放置缓存文件的目录不对外公开，否则你的网站访客可能会访问到比你预期更多的内容。\n\n## Cache_Lite 支持哪些配置选项？\n\
  \n\n\n\n当实例化`Cache_Lite`（或其任何子类，如`Cache_Lite_Output`）时，你可以使用多种方法来控制其行为。这些选项应放在一个数组中，并传递给构造函数，如下所示（以及上一节中）：\n\
  \n```\n$options = array(\n    'cacheDir' => './cache/',\n    'writeControl' => true,\n\
  \    'readControl' => true,\n    'fileNameProtection' => false,\n    'readControlType'\
  \ => 'md5'\n);\n$cache = new Cache_Lite_Output($options);\n```\n\n**解决方案**\n\n当前版本`Cache_Lite`（1.7.2）中可用的选项有：\n\
  \n`cacheDir`  \n这是缓存文件存放的目录。默认为`/tmp/`。\n\n`caching`  \n此选项用于开启或关闭`Cache_Lite`的缓存行为。例如，如果你的代码中有大量`Cache_Lite`调用，并且想为了调试而禁用缓存，那么这个选项将很重要。默认值为`true`（启用缓存）。\n\
  \n`lifeTime`  \n此选项表示缓存文件的默认生命周期（以秒为单位）。可以使用`setLifeTime`方法更改。默认值为`3600`（一小时），如果设置为`null`，则缓存文件永不过期。\n\
  \n`fileNameProtection`  \n启用此选项后，`Cache_Lite`使用 MD5 加密哈希生成缓存文件的文件名。此选项可防止你在使用包含文件名无效字符的\
  \ ID 或组名时出错；当你使用`Cache_Lite_Function`时，必须开启`fileNameProtection`。默认值为`true`（启用）。\n\
  \n`fileLocking`  \n此选项用于开启或关闭文件锁定机制。默认值为`true`（启用）。\n\n`writeControl`  \n此选项会在缓存文件创建后立即检查其是否已正确写入，如果发现问题则抛出`PEAR::Error`。显然，此功能允许你的代码尝试重写创建错误的缓存文件，但会带来性能上的代价。默认值为`true`（启用）。\n\
  \n`readControl`  \n此选项检查正在读取的缓存文件，确保它们没有损坏。`Cache_Lite`能够在文件内部放置一个值（例如文件的字符串长度），用于确认缓存文件未损坏。有三种可选的检查文件有效性的机制，通过`readControlType`选项指定。这些机制会带来性能开销，但应有助于确保访问者不会看到混乱的页面。默认值为`true`（启用）。\n\
  \n`readControlType`  \n此选项允许你指定要使用的读取控制机制类型。可用的机制有：使用 PHP 的`crc32`函数进行循环冗余校验（`crc32`，默认值），使用\
  \ PHP 的`md5`函数进行 MD5 哈希（`md5`），或者简单快速的字符串长度检查（`strlen`）。请注意，此机制并非用于防止他人篡改缓存文件，而只是用于发现损坏的文件。\n\
  \n`pearErrorMode`  \n此选项告诉`Cache_Lite`如何向调用脚本返回 PEAR 错误。默认值为`CACHE_LITE_ERROR_RETURN`，这意味着`Cache_Lite`将返回一个`PEAR::Error`对象。\n\
  \n`memoryCaching`  \n启用内存缓存后，每次将文件写入缓存时，它都会存储在`Cache_Lite`的一个数组中。`saveMemoryCachingState`和`getMemoryCachingState`方法可用于在请求之间存储和访问内存缓存数据。此功能的优点是可以将完整的缓存文件集存储在一个文件中，通过将缓存文件直接重构到代码可访问的数组中，减少磁盘读写操作次数。如果你运行大型站点，`memoryCaching`选项可能值得进一步研究。默认值为`false`（禁用）。\n\
  \n`onlyMemoryCaching`  \n如果启用此选项，则仅使用内存缓存机制。默认值为`false`（禁用）。\n\n`memoryCachingLimit`\
  \  \n此选项限制存储在内存缓存数组中的缓存文件数量。缓存文件越多，内存缓存消耗的内存就越多，因此设置一个限制以防止服务器过度工作可能是个好主意。当然，此选项不限制每个缓存文件的大小，因此仅一两个大文件也可能导致问题。默认值为`1000`。\n\
  \n`automaticSerialization`  \n如果启用，此选项将自动序列化所有数据类型。虽然这种方法会降低缓存系统的速度，但对于缓存非标量数据类型（如对象和数组）很有用。为了获得更高的性能，你可以考虑自己序列化非标量数据类型。默认值为`false`（禁用）。\n\
  \n`automaticCleaningFactor`  \n此选项会自动清理旧的缓存条目——平均每 x 次缓存写入清理一次，其中 x 为此选项设置的值。因此，将此值设置为`0`表示不自动清理，设置为`1`则每次缓存写入都会清理。如果你希望启用此功能，建议从`20`到`200`的值开始；这会导致平均\
  \ 0.5%到 5%的缓存写入时进行清理。默认值为`0`（禁用）。\n\n`hashedDirectoryLevel`  \n当设置为非零值时，此选项将启用哈希目录结构。哈希目录结构可以提升拥有数千个缓存文件的站点的性能。如果你选择使用哈希目录，请从将此值设置为`1`开始，并在测试性能提升时逐步增加。默认值为`0`（禁用）。\n\
  \n`errorHandlingAPIBreak`  \n此选项是为了与使用旧 API 的代码向后兼容而添加的。当旧 API 在`CACHE_LITE_ERROR_RETURN`模式下运行时（参见本列表前面的`pearErrorMode`选项），某些函数会返回布尔值表示成功，而不是返回`PEAR_Error`对象。通过将此值设置为`true`，将返回`PEAR_Error`对象。默认值为`false`（禁用）。\n\
  \n**如何清除 Cache_Lite 缓存？**\n\n`Cache_Lite`缓存文件的内置生命周期机制为保持缓存文件更新提供了良好的基础，但在某些情况下，你需要立即更新文件。\n\
  \n**解决方案**\n\n在需要立即更新的情况下，`remove`和`clean`方法就派上用场了。`remove`方法用于删除特定的缓存文件；它接受缓存 ID\
  \ 和组名作为参数。要删除我们在“如何使用 PEAR::Cache_Lite 进行服务器端缓存？”中创建的页面主体缓存文件，可以使用以下代码：\n\n```\n\
  $cache->remove('body', 'Dynamic');\n```\n\n如果我们使用`clean`方法，只需不带参数调用该方法即可删除缓存目录中的所有文件；或者，我们可以指定要删除的缓存文件组。如果我们想删除在“如何使用\
  \ PEAR::Cache_Lite 进行服务器端缓存？”中创建的页眉和页脚缓存文件，可以这样做：\n\n```\n$cache->clean('Static');\n\
  ```\n\n**讨论**\n\n显然，`remove`和`clean`方法应在应用程序中发生事件时调用。例如，如果你有一个论坛应用程序，当访问者发布新消息时，你可能希望删除相关的缓存文件。\n\
  \n虽然这看起来需要大量代码修改，但通过一些注意，你可以以全局方式将其应用于应用程序。如果你有一个包含在每个页面中的中心脚本，你的脚本可以简单地监视传入的事件——例如，像`$_GET['newPost']`这样的变量——并通过删除缓存来响应。\n\
  \n![图片 121](img/index-412_1.png)\n\n![图片 122](img/index-412_2.jpg)\n\n\n\n\n所需的缓存文件。这使缓存文件删除机制集中化，更易于维护。你也可以考虑使用\
  \ `php.ini` 设置 `auto_prepend_file` 来将此代码包含到每个 PHP 脚本中。\n\n## 如何缓存函数调用？\n\n许多网站通过\
  \ SOAP 和 XML-RPC 等 Web 服务提供数据访问。9 由于 Web 服务通过网络访问，缓存结果以便在本地获取，而不是多次向服务器重复发送相同的慢速请求，通常是一个非常好的主意。一种简单的方法是使用\
  \ PHP 会话，但由于该解决方案基于每个访问者运行，每个访问者的首次请求仍然会很慢。\n\n## 解决方案\n\n假设你想创建一个列出亚马逊上所有 SitePoint\
  \ 书籍的网页。实际列表不太可能随时变化，那么为什么每次显示网页时都要向亚马逊 Web 服务发出请求呢？我们不会这样做！相反，我们可以利用 `Cache_Lite`\
  \ 来缓存 XML-RPC 请求的结果。\n\n### 需要 PEAR::SOAP 版本 0.11.0\n\n以下解决方案使用 `PEAR::SOAP` 库版本\
  \ 0.11.0 来访问亚马逊 Web 服务。你可以在 PEAR 网站上找到这个包。10\n\n以下是从远程亚马逊服务器获取数据的假设代码：\n\n```\n\
  $results = $amazonClient->ManufacturerSearchRequest($params);\n```\n\n使用 `Cache_Lite_Function`，我们可以缓存结果，以便重复使用从服务返回的数据；这将避免不必要的网络调用，并显著提高性能。\n\
  \n以下示例代码侧重于缓存方面，以免我们陷入使用亚马逊 Web 服务的细节中。你可以从 SitePoint 网站下载本书的代码存档，查看完整脚本。\n\n`Cache_Lite_Function`\
  \ 需要包含以下文件：\n\n`cachefunction.php` *(摘录)*\n\n```\nrequire_once 'Cache/Lite/Function.php';\n\
  ```\n\n我们使用一些选项实例化 `Cache_Lite_Function` 类：\n\n`cachefunction.php` *(摘录)*\n\n```\n\
  $options = array(\n    'cacheDir' => './cache/',\n    'fileNameProtection' => true,\n\
  \    'writeControl' => true,\n    'readControl' => true,\n    'readControlType'\
  \ => 'strlen',\n    'defaultGroup' => 'SOAP'\n);\n$cache = new Cache_Lite_Function($options);\n\
  ```\n\n重要的是将 `fileNameProtection` 选项设置为 `true`（这实际上是默认值，但在此例中我手动设置以强调这一点）。如果设置为\
  \ `false`，文件名将无效，因此数据不会被缓存。\n\n以下是我们如何调用 SOAP 客户端类的方法：\n\n`cachefunction.php` *(摘录)*\n\
  \n```\n$results = $cache->call('amazonClient->ManufacturerSearchRequest', $params);\n\
  ```\n\n如果是第一次发出请求，`Cache_Lite_Function` 会将结果作为序列化数组或对象存储在缓存文件中（你无需担心这一点），并且该文件将用于未来的请求，直到过期。`setLifeTime`\
  \ 方法再次用于指定缓存文件在刷新前应保留多长时间；目前使用的是默认值 3600 秒（一小时）。然后你可以像直接调用 Web 服务方法一样使用 `$results`\
  \ 变量。\n\n![Image 123](img/index-414_1.jpg)\n\n392\n\nPHP 文集\n\n示例脚本的输出如图 11.1 所示。\n\
  \n图 11.1. 亚马逊上的 SitePoint 书籍\n\n## 总结\n\n缓存是网站开发中一个重要但经常被忽视的方面。许多影响当今网站性能的因素——从复杂的动态页面生成到对网络上第三方数据的依赖——对于早期的网站来说都不是问题。在本章中，我们研究了\
  \ HTML 元标签、HTTP 头、PHP 输出缓冲和 `PEAR::Cache_Lite`，并了解了如何使用它们来控制网站内容的缓存，从而提高网站的可靠性和性能。\n\
  \n缓存\n\n393\n\n为你的网站实现缓存系统可能很简单，但最终取决于你的需求。如果你的网站流量大且主要是静态的（例如博客），并且通过内容管理系统管理，那么可能只需要很少的改动，但投入少量时间就能获得巨大的性能提升。对于更复杂的、基于每个用户生成内容的网站（如门户或购物车系统），设置缓存会稍微棘手且耗时，但好处仍然显而易见。无论如何，我希望本章的信息能让你很好地掌握可用的选项，并帮助你确定哪些技术最适合你的应用。\n\
  \n![Image 124](img/index-417_1.png)\n\n![Image 125](img/index-417_2.jpg)\n\n# 第\
  \ 12 章\n\n## XML 与 Web 服务\n\nPHP 5 中除了面向对象编程模型的变更外，最大的新增功能可能就是 DOM XML 扩展的重写、SimpleXML\
  \ 扩展的添加以及 SOAP 扩展的添加。\n\nPHP 5.1 引入了两个新的 XML 扩展：XMLReader 和 XMLWriter。\n\n在 PHP\
  \ 领域内，XML 和 Web 服务是广泛的主题，因为有许多工具可用于生成和使用 XML。\n\n整本书都致力于这些主题。1 在本章中，我们将探讨处理一些常见\
  \ XML 相关任务的有用解决方案，以及使用和提供基于 XML 的 Web 服务；其余部分由你自行探索！\n\n### 使用 Zend 框架\n\n本章中的许多示例使用了\
  \ Zend 框架的组件。2 安装该框架很简单：从 http://framework.zend.com/download/ 下载适当格式的压缩包，解压，并将你的\
  \ `include_path` 更新为指向安装目录的 library 目录。\n\n1 两个不错的资源包括 Rob Richards 的 *Pro PHP XML\
  \ and Web Services*（伯克利：Apress，2006）和 Thomas Myer 的 *No Nonsense XML Web Development\
  \ With PHP*（墨尔本：SitePoint，2005）。\n\n2 http://framework.zend.com/\n\n396\n\nPHP 文集\n\
  \n### PHP 5 中有哪些可用的 XML 技术？\n\nPHP 5 提供了许多新的 XML 扩展。你可以在 Zend Developer Network\
  \ 的文章“PHP 5 中的 XML：有什么新特性？”中了解新内容。3\n\n## 解决方案\n\n表 12.1 总结了 PHP 5 中可用的 XML 扩展。\n\
  \n### 为什么应该使用 PHP 的 XML 扩展而不是 PHP 字符串函数？\n\n如果 XML 主要是一种文本格式，为什么还要费心使用 XML 扩展？为什么不直接拼接字符串来创建文档，或者使用正则表达式来解析它们？\n\
  \n## 解决方案\n\n这个问题的答案是：出于性能、兼容性、灵活性和易用性的考虑。\n\n当然，XML 文档可以使用一系列正则表达式来解析。然而，PCRE 引擎相当重量级，并且没有针对此类任务进行优化。像\
  \ SimpleXML 和 XMLReader 这样的工具允许你轻松地遍历文档，只获取你需要的内容，而无需编写任何正则表达式。使用 SAX，你可以在文档中找到特定元素时触发代码执行。XSL\
  \ 可用于将 XML 文档转换为其他 XML 文档、XHTML、SQL 等。\n\n3 http://devzone.zend.com/node/view/id/1713/\n\
  \nXML 与 Web 服务\n\n397\n\n**表 12.1. PHP 中的 XML 扩展**\n\n| 扩展 | 用途 | 更多信息 |\n|-----------|---------|-----------------|\n\
  | SAX | 这组 PHP 函数用于创建 XML 解析器和 XML 事件处理器。自 PHP 4 起可用，默认启用。 | http://www.php.net/xml/\
  \ |\n| DOM | 这个面向对象扩展允许你使用文档对象模型（DOM）操作或创建 XML 文档。自 PHP 5.0.0 起可用，默认启用。 | http://www.php.net/dom/\
  \ |\n| XPath | | |\n\n\n\n\n\nXPath 内置于 DOM 扩展中，允许你对 XML 文档执行查询。自 PHP 5.0.0 起，它已成为\
  \ DOM 扩展的一部分。\n\n## XSL\n\n这是一个面向对象的扩展，用于对 DOM 文档执行可扩展样式表语言转换（XSLT），自 PHP 5.0.0\
  \ 起可用。通过向编译器传递 `--with-xsl` 参数即可启用。更多信息：http://www.php.net/xsl/\n\n## SimpleXML\n\
  \n这是一套面向对象的工具集，用于将 XML 转换为可迭代对象，从而允许使用常规属性选择器和数组访问来处理 XML。自 PHP 5.0.0 起可用，SimpleXML\
  \ 默认启用；某些特性在不同 PHP 版本间有所差异。更多信息：http://www.php.net/simplexml/\n\n## XMLReader\n\n\
  这是一个面向对象的扩展，用于逐个节点地遍历 XML 流，自 PHP 5.0.0 起在 PECL 中可用，自 PHP 5.1.0 起默认启用。更多信息：http://www.php.net/xmlreader/\n\
  \n## XMLWriter\n\n这个混合扩展使用函数或面向对象访问来创建 XML 文档。自 PHP 5.1.0 起在 PECL 中可用，自 PHP 5.1.4\
  \ 起默认启用。在早期版本中，通过向编译器传递 `--with-xmlwriter` 参数来启用。更多信息：http://www.php.net/xmlwriter/\n\
  \n**扩展** **用途** **更多信息**\n\n## XML-RPC\n\n这是一组函数，允许开发者编码和解码 XML-RPC 值，并创建使用 PHP\
  \ 函数和回调处理请求的 XML-RPC 服务器。自 PHP 4.1.0 起可用。通过向编译器传递 `--with-xmlrpc` 参数来启用。更多信息：http://www.php.net/xmlrpc/\n\
  \n## SOAP\n\nSOAP 扩展允许开发者轻松创建 SOAP 客户端或服务器，并将对象或函数绑定到客户端或服务器。自 PHP 5.0.0 起可用，通过向编译器传递\
  \ `--with-soap` 参数来启用。更多信息：http://www.php.net/soap/\n\n## 讨论\n\nXML 文档可以很容易地作为应用程序的标准输出或通过拼接字符串来编写。然而，你需要担心字符编码问题、可能影响文档有效性的字符拼写错误等。使用\
  \ DOM 或 XMLWriter 扩展等工具可以避免这些问题。\n\n### 如何解析 RSS 源？\n\nRSS 正成为一种无处不在的 Web 技术——大多数网站都提供其更新内容的\
  \ RSS 源，许多人将其作为与用户沟通的手段。你如何在自己的网站上整合其他网站的 RSS 源？\n\n## 解决方案\n\nSimpleXML 使解析 XML\
  \ 变得像遍历对象一样简单：我们无需检查元素的位置、名称和类型，只需访问元素即可。\n\n不过，要做到这一点，我们需要了解所解析 XML 的结构；由于 RSS\
  \ 是一个已发布的标准，使用 SimpleXML 解析它很容易。\n\n使用 SimpleXML 时需要注意的一点是，如果你想要访问的属性的实际值，必须先将其转换为适当的类型；否则，你将得到表示该值的\
  \ `SimpleXMLElement`。在下面的示例中，我们使用 `simplexml_load_file` 函数从 sitepoint.com 博客源加载\
  \ RSS，并输出某些元素的内容：\n\n**simplexml.php（节选）**\n\n```php\n$url = 'http://rss.sitepoint.com/f/sitepoint_blogs_feed';\n\
  $xml = simplexml_load_file($url);\n$channel = $xml->channel;\necho \"Title: \",\
  \ (string) $channel->title, \"\\n\",\n     \"Description: \", (string) $channel->description,\
  \ \"\\n\",\n     \"Link: \", (string) $channel->link, \"\\n\";\nforeach ($channel->item\
  \ as $item)\n{\n    echo \"Item: \", (string) $item->title, \"\\n\",\n         \"\
  Link: \", (string) $item->link, \"\\n\",\n         \"Description:\\n\", (string)\
  \ $item->description, \"\\n\";\n}\n```\n\n上面提供的 SimpleXML 解决方案只是你在 PHP 5 中可能使用的几种方法之一。让我们快速看看其他一些可能性，以展示\
  \ SimpleXML 的优雅之处。\n\n##### 使用 XMLReader 解析 XML\n\nXMLReader 是 PHP 领域的新成员，自 PHP\
  \ 5.1.0 起才可用。它允许使用面向对象表示法对 XML 文档进行迭代访问。然而，它更类似于 SAX 而非 DOM 或 SimpleXML，因为它提供了一种更程序化的方式来处理文档。\n\
  \n在这个示例中，我们将构建一个类——`Rss_XmlReader`——来封装使用 XMLReader 解析 RSS 源所需的函数。首先，我们定义一些类属性和构造函数方法：\n\
  \n**Rss_XmlReader.class.php（节选）**\n\n```php\nclass Rss_XmlReader\n{\n    public\
  \ $channelTitle = '';\n    public $channelDesc = '';\n    public $channelLink =\
  \ '';\n    public $items = array();\n    public $xml;\n\n    public function __construct($url\
  \ = null)\n    {\n        if (null !== $url)\n        {\n            $this->load($url);\n\
  \        }\n    }\n}\n```\n\n前三个属性保存 RSS 频道信息，`$items` 数组将保存指定源中的所有 RSS 条目，`$xml`\
  \ 将保存源的原始 XML 内容。构造函数接受一个参数：RSS 源的 URL。\n\n如果向构造函数提供了 URL，我们将立即加载并解析它。以下是 `load`\
  \ 方法的样子：\n\n**Rss_XmlReader.class.php（节选）**\n\n```php\npublic function load($url)\n\
  {\n    $this->xml = file_get_contents($url);\n    $xr = new XMLReader();\n    $xr->XML($this->xml);\n\
  \    $this->channelTitle = '';\n    $this->channelDesc = '';\n    $this->channelLink\
  \ = '';\n    $this->items = array();\n\n    while ($xr->read())\n    {\n       \
  \ if (XMLReader::ELEMENT == $xr->nodeType)\n        {\n            switch ($xr->localName)\n\
  \            {\n                case 'channel':\n                    $this->_getChannelInfo($xr);\n\
  \                    break;\n                case 'item':\n                    $this->_getItem($xr);\n\
  \                    break;\n            }\n        }\n    }\n}\n```\n\n使用 `file_get_contents`，我们获取原始\
  \ XML 内容，实例化一个新的 `XMLReader`，并开始读取 RSS 源。如前所述，XMLReader 要求我们遍历文档的每个节点——包括 XML 节点的文本元素。在加载过程中，我们遍历文档的顶层元素节点，如果当前节点是\
  \ channel，则读取频道信息。如果是 item 元素，则读取条目的详细信息。\n\n`_getChannelInfo` 方法从 channel 元素中读取频道信息：\n\
  \n**Rss_XmlReader.class.php（节选）**\n\n```php\nprotected function _getChannelInfo($xr)\n\
  {\n    while ($xr->read() && ($xr->depth == 2))\n    {\n        if (XMLReader::ELEMENT\
  \ == $xr->nodeType)\n        {\n            switch ($xr->localName)\n          \
  \  {\n                case 'title':\n                    $xr->read();\n        \
  \            $this->channelTitle = $xr->value;\n                    break;\n   \
  \             case 'description':\n                    $xr->read();\n          \
  \          $this->channelDesc = $xr->value;\n                    break;\n      \
  \          case 'link':\n                    $xr->read();\n                    $this->channelLink\
  \ = $xr->value;\n                    break;\n            }\n        }\n    }\n}\n\
  ```\n\n解析频道信息需要从 channel 元素中提取适当的节点，包括频道标题、描述和链接，并将它们存储在相应的对象属性中。\n\n解析条目与解析频道信息实际上并无不同——我们一次抓取一个\
  \ item 元素。唯一的区别是信息存储在 `$items` 数组中，以便后续迭代：\n\n**Rss_XmlReader.class.php（节选）**\n\n\
  ```php\nprotected function _getItem($xr)\n{\n    $title = '';\n    $link = '';\n\
  \    $desc = '';\n    $date = '';\n\n    while ($xr->read() && ($xr->depth > 2))\n\
  \    {\n        if (XMLReader::ELEMENT == $xr->nodeType)\n        {\n          \
  \  switch ($xr->localName)\n            {\n                case 'title':\n     \
  \               $xr->read();\n                    $title = $xr->value;\n       \
  \             break;\n                case 'description':\n                    $xr->read();\n\
  \                    $desc = $xr->value;\n                    break;\n         \
  \       case 'link':\n                    $xr->read();\n                    $link\
  \ = $xr->value;\n                    break;\n                case 'date':\n    \
  \                $xr->read();\n                    $date = $xr->value;\n       \
  \             break;\n            }\n        }\n    }\n\n    $this->items[] = array(\n\
  \        'title' => $title,\n        'link' => $link,\n        'desc' => $desc,\n\
  \        'date' => $date\n    );\n}\n```\n\n以下是我们的类使用示例：\n\n**xmlreader.php（节选）**\n\
  \n```php\n<?php\nrequire_once 'Rss_XmlReader.class.php';\n$rss = new Rss_XmlReader(\n\
  \    'http://rss.sitepoint.com/f/sitepoint_blogs_feed');\necho \"Title: \", $rss->channelTitle,\
  \ \"\\n\",\n     \"Description: \", $rss->channelDesc, \"\\n\",\n     \"Link: \"\
  , $rss->channelLink, \"\\n\";\nforeach ($rss->items as $item)\n{\n```\n\n\n\n\n\n\
  ```\necho \"Item: {$item['title']}\\nLink: \"\n\n. \"{$item['link']}\\nDescription:\\\
  n{$item['desc']}\\n\";\n\n}\n\n?>\n```\n\n现在所有工作都完成了，我们终于得到了与之前用 SimpleXML 展示的简单解决方案等价的结果。不幸的是，我们也做了更多的工作。\n\
  \n## 使用 Zend_Feed 的 SimpleXML\n\nRSS 源并非唯一可用的源，你可能希望以类似的方式访问多种源类型。`Zend_Feed` 是\
  \ Zend 框架的一个组件，它为 RSS 和 Atom 源提供了统一的接口。4 它本质上是一个使用 SimpleXML 的类，但通过消除强制类型转换的需要，简化了获取值的过程。下面是一个例子：**zendfeed.php\
  \ *(摘录)***\n\n```\nrequire_once 'Zend/Feed/Rss.php';\n\n$url = 'http://rss.sitepoint.com/f/sitepoint_blogs_feed';\
  \ $channel = new Zend_Feed_Rss($url);\n\n// 使用函数语法获取属性值\n\necho \"Title: \", $channel->title(),\
  \ \"\\n\",\n\n\"Description: \", $channel->description(), \"\\n\",\n\n\"Link: \"\
  , $channel->link(), \"\\n\"; 4 关于 Zend_Feed 的文档，请参见 http://framework.zend.com/manual/en/zend.feed.html。\n\
  \n404\n\nPHP 文集\n\nforeach ($channel as $item)\n\n{\n\necho \"Item: \", $item->title(),\
  \ \"\\n\",\n\n\"Link: \", $item->link(), \"\\n\",\n\n\"Description:\\n\", $item->description(),\
  \ \"\\n\";\n\n}\n```\n\n## 讨论\n\n如你所见，使用 SimpleXML 或 `Zend_Feed` 比我们使用 `XMLReader`\
  \ 时创建自己的解析器要简单得多。使用 `Zend_Feed` 的方法与使用 SimpleXML 的方法差别不大；它只是消除了执行类型转换的需要。那么，我们为什么还要费心使用\
  \ `XMLReader` 呢？\n\n在 PHP 4 时代，解析 RSS 源等格式的 XML 几乎总是使用 SAX 完成，除非是使用简单的正则表达式。DOM\
  \ XML 扩展在 PHP 4 场景中来得较晚，并且没有包含在核心发行版中，因此在 PHP 4 用户中并不流行。此外，大多数 PHP 4 书籍都演示了使用 SAX\
  \ 进行 XML 解析，这导致许多开发者在需要 XML 解析时都使用 SAX。\n\n然而，情况已经发生了变化，现在我们在 PHP 5 中有多种解析 XML 的选项。\n\
  \n如果你要解析大型文档，SAX 仍然是一个不错的选择，因为它逐个元素地解析，使 PHP 保持较低的内存占用。然而，由于它逐个元素解析，并且要求开发者在几乎每个元素级别定义回调，因此使用起来相当不直观，开发者往往陷入跟踪元素名称和引用的细节中。如果你觉得上面的\
  \ `XMLReader` 示例难以理解，那么 SAX 示例会让你完全迷失。\n\n`XMLReader` 结合了 SAX 的低内存占用优势和 SimpleXML\
  \ 的某些简单性。与 SAX 一样，`XMLReader` 使用拉取技术，这意味着它在读取文档时增量解析。然而，与 SAX 不同，你不需要为元素指定处理程序；实际上，在单个循环中解析文档相对简单。使用\
  \ `XMLReader` 的主要好处是性能；由于 `XMLReader` 在流上操作，而不是将整个 XML 文档加载到内存中，它可以用很小的内存占用完成大量处理。\n\
  \nDOM 函数也可用于导航 XML。5 这个选项有一个特性使其成为许多情况下的绝佳选择：XPath 集成。XPath 允许你按路径在文档中搜索节点——当你希望从\
  \ XML 文档中有选择地提取数据时，这是一种极好的技术。然而，DOM 函数使得像 SimpleXML 那样轻松地遍历元素变得相对困难；对于像解析 RSS 源这样简单的情况，它们完全是杀鸡用牛刀。当你需要执行更复杂的任务（例如原地修改\
  \ XML 文档）时，请使用 DOM。\n\n关于如何解析 XML 的最佳答案是使用 SimpleXML，或者使用包装它的库，例如 `Zend_Feed`。将\
  \ XML 文档视为原生 PHP 对象的简单性怎么强调都不为过。此外，由于它建立在 DOM 扩展之上，它内置了 XPath 支持，并且你可以随时使用 `dom_import_simplexml`\
  \ 函数将 `SimpleXMLElement` 转换为 `DOMElement`。6\n\n## 如何生成 RSS 源？\n\n虽然了解如何解析 RSS 源很好，但毫无疑问，在某个时候你会想要生成自己的\
  \ RSS 源。你可以使用 PHP 5 中的哪些 XML 技术来生成 RSS 源？\n\n## 解决方案\n\n所有解决方案都使用以下数据定义来生成 RSS 源（你可以在代码存档中找到完整文件）：**rsssource.php.inc\
  \ *(摘录)***\n\n```\n$baseUrl = 'http://example.com/extensions/xml/';\n\n$extensions\
  \ = array(\n\n1 => array(\n\n'title'\n\n=> 'SAX',\n\n'description' => 'ext/xml 提供了一个\
  \ SAX XML 解析器生成器',\n\n'link'\n\n=> $baseUrl . 'sax'\n\n5 http://www.php.net/dom/\n\
  \n6 http://www.php.net/dom_import_simplexml/\n\n406\n\nPHP 文集\n\n),\n\n2 => array(\n\
  \n'title'\n\n=> 'DOM',\n\n'description' => 'DOM 扩展提供了 DOM（文档对象模型）的实现',\n\n'link'\n\
  \n=> $baseUrl . 'dom'\n\n),\n\n3 => array(\n\n'title'\n\n=> 'XPath',\n\n'description'\
  \ => 'XPath 用于查询 XML 文档中的元素',\n\n'link'\n\n=> $baseUrl . 'xpath'\n\n)\n\n⋮ *更多数组项紧随其后…*\n\
  \n);\n```\n\n由于 SimpleXML 能够将对象属性映射到 XML 元素，因此它可以非常轻松地快速生成 XML 文档：\n\n**rss_simplexml.php\
  \ *(摘录)***\n\n```\nrequire 'rsssource.php.inc';\n\n$rss = new SimpleXMLElement(\n\
  \n'<?xml version=\"1.0\" encoding=\"UTF-8\" ?>' .\n\n'<rss version=\"2.0\"></rss>');\n\
  \n$rss->addChild('channel');\n\n$rss->channel->addChild('title', 'PHP XML 扩展');\
  \ $rss->channel->addChild('description',\n\n'使用 PHP XML 扩展的信息和示例'); $rss->channel->addChild('link',\n\
  \n'http://example.com/extensions/xml/');\n\nforeach ($extensions as $extension)\n\
  \n{\n\n$item = $rss->channel->addChild('item');\n\n$item->addChild('title', $extension['title']);\n\
  \n$item->addChild('description', $extension['description']); $item->addChild('link',\
  \ $extension['link']);\n\n}\n\necho $rss->asXML();\n```\n\n我们之前使用 SimpleXML 解析 XML；在\
  \ PHP 5.1.3 及更高版本中，它也可以用于生成 XML（而不仅仅是修改现有 XML）。它没有提供 DOM 所提供的全套工具，但你始终可以使用 `dom_import_simplexml`\
  \ 将 `SimpleXMLElement` 转换为 `DOMElement`。\n\n与解析 XML 的任务一样，生成 XML 的方法不止一种；其他选项包括\
  \ DOM 和 `XMLWriter`。\n\n### 使用 DOM 生成 XML\n\n**DOM**（文档对象模型）允许你以树状结构遍历 XML，向下查看子节点，向上查看父节点，以及横向查看兄弟节点。由于它支持\
  \ XML 的全部范围，因此 DOM 是生成 XML 结构的绝佳全能选择：**rss_dom.php *(摘录)***\n\n```\nrequire 'rsssource.php.inc';\n\
  \n$document = new DOMDocument('1.0', 'UTF-8');\n\n$rss = $document->createElement('rss');\n\
  \n$rss->setAttribute('version', '2.0');\n\n$channel = $document->createElement('channel');\n\
  \n$title = $document->createElement('title', 'PHP XML 扩展'); $description = $document->createElement('description',\n\
  \n'使用 PHP XML 扩展的信息和示例'); $link = $document->createElement('link',\n\n'http://example.com/extensions/xml/');\n\
  \n$channel->appendChild($title);\n\n$channel->appendChild($description);\n\n$channel->appendChild($link);\n\
  \nforeach ($extensions as $extension)\n\n{\n\n$item = $document->createElement('item');\n\
  \n$title = $document->createElement('title', $extension['title']); $description\
  \ = $document->createElement('description', $extension['description']);\n\n$link\
  \ = $document->createElement('link', $extension['link']); $item->appendChild($title);\n\
  \n$item->appendChild($description);\n\n$item->appendChild($link);\n\n$channel->appendChild($item);\n\
  \n}\n```\n\n\n\n\n\n# 408 PHP 文集\n\n## 使用 XMLWriter 生成 XML\n\n`XMLWriter` 是 `XMLReader`\
  \ 的同类。它允许你逐个元素地迭代编写 XML 文档，并且可以写入内存或直接写入 URL。7\n\n`XMLWriter` 接口可以通过 OOP 或过程式函数调用来访问：\n\
  \n### `rss_xmlwriter.php`（节选）\n\n```php\nrequire 'rsssource.php.inc';\n\n$xw = new\
  \ xmlWriter();\n\n$xw->openMemory(); // 使用 openUri() 可直接输出到文件\n$xw->startDocument('1.0',\
  \ 'UTF-8');\n\n$xw->startElement('rss');\n\n$xw->startElement('channel');\n\n$xw->writeElement('title',\
  \ 'PHP XML Extensions');\n$xw->writeElement('description',\n    'Information and\
  \ examples for using the PHP XML extensions');\n$xw->writeElement('link', 'http://example.com/extensions/xml/');\n\
  foreach ($extensions as $extension)\n{\n    $xw->startElement('item');\n    $xw->writeElement('title',\
  \ $extension['title']);\n    $xw->writeElement('description', $extension['description']);\n\
  \    $xw->writeElement('link', $extension['link']);\n    $xw->endElement(); // item\n\
  }\n\n$xw->endElement(); // channel\n$xw->endElement(); // rss\n\n$xml = $xw->outputMemory(true);\n\
  echo $xml;\n```\n\n## 讨论\n\n虽然生成 XML 最简单的解决方案可能是拼接字符串或使用模板系统，但这两种方法都有一个显著的缺点：它们很容易意外地混合字符编码，或者引入多余的标签或保留的\
  \ XML 实体，从而产生无效的 XML。更好的解决方案 7 是使用 `DOM`、`SimpleXML` 或 `XMLWriter` 扩展，它们会自动处理这些问题。\n\
  \n`XMLWriter` 是一个相对较新的扩展，如果你需要顺序生成 XML 内容，它会非常有用。如果你有一个相当扁平的树形结构，这是一个很好的选择，因为这种方法几乎和拼接字符串或使用模板系统一样简单，同时还能保护你免受编码问题和格式不正确的\
  \ XML 的影响。如果你正在创建大型文档，`XMLWriter` 也是一个很好的选择，因为它能够直接将文档写入磁盘，而不是保存在内存中。这种方法有助于避免像\
  \ `DOM` 和 `SimpleXML` 这类完全在内存中运行的重量级扩展所遇到的内存问题。缺点是你必须自己关闭元素，并跟踪你在树中的位置才能使用此功能。最好的做法是使用代码缩进和注释来跟踪你在树中的位置。\n\
  \n`DOM` 允许你从内到外构建文档，反之亦然。然而，你会很快陷入困境，试图记住你当前所在的节点以及它是否有子节点或父节点，因为你需要操作单个 `DOMElements`。从代码中很难直观地看到整个树结构。因此，当你需要修改现有的\
  \ XML 时，最好使用 `DOM`。\n\n正如我们在这些示例中所看到的，`SimpleXML` 允许你构建 XML 文档以及读取它们。它对 XML 的对象映射使得在代码中创建可视化的树变得非常容易，并且它与\
  \ `DOM` 的关联意味着一旦你创建了结构，就可以使用 `DOM` 轻松地操作文档，以设置必要的编码和命名空间。`SimpleXML` 和 `DOM` 的组合应该成为你在\
  \ PHP 5 中 XML 工具箱里的瑞士军刀。\n\n## 如何在 XML 中搜索节点或内容？\n\n通常，你只需要从某个特定的 XML 文档中获取少量信息。你是否应该解析整个文档来找到这些元素？例如，如果你只需要一组共享某个元素名称的兄弟节点，该怎么办？\n\
  \n## 解决方案\n\n解决方案很简单：使用 `XPath`。**XPath**，即 XML 路径语言，允许你使用类似 URL 的路径表示法来搜索文档的逻辑结构。它最初是为了辅助\
  \ XSL 转换而开发的，但还有许多其他用途。`DOM` 扩展内置了对 `XPath` 的支持；`SimpleXML` 也是如此。下面是一个使用 `DOM` 扩展的示例：\n\
  \n#### `xpath_dom.php`（节选）\n\n```php\n$doc = new DOMDocument;\n$doc->preserveWhiteSpace\
  \ = false;\n$doc->load('http://rss.sitepoint.com/f/sitepoint_blogs_feed');\n$xpath\
  \ = new DOMXPath($doc);\n$titles = $xpath->query('//item/title');\nforeach ($titles\
  \ as $title)\n{\n    echo $title->nodeValue, \"\\n\";\n}\n```\n\n这个示例加载了 SitePoint\
  \ 博客的 RSS 源，并使用 XPath 查询 `//item/title` 从所有 `item` 元素中选择 `title` 元素。\n\n下面是一个使用\
  \ `SimpleXML` 的类似解决方案：\n\n#### `xpath_simplexml.php`（节选）\n\n```php\n$doc = new SimpleXMLElement(\n\
  \    'http://rss.sitepoint.com/f/sitepoint_blogs_feed',\n    null,\n    true\n \
  \   // 告诉 SimpleXML 我们提供了一个 URL\n);\n\n// 搜索父元素为 item 的 title\nforeach ($doc->xpath('//item/title')\
  \ as $title)\n{\n    echo $title, \"\\n\";\n}\n```\n\n## 讨论\n\n`XPath` 完全可以作为一整章甚至一本书的主题。以下讨论仅作为最简短的介绍；关于该主题的完整文档，请查看\
  \ W3C 的 XPath 规范。8 9\n\n`XPath` 遵循一系列规则，其中最基础的是：正斜杠 `/` 用作 XML 树层次结构中不同层级之间的路径分隔符。在上面的示例中，我们只查找作为\
  \ `item` 元素子元素的 `title` 节点：`item/title`。为了告诉 `XPath` 这是一个相对路径，并且我们不想从根节点开始搜索，我们在路径前加上双斜杠\
  \ `//`。同样的数据也可以使用元素的完整路径来查询：`/rss/channel/item/title`。\n\n使用 `XPath` 的最基本规则是：\n\n\
  - 正斜杠 `/` 是路径分隔符。\n- 从根节点开始的绝对路径以单个正斜杠 `/` 开头。\n- 从给定位置开始的相对路径可以以其他任何内容开头。\n- 匹配文档中任意深度的元素的相对路径以两个正斜杠\
  \ `//` 开头。\n- 双点 `..` 表示节点的父节点。\n- 单点 `.` 表示当前节点。\n\n`XPath` 还允许你匹配元素属性、结果集中的特定项，甚至元素的值：\n\
  \n- 使用 `[NODE=\"\"]` 匹配值，其中 `NODE` 是节点名称或指示符（如 `.` 或 `..`）。\n- 使用 `@ATTR` 匹配属性，可以作为路径表达式的一部分，也可以作为节点的修饰符（例如\
  \ `item/@type`、`item[@type]`、`item[@type='']`）。\n- 使用方括号匹配返回的节点列表中的特定元素（例如 `//item/title[2]`）；注意索引从\
  \ 1 开始。\n\n举个例子，在我撰写本文的当天，SitePoint 博客的 RSS 源中有一条标题为“News Wire: Liquid vs. Fixed”的条目。要获取这个\
  \ `item` 元素，我可以使用以下代码：\n\n```php\n// 假设 $doc 是一个 SimpleXMLElement\n$item = $doc->xpath(\n\
  \    '//item/title[.=\"News Wire: Liquid vs. Fixed\"]/..');\n```\n\n这几行代码通过匹配以下条件返回\
  \ `item` 节点及其子节点：\n\n- 所有 `item` 元素（`//item`）\n- 这些元素有一个 `title` 子元素（`/title`）\n\
  - 该子元素的值为“News Wire: Liquid vs. Fixed”（`[.=\"News Wire: Liquid vs. Fixed\"]`）\n\
  - 并返回父元素 `item`（`/..`）\n\n还允许使用几种通配符：\n\n- `*` 匹配任何元素节点（不是文本或属性节点）。\n- `node()`\
  \ 匹配任何类型的节点。\n- `@*` 匹配任何属性。\n\n\n\n\nXPath 的功能远不止于此，还包括运算符和一组用于在路径中匹配和操作字符串的函数。如果你需要搜索\
  \ XML 文档，掌握 XPath 将是一项非常有用的技能。\n\n## 如何消费 XML-RPC Web 服务？\n\n**XML-RPC** 是一种基于 XML\
  \ 的协议，用于执行远程过程调用——本质上，就是在远程机器上调用函数和方法的过程。XML-RPC 规范定义了一种简单的结构，用于在服务器上调用一个方法，该方法可以接受一个或多个指定类型的参数，并返回一个单一值——就像\
  \ PHP 函数一样。[¹⁰] 有关 XML-RPC 的更多信息，请访问 XML-RPC 官方网站。[¹¹]\n\n[¹⁰]: http://www.xmlrpc.com/spec/\n\
  [¹¹]: http://www.xmlrpc.com/\n\nXML 与 Web 服务 413\n\nXML-RPC 也使用了命名空间的概念。命名空间允许单个服务器提供多组相关方法，从而确保方法名不会发生冲突。一个原型\
  \ XML-RPC 方法调用可能如下所示：`struct lookup.state(string)`\n\n这个调用表明 `lookup` 命名空间的 `state`\
  \ 方法期望一个字符串作为参数，并返回一个结构体（关联数组）作为响应。使用 Zend Framework 的 `Zend_XmlRpc_Client` 的实际调用可能如下所示：`$info\
  \ = $client->lookup->state('Vermont');`\n\nXML-RPC 是 Web 服务的鼻祖，其简洁性吸引了许多开发者；借助大多数语言中可用的客户端，我们只需传入原生值，就能收到原生值作为响应。\n\
  \n那么，现在你已经了解了 XML-RPC；如何消费一个 XML-RPC 服务呢？\n\n## 解决方案\n\nZend Framework 提供了一个 XML-RPC\
  \ 实现，包括客户端和服务器。它的接口完全是面向对象的，因此是面向对象编程爱好者的不错选择；特别是，它能够将命名空间链接到方法，使得使用起来非常直观。例如，下面是一个简单的\
  \ XML-RPC 客户端脚本，它使用了“如何提供自己的 XML-RPC Web 服务？”中的 XML-RPC 服务器。\n\n该服务器暴露了一个 `math`\
  \ 命名空间，包含两个方法：`add` 和 `multiply`：\n\n`zend_xmlrpc_client.php` *(摘录)*\n\n```php\n\
  require_once 'Zend/XmlRpc/Client.php';\n\ntry\n{\n    $client = new Zend_XmlRpc_Client(\n\
  \        'http://localhost/phpant2/chapter_12/examples/' .\n        'zend_xmlrpc_serv.php');\n\
  \    $proxy = $client->getProxy();\n    $add = $proxy->math->add(array(1,2));\n\
  \    $mult = $proxy->math->multiply(array(21343243346,989554365486));\n    echo\
  \ '1 + 2 = ' . $add . \"<br />\";\n    echo '21343243346 * 989554365486 = ' . $mult;\n\
  }\ncatch (Zend_XmlRpc_Client_FaultException $e)\n{\n    echo $e->getMessage();\n\
  }\n```\n\n我们首先用 Web 服务的 URL 实例化 `Zend_XmlRpc_Client` 对象。上面使用的 URL 仅适用于我们的测试环境，因此如果你要测试这个脚本，请务必将其改为合适的替代地址。然后，`Zend_XmlRpc_Client`\
  \ 允许我们像调用 PHP 方法一样直接调用 Web 服务，例如 `$proxy->math->add`。\n\n就是这么简单；`Zend_XmlRpc_Client`\
  \ 及其命名空间代理使得调用 XML-RPC 方法就像调用对象方法一样简单。[¹²] 我们传入原生 PHP 值作为方法参数，并得到 PHP 值作为返回。还有什么比这更简单的呢？\n\
  \n[¹²]: http://framework.zend.com/manual/en/zend.xmlrpc.html\n\n## PHP 的原生 XML-RPC\
  \ 扩展\n\n如果你不想安装 Zend Framework，还有其他选择吗？\n\nPHP 有一个原生的 XML-RPC 扩展 `ext/xmlrpc`，可以通过\
  \ `--with-xmlrpc` 指令编译，或者通过 PECL 安装。它被标记为实验性扩展，因此在生产环境中使用可能存在风险，尽管它自 PHP 4 早期版本以来就已经可用。它提供了编码和解码\
  \ XML-RPC 值、创建 XML-RPC 请求和响应、以及将 XML-RPC 服务器绑定到 PHP 回调的函数。\n\n一个基本的请求使用 `xmlrpc_encode_request`\
  \ 函数：\n\n```php\n$request = xmlrpc_encode_request($methodName, $valuesArray);\n\
  ```\n\n这里，`$methodName` 是被请求的 XML-RPC 方法，`$valuesArray` 是要作为参数传递给请求的值数组。如果需要指定 XML\
  \ 编码，可以传入可选的第三个参数——一个关联数组——包含一些选项：\n\n```php\n$request = xmlrpc_encode_request(\n\
  \    $methodName,\n    $valuesArray,\n    array('encoding' => 'UTF-8')\n);\n```\n\
  \n返回的 `$request` 是可用于发起请求的 XML。\n\n请注意，某些 XML-RPC 类型在 PHP 中没有直接对应的类型；要使用这些类型，你需要使用\
  \ `xmlrpc_set_type` 函数告诉 `ext/xmlrpc` 如何编码它们。然后这些值可以直接传递给 `xmlrpc_encode_request`\
  \ 函数：\n\n```php\n$date = xmlrpc_set_type('2006-12-01', 'datetime');\n$base64 = xmlrpc_set_type($base64EncodedData,\
  \ 'base64');\n$request = xmlrpc_encode_request(\n    $methodName,\n    array($date,\
  \ $base64, $assocArray),\n    array('encoding' => 'UTF-8')\n);\n```\n\n例如，下面是一个简单的\
  \ XML-RPC 客户端脚本，它使用了 `ext/xmlrpc` 和我们在“如何提供自己的 XML-RPC Web 服务？”中看到的 XML-RPC 服务器：\n\
  \n`ext_xmlrpc_client.php` *(摘录)*\n\n```php\ntry\n{\n    $request = xmlrpc_encode_request(\n\
  \        'math.add',\n        array(array(1,2)),\n        array('encoding' => 'UTF-8')\n\
  \    );\n    $context = stream_context_create(array('http' => array(\n        'method'\
  \ => \"POST\",\n        'header' => \"Content-Type: text/xml\",\n        'content'\
  \ => $request\n    )));\n    $file = file_get_contents(\n        'http://localhost/phpant2/chapter_12/examples/'\
  \ .\n        'zend_xmlrpc_serv.php', false, $context);\n    if(!file) {\n      \
  \  throw new Exception('Unable to get response from web service');\n    }\n    $response\
  \ = xmlrpc_decode($file);\n    if (is_array($response) && xmlrpc_is_fault($response))\n\
  \    {\n        throw new Exception($response['faultString'],\n            $response['faultCode']);\n\
  \    }\n    echo '1 + 2 = ' . $response;\n}\ncatch (Exception $e)\n{\n    echo $e->getMessage();\n\
  }\n```\n\nPHP 的 `ext/xmlrpc` 扩展完成了大部分工作，抽象了编码和解码值、请求和响应的基本 XML-RPC 功能。然而，你需要自己创建实际的数据交换传输，就像上面我们用\
  \ `file_get_contents` 函数所做的那样。这种方法远不如 `Zend_XmlRpc_Client` 那样简洁，除非你围绕它编写自己的类包装器。\n\
  \n## 如何提供自己的 XML-RPC Web 服务？\n\nXML-RPC 服务器在指定地址监听 HTTP POST 请求，并使用 `text/xml` Content-Type\
  \ 头在响应内容中返回 XML。错误通过 XML-RPC 故障响应报告，该响应是一个包含 `faultCode` 和 `faultString` 元素的 XML\
  \ 结构体响应。\n\n让我们看看解码传入请求、分发请求并返回有效响应的过程涉及哪些内容。\n\n## 解决方案\n\n`Zend_XmlRpc_Server`\
  \ 类允许你将类或函数绑定到服务器，并可选择命名空间；[¹³] 然后它使用反射 API 以及开发者创建的、描述函数或类方法的 phpDocumentor 文档块，[¹⁴]\
  \ 来确定 XML-RPC 原型。使用这种方法需要注意的是，你必须在文档块中使用 XML-RPC 类型来描述参数和返回值。\n\n`Zend_XmlRpc_Server`\
  \ 与 Zend Framework 中的所有服务器类一样，遵循 PHP 的 `SoapServer` API，这使得接口在不同协议实现之间保持一致。\n\n\
  例如，下面是一个简单的 `Math` 类，包含两个方法 `add` 和 `multiply`，我们可以为其构建一个服务器：\n\n`Math.class.php`\
  \ *(摘录)*\n\n```php\n/**\n * Math methods\n */\nclass Math\n{\n    /**\n     * Return\
  \ the sum of all values in an array\n     *\n     * @param array $values An array\
  \ of values to sum\n     * @return int\n     */\n    public static function add($values)\n\
  \    {\n        return array_sum($values);\n    }\n\n    /**\n     * Return the\
  \ product of all values in an array\n     *\n     * @param array $values An array\
  \ of values to multiply\n     * @return int\n     */\n    public static function\
  \ multiply($values)\n    {\n        return array_product($values);\n    }\n}\n```\n\
  \n[¹³]: http://framework.zend.com/manual/en/zend.xmlrpc.html\n[¹⁴]: XML 与 Web 服务\
  \ 417\n\n\n\n\n14 http://www.phpdoc.org/\n\nPHP 文集\n\n现在，让我们构建 XML-RPC 服务器，并且为了稳妥起见，再创建一个用于获取\
  \ XML-RPC 服务器信息的函数：\n\n`zend_xmlrpc_serv.php` *(摘录)*\n\n```\nrequire_once 'Zend/XmlRpc/Server.php';\n\
  require_once 'Math.class.php';\n\n/**\n * Get some info from the server\n *\n *\
  \ @return struct\n */\nfunction getInfo()\n{\n    return array(\n        'publisher'\
  \ => 'SitePoint',\n        'title' => 'The PHP Anthology'\n    );\n}\n\n$server\
  \ = new Zend_XmlRpc_Server();\n// Math class methods will be available in the 'math'\
  \ namespace\n$server->setClass('Math', 'math');\n// getInfo() function will be available\
  \ as server.getInfo\n$server->addFunction('getInfo', 'server');\n// Handle a request\n\
  echo $server->handle();\n```\n\n此示例中的 `Zend_XmlRpc_Server` 实例将提供三个方法：`math.add`、`math.multiply`\
  \ 和 `server.getInfo`，此外还有几个可用于获取服务器信息的系统方法。它会自动检查传入请求，确保它们符合各种方法签名，如果不符合则抛出错误响应，并返回\
  \ XML-RPC 响应以及所需的标头。你无需修改代码来适应服务器类的要求；服务器会适应你的代码。\n\n你*需要*为每个要提供的方法或函数编写 phpDocumentor\
  \ 文档块，并确保它们包含 `@param` 和 `@return` 标签；服务器使用这些标签来创建方法签名，并将传入参数的类型和数量与这些签名进行比较，以确保传入请求符合定义。此外，这些标签指定的类型应符合\
  \ XML-RPC 类型定义；例如，关联数组使用 `struct`，日期使用 `dateTime.iso8601`，等等。\n\n## PHP 原生 XML-RPC\
  \ 扩展\n\n使用 `Zend_XmlRpc_Server` 提供 XML-RPC 服务就像在 PHP 5 中提供 SOAP 请求一样简单：只需向服务器注册一个类或函数，然后处理它即可。但除了\
  \ `Zend_XmlRpc_Server`，我们还有哪些选择？\n\n`ext/xmlrpc` 也可用于构建 XML-RPC 服务器。我们只需使用 `xmlrpc_server_create`\
  \ 创建一个 XML-RPC 服务器，将回调函数注册到 XML-RPC 方法名，获取请求，处理它，然后发送响应。例如，让我们尝试提供以下方法和函数：\n\n`ext_xmlrpc_serv.php`\
  \ *(摘录)*\n\n```\n/**\n * Math methods\n */\nclass Math\n{\n    /**\n     * Return\
  \ the sum of all values in an array\n     *\n     * @param array $values An array\
  \ of values to sum\n     * @return int\n     */\n    public static function add($method,\
  \ $params)\n    {\n        return array_sum($params[0]);\n    }\n}\n\n/**\n * Return\
  \ the product of some values\n *\n * @param string $method The XML-RPC method name\
  \ called\n * @param array $params Array of parameters from the request\n * @return\
  \ int\n */\nfunction product($method, $params)\n{\n    return array_product($params);\n\
  }\n```\n\n现在我们已经创建了这些定义，接下来将它们注册到 XML-RPC 服务器：\n\n`ext_xmlrpc_serv.php` *(摘录)*\n\
  \n```\n$server = xmlrpc_server_create();\nxmlrpc_server_register_method($server,\
  \ 'math.add', array('Math', 'add'));\nxmlrpc_server_register_method($server, 'product',\
  \ 'product');\n```\n\n现在我们需要获取请求、调度它并返回响应：\n\n`ext_xmlrpc_serv.php` *(摘录)*\n\n```\n\
  $request = file_get_contents('php://input');\n$response = xmlrpc_server_call_method($server,\
  \ $request, null);\nheader('Content-Type: text/xml');\necho $response;\n```\n\n\
  如果你仔细检查这个示例，会发现函数和方法调用必须遵循特定的签名；具体来说，它们只能接受两个参数：请求的 `$method` 和请求的 `$params`。这意味着如果你想使用\
  \ `ext/xmlrpc` 创建 XML-RPC 服务器，你必须要么将所有方法处理程序编写为符合此规范，要么为现有方法编写包装器，要么编写一个调度器来使用原始参数顺序调度方法调用——所有这些工作都超出了本讨论的范围。\n\
  \n更简单的方法是使用一个能为你实现这些魔法的 XML-RPC 服务器。PEAR 的 `XML_RPC2` 和 `Zend_XmlRpc` 就是两个这样的实现。`Zend_XmlRpc`\
  \ 使 XML-RPC 成为一流的面向对象公民，简化了发起请求和提供响应的过程，并允许任何函数或类方法作为服务器处理程序使用。\n\n## 如何使用 SOAP\
  \ Web 服务？\n\n**SOAP**，最初是简单对象访问协议（Simple Object Access Protocol）的缩写，但现在只是一个协议名称，引用规范中的话来说，它是“一种轻量级协议，旨在分布式、分散的环境中交换结构化信息”。SOAP\
  \ 提供了极大的灵活性和可扩展性。\n\n与本节讨论的其他协议一样，SOAP 使用 XML 在客户端和服务器之间传输消息。传输的基本消息单元是一个对象。服务器需要指定可用的方法和属性，并将该规范提供给客户端，以便客户端能够发起请求。这种规范是通过\
  \ **WSDL**（Web 服务描述语言）规范实现的。\n\nSOAP 和 WSDL 规范以难以解读而著称。开发者之间的普遍共识是使用 WSDL 开发工具从应用程序类生成\
  \ WSDL，并使用语言提供的客户端和服务器进行实际的 SOAP 通信。幸运的是，PHP 5 有原生的 `SoapClient` 和 `SoapServer`\
  \ 类，并且用于生成 WSDL 的工具也在不断涌现。\n\n使用基于 SOAP 的 Web 服务这一主题非常广泛，我们无法在本书中详细讨论，但这里提供一个简单的介绍。\n\
  \n## 解决方案\n\n使用 PHP 5 的 `SoapClient` 类非常简单：\n\n```\n$client = new SoapClient($uriToWsdl,\n\
  \    array('location' => $uriToSoapService));\n$result = $client->SomeMethod($value1,\
  \ $value2);\n```\n\n当然，`SoapClient` 类还有更多功能，但基本用法就是这样：通过将 WSDL 规范的 URL 和 SOAP 服务的位置作为参数传递给\
  \ `SoapClient` 构造函数来创建 `SoapClient` 实例，然后开始调用。`SoapClient` 将 SOAP 服务的所有方法作为 PHP\
  \ 方法提供。\n\n如果你想将 SOAP 请求的结果拉取到对象中呢？没问题！你可以轻松地将 SOAP 响应映射到 PHP 类。下面是一个使用图书信息服务的假设示例。SOAP\
  \ 服务提供了一个 `getBookInfo` 方法。如果我们传递一个 `$id` 值，它将返回一个表示图书的响应，其中包含 `author`、`title`、`date`\
  \ 和 `publisher` 属性。该响应在 Web 服务的 WSDL 文件中被定义为 `Book` 类型。如果我们已经在 PHP 应用程序中有一个图书对象（我们称之为\
  \ `MyBook`），我们可以将 SOAP 响应类型映射到我们自己的 `MyBook` 对象。首先，定义我们的 `MyBook` 类：\n\n```\nclass\
  \ MyBook\n{\n    public $author;\n    public $title;\n    public $date;\n    public\
  \ $publisher;\n}\n```\n\n当我们实例化 `SoapClient` 对象时，添加一个 `classmap` 选项，将 WSDL 的 `Book`\
  \ 类型映射到我们的 `MyBook` PHP 类：\n\n```\n$client = new SoapClient($uriToWsdl, array(\n\
  \    'location' => $uriToSoapService,\n    'classmap' => array('Book' => 'MyBook')\n\
  ));\n```\n\n现在，当我们调用通常返回 SOAP 对象类型的 SOAP 方法时，我们将收到一个 PHP 类的实例：\n\n```\n$book = $client->GetBookInfo($id);\
  \ // $book 是一个 MyBook 实例\necho $book->title;\n```\n\n当 `SoapClient` 将一个类绑定到 SOAP\
  \ 响应时，它会在对象中设置所有在响应中找到匹配项的公共属性。由于返回的对象实例是一个标准的 PHP 对象，你还可以在类中定义用于访问或转换 SOAP 数据的方法。\n\
  \n## 讨论\n\n\n\n\n\n## XML 与 Web 服务\n\n假设远程服务已定义了 WSDL 规范，那么在 PHP 5 中向 SOAP 服务发起请求就变得异常简单。将对象绑定到响应的灵活性为处理远程数据提供了巨大的可能性。如果你之前对\
  \ SOAP 感到畏惧，但又熟悉 OOP，那么现在完全不必再担心了！\n\n## 如何提供 SOAP Web 服务？\n\n在“如何使用 SOAP Web 服务？”一节中，你已经通过使用一些\
  \ SOAP 服务浅尝了 SOAP 的滋味，现在你可能会想下一步是创建自己的服务。你已经有了一些看起来合适的类，那么如何公开它们的 API 呢？\n\n## 解决方案\n\
  \n提供 SOAP 服务与使用客户端大致一样简单：使用 `SoapServer`。创建基于 SOAP 的 Web 服务是一个广泛的领域，我们无法在本书中详细讨论，但让我们通过一个简单的例子来了解基本思路。\n\
  \n首先，定义一个名为 `Book` 的书籍类：\n\n```php\nclass Book\n{\n    public $author;\n    public\
  \ $title;\n    public $date;\n    public $publisher;\n\n    /**\n     * 构造函数\n \
  \    *\n     * @param string $author\n     * @param string $title\n     * @param\
  \ int $date\n     * @param string $publisher\n     * @return void\n     */\n   \
  \ public function __construct($author, $title, $date, $publisher)\n    {\n     \
  \   $this->author = $author;\n        $this->title = $title;\n        $this->date\
  \ = $date;\n        $this->publisher = $publisher;\n    }\n}\n```\n\n完成这一步后，我们可以定义一个名为\
  \ `BookService` 的类，用于提供获取书籍信息的 API：\n\n```php\nclass BookService\n{\n    /**\n \
  \    * 检索书籍信息并发送\n     *\n     * @param int $id\n     * @return Book\n     */\n\
  \    public function GetBookInfo($id)\n    {\n        // ... perform some work and\
  \ get some book details ...\n        $book = new Book($author, $title, $date, $publisher);\n\
  \        return $book;\n    }\n}\n```\n\n现在，将这些类绑定到 `SoapServer` 实例：\n\n```php\n\
  $server = new SoapServer($uriToWsdl, array(\n    'encoding' => 'ISO-8859-1',\n \
  \   'actor' => $uriToSoapService,\n    'classmap' => array('Book' => 'Book')\n));\n\
  $server->setClass('BookService');\n$server->handle();\n```\n\n就是这样；你的 `BookService`\
  \ 类的 `GetBookInfo` 方法现在已作为 SOAP 方法公开，并将向 SOAP 客户端的请求返回 `Book` 实例。\n\n## 讨论\n\n使用\
  \ PHP 5 提供 SOAP 服务从未如此简单。但还有一个方面需要考虑：WSDL 规范呢？\n\n在不使用 WSDL 的情况下，PHP 服务器之间也可以使用\
  \ SOAP，但这种方法存在问题，因为它意味着 SOAP 客户端的许多功能（例如自动发现可用方法）将无法工作。这样一来，服务开发者就有责任向服务使用者传达可用的方法。尽管根据规范的复杂性，自己生成\
  \ WSDL 可能是一项艰巨的任务，但许多 IDE 都提供了基于类内省生成 WSDL 规范的工具。另一个生成 WSDL 规范的选择是来自 Zend Framework[¹⁵]\
  \ 的新成员 `Zend_Soap`。该组件包含 `Zend_Soap_AutoDiscover` 类，它可以使用 PHP 自身的反射 API 从类生成 WSDL\
  \ 规范。示例如下：\n\n```php\n$generator = new Zend_Soap_AutoDiscover('BookService');\n\
  $wsdl = $generator->handle();\n```\n\n从这里开始，你可以将生成的 WSDL 规范（包含在 `$wsdl` 变量中）缓存到\
  \ Web 可访问的位置，然后使用 `SoapServer` 和 `SoapClient` 为其创建服务器和客户端。\n\n[¹⁵]: http://framework.zend.com/manual/en/zend.soap.html\n\
  \n## 如何使用 REST 服务？\n\n**REST**（表述性状态转移）是 Web 服务领域的新成员，在过去几年中获得了广泛的流行。这种架构方法背后的思想很简单：应用程序状态和功能被分离为资源，每个资源可以通过唯一标识符进行寻址，所有资源共享一致的接口和标准化的内容类型。事实上，Web\
  \ 本身就是这种应用架构风格的一个绝佳例子。我们可以将 URL 用作资源的唯一标识符，将 HTTP 协议用作访问资源的一致接口。最后，资源由标准化的内容类型（XML、HTML\
  \ 等）表示[¹⁶]。\n\n[¹⁶]: 更详细的解释可以在维基百科上找到，网址为 http://en.wikipedia.org/wiki/Representational_State_Transfer。\n\
  \n举个例子，假设有一个用于书籍的 REST 服务：\n\n- 对 `http://example.com/books` 的 GET 请求使用 XML 返回书籍列表。\n\
  - 对同一 URL 的 POST 请求（包含 XML 书籍数据）将向服务添加一本新书。\n- 获取单本书的 XML 需要向指定特定资源的略有不同的 URL 发送\
  \ HTTP GET 请求，例如 `http://example.com/books/php-anthology`。\n- 编辑书籍需要向同一 URL 发送 HTTP\
  \ PUT 请求，并附带 XML 书籍数据。\n- 向该 URL 发送 HTTP DELETE 请求将删除该资源。\n\n这样的服务被认为是 **RESTful**\
  \ 的，即它遵循 REST 原则。每个资源都有唯一的标识符（其 URL），每个资源都有一致的接口（HTTP），通过该接口，请求类型描述了所请求的操作类型。\n\n\
  基本上，REST 利用了 Web 的技术，而 XMLRPC 或 SOAP 只是将 Web 作为发送命令的媒介。例如，在上面的 REST API 中，向 `http://example.com/books/php-anthology`\
  \ 发送 GET 请求会返回该书的 XML 表示。如果该书不存在，服务会以标准的 HTTP 404 Not Found 响应。相比之下，使用相同的服务的 XMLRPC\
  \ 接口可能需要你打开到服务的连接，并调用 `getBook` 方法，将书籍的标识码 `php-anthology` 作为参数传递。如果书籍不存在，服务会返回一条错误消息。这两种方法的主要区别在于使用\
  \ HTTP 来表示预期的操作——获取一本书——以及表示书籍本身的有意义的 URL。\n\n在实际情况下，许多浏览器和 HTTP 客户端仍然没有实现 PUT 和\
  \ DELETE，因此所有资源更新和删除操作都通过 POST 请求完成，并使用额外的请求参数来表示所需操作。虽然这并非完全 RESTful，但这种做法已足够普遍，被视为标准方法。\n\
  \n现代使用 XML 的 REST 服务很常见。一些 REST 服务提供 XML 模式，以便使用者可以轻松确定如何获取所需数据或格式化请求，而另一些则仅提供 API\
  \ 文档。\n\n## 解决方案\n\n到目前为止，你应该已经能够处理任何 XML 了。我们可以使用 `SimpleXML` 解析 REST 响应，并使用 `SimpleXML`、`DOM`\
  \ 或 `XMLWriter` 创建请求（如果需要数据负载）。\n\n要使用特定的 REST 服务，你需要获取其 API 文档，但为了本示例的目的，我们使用上面定义的假设书籍\
  \ REST 服务。假设 URL `http://example.com/books` 在通过 HTTP GET 请求调用时，返回以下 XML 书籍列表：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<books>\n    <book id=\"php-anthology\"\
  >PHP Anthology</book>\n    <book id=\"css-anthology\">CSS Anthology</book>\n</books>\n\
  ```\n\n在我们的书籍服务中，每本书的 `id` 属性可用于检索书籍的详细信息。以下是对 `http://example.com/books/php-anthology`\
  \ 的 GET 请求返回的 XML 示例：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<book>\n\
  \    <id>php-anthology</id>\n    <title>PHP Anthology</title>\n    <publisher>SitePoint\
  \ Pty., Ltd.</publisher>\n    <chapterCount>14</chapterCount>\n    <edition>2</edition>\n\
  </book>\n```\n\n\n\n\n\n<pubDate>2007</pubDate>\n\n</book>\n\n要检索并处理这些信息，我们可以使用一个假设的客户端脚本，它利用\
  \ SimpleXML 实现，如下所示：\n\n```\n$books = new SimpleXMLElement('http://example.com/books',\
  \ null, true);\n\n$ids = array();\n\nforeach ($books as $book) {\n    $ids[] = $book['id'];\n\
  }\n\nforeach ($ids as $id) {\n    $book = new SimpleXMLElement(\n        'http://example.com/books/'\
  \ . $id,\n        null,\n        true\n428\nThe PHP Anthology\n    );\n    echo\
  \ $book->title, ', published by: ', $book->publisher, \"\\n\";\n}\n```\n\n对于基于 XML\
  \ 的 REST 服务，我们可以使用 SimpleXML 来承担发起请求、接收响应和解析响应等繁重工作。在上面的例子中，我们通过实例化一个新的 `SimpleXMLElement`\
  \ 对象来获取书籍列表，并将 URL 作为第一个参数传入。如果构造函数的第一个参数是 URL，则第三个参数必须为 `true`。我们获取所有书籍的 `id` 属性值，并用它们发起新的请求以获取每本书的\
  \ XML 数据。然后，我们获取每本书的 `title` 和 `publisher` 来显示列表。\n\n如何使用此服务创建一本新书？大多数服务会要求你将书籍定义\
  \ POST 到基础 URL，在我们的例子中，该方法可能如下所示：\n\n```\n$book = new SimpleXMLElement(\n    '<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?><book></book>');\n$book->addChild('title',\
  \ 'Life, the Universe, and Everything');\n$book->addChild('publisher', 'Del Rey');\n\
  $book->addChild('chapterCount', 42);\n$book->addChild('edition', '26 April 2005');\n\
  $book->addChild('pubDate', '2005');\n\n$opts = array('http' => array(\n    'method'\
  \ => 'POST',\n    'header' => 'Content-type: application/x-www-form-urlencoded',\n\
  \    'content' => $book->asXML()\n));\n\n$context = stream_context_create($opts);\n\
  $response = file_get_contents('http://example.com/books', false, $context);\n```\n\
  \n编辑特定资源的任务与添加新文档类似。不过，我们将使用资源的唯一 URL，并且无需发送完整的书籍定义，只需发送变化的数据即可：\n\n```\n$book =\
  \ new SimpleXMLElement(\n    '<?xml version=\"1.0\" encoding=\"UTF-8\"?><book></book>');\n\
  $book->addChild('chapterCount', 21);\nXML and Web Services\n429\n$book->addChild('edition',\
  \ 'Del Rey 2005');\n\n$opts = array('http' => array(\n    'method' => 'POST',\n\
  \    'header' => 'Content-type: application/x-www-form-urlencoded',\n    'content'\
  \ => $book->asXML()\n));\n\n$context = stream_context_create($opts);\n$response\
  \ = file_get_contents(\n    'http://example.com/books/php-anthology', false, $context);\n\
  ```\n\n也许我们想从列表中删除这本书——该如何实现？到目前为止，我们通过更改 URL 来区分添加和更新资源。一个合适的 RESTful Web 服务会要求我们向书籍的唯一\
  \ URL 发送 HTTP DELETE 请求，但由于并非所有 HTTP 客户端都能生成 DELETE 请求，我们的 Web 服务采取了次优方案：要求用户 POST\
  \ 一个值为 `1` 的 `delete` 元素：\n\n```\n$book = new SimpleXMLElement(\n    '<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?><book></book>');\n$book->addChild('delete', 1);\n\n$opts\
  \ = array('http' => array(\n    'method' => 'POST',\n    'header' => 'Content-type:\
  \ application/x-www-form-urlencoded',\n    'content' => $book->asXML()\n));\n\n\
  $context = stream_context_create($opts);\n$response = file_get_contents(\n    'http://example.com/books/php-anthology',\
  \ false, $context);\n```\n\n上面的例子有点刻意，但离实际情况并不远。客户端向资源发起简单的 HTTP GET 请求，并决定如何处理响应，或者向服务\
  \ POST XML 以添加、更新或删除资源。SimpleXML 是消费和生成请求的主要工具，而 PHP 自身的流层使得 POST 请求变得轻而易举。\n\n\
  在真实的 REST 服务中，你需要仔细检查 API，以确定哪些 URL 可用、它们返回什么 XML，以及对于影响服务数据的操作，它们期望什么 XML。REST\
  \ 的定义比较松散，因此每次你想直接与一个新的 REST 服务交互时，都需要进行一些学习。\n\n## 使用 Zend Framework\n\n消费 REST\
  \ 服务的另一种可能方法是使用 Zend Framework 的 `Zend_Rest_Client` 组件。该客户端期望它所连接的 REST 服务器使用 XML\
  \ 进行事务处理，这应该是一个安全的假设。执行请求后，我们使用对象属性访问响应，这消除了使用 SimpleXML 时必须进行类型转换的需要。\n\nTechnorati\
  \ 的 bloginfo API 要求你向以下 URL 发起 GET 请求：\n\n`http://api.technorati.com/bloginfo?key=apikey&url=blogurl`\n\
  \n该 URL 需要在查询字符串中包含两个参数：你的 API 密钥和博客的 URL。你可以从 Technorati 网站 `http://technorati.com/developers/apikey.html`\
  \ 获取自己的 API 密钥。\n\n上述 URL 将返回以下 XML：\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<!-- generator=\"Technorati API version 1.0 /bloginfo\" -->\n<!DOCTYPE tapi\
  \ PUBLIC \"-//Technorati, Inc.//DTD TAPI 0.02//EN\"\n    \"http://api.technorati.com/dtd/tapi-002.xml\"\
  >\n<tapi version=\"1.0\">\n    <document>\n        <result>\n            <url>URL</url>\n\
  \            <weblog>\n                <name>blog name</name>\n                <url>blog\
  \ URL</url>\n                <rssurl>blog RSS URL</rssurl>\n                <atomurl>blog\
  \ Atom URL</atomurl>\n                <inboundblogs>inbound blogs</inboundblogs>\n\
  \                <inboundlinks>inbound links</inboundlinks>\n                <lastupdate>date\
  \ blog last updated</lastupdate>\n                <rank>blog ranking</rank>\n  \
  \              <lang></lang>\n                <foafurl>blog foaf URL</foafurl>\n\
  \            </weblog>\n            <inboundblogs>inbound blogs</inboundblogs>\n\
  \            <inboundlinks>inbound links</inboundlinks>\n        </result>\n   \
  \ </document>\n</tapi>\n```\n\n例如，你可以使用以下方法调用 Technorati 的 bloginfo 服务：\n\n`zend_rest_technorati.php`\
  \ *(摘录)*\n\n```\nrequire_once 'Zend\\Rest\\client.php';\n\n$key = apikey; // Technorati\
  \ requires an API key\n$technorati = new Zend_Rest_Client(\n    'http://api.technorati.com/bloginfo');\n\
  $technorati->key($key);\n$technorati->url('http://sitepoint.com');\n$result = $technorati->get();\n\
  echo $result->weblog->name .\n    ' (rank: '. $result->weblog->rank . ')';\n```\n\
  \n这段代码将返回：\n\n```\nSitePoint : New Articles, Fresh Thinking for Web Developers and\n\
  ➥ Designers (rank: 196)\n```\n\n## 如何提供 REST 服务？\n\n你正赶上 REST 的潮流。你的老板确信这是 Web 服务的新趋势，并希望今天就能拿出成果。你需要做什么？\n\
  \n## 解决方案\n\n说实话，你只需要：\n\n- 创建能够映射到资源的 URL 或 URL 模式。\n- 为响应创建 XML。\n\n你需要确定将提供哪些资源，然后设计一个覆盖它们的\
  \ URL 模式。在这个例子中，我们以书籍作为要提供的资源。也许你需要一些服务，允许列出书籍资源、一次详细查看一本书，并允许用户发布新书信息以及编辑现有书籍信息。\n\
  \n一个 RESTful URL 模式可能如下所示：\n\n- 获取书籍列表：`http://example.com/books`\n- 获取单本书：`http://example.com/books/book-name`\n\
  \n要添加一本书，你需要 POST 到第一个 URL；要更新现有书籍的详细信息，你需要 POST 到第二个 URL。接下来，你需要创建一个脚本来处理传入的请求。请务必查看第\
  \ 5 章中的“如何在 PHP 中创建‘漂亮’的 URL？”——那里有一个完整的解决方案，用于在 Apache Web 服务器上创建 URL 模式以及一个请求处理类。下面是一个处理书籍请求的简单示例脚本：\n\
  \n```\n$path = explode('/', trim($_SERVER['PATH_INFO'], '/'));\nif ((1 == count($path))\
  \ && ('books' == $path[0]))\n{\n    if ('post' == strtolower($_SERVER['REQUEST_METHOD']))\n\
  \    {\n        ⋮ *new book entry*\n    }\n    else\n    {\n        ⋮ *list books*\n\
  \    }\n}\n```\n\n\n\n\n\n## XML 与 Web 服务\n\n```\n}\n}\nelseif ((2 == count($path))\
  \ && ('books' == $path[0]))\n{\n    if ('post' == strtolower($_SERVER['REQUEST_METHOD']))\n\
  \    {\n        ⋮ *编辑图书条目*\n    }\n    else\n    {\n        ⋮ *检索图书条目*\n    }\n\
  }\n```\n\n该脚本首先将传入请求的路径信息分解为一个数组，并去除末尾的 `/` 字符。然后，它测试生成了多少个元素，以及第一个元素是否为 `books`。如果只存在一个元素\
  \ `books`，脚本会检查请求方法。如果是 POST 请求，代码会进入创建新图书的分支；如果是 GET 请求，代码会进入列出所有图书的分支。\n\n如果存在两个元素，脚本会假定第二个元素是图书名称。在这种情况下，POST\
  \ 请求表示更新特定图书，而 GET 请求将显示指定图书。\n\n对于图书列表和指定图书信息的请求，只需生成或获取 XML 并返回给用户。对于新增或更新条目，你需要先检索并解析传入的\
  \ XML。要检索传入的 XML，可以像这样从原始 POST 请求中获取：\n\n```\n$post = fopen('php://input', 'r');\n\
  $xml = fread($post);\nfclose($post);\n```\n\n一旦获得 XML，你就可以根据需要解析并对其进行操作。\n\n## 讨论\n\
  \nREST 服务允许我们提前创建 XML，或者像我在本章其他地方描述的那样，使用 PHP 动态生成 XML。我强烈建议你缓存响应，除非请求允许更改数据；扩展\
  \ REST 的一种简单方法是将服务缓存为静态 XML，因为现代 Web 服务器通常提供静态内容的速度远快于动态内容。\n\n虽然 REST 服务扩展性好且相对容易实现，但它们确实给希望使用你服务的开发者增加了难度，因为开发者需要为每个新使用的\
  \ REST 服务学习新的 XML 模式。然而，在 PHP 5 中处理 XML 的简便性使得这一点在大多数情况下变得无关紧要，而 REST 与 `SimpleXML`\
  \ 的结合使得在客户端和服务器端都能构建出非常强大的 Web 服务。\n\n## 总结\n\n在本章中，我们快速浏览了 PHP 5 的各种 XML 和 Web\
  \ 服务扩展。我们讨论了解析和生成 XML 以及使用 RSS 订阅的任务，得出结论：`SimpleXML` 是 PHP 5 中处理 XML 的瑞士军刀，但也提到了其他重要的扩展，如\
  \ SAX、`XMLReader`、`XMLWriter` 和 DOM（`SimpleXML` 基于 DOM）。我们还演示了通过 XPath 搜索 XML（同时使用\
  \ DOM 和 `SimpleXML`），并介绍了基本的 XPath 语法。\n\n大多数现代 Web 服务使用 XML 作为其有效载荷。XML-RPC 使用\
  \ XML 对请求和响应中传递的值进行类型提示；借助 `Zend_XmlRpc` 等现代 XML-RPC 库，可以透明地将 XML-RPC 服务作为 PHP 对象方法调用。SOAP\
  \ 将对象定义为传输单元，PHP 5 的 `SoapServer` 和 `SoapClient` 类使得创建和使用 SOAP 服务变得轻而易举。最后，我们讨论了\
  \ REST 和 RESTful Web 服务，并使用 `SimpleXML` 生成和使用 REST 资源。\n\n# 第 13 章\n\n## 最佳实践\n\n\
  PHP 的入门门槛极低，这既是它最大的优势，*也是*它最大的劣势。值得肯定的是，PHP 允许新手程序员无需学习计算机科学的基础知识就能开发出功能丰富的应用程序。然而，缺点在于，由于\
  \ PHP 提供了多种完成同一任务的方式，应用程序代码很容易变得难以维护。\n\nPHP 领域的许多程序员现在认识到需要标准化并推广最佳实践。其中一些最佳实践是\
  \ PHP 特有的，例如使用 `phpDocumentor` 等工具进行一致的文档编写，1 或使用 `SimpleTest`2 和 `PHPUnit`3 等测试套件。PHP\
  \ 社区正在推广的其他实践则更为通用——例如使用版本控制系统和代码部署实践。无论如何，如果你遵循所有这些实践，它们将使你的生活——以及那些将来可能维护你代码的人的生活——变得更加轻松。\n\
  \n1 http://www.phpdoc.org/\n2 http://simpletest.org/\n3 http://www.phpunit.de/\n\
  \n### 如何跟踪项目代码的修订？\n\n想象一下这个悲惨的场景：你的网站即将上线，你在最后一刻向系统引入了一些新代码，却懊恼地发现其他功能现在出了问题。你只有不到一小时的时间来修复问题。你需要撤销你的更改。但你究竟该如何做到呢？\n\
  \n我们只能希望你在使用某种形式的**版本控制软件**（RCS）。4 版本控制软件允许用户跟踪文档、代码和其他文件的更改，并提供功能以合并来自多个用户的更改，以及管理代码的不同版本。可以将\
  \ RCS 视为代码的备份仓库，以及项目期间所有更改的记录。\n\n4 有关版本控制的概述和版本控制系统的比较，请参阅维基百科的版本控制条目：http://en.wikipedia.org/wiki/Version_control。\n\
  \n## 解决方案\n\n我偏好的 RCS 是 Subversion，本章的所有示例都将使用该软件。5\n\n那么你需要快速撤销更改吗？如果你尚未提交更改，可以使用以下命令轻松回滚：`$\
  \ svn up -r BASE filename`\n\n如果你已经提交了更改，以下命令将撤销它们：`$ svn revert filename`\n\n以下命令会将代码恢复到上一个版本：`$\
  \ svn up -r PREV filename`\n\n5 请访问 Subversion 项目网站 http://subversion.tigris.org/\
  \ 获取完整文档。O'Reilly Media 已将其书籍《使用 Subversion 进行版本控制》在线发布在 http://svnbook.red-bean.com/。\n\
  \n## 讨论\n\n有多种版本控制解决方案可用，但它们可以分为两大类：**分布式**和**非分布式**系统。\n\n在分布式系统中，每个用户维护自己的仓库，软件通常只跟踪**变更集**——表示版本控制下文件更改的软件补丁。开发者之间共享变更集，通常维护一个包含所有已接受变更集的规范仓库。\n\
  \n在非分布式系统中，仓库位于中央服务器上。开发者各自将仓库检出到自己的工作目录，并在完成更改后提交。\n\n两种系统各有优缺点。然而，非分布式系统在 PHP\
  \ 项目中更为常见，因此你很可能遇到这种类型。拥有中央仓库可以让你为正在开发的软件指定一个规范版本的单一位置。你可以轻松地集成在提交前后运行的流程，例如执行单元测试、编译文档或向分发列表发送提交通知。\n\
  \n正如我提到的，有许多版本控制系统可用，既有专有的也有开源的。最流行的开源软件包，也可以说是最流行的版本控制系统，是并发版本系统（CVS）和 Subversion（SVN）。这两者的流行在很大程度上归功于它们的开源性质；用户可以免费获得这些工具，并且可以围绕它们开发自己的工具，而无需担心许可证侵权。此外，使用这些工具不需要专有客户端。\n\
  \n\n\n\nCVS 是非分布式系统的鼻祖，也是 PHP 本身和 PEAR 项目等知名项目所选择的版本控制软件。Subversion 是 CVS 的进化版，提供了更简洁的语法来重命名仓库中的文件和目录、提交整个目录树以及分支和标记。该软件被用于许多现代框架，例如\
  \ eZ Components 和 Zend Framework。\n\n我个人推荐任何新的 PHP 项目使用 Subversion，因为它的设置简便、创建提交前后钩子脚本的流程简单，以及与其他工具集（例如\
  \ IDE 和缺陷跟踪软件）的集成能力，在 RCN 中无与伦比。Subversion 的另一个优点是整个树都是版本化的——单个文件没有自己的版本号。这个特性允许你将多个文件的更改作为一个独立的变更集。在提交代码时，你可以一次性提交完整的更改——单元测试、代码和文档。这种版本化风格使得以后查看日志文件以确定更改了什么、何时更改以及哪些文件受到影响时更加容易。\n\
  \n# 如何维护单个代码库的多个版本？\n\n你的项目刚刚成功发布，现在你需要支持该发布版本。然而，你一直在努力工作，并且已经为下一个版本引入了新的更改。如何同时维护两个代码库，并确保一个中的重要修复被移植到另一个中？\n\
  \n或者，你可能需要能够继续开发网站代码库，但同时运行一个稳定的生产版本。如何保持两个版本分离？\n\n## 解决方案\n\n分支和标记是 RCS 的常见功能，允许你在仓库中维护独立的代码分支。**分支**是软件的一个独立版本，与其他版本独立存在，并维护自己的历史记录。\n\
  \n**标记**是项目在给定时间点的命名快照。\n\n典型的仓库布局应如下所示：\n\n```\nproject/\nbranches/\ntags/\ntrunk/\n\
  ```\n\n我们为每个发布版本创建一个分支，如下所示：\n\n```\nproject/\nbranches/\nrelease-1.0.0/\nrelease-1.1.0/\n\
  ```\n\n使用 Subversion 可以非常轻松地完成此任务：\n\n```\n$ svn copy trunk branches/release-1.1.0\
  \ -m '1.1.0 发布分支'\n```\n\n之后，如果你需要创建一个**补丁版本**——一个次要版本，特别是旨在修复错误而不是添加新功能的版本——你可以创建一个适当的标记：\n\
  \n```\n$ svn copy branches/release-1.0.0 tags/release-1.0.1 -m '1.0.1 错误修复版本'\n\
  ```\n\n类似地，你可以为网站的生产版本创建一个分支：\n\n```\nproject/\nbranches/\nproduction/\ntags/\n\
  trunk/\n```\n\n当你准备部署一个软件版本时，创建一个描述更改的标记名称：\n\n```\n$ svn copy branches/production\
  \ tags/2006-09-19-PirateDayJargon -m '海盗日网站的海盗日行话版本'\n```\n\n## 讨论\n\n在大多数情况下，日常开发将在仓库的主干（trunk）中进行。当你准备创建软件版本时，创建一个分支。从此时起，主干中的更改不会影响发布分支中的代码——除非你手动合并它们。分支提供了代码分离，有助于防止新功能或向后兼容性破坏渗入已发布的代码。你还可以使用版本控制系统的合并功能，有选择地将错误修复或新功能从一个分支合并到另一个分支。例如，以下是在\
  \ Subversion 中使用合并命令的方式：\n\n```\n$ svn merge -r 123:145 trunk/filename branches/release-1.0.0/filename\n\
  ```\n\n然而，实际的发布版本需要是静态的——即活跃开发必须停止——我们通过标记来实现这一点。\n\n在 Subversion 中，标记和分支以相同的方式创建——通过“复制”操作。它们之间的唯一区别在于使用时的约定。分支应表示持续开发，例如错误修复、新功能等；标记应被视为静态快照。\n\
  \n需要注意的一点是，在 Subversion 中，复制是通过硬链接实现的，而不是实际的文件复制；只有在针对副本提交新版本时才会创建新文件。这意味着复制成本很低，因此你可以——也应该——频繁地进行分支和标记。\n\
  \n“等等！”你说。“我不是在开发软件——我是在开发网站！这对我有什么用？”别急；你仍然需要能够将网站的开发版本和生产版本分开，而你的标记应代表你在网站上发布错误修复或新功能的节点：\n\
  \n```\nproject/\nbranches/\nproduction/\ntags/\n2006-09-19-PirateDayJargon/\n2006-05-11-LifeUniverseEverything/\n\
  2006-04-01-AprilFools/\ntrunk/\n```\n\n在日常工作中，你在仓库的主干中工作。当你完成功能或错误修复时，将它们合并到生产分支中。然后你在与生产服务器几乎相同的预发布服务器上预览此分支——它甚至可能使用来自相同\
  \ Web 服务的相同数据。一旦你验证了更改，或者你的质量保证团队审查了网站并批准，你就创建一个标记。然后你可以从该标记导出项目文件：\n\n```\n$ svn\
  \ export http://example.com/svn/project/tags/2006-09-19-PirateDayJargon 2006-09-19-PirateDayJargon\n\
  ```\n\n`svn export` 从仓库中获取代码，并创建一个不包含版本信息（即 `.svn` 子目录）的本地工作副本。这为你提供了一个更精简、可用于生产的代码树。\n\
  \n# 如何编写可分发的代码？\n\n当你在团队中工作，或者编写将公开发布的代码时，你需要牢记以下几点：\n\n- 代码应易于重用和扩展。\n- 代码应易于阅读。\n\
  - 代码文件应易于在文件系统中找到。\n\n开发人员在处理他人代码或使用/扩展第三方代码时常见的问题包括：\n\n- 由于 API 不灵活（或缺少 API）或继承不清晰（例如，如何扩展过程式代码？）导致难以扩展代码。\n\
  - 由于命名实践不佳，例如在创建类时使用常见名称（例如 `Mail`），导致命名冲突。\n- 由于缩进不一致、变量、函数、类和文件命名约定不一致以及代码结构不一致，导致难以阅读他人代码。\n\
  \n这些显然是不同的问题，但都与未能编写可分发代码的问题相关。\n\n## 解决方案\n\n可分发代码的关键在于养成良好习惯。没有单一的、万无一失的解决方案来编写可分发代码，但有一些编程实践你应该采用。将它们变成编程习惯也意味着编写可分发代码将不再需要额外努力。让我们看看你应该考虑的三项不同编程实践。\n\
  \n### 使用 OOP\n\n如果你还没有这样做，请确保阅读第 1 章中的“什么是 OOP？”。面向对象编程（OOP）经常被性能专家诟病为对应用程序性能非常昂贵。6\
  \ 反驳的观点是 CPU 周期和内存很便宜，而开发人员不便宜。OOP 为开发人员提供了巨大的好处：面向对象代码非常易于重用和扩展；由于 PHP 中现在可用的测试框架，它通常更容易测试；它可以大幅减少命名冲突的数量；并且在许多情况下可以带来更简洁的语法。考虑以下示例：\n\
  \n`oop.php`（节选）\n\n```php\nclass Foo\n{\n    public function bar()\n    {\n    \
  \    echo 'Do';\n    }\n}\n\nclass MyFoo extends Foo\n{\n    public function bar()\n\
  \    {\n        parent::bar();\n        echo ' more!';\n    }\n}\n```\n\n\n\n\n\n\
  `Class Foo` 有一个 `bar` 方法。`Class MyFoo` 继承自 `class Foo` 并重写了 `bar` 方法。这种技术允许 `MyFoo`\
  \ 对象通过调用 `parent::bar` 来访问其父类的功能，然后向 `do` 方法添加自己的功能。\n\n这种方法的美妙之处在于对象现在是可互换的——我们可以根据情况使用\
  \ `Foo` 或 `MyFoo`，而方法语法完全相同。我们可以实例化任一类的对象，将其传递给其他方法或函数，并以完全相同的方式使用任一对象，而无需知道它封装的是哪个类：\n\
  \n6 关于 PHP 5 的 OOP 特性集的文档，请访问 http://www.php.net/oop5/。\n\n## 最佳实践\n\n```\n$foo\
  \ = new Foo();\n$foo->bar();\n$foo = new MyFoo();\n$foo->bar();\n```\n\n如果我们想使用过程式函数达到同样的目的，等效的代码可能如下所示：\n\
  \n```\nfunction foo_bar()\n{\n    echo 'Do';\n}\nfunction myfoo_bar()\n{\n    foo_bar();\n\
  \    echo ' more';\n}\nmyfoo_bar();\n```\n\n实际的函数调用当然更快，因为我们不必实例化对象，尽管这种优势对于静态方法来说没有意义。缺点是我们不能简单地调用\
  \ `foo_bar()` 并获得新的行为——我们必须调用一个完全不同的函数。\n\n如果我们希望在应用程序的其他地方动态调用我们选择的方法，就不能硬编码函数调用；相反，我们需要传递一个函数名或\
  \ PHP 回调。这种方法可能会降低性能，并且使调试和测试更加困难。\n\n我们还需要考虑，我们很可能需要实现类似的功能，但内部实现截然不同。例如，我们可能想要创建两个不同的邮件函数：一个使用\
  \ PHP 的 `mail` 函数发送邮件，另一个通过 SMTP 发送。我曾目睹过两个函数都命名为 `mailer` 的情况，这导致后来当两个文件同时加载时出现命名冲突。如果我们将这些函数封装到类中，例如使用\
  \ `My_Sendmail` 和 `My_Smtp` 作为类名，就可以消除冲突：\n\n```\nclass My_Sendmail\n{\n    public\
  \ function mailer($to, $subject, $body){}\n}\nclass My_Smtp\n{\n    public function\
  \ mailer($to, $subject, $body, $host ='localhost'){}\n}\n```\n\n我之前提到过，类也比过程式代码更容易测试。这是因为流行且文档完善的单元测试框架\
  \ SimpleTest 和 PHPUnit 主要是为了测试类方法而设计的，甚至使用类来定义它们的测试套件：\n\n**`oop.php` *(摘录)***\n\
  \n```\nclass FooTest extends PHPUnit_Framework_TestCase\n{\n    /**\n     * Foo\
  \ Object\n     * @var Foo\n     */\n    protected $_foo;\n    /**\n     * Setup\
  \ environment\n     */\n    public function setUp()\n    {\n        $this->_foo\
  \ = new Foo();\n    }\n    /**\n     * Teardown environment\n     */\n    public\
  \ function tearDown()\n    {\n        unset($this->_foo);\n    }\n    /**\n    \
  \ * Test the bar() method\n     */\n    public function testBar()\n    {\n     \
  \   ⋮ *test the method…*\n    }\n}\n```\n\n编写面向对象的代码使单元测试更加直观和灵活——每个测试方法测试类中的一个方法。如果你想进一步了解，可以阅读本章引言中详细介绍的\
  \ SimpleTest 和 PHPUnit 网站上的其他测试策略。\n\n## 选择命名空间\n\n我们已经提到过命名冲突。仅仅因为你现在使用 OOP 并不意味着你就安全了；类名仍然可能冲突。避免这个问题的简单方法是选择一个**命名空间**，一个通常基于项目名或供应商名的名称前缀，用来作为你类名的前缀。7\
  \ 以下是一些现有项目中使用的命名空间示例：\n\n- Solar 框架：`Solar_`\n- Zend 框架：`Zend_`\n- Cerebral Cortex：`Crtx_`\n\
  \n使用命名空间有几个好处。首先，它提供了一种非常简单的方法来将你的代码与其他项目的代码分开。例如，如果你通过 PEAR 频道发布你的代码，拥有自己的前缀意味着你的代码将在本地\
  \ PEAR 检出中归入一个单独的树。\n\n其次，正如我已经提到的，选择命名空间有助于防止命名冲突。`Uri` 可能是描述你的类所需的最少描述性名称，但它可能会与另一个供应商的\
  \ `Uri` 类冲突；用你自己的命名空间作为前缀，问题就避免了：`Zend_Uri`、`Solar_Uri`、`My_Uri`。\n\n你应该用什么作为你的命名空间？如果你代表一个公司或公共项目，尝试使用它的名称——毕竟，这种方法对\
  \ Solar 和 Zend 来说已经足够好了。另外，尽量保持名称简短；你会感激每次创建新类定义时不需要输入那么多字符。话虽如此，名称也不能*太*短——你可能应该使用不少于三个字符，以确保名称唯一且拼写可识别。例如，`Crtx`\
  \ 可识别为 \"Cerebral Cortex\" 的缩写；任何更短的字符都无法识别；`Cortex` 本身作为前缀开始变得冗长；`CerebralCortex`\
  \ 则太长而无法使用。\n\n7 关于命名空间价值的精彩讨论，请阅读 Paul M. Jones 的博客文章 \"No More Loners!\"，网址为 http://paul-m-jones.com/blog/?p=215。\n\
  \n## 选择编码标准\n\n你有多少次重新格式化同事（或前员工）的代码以使其更易读？又有多少次别人对你的代码做了同样的事？我们可以认为这些行为是编码时间的净损失。\n\
  \n很可能，如果这种情况在你的团队中发生得太频繁，你可能已经决定创建一套编码标准。编码标准规定了：\n\n- 文件命名和放置\n- 变量、函数和类的命名约定\n\
  - 缩进规则\n- 文档和注释指南\n- ……以及更多。\n\n与其创建自己的标准，不如考虑采用公共标准。使用公共标准的好处包括：\n\n**它是程序员中立的。**\
  \  \n与其让一个程序员或一组程序员强加自己的偏好，选择公共标准是一种程序员中立的解决方案。\n\n**问题已经解决。**  \n公共标准已经经过了激烈的辩论。虽然并非所有人都能同意结果是最好的，但每个人都*已经*同意这些标准代表了最佳的集体解决方案。\n\
  \n**将其作为招聘标准。**  \n采用公共标准时，你可以将其作为雇佣标准：“申请人必须了解并能够使用 XYZ 编码标准。”\n\n**更适合代码分发。**\
  \  \n例如，如果你遵循 PEAR 编码标准，你的代码将采用一种格式——包括物理磁盘格式以及代码编写格式——可以轻松地使用 PEAR 安装程序或通过 PEAR\
  \ 频道打包和安装。\n\n那么，有哪些公共标准呢？一些流行的例子包括：\n\n- PEAR，网址为 http://pear.php.net/manual/en/standards.php\n\
  - Zend Framework，网址为 http://framework.zend.com/manual/en/coding-standard.html\n\
  - eZ Components，网址为 http://svn.ez.no/svn/ezcomponents/docs/guidelines/\n\n这些编码标准在各自添加了一些内容后，最初都源自\
  \ Horde 项目。8 目前 Horde 和 PEAR 的编码标准是相同的。Zend Framework 的标准基本上遵循 PEAR 的标准，只有一些细微的变化；但总的来说，Zend\
  \ Framework 仍然与 PEAR 兼容。eZ Components 的标准基本上只被 eZ Components 项目和使用它编码的开发者使用。\n\n\
  PEAR 编码标准被广泛采用，并用于其他知名项目，如 ADOdb9 和 Solar。10 总的来说，当为你的项目或公司选择要采用的标准时，PEAR 的标准可能是最佳选择。\n\
  \nPEAR 编码标准的基本要点总结如下：\n\n- 每个文件一个类。\n\n\n\n\n\n- 类名中的下划线映射到目录分隔符：例如，`Net_SMTP` 映射到\
  \ `Net/SMTP.php`。\n- 存在一种“唯一大括号”规则：类和函数声明的大括号放在下一行，缩进级别与声明相同；在其他控制结构中，左大括号与语句保持在同一行。\n\
  - 代码缩进应为每个缩进级别四个空格。\n- 变量、函数和类使用驼峰式（camelCase）或首字母大写驼峰式（studlyCaps）命名；变量和函数名应以小写字母开头，而类名应以大写字母开头。\n\
  \n`8 http://horde.org/`\n`9 http://adodb.sourceforge.net/`\n`10 http://solarphp.com/`\n\
  \n`448`\n`The PHP Anthology`\n\n- 私有和受保护的属性及方法应以一个下划线开头命名。\n- 所有类、函数和方法都应有一个文档块（docblock）。\n\
  \n`本章中的所有示例均按照 PEAR 编码标准编写。`\n\n## 讨论\n\n`一旦你养成一些有用的习惯，编写可分发的代码就是可行的。编写面向对象的代码可能不会给你的项目带来性能优势，但它能帮助你更快地开发代码，因为你可以轻松重用自己或他人已经写好的代码。为你的代码选择一个命名空间有助于防止与其他开发者编写的代码发生冲突，并便于在目录树中轻松分组不同的代码库。最后，使用编码标准可以确保你能够维护其他程序员的代码，反之亦然。`\n\
  \n### 如何为我的代码编写文档，以便日后自己或他人参考？\n\n`你已经编写了下一个伟大的 API，并且准备发布它。但没有人，包括你的同事，知道如何使用它。有哪些方法可用？它们接受什么参数？它们返回什么？它们实际做什么？为什么有人会想使用它们？`\n\
  \n`文档的主题在编码阶段常常被忽略，但从这些问题可以看出，缺乏文档会使你的代码对他人来说基本毫无价值。`\n\n`“但我没有*时间*写文档！”你抗议道。“文档太难了！”`\n\
  \n`这根本不是事实。文档可以在你*编码的同时*创建，作为代码的一部分。让我们看看如何做到。`\n\n## 最佳实践\n\n`449`\n\n## 解决方案\n\
  \n`phpDocumentor 使用代码内部特殊格式的注释块（称为 docblock）来生成文档。11 Docblock 已经存在多年，最初是为支持 PHP\
  \ 4 代码而编写的，并基于 Javadoc。12 Docblock 以 `/**` 开头，然后遵循常规的 C 风格注释格式。多行注释块应以 `*` 开头。以下是一个示例：`\n\
  \n`login.php（摘录）`\n\n```\n/**\n * 这是一个示例文档块\n *\n * 这是一个示例文档块。注释块中第一个空行之前的内容称为“简短描述”；\n\
  \ * 这里的内容被视为“详细描述”。\n */\n```\n\n`Docblock 还可以包含提供元信息的标签，例如函数或方法的参数和返回值类型、抛出的异常等。例如，考虑以下函数声明：`\n\
  \n`login.php（摘录）`\n\n```\n/**\n * 登录用户\n *\n * 登录用户，将用户的凭据与数据库中的凭据进行比对。\n *\n *\
  \ @param string $user 用户名\n * @param string $password 用户密码\n * @return boolean\n\
  \ * @throws Exception 数据库错误时抛出\n */\nfunction login($user, $password)\n{\n    ⋮\
  \ *函数体…*\n}\n```\n\n`11 http://phpdoc.org/`\n`12 http://java.sun.com/j2se/javadoc/`\n\
  \n`![Image 126](img/index-472_1.jpg)`\n\n`450`\n`The PHP Anthology`\n\n`通过 phpDocumentor\
  \ 运行此声明是一个相当简单的操作：`\n\n```\n$ phpdoc -f login.php -t docs\n```\n\n`此操作会在 `docs`\
  \ 目录中创建一个文档树，并仅解析 `login.php` 文件。为此函数生成的文档如图 13.1 所示。`\n\n`图 13.1. 使用 phpDocumentor\
  \ 和 docblock 生成的文档`\n\n`你可以通过两种不同的机制链接已文档化的代码。任何给定的 docblock 可能包含一个或多个 `@see` 标签，每个标签应包含：一个参数；一个类、函数或方法名；或一个已文档化的常量、变量、对象属性或对象常量。可选的第二个参数可用于提供关于链接的信息。或者，你可以使用\
  \ `{@link argument comment}` 语法生成内联链接；参数与 `@see` 使用的相同，我们提供的注释将成为链接的文本（如果未提供，则使用参数）。以下是一个示例：`\n\
  \n## 最佳实践\n\n`451`\n\n`login.php（摘录）`\n\n```\n/**\n * 验证密码\n *\n * 为 {@link login()\
  \ 登录函数} 验证密码。\n *\n * @see login() 登录函数\n * @param string $user 用户名\n * @param string\
  \ $password 用户密码\n * @return boolean\n */\nfunction validatePassword($user, $password)\n\
  {\n    ⋮ *函数体…*\n}\n```\n\n`哪些内容可以用 docblock 文档化？嗯，一个文件可以有一个页面级别的 docblock，描述文件的内容、作者、版权信息等。`\n\
  \n`类可以有一个描述类、继承等内容的 docblock。函数和方法可以有 docblock，正如我们之前所见。此外，任何类成员变量都可以有 docblock。简而言之，代码中的*任何*元素都可以有\
  \ docblock。`\n\n## 讨论\n\n`关于 phpDocumentor 风格的代码注释，需要注意的主要几点是：`\n\n- `文档与代码共存。`\n\
  - `文档引用其前面的代码。`\n- `Docblock 使你的代码自文档化。`\n\n`了解这些要点后，你确实没有理由*不*为代码编写文档；因此，在编码时，尽情地编写文档吧。在编写过程中，请记住以下几点：`\n\
  \n**除非简短描述和详细描述基本相同，否则请同时使用两者。**\n\n`在上面的示例中，详细描述提供了简短概要中不必要但能给使用它的开发者提供良好信息的额外内容。通常，参数和返回值已经提供了足够的信息，因此你不需要使用详细描述。`\n\
  \n`452`\n`The PHP Anthology`\n\n**尽可能使用最具体的参数和返回值类型。**\n\n`例如，如果更具体的类型（如 `Solar_Db_Adapter`）可行，就不要只使用\
  \ `object` 或 `stdclass` 类型。这种类型将允许你链接到相应的类，从而生成更好的文档；此外，一些 IDE 会利用这种类型提示来更好地提供代码补全功能。`\n\
  \n`另一个需要记住的要点是，phpDocumentor 并不是*唯一*可以解析 docblock 的工具。另一个可以使用与 phpDocumentor 相同的\
  \ docblock 和 docblock 标签来创建 API 文档的工具是 Doxygen。13 使用 Doxygen 的好处是它支持 PHP 以外的语言，如\
  \ C、C++、Java 和 Python，并且可以相应地生成文档。`\n\n`13 http://www.stack.nl/~dimitri/doxygen/`\n\
  \n`还要注意，docblock 与 PHP 本身的编译器标记相关联，这意味着可以通过 PHP 的反射 API 使用各种 `Reflection` 类的 `getDocComment`\
  \ 方法来检索它们。当你想要在代码中实现某种形式的自发现功能时（例如在创建服务器类时），这种能力非常有用。Zend Framework 在其各种服务器组件（`Zend_XmlRpc_Server`、`Zend_Rest_Server`、`Zend_Json_Server`\
  \ 和 `Zend_Soap_Wsdl`）中利用了这种能力，以便服务类生成自己的服务器定义。`\n\n`最后，许多 IDE 会使用 docblock 来提供代码补全功能。`\n\
  \n`例如，当你在 Zend Studio 和 Eclipse 中键入时，会出现工具提示和下拉菜单，显示对象的可能方法以及每个方法的原型，如图 13.2 所示。你可以轻松地从列表中选择要使用的条目，从而节省按键次数。`\n\
  \n`13 http://www.stack.nl/~dimitri/doxygen/`\n\n\n\n\n\n![Image 127](img/index-475_1.jpg)\n\
  \n![Image 128](img/index-475_2.jpg)\n\n![Image 129](img/index-475_3.png)\n\n## 最佳实践\n\
  \n图 13.2. 基于 PHP 文档块的 IDE 自动补全（Zend Studio）\n\n## 注释可能会说谎！\n\n程序员在采用系统化的代码注释方法时，总是怀着最好的意图。然而，随着时间的推移，函数被修补、增强或以其他方式修改，除非严格维护，否则代码注释会逐渐过时。当你阅读别人的代码注释时，请记住，他们可能是在三个版本之前为函数编写的这些注释，这未必能反映函数当前的实际工作方式。当你处理自己的代码时，尽量让注释尽可能准确，但也要用良好的单元测试用例来补充你的文档块——我们将在“如何确保未来对代码的修改不会破坏现有功能？”中讨论单元测试。一个好的单元测试套件也可以作为功能文档，因为它记录了代码在被调用时的行为。\n\
  \n所以，从今天开始记录你的代码吧——你绝不会后悔！\n\n## 如何确保未来对代码的修改不会破坏现有功能？\n\n你的应用程序已经上线一个月了，一切顺利，但你的老板要求增加一个新功能。你创建了新功能，部署上线，然后几分钟内，你就接到了老板愤怒的电话，抱怨网站上有些东西坏了。\n\
  \n这种情况在你身上发生过多少次？如何防止它再次发生？试试 PHP 可用的单元测试框架之一吧。\n\n## 解决方案\n\n单元测试的目标是将代码隔离成独立的单元，并验证每个单元是否满足所有标准。14\
  \ 当它们在重构过程或引入新功能后运行时，单元测试通常被称为**回归测试**，用于检查更改是否破坏了现有功能。\n\n典型的测试框架让你运行代码，并对返回值或对象状态进行断言。以下示例均引用此代码：\n\
  \n**Foo.php *（摘录）***\n\n```php\n/**\n * Foo class for PHP Anthology Best Practices\
  \ chapter\n *\n * @package SitePoint\n * @version @release-version@\n * @copyright\
  \ Copyright (C) 2006-Present, SitePoint Pty Ltd.\n * @author Matthew Weier O'Phinney\
  \ <XXX@YYYY.ZZZ>\n */\nclass Foo\n{\n    /**\n     * @var string\n     */\n    public\
  \ $name;\n\n    /**\n     * @var boolean\n     */\n    public $baz = false;\n\n\
  \    /**\n     * Constructor\n     *\n     * @param string $name\n     * @return\
  \ void\n     * @throws Exception with non-string $name\n     */\n    public function\
  \ __construct($name)\n    {\n        if (!is_string($name) || empty($name)) {\n\
  \            throw new Exception('Invalid name');\n        }\n        $this->name\
  \ = $name;\n    }\n\n    /**\n     * Bar returns an array\n     *\n     * @return\
  \ array\n     */\n    public function bar()\n    {\n        return array(\n    \
  \        'baz',\n            'bal',\n            'boo'\n        );\n    }\n\n  \
  \  /**\n     * Set the {@link $baz} flag\n     *\n     * @param boolean $flag\n\
  \     * @return void\n     */\n    public function baz($flag)\n    {\n        $this->baz\
  \ = ($flag) ? true : false;\n    }\n}\n```\n\n让我们看一个对上述代码进行单元测试的示例：\n\n```php\n\
  $object = new Foo('sitepoint');\n$result = $object->bar();\n$this->assertTrue(is_array($result));\n\
  $this->assertContains('bar', $result);\n```\n\n在这个测试中，我们断言 `Foo` 对象的 `bar` 方法的返回值是一个数组，并且包含值\
  \ `bar` 作为其中一个元素。\n\n大多数 PHP 项目使用三种主要的测试框架：\n\n- **phpt (http://qa.php.net/write-test.php)**\
  \ – PHP 项目本身使用的测试格式，phpt 主要出现在为 PEAR 模块编写的单元测试中。\n- **PHPUnit (http://phpunit.de/)**\
  \ – 最初是一个 PEAR 项目，但现在是一个独立项目，PHPUnit 是 Java 的 JUnit 的忠实移植版。15 PHPUnit 用 PHP 5 编写，支持\
  \ `E_STRICT`，主要面向 OOP 代码。\n- **SimpleTest (http://www.lastcraft.com/simple_test.php)**\
  \ – 在 PHPUnit 早期编写，以解决缺乏 Mock 对象和 Web 测试功能的问题，SimpleTest 支持 PHP 4，以及在不报告 `E_STRICT`\
  \ 错误时的 PHP 5。\n\n### 使用 SimpleTest 或 PHPUnit 进行测试\n\nSimpleTest 和 PHPUnit 的测试用例以类的形式编写，通常一次测试整个类或函数文件。这些框架的基本测试策略非常相似，只有细微差别。在接下来的示例中，我使用\
  \ PHPUnit，部分原因是为了在后续章节中基于它进行构建；然而，代码只需很少的更改就可以用 SimpleTest 编写。\n\n在这个示例中，我们将测试整个\
  \ `Foo` 类：\n\n**unittest.php *（摘录）***\n\n```php\n/**\n * Test class for class Foo\n\
  \ *\n * @uses PHPUnit_Framework_TestCase\n * @package Sitepoint\n * @subpackage\
  \ UnitTests\n * @copyright Copyright (C) 2006-Present, SitePoint Pty Ltd.\n * @author\
  \ Matthew Weier O'Phinney <XXX@YYYY.ZZZ>\n */\nclass FooTest extends PHPUnit_Framework_TestCase\n\
  {\n    /**\n     * @var Foo\n     */\n    protected $_foo;\n\n    /**\n     * Setup\
  \ test environment\n     *\n     * @return void\n     */\n    public function setUp()\n\
  \    {\n        $this->_foo = new Foo('sitepoint');\n    }\n\n    /**\n     * Tear\
  \ down test environment\n     *\n     * @return void\n     */\n    public function\
  \ tearDown()\n    {\n        unset($this->_foo);\n    }\n\n    /**\n     * Verify\
  \ that the constructor properly sets the name attribute\n     *\n     * @return\
  \ void\n     */\n    public function testConstructorSetsName()\n    {\n        $this->assertEquals('sitepoint',\
  \ $this->_foo->name);\n        $foo = new Foo('anthology');\n        $this->assertEquals('anthology',\
  \ $foo->name);\n    }\n\n    /**\n     * Verify that non-string $name arguments\
  \ cause the constructor\n     * to throw an exception\n     *\n     * @return void\n\
  \     */\n    public function testConstructorThrowsExceptionOnBadName()\n    {\n\
  \        try {\n            $foo = new Foo('');\n            $this->fail('Empty\
  \ string should throw exception');\n        } catch (Exception $e) {\n         \
  \   // success\n        }\n\n        try {\n            $foo = new Foo(array('boo',\
  \ 'bar'));\n            $this->fail('Array should throw exception');\n        }\
  \ catch (Exception $e) {\n            // success\n        }\n\n        try {\n \
  \           $foo = new Foo(new Stdclass());\n            $this->fail('Object should\
  \ throw exception');\n        } catch (Exception $e) {\n            // success\n\
  \        }\n\n        try {\n            $foo = new Foo(true);\n            $this->fail('Boolean\
  \ should throw exception');\n        } catch (Exception $e) {\n            // success\n\
  \        }\n    }\n\n    /**\n     * Verify Foo::bar() returns an array containing\
  \ the value 'bar'\n     *\n     * @return void\n     */\n    public function testBar()\n\
  \    {\n        $bar = $this->_foo->bar();\n        $this->assertTrue(is_array($bar));\n\
  \        $this->assertContains('bar', $bar);\n    }\n\n    /**\n     * Verify that\
  \ baz() sets the $baz property\n     *\n     * @return void\n     */\n    public\
  \ function testBazSetsBazProperty()\n    {\n        $this->_foo->baz(true);\n  \
  \      $this->assertTrue($this->_foo->baz);\n        $this->_foo->baz(false);\n\
  \        $this->assertFalse($this->_foo->baz);\n        $this->_foo->baz(1);\n \
  \       $this->assertTrue($this->_foo->baz);\n        $this->_foo->baz(0);\n   \
  \     $this->assertFalse($this->_foo->baz);\n    }\n}\n```\n\n在这个示例中，`setUp` 方法在每个测试用例运行之前被调用，并创建一个\
  \ `Foo` 对象。`tearDown` 方法在每个测试用例之后被调用，在此实例中，它取消设置测试套件中的 `Foo` 对象。\n\n任何以 `test` 开头的方法都是测试方法。在我们介绍的示例中，我为每个方法命名，以反映正在测试的类方法或我正在测试的行为。因此，名称\
  \ `testConstructorSetsName` 表示该方法将测试构造函数（`__construct`）是否正确设置了对象中的 `$name` 属性。\n\
  \n\n\n\n\n# PHP 文集\n\n## 使用 phpt 进行测试\n\n像这样的行为测试特别有用，因为除了作为对象的契约之外，测试用例本身还可以作为敏捷文档——从单元测试自动生成的文档。`PHPUnit`\
  \ 会根据单元测试名称生成敏捷文档。例如，对于名为 `testConstructorSetsName` 的方法，生成的文档将是“构造函数设置名称”。\n\n我在上面的解决方案中跳过了\
  \ phpt 测试，所以现在让我们快速了解一下它。\n\nphpt 测试通常一次针对单个函数或方法，目标是破坏该单元提供的功能。测试文件分为几个部分，至少定义测试名称、要测试的代码以及预期结果。测试通过\
  \ PHP 发行版提供的脚本运行：`run-tests.php` 或 `pear run-tests` 命令。\n\n要测试 `Foo::bar` 方法，我们可以编写以下假设的测试：\n\
  \n```\n--TEST-\nFoo::bar() 方法\n--FILE-\n<?php\nrequire_once 'Foo.class.php';\n$foo\
  \ = new Foo('simpletest');\n$bar = $foo->bar();\nassert(is_array($bar));\nassert(in_array('bar',\
  \ $bar));\n?>\n--EXPECT-\n```\n\n你会注意到这里的 `--EXPECT--` 部分是空的。这意味着预期没有输出；如果有任何输出（例如来自\
  \ `assert` 语句的警告），测试将失败。\n\n下一个示例设置了一个测试框架，其中包含要测试的类的源 PHP 文件，并创建要测试的对象。使用 phpt\
  \ 测试创建测试框架没有正式的程序，但一种常见的约定是创建一个 `setup.php.inc` 文件，如下所示：\n\n`setup.php.inc`\n\n\
  ```\n<?php\nrequire_once 'Foo.class.php';\n$foo = new Foo('simpletest');\n?>\n```\n\
  \n该文件为我们执行设置；然后我们在测试脚本中引入它：\n\n## 最佳实践\n\n### `phpt.php`（节选）\n\n```\n--TEST-\nFoo::bar()\
  \ 方法\n--FILE-\n<?php\nrequire_once 'setup.php.inc';\n$bar = $foo->bar();\nassert(is_array($bar));\n\
  assert(in_array('bar', $bar));\n?>\n--EXPECT-\n```\n\nphpt 测试通常非常容易编写，并且具有每个测试都在自己的环境中运行的优点，因此，例如，你不必担心在请求之间重置静态变量值。phpt\
  \ 测试的主要缺点是缺乏设置和拆除测试环境的正式方法，以及当我们测试具有许多方法的类时文件数量激增的问题。\n\n## 讨论\n\n选择像 `SimpleTest`\
  \ 或 `PHPUnit` 这样的测试框架而不是 phpt 的其他原因包括：\n\n- phpt 缺乏正式的断言方法。当然，PHP 自身的 `assert` 函数提供了相同的功能，但像\
  \ `assertTrue` 和 `assertContains` 这样的方法具有更好的名称，可以指示所进行的断言类型，并且包含自己的错误处理功能，以确保提供的参数符合预期。\n\
  - phpt 缺乏设置和拆除测试环境的正式方法。虽然 phpt 提供了设置请求环境的机制，但需要在每个测试文件中执行；这种缺陷也使得在测试之间共享环境变得困难。\n\
  - phpt 缺乏在测试之间共享测试功能的机制。在 `PHPUnit` 和 `SimpleTest` 中，任何不以 test 开头的方法都只是类中的另一个方法，这意味着你可以创建一个更通用的方法，并在多个测试使用类似测试策略时从各个测试方法中调用它。无需加载额外文件或类即可轻松共享环境的能力，出于显而易见的原因，特别有用。\n\
  \n如果 `SimpleTest` 和 `PHPUnit` 如此相似，你该如何选择呢？\n\n你使用的工具将取决于你要测试的内容以及你将使用的测试策略。每个测试框架都有对方没有的功能（尽管随着时间推移，功能集正在趋同）。例如：\n\
  \n- `PHPUnit` 支持代码覆盖率报告（使用 `XDebug`；此主题稍后在“如何确定还有哪些内容需要测试？”中介绍）。\n- `SimpleTest`\
  \ 支持模拟对象（`PHPUnit` 3 引入了此功能）。\n- `SimpleTest` 具有 Web 测试功能（`PHPUnit` 3 通过第三方工具 Selenium\
  \ RC 引入了此功能）。\n- `SimpleTest` 拥有非常活跃的用户社区。\n\n我广泛使用 `PHPUnit`，主要是因为它适合我参与的项目和我遵循的编码标准，但我遇到过许多对\
  \ `SimpleTest` 推崇备至的开发者。选择一个测试框架并学习其细节——同时研究另一个框架以比较它们的优缺点。\n\n单元测试是一个广泛的话题，这里介绍的大部分信息由于篇幅所限都进行了简化。选择一个适合你需求的测试框架，并在开始编写测试时阅读该框架的文档。你可能还想全面了解单元测试。\n\
  \n我在这里没有涉及的一个主题是测试驱动开发（TDD）或测试优先开发的概念。TDD 的基本原则是先编写单元测试，然后编写代码，并重复此过程直到项目完成。许多开发者实践这种策略；它有很多好处，特别是在重构代码或添加功能时。有关\
  \ TDD 的更多信息，请参阅 [Portland Pattern Repository wiki](http://c2.com/cgi/wiki?TestDrivenDevelopment)\
  \ 和 [ExtremeProgramming.org](http://www.extremeprogramming.org/rules/testfirst.html)。\n\
  \n## 如何确定还有哪些内容需要测试？\n\n无论你是使用测试驱动开发还是在事后编写测试，最终你都需要知道你的代码有多少已经被实际测试过。通常，即使你的测试通过了，你的代码中仍有很大一部分没有被测试覆盖。如何确定哪些代码已被覆盖，哪些没有？\n\
  \n## 解决方案\n\n`PHPUnit` 3 提供了生成代码覆盖率报告的能力。此功能要求你的机器上安装了 `XDebug`。你可以通过 PEAR 或 PECL\
  \ 获取 `XDebug`，或者自行下载扩展。根据我的经验，基于 *nix 系统的用户需要自己编译扩展。为此，请使用以下步骤，当然要替换为适当的路径：\n\n\
  ```\n$ cd /path/to/xdebug/sources\n$ /path/to/phpize\n$ ./configure —with-php-config=/path/to/php-config\n\
  $ make\n$ make install\n```\n\n安装 `XDebug` 后，你需要在 `php.ini` 文件中启用该扩展。由于此扩展需要与 Zend\
  \ 引擎交互，你必须将其作为 `zend_extension` 启用：\n\n```\nzend_extension = /full/path/to/xdebug.so\n\
  ```\n\n如果希望 PHP 引擎找到该扩展，绝对路径是绝对必要的。\n\n你还希望默认禁用该扩展（除非你实际进行性能分析或检查代码覆盖率，否则没有必要降低网站速度）。这也可以在\
  \ `php.ini` 中完成：\n\n```\nxdebug.default_enable = Off\n```\n\n虽然代码覆盖率报告从 CLI 运行，但在完成所有安装任务和\
  \ INI 更改后，你可能需要重启 Web 服务器。\n\n一旦 `XDebug` 可用，生成代码覆盖率报告就像向 `PHPUnit` 添加另一个开关一样简单：\n\
  \n```\n$ phpunit --report UnitTest\n```\n\n\n\n\n\n## 最佳实践\n\n`--report` 开关需要一个目录参数。以这种方式运行时，PHPUnit\
  \ 会在测试执行后生成代码覆盖率报告，并将其保存为 HTML 文件到你指定的目录中。然后你可以在 Web 浏览器中浏览这些报告。例如，图 13.3 展示了我在开发\
  \ Zend Framework 中的 `Zend_Controller` 类时生成的报告。\n\n![Image 130](img/index-487_1.jpg)\n\
  \n图 13.3. 使用 PHPUnit 和 XDebug 生成的代码覆盖率报告  \n如图 13.3 中的图例所示，它定义了三个代码覆盖率阈值：\n\n- 0–35%：低\n\
  - 35–70%：中\n- 70–100%：高\n\n然后你可以深入查看单个文件。图 13.4 展示了 `Zend_Controller_Action` 的一个示例。\n\
  \n![Image 131](img/index-488_1.png)\n\n![Image 132](img/index-488_2.jpg)\n\n![Image\
  \ 133](img/index-488_3.jpg)\n\n图 13.4. `Zend_Controller_Action` 的代码覆盖率分析，展示了未测试、死代码和已测试代码的抽样\n\
  \n在 Web 浏览器中，代码覆盖率报告输出是彩色编码的：绿色标记已执行的代码，红色标记未执行的代码，橙色标记“死”代码，即永远不会被执行的代码（通常是结束大括号）。\n\
  \n注释以及函数和类定义从不计入代码覆盖率。\n\n通过频繁生成这些报告，你可以快速确定哪些文件需要更多覆盖，以及哪些代码需要测试。\n\n### 不要追求 100%！\n\
  \n诚然，在大多数情况下，100% 的代码覆盖率是不可能实现的，尽管报告可能显示已经达到。通常，代码会为许多不同情况而编写，测试其中一种情况就能覆盖它——但无法测试所有情况。经验法则认为，测试覆盖率达到\
  \ 85% 或更高就是优秀的。\n\n### 我回顾了一些旧代码，发现它们很糟糕。如何改进？\n\n当然，你是一位优秀的开发者，会严格维护自己的代码，或者至少偶尔会回头检查六个月或一年前编写的代码，对吧？而且，当你学习新技术或解决问题的新方法时，之前编写的代码突然看起来像一团混乱、纠缠不清的意大利面条。\n\
  \n## 解决方案\n\n解决旧代码噩梦的方法可以概括为一个词：**重构**。\n\n简单来说，重构就是修改程序，使其更易读，或融入更好的结构，同时保留程序的功能。\n\
  \n如果你的代码之前已经过单元测试，那么你就有了进行此类工作的良好基础。在版本控制系统中创建一个新分支，然后开始修改代码。在工作过程中定期运行现有测试，确保没有破坏任何东西。根据你的更改，你可能需要添加新的单元测试。\n\
  \n但要小心不要修改现有的单元测试，因为这可能导致不兼容。\n\n如果涉及的代码*之前没有*经过测试，那么你需要做更多工作。第一步应该是为现有代码编写单元测试。这种方法将有效地为新代码生成一份契约，新代码必须通过这些测试。\n\
  \n此外，在编写测试的过程中，你很可能会发现代码中最脆弱、需要重写的部分，并发现一些 bug。测试完成后，开始重写过程，并经常运行你的测试套件。\n\n## 讨论\n\
  \n重构是一个复杂的话题，这里提供的解决方案只是最简短的总结。如果你想深入探讨这个主题，我推荐一本经典参考书：Martin Fowler 的《重构》。21\n\n\
  ### 如何安全地部署代码？\n\n作为 PHP 开发者，我们不会按照典型的开发模型发布代码：编码、构建、打包、发布。很多时候，我们会在线上系统上进行调整，或者直接将代码部署到线上网站。\n\
  \n这些情况会引发问题，因为我们引入了网站崩溃的可能性。\n\n有多少次，一个修复或新功能破坏了你的网站？有多少次，你需要回滚到项目的上一个版本，却没有干净的方法？\n\
  \n幸运的是，通过遵循本章前面展示的示例，你可能已经在解决许多这类问题：\n\n- 使用版本控制软件。\n- 在版本控制系统中为你的网站维护独立的开发分支和生产分支。\n\
  - 在发布前标记你的生产分支。\n- 为你的代码编写并运行单元测试。\n- 确保尽可能多的代码被你的单元测试覆盖。\n\n## 解决方案\n\n有了这些工具，你只需再走一小步就能达到安全代码部署的平静水域。\n\
  \n#### 使用标签和符号链接\n\n首先，设置一个暂存或质量保证服务器，该服务器可以运行从生产分支签出的副本。这个服务器可以是生产服务器同一台机器上的独立虚拟主机（尽管不推荐），也可以是完全独立的服务器，最好放在防火墙后面（你猜对了——推荐这种方法）。\n\
  \n一旦你将更改从开发分支或主干合并到生产分支，就测试网站。使用单元测试以及通过浏览器进行视觉测试——查看项目通常能发现测试无法找到的问题。\n\n一旦你确信网站运行得令你满意——或者更好的是，令你的老板或客户满意——就标记生产分支。我通常用日期和更改摘要的组合来命名标签，如下所示：\n\
  \n```\n$ svn copy https://example.com/svn/project/branch/production\n➥ https://example.com/svn/project/tag/2007-01-01-NewYearAnnc\n\
  ➥ -m 'New Year announcements'\n```\n\n在生产服务器上导出标签：\n\n```\n$ svn export\n➥ https://example.com/svn/project/tag/2007-01-01-NewYearAnnc\n\
  ➥ /path/to/web/2007-01-01-NewYearAnnc\n```\n\n然后，当你准备好发布更改时，使用**符号链接**。符号链接是 Unix\
  \ 类操作系统中的一种特殊目录条目。符号链接不是像目录或文件那样的字面目录条目，而是对另一个目录条目的引用。在这个例子中，我们假设 `/path/to/web/production`\
  \ 是你的网站安装位置。这将是一个符号链接。当需要发布时，记下符号链接指向的位置，然后执行以下命令：\n\n```\n$ rm /path/to/web/production\n\
  $ ln -s /path/to/web/2007-01-01-NewYearAnnc /path/to/web/production\n```\n\n如果需要回滚到之前的版本，只需将符号链接指向前一个安装目录即可。\n\
  \n#### 使用构建系统\n\n在部署过程中，很可能还需要执行其他任务。\n\n通常，用户生成的内容不会保存在仓库中，因此需要在发布前将其传输到新的安装目录。如果版本之间进行了数据库更改，也需要应用这些更改，或者需要使用单独的数据库，并在生产和暂存安装之间同步内容。如果在部署新版本的网站时需要执行许多额外任务（例如这里提到的），你可能需要考虑使用一个构建系统来处理这类事情。例如：\n\
  \n**GNU Make (http://www.gnu.org/software/make/)**\n\n历史悠久的 GNU Make 不仅可用于 C 代码，还已在许多项目中成功用于执行网站安装和升级任务。\n\
  \n**Phing (http://phing.info/trac/)**\n\n\n\n\n\n## 最佳实践\n\nPhing 并非 GNU Make，它基于\
  \ Java 构建系统 Apache Ant。使用 Phing 时，你需要通过 XML 构建文件来定义构建目标和任务。\n\n请仔细确定成功发布网站所需执行的所有任务，并在开发环境中定期进行测试运行。\n\
  \n任务越多越复杂，引入错误的可能性就越大。尽可能遵循 KISS 原则——保持简单明了（Keep It Simple Stupid），你的项目部署就会更成功。\n\
  \n## 讨论\n\n如果你有一个程序员团队，请确保部署过程足够简单，团队中的任何成员都能以最少的精力在自己的机器上完成部署。\n\n符号链接方法可能看起来过于简单，但正如我可能提到过的，部署过程越简单，成功的可能性就越大。最终，任何部署的成功都取决于整个开发过程——从规划、编码到最终发布，以及其间的一切。如果你在编码时注重可扩展性，编写并运行单元测试，记录代码，并高效利用版本控制软件，那么在最终部署时，简单可靠的流程可能就足够了。\n\
  \n## 总结\n\n最佳实践涵盖的主题非常广泛，其中任何一个主题都可以单独用一章甚至一本书来阐述。我们在本章中讨论的许多问题起初可能看起来并不重要，尤其是当你独自维护项目，或者与一群志同道合的开发者组成的小团队合作时。然而，当你第一次需要参与公共项目，或与另一个开发团队合作——更糟糕的是，当你误删项目目录或在项目中引入错误时——这些实践的价值就会立刻显现出来。\n\
  \n版本控制很快就会成为你的好帮手，尤其是当你希望保持生产代码稳定，同时继续开发项目（无论是添加新功能还是修复 bug）时。当你需要开发一个涉及多个代码区域的功能时，能够创建分支以将你的更改与主开发主干隔离，将成为一个无价的优势。\n\
  \n采用编码标准将为你省去许多麻烦，无论是他人审查你的代码，还是你审查他人的代码。如果大家都采用相同的风格编写代码，代码将更易于阅读和理解。此外，使用合理的文件和类命名约定，将使后续修订时查找代码更加容易，并避免命名冲突带来的问题。\n\
  \n代码文档常常被忽视。像 `phpDocumentor` 这样的工具可以让你在编写代码的同时更轻松地记录代码。只需编写几个代码块，然后在你的代码库上运行一次\
  \ `phpDocumentor`，你就会发现只需在代码中添加一些注释，就能快速生成 API 文档。\n\n我本可以专门用一整本书来讨论单元测试。我甚至可以说，单元测试可以说是本章中你应该学习并融入日常习惯的最佳实践。测试代码将帮助你更好地定义接口，使它们相互隔离，并开发出更稳定、更可靠的代码。编写测试，更重要的是，经常运行它们。定期运行代码覆盖率报告，以确保尽可能多地覆盖你的代码。\n\
  \n最后，PHP 开发中一个经常被忽视的方面是实际的部署过程——将代码推送到生产服务器，并确保在失败时能够回滚的细节。像 GNU Make 和 Phing 这样的工具可以帮助自动化这些任务；然而，不要低估一个好的仓库策略和符号链接的简单性。通常最简单的解决方案就是最好的！\n\
  \n本章概述的实践只是冰山一角。将你能做到的部分融入日常习惯，同时不断审视你的流程，并问自己如何能更好地完成任务。重构你的流程最终将成为你工具箱中最有用的工具。\n\
  \n# 附录 A：PHP 配置\n\n这份 PHP 配置快速参考涵盖了你需要了解的最重要的通用设置，无论是运行应用程序于生产环境，还是因为这些设置会影响安全性或你编写代码的方式。\n\
  \n## 配置机制\n\n配置 PHP 的主要机制是 `php.ini` 文件。作为主文件，它让你能够控制所有配置设置。PHP 手册包含一份配置 PHP 的指南[¹]，并记录了所有可用的配置选项及其设置位置[²]。请注意，某些配置选项只能在\
  \ `php.ini` 文件中设置，而其他选项则可以在本节后面讨论的其他位置设置。\n\n`php.ini` 文件中的条目通常采用以下格式：`setting=value`\n\
  \n不过，在修改之前，请务必阅读文件中提供的注释。这些注释描述了一些技巧，例如 `include_path` 在 Unix 上使用冒号（`:`）作为分隔符，在\
  \ Windows 上使用分号（`;`），这些你都需要了解。\n\n大多数网络主机不允许你访问自己的 `php.ini` 文件，除非你拥有系统的 root 权限，而如果你使用的是廉价的共享主机服务，通常情况并非如此。另一种方法是使用\
  \ `.htaccess` 文件来配置 PHP（假设 Web 服务器是 Apache）。\n\n`.htaccess` 文件是一个纯文本文件，你将其放置在公共\
  \ Web 目录中，用于控制 Apache 在提供该目录页面时的行为；例如，你可以在 `.htaccess` 文件中标识允许公共访问的页面。请注意，`.htaccess`\
  \ 文件的效果是递归的——它也适用于子目录。\n\n[¹]: http://www.php.net/manual/en/configuration.php\n\
  [²]: http://www.php.net/manual/en/ini.php\n\n为了能够使用 `.htaccess` 文件配置 PHP，你的托管服务提供商必须在\
  \ Apache 的主配置文件 `httpd.conf` 中为你的 Web 目录应用了 `AllowOverride Options` 或 `AllowOverride\
  \ All` 设置。如果已经完成，你可以使用两个 Apache 指令来修改 PHP 的配置：\n\n- `php_flag` – 用于布尔值设置（即 on/off\
  \ 或 1/0），例如 `register_globals`\n- `php_value` – 用于为设置指定字符串值，例如 `include_path` 设置\n\
  \n以下是一个 `.htaccess` 文件的示例：\n\n```\n# 关闭 register globals\nphp_flag register_globals\
  \ off\n\n# 设置 include 路径\nphp_value include_path \".:/home/username/pear\"\n```\n\
  \n控制 PHP 配置的最后一个机制是一组函数，包括 `ini_set` 和 `ini_alter`，它们允许你修改配置设置；`ini_get` 允许你检查配置设置；以及\
  \ `ini_restore`，它将 PHP 配置重置为 `php.ini` 和任何 `.htaccess` 文件定义的默认值。以下是一个示例，其中使用 `ini_set`\
  \ 使我们无需在连接 MySQL 时定义主机、用户名和密码：\n\n```php\nini_set('mysql.default_host', 'localhost');\n\
  ini_set('mysql.default_user', 'harryf');\nini_set('mysql.default_password', 'secret');\n\
  \nif (!mysql_connect())\n{\n    echo mysql_error();\n}\nelse\n{\n    echo 'Success';\n\
  }\n```\n\n请注意，对于某些设置，例如 `error_reporting`，PHP 提供了与 `ini_set` 功能相同的替代函数。你可以使用任何你喜欢的方法。\n\
  \n另外请注意，某些设置（如 `register_globals`）只能通过 `php.ini` 或 `.htaccess` 进行有效修改，因为这些设置会在 PHP\
  \ 开始执行脚本之前影响其行为。\n\n\n\n\n\n此外，有些配置设置只能在 `php.ini` 中更改——例如 `extension_dir`，它告诉 PHP\
  \ 可以找到 PHP 扩展的目录。有关控制设置的完整参考，请参阅 PHP 手册。³\n\n## 关键安全性和可移植性设置\n\n表 A.1 显示了与 PHP 脚本的安全性和可移植性相关的最重要的\
  \ PHP 设置。\n\n## 包含与执行设置\n\n表 A.2 显示了与包含以及 PHP 脚本运行情况相关的最重要的 PHP 设置。\n\n³ http://www.php.net/ini_set\n\
  \n### 表 A.1. 关键安全性和可移植性设置\n\n| 设置 | 默认值 | 说明 |\n| --- | --- | --- |\n| `register_globals`\
  \ | off | 此设置会自动从传入的 HTTP 请求变量（如 GET 和 POST）创建全局变量。出于安全性和可移植性考虑，强烈建议关闭此设置。更多详情请参见第\
  \ 1 章“关闭 `register_globals`”一节或 http://www.php.net/register_globals/。 |\n| `magic_quotes_gpc`\
  \ | off | 此设置会自动用反斜杠转义传入的 HTTP 请求变量中的引号，有助于防止 SQL 注入攻击。如果你清楚自己在做什么，通常最好关闭此功能，并在将数据插入数据库时自行处理转义，因为该功能可能会在表单中引发问题，并带来性能开销。有关使脚本兼容此功能的信息，请参见第\
  \ 1 章“检查魔术引号”一节。 |\n| `call_time_pass_reference` | off | 此设置允许你在调用时使用变量引用（例如 `htmlentities(&$string)`）。为了保持代码清晰易懂并确保其可移植性，请保持此功能关闭。\
  \ |\n| `short_open_tag` | on | 此设置允许你仅用 `<?` 而不是较长的 `<?php` 来开始一段 PHP 代码。它还允许你使用\
  \ `<?=` 输出 PHP 表达式，这与 `<?php echo` 相同。虽然方便，但这些快捷方式不符合 XML 规范，并且当 PHP 处理器遇到 XML 处理指令（如\
  \ `<?xml version=\"1.0\"?>`）时可能会造成混淆。许多人已关闭 `short_open_tag`，因此为了最大可移植性，请避免使用这些快捷方式，并在开发期间关闭此功能。\
  \ |\n| `asp_tags` | off | 此设置允许使用 ASP 风格的标签（`<% … %>`）作为 PHP 开始和结束标签（`<?php … ?>`）的替代。很少有人使用此功能，因此为了最大可移植性，最好避免使用它们，并在开发期间关闭此功能。\
  \ |\n| `error_reporting` | `E_ALL & ~E_NOTICE` | 在开发时，为了最大可移植性，最好将此选项设置为 `E_ALL`（在\
  \ PHP 5 中为 `E_STRICT`），这样 PHP 会通知你诸如代码依赖的 `$_GET` 变量尚未初始化等情况。这会迫使你编写更安全、逻辑错误更少的代码，以避免警告。这也能确保你的代码在其他以这种方式配置的服务器上顺利运行。\
  \ |\n| `display_errors` | on | 此设置决定 PHP 是否将错误消息发送到浏览器。当你在生产环境中运行应用程序时，通常最好关闭此选项，而改用\
  \ PHP 的日志机制将错误捕获到文件中。 |\n| `open_basedir` | 未设置 | 此设置允许你将所有 PHP 文件操作限制在指定目录及其子目录中。例如，如果你希望防止用于显示文件内容的脚本访问服务器上其他位置的敏感文件，这是一个好主意。\
  \ |\n| `allow_url_fopen` | on | 此设置允许你为 `fopen` 等函数指定远程文件位置（例如 `fopen('http://www.sitepoint.com/','r')`）。这是一个方便的工具，但对于编写不当的脚本来说也可能存在安全风险。如果你确定不需要它，请将其关闭。\
  \ |\n\n### 表 A.2. 包含与执行设置\n\n| 设置 | 默认值 | 说明 |\n| --- | --- | --- |\n| `include_path`\
  \ | '.' | 此设置允许你指定当使用包含相关命令时 PHP 应搜索的相对和绝对路径。请确保至少指定当前目录（`.`），否则大多数第三方脚本将无法工作。在\
  \ Unix 系统上，目录列表用冒号（`:`）分隔，而在 Windows 上，分隔符是分号（`;`）。为了方便，常量 `DIRECTORY_SEPARATOR`\
  \ 会根据操作系统设置为正确的字符，从而更容易生成跨平台兼容的代码。 |\n| `auto_prepend_file` | 未设置 | PHP 会在执行任何请求的脚本之前执行此设置中指定的文件。此设置对于执行全站操作（如安全、日志记录、定义错误处理程序、去除魔术引号功能添加的反斜杠等）非常有用。它也适用于你确定仅供自己使用的应用程序，但不适用于打算分发的代码，因为那些无法通过\
  \ `.htaccess` 文件修改 `php.ini` 设置的人将无法使用此类代码。列表分隔符与 `include_path` 设置使用的相同。 |\n| `auto_append_file`\
  \ | 未设置 | 与 `auto_prepend_file` 对应，此设置在请求的脚本执行后执行。 |\n| `max_execution_time` | 30\
  \ | 此设置指定通过 Web 服务器运行的 PHP 脚本允许执行的最大时间（以秒为单位）。通常，最好保留默认设置，并使用 `set_time_limit` 函数按脚本扩展限制。将任一设置的值设为\
  \ 0 会取消对脚本执行时间的限制。 |\n| `memory_limit` | 8M | 此设置决定 PHP 在运行时可用的内存量。通常默认值就足够了，但例如在处理非常大的\
  \ XML 文档或处理图像时，你可能需要增加它。此值越大，脚本实际使用的内存越多，服务器上其他应用程序可用的内存就越少。 |\n| `post_max_size`\
  \ | 8M | 此设置反映 PHP 通过 HTTP POST（例如上传图像的表单）接受的最大数据量。如果你的应用程序允许用户上传更大的文件，你可能需要增加此值。\
  \ |\n\n## 与错误相关的设置\n\n表 A.3 显示了与 PHP 处理错误方式相关的最重要的 PHP 设置。请注意，`display_errors` 和\
  \ `error_reporting` 未包含在此处，因为它们已在表 A.1 中描述过。\n\n### 表 A.3. 与错误相关的设置\n\n| 设置 | 默认值\
  \ | 说明 |\n| --- | --- | --- |\n| `log_errors` | off | 此设置与 `error_log`（见下文）结合使用，允许你将错误记录到文本文件中。对于已关闭向访问者显示错误的在线站点，此设置非常有用。\
  \ |\n| `error_log` | 未设置 | 此设置允许你指定一个文件名，当 `log_errors` 开启时，错误将被记录到该文件中。 |\n| `ignore_repeated_errors`\
  \ | off | 使用此设置，如果同一错误在同一个 PHP 脚本的同一行多次出现，则每次脚本执行仅报告一次该错误。此设置有助于防止因循环中发生的错误被记录到文本文件而导致日志文件过大。\
  \ |\n| `ignore_repeated_source` | 30 | 此设置与 `ignore_repeated_errors` 类似，但在此情况下，它会抑制整个\
  \ PHP 脚本中同一类型的重复错误。 |\n| `report_memleaks` | on | |\n\n\n\n\n\n请确保此设置已开启，特别是当你使用\
  \ PHP 的实验版本或不稳定版本时。否则，一旦泄漏的内存耗尽所有可用空间，你的服务器可能会崩溃。必须将 `error_reporting` 设置为报告警告，此设置才能生效。\n\
  \n## 附录 A：PHP 配置\n\n### 杂项设置\n\n表 A.4 显示了你在 PHP 配置中应注意的其他重要设置。\n\n**表 A.4. 杂项设置**\n\
