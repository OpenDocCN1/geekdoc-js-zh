  \ 并不简单的饼图\n\n## 讨论\n\nJpGraph 代表了 PHP 中首屈一指的图表解决方案，它提供的功能远不止我们在这些例子中探索到的。特别值得注意的是，该解决方案允许你将渲染后的图表存储为\
  \ PNG 文件，这样你就可以只渲染一次图表，然后重复使用完成的图像。如果你想保存上述代码创建的图表，只需在调用 `Stroke` 时提供一个文件名，并确保 Web\
  \ 服务器有权限写入该位置。示例如下：\n\n```\n$graph->Stroke('humble_pie.png');\n```\n\n此过程将创建一个名为\
  \ `humble_pie.png` 的文件，并且不会向浏览器返回任何内容。\n\n## 如何防止图片热链接？\n\n你可能会遇到的一个问题，特别是如果你的网站托管了独特的图片，就是其他网站从它们的页面**热链接**你的图片，以显得它们拥有或托管了你酷炫的图片。除了潜在的版权问题外，外部网站的热链接还可能消耗你的带宽。\n\
  \n热链接必须像瘟疫一样避免，我相信你也会同意！\n\n## 解决方案\n\n这里有两个解决方案；一个使用 Apache 的 `mod_rewrite` 扩展，另一个使用\
  \ PHP 会话。\n\n图像\n\n231\n\n#### 使用 Apache 的 mod_rewrite\n\nWeb 浏览器的默认行为是在每个 HTTP\
  \ 请求中发送一个 referer 值。该值表示当前请求来源的 URL。对于图片的 HTTP 请求，该 URL 应反映图片所在的页面。我们可以使用 Apache\
  \ 的 `mod_rewrite` 来检查访问浏览器提供的引用信息，以确保对我们网站图片的所有请求的引用来源都是本地网页。例如，我们可以将这些设置放在 Web\
  \ 服务器的 `http.conf` 文件中：\n\n```\nSetEnvIfNoCase Referer \"^http://www\\.sitepoint\\\
  .com/\"\n➥ locally_linked=1\nSetEnvIfNoCase Referer \"^http://sitepoint\\.com/\"\
  \ locally_linked=1\nSetEnvIfNoCase Referer \"^$\" locally_linked=1\n<FilesMatch\
  \ \"\\.(gif|png|jpe?g)$\">\nOrder Allow,Deny\nAllow from env=locally_linked\n</FilesMatch>\n\
  ```\n\n这里，我们指示任何对文件名以 `.gif`、`.png`、`.jpeg` 或 `.jpg` 结尾，并且 referer 字段包含 `http://www.sitepoint.com/`、`http://sitepoint.com/`\
  \ 或空字符串的请求，都应被视为有效。因此，此配置应阻止任何 referer 字段中不包含这些值的图片请求。我们需要允许 referer 字段为空的请求，因为它们可能是合法请求——很可能有些请求没有\
  \ referer 信息。例如，访问你网站的访客完全有可能出于隐私原因禁用了 referer 信息的报告。简而言之，不能依赖该字段来确定是否发生了热链接；为了避免因可能合法的请求而阻止图片，我们需要允许此类请求。\n\
  \n#### 使用 PHP 会话\n\n另一种选择是使用 PHP 会话来确认查看图片的人是你网站的访客。诀窍是注册一个会话变量，访客必须拥有该变量才能查看图片，然后使用第二个脚本来渲染图片。例如，下面是一个显示图片的简单网页，其中图片源\
  \ URL 是一个 PHP 脚本，确保只有有效的网站访客才能看到图片：\n\n232\n\nPHP 文集\n\n`hotlinking.php` *(摘录)*\n\
  \n```\n<?php\nsession_start();\n$_SESSION['viewImages'] = true;\n?>\n<!DOCTYPE html\
  \ public \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<title>防止热链接</title>\n\
  <meta http-equiv=\"Content-Type\"\ncontent=\"text/html; charset=iso-8859-1\" />\n\
  </head>\n<body>\n<p>这是图片：</p>\n<img src=\"getimage.php?img=husky.jpg\">\n</body>\n\
  </html>\n```\n\n注意，这段代码注册了一个名为 `viewImages` 的会话变量，并且在 `<img>` 标签的 `src` 属性中出现了 `getimage.php?img=husky.jpg`\
  \ 的值。以下是 `getimage.php` 脚本的代码。首先，我们检查 `viewImage` 会话变量是否已设置为 `true`：\n\n`getimage.php`\
  \ *(摘录)*\n\n```\n<?php\nsession_start();\nif (isset($_SESSION['viewImages']) &&\n\
  $_SESSION['viewImages'] == true)\n{\n```\n\n如果 `viewImage` 会话变量已设置为 `true`，则检查通过\
  \ `$_GET['img']` 变量提供的图片名称，确保它已注册在允许的图片数组 `$images` 中：\n\n\n\n\n12 一种更实用的替代方案是将图像列表存储在数据库中。无论你如何管理列表，都必须验证所请求的文件是否是你打算授予访问权限的文件；否则，你可能允许访问超出预期的内容。\n\
  \n## 图像\n\n### getimage.php（节选）\n\n```php\n$images = array(\n    'golden_retriever.jpg',\n\
  \    'husky.jpg'\n);\n\nif (isset($_GET['img']) && in_array($_GET['img'], $images))\n\
  {\n```\n\n请求有效，因此我们输出响应头信息和图像：\n\n### getimage.php（节选）\n\n```php\n$dims = getimagesize('sample_images/'\
  \ . $_GET['img']);\nheader('Content-Disposition: inline; filename=' . $_GET['img']);\n\
  header('Content-Type: ' . $dims['mime']); # PHP 4.3.x +\nheader('Content-Length:\
  \ ' . filesize('sample_images/' . $_GET['img']));\nreadfile('sample_images/' . $_GET['img']);\n\
  }\n```\n\n注意，该脚本还使用了你在“如何在不拉伸图像的情况下调整大小？”中见过的 `getimagesize` 函数来获取图像的正确 MIME 类型。\n\
  \n最后，我们通过返回 HTTP 状态码 404 Not Found 来处理错误情况：\n\n### getimage.php（节选）\n\n```php\n\
  else\n{\n    header(\"HTTP/1.1 404 Not Found\");\n    header(\"Content-Type: text/plain\"\
  );\n    echo \"Invalid image or no image specified\\n\";\n}\n}\nelse\n{\n    header(\"\
  HTTP/1.1 404 Not Found\");\n    header(\"Content-Type: text/plain\");\n```\n\n![Image\
  \ 81](img/index-256_1.jpg)\n\n234\n\nPHP 文集\n\n```php\n    echo \"This image is\
  \ protected from hotlinking\\n\";\n}\n?>\n```\n\n这种保护措施应该能阻止除最顽固的盗链者之外的所有人。\n\n\
  ## 如何创建仅能由人类验证的图像？\n\n随着自动垃圾邮件机器人数量不断增长，它们不知疲倦地扫描网络，人类验证技术正成为创建网页表单时越来越必要的组成部分。最常见的技术是全自动区分计算机和人类的图灵测试——方便地缩写为\
  \ **CAPTCHA**——它向访问者展示一个单词或字符序列，使得机器难以解读，但人类容易阅读和输入。13\n\n## 解决方案\n\n方便的是，我们在“如何用\
  \ PHP 显示图表和图形？”中讨论的 JpGraph 库提供了一个极其易用的 CAPTCHA 实现：\n\n### captcha.php（节选）\n\n```php\n\
  <?php\nrequire_once \"jpgraph_antispam.php\";\n$spam = new AntiSpam();\n$chars =\
  \ $spam->Rand(6);\n$spam->Stroke();\n?>\n```\n\n该脚本的一个示例结果如图 8.10 所示。\n\n图 8.10.\
  \ 使用 JpGraph 创建的 CAPTCHA 图像\n\n13 你可以在官方网站上阅读更多关于 CAPTCHA 的信息：http://www.captcha.net/。\n\
  \n图像\n\n235\n\n如果你想指定一个特定的单词出现在框中，只需将调用 `Rand` 改为：\n\n```php\n$spam->Set(\"my_string\"\
  );\n```\n\n## 讨论\n\n当然，这只是故事的一半。你需要将 CAPTCHA 文本存储在某处——例如在会话变量中——以便在下一页验证用户输入的文本。不过，不要将文本作为表单字段传递，即使是隐藏字段也不行，因为它可能被恶意用户篡改。\n\
  \n## 总结\n\n在本章中，我们探讨了 MIME 类型、调整图像大小、创建图库、提取 EXIF 信息、添加水印、生成图表、防止图像盗链以及创建 CAPTCHA\
  \ 图像等主题。结合本书其他章节的技巧，你已经具备了创建一系列图像处理脚本的能力，从非常实用到真正独特。\n\n然而，你应该考虑的一个问题是实时图像处理的性能影响，它会消耗大量的处理时间。假设一个图库有\
  \ 100 个文件夹，每个文件夹包含 100 张图像；即使对于普通度假者来说，这个数量也不算特别大。为每个访问者创建 10,000 张缩略图可不是一个小任务。同样，为每次页面加载创建公司网站的横幅图像不仅耗时，而且在很大程度上是不必要的。\n\
  \n虽然我们在这里介绍的简单缩略图缓存技术适用于许多情况，但对于图像可能随时间变化的场景（例如基于不断变化的数据集创建图表）并不合适。\n\n我强烈建议你参考第\
  \ 11 章，了解更高级的性能改进技术。\n\n在 PHP 中操作图像的做法非常普遍。例如，社交网站会创建个人资料图像的缩略图，网页表单使用 CAPTCHA 图像，以及照片图库网站允许你在网页浏览器中编辑、裁剪和旋转图像（很可能通过大量使用\
  \ JavaScript 和 Ajax）。你能实现什么，或多或少只受限于你的想象力！\n\n# 第 9 章：错误处理\n\n在 PHP 中，错误用于指示语法、环境或编程问题：\n\
  \n- **语法错误**  \n  这些是不可恢复的编译时错误，指示语法问题，并导致 PHP 解释器停止。\n\n- **环境错误**  \n  环境错误是与脚本运行时环境及相关服务相关的问题。此类错误可能表示数据库服务器不可用、文件无法打开、权限级别导致的限制等。\n\
  \n- **编程错误**  \n  编程错误是在正常程序执行过程中发生的意外事件。这种错误可能表示，例如，向函数调用传递了意外的参数（如函数期望字符串时传递了数组）、引用了未定义的变量或数组索引等。\n\
  \n![Image 82](img/index-260_1.png)\n\n![Image 83](img/index-260_2.jpg)\n\n238\n\n\
  PHP 文集\n\n## 逻辑错误\n\n另一种类型的错误——**逻辑错误**——很常见但更难检测。这种错误会在看似成功执行的情况下产生不正确的结果。这些类型的错误通常是程序员造成的程序设计问题。它们通常在单元测试期间处理，本章将不涉及。\n\
  \nPHP 5 中的错误有两种形式：**标准 PHP 错误**和**异常**。\n\n标准 PHP 错误报告处理所有类型的错误。错误消息是全局报告的，每个错误都与一个表示错误严重性或类型的错误级别相关联。传统上，PHP\
  \ 的环境和编程错误通过函数的返回值处理，或者通过使用 `trigger_error` 或 `die` 函数生成全局警告或致命错误来处理。然而，这通常只适用于使用\
  \ PHP 5 之前版本的开发者，当时没有其他错误报告方法可用。\n\n在 PHP 5 中，异常用于指示发生了异常事件（例如环境或编程错误），从而中断脚本的正常执行。异常通过\
  \ `throw` 语句报告，通常表示无法按预期继续执行。它们通过 `try {…} catch(Exception $e) {…}` 块捕获和处理，该块作为编程逻辑的一部分包含在内。抛出和捕获异常是面向对象编程的主要错误处理机制。每个异常对象都是\
  \ PHP 5 原生 `Exception` 类的实例或其子类的实例。\n\n在本章中，我们将探讨 PHP 提供的灵活性，以便扩展其原生错误和异常报告机制。我们还将看到如何利用这些机制来更好地控制错误和异常的处理方式。这些工具将帮助你处理错误，并提供优雅退出执行、轻松调试应用程序以及成功监控应用程序健康状况的方法。\n\
  \n## PHP 报告哪些错误级别？\n\n\n\n\n\n## 错误处理\n\n正如我在引言中提到的，PHP 错误分为多种类别。有效利用 PHP 的错误处理机制需要对\
  \ PHP 错误有所了解，因此我们快速浏览一下 PHP 错误级别的总结。你也可以查阅 PHP 错误函数手册页面以获取关于此主题的完整信息。[1]\n\n[1]:\
  \ http://www.php.net/errorfunc/\n\n## 解决方案\n\nPHP 将错误分为不同级别，每个级别对应一个整数位运算符——整数随错误严重程度递增。大多数开发者需要理解的错误级别如表\
  \ 9.1 所示。[2]\n\n[2]: 注意，`_USER` 变体表示由用户代码通过 `trigger_error` 或 `die` 触发的错误，其严重程度大致相当。\n\
  \n**表 9.1. PHP 错误级别**\n\n| 级别 | 描述 |\n|-------|-------------|\n| `E_NOTICE` / `E_USER_NOTICE`\
  \ | 此通知表示脚本中*可能*存在错误——请注意我强调的*可能*。这类错误通常意味着发生了某些可能表明逻辑错误或遗漏的情况，尽管并未导致 PHP 解释器失败。示例包括访问未定义的变量或数组索引。\
  \ |\n| `E_WARNING` / `E_USER_WARNING` | 警告表示 PHP 已恢复的非致命错误。警告通常保留给环境错误，例如执行脚本无法访问数据库或\
  \ Web 服务、运行第三方扩展时发生的错误等。 |\n| `E_ERROR` / `E_USER_ERROR` | 这些是 PHP 无法恢复的致命运行时错误；通常，它们是在操作系统级别发生的错误，例如分配内存或磁盘空间时遇到的问题。注意，`E_USER_ERROR`\
  \ 实际上是可恢复的；当此类错误在自定义错误处理程序中被捕获时，开发者可以选择是否退出脚本执行。 |\n| `E_STRICT` | `E_STRICT` 错误基本上是通知，但用于指示你使用的代码可能已弃用，或可能未遵循\
  \ PHP 解释器确定的最佳实践。 |\n\n## PHP 提供了哪些内置的错误处理设置？\n\n如果 PHP 可以生成错误，那么一定有某种自动处理这些错误的方法，对吗？提供错误报告功能却没有处理错误的能力会让开发者束手无策。那么，开发者可以使用哪些错误处理设置呢？\n\
  \n## 解决方案\n\nPHP 有几种内置的显示和记录错误的机制。以下每个指令都可以通过 `ini_set`、Web 服务器的 `.htaccess` 文件或\
  \ `php.ini` 文件进行管理。\n\n#### error_reporting 指令\n\n设置 `error_reporting` 指令以指示需要报告哪些错误。\n\
  \n在开发期间，通常将此指令设置为 `E_ALL | E_STRICT`，这将通知你应用程序中发生的任何 PHP 错误。一旦代码进入生产环境，你可能希望收紧此设置，以免错误日志（稍后详细讨论）被填满；`E_ERROR\
  \ | E_USER_ERROR | E_WARNING | E_USER_WARNING` 通常是生产环境的不错选择。\n\n#### display_errors\
  \ 指令\n\n当设置了 `display_errors` 时，PHP 错误将以内联方式显示在脚本的输出中。这是开发中一个很好的设置，但如果错误发生在输出 HTTP\
  \ 标头时，它可能会干扰你试图发送的任何 HTTP 标头。\n\n一旦应用程序进入生产环境，请关闭 `display_errors`，以免这些消息显示给用户。\n\
  \n#### log_errors 和 error_log 指令\n\n如果设置了 `log_errors`，错误将记录到 `error_log` 指令指定的位置。此设置对于维护应用程序或站点中遇到的错误的运行日志非常有用，并且很有帮助，因为它可以作为禁用\
  \ `display_errors` 指令时可能出现的所有错误的参考。\n\n你可能希望设置 `ignore_repeated_errors` 和 `ignore_repeated_source`，以防止当同一错误重复出现时日志被填满。\n\
  \n## 如何触发 PHP 错误？\n\n触发错误的能力并不仅限于 PHP 解释器。有时，你可能会发现自行生成 PHP 错误很有用——它们可以用作调试辅助工具，在你发布给其他人的代码中生成弃用通知等。\n\
  \n那么，如何触发 PHP 错误呢？\n\n## 解决方案\n\n你可以使用 PHP 的 `trigger_error` 函数在代码中触发错误。该函数具有以下原型：\n\
  \n```\ntrigger_error($error_message, $error_type = E_USER_NOTICE);\n```\n\n`$error_type`\
  \ 参数必须是用户错误常量之一：`E_USER_NOTICE`、`E_USER_WARNING` 或 `E_USER_ERROR`，如上代码所示，默认为 `E_USER_NOTICE`。\n\
  \n## 讨论\n\n当 PHP 开发者首次发现 `trigger_error` 时，他们倾向于将其用于代码中观察到的任何错误情况。然而，存在更好的策略。\n\n\
  主要在开发调试代码时触发 `E_USER_NOTICE`。通知有助于指示已设置的值、某些代码段何时执行等。（但请注意，这不是最高效的调试方式。）\n\n当你的代码检测到可以优雅恢复的异常情况时，触发\
  \ `E_USER_WARNING`。例如，如果无法联系到 Web 服务，但你的代码仍然能够生成错误消息，则可能出现这种情况；在这种情况下，警告可能有助于你稍后检查应用程序与\
  \ Web 服务服务器的连接性。\n\n当你的代码遇到无法恢复的问题时，触发 `E_USER_ERROR`。此类问题的示例包括执行脚本无法连接到数据库，或者你发现网站模板目录不可读。\n\
  \n## 如何使用 PHP 实现自定义错误处理程序？\n\n用于处理错误的 `php.ini` 设置相当有限。它们实际上只涵盖显示和记录错误的任务——你甚至无法指定这些错误的记录或显示格式！如果你想执行这些任务之外的操作怎么办？\n\
  \n## 解决方案\n\nPHP 允许开发者定义自定义错误处理程序。此类错误处理程序可以构成任何有效的 PHP 回调：函数、静态类方法或动态类方法。无论你决定使用哪种回调，它都必须遵循错误处理程序原型：\n\
  \n```\nfunction handler($errno, $errmsg[, $filename[, $linenum[, $vars]]])\n```\n\
  \n当调用自定义错误处理函数时，第一个参数 `$errno` 将包含错误级别（整数）；第二个参数 `$errmsg` 将包含错误描述。`$filename` 包含引发错误的代码所在文件名，`$linenum`\
  \ 包含引发错误的行号，`$vars` 包含触发错误时作用域内所有变量的数组。你可以选择在错误处理程序中执行任何任务：记录错误、将错误详情通过邮件发送给系统管理员或开发者、打印错误详情等。\n\
  \n但是，你应该理解，如果你没有在错误处理程序中显式退出脚本执行，程序执行将从最初触发错误的位置继续。不过，你的代码不会知道错误处理程序中执行了哪些任务。\n\n\
  使用 `set_error_handler` 函数告诉 PHP 使用你的错误处理程序：\n\n```\nset_error_handler($error_handler[,\
  \ $error_types])\n```\n\n\n\n\n第一个参数是一个回调函数，它引用了你的错误处理器。可选的第二个参数用于告诉 PHP 你的自定义函数应该处理哪些错误类型。默认情况下，如果不提供错误类型，除了\
  \ `E_ERROR`、`E_PARSE`、`E_CORE_ERROR`、`E_CORE_WARNING`、`E_COMPILE_ERROR`、`E_COMPILE_WARNING`\
  \ 和 `E_STRICT` 之外的所有错误都会被处理。由于你可以指定类型，因此可以指定多个错误处理器——每个你想处理的类型对应一个。\n\n然而，一个更简单的解决方案是，为你想要处理的所有错误类型使用一个统一的错误处理器，并在其中使用\
  \ `switch` 语句，该语句利用处理器函数的第一个参数（由 `$errno` 表示）的值来选择针对特定错误类型的替代操作。`$errno` 是触发错误的错误级别，即“PHP\
  \ 报告哪些错误级别？”中列出的错误类型常量所代表的整数值。然后，如果错误被处理，错误处理器需要返回 `true`，否则返回 `false`；返回 `false`\
  \ 告诉 PHP 将错误处理控制权交给默认的错误处理器。例如，下面是一个 PHP 5 类，它实现了一个自定义错误处理器，该处理器根据引发的错误级别选择适当的替代操作：\n\
  \n`ErrorHandler.class.php` *(摘录)*\n\n```php\n<?php\n\nclass ErrorHandler\n{\n\n\
  \    protected $_noticeLog = '/tmp/notice.log';\n\n    public $message = '';\n\n\
  \    public $filename = '';\n\n    public $line = 0;\n\n    public $vars = array();\n\
  \n    public function __construct($message, $filename, $linenum, $vars)\n    {\n\
  \        $this->message = $message;\n        244\n        The PHP Anthology\n  \
  \      $this->filename = $filename;\n        $this->linenum = $linenum;\n      \
  \  $this->vars\n            = $vars;\n    }\n```\n\n构造函数接受各种错误属性作为参数，并将它们存储在对象的属性中。`$_noticeLog`\
  \ 变量存储了 `E_USER_NOTICE` 级别错误消息的日志文件位置。如果你在 Windows 机器上测试，应该将此值更改为类似 `C:\\notice.log`\
  \ 的内容，或者系统上的适当位置。\n\n下面是我们类的自定义错误处理方法：`ErrorHandler.class.php` *(摘录)*\n\n```php\n\
  \    public static function handle($errno, $errmsg, $filename, $line, $vars)\n \
  \   {\n        $self = new self($errmsg, $filename, $line, $vars);\n        switch\
  \ ($errno) {\n            case E_USER_ERROR:\n                return $self->handleError();\n\
  \            case E_USER_WARNING:\n            case E_WARNING:\n               \
  \ return $self->handleWarning();\n            case E_USER_NOTICE:\n            case\
  \ E_NOTICE:\n                return $self->handleNotice();\n            default:\n\
  \                return false;\n        }\n    }\n```\n\n上面的 `handle` 方法使用错误消息、文件名、行号和变量上下文实例化一个\
  \ `ErrorHandler` 对象，然后根据 `$errno` 调用相应的处理方法。\n\n如果错误级别与此类处理的级别不匹配，则通过返回 `false`\
  \ 将错误流程恢复为默认错误处理器。\n\n错误处理\n\n245\n\n现在我们可以构建处理不同类型错误的方法。首先是 `handleError` 方法：\n\
  \n`ErrorHandler.class.php` *(摘录)*\n\n```php\n    public function handleError()\n\
  \    {\n        ob_start();\n        debug_print_backtrace();\n        $backtrace\
  \ = ob_get_flush();\n        $body =<<<EOT\nA fatal error occured in the application:\n\
  \nMessage:\n{$this->message}\n\nFile:\n{$this->filename}\n\nLine:\n{$this->line}\n\
  \nBacktrace:\n{$backtrace}\nEOT;\n        error_log($body, 1, 'sysadmin@example.com',\n\
  \            \"Fatal error occurred\\n\");\n        exit(1);\n    }\n```\n\n`handleError`\
  \ 用于处理 `E_USER_ERROR` 级别的错误。当被调用时，此方法会向系统管理员发送一封电子邮件并停止执行。它利用了 PHP 的 `error_log`\
  \ 函数的一个鲜为人知的特性来发送邮件——如果你为第二个参数指定 `1`，并为第三个参数指定一个电子邮件地址，它会使用 `php.ini` 中关于 sendmail\
  \ 的设置来发送邮件。最后，`handleError` 使用 `exit` 停止脚本的执行。\n\n下一个方法是 `handleWarning`：\n\n`ErrorHandler.class.php`\
  \ *(摘录)*\n\n```php\n    public function handleWarning()\n    {\n        $body =<<<EOT\n\
  An environmental error occured in the application, and may indicate a potential\
  \ larger issue:\n\nMessage:\n{$this->message}\n\nFile:\n{$this->filename}\n\nLine:\n\
  {$this->line}\nEOT;\n        return error_log($body, 1, 'sysadmin@example.com',\n\
  \            \"Subject: Non-fatal error occurred\\n\");\n    }\n```\n\n`handleWarning`\
  \ 用于处理 `E_USER_WARNING` 和 `E_WARNING` 错误。与上面的 `handleError` 类似，它会向系统管理员发送一封电子邮件；然而，它不会停止执行，而是简单地返回\
  \ `error_log` 函数的结果——如果函数成功则返回 `true`，失败则返回 `false`。\n\n最后是 `handleNotice` 方法：\n\
  \n`ErrorHandler.class.php` *(摘录)*\n\n```php\n    public function handleNotice()\n\
  \    {\n        $body =<<<EOT\nA NOTICE was raised with the following information:\n\
  \nMessage:\n{$this->message}\n\nFile:\n{$this->filename}\n\nLine:\n{$this->line}\n\
  EOT;\n        $body = date('[Y-m-d H:i:s] ') . $body . \"\\n\";\n        return\
  \ error_log($body, 3, $this->_noticeLog);\n    }\n}\n```\n\n`handleNotice` 处理 `E_USER_NOTICE`\
  \ 和 `E_NOTICE` 级别的错误。由于通知并不代表危险错误，我们假设系统管理员不需要立即知道它们，因此将它们记录到文件中，而不是发送电子邮件。\n\n\
  最后，我们通过使用恰当命名的 `set_error_handler` 函数告诉 PHP，我们希望 `ErrorHandler::handle` 充当我们的错误处理器：`ErrorHandler.class.php`\
  \ *(摘录)*\n\n```php\nset_error_handler(array('ErrorHandler', 'handle'));\n```\n\n\
  错误处理\n\n247\n\n## 讨论\n\nPHP 错误处理器的实现非常简单，而且由于你可以编写自己的功能，因此可以创建任何你想要的错误处理策略。但是，请务必严格测试你的代码，因为你不想陷入循环错误处理的情况——即你的错误处理器开始发出它自己需要处理的错误。\n\
  \n## 如何记录和报告错误？\n\n你需要创建一个健壮的 Web 应用程序，但即使是最好的软件工程师也会犯错。也许你正在使用忽略了弃用通知的第三方库。或者，你的代码虽然处于初期阶段，但由于时间限制已被推入生产环境。\n\
  \n你需要以某种方式跟踪网站上发生的错误。PHP 为此提供了哪些工具？\n\n## 解决方案\n\n记录错误是一回事——报告错误则是完全不同的另一回事。记录通常最好通过\
  \ PHP 自身的日志记录设施来完成。例如，你可能记得，`error_log` 设置可以在 `php.ini` 级别通过 `ini_set` 函数进行设置。\n\
  \nPHP 的 `error_log` 函数既可以用于记录错误，也可以用于发送电子邮件。它可以将错误记录到 PHP 的 `error_log` 或另一个日志目标，或者发送电子邮件到指定地址（它使用\
  \ `mail` 来实际发送）。此外，如果你正在使用调试器，它还可以通过调试连接发送信息。\n\n虽然 PHP 的日志记录功能很好，但它仍然需要在你的代码中触发——通常是通过你的自定义错误处理器。\n\
  \n记录错误的最简单方法是通过 `php.ini` 设置来配置日志记录，如下所示：\n\n```php\nerror_reporting(E_ALL & (~E_NOTICE\
  \ | ~E_USER_NOTICE));\nini_set('error_log', '/tmp/php-error.log');\nini_set('ignore_repeated_errors',\
  \ true);\nini_set('ignore_repeated_source', true);\nini_set('log_errors', true);\n\
  ```\n\n248\n\nPHP 文集\n\n这些设置会将所有错误记录到 `/tmp/php-error.log`，但通知、重复错误以及来自同一源的错误除外。\n\
  \n你还可以设置一个自定义错误处理器来执行日志记录或报告。通常，最安全、最简单的方法就是使用 `error_log`，正如我们在“如何使用 PHP 实现自定义错误处理器？”的解决方案中所看到的那样。\n\
  \n\n\n\n\n如果你打算使用电子邮件在自定义错误处理器中报告错误，通过 `error_log` 函数或标准 PHP `mail` 函数来实现可能不是最佳方案。第三方库，例如\
  \ `PEAR::Mail`，可能更适合这项任务。在这种情况下，请在自定义错误处理器中使用该库来发送邮件。4\n\n最后，请记住，日志文件和电子邮件并不是报告错误的唯一方式。你还可以让\
  \ PHP 向系统管理员或开发人员发送短信和寻呼机消息。\n\n## 如何使用 PHP 异常进行错误处理？\n\nPHP 错误很有用，但它们也带来了许多问题：\n\
  \n- 无法让错误沿着调用栈向上冒泡——错误必须立即处理。\n- 当错误被触发时，退出正在执行的函数或方法的唯一方法是让处理器退出脚本执行。\n- 如果不仔细检查错误消息，很难确定问题所在，因为你自己触发的任何错误都不会有相关的错误代码或名称。\n\
  \nPHP 5 引入了一种新的错误处理机制：异常。正如我在本章开头提到的，异常用于表示脚本中的异常行为——即出现问题或发生意外情况的情形。异常由你的代码抛出，并沿着代码向上冒泡，直到被捕获：\n\
  \n4 关于使用 PHP 发送电子邮件的更多信息，请参见第 7 章。\n\n错误处理 249\n\n```\nthrow new Exception(\n\"\
  这段代码的状态有些不对劲\");\n```\n\n那么，我们如何使用 PHP 异常来执行错误处理呢？\n\n## 解决方案\n\n与 PHP 错误不同，异常始终可以在代码中被捕获，这允许你在具备处理能力时优雅地处理它们。当异常被抛出时，PHP\
  \ 会立即寻找匹配的 `catch` 块并运行其中的代码。因此，在希望捕获潜在异常的地方，将代码包裹在 `try {…} catch(Exception $e)\
  \ {…}` 块中非常重要。如果异常未被捕获，PHP 会生成一个 `E_FATAL` 错误，消息为“未捕获的异常”。\n\n现在，在 `catch` 块中，你可以以你认为最佳的方式处理异常。例如，假设你正在生成一个包含来自\
  \ Web 服务数据的网页。当 Web 服务不可用时，你可以抛出异常，但稍后捕获它，并在生成的网页中显示“服务不可用”消息：\n\n```\ntry\n{\n\
  \    $data = $this->getDataFromService();\n}\ncatch (ServiceUnavailableException\
  \ $e)\n{\n    $data = '服务不可用';\n}\n```\n\n在这个例子中，脚本并没有因为错误而完全退出。相反，脚本继续执行完毕，网页成功生成，因此你能够在适当的时候处理错误并采取相应措施。\n\
  \n如果这听起来不错，那么你会很高兴听到还有更好的消息——PHP 5 引入了`对象类型提示`。这个功能强制函数和方法的参数必须是特定类或其子类的对象。你可以在\
  \ `catch (Exception $e) {…}` 块中捕获异常时使用类型提示——多个 `catch` 块可用于捕获不同类别的异常：\n\n250 PHP\
  \ 文集\n\n```\ntry\n{\n    ⋮ *尝试一些代码…*\n}\ncatch (PDOException $e)\n{\n    ⋮ *处理 PDO\
  \ 异常…*\n}\ncatch (Zend_Exception $e)\n{\n    ⋮ *处理 Zend Framework 异常…*\n}\ncatch\
  \ (Exception $e)\n{\n    ⋮ *处理所有其他异常…*\n}\n```\n\n## 讨论\n\n新手常犯的一个错误是，对每种错误情况都使用异常。例如，我经常看到类似这样的结构用于验证数据：\n\
  \n```\npublic function isValidData($data)\n{\n    if (!is_array($data))\n    {\n\
  \        throw new Exception('无效数据');\n    }\n    if (!array_key_exists($data))\n\
  \    {\n        throw new Exception('缺少 ID 键');\n    }\n    ⋮ *完成验证…*\n    return\
  \ true;\n}\n```\n\n这段代码有什么问题？很简单：无效数据只是可能的结果之一，并不是异常情况。在上述情况下，最好直接返回错误消息或 `true`。然后，你可以始终检查返回值是否为布尔值\
  \ `true` 或 `is_string`：\n\n错误处理 251\n\n```\npublic function isValidData($data) {\n\
  \    if (!is_array($data))\n    {\n        return '无效数据';\n    }\n    if (!array_key_exists($data))\n\
  \    {\n        return '缺少 ID 键';\n    }\n    ⋮ *完成验证…*\n    return true;\n}\n```\n\
  \n另一个与上述相关的常见错误是将异常用作脚本程序流程的一部分。使用上面抛出异常的原始 `isValidData` 定义的代码可能如下所示：\n\n```\n\
  try\n{\n    $result = $this->isValidData($data);\n}\ncatch (Exception $e)\n{\n \
  \   if ('无效数据' == $e->getMessage())\n    {\n        $error = $this->missingData();\n\
  \    }\n    elseif ('缺少 ID 键' == $e->getMessage())\n    {\n        $error = $this->missingId($data);\n\
  \    }\n    else\n    {\n        $error = '未知错误';\n    }\n}\nif (isset($error))\n\
  {\n    ⋮ *处理错误…*\n}\n```\n\n在这个例子中，代码在程序流程中使用异常来做决策；这几乎等同于使用 `GOTO` 语句编程。这是一种相当\n\
  \n252 PHP 文集\n\n令人困惑的方式来表达代码中的决策分支，尤其是当其他方法更合适时（包括测试函数/方法调用的返回值、在被调用的函数/方法中执行各种错误方法调用等）。\n\
  \n当你在一个代码单元中检测到阻止进一步执行的事件或条件时，请使用异常。好的例子包括：\n\n- 数据库错误\n- Web 服务调用错误\n- 文件系统错误（例如权限、路径缺失等）\n\
  - 数据编码错误（在 PHP 6 发布之前）\n- 解析错误（例如解析配置文件或模板文件时）\n\n当明智且谨慎地使用时，异常会成为非常强大的错误处理工具。有关\
  \ PHP 异常的更多信息，请阅读相关的 PHP 手册页面。5\n\n## 如何创建自定义 Exception 类？\n\nPHP 5 中提供的基类 `Exception`\
  \ 可以被扩展，但由于异常会沿着调用栈向上冒泡直到被捕获，为什么还要费心创建自定义的 `Exception` 类呢？嗯，如果你使用不同的 `Exception`\
  \ 类，定位特定类型的异常并从它们中恢复就会变得简单得多。\n\n创建自定义 `Exception` 类的其他原因包括：\n\n- 你想要记录特定类型的异常。\n\
  - 你需要发送特定类别的异常消息。\n- 你想要创建特殊的 `__toString` 输出来漂亮地打印异常，或者在其它特殊情况下使用异常（例如，XML-RPC\
  \ 客户端或服务器可能使用异常类来处理故障响应，其中 `__toString` 方法创建 XML 故障响应）。\n\n5 http://php.net/exceptions/\n\
  \n错误处理 253\n\n## 解决方案\n\n`Exception` 类扩展了基础的 PHP `Exception` 类，或者从它派生的类。要能够捕获你的自定义异常，你只需要扩展它：\n\
  \n```\nclass My_Exception extends Exception {}\n```\n\n这样定义的异常将像其他任何异常一样工作，不过在捕获异常时它可以被类型提示为\
  \ `My_Exception`：\n\n```\ntry\n{\n    ⋮ *尝试一些代码…*\n}\ncatch (My_Exception $e)\n\
  {\n    ⋮ *处理异常…*\n}\n```\n\n`Exception` 类中唯一可覆盖的方法是 `__construct` 和 `__toString`。如果你覆盖了\
  \ `__construct` 方法，你的自定义异常应该调用 `parent::__construct` 以确保异常中的所有数据都被正确设置：\n\n```\n\
  class My_Exception extends Exception\n{\n    public function __construct($message\
  \ = null, $code = 0)\n    {\n        parent::__construct($message, $code);\n   \
  \     ⋮ *完成其余初始化…*\n    }\n}\n```\n\n## 讨论\n\n\n\n\n创建异常类来覆盖可能跨越多个类的不同代码组是很有用的。例如，如果你正在创建一组输入过滤器类，你可能希望创建一个单一的异常类来覆盖它们；然而，如果你正在创建一个\
  \ MVC（模型-视图-控制器）套件，你可能希望为 MVC 模式的每个不同区域创建不同类型的异常类。\n\n254\n\nPHP 文集\n\n之前，我们提到了记录和发送异常邮件。与\
  \ PHP 错误不同，异常不会被记录，除非它们未被捕获，在这种情况下它们会被记录为 `E_FATAL` 错误。大多数时候，你不需要也不希望记录异常。\n\n然而，某些类型的异常可能表明需要开发人员或系统管理员关注的情况——例如，你的脚本无法连接到数据库（比如当\
  \ `PDO` 抛出异常时，而不是 PHP 错误）、Web 服务无法访问、文件或目录无法访问（由于权限问题或文件根本不存在）等等。\n\n处理这些情况的简单方法是重写异常的构造函数来执行通知任务。下面是一个名为\
  \ `My_Exception` 的自定义异常类，它在构造函数方法中调用了 `error_log` 函数：\n\n```php\nclass My_Exception\
  \ extends Exception\n{\n    public function __construct($message = null, $code =\
  \ 0)\n    {\n        parent::__construct($message, $code);\n        error_log($this->getTraceAsString(),\
  \ 3,\n            '/tmp/my_exception.log');\n    }\n}\n```\n\n虽然这是一种在异常发生时执行特殊错误记录操作的简单方法，但我发现让异常变得可观察提供了更大的灵活性。考虑以下使用示例：\n\
  \n```php\nObservable_Exception::attach(new Logging_Exception_Observer());\nObservable_Exception::attach(new\
  \ Emailing_Exception_Observer());\nclass Foo_Exception extends Observable_Exception\
  \ {}\n\n⋮ *执行一些工作…*\n\nthrow new Foo_Exception('error occurred');\n```\n\n在这个例子中，我创建了一个可观察的基异常类，并命名为\
  \ `Observable_Exception`。我向这个类附加了两个观察者：一个用于记录日志，另一个用于发送邮件。这些观察者检查它们所观察的异常的类型，并利用该信息决定是否采取行动。\n\
  \n## 错误处理\n\n255\n\n这种策略在处理异常的方式上提供了一定的灵活性，而无需使用显式的异常处理器。此外，你可以在代码中的任何位置附加观察者，这意味着你可以动态地决定如何处理任何给定的异常。\n\
  \n实现可观察异常的代码如下：`Exception_Observer.class.php` *(摘录)*\n\n```php\ninterface Exception_Observer\n\
  {\n    public function update(Observable_Exception $e);\n}\n```\n\n这段代码定义了异常观察者的接口。稍后我们将在自定义类中实现\
  \ `Exception_Observer` 接口。\n\n接下来，我们通过扩展 `Exception` 类来创建 `Observable_Exception`\
  \ 类。我们添加一个静态属性 `$_observers` 来保存 `Exception_Observer` 实例的数组：`Observable_Exception.class.php`\
  \ *(摘录)*\n\n```php\nclass Observable_Exception extends Exception\n{\n    public\
  \ static $_observers = array();\n```\n\n然后，使用一个静态方法来附加观察者。类型提示强制只允许 `Exception_Observer`\
  \ 类型的类作为观察者：`Observable_Exception.class.php` *(摘录)*\n\n```php\n    public static\
  \ function attach(Exception_Observer $observer)\n    {\n        self::$_observers[]\
  \ = $observer;\n    }\n```\n\n我们重写构造函数方法，以便在实例化异常时，通过调用 `notify` 方法通知所有观察者：\n\n\
  256\n\nPHP 文集\n\n`Observable_Exception.class.php` *(摘录)*\n\n```php\n    public function\
  \ __construct($message = null, $code = 0)\n    {\n        parent::__construct($message,\
  \ $code);\n        $this->notify();\n    }\n```\n\n最后，`notify` 方法遍历观察者数组并调用它们的 `update`\
  \ 方法，将 `Observable_Exception` 对象的自引用 `$this` 传递给它：`Observable_Exception.class.php`\
  \ *(摘录)*\n\n```php\n    public function notify()\n    {\n        foreach (self::$_observers\
  \ as $observer)\n        {\n            $observer->update($this);\n        }\n \
  \   }\n}\n```\n\n以下是一个异常观察者的示例：`Logging_Exception_Observer.class.php` *(摘录)*\n\n\
  ```php\nrequire 'Exception_Observer.class.php';\nrequire 'Observable_Exception.class.php';\n\
  \nclass Logging_Exception_Observer implements Exception_Observer\n{\n    protected\
  \ $_filename = '/tmp/exception.log';\n\n    public function __construct($filename\
  \ = null)\n    {\n        if ((null !== $filename) && is_string($filename))\n  \
  \      {\n            $this->_filename = $filename;\n        }\n    }\n\n    public\
  \ function update(Observable_Exception $e)\n    {\n        error_log($e->getTraceAsString(),\
  \ 3, $this->_filename);\n    }\n}\n```\n\n这个 `Exception_Observer` 的具体实现将异常信息记录到文件中。如果你在测试这段代码，请确保将\
  \ `$_filename` 变量设置为合适的位置和文件名。\n\n这种策略比简单地在自定义异常类的构造函数方法中处理日志记录或报告，或者定义异常处理函数提供了更大的灵活性。首先，如果你构建一个从\
  \ `Observable_Exception` 类派生的异常类层次结构，你可以为每种可观察异常类型附加任意数量的观察者，从而允许在任何时候自定义异常环境，而无需修改实际的异常代码。这也意味着只有顶层异常类需要包含任何额外代码；所有从该类派生的类都可以是空存根。最后，每个观察者的\
  \ `update` 方法可以通过 PHP 的 `instanceof` 运算符使用类型提示来决定是否需要采取任何操作。\n\n### 如何使用 PHP 实现自定义异常处理器？\n\
  \n可以使用 `set_error_handler` 函数为 PHP 错误指定自定义处理器。异常会向上冒泡直到被捕获，但如果它们没有被捕获会发生什么？默认情况下，任何未被捕获的异常都会引发\
  \ `E_FATAL` 错误。你可以用 PHP 错误处理器捕获这个错误，但有没有其他方法来处理未捕获的异常？\n\n## 解决方案\n\n与 PHP 错误类似，异常可以通过使用\
  \ `set_exception_handler` 函数指定的自定义异常处理器自动处理。通常，如果你希望程序对未捕获的异常采取特定操作，例如将用户重定向到错误页面，或者记录或发送异常邮件以便开发人员纠正问题，你会实现一个异常处理器。\n\
  \n基本方法涉及向 `set_exception_handler` 提供一个回调：`null|string set_exception_handler(mixed\
  \ callback)`\n\n## 讨论\n\n由于异常处理器处理任何未捕获的异常——而不是特定类型的异常——因此它们比错误处理器更容易实现。在这个例子中，我们创建了一个自定义异常处理类，它将未捕获的异常记录到文件中，并显示一个简单的错误页面：`ExceptionHandler.class.php`\
  \ *(摘录)*\n\n```php\n<?php\nclass ExceptionHandler\n{\n    protected $_exception;\n\
  \    protected $_logFile = '/tmp/exception.log';\n\n    public function __construct(Exception\
  \ $e)\n    {\n        $this->_exception = $e;\n    }\n\n    public static function\
  \ handle(Exception $e)\n    {\n        $self = new self($e);\n        $self->log();\n\
  \        echo $self;\n    }\n```\n\n这个异常处理器的入口点是静态的 `handle` 方法，它实例化自身，记录异常，然后通过回显自身（使用魔术方法\
  \ `__toString`）显示错误消息。如果你在测试这段代码，请确保将 `$_logFile` 变量设置为合适的位置和文件名。\n\n这段代码使用 PHP\
  \ 的 `error_log` 函数将异常回溯记录到文件中：`ExceptionHandler.class.php` *(摘录)*\n\n```php\n  \
  \  public function log()\n    {\n        error_log($this->_exception->getTraceAsString(),\
  \ 3, $this->_logFile);\n    }\n}\n```\n\n\n\n\n\n下面的 `__toString` 实现创建了一个“美观”的错误页面，当异常被处理时显示该页面，从而防止向用户展示异常回溯中包含的任何敏感信息：`ExceptionHandler.class.php`\
  \ *（节选）*\n\n```php\npublic function __toString()\n{\n    $message =<<<EOH\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n<head>\n\
  <title>Error</title>\n</head>\n<body>\n<h1>An error occurred in this application</h1>\n\
  <p>\nAn error occurred in this application; please try again. If you continue to\
  \ receive this message, please\n<a href=\"mailto:webmaster@example.com\"\n>contact\
  \ the webmaster</a>.\n</p>\n</body>\n</html>\nEOH;\n    return $message;\n}\n```\n\
  \n最后，我们告诉 PHP 希望使用 `ExceptionHandler::handle` 来处理异常：\n\n```php\nset_exception_handler(array('ExceptionHandler',\
  \ 'handle'));\n```\n\n大功告成！\n\n## 如何像处理异常一样处理 PHP 错误？\n\n也许你更喜欢异常而非 PHP 错误，并希望将致命或环境相关的\
  \ PHP 错误当作异常来处理。没问题！\n\n## 解决方案\n\n这个任务相对简单。我们需要创建一个自定义异常类，并且为了处理错误，必须添加一个抛出异常的公共静态方法——也就是说，创建自身的一个实例：`ErrorToException.class.php`\
  \ *（节选）*\n\n```php\nclass ErrorToException extends Exception\n{\n    public static\
  \ function handle($errno, $errstr)\n    {\n        throw new self($errstr, $errno);\n\
  \    }\n}\n```\n\n这个类并不一定要继承 `Exception`——只需继承一个派生自 `Exception` 的类即可。例如，你可以继承“如何创建自定义\
  \ Exception 类？”中的 `Observable_Exception`。\n\n不过，你不会希望用这种方式处理所有 PHP 错误——`E_NOTICE`\
  \ 和 `E_STRICT` 不值得这样处理。幸运的是，`set_error_handler` 接受错误级别作为第二个参数：\n\n```php\nset_error_handler(\n\
  \    array('ErrorToException', 'handle'),\n    E_USER_ERROR | E_WARNING | E_USER_WARNING\n\
  );\n```\n\n上面的示例代码规定，只有警告和用户错误会被作为异常抛出。\n\n## 讨论\n\n虽然使用函数（而非静态方法）可以更简单地实现将 PHP\
  \ 错误作为异常处理，但我在这里解释的方法有几个优点。首先，它允许你为这些特定的异常进行类型提示。其次，上面的异常类可以继承另一个提供额外功能的自定义异常类，例如记录或邮件发送异常信息的能力。\n\
  \n## 如何优雅地显示错误和异常？\n\n你已经听从建议，在生产服务器上关闭了 `display_errors`，以免意外向用户（以及潜在的黑客）暴露敏感的系统信息。如果你不打算显示错误，就需要显示其他内容。但如何实现呢？\n\
  \n## 解决方案\n\n这个常见问题的解决方案是将功能构建到你的错误或异常处理器中。\n\n从错误或异常处理器中显示错误是一个相当简单的任务，尽管你可能需要考虑错误是否是致命的，以及是否使用了输出缓冲。\n\
  \n由于异常处理器仅在未捕获异常时触发，因此在处理异常处理器时可以假定为致命错误；在“如何使用 PHP 实现自定义异常处理器？”中已经展示了一个异常处理器的示例。然而，在处理错误时，你需要检查每个错误的错误级别——例如，你可能希望在某些错误级别显示错误，而在其他级别不显示。错误级别检查可以通过在错误处理器中测试错误级别来实现，或者通过向\
  \ `set_error_handler` 传递第二个参数来定义错误处理器应处理的错误级别。\n\n至于输出缓冲，我们只需检查 `ob_get_level` 的返回值。如果该函数返回零，则当前没有激活输出缓冲，我们可以继续；否则，我们需要清理所有输出缓冲区，这可以通过在\
  \ `while` 循环中嵌套 `ob_end_clean` 调用来轻松实现：`while (@ob_end_clean());`\n\n在这种情况下，我们需要使用错误抑制运算符\
  \ `@`，因为当函数没有缓冲区可清理时会抛出 `E_NOTICE`。\n\n让我们将所有部分组合起来，捕获我们认为致命的错误并将其作为异常抛出，然后实现一个异常处理器来显示错误页面，同时考虑可能正在进行的任何输出缓冲：`safeErrorDisplay.php`\
  \ *（节选）*\n\n```php\nclass ErrorToException extends Exception\n{\n    public static\
  \ function handle($errno, $errstr)\n    {\n        throw new self($errstr, $errno);\n\
  \    }\n}\n\nset_error_handler(\n    array('ErrorToException', 'handle'),\n    E_USER_ERROR\
  \ | E_WARNING | E_USER_WARNING\n);\n```\n\n上面的代码定义了一个可用作 PHP 错误处理器的类。它只是将自身作为异常抛出。在这里，我将其设置为处理\
  \ `E_USER_ERROR`、`E_WARNING` 和 `E_USER_WARNING` 类型的错误，这些都是可以被捕获的错误，并且很可能表明脚本中出现了严重问题。\n\
  \n接下来，让我们定义 `ExceptionHandler` 类：`safeErrorDisplay.php` *（节选）*\n\n```php\nclass\
  \ ExceptionHandler\n{\n    protected $_exception;\n    protected $_logFile = '/tmp/exception.log';\n\
  \n    public function __construct(Exception $e)\n    {\n        $this->_exception\
  \ = $e;\n    }\n\n    public static function handle(Exception $e)\n    {\n     \
  \   $self = new self($e);\n        $self->log();\n        while (@ob_end_clean());\n\
  \        ob_start();\n        echo $self;\n        ob_end_flush();\n    }\n}\n```\n\
  \n到目前为止，我们定义了一个带有静态 `handle` 方法的类，该方法接受一个异常作为唯一参数。该方法实例化自身，记录异常，然后生成错误消息。在生成错误消息之前，它会清除所有输出缓冲区，以确保错误消息是唯一返回的输出。\n\
  \n接下来，我们来看日志记录和输出生成的细节：`safeErrorDisplay.php` *（节选）*\n\n```php\npublic function\
  \ log()\n{\n    error_log($this->_exception->getTraceAsString(), 3, $this->_logFile);\n\
  }\n```\n\n日志记录使用 PHP 自带的 `error_log` 函数。这种方法安全，不会自身产生错误，而且使用简单。如果你在测试这段代码，请确保在 `$_logFile`\
  \ 变量中填入正确的路径和文件名。\n\n接下来，我们实现一个 `__toString` 方法：`safeErrorDisplay.php` *（节选）*\n\n\
  ```php\npublic function __toString()\n{\n    $message =<<<EOH\n<!DOCTYPE html public\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<title>Error</title>\n\
  </head>\n<body>\n<h1>An error occurred in this application</h1>\n<p>\nAn error occurred\
  \ in this application; please try again. If you continue to receive this message,\
  \ please\n<a href=\"mailto:webmaster@example.com\"\n>contact the webmaster</a>.\n\
  </p>\n</body>\n</html>\nEOH;\n    return $message;\n}\n```\n\n这段代码应该看起来很熟悉——它与“如何使用\
  \ PHP 实现自定义异常处理器？”中的解决方案类似。我们的 `ExceptionHandler` 类有一个 `__toString` 方法，它使用 heredoc\
  \ 生成 XHTML 输出。该方法可以修改以显示异常的详细信息，例如消息或回溯，但在生产环境中不鼓励这样做。\n\n最后，当然，我们将 `ExceptionHandler::handle()`\
  \ 定义为异常处理器：`safeErrorDisplay.php` *（节选）*\n\n```php\nset_exception_handler(array('ExceptionHandler',\
  \ 'handle'));\n```\n\n## 讨论\n\n我在这里提出的解决方案实现了两个目标：它将严重的 PHP 错误作为异常抛出，并使用异常处理器记录问题，同时生成并显示一个通用的错误页面给用户。\n\
  \n\n\n\n\n在生产系统中使用此解决方案是一种良好的实践，因为它允许你跟踪站点错误，同时为最终用户生成安全的显示内容。\n\n## 错误处理\n\n265\n\
  \n遗憾的是，此解决方案有一个缺点：它无法阻止用户刷新页面并再次触发错误条件。通常情况下，如果发生了严重错误，你可能不希望将处理错误显示代码的页面与触发错误的页面置于同一环境中。事实上，在某些情况下，显示错误页面可能会完全失败（包括数据库连接缺失、模板文件权限错误等）。此外，如果用户点击浏览器的\
  \ `Refresh` 按钮以查看错误是否再次发生，他们很可能只会让问题持续存在。最后，将显示 HTML 构建到一个类中可能会带来许多缺点——例如，完全脱离站点模板和样式表，可能无法匹配站点的外观和感觉。因此，你可能需要考虑将用户重定向到一个错误页面，而不是简单地显示一个错误页面。\n\
  \n### 如何在错误发生后将用户重定向到另一个页面？\n\n因此，你已经设置了错误和异常处理器，尝试让它们显示错误页面，但现在担心用户刷新页面时会发生什么。举个例子，想象这样一个场景：数据库连接问题导致站点首页显示错误页面，现在成百上千的\
  \ incoming 用户正在点击他们的 `Refresh` 按钮。\n\n也许是时候将他们重定向到一个错误页面了。\n\n## 解决方案\n\n要使此方法生效，你需要确保输出缓冲已开启，这样在发送重定向头之前不会有任何头信息发送到浏览器。以下示例可作为指南：\n\
  \n```\nclass ExceptionRedirectHandler\n{\n\nprotected $_exception;\n\nprotected\
  \ $_logFile = '/tmp/exception.log';\n\npublic $redirect = 'http://www.example.com/error';\n\
  \npublic function __construct(Exception $e)\n\n{\n\n$this->_exception = $e;\n\n\
  }\n```\n\n266\n\nPHP 文集\n\n```\npublic static function handle(Exception $e)\n\n\
  {\n\n$self = new self($e);\n\n$self->log();\n\nwhile (@ob_end_clean());\n\nheader('HTTP/1.1\
  \ 307 Temporary Redirect');\n\nheader(\"Cache-Control: no-cache, must-revalidate\"\
  ); header(\"Expires: Mon, 26 Jul 1997 05:00:00 GMT\"); header('Location: ' . $self->redirect);\n\
  \nexit(1);\n\n}\n```\n\n顾名思义，`ExceptionHandler::handle` 将用作异常处理器。它实例化自身，记录异常，清除输出缓冲区，然后重定向到\
  \ `$redirect` 属性中指定的页面。同时还指定了其他几个 HTTP 头。\n\n我们输出 HTTP 状态码 307，向浏览器指示该重定向只是临时的。此外，`Cache-Control`\
  \ 和 `Expires` 的设置方式使得任何后续对页面的访问都会强制浏览器刷新内容——如果幸运的话，会显示预期的内容而不是错误。\n\n日志记录使用 PHP\
  \ 的 `error_log` 实现，我们为其指定了一个文件参数：\n\n```\npublic function log()\n\n{\n\nerror_log(\n\
  \n$this->_exception->getTraceAsString(),\n\n3,\n\n$this->_logFile\n\n);\n\n}\n```\n\
  \n实际记录的消息是异常的 backtrace。如果你正在测试此代码，请确保在 `$_logFile` 属性中设置正确的路径和文件名。\n\n当然，最后一步是告诉\
  \ PHP 我们类的静态方法将处理异常：\n\n```\nset_exception_handler(array('ExceptionRedirectHandler',\
  \ 'handle'));\n```\n\n267\n\n## 讨论\n\n当与“如何将 PHP 错误视为异常来处理？”中所示的解决方案结合使用时，我在此概述的策略将允许你优雅地处理\
  \ PHP 错误和异常，并防止与用户意外或故意刷新页面时重新传播条件相关的问题。通过重定向用户，你可以确保如果他们刷新页面，他们将停留在同一个错误页面上。如果你愿意，你甚至可以采取设置会话\
  \ cookie 等步骤来阻止他们返回有问题的页面。\n\n如果你使用此方法，我建议你将应用程序的用户重定向到一个加载最少代码的页面——甚至可能是一个静态页面——以避免环境错误（如数据库连接或模板目录权限）阻止错误显示的情况。无论错误页面还显示什么，它至少应提供站点其他部分的基本导航元素。\n\
  \n## 总结\n\n在本章中，我们探讨了 PHP 提供的用于错误处理的各种选项。\n\n我们讨论了 PHP 的错误级别常量，以及每个级别预期会产生的行为。然后我们转向\
  \ PHP 提供的用于自动处理错误条件的内置机制：我们审查的机制包括显示和记录错误。由于 PHP 提供了标准的错误处理机制，你可能希望能够触发自己的错误——这是一个详细讨论的主题。虽然错误处理可以通过\
  \ PHP 解释器本身自动化，但有时能够自己处理错误也很有用，以便执行日志记录、恢复等任务；为此，我们讨论了如何编写和使用自定义错误处理器。\n\nPHP 5\
  \ 引入了一种新的错误机制，即异常。所有 PHP 5 异常都派生自一个名为 `Exception` 的内部类。我们讨论了异常如何在代码中冒泡直到被捕获，并研究了为此目的使用\
  \ `try {…} catch (Exception $e) {…}` 块。此外，我们创建了一个异常处理器来处理未捕获的异常。\n\n268\n\nPHP 文集\n\
  \n由于异常处理起来非常方便，并且允许代码流从捕获点继续执行，你可能希望将 PHP 错误作为异常抛出，正如我在本章中所解释的那样。\n\n最后，我们看到了在处理错误或异常后，如何轻松地显示优雅的错误页面，避免向用户展示敏感的系统信息。还讨论了另一种选择——将用户重定向到错误页面。\n\
  \n本章为你提供了坚实的基础，帮助你培养在 PHP 脚本中管理错误的专业方法。但不要止步于此！PHP 手册提供了更多信息，帮助你改进 PHP 实践。\n\n![Image\
  \ 84](img/index-291_1.png)\n\n![Image 85](img/index-291_2.jpg)\n\n# 第 10 章 访问控制\n\
  \n使用 PHP 构建站点（而不是普通的旧 HTML）的现实之一是，你构建的是动态网页而非静态网页。选择使用 PHP 开发站点将允许你实现纯 HTML 无法达到的效果。但正如俗话所说，能力越大，责任越大。你如何确保只有你或你授予权限的人能够查看和与你的网站交互，同时使其免受互联网邪恶大军的肆虐、窥探私人信息或删除数据？\n\
  \n在本章中，我们将探讨你可以使用 PHP 构建认证系统并控制站点访问的机制。我无论如何强调都不为过：在构建基于 Web 的应用程序时，保持一点健康的偏执非常重要。SitePoint\
  \ 论坛经常收到不快乐的网站开发者的访问，他们在站点安全方面吃了亏。\n\n**通过 Web 传输数据是不安全的**\n\n在我们进一步讨论任何具体的站点安全主题之前，你必须意识到，你构建的任何涉及通过互联网从网页传输数据的系统，默认情况下都会以明文形式发送该信息。\n\
  \n![Image 86](img/index-292_1.png)\n\n![Image 87](img/index-292_2.jpg)\n\n270\n\n\
  PHP 文集\n\n\n\n\n（除非你使用的是加密数据的 HTTPS）。这可能会让某些人能够“监听”客户端浏览器与 Web 服务器之间的网络；借助一种称为**数据包嗅探器**的工具，他们就能读取通过表单发送的用户名和密码，例如。这种风险实际发生的概率相当小，因为通常只有像\
  \ ISP 这样受信任的组织才有拦截数据包所需的访问权限；然而，这*确实*是一种风险，而且是你应该认真对待的风险。\n\n## 关于本章中的示例\n\n在深入探讨之前，我需要让你了解本章中讨论的示例解决方案。\n\
  \n某些解决方案中的示例类需要使用一个配置文件：`access_control.ini`。该文件用于存储示例中使用的各种数据库表名和列名。由于并非所有人都以相同方式命名数据库表，这类配置值通常设计为可自定义的。`access_control.ini`\
  \ 文件通过 PHP 的 `parse_ini_file` 函数读取到一个数组中（你可以在第 6 章的“如何将配置信息存储在文件中？”中了解更多关于此技术的内容）。配置文件如下所示：\n\
  \n`access_control.ini` *（节选）*\n\n```\n; 访问控制设置\n; Web 表单变量，例如 $_POST['login']\n\n\
  [login_vars]\nlogin=login\npassword=password\n⋮ *更多设置如下…*\n```\n\n当某个示例使用了该文件中的配置信息时，会在相应部分注明。\n\
  \n类似地，以下解决方案假设了特定的数据库配置。与每个解决方案相关的 SQL 细节会在文本中适当位置指出。\n\n如果你已从 SitePoint 网站下载了本书的代码归档，你会在本章的文件夹中找到名为\
  \ `access_control_dump.sql` 的文件。你可以使用该文件创建数据库并插入一些示例数据。使用此\n\n![Image 88](img/index-293_1.jpg)\n\
  \n![Image 89](img/index-293_2.png)\n\n文件与在第 2 章中使用 world 数据库的方法相同。在 http://dev.mysql.com/doc/world-setup/en/world-setup.html\
  \ 找到的说明也可用于创建 `access_control` 数据库，如下所示：\n\n```\ncommand prompt> mysql -u root -p\n\
  mysql> CREATE DATABASE access_control;\nmysql> USE access_control;\nmysql> SOURCE\
  \ access_control_dump.sql;\n```\n\n当然，你需要根据你的系统添加缺失的路径和密码信息。\n\n最后，所有这些解决方案都使用 `PDO`\
  \ 类来连接数据库。有关使用 `PDO` 类的更多信息，请参见第 2 章。所有涉及网页表单的解决方案都使用 PEAR 的 `HTML_QuickForm` 包。你可以在第\
  \ 5 章的“如何使用 PHP 构建 HTML 表单？”中了解更多关于使用此包的内容。\n\n## 如何使用 HTTP 认证？\n\n**超文本传输协议**（HTTP）——用于通过互联网将网页发送到浏览器的传输协议——定义了自身的认证机制。这些机制（基本认证和摘要认证）在\
  \ RFC 2617.1 中有说明。如果你在 Apache 服务器上运行 PHP，你可以利用这些机制（摘要认证从 PHP 5.1.0 版本开始可用），使用 PHP\
  \ 的 `header` 函数和几个预定义变量。PHP 手册的功能部分提供了这些功能的通用讨论。2\n\n### HTTP 认证与 Apache\n\n如果你希望在网站上使用\
  \ HTTP 认证，你可以仅通过 Apache 配置设置来实现——不需要 PHP。有关如何操作的更多信息，请参阅你服务器版本的 Apache 文档。3\n\n\
  1 http://www.ietf.org/rfc/rfc2617\n2 http://www.php.net/manual/en/features.http-auth.php\n\
  3 例如，2.2 版本的文档可在 http://httpd.apache.org/docs/2.2/howto/auth.html 找到。\n\n## 解决方案\n\
  \n让我们逐步讲解一个简单的示例页面，它使用 `$_SERVER['PHP_AUTH_USER']` 和 `$_SERVER['PHP_AUTH_PW']` 自动全局变量以及\
  \ `WWW-Authenticate` HTTP 头来保护自身——如果当前用户不在允许的用户列表中，则拒绝访问。\n\n首先，我们需要一个有效的用户名和密码列表。为了这个简单演示的目的，我们只使用一个数组，但在实际场景中不建议这样做，你可能会使用数据库（我们将在“如何构建注册系统？”中看到）。以下是\
  \ `$users` 数组：\n\n`httpAuth.php` *（节选）*\n\n```php\n<?php\n$users = array(\n    'jackbenimble'\
  \ => 'sekret',\n    'littlepig' => 'chinny'\n);\n```\n\n接下来，我们测试自动全局变量 `$_SERVER['PHP_AUTH_USER']`\
  \ 是否存在。如果该变量未设置，说明尚未提交用户名，我们需要做出适当的响应——一个 `HTTP/1.1 401 Unauthorized` 响应码，以及第二个头信息，指示我们使用\
  \ `WWW-Authenticate` 头要求基本认证：\n\n`httpAuth.php` *（节选）*\n\n```php\nif (!isset($_SERVER['PHP_AUTH_USER']))\n\
  {\n    header('HTTP/1.1 401 Unauthorized');\n    header('WWW-Authenticate: Basic\
  \ realm=\"PHP Secured\"');\n    exit('This page requires authentication');\n}\n\
  ```\n\n如果已提交用户名，我们需要检查该用户名是否存在于有效用户名列表中，然后确保提交的密码与列表中该用户名关联的密码匹配：\n\n`httpAuth.php`\
  \ *（节选）*\n\n```php\nif (!isset($users[$_SERVER['PHP_AUTH_USER']]))\n{\n    header('HTTP/1.1\
  \ 401 Unauthorized');\n    header('WWW-Authenticate: Basic realm=\"PHP Secured\"\
  ');\n    exit('Unauthorized!');\n}\n\nif ($users[$_SERVER['PHP_AUTH_USER']] != $_SERVER['PHP_AUTH_PW'])\n\
  {\n    header('HTTP/1.1 401 Unauthorized');\n    header('WWW-Authenticate: Basic\
  \ realm=\"PHP Secured\"');\n    exit('Unauthorized!');\n}\n```\n\n最后，如果所有检查都通过，我们可以继续显示网页。在这个示例中，我们只是简单地显示从认证表单收到的凭据。当然，这个输出仅用于演示目的——在实际情况下你绝不会这样做：\n\
  \n`httpAuth.php` *（节选）*\n\n```php\necho 'You\\'re in ! Your credentials were:<br\
  \ />';\necho 'Username: ' . $_SERVER['PHP_AUTH_USER'] . '<br />';\necho 'Password:\
  \ ' . $_SERVER['PHP_AUTH_PW'];\n?>\n```\n\n## 讨论\n\n要理解 HTTP 认证的工作原理，你必须首先了解当浏览器向\
  \ Web 服务器发送网页请求时实际发生了什么。\n\nHTTP 是浏览器与 Web 服务器之间通信的协议。当你的浏览器向 Web 服务器发送请求时，它使用 HTTP\
  \ 请求告诉服务器它想要哪个页面。然后服务器回复一个 HTTP 响应，描述所发送文档的类型和特性，然后发送文档本身。\n\n例如，客户端可能向服务器发送以下请求：\n\
  \n```\nGET /subcat/98 HTTP/1.1\nHost: www.sitepoint.com\n```\n\n以下是它可能从服务器收到的回复：\n\
  \n```\nHTTP/1.1 200 OK\nDate: Sat, 24 Mar 2007 08:12:44 GMT\nServer: Apache/2.0.46\
  \ (Red Hat)\nX-Powered-By: PHP/4.3.11\nTransfer-Encoding: chunked\nContent-Type:\
  \ text/html; charset=ISO-8859-1\n\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0\
  \ Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" lang=\"en\" xml:lang=\"en\">\n<head>\n<title>PHP\
  \ &amp; MySQL Tutorials</title>\n⋮ *以此类推…*\n```\n\n如果你想亲眼看到这个过程，下一个示例将给你机会，因为我们打开一个到\
  \ *www.sitepoint.com* 的连接并请求 `/subcat/98`。4 示例脚本将读取服务器的响应并输出完整的 HTTP 响应：\n\n`seeHeaders.php`\n\
  \n```php\n<?php\n// 连接到 sitepoint.com\n$fp = fsockopen('www.sitepoint.com', '80');\n\
  \n// 发送请求\nfputs($fp,\n    \"GET /subcat/98 HTTP/1.1\\r\\nHost: www.sitepoint.com\\\
  r\\n\\r\\n\");\n\n// 获取响应\n$response = '';\nwhile (!feof($fp))\n{\n    $response\
  \ .= fgets($fp, 128);\n}\n?>\n```\n\n\n\n\n\n## 访问控制\n\n4 在下一个示例中，我们使用套接字来说明 HTTP\
  \ 头部的传递。你可以使用多种替代方法中的任何一种来获取页面本身的内容，从 `file_get_contents` 到 `fopen`、`fread` 和 `fclose`。更多信息请参见第\
  \ 6 章。\n\n![Image 90](img/index-297_1.jpg)\n\n```\nfclose($fp);\n\n// 将 HTML 转换为实体\n\
  \n$response = htmlspecialchars($response);\n\n// 显示响应\n\necho nl2br($response);\n\
  \n?>\n```\n\n认证头部是服务器发送的附加头部，用于指示浏览器必须发送有效的用户名和密码才能查看页面。\n\n对于使用基本 HTTP 认证保护的页面的正常请求，服务器可能会返回如下头部：\n\
  \n```\nHTTP/1.1 401 Authorization Required\nDate: Tue, 25 Feb 2003 15:41:54 GMT\n\
  Server: Apache/1.3.27 (Unix) PHP/4.3.1\nX-Powered-By: PHP/4.3.1\nWWW-Authenticate:\
  \ Basic realm=\"PHP Secured\"\nConnection: close\nContent-Type: text/html\n```\n\
  \n没有发送更多信息，但请注意状态码 `HTTP/1.1 401 Authorization Required` 和 `WWW-Authenticate` 头部。这些\
  \ HTTP 请求元素共同表明该页面受 HTTP 认证保护，未授权用户无法访问。访问者的浏览器可以通过多种方式传达此信息，但通常用户会看到一个类似图 10.1\
  \ 所示的小弹出窗口。\n\n图 10.1. 认证要求对话框\n\n![Image 91](img/index-298_1.png)\n\n![Image 92](img/index-298_2.jpg)\n\
  \nPHP 文集\n\n该对话框提示网站访问者输入用户名和密码。使用 Internet Explorer 的访问者连续三次错误输入登录信息后，浏览器将显示“未授权”消息，而不再显示提示。在其他浏览器（如\
  \ Opera）中，用户可以无限期地继续尝试登录。\n\n请注意，在 `WWW-Authenticate` 头部中指定的领域值会显示在对话框中。`realm`\
  \ 是一个安全空间或区域，在该区域内特定的一组登录凭据有效。成功认证后，浏览器会记住正确的用户名和密码组合，并自动将对该领域的任何后续请求重新发送。然而，当用户导航到另一个领域时，浏览器会再次显示新的提示。\n\
  \n无论如何，用户必须提供用户名和密码才能访问页面。\n\n浏览器通过第二个页面请求发送这些凭据，如下所示：\n\n```\nGET /admin/ HTTP/1.1\n\
  Host: www.sitepoint.com\nAuthorization: Basic jTSAbT766yN0hGjUi\n```\n\n`Authorization`\
  \ 头部包含使用 base64 编码的用户名和密码，值得注意的是，这并不安全——对人类来说不可读，但将 base64 编码的值转换回原始文本是轻而易举的事。\n\
  \n服务器将检查凭据是否有效。如果无效，服务器将再次发送 `HTTP/1.1 401 Authorization Required` 响应，如前所示。如果凭据有效，服务器将正常发送请求的页面。\n\
  \n如果你预计会大量使用 HTTP 认证，应该考虑的一个包是来自 PEAR 的 `HTTP_Auth` 包。5 `HTTP_Auth` 提供了一个易于使用的 API，这样你就不必担心自己处理头部调用。\n\
  \n### 发送头部\n\n在 PHP 中，当你的脚本输出任何用于显示的内容时，Web 服务器就会完成发送头部并开始发送内容本身。一旦 HTTP 消息的主体（即网页本身）的输出开始，你就不能再发送更多的\
  \ HTTP 头部。如果在主体渲染开始后使用了 `header` 或 `session_start` 函数，你会看到类似这样的错误消息：\n\n```\nWarning:\
  \ Cannot add header information - headers already sent by (output started at…\n\
  ```\n\n请记住，`<?php … ?>` 标签之外的任何文本或空白都会导致输出被发送到浏览器。如果在 `<?php` 标签之前或 `?>` 标签之后有空白，你将无法在该点之后向浏览器发送头部。\n\
  \n### 如何使用会话？\n\n`会话` 是一种机制，允许 PHP 在执行之间`保持状态`。\n\n简单来说，会话允许你存储一个页面中的变量（该页面的状态），并在另一个页面中使用它们。例如，如果访问者通过你网站上的表单提交了他的名字\
  \ Bob，会话将允许你的网站记住他的名字，并允许你在访问期间的所有其他页面上放置个性化消息，例如“Bob，今天你想去哪里？”不过，如果 Bob 很快就离开了，也不要惊讶！\n\
  \n会话的基本机制如下：首先，PHP 生成一个唯一的 32 字符字符串来标识会话。然后 PHP 将该值传递给浏览器；同时，它在服务器上创建一个文件，并将会话 ID\
  \ 包含在文件名中。PHP 有两种方法可以跟踪会话 ID：它可以将 ID 添加到页面上所有相对链接的查询字符串中，或者将 ID 作为 cookie 发送。在服务器上存储的文件中，PHP\
  \ 保存了它被告知要为会话存储的变量的名称和值。\n\n当浏览器请求另一个页面时，它会通过 URL 查询字符串或返回 cookie 告诉 PHP 它被分配了哪个会话。然后\
  \ PHP 查找在会话启动时创建的文件，从而可以访问存储在会话中的数据。\n\n一旦会话建立，它将持续到被 PHP 明确销毁（例如，响应用户点击`退出`），或者会话在超过给定时间段（如\
  \ `php.ini` 文件中 `session.gc_maxlifetime` 所指定的）内处于非活动状态。此时，它会被标记为垃圾回收，并在 PHP 下次检查过期会话时被删除。\n\
  \n## 解决方案\n\n以下是一个非常简单的演示，展示如何存储和检索会话变量：`simpleSession.php`\n\n```\n<?php\n\nsession_start();\n\
  \n// 如果会话变量不存在，则注册它\n\nif (!isset($_SESSION['test']))\n\n{\n\n$_SESSION['test']\
  \ = 'Hello World!';\n\necho '$_SESSION[\\'test\\'] is registered.<br />' .\n\n'Please\
  \ refresh page';\n\n}\n\nelse\n\n{\n\n// 已注册，因此显示它\n\necho '$_SESSION[\\'test\\\
  '] = ' . $_SESSION['test'];\n\n}\n\n?>\n```\n\n该脚本在页面首次显示时注册会话变量 `test`。下一次（以及之后的所有时间，直到会话因不活动而超时），脚本将显示\
  \ `test` 会话变量的值。\n\n## 讨论\n\n总的来说，会话易于使用且功能强大——它们是构建在线应用程序的基本工具。在使用会话的脚本中，首先要做的事情是调用\
  \ `session_start` 来加载任何现有的会话变量。\n\n你应该始终通过预定义的全局变量 `$_SESSION` 来访问会话变量，而不是使用 `session_register`\
  \ 和 `session_unregister` 函数。当 PHP 的 `register_globals` 设置被禁用时（这应该是常态），`session_register`\
  \ 和 `session_unregister` 无法正常工作。\n\n在以下 HTTP 响应头部中，服务器由于 PHP 脚本中的 `session_start`\
  \ 函数而将会话 cookie 传递给浏览器：\n\n![Image 93](img/index-301_1.jpg)\n\n![Image 94](img/index-301_2.png)\n\
  \n![Image 95](img/index-301_3.jpg)\n\n![Image 96](img/index-301_4.png)\n\n```\n\
  HTTP/1.1 200 OK\nDate: Wed, 26 Feb 2003 02:23:08 GMT\nServer: Apache/1.3.27 (Unix)\
  \ PHP/4.3.1\nX-Powered-By: PHP/4.3.1\nSet-Cookie: PHPSESSID=ce558537fb4aefe349bb8d48c5dcc6d3;\
  \ path=/\nConnection: close\nContent-Type: text/html\n\n<!DOCTYPE html PUBLIC \"\
  -//W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n⋮ *等等…*\n```\n\n### 在其他地方存储会话\n\
  \n\n\n\n请注意，我提到过，默认情况下，会话以文件形式存储在服务器上。也可以将会话存储在其他地方，例如数据库甚至共享内存中。\n\n我们将在“如何将会话存储在数据库中？”中讨论创建自定义会话处理程序，将会话变量保存到数据库。将会话存储在数据库中，对于显示“谁在线”信息以及通过单一会话存储库实现多台\
  \ Web 服务器的负载均衡非常有用——这种机制允许访问者在保持会话的同时（在不知情的情况下）切换服务器。\n\n## 会话并非完美无缺\n\n虽然会话是一个很棒的工具，但如果你不了解其局限性，它们很容易引发问题。处理与会话状态相关的数据时要小心。例如，当用户为某个网站打开多个窗口时，在一个窗口中执行的脚本可能会覆盖从另一个窗口保存的数据，从而将用户回滚到网站中的较早状态。还要注意，资源句柄和引用不会与会话中的对象一起保存——你需要在类的`__sleep`和`__wakeup`方法中释放并重新创建它们。此外，尽量将会话变量中的数据量保持在最低限度，因为拉取并非每个页面都会用到的大块数据可能会拖慢页面速度。\n\
  \n`__sleep`和`__wakeup`是魔术方法的例子，在[`www.php.net/manual/en/language.oop5.magic.php`](http://www.php.net/manual/en/language.oop5.magic.php)中有解释。\n\
  \n280\n\n《PHP 文集》\n\n## 会话安全\n\n会话非常有用，但在应用程序中使用会话时，需要考虑一些重要的安全注意事项。\n\n默认情况下，浏览器要控制一个会话，只需向\
  \ PHP 传递一个有效的会话 ID。在理想情况下，你可以存储注册会话的 IP 地址，并对每个使用该会话 ID 的新请求进行双重检查。不幸的是，一些 ISP（如\
  \ AOL）几乎在每个页面请求时都会为用户分配新的 IP，因此这种安全机制很快就会将合法用户踢出系统。因此，设计应用程序时，必须假设某个用户的会话最终会被“劫持”。\n\
  \n用户的账户在会话过期之前一直处于暴露状态，因此你的目标应该是防止劫持者在会话活跃期间造成严重损害。这意味着，例如，当已登录用户更改其账户密码时，必须提供旧密码——显然，劫持者不会知道这一点。此外，要小心处理用户的个人信息（如信用卡详细信息）。如果你允许用户对其账户详细信息进行重大更改（例如更改送货地址），请务必通过电子邮件向他们发送更改摘要通知，以提醒那些会话可能已被劫持的用户。\n\
  \n使用 SSL（安全套接层）加密通信，完全隐藏会话 ID。此外，你应该只使用 cookie 方式传递会话 ID。如果你在 URL 中传递会话 ID，当将访问者引荐到其他网站时，由于\
  \ HTTP 请求中的 referer 头信息，你可能会泄露会话 ID。\n\nPHP 为存储会话信息而创建的文件，默认存储在 PHP 运行所在操作系统的临时目录中。在基于\
  \ Unix 的系统（如 Linux）上，该目录是`/tmp`。而且，如果你在共享服务器上，所有托管站点的会话文件将存储在一起，这意味着服务器上的其他用户可以读取这些文件的内容。\n\
  \n他们可能无法识别哪个虚拟主机和 PHP 脚本拥有该会话，但根据你放在那里的信息，他们或许能够猜测出来。\n\n访问控制\n\n281\n\n这种可能性在共享\
  \ PHP 系统上是一个严重的问题；最有效的解决方案是将会话存储在数据库中，而不是服务器的临时目录中。我们将在本章后面更详细地讨论自定义会话处理程序，但一个部分解决方案是在`php.ini`中将`session.save_path`选项设置为一个不对外公开的目录。你需要联系你的托管公司，为该目录设置正确的权限，以便\
  \ PHP 运行所用的`nobody`或`wwwuser`用户能够读取、写入和删除该目录中的文件。\n\n最后一条警告：借助一种常见的 Web 安全漏洞——**跨站脚本攻击**（XSS），攻击者有可能在你的网站上放置\
  \ JavaScript，导致访问者将其会话 ID 泄露给远程网站，从而使他们的会话被劫持。如果你允许访问者向你的网站发布任何 HTML，请务必非常仔细地检查和验证它。记住黄金法则：永远不要依赖客户端技术（如\
  \ JavaScript）来处理安全性，永远不要信任浏览器提交的任何内容。\n\n## 如何创建一个会话类？\n\n你可以创建一个简单的包装类来处理会话。这样做可以确保，如果你将来想切换到另一种会话处理机制（例如你自己构建的机制），只需修改该类，而无需重写大量代码。我们可以通过几个简单的方法为`$_SESSION`变量提供一个接口。\n\
  \n## 解决方案\n\n我们自定义的`Session`类从构造函数方法开始，该方法仅调用`session_start`：\n\n**Session.class.php\
  \ *（摘录）***\n\n```php\nclass Session\n{\n    public function __construct()\n    {\n\
  \        session_start();\n    }\n}\n```\n\n282\n\n《PHP 文集》\n\n然后我们可以添加`set`和`get`方法，分别用于设置会话变量和获取会话变量：\n\
  \n**Session.class.php *（摘录）***\n\n```php\npublic function set($name, $value)\n{\n\
  \    $_SESSION[$name] = $value;\n}\n\npublic function get($name)\n{\n    if (isset($_SESSION[$name]))\n\
  \    {\n        return $_SESSION[$name];\n    }\n    else\n    {\n        return\
  \ false;\n    }\n}\n```\n\n最后，我们添加一个`del`方法用于删除会话变量，以及`destroy`方法用于移除所有会话变量并重置会话：\n\
  \n**Session.class.php *（摘录）***\n\n```php\npublic function del($name)\n{\n    unset($_SESSION[$name]);\n\
  }\n\nfunction destroy()\n{\n    $_SESSION = array();\n    session_destroy();\n \
  \   session_regenerate_id();\n}\n```\n\n访问控制\n\n283\n\n## 如何创建一个类来控制对网站某部分的访问？\n\
  \n现在我们进入访问控制的核心业务——让我们来看一个类，它控制谁有权访问你网站的私有部分。这个类使用数据库保存访问凭证，并与 HTML 登录表单配合使用。\n\n\
  ## 解决方案\n\n`Auth`类将登录、会话存储和注销功能封装在一个简单易用的 PHP 类中。\n\n#### Auth 类\n\n`Auth`类使用以下配置设置：\n\
  \n**access_control.ini *（摘录）***\n\n```ini\n; 访问控制设置\n; Web 表单变量，例如 $_POST['login']\n\
  [login_vars]\nlogin=login\npassword=password\nhash=login_hash\n; 用户登录表详细信息\n[users_table]\n\
  table=user\ncol_login=login\ncol_password=password\n```\n\n前两个设置反映了我们稍后将构建的登录表单上用户名和密码字段的名称。它们将与表单提交的`$_POST`变量名称匹配，例如`$_POST['password']`。接下来的三个设置提供了存储用户信息的表的详细信息——表名，以及表中用户名和密码列的名称。\n\
  \n284\n\n《PHP 文集》\n\n数据库表`user`将用于本节中的所有解决方案。以下是该表的 SQL 语句：\n\n**access_control.sql\
  \ *（摘录）***\n\n```sql\nCREATE TABLE user (\n    user_id     INT(11) NOT NULL AUTO_INCREMENT,\n\
  \    login       VARCHAR(50) NOT NULL DEFAULT '',\n    password    VARCHAR(50) NOT\
  \ NULL DEFAULT '',\n    email       VARCHAR(50) DEFAULT NULL,\n    firstName   VARCHAR(50)\
  \ DEFAULT NULL,\n    lastName\n);\n```\n\n\n\n\n\n```sql\nVARCHAR(50) DEFAULT NULL,\n\
  signature\nTEXT\nNOT NULL,\nPRIMARY KEY (user_id),\nUNIQUE KEY user_login (login)\n\
  );\n```\n\n`Auth` 类的主体以类属性开始：`Auth.class.php` *(摘录)*\n\n```php\nclass Auth\n{\n\
  \    protected $db;\n    protected $cfg;\n    protected $session;\n    protected\
  \ $redirect;\n    protected $hashKey;\n}\n```\n\n`$db` 属性将存储我们的数据库连接类的一个实例，而 `$cfg`\
  \ 属性将存储配置设置。`$session` 属性将存储我们在“如何创建会话类？”中创建的 `Session` 类的一个实例。`$redirect` 属性将存储一个\
  \ URL，如果访问者未登录，或者他们的用户名或密码不正确，他们将被重定向到该 URL；例如，这可能是一个登录表单。`$hashKey` 属性是我们提供的一个种子，用于双重检查已登录用户的用户名和密码。稍后我将更详细地解释这一点。\n\
  \n现在我们可以创建 `Auth` 类的构造方法：\n\n访问控制\n\n285\n\n`Auth.class.php` *(摘录)*\n\n```php\n\
  function __construct(PDO $db, $redirect, $hashKey)\n{\n    $this->db = $db;\n  \
  \  $this->cfg = parse_ini_file('access_control.ini', TRUE);\n    $this->redirect\
  \ = $redirect;\n    $this->hashKey = $hashKey;\n    $this->session = new Session();\n\
  \    $this->login();\n}\n```\n\n构造方法需要一个 `$db` 参数，该参数接受 `PDO` 类的一个实例（尽管你可以将其改为自定义类——只需确保根据你的类调整数据库交互区域）。`$redirect`\
  \ 参数是一个 URL 字符串，`$hashKey` 参数是一个字符串。\n\n在构造方法中，我们设置 `Auth` 实例变量，加载配置文件，并创建一个新的 `Session`\
  \ 类实例，将其存储在 `$session` 属性中；最后，我们调用 `login` 方法以根据数据库验证用户。\n\n`login` 方法检查用户的登录凭据：`Auth.class.php`\
  \ *(摘录)*\n\n```php\nprivate function login()\n{\n    $var_login = $this->cfg['login_vars']['login'];\n\
  \    $var_pass = $this->cfg['login_vars']['password'];\n    $user_table = $this->cfg['users_table']['table'];\n\
  \    $user_login = $this->cfg['users_table']['col_login'];\n    $user_pass = $this->cfg['users_table']['col_password'];\n\
  \    if ($this->session->get('login_hash'))\n    {\n        $this->confirmAuth();\n\
  \        return;\n    }\n    if (!isset($_POST[$var_login]) ||\n        !isset($_POST[$var_pass]))\n\
  \    {\n        $this->redirect();\n    }\n}\n```\n\n![图片 97](img/index-308_1.png)\n\
  \n![图片 98](img/index-308_2.jpg)\n\n286\n\nPHP 文集\n\n为了可读性，配置设置被赋值给局部变量。\n\n`login`\
  \ 方法首先检查用户名和密码的值当前是否存储在会话中；如果是，则调用 `confirmAuth` 方法。如果用户名和密码值未存储在会话中，该方法检查它们是否在\
  \ `$_POST` 数组中可用；如果没有，则调用 `redirect` 方法。\n\n假设脚本*已经*找到了 `$_POST` 值，它调用 `md5` 函数来获取密码的摘要：\n\
  \n`Auth.class.php` *(摘录)*\n\n```php\n$password = md5($_POST[$var_pass]);\n```\n\n\
  出于安全原因，我们使用 MD5 算法来存储密码，无论是在会话中还是在数据库中——我们不想让明文密码四处散落。\n\n### MD5 算法\n\n**MD5**\
  \ 是一种简单的*消息摘要*算法（通常称为单向加密），它将任何字符串（如密码）转换为一系列简短的 ASCII 字符，称为 **MD5 摘要**。特定的字符串总是产生相同的摘要，但实际上不可能猜出产生给定摘要的字符串。\n\
  \n通过仅在数据库中存储用户密码的 MD5 摘要，你可以在不实际将密码存储在你的服务器上的情况下验证他们的登录凭据！内置的 PHP 函数 `md5` 允许你在\
  \ PHP 中计算任何字符串的 MD5 摘要。\n\n然后脚本对数据库执行查询，看是否能找到与提交的用户名和密码匹配的记录：\n\n`Auth.class.php`\
  \ *(摘录)*\n\n```php\ntry\n{\n    $sql = \"SELECT COUNT(*) AS num_users \" .\n   \
  \        \"FROM \" . $user_table . \" WHERE \" .\n           $user_login . \"=:login\
  \ AND \" .\n           $user_pass . \"=:pass\";\n    $stmt = $this->db->prepare($sql);\n\
  \    $stmt->bindParam(':login', $_POST[$var_login]);\n    $stmt->bindParam(':pass',\
  \ $password);\n    $stmt->execute();\n    $row = $stmt->fetch(PDO::FETCH_ASSOC);\n\
  }\ncatch (PDOException $e)\n{\n    error_log('Error in '.$e->getFile().\n      \
  \        ' Line: '.$e->getLine().\n              ' Error: '.$e->getMessage()\n \
  \   );\n    $this->redirect();\n}\nif ($row['num_users'] != 1)\n{\n    $this->redirect();\n\
  }\nelse\n{\n    $this->storeAuth($_POST[$var_login], $password);\n}\n```\n\n我们使用\
  \ `PDO` 的 `prepare` 和 `execute` 方法来执行数据库查询，将我们的 `$_POST[USER_LOGIN_VAR]` 和 `$password`\
  \ 变量分别绑定到 SQL 参数 `:login` 和 `:pass`。如果抛出 `PDOException`，我们无法可靠地验证用户，因此在这种情况下，我们记录错误并调用\
  \ `redirect` 方法。\n\n获取查询结果后，我们测试是否恰好有一条匹配记录。如果没有，则调用 `redirect` 方法。最后，假设脚本到达了这一点，它通过\
  \ `storeAuth` 方法（下面解释）将用户名和密码注册为会话变量，这使得它们可用于未来的页面请求。\n\n![图片 99](img/index-310_1.png)\n\
  \n![图片 100](img/index-310_2.jpg)\n\n288\n\nPHP 文集\n\n### login 和魔术引号\n\n关于 `login`\
  \ 方法需要注意的一点是，它假设 `magic_quotes_gpc` 已关闭。在使用此类的脚本中，我们需要消除魔术引号的影响。你可以在第 1 章中名为“检查魔术引号”的部分阅读更多关于此任务的内容。\n\
  \n`storeAuth` 方法用于将用户名和密码摘要以及一个特殊的哈希值添加到会话中：\n\n`Auth.class.php` *(摘录)*\n\n```php\n\
  public function storeAuth($login, $password)\n{\n    $this->session->set($this->cfg['login_vars']['login'],\
  \ $login);\n    $this->session->set($this->cfg['login_vars']['password'], $password);\n\
  \    $hashKey = md5($this->hashKey . $login . $password);\n    $this->session->set($this->cfg['login_vars']['hash'],\
  \ $hashKey);\n}\n```\n\n这个特殊的哈希值由一个种子值——构造方法所需的 `$hashKey` 参数——以及用户名和密码值组成。正如我们将在下面的\
  \ `confirmAuth` 方法中看到的，该类不是每当用户请求页面时都费力地检查数据库以验证登录凭据，而是简单地检查当前用户名和密码产生的哈希值是否与会话中存储的哈希值相同。这种方法可以防止潜在的攻击者在你的\
  \ PHP 配置启用了 `register_globals` 时尝试更改登录后存储的用户名。\n\n`confirmAuth` 方法用于在用户登录后双重检查存储在会话中的凭据：\n\
  \n`Auth.class.php` *(摘录)*\n\n```php\nprivate function confirmAuth()\n{\n    $login\
  \ = $this->session->get(\n        $this->cfg['login_vars']['login']);\n    $password\
  \ = $this->session->get(\n        $this->cfg['login_vars']['password']);\n    $hashKey\
  \ = $this->session->get(\n        $this->cfg['login_vars']['hash']);\n    if (md5($this->hashKey\
  \ . $login . $password) != $hashKey)\n    {\n        $this->logout(true);\n    }\n\
  }\n```\n\n注意我们如何重现由 `storeAuth` 方法构建的哈希——如果这与原始哈希值不匹配，用户将立即被注销。\n\n`logout` 方法用于从会话中移除登录凭据，销毁会话，并将用户返回到存储在\
  \ `$redirect` 属性中的页面 URL：`Auth.class.php` *(摘录)*\n\n```php\npublic function logout($from\
  \ = false)\n{\n    $this->session->del($this->cfg['login_vars']['login']);\n   \
  \ $this->session->del($this->cfg['login_vars']['password']);\n    $this->session->del($this->cfg['login_vars']['hash']);\n\
  \    $this->session->destroy();\n    $this->redirect($from);\n}\n```\n\n\n\n\n出于安全考虑，我选择在此处销毁会话并启动一个全新的会话。不过，你可能需要考虑是否真的希望销毁会话。当会话被销毁时，不仅认证凭据会被移除，所有会话数据也会被清除，并且会生成一个新的会话\
  \ ID。如果你有不想在注销时丢失的会话数据，可以移除或注释掉 `session->destroy` 方法调用。\n\n认证类的最后一部分是重定向方法：\n\n\
  `Auth.class.php` *(摘录)*\n\n```\nprivate function redirect($from = true)\n{\n   \
  \ if ($from)\n    {\n        290\n        The PHP Anthology\n        header('Location:\
  \ ' . $this->redirect . '?from=' .\n        $_SERVER['REQUEST_URI']);\n    }\n \
  \   else\n    {\n        header('Location: ' . $this->redirect);\n    }\n    exit();\n\
  }\n```\n\n`redirect` 方法用于将访客返回到登录表单（或我们在实例化 Auth 类时指定的任何 URL）。默认情况下，该方法会将原始页面 URL（通过\
  \ `from` 变量请求）作为查询字符串发送到浏览器重定向的目标 URL——通常是登录表单。这样，登录表单可以读取查询字符串，并将用户返回到他们之前所在的页面；这避免了用户需要手动导航回该位置，例如在会话超时时，这一功能可能非常有用。请注意，我在\
  \ `logout` 方法中指定了 `redirect` 不应提供 `from` 变量。如果提供了，脚本可能会将用户返回到他们用于注销的 URL，从而陷入无法登录的循环。\n\
  \n这里需要注意的一个重要点是，传递给构造函数的重定向 URL 参数应该是绝对路径，而不是相对路径。根据 HTTP 规范，使用 `Location` 头时必须提供绝对\
  \ URL。\n\n稍后，当我们实际使用这个类时，我会打破这个规则，使用相对 URL，因为我无法猜测脚本在你服务器上的位置。这个技巧之所以有效，是因为大多数现代浏览器都能理解相对路径（尽管它们不应该这样做，因为这不符合规范）。但在实际站点上，请确保提供完整的绝对\
  \ URL。\n\n最后，也是最重要的，我们使用 `exit` 函数来终止所有进一步的处理。调用 `exit` 函数可以防止调用脚本发送认证代码之后受保护的内容。尽管我们已经发送了一个应该重定向浏览器的头信息，但我们不能依赖浏览器按照指示执行。例如，如果请求是由一个伪装成\
  \ Web 浏览器的 Perl 脚本发送的，那么使用该脚本的人无疑可以完全控制其行为，并且可以很容易地忽略重定向到其他位置的指令。因此，`exit` 语句至关重要。\n\
  \n## 受限区域\n\n现在你已经了解了 Auth 类的内部结构，让我们来看一些使用它的代码。\n\n下面是一个我们想要保护的页面示例。首先，列出所需的文件：\n\
  \n`access.php` *(摘录)*\n\n```\n<?php\nrequire_once 'strip_quotes.php';\nrequire_once\
  \ 'Session.class.php';\nrequire_once 'Auth.class.php';\nrequire_once 'dbcred.php';\n\
  ```\n\n`strip_quotes.php` 是一个通用脚本，用于检查 `magic_quotes_gpc = On` 并在必要时从传入请求中去除引号。`classes/Session.class.php`\
  \ 是 Auth 类所需的 Session 类，`classes/Auth.class.php` 是 Auth 类本身。`dbcred.php` 包含我们用于\
  \ PDO 的数据库登录凭据。该文件包含与测试环境相关的凭据，因此如果你想在自己的 Web 服务器上尝试，需要更改它们。\n\n接下来，我们实例化 PDO 对象并验证用户身份。这段代码需要放在任何我们希望防止未授权访问的页面顶部：\n\
  \n`access.php` *(摘录)*\n\n```\ntry\n{\n    $dbh = new PDO($dsn, $user, $password);\n\
  \    $dbh->setAttribute(PDO::ATTR_ERRMODE,\n        PDO::ERRMODE_EXCEPTION);\n}\n\
  catch (PDOException $e)\n{\n    error_log('Error in '.$e->getFile().\n        '\
  \ Line: '.$e->getLine().\n        ' Error: '.$e->getMessage()\n    );\n    292\n\
