  \ `Mail_Mime` 对象的 `setTXTBody` 方法设置邮件正文文本，并使用 `addAttachment` 方法添加附件。接着，我们调用 `get`\
  \ 方法构建邮件正文，调用 `header` 方法创建可能需要的任何特殊头部。`get` 方法应始终在 `headers` 方法之前调用。\n\n然后，与前面的示例一样，我们使用\
