  php\\extensions\\` |\n| `extension` | | 仅在基于 Windows 的系统中使用，此设置用于标识所有应加载的扩展。指定的扩展应位于上述\
  \ `extension_dir` 路径中，例如 `extension = php_xslt.dll`。 |\n\n## 附录 B：托管服务商检查清单\n\n\
  PHP，以及更广泛地说，Linux、Apache、MySQL 和 PHP/Perl/Python 的 LAMP 组合，可通过成千上万的网络主机以非常实惠的价格广泛获得。你可以轻松获得能够满足你\
  \ 90% 需求的优质网络托管，且价格相当低廉。尽管如此，并非所有 PHP 安装都是一样的——它们的能力在很大程度上取决于 `php.ini` 中定义的配置设置，以及主机为你安装的扩展。如果你希望避免日后出现问题，还需要考虑一些与你对自己环境的控制程度相关的通用问题。\n\
  \n本附录总结了你在为托管服务付费之前应调查的关键问题。联系潜在的服务商，并要求他们对以下每一点做出回应。然后，询问其他使用过该服务的人的意见——有许多在线论坛可以找到能够提供建议的人。但请注意，“有见识”与“无知”的比例严重偏向无知；请熟悉技术细节，以便能够验证你得到的回答是否信息充分。\n\
  \n我在此列出的一些观点可能看起来有点极端，但一旦你经历过几次，你可能会希望物有所值，而不是在周六早上花时间修复你的主机在周五晚上给你制造的问题。\n\n###\
  \ 通用问题\n\n无论你考虑哪家主机，都应考虑这些问题——它们是衡量优质服务的关键标志。\n\n#### 主机是否支持 Linux 和 Apache？\n\n\
  从性能和可靠性的角度来看，Linux–Apache 组合是最佳选择。询问 Linux 发行版的详细信息。虽然 Red Hat 及其衍生版（如 CentOS 和\
  \ Fedora）很流行，但你可能会发现使用 Debian 或 Ubuntu 的主机——或者更好的是，使用 Rock Linux 的主机——更了解自己在做什么。\n\
  \n避免任何使用带线程多处理模块（MPM）的 Apache 2.x 的主机，因为仍有许多第三方库不是线程安全的。坚持使用提供 prefork MPM 的 Apache\
  \ 2.x 或 Apache 1.3.x 的主机。\n\n#### 主机是否提供 SSH 访问服务器的权限？\n\nSSH 为你提供到服务器的安全连接，通过它你可以从\
  \ Linux 命令行执行任务，或使用 SCP（安全复制协议）或 SFTP（SSH 文件传输协议）传输文件。避免任何允许你使用 `telnet` 的主机，因为这是一种通过互联网连接服务器的基本不安全的方式。对于\
  \ Windows 用户，Putty¹ 是一个出色的 SSH 客户端和命令行工具，而 WinSCP² 则提供使用 SSH 连接的安全文件传输机制。\n\n或者，确保你可以使用\
  \ FTPS（基于 SSL 的 FTP）上传文件。不要使用 `FTP` 传输文件——它和 `telnet` 一样不安全。\n\n#### 主机是转售商，还是自己维护服务器？\n\
  \n如果你在基本技术层面需要帮助（例如，如果你是初学者），转售商可以提供显著价值，但他们通常对服务器的控制级别与你相同。“直接找源头”意味着当出现系统问题时，你无需处理延迟，因为你很可能直接与维护服务器的人打交道。缺点是它们往往对新用户不太宽容，所以你可能会得到答案——但可能不是你能理解的！\n\
  \n#### 主机在多大程度上“超载”服务器？\n\n许多网络托管公司在服务器上创建的账户数量远远超过系统规定的最大值。要衡量服务器超载程度，最好的指标是使用\
  \ `uptime` 命令（如果你有权使用它）；这将告诉你服务器在 1 分钟、5 分钟和 15 分钟内的平均负载。理想情况下，服务器的平均负载不应超过 1。显然，问题并不像这么简单，但一旦你看到服务器平均负载超过\
  \ 5，你就会开始体验到基于 PHP 的应用程序出现显著延迟。\n\n¹ http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html\
  \ ² http://winscp.net/eng/\n\n#### 托管服务商对从命令行运行脚本和程序的政策是什么？\n\n`MySQLDump` 是一个非常方便的数据库备份工具，但如果你无法在服务器上运行它，那就没用了。一些主机会自动终止执行时间超过给定时间的任何命令行应用程序，因此请务必调查此问题。\n\
  \n#### 主机是否提供对 `cron`（允许你安排批处理作业的 Unix 工具）的访问权限？\n\n如果是，请确保主机允许执行命令行脚本。一些主机已经实现了\
  \ `cron`，使其通过 Web URL 执行脚本，但如果相关脚本使用 `MySQLDump` 应用程序备份数据库，则这毫无用处——通过 Apache 执行的\
  \ PHP 脚本通常以用户身份运行，而该用户可能没有执行该任务所需的正确权限。\n\n### PHP 相关问题\n\n这些考虑因素专门针对 PHP 及其在服务器上的设置方式。\n\
  \n#### 你能否在你实际被分配到的服务器上看到 `phpinfo` 的输出？\n\n一些主机可能声称这存在安全风险，但专业的主机知道，通过隐藏实现的安全并不能替代真正的安全。`phpinfo`\
  \ 提供的信息对于知道自己在做什么、并且正确设置了 Linux、Apache 和防火墙的托管服务商来说，并不构成安全风险。`phpinfo` 告诉你的信息是确认事实的最佳方式。\n\
  \n#### PHP 是否作为 Apache 模块安装（而非 CGI 变体）？\n\nPHP 作为 Apache 模块安装比以 CGI 模式运行提供更好的性能。\n\
  \n#### Apache 设置 `AllowOverride` 是否设置为 `Options` 或 `All`？\n\n此设置将允许你使用 `.htaccess`\
  \ 文件修改 `php.ini` 设置。\n\n#### PHP 安全模式是否已禁用？\n\n`php.ini` 中的 `safe_mode` 选项理论上是一种使\
  \ PHP 安全的方法，并防止用户执行某些任务或使用某些对安全敏感的函数。如果你在 PHP 中做任何严肃的工作，安全模式只会带来巨大的麻烦。\n\n#### 检查主机的升级政策。\n\
  \n\n\n\n询问主机商在执行升级前会提前多久通知你。确保他们会在升级*之前*提供一份将要使用的 `php.ini` 文件副本——一夜之间从 `register_globals=on`\
  \ 切换到 `register_globals=off` 的主机商数量相当可观。在主机商执行升级之前，请确保你在自己的开发系统上针对新版本测试了你的应用程序。\n\
  \n### 索要已安装的 PHP 扩展列表。\n\n确认这些扩展符合你的应用程序需求——例如，很少有主机商会费心提供 XSLT 扩展。同时确认主机商保证在 PHP\
  \ 升级之间所有扩展都会保持可用。\n\n### PHP 是否可以从命令行使用？\n\n如果不能，你可能需要访问 Perl 或 Python，或者能够运行 shell\
  \ 脚本（如果你对这些语言满意的话）。通常，运行一个严肃的网站需要你能够使用 `cron` 执行常规批处理任务，例如备份、通过邮件发送 PHP 错误日志等。\n\
  \n### 主机商对 PHP 的了解程度如何？\n\n最后但同样重要的是，提出一两个问题来测试你的托管服务商对 PHP 的了解程度。虽然编写 PHP 代码可能不是主机商的工作，但当你发现自己比主机商更了解\
  \ PHP 时，最终结果会令人沮丧。拥有一个理解你需求的主机商非常重要。\n\n## 附录 B：托管服务商检查清单\n\n## 附录 C：安全检查清单\n\n\
  鉴于在线 PHP 应用程序基本上暴露给任何人，安全性应该成为你开发应用程序时关注的重点之一，即使不是首要关注点。在某种程度上，PHP 应用程序开发的便捷性也是该语言最大的弱点之一：对于不了解潜在危险的初学者来说，很容易部署一个安全漏洞多如瑞士奶酪的应用程序。\n\
  \n请确保你了解相关信息，如果有任何疑问，请准备好提出问题。开放 Web 应用程序安全项目（OWASP）是一个由企业赞助的社区，专注于提高 Web 安全意识，是了解潜在危险的绝佳信息来源。OWASP\
  \ 最近更新了 Web 应用程序十大常见安全漏洞列表，我在此总结了相关要点。2004 年的旧版本仍然包含相关信息，虽然有些重复，但非常值得一读。\n\n如需更详细的\
  \ PHP 安全覆盖，你可能喜欢阅读 Chris Shiflett 的《Essential PHP Security》和 Ilia Alshanetsky 的《php|architect’s\
  \ Guide to PHP Security》。\n\n### 主要安全漏洞\n\n此列表包含了当今 Web 应用程序中最常见且最危险的漏洞。\n\n####\
  \ 跨站脚本攻击（XSS）\n\n跨站脚本攻击是由于将未经检查的用户提供的数据发送到浏览器而导致的。用户提供的数据的问题在于它完全不受你的控制，而且很容易伪造诸如\
  \ HTTP 引用来源和隐藏表单字段值之类的值。\n\n例如，在处理表单时，请仔细验证数据，并采用“拒绝所有，允许少量”的策略。例如，如果注册表单有一个用户名字段，只允许字母字符，或许再加上数字\
  \ 0-9，而不是简单地拒绝特定的特殊字符。使用正则表达式将数据限制为你确切需要的内容。像 `PEAR::HTML_QuickForm` 这样的包（我们在第 5\
  \ 章的“如何使用 PHP 构建 HTML 表单？”中见过）提供了内置的表单验证机制，并有助于弥补你可能忽略的弱点。\n\n如果没有这些检查，恶意用户可能会创建一个包含如下用户名的账户：\n\
  \n```\nJohn Doe<script type=\"text/javascript\">…</script>\n```\n\n这个用户名包含一个连接到另一台服务器并发送当前用户会话\
  \ ID 的 JavaScript 文件。任何在 Web 浏览器中看到此用户名的人（例如，在浏览论坛时）都会将其会话 ID 发送到远程服务器，从而允许“John\
  \ Doe”以该用户身份连接到网站。\n\n当然，这种策略不仅限于用户名；同样的技巧也可以用于利用博客评论区域、论坛帖子的内容，甚至上传图片的文件名。不太严重但同样令人尴尬的是，恶意用户只是发布“打乱”页面布局的\
  \ HTML，例如过早关闭表格标签。在可能的情况下，使用 BBCode 等单独的标记语言，并使用 `strip_tags` 和 `htmlspecialchars`\
  \ 等 PHP 函数消除 HTML（更多信息请参见第 3 章）。如果你真的想允许在应用程序中发布 HTML，请考虑基于 `PEAR::XML_HTMLSax`\
  \ 构建一个过滤器。\n\n此外，对于包含文件等项目，请注意如下逻辑：\n\n```\ninclude($_GET['page']);\n```\n\n请确保根据你打算在代码中包含的文件列表检查\
  \ `$_GET['page']` 的值：\n\n```\n$pages = array('news.php', 'downloads.php', 'links.php');\n\
  if (in_array($_GET['page'], $pages))\n{\n    include $_GET['page'];\n}\nelse\n{\n\
  \    include 'not_found.php';\n}\n```\n\n如果没有这样的检查，攻击者很容易使用类似的代码来执行其他 PHP 脚本——即使这些脚本不是你编写的，也不存储在你的服务器上。\n\
  \n#### 注入漏洞\n\n这是与在脚本中使用未经检查的用户提供的数据值相关的另一个问题示例，注入漏洞允许攻击者影响 PHP 与外部系统（如文件系统或数据库）的交互方式。\n\
  \n当攻击者使用表单或 URL 修改数据库查询时，就会发生 SQL 注入攻击，该主题在第 2 章的“如何保护我的网站免受 SQL 注入攻击？”中进行了详细讨论。底线是：在查询中使用之前，转义从用户接收的所有数据。\n\
  \n#### 恶意文件执行\n\n任何允许执行不在服务器上的文件的脚本都会使攻击者能够在你的服务器上执行任意代码。此类攻击的后果可能包括从你的应用程序中未被察觉地提取数据，或者你的服务器完全被攻破。\n\
  \n恶意文件执行攻击适用于任何接受文件名（部分或全部）或从用户接收文件的系统，并且此问题与跨站脚本攻击密切相关。\n\n#### 不安全的直接对象引用\n\n\
  你之前见过这样的 URL：\n\n```\nhttp://site.com/view_order/?orderid=123\n```\n\n也许你曾尝试更改 `orderid`\
  \ 的值。这是直接对象引用攻击的一个例子——不过大多数都很容易防范。例如，为了确保用户只能看到自己的订单，你可以使用如下 SQL 来确认数据库中存储的订单项具有与当前用户的\
  \ `user_id` 会话值相同的 `user_id`：\n\n```\n$sql = 'SELECT * FROM order WHERE order_id='\
  \ .\nintval( $_GET['orderid'] ) . ' AND user_id=' .\n$_SESSION['user']->get('user_id');\n\
  ```\n\n另一种形式的直接对象引用攻击可以通过利用脚本中引用文件的方式来实现。基于用户提交的数据引用文件的脚本可能被用来泄露存储在网站文档根目录之外的信息。例如，考虑这个看似无害的\
  \ URL：\n\n```\nhttp://site.com/welcome/?lang=en\n```\n\n\n\n\n\n在幕后，这个 URL 通过包含\
  \ `en.lang.php` 脚本，指示页面以英文显示：\n\n```\ninclude( $_GET['lang'] . '.lang.php' );\n\
  ```\n\n你认为以下请求会从上述脚本返回什么？\n\n`http://site.com/welcome/?lang=../../../../../../../etc/passwd%00`\n\
  \n`../` 会将请求推送到文件系统的根目录，而 URL 末尾的 `%00` 利用了空终止符技巧，这将利用 PHP 脚本中的不安全包含来包含 `/etc/passwd`\
  \ 文件——即服务器上所有系统用户的列表。由于 PHP 中的所有字符串都以空字符结尾，PHP 解释器将不会看到附加在末尾的 `'.lang.php'`。\n\n\
  请记住——用户提交的信息不仅限于 URL 和表单参数！你还应检查以确保未在脚本中使用未经验证的 cookie 值、HTTP 请求头和内容值。\n\n## 附录\
  \ C：安全清单\n\n493\n\n## 跨站请求伪造（CSRF）\n\n这种类型的攻击迫使受害者在未经同意的情况下在另一个站点上执行操作。例如，此类攻击可能在论坛消息中包含一个使用以下代码的图片：\n\
  \n```\n<img src=\"http://www.google.com/accounts/ClearSID\" />\n```\n\n这段代码会自动将所有访问包含此代码页面的论坛用户从\
  \ Google 注销。更严重的是，CSRF 可能导致你的账户详情被修改，甚至在你不知情的情况下发起银行转账。\n\n对于遭受攻击的站点来说，防范此类攻击实际上比无意中托管攻击的站点更容易。为了防止自动提交表单，你可以创建一个随机令牌，该令牌在每次表单视图时重新生成，并放置在会话变量和表单的隐藏字段中：\n\
  \n```\n<?php $_SESSION['token'] = md5( uniqid( rand(), true ) ); ?>\n\n<form action=\"\
  sensitive_action.php\" method=\"post\">\n<input type=\"hidden\" name=\"token\"\n\
  value=\"<?php echo $_SESSION['token'] ?>\"/>\n⋮ *…表单的其余部分*\n</form>\n```\n\n当表单提交时，脚本会检查令牌是否与会话变量中的值匹配，只有当表单从真实站点加载时才会匹配——如果请求来自其他地方，页面将失败。\n\
  \n另一种选择——特别是对于高风险操作，如银行转账和密码更改——是要求用户确认更改。这样，伪造的请求会提示真实用户在操作执行前进行确认。\n\n## 信息泄露与不当错误处理\n\
  \n当脚本中发生错误时，错误消息可能会泄露对攻击者有用的信息。例如，像这样的消息：\n\n494\n\nPHP 文集\n\n```\nWarning: mysql_connect():\
  \ Access denied for user\n➥ 'sitepoint'@'db.sitepoint.com' (using password: YES)\n\
  ➥ in /var/www/index.php on line 12\n```\n\n这些信息为潜在攻击者提供了数据库服务器名称、数据库名称和用户名。\n\n\
  同样，输出错误 SQL 语句的错误消息会让攻击者窥见你的数据库结构——这可能是他们进行 SQL 注入的第一步。\n\n有关在生产环境中禁用向浏览器输出错误，并选择将错误消息记录到文件的信息，请参阅附录\
  \ A 中的“关键安全与可移植性设置”一节。\n\n## 认证与会话管理缺陷\n\n认证与会话管理漏洞与账户和会话数据保护不足密切相关。我们已经看到会话如何通过跨站脚本被劫持，如果用户在登录前会话被劫持，攻击者只需等待用户登录即可完全访问该用户的账户。\n\
  \nPHP 提供了 `session_regenerate_id` 函数⁷^，应在任何权限级别变更之前使用。本质上，它会在更改会话 ID 的同时保留会话数据。因此，用户登录后，会获得一个新的会话\
  \ ID，攻击者之前劫持的任何会话都将失效。你还应坚持使用 PHP 自身的会话和 cookie 管理函数——不要自己编写或使用第三方脚本。\n\n你可以采取的其他措施包括：确保站点的注销功能完全销毁会话数据，并在用户一段时间不活动后自动将其注销。\n\
  \n此外，建议不要以明文形式发送密码，无论是在电子邮件中还是在屏幕上显示。如果必须通过电子邮件发送密码，请确保用户在下次登录时必须更改该密码，然后才能继续使用站点。\n\
  \n⁷^ http://www.php.net/session-regenerate-id/\n\n附录 C：安全清单\n\n495\n\n## 不安全的加密存储\n\
  \n首先，在加密方面，不要自己编写代码。其次，请记住，如果你使用旨在被解码的算法加密数据，那么其他人也能够解码它。\n\n请记住，严格来说，MD5 和 SHA\
  \ 不是加密算法（即，你无法解密 MD5 字符串以获取原始数据）；它们是消息摘要算法。但如果你不需要解密某个值，请使用 SHA-256，该算法可通过 PHP 5.1.2\
  \ 的 `hash` [用法：`hash('sha256', $password);`] 函数⁸^ 获得。\n\n如果这不可行，你可以选择安全性较低的 MD5\
  \ 哈希，该哈希可通过 `md5` 函数⁹^ 获得。\n\n这种技术允许你比较两段数据的加密版本（例如，存储的密码和用户输入的密码），从而避免处理可能被攻击者解密的加密值所带来的风险。\n\
  \n## 不安全的通信\n\n以明文形式发送任何类型的敏感信息不仅是不良实践，而且是不可原谅的。例如，如果你要求用户登录或提供信用卡详细信息，则应使用 SSL\
  \ 保护通信。如果你的应用程序导致你的服务器与另一台服务器通信，例如银行的商户服务系统，该通信也应使用 SSL 保护。\n\n## 未能限制 URL 访问\n\n\
  大多数应用程序会根据用户的权限级别限制用户可访问的链接。例如，所有用户都能看到首页链接，但只有管理员才能访问用户列表链接。然而，许多应用程序的用户授权系统仅止步于此，这意味着任何输入用户列表页面完整\
  \ URL 的人都能访问。\n\n请确保用户只能看到他们可以使用的链接，同时确保每个页面在允许用户继续之前检查其权限。\n\n⁸^ http://www.php.net/hash/\n\
  \n⁹^ http://www.php.net/md5/\n\n496\n\nPHP 文集\n\n有关此主题的更多信息，请访问 PHP Advisory，¹⁰^\
  \ 尽管遗憾的是该站点已不再维护。\n\n¹⁰^ http://www.phpadvisory.com/\n\n## 附录 D：使用 PEAR\n\nPEAR，¹^\
  \ 即 PHP 扩展与应用库，是 Stig Bakken 的创意，灵感来源于 Perl 的 CPAN。²^\n\n作为一个项目，它最初于 1999 年构思，并于\
  \ 2003 年 1 月达到第一个稳定版本。PEAR 有两个目的。首先，它提供了一个 PHP 类库，用于解决常见的架构问题，你在本书中已经看到了其中许多类。其次，在\
  \ PECL（PHP 扩展代码库）的名称下，PEAR 为 PHP 扩展提供了一个仓库。PECL 最初旨在存储更偏向 PHP 边缘的非标准扩展，但后来已演变为所有未包含在核心\
  \ PHP 发行版中的扩展的默认仓库。在这里，我将重点介绍 PEAR 提供的 PHP 类。\n\n\n\n\n提交作品并维护 PEAR 仓库的都是志愿者。最初只是一个由开发者组成的小社区，但自从\
  \ PEAR 第一个稳定版本发布以来，志愿者数量显著增长，整个 PHP 社区对这个群体的关注度也更高了。要将 PECL 的标准提升到与 PHP 本身相当的水平，还有很多工作要做，文档就是仍有很大改进空间的关键领域之一。如果你在使用某个\
  \ PEAR 包时遇到困难，可以从 PHPKitchen 的 PEAR 教程列表入手。3 尽管如此，PEAR 在减少 PHP 应用开发工作量方面已经提供了显著的价值。\n\
  \n但 PEAR 对你来说究竟意味着什么？浏览包列表，4 你会发现 PEAR 提供了更多按主题分类的类，帮助你避免重复造轮子。重要的是要理解，PEAR 类的重点是架构问题，而不是应用级别的类。换句话说，你不会在那里找到完整的应用程序；相反，你会找到可以在许多不同应用程序中重用的代码。同样重要的是，PEAR\
  \ 开发者社区尽力维护和支持这个库，这与通过 SourceForge5 可用的项目相比具有优势，后者通常是个人努力，一旦相关个人停止贡献时间，项目就会突然终止。此外，PEAR\
  \ 还强调在整个库中保持一定程度的标准化。例如，所有错误处理都应使用`PEAR::Error`执行，代码应使用 PHPDoc 标准进行文档化，这意味着如果你在\
  \ PEAR 网站上找不到 API 文档，你应该能够使用`phpDocumentor`6 提取它，我们在第 13 章的“如何为代码编写文档以便日后自己或他人参考？”中详细介绍了这一点。\n\
  \n请注意：PEAR 中各个包之间的集成度目前相当低，与 Java 类库相比尤其如此。这意味着在某些情况下，你会面临一些决策，比如是使用`PEAR::HTML_QuickForm`的验证功能，还是使用`PEAR::Validate`，或者两者都用。最好花些时间提前调查哪种选项适合你的开发风格，而不是直接跳进去，在应用程序的关键部分使用某个\
  \ PEAR 类，结果后来才发现它并不是解决问题的最佳方案。\n\n需要明确的一个重要点是，提到 PEAR 实际上可能指两件事之一：整个仓库，或者 PEAR 前端（也称为包管理器），它提供了安装和升级你所使用的\
  \ PEAR 包的工具。\n\n你并不需要使用 PEAR 包管理器来安装 PEAR 包。如果需要，你可以直接从 PEAR 网站下载它们，并手动解压到 PHP 的\
  \ include 路径中。请务必检查网站上列出的依赖关系（这些是其他必需的包），并注意大多数包隐式地需要 PEAR 基础包来处理错误等任务。7\n\n## 安装\
  \ PEAR\n\n如今，PEAR 的基础部分已经随 PHP 发行版一起提供，但网络主机通常不会为客户提供他们自己的默认 PEAR 安装，因此了解如何从头开始安装\
  \ PEAR 是值得的。\n\n在基于 Unix 和 Windows 的系统上，过程可能略有不同。\n\n第一步是确保你可以通过命令行运行 PHP 脚本。如果你输入\
  \ PHP 二进制文件的完整路径，这总是可行的。对于基于 Unix 的系统，你可以使用以下命令：\n\n```\n/usr/local/bin/php /home/username/scripts/my_script.php\n\
  ```\n\n对于 Windows，你可以使用类似这样的命令：\n\n```\nc:\\php\\cli\\php.exe c:\\scripts\\my_script.php\n\
  ```\n\n请注意，在上面的 Windows 路径中，我们使用了 PHP 安装目录下`c:\\php\\cli\\`（命令行界面）子目录中的可执行文件。这个可执行文件的行为与\
  \ Apache 用于处理网页的可执行文件略有不同。自 4.3.0 版本以来，Windows 的 PHP 二进制发行版将 PHP 可执行文件的 CLI 版本放在这个目录中。我们可以通过对系统环境变量进行一些更改，使\
  \ PHP 在命令行中更容易使用。更多信息，请参阅 PHP CLI 手册页面。8\n\n接下来，将浏览器指向 http://go-pear.org/，你会看到一个\
  \ PHP 脚本。这个脚本用于安装 PEAR 包管理器——这是安装其他 PEAR 包所需的基础。将其下载到你的计算机并保存为`go-pear.php`。从这一点开始，你有多种选择。\n\
  \n将`go-pear.php`存放在 Web 服务器文档根目录下的某个位置，可以让你以网页形式运行该脚本。不过，这种行为仍处于实验阶段，因此不能保证它能正常工作。如果你使用这种方法，请确保该脚本`不`是公开可访问的！\n\
  \n更好的选择是通过命令行执行`go-pear.php`脚本：\n\n```\n/usr/local/bin/php /home/username/pear/go-pear.php\n\
  ```\n\n以下是 Windows 用户的命令：\n\n```\nc:\\php\\cli\\php c:\\pear\\go-pear.php\n```\n\
  \n此命令将启动一个交互式命令行界面，它会询问你关于如何安装 PEAR 的问题。请注意，**安装前缀**是 PEAR（以及你之后安装的任何包）将被安装到的目录，称为`$prefix`；`$php_dir`包含你的\
  \ PHP 安装路径（除非你另行指定，否则`go-pear.php`默认会将 PEAR 相关文档放在其中）。Windows 用户应注意，更改安装前缀将导致显示\
  \ Windows**浏览**对话框；你可以使用它来指定所需的目录。\n\n设置好安装选项后，`go-pear.php`脚本将连接到 PEAR 网站，并下载设置包管理器所需的所有包（它还会询问你是否需要额外的包，这些包非常值得拥有）。包被安装在你指定为安装前缀的目录下的一个名为`pear`的子目录中。因此，在上面的示例中，你最终会得到`c:\\\
  pear\\pear`或`/home/username/pear/pear`。\n\n最后，如果你允许，`go-pear.php`安装程序会尝试修改`php.ini`中的`include_path`。要手动执行此操作，假设你使用了上面的目录，你需要指定以下内容：\n\
  \n```\ninclude_path = \".:/home/username/pear/pear\"\n```\n\n对于 Windows 用户，路径如下：\n\
  \n```\ninclude_path = \".;c:\\pear\\pear\"\n```\n\n最后，要从命令行使用 PEAR 包管理器，你需要设置一些环境变量。Windows\
  \ 用户可以通过右键单击`PEAR_ENV.reg`文件并从出现的菜单中选择**运行**，自动将这些变量添加到 Windows 注册表中。这些变量也可以通过 Windows\
  \ 控制面板手动配置为环境变量。基于 Unix 系统的用户可以配置这些变量，以便每次登录时自动设置。为此，他们必须编辑主目录（`/home/username`）中的`.profile`文件：\n\
  \n```\n#\nEnvironment variables\nexport PHP_PEAR_SYSCONF_DIR=/home/username/pear\n\
  export PHP_PEAR_INSTALL_DIR=/home/username/pear/pear\nexport PHP_PEAR_DOC_DIR=/home/username/pear/pear/docs\n\
  export PHP_PEAR_BIN_DIR=/home/username/pear\nexport PHP_PEAR_DATA_DIR=/home/username/pear/pear/data\n\
  export\n```\n\n\n\n\n```\nPHP_PEAR_TEST_DIR=/home/username/pear/pear/tests export\n\
  PHP_PEAR_PHP_BIN=/usr/local/bin/php\n```\n\n最后，你需要将 PEAR 命令行脚本添加到系统路径中。在 Windows\
  \ 上，可以通过系统控制面板应用程序（在**高级**选项卡中，点击**环境变量**）实现。只需将 `;c:\\pear` 追加到 `PATH` 变量中。\n\n\
  在基于 Unix 的系统中，将以下内容添加到 `.profile` 脚本中：`export PATH=$PATH:/home/username/pear`\n\n\
  完成上述所有操作后，你就可以继续使用包管理器了。\n\n## PEAR 包管理器\n\n假设你已经正确设置了 PEAR，现在可以使用 PEAR 包管理器的命令行界面来安装包。例如，执行以下命令：`pear\
  \ install HTML_Common`\n\n该命令将从 PEAR 网站安装 `HTML_Common` 包。命令行中的包名称与网站上的名称相同。\n\n\
  PEAR 包管理器使用 `XML_RPC` 与 PEAR 网站通信。如果你位于代理服务器或防火墙之后，需要像这样告诉 PEAR 代理服务器的域名：\n\n`pear\
  \ config-set http_proxy proxy.your-isp.com`\n\n稍后若要取消该变量，只需使用以下命令：\n\n`pear config-set\
  \ http_proxy \"\"`\n\n要将 `HTML_QuickForm` 添加到已安装的 PEAR 包中，只需输入以下命令：\n\n`pear install\
  \ HTML_QuickForm`\n\n如果在安装 `HTML_QuickForm` 后发布了新版本，你可以使用以下命令升级版本：\n\n`pear upgrade\
  \ HTML_QuickForm`\n\n如果出于某种原因，你后来决定不再需要 `HTML_QuickForm`，可以使用以下命令将其移除：\n\n`pear\
  \ uninstall HTML_QuickForm`\n\n要查看所有 PEAR 命令的列表，只需输入 `pear`。\n\n现在，如果你不喜欢命令行，PEAR\
  \ 还有一个（实验性的）基于 Web 的前端（还有一个 PHP-GTK 前端，但这超出了本文的讨论范围）。要使用此工具，你需要从命令行安装它，不过如果你通过 Web\
  \ 服务器执行了 `go-pear.php`，那么基于 Web 的前端应该已经为你安装好了。要安装前端，请键入以下命令：\n\n```\npear install\
  \ Net_UserAgent_Detect\npear install Pager\npear install HTML_Template_IT\npear\
  \ install PEAR_Frontend_Web\n```\n\n请注意，我们在此指定的前三个包是 `PEAR_Frontend_Web` 所必需的。现在，你可以使用以下简单脚本从\
  \ Web 服务器启动前端：\n\n```php\n<?php\n// 如果未设置 include 路径，则为可选\n# ini_set('include_path','c:\\\
  htdocs\\PEAR');\nrequire_once 'PEAR.php';\n// 对于 Windows 用户\n# $pear_user_config\
  \ = 'c:\\windows\\pear.ini';\n// 对于 Unix 用户\n$pear_user_config = '/home/username/pear/pear/PEAR/pear.conf';\n\
  $useDHTML = true; // 对于旧版浏览器请关闭\nrequire_once 'PEAR/WebInstaller.php';\n?>\n```\n\
  \n## 手动安装包\n\n可以手动安装 PEAR 包（尽管这涉及更多工作），但在这样做时，务必仔细关注包含路径。首先，创建一个目录作为所有要安装的 PEAR\
  \ 类的基目录，并确保该目录在你的包含路径中。接下来，安装主要的 PEAR 包。[9] 下载最新的稳定版本，并将其直接解压到你创建的目录中，这样 `PEAR.php`\
  \ 就位于该目录的根目录下。\n\n安装其他包的方式大致相同，但在解压各个文件时需要小心选择正确的目录。例如，如果你要安装 `PEAR::DB`，主文件 `DB.php`\
  \ 应与 `PEAR.php` 一起放在 PEAR 类目录的根目录下，而其他与 `PEAR::DB` 相关的文件则应放在子目录 `DB` 中。检查你是否选择了正确目录的最佳方法是查看每个\
  \ PEAR 包附带的 `package.xml` 文件。在该文件中，你会找到一个名为 `filelist` 的元素，它列出了包中包含的所有文件及其应安装的位置。对于每个文件，请检查\
  \ `baseinstalldir` 属性——如果指定了该属性，它会告诉你文件应相对于 PEAR 类根目录放置的位置。`name` 属性指定了相对于 `baseinstalldir`（如果没有\
  \ `baseinstalldir` 属性，则相对于 PEAR 类根目录）的路径和文件名，即每个文件应放置的位置。\n\n[9] http://pear.php.net/package/PEAR/\n\
  \n## PEAR 的替代方案\n\n有许多可重用的 PHP 类库可供使用。一些网站，如 PHP Classes，[10] 提供用户贡献的下载作品，而其他网站，如\
  \ eZ Components，[11] 则管理自己的可重用类代码库，这些类库可以作为包下载。\n\n对于更紧密集成的代码库，你可能想了解众多可用的快速应用程序开发框架，例如\
  \ Zend Framework [12] 和 CakePHP。[13]\n\n本书不打算深入介绍这些框架中的任何一个，也不评论哪个最适合你的需求，但总的来说，从这些来源（包括\
  \ PEAR）重用代码可以节省开发时间，让你能够专注于编写满足需求的软件，而不是为每个项目重写基本组件。\n\n但请注意，刚开始使用来自代码库和框架的代码时，会涉及一些额外开销。从头开始编写所有代码在短期内可能是最快的解决方案，但选择并熟练掌握一个代码库或框架将有助于在中长期内减少开发时间，并且对任何编写多个网站的人都有好处。你还会发现，选择合适的框架可以使其他开发人员在处理你创建的网站时更快上手。此外，避免频繁切换开发环境，因为这会重置你的学习曲线，并可能对你的生产力产生不利影响。\n\
  \n最后，请记住，当你使用任何接受公共贡献且几乎没有或没有质量控制要求的代码库中的代码时，你可能会面临各种问题，从安全漏洞到依赖过时且无人维护的组件。\n\n\
