  \n## 创建饼图\n\n另一种可以用 JpGraph 轻松构建的图表类型是饼图。\n\n让我们使用上一个例子中的样本数据来构建一个饼图。\n\n在脚本开头，我们必须引入主要的饼图类以及三维饼图类：\n\
  \n`piechart.php` *(摘录)*\n\n```\n<?php\nerror_reporting(E_ALL ^ E_NOTICE);\nrequire_once\
