  \ Sales');\n\n// 标题颜色\n$graph->title->SetColor('black');\n\n// 标题字体\n$graph->title->SetFont(FF_VERDANA,FS_BOLD,14);\n\
  ```\n\n我们还需要一个图例来标识饼图每个扇区代表的内容：\n\n`piechart.php` *(摘录)*\n\n```\n// 图例文本颜色\n$graph->legend->SetColor('black');\n\
  \n// 图例背景颜色\n$graph->legend->SetFillColor('gray');\n\n// 图例位置\n$graph->legend->Pos(0.02,0.61);\n\
  ```\n\n现在，我们创建三维饼图对象；我们用 *y* 数据实例化它，同时使用 *x* 数据作为图例，并弹出两个饼图扇区以增强效果：\n\n图像\n\n229\n\
  \n`piechart.php` *(摘录)*\n\n```\n// 用 Y 数据实例化 3D 饼图\n$pie = new PiePlot3d($ydata);\n\
  \n// 将 X 数据添加到图例\n$pie->SetLegends($xdata);\n\n// 设置颜色主题（earth|pastel|sand|water）\n\
  $pie->SetTheme('earth');\n\n// 相对于 X 轴居中\n$pie->SetCenter(0.36);\n\n// 饼图半径大小（像素）\n\
  $pie->SetSize(100);\n\n// 设置饼图倾斜角度\n$pie->SetAngle(30);\n\n// 弹出一个扇区\n$pie->ExplodeSlice(2);\n\
  \n// 弹出另一个扇区\n$pie->ExplodeSlice(3);\n```\n\n我们将在图表上每个扇区旁边显示一个标签，以标识该扇区占整体的百分比：\n\
