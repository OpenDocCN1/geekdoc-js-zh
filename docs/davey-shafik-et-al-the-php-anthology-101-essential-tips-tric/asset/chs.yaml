- "# PHP 文集：101个必备技巧、窍门和黑客方法\n\n\n\n\nv\n\n**本·巴尔博**  \n本·巴尔博出生于德国，在英国长大，现居墨尔本，喜欢健力士啤酒。在不喝健力士的时候（在墨尔本大部分时间都不喝，因为味道不一样），他以\
  \ PHP 开发者和培训师、安全顾问以及开源开发者的身份谋生。他曾公开谈论过与 Web 开发相关的话题，这也是他同时担任墨尔本 PHP 用户组和开源开发者俱乐部委员会成员的一部分。虽然他不愿承认，但他参与这些活动只是为了在会议结束后去餐馆或酒吧。\n\
  \n**哈里·福克斯**  \n哈里·福克斯[¹] 是一名技术作家、程序员和系统工程师。自 1994 年以来，他一直在企业 IT 领域工作，拥有物理学学士学位。他于\
  \ 1999 年在搭建一个小型内网时首次接触 PHP。如今，他是企业外网的首席开发者，PHP 在为数个后台系统提供统一平台方面发挥着重要作用。业余时间，他为 SitePoint\
  \ 撰写技术文章，并运营 phpPatterns[²]——一个探索 PHP 应用设计的网站。他原籍英国，现居瑞士。哈里是一个漂亮女婴的骄傲父亲，这个孩子让他整天（和整夜）忙个不停。\n\
  \n[¹]: 哈里·福克斯照片来源：布鲁诺·格伯 http://www.flickr.com/photos/beegee74/231137320/\n[²]:\
  \ http://www.phppatterns.com/\n\nvi\n\n**戴维·沙菲克**  \n戴维·沙菲克是一名全职 PHP 开发者，拥有十年 PHP\
  \ 及相关技术经验。他热衷于撰写杂志文章、编写书籍和发表演讲，通过从独特视角解决问题来保持思维敏锐。他住在佛罗里达州中部，与五只猫和多台电脑为伴。\n\n**莉加亚·特梅尔**\
  \  \n莉加亚·特梅尔是一名全职女神、兼职 PHP 程序员，以及痴迷的环球旅行者。她积极参与 PHP 社区，是 phpwomen.org 的创始负责人之一、codewalkers.com\
  \ 的管理员、Zend.com 开发者区的流动记者、PHP 博主，以及 freenode 上 #phpc 频道的长期活跃分子。她希望有一天能真正见到那些与她交流的人。不坐在电脑前盯着屏幕时，莉加亚通常会在打高尔夫、潜水、浮潜、划皮划艇、徒步旅行，或者只是和狗在外面玩耍。莉加亚·特梅尔是\
  \ Zend 认证工程师。\n\n**马修·韦尔·奥菲尼**  \n马修·韦尔·奥菲尼是两个孩子的全职父亲，业余时间用 PHP 进行开发。他是 PEAR 开发者、Zend\
  \ Framework 的核心贡献者，以及 PHP 5 的全面倡导者——尽管对他来说 PHP 6 来得还不够快。\n\n**关于专家审校**  \n杰森·斯威特自\
  \ 2001 年开始使用 PHP，当时他正在寻找一个免费的（如同免费啤酒）替代 IIS/ASP 的方案，为家庭企业创建会计系统。他的 Unix 管理员将他引向了\
  \ Linux、Apache 和 PHP。此后，他将 PHP 作为工作中的内网开发标准，并在 Unix shell 脚本环境中使用 PHP。他是《php|architect\
  \ 的 PHP 设计模式指南》（多伦多：Marco Tabini & Associates, 2005）的作者，也是《PHP 图形手册》（伯明翰：Wrox, 2003）的合著者，为\
  \ Zend 网站和《php|architect》杂志撰写了多篇文章，并在多个会议上就 PHP 发表了多次演讲。杰森是 Zend 认证工程师，并在 http://blog.casey-sweat.us/\
  \ 上维护博客。\n\n**关于技术编辑**  \n安德鲁·泰特洛自 1997 年起以 Web 开发者的身份摆弄网站，还曾担任过高中英语教师、日本英语教师、窗户清洁工、洗车工、厨房帮手和家具销售员。在\
  \ SitePoint，他致力于通过技术编辑 SitePoint 的书籍和工具包让世界变得更美好。他也是五个孩子的忙碌父亲，喜欢咖啡，并且经常忽略他在 http://tetlaw.id.au/\
  \ 上的博客。\n\n**关于技术总监**  \n作为 SitePoint 的技术总监，凯文·扬克负责监督所有技术出版物——书籍、文章、新闻通讯和博客。他为 SitePoint\
  \ 撰写了 50 多篇文章，但最出名的是他的书《用 PHP 和 MySQL 构建自己的数据库驱动网站》。凯文居住在澳大利亚墨尔本，喜欢即兴喜剧表演和驾驶轻型飞机。\n\
  \n**关于 SitePoint**  \nSitePoint 专注于为 Web 专业人士出版有趣、实用且易于理解的内容。请访问 http://www.sitepoint.com/\
