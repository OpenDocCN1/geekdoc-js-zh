  \n## 讨论\n\n为了不让你感到乏味，我留下了几块拼图让你自己填充。如果已注册用户中存在与新注册用户相同的用户名或电子邮件地址，`createSignup`\
  \ 方法会抛出异常并停止流程。如果你习惯使用 `HTML_QuickForm`，你可能希望将此检查拆分为一个单独的方法，以便 `HTML_QuickForm`\
  \ 可以将其作为表单中每个字段的验证规则应用。这种方法可以减少用户发现所选账户名已存在时的挫败感——`HTML_QuickForm` 会生成一条消息告知用户这一事实，保留他们输入的其他值，并允许他们使用不同的用户名重试。\n\
  \n如果你计划允许用户在创建账户后更改其电子邮件地址，你还需要在将新地址存储到用户表之前对其进行确认。你应该能够重用 `SignUp` 类提供的方法来实现此目的。你甚至可以考虑重用注册表来处理此任务。\n\
  \n需要进行一些修改——例如，你可能希望 `confirm` 方法能够更新用户表中的现有记录。不过，要非常小心，不要在你的安全中留下漏洞。如果你没有检查用户表中的现有记录，用户可能会使用与用户表中现有行匹配的详细信息注册新账户。然后，你最终会将现有用户的电子邮件地址更改为新用户的地址，这至少会让你感到尴尬。\n\
  \n## 如何处理忘记密码的会员？\n\n不幸的是，人类倾向于忘记密码等重要信息，因此允许用户找回遗忘密码的功能是节省时间的关键。如果忽略这一需求，你可能会浪费大量时间手动为忘记密码的人更改密码。\n\
  \n如果你在数据库中加密了密码，你需要一种机制来生成新密码，最好是容易记住的。\n\n![Image 105](img/index-341_1.jpg)\n\n\
  ![Image 106](img/index-341_2.png)\n\n## 访问控制\n\n### 谨慎使用密码提示\n\n网站注册中常用的一种策略是使用简单问题作为记忆提示，以防用户忘记密码。这些问题可能包括“你出生在哪里？”和“你的宠物叫什么名字？”然而，这样的细节可能众所周知，或者容易被其他用户猜到。\n\
  \n## 解决方案\n\n由于我们已经通过“如何构建注册系统？”中的注册流程确认了每个账户的有效电子邮件地址，我们只需将新密码发送到该地址即可。我们的解决方案使用了前面章节中的用户表：\n\
  \n`access_control.sql（节选）`\n\n```sql\nCREATE TABLE user (\nuser_id\nINT(11)\nNOT\
  \ NULL AUTO_INCREMENT,\nlogin\nVARCHAR(50) NOT NULL DEFAULT '',\npassword\nVARCHAR(50)\
  \ NOT NULL DEFAULT '',\nemail\nVARCHAR(50) DEFAULT NULL,\nfirstName\nVARCHAR(50)\
  \ DEFAULT NULL,\nlastName\nVARCHAR(50) DEFAULT NULL,\nsignature\nTEXT\nNOT NULL,\n\
  PRIMARY KEY (user_id),\nUNIQUE KEY user_login (login)\n);\n```\n\n### AccountMaintenance\
  \ 类\n\n`AccountMaintenance` 类是一个工具类，除其他功能外，它将重置用户账户的密码并生成一封邮件，将新密码发送给用户。我们的类使用以下配置设置：\n\
  \n`access_control.ini（节选）`\n\n```ini\n; 访问控制设置\n; 网络表单变量，例如 $_POST['login']\n[login_vars]\n\
  login=login\n\n; 用户登录表详情\n[users_table]\ntable=user\ncol_id=user_id\ncol_login=login\n\
  col_password=password\ncol_email=email\ncol_name_first=firstName\ncol_name_last=lastName\n\
  ```\n\n为了提供一致的错误处理级别，我们定义了一些自定义异常类：\n\n`AccountMaintenance.class.php（节选）`\n\n```php\n\
  class AccountException extends Exception\n{\npublic function __construct($message\
  \ = null, $code = 0)\n{\nparent::__construct($message, $code);\nerror_log('Error\
  \ in '.$this->getFile().\n' Line: '.$this->getLine().\n' Error: '.$this->getMessage()\n\
  );\n}\n}\n\nclass AccountDatabaseException extends AccountException {}\nclass AccountUnknownException\
  \ extends AccountException {}\nclass AccountPasswordException extends AccountException\
  \ {}\nclass AccountPasswordResetException extends AccountException {}\n```\n\n我们的基类\
  \ `AccountException` 是一个自定义异常，确保使用 `error_log` 函数记录异常详情。子类代表账户维护过程中可能出现的不同异常情况。\n\
  \n我们以类属性开始 `AccountMaintenance` 类的定义：\n\n## 访问控制\n\n\n\n\n\n### `AccountMaintenance.class.php`\
  \ *（摘录）*\n\n```php\nclass AccountMaintenance\n{\n    protected $db;\n    protected\
  \ $cfg;\n    private $words;\n}\n```\n\n`$db` 将包含一个用于数据库连接的 `PDO` 实例，`$cfg` 将存储我们的配置详情，而\
  \ `$words` 将存储用于密码生成的随机单词文件的路径。\n\n构造函数仅存储数据库对象以供类后续使用，并加载配置文件：\n\n### `AccountMaintenance.class.php`\
  \ *（摘录）*\n\n```php\npublic function __construct(PDO $db)\n{\n    $this->db = $db;\n\
  \    $this->cfg = parse_ini_file('access_control.ini', TRUE);\n}\n```\n\n由于我们将用户的密码以\
  \ MD5 哈希（一种单向加密形式）存储在数据库中，我们无法再找出原始密码。如果成员在这种情况下忘记了密码，你必须为他们生成新密码。你可以简单地生成一个随机字符串，但重要的是要记住，如果你的安全系统过于不友好，你会吓跑合法用户。`resetPassword`\
  \ 方法生成一个更人性化的随机密码：\n\n### `AccountMaintenance.class.php` *（摘录）*\n\n```php\nfunction\
  \ resetPassword($login, $email)\n{\n    //将 cfg 变量放入局部变量以提高可读性\n    $user_table\
  \ = $this->cfg['users_table']['table'];\n    $user_id = $this->cfg['users_table']['col_id'];\n\
  \    $user_login = $this->cfg['users_table']['col_login'];\n    $user_pass = $this->cfg['users_table']['col_password'];\n\
  \    $user_email = $this->cfg['users_table']['col_email'];\n    $user_first = $this->cfg['users_table']['col_name_first'];\n\
  \    $user_last = $this->cfg['users_table']['col_name_last'];\n    $user_sig = $this->cfg['users_table']['col_signature'];\n\
  \    try\n    {\n        $sql = \"SELECT \" . $user_id . \",\n                \"\
  \ . $user_login . \", \" . $user_pass . \",\n                \" . $user_first .\
  \ \", \" . $user_last . \"\n                FROM\n                \" . $user_table\
  \ . \"\n                WHERE\n                \" . $user_login . \"=:login\n  \
  \              AND\n                \" . $user_email . \"=:email\";\n        $stmt\
  \ = $this->db->prepare($sql);\n        $stmt->bindParam(':login', $login);\n   \
  \     $stmt->bindParam(':email', $email);\n        $stmt->execute();\n        $row\
  \ = $stmt->fetchAll(PDO::FETCH_ASSOC);\n    }\n    catch (PDOException $e)\n   \
  \ {\n        throw new AccountDatabaseException('查找用户时数据库错误：'.$e->getMessage());\n\
  \    }\n}\n```\n\n首先，我们将配置设置赋值给局部变量，使代码更易读。接下来，我们处理 `resetPassword` 方法，该方法在给定用户名和电子邮件地址的组合时，尝试在用户表中找到对应的行。\n\
  \n我们同时使用用户名和电子邮件来标识该行，这样其他人重置你成员的密码就会更困难一些。虽然没有人会窃取新密码（除非他们能控制成员的电子邮件账户），但如果密码被不断重置，肯定会惹恼用户。要求同时提供用户名和电子邮件地址使这个过程稍微复杂一些。\n\
  \n如果找不到匹配的行，我们会抛出一个异常：\n\n### `AccountMaintenance.class.php` *（摘录）*\n\n```php\n\
  if (count($row) != 1)\n{\n    throw new AccountUnknownException('找不到账户');\n}\n```\n\
  \n接下来，我们调用 `generatePassword` 方法（稍后讨论）来创建一个新密码：\n\n### `AccountMaintenance.class.php`\
  \ *（摘录）*\n\n```php\ntry\n{\n    $password = $this->generatePassword();\n}\n```\n\
  \n这个方法调用被放在一个 `try` 块中，以捕获 `generatePassword` 在无法生成新密码时抛出的异常。\n\n然后 `generatePassword`\
  \ 用新密码（使用 `md5` 加密）更新用户表，并将新密码连同用户详情一起以数组形式返回：\n\n### `AccountMaintenance.class.php`\
  \ *（摘录）*\n\n```php\n$sql = \"UPDATE \" . $user_table . \"\n        SET\n       \
  \ \" . $user_pass . \"=:pass\n        WHERE\n        \" . $user_id . \"=:id\";\n\
  $stmt = $this->db->prepare($sql);\n$stmt->bindParam(':pass',md5($password));\n$stmt->bindParam(':id',\
  \ $row[0][$user_id]);\n$stmt->execute();\n```\n\n```php\ncatch (AccountPasswordException\
  \ $e)\n{\n    throw new AccountResetPasswordException('生成密码时出错：'.$e->getMessage());\n\
  }\ncatch (PDOException $e)\n{\n    throw new AccountDatabaseException('重置密码时数据库错误：'.$e->getMessage());\n\
  }\n```\n\n```php\n$row[0][$user_pass] = $password;\nreturn $row;\n```\n\n`addWords`\
  \ 方法用于向类提供一个索引数组，其中包含用于构建易记密码的单词：\n\n### `AccountMaintenance.class.php` *（摘录）*\n\
  \n```php\nfunction addWords($words)\n{\n    $this->words = $words;\n}\n```\n\n我使用了一个包含一千多个单词的列表（存储在文本文件中）来构建易记密码。请注意，如果有人知道你使用的单词列表，破解新密码就会容易得多，因此你应该创建自己的列表。\n\
  \n`generatePassword` 从 `AccountMaintenance->words` 数组中构建一个随机密码，并添加分隔符，分隔符可以是 0 到\
  \ 9 之间的任意数字，或下划线字符：\n\n### `AccountMaintenance.class.php` *（摘录）*\n\n```php\nprotected\
  \ function generatePassword()\n{\n    $count = count($this->words);\n    if ($count\
  \ == 0)\n    {\n        throw new AccountPasswordException('没有可用的单词！');\n    }\n\
  \    mt_srand((double)microtime() * 1000000);\n    $seperators = range(0,9);\n \
  \   $seperators[] = '_';\n    $password = array();\n    for ($i = 0; $i < 4; $i++)\
  \ {\n        if ($i % 2 == 0) {\n            shuffle($this->words);\n          \
  \  $password[$i] = trim($this->words[0]);\n        } else {\n            shuffle($seperators);\n\
  \            $password[$i] = $seperators[0];\n        }\n    }\n    shuffle($password);\n\
  \    return implode('', $password);\n}\n```\n\n密码本身将包含从列表中随机选择的两个单词，以及两个随机分隔符。这些元素在密码中出现的顺序也是随机的。该系统生成的密码可能类似于\
  \ `7correct9computer` 和 `48courtclothes`，这种格式对用户来说相对容易记忆。\n\n## 重置密码页面\n\n要完成我们网站的账户维护功能，还有一件事要做：我们需要一个网页表单，供用户填写以请求更改或重置密码。\n\
