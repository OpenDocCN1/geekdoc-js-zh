  >\n<head>\n⋮ *HTML head contents…*\n</head>\n<body>\n⋮ *restricted content…*\n<p><a\
  \ href=\"<?php echo $_SERVER['PHP_SELF']; ?>?action=logout\"> Logout</a></p>\n</body>\n\
  </html>\n```\n\n![Image 101](img/index-315_1.jpg)\n![Image 102](img/index-315_2.png)\n\
  \n访问控制\n\n293\n\n用户只有提供正确的用户名和密码才能查看此页面。Auth 类在实例化后立即执行安全检查。如果通过表单提交了有效的用户名和密码，它们会被\
  \ Auth 类存储在会话变量中，从而允许访客继续使用站点的各个部分，而无需再次登录。\n\n创建登录表单本身并不复杂，但使用 `PEAR::HTML_QuickForm`\
  \ 包会更加容易。`HTML_Quickform` 允许我们轻松地向表单添加字段并定义验证要求。我不会详细解释其工作原理，但如果你想了解更多关于 `HTML_Quickform`\
  \ 的信息，可以阅读在线文档。7\n\n## PEAR PHP 5 E_STRICT 兼容性\n\n需要注意的是，大多数 PEAR 包并不兼容 PHP 5 的\
  \ E_STRICT 模式。可以预期会产生错误，但别忘了你可以使用 `error_reporting` 函数关闭它们。对于你遇到的任何错误，请向 PEAR 错误系统提交错误报告，以帮助在未来的版本中消除它们。8\n\
  \n让我们开始创建登录表单：首先设置错误报告级别并引入 `PEAR::HTML_QuickForm` 包：\n\n`login.php` *(摘录)*\n\n\
  ```\n<?php\nerror_reporting(E_ALL);\nrequire_once 'HTML/QuickForm.php';\n```\n\n\
  我们使用 `error_reporting` 函数将错误报告级别设置为 `E_ALL`，因为我们使用了 PEAR 包，这些包在 PHP 5 下会导致 `E_Strict`\
  \ 错误。\n\n接下来，检查是否存在 `$_GET['from']` 变量：7 http://pear.php.net/manual/en/package.html.html-quickform.php\
  \ 8 http://pear.php.net/bugs/\n\n`login.php` *(摘录)*\n\n```\nif (isset($_GET['from']))\n\
  {\n    $target = $_GET['from'];\n}\nelse\n{\n    $target = 'access.php';\n}\n?>\n\
  ```\n\n`$_GET['from']` 变量会在需要时由我们的 Auth 类设置。该变量表示用户试图访问的页面，他们从该页面被重定向到此登录表单。它被用作表单的\
  \ `action` 属性，以便在用户登录后将其发送回该页面。\n\n\n\n\n否则，就本演示而言，表单默认指向 `access.php`，即我们受演示限制的内容页面。\n\
