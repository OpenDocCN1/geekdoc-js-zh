    \nThe thing is, javascript could easily think that `gilad` may be just another\
    \ variable, and because it could be a variable, it's trying to look for it in\
    \ the *entire* page, and when it couldn’t find it, it just says… “Oh Well, alright…\
    \ I did my best, I cannot find it anywhere… So I’ll just do nothing and relax…\
    \ ” (giving up early, huh?)\n\nTo say explicitly to Javascript that we have a\
    \ string here, we need to wrap our text inside of quotation mark.\n\nLet’s do\
    \ that:\n\n```javascript\nvar name = “gilad”;\ndocument.write(name);\n```\n\n\
    Save it, refresh it, and… yeah baby! We’ve still got it!\n\nSo now we know that\
    \ we have two different types of variables.\n\nNumbers, and strings.\n\nAnd the\
    \ difference between them is that little quotation mark.\n\nWe have a few more\
    \ types of variables in javascript, and we will cover them in later lectures.\n\
    \n### Chapter 9: Using different types of var\n\nDid you know that Javascript\
    \ can make your homework?\n\nIf I knew that, I would study Javascript at age 5!\n\
    \nHere’s an example:\n\n```javascript\ndocument.write(3 + 3);\n```\n\nThat could\
