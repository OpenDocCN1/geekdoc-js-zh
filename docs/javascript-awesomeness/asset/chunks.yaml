    \ run.\n"
  raw: 'And we will close it with a semicolon like always.


    var gilad = 9;


    Right now you already know how to print stuff to your page, remember our fluffy
    red goat?


    document.write(“I’m printing fluffy red goat… ”);


    So erase the text inside, and just write your variable’s name (no quotation mark
    needed!).


    document.write(gilad);


    Save it, and refresh it.


    Holly goats! We’ve got a 9 on our screen!


    Let’s explain what just happened:


    Your browser thinking for himself, “oh alright, awesomely-cool-web-developer!
    You want me to set a variable, and then you call the variable ‘gilad’. So i’ll
    set a place in my room just for you… And I will call that place ‘gilad’ from now
    on…“


    Then we wrote the equal sign… so that means you set it to whatever on the right
    side of the equal sign.


    Which is 9.


    So the computer says “ok, I’ll now store 9, in my place called ‘gilad’. And I
    promise you, I will use it whatever you will tell me to use it… “


    Then when we called the ‘gilad’ variable inside our ‘document.write’, the computer
    took the value, and print it inside of the document.


    Oh, but one more thing… Do you remember I told you about the name of variable,
    and that you can name it whatever you like… Well… you can.


    But you have 2 rules you *have* to keep, ok?


    Rule number one:


    Don’t ever write anything funky like that: #5^$%^^$. Your browser will go bananas,


    and wouldn’t know what you mean by that name! You can only call your variables
    by letters,


    numbers, and underscores.


    Rule number two:


    Javascript is case sensitive language, so don’t call your variable jeffery, all
    letter case, and


    then afterwards call it JeFferY like a crazy person. For the browser, It’s like
    you will call


    Some girl “Hillary!” and then switch to “Hey Brittney! Sup Brit… I mean… Doris!…
    Doris!!!


    Jenni… Bath!… Elizab… Doris!!! Doris…”


    Yeah… so don’t do that… Other than that. You’re safe!


    ### Chapter 8


    Variable types


    Do you remember when you were a baby, you had this weird game of shapes, and you
    were supposed to sort those shapes and put every shape into its place?


    Just like that game, Javascript has different types of variables. And they cannot
    fit everywhere…


    Let me explain it to you by first writing it down in our text editor:


    I will write var, *name*, equals to 9:


    var name = 9;


    document.write(name);


    That’s what we’ve done in the last lecture, right?


    We have a variable named *name*, and it’s equal to the number 9.


    But, my name is not nine, right? (I swear it’s doesn’t!)


    Let’s try to erase the number nine, and place my name instead.


    var name = gilad;


    document.write(name);


    Save it, refresh it, and let’s see what we have here…


    ah! Nothing shows! What happened?


    The difference between 9 and a gilad, is that “gilad” is a text (or as Javascript
    like to call it: a “string”). And 9 is just a number.


    The thing is, javascript could easily think that gilad may be just another variable,
    and because it could be a variable, it''s trying to look for it in the *entire*
    page, and when it couldn’t find it, it just says… “Oh Well, alright… I did my
    best, I cannot find it anywhere… So I’ll just do nothing and relax… ” (giving
    up early, huh?)


    To say explicitly to Javascript that we have a string here, we need to wrap our
    text inside of quotation mark.


    Let’s do that:


    var name = “gilad”;


    document.write(name);


    Save it, refresh it, and… yeah baby! We’ve still got it!


    So now we know that we have two different types of variables.


    Numbers, and strings.


    And the difference between them is that little quotation mark.


    We have a few more types of variables in javascript, and we will cover them in
    later lectures.


    ### Chapter 9


    Using different types of var


    Did you know that Javascript can make your homework?


    If I knew that, I would study Javascript at age 5!


    Here’s an example:


    document.write(3 + 3);


    That could come handy in first grade, don’t you think?


    Hmm… let’s try something…


    I’ll declare two vars, the first one I will name num1 and set it to 4, and then
    second one, I will name num2, and set it to the number 2.


    Now in the document.write, I will replace the 3+ 3 into num1 + num2, and run it.


    var num1 = 4;


    var num2 = 2;


    document.write(num1 + num2);


    Alright… we’ve got 6\. Awesome! We’ve learned something new! We can actually add
    variables together! Imagine the possibilities!


    But I wonder what would happened if I would change … say… 4, into “4” , you know,
    as a string…


    Alright, let’s put our mad scientist goggles and try it out:


    var num1 = “4”;


    var num2 = 2;


    document.write(num1 + num2);


    Oh, that’s weird… 42?


    I mean, I know the answer to life, the universe and everything is 42, but … I
    didn’t ask that…


    Let’s see what happened:


    First, we typed num1, equals to 4\. But since we have our quotation mark around
    4, it would be considered as “string” and not as number. So our browser merely
    printed 4 on the screen. And then, we added 2\. But since our 4 is only a string,
    our browser didn’t thought it’s a math problem, and just added it to the screen,
    as is…


    So we could easily replace 4 to “I love you “


    And if we will refresh the page, we can see that your browser loves you 2.


    Browser!!! Silly you….


    ### Chapter 10


    Math operators


    In math, we have 4 basic operations that you can make.


    Addition, subtraction, multiplication, and division.


    In the last lecture, We’ve already seen that we can add numbers in javascript.


    var num1 = 4;


    var num2 = 2;


    document.write(num1 + num2);


    But apart from basic addition, we’ve got another math operation in Javascript.


    Let’s take a take a look at the rest of them.


    We have got subtraction:


    var num1 = 4;


    var num2 = 2;


    document.write(num1 - num2);


    You simply make the minus sign.


    If you want to multiply numbers, don’t write the x letter or something like that,
    simply write star instead:


    var num1 = 4;


    var num2 = 2;


    document.write(num1 * num2);


    That’s Multiplication.


    We can divide numbers as well.


    All you need to do, is to type a forward slash.


    var num1 = 4;


    var num2 = 2;


    document.write(num1 / num2);


    So that’s division.


    Now I’ve got a bonus for ya!


    Let’s say you want to increment a number by one.


    So… of course… you can type something like that… :


    var num1 = 4;


    document.write(num1 + 1);


    But! If you are a lazy person like myself, you can shorthand and do that: !


    var num1 = 4;


    document.write(num1++);


    Or something like that if we want a number to be decreased:


    var num1 = 4;


    document.write(num1--);


    The plus plus (++) sign (and also the minus minus), will increment or… decrement?
    (Can we say decrement?!) your number by one. It’s short and dandy, and we will
    also see that a lot in our future, when we will encounter more complex stuff on
    Javascript!


    ### Chapter 11


    Functions


    Here’s a True story:


    When I first came out from my parents’ house, I had a… well… a… little tiny… Really…
    mini-ti… tiny-problem.


    Well, you see? I *hate* cleaning, and when I first came out from my parents’ house,
    nobody was cleaning after me (ahh!!! The horror!). So after a day or two, I had
    tons of dishes in my sink, my clean cloths blend perfectly with my dirty clothes
    on my bed, my floor was completely a mess, and my two cats didn’t really help
    (meow!).


    So the first thing I’ve done, is to get me one those robots who clean the floor
    after you.


    A perfect solution for the lazy man in our era.


    And I was very glad! It was a repetitive task, that I could have done myself for
    many times, that some sort of… robot: is doing it for me!


    So if we go to our world of Javascript, you may already think that there is a
    possibility to code the SAME code over and over again…


    And if you are lazy like me… well… you will need to figure out how to make yourself
    a new robot!


    To this robot, the Javascript-people called “*Function*”s.


    Instead of writing the same code over and over again, your *Function* will basically
    store a segment of your code, and when you would like to execute it, you can call
    it, and the function will run.'
