    ## 第 1 章：为什么要学习 Javascript？


    你是否曾坐在家里舒服的沙发上想过：


    - 为什么要用 Javascript？

    - 它能为我做什么？

    - 为什么大家都在讨论它？

    - 而且，我的客厅室里大象在做什么？


    如果这种情况发生在你身上，请立刻摸摸你的新大象。而且，和我一起学习更多 Javascript 知识吧。实话，Javascript 真的非常酷！你可以为你的网站添加逻辑，使其更具互动性，并由于这些逻辑操作你的
    `HTML` 和 `CSS`！


    但如果你认为“酷”是 Javascript 的唯一特性，那么你就错了，因为 Javascript 也相对较简单，而且它是目前最流行的框架的基础，例如 `angular.js`、`react.js`、`backbone.js`、`knockout`，甚至还有优秀的
    `JQuery`。无论你在 Web 开发世界的何处行走，你都会看到 Javascript 的足迹。


    ## 第 2 章：什么是 Javascript？


    这里有一个人叫 Bob。Bob 有眼睛、耳朵、鼻子、嘴巴……他有一个身体，还有一些衣服……但直到他有一个大脑让这一切运作在一起，否则他只是一堆连接在一起的器官。


    就像我们奇怪但可爱的 Bob 一样，你一定知道 `HTML` 并构建巨大的网站。你还可以用你惊人的 `CSS` 技能装饰和样式化你的网站。Javascript
    是 Web 的编程语言。它是我们的大脑，让一切保持联系。所以我很高兴你在这里。让我们开始吧。


