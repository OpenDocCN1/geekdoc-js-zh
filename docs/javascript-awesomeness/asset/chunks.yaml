  raw: 'Like I always say, Let’s see some example, and you will understand it better:


    Let’s say we want to have a function that will congratulate us everytime we enter
    our website.


    So, in order to write a function, all you need to write is….


    “*function”*!


    So go ahead, and write function, and then your name of the function, and just
    like your variables, you can name it whatever name you want, but it’s a good practice
    to go with a meaningful of what your function needs to do. So if we want to congratulate
    your users, let’s call it “Congrats”.


    And then after the name, we need to open parenthesis, and close parenthesis (by
    the way, those parenthesis’ are actually have a meaning, but for now, just leave
    it without anything inside).


    Then open curly bracket and close curly brackets. And inside the curly brackets
    we will type our code that we want to be execute when we call the function.


    function Congrats(){


    //….javascript “congrats” code …


    }


    We want our code to congratulate our users, so let’s write something on alert…
    Let’s see…


    “Welcome to the ‘hamster-mobile’ website. Where you can find a cheap vehicle to
    your beloved hamster… “


    Well, I think we know what our next start-up would be, right? I hope we don''t
    have any competition… hmm…


    I have to check this one…


    Oh… man… I cannot believe it!


    Apparently there *IS* a hamster-mobile… ohhh… my dreams just shuttered like windows
    8…


    How can I recover from this one?


    Anyway…


    Let’s also add a bit of code that tell us our congratulation alert has just been
    started. And also one text that our congrats just ended.


    Let’s run our thing!


    Nothing shows! I wonder why?


    That’s because we set our function, but we didn’t call it, right?


    So let’s call it. Just type anywhere outside of your function, your name of your
    function, and then open parenthesis and close parenthesis. And then end with semicolon:


    function Congrats(){


    document.write(“starting congratulations… ”);


    alert(“Welcome to the hamster-mobile website.


    Where you can find a cheap vehicle to your beloved


    hamster… “);


    document.write(“ending congratulations… ”);


    }


    Congrats();


    Save it, refresh your page, and… BAM! We’ve got our weirdly congratulations up
    and running!


    Now every time you want to use this thing, we wouldn’t need to write our document
    write again, and our alert… And another time the document.write… We just need
    to call our Congrats function again, and that’s it!


    Congrats();


    Congrats();


    ### Chapter 12


    Functions Parameters


    Do you know that game show call “Let’s make a deal”, that do you have 3 curtains,
    and you suppose to guess which curtain has the brand new shiny car and which one
    has like a living adult llama?


    I always wondered if they actually have to take the llama afterwards… And feed
    it, cleaning after it, be best friend with it… Even if they are allergic to that
    llama, but they don’t feel safe enough because that Llama is a vicious Llama…


    Anyway…


    Today we will have the Javascript version of the show “Let’s make a deal”!


    First, we will have 3 inputs, typed button. Each and every one of them, will represent
    a curtain.


    Curtain 1 , curtain 2 and curtain 3.


    <input type=”button” value=”Curtain 1” />


    <input type=”button” value=”Curtain 2” />


    <input type=”button” value=”Curtain 3” />


    Now let’s make room to our function:


    Create a new function called ShowCurtain, but instead of leaving the parenthesis
    orphaned, type prize. (don’t worry, we will explain everything in a moment, just
    let me finish up this function…)


    Now we will write inside of the function an alert, with “you won” message, and
    also, the same prize that we have inside of our parenthesis.


    function ShowCurtain(prize){


    alert(“You won” + prize);


    }


    Alright, let’s explain what is that prize thingy…


    Whatever we have in our parenthesis, called “*parameter*”, and our *parameter*
    is actually acting like a dynamic variable…


    That means, when we will call our function, we will set the parameter in our parentheses
    just like we set every variable… And then, our parameter will live and be used
    as long as the function is running.


    Alright, so let’s try something new, ey?


    Instead of calling our function the last time, we can call it when our button
    is being clicked.


    So add to each button an attribute called “onclick”, and set it to your function,
    and remember, our function asks for a prize parameter, so set it to whatever prize
    you want to get. And because we already use a double quotation mark for our HTML
    attribute, use single quotation mark instead to wrap our string… That should work.


    <input type=”button” value=”Curtain 1” onclick=”’a shiny brand new tooth pick!’”
    />


    <input type=”button” value=”Curtain 2” onclick=”’a colorful rubber band’” />


    <input type=”button” value=”Curtain 3” onclick=”’a living Llama!’” />


    Alright, save it, refresh your page, and let’s try to see what we’ve got here:


    Let’s open our curtain number 1… Its… its… yes!!! A shiny brand new tooth pick!
    very handy… very handy…


    …Now curtain number 2… The crowd roar with enthusiasm… it’s… oh my! A colorful
    rubber band!!! Cannot wait to use it!


    Now… curtain number 3… what it would be? oh my!!! I cannot believe it… my all-time
    favorite! A living llama!!! who would feed this animal!?


    I cannot believe it… What a wonderful day…


    Javascript function parameters??? and a living Llama?! What more can an instructor
    ask for?!


    ### Chapter 13


    Multiple Parameters


    Sometimes, you can have functions, that can hold parameters, but you will need
    to add another parameter as well.


    In our last example, we had one parameter that asked the prize money, and we had
    a message that tells the user what prize that he won, but what if we want to add
    another information, like, what curtain number the user just opened?


    If we would like to achieve this kind of task, we can add another parameter to
    our parenthesis.


    Just add a comma, and type the extra parameter name you want to add.


    For example, to make our message cooler, we will add another parameter called
    curtainNumber , and then prompt in our message “You opened curtain number ” and
    then we will have our parameter, and we will continue our text with what he won
    like we have done in the last example:


    function ShowCurtain(curtainNumber, prize){


    alert(“You opened curtain number ”+ curtainNumber + “, You have won” + prize);


    }


    Now we will add the different curtain numbers to our buttons, so the parameter
    knows how to be set up.


    onclick=” 1, ’a shiny brand new tooth pick!’ ”


    But note that the order of the parameter is important, if we have our curtainNumber
    the first parameter, we will need to set it first as well…


    Alright, let’s test our curtains!


    Works!


    yay!


    ### Chapter 14


    Return Statement


    In the previous lectures we talked about functions and our functions just did
    something, right?


    We print things on the screen, press one button and a message popped out, stuff
    like that…


    But in some cases you want your function to return some value, so you could use
    it later.


    That''s why we have our return statement.


    Let’s have an example:


    Write a function called BasicAddition, that request 2 parameters, num1 and num2.
    It will return the addition of both of them.


    function BasicAddition(num1,num2){


    return num1 + num2;


    }


    Now we will call the function, and we will place the parameters 1 and 2\. And
    we will expect to get the number 3 be out, right?


    BasicAddition(1, 2);


    If we will run it right now, nothing will show.


    And this is because we didn’t tell our function to do anything with it. It didn’t
    print, and didn’t even store it anywhere.


    Let’s make a new variable, called result. And we will get the result right out
    of our BasicAddition function. And then, we will print result to the page.


    var result = BasicAddition(1, 2);


    document.write(result);


    Let’s save it and refresh it, and… bam! We’ve got it!


    We return the result of the number we added, we stored it on a variable called
    result, and then, we used the variable called result, and print it on the page.'
