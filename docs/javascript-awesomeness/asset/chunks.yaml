    \ Javascript has different types of variables. And they cannot fit everywhere…\n\
    \nLet me explain it to you by first writing it down in our text editor:\n\nI will\
    \ write `var`, `name`, equals to 9:\n\n```javascript\nvar name = 9;\ndocument.write(name);\n\
    ```\n\nThat’s what we’ve done in the last lecture, right?\n\nWe have a variable\
    \ named `name`, and it’s equal to the number 9.\n\nBut, my name is not nine, right?\
    \ (I swear it’s doesn’t!)\n\nLet’s try to erase the number nine, and place my\
