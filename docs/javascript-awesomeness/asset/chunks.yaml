  trans: "\n\n我们不知道的是，数组中的每一个元素都有一个秘密索引数字，而且它不是从一开始，而是从零开始。\n\n所以 Big Tony 的索引是 0，Amazing\
    \ Bob 的索引是 1，Cool Jeff 的索引是 2，而 Awesome Jane 的索引是 3。\n\n所以为了访问 amazing Bob，我们需要输入索引\
    \ 1，对吧？\n\n为了实现这一点，我们将打开方括号并输入 1。\n\n让我们试试看。\n\n```javascript\ndocument.write(names[1]);\n\
    ```\n\n搞定，amazing Bob 就在那儿。\n\n如果我们想……在屏幕上打印出 Awesome Jane…… 看看她的索引是多少…… 0, 1,\
    \ 2, 3。\n\n3 是 Jane 的索引，我们把这里改成 3：\n\n```javascript\ndocument.write(names[3]);\n\
    ```\n\n我们拿到了 Jane 了！\n\n现在我们来玩点花哨的！假设我们的用户 Awesome Jane 决定把她的名字改为 Tammy。\n\n在这种情况下，我们将编写\
    \ `names[3]` 来访问她的名字，然后对其进行赋值，就像设置一个新变量“Tammy”一样，让我们再添加另一个 `document.write`，看看它确实随着时间发生了变化。\n\
    \n```javascript\nvar names = new Array(“Big Tony”, “Amazing Bob”, “Cool Jeff”,\
    \ “Awesome Jane”);\ndocument.write(names[3] + “<br/>”);\nNames[3] = “Tammy”;\n\
    document.write(names[3] + “<br/>”);\n```\n\n没错。搞定了！\n\n## 第 21 章：数组技巧\n\n好了！我们还有几几个关于数组的技巧了！\n\
    \n我们可以使用 `push` 方法添加一个新项。\n\n假设我们想再添加两个名字，例如…… Martha 和 George。\n\n```javascript\n\
    names.push(“Martha”, “George”);\ndocument.write(names + “<br/>”);\n```\n\n看看我们是否成功了……是的！\n\
    \n我们还可以按照字母顺序对其进行排序…… 使用 `sort` 方法……\n\n```javascript\nnames.sort();\ndocument.write(names\
    \ + “<br/>”);\n```\n\n让我们看看……是的！排序好了！！！\n\n我们还可以……反转所有内容！\n\n```javascript\nnames.reverse();\n\
    document.write(names + “<br/>”);\n```\n\n让我们刷新一下看看我们得到了什么……是的！还在那里！\n\n## 第 22\
    \ 章：强化版 Javascript\n\n好了，到为止，我们学习了很多酷炫的东西，但现在是时候提升一个层次了。\n\n我会写一些高级的内容，所以请耐心听，好吗？好了……\n\
    \n你们知道那些电影吗，里面有一个反派，他抓了汤姆·克鲁主演的英雄，手里拿着……一颗炸弹……如果不输入正确的密码组合，所有人都会死……？\n\n嗯，今天我们将扮演那个反派，去制造这个提示密码的机器，我们将知道密码是否有效！\n\
    \n所以，让我们在 HTML 上构建一些东西吧……\n\n```html\n<div=”sendItem”>\n  <form>\n    Password:\
    \ <br/>\n    <br/>\n    <input type=”password” id=”password” placeholder=”password”\
    \ />\n    <br/>\n    <input type=”button” id=”submit” value=”send!” />\n  </form>\n\
    </div>\n```\n\n让我们给它美化一下，毕竟，这是一个特殊的场合！\n\n```css\n<style>\n#sendItem{\n  background-color:\
    \ red;\n  width: 200px;\n  margin: 30px;\n  padding: 30px;\n}\n</style>\n```\n\
    \n现在我们将有一个函数，并将其命名为 `CheckValidation`，它将……检查密码组合的有效性……当然了……\n\n在我们的函数内部，我们将有一个名为\
    \ `password` 的变量，它最终将获得 id 为 `password` 的输入类型元素的值，让我们写下 `document.getElementById.value`。\n\
    \n因此在 `password` 内部，我们存储了输入标签的值。\n\n然后我们有一个 `if` 语句，用来检查我们的组合是否正确，所以我们将写 `password`\
    \ 不等于…… 让我们看看……什么样的组合是连五角大楼也无法破解的？？…… 噢！1234。这可以了（意为：这个就行了）。\n\n```javascript\n\
    var password = document.getElementById(“password”).value;\nif(password != “1234”){\n\
    \  alert(“Caution! Password is Incorrect!”);\n}else{\n  // 成功！\n}\n```\n\n好了，让我们把函数绑定到按钮上，使用\
    \ `onclick`……\n\n```html\n<input type=”button” id=”submit” value=”send!” onclick=”CheckValidation()”\
    \ />\n```\n\n让我们检查一下如果我们输入内容，它是否会显示错误……是的！！！确实显示了！酷！\n\n现在……注意我们有一个“发送”按钮…… 所以……我们必须把表单发送到某个地方，对吧？让我给我们的样式标签里添加一些花招……\n\
    \n```css\n<style>\n#sendItem{\n  background-color: red;\n  width: 200px;\n  margin:\
    \ 30px;\n  padding: 30px;\n  transition: 3s all;\n  left:0;\n}\n.leftTrans{ left:\
    \ 3000px !important; }\n</style>\n```\n\n我添加了另一个名为 `leftTrans` 的类，并对我们的 `sendItem`\
    \ id 添加了更多修改…… 现在，当我们密码组合成功后，表单将发送给我们，反派们！让我们在 `else` 语句中添加 `var y`，它将获取 `sendItem`\
    \ 的 id，所以我们将访问 `sendItem` 元素…… 现在，我们将获取变量 `y` 并添加一个名为 `leftTrans` 的类。\n\n```javascript\n\
    else{\n  var y = document.getElementById(“sendItem”);\n  y.className += “leftTrans”;\n\
    }\n```\n\n让我们尝试只失败一次……我们得到了消息…… 再次用我们强大的密码 1234 试试…… 哦！我们发送了表单！谁知道去到哪里了？！也许是火星。\n\
    \n## 第 23 章：现在怎么办？\n\n恭喜！你完成了这个课程，你在书中听了很多很冷笑话，我为你感到自豪！你可能会问自己：现在，我完成了第一个 Javascript\
    \ 课程，我该怎么办？我该如何提高我的 Web 开发技能？\n\n嗯，我的小学徒，现在是时候将你的 Javascript 技能与服务端结合了。\n\n我确实有一个为你准备的\
