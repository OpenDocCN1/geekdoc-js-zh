    ### Chapter 4: How to set up your page


    Alright Alright Alright!!! You are already sold about learning Javascript, you
    are supposed to be set with your `Notepad++`, and you want to start coding Javascript,
    right?


    Before you do, you need to set up your page:


    In order to do so, all you need to do, is to write inside of your `head` tag,
    a tag named `script`. Like that:


    ```html

    <!DOCTYPE>

    <html>

    <head>

    <script type="text/javascript">

    #… JAVASCRIPT CODE… #

    </script>

    </head>

    <body>

    </body>

    </html>

    ```

    Wait, the original text had `body` tags empty.


    Inside of the `script` tag, we will have an attribute called `type/javascipt`,
    that tells the browser we are having a javascript typed script.


    Inside of that tag, you will write your Javascript code!


    ### Chapter 5: Simple alert, write to document


    OMG OMG OMG!!! I’m so excited!!! … just like a baby trying to walk its first steps,
    you are about to write your very first javascript code.


    And it’s going to contain …*DrumsRoll*… Printing a fluffy red goat!


    Why printing a fluffy red goat, you ask?


    Because there is nothing more suspicious than walking down the street and see
    a person printing goats just for the sake of printing goats. That is red… and…
    also fluffy.


    And that’s the kind of things we want to be associate with, these days. Leather
    jackets and a fluffy red goat.


    So… how are we gonna print our fluffy red goat into our screen?


    All you need to do is to print document, follow by a dot, and then type the word
    `write`.


    Right after that, you will have to open parentheses `(` and close parentheses
    `)`. . inside of these parentheses, we will have quotation marks.


    And in the quotation marks, we will write down “I’m printing a fluffy red goat…
    ”. Because… that’s what we do.


    And in the end, just like any language, if we want to end a sentence, you will
    write a dot, right?


    But in javascript, we are writing a semicolon `;`.


    ```javascript

    document.write(“I’m printing fluffy red goat… ”);

    ```


    We will save our file, and refresh our page and. Oh my! We just printed our very
    own fluffy red goat!


    Ah! Hack! That’s too good to be a singular event! Let’s print *more* of these!


    ```javascript

    document.write(“I’m printing fluffy red goat… ”);

    document.write(“I’m printing fluffy red goat… ”);

    document.write(“I’m printing fluffy red goat… ”);

    document.write(“I’m printing fluffy red goat… ”);

    ```


    Yay…… We are having lots of fluffy goats….!


    OK OK!!! … Now we want to warn everybody, before we are printing our goats, to
    watch out! Fluffy red goats are on the loose! Preferably with annoying pop up
    on the screen!


    So we will write down `alert`, and then we will open parentheses, and inside our
    parentheses, we will have double quotation marks as well, and then we will write
    “watch out! Red fluffy goats are on their way!”


    And we will close our statement with a semicolon, as usual.


    ```javascript

    alert(“watch out! Red Fluffy goats are on their way! ”);

    ```


    Now save your document and refresh the page, and… oh! I am very impressed by your
    sort-of-a-road-sign thingy, warning everybody about what could be… the end of
    time!


    By the way, did you see that we place our `alert` before the `document.write`,
    and refreshed the page, the alert showed first, but you didn’t see the any of
    the text on your document just yet.


    That’s because javascript is operate as a queue. First in the first statement,
    then the second one… And so on!


    Now you know all about writing and printing in your document, *and* all about
    annoying popups! As well as all about fluffy red goats.


    In the next chapter I’ll show you how to write comments.


    ### Chapter 6: Comments


    Ssshhh!!! I have to tell you a secret.


    Yesterday, I went to a fortune teller! I sat on the chair, and then she approaches
    me and said; “awww… My dearly beloved almighty, awesomely humble Gilad… I have
    to tell you something about your students…”


    And you know me, I care a big deal about my young padawans, so I asked… “what?”


    So she told me; ”In the near future, they will be working on something…”


    (Wait, the text is a bit garbled here, I will keep the core meaning).


    Actually, looking at the text provided:

    ...In so, this line is tasty chicken! P.S, this code is working.


    So now you know why you need comments, but how can we do that?


    Simply write inside of your script tag two slash, and start typing! Like that:


    ```javascript

    // Hey Jeff!… Sorry about your computer

    ```


    Save it, Refresh it, and… It’s a miracle! Now only me and colleague Jeff would
    know about our incident.


    But what about if I want to leave multi-line comment about what I ate for dinner…
    the list of I’m allergic to… and why I laugh like a crazy person when it rains?


    So in that case we would have one slash, followed by star. We write whatever we
    want to write, and then close it with star, and… another slash.


    ```javascript

    /* Hey Jeff,


    Thanks for the present for christmas,


    however I feel like We are not in that phase


    of our relationship to sending each other


    Parking tickets.


    P.S. : This code is not working.


    P.S.S : we are out of milk. So get one. thanks! */

    ```


    Hopefully, you would not work with Jeff, because he is a handful… But if you would
