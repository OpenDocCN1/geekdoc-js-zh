    \ + num2);\n```\n\nOh, that’s weird… 42?\n\nI mean, I know the answer to life,\
    \ the universe and everything is 42, but … I didn’t ask that…\n\nLet’s see what\
    \ happened:\n\nFirst, we typed `num1`, equals to 4. But since we have our quotation\
    \ mark around 4, it would be considered as “string” and not as number. So our\
    \ browser merely printed 4 on the screen. And then, we added 2. But since our\
    \ 4 is only a string, our browser didn’t thought it’s a math problem, and just\
    \ added it to the screen, as is…\n\nSo we could easily replace 4 to “I love you\
    \ “\n\nAnd if we will refresh the page, we can see that your browser loves you\
    \ 2. \n\nBrowser!!! Silly you….\n\n### Chapter 10: Math operators\n\nIn math,\
    \ we have 4 basic operations that you can make.\n\nAddition, subtraction, multiplication,\
    \ and division.\n\nIn the last lecture, We’ve already seen that we can add numbers\
    \ in javascript.\n\n```javascript\nvar num1 = 4;\nvar num2 = 2;\ndocument.write(num1\
    \ + num2);\n```\n\nBut apart from basic addition, we’ve got another math operation\
    \ in Javascript.\n\nLet’s take a take a look at the rest of them.\n\nWe have got\
    \ subtraction:\n\n```javascript\nvar num1 = 4;\nvar num2 = 2;\ndocument.write(num1\
    \ - num2);\n```\n\nYou simply make the minus sign.\n\nIf you want to multiply\
    \ numbers, don’t write the x letter or something like that, simply write star\
    \ instead:\n\n```javascript\nvar num1 = 4;\nvar num2 = 2;\ndocument.write(num1\
    \ * num2);\n```\n\nThat’s Multiplication.\n\nWe can divide numbers as well.\n\n\
    All you need to do, is to type a forward slash.\n\n```javascript\nvar num1 = 4;\n\
