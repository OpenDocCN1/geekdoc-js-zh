  trans: "\n而且我们将像往常一样用分号结尾它。\n\n```javascript\nvar gilad = 9;\n```\n\n现在你已经知道如何在页面上打印内容了，还记得我们那只毛茸茸的红羊吗？\n\
    \n```javascript\ndocument.write“I’m printing fluffy red goat… ”);\n```\n\n所以删掉里面的文本，直接写你的变量名（不需要引号！）。\n\
    \n```javascript\ndocument.write(gilad);\n```\n\n保存并刷新。\n\n我的天哪，羊啊！我们在屏幕上看到了一个\
    \ 9！\n\n让我们来解释一下刚才发生了什么：\n\n你的浏览器在心里想：“噢，好吧，了棒超级酷炫的 Web 开发者！你想让我设置一个变量，然后你把这个变量命名为\
    \ `gilad`。那么我会在我的房间里为你专门留一个地方……从现在起，我会把那个地方命名为 `gilad`……” \n\n然后我们写了等号……这意味着你把它设置为了等号右侧的任何内容。\n\
    \n也就是 9。\n\n于是电脑说：“好的，我现在将把 9 存储在我那个叫 `gilad` 的地方。我向你保证，无论你让我怎么用它，我都会使用的……”\n\n\
    当我们在 `document.write` 内部调用 `gilad` 变量时，电脑获取了该值，并将其打印在文档中。\n\n噢，还有一件事……你记得我告诉过你关于变量名的吗，你可以随心所欲地命名它……好吧……你可以的。\n\
    \n但你有两条规则*必须*遵守的，好吗？\n\n### 规则一\n\n永远不要写像那样古怪的东西：`#5^$%^^$`。你的浏览器会疯掉的，并且不知道你的那个名字是什么意思！你只能用字母、数字和下划线来调用你的变量。\n\
    \n### 规则二\n\nJavascript 是一种区分大小写的语言，所以不要把你的变量写成全小写的 `jeffery`，之后又像个疯子一样把它改成 `JeFferY`。对于浏览器来说，这就像是你叫一个女孩“Hillary！”，然后切换到“嘿\
    \ Brittney！怎么样，Brit…我的意思是…Doris!…Doris!!! Jenni… Bath!…Elizab… Doris!!! Doris……”\n\
    \n是吧……所以别那样做……除此之外，你是安全的！\n\n### 第 8 章：变量类型\n\n你还记得你还是婴儿的时候，玩过那种奇怪的形状的游戏，你需要对那些形状进行分类并将每个形状放在它的位置上吗？\n\
    \n就像那个游戏一样，Javascript 有不同类型的变量。它们不能放在任何地方……\n\n让我先通过在我们的文本编辑器中写下来来给你解释：\n\n我会写\
    \ `var`、`name` 等于 9：\n\n```javascript\nvar name = 9;\ndocument.write(name);\n\
    ```\n\n这是我们在上一节课中做的，对吧？\n\n我们有一个名为 `name` 的变量，它等于数字 9。\n\n但是，我的名字不是“九”，对吧？（我发誓它真的不是！）\n\
    \n让我们尝试删掉数字 9，换成我的名字。\n\n```javascript\nvar name = gilad;\ndocument.write(name);\n\
    ```\n\n保存，刷新，让我们看看这里有什么……\n\n啊！什么都没有显示！发生了什么？\n\n9 和 `gilad` 之间的区别在于，“gilad”是一个文本（或者用\
    \ Javascript 喜欢的称呼：“字符串” string），而 9 只是一个数字。\n\n问题是，javascript 很容易认为 `gilad` 可能只是另一个变量，因为它可能是一个变量，所以它正尝试在*整个*页面中寻找它，当它找不到时，它就说……“噢，好吧……我已经尽力了，我在任何地方都找不到它……所以我就什么都不做，放松一下吧……”（早早放弃了，哈？）\n\
    \n要明确告诉 Javascript 我们这里有一个字符串，我们需要把文本包裹在引号内。\n\n让我们那样做：\n\n```javascript\nvar\
    \ name = “gilad”;\ndocument.write(name);\n```\n\n保存，刷新，然后……是的，宝贝！我们还搞定了！\n\n所以现在我们知道我们有两种不同类型的变量。\n\
    \n数字，和字符串。\n\n它们之间的区别就是那个小引号。\n\n在 javascript 中我们还有其他几种类型的变量，我们将在稍后的课程中介绍它们。\n\
    \n### 第 9 章：使用不同类型的 var\n\n你知道 Javascript 可以帮你做作业吗？\n\n如果我早知道，我会在 5 岁就开始学 Javascript！\n\
    \n这里有一个例子：\n\n```javascript\ndocument.write(3 + 3);\n```\n\n这在一年级可能会派上用场，你觉得呢？\n\
    \n嗯……让我们尝试一下……\n\n我会声明两个变量，第一个命名为 `num1` 并将其设置为 4，然后第二个命名为 `num2`，并设置为数字 2。\n\n\
    现在在 `document.write` 中，我将 `3+ 3` 替换为 `num1 + num2` 并运行它。\n\n```javascript\nvar\
    \ num1 = 4;\nvar num2 = 2;\ndocument.write(num1 + num2);\n```\n\n好了……我们得到了 6。太棒了！我们学了新东西！我们真的可以把变量加在一起！想象一下这种可能性！\n\
    \n但我想如果我把……比如……4 变成“4”，你知道的，作为一个字符串的话……\n\n好了，让我们戴上疯狂科学家的眼镜试一下：\n\n```javascript\n\
    var num1 = “4”;\nvar num2 = 2;\ndocument.write(num1 + num2);\n```\n\n噢，这很奇怪……42？\n\
    \n我的意思是，我知道生命、宇宙和万物的终极答案是 42，但是……我没问那个……\n\n让我们看看发生了什么：\n\n首先，我们输入了 `num1` 等于\
    \ 4。但由于我们在 4 周围加了引号，它被视为“字符串”而不是数字。所以我们的浏览器仅仅在屏幕上打印了 4。然后，我们加上了 2。但由于我们的 4 只是一个字符串，我们的浏览器并没有认为这是一个数学题，而是直接原封不动地把它到了屏幕上……\n\
    \n所以我们可以轻松地把 4 替换为“我爱你”\n\n如果我们刷新页面，我们可以看到你的浏览器爱你 2。\n\n浏览器！！！你这个小笨蛋……\n\n###\
    \ 第 10 章：数学运算符\n\n在数学中，我们有 4 种你可以进行的基础运算。\n\n加法、减法、乘法和除法。\n\n在上一节课中，我们已经看到在 Javascript\
    \ 中可以加数字。\n\n```javascript\nvar num1 = 4;\nvar num2 = 2;\ndocument.write(num1\
    \ + num2);\n```\n\n但除了加法，Javascript 中还有其他的数学运算。让我们来看看剩下的。\n\n我们有减法：\n\n```javascript\n\
    var num1 = 4;\nvar num2 = 2;\ndocument.write(num1 - num2);\n```\n\n你只需要使用减号。\n\
    \n如果你想乘数字，不要写字母 x 之类的，直接写星号：\n\n```javascript\nvar num1 = 4;\nvar num2 = 2;\n\
    document.write(num1 * num2);\n```\n\n这就是乘法。\n\n我们也可以除法。\n\n你只需要输入斜杠。\n\n```javascript\n\
    var num1 = 4;\nvar num2 = 2;\ndocument.write(num1 / num2);\n```\n\n这就是除法。\n\n\
    现在我给了你一个奖励！\n\n假设你想让数字增加 1。\n\n所以……当然……你可以这样写：\n\n```javascript\nvar num1 = 4;\n\
    document.write(num1 + 1);\n```\n\n但是！如果你像我一样是个懒人，你可以使用简写：\n\n```javascript\nvar\
    \ num1 = 4;\ndocument.write(num1++);\n```\n\n或者如果我们想减少数字，可以这样做：\n\n```javascript\n\
    var num1 = 4;\ndocument.write(num1--);\n```\n\n加加符号 `++` 符号（还有减减符号 `--`）会让你的数字增加或……减少（我们可以说减少吗？）1。这种写法既简洁又好，我们以后在遇到更复杂的\
    \ Javascript 内容时也会看到很多！\n"
- fmt: "\nLike I always say, Let’s see some example, and you will understand it better:\n\
    \nLet’s say we want to have a function that will congratulate us everytime we\
    \ enter our website.\n\nSo, in order to write a function, all you need to write\
    \ is….\n\n“function”!\n\nSo go ahead, and write function, and then your name of\
    \ the function, and just like your variables, you can name it whatever name you\
    \ want, but it’s a good practice to go with a meaningful of what your function\
    \ needs to do. So if we want to congratulate your users, let’s call it `Congrats`.\n\
    \nAnd then after the name, we need to open parenthesis, and close parenthesis\
    \ (by the way, those parenthesis’ are actually have a meaning, but for now, just\
    \ leave it without anything inside).\n\nThen open curly bracket and close curly\
    \ brackets. And inside the curly brackets we will type our code that we want to\
    \ be execute when we call the function.\n\n```javascript\nfunction Congrats(){\n\
    \n//….javascript “congrats” code …\n}\n```\n\nWe want our code to congratulate\
    \ our users, so let’s write something on alert… Let’s see…\n\n“Welcome to the\
    \ ‘hamster-mobile’ website. Where you can find a cheap vehicle to your beloved\
    \ hamster… “\n\nWell, I think we know what our next start-up would be, right?\
    \ I hope we don't have any competition… hmm…\n\nI have to check this one…\n\n\
    Oh… man… I cannot believe it!\n\nApparently there *IS* a hamster-mobile… ohhh…\
    \ my dreams just shuttered like windows 8…\n\nHow can I recover from this one?\n\
    \nAnyway…\n\nLet’s also add a bit of code that tell us our congratulation alert\
    \ has just been started. And also one text that our congrats just ended.\n\nLet’s\
    \ run our thing!\n\nNothing shows! I wonder why?\n\nThat’s because we set our\
    \ function, but we didn’t call it, right?\n\nSo let’s call it. Just type anywhere\
    \ outside of your function, your name of your function, and then open parenthesis\
    \ and close parenthesis. And then end with semicolon:\n\n```javascript\nfunction\
    \ Congrats(){\n\ndocument.write(“starting congratulations… ”);\n\nalert(“Welcome\
    \ to the hamster-mobile website.\n\nWhere you can find a cheap vehicle to your\
    \ beloved\n\nhamster… “);\n\ndocument.write(“ending congratulations… ”);\n\n}\n\
    \nCongrats();\n```\n\nSave it, refresh your page, and… BAM! We’ve got our weirdly\
    \ congratulations up and running!\n\nNow every time you want to use this thing,\
    \ we wouldn’t need to write our document write again, and our alert… And another\
    \ time the document.write… We just need to call our `Congrats` function again,\
    \ and that’s it!\n\n```javascript\nCongrats();\nCongrats();\n```\n\n### Chapter\
    \ 12: Functions Parameters\n\nDo you know that game show call “Let’s make a deal”,\
    \ that do you have 3 curtains, and you suppose to guess which curtain has the\
    \ brand new shiny car and which one has like a living adult llama?\n\nI always\
    \ wondered if they actually have to take the llama afterwards… And feed it, cleaning\
    \ after it, be best friend with it… Even if they are allergic to that llama, but\
    \ they don’t feel safe enough because that Llama is a vicious Llama…\n\nAnyway…\n\
    \nToday we will have the Javascript version of the show “Let’s make a deal”!\n\
    \nFirst, we will have 3 inputs, typed button. Each and every one of them, will\
    \ represent a curtain.\n\nCurtain 1 , curtain 2 and curtain 3.\n\n```html\n<input\
    \ type=”button” value=”Curtain 1” />\n<input type=”button” value=”Curtain 2” />\n\
    <input type=”button” value=”Curtain 3” />\n```\n\nNow let’s make room to our function:\n\
    \nCreate a new function called `ShowCurtain`, but instead of leaving the parenthesis\
    \ orphaned, type `prize`. (don’t worry, we will explain everything in a moment,\
    \ just let me finish up this function…)\n\nNow we will write inside of the function\
    \ an alert, with “you won” message, and also, the same prize that we have inside\
    \ of our parenthesis.\n\n```javascript\nfunction ShowCurtain(prize){\n\nalert(“You\
    \ won” + prize);\n}\n```\n\nAlright, let’s explain what is that prize thingy…\n\
    \nWhatever we have in our parenthesis, called “parameter”, and our parameter is\
    \ actually acting like a dynamic variable… \n\nThat means, when we will call our\
    \ function, we will set the parameter in our parentheses just like we set every\
    \ variable… And then, our parameter will live and be used as long as the function\
    \ is running.\n\nAlright, so let’s try something new, ey?\n\nInstead of calling\
    \ our function the last time, we can call it when our button is being clicked.\n\
    \nSo add to each button an attribute called `onclick`, and set it to your function,\
    \ and remember, our function asks for a prize parameter, so set it to whatever\
    \ prize you want to get. And because we already use a double quotation mark for\
    \ our HTML attribute, use single quotation mark instead to wrap our string… That\
