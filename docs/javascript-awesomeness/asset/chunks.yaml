- fmt: "\n# Chapter 15\n\n## Calling function from another function\n\nOk so you already\
    \ know how to write a function, and how to write a parameter for this function,\
    \ and even multiple parameters, and even… (God forbid!), a return statement for\
    \ this function!\n\nNow I’ll show you a little trick that will come handy one\
    \ day…\n\nYou can actually call a function… within a function!\n\nLet’s try it\
    \ out, create a function called `GoodNight`, and another function called `GoodMorning`.\
    \ Without taking any parameters.\n\nInside of the `GoodNight` function we would\
    \ have `document.write`, and we will say “Good night!” and in the `GoodMorning`\
    \ function, you guessed it right, we will type “Good morning!”\n\n```javascript\n\
    function GoodNight(){\n  document.write(“Good Night!”);\n}\n\nfunction GoodMorning(){\n\
    \  document.write(“Good Morning!”);\n}\n```\n\nAnd now we will have another function,\
    \ called `Start`, it and we will call both functions from the `Start` function.\n\
    \n```javascript\nfunction Start(){\n  GoodMorning();\n  GoodNight();\n}\n```\n\
    \nRight now, if we will refresh our page, nothing will happen, because although\
    \ we called `GoodMorning` and `GoodNight`, we have not initiate the `Start` function.\
    \ Only when we will call the `Start` function, we will see stuff going on.\n\n\
    Let’s do that!\n\n```javascript\nStart();\n```\n\nSee? When we started `Start`\
    \ function, we run also both functions within it.\n\nNow let’s try to break our\
    \ browser apart. (don’t try it at home! Nahh… kiddin’. You can!)\n\nWe will take\
    \ the `GoodMorning` function, and place it within the `GoodNight` function, and\
    \ vice versa, and then we will call `start` by telling it to call `GoodMorning`.\
    \ (and for the sake of readability, add a `br` tag to each write statement.\n\n\
    We will expect the browser to go to `GoodMorning` and say good morning, and then\
    \ go to `GoodNight` and say “good night!”. And then back to good morning, good\
    \ night, good morning, good night good morning, good night good morning… He supposed\
    \ to get inside of some sort of a limbo… leaving its wife and its children… And\
    \ even its own sanity!\n\n```javascript\nfunction GoodNight(){\n  document.write(“Good\
    \ Night! <br/>”);\n  GoodMorning();\n}\n\nfunction GoodMorning(){\n  document.write(“Good\
    \ Morning! <br/>”);\n  GoodNight();\n}\n\nfunction Start(){\n  GoodMorning();\n\
    }\n\nStart();\n```\n\nLet’s refresh it, and… oh… wow… Better than fireworks!\n\
    \n# Chapter 16\n\n## If statement\n\nBefore I wanted to be a web developer, I\
    \ always wanted to be a hamster-tamer.\n\nYou know, just like a lion tamer that\
    \ works with lions… But… with hamsters.\n\nYou suppose to tame them, so they can…\
    \ do stuff.\n\nAnyway, sometimes I wonder what if I was going with my dream.\n\
    \nAnd to make this thought come true, I will use my javascript skills!\n\nIn Javascript,\
    \ you can have conditions in your code.\n\nFor example:\n\nIf `x` is true, then…\
    \ execute this code.\nIf `x` is false… Then… do that code.\nIf `x` is greater\
    \ than `y`, then run those functions…\n\nLet’s make it happened!\n\nTo write an\
    \ `if` statement, you should type `if`, then open parenthesis, and then inside\
    \ of those parenthesis you should write your condition.\n\nThen you should open\
    \ curly brackets, and inside of those curly brackets, your code will be execute,\
    \ only if the condition is true.\n\n```javascript\nif(##YOUR CONDITION HERE##){\n\
    \  ##YOUR CODE HERE##\n}\n```\n\nSo let’s say we want to check if the number 2\
