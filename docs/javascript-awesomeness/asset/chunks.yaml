  trans: "\n\n# 第 15 章\n\n## 从另一个函数调用函数\n\n好了，你已经知道如何编写一个函数了，如何为这个函数编写参数，甚至是多个参数，甚至……（保佑天哪！）为这个函数写一个返回语句了！\n\
    \n现在我要向你展示一个小小的技巧，它有一天会派上用场……\n\n你实际上可以在……函数内部……调用另一个函数！\n\n让我们试一下，创建一个名为 `GoodNight`\
    \ 的函数，以及另一个名为 `GoodMorning` 的函数。不需要接受任何参数。\n\n在 `GoodNight` 函数内部，我们将使用 `document.write`，并输出“Good\
    \ night!”；而在 `GoodMorning` 函数中，你猜得没错，我们将输入“Good morning!”。\n\n```javascript\n\
    function GoodNight(){\n  document.write(“Good Night!”);\n}\n\nfunction GoodMorning(){\n\
    \  document.write(“Good Morning!”);\n}\n```\n\n现在我们又会有另一个名为 `Start` 的函数，我们将在 `Start`\
    \ 函数中调用这两个函数。\n\n```javascript\nfunction Start(){\n  GoodMorning();\n  GoodNight();\n\
    }\n```\n\n现在，如果我们刷新页面，什么都不会发生，因为虽然我们调用了 `GoodMorning` 和 `GoodNight`，但我们还没有启动 `Start`\
    \ 函数。只有当我们调用 `Start` 函数时，才会看到事情发生。\n\n让我们这样做吧！\n\n```javascript\nStart();\n```\n\
    \n看到了吧？当我们启动 `Start` 函数时，我们也运行了它内部的两个函数。\n\n现在让我们尝试把浏览器搞崩溃。（不要在家里尝试！不不……开玩笑的。你可以试的！）\n\
    \n我们将 `GoodMorning` 函数放在 `GoodNight` 函数内部，反之亦然，然后通过告诉它调用 `GoodMorning` 来调用 `start`。（为了可读性，请在每个\
    \ write 语句中添加一个 `br` 标签）。\n\n我们预期浏览器会进入 `GoodMorning` 并说早安，然后进入 `GoodNight` 并说“晚安！”。然后回到早安，晚安，早安，晚安早安，晚安早安……它应该陷入了某种\
    \ limbo 状态之中……抛弃了它的妻子和孩子……甚至还有它自己的理智！\n\n```javascript\nfunction GoodNight(){\n\
    \  document.write(“Good Night! <br/>”);\n  GoodMorning();\n}\n\nfunction GoodMorning(){\n\
    \  document.write(“Good Morning! <br/>”);\n  GoodNight();\n}\n\nfunction Start(){\n\
    \  GoodMorning();\n}\n\nStart();\n```\n\n让我们刷新它，然后……噢……哇……比烟花还漂亮！\n\n# 第 16 章\n\
    \n## if 语句\n\n在我想要成为 Web 开发者之前，我一直想当一名仓鼠驯养师。\n\n你知道的，就像和狮子工作的狮子骑士一样……但是……是仓鼠。\n\
    \n你应该驯服它们，让它们能够……做些事情。\n\n总之，有时我在想，如果我去追求梦想会怎样。\n\n为了让这个想法实现，我将使用我的 Javascript\
    \ 技能！\n\n在 Javascript 中，你的代码中会有条件。\n\n例如：\n\n如果 `x` 为真，那么……执行这段代码。\n如果 `x` 为假……那么……执行那些代码。\n\
    如果 `x` 大于 `y`，那么运行那些函数……\n\n让我们让它发生吧！\n\n要写一个 `if` 语句，你应该输入 `if`，然后打开括号，在括号内编写你的条件。\n\
    \n然后你应该打开大括号，在大括号内，只有当条件为真时，你的代码才会被执行。\n\n```javascript\nif(##在此处输入你的条件##){\n\
    \  ##在此处输入你的代码##\n}\n```\n\n假设我们要检查数字 2 是否*真的*等于数字 2。（你永远不知道，对吧？）\n\n让我们创建两个变量，`num1`\
    \ 和 `num2`。并将它们都设置为 2。\n\n因此在条件中，输入 `num1 == num2`。\n\n注意，我们有两个等号，而不是一个等号。之所以这样做，是因为如果我们只写一个等号，浏览器可能会困惑，并认为我们想要设置一个新的变量。所以，如果你想检查某个东西是否等于另一个东西，双等号才是正确做法。\n\
    \n让我们修改这里的代码，只说“如果我是一个仓鼠驯养师，我的奶牛坏了”，因为也许某天会这样！\n\n```javascript\nvar num2 = 2;\n\
    var num1 = 2;\n\nif(num1==num2){\n  document.write(“If I was hamster-tamer,my\
    \ cow was broken”);\n}\n```\n\n让我们运行这个程序吧！\n\n确实如此，2 *确实*等于 2，毕竟我们刚刚有了一头坏掉的奶牛。\n\
    \n如果我们想检查 2 是否不等于 2 呢。\n\n我们应该输入的不是两个等号（把它删掉），我们需要输入感叹号，后面跟着等号。这代表“不等于”。\n\n让我们测试一下这个。\n\
    \n```javascript\nif(num1 != num2){\n  document.write(“my cow is broken”);\n}\n\
    ```\n\n刷新它，没错！正如我们预料的那样！我们没有收到任何消息，这意味着 2 *仍然*等于 2，因为我们检查的是它是否*不*相等，所以代码没有触发……\n\
    \n如果我们把 `num1` 改为数字 3 并再次运行代码，我们将看到代码运行得完美，因为 3 不等于 2。\n\n让我们再学一个！如果我们其实想检查 3\
    \ 是否大于 2 呢。\n\n我们将条件改为这个奇奇怪的角括号……\n\n```javascript\nvar num2 = 3;\nvar num1 =\
    \ 2;\n\nif(num1 > num2){\n  document.write(“my cow is broken”);\n}\n```\n\n如果我们想检查\
    \ 2 是否大于 3，我们需要把它改为大于号。\n\n```javascript\nif(num1 < num2){\n  document.write(“my\
    \ cow is broken”);\n}\n```\n\n现在我们可以检查一个数字是否“小于”另一个数字，或者等于……\n\n```javascript\n\
    if(num1 <= num2){\n  document.write(“my cow is broken”);\n}\n```\n\n所以如果我们检查数字\
    \ 4，它不会运行；3，不会运行；2……？砰。明白了。\n\n我们还可以检查它是否“大于”或“等于”\n\n```javascript\nif(num1 >=\
    \ num2){\n  document.write(“my cow is broken”);\n}\n```\n\n酷了！\n\n# 第 17 章\n\n\
    ## Else & Else if\n\n假设你有一个条件，例如……单词“banana”等于单词“banana”：\n\n并且当它成立时，你将有一个名为 `ChoppingBanana`\
    \ 的函数。\n\n```javascript\nif(“banana” == “banana”){\n  ChoppingBanana();\n}\n```\n\
    \n到目前为止，没什么新奇的对吧？\n\n香蕉就是香蕉，代码会执行。\n\n如果我把其中一个香蕉换成菠萝…… `ChoppingBanana` 函数就不会被触发……对吧？\n\
    \n但如果我想在条件不为真时让另一个函数触发呢？我该怎么办？\n\n在这种情况下，我们需要在最后一个大括号之后输入一个 `else` 语句，以及另一个大括号，在大括号内我们写编写我们的代码。\n\
    \n```javascript\nif(“banana” == “pineapple”){\n  ChoppingBanana();\n} else {\n\
    \  ChoppingPineapple();\n}\n```\n\n如果我们需要的话，我们也可以写另一个条件，我们会写 `else if` 和另一个条件，比如“banana”等于“cherry”，然后是另一个大括号。\n\
    \n```javascript\nif(“banana” == “pineapple”){\n  ChoppingBanana();\n} else if(“banana”\
    \ == “cherry”){\n  ChoppingCherry();\n} else {\n  ChoppingPineapple();\n}\n```\n\
    \n在这个例子中，浏览器将首先进入第一个 `if`，并询问条件香蕉是否是菠萝。如果为假，它将进入下一个 `if`，即 `else if`，并问……“香蕉看起来像樱桃吗？”嗯，它不像……噢！还有一点……你可以拥有任意数量的\
    \ `else if`！！！我们可以有像……一万个 `else if`……如果某个条件为真，它将触发其内部的代码，并跳过整组 `ifs`、`else` 和\
    \ `else ifs`……但如果不是，它将继续询问，直到到达最后的 `else`。\n\n`else` 是浏览器的最后尝试，如果没有 `if` 语句和 `else\
    \ if` 被触发，那么浏览器就会满意并进入。\n\n如果你的浏览器访问了任何条件，`else` 语句就不会被触发。\n\n# 第 18 章\n\n## Switch\n\
    \n谁知道呢，也许有一天会有自己的 Web 开发公司。\n\n和任何其他大公司一样，它有自己的……自动贩机！\n\n但我们不像任何其他大公司，对吧？我们的自动贩机将是独特的！\n\
    \n所以我们将有一个……*鼓点*\n\n等待贩机（Vending Pending Machine）！\n\n我们的自动贩机会让你等待。就这样。没有汽水之类的。只是……等一会儿，然后离开。\n\
    \n好了，首先当然，我们必须构建我们的自动贩机标题，所以我们会在 HTML 中添加一些花样……\n\n```html\n<h1>The Vending Pending\
    \ Machine</h1>\n<input type=”button” value=”1” />\n<input type=”button” value=”2”\
    \ />\n<input type=”button” value=”3” />\n<input type=”button” value=”4” />\n```\n\
    \n现在让我们构建等待贩机函数。\n\n"
