  raw: '### Chapter 15


    Calling function from another function


    Ok so you already know how to write a function, and how to write a parameter for
    this function, and even multiple parameters, and even… (God forbid!), a return
    statement for this function!


    Now I’ll show you a little trick that will come handy one day…


    You can actually call a function… within a function!


    Let’s try it out, create a function called GoodNight, and another function called
    GoodMorning. Without taking any parameters.


    Inside of the GoodNight function we would have document.write, and we will say
    “Good night!” and in the GoodMorning function, you guessed it right, we will type
    “Good morning!”


    function GoodNight(){


    document.write(“Good Night!”);


    }


    function GoodMorning(){


    document.write(“Good Morning!”);


    }


    And now we will have another function, called Start, it and we will call both
    functions from the Start function.


    function Start(){


    GoodMorning();


    GoodNight();


    }


    Right now, if we will refresh our page, nothing will happen, because although
    we called GoodMorning and GoodNight, we have not initiate the Start function.
    Only when we will call the Start function, we will see stuff going on.


    Let’s do that!


    Start();


    See? When we started Start function, we run also both functions within it.


    Now let’s try to break our browser apart. (don’t try it at home! Nahh… kiddin’.
    You can!)


    We will take the GoodMorning function, and place it within the GoodNight function,
    and vice versa, and then we will call start by telling it to call GoodMorning.
    (and for the sake of readability, add a br tag to each write statement.


    We will expect the browser to go to GoodMorning and say good morning, and then
    go to GoodNight and say “good night!”. And then back to good morning, good night,
    good morning, good night good morning, good night good morning… He supposed to
    get inside of some sort of a limbo… leaving its wife and its children… And even
    its own sanity!


    function GoodNight(){


    document.write(“Good Night! <br/>”);


    GoodMorning();


    }


    function GoodMorning(){


    document.write(“Good Morning! <br/>”);


    GoodNight();


    }


    function Start(){


    GoodMorning();


    }


    Start();


    Let’s refresh it, and… oh… wow… Better than fireworks!


    ### Chapter 16


    If statement


    Before I wanted to be a web developer, I always wanted to be a hamster-tamer.


    You know, just like a lion tamer that works with lions… But… with hamsters.


    You suppose to tame them, so they can… do stuff.


    Anyway, sometimes I wonder what if I was going with my dream.


    And to make this thought come true, I will use my javascript skills!


    In Javascript, you can have conditions in your code.


    For example:


    If x is true, then… execute this code.


    If x is false… Then… do that code.


    If x is greater than y, then run those functions…


    Let’s make it happened!


    To write an if statement, you should type if, then open parenthesis, and then
    inside of those parenthesis you should write your condition.


    Then you should open curly brackets, and inside of those curly brackets, your
    code will be execute, only if the condition is true.


    if(##YOUR CONDITION HERE##){


    ##YOUR CODE HERE##


    }


    So let’s say we want to check if the number 2 is *really* equals to the number
    2\. (you’ll never know, right?)


    Let’s make two variables, num1 and num2. And we will set both to 2.


    So in the condition, type num1 == num2.


    Note that we are having two equal signs, and not just one equal sign. The reason
    for that, is that if we will type just one equal sign, the browser will might
    confuse and think we want to set a new variable. So two equal sign is the way
    to go, if you want to check if something is equal to something.


    Let’s change our code here to just say “If I was a hamster-tamer, my cow was broken”,
    because she might be someday!


    var num2 = 2;


    var num1 = 2;


    if(num1==num2){


    document.write(“If I was hamster-tamer,my cow was broken”);


    }


    And let’s run this thing!


    And indeed that’s true, 2 *is* equal to 2, after all, and we have a broken cow
    just now.


    What if we want to check rather if 2 is not equal to 2.


    We should type instead of two equal sign (let’s erase that), we need to type exclamation
    mark, followed by equal sign. That’s “not equal”.


    So let’s test just that.


    if(num1 != num2){


    document.write(“my cow is broken”);


    }


    Let’s refresh that, and yup! As we suspect! We don’t get any message, that means
    that 2 still *does* equal to 2, and because we check for if it’s *not* equal,
    the code doesn’t fire…


    If we will change num1 into the number 3, and run the code again, we will see
    that the code run perfectly, because 3 is not equal to 2.


    Let’s learn another one! What if we want to check rather if 3 is greater than
    2.


    We will change our condition to this funky angle bracket…


    var num2 = 3;


    var num1 = 2;


    if(num1 > num2){


    document.write(“my cow is broken”);


    }


    If we want to check if 2 is greater than 3, we need to change it to a greater
    sign.


    if(num1 < num2){


    document.write(“my cow is broken”);


    }


    Now we can check if one number is “less than” the other, or equal…


    if(num1 <= num2){


    document.write(“my cow is broken”);


    }


    So if we will check the number 4, it won’t run, 3, it won’t run, 2… ? bam. Got
    it.


    And we can also check if it’s “greater than” or “equal”


    if(num1 >= num2){


    document.write(“my cow is broken”);


    }


    Cool!


    ### Chapter 17


    Else & Else if


    Let’s say you have a condition, for example….the word “banana” equals to the word
    “banana” :


    And when it does, you will have a function called “ChoppingBanana”.


    if(“banana” == “banana”){


    ChoppingBanana();


    }


    Till now, nothin’ new, right?


    Banana is a banana, and the code will be fire.


    And if I will replace one of the bananas into a Pineapple… the ChoppingBanana
    function will not be fired… right?


    But let’s say I want some other function to be fire if the condition is not true?
    What do I do ?


    In this case, we need to type right after our last curly brackets an “else” statement.
    and another curly brackets, and inside of those curly brackets we can write our
    code.


    if(“banana” == “pineapple”){


    ChoppingBanana();


    } else {


    ChoppingPineapple();


    }


    If we want, we can write another condition as well, we will write “else if” and
    another condition, say “banana” equals to “cherry”, and then another curly brackets.


    if(“banana” == “pineapple”){


    ChoppingBanana();


    } else if(“banana” == “cherry”){


    ChoppingCherry();


    }


    else {


    ChoppingPineapple();


    }


    So in this example, the browser will go first into the first if, and ask the condition
    rather if a banana is a pineapple. If it’s not true, then he will go to the next
    if, the “else if”, and ask… “Does a banana looks like a cherry?” , well it doesn’t…
    Oh! One more thing… You can have as many else if as we can wish!!! We can have
    like… A gazillion else if… If some condition is true, it will be fire the code
    inside of it, and leave the whole bunch of ifs and “else” and “else ifs alone…
    But if it doesn’t, it will continue to ask until it gets to the last else.


    The else is the final try of our browser, if no if statement and no else if was
    fired, than our browser will be satisfied and go in.


    If your browser visited any condition, the else statement will not be fired.


    ### Chapter 18


    Switch


    Who knows, maybe someday you will have your own web development company.


    And as any other big company, it has its own… vending machine!


    But we are not like any other big company, right ? our vending machine will be
    special!


    So we will have the… *drum*


    The Vending Pending Machine!


    Our vending machine will make you pending. And… that’s it. No soda or anything.
    Just… wait for a while, and go away.


    Alright, so first, of course, we have to build our vending pending machine title,
    so we will add a few shticks in HTML…


    <h1>The Vending Pending Machine</h1>


    <input type=”button” value=”1” />


    <input type=”button” value=”2” />


    <input type=”button” value=”3” />


    <input type=”button” value=”4” />


    Now Let’s build the Vending Pending Machine function.'
