    \ Doris!!! Jenni… Bath!… Elizab… Doris!!! Doris…”\n\nYeah… so don’t do that… Other\
    \ than that. You’re safe!\n\n### Chapter 8: Variable types\n\nDo you remember\
    \ when you were a baby, you had this weird game of shapes, and you were supposed\
