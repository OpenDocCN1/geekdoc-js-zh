  \ 应该返回 `>>>` 告知你 Pygame 已成功导入。\n\n![你可以从 Linux 命令行终端测试你对 Python 2 的 Pygame 安装。](img/httpatomoreillycomsourcenostarchimages2189135.png.jpg)\n\
  \n图 B-14. 你可以从 Linux 命令行终端测试你对 Python 2 的 Pygame 安装。\n\n4. 你可以使用软件中心（如 Linux 的 Python\
  \ 所示）或如图 B-13 所示的 Synaptic 包管理器来搜索并安装 Python 2 的 IDLE。在运行从第 8 章到第 10 章中的 Pygame\
  \ 应用时，请使用此版本的 IDLE。\n\n# 附录 C. 构建自己的模块\n\n在本书中，你将 `turtle`、`random` 和 `pygame` 等模块导入到程序中，以添加绘制、生成随机数和制作动画的功能，而无需从头开始编写代码。但你知道你也可以编写自己的模块并将其导入到程序中吗？Python\
  \ 让构建模块变得非常简单，因此你可以保存有用代码并在许多程序中使用它。\n\n为了创建一个可重用的模块，我们在 IDLE 的文件编辑器窗口中编写该模块，就像我们构建的其他程序文件一样，并将其保存为新的\
  \ `.py` 文件，以模块名称命名文件名（例如，`colorspiral.py` 可能是绘制彩色螺旋的模块的文件）。我们在模块中定义函数和变量。然后，为了在另一个程序中重用它们，通过输入\
  \ `import` 和模块名称将模块导入程序中（例如，`import colorspiral` 将允许程序使用 `colorspiral.py` 中的代码来绘制彩色螺旋）。\n\
  \n为了练习编写自己的模块，让我们创建一个实际 `colorspiral` 模块，看看它是如何避免我们重写代码的。\n\n# 构建 colorspiral 模块\n\
  \n让我们创建一个 `colorspiral` 模块，帮助我们仅通过调用 `import colorspiral` 就能在程序中快速地绘制螺旋。将以下代码输入到新的\
  \ IDLE 窗口并将其保存为 `colorspiral.py`。\n\n## colorspiral.py\n\n```\n➊ \"\"\"一个用于绘制最多\
  \ 6 边的彩色螺旋的模块\"\"\"\n   import turtle\n➋ def cspiral(sides=6, size=360, x=0, y=0):\n\
  ➌     \"\"\"在黑色背景上绘制彩色螺旋。\n\n       参数：\n       sides -- 螺旋的边数（默认值为 6）\n       size\
  \ -- 最后一条边的长度（默认值为 360）\n       x, y -- 螺旋的位置，距离屏幕中心\n       \"\"\"\n       t=turtle.Pen()\n\
  \       t.speed(0)\n       t.penup()\n       t.setpos(x,y)\n       t.pendown()\n\
  \       turtle.bgcolor(\"black\")\n       colors=[\"red\", \"yellow\", \"blue\"\
  , \"orange\", \"green\", \"purple\"]\n       for n in range(size):\n           t.pencolor(colors[n%sides])\n\
  \           t.forward(n * 3/sides + n)\n           t.left(360/sides + 1)\n     \
  \      t.width(n*sides/100)\n```\n\n此模块导入了 `turtle` 模块，并定义了一个名为 `cspiral()` 的函数，用于绘制不同形状、大小和位置的彩色螺旋。让我们看看这个模块与其他编写程序之间的区别。首先，在\
  \ ➊ 处，我们有一个特殊的注释称为 *docstring*（文档字符串）。docstring 是向我们打算重用或与他人共享的文件添加文档的方法；在 Python\
  \ 中，模块应该具有 docstring，以帮助未来的用户理解该模块的作用。docstring 始终是模块或函数的第一个语句，且每个 docstring 都以三个双引号（`\"\
  \"\"`，连续的三个双引号，中间没有空格）开始和结束。在 docstring 之后，我们导入了 `turtle` 模块——是的，我们可以将模块导入到模块中！\n\
  \n在 ➋ 处，我们定义了一个名为 `cspiral()` 的函数，它接受最多四个参数——`sides`、`size`、`x` 和 `y`——用于螺旋的边数、螺旋的大小以及从乌龟屏幕中心开始的螺旋的\
  \ (`x`, `y`) 位置。`cspiral()` 函数的 docstring 开始于 ➌ 处；这个多行 docstring 提供了关于函数的更具体的信息。docstring\
  \ 的第一行以三个双引号开头，描述了函数的总体。接下来我们留出一个空行，然后是函数接受的参数列表。有了这些文档，未来的用户可以轻松读出函数接受哪些参数以及每个参数的含义。函数的其余部分是绘制螺旋的代码。\n\
  \n## 使用 colorspiral 模块\n\n一旦我们完成了 `colorspiral.py` 并将其保存，就可以通过将其导入另一个程序来使用它。在 IDLE\
  \ 中创建一个新文件并将其保存为 `MultiSpiral.py`。\n\n## MultiSpiral.py\n\n```\nimport colorspiral\n\
  colorspiral.cspiral(5,50)\n```\n\n这个三行程序导入了我们创建的 `colorspiral` 模块，并使用 `cspiral()`\
  \ 函数绘制两个螺旋，如图图 C-1 所示。\n\n![三行程序的彩色螺旋](img/httpatomoreillycomsourcenostarchimages2189137.png)\n\
  \n图 C-1. 感谢 turtle 模块，三行程序的彩色螺旋。\n\n有了 `colorspiral` 模块，程序员想要创建彩色螺旋时，只需要导入模块并调用\
  \ `cspiral()`！\n\n## 重用 colorspiral 模块\n\n让我们重用 `colorspiral` 模块来绘制 30 个随机彩色螺旋。为了实现这一点，我们将导入另一个用过的模块\
  \ `random`。将以下八行代码输入到新文件中并将其保存为 `SuperSpiral.py`。\n\n## SuperSpiral.py\n\n```\n\
  import colorspiral\nimport random\nfor n in range(30):\n    sides = random.randint(3,6)\n\
  \    size = random.randint(25,75)\n    x = random.randint(-300,300)\n    y = random.randint(-300,300)\n\
  \    colorspiral.cspiral(sides, size, x, y)\n```\n\n此程序以两个 `import` 语句开始：一个是我们创建的\
  \ `colorspiral` 模块，另一个是我们在书中一直使用的 `random` 模块。`for` 循环将运行 30 次。循环生成四个随机值：边数（3 到\
  \ 6 之间）、螺旋的大小（25 到 75 之间）以及在屏幕上绘制螺旋的 x 坐标和 y 坐标（在 -300 到 300 之间）。（记住，乌龟的原点 (0, 0)\
  \ 位于绘图屏幕的中心。）最后，每次循环都会调用我们模块中的 `colorspiral.cspiral()` 函数，根据循环生成的随机属性绘制彩色螺旋。\n\n\
  尽管这个程序只有八行长，但它产生了像图 C-2 那样的视觉效果。\n\n\n\n\n\n![colorspiral 模块允许 SuperSpiral.py 只需八行代码即可生成漂亮的多螺旋拼贴。](img/httpatomoreillycomsourcenostarchimages2189139.png.jpg)\n\
  \n图 C-2。`colorspiral` 模块允许 `SuperSpiral.py` 只需八行代码即可生成漂亮的多螺旋拼贴。\n\n创建可重用模块的能力意味着你可以花费更多时间解决新问题，而不是花更多时间去重复编写之前的解决方案。每当你构建了一个想要反复使用的有用函数或一组函数时，都可以创建一个模块供自己使用或与代码编写伙伴们分享。\n\
  \n## 额外资源\n\nPython 的官方文档位于 `[`docs.python.org/3/`](http://docs.python.org/3/)`，包含了更多关于模块和\
  \ Python 语言的信息。《Python 教程》在 `[`docs.python.org/3/tutorial/modules.html`](http://docs.python.org/3/tutorial/modules.html)`\
  \ 中有一个专门关于模块的章节。当你学习新的 Python 编程技能时，请利用这些资源来丰富你的编程工具箱。\n\n# 附录 D 术语表\n\n在学习编程过程中遇到的许多术语是你已经理解的日常词汇。然而，某些术语是全新的，或者对计算机程序员来说有特殊含义。本术语表定义了你将在书中遇到的几个新术语，以及在编程世界中具有新含义的常见词汇。\n\
  \n### algorithm (算法)\n执行任务的一组步骤，就像食谱一样。\n\n### animation (动画)\n当相似的图像连续快速显示时产生的运动幻觉，就像动画片一样。\n\
  \n### app (应用程序)\n`application` 的缩写，一个执行有用（或有趣！）任务的计算机程序。\n\n### append (追加)\n将某些内容添加到末尾；例如，在字符串末尾添加字母或向列表或数组的末尾添加元素。\n\
  \n### argument (参数)\n传递给函数的值；在语句 `range(10)` 中，`10` 就是参数。\n\n### array (数组)\n一个有序的值或对象列表，通常具有相同类型，通过它们的\
  \ `index` 或在列表中的位置来访问。\n\n### assignment (赋值)\n设置变量的值，例如 `x = 5`，这将值 `5` 分配给变量 `x`。\n\
  \n### block (块)\n一组编程语句。\n\n### Boolean (布尔)\n一个可以是真（true）或假（false）的值或表达式。\n\n###\
  \ class (类)\n一个定义了该类型对象中包含的函数和值的模板。\n\n### code (代码)\n程序员用计算机可以理解的语言编写的语句或指令。\n\n\
  ### collision detection (碰撞检测)\n检查屏幕上的两个虚拟对象是否正在接触或“碰撞”，像 Pong 游戏中的球和挡板。\n\n###\
  \ concatenate (拼接)\n将两个文本字符串合并成单个字符串。\n\n### conditional expression (条件表达式)\n一种允许计算机测试值并根据测试结果执行不同操作的语句。\n\
  \n### constant (常量)\n计算机程序中保持不变的命名值，如 `math.pi` (3.1415...)。\n\n### declaration\
  \ (声明)\n告诉计算机变量或函数名称含义什么的语句或语句组。\n\n### element (元素)\n列表或数组中的单个项。\n\n### event (事件)\n\
  计算机可以检测到的活动，例如鼠标点击、值变化、按键、定时器滴答等。响应事件的语句或函数称为 `event handlers`（事件处理器）或 `event listeners`（事件监听器）。\n\
  \n### expression (表达式)\n任何产生值或结果的有效值、变量、运算符和函数的集合。\n\n### file (文件)\n计算机存储在某种存储设备（如硬盘、DVD\
  \ 或 USB 驱动器）上的数据或信息集合。\n\n### `for` loop (for 循环)\n一种编程语句，允许代码块在给定的值范围内重复。\n\n###\
  \ frame (帧)\n动画、视频或计算机图形移动序列中的单个图像。\n\n### frames per second (fps) (每帧率)\n动画、视频游戏或电影在屏幕上绘制图像的频率或速度。\n\
  \n### function (函数)\n一组命名的、可重用的编程语句，用于执行特定任务。\n\n### import (导入)\n从另一个程序或模块将可重用的代码或数据引入程序。\n\
  \n### index (索引)\n元素在列表或数组中的位置。\n\n### initialize (初始化)\n为变量或对象赋予第一个或“初始”值。\n\n\
  ### input (输入)\n输入计算机的任何数据或信息；输入可以来自键盘、鼠标、麦克风、数字相机或其他任何输入设备。\n\n### iterative versioning\
  \ (迭代版本控制)\n反复对程序进行微调或改进并将其保存为新版本，如 `Game1`、`Game2` 等。\n\n### keyword (关键字)\n在特定编程语言中具有特定含义的特殊保留词。\n\
  \n### list (列表)\n一个用于存储有序组的值或对象的容器。\n\n### loop (循环)\n一组重复的指令，直到达到某个条件。\n\n### module\
  \ (模块)\n一个包含相关变量、函数和类的文件或文件集，可以在其他程序中重用。\n\n### nested loop (嵌套循环)\n另一个循环内部的循环。\n\
  \n### object (对象)\n包含类中单个实例信息的变量，例如来自 `Sprite` 类的单个精灵图（sprite）。\n\n### operator\
  \ (运算符)\n表示动作或比较并返回结果的符号或符号组，如 `+`、`-`、`*`、`//`、`<`、`>`、`==` 等。\n\n### parameter\
  \ (参数)\n函数的输入变量。\n\n### pixel (像素)\n`picture element` 的缩写，构成计算机屏幕图像的彩色小点。\n\n###\
  \ program (程序)\n用计算机可以理解的语言编写的指令集。\n\n### pseudorandom (伪随机)\n一个看起来是随机或不可预测的值，用于模拟掷骰子或抛硬币。\n\
  \n### random (随机)\n在范围内均匀分布的不可预测。\n\n### range (范围)\n一个特定的起始和结束值；在 Python 中 `range`\
  \ 返回一个序列，例如 `0` 到 `10`。\n\n### RGB color\n通过红、绿、蓝的量来表示颜色。\n\n### shell (终端)\n读取用户命令并运行它们的文本界面；IDLE\
  \ 是 Python 的终端。\n\n### sort (排序)\n将列表元素按顺序排列，例如字母顺序。\n\n### string (字符串)\n包含字母、数字、符号和标点的字符序列。\n\
  \n### syntax (语法)\n编程语言的拼写和规则。\n\n### transparency (透明度)\n看到图像部分的能力。\n\n### variable\
