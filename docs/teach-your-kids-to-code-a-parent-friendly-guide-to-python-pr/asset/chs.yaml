  \n图 2-8. 通过将变量 sides 从 6 (a) 改变到 2 (e) 创建的五五颜色的形状\n\n## 你学到了什么\n\n在本章中，我们使用 Turtle\
  \ 工具库在 Python 中绘制了许多令人印象深刻的彩色形状。我们通过使用 `import` 命令将该库引入程序，你学习了以这种方式重用代码是编程中最强大的功能之一。一旦我们写了一些有用的东西，或者借用了别人乐分享的代码，我们不仅节省了时间，还可以使用那些导入的代码来完成漂亮的新花样。\n\
