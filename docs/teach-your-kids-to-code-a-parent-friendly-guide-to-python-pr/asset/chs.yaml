  \n## 交互的体验\n\n我们已经编写了一些外观良好的图形化应用，但距离构建下一个视频游戏或移动应用还有差一两步之遥。我们需要学习的剩余技能之一是编写用户交互代码：让我们的程序响应鼠标点击、按键按下等。\n\
  \n![image with no caption](img/httpatomoreillycomsourcenostarchimages2188957.png.jpg)\n\
  \n大多数应用都是交互式的——它们允许用户进行触摸、点击、拖拽、按下按钮，并感到对程序有控制权。我们称这些应用为事件驱动应用，因为它们在等待用户执行某个操作或事件。响应用户事件的代码（例如当用户点击图标时打开窗口，或当他们触摸按钮时开始游戏）被称为事件处理器（event\
  \ handler），因为它处理或响应来自用户的事件。它也被称为事件监听器（event listener），因为就像计算机耐心地坐在那里，等待用户告诉它做什么。我们将学习处理用户事件，并让我们的程序更具吸引力和交互性。\n\
  \n## 处理事件：TurtleDraw\n\n有很多方法可以使应用处理用户事件。Python 的 `turtle` 模块包含一些处理用户事件的函数，包括鼠标点击和按键。我们将尝试的第一个是\
  \ `turtle.onscreenclick()` 函数。正如名称所示，此函数允许我们处理由用户点击乌龟屏幕时创建的事件。\n\n这个函数与我们之前使用和构建的函数有所不同：传递给\
  \ `turtle.onscreenclick()` 的参数不是一个值——而是另一个函数的名称：\n\n```\nturtle.onscreenclick(t.setpos)\n\
  ```\n\n还记得我们以前用来将鼠标移动到屏幕上特定 (*x*, *y*) 位置的 `setpos()` 函数吗？现在我们正在告诉计算机，当乌龟屏幕接收到鼠标点击时，它应该将乌龟设置到屏幕上该点击的位置。我们将函数作为参数传递给另一个函数有时被称为回调函数（callback\
  \ function），因为它会被另一个函数“调回”。注意，当我们把一个函数作为参数传递给另一个函数时，内部函数在函数名称后不需要括号。\n\n通过将函数名 `t.setpos`\
  \ 发送给 `turtle.onscreenclick()`，我们正在告诉计算机我们希望屏幕点击做什么：我们想要将乌龟的位置设置为用户点击的任何地方。让我们在一个短程序中尝试一下：\n\
  \n### TurtleDraw.py\n\n```\nimport turtle\nt = turtle.Turtle()\nt.speed(0)\nturtle.onscreenclick(t.setpos)\n\
  ```\n\n## 监听键盘事件：ArrowDraw\n\n在我们的乌龟绘画程序中，我们看到了监听鼠标点击如何让用户感到对程序有更多控制。在这一节中，我们将学习使用键盘交互为用户提供更多选项。我们还将定义自己的函数来作为事件处理器。\n\
  \n\n\n\n在 `TurtleDraw.py` 程序中，我们传递 `t.setpos` 作为回调函数，以告诉计算机在发生 `onscreenclick()`\
  \ 事件时执行什么操作；我们希望将乌龟的位置设置为屏幕上该鼠标点击的位置。`setpos()` 函数已经在 `turtle` 模块中提供给我们了，但如果我们想创建自己的函数来处理事件呢？假设我们想构建一个程序，让用户通过按下箭头键而不是点击鼠标按钮在屏幕上移动乌龟。我们该如何做呢？\n\
  \n首先，我们必须为键盘上的每个箭头键构建一个移动乌龟的函数，然后必须告诉计算机监听这些按键的按下。让我们写一个程序，监听上（↑）、左（←）和右（→）键盘箭头键，让用户通过这些键让乌龟向前移动、左转或右转。\n\
  \n让我们定义一些函数——`up()`、`left()` 和 `right()`，它们将移动和旋转乌龟：\n\n```\ndef up():\n    t.forward(50)\n\
  def left():\n    t.left(90)\ndef right():\n    t.right(90)\n```\n\n我们的第一个函数 `up()`\
  \ 让乌龟向前移动 50 像素。第二个函数 `left()` 让乌龟向左转 90 度。最后，`right()` 让乌龟向右转 90 度。\n\n为了在用户按下正确的箭头键时运行这些每个函数，我们必须告诉计算机哪个函数对应哪个键，并告诉它开始监听按键按下。要为按键事件设置回调函数，我们使用\
  \ `turtle.onkeypress()`。此函数通常接受两个参数：回调函数的名称（我们创建的事件处理函数）和要监听的特定按键。为了将三个函数中的每一个连接到相应的箭头键，我们可以写：\n\
  \n```\nturtle.onkeypress(up,  \"Up\")\nturtle.onkeypress(left,   \"Left\")\nturtle.onkeypress(right,\
  \  \"Right\")\n```\n\n第一行将 `up()` 函数设置为 `\"Up\"` 箭头键按下的事件处理器；函数（`up`）在前面，而 `\"Up\"\
  ` 是上箭头键的名字，↑。左箭头和右箭头键按下也是如此。最后一步是告诉计算机开始监听按键，我们通过这条命令来实现：\n\n```\nturtle.listen()\n\
  ```\n\n我们需要最后这一行是因为几个原因。首先，与鼠标点击不同，仅仅按下键并不能确保我们的乌龟窗口会接收到按键。当你点击桌面上的某个窗口时，该窗口会移动到最前面并获得焦点（focus），这意味着该窗口将接收来自用户的输入。当你点击乌龟窗口上的鼠标时，它会自动让该窗口成为屏幕以及后续任何鼠标事件的焦点。然而，对于键盘，仅仅按下键并不会让窗口接收这些按键；`turtle.listen()`\
  \ 命令确保我们的乌龟窗口是桌面的焦点，这样它就能听到按键声。其次，`listen()` 命令告诉计算机开始为所有我们通过 `onkeypress()` 函数连接到函数的按键开始处理按键事件。\n\
  \n以下是完整的 `ArrowDraw.py` 程序：\n\n### ArrowDraw.py\n\n```\n import turtle\n   t = turtle.Pen()\n\
  \   t.speed(0)\n➊ t.turtlesize(2,2,2)\n   def up():\n       t.forward(50)\n   def\
  \ left():\n       t.left(90)\n   def right():\n       t.right(90)\n   turtle.onkeypress(up,\
  \ \"Up\")\n   turtle.onkeypress(left, \"Left\")\n   turtle.onkeypress(right, \"\
  Right\")\n   turtle.listen()\n```\n\n在 ➊，即 `ArrowDraw.py` 中唯一的新的一行，我们通过 `t.turtlesize(2,2,2)`\
  \ 让乌龟箭头变大倍，并给它一个更粗的轮廓。这三个参数分别是水平拉伸（`2` 意味着宽度加倍）、垂直拉伸（高度加倍）和轮廓厚度（2 像素厚）。图 7-5. ArrowDraw.py\
  \ 程序允许用户使用上、右、左箭头键进行绘图。更大的乌龟箭头更容易看到乌龟的朝向。）显示了结果。\n\n![The ArrowDraw.py program lets\
  \ the user draw using the up, right, and left arrow keys. The larger turtle arrow\
  \ makes it easier to see where the turtle is headed.\n\n图 7-5. `ArrowDraw.py` 程序允许用户使用上、右、左箭头键进行绘图。更大的乌龟箭头更容易看到乌龟的朝向。\n\
  \n这个应用有点像旧的写生板（Etch-A-Sketch）玩具：你只需要那三个箭头键就可以画有趣的形状，并且可以追溯自己的步骤。随意使用你自己的颜色、笔画以及任何你想添加的其他功能来自定义此应用。你可以添加的一个额外功能（已作为本章末尾的挑战包含）是点击将乌龟移动到新位置的能力。\n\
  \n## 使用参数处理事件\n\n在 `TurtleDraw.py` 中，我们传递 `t.setpos` 作为回调函数，以告诉计算机在发生 `onscreenclick()`\
  \ 事件时执行什么操作；我们希望将乌龟的位置设置为屏幕上该鼠标点击的位置。`setpos()` 函数已经在 `turtle` 模块中提供给我们了，但如果我们想创建自己的函数来处理事件呢？假设我们想构建一个程序，让用户通过按下箭头键而不是点击鼠标按钮在屏幕上移动乌龟。我们该如何做呢？\n\
  \n首先，我们必须为键盘上的每个箭头键构建一个移动乌龟的函数，然后必须告诉计算机监听这些按键的按下。让我们写一个程序，监听上（↑）、左（←）和右（→）键盘箭头键，让用户通过这些键让乌龟向前移动、左转或右转。\n\
  \n让我们定义一些函数——`up()`、`left()` 和 `right()`——它们将移动和旋转乌龟：\n\n```\ndef up():\n    t.forward(50)\n\
  def left():\n    t.left(90)\ndef right():\n    t.right(90)\n```\n\n我们的第一个函数 `up()`\
  \ 让乌龟向前移动 50 像素。第二个函数 `left()` 让乌龟向左转 90 度。最后，`right()` 让乌龟向右转 90 度。\n\n为了在用户按下正确的箭头键时运行这些每个函数，我们必须告诉计算机哪个函数对应哪个键，并告诉它开始监听按键按下。要为按键事件设置回调函数，我们使用\
  \ `turtle.onkeypress()`。此函数通常接受两个参数：回调函数的名称（我们创建的事件处理函数）和要监听的特定按键。为了将三个函数中的每一个连接到相应的箭头键，我们可以写：\n\
  \n```\nturtle.onkeypress(up,  \"Up\")\nturtle.onkeypress(left,   \"Left\")\nturtle.onkeypress(right,\
  \  \"Right\")\n```\n\n第一行将 `up()` 函数设置为 `\"Up\"` 箭头键按下的事件处理器；函数（`up`）在前面，而 `\"Up\"\
  ` 是上箭头键的名字，↑。左箭头和右箭头键按下也是如此。最后一步是告诉计算机开始监听按键，我们通过这条命令来实现：\n\n```\nturtle.listen()\n\
  ```\n\n我们需要最后这一行是因为几个原因。首先，与鼠标点击不同，仅仅按下键并不能确保我们的乌龟窗口会接收到按键。当你点击桌面上的某个窗口时，该窗口会移动到最前面并获得焦点，这意味着该窗口将接收来自用户的输入。当你点击乌龟窗口上的鼠标时，它会自动让该窗口成为屏幕以及后续任何鼠标事件的焦点。然而，对于键盘，仅仅按下键并不会让窗口接收这些按键；`turtle.listen()`\
  \ 命令确保我们的乌龟窗口是桌面的焦点，这样它就能听到按键声。其次，`listen()` 命令告诉计算机开始为所有我们通过 `onkeypress()` 函数连接到函数的按键开始处理按键事件。\n\
  \n以下是完整的 `ArrowDraw.py` 程序：\n\n### ArrowDraw.py\n\n```\n import turtle\n   t = turtle.Pen()\n\
  \   t.speed(0)\n➊ t.turtlesize(2,2,2)\n   def up():\n       t.forward(50)\n   def\
  \ left():\n       t.left(90)\n   def right():\n       t.right(90)\n   turtle.onkeypress(up,\
  \ \"Up\")\n   turtle.onkeypress(left, \"Left\")\n   turtle.onkeypress(right, \"\
  Right\")\n   turtle.listen()\n```\n\n在 ➊，即 `ArrowDraw.py` 中唯一的新的一行，我们通过 `t.turtlesize(2,2,2)`\
  \ 让乌龟箭头变大倍，并给它一个更粗的轮廓。这三个参数分别是水平拉伸（`2` 意味着宽度加倍）、垂直拉伸（高度加倍）和轮廓厚度（2 像素厚）。图 7-5. ArrowDraw.py\
  \ 程序允许用户使用上、右、左箭头键进行绘图。更大的乌龟箭头更容易看到乌龟的朝向。）显示了结果。\n\n![The ArrowDraw.py program lets\
  \ the user draw using the up, right, and left arrow keys. The larger turtle arrow\
  \ makes it easier to see where the turtle is headed.\n\n图 7-5. `ArrowDraw.py` 程序允许用户使用上、右、左箭头键进行绘图。更大的乌龟箭头更容易看到乌龟的朝向。\n\
  \n这个应用有点像旧的写生板（Etch-A-Sketch）玩具：你只需要那三个箭头键就可以画有趣的形状，并且可以追溯自己的步骤。随意使用你自己的颜色、笔画以及任何你想添加的其他功能来自定义此应用。你可以添加的一个额外功能（已作为本章末尾的挑战包含）是点击将乌龟移动到新位置的能力。\n\
  \n### 7-6 使用参数处理事件\n\n在 `TurtleDraw.py` 中，我们传递 `t.setpos` 作为回调函数，以告诉计算机在发生 `onscreenclick()`\
  \ 事件时执行什么操作；我们希望将乌龟的位置设置为屏幕上该鼠标点击的位置。`setpos()` 函数已经在 `turtle` 模块中提供给我们了，但如果我们想创建自己的函数来处理事件呢？假设我们想构建一个程序，让用户通过按下箭头键而不是点击鼠标按钮在屏幕上移动乌龟。我们该如何做呢？\n\
  \n`onscreenclick()` 监听会将每次点击的 x 和 y 坐标传递给回调函数。图 7-6. 使用 ClickSpiral.py 画出的笑脸\n\n\
  图 7-6. 使用 ClickSpiral.py 画出的笑脸\n\n*RandomSpiralsFunction.py* 包含一个名为 `random_spiral()`\
  \ 的函数，它在随机位置绘制彩色螺旋。现在，我们不是在随机位置绘制螺旋，而是希望在用户点击的地方出现螺旋。为了这一点，我们可以重写 `random_spiral()`\
  \ 函数，从 `onscreenclick()` 监听接收两个参数 `x` 和 `y`。我们将函数重命名为 `spiral(x,y)`：\n\n```\ndef\
  \ spiral(x,y):\n    t.pencolor(random.choice(colors))\n    size = random.randint(10,40)\n\
  \    t.penup()\n```\n——`x` 和 `y`——作为一对。剩下的步骤就是设置我们的乌龟窗口和颜色列表，然后告诉我们的 `turtle.onscreenclick()`\
  \ 监听在用户点击绘图窗口上的鼠标按钮时调用 spiral 函数。这里是完整的程序：\n\n### ClickSpiral.py\n\n```\n import\
  \ random\n   import turtle\n   t = turtle.Pen()\n   t.speed(0) turtle.bgcolor(\"\
  black\")\n   colors = [\"red\", \"yellow\", \"blue\", \"green\", \"orange\", \"\
  purple\",\n             \"white\", \"gray\"]\n   def spiral(x,y):\n       t.pencolor(random.choice(colors))\n\
  \       size = random.randint(10,40)\n       t.penup()\n       t.setpos(x,y)\n \
  \      t.pendown()\n       for m in range(size):\n           t.forward(m*2)\n  \
  \         t.left(91)\n➊ turtle.onscreenclick(spiral)\n```\n\n\n\n与 `TurtleDraw.py`\
  \ 中一样，我们省略了回调函数的括号和参数 ➊：`turtle.onscreenclick(spiral)` 告诉程序，每当用户在屏幕上点击鼠标时，它应该调用我们的\
  \ `spiral(x,y)` 函数，事件监听器会自动将两个参数——该点击位置的 x 位置和 y 位置——发送给 `spiral` 回调函数。同样的情况在 `TurtleDraw.py`\
  \ 的 `t.setpos` 回调中也发生过，但这次我们创建了自己的函数，在鼠标按钮点击的位置绘制一个随机颜色和大小的螺旋线。\n\n## 进一步尝试：Clickandsmile\n\
  \n让我们通过增加一个更改来扩展这个交互式应用程序。与其绘制螺旋线，不如说我们在用户在绘图屏幕上点击鼠标的任何地方绘制一个笑脸。代码看起来非常像我们在整合一切\
  \ 中的 `RandomSmileys.py` 程序，但这个程序不是通过一个在屏幕上随机位置绘制 50 个笑脸的循环，而是通过在用户选择的位置绘制笑脸来处理鼠标点击事件，绘制次数取决于用户想要点击几次。\n\
  \n事实上，由于我们的 `draw_smiley()` 函数已经接受两个参数（我们想要绘制笑脸的位置的 x 和 y 坐标），`ClickAndSmile.py`\
  \ 的代码与 `RandomSmileys.py` 完全相同，最后一段除外。只需将绘制 50 个随机笑脸的 `for` 循环替换为调用 `turtle.onscreenclick(draw_smiley)`\
  \ 即可。记得 `turtle.onscreenclick()` 函数允许我们我们将函数名（如 `setpos`）作为鼠标点击的事件处理器吗？我们可以向它传递\
  \ `draw_smiley`，这样当用户点击时，我们的 `draw_smiley()` 函数就会在点击的位置执行工作。我们没有在 `turtle.onscreenclick()`\
  \ 的括号内包含 `draw_smiley` 的括号或任何参数。\n\n### ClickAndSmile.py\n\n```\nimport random\n\
  import turtle\nt = turtle.Pen()\nt.speed(0)\nt.hideturtle()\nturtle.bgcolor(\"black\"\
  )\ndef draw_smiley(x,y):\n    t.penup()\n    t.setpos(x,y)\n    t.pendown()\n  \
  \  # Face\n    t.pencolor(\"yellow\")\n    t.fillcolor(\"yellow\")\n    t.begin_fill()\n\
  \    t.circle(50)\n    t.end_fill()\n    # Left eye\n    t.setpos(x-15, y+60)\n\
  \    t.fillcolor(\"blue\")\n    t.begin_fill()\n    t.circle(10)\n    t.end_fill()\n\
  \    # Right eye\n    t.setpos(x+15, y+60)\n    t.begin_fill()\n    t.circle(10)\n\
  \    t.end_fill()\n    # Mouth\n    t.setpos(x-25, y+40)\n    t.pencolor(\"black\"\
  )\n    t.width(10)\n    t.goto(x-10, y+20)\n    t.goto(x+10, y+20)\n    t.goto(x+25,\
  \ y+40)\n    t.width(1)\nturtle.onscreenclick(draw_smiley)\n```\n\n现在，用户不再是在屏幕上到处绘制随机的笑脸，而可以在他们点击鼠标的任何地方绘制笑脸；他们甚至可以用小笑脸画出一个大笑脸，如图\
  \ 7-7 所示。\n\n![我们让我们的笑脸程序更具交互性，在用户点击任何地方绘制。](img/httpatomoreillycomsourcenostarchimages2188967.png.jpg)\n\
  \n图 7-7。我们让我们的笑脸程序更具交互性，在用户点击任何地方绘制。\n\n无论你想构建什么样的应用程序，你可能都会依赖用户交互来驱动体验。想想你花最多时间的游戏或其他应用程序：它们的共同点是你可以对发生什么以及何时发生具有某种控制权。无论是移动挡子击球；按下鼠标按钮或触摸并拖动以向空中发射物体；还是点击、滑动和轻点来清除屏幕，你都在产生用户事件——而你喜爱的程序通过执行一些酷的事情来处理这些事件。让我们再构建一个交互式应用程序进行练习，然后我们将构建更多我们每天使用的此类应用程序。\n\
  \n# 点击万花镜 (ClickKaleidoscope)\n\n让我们创建函数的能力和处理交互点击的能力结合，创建一个交互式的万花镜。用户可以点击屏幕上的任何地方，并将从用户点击的位置开始绘制四个随机形状和颜色的反射螺旋。结果将看起来像我们在\
  \ Kaleidoscope.py 中的 `Kaleidoscope.py` 程序，但用户可以使用这个万花镜创建自己独特的图案。\n\n## Draw_Kaleido()\
  \ 函数\n\n让我们聊聊 `draw_Kaleido()` 函数。用户可以点击屏幕上的任何地方，并将从用户点击的位置开始绘制四个随机形状和颜色的反射螺旋。结果将看起来像我们在\
  \ Kaleidoscope.py 中的 `Kaleidoscope.py` 程序，但用户可以使用这个万花镜创建自己独特的图案。\n\n\n\n\n```python\n\
  import random\nimport turtle\nt = turtle.Pen()\nt.speed(0)\nt.hideturtle()\nturtle.bgcolor(\"\
  black\")\ncolors = [\"red\", \"yellow\", \"blue\", \"green\", \"orange\", \"purple\"\
  ,\n          \"white\", \"gray\"]\ndef draw_kaleido(x,y):\n    t.pencolor(random.choice(colors))\n\
  \    size = random.randint(10,40)\n    draw_spiral(x,y, size)\n    draw_spiral(-x,y,\
  \ size)\n    draw_spiral(-x,-y, size)\n    draw_spiral(x,-y, size)\ndef draw_spiral(x,y,\
  \ size):\n    t.penup()\n    t.setpos(x,y)\n    t.pendown()\n    for m in range(size):\n\
  \        t.forward(m*2)\n        t.left(92)\nturtle.onscreenclick(draw_kaleido)\n\
  ```\n\n我们从普通的 `import` 语句开始，然后设置海龟环境和颜色列表。接下来，我们定义了 `draw_spiral()` 函数，接着是 `draw_kaleido()`，最后我们告诉电脑监听海龟屏幕上的点击事件，并在发生点击事件时调用\
  \ `draw_kaleido()`。现在，每当用户点击绘图窗口上的某个位置时，那里就会画出一个螺旋，并跨越 x 轴和 y 轴反射，总共画出四个形状和大小相同的随机螺旋。\n\
  \n结果是一个完全交互的螺旋万花镜程序版本，它允许用户只需点击他们想要出现螺旋的屏幕部分，即可控制反射图案。图 7-8 展示了该程序的运行示例，其中包含了由螺旋构成的反射图案。\n\
  \n![通过我们这个交互式万花镜程序，你可以创建任何你想要的反射图案！](img/httpatomoreillycomsourcenostarchimages2188971.png.jpg)\n\
  \n图 7-8。通过我们这个交互式万花镜程序，你可以创建任何你想要的反射图案！\n\n尝试你自己的图案（比如你的名字首字母！）并对结果进行截图（在 Windows\
  \ 中，按住 ALT 和 PRINT SCREEN 键复制海龟窗口，然后粘贴到 Word 或你喜欢的绘图程序中；在 Mac 上，按住 COMMAND ![],\
  \ SHIFT 和 4 键，然后按空格键，最后点击海龟绘图窗口，将图片副本保存到桌面，并命名为 `Screenshot <日期和时间>.png`）。在 Twitter\
  \ 上通过 @brysonpayne 发送推文给我你的最棒截图，并带上标签 #kidscodebook，我会尽力回复的！\n\n## 你学到的知识\n\n在本章中，你学习了如何将可重用的代码块组织成函数，如何在程序的任何地方调用自己的函数，如何将信息作为参数传递给这些函数，以及如何从函数返回获取信息。我们通过告诉电脑监听鼠标点击和按键按下，编写了第一个事件驱动程序，你并学会了如何编写自己的回调函数来响应用户事件。\n\
  \n我们开发了第一个完全交互式的程序。利用你在本章中学的技能，你已经准备好编写更高级的应用程序了。我们经常喜欢的应用程序通过响应点击、触摸、按键按下等操作，让用户获得一种控制程序的体验。\n\
  \n在掌握了本章的概念后，你应该能够完成以下操作：\n\n*   使用函数使代码更具可重用性。\n*   将代码组织并分组为函数。\n*   使用 `def`\
  \ 关键字在 Python 中定义函数。\n*   在你编写的程序中调用自己的函数。\n*   定义并使用接受参数作为输入值的函数。\n*   编写在调用时会返回值的函数。\n\
  *   将数学公式转换为返回函数结果的函数。\n*   解释事件驱动程序的一些特性。\n*   编写一个使用事件处理程序的基础事件驱动应用。\n*   编写一个接受鼠标点击并在屏幕上绘图的程序。\n\
  *   为键盘事件编写事件处理程序代码。\n* 编写带有参数的事件处理函数。\n*   使用屏幕上的 x 和 y 坐标绘制特定图案（例如万花镜）。\n\n##\
  \ 编程挑战\n\n这里有三个挑战，用于扩展你在本章中学到的知识。如需查看这些挑战的示例答案，请访问 `[`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)`。\n\
  \n### #1：镜像笑脸\n\n创建一个 `ClickAndSmile.py` 和 `ClickKaleidoscope.py` 程序的组合，在点击时在屏幕的四个镜像角落画出一个笑脸，就像万花镜程序画螺旋时的那样。如果你想接受一个高级挑战，请画两个倒置的笑脸，让它们看起来真的像是跨\
  \ x 轴镜像的。\n\n## #2：更多乒乓球计算\n\n修改乒乓球计算器，让要求用户输入乒乓球的数量。让它告诉用户这些乒乓球如果堆叠在一起会有多高，以及这些乒乓球会有多重。\n\
  \n## #3：更好的绘图程序\n\n修改 `ArrowDraw.py` 程序，允许用户以更小的增量（例如 45 度或 30 度）旋转海龟，以提供更精细的控制。\n\
  \n# 第 8 章：定时器与动画：迪士尼会怎么做？\n\n我在青少年时期学习编程的一种是通过编写短游戏和动画，然后修改代码来实现新功能。我惊讶地看到代码立即在屏幕上产生图像，我相信你们也会很喜欢的。游戏和动画有几个共同点。首先，它们很有趣！其次，它们都涉及到在屏幕上绘制图形并随时间改变图形以产生运动的幻觉。从这本书本书开始我们就能绘制图形，但海龟库运行动画太慢。在本章中，我们将安装并使用一个新模块\
  \ `Pygame`，它允许我们利用已学的技能绘制、制作动画，甚至创建街机游戏。\n\n\n\n\n要开始之前，请从 [`www.pygame.org/`](http://www.pygame.org/)\
  \ 的下载页面下载安装程序并安装 `pygame` 模块。对于 Windows，你可能下载 `pygame-1.9.1 .win32-py3.1.msi`，如果遇到任何问题，请查看附录\
  \ B。对于 Mac 和 Linux，安装过程更为复杂；请查看附录 B 或访问 [`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)\
  \ 获取分步说明。\n\n你可以通过在 Python 终端中输入以下内容来检查 Pygame 是否安装成功无误：\n\n```\n>>> import pygame\n\
  ```\n\n如果返回的是普通的 `>>>` 提示符，说明 Python 能够无错误地找到 `pygame` 模块，且 Pygame 库已准备就绪。\n\n##\
  \ 使用 Pygame 画一个点\n\n一旦安装了 Pygame，你就可以运行一个短小的示例程序在屏幕上画一个点，就像图 8-2 中所示那样。\n\n![ShowDot.py\
  \ 程序的运行](img/httpatomoreillycomsourcenostarchimages2188977.png.jpg)\n\n图 8-2. ShowDot.py\
  \ 程序的运行\n\n在新的 IDLE 窗口中输入以下内容，或从 [`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)\
  \ 下载：\n\n### ShowDot.py\n\n```\n import pygame\n\n➊ pygame.init()\n➋ screen = pygame.display.set_mode([800,600])\n\
  \n➌ keep_going = True\n➍ GREEN = (0,255,0)    # 绿色的 RGB 三元组\n   radius = 50\n\n\
  ➎ while keep_going:\n➏     for event in pygame.event.get():\n➐         if event.type\
  \ == pygame.QUIT:\n               keep_going = False\n➑     pygame.draw.circle(screen,\
  \ GREEN, (100,100), radius)\n➒     pygame.display.update()\n\n➓ pygame.quit()\n\
  ```\n\n让我们逐行分析这个程序。首先，我们导入 `pygame` 模块以使用其功能。在 ➊ 处，我们`initialize` Pygame，或者说将其设置为可用。每当你想使用\
  \ Pygame 时，都需要调用 `pygame.init()` 命令，而且它始终位于 `import pygame` 命令之后、任何其他 Pygame 函数之前。\n\
  \n在 ➋ 处，`pygame.display.set_mode([800,600])` 创建了一个宽 800 像素、高 600 像素的显示窗口。我们将其存储在一个名为\
  \ `screen` 的变量中。在 Pygame 中，窗口和图形被称为表面（surfaces），而显示表面 `screen` 是我们绘制所有其他图形的主窗口。\n\
  \n在 ➌ 处，你可能认出循环变量 `keep_going`：我们曾在第 6 章 中的 `HighCard.py` 和 `FiveDice.py` 游戏循环中使用它作为一个布尔标志，告诉程序继续运行。在我们的\
  \ Pygame 示例中，我们使用游戏循环来持续绘制图形屏幕，直到用户关闭窗口。\n\n在 ➍ 处，我们设置了两个变量 `GREEN` 和 `radius` 用于绘制我们的圆。`GREEN`\
  \ 变量被设置为 RGB 三元组值 `(0,255,0)`，这是一种亮绿色。（RGB，或红、绿、蓝，是指定颜色的许多方法之一。要选择一种颜色，你需要选择三个数字，每个数字介于\
  \ 0 到 255 之间。第一个数字决定颜色中红色的量，第二个数字是绿色的量，第三个是蓝色。我们选择 255 作为绿色的值，红色和蓝色设为 0，所以我们的 RGB\
  \ 颜色全是绿色，没有红色或蓝色。）我们的变量 `GREEN` 是一个常量。我们有时用全大写来表示`constants` (#apd.html_gloss01_015)—即我们不打算改变的变量。由于颜色在整个程序中应该保持不变，因此对\
