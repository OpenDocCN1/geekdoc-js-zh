  \ 软件工程师\n\n> “Bryson Payne 博士是一位高水平的计算机科学家和教授，通过《教你的孩子编程》，他让老幼读者都能轻松触及计算机的力量。”\n\
  > —Dr. Antonio Sanz Montemayor，西班牙胡安卡洛斯大学信息学教授\n\n> “引人入胜、富有想象力的应用程序与价值连生的技能的完美结合。”\n\
