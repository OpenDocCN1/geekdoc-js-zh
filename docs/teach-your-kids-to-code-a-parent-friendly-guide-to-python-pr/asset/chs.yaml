  \ 位置处画了一个半径为 50 的绿色圆。我们在 `screen` 窗口的 `(100,100)` 位置处画了一个半径为 50 的绿色圆。\n\n➒ 处，我们调用\
  \ `pygame.display.update()`。\n\n➓ 处，`pygame.quit()` 退出程序。\n\n\n\n\n\n在本节中，我们将修改\
  \ `ShowDot.py` 程序，使其显示一个笑脸图像而不是绿色圆圈，如图图 8-4 所示。\n\n![Pic.py 在屏幕上绘制了图像 CrazySmile.bmp](img/httpatomoreillycomsourcenostarchimages2188983.png.jpg)\n\
  \n图 8-4。`ShowPic.py` 在屏幕上绘制了图像 `CrazySmile.bmp`。\n\n在构建 `ShowPic.py` 程序时，我们将学习 Pygame\
  \ 中游戏或动画的三个主要部分。首先是**设置**，在其中导入所需的模块、创建屏幕并初始化一些重要的变量。然后是**游戏循环**，它负责处理事件、绘制图形并更新显示。这个游戏循环是一个\
  \ `while` 循环，只要用户不退出游戏，它就会一直运行。最后，我们需要一种方法在用户退出游戏时结束程序。\n\n### 设置\n\n首先，下载笑脸图像并将其保存在与你的\
  \ Python 程序相同的文件夹中。访问 [`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)\
  \ 源代码下载，并将图像 `CrazySmile.bmp` 保存到你保存 `.py` 文件的文件夹中。将 `.py` 文件放在哪里并不重要，只需确保 BMP（*bitmap*，一种常见的图像文件格式的缩写）图像文件保存到相同的位置即可。\n\
  \n接下来，让我们处理设置：\n\n```\nimport pygame       # Setup\n   pygame.init()\n   screen\
  \ = pygame.display.set_mode([800,600])\n   keep_going = True\npic = pygame.image.load(\"\
  CrazySmile.bmp\")\n```\n\n一如既往，我们导入 `pygame` 模块，然后使用 `pygame.init()` 函数进行初始化。接下来，我们将\
  \ `screen` 设置为大小为 800×600 像素的新 Pygame 窗口。我们创建一个布尔标志 `keep_going` 来控制游戏循环，并将其设置为\
  \ `True`。最后，我们做了一个新操作：在 ➊ 处，我们使用 `pygame.image.load()`，它从文件中加载图像。我们为图像文件创建一个变量并加载\
  \ `CrazySmile.bmp`，我们在程序中将其引用为 `pic`。\n\n## 创建游戏循环\n\n此时，我们还没有绘制任何内容，但已经设置了 Pygame\
  \ 并加载了图像。游戏循环是我们实际上在屏幕上显示笑脸图像的地方。这也是我们处理用户事件的地方。让我们从处理一个重要的事件开始：用户选择退出游戏。\n\n```\n\
  while keep_going:    # Game loop\n       for event in pygame.event.get():\n    \
  \     if event.type == pygame.QUIT:\n               keep_going = False\n```\n\n\
  只要 `keep_going` 为 `True`，我们的游戏循环就会一直运行。在循环内部，我们立即检查来自用户的事件。在高级别游戏中，用户可以同时触发很多事件，例如在移动鼠标的同时按下键盘上的方向键并滚动鼠标轮。\n\
  \n在这个简单的程序中，我们监听的唯一事件是用户是否点击了关闭窗口按钮来退出程序。我们在 ➊ 处检查这一点。如果用户通过尝试关闭窗口触发了 `pygame.QUIT`\
  \ 事件，我们想让游戏循环退出。我们通过将 `keep_going` 设置为 `False` 来实现这一点。\n\n我们仍然需要将图片绘制到屏幕并更新绘制窗口，以确保所有内容都出现在屏幕上，因此我们在游戏循环中添加最后两行：\n\
  \n```\nscreen.blit(pic, (100,100))\npygame.display.update()\n```\n\n`blit()` 方法将\
  \ `pic`（我们从磁盘加载的图像，即我们的笑脸）绘制到我们的显示表面 `screen` 上。当我们想要将像素从一个表面（如我们从磁盘加载的图像）复制到另一个表面（如绘制窗口）时，就会使用\
  \ `blit()`。在这里，我们需要使用 `blit()`，因为 `pygame.image.load()` 函数的作用与我们之前用于绘制绿色点的 `pygame.draw.circle()`\
  \ 函数不同。所有的 `pygame.draw` 函数都接受表面作为参数，因此通过将 `screen` 传递给 `pygame.draw.circle()`，我们能够让\
  \ `pygame.draw.circle()` 绘制到我们的显示窗口。但 `pygame.image.load()` 不接受表面作为参数；相反，它会自动为你的图像创建一个新的独立表面。除非使用\
  \ `blit()`，否则图像不会出现在原始的绘制屏幕上。\n\n![无标题的图像](img/httpatomoreillycomsourcenostarchimages2188985.png.jpg)\n\
  \n在这种情况下，我们告诉 `blit()` 我们想在位置 `(100,100)` 绘制 `pic`，或者从屏幕左上角向右 100 像素向下 100 像素（在\
  \ Pygame 的坐标系中，原点是左上角；参见图 8-3）。\n\n## 退出程序\n\n代码的最后部分将在用户退出后结束程序：\n\n```\npygame.quit()\
  \        # Exit\n```\n\n## 整合在一起\n\n将所有内容整合在一起，只要你将图像保存在 `ShowPic.py` 程序相同的目录下，你就能看到我们的\
  \ `CrazySmile.bmp` 图像——这里是完整的列表：\n\n### ShowPic.py\n\n```\nimport pygame       #\
  \ Setup\npygame.init()\nscreen = pygame.display.set_mode([800,600])\nkeep_going\
  \ = True\npic = pygame.image.load(\"CrazySmile.bmp\")\nwhile keep_going:    # Game\
  \ loop\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
  \            keep_going = False\n    screen.blit(pic, (100,100))\n    pygame.display.update()\n\
  \npygame.quit()        # Exit\n```\n\n当你点击关闭窗口按钮时，显示窗口应该关闭。\n\n这段代码包含了我们在此基础上构建的基础组件，使程序更具交互性。在本章的剩余部分以及第\
  \ 9 章\")中，我们将在游戏循环中添加代码来响应不同的事件（例如，在用户移动鼠标时让屏幕上的图像移动）。现在让我们创建一个绘制动画跳球的程序吧！\n\n掌握时机：移动与弹跳\n\
  \n通过对我们的 `ShowPic.py` 应用进行一点修改，我们已经拥有了创建动画（或运动幻觉）所需的技能。与其在每次通过游戏循环时都在固定位置显示笑脸图像，如果我们每帧帧都稍微改变该位置会怎样？我说的“帧”是指通过游戏循环的每一次。这个词源于人们制作动画的一种：他们绘制成千上万张独立的图片，每张图片与前一张略有不同。一张图片被视为一帧。动画师随后将所有图片放在一条胶片上，并通过投影仪运行胶片。当这些图片连续快速显示时，图片中的角色看起来就像在移动。\n\
  \n\n\n\n通过计算机，我们可以通过在屏幕上画图、清除屏幕、轻微移动图片然后再次绘制来创建相同的效果。这种效果看起来有点像图 8-5。![在这次动画的首次尝试中，我们的笑脸图像将划出屏幕。](img/httpatomoreillycomsourcenostarchimages2188989.png.jpg)\n\
  \n图 8-5。在这次动画的首次尝试中，我们的笑脸图像将划出屏幕。\n\n我们仍然将每次绘制的操作称为一个 `frame`（帧），而我们动画的速度取决于我们每秒绘制多少个`帧/秒\
  \ (fps)`。视频游戏的运行速度可能是每秒 60–120 帧，就像高清电视一样。美国旧旧标准电视运行速度为每秒 30 帧，许多电影投影机运行速度为每秒 24\
  \ 帧（新的高清数字投影机运行速度可以达到每秒 60 帧或更高）。\n\n如果你制作或看过翻书动画（在笔记本的页页角上画图，然后翻动这些页面来创建一个微型卡通），你就见过这种运动幻觉可以在许多不同的帧率下创建。我们的目标是达到每秒\
  \ 60 帧左右的速度，这个速度足够创建流畅的动画了。\n\n## 移动笑脸\n\n我们可以通过在 `while` 循环中随时间在不同位置绘制笑脸图像来创建简单的运动。换句话说，在我们的游戏循环中，我们只需要更新图片的\
  \ (`x`, `y`) 位置，然后在每次循环执行时在那个新位置绘制它。\n\n我们为 `ShowPic.py` 添加了两个变量：`picx` 和 `picy`，分别代表图像在屏幕上的\
  \ x 坐标和 y 坐标。我们将这些变量添加到程序设置部分的末尾，然后将程序的新版本保存为 `SmileyMove.py`（最终版本见 SmileyMove.py）。\n\
  \n```\n import pygame       # Setup\n   pygame.init()\n➊ screen = pygame.display.set_mode([600,600])\n\
  \   keep_going = True\n   pic = pygame.image.load(\"CrazySmile.bmp\")\n➋ colorkey\
  \ = pic.get_at((0,0))\n➌ pic.set_colorkey(colorkey)\n   picx = 0\n   picy = 0\n\
  ```\n\n### Note\n\n➋ 和 ➌ 处的代码是针对一个微小问题的可选修复。如果 `CrazySmile.bmp` 图像在你的屏幕上看起来有黑色的正角，你可以包含这两行代码以确保这些角看起来是透明的。\n\
  \n注意我们还将窗口屏幕更改为 600×600 像素，以便在 ➊ 处使窗口成为正方形。游戏循环将以与 `ShowPic.py` 相同的方式开始，但我们将添加代码在每次循环运行时将\
  \ `picx` 和 `picy` 变量改变 1 像素：\n\n```\nwhile keep_going:    # Game loop\n    for event\
  \ in pygame.event.get():\n        if event.type == pygame.QUIT:\n            keep_going\
  \ = False\n\n    picx += 1        # Move the picture\n    picy += 1\n```\n\n`+=`\
  \ 运算符会将值加到左侧变量（`picx` 和 `picy`），因此通过 `+= 1`，我们告诉计算机希望在每次循环中将图片的 x 和 y 坐标 `(picx,\
  \ picy)` 改变 1 像素。\n\n最后，我们需要将图像复制到屏幕的新位置，更新显示，并告诉程序如何退出：\n\n```\n screen.blit(pic,\
  \ (picx, picy))\n    pygame.display.update()\npygame.quit()        # Exit\n```\n\
  \n如果你运行这些代码，你将看到我们的图像飞起来了！事实上，你必须看快一点，因为它会直接移出屏幕。\n\n回看图 8-5，可以看一眼笑脸图像滑出视野之前的样子。\n\
  \n这个第一个版本即使在笑脸离开绘制窗口后也可能在显示器上留下像素痕迹。我们可以通过在每帧之间清除屏幕来让动画更整洁。我们在笑脸后面看到的线条是笑脸图像的左上角像素；当我们每帧都向下并向右移动以绘制图像的新版本并更新显示时，我们都遗留了上一张画的几个离散像素。\n\
  \n我们可以通过在绘制循环中添加一个 `screen.fill()` 命令来修复这个问题。`screen.fill()` 命令接受颜色作为参数，因此我们需要告诉它我们想用什么颜色来填充绘制屏幕。让我们为\
  \ `BLACK` 添加一个变量（对 `BLACK` 使用全大写以表示它是一个常量），并将其设置为黑色的 RGB 颜色三元组 `(0,0,0)`。\n\n##\
  \ 使用 Clock 类制作笑脸动画\n\n每秒 30 到 60 帧即可实现流畅的动画，因此我们不需要那些飞速而逝的帧。\n\nPygame 有一个工具可以帮助我们控制动画的速度：`Clock`\
  \ 类。*类*就像一个模板，用于创建特定类型的*对象*，并带有帮助这些对象以特定方式运行的函数和值。把类比作饼干模具，把对象比作饼干：当我们想要创建某种形状的饼干时，我们构建一个可以随时使用的饼干模具。与函数帮助我们封装重用代码一样，类允许我们将数据和函数封装到一个可重用的模板中，供以后使用。\n\
  \n我们可以通过此行代码在程序设置中添加一个 `Clock` 类的对象：\n\n```\ntimer = pygame.time.Clock()\n```\n\n\
  这创建了一个名为 `timer` 的变量，它关联到一个 `Clock` 对象。这个 `timer` 将允许我们在每次游戏循环时轻轻暂停并等待足够的时间，以确保我们每秒绘制的帧不超过特定数量。\n\
  \n在我们的游戏循环中添加以下代码，将我们名为 `timer` 的 `Clock` 每秒“滴答”60 次，从而将帧率保持在 60 fps：\n\n```\ntimer.tick(60)\n\
  ```\n\n\n\n\n```python\nimport pygame                # Setup\npygame.init()\nscreen\
  \ = pygame.display.set_mode([600,600])\nkeep_going = True\npic = pygame.image.load(\"\
  CrazySmile.bmp\")\ncolorkey = pic.get_at((0,0))\npic.set_colorkey(colorkey)\npicx\
  \ = 0\npicy = 0\nBLACK = (0,0,0)\ntimer = pygame.time.Clock()  # Timer for animation\n\
  \nwhile keep_going:            # Game loop\n    for event in pygame.event.get():\n\
  \        if event.type == pygame.QUIT:\n            keep_going = False\n\n    picx\
  \ += 1                # Move the picture\n    picy += 1\n\n    screen.fill(BLACK)\
  \       # Clear screen\n    screen.blit(pic, (picx,picy))\n    pygame.display.update()\n\
  \    timer.tick(60)           # Limit to 60 frames per second\n\npygame.quit() \
  \               # Exit\n```\n\n剩下的问题是笑脸几秒钟后仍然会完全跑出屏幕。这并不很有趣。让我们修改程序，让笑脸留在屏幕上，在各个角落之间弹跳。\n\
  \n## 让笑脸在墙上弹跳\n\n我们通过在每次通过游戏循环时更改所绘制图像的位置，添加了帧与帧之间的运动。我们已经看到了如何通过添加一个 `Clock` 对象并告诉它每秒\
  \ `tick()` 多少次来调节动画的速度。在这一节中，我们将看到如何让笑脸留在屏幕上。这种效果看起来有点像图 8-6，笑脸似乎在绘制窗口的两个角落之间来回弹跳。\n\
  \n![我们的目标是让笑脸在屏幕各个角落之间“弹跳”。](img/httpatomoreillycomsourcenostarchimages2188993.png.jpg)\n\
  \n图 8-6。我们的目标是让笑脸在屏幕各个角落之间“弹跳”。\n\n之前我们的图像跑出屏幕的原因是由于没有为动画设置*边界*或限制。我们在屏幕上绘制的所有内容都是*虚拟*的——这意味着它们在现实世界中并不——所以物体之间不会真正相互碰撞。如果我们想让屏幕上的虚拟对象相互作用，我们必须通过编程逻辑来创建这些相互作用。\n\
  \n## 撞击墙壁\n\n我说我们要让笑脸“弹回”屏幕边缘时，我的意思是当笑脸到达屏幕边缘时，我们想要改变它移动的方向，使其看起来像是从屏幕的坚固边缘弹了回来。为了做到这一点，我们需要测试笑脸的\
  \ `(picx,picy)` 位置是否已经达到了屏幕边缘的虚拟边界。我们将这种逻辑称为*碰撞检测*，因为我们正试图*检测*（或注意到）*碰撞*何发生时刻，例如笑脸图像“击中”绘制窗口的边缘。\n\
  \n我们知道可以使用 `if` 语句来测试条件，因此可以通过检查 `picx` 是否大于某个值，来查看图像是否正在触碰或*碰撞*屏幕的右侧。\n\n让我们设想那个值可能是多少。我们知道屏幕宽度为\
  \ 600 像素，因为我们使用 `pygame.display.set_mode([600,600])` 创建了屏幕。我们可以使用 600 作为边界，但笑脸仍然会移出屏幕边缘，因为坐标对\
  \ `(picx,picy)` 是我们笑脸图像左上角像素的位置。\n\n为了找到我们的逻辑边界——即 `picx` 必须到达才能让笑脸看起来像击中了 `screen`\
  \ 窗口右边缘的虚拟线——我们需要知道图片有多宽。因为我们知道 `picx` 是图像的左上角且它向右延伸，我们只需要将图片的宽度加到 `picx` 上，当这个总和等于\
  \ 600 时，我们就知道图像的右边缘正触碰窗口的右边缘。\n\n找到图像宽度的一种方法是查看文件的属性。在 Windows 中，右键点击 *CrazySmile.bmp*\
  \ 文件，选择“属性”菜单项，然后点击“详细信息”选项。在 Mac 上，点击 *CrazySmile.bmp* 文件以选中它，按下 ![](img/httpatomoreillycomsourcenostarchimages2188973.png.jpg)\
  \ -I 获取文件信息窗口，然后点击“更多信息”。你将看到图片的宽度和高度，如图 8-7 所示。\n\n![为了确定我们的虚拟边界以便我们的笑脸可以在其上弹跳，我们需要知道图像文件的宽度。](img/httpatomoreillycomsourcenostarchimages2188995.png.jpg)\n\
  \n图 8-7。为了确定我们的虚拟边界以便我们的笑脸可以在其上弹跳，我们需要知道图像文件的宽度。\n\n## 改变方向\n\n从边缘“弹回”意味着撞击边缘后向相反方向移动。图像移动的方向是由\
  \ `picx` 和 `picy` 的更新控制的。在我们旧的 *SmileyMove.py* 中，我们每次通过 `while` 循环时向 `picx` 和 `picy`\
  \ 加 1 像素：\n\n```python\npicx += 1\npicy += 1\n```\n\n然而，这些行让我们的图像每次都向下方移动 1 像素；并没有发生“弹跳”或改变方向，因为我们从未改变加到\
  \ `picx` 和 `picy` 上的数字。这两行意味着我们保证以每帧 1 像素的速度向右下方移动，每一帧，即使在笑脸离开屏幕后也是。\n\n![无说明的图片](img/httpatomoreillycomsourcenostarchimages218999.png.jpg)\n\
  \n相反，我们可以将常量值 `1` 改为一个变量，该变量将代表*速度*，即图像每帧应该移动的像素数。速度是单位时间内的运动量。例如，在短时间内移动很多的汽车是以*高速度*移动的。蜗牛在相同时间内几乎不动，它是以*低速度*移动。我们可以在程序的设置部分定义一个名为\
  \ `speed` 的变量，代表我们希望每帧移动的像素量：\n\n```python\nspeed = 5\n```\n\n然后，我们在游戏循环中只需要每次通过循环时用这个新的速度量（而不是常量量\
  \ `1`）来改变 `picx` 和 `picy` 即可：\n\n```python\npicx += speed\npicy += speed\n```\n\n\
  \n\n\n在 `SmileyMove.py` 中，每秒 60 帧时每帧移动一个像素似乎太慢了，因此我将速度增加到 `5` 让它移动得更快。但我们仍然没有在屏幕的右边缘反弹；它只是再次快速离开了屏幕，因为当我们碰到屏幕边缘时，`speed`\
  \ 变量并没有发生变化。\n\n我们可以通过添加碰撞检测逻辑来解决最后一个问题——也就是说，添加测试我们是否撞到了屏幕左侧或右侧虚拟边界的测试：\n\n```\n\
  if picx <= 0 or picx + pic.get_width() >= 600:\n    speed = -speed\n```\n\n首先，我们通过检查\
  \ `picx` 来判断屏幕的左右边界：看它是否试图在负 x 坐标值处绘制（即 `x < 0` 的屏幕左侧），或者 `picx + pic.get_width()`\
  \ 总和超过了屏幕 600 像素的宽度（这意味着图片的起始 x 坐标加上它的宽度已经超出了屏幕右边缘）。如果发生其中任何一种，我们就知道移动得太远了，需要改变运动方向。\n\
  \n注意，当其中任一个边界测试结果为 `True` 时，我们使用的技巧。通过设置 `speed = -speed`，我们通过将 `speed` 乘以 -1（或使其变为自身的负数）来改变\
  \ `while` 循环中运动的方向。可以这样想：如果我们继续以 `speed` 等于 `5` 进行循环，直到我们的 `picx` 加上图像宽度达到 600 像素的屏幕右边缘（`picx\
  \ + pic.get_width() >= 600`），设置 `speed = -speed` 将把 `speed` 从 `5` 变为 `-5`（负五）。然后，当我们在下一次循环中改变\
  \ `picx` 和 `picy` 的，，我们将在位置上加上 `-5`。这等同于从 `picx` 和 `picy` 中减去 5，或者在屏幕上向左和向上移动。如果这有效，我们的笑脸现在会在屏幕的右下角反弹，并开始反向移动，回到屏幕左上角的\
  \ (0, 0)。\n\n但这还没有全部！因为我们的 `if` 语句同样检查屏幕左边界（`picx <= 0`），当我们的笑脸看起来撞到了屏幕左侧时，它会再次将\
  \ `speed` 改为 `-speed`。如果 `speed` 是 `-5`，这会将其变为 `-(-5)`，即 `+5`。所以，如果我们的负 `speed`\
  \ 变量导致我们每帧向左向上移动 5 像素，一旦我们在屏幕左边缘碰到 `picx <= 0`，`speed = -speed` 将把 `speed` 变回正 `5`，笑脸图像将再次向右和向下移动，即正\
  \ x 轴和 y 轴方向。\n\n## 汇总\n\n尝试我们应用的 1.0 版本 `SmileyBounce1.py`，查看笑脸如何在窗口的左上角和右下角之间往回反弹，永远离开离开屏幕。\n\
  \n#### SmileyBounce1.py\n\n```\nimport pygame       # Setup\npygame.init()\nscreen\
  \ = pygame.display.set_mode([600,600])\nkeep_going = True\npic = pygame.image.load(\"\
  CrazySmile.bmp\")\ncolorkey = pic.get_at((0,0))\npic.set_colorkey(colorkey)\npicx\
  \ = 0\npicy = 0\nBLACK = (0,0,0)\ntimer = pygame.time.Clock()\nspeed = 5\n\nwhile\
  \ keep_going:    # Game loop\n    for event in pygame.event.get():\n         if\
  \ event.type == pygame.QUIT:\n            keep_going = False\n    picx += speed\n\
  \    picy += speed\n\n    if picx <= 0 or picx + pic.get_width() >= 600:\n     \
  \   speed = -speed\n\n    screen.fill(BLACK)\n    screen.blit(pic, (picx,picy))\n\
  \    pygame.display.update()\n    timer.tick(60)\n\npygame.quit()       # Exit\n\
  ```\n\n通过程序的第一个版本，我们创建了一个看起来在正方形绘图窗口两个角之间平滑弹跳的笑脸。我们能够实现这种效果，正是是因为窗口是一个完美的正方形，大小为\
  \ 600×600 像素，并且因为我们总是以相同的量（`speed`）改变 `picx` 和 `picy` 值——我们的笑脸只在 `x` = `y` 的对角线上移动。通过让图像保持在这简单的路径上，我们只需要检查\
  \ `picx` 是否越过了屏幕左边缘和右边缘的边界值。\n\n如果我们想在一个不是完美正方形的窗口（例如 800×600）中在屏幕的所有四个边缘（上、下、左、右）反弹呢？我们需要添加一些逻辑来检查\
  \ `picy` 变量是否通过了上限或下限（屏幕的顶部或底部），并且我们需要跟踪水平和垂直速度。我们下一步这样做。\n\n### 在边缘反弹\n\n在 `SmileyBounce1.py`\
  \ 中，我们想要在屏幕的所有四个边缘反弹。首先，让我们更新屏幕尺寸为 800×600：\n\n```python\nscreen = pygame.display.set_mode([800,600])\n\
  ```\n\n### 水平和垂直速度\n\n首先，分离水平和垂直速度。我们现在有两个速度组件：用于水平的 `speedx`（`speedx` 的负值将笑脸向左移动；正值将向右移动）以及用于垂直的\
  \ `speedy`。我们在设置中初始化 `speedx` 和 `speedy`：\n\n```python\nspeedx = 5\nspeedy = 5\n\
  ```\n\n然后我们可以修改位置更新：\n\n```python\npicx += speedx\npicy += speedy\n```\n\n### 撞墙\n\
  \n最后一部分需要解决的是四个边缘的边界检测。首先，让我们更新左右边界以匹配新的 800 像素屏幕宽度：\n\n```python\nif picx <= 0\
  \ or picx + pic.get_width() >= 800:\n    speedx = -speedx\n```\n\n注意，左边缘边界仍然是 `picx\
  \ <= 0`，因为 0 仍然是左边界。但这次我们的右边缘边界变成了 `picx + pic.get_width() >= 800`，因为我们的屏幕现在是 800\
  \ 像素宽。\n\n让我们对 `picy` 执行同样的操作用于上下边缘：\n\n```python\nif picy <= 0 or picy + pic.get_height()\
  \ >= 600:\n    speedy = -speedy\n```\n\n\n\n为了测试我们的笑脸是否撞击了屏幕顶边缘，我们使用 `picy <= 0`，这与左侧边缘的\
  \ `picx <= 0` 类似。为了确定我们的笑脸是否撞击了屏幕底部边缘，我们需要知道绘图窗口的高度（600 像素）以及图像的高度（`pic.get_height()`），并且我们需要检查图像的顶部\
  \ `picy` 加上图像的高度 `pic.get_height()` 总和是否大于屏幕的高度（ 600 像素）。\n\n如果 `picy` 超出了这些顶部和底部边界，我们需要改变垂直速度的方向（`speedy\
  \ = -speedy`）。这会让笑脸看起来像是从窗口的底部边缘反弹并向上移动，或者从顶部反弹并向下的移动。\n\n### 整合所有内容\n\n当我们将整个程序整合到\
  \ `SmileyBounce2.py` 中时，我们得到了一个看起来非常真实的、弹跳可跳的小球，只要我们运行程序，它就能在屏幕的所有四个边缘上反弹。\n\n####\
  \ SmileyBounce2.py\n\n```\nimport pygame        # Setup\npygame.init()\nscreen =\
  \ pygame.display.set_mode([800,600])\nkeep_going = True\npic = pygame.image.load(\"\
  CrazySmile.bmp\")\ncolorkey = pic.get_at((0,0))\npic.set_colorkey(colorkey)\npicx\
  \ = 0\npicy = 0\nBLACK = (0,0,0)\ntimer = pygame.time.Clock()\nspeedx = 5\nspeedy\
  \ = 5\n\nwhile keep_going:    # Game loop\n    for event in pygame.event.get():\n\
  \        if event.type == pygame.QUIT:\n            keep_going = False\n    picx\
  \ += speedx\n    picy += speedy\n\n    if picx <= 0 or picx + pic.get_width() >=\
  \ 800:\n        speedx = -speedx\n    if picy <= 0 or picy + pic.get_height() >=\
  \ 600:\n        speedy = -speedy\n\n    screen.fill(BLACK)\n    screen.blit(pic,\
  \ (picx, picy))\n    pygame.display.update()\n    timer.tick(60)\n\npygame.quit()\
  \        # Exit\n```\n\n反弹看起来非常真实。如果笑脸以 45 角的向下向右角度朝底部边缘移动，它将以 45 角的向上向右角度反弹。你可以尝试不同的\
  \ `speedx` 和 `speedy` 值（例如，`3` 和 `5`，或者 `7` 和 `4`），来观察每次反弹时角度的变化。\n\n为了好玩，你可以注释掉\
  \ `SmileyBounce2.py` 中的 `screen.fill(BLACK)` 这一行，看看笑脸在屏幕每个边缘反弹时经过的路径。当你注释掉一行时，通过在开头添加一个井号\
  \ `#` 将其转换为注释，如下：\n\n```\n# screen.fill(BLACK)\n```\n\n这告诉程序忽略该行的指令。现在，屏幕在每次绘制完笑脸后不会被擦除，你将看到由动画留下的轨迹创建的图案，如图\
  \ 8-9 所示。因为每个新笑脸都画在上一个之上，结果在绘制过程中看起来就像酷炫的复古 3D 屏保器艺术。\n\n我们的碰撞检测逻辑允许我们创造出实心笑脸在实心绘图屏幕四个边缘上反弹的幻象。这是对原始版本的改进，之前的版本会让笑脸滑入虚无中。当我们创建允许用户与屏幕上的组件交互的游戏，并允许这些组件看起来像是在相互交互时（例如《俄罗斯方块》），我们正在使用在这里构建的同样的碰撞检测和边界检查。\n\
  \n![如果我们注释掉每帧后清除屏幕的程序行，我们的笑脸将留下一个酷炫图案的弹跳轨迹。](img/httpatomoreillycomsourcenostarchimages2189005.png.jpg)\n\
  \n图 8-9。如果我们注释掉每帧后清除屏幕的程序行，我们的笑脸将留下一个酷炫图案的弹跳轨迹。\n\n## 你学到了什么\n\n在本章中，你学会了如何通过随着时间在屏幕的不同位置绘制图像来创造运动的幻象，即我们说的动画。我们看到\
  \ Pygame 模块如何让游戏游戏或动画变得快得多，因为它拥有数百个函数，可以让游戏应用中的几乎任何内容都变得更容易，从绘制图像到创建基于计时器的动画——甚至检查碰撞。我们在电脑上安装了\
  \ Pygame，以便能够使用它的功能来创建我们自己的有趣应用。\n\n你学习了我们可能在 Pygame 中构建的游戏或应用的结构：一个设置部分；一个处理事件、更新和绘制图形并更新显示的游戏循环；最后是一个退出部分。\n\
  \n我们开始 Pygame 编程是从在屏幕上选定位置画一个简单的绿点开始的，但我们很快就转向从磁盘上（保存在程序同一文件夹中）的文件中绘制图片到显示屏幕上。你了解到\
  \ Pygame 的坐标系与 Turtle 库不同，原点 (0, 0) 位于屏幕的左上角，随着向下移动，y 坐标值为正。\n\n你学会了如何通过在屏幕上绘制对象、清除屏幕，然后在稍微不同的位置绘制对象来创建动画。我们看到\
  \ `pygame.time.Clock()` 对象通过限制动画每秒绘制的次数（即帧率，fps），让我们的动画更加稳定。\n\n我们构建了自己的碰撞检测来检查物体“撞击”屏幕边缘，然后通过改变速度或速度的方向（乘以\
  \ -1）让物体看起来在反弹。\n\n本章的酷炫应用让我们具备了以下技能：\n\n*   在自己的 Python 程序中安装并使用 `pygame` 模块。\n\
  *   解释 Pygame 应用的结构，包括设置、游戏循环和退出。\n*   构建处理事件、更新和绘制图形并更新显示的游戏循环。\n*   使用 `pygame.draw`\
  \ 在屏幕上绘制形状。\n*   使用 `pygame.image.load()` 从磁盘加载图像。\n*   使用 `blit()` 函数在屏幕上绘制图像和对象。\n\
  *   通过在不同位置重复绘制对象创建动画。\n*   使用 `pygame.time.Clock()` 器的 `tick()` 函数限制帧率，使动画平滑、干净且可预测。\n\
  *   通过构建 `if` 逻辑检查碰撞检测，例如图形撞击屏幕边缘。\n*   通过改变每一帧 x 和 y 方向的移动量，控制屏幕上移动物体的速度。\n\n##\
  \ 编程挑战\n\n这里有三个挑战题可以扩展你在本章开发的技能。示例答案请访问 [`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)。\n\
  \n#1 变色圆点\n\n让我们进一步探索 RGB 色元组。在本章中，我们处理了一些 RGB 颜色；记得绿色是 `(0,255,0)`，黑色是 `(0,0,0)`，依此类推。在\
  \ [`colorschemer.com/online/`](http://colorschemer.com/online/) 上，输入 0 到 255 的不同红绿蓝值，看看通过组合屏幕像素不同量的红、绿、蓝光可以创建哪些颜色。首先选择你自己的色元组用于\
  \ `ShowDot.py` 程序。然后修改程序，在屏幕的不同位置绘制更大或更小的点。最后，尝试使用 `random.randint(0,255)` 为三个颜色部分创建一个创建一个随机\
  \ RGB 色元组（记得在程序顶部 `import random`），这样圆点每次在屏幕上绘制时都会改变颜色。这种效果就是一个变色圆点。将你的新作品命名为 *DiscoDot.py*。\n\
  \n#2 100 个随机点\n\n\n\n\n作为第二个挑战，让我们把单个点替换为 100 个具有随机颜色、大小和位置的点。为了实现这一点，我们设置三个数组，每个数组可以存储\
  \ 100 个颜色、位置和大小的值：\n\n```\n# 100 个随机点的颜色、位置、大小数组\ncolors = [0]*100\nlocations =\
  \ [0]*100\nsizes = [0]*100\n```\n\n然后，用 100 个随机点的随机颜色三元组、位置坐标对以及大小/半径值填充这三个数组：\n\
  \n```python\nimport random\n# 在 colors, locations, sizes 中存储随机值\nfor n in range(100):\n\
  \    colors[n] = (random.randint(0,255),random.randint(0,255),\n               \
  \  random.randint(0,255))\n    locations[n] = (random.randint(0,800),\n        \
  \            random.randint(0,600))\n    sizes[n] = random.randint(10, 100)\n```\n\
  \n最后，在我们的 `while` 循环中不再是画一个点，而是添加一个 `for` 循环，使用 `colors`、`locations` 和 `sizes` 数组绘制\
  \ 100 个随机点：\n\n```python\nfor n in range(100):\n    pygame.draw.circle(screen, colors[n],\
  \ locations[n],\n                       sizes[n])\n```\n\n将你的新作品命名为 `RandomDots.py`。完成后，最终的程序应该像图\
  \ 8-10 所示。\n\n![点程序的进阶版本 RandomDots.py 为我们提供了 100 个随机颜色、位置和大小的随机点。](img/httpatomoreillycomsourcenostarchimages2189007.png.jpg)\n\
  \n图 8-10。我们的点程序的进阶版本 `RandomDots.py` 为我们提供了 100 个随机颜色、位置和大小的随机点。\n\n### #3: 雨落的点\n\
  \n最后，让我们让 `RandomDots.py` 更进一步，编写让点从屏幕的底部和右侧“雨落”，并在顶部和左侧重新出现。在这一章中，你学会了通过随时间改变对象的位置来创建动画。我们在名为\
  \ `locations` 的数组中存储了每个点的位置，因此如果我们改变每个点的 x 和 y 坐标，就可以让我们的点动起来。修改 `RandomDots.py`\
  \ 中的 `for` 循环，根据上一个值为每个点计算新的 x 和 y 坐标，如下：\n\n```python\nfor n in range(100):\n \
  \   pygame.draw.circle(screen, colors[n], locations[n],\n                      \
  \ sizes[n])\n    new_x = locations[n][0] + 1\n    new_y = locations[n][1] + 1\n\
  \    locations[n] = (new_x, new_y)\n```\n\n此更改每次通过游戏循环时都会为每个点计算新的 x 和 y 坐标（`new_x`\
  \ 和 `new_y`），但它会让点从屏幕的右边缘和底边缘掉落。让我们通过检查每个点的 `new_x` 或 `new_y` 是否超出了屏幕的右边缘或底边缘，如果是，然后在存储新位置之前将点移回上方或左侧来修复这个问题：\n\
  \n```python\nif new_x > 800:\n    new_x -= 800\nif new_y > 600:\n    new_y -= 600\n\
  locations[n] = (new_x, new_y)\n```\n\n这些更改组合的效果是随机点持续地向下向右“雨落”，从屏幕的右下角消失并从顶部或左边缘弹出。该序列中的四帧显示在图\
  \ 8-11 中；你可以观察点组在三张图片中向右向下方移动的轨迹。\n\n将你的新程序保存为 `RainingDots.py`。\n\n![四帧图显示了 100\
  \ 个随机点在屏幕上向右向下方移动的过程](img/httpatomoreillycomsourcenostarchimages2189009.png.jpg)\n\
  \n图 8-11。四帧图显示了 100 个随机点在屏幕上向右向下方移动的过程。\n\n# 第 9 章. 用户交互：进入游戏\n\n在第 8 章中，我们使用了 Pygame\
  \ 库的一些功能在屏幕上绘制形状和图像。我们还能够通过在不同时间在不同位置绘制形状来创建动画。遗憾的是，我们无法像在游戏中那样与我们的动画对象进行*交互*；我们希望能够点击、拖动、移动、击中或弹出屏幕上的对象来影响或控制它们。\n\
  \n## 添加交互：点击和拖拽\n\n让我们通过编写点处理鼠标点击和拖拽来添加交互。我们将使用与 `ShowDots.py` 相同的步骤构建 `RandomDots.py`。\n\
  \n### 设置\n\n这是我们的几行设置代码。\n\n```python\nimport pygame                           #\
  \ Setup\npygame.init()\nscreen = pygame.display.set_mode([800,600])\npygame.display.set_caption(\"\
  Click to draw\")\n```\n\n我们的设置像常一样从 `import pygame` 和 `pygame.init()` 开始，然后创建一个\
  \ `screen` 对象作为窗口。但这次，我们通过 `pygame.display.set_caption()` 为窗口添加了标题（或 `caption`）。这让用户知道程序的功能。我们传递给\
  \ `set_caption()` 的字符串将出现在标题栏上，如图 9-1 所示。\n\n![ClickDots.py 顶部的标题栏告诉用户“点击绘制”。](img/httpatomoreillycomsourcenostarchimages2189011.png.jpg)\n\
  \n图 9-1。`ClickDots.py`顶部的标题栏告诉用户，“点击绘制”。\n\n设置的其余部分创建了游戏循环变量 `keep_going`；设置了一个颜色常量（此程序中使用红色）；并为我们的绘制点创建了半径：\n\
  \n```python\nkeep_going = True\nRED = (255,0,0)                     # RED 的 RGB\
  \ 颜色三元组\nradius = 15\n```\n\n现在进入游戏循环。\n\n### 游戏循环：处理鼠标点击\n\n在游戏循环中，我们需要告诉程序何时退出以及如何处理鼠标按下：\n\
  \n```python\nwhile keep_going:                      # 游戏循环\n      for event in pygame.event.get():\
  \   # 处理事件\n➊         if event.type == pygame.QUIT:\n               keep_going =\
  \ False\n➋         if event.type == pygame.MOUSEBUTTONDOWN:\n➌             spot\
  \ = event.pos\n➍             pygame.draw.circle(screen, RED, spot, radius)\n```\n\
  \n在 ➊，我们通过将循环变量 `keep_going` 设置为 `False` 来处理 `pygame.QUIT` 事件。\n\n\n\n\n第二个 `if`\
  \ 语句位于 ➋ 处，处理的是一种新的事件类型：`pygame.MOUSEBUTTONDOWN` 事件，它告诉我们用户按下了鼠标按钮之一。每当用户按下鼠标按钮时，该事件就会出现在我们的程序从\
  \ `pygame.event.get()` 获取的事件列表中，我们可以使用 `if` 语句既用来检查该事件，也用它来告诉程序在事件发生时该做什么。 。\n\n\
  在 ➌ 处，我们创建了一个名为 `spot` 的变量来存储鼠标位置的 x 和 y 坐标。我们可以通过 `event.pos` 获取鼠标点击事件的位置；`event`\
  \ 是我们 `for` 循环中的当前事件。我们的 `if` 语句刚刚验证了此特定 `event` 类型为 `pygame.MOUSEBUTTONDOWN`，而鼠标事件具有一个\
  \ `pos` 属性（在此例中为 `event.pos`），它存储了 `x`、`y` 坐标对，告诉我们鼠标事件发生的地点。 一旦我们知道了用户点击鼠标按钮在屏幕上的位置，在\
  \ ➍ 处，我们告诉程序在 `screen` 表面画一个实心圆，颜色使用我们在设置中定义的 `RED`，位置在 `spot`，半径使用我们在设置中指定的 15（`radius`）。\n\
  \n![image with no caption](img/httpatomoreillycomsourcenostarchimages2189013.png.jpg)\n\
  \n## 整合在一起\n\n剩下的唯一工作就是更新显示，并告诉我们的程序在需要退出时该做什么。这里是 `ClickDots.py` 的完整程序。\n\n###\
  \ ClickDots.py\n\n```\nimport pygame                           # Setup\npygame.init()\n\
  screen = pygame.display.set_mode([800,600])\npygame.display.set_caption(\"Click\
  \ to draw\")\nkeep_going = True\nRED = (255,0,0)                         # RGB color\
  \ triplet for RED radius = 15\n\nwhile keep_going:                       # Game\
  \ loop\n    for event in pygame.event.get():    # Handling events\n        if event.type\
  \ == pygame.QUIT:\n            keep_going = False\n        if event.type == pygame.MOUSEBUTTONDOWN:\n\
  \            spot = event.pos\n            pygame.draw.circle(screen, RED, spot,\
  \ radius)\n    pygame.display.update()             # Update display\n\npygame.quit()\
  \                           # Exit\n```\n\n这个程序很短，但它允许用户一次一个点地画出画，正如图 9-1 所示。如果我们想在按下按钮并拖动鼠标时连续绘制，我们只需要再处理另一种类型的鼠标事件：`pygame.MOUSEBUTTONUP`。让我们尝试一下。\n\
  \n### 拖动绘画\n\n现在，让我们创建一个更自然的绘图程序 `DragDots.py`，它允许用户通过点击并拖动来平滑地绘图，就像使用画笔一样。我们将得到一个平滑的交互式绘画应用，正如图\
  \ 9-2 所示。\n\n![Our DragDots.py program is a fun way to paint!](img/httpatomoreillycomsourcenostarchimages2189015.png.jpg)\n\
  \n图 9-2. 我们的 `DragDots.py` 程序是一种很有有趣的绘画方式！\n\n为了创建这种效果，我们需要改变程序的逻辑。在 `ClickDots.py`\
  \ 中，我们处理 `MOUSEBUTTONDOWN` 事件的方式只是在鼠标点击事件的位置画一个圆。为了创建这种效果，我们需要改变程序的逻辑。在 `ClickDots.py`\
  \ 中，我们处理 `MOUSEBUTTONDOWN` 事件的方式只是在鼠标点击事件的位置画一个圆。为了创建这种效果，我们需要改变程序的逻辑。在 `ClickDots.py`\
  \ 中，我们处理 `MOUSEBUTTONDOWN` 事件的方式只是在鼠标点击事件的位置画一个圆。为了创建这种效果，我们需要改变程序的逻辑。在 `ClickDots.py`\
  \ 中，我们处理 `MOUSEBUTTONDOWN` 事件的方式只是在鼠标点击事件的位置画一个圆。为了创建这种效果，我们需要改变程序的逻辑。![image with\
  \ no caption](img/httpatomoreillycomsourcenostarchimages219017.jpg)\n\n### 设置\n\n\
  让我们的设置部分如下所示：\n\n```\n import pygame                           # Setup\n   pygame.init()\n\
  \   screen = pygame.display.set_mode([800,600])\n   pygame.display.set_caption(\"\
  Click to draw\")\n   keep_going = True\n   RED = (255,0,0)                     \
  \    # RGB color triplet for RED\n   radius = 15\n```\n\n让我们的游戏循环部分如下所示：\n\n```\n\
  \ while keep_going:                        # Game loop\n       for event in pygame.event.get():\
  \     # Handling events\n           if event.type == pygame.QUIT:\n            \
  \   keep_going = False\n➊         if event.type == pygame.MOUSEBUTTONDOWN:\n➋  \
  \           mousedown = True\n➌         if event.type == pygame.MOUSEBUTTONUP:\n\
  ➍             mousedown = False\n➎     if mousedown:                         # Draw/update\n\
  ➏         spot = pygame.mouse.get_pos()\n➐         pygame.draw.circle(screen, YELLOW,\
  \ spot, radius)\n➑     pygame.display.update()               # Update display\n\
  ```\n\n### 循环：处理按下与松开\n\n让我们的循环部分如下所示：\n\n```\n while keep_going:              \
  \          # Game loop\n       for event in pygame.event.get():     # Handling events\n\
  \           if event.type == pygame.QUIT:\n               keep_going = False\n➊\
  \         if event.type == pygame.MOUSEBUTTONDOWN:\n➋             mousedown = True\n\
  ➌         if event.type == pygame.MOUSEBUTTONUP:\n➍             mousedown = False\n\
  ➎     if mousedown:                         # Draw/update\n➏         spot = pygame.mouse.get_pos()\n\
  ➐         pygame.draw.circle(screen, YELLOW, spot, radius)\n➑     pygame.display.update()\
  \               # Update display\n```\n\n游戏循环像我们其他的应用程序一样开始，但在 ➊ 处，当我们检查用户是否按下了鼠标按钮之一时，而不是立即绘图，我们将\
  \ `mousedown` 变量设为 `True` ➋。这将是程序开始绘图的信号。下一个 `if` 语句 ➌ 检查用户是否*松开*了鼠标按钮。如果是，➍ 处的代码会将\
  \ `mousedown` 改回 `False`。这会让我们的游戏循环在用户松开按钮时停止绘图。\n\n在 ➎ 处，我们的 `for` 循环结束了（从缩进可以看出），我们的游戏循环继续检查鼠标按钮是否正被按下（即\
  \ `mousedown` 是否为 `True`）。如果鼠标按钮处于按下状态，鼠标正在拖动，所以我们允许用户在 `screen` 上绘图。\n\n在 ➏ 处，我们直接获取鼠标当前的位置，使用\
  \ `spot = pygame.mouse.get_pos()`，而不是获取上次点击的位置，因为我们想在用户拖动鼠标的地方绘图，而不仅仅是在他们第一次按下按钮的地方。➐\
  \ 处，我们在 `screen` 表面画当前的圆，使用设置中指定的 `YELLOW` 颜色，在鼠标当前正在被拖动的 `x`、`y` 位置 `spot`，使用我们在代码设置部分指定的\
  \ 15 的半径（`radius`）。最后，我们在 ➑ 处通过 `pygame.display.update()` 更新窗口来完成游戏循环。\n\n\n\n\n\
  \n```python\nimport pygame                           # 初始化\npygame.init()\nscreen\
  \ = pygame.display.set_mode([800,600])\npygame.display.set_caption(\"Click and drag\
  \ to draw\")\nkeep_going = True\nYELLOW = (255,255,0)                    # 黄色的 RGB\
  \ 三元组\nradius = 15\nmousedown = False\n\nwhile keep_going:                     \
  \  # 循环\n    for event in pygame.event.get():    # 处理事件\n        if event.type ==\
  \ pygame.QUIT:\n            keep_going = False\n        if event.type == pygame.MOUSEBUTTONDOWN:\n\
  \            mousedown = True\n        if event.type == pygame.MOUSEBUTTONUP:\n\
  \            mousedown = False\n    if mousedown:                       # 绘制/更新图形\n\
  \        spot = pygame.mouse.get_pos()\n        pygame.draw.circle(screen, YELLOW,\
  \ spot, radius)\n    pygame.display.update()             # 更新显示\n\npygame.quit()\
  \                           # 退出\n```\n\n`DragDots.py` 运行速度非常快且灵敏，几乎感觉我们是在用连续的画笔画画，而不是一系列点；我们必须快速地移动鼠标才能看到被分开画出的点。Pygame\
  \ 允许我们构建比之前章节中绘制的 turtle 绘图快得多、更流畅的游戏和动画。\n\n尽管 `for` 循环在每次通过保持应用程序的 `while` 循环时都会处理每一个事件，但\
  \ Pygame 的效率足以每秒执行几十次甚至数百次。这产生了一种程序对我们的每一个动作和指令都产生即时移动和反应的错觉——这是我们在构建动画和交互式游戏时的一个重要考虑因素。Pygame\
  \ 能够胜任这一挑战，是满足图形密集型需求的正确工具包。\n\n## 高级交互：表情大爆炸（Smiley Explosion）\n\n我的学生和儿子非常喜欢构建的一个有趣动画是\
  \ `SmileyBounce2.py` 的放大版本，称为 `SmileyExplosion.py`。它允许用户点击并拖动来创建数百个以随机大小、随机方向和随机速度移动的随机跳动表情脸，从而将跳动的表情脸推向了一个有趣的新高度。这种视觉效果类似于图\
  \ 9-3。我们将逐步构建这个程序；最终版本位于合为整体。\n\n![我们的下一个应用程序看起来像是在屏幕上到处跳跃的表情脸气球爆炸一样。](img/httpatomoreillycomsourcenostarchimages2189019.png.jpg)\n\
  \n图 9-3。我们的下一个应用程序看起来像是在屏幕上到处跳跃的表情脸气球爆炸一样。\n\n如你所见，在任何给定时间内，会有几十到数百个表情气球在屏幕上到处跳动，因此我们需要每帧为数百个对象快速、流畅地绘制图形。为了实现这一点，我们将为工具包添加另一个工具：精灵图图形（sprite\
  \ graphics）。\n\n## 表情精灵（Smiley Sprites）\n\n`sprite` 一词可以追溯到视频游戏的早期。屏幕上移动的图形对象被称为精灵，因为它们漂浮在背景之上，就像为它们命名的虚拟精灵一样。这些轻量、快速的精灵图形实现了让视频游戏如此受欢迎的快速、流畅动画。\n\
  \nPygame 通过其 `pygame.sprite.Sprite` 类提供了对精灵图形的支持。记得第 8 章，类就像模板，可以用于创建可重用的对象，每个对象都有自己的一套完整函数和属性。在\
  \ SmileyMove.py 中，我们使用了 `Clock` 类及其 `tick()` 方法来使动画变得流畅且可预测。在表情爆炸应用程序中，我们将使用一些实用的\
  \ Pygame 类，并构建我们自己的类来跟踪每个在屏幕上移动的独立表情脸。\n\n![无说明的图像](img/httpatomoreillycomsourcenostarchimages2189021.png.jpg)\n\
  \n### 关于类和对象的更多信息\n\n在第 8 章中，你学习了类就像饼干模具，而对象就是我们使用特定的饼干模具创建的饼干。当我们我们需要多个具有相似功能和特征的项（例如移动不同大小和位置的表情脸图像）时，特别是当我们需要每个项包含不同信息时（例如每个表情的大小、位置和速度）时，类可以提供模板来创建我们所需的任意数量的该类型对象。我们称对象是特定类的\
  \ `instances`（实例）。\n\nPygame 库有几十个可重用的类，每个类都有自己的 `methods`（方法，即我们称的类的函数）和 `attributes`（属性）或数据（data），即存储在每个对象中的变量和值。在第\
  \ 8 章的 `Clock` 类中，`tick()` 方法是我们的让动画按特定帧率运行的函数。对于此应用程序中浮动的表情 `Sprite` 对象，我们关心的属性是每个表情在屏幕上的位置、它的大小以及它在\
  \ x 方向上移动的速度。我们创建了自己的自己的类，来跟踪每个在屏幕上移动的独立表情脸。将问题或程序拆分为对象，然后构建创建对象的类，是面向对象编程的基础。面向对象编程是使用对象解决问题的方法。软件开发中最流行的方法之一，其受欢迎的原因之一是代码复用。可重用意味着一旦我们在一个编程项目中编写了类类，就可以在另一个项目中复用它，而不是从头开始。例如，一家游戏公司可以写一个\
  \ `Card` 类来表示标准牌。然后，每当该公司编写新游戏时（如扑克、大战、斗地主），它都可以复用该 `Card` 类。Pygame 中的 `Sprite`\
  \ 类就是一个很好的例子。Pygame 团队编写了 `Sprite` 类，包含了我们在编写游戏对象、从角色到浮动的表情脸时所需的许多功能。通过使用 `Sprite`\
  \ 类，我们这样的程序员不再需要编写在屏幕上绘制对象、检测对象之间的碰撞等所有基础代码。`Sprite` 类为我们处理了许多功能，我们可以在此构建应用程序的独特特性。\n\
  \n另一个我们将使用的实用 Pygame 类是 `Group` 类。`Group` 是一个容器（container）类，允许我们将 `Sprite` 对象作为一个组存储。`Group`\
  \ 类帮助我们把所有的精灵放在一起（通过单个 `Group` 对象访问），当有几十个甚至数百个精灵在屏幕上漂浮时，这非常重要。`Group` 类还具有方便的方法来更新组中的所有精灵（例如每帧将\
  \ `Sprite` 对象移动到每个新位置）、添加新的 `Sprite` 对象、从 `Group` 中移除 `Sprite` 对象等。\n\n### 使用类构建我们的应用程序\n\
  \n我们将为表情脸气球创建 `Sprite` 对象，利用 `Sprite` 类的属性在屏幕上产生快速动画，即使每帧有数百个精灵在移动。这个精灵组的类型为 `pygame.sprite.Group()`。让我们看看应用程序的设置部分：\n\
  \n\n\n\n\n```python\n import pygame\n   import random\n\n   BLACK = (0,0,0)\n  \
  \ pygame.init()\n   screen = pygame.display.set_mode([800,600])\n   pygame.display.set_caption(\"\
  Smiley Explosion\")\n   mousedown = False\n   keep_going = True\n   clock = pygame.time.Clock()\n\
  \   pic = pygame.image.load(\"CrazySmile.bmp\")\n   colorkey = pic.get_at((0,0))\n\
  \   pic.set_colorkey(colorkey)\n➊ sprite_list = pygame.sprite.Group()\n```\n\n这个设置看起来像\
  \ `SmileyBounce2.py`，但我们在 ➊ 处添加了一个名为 `sprite_list` 的变量，它将包含的一一组笑脸精灵。将精灵存储在 `Group`\
  \ 中将更快、更方便地执行某些操作，例如在每一帧在屏幕上绘制所有笑脸、在动画的每一步移动所有的笑脸，甚至检查笑脸精灵是否与物体或彼此发生碰撞。\n\n为了为复杂的动画和游戏创建精灵对象，我们将创建自己的\
  \ `Sprite` 类，该类 `extends`（或构建自）Pygame 的 `Sprite` 类，并为我们自定义的精灵添加所需的变量和函数。我们将精灵类命名为\
  \ `Smiley`，并为每个笑脸的位置（`pos`）、它的 x 轴和 y 轴速度`xvel` 和 `yvel`；记住 *velocity* 是速度的另一个词）以及它的\
  \ *scale*，即每个笑脸有多大（`scale`）添加变量：\n\n```python\nclass Smiley(pygame.sprite.Sprite):\n\
  \    pos = (0,0)\n    xvel = 1\n    yvel = 1\n    scale = 100\n```\n\n我们的 `Smiley`\
  \ 类定义以关键字 `class` 开始，后面跟着我们想要为类指定的名称，以及我们要扩展的类型（`pygame.sprite.Sprite`）。\n\n## 设置精灵\n\
  \n在启动 `Smiley` 类并列出我们希望每个笑脸精灵对象记住的数据变量之后，下一步被称为 `initialization`（初始化），有时也称为我们类的\
  \ `constructor`（构造函数）。这是一个特殊函数，每当我们的程序中创建一个 `Smiley` 类的新对象或进行 `constructed`（构造）时，它就会被调用。就像初始化变量会给它一个初始值一样，我们\
  \ `Smiley` 类中的初始化函数 `__init__()` 将设置好我们在精灵对象中所需的所有初始值。`__init__()` 函数名两边的双下划线在 Python\
  \ 中具有特殊含义。在这种情况下，`__init__()` 是用于初始化类的特殊函数名。我们在这个函数中告诉 Python 每个 `Smiley` 对象应该如何初始化，每当我们创建创建一个\
  \ `Smiley` 时，这个特殊的 `__init__()` 函数就会在后台执行它的工作，为每个 `Smiley` 对象设置变量及等更多内容。\n\n![image\
  \ with no caption](img/httpatomoreillycomsourcenostarchimages2189023.png.jpg)\n\n\
  我们在 `__init__()` 函数中需要设置若干项内容。首先，我们将确定需要传递给 `__init__()` 函数的参数。对于我们的随机笑脸，我们可能会传入一个位置以及起始的\
  \ x 轴和 y 轴速度。由于我们的 `Smiley` 是一个类，并且我们所有的笑脸精灵都是 `Smiley` 类型的对象，因此类中所有函数的第一个参数都将是精灵对象本身。我们将此参数标记为\
  \ `self`，因为它将 `__init__()` 和其他函数连接到对象的数据。看我们 `__init__()` 函数的代码：\n\n```python\n\
  \ def __init__(self, pos, xvel, yvel):\n➊     pygame.sprite.Sprite.__init__(self)\n\
  ➋     self.image = pic\n      self.rect = self.image.get_rect()\n➌    self.pos =\
  \ pos\n➍    self.rect.x = pos[0] - self.scale/2\n      self.rect.y = pos[1] - self.scale/2\n\
  ➎    self.xvel = xvel\n      self.yvel = yvel\n```\n\n我们 `__init__()` 函数的四个参数是对象本身\
  \ `self`；我们希望笑脸出现的位置 `pos`；以及 `xvel` 和 `yvel`，即它的水平和垂直速度值。接下来，在 ➊ 处，我们调用主 `Sprite`\
  \ 类的初始化函数，这样我们的对象就可以利用精灵图形的属性，而不需要从头开始编写它们。在 ➋ 处，我们将精灵对象的图像（`self.image`）设置为我们从磁盘加载的\
  \ `pic` 图形（`CrazySmile.bmp`——你需要确保该文件仍位于此新程序相同的文件夹中），并获取包含 100×100 图片的矩形尺寸。\n\n\
  在 ➌ 处，语句 `self.pos = pos` 将传递给 `__init__()` 函数的位置存储在对象自身的 `pos` 变量中。然后，在 ➍ 处，我们将精灵绘制矩形的\
  \ x 坐标和 y 坐标设置为存储在 `pos` 中的 x 坐标和 y 坐标，偏移了图像大小的一半（`self.scale/2`），这样笑脸就会居于用户鼠标点击位置中心。最后，我们在\
  \ ➎ 处将传递给 `__init__()` 函数的 x 轴和 y 轴速度存储在对象的 `xvel` 和 `yvel` 变量中（`self.xvel` 和 `self.yvel`）。\n\
  \n这个 `__init__()` 构造函数将设置好在屏幕上绘制每个笑脸所需的一切，但它不处理移动精灵在屏幕上移动所需的动画。为了这一点，我们将为精灵添加另一个实用的函数\
  \ `update()`。\n\n## 更新精灵\n\n精灵是为动画而设计的，我们已经学到动画意味着每帧（每次我们通过游戏循环时）更新图形的位置。Pygame\
  \ 精灵内置了一个 `update()` 函数，我们可以 `override`（覆盖）或自定义此函数，以编写我们希望自定义精灵实现的行为。\n\n我们的 `update()`\
  \ 函数非常简单；对于我们跳动的笑脸精灵，每帧的唯一更新就是根据其速度更改每个精灵的位置，并检查它是否与屏幕边缘发生碰撞：\n\n```python\ndef\
  \ update(self):\n    self.rect.x += self.xvel\n    self.rect.y += self.yvel\n  \
  \  if self.rect.x <= 0 or self.rect.x > screen.get_width():\n        self.xvel =\
  \ -self.xvel\n    if self.rect.y <= 0 or self.rect.y > screen.get_height():\n  \
  \      self.yvel = -self.yvel\n```\n\n`update()` 函数接收一个参数——精灵本身 `self`——移动精灵的代码与我们的\
  \ *SmileyBounce.py* 非常相似。唯一的区别是我们使用 `self.rect.x` 和 `self.rect.y` 指代精灵的 (*x*, *y*)\
  \ 位置，并使用 `self.xvel` 和 `self.yvel` 指代 x 轴和 y 轴速度。我们的屏幕边界碰撞检测也使用了 `screen.get_width()`\
  \ 和 `screen.get_height()`。\n\n## 大小笑脸\n\n我们要为此程序版本添加的最后一个功能是更改图像的 *scale*，即大小。我们将设置\
  \ `self.image` 为 `pic` 之后对我们的 `__init__()` 函数进行此修改。首先，我们将对象的 `scale` 变量更改为 10 到\
  \ 100 之间的随机数（对于一个尺寸在 10×10 到 100×100 像素之间的笑脸精灵）。我们将通过使用 `pygame.transform.scale()`\
  \ 函数来应用这种比例的变化，也称为变换：\n\n```python\nself.scale = random.randrange(10,100)\nself.image\
  \ = pygame.transform.scale(self.image, (self.scale,self.scale))\n```\n\nPygame 的\
  \ `transform.scale()` 函数接收一个图像（我们的笑脸图形 `self.image`）和一个新的维度（我们新的随机 `self.scale`\
  \ 值作为变换图像的宽度和高度），并返回缩放后的（放大或缩小、变变小）图像，我们将其存储为新的 `self.image`。\n\n有了最后的更改，我们现在应该能够使用我们的\
  \ `Smiley` 精灵类，通过类似于 *DragDots.py* 绘图应用的绘图代码在整个屏幕上绘制随机大小和速度的笑脸，再加上一些更改。\n\n## 整合在一起\n\
  \n这是我们完整的 *SmileyExplosion.py* 应用：\n\n### SmileyExplosion.py\n\n\n\n\n\n```python\n\
  \ import pygame\n   import random\n\n   BLACK = (0,0,0)\n   pygame.init()\n   screen\
  \ = pygame.display.set_mode([800,600])\n   pygame.display.set_caption(\"Smiley Explosion\"\
  )\n   mousedown = False\n   keep_going = True\n   clock = pygame.time.Clock()\n\
  \   pic = pygame.image.load(\"CrazySmile.bmp\")\n   colorkey = pic.get_at((0,0))\n\
  \   pic.set_colorkey(colorkey)\n   sprite_list = pygame.sprite.Group()\n\n   class\
  \ Smiley(pygame.sprite.Sprite):\n       pos = (0,0)\n       xvel = 1\n       yvel\
  \ = 1\n       scale = 100\n\n       def __init__(self, pos, xvel, yvel):\n     \
  \      pygame.sprite.Sprite.__init__(self)\n           self.image = pic\n      \
  \     self.scale = random.randrange(10,100)\n           self.image = pygame.transform.scale(self.image,\
  \ (self.scale,self.scale))\n           self.rect = self.image.get_rect()\n     \
  \      self.pos = pos\n           self.rect.x = pos[0] - self.scale/2\n        \
  \   self.rect.y = pos[1] - self.scale/2\n           self.xvel = xvel\n         \
  \  self.yvel = yvel\n\n      def update(self):\n          self.rect.x += self.xvel\n\
  \          self.rect.y += self.yvel\n          if self.rect.x <= 0 or self.rect.x\
  \ > screen.get_width() - self.scale:\n              self.xvel = -self.xvel\n   \
  \       if self.rect.y <= 0 or self.rect.y > screen.get_height() - self.scale:\n\
  \              self.yvel = -self.yvel\n   while keep_going:\n       for event in\
  \ pygame.event.get():\n           if event.type == pygame.QUIT:\n              \
  \ keep_going = False\n           if event.type == pygame.MOUSEBUTTONDOWN:\n    \
  \           mousedown = True\n           if event.type == pygame.MOUSEBUTTONUP:\n\
  \               mousedown = False\n       screen.fill(BLACK)\n➊     sprite_list.update()\n\
  ➋     sprite_list.draw(screen)\n       clock.tick(60)\n       pygame.display.update()\n\
  \       if mousedown:\n           speedx = random.randint(-5, 5)\n           speedy\
  \ = random.randint(-5, 5)\n➌         newSmiley = Smiley(pygame.mouse.get_pos(),speedx,speedy)\n\
  ➍         sprite_list.add(newSmiley)\n\npygame.quit()\n```\n\n`SmileyExplosion.py`\
  \ 中的游戏循环代码与我们的绘制应用 `DragDots.py` 类似，但有几处显著的变化。在➊ 处，我们对存储在 `sprite_list` 中的笑脸精灵列表调用\
  \ `update()` 函数；这一行代码将调用 `update` 函数来移动屏幕上的每一个笑脸，并检查边缘反弹。同样，➋ 处的代码将把屏幕上的每一个笑脸绘制在它们正确的位置。只需两行代码就能动画化并绘制可能上百个精灵——这节省了大量时间，而且这只是\
  \ Pygame 中精灵图形威力的一部分。\n\n在我们的 `mousedown` 绘制代码中，为每个新笑脸的水平和垂直速度生成了随机的 `speedx` 和\
  \ `speedy`，并在 ➌ 处，我们通过调用类 `Smiley` 的构造函数创建一个新的笑脸 `newSmiley`。注意，我们不需要使用函数名 `__init__()`；相反，每当我们构造或创建一个\
  \ `Smiley` 类或类型的新对象时，我们都使用类名 `Smiley`。我们向构造函数传递鼠标的位置以及我们刚刚创建的随机速度。最后，在➍ 处，我们将新创建的笑脸精灵\
  \ `newSmiley` 添加到我们名为 `sprite_list` 的精灵组（Group）中。\n\n我们刚刚为几十甚至上百个笑脸精灵图形创建了一个快速、流畅且交互式的动画，它们像不同大小的气球一样在屏幕上漂浮，以随机速度向每个方向移动。应用的最终升级中，我们将看到精灵图形一个更令人印象深刻且强大的功能，它可以处理碰撞检测。\n\
  \n# SmileyPop, Version 1.0\n\n在我们的最后一个示例中，我们将为 `SmileyExplosion.py` 程序添加一个非常有趣的乐趣：通过点击右鼠标键（或在\
  \ Mac 上按下 `CONTROL` 键并点击）来“戳破”笑脸气球/泡泡。效果就像戳泡泡游戏或打蚁大战（Ant Smasher）、打地鼠等等。我们可以通过按住左鼠标键创建笑脸气球，并通过在一个或多个笑脸精灵上点击右鼠标键来戳破它们（即将它们从屏幕上移除）。\n\
  \n## 检测碰撞和移除精灵\n\n好消息是，Pygame 中的 `Sprite` 类内置了碰撞检测。我们可以使用 `pygame.sprite.collide_rect()`\
  \ 函数来检查持有两个精灵的矩形是否发生了碰撞；我们可以使用 `collide_circle()` 函数来检查两个圆形精灵是否相互接触；如果我们只是想检查精灵是否与单个点（例如用户刚刚点击鼠标的像素点）发生碰撞，可以使用精灵的\
  \ `rect.collidepoint()` 函数来检查精灵是否重叠或与屏幕上的该点发生碰撞。\n\n如果我们确定了用户点击了一个触及一个或多个精灵的点，可以通过调用\
  \ `remove()` 函数从我们的 `sprite_list` 组中移除这些精灵。我们可以在 `MOUSEBUTTONDOWN` 事件处理代码中处理戳破笑脸气球的所有逻辑。要将\
  \ `SmileyExplosion.py` 转换为 `SmileyPop.py`，我们只需要替换这两行代码：\n\n```\nif event.type ==\
  \ pygame.MOUSEBUTTONDOWN:\n    mousedown = True\n```\n\n为以下七行代码：\n\n```\n if event.type\
  \ == pygame.MOUSEBUTTONDOWN:\n➊           if pygame.mouse.get_pressed()[0]:    #\
  \ 普通左鼠标键，绘制\n                 mousedown = True\n➋       elif pygame.mouse.get_pressed()[2]:\
  \  # 右鼠标键，戳破\n➌           pos = pygame.mouse.get_pos()\n➍           clicked_smileys\
  \ = [s for s in sprite_list if s.rect.collidepoint(pos)]\n➎           sprite_list.remove(clicked_smileys)\n\
  ```\n\n`MOUSEBUTTONDOWN` 的 `if` 保持不变，但现在我们感兴趣的是哪个键被按下。在➊ 处，我们检查是否按下左鼠标键（索引为 `[0]`）；如果是，我们开启\
  \ `mousedown` 布尔标志，游戏循环将进行绘制。在➋ 处，我们查看是否按下右鼠标键，开始检查是否点击了 `sprite_list` 中的一个或多个笑脸。\n\
  \n首先，在➌ 处，我们获取鼠标的位置并存储在变量 `pos` 中。在➍ 处，我们使用编程快捷从 `sprite_list` 生成与 `pos` 点碰撞的精灵列表。如果\
  \ `sprite_list` 中的精灵 `s` 的矩形与点 `pos` 碰撞，则将其组合成列表并存储为 `clicked_smileys`。\n\n最后，在➎\
  \ 处，我们对名为 `sprite_list` 的精灵组调用实用的 `remove()` 函数。这个函数与 Python 普通的 `remove()` 函数不同，后者移除列表或集合中的单个项。`pygame.sprite.Group.remove()`\
  \ 函数可以移除任意数量的精灵。在这种情况下，它将从 `sprite_list` 中移除所有与用户点击点的精灵。\n\n## 汇总代码\n\n这是完整的 `SmileyPop.py`\
  \ 代码。\n\n### SmileyPop.py\n\n\n\n\n\n```python\nimport pygame\nimport random\n\n\
  BLACK = (0,0,0)\npygame.init()\nscreen = pygame.display.set_mode([800,600])\npygame.display.set_caption(\"\
  Pop a Smiley\")\nmousedown = False\nkeep_going = True\nclock = pygame.time.Clock()\n\
  pic = pygame.image.load(\"CrazySmile.bmp\")\ncolorkey = pic.get_at((0,0))\npic.set_colorkey(colorkey)\n\
  sprite_list = pygame.sprite.Group()\n\nclass Smiley(pygame.sprite.Sprite):\n   \
  \ pos = (0,0)\n    xvel = 1\n    yvel = 1\n    scale = 100\n\n    def __init__(self,\
  \ pos, xvel, yvel):\n        pygame.sprite.Sprite.__init__(self)\n        self.image\
  \ = pic\n        self.scale = random.randrange(10,100)\n        self.image = pygame.transform.scale(self.image,\
  \ (self.scale,self.scale))\n        self.rect = self.image.get_rect()\n        self.pos\
  \ = pos\n        self.rect.x = pos[0] - self.scale/2\n        self.rect.y = pos[1]\
  \ - self.scale/2\n        self.xvel = xvel\n        self.yvel = yvel\n\n    def\
  \ update(self):\n        self.rect.x += self.xvel\n        self.rect.y += self.yvel\n\
  \        if self.rect.x <= 0 or self.rect.x > screen.get_width() - self.scale:\n\
  \            self.xvel = -self.xvel\n        if self.rect.y <= 0 or self.rect.y\
  \ > screen.get_height() - self.scale:\n            self.yvel = -self.yvel\nwhile\
  \ keep_going:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
  \            keep_going = False\n        if event.type == pygame.MOUSEBUTTONDOWN:\n\
  \            if pygame.mouse.get_pressed()[0]:   # Regular left mouse button, draw\n\
  \                mousedown = True\n            elif pygame.mouse.get_pressed()[2]:\
  \ # Right mouse button, pop\n                pos = pygame.mouse.get_pos()\n    \
  \            clicked_smileys = [s for s in sprite_list if s.rect.collidepoint(pos)]\n\
  \                sprite_list.remove(clicked_smileys)\n        if event.type == pygame.MOUSEBUTTONUP:\n\
  \            mousedown = False\n    screen.fill(BLACK)\n    sprite_list.update()\n\
  \    sprite_list.draw(screen)\n    clock.tick(60)\n    pygame.display.update()\n\
  \    if mousedown:\n        speedx = random.randint(-5, 5)\n        speedy = random.randint(-5,\
  \ 5)\n        newSmiley = Smiley(pygame.mouse.get_pos(),speedx,speedy)\n       \
  \ sprite_list.add(newSmiley)\n\npygame.quit()\n```\n\n记住，你必须将 `CrazySmile.bmp` 图像文件存储在代码相同的文件夹或目录中才能运行。一旦运行起来，这个程序非常好玩，几乎会让人上瘾！在下一章中，我们将学习让游戏变得有趣的游戏设计元素，并将从零开始构建一个完整的游戏！\n\
  \n## 你学到了什么\n\n在本章中，我们将用户交互与动画相结合，在屏幕上创造了笑脸的爆炸，并使用了精灵（sprite）图形让这一切变得简单且快速。我们学习了如何构建自己的\
  \ `Sprite` 类，以便我们根据想要的功能来定制精灵，包括数据变量、初始化函数和自定义的更新函数。我们还学习了如何在 `pygame` 中缩放图像，以便我们的笑脸具有不同的形状和大小，并学习了使用\
  \ `pygame.sprite.Group()` 存储所有的的优势以便在屏幕上进行快速更新和绘制。\n\n在最后的示例中，我们添加了基于精灵的碰撞检测，以判断用户是否右键点击了一个或多个笑脸精灵。我们学习了\
  \ `Python` 有强大的功能，可以根据 `if` 条件从列表中选择项目，并看到了如何使用 `remove()` 函数从 `Group` 中移除精灵。在本章中，我们创建了有趣的应用程序，并以\
  \ `SmileyPop` 应用作为结尾，我们将在第 10 章让它更具游戏性。《趣味游戏编程》。Pygame 已经给了我们编写酷炫游戏所需的最终技能！\n\n\
  在本章中编写酷的应用程序为我们提供了完成以下技能：\n\n-   通过自定义 `pygame.sprite.Sprite()` 类使用精灵图形。\n-   使用\
  \ `pygame.sprite.Group()` 及其函数访问、修改、更新和绘制精灵列表。\n-   通过应用 `pygame.scale()` 函数对图像进行变换，以增加或减少图像的像素大小。\n\
  -   使用 `Sprite` 类中的 `rect.collidepoint()` 和类似函数检测精灵碰撞。\n- 使用 `remove()` 函数从 `Group`\
  \ 中移除精灵。\n\n## 编程挑战\n\n这里有三个挑战题用于扩展在本章中开发的技能。如需这些挑战的示例答案，请访问 `http://www.nostarch.com/teachkids/`。\n\
  \n## 1：随机颜色的点\n\n首先在 `DragDots.py` 程序中选择你自己的颜色三元组。然后修改程序，通过创建一组 0 到 255 之间的随机数字三元组作为颜色，来绘制随机颜色的点。将你的新作品命名为\
  \ `RandomPaint.py`。\n\n## 2：色彩绘画\n\n让用户使用以下任何一种选项绘制两种或更多一致的颜色：\n\n-   每次用户按下按键时更改当前的绘制颜色，可以是每次变为随机颜色，也可以针对某些按键变为特定颜色（如\
  \ R 代表红色，B 代表蓝色，等等）。\n-   为每个鼠标按钮使用不同的颜色进行绘制（例如，左键为红色，中键为绿色，右键为蓝色）。\n-   在屏幕底部或侧面添加一些彩色矩形，并修改程序，如果用户点击了矩形，则绘制颜色将变为与矩形相同的颜色。\n\
  \n尝试一种方法，或者全部尝试，并将你的新文件保存为 `ColorPaint.py`。\n\n## 3：抛掷笑脸\n\nPygame 有一个名为 `pygame.mouse.get_rel()`\
  \ 的函数，它将返回相对运动量，即自上次调用 `get_rel()` 以来鼠标位置在 x 和 y 方向上的像素变化。修改你的 `SmileyExplosion.py`\
  \ 文件，使用 x 和 y 方向的相对运动量作为每个笑脸的水平垂直速度（而不是生成随机的 `speedx` 和 `speedy` 值）。这看起来就像用户在抛掷笑脸！\n\
  \n为了增加另一种真实效果，每当笑脸碰到屏幕边缘时，在 `update(self)` 部分通过乘以一个小于 1.0 的数字（如 0.95）的 `xvel` 和\
  \ `yvel` 来让笑脸减速。笑脸会随着时间变慢，仿佛每次碰撞墙都会让它们变慢。将你的新应用保存为 `SmileyThrow.py`。\n\n# 第 10 章游戏编程：趣味编程\n\
  \n在第 9 章中，我们将动画和用户交互相结合制作了一个有趣的程序。在本章中，我们将这些这些基础上添加游戏设计元素，从零开始创建一个游戏。我们将在屏幕上绘制动画的能力与处理用户交互（如鼠标移动）的能力，创建一个名为\
  \ `Smiley Pong` 的经典 Pong 类游戏。\n\n我们喜欢的游戏具有某些游戏设计元素。以下是我们的 Smiley Pong 设计方案：\n\n\
  -   游戏场或游戏板：黑色屏幕代表乒乓球拍的一半。\n-   目标和成就：玩家试图得分并避免失去生命。\n-   游戏道具（游戏角色和对象）：玩家拥有一个球和一个球拍。\n\
  -   规则：如果球击中球拍，玩家得分；但如果球击中屏幕底部，玩家将失去一条生命。\n-   机制：我们将球拍随鼠标左右移动，防守屏幕底部；随着游戏的进行，球可能会变得更快。\n\
  -   资源：玩家将拥有五次生命或机会来尽可能得分。\n\n\n\n\n\n![image with no caption](img/httpatomoreillycomsourcenostarchimages2189029.png.jpg)\n\
  \n游戏利用这些元素来吸引玩家。一个优秀的游戏融合了这些元素，使得游戏易上手但极具挑战性。\n\n# 构建游戏骨架：Smiley Pong，版本 1.0\n\n\
  Pong（如图 10-1 所示）是最早的街机视频游戏之一，可以追溯到 20 世纪 60 和 70 年代。4 多年以后，它玩起来依然很有趣。\n\n![Atari’s\
  \ famous Pong game from 1972](img/httpatomoreillycomsourcenostarchimages2189031.png.jpg)\n\
  \n*Wikimedia Commons*\n\n图 10-1. 1972 年雅达著名的 Pong 游戏\n\n单人版 Pong 的玩法非常简单。挡板沿屏幕的一条边缘移动（我们将挡板放在底部），并反弹球（在我们的案例中是一个笑脸球）。玩家每次击中球就会得分，每次漏球就会失去一分（或一条生命）。\n\
  \n我们将使用来自第 8 章的跳动笑脸程序作为游戏的基础。使用 `SmileyBounce2.py`（整合一切）作为基础，我们已经拥有了一个在窗口侧面反弹的平滑动画的笑脸球，并且已经处理了保持动画持续运行直到用户退出的\
  \ `while` 循环。为了制作 Smiley Pong，我们将添加一个沿屏幕底部跟随鼠标的挡板，并添加更多的碰撞检测来判断笑脸球何时击中挡板。最后的一笔是：从零分和五条生命开始，在玩家击中球时给分，在球从屏幕底部反弹时扣除一条生命。图\
  \ 10-2 展示了我们的目标。当我们完成后，我们的最终程序将看起来像整合一切中的那一个。\n\n![The Smiley Pong game we’ll build](img/httpatomoreillycomsourcenostarchimages2189033.png.jpg)\n\
  \n图 10-2. 我们将构建的 Smiley Pong 游戏\n\n我们将为之前的 `SmileyBounce2.py` 应用添加的第一个功能是挡板。\n\n\
  ## 绘制画布和游戏组件\n\n在完成后的游戏中，挡板将沿屏幕底部移动，跟随鼠标的移动，用户试图防止球击中底部边缘。\n\n为了让挡板运行，我们向应用的设置部分添加这些信息：\n\
  \n```\nWHITE = (255,255,255)\npaddlew = 200\npaddleh = 25\npaddlex = 300\npaddley\
  \ = 550\n```\n\n这些变量将帮助我们创建一个宽为 200、高为 25 的白色矩形挡板。我们希望其左上角的坐标起始于 (300, 550)，这样挡板起始位置将略高于底部边缘，并在\
  \ 800 × 600 的屏幕上水平居中。\n\n但我们现在还不想绘制这个矩形。这些变量对于第一次在屏幕上绘制矩形来说是足够的，但我们的挡板需要跟随用户的鼠标移动。我们希望在屏幕上以用户在\
  \ `x` 方向（左右）移动鼠标的位置为中心绘制挡板，同时将 `y` 坐标固定在屏幕底部附近。为了做到这一点，我们需要鼠标位置的 x 坐标。我们可以通过 `pygame.mouse.get_pos()`\
  \ 获取鼠标位置。在这种情况下，由于我们只关心 `get_pos()` 的 x 坐标，且 `x` 是鼠标位置中的第一个，我们可以通过以下方式获取鼠标的 x 坐标：\n\
  \n```\npaddlex = pygame.mouse.get_pos()[0]\n```\n\n但请记住，Pygame 是从我们提供的 `(`x`, `y`)`\
  \ 位置*开始*绘制矩形，并将矩形的其余部分设计在该位置的右侧和下方。为了让挡板在鼠标所在的位置居中，我们需要从鼠标的 x 坐标减去挡板宽度的一半，使鼠标处于挡板的中间：\n\
  \n```\npaddlex -= paddlew/2\n```\n\n现在我们知道挡板的中心始终是鼠标所在，我们在游戏循环中需要做的仅仅是在屏幕上绘制挡板矩形：\n\
  \n```\npygame.draw.rect(screen, WHITE, (paddlex, paddley, paddlew, paddleh))\n```\n\
  \n如果你在 `SmileyBounce2.py` 的 `pygame.update()` 之前添加这三行，并在设置部分添加 `paddlew`、`paddleh`、`paddlex`\
  \ 和 `paddley`，你将看到挡板跟随鼠标移动。但我们还没有添加击中挡板时的逻辑。\n\n## 计分\n\n计分是让游戏有趣的一部分。在 Smiley Pong\
  \ 中，我们必须弄何时增加 `points`（分数），何时扣除 `lives`（生命）。\n\n### 扣除生命\n\n让我们从扣除生命开始。我们知道，如果球击中屏幕底部，玩家就漏掉了，所以他们应该失去一条生命。\n\
  \n为了添加球击中底部时扣除生命的逻辑，我们必须将击中屏幕顶部或底部的 `if` 语句（`if picy <= 0 or picy >= 500`）拆分成两个部分，分别处理顶部和底部。如果球击中顶部（`picy\
  \ <= 0`），我们只想让它反弹，因此我们将通过 `-speedy` 改变在 *y* 方向的速度：\n\n```\nif picy <= 0:\n    speedy\
  \ = -speedy\n```\n\n如果击中底部（`picy >= 500`），我们想要从 `lives` 中扣除一条生命，然后让球反弹：\n\n```\n\
  if picy >= 500:\n    lives -= 1\n    speedy = -speedy\n```\n\n扣除生命已经完成，现在我们需要增加分数。\n\
  \n### 挡板击中球\n\n为了检测球是否反弹挡板，我们需要观察球是如何与挡板接触的。可能会击中挡板的左上角，可能会击中挡板的右上角，或者直接从挡板顶部反弹。\n\
  \n\n\n\n\n当你正在确定碰撞检测的逻辑时，在纸上画出来并标记出你需要检查可能碰撞的角和边缘会有很有帮助。图 10-4 显示了挡板以及球的两个角碰撞情况的草图。\n\
  \n![挡板和我们的笑脸球之间的两种碰撞情况](img/httpatomoreillycomsourcenostarchimages2189039.png.jpg)\n\
  \n图 10-4. 挡板和我们的笑脸球之间的两种碰撞情况\n\n由于我们希望球能真实地从挡板上反弹，因此我们需要检查球的底部中心刚好碰到挡板左侧和右侧极端边缘的情况。我们希望确保玩家不仅在球直接从挡板顶部反弹时得分，而且当球从挡板的角反弹时也能得分。为了做到这一点，我们将检查球的垂直位置是否位于挡板所在的屏幕底部，如果是，我们将检查球的水平位置是否允许它击中挡板。\n\
  \n首先，让我们确定什么范围的 x 坐标值允许球击中挡板。由于球的中心相对于其 `(picx, picy)` 左上角是球宽的一半，我们将在应用程序的设置部分将球宽作为一个变量添加：\n\
  \n```\npicw = 100\n```\n\n如图 10-4 所示，当 `picx` 加上图片的一半宽度（`picw/2`）碰到 `paddlex`（挡板左角的\
  \ x 坐标）时，球可能会击中挡板的左上角。在代码中，我们可以作为 `if` 语句的一部分测试此条件：`picx + picw/2 >= paddlex`。\n\
  \n我们使用“大于等于”条件是因为球可以更靠右（在 *x* 方向上大于 `paddlex`）仍然击中挡板；角碰撞情况只是玩家因击中挡板而得分的第一个像素。挡板左角和右角之间的所有\
  \ x 坐标值都是有效的击，因此它们应该给用户加分并让球反弹。\n\n为了找到那个右上角的碰撞情况，我们可以从图中看到，我们需要球的中心（其 x 坐标为 `picx\
  \ + picw/2`）小于或等于挡板的右上角（其 x 坐标为 `paddlex + paddlew`，即挡板的起始 x 坐标加上挡板的宽度）。在代码中，这将是\
  \ `picx + picw/2 <= paddlex + paddlew`。\n\n我们可以将这两个条件合并成一个 `if` 语句，但这并不足够。这些 x 坐标覆盖了从挡板左角到右角、从屏幕顶部到底部的整个屏幕。仅确定了\
  \ x 坐标，我们的球可能位于 *y* 方向的任何位置，因此我们需要缩小范围。仅仅知道球在挡板的*水平*限制范围内是不够的，我们还必须知道球在允许其与挡板碰撞的\
  \ y 坐标*垂直*范围内。\n\n我们知道挡板的顶部位于 *y* 方向的 550 像素处，靠近屏幕底部，因为我们的设置包含了 `paddley = 550`\
  \ 这一行，并且矩形从该 y 坐标开始向下延伸 25 像素，我们的挡板高度存储在 `paddleh` 中。我们知道图片高为 100 像素，所以将其存储为变量 `pich`（图片高度），并将其添加到我们的设置部分：`pich\
  \ = 100`。\n\n为了让球的 y 坐标击中挡板，`picy` 位置加上图片高度 `pich` 需要至少等于 `paddley` 或更大，图片的底部（`picy\
  \ + pich`）才能碰到挡板的顶部（`paddley`）。球在 *y* 方向上击中挡板的 `if` 语句部分是 `if picy + pich >= paddley`。但仅凭这个条件允许球出现在大于\
  \ `paddley` 的任何位置，即使是在屏幕底部。我们不希望用户在球碰到底部边缘后通过移动挡板碰到球来得分，因此我们需要另一个 `if` 条件来设置我们得分的最大\
  \ y 坐标值。\n\n![无说明的图像](img/httpatomoreillycomsourcenostarchimages2189041.png.jpg)\n\
  \n得分的最大 y 坐标值的自然选择可能是挡板底部，即 `paddley + paddleh`（挡板的 y 坐标加上它的高度）。但如果球的底部已经过了挡板的底部，玩家击中球时就不应该得分，因此我们希望\
  \ `picy + pich`（球的底部）小于或等于 `paddley + paddleh`。\n\n\n\n\n我们已经有了增加分数和扣除生命的逻辑，但在玩游戏时并没有在屏幕上看到分数。在本节中，我们将向屏幕上绘制文本，在玩家游戏时提供反馈，如图图\
  \ 10-5 所示。\n\n![笑脸 Pong，版本 1.0，正在变成一个真正的游戏！](img/httpatomoreillycomsourcenostarchimages2189043.png.jpg)\n\
  \n图 10-5. 笑脸 Pong，版本 1.0，正在变成一个真正的游戏！\n\n第一步是组合我们想要显示的文本字符串。在典型的视频游戏中，我们会看到分数以及剩余的生命或回合数——例如，`Lives:\
  \ 4, Points: 32`。我们已经有了表示生命数（`lives`）和总分（`points`）的变量。我们要做的只是使用 `str()` 函数将这些数字转换为对应的文本（`5`\
  \ 变成 `\"5\"`），并添加文本来指示在每次游戏循环中这些数字的含义：\n\n![没有标题说明的图像](img/httpatomoreillycomsourcenostarchimages2189045.png.jpg)\n\
  \n```\ndraw_string = \"Lives: \" + str(lives) + \" Points: \" + str(points)\n```\n\
  \n我们的字符串变量将命名为 `draw_string`，它包含了我们要在屏幕上绘制并显示给玩家玩家的文本。要在屏幕上绘制这些文本，我们需要一个连接到文本绘制模块\
  \ `pygame.font` 的对象或变量。`font` 是 `typeface`（字体）的另一种名称，或者说是绘制字符的样式，如 Arial 或 Times\
  \ New Roman。在你的应用程序设置部分，添加以下行：\n\n```\nfont = pygame.font.SysFont(\"Times\", 24)\n\
  ```\n\n这创建了一个我们称为 `font` 的变量，它允许我们用 24 点的 Times 字体在 Pygame 显示器上绘制。你可以让文本变大或变小，但目前\
  \ 24 点就可以了。接下来我们将绘制文本；这应该添加到游戏循环中，紧跟在 `draw_string` 声明之后。要在窗口上绘制文本，我们首先要在创建的 `font`\
  \ 对象上使用 `render()` 命令在它自己的表面上绘制该字符串：\n\n```\ntext = font.render(draw_string, True,\
  \ WHITE)\n```\n\n这创建了一个名为 `text` 的变量，用于存储一个包含构成字符串中所有字母、数字和符号的白色像素的表面。下一步将获取该表面的尺寸（宽度和高度）。较长的字符串渲染或绘制得更宽，而较短的字符串需要的像素较少。大字体和小字体的情况也是如此。文本字符串将在矩形表面上渲染，因此我们将变量命名为\
  \ `text_rect`，表示存放绘制字符串的矩形：\n\n```\ntext_rect = text.get_rect()\n```\n\n`text` 表面上的\
  \ `get_rect()` 命令将返回绘制字符串的尺寸。接下来我们将使用 `.centerx` 属性将文本矩形 `text_rect` 在屏幕上水平居中，并位于屏幕顶部\
  \ `10` 像素处，以便于。以下是设置位置的两个命令：\n\n```\ntext_rect.centerx = screen.get_rect().centerx\n\
  text_rect.y = 10\n```\n\n是时候将 `text_rect` 图像绘制到屏幕上了。我们将像之前处理图片 `pic` 那样使用 `blit()`\
  \ 函数来实现：\n\n```\nscreen.blit(text, text_rect)\n```\n\n通过这些更改，我们的 Smiley Pong 游戏已经变得像经典版本一样，但以我们的笑脸作为球。运行程序，你将看到类似图\
  \ 10-5 的内容。我们正在向街机品质的游戏迈进！\n\n## 整合\n\n我们使用了许多编码技能来制作这个游戏。变量、循环、条件、数学、图形、事件处理——几乎用上了我们整个工具箱。对于编码者和玩家来说，游戏都是一场冒险。制作游戏既具有挑战性又有回报；我们可以构建自己想要的游戏玩法，然后将其与他人分享。我的儿子们非常喜欢笑脸\
  \ Pong 游戏的 1.0 版本，并为我扩展到 2.0 版本提供了极佳的点子。\n\n这里是完整的 1.0 版本，`SmileyPong1.py`：\n\n\
  ### SmileyPong1.py\n\n```python\nimport pygame       # Setup\npygame.init()\nscreen\
  \ = pygame.display.set_mode([800,600])\npygame.display.set_caption(\"Smiley Pong\"\
  )\nkeepGoing = True\npic = pygame.image.load(\"CrazySmile.bmp\")\ncolorkey = pic.get_at((0,0))\n\
  pic.set_colorkey(colorkey)\npicx = 0\npicy = 0\nBLACK = (0,0,0)\nWHITE = (255,255,255)\n\
  timer = pygame.time.Clock()\npoints = 0\nlives = 5\nfont = pygame.font.SysFont(\"\
  Times\", 24)\n\nwhile keepGoing:    # Game loop\n    for event in pygame.event.get():\n\
  \        if event.type == pygame.QUIT:\n            keepGoing = False\n    \n  \
  \  screen.fill(BLACK)\n    # ... (game logic) ...\n    \n    draw_string = \"Lives:\
  \ \" + str(lives) + \" Points: \" + str(points)\n    text = font.render(draw_string,\
  \ True, WHITE)\n    text_rect = text.get_rect()\n    text_rect.centerx = screen.get_rect().centerx\n\
  \    text_rect.y = 10\n    screen.blit(text, text_rect)\n    pygame.display.update()\n\
  \    timer.tick(60)\n\npygame.quit()      # Exit\n```\n\n# 增加难度和结束游戏：笑脸 Pong，2.0\
  \ 版本\n\n我们的 Smiley Pong 游戏 1.0 版本是可以玩的。玩家可以得分、失去生命，并在屏幕上看到进度。我们目前还没有的是游戏的结束。另一个是随着游戏进行而增加的挑战。我们将在\
  \ Smiley Pong 1.0 中添加以下功能，以创建一个更完整的 2.0 版本：失去最后一个生命时显示游戏结束的方法、在不关闭程序重新玩或开始新游戏的方法，以及随着游戏进行增加难度的方法。我们将逐一个添加这三个功能，最终出一个有趣、具有挑战性的街机风格游戏！\n\
  \n## 游戏结束\n\n1.0 版本从未停止过，因为我们没有添加处理游戏结束的逻辑。我们知道要测试的条件：当玩家没有剩余生命时，游戏结束。现在我们需要确定在失去最后一个生命时做什么。\n\
  \n我们要做的第一件事是停止游戏。我们不想关闭程序，但确实想停止球。我们要第二件事是更改屏幕上的文本，告诉玩家游戏结束了并给出他们的分数。我们可以在声明生命和分数的\
  \ `draw_string` 之后使用 `if` 语句完成这两个任务。\n\n\n\n\n```\nif lives < 1:\n    speedx = speedy\
  \ = 0\n    draw_string = \"Game Over. Your score was: \" + str(points)\n    draw_string\
  \ += \". Press F1 to play again. \"\n```\n\n通过将 `speedx` 和 `speedy`（分别为球的水平和垂直速度）改为零，我们停止了小球的移动。用户仍然可以在屏幕上移动挡板，但我们已经在视觉上结束了游戏，让用户知道游戏已经结束。文字让这一点变得更加清晰，而且还告诉了用户这一轮的表现如何。\n\
  \n目前，我们正告诉用户按 `F1` 重新游戏，但按下该键目前还没有产生任何作用。我们需要逻辑来处理按键事件并重新开始游戏。\n\n## 再次游戏\n\n我们希望在用户耗尽生命后后让他们玩一个新游戏。我们已经在屏幕上添加了文字，提示用户按\
  \ `F1` 键重新游戏，因此让我们添加代码来检测该按键并重新开始游戏。首先，我们将检查是否按了键，以及该按键是否为 `F1`：\n\n```\nif event.type\
  \ == pygame.KEYDOWN:\n    if event.key == pygame.K_F1: # F1 = New Game\n```\n\n\
  在游戏循环内部的事件处理 `for` 循环中，我们添加了一个 `if` 语句来检查是否存在 `KEYDOWN` 事件。如果是，我们将检查该事件中的按键（`event.key`），看它是否等于\
  \ `F1` 键（`pygame.K_F1`）。跟随第二个 `if` 语句之后的代码将是我们的“再次游戏”或“新游戏”代码。\n\n### 注意\n\n*你可以在\
  \ [`www.pygame.org/docs/ref/key.html`](http://www.pygame.org/docs/ref/key.html)\
  \ 获取 Pygame 键值的完整列表，例如 `K_F1`。*\n\n“再次游戏”意味着我们想要从头开始。对于 Smiley Pong，我们是从 `0` 分、`5`\
  \ 次生命开始的，小球从屏幕左上角 `(0, 0)` 以每帧 `5` 像素的速度向我们飞来。如果我们重置这些变量，就应该获得新游戏的效果：\n\n```\npoints\
  \ = 0\nlives = 5\npicx = 0\npicy = 0\nspeedx = 5\nspeedy = 5\n```\n\n将这些行添加到针对 `F1`\
  \ 键 `KEYDOWN` 事件的 `if` 语句中，你就能随时重启游戏。如果你想只在游戏结束后才允许重启，可以包含一个额外的条件 `lives == 0`，但我们将在\
  \ 2.0 版本中保持 `if` 语句现状，以便用户可以随时重启。\n\n## 越来越快\n\n我们的游戏缺少游戏设计的最后一个元素：随着游戏时间的的增加，它的挑战性并没有增加，因此有人可能会一直玩下去，注意力变得越来越少。让我们随着游戏的进行增加难度，以吸引玩家并让游戏更具街机感。\n\
  \n![image with no caption](img/imageatomoreillycomsourcenostarchimages2189047.png.jpg)\n\
  \n我们希望随着游戏的进行稍微增加小球的速度，但不要太快，否则玩家可能会感到沮丧。我们希望在每次碰撞后让游戏稍微快一点。实现此点的自然位置是在检查碰撞的代码中。增加速度意味着让\
  \ `speedx` 和 `speedy` 变大，以便小球在每帧的每个方向上移动得更远。尝试将我们的碰撞检测 `if` 语句（让球从屏幕每个边缘反弹的地方）改为：\n\
  \n```\nif picx <= 0 or picx >= 700:\n    speedx = -speedx * 1.1\nif picy <= 0:\n\
  \    speedy = -speedy + 1\n```\n\n在第一种情况下，当球在水平方向上从屏幕左右两侧反弹时，我们通过将其乘以 `1.1` 来增加水平速度\
  \ `speedx`（我们仍然用负号来改变方向）。这意味着在每次左右反弹后速度增加了 10%。\n\n当小球从屏幕顶部反弹时（`if picy <= 0`），我们知道当它从顶部反弹并向正\
  \ `y` 方向返回屏幕下方时，速度将变为正数，因此在用负号改变方向后，我们可以给 `speedy` 加 `1`。如果小球是以每帧 `5` 像素的 `speedy`\
  \ 速度到达顶部，它离开的速度将是每帧 `6` 像素，然后是 `7` 像素，以此此类推。\n\n如果你做了这些更改，你将看到球变得越来越快。但一旦小球开始变快，它就永远不会慢下来。很快，球运行得会快到让玩家在的一秒钟内失去全部五个生命。\n\
  \n我们将通过玩家每次失去生命时重置速度，让游戏更具可玩性（且公平）。如果速度快到用户无法用挡板击中球，那么可能是将速度重置为较慢的值的时机，以便玩家可以追上。\n\
  \n我们从屏幕底部反弹的代码是减少玩家生命的地方，因此让我们在减去生命后改变速度：\n\n```\nif picy >= 500:\n    lives -=\
  \ 1\n    speedy = -5\n```\n\n这让游戏变得更加合理，因为球不再失去控制；在玩家失去生命后，球会慢到足以让玩家击中好几次。\n\n然而，有一个问题是，球运行得可能太快，以至于可能会“卡”在屏幕底部；玩几次游戏后，玩家会遇到在一次反弹中失去所有剩余生命的情况。这是因为如果球运行得非常快，可能会移动到到底边缘下方很多，当我们重置速度时，在下一帧我们可能无法让球完全回到屏幕上。\n\
  \n为了解决这个问题，让我们在该 `if` 语句的末尾添加一行：\n\n```\npicy = 499\n```\n\n我们通过将 `picy` 设置为一个像\
  \ `499` 这样的值（将球完全放置在屏幕底部边界上方），在失去生命后将球完全移回屏幕。这将有助于我们的球无论在撞到底边缘时有多快，都能安全地回到屏幕上。\n\
  \n## 整合在一起\n\n这是我们完成的 2.0 版本，`SmileyPong2.py`。代码量不到 80 行，是一个完整的街机风格游戏，你可以向朋友和家人展示。你还可以进一步对其进行开发以提高你的编程技能。\n\
  \n### SmileyPong2.py\n\n\n\n\n\n```python\nimport pygame       # 设置\npygame.init()\n\
  screen = pygame.display.set_mode([800,600])\npygame.display.set_caption(\"Smiley\
  \ Pong\")\nkeepGoing = True\npic = pygame.image.load(\"CrazySmile.bmp\")\ncolorkey\
  \ = pic.get_at((0,0))\npic.set_colorkey(colorkey)\npicx = 0\npicy = 0\nBLACK = (0,0,0)\n\
  WHITE = (255,255,255)\ntimer = pygame.time.Clock()\nspeedx = 5\nspeedy = 5\npaddlew\
  \ = 200\npaddleh = 25\npaddlex = 300\npaddley = 550\npicw = 100\npich = 100\npoints\
  \ = 0\nlives = 5\nfont = pygame.font.SysFont(\"Times\", 24)\n\nwhile keepGoing:\
  \      # 游戏循环\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
  \            keepGoing = False\n        if event.type == pygame.KEYDOWN:\n     \
  \       if event.key == pygame.K_F1:     # F1 = 新游戏\n                points = 0\n\
  \                lives = 5\n                picx = 0\n                picy = 0\n\
  \                speedx = 5\n                speedy = 5\n    picx += speedx\n  \
  \  picy += speedy\n\n    if picx <= 0 or picx >= 700:\n        speedx = -speedx\
  \ * 1.1\n    if picy <= 0:\n        speedy = -speedy + 1\n    if picy >= 500:\n\
  \        lives -= 1\n        speedy = -5\n        speedx = 5\n        picy = 499\n\
  \n    screen.fill(BLACK)\n    screen.blit(pic, (picx, picy))\n\n    # 绘制挡板\n   \
  \ paddlex = pygame.mouse.get_pos()[0]\n    paddlex -= paddlew/2\n    pygame.draw.rect(screen,\
  \ WHITE, (paddlex, paddley, paddlew, paddleh))\n\n    # 检查挡板反弹\n    if picy + pich\
  \ >= paddley and picy + pich <= paddley + paddleh \\\n       and speedy > 0:\n \
  \       if picx + picw/2 >= paddlex and picx + picw/2 <= paddlex + \\\n        \
  \   paddlew:\n            speedy = -speedy\n            points += 1\n\n    # 在屏幕上绘制文字\n\
  \    draw_string = \"Lives: \" + str(lives) + \" Points: \" + str(points)\n    #\
  \ 检查游戏是否结束\n    if lives < 1:\n        speedx = speedy = 0\n        draw_string\
  \ = \"游戏结束。你的得分是: \" + str(points)\n        draw_string += \". 按 F1 重新游戏。 \"\n\n\
  \    text = font.render(draw_string, True, WHITE)\n    text_rect = text.get_rect()\n\
  \    text_rect.centerx = screen.get_rect().centerx\n    text_rect.y = 10\n    screen.blit(text,\
  \ text_rect)\n    pygame.display.update()\n    timer.tick(60)\n\npygame.quit() \
  \      # 退出\n```\n\n你可以继续在此示例的游戏元素基础上进行构建（参见编程挑战），或者你也可以使用这些构建模块来开发新内容。大多数游戏，甚至其他应用程序，都拥有你在本章中添加的这类功能，我们通常遵循与构建\
  \ Smiley Pong 类似的流程。首先，规划出游戏的骨架，然后构建一个可以运行的*原型*，或者说 1.0 版本。一旦它运行正常，就不断添加功能直到得到你想要的最终版本。在构建更复杂的应用程序时，你会发现*迭代版本控制*——即一次添加一个功能来创建新版本——非常有用的。\n\
  \n# 添加更多功能：SmileyPop V2.0\n\n我们将再次遵循迭代版本控制流程，添加我儿子 Max 和我希望在 第 9 章 的 SmileyPop 应用中看到的功能。首先，他希望每当鼠标点击破笑脸泡泡（或气球）时都有一个音效。其次，我们都希望有某种反馈和显示（也许是创建了多少泡泡以及破了多少），而我希望看到一些进度标志，比如我们破了多少比例的泡泡。SmileyPop\
  \ 应用已经很有趣了，但这些元素可以让它变得更好。\n\n回顾 SmileyPop.py；我们将从这个版本的应用程序开始，通过添加代码构建第二个版本（v2.0，version\
  \ 2.0 的缩写）。最终版本 *SmileyPop2.py* 所示图 10-7。\n\n## 使用 Pygame 添加声音\n\n添加的音效增加了一种有趣的反馈（用户只有在实际点击笑脸精灵时才会听到声音），但让我们同时也追踪用户创建和破掉的泡泡数量，以及他们破了多少比例的泡泡吧。\n\
  \n为了使用声音，你需要在 *SmileyPop.py* 相同的目录下有一个 `pop.wav` 文件。我们首先在设置部分初始化混合器并加载声音文件：\n\n\
  ```python\npygame.mixer.init()\npop = pygame.mixer.Sound(\"pop.wav\")\n```\n\n在游戏循环中，我们处理右键点击事件。如果用户点击了笑脸，检查碰撞并播放破碎声：\n\
  \n```python\nelif pygame.mouse.get_pressed()[2]:\n    # 检查碰撞的逻辑\n    if len(clicked_smileys)\
  \ > 0:\n        pop.play()\n```\n\n## 追踪并显示玩家进度\n\n我们想要添加的下一个功能是让用户感到取得了进展的方法。我们还将追踪用户创建的泡泡数量以及他们破掉的数量。\n\
  \n为了构建追踪这些数字的逻辑，我们在设置部分添加计数器变量：\n\n```python\nfont = pygame.font.SysFont(\"Arial\"\
  , 24)\nWHITE = (255,255,255)\ncount_smileys = 0\ncount_popped = 0\n```\n\n\n\n\n\
  我们将 `font` 变量设置为 Arial 字体族，大小为 24 磅。我们希望在屏幕上绘制白色文字，因此我们添加了一个颜色变量 `WHITE`，并将其设置为白色的\
  \ RGB 三元组 `(255,255,255)`。 `count_smileys` 和 `count_popped` 变量将存储创建和破出的表情脸数量，这两个变量在程序首次加载时都从零开始。\n\
  \n## 创建和破出的表情脸数量\n\n首先，让我们在表情脸添加到 `sprite_list` 时进行计数。为了做到这一点，我们移动到 `SmileyPop.py`\
  \ 代码的底部底部，那里 `if mousedown` 语句会检查鼠标是否在按下鼠标键的情况下被拖动，并将表情脸添加到我们的 `sprite_list` 中。在那个\
  \ `if` 语句中添加最后一行即可：\n\n```\nif mousedown:\n    speedx = random.randint(-5, 5)\n\
  \    speedy = random.randint(-5, 5)\n    newSmiley = Smiley(pygame.mouse.get_pos(),\
  \ speedx, speedy)\n    sprite_list.add(newSmiley)\n    count_smileys += 1\n```\n\
  \n每当向 `sprite_list` 添加一个新表情脸时，给 `count_smileys` 加 1，将有助于我们跟踪绘制的表情脸总数。\n\n我们将在点击一个或多个表情脸时播放破碎声的\
  \ `if` 语句中添加类似的逻辑，但我们不会简单地给 `count_popped` 加 1——我们会加上被点击的表情脸实际数量。记住，用户可能点击了屏幕上重叠在同一点两个或多个表情脸精灵。在右键点击事件的事件处理器中，我们将所有这些碰撞的表情脸收集到了列表\
  \ `clicked_smileys` 中。要找到向 `count_popped` 添加多少分，我们只需再次使用 `len()` 函数获取用户通过这次右键点击破出的表情脸正确数量。在你为破碎声编写的\
  \ `if` 语句中添加此行：\n\n```\nif len(clicked_smileys) > 0:\n    pop.play()\n    count_popped\
  \ += len(clicked_smileys)\n```\n\n通过向 `count_popped` 添加 `len(clicked_smileys)`，我们在任何时间都将拥有正确的破出表情脸数量。现在，我们只需要在游戏循环中添加代码，显示创建的表情脸数量、破出的数量以及破出的百分比以衡量用户的进度。\n\
  \n![没有说明的图像](img/httpatomoreillycomsourcenostarchimages2189053.png.jpg)\n\n就像在我们的\
  \ Smiley Pong 显示中，我们将创建一个文本字符串绘制在屏幕上，并使用 `str()` 函数将数字显示为字符串。在游戏循环中 `pygame.display.update()`\
  \ 之前添加这些几行：\n\n```\ndraw_string = \"Bubbles created: \" + str(count_smileys)\ndraw_string\
  \ += \" - Bubbles popped: \" + str(count_popped)\n```\n\n这些行将创建我们的 `draw_string`\
  \ 并显示创建的表情泡泡数量和破出的数量。\n\n## 破出的表情脸百分比\n\n在两个 `draw_string` 语句之后添加这三行：\n\n```\nif\
  \ (count_smileys > 0):\n    draw_string += \" - Percent: \"\n    draw_string +=\
  \ str(round(count_popped/count_smileys*100, 1))\n    draw_string += \"%\"\n```\n\
  \n为了获得所有已创建表情脸中破出的百分比，我们将 `count_popped` 除以 `count_smileys`（`count_popped/count_smileys`），然后乘以\
  \ 100 得到百分值（`count_popped/count_smileys*100`）。但如果我们尝试显示这个数字将会有两个问题。首先，当程序启动且两个值都为零时，我们的百分比计算将产生“除以零”错误。为了修复这个问题，只有当\
  \ `count_smileys` 大于零时我们才显示百分比。\n\n其次，如果用户创建了三个表情脸并破出了其中一个——比例为三分之一，即 1/3——百分比将是\
  \ 33.333333333.... . . . 我们不希望每次百分比计算中出现循环小数时显示都变得非常长，因此让我们使用 `round()` 函数将百分比保留到一位小数。\n\
  \n最后一步是用白色像素绘制字符串，将这些像素在屏幕顶部附近居中，并调用 `screen.blit()` 将这些像素复制到游戏窗口的绘制屏幕：\n\n```\n\
  text = font.render(draw_string, True, WHITE)\ntext_rect = text.get_rect()\ntext_rect.centerx\
  \ = screen.get_rect().centerx\ntext_rect.y = 10\nscreen.blit (text, text_rect)\n\
  ```\n\n你可以在 图 10-7 中看到这些更改的效果。\n\n较小的表情脸更难捕捉和破出，尤其是当它们移动得很快时，因此很难破出 90%。这正是我们想要的。我们使用了这种反馈和挑战/成就组件让应用程序感觉更像我们可能会玩的游戏。\n\
  \n![添加声音和进度/反馈显示后，SmileyPop 应用现在更像一个游戏了。](img/httpatomoreillycomsourcenostarchimages2189055.png.jpg)\n\
  \n图 10-7. 添加声音和进度/反馈显示后，SmileyPop 应用现在更像一个游戏了。\n\n破碎声和进度显示反馈让 SmileyPop 感觉像一个移动应用程序。当你通过右键点击破出表情脸时，你可以想象在移动设备上点击表情脸来破它们。（要学习如何构建移动应用，请查看\
  \ MIT 的 App Inventor：[`appinventor.mit.edu/`](http://appinventor.mit.edu/)。）\n\n\
  ## 汇总\n\n这是 SmileyPop 2.0 版本的完整代码。记住将 `.py` 源代码文件、`CrazySmile.bmp` 文件和 `pop.wav`\
  \ 音频文件放在同一个文件夹中。\n\n近 90 行代码的应用程序可能太长而无法手动输入。访问 [`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)\
  \ 下载代码，以及声音和图片文件。\n\n### SmileyPop2.py\n\n\n\n\n```python\nimport pygame\nimport\
  \ random\n\nBLACK = (0,0,0)\nWHITE = (255,255,255)\npygame.init()\nscreen = pygame.display.set_mode([800,600])\n\
  pygame.display.set_caption(\"Pop a Smiley\")\nmousedown = False\nkeep_going = True\n\
  clock = pygame.time.Clock()\npic = pygame.image.load(\"CrazySmile.bmp\")\ncolorkey\
  \ = pic.get_at((0,0))\npic.set_colorkey(colorkey)\nsprite_list = pygame.sprite.Group()\n\
  pygame.mixer.init()    # Add sounds\npop = pygame.mixer.Sound(\"pop.wav\")\nfont\
  \ = pygame.font.SysFont(\"Arial\", 24)\ncount_smileys = 0\ncount_popped = 0\n\n\
  class Smiley(pygame.sprite.Sprite):\n    pos = (0,0)\n    xvel = 1\n    yvel = 1\n\
  \    scale = 100\n\n    def __init__(self, pos, xvel, yvel):\n        pygame.sprite.Sprite.__init__(self)\n\
  \        self.image = pic\n        self.scale = random.randrange(10,100)\n     \
  \   self.image = pygame.transform.scale(self.image,\n                          \
  \                  (self.scale,self.scale))\n        self.rect = self.image.get_rect()\n\
  \        self.pos = pos\n        self.rect.x = pos[0] - self.scale/2\n        self.rect.y\
  \ = pos[1] - self.scale/2\n        self.xvel = xvel\n        self.yvel = yvel\n\
  \    def update(self):\n        self.rect.x += self.xvel\n        self.rect.y +=\
  \ self.yvel\n        if self.rect.x <= 0 or self.rect.x > screen.get_width() - self.scale:\n\
  \            self.xvel = -self.xvel\n        if self.rect.y <= 0 or self.rect.y\
  \ > screen.get_height() - self.scale:\n            self.yvel = -self.yvel\n\nwhile\
  \ keep_going:\n    for event in pygame.event.get():\n        if event.type == pygame.QUIT:\n\
  \            keep_going = False\n        if event.type == pygame.MOUSEBUTTONDOWN:\n\
  \            if pygame.mouse.get_pressed()[0]: # Left mouse button, draw\n     \
  \           mousedown = True\n            elif pygame.mouse.get_pressed()[2]: #\
  \ Right mouse button, pop\n                pos = pygame.mouse.get_pos()\n      \
  \          clicked_smileys = [s for s in sprite_list if\n                      \
  \             s.rect.collidepoint(pos)]\n                sprite_list.remove(clicked_smileys)\n\
  \                if len(clicked_smileys) > 0:\n                    pop.play()\n\
  \                    count_popped += len(clicked_smileys)\n        if event.type\
  \ == pygame.MOUSEBUTTONUP:\n            mousedown = False\n    screen.fill(BLACK)\n\
  \    sprite_list.update()\n    sprite_list.draw(screen)\n    clock.tick(60)\n  \
  \  draw_string = \"Bubbles created: \" + str(count_smileys)\n    draw_string +=\
  \ \" - Bubbles popped: \" + str(count_popped)\n    if (count_smileys > 0):\n   \
  \     draw_string += \" - Percent: \"\n        draw_string += str(round(count_popped/count_smileys*100,\
  \ 1))\n        draw_string += \"%\"\n\n    text = font.render(draw_string, True,\
  \ WHITE)\n    text_rect = text.get_rect()\n    text_rect.centerx = screen.get_rect().centerx\n\
  \    text_rect.y = 10\n    screen.blit (text, text_rect)\n\n    pygame.display.update()\n\
  \    if mousedown:\n        speedx = random.randint(-5, 5)\n        speedy = random.randint(-5,\
  \ 5)\n        newSmiley = Smiley(pygame.mouse.get_pos(), speedx, speedy)\n     \
  \   sprite_list.add(newSmiley)\n        count_smileys += 1\n\npygame.quit()\n```\n\
  \n编写的程序越多，你的编程水平就会越好。你可以从编写你感兴趣的游戏开始，编写编写一个解决你关注的问题的应用，或者为他人开发应用。继续编写代码，解决更多问题，让编程变得越来越擅，你很快就能帮助创建出让全球用户受益的产品。\n\
  \n无论你是在编写移动游戏和应用；编写控制汽车、机器人或无人机的程序；还是构建下一个社交媒体 Web 应用程序，编程都是一项可以改变生活的技能。\n\n你拥有这些技能。你拥有这种能力。继续练习，继续编码，去创造改变吧——改变你自己的生活，改变你关心的人的生活，并改变这个世界。\n\
  \n## 你学到了什么\n\n在本章中，你学习了游戏设计的各种元素，从目标和成就到规则和机制。我们从零开始构建了一个单人“笑脸乒乓”（Smiley Pong）游戏，并将我们的\
  \ SmileyPop 应用变成了可以在手机或平板电脑上运行的游戏。我们将动画、用户交互和游戏设计相结合，构建了两个版本的笑脸乒乓游戏以及第二个版本的 SmileyPop，并在过程中不断添加新功能。\n\
  \n掌握了本章的概念后，你应该能够：\n\n-   在自己使用的游戏和应用中识别常见的游戏设计元素。\n-   在你编写的应用中加入游戏设计元素。\n-   通过绘制游戏板和组件以及添加用户交互来构建游戏的骨架。\n\
  -   编写游戏组件之间的碰撞检测并计数。\n-   使用 `pygame.font` 模块在屏幕上显示文本信息。\n-   编写逻辑判断游戏结束。\n-  \
  \ 在 `pygame` 中检测并处理按事件。\n-   编写在游戏结束后重新开始或再次运行的代码。\n-   使用数学和逻辑让游戏越来越难。\n-   使用\
  \ `pygame.mixer` 模块为应用添加声音。\n-   显示百分比和四舍五入的数字以告知进度。\n-   理解迭代版本：每次向应用添加功能并保存为新版本（1.0、2.0\
  \ 等）。\n\n## 编程挑战\n\n有关这些挑战的示例答案以及本章所需的音频文件，请访问 `http://www.nostarch.com/teachkids/`。\n\
  \n### #1 音效\n\n我们可以为 Smiley Pong 2.0 版本添加一个音效功能。在经典的 Pong 游戏机和街机中，当玩家得分时球会发出“blip”声，当失分时会发出“buzz”或“blap”声。在你最后的挑战之一中，利用你在\
  \ SmileyPop 2.0 版本中学学到的技能，通过为得分和失败弹跳添加音效，将 Smiley Pong v2.0 升级到 v3.0。将此新文件保存为 `SmileyPong3.py`。\n\
  \n## #2 命中与缺失\n\n\n\n\n\n为了让 SmileyPop 应用更具游戏性，可以添加逻辑来跟踪总点击次数中的命中和未命中次数。如果用户在右键点击时击中了任何笑脸精灵，将\
  \ `hits` 计数加 1（每次点击命中 1 次——我们不希望重复 `count_popped`）。如果用户右键点击但没有击中任何笑脸精灵，将其记录为一次 `miss`（未命中）。你可以编写逻辑在达到一定数量的未命中后游戏，或者给用户特定的总点击次数，以获得尽可能高的百分比。你甚至可以添加一个计时器，告诉玩家在例如\
  \ 30 秒内尽可能创建并弹出笑脸泡泡。将此新版本保存为 `SmileyPopHitCounter.py`。\n\n# #3: 清除泡泡\n\n你可能想添加一个“清除”功能（或作弊按钮），通过按下某个功能键弹出所有泡泡，就像我们在\
  \ Smiley Pong 中的“再次游戏”功能一样。你还可以通过在笑脸脸每次弹击边缘时将其速度乘以一个小于 1 的数字（如 0.95），让它们随时间推移减慢。可能性是无限的。\n\
