  \n> “这本书可以为你的孩子在高科技世界中的成功提供快速启动。”\n> —Ken Coleman，领导力专书作家，《Ken Coleman 秀》前任电台主持人\n\
  \n> “Payne 博士为我们指明了通梦想工作的道路！通过《教你的孩子编程》，他为世界各地的父母和老师提供了机会，让他们为下一代创造性问题解决者做同样的事情。”\n\
  > —Shah and Susan Rahman，Riot Games\n\n> “Bryson 帮助人们用技术改善生活。他的书也是如此。”\n> —Ash Mady，RedHat,\
  \ Inc. 技术经理\n\n> “对父母和孩子来说既有趣又易上手。”\n> —Steve McLeod，北乔治亚州大学副首席信息官\n\n> “Payne 博士用机器人、游戏和有趣的程序在大学期间激励了我，《教你的孩子编程》将这种对编写酷炫应用程序的热情延伸到了校园之外。”\n\
  > —Bobby Brown，GetUWired 首席开发人员\n\n# 关于作者\n\nBryson Payne 博士是北乔治亚州大学的计算机科学终身教授，在那里他教授了超过\
  \ 15 年的未来程序员。他的学生已经在暴雪娱乐、Riot Games、Equifax、CareerBuilder 等公司建立了成功的职业生涯。他是 UNG 计算机科学系的第一任系主任，拥有乔治亚州大学的计算机科学博士学位。此外，他还广泛与\
  \ K–12 学校合作，以促进技术教育。\n\nPayne 博士编写程序已有 30 多年。他卖出的第一份程序是 1985 年卖给《RUN》杂志（Commodore\
  \ 64）的“Magic”专栏，售价为 10 美元。\n\nPayne 博士住在乔治亚州亚特兰大北部，与他的妻子 Bev 以及两个儿子 Alex 和 Max 生活在一起。\n\
  \n# 关于插画\n\nMiran Lipovača《Learn You a Haskell for Great Good!》的作者。他喜欢拳击、弹贝斯吉，当然还有绘画。他对跳动的骨骼和数字\
  \ 71 非常着迷，当他走过自动门时，会假装自己是用用意打开它们的。\n\n# 关于技术评审员\n\nAri Lacenski 是一位 Android 应用程序和\
  \ Python 软件开发者。她住在旧金山。她在 `http://gradlewhy.ghost.io/` 上撰写关于 Android 编程的文章，在“Women\
  \ Who Code”担任导师，并用吉他弹关于太空海盗的歌曲。\n\n# 致谢\n\n没有 No Starch Press 团队卓越的支持，这本书的出版是不可能的。特别感谢\
  \ Bill Pollock 对该项目的信任；感谢 Tyler Ortman 的支持和编辑；感谢 Leslie Shen、Riley Hoffman、Lee Axelrod、Mackenzie\
  \ Dolginow、Serena Yang 和 Laurel Chun 在不辞辛劳的编辑、评审、营销和制作方面的卓越表现，以及他们通过无数方式帮助我从初稿改进了这本书。还要感谢\
  \ Rachel Monaghan 和 Paula Fleming 在文稿编辑和校对方面的帮助。\n\n感谢 Michelle Friend 和 Ari Lacenski\
  \ 周全详尽的技术评审，感谢 Conor Seng 成为第一个阅读这本书并尝试程序的人——当时他才 10 岁。\n\n感谢 Miran Lipovača 创作的精彩插画——它们为文字注入了我梦寐以求的生命力。\n\
  \n感谢我的岳父 Norman Petty，一位退休的 IBM 员工，他通过这本书的初稿开始自学 Python。\n\n感谢我的妻子兼最好的朋友 Bev 的持续支持，以及我可爱的儿子\
  \ Alex 和 Max 对每一个程序的测试和建议。因为你们，这本书和我的整个生活变得无限美好。\n\n最后，感谢我的妈妈 Esta，她鼓励我热爱学习和解决问题。\n\
  \n# 引言：什么是编程？为什么它对孩子有好处？\n\n计算机编程或 `coding` 是一项孩子应该学习的关键技能。我们使用计算机来解决问题、玩游戏、更有效地工作、执行重复任务、存储和检索信息、创造新事物以及与朋友和世界联系。理解如何编程让这些力量触手可及。\n\
  \n每个人都可以学会编程，它就像解决谜题一样。你运用逻辑，尝试解决方案，进行实验，然后解决问题。学习编程的时间就是`现在`！我们处于一个前所未有的时代：以前从未像现在这样每天通过计算机连接。我们生活在一个充满可能的世界，从电动汽车、机器人护理到配送包裹甚至披萨的无人机。\n\
  \n如果你的孩子现在开始学习编程，他们将定义这个快速变化的世界。\n\n# 为什么孩子应该编程？\n\n学习计算机编程有很多理由，但这里是我最重要的两点：\n\n\
  *   编程很有趣。\n*   编程是一项有价值的职业技能。\n\n\n\n\n\n编码是 21 世纪的技能。如今的工作比以往任何时候都要求解决问题的能力，而且越来越多的职业将技术视为一项不可或缺的要求。\n\
  \n美国劳工统计局预测，在未来五年内将创造超过 800 万个技术性岗位。在 2014–2015 年《职业展望手册》中，增长最快的十大职业中，有七个属于计算机科学或信息技术（IT）领域，这些职业不需要硕士或博士学位。\n\
  \n马克·扎克伯格在 2004 年开发第一个版本的 Facebook 时，还是一个在宿舍里工作的大学生。仅仅 10 年后，每月就有 13.9 亿人使用 Facebook（来源：[`http://newsroom.fb.com/company-info/](http://newsroom.fb.com/company-info/)`）。历史上从未有任何一个想法、产品或服务能够在十年内吸引十亿人的参与。Facebook\
  \ 展示了技术比以往任何时候都能更快、更触达更多人的力量。\n\n# 孩子们可以在哪里学习编码？\n\n这本书仅仅是一个开始。学习编程的地方比以往任何时候多；像`Code.org`、`Codecademy`（参见图\
  \ 1）以及无数其他网站都用各种热门的编程语言教授从基础到高级的编程知识。当你和孩子一起完成这本书后，你的孩子可以通过`EdX`、`Udacity`和`Coursera`等网站的免费课程来进一步扩展他们的学习。\n\
  \n![Codecademy 教你如何用各种语言逐步渐进地编程。](img/httpatomoreillycomsourcenostarchimages2188673.png.jpg)\n\
  \n图 1。Codecademy 教你如何用各种语言逐步渐进地编程。\n\n“编码俱乐部”是和朋友一起边玩边学习的好方法。在相关领域获得大学学位仍然是准备职业的最佳方式之一，但即使目前无法上大学，你的孩子也可以从现在开始建立编程作品集，展示他们作为程序员和问题解决者的技能。\n\
  \n# 如何使用这本书\n\n这本书不仅仅是给孩子的——它也适用于家长、老师、学生以及想要理解计算机编程基础的成年人，既是为了好玩，也是为了获得高科技经济中的新工作。无论你的年龄大小，你都可以愉快地学习编程基础。做到此最好的方法是实验和合作。\n\
  \n## 探索！\n\n如果你愿意尝试新事物，学习编程是令人兴奋的。当你和孩子跟随书中的程序进行时，尝试更改代码中的数字和文本，看看程序发生了什么变化。即使你弄坏了，你也会通过修复它来学习新知识。在最坏的情况下，你只需要重新输入书中的示例，或者打开上一个可以运行的版本。学习编码的意义在于尝试新事物、学习新技能并用新的方式解决问题。确保你的孩子们在玩耍——通过改变内容来测试代码、保存程序、运行它、观察发生了什么并修复任何错误。\n\
  \n学习编码的意义在于尝试新事物、学习新技能并用新的方式解决问题。通过改变内容、保存程序、运行它、观察结果并在需要修复错误来测试你的代码。\n\n例如，我写了一些代码来画一张彩色的图（图\
  \ 2），然后我回去，改了这里那里的一些数字，并尝试再次运行程序。这给了我另一幅完全不同但同样惊人的画。我再次回去，改了其他一些数字，又得到了另一幅美丽、独特的画。看看仅仅通过玩玩，你能做些什么吧？\n\
  \n![我在程序的一行代码中尝试不同的值创建的三个彩色螺旋图](img/httpatomoreillycomsourcenostarchimages2188677.png.jpg)\n\
  \n图 2。我在程序的一行代码中尝试不同的值创建的三个彩色螺旋图\n\n## 一起努力！\n\n对代码进行实验是学习程序如何运作极极方法，如果你和其他人一起工作，效果会更好。无论你是在教孩子或学生，还是为自己学习，一起玩代码不仅更有趣，而且更有效。\n\
  \n例如，在铃尔木音乐教学法中，家长会和孩子一起上课，甚至会预先学习，以便在课程之间帮助孩子。早早开始是铃尔木教学法的另一个特点；孩子们可以在三、四岁时开始正式学习。\n\
  \n当我两个儿子两岁和四岁时开始向他们介绍编程，我鼓励他们通过改变每个程序的微小部分（如颜色、形状和大小）来获得乐趣。\n\n我在 13 岁时通过输入书籍中的程序示例并修改它们以实现新功能来学会编程的。现在，在我教的计算机科学课程中，我经常给学生一个程序，并鼓励他们玩代码以构建新东西。\n\
  \n如果你正在用这本书来自学，可以通过找一个朋友一起研究示例，或者通过启动一个课后编码俱乐部（参见[`coderdojo.com/](http://coderdojo.com/)`或[`http://www.codecademy.com/afterschool/](http://www.codecademy.com/afterschool/)\
  \ 获取想法和建议）。编码是一项团队运动！\n\n## 在线资源\n\n本书所有的程序文件可以在[`http://www.nostarch.com/teachkids/](http://www.nostarch.com/teachkids/)`\
  \ 获取，还有编程挑战的解决方案。下载程序并实验学习更多。如果你卡住了，可以使用解决方案。去看看吧！\n\n![无标题的图片](img/httpatomoreillycomsourcenostarchimages2188682.png.jpg)\n\
  \n# 编码 = 解决问题\n\n无论你的孩子是两岁学习数数，还是 22 岁寻找新挑战，这本书以及它介绍的概念都是通往有回报的爱好和更好职业机会的绝佳途径。世界上的问题并非都能仅靠技术解决，但技术可以以前无法想象的规模和速度实现交流、协作、意识和行动。你会解决问题。问题解决者拥有让世界变得更好的力量，所以从现在开始编码吧。\n\
  \n# 第一章 Python 基础：了解你的环境\n\n几乎任何东西都可以包含计算机——手机、汽车、手表、游戏机、健身设备、医疗设备、工业设备、问候卡或机器人。计算机编程，或*编码*，是我们告诉计算机执行任务的方式，理解编码让计算机的力量触手可及。\n\
  \n计算机程序——也称为*应用程序*，或*应用*——告诉计算机做什么。网页应用可以告诉计算机如何记录你喜爱的音乐；游戏应用可以告诉计算机如何显示具有真实画面的史诗；简单的应用可以告诉计算机画出一个像图\
  \ 1-1 中六边形一样的美丽的螺旋。\n\n![一个彩色螺旋图](img/httpatomoreillycomsourcenostarchimages2188686.png.jpg)\n\
  \n图 1-1。一个彩色螺旋图\n\n\n\n\n\n有些应用程序由成千上万行代码组成，而另一些可能只有几行，例如图 1-2 中的`NiceHexSpiral.py`程序。\n\
  \n![NiceHexSpiral.py，一个绘制螺旋的短 Python 程序](img/httpatomoreillycomsourcenostarchimages2188690.png.jpg)\n\
  \n图 1-2.*NiceHexSpiral.py*，一个绘制图 1-1 中螺旋的短 Python 程序。图 1-1。\n\n这个短程序绘制了图 1-1 中所示的彩色螺旋。我想要一张漂亮的图片作为书中的示例，所以我决定用计算机程序来解决这个问题。首先，我构思了一个想法，然后开始编写代码。\n\
  \n在本章中，我们将下载、安装并学习使用这些程序，帮助我们编写代码构建你可以想象的任何应用程序。\n\n## 入门 Python\n\n要开始编写代码，我们必须学会计算机的语言。计算机需要逐步的指令，而且它们只能理解某些语言。就像来自俄罗斯的人可能无法理解英语一样，计算机只理解为它们设计的语言。计算机代码是用\
  \ Python、C++、Ruby 或 JavaScript 等编程语言编写的。这些语言允许我们与计算机“对话”并向它下命令。想想你教狗学会技巧——当你给出“坐”的命令时，它坐下了；当你说“叫”时，它就叫了。狗理解这些简单的命令，但不懂你说的其他内容。\n\
  \n![没有说明的图像](img/httpatomoreillycomsourcenostarchimages2188694.png.jpg)\n\n同样，计算机也有自己的局限性，但它们可以用它们的语言执行你要求的做的任何事情。我们在书中使用的语言是`Python`，一种简单而强大的编程语言。高中和大学的入门计算机科学课程都会教授\
  \ Python，它被用于运行世界上最强大的应用程序，包括 Gmail、Google Maps 和 YouTube。\n\n为了让你在计算机上开始使用 Python，我们将一起完成这三个步骤：\n\
  \n1. 下载 Python。\n2. 在你的计算机上安装 Python。\n3. 使用一个简单的程序测试 Python。\n\n![没有说明的图像](img/httpatomoreillycomsourcenostarchimages2188698.png.jpg)\n\
  \n### 1. 下载 Python\n\nPython 是免费的，可以很容易从 Python 网站获取，如图 1-3![Python 网站让下载 Python\
  \ 变得简单](img/httpatomoreillycomsourcenostarchimages2188700.png.jpg)\n\n图 1-3.Python\
  \ 网站让下载 Python 变得简单。\n\n在浏览器中，访问`https://www.python.org/`。将鼠标悬停在附近的`Downloads`菜单按钮上，点击以`Python\
  \ 3`开头的按钮。\n\n### 2. 安装 Python\n\n找到你刚刚下载的文件（它可能在你的`Downloads`文件夹中），双击它以运行并安装 Python\
  \ 和 IDLE 编辑器。IDLE 是我们将用来输入和运行 Python 程序的程序。有关详细的安装说明，请参见附录 A。\n\n### 3. 用程序测试 Python\n\
  \n在你的开始菜单或`Applications`文件夹中，找到 IDLE 程序并运行它。你会看到一个类似图 1-4 所示的基于文本的命令行窗口。这被称为 Python\
  \ shell。`shell`](#apd.html_gloss01_044）是一个允许用户输入命令或代码行的窗口或屏幕。\n\n![IDLE Python shell——我们学习\
  \ Python 的命令中心](img/httpatomoreillycomsourcenostarchimages2188705.png.jpg)\n\n图\
  \ 1-4. IDLE Python shell——我们学习 Python 的命令中心\n\n`>>>` 被称为`prompt`（提示符），它意味着计算机已准备好接受你的第一个命令。计算机在要求你告诉它要做什么。输入\n\
  \n```\nprint(\"Hello, world!\")\n```\n\n然后按下键盘上的 ENTER 或 RETURN 键。你应该看到 Python shell\
  \ 响应，打印出你在括号内输入的引号中的文本：`Hello, world!`。就是这样——你已经写了你的第一个程序！\n\n# 用 Python 编写程序\n\n\
  你通常会想编写比单行更长的程序，因此 Python 自带了一个用于编写较长程序的`editor`（编辑器）。在 IDLE 中，转到`File`**New File**（新建文件）菜单并选择**New\
  \ File**。会弹出一个空白屏幕，顶部显示为*Untitled*（无标题）。让我们写一个稍微长一点的程序。\n\n```\n## YourName.py\n\
  name = input(\"What is your name?\")\nprint(\"Hello, \", name)\n```\n\n第一行是注释。注释以\
  \ `#`开头，计算机会忽略它们。第二行要求用户输入名称并将其记录为`name`。第三行打印`Hello, ` 以及名称。\n\n## 在 Python 中运行程序\n\
  \n要保存文件，将其命名为 *YourName.py*，`.py`部分意味着这是一个 Python 程序。转到程序上方的**Run**（运行）选项并选择**Run\
  \ Module**（运行模块）。\n\n当你运行它时，你的窗口将开始显示`What is your name?`。在下一行输入你的名字并按回。程序将打印出来。由于你要求程序做的全部，程序将结束，你会再次看到`>>>`提示符，如图\
  \ 1-5 所示![计算机知道了我的名字！](img/httpatomoreillycomsourcenostarchimages2188712.png.jpg)\n\
  \n图 1-5.计算机知道了我的名字！\n\n对于小学生，比如我三岁的儿子，向他们解释程序要求他们输入名字很有趣。Max 知道他名字里的字母，所以他在键盘上输入*m*-*a*-*x*，当程序向他回复`Hi,\
  \ max`时，他非常开心。问你的年幼学习者是否想让程序说不同的内容。Max 说“Hello”，所以我修改了早期程序的第三行，将`Hi,` 改为`Hello,`。\n\
  \n然后我将第三行改为：\n\n```\nprint(\"Hello, \", name, name, name, name, name)\n```\n\n当程序回复`Hello,\
  \ max max max max max`时，Max 非常喜欢。尝试尝试程序的第二行第三行，让计算机问不同的问题并打印不同的答案\n\n## 你学到了什么\n\
  \n学习编程就像解决谜题、谜语或脑筋转弯。你从一个问题开始，应用已知的知识，并在过程中学习新知识。当你结束时，你锻炼了大脑，并回答了一个问题。希望你也过得愉快。\n\
  \n在本章中，我们解决了第一个重大问题：我们在计算机上安装了 Python 编程语言，以便我们可以开始编写代码。这就像下载文件、安装和运行一样简单。\n\n\n\
  \n\n\n在接下来的章节中，你将学习如何使用代码解决问题。你将从简单的视觉游戏开始，例如在电脑屏幕（或平板电脑或手机）上绘制形状，然后学习如何创建简单的游戏，如猜数字、剪刀石头布和乒乓球游戏。\n\
  \n通过在这些初始程序中建立的基础，你可以继续编写游戏、移动端应用程序、Web 应用程序等。\n\n到此时，你应该 . . .\n\n*   拥有一个功能完备的\
  \ Python 环境和文本编辑器。\n*   能够直接在 Python shell 中输入编程命令。\n*   能够在 IDLE 中编写、保存、运行和修改短程序。\n\
  *   准备好在第 2 章 中尝试更高级、更有趣程序。\n\n## 编程挑战\n\n在每个章节的末尾，你可以通过尝试几个挑战来练习所学的内容——并制作出更酷的程序！（如果你卡住了，请前往\
  \ *[`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)* 查看示例答案。）\n\
  \n#### #1: 填空游戏 (MAD LIBS)\n\n简单的 `YourName.py` 包含了我们构建更有趣程序所需的所有组件，比如老式的 Mad Libs\
  \ 文字游戏（如果你从未尝试过，请访问 *[`www.madlibs.com/`](http://www.madlibs.com/)*）。\n\n让我们修改 `YourName.py`\
  \ 程序并将其保存为 `MadLib.py`。我们不再询问用户的姓名，而是询问一个形容词、一个名词和一个过去式动词，并将它们存储在三个不同的变量中，就像我们在原始程序中对\
  \ `name` 执行的那样。然后，我们将打印出一个像“形容词 名 动词 越过了那只懒惰的棕色狗”这样的句子。修改后的代码如下。\n\n***MadLib.py***\n\
  \n```\nadjective = input(\"Please enter an adjective: \")\nnoun = input(\"Please\
  \ enter a noun: \")\nverb = input(\"Please enter a verb ending in -ed: \")\nprint(\"\
  Your MadLib:\")\nprint(\"The\", adjective, noun, verb, \"over the lazy brown dog.\"\
  )\n```\n\n你可以输入任何想要的形容词、名词和动词。当你保存并运行 `MadLib.py` 时，你应该看到的内容（我输入了 `smart`、`teacher`\
  \ 和 `sneezed`）：\n\n```\n>>>\nPlease enter an adjective: smart\nPlease enter a noun:\
  \ teacher\nPlease enter a verb ending in -ed: sneezed\nYour MadLib:\nThe smart teacher\
  \ sneezed over the lazy brown dog.\n>>>\n```\n\n#### #2: 更多填空游戏！\n\n让我们让 Mad Lib\
  \ 游戏变得更有趣一点。通过将其保存为 `MadLib2.py` 来开启 MadLib 的新版本。添加另一个输入行来询问动物类型。然后，修改 `print` 语句，删除\
  \ `dog` 一词，并在引号句子的末尾添加新的 `animal` 变量（在 `print` 语句内部，新变量前添加一个逗号）。如果你愿意，还可以进一步修改句子。你最终可能会得到“有趣的黑板打了个嗝，越过了那只懒惰的棕色蜥”——或者更有趣的内容！\n\
  \n## 第 2 章 龟绘图：使用 Python 绘画\n\n在本章中，我们将编写简短的程序来创建美复杂的视觉效果。为了实现这一点，我们将使用*龟绘图*（turtle\
  \ graphics）。在龟绘图中，你编写指令让一只虚拟（或想象中的）乌龟在屏幕上移动。乌龟带着一支笔，你可以指令乌龟用笔在它经过任何地方画线。通过编写代码让乌龟以酷炫的图案移动，你可以让它画出惊的图片。\n\
  \n使用龟绘图，你不仅可以用几行代码创建令人印象深刻的视觉效果，还可以跟随乌龟移动，观察每行代码如何影响它的运动。这将帮助你理解代码的逻辑。\n\n## 我们的第一个乌龟程序\n\
  \n让我们使用龟绘图编写我们的第一个程序。在 IDLE 的新窗口中输入以下代码，并将其保存为 `SquareSpiral1.py`。（你也可以在 *[`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)*\
  \ 下载此程序以及书中所有的程序。）\n\n### SquareSpiral1.py\n\n```\n#### SquareSpiral1.py - Draws\
  \ a square spiral\nimport turtle\nt = turtle.Pen()\nfor x in range(100):\n    t.forward(x)\n\
  \    t.left(90)\n```\n\n当我们运行这段代码时，我们得到一张非常整的图片（图 2-1）。\n\n![用短程序 SquareSpiral1.py\
  \ 创建的催眠方形螺旋](img/httpatomoreillycomsourcenostarchimages2188716.png.jpg)\n\n图 2-1.\
  \ 用短程序 SquareSpiral1.py 创建的催眠方形螺旋。\n\n##### 它是如何工作的\n\n让我们逐行分解程序，看看它是如何运行的。\n\n\
  `SquareSpiral1.py` 的第一行是一条注释。正如你在第 1 章 中学的那样，注释以井号（`#`）开头。注释允许我们编写关于程序正在做什么的笔记。第二行\
  \ `import turtle` 告诉计算机我们想要使用 `turtle` 库。第三行 `t = turtle.Pen()` 告诉计算机我们将用字母 `t`\
  \ 来代表乌龟的笔。\n\n第四行是最复杂的。在这里我们正在创建一个循环，它会重复执行一组指令。这个特定的循环设置了一个 `range`（范围），或列表，即从\
  \ 0 到 99 的 100 个数字。然后循环让字母 `x` 遍历该范围中的每一个数字。\n\n这个 `x` 是一个变量。变量存储一个在我们运行程序时可以改变或变异的值。\n\
  \n接下来的两行有缩进（即从左侧空留了空格）。这意味着它们在循环内部，并与上面的行一起，因此每当 `x` 获得新数字时，它们都会被重复执行。\n\n\n\n\n\
  让我们看看 Python 第一次读取这组指令时会发生什么。`t.forward(x)` 命令让乌龟笔在屏幕上向前移动 `x` 个点。因为 `x` 是 0，画笔完全没有移动。最后一行\
  \ `t.left(90)` 告诉乌龟向左转 90 度，或者说四之分之一。\n\n由于这个 `for` 循环，程序继续运行，并回到我们循环的起始位置。计算机将\
  \ `x` 加 1，使其移动到 `range` 范围内的下一个值，由于 1 仍在 0 到 99 的范围内，因此循环继续。现在 `x` 是 1，所以画笔向前移动了\
  \ 1 个点。然后，由于 `t.left(90)`，画笔再次向左转了 90 度。这个过程一次又一次进行。当 `x` 达到 99（即循环的最后一次）时，画笔正在绘制正方形螺旋外围的最长线。\n\
  \n![image with no caption](img/httpatomoreillycomsourcenostarchimages2188724.png.jpg)\n\
  \n这里是循环随 `x` 从 0 向 100 增长的逐步视觉过程：\n\n```\nfor x in range(100):\n    t.forward(x)\n\
  \    t.left(90)\n```\n\n| ![](img/httpatomoreillycomsourcenostarchimages2188728.png.jpg)\
  \ | 循环 0 到 4：绘制了前四条线（在 x = 4 之后）。 |\n\n| ![](img/httpatomoreillycomsourcenostarchimages2188732.png.jpg)\
  \ | 循环 5 到 8：又绘制了四条线；我们的正方形出现了。 |\n\n| ![](img/httpatomoreillycomsourcenostarchimages2188736.png.jpg)\
  \ | 循环 9 到 12：我们的正方形螺旋增长到了 12 条线（三个正方形）。 |\n\n你电脑屏幕上的点（或 `pixels`）可能太小了，让你很难看清。但是，随着\
  \ `x` 接近 100，乌龟绘制的线条包含的像素越来越多。换句话说，随着 `x` 变大，`t.forward(x)` 绘制的线条也越来越长。\n\n屏幕上的乌龟箭头画了一会儿，然后向左转，再画一些，向左转，然后一次又一次，每次的线条都更长。\n\
  \n最后，我们得到了一个迷人的正方形形状。向左转 90 度四次得到一个正方形，就像绕着建筑向左转四次会带你绕过建筑回到起点。\n\n在这个例子中我们之所以有一个螺旋，是因为每次向左转时走得都远一点。绘制的第一条线只有\
  \ 1 步长（当 `x` = 1 时），然后是 2（下一次循环），然后是 3、4，以此类推，直到 100 步，此时线条长度为 99 像素。再次，屏幕上的像素可能非常小，你你无法轻易看到每一个点，但它们确实在那里，你可以看到线条随着包含像素的增加而变长了。\n\
  \n通过让所有的转角都变成 90 度，我们得到了完美的正方形形状。\n\n# 连轴的乌龟 (Turtle on a Roll)\n\n让我们看看当我们改变程序中的一个数字时会发生什么。学习程序新知识的一种方法是观察当你改变它的某部分时会发生什么。你并不总是能得到漂亮的结果，但即使出现问题，你也可以从中学习。\n\
  \n仅将程序的最后一行改为 `t.left(91)` 并将其另存为 `SquareSpiral2.py`。\n\n## SquareSpiral2.py\n\n\
  ```\nimport turtle\nt = turtle.Pen()\nfor x in range(100):\n    t.forward(x)\n \
  \   t.left(91)\n```\n\n我提到过 90 度左转会创建一个完美的正方形。只比 90 度多转一点点——在这种情况下是每次转动 91 度——会让正方形稍微偏离。由于在进行下一次转动时它已经偏了一点，随着程序的继续，我们的新形状看起来越来越不像正方形。事实上，它形成了一个好看的螺旋形状，开始像楼梯一样向左旋转，正如你在图\
  \ 2-2 中看到的那样。\n\n![微小改变的正方形螺旋程序变成了螺旋楼梯。](img/httpatomoreillycomsourcenostarchimages2188740.png.jpg)\n\
  \n图 2-2。经过微小改变的正方形螺旋程序变成了螺旋楼梯。\n\n这也是一个很好的视觉效果，可以帮助你理解仅仅偏离一个数字就能剧烈改变程序的结果。1 度看起来不是什么大事，除非你偏了\
  \ 1 度 100 次（总共是 100 度），或者 1000 次，或者你正在用一个程序来降落飞机……\n\n![image with no caption](img/httpatomoreillycomsourcenostarchimages2188744.png.jpg)\n\
  \n如果你还不知道角度是如何工作的，暂时不用担心。只需玩玩这些数字，看看会发生什么。通过更改 `range` 后面括号中的值，将程序绘制的线条数改为 200、500\
  \ 或 50。\n\n再尝试将最后一行的角度改为 91、46、61 或 121 等。记住每次修改都要保存程序。然后运行它，看看你的修改如何影响程序绘制的内容。对几何学一定了解的老读者会根据所使用的角度看到一些熟悉的形状，甚至可以在程序运行前根据角度预测形状。较年轻的读者可以尽情尝试各种变化，这个练习可能会在他们将来某天的几何课上再次回到他们面前。\n\
  \n# 乌龟小结 (Turtle Roundup)\n\n说到几何，乌龟图形可以绘制出比直线多得有趣的形状。我们将在下一节再次回到正方形形状，但让我们稍作绕道，查看更多\
  \ Python Turtle 库的用法。\n\n让我们再改变一行代码：`t.forward(x)`。我们之前看到过这个命令（或函数）让乌龟笔向前移动 `x`\
  \ 像素。我们之前看到这个命令移动 `x` 像素并绘制一条直线；然后乌龟转动再次执行。如果我们改变那行代码来绘制更复杂的东西，比如圆呢？幸运的是，绘制具有特定大小（或半径）的圆的命令与绘制直线一样简单。将\
  \ `t.forward(x)` 改为 `t.circle(x)`，如下所示。\n\n## CircleSpiral.py\n\n```\nimport turtle\n\
  t = turtle.Pen()\nfor x in range(100):\n    t.circle(x)\n    t.left(91)\n```\n\n\
  哇！将一个命令从 `t.forward` 改为 `t.circle` 为我们带来了一个更复杂的形状，正如你在图 2-3 中看到的。`t.circle(x)` 函数告诉程序在当前位置绘制一个半径为\
  \ `x` 的圆。注意这个绘制与正方形螺旋有一个共同点：有四组螺旋，就像有四条边一样。这是因为我们仍然每次多转一点 90 度。如果你学过几何，你知道圆周是 360\
  \ 度，就像正方形的四个 90 度角。乌龟通过每次绕圈多转一点 90 度来绘制那个螺旋形状。\n\n![再一次改变带有了四组漂亮的螺旋圆。](img/httpatomoreillycomsourcenostarchimages2188749.png.jpg)\n\
  \n图 2-3。再一次改变带有了四组漂亮的螺旋圆。\n\n你会看到的一个区别是圆螺旋比正方形螺旋大——事实上是两倍大。这是因为 `t.circle(x)` 使用\
  \ `x` 作为圆的`半径`，半径是从中心到边缘的距离，或者是圆宽的一半。\n\n`x` 的半径意味着圆的`直径`或总宽度将是 `x` 的倍。换句话说，`t.circle(x)`\
  \ 在 `x` 等于 1 时绘制 2 像素宽的圆，在 `x` 为 2 时绘制 4 像素宽的圆，直到 `x` 为 99 时绘制 198 像素宽的圆。这接近 200\
  \ 像素宽，也就是正方形最长边的两倍，因此圆螺旋的大小大约是正方形螺旋的两倍。\n\n\n\n\n这些螺旋形形状很漂亮，但如果它们的颜色更丰富一点难道不是更酷吗？让我们回到方形螺旋代码，在\
  \ `t = turtle.Pen()` 之后之后向程序中再添加一行，将画笔颜色设置为红色：\n\n### SquareSpiral3.py\n\n```python\n\
  import turtle\nt = turtle.Pen()\nt.pencolor(\"red\")\nfor x in range(100):\n   \
  \ t.forward(x)\n    t.left(91)\n```\n\n运行程序，你将看到一个颜色更丰富的方形螺旋（图 2-4）。\n\n![方形螺旋变得稍微彩色了。](img/httpatomoreillycomsourcenostarchimages2188752.png.jpg)\n\
  \n图 2-4。方形螺旋变得稍微彩色了。\n\n尝试将 `\"red\"` 替换为其他常用颜色，如 `\"blue\"` 或 `\"green\"`，然后再次运行程序。你可以使用\
  \ Turtle 库中的数百种不同的颜色，包括一些奇特的颜色，如 `\"salmon\"` 和 `\"lemon chiffon\"`。（访问 *[`www.tcl.tk/man/tcl8.4/TkCmd/colors.htm`](http://www.tcl.tk/man/tcl8.4/TkCmd/colors.htm)*\
  \ 获取完整列表。）将整个螺旋设为一种颜色是一个很好的步骤，但如果我们想让每条*边*的颜色不同呢？那将对我们的程序进行更多的修改。\n\n#### 四色螺旋\n\
  \n让我们思考一下算法——即步骤的集合——将如何把我们的单色螺旋变为四色螺旋。大多数步骤与我们之前的螺旋程序相同，但增加了一些新变化：\n\n1. 导入 `turtle`\
  \ 模块并设置画笔。\n2. 告诉计算机我们想要使用哪些颜色。\n3. 设置一个循环在螺旋中绘制 100 条线。\n4. 为螺旋的每条边选择不同的画笔颜色。\n\
  5. 让画笔向前移动以绘制每条边。\n6. 让画笔左转以准备绘制下一条边。\n\n首先，我们需要一个颜色名称的列表而不是单一颜色，所以我们将设置一个名为 `colors`\
  \ 的列表变量，并在列表中放入四种颜色，如下：\n\n```python\ncolors = [\"red\", \"yellow\", \"blue\", \"\
  green\"]\n```\n\n这个包含四种颜色的列表将为我们的方形每条边提供一种颜色。注意，我们将颜色列表放在方括号 `[` 和 `]` 中。确保每个颜色名称都包含在引号，就像我们在第\
  \ 1 章 中打印出的单词一样，因为这些颜色名称是字符串，或文本值，稍后后会将它们传递给 `pencolor` 函数。如所述，我们正在使用名为 `colors`\
  \ 的变量来存储我们的四种颜色列表，因此每当我们想从列表中获取颜色时，都会使用 `colors` 变量来代表画笔颜色。记住，变量存储的是会变化的值。这体现在它们的名字里：它们是可变的！\n\
  \n![无说明的图像](img/httpatomoreillycomsourcenostarchimages2188757.png.jpg)\n\n接下来我们需要做的是在每一步绘制循环时*每次*更改画笔颜色。为了做到这一点，我们需要将\
  \ `t.pencolor()` 函数移动到 `for` 循环下的指令组中。我们还需要告诉 `pencolor` 函数我们想要使用列表中的一种颜色。\n\n输入以下代码并运行它。\n\
  \n##### ColorSquareSpiral.py\n\n```python\nimport turtle\nt = turtle.Pen()\ncolors\
  \ = [\"red\", \"yellow\", \"blue\", \"green\"]\nfor x in range(100):\n    t.pencolor(colors[x%4])\n\
  \    t.forward(x)\n    t.left(91)\n```\n\n这个四种颜色的列表是有意义的，我们可以在运行示例中看到它们（图 2-5）。到目前为止，一切顺利。\n\
  \n![一个颜色更丰富的方形螺旋程序](img/httpatomoreillycomsourcenostarchimages2188761.png.jpg)\n\
  \n图 2-5。一个颜色更丰富的方形螺旋程序\n\n唯一的新部分是 `pencolor` 函数中的 `(colors[x%4])`。语句内部 `x` 是我们在程序其他地方使用的同一个变量。因此，`x`\
  \ 将继续从 0 增长到 99，就像我们之前看到的那样。括号内的 `colors` 变量名告诉 Python 从我们在程序稍早添加的名为 `colors` 的颜色名称列表中选择一种颜色。\n\
  \n\n\n\n\n```python\nimport turtle\nt = turtle.Pen()\nturtle.bgcolor(\"black\")\n\
  colors = [\"red\", \"yellow\", \"blue\", \"green\"]\nfor x in range(100):\n    t.pencolor(colors[x%4])\n\
