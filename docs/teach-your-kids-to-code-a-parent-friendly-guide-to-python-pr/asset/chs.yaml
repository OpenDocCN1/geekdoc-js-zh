  \ Python 如何甚至帮助你完成数学作业！\n\n到目前，你应该能够做到以下操作：\n\n*   使用 Turtle 库绘制简单图形。\n*   使用变量存储简单的数值和字符串。\n\
  *   在 IDLE 中更改、保存和运行程序。\n\n## 编程挑战\n\n尝试这些挑战来练习在本章中学到的知识。（如果你卡住了，请访问 *[`www.nostarch.com/teachkids/`](http://www.nostarch.com/teachkids/)*\
  \ 查看答案。）\n\n**#1：改变边数**\n\n我们在统治一切的变量 的 `ColorSpiral.py` 程序中使用了一个变量 `sides`。\n\n\
  **#2：多少条边？**\n\n如果你想让用户来决定有多少条边会怎样？\n\n**#3：橡皮球**\n\n尝试将 `ColorSpiral.py` 程序改为一个更纠结、更抽象的形状。\n\
  \n\n\n\n\n在第 1 章和第 2 章中，我们使用了一些`variables`（你可能记得第 1 章中第一个程序中的 `name`，或者第 2 章](#ch02.html\
  \ \"第 2 章. 乌龟绘图：使用 Python 绘图\")中的 `x` 和 `sides`）。现在让我们看看变量到底是什么以及它们是如何工作的。\n\n`variable`是你希望计算机在程序运行期间记住的内容。当\
  \ Python “记住”某些内容时，它是将这些信息存储在计算机的内存中。Python 可以记住多种类型的 `values`，包括数值类型（如 `7`、`42`\
  \ 甚至 `98.6`）和字符串（字母、符号、单词、句子，或任何可以在键盘上输入的内容甚至更多）。在 Python 中，与大多数大多数现代编程语言一样，我们使用等号（`=`）给变量`赋值`一个值。像\
  \ `x = 7` 这样的赋值告诉计算机记住数字 7，并在我们任何调用 `x` 的时候将其返回给我们。我们还使用等号将一个键盘字符字符串赋值给变量；我们只需要记住在字符串周围加上引号（`\"\
  `），如下所示：\n\n```\nmy_name = \"Bryson\"\n```\n\n在这里，我们将值 `\"Bryson\"` 赋值给变量 `my_name`。`\"\
  Bryson\"` 周围的引号告诉我们这是一个字符串。\n\n每当你给变量赋值时，先写变量名，写在等号左侧，然后在等号右侧写上值。我们给变量起一个简单的、描述其内容的名字（例如当我存储我的名字时使用\
  \ `my_name`），这样我们就能轻松记住它们并在程序中使用它们。在为变量命名时，有几个规则需要记住。\n\n![没有标题的图片](img/httpatomoreillycomsourcenostarchimages2188785.png.jpg)\n\
  \n首先，变量名总是以字母开头。其次，变量名中的其余字符必须是字母、数字或下划线符号（`_`）；这意味着变量名内部不能有空格（例如，`my name` 将导致你得到语法错误，因为\
  \ Python 认为你列出了两个用空格分隔的变量）。第三，Python 中的变量名是`case sensitive`（区分大小写的）；这意味着如果在变量名中使用所有\
  \ `lowercase` 小写字母（如 `abc`），那么只有当我们以完全相同的方式（相同的大小写）输入变量名时，才能使用存储在变量中的值。例如，要使用 `abc`\
  \ 中的值，我们必须写 `abc`；不能使用 `uppercase` 大写字母如 `ABC`。因此，`My_Name` 不同于 `my_name`，而 `MY_NAME`\
  \ 是完全不同的另一个变量名。在书中，我们将在变量名中使用所有小写字母，并用 `_` 符号分隔单词。\n\n让我们尝试一个使用变量的程序。在新的 IDLE 窗口中输入以下代码并保存为\
  \ `ThankYou.py`。\n\n#### ThankYou.py\n\n```\nmy_name = \"Bryson\"\nmy_age = 43\n\
  your_name = input(\"What is your name? \")\nyour_age = input(\"How old are you?\
  \ \")\nprint(\"My name is\", my_name, \", and I am\", my_age, \"years old.\")\n\
  print(\"Your name is\", your_name, \", and you are\", your_age, \".\")\nprint(\"\
  Thank you for buying my book,\", your_name, \"!\")\n```\n\n当我们运行这个程序时，我们是在告诉计算机记住\
  \ `my_name` 是 `\"Bryson\"`，`my_age` 是 `43`。然后我们要求用户（运行程序的人）输入他们的名字和年龄，并告诉计算机将这些记录为变量\
  \ `your_name` 和 `your_age`。我们正在使用 Python 的 `input()` 函数告诉 Python 我们希望用户通过键盘输入（或*input`）内容。`Input`\
  \ 是我们称的在程序运行时输入到程序的信息——在这种情况下，就是用户的名字和年龄。括号内带引号的部分 `(\"What is your name? \")` 称为\
  \ `prompt`（提示），因为它提示了用户，或向他们提出了一个需要他们输入的问题。\n\n在最后三行中，我们告诉计算机打印我们存储在 `my_name` 以及其他三个变量中的值。我们甚至使用了两次\
  \ `your_name`，计算机正确地记住了一切，包括用户作为输入输入的部分。\n\n这个程序记住我的名字和年龄，询问用户他们的信息，并向他们打印了一条条友好的消息，如图\
  \ 3-1。\n\n![包含四个变量的程序及其产生的输出](img/httpatomoreillycomsourcenostarchimages2188789.png.jpg)\n\
  \n图 3-1. 一个包含四个变量的程序及其产生的输出\n\n# 数字与数学\n\n第 2 章 中的 `x` 在我们绘制螺旋线时计算了线条数量。Python 使用与你在数学课上使用的相同的运算符，包括\
  \ `+`、`-` 和括号 `()`，如表 3-1 所示。然而，某些运算符与你在学校里使用的不同，例如乘法运算符（星号 `*` 代替 `×`）和除法运算符（斜杠\
  \ `/` 代替 `÷`）。我们将在本节更好地了解这些运算符。\n\n## 数字\n\nPython 中的两种主要的数字类型是 `integers`（整数，包括负数，如\
  \ `7`）和 `floating-point numbers`（浮点数，如 `0.`）。还有两种我们在书中不常用的数字类型。第一种是 `Booleans`（布尔值），持有真或假值（类似于“真假”测试），第二种是\
  \ `complex numbers`（复数），持有虚数值（如果你懂代数，这可能会让你兴奋）。\n\n整数或全数字对于计数很有用，所以你说你是 5 或 16 或\
  \ 42 时，你使用的是整数。当你数到 10 时，你使用的是整数。\n\n浮点数或小数在我们想要得到分数时非常棒，例如 `3.5`、`1.25` 或 `25.97`。当然，在\
  \ Python 中，我们不包含单位（英里、披萨、美元），只包含小数数字。所以如果我们想存储一个披萨成本的变量（`cost_of_pizza`），我们可以这样赋值：`cost_of_pizza\
  \ = 25.97`。我们只需要记住我们使用的单位是美元、欧元或其他货币。\n\n## 运算符\n\n像 `+`（加号）和 `-`（减号）这样的数学符号被称为*operators``。然而，某些运算符与你在学校里使用的不同，例如乘法运算符（星号\
  \ `*` 代替 `×`）和除法运算符（斜杠 `/` 代替 `÷`）。\n\n\n\n\n### 表 3-1. Python 中的基础数学运算符\n\n| 数学符号\
  \ | Python 运算符 | 操作 | 示例 | 结果 |\n| --- | --- | --- | --- | --- |\n| + | `+` | 加法\
  \ | `4 + 2` | `6` |\n| – | `-` | 减法 | `4 - 2` | `2` |\n| × | `*` | 乘法 | `4 * 2`\
  \ | `8` |\n| ÷ | `/` | 除法 | `4 / 2` | `2.0` |\n| 4² | `**` | 幂 | `4 ** 2` | `16`\
  \ |\n| ( ) | `()` | 括号（分组） | `(4 + 2) * 3` | `18` |\n\n在 Python Shell 中进行数学运算\n\n\
  这是一个尝试 Python 数学运算的好时机；这次我们使用 Python Shell。正如你可能从第 1 章记得的那样，Python Shell 让你直接访问\
  \ Python 的力量，而无需编写整个程序。它有时被称为`命令行`，因为你可以逐行输入命令并立即看到结果。你可以直接在 Python Shell 的命令提示符（带有闪烁光标的\
  \ `>>>` 符号）处输入一个数学题（在编程中称为`表达式`\n\n尝试输入表 3-1 中列出的示例并看看 Python 怎么说；图 3-2 显示了一些示例输出。你也可以随意尝试你自己的数学题。\n\
  \n![输入表 3-1 中的示例数学题（表达式），Python 将给出答案！](img/httpatomoreillycomsourcenostarchimages2188802.png.jpg)\n\
  \n图 3-2. 输入表 3-1 中的示例数学题（表达式），Python 将给出答案！\n\n## 语法错误：你说了什么？\n\n当我们在 Python Shell\
  \ 中输入时，我们有机会学习`syntax errors`（语法错误）。每当 Python 或任何编程语言无法理解你输入的命令时，它可能会返回类似 `\"Syntax\
  \ Error\"`（语法错误）的消息。这意味着你要求计算机执行某事的`way`（方式）或你的语法存在问题。\n\n`语法`查看一些语法错误的示例，随后是用 Python\
  \ 可以理解的方式描述的表达式。\n\n![学习说 Python 语言](img/httpatomoreillycomsourcenostarchimages2188806.png.jpg)\n\
  \n图 3-3. 学习说 Python 语言\n\n当我们用普通英语问 Python “What is 4 + 2?” 时，Python 回复 `\"SyntaxError:\
  \ invalid syntax\"`（无效语法），以告诉我们它无法理解我们要求它做什么。当我们给 Python 提供正确的表达式 `4 + 2` 时，Python\
  \ 每次都会正确回答：`6`。同样，多出的字符，例如语句 `3 + 3 =` 结尾的等号，会困扰 Python，因为 Python 将等号视为赋值运算符，用于给变量赋值值。当我们输入\
  \ `3 + 3` 并按下回车键时，Python 会理解并始终给出正确答案：`6`。\n\n我们可以依靠计算机在每次提供适当输入时正确且快速地回答，这一事实是编程最强大的方面之一。只要我们用它们理解的语言正确地进行编程，我们就可以依靠计算机进行快速、准确的计算。这就是你在学习\
  \ Python 编码时正在学习的内容。\n\n## Python Shell 中的变量\n\n正如我们讨论过的，Python Shell 让我们直接访问 Python\
  \ 的编程力量，而无需编写整个独立程序。在 Python Shell 中输入时，我们甚至可以使用变量，如 `x` 和 `my_age`；我们只需要给它们赋值即可。\n\
  \n如果你输入 `x = 5` 并按下回车键，Python 会创建变量 `x` 并将值 `5` 赋值给它。如果你接着输入 `x` 并按下回车键，Python 将返回\
  \ `5`。同样，多出的字符，例如语句 `3 + 3 =` 结尾的等号会困扰 Python，因为 Python 将等号视为赋值运算符，用于给变量赋值。当我们输入\
  \ `3 + 3` 并按下回车键时，Python 会理解并始终给出正确答案：`6`。\n\n我们可以依靠计算机在每次提供适当输入时正确且快速地回答，这一事实是编程最强大的方面之一。只要我们用它们理解的语言正确地进行编程，我们就可以依靠计算机进行快速、准确的计算。这就是你在学习\
  \ Python 编码时正在学习的内容。\n\n\n\n\n让我们写一个小型程序来计算一个简单披萨订单的总费用，包括销售税。假设我们正在订购一个或多个价格相同的披萨，订单地点是在美国佐治亚州的亚特兰大。那里有一种销售税不包含在菜单价格中，而是在购买最后添加的。税率为\
  \ 8%，这意味着我们每为披萨支付 1 美元，就必须支付 8 分钱的销售税。我们可以用文字将这个程序模型描述如下：\n\n1. 询问用户想要多少个披萨。\n2.\
  \ 询问每份披萨的菜单价格。\n3. 计算披萨的总费用作为小计。\n4. 计算应交的销售税，为小计的 8%。\n5. 将销售税加到小计中得到最终总额。\n6.\
  \ 向用户显示包括税在内的应付总额。\n\n我们已经学会了如何向用户请求输入。为了对我们输入的数字进行计算，我们还需要另一个函数：`eval()`。`eval()`\
  \ 函数会*求值*，即计算出我们输入的字符串的值。Python 中的键盘输入始终以文本字符字符串的形式接收，因此我们使用 `eval()` 将该输入转换为数字。所以，如果我们在程序中输入\
  \ `\"20\"`，`eval(\"20\")` 将给我们数字值 `20`，然后我们就可以将其用于数学公式来计算新数字，例如 20 个披萨的费用。在处理 Python\
  \ 数字操作时，`eval()` 函数非常强大。\n\n现在由于我们已经知道如何将用户输入转换为可以计算的数字，就可以将我们程序计划的编号步骤转换为实际代码了。\n\
  \n### 注意事项\n\n对于每个编程示例，你可以在查看书中的代码之前，先尝试编写你自己的程序。从开始编写注释（`#`）开始，概述解决问题所需的步骤。然后在每个注释下方填入编程步骤，在需要提示时查阅书中的代码。\n\
  \n在一个新窗口中输入以下内容，并将其保存为 `AtlantaPizza.py`。\n\n### AtlantaPizza.py\n\n```python\n\
  # AtlantaPizza.py - 一个简单的披萨费用计算器\n\n## 询问用户想要多少个披萨，并用 eval() 获取数字\nnumber_of_pizzas\
  \ = eval(input(\"How many pizzas do you want? \"))\n\n## 询问每份披萨的菜单价格\ncost_per_pizza\
  \ = eval(input(\"How much does each pizza cost? \"))\n\n## 计算披萨的总费用作为小计\nsubtotal\
  \ = number_of_pizzas * cost_per_pizza\n\n## 计算应交的销售税，为小计的 8%\ntax_rate = 0.08 #\
  \ 将 8% 存储为小数值 0.08\nsales_tax = subtotal * tax_rate\n\n## 将销售税加到小计中得到最终总额\ntotal\
  \ = subtotal + sales_tax\n\n## 向用户显示包括税在内的应付总额\nprint(\"The total cost is $\",total)\n\
  print(\"This includes $\", subtotal, \"for the pizza and\")\nprint(\"$\", sales_tax,\
  \ \"in sales tax.\")\n```\n\n这个程序将你学的变量和运算符知识整合进一个强大的程序中。通读一遍，并确保你理解每个部分是如何工作的。你会如何修改程序以使其适用于不同的销售税率呢？\n\
  \n注意，我们使用 `#`（井号）将程序的步骤作为注释包含在内。记住，注释是给人类阅读的；IDLE 编辑器将注释显示为红色，提醒我们 Python 会忽略这些部分。这种先用文字逐步写出程序，然后将这些步骤作为注释放入程序中的做法，在我们构建更长、更复杂的程序时非常有帮助。这就是我们的算法，即程序中需要遵循的步骤集。算法就像食谱：如果我们按照正确的顺序遵循所有步骤，我们的程序就会运行得完美！\n\
  \n当我们用文字（作为 `#` 注释）*并且*用代码（作为编程语句）编写算法时，我们正在实现两个目标。首先，通过确保不遗漏步骤，我们减少了程序中的错误。其次，我们让程序以后更容易被我们及他人阅读和理解。你应该从一开始就养成在程序中编写清晰注释的习惯，我们将在书中经常这样做。如果你不想输入所有的注释，程序仍然会运行；它们只是为了帮助你理解程序在做什么。\n\
