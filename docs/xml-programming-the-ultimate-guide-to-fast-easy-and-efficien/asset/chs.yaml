  \ 4\n```\n\n### SAX 解析器\n\nSAX 是 Simple API for XML 的简称，与 DOM 不同，它不会为 XML 文档创建对象。它可以从上到部读取。无法随机访问任何元素。SAX\
  \ 可以处理大型文档，因为它不存储内容。\n\n### SAX 工作原理\n\n我们熟悉事件驱动编程吗？SAX 是基于事件驱动的。我们在每天使用的应用程序中看到它们。\n\
  \n### 回调方法\n\n以下是在事件期间触发的回调方法。每个方法的名称说明了它遇到了何种标记。\n\n```java\nvoid startDocument()\n\
  void endDocument()\nvoid startElement(String uri, String localName, String qName,\
  \ Attributes atts)\nvoid endElement(String uri, String localName, String qName)\n\
  void characters(char[] ch, int start, int length)\nvoid ignorableWhitespace(char[]\
  \ ch, int start, int length)\nvoid processingInstruction(String target, String data)\n\
  void setDocumentLocator(Locator locator)\nvoid skippedEntity(String name)\nvoid\
  \ startPrefixMapping(String prefix, String uri)\nvoid endPrefixMapping(String prefix)\n\
  ```\n\n\n\n\n\n```java\nimport org.xml.sax.helpers.DefaultHandler;\n```\n\n创建一个\
  \ SAX 解析器实例。\n\n`SAXParserFactory factory = SAXParserFactory.newInstance();`\n\n\
  `SAXParser saxParser = factory.newSAXParser();`\n\n创建一个扩展 `DefaultHandler` 的 Java\
  \ 类并重写回调方法。\n\n### 创建一个扩展 DefaultHandler 的类\n\n```java\nclass SAXXMLHandler extends\
  \ DefaultHandler {\n\n  ## 重写 startElement 方法\n  @Override\n  public void startElement(String\
  \ uri, String localName, String qName, Attributes atts) throws SAXException {\n\
  \    // 方法实现\n  }\n\n  ## 重写 endElement 方法\n  @Override\n  public void endElement(String\
  \ uri, String localName, String qName) throws SAXException {\n    // 方法实现\n  }\n\
  \n  ## 重写 characters 方法\n  @Override\n  public void characters(char ch[], int start,\
  \ int length) throws SAXException {\n    // 方法实现\n  }\n}\n```\n\n-   通过 sax 解析器解析\
  \ XML 文件，并触发 `SAXXMLHandler` 类中重写的回调方法。\n\n`File xmlFile = new File(\"/user/shoes.xml\"\
  );`\n\n`SAXXMLHandler saxHandler = new SAXXMLHandler();`\n\n`saxParser.parse(xmlFile,\
  \ saxHandler);`\n\n让我们来看一个完整的 Java 示例代码及其输出，它演示了从“shoes.xml”（如代码段 10 所示）中解析并提取数据。\n\
  \n### Java 类\n\n```java\nimport java.io.File;\nimport javax.xml.parsers.SAXParser;\n\
  import javax.xml.parsers.SAXParserFactory;\nimport org.xml.sax.Attributes;\nimport\
  \ org.xml.sax.SAXException;\nimport org.xml.sax.helpers.DefaultHandler;\n\npublic\
  \ class ReadShoesXML {\n  public static void main(String[] args){\n    File inputFile;\n\
  \    SAXParserFactory factory;\n    SAXParser saxParser;\n    SAXXMLHandler saxHandler;\n\
  \    try {\n      xmlFile = new File(\"/user/shoes.xml\");\n      factory = SAXParserFactory.newInstance();\n\
  \      saxParser = factory.newSAXParser();\n      saxHandler = new SAXXMLHandler();\n\
  \      saxParser.parse(xmlFile, saxHandler);    \n    } catch (Exception e) {\n\
  \      e.printStackTrace();\n    }\n  }  \n}\n\nclass SAXXMLHandler extends DefaultHandler\
  \ {\n  boolean brandFlag = false;\n  boolean sizeFlag = false;\n  boolean colorFlag\
  \ = false;\n  boolean typeFlag = false;\n  String shoeItemNo = null;\n\n  @Override\n\
  \  public void startElement(String uri, String localName, String qName, Attributes\
  \ atts) throws SAXException {\n    if (qName.equalsIgnoreCase(\"shoe\")) {\n   \
  \   shoeItemNo = atts.getValue(\"itemno\");\n    } else if (qName.equalsIgnoreCase(\"\
  brand\")) {\n      brandFlag = true;\n    } else if (qName.equalsIgnoreCase(\"size\"\
  )) {\n      sizeFlag = true;\n    } else if (qName.equalsIgnoreCase(\"color\"))\
  \ {\n      colorFlag = true;\n    } else if (qName.equalsIgnoreCase(\"type\")) {\n\
  \      typeFlag = true;\n    }\n  }\n\n  @Override\n  public void endElement(String\
  \ uri, String localName, String qName) throws SAXException {\n    if (qName.equalsIgnoreCase(\"\
  shoe\")) {\n      System.out.println(\"End Element :\" + qName);\n    }\n  }\n\n\
  \  @Override\n  public void characters(char ch[], int start, int length) throws\
  \ SAXException {\n    System.out.println(\"Shoe Item No: \" + shoeItemNo);\n   \
  \ if (brandFlag) {\n      System.out.println(\"Brand: \" + new String(ch, start,\
  \ length));\n      brandFlag = false;\n    } else if (sizeFlag) {\n      System.out.println(\"\
  Size: \" + new String(ch, start, length));\n      sizeFlag = false;\n    } else\
  \ if (colorFlag) {\n      System.out.println(\"Color: \" + new String(ch, start,\
  \ length));\n      colorFlag = false;\n    } else if (typeFlag) {\n      System.out.println(\"\
  Type: \" + new String(ch, start, length));\n      typeFlag = false;\n    }\n  }\n\
  }\n```\n\n### 程序输出\n\n```\nShoe Item No: 1\nBrand: Reebok\nSize: 5\nColor: Brown\n\
  Type: Sports Shoe\nEnd Element : shoe\nShoe Item No: 2\nBrand: Puma\nSize: 7\nColor:\
  \ White\nType: Casual Shoe\nEnd Element : shoe\n```\n\n### 小贴士\n\n-   当解析的 XML 文件很大时，`DOM`\
  \ 解析器消耗更多内存且速度非常慢。\n-   `DOM` 实现可能使用 10 字节内存来处理 1 字节的 XML。\n-   当 XML 数据被重复使用时，优先选择\
  \ `DOM` 解析器。\n-   当 XML 文档深度嵌套时，优先选择 `DOM` 解析器。\n-   当 XML 文档通过流到达时，优先选择 `SAX` 解析器。\n\
  -   当 XML 巨大时，优先选择 `SAX` 解析器。\n\n我告诉过你了，这个解析器听起来很有趣！！\n\n## 第 7 章 - HTML5，为什么在这里？\n\
  \n`HTML5` 是 `HTML` 的增强版本，具有更多功能。`HTML5` 有什么如此迷人的地方？\n\n-   有新的 `canvas` 元素，有助于绘制图形。\n\
  -   有新的媒体元素。\n-   有新的表单元素。\n-   有新的结构化元素。\n-   语法被简化了。\n-   有新的特定内容元素。\n-   支持本地存储。\n\
  -   支持应用缓存。\n-   它现在是跨平台的。\n\n好吧，`HTML5` 看起来很棒，但我们为什么要在这里（XML 平台）讨论它呢？\n\n有一个原因，那就是\
  \ `XHTML5`，它是 XML 序列化的 `HTML5`。改进后的 `HTML5` 现在已经和 `XML` 一样好了。`XHTML5` 是 `XML` 的良好格式语法与\
  \ `HTML5` 功能的结合。根据所使用的媒体类型，可以选择 `HTML5` 或 `XHTML5`。\n\n### 总结\n\n`XML` 本身仅仅是一种良好格式文本的表示。它是一种定义结构化数据的机制。但它在信息交换中的应用提升了其作为标记语言的声誉。这本书介绍了创建和解释有效\
  \ XML 文档的方法，并配有实时示例。\n\n祝大家在实践所学时顺利。\n\n"
