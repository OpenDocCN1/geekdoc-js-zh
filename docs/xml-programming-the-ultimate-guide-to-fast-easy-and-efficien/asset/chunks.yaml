    \nIsn’t XML worth exploring?\n\n## Chapter 3 - Show me the Syntax and Semantics\n\
    \n![](images/00003.jpeg)\n\nToo much hype for a simple markup language isn’t it?\
    \ Let us learn it, use it and see how good it is. The first step in learning to\
    \ use a language is to learn the rules it abides.\n\n### XML is not a programming\
    \ language\n\nUnlike programming languages, XML does not perform any computation\
    \ or algorithm to process the data. It just holds the data in a structural way,\
    \ which can be interpreted by an `XML Parser`.\n\n### SNIPPET 3\n\n```xml\n<?xml\
    \ version='1.0' encoding=\"UTF-8\" standalone=\"no\" ?>\n<list:coffeeshopmanagementlist\n\
    xmlns:list=\"http://www.xml.example.com/ns/list\"\nxmlns:csf=\"http://www.xml.example.com/ns/coffeeshopfurniture\"\
