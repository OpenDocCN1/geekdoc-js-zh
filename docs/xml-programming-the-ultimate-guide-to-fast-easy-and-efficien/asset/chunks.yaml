  trans: "\n该类别定义了 `element-name` 中数据的类型。\n\n关键字 `EMPTY` 表示该元素将没有值。\n\n关键字 `ANY` 表示该元素可以包含任何类型的内容。\n\
    \n以下代码段示例了在 DTD 中声明带有子元素的各种语法：\n\n### 声明具有多个子元素的元素\n\n```xml\n<!ELEMENT camera\
    \ (lens, body, filter)>\n```\n\n### 声明具有二一子元素的元素\n\n```xml\n<!ELEMENT camera (filter|adapter)>\n\
    ```\n\n### 声明具有零或一个子元素的元素\n\n```xml\n<!ELEMENT camera (lens?)>\n```\n\n### 声明具有零或多个子元素的元素\n\
    \n```xml\n<!ELEMENT camera (lens*)>\n```\n\n### 声明至少有一个子元素的元素\n\n```xml\n<!ELEMENT\
    \ camera (lens+)>\n```\n\n### 声明只有一个子元素的元素\n\n```xml\n<!ELEMENT camera (lens)>\n\
    ```\n\n以下代码段展示了在 DTD 中声明属性的语法：\n\n### 通用语法\n\n```xml\n<!ATTLIST element-name attribute-name\
    \ attribute-type attribute-value>\n```\n\n### 必须属性值\n\n```xml\n<!ATTLIST element-name\
    \ attribute-name attribute-type #Required>\n```\n\n### 可选属性值\n\n```xml\n<!ATTLIST\
    \ element-name attribute-name attribute-type #Implied>\n```\n\n### 固定属性值\n\n```xml\n\
    <!ATTLIST element-name attribute-name attribute-type #Fixed \"value\">\n```\n\n\
    ### 字符数据类型属性值\n\n```xml\n<!ATTLIST element-name attribute-name CDATA attribute-value>\n\
    ```\n\n### 枚举属性值\n\n```xml\n<!ATTLIST element-name attribute-name (en1|en2|..)\
    \ attribute-value>\n```\n\n### 唯一 ID 属性值\n\n```xml\n<!ATTLIST element-name attribute-name\
    \ ID attribute-value>\n```\n\n### ID 引用属性值\n\n```xml\n<!ATTLIST element-name attribute-name\
    \ IDREF attribute-value>\n```\n\n### ID 引用列表属性值\n\n```xml\n<!ATTLIST element-name\
    \ attribute-name IDREFS attribute-value>\n```\n\n### XML 名称属性值\n\n```xml\n<!ATTLIST\
    \ element-name attribute-name NMTOKEN attribute-value>\n```\n\n### XML 名称列表属性值\n\
    \n```xml\n<!ATTLIST element-name attribute-name NMTOKENS attribute-value>\n```\n\
    \n### 实体属性值\n\n```xml\n<!ATTLIST element-name attribute-name ENTITY attribute-value>\n\
    ```\n\n### 实体列表属性值\n\n```xml\n<!ATTLIST element-name attribute-name ENTITIES attribute-value>\n\
    ```\n\n### 符号名称属性值\n\n```xml\n<!ATTLIST element-name attribute-name NOTATION attribute-value>\n\
    ```\n\n### 预定义 XML 值属性值\n\n```xml\n<!ATTLIST element-name attribute-name xml:\
    \ attribute-value>\n```\n\n```xml\n<?xml version=\"1.0\"?>\n<!DOCTYPE camera [\n\
    <!ELEMENT camera (lens,body,filter)>\n<!ELEMENT lens      (#PCDATA)>\n<!ELEMENT\
    \ body      (#PCDATA)>\n<!ELEMENT filter (#PCDATA)>\n]>\n<camera>\n<lens>Sigma\
    \ 55-250mm</lens>\n<body>Canon 7D</body>\n<filter>Canon</filter>\n</camera>\n\
    ```\n\n下面是一个内部 DTD 的示例：\n\n```xml\n<?xml version=\"1.0\"?>\n<!ELEMENT camera (lens,body,filter)>\n\
    <!ELEMENT lens      (#PCDATA)>\n<!ELEMENT body      (#PCDATA)>\n<!ELEMENT filter\
    \ (#PCDATA)>\n```\n\n下面是一个外部 DTD 及其对应的有效 XML 示例：\n\n```xml\n<?xml version=\"1.0\"\
    ?>\n<!ELEMENT camera (lens,body,filter)>\n<!ELEMENT lens      (#PCDATA)>\n<!ELEMENT\
    \ body      (#PCDATA)>\n<!ELEMENT filter (#PCDATA)>\n```\n\n上述 DTD 保存为 `camera.dtd`。XML\
    \ 中包含了该文件，并遵循 DTD 的标准。\n\n```xml\n<?xml version=\"1.0\"?>\n<!DOCTYPE camera SYSTEM\
    \ \"camera.dtd\">\n<camera>\n<lens>Sigma 55-250mm</lens>\n<body>Canon 7D</body>\n\
    <filter>Canon</filter>\n</camera>\n```\n\n你准备好构建你自己的 XML 了吗？\n\n# 第 5 章 - 动手实践\n\
    \n我们可以尝试一下运气吗？我们如何应用目前所学的知识？\n\n来吧，让我们尝试创建一个符合下方 `excursion.dtd` 标准的 XML 文档：\n\
    \n```xml\n<!DOCTYPE EXCURSION [ \n<!ELEMENT EXCURSION (PLACE+)>\n<!ELEMENT PLACE\
    \ (TYPE, DAY+)>\n<!ELEMENT DAY ((DATE, WEEKDAY) | (DATE, WEEKEND))+>\n<!ELEMENT\
    \ WEEKDAY (#PCDATA)>\n<!ELEMENT DATE (#PCDATA)>\n<!ELEMENT WEEKEND (#PCDATA)>\n\
    <!ATTLIST EXCURSION THEME CDATA #REQUIRED>\n<!ATTLIST PLACE STATE CDATA #REQUIRED>\n\
