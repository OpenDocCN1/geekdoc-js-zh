    \ length));\n      colorFlag = false;\n    } else if (typeFlag) {\n      System.out.println(\"\
    Type: \" + new String(ch, start, length));\n      typeFlag = false;\n    }\n \
    \ }\n}\n```\n\n### Program Output\n\n```\nShoe Item No: 1\nBrand: Reebok\nSize:\
    \ 5\nColor: Brown\nType: Sports Shoe\nEnd Element : shoe\nShoe Item No: 2\nBrand:\
    \ Puma\nSize: 7\nColor: White\nType: Casual Shoe\nEnd Element : shoe\n```\n\n\
    ## tidbits\n\n- `DOM` parsers consume more memory and are very slow, when the\
    \ XML files being parsed are large.\n- A `DOM` implementation might use 10 bytes\
    \ of memory to process one byte of XML.\n- When the data from the XML are repeatedly\
    \ used, `DOM` parsers are preferred.\n- When an XML document is deeply nested,\
    \ `DOM` parsers are preferred.\n- When an XML document arrives over a stream,\
    \ `SAX` parsers are preferred.\n- When an XML is huge, `SAX` parsers are preferred.\n\
    \nI told you, the parser sounds funny !!\n\n## Chapter 7 - HTML5, why here?\n\n\
    `HTML5` is an enhanced version of `HTML`, with more features. What is so fascinating\
    \ about `HTML5`?\n\n- There are new `canvas` elements, which help in drawing graphics.\n\
    - There are new media elements.\n- There are new form elements.\n- There are new\
    \ structural elements.\n- The syntax has been simplified.\n- There are new content-specific\
    \ elements.\n- There is support for local storage.\n- There is application cache.\n\
    - It is cross-platform now.\n\nOk, `HTML5` looks amazing, but why are we talking\
    \ about it here, on the XML platform?\n\nThere is a reason and it is `XHTML5`,\
    \ which is XML-serialized `HTML5`. The improved `HTML5` is now as good as `XML`.\
    \ The `XHTML5` is a hybrid of `XML`'s well-formed syntax and `HTML5`'s features.\
    \ Based on the media type used, the choice between `HTML5` and `XHTML5` can be\
    \ made.\n\n### Conclusion\n\n`XML` by itself, just a notation for well-formed\
    \ text. It is a mechanism for defining structured data. But its application in\
    \ information exchange had boosted up its reputation beyond a simple markup language.\
    \ This book presented the ways for creating and interpreting valid XML documents,\
    \ with real-time examples.\n\nI wish you good luck in practicing what they have\
    \ learnt.\n"
