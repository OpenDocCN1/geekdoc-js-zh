  trans: "\n\nWSDL - Web 服务描述语言（Web Services Description Language）是 XML 最重要的应用之一。WSDL\
    \ 是一种描述 Web 服务提供的功能的 XML 文档。它还描述了如何使用提供的服务。虽然这种 XML 对人类可读且可编辑，但大多数是通过程序化生成和消费的。\n\
    \n## 小贴士\n\n纯文本：`John Mathews`\n\nXML 文件（使用用户定义的标签将纯文本转换为可用的信息）：\n\n```xml\n<name>\n\
    \  <firstname> John</firstname>\n  <lastname> Mathews</lastname>\n</name>\n```\n\
    \nXML 不值得探索吗？\n\n## 第 3 章 - 学习语法与语义\n\n![](img/00003.jpeg)\n\n对于一个简单的标记语言来说，炒作得太过了了不是吗？让我们学习它、使用它，看看它到底有多好。学习使用一种语言的第一步是学习它遵循的规则。\n\
    \n### XML 不是一种编程语言\n\n与编程语言不同，XML 不执行任何计算或算法来处理数据。它只是以结构化的方式存储数据，这些数据可以被 `XML\
    \ Parser` 解析。\n\n### 代码片段 3\n\n```xml\n<?xml version='1.0' encoding=\"UTF-8\"\
    \ standalone=\"no\" ?>\n<list:coffeeshopmanagementlist\nxmlns:list=\"http://www.xml.example.com/ns/list\"\
    \nxmlns:csf=\"http://www.xml.example.com/ns/coffeeshopfurniture\"\nxmlns:a=\"\
    http://www.xml.example.com/ns/attender\">\n<list:coffeeshoptablelist>\n  <csf:name>Family\
    \ Table</csf:name>\n  <csf:number>1</csf:number>\n  <csf:seats>4</csf:seats>\n\
    \  <csf:type>Table and Chair</csf:type>\n  <a:tableattender>\n    <a:name>John</a:name>\n\
    \    <a:experience>4years</a:experience>\n  </a:tableattender>\n</list:coffeeshoptablelist>\n\
    <list:coffeeshoptablelist>\n  <csf:name>Corporate Table</csf:name>\n  <csf:number>2</csf:number>\n\
    \  <csf:seats>6</csf:seats>\n  <csf:type>Sofa</csf:type>\n  <a:tableattender>\n\
    \    <a:name>Peter</a:name>\n    <a:experience>2years</a:experience>\n  </a:tableattender>\n\
    </list:coffeeshoptablelist>\n</list:coffeeshopmanagementlist>\n```\n\n### 颜色代码：\n\
    \n- `XML version` 和编码类型\n- `Namespaces`（命名空间）\n- `Root Element`（根元素）\n- `Elements`（元素）\n\
    \n### XML 声明\n\n如果 XML 包含声明，那么它应该是 XML 的第一行。在代码片段 3 中，蓝色标记的第一行是 `XML declaration`，它通常以\
    \ `\"<?xml\"` 开始。XML 声明是区分大小敏感的，`\"<?xml\"` 应该始终小小写。XML 声明有三个参数 `version`（表示 XML\
    \ 的版本）、`encoding`（表示使用的编码类型）和 `standalone`（表示它是否是独立的 XML）。参数的使用顺序必须与前一个语句解释的顺序相同。参数\
    \ `\"version\"` 是声明中的强制性参数。\n\n### XML 元素\n\n每个 XML 都有一个根元素，它的名称通常说明了 XML 中元素集合代表了什么。在代码片段\
    \ 3 中，绿色标记的标签元素是该 XML 的根元素。`\"coffeeshopmanagementlist\"` 这个名称为我们提供了关于 XML 内容的提示。每个元素都带有标签（放在一对小于和大于符号\
    \ `<>` 之间）。元素必须正确地嵌套。\n\n### 代码片段 4\n\n```xml\n<?xml version='1.0' >\n<shoes>\n\
    \  <shoe>\n    <brand>Reebok</brand>\n    <size>4</size>\n    <color>Brown\n</shoes>\n\
    </shoe>\n```\n\n代码片段 4 显示了元素嵌套不当。在关闭标签元素 `</shoes>` 之前，必须关闭标签元素 `</color>` 和 `</shoe>`。代码片段\
    \ 5 显示了正确的嵌套方式。\n\n### 代码片段 5\n\n```xml\n<?xml version='1.0' >\n<shoes>\n  <shoe>\n\
    \    <brand>Reebok</brand>\n    <size>4</size>\n    <color>Brown</color>\n  </shoe>\n\
    </shoes>\n```\n\n XML 的元素可以有属性，它们被称为属性（attributes）。每个元素可以有一个或多个属性，且属性是区分大小敏感的。属性只能有一个值。在代码片段\
    \ 6 中，元素 `\"emails\"` 具有属性 `\"date\"` 和 `\"from\"`，值分别为 `\"10/12/2014\"` 和 `\"\
    Ann\"`。\n\n### 代码片段 6\n\n```xml\n<?xml version='1.0' >\n<organizer>\n  <emails\
    \ date =\"10/12/2014\" from=\"Ann\" >4 </emails>\n  <calls>2</calls>\n  <messages>\
    \ 25</messages>\n</ organizer>\n```\n\n### 代码片段 7\n\n```xml\n<?xml version='1.0'\
    \ >\n<organizer>\n  <emails date =\"10/12/2014\" from=\"Ann\" date =\"11/12/2014\"\
    >4 </emails>\n  <calls>2</calls>\n  <messages> 25</messages>\n</ organizer>\n\
    ```\n\n在代码片段 7 中，属性 `\"date\"` 有两个值 `\"10/12/2014\"` 和 `\"11/12/2014\"`，这是错误的。\n\
    \n### 命名空间\n\n由于 XML 元素名称都是由用户定义的，因此词汇冲突的可能性更大。在代码片段 8 中，元素 `\"coffeeshoptablelist\"\
    ` 和 `\"tableattender\"` 都有子元素 `\"name\"`。在这些情况下，为了避免混淆，我们采用命名空间。在代码片段 3 中，这个问题通过使用命名空间解决了。子元素\
    \ `\"name\"` 根据其上下文带有一个前缀。当它位于 `\"coffeeshoptablelist\"` 下时，它有一个前缀 `\"csf\"`；当它位于\
    \ `\"tableattender\"` 下时，它有一个前缀 `\"a\"`。这个前缀消除了消费端 XML 解释处理过程中可能的混淆。\n\n### 代码片段\
    \ 8\n\n```xml\n<?xml version='1.0' >\n<coffeeshoptablelist>\n  <name>Family Table</name>\n\
    \  <number>1</number>\n  <seats>4</seats>\n  <type>Table and Chair</type>\n  <tableattender>\n\
    \    <name>John</name>\n    <experience>4years</experience>\n  </tableattender>\n\
    </coffeeshoptablelist>\n```\n\n命名空间声明以属性 `\"xmlns\"` 开始，随后是本地标识符。\n\n### 命名空间声明语法\n\
    \n```xml\nxmlns:prefix=\"URI\"\n```\n\n命名空间声明示例\n\n```xml\nxmlns:list=\"http://www.xml.example.com/ns/list\"\
    \n```\n\n其中，`URI` 是资源标识符。它是映射到互联网资源的字符串，通常是一个 `URL`（统一资源定位符）或 `URN`（统一资源名称）。\n\
    \n## 小贴士\n\n- XML 声明没有闭合标签。\n- XML 声明参数区分大小写。\n- XML 中只有一个根元素。\n- 所有的 XML 元素都区分大小写的。\n\
    - 所有的 XML 元素必须有闭合标签。\n- 所有 XML 元素的值必须在单引号或双引号内。\n\n## 第 4 章 - 文档类型定义\n\n在实际应用中，XML\
    \ 文档跨应用程序使用。因此，XML 文档必须符合标准。所以一个 XML 不仅应当是格式良好的（well formed），而且是有效的（valid）。\n\n\
    ### 为什么用 DTD？\n\n文档类型定义（DTD）有助于构建有效的 XML。它是一个带有规则的文档，定义了 XML 文档的结构和合法元素。这使得 XML\
    \ 文档具有可比性并适用于应用程序的数据交换。消费应用程序可以使用相同的 DTD 验证输入的 XML 文档。\n\n### 示例：\n\n如果 XML 文档包含一个元素\
    \ `\"size\"`，它可以表示为 `<Size>` 或 `<size>` 或 `<SIZE>`。它可以有值，也可以为空；值可以是英寸或厘米。这些歧义在共享\
    \ XML 之前必须进行检查并实现标准的表示方法。\n\n### 声明元素的 DTD 语法\n\n```dtd\n<!ELEMENT SIZE (#PCDATA)>\n\
    ```\n\n### 如何创建 DTD\n\nDTD 可以是内部或外部的。内部 DTD 作为 XML 的一部分包含，而外部 DTD 是一个独立的文档。DTD\
    \ 将 XML 组件分为 5 个部分：\n\n- 元素\n- 属性\n- 实体\n- PCDATA\n- CDATA\n\n我们已经充分讨论了元素和属性，实体是\
    \ XML 文档中使用的特殊字符。实体包括：`<`, `>`, `&`, `'`, `\"` 。PCDATA 是会被解析器解析的文本，它们会被视为实体或标记。CDATA\
    \ 是不会被解析器解析的文本。\n\n### DTD 中的元素声明\n\n```dtd\n<!ELEMENT element-name category>\n\
    <!ELEMENT element-name EMPTY>\n<!ELEMENT element-name ANY>\n```\n\n其中，\n\n`element-name`\
    \ 将替换为实际的元素名称，`element-name` 区分大小写。\n\n"
