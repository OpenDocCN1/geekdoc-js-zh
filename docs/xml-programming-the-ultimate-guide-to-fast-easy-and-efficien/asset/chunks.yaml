    \  <csf:name>Family Table</csf:name>\n  <csf:number>1</csf:number>\n  <csf:seats>4</csf:seats>\n\
    \  <csf:type>Table and Chair</csf:type>\n  <a:tableattender>\n    <a:name>John</a:name>\n\
    \    <a:experience>4years</a:experience>\n  </a:tableattender>\n</list:coffeeshoptablelist>\n\
    <list:coffeeshoptablelist>\n  <csf:name>Corporate Table</csf:name>\n  <csf:number>2</csf:number>\n\
    \  <csf:seats>6</csf:seats>\n  <csf:type>Sofa</csf:type>\n  <a:tableattender>\n\
    \    <a:name>Peter</a:name>\n    <a:experience>2years</a:experience>\n  </a:tableattender>\n\
    </list:coffeeshoptablelist>\n</list:coffeeshopmanagementlist>\n```\n\n### Color\
    \ Codes:\n\n- `XML version` and the type of encoding\n- `Namespaces`\n- `Root\
    \ Element`\n- `Elements`\n\n### XML Declaration\n\nIf the XML includes a declaration\
    \ then it should be the first line of an XML. In the snippet 3, the first line\
    \ marked in blue is the `XML declaration`, it usually begins with `\"<?xml\"`.\
    \ XML declaration is case sensitive and `\"<?xml\"` should always be written in\
    \ lowercase. The XML declaration has three parameters `version` (it says the version\
    \ of XML), `encoding` (it says the type of encoding used) and `standalone` (it\
    \ says whether it is a standalone XML). The parameters must be used in the same\
    \ order as they are explained in the previous statement. The parameter `\"version\"\
    ` is a mandatory parameter in the declaration.\n\n### XML Elements\n\nEvery XML\
    \ has a root element, which mostly says what the collection of elements in the\
    \ XML represents, with its name. In Snippet 3, the tag element marked in the green\
    \ is the root element of that XML. The name `\"coffeeshopmanagementlist\"` gives\
    \ us the hint about what the XML contains. Every element is tagged (placed inside\
    \ a pair of lesser than and greater than symbols `<>`). The element must be properly\
    \ nested.\n\n### SNIPPET 4\n\n```xml\n<?xml version='1.0' >\n<shoes>\n  <shoe>\n\
    \    <brand>Reebok</brand>\n    <size>4</size>\n    <color>Brown\n</shoes>\n</shoe>\n\
    ```\n\nThe snippet 4 shows the improper nesting of elements. Before closing the\
    \ tag element `</shoes>`, the tag elements `</color>` and `</shoe>` must be closed.\
    \ The snippet 5 shows the proper way of nesting.\n\n### SNIPPET 5\n\n```xml\n\
    <?xml version='1.0' >\n<shoes>\n  <shoe>\n    <brand>Reebok</brand>\n    <size>4</size>\n\
    \    <color>Brown</color>\n  </shoe>\n</shoes>\n```\n\nThe elements of an XML\
    \ can have properties, they are termed as attributes. Each element can have one\
    \ or more attributes and the attributes are case sensitive. An attribute can have\
    \ only one value. In the snippet 6, the element `\"emails\"` has attributes `\"\
    date\"` and `\"from\"` and values `\"10/12/2014\"` and `\"Ann\"`, respectively.\n\
    \n### SNIPPET 6\n\n```xml\n<?xml version='1.0' >\n<organizer>\n  <emails date\
    \ =\"10/12/2014\" from=\"Ann\" >4 </emails>\n  <calls>2</calls>\n  <messages>\
    \ 25</messages>\n</ organizer>\n```\n\n### SNIPPET 7\n\n```xml\n<?xml version='1.0'\
    \ >\n<organizer>\n  <emails date =\"10/12/2014\" from=\"Ann\" date =\"11/12/2014\"\
    >4 </emails>\n  <calls>2</calls>\n  <messages> 25</messages>\n</ organizer>\n\
    ```\n\nIn snippet 7, the attribute `\"date\"` has two values `\"10/12/2014\"`\
    \ and `\"11/12/2014\"`, which is incorrect.\n\n### Namespaces\n\nSince, the XML\
    \ element names are all user-defined, there is a greater possibility of vocabulary\
    \ clash. In snippet 8, both the elements `\"coffeeshoptablelist\"` and `\"tableattender\"\
    ` have sub-element `\"name\"`. In such cases, to avoid confusion we go for namespaces.\
    \ In snippet 3 this problem was addressed using namespaces. The sub-element `\"\
    name\"` carries a prefix as per its context. When it is under `\"coffeeshoptablelist\"\
    `, it has a prefix `\"csf\"` and when it is under `\"tableattender\"`, it has\
    \ a prefix `\"a\"`. This prefix rules out the possible confusions during the processor\
    \ of XML interpretation, at the consumer end.\n\n### SNIPPET 8\n\n```xml\n<?xml\
    \ version='1.0' >\n<coffeeshoptablelist>\n  <name>Family Table</name>\n  <number>1</number>\n\
    \  <seats>4</seats>\n  <type>Table and Chair</type>\n  <tableattender>\n    <name>John</name>\n\
    \    <experience>4years</experience>\n  </tableattender>\n</coffeeshoptablelist>\n\
    ```\n\nThe namespace declaration begins with attribute `\"xmlns\"` followed by\
    \ the local identifier.\n\n### Namespace declaration syntax\n\n```xml\nxmlns:prefix=\"\
    URI\"\n```\n\nNamespace declaration example\n\n```xml\nxmlns:list=\"http://www.xml.example.com/ns/list\"\
    \n```\n\nWhere, `URI` is the Resource Identifier. It is a string which maps to\
    \ the internet resource, usually a `URL` (Uniform Resource Locator) or `URN` (Uniform\
    \ Resource Name).\n\n## tidbits\n\n- XML declaration has no closing tag.\n- XML\
    \ declaration parameters are case sensitive.\n- There is only one root element\
    \ in XML.\n- All the XML elements are case sensitive.\n- All the XML elements\
    \ must be closed with a closing tag.\n- All the XML elements' values must be inside\
    \ single or double quotes.\n\n## Chapter 4 - Document Type Definition\n\nIn real-time\
    \ usage XML documents are used across computer applications. Hence, the XML documents\
    \ must be built with standards. So an XML should not only be well formed but also\
    \ valid. A valid XML is one which is well formed and as well as it adheres to\
    \ standards.\n\n### Why DTD?\n\nDocument Type Definition helps in the process\
    \ of building a valid XML. It is a document with rules, which defines the structure\
    \ and legal elements of an XML document. This makes the XML document comparable\
    \ and eligible to be used for interchanging data across applications. The consuming\
    \ application can validate the incoming XML document with the same DTD.\n\n###\
    \ For Example:\n\nIf an XML document should include an element `\"size\"`, it\
    \ can be represented as `<Size>` or `<size>` or `<SIZE>`. It can have values or\
    \ it can be empty, the value can be in inches or centimetres. These ambiguities\
    \ should be checked and a standard way of representation must be achieved before\
    \ the XML is shared across platforms.\n\n### DTD syntax for declaring the element\
    \ Size\n\n```dtd\n<!ELEMENT SIZE (#PCDATA)>\n```\n\n### How DTDs are created\n\
    \nDTD can be either internal or external. The internal DTD will be included as\
    \ a part of the XML while, external DTD is a separate document. DTD groups the\
    \ XML components into 5 blocks:\n\n- Elements\n- Attributes\n- Entities\n- PCDATA\n\
    - CDATA\n\nWe have discussed enough on the elements and attributes, entities are\
    \ the special characters used in the XML document. Entities include: `<`, `>`,\
    \ `&`, `'`, `\"` . PCDATA are texts which will be parsed by the parser, they will\
    \ be treated as entities or markups. CDATA are texts which not be parsed by the\
    \ parser.\n\n### Element Declaration in DTD\n\n```dtd\n<!ELEMENT element-name\
    \ category>\n<!ELEMENT element-name EMPTY>\n<!ELEMENT element-name ANY>\n```\n\
    \nWhere,\n\nThe `element-name` will be replaced with the actual element name,\
    \ the `element-name` is case sensitive.\n"
