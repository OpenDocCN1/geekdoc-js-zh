    SAX Parser


    SAX is an acronym for Simple API XML, where SAX unlike DOM is an even-based parser.


    How SAX Works


    Aren''t we familiar with event-driven approaches?


    We are, we see them in our day to day use of computer applications. The GUI is
    based on event-driven programming, a pull-down menu dropping on scroll over a
    label, a pop up window opening on click of a button are all event-driven. Similarly,
    a SAX parser as it reads through the XML document, triggers the callback functions
    when it encounters a token (Example: start tag, an end tag, an element or an attribute).


    SAX parser reads the XML in one way approach, it can read it only from top to
    bottom. It does not create an object for the XML document or store its content.
    So it is not possible to access any element in random. Tokens are accessed in
    the same order they are identified. This behaviour gives SAX a lead over DOM,
    SAX can process huge XML documents as they do not store content.


    However, this approach gives the programmers the anxiety, the one way and no store
    approach makes the complex searching and cross reference implementations very
    hard. So the programmer has to write a piece of code which stores the XML content
    as and when the parser reads it, if complex searching is expected to be implemented.


    ## Callback Methods


    The following are the callback methods triggered during events. The name of each
    method says it precisely, encounter with which token would trigger them.


    voidstartDocument()


    voidendDocument()


    voidstartElement(String uri, String localName, String qName, Attributes atts)


    voidendElement(String uri, String localName,StringqName)


    void characters(char[] ch, int start, int length)


    voidignorableWhitespace( char[] ch, int start, int length)


    voidprocessingInstruction(String target, String data)


    voidsetDocumentLocator(Locator locator))


    voidskippedEntity(String name)


    voidstartPrefixMapping(String prefix, String uri)


    voidendPrefixMapping(String prefix)


    Parsing the XML document using SAX


    Like the DOM parser example, the SAX parser example will also be explained with
    a java class.


