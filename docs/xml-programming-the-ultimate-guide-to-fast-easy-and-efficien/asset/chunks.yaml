    <color>Brown</color>


    <type>Sports Shoe</type>


    </shoe>


    <shoe itemno = "2">


    <brand>Puma</brand>


    <size>7</size>


    <color>White</color>


    <type>Casual Shoe</type>


    </shoe>


    </shoes>


    In the snippet 10, "<shoes>", "<shoe>", "<brand>", "<size>", "<color>", "<type>",
    "</shoes>", "</shoe>", "</brand>", "</size>", "</color>", "</type>", "itemno",
    etcetera, are tokens and identifying them while parsing through the XML document
    are considered as events, which would trigger the respective callback method.
    Let us name this XML document as shoes.xml.


    To read the XML document "shoes.xml" through the java program, which employs a
    SAX parser, we must follow the steps below and create a java class:


