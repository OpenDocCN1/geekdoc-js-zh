    }\n```\n\n要解释 XML 文档中的数据，必须访问子节点并返回它们的标签名，可以使用 `getAttribute` 函数来获取属性值。\n\n```javascript\n\
    function viewOrganizerData() {\n    // 解释数据的逻辑\n}\n```\n\n### 输出\n\n```text\n\
    Root element : organizers\nNo. Of Emails : 4\nDate of Email : 10/12/2014\nEmail\
    \ was From : Ann\nNo. Of Calls : 2\nNo. Of Messages : 25\nNo. Of Emails : 1\n\
    Date of Email : 12/12/2014\nEmail was From : Jan\nNo. Of Calls : 0\nNo. Of Messages\
    \ : 4\n```\n\n## SAX 解析器\n\nSAX 是 Simple API for XML 的简称，与 DOM 不同，它不会为 XML 文档创建对象。它可以从上到部读取。无法随机访问任何元素。SAX\
    \ 可以处理大型文档，因为它不存储内容。\n\n## SAX 工作原理\n\n我们熟悉事件驱动编程吗？SAX 是基于事件驱动的。我们在每天使用的应用程序中看到它们。\n\
    \n## 回调方法\n\n以下是在事件期间触发的回调方法。每个方法的名称说明了它遇到了何种标记。\n\n```java\nvoid startDocument()\n\
