    ## Introduction


    Have you ever felt learning XML as a nightmare? Discouraged by the huge volumes
    of beginner guides? I understand the difficulty of extracting the core from a
    book which runs to few hundred pages. It is not very interesting to read few thousand
    lines for creating a simple XML document on your own. How would you feel, if I
    say I can do that job for you? I have read through hundreds of pages for you and
    will give you the ready to drink juice from the fruit.


    This book is a quick and easy guide, an extract from those heavy pillow-sized
    books, menacingly long examples and boring high level jargons. I wrote this book
    keeping in mind all the difficulties I faced as a beginner and thus the extract
    is simple, understandable and short.


    With this brief introduction, I request your attention and welcome you to travel
    through the book with me.


    ## Chapter 1 - What’s in a Markup language?


    ![](images/00001.jpeg)


    Like all human languages, computer languages are also developed for the purpose
    of communication. Human to computer communication, computer program to computer
    program communication are supported by various computer languages. Every language
    that is developed has a set of rules and procedures and we call them syntax. Languages
    can be grouped based on the type of communication they are developed for.


    Markup languages were primarily designed to instruct the software that displays
    text; they are designed to deliver information over the World Wide Web. Markup
    is a meta data, when it is added to a text or document it enhances its meaning.
    Precisely, markup language is a set of tags when added to a document can demarcate
    and highlight the various parts of that document.


    Markup languages use tags which contain the necessary specifications for processing,
    defining and presenting a text. One of the most popular markup languages is Hyper
    Text Markup Language, they have predefined semantics for presentation. Their greater
    use is in describing the structure of a website semantically along with cues for
    presentation. The predefined elements in a `HTML` include: headings, paragraphs,
    lists, tables, images, and hyperlinks.


    This is how a simple HTML code looks like:


    ### SNIPPET 1


    ```html

    <HTML>

    <HEAD>

    <TITLE>Markup Language HTML</TITLE>

    </HEAD>

    <BODY>

    <H1>

    This is a sample HTML page

    </H1>

    <P>

    SGML stands for Standard Generalized Markup Language.

    <BR>

    <B><I> SGML is not in itself a document language. </I></B>

    <UL>

    <LI><AHREF=”markuplanguage.htm”><B>Markup</B></A></LI>

    <LI><AHREF=”htmlpage.htm”><B>HTML Page</B></A></LI>

    <LI><AHREF=”xmlsampdocument.htm”><B>XML Sample</B></A></LI>

    </UL>

    </BODY>

    </HTML>

    ```


    ### tidbits


    Plain text: John Mathews


    HTML File (Displaying the plain text, using pre-defined tags):


    ```html

    <HTML>

    <HEAD><TITLE> Name </ TITLE ></ HEAD>

    <BODY><P> John Mathews </P><BODY>

    </HTML>

    ```


    Did you find something inside the markup vessel?


    ## Chapter 2 - Why XML when there is HTML?


    ![](images/00002.jpeg)


    XML is an acronym for eXtensible Markup Language; they provide means to share
    data and information between computer programs or computers. While HTML enables
    its users to process, define and present text using predefined presentation semantics,
    XML is a meta-markup language. Unlike HTML or `troff` in `XML` there aren''t any
    predefined tags, you need to create your tags and semantics as and how your communication
    demands. Also, XML concentrates on describing the structure and meaning of a document,
    it does not show how a document will look like. It does not describe the document''s
    format but style sheets can be used for formatting an XML document. Once the data
    is shared, it is the receiving computer program’s discretion to interpret useful
    information from them. Initially, XML was created as a means of web publishing
    but later, their usage unfolded in new arenas.


    XML is human readable, language independent; it can be shared across platforms
    and OS independent. XML is not only used to render HTMLs, it also renders raw
    data, which for instance can be processed and fed into databases. Now, there would
    arise an obvious question, why XML, a simple text file.


    ### SNIPPET 2


    ```xml

    <items>

    <item>

    <name>Coffee Table</name>

    <type>Wooden Furniture</type>

    <color>black</color>

    </item>

    <item>

    <name>Rocking Chair</name>

    <type>Wooden Furniture</type>

    <color>brown</color>

    </item>

    <item>

    <name>Bean Bag</name>

    <type>Rexene Furniture</type>

    <color>black</color>

    </item>

    <item>

    <name>Wall Stickers</name>

    <type>Wall Decor</type>

    <color>blue</color>

    </item>

    </items>

    ```


    The snippet 2 with additional information illustrates that the data in the `XML`
    represents the list of items in a store or stock.


    The following are some practical uses for XML:


    Data transfer and storage: Snippet 2 is a perfect example for using `XML` for
    database records. `XML` uses tags to label each field of information, thus making
    the process of data processing (searching, sorting, filtering, etcetera,) simple.


    Web publishing documents: Style sheets can be added easily to `XML` to get the
    desired layout.


    Exchanging information between computer programs: One of the most popular uses
    of `XML` among programmers is their use in web services communication. `XML` can
    carry information across web services, independent of the language or platform
    in which the web services are built.


    Creating KVM and boot for operating system: This is one of the least known usages
    of `XML`. Kernel-based Virtual Machine and a boot can be created using `XML` for
    any operating system.


    Creating, formatting, storing, encoding and exchanging: Mathematical formulas,
    chemical molecular structures, musical scores, DNA, RNA, protein sequence information,
    complex internet commerce transactions, astronomical data, Genealogical Data,
    etcetera, can be created or exchanged in the desired format.


    XML Based Operating System


    XML-based internet operating system (XIOS) is a proposal made by a company named
    Xcerion, this OS runs inside a web browser and expected to give a desktop computing
    experience with cloud-based computing benefits. There are many benefits expected
    from the proposed OS and the most important one is XIOS will be the safest OS
    ever as it will be immune to most of the malwares. The other advantages include:
    low development cost, data portability, platform and hardware independent and
    built-in collaboration. With the entire proposed feature, XIOS is more than a
    thin client. It can run applications locally, it can work offline, it can store
    files, it has a command line and it can collaborate and keep the files synchronized
    across machines.


    XML Based Interface Definition Language

