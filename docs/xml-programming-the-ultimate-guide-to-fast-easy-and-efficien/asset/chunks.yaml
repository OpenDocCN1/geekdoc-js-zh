    Chapter 6 - Interpreting XML - XML Parsers


    We learnt to create a well formed, valid XML. Did you say that? What? I couldn''t
    hear you.


    Yes you are right, I need not say a valid XML is well formed; it is implicit that
    a Valid XML is well formed.


    Back to the topic, we have an XML now and we need to know how to interpret it.


    ![tudor-tasha-1915-usa-untitled-cat-in-rocking-chair-2947413.jpg](images/00004.jpeg)


    Parser is a program written to interpret a text or string. XML parser is therefore
    a program written to interpret an XML document. Computers are useless unless they
    are instructed, so an XML parser instructs the computer program on how to read
    the XML file. Parsers parse through the XML document for accessing or modifying
    the information present. XML parsers have become an integral part of development
    platforms and popular browsers. The parsers can also validate an XML on its nesting,
    declarations, etcetera, they also validate the XML against DTD or schema.


    There are many types of XML parsers but the following two parsers are widely used:


    DOM Parser


    SAX Parser


    DOM Parser


    DOM is an acronym for Document Object Model. DOM creates an interface between
    the XML file and the computer program which consumes it, this enables the program
    to update or access data from the XML file. This is the most recommended parser
    from W3 consortium.


    How DOM Works


    A DOM parser creates an object model (tree structure) of the entire XML document,
    it parses through the XML in a hierarchical order. The DOM parser breaks the XML
    into three components: Elements, Attributes and Data.


    Where,


    -Elements are the XML elements from the XML file.


    -Attributes are the properties of the XML elements.


    -Data is the actual data, which the attribute value or the element data.


    ## SNIPPET 9


    <?xml version=''1.0'' >


    <organizers>


    <organizer>


    <emails date ="10/12/2014" from="Ann" >4 </emails>


    <calls>2</calls>


    <messages> 25</messages>


    </organizer>


    <organizer>


    <emails date ="12/12/2014" from="Jan" >1 </emails>


    <calls>0</calls>


    <messages>4</messages>


    </organizer>


    </organizers>


    In the snippet 9, "organizer", "emails", "calls" and "messages" are the elements,
    "date" and "from" are the attributes of the element "emails". Where, the actual
    data are the values of the attributes "date" and "from" and the data from the
    elements "emails", "calls" and "messages". Let us name this XML document as organizer.xml.


    Parsing the XML document using DOM


    Since a parser is used by a programming language to interpret an XML document,
    let see an example of DOM parsing in java. The three components: elements, attributes
    and data are all represented by a java class called "Node". Java API has ready
    to use XML packages and DOM packages. These packages have necessary java classes
    and methods to help XML interpretations.


    To parse the XML document "organizer.xml"(The XML in Snippet 9) through the java
    program, we need to write a java class. To write a java class which parse an XML
    document with the help of DOM parser, we must follow the steps below:


