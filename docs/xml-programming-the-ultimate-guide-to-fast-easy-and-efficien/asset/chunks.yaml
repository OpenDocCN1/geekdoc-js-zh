    \ 文档通过流到达时，优先选择 `SAX` 解析器。\n-   当 XML 巨大时，优先选择 `SAX` 解析器。\n\n我告诉过你了，这个解析器听起来很有趣！！\n\
    \n## 第 7 章 - HTML5，为什么在这里？\n\n`HTML5` 是 `HTML` 的增强版本，具有更多功能。`HTML5` 有什么如此迷人的地方？\n\
    \n-   有新的 `canvas` 元素，有助于绘制图形。\n-   有新的媒体元素。\n-   有新的表单元素。\n-   有新的结构化元素。\n- \
    \  语法被简化了。\n-   有新的特定内容元素。\n-   支持本地存储。\n-   支持应用缓存。\n-   它现在是跨平台的。\n\n好吧，`HTML5`\
    \ 看起来很棒，但我们为什么要在这里（XML 平台）讨论它呢？\n\n有一个原因，那就是 `XHTML5`，它是 XML 序列化的 `HTML5`。改进后的\
    \ `HTML5` 现在已经和 `XML` 一样好了。`XHTML5` 是 `XML` 的良好格式语法与 `HTML5` 功能的结合。根据所使用的媒体类型，可以选择\
    \ `HTML5` 或 `XHTML5`。\n\n### 总结\n\n`XML` 本身仅仅是一种良好格式文本的表示。它是一种定义结构化数据的机制。但它在信息交换中的应用提升了其作为标记语言的声誉。这本书介绍了创建和解释有效\
    \ XML 文档的方法，并配有实时示例。\n\n祝大家在实践所学时顺利。\n\n"
