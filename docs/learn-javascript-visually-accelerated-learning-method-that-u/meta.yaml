  md: '# Brackets. Braces. Parentheses.


    Brackets, braces and parentheses are grouping symbols which are always in pairs.
    The brackets hold arrays, braces create object group statements, while parentheses
    supply parameters, group expressions, and execute functions.


    While you can create arrays using either brackets or braces, they have their own
    characteristics, and by default brackets [] are the standard.


    You can create arrays of numbers, strings, or even empty arrays.


    ```

    1. //Array of numbers

    2. var numArray = [1, 2, 3, 4, 5, 6, 7, 8, 9];

    3. //Array of strings

    4. var stringArray = ["John", "Paul"];

    5. //Empty array

    6. var emptyArray = [];

    ```


    The most widely used for braces are grouping elements and creating objects:


    ```

    1. //Create a new object

    2. var myObj = {};

    3. //Grouping statements

    4. var a = function(){

    5.   alert("Statement 1");

    6.   alert("Statement 2");

    7. };

    ```


    Parentheses are used to supply parameter to functions, as you can see with the
    alert() functions in the example above. There are used to group the expressions
    and give proper order when doing complex math operations in one single line:


    ```

    1. var a = (3 + 2) * 7; // a= 35

    ```


    It is very common to see all three used in the same function in more complex code.
    The one thing to remember is that once you open any of them, they must be closed
    at some point and according to the scope of the program to avoid bugs.


    These are one of the most common and hardest to spot when writing a large amount
    of codes for beginners, not just in JavaScript, but in many other programming
    languages.'
