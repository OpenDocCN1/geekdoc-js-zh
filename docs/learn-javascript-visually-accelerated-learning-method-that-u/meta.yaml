    Events is what JavaScript uses to make web pages interactive – when you click
    a button, hover over a picture and have it changed, or any other form of interactivity.
    Events are actions that happen to HTML elements as a direct result of JavaScript
    reaction to events.

    HTML events can be actions that the browser or the user takes, they could be a
    web page finishing loading, the change of an input field, and very often the clicking
    of the mouse.

    HTML allows event handler attributes with JavaScript code added to it.


    ```

    1. <some-HTML-element some-event=''some JavaScript''>

    2. <some-HTML-element some-event="some JavaScript">

    ```


    You can use either single or double quotes.

    One way to make hyperlinks behave differently than usual is with event handlers:


    ```

    1. <a href="#" onClick="alert(''Hi'');">Click</a>

    ```


