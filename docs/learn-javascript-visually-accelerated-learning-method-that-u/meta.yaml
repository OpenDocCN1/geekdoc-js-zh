  md: '# Prototypes.


    ![](img/194ade798f439c6944bd1f4979d87181_145_0.png)


    *Prototypes allow you to define properties and methods to all instances of a particular
    object*


    Every function has a property called ''Prototype''.

    It allows to add properties and methods to objects, so they can share information
    easier.

    All JavaScript objects inherit their properties and methods from their prototype.
    When creating objects by using an object literal or with new Object(), they inherit
    from a prototype called Object.prototype.


    The standard way to create an object prototype is to use an object constructor
    function as we have done in the past. Then you would use the new keywords to create
    new objects from the same prototype. If you want to add new methods or properties
    to a prototype, then you will have to add them directly to the constructor. However,
    the JavaScript prototype property allows you to add new properties to an existing
    prototype:


    ```

    1. var Fruit = function Fruit(name, color) {

    2.     this.name = name;  //property

    3.     this.color = color;

    4.     //Method

    5.     This.info = function() {return "I am a " + this.color + " " + this.name};

    6. }

    7. //This adds a property to the Fruit prototype object

    8. Fruit.prototype.price = 100;

    ```


    You can also use the prototype property to add new methods to an existing prototype:


    ```

    1. Fruit.prototype.cost = function() {

    2.     Return ''This'' + this.name + ''cost'' + this.price;

    3. };

    ```'
