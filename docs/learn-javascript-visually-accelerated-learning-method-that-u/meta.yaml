    # Why JavaScript?


    JavaScript is a dynamic computer programming language which allows us to make
    many dynamic actions on the client side via scripts. Because it is easy to learn
    and very functional, its popularity is high. JavaScript is used to validate forms,
    make games, and many more functions on the computer that is browsing the site.
    It is widely used as scripts, although it has object-oriented capabilities. Another
    good aspect is that it is also server-side which adds to its function as a companion
    to websites. JavaScript has dynamic typing and first-class functions, which help
    its support not just object-oriented, but also imperative and functional programming
    styles. JavaScript is also used outside the web in PDF documents, desktop widgets
    and more. This means that whether you are trying to create an interactive website,
    add functionality to your current one, or even have some scripts for your web
    server, the language will help you achieve your goals.


    Since JavaScript is just a text, it does not need to be compiled – you can use
    any text editor of your choice to write or modify it. This contributes to its
    ease of use. There are also many available tools for you to debug, view, and even
    edit the JavaScript code from the web browser as you navigate a website.


    If you are familiar with web development, you have probably heard of jQuery, Dojo
    and others. They are used to extend JavaScript and increase its potential and
    usefulness. They are libraries of code available for you to simplify some of the
    more complex commonly used code. After all, JavaScript is very powerful and fast,
    but writing everything from scratch can be very tedious.


    # Where do I put JavaScript?


    Since JavaScript is used on websites, you would think you can just put it anywhere
    in the code of your site. Well, not quite.


    You can add it in between the head tags `<head></head>`, and also on the body
    tags `<body></body>`.


    It is very important to keep in mind that any JavaScript code must be enclosed
    by the script tag `<script></script>`.


    Furthermore, you can also add scripts located anywhere else on the server, client,
    or even web, as long as you provide the clear path. These are known as external
    scripts. They are very handy when you have to reuse the same script on different
    sites.


    All you have to do is place them somewhere where other sites can access and link
    to them.


    The following code shows examples of where to put JavaScript code, and how to
    use both, internal and external code.


    Just remember that they have to be in the scope of the script tags for them to
    work properly. The code will create a pop-up window every time you visit the site.
    It is very useful for providing important information to the user before anything
    else.


    ```html

    1. <!DOCTYPE html>

    2. <html>

    3.    <head>

    4.      <title>My Title</title>

    5. <script type="text/javascript"> alert("It''s best if I sit low.");</script>  <!--embed
    script-->

    6. </head>

    7. <body>

    8.    <h1>Where do I put JavaScript?</h1>

    9.    <!--lines 5 and 10 create a pop up with a message-->

    10.   <script src = "main.js"></script><!--external script-->

    11. </body>

    12. </html>

    ```


    ```javascript

    1. alert("I pop-up from the external file!")

    ```


    ## EXERCISE: 1


    ### Where do I put JavaScript?


    PROBLEM: Write a simple HTML file and link a *javascript.js* file with it.


    YOUR CODE: Write your code here and compare it with the answer below


    ANSWER: [jsvisually.com/1.html](http://jsvisually.com/1.html)


    # How do I practice JavaScript?


    So far, JavaScript sounds interesting to you, right? Then you are probably wondering
    how to get started or what program you can use to start playing with JavaScript
    interactively. As we have mentioned before, there are many tools available, but
    JavaScript is so popular nowadays that most common web browsers have their own
    tool for JavaScript debugging, which you can use. Just look for the *developer
    tools* of your browser and open the JavaScript console and you will be able to
    test small bits of code right from your browser without having to install anything
    new. If you want more control, then you can install the Firebug extension.


    In case you want to work locally with your code, then you can use specialized
    text editors such as Notepad++ or Sublime Text, which support many scripting and
    programming languages besides plain text. That means that you can use it to edit
    not just JavaScript, but the HTML of the site itself, if you have access to it.
    The both programs I mentioned are available free and are multiplatform.


    ```javascript

    >>2+2

    4

    >>a=3

    3

    >>a*2-a/3

    5

    ```


    in the console enter 2+2 and hit Enter


    install the Firebug extension for even more control


    click the red arrow to open/close the code panel


    ## Exercise: 2 Practice JavaScript.


    PROBLEM: Open the console of your browser and calculate the area of the right
    triangle below


    ANSWER: jsvisually.com/2.html


    # The Interpreter /Compiler.


    # I am Private JS.

    I will read, interpret/compile and execute your commands from top to bottom and
    from left to right


    # I will run everything between the `<script>` tags


    ```html

    1. <script>

    2.   alert("This line first");

    3.   //ignore this line. It''s a comment

    4.   alert("This line second");

    5. </script>

    ```


    An interpreter or compiler is the software that interprets, compiles and executes
    code. JavaScript can be interpreted or compiled. Most modern browsers compile
    the code before execution.'
