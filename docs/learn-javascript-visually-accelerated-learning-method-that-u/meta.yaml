    Comparison operators are used to compare (test) two values and return true or
    false, depending on the equality based query.

    Probably the most widely used comparison operator is the "equal to" (==) operator.

    It can be used with different type of variables such as:


    - Strings

    - Numbers

    - Variable with math expressions

    - Variable with a variable


    When you are comparing strings, then case sensitivity matters! The next most used
    operator is the opposite of "equal to", which would be "not equal to" (!==) and
    shares the same properties as its counterpart.


    The following are valid ways to use either == or !== in if statements:


    ```

    1. if (fullName == "John" + " " + "Doe") {

    2. if (fullName == firstName + " " + "Doe") {

    3. if (fullName == firstName + " " + lastName) {

    4. if (totalCost == 3.14 + 234) {

    5. if (totalCost == materialsCost + 678) {

