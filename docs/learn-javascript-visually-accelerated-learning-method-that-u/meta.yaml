    \    <p id=\"cls\">Paragraph 2</p>\n    <script src = \"my.js\"></script>\n</body>\n\
    </html>\n```\n\n![](img/194ade798f439c6944bd1f4979d87181_109_0.png)\n\nANSWER:\
    \ [jsvisually.com/27.html](http://jsvisually.com/27.html)\n\n## Function statements\
    \ vs function expressions\n\n```javascript\n//Functions are values\n//function\
    \ Statements (Declarations) require a name,\n//are defined at parse time and\n\
    //can be called before being declared because of hoisting\nfoo();\nfunction foo()\
    \ { return 8; }\n```\n\n> there is nothing before the word \"function\", so it's\
    \ a statement\n\n![](img/194ade798f439c6944bd1f4979d87181_111_0.png)\n\n> I prefer\
    \ the function expressions, because they are more flexible\n\n```javascript\n\
    //function Expression.\n//name is optional\n//defined at run time\nvar foo = function\
    \ foo() { return 8; };\nfoo();        //8\n\n//function Expression with parameters\n\
    var boo = function (x, y) { return x + y; };\nboo(2,3); //5\n\n//anonymous function\
    \ Expression\nvar moo = function() { return 1; };\nmoo();    //1\n\n//this is\
    \ a function Expression\n//because it is inside a grouping operator ()\n( function\
    \ doo() { return 8; }() );\n//8\n```\n\nthis is an expression because of the assignment\
    \ operator\n\nthe grouping operator can only contain an expression\n\nFunction\
    \ statement is where a statement begins with the word “function”. If not, it’s\
    \ a function expression.\n\nWhen a function is declared, it is saved for later\
    \ execution after it is invoked. Since in JavaScript, functions are objects, they\
    \ have both properties and methods.\n\n```javascript\nfunction functionName(parameters)\
    \ {\n    code to be executed\n}\n```\n\nWhile the functionName is mandatory and\
    \ must follow the naming convention explained in early chapters, the parameters\
    \ are optional and there can be zero or as many as you need for the function separated\
    \ by commas. It is important to note that if a function is invoked with missing\
    \ arguments, the values will be set to undefined.\n\nOn the other hand, the syntax\
    \ for a function expression would be:\n\n```javascript\nvar variableName = function(parameters)\
    \ {\n    code to be executed\n};\n```\n\nAs you can see, it is very similar, with\
    \ the main difference being the function name, which can be omitted in a function\
    \ expression to create an anonymous function. However, if you want to refer to\
    \ the current function inside the function body, then you need to create a named\
