    It is said that when you understand Objects in JavaScript, you understand JavaScript.
    This is due to the fact that almost everything in JavaScript is an object. Primitive
    data such as numbers, Booleans, and strings can be treated as objects. Furthermore,
    dates, math, regular expressions, arrays, and functions are always objects. This
    might sound like everything is an object, yet, it is important to know that primitive
    values are not objects -- they can just be treated as objects. Objects are a collection
    of properties and methods.

    While you could use variables to hold information instead of objects, it is very
    impractical and in some cases extremely difficult to keep all the information
    linked together, particularly if they are of different types. For example, you
    want to create an object apple that will have the type of apple, the color, and
    the weight. All these properties can be stored in variables, but as you have more
    objects and more complicated ones like a car object for an assembly line, all
    those variables might get mixed up and it will be difficult to keep track of them.
    If you treat them as an object type, it will have its own function, properties,
    and methods all easily available and easier to read from the source code.


    ```

    1. //create an empty object

    2. var apple = {};

    3. //create an object and add properties to it

    4. var apple={

    5.      name: "Machintosh",

    6.      color: "Green",

    7.      weight: 100,

    8.      //add method

    9.      display:function(){alert("I weight"+this.weight+"g");}

    10. };

    ```


    That is a simple apple object. If you need to change its values, you would create
    getters and setters. As the name suggests, one is to set values, and another is
    to get values. This is also a security measure as you do not want outside code
    to have direct access to the properties of the object. Instead, you create doors
    to regular the information coming in and out securely.

