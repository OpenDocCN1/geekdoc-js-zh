  md: '![](img/194ade798f439c6944bd1f4979d87181_142_0.png)


    Constructors are functions used to create multiple instances of an object by using
    the ‘new’ keyword. We have talked about them briefly on the Objects chapter. We
    saw a few ways to create objects, yet they were limited to one object creations.
    If you need to create multiple objects of the same type, then you will need to
    create an object constructor, and then you can create new instances of the object
    with different values.


    The way this works is by assigning parameters to the object variables instead
    of actual values from the start. That would allow us to create new objects using
    the new keyword and pass the values as parameters, similar to how we pass them
    among functions.


    In a way we can think of constructors as blueprints. When using the same blueprint
    to create a house, all the houses will be the same; the only difference will be
    the paint and address. Let’s take a look at a fruit object constructor:


