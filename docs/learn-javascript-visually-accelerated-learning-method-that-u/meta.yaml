  md: '# Code blocks


    ```

    1. //functions are examples of code blocks

    2. //or any group of statements delimited by braces

    3. function myFunction () {

    4.     var a = 3;

    5.     alert ("my group" + a);

    6. }

    ```


    Statements are commands that are executed one by one in the same order they are
    written, unless they are conditional statements. We have been using them for a
    while and they are separated by semicolon. So, even declaring and assigning a
    value to a variable is a statement on its own.


    JavaScript statements can be grouped together into blocks by using curly brackets.
    You will often see this in functions, and control flow statements.


    ```

    1. while (x < 10) {

    2.     x++;

    3. }

    ```


    JavaScript does not have block scope. Instead, the scope is the same as the function
    or script that precedes it. This is very important because they do not introduce
    a scope, so if you use the same variable name thinking that they have different
    scopes, then your script will have bugs. While standalone block statements are
    allowed, they do not do what you would normally expect, and thus, you might just
    write your statements without them.


    ```

    1. var x = 1;

    2. {

    3.     var x = 2;

    4. }

    5. alert(x);    // outputs 2

    ```


    Here the block statement is interfering with the code outside, which is why the
    output is 2 instead of 1.


    The Conditional statements are the ones that run only when their condition is
    met. More details on that will follow in a later chapter.


    Another type of statement is the Exception Handling. They are used to work around
    with exceptions by using the *throw* statement andt then handling them with the
    try ... *catch* statement.


    When you throw an exception, you specify the expression containing the value to
    be thrown. Also, you can throw any expression, string, number, Boolean, and even
    functions!'
