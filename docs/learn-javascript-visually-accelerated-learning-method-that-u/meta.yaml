    ![](img/194ade798f439c6944bd1f4979d87181_95_0.png)


    Functions (Fun actions) are group of codes that can be called later on and together
    perform a particular task. They are executed when they are invoked in the program.
    Basically, they run when you call for them.


    Since you can invoke functions as often as you want and pass parameters to them,
    they are the best way to clean up your code by creating functions out of block
    of codes that will be used more than once. Even if they are invoked once, they
    are also a way to organize your code, so you can easily locate the block of code
    in case you need to modify it instead of scrolling through numerous lines of code
    trying to find the few lines that you need.


    The syntax for a function is the following:


    ```

    1. function myFunction(p1, p2) {

    2.     return p1 * p2;     // The function returns the product of p1 and p2

    3. }

    ```


    Functions are defined with the function keyword, followed by the function name
    and parentheses. If you want to add parameters to it, then you put them inside
    the parentheses separated by a comma, if there is more than one. These parameters
    are the values of variables that will be used inside the function.


    Think of your body as a program and your organs as functions. Yours organs are
    the'
  - '[PAGE 96]


    functions, and they communicate by sharing information via variables that are
    taken as parameter for the organ and they do their own thing and the whole body
    functions in harmony.


    There are three ways to invoke functions:


    +   1. When an event occurs, such as the click of a button by the user.

    2. When it is invoked from somewhere in the code.

    3. When it is self-invoked.


    The return statement in a function is what provides the resulting value to the
    invoker. That is why you normally assign the result of a function with a return
    value to a variable.


    ```

    1. var x = myFunction(4, 3);    // Function is called, the return value will end
    up in x

    2. function myFunction(a, b) {

    3.     return a * b;             // Function returns the product of a and b

    4. }

    ```


    Invoking a function is as easy as writing the function name followed by the ()
    operator. If parameters are required, then they must be added as well. In JavaScript,
    you can use functions as variables. This means that instead of assigning the function
    to a variable, to then use that variable, you could just invoke the variable itself
    and the result will be the same.


    Use:


    ```

    1. var text = "The temperature is " + toCelsius(32) + " Centigrade";

    ```


    Instead of:


    ```

    1. var x = toCelsius(32);

    2. var text = "The temperature is " + x + " Centigrade";

    ```'
