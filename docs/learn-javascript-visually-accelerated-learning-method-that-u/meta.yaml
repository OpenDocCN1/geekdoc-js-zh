  md: '# # Semicolons.


    ![](img/194ade798f439c6944bd1f4979d87181_17_0.png)


    Semicolons are used to separate statements. As opposed to other programming languages,
    they are optional.


    It is a good practice to consistently use them in your code.

    Missing a semicolon might not give you an error, but your code might not run as
    expected.

    When you have statements in one line, the first semicolon is required.


    When you have statements separated by line breaks, semicolons are optional as
    the line break acts as one.


    However, there are some cases in which you can break a statement into several
    lines and it will work like the example from line 8, while others will cause problems,
    as it is the case of the code on line 13.


    You should also avoid putting a semicolon after a closing curly bracket with one
    exception -- when you are doing assignment statements. `var obj = {};`


    ```

    1. // No semicolons after };

    2. if (...) {...} else {...}

    3. for (...) {...}

    4. while (...) {...}

    5.

    ```'
