    ```\n\n我们已经了解了JavaScript变量中的局部作用域和全局作用域。然而，还有另一种类型的作用域，我们可以通过闭包创建私有变量。闭包是一个可以访问外部函数变量的内部函数。它具有三条作用域链：\n\
