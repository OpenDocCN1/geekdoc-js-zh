    \    console.log(\"no need to call me\");\n}();\n//NaN\n0, function () {\n   \
    \ console.log(\"no need to call me\");\n}();\n//undefined\n```\n\n![](img/194ade798f439c6944bd1f4979d87181_115_0.png)\n\
    \n## Remember the mirror frog pattern\n\nAlso known as IIFEs, are self-executing\
    \ functions that are used to avoid variable hoisting and to protect the global\
    \ space from 'polluting'. This means that IIFE provides local scoping and this\
    \ is why popular libraries like JQuery, BackBone.js and others use it to place\
    \ all library code inside of a local scope.\n\nThe syntax for creating a basic\
    \ IIFE is the following:\n\n```javascript\n// Anonymous function\nfunction(){\n\
    \  // my special code\n}();  // The parentheses make sure the anonymous function\
    \ gets called immediately\n```\n\nBasically, it is an anonymous function without\
    \ a name, since we will not call it, that is created and invoked immediately via\
    \ the parentheses at the very end.\n\nWe wrap the anonymous function inside the\
    \ parentheses so the JavaScript parser knows to treat it as a function expression\
    \ and not as a function declaration. If it is treated as a function declaration,\
    \ then we will need a name for the function to avoid syntax errors, and it will\
    \ also need to be invoked at some point. Just to provide a reminder and make the\
    \ difference between function expression and declaration, check the following:\n\
    \n1.  Function Expression - `var test = function() {};`\n2.  Function Declaration\
    \ - `function test() {};`\n\nSince the function in our IIFE is a function expression\
    \ and it is not being assigned to a global variable, no global properties are\
    \ being created, and thus, all the properties are created locally, so we get local\
    \ scope.\n\nAnother benefit of IIFE is the reduced scope lookup which provides\
    \ a small performance benefit since we can pass commonly used global objects to\
    \ an IIFE's anonymous function and then reference them within the IIFE via local\
    \ scope.\n\n```javascript\n// Anonymous function that has three arguments\nfunction(window,\
    \ document, $) {\n// You can now reference the window, document, and jQuery objects\
    \ in a local scope\n//The global window, document, and jQuery objects are passed\
    \ into the anonymous function\n}(window, document, window.jQuery);\n```\n\nSince\
    \ we are able to pass global objects into the anonymous function as local parameters,\
    \ we also gain minification optimization, which is another advantage of IIFEs.\n\
    \nOne negative thing that IIFE used to have was readability when you have a lot\
    \ of code inside them. You would have to scroll down all the way if you wanted\
    \ to find the parameters that you are passing into the IIFE.\n\nThe solution is\
    \ on using a more readable pattern that has become very popular:\n\n```javascript\n\
    (function (library) {\n    // Calls the second IIFE and locally passes in the\
    \ global jQuery, window, and document objects\n    library(window, document ,\
    \ window.jQuery);\n}\n// Locally scoped parameters\n(function (window, document,\
    \ $) {\n// Library code goes here\n}));\n```\n\nThis IIFE pattern allows you to\
    \ see what global objects are being passed into the IIFE without having to scroll\
    \ down all the way to the bottom of the file."
  mdcn: "\n## 练习：27 操作 DOM\n\n要操作特定的 id，你可以使用 `getElementById` 方法；如果你想与同一元素的内容进行交互，则使用\
    \ `innerHTML` 属性。这是定位特定节点并使用 JavaScript 进行修改的最简单方式。\n\n```html\n<html>\n<body>\n\
    <p id=\"demo\"></p>\n<script>\ndocument.getElementById(\"demo\").innerHTML = \"\
    Hello World!\";\n</script>\n</body>\n</html>\n```\n\n在前面的例子中，我们通过 `getElementById`\
    \ 使用其 id 与段落元素进行交互，并使用 `innerHTML` 属性修改了它。你也可以通过 `document.getElementsByTagName()`\
    \ 方法获取元素标签，通过 `document.getElementsByClassName()` 获取类名。\n这就是为方法使用描述性名称的优势。\n如果你想更改\
    \ HTML 元素，可以使用 `element.attribute=` 来更改属性。如果要设置属性，则使用 `element.setAttribute(attribute,value)`。要操作样式，使用\
    \ `element.style.property=`。\n\n关于添加和删除元素：\n\n-   `document.createElement()` 创建一个\
    \ HTML 元素。\n-   `document.removeChild()` 移除一个元素的子节点。\n-   `document.appendChild()`\
    \ 为一个元素添加子节点。\n-   `document.replaceChild()` 用另一个子元素替换现有子元素。\n-   `document.write(text)`\
    \ 写入 HTML 输出流。\n-   `document.getElementById(id).onclick=function()` 将为一个 onclick\
    \ 事件添加事件处理代码。\n\n问题：选择 id 为 \"cls\" 的 `<p>` 标签，并将其文本更改为 \"something else\"\n\n\
    ```html\n<html>\n<head>\n    <title>Draw me</title>\n</head>\n<body>\n    <h1\
    \ id=\"hdr\">Hello</h1>\n    <h2>Header tag</h2>\n    <p id=\"cls\">Paragraph\
    \ 2</p>\n    <script src = \"my.js\"></script>\n</body>\n</html>\n```\n\n![](img/194ade798f439c6944bd1f4979d87181_109_0.png)\n\
    \n答案：[jsvisually.com/27.html](http://jsvisually.com/27.html)\n\n## 函数语句与函数表达式\n\
    \n```javascript\n//Functions are values\n//function Statements (Declarations)\
    \ require a name,\n//are defined at parse time and\n//can be called before being\
    \ declared because of hoisting\nfoo();\nfunction foo() { return 8; }\n```\n\n\
    > 关键字 \"function\" 前没有任何内容，所以它是一个语句\n\n![](img/194ade798f439c6944bd1f4979d87181_111_0.png)\n\
    \n> 我更喜欢函数表达式，因为它们更灵活\n\n```javascript\n//function Expression.\n//name is optional\n\
    //defined at run time\nvar foo = function foo() { return 8; };\nfoo();       \
    \ //8\n\n//function Expression with parameters\nvar boo = function (x, y) { return\
    \ x + y; };\nboo(2,3); //5\n\n//anonymous function Expression\nvar moo = function()\
    \ { return 1; };\nmoo();    //1\n\n//this is a function Expression\n//because\
    \ it is inside a grouping operator ()\n( function doo() { return 8; }() );\n//8\n\
    ```\n\n由于赋值运算符的存在，这是一个表达式\n\n分组运算符只能包含表达式\n\n函数语句是指以关键字 “function” 开头的语句。如果不是，则它是函数表达式。\n\
    \n当函数被声明时，它会被保存以供调用后执行。由于在 JavaScript 中，函数是对象，它们既有属性也有方法。\n\n```javascript\nfunction\
    \ functionName(parameters) {\n    code to be executed\n}\n```\n\n其中 functionName\
    \ 是必需的，并且必须遵循前面章节中解释的命名约定，参数是可选的，可以为零个或按需要的数量用逗号分隔。需要注意的是，如果调用函数时缺少参数，其值将被设置为\
    \ undefined。\n\n另一方面，函数表达式的语法如下：\n\n```javascript\nvar variableName = function(parameters)\
    \ {\n    code to be executed\n};\n```\n\n如你所见，它非常相似，主要区别在于函数名，在函数表达式中可以省略函数名以创建匿名函数。但是，如果你想在函数体内引用当前函数，则需要创建一个命名函数表达式。该名称将仅在函数体内局部有效。\n\
    \n```javascript\nvar math = {\n    'factorial': function factorial(n) {\n    \
    \    if (n <= 1)\n            return 1;\n        return n * factorial(n - 1);\n\
    \    }\n};\n```\n\n如你所见，函数表达式比函数语句更灵活。\n\n## 练习：28 函数语句与函数表达式\n\n问题：在 JavaScript\
    \ 中，我们可以使用 `Math.pow(x,y)` 方法将一个数提升到一个幂。X 是底数，Y 是指数。\n重构以下函数，将其改为函数表达式：\n\n```javascript\n\
    //将数字2提升到10次幂\nfunction power(x) {\n    //不太好。我们重写一下\n    var raise= x * x * x\
    \ * x * x * x * x * x * x * x + x;      // (x10)\n    return raise;\n}\npower(2);\n\
    //1026\n```\n\n答案：[jsvisually.com/28.html](http://jsvisually.com/28.html)\n\n\
    ## 立即调用的函数表达式\n\n```javascript\n//我们永远不会调用它，所以不需要名字\n( function () {\n    console.log(\"\
    no need to call me\");\n}() );\n//末尾的第二对括号立即调用了该函数\nvar x = function() {\n   \
    \ console.log(\"no need to call me\");\n}();\n//末尾的第二对括号调用并结束了该函数\n//如果我们稍后尝试调用它，会得到错误：\n\
    x();\nTypeError: undefined is not a function\n```\n\n任何强制解释器评估接下来内容的东西，都会调用该函数\n\
    \n```javascript\n//以下任何一种都可以做到：\n//+, -, ~, !, void, true, &&, new\n!function\
    \ () {\n    console.log(\"no need to call me\");\n}();\n//true\n+function () {\
    \ //尝试转换为数字\n    console.log(\"no need to call me\");\n}();\n//NaN\n0, function\
    \ () {\n    console.log(\"no need to call me\");\n}();\n//undefined\n```\n\n![](img/194ade798f439c6944bd1f4979d87181_115_0.png)\n\
    \n## 记住“镜像青蛙”模式\n\n也称为 IIFE，是自执行函数，用于避免变量提升并保护全局空间不被“污染”。这意味着 IIFE 提供了局部作用域，这就是为什么像\
    \ JQuery、BackBone.js 这样的流行库使用它来将所有库代码放置在局部作用域内。\n\n创建基本 IIFE 的语法如下：\n\n```javascript\n\
    // 匿名函数\nfunction(){\n  // 我的特殊代码\n}();  // 括号确保匿名函数被立即调用\n```\n\n基本上，它是一个没有名字的匿名函数，因为我们不会调用它，它通过末尾的括号被创建并立即调用。\n\
    \n我们将匿名函数包装在括号内，以便 JavaScript 解析器将其视为函数表达式而不是函数声明。如果它被视为函数声明，那么我们将需要一个函数名以避免语法错误，并且它还需要在某个时刻被调用。仅为了提醒并区分函数表达式和声明，请查看以下内容：\n\
    \n1.  函数表达式 - `var test = function() {};`\n2.  函数声明 - `function test() {};`\n\n\
    由于 IIFE 中的函数是函数表达式，并且没有被赋值给全局变量，因此没有创建全局属性，所有属性都是在局部创建的，所以我们得到了局部作用域。\n\nIIFE\
    \ 的另一个好处是减少了作用域查找，这提供了一点性能优势，因为我们可以将常用的全局对象传递给 IIFE 的匿名函数，然后通过局部作用域在 IIFE 内引用它们。\n\
    \n```javascript\n// 有三个参数的匿名函数\nfunction(window, document, $) {\n// 现在你可以在局部作用域中引用\
    \ window、document 和 jQuery 对象\n// 全局 window、document 和 jQuery 对象被传入匿名函数\n}(window,\
    \ document, window.jQuery);\n```\n\n由于我们能够将全局对象作为局部参数传递给匿名函数，我们也获得了压缩优化，这是 IIFE\
    \ 的另一个优势。\n\nIIFE 曾经的一个缺点是，当内部代码很多时，可读性较差。如果你想找到传递给 IIFE 的参数，必须一直向下滚动。\n\n解决方案是使用一种更具可读性的模式，它已经变得非常流行：\n\
    \n```javascript\n(function (library) {\n    // 调用第二个 IIFE 并局部传入全局 jQuery、window\
    \ 和 document 对象\n    library(window, document , window.jQuery);\n}\n// 局部作用域参数\n\
    (function (window, document, $) {\n// 库代码放在这里\n}));\n```\n\n这种 IIFE 模式允许你看到传递给\
    \ IIFE 的全局对象，而无需一直滚动到文件底部。\n"
