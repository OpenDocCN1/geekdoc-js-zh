- md: "## Exercise: 27 Manipulating the DOM.\n\nTo work with a particular id, you\
    \ use the `getElementById` method, and if you want to interact with the content\
    \ of the same element, then you use the `innerHTML` property. That is the easiest\
    \ way to get to a particular node, and modify it with JavaScript.\n\n```html\n\
    <html>\n<body>\n<p id=\"demo\"></p>\n<script>\ndocument.getElementById(\"demo\"\
    ).innerHTML = \"Hello World!\";\n</script>\n</body>\n</html>\n```\n\nIn the previous\
    \ example, we interacted with the paragraph element using its id by using the\
    \ `getElementById` and modified it with the `innerHTML` property. You can also\
    \ get element tags with the method `document.getElementsByTagName()`, and the\
    \ class name with `document.getElementsByClassName()`.\nThat is the advantage\
    \ of using descriptive names for your methods.\nIf you want to change HTML elements,\
    \ then you can use `element.attribute=` to change the attribute. If you want to\
    \ set the attribute, then use `element.setAttribute(attribute,value)`. To work\
    \ the style, you use `element.style.property=`.\n\nFor adding and deleting elements:\n\
    \n-   `document.createElement()` creates an HTML element.\n-   `document.removeChild()`\
    \ removes the child of an element.\n-   `document.appendChild()` adds a child\
    \ to an element.\n-   `document.replaceChild()` replaces a child element with\
    \ another.\n-   `document.write(text)` writes into the HTML output stream.\n-\
    \   `document.getElementById(id).onclick=function()` will add an event handler\
    \ code to an onclick event.\n\nPROBLEM: Select the `<p>` tag with id \"cls\" and\
    \ change the text to \"something else\"\n\n```html\n<html>\n<head>\n    <title>Draw\
