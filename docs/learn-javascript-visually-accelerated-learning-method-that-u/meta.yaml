    \n## 分号。\n\n分号用于分隔语句。与其他编程语言不同，它们在 JavaScript 中是可选的。\n\n在你的代码中始终使用它们是一种良好的实践。\n\
    缺少分号可能不会导致错误，但你的代码可能无法按预期运行。\n当你的语句位于一行时，第一个分号是必需的。\n\n当你的语句由换行符分隔时，分号是可选的，因为换行符起到了分隔作用。\n\
    \n然而，有些情况下你可以将一条语句分成多行，它会像第 8 行的例子一样工作，而其他情况则会引起问题，就像第 13 行代码中的情况。\n\n你还应该避免在闭合花括号后放置分号，但有一个例外——当你进行赋值语句时。`var\
    \ obj = {};`\n\n```\n// 在 } 之后没有分号。\nif (...) {...} else {...}\nfor (...) {...}\n\
    while (...) {...}\n```\n\n```\n// 但是：\ndo {...} while (...);\n\n// 函数语句：\nfunction\
    \ (arg) { /*do this*/ } // 在 } 之后没有分号。\n```\n\n你可以在 `if`、`for`、`while` 或 `switch`\
    \ 语句的圆括号后放置分号。否则，JavaScript 会将其视为空语句，而不是循环或条件的一部分。\n\n```\nif (0 === 1); { alert(\"\
    hi\") }\n\n// 等同于：\n\nif (0 === 1) /*do nothing*/;\nalert(\"hi\");\n```\n\n##\
    \ 练习：4\n分号。\n\n问题：添加缺少的分号。\n\n```\nx = 2;\ny = 3;\nz = x + y;\n```\n\n答案：[jsvisually.com/4.html](http://jsvisually.com/4.html)\n\
    \n## 方括号、花括号、圆括号。\n\n方括号、花括号和圆括号是始终成对出现的分组符号。方括号用于容纳数组，花括号用于创建对象或分组语句，而圆括号则用于提供参数、分组表达式和执行函数。\n\
    \n虽然你可以使用方括号或花括号来创建数组，但它们各有特点，默认情况下方括号 `[]` 是标准。\n\n你可以创建数字数组、字符串数组，甚至是空数组。\n\n\
    ```\n// 数字数组\nvar numArray = [1, 2, 3, 4, 5, 6, 7, 8, 9];\n// 字符串数组\nvar stringArray\
    \ = [\"John\", \"Paul\"];\n// 空数组\nvar emptyArray = [];\n```\n\n花括号最常用于分组元素和创建对象：\n\
    \n```\n// 创建新对象\nvar myObj = {};\n// 分组语句\nvar a = function(){\n  alert(\"Statement\
    \ 1\");\n  alert(\"Statement 2\");\n};\n```\n\n圆括号用于为函数提供参数，正如你可以在上面的例子中看到的 `alert()`\
    \ 函数。它们用于分组表达式，并在单行中进行复杂数学运算时给出正确的顺序：\n\n```\nvar a = (3 + 2) * 7; // a= 35\n\
    ```\n\n在更复杂的代码中，看到所有三种括号在同一个函数中使用是非常常见的。需要记住的一点是，一旦你打开了其中任何一种括号，就必须在某个时候关闭它，并且要符合程序的作用域，以避免错误。\n\
    \n对于初学者来说，在编写大量代码时，这是最常见也最难发现的问题之一，不仅在 JavaScript 中，在许多其他编程语言中也是如此。\n\n**方括号：**\n\
    容纳数组\n\n```\n// 数字数组\nvar num = [1, 2, 3, 4, 5, 6, 7, 8];\n// 名字数组\nvar names\
    \ = [\"John\", \"Paul\"];\n// 空数组\nvar myArray = [];\n```\n\n**花括号：**\n创建对象\n\
    分组语句\n\n```\n// 创建新对象\nvar myObj = {};\n// 分组语句\nvar a = function () {\n  alert(\"\
    statement 1\");\n  alert(\"statement 2\");\n};\n```\n\n**圆括号：**\n提供参数\n分组表达式\n\
    执行函数\n\n```\n// 提供参数 x 和 y\nfunction myParents(x, y) {\n  return x + y;\n}\n```\n\
    \n```\n// 分组表达式以控制执行顺序\nvar a = (3 + 2) * 7;      //a = 35\n// 执行函数\nmyParents(2,\
    \ 3);      //5\n```\n\n## 练习 5\n方括号、花括号、圆括号。\n\n问题：将方括号更改为花括号以解决代码错误。\n暂时不要担心其含义，只需识别方括号并学会输入和测试代码。\n\
    \n```\nvar a = function () {\n    alert(\"statement 1\");\n    alert(\"statement\
    \ 2\");\n};\na();\n```\n\n答案：[jsvisually.com/5.html](jsvisually.com/5.html)\n\n\
    ## 注释。\n\n解释器将忽略 `//` 符号后的一行内容。\n\n```html\n<html>\n  <head>\n    <title>Single\
    \ Comments</title>\n  </head>\n  <body>\n    <script>\n      //one comment per\
    \ line\n    </script>\n  </body>\n</html>\n```\n\n解释器将忽略 `/*` 和 `*/` 之间的任何内容。\n\
    \n```html\n<html>\n  <head>\n    <title>Multiline Comments</title>\n  </head>\n\
    \  <body>\n    <script>\n      /* Long multiline comments\n        are useful\
    \ for \"disabling\" some\n        part of your code\n      var = 123;\n      console.log(\"\
    comments\");\n      */\n      /* but are good for single line too */\n    </script>\n\
    \  </body>\n</html>\n```\n\n解释器会忽略注释，但它们非常有用，因为它们为我们和其他编码者留下了信息。解释器将忽略 `//` 符号后的一行内容。解释器也会忽略\
    \ `/*` 和 `*/` 之间的任何内容。\n\nJavaScript 注释除了用于解释代码并使其更具可读性之外，另一个用途是在测试替代代码时阻止代码执行。\n\
    \n你可以将单行代码放在代码上方或行尾以留下你的解释。\n\n```\n// 更改段落：\ndocument.getElementById(\"myP\"\
    ).innerHTML = \"My first paragraph.\";\n\nvar x = 5; // 声明 x，并将其值设为 5\n```\n\n\
    单行注释的使用最为常见，然而，出于正式文档目的，块注释是标准。\n\n```\n/*\n下面的代码将更改\nid = \"myHeader\" 的标题\n\
    和 id = \"myParagraph\" 的段落\n在我的网页中：\n*/\ndocument.getElementById(\"myH\").innerHTML\
    \ = \"My First Page\";\ndocument.getElementById(\"myP\").innerHTML = \"My first\
    \ paragraph.\";\n```\n\n在进行代码测试时，单行注释和块注释都可以通过使用适当的方法将其转换为注释来阻止代码执行。\n\n阻止单行代码：\n\
    \n```\n// document.getElementById(\"myH\").innerHTML = \"My First Page\";\n```\n"
