  md: '# # Unary operators.


    Operators that require *single* operand


    ![](img/194ade798f439c6944bd1f4979d87181_42_0.png)


    **a++, a--** take the value then add/subtract 1


    **++a, --a** add/subtract 1 then take the value


    **!a** logical opposite of **a**


    **+a, -a** positive/negative value of **a**


    Unary operators require a single operand. They are easy to recognize as the format
    is the same as an operand and an operator.

    Operand: It is the quantity on which an operation is to be done – basically, the
    variable.

    Operator: It is the action that will be taken upon the operand.

    The most common unary operators are:a++ , a--; which take the value and then add/subtract
    1 to it and assigns it back to the variable. Similar to a = a + 1; or a = a –
    1;


    +   * ++a, --a; which adds/subtract 1 then take the value.

    * !a; which takes the logical opposite of a.

    * +a,-a; which takes the positive/negative of a value.


    The ++ is also known as the increment operator while the -- is known as the decrement
    operator.

    One source of confusion with unary operators is the postfix (a++) and prefix(--a)
    increment or decrement operators. The following code will help you understand
    the difference which is crucial on loops, but not so noticeable outside of loops.


    ```

    1. var a = 4;

    2. var b = a++; //First b will be 4, then it will be changed to 5. JavaScript
    works from left to right.

    ```'
