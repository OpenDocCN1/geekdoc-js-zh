    \n## 变量提升。\n\n![img](img/194ade798f439c69444bd1f4979d87181_121_0.png)\n\n变量提升是指函数和变量声明被移动到其作用域顶部。这是JavaScript的默认行为。\n\
    \n在JavaScript中，一个变量可以在声明后使用，也可以在声明前使用。\n\n以下两个示例产生相同的结果：\n\n示例 A：\n\n```javascript\n\
