    To work with a particular id, you use the `getElementById` method, and if you
    want to interact with the content of the same element, then you use the `innerHTML`
    property. That is the easiest way to get to a particular node, and modify it with
    JavaScript.


    ```

    1. <html>

    2. <body>

    3. <p id="demo"></p>

    4. <script>

    5. document.getElementById("demo").innerHTML = "Hello World!";

    6. </script>

    7. </body>

    8. </html>

    ```


    In the previous example, we interacted with the paragraph element using its id
    by using the `getElementById` and modified it with the `innerHTML` property. You
    can also get element tags with the method `document.getElementsByTagName()`, and
    the class name with `document.getElementsByClassName()`.

    That is the advantage of using descriptive names for your methods.

    If you want to change HTML elements, then you can use `element.attribute=` to
    change the attribute. If you want to set the attribute, then use `element.setAttribute(attribute,value)`.
    To work the style, you use `element.style.property=`.


    For adding and deleting elements:


    +   - `document.createElement()` creates an HTML element.

    - `document.removeChild()` removes the child of an element.

    - `document.appendChild()` adds a child to an element.

    - `document.replaceChild()` replaces a child element with another.

    - `document.write(text)` writes into the HTML output stream.

    - `document.getElementById(id).onclick=function()` will add an event handler code
    to an onclick event.'
