    var math = {\n    'factorial': function factorial(n) {\n        if (n <= 1)\n\
    \            return 1;\n        return n * factorial(n - 1);\n    }\n};\n```\n\
    \nAs you can see, function expressions are more flexible than function statements.\n\
    \n## Exercise: 28 Function Statements vs Function Expressions.\n\nPROBLEM: In\
