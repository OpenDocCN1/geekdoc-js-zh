    Another important part of objects is the “this” keyword. The value of “this” when
    using in a function is the object that the function belongs to. However, when
    “this” is used in an object, it is the object itself. “this” is a keyword, not
    a variable, and so its value cannot be changed.

    Take a look at the object constructor example: instead of using person.firstName,
    you can use “this” which belongs to the person function. When it is used on the
    global scope, then it will not be the person function but the function or object
    enclosing it.'
