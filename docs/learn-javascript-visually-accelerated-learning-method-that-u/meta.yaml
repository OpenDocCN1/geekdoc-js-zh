- md: "# Exercise: 23\nArrays methods.\n\nPROBLEM: Use a loop to create an array containing\
    \ the numbers 11 to 23.\nDisplay the numbers on the screen\n\nANSWER: [jsvisually.com/23.html](http://jsvisually.com/23.html)\n\
    \n# Functions.\n\nFunctions (Fun actions) are group of codes that can be called\
    \ later on and together perform a particular task. They are executed when they\
    \ are invoked in the program. Basically, they run when you call for them.\n\n\
    Since you can invoke functions as often as you want and pass parameters to them,\
    \ they are the best way to clean up your code by creating functions out of block\
    \ of codes that will be used more than once. Even if they are invoked once, they\
    \ are also a way to organize your code, so you can easily locate the block of\
    \ code in case you need to modify it instead of scrolling through numerous lines\
    \ of code trying to find the few lines that you need.\n\nThe syntax for a function\
    \ is the following:\n\n```\nfunction myFunction(p1, p2) {\n    return p1 * p2;\
    \     // The function returns the product of p1 and p2\n}\n```\n\nFunctions are\
    \ defined with the function keyword, followed by the function name and parentheses.\
    \ If you want to add parameters to it, then you put them inside the parentheses\
    \ separated by a comma, if there is more than one. These parameters are the values\
    \ of variables that will be used inside the function.\n\nThink of your body as\
    \ a program and your organs as functions. Your organs are the functions, and they\
    \ communicate by sharing information via variables that are taken as parameter\
    \ for the organ and they do their own thing and the whole body functions in harmony.\n\
    \nThere are three ways to invoke functions:\n\n1. When an event occurs, such as\
    \ the click of a button by the user.\n2. When it is invoked from somewhere in\
    \ the code.\n3. When it is self-invoked.\n\nThe return statement in a function\
    \ is what provides the resulting value to the invoker. That is why you normally\
    \ assign the result of a function with a return value to a variable.\n\n```\n\
    var x = myFunction(4, 3);    // Function is called, the return value will end\
    \ up in x\nfunction myFunction(a, b) {\n    return a * b;             // Function\
    \ returns the product of a and b\n}\n```\n\nInvoking a function is as easy as\
    \ writing the function name followed by the () operator. If parameters are required,\
    \ then they must be added as well. In JavaScript, you can use functions as variables.\
    \ This means that instead of assigning the function to a variable, to then use\
    \ that variable, you could just invoke the variable itself and the result will\
    \ be the same.\n\nUse:\n\n```\nvar text = \"The temperature is \" + toCelsius(32)\
    \ + \" Centigrade\";\n```\n\nInstead of:\n\n```\nvar x = toCelsius(32);\nvar text\
    \ = \"The temperature is \" + x + \" Centigrade\";\n```\n\n# Exercise: 24 Functions.\n\
    \nPROBLEM: Make a function 'cm2in' that converts CM(centimeters) to IN(inches).\
    \ Round the result with Math.round() and add the inch symbol ( \" ) after the\
    \ value\n\nRESULT: 6\"\n\nANSWER: [jsvisually.com/24.html](https://jsvisually.com/24.html)\n\
    \n# Nesting.\n\n**Avoid deep nesting when possible, because it slows down the\
    \ script and can be confusing to other programmers**\n\nNesting is the enclosing\
    \ of code blocks into another. You should avoid deep nesting when possible, because\
    \ it slows down the script and can be confusing to other programmers. Similar\
    \ to using many if statements inside another, nesting has the same drawbacks.\n\
    \nThis is a pattern for a function inside a normal function:\n\n```\nfunction\
    \ foo(a, b) {\n    function bar() {\n        return a + b;\n    }\n\n    return\
    \ bar();\n}\n\nfoo(1, 2);\n```\n\nPatterns like that should be avoided. On the\
    \ other side, the next example is perfectly acceptable:\n\n```\nfunction hypotenuse(a,\
    \ b) {\n    function square(x) { return x * x; }\n\n    return Math.sqrt(square(a)\
    \ + square(b));\n}\n```\n\nFor the function hypotenuse(), you get a second function\
    \ inside called sqrt() from the math library. So each time hypotenuse is called,\
    \ it will also call the function sqrt(). However, the function foo has to create\
    \ a function bar for each instance of foo(). One might think that is alright,\
    \ but this causes unnecessary work for the JavaScript engine and wastes CPU cycles\
    \ when the function is called multiple times. Because functions do not change,\
    \ they always do the same thing and it would be best to optimize the code by placing\
    \ the bar() function outside foo() and just have foo() call for it when needed,\
    \ like the hypotenuse() function does.\n\n```\nfunction foo(a, b) {\n    return\
    \ bar(a, b);\n}\n\nfunction bar(a, b) {\n    return a + b;\n}\n\nfoo(1, 2);\n\
    ```\n\nThis new code will be much more efficient, even if the difference is minimal\
    \ in short runs. The big gains are on big computations. Time resources are saved.\n\
    \n# Exercise: 25 Nesting.\n\nPROBLEM: Fix the error in the nested 'if else' statement\n\
    \n```\nif (true) {\n    return 1;\n} else {\n    return 0;\n}\nSyntax Error\n\
    ```\n\nANSWER: [jsvisually.com/25.html](jsvisually.com/25.html)\n\n# The DOM node\
    \ tree.\n\nEach tab has its own window object\n\nHTML representation of the DOM\n\
    \n```\n<html>\n  <head>\n    <title>Title Text</title>\n  </head>\n  <body>\n\
    \    <h1 id=\"hdr\">H1 Text</h1>\n    <p>Paragraph Text</p>\n  </body>\n</html>\n\
    ```\n\nAll HTML elements and attributes are nodes in the Document Object Model\
    \ (DOM). Take a look at the following HTML code as a starting point:\n\n```\n\
    <html>\n  <head>\n    <title>The title</title>\n  </head>\n  <body>\n    The body\n\
    \  </body>\n</html>\n```\n\nThe DOM node tree will look like this:\nHTML tags\
    \ are element nodes in the DOM tree, and pieces of text become text nodes. In\
    \ the graph, you get the HTML node with its two children, HEAD and BODY, from\
    \ which only HEAD has a child tag.\n\nThe idea of the Document Object Model is\
    \ that every node is an object and its properties can be changed with CSS code.\
    \ You can also change the content of the nodes by searching the DOM for the target\
    \ node and create new elements to be inserted on the fly. To be able to do this,\
    \ you first need to know what the DOM looks like and what it contains. Once you\
    \ know that, then you can begin with your DOM manipulation. This is something\
    \ that you will learn in the next chapter.\n\n# Exercise: 26\nThe DOM Tree.\n\n\
    PROBLEM: Draw a node tree diagram representing the following HTML\n\n```\n<html>\n\
    \  <head>\n          <title>Draw me</title>\n  </head>\n  <body>\n        <h1\
    \ id=\"hdr\">Hello</h1>\n        <h2>Header tag</h2>\n        <p id=\"para\">My\
    \ text</p>\n        <script src=\"my.js\"></script>\n  </body>\n</html>\n```\n\
    \nANSWER: jsvisually.com/26.html\n\n# Manipulating the DOM.\n\n```\n<html>\n \
    \ <head>\n    <title>Title Text</title>\n  </head>\n  <body>\n    <h1 id=\"hdr\"\
    >H1 Text</h1>\n    <p class=\"cls\">Paragraph Text</p>\n    <p class=\"cls\">Paragraph\
    \ 2</p>\n    <script src=\"main.js\"></script>\n  </body>\n</html>\n```\n\nWhen\
    \ the web page is loaded, the browser automatically creates a Document Object\
    \ Model of the page. As you learned before, every element of the page, excluding\
    \ the document itself, is a child of another element. With the object model, you\
    \ can use JavaScript to create dynamic HTML. JavaScript can change all the HTML\
    \ elements, attributes, and CSS styles on the page. Furthermore, adding and removing\
    \ elements and attributes, and even creating new HTML events on the page is possible.\n\
    \nWith the usage of id in your HTML, you have access to specific nodes instead\
    \ of just all the nodes of a certain type. That is why it is recommended to have\
