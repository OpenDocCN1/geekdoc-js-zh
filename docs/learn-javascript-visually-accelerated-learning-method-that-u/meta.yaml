  md: '# # Hoisting.


    ![](img/194ade798f439c6944bd1f4979d87181_121_0.png)


    Hoisting is when function and variable declarations are moved to the top of their
    scope. This is the default behavior of JavaScript.


    In JavaScript, a variable can either be declared after it has been used, or used
    before it has been declared.


    The following two examples produce the same result:


    Example A:


    ```

    1. x = 5;        // Assign 5 to x

    2. elem = document.getElementById("demo");  // Find an element

    3. elem.innerHTML = x;              // Display x in the element

    4.

    5. var x; // Declare x

    ```


    Example B:


    ```

    1. var x;        // Declare x

    2. x = 5;        // Assign 5 to x

    3.

    4. elem = document.getElementById("demo");  // Find an element

    5. elem.innerHTML = x;              // Display x in the element

    ```


    JavaScript only hoists declarations, not initializations. Therefore, you must
    initialize your variables before using them.


    ```

    1. var x = 5;    // Initialize x

    2.

    3. elem = document.getElementById("demo");  // Find an element

    4. elem.innerHTML = x + " " + y;    // Display x and y

    ```'
