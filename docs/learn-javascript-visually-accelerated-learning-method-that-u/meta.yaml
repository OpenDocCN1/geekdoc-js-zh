  mdcn: "\n# 练习：23\n数组方法。\n\n问题：使用循环创建一个包含数字 11 到 23 的数组。\n在屏幕上显示这些数字。\n\n答案：[jsvisually.com/23.html](http://jsvisually.com/23.html)\n\
    \n# 函数。\n\n函数（有趣的操作）是一组可以稍后调用并共同执行特定任务的代码。它们在程序中被调用时执行。基本上，它们在你调用它们时运行。\n\n由于你可以根据需要多次调用函数并向它们传递参数，因此它们是清理代码的最佳方式，方法是将需要多次使用的代码块封装成函数。即使只调用一次，它们也是组织代码的一种方式，这样你可以轻松定位需要修改的代码块，而无需在大量代码行中滚动查找需要的那几行。\n\
    \n函数的语法如下：\n\n```\nfunction myFunction(p1, p2) {\n    return p1 * p2;     // 函数返回\
    \ p1 和 p2 的乘积\n}\n```\n\n函数通过 `function` 关键字定义，后跟函数名和括号。如果你想添加参数，则将它们放在括号内，用逗号分隔（如果多于一个）。这些参数是将在函数内部使用的变量值。\n\
    \n把你的身体想象成一个程序，你的器官就是函数。你的器官是函数，它们通过共享作为参数传递的信息来相互沟通，并完成各自的工作，整个身体协调运作。\n\n调用函数有三种方式：\n\
    \n1. 当事件发生时，例如用户点击按钮。\n2. 当从代码中的某处调用时。\n3. 当自我调用时。\n\n函数中的 `return` 语句为调用者提供结果值。这就是为什么你通常将带返回值的函数结果赋值给一个变量。\n\
    \n```\nvar x = myFunction(4, 3);    // 函数被调用，返回值将存入 x\nfunction myFunction(a,\
    \ b) {\n    return a * b;             // 函数返回 a 和 b 的乘积\n}\n```\n\n调用函数就像写函数名后跟\
    \ `()` 操作符一样简单。如果需要参数，则也必须添加它们。在 JavaScript 中，你可以将函数用作变量。这意味着你可以直接调用变量本身，而不是将函数赋值给一个变量再使用该变量，结果是一样的。\n\
    \n使用：\n\n```\nvar text = \"The temperature is \" + toCelsius(32) + \" Centigrade\"\
    ;\n```\n\n而不是：\n\n```\nvar x = toCelsius(32);\nvar text = \"The temperature is\
    \ \" + x + \" Centigrade\";\n```\n\n# 练习：24 函数。\n\n问题：创建一个名为 `cm2in` 的函数，将厘米（CM）转换为英寸（IN）。使用\
    \ `Math.round()` 对结果进行四舍五入，并在数值后添加英寸符号（\"）。\n\n结果：6\"\n\n答案：[jsvisually.com/24.html](https://jsvisually.com/24.html)\n\
    \n# 嵌套。\n\n**尽可能避免深度嵌套，因为它会减慢脚本运行速度，并可能让其他程序员感到困惑**\n\n嵌套是将一个代码块嵌入另一个代码块中。你应该尽可能避免深度嵌套，因为它会减慢脚本运行速度，并可能让其他程序员感到困惑。类似于在另一个语句中使用多个\
    \ `if` 语句，嵌套具有相同的缺点。\n\n这是一个普通函数内部包含另一个函数的模式：\n\n```\nfunction foo(a, b) {\n \
    \   function bar() {\n        return a + b;\n    }\n\n    return bar();\n}\n\n\
    foo(1, 2);\n```\n\n应避免此类模式。另一方面，以下示例是完全可以接受的：\n\n```\nfunction hypotenuse(a, b)\
    \ {\n    function square(x) { return x * x; }\n\n    return Math.sqrt(square(a)\
    \ + square(b));\n}\n```\n\n对于 `hypotenuse()` 函数，你从数学库中获得了一个内部函数 `sqrt()`。因此每次调用\
    \ `hypotenuse` 时，它也会调用 `sqrt()` 函数。然而，`foo` 函数必须为每个 `foo()` 实例创建一个 `bar` 函数。有人可能认为这没问题，但这会导致\
    \ JavaScript 引擎执行不必要的工作，并在函数被多次调用时浪费 CPU 周期。因为函数不会改变，它们总是做同样的事情，最好通过将 `bar()`\
    \ 函数放在 `foo()` 外部并让 `foo()` 在需要时调用它来优化代码，就像 `hypotenuse()` 函数那样。\n\n```\nfunction\
    \ foo(a, b) {\n    return bar(a, b);\n}\n\nfunction bar(a, b) {\n    return a\
    \ + b;\n}\n\nfoo(1, 2);\n```\n\n这个新代码将更加高效，即使在短时运行中差异微乎其微。巨大的收益体现在大型计算上。节省了时间资源。\n\
    \n# 练习：25 嵌套。\n\n问题：修复嵌套的 `if else` 语句中的错误。\n\n```\nif (true) {\n    return 1;\n\
    } else {\n    return 0;\n}\n语法错误\n```\n\n答案：[jsvisually.com/25.html](jsvisually.com/25.html)\n\
    \n# DOM 节点树。\n\n每个选项卡都有自己的 `window` 对象\n\nDOM 的 HTML 表示\n\n```\n<html>\n  <head>\n\
    \    <title>Title Text</title>\n  </head>\n  <body>\n    <h1 id=\"hdr\">H1 Text</h1>\n\
    \    <p>Paragraph Text</p>\n  </body>\n</html>\n```\n\n所有 HTML 元素和属性都是文档对象模型（DOM）中的节点。以下面的\
    \ HTML 代码作为起点：\n\n```\n<html>\n  <head>\n    <title>The title</title>\n  </head>\n\
    \  <body>\n    The body\n  </body>\n</html>\n```\n\nDOM 节点树将如下所示：\nHTML 标签是 DOM\
    \ 树中的元素节点，文本片段成为文本节点。在图中，你得到了 HTML 节点及其两个子节点 HEAD 和 BODY，其中只有 HEAD 有一个子标签。\n\n\
    文档对象模型的理念是，每个节点都是一个对象，其属性可以通过 CSS 代码更改。你还可以通过搜索 DOM 找到目标节点并动态创建要插入的新元素来更改节点的内容。要做到这一点，你首先需要知道\
    \ DOM 的样子以及它包含什么。一旦你了解了，就可以开始进行 DOM 操作。这是你将在下一章学到的内容。\n\n# 练习：26\nDOM 树。\n\n问题：绘制一个节点树图，表示以下\
    \ HTML。\n\n```\n<html>\n  <head>\n          <title>Draw me</title>\n  </head>\n\
    \  <body>\n        <h1 id=\"hdr\">Hello</h1>\n        <h2>Header tag</h2>\n  \
    \      <p id=\"para\">My text</p>\n        <script src=\"my.js\"></script>\n \
    \ </body>\n</html>\n```\n\n答案：jsvisually.com/26.html\n\n# 操作 DOM。\n\n```\n<html>\n\
    \  <head>\n    <title>Title Text</title>\n  </head>\n  <body>\n    <h1 id=\"hdr\"\
    >H1 Text</h1>\n    <p class=\"cls\">Paragraph Text</p>\n    <p class=\"cls\">Paragraph\
    \ 2</p>\n    <script src=\"main.js\"></script>\n  </body>\n</html>\n```\n\n当网页加载时，浏览器会自动创建页面的文档对象模型。如你之前所学，页面的每个元素（不包括文档本身）都是另一个元素的子元素。通过对象模型，你可以使用\
    \ JavaScript 创建动态 HTML。JavaScript 可以更改页面上的所有 HTML 元素、属性和 CSS 样式。此外，添加和删除元素和属性，甚至创建新的\
    \ HTML 事件都是可能的。\n\n通过在 HTML 中使用 `id`，你可以访问特定节点，而不仅仅是某个类型的所有节点。这就是为什么建议使用不同的 `id`\
    \ 名称，以便进行更精确的控制。\n"
