  - '[PAGE 129]


    ![](img/194ade798f439c6944bd1f4979d87181_129_0.png)


    ```

    element.event = function;

    ```


    Events is what JavaScript uses to make web pages interactive – when you click
    a button, hover over a picture and have it changed, or any other form of interactivity.
    Events are actions that happen to HTML elements as a direct result of JavaScript
    reaction to events.

    HTML events can be actions that the browser or the user takes, they could be a
    web page finishing loading, the change of an input field, and very often the clicking
    of the mouse.

    HTML allows event handler attributes with JavaScript code added to it.


    ```

    1. <some-HTML-element some-event=''some JavaScript''>

    2. <some-HTML-element some-event="some JavaScript">

    ```


    You can use either single or double quotes.

    One way to make hyperlinks behave differently than usual is with event handlers:


    ```

    1. <a href="#" onClick="alert(''Hi'');">Click</a>

    ```


    This will display an alert instead of taking the user to another place.'
  - '[PAGE 130]


    To interact with buttons we use the "onClick" handler.


    ```

    1. <button onclick=''getElementById("demo").innerHTML=Date()''>The time is?</button>

    ```


    This will display an alert instead of taking the user to another place.


    To interact with buttons we use the "onClick" handler.


    ```

    1. <button onclick=''getElementById("demo").innerHTML=Date()''>The time is?</button>

    ```


    That code will change the content of the element with id="demo". If you would
    prefer to change the content of its own element, then you would use this.innerHTML
    instead.


    ```

    1. <button onclick="this.innerHTML=Date()">The time is?</button>

    ```


    You can also use an image to trigger these changes, instead of creating a button.


    ```

    1. <img src="button-greet.png" onClick="alert(''Hello world!'');">

    ```


    The most common HTML events are the following:


    +   - onchange: An HTML element has been changed.

    - onclick: The user clicks an HTML element.

    - onmouover: When the user moves the mouse over an HTML element.

    - onmouseout: When the user moves the mouse away from an HTML element.

    - onkeydown: The user pushes a keyboard key.

    - onload: The browser is done loading the page.'
