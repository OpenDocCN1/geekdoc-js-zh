    # Reserved words.


    JavaScript has some identifiers that are reserved words and they cannot be used
    as variables or function names, as they will be always interpreted as reserved
    words. Because some of the reserved words could be easily part of a name, if you
    insist on using one of them in your naming of variables or functions, then you
    should add more to the name, following the naming convention explained when introducing
    the variables.


    Here are the reserved words:


    | abstract | arguments | boolean | break | byte |

    | case | catch | char | class | const |

    | continue | debugger | default | delete | do |

    | double | else | enum | eval | export |

    | extends | false | final | finally | float |

    | for | function | goto | if | implements |

    | import | in | instanceof | int | interface |

    | let | long | native | new | null |

    | package | private | protected | public | return |

    | short | static | super | switch | synchronized |

    | this | throw | throws | transient | true |

    | try | typeof | var | void | volatile |

    | while | with | yield | | |


    Furthermore, there are JavaScript objects, properties, and methods with reserved
    names that you should avoid using, as they are built in into JavaScript:


    | Array | Date | eval | function | hasOwnProperty |

    | Infinity | isFinite | isNaN | isPrototypeOf | length |

    | Math | NaN | name | Number | Object |

    | prototype | String | toString | undefined | valueOf |


    You should also keep in mind that JavaScript is often used with Java, and so it
    is very important to avoid using some of the Java reserved words. Similar to windows
    reserved'
