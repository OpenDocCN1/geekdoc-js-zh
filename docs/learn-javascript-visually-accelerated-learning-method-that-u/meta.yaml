    All HTML elements and attributes are nodes in the Document Object Model (DOM).
    Take a look at the following HTML code as a starting point:


    ```

    1. <html>

    2.   <head>

    3.     <title>The title</title>

    4.   </head>

    5.   <body>

    6.     The body

    7.   </body>

    8. </html>

    ```


    The DOM node tree will look like this:

    HTML tags are element nodes in the DOM tree, and pieces of text become text nodes.
    In the graph, you get the HTML node with its two children, HEAD and BODY, from
    which only HEAD has a child tag.


    The idea of the Document Object Model is that every node is an object and its
    properties can be changed with CSS code. You can also change the content of the
    nodes by searching the DOM for the target node and create new elements to be inserted
    on the fly. To be able to do this, you first need to know what the DOM looks like
    and what it contains. Once you know that, then you can begin with your DOM manipulation.
    This is something that you will learn in the next chapter.'
